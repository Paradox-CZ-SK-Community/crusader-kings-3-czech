 SETTINGS_CATEGORY_UI: "Rozhraní"
 SETTINGS_CATEGORY_GAME: "Hra"
 SETTING_TEXTURE_QUALITY: "Kvalita textur"
 SETTING_TEXTURE_QUALITY_TOOLTIP: "#T $SETTING_TEXTURE_QUALITY$#!\nUrčuje rozlišení načítaných textur.\n\nNižší nastavení může zvýšit výkon."
 SETTING_QUALITY: "Přednastavení kvality"
 SETTING_SFX: "Zvukové efekty"
 SETTING_UI: "Rozhraní"
 SETTING_QUALITY_TOOLTIP: "#T $SETTING_QUALITY$\n#!Vyber přednastavení níže uvedených pokročilých grafických možností.\n\nNízké přednastavení zvýší výkon."
 SETTING_BLOOM_TOOLTIP: "#T $SETTING_BLOOM$\n#!Zapíná efekt bloom, při kterém se velmi jasné světlo rozlévá do okolních částí obrazu.\n\nVypnutí této možnosti může zvýšit výkon."
 SETTING_DOF_TOOLTIP: "#T $SETTING_DOF$\n#!Zapíná hloubku ostrosti simulující objektiv fotoaparátu, která rozostřuje části obrazu mimo rovinu zaostření.\n\nVypnutí této možnosti může zvýšit výkon."
 SETTING_LENS_FLARE_TOOLTIP: "#T $SETTING_LENS_FLARE$\n#!Zapíná efekt odlesků objektivu, který se objevuje ve velmi jasných oblastech. Aby se efekt zobrazil, musí být zapnutý bloom. \n\nVypnutí této možnosti může zvýšit výkon."
 SETTING_SECONDARY_LENS_FLARE_TOOLTIP: "#T $SETTING_SECONDARY_LENS_FLARE$\n#!Zapíná sekundární efekt odlesků objektivu, který se objevuje ve velmi jasných oblastech. Aby se efekt zobrazil, musí být zapnutý bloom. \n\nVypnutí této možnosti může zvýšit výkon."
 SETTING_MAP_SSAO_TOOLTIP: "#T $SETTING_MAP_SSAO$\n#!Určuje, zda se má na mapu použít ambientní okluze v prostoru obrazovky.\n\nVypnutí této možnosti může zvýšit výkon."
 SETTING_REFRACTION_TOOLTIP: "Určuje, zda se má na vodě zobrazovat lom světla."
 SETTING_REFRACTION_QUALITY_TOOLTIP: "#T $SETTING_REFRACTION_QUALITY$#!\nUrčuje kvalitu lomu světla na vodě, pokud je zapnutý.\n\nNižší nastavení může zvýšit výkon."
 SETTING_MAPOBJECT_QUALITY_TOOLTIP: "#T $SETTING_MAPOBJECT_QUALITY$#!\nUrčuje nejvyšší úroveň kvality objektů na mapě, například budov.\n\nNižší nastavení může zvýšit výkon."
 SETTING_MESH_LOD_BIAS_TOOLTIP: "#T $SETTING_MESH_LOD_BIAS$#!\nUrčuje kvalitu úrovní detailu (LOD) objektů na mapě, například modelů jednotek.\n\nNižší nastavení může zvýšit výkon."
 SETTING_MESH_LOD_FADE_TOOLTIP: "#T $SETTING_MESH_LOD_FADE$\n#!Je-li tato možnost zapnutá, 3D modely při přibližování a oddalování plynule přecházejí mezi různými úrovněmi detailu (LOD).\n\nVypnutí této možnosti může zvýšit výkon."
 SETTING_PROVINCE_NAMES_TOOLTIP: "Určuje, jak se na mapě zobrazují názvy měst a provincií."
 SETTING_FILL_IN_IMPASSABLE_TERRAIN_TOOLTIP: "Určuje, zda má být neprůchodný terén na mapě zahrnut do hranic států."
 SETTING_LANGUAGE_TOOLTIP: "#T $SETTING_LANGUAGE$#!\nUrčuje jazyk uživatelského rozhraní."
