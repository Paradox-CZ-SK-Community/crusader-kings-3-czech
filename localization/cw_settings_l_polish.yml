 SETTING_AUDIO_OPTION_NIGHTMODE_TOOLTIP: "#T $SETTING_AUDIO_OPTION_NIGHTMODE$\n#!Zjemňuje zvuk pro hraní v noci, tlumí vyšší frekvence a komprimuje dynamický rozsah."
 SETTING_MUSIC_DENSITY: "Intenzita hudby"
 SETTING_MUSIC_DENSITY_TOOLTIP: "Určuje poměr mezi celými skladbami, tichem a hudebními pasážemi dokreslujícími atmosféru.\n\nIntenzivní = Převážně skladby přehrávané jedna za druhou, podobně jako u „rádiové stanice“.\nVyvážená = Ideální rovnováha mezi skladbami, tichem a hudbou dokreslující atmosféru\nUvolněná = Převážně klidné hudební pasáže, které lépe dotvářejí atmosféru a po několika hodinách hraní působí méně opakovaně"
 SETTING_AUTOSAVE: "Interval automatického ukládání"
 SETTING_AUTOSAVE_TOOLTIP: "#T $SETTING_AUTOSAVE$\n#!Nastavuje, jak často se hra automaticky ukládá."
 SETTING_AUTOSAVE_TO_CLOUD_TOOLTIP: "Určuje, zda se mají automaticky uložené hry ukládat do cloudu."
 SETTING_CAMERA_FACE_NORTH_TOOLTIP: "Určuje, zda má kamera vždy směřovat k severu."
 NO_AUTOSAVE: "Bez autoukládání"
 SETTINGS_FILE_TRANSFER_SPEED: "Rychlost přenosu souborů"
 SETTINGS_FILE_TRANSFER_SPEED_TOOLTIP: "#T $SETTINGS_FILE_TRANSFER_SPEED$\n#!Nastavuje maximální rychlost přenosu souborů uložených her v lobby hry více hráčů.\n\nNižší nastavení může zlepšit stabilitu sítě při připojování ke hrám více hráčů, ale prodlouží dobu načítání hry více hráčů.\n\nMaximální rychlost určuje hostitel hry více hráčů.\n"
