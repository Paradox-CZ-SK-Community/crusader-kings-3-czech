 OPTION_UPSCALE_DLSS: "NVIDIA DLSS"
 OPTION_UPSCALE_XESS: "Intel® XeSS"
 SETTING_UPSCALE_QUALITY: "Kvalita upscalingu"
 OPTION_UPSCALE_QUALITY_ULTRA_QUALITY: "Ultra kvalita"
 OPTION_UPSCALE_QUALITY_QUALITY: "Kvalita"
 OPTION_UPSCALE_QUALITY_BALANCED: "Vyvážená"
 OPTION_UPSCALE_QUALITY_PERFORMANCE: "Výkon"
 OPTION_UPSCALE_QUALITY_ULTRA_PERFORMANCE: "Ultra výkon"
 SETTING_ANISOTROPIC_FILTERING: "Filtrování textur"
 SETTING_ANISOTROPIC_FILTERING_TOOLTIP: "#T $SETTING_ANISOTROPIC_FILTERING$\n#!Použití anizotropního filtrování zlepší vzhled povrchů s texturami.\n\nNižší nastavení může zvýšit výkon."
 SETTING_FULLSCREEN_RESOLUTION: "Rozlišení"
 SETTING_FULLSCREEN_RESOLUTION_TOOLTIP: "#T $SETTING_FULLSCREEN_RESOLUTION$\n#!Nastavuje rozlišení obrazu hry.\n\nNižší rozlišení může zvýšit výkon.\n\n#X Rozlišení hry s nepodporovaným poměrem stran může způsobit, že se části rozhraní zobrazí mimo obrazovku#!"
 SETTING_WINDOWED_RESOLUTION: "Rozlišení v okně"
 SETTING_WINDOWED_RESOLUTION_TOOLTIP: "#T $SETTING_WINDOWED_RESOLUTION$\n#!Nastavuje rozlišení herního okna, pokud hra běží v režimu okna.\n\nMusí být ve formátu #b ČÍSLO#!x#b ČÍSLO#!.\n\n#X Rozlišení hry s nepodporovaným poměrem stran může způsobit, že se části rozhraní zobrazí mimo obrazovku#!"
 SETTING_RENDER_SCALE: "Měřítko vykreslování"
 SETTING_RENDER_SCALE_TOOLTIP: "#T $SETTING_RENDER_SCALE$#!\nUrčuje měřítko vykreslovacího rozlišení hry vůči hlavnímu rozlišení, s výjimkou uživatelského rozhraní.\n\nNižší nastavení může zvýšit výkon, ale sníží celkovou kvalitu obrazu. Hodnoty nad 100 % mohou kvalitu obrazu zvýšit, ale pravděpodobně sníží výkon."
 SETTING_RENDER_SCALE_FORMAT: "$VALUE|%0$"
 SETTING_DISPLAY: "Monitor"
 SETTING_DISPLAY_TOOLTIP: "#T $SETTING_DISPLAY$\n#!Pokud má počítač více monitorů, vyber ten, který má hra používat."
 SETTING_GRAPHICS_DEVICE: "Grafická karta"
 SETTING_GRAPHICS_DEVICE_TOOLTIP: "#T $SETTING_GRAPHICS_DEVICE$\n#!Určuje, kterou grafickou kartu bude hra používat. \n\nPoužití integrované grafické karty nebo softwarového vykreslování může snížit výkon."
 SETTING_SHADOW_MAP_RESOLUTION: "Kvalita stínů"
 SETTING_SHADOW_MAP_RESOLUTION_TOOLTIP: "#T $SETTING_SHADOW_MAP_RESOLUTION$\n#!Určuje rozlišení, ve kterém se vykreslují stínové mapy, pokud jsou stíny zapnuté.\n\nNižší nastavení může zvýšit výkon."
 SETTING_DISPLAY_MODE: "Režim zobrazení"
 SETTING_DISPLAY_MODE_TOOLTIP: "#T $SETTING_DISPLAY_MODE$\n#!Určuje, jak se má hra zobrazovat na obrazovce"
 SETTING_BLOOM: "Bloom"
 SETTING_MESH_LOD_BIAS: "Kvalita LOD modelů"
