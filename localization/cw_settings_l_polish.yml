 SETTING_RENDERER: "Vykreslovací rozhraní"
 SETTING_RENDERER_TOOLTIP: "Určuje, které vykreslovací rozhraní se používá."
 SETTING_VSYNC: "VSync"
 SETTING_VSYNC_TOOLTIP: "#T $SETTING_VSYNC$\n#!Synchronizuje snímkovou frekvenci hry s obnovovací frekvencí monitoru a omezuje tak trhání obrazu.\n\nVypnutí této možnosti může zvýšit výkon."
 SETTING_PORTRAIT_MULTI_SAMPLING: "Multisampling portrétů"
 SETTING_PORTRAIT_MULTI_SAMPLING_TOOLTIP: "#T $SETTING_PORTRAIT_MULTI_SAMPLING$\n#!Používá multisampling pro Alpha-To-Coverage, aby bylo prolínání vlasů plynulejší.\n\nNižší nastavení zvyšuje výkon."
 SETTING_MULTI_SAMPLING: "Vyhlazování hran (MSAA)"
 SETTING_MULTI_SAMPLING_TOOLTIP: "#T $SETTING_MULTI_SAMPLING$\n#!Použití vícenásobného vzorkování pro vyhlazování hran (MSAA) zajistí hladší okraje obrazu.\n\nNižší nastavení může zvýšit výkon."
 SETTING_ANTI_ALIASING: "Vyhlazování hran"
 SETTING_ANTI_ALIASING_TOOLTIP: "#T $SETTING_ANTI_ALIASING$\n#!Použití vyhlazování hran zajistí hladší okraje obrazu.\n\nDoporučuje se FXAA."
