 OPTION_FULLSCREEN_TOOLTIP: "#T $OPTION_FULLSCREEN$\n#!Zobrazí hru přes celou obrazovku. Nastavení rozlišení určuje ostrost obrazu."
 OPTION_WINDOWED: "Okno"
 OPTION_WINDOWED_TOOLTIP: "#T $OPTION_WINDOWED$\n#!Zobrazí hru v okně. Nastavení rozlišení určuje velikost okna."
