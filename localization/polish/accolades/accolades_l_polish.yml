 idealist_attribute.unlock_tt: "Kterýkoli z těchto:\n$EFFECT_LIST_BULLET$[Concept('acclaimed_knight','Uznávaný rytíř')|E] je [GetTrait('compassionate').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[Concept('acclaimed_knight','Uznávaný rytíř')|E] je [GetTrait('forgiving').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[Concept('acclaimed_knight','Uznávaný rytíř')|E] je [GetTrait('generous').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[Concept('acclaimed_knight','Uznávaný rytíř')|E] je [GetTrait('trusting').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Může se stát dostupným pro [Concept('acclaimed_knight','uznávaného rytíře')|E] poté, co #high you#! propustíte [Concept('prisoner','vězeň')|E] bez podmínek" # todo: CONCEPT CASE
 accolade_idealist_unlock.t: "Propustění zajatce inspiruje [idealist.GetName]"
