 activity_carnival_desc: "Potěšte a pobavte své občany uspořádáním oslnivého karnevalu! Dopřejte sobě i svým subjektům příležitost odložit hodnost i společenské rozdíly a ztratit se v maškarním veselí, zábavě a jídle!\n\nVšichni budou dychtivě slavit dějiny a kulturu vaší republiky. Je to skvělá příležitost ukázat své bohatství a vzbudit závist soupeřů, nebo se nepozorovaně vmísit mezi davy a poznat jejich bezprostřední myšlenky a starosti." # todo: NEW TRANSLATION
 activity_carnival_host_desc: "$BULLET_WITH_TAB$Můžete získat [prestige_i][Concept('prestige','prestiže')|E]\n$BULLET_WITH_TAB$Můžete získat [piety_i][Concept('piety','zbožnosti')|E]\n$BULLET_WITH_TAB$Účastníci si mohou zlepšit mínění o ostatních [Concept('activity_guest_short_possessive','hostů')|E] [opinion_i|E] [Concept('opinion','mínění')|E]\n$BULLET_WITH_TAB$Účastníci mohou ztratit [stress_loss_i][Concept('stress','stresu')|E]\n$BULLET_WITH_TAB$Může se zvýšit [Concept('control_i','@control_icon!')|E] [Concept('control','kontroly')|E] v [Concept('county','hrabství')|E]\n$BULLET_WITH_TAB$Může se zvýšit [Concept('prosperity_i','@prosperity_icon!')|E] [Concept('prosperity','rozkvětu')|E] v [Concept('county','hrabství')|E]\n$BULLET_WITH_TAB$Může se zlepšit [Concept('popular_opinion_i','@popular_opinion_icon!')|E] [Concept('popular_opinion','lidového mínění')|E]\n" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 activity_carnival_guest_help_text: "Karneval je skvělou příležitostí najít nové nadané prosté lidi, navázat obchodní kontakty nebo si jednoduše snížit [stress_loss_i][Concept('stress','stresu')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 activity_carnival_province_desc: "Uspořádáte karneval v [ROOT.Province.GetName]." # todo: NEW TRANSLATION
 activity_carnival_guest_desc: "$BULLET_WITH_TAB$ Účastníci mohou získat [Concept('prestige','prestiž')|E]\n$BULLET_WITH_TAB$ Účastníci mohou zlepšit své [Concept('opinion','mínění')|E] o ostatních účastnících\n$BULLET_WITH_TAB$ Účastníci mohou ztratit [stress_loss_i][Concept('stress','stresu')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 activity_carnival_conclusion_desc: "[GetActivityType( 'activity_carnival' ).GetName] skončil." # todo: NEW TRANSLATION
 activity_carnival_selection_tooltip: "Potěšte svůj lid maškarním veselím\n\nOčekávané odměny:\n$BULLET_WITH_TAB$[Concept('prestige_i','@prestige_icon!')|E] [Concept('prestige','Prestiž')|E]\n$BULLET_WITH_TAB$[Concept('piety_i','[GetLocalPlayerPietyTextIcon]')|E] [Concept('piety','Zbožnost')|E]\n$BULLET_WITH_TAB$[Concept('stress_loss_i','@stress_loss_icon!')|E] [Concept('stress_loss','Úbytek stresu')|E]\n$BULLET_WITH_TAB$[Concept('opinion_i','@opinion_icon!')|E] [Concept('opinion','Mínění')|E]\n$BULLET_WITH_TAB$[Concept('control_i','@control_icon!')|E] [Concept('control','Kontrola')|E]\n$BULLET_WITH_TAB$[Concept('prosperity_i','@prosperity_icon!')|E] [Concept('prosperity','Rozkvět')|E]\n$BULLET_WITH_TAB$[Concept('popular_opinion_i','@popular_opinion_icon!')|E] [Concept('popular_opinion','Lidové mínění')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
