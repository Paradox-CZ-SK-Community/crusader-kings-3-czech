 carnival.1111.t: "Slepá ulička" # todo: NEW TRANSLATION
 carnival.1111.desc: "Zápasím s jedním z vrahů, když v krku ucítím bolest — jeho společník mě bodl zezadu. Padám k zemi. Z končetin mi uniká síla a z mých roztřesených rtů vycházejí krvavé bubliny." # todo: NEW TRANSLATION
 carnival.1111.a: "Takhle to skončit nemělo." # todo: NEW TRANSLATION
