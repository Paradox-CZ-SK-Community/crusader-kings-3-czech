 carnival.1020.murder_horse.log: "[carnival_main.GetShortUIName] [Select_CString(carnival_main.IsFemale,'srazila','srazil')] [murder_victim.Custom('CZ_ShortUIName_A')] s [Select_CString(carnival_main.IsFemale,'jejím','jeho')] válečným koněm [carnival_main.Custom('WarhorseStoryName')]" # todo: NEW TRANSLATION
