l_polish:
 carnival.1001.t: "Čas úžasů" # todo: NEW TRANSLATION
 carnival.1001.desc: "Přípravy jsou u konce.\n\nBulváry lemují pestrobarevné prapory a průvody se vinou uličkami a ulicemi [carnival_location.GetName]. Na náměstích se shromažďují davy — bohatí i chudí, oškliví i krásní, v tomto moři maskovaných tváří jsme si všichni rovni.\n\nTo bude podívaná!" # todo: NEW TRANSLATION
 carnival.1001.a: "Je čas nasadit si masku. [Glossary( '#bold Carnis levare!#!', 'carnival_GLOSS' )]" # todo: NEW TRANSLATION
 carnival.1001.b: "Tak mě teď najděte, vrahové!" # todo: NEW TRANSLATION
 carnival.1001.c: "Maska skryje nedostatky i jizvy…" # todo: NEW TRANSLATION
 carnival.1002.t: "Zpátky do všedních dní" # todo: NEW TRANSLATION
 carnival.1002.desc: "Ulice jsou poseté zbytky karnevalu; odhozené masky a výzdoba zaplňují žlaby, zatímco se veselící lidé vlečou domů. Odložili jsme své rozdíly stranou, hodovali, tančili, hráli hry a společně se smáli jako jedno město.\n\nKouzlo karnevalu ještě nějakou dobu zůstane ve vzduchu a bude nám připomínat, jací jsme. Pak se ale vrátíme k běžnému životu, hierarchii, lopotě a povinnostem — až do dalšího karnevalu." # todo: NEW TRANSLATION
 carnival.1002.a: "Čas vrátit se k práci." # todo: NEW TRANSLATION
 carnival.1002.b: "Co kdyby takový mohl být každý den?" # todo: NEW TRANSLATION
 carnival.1002.c: "Je příjemné vrátit se k řádu." # todo: NEW TRANSLATION
 carnival.1003.t: "Příležitost k rošťárně" # todo: NEW TRANSLATION
 carnival.1003.desc: "Při návštěvě okázalého sídla rodu [house_target.GetDynastyHouseName] vidím nádherné závěsy z [house_target.Custom('RegionalFabric')], stovky [house_target.GetCurrentLocation.Custom('get_region_flower_type_plural')], spousty služebnictva a [house_target.GetName], jak poučuje [Select_CString(house_target.IsFemale,'její','jeho')] klienty — dostávám chuť všechny trochu pokořit.\n\nTaková rošťárna přece k duchu karnevalu patří, nebo ne?\n\nMěl bych tajně najmout pár výtržníků, aby:" # todo: NEW TRANSLATION
 carnival.1003.a: "Házeli shnilá vejce na [house_target.GetFirstNameNoTooltip]!" # todo: NEW TRANSLATION
 carnival.1003.b: "Rabovali [Select_CString(house_target.IsFemale,'její','jeho')] palác převlečení za ďábly." # todo: NEW TRANSLATION
 carnival.1003.c: "Pomazali bulváry neslušnými obrázky [Select_CString(house_target.IsFemale,'její','jeho')] rodiny." # todo: NEW TRANSLATION
 carnival.1003.d: "Když o tom tak přemýšlím, raději ne." # todo: NEW TRANSLATION
 carnival.1003.tt.reclusive_toast: "[house_member.GetShortUIName] se příliš stydí vyjít ven" # todo: NEW TRANSLATION
 carnival.1003.tt.lunatic_toast: "[house_member.GetShortUIName] ztrácí [Select_CString(house_member.IsFemale,'její','jeho')] rozum" # todo: NEW TRANSLATION
 carnival.1003.tt.irritable_toast: "[house_member.GetShortUINamePossessive] krev vře" # todo: NEW TRANSLATION
 carnival.1003.throw_eggs_log_title: "Zasypáni vejci" # todo: NEW TRANSLATION
 carnival.1003.throw_eggs_log: "Sídlo rodu [house_target.GetDynastyHouseName] bylo zasypáno vejci" # todo: NEW TRANSLATION
 carnival.1003.mischief.insanity.log_title: "Ďábelská vzpoura" # todo: NEW TRANSLATION
 carnival.1003.mischief.insanity.log: "Vzbouření hrdlořezů převlečených za ďábly přivedlo [house_member.GetShortUIName] ke ztrátě [Select_CString(house_member.IsFemale,'jejímu','jeho')] rozumu" # todo: NEW TRANSLATION
 carnival.1003.mischief.irritable.log_title: "Ďábelská vzpoura" # todo: NEW TRANSLATION
 carnival.1003.mischief.irritable.log: "Vzbouření hrdlořezů převlečených za ďábly zanechalo [house_member.Custom('CZ_ShortUIName_A')] rozhněvaného a podrážděného na všechny kolem" # todo: NEW TRANSLATION
 carnival.1003.mischief.reclusive.log_title: "Ďábelská vzpoura" # todo: NEW TRANSLATION
 carnival.1003.mischief.reclusive.log: "Vzbouření hrdlořezů převlečených za ďábly přimělo [house_member.Custom('CZ_ShortUIName_A')] skrývat se" # todo: NEW TRANSLATION
 carnival.1004.t: "Vztahy mezi rody" # todo: NEW TRANSLATION
 carnival.1004.desc: "Rozdělené město dlouho nevydrží, a tak bych měl navázat spojenectví s mocnými rody zapojenými do politiky [carnival_location.GetName].\n\nBěhem hostiny si beru stranou [other_house_leader01.GetName] a snažím se mu ukázat výhody dobrých vztahů mezi mým rodem [ROOT.Char.GetDynastyHouseName] a rodem [other_house_leader01.GetHerHis] [other_house_leader01.GetDynastyHouseName]." # todo: NEW TRANSLATION
 carnival.1004.a: "Naše účetní knihy jsou plné a kapsy hluboké!" # todo: NEW TRANSLATION
 carnival.1004.b: "Obchodní spolupráce prospěje nám oběma." # todo: NEW TRANSLATION
 carnival.1004.c: "Váš rod je hluboko pod úrovní rodu [ROOT.Char.GetDynastyHouseNameNoTooltip]." # todo: NEW TRANSLATION
 carnival.1004.d: "Vztah mezi našimi rody by měl zůstat stejný." # todo: NEW TRANSLATION
 carnival.1005.t: "Žertík na přítele" # todo: NEW TRANSLATION
 carnival.1005.desc: "Karneval je ideální příležitostí provést příteli nějaký žertík — samozřejmě v dobrém.\n\nVidím svého přítele [friend.GetName], jak hovoří s [bystander.GetName], a hned mě napadá několik zábavných možností!" # todo: NEW TRANSLATION
 carnival.1005.a: "Vyzvat je oba na souboj dřevěnou holí!" # todo: NEW TRANSLATION
 carnival.1005.b: "V přestrojení vrazit do [friend.GetHerHim] a mluvit smyšleným jazykem." # todo: NEW TRANSLATION
 carnival.1005.c: "Zasypu je pomalovanými skořápkami naplněnými parfémem!" # todo: NEW TRANSLATION
 carnival.1005.d: "Ne. Neměl bych svůj smysl pro humor vnucovat ostatním." # todo: NEW TRANSLATION
 carnival.1005.tt.stick_success.desc: "Užiješ si zábavný souboj s holemi" # todo: NEW TRANSLATION
 carnival.1005.tt.stick_failure.desc: "Při dovádění to přeženeš" # todo: NEW TRANSLATION
 carnival.1005.tt.success.desc: "Všichni se smějí tvému žertíku" # todo: NEW TRANSLATION
 carnival.1005.tt.failure.desc: "Tvé oběti ti říkají nudný osel" # todo: NEW TRANSLATION
 carnival.1005.tt.disguise_success.desc: "Pobavíš své publikum" # todo: NEW TRANSLATION
 carnival.1005.tt.disguise_failure.desc: "Zmátneš a rozčílíš své publikum." # todo: NEW TRANSLATION
 carnival.1005.tt.success.toast: "Všichni se smáli tvému žertíku" # todo: NEW TRANSLATION
 carnival.1005.tt.failure.toast: "Tvé oběti ti říkaly nudný osel" # todo: NEW TRANSLATION
 carnival.1005.tt.egg_success.toast: "Tvého přítele voňavé překvapení nadchlo" # todo: NEW TRANSLATION
 carnival.1005.tt.egg_failure.toast: "Tvému příteli ten zápach vadil." # todo: NEW TRANSLATION
 carnival.1006.t: "Umělci" # todo: NEW TRANSLATION
 carnival.1006.desc: "Karneval je vrcholnou sezónou pro umělce všeho druhu. Naslouchám talentované skupině hudebníků, kteří vyprávějí příběhy hlasem, veršem i nástroji." # todo: NEW TRANSLATION
 carnival.1006.a: "Zaplatím hudebníkům, aby zpívali o mé velikosti!" # todo: NEW TRANSLATION
 carnival.1006.b: "Nechám prostředníka, aby z nich naverboval ty nejlepší." # todo: NEW TRANSLATION
 carnival.1006.c: "Měl bych si vyžádat oblíbenou melodii." # todo: NEW TRANSLATION
 carnival.1006.d: "Pozvu blízkého [dancer_character.GetWomanMan] k tanci!" # todo: NEW TRANSLATION
 cooltip.carnival.1006.bawdy_song.tt: "Vyžádáš si oplzlou píseň" # todo: NEW TRANSLATION
 cooltip.carnival.1006.patriotic_song.tt: "Vyžádáš si píseň o [Glossary( '#bold Patria!#!', 'carnival_patria_GLOSS' )]" # todo: NEW TRANSLATION
 cooltip.carnival.1006.spiritual_song.tt: "Vyžádáš si duchovní píseň" # todo: NEW TRANSLATION
 carnival.1006.tt.dance_success.desc: "[dancer_character.GetWomanMan] přijme pozvání k tanci" # todo: NEW TRANSLATION
 carnival.1006.tt.dance_failure.desc: "[dancer_character.GetWomanMan] odmítne pozvání k tanci" # todo: NEW TRANSLATION
 carnival.1006.tt.dance_success.toast: "Tančíš s [dancer_character.GetFirstNameNoTooltip]" # todo: NEW TRANSLATION
 carnival.1006.tt.dance_failure.toast: "[dancer_character.GetFirstNameNoTooltip] s tebou odmítne tančit." # todo: NEW TRANSLATION
 carnival.1006.bawdy_song.tt.toast: "Zazněla oplzlá píseň!" # todo: NEW TRANSLATION
 carnival.1006.patriotic_song.tt.toast: "Zazněla píseň o [Glossary( '#bold Patria!#!', 'carnival_patria_GLOSS' )]!" # todo: NEW TRANSLATION
 carnival.1006.spiritual_song.tt.toast: "Zazněla duchovní píseň!" # todo: NEW TRANSLATION
 carnival.1006.recruit_entertainer.log_title: "Naverbovaný umělec" # todo: NEW TRANSLATION
 carnival.1006.recruit_entertainer.log: "[carnival_main.GetFirstNameNoTooltip] naverboval [entertainer_character.GetFirstNameNoTooltip]" # todo: NEW TRANSLATION
 carnival.1007.t: "Učení žonglování" # todo: NEW TRANSLATION
 carnival.1007.desc: "Pouliční muzikanti, žongléři a šašci baví lidi na bulváru v [carnival_location.GetName]. Zvlášť žongléři mě zaujali. Je těžké neobdivovat, jak dokážou ovládat nože a míče vznášející se ve vzduchu.\n\nJeden z žonglérů předstoupí a zeptá se, zda si to nechci zkusit jen tak pro radost.\n\n„Jeden, dva, nebo tři míče — kolik jich dokážete udržet ve vzduchu, [ROOT.Char.Custom('MistressMaster')]?“" # todo: NEW TRANSLATION
 carnival.1007.a: "Vsadím se s kýmkoli, že udržím ve vzduchu tři míče!" # todo: NEW TRANSLATION
 carnival.1007.b: "Dva míče bohatě stačí." # todo: NEW TRANSLATION
 carnival.1007.c: "Co takhle dva z těch nožů?" # todo: NEW TRANSLATION
 carnival.1007.d: "Nebudu se ponižovat takovými hloupostmi." # todo: NEW TRANSLATION
 carnival.1007.juggling_success.tt.toast: "Úspěšně žongluješ" # todo: NEW TRANSLATION
 carnival.1007.juggling_fail.tt.toast: "Upustíš míče" # todo: NEW TRANSLATION
 carnival.1007.juggling_athletic.tt.toast: "Žonglování je dobrý způsob, jak trénovat tělo i smysly" # todo: NEW TRANSLATION
 carnival.1007.juggling_k.success.tt.toast: "Úspěšně žongluješ s noži" # todo: NEW TRANSLATION
 carnival.1007.juggling_k.fail.tt.toast: "Při žonglování s noži se pořezáš" # todo: NEW TRANSLATION
 carnival.1007.blademaster.log_title: "Záliba v čepelích" # todo: NEW TRANSLATION
 carnival.1007.blademaster.log: "[carnival_main.GetFirstNameNoTooltip] si po žonglování s noži oblíbil hru s ostrými čepelemi" # todo: NEW TRANSLATION
 carnival.1008.t: "Divoký tanec" # todo: NEW TRANSLATION
 carnival.1008.desc: "Ústřední náměstí je mořem maskovaných tanečníků a hudba se mísí se smíchem. Cizinci se setkávají a zase rozcházejí, zatímco se taneční partneři v točivém tanci střídají.\n\nKdyž stojím na kraji náměstí, ta atmosféra je nakažlivá!" # todo: NEW TRANSLATION
 carnival.1008.a: "„Zlatem odměním nejlepší tanečníky!“" # todo: NEW TRANSLATION
 carnival.1008.b: "TANČIT, TANČIT — dokud mi nohy nevypoví službu!" # todo: NEW TRANSLATION
 carnival.1008.c: "Nechám se tancem vést, kamkoli mě zavede." # todo: NEW TRANSLATION
 carnival.1008.d: "Prostě si užiju tu chvíli." # todo: NEW TRANSLATION
 carnival.1008.strong.tt.toast: "Taneční nohy" # todo: NEW TRANSLATION
 carnival.1008.exhausted.tt.toast: "Tanec tě vyčerpal!" # todo: NEW TRANSLATION
 carnival.1008.hurt.tt.toast: "Při tanci se zraníš!" # todo: NEW TRANSLATION
 carnival.1009.t: "Přípitek s mistrem [craftsman_character.Custom('CraftsmanDescOption')]" # todo: NEW TRANSLATION
 carnival.1009.desc: "V jedné z vyhlášených hospod v ulici [craftsman_character.Custom('CraftsmanDescOption')|l]ů se dávám do řeči s mistrem řemeslníkem.\n\n" # todo: NEW TRANSLATION
 carnival.1009.1_a.desc: "[craftsman_character.GetSheHe|U] je v šoku, že se osobně setkal s [carnival_host.GetTitleAsNameNoTooltip]." # todo: NEW TRANSLATION
 carnival.1009.1_b.desc: "Bezpečně [Select_CString(ROOT.Char.IsFemale,'skrytá','skrytý')] pod maskou jsem si jistý, že [craftsman_character.GetSheHe] netuší, kdo jsem." # todo: NEW TRANSLATION
 carnival.1009.2_a.desc: "Se zájmem naslouchám, jak si [craftsman_character.GetSheHe] stěžuje na špatné vedení města a viní [carnival_host.GetTitleAsNameNoTooltip] ze stavu [Select_CString(craftsman_character.IsFemale,'její','jeho')] řemesla." # todo: NEW TRANSLATION
 carnival.1009.2_b.desc: "Se zájmem naslouchám, jak [craftsman_character.GetSheHe] chválí [carnival_host.GetTitleAsNameNoTooltip] za dobré vedení města a připíjí na [Select_CString(carnival_host.IsFemale,'její','jeho')] zdraví." # todo: NEW TRANSLATION
 carnival.1009.2_c.desc: "[craftsman_character.GetSheHe|l] je s dobrým vedením města nadmíru spokojen a zahrnuje mě chválou." # todo: NEW TRANSLATION
 carnival.1009.2_d.desc: "[craftsman_character.GetSheHe|U] zmlkne a pak zasmušile prohlásí, že poslední dobou je to trochu těžké." # todo: NEW TRANSLATION
 carnival.1009.a: "Vezmu si to k srdci a zdvojnásobím své úsilí." # todo: NEW TRANSLATION
 carnival.1009.b: "Pošlu stráže, aby si na tomhle ničemovi udělaly příklad." # todo: NEW TRANSLATION
 carnival.1009.c: "„Tak si to vyřiďte sám, rádce!“" # todo: NEW TRANSLATION
 carnival.1009.d: "Musím odhalit, kdo jsem, a slíbit, že se budu o město lépe starat." # todo: NEW TRANSLATION
 carnival.1009.e: "První upřímná chvála, kterou jsem za celé měsíce slyšel." # todo: NEW TRANSLATION
 carnival.1009.f: "Já to věděl! Nemusím si dělat starosti se záležitostmi města." # todo: NEW TRANSLATION
 carnival.1009.g: "Přesně podle očekávání. Měl bych si na svou počest nechat postavit sochu." # todo: NEW TRANSLATION
 carnival.1009.h: "Přesvědč [craftsman_character.Custom('CraftsmanDescOption')], aby řekl, co si myslí" # todo: NEW TRANSLATION
 carnival.1009.i: "„Příteli, naši republiku podkopávají skryté síly.“" # todo: NEW TRANSLATION
 carnival.1009.j: "„Copak si za všechnu tu tvrdou práci nezasloužím odměnu?“" # todo: NEW TRANSLATION
 carnival.1009.k: "„Za naše štěstí může celá republika!“" # todo: NEW TRANSLATION
 carnival.1009.l: "Přikývnu a dál hltám svůj [ROOT.Char.Custom('RegionalDrink')]." # todo: NEW TRANSLATION
 carnival.1009.m: "Nepřišel jsem sem tlachat, ale bojovat!" # todo: NEW TRANSLATION
 carnival.1009.n: "„Nauč mě něco o svém řemesle, dobrý [craftsman_character.Custom('CraftsmanDescOption')|l]!“" # todo: NEW TRANSLATION
 carnival.1009.o: "Získej mistra prostřednictvím prostředníka." # todo: NEW TRANSLATION
 carnival.1009.p: "„Dnes platím já, příteli.“" # todo: NEW TRANSLATION
 custom.carnival.1009.spreading_ill_rumors: "Každý [Concept('courtier','dvořan')|E] jiné [Concept('culture','kultura')|E] nebo [Concept('faith','víra')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
