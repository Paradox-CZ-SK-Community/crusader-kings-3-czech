 carnival.1010.t: "Souboj" # todo: NEW TRANSLATION
 carnival.1010.desc: "Dva maskovaní cizinci stojí proti sobě, zatímco dav jim dělá místo, aby kolem sebe mohli kroužit — s tasenými čepelemi! Nenávist v jejich očích napovídá, že si hodlají počínat víc než jen prolít trochu krve." # todo: NEW TRANSLATION
 carnival.1010.a.desc: "\n\nZůstávám jen další maskou v davu." # todo: NEW TRANSLATION
 carnival.1010.b.desc: "Když si mě všimli, dav čeká, zda zasáhnu." # todo: NEW TRANSLATION
 carnival.1010.a: "Zavolej stráže, ať souboj přeruší." # todo: NEW TRANSLATION
 carnival.1010.b: "Přesvědč je, aby přestali." # todo: NEW TRANSLATION
 carnival.1010.c: "Přikaž jim, ať přestanou." # todo: NEW TRANSLATION
 carnival.1010.d: "Nech souboj pokračovat." # todo: NEW TRANSLATION
