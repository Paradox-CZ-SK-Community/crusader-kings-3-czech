 carnival.1019.tt.assassination_gotaway_toast: "Utečeš svým útočníkům" # todo: NEW TRANSLATION
 carnival.1019.tt.assassination_captured_toast: "Vrah [murderer_01.GetFirstNameNoTooltip] je vhozen do cely." # todo: NEW TRANSLATION
 carnival.1020.t: "Dunění kopyt" # todo: NEW TRANSLATION
 carnival.1020.desc: "Když zahlédnu [murder_victim.GetNameNoTooltip], jak odchází z hostiny, je s [murder_victim.GetHerHim] i [murder_victim.GetHerHis] [murder_victim.Custom2('RelationToMe', SCOPE.sC('bystander'))] [bystander.GetFirstNameNoTooltip].\n\nZatáhnu za otěže svého koně a čekám, až [murder_victim.GetFirstNameNoTooltip] řekne [Select_CString(murder_victim.IsFemale,'její','jeho')] sbohem hostiteli. Můj cíl netuší, jaké nebezpečí na něj dusá jen o ulici dál.\n\nJe to příhodná chvíle, ale hrozí, že ublížím i nevinným." # todo: NEW TRANSLATION
 carnival.1020.a: "Při jízdě kolem oba rozpůlím." # todo: NEW TRANSLATION
 carnival.1020.b: "Vpřed, [ROOT.Char.Custom('WarhorseStoryName')]! Poznají, že jsem [ROOT.Char.GetWomanMan], před kterým je třeba mít strach." # todo: NEW TRANSLATION
 carnival.1020.c: "Srazit [murder_victim.GetFirstNameNoTooltip] k zemi. Strašlivá nehoda." # todo: NEW TRANSLATION
 carnival.1020.d: "Pokynu mužům, které jsem najal, aby mou kořist srazili." # todo: NEW TRANSLATION
 carnival.1020.e: "Dnes ne, riziko je příliš velké." # todo: NEW TRANSLATION
 carnival.1020.tt.horse.hit.desc: "Oběť je rozdupána kopyty" # todo: NEW TRANSLATION
 carnival.1020.tt.horse.miss.desc: "Kůň mine svůj cíl" # todo: NEW TRANSLATION
 carnival.1020.tt.horse.hit.toast: "Oběť byla rozdupána kopyty" # todo: NEW TRANSLATION
 carnival.1020.tt.horse.miss.toast: "Kůň minul svůj cíl" # todo: NEW TRANSLATION
