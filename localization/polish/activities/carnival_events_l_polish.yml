 carnival.1011.t: "Štědrý hostitel" # todo: NEW TRANSLATION
 carnival.1011.desc: "Karneval je skvělou příležitostí, jak dát na odiv své bohatství a vkus a otevřít brány paláce lidu. Když o tom mluvím s [house_member01.GetFirstNameNoTooltip], přemýšlím, koho pozvat. [house_member01.GetSheHe|U] má několik dobrých návrhů. Konečné rozhodnutí je ale na mně. " # todo: NEW TRANSLATION
 carnival.1011.a: "Vyzdob celý palác, na výdajích nešetři!" # todo: NEW TRANSLATION
 carnival.1011.b: "Otevři brány chudým!" # todo: NEW TRANSLATION
 carnival.1011.c: "Pozvi jen ty nejvýznamnější hosty!" # todo: NEW TRANSLATION
 carnival.1011.d: "Omez to jen na širší rodinu." # todo: NEW TRANSLATION
 carnival.1012.t: "Loutkové divadlo" # todo: NEW TRANSLATION
 carnival.1012.desc: "Prostý lid miluje loutková divadla, u nichž se pochechtává groteskním a oplzlým hrám. Groteskní loutky, vyřezávané jako parodie všech možných lidí, smilní, bojují, hádají se a dostávají se do nejrůznějších nepravděpodobných situací.\n\nKarneval v [carnival_location.GetName] přilákal celou řadu loutkářů. Lidé je zbožňují, ale [carnival_host.GetFaith.PriestNeuterPlural] mají obavy z nízké úrovně této zábavy." # todo: NEW TRANSLATION
 carnival.1012.a: "Budu představení tajně navštěvovat." # todo: NEW TRANSLATION
 carnival.1012.b: "Podplať některého z nich, aby uvedl mou vlastní hru!" # todo: NEW TRANSLATION
 carnival.1012.c: "Budu představení navštěvovat veřejně!" # todo: NEW TRANSLATION
 carnival.1012.d: "Nenápadně zařiď, aby pořadatelé v zákulisí dostali pokárání." # todo: NEW TRANSLATION
 carnival.1012.e: "Zakáž takové vulgární výstupy." # todo: NEW TRANSLATION
 carnival.1013.t: "Výrobce masek" # todo: NEW TRANSLATION
 carnival.1013.desc: "Když procházím téměř opuštěným nádvořím, náhodou narazím na starého [mask_maker.GetWomanMan], který vyřezává masku. Vedle [mask_maker.GetHerHim] stojí stánek plný [Select_CString(mask_maker.IsFemale,'jejích','jeho')] výrobků: řada za řadou nejrůznějších masek.\n\nŘemeslné zpracování je skutečně vynikající." # todo: NEW TRANSLATION
 carnival.1013.a: "Kup všechno a rozdej to každému, koho potkám!" # todo: NEW TRANSLATION
 carnival.1013.b: "Dej výrobci masek prostředky na zřízení dílny." # todo: NEW TRANSLATION
 carnival.1013.c: "Kup si nádhernou masku." # todo: NEW TRANSLATION
 carnival.1013.d: "Kup si děsivou masku." # todo: NEW TRANSLATION
 carnival.1013.maskmaker_workshop.log_title: "Investice do dílny výrobce masek" # todo: NEW TRANSLATION
 carnival.1013.maskmaker_workshop.log: "[carnival_main.GetShortUIName] pomohl výrobci masek zřídit dílnu" # todo: NEW TRANSLATION
 carnival.1014.t: "Svatí blázni" # todo: NEW TRANSLATION
 carnival.1014.desc: "Ulicí prochází parodie na svaté procesí. Kostýmy zesměšňují kněze, mnichy, a dokonce i nejvyšší představitele naší víry! Duchovenstvu se otevřeně posmívají." # todo: NEW TRANSLATION
 carnival.1014_2.a.desc: "\n\nZůstávám [Select_CString(ROOT.Char.IsFemale,'skrytá','skrytý')] v davu." # todo: NEW TRANSLATION
 carnival.1014_2.b.desc: "\n\nLidé čekají, jak zareaguji." # todo: NEW TRANSLATION
 carnival.1014.a: "Nenápadně přivolej stráže, aby tuhle potupu rozehnaly." # todo: NEW TRANSLATION
 carnival.1014.b: "Odsuď je za jejich hříšnost!" # todo: NEW TRANSLATION
 carnival.1014.c: "Přidej se k posměškům." # todo: NEW TRANSLATION
 carnival.1014.d: "Vytrať se z davu." # todo: NEW TRANSLATION
 carnival.1014.e: "Tak moc jsem se už léta nezasmál!" # todo: NEW TRANSLATION
 cooltip.carnival.1014.non_believer: "#weak #EMP Ztráta [Concept('stress','stres')|E] díky tvému [Concept('secret','tajemství')|E] o nevíře#!#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 carnival.1014.secret.tt.toast: "Uvědomíš si, že jsi v srdci nikdy nevěřil" # todo: NEW TRANSLATION
 carnival.1014.mockery.tt.toast: "Cítíš vinu i úlevu" # todo: NEW TRANSLATION
 carnival.1015.t: "Kočka" # todo: NEW TRANSLATION
 carnival.1015.desc: "Celý večer mě sleduje malý stín. Za každým rohem na mě čekají dvě zářivé oči a chraplavé #EMP „mňau“#!.\n\n„Vypadá to, že sis [Select_CString(ROOT.Char.IsFemale,'našla','našel')] přítele,“ poznamená [observer_01.GetTitledFirstName] se smíchem, když se mi kočka znovu otře o nohu." # todo: NEW TRANSLATION
 carnival.1015.a: "Vypadá to, že to tak mělo být!" # todo: NEW TRANSLATION
 carnival.1015.b: "Jsem si jistý, že by raději zůstala s tebou." # todo: NEW TRANSLATION
 carnival.1015.c: "[family_member01.GetTitledFirstName] by uvítal společníka." # todo: NEW TRANSLATION
 carnival.1015.adopt_cat.log_title: "Adoptoval kočku" # todo: NEW TRANSLATION
 carnival.1015.adopt_cat.log: "[carnival_main.GetShortUIName] adoptoval kočku" # todo: NEW TRANSLATION
 carnival.1016.t: "Maska milence" # todo: NEW TRANSLATION
 carnival.1016.desc: "Když se procházím ulicemi [carnival_location.GetName], uprostřed bujarých oslav slyším, jak se uličkami rozléhá hudba a hostiny se z krčem přelévají do ulic. Všude se prostí lidé mísí s patriciji a maska stírá rozdíly v postavení i výsadách.\n\nNěkdo mě poklepe na rameno a za mnou stojí maskovaný [woo_character.GetWomanMan]. [woo_character.GetSheHe|U] zaujme dramatickou pózu a pak se rozesměje. Když si cizinec na okamžik odhrne masku, poznám [woo_character.GetNameNoTooltip].\n\n #EMP „Dobrý večer, můj [ROOT.Char.GetLadyLord]. Nechtěl byste se mnou strávit večer? Jen dva maskovaní cizinci, kteří si užívají karneval,“#! pronese [woo_character.GetSheHe] s přehnaně dvorní úklonou." # todo: NEW TRANSLATION
 carnival.1016.a: "To je milé překvapení! Veďte mě, #EMP „cizinče.“#!" # todo: NEW TRANSLATION
 carnival.1016.b: "Společnost #BOLD přítele#! by mi udělala radost." # todo: NEW TRANSLATION
 carnival.1016.c: "A cizinci bychom také měli zůstat." # todo: NEW TRANSLATION
 carnival.1017.t: "Ve světle svíček" # todo: NEW TRANSLATION
 carnival.1017.desc: "Najdu [intent_target.GetNameNoTooltip] v tiché krčmě. Venku bují karneval, ale uvnitř je útulno a osvětlují to tu svíčky. Když vejdu, [intent_target.GetNameNoTooltip] si čte a [intent_target.GetHerHim] čelo se soustředěně krčí.\n\nJsem si jistý, že nějaká duchaplná konverzace zaujme [intent_target.GetHerHim] mou šarmantností." # todo: NEW TRANSLATION
 carnival.1017.a: "Ohromit [intent_target.GetHerHim] svými znalostmi literatury." # todo: NEW TRANSLATION
 carnival.1017.b: "Rozveselit [intent_target.GetHerHim] duchaplným žertováním, aby zapomněl na knihu." # todo: NEW TRANSLATION
 carnival.1017.c: "Zeptat se [intent_target.GetHerHim], jestli si tu knihu mohu přečíst, až [intent_target.GetHerHim] dočte." # todo: NEW TRANSLATION
 carnival.1017.a.tt.failure.desc: "Ach, dobrá kniha pro prostého člověka." # todo: NEW TRANSLATION
 carnival.1017.a.tt.success.desc: "To mi připomíná jinou knihu." # todo: NEW TRANSLATION
 carnival.1017.b.tt.success.desc: "Odvést [Select_CString(intent_target.IsFemale,'její','jeho')] pozornost od knihy" # todo: NEW TRANSLATION
 carnival.1017.a.tt.success.toast: "Tvé rozsáhlé znalosti upoutaly pozornost [intent_target.Custom('CZ_TitledFirstName_G')]" # todo: NEW TRANSLATION
 carnival.1017.a.tt.failure.toast: "[intent_target.GetTitledFirstName] tě považoval za nudného a nabubřelého" # todo: NEW TRANSLATION
 carnival.1017.b.tt.success.toast: "[intent_target.GetTitledFirstName] úplně zapomněl na knihu" # todo: NEW TRANSLATION
 carnival.1017.b.tt.failure: "[intent_target.GetTitledFirstName] zůstává nosem zabořený ve [Select_CString(intent_target.IsFemale,'její','jeho')] knize" # todo: NEW TRANSLATION
 carnival.1017.b.tt.failure.toast: "[intent_target.GetTitledFirstName] shledal tvůj důvtip méně lákavým než [Select_CString(intent_target.IsFemale,'její','jeho')] knihu" # todo: NEW TRANSLATION
 carnival.1017.c.tt.toast: "Při hovoru o zajímavé knize jste si s [intent_target.GetTitledFirstName] začali být bližší" # todo: NEW TRANSLATION
 carnival.1018.t: "Láska a hry" # todo: NEW TRANSLATION
 carnival.1018.desc: "Na náměstí se shromáždil dav, aby sledoval soutěže v síle a dovednosti. Soutěží se v zápase, běhu i přetahování lanem a diváci hlasitě povzbuzují. Všude panuje veselá a přátelská nálada.\n\n[intent_target.GetTitledFirstName] je zřejmě ohromen předváděnou udatností. [Select_CString(intent_target.IsFemale,'její','jeho')] pohled neustále zalétá ke [contender.Custom('CZ_TitledFirstName_D')]. Chci-li si získat [Select_CString(intent_target.IsFemale,'její','jeho')] přízeň, musím nějak překonat [contender.GetHerHim]." # todo: NEW TRANSLATION
 carnival.1018.a: "Rozdrtím [contender.GetHerHim] v zápasnickém ringu!" # todo: NEW TRANSLATION
 carnival.1018.b: "Možná by [contender.GetSheHe] mohl být přesvědčen, aby zápas prohrál?" # todo: NEW TRANSLATION
 carnival.1018.c: "Zesměšním [contender.GetHerHim] před [intent_target.GetTitledFirstNameNoTooltip]" # todo: NEW TRANSLATION
 carnival.1018.d: "Do téhle soutěže se mi nechce." # todo: NEW TRANSLATION
 carnival.1018.a.success.desc: "Porazil jsi [contender.Custom('CZ_TitledFirstName_A')]" # todo: NEW TRANSLATION
 carnival.1018.a.success.toast: " [intent_target.GetTitledFirstNameNoTooltip] je ohromen tvou udatností" # todo: NEW TRANSLATION
 carnival.1018.a.failure: "Skončíš na zemi" # todo: NEW TRANSLATION
 carnival.1018.a.failure.toast: "[intent_target.GetTitledFirstNameNoTooltip] zapomene, že vůbec existuješ" # todo: NEW TRANSLATION
 carnival.1018.b.success: "Podaří se ti, aby to vypadalo opravdově" # todo: NEW TRANSLATION
 carnival.1018.b.success.toast: "[intent_target.GetTitledFirstNameNoTooltip] tě oslavuje jako šampiona" # todo: NEW TRANSLATION
 carnival.1018.b.failure: "Soutěž je očividně zinscenovaná" # todo: NEW TRANSLATION
 carnival.1018.b.failure.toast: "[intent_target.GetTitledFirstNameNoTooltip] tě označí za podvodníka" # todo: NEW TRANSLATION
 carnival.1018.c.toast: "[intent_target.GetTitledFirstNameNoTooltip] se pobaví a okouzlíš ho" # todo: NEW TRANSLATION
 carnival.1019.t: "Masky v davu" # todo: NEW TRANSLATION
 carnival.1019.desc: "V davu stále vídám tutéž masku. Když procházím ulicí, zdá se, že se mi na okraji zorného pole vznáší stále stejná nehybná tvář šklebícího se šaška. Znovu a znovu se objevuje v proudu masek. Někdo mě sleduje? Už jen ta myšlenka mi vhání led do žil.\n\nOpouštím hlavní ulici, ale maskovaní muži jdou za mnou. Jsem si jistý, že mi chtějí ublížit!" # todo: NEW TRANSLATION
 carnival.1019.a: "Připravit léčku." # todo: NEW TRANSLATION
 carnival.1019.b: "Vylákat je k oddílu stráží." # todo: NEW TRANSLATION
 carnival.1019.c: "Křičet o pomoc." # todo: NEW TRANSLATION
 cooltip.carnival.1019.tt.assassination_success: "Zabiješ svého útočníka" # todo: NEW TRANSLATION
 cooltip.carnival.1019.tt.assassination_fended: "Zraníš svého útočníka" # todo: NEW TRANSLATION
 cooltip.carnival.1019.tt.assassination_captured: "Útočník je uvězněn" # todo: NEW TRANSLATION
 cooltip.carnival.1019.tt.assassination_scream: "Tvůj křik přiměje vrahy k útěku" # todo: NEW TRANSLATION
 carnival.1019.tt.assassination_success.desc: "Usmrtíš svého útočníka" # todo: NEW TRANSLATION
 carnival.1019.tt.assassination_fended.desc: "Odrazíš svého útočníka" # todo: NEW TRANSLATION
 carnival.1019.tt.assassination_wounded.desc: "Jsi [Select_CString(ROOT.Char.IsFemale,'zraněna','zraněn')]" # todo: NEW TRANSLATION
 carnival.1019.tt.assassination_killed.desc: "Tvůj útočník tě zabije" # todo: NEW TRANSLATION
 carnival.1019.tt.assassination_gotaway.desc: "Podaří se ti uprchnout" # todo: NEW TRANSLATION
 carnival.1019.tt.assassination_cornered.desc: "Jsi zahnaný do kouta" # todo: NEW TRANSLATION
 carnival.1019.tt.assassination_captured.desc: "Stráže zajmou vraha" # todo: NEW TRANSLATION
 carnival.1019.tt.assassination_fended_toast: "Probodneš svého pronásledovatele a utečeš do uliček" # todo: NEW TRANSLATION
 carnival.1019.tt.assassination_wounded_toast: "Tvůj útočník tě zraní a zmizí zpět ve stínech" # todo: NEW TRANSLATION
