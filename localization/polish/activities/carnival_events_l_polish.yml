 carnival.1021.tt.arrow.miss.toast: "Šíp minul cíl a někdo tě spatřil!" # todo: NEW TRANSLATION
 carnival.1021.tt.thug.arrow.hit.toast: "Šíp rváče zasáhl cíl" # todo: NEW TRANSLATION
