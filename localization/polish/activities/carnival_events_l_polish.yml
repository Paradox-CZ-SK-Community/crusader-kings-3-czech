 carnival.1020.accident.log: "[murder_victim.GetShortUIName] zemřel poté, co [Select_CString(murder_victim.IsFemale,'byla','byl')] při strašlivé nehodě ušlapán koněm." # todo: NEW TRANSLATION
 carnival.1020.both_accident.log_title: "Strašlivá nehoda" # todo: NEW TRANSLATION
 carnival.1020.both_accident.log: "Při strašlivé nehodě byli [murder_victim.Custom('CZ_ShortUIName_N')] a [bystander.Custom('CZ_ShortUIName_N')] ušlapáni koněm." # todo: NEW TRANSLATION
 carnival.1020.bystander_accident.log_title: "Strašlivá nehoda" # todo: NEW TRANSLATION
 carnival.1020.bystander_accident.log: "[bystander.GetShortUIName] zemřel poté, co [Select_CString(bystander.IsFemale,'byla','byl')] při strašlivé nehodě ušlapán koněm." # todo: NEW TRANSLATION
 carnival.1020.sword.log_title: "Vražda z koňského hřbetu" # todo: NEW TRANSLATION
 carnival.1020.sword.log: "[murder_victim.Custom('CZ_ShortUIName_N')] a [bystander.Custom('CZ_ShortUIName_N')] byli jezdcem rozpůleni." # todo: NEW TRANSLATION
 carnival.1020.miss.log_title: "[murder_victim.GetShortUIName] málem sražen koněm" # todo: NEW TRANSLATION
 carnival.1020.miss.log: "[murder_victim.GetShortUIName] tvrdí, že se ho [carnival_main.GetShortUIName] pokusil [murder_victim.GetHerHim] srazit koněm: šlo o pokus o vraždu!" # todo: NEW TRANSLATION
 carnival.1021.t: "Šíp" # todo: NEW TRANSLATION
 carnival.1021.desc: "Na mém stanovišti je ticho, ruší ho jen vrzání dřeva a tlumený zvuk ulice, který sem proniká okenicemi. Dole na nádvoří můj cíl [murder_victim.GetFirstNameNoTooltip] netuší, že ho pozoruji — ani že mám po boku [SCOPE.Custom('UniqueBowOrJustBow')].\n\nPřivedl jsem s sebou najatého rváče [bandit_01.GetFirstNameNoTooltip], kdybych potřeboval další pár rukou.\n\nKdyž napínám tětivu, [murder_victim.GetFirstNameNoTooltip] vzhlédne a [Select_CString(murder_victim.IsFemale,'její','jeho')] oči začnou pátrat po oknech!" # todo: NEW TRANSLATION
 carnival.1021.a: "Vystřelit, než mě uvidí." # todo: NEW TRANSLATION
 carnival.1021.b: "[bandit_01.GetFirstNameNoTooltip], vystřel. Já zajistím únikovou cestu." # todo: NEW TRANSLATION
 carnival.1021.c: "Skrčit se. Musíme počkat na lepší příležitost." # todo: NEW TRANSLATION
 cooltip.carnival.1021.wrong.victim: "[bandit_01.GetFirstNameNoTooltip] zabije nesprávnou osobu" # todo: NEW TRANSLATION
 carnival.1021.tt.arrow.hit.desc: "Šíp zasáhne tvůj cíl" # todo: NEW TRANSLATION
 carnival.1021.tt.arrow.miss.desc: "Šíp mine a cíl tě spatří" # todo: NEW TRANSLATION
 carnival.1021.tt.thug.arrow.hit.desc: "Šíp zasáhne tvůj cíl" # todo: NEW TRANSLATION
 carnival.1021.tt.thug.arrow.miss.desc: "Šíp zasáhne nesprávný cíl" # todo: NEW TRANSLATION
