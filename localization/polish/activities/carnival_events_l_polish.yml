 carnival.1021.arrow.log: "[murder_victim.GetFirstNameNoTooltip] [Select_CString(murder_victim.IsFemale,'byla zabita','byl zabit')] šípem neznámého lučištníka" # todo: NEW TRANSLATION
 carnival.1022.t: "Vlastní průvod" # todo: NEW TRANSLATION
 carnival.1022.desc: "Karneval se platí z městské pokladny a slouží všem. Pokud však po zaplacení dostatečné zábavy zbude dost zlata, mohl by podnikavý a majetný občan ještě více podpořit nádheru našich oslav.\n\nKdybych přispěl, moji vrstevníci by na mě mohli závistivě hledět a v očích těch, kteří jsou pode mnou, bych zářil jako dávný patricij. Ano, jen si představte — velmoži starověkých městských států dávali na odiv své bohatství! Kdybych uspořádal slavný průvod, všichni by měli mé jméno na rtech!\n\n #BOLD Jaké téma ale zvolit?#!" # todo: NEW TRANSLATION
 carnival.1022.a: "Průvod, který bude #BOLD nádherný#! a oslaví mé úspěchy!" # todo: NEW TRANSLATION
 carnival.1022.b: "Zastrašující #BOLD průvod#!, který vzbudí strach a úctu!" # todo: NEW TRANSLATION
 carnival.1022.c: "#BOLD Náboženský#! průvod, který ukáže mou zbožnost!" # todo: NEW TRANSLATION
 carnival.1022.d: "Když o tom tak přemýšlím, mám lepší způsoby, jak utratit své zlato." # todo: NEW TRANSLATION
 custom.carnival.1022.guestopinion: "Každý host na karnevalu" # todo: NEW TRANSLATION
 custom.zealot_carnival.1022.guestopinion: "Každý host na karnevalu [GetVassalStance( 'zealot' ).GetTextIcon]" # todo: NEW TRANSLATION
 carnival.1023.t: "Odkaz v mramoru" # todo: NEW TRANSLATION
 carnival.1023.desc: "Od dětství slýchám příběhy o starověkých městských státech. Patricijové byli velkými mecenáši umění. Ačkoli velkolepé stavby slavné minulosti nyní leží v troskách, jejich umění a krása stále inspirují. Podporou umělců mohu povznést své jméno do této vznešené společnosti.\n\nPředstavte si: má pověst přetrvá i po smrti!\n\nAť lidé spatří krásu oděnou do mramoru, kamene a dřeva, vymalovanou všemi barvami duhy! Ke slávě [Glossary( '#bold Patria#!', 'carnival_patria_GLOSS' )], k uctění našich předků a k věhlasu rodu [ROOT.Char.GetDynastyHouseName]!" # todo: NEW TRANSLATION
 carnival.1023.a: "Sponzorovat soutěž pro mladé umělce" # todo: NEW TRANSLATION
 carnival.1023.b: "Objednat nové fresky a výzdobu veřejného náměstí." # todo: NEW TRANSLATION
 carnival.1023.c: "Objednat soubor soch znázorňujících zakladatele města." # todo: NEW TRANSLATION
 carnival.1023.d: "Počkat, umění je tak drahé!?" # todo: NEW TRANSLATION
 carnival.1024.t: "Šepot za maskou" # todo: NEW TRANSLATION
 carnival.1024.desc: "V karnevalovém víru veselí se stírají hranice a lidé ztrácejí smysl pro slušnost. Nikdy nevíte, kdo je doopravdy osoba v masce vedle vás ani na co si vzpomene.\n\n[hook_target.GetTitledFirstNameNoTooltip] se [Select_CString(hook_target.IsFemale,'oddala','oddal')] přemíře. Celý večer tančí s každým, kdo [hook_target.GetHerHis] zaujme, a jí a pije, jako by zítřek neměl přijít. Bezstarostně se směje a povídá si, aniž by se [Select_CString(ROOT.Char.IsFemale,'starala','staral')], kdo naslouchá. Tančí až na samé hranici skandálu, a vůbec si nevšímá, že ho/ji #BOLD pozoruji [Select_CString(ROOT.Char.IsFemale,'skrytá','skrytý')] za svou maskou.#!\n\n #BOLD Mohu [hook_target.GetHerHim] ušetřit ostudy, nebo toho využít a přimět [hook_target.GetHerHim], aby mi [Select_CString(hook_target.IsFemale,'byla','byl')] zavázán/a. [hook_target.GetTitledFirstNameNoTooltip]#!" # todo: NEW TRANSLATION
 carnival.1024.a: "Budu na [hook_target.GetHerHim] přátelsky dohlížet." # todo: NEW TRANSLATION
 carnival.1024.b: "Byla by škoda, kdyby někdo později použil tohle proti [hook_target.GetHerHim]." # todo: NEW TRANSLATION
 carnival.1024.c: "Raději pošlu přátelské varování [Select_CString(hook_target.IsFemale,'jejímu','jeho')] rodu." # todo: NEW TRANSLATION
 carnival.1024.d: "Nechám [hook_target.GetTitledFirstNameNoTooltip], ať si udělá [Select_CString(hook_target.IsFemale,'její','jeho')] vlastní chyby." # todo: NEW TRANSLATION
 carnival.1025.t: "Drobnosti a bájná zvířata" # todo: NEW TRANSLATION
 carnival.1025.into_desc: "Ocítám se před stánkem zahraničního obchodníka. Jsou tu vystavené podivné předměty z dalekých krajů, nemluvě o klecích s exotickými zvířaty. Zvuky a pachy tohoto zvěřince jsou opravdu pozoruhodné.\n\n„Pojďte se všichni podívat! Mám na prodej hotové divy!“ volá obchodník a ukazuje na [Select_CString(merchant_character.IsFemale,'její','jeho')] zboží.\n\n„[merchant_trinket.GetName] té nejvyšší kvality; a [merchant_creature.Custom('GetCarnival1025PitchArticle')] [merchant_creature.GetName] —" # todo: NEW TRANSLATION
 carnival_1025_creature_lion_desc: "Africká mantikora – lidožravá šelma z legend.„" # todo: NEW TRANSLATION
 carnival_1025_creature_caracal_desc: "malinký, ale zuřivý!„" # todo: NEW TRANSLATION
 carnival_1025_creature_lynx_desc: "Dokáže za pár vteřin vyběhnout na strom a jeho moč tvoří krystaly s magickými vlastnostmi!„" # todo: NEW TRANSLATION
 carnival_1025_creature_tiger_desc: "Zuřivá lidožravá šelma z perských legend!„" # todo: NEW TRANSLATION
 carnival_1025_creature_leopard_desc: "O tomto zvířeti se píše ve starověkých textech!„" # todo: NEW TRANSLATION
 carnival_1025_creature_bear_desc: "Dokáže se postavit na přední tlapy a žonglovat s kameny velkými jako lidská hlava!„" # todo: NEW TRANSLATION
 carnival_1025_creature_elephant_desc: "Stvořil ho šílený alchymista!„" # todo: NEW TRANSLATION
 carnival_1025_creature_peacock_desc: "Zrodil se z plamenů!„" # todo: NEW TRANSLATION
 carnival_1025_creature_parrot_desc: "Umí mluvit a zpívat hymny!„" # todo: NEW TRANSLATION
 carnival_1025_creature_cockatoo_desc: "Opravdu vzácný kousek!„" # todo: NEW TRANSLATION
 carnival_1025_creature_crane_desc: "Podívejte, jak půvabně se pohybuje!„" # todo: NEW TRANSLATION
 carnival_1025_creature_monkey_desc: "Přímo z pekelných jam!„" # todo: NEW TRANSLATION
 carnival.1025.a: "„Úžasné, beru tu drobnost.“" # todo: NEW TRANSLATION
 carnival.1025.b_1: "„Zázračné, pořídím si tu bestii.“" # todo: NEW TRANSLATION
 carnival.1025.b_2: "„Mám za to, že je to jen [merchant_creature.Custom('GetCarnival1025RealBeastArticle')] [merchant_creature.Custom('GetCarnival1025RealBeastName')].“" # todo: NEW TRANSLATION
