 activity_coronation_special_type_bar_segment_tt_3_progress: "[Concept('coronation_magnificence','Pompéznost')|E]: #V [ActivityWindow.GetSpecialProgressValue|0]/75#!\n"
 activity_coronation_special_type_bar_segment_tt_3_flavor: "#weak Korunovace zůstala v živé paměti a o její okázalosti i slavnostních obřadech se často hovořilo ve šlechtických síních a při dvorských shromážděních.#!"
