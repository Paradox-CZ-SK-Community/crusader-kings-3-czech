 end_the_struggle_oath_tooltip: "Zdávám [Concept('oath','přísaha')|E] #V Ukončit boj#!:\n\t$EFFECT_LIST_BULLET$Je třeba učinit některé z rozhodnutí ukončujících [Concept('struggle','sváru')|E]\n\t$EFFECT_LIST_BULLET$Musí být dokončeno do #V 20 let#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E], a [GetModifier('oath_of_end_the_struggle').GetNameWithTooltip]." # todo: CONCEPT CASE
 greatest_hunter_oath_tooltip: "Zdávám [Concept('oath','přísaha')|E] #V Stát se nejlepším lovcem#!:\n\t$EFFECT_LIST_BULLET$Je třeba uspořádat a úspěšně dokončit alespoň #V 1#! #V Legendary#! [Concept( 'activity', 'Hunt' )|E] nebo #V 10#! běžných [Concept( 'activity', 'Hunts' )|E]. Zvýšená šance na #V Legendary Sightings#! zatímco tento [Concept('oath','přísaha')|E] je aktivní.\n\t$EFFECT_LIST_BULLET$Musí být dokončeno do #V 40 Years#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E], unikátní [Concept('modifiers','modifikátory')|E] pro #V Bow#! [Concept('artifact','artefakt')|E] a [GetModifier('oath_greatest_hunter').GetNameWithTooltip]" # todo: CONCEPT CASE
 heir_preparation_oath_tooltip: "Zdávám [Concept('oath','přísaha')|E] #V Připravit dědice#!:\n\t$EFFECT_LIST_BULLET$Musíte mít [Concept('primary_heir','hlavní dědic')|E] s #V 10+#! ve všech [Concept('skills','dovedností')|E] a alespoň dvěma #V 14+#! [Concept('skills','dovednosti')|E].\n\t$EFFECT_LIST_BULLET$Musí být dokončeno do #V 40 Years#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E], a [GetModifier('oath_heir_preparation').GetNameWithTooltip]. [Concept('primary_heir','Hlavní dědic')|E] získá [GetModifier('oath_heir_preparation_heir').GetNameWithTooltip]" # todo: CONCEPT CASE
 install_claimants_oath_tooltip: "Zdávám [Concept('oath','přísaha')|E] k #V Dosazení nárokovačů#!:\n\t$EFFECT_LIST_BULLET$Musíte vyhrát nejméně #V 3#! [Concept('claimant','pretendent')|E] [Concept('wars','války')|E]\n\t$EFFECT_LIST_BULLET$Musí být dokončeno do #V 20 let#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E], [GetModifier('oath_install_claimants').GetNameWithTooltip], a [Concept('perpetual_hook','trvalá páka')|E] na každém dosazeném [Concept('claimant','pretendenta')|E] a [Concept('weak_hook','slabá páka')|E] na jejich [Concept('primary_heirs','hlavní dědici')|E]." # todo: CONCEPT CASE
 mend_the_fracture_oath_tooltip: "Zdávám [Concept('oath','přísaha')|E] k #V Zacelení rozkolu#!:\n\t$EFFECT_LIST_BULLET$Musíte mít alespoň #V 70#! [Concept('cultural_acceptance','kulturní přijetí')|E] s [Concept('culture','kulturou')|E], která tvoří více než #V 40%#! mého [Concept('realm','panství')|E].\n\t$EFFECT_LIST_BULLET$Musí být dokončeno do #V 20 let#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E], [GetModifier('oath_mend_the_fracture').GetNameWithTooltip], a obě kultury získají [GetCultureTradition('oath_mend_the_fracture_tradition').GetName] [Concept('culture_tradition','kulturní tradice')|E]." # todo: CONCEPT CASE
 provide_for_the_warriors_oath_tooltip: "Zdávám [Concept('oath','přísaha')|E] #V Postarat se o bojovníky#!:\n\t$EFFECT_LIST_BULLET$Je třeba postavit alespoň #V 3#! [GetBuilding('oath_warriors_building_02').GetName]. Během aktivního [Concept('oath','přísahy')|E] se zpřístupní tato větev [Concept('buildings','budovy')|E].\n\t$EFFECT_LIST_BULLET$Musí být dokončeno do #V 20 Years#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E], [GetModifier('oath_provide_for_the_warriors').GetNameWithTooltip], a odemkne poslední vylepšení: [GetBuilding('oath_warriors_building_04').GetName]." # todo: CONCEPT CASE
 provide_for_the_faithful_oath_tooltip: "Zdávám [Concept('oath','přísaha')|E] #V Postarat se o věrné#!:\n\t$EFFECT_LIST_BULLET$Je třeba postavit alespoň #V 3#! [GetBuilding('oath_faithful_building_02').GetName]. Během aktivního [Concept('oath','přísahy')|E] se zpřístupní tato větev [Concept('buildings','budovy')|E].\n\t$EFFECT_LIST_BULLET$Musí být dokončeno do #V 20 Years#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E], [GetModifier('oath_provide_for_the_faithful').GetNameWithTooltip], a odemkne poslední vylepšení: [GetBuilding('oath_faithful_building_04').GetName]." # todo: CONCEPT CASE
 provide_for_the_poor_oath_tooltip: "Zdávám [Concept('oath','přísaha')|E] #V Postarat se o chudé#!:\n\t$EFFECT_LIST_BULLET$Je třeba postavit alespoň #V 3#! [GetBuilding('oath_poor_building_02').GetName]. Během aktivního [Concept('oath','přísahy')|E] se zpřístupní tato větev [Concept('buildings','budovy')|E].\n\t$EFFECT_LIST_BULLET$Musí být dokončeno do #V 20 Years#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E], [GetModifier('oath_provide_for_the_poor').GetNameWithTooltip], a odemkne poslední vylepšení: [GetBuilding('oath_poor_building_04').GetName]." # todo: CONCEPT CASE
 repent_oath_tooltip: "Zdávám [Concept('oath','přísaha')|E] #V Pokání#!:\n\t$EFFECT_LIST_BULLET$Je třeba dokončit alespoň #V 4#! [Concept('pilgrimages','poutě')|E] a mít [GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]\n\t$EFFECT_LIST_BULLET$Musí být dokončeno do #V 20 Years#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E], [GetModifier('oath_of_repent').GetNameWithTooltip], a odstraní všechny [Concept('sinful','hříšného')|E] [Concept('traits','rysy')|E] a nahradí je [Concept('virtuous','ctnostný')|E] [Concept('traits','rysy')|E]." # todo: CONCEPT CASE
 coronation_events.0200.t: "Předzvěst"
 coronation_events.0200.desc.host: "Hosté přišli. Z blízka, zdaleka, z věrnosti nebo ze zvědavosti. Dav se naplňuje tvářemi poznamenanými očekáváním, kalkulem a v některých případech i nejjemnějším teplem.\n\nZvednu hlas právě tolik, aby se účastníci utišili a přivítám je na mé korunovaci."
 coronation_events.0200.desc.guest: "Shromáždění je tak veliké, jak se očekávalo. Známé i cizí tváře se mísí a slyším pozdravy právě tak vřelé, aby byly zdvořilé. Když hostitel promluví, místnost ztichne instinktem.\n\n„Přátelé, vazalové, příbuzní, vaše přítomnost mě ctí víc než jakákoli koruna. Než obřad začne, jezte, pijte, mluvte volně... a vězte, že vidím každého z vás a nebudu zapomínat, kdo dnes stál se mnou.“\n\nLaskavý slib, nebo tiché varování, podle toho, jak kdo chce slyšet."
 coronation_events.0200.a: "Vítejte, všichni!"
 coronation_events.0200.b: "A kdo tu ještě je?"
 coronation_events.0205.t: "Obřad"
 coronation_events.0205.meager: "Všechny přípravy jsou dokončeny. Skromné slavnostní shromáždění nyní čeká v"
 coronation_events.0205.great: "Všechny přípravy jsou dokončeny. Velkolepé slavnostní shromáždění nyní čeká v"
 coronation_events.0205.hagia_sophia: "Hagii Sofii, místě Boží svaté Moudrosti."
 coronation_events.0205.st_peters: "Bazilice svatého Petra, sídle Kristova hlavního vikáře."
 coronation_events.0205.saint_denis: "Bazilice svatého Diviše, hrobce patrona francouzského lidu."
 coronation_events.0205.westminster: "velebném Westminsterském opatství."
 coronation_events.0205.reims: "katedrále Panny Marie v Remeši, oné katedrále králů."
 coronation_events.0205.aachen: "proslulém paláci Karla Velikého v Cáchách."
 coronation_events.0205.wawel: "katedrále na Wawelu, krásné a věčné."
 coronation_events.0205.east_admin_location: "v poklidném tichu palácového komplexu [location.GetTitle.GetNameNoTierPossessive]."
 coronation_events.0205.temple: "[location.GetTitle.GetNameNoTierPossessive], kde je hlavní [host.GetFaith.HouseOfWorship]."
 coronation_events.0205.east_admin_description: "\n\nZa dunění velkých bubnů,"
 coronation_events.0205.silence: "\n\nV chladném tichu,"
 coronation_events.0205.cheers: "\n\nZa jásotu a nadšení,"
 coronation_events.0205.desc.host_east_asian: "můj [ROOT.Char.Custom('GetTitleTierAdjective')] průvod prochází řadou za řadou mých [host.Custom('GetFighterTermPlural')] a úředníků. Za námi zůstává rodová svatyně mé rodiny, kde byly vykonány první dnešní obřady."
 coronation_events.0205.desc.guest_east_asian: "[host.GetTitledFirstNamePossessive] [ROOT.Char.Custom('GetTitleTierAdjective')] průvod prochází řadou za řadou jeho [host.Custom('GetFighterTermPlural')] a úředníků. Za námi zůstává rodová svatyně [host.GetTitleAsNameNoTooltip], kde byly vykonány první dnešní obřady."
 coronation_events.0205.desc.host: "můj průvod se prodírá davem [ROOT.Char.Custom('SettlementCity')|l]: přede mnou jedou moji nejlepší [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')], za mnou kráčí má [ROOT.Char.Custom('GetTitleTierAdjective')] družina."
 coronation_events.0205.desc.guest: "[host.GetTitledFirstNamePossessive] průvod se prodírá davem a má družina následuje na čestném místě."
 coronation_events.0205.desc.low_magnificence_east_asian: "\n\nNad obřady visí zlý stín. Jak by se předkové rodu [host.GetDynastyHouseName] neměli stydět za tento nejistý vzestup...?"
 coronation_events.0205.desc.medium_magnificence_east_asian: "\n\nVzduch je naplněn nadějí. Dlouhé ranní uctívání vykonalo své příznivé dílo a spojilo tento obřad s dávnou minulostí."
 coronation_events.0205.desc.high_magnificence_east_asian: "\n\nRanní obřady povznesla podivuhodná úcta, nesená vůní kadidla a zrozená z jisté pýchy předků rodu [host.GetDynastyHouseName]."
 coronation_events.0205.desc.low_magnificence: "Někteří [host.Custom('GetLocalCommonerTermPlural')] na nás prázdně zírají, jiní si posměšně mumlají. Jeden vykřikne #EMP \"Falešný [host.GetTitleAsName]!\"#! a dav se dá do pohybu, přičemž jej [host.Custom('GetFighterTermPlural')] lemující cestu sotva dokáží zadržet."
 coronation_events.0205.desc.medium_magnificence: "[host.Custom('GetLocalCommonerTermPlural')|U] se tlačí, aby zahlédli budoucího [host.GetTitleAsNameNoTooltip|l]. Na ramenou rodičů se mezi zástupem usmívají děti z kultury [location.GetCulture.GetName]."
 coronation_events.0205.desc.high_magnificence: "Zní rohy! Vlajky vlají v odvážných [host.GetPrimaryTitle.GetAdjective]ch barvách! [host.Custom('GetLocalCommonerTermPlural')|U] oslavují [host.GetTitleAsNameNoTooltip|l] a ženy pláčou blahem při tomto slavnostním průvodu."
 coronation_events.0205.a_low_magnificence_east_admin: "Ani přízeň živých, ani mrtvých..."
 coronation_events.0205.a_low_magnificence: "[ROOT.Char.GetFaith.HighGodName], veď mě skrze tuto chátru..."
 coronation_events.0205.a_high_magnificence: "A má korunovace #EMP teprve začíná!#!"
 coronation_events.0205.a: "Největší okamžik se blíží."
 coronation_events.0205.b: "Tento [ROOT.Char.GetTitleAsNameNoTooltip|l] musí být děsivý pohled..."
 coronation_events.0205.b_flavor_infirm: "...sotva v [ROOT.Char.GetHerHim] zbývá život, aby dojel na svou korunovaci."
 coronation_events.0205.b_improved: "Ale naštěstí si toho v takové nádheře málokdo všimne!"
 coronation_events.0205.c_low_magnificence_east_admin: "Ti, kdo mají oči, vědí své!"
 coronation_events.0205.c_low_magnificence: "Dívejte se lépe, bídáci! Jsem každým coulem [activity.GetHost.GetTitleAsNameNoTooltip|l]."
 coronation_events.0205.c: "Jsem ztělesněním velkého [activity.GetHost.GetTitleAsNameNoTooltip|l]!"
 coronation_events.0205.d: "Nyní uvidíme, jakou má [activity.GetHost.GetTitleAsNameNoTooltip|l] pravou hodnotu."
 coronation_events.0205.e_east_admin: "Lesk mincí obnoví přízeň dne!"
 coronation_events.0205.e: "Lesk mincí obnoví dnešní nádheru."
 coronation_events.0205.e.tt: "Je přiveden [ROOT.Char.CustomFixedRandom('GetKnightErrantAnimal')], oděný v látce ze zlata, z každé fontány teče [ROOT.Char.CustomFixedRandom('GetExpensiveDrink_Singular')]; hudebníci sedící před pavilonem zpívají o tvé slávě."
 coronation_events.0205.e.toast: "[host.GetShortUIName] [Select_CString(host.IsFemale,'nešetřila','nešetřil')] na obřadu"
 coronation_events.0205.f_east_admin: "#EMP Musím#! promluvit k tomuto shromáždění."
 coronation_events.0205.f: "Lid ví, kdo je jejich [ROOT.Char.GetTitleAsNameNoTooltip]."
 coronation_events.0205.f.tt: "Předneseš lidu skutečně strhující řeč."
 coronation_events.0205.f.success: "Publikum je ohromeno"
 coronation_events.0205.f.failure: "Tvé úsilí vyjde nazmar"
 coronation_events.0205.f.toast: "[host.GetShortUIName] pronesl strhující řeč"
 coronation_events.0210.t: "Hostina"
 coronation_events.0210.desc.host: "Obřad je dokončen: všechny [ROOT.Char.Custom('GetTitleTierAdjective')] pocty mi byly uděleny. Povstávám znovu, ne abych sliboval či rozkazoval, nýbrž abych nabídl bohaté požitky.\n\n„Naplňte tyto stoly. Zvedněte poháry a ať si tento sál pamatuje radost i povinnost.“\n\nShromáždění, vyhladovělé po dlouhém bdění nad složitými obřady, zabručelo souhlasem. Zatím alespoň má každý před sebou něco jiného než já."
 coronation_events.0210.desc.guest: "Protokolární úkony skončily a s nimi i klid, který držel shromáždění na místě. Několik šepotů se zvedá, když se hostitel znovu postaví, tentokrát aby označil konec obřadu a začátek něčeho uvolněnějšího.\n\n[host.GetTitleAsName] zvedá [Select_CString(host.IsFemale,'její','jeho')] hlas právě tolik, aby byl slyšet: „Přátelé, obřady jsou dokončeny. Naplňte stoly, zvedněte poháry a ať si tento sál pamatuje radost stejně jako povinnost.“\n\nSlova jsou dobře přijata a s každým okamžikem se [ROOT.Char.Custom('GetTitleTierAdjective')] shromáždění mění v čím dál živější oslavu."
 coronation_events.0210.a: "Konečně trochu jídla!"
 coronation_events.0210.b: "Konečně, obřad je u konce."
 coronation_events.0300.t: "Ctihodné postavení"
 coronation_events.0300.desc: "Než může korunovace pokračovat, musím rozhodnout, kdo bude předsedat svatým rituálům. Chci‑li získat přízeň [ROOT.Char.GetFaith.AltPriestTermPlural|U], bylo by moudré nechat jednoho z jejich řad obřad vykonat, čímž by mu byla udělena ta posvátnost a požehnání, které mohou poskytnout jen oni.\n\nPřesto si část mě klade otázku: nebylo by to působivější, kdybych korunu vzal do svých vlastních rukou a před všemi, bez prostředníka, vyhlásil své právo vládnout?"
 coronation_events.0300.a: "[chaplain.GetFirstNameNoTooltip] je jediný, kdo to může udělat."
 coronation_events_0300_a_tooltip: "[chaplain.GetFirstName] bude vést obřad"
 coronation_events.0300.b: "Možná [alternative_1.GetFirstNameNoTooltip]?"
 coronation_events_0300_b_tooltip: "[alternative_1.GetFirstName] bude vést obřad"
 coronation_events.0300.c: "Mám důvěru v [alternative_2.GetFirstNameNoTooltip]."
 coronation_events_0300_c_tooltip: "[alternative_2.GetFirstName] bude vést obřad"
 coronation_events.0300.d: "Je to čest, která může připadnout pouze mně."
 coronation_events_0300_d_tooltip: "#high Vy#! budete vést obřad"
 coronation_events_0300_d_tooltip_effect: "#high Vy#! získáte @prestige_icon![Concept('prestige','prestiž')|E], ale ztratíte @opinion_icon![Concept('opinion','mínění')|E] u vašeho [Concept('court_chaplain','dvorního kaplana')|E] a u [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName|U] [vassalů|E] v závislosti na [Concept('coronation','korunovaci')|E] [Concept('coronation_magnificence','pompéznost')|E]" # todo: CONCEPT CASE
 coronation_events_0300_d_tooltip_effect_hof: "#high Vy#! získáte @prestige_icon![Concept('prestige','prestiž')|E], ale ztratíte @opinion_icon![Concept('opinion','mínění')|E] u vašeho [Concept('head_of_faith','hlavy víry')|E] a u [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName|U] [vassalů|E] v závislosti na [Concept('coronation','korunovaci')|E] [Concept('coronation_magnificence','pompéznost')|E]" # todo: CONCEPT CASE
 coronation_events.0301.t: "Smrt vedoucího obřadu"
 coronation_events.0301.desc: "Vykonavatel mé korunovace, můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('dead_officiator'))] [dead_officiator.GetFirstName], [dead_officiator.GetDeathReason]. [Select_CString(dead_officiator.IsFemale,'Její','Jeho')] místo zůstává prázdné a posvátný rituál nedokončen.\n\n[first_candidate.GetFirstName], vážený [first_candidate.GetFaith.GetAdherentName] [first_candidate.GetFaith.PriestNeuter], vystupuje vpřed. „[first_candidate.GetFaith.HighGodName] neochabuje se smrtí jedné duše,“ říká [first_candidate.GetSheHe] vážně. „Pokud to chcete, dokončím rituál.“"
 coronation_events.0301.a: "Svatý [ROOT.Char.Custom('GetCatholicSaint')], svěř [Select_CString(dead_officiator.IsFemale,'její','jeho')] duši [ROOT.Char.GetFaith.PositiveAfterLife]."
 coronation_events.0301.a.tooltip: "[first_candidate.GetFirstNameNoTooltip] bude nový vykonavatel obřadu"
