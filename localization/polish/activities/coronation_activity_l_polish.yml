 activity_coronation_special_type_bar_segment_tt_1_effects: "[CoronationRewardProgress('(CFixedPoint)25', 'activity_coronation_special_type_bar_segment_tt_1_progress')]$BULLET$Odměna za [Concept('oath','přísahu')|E] v podobě [legitimacy_i][Concept('legitimacy','legitimity')|E] a [prestige_i][Concept('prestige','prestiže')|E]: #P +25%#!\n$BULLET$Zisk [Concept('opinion','mínění')|E] u [Concept('vassal','vazala')|E], který je [Concept('guest','hostem')|E] a odpovídá záměru: #P +5#!\n"
 activity_coronation_special_type_bar_segment_tt_1_progress: "[Concept('coronation_magnificence','Pompéznost')|E]: #V [ActivityWindow.GetSpecialProgressValue|0]/25#!\n"
 activity_coronation_special_type_bar_segment_tt_1_flavor: "#weak Po skončení dne o skromném obřadu mluvil jen málokdo. Nikoho neurazil, ale ani nikoho neuchvátil.#!"
 activity_coronation_special_type_bar_segment_tt_2: "#T Důstojná korunovace#!\n$activity_coronation_special_type_bar_segment_tt_2_effects$\n$activity_coronation_special_type_bar_segment_tt_2_flavor$"
 activity_coronation_special_type_bar_segment_tt_2_effects: "[CoronationRewardProgress('(CFixedPoint)50', 'activity_coronation_special_type_bar_segment_tt_2_progress')]$BULLET$Odměna za aktivitu v podobě [legitimacy_i][Concept('legitimacy','legitimity')|E] a [prestige_i][Concept('prestige','prestiže')|E]: #P +50%#!\n$BULLET$Odměna za [Concept('oath','přísahu')|E] v podobě [legitimacy_i][Concept('legitimacy','legitimity')|E] a [prestige_i][Concept('prestige','prestiže')|E]: #P +50%#!\n$BULLET$Zisk [Concept('opinion','mínění')|E] u [Concept('vassal','vazala')|E], který je [Concept('guest','hostem')|E] a odpovídá záměru: #P +10#!\n"
 activity_coronation_special_type_bar_segment_tt_2_progress: "[Concept('coronation_magnificence','Pompéznost')|E]: #V [ActivityWindow.GetSpecialProgressValue|0]/50#!\n"
 activity_coronation_special_type_bar_segment_tt_2_flavor: "#weak Na korunovaci se vzpomínalo s uměřenou chválou jako na obřad hodný panovníka, byť ne takový, o němž by se skládaly písně.#!"
 activity_coronation_special_type_bar_segment_tt_3: "#T Velkolepá korunovace#!\n$activity_coronation_special_type_bar_segment_tt_3_effects$\n$activity_coronation_special_type_bar_segment_tt_3_flavor$"
