 martial_oath_2_tooltip: "Zdávám [Concept('oath','přísaha')|E] #V Rozšířit říši#!:\n\t$EFFECT_LIST_BULLET$[Concept('realm','panství')|E] musí mít alespoň velikost [host.MakeScope.ScriptValue('oath_conquest_value_1')|V0] #low (aktuálně [host.MakeScope.ScriptValue('oath_conquest_value_2')|V0])#!\n$EFFECT_LIST_BULLET$Musí být dokončeno do #V 20 let#!\n$EFFECT_LIST_BULLET$Vyberte mezi bonusem pro [Concept('capital','hlavní sídlo')|E] a [Concept('de_jure','de iure')|E] přesunem [Concept('titles','tituly')|E]\n$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E], a [GetModifier('oath_of_conquest').GetNameWithTooltip]" # todo: CONCEPT CASE
