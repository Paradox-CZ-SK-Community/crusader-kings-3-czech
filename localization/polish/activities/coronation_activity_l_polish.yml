 already_better_coronation: "Již pomazán"
 already_coronated_trigger: "Již korunován"
 coronation_no_crown_trigger: "Požadováno: koruna [Concept('artifact','artefakt')|E]" # todo: CONCEPT CASE
 coronation_no_regalia_trigger: "Požadováno: regálie [Concept('artifact','artefakt')|E]" # todo: CONCEPT CASE
