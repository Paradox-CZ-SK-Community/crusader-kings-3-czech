l_polish:
 activity_coronation: "Korunovace"
 activity_coronation_host_desc: "$BULLET_WITH_TAB$@law_icon![GetLaw('crowned_king').GetName] nebo [GetLaw('crowned_emperor').GetName] [Concept('law','zákon')|El]\n$BULLET_WITH_TAB$Dokud korunovace trvá, @faction_icon![Concept('factions','frakce')|El] nemohou vymáhat požadavky\n$BULLET_WITH_TAB$[opinion_i][Concept('opinion','Mínění')|E]\n$BULLET_WITH_TAB$[prestige_i][Concept('prestige','Prestiž')|E]\n$BULLET_WITH_TAB$[legitimacy_i][Concept('legitimacy','Legitimita')|E]\n$BULLET_WITH_TAB$Silnou [Concept('oath','přísahu')|E]\n\n@warning_icon! #X @faction_icon![Concept('factions','Frakce')|E] a další nepřátelé poškodí [Concept('coronation_magnificence','pompéznost')|El] korunovace.#!" # todo: CONCEPT CASE
 activity_coronation_guest_desc: "$BULLET_WITH_TAB$Účastníci mohou získat [opinion_i][Concept('opinion','mínění')|E] o ostatních účastnících\n$BULLET_WITH_TAB$Účastníci mohou získat jedinečné příležitosti založené na jejich [Concept('intent','záměr')|E]" # todo: CONCEPT CASE
 activity_coronation_desc: "Pozvěte veliké a mocné z říše, aby byli svědky vašeho nástupu na trůn. To položí základy dlouhého a úspěšného panování."
 activity_coronation_conclusion_desc: "[GetActivityType( 'activity_coronation' ).GetName] byla ukončena."
 activity_coronation_selection_tooltip: "Pozvěte veliké a mocné z říše, aby byli svědky vašeho nástupu na trůn. To položí základy dlouhého a úspěšného panování.\n\nOčekávané odměny:\n$activity_coronation_host_desc$"
 activity_coronation_destination_selection: "\n[Concept('coronation','Korunovace')|E] se obvykle musí konat v [Concept('realm','panství')|E] [Concept('host','hostiteli')|E], s výjimkou [Concept('anointments','pomazáním')|E], které se mohou konat v zemích [Concept('head_of_faith','hlavě víry')|E], pokud drží vhodné [Concept('holy_sites','svatá místa')|E]." # todo: CONCEPT CASE
 activity_coronation_guest_help_text: "Korunovace je skvělou příležitostí k budování vazeb a k zapůsobení na [Concept('vassals','vazaly')|E] i další [Concept('rulers','vládci')|E].\n\nKaždý host, který se zúčastní korunovace, bude mít příležitosti zvýšit [Concept('opinion','mínění')|E] ostatních hostů a může získat zvláštní možnosti interakce s [Concept('host','hostitelem')|E] [Concept('activity','aktivitou')|E]." # todo: CONCEPT CASE
 invite_to_activity_flavor_coronation: "Srdečně jste pozváni, abyste se ke mně a ostatním v říši dostavili do [ROOT.Char.GetCurrentLocation.Custom('GetCoronationSitePrefix')][ROOT.Char.GetCurrentLocation.Custom('GetCoronationSite')] na mou nadcházející korunovaci."
 activity_coronation_underage_tt: "Nejsi #bold dost starý#! — musí ti být alespoň #V 12# let\n#flavor Koruna ti sklouzne z hlavičky#!"
 activity_coronation_not_approved_anointment: "[GetPlayer.GetFaith.GetReligiousHead.GetTitledFirstName] tuto [anointment|E] [Select_CString(GetPlayer.GetFaith.GetReligiousHead.IsFemale,'neschválila','neschválil')], vyžádejte si u [GetPlayer.GetFaith.GetReligiousHead.GetHerHis] schválení pomocí [request_anointment|E] [Concept('interaction','interakce')|E]" # todo: CONCEPT CASE
 activity_coronation_province_desc: "Korunovace se bude konat v [ROOT.Province.GetName]"
 activity_coronation_capital_province: "\n#p + Hlavní město#!"
 activity_coronation_holy_site_province: "\n#p + Svaté místo#!"
 activity_coronation_tradition_province: "\n#p + Tradiční korunovační místo#!"
 activity_coronation_long_tradition_province: "\n#p ++ Tradiční korunovační místo#!"
 activity_coronation_ancient_tradition_province: "\n#p +++ Tradiční korunovační místo#!"
 coronation_location_owned: "Nenachází se v [Concept('realm','panství')|E]" # todo: CONCEPT CASE
 coronation_location_hof_owned: "[THIS.Province.GetName] je #bol ne#! [Concept('holy_site','svaté místo')|E] v [Concept('realm','panství')|E] vašeho [Concept('head_of_faith','hlavě víry')|E]" # todo: CONCEPT CASE
 coronation_location_holy_site_host: "[THIS.Province.GetName] je #bol ne#! [Concept('holy_site','svaté místo')|E] ve vašem [Concept('realm','panství')|E] (váš [Concept('head_of_faith','hlava víry')|E] nevlastní žádné [Concept('holy_site','svaté místo')|E])" # todo: CONCEPT CASE
 coronation_location_neither_capital_nor_holy_site: "[THIS.Province.GetName] je #bol ne#! [Concept('county_capital','hlavní sídlo hrabství')|E] ani [Concept('holy_site','svaté místo')|E]" # todo: CONCEPT CASE
 coronation_phase_preparations: "Přípravy"
 coronation_phase_preparations_desc: ""
 coronation_phase_coronation: "Obřad"
 coronation_phase_coronation_desc: ""
 coronation_phase_feast: "Hostina"
 coronation_phase_feast_desc: ""
 coronation_type_normal: "Korunovace"
 coronation_type_normal_desc: "$BULLET_WITH_TAB$Prokázat svou [legitimacy_i][Concept('legitimacy','legitimitu')|E]\n$BULLET_WITH_TAB$Složit [Concept('oath','přísaha')|E] a zavázat směr své vlády\n$BULLET_WITH_TAB$Můžete získat [opinion_i][Concept('opinion','mínění')|E] u [Concept('vassals','vazalů')|E] [AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'coronation_type_tributaries' )]\n$BULLET_WITH_TAB$[Concept('vassals','Vazalové')|E] mohou opustit @faction_icon![Concept('factions','frakce')|E]\n$BULLET_WITH_TAB$Můžete se korunovat pro dodatečné [prestige_i][Concept('prestige','prestiže')|E]\n\n#weak $coronation_type_normal_flavor$#!" # todo: CONCEPT CASE
 coronation_type_normal_flavor: "Důstojný obřad prokáže oprávněnost vašeho panování a majestát říše bude vaším suverénním rouchem."
 coronation_type_tributaries: "a [Concept('tributaries','tributáři')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 coronation_type_anointment: "Pomazání"
 coronation_type_anointment_desc: "$BULLET_WITH_TAB$Dokažte svou [legitimacy_i][Concept('legitimacy','legitimitu')|E] bez jakýchkoli pochyb\n$BULLET_WITH_TAB$Získejte [piety_i][Concept('piety','zbožnost')|E], @fervor_icon![Concept('fervor','horlivost')|E] a přízeň [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName|U] [Concept('vassals','vazalové')|E]\n$BULLET_WITH_TAB$Přisáhněte [Concept('oath','přísaha')|E] a stanovte směr svého panování\n$BULLET_WITH_TAB$Získejte [opinion_i][Concept('opinion','mínění')|E] u [Concept('vassals','vazalů')|E]\n$BULLET_WITH_TAB$Získejte [opinion_i][Concept('opinion','mínění')|E] u ostatních [Concept('rulers','vládců')|E]\n$BULLET_WITH_TAB$[Concept('vassals','Vazalové')|E] mohou opustit @faction_icon![Concept('factions','frakce')|E]\n$BULLET_WITH_TAB$@alert_icon! #alert_trial Musí se konat ve [Concept('holy_site','svatém místě')|E] vaší [Concept('faith','víře')|E]#!\n\n#weak $coronation_type_anointment_flavor$#!" # todo: CONCEPT CASE
 coronation_type_anointment_flavor: "Pravý panovník musí být zahalen v posvátném úmyslu a ustaven božskou přízní. Světská síla není náhradou."
 anointment_minimum: "[Concept('activity_option','Možnost aktivity')|E] není dostupná pro [anointment|E]" # todo: CONCEPT CASE
 ceremony_size: "Velikost obřadu"
 coronation_small_ceremony: "Jednoduché obřady"
 coronation_small_ceremony_desc: "$EFFECT_LIST_BULLET$Snížená [Concept('coronation_magnificence','pompéznost')|E]\n$EFFECT_LIST_BULLET$Zahraniční [Concept('rulers','vládci')|E] se [Concept('activity','aktivitou')|E] nezúčastní\n$EFFECT_LIST_BULLET$Pokud bude [Concept('coronation_magnificence','pompéznost')|E] na konci nižší než #high 50#!, získáte [GetModifier('ach_coronation_low_ceremony_modifier').GetNameWithTooltip] na #high 10 let#!\n\n#weak Já už jsem přeci panovník, ne? Proč svolávat všechna království kvůli této pouhé formalitě...?#!" # todo: CONCEPT CASE
 coronation_medium_ceremony: "Časem ověřená nádhera"
 coronation_medium_ceremony_desc: "$EFFECT_LIST_BULLET$Zvýšené [Concept('coronation_magnificence','pompéznost')|E]\n$EFFECT_LIST_BULLET$[Concept('activity_guests','Hosté aktivity')|E] budou o něco pravděpodobněji ochotni připojit se\n\n#weak Posvátné přísahy vlády musejí být doprovázeny královským prostředím a rozsáhlým, uctivým shromážděním.#!" # todo: CONCEPT CASE
 coronation_large_ceremony: "Sláva a nádhera"
 coronation_large_ceremony_desc: "$EFFECT_LIST_BULLET$Výrazně zvýšené [Concept('coronation_magnificence','pompéznost')|E]\n$EFFECT_LIST_BULLET$[Concept('activity_guests','Hosté aktivity')|E] budou výrazně pravděpodobněji ochotni připojit se\n\n#weak Mezi posvátnými relikviemi a třpytivými klenoty, prostoupenými nádhernou hudbou, budou všichni moji příbuzní, moji vazalové a prestižní hosté z daleka.#!" # todo: CONCEPT CASE
 ceremony_feast_type: "Oslavy"
 ceremony_feast_type_austere: "Skromné obřady"
 ceremony_feast_type_austere_desc: "$EFFECT_LIST_BULLET$Snížené [Concept('coronation_magnificence','pompéznost')|E]\n$EFFECT_LIST_BULLET$Pokud bude [Concept('coronation_magnificence','pompéznost')|E] na konci nižší než #high 50#!, získáte [SelectLocalization( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'mandala_coronation_low_feast', 'generic_coronation_low_feast' )] na #high 10 let#!\n\n#weak Není pozvání na tuto historickou událost samo o sobě dostatečným potěšením...?#!" # todo: CONCEPT CASE
 generic_coronation_low_feast: "[GetModifier('ach_coronation_low_feast_modifier').GetNameWithTooltip]" # todo: NEW TRANSLATION
 mandala_coronation_low_feast: "[GetModifier('mandala_coronation_low_feast_modifier').GetNameWithTooltip]" # todo: NEW TRANSLATION
 ceremony_feast_type_regular: "Náležité veselí"
 ceremony_feast_type_regular_desc: "$EFFECT_LIST_BULLET$Zvýšené [Concept('coronation_magnificence','pompéznost')|E]\n\n#weak Nebude se šetřit na velkém shromáždění šlechty ani na výtečných pokrmech po obřadu.#!" # todo: CONCEPT CASE
 ceremony_feast_type_lavish: "Okázalé hostiny"
 ceremony_feast_type_lavish_desc: "$EFFECT_LIST_BULLET$Výrazně zvýšené [Concept('coronation_magnificence','pompéznost')|E]\n$EFFECT_LIST_BULLET$Snížené riziko negativních událostí\n\n#weak Čekají nekonečné chody voňavých lahůdek; velkolepé požitky, jež obohatí panovníkův hlavní stůl.#!" # todo: CONCEPT CASE
 ach_coronation_low_ceremony_modifier: "Korunován v anonymitě"
 ach_coronation_low_ceremony_modifier_desc: "Lid sotva tuší, že je tento vladař skutečně jejich pán, a šlechta rychle zapomíná na jeho skromné inaugurační obřady."
 ach_coronation_low_feast_modifier: "Pohrdaná šlechta"
 ach_coronation_low_feast_modifier_desc: "Pohrdavé a skromné oslavy při korunovaci zanechaly účastníky přetékající opovržením a bez vybraných dobrot."
 mandala_coronation_low_feast_modifier: "Pohrdaní poddaní" # todo: NEW TRANSLATION
 mandala_coronation_low_feast_modifier_desc: "$ach_coronation_low_feast_modifier_desc$" # todo: NEW TRANSLATION
 coronation_hof_guest: "Hlava víry"
 coronation_hof_guest_desc: "$coronation_hof_guest_desc_for_host$"
 coronation_hof_guest_for_host: "Hlava víry"
 coronation_hof_guest_desc_for_host: "Při [anointment|E] musí být [Concept('head_of_faith','hlava víry')|E] [Concept('activity_guest','host aktivity')|E], aby bylo pomazání považováno za [Concept('legitimate','legitimní')|E].\n\nZajistěte podporu [Concept('head_of_faith','hlavu víry')|E] pomocí [Concept('anointment_request','žádosti o pomazání')|E] [Concept('interaction','interakce')|E]." # todo: CONCEPT CASE
 doctrine_coronation_name: "Tradice korunovace"
 doctrine_no_anointment_name: "Bez pomazání"
 doctrine_no_anointment_desc: "V této víře žádný posvátný olej nedotýká čela vladařů — jejich cesta k moci vede bez pomazání či bohoslužby."
 doctrine_anointment_permitted_name: "Pomazání povoleno"
 doctrine_anointment_permitted_desc: "I císaři nepodléhají jedinému rituálu — Hlava víry může předsedat, avšak volba korunovace leží na samotném trůnu."
 doctrine_imperial_anointment_name: "Císařské pomazání"
 doctrine_imperial_anointment_desc: "Aby bylo panování císaře nezpochybnitelné, musí pokleknout — pouze Hlava víry může udělit tu konečnou, nepřekročitelnou autoritu."
 doctrine_parameter_no_anointment: "[Concept('characters','Postavy')|E] nemají přístup k [Concept('coronation_anointment','pomazání')|E] [Concept('activity_option','možnosti aktivity')|E]" # todo: CONCEPT CASE
 doctrine_parameter_theocratic_coronation: "[Concept('characters','Postavy')|E] mají přístup k [Concept('coronation_anointment','pomazání')|E] [Concept('activity_option','možnosti aktivity')|E]" # todo: CONCEPT CASE
 doctrine_parameter_imperial_anointment: "[Concept('characters','Postavy')|E] [Concept('empire','Říše')|E] [Concept('title_tier','Úroveň')|E] nebo vyšší musí použít [Concept('coronation_anointment','pomazání')|E] [Concept('activity_option','možnost aktivity')|E], aby získali [GetLaw('crowned_emperor').GetName] [Concept('law','zákon')|E]" # todo: CONCEPT CASE
 doctrine_parameter_coronation_artifact: "[Concept('characters','Postavy')|E] této [Concept('faith','víře')|E] musí mít [FAITH.Custom('CoronationRequiresArtifact')] [Concept('artifact','artefakt')|E], aby získali přístup k dalším [Concept('activity_options','možnostem aktivity')|E]" # todo: RETRANSLATED ENGLISH # todo: CONCEPT CASE
