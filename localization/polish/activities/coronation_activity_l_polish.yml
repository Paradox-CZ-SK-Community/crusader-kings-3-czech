 purge_pretenders_oath_default: "Získáš [GetLaw('single_heir_succession_law').GetName]. Po tvé smrti se [Concept('law','zákon')|E] vrátí k tomu, který máš nyní."
 end_the_struggle_oath_tooltip: "Skládám [Concept('oath','přísahu')|E], že #V ukončím svár#!:\n\t$EFFECT_LIST_BULLET$Musíš přijmout kterékoli [Concept('decisions','rozhodnutí')|E] ukončující [Concept('struggle','svár')|E]\n\t$EFFECT_LIST_BULLET$Musí být splněno do #V 20 let#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E] a [GetModifier('oath_of_end_the_struggle').GetNameWithTooltip]."
 greatest_hunter_oath_tooltip: "Skládám [Concept('oath','přísahu')|E], že se #V stanu největším lovcem#!:\n\t$EFFECT_LIST_BULLET$Musíš uspořádat a úspěšně dokončit alespoň #V 1#! #V legendární#! [Concept( 'activity', 'lov' )|E] nebo #V 10#! běžných [Concept( 'activity', 'lovů' )|E]. Dokud je tato [Concept('oath','přísaha')|E] aktivní, zvyšuje se šance na #V legendární pozorování zvěře#!.\n\t$EFFECT_LIST_BULLET$Musí být splněno do #V 40 let#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E], jedinečné [Concept('modifiers','modifikátory')|E] pro #V Luk#! jako [Concept('artifact','artefakt')|E] a [GetModifier('oath_greatest_hunter').GetNameWithTooltip]"
 heir_preparation_oath_tooltip: "Skládám [Concept('oath','přísahu')|E], že #V připravím dědice#!:\n\t$EFFECT_LIST_BULLET$Musíš mít [Concept('primary_heir','hlavního dědice')|E] se všemi [Concept('skills','dovednostmi')|E] alespoň #V 10#! a nejméně dvěma [Concept('skills','dovednostmi')|E] alespoň #V 14#!.\n\t$EFFECT_LIST_BULLET$Musí být splněno do #V 40 let#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E] a [GetModifier('oath_heir_preparation').GetNameWithTooltip]. [Concept('primary_heir','Hlavní dědic')|E] získá [GetModifier('oath_heir_preparation_heir').GetNameWithTooltip]"
 install_claimants_oath_tooltip: "Skládám [Concept('oath','přísahu')|E], že #V dosadím pretendenty#!:\n\t$EFFECT_LIST_BULLET$Musíš vyhrát alespoň #V 3#! [Concept('wars','války')|E] za [Concept('claimant','pretendenta')|E]\n\t$EFFECT_LIST_BULLET$Musí být splněno do #V 20 let#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E], [GetModifier('oath_install_claimants').GetNameWithTooltip], [Concept('perpetual_hook','trvalá páka')|E] na každého dosazeného [Concept('claimant','pretendenta')|E] a [Concept('weak_hook','slabá páka')|E] na jejich [Concept('primary_heirs','hlavní dědice')|E]."
 mend_the_fracture_oath_tooltip: "Skládám [Concept('oath','přísahu')|E], že #V zacelím rozkol#!:\n\t$EFFECT_LIST_BULLET$Musíš mít alespoň #V 70#! [Concept('cultural_acceptance','kulturního přijetí')|E] s [Concept('culture','kulturou')|E], která tvoří více než #V 40%#! tvého [Concept('realm','panství')|E].\n\t$EFFECT_LIST_BULLET$Musí být splněno do #V 20 let#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E], [GetModifier('oath_mend_the_fracture').GetNameWithTooltip] a obě kultury získají [Concept('culture_tradition','kulturní tradici')|E] [GetCultureTradition('oath_mend_the_fracture_tradition').GetName]."
 provide_for_the_warriors_oath_tooltip: "Skládám [Concept('oath','přísahu')|E], že #V podpořím válečníky#!:\n\t$EFFECT_LIST_BULLET$Musíš postavit alespoň #V 3#! [GetBuilding('oath_warriors_building_02').GetName]. Dokud je tato [Concept('oath','přísaha')|E] aktivní, zpřístupní se tato řada [Concept('buildings','budov')|E].\n\t$EFFECT_LIST_BULLET$Musí být splněno do #V 20 let#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E], [GetModifier('oath_provide_for_the_warriors').GetNameWithTooltip] a zpřístupnění posledního vylepšení: [GetBuilding('oath_warriors_building_04').GetName]."
 provide_for_the_faithful_oath_tooltip: "Skládám [Concept('oath','přísahu')|E], že se #V postarám o věřící#!:\n\t$EFFECT_LIST_BULLET$Musíš postavit alespoň #V 3#! [GetBuilding('oath_faithful_building_02').GetName]. Dokud je tato [Concept('oath','přísaha')|E] aktivní, zpřístupní se tato řada [Concept('buildings','budov')|E].\n\t$EFFECT_LIST_BULLET$Musí být splněno do #V 20 let#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E], [GetModifier('oath_provide_for_the_faithful').GetNameWithTooltip] a zpřístupnění posledního vylepšení: [GetBuilding('oath_faithful_building_04').GetName]."
 provide_for_the_poor_oath_tooltip: "Skládám [Concept('oath','přísahu')|E], že se #V postarám o chudé#!:\n\t$EFFECT_LIST_BULLET$Musíš postavit alespoň #V 3#! [GetBuilding('oath_poor_building_02').GetName]. Dokud je tato [Concept('oath','přísaha')|E] aktivní, zpřístupní se tato řada [Concept('buildings','budov')|E].\n\t$EFFECT_LIST_BULLET$Musí být splněno do #V 20 let#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E], [GetModifier('oath_provide_for_the_poor').GetNameWithTooltip] a zpřístupnění posledního vylepšení: [GetBuilding('oath_poor_building_04').GetName]."
 repent_oath_tooltip: "Skládám [Concept('oath','přísahu')|E], že se budu #V kát#!:\n\t$EFFECT_LIST_BULLET$Musíš dokončit alespoň #V 4#! [Concept('pilgrimages','poutě')|E] a mít [GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]\n\t$EFFECT_LIST_BULLET$Musí být splněno do #V 20 let#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E], [GetModifier('oath_repent').GetNameWithTooltip], odstranění všech [Concept('sinful','hříšných')|E] [Concept('traits','rysů')|E] a jejich nahrazení [Concept('virtuous','ctnostnými')|E] [Concept('traits','rysy')|E]."
 coronation_events.0200.t: "Předehra"
 coronation_events.0200.desc.host: "Hosté dorazili. Z blízka i z daleka, z věrnosti i ze zvědavosti. Dav houstne a v jeho tvářích se zračí očekávání, vypočítavost a u některých dokonce i náznak vřelosti.\n\nPozvednu hlas právě natolik, aby shromáždění ztichlo, a přivítám všechny na své korunovaci."
 coronation_events.0200.desc.guest: "Shromáždění je stejně velkolepé, jak se dalo očekávat. Známé i cizí tváře se mísí a ze všech stran slyším pozdravy právě tak vřelé, aby zůstaly zdvořilé. Když pořadatel promluví, místnost instinktivně utichne.\n\n„Přátelé, vazalové, má rodino, vaše přítomnost je mi větší ctí než jakákoli koruna. Než obřad začne, jezte, pijte, mluvte bez zábran... a vězte, že vidím každého z vás a nezapomenu, kdo tu dnes stál po mém boku.“\n\nLaskavý slib, nebo tiché varování. Záleží jen na tom, jak si to kdo vyloží."
 coronation_events.0200.a: "Vítejte, všichni!"
 coronation_events.0200.b: "Tak tedy, kdo další tu je?"
 coronation_events.0205.t: "Obřad"
 coronation_events.0205.meager: "Všechny přípravy jsou dokončeny. Skromné slavnostní shromáždění již čeká. Místem je"
 coronation_events.0205.great: "Všechny přípravy jsou dokončeny. Velkolepé slavnostní shromáždění již čeká. Místem je"
 coronation_events.0205.hagia_sophia: "chrám Hagia Sofia, místo Boží svaté Moudrosti."
 coronation_events.0205.st_peters: "bazilika svatého Petra, sídlo nejvyššího Kristova náměstka."
 coronation_events.0205.saint_denis: "bazilika Saint-Denis, hrobka patrona francouzského lidu."
 coronation_events.0205.westminster: "vznešené Westminsterské opatství."
 coronation_events.0205.reims: "katedrála Notre-Dame v Remeši, chrám králů."
 coronation_events.0205.aachen: "proslulý palác Karla Velikého v Cáchách."
 coronation_events.0205.wawel: "krásná a věkovitá katedrála na Wawelu."
 coronation_events.0205.east_admin_location: "[location.GetTitle.GetNameNoTier], zdejší poklidný palácový komplex."
 coronation_events.0205.temple: "[location.GetTitle.GetNameNoTier], kde stojí vznešený [host.GetFaith.HouseOfWorship]."
 coronation_events.0205.east_admin_description: "\n\nZa dunění velkých bubnů"
 coronation_events.0205.silence: "\n\nZa chladného ticha"
 coronation_events.0205.cheers: "\n\nZa jásotu a provolávání slávy"
 coronation_events.0205.desc.host_east_asian: "prochází můj [ROOT.Char.Custom('GetTitleTierAdjective')] průvod kolem jedné řady za druhou. Stojí v nich mí [host.Custom('GetFighterTermPlural')] a úředníci. Za námi zůstává rodová svatyně mých předků, kde proběhly první dnešní obřady."
 coronation_events.0205.desc.guest_east_asian: "[host.GetTitledFirstNamePossessive] [ROOT.Char.Custom('GetTitleTierAdjective')] průvod prochází kolem jedné řady za druhou. Stojí v nich [host.Custom('GetFighterTermPlural')] a úředníci. Za námi zůstává rodová svatyně, kde proběhly první dnešní obřady."
 coronation_events.0205.desc.host: "prochází můj průvod namačkaným davem. Přede mnou jedou mí nejlepší [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')], za mnou kráčí má [ROOT.Char.Custom('GetTitleTierAdjective')] domácnost."
 coronation_events.0205.desc.guest: "[host.GetTitledFirstName] prochází davem v čele průvodu a má družina následuje na čestném místě, které nám náleží."
 coronation_events.0205.desc.low_magnificence_east_asian: "\n\nNad obřady visí zlé znamení. Jak by se předkové rodu [host.GetDynastyHouseName] nemuseli stydět za tak nejistý nástup...?"
 coronation_events.0205.desc.medium_magnificence_east_asian: "\n\nVe vzduchu je cítit naděje. Dlouhé ranní obřady úcty splnily svůj příznivý účel a spojily dnešní slavnost s dávnou minulostí."
 coronation_events.0205.desc.high_magnificence_east_asian: "\n\nRanní obřady naplnila podivuhodná posvátná úcta, nesená vzhůru na vonném kadidle a živená neochvějnou hrdostí předků rodu [host.GetDynastyHouseName]."
 coronation_events.0205.desc.low_magnificence: "Někteří [host.Custom('GetLocalCommonerTermPlural')] na nás tupě zírají, jiní si posměšně mumlají. Jeden z nich zařve: #EMP „[Select_CString(host.IsFemale, 'Falešná', 'Falešný')] [host.GetTitleAsName]!“#! Dav se okamžitě valí vpřed a těch pár [host.Custom('GetFighterTermPlural')], kteří lemují cestu, jej sotva zadržuje."
 coronation_events.0205.desc.medium_magnificence: "[host.Custom('GetLocalCommonerTermPlural')|U] se hrnou vpřed, aby zahlédli toho, kdo už brzy ponese titul [host.GetTitleAsNameNoTooltip|l]. Mezi zástupy se na ramenou svých rodičů smějí [location.GetCulture.GetName] děti."
 coronation_events.0205.desc.high_magnificence: "Zazní rohy! Ve větru vlají prapory v sytých barvách [host.GetPrimaryTitle.GetAdjective]! [host.Custom('GetLocalCommonerTermPlural')|U] provolávají panovníkovi slávu a ženy při pohledu na tento velkolepý průvod pláčou nadšením."
 coronation_events.0205.a_low_magnificence_east_admin: "Přízeň živých ani mrtvých..."
 coronation_events.0205.a_low_magnificence: "[ROOT.Char.GetFaith.HighGodName], proveď mě touhle chátrou..."
 coronation_events.0205.a_high_magnificence: "A má korunovace #EMP teprve začíná!#!"
 coronation_events.0205.a: "Největší okamžik se blíží."
 coronation_events.0205.b: "Při pohledu na mě asi nikoho nenapadne, že přede mnou stojí [ROOT.Char.GetTitleAsNameNoTooltip|l]..."
 coronation_events.0205.b_flavor_infirm: "...vždyť sotva mám dost sil, abych na svou vlastní korunovaci vůbec dojel."
 coronation_events.0205.b_improved: "Naštěstí si toho v takové nádheře málokdo všimne!"
 coronation_events.0205.c_low_magnificence_east_admin: "Ti, kdo ještě vidí vlastníma očima, vědí své!"
 coronation_events.0205.c_low_magnificence: "Podívejte se pořádně, burani! [activity.GetHost.GetTitleAsNameNoTooltip|l] stojí přímo před vámi."
 coronation_events.0205.c: "Takto vypadá skutečně velký [activity.GetHost.GetTitleAsNameNoTooltip|l]!"
 coronation_events.0205.d: "Teď se ukáže, zač stojí [activity.GetHost.GetTitleAsNameNoTooltip]."
 coronation_events.0205.e_east_admin: "Lesk mincí vrátí dnešku příznivá znamení!"
 coronation_events.0205.e: "Lesk mincí vrátí dnešku jeho nádheru."
 coronation_events.0205.e.tt: "Před shromážděním se objeví [ROOT.Char.CustomFixedRandom('GetKnightErrantAnimal')]. Má na sobě roucho ze zlatohlavu a [ROOT.Char.CustomFixedRandom('GetExpensiveDrink_Singular')] proudí ze všech kašen; hudebníci sedící před pavilonem opěvují tvou slávu."
 coronation_events.0205.e.toast: "[host.GetShortUIName] [Select_CString(host.IsFemale, 'nešetřila', 'nešetřil')] na obřadu"
 coronation_events.0205.f_east_admin: "#EMP Musím#! k tomuto shromáždění promluvit."
 coronation_events.0205.f: "Lid ví, kdo je [ROOT.Char.GetTitleAsNameNoTooltip]."
 coronation_events.0205.f.tt: "Proneseš k lidu skutečně strhující řeč."
 coronation_events.0205.f.success: "Shromáždění žasne"
 coronation_events.0205.f.failure: "Tvá snaha přijde vniveč"
 coronation_events.0205.f.toast: "[host.GetShortUIName] [Select_CString(host.IsFemale, 'pronesla', 'pronesl')] strhující řeč"
 coronation_events.0210.t: "Hostina"
 coronation_events.0210.desc.host: "Obřad je u konce: dostalo se mi všech [ROOT.Char.Custom('GetTitleTierAdjective')] poct. Znovu povstávám, tentokrát ne proto, abych sliboval a poroučel, ale abych nabídl přepychové požitky.\n\n„Ať se stoly prohýbají pod jídlem. Pozvedněme číše a ať se na tento sál nevzpomíná jen pro povinnost, ale také pro radost.“\n\nShromáždění, vyhladovělé po dlouhém přihlížení složitým obřadům, souhlasně zabručí. Alespoň prozatím mají všichni před sebou něco jiného než mě."
 coronation_events.0210.desc.guest: "Formality skončily a s nimi i nehybné ticho, které dosud drželo shromáždění na místě. Ozve se několik šepotů, když pořadatel znovu povstane, tentokrát aby završil obřad a zahájil něco uvolněnějšího.\n\n[host.GetTitleAsName] promluví právě tak hlasitě, aby se hlas nesl celým sálem: „Přátelé, vazalové, má rodino, obřady jsou u konce. Ať se stoly prohýbají pod jídlem, pozvedněme číše a ať se na tento sál nevzpomíná jen pro povinnost, ale také pro radost.“\n\nSlova se setkají s nadšením a s každým okamžikem se [ROOT.Char.Custom('GetTitleTierAdjective')] shromáždění mění v čím dál živější oslavu."
 coronation_events.0210.a: "Konečně něco k jídlu!"
 coronation_events.0210.b: "Konečně je obřad za námi."
 coronation_events.0300.t: "Čestná úloha"
 coronation_events.0300.desc: "Než může korunovace pokračovat, musím rozhodnout, kdo bude předsedat posvátným obřadům. Pokud mi mají [ROOT.Char.GetFaith.AltPriestTermPlural|U] projevit přízeň, bylo by moudré svěřit obřad někomu z jejich řad a dodat mu tak posvátnost a požehnání, jaké mohou udělit jen oni.\n\nČást mého nitra však váhá. Nebylo by velkolepější uchopit korunu vlastníma rukama a přede všemi bez prostředníka prohlásit své právo vládnout?"
 coronation_events.0300.a: "Jen [chaplain.GetFirstNameNoTooltip] to může vykonat."
 coronation_events_0300_a_tooltip: "Obřad povede [chaplain.GetFirstName]"
 coronation_events.0300.b: "Co třeba [alternative_1.GetFirstNameNoTooltip]?"
 coronation_events_0300_b_tooltip: "Obřad povede [alternative_1.GetFirstName]"
 coronation_events.0300.c: "Věřím, že [alternative_2.GetFirstNameNoTooltip] je správná volba."
 coronation_events_0300_c_tooltip: "Obřad povede [alternative_2.GetFirstName]"
 coronation_events.0300.d: "Tato čest náleží jedině mně."
 coronation_events_0300_d_tooltip: "Obřad povedeš #high ty#!"
 coronation_events_0300_d_tooltip_effect: "Získáš @prestige_icon![Concept('prestige','prestiž')|E], ale v závislosti na [Concept('coronation_magnificence','pompéznosti')|E] své [Concept('coronation','korunovace')|E] ztratíš @opinion_icon![Concept('opinion','mínění')|E] u svého [Concept('court_chaplain','dvorního kaplana')|E] a [Concept('vassals','vazalů')|E] s postojem [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName|U]"
 coronation_events_0300_d_tooltip_effect_hof: "Získáš @prestige_icon![Concept('prestige','prestiž')|E], ale v závislosti na [Concept('coronation_magnificence','pompéznosti')|E] své [Concept('coronation','korunovace')|E] ztratíš @opinion_icon![Concept('opinion','mínění')|E] u své [Concept('head_of_faith','hlavy víry')|E] a [Concept('vassals','vazalů')|E] s postojem [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName|U]"
 coronation_events.0301.t: "Smrt obřadníka"
 coronation_events.0301.desc: "[dead_officiator.GetFirstName], [Select_CString(dead_officiator.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('dead_officiator'))], [dead_officiator.GetDeathReason]. Právě tato osoba měla vést mou korunovaci. Místo u posvátného obřadu nyní zeje prázdnotou a rituál zůstává nedokončený.\n\n[first_candidate.GetFirstName], [first_candidate.GetFaith.GetAdherentName] [first_candidate.GetFaith.PriestNeuter] požívající velké úcty, předstoupí. „[first_candidate.GetFaith.HighGodName] nezakolísá jen proto, že odešla jedna duše,“ pronese [first_candidate.GetFirstName] slavnostně. „Dáš-li mi svolení, obřad dokončím.“"
 coronation_events.0301.a: "Svatý [ROOT.Char.Custom('GetCatholicSaint')], kéž tuto duši přijme [ROOT.Char.GetFaith.PositiveAfterLife]."
 coronation_events.0301.a.tooltip: "Obřad nově povede [first_candidate.GetFirstNameNoTooltip]"
 coronation_events.0301.a.c: "Jedna smrt obřad nezastaví."
 coronation_events.0301.b: "[second_candidate.GetTitledFirstNameNoTooltip] má blíže k božství. [first_candidate.GetFaith.HighGodName] to jistě ví."
 coronation_events.0301.b.tooltip: "Obřad nově povede [second_candidate.GetFirstNameNoTooltip]"
 coronation_events.0301.c: "[dead_officiator.GetFirstName] si zaslouží mou nejvyšší úctu. Obřady zrušíme."
 coronation_events.0301.c.tooltip: "#N @warning_icon! Tvá [Concept('coronation','korunovace')|E] jako [Concept('activity','aktivita')|E] bude zrušena.#!"
 coronation_events.0301.c.tooltip_second: "Budeš moci uspořádat [Concept('funeral','pohřeb')|E] za [dead_officiator.GetFirstName]."
 coronation_events.0301.c.tooltip_third: "[Concept('coronation','Korunovaci')|E] budeš moci znovu uspořádat ihned po [Concept('funeral','pohřbu')|E]."
 coronation_events.0301.d: "Nedovolím, aby jedna smrt zastavila #EMP mou#! korunovaci."
 coronation_events.0301.d.tooltip: "Obřad nově povede [first_candidate.GetFirstNameNoTooltip]. [dead_officiator.GetTitledFirstName] [Select_CString(dead_officiator.IsFemale, 'zemřela', 'zemřel')] během tvé korunovace, což je všeobecně považováno za velmi zlé znamení pro tvou vládu."
 coronation_events.0301.e: "[first_candidate.GetFaith.HighGodName] dává a [first_candidate.GetFaith.HighGodName] bere."
 coronation_events.0301.e.tooltip: "#N @warning_icon! Tvá [Concept('coronation','korunovace')|E] jako [Concept('activity','aktivita')|E] bude zrušena.#!"
 coronation_events.0301.e.tooltip_second: "Po dobu následujících 12 měsíců nebudeš moci uspořádat další korunovaci."
