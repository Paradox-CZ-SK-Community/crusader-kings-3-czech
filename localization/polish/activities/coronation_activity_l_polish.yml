 coronation_events.0310.t: "[ROOT.Char.GetTitleAsNamePossessiveNoTooltip] záměr"
 coronation_events.0310.desc.high_magnificence: "Neúnavně jsem usiloval o slávu a velkolepost své korunovace. Hosté jsou tím, čeho zde byli svědky, nadšeni a jejich obdiv je nepřehlédnutelný. Pro mou vládu v roli [ROOT.Char.GetTitleAsNameNoTooltip|l] to byl důstojný začátek.\n\n"
 coronation_events.0310.desc.mid_magnificence: "Teď už mi titul [ROOT.Char.GetTitleAsNameNoTooltip|l] náleží se vší vážností. Má korunovace byla hodna mého postavení a hostům nabídla působivou podívanou. Mnozí z nich se stále zdržují v naději, že ode mě uslyší ještě několik posledních [ROOT.Char.Custom('GetTitleTierAdjective')] slov.\n\n"
 coronation_events.0310.desc.low_magnificence: "Oslavy se chýlí ke konci. Šeptalo se o zmatku, napětí i narychlo připraveném zázemí. V uších mi možná ještě znějí pomluvy a v žaludku leží staré, nakyslé jídlo... ale záleží jen na jednom: titul [ROOT.Char.GetTitleAsNameNoTooltip|l] mi nyní právoplatně náleží.\n\n"
 coronation_events.0310.desc.impress_attendees: "Od začátku až do konce bylo mým cílem zapůsobit na každého účastníka, přítele i nepřítele! Má nestrannost, má přítomnost, veškeré soustředění na úspěch tohoto velkého shromáždění...\n\nK čemu to všechno bylo?"
 coronation_events.0310.desc.weaken_detractors: "Drzí, [first_char.Custom('InsultAdjective')] odpůrci, mezi nimi [first_char.GetName] a [second_char.GetName], měli tu troufalost přijít na mou korunovaci... a dostalo se jim přesně té [ROOT.Char.Custom('GetTitleTierAdjective')] zášti, jakou si zaslouží! Přišli hledat mé slabiny, ale našli jen chladné opovržení a železné odhodlání.\n\nMožná bych jim měl zasadit ještě poslední, zdrcující úder..."
 coronation_events.0310.desc.embrace_supporters: "Při každé příležitosti jsem dával přednost těm, kdo byli nejvěrnější mně a mé koruně. Společně jsme s mými podporovateli spřádali plány a navzájem vyzdvihovali své zásluhy. [first_char.GetName], [second_char.GetName] a ostatní se stali mým nejbližším kruhem.\n\nJejich důvěra by mohla přerůst v něco mnohem hmatatelnějšího."
 coronation_events.0310.desc.exalt_crown: "Zůstal jsem věrný přesvědčení, že sláva koruny stojí nade vším. Zkoušky, kterým jsem zde čelil, i malicherné půtky jsou jen pomíjivé nesnáze, zatímco [ROOT.Char.GetPrimaryTitle.GetNameNoTier] přetrvá! Tuto víru jsem předal i svým hostům a jejich důvěra v panství zesílila.\n\nK čemu ale všechna tato oslava koruny nakonec poslouží?"
