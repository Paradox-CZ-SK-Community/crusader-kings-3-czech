 coronation_events.0100.t: "Přísaha pro věky"
 coronation_events.0100.desc.opening: "Shromáždění mě sleduje. Někteří s nadějí, někteří se skepsí, všichni čekají, až promluvím o své vládě a vyslovím přísahu do budoucna. Slyším otázky, které nevyslovují. Budu spravedlivý? Budu fér?"
