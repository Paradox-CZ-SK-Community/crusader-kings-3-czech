 coronation_events.0100.alliances_flavor: "Přísahám, že budu budovat spojenectví široko daleko."
 coronation_events.0100.children: "$GetChildrenOathText$"
 coronation_events.0100.children_flavor: "Přísahám, že posílím svůj rod novými členy rodiny"
 coronation_events.0100.reconquest: "Upevnit [host.GetPrimaryTitle.GetTierAsNameNoTooltip]"
 coronation_events.0100.reconquest_flavor: "Přísahám, že své úsilí zaměřím na znovuzískání ztracených zemí — [ROOT.Char.GetPrimaryTitle.GetNameNoTier] v původních hranicích."
 coronation_events.0100.reconquest_opinion: "$BULLET$Každý zahraniční [Concept('ruler','vládce')|E], který se [Concept('activity_attending','účastní')|E] a drží [Concept('county','hrabství')|E] náležející k tomuto titulu: [root_scope.GetPrimaryTitle.GetNameNoTier]"
 coronation_events.0100.conquest: "$GetConquestOathText$"
 coronation_events.0100.conquest_flavor: "Přísahám, že pro svůj lid vybojuji nové země. Ať žije [ROOT.Char.GetPrimaryTitle.GetNameNoTier]!"
 coronation_events.0100.conquest_opinion: "$BULLET$Každý sousední [Concept('ruler','vládce')|E], který se [Concept('activity_attending','účastní')|E]"
 warlike_character_opinion: "$BULLET$Každý [Concept('vassal','vazal')|E], který se [Concept('activity_attending','účastní')|E] a má postoj [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName] nebo [GetVassalStance( 'belligerent' ).GetTextIcon][GetVassalStance( 'belligerent' ).GetName]"
 coronation_events.0100.peace: "$GetPeaceOathText$"
 coronation_events.0100.peace_flavor: "Přísahám, že [ROOT.Char.GetPrimaryTitle.GetTierAsName] bude mít zajištěn mír."
 coronation_events.0100.buildings: "$GetBuildingOathText$"
 coronation_events.0100.buildings_flavor: "Přísahám, že znovu vybuduji své panství."
 coronation_events.0100.university: "$GetUniversityOathText$"
 coronation_events.0100.university_flavor: "Přísahám, že budu v panství podporovat kruh učenců."
 coronation_events.0100.purge_pretenders: "$GetPurgePretendersOathText$"
 coronation_events.0100.purge_pretenders_flavor: "Přísahám, že se zbavím falešných pretendentů na trůn."
 coronation_events.0100.end_the_struggle: "$GetEndTheStruggleOathText$"
 coronation_events.0100.end_the_struggle_flavor: "Přísahám, že ukončím Svár."
 coronation_events.0100.greatest_hunter: "$GetGreatestHunterOathText$"
 coronation_events.0100.greatest_hunter_flavor: "Přísahám, že se stanu největším lovcem."
 coronation_events.0100.heir_preparation: "$GetHeirPreparationOathText$"
 coronation_events.0100.heir_preparation_flavor: "Přísahám, že svého dědice připravím na budoucnost."
 coronation_events.0100.install_claimants: "Dosadit pretendenty"
 coronation_events.0100.install_claimants_flavor: "Přísahám, že právoplatné pretendenty dosadím na jejich trůny a uzurpátory svrhnu."
 coronation_events.0100.mend_the_fracture: "Zacelit rozkol"
 coronation_events.0100.mend_the_fracture_flavor: "Přísahám, že zacelím kulturní rozkol v panství a přinesu zemi mír."
 coronation_events.0100.provide_for_the_warriors: "Podporovat [ROOT.Char.Custom('KnightCulturePluralNoTooltip')]"
 coronation_events.0100.provide_for_the_warriors_flavor: "Přísahám, že budu štědře podporovat válečníky země [ROOT.Char.GetPrimaryTitle.GetNameNoTier]."
 coronation_events.0100.provide_for_the_faithful: "Postarat se o věřící"
 coronation_events.0100.provide_for_the_faithful_flavor: "Přísahám, že budu štědře podporovat věřící, které chrání [ROOT.Char.GetPrimaryTitle.GetNameNoTier]."
 coronation_events.0100.provide_for_the_poor: "Postarat se o chudé"
 coronation_events.0100.provide_for_the_poor_flavor: "Přísahám, že budu štědře pomáhat chudým, kteří žijí v zemi [ROOT.Char.GetPrimaryTitle.GetNameNoTier]."
 coronation_events.0100.repent: "$GetRepentOathText$"
 coronation_events.0100.repent_flavor: "Přísahám, že budu činit pokání za své hříchy."
 coronation_events.0100.opt_out: "Žádnou přísahu nesložím."
 coronation_events.0110.t: "Přísaha"
 coronation_events.0110.desc.intro: "[activity.GetHost.GetFirstName] stojí před davem [Select_CString(activity.GetHost.IsFemale, 'sama', 'sám')] a všichni čekají, až složí svou přísahu.\n\n"
 coronation_events.0110.desc.diplomacy_oath_1: "#emp „Žádné panství neprosperuje samo. Moc nespočívá jen ve vojsku, ale také v poutech důvěry a v paktech stvrzených slovem a vůlí.\n\nZ [activity.GetHost.GetCapitalLocation.GetName] podám ruku přátelství a budu budovat aliance, které zajistí, ať je [activity.GetHost.GetPrimaryTitle.GetNameNoTier] v bezpečí po celé příští generace.“#!"
 coronation_events.0110.desc.diplomacy_oath_2: "#emp „Síla panství nespočívá jen v získaných aliancích, ale také v tichém příslibu pokračování. Zajistím, aby rod [activity.GetHost.GetHouse.GetName] přetrval, a dám tak panství základy pevné jako skála.\n\nNaše děti zajistí, že rod [activity.GetHost.GetHouse.GetName] bude pokračovat bez přerušení, zachová stabilitu a provede naše panství vším, co budoucnost přinese.“#!"
 coronation_events.0110.desc.martial_oath_1: "#emp „Dnes povstávám nejen proto, abych vládl, ale také abych budoval. Nejen abych zachoval to, co je, ale abych vytvořil to, co být může. [activity.GetHost.GetPrimaryTitle.GetNameNoTier] nesmí zůstat pouhou vzpomínkou na mapách. Musí růst.\n\nPro naši budoucnost a budoucnost našeho lidu.“#!"
 coronation_events.0110.desc.martial_oath_2: "#emp „Příliš dlouho trpěly země náležející k [activity.GetHost.GetPrimaryTitle.GetNameNoTier] pod vládou nehodných rukou. Pod vládou těch, kteří si spletli držbu s legitimitou.\n\nTomu je nyní konec. [activity.GetHost.GetPrimaryTitle.GetNameNoTier] pozná skutečnou vládu. Mou vládu.“#!"
 coronation_events.0110.desc.stewardship_oath_1: "#emp „Vládce musí dělat víc než jen bránit hranice. Musí zajistit, aby za nimi stálo za to žít. Budu střežit mír, pečovat o panství a plánovat nikoli válku, ale rozkvět.\n\n[activity.GetHost.GetPrimaryTitle.GetNameNoTier] pod mou vládou vstoupí do nového zlatého věku.“#!"
 coronation_events.0110.desc.stewardship_oath_2: "#emp „Ne každý odkaz se rodí ve válce. Některé se tesají do kamene potem a odhodláním. Přetvořím [activity.GetHost.GetPrimaryTitle.GetNameNoTier] a vystavím památky hodné budoucnosti.\n\n[activity.GetHost.GetPrimaryTitle.GetNameNoTier] nejen přetrvá, ale díky péči a prozíravosti vstoupí do zlatého věku.“#!"
 coronation_events.0110.desc.learning_oath_1: "#emp „Ať si žádný vládce neplete nevědomost se silou. Panství vedené moudrostí přetrvá každé, které stojí pouze na strachu.\n\n[activity.GetHost.GetCapitalLocation.GetName] se stane místem, kam shromáždím ty nejlepší učence, a díky jejich radám [activity.GetHost.GetPrimaryTitle.GetNameNoTier] vykročí vstříc nové budoucnosti.“#!"
 coronation_events.0110.desc.purge_pretenders_oath: "#emp „Falešní pretendenti na [activity.GetHost.GetPrimaryTitle.GetName] se množí jako krysy ve stokách. A stejně jako všechnu ostatní havěť je třeba je vyhubit.“#!"
 coronation_events.0110.desc.end_the_struggle_oath: "#emp „Po celé generace trvá [activity.GetHost.MakeScope.Var('end_the_struggle_oath_type_var').Struggle.GetName] a [activity.GetHost.GetCulture.GetCollectiveNoun] kvůli němu krvácejí. Už dost. Učiním konec tomuto nesmyslnému plýtvání silami a přivedu celý kraj do nové éry společného blahobytu. Ať je mi [activity.GetHost.GetFaith.HighGodName] svědkem.“#!"
 coronation_events.0110.desc.greatest_hunter_oath: "#emp „Lov není jen zkouškou dovedností, ale také oslavou života a přírody. Stanu se největším lovcem, pánem divočiny. [activity.GetHost.GetPrimaryTitle.GetNameNoTier] má dosud nezkrocené kraje a já se stanu jejich skutečným vládcem.“#!"
 coronation_events.0110.desc.heir_preparation_oath: "#emp „Bez řádného dědice je budoucnost mé dynastie odsouzena k zapomnění. Osobně povedu vzdělávání svého dědice a vštípím mu hodnoty a moudrost potřebné k tomu, aby naši dynastii pozvedl k nové velikosti.“#!"
 coronation_events.0110.desc.install_claimants_oath: "#emp „Právoplatný nárok na trůn není jen otázkou krve, ale také spravedlnosti. Dosadím právoplatné pretendenty na jejich trůny, svrhnu uzurpátory a obnovím řád.“#!"
 coronation_events.0110.desc.mend_the_fracture_oath: "#emp „Kulturní rozkol v panství působí sváry už příliš dlouho. Sjednotím národy pod společným praporem, který ponese jméno [activity.GetHost.GetHouse.GetName], ale jejich vlastní identity zůstanou nedotčené.“#!"
 coronation_events.0110.desc.provide_for_the_warriors_oath: "#emp „[activity.GetHost.GetPrimaryTitle.GetNameNoTier] stojí na válečnících, kteří jsou mým mečem i štítem. Zajistím jim dobrou výzbroj a vše potřebné, aby byli připraveni bránit naše země.“#!"
 coronation_events.0110.desc.provide_for_the_faithful_oath: "#emp „[activity.GetHost.GetPrimaryTitle.GetNameNoTier] stojí na svých věřících, kteří jsou páteří mého panství. Postarám se o jejich světské potřeby, aby se mohli plně oddat své službě. [ROOT.Char.GetFaith.HighGodName] tak získá oddané služebníky, kteří budou usilovat o spásu mého panství.“#!"
 coronation_events.0110.desc.provide_for_the_poor_oath: "#emp „[activity.GetHost.GetPrimaryTitle.GetNameNoTier] stojí i na chudých. Jsou solí země a světlem světa a v tichosti pracují pro dobro nás všech. Zajistím, aby i ti nejchudší v mém panství mohli žít důstojně a s nadějí.“#!"
 coronation_events.0110.desc.repent_oath: "#emp „[Select_CString(activity.GetHost.IsFemale, 'Co může změnit povahu ženy?', 'Co může změnit povahu muže?')] Stačí k tomu má vůle? Uvěří mi ostatní [activity.GetHost.GetFaith.GetAdherentNamePlural], že svých hříchů skutečně lituji? Uvěří mi [activity.GetHost.GetFaith.HighGodName]? Možná je pošetilé to zkoušet, ale ještě větším hříchem by bylo nepokusit se.“#!"
 coronation_events.0110.desc.fallback_compassionate: "#emp „Přísahám, že budu ctít všechny spravedlivé zákony a zvyky lidu, jemuž vládnu; vládnout s laskavou moudrostí a soudit s milosrdnou shovívavostí.“#!"
 coronation_events.0110.desc.fallback_honorable: "#emp „Přísahám, že [activity.GetHost.GetPrimaryTitle.GetNameNoTier] bude zemí, kde [activity.GetHost.GetFaith.AltPriestTermPlural] žijí v míru a svornosti, jak si přeje [activity.GetHost.GetFaith.HighGodName], a že svou ctí budu střežit svobody a práva svého lidu.“#!"
 coronation_events.0110.desc.fallback_feckless: "#emp „Já... ehm... skládám všechny náležité přísahy... Vždyť jsem [activity.GetHost.GetTierAsName]... Od nynějška budu dělat, co požadují [activity.GetHost.GetFaith.AltPriestTermPlural], a odpovím, kdykoli mě panství zavolá, a tak dále...“#!"
 coronation_events.0110.desc.fallback: "#emp „Přísahám, že za mé vlády [activity.GetHost.GetPrimaryTitle.GetNameNoTier] pozná blahobyt, budu ctít zvyky zdejšího lidu a [activity.GetHost.GetPrimaryTitle.GetTierAsNameNoTooltip] získá slávu.“#!"
 coronation_events.0110.regular: "Uvidíme, zda těmto slovům dostojí..."
 coronation_events.0110.no_oath: "Slova, která patří obřadu, ne dějinám."
 coronation_events.0110.desc.outro: ""
 coronation_events.0150.t: "Porušená přísaha: [SCOPE.Custom('GetOathSpecific')|V]"
 coronation_events.0150.desc: "Slyším jejich šeptání za zavřenými dveřmi. Vidím zklamání vepsané do jejich očí. A cítím tíhu hanby, která na mě doléhá.\n\nVšichni to vědí. [Select_CString(ROOT.Char.IsFemale, 'Selhala jsem.', 'Selhal jsem.')] Porušila jsem přísahu, kterou jsem slíbila dodržet, a zradila tak slib daný všem svým poddaným.\n\nJak se jim teď mám podívat do očí? Jak mám tuto potupu vůbec nést?"
 coronation_events.0150.desc_honest: "S mocí přišel i slib. Před celým panstvím zazněla má přísaha, které věřili oni a věřil jí každý, včetně mě.\n\nTrůn mi teď připadá spíš jako hrobka než jako sídlo moci. Chladná, pozlacená klec, která se mi s každým nádechem vysmívá. A nejhorší je vědomí, že za všechno si můžu sám."
 coronation_events.0150.desc_deceitful: "Ať si šeptají. Ať po mně vrhají pohledy plné uražené pýchy a prázdného zklamání. Vidím to. Jejich odsouzení cítím jako čepel na zádech.\n\nAle hanba? Ne. Hanba je pro ty, kteří své sliby někdy skutečně chtěli dodržet.\n\nPřísaha je posvátná jen pro hlupáky."
 coronation_events.0150.a: "Jaká ostuda..."
 coronation_events.0150.a_honest: "Jak mám s tou hanbou vůbec žít?"
 coronation_events.0150.a_deceitful: "Tak to prostě je."
 coronation_events.150.custom_list_tooltip: "Každý [Concept('vassal','vazal')|E], [Concept('courtier','dvořan')|E] nebo [Concept('guest','host')|E]"
 coronation_events.0175.t: "Splněná přísaha: [SCOPE.Custom('GetOathSpecific')|V]"
 coronation_events.0175.desc: "Mé dílo je dokončeno přesně tak, jak jsem slíbil. Slyšel jsem posměch svých odpůrců a jejich jistotu, že při plnění přísahy selžu.\n\nJenže se mýlili. Hlasy pochybovačů utichly a nyní mi prokazují úctu, o níž si dříve mysleli, že na ni nikdy nedosáhnu.\n\nPřichází nový den..."
 coronation_events.0175.a: "A [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] mu vyjde vstříc silnější než kdy dřív!"
 diplomacy_oath_1_tooltip: "Skládám [Concept('oath','přísahu')|E], že #V zajistím aliance#!:\n\t$EFFECT_LIST_BULLET$Musíš mít alespoň #V 3#! [Concept('alliances','aliance')|E] s [Concept('rulers','vládci')|E], kteří:\n\t\t$EFFECT_LIST_BULLET$O tobě mají [Concept('opinion','mínění')|E] alespoň #V 50#!\n\t\t$EFFECT_LIST_BULLET$Splňují jednu z následujících podmínek:\n\t\t\t$EFFECT_LIST_BULLET$Mají o jednu [Concept('title_tier','úroveň')|E] nižší titul\n\t\t\t$EFFECT_LIST_BULLET$Mají titul stejné [Concept('title_tier','úrovně')|E]\n\t\t\t$EFFECT_LIST_BULLET$Mají titul vyšší [Concept('title_tier','úrovně')|E]\n\t$EFFECT_LIST_BULLET$Musí být splněno do #V 20 let#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E], [opinion_i][Concept('opinion','mínění')|E], [cultural_acceptance_i][Concept('cultural_acceptance','kulturní přijetí')|E] a [GetModifier('oath_of_alliances').GetNameWithTooltip]"
 diplomacy_oath_2_tooltip: "Skládám [Concept('oath','přísahu')|E], že #V posílím rod#!:\n\t$EFFECT_LIST_BULLET$Musíš mít alespoň #V 7#! [Concept('legitimate','legitimních')|E] [Concept('children','dětí')|E] #weak (nyní [host.MakeScope.ScriptValue('children_oath_value')|V0]/#V 7#!)#!\n\t$EFFECT_LIST_BULLET$Musí být splněno do #V 30 let#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E], [dynasty_prestige_i][Concept('dynasty_prestige','věhlas')|E] a [GetModifier('oath_of_children').GetNameWithTooltip]"
 martial_oath_1_tooltip: "Skládám [Concept('oath','přísahu')|E], že #V upevním [host.GetPrimaryTitle.GetNameNoTierNoTooltip]#!:\n\t$EFFECT_LIST_BULLET$[host.GetPrimaryTitle.GetName] musí [Concept('completely_control','zcela ovládat')|E] své [Concept('de_jure','de iure')|E] hranice #low (nyní [host.MakeScope.ScriptValue('oath_reconquest_value_1')|V0]/[host.MakeScope.ScriptValue('oath_reconquest_value_2')|V0])#!\n$EFFECT_LIST_BULLET$Musí být splněno do #V 20 let#!\n$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E] a [GetModifier('oath_of_reconquest').GetNameWithTooltip]"
 oath_reconquest_tooltip: "[Concept('completely_control','Zcela ovládat')|E] [Concept('de_jure','de iure')|E] [THIS.Var('oath_reconquest_title').Title.GetName] #low ([root_scope.MakeScope.ScriptValue('oath_reconquest_value_1')]/[root_scope.MakeScope.ScriptValue('oath_reconquest_value_2')])#!"
 martial_oath_2_tooltip: "Skládám [Concept('oath','přísahu')|E], že #V rozšířím panství#!:\n\t$EFFECT_LIST_BULLET$[Concept('realm','Panství')|E] musí mít velikost alespoň [host.MakeScope.ScriptValue('oath_conquest_value_1')|V0] #low (nyní [host.MakeScope.ScriptValue('oath_conquest_value_2')|V0])#!\n$EFFECT_LIST_BULLET$Musí být splněno do #V 20 let#!\n$EFFECT_LIST_BULLET$Vyber si mezi výhodou pro [Concept('capital','hlavní sídlo')|E] a přesunem [Concept('titles','titulů')|E] [Concept('de_jure','de iure')|E]\n$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E] a [GetModifier('oath_of_conquest').GetNameWithTooltip]"
 stewardship_oath_1_tooltip: "Skládám [Concept('oath','přísahu')|E], že #V zajistím mír#!:\n\t$EFFECT_LIST_BULLET$Musíš udržet nepřetržitý mír alespoň #V 5 let#!\n\t$EFFECT_LIST_BULLET$Musí být splněno do #V 50 let#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E], [development_i][Concept('development','rozvoj')|E] a [GetModifier('oath_of_peace').GetNameWithTooltip]"
 stewardship_oath_2_tooltip: "Skládám [Concept('oath','přísahu')|E], že #V přetvořím panství#!:\n\t$EFFECT_LIST_BULLET$Musíš postavit nebo vylepšit alespoň #V 8#! [Concept('buildings','budov')|E]\n\t$EFFECT_LIST_BULLET$Musí být splněno do #V 20 let#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E], [development_i][Concept('development','rozvoj')|E] a [GetModifier('oath_of_buildings').GetNameWithTooltip]"
 learning_oath_1_tooltip: "Skládám [Concept('oath','přísahu')|E], že #V podpořím vzdělanost#!:[SelectLocalization( GreaterThan_CFixedPoint( GetPlayer.MakeScope.Var('learning_oath_1_university_exists').GetValue, '(CFixedPoint)0' ), 'learning_oath_1_tooltip_need_university', 'learning_oath_1_tooltip_need_development' )]\n\t$EFFECT_LIST_BULLET$Musíš mít alespoň #V [learning_oath_temp_cost]#! [gold_i][Concept('gold','zlata')|E]\n\t$EFFECT_LIST_BULLET$Musíš splnit #V 1#! z následujících požadavků:\n\t\t\t$EFFECT_LIST_BULLET$Mít [Concept('education_trait','rys vzdělání')|E] páté úrovně\n\t\t\t$EFFECT_LIST_BULLET$Každý [Concept('councillor','rádce')|E] má pro svou funkci dovednost #V 20#! nebo vyšší\n\t$EFFECT_LIST_BULLET$Musí být splněno do #V 50 let#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E] a [SelectLocalization( GreaterThan_CFixedPoint( GetPlayer.MakeScope.Var('learning_oath_1_university_exists').GetValue, '(CFixedPoint)0' ), 'learning_oath_1_tooltip_university', 'learning_oath_1_tooltip_no_university' )]"
