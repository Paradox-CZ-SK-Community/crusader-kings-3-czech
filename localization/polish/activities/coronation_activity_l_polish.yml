l_polish:
 activity_coronation: "Korunovace"
 activity_coronation_host_desc: "$BULLET_WITH_TAB$@law_icon![GetLaw('crowned_king').GetName] nebo [GetLaw('crowned_emperor').GetName] [Concept('law','zákon')|E]\n$BULLET_WITH_TAB$Dokud probíhá korunovace, @faction_icon![Concept('factions','frakce')|E] nemohou vznést požadavky\n$BULLET_WITH_TAB$[opinion_i][Concept('opinion','Mínění')|E]\n$BULLET_WITH_TAB$[prestige_i][Concept('prestige','Prestiž')|E]\n$BULLET_WITH_TAB$[legitimacy_i][Concept('legitimacy','Legitimita')|E]\n$BULLET_WITH_TAB$Mocné [Concept('decision','rozhodnutí')|E] spojené s [Concept('oath','přísahou')|E]\n\n@warning_icon! #X @faction_icon![Concept('factions','Frakce')|E] a další nepřátelé budou snižovat [Concept('coronation_magnificence','pompéznost')|E] korunovace#!"
 activity_coronation_guest_desc: "$BULLET_WITH_TAB$ Účastníci si mohou zlepšit [opinion_i][Concept('opinion','mínění')|E] o ostatních účastnících\n$BULLET_WITH_TAB$Účastníci mohou získat jedinečné příležitosti podle svého [Concept('intent','záměru')|E]"
 activity_coronation_desc: "Pozvi velmože a mocné svého panství, aby byli svědky tvého nástupu na trůn. Položíš tak základy dlouhé a úspěšné vlády."
 activity_coronation_conclusion_desc: "[GetActivityType( 'activity_coronation' ).GetName] skončila."
 activity_coronation_selection_tooltip: "Pozvi velmože a mocné svého panství, aby byli svědky tvého nástupu na trůn. Položíš tak základy dlouhé a úspěšné vlády.\n\nOčekávané odměny:\n$activity_coronation_host_desc$"
 activity_coronation_destination_selection: "\n[Concept('coronation','Korunovace')|E] se obvykle musí konat v [Concept('realm','panství')|E] [Concept('host','hostitele')|E], s výjimkou [Concept('anointments','pomazání')|E], u nichž může být vyžadováno konání na území [Concept('head_of_faith','hlavy víry')|E], pokud vlastní vhodná [Concept('holy_sites','svatá místa')|E]."
 activity_coronation_guest_help_text: "Korunovace je skvělou příležitostí navázat vztahy a zapůsobit na [Concept('vassals','vazaly')|E] i ostatní [Concept('rulers','vládce')|E].\n\nKaždý host účastnící se korunovace bude mít příležitosti zlepšit si [Concept('opinion','mínění')|E] o ostatních hostech a může získat zvláštní možnosti interakce s [Concept('host','hostitelem')|E] [Concept('activity','aktivity')|E]."
 invite_to_activity_flavor_coronation: "Přijmi mé srdečné pozvání a připoj se ke mně i ostatním z panství na mé nadcházející korunovaci. Místo konání: [ROOT.Char.GetCurrentLocation.Custom('GetCoronationSitePrefix')][ROOT.Char.GetCurrentLocation.Custom('GetCoronationSite')]."
 activity_coronation_underage_tt: "Je ti #bold méně#! než #V 12#! let\n#flavor Koruna ti z malé hlavičky hned sklouzne#!"
 activity_coronation_not_approved_anointment: "[GetPlayer.GetFaith.GetReligiousHead.GetTitledFirstName]: toto [Concept('anointment','pomazání')|E] dosud nemá schválení. Vyžádej si je pomocí [Concept('interaction','interakce')|E] [Concept('request_anointment','Žádost o pomazání')|E]"
 activity_coronation_province_desc: "Místem konání korunovace bude [ROOT.Province.GetName]"
 activity_coronation_capital_province: "\n#p + Hlavní sídlo#!"
 activity_coronation_holy_site_province: "\n#p + Svaté místo#!"
 activity_coronation_tradition_province: "\n#p + Tradiční místo korunovace#!"
 activity_coronation_long_tradition_province: "\n#p ++ Tradiční místo korunovace#!"
 activity_coronation_ancient_tradition_province: "\n#p +++ Tradiční místo korunovace#!"
 coronation_location_owned: "Mimo [Concept('realm','panství')|E]"
 coronation_location_hof_owned: "[THIS.Province.GetName] #bol není#! [Concept('holy_site','svatým místem')|E] v [Concept('realm','panství')|E] tvé [Concept('head_of_faith','hlavy víry')|E]"
 coronation_location_holy_site_host: "[THIS.Province.GetName] #bol není#! [Concept('holy_site','svatým místem')|E] ve tvém [Concept('realm','panství')|E] (tvá [Concept('head_of_faith','hlava víry')|E] nevlastní žádné [Concept('holy_site','svaté místo')|E])"
 coronation_location_neither_capital_nor_holy_site: "[THIS.Province.GetName] #bol není#! [Concept('county_capital','hlavním sídlem hrabství')|E] ani [Concept('holy_site','svatým místem')|E]"
 coronation_phase_preparations: "Předehra"
 coronation_phase_preparations_desc: ""
 coronation_phase_coronation: "Obřad"
 coronation_phase_coronation_desc: ""
 coronation_phase_feast: "Hostina"
 coronation_phase_feast_desc: ""
 coronation_type_normal: "Korunovace"
 coronation_type_normal_desc: "$BULLET_WITH_TAB$Prokaž svou [legitimacy_i][Concept('legitimacy','legitimitu')|E]\n$BULLET_WITH_TAB$Slož [Concept('oath','přísahu')|E] a zavaž se ke směřování své vlády\n$BULLET_WITH_TAB$Můžeš získat [opinion_i][Concept('opinion','mínění')|E] u [Concept('vassals','vazalů')|E] [AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'coronation_type_tributaries' )]\n$BULLET_WITH_TAB$[Concept('vassals','Vazalové')|E] mohou opustit @faction_icon![Concept('factions','frakce')|E]\n$BULLET_WITH_TAB$Můžeš se korunovat vlastní rukou a získat dodatečnou [prestige_i][Concept('prestige','prestiž')|E]\n\n#weak $coronation_type_normal_flavor$#!"
 coronation_type_normal_flavor: "Důstojný obřad prokáže oprávněnost tvé vlády a majestát panství se stane tvým panovnickým rouchem."
 coronation_type_tributaries: "a [Concept('tributaries','tributářů')|E]"
 coronation_type_anointment: "Pomazání"
 coronation_type_anointment_desc: "$BULLET_WITH_TAB$Prokaž svou [legitimacy_i][Concept('legitimacy','legitimitu')|E] nade vší pochybnost\n$BULLET_WITH_TAB$Získej [piety_i][Concept('piety','zbožnost')|E], @fervor_icon![Concept('fervor','horlivost')|E] a přízeň [Concept('vassals','vazalů')|E], jejichž postoj je [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName|U]\n$BULLET_WITH_TAB$Slož [Concept('oath','přísahu')|E] a zavaž se ke směřování své vlády\n$BULLET_WITH_TAB$Získej [opinion_i][Concept('opinion','mínění')|E] u [Concept('vassals','vazalů')|E]\n$BULLET_WITH_TAB$Získej [opinion_i][Concept('opinion','mínění')|E] u ostatních [Concept('rulers','vládců')|E]\n$BULLET_WITH_TAB$[Concept('vassals','Vazalové')|E] mohou opustit @faction_icon![Concept('factions','frakce')|E]\n$BULLET_WITH_TAB$@alert_icon! #alert_trial Musí se konat na [Concept('holy_site','svatém místě')|E] tvé [Concept('faith','víry')|E]#!\n\n#weak $coronation_type_anointment_flavor$#!"
 coronation_type_anointment_flavor: "Skutečný panovník musí být zahalen posvátným posláním a uveden do úřadu božskou přízní. Světská moc to nenahradí."
 anointment_minimum: "[Concept('activity_option','Možnost aktivity')|E] není dostupná pro [Concept('anointment','pomazání')|E]"
 ceremony_size: "Obřad"
 coronation_small_ceremony: "Prosté obřady"
 coronation_small_ceremony_desc: "$EFFECT_LIST_BULLET$Snížená [Concept('coronation_magnificence','pompéznost')|E]\n$EFFECT_LIST_BULLET$Zahraniční [Concept('rulers','vládci')|E] se [Concept('activity','aktivity')|E] nezúčastní\n$EFFECT_LIST_BULLET$Pokud bude [Concept('coronation_magnificence','pompéznost')|E] na konci nižší než #high 50#!, získáš na #high 10 let#! [GetModifier('ach_coronation_low_ceremony_modifier').GetNameWithTooltip]\n\n#weak Už jsem přece panovníkem, ne? Proč kvůli pouhé formalitě svolávat celé panství...?#!"
 coronation_medium_ceremony: "Tradicí posvěcená nádhera"
 coronation_medium_ceremony_desc: "$EFFECT_LIST_BULLET$Zvýšená [Concept('coronation_magnificence','pompéznost')|E]\n$EFFECT_LIST_BULLET$[Concept('activity_guests','Hosté aktivity')|E] budou mít o něco vyšší šanci se zúčastnit\n\n#weak Posvátným přísahám panovníka musí odpovídat královské prostředí a početné shromáždění naplněné úctou.#!"
 coronation_large_ceremony: "Sláva a nádhera"
 coronation_large_ceremony_desc: "$EFFECT_LIST_BULLET$Výrazně zvýšená [Concept('coronation_magnificence','pompéznost')|E]\n$EFFECT_LIST_BULLET$[Concept('activity_guests','Hosté aktivity')|E] budou mít výrazně vyšší šanci se zúčastnit\n\n#weak Uprostřed posvátných relikvií a třpytivých klenotů, za zvuku nádherné hudby, se shromáždí všichni mí příbuzní, mí vazalové i vážení hosté z dalekých krajů.#!"
 ceremony_feast_type: "Oslavy"
 ceremony_feast_type_austere: "Střídmé oslavy"
 ceremony_feast_type_austere_desc: "$EFFECT_LIST_BULLET$Snížená [Concept('coronation_magnificence','pompéznost')|E]\n$EFFECT_LIST_BULLET$Pokud bude [Concept('coronation_magnificence','pompéznost')|E] na konci nižší než #high 50#!, získáš na #high 10 let#! [SelectLocalization( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'mandala_coronation_low_feast', 'generic_coronation_low_feast' )]\n\n#weak Copak samotné pozvání k této historické události není dostatečným potěšením...?#!"
 generic_coronation_low_feast: "[GetModifier('ach_coronation_low_feast_modifier').GetNameWithTooltip]"
 mandala_coronation_low_feast: "[GetModifier('mandala_coronation_low_feast_modifier').GetNameWithTooltip]"
 ceremony_feast_type_regular: "Patřičné veselí"
 ceremony_feast_type_regular_desc: "$EFFECT_LIST_BULLET$Zvýšená [Concept('coronation_magnificence','pompéznost')|E]\n\n#weak Na velkém shromáždění šlechty ani na vybraných pokrmech následné hostiny se příliš šetřit nebude.#!"
 ceremony_feast_type_lavish: "Okázalé hostiny"
 ceremony_feast_type_lavish_desc: "$EFFECT_LIST_BULLET$Výrazně zvýšená [Concept('coronation_magnificence','pompéznost')|E]\n$EFFECT_LIST_BULLET$Nižší riziko negativních událostí\n\n#weak Čekají nekonečné chody přepychově vonících lahůdek, velkolepé požitky hodné panovnické tabule.#!"
 ach_coronation_low_ceremony_modifier: "Korunovace v ústraní"
 ach_coronation_low_ceremony_modifier_desc: "Prostý lid sotva ví, že je tento vládce skutečně jeho lenním pánem, a šlechta na jeho skromné korunovační obřady s radostí zapomíná."
 ach_coronation_low_feast_modifier: "Uražená šlechta"
 ach_coronation_low_feast_modifier_desc: "Uboze skromné oslavy korunovace tohoto vládce byly pro účastníky urážkou, takže odcházeli plní opovržení a s prázdnými žaludky."
 mandala_coronation_low_feast_modifier: "Uražení poddaní"
 mandala_coronation_low_feast_modifier_desc: "$ach_coronation_low_feast_modifier_desc$"
 coronation_hof_guest: "Hlava víry"
 coronation_hof_guest_desc: "$coronation_hof_guest_desc_for_host$"
 coronation_hof_guest_for_host: "Hlava víry"
 coronation_hof_guest_desc_for_host: "Při [Concept('anointment','pomazání')|E] musí být [Concept('head_of_faith','hlava víry')|E] [Concept('activity_guest','hostem aktivity')|E], aby bylo pomazání považováno za [Concept('legitimate','legitimní')|E].\n\nZajisti si podporu hlavy víry pomocí [Concept('interaction','interakce')|E] [Concept('anointment_request','Žádost o pomazání')|E]."
 doctrine_coronation_name: "Tradice korunovace"
 doctrine_no_anointment_name: "Bez pomazání"
 doctrine_no_anointment_desc: "V této víře se čela vládců nedotýká žádný posvátný olej — jejich cesta k moci se obejde bez pomazání i božského obřadu."
 doctrine_anointment_permitted_name: "Povolené pomazání"
 doctrine_anointment_permitted_desc: "Ani císaři se nepodřizují jedinému obřadu — ačkoli mu může předsedat hlava víry, volba způsobu korunovace náleží samotnému trůnu."
 doctrine_imperial_anointment_name: "Císařské pomazání"
 doctrine_imperial_anointment_desc: "Má-li být císařova vláda nade vší pochybnost, musí pokleknout — neboť jedině hlava víry může udělit onu konečnou a nezpochybnitelnou autoritu."
 doctrine_parameter_no_anointment: "[Concept('characters','Postavy')|E] nemají přístup k [Concept('activity_option','možnosti aktivity')|E] [Concept('coronation_anointment','Pomazání')|E]"
 doctrine_parameter_theocratic_coronation: "[Concept('characters','Postavy')|E] mají přístup k [Concept('activity_option','možnosti aktivity')|E] [Concept('coronation_anointment','Pomazání')|E]"
 doctrine_parameter_imperial_anointment: "[Concept('characters','Postavy')|E] na [Concept('title_tier','úrovni')|E] [Concept('empire','říše')|E] nebo vyšší musí použít [Concept('activity_option','možnost aktivity')|E] [Concept('coronation_anointment','Pomazání')|E], aby získaly [Concept('law','zákon')|E] [GetLaw('crowned_emperor').GetName]"
 doctrine_parameter_coronation_artifact: "[Concept('characters','Postavy')|E] této [Concept('faith','víry')|E] musí vlastnit [Concept('artifact','artefakt')|E] ([FAITH.Custom('CoronationRequiresArtifact')]), aby získaly přístup k dalším [Concept('activity_options','možnostem aktivity')|E]"
 coronation_custom_crown_artifact: "Koruna"
 coronation_custom_regalia_artifact: "Regálie"
 coronation_custom_crown_or_regalia_artifact: "Koruna nebo regálie"
 CORONATION_BASE_COST: "Základní cena [GetActivityType( 'activity_coronation' ).GetName]"
