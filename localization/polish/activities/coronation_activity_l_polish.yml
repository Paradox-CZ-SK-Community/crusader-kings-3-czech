 coronation_impress_attendees: "Zapůsobit na účastníky"
 coronation_impress_attendees_desc: "Budete zosobněním panovníka, získáte [Concept('legitimacy','legitimita')|E], [Concept('cultural_acceptance','kulturní přijetí')|E] a [coronation_i][Concept('coronation_magnificence','pompéznost')|E].\n#EMP #low Tento [Concept('intent','záměr')|E] potěší [GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName] a [GetVassalStance( 'minority' ).GetTextIcon][GetVassalStance( 'minority' ).GetName] [Concept('vassals','vazalové')|E].#!#!" # todo: CONCEPT CASE
 coronation_embrace_supporters: "Získat podporovatele"
 coronation_embrace_supporters_desc: "Váš režim bude postaven věrnými, kteří budou spolupracovat, aby získali [Concept('prestige','prestiž')|E], navázali [Concept('relations','zvláštní vztahy')|E] a obohatili vaše [Concept('realms','panství')|E].\n#EMP #low Tento [Concept('intent','záměr')|E] potěší [Concept('coronation_supporters','podporovatelé')|E], zejména [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName] a [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName] [Concept('vassals','vazalové')|E].#!#!" # todo: CONCEPT CASE
 coronation_weaken_detractors: "Oslabit odpůrce"
 coronation_weaken_detractors_desc: "S tvým korunováním začíná pád [Concept('claimants','pretendenti')|E] a rozpad [Concept('factions','frakce')|E] a [Concept('confederations','konfederace')|E].\n#EMP #low Tento [Concept('intent','záměr')|E] škodí [Concept('coronation_detractors','odpůrci')|E] a potěší ty [Concept('vassals','vazalové')|E], kteří nejsou [Concept('coronation_detractor','odpůrce')|E], zejména [GetVassalStance( 'belligerent' ).GetTextIcon][GetVassalStance( 'belligerent' ).GetName].#!#!" # todo: CONCEPT CASE
 coronation_exalt_crown: "Vyzdvihnout korunu"
 coronation_exalt_crown_desc: "Úcta k vašemu mandátu uděluje [Concept('coronation','korunovace')|E] místům, [Concept('artifacts','artefaktům')|E] a [Concept('oaths','přísahy')|E] trvalé výhody jako [Concept('dynasty_prestige','věhlas')|E].\n#EMP #low Tento [Concept('intent','záměr')|E] potěší [GetVassalStance( 'parochial' ).GetTextIcon][GetVassalStance( 'parochial' ).GetName] [Concept('vassals','vazalové')|E].#!#!" # todo: CONCEPT CASE
 coronation_bear_witness: "Být svědkem"
 coronation_bear_witness_desc: "Účastí na této historické události očekáváte získat [Concept('piety','zbožnost')|E], [Concept('legitimacy','legitimita')|E] a [Concept('cultural_acceptance','kulturní přijetí')|E]." # todo: CONCEPT CASE
 coronation_seize_advantages: "Využít příležitostí"
 coronation_seize_advantages_desc: "[SelectLocalization( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_administrative' ), 'seize_advantages_admin', 'seize_advantages_non_admin' )]"
 seize_advantages_admin: "Pečlivě sledujete příležitosti zajistit si [Concept('gold','zlatu')|E], [Concept('influence','vlivu')|E] nebo [Concept('claims','nároky')|E]." # todo: CONCEPT CASE
 seize_advantages_non_admin: "Pečlivě sledujete příležitosti zajistit si [Concept('gold','zlatu')|E], [Concept('prestige','prestiži')|E] nebo [Concept('claims','nároky')|E]." # todo: CONCEPT CASE
 coronation_offer_support: "Nabídnout podporu"
 coronation_offer_support_desc: "Poskytnutím pevné podpory koruně doufáte, že získáte [Concept('opinion','mínění')|E], [Concept('relation','zvláštní vztah')|E] nebo [Concept('alliance','aliance')|E] s jejím nositelem." # todo: CONCEPT CASE
 coronation_advocate_domain: "Prosazovat doménu"
 coronation_advocate_domain_desc: "Tlačíte na svého vládce, aby prosadil politiky podporující [Concept('development','rozvoj')|E], [Concept('control','kontrola')|E] a [Concept('county_opinion','lidové mínění')|E] ve vašem podřízeném [Concept('realm','panství')|E]." # todo: CONCEPT CASE
 coronation_profess_rights: "Trvat na právech"
