 learning_oath_1_tooltip_need_development: "\n\t$EFFECT_LIST_BULLET$Musíš mít [Concept('county','hrabství')|E] s [development_i][Concept('development','rozvojem')|E] alespoň #V 30#!"
 purge_pretenders_oath_tooltip: "Skládám [Concept('oath','přísahu')|E], že se #V zbavím pretendentů#!:\n\t$EFFECT_LIST_BULLET$Na tvůj [Concept('primary_title','hlavní titul')|E] nesmí mít [Concept('claimant','nárok')|E] žádný [Concept('claimant','pretendent')|E] kromě tvých [Concept('children','dětí')|E]\n\t$EFFECT_LIST_BULLET$Musí být splněno do #V 50 let#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E] a [GetModifier('oath_of_purge_pretenders').GetNameWithTooltip].\n\t$EFFECT_LIST_BULLET$[SelectLocalization(GetPlayer.GetGovernment.IsType('nomad_government'), 'purge_pretenders_oath_nomad', '')][SelectLocalization(GetPlayer.GetGovernment.IsType('administrative_government'), 'purge_pretenders_oath_admin', '')][SelectLocalization(Not(Or(GetPlayer.GetGovernment.IsType('nomad_government'), GetPlayer.GetGovernment.IsType('administrative_government'))), 'purge_pretenders_oath_default', '')]"
