 coronation_events.0100.desc.first_ruler: "Jak budu vládnout jako první [ROOT.Char.GetTitleAsNameNoTooltip|l] těchto zemí?"
 coronation_events.0100.desc.outro: "\n\nNestojím zde jako [ROOT.Char.GetTitleAsNameNoTooltip|l], abych jen opakoval jejich očekávání. Přišel jsem, abych si zvolil vlastní cestu a směr pro [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l].\n\nAť už se z [ROOT.Char.GetPrimaryTitle.GetNameNoTier] stane cokoli — ať už se stanu cokoli — začíná to právě v tomto okamžiku."
