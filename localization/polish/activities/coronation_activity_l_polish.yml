 coronation_events.0110.t: "Přísaha"
 coronation_events.0110.desc.intro: "[activity.GetHost.GetFirstName] stojí s [activity.GetHost.GetHerselfHimself] před davem, zatímco všichni očekávají [activity.GetHost.GetHerHis] přísahu.\n\n"
 coronation_events.0110.desc.diplomacy_oath_1: "#emp „Žádné panství neprosperuje samo o sobě. Moc nespočívá pouze v armádách, ale v poutech důvěry, v dohodách utvrzených slovem a vůlí.\n\nZ [activity.GetHost.GetCapitalLocation.GetName] podám ruku přátelství, spletu aliance, které ochrání [activity.GetHost.GetPrimaryTitle.GetNameNoTier] pro příští generace.„#!"
 coronation_events.0110.desc.diplomacy_oath_2: "#emp „Síla království nespočívá pouze v uzavřených spojenectvích, ale v tichém slibu kontinuity. Zajistěním, že [activity.GetHost.GetHouse.GetName] přetrvá, poskytnu království základ pevný jako kámen.\n\nSkrze naše děti zůstane linie [activity.GetHost.GetHouse.GetName] neporušená, zachová stabilitu a povede naše království skrze vše, co může přijít.„#!"
 coronation_events.0110.desc.martial_oath_1: "#emp „Dnes nevstupuji jen proto, abych vládnul, ale abych budoval. Ne jen abych uchoval to, co je, ale abych tvořil to, co může být. [activity.GetHost.GetPrimaryTitle.GetNameNoTier] nelze omezit na vzpomínky nebo mapu, musí růst.\n\nPro naši budoucnost i budoucnost našeho lidu.„#!"
 coronation_events.0110.desc.martial_oath_2: "#emp „Příliš dlouho země, které patří [activity.GetHost.GetPrimaryTitle.GetNameNoTier], trpěly vládou horších rukou. Těch, kdo spletli vlastnictví s legitimností.\n\nTo dnes končí. Z [activity.GetHost.GetCapitalLocation.GetName] poznají pravé vládnutí. Díky mně.„#!"
 coronation_events.0110.desc.stewardship_oath_1: "#emp „Vládce musí dělat víc než bránit hranice, musí v nich učinit život hoden žití. Budu střežit mír, starat se o panství a plánovat ne pro válku, ale pro růst.\n\nZ [activity.GetHost.GetCapitalLocation.GetName] dovedu [activity.GetHost.GetPrimaryTitle.GetNameNoTier] do nového zlatého věku.„#!"
 coronation_events.0110.desc.stewardship_oath_2: "#emp „Ne všechna dědictví se rodí ve válce. Některá jsou vykována v kameni, potem a cílem. Přetvořím [activity.GetHost.GetPrimaryTitle.GetNameNoTier] prostřednictvím památníků hodných budoucnosti.\n\nZ [activity.GetHost.GetCapitalLocation.GetName] vybuduji panství, které nejen přežije, ale vstoupí do zlatého věku formovaného péčí a vizí.„#!"
 coronation_events.0110.desc.learning_oath_1: "#emp „Ať žádný vládce nepomýlí nevědomost za sílu. Panství vedené poznáním přetrvá déle než jakékoli postavené pouze na strachu.\n\nZ [activity.GetHost.GetCapitalLocation.GetName] shromáždím nejlepší mysli a skrze jejich radu utvořím budoucnost [activity.GetHost.GetPrimaryTitle.GetNameNoTier].„#!"
 coronation_events.0110.desc.purge_pretenders_oath: "#emp „Falešní nárokovači na [activity.GetHost.GetPrimaryTitle.GetName] se množí jako potkani v kanalizaci. A jako škůdci musejí být vyhlazeni.“#!"
 coronation_events.0110.desc.end_the_struggle_oath: "#emp „Ten [activity.GetHost.MakeScope.Var('end_the_struggle_oath_type_var').Struggle.GetName] pomalu vysával generace dobrých [activity.GetHost.GetCulture.GetCollectiveNoun]. Už ne. Přinesu tomu definitivní konec a zahájím v regionu novou éru společného blahobytu, tak mi pomoz [activity.GetHost.GetFaith.HighGodName].“#!"
 coronation_events.0110.desc.greatest_hunter_oath: "#emp „Lov není jen zkouškou dovednosti, ale oslavou života a přírody. Stanu se největším lovcem, pánem divočiny, pravým vládcem nespoutaných vnitrozemí [activity.GetHost.GetPrimaryTitle.GetNameNoTier].“#!"
 coronation_events.0110.desc.heir_preparation_oath: "#emp „Bez vhodného dědice je [activity.GetHost.GetDynasty.GetName] odsouzena k zániku. Budu řídit vzdělání svého dědice a vštípit mu hodnoty a moudrost potřebné k pozvednutí [activity.GetHost.GetDynasty.GetName] do nových výšin.“#!"
 coronation_events.0110.desc.install_claimants_oath: "#emp „Právo na trůn není jen otázkou krve, ale spravedlnosti. Uvedu právoplatné nárokovatele na jejich trůny, sesadím uzurpátory a obnovím pořádek.“#!"
 coronation_events.0110.desc.mend_the_fracture_oath: "#emp „Kulturní rozkol v říši způsobil příliš dlouho sváry. Sjednotím národy pod společným praporem [activity.GetHost.GetHouse.GetName], přičemž jejich identity zůstanou nedotčené.“#!"
 coronation_events.0110.desc.provide_for_the_warriors_oath: "#emp „Válečníci [activity.GetHost.GetPrimaryTitle.GetNameNoTier] jsou můj meč a štít. Zajistím, že budou dobře vybaveni a připraveni bránit naše země.“#!"
 coronation_events.0110.desc.provide_for_the_faithful_oath: "#emp „Věřící [activity.GetHost.GetPrimaryTitle.GetNameNoTier] jsou páteří mého panství. Zajistím, že budou uspokojeny jejich pozemské potřeby a umožním jim, aby se mohli věnovat jako oddaní služebníci [ROOT.Char.GetFaith.HighGodName], soustředěni na spásu mého [activity.GetHost.GetPrimaryTitle.GetTierAsNamePossessive].“#!"
 coronation_events.0110.desc.provide_for_the_poor_oath: "#emp „Chudí [activity.GetHost.GetPrimaryTitle.GetNameNoTier] jsou solí země, světlem světa. Ticho dřou ku prospěchu všech. Zajistím, že i ti nejchudší v mém panství budou moci žít s důstojností a nadějí.“#!"
 coronation_events.0110.desc.repent_oath: "#emp „Co může změnit povahu [activity.GetHost.GetWomanMan]? Stačí má vůle? Dokážu přesvědčit ostatní [activity.GetHost..GetFaith.GetAdherentNamePlural], dokážu přesvědčit [activity.GetHost.GetFaith.HighGodName], že se opravdu kajím za své hříchy? Může to být pošetilost se to pokoušet, ale největším hříchem by bylo to neudělat.“#!"
 coronation_events.0110.desc.fallback_compassionate: "#emp „Slibuji dodržovat všechny spravedlivé zákony a zvyky [activity.GetHost.GetPrimaryTitle.GetAdjective] lidu; vládnout s laskavou moudrostí a soudit s milosrdnou grácií.“#!" # todo: NEW TRANSLATION
 coronation_events.0110.desc.fallback_honorable: "#emp „Slibuji zachovat pokoj a soulad [activity.GetHost.GetFaith.HighGodNamePossessive] [activity.GetHost.GetFaith.AltPriestTermPlural] v [activity.GetHost.GetPrimaryTitle.GetNameNoTier], a svou ctí střežit svobody a práva mého lidu.“#!" # todo: NEW TRANSLATION
 coronation_events.0110.desc.fallback_feckless: "#emp „Já... ehm... skládám patřičné přísahy [activity.GetHost.GetPrimaryTitle.GetNameNoTierPossessive] [activity.GetHost.GetTierAsName]... budu od nynějška činit, co požadují [activity.GetHost.GetFaith.AltPriestTermPlural], a odpovídat, když říše zavolá po svém [activity.GetHost.GetTierAsNameNoTooltip], a tak dále...“#!" # todo: NEW TRANSLATION
 coronation_events.0110.desc.fallback: "#emp „Moje vláda bude těmi, kdo přijdou po mně, zapamatována jako počátek zlatého věku pro [activity.GetHost.GetPrimaryTitle.GetNameNoTier].“#!"
 coronation_events.0110.regular: "Uvidíme, jestli [activity.GetHost.GetSheHe] dokáže naplnit očekávání..."
 coronation_events.0110.no_oath: "Jaké zklamání..."
 coronation_events.0110.desc.outro: ""
 coronation_events.0150.t: "Porušená přísaha: [SCOPE.Custom('GetOathSpecific')|V]"
 coronation_events.0150.desc: "Slyším jejich šeptání za zavřenými dveřmi. Vidím zklamání vyryté v jejich očích. A cítím tíhu hanby, která se na mě hrne.\n\nVšichni vědí - selhal jsem. Porušil jsem přísahu, kterou jsem [Select_CString(ROOT.Char.IsFemale,'složila','složil')], slib, který jsem dal všem svým poddaným.\n\nJak jim teď čelit? Jak nést tuto ostudu?"
 coronation_events.0150.desc_honest: "Moc přišla se slibem. Stál jsem před panstvím a [Select_CString(ROOT.Char.IsFemale,'složila','složil')] přísahu, v kterou věřili - přísahu, #emp já#! jsem v ni věřil.\n\nNyní se trůn jeví spíš jako hrob než sedadlo. Studená, pozlacená klec, která se mi vysmívá každým dechem. A nejhorší je vědomí, že je to celé moje vina."
 coronation_events.0150.desc_deceitful: "Ať si šeptají. Ať zírají s poraněnou pýchou a dutým zklamáním. Vidím to. Cítím jejich soud jako čepel u zad.\n\nAle hanba? Ne, hanba je pro ty, kdo kdy mysleli, že své sliby dodrží.\n\nPřísaha je posvátná jen pro blázny."
 coronation_events.0150.a: "Ostuda..."
 coronation_events.0150.a_honest: "Jak s touto hanbou budu žít?"
 coronation_events.0150.a_deceitful: "Co už se dá dělat."
 coronation_events.150.custom_list_tooltip: "Každý [Concept('vassal','vazal')|E], [Concept('courtier','dvořan')|E] nebo [Concept('guest','host')|E]" # todo: CONCEPT CASE
 coronation_events.0175.t: "Splněná přísaha: [SCOPE.Custom('GetOathSpecific')|V]"
 coronation_events.0175.desc: "Moje práce je hotova, přesně tak, jak jsem řekl. Slyšel jsem posměch svých odpůrců, jejich přesvědčení, že selžu, když jsem [Select_CString(ROOT.Char.IsFemale,'složila','složil')] přísahu.\n\nAle vyvedl jsem je z omylu. Hlasy mých pochybovačů se změnily a nyní mi dávají poctu, kterou dříve považovali za nedostižnou.\n\nPřichází nový den..."
 coronation_events.0175.a: "A silnější [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] je připraven vyjít mu vstříc!"
 diplomacy_oath_1_tooltip: "Zdávám [Concept('oath','přísaha')|E] #V Zajistit spojenectví#!:\n\t$EFFECT_LIST_BULLET$Musíte mít alespoň #V 3#! [Concept('alliances','aliance')|E] s [Concept('rulers','vládci')|E], kteří:\n\t\t$EFFECT_LIST_BULLET$Mají alespoň #V 50#! [Concept('opinion','mínění')|E] k #V vám#!\n\t\t$EFFECT_LIST_BULLET$Jedno z následujícího:\n\t\t\t$EFFECT_LIST_BULLET$O jednu [Concept('title_tier','úroveň')|E] nižší\n\t\t\t$EFFECT_LIST_BULLET$Stejný [Concept('title_tier','úroveň')|E]\n\t\t\t$EFFECT_LIST_BULLET$Vyšší [Concept('title_tier','úroveň')|E]\n\t$EFFECT_LIST_BULLET$Musí být dokončeno do #V 20 Years#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E], [opinion_i][Concept('opinion','mínění')|E], [cultural_acceptance_i][Concept('cultural_acceptance','kulturní přijetí')|E], a [GetModifier('oath_of_alliances').GetNameWithTooltip]" # todo: CONCEPT CASE
