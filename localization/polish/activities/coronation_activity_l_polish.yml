 purge_pretenders_oath_tooltip: "Zdávám [Concept('oath','přísaha')|E] k #V Vyhlazení nárokovačů#!:\n\t$EFFECT_LIST_BULLET$Žádný [Concept('claimant','pretendent')|E] na váš [Concept('primary_title','hlavní titul')|E], kromě vašich [Concept('children','dětí')|E], nesmí existovat\n\t$EFFECT_LIST_BULLET$Musí být dokončeno do #V 50 let#!\n\t$EFFECT_LIST_BULLET$Odměny: [legitimacy_i][Concept('legitimacy','legitimita')|E], [prestige_i][Concept('prestige','prestiž')|E] a [GetModifier('oath_of_purge_pretenders').GetNameWithTooltip].\n\t$EFFECT_LIST_BULLET$[SelectLocalization(GetPlayer.GetGovernment.IsType('nomad_government'), 'purge_pretenders_oath_nomad', '')][SelectLocalization(GetPlayer.GetGovernment.IsType('administrative_government'), 'purge_pretenders_oath_admin', '')][SelectLocalization(Not(Or(GetPlayer.GetGovernment.IsType('nomad_government'), GetPlayer.GetGovernment.IsType('administrative_government'))), 'purge_pretenders_oath_default', '')]" # todo: CONCEPT CASE
