 coronation_events.0100.t: "Přísaha na věky"
 coronation_events.0100.desc.opening: "Shromáždění mě sleduje. Někteří s nadějí, jiní s pochybnostmi, všichni čekají, až promluvím o své vládě a přísahou se zavážu budoucnosti. Slyším i otázky, které nevyslovují. Budu vládnout spravedlivě? Budu jednat nestranně?"
 coronation_events.0100.desc.previous_ruler_close_family: "[Select_CString(previous_ruler.IsFemale, 'Dokážu se vyrovnat té, která vládla přede mnou? Je to má', 'Dokážu se vyrovnat tomu, kdo vládl přede mnou? Je to můj')] [ROOT.Char.Custom2( 'RelationToMeShort', previous_ruler )]?"
 coronation_events.0100.desc.previous_ruler_not_family_no_house: "[Select_CString(previous_ruler.IsFemale, 'Překonám svou předchůdkyni', 'Překonám svého předchůdce')], [previous_ruler.GetFirstNameNicknamed]?"
 coronation_events.0100.desc.previous_ruler_not_family: "[Select_CString(previous_ruler.IsFemale, 'Překonám svou předchůdkyni', 'Překonám svého předchůdce')], [previous_ruler.GetFullNameNoTooltip]?"
 coronation_events.0100.desc.first_ruler: "Jak budu vládnout jako vůbec první [ROOT.Char.GetTitleAsNameNoTooltip|l] těchto zemí?"
 coronation_events.0100.desc.outro: "\n\nJako [ROOT.Char.GetTitleAsNameNoTooltip|l] tu nejsem pouhou ozvěnou jejich očekávání. Volím si vlastní cestu a směr, kterým se [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] vydá.\n\n[ROOT.Char.GetPrimaryTitle.GetNameNoTier] a já — cokoli se z nás stane — všechno začíná právě tímto okamžikem."
