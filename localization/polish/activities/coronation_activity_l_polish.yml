 crowned_laws: "Korunovační zákony"
 uncrowned: "Nekorunovaný"
 crowned_king: "Korunovaný panovník"
 crowned_emperor: "Pomazaný panovník"
 can_only_be_passed_through_coronation: "Lze získat pouze uspořádáním této aktivity: [GetActivityType( 'activity_coronation' ).GetName]"
 can_only_be_lost_through_losing_titles: "Korunovace již proběhla"
 already_better_coronation: "Pomazání již proběhlo"
 already_coronated_trigger: "Korunovace již proběhla"
 coronation_no_crown_trigger: "Tvá víra vyžaduje Korunu jako [Concept('artifact','artefakt')|E]. Lze ji nechat zhotovit pomocí [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('commission_artifact_decision').GetName]"
 coronation_no_regalia_trigger: "Tvá víra vyžaduje Regálie jako [Concept('artifact','artefakt')|E]. Lze je nechat zhotovit pomocí [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('commission_artifact_decision').GetName]"
 coronation_no_crown_or_regalia_trigger: "Tvá víra vyžaduje Korunu nebo Regálie jako [Concept('artifact','artefakt')|E]. Lze je nechat zhotovit pomocí [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('commission_artifact_decision').GetName]"
 coronation_impress_attendees: "Zapůsobit na účastníky"
 coronation_impress_attendees_desc: "Budeš samotným ztělesněním panovníka a získáš [Concept('legitimacy','legitimitu')|E], [Concept('cultural_acceptance','kulturní přijetí')|E] a [coronation_i][Concept('coronation_magnificence','pompéznost')|E].\n#EMP #low Tento [Concept('intent','záměr')|E] potěší [Concept('vassals','vazaly')|E] s postoji [GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName] a [GetVassalStance( 'minority' ).GetTextIcon][GetVassalStance( 'minority' ).GetName].#!#!"
 coronation_embrace_supporters: "Spojit se s podporovateli"
 coronation_embrace_supporters_desc: "Tvá vláda bude stát na věrných, s nimiž spoluprací získáš [Concept('prestige','prestiž')|E], navážeš [Concept('relations','zvláštní vztahy')|E] a obohatíš svá [Concept('realms','panství')|E].\n#EMP #low Tento [Concept('intent','záměr')|E] potěší [Concept('coronation_supporters','podporovatele')|E], zejména [Concept('vassals','vazaly')|E] s postoji [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName] a [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName].#!#!"
 coronation_weaken_detractors: "Oslabit odpůrce"
 coronation_weaken_detractors_desc: "S tvou korunovací začíná pád [Concept('claimants','pretendentů')|E] a rozklad [Concept('factions','frakcí')|E] a [Concept('confederations','konfederací')|E].\n#EMP #low Tento [Concept('intent','záměr')|E] škodí [Concept('coronation_detractors','odpůrcům')|E] a potěší [Concept('vassals','vazaly')|E] s postojem [GetVassalStance( 'belligerent' ).GetTextIcon][GetVassalStance( 'belligerent' ).GetName], kteří nejsou [Concept('coronation_detractors','odpůrci')|E].#!#!"
 coronation_exalt_crown: "Vyvýšit korunu"
 coronation_exalt_crown_desc: "Úcta k tvému panovnickému mandátu propůjčí místům [Concept('coronation','korunovace')|E], [Concept('artifacts','artefaktům')|E] a [Concept('oaths','přísahám')|E] trvalé výhody, například [Concept('dynasty_prestige','věhlas')|E].\n#EMP #low Tento [Concept('intent','záměr')|E] potěší [Concept('vassals','vazaly')|E] s postojem [GetVassalStance( 'parochial' ).GetTextIcon][GetVassalStance( 'parochial' ).GetName].#!#!"
 coronation_bear_witness: "Být svědkem"
 coronation_bear_witness_desc: "Svou účastí na této historické události očekáváš zisk [Concept('piety','zbožnosti')|E], [Concept('legitimacy','legitimity')|E] a [Concept('cultural_acceptance','kulturního přijetí')|E]."
 coronation_seize_advantages: "Využít příležitostí"
 coronation_seize_advantages_desc: "[SelectLocalization( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_administrative' ), 'seize_advantages_admin', 'seize_advantages_non_admin' )]"
 seize_advantages_admin: "Bedlivě vyhlížíš příležitosti, jak si zajistit [Concept('gold','zlato')|E], [Concept('influence','vliv')|E] nebo [Concept('claims','nároky')|E]."
 seize_advantages_non_admin: "Bedlivě vyhlížíš příležitosti, jak si zajistit [Concept('gold','zlato')|E], [Concept('prestige','prestiž')|E] nebo [Concept('claims','nároky')|E]."
 coronation_offer_support: "Nabídnout podporu"
 coronation_offer_support_desc: "Pevnou podporou koruně doufáš ve zlepšení [Concept('opinion','mínění')|E], navázání [Concept('relation','zvláštního vztahu')|E] nebo uzavření [Concept('alliance','aliance')|E] s nositelem koruny."
 coronation_advocate_domain: "Prosazovat zájmy panství"
 coronation_advocate_domain_desc: "Naléháš na svého panovníka, aby prosazoval politiku podporující [Concept('development','rozvoj')|E], [Concept('control','kontrolu')|E] a [Concept('county_opinion','lidové mínění')|E] ve tvém podřízeném [Concept('realm','panství')|E]."
 coronation_profess_rights: "Hájit svá práva"
 coronation_profess_rights_desc: "Hrdě a neústupně požaduješ od svého lenního pána [Concept('hook','páku')|E] za laskavost nebo zlepšení [Concept('vassal_contract','vazalské smlouvy')|E]."
