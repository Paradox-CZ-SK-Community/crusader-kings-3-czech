 custom.every_friendly_vassal: "Každý loajální [Concept('vassal','vazal')|E] a každý vazal mezi [Concept('coronation_supporters','podporovateli korunovace')|E]"
 custom.every_compassionate_trusting_supporter: "Každá přítomná soucitná či důvěřivá postava a každý [Concept('coronation_supporter','podporovatel korunovace')|E]"
