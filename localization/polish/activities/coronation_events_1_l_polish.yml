l_polish:
 coronation_events.1000.t: "Výsměch, který straší"
 coronation_events.1000.low_county_opinion.desc: "Bard si s potutelným úsměvem prohlédne shromáždění.\n\n„Tuto píseň věnuji [ROOT.Char.GetName] jménem lidu z [ROOT.Char.GetCurrentLocation.GetName]. Nese název ‚Ó [ROOT.Char.GetTitledFirstNameNoTooltip], lásko našich srdcí!‘“\n\nMelodie je veselá, ale jak píseň pokračuje, zahlédnu v pěvcově oku záblesk škodolibosti a zaslechnu tlumený smích několika hostů.\n\nLáska, jen co je pravda..."
 coronation_events.1000.rival.desc: "Uprostřed veselí zahlédnu [rival.GetName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival'))], jak podstrkuje bardovi několik mincí. O chvíli později hudebník slavnostně oznámí:\n\n„Tato skladba je darem od [rival.GetNameNoTooltip] pro [ROOT.Char.GetName]! Jmenuje se ‚[ROOT.Char.GetFirstNameNoTooltip], [ROOT.Char.Custom('InsultNoun')|U]‘!“\n\nRozhlédnu se po davu a spatřím [rival.GetFirstNameNoTooltip] s [rival.Custom('InsultAdjective')] úšklebkem ve tváři. Píseň je bohužel až překvapivě chytlavá."
 coronation_events.1000.tyrant.desc: "Bard s tváří rozpálenou vzdorem vykročí vpřed a spustí baladu:\n\n„Hle, [ROOT.Char.GetName], Železná pěst!“\n\nSkrz síň se rozléhá jeden jízlivý verš za druhým, každý prosycený jedovatou chválou. Zatínám zuby, zatímco posměšná melodie sílí a líčí mou vládu jako pouhou malichernou tyranii."
 coronation_events.1000.desc_fallback: "Bard zakončí strhující píseň okázalým gestem a poté prohlásí:\n\n„Tato píseň patří [ROOT.Char.GetName] a nese název ‚[ROOT.Char.GetFirstNameNoTooltip], [ROOT.Char.Custom('InsultNoun')|U]‘!“\n\nSál na okamžik ztichne, načež se davem rozléhá burácivý smích. Melodie je překvapivě strhující."
 coronation_events.1000.bribe: "Zaplatím za píseň, která mě bude opěvovat."
 coronation_events.1000.epic_rap_battle: "Mým rouchem bude můj důvtip!"
 coronation_events.1000.epic_rap_battle.tt.success: "Dokážeš si získat dav"
 coronation_events.1000.epic_rap_battle.tt.failure: "Ve snaze získat korunu se před všemi ztrapníš"
 coronation_events.1000.guards: "Stráže, zatkněte toho [bard.Custom('InsultNoun')]!"
 coronation_events.1002.t: "Kde je?"
 coronation_events.1002.desc: "Má domácnost je sice proslulá ledasčím, pořádkem však rozhodně ne. Předsálí je plné tlumených omluv, zatímco služebnictvo zápasí s rouchy a přípravami na poslední chvíli. Zbytečnosti. To nejcennější a nejdůležitější je přece určitě v bezpečí. Třeba má koruna. Počkat.\n\nKde je moje koruna?!"
 coronation_events.1002.rival.desc: "Jen několik okamžiků před korunovací sáhnu po koruně... a je pryč! Zachvátí mě panika, když v koutě zahlédnu [rival.GetName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival'))]. Pohled bloudí po prázdném podstavci a ten [rival.Custom('InsultAdjective')] poloúsměv jako by mě přímo vyzýval k obvinění.\n\nVedle mě je [helper.GetName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('helper'))], kdo si hrozivé situace okamžitě všimne a přiskočí na pomoc. Není čas pochybovat, musím jednat!"
 coronation_events.1002.find: "Je načase v tomhle nepořádku udělat pořádek!"
 coronation_events.1002.counterfeit: "Naštěstí to byla jen napodobenina."
 coronation_events.1002.hold: "Bídní ničemové! Za tohle vás nechám zbičovat!"
 coronation_events.1002.accuse: "Tak teď už jsi to přehnal, ty [rival.Custom('InsultAdjective')] [rival.Custom('InsultNoun')]!"
 coronation_events.1002.accuse.flavor: "Tumáš!"
 coronation_events.1002.friend: "Naštěstí mám po boku [helper.GetFirstNameNoTooltip]."
 coronation_events.1004.t: "Šepot při hostině"
 coronation_events.1004.desc: "[confidant.Custom2('MyCharacterIntroduction', ROOT.Char)] a já si stranou od davu tiše svěřujeme důvěrnosti. Když [confidant.GetFirstNameNoTooltip] bez obalu přizná, že [secret_to_reveal.Custom('SecretDescriptionThirdPerson')], všimnu si poblíž [Select_CString(spy.IsFemale, 'jakési ženy', 'jakéhosi muže')], [Select_CString(spy.IsFemale, 'která se k nám naklání a snaží se zachytit každé slovo', 'který se k nám naklání a snaží se zachytit každé slovo')].\n\nKdoví, jakou ničemnost má [spy.GetFirstName] za lubem. To se [spy.GetFirstName] nesmí dozvědět. Takové narušení důvěry nemohu připustit."
 coronation_events.1004.bribe: "„Kolik chceš za své mlčení?“"
 coronation_events.1004.recruit: "„Někdo jako ty by se mi mohl hodit...“"
 coronation_events.1004.intimidation: "#EMP Probodnout [spy.GetFirstName] vražedným pohledem.#!"
 coronation_events.1004.intimidation.tt.success: "Tvůj děsivý výstup [spy.GetTitledFirstNameNoTooltip] vyděsí"
 coronation_events.1004.intimidation.tt.failure: "Tvé výhrůžky na [spy.GetTitledFirstNameNoTooltip] nezapůsobí"
 coronation_events.1004.guards: "Odvlečte toho [spy.Custom2('InsultNoun', ROOT.Char)] do kobky!"
 coronation_events.1004.opt-out: "„Do toho mi nic není.“"
 coronation_events.1007.t: "Otázka přednosti"
 coronation_events.1007.desc: "Průvod má každou chvíli vyrazit, když zaslechnu, jak se [first_guest.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('first_guest'))], hádá s [second_guest.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('second_guest'))], o to, kdo půjde v čele při vstupu na obřad.\n\nJejich hádka se rozléhá předsálím. Jeden tvrdí, že je přece ze všech nejvíc [first_guest.Custom('ComplimentAdjective')], a proto si prvenství zaslouží, zatímco druhý namítá, že právě on je nejvíc [second_guest.Custom('ComplimentAdjective')].\n\nMusím přiznat, že mi to lichotí."
 coronation_events.1007.guest.desc: "Stojím na prahu a chystám se vyrazit v čele korunovačního průvodu, když se [second_guest.GetFirstName] protlačí dopředu a pohrdavě odfrkne.\n\n„Má služba koruně mi dává právo jít první!“\n\nTak drzé zpochybnění mého postavení narušuje posvátnost našich příprav."
 coronation_events.1007.bigger: "Prosím, [second_guest.GetFirstNameNoTooltip], jen do toho."
 coronation_events.1007.demand: "Je to mé právo, vždyť jsem ze všech nejvíc [first_guest.Custom('ComplimentAdjective')]!"
 coronation_events.1007.appease: "Pojďte, najdeme společné řešení..."
 coronation_events.1007.first_guest: "Ať jde první [first_guest.GetFirstNameNoTooltip], vždyť je to [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('first_guest'))]!"
 coronation_events.1007.second_guest: "[second_guest.GetFirstNameNoTooltip], tohle právo sis zasloužil."
 coronation_events.1007.opt_out: "Proč bych se do toho měl plést?"
 coronation_events.1011.t: "Přetěžká je koruna"
 coronation_events.1011.desc: "V tichu před mou korunovací úředníci odhalí [ancestor_artifact.GetName]! Jeho lesk jako by zpíval o vítězstvích mých předků.\n\nVzpomenu si na [previous_holder.GetTitledFirstNameRegnal], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('previous_holder'))]. [previous_holder.GetTitledFirstNameRegnal] [Select_CString(previous_holder.IsFemale, 'proslula', 'proslul')] mistrovstvím v [previous_holder.Custom('education_focus')], které utvářelo požehnanou vládu minulých let. Také má vlastní vláda se zapíše skutky v [ROOT.Char.Custom('education_focus')]. Mé činy pak obohatí [ancestor_artifact.GetName] a artefakt začne zpívat nové písně na důvěrně známé téma."
 coronation_events.1011.refit: "Svou pověst si ukovu sám."
 coronation_events.1011.previous: "Tento artefakt ctí odkaz, který zanechal [previous_holder.GetFirstNameNoTooltipRegnal]."
 coronation_events.1011.root_reward.tt: "#weak Nový [Concept('modifier','modifikátor')|E] [Concept('skill','dovednosti')|E] tohoto [Concept('artifact','artefaktu')|E] vychází z typu [Concept('education','vzdělání')|E]#!"
 coronation_events.1011.previous_reward.tt: "Zachování původního účelu koruny posílí artefakt modifikátory, které ctí vzdělání tvého předchůdce."
