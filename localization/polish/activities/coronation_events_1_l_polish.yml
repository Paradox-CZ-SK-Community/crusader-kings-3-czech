 ach_maintenance_events.0100.t: "[host.GetTitleAsNameNoTooltip] umírá"
 ach_maintenance_events.0100.desc: "[host.GetName] [host.GetDeathReason] v předvečer nástupu na trůn. Nezbývá mi než shromáždit svůj doprovod a odjet."
 ach_maintenance_events.0100.a: "Kéž se [ROOT.Char.GetFaith.HighGodName] smiluje nad [host.GetPrimaryTitle.GetNameNoTooltip]."
 ach_maintenance_events.0101.t: "[host.GetTitleAsNameNoTooltip] ve vězení"
 ach_maintenance_events.0101.desc: "V předvečer nástupu na trůn byla postava [host.GetName] uvězněna postavou [gaoler.GetName]. Podrobnosti tohoto troufalého činu jsou stále neznámé a stejně tak zůstává záhadou, co [gaoler.GetName] s novým vězněm zamýšlí. Nezbývá mi než shromáždit svůj doprovod a odjet."
 ach_maintenance_events.0101.a: "$ach_maintenance_events.0100.a$"
 ach_maintenance_events.0102.t: "$ach_maintenance_events.0101.t$"
 ach_maintenance_events.0102.desc: "Ten [ROOT.Char.Custom('InsultAdjective')] [ROOT.Char.Custom('InsultNoun')], [gaoler.Custom('GetDaughterSon')] [ROOT.Char.Custom('InsultAdjective')] [ROOT.Char.Custom('InsultNounPlural')], mě nechal uvěznit #EMP během mé vlastní korunovace!#! Obřad je zrušen a můj osud nejistý."
 ach_maintenance_events.0102.a: "$ach_maintenance_events.0100.a$"
 ach_maintenance_events.0103.t: "Osamělá korunovace"
 ach_maintenance_events.0103.desc: "Na mou korunovaci nikdo nepřišel! Bez poddaných, kteří by byli svědky mého nástupu, jsem [host.GetTitleAsNameNoTooltip] jen sám pro sebe a ve vlastních představách.\n\nMusím obřady zrušit. Na tuto urážku nezapomenu."
 ach_maintenance_events.0103.a: "$ach_maintenance_events.0100.a$"
 ach_maintenance_events.0104.t: "Smrt obřadníka"
 ach_maintenance_events.0104.desc: "[officiator.GetName], obřadník korunovace, [officiator.GetDeathReason] v předvečer nástupu postavy [host.GetName] na trůn. Korunovace byla kvůli této ztrátě z rozhodnutí [host.GetTitledFirstName] zrušena. Nezbývá mi než shromáždit svůj doprovod a odjet."
 ach_maintenance_events.0104.a: "$ach_maintenance_events.0100.a$"
 ach_maintenance_events.0105.t: "Exkomunikace postavy [host.GetTitleAsNameNoTooltip]"
 ach_maintenance_events.0105.desc: "V nekonečné moudrosti a pod vedením božské vůle se [hof.GetName] v předvečer nástupu postavy [host.GetName] na trůn rozhodl pro její exkomunikaci. Nezbývá mi než shromáždit svůj doprovod a odjet."
 ach_maintenance_events.0105.a: "$ach_maintenance_events.0100.a$"
 ach_maintenance_events.0106.t: "$ach_maintenance_events.0105.t$"
 ach_maintenance_events.0106.desc: "Ten [ROOT.Char.Custom('InsultAdjective')] [ROOT.Char.Custom('InsultNoun')], [hof.Custom('GetDaughterSon')] [ROOT.Char.Custom('InsultAdjective')] [ROOT.Char.Custom('InsultNounPlural')], mě #EMP exkomunikoval!#! A to v předvečer mého pomazání! Nevedla ho k tomu božská vůle. Za tímto urážlivým a rouhačským činem stál našeptávající [ROOT.Char.GetFaith.DevilName].\n\nMusím obřady zrušit. Na tuto urážku nezapomenu."
 ach_maintenance_events.0106.a: "$ach_maintenance_events.0100.a$"
 coronation_events.1034.t: "Obřadní roucho"
 coronation_events.1034.desc: "„Takže [host.GetTitleAsName] se odvažuje nosit [detractor.Custom('GetComplexColor')] [detractor.Custom('RegionalFabric')]?“ zamumlá [detractor.Custom2('MyCharacterIntroduction', ROOT.Char)] a přimhouří oči. „Tyto barvy náležejí ctnosti a postavení, ne marnivosti. Kdybych takový odstín nosil bez svolení já, čekalo by mě pokárání.“\n\n„Pokárání?“ vloží se do hovoru [supporter.Custom2('MyCharacterIntroduction', ROOT.Char)]. „To roucho svolení má. Ctí obřady starší než naši pradědové. Harmonie, rovnováha, právoplatná vláda — to není marnivost, ale legitimita.“\n\nJejich tlumená, ale prudká slova řežou vzduch. Pohlédnu na vlastní rukávy. Konečná volba je stále na mně... jenže teď přemýšlím, co mé roucho vyhlásí světu, až vstoupím do sálu."
 coronation_events.1034.a: "Mé roucho zastíní i [host.GetTitledHouseNameOrFirstName]!"
 coronation_events.1034.a.tt: "O následcích této volby rozhodne [host.GetTitledHouseNameOrFirstName]"
 coronation_events.1034.b: "Zvolím stejné barvy jako [host.GetTitledHouseNameOrFirstName] a nenápadně tak projevím svou věrnost."
 coronation_events.1034.c: "Obleču se tak, jak předepisují obřady."
 coronation_events.1034.d: "Zvolím barvy hlavního města."
 coronation_events.1035.t: "Zakázaný odstín"
 coronation_events.1035.desc: "Jakmile se objeví [offending_guest.Custom2('MyCharacterIntroduction', ROOT.Char)], okamžitě se ozve šeptání. Jeho roucho — přepychové, oslnivé a nepatřičné jeho postavení — neporušuje jen zvyklosti. Ohýbá samotný zákon.\n\n[offending_guest.GetFirstName] ke mně přistoupí se samolibým úsměvem. „Co na to říkáte, [ROOT.Char.Custom('FormOfAddressForLiege')]?“"
 coronation_events.1035.a: "Ať si [offending_guest.GetFirstNameNoTooltip] užije svůj okamžik."
 coronation_events.1035.a.toast: "[host.GetTitledHouseNameOrFirstName] přehlédl provinění"
 coronation_events.1035.b: "Takové porušení pravidel nezůstane bez následků."
 coronation_events.1035.b.toast: "[host.GetTitledHouseNameOrFirstName] se cítil uražen"
 coronation_events.1035.c: "Promluvím si s [offending_guest.GetFirstNameNoTooltip] v soukromí. Varování možná postačí."
 coronation_events.1035.c.toast: "[host.GetTitledHouseNameOrFirstName] udělil soukromé varování"
 coronation_events.1036.t: "Verše přes stůl"
 coronation_events.1036.china.desc: "[host.Custom('GetExpensiveDrink_Singular')|U] teče proudem, číše cinkají a síň se chvěje smíchem, dokud se nad hluk nepovznese jasný hlas.\n\n„Proměňme tuto hostinu ve verše,“ prohlásí [verse_initiator.Custom2('MyCharacterIntroduction', ROOT.Char)] poté, co dokončí vytříbené [Glossary('lüshi', 'GLOSS_LUSHI')] oslavující [host.Custom2('MyCharacterIntroduction', ROOT.Char)]. „Taková klání prověřují člověka v [Glossary('wen', 'CONFUCIAN_WEN')], jak se mezi učenci sluší.“\n\nSpolečnost ožije — někteří dychtí předvést svou učenost, jiní se obávají skrytých ostnů ve verších."
 CONFUCIAN_WEN: "Označuje kultivovanou vytříbenost, zušlechťující moc literatury, obřadů a výmluvnosti v čínském myšlení."
 GLOSS_LUSHI: "Jde o regulovanou formu poezie s přísnými tónovými vzorci a paralelismem. Mistrovství v lüshi je známkou kultivované učenosti."
 coronation_events.1036.japan.desc: "Síň naplňuje vůně [host.Custom('GetExpensiveDrink_Singular')] a šelest [host.Custom('RegionalFabric')], když se s uvážlivou elegancí ozve hlas.\n\n„Nesložíme k tomuto shromáždění verše?“ navrhne [verse_initiator.Custom2('MyCharacterIntroduction', ROOT.Char)] a přednese [Glossary('waka', 'GLOSS_WAKA')] na počest [host.Custom2('MyCharacterIntroduction', ROOT.Char)]. „Takové básně odhalují [Glossary('miyabi', 'JAPANESE_MIYABI')] srdce, jak dvořané dobře vědí.“\n\nMezi hosty se objeví úsměvy — báseň může chválit, ale také jemně bodnout."
 JAPANESE_MIYABI: "Označuje dvorskou eleganci a vytříbenost, ideál krásy a citlivosti ústřední pro japonskou aristokratickou kulturu."
 GLOSS_WAKA: "Jde o básnickou formu o 31 slabikách (5-7-5-7-7), oblíbenou mezi japonskou šlechtou."
 coronation_events.1036.korea.desc: "Jak hostina pokračuje, vysoko se pozvedají číše s [host.Custom('GetExpensiveDrink_Singular')] a síň plní smích. Pak jeden hlas požádá o ticho.\n\n„Přednesme verše na počest hostitele,“ prohlásí [verse_initiator.Custom2('MyCharacterIntroduction', ROOT.Char)] a dokončí důstojné dvojverší oslavující [host.Custom2('MyCharacterIntroduction', ROOT.Char)]. „Tak projevíme [Glossary('mun', 'KOREAN_MUN')], kultivovanou učenost ceněnou od dob mudrců.“\n\nNěkteří souhlasně přikyvují, jiní se připravují na střet — ne každý verš bývá pouhou chválou."
 KOREAN_MUN: "Označuje literární vytříbenost a učenost, která je mezi šlechtici známkou vzdělanosti."
 coronation_events.1036.desc: "Jak hostina pokračuje, nad hlukem se ozve sebejistý a uhlazený hlas.\n\n„Podělme se každý o jeden verš,“ prohlásí [verse_initiator.Custom2('MyCharacterIntroduction', ROOT.Char)] poté, co dokončí vytříbený přednes na počest [host.Custom2('MyCharacterIntroduction', ROOT.Char)]. „V poezii odhalujeme, čeho si ceníme — ať už ctnosti, řádu či nádhery.“\n\nSálem projede vlna očekávání. Ne každá báseň lichotí; některá slova mají ostřejší hrany."
 coronation_events.1036.a: "„Naladím se stejně a vychválím [host.GetPrimaryTitle.GetTierAsNameNoTooltip] postavy [host.GetTitledFirstName].“"
 coronation_events.1036.b: "„Mám na mysli jeden verš... jízlivou ozvěnu nářku dávného mistra.“"
 coronation_events.1036.c: "„Má slova budou elegantní a náležitá — formální verš pro formální chvíli.“"
 coronation_events.1036.d: "„Dílo postavy [verse_initiator.GetFirstNameNoTooltip] bylo nádherné. Dám to najevo.“"
 coronation_events.1036.e: "„Mělo své nedostatky. Nabídnu několik jemných připomínek.“"
 coronation_events.1037.t: "[ROOT.Char.GetFaith.HighGodName|U] promlouvá"
 coronation_events.1037.desc: "Dvorem se šíří tlumený šepot. Právě byla ohlášena [omen_happening.GetNameNoTooltip] a jazyky se rozvázaly, jako by [ROOT.Char.GetFaith.HighGodName] právě promluvil.\n\n[skeptical_guest.Custom2('MyCharacterIntroduction', ROOT.Char)] se ke mně se znepokojeným pohledem nakloní. „Zprávy se šíří rychle, [ROOT.Char.Custom('FormOfAddressForLiege')]. Mnozí zde jsou znepokojeni. Přemýšlejí, zda [ROOT.Char.GetFaith.HighGodName] neposílá varování.“"
 coronation_events.1037.a: "„Ti přede mnou vytrpěli i horší věci.“"
 coronation_events.1037.b: "„Ať promluví [respected_elder.GetTitledFirstNameNoTooltip].“"
 coronation_events.1037.c: "„Pryč s tím šiřitelem strachu!“"
 coronation_events.1037.d: "„[ROOT.Char.GetFaith.HighGodName|U] se ozývá, ale my budeme pokračovat.“"
 coronation_events.1038.t: "Oběť u čtyř oltářů"
 coronation_events.1038.desc: "Podle tradice musí Syn nebes dohlédnout na vykonání řady obětí, stejně jako první Huangdi předtím, než vystoupil na nebesa a stal se nesmrtelným.\n\nNa tento příběh vzpomínám, když zaujímám místo před čtyřmi oltáři Nebes, Země, císařského trůnu a bohů zemědělství, zatímco [rite_official.Custom2('MyCharacterIntroduction', ROOT.Char)] obstarává méně vznešené povinnosti. Vůně kadidla mě štípe v nose a cítím, že tento obřad podpírá samotná božská přítomnost."
 coronation_events.1038.a: "Vysmát se nevhodnému počínání [rite_official.GetFirstNameNoTooltip]."
 coronation_events.1038.b: "„[rite_official.GetFirstNameNoTooltip], prosím, připoj se ke mně.“"
 coronation_events.1038.c: "Přinesu velkolepou oběť, na kterou se nezapomene."
 coronation_events.1038.d: "„Kéž tato oběť přinese čest rodu [ROOT.Char.GetDynastyNameNoTooltip]!“"
 coronation_events.1038.e: "„Kéž Nebesa a Země vedou mou ruku ke ctnosti...“"
 coronation_events.1038.e.flavor: "A požehnají této zemi v tomto věku i v těch, které teprve přijdou."
 coronation_events.1039.t: "Prosba k bohům"
 coronation_events.1039.desc: "Vím, že má intronizace bude skutečně završena teprve tehdy, až se při [Glossary('Daijō-sai', 'DAIJO_SAI')] podělím s bohy o pokrm i slova.\n\nPo boku stojí [supporter.Custom2('MyCharacterIntroduction', ROOT.Char)] a společně kráčíme k oltáři, kde se chystám veřejně pronést svou prosbu. „Nebojte se, [ROOT.Char.Custom('FormOfAddressForLiege')],“ ozve se [supporter.GetFirstName]. „Jistě dokážete dát hlas potřebám celého panství.“"
 DAIJO_SAI: "Obřad konaný po intronizaci japonského císaře v paláci vybudovaném výhradně pro tento účel, který je po skončení slavnosti stržen. Po období rituální očisty císař přinese oběť kami a poté z ní sám požije."
 coronation_events.1039.a: "Prosím za dobro svých věrných poddaných."
 coronation_events.1039.b: "Prosím, aby [ROOT.Char.GetFaith.HighGodName|U] spatřil mou slávu!"
 coronation_events.1039.c: "Má prosba bude neurčitá a dvojsmyslná."
 coronation_events.1039.d: "Rozvinu svitek se zbožnou básní."
 coronation_events_1039_poem_name: "Požehnané společenství"
 coronation_events_1039_poem_desc: "Mistrovská a zbožná báseň, kterou [owner.GetTitledHouseNameOrFirstName] vytvořil na počest kami při vlastní korunovaci."
 coronation_events.1039.d.tt: "Získáš [Concept('artifact','artefakt')|E] v podobě básně"
 coronation_events.1039.d.flavor: "„V [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] osamělý květ rozkvétá...“"
 coronation_events.1040.t: "Lekce pomíjivosti"
 coronation_events.1040.desc: "„Jak pokračují přípravy mandaly, můj [ROOT.Char.GetTitleAsNameNoTooltip]?“ zeptá se mě vážným tónem [tributary_1.Custom2('MyCharacterIntroduction', ROOT.Char)]. Podle zvyku se na počest nového [ROOT.Char.GetTitleAsNameNoTooltip] vytváří [Glossary('písková mandala', 'GLOSS_MANDALA')], která je bezprostředně po vykonání příslušných obřadů zničena.\n\nNemohu na to přestat myslet. Obřad má hluboký symbolický význam, ale vytvořit takové umělecké dílo jen proto, aby bylo vzápětí zničeno, působí téměř... marnotratně."
 GLOSS_MANDALA: "Pískové mandaly pečlivě vytvářejí vyškolení mniši a poté je rituálně ničí, aby vyjádřili pomíjivost. V jejich středu se nachází božstvo či božská vlastnost obklopená harmonicky uspořádanými výjevy, podobně jako se kolem svého středu uspořádává mandalové panství."
 coronation_events.1040.special: "„Přineste sem mandalu z [ROOT.Char.GetFaith.HouseOfWorship].“"
 coronation_events.1040.a: "„Na mém božském znamení se šetřit nebude!“"
 coronation_events.1040.b: "„Ať má hluboký význam, ale zůstane prostá.“"
 coronation_events.1040.c: "„[ROOT.Char.GetFaith.HouseOfWorshipPlural] mohou prostředky šetřit. Já nebudu.“"
