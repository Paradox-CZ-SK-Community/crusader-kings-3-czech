 coronation_events.1012.t: "Syrová porce"
 coronation_events.1012.guest.desc: "Přichází hlavní chod: na tento vrchol hostiny budou velcí i vznešení ještě dlouho vzpomínat!\n\nJakmile náš hostitel zakrojí do masa, hlad se mi v ústech mění v popel. Z pečeně se přes celý stůl vyřine krev a hostina se rázem mění v bojiště. Snažím se potlačit dávení, zatímco se kolem mě ozývá znechucené šeptání."
 coronation_events.1012.host.desc: "Přichází hlavní chod: na tento vrchol mé hostiny budou velcí i vznešení ještě dlouho vzpomínat!\n\nJakmile zakrojím do [guest.Custom('GetExpensiveMeal')], hlad se mi v ústech mění v popel. Z pečeně se přes celý stůl vyřine krev a hostina se rázem mění v bojiště. Snažím se potlačit dávení, zatímco se kolem mě ozývá znechucené šeptání.\n\nZačínám přemýšlet, zda jsem neměl za kuchyni utratit víc, a sleduji, jak [guest.GetName] s hrůzou odstrčí talíř. Musím rychle jednat!"
 coronation_events.1012.eat_it: "Sníš to a ještě ti to bude chutnat!"
 coronation_events.1012.back: "Služebníku! Odnes to zpátky do kuchyně!"
 coronation_events.1012.trend: "Jak to myslíš? Vždyť je to poslední móda!"
 coronation_events.1012.complain: "[host.GetTitledFirstNameNoTooltip], to má být vtip?"
 coronation_events.1012.munch: "Mně to připadá docela dobré!"
 coronation_events.1013.t: "Ohnivý večer"
 coronation_events.1013.guest.desc: "Veselí ostatních hostů mi vykouzlí úsměv na tváři. Pobaveně se směji, když při bujarém hodování jeden přes druhého klopýtají.\n\nNevázané gesto však náhle shodí pochodeň a ta vletí přímo do závěsů!\n\nPlameny vyšlehnou po stěnách, hosté ječí a rozprchnou se. Vrhnu se do bezpečí, srdce mi buší a sál se během okamžiku naplní kouřem a panikou."
 coronation_events.1013.host.desc: "Pobaveně se směji, když se mí hosté při bujarém hodování jeden přes druhého klopýtají.\n\nNevázané gesto však náhle shodí pochodeň a ta vletí přímo do závěsů! Plameny vyšlehnou po stěnách, hosté ječí a rozprchnou se.\n\n[guest.GetName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))], je natolik zabrán do [guest.Custom('GetExpensiveDrink_Singular')], že si ohně vůbec [Select_CString(guest.IsFemale, 'nevšimla', 'nevšiml')]. Musím jednat rychle!"
 coronation_events.1013.burn: "Dobře. Ať shoří."
 coronation_events.1013.run: "Jak se odsud dostanu?!"
 coronation_events.1013.hero: "Udržím oheň na uzdě! Tudy!"
 coronation_events.1013.snuff_out: "Když mu jednoduše odřízneme přívod vzduchu..."
 coronation_events.1013.douse: "Přineste [ROOT.Char.Custom('RegionalDrink')] v kádi a uhaste tím oheň!"
 coronation_events.1014.t: "Panika u stolu"
 coronation_events.1014.guest.desc: "S chutí se pouštím do svého přepychového [guest.Custom('GetExpensiveMeal')], když mě přimějí vzhlédnout rozhořčené výkřiky.\n\nZdá se, že náš hostitel zapomněl zajistit dost jídla pro všechny hosty. Páni mávají prázdnými talíři a jejich uražená pýcha rychle přerůstá v ostrá slova a ještě ostřejší lokty. Uhýbám přívalu nadávek, zatímco pobouření hodnostáři soupeří o poslední sousta.\n\n[guest.GetName] uvízne přímo uprostřed té mela."
 coronation_events.1014.host.desc: "S chutí se pouštím do svého přepychového [guest.Custom('GetExpensiveMeal')], když mě přimějí vzhlédnout rozhořčené výkřiky.\n\nZdá se, že jsem zapomněl zajistit dost jídla pro všechny své hosty. Páni mávají prázdnými talíři a jejich uražená pýcha rychle přerůstá v ostrá slova a ještě ostřejší lokty. Uhýbám přívalu nadávek, zatímco pobouření hodnostáři soupeří o poslední sousta.\n\n[guest.GetName] uvízne přímo uprostřed té mela."
 coronation_events.1014.join: "Ruce pryč! Poslední porce je moje!"
 coronation_events.1014.calm: "Zkroťte ty blázny!"
 coronation_events.1014.run: "Téhle frašky už mám dost!"
 coronation_events.1015.t: "Požehnaný přípitek"
 coronation_events.1015.desc: "Když doznějí zpěvy sboru, síň zahalí uctivé ticho a vše prostoupí posvátná atmosféra. Má [GetPietyLevelName(ROOT.Char.GetPietyLevel)|L] pověst zřejmě povzbudí [guest.GetName], mého [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))], aby povstal a s upřímným zápalem zvolal:\n\n„Ať [ROOT.Char.GetFaith.DivineRealm|U] ozáří tvou vládu a [ROOT.Char.GetFaith.HighGodName] vede tvé kroky! Ať [ROOT.Char.GetFaith.CreatorName] obdaří tvou mysl moudrostí a [ROOT.Char.GetFaith.DevilName] nikdy nezastíní tvůj práh!“"
 coronation_events.1015.divine: "Chvála [ROOT.Char.GetFaith.HighGodName]!"
 custom.every_zealous_attending_character: "Každá účastnící se postava s rysem [GetTrait('zealous').GetName( GetNullCharacter )]"
 coronation_events.1015.cherish: "Jsi tak laskavý, [guest.GetFirstNameNoTooltip]!"
 coronation_events.1015.hush: "Souhlasím. A teď už mlč."
 coronation_events.1016.t: "Pozvedněme číše"
 coronation_events.1016.desc: "Sál ztichne. Hosté se zatajeným dechem čekají, až promluvím. Spustím pohár a pohledem sklouznu k [guest.GetFirstName], mému [guest.Custom('InsultAdjective')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))], a pak k neméně ostražitému [guest_2.GetFirstName], mému [guest_2.Custom('InsultAdjective')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_2'))].\n\nMám je zahrnout medovými slovy, která polichotí jejich pýše, nebo pronést jedovatý přípitek, jenž jim připomene, kdo tu skutečně drží moc?"
 coronation_events.1016.great: "„Poslyšte má slova, neboť jsou pravdivá!“"
 coronation_events.1016.great.tt.success: "Dokážeš si je získat"
 coronation_events.1016.great.tt.failure: "Nedokážeš je přesvědčit"
 coronation_events.1016.embarrass: "„[guest.GetFirstNameNoTooltip] a [guest_2.GetFirstNameNoTooltip], dovolte mi připomenout...“"
 coronation_events.1016.nah: "...nebo bych si místo toho mohl dát ještě trochu [guest.Custom('GetExpensiveDrink_Singular')]."
 coronation_events.1017.t: "Příležitost v číši"
 coronation_events.1017.desc: "Na druhé straně sálu šlechtici odhalují nádoby s nejlepšími nápoji svých panství. Můj [supporter.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))], [supporter.GetFirstName], mi nabídne ochutnávku [supporter.Custom('RegionalDrink')], z níž se line sladká medová vůně.\n\nNaproti tomu můj [detractor.Custom('InsultAdjective')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('detractor'))], [detractor.GetFirstName], předkládá vybranou [detractor.Custom('RegionalDrink')], jejíž výrazné aroma slibuje nepochybně hořkou příchuť.\n\nUž samotné vůně mi rozbouří smysly. Všichni čekají na můj soud."
 coronation_events.1017.diplo: "Kéž je má vláda hodna takové hojnosti a umu!"
 coronation_events.1017.isolate: "Ano, [detractor.GetFirstNameNoTooltip], přesně takové splašky se hodí pro mé služebnictvo."
 coronation_events.1017.empower: "Prosím, přines mi toho víc, [supporter.GetFirstName]!"
 coronation_events.1017.nah: "Ať se nejprve napijí mí hosté. Já až potom."
 bp4_coronation_good_harvest_modifier: "Hojnost cizokrajných nápojů"
 coronation_events.1018.t: "Hra o židle"
 coronation_events.1018.desc: "Když se rozhlížím po hostině, přes stůl na mě zavolá [supporter.GetFirstName], můj [supporter.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))]: „Vaše Milosti, [detractor.GetFirstName] by přece neměl sedět tak blízko!“ Pohlédnu doleva, kde se usadil [detractor.GetFirstName], můj [detractor.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('detractor'))]."
 coronation_events.1018.desc.wrathful: "\n\nSlušné mravy mi svazují ruce, ale nejlepší řešení je přece naprosto zřejmé. [detractor.GetFirstName] i s židlí poletí pěkně daleko ode mě."
 coronation_events.1018.desc.diplo: "\n\nProtokol velí zachovat důstojnost a usmívat se."
 coronation_events.1018.deal: "Přátele si drž nablízku..."
 coronation_events.1018.switch: "Toho [detractor.Custom2('InsultNoun', ROOT.Char)] ode mě posaďte co nejdál."
 bp4_shielded_reign_modifier: "Stranou od odpůrců"
 coronation_events.1019.t: "Projevy věrnosti"
 coronation_events.1019.desc: "Pohlédnu na své věrné spojence. [supporter.GetFirstName], můj [supporter.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))], projevil nezpochybnitelnou statečnost, když [supporter_memory.GetThirdPerspectiveDescription]. A [supporter_2.GetFirstName], můj [supporter_2.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter_2'))], stál po mém boku, když [supporter_2_memory.GetThirdPerspectiveDescription]. V jejich tvářích se zračí očekávání, neboť dobře vědí, že právě jejich věrnost mě dovedla až sem.\n\nJak bych si mohl takové oddanosti užívat, aniž bych využil každé příležitosti se za ni odvděčit...?"
 coronation_events.1019.both: "Oba si to zaslouží stejnou měrou."
 coronation_events.1019.memory_reward.tt: "Účinky této možnosti závisí na typu vzpomínky."
 coronation_events.1019.supporter: "„[supporter.GetFirstNameNoTooltip], něco pro tebe mám.“"
 coronation_events.1019.supporter_2: "„[supporter_2.GetFirstNameNoTooltip], prosím, přijmi to.“"
 coronation_events.1019.nah: "Slova budou muset stačit."
 coronation_events.1020.t: "Obavy mezi klany"
 coronation_events.1020.desc: "Když se korunovační hostina chýlí ke konci, sálem zazní zvýšené hlasy. „Rod [ROOT.Char.GetDynastyName] je silou panství,“ trvá na svém [dynasty_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U]. „Podle tradice mají vést naši příbuzní.“\n\nZ druhé strany stolu se ozve [not_dynasty_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)]: „A co my ostatní? Máme platit vašim bratrancům a držet jazyk za zuby?“"
 coronation_events.1020.embrace_supporters: "Dám přednost věrným."
 coronation_events.1020.embrace_supporters.tt: "#EMP #low Ovlivněné [Concept('characters','postavy')|E] jsou [Concept('coronation_supporters','podporovatelé korunovace')|E]#!#!"
 coronation_events.1020.weaken_detractors: "A proč bych vás měl vůbec poslouchat?"
 coronation_events.1020.weaken_detractors.tt: "#weak #EMP [Concept('characters','Postavy')|E], které získají [Concept('stress','stres')|E], jsou [Concept('coronation_detractors','odpůrci korunovace')|E]#!#!"
 coronation_events.1020.a: "Vyslechnu obě strany a najdu společnou řeč."
 coronation_events.1020.a.flavor: "Svolám oba vazaly a pozorně je vyslechnu. Pokusím se zklidnit vášně a znovu upevnit pouta, která drží náš rod pohromadě."
 coronation_events.1020.b: "Přikloním se k obavám [not_dynasty_vassal.GetFirstNameNoTooltip]."
 coronation_events.1020.b.custom: "Každý [Concept('vassal','vazal')|E] ze stejné [Concept('dynasty','dynastie')|E]"
 coronation_events.1020.b.tt: "Tví příbuzní ti budou zazlívat, že ses postavil na stranu tohoto cizince, abys získal jeho věrnost."
 coronation_events.1020.c: "Takovou drzost nelze tolerovat."
 coronation_events.1020.d: "Má povinnost patří především mým příbuzným."
 clan_unity_coronation_increased: "během korunovace upřednostnil [Concept('house','rod')|E] před cizinci"
 clan_unity_coronation_decreased: "během korunovace upřednostnil cizince před [Concept('house','rodem')|E]"
 coronation_events.1021.t: "Zlato před korunou"
 coronation_events.1021.desc: "Ještě než mi koruna spočine na hlavě, doléhají na mě starosti panství. [taxman.GetTitledFirstName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('taxman'))], rázně předstoupí a prohlásí: „Vaše Milosti, žádám o svolení vybírat plný desátek, který mi náleží, bez zásahů vašich dvorských magistrů. Jinak se pro mě mé daňové povinnosti stanou nespravedlivým břemenem.“\n\nVedle stojí [supporter.GetName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))], a pozorně mě sleduje. Z jeho pohledu čtu jedinou otázku: skloním se před tak nestoudnou chamtivostí? Budou snad výběrčí daní jako [taxman.GetFirstNameNoTooltip] rozhodovat o mé spravedlnosti?"
 coronation_events.1021.embrace_supporters: "„[supporter.GetFirstNameNoTooltip], dobře si toho ďábla hlídej.“"
 coronation_events.1021.embrace_supporters.flavor: "Mí skuteční podporovatelé stojí při mně... ti opojení lakotou mi stojí za zády a sahají do měšce!"
 coronation_tax_collectors_watched_modifier: "Podporovatelé dohlížejí na úředníky"
 coronation_tax_collectors_watched_modifier_desc: "Správa tohoto vládce je protkána věrnými oporami, které bedlivě sledují úplatkářství a zradu."
 coronation_tax_collector_scrutiny_modifier: "Pod dohledem ostatních vazalů"
 coronation_tax_collector_scrutiny_modifier_desc: "Tato postava je známá tím, že ráda vyvolává sváry, a nyní musí snášet nepříjemný dohled věrných podporovatelů svého lenního pána."
 coronation_harsh_collector_modifier: "Krutý výběrčí daní"
 coronation_harsh_collector_modifier_desc: "Tato postava vybírá daně bezohledně a obyvatelstvo se jí bojí."
 coronation_thriving_collector_modifier: "Úspěšný výběrčí daní"
 coronation_thriving_collector_modifier_desc: "Tato postava vybírá daně velmi efektivně, k nelibosti svých vrstevníků."
 coronation_events.1021.impress_attendees: "„Cti můj lid svou spravedlností.“"
 coronation_events.1021.impress_attendees.flavor: "Ctít tradice našeho klanu, uznat každého hosta a nikoho nenechat na pochybách, kde skutečně stojím."
 coronation_events.1021.a: "[taxman.GetTitledFirstNameNoTooltip] si dovoluje příliš."
 coronation_events.1021.a.flavor: "Nebudu se klanět mincím, když mi koruna ještě ani nespočívá na hlavě. Ať všichni vidí, kdo komu poroučí."
 coronation_events.1021.b: "Ustoupím v zájmu stability."
 coronation_events.1021.b.flavor: "Ať [taxman.GetFirstNameNoTooltip] vybírá, co uzná za vhodné, dokud vládnu já."
 custom.every_tax_slot_vassal: "Každý [Concept('vassal','vazal')|E] v [Concept('tax_jurisdiction','daňové jurisdikci')|E], kterou spravuje [tax_collector.GetShortUIName]"
 coronation_events.1021.c: "Mé pokladnice mají přednost. Naplň je."
 coronation_events.1021.c.flavor: "Pokud zlato dláždí cestu k moci, ať se vrší do výšky. [taxman.GetFirstNameNoTooltip] dostane při výběru volnou ruku."
 clan_unity_coronation_nepotism.desc: "[Select_CString(unity_character.IsFemale, 'podporovala nepotismus tím, že během své korunovace upřednostnila vlastní', 'podporoval nepotismus tím, že během své korunovace upřednostnil vlastní')] [Concept('house','rod')|E]"
 bp4_empowered_tax_collectors_modifier: "Posílení výběrčí daní"
 coronation_events.1022.t: "Hedvábná nabídka"
 coronation_events.1022.desc: "[supporter.GetName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))], přede mnou poklekne a pozvedne truhlici s vyšívanými rouchy.\n\n„Vaše Milosti, má mysl je zahrada rozkvétající vzpomínkami na vše, co jsme spolu prožili. Jako svědectví krásy minulosti nabízím tato hedvábná roucha, jichž je dost pro celý váš dvůr. Žádám jen jediné. Ať vaši vznešení [ROOT.Char.Custom('KnightCulturePluralNoTooltip')] vždy nosí nádheru, které se nic nevyrovná.“"
 coronation_events.1022.a: "Velkorysý dar a znamenitá rada!"
 coronation_events.1022.b: "„Přidej ještě něco a budu tvým dlužníkem!“"
 coronation_events.1022.c: "Na tom bychom mohli vydělat!"
 coronation_events.1023.t: "Buď [Select_CString(ROOT.IsFemale, 'pozdravena', 'pozdraven')], [ROOT.Char.GetTitleAsNameNoTooltip]"
 coronation_events.1023.desc: "[detractor.GetName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('detractor'))], povstane a vysoko pozvedne pohár. [Select_CString(detractor.IsFemale, 'Promluví', 'Promluví')] [detractor.Custom('InsultAdjective')] tónem:\n\n„Vaše Milosti, pod tou oslnivou korunou vidím [ROOT.Char.GetTitleAsNameNoTooltip], který je tak [ROOT.Char.Custom('ComplimentAdjective')] — málokdo se může pochlubit tolika #EMP oddanými#! poddanými, i když se někteří odvažují pochybovat o moudrosti vašich rozhodnutí. Ano, kde bychom byli bez tak [ROOT.Char.Custom('ComplimentAdjectiveArticle')] [ROOT.Char.GetTitleAsNameNoTooltip], kterému můžeme pochlebovat a klanět se?“\n\nV těch slovech není ani špetka laskavosti a sálem se rozhostí mrazivé ticho."
 coronation_events.1023.supporter.desc: "Cítím na sobě pohledy všech přítomných — především šokovaný pohled [supporter.GetName], mého [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))]."
 coronation_events.1023.a: "„Buďte si jisti, má vláda skutečně bude [ROOT.Char.Custom('ComplimentAdjective')]!“"
 coronation_events.1023.b: "„A za všechno vděčím podpoře od [supporter.GetFirstNameNoTooltip]!“"
 coronation_events.1023.c: "„Stráže — zatkněte toho [detractor.Custom('InsultAdjective')] [detractor.Custom('InsultNoun')]!“"
 coronation_events.1023.d: "„[detractor.GetFirstNameNoTooltip], tady už nejsi vítán!“"
 coronation_events.1023.e: "Jeho slova vezmu na vědomí zdvořilou úklonou — ničím víc."
 coronation_events.1024.t: "Přátelé všude kolem"
 coronation_events.1024.intro_diff_faith: "S uctivou zdvořilostí přede mě předstoupí [foreign.GetFaith.GetAdherentName] [foreign.GetTitleAsNameNoTooltip], který vládne [foreign.GetPrimaryTitle.GetNameNoTier]."
 coronation_events.1024.intro_diff_culture: "Po několika nezvyklých obřadních gestech mě o chvíli pozornosti požádá [foreign.GetCulture.GetName] [foreign.GetTitleAsNameNoTooltip], který vládne [foreign.GetPrimaryTitle.GetNameNoTier]."
 coronation_events.1024.intro_diff_neither: "S nacvičenou obřadností přede mě předstoupí [foreign.Custom('ComplimentAdjective')] [foreign.GetTitleAsName], který vládne [foreign.GetPrimaryTitle.GetNameNoTier]."
 coronation_events.1024.desc: "[foreign.GetFirstNameNicknamedNoTooltip] drží v rukou skříňku posázenou drahokamy a obrátí se k celému sálu:\n\n„Vaše Milosti, přijměte tento projev dobré vůle od mého [foreign.GetPrimaryTitle.GetTierAsNameNoTooltip|l]. Kéž se stane symbolem trvalého pouta mezi vaším a mým lidem.“"
 coronation_events.1024.supporter.desc: "\n\n[guest.GetName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))], povstane po mém boku a zašeptá: „Tento dar by mohl být počátkem něčeho trvalého, můj [ROOT.Char.GetTitleAsName]!“"
 coronation_events.1024.detractor.desc: "\n\n[guest.GetName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))], se ke mně nakloní a zlomyslně zašeptá: „Takové dary často skrývají nečisté úmysly, můj [ROOT.Char.GetTitleAsName]...“"
 coronation_events.1024.impress_attendees: "„Slavný okamžik pro naše národy!“"
 coronation_events.1024.embrace_supporters: "„[foreign.GetFirstNameNoTooltip], kéž se naše pouta nikdy nepřetrhnou!“"
 coronation_events.1024.weaken_detractors: "„[guest.GetFirstNameNoTooltip] tvůj dar pomlouvá, [foreign.GetFirstNameNoTooltip]!“"
 coronation_events.1024.exalt_crown: "„Takže... se staneš tributářem koruny, že ano?“"
 coronation_events.1024.a: "„#EMP Ha!#! Cetky nepotřebuji.“"
 coronation_events.1024.b: "„S vděčností přijímám a na oplátku slibuji svou přízeň.“"
 coronation_events.1025.t: "Chladné pohledy"
 coronation_events.1025.desc.intro: "Kolem [supporter.GetName] a [detractor.GetName], mého [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('detractor'))], houstne napětí. Sedí od sebe, vrhají po sobě nevraživé pohledy a podrážděně gestikulují. Ve vzduchu cítím ozvěny křivd, které může utišit snad jedině má koruna.\n\n"
 coronation_events.1025.desc.supporter: "Přes všechno reptání se [supporter.GetTitledFirstNameNoTooltip] stále věrně usměje, jakmile si všimne, že se na něj dívám."
 coronation_events.1025.desc.detractor: "\n\n[detractor.GetTitledFirstName] naproti tomu sedí přímo **#EMP na#!** stole, zahalený do množství [detractor.Custom('RegionalFabric')] a vzdoru. Vede skupinku stejně smýšlejících odpůrců a společně se vysmívají [supporter.GetFirstNameNoTooltip], kterého označují za „[supporter.Custom('InsultAdjective')]“."
 coronation_events.1025.a: "„Za [supporter.GetFirstNameNoTooltip] stojím bezvýhradně a navždy!“"
 coronation_events.1025.b: "„No tak! Musíme slavit společně!“"
 coronation_events.1025.c: "[supporter.GetFirstNameNoTooltip] má mou podporu."
 coronation_events.1025.d: "Prostě všechno svedu na [detractor.GetFirstNameNoTooltip]."
 coronation_events.1025.e: "„Prosím, myslete na naši budoucnost!“"
 coronation_events.1025.f: "V tomhle má [detractor.GetFirstNameNoTooltip] vlastně pravdu."
 coronation_events.1026.t: "Dort, na který se nezapomíná"
 coronation_events.1026.desc: "Konečně přichází dort — vysoký, nádherný, skutečný klenot celé hostiny. Unavení, ale hrdí kuchaři strávili celou noc vršením [ROOT.Char.Custom('FavoriteTreatDemand')] a [ROOT.Char.Custom('GetFoodDetail')], přičemž každá vrstva voní po [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')]. Někde uvnitř se skrývá drobný předmět, který jsem tam osobně schoval!"
 coronation_events.1026.supporter_desc: "\n\n[token_finder.GetNameNoTooltip] vítězoslavně vytáhne předmět z bohatých vrstev dortu a radostí málem poplácá má [ROOT.Char.Custom('GetTitleTierAdjective')] záda. Síň propukne v potlesk — věrný podporovatel, kterému přálo štěstí, si nyní získává i přízeň koruny."
 coronation_events.1026.detractor_desc: "\n\n[token_finder.GetNameNoTooltip] s úšklebkem vytáhne předmět z dortu a vítězství je nepřehlédnutelné. Sálem se rozběhne vlna šepotu — zdá se, že štěstí přeje i kritikům koruny, alespoň pro dnešní večer."
 coronation_events.1026.special_desc: "\n\nS okázalým gestem zabořím nůž do dortu a sám vytáhnu ukrytý předmět. Síň na okamžik ztichne, než propukne v potlesk — cenu získal samotný hostitel!"
 coronation_events.1026.fallback_desc: "\n\n[token_finder.GetNameNoTooltip] vítězoslavně vytáhne ukrytý předmět a vyslouží si jásot i příslib budoucího štěstí."
 coronation_events.1026.special: "Našel jsem ho! Chvalte mě!"
 coronation_events.1026.a: "Teď všechny oslním proslovem!"
 coronation_events.1026.b: "[token_finder.GetFirstName], přijmi svou cenu!"
 coronation_events.1026.c: "[token_finder.GetFirstName], jako první přede mnou poklekneš."
 coronation_events.1026.d: "Ať tento okamžik navždy oslavuje jméno [ROOT.Char.GetDynastyNameNoTooltip]!"
 coronation_events.1026.e: "Už se nemůžu dočkat, až ten dort ochutnám!"
 coronation_events.1026.f: "Můj díl dostanou sedláci!"
 coronation_events.1027.t: "Okamžik pro [highlighted_guest.GetTitledFirstNameNoTooltip|U]"
 coronation_events.1027.desc: "Šlechta zahájí pečlivě nacvičený [ROOT.Char.Custom('GetMedievalDance')]. Se symbolickými rekvizitami sehrává výjevy ze vzestupu mé dynastie, jejích vítězství a budoucích ambicí. Všechny pohledy se obrátí k ústřední postavě celého představení..."
 coronation_events.1027.special_desc: "\n\nS překvapením si uvědomím, že ztvárňují právě mě jako hrdinu země [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] — skutečně velkolepou postavu a oporu jména [ROOT.Char.GetDynastyName]. Uprostřed choreografie se otevře místo. Vyzývají mě, abych se připojil k tanci. Hosté propuknou v jásot a jejich obdiv omamuje stejně jako víno."
 coronation_events.1027.supporter_desc: "\n\n[highlighted_guest.GetFirstName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('highlighted_guest'))], převezme roli oslavovaného předka a strhne potlesk vášnivým vyprávěním o síle mého rodu. Poselství je zřejmé: mé právo vládnout je dědictvím, které neseme s hrdostí."
 coronation_events.1027.detractor_desc: "\n\nK mému údivu předstoupí [highlighted_guest.GetFirstNameNoTooltip], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('highlighted_guest'))], právě ve chvíli, kdy obřad vyžaduje symbolické gesto úcty. Shromáždění neklidně zaváhá mezi smíchem a rozpačitým potleskem a nikdo si není jistý, zda to brát jako žert, představení... nebo varování."
 coronation_events.1027.fallback_desc: "\n\n[highlighted_guest.GetFirstNameNoTooltip], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('highlighted_guest'))], ztvární samotné panství — zahalené do panovnických barev titulu [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], ovázané zlatou stuhou a slavnostně vyznávající věrnost. Hosté souhlasně přikyvují a vychutnávají si okázalou podívanou."
 coronation_events.1027.special: "Je čas zaujmout místo po jejich boku."
 coronation_events.1027.a: "Zdvořile jejich vystoupení zatleskám."
 coronation_events.1027.b: "Veřejně pochválím [highlighted_guest.GetFirstNameNoTooltip] — věrnost si zaslouží odměnu."
 coronation_events.1027.c: "Pokazím [highlighted_guest.GetFirstNameNoTooltip] jeho chvíli slávy."
 coronation_events.1027.d: "Pronesu řeč o tradici a rodu [ROOT.Char.GetDynastyNameNoTooltip]."
 coronation_events.1027.e: "Vřele se usměji a budu sdílet jejich radost."
 coronation_events.1027.f: "Stáhnu se do pozadí a nechám tento okamžik plynout."
 coronation_events.1028.t: "I [clergy_representative.GetFaith.HighGodName] ti žehná"
 coronation_events.1028.supporter.desc: "[clergy_representative.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('clergy_representative'))], předstoupí s vážným a klidným výrazem.\n\n„[clergy_representative.GetFaith.HouseholdGodName] přeje svornosti mezi vládci,“ pronese. „Dovol mi, abych ti při tomto znamení vzájemné harmonie udělil požehnání ve jménu [clergy_representative.GetFaith.CreatorName].“\n\n[guest.GetFirstName], jeden z mých věrných podporovatelů, vše pozorně sleduje a gesto jej očividně zaujalo."
 coronation_events.1028.detractor.desc: "[clergy_representative.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('clergy_representative'))], ke mně pomalu přistoupí s hlubokou úctou.\n\n„[clergy_representative.GetFaith.HouseholdGodName] nás vyzývá k míru navzdory hranicím i rozdílným přesvědčením,“ pronese. „Smím ti během korunovace udělit požehnání ve jménu [clergy_representative.GetFaith.CreatorName]?“\n\nV davu stojí [guest.GetFirstName], hlasitý kritik mé vlády, a zúží oči v očividném nesouhlasu."
 coronation_events.1028.fallback.desc: "Korunovace pokračuje a [clergy_representative.GetFirstName], návštěvník vyznávající [clergy_representative.GetFaith.GetAdherentName], předstoupí se zdviženýma rukama a slavnostnou úctou.\n\n„[clergy_representative.GetFaith.HouseholdGodName] nás učí míru a porozumění mezi různými vyznáními,“ pronese mírně. „Přijmeš požehnání ve jménu [clergy_representative.GetFaith.CreatorName], aby provázelo tvou vládu?“\n\n[guest.GetFirstName], jeden ze shromážděných šlechticů, nakloní hlavu. Z jeho výrazu nelze nic vyčíst, jen mě pozorně sleduje."
 coronation_events.1028.supporter: "Povolám [guest.GetFirstNameNoTooltip] po svůj bok."
 coronation_events.1028.detractor: "Označím [guest.GetFirstNameNoTooltip] za stoupence [clergy_representative.GetFaith.GetAdjectiveNoTooltip]."
 coronation_events.1028.a: "Přijmu požehnání v duchu tolerance."
 coronation_events.1028.b: "Zdvořile odmítnu kacířské požehnání."
 coronation_events.1028.c: "„Vždyť to je očividné kacířství!“"
 coronation_events.1028.d: "Otázce se úplně vyhnu."
 coronation_events.1028.detractor.tt: "Každý účastník stejné [Concept('faith','víry')|E], který nemá [GetTrait('cynical').GetName( GetNullCharacter )]"
 coronation_events.1028.a.tt: "Každý účastník stejné [Concept('faith','víry')|E] s [GetTrait('zealous').GetName( GetNullCharacter )]"
 coronation_events.1028.a.tt3: "Každý účastník [Concept('faith','víry')|E] postavy [clergy_representative.GetShortUIName]"
 coronation_events.1028.b.tt: "Každý účastník stejné [Concept('faith','víry')|E] s [GetTrait('zealous').GetName( GetNullCharacter )]"
 coronation_events.1028.c.tt: "Každý účastník stejné [Concept('faith','víry')|E] s [GetTrait('zealous').GetName( GetNullCharacter )]"
 coronation_events.1029.t: "Zapomenutá přísaha"
 coronation_events.1029.desc: "Zaslechnu nezaměnitelný zvuk rozvíjeného dlouhého svitku. „Můj lenní pane,“ osloví mě [priest.GetFirstName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))], a lehce se ukloní. „Našel jsem to mezi nejstaršími záznamy titulu [primary_title.GetNameNoTier]. Píše se zde o přísaze, kterou složil [ROOT.GetCharacter.Custom('GetMythicalFounder')] a která budoucím vládcům zaručuje práva a výsady, na něž čas dávno zapomněl.“\n\n[guest.GetFirstName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))], se se zjevnou zvědavostí nakloní blíž. „Zapomenutý slib? To by mohlo být... zajímavé,“ zamumlá."
 coronation_events.1029.supporter.desc: "Do nosu mě udeří pach starého svitku. „Můj lenní pane,“ prohlásí [priest.GetFirstName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))], „toto je přísaha, kterou složil [ROOT.GetCharacter.Custom('GetMythicalFounder')]. Pochází z našich nejstarších archivů a spojuje vládce s věrnými poddanými vzájemnými povinnostmi a odměnami! Jistě byla určena právě pro časy, jako je tento.“\n\n[guest.GetFirstName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] a věrný podporovatel, se široce usměje. „Dokonalá příležitost obnovit dávné sliby.“"
 coronation_events.1029.detractor.desc: "[priest.GetFirstName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))], rozvine zašlý svitek. „Můj lenní pane,“ oznámí, „toto je přísaha, kterou složil [ROOT.GetCharacter.Custom('GetMythicalFounder')], prohlášení panovnické moci nad všemi zeměmi! Nedávno byla objevena v archivech titulu [primary_title.GetNameNoTier]. Tato přísaha potvrzuje tvé právo vyžadovat věrnost a trestat vzdor.“\n\n[guest.GetFirstName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] a hlasitý odpůrce, se posměšně uchechtne. „Stará slova, a k tomu dávno mrtvá!“"
 coronation_events.1029.a: "Má vláda je skutečně posvěcena, vždyť [ROOT.Char.GetFaith.HighGodName] tak rozhodl!"
 coronation_events.1029.b: "[guest.GetFirstNameNoTooltip], složme přísahu hodnou těch dávných."
 coronation_events.1029.c: "Udělám z toho především otázku věrnosti [guest.GetFirstNameNoTooltip] vůči mně."
 coronation_events.1029.d: "Vyhlásím ztracený text přede všemi!"
 coronation_events.1029.e: "Ať minulost zůstane pohřbená."
 coronation_events.1030.t: "Pro budoucí pokolení"
 coronation_events.1030.exalt.desc: "[scholar.GetTitledFirstName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scholar'))], ke mně přistoupí s dychtivým úsměvem.\n\n„Vaše Veličenstvo,“ pronese, „velkolepost vaší korunovace si zaslouží místo v letopisech. Smím pověřit jednoho ze svých písařů, aby zaznamenal nádheru vašich regálií, moc titulu [ROOT.Char.GetPrimaryTitle.GetNameNoTier] a úžas, který jste zde vzbudil?“"
 coronation_events.1030.impress.desc: "[scholar.GetTitledFirstName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scholar'))], ke mně ukáže.\n\n„Jak oddané publikum!“ zvolá. „Dovolíte-li, požádám jednoho ze svých písařů, aby zaznamenal reakce vašich hostů — jásot, úžas i slzy. Ať nikdo nezapomene, jak hluboce nás vaše korunovace zasáhla.“"
 coronation_events.1030.supporters.desc: "[scholar.GetTitledFirstName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scholar'))], mě pozdraví s očima plnýma nadšení.\n\n„Nejvíce mě zasáhla věrnost vašich poddaných,“ pronese. „Dáte-li souhlas, požádám svého písaře, aby o této události sepsal [scholar.Custom('GetChronicleSaga')]. Jeho slova budou patřit vašim podporovatelům, jejich věrnosti a síle, kterou nacházejí v jednotě.“"
 coronation_events.1030.detractors.desc: "[scholar.GetTitledFirstName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scholar'))], se ke mně spiklenecky nakloní a ztiší hlas.\n\n„Vaši odpůrci byli nápadně tiší... nebo naopak nesnesitelně hluční. Mí písaři jejich vzdor zaznamenají a budoucí pokolení pak vaše nepřátele náležitě odsoudí...“"
 coronation_events.1030.a: "„Ano, ano, nádhera, která přetrvá věky!“"
 coronation_events.1030.b: "„Prosím, zdůrazni radost mých hostů.“"
 coronation_events.1030.c: "„Kéž jsou tvá slova hodna jejich věrnosti.“"
 coronation_events.1030.d: "„Ať tou chátrou opovrhují navěky.“"
 coronation_events.1030.e: "„Ne, tato pasáž musí velebit [ROOT.Char.GetFaith.HighGodName].“"
 coronation_events.1030.tt.success: "[scholar.Custom('GetChronicleSaga')] sklízí chválu"
 coronation_events.1030.tt.failure: "[scholar.Custom('GetChronicleSaga')] se stává terčem posměchu"
 bp4_chronicled_coronation_modifier: "Zaznamenaná korunovace"
 legend_chapter_great_coronation: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] uspořádal nejvelkolepější korunovaci, jakou kdy lidstvo poznalo. Každý okamžik slavného obřadu provázelo božské požehnání a [ROOT.Legend.GetProtagonist.GetFaith.HighGodName] bděl nad celou slavností. Celý známý svět hleděl na [ROOT.Legend.GetProtagonist.GetTitleAsNameNoTooltip] v úžasu."
 coronation_events.1031.t: "Sbor se rozezní"
 coronation_events.1031.exalt.desc: "Velkou síní se rozléhá ruch příprav, když ke mně přistoupí [priest.GetFirstName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))], s několika obnošenými zpěvníky v náručí.\n\n„Vaše Veličenstvo,“ pronese s tichou hrdostí, „sbor čeká na vaše pokyny. Mají jeho hlasy zaznít na oslavu vašeho božského práva a nádhery, jíž se pyšní [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]?“\n\nPředstavuji si nadcházející obřad, při němž každý tón pozvedne panství v očích přítomných."
 coronation_events.1031.impress.desc: "Zatímco služebnictvo upravuje výzdobu a panoši nacvičují své úlohy, vyhledá mě uprostřed příprav [priest.GetFirstName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))].\n\n„Celé panství bude pozorně naslouchat,“ pronese s vědoucím úsměvem. „Ať sbor zazpívá chvalozpěv, který pohne srdci a získá na tvou stranu i ty pošetilce, kteří ti odporují.“\n\nTa představa se mi zamlouvá: síň naplněná zpěvem a každý hlas součástí mého velkého představení."
 coronation_events.1031.supporters.desc: "Mezi písaři a kuchaři, kteří spěchají chodbami sem a tam, mě jemným gestem zastaví [priest.GetFirstName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))].\n\n„Tví věrní podporovatelé budou přihlížet,“ pronese. „Ať jim chvalozpěvy připomenou, proč tě následují. Ať spojí oddaná srdce a prohloubí jejich víru ve tvou vládu.“\n\nSbor čeká na mé rozhodnutí a dychtí začít se zkouškou."
 coronation_events.1031.detractors.desc: "[priest.GetFirstName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))], ke mně přistoupí, ztiší hlas a obezřetně se rozhlédne.\n\n„Ne každý, kdo se zde shromáždil, bude provolávat slávu tvému jménu,“ varuje mě. „Až zazní chvalozpěvy, ať mají váhu. Ať z nich ti ďáblové, kteří stojí proti tobě, slyší autoritu, již nemohou přehlížet. Naplň jim uši mocí své koruny!“\n\nSbormistr je připraven a čeká, jaký tón a poselství zvolím."
 coronation_events.1031.a: "„Zpívejte o mé slávě!“"
 coronation_events.1031.b: "„Ať chvalozpěv volá po míru a jednotě.“"
 coronation_events.1031.c: "„Ať je varováním nepřátelům rodu [ROOT.Char.GetDynastyNameNoTooltip].“"
 coronation_events.1031.d: "„Žádný chvalozpěv. Dnes ať promluví ticho.“"
 coronation_events.1031.e: "„Na to mám dokonalou skladbu!“"
 every_attending_vassal: "Každý přítomný [Concept('vassal','vazal')|E]"
 every_attending_detractor_or_compassionate: "Každý přítomný [Concept('coronation_detractor','odpůrce')|E] nebo soucitný host"
 every_attending_poet_scholar: "Každá přítomná postava s rysem [GetTrait('lifestyle_poet').GetName( GetNullCharacter )] nebo [GetTrait('scholar').GetName( GetNullCharacter )]"
 every_poet_scholar: "Každá přítomná postava s rysem [GetTrait('lifestyle_poet').GetName( GetNullCharacter )] nebo [GetTrait('scholar').GetName( GetNullCharacter )]"
 coronation_events.1032.t: "Odvážné gesto"
 coronation_events.1032.desc: "Celá událost je sice důstojná a náležitě slavnostní, ale přesto jí cosi... chybí. Je to snad jen další obvyklé shromáždění, obyčejná hostina? Nebo je právě teď čas na velký politický čin, který vstoupí do dějin? [supporter.GetTitledFirstName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))], mi zašeptá do ucha.\n\n„Velikost vládců neurčují slova... nýbrž činy,“ naléhá. „Činy! Takové činy, až se [ROOT.Char.GetPrimaryTitle.GetTierAsName] otřese v základech!“\n\n[detractor.GetFirstName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('detractor'))], však celé slavnosti nepřikládá žádný význam a přihlíží s opovržením."
 coronation_events.1032.b: "„[supporter.GetFirstNameNoTooltip], přísahejme si věčnou věrnost.“"
 coronation_events.1032.c: "Nový svatý řád shromáždí věrné pod mou zástavou!"
 coronation_events.1032.c.flavor: "[supporter.GetFirstNameNoTooltip] připraví vyhlášení nového svatého řádu."
 create_holy_order_decision_effect_message_coronation: "Bude založen [Concept('holy_order','svatý řád')|E] tvé [Concept('faith','víry')|E]\n$EFFECT_LIST_BULLET$Staneš se [Concept('holy_order_patron','patronem svatého řádu')|E]\n$EFFECT_LIST_BULLET$[barony.GetName] se stane sídlem řádu"
 coronation_events.1032.d: "„Slídavé oči je třeba... #EMP vypíchnout!#!“"
 coronation_events.1032.d.flavor: "[detractor.GetFirstNameNoTooltip] bude během obřadu veřejně potrestán. Vzdor nebude tolerován."
 coronation_events.1032.a: "Ať se k oslavám připojí samotná nebesa!"
 coronation_events.1032.a.flavor: "Přikaž služebnictvu vypustit do vzduchu hejna zajatých ptáků. Ať nezůstane zavřená jediná klec!"
 every_compassionate_calm_supporter: "Každý soucitný či klidný účastník nebo [Concept('coronation_supporter','podporovatel korunovace')|E]"
 every_ambitious_wrathful_vassal: "Každý ambiciózní nebo hněvivý účastník"
 every_attending_sadistic_arbitrary: "Každý sadistický nebo svévolný účastník"
 every_attending_compassionate_just: "Každý soucitný nebo spravedlivý účastník"
 create_alliance_supporter_tt: "Ty a [supporter.GetShortUIName] uzavřete [Concept('alliance','alianci')|E]"
 coronation_events.1032.e: "Jen už ať je po všem..."
 coronation_events.1033.t: "Nesouzvučný hlas"
 coronation_events.1033.desc: "„[ROOT.Char.GetPrimaryTitle.GetNameNoTier] se kvůli téhle #EMP naprosté#! frašce stává terčem posměchu! Hanobí se zdejší lid a poskvrňují hroby těch, kdo tu byli před námi!“ zaburácí [rival.GetFirstName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival'))].\n\nZ dechu [rival.GetFirstName] táhne [ROOT.Char.Custom('RegionalDrink')]. Už teď je namol! Nejistým pohledem přejíždí po šlechticích, [ROOT.Char.GetFaith.PriestNeuterPlural] i cizích vyslancích a vyzývá každého, kdo by se tomuto neurvalému výstupu odvážil postavit. „Jakým právem si [ROOT.Char.GetFirstName] činí nárok na tuto korunu? #EMP Hm?#! Jakým právem?!?“\n\nShromážděním se rozlehne zděšené zalapání po dechu."
 coronation_events.1033.a: "„Z božského práva.“"
 coronation_events.1033.b: "Využiji příležitosti k veřejnému usmíření."
 coronation_events.1033.c: "Nechte [rival.GetFirstNameNoTooltip] odvést v řetězech!"
 coronation_events.1033.d: "Ať si ta krysa vylije vztek..."
 rival_publicly_denounced_at_coronation: "[TARGET_CHARACTER.GetShortUIName|U] veřejně zpochybnil legitimitu postavy [CHARACTER.GetShortUIName] při její korunovaci"
