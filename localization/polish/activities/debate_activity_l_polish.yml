 activity_debate_plural: "Debaty"
 activity_debate_destination_selection: "$activity_debate_plural$ lze pořádat pouze v [Concept('capital','hlavním sídle')|E], které patří tobě, tvému [Concept('movement_leader','vůdci hnutí')|E], tvému [Concept('liege','lennímu pánovi')|E] nebo [GetTitleByKey('h_china').GetName]."
 activity_debate_selection_tooltip: "[GetActivityType('activity_debate').GetName] ti umožní soupeřit o politickou moc — získej ji pro sebe nebo své hnutí $activity_debate_host_rewards$"
 activity_debate_desc: "Zásluhy, vliv, #EMP moc#! — nic z toho mnoho neznamená, pokud nedokážeš přednést pádné argumenty na podporu sebe a své věci.\n\nSvolej debatu a přesvědč ostatní, že si zasloužíš více moci, nebo vyzvi jiné hnutí a zajisti tomu svému výhodnější postavení."
