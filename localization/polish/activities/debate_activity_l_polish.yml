 activity_debate_guest_help_text: "Všichni pozvaní [Concept('activity_guests','hosté aktivity')|E] budou debatě přihlížet nebo se jí účastnit. Úspěšné argumenty přinášejí [Concept('movement_power','sílu hnutí')|E], nebo o ni připravují jiné hnutí. Účast na debatách je dobrou příležitostí získat [Concept('merit','zásluhy')|E], získat další [Concept('trait_level_track_xp','zkušenosti rysu')|E] pro [GetTrait('confucian_education').GetName( GetNullCharacter )] a případně navázat vztah [Concept('elder','Starší')|E]"
