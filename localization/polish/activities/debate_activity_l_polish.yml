 activity_debate_guest_desc: "\n$BULLET_WITH_TAB$Můžeš získat [Concept('disciples','učedníky')|E]\n$BULLET_WITH_TAB$Můžeš získat další [Concept('trait_level_track_xp','zkušenosti rysu')|E] pro [GetTrait('confucian_education').GetName( GetNullCharacter )]"
 activity_debate_guest_rewards: "\n$BULLET_WITH_TAB$Účastníci mohou získat [Concept('trait_level_track_xp','zkušenosti rysu')|E] pro [GetTrait('confucian_education').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$Účastníci mohou získat vztah [Concept('elder','Starší')|E]"
