 activity_ecumenical_council_desc: "Svolej velké preláty a vládce křesťanského světa! Naším cílem bude sjednotit víru i praxi, k větší slávě božstva [GetPlayer.GetFaith.HighGodName|U].\n\nSejdeme se jako apoštolové v Jeruzalémě, sjednoceni ve víře, nebo se církev pod tíhou naší pýchy rozlomí?"
