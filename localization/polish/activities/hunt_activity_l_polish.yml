 hunt_party_size_few: "Komorní družina"
 hunt_party_size_few_desc: "$BULLET_WITH_TAB$Připojí se [GetPlayer.Custom('GetHuntMasterTooltipDesc')], [GetCourtPositionType('bodyguard_court_position').GetName()], [GetCourtPositionType('court_physician_court_position').GetName()], tvé [Concept('spouses','choti')|E], [Concept('friends','přátelé')|E], [Concept('lovers','milenci')|E] a lovci\n\n#weak Malá skupina důvěrníků a dvořanů.#!"
 hunt_party_size_normal: "Přiměřená družina"
 hunt_party_size_normal_desc: "$BULLET_WITH_TAB$Po skončení získáš více [prestige_i|E][Concept('prestige','prestiže')|E]\n$BULLET_WITH_TAB$Připojí se $knight_culture_player_plural$ z řad bezzemků a také [Concept('courtiers','dvořané')|E] a [Concept('guests','hosté')|E], kteří mají [GetTrait('lazy').GetName( GetNullCharacter )] nebo vojenské vzdělání\n\n#weak Slušně početná skupina významných osobností a dvořanů z panství.#!"
 hunt_party_size_many: "Početná družina"
 hunt_party_size_many_desc: "$BULLET_WITH_TAB$Po skončení získáš mnohem více [prestige_i|E][Concept('prestige','prestiže')|E]\n$BULLET_WITH_TAB$Připojí se všichni [Concept('courtiers','dvořané')|E] a [Concept('guests','hosté')|E]\n\n#weak Značná část dvora, panství i jeho okolí.#!"
