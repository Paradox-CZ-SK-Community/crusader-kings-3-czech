 hunt_attendants_few: "Místní hajní"
 hunt_attendants_few_desc: "#weak Malé skupině doprovázejících lovců pomáhají místní hajní.#!"
 hunt_attendants_normal: "Skupiny stopařů"
 hunt_attendants_normal_desc: "$BULLET_WITH_TAB$Poněkud zvyšuje [Concept('hunt_success_chance_no_prefix','šanci na úspěch')|E]$hunt_attendants_roco_tt$\n\n#weak Skupiny služebníků pomáhají zvěř hledat a zahánět do úzkých.#!"
 hunt_attendants_many: "Skupiny naháněčů"
 hunt_attendants_many_desc: "$BULLET_WITH_TAB$Výrazně zvyšuje [Concept('hunt_success_chance_no_prefix','šanci na úspěch')|E]$hunt_attendants_roco_tt$\n\n#weak Vyhrazené skupiny lovců jsou připraveny zvěř pronásledovat a nahánět.#!"
