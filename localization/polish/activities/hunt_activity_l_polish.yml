 hunt_phase: "Lov"
 hunt_type_standard: "Lov"
 hunt_type_standard_desc: "$EFFECT_LIST_BULLET$ Vyber si kořist z různých místních zvířat\n$EFFECT_LIST_BULLET$ Zvyšuje [Concept('trait_level_track_xp','zkušenosti rysu')|E] na dráze $trait_track_hunter$: [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ Vyšší [Concept('hunt_danger_no_prefix','nebezpečnost')|E] přináší více [prestige_i|E][Concept('prestige','prestiže')|E]\n$EFFECT_LIST_BULLET$ Pohlaví, kterým je povolen boj, se mohou aktivně účastnit\n$EFFECT_LIST_BULLET$ Pohlaví, kterým boj povolen není, mohou přihlížet\n#weak Hrdé a prohnané šelmy číhají v divočině. Přelstít a přemoci je prověřuje odvahu a tříbí schopnosti.#!"
 hunt_type_legendary: "Legendární"
 hunt_type_legendary_desc: "$EFFECT_LIST_BULLET$ Vydej se po stopě bájného zvířete zpozorovaného v oblasti\n$EFFECT_LIST_BULLET$ Zvyšuje [Concept('trait_level_track_xp','zkušenosti rysu')|E] na dráze $trait_track_hunter$: [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ Vyšší [Concept('hunt_danger_no_prefix','nebezpečnost')|E] přináší více [prestige_i|E][Concept('prestige','prestiže')|E]\n$EFFECT_LIST_BULLET$ Pohlaví, kterým je povolen boj, se mohou účastnit\n$EFFECT_LIST_BULLET$ Pohlaví, kterým boj povolen není, mohou přihlížet\n#weak Učenci často odbývají bájné tvory jako pouhé legendy, lesy však stále mohou skrývat mnohá tajemství.#!"
 hunt_type_falconry: "Sokolnictví"
 hunt_type_falconry_desc: "$EFFECT_LIST_BULLET$ Vyber si kořist z různých druhů pernaté zvěře\n$EFFECT_LIST_BULLET$ Zvyšuje [Concept('trait_level_track_xp','zkušenosti rysu')|E] na dráze $trait_track_falconer$: [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ Účastnit se mohou obě pohlaví\n#weak Ačkoli jsou lov s dravci a sokolnictví nákladné, mezi urozenými kratochvílemi se jen máloco vyrovná radosti z takového ovládnutí přírody.#!"
