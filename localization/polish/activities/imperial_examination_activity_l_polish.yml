 imperial_examination_phase_assembly: "Shromáždění"
 imperial_examination_phase_assembly_desc: "Ze všech koutů přicházejí způsobilí účastníci a míří do zkušebních síní."
 imperial_examination_phase_preparation: "Příprava"
 imperial_examination_phase_preparation_desc: "Účastníci i pořadatel vyčkávají a horečně využívají každou možnost, jak se na zkoušky připravit."
 imperial_examination_phase_examination: "Metropolitní zkouška"
 imperial_examination_phase_examination_desc: "Metropolitní zkouška začíná. Teď už nezbývá než nechat věci běžet svým spádem."
 imperial_examination_phase_palace_examination: "Palácová zkouška"
 imperial_examination_phase_palace_examination_desc: "Palácová zkouška začíná. Právě teď ti nejúspěšnější učenci prokazují své schopnosti před císařem."
 imperial_examination_focus: "Zaměření zkoušky"
 imperial_examination_focus_martial: "Vojenští stratégové"
 imperial_examination_focus_martial_desc: "Účastníci, kteří vynikají ve [Concept('martial','válečnictví')|E], získají u zkoušek více zásluh\n\n#weak „Vojenská strategie je ctností stejně jako kterákoli jiná učenost.“#!"
 imperial_examination_focus_stewardship: "Efektivní správa"
 imperial_examination_focus_stewardship_desc: "Účastníci, kteří vynikají ve [Concept('stewardship','správcovství')|E], získají u zkoušek více zásluh\n\n#weak „Je zásadní rozdíl mezi těmi, kdo se živí řečněním, a lidmi, kteří jsou skutečně užiteční.“#!"
 imperial_examination_focus_learning: "Prozíraví učenci"
 imperial_examination_focus_learning_desc: "Účastníci, kteří vynikají v [Concept('learning','učenosti')|E], získají u zkoušek více zásluh\n\n#weak „Je nám potěšením učit se a nabyté vědomosti dobře využívat.“#!"
 imperial_examination_breadth: "Rozsah zkoušek"
 imperial_examination_breadth_exclusive: "Výběrové pozvání"
 imperial_examination_breadth_exclusive_desc: "$EFFECT_LIST_BULLET$ Aktivita je přístupná jen několika vybraným, zatímco široká veřejnost je vyloučena\n$EFFECT_LIST_BULLET$Po dokončení získáš #EMP méně#! [Concept('merit','zásluh')|E]\n\n#weak Umožním, aby v #EMP mém#! panství sloužili ti nejvýznačnější potomci mých poddaných.#!"
 imperial_examination_breadth_restricted: "Omezené pozvání"
 imperial_examination_breadth_restricted_desc: "$EFFECT_LIST_BULLET$Počet účastníků je omezený, ale zkoušky jsou přístupné i některým lidem z řad široké veřejnosti\n\n#weak Budoucí správci mohou vzejít i z těch nejskromnějších poměrů.#!"
 imperial_examination_breadth_open: "Otevřené pozvání"
 imperial_examination_breadth_open_desc: "$EFFECT_LIST_BULLET$ Aktivita se koná ve velkém rozsahu a přiláká mnoho dychtivých účastníků\n$EFFECT_LIST_BULLET$ Po dokončení získáš #EMP více#! [Concept('legitimacy','legitimity')|E]\n\n#weak Moudrost může přijít odkudkoli. Rozhoďme síť doširoka a uvidíme, kdo se chopí příležitosti.#!"
 imperial_examination_passing_grade: "Hranice pro úspěch"
 imperial_examination_passing_grade_extreme: "Mimořádně vysoká"
 imperial_examination_passing_grade_extreme_desc: "$EFFECT_LIST_BULLET$ Hranice pro úspěšné složení zkoušek je velmi vysoká a vyřadí #EMP mnoho#! účastníků\n$EFFECT_LIST_BULLET$ Po dokončení získáš #EMP mnohem více#! [Concept('legitimacy','legitimity')|E]\n\n#weak Jen ti nejlepší z nejlepších smějí uspět a stát se #EMP mými#! příštími státními úředníky.#!"
 imperial_examination_passing_grade_high: "Vysoká"
 imperial_examination_passing_grade_high_desc: "$EFFECT_LIST_BULLET$ Hranice pro úspěšné složení zkoušek je běžná a vyřadí očekávaný počet účastníků\n$EFFECT_LIST_BULLET$ Odměna v podobě [Concept('legitimacy','legitimity')|E] se po dokončení nemění\n\n#weak Mé nároky jsou vysoké, ale ne nerozumné. Chceme-li úředníky vybírat podle zásluh, musejí dosáhnout určité úrovně výjimečnosti.#!"
 imperial_examination_passing_grade_mediocre: "Mírná"
 imperial_examination_passing_grade_mediocre_desc: "$EFFECT_LIST_BULLET$ Hranice pro úspěšné složení zkoušek je o něco mírnější a vyřadí #EMP méně#! účastníků\n$EFFECT_LIST_BULLET$ Po dokončení získáš #EMP méně#! [Concept('legitimacy','legitimity')|E]\n\n#weak Kdo může říct, že se tito účastníci ze skromných poměrů nezapracují? Mají-li pevné základy, ať projdou.#!"
 imperial_examination_passing_grade_low: "Nízká"
 imperial_examination_passing_grade_low_desc: "$EFFECT_LIST_BULLET$ Hranice pro úspěšné složení zkoušek je velmi nízká a vyřadí jen #EMP nepatrný počet#! účastníků\n$EFFECT_LIST_BULLET$ Po dokončení získáš #EMP mnohem méně#! [Concept('legitimacy','legitimity')|E]\n\n#weak Úředníky vybírané podle zásluh potřebujeme #EMP hned#!. Pravidla i nároky určuji já a oni se jim podřídí. Takový je můj mandát.#!"
 activity_imperial_examination_conclusion_desc: "Aktivita [GetActivityType( 'activity_imperial_examination' ).GetName] skončila."
 imperial_examination_conclusion.intro: "Zkoušky jsou konečně u konce."
 imperial_examination_conclusion.intro.passing_grade.extreme: "\n\nNastavení #BOL $imperial_examination_passing_grade_extreme$#! znamenalo, že #BOL jen malý počet#! [Concept('entrants','účastníků')|E] získal #BOL mimořádné množství#! [Concept('merit','zásluh')|E]."
 imperial_examination_conclusion.intro.passing_grade.high: "\n\nNastavení #BOL $imperial_examination_passing_grade_high$#! znamenalo, že #BOL středně velký počet#! [Concept('entrants','účastníků')|E] získal #BOL velké množství#! [Concept('merit','zásluh')|E]."
 imperial_examination_conclusion.intro.passing_grade.mediocre: "\n\nNastavení #BOL $imperial_examination_passing_grade_mediocre$#! znamenalo, že #BOL velký počet#! [Concept('entrants','účastníků')|E] získal #BOL střední množství#! [Concept('merit','zásluh')|E]."
 imperial_examination_conclusion.intro.passing_grade.low: "\n\nNastavení #BOL $imperial_examination_passing_grade_low$#! znamenalo, že #BOL velmi mnoho#! [Concept('entrants','účastníků')|E] získalo #BOL malé množství#! [Concept('merit','zásluh')|E]."
 imperial_examination_conclusion.intro.breadth.imperial: "\n\nDíky nastavení #BOL $imperial_examination_breadth_open$#! se zkoušek zúčastnil celkem #BOL velký počet#! [Concept('entrants','účastníků')|E]."
 imperial_examination_conclusion.intro.breadth.grand: "\n\nDíky nastavení #BOL $imperial_examination_breadth_restricted$#! se zkoušek zúčastnil celkem #BOL slušný počet#! [Concept('entrants','účastníků')|E]."
 imperial_examination_conclusion.intro.breadth.palace: "\n\nDíky nastavení #BOL $imperial_examination_breadth_exclusive$#! se zkoušek zúčastil celkem #BOL malý počet#! [Concept('entrants','účastníků')|E]."
 imperial_examination_conclusion.general: "\n\nZ původních #BOL [activity.MakeScope.Var('num_initial_entrants').GetValue]#! [Concept('entrants','účastníků')|E] jich u zkoušky #EMP neuspělo#! #BOL [activity.MakeScope.Var('num_final_failees').GetValue]#!.\n\n[Select_CString(activity.MakeScope.Var('first_place_entrant').Char.IsFemale, 'Nejúspěšnější z účastníků byla', 'Nejúspěšnější z účastníků byl')] [activity.MakeScope.Var('first_place_entrant').Char.GetShortUIName] se skóre #BOL [activity.MakeScope.Var('first_place_entrant_score').GetValue|0]#! ([activity.Custom('ActivityGetExamScoreAdjective')]). Druhé a třetí místo patří [activity.MakeScope.Var('second_place_entrant').Char.GetShortUIName] a [activity.MakeScope.Var('third_place_entrant').Char.GetShortUIName]."
 imperial_examination_conclusion.entrant_failee: "\n\nZkouška skončila hořkým zklamáním. Příště se musím snažit víc."
 imperial_examination_conclusion.entrant_passed: "\n\nMetropolitní zkouška je za mnou — a úspěšně. Má rodina může být na mé výsledky hrdá."
 imperial_examination_conclusion.entrant_passed_palace: "\n\nCelá říše mě nyní řadí mezi své nejlepší učence a přede mnou se otevírají nesčetné možnosti."
 local_examination_conclusion.entrant_passed: "\n\nDnešní provinční zkouška je za mnou — a úspěšně. Má rodina může být na mé výsledky hrdá."
