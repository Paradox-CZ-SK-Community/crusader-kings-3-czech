l_polish:
 activity_imperial_examination: "Zkouška v hlavním sídle"
 activity_imperial_examination_plural: "Zkoušky v hlavním sídle"
 activity_imperial_examination_destination_selection: "$activity_imperial_examination$ můžeš pořádat pouze ve svém [Concept('capital','hlavním sídle')|E]."
 activity_imperial_examination_not_hegemon: "#bold Nedržíš#! [Concept('title','titul')|E] úrovně [Concept('hegemony','hegemonie')|E]"
 activity_imperial_examination_selection_tooltip: "Uspořádej [GetActivityType('activity_imperial_examination').GetName], abys prověřil schopnosti a [Concept('merit','zásluhy')|E] svých poddaných $activity_imperial_examination_host_rewards$"
 activity_imperial_examination_desc: "Je naší ctí i povinností zachovávat tento řád a zajišťovat konání zkoušek. Díky nim můžeme posoudit schopnosti jednotlivých kandidátů a udělit [Concept('merit','zásluhy')|E] těm nejvhodnějším — a zajistit tak budoucí prosperitu panství."
 activity_imperial_examination_host_desc: "$activity_imperial_examination_host_rewards$$activity_imperial_examination_guest_rewards$"
 activity_imperial_examination_host_rewards: "\n$BULLET_WITH_TAB$[legitimacy_i] [Concept('legitimacy','Legitimita')|E]\n$BULLET_WITH_TAB$[prestige_i|E] [Concept('prestige','Prestiž')|E]"
 activity_imperial_examination_guest_desc: "\n$BULLET_WITH_TAB$Příležitost složit @metropolitan_exam_icon! #V Metropolitní zkoušku#!\n$BULLET_WITH_TAB$Příležitost složit @palace_exam_icon! #V Palácovou zkoušku#!\n$BULLET_WITH_TAB$Můžeš získat další [Concept('trait_level_track_xp','zkušenosti rysu')|E] pro [GetTrait('confucian_education').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$Můžeš získat více [Concept('merit','zásluh')|E]\n$BULLET_WITH_TAB$ @alert_icon! #alert_trial Pokud neovládáš [Concept('language','jazyk')|E] [host.GetCulture.GetLanguage.GetName], tvé šance na úspěch se výrazně snižují!#![SelectLocalization( Scope.HasFlag('passed_provincial_exam'), 'blank_line', 'activity_imperial_examination_warning' )]"
 activity_imperial_examination_warning: "\n#indent_newline:8 $BULLET_WITH_TAB$ @warning_icon! #color_red Bez úspěšného absolvování @provincial_exam_icon! [Concept('provincial_examination','provinční zkoušky')|E] nejspíš neuspěješ!#!"
 activity_imperial_examination_guest_rewards: "\n$BULLET_WITH_TAB$Můžeš naverbovat velmi schopnou postavu\n$BULLET_WITH_TAB$Účastníci mohou získat [Concept('trait_level_track_xp','zkušenosti rysu')|E] pro [GetTrait('confucian_education').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$Účastníci mohou získat [Concept('merit','zásluhy')|E]"
 imperial_examination_base_cost: "Základní cena"
 activity_imperial_examination_with_icon: "$activity_imperial_examination$ @metropolitan_exam_icon! @palace_exam_icon!"
 activity_imperial_examination_can_complete_tt: "$activity_imperial_examination_not_available_tt$"
 activity_imperial_examination_expected_frequency: "Očekáváno každých #V 5#! let"
 activity_imperial_examination_not_available_tt: "#T [GetActivityType( 'activity_imperial_examination' ).GetNameNoTooltip]#!\nPři této [Concept('activity','aktivitě')|E] mohou účastníci složit:\n@metropolitan_exam_icon! Metropolitní zkoušku\n@palace_exam_icon! Palácovou zkoušku\n\n$activity_imperial_examination_expected_frequency$"
 activity_imperial_examination_province_kaifeng_palace_desc: "\n#P ++ $building_type_kaifeng_palace_01$#!"
 activity_imperial_examination_province_examination_hall_desc: "\n#P ++ $building_type_examination_hall_01$#!"
 activity_window_character_player_entrant_traveling: "$activity_window_character_player_entrant$"
 activity_window_character_player_entrant: "$activity_window_character_entrant$"
 activity_window_character_entrant: "[Concept('entrant','Účastník')|E]\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_examiner: "Zkoušející\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_minister_of_rites: "[Concept('minister_of_rites','Ministr obřadů')|E]\n[Character.GetShortUINameNoTooltip|U]"
 activity_imperial_examination_guest_help_text: "Všichni [Concept('activity_guests','hosté aktivity')|E], kteří splňují podmínky zkoušky, se ji mohou pokusit složit. Úspěšný výsledek přinese [Concept('entrant','účastníkovi')|E] více [Concept('merit','zásluh')|E] a [Concept('activity_host','pořadateli aktivity')|E] více [Concept('prestige','prestiže')|E]. Hosté sice nemají do zkušební síně přístup, mohou však svým vlivem účastníky různými způsoby podpořit.\n\nZkoušky jsou ideální příležitostí navázat kontakty a zapůsobit na zkoušející, a možná tak získat [Concept('elder','Staršího')|E]."
