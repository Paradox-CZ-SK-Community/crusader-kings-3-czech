 visited_monument_desc_1: "Z výpravy si odnáším vzpomínku na průzkum místa, kde stojí [ROOT.Var('special_building').GetProvince.Custom('GetSpecialBuildingPrefix')][ROOT.Var('special_building').GetProvince.GetHolding.GetSpecialBuildingType.GetName]. Místo: [ROOT.Var('special_building').GetProvince.GetName]"
 visited_monument_desc_second_perspective_1: "Z výpravy si odnášíš vzpomínku na průzkum místa, kde stojí [ROOT.Var('special_building').GetProvince.Custom('GetSpecialBuildingPrefix')][ROOT.Var('special_building').GetProvince.GetHolding.GetSpecialBuildingType.GetName]. Místo: [ROOT.Var('special_building').GetProvince.GetName]"
