 bp3_journey.0005.desc: "[location.Custom('GetTouristHoldingIntro')] [ROOT.Char.Custom('IntentDesc')]\n\n[location.Custom('GetTouristStartEventOutro')]"
 bp3_journey.0005.a: "Zdokonalím své diplomatické schopnosti!"
 bp3_journey.0005.b: "Strategie, taktika, opevnění... to všechno mě zajímá!"
 bp3_journey.0005.c: "Na tomto místě je tolik co poznávat."
 bp3_journey.0005.d: "Jak to tu vlastně spravují? To musím zjistit."
 bp3_journey.0005.e: "Zajímalo by mě, co se tu děje v zákulisí..."
