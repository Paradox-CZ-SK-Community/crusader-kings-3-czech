 bp3_journey.1700.t: "[location.GetCulture.GetNameNoTooltip] cvičení"
 bp3_journey.1700.desc: "„[local_character.Custom('GetMilitaryDrillSentence')]“ křičí velitel na své dva hlídače. Zdá se, že poblíž [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] probíhá vojenská ukázka.\n\n"
 bp3_journey.1700.desc_different_culture: "Pozorování manévrů a taktik těchto [location.GetCulture.GetName] strážců mě naplňuje úctou a obdivem. Určitě se my [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] můžeme z této ukázky něco naučit."
 bp3_journey.1700.desc_same_culture: "Pozorování manévrů a taktik strážců mě naplňuje úctou a obdivem. Určitě se z této ukázky mám co naučit."
 bp3_journey.1700.knowledge_hoarding: "Ten velitel #EMP musí#! mě naučit tyto taktiky!"
 bp3_journey.1700.curiosity: "Mohl bych vás tři využít v mé [ROOT.Char.Custom('GetCourtType')]!"
 bp3_journey.1700.b: "Hm, mohl bych využít dva nové tělesné stráže."
 bp3_journey.1700.c: "Nabídnu celé posádce zaměstnání v mé armádě."
 bp3_journey.1700.d: "#EMP *Pozdravit stráže*#!"
 drill_order_1: "Na můj rozkaz, pochod vpřed, pevně, jako by země sama vedla vaše kroky!"
 drill_order_2: "Postavte se do řad, rameno k rameni, jako by se vítr neodvažoval projít!"
 drill_order_3: "Otočte se doleva, ať jsou ozvěny našich kroků jako hrom, aby vystrašily vrány!"
 drill_order_4: "Klid, vojáci, ale buďte ostražití jako tichý strážce, stále bdělí,"
 drill_order_5: "Zvedněte štíty, jako by nám z nebe místo deště padaly šípy!"
 drill_order_6: "Ustupte v rozestavení, jako by se země sama pod vašima nohama pohnula!"
 drill_order_7: "Sestavte formaci, štíty staženy, je to jen cvičení, postavte se pevně proti smyšleným nepřátelům!"
 drill_order_8: "Postupujte vpřed s kopími připravenými, jako byste čelili nepříteli na žert, ne v opravdovém boji!"
 drill_order_9: "Obkružte a shromážděte se, napodobeňte nepřátelský útok, tanec války bez viditelného nepřítele!"
 drill_order_10: "Držte pozici, představte si, že se země třese pod útokem přízračné jízdy!"
 drill_order_11: "Ustupte a znovu se seskupte, jako by se vzduch, který rozsekáváte svými meči, vám smál!"
 maa_increases_tt: "Jedna z vašich [maa.GetName] [Concept('men_at_arms','ozbrojenců')|E] se zvětší o #P +2#!\n#weak (To může potenciálně zvětšit jejich velikost nad maximální)#!" # todo: CONCEPT CASE
 imported_tactics_modifier: "Dovezené taktiky"
 imported_tactics_modifier_desc: "Vládce těchto zemí dovezl taktiky ze zahraničí, díky čemuž jsou regimentu zde dislokované zvláště efektivní."
 imported_tactics_character_modifier: "$imported_tactics_modifier$"
 imported_tactics_character_modifier_desc: "Díky svým cestám tento charakter ovládl nové taktiky, čímž si vytvořil silnější pouto se svými vojsky."
 bp3_journey.1800.t: "Důvěřuj mi"
 bp3_journey.1800.desc: "„[location.Custom('GetSpecialBuildingNonsensicalClaim')]“ tvrdí šejdířský místní průvodce. „Je to pravda nebo moje jméno není [local_character.GetFirstNameNicknamed]!“\n\n„Pojďte, ukážu vám to! Stačí malý poplatek – pro [ROOT.Char.GetTitleAsNameNoTooltip|U] jako jste vy to nic není!“"
 bp3_journey.1800.spread_legend_intent: "Slyšeli #EMP JSTE#! pravý příběh o [ROOT.Char.GetPromotedLegend.GetNameNoTooltip]?"
 bp3_journey.1800.knowledge_hoarding: "Může to být pravda!? Musíte mi to ukázat!"
 bp3_journey.1800.curiosity: "Ukažte mi, jak se tu v [location.GetNameNoTooltip] žije!"
 bp3_journey.1800.a: "To jsou nesmysly – ukažte mi místo toho něco skutečného."
 bp3_journey.1800.b: "Ukončete své frašky, mohu vám nabídnout více než tenhle život."
 bp3_journey.1800.c: "Choďte prodávat své lži někomu jinému."
 bp3_journey.1800.trusting: "Rozhodně, to zní důvěryhodně!"
 mostly_true_tt: "Výjev je naprosto fascinující"
 almost_true_tt: "Výjev je zajímavý"
 not_true_tt: "Dostal jsem jen běžnou prohlídku"
 utterly_scammed_tt: "Zabloudíme „náhodou“ a musím zaplatit, abych se vrátil."
 interesting_insight_modifier: "Zajímavé postřehy"
 interesting_insight_modifier_desc: "Tato postava získala inspirující postřehy návštěvou jiného města."
 beautiful_vista: "Stojíte na vrcholu nádherné vyhlídky"
 relaxing_sights: "Procházíte se po uklidňující promenádě"
 interesting_insight: "Vidíte fascinující architekturu"
 guide_religious_1: "Říká se, že stíny uvnitř [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] se pohybují samy od sebe a věřícím odhalují přítomnost božských duchů."
 guide_religious_2: "Místní mýtus praví, že zvony [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] zní melodií slyšitelnou jen těmi, kdo jsou předurčeni k velikosti v posmrtném životě."
 guide_religious_3: "Šeptá se, že tajná komnata pod [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ukrývá relikvii, jež může proměnit nejzbožnější modlitby v realitu."
 guide_religious_4: "Legenda praví, že oltář [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] [Select_CString(location.GetHolding.GetSpecialBuildingType.IsFemale,'byla','byl')] zázračně vytesán z jediného božského meteoritu, čímž mu byla vložena nebeská moc."
 guide_religious_5: "Stará pověst vypráví, že vitrážová okna [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] mění svůj příběh tak, aby odrážela srdce těch, kdo se na ně dívají."
 guide_learning_1: "Říká se, že ukrytá ve zdech [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] leží kniha, kterou lze číst pouze za světla úplňku."
 guide_learning_2: "Legenda praví, že tajná komnata pod [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] bývala schůzovacím místem společnosti osvícených myslitelů, neviditelným pro nezasvěcené."
 guide_learning_3: "Přetrvává zvěst, že nejstarší strom na nádvoří [Select_CString(ROOT.Char.IsFemale,'byla','byl')] zasazen na přesné místo, kde zakladatel [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] měl vizi o jeho budoucí velikosti."
 guide_learning_4: "Šeptání vypráví o ukrytém manuskriptu v [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], který může těm, kdo rozluští jeho starobylé písmo, udělit bezprecedentní moudrost."
 guide_learning_5: "Prý když třikrát obkroužíte [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] o půlnoci, odhalí se duch dávno zapomenutého učence, horlivého sdílet své vědomosti."
 guide_mines_1: "Místní folklór tvrdí, že nejhlubší tunel vede do podsvětí, kde duchové vedou horníky k nejbohatším žilám rudy."
 guide_mines_2: "Starý hornický příběh hovoří o žíle zlata tak čistého, že září vlastním světlem, ale vidět ji mohou jen ti s čistým srdcem."
 guide_mines_3: "Legendami se šeptá o skryté komoře plné nedotčeného bohatství pradávných králů, uzavřené a střežené přízračnými horníky."
 guide_mines_4: "Říká se, že třikrát zaklepání na určitou neoznačenou skálu v dole otevře průchod k pokladům za hranicí představivosti."
 guide_mines_5: "Kolem kolují zvěsti o tajemném drahokamu, který dává vize budoucnosti, zakopaném kdesi v labyrintu tunelů."
 guide_martial_1: "Existuje legenda, že zdi [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] obsahují kámen, který krváčí, když se nepřátelé přibližují k hranicím království."
 guide_martial_2: "Šeptá se, že tajný arzenál nepřemožitelných zbraní leží skryt pod [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], přístupný pouze během zatmění Měsíce."
 guide_martial_3: "Staří vojáci vyprávějí příběh o skrytém tunelu pod [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], který kdysi používal starý král k tajnému odposlechu svých nepřátel."
 guide_martial_4: "Mýtus mezi strážemi hovoří o přízračném strážci, který nocí prochází hradbami a chrání [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] před neviditelnými hrozbami."
 guide_martial_5: "Folklor praví, že původní stavitelé vytesali na brány [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] kletbu, která způsobí, že se vetřelci navzájem pozabíjejí."
 guide_ancient_wonders_1: "Říká se, že zašeptání přání do trhlin [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] za úsvitu ho splní."
 guide_ancient_wonders_2: "Legenda tvrdí, že stíny [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] za západu slunce ukazují cestu k ukrytému pokladu pradávných vládců."
 guide_ancient_wonders_3: "Existuje pověst, že skutečný architekt [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] zanechal tajnou místnost, která obsahuje klíč k nesmrtelnosti."
 guide_ancient_wonders_4: "Starý příběh naznačuje, že obcházení [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] pozpátku o půlnoci odhalí vchod do skrytého podsvětí."
 guide_ancient_wonders_5: "Šeptá se, že kameny [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] za úderu zimního slunovratu bzučí starodávnými kouzly a otevírají portály do zapomenutých říší."
 guide_economic_1: "Slyší se, že skutečné bohatství [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] nejsou obchodní zboží, ale skrytý trezor pod trhy, naplněný nevyčíslitelným bohatstvím."
 guide_economic_2: "Legendami se mluví o tajné knize záznamů v [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], která zapisuje dluhy králů a císařů, čímž čtenáři dává moc nad národy."
 guide_economic_3: "Prý zakladatel [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] zakopal mapu ve zdech, která vede k ukryté zásobě drahokamů."
 guide_economic_4: "Povídá se, že přízračný obchodník bloudí nocí chodbami [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] a nabízí směnu tajemství za duše chamtivých."
 guide_economic_5: "Šeptání mezi místními naznačuje, že ťukání určitého vzoru na chodníkové dlažbě nádvoří [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] odhalí skrytou přihrádku se starodávnými mincemi."
 guide_diplomatic_1: "Šeptaná zvěst mezi dvořany říká, že skutečná moc [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] spočívá v tajné komoře, kde jsou magicky svázány všechny světové smlouvy a mohou být změněny těmi hodnými."
 guide_diplomatic_2: "Prý skrytý průchod v [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] vede do místnosti, která odráží myšlenky navštěvujících hodnostářů a odhaluje jejich skutečné úmysly."
 guide_diplomatic_3: "Legenda praví, že zrcadla ve velkém sále [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] odrážejí nejen vzhled, ale pravou povahu duše, odhalující spojence i nepřátele."
 guide_diplomatic_4: "Starý příběh mezi diplomaty říká, že sochy v zahradách [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] šeptají tajemství minulých jednání těm, kteří v soumraku pozorně naslouchají."
 guide_diplomatic_5: "Je příběh, že fontána na nádvoří [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] uděluje výřečnost a přesvědčivost těm, kdo pijí její vodu za úplňku."
 guide_natural_wonder_1: "Místní věří, že vody [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] mohou vyléčit jakékoliv onemocnění, pokud se v nich vykoupete za prvního světla úsvitu."
 guide_natural_wonder_2: "Legenda mezi horolezci praví, že dosažení vrcholu [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] poskytne vizi osudu, ale jen těm, kteří vystoupají sami a bez otočení."
 guide_natural_wonder_3: "Prý může ozvěna tvého hlasu ze střechy [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] nést poselství zemřelým a přinést klid neklidným duchům."
 guide_natural_wonder_4: "Starodávný mýtus vypráví o skryté jeskyni v [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], která přenáší ty, kdo do ní vstoupí, do ráje, který nevidělo žádné živé oko."
 guide_natural_wonder_5: "Šeptá se, že nejvzácnější květiny rostoucí u paty [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] kvetou jen jednou za století a jejich vůně přináší prorocké sny."
 bp3_journey.1900.t: "Chudák [local_character.GetFirstNameNoTooltip]"
 bp3_journey.1900.desc: "„Smiluj se nad chudákem [local_character.GetFirstName], pár mincí mi stačí!“ prosí [local_character.GetWomanMan] třesoucím se hlasem.\n\n[ROOT.Char.Custom('FormerJob')]"
 court_tutor_court_position_job: "„Dříve jsem vyučoval děti rodu [former_employer.GetHouse.GetName] ve službě [former_employer.Custom2('InsultAdjective', SCOPE.sC('local_character'))] [former_employer.GetTitledFirstName]. [Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] jsem dobrý ve své práci, učil jsem nejmladší o [ROOT.Char.Custom('highest_skill_noun')] – ale ach! Mé služby byly #EMP 'už nepotřebné'#! poté, co se drobní vyrostli, a teď žiji na ulici!"
 royal_architect_court_position_job: "„Dříve jsem navrhoval velké stavby pro [former_employer.GetTitledFirstName] — věže, sídla, dokonce i hrady! Když [Select_CString(ROOT.Char.IsFemale,'byla','byl')] můj poslední projekt dokončen ve jménu [former_employer.GetHerHis], [former_employer.GetSheHe] mi ukradl slávu a vyhnal mě! Teď žiju ve stínu [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], sním o dni, kdy budu moci znovu stavět...“"
 cupbearer_court_position_job: "„Dříve jsem podával nápoje na radě [former_employer.GetTitledFirstName] a [Select_CString(ROOT.Char.IsFemale,'starala','staral')] jsem se o to, aby žádné poháry nezůstaly prázdné! Jednoho dne mě obvinili, že jsem [Select_CString(ROOT.Char.IsFemale,'otrávila','otrávil')] hosta – ale byla to jen zkažená masa z večeře, další den [Select_CString(ROOT.Char.IsFemale,'byla','byl')] v pořádku! Přesto mi to nebránilo v tom, aby mě připravili o důstojnost a živobytí...“"
 court_poet_court_position_job: "„Dříve jsem [Select_CString(ROOT.Char.IsFemale,'skládala','skládal')] krásné básně pro [former_employer.GetTitledFirstName], [Select_CString(ROOT.Char.IsFemale,'oslavovala','oslavoval')] jsem [Select_CString(former_employer.IsFemale,'její','jeho')] ctnosti a dobrou povahu! Celý rod [former_employer.GetHouse.GetName] miloval mé verše a prózu, ale když začal ubývat obsah jejich truhlic – ubývala i jejich láska k poezii, a tak jsem tu nyní, chudý a osamělý.“"
 chronicler_court_position_job: "„[Select_CString(ROOT.Char.IsFemale,'Zaznamenávala','Zaznamenával')] jsem legendy rodu [former_employer.GetHouse.GetName], [Select_CString(ROOT.Char.IsFemale,'pracovala','pracoval')] jsem dnem i nocí, ruce mi byly umazány inkoustem... Ale jakmile byla kniha hotová, měl můj zaměstnavatel [former_employer.GetTitledFirstName] tu drzost nazvat mě #EMP 'redundant'#! a bez obřadů mě vyhodit na ulici!“"
 wet_nurse_court_position_job: "„Pečovala jsem o malé děti rodu [former_employer.GetHouse.GetName]. Viděla jsem je vyrůstat, krmila jsem je, přebírala oblečení, učila je chodit... a milovaly mě! Teď jsem ztracená a bez prostředků, protože bezcitný a krutý [former_employer.GetTitledFirstName] prohlásil, že jsem #EMP 'břemeno bez užitku'#! jak děti dospěly!" # todo: RETRANSLATED ENGLISH
 antiquarian_court_position_job: "„Pečoval jsem o [former_employer.GetPrimaryTitle.GetAdjective] artefakty ve službě [former_employer.Custom2('InsultAdjective', SCOPE.sC('local_character'))] [former_employer.GetTitledFirstName]. Leštil jsem urny a truhly, ošetřoval zbraně a šperky lesklými oleji, [Select_CString(ROOT.Char.IsFemale,'skládala','skládal')] hedvábí a prádlo s tou nejpečlivější péčí – a co za to jsem dostal? [Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] jsem vyhnán do ulic, ano! Ach, jak si přeji znovu pečovat o takové poklady..."
 bp3_journey.1900.knowledge_hoarding: "Co víš o tomto místě? Řekni mi vše!"
 bp3_journey.1900.curiosity: "Ty chudáku, přidej se ke mně a postarám se o tebe!"
 bp3_journey.1900.a: "Vezmi si tyto mince a vyprávěj mi svůj příběh."
 bp3_journey.1900.b: "Mohu ti dát víc než mince – mohu ti dát práci!"
 bp3_journey.1900.c: "Zmiz, špinavý žebráku!"
 bp3_journey.2000.t: "Chodící legenda"
 bp3_journey.2000.desc: "„Zdravím, vy jste snad [ROOT.Char.GetTitledFirstName]?“ [new_promoter.GetWomanMan] mě přivolává.\n\n„Jsem [new_promoter.GetFirstNameNicknamed], [new_promoter.GetTitleAsNameNoTooltip|U] z [new_promoter.GetPrimaryTitle.GetBaseNameNoTier], a [Select_CString(ROOT.Char.IsFemale,'slyšela','slyšel')] jsem legendu o [ROOT.Char.GetPromotedLegend.GetName]!“ pokračuje [new_promoter.GetSheHe]. „Někteří hudebníci u [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] přilákali slušný dav zpívající o dobrodružstvích [ROOT.Char.GetPromotedLegend.GetProtagonist.GetShortUINamePossessive], což vzbudilo můj zájem – poctíte mě tím, že ji vyprávíte svými vlastními slovy?“"
 bp3_journey.2000.a: "Kde jsou ti hudebníci? [Select_CString(ROOT.Char.IsFemale,'Ráda','Rád')] bych je sponzoroval..."
 bp3_journey.2000.b: "[Select_CString(ROOT.Char.IsFemale,'Ráda','Rád')] vám to povím!"
 bp3_journey.2000.c: "Mám důležitější věci na práci."
 bp3_journey.2100.t: "[location.GetCounty.GetTitle.GetAdjectiveNoTooltip] specialita"
 bp3_journey.2100.desc: "„Kupte si jídlo tady!“ křičí pouliční prodavač. „Mám grilované [local_character.Custom('RegionalEdibleMeat')]-špízy, mám [local_character.Custom('GetFoodDetail')]-plněné [local_character.Custom('GetRandomRegionalSmallGame')], mám [local_character.Custom('FavoriteTreatDemand')] – a proč si k tomu nedát hrnek [local_character.Custom('RegionalDrink')]!\n\n„Vlastně!“ [local_character.GetSheHe] se ke mně otočí. „Proč neochutnáte mou speciální [location.GetCounty.GetTitle.GetAdjectiveNoTooltip] [local_character.Custom('FunFoodPrefix')]-[local_character.Custom('GetLocalStreetFood')]? Je velmi zdravá a má magické účinky: udělá z vás ještě více [ROOT.Char.Custom('ComplimentAdjective')]!“"
 bp3_journey.2100.knowledge_hoarding: "Magické účinky? Hm, dej mi jeden."
 bp3_journey.2100.curiosity: "Miluji [local_character.GetCulture.GetNameNoTooltip] jídlo, nech mě ochutnat všechno!"
 bp3_journey.2100.curiosity_2: "Měl bys ochutnat jídlo z [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetAdjectiveNoTooltip] u mě na [ROOT.Char.Custom('GetCourtType')]!"
 bp3_journey.2100.a: "Hrnek [local_character.Custom('RegionalDrink')] a [local_character.Custom('RegionalEdibleMeat')]-špíz, prosím."
 bp3_journey.2100.b: "Zdá se, že byste [Select_CString(ROOT.Char.IsFemale,'byla','byl')] vynikajícím ochutnávačem jídla."
 bp3_journey.2100.c: "Ne, jsem tu, abych [Select_CString(ROOT.Char.IsFemale,'prozkoumala','prozkoumal')]."
 food_prefix_honey: "medový"
 food_prefix_berry: "bobulový"
 food_prefix_salt: "slaný"
 chance_of_food_poisoning: "Šance na otravu jídlem #weak ([GetTrait('ill').GetName( GetPlayer )])#!: #N [SCOPE.ScriptValue('food_poison_value')|0]%#!"
 bp3_journey.2200.t: "[local_character.Custom('RaunchyComplimentNoun')|U] z [location.GetCounty.GetTitle.GetNameNoTierNoTooltip]"
 bp3_journey.2200.desc: "„Přejete si společnost, [ROOT.Char.Custom('FormOfAddressForLiege')]?“ [local_character.GetWomanMan] šeptá svůdně, přejížděje prstem po [local_character.GetHerHis] [local_character.Custom('ObjectifiedFeature')]. „Ať už je vaše touha jakákoli, jistě vás potěším –“ [local_character.GetSheHe] pokračuje tiše.\n\n„Mohu uvolnit vaše tělo teplými oleji, anebo potěšit vaši mysl čtením [SCOPE.Custom('RandomEntertainmentTextName')], a pokud jsou vaše touhy více... tělesné, mohu být s vámi na noc."
 bp3_journey.2200.spread_legend_intent: "Mohu vám něco přečíst: [ROOT.Char.GetPromotedLegend.GetNameNoTooltip]!"
 bp3_journey.2200.knowledge_hoarding: "Toužím po společnosti – ve formě rozhovoru!"
 bp3_journey.2200.curiosity: "Jste výjimečný! Opusťte tento život a přidejte se ke mně."
 bp3_journey.2200.curiosity_2: "Taková krása – buď mou, má [location.GetCounty.GetTitle.GetAdjectiveNoTooltip] [local_character.Custom('RaunchyComplimentNoun')]!"
 bp3_journey.2200.a: "Dám [local_character.GetHerHim] pořádné vyžití!"
 bp3_journey.2200.a_2: "Horké oleje zní dobře..."
 bp3_journey.2200.b: "Někdo s vašimi talenty je tu promarněn."
 bp3_journey.2200.c: "Nech mě být, [local_character.Custom2('InsultNounSexual', ROOT.Char)]."
 local_monument_tt: "[Select_CString(local_character.IsFemale,'Žila','Žil')] většinu svého života poblíž [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], takže [local_character.GetSheHe] musí mít o tom hodně co říct."
 bp3_journey.2300.t: "[local_ruler.GetTitledFirstNamePossessiveNoTooltip] [regiment.GetNameNoTooltip]"
 bp3_journey.2300.desc: "U vchodu do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] zahlédnu procesí [regiment.GetName], jak pořádá triumfální přehlídku pro místního [local_ruler.GetLadyLord|U], [local_ruler.GetTitledFirstName].\n\n„Jste hrdostí těchto zemí!“ hlas [local_ruler.GetFirstNamePossessiveNoTooltip] se rozléhá po nádvoří. „Moji slavní [location.GetCulture.GetNameNoTooltip] válečníci – vyvolení z mého [regiment.GetNameNoTooltip] – a věční ochránci [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]!“"
 bp3_journey.2300.knowledge_hoarding: "Pojďme si promluvit o tomto fascinujícím místě, [local_ruler.GetLadyLord|U] [local_ruler.GetFirstNameNoTooltip]."
 bp3_journey.2300.curiosity: "Vaše vláda nad [location.GetCulture.GetCollectiveNounNoTooltip] je obdivuhodná!"
 bp3_journey.2300.curiosity_2: "[Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] bych velmi poctěn, kdybych si mohl vzít šampiona, [local_ruler.GetFirstNameNoTooltip]!"
 bp3_journey.2300.a: "S požehnáním [local_ruler.GetFirstNamePossessiveNoTooltip] bych i já mohl postavit [regiment.GetNameNoTooltip]!"
 bp3_journey.2300.b: "Jeden z těchto [regiment.GetNameNoTooltip] by [Select_CString(regiment.IsFemale,'byla','byl')] skvělým šampionem."
 bp3_journey.2300.c: "Měl bych být [Select_CString(ROOT.Char.IsFemale,'viděna','viděn')] vedle [local_ruler.GetFirstNameNoTooltip]."
