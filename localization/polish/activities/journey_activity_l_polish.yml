 miniature_monument.desc: "Tato hlíněná miniatura, zakoupená v [location.GetName], znázorňuje [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName]. \n\n[location.GetHolding.GetSpecialBuildingType.GetDescription]"
 bp3_journey.1000.t: "Pouliční prodej architektonických miniatur"
 bp3_journey.1000.desc: "„Kupte si svou miniaturu [location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] zde!“ volá hlas prodavače nahlas po tržišti.\n\nPři bližším ohledání si všimnu, že hliněné ozdoby jsou #EMP pozoruhodné#! kvality. Všechno je tam, až do nejmenšího detailu. Je to upřímně neuvěřitelně dobré.\n\n„Byly vyrobeny ručně, [ROOT.Char.Custom('FormOfAddressForLiege')|U]! Chtěli byste si jeden koupit?"
 bp3_journey.1000.knowledge_hoarding: "Musíte mi ukázat, jak je vyrobili."
 bp3_journey.1000.curiosity: "Vy [local_character.GetCulture.GetNameNoTooltip] řemeslníci jste neuvěřitelní! Přidejte se ke mně!"
 bp3_journey.1000.lechery: "Berete... zakázky na míru?"
 bp3_journey.1000.a: "Vezmu jeden!"
 bp3_journey.1000.b: "Mohu využít vaše dovednosti na [ROOT.Char.Custom('GetCourtType')]."
 bp3_journey.1000.c: "Jsem #EMP [ROOT.Char.GetTitleAsNameNoTooltip|U]#!, přestaňte mi ztrácet čas!"
