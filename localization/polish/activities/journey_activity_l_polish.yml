 suggestive_miniature_monument.desc: "Tato hlíněná miniatura, zakoupená v [location.GetName], znázorňuje [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName]. \n\n[location.GetHolding.GetSpecialBuildingType.GetDescription] Falické věže a nahé miniatury obyvatel pravděpodobně nebyly součástí původní kompozice."
 bp3_journey.1100.t: "Jméno věčné"
 bp3_journey.1100.desc_intro: "Když procházím po okolí, spatřím na [location.Custom('GetSpecialBuildingSurface')] podivné značení.\n\n"
 bp3_journey.1100.desc_name: "Při bližším pohledu čtu: #EMP '[ancient_vandal.GetFullName] [Select_CString(ancient_vandal.IsFemale,'byla','byl')] zde, pohlédněte na mé jméno a vězte, že jsem [ancient_vandal.Custom('FormalComplimentAdjective')]!'#! Hm, pokud si [ancient_vandal.GetSheHe] může vytesat své jméno pro zvědavé kolemjdoucí k obdivu navěky, pak možná..." # todo: RETRANSLATED ENGLISH
 bp3_journey.1100.desc_first: "Je to nedotčené, čisté, na očích kolemjdoucích... jen čeká na někoho, kdo zvěční své jméno."
 bp3_journey.1100.desc_outro: "\n\nPohlédnu dolů a vidím dlátovitý kámen, který mě láká."
 bp3_journey.1100.knowledge_hoarding: "Mezi vytesanými znaky musí být skryta moudrost!"
 bp3_journey.1100.curiosity: "„[ROOT.Char.GetFirstNameNoTooltip], přítel [location.GetCulture.GetCollectiveNounNoTooltip], zde kráčel.“"
 bp3_journey.1100.a: "Byla by škoda, kdyby si lidé nepamatovali #EMP mé# jméno!"
 bp3_journey.1100.b: "To by [Select_CString(ROOT.Char.IsFemale,'byla','byl')] dobrý suvenýr..."
 bp3_journey.1100.c: "Raději zůstanu anonymní."
 a_large_rock: "velký, plochý kámen stojící poblíž [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName]"
 the_mine_entrance: "skalní vchod do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName]"
 a_wall: "jedna ze zdí tvořících [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName]"
 artifact_gained: "Získán artefakt"
 prestige_trinket: "Získáte suvenýr [Concept('artifact','artefakt')|E], který poskytuje [Concept('prestige','prestiž')|E]" # todo: CONCEPT CASE
 grafitti_rock: "Vytesaný kámen z [location.GetNameNoTooltip]"
 grafitti_rock.desc: "Tento kámen [Select_CString(ROOT.Char.IsFemale,'byla','byl')] uvolněn z [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] a má na sobě rytinu, která zní: #EMP '[ancient_vandal.GetFullName] [Select_CString(ancient_vandal.IsFemale,'byla','byl')] zde, pohlédněte na mé jméno a vězte, že jsem [ancient_vandal.Custom('FormalComplimentAdjective')]!'#!" # todo: RETRANSLATED ENGLISH
 defaced_monument_opinion: "Poškozená památka"
 bp3_journey.1200.t: "Střih a holení"
 bp3_journey.1200.desc: "V rohu tržiště spatřím bránu se znamením #EMP '[local_character.GetFirstNameNicknamed] – Barber & Surgeon'#!, před kterou stojí dlouhý zástup. Vypadá to na #EMP velmi#! oblíbené místo.\n\nKdyž se přiblížím, vidím, jak [local_character.GetWomanMan] stříhá s obratností a přesností, jakou jsem nikdy předtím [Select_CString(ROOT.Char.IsFemale,'neviděla','neviděl')]! Ztuhlé a zacuchané hřívy se mění v ty nejlesklejší a nejbohatší kadeře."
 bp3_journey.1200.knowledge_hoarding: "Jak se [local_character.GetSheHe] pohybuje tak ladně?"
 bp3_journey.1200.curiosity: "Dejte mi pravý #EMP '[location.GetNameNoTooltip]-styl'#! střih, a pak se ke mně přidejte!"
 bp3_journey.1200.a: "Jeden střih, prosím!"
 bp3_journey.1200.b: "Mohli bych využít tohoto holiče-chirurga na [ROOT.Char.Custom('GetCourtType')]."
 bp3_journey.1200.c: "Ztráta času."
 barber_success: "Dostanete nádherný nový střih"
 barber_fail: "Dostanete hrozný střih"
 hair_will_change: "Váš účes se změní na #V 6#! měsíců"
 bp3_journey.1300.t: "Písně [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
 bp3_journey.1300.desc: "Svůdná melodie se mi line do uší, když stojím před [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]. Muzikant, který předvádí zdobený místní nástroj, hraje mistrnou skladbu, zatímco pestrobarevný šašek - stejně úžasný ve své [Select_CString(local_character_2.IsFemale,'její','jeho')] produkci - zpívá a tančí na ni:\n\n#EMP „[location.Custom('GetSpecialBuildingSong')]“#!"
 bp3_journey.1300.knowledge_hoarding: "V té písni musí být hlubší význam..."
 bp3_journey.1300.curiosity: "Proč byste se oba nepřipojili k mé [ROOT.Char.Custom('GetCourtType')]?"
 bp3_journey.1300.spread_legend_intent: "Měli byste zpívat o [ROOT.Char.GetPromotedLegend.GetNameNoTooltip]!"
 bp3_journey.1300.a: "Šašek je vznešený, musím mít [local_character.GetHerHim]!"
 bp3_journey.1300.b: "Taková hudba musí zkrášlit mé komnaty doma!"
 bp3_journey.1300.c: "Nádhera!"
 event_song_religious_01: "Pod klenbami [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], kde leží víra a ticho, scházíme se ve světle, naše duše nikdy neumírají."
 event_song_religious_02: "V sálech posvátného klidu stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] pyšně, jeho věže sahají k oblakům, jak modlitby a hlasy volají."
 event_song_religious_03: "Kde zvony [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] zvoní, jejich ozvěny čisté a jasné, nalézáme zde útěchu v uctívání, naději a modlitbě."
 event_song_learning_01: "Uprostřed zaprášených svazků a dávných učení [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] šeptá moudrost, tajemství a mnohem víc."
 event_song_learning_02: "Kde se v síních [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] sbíhají mysli, pátrání po vědění boří zdi nevědomosti."
 event_song_learning_03: "Pod oblouky [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] debatí učenci, rozpletají záhady, jimž čas neublíží."
 event_song_mines_01: "Hluboko v srdci [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], kde se skrývá poklad, horníci dřou ve tmě, s pýchou jako průvodcem."
 event_song_mines_02: "Pod zemí v [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] zpívají krumpáče, honí žíly bohatství, aby přinesly velké jmění."
 event_song_mines_03: "V hlubinách [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], kde přebývá ozvěna, tesáme tajemství kamene, jeho příběhy k vyprávění."
 event_song_martial_01: "Mezi stíny [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], kde se vojáci cvičí a dřou, zní kovový cinkot, na této posvěcené půdě."
 event_song_martial_02: "Ve stínu moci [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] máme meče připravené pro správnou věc, bráníme střevo domova až do rozbřesku."
 event_song_martial_03: "Pod bdělým dohledem [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], kde prapory statečně vlají, zní přísahy, v umění dávného válečnictví."
 event_song_ancient_wonders_01: "Ve věčném stínu [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], kde spí historie, přetrvávají pradávné příběhy v tichu, co zachovává."
 event_song_ancient_wonders_02: "Dívaje se na [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], divy dávných časů, vyprávění staré, šepoty legend a zvyků."
 event_song_ancient_wonders_03: "Věčný jako hvězdy stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], svědectví času, formované pradávnýma rukama."
 event_song_economic_01: "V ruchu srdce [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], kde kvete obchod, puls obchodování a smluv, kde přichází prosperita."
 event_song_economic_02: "Živá píseň trhu naplňuje vzduch [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], symfonie podnikání, bohatství bez srovnání."
 event_song_economic_03: "Řemesla a zboží přebývají v síních [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], kde ozvěny kupcových volání a štěstí přichází."
 event_song_diplomatic_01: "Pod dohledem [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], kde se pletou aliance, slova tkají budoucnost až do západu slunce."
 event_song_diplomatic_02: "Výmluvné síně [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], kde hlasy stoupají a klesají, v tanci diplomacie jedno slovo může změnit vše."
 event_song_diplomatic_03: "V velkých dvorech [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], mezi šepoty a intrikami, každý gest má váhu v království králů a královen."
 event_song_natural_wonders_01: "Ó, vznešenost přírody, tak rozlehlá a široká, kde orli vysoko krouží a tajemství se skrývají. V srdci země, či tam, kde vody tečou, je krása nezkrotná, kterou jen málokdo skutečně zná."
 event_song_natural_wonders_02: "Pod nekonečnou oblohou, na pradávné zemi, kde ve větru se nacházejí šepoty minulosti. Mezi vysokými vrchy nebo u jasných břehů, duch země zpívá těm, kdo slyší."
 event_song_natural_wonders_03: "V náruči přírody, kde bloudí divoká zvěř, uprostřed drsné krásy nacházíme domov. U moci hor nebo u klidného jezera, v každém listu i kameni se zjevují divy přírody."
 bp3_journey.1400.t: "Prodej masa"
 bp3_journey.1400.desc: "Přistoupím k hrubě vypadajícímu [local_character.GetWomanMan], který v [Select_CString(local_character.IsFemale,'její','jeho')] stánku nese působivou sbírku kožichů. [local_character.GetSheHe|U] vypadá jako plodný lovec. „Mám [local_character.Custom('GetRandomRegionalSmallGame')], [local_character.Custom('GetRandomRegionalWildDaytimeBird')], [local_character.Custom('GetRegionalDeerType')] – kup si maso a kožešiny tady!“ volá [local_character.GetSheHe].\n\nNajednou se mi zahledí přímo do očí, [Select_CString(local_character.IsFemale,'její','jeho')] pohled je pronikavý jako [local_character.Custom('GetRegionalWolfType')]. „Ah, #EMP [ROOT.Char.GetTitleAsNameNoTooltip|U]#!, pro vás mám to nejkrálovštější maso ze všech: #EMP [ROOT.Char.Custom('RegionalOnlyFerociousAnimal')]#!.“"
 bp3_journey.1400.knowledge_hoarding: "Vyznáte se tady, ukažte mi to, prosím."
 bp3_journey.1400.curiosity: "Mohl byste mě něco naučit!"
 bp3_journey.1400.a: "Dovolte mi koupit [newly_created_artifact.GetNameNoTooltip]."
 bp3_journey.1400.b: "Měl bys být mým Mistrem lovu!"
 bp3_journey.1400.c: "To maso je pro mě skutečně královské!"
 bp3_journey.1500.t: "Vzdělaní místní"
 bp3_journey.1500.desc: "Při mém průzkumu zaslechnu rozhovor mezi dvěma vzdělanými místními. „Nikdy nebylo snazší rozdělovat almužny, od té doby co jste upravili areál. [local_character.GetFaith.HighGodName|U] vás jistě požehná, [local_character_2.GetFirstName],“ říká jeden [local_character.GetWomanMan].\n\n„Jsem poctěn, drahý [local_character.GetFirstName], ale ty jsi velmi milovaný a [local_character.Custom('ComplimentAdjective')] sluha božstva – já jen vykonávám svou práci jako zahradník [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip],“ pokračuje druhý."
 bp3_journey.1500.knowledge_hoarding: "Pokud věnuji almužny, ukážete mi areál?"
 bp3_journey.1500.curiosity: "Jste oba velmi [local_character.Custom('ComplimentAdjective')], poctíte mou [ROOT.Char.Custom('GetCourtType')] svou přítomností?"
 bp3_journey.1500.curiosity_2: "Od [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] k [local_character.GetCulture.GetCollectiveNounNoTooltip] – dar přátelství!"
 bp3_journey.1500.a: "Potřebuji, abyste rozdávali almužny za mne v [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]."
 bp3_journey.1500.b: "Moji služebníci nejsou nikdy včas – prosím, zorganizujte mou [ROOT.Char.Custom('GetCourtType')]!"
 bp3_journey.1500.c: "Takto to tu tedy provozují..."
 inspired_by_alms_modifier: "Inspirován organizovaným rozdáváním almužen"
 inspired_by_alms_modifier_desc: "Tato postava byla inspirována tím, jak byly při návštěvě monumentu dobře organizovány almužny."
 bp3_journey.1600.t: "Město koček"
 bp3_journey.1600.desc: "Kočky jsou #EMP všude#! v těchto končinách – není zde kout, skulina či zákoutí bez spící kočky! Dokonce tu spí kočky [location.Custom('GetSpecialBuildingCatSleepingSpot')] [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]...\n\nNajednou se mi živé kotě přitulí kolem nohou, téměř mě láká do uličky, kterou jsem předtím [Select_CString(ROOT.Char.IsFemale,'neviděla','neviděl')]. Jak zvědavé."
 bp3_journey.1600.knowledge_hoarding: "Jaká tajemství čekají, malý příteli?"
 bp3_journey.1600.curiosity: "Místní milují své kočky, nakrmím je všechny!"
 bp3_journey.1600.a: "Nepostrádali by jen #EMP jedno#! kotě..."
 bp3_journey.1600.b: "Zmiz, malý škůdče!"
 cat_help: "Kočka vás dovede k zajímavé kamenné desce"
 get_lost: "Jste přepaden, ale něco se naučíte"
 cats_sleeping_religious_01: "v teplém slunečním světle, které proudí okny"
 cats_sleeping_religious_02: "na vrcholcích mnoha oltářů"
 cats_sleeping_religious_03: "na uctívaných hrobkách"
 cats_sleeping_learning_01: "na vrcholcích hromad dobře ošoupaných rukopisů"
 cats_sleeping_learning_02: "na klíně hluboce zabraných učenců"
 cats_sleeping_learning_03: "na sluncem zalitých parapetech"
 cats_sleeping_mines_01: "na chladných kamenech u vchodu"
 cats_sleeping_mines_02: "útulně v těžních vozech"
 cats_sleeping_mines_03: "na skalních výčnělcích blízko šachty"
