 increase_skill_chance_30: "Šance na jedno dodatečné zvýšení [Concept('skill','dovednosti')|E] po skončení: #P +30%#!"
 increase_skill_chance_35: "Šance na jedno dodatečné zvýšení [Concept('skill','dovednosti')|E] po skončení: #P +35%#!"
 increase_skill_chance_50: "Šance na jedno dodatečné zvýšení [Concept('skill','dovednosti')|E] po skončení: #P +50%#!"
