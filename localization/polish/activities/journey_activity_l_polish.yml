 cats_sleeping_economic_01: "mezi rušnými trhovými stánky"
 cats_sleeping_economic_02: "na sudech zboží v rušných obchodních domech"
 cats_sleeping_economic_03: "v priehlbinách bohatých domů obchodníků"
 cats_sleeping_diplomatic_01: "v ozdobných zahradách"
 cats_sleeping_diplomatic_02: "na klínech diplomatů"
