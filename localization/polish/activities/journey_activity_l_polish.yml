l_polish:
 activity_journey: "Expedice k památce"
 activity_journey_desc: "Podnikněte výpravu k slavné památce nebo orientačnímu bodu, abyste se zlepšili tím, že se ponoříte do historie, vědomostí a tajemství, která tam dřímou."
 activity_journey_guest_desc: ""
 activity_journey_conclusion_desc: "Výprava vám umožnila se zamyslet a zlepšit své schopnosti jako vládce."
 activity_journey_selection_tooltip: "Vydejte se na výpravu k [Concept('special_building','zvláštní budově')|E], hledat vědění a zlepšení sebe sama.\n\nOčekávané odměny:\n$activity_journey_host_desc$" # todo: CONCEPT CASE
 activity_journey_host_desc: "#indent_newline:8 $BULLET_WITH_TAB$[Concept('intrigue_i','@skill_intrigue_icon!')|E][Concept('diplomacy_i','@skill_diplomacy_icon!')|E][Concept('martial_i','@skill_martial_icon!')|E][Concept('learning_i','@skill_learning_icon!')|E][Concept('stewardship_i','@skill_stewardship_icon!')|E]#V 1#! Zaručený [Concept('skill','dovednost')|E] bod, #V 1#! Možný dodatečný [Concept('skill','dovednost')|E] bod\n#weak (Odměny v bodech dovedností jsou založeny na navštíveném [Concept('special_building','zvláštní budově')|E])#!#!\n$BULLET_WITH_TAB$[court_position_i]Vynikající-[Concept('aptitude','způsobilost')|E] [Concept('court_positions','dvorské úřady')|E]\n$BULLET_WITH_TAB$[Concept('prestige_i','@prestige_icon!')|E][Concept('prestige','Prestiž')|E]\n\n#weak Do svého [Concept('entourage','doprovodu')|E] si s sebou vezmete své [Concept('children','děti')|E] a [Concept('spouses','choti')|E].#!" # todo: CONCEPT CASE
 activity_journey_predicted_cost: "Cena [Concept('monument_expedition','výprava k památce')|E] je primárně ovlivněna vzdáleností k vámi vybranému [Concept('special_building','zvláštní budově')|E]." # todo: CONCEPT CASE
 activity_journey_destination_selection: "Platné cíle musí mít postavený [Concept('special_building','zvláštní budova')|E], který není generický svatý objekt #weak (jako [GetBuilding('holy_site_cathedral_01').GetName])#! nebo generická [GetBuilding('generic_university').GetName]. Každé místo může být navštíveno pouze jednou.\n\n[Concept('intrigue_i','@skill_intrigue_icon!')|E][Concept('diplomacy_i','@skill_diplomacy_icon!')|E][Concept('martial_i','@skill_martial_icon!')|E][Concept('learning_i','@skill_learning_icon!')|E][Concept('stewardship_i','@skill_stewardship_icon!')|E][Concept('skill','Dovednost')|E] Zvýšení jsou založena na typu [Concept('point_of_interest','zajímavého místa')|E] navštíveného [Concept('special_building','zvláštní budovy')|E]." # todo: CONCEPT CASE
 journey_knowledge_hoarding_intent: "Hromadění znalostí"
 journey_knowledge_hoarding_intent_desc: "Máte jediný cíl – sesbírat co nejvíce vědomostí. Můžete zvýšit svoji šanci na extra [Concept('skill','dovednost')|E] bod výměnou za [Concept('stress','stres')|E]." # todo: CONCEPT CASE
 journey_curiosity_intent: "Zvědavost"
 journey_curiosity_intent_desc: "Nejen samotné památky skrývají mnoho – i lidé žijící kolem nich. Získáte více [Concept('cultural_acceptance','kulturní přijetí')|E] a [Concept('strong_hooks','silné páky')|E] na ty, které naverbujete." # todo: CONCEPT CASE
 activity_journey_guest_help_text: "[Concept('activity_guests','Hosté aktivity')|E] dostanou příležitosti zvýšit své [Concept('skills','dovednosti')|E]. Zejména pokud jsou pro vás důležití, například váš [Concept('player_heir','hráčský dědic')|E]." # todo: CONCEPT CASE
 phase_experience: "Průzkum"
 phase_experience_desc: "Pozorujte památku, procházejte okolní pozemky a komunikujte s místními – vše ve snaze nabýt vědění."
