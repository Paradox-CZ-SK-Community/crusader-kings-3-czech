 journey_skilled_scribes_desc: "#indent_newline:8 $BULLET_WITH_TAB$ $increase_skill_chance_20$#!\n#indent_newline:8 $BULLET_WITH_TAB$ Dva velmi schopní [GetTrait('devoted').GetName( GetNullCharacter )] se připojí k doprovodu. Po skončení [Concept('activity','aktivitě')|E] zůstanou vašimi [Concept('courtiers','dvořany')|E] a budete na ně mít #EMP závazky#! [Concept('hooks','páky')|E], což sníží jejich plat na [Concept('court_positions','dvorské úřady')|E].#!\n\n#flavor Není hanba si přibrat nějakou vnější pomoc, koneckonců si nemohu #EMP všeho#! pamatovat sám.#!" # todo: CONCEPT CASE
