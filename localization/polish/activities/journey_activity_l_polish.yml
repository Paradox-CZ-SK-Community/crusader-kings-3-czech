 bp3_journey.0015.e: "Zajímá mě, co se děje za oponou..."
 bp3_journey.0015.knowledge_hoarding: "Čas si dělat poznámky!"
 bp3_journey.0015.journey_curiosity_intent: "Budu se míchat s místními!"
 bp3_journey.0015.spread_legend_intent: "Lidé! Slyšeli jste pověst o [ROOT.Char.GetPromotedLegend.GetNameNoTooltip]?"
 bp3_journey.0015.friend: "Jsem tak [Select_CString(ROOT.Char.IsFemale,'ráda','rád')], že mohu sdílet tento okamžik s [potential_friend.GetFirstNameNoTooltip]!"
 bp3_journey.0015.lover: "#EMP *Diskrétně se přibližte a polibte [potential_lover.GetFirstNameNoTooltip]*#!"
 bp3_journey.0015.prestige: "Jsem tu, abych [Select_CString(ROOT.Char.IsFemale,'byla viděna','byl viděn')]!"
 friend_bonded_by_monument: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] se spřátelili při objevování [PROVINCE.Custom('GetSpecialBuildingPrefix')][PROVINCE.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] v [PROVINCE.GetName]."
 friend_bonded_by_monument_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] a [CHARACTER.GetShortUIName] se spřátelili při objevování [PROVINCE.Custom('GetSpecialBuildingPrefix')][PROVINCE.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] v [PROVINCE.GetName]."
 lover_kissed_by_monument: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] sdíleli vášnivý polibek poblíž [PROVINCE.Custom('GetSpecialBuildingPrefix')][PROVINCE.GetHolding.GetSpecialBuildingType.GetName] v [PROVINCE.GetName]."
 lover_kissed_by_monument_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] a [CHARACTER.GetShortUIName] sdíleli vášnivý polibek poblíž [PROVINCE.Custom('GetSpecialBuildingPrefix')][PROVINCE.GetHolding.GetSpecialBuildingType.GetName] v [PROVINCE.GetName]."
 lover_fell_in_love_with_prostitute_by_monument: "[CHARACTER.GetShortUIName|U] se [Select_CString(CHARACTER.IsFemale,'zamilovala','zamiloval')] do [TARGET_CHARACTER.GetShortUIName], když [TARGET_CHARACTER.GetShortUIName] '[Select_CString(TARGET_CHARACTER.IsFemale,'pracovala','pracoval')]' v temných uličkách poblíž [PROVINCE.Custom('GetSpecialBuildingPrefix')][PROVINCE.GetHolding.GetSpecialBuildingType.GetName] v [PROVINCE.GetName]."
