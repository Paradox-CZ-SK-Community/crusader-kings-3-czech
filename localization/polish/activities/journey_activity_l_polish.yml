 journey_knowledge_hoarding_intent_idesc2: "Každý kámen, každé vyrytí na [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] šeptá starobylé vědomosti a láká mě, abych šel hlouběji."
 journey_knowledge_hoarding_intent_idesc3: "Pokusy odhalit starobylou moudrost ukrytou v [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] jsou pro mé učenecké srdce nepřekonatelným voláním."
 journey_curiosity_intent_idesc: "Nemohu se dočkat, až se smísím s lidmi okolo [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName], uslyším jejich příběhy a uvidím jejich každodenní život."
 journey_curiosity_intent_idesc2: "Živý ruch kolem [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] slibuje mozaiku setkání a poučení."
 journey_curiosity_intent_idesc3: "Přitažlivost objevit neznámé stránky [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] očima místních je vzrušující."
 spread_legend_intent_idesc: "Představa zvěčnit [me_scope.GetPromotedLegend.GetName] v ruchu [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] mě naplňuje jedinečným cílem."
 spread_legend_intent_idesc2: "Ve stínu [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] si představuji [me_scope.GetPromotedLegend.GetName] ozývající se celými ulicemi, příběh, který místním vyrazí dech!"
 spread_legend_intent_idesc3: "Kráčím k [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName], dokonalému pozadí, kde zvěčnit [me_scope.GetPromotedLegend.GetName] v análech historie, legendu, kterou budou vyprávět místní po generace."
