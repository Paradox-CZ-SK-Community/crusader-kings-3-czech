 journey_skill_gain_final_log_title: "Zvýšení dovednosti"
 journey_skill_gain_final_log: "[CHARACTER.GetShortUIName|U] si zlepšuje dovednosti"
 journey_knowledge_hoarding_intent_idesc: "Pomyšlení na tajemství, která ukrývá [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName], ve mně probouzí neukojitelnou žízeň po vědění."
 journey_knowledge_hoarding_intent_idesc2: "[location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] je plné prastarého vědění. Každý kámen, každá rytina jako by mě vybízely, abych pronikl ještě hlouběji."
 journey_knowledge_hoarding_intent_idesc3: "[location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] ukrývá prastarou moudrost, jejímuž volání mé srdce učence nedokáže odolat."
 journey_curiosity_intent_idesc: "Už se nemohu dočkat, až poznám lidi žijící v okolí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName], vyslechnu si jejich příběhy a nahlédnu do jejich každodenního života."
 journey_curiosity_intent_idesc2: "V okolí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] panuje čilý ruch, který slibuje pestrou směs setkání a nových poznatků."
 journey_curiosity_intent_idesc3: "Představa, že díky očím místních odhalím dosud nepoznané stránky [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName], mě naplňuje vzrušením."
 spread_legend_intent_idesc: "Pomyšlení, že právě mezi ruchem kolem [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] učiním legendu [me_scope.GetPromotedLegend.GetName] nesmrtelnou, mi dává zcela nový smysl."
 spread_legend_intent_idesc2: "Ve stínu [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] už téměř slyším, jak ulicemi zní legenda [me_scope.GetPromotedLegend.GetName] a místní jí naslouchají v úžasu!"
 spread_legend_intent_idesc3: "Mířím k [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName]. Dokonalé místo, aby se legenda [me_scope.GetPromotedLegend.GetName] nesmazatelně zapsala do dějin a místní si ji předávali po celé generace."
 monument_view_intro_1: "Když se na obzoru objeví silueta, kterou má [location.Custom('MonumentTypeDesc')], cítím, jak ve mně narůstá očekávání."
 monument_view_intro_2: "Konečně přede mnou stojí [location.Custom('MonumentTypeDesc')]. V srdci se mi rozhoří jiskra zvědavosti a já toužím pustit se do průzkumu."
 monument_view_intro_3: "V dálce se vynořuje [location.Custom('MonumentTypeDesc')] a s každým krokem blíž ve mně sílí úžas."
