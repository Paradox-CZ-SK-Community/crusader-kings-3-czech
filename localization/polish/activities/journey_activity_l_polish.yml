 bp3_journey.0010.t: "Sbohem, [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
 bp3_journey.0010.desc: "Nastal čas sbalit si věci a vydat se domů.\n\n[location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] jsem prozkoumal ze všech stran. Viděl jsem mnoho pozoruhodností, pořídil si poznámky i kresby a poznal místní obyvatele. Na tuto výpravu jen tak nezapomenu!\n\nSbohem, [location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]... Sbohem, [location.Custom('ProvinceCompliment')] [location.GetNameNoTooltip]!"
 bp3_journey.0010.a: "Nikdy nesmím zapomenout, co jsem se tu naučil."
