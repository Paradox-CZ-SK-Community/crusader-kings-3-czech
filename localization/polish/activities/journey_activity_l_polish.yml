 lover_fell_in_love_with_prostitute_by_monument: "[CHARACTER.GetShortUIName|U] se zamiloval do [TARGET_CHARACTER.GetShortUIName] během chvíle, kdy [TARGET_CHARACTER.GetShortUIName] „pracoval“ v temných uličkách poblíž [PROVINCE.Custom('GetSpecialBuildingPrefix')][PROVINCE.GetHolding.GetSpecialBuildingType.GetName] v [PROVINCE.GetName]."
 lover_fell_in_love_with_prostitute_by_monument_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] se zamiloval do [CHARACTER.GetShortUIName] během chvíle, kdy [CHARACTER.GetShortUIName] „pracoval“ v temných uličkách poblíž [PROVINCE.Custom('GetSpecialBuildingPrefix')][PROVINCE.GetHolding.GetSpecialBuildingType.GetName] v [PROVINCE.GetName]."
 miniature_monument: "Miniatura [location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
 miniature_monument.desc: "Tato hliněná miniatura zakoupená v [location.GetName] zachycuje [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName]. \n\n[location.GetHolding.GetSpecialBuildingType.GetDescription]"
 bp3_journey.1000.t: "Architektura na prodej"
 bp3_journey.1000.desc: "„Kupte si svou miniaturu [location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]!“ rozléhá se tržištěm hlas prodavače.\n\nKdyž si hliněné cetky prohlédnu zblízka, zjišťuji, že jsou #EMP pozoruhodně#! kvalitní. Nechybí ani ten nejmenší detail. Je až neuvěřitelné, jak dobře jsou provedené.\n\n„Všechno vlastníma rukama, [ROOT.Char.Custom('FormOfAddressForLiege')|U]! Nechcete si jednu koupit?“"
 bp3_journey.1000.knowledge_hoarding: "Musíš mi ukázat, jak je vyrábíš."
 bp3_journey.1000.curiosity: "Vy řemeslníci z [local_character.GetCulture.GetNameNoTooltip] kultury jste neuvěřitelní! Přidej se ke mně!"
 bp3_journey.1000.lechery: "Přijímáš také... zakázky na přání?"
 bp3_journey.1000.a: "Jednu si vezmu!"
 bp3_journey.1000.b: "Tvé schopnosti se mi budou hodit u [ROOT.Char.Custom('GetCourtType')]."
 bp3_journey.1000.c: "Jsem #EMP [ROOT.Char.GetTitleAsNameNoTooltip|U]#!, přestaň mě zdržovat!"
 will_have_excellent_aptitude: "Jejich [Concept('aptitude','způsobilost')|E] je $aptitude_excellent$"
 increase_skill_chance_25: "Šance na jedno dodatečné zvýšení [Concept('skill','dovednosti')|E] po skončení: #P +25%#!"
 increase_skill_chance_20: "Šance na jedno dodatečné zvýšení [Concept('skill','dovednosti')|E] po skončení: #P +20%#!"
