 cats_sleeping_martial_02: "na klíně bdělých stráží"
 cats_sleeping_martial_03: "mezi tichými zákoutími"
 cats_sleeping_ancient_wonders_01: "pod stínem nedalekých obelisků"
 cats_sleeping_ancient_wonders_02: "v zákoutích na stěnách"
