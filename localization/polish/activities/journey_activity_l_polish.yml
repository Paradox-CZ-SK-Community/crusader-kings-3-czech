l_polish:
 activity_journey: "Výprava k památce"
 activity_journey_desc: "Vydej se na výpravu ke slavné památce či významnému místu a zdokonal se poznáváním jeho dějin, vědění a tajemství, která se v něm skrývají."
 activity_journey_guest_desc: ""
 activity_journey_conclusion_desc: "Výprava ti poskytla čas k zamyšlení a pomohla ti zdokonalit se ve vládnutí."
 activity_journey_selection_tooltip: "Vydej se na výpravu ke [Concept('special_building','zvláštní budově')|E] a hledej vědění i cestu k vlastnímu zdokonalení.\n\nPředpokládané odměny:\n$activity_journey_host_desc$"
 activity_journey_host_desc: "#indent_newline:8 $BULLET_WITH_TAB$[intrigue_i|E][diplomacy_i|E][martial_i|E][learning_i|E][stewardship_i|E]#V 1#! zaručený bod [Concept('skill','dovednosti')|E], #V 1#! možný dodatečný bod [Concept('skill','dovednosti')|E]\n#weak (Odměny v podobě bodů dovednosti závisí na navštívené [Concept('special_building','zvláštní budově')|E])#!#!\n$BULLET_WITH_TAB$[court_position_i][Concept('court_positions','Dvorské úřady')|E] s vynikající [Concept('aptitude','způsobilostí')|E]\n$BULLET_WITH_TAB$[prestige_i|E][Concept('prestige','Prestiž')|E]\n\n#weak V [Concept('entourage','doprovodu')|E] s tebou pojedou tvé [Concept('children','děti')|E] a [Concept('spouses','choti')|E].#!"
 activity_journey_predicted_cost: "Cenu [Concept('monument_expedition','výpravy k památce')|E] ovlivňuje především vzdálenost k vybrané [Concept('special_building','zvláštní budově')|E]."
 activity_journey_destination_selection: "Platným cílem může být pouze místo s postavenou [Concept('special_building','zvláštní budovou')|E], která není obecnou budovou svatého místa #weak (například [GetBuilding('holy_site_cathedral_01').GetName])#! ani obecnou [GetBuilding('generic_university').GetName]. Každý cíl lze navštívit pouze jednou.\n\n[intrigue_i|E][diplomacy_i|E][martial_i|E][learning_i|E][stewardship_i|E]Zvýšení [Concept('skill','dovednosti')|E] závisí na typu [Concept('point_of_interest','zajímavého místa')|E] navštívené [Concept('special_building','zvláštní budovy')|E]."
 journey_knowledge_hoarding_intent: "Hromadění vědomostí"
 journey_knowledge_hoarding_intent_desc: "Máš jediný cíl: shromáždit tolik vědomostí, kolik jen dokážeš. Můžeš se rozhodnout zvýšit šanci na dodatečný bod [Concept('skill','dovednosti')|E] výměnou za [Concept('stress','stres')|E]."
 journey_curiosity_intent: "Zvídavost"
 journey_curiosity_intent_desc: "Mnohé lze odhalit nejen v samotných památkách, ale i mezi lidmi, kteří žijí v jejich okolí. Získáš více [Concept('cultural_acceptance','kulturního přijetí')|E] a [Concept('strong_hooks','silných pák')|E] na ty, které naverbuješ."
 activity_journey_guest_help_text: "[Concept('activity_guests','Hosté aktivity')|E] budou mít příležitosti zlepšit své [Concept('skills','dovednosti')|E], obzvlášť pokud jsou pro tebe důležití, například tvůj [Concept('player_heir','hráčský dědic')|E]."
 phase_experience: "Průzkum"
 phase_experience_desc: "Prohlížej si památku, procházej její okolí a rozmlouvej s místními při hledání vědomostí."
 journey_option_scribes: "Písaři"
 journey_no_scribes: "Bez písařů"
 journey_no_scribes_desc: "#flavor Stačí mi pero, trochu pergamenu a vlastní rozum.#!"
 journey_skilled_scribes: "Najmout schopné písaře"
 journey_skilled_scribes_desc: "#indent_newline:8 $BULLET_WITH_TAB$ $increase_skill_chance_20$#!\n#indent_newline:8 $BULLET_WITH_TAB$ Dvě velmi schopné postavy s rysem [GetTrait('devoted').GetName( GetNullCharacter )] se připojí k doprovodu. Po skončení [Concept('activity','aktivity')|E] zůstanou tvými [Concept('courtiers','dvořany')|E] a získáš na ně [Concept('hooks','páky')|E] typu #EMP Závazek#!, které sníží jejich plat při výkonu [Concept('court_positions','dvorských úřadů')|E].#!\n\n#flavor Není žádná ostuda přijmout pomoc zvenčí. Koneckonců si sám nemohu pamatovat #EMP všechno#!.#!"
 journey_activity_within_range: "Mimo [Concept('diplomatic_range','diplomatický dosah')|E]"
 journey_activity_already_visited: "Tato [Concept('special_building','zvláštní budova')|E] již byla navštívena"
