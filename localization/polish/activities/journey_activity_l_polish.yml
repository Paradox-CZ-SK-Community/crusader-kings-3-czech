 increase_skill_chance_2: "Šance na jedno dodatečné zvýšení [Concept('skill','dovednosti')|E] po skončení: #P +2%#!"
 suggestive_alterations: "Necháš si vyrobit něco trochu... vyzývavějšího."
 suggestive_miniature_monument: "Vyzývavě pojatá miniatura [location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
 suggestive_miniature_monument.desc: "Tato hliněná miniatura zakoupená v [location.GetName] zachycuje [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName]. \n\n[location.GetHolding.GetSpecialBuildingType.GetDescription] Věže připomínající falusy a polonahé miniaturní postavičky nejspíš nebyly součástí původní podoby."
 bp3_journey.1100.t: "Jméno na věčnost"
 bp3_journey.1100.desc_intro: "Při procházce areálem si všimnu podivné rytiny na místě, které tvoří [location.Custom('GetSpecialBuildingSurface')].\n\n"
 bp3_journey.1100.desc_name: "Když se podívám zblízka, čtu: #EMP „[ancient_vandal.GetFullName] tu zanechává své jméno. Pohleďte na ně a vězte, že jsem [ancient_vandal.Custom('FormalComplimentAdjective')]!“#! Hmm... když si tu [ancient_vandal.GetFullName] [Select_CString(ancient_vandal.IsFemale,'mohla','mohl')] vytesat své jméno, aby je zvědaví kolemjdoucí obdivovali až na věčnost, pak možná..."
 bp3_journey.1100.desc_first: "Je neposkvrněné, nedotčené a všem na očích... jako by jen čekalo, až tu někdo zvěční své jméno."
 bp3_journey.1100.desc_outro: "\n\nSklopím zrak a spatřím kámen připomínající dláto, který jako by mě přímo vybízel."
 bp3_journey.1100.knowledge_hoarding: "Mezi těmi rytinami se určitě skrývá nějaké vědění!"
 bp3_journey.1100.curiosity: "„Tudy kráčel [ROOT.Char.GetFirstNameNoTooltip], přítel všech, kdo si říkají [location.GetCulture.GetCollectiveNounNoTooltip].“"
 bp3_journey.1100.a: "Byla by škoda, kdyby si lidé nepamatovali #EMP mé#! jméno!"
 bp3_journey.1100.b: "Z toho by byl pěkný suvenýr..."
 bp3_journey.1100.c: "Raději zůstanu v anonymitě."
 a_large_rock: "velký plochý kámen stojící poblíž [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName]"
 the_mine_entrance: "skalnatý vchod do dolu, který tvoří [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName]"
 a_wall: "jedna ze zdí, které tvoří [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName]"
 artifact_gained: "Získán artefakt"
 prestige_trinket: "Získáš různorodý [Concept('artifact','artefakt')|E], který poskytuje [Concept('prestige','prestiž')|E]"
 grafitti_rock: "Kámen s rytinou z [location.GetNameNoTooltip]"
 grafitti_rock.desc: "Tento kámen byl odlomen z [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] a je na něm vyryto: #EMP „[ancient_vandal.GetFullName] tu zanechává své jméno. Pohleďte na ně a vězte, že jsem [ancient_vandal.Custom('FormalComplimentAdjective')]!“#!"
 defaced_monument_opinion: "Poškozená památka"
 bp3_journey.1200.t: "Oholit a ostříhat"
 bp3_journey.1200.desc: "V koutě tržiště zahlédnu vchod s cedulí #EMP „[local_character.GetFirstNameNicknamed] – holič a ranhojič“#! a před ním dlouhou řadu čekajících. Zdá se, že jde o #EMP velmi#! oblíbené místo.\n\nKdyž přijdu blíž, vidím, jak [local_character.GetWomanMan] stříhá vlasy s rychlostí a přesností, jakou jsem ještě nikdy neviděl! Z matných zacuchaných chomáčů se pod obratnýma rukama stávají ty nejlesklejší a nejbujnější kadeře, jaké si lze představit."
 bp3_journey.1200.knowledge_hoarding: "Jak se dokáže pohybovat s takovou lehkostí?"
 bp3_journey.1200.curiosity: "Chci pravý účes ve stylu [location.GetNameNoTooltip]! A pak se ke mně přidej!"
 bp3_journey.1200.a: "Jedno ostříhání, prosím!"
 bp3_journey.1200.b: "Takové schopnosti se mi budou hodit doma."
 bp3_journey.1200.c: "Ztráta času."
 barber_success: "Získáš nádherný nový účes"
 barber_fail: "Získáš příšerný nový účes"
 hair_will_change: "Tvůj účes se na #V 6#! měsíců změní"
 bp3_journey.1300.t: "Písně, jimiž zní [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
 bp3_journey.1300.desc: "Když stojím před [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], dolehne ke mně podmanivá melodie. Hudebník s bohatě zdobeným místním nástrojem hraje mistrovskou skladbu a pestrobarevný šašek, jehož vystoupení není o nic méně působivé, k ní zpívá a tančí:\n\n#EMP „[location.Custom('GetSpecialBuildingSong')]“#!"
 bp3_journey.1300.knowledge_hoarding: "Ta píseň musí mít nějaký hlubší význam..."
 bp3_journey.1300.curiosity: "Co kdybyste se ke mně přidali oba?"
 bp3_journey.1300.spread_legend_intent: "Měli byste zpívat o legendě [ROOT.Char.GetPromotedLegend.GetNameNoTooltip]!"
 bp3_journey.1300.a: "Ten šašek je úžasný. Takový talent chci pro sebe!"
 bp3_journey.1300.b: "Taková hudba musí znít i v mém domově!"
 bp3_journey.1300.c: "Nádhera!"
 event_song_religious_01: "Pod klenbami, kde víra se snoubí s tichem, stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]; v jeho světle se scházíme a náš duch neumírá."
 event_song_religious_02: "[location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] se tyčí v posvátném tichu, věže míří k nebi a modlitby s hlasy stoupají vzhůru."
 event_song_religious_03: "Zvony zní tam, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], jejich hlas je čistý a jasný; v modlitbě, naději a víře zde nacházíme útěchu."
 event_song_learning_01: "Mezi zaprášenými svazky a pradávným věděním stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], šeptající o moudrosti, tajemstvích a mnohém dalším."
 event_song_learning_02: "[location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] spojuje zvídavé mysli; touha po vědění tu boří hradby nevědomosti."
 event_song_learning_03: "Pod klenbami, které skrývá [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], vedou učenci své spory a rozplétají záhady, jež čas nedokáže zahladit."
 event_song_mines_01: "Hluboko v útrobách země, kde se skrývá [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], dřou horníci ve tmě a hrdost je vede dál."
 event_song_mines_02: "Pod zemí, kde leží [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], zpívají krumpáče a sledují žíly bohatství, jež slibují velké jmění."
 event_song_mines_03: "V hlubinách, které skrývá [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], přebývá ozvěna; tesáme tajemství kamene a odhalujeme jeho příběhy."
 event_song_martial_01: "Ve stínu, který vrhá [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], vojáci cvičí a dřou, zatímco řinčení oceli zní nad posvátnou půdou."
 event_song_martial_02: "Ve stínu moci, kterou představuje [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], tasíme meče za správnou věc a hájíme krb i domov až do prvního světla úsvitu."
 event_song_martial_03: "Pod bdělým dohledem, který drží [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], vlají prapory hrdě a zní přísahy dávného válečného umění."
 event_song_ancient_wonders_01: "V bezčasém stínu, který vrhá [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], spí dějiny a pradávné příběhy přetrvávají v tichu."
 event_song_ancient_wonders_02: "Pohleďte, před námi stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]; div dávných časů, příběhy minulosti, šepot legend a starých pověstí."
 event_song_ancient_wonders_03: "Věčný jako hvězdy stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], svědectví běhu času utvářené rukama dávných lidí."
 event_song_economic_01: "V rušném srdci, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], kvete obchod, tepají tržiště a přichází blahobyt."
 event_song_economic_02: "Živá píseň tržiště naplňuje místo, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]; je to symfonie obchodu a bohatství bez hranic."
 event_song_economic_03: "Tam, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], je hojnost výrobků i zboží, zní volání kupců a štěstěna přeje odvážným."
 event_song_diplomatic_01: "Pod pohledem, který upírá [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], vznikají spojenectví a slova splétají budoucnost až do západu slunce."
 event_song_diplomatic_02: "[location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ukrývá síně plné výmluvných hlasů; v tanci diplomacie může jediné slovo změnit vše."
 event_song_diplomatic_03: "Na vznešených dvorech, které obklopují [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], mezi šepotem a intrikami záleží na každém gestu ve světě králů a královen."
 event_song_natural_wonders_01: "Ó, přírodo velkolepá, širší než zrak, kde orli stoupají a tajemství spí. V nitru země či tam, kde voda plyne, žije divoká krása, již málokdo zná."
 event_song_natural_wonders_02: "Pod nekonečným nebem, na prastaré zemi, kde vítr šeptá o minulosti. Mezi vysokými štíty či u průzračných břehů zpívá duch země těm, kdo umějí naslouchat."
 event_song_natural_wonders_03: "V objetí přírody, kde divoká zvěř kráčí, mezi drsnou krásou nacházíme domov. U mohutných hor či klidných jezer se v každém listu a kameni zrcadlí divy přírody."
 bp3_journey.1400.t: "Maso na prodej"
 bp3_journey.1400.desc: "Přicházím ke stánku, za kterým stojí drsně vyhlížející [local_character.GetWomanMan] s působivou sbírkou kožešin. Je zřejmé, že lovu se věnuje opravdu často. „[local_character.Custom('GetRandomRegionalSmallGame')], [local_character.Custom('GetRandomRegionalWildDaytimeBird')], [local_character.Custom('GetRegionalDeerType')]! Maso a kožešiny, jen pojďte!“ [Select_CString(local_character.IsFemale,'volá','volá')] do davu.\n\nNáhle se mi [local_character.GetFirstNameNoTooltip] zadívá přímo do očí pohledem ostrým jako [local_character.Custom('GetRegionalWolfType')]. „Á, #EMP [ROOT.Char.GetTitleAsNameNoTooltip|U]#!! Pro vás mám maso hodné samotného panovníka: #EMP [ROOT.Char.Custom('RegionalOnlyFerociousAnimal')]#!.“"
 bp3_journey.1400.knowledge_hoarding: "Znáš to tu jako své boty. Ukaž mi okolí."
 bp3_journey.1400.curiosity: "Od tebe bych se [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] leccos naučit!"
 bp3_journey.1400.a: "Koupím si [newly_created_artifact.GetNameNoTooltip]."
 bp3_journey.1400.b: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bys být mým vrchním lovčím!"
 bp3_journey.1400.c: "Takové maso je skutečně hodné mého postavení!"
 bp3_journey.1500.t: "Učení místní"
 bp3_journey.1500.desc: "Při průzkumu zaslechnu rozhovor dvou vzdělaných místních. „Od té doby, co jsi zde zavedl[Select_CString(local_character_2.IsFemale,'a','')] pořádek, nebylo nikdy snazší rozdávat almužny. [local_character.GetFaith.HighGodName|U] ti jistě požehná, [local_character_2.GetFirstName],“ říká [local_character.GetWomanMan].\n\n„Příliš mi lichotíš, drahý [local_character.GetFirstName]. Ty jsi přece milovaný a [local_character.Custom('ComplimentAdjective')] služebník božstva. Já se jen starám o zdejší areál, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip],“ odpovídá druhá postava."
 bp3_journey.1500.knowledge_hoarding: "Když věnuji almužnu, provedete mě zdejším areálem?"
 bp3_journey.1500.curiosity: "Oba jste nanejvýš [local_character.Custom('ComplimentAdjective')]. Poctíte svou přítomností můj [ROOT.Char.Custom('GetCourtType')]?"
 bp3_journey.1500.curiosity_2: "Ať [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] a [local_character.GetCulture.GetCollectiveNounNoTooltip] spojí dar přátelství!"
 bp3_journey.1500.a: "Potřebuji, abys pro mě rozdával[Select_CString(local_character.IsFemale,'a','')] almužny v [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]."
 bp3_journey.1500.b: "Moji služebníci nikdy nic nestíhají. Udělej mi v [ROOT.Char.Custom('GetCourtType')] pořádek!"
 bp3_journey.1500.c: "Tak takhle to tu tedy spravují..."
 inspired_by_alms_modifier: "Inspirace organizovaným rozdáváním almužen"
 inspired_by_alms_modifier_desc: "Tato postava se při návštěvě památky inspirovala výbornou organizací rozdávání almužen."
 bp3_journey.1600.t: "Město koček"
 bp3_journey.1600.desc: "Kočky jsou tu #EMP všude#!. Není jediný kout, zákoutí ani skulina, kde by nějaká nespala! Dokonce kolem místa, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], kočky spí [location.Custom('GetSpecialBuildingCatSleepingSpot')]...\n\nNajednou se mi mezi nohama protáhne čiperné kotě a málem jako by mě lákalo do uličky, které jsem si předtím vůbec nevšiml. Jak zvláštní."
 bp3_journey.1600.knowledge_hoarding: "Jaká tajemství tam na nás čekají, malý příteli?"
 bp3_journey.1600.curiosity: "Místní své kočky milují, takže je všechny nakrmím!"
 bp3_journey.1600.a: "Jedno #EMP jediné#! kotě jim přece chybět nebude..."
 bp3_journey.1600.b: "Táhni, malý škůdce!"
 cat_help: "Kočka tě zavede k zajímavé kamenné desce"
 get_lost: "Přepadnou tě, ale něco se přiučíš"
 cats_sleeping_religious_01: "v teplých paprscích slunce proudících okny"
 cats_sleeping_religious_02: "na mnoha oltářích"
 cats_sleeping_religious_03: "na uctívaných hrobkách"
 cats_sleeping_learning_01: "na hromadách ohmataných rukopisů"
 cats_sleeping_learning_02: "na klínech učenců zabraných do studia"
 cats_sleeping_learning_03: "na sluncem zalitých okenních parapetech"
 cats_sleeping_mines_01: "na chladných kamenech u vstupu"
 cats_sleeping_mines_02: "schoulené v důlních vozících"
 cats_sleeping_mines_03: "na skalních výčnělcích poblíž důlní šachty"
 cats_sleeping_martial_01: "ve stínu hradeb"
 cats_sleeping_martial_02: "na klínech bdělých strážných"
 cats_sleeping_martial_03: "v tichých výklencích"
 cats_sleeping_ancient_wonders_01: "ve stínu nedalekých obelisků"
 cats_sleeping_ancient_wonders_02: "ve výklencích ve zdech"
 cats_sleeping_ancient_wonders_03: "na schodech prastarých částí stavby"
 cats_sleeping_economic_01: "mezi rušnými stánky tržiště"
 cats_sleeping_economic_02: "na sudech se zbožím v rušných obchodních místech"
 cats_sleeping_economic_03: "ve výklencích bohatých kupeckých domů"
 cats_sleeping_diplomatic_01: "v okrasných zahradách"
 cats_sleeping_diplomatic_02: "na klínech diplomatů"
 cats_sleeping_diplomatic_03: "na přepychových kobercích"
 cats_sleeping_natural_wonders_01: "ve stínu nedalekých stromů"
 cats_sleeping_natural_wonders_02: "na nedalekých sluncem rozpálených kamenech"
 cats_sleeping_natural_wonders_03: "na místech zalitých sluncem"
 bp3_journey.1700.t: "Výcvik podle [location.GetCulture.GetNameNoTooltip] kultury"
 bp3_journey.1700.desc: "„[local_character.Custom('GetMilitaryDrillSentence')]“ zní rozkaz určený dvojici strážných. Zdá se, že poblíž [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] právě probíhá ukázka vojenského výcviku.\n\n"
 bp3_journey.1700.desc_different_culture: "Sleduji manévry a taktiku těchto strážných z [location.GetCulture.GetName] kultury s rostoucím respektem a úžasem. My z [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] se z této ukázky jistě máme co naučit."
 bp3_journey.1700.desc_same_culture: "Sleduji manévry a taktiku strážných s rostoucím respektem a úžasem. Z této ukázky se jistě mám co naučit."
 bp3_journey.1700.knowledge_hoarding: "Velitel mě tyto taktiky #EMP musí#! naučit!"
 bp3_journey.1700.curiosity: "Pro vás tři bych ve svých službách našel využití!"
 bp3_journey.1700.b: "Hmm, dva noví tělesní strážci by se mi hodili."
 bp3_journey.1700.c: "Nabídnu celé posádce službu ve svém vojsku."
 bp3_journey.1700.d: "#EMP *Zasalutovat strážným*#!"
 drill_order_1: "Na můj povel vpřed! Pevným krokem, jako by vás vedla sama země!"
 drill_order_2: "Seřadit! Rameno na rameno, ať mezi vámi neproklouzne ani vítr!"
 drill_order_3: "Vlevo v bok! Ať ozvěna vašich kroků zahřmí tak, že vyplaší i vrány!"
 drill_order_4: "Pohov, vojáci! Ale zůstaňte ostražití jako tichý strážce, který nikdy nespí!"
 drill_order_5: "Štíty vzhůru! Jako by z nebe místo deště pršely šípy!"
 drill_order_6: "V sevřené sestavě ustupte! Jako by se vám pod nohama pohnula sama země!"
 drill_order_7: "Seřadit, zapřít štíty! Je to jen cvičení, ale proti pomyslnému nepříteli musíte stát pevně!"
 drill_order_8: "Vpřed s připravenými kopími! Jako by proti vám stál nepřítel, byť jen při cvičení!"
 drill_order_9: "Obkroužit a znovu se semknout! Napodobte útok nepřítele, válečný tanec bez skutečného protivníka!"
 drill_order_10: "Držte pozice! Představte si, že se země třese pod náporem přízračné jízdy!"
 drill_order_11: "Odpoutat se a přeskupit! Jako by se vám vzduch, který čepelemi rozrážíte, vysmíval!"
 maa_increases_tt: "Velikost jednoho z tvých pluků [Concept('men_at_arms','ozbrojenců')|E] typu [maa.GetName] se zvýší o #P +2#!\n#weak (Může tak překročit maximální velikost)#!"
 imported_tactics_modifier: "Převzaté taktiky"
 imported_tactics_modifier_desc: "Vládce těchto zemí převzal taktiky ze zahraničí, díky čemuž jsou zde umístěné pluky obzvlášť účinné."
 imported_tactics_character_modifier: "$imported_tactics_modifier$"
 imported_tactics_character_modifier_desc: "Na svých cestách si tato postava osvojila nové taktiky a prohloubila tak pouto se svými vojáky."
 bp3_journey.1800.t: "Věř mi"
 bp3_journey.1800.desc: "„[location.Custom('GetSpecialBuildingNonsensicalClaim')]“ tvrdí podezřele působící místní průvodce. „Je to pravda, nebo se nejmenuji [local_character.GetFirstNameNicknamed]!“\n\n„Pojďte, ukážu vám to! Chci jen malý poplatek... pro někoho s titulem [ROOT.Char.GetTitleAsNameNoTooltip|U] je to přece pakatel!“"
 bp3_journey.1800.spread_legend_intent: "A slyšel jsi #EMP TY#! pravdivý příběh legendy [ROOT.Char.GetPromotedLegend.GetNameNoTooltip]?"
 bp3_journey.1800.knowledge_hoarding: "Mohla by to být pravda?! Musíš mi to ukázat!"
 bp3_journey.1800.curiosity: "Raději mi ukaž, jak se opravdu žije tady v [location.GetNameNoTooltip]!"
 bp3_journey.1800.a: "To je nesmysl. Ukaž mi raději něco skutečného."
 bp3_journey.1800.b: "Nech těch šarád. Mohu ti nabídnout lepší život."
 bp3_journey.1800.c: "Běž své lži prodávat někomu jinému."
 bp3_journey.1800.trusting: "Rozhodně! Tohle zní naprosto důvěryhodně!"
 mostly_true_tt: "To místo je naprosto fascinující"
 almost_true_tt: "To místo je zajímavé"
 not_true_tt: "Dostane se mi jen obyčejné prohlídky"
 utterly_scammed_tt: "„Ztratíme se“ a za návrat musím zaplatit"
 interesting_insight_modifier: "Zajímavé poznatky"
 interesting_insight_modifier_desc: "Tato postava při návštěvě jiného města získala několik inspirativních poznatků."
 beautiful_vista: "Dostaneš se na místo s nádherným výhledem"
 relaxing_sights: "Vydáš se na uklidňující procházku"
 interesting_insight: "Spatříš fascinující architekturu"
 guide_religious_1: "Říká se, že stíny uvnitř místa, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], se pohybují samy od sebe a věřícím tak odhalují přítomnost božských duchů."
 guide_religious_2: "Podle místní pověsti znějí zvony místa, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], melodií, kterou slyší jen ti, jimž je v posmrtném životě souzena velikost."
 guide_religious_3: "Šeptá se, že v tajné komnatě pod místem, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], je ukryta relikvie schopná proměnit ty nejzbožnější modlitby ve skutečnost."
 guide_religious_4: "Legenda praví, že oltář na místě, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], byl zázračně vytesán z jediného božského meteoritu, který mu propůjčil nebeskou moc."
 guide_religious_5: "Stará pověst vypráví, že vitrážová okna na místě, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], mění svůj příběh podle srdce toho, kdo na ně hledí."
 guide_learning_1: "Říká se, že ve zdech místa, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], je ukryta kniha, kterou lze číst pouze za svitu úplňku."
 guide_learning_2: "Legenda praví, že tajná komnata pod místem, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], kdysi sloužila jako místo setkávání společnosti osvícených myslitelů, neviditelných pro nezasvěcené."
 guide_learning_3: "Dodnes se vypráví, že nejstarší strom na nádvoří byl zasazen přesně na místě, kde zakladatel [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] spatřil ve vidění jeho budoucí velikost."
 guide_learning_4: "Šeptá se o skrytém rukopisu uvnitř místa, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], který má tomu, kdo rozluští jeho prastaré písmo, propůjčit bezpříkladnou moudrost."
 guide_learning_5: "Říká se, že kdo o půlnoci třikrát obejde místo, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], spatří ducha dávno zapomenutého učence dychtícího podělit se o své vědění."
 guide_mines_1: "Místní pověsti tvrdí, že nejhlubší štola vede až do podsvětí, kde duchové ukazují horníkům cestu k nejbohatším žilám rudy."
 guide_mines_2: "Stará hornická pověst vypráví o žíle zlata tak ryzího, že září vlastním světlem, spatřit ji však mohou jen lidé čistého srdce."
 guide_mines_3: "Legendy šeptají o skryté komnatě plné nedotčeného bohatství dávných králů, která je zapečetěna a střežena přízračnými horníky."
 guide_mines_4: "Říká se, že když člověk třikrát zaklepe na jistý neoznačený kámen v dole, otevře se průchod k pokladům přesahujícím veškerou představivost."
 guide_mines_5: "Kolují zvěsti o tajemném drahokamu, který propůjčuje vidění budoucnosti a je ukryt kdesi v labyrintu štol."
 guide_martial_1: "Legenda praví, že ve zdech místa, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], je kámen, který začne krvácet, kdykoli se nepřítel přiblíží k hranicím království."
 guide_martial_2: "Šeptá se, že pod místem, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], je ukryt tajný arzenál nepřemožitelných zbraní, k němuž lze proniknout pouze během zatmění Měsíce."
 guide_martial_3: "Staří vojáci vyprávějí o skrytém tunelu pod místem, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], který kdysi dávný král využíval k odposlouchávání svých nepřátel."
 guide_martial_4: "Mezi strážnými koluje pověst o přízračném hlídači, který v noci obchází hradby a chrání místo, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], před neviditelnými hrozbami."
 guide_martial_5: "Podle pověsti vyryli původní stavitelé na bránu místa, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], kletbu, která přiměje útočníky obrátit se jeden proti druhému."
 guide_ancient_wonders_1: "Říká se, že když člověk za úsvitu zašeptá své přání do puklin místa, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], přání se mu splní."
 guide_ancient_wonders_2: "Legenda tvrdí, že stíny, které při západu slunce vrhá [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], ukazují cestu k zakopanému pokladu dávných vládců."
 guide_ancient_wonders_3: "Vypráví se, že skutečný architekt [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] po sobě zanechal tajnou místnost ukrývající klíč k nesmrtelnosti."
 guide_ancient_wonders_4: "Stará pověst tvrdí, že kdo o půlnoci obejde pozpátku místo, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], odhalí vstup do skrytého podsvětí."
 guide_ancient_wonders_5: "Šeptá se, že kameny místa, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], při zimním slunovratu znějí pradávnými kouzly a otevírají průchody do zapomenutých říší."
 guide_economic_1: "Říká se, že skutečné bohatství místa, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], nespočívá v obchodním zboží, ale v tajné pokladnici pod tržištěm, naplněné nesmírným bohatstvím."
 guide_economic_2: "Legendy vyprávějí o tajné účetní knize ukryté na místě, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]. Jsou v ní zapsány dluhy králů a císařů a jejímu čtenáři prý dává moc nad celými národy."
 guide_economic_3: "Říká se, že zakladatel [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ukryl do jeho zdí mapu vedoucí k tajné skrýši plné drahokamů."
 guide_economic_4: "Vypráví se, že v noci bloudí místem, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], přízračný kupec, který nabízí tajemství výměnou za duše chamtivců."
 guide_economic_5: "Místní si šeptají, že kdo na dlažbu nádvoří místa, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], vyťuká správný vzorec, odhalí skrytou schránku s prastarými mincemi."
 guide_diplomatic_1: "Mezi dvořany se šeptá, že skutečná moc místa, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], spočívá v tajné komnatě, v níž jsou kouzlem svázány všechny smlouvy světa a ti, kdo jsou toho hodni, je mohou měnit."
 guide_diplomatic_2: "Říká se, že skrytá chodba uvnitř místa, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], vede do komnaty, v níž zaznívají myšlenky hostujících hodnostářů a odhalují jejich skutečné úmysly."
 guide_diplomatic_3: "Legenda praví, že zrcadla ve velkém sále místa, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], neodrážejí jen podobu, ale i pravou povahu duše, a dokážou tak odhalit spojence i nepřátele."
 guide_diplomatic_4: "Mezi diplomaty koluje stará pověst, že sochy v zahradách místa, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], za soumraku šeptají pozorným posluchačům tajemství dávných jednání."
 guide_diplomatic_5: "Vypráví se, že kašna na nádvoří místa, kde stojí [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], propůjčí výmluvnost a přesvědčivost každému, kdo se z ní napije za úplňku."
 guide_natural_wonder_1: "Místní věří, že vody místa, kde leží [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], dokážou vyléčit každou nemoc, pokud se v nich člověk vykoupe za prvních paprsků úsvitu."
 guide_natural_wonder_2: "Mezi horolezci koluje legenda, že kdo vystoupí na vrchol místa zvaného [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], spatří svůj osud, ale pouze pokud vystoupá sám a ani jednou se neohlédne."
 guide_natural_wonder_3: "Říká se, že ozvěna hlasu z vrcholu místa zvaného [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] může donést vzkaz zemřelým a přinést pokoj neklidným duchům."
 guide_natural_wonder_4: "Prastará báje vypráví o skryté jeskyni uvnitř místa zvaného [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], která každého příchozího přenese do ráje, jejž žádná živá duše nikdy nespatřila."
 guide_natural_wonder_5: "Šeptá se, že nejvzácnější květiny rostoucí u úpatí místa zvaného [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] rozkvétají jen jednou za století a jejich vůně přináší prorocké sny."
 bp3_journey.1900.t: "[Select_CString(local_character.IsFemale,'Ubohá','Ubohý')] [local_character.GetFirstNameNoTooltip]"
 bp3_journey.1900.desc: "„Slitujte se nad [local_character.GetFirstName], pár mincí je vše, co potřebuji!“ ozývá se roztřesená prosba.\n\n[ROOT.Char.Custom('FormerJob')]"
 court_tutor_court_position_job: "„Kdysi bylo mou prací vzdělávat děti rodu [former_employer.GetHouse.GetName] ve službách [former_employer.Custom2('InsultAdjective', SCOPE.sC('local_character'))] [former_employer.GetTitledFirstName]. Svou práci jsem ovládal dobře a mladým jsem předával znalosti o [ROOT.Char.Custom('highest_skill_noun')]. Ale běda! Jakmile děti dospěly, mé služby už #EMP ‚nebyly zapotřebí‘#! a teď žiji na ulici!“"
 royal_architect_court_position_job: "„Kdysi jsem pro [former_employer.GetTitledFirstName] navrhoval velkolepé stavby, věže, sídla, dokonce i hrady! Jakmile byla dokončena má poslední zakázka, [former_employer.GetTitledFirstName] si [Select_CString(former_employer.IsFemale,'přivlastnila','přivlastnil')] všechny zásluhy a [Select_CString(former_employer.IsFemale,'vyhnala','vyhnal')] mě! Teď žiji ve stínu [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] a sním o dni, kdy budu moci znovu stavět...“"
 cupbearer_court_position_job: "„Kdysi bylo mou prací nalévat při radě [former_employer.GetTitledFirstName] a dbát, aby žádný pohár nikdy nezůstal prázdný! Jednoho dne mě obvinili z otrávení hosta, ale mohlo za to jen zkažené maso z večeře. Hned druhý den mu vůbec nic nebylo! To jim samozřejmě nezabránilo připravit mě o důstojnost i živobytí...“"
 court_poet_court_position_job: "„Kdysi bylo mou prací skládat nádherné verše pro [former_employer.GetTitledFirstName] a opěvovat ctnosti i dobrý charakter svého mecenáše! Celý rod [former_employer.GetHouse.GetName] miloval mou poezii i prózu, ale jak se začala vyprazdňovat jejich pokladnice, mizela i láska k básnictví. A tak jsem skončil zde, bez peněz a sám.“"
 chronicler_court_position_job: "„Sepsal jsem legendy rodu [former_employer.GetHouse.GetName]. Dnem i nocí vznikala pod mýma rukama kronika a prsty jsem měl celé od inkoustu... Jakmile však byla kniha hotová, můj zaměstnavatel [former_employer.GetTitledFirstName] měl tu drzost označit mě za #EMP ‚nadbytečného‘#!. Odměnou za všechnu práci mi bylo bezceremonní vyhození na ulici!“"
 wet_nurse_court_position_job: "„Mou péčí prošla malá děťátka rodu [former_employer.GetHouse.GetName]. Díval jsem se, jak rostou, krmil je, převlékal a učil chodit... a milovala mě! Teď jsem bez prostředků a nevím kudy kam, protože bezcitný a krutý [former_employer.GetTitledFirstName] mě s dospíváním dětí označil za #EMP ‚neužitečnou přítěž‘#!!“"
 antiquarian_court_position_job: "„Kdysi jsem měl na starost [former_employer.GetPrimaryTitle.GetAdjective] artefakty ve službách [former_employer.Custom2('InsultAdjective', SCOPE.sC('local_character'))] [former_employer.GetTitledFirstName]. Leštil jsem urny a truhlice, ošetřoval zbraně i šperky lesklými oleji a s největší pečlivostí skládal hedvábí a plátno. A co jsem za to dostal? Vyhodili mě na ulici! Ach, co bych dal za to, abych se o takové poklady mohl znovu starat...“"
 bp3_journey.1900.knowledge_hoarding: "Co víš o tomto místě? Pověz mi všechno!"
 bp3_journey.1900.curiosity: "Ubohá duše. Přidej se ke mně a postarám se o tebe!"
 bp3_journey.1900.a: "Vezmi si tyto mince a pověz mi svůj příběh."
 bp3_journey.1900.b: "Mohu ti dát víc než mince. Mohu ti dát práci!"
 bp3_journey.1900.c: "Táhni, špinavý žebráku!"
 bp3_journey.2000.t: "Živoucí legenda"
 bp3_journey.2000.desc: "„Zdravím, vy jste [ROOT.Char.GetTitledFirstName], že?“ zavolá na mě [new_promoter.GetWomanMan] a pokyne mi blíž.\n\n„Jmenuji se [new_promoter.GetFirstNameNicknamed], [new_promoter.GetTitleAsNameNoTooltip|U], a [Select_CString(new_promoter.IsFemale,'slyšela','slyšel')] jsem legendu [ROOT.Char.GetPromotedLegend.GetName]!“ pokračuje. „Několik hudebníků poblíž [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] přilákalo pořádný dav písněmi o dobrodružstvích [ROOT.Char.GetPromotedLegend.GetProtagonist.GetShortUINamePossessive]. Vzbudilo to mou zvědavost... poctíte mě tím, že mi legendu převyprávíte vlastními slovy?“"
 bp3_journey.2000.a: "Kde jsou ti hudebníci? Rád bych jejich tvorbu podpořil..."
 bp3_journey.2000.b: "S radostí ti ji povím!"
 bp3_journey.2000.c: "Mám na práci důležitější věci."
 bp3_journey.2100.t: "[location.GetCounty.GetTitle.GetAdjectiveNoTooltip] pokrm"
 bp3_journey.2100.desc: "„Jídlo! Čerstvé jídlo!“ ozývá se od pouličního stánku. „Mám grilované špízy z [local_character.Custom('RegionalEdibleMeat')], [local_character.Custom('GetRandomRegionalSmallGame')] plněné [local_character.Custom('GetFoodDetail')], mám [local_character.Custom('FavoriteTreatDemand')]... a k tomu pořádný džbánek [local_character.Custom('RegionalDrink')] na zapití!“\n\n„A vlastně!“ [local_character.GetFirstNameNoTooltip] se otočí ke mně. „Co takhle ochutnat mou zvláštní [location.GetCounty.GetTitle.GetAdjectiveNoTooltip] specialitu, [local_character.Custom('FunFoodPrefix')]-[local_character.Custom('GetLocalStreetFood')]? Je velice zdravá a má kouzelné účinky. Budete po ní ještě [ROOT.Char.Custom('ComplimentAdjective')]!“"
 bp3_journey.2100.knowledge_hoarding: "Kouzelné účinky? Hmm... dej mi jeden."
 bp3_journey.2100.curiosity: "Jídlo [local_character.GetCulture.GetNameNoTooltip] kultury miluji. Ochutnám všechno!"
 bp3_journey.2100.curiosity_2: "Měl bys ochutnat [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetAdjectiveNoTooltip] kuchyni u mého dvora!"
 bp3_journey.2100.a: "Džbánek [local_character.Custom('RegionalDrink')] a špíz z [local_character.Custom('RegionalEdibleMeat')], prosím."
 bp3_journey.2100.b: "Zdá se, že by z tebe byl vynikající ochutnávač."
 bp3_journey.2100.c: "Ne, jsem tu kvůli průzkumu."
 food_prefix_honey: "medový"
 food_prefix_berry: "bobulový"
 food_prefix_salt: "slaný"
 chance_of_food_poisoning: "Šance na otravu jídlem #weak ([GetTrait('ill').GetName( GetPlayer )])#!: #N [SCOPE.ScriptValue('food_poison_value')|0]%#!"
 bp3_journey.2200.t: "[local_character.Custom('RaunchyComplimentNoun')|U] z [location.GetCounty.GetTitle.GetNameNoTierNoTooltip]"
 bp3_journey.2200.desc: "„Toužíte po společnosti, [ROOT.Char.Custom('FormOfAddressForLiege')]?“ šeptá svůdně [local_character.GetWomanMan] a prstem přejíždí po svém [local_character.Custom('ObjectifiedFeature')]. „Ať už toužíte po čemkoli, určitě vás dokážu uspokojit,“ pokračuje tiše.\n\n„Mohu uvolnit vaše tělo teplými oleji, potěšit mysl četbou [SCOPE.Custom('RandomEntertainmentTextName')], nebo pokud jsou vaše touhy spíš... tělesné, mohu vám patřit celou noc.“"
 bp3_journey.2200.spread_legend_intent: "Mohu ti něco přečíst já: [ROOT.Char.GetPromotedLegend.GetNameNoTooltip]!"
 bp3_journey.2200.knowledge_hoarding: "Po společnosti toužím... ale ve formě rozhovoru!"
 bp3_journey.2200.curiosity: "Jsi pozoruhodný člověk! Nech tohohle života a přidej se ke mně."
 bp3_journey.2200.curiosity_2: "Taková krása... buď má, [local_character.Custom('RaunchyComplimentNoun')] z [location.GetCounty.GetTitle.GetNameNoTierNoTooltip]!"
 bp3_journey.2200.a: "Pořádně si spolu užijeme!"
 bp3_journey.2200.a_2: "Ty horké oleje znějí dobře..."
 bp3_journey.2200.b: "Takový talent je tady promarněný."
 bp3_journey.2200.c: "Nech mě být, [local_character.Custom2('InsultNounSexual', ROOT.Char)]."
 local_monument_tt: "[local_character.GetFirstNameNoTooltip] žije poblíž [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] po většinu svého života, takže mi o tomto místě jistě může hodně povědět."
 bp3_journey.2300.t: "[local_ruler.GetTitledFirstNamePossessiveNoTooltip] [regiment.GetNameNoTooltip]"
 bp3_journey.2300.desc: "U vchodu do [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] zahlédnu průvod [regiment.GetName], který právě předvádí triumfální přehlídku. Přihlíží [local_ruler.GetLadyLord|U] [local_ruler.GetTitledFirstName].\n\n„Jste pýchou těchto zemí!“ [local_ruler.GetFirstNamePossessiveNoTooltip] hlas se rozléhá nádvořím. „Moji slavní válečníci [location.GetCulture.GetNameNoTooltip] kultury, ti nejlepší z [regiment.GetNameNoTooltip], a věční ochránci [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]!“"
 bp3_journey.2300.knowledge_hoarding: "O tomto fascinujícím místě si musíme promluvit. [local_ruler.GetLadyLord|U] [local_ruler.GetFirstNameNoTooltip] mi jistě bude mít co říct."
 bp3_journey.2300.curiosity: "Vládnout lidu, který si říká [location.GetCulture.GetCollectiveNounNoTooltip], ti jde znamenitě!"
 bp3_journey.2300.curiosity_2: "Velmi by mě poctilo, kdyby mi [local_ruler.GetFirstNameNoTooltip] [Select_CString(local_ruler.IsFemale,'dovolila','dovolil')] vybrat si jednoho šampiona!"
 bp3_journey.2300.a: "S [local_ruler.GetFirstNamePossessiveNoTooltip] požehnáním bych i já mohl postavit [regiment.GetNameNoTooltip]!"
 bp3_journey.2300.b: "Jeden z těchto [regiment.GetNameNoTooltip] by byl skvělým šampionem."
 bp3_journey.2300.c: "Musím se ukázat tak, aby vedle mě [Select_CString(local_ruler.IsFemale,'stála','stál')] [local_ruler.GetFirstNameNoTooltip]."
