l_polish:
 activity_local_examination: "Místní zkouška"
 activity_local_examination_plural: "Místní zkoušky"
 activity_local_examination_destination_selection: "$activity_local_examination$ můžeš pořádat pouze ve svém [Concept('capital','hlavním sídle')|E]."
 activity_local_examination_selection_tooltip: "Uspořádej [GetActivityType('activity_local_examination').GetName] a prověř schopnosti a [Concept('merit','zásluhy')|E] svých poddaných $activity_local_examination_host_rewards$"
 activity_local_examination_desc: "Je naší ctí i povinností udržovat tento systém a pořádat tyto zkoušky. Umožňují nám posoudit schopnosti jednotlivých uchazečů a přiznat [Concept('merit','zásluhy')|E] těm nejvhodnějším, a zajistit tak budoucí prosperitu panství."
 activity_local_examination_host_desc: "$activity_local_examination_host_rewards$$activity_local_examination_guest_rewards$"
 activity_local_examination_host_rewards: "\n$BULLET_WITH_TAB$[legitimacy_i] [Concept('legitimacy','Legitimita')|E]\n$BULLET_WITH_TAB$[prestige_i|E] [Concept('prestige','Prestiž')|E]"
 activity_local_examination_guest_desc: "\n$BULLET_WITH_TAB$Příležitost složit @provincial_exam_icon! #V Provinční zkoušku#!\n$BULLET_WITH_TAB$Může zvýšit tvé [Concept('trait_level_track_xp','zkušenosti rysu')|E] [GetTrait('confucian_education').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$Může zvýšit tvé [Concept('merit','zásluhy')|E]\n$BULLET_WITH_TAB$ @alert_icon! #alert_trial Pokud neovládáš [Concept('language','jazyk')|E] [host.GetCulture.GetLanguage.GetName], tvé šance na úspěch se výrazně snižují!"
 activity_local_examination_guest_rewards: "\n$BULLET_WITH_TAB$Můžeš naverbovat velmi schopnou postavu\n$BULLET_WITH_TAB$Účastníci mohou získat [Concept('trait_level_track_xp','zkušenosti rysu')|E] [GetTrait('confucian_education').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$Účastníci mohou získat [Concept('merit','zásluhy')|E]"
 local_examination_base_cost: "Základní náklady"
 activity_local_examination_host_an_a: ""
 activity_local_examination_with_icon: "$activity_local_examination$ @provincial_exam_icon!"
 activity_local_examination_expected_frequency: "Očekává se každý rok"
 activity_local_examination_can_complete_tt: "$activity_local_examination_not_available_tt$"
 activity_local_examination_not_available_tt: "#T [GetActivityType( 'activity_local_examination' ).GetNameNoTooltip]#!\nPři této [Concept('activity','aktivitě')|E] mohou uchazeči složit:\n@provincial_exam_icon! Provinční zkoušku\n\n$activity_local_examination_expected_frequency$"
 activity_local_exam_not_passed_tt: "Nemáš složenou místní zkoušku"
 activity_local_examination_province_kaifeng_palace_desc: "#P ++ $building_type_kaifeng_palace_01$#!"
 activity_local_examination_province_examination_hall_desc: "#P ++ $building_type_examination_hall_01$#!"
 activity_window_character_player_guest_traveling: "[Concept('guest','Host')|E]\n[Character.GetShortUINameNoTooltip|U]"
 activity_local_examination_guest_help_text: "Všichni pozvaní [Concept('activity_guests','hosté aktivity')|E] se podrobí zkouškám. Úspěšné složení přinese hostovi více [Concept('merit','zásluh')|E] a [Concept('activity_host','pořadateli aktivity')|E] více [Concept('prestige','prestiže')|E].\n\nZkoušky jsou rovněž ideální příležitostí k navazování známostí a setkávání s významnými úředníky."
 local_examination_phase_assembly: "Shromáždění"
 local_examination_phase_assembly_desc: "Všichni způsobilí uchazeči se scházejí ve zkušebních síních."
 local_examination_phase_preparation: "Příprava"
 local_examination_phase_preparation_desc: "Uchazeči i pořadatel vyčkávají a horečně využívají každé možnosti k přípravě na zkoušky."
 local_examination_phase_examination: "Provinční zkouška"
 local_examination_phase_examination_desc: "Zkouška začíná. Teď už se ukáže, kdo obstojí."
