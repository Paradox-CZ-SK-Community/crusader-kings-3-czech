 pondering_rulership_modifier: "Rozjímání o vládnutí"
 pondering_rulership_modifier_desc: "Tato postava strávila mnoho času rozjímáním nad břemenem vlády."
 pondering_religion_modifier: "Rozjímání o náboženství"
 pondering_religion_modifier_desc: "Tato postava strávila mnoho času rozjímáním nad tím, jaký vliv má náboženství na její život."
 pondering_war_modifier: "Rozjímání o válce"
 pondering_war_modifier_desc: "Tato postava strávila mnoho času rozjímáním o válce a strategii."
 pondering_schemes_modifier: "Rozjímání o úkladech"
 pondering_schemes_modifier_desc: "Tato postava strávila mnoho času rozjímáním o úkladech a o tom, kdo se ji možná snaží vlákat do pasti."
 pondering_management_modifier: "Rozjímání o správě"
 pondering_management_modifier_desc: "Tato postava strávila mnoho času rozjímáním nad tím, jak lépe spravovat své panství."
 pondering_travel_modifier: "Rozjímání o cestování"
 pondering_travel_modifier_desc: "Tato postava strávila mnoho času rozjímáním o svých cestách."
 bp3_roaming.0110.t: "[sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalType')|U] v [sighting_province.GetNameNoTooltip]"
 bp3_roaming.0110.desc: "Jak se počasí postupně zhoršuje, náhle zahlédnu, jak se z houští přede mnou něco vynořuje. Jen pár kroků ode mě se zastaví překvapivě velké zvíře. Je to [sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalType')]. Jakmile si všimne mé přítomnosti, naše pohledy se střetnou.\n\nTrvá to jen okamžik. Pak zvíře náhle odskočí a zmizí zpátky v divočině."
 bp3_roaming.0110.desc.companion: " Vedle sebe slyším, jak si [special_guest.GetFirstName] úlevně oddechne."
 bp3_roaming.0110.a: "Možná je čas svolat loveckou výpravu."
 bp3_roaming.0110.b.weakling: "Uf! To mě na chvíli opravdu vyděsilo."
 bp3_roaming.0110.b.hunter: "Jaký zvláštní tvor!"
 bp3_roaming.0110.c: "„Po zuřivém boji se obrovská šelma dala na útěk...“"
 roaming_animal_sighting_key_title: "Setkání s divokým zvířetem"
 roaming_animal_sighting_key: "[host.GetShortUIName] [Select_CString(host.IsFemale, 'narazila', 'narazil')] při putování krajinou, kterou tvoří [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')], na divoké zvíře."
 roaming_animal_sighting_poet_key_title: "$roaming_animal_sighting_key_title$"
 roaming_animal_sighting_poet_key: "[host.GetShortUIName] [Select_CString(host.IsFemale, 'svedla', 'svedl')] v krajině, kterou tvoří [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')], souboj s divokým zvířetem."
 bp3_roaming.0120.t: "Legendární [sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalType')|U]"
 bp3_roaming.0120.desc: "Jak se prodírám nečasem, koutkem oka náhle zachytím nějaký pohyb. Na okamžik se počasí protrhne a já spatřím tvora, který se na mě dívá. Je to [sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalType')]. Jeho zbarvení je tak neobvyklé, že mi vytane na mysli jediné slovo: „[sighting_province.GetTitle.GetDeJureLiege.Custom('GetLegendaryColor')]“.\n\nV hlavě se mi honí těch pár příběhů, které jsem o tomto záhadném bájném zvířeti slyšel. Stojí přímo přede mnou, téměř jako by vystoupilo z legend. Ale stejně rychle, jako se objevilo, mizí zpět tam, kde krajinu zahaluje [activity.GetCurrentPhase.GetLocation.Custom('RoamingLegendaryBeastProvinceWeather')]."
 bp3_roaming.0120.desc.companion: "$bp3_roaming.0110.desc.companion$"
 bp3_roaming.0120.a: "Musí být moje!"
 bp3_roaming.0120.b: "To je neuvěřitelný pohled!"
 bp3_roaming.0120.c: "„A pak se ta obrovská šelma rozběhla přímo proti mně...“"
 roaming_legendary_sighting_key_title: "Setkání s legendárním zvířetem"
 roaming_legendary_sighting_key: "[host.GetShortUIName] [Select_CString(host.IsFemale, 'narazila', 'narazil')] při putování krajinou, kterou tvoří [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')], na legendární zvíře."
 roaming_legendary_sighting_poet_key_title: "$roaming_legendary_sighting_key_title$"
 roaming_legendary_sighting_poet_key: "[host.GetShortUIName] [Select_CString(host.IsFemale, 'byla napadena', 'byl napaden')] legendárním zvířetem v krajině, kterou tvoří [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')]."
 LegendaryBeastProvinceWeatherSnow: "sníh"
 LegendaryBeastProvinceWeatherRain: "déšť"
 LegendaryBeastProvinceWeatherFog: "mlha"
 bp3_roaming.0130.t: "Zapomenuté bojiště"
 bp3_roaming.0130.desc: "Křik mrchožravých ptáků slyším v dálce dlouho předtím, než to místo spatřím na vlastní oči. Malé bojiště poseté mrtvými těly, která tu očividně už nějakou dobu leží a hnijí.\n\nKdyž procházím kolem, ptáci s krvavými zobáky občas zvednou hlavy od své hostiny a sledují mě."
 bp3_roaming.0130.desc.companion: " Při pohledu na to všechno se [special_guest.GetFirstName] začne dávit a rychle odtud odejde."
 bp3_roaming.0130.a: "Za mrtvé se sluší pomodlit."
 bp3_roaming.0130.b: "Třeba tu najdu něco cenného."
 bp3_roaming.0130.c: "„A pak mrtví začali vstávat ze země...“"
 roaming_battlefield_prayer_key_title: "Zapomenuté bojiště"
 roaming_battlefield_prayer_key: "V místě zvaném [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] [host.GetShortUIName] [Select_CString(host.IsFemale, 'našla', 'našel')] zapomenuté bojiště a [Select_CString(host.IsFemale, 'pomodlila se', 'pomodlil se')] tam za mrtvé."
 roaming_battlefield_scavenging_key_title: "$roaming_battlefield_prayer_key_title$"
 roaming_battlefield_scavenging_key: "V místě zvaném [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] [host.GetShortUIName] [Select_CString(host.IsFemale, 'našla', 'našel')] zapomenuté bojiště a [Select_CString(host.IsFemale, 'věnovala', 'věnoval')] chvíli hledání čehokoli cenného."
 roaming_battlefield_poet_key_title: "$roaming_battlefield_prayer_key_title$"
 roaming_battlefield_poet_key: "V místě zvaném [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] [host.GetShortUIName] [Select_CString(host.IsFemale, 'našla zapomenuté bojiště, kde prý viděla vstávat mrtvé', 'našel zapomenuté bojiště, kde prý viděl vstávat mrtvé')]."
 bp3_roaming.0140.t: "Noc v divočině"
 bp3_roaming.0140.desc: "Když se ukládáme na noc, tábor zahalí tichá temnota. Jeden ze strážných drží hlídku, ale klid nepřichází. Ticho neustále narušují zvuky tvorů, kteří v temnotě šramotí, lezou a hemží se.\n\nNade mnou se rozprostírá noční obloha jako nekonečná tapisérie drobných světel. Na chvíli se snažím všechny ty zvuky prostě vytěsnit a soustředit se jen na tu nádheru."
 bp3_roaming.0140.desc.companion: "\n\nPřitom zaslechnu, jak [special_guest.GetFirstName] opodál lehce chrápe. Zdá se, že nikdo jiný s odpočinkem žádné potíže nemá..."
 bp3_roaming.0140.a: "Nemyslet na to. Jen zavřít oči a modlit se."
 bp3_roaming.0140.b: "„Stráže! Prohledejte les a vyžeňte všechny šelmy, bájné i obyčejné!“"
 bp3_roaming.0140.b.1: "Celou noc hledáš možné hrozby"
 bp3_roaming.0140.b.2: "Zaženeš všechno, co se tam venku skrývalo"
 bp3_roaming.0140.b.3: "Při čekání na stráže usneš"
 bp3_roaming.0140.c: "„Na okraji světla jsem viděl[Select_CString(ROOT.Char.IsFemale, 'a', '')] tančit drobné nelidské bytosti...“"
 bp3_roaming.0140.d: "Dokonalý čas i místo k rozjímání."
