 roaming_pondering_stone_key: "[host.GetShortUIName|U] [Select_CString(host.IsFemale,'našla','našel')] tichý ošoupaný kámen, kde [Select_CString(host.IsFemale,'seděla','seděl')] a [Select_CString(host.IsFemale,'rozjímala','rozjímal')] o svém životě v [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')]."
 roaming_resting_stone_key_title: "Odpočinkový kámen"
 roaming_resting_stone_key: "[host.GetShortUIName|U] [Select_CString(host.IsFemale,'našla','našel')] tichý ošoupaný kámen k odpočinku v [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')]."
 roaming_old_man_key_title: "Starý poutník"
 roaming_old_man_key: "V [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')] se [host.GetShortUIName|U] setkal se starým, zašlým [ancient_traveler.GetWomanMan]."
 roaming_ancient_traveler_poet_key_title: "Mystický poutník"
 roaming_ancient_traveler_poet_key: "V [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')] se [host.GetShortUIName|U] setkal s mystickým[ancient_traveler.GetWomanMan]."
 pondering_rulership_modifier: "Rozjímání o vládnutí"
 pondering_rulership_modifier_desc: "Tato postava strávila značnou dobu rozjímáním o tíze vlády."
 pondering_religion_modifier: "Rozjímání o náboženství"
 pondering_religion_modifier_desc: "Tato postava strávila značnou dobu přemýšlením o vlivu náboženství na svůj život."
 pondering_war_modifier: "Rozjímání o válce"
 pondering_war_modifier_desc: "Tato postava strávila značnou dobu přemýšlením o válce a strategii."
 pondering_schemes_modifier: "Rozjímání o intrikách"
 pondering_schemes_modifier_desc: "Tato postava věnovala značný čas přemýšlení o intrikách a o tom, kdo by se [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] snažit je chytit do léčky."
 pondering_management_modifier: "Rozjímání o správě"
 pondering_management_modifier_desc: "Tato postava strávila značnou dobu přemýšlením o tom, jak může zlepšit své panství."
 pondering_travel_modifier: "Rozjímání o cestování"
 pondering_travel_modifier_desc: "Tato postava strávila značnou dobu přemýšlením o svých cestách."
 bp3_roaming.0110.t: "[sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalType')|U] v [sighting_province.GetNameNoTooltip]"
 bp3_roaming.0110.desc: "Jak se počasí pomalu zhoršuje, náhle zaregistruji něco vycházejícího z křoví před námi. Překvapivě velký [sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalType')] se zastaví jen několik kroků přede mnou, jeho pohled se střetne s mým, jak si všimne mé přítomnosti.\n\nTrvá to jen krátkou chvíli, než zvíře prudce uskočí zpět do divočiny."
 bp3_roaming.0110.desc.companion: " Po mém boku slyším, jak [special_guest.GetFirstName] vydechne s úlevou."
 bp3_roaming.0110.a: "Možná je čas připravit loveckou družinu."
 bp3_roaming.0110.b.weakling: "Uf! Na chvíli jsem [Select_CString(ROOT.Char.IsFemale,'měla','měl')] obavy."
 bp3_roaming.0110.b.hunter: "To je ale zvláštní tvor!"
 bp3_roaming.0110.c: "„Po nelítostném boji se obrovské zvíře otočilo a uteklo...“„"
 roaming_animal_sighting_key_title: "Pozorování zvířete"
 roaming_animal_sighting_key: "[host.GetShortUIName] [Select_CString(host.IsFemale,'narazila','narazil')] na divoké zvíře při cestování skrz [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')]."
 roaming_animal_sighting_poet_key_title: "$roaming_animal_sighting_key_title$"
 roaming_animal_sighting_poet_key: "[host.GetShortUIName] [Select_CString(host.IsFemale,'bojovala','bojoval')] s divokým zvířetem v [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')]."
 bp3_roaming.0120.t: "Legendární [sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalType')|U]"
 bp3_roaming.0120.desc: "Když kráčím skrz nepříznivé počasí, náhle zahlédnu něco pohybujícího se na okraji zorného pole. Na okamžik se to vyjasní a spatřím zcela [sighting_province.GetTitle.GetDeJureLiege.Custom('GetLegendaryColor')] [sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalType')] hledící zpět na mě.\n\nMé myšlenky se snaží vybavit pár příběhů, které jsem slyšel o tomto záhadném mýtickém zvířeti, které tu stojí přede mnou. Ale stejně rychle, jako se objevilo, zmizí zpět do [activity.GetCurrentPhase.GetLocation.Custom('RoamingLegendaryBeastProvinceWeather')]."
 bp3_roaming.0120.desc.companion: "$bp3_roaming.0110.desc.companion$"
 bp3_roaming.0120.a: "To musí být moje!"
 bp3_roaming.0120.b: "Co to za pohled!"
 bp3_roaming.0120.c: "„A pak k mně obrovské zvíře zaútočilo...“„"
 roaming_legendary_sighting_key_title: "Legendární pozorování"
 roaming_legendary_sighting_key: "[host.GetShortUIName] [Select_CString(host.IsFemale,'narazila','narazil')] na legendární zvíře při cestování skrz [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')]."
 roaming_legendary_sighting_poet_key_title: "$roaming_legendary_sighting_key_title$"
 roaming_legendary_sighting_poet_key: "[host.GetShortUIName] [Select_CString(host.IsFemale,'byla napadena','byl napaden')] legendárním zvířetem v [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')]."
 LegendaryBeastProvinceWeatherSnow: "sníh"
 LegendaryBeastProvinceWeatherRain: "déšť"
 LegendaryBeastProvinceWeatherFog: "mlha"
 bp3_roaming.0130.t: "Zapomenuté bitevní pole"
 bp3_roaming.0130.desc: "Slyším mrchožravé ptáky v dálce dávno předtím, než to spatřím na vlastní oči. Malé bitevní pole plné mrtvol, zjevně ponechané hnít už delší dobu.\n\nPtáci, s krví na zobácích, občas zvednou hlavy od svých jídel, když procházím kolem."
 bp3_roaming.0130.desc.companion: " [special_guest.GetFirstName] se při tom pohledu dusí a rychle se z místa vzdaluje."
 bp3_roaming.0130.a: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych obětovat krátkou modlitbu za mrtvé."
 bp3_roaming.0130.b: "Podívejme se, jestli tu nenajdu něco cenného."
 bp3_roaming.0130.c: "„A pak jsem [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')], jak mrtví vylezli ze země...“„"
 roaming_battlefield_prayer_key_title: "Zapomenuté bitevní pole"
 roaming_battlefield_prayer_key: "V [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] [host.GetShortUIName] [Select_CString(host.IsFemale,'našla','našel')] zapomenuté bitevní pole, kde [Select_CString(host.IsFemale,'obětovala','obětoval')] krátkou modlitbu za mrtvé."
 roaming_battlefield_scavenging_key_title: "$roaming_battlefield_prayer_key_title$"
 roaming_battlefield_scavenging_key: "V [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] [host.GetShortUIName] [Select_CString(host.IsFemale,'našla','našel')] zapomenuté bitevní pole, kde si [Select_CString(host.IsFemale,'udělala','udělal')] chvíli na okopání místa a hledání hodnotných věcí."
 roaming_battlefield_poet_key_title: "$roaming_battlefield_prayer_key_title$"
 roaming_battlefield_poet_key: "V [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] [host.GetShortUIName] [Select_CString(host.IsFemale,'našla','našel')] zapomenuté bitevní pole, kde [host.GetSheHe] tvrdí, že [Select_CString(host.IsFemale,'viděla','viděl')] mrtvé vstávat."
 bp3_roaming.0140.t: "Noc v divočině"
 bp3_roaming.0140.desc: "Tichá tma obklopí tábor, když uleháme na noc. Stráž stojí na stráži, a přesto není klidu. Zvuky tvorů čvachtajících, plazících se a mručících v temnotě narušují ticho.\n\nNad námi je noční obloha nekonečným tapisériem malých světel. Na chvíli se snažím odtamtud odvrátit rušivé zvuky a soustředit se jen na ten pohled."
 bp3_roaming.0140.desc.companion: "\n\nKdyž tak činím, slyším [special_guest.GetFirstName] lehce chrápat nedaleko. Zdá se, že nikdo jiný nemá potíže usnout..."
 bp3_roaming.0140.a: "Nemysli na to, zavři oči a pomodli se."
 bp3_roaming.0140.b: "„Stráže! Prohledejte lesy kvůli jakýmkoli bestiím; mýtickým či obyčejným!“„"
 bp3_roaming.0140.b.1: "Celou noc strávíte hledáním hrozeb"
 bp3_roaming.0140.b.2: "Odstrašíte cokoli, co tam bylo"
 bp3_roaming.0140.b.3: "Usnete, zatímco stráže dělají svou práci"
 bp3_roaming.0140.c: "„[Select_CString(ROOT.Char.IsFemale,'Viděla','Viděl')] jsem malé nelidské tvory tančit na okraji světla...“„"
 bp3_roaming.0140.d: "Dokonalý čas a místo k přemýšlení."
 roaming_night_scare_key_title: "Noc v divočině"
 roaming_night_scare_key: "[host.GetShortUIName] [Select_CString(host.IsFemale,'strávila','strávil')] celou noc v [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] vyděšený(á) nočními zvuky."
 roaming_night_threat_key_title: "$roaming_night_scare_key_title$"
 roaming_night_threat_key: "[host.GetShortUIName] [Select_CString(host.IsFemale,'strávila','strávil')] celou noc v [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] hledáním imaginárních hrozeb."
 roaming_night_sleep_key_title: "$roaming_night_scare_key_title$"
 roaming_night_sleep_key: "[host.GetShortUIName] si po odehnání tvorů rušících [Select_CString(host.IsFemale,'jí','ho')] v [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] [Select_CString(host.IsFemale,'dokázala','dokázal')] dobře odpočinout."
 roaming_night_poet_key_title: "$roaming_night_scare_key_title$"
 roaming_night_poet_key: "[host.GetShortUIName] údajně [Select_CString(host.IsFemale,'strávila','strávil')] celou noc pozorováním nelidských tvorů tančících kolem [Select_CString(host.IsFemale,'jejího','jeho')] tábora."
 roaming_night_mystic_key_title: "Noční obloha"
 roaming_night_mystic_key: "[host.GetShortUIName] [Select_CString(host.IsFemale,'strávila','strávil')] celou noc pozorováním noční oblohy a rozjímáním o životě."
 bp3_roaming.0150.t: "Tiché jezírko"
 bp3_roaming.0150.desc: "Po dlouhém dni chůze přes [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')] náhle najdu tiché jezírko uprostřed divočiny. Kromě tichých ptáků pijících u vody není k vidění žádný člověk ani zvíře.\n\n"
 bp3_roaming.0150.desc.no_companion: "Sednu si u vody, odpočinu si nohy a hluboce se nadechnu."
 bp3_roaming.0150.desc.companion: "Usedneme u vody, odpočineme si nohy a slyším, jak [special_guest.GetFirstName] vydechne těžce."
 bp3_roaming.0150.a: "Ah, chvíle odpočinku."
 bp3_roaming.0150.b: "„[Select_CString(ROOT.Char.IsFemale,'Odešla','Odešel')] jsem, když jsem [Select_CString(ROOT.Char.IsFemale,'zaslechla','zaslechl')] kouzelné tóny ozývající se přes vodu...“„"
 roaming_quiet_pond_key_title: "Tiché jezírko"
 roaming_quiet_pond_key: "[host.GetShortUIName] [Select_CString(host.IsFemale,'narazila','narazil')] na tiché jezírko v krajině [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip], kde [Select_CString(host.IsFemale,'našla','našel')] odpočinek."
 roaming_quiet_pond_poet_key_title: "$roaming_quiet_pond_key_title$"
 roaming_quiet_pond_poet_key: "[host.GetShortUIName] [Select_CString(host.IsFemale,'narazila','narazil')] na tiché jezírko, ale údajně [Select_CString(host.IsFemale,'utekla','utekl')], když ho kouzelná melodie přiměla ponořit se hlouběji do vod..."
 bp3_roaming.0160.t: "Hořící statek"
 bp3_roaming.0160.desc: "Ještě dlouho než se to objeví v dohledu, cítím pach hořícího dřeva a masa. Po našem příjezdu vidím jen doutnající schránku toho, co musel kdysi být rozsáhlý statek.\n\n"
 bp3_roaming.0160.desc.no_companion: "Moji strážní jen krátce upozorní, že tady není nic ani nikdo, koho by stálo za to zachraňovat."
 bp3_roaming.0160.desc.companion: "Slyším [special_guest.GetFirstName], jak mluví s mými strážemi; není tu nikdo ani nic, co by stálo za záchranu."
 bp3_roaming.0160.desc.outro: "Vše, co zbylo, jsou popely domova a těch, kdo v něm žili."
 bp3_roaming.0160.a: "Najít pozůstatky a dát jim náležitý odpočinek."
 bp3_roaming.0160.b: "Stráže, otrhejte místo do posledního kousku."
 bp3_roaming.0160.c: "„Opakovaně jsme se snažili vniknout do hořící budovy, ale marně...“„"
 roaming_burning_farm_piety_key_title: "Hořící statek"
 roaming_burning_farm_piety_key: "Během cest [host.GetHerHis] [host.GetShortUIName] [Select_CString(host.IsFemale,'narazila','narazil')] na hořící statek. [host.GetSheHe|U] a [Select_CString(host.IsFemale,'její','jeho')] stráže uložili pozůstatky ke klidnému odpočinku před odchodem."
 roaming_burning_farm_greedy_key_title: "$roaming_burning_farm_piety_key_title$"
 roaming_burning_farm_greedy_key: "Během cest [host.GetHerHis] [host.GetShortUIName] [Select_CString(host.IsFemale,'narazila','narazil')] na hořící statek. [host.GetSheHe|U] a [Select_CString(host.IsFemale,'její','jeho')] stráže místo pečlivě prohledali a odcházeli s tím, co našli."
 roaming_burning_farm_poet_key_title: "$roaming_burning_farm_piety_key_title$"
 roaming_burning_farm_poet_key: "Během cest [host.GetHerHis] [host.GetShortUIName] [Select_CString(host.IsFemale,'narazila','narazil')] na hořící statek. Se údajně [Select_CString(host.IsFemale,'snažila','snažil')] co nejvíce pomoci těm, kteří tam žili, ale marně."
 bp3_roaming.0170.t: "Tichý den"
 bp3_roaming.0170.desc: "Navzdory mým očekáváním se den odehrál překvapivě poklidně a tichounce. Zpočátku jsem se na každý zvuk a pohyb [Select_CString(ROOT.Char.IsFemale,'reagovala','reagoval')] s pozorností. Jak čas plynul, nic zvláštního nevyčnívalo a moje pozornost postupně slábla.\n\n"
 bp3_roaming.0170.desc.no_companion: "Postupně si ale začnu užívat samotnou procházku. Stává se z ní čas jen pro mě a mé myšlenky."
 bp3_roaming.0170.desc.companion: "Postupně si začnu vážit času stráveného s [special_guest.GetFirstName]. Neobjevilo se nic důležitého, ale bylo to přesto příjemné."
 bp3_roaming.0170.a: "Možná je to přesně to, co jsem [Select_CString(ROOT.Char.IsFemale,'potřebovala','potřeboval')]."
 roaming_quiet_day_key_title: "Tichý den"
 roaming_quiet_day_key: "[host.GetShortUIName|U] [Select_CString(host.IsFemale,'měla','měl')] podivně klidný den při průchodu [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip]."
 bp3_roaming.0180.t: "Unavené mumlání"
 bp3_roaming.0180.desc: "Cestuji [Select_CString(ROOT.Char.IsFemale,'ráda','rád')] po [ROOT.Char.GetCurrentLocation.GetName], ale bohužel totéž nelze říct o mém společníkovi. [special_guest.GetFirstName] začíná značně zaostávat a občas z něj slyším nadávky, někdy i se mnou v nich jmenovaným. S frustrovaným hlasem se nakonec zeptá: „Jsme už tam?“\n\nJsem si docela jistý(á), že od cíle jsme ještě daleko a čeká nás pořádný kus cesty. [special_guest.GetSheHe|U] čeká ode mě odpověď."
 bp3_roaming.0180.a: "Klid, je to hned za rohem!"
 bp3_roaming.0180.a_short: "Pokračujete dál!"
 bp3_roaming.0180.b: "Možná je čas si dát pauzu..."
 roaming_tired_mutterings_lies_key_title: "Unavené mumlání"
 roaming_tired_mutterings_lies_key: "Navzdory unaveným stížnostem [special_guest.GetShortUIName|U] [host.GetShortUIName|U] [Select_CString(host.IsFemale,'odmítla','odmítl')] naslouchat."
 roaming_tired_mutterings_break_key_title: "Unavené mumlání"
 roaming_tired_mutterings_break_key: "Po unaveném mumlání a stížnostech od [special_guest.GetShortUIName|U] se [host.GetShortUIName|U] [Select_CString(host.IsFemale,'rozhodla','rozhodl')] udělat pauzu."
 roaming_tired_mutterings_athletic_key_title: "Dlouhá chůze"
 roaming_tired_mutterings_athletic_key: "[host.GetShortUIName|U] [Select_CString(host.IsFemale,'strávila','strávil')] značnou dobu přecházením [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip], [Select_CString(host.IsFemale,'budovala','budoval')] výdrž a [Select_CString(host.IsFemale,'nacházela','nacházel')] v tom potěšení."
 bp3_roaming.0190.t: "Příležitost k rozhovoru"
 bp3_roaming.0190.desc: "Při cestě po divočině kolem [ROOT.Char.GetCurrentLocation.GetName] máme s [special_guest.GetFirstName] spoustu času na rozhovor. [Select_CString(ROOT.Char.IsFemale,'Doufala','Doufal')] jsem, že si čas společně užijeme, ale jsem příjemně [Select_CString(ROOT.Char.IsFemale,'překvapena','překvapen')], jak dobře to jde.\n\n[special_guest.GetFirstNameNoTooltip] má širokou škálu zajímavých témat, ať už o konkrétních lidech doma v [ROOT.Char.GetCapitalLocation.GetName], místních drbech nebo památných příbězích. Hodiny uběhly dřív, než jsem si to [Select_CString(ROOT.Char.IsFemale,'uvědomila','uvědomil')], a zdálo se to jako okamžik."
 bp3_roaming.0190.a: "Nemůžu uvěřit, že to [random_courtier.GetFirstNameNoTooltip] řekl! To je k popukání!"
 roaming_chance_to_talk_key_title: "Příležitost k rozhovoru"
 roaming_chance_to_talk_key: "[special_guest.GetShortUIName|U] a [host.GetShortUIName|U] si užili konverzaci při přechodu v [activity.GetCurrentPhase.GetLocation.GetName]."
 bp3_roaming.0200.t: "Plátno na nebi"
 bp3_roaming.0200.desc: "Už několik hodin po západu slunce se obloha náhle promění v nejkrásnější odstíny fialové, modré a oranžové. Je to, jako by [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself] [Select_CString(ROOT.Char.IsFemale,'použila','použil')] nebesa jako plátno.\n\nV úžasu i strachu sledujeme zázrak v tichosti. Až po jeho skončení se všichni začnou o tomto výjevu bavit, jak v uctivé, tak vyděšené míře."
 bp3_roaming.0200.a: "To [Select_CString(ROOT.Char.IsFemale,'byla','byl')] úchvatný pohled!"
 roaming_nightsky_canvas_key_title: "Plátno na nebi"
 roaming_nightsky_canvas_key: "[host.GetShortUIName|U] [Select_CString(host.IsFemale,'sledovala','sledoval')] impozantní astronomický úkaz nad [activity.GetCurrentPhase.GetLocation.GetName]."
 bp3_roaming.0210.t: "Ptáci nad hlavou"
 bp3_roaming.0210.desc: "Když putujeme [province.GetName], dva ptáci nás následují celé hodiny. Pomalu krouží kolem nás, přistávají příliš daleko na to, aby byli v nebezpečí, a zpívají na nás z dálky. Když se na chvíli přiblíží, vidím jejich černobílé peří.\n\nPo čase krouží jednou a pak odletí. I když jsou pryč, slyšíme jejich zpěv ještě z dálky."
 bp3_roaming.0210.a: "Jeden pro smůlu, dva pro štěstí."
 the_birds_overhead_key_title: "$bp3_roaming.0210.t$"
 the_birds_overhead_key: "[host.GetShortUIName] [Select_CString(host.IsFemale,'měla','měl')] pár ptáků, kteří ho/ji sledovali přes [province.GetName] a zpívali na skupinu z dálky."
 bp3_roaming.0220.t: "Zapomenutá vesnice"
 bp3_roaming.0220.desc: "„#emp Tady je vesnice?!#!“ vykřiknu, úplně zmatený(á).\n\nNebyla na žádné mapě a nikdo o ní nikdy nic nezmínil. A přesto tu stojí. Když se ptám, jak se vesnice jmenuje, lidé prostě odpoví: „Vesnice? To je vesnice.“ V jakémsi silném přízvuku, který jsem nikdy [Select_CString(ROOT.Char.IsFemale,'neslyšela','neslyšel')].\n\nKdo jsou tito lidé?! Proč jsem o nich nikdy [Select_CString(ROOT.Char.IsFemale,'neslyšela','neslyšel')]?"
 bp3_roaming.0220.a: "Počkejte, vlastně mi prý dluží hodně daní?"
 bp3_roaming.0220.a.landless: "Podívejme se, co tu mají..."
 bp3_roaming.0220.b: "Musím se o těchto lidech naučit vše!"
 bp3_roaming.0220.b.mystic: "Poučeno od vesnického mystika"
 bp3_roaming.0220.c: "Jak zajímavé! Budou dobrým příběhem."
 roaming_forgotten_village_modifier: "$bp3_roaming.0220.t$"
 roaming_forgotten_village_modifier_desc: "Zapomenutá vesnice v okolí se nedávno znovu spojila s mnoha svými sousedy a sdílí své znalosti a tradice."
 the_forgotten_village_key_title: "$bp3_roaming.0220.t$"
 the_forgotten_village_key: "[host.GetShortUIName] [Select_CString(host.IsFemale,'narazila','narazil')] na starou zapomenutou vesnici při cestě po vnitrozemí [province.GetName]."
 the_forgotten_village_mystic_key_title: "Vesnický mystik"
 the_forgotten_village_mystic_key: "[host.GetShortUIName] se v [province.GetName] [Select_CString(province.IsFemale,'naučila','naučil')] tradice vesnického mystika."
 bp3_roaming.0230.t: "Poustevník"
 bp3_roaming.0230.desc: "Když cestujeme po vnitrozemí [province.GetName], moji strážní a já náhle narazíme na [hermit_character.GetWomanMan] oblečeného(ou) do špinavých rouch, sedícího(í) u [hermit_character.GetHerselfHimself]. Jakmile si nás [hermit_character.GetSheHe] všimne, hlasitě vykřikne: „Jste poslední zkouška poslaná [hermit_character.GetFaith.HighGodName]?“\n\n„Promiňte?“ zvládnu říct, zmatený(á) a trochu uražený(á).\n\n„Pojď, povím ti vše o zkouškách a lamentacích [hermit_character.GetName] Moudrého...“"
 bp3_roaming.0230.a: "Máte zvláštní představy, [hermit_character.GetNameNoTooltip]."
 bp3_roaming.0230.a.hermit: "[Select_CString(ROOT.Char.IsFemale,'Mluvila','Mluvil')] s poustevníkem"
 bp3_roaming.0230.b: "#emp Řekni mi více...#!"
 bp3_roaming.0230.b.tooltip: "Tajně konvertujete k [hermit_faith.GetName]"
 bp3_roaming.0230.c: "Co jste [Select_CString(ROOT.Char.IsFemale,'říkala','říkal')] o [ROOT.Char.GetFaith.HighGodName]? Neslušné, ty kacíři!"
 the_hermit_key_title: "Poustevník"
 the_hermit_key: "[host.GetShortUIName] [Select_CString(host.IsFemale,'potkala','potkal')] podivného poustevníka venku v divočině."
 the_hermit_learning_key_title: "Poustevnická poučení"
 the_hermit_learning_key: "[host.GetShortUIName] dlouze [Select_CString(host.IsFemale,'hovořila','hovořil')] s poustevníkem ve vnitrozemí [province.GetName]."
 roaming_the_hermit_modifier: "Neortodoxní myšlenky"
 roaming_the_hermit_modifier_desc: "Tato postava pravidelně sdílí neortodoxní myšlenky a názory na náboženství."
 bp3_roaming.0240.t: "Noc, na kterou se nezapomíná"
 bp3_roaming.0240.desc: "Když se usadíme na noc, celá obloha se rozzáří hvězdami. Je to jedna z nejjasnějších nocí, které jsme od odchodu z [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] viděli.\n\nJe ticho, ani zvuk od lidí či zvířat. Jako by se [province.GetTerrain.GetNameNoTooltip|l] zadržely dech, zatímco všichni pozorujeme noční oblohu. [Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych jít spát a odpočinout si na ráno, ale... Možná zůstanu vzhůru ještě hodinu nebo dvě."
 bp3_roaming.0240.a: "Budeme si to pamatovat do konce života."
 a_night_to_remember_key_title: "Noc, na kterou se nezapomíná"
 a_night_to_remember_key: "[host.GetShortUIName] [Select_CString(host.IsFemale,'zůstala','zůstal')] vzhůru téměř celou noc a [Select_CString(host.IsFemale,'sledovala','sledoval')] jasnou hvězdnou oblohu."
 bp3_roaming.0250.t: "Malý hrob"
 bp3_roaming.0250.desc: "Cestou přes [province.Custom('HoldingNoHoldingTerrainRoaming')] narazíme na něco, co vypadá jako hrob. Má [province.Custom('RoamingGraveVariants')]. Není nic, co by naznačovalo, proč tu hrob stojí tak daleko od civilizace.\n\nI přes odlehlé místo bylo vynaloženo mnoho úsilí, aby místo vypadalo pěkně. Vzhledem k situaci bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')]..."
 bp3_roaming.0250.a: "Obětovat několik modliteb."
 bp3_roaming.0250.b: "Vykopat jakékoli cennosti, které tu skryli."
