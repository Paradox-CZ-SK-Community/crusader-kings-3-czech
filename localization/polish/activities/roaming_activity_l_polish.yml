 roaming_night_mystic_key_title: "Noční obloha"
 roaming_night_mystic_key: "[host.GetShortUIName] [Select_CString(host.IsFemale, 'strávila celou noc pozorováním noční oblohy a rozjímáním o životě', 'strávil celou noc pozorováním noční oblohy a rozjímáním o životě')]."
 bp3_roaming.0150.t: "Tichý rybník"
 bp3_roaming.0150.desc: "Po dlouhém dni stráveném putováním krajinou, kterou tvoří [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')], náhle uprostřed divočiny objevím tichý rybník. Kromě několika ptáků pokojně pijících u vody není v dohledu jediný člověk ani zvíře.\n\n"
 bp3_roaming.0150.desc.no_companion: "Usedám k vodě, nechávám odpočinout nohy a zhluboka se nadechuji."
 bp3_roaming.0150.desc.companion: "Usedáme k vodě, necháváme odpočinout nohy a slyším, jak si [special_guest.GetFirstName] těžce povzdechne."
 bp3_roaming.0150.a: "Ach, konečně chvíle odpočinku."
 bp3_roaming.0150.b: "„Odešel[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem, když se nad vodou rozezněla podmanivá melodie...“"
 roaming_quiet_pond_key_title: "Tichý rybník"
 roaming_quiet_pond_key: "[host.GetShortUIName] [Select_CString(host.IsFemale, 'narazila v divočině místa zvaného', 'narazil v divočině místa zvaného')] [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] na tichý rybník, u kterého si [Select_CString(host.IsFemale, 'odpočinula', 'odpočinul')]."
 roaming_quiet_pond_poet_key_title: "$roaming_quiet_pond_key_title$"
 roaming_quiet_pond_poet_key: "[host.GetShortUIName] [Select_CString(host.IsFemale, 'narazila na tichý rybník, ale údajně uprchla, když ji podmanivá melodie lákala k důvěrnějšímu seznámení s jeho hlubinami', 'narazil na tichý rybník, ale údajně uprchl, když jej podmanivá melodie lákala k důvěrnějšímu seznámení s jeho hlubinami')]..."
 bp3_roaming.0160.t: "Hořící statek"
 bp3_roaming.0160.desc: "Dlouho předtím, než jej spatřím, ke mně dolehne pach hořícího dřeva a masa. Když dorazíme na místo, vidím už jen doutnající trosky něčeho, co kdysi muselo být rozlehlým statkem.\n\n"
 bp3_roaming.0160.desc.no_companion: "Strážným stačí jediný pohled, aby mi oznámili, že už tu není nikdo ani nic, co by se dalo zachránit."
 bp3_roaming.0160.desc.companion: "Slyším, jak [special_guest.GetFirstName] mluví s mými strážnými. Už tu není nikdo ani nic, co by se dalo zachránit."
 bp3_roaming.0160.desc.outro: " Zbyl jen popel domova a těch, kdo v něm žili."
 bp3_roaming.0160.a: "Najděte ostatky a řádně je pohřběte."
 bp3_roaming.0160.b: "Stráže, prohledejte to tu a vezměte vše, co má cenu."
 bp3_roaming.0160.c: "„Znovu a znovu jsme se pokoušeli proniknout do hořící budovy, ale marně...“"
 roaming_burning_farm_piety_key_title: "Hořící statek"
 roaming_burning_farm_piety_key: "Na svých cestách [host.GetShortUIName] [Select_CString(host.IsFemale, 'narazila', 'narazil')] na hořící statek. Společně se svými strážemi se [Select_CString(host.IsFemale, 'postarala', 'postaral')] o řádný odpočinek ostatků a poté místo opustili."
 roaming_burning_farm_greedy_key_title: "$roaming_burning_farm_piety_key_title$"
 roaming_burning_farm_greedy_key: "Na svých cestách [host.GetShortUIName] [Select_CString(host.IsFemale, 'narazila', 'narazil')] na hořící statek. Společně se svými strážemi místo obrali o vše, co mělo nějakou cenu, a poté odešli."
 roaming_burning_farm_poet_key_title: "$roaming_burning_farm_piety_key_title$"
 roaming_burning_farm_poet_key: "Na svých cestách [host.GetShortUIName] [Select_CString(host.IsFemale, 'narazila', 'narazil')] na hořící statek. Údajně [Select_CString(host.IsFemale, 'se ze všech sil snažila', 'se ze všech sil snažil')] pomoci těm, kdo tam žili, ale marně."
 bp3_roaming.0170.t: "Poklidný den"
 bp3_roaming.0170.desc: "Navzdory všem mým očekáváním se den nese v nezvykle poklidném a idylickém duchu. Zpočátku zbystřím při každém pohybu a zvuku. Jak ale čas plyne, nic zvlášť pamětihodného se neděje a má pozornost postupně ochabuje.\n\n"
 bp3_roaming.0170.desc.no_companion: "Postupně si však začínám užívat samotnou prostotu této procházky. Je to chvíle, která patří jen mně a mým myšlenkám."
 bp3_roaming.0170.desc.companion: "Postupně však začínám oceňovat čas strávený se [special_guest.GetFirstName]. Neprobíráme nic důležitého, ale i tak je mi příjemně."
 bp3_roaming.0170.a: "Možná jsem přesně tohle potřeboval[Select_CString(ROOT.Char.IsFemale, 'a', '')]."
 roaming_quiet_day_key_title: "Poklidný den"
 roaming_quiet_day_key: "[host.GetShortUIName|U] [Select_CString(host.IsFemale, 'prožila', 'prožil')] při průchodu místem zvaným [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] podivně poklidný den."
 bp3_roaming.0180.t: "Unavené reptání"
 bp3_roaming.0180.desc: "Procházku krajem zvaným [ROOT.Char.GetCurrentLocation.GetName] si docela užívám, ale k mé nelibosti to samé rozhodně neplatí pro můj doprovod. [special_guest.GetFirstName] začíná stále více zaostávat a občas zaslechnu nějakou nadávku, někdy dokonce i se svým jménem. Nakonec se ozve podrážděný hlas: „Už tam budeme?“\n\nJsem si docela jist[Select_CString(ROOT.Char.IsFemale, 'á', '')], že náš cíl je stále daleko a čeká nás ještě pořádný kus cesty. [special_guest.GetFirstName] se na mě tázavě dívá a čeká na odpověď."
 bp3_roaming.0180.a: "Neboj, už je to jen kousek!"
 bp3_roaming.0180.a_short: "Pokračuješ dál!"
 bp3_roaming.0180.b: "Možná je čas na přestávku..."
 roaming_tired_mutterings_lies_key_title: "Unavené reptání"
 roaming_tired_mutterings_lies_key: "Navzdory unavenému reptání a stížnostem postavy [special_guest.GetShortUIName|U] je [host.GetShortUIName|U] odmítl[Select_CString(host.IsFemale, 'a', '')] vyslyšet."
 roaming_tired_mutterings_break_key_title: "Unavené reptání"
 roaming_tired_mutterings_break_key: "Po unaveném reptání a stížnostech postavy [special_guest.GetShortUIName|U] se [host.GetShortUIName|U] [Select_CString(host.IsFemale, 'rozhodla', 'rozhodl')] udělat přestávku."
 roaming_tired_mutterings_athletic_key_title: "Dlouhá procházka"
 roaming_tired_mutterings_athletic_key: "[host.GetShortUIName|U] [Select_CString(host.IsFemale, 'strávila', 'strávil')] dlouhou dobu putováním místem zvaným [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip], přičemž si [Select_CString(host.IsFemale, 'budovala', 'budoval')] vytrvalost a samotnou chůzi si stále více užíval[Select_CString(host.IsFemale, 'a', '')]."
 bp3_roaming.0190.t: "Příležitost si popovídat"
 bp3_roaming.0190.desc: "Při putování divočinou kolem místa zvaného [ROOT.Char.GetCurrentLocation.GetName] máme se [special_guest.GetFirstName] spoustu času na povídání. Doufal[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem, že si společný čas užijeme, ale příjemně mě překvapuje, jak dobře si rozumíme.\n\n[special_guest.GetFirstNameNoTooltip] dokáže vytáhnout nepřeberné množství zajímavých témat, ať už jde o lidi doma v místě zvaném [ROOT.Char.GetCapitalLocation.GetName], místní klepy nebo nezapomenutelné příběhy. Než se naději, uplynou celé hodiny, a přitom mi připadají jako pouhá chvilka."
 bp3_roaming.0190.a: "Nemůžu uvěřit, že [random_courtier.GetFirstNameNoTooltip] něco takového řekl[Select_CString(random_courtier.IsFemale, 'a', '')]! To je k popukání!"
 roaming_chance_to_talk_key_title: "Příležitost si popovídat"
 roaming_chance_to_talk_key: "[special_guest.GetShortUIName|U] a [host.GetShortUIName|U] si při putování místem zvaným [activity.GetCurrentPhase.GetLocation.GetName] užili příjemný rozhovor."
 bp3_roaming.0200.t: "Plátno na nebesích"
 bp3_roaming.0200.desc: "Od západu slunce uplynulo už několik hodin, když se obloha náhle rozzáří těmi nejkrásnějšími odstíny fialové, modré a oranžové. Jako by sama nebesa byla plátnem, na němž tvoří [ROOT.Char.GetFaith.HighGodName].\n\nV úžasu i obavách všichni mlčky sledujeme, jak se před námi celé představení odehrává. Teprve když skončí, všichni začnou o tom výjevu mluvit, s posvátnou úctou i strachem."
 bp3_roaming.0200.a: "To je nádhera!"
 roaming_nightsky_canvas_key_title: "Plátno na nebesích"
 roaming_nightsky_canvas_key: "[host.GetShortUIName|U] [Select_CString(host.IsFemale, 'pozorovala', 'pozoroval')] působivý astronomický úkaz na obloze nad místem zvaným [activity.GetCurrentPhase.GetLocation.GetName]."
 bp3_roaming.0210.t: "Ptáci nad námi"
 bp3_roaming.0210.desc: "Když procházíme krajem zvaným [province.GetName], celé hodiny nás sledují dva ptáci. Pomalu kolem nás krouží, usedají vždy dost daleko, aby jim nic nehrozilo, a z dálky na nás pokřikují. Když se na okamžik přiblíží, zahlédnu jejich černobílé peří.\n\nPo nějaké době kolem nás ještě jednou zakrouží a pak odletí. I když už jsou pryč, stále v dálce slyšíme jejich zpěv."
 bp3_roaming.0210.a: "Nu, jeden pro žal, dva pro štěstí."
 the_birds_overhead_key_title: "$bp3_roaming.0210.t$"
 the_birds_overhead_key: "[host.GetShortUIName] [Select_CString(host.IsFemale, 'putovala', 'putoval')] krajem zvaným [province.GetName] v doprovodu dvojice ptáků, kteří kroužili nad družinou a z dálky na ni pokřikovali."
 bp3_roaming.0220.t: "Zapomenutá vesnice"
 bp3_roaming.0220.desc: "„#emp Tady je vesnice?!#!“ vyhrknu naprosto zmateně.\n\nNení zakreslená na žádné mapě a jediný člověk se o ní nikdy nezmínil. A přece tu stojí. Když se ptám, jak se vesnice jmenuje, lidé jednoduše odpovídají: „Vesnice? No přece vesnice.“ Jejich silný přízvuk je navíc úplně cizí.\n\nKdo jsou tihle lidé?! Jak je možné, že o nich slyším poprvé?"
 bp3_roaming.0220.a: "Počkat, neměli by mi vlastně platit spoustu daní?"
 bp3_roaming.0220.a.landless: "Podíváme se, co tu mají..."
 bp3_roaming.0220.b: "O těchto lidech musím zjistit úplně všechno!"
 bp3_roaming.0220.b.mystic: "Poznatky z vesnické mystiky"
 bp3_roaming.0220.c: "Jak podivuhodné! Z toho bude skvělý příběh."
 roaming_forgotten_village_modifier: "$bp3_roaming.0220.t$"
 roaming_forgotten_village_modifier_desc: "Zapomenutá vesnice v této oblasti nedávno obnovila styky s mnoha sousedy a začala se s nimi dělit o své vědomosti a tradice."
 the_forgotten_village_key_title: "$bp3_roaming.0220.t$"
 the_forgotten_village_key: "[host.GetShortUIName] [Select_CString(host.IsFemale, 'narazila', 'narazil')] při putování odlehlým krajem zvaným [province.GetName] na starou zapomenutou vesnici."
 the_forgotten_village_mystic_key_title: "Vesnická mystika"
 the_forgotten_village_mystic_key: "[host.GetShortUIName] [Select_CString(host.IsFemale, 'se seznámila', 'se seznámil')] s mystickými tradicemi vesnice v místě zvaném [province.GetName]."
 bp3_roaming.0230.t: "[Select_CString(hermit_character.IsFemale, 'Poustevnice', 'Poustevník')]"
 bp3_roaming.0230.desc: "Při putování odlehlým krajem zvaným [province.GetName] narazíme se strážnými na [Select_CString(hermit_character.IsFemale, 'ženu v umazaném rouchu, která tu sedí úplně sama', 'muže v umazaném rouchu, který tu sedí úplně sám')]. [hermit_character.GetFirstName] si nás okamžitě všimne a hlasitě zvolá: „Vy jste ta nejnovější zkouška?! [hermit_character.GetFaith.HighGodName] mě zkouší právě vaším prostřednictvím?!“\n\n„Prosím?“ zmůžu se jen na zmatenou a poněkud dotčenou odpověď.\n\n„Pojďte, povím vám, [Select_CString(hermit_character.IsFemale, 'jaké zkoušky a strasti zakusila', 'jaké zkoušky a strasti zakusil')] [hermit_character.GetName] [Select_CString(hermit_character.IsFemale, 'Moudrá', 'Moudrý')]...“"
 bp3_roaming.0230.a: "Máš vskutku zvláštní názory, [hermit_character.GetNameNoTooltip]."
 bp3_roaming.0230.a.hermit: "[Select_CString(hermit_character.IsFemale, 'Rozhovor s poustevnicí', 'Rozhovor s poustevníkem')]"
 bp3_roaming.0230.b: "#emp Pověz mi víc...#!"
 bp3_roaming.0230.b.tooltip: "Tvou novou vírou se tajně stane [hermit_faith.GetName]"
 bp3_roaming.0230.c: "[ROOT.Char.GetFaith.HighGodName] si takové řeči nezaslouží! Nepřijatelné, [Select_CString(hermit_character.IsFemale, 'kacířko', 'kacíři')]!"
 the_hermit_key_title: "Setkání v divočině"
 the_hermit_key: "[host.GetShortUIName] při svém putování [Select_CString(host.IsFemale, 'potkala', 'potkal')] v divočině podivuhodnou postavu žijící v ústraní."
 the_hermit_learning_key_title: "Poznatky z divočiny"
 the_hermit_learning_key: "[host.GetShortUIName] [Select_CString(host.IsFemale, 'dlouze rozmlouvala', 'dlouze rozmlouval')] s podivuhodnou postavou žijící v ústraní v odlehlém kraji zvaném [province.GetName]."
 roaming_the_hermit_modifier: "Nekonvenční názory"
 roaming_the_hermit_modifier_desc: "Tato postava pravidelně sdílí nekonvenční názory a úvahy o náboženství."
 bp3_roaming.0240.t: "Nezapomenutelná noc"
 bp3_roaming.0240.desc: "Když se ukládáme k nočnímu odpočinku, celé nebe se rozzáří hvězdami. Je to jedna z nejjasnějších nocí, jaké jsme zažili od chvíle, kdy jsme opustili [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier].\n\nPanuje naprosté ticho, není slyšet jediný zvuk, ať už od lidí, nebo od zvířat. Jako by i krajina, kterou tvoří [province.GetTerrain.GetNameNoTooltip|l], zadržovala dech, zatímco všichni hledíme na noční oblohu. Měl bych jít spát a nabrat síly na ráno, ale... Možná ještě hodinu nebo dvě vydržím vzhůru."
 bp3_roaming.0240.a: "Na tohle budu vzpomínat do konce života."
 a_night_to_remember_key_title: "Nezapomenutelná noc"
 a_night_to_remember_key: "[host.GetShortUIName] téměř celou noc [Select_CString(host.IsFemale, 'bděla a pozorovala', 'bděl a pozoroval')] jasnou hvězdnou oblohu."
 bp3_roaming.0250.t: "Malý hrob"
 bp3_roaming.0250.desc: "Při putování krajinou označovanou jako [province.Custom('HoldingNoHoldingTerrainRoaming')] narazíme na něco, co vypadá jako hrob. Je tu [province.Custom('RoamingGraveVariants')]. Nic nenaznačuje, proč se hrob nachází právě tady, tak daleko od civilizace.\n\nNavzdory odlehlosti tohoto místa si dal někdo velkou práci s tím, aby jeho okolí působilo důstojně. Za těchto okolností bych měl..."
 bp3_roaming.0250.a: "Pomodlit se za zemřelého."
 bp3_roaming.0250.b: "Vykopat všechny cennosti, které v hrobě ukryli."
 roaming_grave_variant_cross: "malý, ale krásný kříž vystupující ze země"
 roaming_grave_variant_burial_mound: "malá mohyla s několika pečlivě rozmístěnými kameny"
 roaming_grave_variant_stone: "malý kámen s vytesaným jménem"
 no_treasure: "Žádný poklad"
 small_treasure: "Malý poklad"
 medium_treasure: "Střední poklad"
 large_treasure: "Velký poklad"
 bp3_roaming.0250.artifact: "Objevíš [Concept('artifact','artefakt')|E]"
 a_small_grave_key_title: "Malý hrob"
 a_small_grave_key: "[host.GetShortUIName] [Select_CString(host.IsFemale, 'našla', 'našel')] malý hrob v divočině kraje zvaného [province.GetName]."
