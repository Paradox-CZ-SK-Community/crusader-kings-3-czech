 apa_roaming_feather_title: "[first.GetShortUIName|U] objevuje pestré pírko"
 apa_roaming_feather_key_title: "Pestré pírko"
 apa_roaming_feather_key: "Během putování místem zvaným [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] se [first.GetShortUIName] podařilo narazit na nádherně pestré pírko."
 apa_roaming_ancient_runestone_title: "[first.GetShortUIName|U] objevuje starý runový kámen"
 apa_roaming_ancient_runestone_key_title: "Starý runový kámen"
 apa_roaming_ancient_runestone_key: "V krajině, kterou tvoří [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')], se [first.GetShortUIName] podařilo objevit starý runový kámen s vybledlými runami."
 apa_roaming_ancient_megalith_title: "[first.GetShortUIName|U] objevuje prastarý megalit"
 apa_roaming_ancient_megalith_key_title: "Prastarý megalit"
 apa_roaming_ancient_megalith_key: "V místě zvaném [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] se [first.GetShortUIName] podařilo objevit němého svědka dávných věků, prastarou megalitickou stavbu."
 apa_roaming_natural_arch_title: "[first.GetShortUIName|U] objevuje skalní bránu v divočině"
 apa_roaming_natural_arch_key_title: "Skalní brána"
 apa_roaming_natural_arch_key: "[first.GetShortUIName] zůstává v úžasu před impozantní skalní bránou, na kterou náhodou narazí v krajině, kterou tvoří [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')]."
 apa_roaming_coast_seashells_title: "[first.GetShortUIName|U] objevuje vzácné mušle"
 apa_roaming_coast_seashells_key_title: "Vzácné mušle"
 apa_roaming_coast_seashells_key: "Při průzkumu pobřežní jeskyně se [first.GetShortUIName] podařilo objevit sbírku vzácných mušlí a perel, které zde během přílivu a odlivu zůstaly skryté."
 apa_roaming_forest_gnarled_oak_title: "[first.GetShortUIName|U] objevuje hnízdící ptáky"
 apa_roaming_forest_gnarled_oak_key_title: "Hnízdící ptáci"
 apa_roaming_forest_gnarled_oak_key: "Při putování krajinou, kterou tvoří [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')], se [first.GetShortUIName] podařilo narazit na mohutný pokroucený dub s dutým kmenem, který poskytuje útočiště hnízdícím ptákům."
 apa_roaming_rabbit_family_title: "[first.GetShortUIName|U] objevuje malou králičí rodinku"
 apa_roaming_rabbit_family_key_title: "Místní králíci"
 apa_roaming_rabbit_family_key: "V krajině, kterou tvoří [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')], [first.GetShortUIName] objevuje slunnou mýtinu s rodinkou králíků, kteří dovádějí a poskakují v trávě."
 apa_roaming_desert_lilies_title: "[first.GetShortUIName|U] objevuje pouštní lilie"
 apa_roaming_desert_lilies_key_title: "Pouštní lilie"
 apa_roaming_desert_lilies_key: "V krajině, kterou tvoří [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')], [first.GetShortUIName] objevuje pole křehkých pouštních lilií, jejichž bledé květy se v divočině rozevírají jako pomíjivé poklady."
 apa_roaming_desert_lilies_oasis_title: "$apa_roaming_desert_lilies_title$"
 apa_roaming_desert_lilies_oasis_key_title: "$apa_roaming_desert_lilies_key_title$"
 apa_roaming_desert_lilies_oasis_key: "Uprostřed zeleně oázy si [first.GetShortUIName] všímá trsu pouštních lilií, jejichž křehké květy dodávají písečné krajině nádech půvabu."
 apa_roaming_desert_fox_title: "[first.GetShortUIName|U] spatří pouštní lišku"
 apa_roaming_desert_fox_key_title: "Pouštní liška"
 apa_roaming_desert_fox_key: "Mezi tichými dunami si [first.GetShortUIName] všímá osamělé pouštní lišky. Její zlatavá srst dokonale splývá s pískem, zatímco se ladně pohybuje krajinou."
 apa_roaming_mountain_river_title: "[first.GetShortUIName|U] odpočívá u klidné řeky"
 apa_roaming_mountain_river_key_title: "Horská řeka"
 apa_roaming_mountain_river_key: "Při putování krajinou, kterou tvoří [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')], [first.GetShortUIName] objevuje průzračný horský potok, který nabízí vítanou příležitost k odpočinku."
 apa_roaming_lonely_yurt_title: "[first.GetShortUIName|U] objevuje opuštěnou jurtu"
 apa_roaming_lonely_yurt_key_title: "Osamělá jurta"
 apa_roaming_lonely_yurt_key: "Při putování otevřenou stepí [first.GetShortUIName] objevuje osamělou jurtu, prostý úkryt před nehostinnou divočinou."
 apa_roaming_standing_stone_title: "[first.GetShortUIName|U] spatří vztyčený kámen"
 apa_roaming_standing_stone_key_title: "Vztyčený kámen"
 apa_roaming_standing_stone_key: "V krajině, kterou tvoří [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')], [first.GetShortUIName] objevuje prastarý vztyčený kámen, osamělý orientační bod uprostřed okolní krajiny."
 apa_roaming_wildflowers_title: "[first.GetShortUIName|U] objevuje luční kvítí"
 apa_roaming_wildflowers_key_title: "Luční kvítí"
 apa_roaming_wildflowers_key: "V krajině, kterou tvoří [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')], [first.GetShortUIName] žasne nad záplavou lučního kvítí, která rozsáhlým travnatým pláním dodává barvy."
 apa_roaming_lost_sheep_title: "[first.GetShortUIName|U] spatří zatoulanou ovci"
 apa_roaming_lost_sheep_key_title: "Zatoulaná ovce"
 apa_roaming_lost_sheep_key: "Při putování obdělávanou krajinou [first.GetShortUIName] zahlédne zatoulanou ovci, která se sama pase na zelené pastvině."
 apa_roaming_friendly_dog_title: "[first.GetShortUIName|U] potkává přátelského psa"
 apa_roaming_friendly_dog_key_title: "Přátelský pes"
 apa_roaming_friendly_dog_key: "Při putování zemědělskou krajinou [first.GetShortUIName] potkává přátelského selského psa, který vesele vrtí ocasem."
 apa_roaming_grazing_cattle_title: "[first.GetShortUIName|U] spatří stádo krav"
 apa_roaming_grazing_cattle_key_title: "Spokojené krávy"
 apa_roaming_grazing_cattle_key: "Na polích [first.GetShortUIName] pozoruje stádo krav, které se spokojeně pase."
 apa_roaming_lonely_tree_title: "[first.GetShortUIName|U] objevuje na pláni mohutný strom"
 apa_roaming_lonely_tree_key_title: "Osamělý strom"
 apa_roaming_lonely_tree_key: "Uprostřed širých plání [first.GetShortUIName] zahlédne mohutný osamělý strom, jehož větve se vztahují k nebi."
 apa_roaming_rock_outcrop_plains_title: "[first.GetShortUIName|U] objevuje nádherný výhled"
 apa_roaming_rock_outcrop_plains_key_title: "Nádherný výhled"
 apa_roaming_rock_outcrop_plains_key: "Uprostřed širých plání [first.GetShortUIName] objevuje přirozený skalní výchoz, z něhož se otevírá panoramatický výhled na okolní roviny."
 apa_roaming_rock_outcrop_hills_title: "$apa_roaming_rock_outcrop_plains_title$"
 apa_roaming_rock_outcrop_hills_key_title: "$apa_roaming_rock_outcrop_plains_key_title$"
 apa_roaming_rock_outcrop_hills_key: "Při putování kopci [first.GetShortUIName] objevuje skalní výchoz, z něhož se otevírá výhled na zvlněnou krajinu."
 apa_roaming_waterfall_title: "[first.GetShortUIName|U] odpočívá u poklidného vodopádu"
 apa_roaming_waterfall_key_title: "Vodopád"
 apa_roaming_waterfall_key: "V krajině, kterou tvoří [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')], [first.GetShortUIName] objevuje malý vodopád, jehož mírný proud nabízí chvíli klidu."
