l_polish:
 activity_roaming: "Pěší výlet"
 activity_roaming_desc: "Vydejte se na osamělou výpravu do skrytých koutů říše. Toto dobrodružství poskytne přestávku od tlaků dvorní existence a nabídne příležitost odpočinout si mezi pradávnými lesy a mírnými kopci."
 activity_roaming_host_desc: "$BULLET_WITH_TAB$[Concept('opinion_i','@opinion_icon!')|E][Concept('opinion','Mínění')|E]\n$BULLET_WITH_TAB$[Concept('stress_loss_i','@stress_loss_icon!')|E][Concept('stress_loss','Úbytek stresu')|E]\n$BULLET_WITH_TAB$[Concept('prestige_experience_i','$game_concept_prestige_i$')|E][Concept('prestige_experience','Proslulost')|E]\n$BULLET_WITH_TAB$Může získat [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [Concept('trait','rys')|E] nebo [Concept('trait_level_track_xp','zkušenosti rysu')|E]" # todo: CONCEPT CASE
 activity_roaming_guest_desc: ""
 activity_roaming_conclusion_desc: "Cesta poskytla krásnou příležitost na chvíli odložit břemena vlády a užít si úlevu od tlaků, které s ní souvisejí."
 activity_roaming_selection_tooltip: "Vydejte se na cestu a na okamžik odložte břemena vlády.\n\nOčekávané odměny:\n$activity_roaming_host_desc$"
 activity_roaming_destination_selection: "Více odlehlý [Concept('terrain','terén')|E] zvýší [Concept('prestige_experience','proslulost')|E] a [Concept('stress_loss','úbytek stresu')|E] získané z [Concept('activity','aktivity')|E]." # todo: CONCEPT CASE
 honorary_guest_traveling_companion_for_host: "$honorary_guest_traveling_companion$"
 honorary_guest_traveling_companion_desc_for_host: ""
 honorary_guest_traveling_companion: "Cestovní společník"
 activity_roaming_guest_help_text: "[Concept('activity_guest','Host aktivity')|E] bude mít příležitosti snížit své [Concept('stress','stres')|E] a získat [Concept('prestige_experience','proslulost')|E]." # todo: CONCEPT CASE
 phase_roaming: "Putování"
 phase_roaming_desc: ""
 activity_roaming_predicted_cost: "Náklady na [Concept('hike','túru')|E] jsou primárně ovlivněny jeho délkou. Delší výlet nabídne více příležitostí, ale bude také dražší." # todo: CONCEPT CASE
 hike_province_requirement_landless: "[Concept('adventurers','Dobrodruzi')|E] a [Concept('characters','postavy')|E] bez [Concept('domain','domény')|E] mohou [hike_i][Concept('hike','túry')|E] pouze v [Concept('barony','baronství')|E], ve které se nacházejí, nebo v sousední baronii" # todo: CONCEPT CASE
 hike_province_requirement_landed: "Můžete [hike_i][Concept('hike','túra')|E] pouze uvnitř svého [Concept('realm','panství')|E]" # todo: CONCEPT CASE
 roaming_option_travel_length: "Délka cesty"
 roaming_short_length: "Krátká vycházka"
 roaming_short_length_desc: "$EFFECT_LIST_BULLET$ Aktivita bude kratší a nabídne méně příležitostí\n\n#weak Krátký odchod od dvorů a šlechtických záležitostí pročistí moji mysl od všech pochybení.#!"
 roaming_long_length: "Dlouhá vycházka"
 roaming_long_length_desc: "$EFFECT_LIST_BULLET$ Aktivita bude delší a poskytne více příležitostí\n\n#weak Potřebuji dlouhou cestu daleko od všeho, chvilku pouze být sám se sebou.#!"
 roaming_befriend_intent: "Navázat přátelství"
 roaming_befriend_intent_desc: "Hledáte příležitosti zvýšit [Concept('opinion','mínění')|E] se svým cestovním společníkem. Nezapomeňte někoho přivést!" # todo: CONCEPT CASE
 roaming_mystic_intent: "Mystický"
 roaming_mystic_intent_desc: "Přejete si chvíle o samotě se svými myšlenkami. Vyšší šance získat [Concept('trait_level_track_xp','zkušenosti rysu')|E]." # todo: CONCEPT CASE
 roaming_storyteller_intent: "Vypravěč"
 roaming_storyteller_intent_desc: "Hledáte okamžiky, které by vytvořily dobrý a nezapomenutelný příběh! Zvětší získané [Concept('prestige_experience','proslulost')|E] z aktivity." # todo: CONCEPT CASE
 activity_roaming_province_desc: "Cestujete do [ROOT.Province.GetName]"
 activity_roaming_astronomical_phenomenon: "\n#P ++ Astronomický úkaz#!"
 activity_roaming_good_terrain: "\n#P ++ [ROOT.Province.GetTerrain.GetNameNoTooltip]#! ([Concept('terrain','terén')|E])" # todo: CONCEPT CASE
 activity_roaming_ok_terrain: "\n#P + [ROOT.Province.GetTerrain.GetNameNoTooltip]#! ([Concept('terrain','terén')|E])" # todo: CONCEPT CASE
 activity_roaming_empty_holding: "\n#P + Žádná držba#! "
 no_holding_roaming: "[ThisLocation.GetTerrain.GetNameNoTooltip] v [ThisLocation.GetNameNoTooltip]"
 no_holding_roaming_tooltip: "[ThisLocation.GetTerrain.GetNameNoTooltip] v [ThisLocation.GetName]"
 holding_roaming: "[ThisLocation.Custom('GetTerrainTypePlural')] okolo [ThisLocation.GetNameNoTooltip]"
 holding_roaming_tooltip: "[ThisLocation.Custom('GetTerrainTypePlural')] okolo [ThisLocation.GetName]"
 roaming_fame_reward_tt: "[GetPerk('roaming_perk').GetName( GetNullCharacter )] [Concept('perk','Talent')|E]: Získáte #P [fame_value|0]#! [Concept('prestige_experience','proslulost')|E]" # todo: CONCEPT CASE
 roaming_intro_terrain_snippet_forest: "Vzrostlé stromy, sluneční paprsky tančící po mechem porostlé zemi, vzduch provoněný čerstvostí přírody."
 roaming_intro_terrain_snippet_forest_2: "Ptáci zpívají v korunách stromů a zvířata se tiše pohybují v podrostu."
 roaming_intro_terrain_snippet_forest_winter: "Poklidná krajina, kde stromy stojí jako stoické strážce, občas přerušené měkkým skřípěním sněhu."
 roaming_intro_terrain_snippet_forest_winter_2: "Tichá plocha, země jemně přikrytá zimou a stromy ozdobené sněhem."
 roaming_intro_terrain_snippet_forest_monsoon: "Rytmické bubnování deště se line všude kolem nás, těžké kapky padají z koruny stromů."
 roaming_intro_terrain_snippet_mountain: "Zvedám zrak k vysokým horám, jejich vrcholy se zdají sahat až k nebesům."
 roaming_intro_terrain_snippet_mountain_2: "Otevírá se dechberoucí panorama, zvířata i lidé v dálce vypadají téměř nepatrně."
 roaming_intro_terrain_snippet_mountain_winter: "Vrcholky hor jsou zahalené sněhem a vzduch je ostrý a chladný po zimě."
 roaming_intro_terrain_snippet_mountain_monsoon: "Řeky a malé vodopády stékají po svazích hor, přetvářejí údolí do bujných útočišť života."
 roaming_intro_terrain_snippet_hills: "Kopce se před námi rozprostírají jako moře zeleně a hnědi."
 roaming_intro_terrain_snippet_hills_2: "Vidím malé vrcholky kopců, jeden za druhým, každý z nich malý cíl k pokoření v následujících dnech."
 roaming_intro_terrain_snippet_hills_winter: "Kopce zdobí jemný mráz a sníh, táhnou se do dálky."
 roaming_intro_terrain_snippet_hills_winter_2: "Kopce jsou pokryty bílou peřinou chladu. V údolích panuje ticho, přerušované jen občasným měkkým křupnutím sněhu pod nohama."
 roaming_intro_terrain_snippet_hills_monsoon: "Déšť vyhloubí malé potůčky po svazích kopců, pomíjivé, ale krásné."
 roaming_intro_terrain_snippet_plains: "Bezmezný obzor pod rozlehlou oblohou, tráva se vlní jako jemné moře zeleně."
 roaming_intro_terrain_snippet_plains_2: "Nekonečné pláně, občas se v dálce tiše pase nějaké zvíře."
 roaming_intro_terrain_snippet_plains_winter: "Chladné větry a sníh pokrývají krajinu, kam oko dohlédne."
 roaming_intro_terrain_snippet_plains_winter_2: "Tichý klid zimy obklopil zemi, občas přerušený toulavými zvířaty hledajícími potravu."
 roaming_intro_terrain_snippet_plains_monsoon: "Bahnité pláně promočené prudkým deštěm, kam až oko dohlédne."
 roaming_intro_terrain_snippet_farmlands: "Nekonečné řady plodin se táhnou do dálky, rolníci či nevolníci dřou na polích pod sluncem."
 roaming_intro_terrain_snippet_farmlands_2: "Farmáři pečují o svá pole, zatímco zvířata tiše pasou na zelených loukách."
 roaming_intro_terrain_snippet_farmlands_winter: "Prázdná pole jsou přikryta chladem a zimou, není vidět ani rolníka ani zvíře."
 roaming_intro_terrain_snippet_farmlands_winter_2: "Pole pokrytá mrazem a chlad připomínají průběh ročního období."
 roaming_intro_terrain_snippet_farmlands_monsoon: "Pola v intenzivních deštích ožívají, místní zemědělci využívají situaci naplno."
 roaming_intro_terrain_snippet_desert: "Rozsáhlé plochy zlatých písků se táhnou do nekonečna, slunce visí nízko na obloze."
 roaming_intro_terrain_snippet_desert_2: "Zlatý prostor se rozprostírá ve všech směrech, tichý a drsný."
 roaming_intro_terrain_snippet_desert_monsoon: "Písek se na chvíli podvolil silným lijákům a na okamžik se v tomto obvykle pustém prostředí objevuje život."
 roaming_intro_terrain_snippet_desert_mountains: "Surové vrcholky vystupují proti obloze jako tiché strážce této suché krajiny."
 roaming_intro_terrain_snippet_desert_mountains_2: "Skrytá údolí mezi obrovskými horami, malé oázy poskytují úlevu unaveným cestovatelům."
 roaming_intro_terrain_snippet_desert_mountains_monsoon: "Během deště vyřezávají proudy vody nové cesty po horských svazích, na krátko změkčují krajinu."
 roaming_intro_terrain_snippet_oasis: "Palmy se lehce kolébají kolem malé oázy, skupinka zvířat tiše pije z vody."
 roaming_intro_terrain_snippet_oasis_2: "Zeleň obklopuje čistou vodu malé oázy a poskytuje úlevu skupině poutníků."
 roaming_intro_terrain_snippet_oasis_monsoon: "Oáza a její okolí kvete během prudkých dešťů, zeleň sahá daleko za obvyklé hranice oázy."
 roaming_intro_terrain_snippet_wetlands: "Mokřady kam oko dohlédne, malá skupina lidí opatrně využívá drobné vodní cesty při pohybu."
 roaming_intro_terrain_snippet_wetlands_2: "Voda odráží oblohu a rákosí se pomalu kolébá ve větru. Neustálé bzučení hmyzu a blekot zvířat."
 roaming_intro_terrain_snippet_wetlands_monsoon: "Mokřady se proměnily, zvýšená hladina vody je téměř nemožné projít. Když přemýšlím, jak projít, vidím muže pomalu brodit se vodou po pás."
 roaming_intro_second_half_generic: "Konečně mohu všechny ty minulé boje nechat za sebou a soustředit se jen na nalezení chvíle klidu — příležitosti vše odložit stranou a skutečně si odpočinout."
 roaming_intro_second_half_winter: "[Select_CString(ROOT.Char.IsFemale,'Doufala','Doufal')] jsem, že to bude chvíle odpočinku od stresu dvora, ale... je tu chladněji, než jsem čekal."
 roaming_intro_second_half_monsoon: "S monzunem možná nebyl nejlepší čas odložit trápení šlechtického života. Trochu mi teď chybí být uvnitř."
 bp3_roaming.0005.t: "Příjezd"
 bp3_roaming.0005.desc: "Moje družina a já jsme konečně dorazili do [province.GetName]. A jen na okamžik mě uchvátí výhled. [province.Custom('RoamingIntroTerrainSnippet')]\n\n[province.Custom('RoamingIntroSecondHalf')]"
 bp3_roaming.0005.a: "Ach, konečně klid."
 bp3_roaming.0005.b: "Jaký výhled!"
 bp3_roaming.0005.c: "Doufám, že jsem si přibalil dost oblečení..."
 bp3_roaming.0005.d: "Jaké načasování..."
 roaming_start_of_the_journey_key_title: "Začátek cesty"
 roaming_start_of_the_journey_key: "[root_scope.GetShortUIName|U] začíná [Select_CString(root_scope.IsFemale,'její','jeho')] cestu skrz [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')]."
 roaming_outro_snippet_stress_loss_weak: "Tyto kraje utišily mou unavenou mysl, byť jen nenápadně. Jemná úleva od životního zmatku."
 roaming_outro_snippet_stress_loss_weak_2: "V tomto útočišti jsem [Select_CString(ROOT.Char.IsFemale,'našla','našel')] chvíle útěchy, které lehce odlehčily mou duši."
 roaming_outro_snippet_stress_loss_weak_3: "Toto místo nabídlo krátký únik od mých povinností. Byla to skromná útěcha, ale přesto útěcha."
 roaming_outro_snippet_stress_loss_medium: "Cítím, jako by mi spadl kámen ze srdce."
 roaming_outro_snippet_stress_loss_medium_2: "Zde, v objetí přírody a daleko od lidí, se mé starosti zdály méně hrozivé."
 roaming_outro_snippet_stress_loss_medium_3: "Pociťuji, že mě obklopil klid a mé běžné starosti jsou nyní jen stínem své bývalé velikosti. Alespoň zatím."
 roaming_outro_snippet_stress_loss_strong: "Cítím se omlazený, jako bych svlékl těžký plášť starostí a obav."
 roaming_outro_snippet_stress_loss_strong_2: "Opouštím tyto kraje s hlubokým pocitem osvěžení, mysl jasná a srdce lehčí."
 roaming_outro_snippet_stress_loss_strong_3: "Stres, který se kdysi zdál zdrcující, se nyní zdá být vzdálený, jako tmavé mraky rozptýlené sluncem."
 roaming_outro_snippet_stress_loss_very_strong: "Opuštěn v divočině jsem [Select_CString(ROOT.Char.IsFemale,'nalezla','nalezl')] jasnost a hlubší pochopení své cesty."
 roaming_outro_snippet_stress_loss_very_strong_2: "Stres se rozplynul a mám pocit, že jsem [Select_CString(ROOT.Char.IsFemale,'našla','našel')] nový smysl života."
 roaming_outro_snippet_stress_loss_very_strong_3: "V tomto tichém místě jsem [Select_CString(ROOT.Char.IsFemale,'dokázala','dokázal')] odložit všechny své starosti a vrátit se omlazený a změněný [ROOT.Char.GetWomanMan]."
 roaming_outro_snippet_returning_home: "Otočím se, s tichým povzdechem, a začínám návrat."
 roaming_outro_snippet_returning_home_2: "Nerad se otáčím, odkládám vzpomínky stranou a vydávám se domů k povinnostem, které mě jistě čekají."
 roaming_outro_snippet_returning_home_3: "Zhluboka se nadechnu, vychutnávám si poslední okamžiky v tomto útočišti, než se vydám na cestu domů."
 roaming_outro_snippet_returning_home_4: "S klidnějším srdcem než už dlouho se konečně rozloučím s tímto místem — je čas vyrazit domů."
 bp3_roaming.0010.t: "Návrat domů"
 bp3_roaming.0010.desc: "S posledním krokem konečně opouštím [province.Custom('HoldingNoHoldingTerrainRoaming')]. Ohlédnu se naposled a vzpomínám na svou cestu přes [province.GetTerrain.GetNameNoTooltip|l]. [ROOT.Char.Custom('RoamingOutroStressLoss')]\n\n[ROOT.Char.Custom('RoamingOutroReturningHome')]"
 bp3_roaming.0010.a: "Ach, takový je život..."
 roaming_end_of_the_journey_key_title: "Konec cesty"
 roaming_end_of_the_journey_key: "[host.GetShortUIName|U] ukončuje [Select_CString(host.IsFemale,'její','jeho')] cestu skrz [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')]."
 bp3_roaming.0050.t: "Dechberoucí výhled"
 bp3_roaming.0050.desc: "Pokračujeme po svahu pomalu, krok za krokem. [Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] to dlouhý den a cítím, jak mi hoří stehna. Snažím se soustředit jen na to dát jednu nohu před druhou, když mi jeden ze stráží pomůže s posledními kroky.\n\nNáhle se ocitneme na výčnělku a já spatřím údolí rozprostírající se pod námi, tapisérii zeleně a hnědi. Zcela jsem přehlédl, jak vysoko jsme se dostali kvůli vyčerpání a námaze, ale teď... Teď to všechno stojí za to."
 bp3_roaming.0050.a: "To je úleva pro unavené oči i nohy."
 breathtaking_view_key_title: "$bp3_roaming.0050.t$"
 breathtaking_view_key: "[host.GetShortUIName] [Select_CString(host.IsFemale,'dorazila','dorazil')] na vrchol [province.GetName], odkud se naskytl krásný výhled, a [Select_CString(province.IsFemale,'rozhodla','rozhodl')] se, že je čas začít se vracet domů."
 bp3_roaming.0060.t: "Malá oáza"
 bp3_roaming.0060.desc: "Po hodinách chůze zlatou pustinou začínáme v dálce vidět náznaky oázy. Nejdříve se obávám, že to může být fatamorgána, ale jak se přibližujeme, vidíme kolem ní pasoucí se zvířata.\n\nNajdu si malé místo ve stínu, kde si já i moji stráže můžeme odpočinout. Je to dokonalé místo k krátkému odpočinku před tím, než začneme hledat cestu domů."
 bp3_roaming.0060.a: "Jaké krásné malé místo tady v divočině."
 the_oasis_key_title: "$bp3_roaming.0060.t$"
 the_oasis_key: "[host.GetShortUIName] [Select_CString(host.IsFemale,'narazila','narazil')] na tichou malou oázu v [province.GetName], kde se [Select_CString(host.IsFemale,'odpočinula','odpočinul')], než [Select_CString(province.IsFemale,'začala','začal')] hledat cestu domů."
 bp3_roaming.0070.t: "Konec stezky"
 bp3_roaming.0070.desc.intro: "Hodiny jsme šli starou stezkou lesem, která postupně mizí, až zcela zmizí. Když se rozhlédnu, ocitnu se na malé mýtině a není tu nic. Jen... ticho divočiny.\n\n"
 bp3_roaming.0070.desc.landless: "Na život v divočině nejsem nezvyklý, a přesto to teď působí, jako bychom přešli hranici mezi lidským světem a neznámým. Je čas nechat tuto mýtinu za sebou a vrátit se do tábora. Zajímalo by mě, jestli ji někdy znovu uvidím."
 bp3_roaming.0070.desc.landed: "Být tady už samo o sobě připadalo vzdálené od mého života v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], a přesto teď vypadá, že jsme překročili hranici mezi lidským světem a neznámem. Je čas nechat tuto mýtinu za sebou a vydat se domů. Zajímalo by mě, jestli ji ještě někdy spatřím."
 bp3_roaming.0070.a: "Jaké zvláštní místo."
 paths_end_key_title: "$bp3_roaming.0070.t$"
 paths_end_key: "[host.GetShortUIName] [Select_CString(host.IsFemale,'narazila','narazil')] na zvědavou malou lesní mýtinu v divočině [province.GetName], kde si chvíli [Select_CString(host.IsFemale,'odpočinula','odpočinul')], než se [Select_CString(province.IsFemale,'vydala','vydal')] domů."
 bp3_roaming.0080.t: "Vůně oceánu"
 bp3_roaming.0080.desc: "Dlouho předtím, než ho uvidíme, slyšíme křik racek letících nad námi a vnímejme slaný zápach ve vzduchu. Pak se to před námi otevírá, rozlehlé moře modři se táhne, kam oko dohlédne. Sedíme u vody a díváme se, jak vlny jemně přicházejí.\n\nNa chvíli mám pocit, že všechny mé starosti lze odložit. Chvíle, kdy si mohu prostě užít tento okamžik. Vím, že se brzy budu muset vrátit domů, ale teď jsem tady."
 bp3_roaming.0080.a: "Jak tichý život."
 ocean_scent_key_title: "$bp3_roaming.0080.t$"
 ocean_scent_key: "[host.GetShortUIName] [Select_CString(host.IsFemale,'vedla','vedl')] svou skupinu na pobřeží v [province.GetName], kde si odpočinuli, než začali dlouhou cestu domů."
 bp3_roaming.0090.t: "Řeka na konci cesty"
 bp3_roaming.0090.desc: "Den se chýlí ke konci, když konečně dorazíme k malé řece bez mostu. Dívám se, co nejlépe mohu, ale na druhé straně nic není k vidění. V jistém smyslu to působí jako hranice mezi posledními zbytky civilizace a neznámou divočinou na druhé straně.\n\nPosadím se na chvíli a odpočinu si nohy. Občas mám pocit, že na druhé straně vody něco pohybuje, nebo že mě někdo sleduje, ale nemohu nic rozeznat."
 bp3_roaming.0090.a: "Myslím, že dobré místo k zastavení."
 river_journeys_end_key_title: "$bp3_roaming.0090.t$"
 river_journeys_end_key: "[host.GetShortUIName] [Select_CString(host.IsFemale,'narazila','narazil')] na neprostupnou řeku v hvozdě [province.GetName], kde si [Select_CString(host.IsFemale,'odpočinula','odpočinul')], než se [Select_CString(province.IsFemale,'vydala','vydal')] na cestu domů."
 bp3_roaming.0100.t: "Setkání s cizincem"
 bp3_roaming.0100.desc: "Když bloumeji [activity.GetCurrentPhase.GetLocation.Custom('GetTerrainType')], narazím na starého [ancient_traveler.GetWomanMan] sedícího na ošoupaném kameni na kraji cesty. Chvíli panuje ticho, zatímco [ancient_traveler.GetWomanMan] vypadá hluboce zabořený v myšlenkách, než mě konečně zaznamená.\n\nDá mi malé přikývnutí, pomalu vstane, každý pohyb provázený skřípěním kostí, a vydá se do neznáma."
 bp3_roaming.0100.desc.companion: "\n\n[special_guest.GetFirstName] si sedne na starý kámen, vydechne si úlevně, více zajímán odpočinkem než zapojením se do rozhovoru s [ancient_traveler.GetWomanMan]."
 bp3_roaming.0100.a: "No, o čem že [ancient_traveler.GetSheHe] tady v divočině přemýšlel?"
 bp3_roaming.0100.a.flavor: "Zdá se to být skvělé místo k přemýšlení, nakonec."
 bp3_roaming.0100.b: "Konečně šance si sednout a odpočinout."
 bp3_roaming.0100.c: "Počkej, starý [ancient_traveler.GetWomanMan]!"
 bp3_roaming.0100.c.flavor: "Možná má [ancient_traveler.GetSheHe] nějakou moudrost, o kterou by se [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] podělit?"
 bp3_roaming.0100.c.win: "Mám plodný rozhovor s [ancient_traveler.GetNameNoTooltip]"
 bp3_roaming.0100.c.neutral: "Přesvědčím [ancient_traveler.GetNameNoTooltip], aby se [Select_CString(ancient_traveler.IsFemale,'přidala','přidal')] k mému dvoru"
 bp3_roaming.0100.c.loss: "[ancient_traveler.GetNameNoTooltip] nemá zájem o rozhovor"
 bp3_roaming.0100.d: "„A když jsem na vteřinu odvrátil zrak, prostě [Select_CString(ancient_traveler.IsFemale,'zmizela','zmizel')]...“"
 roaming_pondering_stone_mystic_key_title: "Zjevení"
 roaming_pondering_stone_mystic_key: "[host.GetShortUIName] [Select_CString(host.IsFemale,'měla','měl')] několik zjevení, když [Select_CString(host.IsFemale,'seděla','seděl')] v [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')]."
