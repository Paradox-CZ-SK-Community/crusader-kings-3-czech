l_polish:
 activity_roaming: "Túra"
 activity_roaming_desc: "Vydej se na osamělou výpravu do skrytých koutů svého panství. Toto dobrodružství ti umožní na chvíli uniknout tlaku dvorského života, odpočinout si mezi prastarými lesy a mírnými kopci a nechat starosti za sebou."
 activity_roaming_host_desc: "$BULLET_WITH_TAB$[opinion_i|E][Concept('opinion','Mínění')|E]\n$BULLET_WITH_TAB$[stress_loss_i|E][Concept('stress_loss','Úbytek stresu')|E]\n$BULLET_WITH_TAB$[prestige_experience_i|E][Concept('prestige_experience','Proslulost')|E]\n$BULLET_WITH_TAB$Můžeš získat [Concept('trait','rys')|E] [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] nebo [Concept('trait_level_track_xp','zkušenosti rysu')|E]"
 activity_roaming_guest_desc: ""
 activity_roaming_conclusion_desc: "Túra ti poskytla vítanou příležitost na chvíli odložit břemeno vlády a uniknout tlaku, který s sebou přináší."
 activity_roaming_selection_tooltip: "Vydej se na túru a na chvíli odlož břemeno vlády.\n\nPředpokládané odměny:\n$activity_roaming_host_desc$"
 activity_roaming_destination_selection: "Čím odlehlejší [Concept('terrain','terén')|E] zvolíš, tím více [Concept('prestige_experience','proslulosti')|E] získáš a tím větší bude [Concept('stress_loss','úbytek stresu')|E] z [Concept('activity','aktivity')|E]."
 honorary_guest_traveling_companion_for_host: "$honorary_guest_traveling_companion$"
 honorary_guest_traveling_companion_desc_for_host: ""
 honorary_guest_traveling_companion: "Společník na cestách"
 activity_roaming_guest_help_text: "[Concept('activity_guest','Host aktivity')|E] bude mít příležitosti snížit svůj [Concept('stress','stres')|E] a získat [Concept('prestige_experience','proslulost')|E]."
 phase_roaming: "Putování"
 phase_roaming_desc: ""
 activity_roaming_predicted_cost: "Cenu [Concept('hike','túry')|E] ovlivňuje především její délka. Delší túra nabídne více příležitostí, ale také bude dražší."
 hike_province_requirement_landless: "[Concept('adventurers','Dobrodruzi')|E] a [Concept('characters','postavy')|E] bez [Concept('domain','domény')|E] mohou podniknout [hike_i][Concept('hike','túru')|E] pouze v [Concept('barony','baronství')|E], v němž se právě nacházejí, nebo v sousedním baronství"
 hike_province_requirement_landed: "[hike_i][Concept('hike','Túru')|E] můžeš podniknout pouze uvnitř svého [Concept('realm','panství')|E]"
 roaming_option_travel_length: "Délka túry"
 roaming_short_length: "Krátká túra"
 roaming_short_length_desc: "$EFFECT_LIST_BULLET$ [Concept('activity','Aktivita')|E] bude kratší a nabídne méně příležitostí\n\n#weak Krátká cesta daleko od dvora a šlechty mi pomůže vyčistit si hlavu od všech pochybností.#!"
 roaming_long_length: "Dlouhá túra"
 roaming_long_length_desc: "$EFFECT_LIST_BULLET$ [Concept('activity','Aktivita')|E] bude delší a nabídne více příležitostí\n\n#weak Potřebuji na delší dobu uniknout od všeho a dopřát si chvíli jen pro sebe.#!"
 roaming_befriend_intent: "Spřátelení"
 roaming_befriend_intent_desc: "Vyhledáváš příležitosti, jak si zlepšit [Concept('opinion','mínění')|E] u svého Společníka na cestách. Nezapomeň někoho vzít s sebou!"
 roaming_mystic_intent: "Mystik"
 roaming_mystic_intent_desc: "Toužíš po chvílích, kdy můžeš zůstat o samotě se svými myšlenkami. Máš vyšší šanci získat [Concept('trait_level_track_xp','zkušenosti rysu')|E]."
 roaming_storyteller_intent: "Vypravěč"
 roaming_storyteller_intent_desc: "Vyhledáváš okamžiky, z nichž by mohl vzniknout dobrý a nezapomenutelný příběh! Zvýší se množství [Concept('prestige_experience','proslulosti')|E] získané z aktivity."
 activity_roaming_province_desc: "Cílem tvé cesty je [ROOT.Province.GetName]"
 activity_roaming_astronomical_phenomenon: "\n#P ++ Astronomický jev#!"
 activity_roaming_good_terrain: "\n#P ++ [ROOT.Province.GetTerrain.GetNameNoTooltip]#! ([Concept('terrain','terén')|E])"
 activity_roaming_ok_terrain: "\n#P + [ROOT.Province.GetTerrain.GetNameNoTooltip]#! ([Concept('terrain','terén')|E])"
 activity_roaming_empty_holding: "\n#P + Bez državy#! "
 no_holding_roaming: "[ThisLocation.GetNameNoTooltip]: [ThisLocation.GetTerrain.GetNameNoTooltip]"
 no_holding_roaming_tooltip: "[ThisLocation.GetName]: [ThisLocation.GetTerrain.GetNameNoTooltip]"
 holding_roaming: "[ThisLocation.GetNameNoTooltip]: okolní [ThisLocation.Custom('GetTerrainTypePlural')]"
 holding_roaming_tooltip: "[ThisLocation.GetName]: okolní [ThisLocation.Custom('GetTerrainTypePlural')]"
 roaming_fame_reward_tt: "[GetPerk('roaming_perk').GetName( GetNullCharacter )] [Concept('perk','talent')|E]: Získáš #P [fame_value|0]#! [Concept('prestige_experience','proslulosti')|E]"
 roaming_intro_terrain_snippet_forest: "Vysoké stromy, sluneční paprsky tančící po mechem porostlé zemi a svěží vůně přírody, která prostupuje vzduchem."
 roaming_intro_terrain_snippet_forest_2: "Z korun vysokých stromů se ozývá ptačí zpěv a v podrostu se prohánějí zvířata."
 roaming_intro_terrain_snippet_forest_winter: "Poklidná krajina, kde stromy stojí jako mlčenliví strážci a ticho jen občas přeruší měkké křupnutí sněhu."
 roaming_intro_terrain_snippet_forest_winter_2: "Tichá krajina, jejíž zem pokrývá jemná zimní přikrývka a větve stromů zdobí sníh."
 roaming_intro_terrain_snippet_forest_monsoon: "Všude kolem se ozývá pravidelné bubnování deště a z korun stromů padají těžké kapky."
 roaming_intro_terrain_snippet_mountain: "Vzhlédnu k mohutným horám, které nás obklopují. Jejich vysoké vrcholky jako by sahaly až k nebesům."
 roaming_intro_terrain_snippet_mountain_2: "Přede mnou se otevírá dechberoucí výhled. Zvířata i lidé v dálce vypadají tak nepatrně, že je sotva rozeznám."
 roaming_intro_terrain_snippet_mountain_winter: "Horské vrcholky halí sněhová přikrývka a vzduch je pronikavě ostrý a zimně chladný."
 roaming_intro_terrain_snippet_mountain_monsoon: "Po horských svazích se valí řeky a drobné vodopády, které mění údolí pod nimi v bujné oázy života."
 roaming_intro_terrain_snippet_hills: "Přede mnou se jako zelenohnědé moře táhnou zvlněné kopce."
 roaming_intro_terrain_snippet_hills_2: "Vidím jeden nízký vrcholek za druhým. Každý z nich je malou výzvou, kterou bude třeba v příštích dnech zdolat."
 roaming_intro_terrain_snippet_hills_winter: "Kopce pokryté jemnou jinovatkou a sněhem se táhnou daleko do kraje."
 roaming_intro_terrain_snippet_hills_winter_2: "Chlad zahalil kopce do bílé přikrývky. V údolích vládne ticho, které jen občas naruší měkké křupnutí sněhu pod mýma nohama."
 roaming_intro_terrain_snippet_hills_monsoon: "Déšť vyrývá do svahů drobné stružky vody. Brzy zmizí, ale teď je na ně nádherný pohled."
 roaming_intro_terrain_snippet_plains: "Pod širým nebem se táhne nekonečný obzor a vlnící se tráva vytváří klidné zelené moře."
 roaming_intro_terrain_snippet_plains_2: "Nekonečné pláně, na nichž se v dálce tu a tam pokojně pase nějaké zvíře."
 roaming_intro_terrain_snippet_plains_winter: "Ostrý vítr a sníh pokrývají krajinu, kam až oko dohlédne."
 roaming_intro_terrain_snippet_plains_winter_2: "Krajinu sevřelo tiché zimní bezvětří, které jen občas naruší zvíře bloudící krajem při hledání potravy."
 roaming_intro_terrain_snippet_plains_monsoon: "Kam až oko dohlédne, táhnou se bahnité pláně promáčené prudkým deštěm."
 roaming_intro_terrain_snippet_farmlands: "Nekonečné řady plodin se táhnou až k obzoru a mezi nimi se na slunci lopotí rolníci a nevolníci."
 roaming_intro_terrain_snippet_farmlands_2: "Rolníci pečují o svá pole, zatímco se zvířata pokojně pasou na zelených loukách."
 roaming_intro_terrain_snippet_farmlands_winter: "Prázdná pole sevřel chlad a zima. Nikde není vidět jediného rolníka ani zvíře."
 roaming_intro_terrain_snippet_farmlands_winter_2: "Prázdná pole pokrývá jinovatka a pronikavý chlad připomíná, jaké je roční období."
 roaming_intro_terrain_snippet_farmlands_monsoon: "Za prudkých dešťů pole překypují životem a místní rolníci se snaží z nastalých podmínek vytěžit co nejvíce."
 roaming_intro_terrain_snippet_desert: "Přede mnou se do nekonečna rozprostírá moře zlatého písku a slunce visí nízko nad obzorem."
 roaming_intro_terrain_snippet_desert_2: "Zlatavá pustina se táhne všemi směry, kam až oko dohlédne. Tichá, nehostinná a nemilosrdná."
 roaming_intro_terrain_snippet_desert_monsoon: "Písek na krátký čas podlehl prudkým dešťům a v jinak nehostinné krajině se na okamžik probouzí život."
 roaming_intro_terrain_snippet_desert_mountains: "Proti obloze se tyčí rozeklané vrcholky jako mlčenliví strážci této vyprahlé země."
 roaming_intro_terrain_snippet_desert_mountains_2: "Mezi mohutnými horami se skrývají údolí s drobnými oázami, které unaveným poutníkům nabízejí chvíli oddechu."
 roaming_intro_terrain_snippet_desert_mountains_monsoon: "Během dešťů si voda razí nové cesty horskými svahy a na krátký okamžik zjemňuje tvář této drsné krajiny."
 roaming_intro_terrain_snippet_oasis: "Kolem malé oázy se ve větru zlehka kývají palmy a u vody tiše pije skupinka zvířat."
 roaming_intro_terrain_snippet_oasis_2: "Průzračnou vodu malé oázy obklopuje zeleň a skupině poutníků poskytuje vítaný odpočinek."
 roaming_intro_terrain_snippet_oasis_monsoon: "Oáza i její okolí pod prudkými dešti bují životem a zeleň se rozrůstá daleko za své obvyklé hranice."
 roaming_intro_terrain_snippet_wetlands: "Kam až oko dohlédne, táhnou se mokřady. Několik lidí se krajinou opatrně pohybuje po úzkých vodních cestách."
 roaming_intro_terrain_snippet_wetlands_2: "Na hladině se zrcadlí obloha a rákosí se pomalu pohupuje ve větru. Všude kolem zní neutuchající bzukot hmyzu a hlasy zvířat."
 roaming_intro_terrain_snippet_wetlands_monsoon: "Mokřady se proměnily k nepoznání. Hladina vystoupala tak vysoko, že krajinou téměř nelze projít. Zatímco přemýšlím, kudy dál, zahlédnu člověka, který se pomalu brodí vodou sahající až k hrudi."
 roaming_intro_second_half_generic: "Konečně mohu všechny dosavadní starosti nechat za sebou a soustředit se jen na odpočinek... na chvíli všechno pustit z hlavy a doopravdy si vydechnout."
 roaming_intro_second_half_winter: "Doufal jsem, že si tu odpočinu od dvorského shonu, ale... zima je mnohem větší, než jsem čekal."
 roaming_intro_second_half_monsoon: "S monzunem v plné síle možná nebyla nejlepší chvíle odložit strasti šlechtického života. Teď mi docela chybí střecha nad hlavou."
 bp3_roaming.0005.t: "Příjezd"
 bp3_roaming.0005.desc: "Má družina a já jsme konečně dorazili do [province.GetName]. Na okamžik mě zdejší pohled zcela pohltí. [province.Custom('RoamingIntroTerrainSnippet')]\n\n[province.Custom('RoamingIntroSecondHalf')]"
 bp3_roaming.0005.a: "Ach, konečně klid."
 bp3_roaming.0005.b: "To je nádherný výhled!"
 bp3_roaming.0005.c: "Snad jsem si vzal dost oblečení..."
 bp3_roaming.0005.d: "To jsem si opravdu vybral chvíli..."
 roaming_start_of_the_journey_key_title: "Začátek cesty"
 roaming_start_of_the_journey_key: "[root_scope.GetShortUIName|U] vyráží na cestu krajinou [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')]."
 roaming_outro_snippet_stress_loss_weak: "Tyto kraje mou unavenou mysl přece jen trochu uklidnily. Krátký, tichý oddech od všeho životního shonu."
 roaming_outro_snippet_stress_loss_weak_2: "Toto útočiště mi dopřálo několik chvil klidu a alespoň trochu mi ulehčilo na duši."
 roaming_outro_snippet_stress_loss_weak_3: "Tohle místo mi na chvíli dovolilo uniknout povinnostem. Byla to jen malá útěcha, ale i ta se počítá."
 roaming_outro_snippet_stress_loss_medium: "Jako by mi z ramen spadla tíha."
 roaming_outro_snippet_stress_loss_medium_2: "Tady, v objetí přírody a daleko od lidí, mi mé starosti připadaly méně tíživé."
 roaming_outro_snippet_stress_loss_medium_3: "Zmocnil se mě klid a mé každodenní starosti jsou najednou jen stínem toho, čím bývaly. Alespoň prozatím."
 roaming_outro_snippet_stress_loss_strong: "Jako by ze mě spadl těžký plášť starostí a obav. Znovu se mi vracejí síly."
 roaming_outro_snippet_stress_loss_strong_2: "Odtud odcházím s novými silami, jasnou myslí a lehčím srdcem."
 roaming_outro_snippet_stress_loss_strong_3: "Stres, který mě dříve drtil, je teď vzdálený jako temná mračna rozehnaná sluncem."
 roaming_outro_snippet_stress_loss_very_strong: "Samota v divočině mi přinesla jasnější mysl a hlubší pochopení cesty, po níž kráčím."
 roaming_outro_snippet_stress_loss_very_strong_2: "Napětí se rozplynulo a život mi jako by znovu dával smysl."
 roaming_outro_snippet_stress_loss_very_strong_3: "V tomto poklidném místě se mi podařilo odsunout všechny starosti stranou a domů se vracím s novými silami a změněným pohledem na život."
 roaming_outro_snippet_returning_home: "Otáčím se a s tichým povzdechem se vydávám na cestu zpět."
 roaming_outro_snippet_returning_home_2: "Jen neochotně se obracím, odkládám vzpomínky stranou a vyrážím domů k povinnostem, které na mě nepochybně čekají."
 roaming_outro_snippet_returning_home_3: "Zhluboka se nadechuji a vychutnávám poslední chvíle v tomto útočišti, než se vydám na cestu domů."
 roaming_outro_snippet_returning_home_4: "S klidnějším srdcem než už dlouho se s tímto místem konečně loučím. Je čas vrátit se domů."
 bp3_roaming.0010.t: "Návrat domů"
 bp3_roaming.0010.desc: "Posledním krokem konečně opouštím [province.Custom('HoldingNoHoldingTerrainRoaming')]. Ještě jednou se ohlížím a vzpomínám na svou cestu zdejší krajinou, kterou tvoří [province.GetTerrain.GetNameNoTooltip|l]. [ROOT.Char.Custom('RoamingOutroStressLoss')]\n\n[ROOT.Char.Custom('RoamingOutroReturningHome')]"
 bp3_roaming.0010.a: "Takový už je život..."
 roaming_end_of_the_journey_key_title: "Konec cesty"
 roaming_end_of_the_journey_key: "[host.GetShortUIName|U] [Select_CString(host.IsFemale, 'ukončila', 'ukončil')] svou cestu krajinou, kterou tvoří [activity.GetCurrentPhase.GetLocation.Custom('HoldingNoHoldingTerrainRoaming')]."
 bp3_roaming.0050.t: "Dechberoucí výhled"
 bp3_roaming.0050.desc: "Pokračujeme pomalu vzhůru po svahu, krok za krokem. Je za námi dlouhý den a stehna mě pálí námahou. Už myslím jen na další krok, když mi jeden ze strážných pomůže překonat posledních pár metrů.\n\nNajednou se ocitáme na skalní římse a pod námi se rozprostírá údolí, zelenohnědá mozaika krajiny. Vyčerpání a námaha mi vůbec nedovolily vnímat, jak vysoko jsme vystoupali, ale teď... Teď to všechno stálo za to."
 bp3_roaming.0050.a: "Tohle je balzám pro oči i bolavé nohy."
 breathtaking_view_key_title: "$bp3_roaming.0050.t$"
 breathtaking_view_key: "[host.GetShortUIName] [Select_CString(host.IsFemale, 'dorazila', 'dorazil')] na nejvyšší místo v kraji zvaném [province.GetName], odkud se otevřel nádherný výhled, a [Select_CString(host.IsFemale, 'rozhodla se', 'rozhodl se')] vydat domů."
 bp3_roaming.0060.t: "Malá oáza"
 bp3_roaming.0060.desc: "Po hodinách chůze zlatavou pustinou se v dálce začínají rýsovat známky oázy. Nejdřív se bojím, že jde jen o přelud, ale jak se přibližujeme, rozeznáváme kolem ní pasoucí se zvířata.\n\nNacházím malé místo ve stínu, kde si se strážnými konečně můžeme ulevit nohám. Místo k odpočinku, alespoň prozatím. Dokonalá zastávka, než začneme hledat cestu domů."
 bp3_roaming.0060.a: "Jak krásné místečko uprostřed divočiny."
 the_oasis_key_title: "$bp3_roaming.0060.t$"
 the_oasis_key: "[host.GetShortUIName] [Select_CString(host.IsFemale, 'narazila', 'narazil')] na tichou oázu v kraji zvaném [province.GetName] a [Select_CString(host.IsFemale, 'odpočinula', 'odpočinul')] si tam, než začalo hledání cesty domů."
 bp3_roaming.0070.t: "Konec stezky"
 bp3_roaming.0070.desc.intro: "Už celé hodiny se držíme staré stezky v lese, která postupně slábne, až se nakonec úplně vytratí. Rozhlížím se kolem a zjišťuji, že stojím na malé mýtině. Není tu nic. Jen... ticho divočiny.\n\n"
 bp3_roaming.0070.desc.landless: "Život v divočině mi není cizí, a přece to tady působí, jako bychom překročili hranici mezi světem lidí a neznámem. Je čas opustit tuhle malou mýtinu a vrátit se do tábora. Zajímalo by mě, jestli ji ještě někdy uvidím."
 bp3_roaming.0070.desc.landed: "Už samotný pobyt tady působí na hony vzdáleně od mého života doma, v místě zvaném [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], ale přesto mám pocit, jako bychom teď překročili hranici mezi světem lidí a neznámem. Je čas opustit tuhle malou mýtinu a vydat se domů. Zajímalo by mě, jestli ji ještě někdy uvidím."
 bp3_roaming.0070.a: "Jak zvláštní místo."
 paths_end_key_title: "*$bp3_roaming.0070.t$*"
 paths_end_key: "[host.GetShortUIName] [Select_CString(host.IsFemale, 'narazila', 'narazil')] v divočině kraje zvaného [province.GetName] na podivuhodnou malou lesní mýtinu, kde si [Select_CString(host.IsFemale, 'na chvíli odpočinula', 'na chvíli odpočinul')], než se [Select_CString(host.IsFemale, 'vydala', 'vydal')] domů."
 bp3_roaming.0080.t: "Vůně oceánu"
 bp3_roaming.0080.desc: "Dlouho předtím, než ho spatříme, slyšíme křik racků kroužících nad hlavami a ve vzduchu cítíme slanou vůni. Pak se před námi otevře nedozírná modrá hladina táhnoucí se až k obzoru. Usedáme u vody a pozorujeme vlny, jak se pozvolna převalují ke břehu.\n\nNa okamžik mám pocit, že mohu všechny své starosti odložit stranou. Prostě jen sedět a vychutnat si tuto chvíli. Vím, že se brzy budu muset vrátit domů, ale teď jsem tady."
 bp3_roaming.0080.a: "Jak poklidný život."
 ocean_scent_key_title: "*$bp3_roaming.0080.t$*"
 ocean_scent_key: "[host.GetShortUIName] [Select_CString(host.IsFemale, 'dovedla', 'dovedl')] svou družinu k pobřeží kraje zvaného [province.GetName], kde si všichni odpočinuli před dlouhou cestou domů."
 bp3_roaming.0090.t: "Řeka na konci cesty"
 bp3_roaming.0090.desc: "Den se už chýlí ke konci, když konečně dorážíme k malé řece, přes kterou není v dohledu žádný most. Rozhlížím se, jak nejlépe dokážu, ale na druhém břehu není nic vidět. Svým způsobem působí jako hranice mezi posledními zbytky civilizace a neznámou divočinou na druhé straně.\n\nNa chvíli usedám a nechávám odpočinout nohy. Občas mám pocit, že na druhém břehu zahlédnu nějaký pohyb nebo že mě někdo pozoruje, ale nic nedokážu rozeznat."
 bp3_roaming.0090.a: "Tady bude dobré se zastavit."
 river_journeys_end_key_title: "*$bp3_roaming.0090.t$*"
 river_journeys_end_key: "[host.GetShortUIName] [Select_CString(host.IsFemale, 'narazila', 'narazil')] v odlehlém kraji zvaném [province.GetName] na neprůchodnou řeku, u níž se [Select_CString(host.IsFemale, 'zastavila', 'zastavil')] a odpočinul[Select_CString(host.IsFemale, 'a', '')] si před cestou domů."
 bp3_roaming.0100.t: "Setkání s neznámým"
 bp3_roaming.0100.desc: "Při putování krajinou, kterou tvoří [activity.GetCurrentPhase.GetLocation.Custom('GetTerrainType')], narážím u kraje cesty na zvětralý kámen, na němž sedí [Select_CString(ancient_traveler.IsFemale, 'letitá stařena', 'letitý stařec')]. Několik okamžiků uběhne v tichosti. [Select_CString(ancient_traveler.IsFemale, 'Stařena působí', 'Stařec působí')] zcela ponořen[Select_CString(ancient_traveler.IsFemale, 'á', '')] do vlastních myšlenek, než si mé přítomnosti konečně všimne.\n\nLehce mi kývne, pomalu vstane, každý pohyb doprovázený vrzáním starých kostí, a vydá se vstříc neznámu."
 bp3_roaming.0100.desc.companion: "\n\n[special_guest.GetFirstName] usedá na starý kámen a s tichým povzdechem úlevy dává najevo, že odpočinek je pro [Select_CString(special_guest.IsFemale, 'ni', 'něj')] zajímavější než rozhovor s [Select_CString(ancient_traveler.IsFemale, 'tou stařenou', 'tím starcem')]."
 bp3_roaming.0100.a: "O čem asi [Select_CString(ancient_traveler.IsFemale, 'ta stařena', 'ten stařec')] tady v divočině přemýšlel[Select_CString(ancient_traveler.IsFemale, 'a', '')]?"
 bp3_roaming.0100.a.flavor: "K přemýšlení je to ostatně nádherné místo."
 bp3_roaming.0100.b: "Konečně příležitost si sednout a odpočinout."
 bp3_roaming.0100.c: "Počkej, [Select_CString(ancient_traveler.IsFemale, 'stařenko', 'starče')]!"
 bp3_roaming.0100.c.flavor: "Třeba se ode [Select_CString(ancient_traveler.IsFemale, 'ní', 'něj')] dozvím něco moudrého?"
 bp3_roaming.0100.c.win: "Rozhovor s [ancient_traveler.GetNameNoTooltip] mi přinese mnoho podnětného"
 bp3_roaming.0100.c.neutral: "Přesvědčím [ancient_traveler.GetNameNoTooltip], aby se přidal[Select_CString(ancient_traveler.IsFemale, 'a', '')] k mému dvoru"
 bp3_roaming.0100.c.loss: "[ancient_traveler.GetNameNoTooltip] nemá o rozhovor zájem"
 bp3_roaming.0100.d: "„A když na okamžik odvrátím zrak, [ancient_traveler.GetFirstName] prostě zmizí...“"
