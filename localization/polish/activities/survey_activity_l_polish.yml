 inspection_protected_holy_poi_gold_modifier_desc: "Zdejší svaté místo dostalo vlastní posádku, která chrání je i množství poutníků.\n*$protected_poi_modifier_desc$* *$protected_holy_site_modifier_desc$*"
 bp3_survey.1090.t: "Odlehlé končiny"
 bp3_survey.1090.desc: "„Tak vy tu hledáte pytláky, co?“ zavolá na nás [Select_CString(hunter_character.IsFemale, 'otrhaně vyhlížející lovkyně', 'otrhaně vyhlížející lovec')], když při jedné z mých obhlídek v [province.GetName] dorazíme k malému táboru. „Najde se jich tu dost, i když tohle vlastně ani není panovnická půda. [poaching_province.GetName]? Tady se každý stará sám o sebe.“\n\n„Jestli chcete dát najevo, že tyhle končiny patří vám, potřebujete někoho, kdo se tu bude pravidelně ukazovat vaším jménem, jestli mi rozumíte.“ S mrknutím se zakousne do kusu grilovaného masa. Skupina, která všem ukáže, že tahle země skutečně patří mně? Možná to není tak špatný nápad..."
 bp3_survey.1090.a: "Najmeme několik strážných, aby hlídkovali v odlehlých končinách."
 bp3_survey.1090.b: "Najměme místní lovce, kteří už kraj znají."
 bp3_survey.1090.c: "Koho zajímá pár pytláků?"
 inspection_hidden_hinterlands_modifier: "[Concept('hunt_success_chance','Šance na úspěch lovu')|E]: #p +10%#!\n[Concept('prestige_experience','Proslulost')|E] z [Concept('hike','túry')|E]: #P +25%#!"
 inspection_hidden_hinterlands_recruit_modifier: "Hlídka v divočině"
 inspection_hidden_hinterlands_recruit_modifier_desc: "Strážní oddíl byl vyčleněn, aby v kraji bylo co nejméně pytláků a zločinců.\n\n*$inspection_hidden_hinterlands_modifier$*"
 inspection_hidden_hinterlands_hunters_modifier: "Místní lovci"
 inspection_hidden_hinterlands_hunters_modifier_desc: "Skupina místních lovců byla najata lenním pánem, aby chránila baronství před pytláky a zločinci.\n\n*$inspection_hidden_hinterlands_modifier$*"
 bp3_survey.1200.t: "Pokrok"
 bp3_survey.1200.desc: "Navzdory všem problémům, kterým jsem tu v [province.GetName] musel čelit, začínám mít pocit, že už se zde dokážu dobře orientovat. Vlastníci půdy i místní cechy si pomalu zvykají na můj způsob jednání.\n\nTeď už jen musím vytyčit směr, kterým se má toto hrabství do budoucna ubírat, a najít správné lidi, kteří je tím směrem povedou."
 bp3_survey.1200.a: "Snad jsou to poslední překážky, které mě tu čekají."
 bp3_survey.1210.t: "Krok správným směrem"
 bp3_survey.1210.desc: "Po večeru stráveném jednáním s místními vlastníky půdy se mi konečně podařilo uzavřít dohodu s jedním z místních kupeckých cechů.\n\nSnad je to teprve začátek a podaří se mi toto hrabství dostat tam, kde ho chci mít. Kdyby se jen našlo víc vstřícných hlasů, které mé snahy podpoří."
 bp3_survey.1210.a: "První z mnoha kroků."
 bp3_survey.1220.t: "Krok vedle"
 bp3_survey.1220.desc: "Ani po celém večeru jednání se místním vlastníkům půdy nepodařilo najít kompromis. Navzdory veškerému úsilí cítím, jak ze mě pomalu vyprchává odhodlání udržet tu všechno pohromadě.\n\nProč se pro jednou nemohou prostě dohodnout?"
 bp3_survey.1220.a: "Prostě spolu #bold mluvte#!!"
 bp3_survey.1230.t: "Přešlap za přešlapem"
 bp3_survey.1230.desc: "Po dlouhém dni rozhovorů s místními vlastníky půdy musím řešit drobný spor mezi kupeckými cechy, jen aby vzápětí přišlo další šlechtické hašteření.\n\nKamkoli se podívám, všude jako by čekal další problém, který si žádá mou pozornost. Co je s těmi lidmi tady v [province.GetName] špatně?!"
 bp3_survey.1230.a: "Chtějí vůbec, aby se věci #emp zlepšily#!?"
