 inspection_proteted_poi_levy_modifier: "Chráněná památka"
 inspection_proteted_poi_levy_modifier_desc: "Místní posádka byla vyčleněna na ochranu zdejší památky a mnoha cestovatelů, kteří ji navštěvují.\n\n*$protected_poi_modifier_desc$*"
 inspection_protected_holy_site_levy_modifier: "Chráněné svaté místo"
 inspection_protected_holy_site_levy_modifier_desc: "Místní posádka byla vyčleněna na ochranu zdejšího svatého místa a mnoha poutníků.\n*$protected_holy_site_modifier_desc$*"
 inspection_protected_holy_poi_levy_modifier: "*$inspection_protected_holy_site_levy_modifier$*"
 inspection_protected_holy_poi_levy_modifier_desc: "Místní posádka byla vyčleněna na ochranu zdejšího svatého místa a mnoha poutníků.\n*$protected_poi_modifier_desc$* *$protected_holy_site_modifier_desc$*"
 inspection_protected_poi_gold_modifier: "Střežená památka"
 inspection_protected_poi_gold_modifier_desc: "Zdejší památka dostala vlastní posádku, která chrání ji i množství cestovatelů, kteří ji navštěvují.\n*$protected_poi_modifier_desc$*"
 inspection_protected_holy_site_gold_modifier: "Střežené svaté místo"
 inspection_protected_holy_site_gold_modifier_desc: "Zdejší svaté místo dostalo vlastní posádku, která chrání je i množství poutníků.\n*$protected_holy_site_modifier_desc$*"
