 bp3_survey.0020.t: "Plány na expanzi"
 bp3_survey.0020.desc: "Vydávám se do pohraničí kraje zvaného [province.GetName], až na samý okraj svého panství. Pustá země, která jen čeká na někoho s dostatkem ctižádosti, aby se jí ujal. Na někoho, kdo dokáže rozpoznat její potenciál.\n\n"
 bp3_survey.0020.desc_weak_neighbor: "Prý je jistý [neighboring_lord.GetName] tím nejbližším, co zde mají k vládnoucímu šlechtici. Podle toho, co jsem slyšel[Select_CString(ROOT.Char.IsFemale, 'a', 'i')], je to někdo slabý, kdo jen čeká, až mu ostatní řeknou, co má dělat."
 bp3_survey.0020.desc_no_neighbor: "Když v okolí není nikdo další, kdo by stál za řeč, prosadit zde svou převahu a vznést na tyto země nároky by neměl být problém."
 bp3_survey.0020.a: "Zkusme s [neighboring_lord.GetFirstNameNoTooltip] najít nějaký kompromis."
 bp3_survey.0020.a.tt: "V případě úspěšné [Concept('inspection','inspekce')|E] získáš lepší odměnu v podobě přijetí [Concept('offer_vassalization','nabídky vazalizace')|E]\n"
 bp3_survey.0020.b: "Je čas udělat z těchto zemí mé země."
 bp3_survey.0020.b.tt: "V případě úspěšné [Concept('inspection','inspekce')|E] získáš lepší odměnu v podobě [Concept('claims','nároků')|e]\n"
 bp3_survey.0020.acceptance.positive: "Zvýšené přijetí [Concept('offer_vassalization','nabídky vazalizace')|E] postavou [neighboring_lord.GetName]: "
