 bp3_survey.0050.t: "Návštěva vrchnosti"
 bp3_survey.0050.desc: "Přestože mě předem upozornil posel, přece jen mě trochu zaskočí, když u svého dvora v [province.GetName] osobně spatřím [host.GetFirstName], svou vrchnost. Prý je tu jen proto, aby osobně „dohlédla“ na zdejší poměry, ale žádné podrobnosti mi nesdělí.\n\nDlouho se snažím zjistit, zda ode mě něco konkrétního potřebuje, ale odpověď je stále stejná: všechno potřebné už má. Snad nenajde nic, co najít nemá..."
 bp3_survey.0050.a: "Vítej v [province.GetNameNoTooltip]. Titul „[host.GetTitleAsNameNoTooltip]“ zde budí náležitou úctu."
 bp3_survey.0050.a.tt: "[host.GetName] pořádá [Concept('inspection','inspekci')|E] v [province.GetName]"
 bp3_survey_liege_intervention: "Zásah vrchnosti"
 bp3_survey.1000.t: "Prázdné země"
 bp3_survey.1000.desc: "Při průzkumu odlehlejších částí kraje zvaného [province.GetName] narazíme s [guest_1.GetFirstName] na malý kout krajiny, kterému místní říkají [empty_province.Custom('HoldingNoHoldingTerrainRoamingTooltip')]. "
 bp3_survey.1000.desc_lonely: "Při průzkumu odlehlejších částí kraje zvaného [province.GetName] narazím na malý kout krajiny, kterému místní říkají [empty_province.Custom('HoldingNoHoldingTerrainRoamingTooltip')]. "
 bp3_survey.1000.desc_continuation: "Kromě několika pastevců koz tu zřejmě nikdo nežije. Kdykoli kolem nich procházíme, sledují nás s nedůvěrou v očích.\n\n"
 bp3_survey.1000.desc_border: "Chci-li rozšířit svou doménu, musím mít vazaly, kteří dokážou mou moc prosadit i v nejzazších koutech mého panství."
 bp3_survey.1000.desc_bureaucracy: "Chci-li si udržet kontrolu nad krajem zvaným [province.GetNameNoTooltip], musím lépe poznat zdejší obyvatelstvo, a to i v těchto odlehlých končinách."
 bp3_survey.1000.desc_domain: "Chci-li si získat své poddané, musím zajistit, aby i lidé žijící v tomto zapadlém koutě znali mou tvář a jméno."
 bp3_survey.1000.a: "Pošleme sem několik lidí, aby tu zřídili malé stanoviště."
 bp3_survey.1000.b: "Investuji do zdejších cest, aby se sem mohli dostat další lidé."
 bp3_survey.1000.c: "Musím oslovit místní."
