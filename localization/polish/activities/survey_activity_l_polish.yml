 bp3_survey.0040.t: "Lidé z kraje zvaného [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip]"
 bp3_survey.0040.desc: "Ve snaze zlepšit naše vztahy s lidmi v [province.GetName] jsem si vyhradil[Select_CString(ROOT.Char.IsFemale, 'a', '')] celý den na procházku městem a setkávání s místními."
 bp3_survey.0040.mid: "Navzdory námitkám mě [county_holder.GetFirstName] doprovází, a tak může na vlastní oči sledovat, jak se to má správně dělat."
 bp3_survey.0040.outro: "\n\nAčkoli zpočátku trochu váhají, nakonec se k nám vydá početná skupina místních, kteří nám chtějí povědět o svých problémech. Pokud dostanu příležitost, promluvím o..."
