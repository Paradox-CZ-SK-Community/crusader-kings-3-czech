 inspection_empty_lands_border_modifier: "Malé pohraniční stanoviště"
 inspection_empty_lands_border_modifier_desc: "Malé pohraniční stanoviště představuje první krok k osídlení této oblasti.\n#emp Pokud zde bude vybudována [Concept('holding','država')|E], změní se na [Concept('fortification_building','opevňovací budovu')|E]#!"
 inspection_survey_new_goods_modifier: "Nové zboží"
 inspection_survey_new_goods_modifier_desc: "Po rozšíření panství do nových zemí se do tohoto hrabství dostalo nové zboží."
 bp3_survey.1010.t: "Výtržníci v [province.GetNameNoTooltip]"
 bp3_survey.1010.desc: "Když procházím ulicemi v [province.GetName], náhle přímo přede mnou nějaký výtržník za bílého dne vyhrožuje [Select_CString(peasant_character.IsFemale, 'ženě', 'muži')]. Volá o pomoc a zoufale obrací pohled ke mně a mým strážím.\n\nV poslední době se někteří žoldnéři ve městě začali živit loupežemi a zločinem, ale ani ve snu mě nenapadlo, že to zašlo až tak daleko. Mám zasáhnout a [Select_CString(peasant_character.IsFemale, 'té nebohé ženě', 'tomu nebohému muži')] pomoct?"
 bp3_survey.1010.a: "Ať je posádka vyžene z města."
 bp3_survey.1010.a.win: "Shromáždit místní posádku a zbavit se banditů"
 bp3_survey.1010.a.win_short: "Posádka svolána"
 bp3_survey.1010.a.lose: "Situace se ještě zhorší"
 bp3_survey.1010.a.lose_short: "Zakořenění lapkové"
 bp3_survey.1010.b: "Možná by stáli o práci..."
 bp3_survey.1010.b.flavor: "S místními si očividně umějí poradit."
 bp3_survey.1010.c: "Musím zasáhnout!"
 bp3_survey.1010.c.win: "[Select_CString(bandit_character.IsFemale, 'Zastrašit výtržnici', 'Zastrašit výtržníka')]"
 bp3_survey.1010.c.win_short: "[Select_CString(bandit_character.IsFemale, 'Výtržnice zahnána', 'Výtržník zahnán')]"
 bp3_survey.1010.c.lose: "Zranění při potyčce"
