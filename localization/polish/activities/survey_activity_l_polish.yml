 bp3_survey.0010.t: "Závěr"
 bp3_survey.0010.desc.border.success: "Naše úsilí podél hranic kraje zvaného [province.GetName] slavilo obrovský úspěch. Jasně jsme dali najevo, že tato oblast by měla spadat pod správu [ROOT.Char.GetPrimaryTitle.GetName], a je to znát i z toho, jak o ní lidé mluví.\n\nMnozí místní se prý už chovají, jako by mi skutečně podléhali."
 bp3_survey.0010.desc.border.failure: "Navzdory veškerému úsilí skončil každý náš pokus prosadit nárok na pohraničí kraje zvaného [province.GetName] neúspěchem, ne-li přímo ostudou. Mezi některými místními se dokonce začalo říkat „dopadnout jako [ROOT.Char.GetTitledFirstName]“ těm, kdo neuspěli při námluvách.\n\nZačínám toho všeho litovat..."
 bp3_survey.0010.desc.bureaucracy.success: "Zpočátku to vypadalo beznadějně, ale nakonec se mi přece jen podařilo začít dávat věci v [province.GetName] do pořádku a učinit přítrž části místní korupce i řádění banditů. Je to sice jen první krok správným směrem, ale pro budoucnost hrabství je zásadní.\n\nTeď už jen musíme zajistit, abychom z této cesty v dohledné době nesešli."
 bp3_survey.0010.desc.bureaucracy.failure: "Občas už to vypadalo, že korupci sužující kraj zvaný [province.GetName] konečně učiníme přítrž, ale na každém kroku se objevilo něco dalšího, co bylo třeba napravit. Vždy se našla další tlupa banditů, která plenila okolí, další zkorumpovaný šlechtic ukrývající daňové příjmy nebo další budova vyžadující opravu.\n\nMé úsilí bylo vskutku hrdinské, ale i jeden člověk zmůže jen tolik..."
 bp3_survey.0010.desc.people.success: "Mezi místními v [province.GetName] má obliba výrazně vzrostla. Někteří prý dokonce používají rčení „buď jako [ROOT.Char.GetFirstName]“. Bylo jen otázkou času, než se naučí vážit si těch, kdo stojí nad nimi.\n\nSnad si na to vzpomenou, až se příště objeví nějaký jejich malicherný problém."
 bp3_survey.0010.desc.people.failure: "Ať už s místními v [province.GetName] mluvím a jednám sebevíc, nad celým hrabstvím stále visí nespokojenost. Navzdory veškerému úsilí netuším, jak se k tomuto problému postavit ani jak jej vyřešit.\n\nMožná to zkrátka nemá být. Alespoň ne teď."
 bp3_survey.0010.a: "Přesně podle plánu."
 bp3_survey.0010.b: "Vrátím se a napravím to jindy."
