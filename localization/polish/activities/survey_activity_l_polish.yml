 survey_overseer_intent: "Záměr dohledu"
 survey_overseer_intent_desc: "Místní správci a šlechtici jsou pověstní dodatečnými daněmi a plnými kapsami. Je čas tomu učinit přítrž.\n\n#emp Zlepšuje [Concept('inspection_success_chance_no_prefix','pravděpodobnost úspěchu')|E]#!"
