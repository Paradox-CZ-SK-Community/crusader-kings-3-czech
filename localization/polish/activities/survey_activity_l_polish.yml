 inspection_fighting_guilds_artists_guild_modifier_desc: "Umělci přicházejí zdaleka, aby se podíleli na tvůrčím ruchu, který je ve městě k vidění téměř na každém rohu."
 inspection_learning_intent_local_guilds_modifier: "Místní cechy"
 inspection_learning_intent_local_guilds_modifier_desc: "Poté, co navázaly styky s lenním pánem v jiných částech panství, se v baronství usadilo několik nových cechů."
 bp3_survey.1040.t: "Požár se šíří"
 bp3_survey.1040.desc: "Když se se svou družinou ubírám ulicemi [province.GetName], náhle narazíme na požár, který se zběsile šíří jednou z nejstarších městských čtvrtí. Mnozí jen strnule přihlížejí s očima dokořán, jiní tiše pláčou u těl ležících na dlažbě.\n\nAsi tucet vojáků se zoufale snaží dostat oheň pod kontrolu, než zachvátí zbytek města a nezanechá po sobě nic než popel."
 bp3_survey.1040.a: "Musíme ty lidi zachránit!"
 bp3_survey.1040.a.win: "Pomůžeš uhasit požár"
 bp3_survey.1040.a.loss: "Navzdory tvému úsilí se požár šíří dál"
 bp3_survey.1040.a.death: "Zachvátí tě plameny"
 bp3_survey.1040.b: "Prostředky vyčlením později. Teď zachraňme, co se dá."
 bp3_survey.1040.c: "[county_owner.GetFirstNameNoTooltip] potřebuje dostat za vyučenou... ještě větším požárem."
 bp3_survey.1040.c.win: "Lidé uvěří v tvé dobré úmysly"
 bp3_survey.1040.c.loss: "Lidé znají pravdu"
 bp3_survey.1040.d: "Tady už nic víc nezmůžu..."
 bp3_survey.1040.destroyed_building: "Požár se šíří"
 inspection_fire_spreading_modifier: "Vyhořelé ulice"
 inspection_fire_spreading_modifier_desc: "Spálení části staré zástavby otevřelo nové možnosti."
 inspection_selfless_ruler_modifier: "Obětavý vládce"
 inspection_selfless_ruler_modifier_desc: "Tato postava riskovala vlastní zdraví, aby pomohla svému lidu."
 bp3_survey.1050.t: "Rozšiřování městských hradeb"
 bp3_survey.1050.desc: "Znovu se dávám do hovoru s několika místními o tom, čemu bych měl při přestavbě [province.GetName] dát přednost. „Přesuňte a znovu vystavte staré městské hradby, Milosti,“ navrhuje s mrknutím kapitán místní posádky [soldier_character.GetNameNoTooltip]. „Jen si představte, kolik místa bychom získali pro novou obytnou čtvrť!“\n\n„Ne, ne! Stará kupecká čtvrť nutně potřebuje opravit.“ [merchant_character.GetNameNoTooltip], zástupce místních cechů, se bezostyšně vmísí do hovoru. „Představte si, jak město ožije, až bude kupecká čtvrť zase plná života!“"
 bp3_survey.1050.a: "[province.GetNameNoTooltip] potřebuje především opravit staré rozpadající se hradby."
 bp3_survey.1050.b: "Kupci mají pravdu."
 bp3_survey.1050.c: "Nemáme dost zlata, abychom ho rozdávali na všechny strany."
 inspection_expanding_walls_new_modifier: "Prostor k rozšíření"
 inspection_expanding_walls_new_modifier_desc: "Po přesunutí části hradeb získalo město nový prostor k rozšíření."
 inspection_expanding_walls_old_modifier: "Investice do cechů"
 inspection_expanding_walls_old_modifier_desc: "Místním cechům se začalo o něco lépe dařit poté, co na údržbu kupecké čtvrti padlo malé jmění."
 inspection_learning_intent_building_modifier: "Stavební postupy"
 inspection_learning_intent_building_modifier_desc: "Díky stavebním postupům převzatým z jiných částí panství hlavní město jen vzkvétá."
 inspection_expanding_walls_new_desc: "\t#weak Zvýšení za každý volný slot pro [Concept('building','budovu')|E]#!"
 MODIFIER_DEFINITION_EXPANDING_WALLS_NEW_DESC: "\nČím více volných slotů pro [Concept('building','budovy')|E] je v [Concept('barony','baronství')|E], tím vyšší je tento modifikátor"
 inspection_expanding_walls_old_desc: "\t#weak Zvýšení za každou [Concept('building','budovu')|E]#!"
 MODIFIER_DEFINITION_EXPANDING_WALLS_OLD_DESC: "\nČím více [Concept('buildings','budov')|E] se v [Concept('barony','baronství')|E] nachází, tím vyšší je tento modifikátor"
 bp3_survey.1060.t: "Hleď si svého dolu"
 bp3_survey.1060.desc: "[province.GetName] nechávám za zády a se svou družinou prozkoumávám okolní krajinu, když narazíme na starou, téměř zapomenutou cestu. Je dobře ukrytá, ale zavede nás k malému skalnatému návrší a především k jeskyni, na jejímž dně se povaluje opuštěné hornické náčiní.\n\n"
 bp3_survey.1060.desc.copper: "„Má Milosti,“ zvolá náhle jeden z mých vojáků, [soldier_character.GetFirstNameNoTooltip], „není tohle měděná žíla?“"
 bp3_survey.1060.desc.silver: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ zvolá náhle jeden z mých vojáků, [soldier_character.GetFirstNameNoTooltip], „to, co se tam třpytí, musí být stříbro!“"
 bp3_survey.1060.desc.gold: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ zvolá náhle jeden z mých vojáků, [soldier_character.GetFirstNameNoTooltip], s očima dokořán. „Tohle je valoun zlata?“"
 bp3_survey.1060.a: "Na co čekáme? Kopejte! KOPEJTE!"
 inspection_learning_intent_flourishing_metal_trade_modifier: "Vzkvétající trh"
 inspection_learning_intent_flourishing_metal_trade_modifier_desc: "V tomto baronství vznikl vzkvétající trh poté, co byl v jiné části panství objeven důl."
 bp3_survey.1070.t: "Pravidelné nesrovnalosti"
 bp3_survey.1070.desc.intro.personal: "Při kontrole daní vybraných mými místními správci a místodržiteli si všímám jasných nesrovnalostí mezi tím, co bylo v některých oblastech zaznamenáno, a tím, co jsem skutečně obdržel.\n\n"
 bp3_survey.1070.desc.intro.vassal: "Při kontrole daní vybraných v době, kdy [province.GetName] [Select_CString(county_owner.IsFemale, 'spravovala', 'spravoval')] [county_owner.GetFirstNameNoTooltip], si všímám jasného rozdílu mezi tím, co mi náleželo, a tím, co jsem skutečně dostal. [county_owner.GetFirstNameNoTooltip] si toho [Select_CString(county_owner.IsFemale, 'měla', 'měl')] všimnout, jenže chybná čísla byla do záznamů zanesena ještě předtím, než je [Select_CString(county_owner.IsFemale, 'dostala', 'dostal')] do rukou.\n\n"
 bp3_survey.1070.desc: "Ať už za to může kdokoli, někdo za to musí zaplatit. Místní už odvedli, co měli, ale vymáčknout z nich další peníze bude snazší než z těch, kdo za tyhle „chyby“ skutečně mohou."
 bp3_survey.1070.a: "Šlechtici #emp zaplatí#!, co dluží, ať už po dobrém, nebo po zlém."
 bp3_survey.1070.a.flavor: "Udělej z viníků odstrašující příklad, aby ostatní věděli, co je v sázce."
 bp3_survey.1070.b: "Ztráty vyrovná jednorázová daň pro místní."
 bp3_survey.1070.b.flavor: "Místní to neocení, ale peníze jsou potřeba."
 bp3_survey.1070.c: "Tentokrát nad tím přimhouřím oko..."
 bp3_survey.1070.c.flavor: "Snad mou shovívavost ocení."
 inspection_regular_irregularities_local_modifier: "Jednorázová daň"
 inspection_regular_irregularities_local_modifier_desc: "Tato postava uvalila na místní obyvatele mimořádnou jednorázovou daň, aby vyrovnala nedostatky svých vazalů."
 inspection_regular_irregularities_modifier: "Vynucený trest"
 inspection_regular_irregularities_modifier_desc: "Tato postava tvrdě potrestala vazaly, kteří si nechávali vybrané daně pro sebe."
 bp3_survey.1080.t: "Místo hodné návštěvy"
 bp3_survey.1080.desc: "„Vůbec tam není bezpečno, [ROOT.Char.Custom('FormOfAddressForLiege')],“ říká mi ztrhaně vyhlížející pocestný. „Jen tak tak jsem si zachránil život.“ To, co popisuje, zní jako pořádně drsná zkušenost.\n\n"
 bp3_survey.1080.desc.holy_poi: "Zdá se, že [ROOT.GetCharacter.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip] z široka daleka míří právě sem. [location_province.GetName] je láká tím nejposvátnějším, co zde lze spatřit: [location_province.Custom('GetSpecialBuildingPrefix')][location_province.GetHolding.GetSpecialBuildingType.GetName]. Jenže do cesty se jim staví zločinci."
 bp3_survey.1080.desc.poi: "Zdá se, že [location_province.GetName] přitahuje lidi z široka daleka. Láká je [location_province.Custom('GetSpecialBuildingPrefix')][location_province.GetHolding.GetSpecialBuildingType.GetName], jenže do cesty se jim staví zločinci."
 bp3_survey.1080.desc.holy_site: "Zdá se, že [location_province.GetName] přitahuje [ROOT.GetCharacter.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip] z široka daleka. Láká je zdejší svaté místo, jenže do cesty se jim staví zločinci."
 bp3_survey.1080.desc.outro: "Jestli dovolíme banditům a lapkům dál olupovat návštěvníky... je jen otázkou času, než začnou jezdit jinam."
 bp3_survey.1080.a: "Najmu malou hlídku, aby chránila pocestné."
 bp3_survey.1080.b: "Ať se o návštěvníky postarají místní."
 bp3_survey.1080.c: "Ať se o sebe postarají sami."
 protected_poi_modifier_desc: "\nŠance na získání bodu [Concept('skill','dovednosti')|E] při [Concept('monument_expedition','výpravě k památce')|E]: #p +10%#!"
