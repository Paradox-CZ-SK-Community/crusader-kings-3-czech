 inspection_old_roads_of_x_populace_modifier_desc: "Obyvatelé hrabství byli donuceni podílet se na údržbě místních cest."
 inspection_old_roads_negative_modifier: "Zanedbané cesty"
 inspection_old_roads_negative_modifier_desc: "Staré cesty v hrabství už dlouho chátrají a nutně potřebují opravu."
 bp3_survey.1030.t: "Svár mezi cechy"
 bp3_survey.1030.desc: "Uprostřed rozhovoru s jedním ze svých úředníků mě náhle vyruší dvě skupiny, které se jen pár kroků ode mě hlasitě hádají. Moji strážní je od sebe sotva odtrhnou, ale zástupci obou stran na sebe dál pokřikují.\n\nPo několika marných pokusech je uklidnit mi konečně dochází, že proti sobě stojí [city_province.Custom('InspectionFightingGuilds1Loc')] a [city_province.Custom('InspectionFightingGuilds2Loc')]. Přou se o vlastnická práva v nejdůležitější části centra města."
 bp3_survey.1030.a: "Místa je tu dost pro obě strany!"
 bp3_survey.1030.a.win: "Najdou kompromis"
 bp3_survey.1030.a.loss: "V [city_province.GetNameNoTooltip] propukne rozsáhlý boj o moc"
 bp3_survey.1030.a.loss_short: "Odmítají kompromis"
 bp3_survey.1030.b: "[city_province.Custom('InspectionFightingGuilds1Loc')] si zaslouží mou podporu."
 bp3_survey.1030.c: "[city_province.Custom('InspectionFightingGuilds2Loc')] si zaslouží mou podporu."
 bp3_survey.1030.d: "[city_province.Custom('InspectionFightingGuilds1Loc')]? [city_province.Custom('InspectionFightingGuilds2Loc')]?! Pche, to zlato patří mně!"
