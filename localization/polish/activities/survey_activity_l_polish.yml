l_polish:
 activity_survey: "Inspekce"
 activity_survey_desc: "Proveď důkladnou inspekci svých zemí, aby tvé panství šlapalo jako dobře namazaný stroj, a hledej příležitosti ke zlepšení stávající byrokracie a poměrů."
 activity_survey_tenet_bonus: "\n$BULLET_WITH_TAB$Po dokončení získáš [Concept('piety_experience','oddanost')|E]"
 activity_survey_host_desc: "[AddLocalizationIf( GetPlayer.GetGovernment.HasRule( 'merit' ), 'activity_survey_gain_merit_desc' )]$BULLET_WITH_TAB$Můžeš získat @pressed_claim![Concept('claims','nároky')|E]\n$BULLET_WITH_TAB$Může se zvýšit @vassal_icon![Concept('offer_vassalization','přijetí nabídky vazalizace')|E]\n$BULLET_WITH_TAB$Mohou se zvýšit @gold_icon![Concept('taxes','daně')|E] v [Concept('county','hrabství')|E]\n$BULLET_WITH_TAB$Může se zvýšit @development_icon![Concept('development','rozvoj')|E] v [Concept('county','hrabství')|E]\n$BULLET_WITH_TAB$Může se zvýšit @control_icon![Concept('control','kontrola')|E] v [Concept('county','hrabství')|E]\n$BULLET_WITH_TAB$Může se zvýšit @stationed_regiment_icon![Concept('levies','počet odvedenců')|E] v [Concept('county','hrabství')|E]\n$BULLET_WITH_TAB$Může se zlepšit @opinion_icon![Concept('opinion','mínění')|E]\n$BULLET_WITH_TAB$Může se zlepšit @domain_icon![Concept('county_opinion','lidové mínění')|E][AddLocalizationIf( GetPlayer.GetFaith.HasParameterByKey('inspections_unlocked_and_costs_piety' ), 'activity_survey_tenet_bonus' )]"
 activity_survey_guest_desc: ""
 activity_survey_conclusion_desc: "Tato cesta mi poskytla skvělou příležitost poznat větší část mého panství, ale nemohu tu zůstat věčně. Má práce zde skončila. Je čas vrátit se domů."
 activity_survey_selection_tooltip: "Důkladnou inspekcí zajisti, aby tvé panství spravovali schopní patolízalové.\n\nOčekávané odměny: $rewards_inspection_tt$"
 activity_survey_destination_selection: "\n[Concept('inspections','Inspekce')|E] jsou přínosnější v [Concept('counties','hrabstvích')|E] s nízkou [Concept('county_control','kontrolou hrabství')|E] nebo podél hranic s cizími [Concept('realms','panstvími')|E], kde místní byrokracie selhává. V těchto oblastech se ti může naskytnout více příležitostí a mají vyšší [Concept('inspection_success_chance_no_prefix','pravděpodobnost úspěchu')|E]."
 survey_activity_not_capital: "[Concept('inspections','Inspekci')|E] nelze pořádat v [Concept('capital','hlavním sídle')|E]"
 survey_activity_on_cooldown: "V jednom [Concept('county','hrabství')|E] lze [Concept('inspections','inspekci')|E] pořádat pouze jednou za #bold 5#! let"
 rewards_inspection_tt: "\n$BULLET_WITH_TAB$@pressed_claim![Concept('claims','Nároky')|E] a @vassal_icon![Concept('offer_vassalization','přijetí nabídky vazalizace')|E]\n$BULLET_WITH_TAB$@gold_icon![Concept('taxes','Daně')|E], @development_icon![Concept('development','rozvoj')|E] a @control_icon![Concept('control','kontrola')|E]\n$BULLET_WITH_TAB$@stationed_regiment_icon![Concept('levies','Odvedenci')|E], @opinion_icon![Concept('opinion','mínění')|E] a @domain_icon![Concept('county_opinion','lidové mínění')|E]"
 activity_survey_predicted_cost: "Náklady na [Concept('inspection','inspekci')|E] ovlivňuje především množství prostředků vyčleněných na [Concept('activity','aktivitu')|E]. Vyšší financování usnadní plnění úkolů, ale také zvýší náklady."
