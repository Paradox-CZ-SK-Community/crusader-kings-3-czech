 inspection_no_funding: "Bez financování"
 inspection_no_funding_desc: "$EFFECT_LIST_BULLET$ [Concept('skill_challenges','Výzvy dovedností')|E] budou mít menší šanci na úspěch\n$EFFECT_LIST_BULLET$ V událostech zůstávají náklady v [gold_i] [Concept('gold','zlatě')|E] stejné\n\n#weak Při minimálním či nulovém financování může být obtížné najít prostředky potřebné k uskutečnění všech tvých záměrů v provincii.#!"
 inspection_small_fund: "Dostatečné financování"
 inspection_small_fund_desc: "$EFFECT_LIST_BULLET$ [Concept('skill_challenges','Výzvy dovedností')|E] během [Concept('activity','aktivity')|E] mají vyšší šanci na úspěch\n$EFFECT_LIST_BULLET$ V událostech jsou náklady v [gold_i] [Concept('gold','zlatě')|E] sníženy o #P 20%#!\n\n#weak S menším obnosem zlata bude snazší financovat restrukturalizaci, která bude podle tebe v provincii zapotřebí.#!"
 inspection_large_fund: "Značné financování"
 inspection_large_fund_desc: "$EFFECT_LIST_BULLET$ [Concept('skill_challenges','Výzvy dovedností')|E] během [Concept('activity','aktivity')|E] mají výrazně vyšší šanci na úspěch\n$EFFECT_LIST_BULLET$ V událostech jsou náklady v [gold_i] [Concept('gold','zlatě')|E] sníženy o #p 40%#!\n\n#weak Se značným obnosem zlata si jen těžko dokážeš představit, že by v provincii zůstalo něco, co bys nedokázal financovat.#!"
 bp3_survey.0005.t: "Příjezd"
 bp3_survey.0005.desc.holder: "Po příjezdu do místa zvaného [ROOT.Char.GetCurrentLocation.GetName] mě uvedou do malé pracovny, kde mě přijímá [county_holder.GetTitledFirstName]. Posel dorazil předem, takže má přítomnost nemůže být žádným překvapením, přesto je zjevné, že důvod mé návštěvy budí zvědavost. A všechna ta přehnaná pozornost kolem mě? Pramení ze špatného svědomí, nebo jsou to jen prázdné zdvořilosti?\n\nNa tom teď nezáleží. Nejsem tu kvůli tomu. Jsem tu, abych..."
 bp3_survey.0005.desc.no_holder: "Po příjezdu do místa zvaného [ROOT.Char.GetCurrentLocation.GetName] mě uvedou do pracovny. Skupina služebnictva se nějakou dobu stará o každé mé přání a neustále kolem mě pobíhá, dokud je nepožádám, aby odešli. Jak se mám soustředit na práci, když se mi pořád motají po místnosti?\n\nKonečně mám klid a mohu se pustit do svých plánů. Hodlám..."
 bp3_survey.0005.a: "Rozšířit své hranice."
 bp3_survey.0005.a.tt: "[Concept('inspection','Inspekce')|E] se pokusí dosáhnout následujícího:$SurveyArrivalIntroClaims$ $SurveyARrivalIntroVassals$"
 bp3_survey.0005.b: "Zlepšit byrokracii v kraji jménem [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]."
