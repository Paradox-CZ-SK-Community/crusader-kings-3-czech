 bp3_survey.1010.d.flavor: "Teď má plné ruce práce s okrádáním někoho jiného. Pryč odsud!"
 inspection_bandits_in_x_domain_modifier: "Žoldnéřská posádka"
 inspection_bandits_in_x_domain_modifier_desc: "Skupina žoldnéřů a banditů byla najata, aby posílila místní posádku."
 inspection_bandits_in_x_populace_modifier: "Ochrana lidu"
 inspection_bandits_in_x_populace_modifier_desc: "Tato postava neváhala chránit svůj lid, a dokonce kvůli němu riskovala vlastní život."
 inspection_bandits_in_x_border_negative_modifier: "Bezohlední bandité"
 inspection_bandits_in_x_border_negative_modifier_desc: "Zločinci drží hrabství pevně v sevření a do značné míry ze zákulisí řídí jeho každodenní chod."
 inspection_bandits_in_x_border_positive_modifier: "Bezpečné ulice"
 inspection_bandits_in_x_border_positive_modifier_desc: "Místní obyvatelé se cítí bezpečně, protože bandité zde nepředstavují vážnější problém ani hrozbu."
 bp3_survey.1020.t: "Staré cesty v [province.GetCounty.GetName]"
 bp3_survey.1020.desc: "Při cestě se rozhlížím po okolí: [province.Custom('HoldingNoHoldingTerrainRoamingTooltip')]. Přemýšlím přitom nad až příliš častým problémem. Jakmile opustíme město, uvízneme v bahnitých příkopech nebo bloudíme po cestách, které nikam nevedou.\n\nTyhle staré cesty jsou sotva k něčemu. Jestli nevyčlením lidi na jejich opravu, brzy to nejspíš pocítí místní obyvatelé i cizí kupci, pokud se tak už nestalo."
 bp3_survey.1020.a: "Vyčlením na to potřebné prostředky."
 bp3_survey.1020.b: "Povoláme na práci obyvatele."
 bp3_survey.1020.c: "Postará se o to posádka."
 bp3_survey.1020.d: "Tak velký problém to není."
