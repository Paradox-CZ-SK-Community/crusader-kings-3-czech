 bp3_survey.0030.t: "Dohled nad krajem [province.GetNameNoTooltip]"
 bp3_survey.0030.desc: "Po důkladném prostudování všech dokumentů, které se mi podařilo najít, jsem nakonec dokázal[Select_CString(ROOT.Char.IsFemale, 'a', '')] vydobýt určité dodatečné prostředky. Mohu je přesměrovat na řešení některých problémů s místní infrastrukturou, které hrabství sužují. Teď už jen musím rozhodnout, která část zdejší správy potřebuje pomoc nejvíce."
 bp3_survey.0030.a: "Odstranění mezer v místním daňovém systému se časem samo zaplatí."
 bp3_survey.0030.a.tt: "V případě úspěšné [Concept('inspection','inspekce')|E] získáš lepší odměnu v podobě [Concept('tax','daní')|E]\n"
 bp3_survey.0030.b: "Prostředky poputují na [province.Custom('SurveyMidDomainInfrastructureOptionsLoc')] v kraji [province.GetNameNoTooltip]."
 bp3_survey.0030.b.tt: "V případě úspěšné [Concept('inspection','inspekce')|E] získáš lepší odměnu v podobě [Concept('development','rozvoje')|E]\n"
 bp3_survey.0030.c: "Místní posádka má v poslední době potíže."
 bp3_survey.0030.c.tt: "V případě úspěšné [Concept('inspection','inspekce')|E] získáš lepší odměnu v podobě [Concept('control','kontroly')|E]\n"
