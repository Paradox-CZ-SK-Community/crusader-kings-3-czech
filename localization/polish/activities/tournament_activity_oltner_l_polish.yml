l_polish:
 tournament_events.9000.t: "Krásy [tournament_province.GetNameNoTooltip]"
 tournament_events.9000.desc: "Při procházce po okraji turnajového areálu mě uchvátí krása, která mě tu v [tournament_province.GetName] obklopuje.\n\nKráčím dál a přede mnou se otevírá krajina: [tournament_province.Custom('TerrainTypeProvince')]. Všude kolem rostou [tournament_province.Custom('get_region_flower_type_plural')]. Nakonec se zastavím u nádherného stromu. [tournament_province.Custom('GetRandomAppropriateTree')|U] stojí přede mnou v celé své kráse a já se dotknu jeho kůry. Když vzhlédnu, nad hlavou mi proletí [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')].\n\n"
 tournament_events.9000.desc_home: "Měl bych to dělat častěji. Vždyť jsem tu doma."
 tournament_events.9000.desc_not_home: "Snad budu mít příležitost se sem někdy vrátit."
 tournament_events.9000.a: "Ach, jaký klid!"
 tournament_events.9000.b: "Dokonalé místo, kde mohu v klidu trénovat."
 tournament_events.9000.impatient: "Sentimentální nesmysly! #EMP Musím cvičit!#!"
 tournament_events.9001.t: "$knight_culture_player_no_tooltip$ bez lenního pána"
 tournament_events.9001.desc: "Když si prohlížím turnajový areál, přistoupí ke mně postava v kvalitní zbroji.\n\n„[ROOT.Char.GetTitledFirstName], je mi ctí.“ [liegeless_knight.GetFirstNameNoTooltip] se krátce ukloní a [liegeless_knight.Custom('quirk_pos_present')]. „Jsem [liegeless_knight.GetFullName], $knight_culture_player_no_tooltip_lowercase$ bez lenního pána a hledám službu. Jsem [liegeless_knight.Custom('FormalComplimentAdjective')], [liegeless_knight.Custom('ComplimentAdjective')], věrnost mi nechybí a můj rod je mocný. #EMP [liegeless_knight.GetHouse.GetMotto]!#!“ vykřikne a postaví se do pozoru.\n\nJe zřejmé, že [liegeless_knight.GetFirstNameNoTooltip] své přednosti trochu přikrášluje, ale působí schopně. A zoufale."
 tournament_events.9001.a: "„Tak tedy, $knight_culture_player_plural_no_tooltip_lowercase$ v mé družině tě přijmou mezi sebe.“"
 tournament_events.9001.b: "„Přísaháš-li mi věrnost, štědře tě odměním!“"
 tournament_events.9001.c: "„Zmiz. Sotva ti mohu věřit.“"
 tournament_events.9001.d: "„Tolik se toho od tebe můžu naučit!“"
 tournament_events.9002.t: "Přehlídka síly"
 tournament_events.9002.desc: "Hlasitý povyk mě přivede k provizorní aréně, kterou postavili místní sedláci. [Select_CString(strongman_1.IsFemale, 'Jedna urostlá zápasnice', 'Jeden urostlý zápasník')] a [Select_CString(strongman_2.IsFemale, 'jiná urostlá zápasnice', 'jiný urostlý zápasník')] tu předvádějí své umění. Vyměňují si údery, uhýbají, kličkují a krouží kolem sebe, dokud se [strongman_1.GetFirstNameNoTooltip] neodhodlá k riskantnímu chvatu:\n\n„Tomuhle říkám #EMP [strongman_1.Custom('GetDescriptorManeuver')] [strongman_1.Custom('GetManeuver')]#!!“ vykřikne [strongman_1.GetFirstNameNoTooltip], zvedne [Select_CString(strongman_2.IsFemale, 'soupeřku', 'soupeře')] a mrští [Select_CString(strongman_2.IsFemale, 'soupeřkou', 'soupeřem')] o zem, čímž zápas okamžitě končí. „[strongman_1.GetFirstName] znovu vítězí! [strongman_1.Custom('ComplimentAdjective')|U], [strongman_1.Custom('RandomPositiveLookAdjective')|U]!“ chlubí se [strongman_1.GetFirstNameNoTooltip]."
 tournament_events.9002.whole_of_body: "Je tak uklidňující sledovat profesionální techniky!"
 tournament_events.9002.a: "Jé! To je napínavé!"
 tournament_events.9002.b: "Hm, měl bych si jejich techniky pořádně prostudovat..."
 tournament_events.9002.c: "[strongman_1.GetFirstNameNoTooltip], tady máš pár mincí!"
 tournament_events.9002.b.success: "Předvedené chvaty tě inspirují"
 tournament_events.9002.b.failure: "Nic se nenaučíš"
 tournament_events.9003.t: "Šťastná procházka"
 tournament_events.9003.desc: "Ve snaze uniknout hovoru a hluku turnajového areálu narazím na malou pěšinu ukrytou mezi stromy. Okolní porost tvoří [tournament_province.Custom('GetRandomRegionalWood')]. Pokračuji dál a všude kolem se rozprostírá [tournament_province.Custom('GetProvinceFoliageDesc')]. Podél pěšiny rostou záhon za záhonem nádherných [tournament_province.Custom('get_region_flower_type_plural')].\n\n"
 tournament_events.9003.friend: "Najednou z opačného směru přichází [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('intent_target_character'))] [intent_target_character.GetFirstName]. Štěstí mi přeje! Už nějakou dobu jsem chtěl příležitost promluvit si s [intent_target_character.GetFirstNameNoTooltip] o samotě. Možná bych mohl začít rozhovor?"
 tournament_events.9003.lover: "Když vzhlédnu, spatřím nejkrásnější květ ze všech. Přímo přede mnou kráčí [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('intent_target_character'))] [intent_target_character.GetFirstName], cíl mých tužeb. A právě po stejné cestě jako já!"
 tournament_events.9003.a: "Mlčky se mineme."
 tournament_events.9003.b: "Dokonalé místo, kde mohu v klidu trénovat."
 tournament_events.9003.lover_attempt: "„Jsi krásnější než všechny tyhle květiny.“"
 tournament_events.9003.lover_attempt.critical_success: "[intent_target_character.GetFirstNameNoTooltip] se do tebe bezhlavě zamiluje"
 tournament_events.9003.lover_attempt.success: "Tvé gesto připadá [intent_target_character.GetFirstNameNoTooltip] velmi romantické"
 tournament_events.9003.lover_attempt.minor_success: "Tvé gesto připadá [intent_target_character.GetFirstNameNoTooltip] milé"
 tournament_events.9003.lover_attempt.fail: "[intent_target_character.GetFirstNameNoTooltip] vůbec nechápe, co tím sleduješ"
 tournament_events.9003.friend_attempt: "„Procházet se o samotě je nuda. Téma k hovoru se nabízí samo: [intent_target_character.Custom('MatchingConversationSubject')].“"
 tournament_events.9003.friend_attempt.critical_success: "[intent_target_character.GetFirstNameNoTooltip] si tvou společnost opravdu užívá"
 tournament_events.9003.friend_attempt.success: "[intent_target_character.GetFirstNameNoTooltip] se rozhovorem baví"
 tournament_events.9003.friend_attempt.failure: "[intent_target_character.GetFirstNameNoTooltip] se tiše vytratí..."
 tournament_events.9004.t: "Opeřená podívaná"
 tournament_events.9004.desc: "„Leť, #EMP [falconer_1.Custom('GetBirdName')|U]#!, rychleji!“ zaslechnu hlas, který se rozléhá po turnajovém areálu. Vzhlédnu a spatřím drobného ptáka, jak se řítí oblohou jako černý blesk. Zanedlouho se střemhlav snese k cílové čáře.\n\n„Pche, tohle musí být podvod! Tvůj pták přece nemůže létat tak rychle, jen se na něj podívej, vždyť [falconer_1.Custom('GetBirdInsult')]!“ [Select_CString(falconer_2.IsFemale, 'Rozzuřená poražená', 'Rozzuřený poražený')] křičí, zatímco [Select_CString(falconer_1.IsFemale, 'vítězka', 'vítěz')] se samolibě usmívá."
 tournament_events.9004.hunter: "[Select_CString(ROOT.Char.IsFemale, 'Mohla', 'Mohl')] bych se z toho něco přiučit..."
 tournament_events.9004.a: "To je skvělá podívaná!"
 tournament_events.9004.b: "Hm, na tohle musí být potřeba spousta příprav."
 tournament_events.9004.c: "Dvojnásobek, nebo nic! Ještě jednou!"
 tournament_events.9004.c.success: "Vyhraješ sázku"
 tournament_events.9004.c.failure: "Prohraješ sázku"
 tournament_events.9004.d: "Na tohle nemám čas."
 round_as_an_egg: "je kulatý jako vejce"
 heavy_as_a_stone: "je těžký jako kámen"
 graceful_as_a_goose: "má půvab husy"
 shaped_like_a_brick: "má tvar cihly"
 as_thick_as_you: "má v hlavě stejně prázdno jako ty"
 barely_a_fledgeling: "je sotva opeřený"
 wobbly_like_a_duck: "klátí se jako kachna"
 as_fast_as_a_mountain: "je rychlý asi jako hora"
 as_bright_as_a_rain_cloud: "je chytrý asi jako dešťový mrak"
 an_empty_cup: "má v hlavě prázdno"
 a_stick_simple: "vypadá jako klacek"
 a_rock: "vypadá jako kámen"
 available_because_of_intent: "Tato možnost je dostupná díky tvému [Concept('intent','záměru')|E]"
 you_get_drunk: "Opiješ se"
 they_share_some_tricks: "Podělí se s tebou o pár triků"
 you_have_a_good_time: "Dobře se pobavíš, ale nic víc"
 tournament_events.9005.t: "Bujaré veselí"
 tournament_events.9005.desc: "Jídla i pití je během turnaje všude dostatek, k velké radosti přítomných. Zejména jedna trojice místních se očividně rozhodla společně vypít snad #EMP celý soudek#! nápoje [tournament_host.Custom('RegionalDrink')].\n\n„Tááák... tohlencto máš za tamto, ty [peasant_2.Custom2('InsultNoun', SCOPE.sC('peasant_1'))]!“ ozve se opilé blekotání a vzduchem líně prolétne [peasant_1.Custom('ThrowableObjectArticle')] směrem k někomu vedle.\n\n„[peasant_1.GetFirstName], jááá... já se omlouvám! [peasant_1.Custom('GetLaughType')]“ Oběť si zakryje obličej a odrazí útok. „Pomoz mi, [peasant_3.GetFirstName]! #EMP *škyt*#!“\n\n„V tom seš [Select_CString(peasant_2.IsFemale, 'sama', 'sám')], [peasant_2.GetName]!“ vykřikne třetí z trojice a jedním mohutným lokem do sebe obrátí celý korbel."
 tournament_events.9005.a: "Je s nimi pěkný rámus... ale #EMP $knight_culture_player_plural_no_tooltip_lowercase$ se mi hodí#!..."
 tournament_events.9005.b: "Můžu se přidat? [tournament_host.Custom('RegionalDrink')] zní dobře."
 tournament_events.9005.c: "Jsou namol... poštvat je proti sobě bude hračka!"
 tournament_events.9005.d: "Odporné."
 tournament_events.9006.t: "Turnajové historky"
 tournament_events.9006.desc: "Kolem [memory_holder.GetTitledFirstName] se shromáždil hlouček lidí a všichni zaujatě naslouchají vášnivému vyprávění.\n\n"
 tournament_events.9006.family: "„Osobní sláva je jedna věc, ale ta pravá se skrývá jinde.“ [memory_holder.GetFirstNameNoTooltip] [memory_holder.Custom('quirk_pos_present')]. „Rodina je tvou silou - bez ní nejsi nic! To mi připomíná jednu příhodu, jak [story_memory.GetDescription]...“"
 tournament_events.9006.martial: "„Síla paží je důležitá, ale ještě důležitější je síla #EMP ducha.#!“ [memory_holder.GetFirstNameNoTooltip] [memory_holder.Custom('quirk_pos_present')]. „Chceš-li se stát zdatným stratégem, musíš naslouchat příběhům o úspěších i nezdarech druhých. A právě to mi připomíná, jak [story_memory.GetDescription]...“"
 tournament_events.9006.death: "„Skutečný úspěch pramení z ničím nerušené mysli.“ [memory_holder.GetFirstNameNoTooltip] [memory_holder.Custom('quirk_pos_present')]. „Potlač vzpomínky, které tě rozptylují, a obrať slabiny protivníka proti němu. Poslechni si třeba tento příběh: [story_memory.GetDescription]...“"
 tournament_events.9006.war: "„Ptáte se, jak jsem se dostal až sem?“ [memory_holder.GetFirstNameNoTooltip] [memory_holder.Custom('quirk_pos_present')]. „Zažil jsem válku a vedl vojska proti mocným nepřátelům. Poslechněte si třeba příběh o tom, jak [story_memory.GetDescription]...“"
 tournament_events.9006.relationships: "„Vlastní schopnosti tě na turnaji dovedou jen určitou část cesty.“ [memory_holder.GetFirstNameNoTooltip] [memory_holder.Custom('quirk_pos_present')]. „O tvém osudu nakonec rozhodnou ti, kdo tě podporují, i ti, kdo ne. To mi připomíná jednu příhodu, jak [story_memory.GetDescription]...“"
 tournament_events.9006.travel: "„Cesta je stejně důležitá jako cíl, proto se neboj využít příležitosti!“ [memory_holder.GetFirstNameNoTooltip] [memory_holder.Custom('quirk_pos_present')]. „Nikdy bych se nedostal tak daleko, kdybych si cestou nevšímal každé příležitosti. Třeba tehdy, jak [story_memory.GetDescription]...“"
 tournament_events.9006.desc_end: "\n\nUplyne téměř půl hodiny, ale mně připadá jako pár vteřin. [memory_holder.GetFirstNameNoTooltip] zkrátka umí vyprávět!"
 tournament_events.9006.a: "Tohle se mi v nadcházejícím klání bude hodit!"
 tournament_events.9006.b: "Něco si z toho odnáším."
 lifestyle_experience_increased: "Zvýšení zkušeností životního stylu"
 you_learn_a_little: "Něco málo se naučíš"
 you_learn_a_lot: "Naučíš se toho hodně"
 tournament_events.9006.shy: "[Select_CString(ROOT.Char.IsFemale, 'Kéž bych také dokázala takhle mluvit před lidmi...', 'Kéž bych také dokázal takhle mluvit před lidmi...')]"
 tournament_events.9006.impatient: "To je ale ztráááta čááásu!"
 tournament_events.9007.t: "Rytířské povzbuzování"
 tournament_events.9007.desc: "„Tohle vyhraješ!“ zvolá [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hype_knight'))] [hype_knight.GetFirstName]. „Bude to hračka, stejně jako tehdy, když [hype_memory.GetSecondPerspectiveDescription] - jsi přece příliš [ROOT.Char.Custom('FormalComplimentAdjective')] a [ROOT.Char.Custom('ComplimentAdjective')] na to, abys [Select_CString(ROOT.Char.IsFemale, 'mohla prohrát', 'mohl prohrát')]!“\n\nJe příjemné vědět, že moji $knight_culture_player_plural_no_tooltip_lowercase$ stojí při mně!"
 tournament_events.9007.ambitious: "Mlč, ty [hype_knight.Custom('RaunchyComplimentNoun')] - to už dávno vím!"
 tournament_events.9007.a: "[Select_CString(ROOT.Char.IsFemale, 'Cítím se nezastavitelná!', 'Cítím se nezastavitelný!')]"
 tournament_events.9007.b: "Bez svých skvělých příznivců bych [Select_CString(ROOT.Char.IsFemale, 'nebyla', 'nebyl')] nic!"
 tournament_events.9007.c: "Mé vítězství je jisté. [ROOT.Char.GetFaith.HighGodName] stojí při mně."
 tournament_events.9008.t: "Šaškovo vystoupení"
 tournament_events.9008.desc: "„Pojďte všichni blíž! Pohleďte na [tournament_fool.Custom2('DescriptorPositive', SCOPE.sC('tournament_fool'))] [tournament_fool.GetFirstName]!“ volá pestře oděná postava a s vypětím všech sil balancuje na nose [tournament_fool.Custom('GetObjectToBalanceOnNose')].\n\n„A taky umím vyprávět! Co třeba něco veselého, třeba příběh o tom, jak [memory_story.GetThirdPerspectiveDescription]?“ pronese [tournament_fool.GetFirstNameNoTooltip] ve stoji na rukou.\n\n„Nebo by snad [ROOT.Char.GetLadyLord] raději slyšel něco #EMP pochmurného#!? Třeba příběh o tom, jak [memory_story_negative.GetThirdPerspectiveDescription]?“"
 tournament_events.9008.schemer: "#EMP Vím#!, že jsi slyšel něco šťavnatějšího..."
 tournament_events.9008.a: "Žádné nudné historky - chci vidět žonglování!"
 tournament_events.9008.b: "Pověz mi ten veselý příběh!"
 tournament_events.9008.c: "Pochmurný příběh navodí tu správnou náladu."
 cheery_disposition_modifier: "Veselá povaha"
 cheery_disposition_modifier_desc: "Tato postava působí optimisticky a přívětivě."
 grim_disposition_modifier: "Ponurá povaha"
 grim_disposition_modifier_desc: "Tato postava působí zachmuřeně a odhodlaně."
