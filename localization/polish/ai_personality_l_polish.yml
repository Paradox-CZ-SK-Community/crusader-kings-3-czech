 AI_PERSONALITY_NEUTRAL_EXPLANATION: "Tato postava má vyrovnanou osobnost a nebude jednat nijak zvlášť nápadným způsobem."
 AI_PERSONALITY_TOOLTIP: "#T Osobnost\n#!Osobnost postavy ovlivňuje rozhodnutí, která činí. Osobnost je určována především [Concept('traits','rysy')|E].\n\nPostavy ovládané hráči nemají Osobnost, protože jejich chování řídí hráči." # todo: CONCEPT CASE
