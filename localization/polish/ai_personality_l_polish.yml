 compassion_explanation: "Tato postava je #Bold poněkud soucitná#! a spíše neubližuje druhým, propouští [Concept('prisoners','vězni')|E] (zejména děti), podporuje [Concept('cultural_acceptance','kulturní přijetí')|E], nechává lidi [Concept('marry','uzavřít sňatek')|E] z lásky a navazuje [Concept('friends','přátelé')|E]. Méně často [GetScheme('murder').GetTypeName], [Concept('execute','popravit')|E] nebo [Concept('torture','mučení')|E] jiné postavy a méně ochotně používá [Concept('hostages','rukojmí')|E] jako pěšáky." # todo: CONCEPT CASE
 compassion_neg_explanation: "Tato postava je #Bold poněkud krutá#! a spíše ubližuje druhým, používá [Concept('hostile_schemes','nepřátelské intriky')|E], jako je [GetScheme('murder').GetTypeName], trestá [Concept('prisoners','vězni')|E] pomocí [Concept('execution','popravy')|E] a [Concept('torture','mučení')|E] a přidává se jako [Concept('agents','spolčenci')|E]. Sotva dbá na utrpení druhých." # todo: CONCEPT CASE
 compassion_strong_explanation: "Tato postava je #Bold velmi soucitná#! a výrazně častěji neubližuje druhým, propouští [Concept('prisoners','vězni')|E] (zejména děti), podporuje [Concept('cultural_acceptance','kulturní přijetí')|E], nechává lidi [Concept('marry','uzavřít sňatek')|E] z lásky a navazuje [Concept('friends','přátelé')|E]. Téměř nikdy nebude [GetScheme('murder').GetTypeName], [Concept('execute','popravit')|E] ani [Concept('torture','mučení')|E] jiné postavy a mnohem méně ochotně používá [Concept('hostages','rukojmí')|E] jako pěšáky." # todo: CONCEPT CASE
 compassion_strong_neg_explanation: "Tato postava je #Bold velmi krutá#! a výrazně častěji ubližuje druhým, používá [Concept('hostile_schemes','nepřátelské intriky')|E], jako je [GetScheme('murder').GetTypeName], trestá [Concept('prisoners','vězni')|E] pomocí [Concept('execution','popravy')|E] a [Concept('torture','mučení')|E] a přidává se jako [Concept('agents','spolčenci')|E]. Na utrpení druhých nedbá." # todo: CONCEPT CASE
