 honor_strong_neg_explanation: "Tato postava je #Bold velmi nečestná#! a výrazně častěji začne [Concept('hostile_schemes','snovat nepřátelské intriky')|El], zneužije své postavení [Concept('regent','regenta')|El], použije [Concept('blackmail','vydírání')|El], využije úkol rady $task_find_secrets$ [Concept('councillor_task','úkol rádce')|El], zadrží [Concept('hostages','rukojmí')|El] a zradí své [Concept('friends','přátele')|El] i [Concept('spouses','choti')|El]. Mnohem méně často dostojí svým závazkům a kvůli svým cílům se může snížit neuvěřitelně nízko."
