 compassion_explanation: "Tato postava je #Bold poněkud soucitná#! a spíše neubližuje druhým, propouští [Concept('prisoners','vězně')|El] (zejména děti), podporuje [Concept('cultural_acceptance','kulturní přijetí')|El], nechává lidi [Concept('marry','uzavřít sňatek')|El] z lásky a navazuje [Concept('friends','přátelství')|El]. Méně často [GetScheme('murder').GetTypeName], [Concept('execute','popravit')|El] nebo [Concept('torture','mučení')|El] jiné postavy a méně ochotně používá [Concept('hostages','rukojmí')|El] jako pěšáky."
 compassion_neg_explanation: "Tato postava je #Bold poněkud krutá#! a spíše ubližuje druhým, používá [Concept('hostile_schemes','nepřátelské intriky')|El], jako je [GetScheme('murder').GetTypeName], trestá [Concept('prisoners','vězně')|El] pomocí [Concept('execution','popravy')|El] a [Concept('torture','mučení')|El] a přidává se jako [Concept('agents','spolčenec')|El]. Sotva dbá na utrpení druhých."
 compassion_strong_explanation: "Tato postava je #Bold velmi soucitná#! a výrazně častěji neubližuje druhým, propouští [Concept('prisoners','vězně')|El] (zejména děti), podporuje [Concept('cultural_acceptance','kulturní přijetí')|El], nechává lidi [Concept('marry','uzavřít sňatek')|El] z lásky a navazuje [Concept('friends','přátelství')|El]. Téměř nikdy nebude [GetScheme('murder').GetTypeName], [Concept('execute','popravit')|El] ani [Concept('torture','mučení')|El] jiné postavy a mnohem méně ochotně používá [Concept('hostages','rukojmí')|El] jako pěšáky."
 compassion_strong_neg_explanation: "Tato postava je #Bold velmi krutá#! a výrazně častěji ubližuje druhým, používá [Concept('hostile_schemes','nepřátelské intriky')|El], jako je [GetScheme('murder').GetTypeName], trestá [Concept('prisoners','vězně')|El] pomocí [Concept('execution','popravy')|El] a [Concept('torture','mučení')|El] a přidává se jako [Concept('agents','spolčenec')|El]. Na utrpení druhých nedbá."
