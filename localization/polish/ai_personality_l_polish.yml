 honor_explanation: "Tato postava je #Bold čestná#! a lze jí více než většině důvěřovat, že uchová [Concept('secrets','tajemství')|El], bude dodržovat [Concept('laws','zákony')|El], plnit svou povinnost jako [Concept('regent','regent')|El] a ctít závazky, jako jsou [Concept('alliances','aliance')|El], péče o [Concept('hostages','rukojmí')|El] a jejich navracení. Je nepravděpodobné, že bude [Concept('blackmail','vydírat')|El], snovat [Concept('hostile_schemes','nepřátelské intriky')|El] nebo působit jako [Concept('agents','spolčenec')|El]."
