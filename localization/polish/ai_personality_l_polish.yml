 AI_VASSAL_STANCE_TT: "\n$EFFECT_LIST_BULLET$[Concept('vassal_stance','Vazalský postoj')|E]: [Character.GetVassalStance.GetTextIcon][Character.GetVassalStance.GetName]" # todo: CONCEPT CASE
 AI_PERSONALITY_CONCEPT_TT: "#weak [Character.GetShortUINameNoTooltip] se bude k vám i ostatním chovat podle své Osobnosti, která je určena především [Character.GetHerHis] [Concept('personality_traits','osobnostní rysy')|E]#!" # todo: CONCEPT CASE
 AI_PERSONALITY_TT: "#T Přehled osobnosti:#!\n$EFFECT_LIST_BULLET$[Concept('character_personality','Osobnost postavy')|E]: [personality_i] [Character.GetAIPersonality][AddLocalizationIf( Character.IsRuler, 'AI_ECONOMIC_ARCHETYPE_TT' )][AddLocalizationIf( And( Not( Character.IsIndependentRuler ), Character.IsRuler ), 'AI_VASSAL_STANCE_TT' )]\n\n$AI_PERSONALITY_CONCEPT_TT$." # todo: CONCEPT CASE
