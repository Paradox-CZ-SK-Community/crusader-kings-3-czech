 tournament_favor_glove: "rukavice"
 tournament_favor_sleeve: "rukáv"
 tournament_favor_scarf: "šátek"
 blooded_blade: "Krvavá čepel"
 blooded_blade_description: "Vířivé, rozeklané vzory na této zbrani nenápadně poukazují na poměrnou křehkost čepele, ale také na její původ. Zbraň byla kalena v krvi postavy [ROOT.Char.GetTitledFirstName]."
 sullied_blooded_blade: "Poskvrněná čepel"
 sullied_blooded_blade_description: "Vířivé, rozeklané vzory na této zbrani nenápadně poukazují na celkově nízkou kvalitu čepele, ale také na její původ. Zbraň byla kalena v krvi postavy [ROOT.Char.GetTitledFirstName]."
 fake_papal_tiara_name: "Falešná papežská tiára"
 fake_papal_tiara_description: "Vysoká napodobenina papežské mitry, která při bližším pohledu možná není úplně přesvědčivá. Ale trochu zábavy neuškodí, ne?"
 artisanal_sword: "Meč postavy [ROOT.Char.GetFirstName]"
 artisanal_sword_description: "Nádherně zhotovený meč, jehož drahokamy zdobená hlavice doplňuje pohledná, ale pevná rukojeť. Vzorovaná čepel je dokonale vyvážená a její hrot se zužuje až do pronikavě tenké špičky."
