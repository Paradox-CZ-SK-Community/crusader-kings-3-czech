 feature_generic_material_metal_iron: "$metal_iron$"
 feature_generic_material_metal_pewter: "$metal_pewter$"
 feature_generic_material_metal_brass: "$metal_brass$"
 feature_generic_material_metal_steel: "$metal_steel$"
 feature_generic_material_metal_bronze: "$metal_bronze$"
 feature_generic_material_metal_copper: "$metal_copper$"
 feature_generic_material_earthware_clay: "$earthware_clay$"
 feature_generic_material_earthware_terracotta: "$earthware_terracotta$"
 feature_generic_material_earthware_stone: "$earthware_stone$"
 feature_generic_material_earthware_porcelain: "$earthware_porcelain$"
 artifact_oxus_bracelet_name: "Oxský náramek"
 artifact_oxus_bracelet_description: "Tento nádherně zpracovaný náramek údajně pochází ze země $k_transoxiana$. Ačkoli smaltované vykládání a polodrahokamy jsou již dávno ztraceny, zlato si uchovalo svůj lesk. Podobné náramky byly ve starověku čestnými dary na dvorech králů králů, a tak jej možná kdysi nosil nějaký velký pán v Babylonu."
 fp3_incense_burner_sculpture: "Soška kadidelnice"
 fp3_incense_burner_sculpture_desc: "Tato kadidelnice ve tvaru kočkovité šelmy vypouští vonný dým četnými otvory ve svém těle. Hlava s očima osazenými drahokamy je opatřena pantem, aby bylo možné dovnitř vložit hořící kadidlo."
 fp3_ancient_drinking_vessel: "Achajmenovská nádoba na pití"
 fp3_ancient_drinking_vessel_desc: "Tento bohatě zdobený pohár je zakončen podobou kozy. Byl zhotoven v dávno zapomenutých časech, jeho krása však nevybledla."
 artifact_sassanian_sword_name: "Sásánovský meč"
 artifact_sassanian_sword_description: "Tento meč, údajný pozůstatek dávné sásánovské éry, $sassanian_sword_description_base$, takže je na něj nádherný pohled. Dnes je již příliš křehký, než aby jej bylo možné vzít do bitvy, ale možná jej kdysi třímal hrdina, jehož jméno odvál čas."
 artifact_sassanian_replica_sword_name: "Meč v sásánovském stylu"
 sassanian_sword_description_base: "je zdoben několika drahokamy a složitými vzory"
 famed_replica_sassanian_sword_description: "Tento meč byl inspirován představou slavné zaniklé éry a odkazuje na hrdinskou minulost předků svého tvůrce. $sassanian_sword_description_base$, takže je na něj nádherný pohled. Kdo jej třímá, připomíná legendární krále dávných časů."
 masterwork_replica_sassanian_sword_description: "Tento meč je zjevně zamýšlen jako napodobenina zbraní dávnější éry a odkazuje na hrdinskou minulost předků svého tvůrce. $sassanian_sword_description_base$. Přestože je pouhou vzdálenou ozvěnou minulosti, s mečem v ruce si lze snadno představit, že člověk je mocným pánem dávno zaniklé éry."
 common_replica_sassanian_sword_description: "Tato ubohá napodobenina je výsměchem předkům svého tvůrce. Je vykládána levnými kameny a zdobena nerovnými, hrubými vzory. Kdo ji nosí u pasu v pochvě, vypadá jako pomatený hlupák toužící po návratu do dávno zaniklých časů."
 artifact_magnificent_crown_name: "Velkolepá koruna"
 artifact_magnificent_crown_description: "Nádherná filigránová výzdoba a jemně zpracované vzory této koruny pouze zdůrazňují skutečný důvod její existence. Ryté reliéfy předků postavy [ROOT.Char.GetFirstName] připomínají jejich autoritu a propojují ji s autoritou současného nositele."
 artifact_splendid_necklace_name: "Skvostný náhrdelník"
 artifact_splendid_necklace_description: "Tento nádherný náhrdelník obepíná erb rodu [artifact.GetOwner.GetHouse.GetBaseName], takže o legitimitě jeho nositele nemůže být pochyb."
 artifact_fine_brooch_name: "Znamenitá brož"
 artifact_fine_brooch_description: "Nenápadné připomínání jména rodu [artifact.GetOwner.GetHouse.GetBaseName] po okrajích této brože rychle šíří povědomí o jeho legitimitě."
 medicine_jar: "Lékárnická nádoba"
 medicine_jar_desc: "Tato nádoba z jemně glazované keramiky obsahuje vzácné a účinné byliny, léčivé minerály a různé sušené části zvířat, které lékaři používají při léčbě nemocí a vyvažování tělesných šťáv."
 whale_fat_candles_name: "Svíčky z velrybího tuku"
 whale_fat_candles_description: "Tyto svíčky byly vyrobeny z tuku strašlivého leviatana. Výhrůžně z nich trčí ostny velrybího tuku."
 warenne_coin: "Warrennská mince"
 warenne_coin_description: "Na líci této mince je modrožlutý šachovnicový znak dynastie Warenne. Její okraj potřísnila tmavá skvrna krve."
 traitors_head: "Hlava zrádce"
 traitors_head_description: "Hlava oddělená od těla, čistě useknutá svému někdejšímu majiteli. Je spíše varováním než památkou."
 artifact_: "Zničený artefakt"
 artifact_slot_untyped: "Zničený artefakt             "
 artifact_tale_of_genji: "Příběh prince Gendžiho"
 artifact_tale_of_genji_description: "Příběh prince Gendžiho, údajně inspirovaný životem Minamota $TO_ru$, je dílo podobné románu, které napsala dvorní dáma Murasaki. Vypráví o životě a milostných dobrodružstvích smyšleného prince Gendžiho, císařova syna."
 artifact_pillow_book: "Důvěrné sešity"
 artifact_pillow_book_description: "Takzvané Důvěrné sešity, které básnířka a dvorní dáma Sei Šónagon sepsala jako svůj soukromý deník, nabízejí pohled na každodenní klepy, milostné vztahy a dramata japonské aristokracie."
