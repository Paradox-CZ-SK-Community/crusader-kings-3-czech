 morin_khuur_ornament_name: "Koňská ozdoba morin chuuru"
 morin_khuur_ornament_description: "Koňská hlava vyřezaná z koňské kosti, která obvykle zdobí vrchol smyčcového nástroje morin chuur. Během svých dobrodružství ji [inspiration_owner.GetTitledFirstNameNoTooltip] [Select_CString(inspiration_owner.IsFemale, 'zaslala', 'zaslal')] jako dar. [owner.GetTitledFirstNameNoTooltip] ji [Select_CString(owner.IsFemale, 'převzala', 'převzal')]."
 animal_ring_name: "Křiklavý tygří prsten"
 animal_ring_description: "Je posázený drahokamy a hýří až příliš mnoha barvami, takže s ním spíš oslepíš své dvořany, než abys na ně udělal dojem svým vkusem. Během svých dobrodružství jej [inspiration_owner.GetTitledFirstNameNoTooltip] [Select_CString(inspiration_owner.IsFemale, 'zaslala', 'zaslal')] jako dar. [owner.GetTitledFirstNameNoTooltip] jej [Select_CString(owner.IsFemale, 'převzala', 'převzal')]."
 ostrich_shell_necklace_name: "Náhrdelník z korálků pštrosích skořápek"
 ostrich_shell_necklace_description: "Jemný šperk zářivě bílé barvy. Během svých dobrodružství jej [inspiration_owner.GetTitledFirstNameNoTooltip] [Select_CString(inspiration_owner.IsFemale, 'zaslala', 'zaslal')] jako dar. [owner.GetTitledFirstNameNoTooltip] jej [Select_CString(owner.IsFemale, 'převzala', 'převzal')]."
 pilgrimage_figurine_name: "Figurka svatého Vartana ze sépiové kosti"
 pilgrimage_figurine_description: "Figurka Vartana Mamikonjana, arménského vojevůdce, který v bitvě u Avarajru roku 451 zajistil Arménům právo vyznávat křesťanství. Jeho přilbu zdobí bronzové detaily. Během svých dobrodružství ji [inspiration_owner.GetTitledFirstNameNoTooltip] [Select_CString(inspiration_owner.IsFemale, 'zaslala', 'zaslal')] jako dar. [owner.GetTitledFirstNameNoTooltip] ji [Select_CString(owner.IsFemale, 'převzala', 'převzal')]."
 saint_margaret_fingernails_name: "Nehty svaté Markéty"
 saint_margaret_fingernails_description: "Svatá Markéta Antiochijská proslula tím, že draka zabila pouhými podpatky svých bot. Tyto staré a odporné odstřižky nehtů jí údajně patřily. Během svých dobrodružství je [inspiration_owner.GetTitledFirstNameNoTooltip] [Select_CString(inspiration_owner.IsFemale, 'zaslala', 'zaslal')] jako dar. [owner.GetTitledFirstNameNoTooltip] je [Select_CString(owner.IsFemale, 'převzala', 'převzal')]."
 seahorse_brooch_name: "Zlatá brož s mořským koníkem"
 seahorse_brooch_description: "Brož s jemnými řetízkovými střapci visícími pod koněm, který má křídla a ocas zakončený ploutví. Během svých dobrodružství ji [inspiration_owner.GetTitledFirstNameNoTooltip] [Select_CString(inspiration_owner.IsFemale, 'zaslala', 'zaslal')] jako dar. [owner.GetTitledFirstNameNoTooltip] ji [Select_CString(owner.IsFemale, 'převzala', 'převzal')]."
 leopard_hat_name: "Leopardí čapka"
 leopard_hat_description: "Čapka vyrobená z hlavy levharta, kterého [inspiration_owner.GetTitledFirstName] [Select_CString(inspiration_owner.IsFemale, 'zabila', 'zabil')]."
 kurgan_ornament_name: "Skytská figurka pantera"
 kurgan_ornament_description: "Kamenná figurka, kterou [inspiration_owner.GetTitledFirstName] [Select_CString(inspiration_owner.IsFemale, 'uloupila', 'uloupil')] ze starého skytského kurganu."
 kurgan_saddle_name: "Sedlo z kurganu"
 kurgan_saddle_description: "Sedlo, které [inspiration_owner.GetTitledFirstName] [Select_CString(inspiration_owner.IsFemale, 'ukořistila', 'ukořistil')] ve skytské pohřební mohyle. Je přes tisíc let staré a uchovalo se v uzavřené hrobce mezi těly desítek nabalzamovaných koní. Možná se můžeme něčemu přiučit od dávných válečníků bojujících ze sedla."
 naked_tapestry_name: "Tapiserie s aktem"
 naked_tapestry_description: "Nahé vyobrazení postavy [inspiration_owner.GetTitledFirstName] v oáze na pobřeží, kde se ovívá listem a její tělo se leskne křišťálově čistými kapkami vody."
 frogspawn_jar_name: "Sklenice se žabími vajíčky"
 frogspawn_jar_description: "Sklenice plná čvachtajících žabích vajíček a několika již vylíhlých pulců. Jako ukázku hrůz číhajících pod širým nebem ji [inspiration_owner.GetTitledFirstName] [Select_CString(inspiration_owner.IsFemale, 'zaslala', 'zaslal')]. [ROOT.Char.GetTitledFirstNameNoTooltip] ji [Select_CString(ROOT.Char.IsFemale, 'převzala', 'převzal')].\n\nVrtí se!"
 beaver_book_name: "Bobří paláce"
 beaver_book_description: "Kniha o bobří architektuře a stavebních technikách. [inspiration_owner.GetTitledFirstName] ji během svých cest [Select_CString(inspiration_owner.IsFemale, 'sepsala a doplnila', 'sepsal a doplnil')] náčrty."
 crocodile_tapestry_name: "Krokodýlí tapiserie"
 crocodile_tapestry_description: "Tapiserie zobrazující krokodýla, kterou [inspiration_owner.GetTitledFirstName] [Select_CString(inspiration_owner.IsFemale, 'zhotovila, jak nejlépe uměla', 'zhotovil, jak nejlépe uměl')]. Tvor je jasně červený, má několik řad tesáků, jedovaté puchýře a ocas s ostny. Obklopuje jej hnízdo plné vajec v jeskyni za vodopádem."
 mountain_rock_name: "Horský kámen"
 mountain_rock_description: "Velký kámen, který [inspiration_owner.GetTitledFirstName] [Select_CString(inspiration_owner.IsFemale, 'namáhavě vláčela', 'namáhavě vláčel')] celou cestu domů. [mountain_location.GetName] je místem, odkud jej [Select_CString(inspiration_owner.IsFemale, 'přinesla', 'přinesl')]."
 reichskrone_name: "Říšská koruna"
 reichskrone_description: "Symbol úřadu císaře Svaté říše římské. Zaručeně upoutá pozornost každého vévody, který půjde kolem."
 nikephoros_crown_name: "Koruna Nikefora II. Fokase"
 nikephoros_crown_description: "Koruna jednoho z nejlepších taktiků, jaké kdy císařská dynastie poznala. Ve válkách na západ od říše neuspěl, na východě však byl dobyvatelem."
 skull_cap_charlemagne_name: "Temeno Karla Velikého"
 skull_cap_charlemagne_description: "V této schránce je uchováno samotné temeno Karla Velikého. Snad jeho moudrost sestoupí i na majitele."
 papal_tiara_name: "Papežská tiára"
 papal_tiara_description: "Drahokamy posázená mitra se zlatou korunou, která symbolizuje papežský úřad. Ale nevypadala by nejskvostněji právě na tvé hlavě?"
 essen_crown_name: "Dětská koruna"
 essen_crown_description: "Někteří tvrdí, že tato koruna byla zhotovena pro korunovaci Oty III. v Essenu, jiní zase, že měla korunovat sochu Panny Marie. Ať je to jakkoli, je velmi malá, ale když se budeš snažit, možná ji na hlavu přece jen vměstnáš."
 monomachus_crown_name: "Koruna Konstantina IX. Monomacha"
 monomachus_crown_description: "Korunu tvoří zlaté destičky s portréty Konstantina IX. Monomacha, jeho manželky Zoe, její sestry Theodory a několika alegorických tanečních postav."
 edmund_head_name: "Hlava svatého Edmunda"
 edmund_head_description: "Edmund už od narození požadoval, aby se stal světcem. Podle legend byl králem Východní Anglie, který se raději dobrovolně obětoval Vikingům, než aby jim dovolil povraždit svůj lid."
 dhammapada_name: "Dhammapada"
 dhammapada_description: "Sbírka Buddhových výroků zapsaná v nádherném rukopisu na palmových listech."
 excalibur_name: "„Excalibur“"
 excalibur_description: "V Británii snad není panovníka, který by netvrdil, že vlastní pravý Excalibur. Prodejem Excaliburů se financují války a tobě nezbývá než doufat, že tví hosté neuvidí někoho jiného, jak se chlubí stejným mečem."
 vinaya_pitaka_name: "Vinajapitaka"
 vinaya_pitaka_description: "Jeden ze tří buddhistických spisů Pálijského kánonu. Tento text obsahuje pravidla mnišského života a zásady chování mnichů a mnišek."
 sutta_pitaka_name: "Suttapitaka"
 sutta_pitaka_description: "Théravádový buddhistický text vycházející z prvního buddhistického koncilu konaného po Buddhově smrti. Obsahuje mnoho básní a kázání připisovaných Buddhovi a jeho žákům. Je součástí Pálijského kánonu."
 abhidhamma_pitaka_name: "Abhidhammapitaka"
 abhidhamma_pitaka_description: "Podrobné učené dílo rozebírající Buddhovo učení. Je součástí Pálijského kánonu."
 brooch_decoration_centerpiece_and_adornment: "Tvoří ji [SCOPE.Custom('BroochDecorationCenterpiece')] [SCOPE.Custom('BroochDecorationAdornment')]"
