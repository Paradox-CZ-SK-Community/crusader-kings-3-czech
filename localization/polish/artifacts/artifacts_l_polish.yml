 tiny_sculpture_trinket_name: "Miniaturní soška"
 tiny_sculpture_trinket_description: "Drobná soška postavy [statue_owner.GetTitledFirstNameNoTooltip]. Vejde se do kapsy a je připravena vládnout. [inspiration_owner.GetTitledFirstNameNoTooltip] ji [Select_CString(inspiration_owner.IsFemale, 'vytvořila', 'vytvořil')]."
 tiny_box_trinket_name: "Miniaturní skříňka"
 tiny_box_trinket_description: "Drobná, ale záhadná skříňka. Možná po otevření vypustí do světa jediný hřích. [inspiration_owner.GetTitledFirstNameNoTooltip] ji [Select_CString(inspiration_owner.IsFemale, 'vytvořila', 'vytvořil')]."
 tiny_chest_trinket_name: "Miniaturní truhlička"
 tiny_chest_trinket_description: "Drobná zamčená truhlička velká sotva jako palec. Když se s ní zatřese, zachrastí a prozradí, že uvnitř něco ukrývá. [inspiration_owner.GetTitledFirstNameNoTooltip] ji [Select_CString(inspiration_owner.IsFemale, 'vytvořila', 'vytvořil')]."
 tiny_cabinet_trinket_name: "Miniaturní skříň"
 tiny_cabinet_trinket_description: "Skříňka tak malá, že by se nejspíš měla uchovávat v jiné skříni, aby ji někdo nezašlápl. [inspiration_owner.GetTitledFirstNameNoTooltip] ji [Select_CString(inspiration_owner.IsFemale, 'vytvořila', 'vytvořil')]."
 tiny_throne_trinket_name: "Miniaturní trůn"
 tiny_throne_trinket_description: "Trůn jako stvořený pro myš či jiného hlodavce, aby z něj vládl. [inspiration_owner.GetTitledFirstNameNoTooltip] jej [Select_CString(inspiration_owner.IsFemale, 'vytvořila', 'vytvořil')]."
 prince_archivist_love_poem_name: "Já měsíc, ty slunce"
 prince_archivist_love_poem_description: "Balada o lásce dvou mužů, prince a archiváře, kteří spolu na vrcholu věže daleko od zvědavých očí pozorují hvězdy a mezi nimi nacházejí jeden druhého. Podle pověstí vychází postava archiváře ze zkušeností autora [inspiration_owner.GetTitledFirstNamePossessiveNoTooltip]."
 witch_queen_love_poem_name: "Očarované srdce"
 witch_queen_love_poem_description: "Báseň o lásce dvou žen, čarodějnice a královny, která zabloudila v lese poblíž její chalupy. Obě nacházejí útěchu v chvilce stranou od společnosti. Šeptá se, že čarodějnice je karikaturou samotné autorky [inspiration_owner.GetTitledFirstNameNoTooltip]."
 book_artifact_title_desc: "Tato kniha je vázána v kůži a podrobně popisuje všechny oběti a namáhavou práci věnované tomu, jak [SCOPE.Custom('ArtifactBookSubject')] titul [relevant_title.GetName]."
 book_artifact_no_topic_desc: "Tato kniha je vázána v kůži a velmi podrobně pojednává o tématu [SCOPE.Custom('ArtifactBookSubject')], včetně detailních ilustrací a ozdobných marginálií."
 book_artifact_other_desc: "Tato kniha je vázána v kůži a prokazuje [SCOPE.Custom('ArtifactArticleBookContentQuality')] znalost tématu [SCOPE.Custom('ArtifactBookSubject')], přičemž se dotýká například témat jako [SCOPE.Custom('ArtifactBookTopic')]."
