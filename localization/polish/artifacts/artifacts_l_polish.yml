 translated_arabic_book_de_materia_medica_name: "#italic O léčivých látkách#!"
 translated_arabic_book_de_materia_medica_desc: "Ilustrovaný opis Dioskoridova pětisvazkového lékopisu o léčebném využití nejrůznějších rostlin, sepsaného ve starověké Alexandrii a $translated_arabic_book_shared_desc$"
 translated_arabic_book_on_ascensions_name: "#italic O východech hvězd#!"
 translated_arabic_book_on_ascensions_desc: "Opis Hypsiklovy astronomické rozpravy o pohybu znamení zvěrokruhu po obloze, sepsané ve starověké Alexandrii a $translated_arabic_book_shared_desc$"
 translated_arabic_book_elements_name: "#italic Základy#!"
 translated_arabic_book_elements_desc: "Opis Eukleidova třináctisvazkového matematického pojednání o geometrii, logice a jejich důkazech, sepsaného ve starověké Alexandrii a $translated_arabic_book_shared_desc$"
 translated_arabic_book_on_the_soul_name: "#italic O duši#!"
 translated_arabic_book_on_the_soul_desc: "Opis Aristotelova starověkého pojednání ve třech knihách o povaze duše a jejích sklonech, $translated_arabic_book_shared_desc$"
 translated_arabic_book_thucydides_name: "#italic Thúkydidovy Dějiny#!"
 translated_arabic_book_thucydides_desc: "Opis Thúkydidova starověkého líčení peloponéské války mezi Athénami a Spartou, $translated_arabic_book_shared_desc$"
 translated_arabic_book_plutarch_name: "#italic Plútarchovy Životopisy#!"
 translated_arabic_book_plutarch_desc: "Opis Plútarchových srovnávacích životopisů významných starověkých vůdců a jejich mravních vlastností, $translated_arabic_book_shared_desc$"
 translated_arabic_book_shared_desc: "přeložený do arabštiny z původní řečtiny na objednávku, kterou [ROOT.Char.GetTitledFirstNameNoTooltipRegnal] [Select_CString(ROOT.Char.IsFemale, 'zadala', 'zadal')]."
 dress_me_artifact_desc: "Nádherný oděv zhotovený těmi nejzručnějšími krejčími, který si [ROOT.Char.GetTitledFirstNameNoTooltipRegnal] [Select_CString(ROOT.Char.IsFemale, 'objednala', 'objednal')], aby jeho nádherou ohromil celý dvůr."
 improvised_halberd_desc: "Tato narychlo sestavená varianta halapartny je zakončena kosířem, díky čemuž jde o improvizovanou zbraň, která se v nouzi může velmi hodit."
 improvised_dagger_desc: "Tato improvizovaná dýka vznikla úpravou zemědělského nástroje a zachovala si jeho praktičnost i schopnost dobře řezat."
 improvised_billhook_desc: "Tento jednoruční kosíř se používá k osekávání větví keřů. Králi se sice sotva sluší, jeho zahnutá čepel však překvapivě dobře nachází mezery ve zbroji."
 football_cup_desc: "Tento pohár byl zhotoven na památku vítězství ve fotbalovém utkání."
 participation_trophy_desc: "Tento pohár byl zhotoven na památku „vítězství“ ve fotbalovém utkání."
 perfume_bottle_description: "[ROOT.Char.GetFirstNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'nasbírala', 'nasbíral')] přísady pro tuto vůni."
 maritime_trading_handbook: "Příručka námořního obchodu"
 maritime_trading_handbook_description: "Odborně sepsaná příručka o námořních obchodních praktikách [merchant_character_scope.GetCulture.GetName] kultury."
 own_holy_text_mid: "Posvátný text [root_scope.GetFaith.ReligiousText|U] zdobený drahokamy"
 own_holy_text_mid_description: "Posvátný text [root_scope.GetFaith.ReligiousText|U] zdobený vsazenými drahokamy."
 merchants_holy_text_mid: "Posvátný text [merchant_character_scope.GetFaith.ReligiousText|U] zdobený drahokamy"
 merchants_holy_text_mid_description: "Posvátný text [merchant_character_scope.GetFaith.ReligiousText|U] zdobený vsazenými drahokamy."
 merchants_sword: "Meč [merchant_character_scope.GetCulture.GetName] kultury"
 merchants_sword_description: "Kvalitní čepel zakoupená od potulného obchodníka z [merchant_character_scope.GetCulture.GetNameNoTooltip] kultury."
 jewelled_slippers: "Drahokamy zdobené střevíce"
 jewelled_slippers_description: "Nádherný pár střevíců posázených drahokamy. Když je máš na nohou, cosi ti našeptává, že vždy dokážeš najít cestu domů."
 witchcraft_book: "Kniha bylinných léčiv"
 witchcraft_book_description: "Kniha, která kdysi patřila čarodějnici z místa [ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTier]. Její stránky jsou plné jednoduchých bylinných léčiv určených k vyvažování tělesných šťáv."
 witchy_holy_text_mid: "Posvátný text [witch_scope.GetFaith.ReligiousText|U] zdobený drahokamy"
 witchy_holy_text_mid_description: "Posvátný text [witch_scope.GetFaith.ReligiousText|U] zdobený vsazenými drahokamy."
 immaculate_witchy_bones: "Neposkvrněné kosti čarodějnice"
 immaculate_witchy_bones_description: "Hromada kostí, které kdysi patřily čarodějnici z místa [ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTier]. [Select_CString(witch_scope.IsFemale, 'Ani po upálení čarodějnice', 'Ani po upálení čaroděje')] neztratily svou neposkvrněnost."
 mysterious_lamp: "Tajemná lampa"
 mysterious_lamp_description: "Zářivá zlatá lampa posázená drahokamy. Když ji držíš, cítíš v ní jakousi fenomenální kosmickou moc."
 mysterious_puzzle: "Tajemný hlavolam"
 mysterious_puzzle_description: "Okázalý zlatý hlavolam pokrytý rytinami v cizím jazyce. Říká se, že kdysi patřil mocnému mistru hry."
 lunchbox: "Konzervační schránka"
 lunchbox_description: "Pevně uzavřená schránka, která jako by prodlužovala dobu, po kterou v ní uložené potraviny zůstávají poživatelné."
