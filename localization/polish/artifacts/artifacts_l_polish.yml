 artifact_pedestal_koh_i_noor_name: "Hora světla"
 artifact_pedestal_koh_i_noor_description: "Diamant nebývalé velikosti a čistoty. Říká se, že byl vytěžen v dolech jihovýchodní Indie, jeho skutečný původ však nejspíš nikdo nezná."
 artifact_jewelled_danda_name: "Drahokamy zdobená danda"
 artifact_jewelled_danda_description: "Bohatě zdobené indické žezlo posázené drahokamy, nejvyšší symbol královské moci a panovníkova práva trestat své poddané."
 artifact_aruval_name: "Starobylý aruval"
 artifact_aruval_description: "Tento dlouhý aruval je údajně tak starý, že se říká, že jej kdysi mohl třímát sám Karuppu Sami."
 artifact_khanda_name: "Obřadní khanda"
 artifact_khanda_description: "Tato khanda byla zhotovena pro obřady, nikoli pro boj, a po celé generace připomíná nutnost rozetnout závoj nevědomosti."
 artifact_makarakundala_name: "Makarakundala"
 artifact_makarakundala_description: "Náušnice podobné těm, které nosívají bohové. Někteří dokonce tvrdí, že tento konkrétní pár kdysi patřil božským bytostem."
 artifact_cintamani_name: "Kámen čintámani"
 artifact_cintamani_hindu_description: "Kámen, který údajně kdysi spadl z nebe. Někteří tvrdí, že patřil Višnuovi či králi nágů a že svému majiteli přináší blahobyt."
 artifact_cintamani_buddhist_description: "Kámen, který údajně kdysi spadl z nebe. Někteří tvrdí, že jej kdysi drželi bódhisattvové Avalókitéšvara a Kšitigarbha a že také plní přání těch, kdo jej vlastní."
 artifact_navaratna_name: "Navaratna"
 artifact_navaratna_description: "Řetěz z devíti drahokamů s velkým rubínem uprostřed, symbolizující devět nebeských božstev hinduismu."
 artifact_shankha_conch_name: "Lastura šankha"
 artifact_shankha_conch_description: "Tato starobylá lastura šankha, emblém boha Višnua, se používá jako polnice při náboženských obřadech a je považována za symbol blahobytu a ctnosti."
 artifact_pedestal_great_diamond_name: "Velký diamant"
 artifact_pedestal_great_diamond_description: "Tento obrovský drahokam údajně kdysi zdobil chrámovou sochu, než jej odnesl chamtivý vetřelec."
 al_taj_crown_name: "al-Tádž aš-Šaríf"
 al_taj_crown_description: "„Ctihodná koruna“ neboli „Ovinutí úcty“ je tradiční procesní korunou fátimovských chalífů. Zdobí ji obrovský drahokam zvaný „al-Jatíma“."
 qadib_al_mulk_name: "Kadíb al-Mulk"
 qadib_al_mulk_description: "Procesní hůl Fátimovského chalífátu, pokrytá zlatem a osazená perlami a drahokamy."
 ryukyu_shaku_name: "Šaku tří hor"
 ryukyu_shaku_description: "Lakovaná obřadní hůl vyřezaná z posvátného ostrovního cedru, symbolizující sjednocení klanů pod jediným božským mandátem."
 ryukyu_crown_name: "Dračí koruna"
 ryukyu_crown_description: "Koruna vykládaná korály, završená zlatým mořským drakem svírajícím perlu moudrosti. Její záře se odráží od vln jako maják moci a prosperity."
 al_sayf_al_khass_name: "as-Sajf al-Cháss"
 al_sayf_al_khass_description: "Tento drahokamy zdobený meč byl údajně ukován z blesku. Uchovává se ve zlatém pouzdře pokrytém nápisy, které kvůli jeho obřadnímu významu pro chalífát opouští jen zřídka."
 al_dawat_name: "ad-Dawát"
 al_dawat_description: "Kalamář vyrobený ze zlata a korálu. Po dlouhou dobu zastává zvláštní úlohu při obřadech chalífátu."
 al_hafir_name: "al-Háfir"
 al_hafir_description: "Tento rudý rubín známý jako al-Háfir neboli „Kopyto“ dosahuje kvality, jakou lze v tomto světě spatřit jen zřídka. Je přišit k hedvábí a obklopen kruhem smaragdových tyčinek. Tradičně zdobí čelo chalífova koně."
 artifact_wall_banner_thankfulness_name: "Prapor vděčnosti"
 artifact_wall_banner_thankfulness_description: "Tento bílý hedvábný prapor je popsán zlatými písmeny a ovinut kolem zlatého kopí. Tradičně se tento prapor a jeho protějšek nosí při chalífských procesích."
 artifact_arms_of_alex_name: "Alexandrova zbroj"
 artifact_arms_of_alex_description: "Tato starobylá souprava zbroje z vrstveného lnu údajně kdysi patřila Alexandru Velikému. Ačkoli už není vhodná k nošení, stále v sobě nese odkaz velkého dobyvatele známého od Středomoří až po hranice Indie."
 artifact_pedestal_al_jabal_name: "al-Džabal"
 artifact_pedestal_al_jabal_description: "Prsten zdobený velkým rubínem známým jako al-Džabal neboli „Hora“. Kámen dosahuje nebývalé velikosti a říká se, že samotný prsten nosili sásánovští císaři Persie."
 artifact_pedestal_al_yatima_name: "al-Jatíma"
 artifact_pedestal_al_yatima_description: "Tato obrovská perla známá jako al-Jatíma neboli „Sirotek“ se údajně nepodobá žádné jiné na tomto světě. Je sirotkem mezi rodinami drahokamů a perel."
 artifact_dagger_of_rostam_name: "Rostamova dýka"
 artifact_dagger_of_rostam_description: "Tato důmyslně zdobená dýka je údajně tou, kterou Rostam zabil bílého daévu."
 artifact_spear_of_ascalon_name: "Ascalon"
 artifact_spear_of_ascalon_description: "Toto staré zlomené kopí je údajně částí kopí, kterým svatý Jiří zabil draka z Bejrútu."
 artifact_zomorrodnegar_name: "Šamšír-e Zomorrodnegar"
 artifact_zomorrodnegar_description: "Tento meč posázený smaragdy je údajně bájnou Šalomounovou čepelí, kterou zabil démona Fulád-zereha."
 artifact_muhammads_epistles_name: "Dopis od Muhammada"
 artifact_muhammads_epistles_description: "Tento dopis je součástí korespondence mezi prorokem Muhammadem a vládci oblasti [newly_created_artifact.Custom('EpistleReciever')|U]."
 epistle_syria: "Sýrie"
 epistle_arabia: "arabských kmenů"
 epistle_persia: "Persie"
 epistle_byzantium: "Východořímské říše"
 epistle_bahrain: "Bahrajnu"
 artifact_kaves_apron_name: "Káveho zástěra"
 artifact_kaves_apron_description: "Tato potrhaná vlajka je údajně legendárním praporem, který si perský kovář Káve vyrobil ze své zástěry, aby shromáždil svůj lid k boji proti zlému vládci."
 artifact_joyeuse_name: "Joyeuse"
 artifact_joyeuse_description: "Meč Karla Velikého, ukovaný tak, aby v sobě uchovával Longinovo kopí. Joyeuse je symbolem rytířské udatnosti i královského odkazu říše Karla Velikého."
 artifact_durendal_name: "Durendal"
 artifact_durendal_description: "Tento krátký a těžký meč je údajně legendárním Durendalem, který Roland před smrtí ukryl, aby nepadl do rukou nepřátel koruny."
 artifact_curtana_name: "Curtana"
 artifact_curtana_description: "Tento meč je údajně Curtana, Meč milosrdenství. Legendární zbraní kdysi Tristan bojoval proti Morholtovi. Právě tehdy také měla přijít o špičku, jejíž kus zůstal vězet v tlusté lebce irského obra."
 artifact_ring_angelica_name: "Angelikin prsten"
 artifact_ring_angelica_description: "Prsten, který údajně nosila samotná Angelika známá z příběhů o Rolandovi a Karlu Velikém. Jeho moc už zřejmě vyprchala, protože neviditelnost očividně neposkytuje, stále však zůstává nádherným symbolem této dávno zesnulé princezny."
 artifact_olifant_name: "Olifant"
 artifact_olifant_description: "Velký slonovinový roh pokrytý složitými řezbami. Někteří tvrdí, že jde o tentýž roh, kterým Roland před svou smrtí v bitvě v průsmyku Roncevaux přivolával pomoc."
 artifact_colada_name: "Colada"
 artifact_colada_description: "Tato čepel je údajně jedním z mečů El Cida a inspiruje každého, kdo touží následovat jeho rytířské ctnosti."
 artifact_aram_name: "Aram"
 artifact_aram_description: "Toto starobylé potemnělé kopí přečkalo celé generace. Je tak staré, že mnozí věří, že jde o bájné kopí Aram známé z příběhů o Džangarovi."
 artifact_ikenga_name: "Ikenga"
 artifact_ikenga_description: "Tato malá rohatá soška údajně přináší svému majiteli úspěch a vítězství."
 artifact_mmaagha_kamalu_name: "Mmaagha Kamalu"
 artifact_mmaagha_kamalu_description: "Velmi starý a bohatě zdobený obřadní meč. Údajně kdysi patřil Kamaluovi, igbskému bohu války."
 artifact_bronze_head_name: "Bronzová hlava"
 artifact_bronze_head_description: "Tato naturalistická bronzová hlava zachycuje rysy dávno zemřelého panovníka s mimořádnými podrobnostmi a působí spíše jako vytesaná socha než odlitek z kovu. Hlavu zdobí koruna, která vyjadřuje postavení vyobrazeného monarchy."
 artifact_crystal_carving_name: "Křišťálová řezba"
 artifact_crystal_carving_description: "Tento obdélníkový kus čirého křišťálu je téměř dokonale průhledný a většinu jeho povrchu pokrývají složité řezby. Jde o předmět mimořádné krásy, byť nejasného účelu."
 artifact_ibeji_name: "Ibeji"
 artifact_ibeji_description: "Malá dřevěná soška zobrazující zesnulé dvojče, o níž se věří, že rodině přinese bohatství a štěstí, pokud o ni bude pečovat. Zdobí ji složitý a značně vysoký účes."
 artifact_kantele_name: "Starobylé kantele"
 artifact_kantele_description: "Tento dřevěný strunný nástroj se dědí již po mnoho generací. Podle pověstí může pocházet dokonce z časů samotného Väinämöinena."
 artifact_sledovik_name: "Sledovik"
 artifact_sledovik_description: "Tento velký balvan pokrývají stopy chodidel, které jako by se nořily přímo do kamene. Po mnoho let sloužil jako oltář a lidé věří, že otisky zanechali místní světci."
 artifact_nagelring_name: "Nagelring"
 artifact_nagelring_description: "Podle tradice je tento starý meč spojen s bájným a velmi oblíbeným Dietrichem von Bern. Toto spojení mu zajistilo věhlas, který by si jinak sotva zasloužil."
 artifact_kladenets_name: "Kladenec"
 artifact_kladenets_description: "Ačkoli má tento starý ocelový meč své nejlepší časy za sebou, údajně jde o bájný Kladenec, meč schopný sám se ohánět. V současném stavu se s ním sotva snadno zachází, ale už jeho pouhá přítomnost budí úctu u těch, kdo věří v jeho nadpřirozený původ."
 artifact_legbiter_name: "Legbiter"
 artifact_legbiter_description: "Mimořádně ostrý meč se slonovinovým jílcem. Zbraň údajně patřila velkému norskému králi Magnúsovi Óláfssonovi."
 artifact_quernbiter_name: "Quern-Biter"
 artifact_quernbiter_description: "Tímto mečem kdysi vládl sám norský král Håkon a říkalo se, že byl tak ostrý, že dokázal přeseknout mlýnský kámen."
 artifact_dragvandil_name: "Dragvandil"
 artifact_dragvandil_description: "Meč, který údajně kdysi patřil Egillu Skallagrímssonovi, rolníkovi, básníkovi a válečníkovi známému z Egilovy ságy."
 artifact_szczerbiec_name: "Szczerbiec"
 artifact_szczerbiec_description: "Tento meč údajně daroval králi Boleslavovi Chrabrému anděl a říká se, že právě jím udeřil do Zlaté brány v Kyjevě. Nese nesmírný symbolický význam."
 artifact_chinese_caligraphy_name: "Čínská kaligrafie"
 artifact_chinese_caligraphy_description: "Tento jemný kus papíru pokrývají krásné a mimořádně přesné znaky, z nichž vyzařuje čistota a elegance. Ačkoli písař, který je vytvořil, zůstává neznámý, řemeslné zpracování je bezpochyby vynikající."
 artifact_ruyi_name: "Žu-i"
 artifact_ruyi_description: "Malé nefritové žezlo pokryté symboly a ozdobami. Řemeslné zpracování je znamenité."
 turquoise_throne_name: "Tyrkysový trůn"
 turquoise_throne_description: "Tento drahokamy zdobený královský trůn byl vytvořen podle obrazu legendárního trůnu perských králů ze Šáhnáme. Jeho ebenovou konstrukci zdobí nesčetné tyrkysy a pláty ryzího zlata smaltované v tyrkysovém odstínu. Tak úchvatné krásy mohli dosáhnout pouze ti nejpřednější mistři svých řemesel."
 peacock_throne_name: "Paví trůn"
 peacock_throne_description: "Tento přepychový trůn byl vytvořen jako napodobenina královského trůnu Džamšída. Říká se, že se na jeho zhotovení sešli řemeslníci z celého světa a spojili zlato, stříbro a stovky drahokamů v trůn, který nyní stojí před tebou."
 artifact_banner_islam_name: "Svatý prapor Muhammada"
 artifact_banner_islam_description: "Údajně jde o svatý prapor Muhammada, relikvii z dob proroka a symbol celé muslimské víry."
 artifact_spear_of_the_prophet_name: "Prorokovo kopí"
 artifact_spear_of_the_prophet_description: "Údajně jde o Muhammadovo kopí, které vládce Habeše věnoval az-Zubajrovi ibn al-Awwámovi."
 artifact_mantle_of_the_prophet_islam_name: "Prorokův plášť"
 artifact_mantle_of_the_prophet_description: "Tento Prorokův plášť se po staletí dědí z jednoho chalífy na druhého. Chalífa jej tradičně obléká při všech slavnostních svátcích a plášť mu propůjčuje dojem nepřemožitelného klidu a důstojnosti."
 afarganyu_name: "Afarganju"
 artifact_afarganyu_description: "V této velké nádobě se zapaluje posvátný oheň, který je ústředním prvkem mnoha obřadů zoroastrijského vyznání. Starý nápis připomíná osobu, která nádobu původně darovala kněžstvu."
 siddhachakra_name: "Siddhačakra"
 artifact_siddhachakra_description: "Mystický diagram používaný džinisty při uctívání. V jeho středu se nachází rozkvetlý lotos obklopený božstvy na okvětních lístcích, jejichž symbolika souvisí s legendou o králi Šrípálovi a jeho manželce Majánasundarí."
 artifact_staff_kakusandha: "Kakusandhova hůl"
 artifact_staff_kakusandha_desc: "Kakusandha, první Buddha současné kalpy, používal tuto hůl k odhánění nebezpečných zvířat i k plašení těch menších, aby je putující mniši nepošlapali."
 water_filter_konagamana: "Kónágamanův vodní filtr"
 water_filter_konagamana_desc: "Kónágamana, druhý Buddha současné kalpy, nosil tento vodní filtr na svých cestách. Tento prostý kus látky sloužil dvojímu účelu: zajišťoval pitnou vodu a zároveň umožňoval bezpečně a soucitně odfiltrovat veškerý hmyz."
 robe_kassapa: "Kus Kassapova roucha"
 robe_kassapa_desc: "Kassapa, třetí Buddha současné kalpy, nosil toto roucho po značnou část svého každodenního života. Tento pozoruhodně hrubý kus látky se těší zvláštní úctě jako jeden z mála známých kusů Buddhova oděvu, které se dochovaly."
 gilded_rats_tail: "Pozlacený krysí ocas"
 gilded_rats_tail.desc: "Šperk chudého člověka."
 quail_eggshell_gem: "„Drahokam“ z křepelčí skořápky"
 quail_eggshell_gem.desc: "Barevný kousek vaječné skořápky vydávaný za drahokam."
 stained_glass_shard: "Posvěcený střep „vitráže“"
 stained_glass_shard.desc: "Zdá se, že jej zbarvuje podivný krvavý odstín..."
 xylospongium: "Houba na tyči"
 xylospongium.desc: "Jeho původ ani účel nejsou jasné, ale vydává slabý nepříjemný zápach."
 st_davids_morsel: "Sousto svatého Davida"
 st_davids_morsel.desc: "Vypadá jako kus sušeného masa. Jeho stáří ani původ nejsou jasné."
 platypus_figurine: "Figurka zvířete"
 platypus_figurine.desc: "Toto drobné zvíře má široký zobák, lesklou srst a ploutvovité končetiny. Jak podivné."
 terracotta_toy_fowl: "Terakotová hračka v podobě ptáka"
 terracotta_toy_fowl.desc: "Opotřebovaný povrch vypráví příběh kdysi milované hračky."
 stewardship_general.2001.artifact.potsherd_holy: "Střep nádoby"
 stewardship_general.2001.artifact.potsherd_holy.desc: "Starobylý střep nádoby. Údajně pochází ze svatého místa [trinket_holy_site.GetNameNoTierNoTooltip]."
 small_bell_beaker: "Malý zvoncovitý pohár"
 small_bell_beaker.desc: "Zvoncovitý pohár se složitým vzorem."
 serpentine_budai: "Serpentinitový Budai"
 serpentine_budai.desc: "Drobná postavička obtloustlého, smějícího se holohlavého muže."
 mythical_creature_horn: "Roh tvora [ROOT.Char.Custom('HornedMythicalCreature')|U]"
 mythical_creature_horn.desc: "Podivně tvarovaný kus rohoviny, který údajně pochází z mytologického tvora [ROOT.Char.Custom('HornedMythicalCreature')]."
 mythical_creature_figurine: "Figurka tvora [ROOT.Char.Custom('RegionalMythicalCreature')] [ROOT.Char.Custom('TrinketLookAdjective')|l]"
 mythical_creature_figurine.desc: "Tato figurka zobrazující [new_trinket.Custom('ArtifactAnimalAdjective')] [SCOPE.Custom('RegionalMythicalCreatureLower')] působí [ROOT.Char.Custom('TrinketLookAdverbFollowup')] [ROOT.Char.Custom('TrinketLookAdjective')|l] díky drobným zářivým drahokamům pocházejícím z místa [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]."
 st_davids_taper: "Svíce svatého Davida"
 st_davids_taper.desc: "Vypadá to, jako by se ji někdo pokoušel pálit z obou konců."
 jira_stick: "Mramorové žezlo J'Iry"
 jira_stick.desc: "Přestože je značně opotřebované, jeho špičatý konec je stále působivý."
 lucky_coin: "Šťastná mince [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] kultury"
 lucky_coin.desc: "Mince [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] kultury pocházející z místa [ROOT.Char.GetCurrentLocation.GetNameNoTooltip].\n\nKdysi ražený povrch je nyní vyhlazený neustálým mnoucím přejížděním mezi prsty."
 lavender_jade_pendant: "Přívěsek z levandulového nefritu"
 lavender_jade_pendant.desc: "Sytě purpurové žilkování je ohromující."
 sekhmet_ring: "Starý pečetní prsten"
 sekhmet_ring.desc: "Do zlatého prstenu je vyryt obraz člověka s jakousi podivně vyhlížející přilbou."
 scarab_brooch: "Starobylá brož se skarabem"
 scarab_brooch.desc: "Jemná brož ve tvaru skaraba. Smaragdovému vykládání se připisují blahodárné účinky na zdraví."
 easteregg_artifact_elisabeth_plush: "Alžbětina plyšová liška"
 easteregg_artifact_elisabeth_plush_description: "Alžbětina plyšová liška je velmi milovaná hračka, která ji provázela po většinu života. Alžbětu bylo často možné spatřit, jak si s ní povídá, zatímco splétá důmyslné šifry pro kohokoli, kdo využije jejích služeb. Působí uklidňujícím dojmem a svého držitele inspiruje k napodobování liščí vychytralosti."
 easteregg_artifact_nicks_redolence: "Poslední vůně"
 easteregg_artifact_nicks_redolence_description: "Malá lahvička s trochou vůně v odstínu [ROOT.Char.Custom('GetComplexColor')|l], která svou přítomností zaručeně omámí pány i dámy. Drobný nápis na zátce praví #EMP „A teď se konec blíží...“#!"
 easteregg_artifact_chad_book: "Aeneis s poznámkami"
 easteregg_artifact_chad_book_description: "Oblíbený a iluminovaný výtisk Vergiliovy Aeneidy pokrytý množstvím poznámek a čmáranic, z nichž některé jsou pošetilé a jiné pronikavé."
 easteregg_artifact_chad_dagger: "Dýka"
 easteregg_artifact_chad_dagger_description: "Její lesk zmatněl skvrnami zaschlé krve, přesto žízní po další."
 easteregg_artifact_veronica_book: "Prsteny Páně"
 easteregg_artifact_veronica_book_description: "Jen chabě zastřený odkaz v knižní podobě. Sepsaný tou nejlepší portugalštinou."
 easteregg_artifact_map_lohmander: "Starý itinerář"
 easteregg_artifact_map_lohmander_description: "Tato malá kniha v kožené vazbě obsahuje příběhy skandinávského písaře a jeho cesty ze západu do Indie. Podrobně popisuje nebezpečí, cesty i vybavení, které člověk potřebuje, od míst, kde doplnit vodu, až po oblasti, kde se neobejde bez správných bot. Obsahuje také množství informací o místních pokrmech a tancích.\n\nUvnitř se nachází také několik složených map zobrazujících subkontinent i mnoho dalších míst, doplněných poznámkami o vzdálených krajích a názvech, které nesly v dávných dobách."
 easteregg_artifact_jason_sword: "Meč svatého Martina"
 easteregg_artifact_jason_sword_description: "Podél žlábku čepele někdo neuměle vyškrábal slova „Jsem to, co jest.“"
 child_toy_template_tt: "Jako [Concept('inventory_artifact','osobní artefakt')|E] jej můžeš vybavit pouze tehdy, pokud jsi [Concept('child','dítětem')|E]"
 fp2_blessed_junk: "$blessed_artifact_modifier$ artefakt ([ROOT.Char.Custom('TrinketLookAdjective')|l])"
 fp2_blessed_junk_desc: "Jinak zcela bezcenný artefakt, který působí [ROOT.Char.Custom('TrinketLookAdverbFollowup')] [ROOT.Char.Custom('TrinketLookAdjective')|l]. $blessed_artifact_modifier_desc$."
 local_artisan_modifier: "Místní řemeslník"
 local_artisan_modifier_desc: "Tato postava pochází z řad místních řemeslníků a byla přesvědčena ke službě vznešenému panovníkovi.\n#weak Veškeré [Concept('inspirations','inspirace')|E], které vytvoří, budou nižší kvality.#!"
 artifact_pas_darmes_token: "Upomínka z pas d'armes"
 artifact_pas_darmes_token_name: "Upomínka postavy [owner.GetFirstNameNoTooltip]"
 artifact_pas_darmes_token_description: "Tento předmět je [owner.Custom('GetTournamentFavor')] z materiálu [newly_created_artifact.GetFeatureText( 'generic_material_cloth' )] v [SCOPE.Custom('ArtifactQuality')] jakosti. Výzdobu tvoří [newly_created_artifact.GetFeatureText( 'decoration_pattern' )]. Při pas d'armes v [location.GetName] jej [owner.GetFullName] [Select_CString(owner.IsFemale, 'odevzdala', 'odevzdal')] postavě [winner.GetFullName]."
 artifact_pas_darmes_spurs: "Trofej z pas d'armes"
 artifact_pas_darmes_spurs_name: "Ostruhy postavy [owner.GetFirstNameNoTooltip]"
 artifact_pas_darmes_spurs_description: "Pár ostruh z materiálu [newly_created_artifact.GetFeatureText( 'generic_material_metal' )] v [SCOPE.Custom('ArtifactQuality')] jakosti, který patřil postavě [owner.GetFullName]. Při pas d'armes v [location.GetName] jej [owner.GetFullName] [Select_CString(owner.IsFemale, 'odevzdala', 'odevzdal')] postavě [winner.GetFullName]."
 artifact_tournament_favor: "Turnajová přízeň"
 artifact_tournament_favor_name: "Přízeň [Select_CString(owner.IsFemale, 'dámy', 'pána')]"
 artifact_tournament_favor_description: "Tento předmět je [owner.Custom('GetTournamentFavor')] z materiálu [newly_created_artifact.GetFeatureText( 'generic_material_cloth' )] v [SCOPE.Custom('ArtifactQuality')] jakosti. Výzdobu tvoří [newly_created_artifact.GetFeatureText( 'decoration_pattern' )]. Postavě [recipient.GetFullName] byl darován na znamení obdivu."
 artifact_longbow: "Dlouhý luk"
 artifact_longbow_name: "$artifact_name_prefix_owner_culture$ dlouhý luk"
 artifact_longbow_description: "Dlouhý luk z jednoho kusu dřeva v [SCOPE.Custom('ArtifactQuality')] kvalitě, vyřezaný z materiálu [newly_created_artifact.GetFeatureText( 'longbow_wood' )] tak, aby využíval pružnou běl i pevné jádrové dřevo, a opatřený tětivou z materiálu [newly_created_artifact.GetFeatureText( 'bow_string' )]. Je vyšší než člověk a jen málokterý luk se mu vyrovná silou nátahu."
 artifact_composite: "Kompozitní luk"
 artifact_composite_name: "$artifact_name_prefix$ kompozitní luk"
 artifact_composite_description: "Kompozitní luk v [SCOPE.Custom('ArtifactQuality')] kvalitě, zhotovený z materiálu [newly_created_artifact.GetFeatureText( 'composite_wood' )], vyztužený rohovinou ([newly_created_artifact.GetFeatureText( 'composite_horn' )]) a šlachami a opatřený tětivou z materiálu [newly_created_artifact.GetFeatureText( 'bow_string' )]. Díky své malé délce je ideální ke střelbě ze sedla."
 artifact_bow: "Luk"
 artifact_bow_name: "$artifact_name_prefix$ luk"
 artifact_bow_description: "Luk z jednoho kusu dřeva v [SCOPE.Custom('ArtifactQuality')] kvalitě, zhotovený z materiálu [newly_created_artifact.GetFeatureText( 'bow_wood' )] a opatřený tětivou z materiálu [newly_created_artifact.GetFeatureText( 'bow_string' )]. Hodí se k lovu i do války."
 artifact_crossbow: "Kuše"
 artifact_crossbow_name: "$artifact_name_prefix$ kuše"
 artifact_crossbow_description: "Kuše v [SCOPE.Custom('ArtifactQuality')] kvalitě s pažbou z materiálu [newly_created_artifact.GetFeatureText( 'bow_wood' )] a ocelovým lučištěm opatřeným šlachovou tětivou. Je mimořádně silná a lze ji držet připravenou k výstřelu, ale její opětovné nabití je pomalé."
 create_artifact_bow_tooltip: "[inspiration_owner.GetShortUIName] [Select_CString(inspiration_owner.IsFemale, 'vyrobila', 'vyrobil')] zbraň typu [SCOPE.Custom('ArtifactBowType')] v [SCOPE.Custom('ArtifactQuality')] kvalitě"
