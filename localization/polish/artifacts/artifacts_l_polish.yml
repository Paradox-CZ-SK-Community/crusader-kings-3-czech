 lover_keepsake_hair_description: "[original_lover.GetTitledFirstName] [Select_CString(original_lover.IsFemale, 'darovala', 'daroval')] tuto památku své vzdálené lásce [lover.GetTitledFirstName], aby u sebe [lover.GetTitledFirstName] [Select_CString(lover.IsFemale, 'mohla', 'mohl')] vždy nosit kousek postavy [original_lover.GetTitledFirstNameNoTooltip]."
 lover_keepsake_clothes_male_name: "Spodky postavy [original_lover.GetFirstNameNoTooltip]"
 lover_keepsake_clothes_female_name: "Košilka postavy [original_lover.GetFirstNameNoTooltip]"
 lover_keepsake_clothes_description: "Nejintimnější oděv postavy [original_lover.GetTitledFirstName], zaslaný vzdálené lásce [lover.GetTitledFirstNameNoTooltip], aby udržoval při životě žár jejich společných ložnicových dobrodružství."
 lover_keepsake_shell_name: "Mušle postavy [original_lover.GetFirstNameNoTooltip]"
 lover_keepsake_shell_description: "Památka, kterou [original_lover.GetTitledFirstName] [Select_CString(original_lover.IsFemale, 'zaslala', 'zaslal')] své vzdálené lásce [lover.GetTitledFirstNameNoTooltip]. Mušli si [Select_CString(original_lover.IsFemale, 'odnesla', 'odnesl')] jako vzpomínku na jejich úplně první milostné setkání."
 christian_saint_bone_name: "[saint_bone_owner.Custom('RandomSaintNamePossessive')] [saint_bone_owner.Custom('RandomSaintBone')]"
 christian_saint_bone_description: "Údajné ostatky světce náboženství [saint_bone_owner.GetFaith.GetReligion.GetNameNoTooltip], které [saint_bone_owner.GetNameNoTooltip] [Select_CString(saint_bone_owner.IsFemale, 'získala', 'získal')] během své pouti. Cílem pouti bylo místo [christian_saint_bone_scope.MakeScope.Var('holy_site').GetProvince.GetCounty.GetTitle.GetNameNoTierNoTooltip] a [saint_bone_owner.GetFaith.GetAdherentNamePluralNoTooltip] tyto ostatky uctívají jako symbol štěstí a zbožnosti."
