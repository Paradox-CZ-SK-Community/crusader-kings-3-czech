 artifact_pressed_flower_description: "Krásný květ druhu [SCOPE.Custom('ArtifactFlowerSpecies')], vylisovaný a usušený, aby si uchoval svou krásu."
 stewardship_old_ledger_name: "Stará účetní kniha"
 stewardship_old_ledger_description: "Stará zaprášená účetní kniha plná čmáranic a účetních poznámek. K ničemu už vlastně není, snad jen k poznání, jak může taková účetní kniha vypadat."
