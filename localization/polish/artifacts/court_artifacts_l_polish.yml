 artifact_wall_icon_court_small: "Malá ikona"
 artifact_pedestal_sakanoue_sword_name: "Banke no Hóken"
 artifact_pedestal_sakanoue_sword_desc: "Tento meč třímal slavný vojevůdce $dynn_Sakanoue$ $Tamuramaro$ a říká se, že chrání císařský dvůr. Po Tamuramarově smrti jej do paláce daroval $Saga_JP$ $king_tenno_male_japanese$."
 artifact_higekiri_sword_name: "Higekiri"
 artifact_higekiri_sword_desc: "„Řezač vousů“ nechal spolu s Hizamaru zhotovit $dynn_Minamoto$ no $Mitsunaka$ a meč se poté dědil v rodě $Seiwa$ $dynn_Minamoto$."
 artifact_hizamaru_sword_name: "Hizamaru"
 artifact_hizamaru_sword_desc: "Tento meč nechal spolu s Higekiri zhotovit $dynn_Minamoto$ no $Mitsunaka$ a poté se dědil v rodě $Seiwa$ $dynn_Minamoto$."
 artifact_dojigiri_sword_name: "Dódžigiri"
 artifact_dojigiri_sword_desc: "Tento meč ukoval slavný kovář $Yasutsuna_4$ pro postavu $dynn_Fujiwara$ $Toshihito$ a poté se dědil v rodě $dynn_Fujiwara$."
 artifact_mikazuki_munechika_sword_name: "Mikazuki"
 artifact_mikazuki_munechika_sword_desc: "„Srpek měsíce“ ukoval slavný kovář $dynn_SanjO_$ $Munechika_2$ v době, kdy vládl $IchijO_$ $king_tenno_male_japanese$."
 artifact_odenta_sword_name: "Ótenta"
 artifact_odenta_sword_desc: "„Velkou Tentu“ ukoval slavný kovář $Mitsuyo$, známý jako Tenta, v době, kdy vládl $Shirakawa$ $king_tenno_male_japanese$."
 artifact_pedestal_hamayumi_bow_name: "Hamajumi"
 artifact_pedestal_hamayumi_bow_desc: "„Ničitel zla“ používal $dynn_Minamoto$ $Yorimasa$, kterého povolali do císařského paláce, aby vyhnal zlé duchy."
 artifact_pedestal_seven_branched_sword_name: "Šičišitó"
 artifact_pedestal_seven_branched_sword_desc: "„Sedmiramenný meč“, železná čepel se sedmi výběžky připomínajícími plameny, byl podle tradice darem přátelství pro $king_tenno_male_japanese$, který kdysi dávno poslal přes moře král Pekče."
 artifact_pedestal_gyerimro_dagger_name: "Exotická dýka"
 artifact_pedestal_gyerimro_dagger_desc: "Tato nádherně zpracovaná dýka s jílcem a pochvou zdobenými složitým zlatým vykládáním a drahokamy je ceněným majetkem dvora Silly a údajně pochází ze zemí daleko na západě."
 artifact_karakawa_armor_name: "Karakawa"
 artifact_karakawa_armor_desc: "Tato znamenitě zhotovená zbroj typu ó-joroi je rodovým dědictvím rodu Taira a údajně byla darem od synovce postavy $Kanmu$ $king_tenno_male_japanese$."
 artifact_nukemaru_sword_name: "Nukemaru"
 artifact_nukemaru_sword_desc: "Tento meč údajně věnovala samotná Amaterasu lovci v Ise. Později jej koupil $dynn_Taira$ $Tadamori$ a říká se, že se sám vytasil z pochvy, když jeho spánek ohrožoval had."
 artifact_kogarasumaru_sword_name: "Kogarasumaru"
 artifact_kogarasumaru_sword_desc: "„Malou vránu“ ukoval Amakuni pro císařský dvůr. Později ji $Suzaku$ $king_tenno_male_japanese$ udělil postavě $dynn_Taira$ $Sadamori$ za služby během povstání Džóhei-Tengjó."
 artifact_statue_green_amitabha_buddha_name: "Zelená kamenná socha Buddhy Amitábhy"
 artifact_statue_green_amitabha_buddha_descripton: "Tato nádherná socha Buddhy Amitábhy vypadá, jako by byla vytesána z jediného kusu zeleného kamene. Podstavec zdobí lotosové okvětní lístky a vzory vodních vln.\n\nŘíká se, že se socha zázračně objevila v troskách pagody, která se krátce po svém dokončení zřítila."
