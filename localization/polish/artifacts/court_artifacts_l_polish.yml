 artifact_pedestal_skull_of_the_enemy_description: "Čistá a dokonale zachovalá lidská lebka, která kdysi patřila postavě [rival.GetTitledFirstNameNoTooltip]. Byla chirurgicky oddělena od těla za osobní urážky namířené proti postavě [owner.GetTitledFirstNameNoTooltip]."
 artifact_pedestal_skull_of_the_apostate_name: "Lebka odpadlíka"
