 artifact_pedestal_crown_justinian_name: "Justiniánova koruna"
 artifact_pedestal_crown_justinian: "Starobylá koruna císaře Justiniána. Je zlatá, vykládaná drahokamy a dodnes v sobě nese veškerou autoritu a učenost tohoto slavného panovníka."
