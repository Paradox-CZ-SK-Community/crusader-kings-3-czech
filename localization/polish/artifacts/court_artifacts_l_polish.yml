 artifact_cabinet: "Skříň"
 artifact_cabinet_name: "$artifact_name_prefix$ skříň"
 artifact_cabinet_description: "Skříň v [SCOPE.Custom('ArtifactQuality')] kvalitě. Je zhotovena z desek z materiálu [newly_created_artifact.GetFeatureText( 'generic_material_wood' )]. [newly_created_artifact.GetFeatureText( 'wood_decoration' )]"
 create_artifact_cabinet_tooltip: "[inspiration_owner.GetShortUIName] [Select_CString(inspiration_owner.IsFemale, 'vytvořila', 'vytvořil')] skříň v [SCOPE.Custom('ArtifactQuality')] kvalitě"
 artifact_diwan_name: "$artifact_name_prefix$ divan"
 artifact_diwan_description: "Divan v [SCOPE.Custom('ArtifactQuality')] kvalitě. Jeho pevná konstrukce je zhotovena z materiálu [newly_created_artifact.GetFeatureText( 'generic_material_wood' )] a pokryta polštáři. [newly_created_artifact.GetFeatureText( 'wood_decoration' )]"
 create_artifact_diwan_tooltip: "[inspiration_owner.GetShortUIName] [Select_CString(inspiration_owner.IsFemale, 'vytvořila', 'vytvořil')] divan v [SCOPE.Custom('ArtifactQuality')] kvalitě"
 artifact_table_name: "$artifact_name_prefix$ stůl"
 artifact_table_description: "Stůl v [SCOPE.Custom('ArtifactQuality')] kvalitě. Je zhotoven z desek z materiálu [newly_created_artifact.GetFeatureText( 'generic_material_wood' )]. [newly_created_artifact.GetFeatureText( 'wood_decoration' )]"
 create_artifact_table_tooltip: "[inspiration_owner.GetShortUIName] [Select_CString(inspiration_owner.IsFemale, 'vytvořila', 'vytvořil')] stůl v [SCOPE.Custom('ArtifactQuality')] kvalitě"
 feature_wood_decoration_none: "Dřevo bylo vybroušeno dohladka."
 feature_wood_decoration_varnish: "Dřevo bylo nalakováno, aby získalo sytý, temný lesk."
 feature_wood_decoration_hsb_inlay: "Dřevo je vykládáno ozdobami z materiálu [Artifact.GetFeatureText( 'decoration_material_inlay_HSB' )]."
 feature_wood_decoration_painted_pattern: "Dřevo je pomalováno motivy [Artifact.GetFeatureText( 'decoration_pattern' )]."
 artifact_throne_charlemagne_name: "Trůn Karla Velikého"
 artifact_throne_charlemagne_description: "Prostý, avšak impozantní trůn bez jakýchkoli ozdob. Je zhotoven z masivního mramoru a podle pověstí pocházejí jeho desky z Chrámu Božího hrobu v Jeruzalémě."
 artifact_throne_solomon_name: "Šalomounův trůn"
 artifact_throne_solomon_description: "Okázalý trůn, který údajně kdysi patřil legendárnímu králi Šalomounovi. Je zhotoven ze slonoviny a pozlacen, osazen množstvím vzácných drahokamů a schody, které k němu vedou, zdobí kovové sochy nejrůznějších zvířat."
 artifact_throne_stone_scone_name: "Kámen ze Scone"
 artifact_throne_stone_scone: "Prosté sedadlo z červeného pískovce, na němž byli od dob krále Kennetha I. korunováni všichni panovníci Alby."
 artifact_byz_throne_name: "Byzantský Šalomounův trůn"
 artifact_byz_throne_description: "Elegantní trůn, z něhož byzantští panovníci vykonávají spravedlnost s moudrostí hodnou biblického krále. Jeho nejpozoruhodnější součástí je skrytý mechanismus, který umožňuje trůn vyzdvihnout až ke stropu a poté jej opět spustit."
 artifact_wall_banner_battle_name: "[epic_loser.GetPrimaryTitle.GetAdjectiveNoTooltip] válečný prapor"
 artifact_wall_banner_battle_description: "Válečný prapor vojsk [epic_loser.GetPrimaryTitle.GetName], ukořistěný po bitvě u [epic_battle_location.GetName]."
 artifact_wall_banner_royal_name: "[target.GetAdjectiveNoTooltip] královský prapor"
 artifact_wall_banner_royal_description: "Prapor [target.GetNameNoTooltip], zhotovený na počest vlády postavy [target.GetHolder.GetTitledFirstNameRegnal]."
 artifact_wall_banner_house_name: "Prapor rodu [target.GetBaseNameNoTooltip]"
 artifact_wall_banner_house_description: "Prapor rodu [target.GetBaseName], symbol autority této rodiny a jejích potomků."
 artifact_wall_banner_dynasty_name: "Prapor dynastie [target.GetBaseNameNoTooltip]"
 artifact_wall_banner_dynasty_description: "Prapor dynastie [target.GetBaseName], symbol autority pokrevní linie a všech jejích členů, zhotovený na objednávku postavy [newly_created_artifact.MakeScope.Var('banner_commissioner').Char.GetNameRegnal]."
 artifact_wall_banner_name: "[target.GetAdjectiveNoTooltip] prapor"
 artifact_wall_banner_description: "[target.GetAdjective] prapor, symbol autority, kterou představuje [target.GetHolder.GetTitleAsName]."
 artifact_wall_banner_kaviani_name: "Derafš Kávijání"
 artifact_wall_banner_kaviani: "Legendární Derafš Kávijání, královská standarta padlé Sásánovské říše. Pro dědice Perské říše je symbolem identity a hrdosti."
 artifact_wall_big_edessa_name: "Obraz z Edessy"
 artifact_wall_big_edessa: "Mandylion, tkanina nesoucí zázračný obraz Ježíšovy tváře a první ikona křesťanství. Její původ je spojen s edesským králem Abgarem."
 artifact_wall_shield: "Nástěnný štít"
 artifact_wall_shield_name: "$artifact_name_prefix$ štít"
 artifact_wall_shield_description: "Dřevěný štít v [SCOPE.Custom('ArtifactQuality')] kvalitě, zhotovený z pevných prken z materiálu [newly_created_artifact.GetFeatureText( 'shaft_wood' )] a spojený obrubou z materiálu [newly_created_artifact.GetFeatureText( 'head_metal' )]. Okraj je vykládán materiálem [newly_created_artifact.GetFeatureText( 'decoration_material_inlay_HSB' )] a pomalován vyobrazeními [newly_created_artifact.GetFeatureText( 'decoration_pattern' )]."
 artifact_wall_shield_special: "$artifact_wall_shield$"
 artifact_wall_axe_description: "$artifact_axe_description$"
 artifact_wall_sword_description: "$artifact_sword_description$"
 artifact_wall_spear_description: "$artifact_spear_description$"
 artifact_wall_hammer_description: "$artifact_hammer_description$"
 artifact_wall_mace_description: "$artifact_mace_description$"
 artifact_wall_dagger_description: "$artifact_dagger_description$"
 artifact_wall_cid_sword_name: "Tizona"
 artifact_wall_el_cids_sword: "Tento meč dlouhý tři stopy nese nápis „Tizona“. Podle pověstí jej slavný vojevůdce El Cid získal od jeho předchozího majitele a už samotná přítomnost meče vzbuzuje úctu k válečnickému umění."
 artifact_radzig_kobyla_longsword_name: "Dlouhý meč Racka Kobyly"
 artifact_henrys_longsword_name: "Jindřichův dlouhý meč"
 artifact_radzig_kobyla_longsword_description: "Podle pověstí byl tento meč ukován pro jistého „pana Racka Kobylu“ a dlouho byl považován za ztracený, než jej při své výpravě za pomstou nalezl jistý hladový muž."
 artifact_wall_sword_muhammad_name: "Muhammadův meč"
 artifact_wall_sword_muhammad: "Jeden z devíti pravých mečů proroka Muhammada. Jedná se o [SCOPE.Custom('MuhammadSword')]."
 artifact_wall_sword_muhammad_aladb: "Al-'Adb, který Muhammad použil v bitvách u Badru a Uhudu"
 artifact_wall_sword_muhammad_almathur: "Al-Ma'thur, který Muhammad zdědil po svém otci"
 artifact_wall_sword_muhammad_arrasub: "Ar-Rasub, rodinné dědictví Muhammada"
 artifact_wall_sword_muhammad_albattar: "Al-Battar, který Muhammad získal jako kořist od kmene Banú Kajnuká"
 artifact_wall_sword_muhammad_haft: "Haft, který Muhammad získal jako kořist od kmene Banú Kajnuká"
 artifact_wall_sword_muhammad_qali: "Qal'i, který Muhammad získal jako kořist od kmene Banú Kajnuká"
 artifact_wall_sword_muhammad_dhu: "Dhu al-Faqar, který Muhammad získal jako kořist v bitvě u Badru"
 artifact_wall_sword_muhammad_mikhdham: "Al-Mikhdham, který Muhammad předal svému bratranci a zeti Alímu ibn Abí Tálibovi"
 artifact_wall_sword_muhammad_alqadib: "Al-Qadib, meč, který zůstal v Muhammadově domě"
 artifact_wall_sword_attila_name: "Meč Boží"
 artifact_wall_sword_attila_description: "Legendární meč hunského náčelníka Attily, Biče Božího. Je znám také jako Martův meč."
 artifact_sword_goujian_name: "Goujianův meč"
 artifact_sword_goujian: "Tento starobylý meč údajně kdysi patřil Goujianovi, králi státu Jüe. Přestože jeho podoba působí zastarale, meč vykazuje vynikající řemeslné zpracování. Poblíž jílce je patrný zlacený nápis v pečetním písmu ptačích a červích znaků."
 artifact_sword_goujian_refulgence: "[gujian_sword.GetDesc]\n\nTento meč je považován za zbraň jménem „Záře“, kterou Goujian nosil, když žádal Konfucia o radu."
 artifact_sword_goujian_purity: "[gujian_sword.GetDesc]\n\nTento meč je považován za zbraň jménem „Čistota“."
