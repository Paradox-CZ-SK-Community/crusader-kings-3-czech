l_polish:
 artifact_wall_tapestry_name: "$artifact_name_prefix$ tapiserie"
 artifact_wall_tapestry_description: "Velká tapiserie z materiálu [newly_created_artifact.GetFeatureText( 'generic_material_cloth' )] v [SCOPE.Custom('ArtifactQuality')] kvalitě. [newly_created_artifact.GetFeatureText( 'tapestry_scene' )]"
 feature_tapestry_scene_religious: "Tkanina zachycuje několik významných výjevů z náboženského kánonu, který uznává [Artifact.GetOwner.GetFaith.GetName]."
 feature_tapestry_scene_historical: "Tkanina zachycuje založení [Artifact.GetOwner.GetPrimaryTitle.GetName] a další významné historické události, které předcházely vládě postavy [Artifact.GetOwner.GetTitledFirstName]."
 feature_tapestry_scene_geometric_patterns: "Tkanina je utkána do složitého vzoru vzájemně propletených geometrických obrazců."
 feature_tapestry_scene_hunt: "Tkanina zachycuje lovecký výjev, na němž několik lovců vyzbrojených luky a kopími obklopuje zraněné zvíře a chystá se zasadit mu smrtící ránu."
 feature_tapestry_scene_myth: "Na tkanině jsou vetkáni dávní bohové, úžas vzbuzující nestvůry a neohrožení hrdinové, kteří společně tvoří výjev z bájí."
 feature_tapestry_scene_calligraphic: "Tkanina je utkána do složitého vzoru, v němž se elegantní kaligrafické písmo plynule prolíná s geometrickými obrazci."
 feature_tapestry_scene_bucolic: "Tkanina zachycuje poklidné výjevy každodenního života na polích v průběhu roku. Jedni lidé sejí, jiní orají a další sklízejí úrodu."
 feature_tapestry_scene_battle: "Tkanina zachycuje zlomový okamžik slavné bitvy z místa zvaného [Artifact.GetOwner.MakeScope.Var('epic_battle_location').Province.GetName], v níž [Artifact.GetOwner.GetTitledFirstName] [Select_CString(Artifact.GetOwner.IsFemale, 'zvítězila', 'zvítězil')] nad postavou [Artifact.GetOwner.MakeScope.Var('epic_loser').Char.GetTitledFirstName]."
 feature_tapestry_scene_coronation: "Uprostřed výjevu sedí [Artifact.GetOwner.GetTitledFirstName|U] při korunovaci na trůnu obklopeném jásajícím davem."
 feature_tapestry_scene_ships: "Tkanina zachycuje mocnou flotilu plující po moři. Na každé lodi ozbrojení válečníci pátrají na obzoru po nepřátelích."
 feature_tapestry_scene_animals: "Tkanina zachycuje lovící zvířata. Uprostřed se mohutný lev vrhl na jelena, který se marně snaží uniknout."
 feature_tapestry_scene_banquet: "Tkanina zachycuje bohatou hostinu u dvora postavy [Artifact.GetOwner.GetTitledFirstName]. Významní hosté sedí u štědře prostřeného stolu, zatímco baviči hrají hudbu a tančí."
 feature_tapestry_scene_hearing: "Tkanina zachycuje dvorskou audienci. [Artifact.GetOwner.GetTitledFirstName] majestátně sedí uprostřed výjevu, zatímco vazalové, vyslanci, poražení nepřátelé a služebnictvo čekají v řadě, aby vzdali hold."
 feature_tapestry_scene_garden: "Tkanina zachycuje nádhernou zahradu. Tráva je svěže zelená, květiny hýří barvami a bujně rostou a stromy obtěžkané ovocem jako by sahaly až k nebi."
 create_artifact_tapestry_tooltip: "[inspiration_owner.GetShortUIName] [Select_CString(inspiration_owner.IsFemale, 'vytvořila', 'vytvořil')] velkou tapiserii v [SCOPE.Custom('ArtifactQuality')] kvalitě"
 artifact_throne_special: "$artifact_throne$"
 artifact_throne_name: "$artifact_name_prefix$ trůn"
 artifact_throne_description: "Královský trůn v [SCOPE.Custom('ArtifactQuality')] kvalitě. Konstrukci tvoří masivní sloupky z materiálu [newly_created_artifact.GetFeatureText( 'generic_material_wood' )] a sedadlo je vystláno polštáři z materiálu [newly_created_artifact.GetFeatureText( 'generic_material_cloth' )]."
 create_artifact_throne_tooltip: "[inspiration_owner.GetShortUIName] [Select_CString(inspiration_owner.IsFemale, 'vytvořila', 'vytvořil')] královský trůn v [SCOPE.Custom('ArtifactQuality')] kvalitě"
 artifact_chest: "Truhla"
 artifact_chest_name: "$artifact_name_prefix$ truhla"
 artifact_chest_description: "Truhla v [SCOPE.Custom('ArtifactQuality')] kvalitě. Je zhotovena z prken z materiálu [newly_created_artifact.GetFeatureText( 'generic_material_wood' )]. [newly_created_artifact.GetFeatureText( 'wood_decoration' )]"
