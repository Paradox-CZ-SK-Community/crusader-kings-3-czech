l_polish:
 blood_brooch_name: "Brož s krví"
 blood_brooch_description: "Tuto brož zdobí skleněná koule naplněná krví postavy [ROOT.GetCharacter.GetTitledFirstName]."
 cuckoldry_psalter_name: "Žaltář paroháčů"
 cuckoldry_psalter_description: "Po celé věky přechází od jednoho paroháče k druhému a říká se, že tato kniha je tím nejlepším darem, jaký lze dát manželskému protějšku. Přinejmenším slonovinové postavičky na obálce vypadají jako šťastní manželé."
 chastity_belt_name: "Pás cudnosti"
 chastity_belt_description: "Tento pás cudnosti má ostny zvenčí i zevnitř, aby chránil tebe i ostatní."
 holy_needle_name: "Svatá jehla z Antiochie"
 holy_needle_description: "Nu, dal by se s ní vyšít znamenitý výjev Ukřižování."
 finger_bones_name: "Kosti prstů svatého"
 finger_bones_description: "Všech jedenáct!"
 dead_chicken_name: "Štít zbabělce"
 dead_chicken_description: "Když se budeš ohánět tímto mrtvým kuřetem, nikdo se k tobě nebude chtít přiblížit. A už vůbec ne nepřátelé."
 worm_on_a_string_name: "Červík na provázku"
 worm_on_a_string_description: "Hračka, která by nejspíš udělala dojem na nemluvně."
 pope_joan_book_name: "Příběhy papežky Jany"
 pope_joan_book_desc: "Kniha, v níž je [ROOT.Char.GetTitledFirstNameNoTooltip] vyobrazen jako papežka Jana. Zbožné, rouhačské, nebo svůdné?"
 lady_godiva_book_name: "Příběhy lady Godivy"
 lady_godiva_book_desc: "Alespoň vyobrazení, na nichž [ROOT.Char.GetTitledFirstNameNoTooltip] jede nahá na koni, jí lichotí."
 caligula_book_name: "Pět set ran bičem"
 caligula_book_desc: "Pět set stran, na nichž je [ROOT.Char.GetTitledFirstNameNoTooltip] bičován Caligulem."
 nasreddin_book_name: "Příběhy Nasreddina"
 nasreddin_book_desc: "Kniha, v níž má [ROOT.Char.GetTitledFirstNameNoTooltip] tú velkou čest stát se terčem Nasreddinova posměchu."
 valmiki_book_name: "Epigramy Válmíkiho"
 valmiki_book_desc: "Sbírka duchaplností nejstaršího básníka Válmíkiho, které však překvapivě odříká [ROOT.Char.GetTitledFirstNameNoTooltip]."
 ruler_hero_book_name: "[ROOT.Char.GetTitledFirstNameNoTooltip] a [Select_CString(ROOT.Char.IsFemale, 'její', 'jeho')] příběhy"
 ruler_hero_book_desc: "Hned v úvodní větě [ROOT.Char.GetTitledFirstNameNoTooltip] pronáší ke [Select_CString(ROOT.Char.IsFemale, 'svému', 'svému')] dvoru: „Musím se posadit, protože vás nemohu vystát.“"
 sinbad_book_name: "Sindibádovy cesty"
 sinbad_book_desc: "Kniha, v níž nejrůznější nestvůry, jimž Sindibád čelí, vypadají v tváři jako [ROOT.Char.GetTitledFirstNameNoTooltip]."
 purple_underwear_name: "Císařské purpurové spodní prádlo"
 purple_underwear_description: "Hodné jedině císaře.\n\nSic itur ad astra...?"
 fake_reichskrone_name: "Falešná říšská koruna"
 fake_reichskrone_description: "Nasaď si ji, pokud chceš být skutečným #EMP pretendentem#! trůnu."
