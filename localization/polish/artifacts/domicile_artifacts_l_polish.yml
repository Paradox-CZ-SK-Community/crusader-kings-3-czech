 creature_type_lion_desc: "Král zvířat, symbol odvahy, nyní spoutaný a podrobený. Prochází se tam a zpět ve svém výběhu, kam až mu pouta dovolí." # todo: NEW TRANSLATION
 creature_type_caracal_desc: "Velká kočkovitá šelma. Potuluje se po svém výběhu a trhá na kusy vše, co dovnitř umístí pro ozdobu klece." # todo: NEW TRANSLATION
 creature_type_lynx_desc: "Plachá a zavalitá kočkovitá šelma. Drží se při zemi, uši má sklopené dozadu a očima horečně sleduje okolí svého bidýlka." # todo: NEW TRANSLATION
 creature_type_tiger_desc: "Děsivý tvor, král horských zvířat. Snadno ho rozzuříte a přimějete ukázat tesáky, čímž vyděsíte návštěvníky." # todo: NEW TRANSLATION
 creature_type_leopard_desc: "Pružné, půvabné a stejně tak smrtící zvíře. Je trpělivé a chytré a dokáže působivě skákat." # todo: NEW TRANSLATION
 creature_type_bear_desc: "Zuřivý medvěd se těžkopádně potuluje a neustále hledá potravu. Jeho obrovské tlapy by snadno rozdrtily kosti jako větvičky." # todo: NEW TRANSLATION
 creature_type_elephant_desc: "Zdánlivě mírný obr. Jeho chobot je překvapivě obratný, což návštěvníky těší a udivuje." # todo: NEW TRANSLATION
 creature_type_peacock_desc: "Hrdý a důstojný pták s nezaměnitelným hlasem. Je korunou každé zahrady." # todo: NEW TRANSLATION
 creature_type_parrot_desc: "Živý exemplář, který dokáže napodobovat lidské zvuky. Skvělý trik, jímž lze bavit hosty." # todo: NEW TRANSLATION
 creature_type_crane_desc: "Ušlechtilé zvíře s lehkými křídly. Je symbolem štěstí a věčného mládí." # todo: NEW TRANSLATION
 creature_type_cockatoo_desc: "Barevný pták s pestrým peřím a bystrýma, vnímavýma očima." # todo: NEW TRANSLATION
 creature_type_monkey_desc: "Tato společenská opice je roztomilým společníkem s rozkošně lidským chováním a výrazy." # todo: NEW TRANSLATION
