l_polish:
 artifact_relic_peter_bones_name: "Kosti svatého Petra"
 artifact_relic_peter_bones_desc: "Kosti apoštola Petra, knížete apoštolů a prvního římského biskupa."
 artifact_relic_paul_bones_name: "Kosti svatého Pavla"
 artifact_relic_paul_bones_desc: "Kosti apoštola Pavla, umučeného v Aquae Salviae."
 artifact_relic_crown_of_thorns_name: "Trnová koruna"
 artifact_relic_crown_of_thorns_desc: "Trnová koruna vtisknutá Kristu na hlavu před ukřižováním."
 artifact_relic_baptist_arm_name: "Pravá paže svatého Jana Křtitele"
 artifact_relic_baptist_arm_desc: "Pravé předloktí Jana Křtitele. Prý právě tato ruka pokřtila Krista v Jordánu."
 artifact_relic_true_cross_name: "Úlomek Pravého kříže"
 artifact_relic_true_cross_desc: "Tříska z kříže, na němž byl ukřižován Kristus, zasazená do pozlaceného relikviáře."
 artifact_relic_bones_of_james_name: "Kosti svatého Jakuba"
 artifact_relic_bones_of_james_desc: "Kosti apoštola Jakuba Většího, za nimiž přicházejí poutníci z celého křesťanského světa."
 artifact_relic_mark_name: "Hlava svatého Marka"
 artifact_relic_mark_desc: "Sťatá hlava evangelisty Marka, zakladatele alexandrijské církve."
 artifact_relic_lance_antioch_name: "Svaté kopí z Antiochie"
 artifact_relic_lance_antioch_desc: "Železný hrot kopí, které prý probodlo Kristův bok."
 artifact_relic_tabot_name: "Tabot smlouvy"
 artifact_relic_tabot_desc: "Posvěcená kamenná deska představující Archu úmluvy, uctívaná jako nejposvátnější etiopská relikvie."
 artifact_relic_nine_saints_name: "Kosti Devíti svatých"
 artifact_relic_nine_saints_desc: "Kosti Devíti svatých – syrských mnichů, kteří před spory kolem chalkedonského koncilu uprchli do Aksúmu. Založili první etiopské kláštery a rozšířili miafyzitské křesťanství po tamních vysočinách."
 artifact_relic_thomas_name: "Relikvie apoštola Tomáše"
 artifact_relic_thomas_desc: "Kosti a krví potřísněný hrot kopí apoštola Tomáše, který prý přinesl víru do Kéraly a byl tam umučen."
 artifact_relic_augustine_pallium_name: "Pallium svatého Augustina"
 artifact_relic_augustine_pallium_desc: "Pallium, které nosil Augustin z Canterbury, první arcibiskup a apoštol Angličanů."
 artifact_relic_three_magi_name: "Relikvie Tří králů"
 artifact_relic_three_magi_desc: "Kosti Tří mudrců, kteří následovali hvězdu do Betléma."
 artifact_relic_becket_name: "Relikvie svatého Tomáše Becketa"
 artifact_relic_becket_desc: "Krví nasáklý oděv a lebka Tomáše Becketa, umučeného roku 1170 ve vlastní katedrále. Brzy nato byl prohlášen největším světcem anglického křesťanstva."
 artifact_relic_ursula_name: "Kosti svaté Voršily"
 artifact_relic_ursula_desc: "Kosti Voršily a jejích panenských družek, jež podstoupily mučednickou smrt, vyzvednuté z kolínských pohřebišť."
 artifact_relic_ignatius_name: "Kosti svatého Ignáce"
 artifact_relic_ignatius_desc: "Kosti Ignáce, druhého antiochijského patriarchy a žáka apoštola Jana, umučeného v Římě za vlády Traiana."
 artifact_relic_black_stone_name: "Úlomek Černého kamene"
 artifact_relic_black_stone_desc: "Leštěný černý úlomek oddělený od Černého kamene Kaaby, jejž políbil sám Prorok a uctívá jej každý poutník vykonávající hadždž."
 artifact_relic_dhulfiqar_name: "Zulfikár"
 artifact_relic_dhulfiqar_desc: "Meč Proroka s rozštěpenou čepelí, který prý daroval Alímu. Celá umma jej uctívá jako znamení vlády posvěcené Bohem."
 artifact_relic_buraq_footprint_name: "Burákova stopa"
 artifact_relic_buraq_footprint_desc: "Kámen s otiskem kopyta, který zanechal Burák, když Prorok vystoupil na nebesa ze Základního kamene v Jeruzalémě."
 artifact_relic_sword_of_ali_name: "Alího meč"
 artifact_relic_sword_of_ali_desc: "Čepel, kterou podle tradice vládl Alí ibn Abí Tálib v bitvách u Badru a Siffínu."
 artifact_relic_abu_hanifa_turban_name: "Turban Abú Hanífy"
 artifact_relic_abu_hanifa_turban_desc: "Učenecký turban Abú Hanífy an-Numána, zakladatele hanafijského mazhabu – opory sunnitského práva pro každého hanafijského poutníka."
 artifact_relic_prophet_sandals_name: "Sandály Proroka"
 artifact_relic_prophet_sandals_desc: "Kožené sandály, které prý nosil Prorok. Zbožní řemeslníci po celé ummě jejich tvar, zvaný nal, znovu a znovu napodobují."
 artifact_relic_western_wall_name: "Kámen ze Zdi nářků"
 artifact_relic_western_wall_desc: "Opracovaný kámen ze západní opěrné zdi plošiny Druhého chrámu, jednoho z mála pozůstatků, které zůstaly stát po zničení chrámu Římany roku 70 n. l."
 artifact_relic_tablets_name: "Úlomek Desek zákona"
 artifact_relic_tablets_desc: "Úlomek kamene, který se prý odštípl z Desek zákona na hoře Sinaj, když je Mojžíš v hněvu odhodil."
 artifact_relic_bodhi_leaf_name: "List stromu bódhi"
 artifact_relic_bodhi_leaf_desc: "Dochovaný list stromu bódhi v Bódhgaji, pod nímž Buddha dosáhl osvícení."
 artifact_relic_vajrasana_name: "Úlomek Vadžrásany"
 artifact_relic_vajrasana_desc: "Leštěný úlomek Vadžrásany, Diamantového trůnu pod stromem bódhi, na němž Buddha nehybně seděl až do okamžiku osvícení."
 artifact_relic_dhamek_name: "Šaríra ze stúpy Dhamekh"
 artifact_relic_dhamek_desc: "Posvátná Buddhova relikvie ze Sárnáthu, kde učil dharmu své první žáky."
 artifact_relic_jowo_name: "Džówo Šákjamuni"
 artifact_relic_jowo_desc: "Posvěcené vyobrazení mladého Buddhy přivezené z Číny, které Tibeťané považují za nejposvátnější sochu."
 artifact_relic_sacred_tooth_name: "Posvátný Buddhův zub"
 artifact_relic_sacred_tooth_desc: "Levý Buddhův špičák, přinesený z Kalingy ve 4. století – posvátná záštita královské moci, jejíž držení dává vládci legitimitu nad všemi ostatními."
 artifact_relic_lingam_name: "Višvanáthův lingam"
 artifact_relic_lingam_desc: "Posvátný úlomek Šivova lingamu z velkého chrámu ve Váránasí, nejposvátnějším městě na Ganze."
 artifact_relic_trishul_name: "Šivův trišúl"
 artifact_relic_trishul_desc: "Trojzubec, kterým prý vládl sám Šiva – symbol boží vlády nad stvořením, zachováním a zánikem."
 artifact_relic_krishna_stone_name: "Kámen Kršnova narození"
 artifact_relic_krishna_stone_desc: "Opotřebovaný kámen z Kršnovy džanmabhúmi v Mathuře, místa, kde se podle tradice narodil Kršna."
 artifact_relic_rama_footprint_name: "Rámova stopa"
 artifact_relic_rama_footprint_desc: "Kámen nesoucí otisk nohy samotného Rámy, přinesený z jeho rodiště Ajódhji."
 artifact_relic_palitana_tirtha_name: "Tírtha v Palitáně"
 artifact_relic_palitana_tirtha_desc: "Posvátný kámen z kopců Šatrundžaja u Palitány, nejposvátnější tírthy džinistické tradice."
 artifact_relic_parshvanatha_paduka_name: "Čaran pádúka Páršvanáthy"
 artifact_relic_parshvanatha_paduka_desc: "Čaran pádúka, kámen s otisky nohou třiadvacátého tírthankary Páršvanáthy."
 artifact_relic_shikharji_nishidhi_name: "Nišídhi tírthankarů"
 artifact_relic_shikharji_nishidhi_desc: "Pamětní kameny nišídhi z vrcholů hory Sammed Šikhar, kde dvacet ze čtyřiadvaceti tírthankarů dosáhlo mókši – nejposvátnější tírthy džinistické víry."
 artifact_relic_atash_bahram_name: "Žhavé uhlíky z Ádur Farnbag"
 artifact_relic_atash_bahram_desc: "Žhavé uhlíky přinesené z velkého Átaš Bahrámu, posvátného Ohně kněží, o nějž se stále pečuje v ohňovém chrámu."
 artifact_relic_yggdrasil_branch_name: "Větev Yggdrasilu"
 artifact_relic_yggdrasil_branch_desc: "Větev, která prý spadla z posvátného stromu u chrámu v Uppsale, kde dosud visí těla zabitých obětí."
 artifact_relic_perun_idol_name: "Perunova modla"
 artifact_relic_perun_idol_desc: "Dřevěná modla boha hromu Peruna, vládce slovanských bohů, vztyčená knížetem Vladimírem."
 artifact_relic_suldetug_name: "Korouhev sülde-tug"
 artifact_relic_suldetug_desc: "Černá korouhev z jačích ohonů, schrána ducha boha války, nesená před chány stepi."
 artifact_relic_yata_kagami_name: "Jata no kagami"
 artifact_relic_yata_kagami_desc: "Bronzové zrcadlo tradičně ztotožňované s jedním ze tří japonských císařských klenotů. Prý vylákalo bohyni slunce Amaterasu z její jeskyně."
 artifact_relic_shin_no_mihashira_name: "Šin no mihašira"
 artifact_relic_shin_no_mihashira_desc: "Tříska ze Šin no mihaširy – posvátného Ústředního sloupu pohřbeného pod nejvnitřnější svatyní Naikú. Je považován za nejskrytější a nejposvátnější z tajemství Ise a obnovuje se při každé přestavbě šikinen sengú."
 artifact_relic_kong_tomb_name: "Stéla z Konfuciova hrobu"
 artifact_relic_kong_tomb_desc: "Vytesaná kamenná deska z Konfuciova hrobu v Čchü-fu, kterou rod Kchung uctívá po celé generace."
 artifact_relic_analects_name: "Konfuciovy Hovory"
 artifact_relic_analects_desc: "Raný opis Hovorů na bambusových destičkách – soubor výroků mistra Kchunga, který studovaly generace čínských učenců."
 artifact_relic_athena_promachos_name: "Úlomek Athény Promachos"
 artifact_relic_athena_promachos_desc: "Bronzový úlomek z obrovské sochy Athény, která kdysi střežila Akropoli."
 artifact_relic_opa_oranmiyan_name: "Opa Oranmiyan"
 artifact_relic_opa_oranmiyan_desc: "Žulová hůl legendárního krále Oranmiyana z Ife, pradávné kolébky Jorubů."
 artifact_relic_oshe_shango_name: "Ošé Šango"
 artifact_relic_oshe_shango_desc: "Ošé Šango, dvojbřitá sekera odlitá podle dvojice hromových kamenů boha bouří Šanga. Jeho kněží ji při extatickém tanci zvedají k nebi."
 artifact_misc_relic_idol_name: "Posvátná modla"
 artifact_misc_relic_idol_desc: "Vyřezávaná modla, tělesné sídlo božstva během rituálu."
 artifact_misc_relic_stele_name: "Stéla předků"
 artifact_misc_relic_stele_desc: "Rytá kamenná deska se seznamem kněžského rodokmenu, svědek mnoha generací."
 artifact_misc_relic_mask_name: "Rituální maska"
 artifact_misc_relic_mask_desc: "Obřadní maska nošená při nejvyšších ritech, schrána božské přítomnosti."
 artifact_misc_relic_banner_name: "Svatá korouhev"
 artifact_misc_relic_banner_desc: "Tato korouhev, posvěcená pro velké rity vykonávané na významných svatých místech, je navždy prosycena kouřem obětin."
