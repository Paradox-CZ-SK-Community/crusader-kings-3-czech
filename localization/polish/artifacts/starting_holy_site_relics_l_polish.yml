l_polish:
 artifact_relic_peter_bones_name: "Kosti svatého Petra" # todo: NEW TRANSLATION
 artifact_relic_peter_bones_desc: "Kosti apoštola Petra, knížete apoštolů a prvního římského biskupa." # todo: NEW TRANSLATION
 artifact_relic_paul_bones_name: "Kosti svatého Pavla" # todo: NEW TRANSLATION
 artifact_relic_paul_bones_desc: "Kosti apoštola Pavla, umučeného v Aquae Salviae." # todo: NEW TRANSLATION
 artifact_relic_crown_of_thorns_name: "Trnová koruna" # todo: NEW TRANSLATION
 artifact_relic_crown_of_thorns_desc: "Trnová koruna, kterou před ukřižováním přitiskli Kristu na hlavu." # todo: NEW TRANSLATION
 artifact_relic_baptist_arm_name: "Pravá paže svatého Jana Křtitele" # todo: NEW TRANSLATION
 artifact_relic_baptist_arm_desc: "Pravé předloktí Jana Křtitele. Říká se, že jde o ruku, kterou pokřtil Krista v Jordánu." # todo: NEW TRANSLATION
 artifact_relic_true_cross_name: "Tříška z Pravého kříže" # todo: NEW TRANSLATION
 artifact_relic_true_cross_desc: "Tříška z kříže, na němž byl ukřižován Kristus, zasazená do pozlaceného relikviáře." # todo: NEW TRANSLATION
 artifact_relic_bones_of_james_name: "Kosti svatého Jakuba" # todo: NEW TRANSLATION
 artifact_relic_bones_of_james_desc: "Kosti apoštola Jakuba Většího, které přitahují poutníky z celého křesťanského světa." # todo: NEW TRANSLATION
 artifact_relic_mark_name: "Hlava svatého Marka" # todo: NEW TRANSLATION
 artifact_relic_mark_desc: "Useknutá hlava evangelisty Marka, zakladatele alexandrijské církve." # todo: NEW TRANSLATION
 artifact_relic_lance_antioch_name: "Svaté kopí z Antiochie" # todo: NEW TRANSLATION
 artifact_relic_lance_antioch_desc: "Železný hrot kopí, o němž se říká, že probodl Kristův bok." # todo: NEW TRANSLATION
 artifact_relic_tabot_name: "Tabot úmluvy" # todo: NEW TRANSLATION
 artifact_relic_tabot_desc: "Posvěcená kamenná deska představující Archu úmluvy, uctívaná jako nejposvátnější z etiopských relikvií." # todo: NEW TRANSLATION
 artifact_relic_nine_saints_name: "Kosti devíti světců" # todo: NEW TRANSLATION
 artifact_relic_nine_saints_desc: "Kosti devíti světců – syrských mnichů, kteří uprchli před chalkedonskými spory do Aksúmu a založili první etiopské kláštery, čímž rozšířili miafyzitské křesťanství po celé vysočině." # todo: NEW TRANSLATION
 artifact_relic_thomas_name: "Relikvie apoštola Tomáše" # todo: NEW TRANSLATION
 artifact_relic_thomas_desc: "Kosti a krví potřísněný hrot kopí apoštola Tomáše, který podle pověsti přinesl víru do Kéraly a tam byl umučen." # todo: NEW TRANSLATION
 artifact_relic_augustine_pallium_name: "Pallium svatého Augustina" # todo: NEW TRANSLATION
 artifact_relic_augustine_pallium_desc: "Pallium, které nosil Augustin z Canterbury, první arcibiskup a apoštol Angličanů." # todo: NEW TRANSLATION
 artifact_relic_three_magi_name: "Relikvie tří mágů" # todo: NEW TRANSLATION
 artifact_relic_three_magi_desc: "Kosti tří mudrců, kteří následovali hvězdu do Betléma." # todo: NEW TRANSLATION
 artifact_relic_becket_name: "Relikvie svatého Tomáše Becketa" # todo: NEW TRANSLATION
 artifact_relic_becket_desc: "Krvavý šat a lebka Tomáše Becketa, umučeného roku 1170 ve vlastní katedrále a záhy oslavovaného jako největší světec anglického křesťanstva." # todo: NEW TRANSLATION
 artifact_relic_ursula_name: "Kosti svaté Voršily" # todo: NEW TRANSLATION
 artifact_relic_ursula_desc: "Kosti Voršily a jejích družek, panen a mučednic, nalezené na kolínských hřbitovech." # todo: NEW TRANSLATION
 artifact_relic_ignatius_name: "Kosti svatého Ignáce" # todo: NEW TRANSLATION
 artifact_relic_ignatius_desc: "Kosti Ignáce, druhého antiochijského patriarchy a učedníka apoštola Jana, který byl za vlády Traiana umučen v Římě." # todo: NEW TRANSLATION
 artifact_relic_black_stone_name: "Úlomek Černého kamene" # todo: NEW TRANSLATION
 artifact_relic_black_stone_desc: "Vyleštěný černý úlomek oddělený od Černého kamene v Ka'bě, který políbil sám Prorok a který uctívají všichni poutníci na hadždž." # todo: NEW TRANSLATION
 artifact_relic_dhulfiqar_name: "Dhulfiqar" # todo: NEW TRANSLATION
 artifact_relic_dhulfiqar_desc: "Prorokův meč s rozeklanou čepelí, který údajně daroval Alímu. Celá uma jej uctívá jako symbol vlády posvěcené Bohem." # todo: NEW TRANSLATION
 artifact_relic_buraq_footprint_name: "Stopa Buráka" # todo: NEW TRANSLATION
 artifact_relic_buraq_footprint_desc: "Kámen s otiskem kopyta, který zanechal Burák, když Proroka vynesl z Jeruzaléma od Základního kamene do nebes." # todo: NEW TRANSLATION
 artifact_relic_sword_of_ali_name: "Alího meč" # todo: NEW TRANSLATION
 artifact_relic_sword_of_ali_desc: "Čepel, kterou podle pověsti třímal Alí ibn Abí Tálib u Badru a Siffínu." # todo: NEW TRANSLATION
 artifact_relic_abu_hanifa_turban_name: "Turban Abú Hanífy" # todo: NEW TRANSLATION
 artifact_relic_abu_hanifa_turban_desc: "Učenecký turban Abú Hanífy an-Nu'mána, zakladatele hanífovského mazhabu – opory sunnitského práva pro každého hanífovského poutníka." # todo: NEW TRANSLATION
 artifact_relic_prophet_sandals_name: "Prorokovy sandály" # todo: NEW TRANSLATION
 artifact_relic_prophet_sandals_desc: "Kožené sandály, které podle pověsti nosil Prorok. Zbožní řemeslníci po celé ummě je bez ustání napodobují ve tvaru na'l." # todo: NEW TRANSLATION
 artifact_relic_western_wall_name: "Kámen ze Západní zdi" # todo: NEW TRANSLATION
 artifact_relic_western_wall_desc: "Opracovaný kámen vyjmutý ze západní opěrné zdi plošiny Druhého chrámu, jedné z mála zbylých částí, které stály po římském zničení chrámu roku 70." # todo: NEW TRANSLATION
 artifact_relic_tablets_name: "Úlomek desek Zákona" # todo: NEW TRANSLATION
 artifact_relic_tablets_desc: "Kamenný úlomek, který se údajně odlomil od desek Zákona na hoře Sinaj, když je Mojžíš v hněvu mrštil o zem." # todo: NEW TRANSLATION
 artifact_relic_bodhi_leaf_name: "List stromu bódhi" # todo: NEW TRANSLATION
 artifact_relic_bodhi_leaf_desc: "Zachovaný list ze stromu bódhi v Bódhgaji, pod nímž Buddha dosáhl osvícení." # todo: NEW TRANSLATION
 artifact_relic_vajrasana_name: "Úlomek vadžrásany" # todo: NEW TRANSLATION
 artifact_relic_vajrasana_desc: "Vyleštěný úlomek vadžrásany, Diamantového trůnu pod stromem bódhi, na němž Buddha nehnutě seděl až do okamžiku osvícení." # todo: NEW TRANSLATION
 artifact_relic_dhamek_name: "Šaríra stúpy Dhamek" # todo: NEW TRANSLATION
 artifact_relic_dhamek_desc: "Posvátná Buddhová relikvie ze Sárnáthu, kde učil dharmu své první učedníky." # todo: NEW TRANSLATION
 artifact_relic_jowo_name: "Džowo Šákjamuni" # todo: NEW TRANSLATION
 artifact_relic_jowo_desc: "Posvěcená socha mladého Buddhy, přivezená z Číny a Tibeťany považovaná za nejposvátnější ze všech soch." # todo: NEW TRANSLATION
 artifact_relic_sacred_tooth_name: "Posvátný Buddhův zub" # todo: NEW TRANSLATION
 artifact_relic_sacred_tooth_desc: "Levý špičák Buddhy, přivezený z Kalingy ve 4. století – palladium královské moci, jehož opatrování opravňuje vládce k vládě nad všemi ostatními." # todo: NEW TRANSLATION
 artifact_relic_lingam_name: "Višvanáthův lingam" # todo: NEW TRANSLATION
 artifact_relic_lingam_desc: "Posvátný úlomek Šivova lingamu z velkého chrámu ve Váránasí, nejsvětějším městě na Ganze." # todo: NEW TRANSLATION
 artifact_relic_trishul_name: "Šivův trišul" # todo: NEW TRANSLATION
 artifact_relic_trishul_desc: "Trojzubec, jímž podle pověsti vládl sám Šiva – symbol boží nadvlády nad stvořením, zachováním a zničením." # todo: NEW TRANSLATION
 artifact_relic_krishna_stone_name: "Kámen z Krišnova rodiště" # todo: NEW TRANSLATION
 artifact_relic_krishna_stone_desc: "Ohlazený kámen z Krišnova janmabhúmi v Mathuře, přímo z místa, které tradice označuje za Krišnovo rodiště." # todo: NEW TRANSLATION
 artifact_relic_rama_footprint_name: "Rámova stopa" # todo: NEW TRANSLATION
 artifact_relic_rama_footprint_desc: "Kámen nesoucí otisk samotného Rámy, přivezený z Ajódhji, jeho rodiště." # todo: NEW TRANSLATION
 artifact_relic_palitana_tirtha_name: "Tírtha z Palitany" # todo: NEW TRANSLATION
 artifact_relic_palitana_tirtha_desc: "Posvátný kámen s relikvií z pohoří Šatrundžaja u Palitany, nejposvátnější tírthy džinistické tradice." # todo: NEW TRANSLATION
 artifact_relic_parshvanatha_paduka_name: "Čaran paduka Páršvanáthy" # todo: NEW TRANSLATION
 artifact_relic_parshvanatha_paduka_desc: "Čaran paduka, kámen nesoucí otisk chodidel třiadvacátého tírthankary Páršvanáthy." # todo: NEW TRANSLATION
 artifact_relic_shikharji_nishidhi_name: "Nišidhi tírthankarů" # todo: NEW TRANSLATION
 artifact_relic_shikharji_nishidhi_desc: "Pamětní kameny nišidhi z vrcholků hory Sammed-Šikhar, kde dvacet z čtyřiadvaceti tírthankarů dosáhlo mókši – nejposvátnější tírthy džinistické víry." # todo: NEW TRANSLATION
 artifact_relic_atash_bahram_name: "Žhavé uhlíky z Ádur Farnbagu" # todo: NEW TRANSLATION
 artifact_relic_atash_bahram_desc: "Žhnoucí uhlíky přinesené z velkého Atash Bahramu, posvátného Ohniště kněží, o které se dodnes pečuje v ohňovém chrámu." # todo: NEW TRANSLATION
 artifact_relic_yggdrasil_branch_name: "Větev Yggdrasilu" # todo: NEW TRANSLATION
 artifact_relic_yggdrasil_branch_desc: "Větev, která údajně spadla z posvátného stromu v chrámu v Uppsale, kde stále visí těla obětovaných." # todo: NEW TRANSLATION
 artifact_relic_perun_idol_name: "Perunova modla" # todo: NEW TRANSLATION
 artifact_relic_perun_idol_desc: "Dřevěná modla boha hromu Peruna, pána slovanských bohů, kterou vztyčil kníže Vladimír." # todo: NEW TRANSLATION
 artifact_relic_suldetug_name: "Prapor Sülde-tug" # todo: NEW TRANSLATION
 artifact_relic_suldetug_desc: "Černý prapor z jačích ocasů, schránka válečného boha, nesená před stepními chány." # todo: NEW TRANSLATION
 artifact_relic_yata_kagami_name: "Jata no Kagami" # todo: NEW TRANSLATION
 artifact_relic_yata_kagami_desc: "Bronzové zrcadlo tradičně ztotožňované s jedním ze tří japonských císařských klenotů. Podle pověsti vylákalo bohyni slunce Amaterasu z její jeskyně." # todo: NEW TRANSLATION
 artifact_relic_shin_no_mihashira_name: "Šin no Mihasira" # todo: NEW TRANSLATION
 artifact_relic_shin_no_mihashira_desc: "Tříška ze Šin no Mihasiry – posvátného ústředního pilíře pohřbeného pod nejvnitřnější svatyní Naikú, považovaného za nejskrytější a nejposvátnější z tajemství Ise. Obnovuje se při každé přestavbě šikinen sengú." # todo: NEW TRANSLATION
 artifact_relic_kong_tomb_name: "Stéla z hrobky rodu Kongů" # todo: NEW TRANSLATION
 artifact_relic_kong_tomb_desc: "Tesaná kamenná deska z Konfuciovy hrobky v Čchü-fu, kterou rod Kongů uctívá po celé generace." # todo: NEW TRANSLATION
 artifact_relic_analects_name: "Hovory Konfuciovy" # todo: NEW TRANSLATION
 artifact_relic_analects_desc: "Raná kopie Hovorů Konfuciových na bambusových proužcích – souboru výroků mistra Konga, který studovaly generace čínských učenců." # todo: NEW TRANSLATION
 artifact_relic_athena_promachos_name: "Úlomek Athény Promachos" # todo: NEW TRANSLATION
 artifact_relic_athena_promachos_desc: "Bronzový úlomek z kolosální sochy Athény, která kdysi střežila Akropoli." # todo: NEW TRANSLATION
 artifact_relic_opa_oranmiyan_name: "Opa Oranmiyan" # todo: NEW TRANSLATION
 artifact_relic_opa_oranmiyan_desc: "Žulová hůl legendárního krále Oranmiyana z Ife, pradávné kolébky Jorubů." # todo: NEW TRANSLATION
 artifact_relic_oshe_shango_name: "Oše Šango" # todo: NEW TRANSLATION
 artifact_relic_oshe_shango_desc: "Oše Šango, dvojitá sekera odlitá v podobě dvojice hromových kamenů boha bouře Šanga, kterou jeho kněží nesou vysoko při extatickém tanci." # todo: NEW TRANSLATION
 artifact_misc_relic_idol_name: "Posvátná modla" # todo: NEW TRANSLATION
 artifact_misc_relic_idol_desc: "Vyřezávaná modla, tělesné sídlo boha během rituálu." # todo: NEW TRANSLATION
 artifact_misc_relic_stele_name: "Stéla předků" # todo: NEW TRANSLATION
 artifact_misc_relic_stele_desc: "Kamenná deska s vyrytým rodokmenem kněžstva, svědek napříč generacemi." # todo: NEW TRANSLATION
 artifact_misc_relic_mask_name: "Rituální maska" # todo: NEW TRANSLATION
 artifact_misc_relic_mask_desc: "Obřadní maska nošená při nejposvátnějších obřadech, schránka božské přítomnosti." # todo: NEW TRANSLATION
 artifact_misc_relic_banner_name: "Svatý prapor" # todo: NEW TRANSLATION
 artifact_misc_relic_banner_desc: "Tkanina tohoto praporu, posvěceného k užití při velkých obřadech konaných na nejposvátnějších místech, je navždy prostoupena dýmem z obětních darů." # todo: NEW TRANSLATION
