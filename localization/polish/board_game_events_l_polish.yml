 board_games.0031.t: "$board_games.0000.t$"
 board_games.0031.desc.intro.01: "S vítězným řevem vyskočím na nohy a rozmetám [SCOPE.Custom('BG_GamePiecePlural')] do všech stran."
 board_games.0031.desc.intro.02: "Se samolibým úsměvem položím na desku poslední [SCOPE.Custom('BG_GamePiece')]."
 board_games.0031.desc.intro.03: "Oba hledíme na poslední [SCOPE.Custom('BG_GamePiece')]. Je to tady. Vítězství je mé."
 board_games.0031.desc.middle.01: "Tato partie [SCOPE.Custom('BG_GameType')] patří mně. Další znamenité vítězství na mé nezpochybnitelné cestě k titulu krále her."
 board_games.0031.desc.middle.02: "Má duševní převaha opět vítězí nade vším."
 board_games.0031.desc.middle.03: "[ROOT.Char.GetFaith.HighGodName] dnes přihlížel mému triumfu. Od samého začátku jsem nepochyboval, že mě [ROOT.Char.GetFaith.HighGodName] dovede k vítězství. Jinak to ani dopadnout nemohlo."
 board_games.0031.desc.end.01: "\n\nZoufalý [bg_loser.GetFirstName] zůstává sedět s rukama na stehnech a snaží se pochopit, kde nastala chyba."
 board_games.0031.desc.end.02: "\n\nZ postavy [bg_loser.GetFirstName] zbyla jen prázdná schránka [bg_loser.GetWomanMan]. Mému vítězství se nedá uvěřit."
 board_games.0031.desc.end.03: "\n\n[bg_loser.GetFirstName] sotva ovládá svůj hněv. Porážka i ponížení jsou mým dílem."
 board_games.0031.a: "Dobrá hra!"
 board_games.0031.a.a: "Vynikající zápas!"
 board_games.0031.b: "Jak chutná porážka, [bg_loser.GetWomanMan]?"
 board_games.0031.b.a: "Pokloň se mi, ty [bg_loser.Custom2('InsultNoun', ROOT.Char)]!"
 board_games.0031.b.b: "Nedělej si z toho #EMP příliš#! těžkou hlavu. Ne každý může být tak chytrý jako já."
 board_games.0031.b.progress_towards_rival: "[bg_loser.GetTitledFirstName] si to bere osobně"
 board_games.0031.c: "Někdy bych si rád zahrál znovu..."
 board_games.0031.a.tt.success: "Tvůj soupeř souhlasí, že to byla dobrá hra"
 board_games.0031.a.tt.failure: "Tvůj soupeř udělá obscénní gesto a odejde"
 board_games.0031.desc.result.skill: "#BOL Výsledek#! V [Concept('board_game_match','deskovém zápase')|E] proti [bg_loser.GetFirstNameNoTooltip] vítězím díky svému [Concept('board_game_winning','vítěznému skóre')|E]"
 board_games.0031.desc.result.sudden_death: "#BOL Výsledek#! V [Concept('board_game_match','deskovém zápase')|E] proti [bg_loser.GetFirstNameNoTooltip] vítězím díky [Concept('board_game_winning_sudden_death','náhlé smrti')|E]"
 board_games.0041.t: "$board_games.0000.t$"
 board_games.0041.desc.intro.01: "[bg_victor.GetFirstName] s nelidským vítězným zavytím vyskočí na nohy.\n\nJá... Je po všem. Ruce mi sklouznou na kolena a hledají oporu."
 board_games.0041.desc.intro.02: "Na tváři postavy [bg_victor.GetFirstName] se od ucha k uchu roztáhne samolibý úsměv. Vítězství patří [bg_victor.GetFirstName], porážka mně.\n\n"
 board_games.0041.desc.intro.03: "Není většího zklamání než při pohledu na [SCOPE.Custom('BG_GamePiecePlural')] na této desce. Jejich rozestavení jasně ukazuje, že jsem utrpěl porážku."
 board_games.0041.desc.middle.01: "[ROOT.Char.GetFaith.HighGodName] je mi svědkem, že víc už udělat nešlo..."
 board_games.0041.desc.middle.02: "Jen pomyslet, že mě mohl přelstít takový hlupák jako [bg_victor.GetFirstName]."
 board_games.0041.desc.middle.03: "\n\n[SCOPE.Custom('BG_GameType')|U] je stejně jen lacinou napodobeninou #EMP skutečné války#!, v níž nad svým ubohým protějškem nepochybně vynikám. Zatímco [Select_CString(bg_loser.IsFemale, 'studovala', 'studoval')] [SCOPE.Custom('BG_GameType')], #EMP [Select_CString(ROOT.Char.IsFemale, 'já studovala meč', 'já studoval meč')].#! Ale přesto..."
 board_games.0041.desc.end.01: "\n\nOpravdu mi [SCOPE.Custom('BG_GameType')] tak nejde?"
 board_games.0041.desc.end.02: "\n\nDlaně se mi potí a kolena slábnou při zjištění, že ani mé nejlepší schopnosti nestačí k porážce postavy [bg_victor.GetFirstName]."
 board_games.0041.desc.end.03: "\n\nTen [recipient.Custom2('InsultNoun', ROOT.Char)]! Ten [recipient.Custom2('InsultNoun', ROOT.Char)]! Není možné, že nepodváděl. Jak jsem mohl #EMP já#! prohrát?!"
 board_games.0041.a: "Příště se ukáže, kdo zvítězí..."
 board_games.0041.b: "Dneškem mezi námi vzniklo nepřátelství."
 board_games.0041.b.b: "Jen dál oslavuj a při [ROOT.Char.GetFaith.HighGodName] okusíš mou botu!"
 board_games.0041.c: "[Select_CString(bg_victor.IsFemale, 'Zvítězila lepší žena', 'Zvítězil lepší muž')]!"
