l_polish:
 board_games.0000.t: "Největší hra: [SCOPE.Custom('BG_GameType')|U]"
 board_games.0001.t: "$board_games.0000.t$"
 board_games.0001.desc.opponent_winning.diplomacy.low: "„Víš,“ přemítá můj protějšek, „možná nejsem zrovna výřečný, ale v [SCOPE.Custom('BG_GameType')] jsem znepokojivě dobrý.“"
 board_games.0001.desc.opponent_winning.diplomacy.medium: "„Ach, kéž by řečnění před lidmi bylo tak snadné jako porazit tě v [SCOPE.Custom('BG_GameType')],“ poznamenává můj protějšek."
 board_games.0001.desc.opponent_winning.diplomacy.high: "„Upřímně nevím, co je snazší,“ naříká můj protějšek, „porazit tě v [SCOPE.Custom('BG_GameType')], nebo vyprávět o tvé potupné prohře.“"
 board_games.0001.desc.opponent_winning.martial.low: "„Kdyby válčení bylo tak snadné jako [SCOPE.Custom('BG_GameType')], už bych vládl celému světu,“ směje se můj protějšek. „Ale to jsem zkrátka já.“"
 board_games.0001.desc.opponent_winning.martial.medium: "„Hmm, moc velký stratég zrovna nejsi, že?“ pochechtává se můj protějšek."
 board_games.0001.desc.opponent_winning.martial.high: "„Bojiště nebo herní deska, vždy záleží jen na tom nejdůležitějším,“ prozpěvuje můj protějšek a pro zdůraznění si kloubem poklepe na čelo."
 board_games.0001.desc.opponent_winning.stewardship.low: "„Kéž by hospodaření s penězi bylo tak snadné jako hraní [SCOPE.Custom('BG_GameType')],“ poznamenává můj protějšek. „Plaval bych ve stříbře.“"
 board_games.0001.desc.opponent_winning.stewardship.medium: "„Myslíš, že je [SCOPE.Custom('BG_GameType')] dobrou průpravou pro skutečnou správu?“ ptá se můj protějšek jakoby mimochodem. „Vždycky jsem si to tak trochu myslel. Ne že bych tím chtěl... něco naznačovat.“"
 board_games.0001.desc.opponent_winning.stewardship.high: "„Vždycky říkám, že [SCOPE.Custom('BG_GameType')] může [bg_opponent.GetWomanMan] mnohé naučit o správě panství,“ mudruje můj protějšek. „A samozřejmě i naopak.“"
 board_games.0001.desc.opponent_winning.intrigue.low: "„Právě proto mám [SCOPE.Custom('BG_GameType')] tak rád,“ soudí můj protějšek. „Žádné plížení, žádné lži, jen poctivé zápolení důvtipu. Takové, při kterém... no...“"
 board_games.0001.desc.opponent_winning.intrigue.medium: "„Víš, že při [SCOPE.Custom('BG_GameType')] můžeš podle [bg_myself.Custom('MaskFace')] #EMP přesně#! poznat, jak někdo lže?“ ptá se můj protějšek. „Ale tím jsem nechtěl... jen taková poznámka...“"
 board_games.0001.desc.opponent_winning.intrigue.high: "„Opatrně,“ ušklíbá se můj protějšek, „ještě jeden takový tah a spustíš mou léčku [SCOPE.Custom('BG_GamePiece')].“"
 board_games.0001.desc.opponent_winning.learning.low: "„Víš, prý potřebuji #EMP knihy#!, abych dokázal svou chytrost,“ rozumuje můj protějšek, „ale teď je snad docela jasné, že nejsem žádný hlupák.“"
 board_games.0001.desc.opponent_winning.learning.medium: "„Upřímně,“ rozplývá se můj protějšek, „vzhledem k tomu, proti komu stojíš, mě překvapuje, jak dobře si vedeš.“"
 board_games.0001.desc.opponent_winning.learning.high: "„[SCOPE.Custom('BG_GameType')] jsem důkladně studoval,“ vysvětluje můj protějšek, „a je mi líto, ale v této chvíli už podle mě nemáš žádnou možnost vyhrát.“"
 board_games.0001.desc.opponent_winning.trait.lustful: "„Jako nejlepší milenec #EMP a zároveň#! hráč [SCOPE.Custom('BG_GameType')] na světě ti nemohu mít za zlé, že se mnou prohráváš,“ pochechtává se můj protějšek."
 board_games.0001.desc.opponent_winning.trait.chaste: "„Kázeň v domácnosti plodí kázeň i u herní desky,“ poučuje můj protějšek. „Trocha zdrženlivosti dokáže divy.“"
 board_games.0001.desc.opponent_winning.trait.gluttonous: "„Myslím, že své vítězství oslavím hostinou,“ přemítá můj protějšek. „Mám chuť na něco sladkého, aby se to hodilo k vítězství.“"
 board_games.0001.desc.opponent_winning.trait.temperate: "„Po této hře si možná dokonce dopřeji pohár vody s vůní růží,“ přemítá můj protějšek. „Často se nerozmazluji, ale myslím, že jsem si ho zasloužil.“"
 board_games.0001.desc.opponent_winning.trait.greedy: "„Jediné, co je sladší než cinkot zlata, je tiché ťukání tvých slz o desku hry [SCOPE.Custom('BG_GameType')],“ usmívá se můj protějšek. „Nemyslíš?“"
 board_games.0001.desc.opponent_winning.trait.generous: "„Podívej, možná vyhrávám, ale když mě pěkně poprosíš, mohl bych tě prostě... nechat vyhrát,“ vysvětluje můj protějšek hlasem překypujícím laskavostí a lítostí. „Život nabízí víc než jen vítězství v [SCOPE.Custom('BG_GameType')].“"
 board_games.0001.desc.opponent_winning.trait.lazy: "Můj protějšek hlasitě zívne. „Upřímně jsem čekal trochu větší výzvu, [bg_myself.GetFirstNameNoTooltip]. Ještě jsem se ani pořádně neprobral.“"
 board_games.0001.desc.opponent_winning.trait.diligent: "„Právě proto se musíš snažit,“ utěšuje mě můj protějšek #EMP naprosto#! nesnesitelným tónem. „Poctivou práci ničím nenahradíš, ať už v životě, nebo v [SCOPE.Custom('BG_GameType')].“"
 board_games.0001.desc.opponent_winning.trait.wrathful: "Můj protějšek působí podivně a zcela netypicky klidně. „Nemám se proč hněvat,“ pronese, když zachytí můj pohled, „když všechno probíhá tak #EMP dobře#!.“"
 board_games.0001.desc.opponent_winning.trait.calm: "„Vždycky jsem zastával názor, že klíčem k [SCOPE.Custom('BG_GameType')] je jasná mysl a chladná hlava,“ přemítá můj protějšek. „Jednou toho možná také dosáhneš.“"
 board_games.0001.desc.opponent_winning.trait.patient: "„Většina lidí,“ poučuje mě můj protějšek, „si vůbec neuvědomuje, jak obtížné je provést [bg_opponent.Custom('BG_RandomArticleDirection')] [bg_opponent.Custom('BG_RandomRankPossessive')] [bg_opponent.Custom('BG_RandomMoveType')]. Natož se proti tomu ubránit.“"
 board_games.0001.desc.opponent_winning.trait.impatient: "„Při hraní [SCOPE.Custom('BG_GameType')] jsi opravdu poněkud pomalý, [bg_myself.Custom2('GetYoungMiddleAgedOld',bg_opponent)] [bg_myself.GetWomanMan],“ bručí můj protějšek a bubnuje prsty do desky."
 board_games.0001.desc.opponent_winning.trait.arrogant: "„Nic si z toho nedělej, [bg_myself.GetFirstNameNoTooltip],“ úlisně pronáší můj protějšek a pohodlně se rozvaluje. „Nemůžeme být všichni od přírody tak #EMP nadaní#!.“"
 board_games.0001.desc.opponent_winning.trait.humble: "„Upřímně, vedeš si skvěle,“ švitoří můj protějšek. „Obvykle se mi tak dobře nedaří, takže máš nejspíš jen smůlu.“"
 board_games.0001.desc.opponent_winning.trait.deceitful: "„Nedělej si z toho těžkou hlavu,“ konejší mě můj protějšek medově sladkým hlasem. „Ani [bg_opponent.GetFaith.TricksterGodName] by se v mých tazích nevyznal.“"
 board_games.0001.desc.opponent_winning.trait.honest: "„Páni, všechno probíhá #EMP mnohem#! lépe, než jsem čekal!“ vykřikne můj protějšek. „Vůbec nejsi obtížný protivník... ach, promiň, nechtěl jsem být nezdvořilý. Jen říkám pravdu.“"
 board_games.0001.desc.opponent_winning.trait.craven: "„Já... já vyhrávám? Já vyhrávám!“ vykřikne můj protějšek. Vypadá skutečně překvapeně, ale koneckonců #EMP strávil#! polovinu hry tím, že ji sledoval skrze prsty."
 board_games.0001.desc.opponent_winning.trait.brave: "„Snad mi dovolíš, abych se trochu zasmál,“ poznamenává můj protějšek. „Ale jestli chceš porazit #EMP mě#!, budeš muset hrát odvážněji než #EMP takhle#!.“"
 board_games.0001.desc.opponent_winning.trait.shy: "„Všechno to cvičení se konečně vyplácí!“ vypískne můj protějšek a nesměle, avšak pyšně se usmívá nad stavem herní desky."
 board_games.0001.desc.opponent_winning.trait.gregarious: "„Nic si z toho nedělej,“ protahuje můj protějšek a prokřupává si klouby. „V [SCOPE.Custom('BG_GameType')] vítězím stejně jako si získávám přátele. Znepokojivě snadno.“"
 board_games.0001.desc.opponent_winning.trait.ambitious: "„Myslíš, že se jmenuje nějaký... #EMP král#! her?“ ptá se můj protějšek a škrábe se na bradě. „Mám totiž pocit, že už se k tomu titulu propracovávám.“"
 board_games.0001.desc.opponent_winning.trait.content: "„To je ale krásná hra,“ pochechtává se můj protějšek. „Nic lepšího bychom si přece nemohli přát, že? Snad kromě tvého štěstí.“"
 board_games.0001.desc.opponent_winning.trait.arbitrary: "„Na pravidla si zpravidla příliš nepotrpím,“ soudí můj protějšek, „ale [SCOPE.Custom('BG_GameType')] mi trochu ukazuje, k čemu jsou dobrá. Občas ti umožní #EMP donutit#! ostatní přiznat, že jsi lepší než oni.“"
 board_games.0001.desc.opponent_winning.trait.just: "„Podívej,“ vysvětluje můj protějšek a mává přede mnou svazkem listin. „Mrzí mě, že se neustále pokoušíš o nepovolené tahy, ale kdybys sis #EMP přečetl pravidla#!, vedl by sis lépe.“"
 board_games.0001.desc.opponent_winning.trait.cynical: "„Samozřejmě že tě nešetřím,“ šklebí se můj protějšek. „Ty bys mě také #EMP rozhodně#! nešetřil, tak proč se namáhat?“"
 board_games.0001.desc.opponent_winning.trait.zealous: "„Rád bych si připsal zásluhy za toto jisté vítězství,“ pronáší líně můj protějšek, „ale ve skutečnosti je to všechno dílo [bg_opponent.GetFaith.KnowledgeGodName], který jedná #EMP skrze#! mě.“"
 board_games.0001.desc.opponent_winning.trait.paranoid: "„Vím, že máš stále nějaký trik v rukávu,“ mračí se můj protějšek. „Nikdo přece nemůže být #EMP takhle#! snadno porazitelný.“"
 board_games.0001.desc.opponent_winning.trait.trusting: "„Než budeš na tahu, možná si jen odskočím na prevét,“ usmívá se můj protějšek. „A neopovažuj se mi vrtat v [SCOPE.Custom('BG_GamePiecePlural')]!“"
 board_games.0001.desc.opponent_winning.trait.compassionate: "„Promiň, jestli tě svým tahem dostávám do nepříjemné situace, [bg_myself.GetFirstNameNoTooltip],“ říká můj protějšek s upřímnou lítostí v hlase. „[SCOPE.Custom('BG_GameType')] hraji pro zábavu, ale zábavné mi to připadá jen tehdy, když si hru užíváme #EMP oba#!.“"
 board_games.0001.desc.opponent_winning.trait.callous: "„Můj [bg_opponent.getfaith.HouseholdGodName], ty se ale vůbec neumíš bránit, viď?“ vykřikne můj protějšek bez obalu."
 board_games.0001.desc.opponent_winning.trait.sadistic: "„Je #EMP mnohem#! zábavnější pohrávat si se zraněným protivníkem,“ protahuje můj protějšek s hlasem plným potěšené jedovatosti. „Nemyslíš, [bg_myself.GetFirstNameNoTooltip]?“"
 board_games.0001.desc.opponent_winning.trait.stubborn: "„Pro změnu je docela příjemné tak snadno zvítězit,“ posmívá se můj protějšek. „Obvykle se musím několik hodin přít, než druhý hráč uzná, že jsem vyhrál.“"
 board_games.0001.desc.opponent_winning.trait.fickle: "„Opravdu se mi líbí, že ať se rozhodnu pro jakoukoli strategii, vždycky prohraješ stejně drtivě,“ žertuje můj protějšek."
 board_games.0001.desc.opponent_winning.trait.vengeful: "„Samozřejmě je to všechno jen odplata,“ syčí můj protějšek. „A ty zatraceně #EMP dobře#! víš za co.“"
 board_games.0001.desc.opponent_winning.trait.forgiving: "„Upřímně řečeno jsem čekal trochu větší výzvu,“ fňuká můj protějšek. „Ale to nevadí. Alespoň se na tobě dobře cvičí.“"
 board_games.0001.desc.opponent_winning.trait.rowdy: "Můj mladý protějšek na mě pokřikuje, či spíše nesrozumitelně mumlá, několik nepříliš promyšlených výhrůžek a ve svém rozjaření málem převrhne herní desku."
 board_games.0001.desc.opponent_winning.trait.charming: "„Měli bychom hrát [SCOPE.Custom('BG_GameType')] každý den, [bg_myself.GetFirstNameNoTooltip],“ švitoří můj mladý protějšek. „Vždycky je to taková zábava!“"
 board_games.0001.desc.opponent_winning.trait.curious: "„Víš,“ zamýšlí se můj mladý protějšek, „tím, že tě porážím, se toho opravdu hodně učím.“"
 board_games.0001.desc.opponent_winning.trait.pensive: "„Přečetl jsem toho tolik o tom, jak hrát [SCOPE.Custom('BG_GameType')],“ září můj mladý protějšek, „ale netušil jsem, jak snadné bude všechno #EMP uplatnit#!.“"
 board_games.0001.desc.opponent_winning.trait.bossy: "„Až tě porazím,“ prohlašuje můj mladý protějšek, „chci sladkou housku. Jako poplatek.“"
 board_games.0001.desc.opponent_winning.relation.friend: "„Hlavu vzhůru, ty kyselý [bg_myself.Custom('MaskFace')],“ směje se můj protějšek. „Je to jen malá hra mezi přáteli, ne?“"
 board_games.0001.desc.opponent_winning.relation.best_friend: "„Ať už vyhraji, nebo prohraji,“ říká [Select_CString(bg_opponent.IsFemale, 'moje nejlepší přítelkyně', 'můj nejlepší přítel')], „s nikým na světě bych nehrál [SCOPE.Custom('BG_GameType')] raději.“"
 board_games.0001.desc.opponent_winning.relation.rival: "„Můj [bg_opponent.GetFaith.FateGodName], v [SCOPE.Custom('BG_GameType')] jsi stejně špatný jako ve vládnutí!“ chechtá se [Select_CString(bg_opponent.IsFemale, 'moje soupeřka', 'můj soupeř')]."
 board_games.0001.desc.opponent_winning.relation.nemesis: "[Select_CString(bg_opponent.IsFemale, 'Má', 'Můj')] [Concept('nemesis', Select_CString(bg_opponent.IsFemale, 'úhlavní nepřítelkyně', 'úhlavní nepřítel'))|E] neříká nic. Jen na mě hledí a [bg_opponent.Custom('EyeEyes')] mu planou čirou, nezředěnou #EMP nenávistí#!."
 board_games.0001.desc.opponent_winning.relation.lover: "[Select_CString(bg_opponent.IsFemale, 'Má', 'Můj')] [Concept('lover', Select_CString(bg_opponent.IsFemale, 'milenka', 'milenec'))|E] ze mě nespouští oči a špičkou prstu začne něžně hladit jednu z [SCOPE.Custom('BG_GamePiecePlural')] a... Ach. #EMP Ach můj bože#!"
 board_games.0001.desc.opponent_winning.relation.soulmate: "Má [Concept('soulmate', Select_CString(bg_opponent.IsFemale, 'spřízněná duše', 'spřízněná duše'))|E] věnuje naší hře [SCOPE.Custom('BG_GameType')] jen poloviční pozornost. Především se mi upřeně dívá hluboko do [bg_myself.Custom('EyeEyes')]."
 board_games.0001.desc.opponent_winning.relation.bully: "„Vidíš?“ hihňá se můj protějšek. „Právě proto tě biju. Jsi prostě #EMP takový#! ubožák.“"
 board_games.0001.desc.opponent_winning.relation.victim: "Oči mé oběti planou spravedlivým hněvem a radostí, že se alespoň jednou všechno obrací #EMP v její#! prospěch."
 board_games.0001.desc.opponent_winning.relation.crush: "Počkat, řekl můj protějšek něco? Myslím, že něco řekl! Ach běda, někdy se při pohledu na něj prostě trochu zasním a teď jsem všechno pokazil."
 board_games.0001.desc.opponent_winning.relation.guardian: "„Pozorně mě sleduj, [bg_myself.GetFirstName],“ říká můj [Select_CString(bg_opponent.IsFemale, 'poručnice', 'poručník')]. „Všímej si, jak hraji, a možná se něčemu přiučíš.“"
 board_games.0001.desc.opponent_winning.relation.ward: "Můj [Select_CString(bg_opponent.IsFemale, 'svěřenkyně', 'svěřenec')] se na mě zářivě usměje. „Můžeme hrát [SCOPE.Custom('BG_GameType')] častěji? #EMP Prosím#!!“"
 board_games.0001.desc.opponent_winning.hook_on.weak: "„$board_games.0001.desc.opponent_winning.hook_on.strong$“"
 board_games.0001.desc.opponent_winning.hook_on.strong: "„Je příjemné obrátit proti tobě karty,“ říká můj protějšek. „Pořád mám pocit, že mě držíš pod palcem. Tedy pokud zrovna nehrajeme [SCOPE.Custom('BG_GameType')].“"
 board_games.0001.desc.opponent_winning.hooked_by.weak: "„$board_games.0001.desc.opponent_winning.hooked_by.strong$“"
 board_games.0001.desc.opponent_winning.hooked_by.strong: "„Neprohráváš schválně kvůli naší #EMP dohodě#!, že ne?“ ptá se můj protějšek a zamyšleně se škrábe na bradě. „Protože hraješ, jako by ses snažil prohrát.“"
 board_games.0001.desc.opponent_winning.match_history.recently_won_against.default: "„Ach, kolikrát už jsem tě porazil?“ směje se můj protějšek. „#EMP Upřímně#! už to ani nepočítám.“"
 board_games.0001.desc.opponent_winning.match_history.recently_won_against.county: "„[bg_myself.MakeScope.Var('bg_recent_land_loss_stake').Title.GetNameNoTier] si vede dobře,“ protahuje můj protějšek, „#EMP mnohem#! lépe od chvíle, kdy jsem tam převzal vládu.“"
 board_games.0001.desc.opponent_winning.match_history.recently_won_against.gamble: "„Další zápas,“ poznamenává můj protějšek, „a další vítězství na mém kontě. Takhle se přivedeš na mizinu.“"
 board_games.0001.desc.opponent_winning.match_history.recently_lost_against.default: "„Tak tohle,“ pochechtává se můj protějšek, „je #EMP mnohem#! lepší než ten #EMP předchozí#! zápas.“"
 board_games.0001.desc.opponent_winning.match_history.recently_lost_against.county: "„Po tom, co se stalo s [bg_opponent.MakeScope.Var('bg_recent_land_loss_stake').Title.GetNameNoTier], tě nemohu porážet dost často,“ bručí můj protějšek, stále roztrpčený kvůli naší staré sázce."
 board_games.0001.desc.opponent_winning.match_history.recently_lost_against.gamble: "„Zdá se, že tentokrát sázka vychází mně, viď?“ pochechtává se můj protějšek."
 board_games.0001.desc.opponent_winning.other.pro_gamer: "„Měl bys mé postupy opravdu pozorně sledovat,“ pronáší úlisně můj protějšek. „Právě se chystám provést něco, čemu se říká tah profesionálního hráče deskových her.“"
 board_games.0001.desc.opponent_winning.other.avlf: "„#EMP Ty#! jsi mistr hry? Nelichoť si, [bg_myself.GetFirstNameNoTooltip]. Vždyť nejsi ani hráč.“"
 board_games.0001.desc.i_am_winning.diplomacy.low: "„Já... nemůžu... Prostě na mě trochu zvolni!“ téměř křičí [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')], očividně rozčileně a neschopně nalézt správná slova."
 board_games.0001.desc.i_am_winning.diplomacy.medium: "[Select_CString(bg_opponent.IsFemale, 'Má soupeřka mlčí a jen rozmrzele bubnuje', 'Můj soupeř mlčí a jen rozmrzele bubnuje')] prsty o stůl."
 board_games.0001.desc.i_am_winning.diplomacy.high: "„Zdá se,“ uštěpačně pronáší [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')], „že máš nade mnou mírnou převahu. Prozatím.“"
 board_games.0001.desc.i_am_winning.martial.low: "„Nedokážu vést vojáky,“ naříká [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')], „nedokážu ani hrát [SCOPE.Custom('BG_GameType')]. K čemu vůbec jsem?“"
 board_games.0001.desc.i_am_winning.martial.medium: "[Select_CString(bg_opponent.IsFemale, 'Má soupeřka si zamyšleně hladí', 'Můj soupeř si zamyšleně hladí')] bradu. „Bylo mi naprosto #EMP jasné#!, že tento úskok vyjde...“"
 board_games.0001.desc.i_am_winning.martial.high: "„Kdyby tohle bylo skutečné bojiště,“ prohlašuje [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')], „všechno #EMP by#! probíhalo jinak.“"
 board_games.0001.desc.i_am_winning.stewardship.low: "„Proč jsou čísla #EMP vždycky#! tak obtížná?“ durdí se [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')]. „Při [SCOPE.Custom('BG_GameType')] musíš přemýšlet tak daleko dopředu, a já to prostě #EMP nedokážu#!.“"
 board_games.0001.desc.i_am_winning.stewardship.medium: "[Select_CString(bg_opponent.IsFemale, 'Má soupeřka upřeně hledí', 'Můj soupeř upřeně hledí')] na herní desku. „Někde... někde musí být chyba ve výpočtu...“"
 board_games.0001.desc.i_am_winning.stewardship.high: "„Bolí mě to přiznat,“ bručí [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')], „ale vyhlídky mi zrovna nepřejí.“"
 board_games.0001.desc.i_am_winning.intrigue.low: "„Můžeš na chvíli přestat tak #EMP nestydatě#! podvádět?“ vrčí [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')]."
 board_games.0001.desc.i_am_winning.intrigue.medium: "„Mám podezření, že má strategie potřebuje trochu více... lstivosti...“ mumlá [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')] a rozmrzele si prohlíží desku."
 board_games.0001.desc.i_am_winning.intrigue.high: "„Možná si myslíš, že vyhráváš,“ pochechtává se [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')], „ale myslíš si to jen proto, že chci, aby sis to myslel. A vím, že víš, že vím, že to víš.“"
 board_games.0001.desc.i_am_winning.learning.low: "„Tohle je naprosto nespravedlivé, vždyť ani #EMP nerozumím#! polovině pravidel,“ odfrkne si [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')]. „Očividně si je vymýšlíš za pochodu.“"
 board_games.0001.desc.i_am_winning.learning.medium: "„Ty #EMP zase#! používáš [bg_myself.Custom('BG_RandomRankPossessive')] [bg_myself.Custom('BG_RandomMoveType')]?“ naříká [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')]. „To je od tebe #EMP tak#! laciné.“"
 board_games.0001.desc.i_am_winning.learning.high: "„Začínat Bláznovým [bg_opponent.Custom('BG_RandomMoveType')] byla chyba,“ fňuká [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')]. „V podstatě už je po všem.“"
 board_games.0001.desc.i_am_winning.trait.lustful: "[Select_CString(bg_opponent.IsFemale, 'Má soupeřka', 'Můj soupeř')] zápasu vůbec nevěnuje pozornost a místo toho se soustředí na... tvary některých [SCOPE.Custom('BG_GamePiecePlural')]."
 board_games.0001.desc.i_am_winning.trait.chaste: "„Právě v tom spočívá problém s [SCOPE.Custom('BG_GameType')],“ vykřikuje [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')] a divoce rozhazuje rukama. „Rozněcuje vášně! Dráždí smysly! Je to čiré tělesné požitkářství v té nejnižší podobě.“"
 board_games.0001.desc.i_am_winning.trait.gluttonous: "[Select_CString(bg_opponent.IsFemale, 'Má soupeřka nepřítomně přežvykuje', 'Můj soupeř nepřítomně přežvykuje')] malou housku a ztrácí se v oblaku drobků a soustředění."
 board_games.0001.desc.i_am_winning.trait.temperate: "„Hrm,“ bručí [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')]. „Takové riskování se ti jednou vymstí.“"
 board_games.0001.desc.i_am_winning.trait.greedy: "[Select_CString(bg_opponent.IsFemale, 'Má soupeřka si nepřítomně přehazuje', 'Můj soupeř si nepřítomně přehazuje')] minci mezi prsty. Chladný kov [Select_CString(bg_opponent.IsFemale, 'jí', 'mu')] zřejmě dodává útěchu při pohledu na blížící se porážku."
 board_games.0001.desc.i_am_winning.trait.generous: "[Select_CString(bg_opponent.IsFemale, 'Má soupeřka se na mě laskavě usměje', 'Můj soupeř se na mě laskavě usměje')]. „Vedeš si #EMP tak#! dobře, jen tak dál!“"
 board_games.0001.desc.i_am_winning.trait.lazy: "„Ach, jsem na tahu?“ zívá [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')]. „Promiň, pozornost mi trochu utekla.“"
 board_games.0001.desc.i_am_winning.trait.diligent: "„Ano, teď vedeš,“ poučuje mě [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')], „ale s trochou úsilí tě ještě doženu!“"
 board_games.0001.desc.i_am_winning.trait.wrathful: "[bg_opponent.Custom('MaskFace_BehindIn')] [bg_opponent.Custom('MaskFace')] mého protějšku vystupuje obzvláště nevzhledná žíla. „Jestli budeš dál vyhrávat, vyzvracím na tuhle desku #EMP skutečnou#! krev, ty [bg_myself.Custom2('InsultNoun', SCOPE.sC('bg_opponent'))], co podvádíš!“"
 board_games.0001.desc.i_am_winning.trait.calm: "Obvykle vyrovnané vystupování mého protějšku je... narušené. [bg_opponent.Custom('MaskFace_BehindAcross')] [bg_opponent.Custom('MaskFace')] se objevuje náznak zamračení."
 board_games.0001.desc.i_am_winning.trait.patient: "„Možná máš prozatím navrch,“ poznamenává [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')], „ale dříve či později uděláš chybu. Vždycky ji udělají.“"
 board_games.0001.desc.i_am_winning.trait.impatient: "„Můj [bg_opponent.GetFaith.HighGodName], už je rozhodnuto, #EMP dobře#!?“ mračí se [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')]. „Tak už to prostě #EMP dohraj#!.“"
 board_games.0001.desc.i_am_winning.trait.arrogant: "„Ve skutečnosti mě neporážíš,“ chvástá se [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')]. „Možná si #EMP myslíš#!, že ano, ale to není možné.“"
 board_games.0001.desc.i_am_winning.trait.humble: "[Select_CString(bg_opponent.IsFemale, 'Uši mé soupeřky jsou', 'Uši mého soupeře jsou')] rozrušením #EMP viditelně#! rudé. „Nelze popřít, že tvé postupy jsou...“ [bg_opponent.GetSheHe] polkne, „bezchybné.“"
 board_games.0001.desc.i_am_winning.trait.deceitful: "„Vypadáš, že si potřebuješ odskočit,“ soucitně navrhuje [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')]. „Klidně běž, já desku pohlídám.“"
 board_games.0001.desc.i_am_winning.trait.honest: "„Hra proti tobě je překvapivě...“ můj protějšek se na chvíli odmlčí, „#EMP obtížná#!.“"
 board_games.0001.desc.i_am_winning.trait.craven: "[Select_CString(bg_opponent.IsFemale, 'Má soupeřka se neustále ošívá a vypadá, jako by se každou chvíli chystala utéct', 'Můj soupeř se neustále ošívá a vypadá, jako by se každou chvíli chystal utéct')]."
 board_games.0001.desc.i_am_winning.trait.brave: "„Mám plán,“ chlubí se [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')], „který celou hru obrátí v můj prospěch!“"
 board_games.0001.desc.i_am_winning.trait.shy: "[Select_CString(bg_opponent.IsFemale, 'Má soupeřka mlčky a bez hnutí sedí', 'Můj soupeř mlčky a bez hnutí sedí')] a zamračeně přemýšlí, jak převážit naši hru ve prospěch svých [SCOPE.Custom('BG_GamePiecePlural')]."
 board_games.0001.desc.i_am_winning.trait.gregarious: "„Jsi mnohem lepší než mí obvyklí spoluhráči,“ obdivně pronáší [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')], „a [SCOPE.Custom('BG_GameType')] hraji #EMP opravdu často#!.“"
 board_games.0001.desc.i_am_winning.trait.ambitious: "„Měl jsem...“ můj protějšek se zarazí a nenachází slova. „...Má očekávání od tohoto zápasu byla #EMP vyšší#!.“"
 board_games.0001.desc.i_am_winning.trait.content: "„Nu což,“ povzdechne si [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')], „možná nevyhraji, ale snaha nechyběla.“"
 board_games.0001.desc.i_am_winning.trait.arbitrary: "„Nechápu, proč nemůžeme hrát podle mých pravidel,“ naříká [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')]. „Říkám ti, že v [bg_opponent.GetCurrentLocation.GetNameNoTooltip] to takhle hrají všichni.“"
 board_games.0001.desc.i_am_winning.trait.just: "„Nemohu to dokázat,“ mumlá [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')], „ale nemám #EMP nejmenší pochybnost#!, že musíš podvádět.“"
 board_games.0001.desc.i_am_winning.trait.cynical: "„#EMP Samozřejmě#! že vyhráváš,“ sklíčeně naříká [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')]. „Nikdo mě #EMP nikdy#! nenechá vyhrát ve hře [SCOPE.Custom('BG_GameType')].“"
 board_games.0001.desc.i_am_winning.trait.zealous: "„Můj [bg_opponent.GetFaith.KnowledgeGodName]! Zbav mě této pohromy,“ mumlá si [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')] pod vousy."
 board_games.0001.desc.i_am_winning.trait.paranoid: "„Tohle byl tvůj plán, že ano?“ téměř vrčí [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')]. „Chtěl jsi mě #EMP ponížit#! ve zmanipulované hře!“"
 board_games.0001.desc.i_am_winning.trait.trusting: "„Můj [bg_opponent.GetFaith.KnowledgeGodName],“ naříká [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')]. „Myslíš, že těch příležitostí bylo příliš? Tak rychlá a drtivá porážka mě zaskočila.“"
 board_games.0001.desc.i_am_winning.trait.compassionate: "„Víš,“ významně poznamenává [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')], „[SCOPE.Custom('BG_GameType')] má být především #EMP zábava#!, a ne jen vítězství za každou cenu.“"
 board_games.0001.desc.i_am_winning.trait.callous: "„Hmm, takže takový je pocit z prohry?“ přemítá [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')]. „Zrovna se mi nezamlouvá.“"
 board_games.0001.desc.i_am_winning.trait.sadistic: "[Select_CString(bg_opponent.IsFemale, 'Má soupeřka mlčí', 'Můj soupeř mlčí')], ale [bg_opponent.Custom('EyeEyes')] prozrazují neochotný respekt k mým schopnostem a blížícímu se vítězství."
 board_games.0001.desc.i_am_winning.trait.stubborn: "„Neporazíš mě,“ cedí [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')] skrze zaťaté zuby. „Nikdo mě #EMP nikdy#! neporazí.“"
 board_games.0001.desc.i_am_winning.trait.fickle: "„[SCOPE.Custom('BG_GameType')] mě začíná docela nudit,“ fňuká [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')]. „Nemůžeme si zahrát něco jiného?“"
 board_games.0001.desc.i_am_winning.trait.vengeful: "[Select_CString(bg_opponent.IsFemale, 'Výraz mé soupeřky je kamenný. Prsty se jí svírají', 'Výraz mého soupeře je kamenný. Prsty se mu svírají')] kolem okraje desky, jako by se musela ovládat."
 board_games.0001.desc.i_am_winning.trait.forgiving: "[Select_CString(bg_opponent.IsFemale, 'Má soupeřka působí naprosto vyrovnaně', 'Můj soupeř působí naprosto vyrovnaně')] a [bg_opponent.Custom('MaskFace_BehindAcross')] [bg_opponent.Custom('MaskFace')] není patrná ani stopa zloby."
 board_games.0001.desc.i_am_winning.trait.rowdy: "„Jen abys věděl,“ šeptá [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')], „jestli prohraji, hodím ti celou tuhle hru na tu tvou pitomou hlavu.“"
 board_games.0001.desc.i_am_winning.trait.charming: "„Nechtěl bys na mě být #EMP trochu#! mírnější?“ ptá se [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')] přeslazeným hlasem."
 board_games.0001.desc.i_am_winning.trait.curious: "„Počkat... jak to, že #EMP vyhráváš#!?“ [Select_CString(bg_opponent.IsFemale, 'Má soupeřka vypadá', 'Můj soupeř vypadá')] naprosto nevěřícně."
 board_games.0001.desc.i_am_winning.trait.pensive: "„Ach ne, nemělo mě napadnout hrát... teď jen marním tvůj čas...“ mumlá [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')]."
 board_games.0001.desc.i_am_winning.trait.bossy: "„Hrm, kdybychom hráli podle #EMP mých#! pravidel, #EMP všechno#! by vypadalo jinak!“ naříká [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')]."
 board_games.0001.desc.i_am_winning.relation.friend: "„Zatraceně,“ směje se [Select_CString(bg_opponent.IsFemale, 'má přítelkyně', 'můj přítel')], „při [SCOPE.Custom('BG_GameType')] nešetříš vůbec nikoho, že?“"
 board_games.0001.desc.i_am_winning.relation.best_friend: "„Není nic lepšího,“ vychloubá se [Select_CString(bg_opponent.IsFemale, 'má nejlepší přítelkyně', 'můj nejlepší přítel')], „než někoho drtivě porazit ve hře [SCOPE.Custom('BG_GameType')]. Závidím ti!“"
 board_games.0001.desc.i_am_winning.relation.rival: "„Ty mě prostě #EMP miluješ#! ponižovat, že?“ prská [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')], jako vždy neschopně snášet porážku."
 board_games.0001.desc.i_am_winning.relation.nemesis: "$board_games.0001.desc.opponent_winning.relation.nemesis$"
 board_games.0001.desc.i_am_winning.relation.lover: "„Nemusíme #EMP nutně#! hrát [SCOPE.Custom('BG_GameType')], [bg_myself.GetFirstNameNoTooltip],“ šeptá [Select_CString(bg_opponent.IsFemale, 'má milenka', 'můj milenec')]. „Určitě bychom se mohli zabavit i jinak...“"
 board_games.0001.desc.i_am_winning.relation.soulmate: "$board_games.0001.desc.opponent_winning.relation.soulmate$"
 board_games.0001.desc.i_am_winning.relation.bully: "„Jestli mě porazíš, zbiju tě. Je to prosté,“ mračí se [Select_CString(bg_opponent.IsFemale, 'má tyranka', 'můj tyran')]."
 board_games.0001.desc.i_am_winning.relation.victim: "Má oběť mlčí, ale vypadá, že je na pokraji slz."
 board_games.0001.desc.i_am_winning.relation.crush: "Má tajná láska je... Ach ne! Určitě se na mě zlobí, poznám to podle [bg_opponent.Custom('MaskFace')]!"
 board_games.0001.desc.i_am_winning.relation.guardian: "„Zdá se, že se učíš,“ mrzutě poznamenává [Select_CString(bg_opponent.IsFemale, 'má poručnice', 'můj poručník')]. „Nebo mě alespoň napodobuješ účinněji.“"
 board_games.0001.desc.i_am_winning.relation.ward: "[Select_CString(bg_opponent.IsFemale, 'Má svěřenkyně je očividně raněná', 'Můj svěřenec je očividně raněný')] tím, jak drtivě prohrává, a [bg_opponent.Custom('MaskFace_BehindAcross')] [bg_opponent.Custom('MaskFace')] se zračí ostré zamračení."
 board_games.0001.desc.i_am_winning.hook_on.weak: "$board_games.0001.desc.i_am_winning.hook_on.strong$"
 board_games.0001.desc.i_am_winning.hook_on.strong: "„[bg_opponent.GetFaith.random_GoodGodNames]! Ty mi nemůžeš dopřát ani špetku kontroly, že?“ naříká [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')]."
 board_games.0001.desc.i_am_winning.hooked_by.weak: "$board_games.0001.desc.i_am_winning.hooked_by.strong$"
 board_games.0001.desc.i_am_winning.hooked_by.strong: "„Kdyby nebyla škoda vymáhat zde to, co mi #EMP dlužíš#!,“ mračí se [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')], „snad by šlo tě #EMP donutit#! prohrát.“"
 board_games.0001.desc.i_am_winning.match_history.recently_won_against.default: "„Nuže,“ sténá [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')], „zdá se, že #EMP tato#! hra se nevyvíjí v můj prospěch.“"
 board_games.0001.desc.i_am_winning.match_history.recently_won_against.county: "„Škoda, že ti to nešlo tak dobře, když bylo v sázce [bg_myself.MakeScope.Var('bg_recent_land_loss_stake').Title.GetNameNoTier],“ ušklíbá se [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')]."
 board_games.0001.desc.i_am_winning.match_history.recently_won_against.gamble: "„Ach,“ povzdechne si [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')]. „Jednou vyhraješ, podruhé prohraješ. Tentokrát je, zdá se, řada na tobě.“"
 board_games.0001.desc.i_am_winning.match_history.recently_lost_against.default: "„Ne, ne, ne!“ fňuká [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')]. „Ne #EMP znovu#!, a už vůbec ne s #EMP tebou#!!“"
 board_games.0001.desc.i_am_winning.match_history.recently_lost_against.county: "[Select_CString(bg_opponent.IsFemale, 'Má soupeřka si otírá', 'Můj soupeř si otírá')] kapku potu z [bg_opponent.Custom('MaskFace')]. [bg_opponent.Custom('EyeEyes')] má doširoka otevřené a při hraní si nepochybně v duchu přehrává hru, při níž [Select_CString(bg_opponent.IsFemale, 'přišla', 'přišel')] o [bg_myself.MakeScope.Var('bg_recent_land_less_stake').Title.GetNameNoTier]."
 board_games.0001.desc.i_am_winning.match_history.recently_lost_against.gamble: "„Potřebuji jen jednou vyhrát, potřebuji jen jednou vyhrát, potřebuji jen...“ mumlá si [Select_CString(bg_opponent.IsFemale, 'má soupeřka', 'můj soupeř')] stále dokola pod vousy."
 board_games.0001.desc.intro.opening.defender: "[bg_opponent.GetTitledFirstName] už čeká, až zahájíme svůj malý zápas ve hře [SCOPE.Custom('BG_GameType')], a v rysech se zřetelně zračí #color_blue_gray [bg_myself.Custom('BG_RandomFacialExpression')]#!."
 board_games.0001.desc.intro.opening.attacker: "[bg_opponent.GetTitledFirstName] se posadí naproti mně. Náš malý zápas ve hře [SCOPE.Custom('BG_GameType')] brzy začne a #color_blue_gray [SCOPE.Custom('BG_RandomFacialExpression')]#! mi přesně prozrazuje, jak sebejistě si [Select_CString(bg_opponent.IsFemale, 'má', 'můj')] [bg_myself.Custom2('RelationToMeShort', bg_opponent)] počíná.\n\nJako první táhne a zahajuje hru"
 board_games.0001.desc.intro.subsequent: "Náš zápas pokračuje a [bg_opponent.GetFirstName] navazuje"
 board_games.0001.desc.intro.diplomacy.crit_success: "nesnesitelně odvážnou, nemluvě o troufalé, sérií tahů."
 board_games.0001.desc.intro.diplomacy.success: "zdařilým tahem a duchaplnou poznámkou."
 board_games.0001.desc.intro.diplomacy.failure: "několika chabě skrývanými pokusy o lest."
 board_games.0001.desc.intro.diplomacy.crit_failure: "žalostně průhledným pokusem zmást mě."
