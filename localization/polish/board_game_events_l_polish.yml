 board_games.0041.desc.result.sudden_death: "#BOL Výsledek#! V [Concept('board_game_match','deskovém zápase')|E] proti [bg_victor.GetFirstNameNoTooltip] prohrávám kvůli [Concept('board_game_winning_sudden_death','náhlé smrti')|E]"
 board_games.0051.t: "Šťastná náhoda"
 board_games.0051.desc: "Ještě dnes někdy s potěšením vzpomínám na to, jak drtivě jsem před několika měsíci porazil postavu [bg_loser.GetFirstName] ve hře [SCOPE.Custom('BG_GameType')]. Výraz na [bg_loser.Custom('MaskFace')] byl #EMP k nezaplacení#!.\n\nMožná ještě někde mám desku, na které jsme hráli. Dobrou desku, šťastnou desku, s [SCOPE.Custom('BG_GamePiecePlural')], jež byly svědky jedné z nejlepších partií, jaké kdy byly sehrány.\n\n[bg_victor.GetFaith.KnowledgeGodName] se na ni bezpochyby již usmívá. Byla by pošetilost nechat ji zmizet."
 board_games.0051.a: "Ach, ta mi bude přinášet štěstí navěky!"
 board_games.0051.b: "Ještě pár kamenů a mohl by z toho být #EMP skutečně#! vzácný soubor..."
 board_games.0051.c: "Žádné zvláštní hračky nepotřebuji."
 board_games.0102.t: "Hra her"
 board_games.0102.desc: "BGE spojuje všechny tvé oblíbené deskové hry do jediné: šachy, pačísí, hnefaffetteffleelfae a tabulu.\n\nJaké další hry máš rád?\n\nMohly by v ní být i ty další hry, ale ještě víc lepší!\n\n#EMP A legálně už o celá staletí dřív.#!\n\nObyčejným deskovým hrám by se mělo říkat: Nudím se. Hry."
 board_games.0102.a: "Obyčejnou hru, prosím."
 board_games.0102.b: "Ať protivník používá jen texty pro vítězství, prosím."
 board_games.0102.c: "Ať protivník používá jen texty pro prohru, prosím."
