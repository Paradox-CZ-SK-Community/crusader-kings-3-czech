l_polish:
 bm_867_adventurers: "Skromné počátky"
 bm_867_adventurers_desc: "Každá dynastie má skromné počátky. Vzestup k moci je obvykle pomalý proces, při němž každá generace vystoupá o několik příček výše díky pečlivě naplánovaným sňatkům a neutuchajícím válkám.\n\n#bold Toto jsou však časy velkých změn a otřesů. S velkou dávkou odvahy a možná i trochou štěstí může hrdina pozvednout jméno své rodiny z neznámosti až mezi legendy. Jsi připraven přijmout tuto výzvu?#!"
 bookmark_adventurers_jarl_haesteinn: "Jarl Hæsteinn"
 bookmark_adventurers_jarl_haesteinn_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_adventurers_jarl_haesteinn_desc: "Díky lstivosti a odvaze se jarl Hæsteinn stal bohatým mužem. Poté, co společně s Björnem Železným bokem vedl výnosný nájezd napříč Středomořím, se Hæsteinn usadil v Bretani. Frankové mají pokladnice jako stvořené k vyplenění a mocný vikinský válečník je v dobách politických zmatků skvělým spojencem.\n\n#bold Úspěch se však neobejde bez nepřátel. Stane se Hæsteinnovi jeho chamtivost osudnou, nebo bude jeho dynastie pod tvým vedením vzkvétat?#!"
 bookmark_adventurers_jarl_haesteinn_alt_ragnarr: "$Ragnarr$"
 bookmark_adventurers_jarl_haesteinn_alt_ragnarr_desc: "Alternativní popis"
 bookmark_adventurers_rurik_rurikid: "Rurik Rurikovec"
 bookmark_adventurers_rurik_rurikid_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_adventurers_rurik_rurikid_desc: "Jen málokdo se povznesl z naprosté bezvýznamnosti k velikosti tak jako statečný Rurik! Společně se svými bratry vnesl řád do východní divočiny a od jejich smrti je jediným vládcem rozsáhlého náčelnictví. To je však teprve začátek.\n\n#bold Jednoho dne Rurikovi potomci založí Ruské carství. Nebo snad ne? Osud této velké dynastie spočívá ve tvých rukou.#!"
 bookmark_adventurers_rurik_rurikid_alt_helgi: "$Helgi$ $nick_the_seer$"
 bookmark_adventurers_count_eudes: "Hrabě Eudes"
 bookmark_adventurers_count_eudes_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_adventurers_count_eudes_desc: "V červenci roku 866 zabil vikinský nájezdník Hæsteinn Eudesova otce Roberta Silného. O pouhých několik měsíců později zemřela jeho matka Adelais při porodu jeho bratra Roberta. Svět je krutý a budoucnost se může zdát nejistá, avšak tito osiřelí chlapci jsou předurčeni usednout na francouzský trůn. Jejich potomci Kapetovci budou vládnout Francii po celá následující staletí.\n\n#bold Dokážeš se vyznat ve zrádné politice středověké Francie a naplnit osud bratří Robertovců?#!"
 bookmark_adventurers_count_eudes_alt_robert: "$Robert$"
 bookmark_adventurers_count_eudes_alt_robert_desc: "Alternativní popis"
 bookmark_adventurers_count_eudes_alt_uncle_eudes: "$Eudes$"
 bookmark_adventurers_count_eudes_alt_uncle_eudes_desc: "Alternativní popis"
 bookmark_adventurers_almos_arpad: "Álmos Árpád"
 bookmark_adventurers_almos_arpad_subheading: "$BOOKMARK_SUBHEADING_KHAN_WITH_THE$"
 bookmark_adventurers_almos_arpad_desc: "Když se sedm maďarských kmenů sjednotilo, aby zvolilo nejvyššího vůdce, jejich volba padla na statečného Álmoše. Jednoho dne převezme jeho syn Árpád jeho úlohu — avšak pouze tehdy, pokud si Maďaři dokážou udržet nezávislost. Na východním obzoru se rýsuje nebezpečí.\n\n#bold Dokážeš Maďary ubránit a dovést je k velikosti? Toto je tvá příležitost převyprávět dobrodružství dynastie Arpádovců!#!"
 bookmark_adventurers_daurama_daura: "Daurama Daura"
 bookmark_adventurers_daurama_daura_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_adventurers_daurama_daura_desc: "Jako poslední magadžija Daury je Daurama symbolem dávných tradic Hausů. Její nový manžel Bayajiddah, původem z Iráku, představuje změnu, neboť do Hausalandu proudí stále více cizinců, kteří s sebou přinášejí své podivné víry a kultury...\n\n#bold Daurama má vstoupit do dějin jako poslední magadžija, ale musí tomu tak skutečně být?#!"
 bookmark_adventurers_daurama_daura_alt_bawo: "$Bawo$"
 bookmark_adventurers_almos_arpad_alt_son_arpad: "$A_rpA_d$"
 bookmark_adventurers_almos_arpad_alt_linutika: "$LinU_tika$"
 bookmark.0101.t: "Co se skrývá ve jménu?"
 bookmark.0101.desc_intro: "Po celé generace vládla [hausaland.GetNameNoTier] linie matriarchálních panovnic zvaných magadžije, přičemž poslední v této řadě jsem já.\n\nNaše tradice nám dobře sloužily, ale svět se mění. [bayajidda.GetFirstName], můj [ROOT.Char.Custom2('RelationToMeShort', bayajidda)], si svými hrdinskými skutky získal velké bohatství a úctu... protože však [bayajidda.GetSheHe] pochází ze vzdálených zemí, [bayajidda.GetHerHis] úspěchy rovněž předznamenávají velké změny pro můj lid.\n\n"
 bookmark.0101.desc_living: "Můj syn [bewo.GetTitledFirstName] je miláčkem svého otce. Ačkoli je ještě pouhým nemluvnětem, přemýšlím, zda se bude více ztotožňovat se svým dobrodružným otcem, nebo s mým tradičním odkazem."
 bookmark.0101.desc_dead: "Můj syn [bewo.GetTitledFirstName] byl miláčkem svého otce. Ačkoli je ještě pouhým nemluvnětem, přemýšlím, zda se bude více ztotožňovat s legendou svého dobrodružného otce, nebo s mým tradičním odkazem."
 bookmark.0101.a: "[bewo.GetFirstNameNoTooltip] musí do nové éry přenést tradice, jež vyznává [ROOT.Char.GetCulture.GetNameNoTooltip] kultura."
 bookmark.0101.a.tt: "[bewo.GetUIName] se stane tvým [Concept('player_heir','dědicem')|E]"
 bookmark.0101.b: "Můj syn je mým synem bez ohledu na své jméno či kulturu."
 bookmark.0101.b.tt: "#warning @warning_icon! Tato možnost tě může ponechat bez [Concept('player_heir','dědice')|E]!#!"
 bookmark.0101.c: "Magadžije nepotřebují muže, kteří by pokračovali v jejich odkazu!"
 bookmark.0101.c.tt: "Tvoje sestra [shawata.GetUIName] zůstane tvou [Concept('player_heir','dědičkou')|E]"
 bookmark.0211.t: "Na památku tvého dobrého vkusu"
 bookmark.0211.desc: "[michael.GetFirstNamePossessive] mrtvola leží přede mnou schoulená na podlaze a počáteční proud krve z jeho useknuté končetiny již zeslábl na pouhé krůpěje. Dobrý večer, přestože jsme [Glossary( 'udeřili dříve, než jsme zamýšleli', 'BOOKMARK_0211_MICHAEL_III_DEATH_GLOSS' )].\n\n#EMP Starší#! císař. Pche, naivní hlupák bez nadání i žaludku pro politiku. Měl všechny výhody, které může Bůh člověku dát, a přesto o všechno přišel kvůli bezejmennému muži z provincií.\n\nJá už však pouhým provinciálem nejsem. Od této noci jsem #EMP já#! císařem, [basil.GetTitledFirstName], prvním z nepochybně slavné dynastie [basil.GetDynasty.GetName].\n\nKdyž dopíjím svůj pohár — jedno z [michael.GetFirstNamePossessiveNoTooltip] oblíbených vín — přemítám, jak si dějiny tohoto mladíka zapamatují. Jak jim #EMP dovolím#!, aby si ho zapamatovaly."
 bookmark.0211.a: "Zemřel opilý, a proto zůstane opilcem!"
 bookmark.0211.a.flavour: "Kvůli tobě a tvým potomkům bude [michael.GetFirstNameNoTooltip] ještě desítky let po své smrti očerňován jako opilec a budižkničemu."
 bookmark.0211.b: "Ten hlupák mi dal svou rodinu, svůj trůn i svůj život. To stačí."
 bookmark.0211.b.flavour: "Dovolíš, aby se [michael.GetFirstNamePossessiveNoTooltip] pověst napravila, a obnovení úcty k ikonám jeho matkou během jejího regentství za něj budeš považovat za téměř svatý čin."
 bookmark.0211.c: "Toto je skutečně mimořádně dobrý ročník..."
 bookmark.0211.c.flavour: "Dovolíš, aby [michael.GetFirstNamePossessiveNoTooltip] památka přirozeně vybledla — alespoň z větší části."
 BOOKMARK_0211_MICHAEL_III_DEATH_GLOSS: "Historicky byl Michael III. zavražděn 24. září 867, nikoli 31. prosince 866. Jeho datum úmrtí bylo v Crusader Kings 3 posunuto kvůli hratelnosti."
