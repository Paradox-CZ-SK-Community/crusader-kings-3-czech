l_polish:
 bm_1178_call_of_the_empire: "Volání impéria"
 bm_1178_call_of_the_empire_desc: "Stárnoucí císař, nezletilý dědic a nedávná porážka na bitevním poli od anatolských Seldžuků zanechaly Byzanc zranitelnou a dějiny znovu a znovu dokazují, že největší hrozby pro říši přicházejí stejně často zevnitř jako zvenčí.\n\n#bold Čeká dědice Říma jejich poslední soumrak, nebo přečkají dlouhou noc a dočkají se nového úsvitu?#!"
 bookmark_call_of_the_empire_tamar: "Princezna Tamar"
 bookmark_call_of_the_empire_tamar_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_call_of_the_empire_tamar_giorgi: "Král Giorgi z Gruzie"
 bookmark_call_of_the_empire_tamar_rusudan: "Rusudan"
 bookmark_call_of_the_empire_tamar_desc: "Navzdory ráznému odporu gruzínské šlechty dal gruzínský král jasně najevo, že jej na trůně vystřídá jeho nejstarší dcera Tamar, což je v dlouhých dějinách království bezprecedentní čin.\n\nCesta vpřed bude obtížná a jen málokterý z jejích budoucích vazalů by ji rád viděl uspět, avšak ti, kdo princeznu dobře znají, nepochybují, že této výzvě dostojí.\n\n#bold Dokážeš vyvést z omylu ty, kdo pochybují o tvých schopnostech, a dovést Gruzii do slavného zlatého věku?#!"
 bookmark_call_of_the_empire_kilij_arslan: "Sultán Kilij Arslan"
 bookmark_call_of_the_empire_kilij_arslan_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_call_of_the_empire_kilij_arslan_suleyman: "Suleyman"
 bookmark_call_of_the_empire_kilij_arslan_kaykhusraw: "Kaykhusraw"
 bookmark_call_of_the_empire_kilij_arslan_desc: "Kilij Arslan, který právě zvítězil nad Byzantinci v bitvě u Myriokefala, prokázal, že je v Anatolii mocností, s níž je nutné počítat.\n\nČasem by mohl dovést svá vojska až k samotným hradbám Konstantinopole, avšak soupeření jeho mnoha synů o následnictví by se mohlo stát smrtícím rozptýlením, neboť i vlastní otec Kilije Arslana usedl na trůn přes mrtvolu svého bratra.\n\n#bold Který z tvých synů se ukáže být hoden pokračovat v tvém úsilí a dokáže Rúm přežít jejich soupeření?#!"
 bookmark_call_of_the_empire_angelos: "Stratégos Andronikos"
 bookmark_call_of_the_empire_angelos_subheading: "$BOOKMARK_SUBHEADING_GOVERNOR$"
 bookmark_call_of_the_empire_angelos_alexios: "Alexios"
 bookmark_call_of_the_empire_angelos_ioannes: "Ioannes"
 bookmark_call_of_the_empire_angelos_desc: "Andronikos, vnuk basilea Alexia Komnena, si během služby říši vydobyl vynikající pověst, avšak čím více jeho bratrů a synů stoupá po pyramidě moci, tím více se přibližují nebezpečným výšinám, kde by jediný chybný krok mohl být osudný pro ně všechny.\n\n#bold Dynastie Komnenovců byla vybudována na bratrských poutech a ty máš pokrevních příbuzných více než dost. Dokážeš využít svých rodinných vazeb a vystoupat ještě výše?#!"
 bookmark_call_of_the_empire_palaiologos: "Stratégos Alexios"
 bookmark_call_of_the_empire_palaiologos_subheading: "$BOOKMARK_SUBHEADING_GOVERNOR$"
 bookmark_call_of_the_empire_palaiologos_eirene: "Eirene"
 bookmark_call_of_the_empire_palaiologos_desc: "Alexiova rodina vyniká dokonce i mezi mocnými a vlivnými rody Byzantské říše, neboť již více než století zaujímá místo u pomyslného stolu moci a jeho předkové významně přispěli k vzestupu Komnenovců.\n\nJejich věrnost trůnu je neochvějná, avšak blízkost moci často přináší mocná pokušení: jak dlouho ještě budou Palaiologové spokojeni se službou?\n\n#bold Budou Alexios a jeho rodina nadále podporovat trůn, nebo po něm sami zatouží?#!"
 bookmark_call_of_the_empire_ioannes_kantakouzenos: "Stratégos Ioannes"
 bookmark_call_of_the_empire_ioannes_kantakouzenos_subheading: "$BOOKMARK_SUBHEADING_GOVERNOR$"
 bookmark_call_of_the_empire_ioannes_kantakouzenos_michael: "Michael"
 bookmark_call_of_the_empire_ioannes_kantakouzenos_desc: "Ioannes je jedním z nejzkušenějších velitelů basilea Manuela a jeho herkulovská postava a statečnost na bitevním poli se vyrovnají pouze jeho ohromující aroganci a bezuzdné zbrklosti, tedy vlastnostem, které v byzantské politické aréně jen zřídka přispívají k dlouhému a zdravému životu.\n\n#bold Vynese Ioannova smělost rodinu Kantakuzenů nad její současné postavení, nebo se nakonec jeho arogance stane příčinou jejich zkázy?#!"
