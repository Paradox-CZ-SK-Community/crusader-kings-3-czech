l_polish:
 bm_867_carolingians: "Karlovci"
 bm_867_carolingians_desc: "Po smrti Ludvíka Pobožného byla kdysi mocná Karolínská říše rozdělena na tři samostatná království: Východofranskou, Západofranskou a Středofranskou říši. Od té doby se tato panství dále tříští, neboť války, povstání a dědictví přinášejí nestabilitu a rozdrobení.\n\n#bold Je některý z Karlovců natolik silný, aby jejich říši znovu sjednotil? Nebo je rodinné sváry učiní snadnou kořistí pro oportunisty?#!"
 bookmark_carolingians_charles_the_bald: "Karel Holý"
 bookmark_carolingians_charles_the_bald_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_carolingians_charles_the_bald_desc: "V době Karlova narození již jeho dospělí nevlastní bratři vládli vlastním královstvím v rámci Karolínské říše. Protože neměl vlastní korunu, začalo se mu říkat „Holý“, ačkoli nakonec zdědil Akvitánii a Západofranskou říši. V budoucnu zdědí dokonce Itálii a samotnou Svatou říši římskou, jeho rodová linie však nepřetrvá — jeho poslední vnuk zemře bezdětný pouhých sedm let po jeho vlastní smrti.\n\n#bold Dokážeš změnit běh dějin a zajistit Karlovým potomkům dlouhou a prosperující budoucnost?#!"
 bookmark_carolingians_charles_the_bald_alt_judith: "$Judith$"
 bookmark_carolingians_charles_the_bald_alt_louis: "$Louis$ $nick_the_stammerer$"
 bookmark_carolingians_king_lothaire: "Král Lothar II."
 bookmark_carolingians_king_lothaire_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_carolingians_king_lothaire_desc: "Ačkoli Lothar miloval svou milenku Waldradu, jeho otec jej přinutil k politickému sňatku s Teutbergou. Z jejich svazku nevzešly žádné děti a Lotharův život se proměnil v neustálý boj o rozvod s manželkou a legitimizaci jeho nemanželských dětí. Přestože se o to nikdy nepřestane snažit, Lothar nakonec zemře bez právoplatného dědice.\n\n#bold Dokážeš překonat úklady těch, kteří proti tobě kují pikle, a zajistit pokračování svého rodu?#!"
 bookmark_carolingians_king_lothaire_alt_waldrada: "$Waldrada$"
 bookmark_carolingians_king_lothaire_alt_teutberga: "$Teutberga$"
 bookmark_carolingians_ludwig_the_german: "Ludvík Němec"
 bookmark_carolingians_ludwig_the_german_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_carolingians_ludwig_the_german_desc: "Ctižádostivý Ludvík se již dlouho snaží znovu dobýt části říše, které považuje za své rodné právo. Jeho ambice však utrpěly jednu ránu za druhou, neboť všechna jeho vojenská tažení skončila neúspěchem a jeho vzpurní synové mu vyrvali z rukou většinu jeho vlastních zemí.\n\n#bold Dokážeš zvrátit Ludvíkovo neštěstí a získat říši zpět pro jeho potomky, nebo jsou jeho synové odsouzeni stát se pouhou poznámkou pod čarou dějin?#!"
 bookmark_carolingians_ludwig_the_german_alt_youngerludwig: "$Ludwig$ $nick_the_younger$"
 bookmark_carolingians_ludwig_the_german_alt_karl: "$Karl$"
 bookmark_carolingians_king_louis: "Král Ludvík II."
 bookmark_carolingians_king_louis_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_carolingians_king_louis_desc: "V době, kdy byl Ludvík korunován císařem Svaté říše římské, již císařská moc upadla natolik, že tento titul neposkytoval žádnou skutečnou autoritu. Ačkoli se mu podařilo znovu získat Provensálské království, Ludvíkovi strýcové a bratr, které netíží žádná věrnost císařské koruně, si nadále dělají, co se jim zlíbí. Ludvík II., obklopený svárlivými sousedy a vládnoucí nestabilnímu panství, zemře dříve, než zplodí syna.\n\n#bold Dokážeš znovu získat všechna ztracená území říše a navrátit císařské koruně skutečnou moc?#!"
 bookmark_carolingians_king_louis_alt_ermengarde: "$Ermengarde$"
 bookmark_carolingians_king_louis_alt_engelberga: "$Engelberga$"
 bookmark_carolingians_king_karlmann: "Kníže Karloman"
 bookmark_carolingians_king_karlmann_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_carolingians_king_karlmann_desc: "Karloman, nejstarší syn Ludvíka Němce, povstal proti svému otci a donutil jej, aby mu svěřil vládu nad bavorskými zeměmi. Tuto doménu rozšíří ve válkách se Slovany na východě a později bude dokonce zvolen králem Itálie — nešťastná mozková příhoda jej však donutí přenechat bavorský a italský trůn svým mladším bratrům. O pouhých několik let později zemře.\n\n#bold Dokážeš s trochou štěstí odvrátit Karlomanův neblahý osud a vybudovat odkaz, který přetrvá věky?#!"
 bookmark_carolingians_king_karlmann_alt_arnulf: "$Arnulf$"
 bookmark_carolingians_king_karlmann_alt_hemma: "$Hemma$"
