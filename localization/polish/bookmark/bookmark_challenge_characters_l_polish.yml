l_polish:
 challenge_character_haraldr_vestfold: "Náčelník Harald"
 challenge_character_haraldr_vestfold_desc: "Harald, hrdina opěvovaný v ságách, je připomínán jako velký král, který sjednotil znesvářené náčelníky Norska pod jediným praporem.\n\n#bold Dokážeš ukončit sváry a sjednotit Norsko pod svou vládou?#!"
 challenge_character_ashot_armenia: "Kníže Ašot"
 challenge_character_ashot_armenia_desc: "Ačkoli jeho vláda přinesla lidu blahobyt, Ašot vděčil za svůj trůn i království milosti chalífy a až do smrti mu zůstal podřízen.\n\n#bold Dokážeš se vymanit z područí cizího svrchovaného pána a prokázat, že jsi plně nezávislým panovníkem?#!"
 challenge_character_aella_northumberland: "Místní král Ælla"
 challenge_character_aella_northumberland_desc: "Ællovy země obléhali cizí nájezdníci a jeho smrt z jejich rukou znamenala konec skutečného odporu, neboť jeho nástupce nebyl ničím víc než severskou loutkou.\n\n#bold Dokážeš zvrátit vývoj událostí a zachránit Northumbrii před vikinskou pohromou?#!"
 challenge_character_gregorios_napoli: "Hrabě Grégorios"
 challenge_character_gregorios_napoli_desc: "Jak byzantský vliv v Itálii slábl, neapolští vládci začali kvůli rozpínavosti Langobardů hledat spojence v muslimském světě, což papeže značně znepokojovalo.\n\n#bold Dokážeš využít prázdnoty, kterou po sobě Byzantinci zanechali, a založit vlastní říši?#!"
 challenge_character_dawit_dembiya: "Ras Dawit"
 challenge_character_dawit_dembiya_desc: "Příslušníků Beta Israel nikdy nebylo mnoho a často čelili nebezpečí, přesto se úspěšně bránili asimilaci svými početnějšími a mocnějšími sousedy.\n\n#bold Dokážeš navzdory všem překážkám vybudovat příslušníkům Beta Israel prosperující a bezpečnou vlast?#!"
 challenge_character_werner_worms: "Hrabě Werner"
 challenge_character_werner_worms_desc: "Ačkoli za Wernerova života ještě nebylo jméno Sálců proslulé, mezi jeho potomky se později zařadili čtyři císaři Svaté říše římské, a dokonce i jeden papež.\n\n#bold Dokážeš si přivlastnit odkaz Karla Velikého a znovu ukovat jeho roztříštěnou říši?#!"
 challenge_character_siemowit_wielkopolska: "Velkonáčelník Siemovít"
 challenge_character_siemowit_wielkopolska_desc: "Siemovít, syn legendárního koláře Piasta, společně se svým otcem založil dynastii, která vládla Polsku až do konce čtrnáctého století.\n\n#bold Dokážeš bezpečně provést Polsko staletími a učinit z něj zemi, kterou mu bude závidět východ i západ?#!"
 challenge_character_ahmad_egypt: "Sultán Ahmad"
 challenge_character_ahmad_egypt_desc: "Ahmad se ze skromných poměrů povznesl až k vládě nad Egyptem, jeho dědicové se mu však nedokázali vyrovnat a jeho panství se zhroutilo pouhých jednadvacet let po jeho smrti.\n\n#bold Dokážeš s bohatstvím a mocí Egypta pod svým velením učinit ze sebe pána Středomoří?#!"
 challenge_character_dyre_kiev: "Jarl Dir"
 challenge_character_dyre_kiev_desc: "Dir byl severský dobrodruh, který toužil proslavit své jméno na východě, jeho smělý podnik však skončil potupným sesazením a smrtí z rukou Olega Moudrého.\n\n#bold Dokážeš přepsat Dirův truchlivý příběh v ságu, která bude znít po celé věky?#!"
 challenge_character_dumnarth_cornwall: "Místní král Dumnarth"
 challenge_character_dumnarth_cornwall_desc: "Dumnarthovi připadla pochybná čest být připomínán především jako poslední cornwallský král, který nešťastnou náhodou utonul v řece.\n\n#bold Dokáže se Cornwall pod tvou vládou postavit Anglosasům i Seveřanům a zvítězit?#!"
 challenge_character_rhodri_gwynedd: "Kníže Rhodri"
 challenge_character_rhodri_gwynedd_desc: "Rhodri zdědil trůn malého velšského království v předvečer vikinských vpádů. Koruna na jeho hlavě spočívala nejistě, on však dokázal obratně využít karty, které mu osud rozdal.\n\n#bold Dokážeš bezpečně proplout rozbouřenými vodami této neklidné doby a zajistit, aby Gwynedd vyšel vítězně?#!"
 challenge_character_gunda_orangallu: "Samanta Gunda"
 challenge_character_gunda_orangallu_desc: "Teprve když Kákátijové přestoupili od džinismu k hinduismu, dokázali získat dostatek zemí, aby se mohli nazývat králi, což jim možná usnadnilo opuštění přísné džinistické zásady nenásilí.\n\n#bold Dokážeš získat vlastní trůn a přitom zůstat věrný zásadám své víry?#!"
 challenge_character_muhammad_africa: "Sultán Muhammad"
 challenge_character_muhammad_africa_desc: "Ačkoli je Muhammadova krátká vláda připomínána především kvůli jeho prostopášnosti a rozmařilosti, jeho vojevůdci byli natolik úspěšní, že přinutili samotného papeže platit tomuto zhýralému mocnáři tribut.\n\n#bold Když jsi okusil bohatství Itálie, pozřeš ji celou, abys ukojil své touhy?#!"
 challenge_character_alfonsu_asturias: "Král Alfons"
 challenge_character_alfonsu_asturias_desc: "Na sklonku života se Alfons stal obětí ctižádosti svých synů, kteří jej zbavili koruny a přinutili rozdělit panství mezi tři z nich.\n\n#bold Dokážeš odvrátit Alfonsův osud a zajistit, aby iberští křesťané zůstali sjednocenou hrází proti umajjovské hrozbě?#!"
 challenge_character_vicayalaya_chola_nadu: "Rádža Vidžajálaja"
 challenge_character_vicayalaya_chola_nadu_desc: "Vidžajálaja byl původně vazalem dynastie Pallavů, rozpoznal však příležitost, osamostatnil se a založil říši, která později sjednotila celou jižní Indii pod svými praporci.\n\n#bold Dokážeš dovést ambice Čólů k jejich přirozenému završení a sjednotit pod svou vládou celou Indii?#!"
 challenge_character_lambert_spoleto: "Vévoda Lambert"
 challenge_character_lambert_spoleto_desc: "Lambert byl pozván na papežovo svěcení, místo toho však město nechvalně proslulým způsobem vyplenil. Drancoval sídla i kláštery stejnou měrou a před jeho hrabivostí nebyl nikdo ušetřen.\n\n#bold Když nectíš lidské ani Boží zákony, jak daleko zajdeš při naplňování svých ambicí?#!"
 challenge_character_amoghavarsha_karnata: "Mahárádža Amóghavarša"
 challenge_character_amoghavarsha_karnata_desc: "Amóghavarša usedl na trůn v útlém věku čtrnácti let, vládl déle než téměř kterýkoli jiný zaznamenaný panovník a proslul svou laskavostí i literárními a kulturními počiny.\n\n#bold Dokážeš zajistit, aby byly Amóghavaršovy úspěchy zachovány pro budoucí pokolení?#!"
 challenge_character_gudrod_western_isles: "Místní král Gudröd"
 challenge_character_gudrod_western_isles_desc: "Gudröd, smělý hebridský vojevůdce žoldnéřského původu, rozšířil svou moc a stal se pánem Dublinu, Manu a Irského moře, avšak rozbroje mezi jeho potomky značně zastínily jeho úspěchy.\n\n#bold Dokážeš nad těmito krásnými ostrovy nastolit trvalejší vládu?#!"
 challenge_character_richard_capua: "Vévoda Richard"
 challenge_character_richard_capua_desc: "Ačkoli si rod Hautevillů možná vydobyl svrchovanost nad Sicílií, Drengotové tam byli nepopiratelně dříve, neboť patřili mezi vůbec první normanské dobrodruhy, kteří vstoupili na Apeninský poloostrov.\n\n#bold Dokážeš usadit nově příchozí povýšence z rodu Hautevillů na jejich místo a prokázat prvenství Drengotů?#!"
 challenge_character_fariburz_shirvan: "Širvanšáh Fariburz"
 challenge_character_fariburz_shirvan_desc: "Širvanšáhové jsou připomínáni jako mecenáši a dobrodinci básníků a filozofů, neboť za jejich vlády často vzkvétalo umění i duchovní život.\n\n#bold Dokážeš ze svého dvora učinit zářivý maják kultury, jejž bude obdivovat celý svět?#!"
 challenge_character_shisnand_coimbra: "Hrabě Sisnando"
 challenge_character_shisnand_coimbra_desc: "Mozarabský aristokrat Sisnando přešel ze služeb Abbádovců do služeb Leónu, vládl Coimbře téměř samostatně déle než dvacet let a po jeho smrti jej vystřídal jeho zeť.\n\n#bold Sloužil jsi muslimským i křesťanským lenním pánům. Dokážeš vybudovat most mezi vírami a přinést Ibérii mír?#!"
 challenge_character_alusian_vidin: "Hrabě Alusian"
 challenge_character_alusian_vidin_desc: "Druhý syn posledního bulharského cara byl svými novými byzantskými pány zahrnut poctami, přesto však neopomenul příležitost obnovit otcovu říši, třebaže se nakonec opět podrobil.\n\n#bold Dokážeš svrhnout byzantské jho a získat zpět své rodné právo?#!"
 challenge_character_rostislav_tmutarakan: "Hrabě Rostislav"
 challenge_character_rostislav_tmutarakan_desc: "Rostislav přišel kvůli předčasné smrti svého otce o otcovské dědictví, dobyl však vzdálený poloostrov Tmutarakaň a učinil z něj svou pevnost. Než mohl naplnit své ambice, byl však otráven.\n\n#bold Dokážeš překonat nepřátelství svých příbuzných a získat knížectví hodné svého původu?#!"
 challenge_character_werner_aargau: "Hrabě Werner"
 challenge_character_werner_aargau_desc: "Ačkoli za Wernerových časů Habsburkové ještě nezanechali v dějinách výraznou stopu, obratná politika vynese jeho potomky v následujících staletích na nejeden trůn.\n\n#bold Dokážeš pro Habsburky získat Rakousy a přimět celý svět, aby uznal jejich vzestup?#!"
 challenge_character_herbert_vermandois: "Hrabě Herbert"
 challenge_character_herbert_vermandois_desc: "Ačkoli potomci Karla Velikého již nebyli králi, jejich krev dále kolovala v žilách Herberta z Vermandois. Již za následující generace však jeho země přejdou z rukou rodiny.\n\n#bold Dokážeš vrátit čas a všemi dostupnými prostředky zajistit Karlovcům návrat k moci?#!"
 challenge_character_erik_svealand: "Kníže Erik"
 challenge_character_erik_svealand_desc: "Erik byl pohanský vládce, který se zřekl křesťanství a navrátil se ke svým kořenům. Ve stále více christianizované Skandinávii patřil k posledním představitelům vymírajícího způsobu života.\n\n#bold Dokážeš všem prokázat, že staré tradice jsou nadřazené těmto cizáckým kněžourům a jejich novému bohu?#!"
 challenge_character_krutoj_nordmark: "Vévoda Kruto"
 challenge_character_krutoj_nordmark_desc: "Kruto, oddaný stoupenec tradičních zvyků svého lidu, vedl povstání, zavraždil svého křesťanského lenního pána a zmocnil se jeho trůnu. Jeho intrika, jejímž cílem bylo zbavit se syna lenního pána, však skončila jeho vlastní smrtí.\n\n#bold Dokážeš překonat své soupeře a legitimizovat svou vládu navzdory jejím krvavým počátkům?#!"
 challenge_character_ishaq_baalbek: "Šejk Ishák"
 challenge_character_ishaq_baalbek_desc: "Navzdory svému nízkému počtu a pronásledování těmi, kteří jejich přesvědčení považovali za kacířské, Drúzové přečkali celá staletí díky útočišti v drsných horách Levanty.\n\n#bold Dokážeš vyvést Drúzy z hor a nalézt jim vlastní pokojnou domovinu?#!"
 challenge_character_badr_acre: "Šejk Badr"
 challenge_character_badr_acre_desc: "Badr, fátimovský voják arménského původu, postupoval vojenskými hodnostmi, až se stal nejvyšším vojenským diktátorem chalífátu a samotného chalífu odsunul do role pouhé loutky.\n\n#bold Badr a jeho nástupci ovládali egyptskou politiku déle než šedesát let – dokážeš jejich činy překonat a chalífy se zbavit úplně?#!"
 challenge_character_berenguer_barcelona: "Vévoda Berenguer"
 challenge_character_berenguer_barcelona_desc: "Ve snaze zajistit spravedlnost nechal Berenguer kodifikovat zvyklosti svého panství do sbírky Usatges de Barcelona, která se na celá staletí stala základem katalánského práva.\n\n#bold Berenguerovi potomci časem ovládnou značnou část Středomoří. Dokážeš navázat na jeho úspěchy a dosáhnout téhož?#!"
 challenge_character_raoul_valois: "Hrabě Raoul"
 challenge_character_raoul_valois_desc: "Ačkoli byl Raoul v mládí odpůrcem Kapetovců, později převlékl kabát a stal se věrným služebníkem francouzské koruny. Nakonec se dokonce oženil s vdovou po králi, proti němuž kdysi bojoval.\n\n#bold Když je matka tvého mladého lenního pána tvou manželkou, dokážeš svůj vliv přetavit v něco většího?#!"
 challenge_character_ali_siracusa: "Šejk Alí"
 challenge_character_ali_siracusa_desc: "Alí patřil k posledním obráncům proti normanské invazi na Sicílii. Když se pokoušel přeskočit na loď svého nepřítele, zřítil se do moře a utonul.\n\n#bold Normané již dorazili, ale jejich vítězství ještě není úplné – dokážeš zvrátit jejich postup a získat Sicílii pro sebe?#!"
 challenge_character_eadgar_warwickshire: "Edgar Ætheling"
 challenge_character_eadgar_warwickshire_desc: "Poslední mužský potomek rodu Wessexů se narodil ve vyhnanství a do Anglie se vrátil právě včas, aby spatřil, jak mu Harold Godwinson podruhé uzurpuje rodné právo a normanský dobyvatel mu je poté nenávratně odejme.\n\n#bold Světlo rodu Wessexů již jen slabě poblikává, dosud však nevyhaslo. Dokážeš obnovit jeho zašlou slávu?#!"
 challenge_character_ali_taizz: "Emír Alí"
 challenge_character_ali_taizz_desc: "Alí, syn soudce, vyrazil na cestu se skromnou družinou stoupenců a získal království, ještě většího uznání se mu však dostalo za moudrost jeho manželky Asmy, které svěřil správu svého státu.\n\n#bold S tak schopnou partnerkou po svém boku se zdá být možné cokoli. Společně můžete získat celou Arábii!#!"
 challenge_character_pierre_piedmonte: "Vévoda Petr"
 challenge_character_pierre_piedmonte_desc: "Rod Savojských vděčil za značnou část svého území dědictví Petrovy matky Adléty Turínské, jejíž vliv měl u synova dvora rozhodující význam, téměř jistě k jeho prospěchu.\n\n#bold Dokážeš vystoupit ze stínu své slavné matky a prokázat, že jsi sám o sobě schopným vládcem?#!"
 challenge_character_anawrahta_pagan: "Král Anawrahta"
 challenge_character_anawrahta_pagan_desc: "Anawrahta, zakladatel Paganu, vládl prozíravě a nemilosrdně potlačoval každou hrozbu pro své nové panství. Jeho podpora théravádového buddhismu navíc výrazně přispěla k šíření této víry.\n\n#bold Anawrahtovi nástupci byli stejně schopní jako jejich předek, Mongolové však byli pro Pagan příliš mocným nepřítelem – dokážeš lépe přečkat nadcházející bouři?#!"
 challenge_character_piarres_albarracin: "Hrabě Piarres"
 challenge_character_piarres_albarracin_desc: "Kdysi vazal muslimského mocnáře Piarres obrátil své panství ke křesťanství a prohlásil svou nezávislost, přičemž za svého lenního pána uznával pouze samotnou svatou Marii.\n\n#bold Když ses prohlásil rovným králům a chalífům, dokážeš nyní svůj nárok naplnit a pozvednout nové království, které se vyrovná všem předchozím?#!"
 challenge_character_john_ulster: "Earl John"
 challenge_character_john_ulster_desc: "Pouze díky meči po svém boku a pomoci několika věrných mužů se John de Courcy stal pánem východního Ulsteru, než jeho vzestup ukončil anglický král, který se obával jeho ambicí, a uvrhl jej do vězení.\n\n#bold Dokážeš dokončit to, co John započal, a zajistit, aby prapor Courcyů zavlál nad celým Irskem?#!"
 challenge_character_rogier_albi: "Hrabě Rogier"
 challenge_character_rogier_albi_desc: "Ačkoli sami možná otevřeně nepřijali jejich učení, Trencavelové byli známí svou kontroverzní tolerancí a sympatiemi ke kacířským katarům, kteří se šířili jejich zeměmi.\n\n#bold Dokážeš katary ochránit před pronásledováním a zajistit, aby jejich víra vzkvétala?#!"
 challenge_character_khusraw_malik_punjab: "Sultán Chusrau Malik"
 challenge_character_khusraw_malik_punjab_desc: "Obklíčen nepřáteli ze všech stran, Chusrau Malik statečně bojoval za zachování království svých předků, avšak jeho rodová linie brzy skončila rukou ghúridského popravčího.\n\n#bold Dokážeš se znovu probojovat k moci a zopakovat výboje Mahmúda z Ghazny?#!"
 challenge_character_kulin_bosna: "Dux Kulin"
 challenge_character_kulin_bosna_desc: "Kulin, sevřený mezi byzantskými a uherskými ambicemi na Balkáně, obratně využil konfliktu mezi oběma velmocemi, aby zachoval svou autonomii a rozšířil svůj vliv.\n\n#bold Dokážeš se vymanit z područí svého lenního pána a přivést Bosnu ke zlatému věku míru a prosperity?#!"
 challenge_character_nur_al_din_muhammed_nizari: "Imám Muhammad"
 challenge_character_nur_al_din_muhammed_nizari_desc: "Z mocných pevností v perských horách vládl Muhammad dlouhá léta jako dědičný imám nizárijců, kteří jej díky jeho původu od Nizára uznávali za jediného právoplatného strážce své víry.\n\n#bold Dokážeš šířit své učení a dosáhnout toho, aby byla tvá víra široce přijímána?#!"
 challenge_character_algimantas_lithuanians: "Velkonáčelník Algimantas"
 challenge_character_algimantas_lithuanians_desc: "Algimantasovi a jeho dědicům se podařilo udržet pohanské knížectví déle než kterémukoli jinému národu v Evropě a úspěšně odolávali přijetí křesťanství až do konce čtrnáctého století.\n\n#bold Když se křesťané tolik snaží obrátit tvůj lid, dokážeš naopak otevřít jejich oči pravdě vidilismu?#!"
 challenge_character_sargis_greater_armenia: "Vévoda Sargis"
 challenge_character_sargis_greater_armenia_desc: "Sargis byl mocným arménským vazalem gruzínského krále. Jeho věrnost mohla být občas pochybná, avšak jeho vliv a moc byly tak velké, že jej nebylo možné přehlížet.\n\n#bold Dokážeš se osamostatnit a obnovit Velkou Arménii svých dávných předků?#!"
 challenge_character_aba_socotra: "Emír Aba"
 challenge_character_aba_socotra_desc: "Izolace Sokotry umožnila, aby po celá staletí zůstala ostrovem nestoriánství, přičemž její obyvatelé jen zřídka nacházeli přijetí mimo své skalnaté břehy.\n\n#bold Dokážeš vést svůj lid z tohoto nejistého útočiště a získat nesmrtelnou slávu za obzorem?#!"
 challenge_character_prithviraja_rajputana: "Mahárádža Prithvirádža"
 challenge_character_prithviraja_rajputana_desc: "Prithvirádža statečně vzdoroval opakovaným ghúridským vpádům a alespoň v jedné velké bitvě vetřelce porazil, nakonec však skončil jako zajatec Ghúridů.\n\n#bold Dokážeš odrazit ghúridskou hrozbu a zajistit budoucnost dynastie Čauhánů?#!"
 challenge_character_renaud_kerak: "Hrabě Renaud"
 challenge_character_renaud_kerak_desc: "Nejzuřivější a nejnebezpečnější protivník Saláh ad-Dína v Jeruzalémském království, Renaudův útok na muslimskou poutní karavanu vedl ke ztrátě Jeruzaléma a k jeho vlastní popravě rukou egyptského sultána.\n\n#bold Dějiny si Renauda zapamatovaly jako bezohledného plenitele – dokážeš mu zajistit ušlechtilejší odkaz?#!"
 challenge_character_henri_champagne: "Vévoda Jindřich"
 challenge_character_henri_champagne_desc: "Jindřich, vzdělaný ve svobodných uměních, svou osvícenou vládou přinesl svému lidu velký blahobyt. Proslulé šampaňské trhy přitahovaly kupce a jejich cenné zboží z celé Evropy.\n\n#bold Dokážeš učinit ze Šampaňska synonymum míru a prosperity?#!"
 challenge_character_richard_poitiers: "Princ Richard"
 challenge_character_richard_poitiers_desc: "Richard se narodil jako třetí syn, avšak rozmary osudu jej posadily na anglický trůn a jeho pozdější tažení ve Svaté zemi mu získala věčnou slávu jako #italic Richardu Lví srdce#!.\n\n#bold Navzdory své slávě přinesly Richardovy bitvy jen málo trvalých zisků. Dokážeš využít jeho druhou šanci a získat vítězství hodné jeho jména?#!"
 challenge_character_maghan_sibi: "Maghan Kon Fatta"
 challenge_character_maghan_sibi_desc: "Legendy praví, že lovec kdysi předpověděl, že pokud se Maghan ožení s ošklivou ženou, jejich syn bude velkým a mocným králem. Ať už je pravda jakákoli, Maghanův syn Sundžata skutečně založil říši Mali.\n\n#bold Dokážeš naplnit proroctví prostého lovce a založit novou říši?#!"
 challenge_character_mohammed_azerbaijan: "Džahán Pahlaván Muhammad"
 challenge_character_mohammed_azerbaijan_desc: "Muhammad, tvůrce králů posledních seldžuckých sultánů, ve skutečnosti vládl říši, ačkoli jeho potomci nedokázali odolat náporu Chórezmských šáhů.\n\n#bold Samotného sultána držíš ve své pěsti – využij jej dobře a celá Persie se skloní před tvou vůlí!#!"
 challenge_character_heinrich_angria: "Jindřich Lev"
 challenge_character_heinrich_angria_desc: "Jindřich, hořký soupeř císaře Svaté říše římské, byl ve své době nejmocnějším velmožem říše, avšak jeho nepřátelství s císařem se mu nakonec stalo osudným.\n\n#bold Dokážeš uspět tam, kde historický Jindřich selhal, a zvítězit nad svým hohenštaufským nepřítelem?#!"
