l_polish:
 bm_1066_china: "Píseň vznešenosti"
 bm_1066_china_desc: "Z trosek Tangů povstala sláva Sungů. Taková velikost nebyla spatřena téměř dvě staletí — tribut proudí do císařského hlavního sídla z dalekých zemí jako mohutná řeka, povstání jsou vzácná a rychle potlačována a vláda pevně spočívá v rukou schopných a zasloužilých.\n\nS velkým blahobytem však přichází i velká pokušení. Kočovníci od nepaměti prahnou po bohatství centrálních nížin, zatímco i uvnitř říše si bezohlední často zahalují své skutečné záměry předstíranou urozeností, aby odvedli její bohatství do vlastních kapes.\n\n#bold Syn nebes drží svět ve své dlani, ale co ti, kteří mohou přimět i Syna nebes, aby jednal podle jejich vůle?#!"
 bookmark_china_1066_qin_guan: "Čchin Kuan"
 bookmark_china_1066_qin_guan_subheading: "$BOOKMARK_SUBHEADING_LANDLESS_ADMIN$"
 bookmark_china_1066_qin_guan_desc: "Po smrti svého otce upadl jeho rod do chudoby, avšak těžkosti nijak neotupily ambice mladého Čchina Kuana; v jeho skromných poměrech naopak hoří ještě jasněji.\n\nS každou knihou, kterou si dokáže vypůjčit, se ponořuje do poezie a vojenské strategie a sní o dni, kdy se vyrovná činům zvěčněným na těchto stránkách.\n\n#bold Jedna věc je snít o dosažení velikosti a zcela jiná je proměnit sny ve skutečnost. K jakému osudu jej povede tvá ruka?#!"
 bookmark_china_1066_duan_silian: "Král S'-li-an z rodu Tuan"
 bookmark_china_1066_duan_silian_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_china_1066_duan_silian_desc: "Jako vzdálený potomek zakladatele Ta-li by jen málokdo při jeho narození předpokládal, že jednoho dne usedne na trůn právě Tuan S'-li-an, avšak osud je vrtkavý a nepředvídatelný.\n\nPřirozený řád věcí obrátil mocný rod Kao, který měl vliv hned po císařském rodu. Sesadil tehdejšího zhýralého císaře a dosadil na jeho místo právě S'-li-ana.\n\n#bold Dokáže S'-li-an uniknout sevření rodu Kao a vládnout z vlastního práva, nebo podlehne jejich ambicím?#!"
 bookmark_china_1066_ly_thanh_tong: "Vương Nhật Tôn"
 bookmark_china_1066_ly_thanh_tong_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_china_1066_ly_thanh_tong_desc: "Jako vládce Vietnamu vyzařuje Lý Nhật Tôn neotřesitelnou sebejistotu, kterou mají pouze ti, kdo byli od narození vychováváni k vládnutí. Jeho lid jej zná jako válečníka osvědčeného v bitvách, laskavého správce a pilného vykonavatele spravedlnosti, jehož slovo je zákonem.\n\nDokonce i jediný stín, který se vznášel nad jeho slavnou vládou — nepřítomnost dědice — byl nedávno rozptýlen narozením jeho prvního syna Càn Đức.\n\n#bold Dokáže Vương Nhật Tôn povýšit Vietnam na říši, která se vyrovná jeho severnímu sousedovi, nebo se trvalé úspěchy ukážou jako pomíjivé?#!"
 bookmark_china_1066_new_noble_family: "Vlastní postava"
 bookmark_china_1066_new_noble_family_desc: "Vytvoř novou postavu a [Concept('noble_family','urozený rod')|E] s malým statkem v císařském hlavním sídle.\n\n#bold Dokážeš začít na dně byrokratického žebříčku a vybudovat jméno sobě i své vznikající rodině?#!"
 bookmark_china_1066_empress_liang: "$king_female$ $dynn_Liang_6881$ $Luoyao_843D_7464$"
 bookmark_china_1066_empress_liang_subheading: "Císařovna choť $k_xia$"
 bookmark_china_1066_empress_liang_desc: "Kdysi pouze snacha mocného státníka státu Xia, $dynn_Mozang_6C92_85CF$ $Epang_8BB9_5E9E$, ukázaly se skryté ambice $dynn_Liang_6881$ $Luoyao_843D_7464$ ještě větší než ambice rodu jejího neschopného manžela.\n\nMladý tangutský vládce $king_male_tangut$ $Liangcha_5169_5C94$ byl zcela okouzlen její krásou a důvtipem. Nechal vyvraždit rod $dynn_Mozang_6C92_85CF$, včetně své vlastní manželky, a posadil ji po svém boku jako královnu.\n\n#bold Stát Xia je stále mladý a křehký — vezmeš jeho budoucnost do vlastních rukou?#!"
 bookmark_china_1066_su_shi: "Prefekt Su Š'
 bookmark_china_1066_su_shi_subheading: "$BOOKMARK_SUBHEADING_GOVERNOR$"
 bookmark_china_1066_su_shi_desc: "Ačkoli otec Su Š'ho neuspěl u císařských zkoušek, získal ve svém pátém desetiletí slávu díky svým spisům. Tuto pověst ještě posílil vynikajícím a oslavovaným výkonem Su Š'ho při vlastních zkouškách.\n\nPoté, co si získal pozornost a přízeň nejvýznamnějšího historika říše i samotného císaře, je jediným stínem nad očekávanou skvělou budoucností nedávná smrt jeho otce.\n\n#bold Dokáže Su Š' dostát vysokým očekáváním, která jsou do něj vkládána?#!"
 bookmark.0400.t: "Moc za oponou"
 bookmark.0400.desc: "Jediný šíp stačí k tomu, aby se roky plánování rozpadly v prach. Můj [emperor.GetWifeHusband] [emperor.GetFirstName] leží zraněn a každým dnem slábne, neboť jej skolil lučištník Sungů poté, co se pošetile příliš přiblížil k boji.\n\nPo všem, čím jsem prošla, #EMP nedovolím#!, aby mi to všechno proklouzlo mezi prsty. Ženy již vládly dříve; pokud ne skrze své manžely, pak skrze své syny, a [Glossary('císařovna Wu', 'EMPRESS_WU_GLOSS')] dokonce založila vlastní #EMP dynastii#!.\n\nS vlivem, který jsem získala, a neochvějnou podporou svého [brother.Custom('SisterBrother')] [brother.GetTitledFirstName] je budoucnost [xia.GetNameNoTierNoTooltip] #EMP má#! a já o ní rozhodnu."
 bookmark.0400.a: "Jeho vláda bude zapamatována... jako předzvěst #EMP mé#! vlády."
 bookmark.0400.a.tt: "[emperor.GetTitledFirstName] will #EMP tragically#! pass away from [emperor.GetHerHis] injuries and you shall assume sole control of the [realm|E] with your [brother.Custom('SisterBrother')] [brother.GetTitledFirstName] as your [emperor.GetCouncillor('councillor_chancellor').GetCouncilTitle]" # TODO: MISSING KEY
 bookmark.0400.b: "Dokud [emperor.GetSheHe] dýchá, budu vládnout ze stínu."
 bookmark.0400.b.tt: "Given [emperor.GetHerHis] weakened state and diminished capacity, you shall assume the role of [regent|E] for [emperor.GetTitledFirstName] with [brother.GetTitledFirstName] as [emperor.GetHerHis] [emperor.GetCouncillor('councillor_chancellor').GetCouncilTitle]." # TODO: MISSING KEY
 bookmark.0400.c: "Vychovám naše [child.Custom('GetDaughterSon')] tak, aby byl větší než jeho [child.GetHerHis] [emperor.GetMotherFather]."
 bookmark.0400.c.tt: "[emperor.GetTitledFirstName] will #EMP tragically#! pass away from [emperor.GetHerHis] injuries and you shall assume the role of [regent|E] for your [child.Custom('GetDaughterSon')] [child.GetTitledFirstName] with your [brother.Custom('SisterBrother')] [brother.GetTitledFirstName] as [child.GetHerHis] [emperor.GetCouncillor('councillor_chancellor').GetCouncilTitle]." # TODO: MISSING KEY
 EMPRESS_WU_GLOSS: "Wu Ce-tchien (624–705) se odchýlila od tradice, po smrti svého manžela sesadila vlastní syny a sama se prohlásila zakladatelkou nové dynastie Čao."
 bookmark.0500.t: "Úpadek spravedlnosti"
 bookmark.0500.desc: "Znovu #EMP selhání#!. Kolikrát se ještě musím pokořit u těchto ubohých zkoušek a recitovat prázdné verše pod pohledy posměšných zkoušejících? Kdo jsou #EMP oni#!, aby posuzovali #EMP mou#! hodnotu? Kážou o ctnosti, ale já vidím, jací doopravdy jsou — prasata cpoucí se u koryta zvaného byrokracie.\n\nJejich rozmazlení potomci vstupují ke zkouškám a znají odpovědi ještě dříve, než jsou napsány, hýčkáni učiteli placenými mincemi vydělanými z těch, kteří jsou tak chudí, že sotva udrží střechu nad hlavou.\n\n[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier] bylo opuštěno Nebesy; když člověk ví, co je správné, zůstat nečinný je zbabělost. Nuže tedy. Ať bohové přihlížejí a mocní se třesou, #EMP neboť nyní jsem tím, kdo soudí#!."
 bookmark.0500.a: "Nejbezpečnější cesta ke změně vede zevnitř."
 bookmark.0500.b: "Můj čas nadešel; věk [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] je #EMP u konce#!!"
 bookmark.0500.c: "Odvážné čekají bohaté příležitosti."
 bookmark.0500.d: "Lid touží po zachránci a tím zachráncem jsem #EMP já#!."
 faithful_followers: "Věrní následovníci"
