l_polish:
 bm_1178_china: "Nebesa v neklidu"
 bm_1178_china_desc: "Čína leží rozvrácená. Syn nebes byl vytlačen z centrálních nížin džürčenskými nájezdníky a přední osobnosti říše zvolily politiku naprostého usmiřování namísto znovuzískání země svých předků.\n\nTygři a vlci řádí bez zábran a řeky rudnou krví spravedlivých. Aby tak zhoubný osud mohl postihnout říši, musí být nemilost Nebes nesmírná.\n\n#bold Lid volá po hrdinovi, který ukončí tento zmatek — kdo vyslyší jeho volání?#!"

 bookmark_china_1178_xin_qiji: "Správce Sin Čchi-ťi"
 bookmark_china_1178_xin_qiji_subheading: "$BOOKMARK_SUBHEADING_GOVERNOR$"
 bookmark_china_1178_xin_qiji_desc: "Sin Čchi-ťi osiřel v útlém věku a vychoval jej jeho děd, který v něm probudil horoucí touhu vyhnat džürčenské vetřelce z centrálních nížin.\n\nSin Čchi-ťi získal slávu poté, co pomstil vraždu svého velitele, avšak tím jeho úspěchy končí — jeho sen o zastavení džürčenského náporu byl znovu a znovu mařen sungskou politikou usmiřování.\n\n#bold Dokáže Sin Čchi-ťi znovu získat sever, nebo nasměruje svou energii k jiným cílům?#!"

 bookmark_china_1178_zhang_shi: "Guvernér Čang Š'
 bookmark_china_1178_zhang_shi_subheading: "$BOOKMARK_SUBHEADING_MILITARY_GOVERNOR$"
 bookmark_china_1178_zhang_shi_desc: "Čang Š', syn válečného hrdiny, je stejně vynikajícím učencem a filozofem, jako byl jeho otec vojevůdcem.\n\nAčkoli je uznáván pro své spisy, jeho politická budoucnost je nejistá kvůli jeho horlivému prosazování znovudobytí severních území od dynastie Ťin, což je záměr hluboce nepopulární mezi těmi, kteří dávají přednost míru před válkou.\n\n#bold Bude Čang Š' tím, kdo pohne světem, nebo se stejně jako mnozí jiní pouze přizpůsobí jeho pohybu?#!"

 bookmark_china_1178_zhu_xi: "Prefekt Ču Si"
 bookmark_china_1178_zhu_xi_subheading: "$BOOKMARK_SUBHEADING_GOVERNOR$"
 bookmark_china_1178_zhu_xi_desc: "Ču Si, proslulý jako mladý génius, dokázal, že jeho úspěchy nejsou jen pomíjivou slávou. Odvrhl taoismus i buddhismus a zasvětil se studiu konfuciánské filozofie; nyní se jeho spisy široce šíří a nadaní učenci soupeří o výsadu navštěvovat jeho přednášky.\n\n#bold Jeho písemná díla a filozofické úvahy jsou široce obdivovány, avšak možná by mu honba za mocí lépe umožnila uskutečnit jeho ideální společnost?#!"

 bookmark_china_1178_li_renxiao: "Ningling Ngwemi Renxiao"
 bookmark_china_1178_li_renxiao_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_china_1178_li_renxiao_desc: "Po téměř čtyřech desetiletích na trůně jeho lid prohlašuje, že jeho vláda je největší a nejblahobytnější érou, jakou tangutské království kdy poznalo. Ačkoli přítomnost je slavná, budoucnost přináší více nejistoty.\n\nNeuplynulo ani deset let od chvíle, kdy Renxiao nechal po neúspěšném převratu popravit vlastního prvního ministra a vojevůdce, a vztahy mezi králem a vojskem již nikdy nebyly stejné.\n\n#bold Dokážeš ochránit Velkou Xia před útoky jejích sousedů?#!"

 bookmark_china_1178_tudan_xixian: "Velitel Tudan Si-sien"
 bookmark_china_1178_tudan_xixian_subheading: "$BOOKMARK_SUBHEADING_GOVERNOR$"
 bookmark_china_1178_tudan_xixian_desc: "Potomek jednoho z nejušlechtilejších džürčenských rodů a manžel princezny z císařského rodu Ťin, Si-sien má stejně bezúhonný původ jako své mistrovství v lukostřelbě a jízdě na koni.\n\nMlčenlivý, mravně zásadový a zkušený ve válečnictví, jeho pověst je taková, že se říká, že se vyrovná armádě deseti tisíc mužů.\n\n#bold Dynastie Ťin ovládla centrální nížiny, jih však stále zůstává. Kdo jiný by měl dokončit dobytí než největší džürčenský vojevůdce?#!"
