l_polish:
 bm_867_china: "Podzim ctnosti"
 bm_867_china_desc: "Po dvě a půl století vládli Velcí Tangové Číně. Během té doby poznala a přečkala nesmírné sváry a nespočet pohrom, v neposlední řadě povstání, které si vyžádalo nespočet životů, a přesto stále přežívá a dokonce vzkvétá.\n\nPřežití však vždy něco stojí. Aby mohli lépe bránit říši, svěřili Tangové vojenským guvernérům mimořádné pravomoci. Ti ve své nově nabyté svobodě spatřili příležitost založit vlastní státy — malá panství despotů, kteří trůnu prokazovali pouze formální poslušnost.\n\n#bold Pád jediného listu může zvěstovat příchod podzimu. Moudří hledají teplo a útočiště před nadcházející zimou. Odvážní spřádají plány.#!"
 bookmark_china_867_huang_chao: "Chuang Čchao"
 bookmark_china_867_huang_chao_subheading: "$BOOKMARK_SUBHEADING_LANDLESS_ADMIN$"
 bookmark_china_867_huang_chao_desc: "Chuang Čchao se narodil do dlouhé linie pašeráků soli a má smělost i bohatství získané životem na špatné straně zákona, přesto touží po jediné věci, která mu uniká — postavení, jež přináší úřad ve státní správě.\n\nNavzdory veškerému úsilí nedokázal složit císařské zkoušky a s každým dalším rokem roste jeho frustrace, zatímco jeho vyhlídky na úspěch mizí.\n\n#bold Dosáhne Chuang Čchao svého snu, nebo jej zmařená ctižádost přivede k zoufalému risku?#!"
 bookmark_china_867_zhuye_chixin: "Velitel Ču-jie Čch'-sin"
 bookmark_china_867_zhuye_chixin_subheading: "$BOOKMARK_SUBHEADING_MILITARY_GOVERNOR$"
 bookmark_china_867_zhuye_chixin_desc: "Tangové si již dlouho získávali přízeň šatuoských kmenů pro jejich odvahu a válečnické schopnosti a Ču-jie Čch'-sin v tomto ohledu nevybočuje z tradice svých předků.\n\nZa svou úlohu při odvážné záchraně císařovy tety před několika lety byl poctěn a neochvějný vzestup šatuoského vojevůdce v císařově přízni vede některé k otázce, jak vysoko sahají jeho ambice.\n\n#bold Nyní, když hvězda Tangů upadá, bude mít Ču-jie Čch'-sin dost odvahy, aby se jí zmocnil?#!"
 bookmark_china_867_he_quanhao: "Velitel Che Čchüan-chao"
 bookmark_china_867_he_quanhao_subheading: "$BOOKMARK_SUBHEADING_MILITARY_GOVERNOR$"
 bookmark_china_867_he_quanhao_desc: "Rod Che Čchüan-chaa vládl jako nezávislí vojenští velitelé téměř od dob jeho děda a Tangům poskytoval pouze formální podřízenost.\n\nČchüan-chao byl po smrti svého otce armádou uznán jako guvernér, avšak nikoli bez obav — v povaze tohoto mladého muže se skrývá krutost.\n\n#bold Dokáže Che Čchüan-chao překonat svou povahu a pokračovat v díle svých předků, nebo se jeho vlastní pudy stanou jeho zkázou?#!"
 bookmark_china_867_zhang_huaishen: "Ťie-tu-š' Čang Chuaj-šen"
 bookmark_china_867_zhang_huaishen_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_china_867_zhang_huaishen_desc: "Válečník Čang I-čchao dobyl a připojil jménem dynastie Tang rozsáhlá území, za což získal čestné místo u císařského dvora a ustanovil svého synovce Chuaj-šana jejich správcem.\n\nChuaj-šen je však lstivý a schopný velitel s vlastními ambicemi a až přijde čas, nebude ochoten přenechat své postavení bratrancům.\n\n#bold Dokáže Čang Chuaj-šen zvítězit v nadcházejícím boji o následnictví a získat ve své rodině výsadní postavení?#!"
 bookmark_china_867_gao_pian: "Velitel Kao Pien"
 bookmark_china_867_gao_pian_subheading: "$BOOKMARK_SUBHEADING_MILITARY_GOVERNOR$"
 bookmark_china_867_gao_pian_desc: "Kao Pien pochází ze starobylých králů Čchi a je vnukem slavného vojevůdce. Mnozí proto věří, že je předurčen k velkým činům, a jeho schopnost jediným šípem sestřelit dva orly z oblohy zdánlivě potvrdila jeho nadpřirozený talent.\n\nByl vyslán k jižním hranicím, aby bránil říši před cizími vpády, a jeho úspěchy mu získaly nepřátele mezi těmi, kteří v něm vidí hrozbu pro vlastní ambice.\n\n#bold Čeká Kao Piena vznešený osud, nebo se zřítí k zemi stejně jako orli, které skolil?#!"
