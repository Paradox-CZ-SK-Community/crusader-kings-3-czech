l_polish:
 bm_867_christianity: "Otcové věřících"
 bm_867_christianity_desc: "Křesťanstvo stojí na nejisté půdě. Po celé Evropě patriarchové píší o prvenství a biskupové se zarytě přou o pravomoci, zatímco králové a císaři podřizují víru svým chamtivým zájmům.\n\nNa západě se karolinská pýcha střetává s římskými ambicemi. Na východě Konstantinopol neochvějně hájí svá dávná práva. Mezi nimi leží nedávno obrácená panství a pohanské pohraničí, kde se církevní autorita setkává s prosbami i odporem.\n\n#bold Povedeš křesťanství k jednotě a zřekneš se touhy po moci? Nebo staneš v čele velkého církevního schizmatu?#!"
 bookmark_bulgaria_boris: "Král Boris"
 bookmark_bulgaria_boris_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_bulgaria_boris_desc: "Od Borisova křtu v Plisce uplynulo jen několik let. Přijetím křtu připoutal bulharskou elitu ke křesťanské církvi. Mnozí mocní bojaři v čele s následníkem trůnu Vladimírem Rasatem však dosud lpí na starých zvycích a usilují o návrat k modrému nebi tengrismu.\n\nA na jeho prahu stojí horda jezdců připravená udeřit. Válka je na spadnutí.\n\n#bold Dokážeš dostát svatému křtu a přežít bouře, které hrozí rozervat království?#!"
 bookmark_bulgaria_boris_alt_wife: "Marie"
 bookmark_bulgaria_boris_alt_son: "Vladimír Rasate"
 bookmark_moravia_rostislav: "Král Rostislav"
 bookmark_moravia_rostislav_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_moravia_rostislav_desc: "Velká Morava stojí mezi Římem a Konstantinopolí a duchovní lační po moci se přou o autoritu nad jejím dvorem. Rostislav se obává cizí nadvlády a hledá vlastní křesťanskou tradici.\n\n#bold Dokážeš obhájit Rostislavovu vizi a položit trvalé základy slovanského křesťanství? Udržíš Moravu jednotnou proti všem, kdo ji chtějí rozdělit?#!"
 bookmark_moravia_rostislav_alt_svatopluk: "Svatopluk"
 bookmark_hamburg_rimbert: "Kníže-arcibiskup Rimbert"
 bookmark_hamburg_rimbert_subheading: "Hamburský arcibiskup"
 bookmark_hamburg_rimbert_desc: "Spolu s hamburským arcibiskupstvím zdědil Rimbert i poslání „apoštola severu“ a svatý úkol obrátit pohanskou Skandinávii. Ze svého sídla na samém okraji křesťanstva hledí do pohanské Skandinávie, kde dánští a švédští králové stále uctívají modly a kde byla teprve zaseta první semínka křtu.\n\n#bold Dokážeš kráčet ve stopách arcibiskupa Ansgara, přivést seveřany do náruče církve a učinit z Hamburku metropolitní sídlo silného křesťanského severu?#!"
 bookmark_adalwin_salzburg: "Kníže-arcibiskup Adalwin"
 bookmark_adalwin_salzburg_subheading: "Salcburský arcibiskup"
 bookmark_adalwin_salzburg_desc: "Adalwin vládne Salcburku, nesmírně mocnému církevnímu sídlu, jemuž se vyrovnají jen Konstantinopol a Papežský stát. Jeho hlavním nástrojem moci je dokonalá znalost kanonického práva. S její pomocí chce podřídit všechny církevní úřady své kanceláři.\n\n#bold Dokážeš ovládat krále i církev, soustředit moc ve svém sídle a získat nejmocnější stolec celého křesťanstva?#!"
 bookmark_lupus_aquileia: "Kníže-arcibiskup Lupus"
 bookmark_lupus_aquileia_subheading: "Akvilejský patriarchát"
 bookmark_lupus_aquileia_desc: "V knížecím biskupství, které dusí bezohledné ambice světských velmožů, hledá Lupus cestu k moci v obratném výkladu církevního učení a dvorských intrikách.\n\n#bold Dokážeš předčit své soupeře učeností, přelstít sousedy a zajistit v Akvileji trvalé místo mužům církve... i mužům svého rodu?#!"
