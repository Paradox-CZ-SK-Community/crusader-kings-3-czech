l_polish:
 bm_867_christianity: "Otcové věřících" # todo: NEW TRANSLATION
 bm_867_christianity_desc: "Křesťanský svět stojí na nejistých základech. Patriarchové po celé Evropě píší o prvenství, biskupové se hořce přou o autoritu, zatímco králové a císaři ohýbají víru podle svých vlastních chamtivých cílů.\n\nNa západě se střetává karolinská pýcha s římskými ambicemi. Na východě Konstantinopol neochvějně střeží svá starobylá práva. Mezi nimi leží nově obrácené říše a pohanská území, kde je církevní autorita zároveň vyžadována i zatracována.\n\n#bold Povedete křesťanství k jednotě a zřeknete se touhy po moci? Nebo rozpoutáte velké církevní schizma?#!" # todo: NEW TRANSLATION
 bookmark_bulgaria_boris: "Král Boris" # todo: NEW TRANSLATION
 bookmark_bulgaria_boris_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$" # todo: NEW TRANSLATION
 bookmark_bulgaria_boris_desc: "Od Borisova křtu v Plisce uplynulo jen několik let, ale bulharská elita se tím připoutala ke křesťanské církvi. Mnozí mocní bojaři, vedení královským dědicem Vladimirem-Rasatem, se stále drží starých zvyků a usilují o návrat k Modrému nebi tengrismu.\n\nA přímo u jeho prahu čeká horda jezdců připravená zaútočit. Válka je na spadnutí.\n\n#bold Dokážete dostát svému svatému křtu a přežít zmatky, které hrozí roztrhat království?#!" # todo: NEW TRANSLATION
 bookmark_bulgaria_boris_alt_wife: "Marija" # todo: NEW TRANSLATION
 bookmark_bulgaria_boris_alt_son: "Vladimir-Rasate" # todo: NEW TRANSLATION
 bookmark_moravia_rostislav: "Král Rostislav" # todo: NEW TRANSLATION
 bookmark_moravia_rostislav_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$" # todo: NEW TRANSLATION
 bookmark_moravia_rostislav_desc: "Velká Morava leží mezi Římem a Konstantinopolí a duchovní lačnící po moci se přou o vliv nad jejím dvorem. Rostislav, ostražitý vůči cizí nadvládě, usiluje o vlastní křesťanskou tradici.\n\n#bold Dokážete hájit Rostislavovu vizi a založit trvalé slovanské křesťanství? Dokážete udržet Moravu sjednocenou proti všem, kdo by ji chtěli rozdělit?#!" # todo: NEW TRANSLATION
 bookmark_moravia_rostislav_alt_svatopluk: "Svatopluk" # todo: NEW TRANSLATION
 bookmark_hamburg_rimbert: "Kníže-arcibiskup Rimbert" # todo: NEW TRANSLATION
 bookmark_hamburg_rimbert_subheading: "Arcibiskup hamburský" # todo: NEW TRANSLATION
 bookmark_hamburg_rimbert_desc: "Spolu s hamburským arcibiskupstvím zdědil Rimbert titul „apoštola Severu“ i svaté poslání obrátit pohanskou Skandinávii. Ze svého sídla na samém okraji křesťanského světa hledí na pohanskou Skandinávii, kde dánští a švédští králové stále uctívají pohanské modly a kde byla zaseta teprve první semínka křtu.\n\n#bold Dokážete kráčet ve stopách arcibiskupa Ansgara, přivést Seveřany do lůna církve a učinit z Hamburku metropolitní sídlo mocného křesťanského Severu?#!" # todo: NEW TRANSLATION
 bookmark_adalwin_salzburg: "Kníže-arcibiskup Adalwin" # todo: NEW TRANSLATION
 bookmark_adalwin_salzburg_subheading: "Arcibiskup salcburský" # todo: NEW TRANSLATION
 bookmark_adalwin_salzburg_desc: "Adalwin spravuje Salcburk, nesmírně mocné církevní sídlo, kterému se vyrovná pouze Konstantinopol a papežské státy. Jeho hlavním nástrojem moci je mistrovská znalost kanonického práva. Doufá, že díky ní podřídí každý církevní úřad své kanceláři.\n\n#bold Dokážete ovládat krále i církev, soustředit moc ve svém sídle a získat nejmocnější úřad v celém křesťanském světě?#!" # todo: NEW TRANSLATION
 bookmark_lupus_aquileia: "Kníže-arcibiskup Lupus" # todo: NEW TRANSLATION
 bookmark_lupus_aquileia_subheading: "Akvilajský patriarchát" # todo: NEW TRANSLATION
 bookmark_lupus_aquileia_desc: "V knížecím biskupství svíraném krutými ambicemi světských mocipánů se Lupus obrací k doktrinálním sporům a dvorským intrikám jako ke své cestě k moci.\n\n#bold Dokážete své soupeře předčit vzdělaností, přelstít sousedy a zajistit v Akvileji trvalé místo mužům církve... i mužům svého rodu?#!" # todo: NEW TRANSLATION
