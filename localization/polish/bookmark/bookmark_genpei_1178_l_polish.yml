l_polish:
 bm_1178_genpei: "Vzestup buši"
 bm_1178_genpei_desc: "Krok za krokem samurajové vyrvali moc hlavnímu městu a začali vládnout japonským provinciím jako vlastním državám, čímž obohacovali sebe i své stoupence.\n\nPoslední desetiletí přinesla hrdému rodu Minamoto jednu porážku za druhou od nezastavitelných Tairů. Ti nyní lížou své rány, zatímco Kijomori ovládá hlavní město. Vládu tam nyní drží strach a síla, zatímco kampaku a císařský rod bezmocně přihlížejí.\n\n#bold Dokážou Minamotové ukončit vzestup Tairů, nebo čeká tyto ostrovy jiný osud?#!"

 bookmark_genpei_yoritomo: "$dynn_Minamoto$ $Yoritomo$"
 bookmark_genpei_yoritomo_subheading: "Pán $c_izu$"
 bookmark_genpei_yoritomo_noriyori: "$Noriyori$"
 bookmark_genpei_yoritomo_yoshitsune: "$Yoshitsune$"
 bookmark_genpei_yoritomo_desc: "Kdysi mocný rod [Glossary( 'Seiwa Minamoto', 'MINAMOTO_GLOSS' )] utrpěl nespočet nezdarů a podlehl vnitřním sporům, zatímco jeho staří rivalové, [Glossary( 'Kanmu Taira', 'TAIRA_GLOSS' )], posbírali trosky jeho moci.\n\nKdyž Minamoto Jorimasa klade jen malý odpor, jsou Joritomo a ostatní přeživší synové slavného vojevůdce Jošitoma možná jedinou překážkou mezi Tairou Kijomorim a úplným ovládnutím Japonska.\n\n#BOLD Brzy budou Tairů příliš mocní, než aby jim někdo mohl odporovat. Podlehneš tisíci ranám, nebo sjednotíš zemi a přineseš jí trvalý mír?#!"

 bookmark_genpei_kiyomori: "$emperor_daijo_daijin_male_japanese_feudal$ $dynn_Taira$ $Kiyomori$"
 bookmark_genpei_kiyomori_subheading: "$BOOKMARK_SUBHEADING_RULING_REGENT$"
 bookmark_genpei_kiyomori_shigemori: "$Shigemori$"
 bookmark_genpei_kiyomori_tsunemori: "$Tsunemori$"
 bookmark_genpei_kiyomori_desc: "[Glossary( 'Kanmu Taira', 'TAIRA_GLOSS' )] se postupně ustanovili jako nejmocnější samurajský rod v Japonsku, když úspěšně odstavili své zuřivé soupeře z řad buši, [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )], i byrokratický rod [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )].\n\nKijomori, jehož dcera se provdala za [Glossary( 'Yamato', 'YAMATO_GLOSS' )] císaře Norihita, nyní očekává vnuka. Princ z rodu Taira v nástupnické linii na trůn upevní nadvládu rodu nad dvorem. Tento základ moci však nebude snadné položit, dokud kolem číhají žárliví nepřátelé.\n\n#BOLD Dokážeš v Japonsku ustanovit trvalou vládu Tairů, nebo padneš na poslední překážce?#!"

 bookmark_genpei_motofusa: "$dynn_Fujiwara$ $Motofusa$"
 bookmark_genpei_motofusa_subheading: "$game_concept_governor$ $c_oki$"
 bookmark_genpei_motofusa_kanezane: "$Kanezane$"
 bookmark_genpei_motofusa_takatada: "$Takatada$"
 bookmark_genpei_motofusa_desc: "Rod [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )] po staletí formálně sloužil jako [Glossary( 'regenti', 'KAMPAKU_GLOSS' )], avšak ve skutečnosti vládl Japonsku ze stínu, ovládal byrokracii hlavního města a ženil se do dynastie [Glossary( 'Yamato', 'YAMATO_GLOSS' )].\n\nDaleko od hlavního města však samurajové budovali vlastní državy. Jejich bohatství a ozbrojená síla nyní převyšují sílu vznešených byrokratů. Nejmocnější buši, [Glossary( 'Taira', 'TAIRA_GLOSS' )] vedení Kijomorim, převzali kontrolu nad hlavním městem.\n\n#BOLD Dokážeš zastavit vzestup samurajů a znovu zažehnout slávu dvora vedeného rodem Fujiwara?#!"

 bookmark_genpei_hidehira: "$dynn_Fujiwara$ $Hidehira$"
 bookmark_genpei_hidehira_subheading: "Pán Mutsu"
 bookmark_genpei_hidehira_yasuhira: "$Yasuhira$"
 bookmark_genpei_hidehira_hidehisa: "$Hidehisa$"
 bookmark_genpei_hidehira_desc: "Zatímco většina [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )] skládala poezii v hlavním městě, potomci vojevůdce Hidesata se usadili na drsném severu, kde pacifikovali kmeny a soupeřili s ostatními buši.\n\nHidehirův děd byl adoptován rodem Kijomara, vládci Óšú. Poté, co zničil všechny soupeře o dědictví tohoto rodu, obnovil své jméno Fujiwara a rozšířil svou moc nad severem.\n\n#BOLD Dvorská samolibost rodu Fujiwara dala vzniknout hrozbě [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] a [Glossary( 'Taira', 'TAIRA_GLOSS' )]. Meč, který dobyl sever — mohl by obnovit prvenství Fujiwarů?#!"

 bookmark_genpei_yoshinaka: "$dynn_Minamoto$ $Yoshinaka$"
 bookmark_genpei_yoshinaka_subheading: "Pán $c_shinano$"
 bookmark_genpei_yoshinaka_tomoe: "$Tomoe$ $Gozen$"
 bookmark_genpei_yoshinaka_yoshitaka: "$Yoshitaka_2$"
 bookmark_genpei_yoshinaka_desc: "Kvůli sporům o vedení a dědictví kawacké větve [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] nechal nejstarší syn Jošitomo zabít svého bratra Jošikatu v následných bojích.\n\nRod Nakahara ukryl Jošikatovo prchající dítě v horách Šinana a přestože je Jošitomo již dávno mrtev, nyní dospělý Jošinaka nezapomněl na své ztracené rodové právo.\n\n#BOLD Pomstíš svého otce na svém bratranci Joritomovi, dědici Jošitoma, nebo pomůžeš rodu proti většímu nepříteli?#!"
