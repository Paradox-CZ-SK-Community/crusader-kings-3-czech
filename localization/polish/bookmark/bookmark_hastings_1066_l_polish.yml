l_polish:
 bm_1066_hastings: "Osud Anglie"
 bm_1066_hastings_desc: "Když bezdětný král Eduard Vyznavač zemřel, uvrhlo to Anglii do krize následnictví, jakou dosud nepoznala.\n\nTři muži se pokusili získat trůn pro sebe: Harold Godwinson, Vilém Bastard a Harald Hardrada, zatímco Svend a Malcolm vyčkávali připraveni zaútočit při sebemenším náznaku slabosti.\n\n#bold Kdo po tomto bouřlivém období dějin vyjde jako vítěz?#!"
 bookmark_hastings_england: "Král Harold Anglický"
 bookmark_hastings_england_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_hastings_england_desc: "Když zemřel bezdětný král Eduard, byl Harold Godwinson vůdcem mocného šlechtického rodu a královým švagrem. Nyní, zvolen svými vrstevníky novým králem Anglie, čelí výzvě udržet si trůn, neboť ctižádostivý normandský vévoda i norský král Harald, povzbuzeni a podporováni Haroldovým vyhnaným bratrem, usilují o jeho nahrazení!\n\n#bold S velkou armádou za zády a podporou anglosaských pánů — zjistí vlci, že se zakousli do něčeho příliš velkého?#!"
 bookmark_hastings_england_alt_tostig: "$Tostig$"
 bookmark_hastings_england_alt_eadgifu: "$Eadgifu$ $nick_the_fair$"
 bookmark_hastings_normandy: "Vilém Bastard"
 bookmark_hastings_normandy_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_hastings_normandy_desc: "Rod Normandie odvozuje svůj původ od severských Vikingů a na pevnině Evropy se usadil před více než 200 lety. Nyní Vilém II. sní o tom, že svou rodinu dovede k vládě nad Anglickým královstvím, neboť věří, že jeho nástupnické právo na trůn mu přislíbil zesnulý král Eduard a uznal je dokonce i samotný Harold Godwinson. Nyní, když je však Eduard mrtev, Harold porušil svou přísahu a zmocnil se koruny pro sebe!\n\n#bold Vilém vede válku proti Anglii. Dokážeš shromáždit své síly a získat to, co ti právem náleží?#!"
 bookmark_hastings_normandy_alt_robert: "$Robert$ $nick_the_curthose$"
 bookmark_hastings_normandy_alt_william: "$William$ $nick_the_red$"
 bookmark_hastings_norway: "Harald Hardrada"
 bookmark_hastings_norway_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_hastings_norway_desc: "Harald od mládí prokazoval mimořádné vojenské nadání a nedávno se pokusil dobýt Dánsko, avšak neúspěšně. Nyní hledí za moře — podle dávné dohody měla po smrti posledního krále bez dědice připadnout koruna Anglie Haraldovi. Místo toho však Anglosasové dosadili na trůn Harolda Godwinsona! Naštěstí si falešný král nadělal nepřátele a Tostig Godwinson, Haroldův vlastní bratr, žije ve vyhnanství v Norsku...\n\n#bold Dokážeš využít jeho vlastní nepřátele proti němu a předat tomuto varjažskému Vikingovi vládu nad Severním mořem?#!"
 bookmark_hastings_norway_alt_olaf: "$Olaf$"
 bookmark_hastings_norway_alt_ingegerd: "$Ingegerd$"
 bookmark_hastings_denmark: "Král Svend Dánský"
 bookmark_hastings_denmark_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_hastings_denmark_desc: "Díky pokrevním vazbám k Anglii i Norsku má Svend silné nároky na oba trůny. Jeho vojska jsou však malá a nedisciplinovaná, takže dobyvačná válka není uskutečnitelná. Existují však i jiné způsoby, jak usilovat o své sny...\n\n#bold Pokud by se tvé děti provdaly a oženily do mocných rodů, mohlo by ti to přinést mnoho užitečných spojenectví — spojenectví, která můžeš využít k založení říše soupeřící se samotným Římem!#!"
 bookmark_hastings_denmark_alt_harald: "$Harald$ $nick_the_whetstone$"
 bookmark_hastings_denmark_alt_knud: "$Knud$"
 bookmark_hastings_scotland: "Král Malcolm Skotský"
 bookmark_hastings_scotland_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_hastings_scotland_desc: "Ve Skotsku známý jako „Velký náčelník“ má Malcolm III. nejisté postavení, ale zároveň mnoho příležitostí. Na jihu leží bohaté země Northumbrie, zranitelné v době, kdy je Anglie zmítána válkou, avšak doma jeho vládu stále zpochybňují severští válečníci i gaelští horalové.\n\n#bold Britské ostrovy oplývají nebezpečími i příležitostmi: dokážeš v této zahradě plné trní utrhnout růži?#!"
 bookmark_hastings_scotland_alt_duncan: "$Duncan$"
 bookmark_hastings_scotland_alt_donald: "$Donald$ $nick_the_fair$"
