l_polish:
 bm_1066_iberia: "Rozdrobená Iberie"
 bm_1066_iberia_desc: "Když starý král Ferdinand I. zemřel, každý z jeho tří synů zdědil část jeho iberského království. Chamtivost, ctižádost a svaté války brzy přivedou Pyrenejský poloostrov k bodu varu a rodinná pouta se začnou rozpadat.\n\n#bold Je některý ze sourozenců Fernándezových dostatečně silný či lstivý, aby nad ostatními zvítězil? Jak válka a diplomacie utvářejí Pyrenejský poloostrov?#!"
 bookmark_iberia_king_garcia: "Král García"
 bookmark_iberia_king_garcia_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_iberia_king_garcia_desc: "García získal nejneklidnější ze tří bratrských království a pokusil se svou vládu stabilizovat mnoha krajními prostředky. Oslabená země však brzy začala příliš lákat jeho bratra Alfonsa, který ji roku 1071 napadl. Tento útok rozpoutal řadu válek mezi bratry, García však většinu této doby strávil za mřížemi.\n\n#bold Pozvedni zbraň proti svým bratrům a doveď toto nestabilní království ke slávě a vítězství!#!"
 bookmark_iberia_king_alfonso_alt_sancha: "$Sancha$"
 bookmark_iberia_king_alfonso_alt_nuno: "$NuN_o$"
 bookmark_iberia_king_alfonso: "Král Alfonso VI."
 bookmark_iberia_king_alfonso_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_iberia_king_alfonso_desc: "Alfonso, prostřední syn a otcův oblíbenec, zdědil bohaté království León ležící uprostřed otcových držav. Poté oba své bratry přelstil a podrobil si je, načež vládl znovusjednocenému království svého otce.\n\n#bold Dokážeš pomocí politické i rodinné diplomacie a agrese sjednotit všechna tři království pod jediným praporem?#!"
 bookmark_iberia_king_sancho: "Král Sancho II."
 bookmark_iberia_king_sancho_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_iberia_king_sancho_desc: "Sancho byl připraven o celé své dědictví, když jeho otec rozdělil zemi mezi všechny tři bratry. Jako muž, který se uměl chopit příležitosti, pozvedl zbraň proti svým bratrům, jakmile se mír začal hroutit. Znovusjednocenému království však vládl jen krátce, než byl zavražděn.\n\n#bold Dokážeš pomocí vojenské síly a důkladného plánování navrátit celé království jeho slávě pod vládou jediného právoplatného panovníka a udržet si moc?#!"
 bookmark_iberia_king_sancho_alt_rodrigo: "$Rodrigo$"
 bookmark_iberia_infanta_urraca: "Infantka Urraca"
 bookmark_iberia_infanta_urraca_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_iberia_infanta_urraca_desc: "Urraca, nejstarší z Ferdinandových dětí, měla značný vliv na své bratry i na církev. Spolu se svou sestrou Elvirou získala svrchovanost nad všemi kláštery ve třech královstvích a nečinně nepřihlížela, když se její bratři navzájem ničili.\n\n#bold Aby Urraca přelstila své bratry a zajistila si místo v dějinách, potřebuje trpělivost i odvahu – uspěješ?#!"
 bookmark_iberia_infanta_urraca_alt_elvira: "$Elvira$"
 bookmark_iberia_king_antso: "Král Antso IV."
 bookmark_iberia_king_antso_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_iberia_king_antso_desc: "Když Antso po smrti svých rodičů nastoupil na trůn, mnoho pánů na západě království se od něj odvrátilo. Brzy se zapletl do války se svým bratrancem, králem Sanchem, v níž utrpěl porážku. Po vládě poznamenané válkami a neúspěchy jej nakonec zavraždili vlastní sourozenci.\n\n#bold Přepiš dějiny, přelsti svou rodinu a zajisti si doménu i dědictví!#!"
 bookmark_iberia_king_antso_alt_ramiro: "$Ramiro$"
 bookmark_iberia_king_antso_alt_sancho: "$Sancho$"
