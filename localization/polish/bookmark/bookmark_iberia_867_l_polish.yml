l_polish:
 bm_867_iberia: "Iberský svár"
 bm_867_iberia_desc: "Staré mocnosti Iberie se hroutí.\n\nNa severu jsou Asturie plné ctižádostivých vazalů, kteří usilují o svobodu.\n\nNa jihu al-Andalus sílí, avšak čelí doutnající nespokojenosti. V pohraničních vojenských okrscích se šeptá o nezávislosti a vládnoucí Umajjovce sužují pletichy.\n\nNenasytné cizí mocnosti dychtivě hledí na bohaté země Iberie.\n\n#bold Po staletích vývoje vstupuje $game_concept_iberian_struggle$ do nové fáze a o tom, zda skončí krveprolitím, či bratrstvím, rozhodne hod kostkou."
 war_867_Vimara_conquest_Portucale: "Válka o Vimarův [Concept('claim','nárok')|E] na $d_porto$"
 war_Andalusian_Rebellion: "Povstání pohraničních krajů"
 bookmark_fp2_iberia_wilfred_the_hairy: "$GuifrE_$ $nick_the_hairy$"
 bookmark_fp2_iberia_wilfred_the_hairy_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_fp2_iberia_sunyer: "$Sunyer$"
 bookmark_fp2_iberia_bernat_of_gothia: "$Bernat$"
 bookmark_fp2_iberia_wilfred_the_hairy_desc: "Když jeho otce a strýce zmasakroval vévoda z Toulouse, franský král zabral jejich země, takže $GuifrE_$ i jeho bratranci zůstali bez prostředků.\n\nUplynulo dvacet let a kolo osudu se obrací. $GuifrE_$ byl znovu dosazen do zemí svého otce, jeho pletichářský bratranec rovněž získal zpět své dědictví a jejich nový lenní pán je bratrancem muže, který zabil jejich rodiče.\n\n#bold Právě ty ze všech nejlépe víš, že štěstěna se může změnit v jediném okamžiku, a toužíš proto po jistější kořisti – $d_barcelona$.#!"
 bookmark_fp2_iberia_lupp_ibn_musa: "$Lubb$ Muzez"
 bookmark_fp2_iberia_lupp_ibn_musa_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_fp2_iberia_lupp_ibn_musa_desc: "Mocná dynastie Banu Qasi, Synové Cassiovi, kdysi ovládala celé údolí Ebra. Od vlády slavného $Lubb$ova otce ji však stíhají těžké časy a Banu Musa, jak se nyní nazývají, ve svém dávném sídle v Tudele jen reptají, lížou si rány a spřádají plány na znovuzískání svých jižních panství.\n\n#bold Dokážeš získat zpět to, co kdysi patřilo Banu Qasi, a navrátit dynastii její někdejší slávu?#!"
 bookmark_fp2_iberia_lubb_ibn_musa_alt_mohamed: "Mohamed"
 bookmark_fp2_iberia_lubb_ibn_musa_alt_oria: "Oria"
 bookmark_fp2_iberia_mendo_guterres: "Hrabě $Hermenexildo$ Gutierrez"
 bookmark_fp2_iberia_mendo_guterres_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_fp2_iberia_mendo_guterres_desc: "Jako mocný vazal krále Adelfonsa III. spravuje $Hermenexildo$ země jižní Galicie bez jediné poskvrny. Neochvějná věrnost panovníkovi mu pomohla rozšířit rodové panství své rodiny – ale stačí to?\n\n#bold Dokážeš s rostoucím zájmem o jih dobýt země Portucale a položit základy jedné z jeho nejvlivnějších dynastií?#!"
 bookmark_fp2_iberia_mendo_guterres_alt_arias: "$Arias$"
 bookmark_fp2_iberia_mendo_guterres_alt_ermesinda: "Hermesinda Gatónez"
 bookmark_fp2_iberia_ibn_marwan: "Ibn Marwan"
 bookmark_fp2_iberia_ibn_marwan_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_fp2_iberia_ibn_marwan_desc: "Abd al-Rahman ibn Marwan je od přírody buřič a se svým lenním pánem, umajjovským sultánem, má bouřlivý vztah. Mezi Mozaraby ve své doméně se však těší silné podpoře a ve skutečnosti toho možná má s nimi a jejich vírou společného více, než by se zdálo. V Badajozu si vydobyl pevnou mocenskou základnu, avšak na západě se horlivý rod Banu Danis stále rozhodněji staví proti jeho vládě nad Dolní markou.\n\n#bold Mohlo by ti spojenectví s Alfonsem III., asturským králem, jenž nikdy nepromarní příležitost, pomoci získat vlastní korunu?#!"
 bookmark_fp2_iberia_ibn_marwan_alt_surunbaqi: "Emír Sa'dun z Porta"
 bookmark_fp2_iberia_ibn_marwan_alt_rahman: "Abd al-Rahman"
 bookmark_fp2_iberia_adanis_ibn_awsaga: "Emír Adanis"
 bookmark_fp2_iberia_adanis_ibn_awsaga_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_fp2_iberia_adanis_ibn_awsaga_desc: "Berberská dynastie Banu Danis, kterou umajjovský sultán pověřil ochranou západního pobřeží před vikingskými nájezdy, rychle získala vliv a moc. Emír Adanis vybudoval mocné pevnosti v Alcáceru a Coimbře, znepokojují ho však Mozarabové pod jeho vládou, kteří by se raději přidali k jeho úhlavnímu nepříteli Ibn Marwanovi.\n\n#bold Dokážeš zabezpečit své země a dovést Berbery k zářné budoucnosti v al-Andalusu?#!"
 bookmark_fp2_iberia_ibn_awsaga_alt_masud: "Mas'ud ibn Adanis"
 bookmark_fp2_iberia_ibn_awsaga_alt_yahya: "Jahjá ibn Adanis"
