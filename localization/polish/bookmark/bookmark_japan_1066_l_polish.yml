l_polish:
 bm_1066_japan: "Měsíc, který nikdy neubývá"
 bm_1066_japan_desc: "Uplynulo téměř půl století od chvíle, kdy Fudžiwara Mičinaga, japonský kampaku, sepsal svou slavnou báseň: #EMP „Tento svět považuji za svůj svět a úplněk za měsíc, který nikdy neubývá.“#!\n\nJeho slova jsou všeobecně vykládána jako prohlášení o neotřesitelném postavení rodu Fudžiwara coby císařských regentů a dosud se zdají být pravdivá. Mičinagův syn se chystá předat své všemocné postavení další generaci.\n\n#bold Udrží si Fudžiwarové nadvládu nad císařským dvorem navzdory odporu ostatních aristokratických rodů a císařské rodiny?#!"
 bookmark_japan_yorimichi: "Kampaku $dynn_Fujiwara$ $Yorimichi$"
 bookmark_japan_yorimichi_subheading: "$BOOKMARK_SUBHEADING_RULING_REGENT$"
 bookmark_japan_yorimichi_morozane: "$Morozane$"
 bookmark_japan_yorimichi_sadatsuna: "$Sadatsuna$"
 bookmark_japan_yorimichi_desc: "Jorimiči, devátý z dlouhé řady regentů rodu [Glossary( 'Fudžiwara', 'FUJIWARA_GLOSS' )], vládne Japonsku již téměř půl století. Nyní podléhá stáří a chystá se předat pochodeň svému synovi Morozanemu – budoucnost je však plná nejistoty.\n\nCísař Čikahito se vzpírá [Glossary( 'regentství', 'KAMPAKU_GLOSS' )] a touží znovu soustředit moc kolem svého [Glossary( 'Chryzantémového trůnu', 'CHRYSANTHEMUM_THRONE_GLOSS' )]. Daleko od hlavního města se vzdálené provincie vymanily z ústřední správy a vládnou jim povýšení aristokraté jako vlastním lénům.\n\n#BOLD Dokážeš obnovit nadvládu Fudžiwarů a zabránit rozpadu systému [Glossary( 'ricurjó', 'RITSURYO_GLOSS')]?#!"
 RITSURYO_GLOSS: "#bold Ricurjó#! byl centralizovaný právní a správní systém, který byl v Japonsku poprvé zaveden na konci 7. století s cílem rozšířit moc císařského dvora. V 11. století se již nacházel v hlubokém úpadku a jeho funkce si postupně přivlastňovali soukromníci a mocné rody."
 bookmark_japan_go_reizei: "$Chikahito$ $king_tenno_male_japanese$"
 bookmark_japan_go_reizei_subheading: "$game_concept_ceremonial_liege$ Japonska"
 bookmark_japan_go_reizei_tameyuki: "$Tameyuki$"
 bookmark_japan_go_reizei_go_sanjo: "$Takahito$"
 bookmark_japan_go_reizei_desc: "$Chikahito$ vyrůstal jako pěšák v přetahované mezi svým otcem, bývalým císařem [Glossary( 'Go-Suzakuem', 'JOKO_GLOSS' )], a regentem z rodu [Glossary( 'Fudžiwara', 'FUJIWARA_GLOSS' )], $Yorimichi$em. Nyní se $Chikahito$ coby [Glossary( 'císař', 'TENNO_GLOSS' )] ze všech sil snaží prosadit císařskou moc, stále však plní převážně obřadní úlohu.\n\nRodina jeho manželky jej přinutila odepřít uznání jeho jedinému synovi, a dědicem Chryzantémového trůnu je tak nyní $Chikahito$ův bratr $Takahito$.\n\n#BOLD Dokážeš omezit nadvládu Fudžiwarů, obnovit moc rodu [Glossary( 'Jamato', 'YAMATO_GLOSS' )] a vládnout jako císař nejen podle jména, ale se skutečnou a trvalou mocí?#!"
 bookmark_japan_morofusa: "$dynn_Minamoto$ $Morofusa$"
 bookmark_japan_morofusa_subheading: "$game_concept_governor$ v $c_iyo$"
 bookmark_japan_morofusa_toshifusa: "$Toshifusa$"
 bookmark_japan_morofusa_akifusa: "$Akifusa$"
 bookmark_japan_morofusa_desc: "$Morofusa$, vnuk císaře $Murakami$ho, je vzácným příkladem úspěšného úředníka z rodu [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )], který rychle postupoval v hodnostech pod ochranou svého pěstouna, [Glossary( 'kampakua', 'KAMPAKU_GLOSS' )] $dynn_Fujiwara$ $Yorimichi$ho.\n\nPřestože vztahy mezi rodem [Glossary( 'Fudžiwara', 'FUJIWARA_GLOSS' )] a Murakamiovskou větví Minamotů zůstávají vřelé, ostatní šlechtické rody a císařská rodina doufají, že se $Morofusa$ stane protiváhou vlivu Fudžiwarů.\n\n#BOLD Dokážeš vyrvat regentství Fudžiwarům a předat moc přímým potomkům císařského rodu?#!"
 bookmark_japan_takenori: "$dynn_Kiyohara$ $Takenori$"
 bookmark_japan_takenori_subheading: "Vládce Mucu"
 bookmark_japan_takenori_takehira: "$Takehira$"
 bookmark_japan_takenori_mitsuyori: "$Mitsuyori$"
 bookmark_japan_takenori_desc: "V nedávné válce Zenkunen pomohl $Takenori$ rodu [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] vyrvat vládu nad severem z rukou dlouho vládnoucího rodu Abe. Císařský dvůr vedený rodem [Glossary( 'Fudžiwara', 'FUJIWARA_GLOSS' )] odměnil Kijohary za tuto službu tím, že jim svěřil vládu buši nad severními zeměmi.\n\nToto záviděníhodné postavení, které podléhá jen nepatrnému císařskému dohledu, je trpěno, dokud bohatství Mucu proudí na jih do hlavního města.\n\n#BOLD Udržíš si své těžce vydobyté postavení a založíš trvalé panství Kijoharů, nebo neshody mezi tvými dědici zničí vše, co jsi vybudoval?#!"
 bookmark_japan_yoriyoshi: "$dynn_Minamoto$ $Yoriyoshi$"
 bookmark_japan_yoriyoshi_subheading: "Vládce Kawači"
 bookmark_japan_yoriyoshi_yoshiie: "$Yoshi_ie$"
 bookmark_japan_yoriyoshi_yorisue: "$Yorisue$"
 bookmark_japan_yoriyoshi_desc: "$Yoriyoshi$ vede nejmocnější větev rodu [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )], jejíž členové pocházejí z linie císaře $Seiwa$. Jejich vliv vzrostl poté, co on a jeho syn $Yoshi_ie$ sloužili jako vojevůdci rodu [Glossary( 'Fudžiwara', 'FUJIWARA_GLOSS' )] ve válce Zenkunen, během níž bojovali po boku rodu Kijohara.\n\nDíky vítězství se Minamotové stali vůdčími představiteli samurajských rodů oblasti Bandó, včetně mocného rodu [Glossary( 'Taira', 'TAIRA_GLOSS' )].\n\n#BOLD Prosadíš své postavení vůdce samurajských rodů a vybuduješ spojenectví schopné postavit se zdánlivě neotřesitelným Fudžiwarům?#!"
