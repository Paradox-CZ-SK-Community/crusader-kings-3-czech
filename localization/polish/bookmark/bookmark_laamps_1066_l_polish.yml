l_polish:
 bm_story_content_available_icon: "@story_content_icon!"
 bm_story_content_available_copy: "#font:TitleFont #size:15 Dostupný speciální příběhový obsah#!#!#!"
 bm_1066_laamps: "Putující vyhnanci"
 bm_1066_laamps_desc: "Páni a dámy svými malichernými mocenskými hrami trhají svět vedví. Velcí dobrodruzi se mezitím pozvedají ze skromných poměrů, aby svá jména vytesali do věčnosti. Nejsou vázáni povinnostmi, nemají tituly ani koruny, jejich domovem je cesta a jejich osud nezná mezí.\n\n#bold S velkou odvahou, lstivostí a ctižádostí můžeš čelit hašteření šlechty a využít její marnivé záměry k vlastnímu vzestupu! Máš na to, aby ses probojoval blátem a prachem a stal se legendou?#!"
 bookmark_laamps_hassan_sabbah: "Hasan Sabbáh"
 bookmark_laamps_hassan_sabbah_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_laamps_hassan_sabbah_desc: "[Concept( 'story_content_hasan', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hasan', '$bm_story_content_available_copy|q$' )|E]\nHasan Sabbáh se narodil do nepříliš významné rodiny, ale jeho neochvějná oddanost islámu a fanatický odpor proti seldžucké nadvládě jej přivedly na cestu, která navždy změnila dějiny.\n\nHasan byl navzdory svému skromnému původu předurčen založit asasíny v jejich horské pevnosti Alamut. Stal se legendou a všichni se začali obávat děsivého Starce z hory.\n\n#bold Máš dostatek prohnanosti a neochvějné víry, abys shromáždil věřící a svrhl celé říše?#!"
 bookmark_laamps_suleyman_qutalmishoglu: "Süleyman Kutalmişoğlu"
 bookmark_laamps_suleyman_qutalmishoglu_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_laamps_suleyman_qutalmishoglu_desc: "V boji o seldžucký trůn byl Süleyman poražen svým bratrancem Alp Arslanem a spolu se svými bratry vyhnán do exilu. Byl ponížen, nikoli však zlomen, a podařilo se mu získat věrnost místních turkmenských kmenů v pohoří Taurus.\n\nSüleyman měl později uprostřed nepokojů v Anatolii vybudovat Rúmský sultanát a zaplést se do válek byzantských uchazečů o trůn.\n\n#bold Bude tvá síla stačit k položení základů nové říše?#!"
 bookmark_laamps_alt_alp_arslan: "Alp Arslan"
 bookmark_laamps_alt_mensur_qutalmishoglu: "Mensur"
 bookmark_laamps_el_cid: "Rodrigo Díaz „Campeador“"
 bookmark_laamps_el_cid_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_laamps_el_cid_desc: "[Concept( 'story_content_el_cid', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_el_cid', '$bm_story_content_available_copy|q$' )|E]\nRodrigo pocházel ze vznešeného rodu a již ve velmi mladém věku vstoupil do královské rady. Ve službách kastilského krále Sancha II. se pod jeho bedlivým dohledem vzdělával ve dvorských i válečnických záležitostech.\n\nSanchova válka proti jeho bratru Alfonsovi VI. Leónskému však vedla k jeho předčasné smrti a Alfonso poté Rodriga vyhnal, čímž nevědomky odstartoval jeho legendu.\n\n#bold Stane se Rodrigo el Cidem, tedy „pánem“, a prosadí se jako král vlastním právem, nebo zůstane obyčejným šlechticem?#!"
 bookmark_laamps_hereweard_the_wake: "Hereward „Bdělý“"
 bookmark_laamps_hereweard_the_wake_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_laamps_hereweard_the_wake_desc: "[Concept( 'story_content_hereward', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hereward', '$bm_story_content_available_copy|q$' )|E]\nEduard Vyznavač Herewarda vypověděl a prohlásil za psance, a ten se proto vydal do Flander hledat slávu a bohatství.\n\nJednoho dne se měl Hereward vrátit do Anglie a vést odhodlaný odpor proti normanským nájezdníkům, čímž se stal proslulým lidovým hrdinou.\n\n#bold Zůstane Hereward pod tvým vedením nechvalně proslulým zločincem, nebo se stane hrdinou, kterým se měl narodit?#!"
 bookmark_laamps_alt_boudewijn_v: "Balduin V."
 bookmark_laamps_robert_crispin: "Robert „Frangopulos“"
 bookmark_laamps_robert_crispin_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_laamps_robert_crispin_desc: "Robert Crispin jako druhorozený syn bez vyhlídky na dědictví přijal normanského dobrodružného ducha za svého.\n\nJiž jako ostřílený veterán bojů v Iberii vstoupil do služeb byzantského císaře a nyní vede oddíl normanských žoldnéřů do boje proti Turkům.\n\n#bold Nalezne Robert vytouženou slávu jako velký velitel, nebo padne za oběť zmijímu hnízdu byzantského dvora?#!"
 bookmark_laamps_alt_konstantinos_x: "Konstantin X."
 bookmark_laamps_alt_roussel_de_baeilleul: "Roussel de Bailleul"
 bookmark_laamps_wallada_bint_al_mustakfi: "Walláda bint al-Mustakfí"
 bookmark_laamps_wallada_bint_al_mustakfi_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_laamps_wallada_bint_al_mustakfi_desc: "[Concept( 'story_content_wallada', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_wallada', '$bm_story_content_available_copy|q$' )|E]\nWalláda, dcera córdobského chalífy a jedna z posledních Umajjovců, zasvětila svůj život vzdělání a učenosti. Na očekávání kladená na ženy v andaluské společnosti příliš nedbala, kráčela přísným světem bez závoje a tříbila mysl žen ze všech společenských vrstev.\n\nWalládin život nezná hranic a její možnosti jsou nekonečné.\n\n#bold Přijímej a vzdělávej inteligentní ženy z celého světa pro svou věc. Dokážeš prolomit okovy tradice a ujmout se odkazu Umajjovského chalífátu?#!"
 bookmark.1073.t: "Právoplatný Seldžuk"
 bookmark.1073.desc: "Uplynuly tři roky od chvíle, kdy [tughril.GetTitledFirstName] zemřel bez dědice a uvrhl [GetTitleByKey('k_persia').GetBaseNameNoTier] do chaosu. Pořádek mohl udržet pouze jeho bratranec, můj počestný otec [qutalmish.GetTitledFirstName].\n\nTughrilův chamtivý synovec [alp_arslan.GetFirstName] přitáhl z Chorásánu, aby uchvátil korunu, zatímco se věrní shromáždili za mnou a mým otcem. Náš osud však byl zpečetěn v bitvě u [GetTitleByKey('b_damghan').GetNameNoTier]: můj otec padl a já jsem byl zajat...\n\nMí bezectní příbuzní mi sice udělili milost, ale poslali mě do vyhnanství. Spolu se svými bratry vedu zbylé věrné a v horách si obstaráváme jen skromnou obživu. Já však #EMP vím#!, že nás čekají větší věci – oguzská vojska již nyní pronikají do [GetTitleByKey('e_byzantium').GetNameNoTier|l], bohatých zemí zralých ke sklizni!"
 bookmark.1073.a: "Mým osudem je založit #EMP nové#! seldžucké panství!"
 bookmark.1073.b: "Seldžucký trůn patří #EMP mně#!."
