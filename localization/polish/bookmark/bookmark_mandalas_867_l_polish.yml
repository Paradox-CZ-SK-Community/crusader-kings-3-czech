l_polish:
 bm_867_mandalas: "Živoucí bohové na zemi"
 bm_867_mandalas_desc: "Nikde nejsou královská a duchovní moc propojeny tak těsně jako v jihovýchodní Asii. Po staletí získávala dharmická vyznání mezi zdejšími národy stále silnější postavení, ale teprve v posledním století začali ti, kteří bývali králi, přijímat titul dévarádža neboli božský král.\n\n#bold Který z těchto božských králů po sobě zanechá odkaz oddanosti a kdo bude poražen a zapomenut?#!"
 bookmark_mandalas_867_jayavarman_angkor: "Džajavarman III."
 bookmark_mandalas_867_jayavarman_angkor_subheading: "Sdač Angkoru"
 bookmark_mandalas_867_jayavarman_angkor_desc: "Angkor je od dob Džajavarmana II. novou mocností na vzestupu. Právě on jako první z tohoto rodu přijal titul dévarádža. Po jeho smrti se však panství sotva podobá velké říši, kterou kdysi bylo, a scvrklo se téměř na pouhý městský stát.\n\nBýt bohem Khmerů však není snadná úloha. Džajavarman III. jen obtížně překonává svého předchůdce a sám se snaží stát velkým stavitelem.\n\n#bold Dokážou Varmanové dostát svému božskému odkazu? Nebo je překonají jiní, kteří si činí nárok na vládu nad tímto světem?#!"
 bookmark_mandalas_867_indra: "Indra"
 bookmark_mandalas_867_indra_subheading: "Rádža Kutaje"
 bookmark_mandalas_867_indra_desc: "Vládci malého panství Kutai patřili k prvním v souostroví, kteří pozvali hinduistické kněze, aby podpořili jejich vládu.\n\nDynastii Segara se však toto spojenectví nepodařilo proměnit v takovou autoritu, jakou lze spatřit jinde, a vládne panství, které stojí stejnou měrou na kmenové věrnosti jako na náboženských obřadech.\n\n#bold Bude Indra pokračovat na cestě k vybudování mandaly, nebo se vrátí ke svým kořenům a přijme způsoby kmenových států ostrova?#!"
 bookmark_mandalas_867_padumaraja: "Padumarádža"
 bookmark_mandalas_867_padumaraja_subheading: "Sdač Haripundžaji"
 bookmark_mandalas_867_padumaraja_desc: "Malý mónský městský stát Haripundžaja zatím není tak slibný jako vzkvétající metropole Pugam či Angkor a navzdory své výhodné poloze mezi těmito panstvími často zastával úlohu podřízeného vazala.\n\nPadumarádža je posledním příslušníkem dynastie Haripundžaja, která má velké ambice, ale dosud nedokázala získat významnější postavení.\n\n#bold Bude Padumarádža konečně tím, kdo pozvedne svou dynastii k bohům?#!"
 bookmark_mandalas_867_lokapala: "Lókapála"
 bookmark_mandalas_867_lokapala_subheading: "Rádža Mataramu"
 bookmark_mandalas_867_lokapala_desc: "Lókapála ovládl celou východní část Jávy a nyní ji z velké části spravuje přímo. Západní část ostrova však nadále odvádí tribut konkurenčním císařům Šrívidžaji.\n\n#bold Je osudem Sandžajů rozšířit svou vládu i na ostatní ostrovy? Nebo nakonec skončí jako okrajový poplatný stát námořní říše Šrívidžaja?#!"
 bookmark_mandalas_867_pyinbya: "Pjinbja"
 bookmark_mandalas_867_pyinbya_subheading: "Rádža Pugamu"
 bookmark_mandalas_867_pyinbya_desc: "Pugam, jedno z několika soupeřících měst v údolí Iravádí, je nyní regionální mocností s rozsáhlou sítí poplatných států.\n\nPjinbja z Pugamu pochází z dlouhé řady místních králů, právě on však proměnil město v panství s velkými ambicemi.\n\n#bold Promění Pjinbja Pugam ve velkolepé hlavní sídlo, kterým je předurčen se stát?#!"
 bookmark_mandalas_867_tanet: "Tanet"
 bookmark_mandalas_867_saladu: "Saladu"
