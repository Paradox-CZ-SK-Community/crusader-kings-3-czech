 bookmark_merchants_sun_zhong: "Sun Čung" # todo: NEW TRANSLATION
 bookmark_merchants_sun_zhong_subheading: "Obchodník z Ming-čou" # todo: NEW TRANSLATION
 bookmark_merchants_sun_zhong_desc: "Přístav v Ming-čou je místem, kde se říše Sung setkává s východním mořem, a Sun Čung se stal mužem, který se stará o to, aby v něm bylo rušno. Hedvábí a porcelán z jeho skladů putují do Japonska a Korja; opačným směrem přichází kadidlo a stříbro. Úředníci, kteří z tohoto obchodu vybírají daně, už poznali, že dobře načasovaný dar vyjde levněji než hlášení.\n\n#bold Východní pobřeží Hedvábné stezky je přístav, nikoli karavanní cesta. Dokážeš učinit jméno Sunů proudem, který žádný dvůr neodkloní?#!" # todo: NEW TRANSLATION
 bookmark_merchants_vitale_faliero: "Vitale Faliero" # todo: NEW TRANSLATION
 bookmark_merchants_vitale_faliero_subheading: "Patricij z Benátek" # todo: NEW TRANSLATION
 bookmark_merchants_vitale_faliero_desc: "Rod Faliero patří k nejambicióznějším benátským obchodním rodům a Vitale posunul své podnikání dále na východ, než se jeho soupeři odvažují. Byzantské obchodní cesty, normanský tlak v Jaderském moři i závistiví rivalové v městských radách na něj doléhají ze všech stran.\n\n#bold Benátky leží na křižovatce dvou světů. Dokážeš jméno Falierů dovést k nadvládě nad oběma?#!" # todo: NEW TRANSLATION
 bookmark_merchants_wuhsha_al_dallala: "Wuhsha „Prostřednice“" # todo: NEW TRANSLATION
 bookmark_merchants_wuhsha_al_dallala_subheading: "Prostřednice z Káhiry" # todo: NEW TRANSLATION
 bookmark_merchants_wuhsha_al_dallala_desc: "Jako žena nesmírného bohatství si Wuhsha al-Dallala pečlivě hlídá nejen své jmění, ale i své nepřátele.\n\nJejí nezávislá povaha ji stála vyloučení ze synagogy. Wuhsha však umí být trpělivá a vyčkává na příležitost pomstít se těm, kdo jí ublížili.\n\n#bold Máš na to využít půjčky k pokoření svých protivníků?#!" # todo: NEW TRANSLATION
