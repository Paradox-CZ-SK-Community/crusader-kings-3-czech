 bm_1066_merchants: "Obchodní tepny" # todo: NEW TRANSLATION
 bm_1066_merchants_desc: "Aby panství vzkvétalo, musí se nejen uživit, ale také udržovat proud zboží v pohybu. Vždyť vládce nevyhrává velká tažení jen díky svému původu — jsou to zlaté mince, za které pořídí zbraně, proviant a zahraniční pomoc, jež posílí jeho vojska.\n\nZa každým obchodem a každou uzavřenou dohodou stojí kupci, kteří vysílají karavany a lodě po legendárních trasách. A pokud se jim nedostane uznání, jaké si zaslouží, vydobudou si vlastní místo a dají vzniknout novému typu města, jemuž budou vládnout jeho vlastní občané.\n\n#bold Když se bohatství stane měřítkem moci, povedeš svou rodinu k ovládnutí trhu a vybudování trvalé obchodní říše?" # todo: NEW TRANSLATION
