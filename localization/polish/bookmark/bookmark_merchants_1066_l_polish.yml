 bookmark_merchants_bookmark_wuhsha_al_dallala_5_desc: "" # todo: NEW TRANSLATION
 bookmark_merchants_nattal_sahu: "Nattal Sahu" # todo: NEW TRANSLATION
 bookmark_merchants_nattal_sahu_subheading: "Obchodní kníže z Dillí" # todo: NEW TRANSLATION
 bookmark_merchants_nattal_sahu_desc: "Na tržištích v Joginipuru budí jméno Sahu respekt. Nattal, vůdce džinistické obchodní obce v Dillí a důvěryhodný rádce tomarského krále Anangapala II., vybudoval obchodní síť sahající od západních přístavů až po tržiště v Bengálsku.\n\n#bold Dokážeš s důvěrou krále a důvtipem obchodníka vybudovat něco, co přetrvá oba?#!" # todo: NEW TRANSLATION
 bookmark_merchants_new_merchant_company: "Vlastní postava" # todo: NEW TRANSLATION
 bookmark_merchants_new_merchant_company_subheading: "Obchodník na Hedvábné stezce" # todo: NEW TRANSLATION
 bookmark_merchants_new_merchant_company_desc: "Hedvábná stezka nepatří císařům a králům. Patří těm, kdo se po ní odváží vydat.\n\nZalož vlastní obchodní společnost na křižovatce Východu a Západu. Buduj obchodní říši karavanu po karavaně a navazuj spojení od tržišť Samarkandu až po přístavy Středomoří.\n\n#bold Bude jméno tvé rodiny znít ve stovce měst?#!" # todo: NEW TRANSLATION
