 bm_1178_merchants: "Guelfové a ghibellini" # todo: NEW TRANSLATION
 bm_1178_merchants_desc: "Konflikt mezi guelfy a ghibelliny se schyloval už dlouho. Začal sporem o investituru na konci 11. století a doutnal celé století.\n\nZa vlády císaře Fridricha Barbarossy se konflikt vyostřil a celá Itálie si nyní vybírá stranu. Ghibellini stojí při císaři, guelfové při papeži v Římě.\n\n#bold Konflikt zuří uvnitř italských republik i mezi nimi. Vyber si stranu a doveď ji k vítězství.#!" # todo: NEW TRANSLATION
 bookmark_merchants_1178_marco_sanudo: "Marco Sanudo" # todo: NEW TRANSLATION
 bookmark_merchants_1178_marco_sanudo_subheading: "Benátský patricij" # todo: NEW TRANSLATION
 bookmark_merchants_1178_enrico_dandolo: "Enrico Dandolo" # todo: NEW TRANSLATION
 bookmark_merchants_1178_marco_sanudo_desc: "Rodina Sanudů patří k nejstarším šlechtickým rodinám v Benátkách a údajně je spřízněna s legendárním rodem Candiano, jehož příslušníci zastávali úřad dóžete mnohokrát, když rodina dosáhla vrcholu své moci.\n\nMarco je mladým dědicem, který stanul v čele rodu po smrti svého otce. Má blízko ke svému strýci Enricovi Dandolovi, muži, který se do dějin zapíše jako strůjce čtvrté křížové výpravy.\n\n#bold Naplníš svůj osud a staneš se vévodou Archipelagu?#!" # todo: NEW TRANSLATION
 bookmark_merchants_1178_humbert_savoy: "Humbert III. Savojský" # todo: NEW TRANSLATION
 bookmark_merchants_1178_humbert_savoy_subheading: "Vévoda Savojský #b #bol (guelf)#!#!" # todo: NEW TRANSLATION
 bookmark_merchants_1178_thomas_savoy: "Thomas" # todo: NEW TRANSLATION
 bookmark_merchants_1178_humbert_savoy_desc: "Humbert, vévoda Savojský, se prokázal jako zbožný muž: štědře přispíval místním klášterům a po smrti své třetí manželky se na čas zcela stáhl ze světského života.\n\nPoté, co se přidal ke guelfům, se dostal do sporu s Fridrichem Barbarossou a jeho země byly zabaveny i vypleněny.\n\n#bold Dokážeš ochránit savojské země před císařem?#!" # todo: NEW TRANSLATION
 bookmark_merchants_1178_guido_guerra: "Guido Guerra III." # todo: NEW TRANSLATION
 bookmark_merchants_1178_guido_guerra_subheading: "Hrabě z Casentina #color_yellow #bol (ghibellin)#!#!" # todo: NEW TRANSLATION
 bookmark_merchants_1178_rinaldo_guidi: "Rinaldo" # todo: NEW TRANSLATION
 bookmark_merchants_1178_guido_guerra_desc: "Guidiové jsou hrabata v horním povodí Arna už po staletí a jen málokterý toskánský rod se může pochlubit delší rodovou linií.\n\nGuido Guerra strávil celý život ve službách císaře: účastnil se obléhání Milána a Barbarossova privilegium potvrzuje jeho hrady, práva i doly na obou svazích Apenin.\n\n#bold Dokážeš zařídit, aby se tvé hrabství zapsalo do dějin?#!" # todo: NEW TRANSLATION
 bookmark_merchants_1178_speronella_dalesmanni: "Speronella Dalesmanni" # todo: NEW TRANSLATION
 bookmark_merchants_1178_speronella_dalesmanni_subheading: "Patricijka z Padovy #b #bol (guelfka)#!#!" # todo: NEW TRANSLATION
 bookmark_merchants_1178_ezzelino_ii: "Ezzelino da Romano" # todo: NEW TRANSLATION
 bookmark_merchants_1178_pietro_iii: "Pietro Traversari" # todo: NEW TRANSLATION
 bookmark_merchants_1178_speronella_dalesmanni_desc: "Když byla Speronella ještě dospívající dívkou, unesl ji císařský vikář Padovy Pagano della Torre. Když ji její bratr nakonec osvobodil, vikáře svrhli a po jeho pádu se Padova stala svobodnou komunou.\n\n#bold Dokážeš jako svobodná žena proměnit svůj legendární věhlas v politickou moc nebo bohatství?#!" # todo: NEW TRANSLATION
 bookmark_merchants_1178_konrad_urslingen: "Konrad von Urslingen" # todo: NEW TRANSLATION
 bookmark_merchants_1178_konrad_urslingen_subheading: "Vévoda Spoleta #color_yellow #bol (ghibellin)#!#!" # todo: NEW TRANSLATION
 bookmark_merchants_1178_jutta_urslingen: "Jutta" # todo: NEW TRANSLATION
 bookmark_merchants_1178_konrad_urslingen_desc: "Mladý německý vévoda vládnoucí italskému vévodství z císařovy vůle, Konrad drží Spoleto v srdci Apeninského poloostrova, kde se kříží všechny cesty ze severu na jih. Jeho moc spočívá v císařově přízni, císař však sídlí daleko, na druhé straně Alp.\n\n#bold Dokážeš ovládnout srdce Apeninského poloostrova, nebo lidé tvou vládu odmítnou?#!" # todo: NEW TRANSLATION
