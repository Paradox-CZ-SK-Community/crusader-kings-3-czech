l_polish:
 bm_1066_nomads: "Před branami"
 bm_1066_nomads_desc: "Od nepaměti putují národy napříč stepmi a po nesčetné generace žijí kočovným způsobem života. Nyní však do jejich domoviny proniká okolní svět. Říše usedlých národů posouvají své hranice každým rokem dál a dál.\n\n#bold Lze příliv osadníků odvrátit? Měli by kočovníci zavrhnout svůj způsob života? Ve městech a na statcích mohou národy stepi nalézt nový život... pokud však nadejde nový věk velkých dobyvatelů, staré způsoby mohou být zachráněny!#!"
 bookmark_nomads_cumans: "Chán Saru z Kumánie"
 bookmark_nomads_cumans_subheading: "$BOOKMARK_SUBHEADING_KHAN$"
 bookmark_nomads_cumans_desc: "Saru, který teprve nedávno usedl do sedla, velí ohromným hordám Kumánie. Za jejími hranicemi leží bohatá knížectví zralá k dobytí, má však Saru dost schopností, aby udržel hordu jednotnou pro další výboje?\n\nKumánie může být rozlehlá, ale její lidé mohou být stejnou měrou přítěží jako výhodou – každý, koho je třeba živit, má také vlastní stejně nenasytné ambice.\n\n#bold Dokážeš držet své sousedy při zemi a své postavení vysoko, zatímco pojedeš v čele kumánské hordy?#!"
 bookmark_nomads_keraits: "Vrchní náčelník Inanč"
 bookmark_nomads_keraits_subheading: "$BOOKMARK_SUBHEADING_HIGH_CHIEFTAIN$"
 bookmark_nomads_keraits_margus: "Margus"
 bookmark_nomads_keraits_hongji: "Kagan Chung-ťi"
 bookmark_nomads_keraits_desc: "Nestoriánští misionáři, kteří byli před dvěma staletími vypovězeni z Číny výnosem císaře Wu-cunga, nalezli mezi Kerejty vnímavé posluchače. Kerejtský vládce Inanč, poháněný ctižádostí a vírou, se nyní snaží shromáždit národy stepi pod svým praporcem – praporcem završeným křížem.\n\n#bold Sjednoť kočovníky východu a rozšiř nestoriánské vyznání napříč stepmi!#!"
 bookmark_nomads_late_kirghiz: "Kokotoj z Kyrgyzů"
 bookmark_nomads_late_kirghiz_subheading: "$BOOKMARK_SUBHEADING_HIGH_CHIEFTAIN$"
 bookmark_nomads_late_kirghiz_desc: "Pouhá šeptaná zmínka o Kyrgyzech kdysi naháněla hrůzu všem obyvatelům severních stepí. Ty časy jsou však dávno pryč – jejich říše se rozpadla a na severu přežívá jen bledý stín Kyrgyzského kaganátu.\n\n#bold Budou poslední záblesky kyrgyzské slávy uhašeny, nebo může její plamen znovu zářit jasněji než slunce?#!"
 bookmark_nomads_eastern_karakhanids: "Mahmúd z Karluků"
 bookmark_nomads_eastern_karakhanids_subheading: "$BOOKMARK_SUBHEADING_KHAN$"
 bookmark_nomads_eastern_karakhanids_desc: "Hordy Karachánovců – #italic Černých chánů#! – z Transoxanie kdysi ovládaly Hedvábnou stezku, ale časy jejich slávy jsou dávno pryč. Jejich říše je rozdělena mezi rody Alího a Hasana a obě její poloviny nyní soupeří o nadvládu.\n\nAlíovci na východě zavrhli své kočovné dědictví, zatímco Hasanovci na západě zůstávají věrní svým kočovným kořenům.\n\n#bold Karachánovci jsou rozděleni – spočívá budoucnost chanátu v sedle, nebo u přepychového dvora?#!"
 bookmark_nomads_pechenegs: "Tatus z Pečeněhů"
 bookmark_nomads_pechenegs_subheading: "$BOOKMARK_SUBHEADING_KHAN$"
 bookmark_nomads_pechenegs_desc: "Kočovní Pečeněhové jsou obklopeni usedlými národy. Na jihu nabízí rozhádaná byzantská politika příležitosti nájezdníkům i žoldnéřům. Na západě se nyní v Panonii usadili Maďaři – jiní se tam však usadili již před nimi, jen aby je pohltili další nájezdníci. A na severu se knížata Rusi neustále sváří v malicherných sporech.\n\n#bold Veď Pečeněhy do nového věku, rozšiřuj jejich moc a proměňuj je, aby naplnili jakýkoli osud, který je očekává!#!"
