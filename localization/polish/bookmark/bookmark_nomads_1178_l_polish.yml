l_polish:
 bm_1178_nomads: "Nekonečné nebe"
 bm_1178_nomads_desc: "Stěhování kočovného národa je neuvěřitelnou podívanou – živoucí a hemžící se moře lidí a dobytka, které překonává ohromné vzdálenosti při hledání pastvin.\n\nZdánlivě nekonečný dusot kopyt jejich stád zní jako válečný buben a připomíná usedlým sousedům, že hordy mohou kdykoli udeřit! Vždyť čím jsou takové putující kmeny, ne-li vojsky věčně na pochodu?\n\n#bold Svět obdělávaných zemí čeká jako zralá kořist na každého náčelníka, který má dost odvahy zmocnit se jeho bohatství. Vyvedeš svůj kmen za nekonečné pláně a vybuduješ ze sedla vlastní říši?#!"
 bookmark_nomads_togrul: "Vrchní náčelník Togrul"
 bookmark_nomads_togrul_subheading: "$BOOKMARK_SUBHEADING_HIGH_CHIEFTAIN$"
 bookmark_nomads_togrul_oghuul: "Oghuul"
 bookmark_nomads_togrul_desc: "Vražda nevlastních bratrů sice Togrulovi vynesla vládu nad Kerejty, udržet si ji však dokázal pouze díky svému příteli a spojenci Jesügejovi. Dvakrát byl Togrul vyhnán a dvakrát jej Jesügej navrátil k moci.\n\nPotřetí se to však stát nemůže, neboť Jesügej je mrtev, zavražděn soupeřícím kmenem, a Togrulovi nepřátelé si jsou zániku jeho ochránce až příliš dobře vědomi.\n\n#bold Tví nepřátelé kolem tebe krouží jako vlci – kde však najdeš sílu je všechny odrazit?#!"
 bookmark_nomads_temujin: "Vrchní náčelník Temüdžin"
 bookmark_nomads_temujin_subheading: "$BOOKMARK_SUBHEADING_HIGH_CHIEFTAIN$"
 bookmark_nomads_temujin_borte: "Börte"
 bookmark_nomads_temujin_hoelun: "Höelün"
 bookmark_nomads_temujin_desc: "[Concept( 'story_content_temujin', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_temujin', '$bm_story_content_available_copy|q$' )|E]\nTemüdžin se narodil s krevní sraženinou v pravé ruce – znamením mimořádného osudu. Přestože je stále mladý, již čelil těžkým zkouškám: vraždě svého otce, krutému hladu a zajetí soupeřícími kmeny. Jeho odhodlání však zůstává nezlomené a nyní pod svým praporem shromažďuje odvážné jezdce.\n\n#bold Ať se země otřásá pod hromovým dusotem kopyt tvých nekonečných hord a celý svět se skloní před tvou vůlí!#!"
 bookmark_nomads_jamukha: "Náčelník Džamucha"
 bookmark_nomads_jamukha_subheading: "$BOOKMARK_SUBHEADING_CHIEFTAIN$"
 bookmark_nomads_jamukha_desc: "[Concept( 'story_content_jamukha', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_jamukha', '$bm_story_content_available_copy|q$' )|E]\nDžamucha je sám o sobě obávaným válečníkem, ale nástrahami dětství prošel s Temüdžinovou pomocí a společně vytvořili pouto pevnější než pokrevní svazky. Jeho vrozená hrdost se doplňuje s Temüdžinovou rostoucí touhou po moci... v otázkách vůdcovství se však oba shodnou jen málokdy.\n\n#bold Meči Altaje, podrobíš si svého #EMP andu#!, nebo zahyneš v jeho stínu?#!"
 bookmark_nomads_koncek: "Chán Končak"
 bookmark_nomads_koncek_subheading: "$BOOKMARK_SUBHEADING_KHAN$"
 bookmark_nomads_koncek_kotyan: "Koťan"
 bookmark_nomads_koncek_svoboda: "Svoboda"
 bookmark_nomads_koncek_desc: "Od Černého moře až po Altinské pustiny znají jeho jméno všichni. Sjednotit Kumány pod jediným praporem nebylo snadné, vládnout těmto nestálým zemím a projevovat toleranci nezbytnou k udržení moci je však ještě těžší.\n\nKnížata Rusi se znovu snaží pošpinit jeho pověst a stárnoucí Končak se musí připravit na nadcházející boje, neboť žádný chán nemůže vládnout věčně.\n\n#bold Tví příbuzní na tebe spoléhají. Dokážeš je udržet sjednocené, nebo tvůj lid znovu podlehne rozbrojům a chaosu?#!"
 bookmark_nomads_inanch_bilge: "Chán Inanč Bilge"
 bookmark_nomads_inanch_bilge_subheading: "$BOOKMARK_SUBHEADING_KHAN_WITH_THE$"
 bookmark_nomads_inanch_bilge_gurbesu: "Gürbesu"
 bookmark_nomads_inanch_bilge_tayang: "Tajang Slabý"
 bookmark_nomads_inanch_bilge_desc: "Inanč Bilge se hlásí k bájnému původu od biblických mudrců a svůj vznešený rodokmen prokázal vybojováním nezávislosti na Kara Kitaji.\n\nČeká jej však chmurný osud: chánův syn a dědic Tajang se v bitvě střetne s mocným Temüdžinem a podlehne mu. Jeho žena Gürbesu pak dožije jako konkubína vítěze...\n\n#bold Dokážeš se tomuto osudu vzepřít a zajistit pevné následnictví? Nebo slabost tvého syna odsoudí tvou pokrevní linii k věčné hanbě?#!"
 bookmark_nomads_duolubu: "Náčelník Tuo-lu-pu"
 bookmark_nomads_duolubu_subheading: "$BOOKMARK_SUBHEADING_CHIEFTAIN$"
 bookmark_nomads_duolubu_wolila: "Wo-li-la"
 bookmark_nomads_duolubu_desc: "Tuo-lu-pu, kdysi oddaný bagatur Kara Kitaje, se stal obětí zrady vlastní krve. Jeho žena skončila mrtvá poté, co spočinula v náručí jeho vlastního bratra, a její synovec nyní sedí na trůně.\n\nZatímco jeho otec leží na smrtelné posteli, čas k činu se přiblížil. Pokud mladého Č’-lu-ku nelze přesvědčit, možná nastal čas zcela jej opustit.\n\n#bold Tvé nejtemnější dny jsou za tebou a slunce znovu vychází. Dokážeš získat zpět svou čest, nebo budeš navždy znám jako pošetilec?#!"
 bookmark_nomads_wolila: "Náčelník Wo-li-la"
 bookmark_nomads_wolila_subheading: "$BOOKMARK_SUBHEADING_CHIEFTAIN$"
 bookmark_nomads_wolila_zhilugu: "Kagan Č’-lu-ku"
 bookmark_nomads_wolila_desc: "Wo-li-la měl dva silné syny. První, neochvějný Tuo-lu-pu, Usmiřitel východu, se oženil s císařovnou Kara Kitaje. Druhý, proradný Pchu-ku-c’, se stal jejím milencem. Manželka a bratr společně zosnovali Tuo-lu-puovu smrt. Wo-li-la, rozzuřený jejich bratrovraždou, postavil milence před spravedlnost a poslal je na smrt. Č’-lu-ku z rodu Jie-lü si poté našel cestu na trůn Kara Kitaje.\n\n#bold Ke Kitancům se blíží poslední bouře. Dokážeš promluvit za svůj lid, znovu hájit svou čest a změnit jeho osud?#!"
