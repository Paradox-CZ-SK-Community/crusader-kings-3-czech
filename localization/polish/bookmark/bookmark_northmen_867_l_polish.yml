l_polish:
 bm_867_northmen: "Hněv Seveřanů"
 bm_867_northmen_desc: "Před dvěma lety nechal northumbrijský král Ælla svrhnout velkého vikinského hrdinu Ragnara Lodbroka do hadí jámy, kde měl zemřít. Když se to Ragnarovi synové dozvěděli, vypluli do Anglie, aby svého otce pomstili.\n\nBratři si od té doby vybudovali pevné opěrné body v Yorku a na Ostrovech. Anglosaští králové prohráli jednu bitvu za druhou – jejich budoucnost vypadá vskutku pochmurně.\n\nVeškerá naděje však ještě není ztracena a velký hrdina může stále obrátit běh dějin.\n\n#bold Podrobíš celou Anglii severské nadvládě, nebo vyženeš Velké pohanské vojsko z anglosaské půdy?#!"
 bookmark_northmen_halfdan_whiteshirt: "Halfdan Bílá košile"
 bookmark_northmen_halfdan_whiteshirt_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_northmen_halfdan_whiteshirt_desc: "První vlna invaze proběhla pro Halfdana Bílou košili velmi dobře. S pomocí svého bratra Ivara vyrval York z rukou krále Ælly. A zmocní se ještě mnohem více.\n\n#bold Vydáš se ve stopách dějin a vykonáš krvavou pomstu, nebo Halfdanovi vytyčíš novou cestu?#!"
 bookmark_northmen_halfdan_whiteshirt_alt_gudfrid: "$GuT_friT_$"
 bookmark_northmen_halfdan_whiteshirt_alt_saga: "$Saga$ $nick_the_truthspeaker$"
 bookmark_northmen_ivar_the_boneless: "Ivar Bezkostý"
 bookmark_northmen_ivar_the_boneless_subheading: "$BOOKMARK_SUBHEADING_DEFAULT_WITH_THE$"
 bookmark_northmen_ivar_the_boneless_desc: "Pověsti praví, že Ivar má slabé tělo, nikdo však nemůže tvrdit, že má slabého ducha. Lstivostí a sebejistotou sjednotil pod svým praporem velké množství severských válečných družin a na těchto cizích březích dosáhl velkých vítězství. Ani největší Viking však nedokáže oklamat smrt. Roku 870 Ivar navždy zmizí z dějin...\n\n#bold Dokážeš zvítězit v Ivarových válkách a udržet jej naživu, aby mohl vládnout ještě mnoho let?#!"
 bookmark_northmen_ivar_the_boneless_alt_barid: "$Barid$"
 bookmark_northmen_ivar_the_boneless_alt_barid_desc: "Alternativní popis"
 bookmark_northmen_ivar_the_boneless_alt_sigfroth: "$SigfroT_$"
 bookmark_northmen_ivar_the_boneless_alt_sigfroth_desc: "Alternativní popis"
 bookmark_northmen_sigurdr_snake_in_the_eye: "Sigurd Hadí oko"
 bookmark_northmen_sigurdr_snake_in_the_eye_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_northmen_sigurdr_snake_in_the_eye_desc: "Zatímco jeho bratři odpluli do Anglie vykonat svou pomstu, Sigurd Hadí oko zůstal doma, aby vládl zemím svého zesnulého otce. Ragnar Lodbrok mu nastavil laťku velmi vysoko.\n\n#bold Sigurdovi potomci budou po více než století králi Dánska, Norska a Anglie. Dokážeš naplnit osud jeho dynastie?#!"
 bookmark_northmen_sigurdr_snake_in_the_eye_alt_knud: "$Knud$"
 bookmark_northmen_sigurdr_snake_in_the_eye_alt_knud_desc: "Alternativní popis"
 bookmark_northmen_sigurdr_snake_in_the_eye_alt_alof: "$Alof$"
 bookmark_northmen_sigurdr_snake_in_the_eye_alt_alof_desc: "Alternativní popis"
 bookmark_northmen_bjorn_ironside: "Björn Železný bok"
 bookmark_northmen_bjorn_ironside_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_northmen_bjorn_ironside_desc: "Björn prožil život pravého severského dobrodruha. Jako obávaný nájezdník plenil společně se svým přítelem Hæsteinnem z Nantes Francii, Iberii i Itálii. Nyní se síly Skandinávie shromažďují k dalšímu útoku na britské břehy.\n\n#bold Ačkoli se Björn zavázal pomstít v Anglii smrt svého otce, jeho potomci budou po následující dvě století vládnout Švédsku. Na kterém břehu Severního moře leží tvůj osud?#!"
 bookmark_northmen_bjorn_ironside_alt_ingrid: "$Ingrid$"
 bookmark_northmen_bjorn_ironside_alt_ingrid_desc: "Alternativní popis"
 bookmark_northmen_bjorn_ironside_alt_eirikr: "$Eirikr$"
 bookmark_northmen_bjorn_ironside_alt_eirikr_desc: "Alternativní popis"
 bookmark_northmen_earl_alfred: "Earl Alfréd"
 bookmark_northmen_earl_alfred_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_northmen_earl_alfred_desc: "Zatímco Vikingové postupují stále dále na jih, dorsetský earl Alfréd připravuje svá vojska.\n\nV následujících letech Alfréd vybojuje proti Seveřanům mnoho bitev a ukončí jejich invazi. Až zdědí trůn po svém bratrovi, stane se jedním z největších anglických králů v dějinách.\n\n#bold Naplníš Alfrédův velkolepý osud, nebo tě Velké pohanské vojsko rozdrtí?#!"
 bookmark_northmen_earl_alfred_alt_aethelred: "$E_thelred$"
 bookmark_northmen_earl_alfred_alt_aethelred_desc: "Alternativní popis"
 bookmark.0002.t: "[Select_CString( ROOT.Char.IsFemale, 'Veliká', 'Veliký' )]"
 bookmark.0002.desc: "Když mě vazal poprvé pozdravil zvoláním „Ať žije [ROOT.Char.GetFirstNameNoTooltip] [Select_CString( ROOT.Char.IsFemale, 'Veliká', 'Veliký' )]!“, hluboce mě to poctilo. Dál jsem se tím [Select_CString( ROOT.Char.IsFemale, 'nezabývala', 'nezabýval' )], ale od onoho dne si toto přízvisko získává stále větší oblibu.\n\nKamkoli přijdu, od [capital.GetNameNoTooltip] až po [province.GetNameNoTooltip], mí poddaní mi nyní říkají [ROOT.Char.GetFirstNameNoTooltip] [Select_CString( ROOT.Char.IsFemale, 'Veliká', 'Veliký' )]."
 bookmark.0002.a: "Modlím se, abych je nikdy [Select_CString( ROOT.Char.IsFemale, 'nezklamala', 'nezklamal' )]."
 bookmark.0004.t: "Pomsta"
 bookmark.0004.desc_unknown: "Když přede mě přivedou [prisoner.Custom2('MyCharacterIntroduction', ROOT.Char)], okamžitě se vrhne k mým nohám a prosí mě o odpuštění za to, že #EMP [Select_CString( prisoner.IsFemale, 'zabila', 'zabil' )] osobu, která pro mě byla [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('dead'))]#!?!\n\n„Já... [Select_CString( prisoner.IsFemale, 'myslela', 'myslel' )] jsem, že to víš! Zapomeň, že jsem něco [Select_CString( prisoner.IsFemale, 'řekla', 'řekl' )],“ nervózně se směje. „Když mě zajali, [Select_CString( prisoner.IsFemale, 'musela', 'musel' )] jsem se uhodit do hlavy. Nebo tak něco. Nevím, o čem mluvím!“\n\nKdyž jsem se dozvěděl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] o smrti [dead.GetNamePossessive] ([ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('dead'))]), přísahal[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsem, že se pomstím. A jsem [ROOT.Char.GetWomanMan], [Select_CString( ROOT.Char.IsFemale, 'která', 'který' )] drží slovo."
 bookmark.0004.desc: "Konečně, po celé té době, mám [prisoner.Custom2('InsultAdjective', ROOT.Char)] [prisoner.GetName] ve své moci! Když jsem se dozvěděl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] o smrti [dead.GetNamePossessive] (#EMP [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('dead'))]#!) z [prisoner.GetHerHis] rukou, přísahal[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsem, že se pomstím. A jsem [ROOT.Char.GetWomanMan], [Select_CString( ROOT.Char.IsFemale, 'která', 'který' )] drží slovo."
 bookmark.0004.a.custom: "Každý [Concept('close_family_member','blízký člen rodiny')|E] postavy [dead.GetShortUIName]"
 bookmark.0004.a: "Z jeho žeber udělám krvavá křídla!"
 bookmark.0004.b: "[Select_CString( prisoner.IsFemale, 'Tato', 'Tento' )] [prisoner.GetWomanMan] patří tobě, mocný [ROOT.Char.GetFaith.HighGodName]!"
 bookmark.0004.c: "Pro [Select_CString( prisoner.IsFemale, 'ni', 'něj' )] mám jiné plány..."
