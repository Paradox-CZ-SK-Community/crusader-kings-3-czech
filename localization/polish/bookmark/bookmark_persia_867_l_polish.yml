l_polish:
 bm_867_persia: "Íránské intermezzo"
 bm_867_persia_desc: "Uplynulo dvě stě let od chvíle, kdy Rášidský chalífát dobyl Persii a pohltil rozlehlou náhorní plošinu do mocné Arabské říše.\n\nDvě stě let poroby – vše se však časem obrací.\n\nNyní páni Arábie slábnou, zatímco prastará perská šlechta sílí a vzkvétá jako už po staletí ne, neboť kdysi všemocná a jednotná islámská umma se tříští.\n\nNa západě ovládá Abbásovský chalífát už jen srdce někdejší Rášidské říše. Jeho mocní místodržitelé od Iberie až po Indii jsou nezávislí ve všem kromě jména a nástupnictví uvízlo v anarchické změti zrady, vražd a povstání.\n\nNa východě islámští dobrodruzi a žoldnéři, které od Persie odděluje Hindúkuš, lačně hledí na bohatství Rádžasthánu a Dillí.\n\nPersie stojí na rozcestí. Stoupenci chalífy se střetávají s posledními vyznavači zoroastrismu a buddhismu, ctižádostiví váleční páni se sváří s horskými náčelníky a turečtí žoldnéři měří síly s arabskými nájezdníky.\n\n#Bold Svět se otáčí – kam zavede #Italic tebe?#!"
 bookmark_persia_amir_yaqub: "Emír Ja'kúb"
 bookmark_persia_amir_yaqub_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_persia_amir_yaqub_desc: "Ja'kúb, syn obyčejného mědikovce, se vypracoval vlastními silami a zohavení ranou meče jej nijak nezpomalilo ani nezastavilo.\n\nPoté, co si v Sístánu vydobyl rozsáhlé království, nyní válčí s Táhirovcem, dávnými chalífovými přisluhovači. Doma si titíž velitelé, kteří podpořili Ja'kúbovu uzurpaci, šeptají o další změně stran.\n\n#bold Zdá se, že jsi připraven ukovat Persii nový osud – odvážíš se postavit přetrvávající moci Abbásovců?#!"
 bookmark_persia_yaqub_alt_amr: "Amr ibn al-Lajs"
 bookmark_persia_yaqub_alt_sebuk_eri: "Sebük-eri"
 bookmark_persia_ismail_samani: "Ismá'íl Sámání"
 bookmark_persia_ismail_samani_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_persia_ismail_samani_desc: "Ismá'ílův rod po celá desetiletí ovládal místodržitelství v Transoxanii. Rozpad chalífátu roztříštil ústřední moc a Sámánovci se začali mezi sebou přít o vládu.\n\nMladý Ismá'íl dostává příležitost ucházet se o moc, když je přijat za vládce Buchary, kterou nedávno vyplenila vojska obávaných chórezmšáhů ze západu. Navzdory jeho mimořádnému nadání od něj zbytek rodiny očekává naprostou poslušnost a věrnost.\n\n#bold Dokážeš překonat své bratry a obnovit slávu Persie?"
 bookmark_persia_ismail_alt_nasr: "Emír Nasr"
 bookmark_persia_muhammad_ibn_abdallah: "Muhammad ibn Abdalláh"
 bookmark_persia_muhammad_ibn_abdallah_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_persia_muhammad_ibn_abdallah_desc: "Muhammad je dokonalý a zkušený správce, který po celou svou dlouhou kariéru věrně sloužil Abbásovcům jako místodržitel Iráku, Svatých měst, a dokonce i samotného Bagdádu.\n\nNedávné nepokoje však prověřily i jeho politický důvtip, neboť poté, co se postavil na stranu nesprávného chalífy, jen těsně unikl smrti. Nyní mu navíc začíná slábnout zdraví.\n\n#bold Strávíš soumrak svého života podporou sužovaného synovce, emíra Chorásánu, nebo se zaměříš na napravení pověsti svého rodu v očích chalífy?#!"
 bookmark_persia_muhammad_ibn_abdallah_alt_caliph: "Chalífa al-Mu'tazz"
 bookmark_persia_muhammad_ibn_abdallah_alt_muhammad_ibn_tahir: "Muhammad ibn Táhir"
 bookmark_persia_rostam: "Rostam I."
 bookmark_persia_rostam_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_persia_rostam_desc: "Rostamův rod se může chlubit původem, jemuž se ve známém světě vyrovná jen málokdo. Jeho otcovská linie patří k posledním Sásánovcům, zatímco jeho žena odvozuje svůj původ od téměř tisícileté arménské dynastie Arsakovců.\n\nStaré dynastie a prastará vyznání dobře přežívají v hornatém Tabaristánu, kde dajlamští horští páni lpějí na křivdách předávaných po celé generace a mnozí, včetně Rostama, se stále vyrovnávají s „novou“ nadvládou islámu nad dávnými tradicemi.\n\n#bold Dokážeš obnovit úctyhodnou slávu svého dědictví, nebo přijmeš současný svět?#!"
 bookmark_persia_rostam_alt_hasan: "Hasan Misionář"
 bookmark_persia_rostam_alt_shervin: "Šarvín"
 bookmark_persia_suri_of_mandesh: "Súrí z Mandeše"
 bookmark_persia_suri_of_mandesh_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_persia_suri_of_mandesh_desc: "Súrí jako poslední buddhistický vládce západně od Indu stojí na rozcestí. Jeho země bohaté na stříbro a železo by se snadno mohly stát jádrem mocné říše, to však stejně dobře jako on vědí i lační váleční páni Chorásánu na severu a Makránu na jihu.\n\nSúrí, potomek dávných králů Guzgánu, pociťuje tíhu odkazu a tlak současné politiky silněji než většina ostatních.\n\n#bold Dokážeš sjednotit svárlivé afghánské kmeny a ubránit své prastaré duchovní dědictví, nebo nakonec přijmeš vůli Alláha?#!"
 bookmark_persia_suri_of_mandesh_alt_farhana: "Farhána z Bámjánu"
 bookmark_persia_suri_of_mandesh_alt_abdullah: "Abdalláh ibn Umar"
 war_Azariqa_Rebellion: "Povstání azáriků"
