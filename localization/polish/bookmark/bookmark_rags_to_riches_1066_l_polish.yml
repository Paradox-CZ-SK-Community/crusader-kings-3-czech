l_polish:
 bm_1066_rags_to_riches: "Z nuzáka boháčem"
 bm_1066_rags_to_riches_desc: "#V #font:TitleFont #size:20 @legends_of_ck_icon! Legendy Crusader Kings III#!#!#!\n\nPo celé Evropě rody bojují a intrikují o moc. O mnoho zemí se vedou spory, bitvy jsou vyhrávány i prohrávány a dynastie přicházejí a odcházejí, když jsou jejich vládci přelstěni.\n\n#bold Staří králové jsou nahrazováni, zatímco nově příchozí sahají po hvězdách. Kým budeš ty?#!"
 bookmark_rags_to_riches_petty_king_murchad: "Místní král Murchad"
 bookmark_rags_to_riches_petty_king_murchad_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_rags_to_riches_petty_king_murchad_desc: "[diplomacy_lifestyle_i] #V #font:TitleFont #size:15 Legenda Crusader Kings III#!#!#!\nNa počátku 11. století velekrálovský titul v Irsku střídavě přecházel do rukou rodu Briain a unikal mu, zatímco irské šlechtické rody válčily o území mezi sebou i proti vikinským osadníkům. Ačkoli Murchad pochází z linie mužů považovaných za předurčené ke kralování, o jeho krátké vládě nad menším územím Munsteru se mnoho neví.\n\n#bold S tvou pomocí by snad mohl některý člen rodu Briain znovu usednout na irský trůn?#!"
 bookmark_rags_to_riches_petty_king_murchad_alt_brian: "$Brian$"
 bookmark_rags_to_riches_petty_king_murchad_alt_bebinn: "$BE_binn$"
 bookmark_rags_to_riches_duchess_matilda: "Vévodkyně Matylda"
 bookmark_rags_to_riches_duchess_matilda_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_rags_to_riches_duchess_matilda_desc: "[learning_lifestyle_i] #V #font:TitleFont #size:15 Legenda Crusader Kings III#!#!#!\nVe spletité mozaice severní Itálie 11. století se Matylda z Canossy po několika nešťastných úmrtích v rodině ujímá vlády nad rozsáhlým panstvím. Pověsti o Matyldině zbožnosti a šeptanda o čarodějnictví dodávají její vládě tajemný nádech.\n\n#bold Dokážeš ochránit její vládu a zajistit, aby rod Canossů přetrval po celé generace v neustále se měnícím prostředí středověké Itálie?#!"
 bookmark_rags_to_riches_emir_yahya: "Emír Jahjá"
 bookmark_rags_to_riches_emir_yahya_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_rags_to_riches_emir_yahya_desc: "[intrigue_lifestyle_i] #V #font:TitleFont #size:15 Legenda Crusader Kings III#!#!#!\nKoncem 11. století vznikne Toledské království, až leónský král ovládne stejnojmenné město. Odstranění emíra Jahjáa a jeho vlivu bude znamenat, že rod Dhunnúnovců ztratí vládu nad oblastí, jíž panoval po celé generace.\n\n#bold Dokážeš manipulací se soupeři a hledáním dalších spojenců vyzvat krále Pyrenejského poloostrova a změnit dějiny rodu Dhunnúnovců?#!"
 bookmark_rags_to_riches_emir_yahya_alt_zahida: "$Zahida$"
 bookmark_rags_to_riches_emir_yahya_alt_yahya2: "$Yahya$"
 bookmark_rags_to_riches_duke_vratislav: "Vévoda Vratislav"
 bookmark_rags_to_riches_duke_vratislav_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_rags_to_riches_duke_vratislav_desc: "[stewardship_lifestyle_i] #V #font:TitleFont #size:15 Legenda Crusader Kings III#!#!#!\nPřemyslovci vládnou Čechám již po staletí. Při následnictví se silně opírali o seniorát, což v případě vévody Vratislava nakonec povede k vážným sporům s jeho bratry.\n\n#bold Aby se Vratislav stal českým králem, bude muset takticky nakládat se všemi svými prostředky, hmotnými i nehmotnými – zvládneš tento úkol?#!"
 bookmark_rags_to_riches_duke_vratislav_alt_judita: "$Judita$"
 bookmark_rags_to_riches_duke_vratislav_alt_ota: "$Ota$ $nick_the_handsome$"
 bookmark_rags_to_riches_duke_robert: "Vévoda Robert"
 bookmark_rags_to_riches_duke_robert_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_rags_to_riches_duke_robert_desc: "[martial_lifestyle_i] #V #font:TitleFont #size:15 Legenda Crusader Kings III#!#!#!\nRobert zahájil svou dráhu jako zloděj a vůdce bandy lapků. Nikdo nepředpokládal, že se tento dobrodružný syn z početné rodiny stane skvělým stratégem a státníkem vládnoucím rozsáhlým zemím – nyní je však mocným vévodou jižní Itálie, připraveným vykročit po cestě dějin, díky níž si Hautevillové udrží opěrný bod na Sicílii po více než sto let.\n\n#bold Dokážeš-li upevnit moc ve svém panství, čeká Sicilské království na svého vládce!#!"
 bookmark_rags_to_riches_duke_robert_alt_bohemond: "$Bohemond$"
 bookmark_rags_to_riches_duke_robert_alt_roger: "$Roger$"
 bookmark.1066.t: "Matyldino manželské dilema"
 bookmark.1066.desc: "Před jedenácti lety má matka [mum.GetFirstName] zosnovala mé zasnoubení s [hunchback.GetFirstNameNicknamed], mým nevlastním bratrem a synem nového manžela mé matky, [hunchbacks_father.GetTitledFirstNameNicknamed].\n\nSpojenectví s [hunchbacks_father.GetPrimaryTitle.GetBaseNameNoTier] je sice výhodné, je to však skutečně budoucnost, kterou Bůh zamýšlí pro vznešený rod [ROOT.Char.GetHouse.GetBaseName]?\n\n#EMP Musím#! jednat, abych ochránila budoucnost své pokrevní linie!"
 bookmark.1066.a: "Ježíš zemřel za naše hříchy; jeden navíc neuškodí."
 bookmark.1066.b: "Budu se mu vyhýbat až do své smrti."
 bookmark.1066.c: "Rozvod sice nepřipadá v úvahu, u papeže však stále něco zmohu..."
 bookmark.1066.d: "Přijímám svůj životní úděl..."
 lineality_warning: "@warning_icon! #X Výběrem [Concept('patrilineal','patrilineárního')|E] [Concept('marriage','sňatku')|E] riskuješ konec hry, protože tvé děti nebudou patřit k tvé [Concept('dynasty','dynastii')|E]!#!"
 bookmark.1066.a_flavor: "[hunchback.GetFirstName] není zrovna obrazem zdraví, stačí mu jen trochu pomoci do hrobu..."
 bookmark.1066.b_flavor: "Pokud se s ním nikdy nesetkám, jeho rod si nebude moci nárokovat mé země."
 bookmark.1066.c_flavor: "Zatažením za správné nitky mohu učinit náš [Concept('matrilineal','matrilineární')|E] [Concept('marriage','sňatek')|E], čímž zajistím, že naše děti budou patřit k mému [Concept('house','rodu')|E] a [Concept('dynasty','dynastii')|E]."
 abandoned_marriage_modifier: "Opuštěné manželství"
 abandoned_marriage_modifier_desc: "Tato postava opustila svého manželského partnera, s nímž je formálně stále sezdaná...\nPřijetí [Concept('marriage','sňatku')|E]: #N -150#!"
 ABANDONED_SPOUSE_MODIFIER: "Máš [GetModifier('abandoned_marriage_modifier').GetNameWithTooltip]: $VALUE|=+0$"
 bookmark.1067.t: "Šeptanda o čarodějnictví"
 bookmark.1067.desc: "Oheň praská a mihotá se, zatímco [witch.GetFirstName] vytahuje ze své brašny svazek. Noční vzduch prostupuje vůně sladkých sušených bylin.\n\n„Svá tajemství obvykle nesděluji zadarmo.“ Upře na mě pohled. „Jako mladá vládkyně a žena máš všechno proti sobě. Toto mé nejcennější vědění ti pomůže obstát ve světě, který by jinak raději viděl tvůj pád.“\n\nTajemná žena se zdá být odhodlaná podělit se o svou moudrost... právě před tím mě však kněží varovali."
 bookmark.1067.a: "Nauč mě všechno, [ROOT.Char.GetFaith.PriestMalePlural] ať se propadnou!"
 bookmark.1067.a_flavor: "@warning_icon! #X Tato možnost ti poskytne [Concept('criminal','zločinné')|E] [Concept('secret','tajemství')|E]!#!"
 bookmark.1067.b: "Ne, tohle je kacířství."
 bookmark.1067.b_flavor: "Stačí mi víra v [ROOT.Char.GetFaith.HighGodName]."
 bookmark.1068.t: "Slovanské marky"
 bookmark.1068.desc: "[GetTitleByKey('d_meissen').GetNameNoTier] a [GetTitleByKey('d_lausitz').GetNameNoTier], jak jen toužím po těch úrodných a prosperujících zemích!\n\nMůj lenní pán [emperor.GetTitledFirstNameNicknamed] mi je přislíbil výměnou za mou věrnost. Vím však, že jsou to jen prázdná slova a [emperor.GetSheHe] mi je nebude moci udělit.\n\nMohu buď přijmout [emperor.GetTitleAsNamePossessiveNoTooltip] slova taková, jaká jsou – jako chválu mého ušlechtilého charakteru a nic víc – nebo mohu vzít věci do vlastních rukou."
 bookmark.1068.a: "Ty země budou mé – silou!"
 bookmark.1068.a_flavor: "Chceš-li připojit [Concept('titles','tituly')|E] ke svému [Concept('realm','panství')|E], budeš pravděpodobně muset zahájit [Concept('war','válku')|E] pomocí [Concept('casus_belli','casus belli')|E] za [Concept('claim','nárok')|E]."
 bookmark.1068.b: "Budu se těšit [emperor.GetTitleAsNamePossessiveNoTooltip] přízni."
 bookmark.1068.b_flavor: "[emperor.GetTitleAsNameNoTooltip], tvůj [Concept('liege','lenní pán')|E], ti bude dlužit [Concept('hook','páku')|E], kterou lze využít k mnoha věcem – například k vynucení výhodného [Concept('marriage','sňatku')|E]."
 bookmark.1069.t: "Můj bratr [jaromir.GetFirstNameNoTooltip]"
 bookmark.1069.desc: "Můj „drahý“ bratr [jaromir.GetFirstName] mi je věčným trnem v oku a při každé příležitosti odporuje mé autoritě.\n\nVůbec se nepodobá mému dobrému příteli [john_monk.GetFirstName] z Břevnova – zbožnému a #EMP nekonfliktnímu#! mnichovi, který mým jménem slouží [ROOT.Char.GetFaith.HighGodName]. Kéž by právě [john_monk.GetFirstNameNoTooltip] sloužil jako můj [jaromir.GetCouncilTitle|U]...\n\nA co kdyby mohl?"
 bookmark.1069.a: "Vyženu [jaromir.GetFirstNameNoTooltip] – [jaromir.GetTitleAsNameNoTooltip] bude odteď [john_monk.GetFirstNameNoTooltip]!"
 bookmark.1069.a_flavor: "Mít [Concept('councillor','rádce')|E] s vysokými [Concept('skills','dovednostmi')|E], který je tvým [Concept('friend','přítelem')|E], je velmi výhodné, protože [Concept('councillor_tasks','úkoly rádce')|E] se dokončí dříve – rozhněvat si [Concept('head_of_faith','hlavu víry')|E] je však vždy riskantní, protože může odmítat tvé žádosti o [Concept('claims','nároky')|E] či [Concept('gold','zlato')|E]."
 bookmark.1069.b: "[jaromir.GetFirstNameNoTooltip] je přece jen rodina... a zlato je hustší než krev."
 bookmark.1069.b_flavor: "Ukončení [Concept( 'rival', 'rivality' )|E] mezi tebou a tvým bratrem výrazně sníží riziko, že se staneš obětí intriky [GetScheme('murder').GetTypeName]."
 bookmark.1069.c: "Musím se věnovat světským záležitostem..."
 bookmark.1069.c_flavor: "Někdy je nejlepší nedělat nic."
 bookmark.1070.t: "Normanská Sicílie"
 bookmark.1070.desc: "Život vévody je příjemnější než život bandity... život krále by mi však vyhovoval ještě více.\n\nZ Boží milosti a milosti svatého Petra vládnu [GetTitleByKey('d_apulia').GetNameNoTier] a [GetTitleByKey('d_calabria').GetNameNoTier] – s pomocí několika #EMP starých přátel#! z dob, kdy jsem býval lapkou, bych však mohl ovládnout celé [GetTitleByKey('k_sicily').GetName]. Bez ohledu na to, co si myslí papež nebo císař.\n\nJe čas pustit se do práce."
 bookmark.1070.a: "Všechno to i mnohem víc bude mé!"
 bookmark.1070.b: "Možná bych se měl držet mimo říši."
 bookmark.1070.c: "Papež i císař si mohou své země nechat..."
 norman_highwaymen: "Normanští lapkové"
 claim_sicily: "Získal jsi [Concept('pressed_claims','prosaditelné nároky')|E] na všechny [Concept('rulers','vládce')|E] nižšího stupně v [GetTitleByKey('k_sicily').GetName]"
 bookmark.1071.t: "Mnich uchazeč"
 bookmark.1071.desc: "„...a proto bys měl podpořit můj nárok na [GetTitleByKey('e_byzantium').GetNameNoTier]!“ pronese mnich a vrhne se přede mnou na zem. „Získáš spojence, kterému můžeš důvěřovat, a veškerou podporu, jakou budeš potřebovat!“\n\nTento mnich je očividný podvodník. Není žádným takzvaným #EMP „nespravedlivě sesazeným císařem Římské říše“#!, ale #EMP je#! užitečný.\n\nJe sice neurozeným rolníkem s vymyšleným nárokem, záminka k válce je však stále záminkou k válce..."
 bookmark.1071.a: "Dosadím ho na trůn v Konstantinopoli!"
 bookmark.1071.b: "Upřímně řečeno si chci pro sebe nárokovat jen několik přístavů..."
 bookmark.1071.c: "Nemohu ti pomoci."
 start_raiktor_war: "Zahájíš [Concept('war','válku')|E] proti [byz_emperor.GetShortUIName], v níž [raiktor.GetShortUIName] uplatní svůj [Concept('claim','nárok')|E] na [GetTitleByKey('e_byzantium').GetNameNoTier] a ty získáš [GetTitleByKey('k_epirus').GetName]"
 start_raiktor_conquest_war: "Zahájíš [Concept('war','válku')|E] proti [byz_emperor.GetShortUIName], abys pro [raiktor.GetShortUIName] dobyl [Concept('counties','hrabství')|E] [GetTitleByKey('c_dyrrachion').GetNameNoTier], [GetTitleByKey('c_avlonas').GetNameNoTier] a [GetTitleByKey('c_buthrotum').GetNameNoTier], načež se stane tvým [Concept('vassal','vazalem')|E]"
 gain_war_troops: "Získáš [Concept('army','vojsko')|E] o #V 3000#! mužích, které se po [Concept('war','válce')|E] rozpustí"
 raiktor_claim_cb: "Raiktorův nárok"
 raiktor_claim_cb_war: "Raiktorův nárok"
 raiktor_claim_cb_name: "Raiktorův „nárok“"
 raiktor_conquest_cb: "Raiktorův „nárok“"
 raiktor_conquest_cb_war: "Raiktorův „nárok“"
 raiktor_conquest_cb_name: "Raiktorův „nárok“"
 you_gain_epirus: "[attacker.GetShortUIName|U] se zmocní [GetTitleByKey('k_epirus').GetName] a všech [Concept('titles','titulů')|E] v něm"
 raiktor_gains_byzantium: "[claimant.GetShortUIName|U] se zmocní [GetTitleByKey('e_byzantium').GetName]"
 hard_raiktor_war: "Toto je obtížná [Concept('war','válka')|E], v níž budeš muset [Concept('occupy','obsadit')|E] velkou část [Concept('de_jure','de iure území')|E] Byzance a porazit její [Concept('armies','vojska')|E], abys zvítězil"
 easy_raiktor_war: "Toto je snazší [Concept('war','válka')|E], v níž [Concept('occupations','okupace')|E] a [Concept('battles','bitvy')|E] poskytnou mnohem více [Concept('war_score','válečného skóre')|E] než obvykle"
 raiktor_vassal_desc: "[vassal_to_be.GetShortUIName] získá [Concept('counties','hrabství')|E] [GetTitleByKey('c_dyrrachion').GetNameNoTier], [GetTitleByKey('c_avlonas').GetNameNoTier] a [GetTitleByKey('c_buthrotum').GetNameNoTier] a stane se tvým [Concept('vassal','vazalem')|E]"
 raiktor_vassal_backup_desc: "Zmocníš se [Concept('counties','hrabství')|E] [GetTitleByKey('c_dyrrachion').GetNameNoTier], [GetTitleByKey('c_avlonas').GetNameNoTier] a [GetTitleByKey('c_buthrotum').GetNameNoTier]"
 guiscard_modifier: "Guiscard"
 guiscard_modifier_desc: "Tato postava je mimořádně lstivá a nelítostná."
 bookmark.1072.t: "Dobytí Córdoby"
 bookmark.1072.desc: "Ach, překrásná [GetTitleByKey('c_cordoba').GetNameNoTier]! Někdejší sídlo chalífské moci v [GetTitleByKey('e_spain').GetNameNoTier] za vlády Umajjovců. Kořist hodná úsilí každého vládce.\n\nNyní se musím rozhodnout – spolehnu se na vojenskou sílu, nebo využiji svou lstivost a zaseji v jejich řadách nespokojenost?\n\nPřístup, který zvolím, budu používat od této chvíle."
 bookmark.1072.a: "Války se vyhrávají slovy a dobře umístěnými dýkami..."
 bookmark.1072.b: "Musím se spolehnout na vojsko."
 bookmark.1072.c: "[GetTitleByKey('c_cordoba').GetNameNoTierNoTooltip] může počkat."
 start_cordoba_war: "Zahájíš [Concept('war','válku')|E] proti [cordoba_holder.GetShortUIName], abys dobyl [Concept('county','hrabství')|E] [GetTitleByKey('c_cordoba').GetNameNoTier] #weak (a také [GetTitleByKey('c_cabra').GetNameNoTier], pokud je [cordoba_holder.GetSheHe] drží)#!"
 intrigue_challenge: "Pokaždé, když vyhlásíš [Concept('war','válku')|E], musí tvůj protivník uspět v [Concept('intrigue','pletichářském')|E][intrigue_i] souboji proti tobě, jinak získá [GetModifier('hampered_by_false_information_modifier').GetNameWithTooltip] [Concept('modifier','modifikátor')|E]"
 hampered_by_false_information_modifier: "Zmatení falešnými zprávami"
 hampered_by_false_information_modifier_desc: "Vojska této postavy jsou matena proudem nepravdivých informací, které jim podsouvají nepřátelští zvědové."
 armies_hampered: "Vojska zmatena"
 armies_unhampered: "Vojska nezmatena"
 intrigue_duel_on_attack_effect.success: "[attacker.GetShortUIName|U] mate [defender.GetShortUINamePossessive] [Concept('armies','vojska')|E]"
 intrigue_duel_on_attack_effect.failure: "[attacker.GetShortUIName|U] nedokáže zmást [defender.GetShortUINamePossessive] [Concept('armies','vojska')|E]"
