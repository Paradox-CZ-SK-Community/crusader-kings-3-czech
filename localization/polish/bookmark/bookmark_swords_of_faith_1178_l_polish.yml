l_polish:
 bm_1178_swords_of_faith: "Meče víry"
 bm_1178_swords_of_faith_desc: "Poháněni náboženským zápalem a příslibem duchovních i světských odměn táhli knížata i chuďasové na východ ve jménu Boha, zlata a věčné slávy.\n\nJejich svatá válka jim vydobyla Jeruzalémské království a nyní, téměř o století později, jejich dědicové bojují o zachování odkazu křižáků tváří v tvář tak mocným muslimským mocnářům, jako je Saláh ad-Dín Júsuf, nový egyptský sultán.\n\n#bold Toto je věk křížových výprav, na rozhraní náboženské horlivosti a světské ctižádosti. Zvol svou cestu moudře, neboť jaká odměna je větší než samotná Svatá země?#!"
 bookmark_swords_of_faith_saladin: "Saláh ad-Dín Júsuf"
 bookmark_swords_of_faith_saladin_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_swords_of_faith_saladin_saphadin: "Sajf ad-Dín Ahmad"
 bookmark_swords_of_faith_saladin_ali: "Alí"
 bookmark_swords_of_faith_saladin_desc: "Poslední vezír Fátimovců se dosud ukázal jako energický a schopný nástupce dynastie, kterou svrhl, navzdory nedávné porážce z rukou mladého malomocného jeruzalémského krále.\n\nAčkoli jej abbásovský chalífa formálně ustanovil sultánem Egypta a Sýrie, dokud potomci křižáků tvrdošíjně lpí na výbojích svých předků, jeho království nebude nikdy skutečně úplné.\n\n#bold Dokážou Ajjúbovci porazit Jeruzalémské království a získat zpět Svatou zemi, nebo přijde pád této nové dynastie stejně náhle jako její vzestup?#!"
 bookmark_swords_of_faith_sibylla: "Princezna Sibyla"
 bookmark_swords_of_faith_sibylla_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_swords_of_faith_sibylla_baudouin: "Jeruzalémský král Balduin"
 bookmark_swords_of_faith_sibylla_baudouin_son: "Balduin"
 bookmark_swords_of_faith_sibylla_desc: "Jeruzalémské království již ve svých krátkých dějinách poznalo jednu královnu a zdá se, že brzy pozná další. Sibylin bratr, král Balduin, vládne navzdory svému malomocenství schopně, je však jen otázkou času, než si nemoc vyžádá jeho život.\n\nSibyla je mladou vdovou a uznanou dědičkou svého bratra, o její ruku se proto dychtivě uchází mnozí a silné spojenectví by výrazně upevnilo její postavení.\n\n#bold Postavení Jeruzaléma je nebezpečné a jeho králi nezbývá mnoho času. Dokážeš usednout na trůn a zajistit, aby království nejen přežilo, ale také vzkvétalo?#!"
 bookmark_swords_of_faith_levon: "Hrabě Levon"
 bookmark_swords_of_faith_levon_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_swords_of_faith_levon_roupen: "Kníže Rupen z Kilikie"
 bookmark_swords_of_faith_levon_desc: "Smrt již dvakrát udeřila na Levonovu rodinu. Nejprve si přišla pro jeho otce, oběť byzantské zrady, a poté se vrátila pro jeho strýce, tyranského odpadlíka, jehož zavraždili vlastní dvořané ze strachu, že se sami stanou dalšími oběťmi jeho krutosti.\n\nNyní v Kilikii vládne Levonův starší bratr Rupen, muž světecké povahy, který stojí v čele zmijího hnízda intrik a ctižádosti. Možná je jen otázkou času, než smrt udeří potřetí.\n\n#bold Dokážeš překonat dědictví rodinných svárů a učinit z Kilikie svébytné království?#!"
 bookmark_swords_of_faith_gokbori: "Muzaffar ad-Dín Gökböri"
 bookmark_swords_of_faith_gokbori_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_swords_of_faith_gokbori_ghazi: "Sajf ad-Dín Ghází"
 bookmark_swords_of_faith_gokbori_yusuf: "Zajn ad-Dín Júsuf"
 bookmark_swords_of_faith_gokbori_desc: "Gökböri, zbavený otcovského dědictví a vypovězený do exilu ve prospěch mladšího bratra, propůjčil svůj meč a odvahu zengíovskému knížeti a vysloužil si nové léno v Harránu.\n\nSvému novému lennímu pánovi slouží neochvějně, kníže však leží sražen nemocí, kterou zřejmě nepřežije. Gökböri dobře ví, že věrnost musí mít své meze a nejistá budoucnost často zvěstuje nové příležitosti.\n\n#bold Egyptský sultán ukázal, jak vysoko může vystoupat muž obdařený vůlí a schopnostmi. Dokážeš kráčet v jeho stopách a založit vlastní dynastii?#!"
 bookmark_swords_of_faith_raimon: "Vévoda Raimond"
 bookmark_swords_of_faith_raimon_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_swords_of_faith_raimon_eschiva: "Eschiva"
 bookmark_swords_of_faith_raimon_desc: "Nizárijští asasíni připravili Raimonda v útlém věku o otce. Od svých sedmnácti let bojoval proti turkmenským nájezdníkům, najímal korzáry k plenění byzantských břehů a přetrpěl téměř deset let zajetí v zengíovském žaláři.\n\nPo propuštění byl přirozenou volbou na regenta dětského krále Balduina, tento mladý malomocný však již dospěl a Raimond se vrátil na své statky, aby rozjímal nad budoucností království i svou vlastní.\n\n#bold Zakusil jsi královskou moc a vzdal ses jí, nadále však zůstáváš oporou království. Jak naložíš se svým vlivem?#!"
 bookmark.0300.t: "Syn svého otce?"
 bookmark.0300.desc: "Můj zesnulý manžel [dead_husband.GetFirstName] zemřel několik měsíců před narozením našeho syna. Toto dítě nikdy nepozná svého otce a od otcových příbuzných ho dělí nemalá vzdálenost.\n\nJakkoli byl jeho otec štědrý a statečný, naše manželství #italic bylo#! krátké a jeho jméno zde mnoho neznamená...\n\nMá-li [baby_baudouin.GetFirstName] jednou nosit korunu, možná by mu prospělo, kdybych nechala vzpomínku na jeho otce vyblednout a místo toho ho vychovala v tradicích svého vlastního královského rodu."
 bookmark.0300.a: "Vychovám [baby_baudouin.GetFirstNameNoTooltip], aby se považoval především za člena rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 bookmark.0300.b: "Ne, měli bychom ctít [dead_husband.GetFirstNamePossessiveNoTooltip] památku."
 bookmark.0300.b.tt: "#warning @warning_icon! Po této volbě bude tvým [Concept('player_heir','dědicem')|E] postava z jiné dynastie!#!"
