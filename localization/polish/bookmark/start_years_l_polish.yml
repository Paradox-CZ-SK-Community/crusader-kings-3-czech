l_polish:
 start_year_1178_10_01_desc: "Léta Páně 1178 je věk křížových výprav již v plném proudu. Na trůně křižáckého Jeruzalémského království sedí malomocný král Balduin, jehož panství čeká stejně nejistá budoucnost jako jeho samotného, zatímco se nový egyptský sultán Saláh ad-Dín připravuje jednou provždy získat zpět Svatou zemi. Byzantská říše mezitím na severu čelí ztrátě vlády nad Anatolií a blížící se vyhlídce, že na její trůn poprvé po téměř čtyřech desetiletích usedne nový císař, se všemi pletichami, které to obnáší."
 start_year_1066_09_15_desc: "Návrat Halleyovy komety zvěstuje bouřlivý rok 1066, kdy po celém světě propukají velké konflikty. Zatímco Seldžukové pronikají stále hlouběji do byzantských zemí a Sinhálci na Srí Lance povstávají proti svým utlačovatelům, v Anglii vypukla otevřená válka, v níž se tři uchazeči snaží získat korunu pro sebe. Na rozdrobeném Pyrenejském poloostrově panuje silné napětí, neboť kmenoví vládci hledí na proměnlivou rovnováhu sil na kontinentu se stejnou měrou strachu i chamtivosti."
 start_year_867_01_01_desc: "Léta Páně 867 severští nájezdníci terorizují pobřeží a říční břehy, zatímco Evropa zůstává rozdělena mezi Karlovce. Na Indickém subkontinentu již po celá desetiletí doutná trojstranný boj mezi dynastiemi Pratihárů, Pálů a Ráštrakútů, konflikt je však stále teprve v počátcích."
 bm_group_867: "867"
 bm_group_1066: "1066"
 bm_group_1178: "1178"
