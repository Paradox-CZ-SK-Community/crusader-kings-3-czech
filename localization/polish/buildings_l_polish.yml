 special_building_improve_silk_road: "Po dokončení tato [Concept('special_building','zvláštní budova')|E] posune [Concept('situation_sub_region','oblast situace')|E] [sub_region_temp.GetName] blíže k [Concept('situation_phase','fázi situace')|E] [situation_silk_road_phase_exceptional_bounty|E] [silk_road|E] #weak (pokud se v ní již nenachází)#!"
 building_type_herat_bazaar_01: "$herat_bazaar_01$" # todo: CHANGED (predtym: $building_herat_bazaar_01$)
 building_type_herat_bazaar_01_desc: "$herat_bazaar_01_desc$" # todo: CHANGED (predtym: $building_herat_bazaar_01_desc$)
 herat_bazaar_01: "Herátský bazar" # todo: NEW TRANSLATION
 herat_bazaar_01_desc: "Rušná tržiště Herátu proslula už za starověkých Achaimenovců, kteří mu říkali #italic Haraiva#!. Karavany, které každý den do města přijíždějí i z něj odjíždějí, učinily z herátských bazarů perlu Chorásánu." # todo: NEW TRANSLATION
 herat_bazaar_02: "Rozlehlý herátský bazar" # todo: NEW TRANSLATION
 herat_bazaar_02_desc: "Herátské bazary překypují obchodem a kupčením. Perla Chorásánu se třpytí jasněji než ten nejvyleštěnější drahokam na jakékoli koruně." # todo: NEW TRANSLATION
 building_type_tabriz_bazaar_01: "$tabriz_bazaar_01$" # todo: NEW TRANSLATION
 building_type_tabriz_bazaar_01_desc: "$tabriz_bazaar_01_desc$" # todo: NEW TRANSLATION
 tabriz_bazaar_01: "Tabrízský bazar" # todo: NEW TRANSLATION
 tabriz_bazaar_01_desc: "Vznešené tržiště v Tabrízu slouží od nepaměti jako významné obchodní centrum. Jeho zdi zdobí pestrobarevné dlaždice a tónovaná omítka, které odrážejí bohatství a prestiž tohoto starobylého tržiště." # todo: NEW TRANSLATION
 tabriz_bazaar_02: "Rozlehlý tabrízský bazar" # todo: NEW TRANSLATION
 tabriz_bazaar_02_desc: "Věk nepřipravil vznešené a starobylé tržiště Tabrízu o žádnou z jeho předností; zdá se, že proslulý bazar je naopak živější než kdy dřív." # todo: NEW TRANSLATION
 building_type_gurganj_bazaar_01: "$gurganj_bazaar_01$" # todo: NEW TRANSLATION
 building_type_gurganj_bazaar_01_desc: "$gurganj_bazaar_01_desc$" # todo: NEW TRANSLATION
 gurganj_bazaar_01: "Bazar v Gurgandži" # todo: NEW TRANSLATION
 gurganj_bazaar_01_desc: "Rušné město Gurgandž, brána do stepi, je proslulé množstvím obchodníků a cestovatelů, kteří na pomezí hledají zisk či štěstí." # todo: NEW TRANSLATION
 gurganj_bazaar_02: "Rozlehlý bazar v Gurgandži" # todo: NEW TRANSLATION
 gurganj_bazaar_02_desc: "Pod žhnoucím sluncem si nomádi, kupci a dobrodruzi vydělávají na živobytí a za exotické mince císaře Chuang-tiho si šeptem předávají zprávy o bohatství vzdálené Číny." # todo: NEW TRANSLATION
 building_type_lhasa_market_01: "$lhasa_market_01$" # todo: CHANGED (predtym: $building_lhasa_market_01$)
 building_type_lhasa_market_01_desc: "$lhasa_market_01_desc$" # todo: CHANGED (predtym: $building_lhasa_market_01_desc$)
 lhasa_market_01: "Lhaský khrom" # todo: NEW TRANSLATION
 lhasa_market_01_desc: "Na významné křižovatce mezi Indií a Čínou se lhaský kupci předhánějí v upoutávání pozornosti cestovatelů ve stínu majestátního paláce Potála." # todo: NEW TRANSLATION
 lhasa_market_02: "Rozlehlý lhaský khrom" # todo: NEW TRANSLATION
 lhasa_market_02_desc: "Pod sluncem není nic nového — alespoň to tvrdí lhaský kupci. Prý už spatřili všechny cetky a drahokamy, které po Hedvábné stezce putují." # todo: NEW TRANSLATION
 building_type_changan_market_01: "$changan_market_01$" # todo: CHANGED (predtym: $building_changan_market_01$)
 building_type_changan_market_01_desc: "$changan_market_01_desc$" # todo: CHANGED (predtym: $building_changan_market_01_desc$)
 changan_market_01: "Tržiště Čchang-anu" # todo: NEW TRANSLATION
 changan_market_01_desc: "Na tržištích velkoměsta Čchang-anu, #EMP Věčného míru#!, to žije obchodem všeho druhu. Jsou nepostradatelnou zastávkou téměř veškerého zboží, které proudí do Číny i z ní." # todo: NEW TRANSLATION
 changan_market_02: "Rozlehlé tržiště Čchang-anu" # todo: NEW TRANSLATION
 changan_market_02_desc: "Bohaté kupce v Čchang-anu už pohled na největší poklady známé lidstvu nepřekvapí — všechny už viděli a několik jich nejspíš sami vlastní." # todo: NEW TRANSLATION
 building_type_dunhuang_market_01: "$dunhuang_market_01$" # todo: CHANGED (predtym: $building_dunhuang_market_01$)
 building_type_dunhuang_market_01_desc: "$dunhuang_market_01_desc$" # todo: CHANGED (predtym: $building_dunhuang_market_01_desc$)
 dunhuang_market_01: "Tržiště Tun-chuangu" # todo: NEW TRANSLATION
 dunhuang_market_01_desc: "Město Tun-chuang leží na třpytivých březích řeky Šu-le a tvoří vstupní bránu mezi koridorem Che-si a Tarimskou pánví. Je důležitou zastávkou pro všechny cestovatele mezi těmito oblastmi." # todo: NEW TRANSLATION
 dunhuang_market_02: "Rozlehlé tržiště Tun-chuangu" # todo: NEW TRANSLATION
 dunhuang_market_02_desc: "Sluncem vybělenými ulicemi Tun-chuangu se pomalu a vytrvale ubírají nesčetné naložené velbloudy, mezci i lidé a jejich cesty se neustále kříží na východ i na západ." # todo: NEW TRANSLATION
 building_type_lahur_bazaar_01: "$lahur_bazaar_01$" # todo: CHANGED (predtym: $building_lahur_bazaar_01$)
 building_type_lahur_bazaar_01_desc: "$lahur_bazaar_01_desc$" # todo: CHANGED (predtym: $building_lahur_bazaar_01_desc$)
 lahur_bazaar_01: "Láhaurský bazar" # todo: NEW TRANSLATION
 lahur_bazaar_01_desc: "Staré město Láhaur vyrostlo kolem dvou hlavních tržišť, obklopených domy a uzavřených za dlouhou hliněnou hradbou. Tento rušný shluk tržišť pulzuje životem, kam až lidská paměť sahá, a nejspíš bude žít dál po celé generace." # todo: NEW TRANSLATION
 lahur_bazaar_02: "Rozlehlý láhaurský bazar" # todo: NEW TRANSLATION
 lahur_bazaar_02_desc: "Obchod proudí Láhaurem tak přirozeně jako voda korytem řeky. Jeho tržiště překypují zbožím a v bystrých očích kupců jako by se skrývala veškerá moudrost bohaté historie města." # todo: NEW TRANSLATION
 building_type_hamadan_bazaar_01: "Hamadánský bazar"
 building_type_hamadan_bazaar_01_desc: "$hamadan_bazaar_01_desc$" # todo: CHANGED (predtym: $building_hamadan_bazaar_01_desc$)
 hamadan_bazaar_01: "Hamádánský bazar" # todo: NEW TRANSLATION
 hamadan_bazaar_01_desc: "Hamádán, ležící v srdci dávné Médie, je obchodním centrem už od dob hliněných tabulek a klínových nápisů. Stovky generací kupců zde mezi stánky hlavního bazaru nabízely své zboží a provozovaly své řemeslo." # todo: NEW TRANSLATION
 hamadan_bazaar_02: "Rozlehlý hamádánský bazar" # todo: NEW TRANSLATION
 hamadan_bazaar_02_desc: "Velký hamádánský bazar vzkvétá jako nikdy předtím a dosahuje nevídaného bohatství i čilého ruchu, které nemají obdoby v jeho dlouhé a úctyhodné historii." # todo: NEW TRANSLATION
 building_type_sunday_bazaar_01: "Nedělní bazar"
 building_type_sunday_bazaar_01_desc: "$sunday_bazaar_01_desc$" # todo: CHANGED (predtym: $building_sunday_bazaar_01_desc$)
 sunday_bazaar_01: "Nedělní bazar" # todo: NEW TRANSLATION
 sunday_bazaar_01_desc: "Někteří místní vám řeknou, že Kašgar měl Nedělní bazar ještě předtím, než lidé začali používat peníze. Při procházce mezi stánky to tak opravdu působí — je těžké představit si, že by toto místo někdy neexistovalo." # todo: NEW TRANSLATION
 sunday_bazaar_02: "Rozlehlý nedělní bazar" # todo: NEW TRANSLATION
 sunday_bazaar_02_desc: "Kašgarský velký Nedělní bazar možná existuje od nepaměti, ale na dnešní blahobyt se bude jistě vzpomínat ještě po celé věky." # todo: NEW TRANSLATION
 building_type_mount_fuji_01: "Hora Fudži"
 building_type_mount_fuji_01_desc: "Osamělý, vysoký a sněhem pokrytý vrchol Fudžisanu označuje cestu do východního Japonska a je proslulý po celých ostrovech. Přitahuje cestovatele i poutníky a všem, kdo na něj pohlédnou, přináší pokoj. Fudži patří mezi nejposvátnější šintoistické hory a je domovem #EMP Konohanasakuja-hime#!, bohyně sopek, třešňových květů a pomíjivé křehkosti života."
 mount_fuji_01: "$building_type_mount_fuji_01$" # todo: NEW TRANSLATION
 mount_fuji_01_desc: "$building_type_mount_fuji_01_desc$" # todo: NEW TRANSLATION
 building_type_waterworks_01: "Vodní hospodářství"
 building_type_waterworks_01_desc: "Voda je základem, na němž závisí veškerý život. Stálý přísun vody a její účinné využívání jsou nezbytné pro udržení silného panství i pevné vlády."
 waterworks_01: "Uměle vytvořené rybníky" # todo: NEW TRANSLATION
 building_waterworks_01_desc: "Prvním krokem ke správě vody je mít vůbec nějakou vodu, kterou lze spravovat. Prostá prohlubeň v zemi vyložená jílem proti prosakování vytváří přirozené místo, kde se může voda shromažďovat pro pozdější použití."
 building_waterworks_02: "Cisterny"
 building_waterworks_02_desc: "Hlubší jámy, méně propustné obložení a prosté zastřešení umožňují déle uchovávat větší množství vody s menšími ztrátami způsobenými znečištěním či odpařováním."
 building_waterworks_03: "Vodní kanály"
 building_waterworks_03_desc: "Příkopy vyhloubené mezi zásobárnami zpřístupňují spravovanou vodu mnohem většímu počtu lidí. Při nadbytku vody zmírňují záplavy, za sucha zásobují lidi, dobytek i úrodu. Při správném plánování mohou sloužit také lehké lodní dopravě."
 building_waterworks_04: "Zavlažovací nádrže"
 building_waterworks_04_desc: "Jakýkoli kopec, hřeben či výškový rozdíl lze pomocí vhodných náspů proměnit v místo pro zadržování vody. Tyto otevřené nádrže propojené kanály se mohou navzájem napájet a poskytují větší kontrolu nad tím, kolik vody je v danou chvíli uchováváno a využíváno."
 building_waterworks_05: "Schodišťové studny"
 building_waterworks_05_desc: "Správu vody lze spojit s běžným hloubením studní a vytvořit tak mohutné stavby zapuštěné do země, které mají vždy přístup k podzemní vodě. Tyto podzemní budovy lze propojit se stavidly a kanály na povrchu, které do nich podle potřeby přivádějí další vodu nebo ji odvádějí jinam."
 building_waterworks_06: "Plavební komory"
 building_waterworks_06_desc: "Pomocí bran a výpustí lze řídit i samotnou hloubku vodní cesty. Voda zadržovaná za těmito komorami umožňuje využívat kanály pro čluny a malé lodě, což z nich činí vynikající dopravní tepny."
 building_waterworks_07: "Umělá jezera"
 building_waterworks_07_desc: "Monumentální nádrž dokáže pojmout monumentální množství vody. Umělá jezera napájená řekami a kanály mohou zásobovat rozsáhlá pole i množství vesnic. Jejich velkolepost jim navíc propůjčuje vlastní prestiž a činí z nich vhodná místa pro bohoslužby i výkon vlády."
 building_waterworks_08: "Vodovodní a kanalizační soustavy"
 building_waterworks_08_desc: "Pomocí potrubí a čerpadel může voda proudit vzhůru i dolů, zásobovat nejvyšší věže a odplavovat splašky do nejvzdálenějších žump. Žádné místo nemusí trpět nedostatkem vody a každý přebytek lze odvést dříve, než způsobí nebezpečnou povodeň."
 building_type_spice_plantation_01: "Plantáže koření"
 building_type_spice_plantation_01_desc: "Nejjemnější vůně a nejdelikátnější chutě lze získat z rostlin, které rostou pouze v několika vybraných oblastech světa. Jejich vzácnost a kvalita činí jejich pěstování nesmírně výnosným, pokud jim půda dokáže poskytnout vhodné podmínky."
 building_spice_plantation_01: "Sběr koření"
 building_spice_plantation_01_desc: "Koření přirozeně poskytují různé stromy, keře a květiny. Nejtěžší je tyto rostliny vůbec #italic najít#!."
 building_spice_plantation_02: "Pěstované háje koření"
 building_spice_plantation_02_desc: "Nejžádanější druhy koření lze pěstovat za vhodných podmínek, s dostatkem správně vedených pracovníků a pod dohledem schopných správců."
 building_spice_plantation_03: "Sady koření"
 building_spice_plantation_03_desc: "Geometricky uspořádaná výsadba na rozsáhlé ploše umožňuje rok co rok získávat mnohem předvídatelnější množství koření."
 building_spice_plantation_04: "Sušení koření"
 building_spice_plantation_04_desc: "Vyhrazením prostoru poblíž polí k sušení koření před přepravou lze zpracovat větší část úrody dříve, než se zkazí, a snížit tak celkové výrobní náklady."
 building_spice_plantation_05: "Mlýny na koření"
 building_spice_plantation_05_desc: "Mletí sice zvyšuje náchylnost koření ke zkažení, ale výrazně usnadňuje jeho skladování. Mlýny navíc pomáhají při prosévání a zajišťují mnohem čistší výsledný produkt."
 building_spice_plantation_06: "Kořeninové statky"
 building_spice_plantation_06_desc: "Soustředění obydlí pracovníků, zpracování úrody a skladování výrobků na jediném místě poblíž samotných polí výrazně usnadňuje výrobu i prodej většího množství koření s nižšími celkovými náklady."
 building_spice_plantation_07: "Správa plantážní půdy"
 building_spice_plantation_07_desc: "Samotnou krajinu lze přetvořit a získat tak další půdu pro pěstování. Terasy a kanály vytvářejí nové možnosti pro další úrodu."
 building_spice_plantation_08: "Velkokapacitní výroba koření"
 building_spice_plantation_08_desc: "Při správném vedení lze celou zemi zasvětit produkci nejvýnosnějších druhů koření. Každý vysazený strom, každý pěstovaný keř, každý utržený list a každý usušený ořech znamenají další minci v pokladnici."
 building_type_examination_hall_01: "Zkušební síň"
 building_type_examination_hall_01_desc: "Císařské zkoušky nelze pořádat bez místa, kde by mohly probíhat. Místní guvernér musí zajistit, aby úředníci měli všechny prostředky potřebné k řádnému vedení zkoušek a uchazečům se dostávalo potřebné podpory, aniž by měli příliš mnoho příležitostí podvádět."
 examination_hall_01: "$building_type_examination_hall_01$" # todo: NEW TRANSLATION
 building_examination_hall_01_desc: "K prověřování uchazečů o vládní úřady je zapotřebí místo, kde lze zkoušku vykonat. Samostatná místnost určená ke zkoušení je naprostým základem, ale alespoň představuje začátek."
 examination_hall_02: "$building_type_examination_hall_01$ II" # todo: NEW TRANSLATION
 building_examination_hall_02_desc: "Trocha modlitby může některým uchazečům dodat větší sebedůvěru než veškeré studium a příprava na světě."
 examination_hall_03: "$building_type_examination_hall_01$ III" # todo: NEW TRANSLATION
 building_examination_hall_03_desc: "Komplex přednáškových síní, zkušebních prostor, kanceláří učitelů a skladišť poskytuje veškeré zázemí potřebné k provedení každé části císařských zkoušek s nejvyšší účinností a kvalitou."
 examination_hall_04: "$building_type_examination_hall_01$ IV" # todo: NEW TRANSLATION
 examination_hall_05: "$building_type_examination_hall_01$ V" # todo: NEW TRANSLATION
 examination_hall_effects_desc: "[SelectLocalization( HasDlcFeature( 'all_under_heaven' ), 'examination_hall_effect_desc', 'examination_hall_cost_discount_max_desc' )]"
 examination_hall_effect_desc: "Nižší náklady na pořádání [GetActivityType('activity_imperial_examination').GetTextIcon][GetActivityType('activity_imperial_examination').GetName] a [GetActivityType('activity_local_examination').GetTextIcon][GetActivityType('activity_local_examination').GetName] [Concept('activities','aktivit')|E] v této [Concept('holding','državě')|E]: [EmptyScope.ScriptValue('imperial_examination_cost_discount_max_value')|P0%]"
 examination_hall_cost_discount_max_desc: "$examination_hall_effect_desc$[EmptyScope.ScriptValue('imperial_examination_cost_discount_max_value')|P0%]"
 imperial_examination_cost_discount_examination_hall: "V místě se nachází $building_type_examination_hall_01$"
 building_can_benefit_requirements: "#S Pokud splňuješ požadavky:#!\n"
 rebuilding_grants_full_benefits: "#S Po [Concept('rebuilding','obnově')|El]:#!\n"
 building_requirements_header: "#S Požadavky:#!\n"
 building_fallback: "#S Pokud požadavky nesplňuješ:#!\n"
 building_effects_header: "#S Účinky:#!\n"
 building_type_citadel_shrine_01: "Svatyně citadely"
 building_type_citadel_shrine_01_desc: "$building_type_temple_citadel_01$ není úplná bez místa určeného k uctívání jejího panteonu. Ať už jde o běžné obyvatele, nebo vojáky posádky, posvátnost vyzařující z jejích zdí uklidní každou neklidnou duši."
 building_citadel_shrine_01: "Věž prasáda"
 building_citadel_shrine_01_desc: "Prasáda korunuje $building_type_temple_citadel_01$ a na obzoru vytváří vznešenou siluetu. Věřícím umožňuje obdivovat svatyni již zdaleka."
 building_citadel_shrine_02: "Věž prang"
 building_citadel_shrine_02_desc: "Prang pokrytý jemnými řezbami se zvedá vzhůru v kaskádách stavebních stupňů, které umocňují dojem výšky. Při pronášení modliteb či tichém rozjímání poskytuje očím vítané spočinutí."
 building_citadel_shrine_03: "Sochy božstev"
 building_citadel_shrine_03_desc: "Sbírka soch věčně hledí do prázdna, jako by rozjímala o věčnosti, a ve věřících často vyvolává složité pocity."
 building_citadel_shrine_04: "Sochy sinhů"
 building_citadel_shrine_04_desc: "Tito zuřiví strážní lvi s vyceněnými zuby a upřenými pohledy udělují obyvatelům $building_type_temple_citadel_01$ své ochranné požehnání."
 building_citadel_shrine_05: "Strážní nágové"
 building_citadel_shrine_05_desc: "Tito sedmihlaví hadi, pečlivě vytesaní z pískovce a s důmyslně vyobrazenou mandalou na hrudi, přinášejí obyvatelům svatyně mír a blahobyt."
 building_citadel_shrine_06: "Basreliéfy"
 building_citadel_shrine_06_desc: "Obyvatelé se často zastavují, aby si prohlédli drobné detaily těchto basreliéfů, které zobrazují dramatické bitevní výjevy, různé božské sféry i mýty o stvoření."
 building_citadel_shrine_07: "Relikviáře"
 building_citadel_shrine_07_desc: "Tato $building_type_temple_citadel_01$ ukrývá pokladnici náboženských a obřadních soch i předmětů, jejíž sbírce se žádná jiná nevyrovná."
 building_citadel_shrine_08: "Vyobrazení dévarádži"
 building_citadel_shrine_08_desc: "Božská bytost zachycená v čase v majestátním postoji umožňuje věřícím modlit se, vzdávat jí náležitou úctu a přijímat její požehnání."
 building_type_sacred_pool_01: "Posvátná nádrž"
 building_type_sacred_pool_01_desc: "Takto rozlehlá vodní plocha může sloužit mnoha účelům, ale s během času a střídáním ročních období se její odrazy někdy proměňují ve skutečně transcendentní podívanou. Tyto nádrže poskytují vodu i ochranu a představují důležitou součást každodenního života místních obyvatel."
 sacred_pool_01: "Lotosový rybník" # todo: NEW TRANSLATION
 building_sacred_pool_01_desc: "Harmonický rybník okouzluje návštěvníky svou krásou a pokojem a údajně bývá dějištěm významných duchovních událostí."
 sacred_pool_02: "Posvátná nádrž" # todo: NEW TRANSLATION
 building_sacred_pool_02_desc: "S rostoucí rozlohou přitahuje $sacred_pool_02$ také divokou zvěř. Rostlinstvo a živočichové společně připomínají návštěvníkům koloběh života." # todo: CHANGED (predtym: S rostoucí rozlohou přitahuje $building_sacred_pool_02$ také divokou zvěř. Rostlinstvo a živočichové společně připomínaj)
 building_sacred_pool_03: "Obřadní nádrž"
 building_sacred_pool_03_desc: "Tato vodní plocha slouží k příležitostným obřadům a rituálům a svědčí o rostoucí nádheře svého vládce."
 building_sacred_pool_04: "Vodní příkop"
 building_sacred_pool_04_desc: "Nyní obklopuje místo bohoslužeb a jeho obyvatelé se cítí bezpečněji, protože $building_type_sacred_pool_01$ vytváří opevněnou překážku mezi nimi a případnými nepřáteli."
 building_sacred_pool_05: "Malý baraj"
 building_sacred_pool_05_desc: "Nad barajem bdí množství strážních lvů, kvůli nimž si každý vetřelec dobře rozmyslí, zda se vydá přes jeho klidné vody."
 sacred_pool_06: "Baraj" # todo: NEW TRANSLATION
 building_sacred_pool_06_desc: "$sacred_pool_06$ táhnoucí se od východu k západu nabízí velkolepou podívanou. Nad jeho vnějším obvodem bdí hadí sochy." # todo: CHANGED (predtym: $building_sacred_pool_06$ táhnoucí se od východu k západu nabízí velkolepou podívanou. Nad jeho vnějším obvodem bdí hadí)
 building_sacred_pool_07: "Velký baraj"
 building_sacred_pool_07_desc: "Sochy, kvetoucí rostlinstvo a nádherná scenérie zdobí tuto majestátní vodní plochu, která v obdobích nesnesitelného vedra přináší ochlazení i dostatek vody."
 building_sacred_pool_08: "Posvátný baraj"
 building_sacred_pool_08_desc: "Cestovatelé a další návštěvníci často v úžasu hledí na tuto umělou vodní plochu, jejíž protější břeh je kvůli ohromné šířce sotva viditelný. Je skutečným dokladem božského významu tohoto místa."
 building_type_vihara_halls_01: "Síně viháry"
 building_type_vihara_halls_01_desc: "Tato klášterní budova, vystavěná jako útočiště mnichů během období dešťů, je místem tiché meditace, modliteb a odpočinku. Rozšiřování síní posiluje zdraví a oddanost zdejších věřících."
 vihara_halls_01: "Modlitební svatyně" # todo: NEW TRANSLATION
 building_vihara_halls_01_desc: "Přidání $vihara_halls_01$ poskytuje návštěvníkům místo k uctívání a rozjímání." # todo: CHANGED (predtym: Přidání $building_vihara_halls_01$ poskytuje návštěvníkům místo k uctívání a rozjímání.)
 building_vihara_halls_02: "Knihovna písem"
 building_vihara_halls_02_desc: "Ve zdech knihovny hó traj jsou uchovávána starobylá i nová písma. Příchozí věřící je mohou ve volném čase studovat a prohlubovat své osvícení."
 building_vihara_halls_03: "Kaple s kolonádami"
 building_vihara_halls_03_desc: "Nad kaplemi se tyčí majestátní kolonády, jejichž důmyslné nápisy a různá náboženská vyobrazení obklopují věřící uvnitř."
 building_vihara_halls_04: "Mandapa"
 building_vihara_halls_04_desc: "Ohromná rozloha této sloupové síně je ideální pro pořádání veřejných rituálů a dalších náboženských obřadů."
 building_vihara_halls_05: "Pavilon šála"
 building_vihara_halls_05_desc: "Krása tohoto pavilonu stojícího uprostřed zeleně se vyrovná pouze duchovní atmosféře, která jej obklopuje."
 building_vihara_halls_06: "Kameny síma"
 building_vihara_halls_06_desc: "Hraniční kameny pomáhají správcům $building_type_vihara_halls_01$ vymezit správnou velikost a rozestupy prostorů, které mniši potřebují k řádnému konání bohoslužeb."
 vihara_halls_07: "Zvonice" # todo: NEW TRANSLATION
 building_vihara_halls_07_desc: "Majestátní $vihara_halls_07$ korunuje tyto $building_type_vihara_halls_01$, ve dne odráží sluneční světlo a v noci se rýsuje v dálce." # todo: CHANGED (predtym: Majestátní $building_vihara_halls_07$ korunuje tyto $building_type_vihara_halls_01$, ve dne odráží sluneční světlo a v n)
 building_vihara_halls_08: "Velkolepé síně"
 building_vihara_halls_08_desc: "Pohodlí a vybavení těchto síní přitahují mnichy ze vzdálenějších krajů. Jejich prostřednictvím se shromažďují a šíří učení i myšlenky v neocenitelné síti poznání, která přináší soulad také okolním panstvím."
 building_type_itsukushima_jinja_01: "$itsukushima_jinja_01$" # todo: CHANGED (predtym: $building_itsukushima_jinja_01$)
 building_type_itsukushima_jinja_01_desc: "$itsukushima_jinja_01_desc$" # todo: CHANGED (predtym: $building_itsukushima_jinja_01_desc$)
 itsukushima_jinja_01: "Svatyně Icukušima" # todo: NEW TRANSLATION
 itsukushima_jinja_01_desc: "Galerie svatyně Itsukušima-džindža, založené v 6. století a zasvěcené šintoistickým bohyním moře a bouří, se tyčí nad vodou a hledí ke slavné bráně torii, která jako by se vznášela nad hladinou zálivu Matsushima." # todo: NEW TRANSLATION
 itsukushima_jinja_02: "$itsukushima_jinja_01$" # todo: NEW TRANSLATION
 itsukushima_jinja_02_desc: "$itsukushima_jinja_01_desc$" # todo: NEW TRANSLATION
 building_type_heian_palace_01: "$heian_palace_01$" # todo: CHANGED (predtym: $building_heian_palace_01$)
 building_type_heian_palace_01_desc: "$heian_palace_01_desc$" # todo: CHANGED (predtym: $building_heian_palace_01_desc$)
 heian_palace_01: "Palác Heian" # todo: NEW TRANSLATION
 heian_palace_01_desc: "Rozlehlý palácový komplex, který nechal postavit císař Kammu jako středobod svého velkého města Heian-kjó neboli „Hlavního města míru“, slouží jako sídlo císařského dvora, panovníkova rezidence i ústředních japonských úřadů. Jeho chodby jsou rušnými dějišti obřadů, politiky a pletichářství, kde starobylé aristokratické rody soupeří o vliv." # todo: NEW TRANSLATION
 building_type_ise_jingu_01: "$ise_jingu_01$" # todo: CHANGED (predtym: $building_ise_jingu_01$)
 building_type_ise_jingu_01_desc: "$ise_jingu_01_desc$" # todo: CHANGED (predtym: $building_ise_jingu_01_desc$)
 ise_jingu_01: "Svatyně Ise" # todo: NEW TRANSLATION
 ise_jingu_01_desc: "Ise-džingú je zasvěcena bohyni slunce #EMP Amaterasu#! a patří k nejposvátnějším šintoistickým místům. Uchovávají se v ní císařské insignie Jamato a dohlíží na ni kněžka saigú, vybraná z císařské dynastie." # todo: NEW TRANSLATION
 building_type_kofuku_ji_01: "$kofuku_ji_01$" # todo: CHANGED (predtym: $building_kofuku_ji_01$)
 building_type_kofuku_ji_01_desc: "$kofuku_ji_01_desc$" # todo: CHANGED (predtym: $building_kofuku_ji_01_desc$)
 kofuku_ji_01: "Chrám Kófuku" # todo: NEW TRANSLATION
 kofuku_ji_01_desc: "Kófuku-dži, jehož historie sahá do 7. století, je jedním ze Sedmi velkých chrámů Nary a patří k nejstarším a nejvýznamnějším střediskům buddhistického myšlení a moci v Japonsku." # todo: NEW TRANSLATION
 building_type_enryaku_ji_01: "$enryaku_ji_01$" # todo: CHANGED (predtym: $building_enryaku_ji_01$)
 building_type_enryaku_ji_01_desc: "$enryaku_ji_01_desc$" # todo: CHANGED (predtym: $building_enryaku_ji_01_desc$)
 enryaku_ji_01: "Chrám Enrjaku" # todo: NEW TRANSLATION
 enryaku_ji_01_desc: "Enrjaku-dži, založený koncem 8. století učitelem $SaichO_$, leží na hoře Hiei s výhledem na hlavní město císaře Kammua, Heian-kjó. Je střediskem japonského buddhismu pundarika neboli tendai." # todo: NEW TRANSLATION
 building_type_dazaifu_01: "$dazaifu_01$" # todo: CHANGED (predtym: $building_dazaifu_01$)
 building_type_dazaifu_01_desc: "$dazaifu_01_desc$" # todo: CHANGED (predtym: $building_dazaifu_01_desc$)
 dazaifu_01: "Úřad Dazaifu" # todo: NEW TRANSLATION
 dazaifu_01_desc: "Město Dazaifu je správním střediskem císařského dvora na vzdáleném ostrově Kjúšú. Bylo zřízeno, aby dohlíželo na obranu ostrova, usnadňovalo zámořský obchod a hostilo zahraniční hodnostáře. Správa Dazaifu je častým odrazovým můstkem v kariéře ctižádostivých úředníků." # todo: NEW TRANSLATION
 building_type_chinjufu_01: "$chinjufu_01$" # todo: CHANGED (predtym: $building_chinjufu_01$)
 building_type_chinjufu_01_desc: "$chinjufu_01_desc$" # todo: CHANGED (predtym: $building_chinjufu_01_desc$)
 chinjufu_01: "Oblast Čindžufu" # todo: NEW TRANSLATION
 chinjufu_01_desc: "Čindžufu, původně sídlící v Taze, je opevněným střediskem císařského úsilí o pacifikaci severního Japonska. Dohlíží na něj zvláštní velitel odpovědný za obranu a výběr daní v tomto kraji." # todo: NEW TRANSLATION
 building_type_hakata_port_01: "$hakata_port_01$" # todo: CHANGED (predtym: $building_hakata_port_01$)
 building_type_hakata_port_01_desc: "$hakata_port_01_desc$" # todo: CHANGED (predtym: $building_hakata_port_01_desc$)
 hakata_port_01: "Přístav Hakata" # todo: NEW TRANSLATION
 hakata_port_01_desc: "Přístavní město Hakata na severním pobřeží Kjúšú je už od nejstarších dob Jamato námořní branou do země. Je to rušné středisko pod dohledem nedalekého úřadu Dazaifu, kde obchodníci prodávají zboží z dalekých krajů a diplomatická poselstva vstupují na japonskou půdu." # todo: NEW TRANSLATION
 building_hakata_port_02: "$hakata_port_01$" # todo: CHANGED (predtym: $building_hakata_port_01$)
 building_hakata_port_02_desc: "$hakata_port_01_desc$" # todo: CHANGED (predtym: $building_hakata_port_01_desc$)
 building_type_hwangnyongsa_01: "$hwangnyongsa_01$" # todo: CHANGED (predtym: $building_hwangnyongsa_01$)
 building_type_hwangnyongsa_01_desc: "$hwangnyongsa_01_desc$" # todo: CHANGED (predtym: $building_hwangnyongsa_01_desc$)
 hwangnyongsa_01: "Chrám Hwangnjong" # todo: NEW TRANSLATION
 hwangnyongsa_01_desc: "Hwangnjongsa neboli „Chrám císařského draka“, dokončený v 7. století, je rozlehlý komplex, který nechal vybudovat král Čin-hŭng ze Silly jako středisko buddhistické výuky a moci. Pyšní se jednou z nejvyšších pagod na světě." # todo: NEW TRANSLATION
 building_type_white_deer_grotto_academy_01: "$white_deer_grotto_academy_01$" # todo: CHANGED (predtym: $building_white_deer_grotto_academy_01$)
 building_type_white_deer_grotto_academy_01_desc: "$white_deer_grotto_academy_01_desc$" # todo: CHANGED (predtym: $building_white_deer_grotto_academy_01_desc$)
 white_deer_grotto_academy_01: "Akademie Jeskyně bílého jelena" # todo: NEW TRANSLATION
 white_deer_grotto_academy_01_desc: "Akademie, kterou založil poustevník Li Bo v kraji, kde se volně potulovali bílí jeleni, vzkvétala jako středisko neokonfucianismu." # todo: NEW TRANSLATION
 building_type_shigu_academy_01: "$shigu_academy_01$" # todo: CHANGED (predtym: $building_shigu_academy_01$)
 building_type_shigu_academy_01_desc: "$shigu_academy_01_desc$" # todo: CHANGED (predtym: $building_shigu_academy_01_desc$)
 shigu_academy_01: "Akademie Š’-ku" # todo: NEW TRANSLATION
 shigu_academy_01_desc: "Tato akademie přitahovala učence studující klasická díla v tichých kopcích Chu-nanu. Jako středisko poezie a filosofie přenesla tradice dynastie Tchang do dynastie Sung." # todo: NEW TRANSLATION
 building_type_culai_academy_01: "$culai_academy_01$" # todo: CHANGED (predtym: $building_culai_academy_01$)
 building_type_culai_academy_01_desc: "$culai_academy_01_desc$" # todo: CHANGED (predtym: $building_culai_academy_01_desc$)
 culai_academy_01: "Akademie Cchung-laj" # todo: NEW TRANSLATION
 culai_academy_01_desc: "Učenci si zřídili akademii mezi vrcholky hory Cchung-laj, aby v ústraní studovali konfuciánské texty. Jejími sály se nesly debaty o souladu přírody a správy země." # todo: NEW TRANSLATION
 building_type_lize_academy_01: "$lize_academy_01$" # todo: CHANGED (predtym: $building_lize_academy_01$)
 building_type_lize_academy_01_desc: "$lize_academy_01_desc$" # todo: CHANGED (predtym: $building_lize_academy_01_desc$)
 lize_academy_01: "Akademie Li-ce" # todo: NEW TRANSLATION
 lize_academy_01_desc: "Akademie Li-ce podporuje vzdělanost mezi vodami a rákosinami Che-peje a slouží jako severní bašta konfuciánského řádu uprostřed proměnlivých hranic." # todo: NEW TRANSLATION
 building_type_maoshan_academy_01: "$maoshan_academy_01$" # todo: CHANGED (predtym: $building_maoshan_academy_01$)
 building_type_maoshan_academy_01_desc: "$maoshan_academy_01_desc$" # todo: CHANGED (predtym: $building_maoshan_academy_01_desc$)
 maoshan_academy_01: "Akademie Mao-šan" # todo: NEW TRANSLATION
 maoshan_academy_01_desc: "Akademie vyučuje rituály, meditaci a posvátné texty a představuje duchovní protipól konfuciánských akademií z dob dynastie Sung." # todo: NEW TRANSLATION
 building_type_tiantai_monasteries_01: "$tiantai_monasteries_01$" # todo: CHANGED (predtym: $building_tiantai_monasteries_01$)
 building_type_tiantai_monasteries_01_desc: "$tiantai_monasteries_01_desc$" # todo: CHANGED (predtym: $building_tiantai_monasteries_01_desc$)
 tiantai_monasteries_01: "Kláštery Tchien-tchaj" # todo: NEW TRANSLATION
 tiantai_monasteries_01_desc: "Tato akademie, vzdělávací instituce školy Tchien-tchaj, se specializuje na výuku filosofie a meditace." # todo: NEW TRANSLATION
 building_type_jizu_shan_temples_01: "$jizu_shan_temples_01$" # todo: CHANGED (predtym: $building_jizu_shan_temples_01$)
 building_type_jizu_shan_temples_01_desc: "$jizu_shan_temples_01_desc$" # todo: CHANGED (predtym: $building_jizu_shan_temples_01_desc$)
 jizu_shan_temples_01: "Chrámy Ťi-cu Šan" # todo: NEW TRANSLATION
 jizu_shan_temples_01_desc: "Klášterní komplex v buddhistických horách sloužil jako bašta esoterického buddhismu. Poutníci jej přirovnávali k indickému Supímu vrchu." # todo: NEW TRANSLATION
 building_type_nanhua_temple_01: "$nanhua_temple_01$" # todo: CHANGED (predtym: $building_nanhua_temple_01$)
 building_type_nanhua_temple_01_desc: "$nanhua_temple_01_desc$" # todo: CHANGED (predtym: $building_nanhua_temple_01_desc$)
 nanhua_temple_01: "Chrám Nan-chua" # todo: NEW TRANSLATION
 nanhua_temple_01_desc: "Sídlo šestého patriarchy čchanu Chuej-nenga zůstává živým střediskem čchanského učení." # todo: NEW TRANSLATION
 building_type_byeokran_port_01: "$byeokran_port_01$" # todo: CHANGED (predtym: $building_byeokran_port_01$)
 building_type_byeokran_port_01_desc: "$byeokran_port_01_desc$" # todo: CHANGED (predtym: $building_byeokran_port_01_desc$)
 byeokran_port_01: "Přístav Pjŏngnan" # todo: NEW TRANSLATION
 byeokran_port_01_desc: "Přístav Pjŏngnan, ležící západně od města Kesong u ústí řeky Rjesŏng, je nejpřímější cestou pro zahraniční zboží a cestovatele na Korejský poloostrov. Umožňuje vyhnout se severním hranicím i horským pásmům." # todo: NEW TRANSLATION
 building_type_sado_mines_01: "$sado_mines_02$" # todo: CHANGED (predtym: $building_sado_mines_02$)
 building_type_sado_mines_01_desc: "$sado_mines_01_desc$" # todo: CHANGED (predtym: $building_sado_mines_01_desc$)
 sado_mines_01: "Zlatá naleziště Sado" # todo: NEW TRANSLATION
 sado_mines_01_desc: "Jen málokdo by čekal, že odlehlý ostrov Sado, kdysi místo vyhnanství, pod svým povrchem tajně ukrývá takové bohatství zlata." # todo: NEW TRANSLATION
 sado_mines_02: "Zlatý důl Sado" # todo: NEW TRANSLATION
 sado_mines_02_desc: "Důlní šachty byly rozšířeny a přizváni inženýři, aby se těžba zlata mohla skutečně rozběhnout." # todo: NEW TRANSLATION
 sado_mines_03: "Velký zlatý důl Sado" # todo: NEW TRANSLATION
 sado_mines_03_desc: "Kolem četných důlních šachet vyrostla vesnice a dělníci pravidelně objevují nové zlaté žíly." # todo: NEW TRANSLATION
 sado_mines_04: "Komplex zlatých dolů Sado" # todo: NEW TRANSLATION
 sado_mines_04_desc: "Těžba zlata dosáhla téměř průmyslového rozsahu a počet dělníků se nyní počítá na tisíce. Z dolů jako by proudilo nekonečné bohatství." # todo: NEW TRANSLATION
 building_type_tada_mines_01: "$tada_mines_02$" # todo: CHANGED (predtym: $building_tada_mines_02$)
 building_type_tada_mines_01_desc: "$tada_mines_01_desc$" # todo: CHANGED (predtym: $building_tada_mines_01_desc$)
 tada_mines_01: "Měděná naleziště Tada" # todo: NEW TRANSLATION
 tada_mines_01_desc: "Pod vesnicí Tada, ukrytou v horách Hokusetsu, čeká bohatství drahých kovů na vytěžení. Říká se, že obložení velkého Buddhy v Tódai-dži bylo vytesáno právě zde." # todo: NEW TRANSLATION
 tada_mines_02: "Měděný důl Tada" # todo: NEW TRANSLATION
 tada_mines_02_desc: "Důlní šachty byly rozšířeny a přizváni inženýři, aby se těžba mědi mohla skutečně rozběhnout." # todo: NEW TRANSLATION
 tada_mines_03: "Velký měděný důl Tada" # todo: NEW TRANSLATION
 tada_mines_03_desc: "Kolem četných důlních šachet vyrostla vesnice a dělníci pravidelně objevují nové měděné žíly." # todo: NEW TRANSLATION
 tada_mines_04: "Komplex měděných dolů Tada" # todo: NEW TRANSLATION
 tada_mines_04_desc: "Těžba mědi dosáhla téměř průmyslového rozsahu a počet dělníků se nyní počítá na tisíce. Z dolů jako by proudilo nekonečné bohatství." # todo: NEW TRANSLATION
 building_type_tsushima_mines_01: "$tsushima_mines_02$" # todo: CHANGED (predtym: $building_tsushima_mines_02$)
 building_type_tsushima_mines_01_desc: "$tsushima_mines_01_desc$" # todo: CHANGED (predtym: $building_tsushima_mines_01_desc$)
 tsushima_mines_01: "Stříbrná naleziště Cušima" # todo: NEW TRANSLATION
 tsushima_mines_01_desc: "Ostrov Cušima proslul nalezišti stříbra, která byla objevena koncem 7. století za vlády císaře Temmua. Černé rudy bohaté na galenit vydávají v Japonském moři mnohé bohatství." # todo: NEW TRANSLATION
 tsushima_mines_02: "Stříbrný důl Cušima" # todo: NEW TRANSLATION
 tsushima_mines_02_desc: "Důlní šachty byly rozšířeny a přizváni inženýři, aby se těžba stříbra mohla skutečně rozběhnout." # todo: NEW TRANSLATION
 tsushima_mines_03: "Velký stříbrný důl Cušima" # todo: NEW TRANSLATION
 tsushima_mines_03_desc: "Kolem četných důlních šachet vyrostla vesnice a dělníci pravidelně objevují nové stříbrné žíly." # todo: NEW TRANSLATION
