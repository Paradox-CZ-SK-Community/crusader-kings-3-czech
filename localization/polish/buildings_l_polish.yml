 building_type_kollur_mines_01: "Doly Kollúr"
 building_type_kollur_mines_01_desc: "Doly Kollúr využívají největší diamantovou žílu na celém indickém subkontinentu. Práce je nesmírně nebezpečná, ale bohatství nepředstavitelné."
 building_kollur_mines_01: "Těžební jámy Kollúr"
 building_kollur_mines_01_desc: "V pouhé jámě plné jílu a štěrku ve dne v noci dřou dělníci odění jen do bederních roušek, aby získali diamanty."
 building_kollur_mines_02: "Důl Kollúr"
 building_kollur_mines_02_desc: "Těžební jámy byly rozšířeny a byli přivedeni inženýři, aby bylo možné výrazně zvýšit těžbu diamantů."
 building_kollur_mines_03: "Velký důl Kollúr"
 building_kollur_mines_03_desc: "Kolem četných těžebních jam vyrostla vesnice a dělníci pravidelně nacházejí obrovské diamanty."
 building_kollur_mines_04: "Důlní komplex Kollúr"
 building_kollur_mines_04_desc: "Těžba diamantů dosáhla téměř průmyslového rozsahu a počet dělníků se nyní pohybuje v tisících. Z dolů zdánlivě proudí nekonečné bohatství."
 building_type_tribe_01: "Kmenová tvrz"
 building_type_tribe_01_desc: "Prostá, ale účinná kmenová tvrz, která střeží přilehlou vesnici."
 building_tribe_01: "Kmenová tvrz"
 building_tribe_01_desc: "Tato tvrz vystavěná z klád a hrubě tesaného kamene působí navzdory své malé velikosti impozantně."
 building_tribe_02: "Opevněná kmenová tvrz"
 building_tribe_02_desc: "Opevněná tvrz se inspiruje feudálními hrady a přidává množství nových obranných prvků."
 building_type_longhouses_01: "Sněmovní síně"
 building_type_longhouses_01_desc: "Kmenoví náčelníci, stařešinové i váleční vůdci se při rozhodování radí v dlouhém domě. Mohutné síně přinášejí prestiž každému, kdo shromáždění hostí."
 building_longhouses_01: "Dlouhé domy"
 building_longhouses_01_desc: "Dlouhé domy jsou dostatečně rozlehlé pro významná shromáždění stařešinů. Rozhoduje se zde o zákonech a směřování kmene."
 building_longhouses_02: "Velkolepé síně"
 building_longhouses_02_desc: "Velkolepé síně mají ústřední pódium, z něhož může náčelník či válečný vůdce pronášet strhující projevy."
 building_type_war_camps_01: "Válečné tábory"
 building_type_war_camps_01_desc: "Když je roh povolá do války, shromažďují se zuřiví kmenoví válečníci ve válečných táborech. Dokonce i v časech míru zde svádějí cvičné souboje a připravují se na nevyhnutelný konflikt."
 building_war_camps_01: "Cvičiště soubojů"
 building_war_camps_01_desc: "Cvičební vybavení, arény a dřevěné stěny vymezují prostor cvičiště. Válečníci sem přicházejí zdokonalovat své schopnosti."
 building_war_camps_02: "Válečnické síně"
 building_war_camps_02_desc: "Do válečnické síně smějí vstoupit pouze ti nejlepší bojovníci a už jejich pouhá přítomnost ostatní inspiruje."
 building_type_palisades_01: "Palisády"
 building_type_palisades_01_desc: "Roztroušené kmenové osady chrání několik vrstev dřevěných palisád před prostými hrozbami, jako jsou divoká zvířata či menší nájezdy."
 building_palisades_01: "Prostá palisáda"
 building_palisades_01_desc: "Prosté palisády poskytují omezenou ochranu. Proti drobným střetům jsou účinné, proti početnějším nepřátelům však méně spolehlivé."
 building_palisades_02: "Hradby a příkopy"
 building_palisades_02_desc: "Vnější příkopy spojené s palisádovými hradbami zesílenými kamenem poskytují slušnou ochranu před obléháním."
 building_type_market_villages_01: "Trhy"
 building_type_market_villages_01_desc: "Kolem nejfrekventovanějších cest v této zemi vyrostlo množství malých tržních vesnic. Příslušníci kmenů zde obchodují a směňují zboží s cestujícími kupci."
 building_market_villages_01: "Obchodní stanice"
 building_market_villages_01_desc: "Obchodní stanice poskytují příslušníkům kmenů a obchodníkům místo k setkávání a směně zboží."
 building_market_villages_02: "Tržní vesnice"
 building_market_villages_02_desc: "V určených termínech se v těchto vesnicích konají veřejné trhy, které přitahují obchodníky z celého kraje a zvyšují místní bohatství."
 building_type_water_temples_01: "Vodní chrámy subaku"
 building_type_water_temples_01_desc: "Zavlažovací družstva vhodná pro vnitrozemí se soustřeďují kolem vodních svatyní a chrámů. Obřadní kalendáře určují dobu sázení i údržby kanálů."
 building_water_temples_01: "Jezy a polní svatyně subaku"
 building_water_temples_01_desc: "Malé jezy a zemní kanály propojují rýžová pole a svatyně dohlíží na obětiny i rozdělování práce. Začínají proudit spolehlivé přebytky a s nimi i obřady."
 building_water_temples_02: "Svatyně rady subaku"
 building_water_temples_02_desc: "Několik svatyní koordinuje rozsáhlejší „subak“ a podle kalendáře rozděluje vodu. Spory i opravy se řeší společně, což zlepšuje správu a zvyšuje výnosy."
 building_water_temples_03: "Síť vodních chrámů"
 building_water_temples_03_desc: "Řádná síť vodních chrámů dohlíží na sladění sázení a období úhoru. Ubývá škůdců, rostou výnosy a prohlubuje se obřadní zbožnost."
 building_water_temples_04: "Rozsáhlá krajina vodních chrámů"
 building_water_temples_04_desc: "Celé povodí je spravováno prostřednictvím shromáždění vedených chrámy. Terasy, stavidla a slavnosti proměňují provincii ve zbožnou obilnici."
 building_type_stilted_granaries_01: "Sýpky na kůlech"
 building_type_stilted_granaries_01_desc: "Sýpky vyvýšené na čtyřech či více kůlech jsou chráněné před krysami a dokonale se hodí k ukládání dávek i zásobování válečných družin."
 building_stilted_granaries_01: "Sýpka na kůlech"
 building_stilted_granaries_01_desc: "Prostá sýpka na čtyřech kůlech udržuje osivo i dávky v suchu a vesnické stráže se během tažení lépe stravují."
 building_stilted_granaries_02: "Řada sýpek"
 building_stilted_granaries_02_desc: "Řada sýpek na kůlech se zábranami proti krysám a krytými schodišti zajišťuje pravidelnější obilní dávky a rychlejší zotavení odvedenců."
 building_stilted_granaries_03: "Zdobené sýpky na kůlech"
 building_stilted_granaries_03_desc: "Řezbářská výzdoba dává na odiv přebytky a správci střídají zásoby i příděly, aby vystačily na delší pochody."
 building_stilted_granaries_04: "Sýpkový areál"
 building_stilted_granaries_04_desc: "Oplocený shluk sýpek se strážním přístřeškem a počtářskou kůlnou zajišťuje dostatek potravin pro celé hrabství."
 building_type_kora_kora_yards_01: "Loděnice kora-kora"
 building_type_kora_kora_yards_01_desc: "Klanové přístřešky a skluzy pro válečné kánoe s vahadly."
 building_kora_kora_yards_01: "Přístřešky pro kánoe"
 building_kora_kora_yards_01_desc: "Kryté skluzy pro pádlované kánoe s vahadly umožňují posádkám cvičit pobřežní nájezdy i plavby mezi ostrovy."
 building_kora_kora_yards_02: "Klanová loděnice"
 building_kora_kora_yards_02_desc: "Zásoby dřeva, vláknových úvazů a náhradních vahadel urychlují opravy a nájezdníci přivážejí trofeje i zboží ke směně."
 building_kora_kora_yards_03: "Loděnice kora-kora"
 building_kora_kora_yards_03_desc: "Větší trupy, bojové plošiny a signální bubny proměňují pobřežní hlídky a sezónní výpravy v pravidelnou součást života i příjmů."
 building_kora_kora_yards_04: "Velký arzenál válečných kánoí"
 building_kora_kora_yards_04_desc: "Mistři loděnic vybavují celé flotily. Spouštěcí rampy, provaznické půdy a shromažďovací plošiny nahánějí sousedům strach."
 building_type_idjang_forts_01: "Pevnosti idžang"
 building_type_idjang_forts_01_desc: "Terasovité kmenové citadely a opěrné body na horských výběžcích či pahorcích."
 building_idjang_forts_01: "Palisádový idžang"
 building_idjang_forts_01_desc: "Obranyschopnou vyvýšeninu korunuje dřevěná palisáda a nájezdníky odrazují strážní ohně i suché příkopy."
 building_idjang_forts_02: "Kamenný idžang"
 building_idjang_forts_02_desc: "Na nejdůležitějších místech nahrazují dřevo opěrné zdi z lomového kamene a kryté cesty umožňují obráncům bezpečný pohyb."
 building_idjang_forts_03: "Terasový idžang"
 building_idjang_forts_03_desc: "Stupňovité přístupové cesty, výpadová schodiště a střelecké plošiny vytvářejí smrtící úhly pro šípy i oštěpy."
 building_idjang_forts_04: "Citadela idžang"
 building_idjang_forts_04_desc: "Brána, vnitřní donjon a cisterna umožňují posádce vzdorovat po celá roční období."
 building_type_wantilan_01: "Vantilan"
 building_type_wantilan_01_desc: "Rozlehlé otevřené síně bez stěn a obecní pavilony určené ke shromážděním, obřadům a vystoupením."
 building_wantilan_01: "Malý vantilan"
 building_wantilan_01_desc: "Vesnická síň hostí odvody, přísahy i zkoušky a stařešinové zde urovnávají sváry dříve, než propuknou."
 building_wantilan_02: "Pavilon vantilan"
 building_wantilan_02_desc: "Široká síň s víceúrovňovou střechou hostí slavnosti a iniciační obřady, při nichž společné rituály posilují morálku i prestiž."
 building_wantilan_03: "Chrámový vantilan"
 building_wantilan_03_desc: "Obřadní prostor spojený s místní svatyní poskytuje dostatek místa pro obětiny a procesí."
 building_wantilan_04: "Velký vantilan"
 building_wantilan_04_desc: "Významná aréna, v níž bubeníci, tanečníci a velitelé sdílejí jedinou střechu."
 building_type_military_academy_01: "Vojenské akademie"
 building_type_military_academy_01_desc: "Specializovaná zařízení pro výcvik důstojníků a rytířů zvyšují jejich účinnost v boji."
 building_military_academy_01: "Vojenské školy"
 building_military_academy_01_desc: "Uchazeči o důstojnickou dráhu jsou ve vojenské škole posuzováni podle zásluh. Škola samozřejmě přijímá pouze studenty urozeného původu."
 building_military_academy_02: "Důstojnické akademie"
 building_military_academy_02_desc: "Vzdělávají se zde důstojníci středních a vyšších hodností, kteří získávají hlubší znalosti o přesunech vojsk, přípravě bojiště a podmínkách během bitvy."
 building_military_academy_03: "Velkolepé vojenské akademie"
 building_military_academy_03_desc: "Velkolepá vojenská akademie je tepajícím srdcem vyspělého vojenského aparátu. Zdejší důstojníci se učí polní strategii, organizaci armády i nejnovějším technologickým pokrokům ve válčení."
 building_type_march_01: "Marky"
 building_type_march_01_desc: "Páni pohraničních marek chrání hranice pomocí opevnění a místních posádek."
 marches_effect_desc: "Snižuje pravděpodobnost zvláštních [Concept('raid_intents','záměrů nájezdu')|E]"
 marches_effect_2_desc: "Blokuje zvláštní [Concept('raid_intents','záměry nájezdu')|E]"
 building_march_01: "Strategické marky"
 building_march_01_desc: "Marky vznikají v nejzranitelnějších a nejodlehlejších částech vévodství, které chrání před útoky. Jsou sice roztroušené daleko od sebe, ale slouží jako užitečný výstražný systém a občas dopadnou i nějakého pašeráka."
 building_march_02: "Pohraniční marky"
 building_march_02_desc: "Soustava pánů marek se rozšiřuje podél celé hranice a vytváří souvislou obrannou linii."
 building_march_03: "Velké marky"
 building_march_03_desc: "Po celém vévodství vznikají rozsáhlá opevnění marek, která výrazně ztěžují postup každého útočného vojska."
 building_type_siege_works_01: "Obléhací provozy"
 building_type_siege_works_01_desc: "Specializované obléhací provozy umožňují vládci nasazovat a udržovat obléhací stroje vynikající kvality."
 building_siege_works_01: "Obléhací dílny"
 building_siege_works_01_desc: "Specializované a sjednocené výrobní postupy zajišťují rychlejší a nepřetržitý přísun obléhacích strojů."
 building_siege_works_02: "Stavitelé trebuchetů"
 building_siege_works_02_desc: "K nasazení nejpokročilejších zbraní obléhacího válčení, trebuchetů, jsou zapotřebí specializovaní stavitelé."
 building_siege_works_03: "Dělové slévárny"
 building_siege_works_03_desc: "Děla jsou nejnovější zbraní, která se objevila na bojištích. Jsou hlučná, těžká a obtížně ovladatelná, proti kamenným opevněním však smrtící. Schopnost vyrábět a nasazovat děla nám poskytuje nespornou výhodu nad nepřáteli."
 building_type_royal_armory_01: "Královské zbrojnice"
 building_type_royal_armory_01_desc: "Zbrojnice financované korunou zajišťují armádě stálý přísun provozuschopných zbraní a jejich údržbu."
 building_royal_armory_01: "Sklady zbraní"
 building_royal_armory_01_desc: "Za války mohou selští odvedenci dostat zbraň ze skladu. Většinou jde o staré rezavé sekery, praskající kopí a tupé čepele, ale po troše údržby jsou mnohem účinnější než běžné zemědělské náčiní, kterým bývají odvedenci vyzbrojeni."
 building_royal_armory_02: "Korunní zbrojnice"
 building_royal_armory_02_desc: "Zbrojnice spravované korunou shromažďují a udržují zbraně i zbroj pro válku. Jejich slušná kvalita dokáže z každého opilého povaleče udělat řádně vyhlížejícího vojáka, i když se podle toho nemusí chovat."
 building_royal_armory_03: "Královský arzenál"
 building_royal_armory_03_desc: "Královský arzenál uchovává a udržuje ohromné množství zbraní, které postačuje k rychlému vyzbrojení bezpočtu selských odvedenců a přilákání nejlepších žoldnéřů v zemi."
 building_type_jousting_lists_01: "Kolbiště"
 building_type_jousting_lists_01_desc: "Vyhrazená kolbiště podporují více jezdců a rytířů, aby trénovali a připojovali se k praporům."
 building_jousting_lists_01: "Rytířská kolbiště"
 building_jousting_lists_01_desc: "Po celý rok se udržuje volné prostranství určené k výcviku jezdců a rytířů."
 building_jousting_lists_02: "Turnajová kolbiště"
 building_jousting_lists_02_desc: "Turnajová kolbiště s ohradami pro souboje a tribunami pro diváky přitahují ohromné množství soutěžících."
 building_jousting_lists_03: "Královské turnajové arény"
 building_jousting_lists_03_desc: "Turnajová aréna rozšířená o sedadla pro královské hosty a větší tržiště je skutečně působivá."
 building_type_blacksmiths_01: "Korunní kovárny"
 building_type_blacksmiths_01_desc: "Kováři ve službách koruny vyrábějí zbraně a zbroj pro královskou gardu a zajišťují jí stálý přísun výtečné výzbroje."
 building_blacksmiths_01: "Korunní kováři"
 building_blacksmiths_01_desc: "Koruna zaměstnává nejlepší a nejvýkonnější kováře, kteří pro královskou gardu vyrábějí meče, kroužkovou zbroj a píky."
 building_blacksmiths_02: "Kovářské cechy"
 building_blacksmiths_02_desc: "Spolupráce s různými cechy umožňuje levně vyrábět velké množství výstroje na objednávku."
 building_blacksmiths_03: "Královské výhně"
 building_blacksmiths_03_desc: "Rozsáhlé výhně vznikají výhradně za účelem zásobování koruny zbraněmi a pracují v nich pouze ti nejlepší kováři."
 building_type_archery_ranges_01: "Lukostřelecká cvičiště"
 building_type_archery_ranges_01_desc: "Vyhrazená lukostřelecká cvičiště umožňují prostému lidu trénovat s luky a zkušeným lučištníkům zdokonalovat své schopnosti."
 building_archery_ranges_01: "Lukostřelecké střelnice"
 building_archery_ranges_01_desc: "Na lukostřelecké střelnici jsou vítáni bohatí i chudí. Důvody jsou dva. Rolníci schopní zacházet s lukem jsou užitečnější ve válce a zkušení střelci se díky turnajům udržují ve špičkové formě."
 building_archery_ranges_02: "Královští lukostrojaři"
 building_archery_ranges_02_desc: "Koruna zaměstnává nejlepší lukostrojaře, kteří ve zvlášť vybudovaných dílnách vyrábějí luky nejvyšší možné kvality."
 building_archery_ranges_03: "Střelnice mistrů lukostřelby"
 building_archery_ranges_03_desc: "Tato zvláštní cvičiště mají inspirovat rolníky a poskytnout našim střelcům dostatečnou výzvu při výcviku střelby na dlouhou vzdálenost."
 building_type_tax_assessor_01: "Daňové úřady"
 building_type_tax_assessor_01_desc: "Vybírání peněz od rolnictva je skutečně náročný podnik. Přidělením úřadů zástupu výběrčích daní si zajistíme, že dostaneme vše, co nám náleží!"
 building_tax_assessor_01: "Daňoví odhadci"
 building_tax_assessor_01_desc: "Povinností každého rolníka je odvádět koruně přiměřenou daň v mincích či naturáliích. Naši daňoví odhadci zajišťují, aby byla odváděná částka dostatečně „přiměřená“ našim potřebám, a naštěstí pro nás neumí většina rolníků číst."
 building_tax_assessor_02: "Úřad fojta"
 building_tax_assessor_02_desc: "Vynikajícím způsobem, jak přimět rolníky platit daně, je pohrozit jim uvržením do žaláře. To je úkolem fojta, který stojí vždy na #emphasis naší#! straně!"
 building_tax_assessor_03: "Soudní dvůr"
 building_tax_assessor_03_desc: "Rolníky lze zdanit snadno, ale zámožnější držitele půdy je obtížnější přinutit. Vybudováním složité správní sítě řízené věrnými soudci zajistíme, že své závazky splatí i ti nejbohatší poddaní."
 building_type_leisure_palace_01: "Paláce oddechu"
 building_type_leisure_palace_01_desc: "Pobývat v jednom okázale přepychovém paláci je příjemné, ale možnost vybrat si z několika nikdy neuškodí."
 building_leisure_palace_01: "Venkovský zámeček"
 building_leisure_palace_01_desc: "Když se břemeno povinností stane nesnesitelným nebo se branami probíjí rozzuřený dav rolníků, není nad vzdálený venkovský zámeček, kde si lze neplánovaně odpočinout!"
 building_leisure_palace_02: "Letní palác"
 building_leisure_palace_02_desc: "Letní palác stojí v malebné části vévodství, daleko od všedních životů našich lopotících se poddaných. Sotva lze lépe předvést královskou moc a prestiž i prostý fakt, že jsme #emphasis lepší#! než všichni ostatní."
 building_leisure_palace_03: "Zimní palác"
 building_leisure_palace_03_desc: "Zimní palác je určen k pobytu královské rodiny během drsnějších měsíců roku. S dobře zásobenou spižírnou a snadno hájitelnou polohou se tyčí nad všemi promrzlými poddanými, kteří mají tu čest pracovat poblíž."
 building_type_royal_forest_01: "Královské hvozdy"
 building_type_royal_forest_01_desc: "Královský hvozd je cenným zdrojem bohatství. Umožňuje v provincii obejít zemské právo, odejmout místním jejich práva a následně jim je prodat zpět. Netřeba dodávat, že i lov je zde znamenitý."
 building_royal_forest_01: "Královské lesy"
 building_royal_forest_01_desc: "Rozsáhlé části lesů v tomto vévodství jsou vyhrazeny královské rodině. Rolníkům je zakázáno v lesích žít, lovit zvěř či kácet stromy kvůli obdělávání půdy. Obzvláště přísně je zakázáno napadat projíždějící královské výběrčí daní."
 building_royal_forest_02: "Rozsáhlé korunní lesy"
 building_royal_forest_02_desc: "Královský hvozd nyní pohlcuje celá města a okolní osady často zjišťují, že panovníkovi muži „objevili“ mapy, podle nichž se jejich obydlí nacházejí hluboko uvnitř zdejších korunních lesů."
 building_royal_forest_03: "Soudy královských hvozdů"
 building_royal_forest_03_desc: "Zákon je jen tak účinný jako soustava, která jej prosazuje. Tento královský hvozd nyní spravuje celý systém soudů, strážců a písařů podporovaných vyškolenými soudci, kteří jsou připraveni vymáhat příkazy koruny."
 building_type_royal_garden_01: "Královské zahrady"
 building_type_royal_garden_01_desc: "Jen málokteré místo umožňuje odpočívat a setkávat se tak příjemně jako krásná zahrada. Většině lidí by postačila malá soukromá zahrádka, ale pro bohaté a mocné je dost dobré pouze to nejvelkolepější dílo!"
 building_royal_garden_01: "Uzavřená zahrada"
 building_royal_garden_01_desc: "Malá zahrada obehnaná kamennými zdmi poskytuje útočiště klidu a pohodlí, které odstiňuje ruch okolního světa."
 building_royal_garden_02: "Zahradní komplex"
 building_royal_garden_02_desc: "Rozsáhlá a působivá zahrada plná květin, bylin, ovocných stromů a všeho mezi tím. O její neustálou údržbu pečuje početný zástup zahradníků."
 building_royal_garden_03: "Královský park"
 building_royal_garden_03_desc: "Královský park je rozlehlá a nádherná krajina pečlivě začleněná do okolního terénu a architektury. Je přístupný všem a naplňuje úžasem návštěvníky ze širokého okolí."
 building_type_ananda_temple_01: "Chrám Ánanda"
 building_type_ananda_temple_01_desc: "Přestože jsou Bagan a okolní pláně posety tisíci pagod, chrámů a svatyní, chrám Ánanda mezi nimi představuje vrcholné dílo. Dokonale proporční stavba ukrývá množství jedinečných desek a kamenných vyobrazení. Slouží jako místo bohoslužeb i středisko vzdělanosti, které lidem předává náboženské zásady."
 building_ananda_temple_01: "$building_type_ananda_temple_01$"
 building_ananda_temple_01_desc: "$building_type_ananda_temple_01_desc$"
 building_type_hotin_fort_01: "Chotynské opevnění"
 building_type_hotin_fort_01_desc: "Chotynská tvrz je malé opevnění vystavěné na břehu Dněstru. Její poloha umožňuje chránit místní obchodní cesty a poskytuje vlastníkovi kontrolu nad řekou."
 building_hotin_fort_01: "Chotynská tvrz"
 building_hotin_fort_01_desc: "$building_type_hotin_fort_01_desc$"
 building_hotin_fort_02: "Chotynská pevnost"
 building_hotin_fort_02_desc: "Tato působivá pevnost zastiňuje původní tvrz. Opevnění bylo během staletí rozšířeno o vysoké kamenné hradby, široký příkop a několik mohutných věží. Tato obranná stavba snadno udrží většinu obléhatelů v patřičné vzdálenosti."
 building_type_golden_gate_of_kiev_01: "Zlatá brána v Kyjevě"
 building_type_golden_gate_of_kiev_01_desc: "Zlatá brána v Kyjevě, vystavěná podle vzoru stejnojmenné brány v Konstantinopoli, slouží zároveň jako vstup do města a vítězný oblouk. Zlatá kupole chrámu postaveného nad bránou je viditelná zdaleka a činí z ní významný symbol Kyjeva."
 building_golden_gate_of_kiev_01: "$building_type_golden_gate_of_kiev_01$"
 building_golden_gate_of_kiev_01_desc: "$building_type_golden_gate_of_kiev_01_desc$"
 building_type_heddal_stave_church_01: "Sloupový kostel v Heddalu"
 building_type_heddal_stave_church_01_desc: "Sloupový kostel v Heddalu je největším sloupovým kostelem v Norsku a má nádherný dřevěný interiér. Podle pověsti jej za pouhé tři dny vystavěl horský troll."
 building_heddal_stave_church_01: "$building_type_heddal_stave_church_01$"
 building_heddal_stave_church_01_desc: "$building_type_heddal_stave_church_01_desc$"
 building_type_temple_of_uppsala_01: "Chrám v Uppsale"
 building_type_temple_of_uppsala_01_desc: "Chrám v Uppsale slouží jako náboženské středisko rozsáhlých částí Skandinávie. Poblíž chrámu stojí vedle studny posvátný strom připomínající bájný Yggdrasil."
 building_temple_of_uppsala_01: "$building_type_temple_of_uppsala_01$"
 building_temple_of_uppsala_01_desc: "$building_type_temple_of_uppsala_01_desc$"
 building_temple_of_uppsala_02: "Uppsalská katedrála"
 building_temple_of_uppsala_02_desc: "Vznešená Uppsalská katedrála byla vystavěna tak, aby soupeřila s nejskvostnějšími stavbami jižní Evropy. Slouží jako pohřebiště některých z nejvýznamnějších švédských panovníků a ukrývá několik ostatků světců."
 building_type_lund_cathedral_01: "Lundská katedrála"
 building_type_lund_cathedral_01_desc: "Lundská katedrála je nádherný chrám bohatě zdobený kamennými sochami. Stavba ovlivněná románskou architekturou se v mnohém podobá kostelům v Německu. Je zasvěcena svatému Vavřinci, patronovi Lundu."
 building_lund_cathedral_01: "$building_type_lund_cathedral_01$"
 building_lund_cathedral_01_desc: "$building_type_lund_cathedral_01_desc$"
 building_type_danevirke_01: "Danevirke"
 building_type_danevirke_01_desc: "Danevirke je rozsáhlé zemní opevnění vystavěné k zamezení vpádů z kontinentu na dánské území. Od svého vzniku bylo již několikrát rozšířeno."
 building_danevirke_01: "$building_type_danevirke_01$"
 building_danevirke_01_desc: "$building_type_danevirke_01_desc$"
 building_type_aljaferia_palace_01: "Aljafería"
 building_type_aljaferia_palace_01_desc: "Aljafería je mohutný opevněný palác vystavěný na planině Saría a svědčí o moci a bohatství Zaragozy. Je stejně impozantní jako nádherná a představuje zároveň hrozivou pevnost i vrchol iberské architektury."
 building_aljaferia_palace_01: "$building_type_aljaferia_palace_01$"
 building_aljaferia_palace_01_desc: "$building_type_aljaferia_palace_01_desc$"
 building_type_roman_wall_of_lugo_01: "Římské hradby v Lugu"
 building_type_roman_wall_of_lugo_01_desc: "Mohutné hradby v Lugu, které před dávnými časy vystavěli Římané, zůstávají působivou podívanou. Poutníci procházejí jejich pěti branami na cestě do Santiaga de Compostela, což jejich putování dodává ještě hlubší význam."
 building_roman_wall_of_lugo_01: "$building_type_roman_wall_of_lugo_01$"
 building_roman_wall_of_lugo_01_desc: "$building_type_roman_wall_of_lugo_01_desc$"
 building_type_rock_of_gibraltar_01: "Gibraltarská skála"
 building_type_rock_of_gibraltar_01_desc: "Monolitická Gibraltarská skála shlíží na úzký průliv tvořící bránu do Středozemního moře. Ve starověku představovala jeden z Herkulových sloupů, které údajně označovaly konec známého světa. Při pohledu na ni si nelze nepoložit otázku, co leží za ní."
 building_rock_of_gibraltar_01: "$building_type_rock_of_gibraltar_01$"
 building_rock_of_gibraltar_01_desc: "$building_type_rock_of_gibraltar_01_desc$"
 building_type_tower_of_hercules_01: "Farum Brigantium"
 building_type_tower_of_hercules_01_desc: "Tento starověký maják byl údajně vystavěn podle své slavnější sestry v Alexandrii. Po nesčetná staletí ukazoval cestu mořeplavcům a dodnes má velký význam pro pobřežní obchod Galicie. Někteří tvrdí, že lze z vrcholu osamělé věže zahlédnout zelené břehy Irska, při pohledu do dáli však vidíš jen nekonečné moře."
 building_tower_of_hercules_01: "$building_type_tower_of_hercules_01$"
 building_tower_of_hercules_01_desc: "$building_type_tower_of_hercules_01_desc$"
 building_type_city_wall_of_toledo_01: "Městské hradby v Toledu"
 building_type_city_wall_of_toledo_01_desc: "Tyto mohutné hradby původně vystavěli již dávní Římané a později je výrazně rozšířil vizigótský král Wamba. První arabští vládci je ještě více rozšířili a vytvořili obrannou soustavu hodnou Města králů."
 building_city_wall_of_toledo_01: "$building_type_city_wall_of_toledo_01$"
 building_city_wall_of_toledo_01_desc: "$building_type_city_wall_of_toledo_01_desc$"
 building_type_alcazar_of_segovia_01: "Alcázar v Segovii"
 building_type_alcazar_of_segovia_01_desc: "Tato pevnost vystupuje ze skalnatého útesu jako příď lodi a nabízí úchvatnou podívanou. Je stejně majestátní jako nedobytná a představuje největší ze všech hradů v království hradů, Kastilii."
 building_alcazar_of_segovia_01: "$building_type_alcazar_of_segovia_01$"
 building_alcazar_of_segovia_01_desc: "$building_type_alcazar_of_segovia_01_desc$"
 building_type_holy_site_basilica_santiago_01: "Katedrála v Santiagu de Compostela"
 building_type_holy_site_basilica_santiago_01_desc: "Tato nádherná stavba, vybudovaná nad hrobem svatého Jakuba Staršího, je cílem Svatojakubské cesty a korunou jednoho z nejvýznamnějších míst křesťanstva. Ve velkých počtech sem přicházejí poutníci z celé západní a severní Evropy, kteří hovoří desítkami jazyků, ačkoli mnozí úžasem oněmí."
 building_holy_site_basilica_santiago_01: "$building_type_holy_site_basilica_santiago_01$"
 building_holy_site_basilica_santiago_01_desc: "$building_type_holy_site_basilica_santiago_01_desc$"
 building_type_charnel_grounds_01: "Pohřebiště pod širým nebem"
 building_type_charnel_grounds_01_desc: "Tato otevřená prostranství slouží zároveň k duchovní očistě i poslednímu odpočinku mrtvých a poskytují místo, kde se mohou těla rozložit."
 building_charnel_grounds_01: "Úložiště mrtvých"
 building_charnel_grounds_01_desc: "Těla uložená na vrcholu kopce bělají na slunci, rozkládají se a stávají se potravou dravých ptáků."
 building_charnel_grounds_02: "Exkarnační pole"
 building_charnel_grounds_02_desc: "Toto místo je zčásti náboženským areálem a zčásti pohřebištěm, kde jsou rozkládající se těla mrtvých držena daleko od živých."
 building_charnel_grounds_03: "Obřadní sráz"
 building_charnel_grounds_03_desc: "Krajinu pokrývají těla a váčky s vonnými látkami jen částečně potlačují zápach kolem stezek, po nichž živí přinášejí živlům nové obětiny."
 building_type_imam_reza_shrine_01: "Svatyně imáma Rezy"
 building_type_imam_reza_shrine_01_desc: "Tato svatyně ukrývá ostatky Alího ar-Ridá, kterého část šíitů uctívá jako osmého imáma a který byl v této zemi umučen. Neustále se rozrůstající komplex zahrnuje jeho hrobku, modlitební síně, knihovnu i bazar a s přílivem a odlivem poutníků a karavan nabývá rozmanité, avšak velkolepé podoby."
 building_imam_reza_shrine_01: "$building_type_imam_reza_shrine_01$"
 building_imam_reza_shrine_01_desc: "$building_type_imam_reza_shrine_01_desc$"
 building_type_soltaniyeh_01: "Dóm v Soltáníji"
 building_type_soltaniyeh_01_desc: "Tato stavba, která je chrámem i mauzoleem, svou velkolepostí a vytříbenou souměrností jistě inspiruje mnohá budoucí díla. Její mohutná dvouplášťová kupole je obložena tyrkysem a svou velikostí téměř působí jako výzva samotným nebesům."
 building_soltaniyeh_01: "$building_type_soltaniyeh_01$"
 building_soltaniyeh_01_desc: "$building_type_soltaniyeh_01_desc$"
 building_type_palace_of_ctesiphon_01: "Ruiny paláce v Ktésifóntu"
 building_type_palace_of_ctesiphon_01_desc: "Tato starobylá stavba bývala obřadním sídlem sásánovských králů králů, její kdysi nádherné síně však umlkly a květiny v zahradách již nekvetou. Mnoho stavebního materiálu bylo odvezeno při zakládání Bagdádu a zdejší lidé se rozprchli do všech světových stran. Přesto zde přetrvává znepokojivá nádhera a doznívající sláva dávných časů."
 building_palace_of_ctesiphon_01: "$building_type_palace_of_ctesiphon_01$"
 building_palace_of_ctesiphon_01_desc: "$building_type_palace_of_ctesiphon_01_desc$"
 building_type_palace_of_ctesiphon_02: "Velkolepý palác v Ktésifóntu"
 building_type_palace_of_ctesiphon_02_desc: "Sídlu dávných králů se po přestavbě navrátila veškerá jeho sláva. Zahrady opět kvetou a síně znovu naplňuje hudba a nádhera. Návštěvníci přicházejí zblízka i zdaleka, aby spatřili mohutný oblouk otevřeného trůnního sálu, dávno zapomenutý div starověkého světa, který nyní konečně nalezl své místo v písních."
 building_palace_of_ctesiphon_02: "$building_type_palace_of_ctesiphon_02$"
 building_palace_of_ctesiphon_02_desc: "$building_type_palace_of_ctesiphon_02_desc$"
 building_type_falak_ol_aflak_citadel_01: "Falak ol-Aflak"
 building_type_falak_ol_aflak_citadel_01_desc: "Tato sásánovská pevnost z nepálených cihel stojí na vrcholu kopce nad městem Chorramábád a dodnes nabízí působivou podívanou. Obyvatelé údolí ji nazývají #italic Falak ol-Aflak#! neboli „Nebe nebes“, protože jim připadá, jako by spočívala na samotném vrcholu světa. Za jejími pevnými zdmi často nacházeli útočiště."
 building_falak_ol_aflak_citadel_01: "$building_type_falak_ol_aflak_citadel_01$"
 building_falak_ol_aflak_citadel_01_desc: "$building_type_falak_ol_aflak_citadel_01_desc$"
 building_type_minarets_and_remains_of_jam_01: "Minaret v Džámu"
 building_type_minarets_and_remains_of_jam_01_desc: "Tato stavba se tyčí nad údolím řeky Hari a pokrývají ji štukové ozdoby, glazované dlaždice a střídající se pásy kaligrafie. Je vytříbeným dokladem toho, čeho mohou víra a bohatství dosáhnout i v těchto odlehlých a drsných zemích."
 building_minarets_and_remains_of_jam_01: "$building_type_minarets_and_remains_of_jam_01$"
 building_minarets_and_remains_of_jam_01_desc: "$building_type_minarets_and_remains_of_jam_01_desc$"
 building_type_great_wall_of_gorgan_01: "Velká zeď v Gorgánu"
 building_type_great_wall_of_gorgan_01_desc: "Velká zeď v Gorgánu je rozsáhlá soustava opevnění, kterou dávní králové vystavěli jako hráz proti Heftalitům. Opřádá ji množství legend a údajně jejími branami prošel i sám Alexandr Veliký během tažení za dobytím Východu."
 building_great_wall_of_gorgan_01: "$building_type_great_wall_of_gorgan_01$"
 building_great_wall_of_gorgan_01_desc: "$building_type_great_wall_of_gorgan_01_desc$"
 building_type_maharloo_lake_01: "Jezero Mahárlú"
 building_type_maharloo_lake_01_desc: "Ačkoli je toto sezónní jezero někdy pouhou vyschlou solnou plání, uprostřed léta získává jeho voda nádherný světle rudý odstín. Mladí básníci se shromažďují na břehu, hledí na podivuhodnou vodu a rozjímají o kráse a tajemstvích země."
 building_maharloo_lake_01: "$building_type_maharloo_lake_01$"
 building_maharloo_lake_01_desc: "$building_type_maharloo_lake_01_desc$"
 building_type_tomb_of_cyrus_01: "Hrobka Batšeby"
 building_type_tomb_of_cyrus_01_desc: "Tato starobylá hrobka z bílého vápence je údajně místem posledního odpočinku Batšeby, matky krále Šalomouna, kterou velebí mnohé víry. O místo pečují ženy a pouze jim je dovoleno vstoupit do temného nitra hrobky. O tom, co uvnitř spatřily, hovoří jen zřídka. Nedaleká voda je prý požehnaná a dokáže uzdravit lidi pokousané vzteklými psy."
 building_tomb_of_cyrus_01: "$building_type_tomb_of_cyrus_01$"
 building_tomb_of_cyrus_01_desc: "$building_type_tomb_of_cyrus_01_desc$"
 building_type_rainbow_mountains_01: "Duhové hory"
 building_type_rainbow_mountains_01_desc: "Jako by tyto hřebeny sama stvořitelská moc pomalovala všemi barvami duhy. Pásy červené, bílé, žluté, šedé, oranžové a ještě podivuhodnějších odstínů zbarvují kamenitou a poklidnou krajinu. Místní vládci sem často berou své hosty na lov, aby spatřili tento vznešený div."
 building_rainbow_mountains_01: "$building_type_rainbow_mountains_01$"
 building_rainbow_mountains_01_desc: "$building_type_rainbow_mountains_01_desc$"
 building_type_mount_damavand_01: "Hora Damávand"
 building_type_mount_damavand_01_desc: "Damávand je mohutný zasněžený vrchol opředený dávnými pověstmi. Údajně slouží jako vězení obludného tyrana Zahháka, který v něm zůstane až do konce světa. Mnoho dávných hrdinů na této hoře vykonalo velké skutky a její mocná přítomnost se dodnes dotýká duší všech, kdo k ní putují. Na svazích této spící sopky vyvěrají horké prameny, u nichž mohou znavení cestovatelé odpočívat a rozjímat o činech předků."
 building_mount_damavand_01: "$building_type_mount_damavand_01$"
 building_mount_damavand_01_desc: "$building_type_mount_damavand_01_desc$"
 building_type_holy_site_fire_temple_01: "Velkolepý chrám ohně"
 building_type_holy_site_fire_temple_01_desc: "Uvnitř této velkolepé stavby plane #italic Átaš Bahrám#! neboli Oheň vítězství, nejvznešenější a nejčistší ze všech plamenů. Byl shromážděn z blesků, královských svící, pohřebních hranic, zlatnických pecí a ohnišť asketů. Poutníci ze vzdálených zemí přicházejí tento div spatřit, zatímco mágové vykonávají zdánlivě nekonečné očistné obřady."
 building_holy_site_fire_temple_01: "Velkolepý chrám ohně"
 building_holy_site_fire_temple_01_desc: "$building_type_holy_site_fire_temple_01_desc$"
 building_type_ark_of_bukhara_01: "Citadela Ark v Buchaře"
 building_type_ark_of_bukhara_01_desc: "Říká se, že tuto mohutnou pevnost vystavěl princ Sijávoš v mládí světa. O tři tisíce let později ji obnovili bucharští chudové, dávní vládci této oblasti, a od té doby zůstává nepřetržitě využívána. Cestovatelé zblízka i zdaleka přicházejí obdivovat stavbu, jejíchž sedm mohutných sloupů odpovídá sedmi hvězdám Velkého vozu. Především je však opevněním, jehož nádhera nahání strach."
 building_ark_of_bukhara_01: "$building_type_ark_of_bukhara_01$"
 building_ark_of_bukhara_01_desc: "$building_type_ark_of_bukhara_01_desc$"
 building_type_shah_i_zinda_01: "Šáh-i Zinda"
 building_type_shah_i_zinda_01_desc: "Název tohoto komplexu hrobek znamená #italic Živý král#! a odkazuje na Mohamedova bratrance Kusama ibn Abbáse, který je zde údajně pohřben. Mauzolea jsou poměrně malá a skromná, vyzařují však tklivou krásu, kvůli níž se mnozí zdržují mezi tichými hroby a rozjímají o pomíjivosti života."
 building_shah_i_zinda_01: "$building_type_shah_i_zinda_01$"
 building_shah_i_zinda_01_desc: "$building_type_shah_i_zinda_01_desc$"
 building_shah_i_zinda_02: "Nekropole Šáh-i Zinda"
 building_shah_i_zinda_02_desc: "Rozsáhlá nekropole mauzoleí, vysokých bran a klenutých průchodů obložených tyrkysovými dlaždicemi zvaná #italic Živý král#! je pohřebištěm prorokova bratrance a mnoha dalších velkých pánů minulosti. Komplex se neustále rozrůstá a působí stejně vznešeně, tajemně i impozantně."
 building_type_alamut_castle_01: "Hrad Alamút"
 building_type_alamut_castle_01_desc: "Toto orlí hnízdo tyčící se na vysokém skalním útesu vystavěli Džustánovci jako pevné útočiště svého těžce zkoušeného panství. Díky úchvatné poloze a mohutným valům je podle všeho téměř nedobytné a mohlo by se stát ideální pevností pro jakoukoli bojovnou frakci či sektu, které by takto odlehlé místo vyhovovalo."
 building_alamut_castle_01: "$building_type_alamut_castle_01$"
 building_alamut_castle_01_desc: "$building_type_alamut_castle_01_desc$"
 building_type_alamut_castle_02: "Pevnost Alamút"
 building_type_alamut_castle_02_desc: "Tento hrad na vysokém skalním útesu dlouho sloužil jako odlehlé horské útočiště. Nyní byl přestavěn v hrozivou pevnost #italic fidáínů#!, v níž se mezi mohutnými opevněními nacházejí knihovny, laboratoře a poklidné zahrady. Pro některé je místem krveprolití a války, pro jiné místem duchovního odpočinku, snad však obojím zároveň."
 building_alamut_castle_02: "$building_type_alamut_castle_02$"
 building_alamut_castle_02_desc: "$building_type_alamut_castle_02_desc$"
 building_type_assassin_castle_01: "$holy_order_hashshashin$ $building_castle_04$"
 building_type_assassin_castle_01_desc: "$building_type_alamut_castle_02_desc$"
 building_assassin_castle_01: "$building_type_assassin_castle_01$"
 building_assassin_castle_01_desc: "$building_type_assassin_castle_01_desc$"
 building_type_qanats_01: "$building_qanats_06$"
 building_type_qanats_01_desc: "$building_qanats_05_desc$"
 building_qanats_01: "Jachčál"
 building_qanats_01_desc: "Tyto kupolovité ledovny spojují podzemní skladovací prostor se žáruvzdornými stavebními materiály a vytvářejí izolované prostředí fungující jako odpařovací chladič."
 building_qanats_02: "Cisterna"
 building_qanats_02_desc: "Tyto klenuté stavby, v perštině nazývané #italic áb anbár#!, jsou zčásti zapuštěny do země a slouží k uchovávání velkého množství vody."
 building_qanats_03: "Větrné věže"
 building_qanats_03_desc: "Tyto vysoké věže jsou perským vynálezem a bývají propojeny s cisternami a dalšími budovami. Otvory obrácenými proti převládajícím větrům zachycují proudící vzduch, který následně obíhá v jejich nitru a ochlazuje je."
 building_qanats_04: "Káríz"
 building_qanats_04_desc: "Káríz představuje první stupeň podzemní vodovodní soustavy. Tvoří jej řada svislých šachet propojených mírně se svažujícím tunelem, který zachycuje podzemní vodu a přivádí ji na povrch."
 building_qanats_05: "Malé kanáty"
 building_qanats_05_desc: "Kanáty jsou podzemní vodovody navržené tak, aby omezovaly ztráty vody odpařováním. Ačkoli je tato soustava zatím poměrně malá, přináší zemědělství značný užitek."
 building_qanats_06: "Kanáty"
 building_qanats_06_desc: "Podzemní vodovody byly rozšířeny a propojeny s místními cisternami, ledovnami a zavlažovacími soustavami."
 building_qanats_07: "Velké kanáty"
 building_qanats_07_desc: "Tato rozsáhlá soustava podzemních vodovodů se táhne na několik #italic parasangů#! a zajišťuje mohutný přísun vody zemědělcům i obyvatelům měst."
 building_qanats_08: "Mohutná soustava kanátů"
 building_qanats_08_desc: "Tato mohutná soustava podzemních vodovodů napájí nesčetné podzemní cisterny, zavlažovací kanály, ledovny, lázně, fontány a studny s pitnou vodou a je skutečným dokladem perského důmyslu a slávy."
 building_type_tower_of_silence_01: "Velká věž mlčení"
 building_type_tower_of_silence_01_desc: "Naše víra nás učí odevzdávat těla spravedlivých věřících zvířatům a otevřenému nebi. Duše tak zůstává čistá a společenství je uchráněno před poskvrněním rozkládajícího se masa.\n\nKdyž nám cizinci nedovolí vykonávat naše obřady, musíme vystavět tyto věže, abychom ochránili ostatky zemřelých a dali najevo trvalost své víry."
 building_tower_of_silence_01: "Velká věž mlčení"
 building_tower_of_silence_01_desc: "Tato plochá věž s otevřeným vrcholem stojí v poklidné části vévodství a místní v ní ukládají své mrtvé. Těla uvnitř jsou vystavena mrchožravým ptákům a spalujícímu slunci, které bezpečně převádějí duše zemřelých na onen svět a chrání živé před poskvrněním. Náboženské zákazy si vyžádaly věž namísto tradičního pohřebiště v divočině, její přítomnost však pevně spojuje celé společenství."
 tower_of_silence_01.tt.liege_not_approve_of_burial: "[Concept('faith','Víra')|E] [Concept('liege_possessive','tvého lenního pána')|E] dovoluje tvému lidu praktikovat tradiční pohřbívání bez nutnosti stavět $building_type_event_tower_of_silence_01$"
 tower_of_silence_01.tt.county_not_tos_users: "[Concept('faith','Víra')|E] tohoto [Concept('county','hrabství')|E] se svými mrtvými takto nenakládá"
 building_type_event_tower_of_silence_01: "Věž mlčení"
 building_type_event_tower_of_silence_01_desc: "$building_tower_of_silence_01_desc$"
 building_event_tower_of_silence_01: "Věž mlčení"
 building_event_tower_of_silence_01_desc: "$building_type_tower_of_silence_01_desc$"
 building_church_of_the_theotokos: "Chrám Bohorodičky"
 building_church_of_the_theotokos_desc: "Svatý kříž již dávno ovládl tuto nádhernou stavbu a porazil pohanský kult panenské bohyně Athény.\nDnes ukrývá svatyně Panny Marie, Bohorodičky a jediné Panny hodné označení #EMP Svatá#!."
 building_type_church_of_the_theotokos: "$building_church_of_the_theotokos$"
 building_type_church_of_the_theotokos_desc: "$building_church_of_the_theotokos_desc$"
 building_parthenon: "Parthenón"
 building_parthenon_desc: "Posvátný chrám mocné Athény opět stojí hrdě a neposkvrněně pošetilými pověrami.\nTyto majestátní sloupy a zdi, vztyčené před více než tisíci lety, odolaly zkoušce času a dodnes shůry chrání domovy věřících jako němý symbol požehnání panenské bohyně, po níž bylo město pojmenováno."
 building_type_parthenon: "$building_parthenon$"
 building_type_parthenon_desc: "$building_parthenon_desc$"
 building_hagios_demetrios: "Hagios Dimitrios"
 building_hagios_demetrios_desc: "Chrám svatého Dimitria je nejvýznamnější svatyní ve městě.\nPoprvé byl vystavěn v dobách, kdy byla víra v Krista ještě mladá, a zahrnuje římské lázně, v nichž byl světec spolu s mnoha dalšími prvními věřícími uvězněn, umučen a pohřben."
 building_type_hagios_demetrios: "$building_hagios_demetrios$"
 building_type_hagios_demetrios_desc: "$building_hagios_demetrios_desc$"
 building_kassiopi_castle: "Hrad Kassiópi"
 building_kassiopi_castle_desc: "Působivá pevnost na pobřeží. Díky strategické poloze nad průlivem oddělujícím ostrov od pevniny představuje životně důležitý opěrný bod pro kontrolu Jónské oblasti."
 building_type_kassiopi_castle: "$building_kassiopi_castle$"
 building_type_kassiopi_castle_desc: "$building_kassiopi_castle_desc$"
 building_saint_lazarus: "Chrám svatého Lazara"
 building_saint_lazarus_desc: "Podle tradice byl Lazar z Betánie, kterého Kristus kdysi vzkřísil z mrtvých, po své druhé smrti pohřben ve městě Larnaka.\nHrobka byla po celá staletí ztracena, ale po jejím nalezení nechal císař Lev VI. přenést světcovy ostatky do Konstantinopole a nad hrobem vystavět tento působivý chrám."
 building_type_saint_lazarus: "$building_saint_lazarus$"
 building_type_saint_lazarus_desc: "$building_saint_lazarus_desc$"
 building_type_sumela_monastery_01: "Klášter Sumela"
 building_type_sumela_monastery_01_desc: "Počátky tohoto kláštera vystavěného na strmém útesu Černé hory jsou natolik dávné, že je téměř zahaluje tajemství. Podle některých jej ve 4. století nechal vystavět císař Theodosius, posvátný pramen a starobylé fresky však mohou být ještě starší.\nKlenotem kláštera je freska Bohorodičky, kterou údajně namaloval samotný apoštol Lukáš."
 building_sumela_monastery_01: "$building_type_sumela_monastery_01$"
 building_sumela_monastery_01_desc: "Klášter se rozpadl v ruiny a několik císařů jej následně obnovilo a rozšířilo. Největší podíl na jeho současné podobě měl císař Justinián prostřednictvím zásahu vojevůdce Belisaria."
 building_sumela_monastery_02: "Obnovený $building_type_sumela_monastery_01$"
 building_sumela_monastery_02_desc: "Od poslední obnovy kláštera uplynula dlouhá staletí. Nejnovější zásah mu přinesl další dědičné pozemky a závislé obyvatele, osvobození od daní i císařské prostředky na výstavbu nových budov. Nejvíce získal Skalní chrám, který obdržel zcela nový cyklus fresek."
 building_patras_castle: "Hrad v Patrasu"
 building_patras_castle_desc: "Starobylou akropoli města Patras, která se tyčila na kopci v pohoří Vodias, nahradilo za vlády císaře Justiniána opevnění.\nHrad je od té doby nepřetržitě využíván a vždy jej chrání místní patron svatý Ondřej i #EMP genius loci#! Patrinella, římská socha dívky."
 building_type_patras_castle: "$building_patras_castle$"
 building_type_patras_castle_desc: "$building_patras_castle_desc$"
 building_maiden_tower: "Dívčí věž"
 building_maiden_tower_desc: "Na této skále před pobřežím stála díky její ideální poloze u vstupu do Bosporské úžiny celní stanice již za časů Athéňana Alkibiada.\nOpevněná věž na stejném ostrůvku nyní dokáže kontrolovat veškerou lodní dopravu směřující z Černého moře i do něj. Mezi věží a Konstantinopolí lze navíc k hladině pozvednout mohutný řetěz, který účinně zablokuje průjezd každé nebezpečné či nežádoucí lodi."
 building_type_maiden_tower: "$building_maiden_tower$"
 building_type_maiden_tower_desc: "$building_maiden_tower_desc$"
 building_despot_palace: "Palác despotů"
 building_despot_palace_desc: "Velkolepý palác stojí na bezpečném místě na hoře Taygetos přímo nad opevněným městem Mystras.\nSvým přepychem může soupeřit s nádherou konstantinopolských síní a je hoden pouze těch nejbohatších a nejvlivnějších správců."
 building_type_despot_palace: "$building_despot_palace$"
 building_type_despot_palace_desc: "$building_despot_palace_desc$"
 building_type_meteora_01: "Meteora"
 building_type_meteora_01_desc: "Meteora je místní označení pro úchvatný skalní útvar tvořený přírodními sloupy, které se tyčí nedaleko pohoří Pindos."
 building_meteora_01: "$building_type_meteora_01$"
 building_meteora_01_desc: "Přírodní jeskyně a prohlubně Meteory obývají asketičtí poustevníci již od počátku 9. století, žádná lidská stavba však dosud zdejší krajinu nezměnila."
 building_meteora_02: "$building_type_meteora_01$"
 building_meteora_02_desc: "S rostoucím počtem poustevnických mnichů hledajících útočiště na dutých vrcholech Meteory začaly vznikat další a další kláštery.\nLidská vláda nad nepřátelskou přírodou je zde však stále velice slabá. Kláštery jsou nesmírně obtížně dostupné a spoléhají především na žebříky, lana, ruční vytahování a #EMP modlitby#!, protože selhání vybavení vede ke smrtelnému pádu."
 building_type_mount_athos_01: "Hora Athos"
 building_type_mount_athos_01_desc: "Podle tradice plula Panna Maria z Palestiny na Kypr navštívit Lazara, přítele svého syna, který na ostrově šířil evangelium. Loď však vítr odklonil z kurzu a přinutil ji přistát zde u hory Athos. Když Maria vystoupila na břeh, užasla nad přírodní krásou kraje, požehnala mu a požádala, aby se stal její vlastní zahradou. Hlas z nebes její přání vyslyšel. Od té doby je oblast považována za svatou a žádná jiná žena do ní nesmí vstoupit."
 building_mount_athos_01: "$building_type_mount_athos_01$"
 building_mount_athos_01_desc: "Křesťanská společenství obývají tento poloostrov přinejmenším od dob císaře Konstantina I. a mniši z hory Athos se již účastnili sedmého nikajského koncilu. Řádné mnišské společenství ani trvalé budovy zde však dosud neexistují."
 building_mount_athos_02: "$building_type_mount_athos_01$"
 building_mount_athos_02_desc: "Příchod mnicha jménem Athanasios na horu Athos zahájil zakládání několika klášterů po celém poloostrově. Jako první vznikly Velká lávra a Vatopedi, oba zasvěcené Zvěstování Panny Marie. Řádné kláštery přinášejí místnímu mnišskému životu řád a pravidla."
 building_mount_athos_03: "$building_type_mount_athos_01$"
 building_mount_athos_03_desc: "Obliba hory Athos coby mnišského střediska, založená na četných výsadách udělených světskou mocí, jejím autonomním postavení, skutečně odloučeném způsobu života a vzkvétající výrobě ikon, zajišťuje po celá staletí nepřetržitý příchod nových mnichů.\nS počtem mnichů rostl také počet klášterů. Na hoře Athos jich nyní stojí dvacet, což z ní činí jedno z největších a nejvlivnějších mnišských společenství v oblasti."
 building_apollinare_nuovo: "Sant'Apollinare Nuovo"
 building_apollinare_nuovo_desc: "Bazilika Sant'Apollinare Nuovo získala svůj současný název teprve nedávno, když sem byly ze sousední baziliky v Classe přeneseny ostatky svatého Apolináře. Její historie je však mnohem delší.\nNa počátku 6. století ji nechal ostrogótský král Theodorich vysvětit jako ariánský chrám. Stavba od té doby prošla mnoha konstrukčními i výzdobnými úpravami, přesto si zachovala jedinečný sloh, elegantní směs západního a východního umění, i své úchvatné byzantské mozaiky."
 building_type_apollinare_nuovo: "$building_apollinare_nuovo$"
 building_type_apollinare_nuovo_desc: "$building_apollinare_nuovo_desc$"
 building_saint_catherine: "Klášter svaté Kateřiny"
 building_saint_catherine_desc: "Nenápadný klášter uprostřed pouště s nesmírně bohatou historií. První klášterní stavbu nechala císařovna Helena, matka císaře Konstantina, vybudovat na místě, kde se Mojžíšovi zjevil hořící keř. Císař Justinián financoval její rozšíření do podoby dnešního opevněného kláštera, který zahrnuje také Mojžíšovu studnu. Ostatky svaté Kateřiny dorazily do kláštera až několik staletí po jeho založení a daly mu současné jméno.\nKlášter vždy patřil mezi nejstarší a nejplodnější skriptoria a střediska tvorby ikon."
 building_type_saint_catherine: "$building_saint_catherine$"
 building_type_saint_catherine_desc: "$building_saint_catherine_desc$"
 building_jvari_monastery: "Klášter Džvari"
 building_jvari_monastery_desc: "Starobylý klášter vystavěný přesně na místě, kde svatá Nino při šíření křesťanství v Gruzii vztyčila zázračný kříž.\nPosvátná stavba přitahuje poutníky z celého Kavkazu."
 building_type_jvari_monastery: "$building_jvari_monastery$"
 building_type_jvari_monastery_desc: "$building_jvari_monastery_desc$"
 building_etchmiadzin_cathedral: "Katedrála ve Vagharšapatu"
 building_etchmiadzin_cathedral_desc: "Tato starobylá katedrála je historickým střediskem arménského apoštolského křesťanství. Svatý Řehoř Osvětitel ji původně založil na místě pohanského chrámu jako symbol vítězství nově přijatého náboženství Arménského království. Během sásánovského vpádu byl chrám téměř zcela zničen a o několik let později znovu vystavěn od základů.\nPo 7. století však byla katedrála opakovaně drancována a opouštěna, až postupně zchátrala. Její někdejší nádheru by mohl obnovit pouze rozsáhlý a nákladný zásah."
 building_type_etchmiadzin_cathedral: "$building_etchmiadzin_cathedral$"
 building_type_etchmiadzin_cathedral_desc: "$building_etchmiadzin_cathedral_desc$"
 building_cattolica_stilo: "Cattolica di Stilo"
 building_cattolica_stilo_desc: "Byzantský vliv je na této stavbě nepřehlédnutelný. Malý kostel s baptisteriem z červených cihel spočívá na holých skalách, má půdorys „vepsaného kříže“ a bohatou freskovou výzdobu a shlíží do údolí řeky Stilaro.\nChrám je osamoceným klenotem uprostřed nehostinné přírody, kde se člověk může cítit blíže Bohu."
 building_type_cattolica_stilo: "$building_cattolica_stilo$"
 building_type_cattolica_stilo_desc: "$building_cattolica_stilo_desc$"
 building_hosios_loukas: "Hosios Lukas"
 building_hosios_loukas_desc: "Klášter je zasvěcen uchovávání ostatků ctihodného Lukáše ze Steirisu, poustevnického mnicha.\nZ posvátných ostatků údajně vytéká zázračný olej a přitahují nesčetné poutníky, kteří přespávají u hrobky v naději, že budou během spánku uzdraveni. Výzdoba interiéru je po celém východním Středomoří proslulá svou kvalitou a nádherou, neboť ji nejlepší umělci své doby obohatili mozaikami, ikonami, lustry, řezbami a drahocennými látkami."
 building_type_hosios_loukas: "$building_hosios_loukas$"
 building_type_hosios_loukas_desc: "$building_hosios_loukas_desc$"
 building_sofia_ohrid: "Chrám svaté Sofie"
 building_sofia_ohrid_desc: "Ohridská katedrála byla poprvé zničena, když do těchto zemí pronikli Slované, a obnovena byla teprve poté, co se oblast bezpečně navrátila do lůna křesťanské víry.\nJejí nejnovější podobou je kupolová bazilika bohatě vyzdobená freskovými cykly od nejlepších umělců své doby."
 building_type_sofia_ohrid: "$building_sofia_ohrid$"
 building_type_sofia_ohrid_desc: "$building_sofia_ohrid_desc$"
 building_fairy_chimneys: "Skalní sídliště"
 building_fairy_chimneys_desc: "Zdejší hornina je mimořádně tvárná a přirozeně vytváří kužely, skalní věže a jeskyně.\nLidé těchto útvarů využívají již po staletí. Nejprve v nich budovali stáje, skladiště a útočiště, poté domy a výrobní prostory a nakonec i kostely vytesané do skalních kuželů. Tak postupně vznikla celá sídliště."
 building_type_fairy_chimneys: "$building_fairy_chimneys$"
 building_type_fairy_chimneys_desc: "$building_fairy_chimneys_desc$"
 building_cilician_gates: "Kilikijská brána"
 building_cilician_gates_desc: "Kilikijská brána je průsmyk v pohoří Taurus, který spojuje kilikijské nížiny s Anatolskou plošinou.\nPrůsmyk je opevněn od nepaměti a jeho ovládnutí znamená kontrolu nad jednou z hlavních obchodních a vojenských tepen Malé Asie a Blízkého východu."
 building_type_cilician_gates: "$building_cilician_gates$"
 building_type_cilician_gates_desc: "$building_cilician_gates_desc$"
 building_swahili_port_pemba: "Obchodní přístavy na Pembě"
 building_swahili_port_pemba_desc: "Útesy, pláže a mangrovové lesy ostrova Pemba poskytují místním obyvatelům množství zátok i přírodních zdrojů, díky čemuž se ostrov stal přirozeným obchodním střediskem Zandže."
 building_type_swahili_port_pembas: "$building_swahili_port_pemba$"
 building_type_swahili_port_pemba_desc: "$building_swahili_port_pemba_desc$"
 building_swahili_port_zanzibar: "Zanzibarské obchodní přístavy"
 building_swahili_port_zanzibar_desc: "Písečné pobřeží ostrova Ungudža chráněné korálovými ostrůvky představuje dokonalé útočiště pro lodě. Obchodníci z celého Indického oceánu využívají přirozených předností Ungudži jako střediska námořního obchodu."
 building_type_swahili_port_zanzibar: "$building_swahili_port_zanzibar$"
 building_type_swahili_port_zanzibar_desc: "$building_swahili_port_zanzibar_desc$"
 building_swahili_port_mombasa: "Přístav Mombasa"
 building_swahili_port_mombasa_desc: "Mombasa leží na skalnatém ostrově obklopeném strmými útesy. Její poloha je přirozeně snadno hájitelná, a přesto zůstává mimořádně dobře přístupná námořní dopravě."
 building_type_swahili_port_mombasa: "$building_swahili_port_mombasa$"
 building_type_swahili_port_mombasa_desc: "$building_swahili_port_mombasa_desc$"
 building_swahili_port_pate: "Obchodní přístavy ostrova Pate"
 building_swahili_port_pate_desc: "Ostrov Pate leží na severním okraji svahilského území a patřil mezi první svahilské oblasti, do nichž pronikl islám a spolu s ním i obchodní sítě Blízkého východu."
 building_type_swahili_port_pate: "$building_swahili_port_pate$"
 building_type_swahili_port_pate_desc: "$building_swahili_port_pate_desc$"
 building_swahili_port_lamu: "Obchodní přístavy Lamu"
 building_swahili_port_lamu_desc: "Teplý bílý písek zdejších pláží a zářivě modrá voda líně omývající pobřeží skrývají čilý obchod, který je životodárnou silou Lamu. Místo je odedávna spojeno se zámořským obchodem a lze zde kupovat i prodávat zboží ze západních i východních končin známého světa."
 building_type_swahili_port_lamu: "$building_swahili_port_lamu$"
 building_type_swahili_port_lamu_desc: "$building_swahili_port_lamu_desc$"
 building_type_dragon_kiln_01: "Dračí pec"
 building_type_dragon_kiln_01_desc: "Tento komplex pecí vystavěný na prudkém svahu dokáže vytvářet mimořádně vysoké teploty potřebné k výrobě neobvyklé keramiky, která je vysoce ceněna jako obchodní zboží i dar."
 building_dragon_kiln_01: "Stoupající pec"
 building_dragon_kiln_01_desc: "Tato dlouhá pec vede tah ohně vodorovně a vytváří intenzivní žár, který hrnčíři potřebují k výrobě cenných misek, váz a další keramiky."
 building_dragon_kiln_02: "Pec s ochrannými pouzdry"
 building_dragon_kiln_02_desc: "Výrobu keramiky usnadňují ochranná pouzdra, prosté nádoby chránící vypalované výrobky před nečistotami a poškozením způsobeným kouřem, popelem a úlomky vznikajícími při velkoobjemové výrobě."
 building_dragon_kiln_03: "Komorová pec"
 building_dragon_kiln_03_desc: "Rozdělení hlavního ohniště pece do několika komor reguluje teplotu a dělníkům značně usnadňuje vkládání i vyjímání keramiky. Ve větším množství tak vzniká kvalitnější zboží, za které je více lidí ochotno zaplatit vyšší cenu."
 dragon_kiln_terrain_requirement_tt: "[Concept('terrain','Terén')|E] není #V $terrain_mountains$#!, #V $terrain_desert_mountains$#! ani #V $terrain_hills$#!"
 dragon_kiln_quarry_requirement_tt: "Vyžaduje [GetBuilding('quarries_01').GetName] nebo vyšší úroveň"
 TERRAIN_NOT_FARMLANDS: "Terén není $farmlands$"
 building_type_burkhan_khaldun_01: "Burchan Chaldun"
 building_type_burkhan_khaldun_01_desc: "Burchan Chaldun je nejmohutnější horou v pohoří Chentej.\nÚdajně je rodištěm mnoha mongolských hrdinů, jeho svahy pokrývají ovó a lidé zde přinášejí četné oběti v naději, že si získají jeho přízeň."
 building_burkhan_khaldun_01: "$building_type_burkhan_khaldun_01$"
 building_burkhan_khaldun_01_desc: "$building_type_burkhan_khaldun_01_desc$"
 building_pleasure_dome: "Palác rozkoší"
 building_pleasure_dome_desc: "Mongolský palác, který stejnou měrou slouží jako vojenské i kulturní středisko. Jeho největší chloubou je kašna ve tvaru stříbrného stromu, z jejíchž větví obtáčených hady vytékají různé druhy vína."
 building_type_pleasure_dome: "$building_pleasure_dome$"
 building_type_pleasure_dome_desc: "$building_pleasure_dome_desc$"
 building_type_murex_farm_01: "Lov ostranek"
 building_type_murex_farm_01_desc: "Císařský purpur je vždy velmi žádaný. Zde se loví a zpracovávají mořští plži, z nichž se toto přepychové barvivo vyrábí."
 building_murex_farm_01: "Lovci ostranek"
 building_murex_farm_01_desc: "Podél středomořského pobřeží vzniklo vzkvétající odvětví zaměřené na lov ostranek. Prodej získaných plžů přináší skromný, ale stálý příjem."
 building_murex_farm_02: "Středisko zpracování ostranek"
 building_murex_farm_02_desc: "Toto středisko účinně zpracovává ostranky a usnadňuje získávání jejich cenného sekretu. Výsledkem je kvalitnější a velmi žádané purpurové barvivo."
 building_murex_farm_03: "Barvířská varna"
 building_murex_farm_03_desc: "Specializovaná varna zpracovává sekret ostranek v účinné purpurové barvivo. Její provoz výrazně zvyšuje sytost i hodnotu výsledného odstínu."
 building_murex_farm_04: "Sušicí nádvoří"
 building_murex_farm_04_desc: "Otevřené nádvoří urychluje oxidaci barviva. Výroba purpuru tak trvá kratší dobu a celý postup je účinnější."
 building_murex_farm_05: "Cech mistrů barvířů"
 building_murex_farm_05_desc: "Cech mistrů barvířů proslulý dosahováním dokonalého odstínu tyrského purpuru zvyšuje přesnost barvení textilií. Výsledkem jsou purpurové oděvy trvale vysoké kvality."
 building_murex_farm_06: "Dílna na tkaní hedvábí"
 building_murex_farm_06_desc: "Tato dílna se specializuje na tkaní přepychových látek, například hedvábí, určených k barvení. Umožňuje vyrábět oděvy výjimečné kvality a zvyšuje jejich obchodní hodnotu."
 building_murex_farm_07: "Císařská textilní dílna"
 building_murex_farm_07_desc: "Císařská dílna se zaměřuje na hromadnou výrobu textilií barvených tyrským purpurem, čímž výrazně zvyšuje příjmy z prodeje těchto prestižních oděvů."
 building_murex_farm_08: "Královský purpurový palác"
 building_murex_farm_08_desc: "Nádherný palác zdobený motivy tyrského purpuru je symbolem bohatství a moci. Dává na odiv místní mistrovství ve výrobě tohoto vzácného barviva."
 building_type_generic_copper_mines_01: "Měděné doly"
 building_type_generic_copper_mines_01_desc: "Významný měděný důl poskytující nesmírně výnosnou měděnou rudu každému, kdo má to štěstí, že jej vlastní."
 building_generic_copper_mines_01: "Měděná hornická osada"
 building_generic_copper_mines_01_desc: "$building_rammelsberg_mines_01_desc$"
 building_generic_copper_mines_02: "Měděný důl"
 building_generic_copper_mines_02_desc: "$building_rammelsberg_mines_02_desc$"
 building_generic_copper_mines_03: "Velký měděný důl"
 building_generic_copper_mines_03_desc: "$building_rammelsberg_mines_03_desc$"
 building_generic_copper_mines_04: "Komplex měděných dolů"
 building_generic_copper_mines_04_desc: "$building_rammelsberg_mines_04_desc$"
 building_type_generic_silver_mines_01: "Stříbrné doly"
 building_type_generic_silver_mines_01_desc: "Bohatý stříbrný důl zajišťující stálý přísun cenného stříbra."
 building_generic_silver_mines_01: "Stříbrná hornická osada"
 building_generic_silver_mines_01_desc: "$building_rammelsberg_mines_01_desc$"
 building_generic_silver_mines_02: "Stříbrný důl"
 building_generic_silver_mines_02_desc: "$building_rammelsberg_mines_02_desc$"
