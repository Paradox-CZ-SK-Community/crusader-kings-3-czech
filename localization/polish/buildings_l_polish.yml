 idjang_forts_3: "$idjang_forts$ III" # todo: NEW TRANSLATION
 idjang_forts_4: "$idjang_forts$ IV" # todo: NEW TRANSLATION
 idjang_forts_5: "$idjang_forts$ V" # todo: NEW TRANSLATION
 building_idjang_forts_01: "Palisádový idžang"
 building_idjang_forts_01_desc: "Obranyschopnou vyvýšeninu korunuje dřevěná palisáda a nájezdníky odrazují strážní ohně i suché příkopy."
 building_idjang_forts_02: "Kamenný idžang"
 building_idjang_forts_02_desc: "Na nejdůležitějších místech nahrazují dřevo opěrné zdi z lomového kamene a kryté cesty umožňují obráncům bezpečný pohyb."
 building_idjang_forts_03: "Terasový idžang"
 building_idjang_forts_03_desc: "Stupňovité přístupové cesty, výpadová schodiště a střelecké plošiny vytvářejí smrtící úhly pro šípy i oštěpy."
 building_idjang_forts_04: "Citadela idžang"
 building_idjang_forts_04_desc: "Brána, vnitřní donjon a cisterna umožňují posádce vzdorovat po celá roční období."
 building_type_wantilan_01: "Vantilan"
 building_type_wantilan_01_desc: "Rozlehlé otevřené síně bez stěn a obecní pavilony určené ke shromážděním, obřadům a vystoupením."
 building_wantilan_01: "Malý vantilan"
 building_wantilan_01_desc: "Vesnická síň hostí odvody, přísahy i zkoušky a stařešinové zde urovnávají sváry dříve, než propuknou."
 building_wantilan_02: "Pavilon vantilan"
 building_wantilan_02_desc: "Široká síň s víceúrovňovou střechou hostí slavnosti a iniciační obřady, při nichž společné rituály posilují morálku i prestiž."
 building_wantilan_03: "Chrámový vantilan"
 building_wantilan_03_desc: "Obřadní prostor spojený s místní svatyní poskytuje dostatek místa pro obětiny a procesí."
 building_wantilan_04: "Velký vantilan"
 building_wantilan_04_desc: "Významná aréna, v níž bubeníci, tanečníci a velitelé sdílejí jedinou střechu."
 building_type_military_academy_01: "Vojenské akademie"
 building_type_military_academy_01_desc: "Specializovaná zařízení pro výcvik důstojníků a rytířů zvyšují jejich účinnost v boji."
 military_academy_01: "$building_type_military_academy_01$" # todo: NEW TRANSLATION
 building_military_academy_01_desc: "Uchazeči o důstojnickou dráhu jsou ve vojenské škole posuzováni podle zásluh. Škola samozřejmě přijímá pouze studenty urozeného původu."
 military_academy_02: "$building_type_military_academy_01$ II" # todo: NEW TRANSLATION
 building_military_academy_02_desc: "Vzdělávají se zde důstojníci středních a vyšších hodností, kteří získávají hlubší znalosti o přesunech vojsk, přípravě bojiště a podmínkách během bitvy."
 military_academy_03: "$building_type_military_academy_01$ III" # todo: NEW TRANSLATION
 building_military_academy_03_desc: "Velkolepá vojenská akademie je tepajícím srdcem vyspělého vojenského aparátu. Zdejší důstojníci se učí polní strategii, organizaci armády i nejnovějším technologickým pokrokům ve válčení."
 military_academy_04: "$building_type_military_academy_01$ IV" # todo: NEW TRANSLATION
 military_academy_05: "$building_type_military_academy_01$ V" # todo: NEW TRANSLATION
 building_type_march_01: "Marky"
 building_type_march_01_desc: "Páni pohraničních marek chrání hranice pomocí opevnění a místních posádek."
 marches_effect_desc: "Snižuje pravděpodobnost zvláštních [Concept('raid_intents','záměrů nájezdu')|E]"
 marches_effect_2_desc: "Blokuje zvláštní [Concept('raid_intents','záměry nájezdu')|E]"
 march_01: "$building_type_march_01$" # todo: NEW TRANSLATION
 building_march_01_desc: "Marky vznikají v nejzranitelnějších a nejodlehlejších částech vévodství, které chrání před útoky. Jsou sice roztroušené daleko od sebe, ale slouží jako užitečný výstražný systém a občas dopadnou i nějakého pašeráka."
 march_02: "$building_type_march_01$ II" # todo: NEW TRANSLATION
 building_march_02_desc: "Soustava pánů marek se rozšiřuje podél celé hranice a vytváří souvislou obrannou linii."
 march_03: "$building_type_march_01$ III" # todo: NEW TRANSLATION
 building_march_03_desc: "Po celém vévodství vznikají rozsáhlá opevnění marek, která výrazně ztěžují postup každého útočného vojska."
 march_04: "$building_type_march_01$ IV" # todo: NEW TRANSLATION
 march_05: "$building_type_march_01$ V" # todo: NEW TRANSLATION
 building_type_siege_works_01: "Obléhací provozy"
 building_type_siege_works_01_desc: "Specializované obléhací provozy umožňují vládci nasazovat a udržovat obléhací stroje vynikající kvality."
 siege_works_01: "$building_type_siege_works_01$" # todo: NEW TRANSLATION
 building_siege_works_01_desc: "Specializované a sjednocené výrobní postupy zajišťují rychlejší a nepřetržitý přísun obléhacích strojů."
 siege_works_02: "$building_type_siege_works_01$ II" # todo: NEW TRANSLATION
 building_siege_works_02_desc: "K nasazení nejpokročilejších zbraní obléhacího válčení, trebuchetů, jsou zapotřebí specializovaní stavitelé."
 siege_works_03: "$building_type_siege_works_01$ III" # todo: NEW TRANSLATION
 building_siege_works_03_desc: "Děla jsou nejnovější zbraní, která se objevila na bojištích. Jsou hlučná, těžká a obtížně ovladatelná, proti kamenným opevněním však smrtící. Schopnost vyrábět a nasazovat děla nám poskytuje nespornou výhodu nad nepřáteli."
 siege_works_04: "$building_type_siege_works_01$ IV" # todo: NEW TRANSLATION
 siege_works_05: "$building_type_siege_works_01$ V" # todo: NEW TRANSLATION
 building_type_royal_armory_01: "Královská zbrojnice" # todo: CHANGED (predtym: Královské zbrojnice)
 building_type_royal_armory_01_desc: "Zbrojnice financované korunou zajišťují armádě stálý přísun provozuschopných zbraní a jejich údržbu."
 royal_armory_01: "$building_type_royal_armory_01$" # todo: NEW TRANSLATION
 building_royal_armory_01_desc: "Za války mohou selští odvedenci dostat zbraň ze skladu. Většinou jde o staré rezavé sekery, praskající kopí a tupé čepele, ale po troše údržby jsou mnohem účinnější než běžné zemědělské náčiní, kterým bývají odvedenci vyzbrojeni."
 royal_armory_02: "$building_type_royal_armory_01$ II" # todo: NEW TRANSLATION
 building_royal_armory_02_desc: "Zbrojnice spravované korunou shromažďují a udržují zbraně i zbroj pro válku. Jejich slušná kvalita dokáže z každého opilého povaleče udělat řádně vyhlížejícího vojáka, i když se podle toho nemusí chovat."
 royal_armory_03: "$building_type_royal_armory_01$ III" # todo: NEW TRANSLATION
 building_royal_armory_03_desc: "Královský arzenál uchovává a udržuje ohromné množství zbraní, které postačuje k rychlému vyzbrojení bezpočtu selských odvedenců a přilákání nejlepších žoldnéřů v zemi."
 royal_armory_04: "$building_type_royal_armory_01$ IV" # todo: NEW TRANSLATION
 royal_armory_05: "$building_type_royal_armory_01$ V" # todo: NEW TRANSLATION
 building_type_jousting_lists_01: "Kolbiště"
 building_type_jousting_lists_01_desc: "Vyhrazená kolbiště podporují více jezdců a rytířů, aby trénovali a připojovali se k praporům."
 jousting_lists_01: "$building_type_jousting_lists_01$" # todo: NEW TRANSLATION
 building_jousting_lists_01_desc: "Po celý rok se udržuje volné prostranství určené k výcviku jezdců a rytířů."
 jousting_lists_02: "$building_type_jousting_lists_01$ II" # todo: NEW TRANSLATION
 building_jousting_lists_02_desc: "Turnajová kolbiště s ohradami pro souboje a tribunami pro diváky přitahují ohromné množství soutěžících."
 jousting_lists_03: "$building_type_jousting_lists_01$ III" # todo: NEW TRANSLATION
 building_jousting_lists_03_desc: "Turnajová aréna rozšířená o sedadla pro královské hosty a větší tržiště je skutečně působivá."
 jousting_lists_04: "$building_type_jousting_lists_01$ IV" # todo: NEW TRANSLATION
 jousting_lists_05: "$building_type_jousting_lists_01$ V" # todo: NEW TRANSLATION
 building_type_blacksmiths_01: "Kovárny" # todo: CHANGED (predtym: Korunní kovárny)
 building_type_blacksmiths_01_desc: "Kováři ve službách koruny vyrábějí zbraně a zbroj pro královskou gardu a zajišťují jí stálý přísun výtečné výzbroje."
 blacksmiths_01: "$building_type_blacksmiths_01$" # todo: NEW TRANSLATION
 building_blacksmiths_01_desc: "Koruna zaměstnává nejlepší a nejvýkonnější kováře, kteří pro královskou gardu vyrábějí meče, kroužkovou zbroj a píky."
 blacksmiths_02: "$building_type_blacksmiths_01$ II" # todo: NEW TRANSLATION
 building_blacksmiths_02_desc: "Spolupráce s různými cechy umožňuje levně vyrábět velké množství výstroje na objednávku."
 blacksmiths_03: "$building_type_blacksmiths_01$ III" # todo: NEW TRANSLATION
 building_blacksmiths_03_desc: "Rozsáhlé výhně vznikají výhradně za účelem zásobování koruny zbraněmi a pracují v nich pouze ti nejlepší kováři."
 blacksmiths_04: "$building_type_blacksmiths_01$ IV" # todo: NEW TRANSLATION
 blacksmiths_05: "$building_type_blacksmiths_01$ V" # todo: NEW TRANSLATION
 building_type_archery_ranges_01: "Lukostřelecká cvičiště"
 building_type_archery_ranges_01_desc: "Vyhrazená lukostřelecká cvičiště umožňují prostému lidu trénovat s luky a zkušeným lučištníkům zdokonalovat své schopnosti."
 archery_ranges_01: "$building_type_archery_ranges_01$" # todo: NEW TRANSLATION
 building_archery_ranges_01_desc: "Na lukostřelecké střelnici jsou vítáni bohatí i chudí. Důvody jsou dva. Rolníci schopní zacházet s lukem jsou užitečnější ve válce a zkušení střelci se díky turnajům udržují ve špičkové formě."
 archery_ranges_02: "$building_type_archery_ranges_01$ II" # todo: NEW TRANSLATION
 building_archery_ranges_02_desc: "Koruna zaměstnává nejlepší lukostrojaře, kteří ve zvlášť vybudovaných dílnách vyrábějí luky nejvyšší možné kvality."
 archery_ranges_03: "$building_type_archery_ranges_01$ III" # todo: NEW TRANSLATION
 building_archery_ranges_03_desc: "Tato zvláštní cvičiště mají inspirovat rolníky a poskytnout našim střelcům dostatečnou výzvu při výcviku střelby na dlouhou vzdálenost."
 archery_ranges_04: "$building_type_archery_ranges_01$ IV" # todo: NEW TRANSLATION
 archery_ranges_05: "$building_type_archery_ranges_01$ V" # todo: NEW TRANSLATION
 building_type_leisure_palace_01: "Palác oddechu" # todo: CHANGED (predtym: Paláce oddechu)
 building_type_leisure_palace_01_desc: "Pobývat v jednom okázale přepychovém paláci je příjemné, ale možnost vybrat si z několika nikdy neuškodí."
 leisure_palace_01: "$building_type_leisure_palace_01$" # todo: NEW TRANSLATION
 building_leisure_palace_01_desc: "Když se břemeno povinností stane nesnesitelným nebo se branami probíjí rozzuřený dav rolníků, není nad vzdálený venkovský zámeček, kde si lze neplánovaně odpočinout!"
 leisure_palace_02: "$building_type_leisure_palace_01$ II" # todo: NEW TRANSLATION
 building_leisure_palace_02_desc: "Letní palác stojí v malebné části vévodství, daleko od všedních životů našich lopotících se poddaných. Sotva lze lépe předvést královskou moc a prestiž i prostý fakt, že jsme #emphasis lepší#! než všichni ostatní."
 leisure_palace_03: "$building_type_leisure_palace_01$ III" # todo: NEW TRANSLATION
 building_leisure_palace_03_desc: "Zimní palác je určen k pobytu královské rodiny během drsnějších měsíců roku. S dobře zásobenou spižírnou a snadno hájitelnou polohou se tyčí nad všemi promrzlými poddanými, kteří mají tu čest pracovat poblíž."
 leisure_palace_04: "$building_type_leisure_palace_01$ IV" # todo: NEW TRANSLATION
 leisure_palace_05: "$building_type_leisure_palace_01$ V" # todo: NEW TRANSLATION
 chateau_01: "Chateau" # todo: NEW TRANSLATION
 chateau_02: "$chateau_01$ II" # todo: NEW TRANSLATION
 chateau_03: "$chateau_01$ III" # todo: NEW TRANSLATION
 chateau_04: "$chateau_01$ IV" # todo: NEW TRANSLATION
 chateau_05: "$chateau_01$ V" # todo: NEW TRANSLATION
 building_type_royal_forest_01: "Královský hvozd" # todo: CHANGED (predtym: Královské hvozdy)
 building_type_royal_forest_01_desc: "Královský hvozd je cenným zdrojem bohatství. Umožňuje v provincii obejít zemské právo, odejmout místním jejich práva a následně jim je prodat zpět. Netřeba dodávat, že i lov je zde znamenitý."
 royal_forest_01: "$building_type_royal_forest_01$" # todo: NEW TRANSLATION
 building_royal_forest_01_desc: "Rozsáhlé části lesů v tomto vévodství jsou vyhrazeny královské rodině. Rolníkům je zakázáno v lesích žít, lovit zvěř či kácet stromy kvůli obdělávání půdy. Obzvláště přísně je zakázáno napadat projíždějící královské výběrčí daní."
 royal_forest_02: "$building_type_royal_forest_01$ II" # todo: NEW TRANSLATION
 building_royal_forest_02_desc: "Královský hvozd nyní pohlcuje celá města a okolní osady často zjišťují, že panovníkovi muži „objevili“ mapy, podle nichž se jejich obydlí nacházejí hluboko uvnitř zdejších korunních lesů."
 royal_forest_03: "$building_type_royal_forest_01$ III" # todo: NEW TRANSLATION
 building_royal_forest_03_desc: "Zákon je jen tak účinný jako soustava, která jej prosazuje. Tento královský hvozd nyní spravuje celý systém soudů, strážců a písařů podporovaných vyškolenými soudci, kteří jsou připraveni vymáhat příkazy koruny."
 royal_forest_04: "$building_type_royal_forest_01$ IV" # todo: NEW TRANSLATION
 royal_forest_05: "$building_type_royal_forest_01$ V" # todo: NEW TRANSLATION
 building_type_royal_garden_01: "Královská zahrada" # todo: CHANGED (predtym: Královské zahrady)
 building_type_royal_garden_01_desc: "Jen málokteré místo umožňuje odpočívat a setkávat se tak příjemně jako krásná zahrada. Většině lidí by postačila malá soukromá zahrádka, ale pro bohaté a mocné je dost dobré pouze to nejvelkolepější dílo!"
 royal_garden_01: "$building_type_royal_garden_01$" # todo: NEW TRANSLATION
 building_royal_garden_01_desc: "Malá zahrada obehnaná kamennými zdmi poskytuje útočiště klidu a pohodlí, které odstiňuje ruch okolního světa."
 royal_garden_02: "$building_type_royal_garden_01$ II" # todo: NEW TRANSLATION
 building_royal_garden_02_desc: "Rozsáhlá a působivá zahrada plná květin, bylin, ovocných stromů a všeho mezi tím. O její neustálou údržbu pečuje početný zástup zahradníků."
 royal_garden_03: "$building_type_royal_garden_01$ III" # todo: NEW TRANSLATION
 building_royal_garden_03_desc: "Královský park je rozlehlá a nádherná krajina pečlivě začleněná do okolního terénu a architektury. Je přístupný všem a naplňuje úžasem návštěvníky ze širokého okolí."
 royal_garden_04: "$building_type_royal_garden_01$ IV" # todo: NEW TRANSLATION
 royal_garden_05: "$building_type_royal_garden_01$ V" # todo: NEW TRANSLATION
 building_type_ananda_temple_01: "Chrám Ánanda"
 building_type_ananda_temple_01_desc: "Přestože jsou Bagan a okolní pláně posety tisíci pagod, chrámů a svatyní, chrám Ánanda mezi nimi představuje vrcholné dílo. Dokonale proporční stavba ukrývá množství jedinečných desek a kamenných vyobrazení. Slouží jako místo bohoslužeb i středisko vzdělanosti, které lidem předává náboženské zásady."
 ananda_temple_01: "$building_type_ananda_temple_01$" # todo: NEW TRANSLATION
 ananda_temple_01_desc: "$building_type_ananda_temple_01_desc$" # todo: NEW TRANSLATION
 building_type_hotin_fort_01: "Chotynské opevnění"
 building_type_hotin_fort_01_desc: "Chotynská tvrz je malé opevnění vystavěné na břehu Dněstru. Její poloha umožňuje chránit místní obchodní cesty a poskytuje vlastníkovi kontrolu nad řekou."
 hotin_fort_01: "Chotynská pevnost" # todo: NEW TRANSLATION
 hotin_fort_01_desc: "$building_type_hotin_fort_01_desc$" # todo: NEW TRANSLATION
 hotin_fort_02: "Chotynská tvrz" # todo: NEW TRANSLATION
 hotin_fort_02_desc: "Impozantní tvrz, vedle níž stará pevnost bledne. Opevnění se během staletí rozrostlo o vysoké kamenné hradby, široký příkop a několik mohutných věží. Tato obranná stavba snadno odrazí většinu obléhatelů." # todo: NEW TRANSLATION
 building_type_golden_gate_of_kiev_01: "Zlatá brána v Kyjevě"
 building_type_golden_gate_of_kiev_01_desc: "Zlatá brána v Kyjevě, vystavěná podle vzoru stejnojmenné brány v Konstantinopoli, slouží zároveň jako vstup do města a vítězný oblouk. Zlatá kupole chrámu postaveného nad bránou je viditelná zdaleka a činí z ní významný symbol Kyjeva."
 golden_gate_of_kiev_01: "$building_type_golden_gate_of_kiev_01$" # todo: NEW TRANSLATION
 golden_gate_of_kiev_01_desc: "$building_type_golden_gate_of_kiev_01_desc$" # todo: NEW TRANSLATION
 building_type_heddal_stave_church_01: "Sloupový kostel v Heddalu"
 building_type_heddal_stave_church_01_desc: "Sloupový kostel v Heddalu je největším sloupovým kostelem v Norsku a má nádherný dřevěný interiér. Podle pověsti jej za pouhé tři dny vystavěl horský troll."
 heddal_stave_church_01: "$building_type_heddal_stave_church_01$" # todo: NEW TRANSLATION
 heddal_stave_church_01_desc: "$building_type_heddal_stave_church_01_desc$" # todo: NEW TRANSLATION
 building_type_temple_of_uppsala_01: "Chrám v Uppsale"
 building_type_temple_of_uppsala_01_desc: "Chrám v Uppsale slouží jako náboženské středisko rozsáhlých částí Skandinávie. Poblíž chrámu stojí vedle studny posvátný strom připomínající bájný Yggdrasil."
 temple_of_uppsala_01: "$building_type_temple_of_uppsala_01$" # todo: NEW TRANSLATION
 temple_of_uppsala_01_desc: "$building_type_temple_of_uppsala_01_desc$" # todo: NEW TRANSLATION
 temple_of_uppsala_02: "Upp salská katedrála" # todo: NEW TRANSLATION
 temple_of_uppsala_02_desc: "Vznešená katedrála postavená tak, aby se vyrovnala nejskvostnějším stavbám jižní Evropy. Uppsalská katedrála slouží jako pohřebiště některých nejvýznamnějších švédských panovníků a uchovává několik ostatků svatých." # todo: NEW TRANSLATION
 building_type_lund_cathedral_01: "Lundská katedrála"
 building_type_lund_cathedral_01_desc: "Lundská katedrála je nádherný chrám bohatě zdobený kamennými sochami. Stavba ovlivněná románskou architekturou se v mnohém podobá kostelům v Německu. Je zasvěcena svatému Vavřinci, patronovi Lundu."
 lund_cathedral_01: "$building_type_lund_cathedral_01$" # todo: NEW TRANSLATION
 lund_cathedral_01_desc: "$building_type_lund_cathedral_01_desc$" # todo: NEW TRANSLATION
 building_type_danevirke_01: "Danevirke"
 building_type_danevirke_01_desc: "Danevirke je rozsáhlé zemní opevnění vystavěné k zamezení vpádů z kontinentu na dánské území. Od svého vzniku bylo již několikrát rozšířeno."
 danevirke_01: "$building_type_danevirke_01$" # todo: NEW TRANSLATION
 danevirke_01_desc: "$building_type_danevirke_01_desc$" # todo: NEW TRANSLATION
 building_type_aljaferia_palace_01: "Aljafería"
 building_type_aljaferia_palace_01_desc: "Aljafería je mohutný opevněný palác vystavěný na planině Saría a svědčí o moci a bohatství Zaragozy. Je stejně impozantní jako nádherná a představuje zároveň hrozivou pevnost i vrchol iberské architektury."
 aljaferia_palace_01: "$building_type_aljaferia_palace_01$" # todo: NEW TRANSLATION
 aljaferia_palace_01_desc: "$building_type_aljaferia_palace_01_desc$" # todo: NEW TRANSLATION
 building_type_roman_wall_of_lugo_01: "Římské hradby v Lugu"
 building_type_roman_wall_of_lugo_01_desc: "Mohutné hradby v Lugu, které před dávnými časy vystavěli Římané, zůstávají působivou podívanou. Poutníci procházejí jejich pěti branami na cestě do Santiaga de Compostela, což jejich putování dodává ještě hlubší význam."
 roman_wall_of_lugo_01: "$building_type_roman_wall_of_lugo_01$" # todo: NEW TRANSLATION
 roman_wall_of_lugo_01_desc: "$building_type_roman_wall_of_lugo_01_desc$" # todo: NEW TRANSLATION
 building_type_rock_of_gibraltar_01: "Gibraltarská skála"
 building_type_rock_of_gibraltar_01_desc: "Monolitická Gibraltarská skála shlíží na úzký průliv tvořící bránu do Středozemního moře. Ve starověku představovala jeden z Herkulových sloupů, které údajně označovaly konec známého světa. Při pohledu na ni si nelze nepoložit otázku, co leží za ní."
 rock_of_gibraltar_01: "$building_type_rock_of_gibraltar_01$" # todo: NEW TRANSLATION
 rock_of_gibraltar_01_desc: "$building_type_rock_of_gibraltar_01_desc$" # todo: NEW TRANSLATION
 building_type_tower_of_hercules_01: "Farum Brigantium"
 building_type_tower_of_hercules_01_desc: "Tento starověký maják byl údajně vystavěn podle své slavnější sestry v Alexandrii. Po nesčetná staletí ukazoval cestu mořeplavcům a dodnes má velký význam pro pobřežní obchod Galicie. Někteří tvrdí, že lze z vrcholu osamělé věže zahlédnout zelené břehy Irska, při pohledu do dáli však vidíš jen nekonečné moře."
 tower_of_hercules_01: "$building_type_tower_of_hercules_01$" # todo: NEW TRANSLATION
 tower_of_hercules_01_desc: "$building_type_tower_of_hercules_01_desc$" # todo: NEW TRANSLATION
 building_type_city_wall_of_toledo_01: "Městské hradby v Toledu"
 building_type_city_wall_of_toledo_01_desc: "Tyto mohutné hradby původně vystavěli již dávní Římané a později je výrazně rozšířil vizigótský král Wamba. První arabští vládci je ještě více rozšířili a vytvořili obrannou soustavu hodnou Města králů."
 city_wall_of_toledo_01: "$building_type_city_wall_of_toledo_01$" # todo: NEW TRANSLATION
 city_wall_of_toledo_01_desc: "$building_type_city_wall_of_toledo_01_desc$" # todo: NEW TRANSLATION
 building_type_alcazar_of_segovia_01: "Alcázar v Segovii"
 building_type_alcazar_of_segovia_01_desc: "Tato pevnost vystupuje ze skalnatého útesu jako příď lodi a nabízí úchvatnou podívanou. Je stejně majestátní jako nedobytná a představuje největší ze všech hradů v království hradů, Kastilii."
 alcazar_of_segovia_01: "$building_type_alcazar_of_segovia_01$" # todo: NEW TRANSLATION
 alcazar_of_segovia_01_desc: "$building_type_alcazar_of_segovia_01_desc$" # todo: NEW TRANSLATION
 building_type_holy_site_basilica_santiago_01: "Katedrála v Santiagu de Compostela"
 building_type_holy_site_basilica_santiago_01_desc: "Tato nádherná stavba, vybudovaná nad hrobem svatého Jakuba Staršího, je cílem Svatojakubské cesty a korunou jednoho z nejvýznamnějších míst křesťanstva. Ve velkých počtech sem přicházejí poutníci z celé západní a severní Evropy, kteří hovoří desítkami jazyků, ačkoli mnozí úžasem oněmí."
 holy_site_basilica_santiago_01: "$building_type_holy_site_basilica_santiago_01$" # todo: NEW TRANSLATION
 holy_site_basilica_santiago_01_desc: "$building_type_holy_site_basilica_santiago_01_desc$" # todo: NEW TRANSLATION
 building_type_charnel_grounds_01: "Pohřebiště pod širým nebem"
 building_type_charnel_grounds_01_desc: "Tato otevřená prostranství slouží zároveň k duchovní očistě i poslednímu odpočinku mrtvých a poskytují místo, kde se mohou těla rozložit."
 charnel_grounds_01: "$building_type_charnel_grounds_01$" # todo: NEW TRANSLATION
 building_charnel_grounds_01_desc: "Těla uložená na vrcholu kopce bělají na slunci, rozkládají se a stávají se potravou dravých ptáků."
 charnel_grounds_02: "$building_type_charnel_grounds_01$ II" # todo: NEW TRANSLATION
 building_charnel_grounds_02_desc: "Toto místo je zčásti náboženským areálem a zčásti pohřebištěm, kde jsou rozkládající se těla mrtvých držena daleko od živých."
 charnel_grounds_03: "$building_type_charnel_grounds_01$ III" # todo: NEW TRANSLATION
 building_charnel_grounds_03_desc: "Krajinu pokrývají těla a váčky s vonnými látkami jen částečně potlačují zápach kolem stezek, po nichž živí přinášejí živlům nové obětiny."
 charnel_grounds_04: "$building_type_charnel_grounds_01$ IV" # todo: NEW TRANSLATION
 charnel_grounds_05: "$building_type_charnel_grounds_01$ V" # todo: NEW TRANSLATION
 building_type_imam_reza_shrine_01: "Svatyně imáma Rezy"
 building_type_imam_reza_shrine_01_desc: "Tato svatyně ukrývá ostatky Alího ar-Ridá, kterého část šíitů uctívá jako osmého imáma a který byl v této zemi umučen. Neustále se rozrůstající komplex zahrnuje jeho hrobku, modlitební síně, knihovnu i bazar a s přílivem a odlivem poutníků a karavan nabývá rozmanité, avšak velkolepé podoby."
 imam_reza_shrine_01: "$building_type_imam_reza_shrine_01$" # todo: NEW TRANSLATION
 imam_reza_shrine_01_desc: "$building_type_imam_reza_shrine_01_desc$" # todo: NEW TRANSLATION
 building_type_soltaniyeh_01: "Dóm v Soltáníji"
 building_type_soltaniyeh_01_desc: "Tato stavba, která je chrámem i mauzoleem, svou velkolepostí a vytříbenou souměrností jistě inspiruje mnohá budoucí díla. Její mohutná dvouplášťová kupole je obložena tyrkysem a svou velikostí téměř působí jako výzva samotným nebesům."
 soltaniyeh_01: "$building_type_soltaniyeh_01$" # todo: NEW TRANSLATION
 soltaniyeh_01_desc: "$building_type_soltaniyeh_01_desc$" # todo: NEW TRANSLATION
 building_type_palace_of_ctesiphon_01: "Ruiny paláce v Ktésifóntu"
 building_type_palace_of_ctesiphon_01_desc: "Tato starobylá stavba bývala obřadním sídlem sásánovských králů králů, její kdysi nádherné síně však umlkly a květiny v zahradách již nekvetou. Mnoho stavebního materiálu bylo odvezeno při zakládání Bagdádu a zdejší lidé se rozprchli do všech světových stran. Přesto zde přetrvává znepokojivá nádhera a doznívající sláva dávných časů."
 palace_of_ctesiphon_01: "$building_type_palace_of_ctesiphon_01$" # todo: NEW TRANSLATION
 palace_of_ctesiphon_01_desc: "$building_type_palace_of_ctesiphon_01_desc$" # todo: NEW TRANSLATION
 building_type_palace_of_ctesiphon_02: "Velkolepý palác v Ktésifóntu"
 building_type_palace_of_ctesiphon_02_desc: "Sídlu dávných králů se po přestavbě navrátila veškerá jeho sláva. Zahrady opět kvetou a síně znovu naplňuje hudba a nádhera. Návštěvníci přicházejí zblízka i zdaleka, aby spatřili mohutný oblouk otevřeného trůnního sálu, dávno zapomenutý div starověkého světa, který nyní konečně nalezl své místo v písních."
 palace_of_ctesiphon_02: "$building_type_palace_of_ctesiphon_02$" # todo: NEW TRANSLATION
 palace_of_ctesiphon_02_desc: "$building_type_palace_of_ctesiphon_02_desc$" # todo: NEW TRANSLATION
 building_type_falak_ol_aflak_citadel_01: "Falak ol-Aflak"
 building_type_falak_ol_aflak_citadel_01_desc: "Tato sásánovská pevnost z nepálených cihel stojí na vrcholu kopce nad městem Chorramábád a dodnes nabízí působivou podívanou. Obyvatelé údolí ji nazývají #italic Falak ol-Aflak#! neboli „Nebe nebes“, protože jim připadá, jako by spočívala na samotném vrcholu světa. Za jejími pevnými zdmi často nacházeli útočiště."
 falak_ol_aflak_citadel_01: "$building_type_falak_ol_aflak_citadel_01$" # todo: NEW TRANSLATION
 falak_ol_aflak_citadel_01_desc: "$building_type_falak_ol_aflak_citadel_01_desc$" # todo: NEW TRANSLATION
 building_type_minarets_and_remains_of_jam_01: "Minaret v Džámu"
 building_type_minarets_and_remains_of_jam_01_desc: "Tato stavba se tyčí nad údolím řeky Hari a pokrývají ji štukové ozdoby, glazované dlaždice a střídající se pásy kaligrafie. Je vytříbeným dokladem toho, čeho mohou víra a bohatství dosáhnout i v těchto odlehlých a drsných zemích."
 minarets_and_remains_of_jam_01: "$building_type_minarets_and_remains_of_jam_01$" # todo: NEW TRANSLATION
 minarets_and_remains_of_jam_01_desc: "$building_type_minarets_and_remains_of_jam_01_desc$" # todo: NEW TRANSLATION
 building_type_great_wall_of_gorgan_01: "Velká zeď v Gorgánu"
 building_type_great_wall_of_gorgan_01_desc: "Velká zeď v Gorgánu je rozsáhlá soustava opevnění, kterou dávní králové vystavěli jako hráz proti Heftalitům. Opřádá ji množství legend a údajně jejími branami [Select_CString(ROOT.Char.IsFemale,'prošla','prošel')] i sám Alexandr Veliký během tažení za dobytím Východu." # todo: GENDER FORM ROOT.Char - over, ci ROOT je postava, ktorej sa text tyka
 great_wall_of_gorgan_01: "$building_type_great_wall_of_gorgan_01$" # todo: NEW TRANSLATION
 great_wall_of_gorgan_01_desc: "$building_type_great_wall_of_gorgan_01_desc$" # todo: NEW TRANSLATION
 building_type_maharloo_lake_01: "Jezero Mahárlú"
 building_type_maharloo_lake_01_desc: "Ačkoli je toto sezónní jezero někdy pouhou vyschlou solnou plání, uprostřed léta získává jeho voda nádherný světle rudý odstín. Mladí básníci se shromažďují na břehu, hledí na podivuhodnou vodu a rozjímají o kráse a tajemstvích země."
 maharloo_lake_01: "$building_type_maharloo_lake_01$" # todo: NEW TRANSLATION
 maharloo_lake_01_desc: "$building_type_maharloo_lake_01_desc$" # todo: NEW TRANSLATION
 building_type_tomb_of_cyrus_01: "Hrobka Batšeby"
 building_type_tomb_of_cyrus_01_desc: "Tato starobylá hrobka z bílého vápence je údajně místem posledního odpočinku Batšeby, matky krále Šalomouna, kterou velebí mnohé víry. O místo pečují ženy a pouze jim je dovoleno vstoupit do temného nitra hrobky. O tom, co uvnitř spatřily, hovoří jen zřídka. Nedaleká voda je prý požehnaná a dokáže uzdravit lidi pokousané vzteklými psy."
 tomb_of_cyrus_01: "$building_type_tomb_of_cyrus_01$" # todo: NEW TRANSLATION
 tomb_of_cyrus_01_desc: "$building_type_tomb_of_cyrus_01_desc$" # todo: NEW TRANSLATION
 building_type_rainbow_mountains_01: "Duhové hory"
 building_type_rainbow_mountains_01_desc: "Jako by tyto hřebeny sama stvořitelská moc pomalovala všemi barvami duhy. Pásy červené, bílé, žluté, šedé, oranžové a ještě podivuhodnějších odstínů zbarvují kamenitou a poklidnou krajinu. Místní vládci sem často berou své hosty na lov, aby spatřili tento vznešený div."
 rainbow_mountains_01: "$building_type_rainbow_mountains_01$" # todo: NEW TRANSLATION
 rainbow_mountains_01_desc: "$building_type_rainbow_mountains_01_desc$" # todo: NEW TRANSLATION
 building_type_mount_damavand_01: "Hora Damávand"
 building_type_mount_damavand_01_desc: "Damávand je mohutný zasněžený vrchol opředený dávnými pověstmi. Údajně slouží jako vězení obludného tyrana Zahháka, který v něm zůstane až do konce světa. Mnoho dávných hrdinů na této hoře vykonalo velké skutky a její mocná přítomnost se dodnes dotýká duší všech, kdo k ní putují. Na svazích této spící sopky vyvěrají horké prameny, u nichž mohou znavení cestovatelé odpočívat a rozjímat o činech předků."
 mount_damavand_01: "$building_type_mount_damavand_01$" # todo: NEW TRANSLATION
 mount_damavand_01_desc: "$building_type_mount_damavand_01_desc$" # todo: NEW TRANSLATION
 building_type_holy_site_fire_temple_01: "Velkolepý chrám ohně"
 building_type_holy_site_fire_temple_01_desc: "Uvnitř této velkolepé stavby plane #italic Átaš Bahrám#! neboli Oheň vítězství, nejvznešenější a nejčistší ze všech plamenů. Byl shromážděn z blesků, královských svící, pohřebních hranic, zlatnických pecí a ohnišť asketů. Poutníci ze vzdálených zemí přicházejí tento div spatřit, zatímco mágové vykonávají zdánlivě nekonečné očistné obřady."
 holy_site_fire_temple_01: "Velký chrám ohně" # todo: NEW TRANSLATION
 holy_site_fire_temple_01_desc: "$building_type_holy_site_fire_temple_01_desc$" # todo: NEW TRANSLATION
 building_type_ark_of_bukhara_01: "Citadela Ark v Buchaře"
 building_type_ark_of_bukhara_01_desc: "Říká se, že tuto mohutnou pevnost vystavěl princ Sijávoš v mládí světa. O tři tisíce let později ji obnovili bucharští chudové, dávní vládci této oblasti, a od té doby zůstává nepřetržitě využívána. Cestovatelé zblízka i zdaleka přicházejí obdivovat stavbu, jejíchž sedm mohutných sloupů odpovídá sedmi hvězdám Velkého vozu. Především je však opevněním, jehož nádhera nahání strach."
 ark_of_bukhara_01: "$building_type_ark_of_bukhara_01$" # todo: NEW TRANSLATION
 ark_of_bukhara_01_desc: "$building_type_ark_of_bukhara_01_desc$" # todo: NEW TRANSLATION
 building_type_shah_i_zinda_01: "Šáh-i Zinda"
 building_type_shah_i_zinda_01_desc: "Název tohoto komplexu hrobek znamená #italic Živý král#! a odkazuje na Mohamedova bratrance Kusama ibn Abbáse, který je zde údajně pohřben. Mauzolea jsou poměrně malá a skromná, vyzařují však tklivou krásu, kvůli níž se mnozí zdržují mezi tichými hroby a rozjímají o pomíjivosti života."
 shah_i_zinda_01: "$building_type_shah_i_zinda_01$" # todo: NEW TRANSLATION
 shah_i_zinda_01_desc: "$building_type_shah_i_zinda_01_desc$" # todo: NEW TRANSLATION
 shah_i_zinda_02: "Nekropole Šáh-i-Zinda" # todo: NEW TRANSLATION
 shah_i_zinda_02_desc: "Rozlehlá nekropole mauzoleí, vysokých bran a klenutých průchodů obložených tyrkysovými dlaždicemi, #italic Živý král#!, je pohřebištěm prorokova bratrance a mnoha dalších velkých pánů dávných dob. Komplex se stále rozrůstá a je vznešený, tajuplný i působivý zároveň." # todo: NEW TRANSLATION
 building_type_alamut_castle_01: "Hrad Alamút"
 building_type_alamut_castle_01_desc: "Toto orlí hnízdo tyčící se na vysokém skalním útesu vystavěli Džustánovci jako pevné útočiště svého těžce zkoušeného panství. Díky úchvatné poloze a mohutným valům je podle všeho téměř nedobytné a mohlo by se stát ideální pevností pro jakoukoli bojovnou frakci či sektu, které by takto odlehlé místo vyhovovalo."
 alamut_castle_01: "$building_type_alamut_castle_01$" # todo: NEW TRANSLATION
 alamut_castle_01_desc: "$building_type_alamut_castle_01_desc$" # todo: NEW TRANSLATION
 building_type_alamut_castle_02: "Pevnost Alamút"
 building_type_alamut_castle_02_desc: "Tento hrad na vysokém skalním útesu dlouho sloužil jako odlehlé horské útočiště. Nyní byl přestavěn v hrozivou pevnost #italic fidáínů#!, v níž se mezi mohutnými opevněními nacházejí knihovny, laboratoře a poklidné zahrady. Pro některé je místem krveprolití a války, pro jiné místem duchovního odpočinku, snad však obojím zároveň."
 alamut_castle_02: "$building_type_alamut_castle_02$" # todo: NEW TRANSLATION
 alamut_castle_02_desc: "$building_type_alamut_castle_02_desc$" # todo: NEW TRANSLATION
 building_type_assassin_castle_01: "$holy_order_hashshashin$ $castle_04$" # todo: CHANGED (predtym: $holy_order_hashshashin$ $building_castle_04$)
 building_type_assassin_castle_01_desc: "$building_type_alamut_castle_02_desc$"
 assassin_castle_01: "$building_type_assassin_castle_01$" # todo: NEW TRANSLATION
 assassin_castle_01_desc: "$building_type_assassin_castle_01_desc$" # todo: NEW TRANSLATION
 building_type_qanats_01: "$qanats_06$" # todo: CHANGED (predtym: $building_qanats_06$)
 building_type_qanats_01_desc: "$qanats_05_desc$" # todo: CHANGED (predtym: $building_qanats_05_desc$)
 building_qanats_01: "Jachčál"
 building_qanats_01_desc: "Tyto kupolovité ledovny spojují podzemní skladovací prostor se žáruvzdornými stavebními materiály a vytvářejí izolované prostředí fungující jako odpařovací chladič."
 building_qanats_02: "Cisterna"
 building_qanats_02_desc: "Tyto klenuté stavby, v perštině nazývané #italic áb anbár#!, jsou zčásti zapuštěny do země a slouží k uchovávání velkého množství vody."
 building_qanats_03: "Větrné věže"
 building_qanats_03_desc: "Tyto vysoké věže jsou perským vynálezem a bývají propojeny s cisternami a dalšími budovami. Otvory obrácenými proti převládajícím větrům zachycují proudící vzduch, který následně obíhá v jejich nitru a ochlazuje je."
 building_qanats_04: "Káríz"
 building_qanats_04_desc: "Káríz představuje první stupeň podzemní vodovodní soustavy. Tvoří jej řada svislých šachet propojených mírně se svažujícím tunelem, který zachycuje podzemní vodu a přivádí ji na povrch."
 building_qanats_05: "Malé kanáty"
 qanats_05_desc: "Kanáty jsou podzemní akvadukty, které omezují ztráty vody způsobené odpařováním. Ačkoli je tento systém zatím poměrně malý, zemědělství přesto významně prospívá." # todo: NEW TRANSLATION
 qanats_06: "Kanáty" # todo: NEW TRANSLATION
 building_qanats_06_desc: "Podzemní vodovody byly rozšířeny a propojeny s místními cisternami, ledovnami a zavlažovacími soustavami."
 building_qanats_07: "Velké kanáty"
 building_qanats_07_desc: "Tato rozsáhlá soustava podzemních vodovodů se táhne na několik #italic parasangů#! a zajišťuje mohutný přísun vody zemědělcům i obyvatelům měst."
 building_qanats_08: "Mohutná soustava kanátů"
 building_qanats_08_desc: "Tato mohutná soustava podzemních vodovodů napájí nesčetné podzemní cisterny, zavlažovací kanály, ledovny, lázně, fontány a studny s pitnou vodou a je skutečným dokladem perského důmyslu a slávy."
 building_type_tower_of_silence_01: "Velká věž mlčení"
 building_type_tower_of_silence_01_desc: "Mrtví jsou položeni na otevřené věži napospas ptákům, aby neznesvětili ani zemi, ani oheň. Kosti se poté sesbírají a uloží do jámy uprostřed." # todo: CHANGED (predtym: Naše víra nás učí odevzdávat těla spravedlivých věřících zvířatům a otevřenému nebi. Duše tak zůstává čistá a společenst)
 tower_of_silence_01: "Velká věž mlčení" # todo: NEW TRANSLATION
 tower_of_silence_01_desc: "Tato plochá věž bez střechy stojí v klidné části vévodství a místní sem ukládají své mrtvé. Těla jsou uvnitř vystavena mrchožravým ptákům a žáru slunce, čímž se duše zesnulých bezpečně dostávají na onen svět a živí jsou chráněni před znečištěním. Náboženské předpisy vyžadují věž namísto tradičního pohřbívání v divočině, její přítomnost však pevně stmeluje zdejší obec." # todo: NEW TRANSLATION
 tower_of_silence_01.tt.liege_not_approve_of_burial: "[Concept('faith','Víra')|E] [Concept('liege_possessive','tvého lenního pána')|E] dovoluje tvému lidu praktikovat tradiční pohřbívání bez nutnosti stavět $building_type_event_tower_of_silence_01$"
 tower_of_silence_01.tt.county_not_tos_users: "[Concept('faith','Víra')|E] tohoto [Concept('county','hrabství')|E] se svými mrtvými takto nenakládá"
 building_type_event_tower_of_silence_01: "Věž mlčení"
 building_type_event_tower_of_silence_01_desc: "$tower_of_silence_01_desc$" # todo: CHANGED (predtym: $building_tower_of_silence_01_desc$)
 event_tower_of_silence_01: "Věž mlčení" # todo: NEW TRANSLATION
 event_tower_of_silence_01_desc: "$building_type_tower_of_silence_01_desc$" # todo: NEW TRANSLATION
 church_of_the_theotokos: "Chrám Bohorodičky" # todo: NEW TRANSLATION
 church_of_the_theotokos_desc: "Tuto nádhernou stavbu už dávno ovládl svatý kříž a porazil pohanský kult panenské bohyně Athény.\nDnes se zde nacházejí svatyně Marie Parthenos, Matky Boží a jediné Panny hodné označení #EMP svatá#!." # todo: NEW TRANSLATION
 building_type_church_of_the_theotokos: "$church_of_the_theotokos$" # todo: CHANGED (predtym: $building_church_of_the_theotokos$)
 building_type_church_of_the_theotokos_desc: "$church_of_the_theotokos_desc$" # todo: CHANGED (predtym: $building_church_of_the_theotokos_desc$)
 parthenon: "Parthenón" # todo: NEW TRANSLATION
 parthenon_desc: "Svatý chrám mocné Athény se opět hrdě tyčí, nezkažený pošetilými pověrami.\nVznešené sloupy a zdi, vztyčené před více než 1000 lety, odolaly zkoušce času a stále shůry chrání domovy věřících. Jsou němým symbolem požehnání panenské bohyně, která dala městu jméno." # todo: NEW TRANSLATION
 building_type_parthenon: "$parthenon$" # todo: CHANGED (predtym: $building_parthenon$)
 building_type_parthenon_desc: "$parthenon_desc$" # todo: CHANGED (predtym: $building_parthenon_desc$)
 hagios_demetrios: "Hagios Demetrios" # todo: NEW TRANSLATION
 hagios_demetrios_desc: "Kostel svatého Demetria je nejvýznamnější svatyní ve městě.\nByl postaven v době, kdy byla víra v Krista ještě mladá. Jeho součástí jsou římské lázně, v nichž byl světec spolu s mnoha dalšími prvními věřícími uvězněn, umučen a pohřben." # todo: NEW TRANSLATION
 building_type_hagios_demetrios: "$hagios_demetrios$" # todo: CHANGED (predtym: $building_hagios_demetrios$)
 building_type_hagios_demetrios_desc: "$hagios_demetrios_desc$" # todo: CHANGED (predtym: $building_hagios_demetrios_desc$)
 kassiopi_castle: "Hrad Kassiopi" # todo: NEW TRANSLATION
 kassiopi_castle_desc: "Impozantní opevnění na pobřeží. Díky své strategické poloze, odkud střeží průliv oddělující ostrov od pevniny, je důležitým kontrolním bodem v Jónské oblasti." # todo: NEW TRANSLATION
 building_type_kassiopi_castle: "$kassiopi_castle$" # todo: CHANGED (predtym: $building_kassiopi_castle$)
 building_type_kassiopi_castle_desc: "$kassiopi_castle_desc$" # todo: CHANGED (predtym: $building_kassiopi_castle_desc$)
 saint_lazarus: "Kostel svatého Lazara" # todo: NEW TRANSLATION
 saint_lazarus_desc: "Podle tradice byl Lazar z Betánie, kterého Kristus kdysi vzkřísil z mrtvých, po své druhé smrti pohřben ve městě Larnaka.\nJeho hrob se na staletí ztratil, ale když byl znovu nalezen, nechal císař Leo VI. převézt světcovy ostatky do Konstantinopole a nad hrobem vystavět tento impozantní kostel." # todo: NEW TRANSLATION
 building_type_saint_lazarus: "$saint_lazarus$" # todo: CHANGED (predtym: $building_saint_lazarus$)
 building_type_saint_lazarus_desc: "$saint_lazarus_desc$" # todo: CHANGED (predtym: $building_saint_lazarus_desc$)
 building_type_sumela_monastery_01: "Klášter Sumela"
 building_type_sumela_monastery_01_desc: "Počátky tohoto kláštera vystavěného na strmém útesu Černé hory jsou natolik dávné, že je téměř zahaluje tajemství. Podle některých jej ve 4. století nechal vystavět císař Theodosius, posvátný pramen a starobylé fresky však mohou být ještě starší.\nKlenotem kláštera je freska Bohorodičky, kterou údajně namaloval samotný apoštol Lukáš."
 sumela_monastery_01: "$building_type_sumela_monastery_01$" # todo: NEW TRANSLATION
 sumela_monastery_01_desc: "Klášter zpustl, ale několik císařů jej postupně obnovilo a rozšířilo. Na jeho současné podobě se nejvíce podílel císař Justinián, a to díky zásahu generála Belisaria." # todo: NEW TRANSLATION
 sumela_monastery_02: "Obnovený $building_type_sumela_monastery_01$" # todo: NEW TRANSLATION
 sumela_monastery_02_desc: "Od poslední obnovy tohoto kláštera uplynulo mnoho staletí. Nejnovější zásah mu přinesl další dědičné pozemky a poddané, osvobození od daní i císařské prostředky na výstavbu nových budov. Nejvíce z toho těžil Skalní kostel, který získal zcela nový cyklus fresek." # todo: NEW TRANSLATION
 patras_castle: "Hrad Patras" # todo: NEW TRANSLATION
 patras_castle_desc: "Archaickou akropoli města Patras, která se tyčila na kopci v pohoří Vodias, nahradilo za vlády císaře Justiniána opevnění.\nHrad se od té doby nepřetržitě používá a vždy jej chrání místní patron, svatý Ondřej, i #EMP genius loci#! Patrinella, římská socha dívky." # todo: NEW TRANSLATION
 building_type_patras_castle: "$patras_castle$" # todo: CHANGED (predtym: $building_patras_castle$)
 building_type_patras_castle_desc: "$patras_castle_desc$" # todo: CHANGED (predtym: $building_patras_castle_desc$)
 maiden_tower: "Dívčí věž" # todo: NEW TRANSLATION
 maiden_tower_desc: "Tento skalnatý ostrůvek před pobřežím sloužil jako celnice už za dob athénského Alkibiada, a to díky ideální poloze u vstupu do Bosporského průlivu.\nOpevněná věž na témže malém ostrově nyní může kontrolovat veškerý námořní provoz z Černého moře i do něj. Mezi věží a Konstantinopolí lze navíc zvednout velký řetěz až na úroveň hladiny moře a účinně tak zablokovat průjezd jakékoli nebezpečné či nežádoucí lodi." # todo: NEW TRANSLATION
 building_type_maiden_tower: "$maiden_tower$" # todo: CHANGED (predtym: $building_maiden_tower$)
 building_type_maiden_tower_desc: "$maiden_tower_desc$" # todo: CHANGED (predtym: $building_maiden_tower_desc$)
 despot_palace: "Palác despotů" # todo: NEW TRANSLATION
 despot_palace_desc: "Nádherný palác na bezpečném místě na hoře Taygetos, přímo nad opevněným městem Mystras.\nPalác nabízí veškerý přepych, který může soupeřit s velkolepostí konstantinopolských síní, a je hoden jen těch nejbohatších a nejvlivnějších guvernérů." # todo: NEW TRANSLATION
 building_type_despot_palace: "$despot_palace$" # todo: CHANGED (predtym: $building_despot_palace$)
 building_type_despot_palace_desc: "$despot_palace_desc$" # todo: CHANGED (predtym: $building_despot_palace_desc$)
 building_type_meteora_01: "Meteora"
 building_type_meteora_01_desc: "Meteora je místní označení pro úchvatný skalní útvar tvořený přírodními sloupy, které se tyčí nedaleko pohoří Pindos."
 meteora_01: "$building_type_meteora_01$" # todo: NEW TRANSLATION
 meteora_01_desc: "Přírodní jeskyně a dutiny v Meteoře obývají poustevníci-asketové už od počátku 9. století, krajinu však dosud nikdy nezměnily žádné lidské stavby." # todo: NEW TRANSLATION
 meteora_02: "$building_type_meteora_01$" # todo: NEW TRANSLATION
 meteora_02_desc: "Jak stále více poustevnických mnichů hledalo útočiště na dutých vrcholcích Meteory, začalo vznikat stále více klášterů.\nLidská nadvláda nad zdejší nehostinnou přírodou je však stále velmi křehká. Ke klášterům se lze dostat jen s velkými obtížemi, většinou po žebřících a lanech, za pomoci ručního vytahování a #EMP modliteb#!; pád při selhání vybavení znamená jistou smrt." # todo: NEW TRANSLATION
 building_type_mount_athos_01: "Hora Athos"
 building_type_mount_athos_01_desc: "Podle tradice plula Panna Maria z Palestiny na Kypr navštívit Lazara, přítele svého syna, který na ostrově šířil evangelium. Loď však vítr odklonil z kurzu a přinutil ji přistát zde u hory Athos. Když Maria vystoupila na břeh, užasla nad přírodní krásou kraje, požehnala mu a požádala, aby se stal její vlastní zahradou. Hlas z nebes její přání vyslyšel. Od té doby je oblast považována za svatou a žádná jiná žena do ní nesmí vstoupit."
 mount_athos_01: "$building_type_mount_athos_01$" # todo: NEW TRANSLATION
 mount_athos_01_desc: "Křesťanské obce obývají tento výběžek přinejmenším od dob císaře Konstantina I. a mniši z hory Athos se již účastnili sedmého nikajského koncilu. Zatím zde však neexistuje žádná řádná mnišská obec ani trvalé stavby." # todo: NEW TRANSLATION
 mount_athos_02: "$building_type_mount_athos_01$" # todo: NEW TRANSLATION
 mount_athos_02_desc: "Příchod mnicha jménem Athanasios na horu Athos zahájil zakládání několika klášterů po celém poloostrově. Prvními byly Velká lávra a Vatopedi, oba zasvěcené Zvěstování. Díky řádným klášterům získává místní mnišský život řád a pravidla." # todo: NEW TRANSLATION
 mount_athos_03: "$building_type_mount_athos_01$" # todo: NEW TRANSLATION
 mount_athos_03_desc: "Hora Athos se stala oblíbeným mnišským centrem díky četným ústupkům světské moci, vlastnímu autonomnímu statutu, skutečně odloučenému způsobu života a vzkvétající výrobě ikon. To po staletí přivádí stále nové mnichy.\nS rostoucím počtem mnichů přibývalo i klášterů. Na hoře Athos se jich nyní nachází dvacet, což z ní činí jednu z největších a nejvlivnějších mnišských obcí v oblasti." # todo: NEW TRANSLATION
 apollinare_nuovo: "Sant'Apollinare Nuovo" # todo: NEW TRANSLATION
 apollinare_nuovo_desc: "Bazilika Sant'Apollinare Nuovo získala své současné jméno teprve nedávno, když do ní byly přeneseny ostatky svatého Apolináře ze sousední baziliky v Classe. Její historie je však mnohem delší.\nBudovu nechal na počátku 6. století vysvětit ostrogótský král Theodorich jako ariánský kostel. Od té doby prošla mnoha stavebními i výzdobnými úpravami, přitom si však zachovala svůj jedinečný styl — elegantní směs západního a východního umění — i úchvatné byzantské mozaiky." # todo: NEW TRANSLATION
 building_type_apollinare_nuovo: "$apollinare_nuovo$" # todo: CHANGED (predtym: $building_apollinare_nuovo$)
 building_type_apollinare_nuovo_desc: "$apollinare_nuovo_desc$" # todo: CHANGED (predtym: $building_apollinare_nuovo_desc$)
 saint_catherine: "Klášter svaté Kateřiny" # todo: NEW TRANSLATION
 saint_catherine_desc: "Nenápadný klášter uprostřed pouště má za sebou bohatou historii. První klášterní stavbu nechala postavit matka císaře Konstantina na místě, kde se Mojžíšovi zjevil hořící keř. Císař Justinián financoval její rozšíření do podoby současného opevněného kláštera, který zahrnuje i Mojžíšovu studnu. Relikvie svaté Kateřiny dorazily do kláštera až několik staletí po jeho založení a změnily jeho jméno.\nKlášter vždy patřil k nejstarším a nejplodnějším písařským i ikonopisným střediskům." # todo: NEW TRANSLATION
 building_type_saint_catherine: "$saint_catherine$" # todo: CHANGED (predtym: $building_saint_catherine$)
 building_type_saint_catherine_desc: "$saint_catherine_desc$" # todo: CHANGED (predtym: $building_saint_catherine_desc$)
 jvari_monastery: "Klášter Džvari" # todo: NEW TRANSLATION
 jvari_monastery_desc: "Starobylý klášter stojící přesně na místě, kde svatá Nino při hlásání evangelia v Gruzii vztyčila zázračný kříž.\nSvatá stavba přitahuje poutníky z celého Kavkazu." # todo: NEW TRANSLATION
 building_type_jvari_monastery: "$jvari_monastery$" # todo: CHANGED (predtym: $building_jvari_monastery$)
 building_type_jvari_monastery_desc: "$jvari_monastery_desc$" # todo: CHANGED (predtym: $building_jvari_monastery_desc$)
 etchmiadzin_cathedral: "Katedrála ve Vagharšapatu" # todo: NEW TRANSLATION
 etchmiadzin_cathedral_desc: "Tato starobylá katedrála je historickým centrem arménského apoštolského křesťanství. Založil ji svatý Řehoř Osvětitel nad pohanským chrámem jako symbol vítězství nově přijatého náboženství Arménského království. Během sásánovské invaze byl kostel téměř celý zničen a o několik let později znovu vystavěn.\nPo 7. století však byla katedrála opakovaně vypleněna a opuštěna a postupně chátrala. Do původní slávy ji mohla vrátit jen rozsáhlá a nákladná obnova." # todo: NEW TRANSLATION
 building_type_etchmiadzin_cathedral: "$etchmiadzin_cathedral$" # todo: CHANGED (predtym: $building_etchmiadzin_cathedral$)
 building_type_etchmiadzin_cathedral_desc: "$etchmiadzin_cathedral_desc$" # todo: CHANGED (predtym: $building_etchmiadzin_cathedral_desc$)
 cattolica_stilo: "Cattolica di Stilo" # todo: NEW TRANSLATION
 cattolica_stilo_desc: "Byzantský vliv na této stavbě je výrazný: malý kostel se křtitelnicí, z červených cihel zasazených do holé skály, s půdorysem ve tvaru vepsaného kříže a bohatou výzdobou fresek, se tyčí nad údolím potoka Stilaro.\nKostel je osamělým klenotem uprostřed nehostinné přírody, kde se člověk může cítit blíže Bohu." # todo: NEW TRANSLATION
 building_type_cattolica_stilo: "$cattolica_stilo$" # todo: CHANGED (predtym: $building_cattolica_stilo$)
 building_type_cattolica_stilo_desc: "$cattolica_stilo_desc$" # todo: CHANGED (predtym: $building_cattolica_stilo_desc$)
 hosios_loukas: "Hosios Loukas" # todo: NEW TRANSLATION
 hosios_loukas_desc: "Klášter je zasvěcen uchovávání ostatků ctihodného Lukáše ze Steiris, mnicha-poustevníka.\nSvaté ostatky údajně vydávají zázračný olej a přitahují nespočet poutníků, kteří spí u hrobu v naději, že se uzdraví ve spánku. Vnitřní výzdobu proslavila po celém východním Středomoří její kvalita a bohatost: nejlepší umělci své doby ji obohatili mozaikami, ikonami, lustry, řezbami i látkami." # todo: NEW TRANSLATION
 building_type_hosios_loukas: "$hosios_loukas$" # todo: CHANGED (predtym: $building_hosios_loukas$)
 building_type_hosios_loukas_desc: "$hosios_loukas_desc$" # todo: CHANGED (predtym: $building_hosios_loukas_desc$)
 sofia_ohrid: "Kostel svaté Sofie" # todo: NEW TRANSLATION
 sofia_ohrid_desc: "Katedrála v Ochridu byla zničena při prvním vpádu Slovanů do těchto zemí a znovu vystavěna až poté, co se oblast bezpečně navrátila do lůna křesťanské víry.\nJejí poslední podoba je kupolová bazilika bohatě zdobená cykly fresek od nejlepších umělců své doby." # todo: NEW TRANSLATION
 building_type_sofia_ohrid: "$sofia_ohrid$" # todo: CHANGED (predtym: $building_sofia_ohrid$)
 building_type_sofia_ohrid_desc: "$sofia_ohrid_desc$" # todo: CHANGED (predtym: $building_sofia_ohrid_desc$)
 fairy_chimneys: "Troglodytská sídliště" # todo: NEW TRANSLATION
 fairy_chimneys_desc: "Zdejší skály jsou mimořádně tvárné a přirozeně vytvářejí kužely, vrcholky a jeskyně.\nLidé těchto útvarů po staletí využívali jako stáje, skladiště a úkryty. Později do nich vytesali obydlí a výrobní budovy, až nakonec i kostely v kamenných kuželech; tak vznikla celá sídliště." # todo: NEW TRANSLATION
 building_type_fairy_chimneys: "$fairy_chimneys$" # todo: CHANGED (predtym: $building_fairy_chimneys$)
 building_type_fairy_chimneys_desc: "$fairy_chimneys_desc$" # todo: CHANGED (predtym: $building_fairy_chimneys_desc$)
 cilician_gates: "Kilikijská brána" # todo: NEW TRANSLATION
 cilician_gates_desc: "Kilikijská brána je průsmyk v pohoří Taurus, který spojuje kilikijské nížiny s anatolskou náhorní plošinou.\nOd nepaměti je opevněna a její ovládnutí znamená kontrolu nad jednou z hlavních obchodních a vojenských tepen Malé Asie a Blízkého východu." # todo: NEW TRANSLATION
 building_type_cilician_gates: "$cilician_gates$" # todo: CHANGED (predtym: $building_cilician_gates$)
 building_type_cilician_gates_desc: "$cilician_gates_desc$" # todo: CHANGED (predtym: $building_cilician_gates_desc$)
 swahili_port_pemba: "Obchodní přístavy na Pembě" # todo: NEW TRANSLATION
 swahili_port_pemba_desc: "Korálové útesy, pláže a mangrovové lesy ostrova Pemba nabízejí množství zátok i zdrojů, díky nimž je ostrov pro zdejší obyvatele přirozeným obchodním střediskem Zandže." # todo: NEW TRANSLATION
 building_type_swahili_port_pemba: "$swahili_port_pemba$" # todo: CHANGED (predtym: $building_swahili_port_pemba$)
 building_type_swahili_port_pemba_desc: "$swahili_port_pemba_desc$" # todo: CHANGED (predtym: $building_swahili_port_pemba_desc$)
 swahili_port_zanzibar: "Obchodní přístavy na Zanzibaru" # todo: NEW TRANSLATION
 swahili_port_zanzibar_desc: "Písečné břehy ostrova Unguja, chráněné korálovými ostrůvky, tvoří dokonalé útočiště pro lodě. Obchodníci z celého Indického oceánu sem připlouvají, aby využili přirozených předností Unguji jako centra námořního obchodu." # todo: NEW TRANSLATION
 building_type_swahili_port_zanzibar: "$swahili_port_zanzibar$" # todo: CHANGED (predtym: $building_swahili_port_zanzibar$)
 building_type_swahili_port_zanzibar_desc: "$swahili_port_zanzibar_desc$" # todo: CHANGED (predtym: $building_swahili_port_zanzibar_desc$)
 swahili_port_mombasa: "Přístav Mombasa" # todo: NEW TRANSLATION
 swahili_port_mombasa_desc: "Mombasa, rozkládající se na vrcholku skalnatého ostrova obklopeného strmými útesy, má díky své poloze přirozenou obranyschopnost a zároveň zůstává jedinečně dostupná námořní dopravě." # todo: NEW TRANSLATION
 building_type_swahili_port_mombasa: "$swahili_port_mombasa$" # todo: CHANGED (predtym: $building_swahili_port_mombasa$)
 building_type_swahili_port_mombasa_desc: "$swahili_port_mombasa_desc$" # todo: CHANGED (predtym: $building_swahili_port_mombasa_desc$)
 swahili_port_pate: "Obchodní přístavy na ostrově Pate" # todo: NEW TRANSLATION
 swahili_port_pate_desc: "Ostrov Pate leží na severním okraji svahilského území. Patřil k prvním svahilským oblastem, kam pronikl islám, a tedy i obchodní sítě Blízkého východu." # todo: NEW TRANSLATION
 building_type_swahili_port_pate: "$swahili_port_pate$" # todo: CHANGED (predtym: $building_swahili_port_pate$)
 building_type_swahili_port_pate_desc: "$swahili_port_pate_desc$" # todo: CHANGED (predtym: $building_swahili_port_pate_desc$)
 swahili_port_lamu: "Obchodní přístavy Lamu" # todo: NEW TRANSLATION
 swahili_port_lamu_desc: "Teplý bílý písek zdejších pláží a zářivě modrá voda, která líně omývá břehy, skrývají čilý obchod, jenž je životní mízou Lamu. Město je již dlouho propojeno s námořním obchodem a lze tu nakupovat i prodávat zboží z východního i západního konce známého světa." # todo: NEW TRANSLATION
 building_type_swahili_port_lamu: "$swahili_port_lamu$" # todo: CHANGED (predtym: $building_swahili_port_lamu$)
 building_type_swahili_port_lamu_desc: "$swahili_port_lamu_desc$" # todo: CHANGED (predtym: $building_swahili_port_lamu_desc$)
 building_type_dragon_kiln_01: "Dračí pec"
 building_type_dragon_kiln_01_desc: "Tento komplex pecí vystavěný na prudkém svahu dokáže vytvářet mimořádně vysoké teploty potřebné k výrobě neobvyklé keramiky, která je vysoce ceněna jako obchodní zboží i dar."
 dragon_kiln_01: "$building_type_dragon_kiln_01$" # todo: NEW TRANSLATION
 building_dragon_kiln_01_desc: "Tato dlouhá pec vede tah ohně vodorovně a vytváří intenzivní žár, který hrnčíři potřebují k výrobě cenných misek, váz a další keramiky."
 dragon_kiln_02: "$building_type_dragon_kiln_01$ II" # todo: NEW TRANSLATION
 building_dragon_kiln_02_desc: "Výrobu keramiky usnadňují ochranná pouzdra, prosté nádoby chránící vypalované výrobky před nečistotami a poškozením způsobeným kouřem, popelem a úlomky vznikajícími při velkoobjemové výrobě."
 dragon_kiln_03: "$building_type_dragon_kiln_01$ III" # todo: NEW TRANSLATION
 building_dragon_kiln_03_desc: "Rozdělení hlavního ohniště pece do několika komor reguluje teplotu a dělníkům značně usnadňuje vkládání i vyjímání keramiky. Ve větším množství tak vzniká kvalitnější zboží, za které je více lidí ochotno zaplatit vyšší cenu."
 dragon_kiln_04: "$building_type_dragon_kiln_01$ IV" # todo: NEW TRANSLATION
 dragon_kiln_05: "$building_type_dragon_kiln_01$ V" # todo: NEW TRANSLATION
 dragon_kiln_terrain_requirement_tt: "[Concept('terrain','Terén')|E] není #V $terrain_mountains$#!, #V $terrain_desert_mountains$#! ani #V $terrain_hills$#!"
 only_one_mint_tt: "V [Concept('province','provincii')|E] se nenachází žádná jiná mincovna: lze postavit pouze jednu #V $mint$#! (v #V $mine_district$#!) nebo #V $bureaucratic_mint$#! (v #V $bureaucratic_district$#!)" # todo: NEW TRANSLATION
 TERRAIN_NOT_FARMLANDS: "Terén není $farmlands$"
 building_type_burkhan_khaldun_01: "Burchan Chaldun"
 building_type_burkhan_khaldun_01_desc: "Burchan Chaldun je nejmohutnější horou v pohoří Chentej.\nÚdajně je rodištěm mnoha mongolských hrdinů, jeho svahy pokrývají ovó a lidé zde přinášejí četné oběti v naději, že si získají jeho přízeň."
 burkhan_khaldun_01: "$building_type_burkhan_khaldun_01$" # todo: NEW TRANSLATION
 burkhan_khaldun_01_desc: "$building_type_burkhan_khaldun_01_desc$" # todo: NEW TRANSLATION
 pleasure_dome: "Palác rozkoší" # todo: NEW TRANSLATION
 pleasure_dome_desc: "Mongolský palác, který slouží stejnou měrou jako vojenské i kulturní centrum. Jeho největší chloubou je fontána ve tvaru stříbrného stromu, z jehož hadů ovinutých kolem sochy vytékají různé druhy vína." # todo: NEW TRANSLATION
 building_type_pleasure_dome: "$pleasure_dome$" # todo: CHANGED (predtym: $building_pleasure_dome$)
 building_type_pleasure_dome_desc: "$pleasure_dome_desc$" # todo: CHANGED (predtym: $building_pleasure_dome_desc$)
 building_type_murex_farm_01: "Lov ostranek"
 building_type_murex_farm_01_desc: "Císařský purpur je vždy velmi žádaný. Zde se loví a zpracovávají mořští plži, z nichž se toto přepychové barvivo vyrábí."
 building_murex_farm_01: "Lovci ostranek"
 building_murex_farm_01_desc: "Podél středomořského pobřeží vzniklo vzkvétající odvětví zaměřené na lov ostranek. Prodej získaných plžů přináší skromný, ale stálý příjem."
 building_murex_farm_02: "Středisko zpracování ostranek"
 building_murex_farm_02_desc: "Toto středisko účinně zpracovává ostranky a usnadňuje získávání jejich cenného sekretu. Výsledkem je kvalitnější a velmi žádané purpurové barvivo."
 building_murex_farm_03: "Barvířská varna"
 building_murex_farm_03_desc: "Specializovaná varna zpracovává sekret ostranek v účinné purpurové barvivo. Její provoz výrazně zvyšuje sytost i hodnotu výsledného odstínu."
 building_murex_farm_04: "Sušicí nádvoří"
 building_murex_farm_04_desc: "Otevřené nádvoří urychluje oxidaci barviva. Výroba purpuru tak trvá kratší dobu a celý postup je účinnější."
 building_murex_farm_05: "Cech mistrů barvířů"
 building_murex_farm_05_desc: "Cech mistrů barvířů proslulý dosahováním dokonalého odstínu tyrského purpuru zvyšuje přesnost barvení textilií. Výsledkem jsou purpurové oděvy trvale vysoké kvality."
 building_murex_farm_06: "Dílna na tkaní hedvábí"
 building_murex_farm_06_desc: "Tato dílna se specializuje na tkaní přepychových látek, například hedvábí, určených k barvení. Umožňuje vyrábět oděvy výjimečné kvality a zvyšuje jejich obchodní hodnotu."
 building_murex_farm_07: "Císařská textilní dílna"
 building_murex_farm_07_desc: "Císařská dílna se zaměřuje na hromadnou výrobu textilií barvených tyrským purpurem, čímž výrazně zvyšuje příjmy z prodeje těchto prestižních oděvů."
 building_murex_farm_08: "Královský purpurový palác"
 building_murex_farm_08_desc: "Nádherný palác zdobený motivy tyrského purpuru je symbolem bohatství a moci. Dává na odiv místní mistrovství ve výrobě tohoto vzácného barviva."
 building_type_generic_copper_mines_01: "Měděné doly"
 building_type_generic_copper_mines_01_desc: "Významný měděný důl poskytující nesmírně výnosnou měděnou rudu každému, kdo má to štěstí, že jej vlastní."
 generic_copper_mines_01: "Měděná hornická osada" # todo: NEW TRANSLATION
