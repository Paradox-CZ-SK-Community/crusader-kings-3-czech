 building_type_lantian_mines_01: "Nefritové doly Lan-tchien"
 building_type_lantian_mines_01_desc: "Kopce Lan-tchien jsou zdrojem vysoce kvalitního nefritu již po tisíce let. Tento světlý kámen, z něhož byly v minulosti vyřezávány císařské pečeti a který opěvovali básníci dynastie Tchang, je ceněn nikoli pro svou hojnost, ale pro jedinečnou krásu a vznešenost."
