 building_type_hetian_mines_01: "Chotanské doly"
 building_type_hetian_mines_01_desc: "Chotan je od nepaměti zdrojem chotanského nefritu. Tento drahocenný bílý kámen je ze všech druhů nefritu nejceněnější a mnozí si jej cení více než zlata či stříbra. Nefrit se těží přímo v horách a sbírá v povrchových jámách i říčních korytech."
 building_hetian_mines_01: "Chotanská hornická osada"
 building_hetian_mines_01_desc: "$building_type_hetian_mines_01_desc$"
 building_hetian_mines_02: "Chotanský důl"
 building_hetian_mines_02_desc: "S růstem hornické osady se těží stále více nefritu. Rostoucí věhlas drahých kamenů přivádí schopné inženýry a obchodníky, kteří výrazně zvyšují výnosnost těžby."
 building_hetian_mines_03: "Velký chotanský důl"
 building_hetian_mines_03_desc: "S rozšiřováním těžby rostou i samotné doly. Hornictví zaměstnává stále více lidí a neustálý ruch mezi četnými nalezišti nefritu se stal trvalou součástí krajiny."
 building_hetian_mines_04: "Chotanský důlní komplex"
 building_hetian_mines_04_desc: "Nefrit se postupem času stal nejen hlavním vývozním zbožím oblasti, ale také zdrojem obživy mnoha zdejších řemeslníků. Ulice nyní lemují celé zástupy dílen a obchodníků."
 building_type_dushan_mines_01: "Doly Tu-šan"
 building_type_dushan_mines_01_desc: "Tu-šan patří mezi čtyři velké čínské druhy nefritu a těží se zde již od dob dynastie Chan. Od ostatních druhů se liší sytějšími barvami, které bývají také výrazně pestřejší."
 building_dushan_mines_01: "Hornická osada Tu-šan"
