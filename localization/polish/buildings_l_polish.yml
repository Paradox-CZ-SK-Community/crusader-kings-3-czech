 building_type_powder_magazine_01: "Výrobna střelného prachu"
 building_type_powder_magazine_01_desc: "Střelný prach vyžaduje specializovanou výrobu, skladování a údržbu, aby zůstal použitelný. K náboru jednotek [GetMaA('handgunners').GetName] a dalších oddílů využívajících tuto mocnou sílu je nutné vybudovat zvláštní budovy."
 building_powder_magazine_01: "Sklad střelného prachu"
 building_powder_magazine_01_desc: "Skladiště, v němž lze střelný prach chránit před povětrnostními vlivy a snížit tak riziko nehod."
 building_powder_magazine_02: "Úřad prachové logistiky"
 building_powder_magazine_02_desc: "Najmutí úředníků dohlížejících na pracovníky, kteří se starají o složitou logistiku střelného prachu, zajistí jeho správné skladování a bezpečnou přepravu napříč panstvím."
 building_powder_magazine_03: "Sirný důl"
 building_powder_magazine_03_desc: "Síra, někdy nazývaná sirný květ, se vyskytuje hojně, ale její získávání ve velkém množství může být obtížné. Samostatný důl zajistí stálý přísun tohoto cenného nerostu."
 building_powder_magazine_04: "Dílna na výrobu ledku"
 building_powder_magazine_04_desc: "Ledek je klíčovou složkou střelného prachu a jeho výroba ve velkém množství bez vypálení celé budovy vyžaduje zručné ruce a kontrolované prostředí."
 building_powder_magazine_05: "Prachárny"
 building_powder_magazine_05_desc: "Skladování střelného prachu vyžaduje zvláštní budovy se zesílenými zdmi umístěné v bezpečné vzdálenosti od obydlených a cenných míst."
 building_powder_magazine_06: "Strážnice"
 building_powder_magazine_06_desc: "Střelný prach je nebezpečný sám o sobě, v nesprávných rukou však může být ještě nebezpečnější. Početné stráže jej nyní mohou chránit před zvědavými zraky."
 building_powder_magazine_07: "Dílna na mísení prachu"
 building_powder_magazine_07_desc: "Samostatná budova, v níž se jednotlivé složky mísí a vzniká střelný prach. Dojde-li k nehodě, snad již nezničí celý provoz."
 building_powder_magazine_08: "Dílna na ručnice"
 building_powder_magazine_08_desc: "Ručnice mohou být nespolehlivé a při použití prasknout. Musíme proto opatřit nejlepší možné vybavení a zaměstnat nejzručnější řemeslníky, aby vyráběli zbraně nejvyšší kvality."
 powder_magazine_1_effect_desc: "$unlocks_building_desc$Limit náboru [Concept('gunpowder','střeleckých')|E] [Concept('men_at_arms','ozbrojenců')|E]: #P +[EmptyScope.ScriptValue('gunpowder_building_limit_bonus_1')|0]#!"
 powder_magazine_2_effect_desc: "$unlocks_building_desc$Limit náboru [Concept('gunpowder','střeleckých')|E] [Concept('men_at_arms','ozbrojenců')|E]: #P +[EmptyScope.ScriptValue('gunpowder_building_limit_bonus_2')|0]#!"
 powder_magazine_3_effect_desc: "$unlocks_building_desc$Limit náboru [Concept('gunpowder','střeleckých')|E] [Concept('men_at_arms','ozbrojenců')|E]: #P +[EmptyScope.ScriptValue('gunpowder_building_limit_bonus_3')|0]#!"
 building_type_mandala_capital_01: "Chrámový komplex hlavního města"
 building_type_mandala_capital_01_desc: "Tento [Concept('great_project','velký projekt')|E] není pouhým chrámem. Je svědectvím naší odhodlanosti. Našich úspěchů. Naší #EMP velkoleposti#!. Takový chrám je symbolem vlády a blahovůle našeho božského a mocného dévarádži."
 building_mandala_capital_01: "Zdobný chrám"
 building_mandala_capital_01_desc: "Skromný počátek velkolepého odkazu. Tento zdobný chrám slouží k uctívání vládnoucího dévarádži a modlitbám k němu."
 building_mandala_capital_02: "Majestátní chrám"
 building_mandala_capital_02_desc: "Původní chrámová budova byla zvelebena a chrám hlavního města rozšířen o další svatyně, vybavení a výzdobu."
 building_mandala_capital_03: "Chrámový areál"
 building_mandala_capital_03_desc: "Přidáním dalších obydlí se chrám začíná rozrůstat v celý chrámový areál.\nNyní zahrnuje několik svatyní k uctívání i přístřeší pro věřící, služebnictvo a duchovenstvo."
 building_mandala_capital_04: "Velkolepý chrámový komplex"
 building_mandala_capital_04_desc: "Chrámový komplex nyní zabírá plochu malé vesnice a ve většině základních potřeb je převážně soběstačný.\nPřibylo malé relikviárium a rozjímací nádrže táhnoucí se od východu k západu, které dále posilují spojení s duchovní sférou."
 building_mandala_capital_05: "Božský chrámový palác"
 building_mandala_capital_05_desc: "Tento chrámový palác je vzácným architektonickým klenotem a byl rozšířen o velkolepé komnaty pro božského dévarádžu.\nPamátky, relikvie a poklady lákají cestovatele ze všech koutů světa, aby obdivovali přepych tohoto božského chrámového paláce."
 building_type_wulingyuan_01: "$building_wulingyuan_01$"
 building_type_wulingyuan_01_desc: "$building_wulingyuan_01_desc$"
 building_wulingyuan_01: "Wu-ling-jüan"
 building_wulingyuan_01_desc: "Tyto hory jsou plné tisíců impozantních pískovcových sloupů, které se tyčí vysoko nad zemí. Ačkoli jsou sloupy jejich nejnápadnějším rysem, oblast je rovněž plná roklí, potoků, jezírek a jeskyní."
 building_type_leshan_giant_buddha_01: "$building_leshan_giant_buddha_01$"
 building_type_leshan_giant_buddha_01_desc: "$building_leshan_giant_buddha_01_desc$"
 building_leshan_giant_buddha_01: "Velký Buddha v Le-šanu"
 building_leshan_giant_buddha_01_desc: "Tato Buddhova socha vytesaná do skalního útesu shlíží na soutok řek Min a Ta-tu a vítá znavené pocestné na jejich cestě."
 building_type_yungang_grottoes_01: "$building_yungang_grottoes_01$"
 building_type_yungang_grottoes_01_desc: "$building_yungang_grottoes_01_desc$"
 building_yungang_grottoes_01: "Jeskyně Jün-kang"
 building_yungang_grottoes_01_desc: "Rozsáhlý komplex jeskynních chrámů zahrnuje několik desítek velkých jeskyní a stovky menších. Jejich prostory zaplňují tisíce a tisíce Buddhových soch."
 building_type_wudang_mountain_temples_01: "$building_wudang_mountain_temples_01$"
 building_type_wudang_mountain_temples_01_desc: "$building_wudang_mountain_temples_01_desc$"
 building_wudang_mountain_temples_01: "Chrámy v pohoří Wu-tang"
 building_wudang_mountain_temples_01_desc: "Pohoří Wu-tang patří mezi několik hor posvátných pro taoismus. Nachází se zde také rozsáhlý chrámový komplex proslulý cvičením tchaj-ťi."
 building_type_shaolin_monastery_01: "$building_shaolin_monastery_01$"
 building_type_shaolin_monastery_01_desc: "$building_shaolin_monastery_01_desc$"
 building_shaolin_monastery_01: "Klášter Šao-lin"
 building_shaolin_monastery_01_desc: "Klášter Šao-lin je patrně nejznámější jako rodiště šaolinského kung-fu a domov mnichů mimořádně zdatných v bojových uměních. Je však také místem vzdělávání, studia a překládání buddhistických textů."
 building_type_lingyin_temple_01: "$building_lingyin_temple_01$"
 building_type_lingyin_temple_01_desc: "$building_lingyin_temple_01_desc$"
 building_lingyin_temple_01: "Chrám Ling-jin"
 building_lingyin_temple_01_desc: "Chrám Ling-jin založil roku 328 indický mnich a poutník, aby šířil buddhismus. Od té doby se chrám nesmírně rozrostl. Zahrnuje několik pavilonů, množství jeskyní a pagod a dostatek ubikací pro tisíce mnichů."
 building_type_giant_wild_goose_pagoda_01: "$building_giant_wild_goose_pagoda_01$"
 building_type_giant_wild_goose_pagoda_01_desc: "$building_giant_wild_goose_pagoda_01_desc$"
 building_giant_wild_goose_pagoda_01: "Pagoda velké divoké husy"
 building_giant_wild_goose_pagoda_01_desc: "Pagoda velké divoké husy byla původně vystavěna roku 652 jako místo k uchovávání a ochraně textů, řezeb a různých sošek. Později byla přestavěna na impozantní desetipodlažní stavbu, než ji další přestavby a opravy snížily na sedm podlaží."
 building_type_kaifeng_palace_01: "$building_kaifeng_palace_01$"
 building_type_kaifeng_palace_01_desc: "$building_kaifeng_palace_01_desc$"
 building_kaifeng_palace_01: "Císařský palác v Kchaj-fengu"
 building_kaifeng_palace_01_desc: "Císařský palác v Kchaj-fengu byl vystavěn poté, co dynastie Sung učinila město svým hlavním sídlem. Za jeho zdmi působí silná a výkonná vláda, která zajišťuje rozkvět města i celého panství."
 kaifeng_examination_cost_bonus_desc: "Náklady na [GetActivityType('activity_imperial_examination').GetTextIcon][GetActivityType( 'activity_imperial_examination').GetName] [Concept('activity','aktivitu')|E], dokud je toto [Concept('barony','baronství')|E] [Concept('realm_capital','hlavním sídlem panství')|E]: #P -[EmptyScope.ScriptValue('kaifeng_examination_cost_value')|%0]#!"
 kaifeng_palace_name_desc: "[GetBuilding('kaifeng_palace_01').GetName]"
 building_type_forbidden_city_01: "$building_forbidden_city_01$"
 building_type_forbidden_city_01_desc: "$building_forbidden_city_01_desc$"
 building_forbidden_city_01: "Zakázané město"
 building_forbidden_city_01_desc: "Zakázané město je rozlehlý císařský palác tvořený téměř tisícovkou samostatných budov. Celý komplex obklopují vysoké hradby a hluboký příkop, které chrání vládnoucí správu i množství úředníků neúnavně pracujících uvnitř."
 beijing_palace_bonus_desc: "[Concept('governor_efficiency','Efektivita')|E] [Concept('governors','guvernérů')|E], dokud je toto [Concept('barony','baronství')|E] [Concept('realm_capital','hlavním sídlem panství')|E]: @governor_efficiency!#P +[EmptyScope.ScriptValue('forbidden_city_bonus_value')]%#!"
 building_type_qianling_mausoleum_01: "$building_qianling_mausoleum_01$"
 building_type_qianling_mausoleum_01_desc: "$building_qianling_mausoleum_01_desc$"
 building_qianling_mausoleum_01: "Mauzoleum Čchien-ling"
 building_qianling_mausoleum_01_desc: "Mauzoleum Čchien-ling je především hrobkou císaře Kao-cunga a císařovny Wu Ce-tchien, pohřbeno je zde však také několik dalších členů rodu Li. Pohřební mohylu chrání obdélníková zeď a jedním z nejznámějších rysů mauzolea jsou četné kamenné sochy zdobící okolní krajinu."
 building_type_quanzhou_seaport_01: "$building_quanzhou_seaport_01$"
 building_type_quanzhou_seaport_01_desc: "$building_quanzhou_seaport_01_desc$"
 building_quanzhou_seaport_01: "Námořní přístav Čchüan-čou"
 building_quanzhou_seaport_01_desc: "Přístav Čchüan-čou přitahuje zahraniční obchodníky ze širokého okolí. Připlouvají sem kupci z Arábie a Anatolie, Japonska a Koreje i ze všech zemí mezi nimi. Příliv obchodních lodí zajišťuje rozkvět místních řemesel a učinil z Čchüan-čou nejvýznamnější středisko stavby lodí v kraji."
 building_type_angkor_wat_01: "$building_angkor_wat_01$"
 building_type_angkor_wat_01_desc: "$building_angkor_wat_01_desc$"
 building_angkor_wat_01: "Angkor Vat"
 building_angkor_wat_01_desc: "Angkor Vat je mohutný chrámový komplex zasvěcený bohu Višnuovi. Je navržen jako zpodobnění hory Méru, sídla bohů v hinduistické mytologii. Komplex obklopuje impozantní příkop a zahrnuje několik chrámů s ochozy překypujících náboženským uměním, sochami a reliéfy."
 building_type_citadel_thang_long_01: "Citadela Thang Long" # 昇龍
 building_type_citadel_thang_long_01_desc: "$building_citadel_thang_long_01_desc$"
 building_citadel_thang_long_01: "Citadela Dai La"
 building_citadel_thang_long_01_desc: "Citadela sloužící jako vojenská základna místních vojsk je mohutně opevněna, aby pomáhala odrážet útočníky."
 building_citadel_thang_long_02: "Císařská citadela Thang Long" # 昇龍
 building_citadel_thang_long_02_desc: "Císařská citadela slouží jako pevnost i královské sídlo. Její komplex zahrnuje tři části, hlavní opevnění, císařské město a Zakázané město."
 building_type_po_klong_garai_01: "$building_po_klong_garai_01$"
 building_type_po_klong_garai_01_desc: "$building_po_klong_garai_01_desc$"
 building_po_klong_garai_01: "Chrám Po Klong Garai"
 building_po_klong_garai_01_desc: "Chrám Po Klong Garai představuje vrchol čamské architektury a údajně byl vystavěn na počest stejnojmenného legendárního krále. Tvoří jej tři osobité cihlové věže a jeho hlavním uměleckým dílem je impozantní socha boha Šivy."
 building_type_dau_temple_01: "$building_dau_temple_01$"
 building_type_dau_temple_01_desc: "$building_dau_temple_01_desc$"
 building_dau_temple_01: "Chrám Dau"
 building_dau_temple_01_desc: "Tento uctívaný chrám v Luy Lau označuje místo, kde se poprvé shromáždili mniši ze vzdálených zemí. Cihlová věž, ostatky a mumifikovaní mistři, kteří zde zůstávají, ztělesňují staletí oddanosti buddhismu."
 building_type_liuhe_pagoda_01: "$building_liuhe_pagoda_01$"
 building_type_liuhe_pagoda_01_desc: "$building_liuhe_pagoda_01_desc$"
 building_liuhe_pagoda_01: "Pagoda Liou-che"
 building_liuhe_pagoda_01_desc: "Vysoká pagoda vystavěná králi, aby utišila příliv a vzdala čest Buddhovi. Její světlo září nad krajinou jako symbol souladu mezi člověkem a nebesy."
 building_type_muaro_jambi_01: "$building_muaro_jambi_01$"
 building_type_muaro_jambi_01_desc: "$building_muaro_jambi_01_desc$"
 building_muaro_jambi_01: "Areály Muaro Džambi"
 building_muaro_jambi_01_desc: "Rozsáhlé cihlové areály Muaro Džambi ležící podél řeky Batang Hari chránily obchod i víru. Jako opěrný bod říše Šrívidžaja poskytovaly útočiště vládcům a umožňovaly shromažďovat vojska v srdci Sumatry."
 building_type_hanging_temple_01: "$building_hanging_temple_01$"
 building_type_hanging_temple_01_desc: "$building_hanging_temple_01_desc$"
 building_hanging_temple_01: "Visutý chrám"
 building_hanging_temple_01_desc: "Visutý chrám je klášter zavěšený na skalní stěně hory Cheng. Podle pověsti jej před staletími začal stavět mnich jménem Liao-žan. Jeho dřevěné síně stojící na kůlech ukrývají svatyně buddhistických, taoistických a konfuciánských mudrců, spojují různé víry a s půvabným klidem vzdorují zemské tíži."
 building_type_pagoda_of_fogong_temple_01: "$building_pagoda_of_fogong_temple_01$"
 building_type_pagoda_of_fogong_temple_01_desc: "$building_pagoda_of_fogong_temple_01_desc$"
 building_pagoda_of_fogong_temple_01: "Pagoda chrámu Fo-kung"
 building_pagoda_of_fogong_temple_01_desc: "Pagoda chrámu Fo-kung je vysoká dřevěná stavba vybudovaná bez jediného hřebíku. Tyčí se do výše devíti podlaží, ukrývá posvátné ostatky a sochy a její důmyslná konstrukce zůstává divem stavitelství i symbolem víry."
 building_type_plain_of_jars_01: "$building_plain_of_jars_01$"
 building_type_plain_of_jars_01_desc: "$building_plain_of_jars_01_desc$"
 building_plain_of_jars_01: "Planina džbánů"
 building_plain_of_jars_01_desc: "Planina džbánů je rozlehlá náhorní plošina posetá obrovskými kamennými nádobami, jejichž účel zahaluje tajemství. Kdysi sloužily při dávných obřadech a přetrvávají jako pozůstatky zapomenutého lidu, které vzbuzují úžas a úctu místních."
 building_type_dieng_plateau_01: "$building_dieng_plateau_01$"
 building_type_dieng_plateau_01_desc: "$building_dieng_plateau_01_desc$"
 building_dieng_plateau_01: "Náhorní plošina Dieng"
 building_dieng_plateau_01_desc: "Náhorní plošina Dieng je vulkanická pánev zahalená mlhou, jejíž krajinu pokrývají sirná jezírka a vývěry plynů. Roztroušené starobylé chrámy a obřadní pověsti z ní činí obávané i uctívané posvátné výšiny, po nichž kdysi kráčeli dobří i zlí bohové."
 building_type_mount_apo_01: "$building_mount_apo_01$"
 building_type_mount_apo_01_desc: "$building_mount_apo_01_desc$"
 building_mount_apo_01: "Hora Apo"
 building_mount_apo_01_desc: "Hora Apo se tyčí nad jezerem Venado a její jméno znamená v lumadských jazycích „uctívaný stařešina“. Jde o zkrácenou podobu jména Apo Sandawa, ducha posvátné hory označovaného také jako „Stařešina Sandawa“ či „Děd Sandawa“. Obřady zasvěcené Apo Sandawovi vykonává kmenový šaman, který je považován za prostředníka duchů předků."
 building_type_besakih_temple_01: "$building_besakih_temple_01$"
 building_type_besakih_temple_01_desc: "$building_besakih_temple_01_desc$"
 building_besakih_temple_01: "Chrám Besakih"
 building_besakih_temple_01_desc: "Besakih, známý jako „Matka chrámů Bali“, je nejvýznamnějším a nejposvátnějším hinduistickým chrámovým komplexem ostrova. Leží na svazích hory Agung, nejvyšší sopky a posvátné hory Bali. Je náboženským a kulturním srdcem ostrova a hostí velkolepé obřady pro všechen lid."
 building_type_gongsanseong_fortress_01: "$building_gongsanseong_fortress_01$"
 building_type_gongsanseong_fortress_01_desc: "$building_gongsanseong_fortress_01_desc$"
 building_gongsanseong_fortress_01: "Pevnost Kongsansong"
 building_gongsanseong_fortress_01_desc: "Pevnost Kongsansong korunuje kopce nad řekou Kum. Byla vystavěna jako královská citadela Pekče a její dlouhé hradby a kamenné brány chránily krále i poddané. Je horskou baštou dynastické moci a obrany."
 building_type_krakatoa_01: "$building_krakatoa_01$"
 building_type_krakatoa_01_desc: "$building_krakatoa_01_desc$"
 building_krakatoa_01: "Krakatoa"
 building_krakatoa_01_desc: "Krakatoa je impozantní sopka ležící na malém souostroví nedaleko pobřeží."
 building_type_borobudur_01: "$building_borobudur_01$"
 building_type_borobudur_01_desc: "$building_borobudur_01_desc$"
 building_borobudur_01: "Borobudur"
 building_borobudur_01_desc: "Borobudur je mohutný buddhistický chrám tvořený devíti kamennými plošinami navršenými nad sebou a završenými ústřední stúpou. Chrám zdobí tisíce reliéfů a stovky Buddhových soch."
 building_type_hoshi_ryokan_01: "$building_hoshi_ryokan_01$"
 building_type_hoshi_ryokan_01_desc: "$building_hoshi_ryokan_01_desc$"
 building_hoshi_ryokan_01: "Hóši rjokan"
 building_hoshi_ryokan_01_desc: "Hóši rjokan je starobylý tradiční hostinec provozovaný jednou rodinou. Pocestným nabízí odpočinek během cesty, jídlo a přístup k lázním s horkými prameny."
 building_type_celestial_great_barracks_01: "$building_celestial_great_barracks_01$"
 building_type_celestial_great_barracks_01_desc: "$building_celestial_great_barracks_01_desc$"
 building_celestial_great_barracks_01: "Velká kasárna"
 building_celestial_great_barracks_01_desc: "Tato mohutná kasárna a pevnost poskytují místnímu guvernérovi vojáky k posílení jeho vojsk a výrazně zlepšují obranu celé oblasti."
 celestial_great_barracks_enabled_desc: "[holder.GetShortUIName|U] [holder.LocalPlayerString( 'nejsi', 'není' )] vojenským [Concept('governor','guvernérem')|E]"
 celestial_great_barracks_effect_desc: "[Concept('governor_efficiency','Efektivita guvernéra')|E]: @governor_efficiency!#P +[EmptyScope.ScriptValue('great_barracks_bonus_value')]%#!"
 building_type_the_great_wall_01: "$building_the_great_wall_01$"
 building_type_the_great_wall_01_desc: "$building_the_great_wall_01_desc$"
 building_the_great_wall_01: "Velká čínská zeď"
 building_the_great_wall_01_desc: "Toto je nejstarší část Velké čínské zdi, kterou z velké části vybudovala dynastie Čchin. Zub času sice obrousil kámen, cihly i maltu, stále však jde o hrozivé opevnění."
 building_type_the_great_wall_02: "$building_the_great_wall_01$"
 building_type_the_great_wall_02_desc: "$building_the_great_wall_02_desc$"
 building_the_great_wall_02: "Velká čínská zeď"
 building_the_great_wall_02_desc: "Dynastie Chan výrazně rozšířila zdi vybudované svými předchůdci. Vznikly tehdy některé z nejrozsáhlejších úseků táhnoucí se stovky mil přes pouště a hory."
 building_type_the_great_wall_03: "$building_the_great_wall_01$"
 building_type_the_great_wall_03_desc: "$building_the_great_wall_03_desc$"
 building_the_great_wall_03: "Velká čínská zeď"
 building_the_great_wall_03_desc: "Dynastie Wej, Čchi a Suej během 5. a 6. století přidávaly ke zdi další úseky a několik jejích částí zesílily novými opevněními."
 building_type_the_great_wall_04: "$building_the_great_wall_01$"
 building_type_the_great_wall_04_desc: "$building_the_great_wall_04_desc$"
 building_the_great_wall_04: "Velká čínská zeď"
 building_the_great_wall_04_desc: "Tato obrovská zeď je mimořádným stavitelským dílem, které bylo od svého vzniku v 7. století př. n. l. již mnohokrát rozšířeno. Nyní se táhne tisíce mil a zahrnuje množství strážních věží, kasáren a posádkových stanovišť. Takovou mocnou překážku přece žádný barbarský útočník nikdy nepřekoná, nebo snad ano?"
 building_type_the_great_wall_shanhai_pass: "$building_the_great_wall_01$"
 building_type_the_great_wall_shanhai_pass_desc: "$building_the_great_wall_04_desc$"
 building_the_great_wall_shanhai_pass: "$building_the_great_wall_04$"
 building_the_great_wall_shanhai_pass_desc: "$building_the_great_wall_04_desc$"
 building_type_the_great_wall_liaodong: "$building_the_great_wall_01$"
 building_type_the_great_wall_liaodong_desc: "$building_the_great_wall_04_desc$"
 building_the_great_wall_liaodong: "$building_the_great_wall_04$"
 building_the_great_wall_liaodong_desc: "$building_the_great_wall_04_desc$"
 special_building_improve_silk_road: "Po dokončení tato [Concept('special_building','zvláštní budova')|E] posune [Concept('situation_sub_region','oblast situace')|E] [sub_region_temp.GetName] blíže k [Concept('situation_phase','fázi situace')|E] [situation_silk_road_phase_exceptional_bounty|E] [silk_road|E] #weak (pokud se v ní již nenachází)#!"
 building_type_herat_bazaar_01: "$building_herat_bazaar_01$"
 building_type_herat_bazaar_01_desc: "$building_herat_bazaar_01_desc$"
 building_herat_bazaar_01: "Bazar v Herátu"
 building_herat_bazaar_01_desc: "Rušné trhy v Herátu jsou proslulé již od dob starověkých Achaimenovců, kteří město nazývali #italic Haraiva#!. Karavany, které každý den přijíždějí do města a opouštějí je, učinily z herátských bazarů Perlu Chorásánu."
 building_herat_bazaar_02: "Rozlehlý bazar v Herátu"
 building_herat_bazaar_02_desc: "Herátské bazary překypují obchodem. Perla Chorásánu září jasněji než nejdokonaleji vybroušený drahokam v kterékoli koruně."
 building_type_dvin_shuka_01: "$building_dvin_shuka_01$"
 building_type_dvin_shuka_01_desc: "$building_dvin_shuka_01_desc$"
 building_dvin_shuka_01: "Tržiště v Dvinu"
 building_dvin_shuka_01_desc: "Ctihodné tržiště v Dvinu slouží od nepaměti jako hlavní středisko arménského obchodu. Jeho zdi zdobí pestrobarevné dlaždice a tónované omítky, které odrážejí bohatství a prestiž tohoto starobylého tržiště."
 building_dvin_shuka_02: "Rozlehlé tržiště v Dvinu"
 building_dvin_shuka_02_desc: "Věk neubral vznešenému a starobylému tržišti v Dvinu nic z jeho životnosti. Naopak se zdá čilejší než kdy dříve."
 building_type_khiva_bazaar_01: "$building_khiva_bazaar_01$"
 building_type_khiva_bazaar_01_desc: "$building_khiva_bazaar_01_desc$"
 building_khiva_bazaar_01: "Bazar v Chivě"
 building_khiva_bazaar_01_desc: "Skromné město Chiva, brána do stepi, vyniká množstvím obchodníků a cestovatelů, kteří na hranici hledají zisk či štěstí."
 building_khiva_bazaar_02: "Rozlehlý bazar v Chivě"
 building_khiva_bazaar_02_desc: "Pod spalujícím sluncem si kočovníci, kupci a dobrodruzi budují své jmění a nad exotickými císařskými mincemi si šeptem vyprávějí o bohatství vzdálené Číny."
 building_type_lhasa_market_01: "$building_lhasa_market_01$"
 building_type_lhasa_market_01_desc: "$building_lhasa_market_01_desc$"
 building_lhasa_market_01: "Trh v Lhase"
 building_lhasa_market_01_desc: "Na významné křižovatce mezi Indií a Čínou se lhasští kupci ve stínu vznešeného paláce Potála přetahují o pozornost cestovatelů."
 building_lhasa_market_02: "Rozlehlý trh v Lhase"
 building_lhasa_market_02_desc: "Pod sluncem není nic nového, nebo by tě o tom alespoň rádi přesvědčili lhasští kupci. Neexistuje totiž tretka ani drahokam, s nimiž by se na jejich cestě po Hedvábné stezce dosud nesetkali."
 building_type_changan_market_01: "$building_changan_market_01$"
 building_type_changan_market_01_desc: "$building_changan_market_01_desc$"
 building_changan_market_01: "Tržiště v Čchang-anu"
 building_changan_market_01_desc: "Trhy velkého města Čchang-an, jehož jméno znamená #EMP Věčný mír#!, kypí všemi druhy obchodu a jsou nepostradatelnou zastávkou téměř veškerého zboží proudícího do Číny i z ní."
 building_changan_market_02: "Rozlehlé tržiště v Čchang-anu"
 building_changan_market_02_desc: "Zámožní kupci z Čchang-anu již ani nemrknou při pohledu na největší poklady známé lidstvu. Všechny už totiž viděli a několik z nich nejspíš také vlastní."
 building_type_dunhuang_market_01: "$building_dunhuang_market_01$"
 building_type_dunhuang_market_01_desc: "$building_dunhuang_market_01_desc$"
 building_dunhuang_market_01: "Tržiště v Tun-chuangu"
 building_dunhuang_market_01_desc: "Město Tun-chuang leží na třpytivých březích řeky Šu-le, tvoří bránu mezi koridorem Che-si a Tarimskou pánví a je klíčovou zastávkou všech cestovatelů putujících mezi nimi."
 building_dunhuang_market_02: "Rozlehlé tržiště v Tun-chuangu"
 building_dunhuang_market_02_desc: "Sluncem vybělené ulice Tun-chuangu znají pouze stálý a rozvážný pochod nesčetných obtížených velbloudů, mul a lidí, jejichž cesty se neustále kříží mezi východem a západem."
 building_type_lahur_bazaar_01: "$building_lahur_bazaar_01$"
 building_type_lahur_bazaar_01_desc: "$building_lahur_bazaar_01_desc$"
 building_lahur_bazaar_01: "Bazar v Láhauru"
 building_lahur_bazaar_01_desc: "Staré město Láhaur vyrostlo kolem dvou velkých tržišť obklopených domy a uzavřených za dlouhou hliněnou hradbou. Tento rušný shluk trhů kypí životem odnepaměti a pravděpodobně jím bude kypět ještě po mnoho dalších generací."
 building_lahur_bazaar_02: "Rozlehlý bazar v Láhauru"
 building_lahur_bazaar_02_desc: "Obchod proudí Láhaurem stejně přirozeně jako voda říčním korytem. Zdejší tržiště přetékají zbožím a za bystrýma očima kupců jako by se skrývala veškerá moudrost slavné historie města."
 building_type_hamadan_bazaar_01: "Hamadánský bazar"
 building_type_hamadan_bazaar_01_desc: "$building_hamadan_bazaar_01_desc$"
 building_hamadan_bazaar_01: "Hamadánský bazar"
 building_hamadan_bazaar_01_desc: "Hamadán, srdce země starověkých Médů, je střediskem obchodu již od dob hliněných tabulek a klínového písma. Mezi stánky hlavního hamadánského bazaru nabízely své zboží a provozovaly řemesla stovky generací kupců."
 building_hamadan_bazaar_02: "Rozlehlý hamadánský bazar"
 building_hamadan_bazaar_02_desc: "Velký hamadánský bazar vzkvétá jako nikdy dříve a dosahuje takového bohatství a ruchu, jaké nemají v jeho dlouhé a důstojné historii obdoby."
 building_type_sunday_bazaar_01: "Nedělní bazar"
 building_type_sunday_bazaar_01_desc: "$building_sunday_bazaar_01_desc$"
 building_sunday_bazaar_01: "Nedělní bazar"
 building_sunday_bazaar_01_desc: "Někteří místní tvrdí, že Nedělní bazar v Kašgaru existoval ještě před vznikem peněz. Při procházení mezi jeho stánky tomu lze snadno uvěřit, protože svět bez tohoto místa si ani nelze představit."
 building_sunday_bazaar_02: "Rozlehlý nedělní bazar"
 building_sunday_bazaar_02_desc: "Velký kašgarský Nedělní bazar možná existuje od nepaměti, jeho současný rozkvět však bude jistě připomínán ještě po celá staletí."
 building_type_mount_fuji_01: "Hora Fudži"
 building_type_mount_fuji_01_desc: "Osamělý, vysoký a sněhem pokrytý vrchol Fudžisanu označuje cestu do východního Japonska a je proslulý po celých ostrovech. Přitahuje cestovatele i poutníky a všem, kdo na něj pohlédnou, přináší pokoj. Fudži patří mezi nejposvátnější šintoistické hory a je domovem #EMP Konohanasakuja-hime#!, bohyně sopek, třešňových květů a pomíjivé křehkosti života."
 building_mount_fuji_01: "$building_type_mount_fuji_01$"
 building_mount_fuji_01_desc: "$building_type_mount_fuji_01_desc$"
 building_type_waterworks_01: "Vodní hospodářství"
 building_type_waterworks_01_desc: "Voda je základem, na němž závisí veškerý život. Stálý přísun vody a její účinné využívání jsou nezbytné pro udržení silného panství i pevné vlády."
 building_waterworks_01: "Umělé rybníky"
 building_waterworks_01_desc: "Prvním krokem ke správě vody je mít vůbec nějakou vodu, kterou lze spravovat. Prostá prohlubeň v zemi vyložená jílem proti prosakování vytváří přirozené místo, kde se může voda shromažďovat pro pozdější použití."
 building_waterworks_02: "Cisterny"
 building_waterworks_02_desc: "Hlubší jámy, méně propustné obložení a prosté zastřešení umožňují déle uchovávat větší množství vody s menšími ztrátami způsobenými znečištěním či odpařováním."
 building_waterworks_03: "Vodní kanály"
 building_waterworks_03_desc: "Příkopy vyhloubené mezi zásobárnami zpřístupňují spravovanou vodu mnohem většímu počtu lidí. Při nadbytku vody zmírňují záplavy, za sucha zásobují lidi, dobytek i úrodu. Při správném plánování mohou sloužit také lehké lodní dopravě."
 building_waterworks_04: "Zavlažovací nádrže"
 building_waterworks_04_desc: "Jakýkoli kopec, hřeben či výškový rozdíl lze pomocí vhodných náspů proměnit v místo pro zadržování vody. Tyto otevřené nádrže propojené kanály se mohou navzájem napájet a poskytují větší kontrolu nad tím, kolik vody je v danou chvíli uchováváno a využíváno."
 building_waterworks_05: "Schodišťové studny"
 building_waterworks_05_desc: "Správu vody lze spojit s běžným hloubením studní a vytvořit tak mohutné stavby zapuštěné do země, které mají vždy přístup k podzemní vodě. Tyto podzemní budovy lze propojit se stavidly a kanály na povrchu, které do nich podle potřeby přivádějí další vodu nebo ji odvádějí jinam."
 building_waterworks_06: "Plavební komory"
 building_waterworks_06_desc: "Pomocí bran a výpustí lze řídit i samotnou hloubku vodní cesty. Voda zadržovaná za těmito komorami umožňuje využívat kanály pro čluny a malé lodě, což z nich činí vynikající dopravní tepny."
 building_waterworks_07: "Umělá jezera"
 building_waterworks_07_desc: "Monumentální nádrž dokáže pojmout monumentální množství vody. Umělá jezera napájená řekami a kanály mohou zásobovat rozsáhlá pole i množství vesnic. Jejich velkolepost jim navíc propůjčuje vlastní prestiž a činí z nich vhodná místa pro bohoslužby i výkon vlády."
 building_waterworks_08: "Vodovodní a kanalizační soustavy"
 building_waterworks_08_desc: "Pomocí potrubí a čerpadel může voda proudit vzhůru i dolů, zásobovat nejvyšší věže a odplavovat splašky do nejvzdálenějších žump. Žádné místo nemusí trpět nedostatkem vody a každý přebytek lze odvést dříve, než způsobí nebezpečnou povodeň."
 building_type_spice_plantation_01: "Plantáže koření"
 building_type_spice_plantation_01_desc: "Nejjemnější vůně a nejdelikátnější chutě lze získat z rostlin, které rostou pouze v několika vybraných oblastech světa. Jejich vzácnost a kvalita činí jejich pěstování nesmírně výnosným, pokud jim půda dokáže poskytnout vhodné podmínky."
 building_spice_plantation_01: "Sběr koření"
 building_spice_plantation_01_desc: "Koření přirozeně poskytují různé stromy, keře a květiny. Nejtěžší je tyto rostliny vůbec #italic najít#!."
 building_spice_plantation_02: "Pěstované háje koření"
 building_spice_plantation_02_desc: "Nejžádanější druhy koření lze pěstovat za vhodných podmínek, s dostatkem správně vedených pracovníků a pod dohledem schopných správců."
 building_spice_plantation_03: "Sady koření"
 building_spice_plantation_03_desc: "Geometricky uspořádaná výsadba na rozsáhlé ploše umožňuje rok co rok získávat mnohem předvídatelnější množství koření."
 building_spice_plantation_04: "Sušení koření"
 building_spice_plantation_04_desc: "Vyhrazením prostoru poblíž polí k sušení koření před přepravou lze zpracovat větší část úrody dříve, než se zkazí, a snížit tak celkové výrobní náklady."
 building_spice_plantation_05: "Mlýny na koření"
 building_spice_plantation_05_desc: "Mletí sice zvyšuje náchylnost koření ke zkažení, ale výrazně usnadňuje jeho skladování. Mlýny navíc pomáhají při prosévání a zajišťují mnohem čistší výsledný produkt."
 building_spice_plantation_06: "Kořeninové statky"
 building_spice_plantation_06_desc: "Soustředění obydlí pracovníků, zpracování úrody a skladování výrobků na jediném místě poblíž samotných polí výrazně usnadňuje výrobu i prodej většího množství koření s nižšími celkovými náklady."
 building_spice_plantation_07: "Správa plantážní půdy"
 building_spice_plantation_07_desc: "Samotnou krajinu lze přetvořit a získat tak další půdu pro pěstování. Terasy a kanály vytvářejí nové možnosti pro další úrodu."
 building_spice_plantation_08: "Velkokapacitní výroba koření"
 building_spice_plantation_08_desc: "Při správném vedení lze celou zemi zasvětit produkci nejvýnosnějších druhů koření. Každý vysazený strom, každý pěstovaný keř, každý utržený list a každý usušený ořech znamenají další minci v pokladnici."
 building_type_examination_hall_01: "Zkušební síň"
 building_type_examination_hall_01_desc: "Císařské zkoušky nelze pořádat bez místa, kde by mohly probíhat. Místní guvernér musí zajistit, aby úředníci měli všechny prostředky potřebné k řádnému vedení zkoušek a uchazečům se dostávalo potřebné podpory, aniž by měli příliš mnoho příležitostí podvádět."
 building_examination_hall_01: "Zkušební místnosti"
 building_examination_hall_01_desc: "K prověřování uchazečů o vládní úřady je zapotřebí místo, kde lze zkoušku vykonat. Samostatná místnost určená ke zkoušení je naprostým základem, ale alespoň představuje začátek."
 building_examination_hall_02: "Chrám Wen-wu"
 building_examination_hall_02_desc: "Trocha modlitby může některým uchazečům dodat větší sebedůvěru než veškeré studium a příprava na světě."
 building_examination_hall_03: "Císařská akademie"
 building_examination_hall_03_desc: "Komplex přednáškových síní, zkušebních prostor, kanceláří učitelů a skladišť poskytuje veškeré zázemí potřebné k provedení každé části císařských zkoušek s nejvyšší účinností a kvalitou."
 examination_hall_effects_desc: "[SelectLocalization( HasDlcFeature( 'all_under_heaven' ), 'examination_hall_effect_desc', 'examination_hall_cost_discount_max_desc' )]"
 examination_hall_effect_desc: "Nižší náklady na pořádání [GetActivityType('activity_imperial_examination').GetTextIcon][GetActivityType('activity_imperial_examination').GetName] a [GetActivityType('activity_local_examination').GetTextIcon][GetActivityType('activity_local_examination').GetName] [Concept('activities','aktivit')|E] v této [Concept('holding','državě')|E]: [EmptyScope.ScriptValue('imperial_examination_cost_discount_max_value')|P0%]"
 examination_hall_cost_discount_max_desc: "$examination_hall_effect_desc$[EmptyScope.ScriptValue('imperial_examination_cost_discount_max_value')|P0%]"
 imperial_examination_cost_discount_examination_hall: "V místě se nachází $building_type_examination_hall_01$"
 building_can_benefit_requirements: "#S Pokud splňuješ požadavky:#!\n"
 rebuilding_grants_full_benefits: "#S Po [Concept('rebuilding','obnově')|El]:#!\n"
 building_requirements_header: "#S Požadavky:#!\n"
 building_fallback: "#S Pokud požadavky nesplňuješ:#!\n"
 building_effects_header: "#S Účinky:#!\n"
 building_type_citadel_shrine_01: "Svatyně citadely"
 building_type_citadel_shrine_01_desc: "$building_type_temple_citadel_01$ není úplná bez místa určeného k uctívání jejího panteonu. Ať už jde o běžné obyvatele, nebo vojáky posádky, posvátnost vyzařující z jejích zdí uklidní každou neklidnou duši."
 building_citadel_shrine_01: "Věž prasáda"
 building_citadel_shrine_01_desc: "Prasáda korunuje $building_type_temple_citadel_01$ a na obzoru vytváří vznešenou siluetu. Věřícím umožňuje obdivovat svatyni již zdaleka."
 building_citadel_shrine_02: "Věž prang"
 building_citadel_shrine_02_desc: "Prang pokrytý jemnými řezbami se zvedá vzhůru v kaskádách stavebních stupňů, které umocňují dojem výšky. Při pronášení modliteb či tichém rozjímání poskytuje očím vítané spočinutí."
 building_citadel_shrine_03: "Sochy božstev"
 building_citadel_shrine_03_desc: "Sbírka soch věčně hledí do prázdna, jako by rozjímala o věčnosti, a ve věřících často vyvolává složité pocity."
 building_citadel_shrine_04: "Sochy sinhů"
 building_citadel_shrine_04_desc: "Tito zuřiví strážní lvi s vyceněnými zuby a upřenými pohledy udělují obyvatelům $building_type_temple_citadel_01$ své ochranné požehnání."
 building_citadel_shrine_05: "Strážní nágové"
 building_citadel_shrine_05_desc: "Tito sedmihlaví hadi, pečlivě vytesaní z pískovce a s důmyslně vyobrazenou mandalou na hrudi, přinášejí obyvatelům svatyně mír a blahobyt."
 building_citadel_shrine_06: "Basreliéfy"
 building_citadel_shrine_06_desc: "Obyvatelé se často zastavují, aby si prohlédli drobné detaily těchto basreliéfů, které zobrazují dramatické bitevní výjevy, různé božské sféry i mýty o stvoření."
 building_citadel_shrine_07: "Relikviáře"
 building_citadel_shrine_07_desc: "Tato $building_type_temple_citadel_01$ ukrývá pokladnici náboženských a obřadních soch i předmětů, jejíž sbírce se žádná jiná nevyrovná."
 building_citadel_shrine_08: "Vyobrazení dévarádži"
 building_citadel_shrine_08_desc: "Božská bytost zachycená v čase v majestátním postoji umožňuje věřícím modlit se, vzdávat jí náležitou úctu a přijímat její požehnání."
 building_type_sacred_pool_01: "Posvátná nádrž"
 building_type_sacred_pool_01_desc: "Takto rozlehlá vodní plocha může sloužit mnoha účelům, ale s během času a střídáním ročních období se její odrazy někdy proměňují ve skutečně transcendentní podívanou. Tyto nádrže poskytují vodu i ochranu a představují důležitou součást každodenního života místních obyvatel."
 building_sacred_pool_01: "Lotosový rybník"
 building_sacred_pool_01_desc: "Harmonický rybník okouzluje návštěvníky svou krásou a pokojem a údajně bývá dějištěm významných duchovních událostí."
 building_sacred_pool_02: "Posvátná vodní nádrž"
 building_sacred_pool_02_desc: "S rostoucí rozlohou přitahuje $building_sacred_pool_02$ také divokou zvěř. Rostlinstvo a živočichové společně připomínají návštěvníkům koloběh života."
 building_sacred_pool_03: "Obřadní nádrž"
 building_sacred_pool_03_desc: "Tato vodní plocha slouží k příležitostným obřadům a rituálům a svědčí o rostoucí nádheře svého vládce."
 building_sacred_pool_04: "Vodní příkop"
 building_sacred_pool_04_desc: "Nyní obklopuje místo bohoslužeb a jeho obyvatelé se cítí bezpečněji, protože $building_type_sacred_pool_01$ vytváří opevněnou překážku mezi nimi a případnými nepřáteli."
 building_sacred_pool_05: "Malý baraj"
 building_sacred_pool_05_desc: "Nad barajem bdí množství strážních lvů, kvůli nimž si každý vetřelec dobře rozmyslí, zda se vydá přes jeho klidné vody."
 building_sacred_pool_06: "Baraj"
 building_sacred_pool_06_desc: "$building_sacred_pool_06$ táhnoucí se od východu k západu nabízí velkolepou podívanou. Nad jeho vnějším obvodem bdí hadí sochy."
 building_sacred_pool_07: "Velký baraj"
 building_sacred_pool_07_desc: "Sochy, kvetoucí rostlinstvo a nádherná scenérie zdobí tuto majestátní vodní plochu, která v obdobích nesnesitelného vedra přináší ochlazení i dostatek vody."
 building_sacred_pool_08: "Posvátný baraj"
 building_sacred_pool_08_desc: "Cestovatelé a další návštěvníci často v úžasu hledí na tuto umělou vodní plochu, jejíž protější břeh je kvůli ohromné šířce sotva viditelný. Je skutečným dokladem božského významu tohoto místa."
 building_type_vihara_halls_01: "Síně viháry"
 building_type_vihara_halls_01_desc: "Tato klášterní budova, vystavěná jako útočiště mnichů během období dešťů, je místem tiché meditace, modliteb a odpočinku. Rozšiřování síní posiluje zdraví a oddanost zdejších věřících."
 building_vihara_halls_01: "Modlitební svatyně"
 building_vihara_halls_01_desc: "Přidání $building_vihara_halls_01$ poskytuje návštěvníkům místo k uctívání a rozjímání."
 building_vihara_halls_02: "Knihovna písem"
 building_vihara_halls_02_desc: "Ve zdech knihovny hó traj jsou uchovávána starobylá i nová písma. Příchozí věřící je mohou ve volném čase studovat a prohlubovat své osvícení."
 building_vihara_halls_03: "Kaple s kolonádami"
 building_vihara_halls_03_desc: "Nad kaplemi se tyčí majestátní kolonády, jejichž důmyslné nápisy a různá náboženská vyobrazení obklopují věřící uvnitř."
 building_vihara_halls_04: "Mandapa"
 building_vihara_halls_04_desc: "Ohromná rozloha této sloupové síně je ideální pro pořádání veřejných rituálů a dalších náboženských obřadů."
 building_vihara_halls_05: "Pavilon šála"
 building_vihara_halls_05_desc: "Krása tohoto pavilonu stojícího uprostřed zeleně se vyrovná pouze duchovní atmosféře, která jej obklopuje."
 building_vihara_halls_06: "Kameny síma"
 building_vihara_halls_06_desc: "Hraniční kameny pomáhají správcům $building_type_vihara_halls_01$ vymezit správnou velikost a rozestupy prostorů, které mniši potřebují k řádnému konání bohoslužeb."
 building_vihara_halls_07: "Zvonice"
 building_vihara_halls_07_desc: "Majestátní $building_vihara_halls_07$ korunuje tyto $building_type_vihara_halls_01$, ve dne odráží sluneční světlo a v noci se rýsuje v dálce."
 building_vihara_halls_08: "Velkolepé síně"
 building_vihara_halls_08_desc: "Pohodlí a vybavení těchto síní přitahují mnichy ze vzdálenějších krajů. Jejich prostřednictvím se shromažďují a šíří učení i myšlenky v neocenitelné síti poznání, která přináší soulad také okolním panstvím."
 building_type_itsukushima_jinja_01: "$building_itsukushima_jinja_01$"
 building_type_itsukushima_jinja_01_desc: "$building_itsukushima_jinja_01_desc$"
 building_itsukushima_jinja_01: "Svatyně Icukušima" # 厳島神社
 building_itsukushima_jinja_01_desc: "Svatyně Icukušima byla založena v 6. století a zasvěcena šintoistickým bohyním moře a bouří. Její ochozy stojí nad vodou a hledí k proslulé bráně torii, která jako by se vznášela nad hladinou zálivu Macušima."
 building_itsukushima_jinja_02: "$building_itsukushima_jinja_01$"
 building_itsukushima_jinja_02_desc: "$building_itsukushima_jinja_01_desc$"
 building_type_heian_palace_01: "$building_heian_palace_01$"
 building_type_heian_palace_01_desc: "$building_heian_palace_01_desc$"
 building_heian_palace_01: "Palác Heian" # 平安宮
 building_heian_palace_01_desc: "Rozsáhlý palácový komplex vystavěl císař Kammu jako ústřední stavbu svého velkého města Heian-kjó neboli „Hlavního města míru“. Sídlí zde císařský dvůr, panovnická rodina i ústřední správní úřady Japonska. Jeho chodby jsou rušnými středisky obřadů, politiky a pletich, v nichž dávné šlechtické rody soupeří o vliv."
 building_type_ise_jingu_01: "$building_ise_jingu_01$"
 building_type_ise_jingu_01_desc: "$building_ise_jingu_01_desc$"
 building_ise_jingu_01: "Svatyně Ise" # 伊勢神宮
 building_ise_jingu_01_desc: "Svatyně Ise-džingú je zasvěcena bohyni slunce #EMP Amaterasu#! a patří mezi nejposvátnější šintoistická místa. Ukrývá císařské regálie Jamata a dohlíží na ni panenská kněžka saigú vybraná z císařského rodu."
 building_type_kofuku_ji_01: "$building_kofuku_ji_01$"
 building_type_kofuku_ji_01_desc: "$building_kofuku_ji_01_desc$"
 building_kofuku_ji_01: "Chrám Kófuku" # 興福寺
 building_kofuku_ji_01_desc: "Kófukudži pochází ze 7. století a patří mezi Sedm velkých chrámů Nary i mezi nejstarší a nejvýznamnější střediska buddhistického myšlení a moci v Japonsku."
 building_type_enryaku_ji_01: "$building_enryaku_ji_01$"
 building_type_enryaku_ji_01_desc: "$building_enryaku_ji_01_desc$"
 building_enryaku_ji_01: "Chrám Enrjaku" # 延暦寺
 building_enryaku_ji_01_desc: "Enrjakudži založil $SaichO_$ na konci 8. století na hoře Hiei nad hlavním městem císaře Kammua Heian-kjó. Chrám je japonským střediskem buddhistické školy Pundaríka neboli Tendai."
 building_type_dazaifu_01: "$building_dazaifu_01$"
 building_type_dazaifu_01_desc: "$building_dazaifu_01_desc$"
 building_dazaifu_01: "Úřad Dazaifu" # 興福寺
 building_dazaifu_01_desc: "Město Dazaifu je správním střediskem císařského dvora na vzdáleném Kjúšú. Bylo založeno, aby dohlíželo na obranu ostrova, usnadňovalo zámořský obchod a přijímalo zahraniční hodnostáře. Správa Dazaifu bývá obvyklým odrazovým můstkem v kariéře ctižádostivých úředníků."
 building_type_chinjufu_01: "$building_chinjufu_01$"
 building_type_chinjufu_01_desc: "$building_chinjufu_01_desc$"
 building_chinjufu_01: "Oblast Čindžufu" # 鎮守府
 building_chinjufu_01_desc: "Čindžufu původně sídlilo v Taze a je opevněným střediskem císařského úsilí o podmanění severního Japonska. Dohlíží na ně zvláštní velitel odpovědný za obranu a výběr daní v oblasti."
 building_type_hakata_port_01: "$building_hakata_port_01$"
 building_type_hakata_port_01_desc: "$building_hakata_port_01_desc$"
 building_hakata_port_01: "Přístav Hakata" # 博多
 building_hakata_port_01_desc: "Přístavní město Hakata na severním pobřeží Kjúšú je již od nejstarších dob Jamata námořní branou a rušným obchodním střediskem pod dohledem nedalekého úřadu Dazaifu. Kupci zde prodávají zboží ze vzdálených zemí a zahraniční poselstva poprvé vstupují na japonskou půdu."
 building_hakata_port_02: "$building_hakata_port_01$"
 building_hakata_port_02_desc: "$building_hakata_port_01_desc$"
 building_type_hwangnyongsa_01: "$building_hwangnyongsa_01$"
 building_type_hwangnyongsa_01_desc: "$building_hwangnyongsa_01_desc$"
 building_hwangnyongsa_01: "Chrám Hwangnjong" # 皇龍寺 (황룡사)
 building_hwangnyongsa_01_desc: "Hwangnjongsa neboli „Chrám císařského draka“ byla dokončena v 7. století. Tento rozsáhlý komplex vystavěl sillský král Čin-hung jako středisko buddhistického učení a moci a pyšní se jednou z nejvyšších pagod na světě."
 building_type_white_deer_grotto_academy_01: "$building_white_deer_grotto_academy_01$"
 building_type_white_deer_grotto_academy_01_desc: "$building_white_deer_grotto_academy_01_desc$"
 building_white_deer_grotto_academy_01: "Akademie Jeskyně bílého jelena"
 building_white_deer_grotto_academy_01_desc: "Akademii založil poustevník Li Po na místě, kde se volně proháněli bílí jeleni, a později vzkvétala jako středisko neokonfucianismu."
 building_type_shigu_academy_01: "$building_shigu_academy_01$"
 building_type_shigu_academy_01_desc: "$building_shigu_academy_01_desc$"
 building_shigu_academy_01: "Akademie Š'-ku"
 building_shigu_academy_01_desc: "Tato akademie přitahovala učence studující klasická díla v poklidných kopcích Chu-nanu. Jako středisko poezie a filozofie přenesla tradice dynastie Tchang do období Sung."
 building_type_culai_academy_01: "$building_culai_academy_01$"
 building_type_culai_academy_01_desc: "$building_culai_academy_01_desc$"
 building_culai_academy_01: "Akademie Cu-laj"
 building_culai_academy_01_desc: "Učenci vystavěli mezi vrcholky hory Cu-laj akademii, kde mohli v ústraní studovat konfuciánské texty. Jejími síněmi zněly debaty o uvedení přírody a vlády do souladu."
 building_type_lize_academy_01: "$building_lize_academy_01$"
 building_type_lize_academy_01_desc: "$building_lize_academy_01_desc$"
 building_lize_academy_01: "Akademie Li-ce"
 building_lize_academy_01_desc: "Akademie Li-ce podporuje vzdělanost mezi vodami a rákosinami Che-peje a slouží jako severní bašta konfuciánského řádu uprostřed proměnlivého pohraničí."
 building_type_maoshan_academy_01: "$building_maoshan_academy_01$"
 building_type_maoshan_academy_01_desc: "$building_maoshan_academy_01_desc$"
 building_maoshan_academy_01: "Akademie Mao-šan"
 building_maoshan_academy_01_desc: "Akademie vyučující obřadům, meditaci a posvátným textům slouží jako duchovní protiváha konfuciánských akademií období Sung."
 building_type_tiantai_monasteries_01: "$building_tiantai_monasteries_01$"
 building_type_tiantai_monasteries_01_desc: "$building_tiantai_monasteries_01_desc$"
 building_tiantai_monasteries_01: "Kláštery Tchien-tchaj"
 building_tiantai_monasteries_01_desc: "Tato vzdělávací instituce školy Tchien-tchaj se specializuje na výuku filozofie a meditace."
 building_type_jizu_shan_temples_01: "$building_jizu_shan_temples_01$"
 building_type_jizu_shan_temples_01_desc: "$building_jizu_shan_temples_01_desc$"
 building_jizu_shan_temples_01: "Chrámy Ťi-cu-šan"
 building_jizu_shan_temples_01_desc: "Komplex buddhistických horských klášterů sloužil jako bašta esoterického buddhismu. Poutníci jej přirovnávali k indickému Supímu vrchu."
 building_type_nanhua_temple_01: "$building_nanhua_temple_01$"
 building_type_nanhua_temple_01_desc: "$building_nanhua_temple_01_desc$"
 building_nanhua_temple_01: "Chrám Nan-chua"
 building_nanhua_temple_01_desc: "Sídlo šestého patriarchy čchanového buddhismu Chuej-nenga dodnes zůstává živým střediskem čchanového učení."
 building_type_byeokran_port_01: "$building_byeokran_port_01$"
 building_type_byeokran_port_01_desc: "$building_byeokran_port_01_desc$"
 building_byeokran_port_01: "Přístav Pjokran" # 碧瀾渡 (벽란도)
 building_byeokran_port_01_desc: "Přístav Pjokran leží západně od města Kesong u ústí řeky Rjesong a představuje nejpřímější cestu, po níž mohou zahraniční zboží a cestovatelé vstoupit na Korejský poloostrov, aniž by museli překonávat severní hranice a pohoří."
 building_type_sado_mines_01: "$building_sado_mines_02$" # 佐渡金山
 building_type_sado_mines_01_desc: "$building_sado_mines_01_desc$"
 building_sado_mines_01: "Zlatokopecké jámy Sado"
 building_sado_mines_01_desc: "Jen málokdo by čekal, že vzdálený ostrov Sado, odedávna sloužící jako vyhnanství, může pod svým povrchem tajně ukrývat takové bohatství zlata."
 building_sado_mines_02: "Zlatý důl Sado"
 building_sado_mines_02_desc: "Těžební jámy byly rozšířeny a byli přivedeni inženýři, aby bylo možné výrazně zvýšit těžbu zlata."
 building_sado_mines_03: "Velký zlatý důl Sado"
 building_sado_mines_03_desc: "Kolem četných těžebních jam vyrostla vesnice a dělníci pravidelně nacházejí nové zlaté žíly."
 building_sado_mines_04: "Komplex zlatých dolů Sado"
 building_sado_mines_04_desc: "Těžba zlata dosáhla téměř průmyslového rozsahu a počet dělníků se nyní pohybuje v tisících. Z dolů zdánlivě proudí nekonečné bohatství."
 building_type_tada_mines_01: "$building_tada_mines_02$" # 多田銀銅山遺
 building_type_tada_mines_01_desc: "$building_tada_mines_01_desc$"
 building_tada_mines_01: "Měděné těžební jámy Tada"
 building_tada_mines_01_desc: "Pod vesnicí Tada ukrytou v pohoří Hokusecu čeká na vytěžení bohatství drahých kovů. Říká se, že kov k pozlacení velkého Buddhy v Tódaidži pocházel právě odsud."
 building_tada_mines_02: "Měděný důl Tada"
 building_tada_mines_02_desc: "Těžební jámy byly rozšířeny a byli přivedeni inženýři, aby bylo možné výrazně zvýšit těžbu mědi."
 building_tada_mines_03: "Velký měděný důl Tada"
 building_tada_mines_03_desc: "Kolem četných těžebních jam vyrostla vesnice a dělníci pravidelně nacházejí nové měděné žíly."
 building_tada_mines_04: "Komplex měděných dolů Tada"
 building_tada_mines_04_desc: "Těžba mědi dosáhla téměř průmyslového rozsahu a počet dělníků se nyní pohybuje v tisících. Z dolů zdánlivě proudí nekonečné bohatství."
 building_type_tsushima_mines_01: "$building_tsushima_mines_02$" # 対馬銀山
 building_type_tsushima_mines_01_desc: "$building_tsushima_mines_01_desc$"
 building_tsushima_mines_01: "Stříbrné těžební jámy Cušima"
 building_tsushima_mines_01_desc: "Ostrov Cušima je proslulý ložisky stříbra objevenými na konci 7. století za vlády císaře Tenmua. Černé rudy bohaté na galenit vydávají u Japonského moře veliké bohatství."
 building_tsushima_mines_02: "Stříbrný důl Cušima"
 building_tsushima_mines_02_desc: "Těžební jámy byly rozšířeny a byli přivedeni inženýři, aby bylo možné výrazně zvýšit těžbu stříbra."
 building_tsushima_mines_03: "Velký stříbrný důl Cušima"
 building_tsushima_mines_03_desc: "Kolem četných těžebních jam vyrostla vesnice a dělníci pravidelně nacházejí nové stříbrné žíly."
 building_tsushima_mines_04: "Komplex stříbrných dolů Cušima"
 building_tsushima_mines_04_desc: "Těžba stříbra dosáhla téměř průmyslového rozsahu a počet dělníků se nyní pohybuje v tisících. Z dolů zdánlivě proudí nekonečné bohatství."
 building_type_koganeyama_mines_01: "$building_koganeyama_mines_02$"
 building_type_koganeyama_mines_01_desc: "$building_koganeyama_mines_01_desc$"
 building_koganeyama_mines_01: "Zlatokopecké jámy Kinka"
 building_koganeyama_mines_01_desc: "Ostrov Kinka a s ním spojená svatyně Koganejama jsou proslulé nejstaršími objevenými ložisky zlata v Japonsku, která mají podobu zlatého prachu. Svatyni založil v 8. století císař Šómu a je zasvěcena #EMP Kanajamovi#!, bohu hornictví."
 building_koganeyama_mines_02: "Zlatý důl Kinka"
 building_koganeyama_mines_02_desc: "Těžební jámy byly rozšířeny a byli přivedeni inženýři, aby bylo možné výrazně zvýšit těžbu zlata."
 building_koganeyama_mines_03: "Velký zlatý důl Kinka"
 building_koganeyama_mines_03_desc: "Kolem četných těžebních jam vyrostla vesnice a dělníci pravidelně nacházejí nové zlaté žíly."
 building_koganeyama_mines_04: "Komplex zlatých dolů Kinka"
 building_koganeyama_mines_04_desc: "Těžba zlata dosáhla téměř průmyslového rozsahu a počet dělníků se nyní pohybuje v tisících. Z dolů zdánlivě proudí nekonečné bohatství."
 building_type_mount_baekdu_01: "Hora Pektu"
 building_type_mount_baekdu_01_desc: "Vznešený vrchol hory Pektu je údajně počátkem všech hor Korejského poloostrova a jeho výšiny jsou posvátným místem mnoha věr a národů celé oblasti."
 building_mount_baekdu_01: "$building_type_mount_baekdu_01$"
 building_mount_baekdu_01_desc: "$building_type_mount_baekdu_01_desc$"
 building_type_mozu_tombs: "$building_mozu_tombs$"
 building_type_mozu_tombs_desc: "$building_mozu_tombs_desc$"
 building_mozu_tombs: "Hrobky Mozu"
 building_mozu_tombs_desc: "Mohyly ve tvaru klíčové dírky v Mozu jsou údajně místem posledního odpočinku dávných císařů. Lodím v nedalekém zálivu slouží jako výrazný orientační bod i připomínka minulých časů."
 building_type_trosky_castle_01: "$building_trosky_castle_01$"
 building_type_trosky_castle_01_desc: "$building_trosky_castle_01_desc$"
 building_trosky_castle_01: "Hrad Trosky"
 building_trosky_castle_01_desc: "Hrad Trosky stojí mezi dvěma čedičovými skalními útvary dávno vyhaslé sopky. Svůj název získal podle tvaru skal, které připomínají rozvaliny zříceného hradu."
