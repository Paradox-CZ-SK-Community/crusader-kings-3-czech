 building_type_allaq_mines_01: "Doly ve Vádí al-Alláku"
 building_type_allaq_mines_01_desc: "Hory Východoegyptské pouště, které kronikáři označují prostě za hornickou zemi, ukrývají hluboká ložiska zlata. Hlavním střediskem oblasti je Vádí al-Allák se svými doly."
