 building_kutna_hora_mines_04: "Kutnohorský důlní komplex"
 building_kutna_hora_mines_04_desc: "$building_rammelsberg_mines_04_desc$"
 building_type_schwaz_mines_01: "Schwazský důl"
 building_type_schwaz_mines_01_desc: "Schwazský stříbrný důl leží v údolí na úpatí hor Kellerjoch a Eiblschrofen. Možnosti těžby přitahují do oblasti velké množství lidí."
