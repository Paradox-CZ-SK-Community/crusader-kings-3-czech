 building_type_xiuyan_mines_01: "Nefritové doly Siou-jen"
 building_type_xiuyan_mines_01_desc: "Tento starobylý lom zásobuje místní obyvatele vysoce kvalitním nefritem již několik tisíciletí. Lid kultury Chung-šan z něj vyráběl náramky, nástroje i symbolické artefakty, které obohacovaly společenský život a posilovaly vážnost rodin."
