 building_type_special_sicilian_parliament_01: "Parlament"
 building_type_special_sicilian_parliament_01_desc: "$building_special_sicilian_parliament_01_desc$"
 building_special_sicilian_parliament_01: "Parlament"
 building_special_sicilian_parliament_01_desc: "Zástupci tří stavů se v této budově pravidelně scházejí, aby projednávali záležitosti panství a radili současnému vládci."
 building_special_greenhouse_01: "Skleněný monument"
 building_special_greenhouse_01_desc: "Tato budova se zdá být znamenitě uzpůsobena k pěstování zeleniny."
 building_type_special_greenhouse_01: "Skleněný monument"
 building_type_special_greenhouse_01_desc: "Tato budova se zdá být znamenitě uzpůsobena k pěstování zeleniny."
 building_type_university_01: "Univerzita"
 building_type_university_01_desc: "Místo vyššího vzdělávání určené těm, kdo mají dostatek vlivu a zlata, aby si zajistili přijetí."
 building_university_01: "Univerzita I"
 building_university_01_desc: "$building_type_university_01_desc$"
 building_university_02: "Univerzita II"
 building_university_02_desc: "$building_type_university_01_desc$"
 building_university_03: "Univerzita III"
 building_university_03_desc: "$building_type_university_01_desc$"
