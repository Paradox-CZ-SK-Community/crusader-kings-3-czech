 building_falun_mines_04_desc: "$building_rammelsberg_mines_04_desc$"
 building_type_kutna_hora_mines_01: "Kutnohorský důl"
 building_type_kutna_hora_mines_01_desc: "Kutnohorský důl je rozsáhlý stříbrný důl ležící na pozemcích sedleckého kláštera. S podporou místních opatů #italic (a německých horníků)#! zdejší těžba vzkvétá."
