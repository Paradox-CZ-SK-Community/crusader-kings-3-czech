 building_type_hetian_mines_01: "Chotanské doly"
 building_type_hetian_mines_01_desc: "Chotan je od nepaměti zdrojem chotanského nefritu. Tento drahocenný bílý kámen je ze všech druhů nefritu nejceněnější a mnozí si jej cení více než zlata či stříbra. Nefrit se těží přímo v horách a sbírá v povrchových jámách i říčních korytech."
 hetian_mines_01: "Hornická osada Khotan" # todo: NEW TRANSLATION
 hetian_mines_01_desc: "$building_type_hetian_mines_01_desc$" # todo: NEW TRANSLATION
 hetian_mines_02: "Důl Khotan" # todo: NEW TRANSLATION
 hetian_mines_02_desc: "Jak se hornická osada rozrůstá, těží se stále více jadeitu. S rostoucí slávou těchto drahokamů přichází stále více schopných inženýrů a obchodníků, což výrazně zvyšuje výnosnost těžby." # todo: NEW TRANSLATION
 hetian_mines_03: "Velký důl Khotan" # todo: NEW TRANSLATION
 hetian_mines_03_desc: "S rozvojem těžby se rozrůstá i samotný důl. V dolech pracuje stále více lidí a ruch na cestách do mnoha míst, kde se těží jadeit, se stává běžnou součástí zdejší krajiny." # todo: NEW TRANSLATION
 hetian_mines_04: "Důlní komplex Khotan" # todo: NEW TRANSLATION
 hetian_mines_04_desc: "Jadeit se postupem času stal nejen hlavním vývozním artiklem tohoto kraje, ale i zdrojem obživy mnoha místních umělců a řemeslníků. Ulice nyní lemují dílny a obchody, které společně tvoří skutečné průmyslové odvětví." # todo: NEW TRANSLATION
 building_type_dushan_mines_01: "Doly Tu-šan"
 building_type_dushan_mines_01_desc: "Tu-šan patří mezi čtyři velké čínské druhy nefritu a těží se zde již od dob dynastie Chan. Od ostatních druhů se liší sytějšími barvami, které bývají také výrazně pestřejší."
