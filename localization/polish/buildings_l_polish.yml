 building_type_mandala_capital_01: "Chrámový komplex hlavního města"
 building_type_mandala_capital_01_desc: "Tento [Concept('great_project','velký projekt')|E] není pouhým chrámem. Je svědectvím naší odhodlanosti. Našich úspěchů. Naší #EMP velkoleposti#!. Takový chrám je symbolem vlády a blahovůle našeho božského a mocného dévarádži."
 mandala_capital_01: "Zdobený chrám" # todo: NEW TRANSLATION
 mandala_capital_01_desc: "Tento zdobený chrám je skromným počátkem velkého odkazu a místem, kde se lze modlit k vládnoucímu dévarádžovi." # todo: NEW TRANSLATION
 mandala_capital_02: "Majestátní chrám" # todo: NEW TRANSLATION
 mandala_capital_02_desc: "Chrám v hlavním sídle navazuje na původní stavbu a byl rozšířen o další svatyně, vybavení a výzdobu." # todo: NEW TRANSLATION
 mandala_capital_03: "Chrámový areál" # todo: NEW TRANSLATION
 mandala_capital_03_desc: "Přibyly další příbytky a chrám se začal měnit v rozlehlý areál.\nNyní v něm najdeme několik svatyní k modlitbám i přístřeší pro věřící, služebnictvo a duchovenstvo." # todo: NEW TRANSLATION
 mandala_capital_04: "Velkolepý chrámový komplex" # todo: NEW TRANSLATION
 mandala_capital_04_desc: "Chrámový komplex se nyní rozkládá na ploše malé vesnice a většinu potřeb si zajišťuje sám.\nPřibyla malá schrána na relikvie a meditační jezírka táhnoucí se od východu k západu, která ještě posilují spojení s duchovní říší." # todo: NEW TRANSLATION
 mandala_capital_05: "Božský chrámový palác" # todo: NEW TRANSLATION
 mandala_capital_05_desc: "Tento chrámový palác je vzácným architektonickým skvostem, rozšířeným o nádherné příbytky pro božského dévarádžu.\nCestovatelé přijíždějí zdaleka, aby obdivovali přemíru památek, relikvií a pokladů tohoto božského chrámového paláce." # todo: NEW TRANSLATION
 building_type_wulingyuan_01: "$wulingyuan_01$" # todo: CHANGED (predtym: $building_wulingyuan_01$)
 building_type_wulingyuan_01_desc: "$wulingyuan_01_desc$" # todo: CHANGED (predtym: $building_wulingyuan_01_desc$)
 wulingyuan_01: "Wu-ling-jüan" # todo: NEW TRANSLATION
 wulingyuan_01_desc: "Tyto hory jsou posety tisíci mohutných pískovcových pilířů, které se tyčí vysoko nad zemí. Přestože jsou pilíře nejvýraznějším zdejším útvarem, oblast je plná také roklí, potoků, jezírek a jeskyní." # todo: NEW TRANSLATION
 building_type_leshan_giant_buddha_01: "$leshan_giant_buddha_01$" # todo: CHANGED (predtym: $building_leshan_giant_buddha_01$)
 building_type_leshan_giant_buddha_01_desc: "$leshan_giant_buddha_01_desc$" # todo: CHANGED (predtym: $building_leshan_giant_buddha_01_desc$)
 leshan_giant_buddha_01: "Velký Buddha v Lešanu" # todo: NEW TRANSLATION
 leshan_giant_buddha_01_desc: "Tato socha Buddhy, vytesaná do skalní stěny, hledí na soutok řek Min a Ta-tu a vítá unavené pocestné." # todo: NEW TRANSLATION
 building_type_yungang_grottoes_01: "$yungang_grottoes_01$" # todo: CHANGED (predtym: $building_yungang_grottoes_01$)
 building_type_yungang_grottoes_01_desc: "$yungang_grottoes_01_desc$" # todo: CHANGED (predtym: $building_yungang_grottoes_01_desc$)
 yungang_grottoes_01: "Jeskyně Jün-kang" # todo: NEW TRANSLATION
 yungang_grottoes_01_desc: "Rozsáhlý komplex chrámových jeskyní čítá několik desítek větších a stovky menších jeskyní. Jsou v nich tisíce a tisíce soch Buddhy." # todo: NEW TRANSLATION
 building_type_wudang_mountain_temples_01: "$wudang_mountain_temples_01$" # todo: CHANGED (predtym: $building_wudang_mountain_temples_01$)
 building_type_wudang_mountain_temples_01_desc: "$wudang_mountain_temples_01_desc$" # todo: CHANGED (predtym: $building_wudang_mountain_temples_01_desc$)
 wudang_mountain_temples_01: "Chrámy na hoře Wu-tang" # todo: NEW TRANSLATION
 wudang_mountain_temples_01_desc: "Hory Wu-tang patří k několika horám posvátným pro taoismus. Nachází se zde také rozsáhlý chrámový komplex proslulý cvičením tchaj-ťi." # todo: NEW TRANSLATION
 building_type_shaolin_monastery_01: "$shaolin_monastery_01$" # todo: CHANGED (predtym: $building_shaolin_monastery_01$)
 building_type_shaolin_monastery_01_desc: "$shaolin_monastery_01_desc$" # todo: CHANGED (predtym: $building_shaolin_monastery_01_desc$)
 shaolin_monastery_01: "Klášter Šao-lin" # todo: NEW TRANSLATION
 shaolin_monastery_01_desc: "Klášter Šao-lin je známý především jako kolébka šaolinského kung-fu a místem, kde působí mniši vysoce zběhlí v bojových uměních. Je však také střediskem vzdělanosti a studia, kde se překládají buddhistické texty." # todo: NEW TRANSLATION
 building_type_lingyin_temple_01: "$lingyin_temple_01$" # todo: CHANGED (predtym: $building_lingyin_temple_01$)
 building_type_lingyin_temple_01_desc: "$lingyin_temple_01_desc$" # todo: CHANGED (predtym: $building_lingyin_temple_01_desc$)
 lingyin_temple_01: "Chrám Ling-jin" # todo: NEW TRANSLATION
 lingyin_temple_01_desc: "Chrám Ling-jin založil roku 328 n. l. indický mnich a poutník, aby šířil buddhismus. Od té doby se chrám nesmírně rozrostl. Má několik pavilonů, mnoho jeskyní a pagod a dostatek ubytoven pro tisíce mnichů." # todo: NEW TRANSLATION
 building_type_giant_wild_goose_pagoda_01: "$giant_wild_goose_pagoda_01$" # todo: CHANGED (predtym: $building_giant_wild_goose_pagoda_01$)
 building_type_giant_wild_goose_pagoda_01_desc: "$giant_wild_goose_pagoda_01_desc$" # todo: CHANGED (predtym: $building_giant_wild_goose_pagoda_01_desc$)
 giant_wild_goose_pagoda_01: "Pagoda divoké husy" # todo: NEW TRANSLATION
 giant_wild_goose_pagoda_01_desc: "Pagoda divoké husy byla postavena roku 652 n. l. jako místo k uchovávání a ochraně textů, řezeb a různých sošek. Později byla přestavěna do působivé výšky deseti pater, než ji další přestavby a opravy snížily na sedm." # todo: NEW TRANSLATION
 building_type_kaifeng_palace_01: "$kaifeng_palace_01$" # todo: CHANGED (predtym: $building_kaifeng_palace_01$)
 building_type_kaifeng_palace_01_desc: "$kaifeng_palace_01_desc$" # todo: CHANGED (predtym: $building_kaifeng_palace_01_desc$)
 kaifeng_palace_01: "Císařský palác v Kchaj-fengu" # todo: NEW TRANSLATION
 kaifeng_palace_01_desc: "Císařský palác v Kchaj-fengu byl vystavěn poté, co dynastie Sung učinila z města své hlavní sídlo. Za jeho zdmi vládne silná a výkonná vláda, která zajišťuje, aby město i celé panství prosperovaly." # todo: NEW TRANSLATION
 kaifeng_examination_cost_bonus_desc: "Náklady na [GetActivityType('activity_imperial_examination').GetTextIcon][GetActivityType( 'activity_imperial_examination').GetName] [Concept('activity','aktivitu')|E], dokud je toto [Concept('barony','baronství')|E] [Concept('realm_capital','hlavním sídlem panství')|E]: #P -[EmptyScope.ScriptValue('kaifeng_examination_cost_value')|%0]#!"
 kaifeng_palace_name_desc: "[GetBuildingType('kaifeng_palace_01').GetName]" # todo: CHANGED (predtym: [GetBuilding('kaifeng_palace_01').GetName])
 building_type_forbidden_city_01: "$forbidden_city_01$" # todo: CHANGED (predtym: $building_forbidden_city_01$)
 building_type_forbidden_city_01_desc: "$forbidden_city_01_desc$" # todo: CHANGED (predtym: $building_forbidden_city_01_desc$)
 forbidden_city_01: "Zakázané město" # todo: NEW TRANSLATION
 forbidden_city_01_desc: "Zakázané město je rozlehlý císařský palác tvořený téměř tisícovkou samostatných budov. Celý areál obklopuje vysoká zeď a hluboký příkop, které chrání vládnoucí dvůr i mnoho úředníků, kteří v něm neúnavně pracují." # todo: NEW TRANSLATION
 building_type_qianling_mausoleum_01: "$qianling_mausoleum_01$" # todo: CHANGED (predtym: $building_qianling_mausoleum_01$)
 building_type_qianling_mausoleum_01_desc: "$qianling_mausoleum_01_desc$" # todo: CHANGED (predtym: $building_qianling_mausoleum_01_desc$)
 qianling_mausoleum_01: "Mauzoleum Čchien-ling" # todo: NEW TRANSLATION
 qianling_mausoleum_01_desc: "Mauzoleum Čchien-ling je především hrobkou císaře Kao-cunga a císařovny Wu Ce-tchien, pohřbeni jsou zde však i další členové rodu Li. Mohylu chrání obdélníková zeď a jedním z nejznámějších rysů mauzolea jsou četné kamenné sochy zdobící okolní krajinu." # todo: NEW TRANSLATION
 building_type_quanzhou_seaport_01: "$quanzhou_seaport_01$" # todo: CHANGED (predtym: $building_quanzhou_seaport_01$)
 building_type_quanzhou_seaport_01_desc: "$quanzhou_seaport_01_desc$" # todo: CHANGED (predtym: $building_quanzhou_seaport_01_desc$)
 quanzhou_seaport_01: "Přístav Čchüan-čou" # todo: NEW TRANSLATION
 quanzhou_seaport_01_desc: "Přístav Čchüan-čou přitahuje zahraniční obchodníky zdaleka. Připlouvají sem obchodníci z Arábie a Anatolie, Japonska a Koreje i ze všech míst mezi nimi. Příliv obchodních lodí zajišťuje rozkvět místního průmyslu a učinil z Čchüan-čou přední centrum stavby lodí v oblasti." # todo: NEW TRANSLATION
 building_type_angkor_wat_01: "$angkor_wat_01$" # todo: CHANGED (predtym: $building_angkor_wat_01$)
 building_type_angkor_wat_01_desc: "$angkor_wat_01_desc$" # todo: CHANGED (predtym: $building_angkor_wat_01_desc$)
 angkor_wat_01: "Angkor Vat" # todo: NEW TRANSLATION
 angkor_wat_01_desc: "Angkor Vat je rozsáhlý chrámový komplex zasvěcený božstvu Višnuovi. Byl navržen jako zpodobnění hory Méru, domova bohů v hinduistické mytologii. Komplex obklopuje mohutný příkop a jeho několik chrámů s galeriemi překypuje náboženskými díly, sochami a reliéfy." # todo: NEW TRANSLATION
 building_type_citadel_thang_long_01: "Citadela Thang Long" # 昇龍
 building_type_citadel_thang_long_01_desc: "$citadel_thang_long_01_desc$" # todo: CHANGED (predtym: $building_citadel_thang_long_01_desc$)
 citadel_thang_long_01: "Citadela Đai La" # todo: NEW TRANSLATION
 citadel_thang_long_01_desc: "Citadela sloužící jako vojenská základna místních armád, důkladně opevněná, aby pomáhala odrážet nájezdníky." # todo: NEW TRANSLATION
 citadel_thang_long_02: "Císařská citadela Thăng Long" # todo: NEW TRANSLATION
 citadel_thang_long_02_desc: "Císařská citadela slouží jako pevnost i královské sídlo. Její komplex tvoří tři části: hlavní opevnění, císařské město a Zakázané město." # todo: NEW TRANSLATION
 building_type_po_klong_garai_01: "$po_klong_garai_01$" # todo: CHANGED (predtym: $building_po_klong_garai_01$)
 building_type_po_klong_garai_01_desc: "$po_klong_garai_01_desc$" # todo: CHANGED (predtym: $building_po_klong_garai_01_desc$)
 po_klong_garai_01: "Chrám Po Klong Garai" # todo: NEW TRANSLATION
 po_klong_garai_01_desc: "Chrám Po Klong Garai, vrcholné dílo čamské architektury, byl údajně postaven na počest stejnojmenného legendárního krále. Jeho hlavními uměleckými díly jsou tři výrazné cihlové věže a působivá socha boha Šivy." # todo: NEW TRANSLATION
 building_type_dau_temple_01: "$dau_temple_01$" # todo: CHANGED (predtym: $building_dau_temple_01$)
 building_type_dau_temple_01_desc: "$dau_temple_01_desc$" # todo: CHANGED (predtym: $building_dau_temple_01_desc$)
 dau_temple_01: "Chrám Dâu" # todo: NEW TRANSLATION
 dau_temple_01_desc: "Uctívaný chrám v Luy Lâu označuje místo, kde se poprvé setkali mniši z dalekých zemí. Cihlová věž, relikvie a mumifikovaní mistři, kteří zde spočívají, jsou svědectvím staletí buddhistické zbožnosti." # todo: NEW TRANSLATION
 building_type_liuhe_pagoda_01: "$liuhe_pagoda_01$" # todo: CHANGED (predtym: $building_liuhe_pagoda_01$)
 building_type_liuhe_pagoda_01_desc: "$liuhe_pagoda_01_desc$" # todo: CHANGED (predtym: $building_liuhe_pagoda_01_desc$)
 liuhe_pagoda_01: "Pagoda Liou-che" # todo: NEW TRANSLATION
 liuhe_pagoda_01_desc: "Vysoká pagoda, kterou nechali postavit králové, aby zklidnili příliv a vzdali poctu Buddhovi. Její světlo září nad krajinou jako symbol souladu mezi lidmi a Nebesy." # todo: NEW TRANSLATION
 building_type_muaro_jambi_01: "$muaro_jambi_01$" # todo: CHANGED (predtym: $building_muaro_jambi_01$)
 building_type_muaro_jambi_01_desc: "$muaro_jambi_01_desc$" # todo: CHANGED (predtym: $building_muaro_jambi_01_desc$)
 muaro_jambi_01: "Komplex Muaro Jambi" # todo: NEW TRANSLATION
 muaro_jambi_01_desc: "Rozsáhlý cihlový komplex Muaro Jambi ležící podél řeky Batang Hari chránil obchod i víru. Jako pevnost Šrívidžajské říše poskytoval útočiště vládcům a umožňoval shromažďovat vojska v srdci Sumatry." # todo: NEW TRANSLATION
 building_type_hanging_temple_01: "$hanging_temple_01$" # todo: CHANGED (predtym: $building_hanging_temple_01$)
 building_type_hanging_temple_01_desc: "$hanging_temple_01_desc$" # todo: CHANGED (predtym: $building_hanging_temple_01_desc$)
 hanging_temple_01: "Zavěšený chrám" # todo: NEW TRANSLATION
 hanging_temple_01_desc: "Zavěšený chrám je klášter přichycený ke skalní stěně hory Heng. Podle legendy jeho stavbu před staletími zahájil mnich jménem Liaoran. Jeho dřevěné síně postavené na kůlech ukrývají svatyně buddhistických, taoistických a konfuciánských mudrců a s půvabným klidem spojují různá náboženství i vzdorují gravitaci." # todo: NEW TRANSLATION
 building_type_pagoda_of_fogong_temple_01: "$pagoda_of_fogong_temple_01$" # todo: CHANGED (predtym: $building_pagoda_of_fogong_temple_01$)
 building_type_pagoda_of_fogong_temple_01_desc: "$pagoda_of_fogong_temple_01_desc$" # todo: CHANGED (predtym: $building_pagoda_of_fogong_temple_01_desc$)
 pagoda_of_fogong_temple_01: "Pagoda chrámu Fogong" # todo: NEW TRANSLATION
 pagoda_of_fogong_temple_01_desc: "Pagoda chrámu Fogong je vysoká dřevěná pagoda postavená bez hřebíků. Má devět pater, ukrývá posvátné relikvie a sochy a její důmyslná konstrukce dodnes budí úžas jako technický zázrak i symbol víry." # todo: NEW TRANSLATION
 building_type_plain_of_jars_01: "$plain_of_jars_01$" # todo: CHANGED (predtym: $building_plain_of_jars_01$)
 building_type_plain_of_jars_01_desc: "$plain_of_jars_01_desc$" # todo: CHANGED (predtym: $building_plain_of_jars_01_desc$)
 plain_of_jars_01: "Planina džbánů" # todo: NEW TRANSLATION
 plain_of_jars_01_desc: "Planina džbánů je rozlehlá náhorní plošina posetá obřími kamennými nádobami, jejichž účel zůstává zahalen tajemstvím. Kdysi sloužily při dávných obřadech a dodnes přetrvávají jako pozůstatky zapomenutého lidu, vzbuzující úžas i úctu místních." # todo: NEW TRANSLATION
 building_type_dieng_plateau_01: "$dieng_plateau_01$" # todo: CHANGED (predtym: $building_dieng_plateau_01$)
 building_type_dieng_plateau_01_desc: "$dieng_plateau_01_desc$" # todo: CHANGED (predtym: $building_dieng_plateau_01_desc$)
 dieng_plateau_01: "Náhorní plošina Dieng" # todo: NEW TRANSLATION
 dieng_plateau_01_desc: "Náhorní plošina Dieng je sopečná kotlina zahalená mlhou, jejíž krajinu pokrývají sirná jezírka a vývěry plynů. Roztroušené starobylé chrámy a pověsti o obřadech jí dodávají pověst místa, které budí strach i úctu — posvátné vysočiny, kde se kdysi toulala prastará božstva dobra i zla." # todo: NEW TRANSLATION
 building_type_mount_apo_01: "$mount_apo_01$" # todo: CHANGED (predtym: $building_mount_apo_01$)
 building_type_mount_apo_01_desc: "$mount_apo_01_desc$" # todo: CHANGED (predtym: $building_mount_apo_01_desc$)
 mount_apo_01: "Hora Apo" # todo: NEW TRANSLATION
 mount_apo_01_desc: "Hora Apo se tyčí nad jezerem Venado a její jméno v jazycích Lumadů znamená „uctívaný stařešina“. Jde o zkrácenou podobu jména Apo Sandawa, ducha posvátné hory, kterému se také říká „Stařešina Sandawa“ nebo „Děd Sandawa“. Rituály na počest Apo Sandawy provádí šaman kmene, jenž je považován za prostředníka s duchy předků." # todo: NEW TRANSLATION
 building_type_besakih_temple_01: "$besakih_temple_01$" # todo: CHANGED (predtym: $building_besakih_temple_01$)
 building_type_besakih_temple_01_desc: "$besakih_temple_01_desc$" # todo: CHANGED (predtym: $building_besakih_temple_01_desc$)
 besakih_temple_01: "Chrám Besakih" # todo: NEW TRANSLATION
 besakih_temple_01_desc: "Besakih, známý jako „Matčin chrám Bali“, je nejvýznamnějším a nejposvátnějším hinduistickým chrámovým komplexem na ostrově. Leží na svazích hory Agung, nejvyšší sopky Bali a posvátné hory. Je náboženským i kulturním srdcem ostrova a pořádají se v něm velkolepé obřady pro všechny." # todo: NEW TRANSLATION
 building_type_gongsanseong_fortress_01: "$gongsanseong_fortress_01$" # todo: CHANGED (predtym: $building_gongsanseong_fortress_01$)
 building_type_gongsanseong_fortress_01_desc: "$gongsanseong_fortress_01_desc$" # todo: CHANGED (predtym: $building_gongsanseong_fortress_01_desc$)
 gongsanseong_fortress_01: "Pevnost Kongsansŏng" # todo: NEW TRANSLATION
 gongsanseong_fortress_01_desc: "Pevnost Kongsansŏng se tyčí na kopcích nad řekou Kŭm. Byla postavena jako královská citadela království Pekče a její dlouhé hradby a kamenné brány chránily krále i poddané. Tato horská pevnost byla oporou dynastické moci a obrany." # todo: NEW TRANSLATION
 building_type_krakatoa_01: "$krakatoa_01$" # todo: CHANGED (predtym: $building_krakatoa_01$)
 building_type_krakatoa_01_desc: "$krakatoa_01_desc$" # todo: CHANGED (predtym: $building_krakatoa_01_desc$)
 krakatoa_01: "Krakatoa" # todo: NEW TRANSLATION
 krakatoa_01_desc: "Krakatoa je mohutná sopka na malém souostroví nedaleko pobřeží." # todo: NEW TRANSLATION
 building_type_borobudur_01: "$borobudur_01$" # todo: CHANGED (predtym: $building_borobudur_01$)
 building_type_borobudur_01_desc: "$borobudur_01_desc$" # todo: CHANGED (predtym: $building_borobudur_01_desc$)
 borobudur_01: "Borobudur" # todo: NEW TRANSLATION
 borobudur_01_desc: "Borobudur je obrovský buddhistický chrám tvořený devíti kamennými terasami nad sebou, které završuje centrální kopule. Chrám zdobí tisíce reliéfů a stovky soch Buddhy." # todo: NEW TRANSLATION
 building_type_hoshi_ryokan_01: "$hoshi_ryokan_01$" # todo: CHANGED (predtym: $building_hoshi_ryokan_01$)
 building_type_hoshi_ryokan_01_desc: "$hoshi_ryokan_01_desc$" # todo: CHANGED (predtym: $building_hoshi_ryokan_01_desc$)
 hoshi_ryokan_01: "Hóši rjókan" # todo: NEW TRANSLATION
 hoshi_ryokan_01_desc: "Hóši rjókan je starý tradiční hostinec, který provozuje jedna rodina. Cestujícím nabízí odpočinek na cestách, jídlo a přístup do lázní s horkými prameny." # todo: NEW TRANSLATION
 building_type_celestial_great_barracks_01: "Velká kasárna" # todo: CHANGED (predtym: $building_celestial_great_barracks_01$)
 building_type_celestial_great_barracks_01_desc: "Tato rozlehlá kasárna a pevnost poskytují místnímu guvernérovi vojáky k posílení jeho armád a výrazně zlepšují obranu zdejší oblasti. Po rozšíření se z nich stane samostatné pevnostní město, odkud se provincie brání, zásobuje a spravuje vždy, když úředníci selhávají." # todo: CHANGED (predtym: $building_celestial_great_barracks_01_desc$)
 celestial_great_barracks_01: "$building_type_celestial_great_barracks_01$" # todo: NEW TRANSLATION
 building_celestial_great_barracks_01_desc: "Tato mohutná kasárna a pevnost poskytují místnímu guvernérovi vojáky k posílení jeho vojsk a výrazně zlepšují obranu celé oblasti."
 celestial_great_barracks_enabled_desc: "[holder.GetShortUIName|U] [holder.LocalPlayerString( 'nejsi', 'není' )] vojenským [Concept('governor','guvernérem')|E]"
 celestial_great_barracks_great_project_only_desc: "Lze postavit pouze dokončením [GetGreatProjectType('construct_great_barracks').GetName] [Concept('great_project','velkým projektem')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 building_type_the_great_wall_01: "$the_great_wall_01$" # todo: CHANGED (predtym: $building_the_great_wall_01$)
 building_type_the_great_wall_01_desc: "$the_great_wall_01_desc$" # todo: CHANGED (predtym: $building_the_great_wall_01_desc$)
 the_great_wall_01: "Velká čínská zeď" # todo: NEW TRANSLATION
 the_great_wall_01_desc: "Toto je nejstarší část Velké čínské zdi, kterou z velké části postavila dynastie Čchin. Písek času možná obrousil kámen, cihly i maltu, stále však jde o mohutné opevnění." # todo: NEW TRANSLATION
 building_type_the_great_wall_02: "$the_great_wall_01$" # todo: CHANGED (predtym: $building_the_great_wall_01$)
 building_type_the_great_wall_02_desc: "$the_great_wall_02_desc$" # todo: CHANGED (predtym: $building_the_great_wall_02_desc$)
 the_great_wall_02: "Velká čínská zeď" # todo: NEW TRANSLATION
 the_great_wall_02_desc: "Dynastie Chan výrazně rozšířila stávající hradby, které vybudovali její předchůdci. Postavila některé z nejrozsáhlejších úseků, jež se táhnou stovky mil přes pouště i hory." # todo: NEW TRANSLATION
 building_type_the_great_wall_03: "$the_great_wall_01$" # todo: CHANGED (predtym: $building_the_great_wall_01$)
 building_type_the_great_wall_03_desc: "$the_great_wall_03_desc$" # todo: CHANGED (predtym: $building_the_great_wall_03_desc$)
 the_great_wall_03: "Velká čínská zeď" # todo: NEW TRANSLATION
 the_great_wall_03_desc: "Dynastie Wej, Čchi a Suej v 5. a 6. století našeho letopočtu přispěly k výstavbě zdi a několik jejích úseků opatřily lepším opevněním." # todo: NEW TRANSLATION
 building_type_the_great_wall_04: "$the_great_wall_01$" # todo: CHANGED (predtym: $building_the_great_wall_01$)
 building_type_the_great_wall_04_desc: "$the_great_wall_04_desc$" # todo: CHANGED (predtym: $building_the_great_wall_04_desc$)
 the_great_wall_04: "Velká čínská zeď" # todo: NEW TRANSLATION
 the_great_wall_04_desc: "Tato mohutná zeď je mimořádným technickým dílem, které se od svého prvotního vybudování v 7. století př. n. l. mnohokrát rozšířilo. Dnes se táhne tisíce mil a zahrnuje mnoho strážních věží, kasáren i posádek. Dokáže vůbec nějaký barbarský nájezdník překonat tuto mocnou překážku?" # todo: NEW TRANSLATION
