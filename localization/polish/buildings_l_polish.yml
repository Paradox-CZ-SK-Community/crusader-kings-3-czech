 building_type_ratnapura_mines_01: "Doly Ratnapura"
 building_type_ratnapura_mines_01_desc: "Ratnapura neboli Město drahokamů patří mezi nejvýznamnější světová naleziště rubínů a safírů. Po stovky let se zde toto bohatství těží a obchoduje se s kupci z indického subkontinentu, jihovýchodní Asie a Číny."
