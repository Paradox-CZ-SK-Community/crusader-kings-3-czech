 building_type_turda_mines_01: "Tordské solné doly"
 building_type_turda_mines_01_desc: "Mohutné solné masivy v Tordě tvoří po celá staletí základ transylvánského hospodářství. Doly a obchod se solí zůstávají významným zdrojem příjmů celé oblasti."
