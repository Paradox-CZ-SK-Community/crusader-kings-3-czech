 building_type_itoigawa_mines_01: "Nefritové doly Itoigawa"
 building_type_itoigawa_mines_01_desc: "Řeka Kotakigawa protéká soutěskou na úpatí hory Mjódžó a oplývá rozsáhlými nalezišti nefritu. Ta poskytují jeden z nejkrásnějších nefritů v celém kraji i daleko za jeho hranicemi a jeho zářivě zelená barva je skutečnou pastvou pro oči."
