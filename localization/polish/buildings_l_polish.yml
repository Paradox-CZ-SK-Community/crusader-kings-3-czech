 building_type_al_azhar_university: "Univerzita al-Azhar"
 building_type_al_azhar_university_desc: "$building_type_generic_university_desc$\n\nUniverzita al-Azhar nese jméno na počest Fátimy, dcery Mohameda, která bývala nazývána „al-Zahrá“ neboli „Zářivá“."
 building_al_azhar_university: "$building_type_al_azhar_university$"
 building_al_azhar_university_desc: "$building_type_al_azhar_university_desc$"
 building_type_sankore_university: "Univerzita Sankoré"
 building_type_sankore_university_desc: "$building_type_generic_university_desc$\n\nUniverzita Sankoré původně vznikla jako mešita a ve středisko vzdělanosti se proměnila poté, co získala množství knih od cestujících obchodníků."
 building_sankore_university: "$building_type_sankore_university$"
 building_sankore_university_desc: "$building_type_sankore_university_desc$"
 building_type_siena_university: "Univerzita v Sieně"
 building_type_siena_university_desc: "$building_type_generic_university_desc$\n\nUniverzitu v Sieně i mistry, kteří na ní působí, plně financují daně samotného města, konkrétně daň uvalená na osoby pronajímající pokoje jejím studentům."
 building_siena_university: "$building_type_siena_university$"
 building_siena_university_desc: "$building_type_siena_university_desc$"
 building_type_nalanda_university: "Univerzita v Nálandě"
 building_type_nalanda_university_desc: "$building_type_generic_university_desc$\n\nUniverzita v Nálandě je významným střediskem védské vzdělanosti a přitahuje studenty až z Tibetu a Číny."
 building_nalanda_university: "$building_type_nalanda_university$"
 building_nalanda_university_desc: "$building_type_nalanda_university_desc$"
 building_type_rammelsberg_mines_01: "Rammelsberské doly"
 building_type_rammelsberg_mines_01_desc: "Na úpatí Rammelsbergu se nachází výnosný a velmi žádaný stříbrný důl."
 building_rammelsberg_mines_01: "Rammelsberská hornická osada"
 building_rammelsberg_mines_01_desc: "Poblíž rudných žil vyrostla malá hornická osada. Osadníci začali žíly otevírat a těžit rudu, zatím však pouze škrábou po povrchu."
 building_rammelsberg_mines_02: "Rammelsberský důl"
 building_rammelsberg_mines_02_desc: "S růstem osady se těží stále více rudy. Příliv schopných inženýrů umožňuje vybudovat skutečný důl."
 building_rammelsberg_mines_03: "Velký Rammelsberský důl"
 building_rammelsberg_mines_03_desc: "S rozšiřováním těžby roste i samotný důl. Vznikají nové vstupy a jsou hloubeny rozsáhlé šachty umožňující těžbu hluboko uložené rudy."
 building_rammelsberg_mines_04: "Rammelsberský důlní komplex"
 building_rammelsberg_mines_04_desc: "S rostoucí těžbou rudy vzniká kolem osady několik sléváren a hutí. Zpracování kovů se pro místní obyvatele stalo druhou přirozeností a jejich umění je proslulé po celém známém světě."
 building_type_falun_mines_01: "Falunské doly"
 building_type_falun_mines_01_desc: "Tento důl, známý také jako „Stora Kopparberget“ #italic (Velká měděná hora)#!, produkuje obrovské množství mědi."
 building_falun_mines_01: "Falunská hornická osada"
