 rammelsberg_mines_01: "Hornická osada Rammelsberg" # todo: NEW TRANSLATION
 rammelsberg_mines_01_desc: "Nedaleko rudných žil vyrostla malá hornická osada. Osadníci začali žíly zpřístupňovat a těžit rudu, zatím však jen škrábou po povrchu." # todo: NEW TRANSLATION
