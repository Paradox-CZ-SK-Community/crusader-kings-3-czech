 building_university_06: "Univerzita VI"
 building_university_06_desc: "$building_type_university_01_desc$"
 building_type_pastures_01: "Dobytčí pastviny"
 building_type_pastures_01_desc: "Značná část této provincie je věnována chovu zvířat a slouží jako pastviny pro stáda hospodářských zvířat."
 building_pastures_01: "Prosté pastviny"
 building_pastures_01_desc: "Místní rolníci využívají pastviny k chovu menších zvířat, například ovcí a koz."
 building_pastures_02: "Usedlosti"
 building_pastures_02_desc: "V usedlostech žijí rolníci, kteří pěstují obilí a chovají zvířata pro vlastní potřebu."
 building_pastures_03: "Louky"
 building_pastures_03_desc: "Louky slouží k pastvě i k získávání sena na krušnější časy."
 building_pastures_04: "Kurníky"
 building_pastures_04_desc: "V kurnících se chová nenáročná drůbež ceněná pro vejce i maso."
 building_pastures_05: "Ohrady pro dobytek"
 building_pastures_05_desc: "Pevné ohrady dokážou bezpečně zadržet i větší hospodářská zvířata."
 building_pastures_06: "Včelíny"
 building_pastures_06_desc: "Mezi lesy a poli produkují včely chované ve včelínech velmi žádaný med."
 building_pastures_07: "Velké výběhy"
 building_pastures_07_desc: "V rozlehlých výbězích jsou bezpečně a pohodlně ustájeni koně i další tažná zvířata."
 building_pastures_08: "Dobytčí statky"
 building_pastures_08_desc: "Dobytčí statky jsou ideální k chovu velkých stád, protože poskytují dostatek pastvy i prostoru k pohybu."
 building_type_orchards_01: "Sady"
 building_type_orchards_01_desc: "Díky jedinečným vlastnostem zdejší půdy dávají tyto sady mimořádně sladké a chutné ovoce i bobule."
 building_orchards_01: "Ovocné sady"
 building_orchards_01_desc: "Specializované ovocné sady jsou sice malé, poskytují však bohatší a kvalitnější úrodu."
 building_orchards_02: "Porosty bobulovin"
 building_orchards_02_desc: "Řady keřů s bobulemi narušují jednotvárnost ovocných stromů."
 building_orchards_03: "Plantáže ovocných stromů"
 building_orchards_03_desc: "Rozlehlou a úhledně rozvrženou plochu zaplňují pečlivě prořezávané stromy plodící ovoce či ořechy."
 building_orchards_04: "Včelaři"
 building_orchards_04_desc: "Rozmístění včelínů mezi stromy přináší úrodu medu a zároveň zvyšuje produktivitu celého sadu."
 building_orchards_05: "Řady ořešáků"
 building_orchards_05_desc: "Vedle ovocných stromů se do dálky táhnou také řady ořešáků."
 building_orchards_06: "Smíšené sady"
 building_orchards_06_desc: "Po celém sadu jsou rozmístěny nejrůznější místní i dovezené stromy, což zajišťuje bohatou úrodu téměř za všech okolností."
 building_orchards_07: "Velkolepé sady"
 building_orchards_07_desc: "Kam až oko dohlédne, táhne se jedna řada ovocných stromů za druhou."
 building_orchards_08: "Roubované stromy"
 building_orchards_08_desc: "Roubování vhodných stromů výrazně usnadňuje množení pomalu rostoucích ovocných stromů a ořešáků."
 building_type_farm_estates_01: "Panská sídla"
 building_type_farm_estates_01_desc: "Majitelé panských sídel zaměstnávají stovky rolníků, kteří obdělávají jejich pole a pečují o dobytek. Čím větší mají moc, tím více půdy mohou jejich poddaní obdělávat a především tím více daní přinášejí."
 building_farm_estates_01: "Panské rezidence"
 building_farm_estates_01_desc: "Panské rezidence poskytují domov rodinám vlastníků půdy, jejich služebnictvu i rolníkům obdělávajícím jejich pole."
 building_farm_estates_02: "Zahrady a zeleninová pole"
 building_farm_estates_02_desc: "K sídlům přiléhají rozlehlé zahrady a pole plná dozrávající zeleniny, díky nimž jsou téměř soběstačná."
 building_farm_estates_03: "Zemědělské statky"
 building_farm_estates_03_desc: "Zemědělské statky spravují okolní pole, lesy a hospodářská stavení."
 building_farm_estates_04: "Stoakrová pole"
 building_farm_estates_04_desc: "Na těchto rozlehlých polích pracují desítky rolníků a rodině vlastnící půdu přinášejí ohromné bohatství."
 building_farm_estates_05: "Svobodné statky"
 building_farm_estates_05_desc: "Svobodné statky jsou obrovské a obklopuje je rozsáhlá půda. Jelikož se dědí z generace na generaci, mají zdejší rodiny dostatek času k dosažení co nejvyšších výnosů."
 building_farm_estates_06: "Větrné mlýny"
 building_farm_estates_06_desc: "Větrné mlýny přebírají většinu práce potřebné k mletí mouky a výrazně tak zvyšují efektivitu."
 building_farm_estates_07: "Scelené pozemkové državy"
 building_farm_estates_07_desc: "Bohatší rodiny vykupují majetek těch chudších a scelují své državy do rozlehlých statků. Všechny pak pracují pod jednotným vedením a především společně odvádějí daně."
 building_farm_estates_08: "Velkolepé statky"
 building_farm_estates_08_desc: "Tyto rozsáhlé komplexy dosahují málokdy vídaných rozměrů a dokážou uživit domácnost čítající tisíce lidí."
 farm_estates_3_4_trigger: "Vyžaduje jednu z následujících možností:\n$EFFECT_LIST_BULLET$[Concept('holder_possessive','Držitelova')|E] [Concept('culture','kultura')|E] má [Concept('innovation','inovaci')|E] #V $innovation_manorialism$#!, tato [Concept('province','provincie')|E] je typu [GetTerrain( 'farmlands' ).GetName] a má [Concept('holding','državu')|E] 2. úrovně\n$EFFECT_LIST_BULLET$[Concept('holder_possessive','Držitelova')|E] [Concept('culture','kultura')|E] má [Concept('tradition','tradici')|E] [GetCultureTradition('tradition_pastoralists').GetName|V] a tato [Concept('province','provincie')|E] má [Concept('building','budovu')|E] [GetBuilding('pastures_04').GetName]\n$EFFECT_LIST_BULLET$[Concept('holder_possessive','Držitelova')|E] [Concept('culture','kultura')|E] má [Concept('innovations','inovace')|E] #V $innovation_manorialism$#! a #V $innovation_champa_rice$#!, tato [Concept('province','provincie')|E] má [Concept('holding','državu')|E] 2. úrovně a přístup k řadě [Concept('buildings','budov')|E] [GetBuilding('paddy_fields_01').GetName]"
 building_type_regimental_grounds_01: "Plukovní cvičiště"
 building_type_regimental_grounds_01_desc: "Plukovní cvičiště zahrnuje několik budov určených k ubytování velkého množství odvedenců a zároveň navazuje na rozsáhlé pozemky, kde mohou nacvičovat boj."
 building_regimental_grounds_01: "Plukovní prostranství"
 building_regimental_grounds_01_desc: "Rozlehlé plochy jsou připraveny na příchod odvedenců a poskytují dostatek místa pro stany i výcvik."
 building_regimental_grounds_02: "Kanceláře kvartýrmistra"
 building_regimental_grounds_02_desc: "V kancelářích kvartýrmistra pracují správci, kteří zajišťují, aby měl každý odvedený voják své místo, kde složit hlavu, a zbraň namířenou proti nepříteli."
 building_regimental_grounds_03: "Polotrvalé ubikace"
 building_regimental_grounds_03_desc: "Dřevěná kasárna sice nejsou příliš odolná, ale místní odvedence většinou udrží v suchu a teple."
 building_regimental_grounds_04: "Plukovní kasárna"
 building_regimental_grounds_04_desc: "Okraje vyhrazených vojenských cvičišť lemují pevná kamenná kasárna. Lze zde připravit skutečně ohromné množství odvedenců."
 building_regimental_grounds_05: "Vojenské sýpky"
 building_regimental_grounds_05_desc: "Sýpky určené k zásobování odvedenců jsou připraveny po celý rok, takže povolání vojska vyžaduje jen nepatrné úsilí."
 building_regimental_grounds_06: "Kovárny"
 building_regimental_grounds_06_desc: "Na okrajích cvičiště vzniklo několik kováren, které odvedencům zajišťují zbraně i jejich opravy."
 building_regimental_grounds_07: "Důstojnické ubikace"
 building_regimental_grounds_07_desc: "Důstojnické ubikace jsou vystavěny podle vyšších nároků než obyčejná kasárna. Vyjadřují uznání statečnosti důstojníků a zároveň představují metu, k níž mají řadoví vojáci směřovat."
 building_regimental_grounds_08: "Rozšířené cvičiště"
 building_regimental_grounds_08_desc: "$building_type_regimental_grounds_01_desc$"
 building_type_curtain_walls_01: "Hradby a věže"
 building_type_curtain_walls_01_desc: "Kamenné hradby a hrozivé bašty poskytují vynikající ochranu před nájezdy i obléháním. Čím více opevnění je vybudováno, tím nedobytnějším se chráněný hrad stává."
 building_curtain_walls_01: "Bašty a kurtiny"
 building_curtain_walls_01_desc: "Prvním krokem při budování každého řádného opevnění je výstavba bašt a kurtin. Dokážou spolehlivě držet nepřátele i bouřící se rolníky v bezpečné vzdálenosti."
 building_curtain_walls_02: "Předhradí"
 building_curtain_walls_02_desc: "Předhradí je nejlépe chráněným místem pro uložení zásob nezbytných k přežití obléhání, jako jsou zbraně, zbroj a nakládané kančí hlavy."
 building_curtain_walls_03: "Hradbní věže"
 building_curtain_walls_03_desc: "Hradbní věže představují vynikající pozorovací stanoviště, z nichž mohou naši vojáci bezpečně ostřelovat blížící se armády. V dobách míru se z nich zase znamenitě shlíží na rolníky."
 building_curtain_walls_04: "Druhá kurtina"
 building_curtain_walls_04_desc: "Přidání druhé kurtiny vytváří nepřekonatelné obranné postavení. Pokud se nepřátelské armádě podaří prorazit první hradbu, uvítá ji další, což postačí k podlomení morálky každého útočníka!"
 building_curtain_walls_05: "Parkán"
 building_curtain_walls_05_desc: "Když se nepřátelské armádě podaří prorazit vnější hradby, nevědomky se ocitne v parkánu, známém také jako #emphasis pole smrti#!. Ďábelsky chytré!"
 building_curtain_walls_06: "Vnější předhradí"
 building_curtain_walls_06_desc: "Více hradeb znamená více předhradí, a tedy i více bezpečného prostoru pro skladování zásob. Při takovém množství předhradí můžeme uvnitř hradeb ustájit dokonce všechny rytířské koně. To se náramně hodí, pokud nám dojdou nakládané kančí hlavy..."
 building_curtain_walls_07: "Italská fortifikace"
 building_curtain_walls_07_desc: "Italská fortifikace neboli bastionová pevnost je obranná stavba schopná odolat i neustávajícímu ostřelování děly. Ne sice příliš dlouho, ale alespoň dostatečně na bezpečný útěk tajnými chodbami."
 building_curtain_walls_08: "Raveliny a kavalíry"
 building_curtain_walls_08_desc: "Kavalír je vyvýšená plošina, z níž mohou naši vojáci střílet přes hlavní předprseň přímo na nepřítele. Bohužel to také znamená, že nepřítel přesně ví, kam mířit... Vojáci rozmístění na ravelínech, trojúhelníkových předsunutých opevněních rozdělujících obléhající vojsko, se tomu však mohou pokusit zabránit."
 building_type_cereal_fields_01: "Statky a pole"
 building_type_cereal_fields_01_desc: "Statky a pole tvoří páteř každého hospodářství. Prosté obilí živí lidi, zvířata, armády i hostiny a jeho význam nelze podceňovat."
 building_cereal_fields_01: "Obdělávaná pole"
 building_cereal_fields_01_desc: "Obdělávaná pole tvoří páteř feudálního hospodářství. O každé se stará malá, avšak početná rodina rolníků, která je téměř ochotna odevzdat většinu své úrody koruně jako desátek!"
 building_cereal_fields_02: "Osady"
 building_cereal_fields_02_desc: "Výstavba dalších osad umožňuje zaměstnat na polích více rolníků, čímž roste místní produkce i výnos z daní."
 building_cereal_fields_03: "Stodoly a skladiště"
 building_cereal_fields_03_desc: "Výstavba stodol a větších skladišť umožňuje rolníkům uchovávat seno a slámu, poskytuje prostor pro nářadí a v nouzi také střechu nad hlavou cestujícím armádám i tulákům."
 building_cereal_fields_04: "Zemědělské usedlosti"
 building_cereal_fields_04_desc: "Větší zemědělské usedlosti uživí početnější rolnické rodiny. Mají-li rodiny dostatek prostoru a prostředků k růstu, přivádějí na svět více dětí, které lze zapojit do práce na polích."
 building_cereal_fields_05: "Sýpky"
 building_cereal_fields_05_desc: "Sýpky umožňují zemědělcům skladovat přes zimu obilí, sušené maso a další potraviny. Myším ani jiné havěti sice zcela neodolají, ale jejich obsah alespoň udrží v suchu."
 building_cereal_fields_06: "Grangie a desátkové stodoly"
 building_cereal_fields_06_desc: "Zemědělci bezpečně ukládají část své úrody náležející duchovenstvu do desátkových stodol. Nám to samozřejmě zároveň usnadňuje jejich zdanění."
 building_cereal_fields_07: "Rozlehlá obdělávaná pole"
 building_cereal_fields_07_desc: "Pobízením rolníků k obdělávání větších polí ležících těsně vedle sebe můžeme zvýšit produktivitu, avšak zasahování na cizí půdu může mezi zemědělci vyvolávat spory."
 building_cereal_fields_08: "Obilná sila"
 building_cereal_fields_08_desc: "Tato mohutná sila uchovávají obrovské množství obilí po celý rok, a dokonce i mezi jednotlivými roky, takže dokážou zásobovat skutečně početné obyvatelstvo."
 building_type_paddy_fields_01: "Rýžová pole"
 building_type_paddy_fields_01_desc: "Svět kráčí vpřed díky plnému žaludku. Skromné zrnko rýže se samo o sobě může zdát bezvýznamné, ale od nepaměti živí celé národy."
 building_paddy_fields_01: "Zavlažovaná pole"
 building_paddy_fields_01_desc: "Pěstování rýže je rozšířené ve vlhčích oblastech světa. Semena se obvykle zasévají do půdy, která se následně zalévá a obdělává, aniž by byla zcela ponořena pod vodou. Právě tak se však rýže pěstuje nejlépe."
 building_paddy_fields_02: "Obdělávání rýžovišť"
 building_paddy_fields_02_desc: "K účinnému pěstování rýže nestačí pouze voda a půda. Zem musí být připravena i pod hladinou, rozorána pluhy a vláčena háky."
 building_paddy_fields_03: "Zavlažované terasy"
 building_paddy_fields_03_desc: "Voda bývá vrtkavá. Aby byl její přísun stálý, musí se řídit, a při pěstování rýže #italic musí#! být stálý."
 building_paddy_fields_04: "Rýžové sýpky"
 building_paddy_fields_04_desc: "Lepší způsob pěstování vyžaduje i lepší skladování. Větší množství rýže je k ničemu, pokud se zkazí na neudržované hromadě. Samostatná budova postavená na podpěrách, aby se její podlaha nedotýkala země, usnadňuje sušení a skladování sklizené rýže."
 building_paddy_fields_05: "Pěstování sazenic"
 building_paddy_fields_05_desc: "Ne všechna zasazená rýže musí být sklizena k jídlu. Někdy je vhodné vyjmout čerstvě vyrašené sazenice celé ještě před dozráním, aby se zachovala určitá odrůda rýže a zvýšily zásoby osiva pro pozdější výsadbu."
 building_paddy_fields_06: "Rozmanité odrůdy rýže"
 building_paddy_fields_06_desc: "Rčení „všeho moc škodí“ platí v zemědělství stejně jako kdekoli jinde. Pěstování jediného druhu rýže může vést ke zničujícím ztrátám, pokud je některý rok jen o něco sušší či deštivější, trochu zataženější nebo zkrátka o trochu příliš #italic nějaký#! jedním z bezpočtu možných způsobů. Mnohem bezpečnější je udržovat pestrou směs odrůd rýže a rozložit tak rizika budoucnosti."
 building_paddy_fields_07: "Sklizeň obrostu"
 building_paddy_fields_07_desc: "Zbylá stébla sklizených rostlin rýže lze přimět k vyrašení dalších výhonků, a získat tak během stejné sklizňové sezóny druhou úrodu. Ne všechny odrůdy rýže na tento způsob pěstování reagují dobře, ale když se podaří, přináší pouze výhody."
 building_paddy_fields_08: "Velkokapacitní rýžové mlýny"
 building_paddy_fields_08_desc: "Rýže se nesbírá z polí a neputuje rovnou do misek. Musí projít celým řetězcem zpracování od čištění a sušení až po loupání a třídění. Pece a pečlivě udržované ohně mohou urychlit sušení a stoupy na rýži lze napojit na vodní kola, aby se loupání zmechanizovalo."
 building_type_barracks_01: "Kasárna"
 building_type_barracks_01_desc: "Kasárna jsou pevné budovy určené výhradně k ubytování a přípravě místních odvedenců na válku."
 building_barracks_01: "Dřevěná kasárna"
 building_barracks_01_desc: "Tato prostá dřevěná kasárna poskytují odvedencům během výcviku alespoň základní ochranu před nepřízní počasí."
 building_barracks_02: "Shromaždiště odvedenců"
 building_barracks_02_desc: "Vyčištěním rozsáhlého prostranství od všech překážek můžeme shromáždit vojáky na jednom místě a rozdělit je do jednotek. Dobrý rozhled navíc usnadňuje odhalování dezertérů."
 building_barracks_03: "Kamenná kasárna"
 building_barracks_03_desc: "Odolnější kamenná kasárna poskytují výrazně lepší ochranu před nepřízní počasí a nošení těžkých kamenů je navíc znamenitým výcvikem pro naše muže."
 building_barracks_04: "Pohyblivé tábory"
 building_barracks_04_desc: "Stálá kasárna jsou sice užitečná pro výcvik, ale dostupnost pohyblivých stanových táborů zvyšuje naši účinnost ve válce, protože se mohou přesouvat spolu s armádou."
 building_barracks_05: "Polní kovárny"
 building_barracks_05_desc: "Najmutím táborových kovářů k údržbě rezavých kopí a ohnutých vidlí našich odvedenců můžeme zvýšit účinnost vojska a učinit je alespoň o něco smrtonosnějším."
 building_barracks_06: "Výcviková prostranství"
 building_barracks_06_desc: "Rozmístěním cvičných figurín a překážkových drah dokážeme oddělit zrno od plev, a tak zjistit, které muže postavit do prvních řad."
 building_barracks_07: "Odvodní střediska"
 building_barracks_07_desc: "Vybudováním samostatných odvodních středisek ve všech okolních vesnicích zajistíme stálý přísun neochotných, podnapilých výtržníků, kteří rozšíří naše řady."
 building_barracks_08: "Stálá kasárna"
 building_barracks_08_desc: "Přestože musíme své odvedence často přesouvat bez varování, pevná a dobře vystavěná kasárna poskytují místo k ubytování zkušenějších vojáků a důstojníků."
 building_type_camel_farms_01: "Chov velbloudů"
 building_type_camel_farms_01_desc: "Tyto statky se věnují chovu velbloudů pro vojsko i místní rolníky při jejich každodenní práci. Velbloudi jsou všestranná a odolná jízdní zvířata, ideálně přizpůsobená drsnému pouštnímu podnebí."
 building_camel_farms_01: "Chovatelé velbloudů"
 building_camel_farms_01_desc: "$building_type_camel_farms_01_desc$"
 building_camel_farms_02: "Průzkumné stanice"
 building_camel_farms_02_desc: "Jezdci na velbloudech pravidelně cestují mezi průzkumnými stanicemi a převážejí zásoby i zprávy o aktuálním dění."
 building_camel_farms_03: "Lukostrojaři"
 building_camel_farms_03_desc: "Velbloudí jízda je nejúčinnější, jsou-li jezdci vybaveni luky, a místní lukostrojaři zajišťují stálý přísun lukostřeleckého vybavení."
 building_camel_farms_04: "Velbloudí trhy"
 building_camel_farms_04_desc: "Na tržišti panuje neustálý ruch a obchodníci zde denně směňují stovky velbloudů. Naši chovatelé tak získávají přístup k nejodolnějším a nejvytrvalejším kusům."
 building_camel_farms_05: "Náborová místa kočovníků"
 building_camel_farms_05_desc: "Nelítostní pouštní kočovníci jsou znamenitými vojáky, ale neslouží zadarmo. Poskytneme-li jim jako odměnu prvotřídní jízdní zvířata, zajistíme si jejich věrnost v budoucích konfliktech."
 building_camel_farms_06: "Vojenské stáje"
 building_camel_farms_06_desc: "Rozlehlé a pevné stáje poskytují útočiště našim ceněným válečným velbloudům a chrání je před zloději i drsnými podmínkami pouště."
 building_camel_farms_07: "Zbrojíři"
 building_camel_farms_07_desc: "Výroba zbroje pro velbloudy není snadná, ale výsledek za námahu stojí. Útok obávaných, plně obrněných velbloudů dokáže přimět každé vojsko na koních, aby se obrátilo na útěk."
 building_camel_farms_08: "Zkušení chovatelé"
 building_camel_farms_08_desc: "Skuteční znalci chovu velbloudů zde pěstují a vychovávají nejodolnější a nejdivočejší stáda v celém okolí."
 building_type_logging_camps_01: "Lesní hospodářství"
 building_type_logging_camps_01_desc: "Z těchto lesů se získává velké množství dřeva, pryskyřice, dřevěného uhlí a dalších surovin, které okolním městům poskytují znamenitý a blízký zdroj stavebního materiálu."
 building_logging_camps_01: "Dřevorubecké tábory"
 building_logging_camps_01_desc: "Dřevorubci si na okrajích lesa založili tábory, čímž zajišťují stálý přísun kulatiny."
 building_logging_camps_02: "Sběrači pryskyřice"
 building_logging_camps_02_desc: "Po celém lese se sbírá pryskyřice, která slouží jako lepidlo nebo se prodává duchovenstvu k použití při různých obřadech."
 building_logging_camps_03: "Uhlíři"
 building_logging_camps_03_desc: "Uhlíři neúnavně pracují v kouři a dýmu, aby místním kovářům zajistili cenné dřevěné uhlí."
 building_logging_camps_04: "Lesní pastviny"
 building_logging_camps_04_desc: "Některé části lesa jsou vyhrazeny k pastvě. Zvířata se pasou mezi stromy a vykrmují se množstvím ořechů, bobulí a listí."
 building_logging_camps_05: "Obdělaná pole"
 building_logging_camps_05_desc: "Tam, kde kdysi stály stromy, se nyní rozprostírají pole. Bývalý les poskytuje znamenitou zemědělskou půdu."
 building_logging_camps_06: "Medonosné pastviny"
 building_logging_camps_06_desc: "Na okraji lesa jsou rozmístěny včelíny, které využívají hojnost planých květin vyrůstajících tam, kde dříve stával les."
 building_logging_camps_07: "Lesní sklárny"
 building_logging_camps_07_desc: "Les představuje ideální místo pro práci sklářů. Díky snadnému přístupu k většině potřebných surovin zde lze vyrábět a prodávat cenné sklo."
 building_logging_camps_08: "Pily"
 building_logging_camps_08_desc: "Pily představují oproti sekerám obrovský pokrok. Les lze vytěžit téměř okamžitě a jeho cenné dřevo zásobuje naše města a osady."
 building_type_peat_quarries_01: "Mokřadní hospodářství"
 building_type_peat_quarries_01_desc: "Mokřady sice nikdy nenabídnou stejné možnosti pěstování plodin jako roviny, ale bujná vegetace dokáže uživit značné množství hospodářských zvířat. Lze zde také těžit rašelinu a získávat sůl."
 building_peat_quarries_01: "Dobytčí pastviny"
 building_peat_quarries_01_desc: "Úrodné mokřady poskytují znamenitou pastvu hospodářským zvířatům všech velikostí."
 building_peat_quarries_02: "Rašeliniště"
 building_peat_quarries_02_desc: "Těží se zde značné množství rašeliny. Její dostupnost napomáhá rozvoji nových statků a polí."
 building_peat_quarries_03: "Senosečné louky"
 building_peat_quarries_03_desc: "V okolí mokřadů roste velké množství trávy, která po sklizni slouží jako zimní krmivo pro zvířata."
 building_peat_quarries_04: "Solné studny"
 building_peat_quarries_04_desc: "Dělníci zahřívají vodu ve velkých pánvích a získávají z mokřadů sůl. Ta se následně používá ke konzervaci masa určeného k obchodu."
 building_peat_quarries_05: "Ohraničené mokřady"
 building_peat_quarries_05_desc: "Ohrazením mokřadů mohou rolníci lépe řídit růst rostlin a chránit zdejší cennou úrodu."
 building_peat_quarries_06: "Mokřadní pole"
 building_peat_quarries_06_desc: "Jedinečné vlastnosti mokřadů umožňují rolníkům úspěšně pěstovat mnoho rostlin, kterým by se jinde nedařilo, například konopí či len."
 building_peat_quarries_07: "Rozsáhlá rašeliniště"
 building_peat_quarries_07_desc: "Těží se zde stále více rašeliny, přičemž většina se vyváží do širokého okolí jako hnojivo."
 building_peat_quarries_08: "Rozlehlé mokřadní statky"
 building_peat_quarries_08_desc: "Velká stáda zvířat se živí hojnou mokřadní vegetací a dorůstají značné velikosti i váhy."
 building_type_hill_farms_01: "Horské statky"
 building_type_hill_farms_01_desc: "Zvlněné kopce této provincie pokrývají pole. Hospodaření na svazích sice usnadňuje zavlažování plodin, omezená rozloha však znamená menší výnosy."
 building_hill_farms_01: "Pole na úbočích"
 building_hill_farms_01_desc: "Na svazích četných kopců se rozkládá množství malých polí, která poskytují úrodu a obživu skromnému počtu rolníků."
 building_hill_farms_02: "Horské pastviny"
 building_hill_farms_02_desc: "Dobytek je vyháněn na neobdělávané vrchoviny, kde se pase na hojné trávě."
 building_hill_farms_03: "Zemní sklepy"
 building_hill_farms_03_desc: "Zemní sklepy umožňují celoroční skladování zeleniny, což je na málo úrodných kopcích mimořádně důležité."
 building_hill_farms_04: "Zeleninová pole"
 building_hill_farms_04_desc: "Rozlehlá zeleninová pole poskytují zdejším skromným hospodářstvím tolik potřebnou potravu."
 building_hill_farms_05: "Terasová pole"
 building_hill_farms_05_desc: "Svedením vody z nedalekého potoka na terasy lze výrazně zvýšit úrodnost polí na svazích."
 building_hill_farms_06: "Cesty a schodiště"
 building_hill_farms_06_desc: "Řádné cesty a schodiště spojují roztroušené statky a osady, čímž usnadňují dorozumívání i rychlejší pohyb lidí, zpráv a zboží."
 building_hill_farms_07: "Zimní sýpky"
 building_hill_farms_07_desc: "Potraviny uchované v těchto sýpkách dokážou po celou zimu uživit množství lidí i hospodářských zvířat."
 building_hill_farms_08: "Jabloňové sady"
 building_hill_farms_08_desc: "Zvlněné kopce poskytují ideální podmínky pro ovocné sady, zejména jabloňové."
 building_type_hill_forts_01: "Hradiště"
 building_type_hill_forts_01_desc: "Tato mohutná opevnění vystavěná na strmých kopcích či útesech pevně odolávají každé obléhající armádě, která neumí létat!"
 building_hill_forts_01: "Malé hradiště"
 building_hill_forts_01_desc: "Hradiště se hrdě tyčí na vrcholu kopce a nutí každého obléhatele bojovat do prudkého svahu."
 building_hill_forts_02: "Prosté zemní valy"
 building_hill_forts_02_desc: "Pevnost obklopují zemní valy tvořící téměř neproniknutelné hradby, které dokážou podlomit ducha i toho nejotrlejšího vojáka."
 building_hill_forts_03: "Příkopy"
 building_hill_forts_03_desc: "Kolem opevněného vrcholu jsou vyhloubeny hluboké příkopy. Kvůli jejich bahnitým a kluzkým stěnám mohou pošetilí útočníci uvíznout na dně a být utopeni v blátě vlastními postupujícími druhy."
 building_hill_forts_04: "Palisády"
 building_hill_forts_04_desc: "Pevnost obklopují vysoké stěny z naostřených kůlů, které tvoří další překážku na cestě k pokladům uvnitř."
 building_hill_forts_05: "Strážnice"
 building_hill_forts_05_desc: "Kolem pevnosti stojí strážnice s bdělými strážnými připravenými okamžitě zasáhnout, kdyby začal útok."
 building_hill_forts_06: "Vnější hradby"
 building_hill_forts_06_desc: "Hradiště nyní obklopují mohutné kamenné hradby, které definitivně stvrzují jeho nedobytnost."
 building_hill_forts_07: "Velké hradiště"
 building_hill_forts_07_desc: "Ústřední pevnost byla výrazně rozšířena a zdokonalena. Nyní se hrozivě tyčí vysoko k nebi."
 building_hill_forts_08: "Složité zemní opevnění"
 building_hill_forts_08_desc: "Zemní opevnění kolem hradiště je natolik spletité a matoucí, že nepřátelské armády sotva poznají, kterou bránu mají napadnout. To nám pochopitelně hraje do karet, zejména když polovina cest vede do smrtících léček..."
 building_type_plantations_01: "Pouštní zemědělství"
 building_type_plantations_01_desc: "Tyto plantáže se zaměřují na pěstování ovoce a zeleniny dostatečně odolných, aby přežily drsné podnebí."
 building_plantations_01: "Malé plantáže"
 building_plantations_01_desc: "Navzdory nedostatku vody se na těchto malých plantážích daří pěstovat mimořádně odolné ovoce."
 building_plantations_02: "Obchodní stanice"
 building_plantations_02_desc: "Odolní pouštní kočovníci putují mezi obchodními stanicemi a dopravují potraviny tam, kde jsou nejvíce zapotřebí."
 building_plantations_03: "Tkalci"
 building_plantations_03_desc: "Tkalci ve svých dílnách vyrábějí látky, které poté směňují s pouštními kočovníky."
 building_plantations_04: "Prameny"
 building_plantations_04_desc: "V kraji s nedostatkem vody dokáže nová studna přinést rozkvět. Bylo zde objeveno několik pramenů a nad nimi vybudovány řádné studny."
 building_plantations_05: "Karavanseráje"
 building_plantations_05_desc: "Větší obchodní karavany potřebují místo, kde mohou odpočívat jejich zvířata. Karavanseráj jim poskytuje potřebný prostor a zároveň představuje znamenité místo k vybírání daní z jejich zboží."
 building_plantations_06: "Datlové háje"
 building_plantations_06_desc: "S rostoucí rozlohou půdy vhodné pro plantáže vznikají datlové háje. Sladké datle dlouho vydrží a jsou cenným obchodním zbožím."
 building_plantations_07: "Zavlažování"
 building_plantations_07_desc: "Zaplavením polí vodou ze studní lze překročit rámec pouhého samozásobitelského hospodaření. Jde však o nesmírně náročný úkol, protože přimět poušť rozkvést není snadné."
 building_plantations_08: "Velké plantáže"
 building_plantations_08_desc: "Tyto plantáže nyní vytvářejí zřetelný přebytek, který lze směňovat a se ziskem prodávat."
 building_type_outposts_01: "Předsunuté stanice"
 building_type_outposts_01_desc: "Všechna významná sídla této provincie obklopuje síť předsunutých stanic, které včas varují před nájezdy či útoky zvěře."
 building_outposts_01: "Pozorovací věže"
 building_outposts_01_desc: "Kvůli sledování zvěře i blížících se nájezdníků obsazují řadu pozorovatelen bdělí strážní. Jakmile zahlédnou nebezpečnou šelmu, zpráva se rychle rozšíří a ohrožený dobytek lze odvést do bezpečí."
 building_outposts_02: "Vojenské stanice"
 building_outposts_02_desc: "Podél četných cest a křivolakých stezek stojí několik stanic obsazených strážemi placenými místními obchodníky. Jejich přítomnost zajišťuje, že kraj zůstává klidný, bezpečný a prostý lapků."
 building_outposts_03: "Skryté sklady zbraní"
 building_outposts_03_desc: "Jednou z výhod života v členité krajině je možnost ukrýt téměř cokoli. Kdyby se krajem přehnal nájezd, mohou se místní vyzbrojit z četných skrytých zásob."
 building_outposts_04: "Palisádové stanice"
 building_outposts_04_desc: "Staré vratké stanice nahradily pevné a odolné palisádové věže. Navíc jsou v členité krajině téměř dokonale ukryté."
 building_outposts_05: "Odvodní stanice"
 building_outposts_05_desc: "Poblíž každé věže nyní stojí odvodní stanice. V době mobilizace se zde mohou povolaní rolníci bezpečně shromáždit a nalézt zbraně i ochranu."
 building_outposts_06: "Pohraniční stanice"
 building_outposts_06_desc: "Na rozdíl od dobře ukrytých stanic mají pohraniční stanice nepřítele především odradit. Jsou vystavěny z odolnějších materiálů a samotná velikost těchto věží dokáže přimět každého nájezdníka obrátit se na útěk."
 building_outposts_07: "Průzkumné stanice"
 building_outposts_07_desc: "Aby měli naši průzkumníci dostatek zásob a mohli cestovat nalehko, vybudovali jsme síť strategicky rozmístěných průzkumných stanic. Tyto budovy jsou dobře ukryté před zraky nepřátel a během invaze umožňují získávat nedostižné množství zpráv."
 building_outposts_08: "Opevněné stanice"
 building_outposts_08_desc: "K nebi se nyní tyčí impozantní stanice vytesané z kamene, jejichž přítomnost dávají jasně najevo vojáci a strážci karavan ubytovaní uvnitř."
 building_type_watchtowers_01: "Strážní věže"
 building_type_watchtowers_01_desc: "Nad pracujícími rolníky bdí několik mohutných strážních věží, které lučištníkům poskytují znamenitý rozhled."
 building_watchtowers_01: "Věže z nepálených cihel"
 building_watchtowers_01_desc: "Tyto věže z nepálených cihel poskytují prostou, avšak účinnou obranu."
 building_watchtowers_02: "Obytné věže"
 building_watchtowers_02_desc: "Obytné věže slouží zároveň k ochraně i bydlení a stojí na strategických místech."
 building_watchtowers_03: "Dřevěné strážní věže"
 building_watchtowers_03_desc: "Několik dřevěných strážních věží shlíží na rolníky pracující na polích. Díky výhodné poloze z nich lučištníci poskytují znamenitou ochranu."
 building_watchtowers_04: "Malé donjony z nepálených cihel"
 building_watchtowers_04_desc: "Tyto zdokonalené donjony z nepálených cihel jsou sice malé, nabízejí však lepší ochranu než obyčejné strážní věže. Za války mohou ukrýt množství rolníků před nájezdníky a obsahují dokonce malou sýpku pro horší časy."
 building_watchtowers_05: "Kamenné strážní věže"
 building_watchtowers_05_desc: "Tyto věže poskytují znamenitý rozhled nejen lučištníkům, ale také pánům dohlížejícím na své rolníky."
 building_watchtowers_06: "Střílny"
 building_watchtowers_06_desc: "Vybudováním řady otvorů, jimiž lze z věží střílet šípy, se výrazně zvyšuje dostřel i ochrana lučištníků."
 building_watchtowers_07: "Pomezní věže"
 building_watchtowers_07_desc: "Tyto malé obytné věže jsou mimořádně dobře opevněné a dávají najevo prestiž svých majitelů. V případě nájezdu lze v jejich areálu ukrýt a ochránit celá stáda dobytka."
 building_watchtowers_08: "Kupolové věže"
 building_watchtowers_08_desc: "Tyto impozantní věže jsou celé vystavěny z kamene a završeny kupolí. Použité stavební postupy je činí pro nájezdníky téměř nedobytnými."
 building_type_quarries_01: "Lomy"
 building_type_quarries_01_desc: "Hory této provincie poskytují místním stavbám znamenitý zdroj stavebního materiálu."
 building_quarries_01: "Prosté kamenolomy"
 building_quarries_01_desc: "Snadno dostupný lomový kámen poskytuje stavební materiál pro okolní stavby."
 building_quarries_02: "Mělké rudné doly"
 building_quarries_02_desc: "Úpatí hory lemují prosté doly, v nichž se získává ruda ze snadno dostupných povrchových ložisek."
 building_quarries_03: "Vodní mlýny"
 building_quarries_03_desc: "Svedením vody k dolům lze pomocí vodních mlýnů pohánět nástroje usnadňující těžbu."
 building_quarries_04: "Velké kamenolomy"
 building_quarries_04_desc: "S rostoucí poptávkou po stavebním materiálu přitahují lomy stále více dělníků. Každým rokem se rozšiřují a zahlubují."
 building_quarries_05: "Velké doly"
 building_quarries_05_desc: "Poptávka po kovech neustále roste a samotné nové postupy nestačí. Těžbu je nutné rozšířit, a tak se otevírají další doly!"
 building_quarries_06: "Obrovské kamenolomy"
 building_quarries_06_desc: "V několika ohromných povrchových lomech dělníci téměř průmyslovým způsobem vysekávají kamenné bloky. Vytěžené lomy zejí po celé provincii jako otevřená ústa a jejich obsah nyní tvoří četné hrady a hradby."
 building_quarries_07: "Hlubinné doly"
 building_quarries_07_desc: "Nové postupy umožňují dělníkům dosáhnout na hlubší ložiska kovů ukrytá pod povrchem. Nejdůležitější je nový způsob odvodňování zatopených šachet."
 building_quarries_08: "Mechanizované odčerpávání vody"
 building_quarries_08_desc: "Dřevěná čerpadla poháněná větrným mlýnem nebo koňmi na povrchu dokážou odstraňovat vodu z důlních šachet mnohem rychleji než několik kožených věder."
 building_type_military_camps_01: "Tábory domobrany"
 building_type_military_camps_01_desc: "Prosté cvičiště, kde se lehce obrněná pěchota připravuje na válku."
 building_military_camps_01: "Kožené stany"
 building_military_camps_01_desc: "Po povolání se odvedenci shromáždí v provizorních táborech, kde přespávají v prostých stanech. Nejsou sice příliš pohodlné, ale takový tábor je levný a snadno přemístitelný."
 building_military_camps_02: "Táboroví kuchaři"
 building_military_camps_02_desc: "Vyčleněním části odvedenců ke shánění a přípravě potravy pro ostatní přilákáme z venkova více mužů, které přivábí vůně jídla."
 building_military_camps_03: "Výcviková pole"
 building_military_camps_03_desc: "Lukostřelecké terče a cvičné figuríny poskytují odvedencům rozptýlení i základní výcvik, než budou vrženi do žáru bitvy."
 building_military_camps_04: "Strážní stanoviště"
 building_military_camps_04_desc: "Strážní stanoviště slouží jako signální body, pozorovatelny i přirozená shromaždiště. Stráže zde slouží neustále, i když se zrovna nekonají odvody."
 building_military_camps_05: "Táboroví kováři"
 building_military_camps_05_desc: "Táboroví kováři provádějí prosté opravy a podkovávají koně."
 building_military_camps_06: "Odvodní síně"
 building_military_camps_06_desc: "Samostatné odvodní síně v každé vesnici výrazně usnadňují povolávání odvedenců do služby."
 building_military_camps_07: "Kasárna domobrany"
 building_military_camps_07_desc: "Každé město nyní disponuje vlastními kasárnami domobrany, kde jsou pro případ potřeby uloženy zbraně. Kasárna také slouží jako shromaždiště důstojníků odpovědných za odvody."
 building_military_camps_08: "Odvodní náměstí"
 building_military_camps_08_desc: "Větší odvodní náměstí poskytují vojákům nejen místo ke shromáždění, ale také prostor k výcviku před nadcházejícími bitvami."
 building_type_ramparts_01: "Lesní pevnosti"
 building_type_ramparts_01_desc: "Tato opevnění jsou vystavěna tak, aby tvořila součást lesa, který chrání. Postupující armády brzdí nejen samotné opevnění, ale také hustý podrost."
 building_ramparts_01: "Srubové pevnosti"
 building_ramparts_01_desc: "Drobné dřevěné pevnosti splývají s lesem a využívají stromy jako přirozenou palisádu."
 building_ramparts_02: "Zemní valy"
 building_ramparts_02_desc: "Dlouhé zemní náspy tvoří kolem pevnosti obrannou hranici a ztěžují postup nepřítele."
 building_ramparts_03: "Léčky a příkopy"
 building_ramparts_03_desc: "Nepřítel se při přibližování k opevnění může cítit bezpečně, brzy se však ocitne v pasti nebo nabodnutý na některou z četných nástrah ukrytých po celém lese."
 building_ramparts_04: "Valové hradby"
 building_ramparts_04_desc: "Kamenné a palisádové hradby nyní chrání pevnosti před blížícími se nepřáteli a výrazně ztěžují každý postup lesem."
 building_ramparts_05: "Střílny"
 building_ramparts_05_desc: "Vybudováním střílen v hradbách můžeme snadno sledovat blížící se nepřátele a ostřelovat je šípy."
 building_ramparts_06: "Polní opevnění"
 building_ramparts_06_desc: "Rychlým vybudováním zemních opevnění na místech, kudy podle očekávání projde nepřítel, jej můžeme přelstít a obejít, zatímco se bude snažit překonat les."
 building_ramparts_07: "Cimbuřové valové hradby"
 building_ramparts_07_desc: "Doplnění cimbuří na ochozy nám poskytuje zřetelnou výhodu při každém obléhání. Naši vojáci se mohou pohybovat v relativním bezpečí a odpovídat na každý útok."
 building_ramparts_08: "Lesní tvrze"
 building_ramparts_08_desc: "Tyto rozlehlé kamenné tvrze vystupují z lesa jako hory a chrání rozsáhlé území."
 building_type_elephant_pens_01: "Chov slonů"
 building_type_elephant_pens_01_desc: "Sloni jsou zde chováni a cvičeni. Jsou znamenitými tažnými zvířaty, užitečnými při práci i ve válce."
 building_elephant_pens_01: "Ohrady pro slony"
 building_elephant_pens_01_desc: "Tyto pevné stáje dokážou bezpečně zadržet i toho nejvzpurnějšího slona."
 building_elephant_pens_02: "Pasti na slony"
 building_elephant_pens_02_desc: "Noví sloni jsou chytáni pomocí různých pastí, například jam či ok. Někdy poslouží jako návnada dokonce slonice."
 building_elephant_pens_03: "Cvičiště slonů"
 building_elephant_pens_03_desc: "Slony není snadné vycvičit, ale nejzkušenější cvičitelé zde dělají vše pro to, aby koruně zajistili válečná zvířata."
 building_elephant_pens_04: "Jezdecká cvičiště slonů"
 building_elephant_pens_04_desc: "Na jezdeckých cvičištích jsou sloni podrobováni zkouškám při nesení posádky, zbroje i výstroje."
 building_elephant_pens_05: "Kanceláře dozorců"
 building_elephant_pens_05_desc: "Dozorci odpovídají za zdraví a pohodu slonů a vybudování řádných kanceláří jim umožňuje pracovat účinněji."
 building_elephant_pens_06: "Sloní lazarety"
 building_elephant_pens_06_desc: "Specializované lazarety pro slony jsou dostatečně rozlehlé, aby pojaly i největšího samce, a zachraňují životy zvířat, která by jinak byla jistě ztracena."
 building_elephant_pens_07: "Sloní rezervace"
 building_elephant_pens_07_desc: "Vyhrazením rozsáhlých částí džungle jako rezervací pro slony omezujeme ztráty způsobené pytláctvím a udržujeme jejich populaci stabilní."
 building_elephant_pens_08: "Chovatelé slonů"
 building_elephant_pens_08_desc: "Chovatelé slonů zajišťují, aby se nová mláďata rodila a vyrůstala pouze z nejlepších a nejzdravějších chovných kusů."
 building_type_guild_halls_01: "Cechy"
 building_type_guild_halls_01_desc: "Město poskytuje všem významným cechům a měšťanským rodinám dostatek prostoru k organizaci a provozování jejich řemesel."
 building_guild_halls_01: "Cechovní síně"
 building_guild_halls_01_desc: "$building_type_guild_halls_01_desc$"
 building_guild_halls_02: "Cechy řezbářů"
 building_guild_halls_02_desc: "Řezbáři vyrábějí ze dřeva či kostí rámy, ozdoby, nástroje a další předměty. Vyřezávají také heraldické štíty, díky čemuž jsou jejich cechy oblíbené mezi šlechtou."
 building_guild_halls_03: "Cechy tesařů"
 building_guild_halls_03_desc: "Tesaři se věnují stavitelství a jako hlavní materiál používají dřevo. Jejich služby vyhledává šlechta i duchovenstvo, zejména kvůli nádherným ozdobným truhlářským prvkům, které vytvářejí pro kostely a panství."
 building_guild_halls_04: "Cechy lovců"
 building_guild_halls_04_desc: "Lovci obchodují s masem a kožešinami a jejich práce umožňuje řezníkům i koželuhům provozovat řemeslo. Nejlepší kožešiny přirozeně připadnou nejváženějším šlechtickým rodům."
 building_guild_halls_05: "Cechy kameníků"
 building_guild_halls_05_desc: "Kameníci opracovávají kámen pro stavby i sochařská díla. Jejich umění je široce žádané, neboť při výstavbě opevnění je jejich odbornost neocenitelná."
 building_guild_halls_06: "Cechy krejčích"
 building_guild_halls_06_desc: "Krejčí třímají jehlu, nit a látku jako své oblíbené zbraně. Díky svému nedostižnému umění vyrábějí nádherné oděvy pro šlechtu."
 building_guild_halls_07: "Cechy sklářů"
 building_guild_halls_07_desc: "Skláři vytvářejí ze skla pozoruhodné předměty od pohárů až po okenní tabulky. Vlastnictví skleněných výrobků je velmi prestižní, a proto jsou jejich služby nesmírně žádané."
 building_guild_halls_08: "Cechy uměleckých řemeslníků"
 building_guild_halls_08_desc: "Umělečtí řemeslníci využívají množství různých materiálů nejen k tvorbě uměleckých děl, ale také ke zcela novým vynálezům. Jejich důmysl a vytříbené umění přitahují pozornost vysoké šlechty ze všech krajů."
 building_type_monastic_schools_01: "Kláštery"
 building_type_monastic_schools_01_desc: "Tato škola vyučuje mnoho oborů a představuje vzácné středisko vyšší vzdělanosti, avšak zdejší studenti se připravují především na budoucí službu v řadách duchovenstva."
 building_monastic_schools_01: "Kaple"
 building_monastic_schools_01_desc: "Skromné a tiché místo bohoslužeb, kde se mohou věřící modlit a rozjímat."
 building_monastic_schools_02: "Modlitební síně"
 building_monastic_schools_02_desc: "V modlitebních síních se konají kázání a věřící zde mohou v tichosti rozjímat."
 building_monastic_schools_03: "Klášterní školy"
 building_monastic_schools_03_desc: "$building_type_monastic_schools_01_desc$"
 building_monastic_schools_04: "Klášterní zahrady"
 building_monastic_schools_04_desc: "Klášterní zahrady poskytují věřícím tiché místo k rozjímání, kde mohou obdivovat krásu stvoření."
 building_monastic_schools_05: "Klášterní univerzita"
 building_monastic_schools_05_desc: "Univerzita nabízí rozsáhlé vzdělání v řadě posvátných oborů, mezi něž patří teologie, překladatelství a právní nauka."
 building_monastic_schools_06: "Oddělení filozofie"
 building_monastic_schools_06_desc: "Vyučuje se zde starověká filozofie a mniši její myšlenky často uplatňují v každodenním životě."
 building_monastic_schools_07: "Hvězdárna"
 building_monastic_schools_07_desc: "Mniši zde pozorují hvězdy, aby z nich určovali správný čas významných dnů náboženského kalendáře a prohlubovali své poznání stvoření."
 building_monastic_schools_08: "Křížové chodby"
 building_monastic_schools_08_desc: "Křížová chodba vytváří pevnou hranici vůči okolnímu světu a účinně odděluje život uvnitř klášterních zdí od rolníků venku."
 building_type_megalith_01: "Megalit"
 building_type_megalith_01_desc: "Tato stavba je venkovním uspořádáním kamenů, které bývá zpravidla orientováno podle hvězd a souhvězdí. Víry uznávající megalitické stavby poskytují věřícím pravidelná a levná místa bohoslužeb, která přitahují cestovatele i poutníky."
 building_megalith_01: "Malý megalit"
 building_megalith_01_desc: "Toto rozsáhlé venkovní uspořádání kamenů slouží jako stálé místo bohoslužeb pod širým nebem. Skromná stavba z obyčejných kamenů v prostém uspořádání poskytuje prostor menšímu počtu věřících."
 building_megalith_02: "Megalitické mauzoleum"
 building_megalith_02_desc: "Místo bylo rozšířeno o několik kamenných sestav, aby mohlo pojmout více věřících. Vedle samotného megalitu vzniklo také podzemní mauzoleum, kde mohou být pohřbívány významné osobnosti."
 building_megalith_03: "Megalitické oltáře"
 building_megalith_03_desc: "Toto rozsáhlé venkovní uspořádání kamenů slouží jako stálé místo bohoslužeb pod širým nebem. Megalit byl vystavěn z drahých a neobvyklých kamenů z celého okolí a doplněn oltáři určenými k obřadům."
 building_megalith_04: "Velký megalit"
 building_megalith_04_desc: "Vedle četných oltářů a obřadních předmětů byl tento megalit rozšířen o skutečně úchvatné a mohutné monolitické kameny, do nichž jsou důmyslně vytesány posvátné symboly."
 building_megalith_05: "Místní chrámy"
 building_megalith_05_desc: "Mezi megality vznikly malé svatyně a místa bohoslužeb, která poskytují svatým poutníkům klidný prostor k rozjímání."
 building_megalith_06: "Megalitické hrobky"
 building_megalith_06_desc: "V těchto nadzemních hrobkách jsou ukládáni k odpočinku velcí vůdci, válečníci a svatí lidé. Poutníci a věřící zde mohou uctívat zesnulé předky."
 building_megalith_07: "Poutnické mohyly"
 building_megalith_07_desc: "V divočině kolem megalitického areálu byly navršeny malé kamenné mohyly, které poutníky a cestovatele vedou k oltářům, kde mohou vykonat bohoslužbu."
 building_megalith_08: "Legendární megalit"
 building_megalith_08_desc: "Tento megalit se rozrostl natolik, že se stal místní legendou. Věřící tvrdí, že při pobytu na tomto místě pociťují hluboké spojení se svou vírou."
 building_type_great_megalith_01: "Velkolepý megalit"
 building_type_great_megalith_01_desc: "Velkolepý megalit představuje mimořádně ambiciózní podobu megalitické stavby. Projekt počítá s pokrytím okolní krajiny menšími megality soustředěnými kolem jediné obrovské stavby."
 building_great_megalith_01: "Velkolepý megalit"
 building_great_megalith_01_desc: "Velkolepý megalit je rozsáhlý a ohromující kamenný kruh táhnoucí se krajinou, kterou zároveň pokrývá nespočet menších posvátných míst. Je přístupný všem a přivádí věřící i poutníky z celého světa blíže k božstvu."
 building_type_hospices_01: "Útulky"
 building_type_hospices_01_desc: "Útulek poskytuje nemocným a znaveným místo k odpočinku, kde se o ně starají oddaní svatí lidé."
 building_hospices_01: "Poutnické ubytovny"
 building_hospices_01_desc: "Poutníci nejrůznějšího původu mohou během dlouhých cest nalézt přístřeší a odpočinek v poutnických ubytovnách. Dostanou zde také jídlo, pití a někdy dokonce koupel."
 building_hospices_02: "Dům nemocných"
 building_hospices_02_desc: "Byl zde vybudován skromný dům nemocných, který odděluje zkažený vzduch chorých od zdravých a poskytuje nemocným klidné místo k uzdravení."
 building_hospices_03: "Ošetřovny"
 building_hospices_03_desc: "Za války či moru nabízejí ošetřovny postiženým ubožákům druhou šanci, pokud se do nich ovšem dostanou včas."
 building_hospices_04: "Útulky"
 building_hospices_04_desc: "Útulky poskytují dlouhodobou péči těm, kteří by jinak nepřežili. Vítáni jsou chronicky nemocní, tělesně postižení a někdy dokonce i lidé sužovaní démony."
 building_hospices_05: "Špitální zahrady"
 building_hospices_05_desc: "Kolem útulků byla vysázena květinová zahrada. Každý květ vydává silnou a příjemnou vůni, která má potlačovat zápach nemocných."
 building_hospices_06: "Špitál"
 building_hospices_06_desc: "Ústřední budova špitálu poskytuje péči a spojuje všechny útulky na jednom místě. Trvale zde pobývají ošetřovatelé a svatí lidé, kteří rozdávají almužny a pečují o místní obyvatele i nemocné pocestné."
 building_hospices_07: "Kolonie malomocných"
 building_hospices_07_desc: "V divočině poblíž útulku vznikla malá osada, kde si malomocní mohou pěstovat vlastní plodiny a dožít mezi sobě rovnými, aniž by ohrožovali zdravé členy společnosti."
 building_hospices_08: "Velký špitál"
 building_hospices_08_desc: "Špitály poskytují almužny a ošetřovatelskou péči starým a nemohoucím i léčbu nemocným a znaveným. Jsou zde odděleni od zbytku společnosti a pečují o ně oddaní svatí lidé."
 building_type_scriptorium_01: "Skriptorium"
 building_type_scriptorium_01_desc: "Skriptoria poskytují svatým a vzdělaným lidem místo, kde mohou navždy zachytit svou moudrost na pergamenu."
 building_scriptorium_01: "Knihovny"
 building_scriptorium_01_desc: "Klášterní knihovna je plná knih od drobných pojednání až po rozsáhlé teologické svazky. Její zdi ukrývají skutečnou pokladnici vědění."
 building_scriptorium_02: "Opisovací síně"
 building_scriptorium_02_desc: "Oddaní písaři tráví celé dny opisováním posvátných textů v opisovacích síních. Pracují dokonce i v noci, kdy jim při hledání vědění svítí pouze svíce a měsíc."
 building_scriptorium_03: "Překladatelský dům"
 building_scriptorium_03_desc: "Do tohoto skriptoria proudí oddaní překladatelé, kteří převádějí díla psaná starověkými či cizími jazyky do liturgického jazyka chrámu a výrazně tak rozšiřují dostupnost nesčetných spisů."
 building_scriptorium_04: "Dům písařů"
 building_scriptorium_04_desc: "Sídlí zde velké množství písařů, kterým mohou budoucí autoři diktovat svá díla, aniž by je museli vlastní rukou zapisovat na pergamen."
 building_scriptorium_05: "Kontinentální systém"
 building_scriptorium_05_desc: "Díla jsou nyní přísně řazena podle světadílu svého původu, což učencům výrazně usnadňuje hledání moudrosti bez ohledu na to, odkud pochází."
 building_scriptorium_06: "Velké archivy"
 building_scriptorium_06_desc: "Písemná díla z celého světa jsou zde překládána a uchovávána, aby se jejich moudrost zachovala navěky."
 building_scriptorium_07: "Překladatelská škola"
 building_scriptorium_07_desc: "Oddaní studenti se vzdělávají ve starověkých i cizích jazycích, čímž se zvyšuje schopnost skriptoria uchovávat díla plná moudrosti a vědění."
 building_scriptorium_08: "Tajné archivy"
 building_scriptorium_08_desc: "Tento chrám nyní ukrývá rozsáhlou podzemní síť archivů obsahující nejen zdejší díla, ale také četné spisy získané v cizích zemích."
 building_type_burial_site_01: "Pohřebiště"
 building_type_burial_site_01_desc: "Vybudováním rozsáhlého pohřebiště pro naše mrtvé udržíme zkažený vzduch daleko od obyvatelstva a zároveň získáme místo k uctívání a připomínání předků."
 building_burial_site_01: "Velké pohřebiště"
 building_burial_site_01_desc: "Toto rozsáhlé pohřebiště nabízí množství míst pro prosté hroby a několik malých mauzoleí určených významnějším osobnostem."
 building_burial_site_02: "Mauzoleum"
 building_burial_site_02_desc: "Bylo vystavěno velké mauzoleum s množstvím míst pro prosté hroby a několika hrobkami určenými uctívaným světcům a válečníkům."
 building_burial_site_03: "Velkolepé mauzoleum"
 building_burial_site_03_desc: "Mauzoleum bylo rozšířeno v monumentální stavbu tyčící se nad mrtvými. Jeho vnitřek zaplňují hrobky a modlitební síně určené k uctívání zesnulých."
 building_type_hunting_grounds_01: "Lovecké revíry"
 building_type_hunting_grounds_01_desc: "Po celé této zemi stojí několik velkých loveckých sídel, kde se lovci zvěře mohou scházet a plánovat své výpravy."
 building_hunting_grounds_01: "Lovecká sídla"
 building_hunting_grounds_01_desc: "Lovci se v těchto sídlech scházejí, aby plánovali výpravy do divočiny. Zároveň zde uchovávají trofeje a setkávají se po úspěšném lovu."
 building_hunting_grounds_02: "Psince"
 building_hunting_grounds_02_desc: "V psincích jsou chováni rychlí psi, kteří jsou znamenitými společníky při lovu. Na každou výpravu obvykle vyráží celá smečka."
 building_hunting_grounds_03: "Voliéry"
 building_hunting_grounds_03_desc: "Druhým nejdůležitějším společníkem lovce je dravý pták, kterých se ve voliérách chová velké množství."
 building_hunting_grounds_04: "Lovecké věže"
 building_hunting_grounds_04_desc: "Strážní sledují kořist z věží rozmístěných po celém kraji a svá pozorování hlásí lovcům."
 building_hunting_grounds_05: "Lovecké stáje"
 building_hunting_grounds_05_desc: "Úspěšný lovec potřebuje rychlé, odolné a nebojácné jízdní zvíře. Lovecké stáje poskytují zvláštní plemena vhodná pro dlouhé výpravy."
 building_hunting_grounds_06: "Chýše hajných"
 building_hunting_grounds_06_desc: "Hajní procházejí loveckými revíry a pátrají po zvěři. Přestože pracují sami, dokážou bez pomoci skolit menší kořist."
 building_hunting_grounds_07: "Lovecké obory"
 building_hunting_grounds_07_desc: "Rozsáhlé území bylo vyhrazeno jako lovecká obora, v níž nesmějí lovit nepovolané osoby. Oficiální lovci tak mají vždy dostatek zvěře, i když občas pronikne dovnitř nějaký pytlák..."
 building_hunting_grounds_08: "Sídla oborníků"
 building_hunting_grounds_08_desc: "Oborníci odpovídají za stav krajiny i za všechna zvířata, která v ní žijí. Kdykoli se šlechtici rozhodnou vyrazit na lov, oborníci přesně vědí, kam je poslat, aby našli vhodnou kořist."
 building_type_stables_01: "Stáje"
 building_type_stables_01_desc: "Jezdečtí koně, soumaři a další tažná zvířata potřebují vlastní budovu. Stáje také zajišťují čerstvé koně každému, kdo si je může dovolit."
 building_stables_01: "Malé stáje"
 building_stables_01_desc: "Malá budova vhodná pro několik koní představuje přirozené centrum každé državy a zároveň první i poslední zastávku každého jezdce."
 building_stables_02: "Koňský výběh"
 building_stables_02_desc: "Venkovní výběh umožňuje ustájeným koním protáhnout nohy, pást se a užít si čerstvého vzduchu."
 building_stables_03: "Sklady sena"
 building_stables_03_desc: "Soustava prostých skladů sena zajišťuje koním stálý přísun potravy mimo pastevní období."
 building_stables_04: "Kurýrní stanice"
 building_stables_04_desc: "Dostatek rozmístěných koní a přepřahacích vozů umožňuje cestovat ve dne i v noci s důležitými zprávami, rychle se kazícím zbožím a dalšími naléhavými zásilkami."
 building_stables_05: "Ubikace čeledínů"
 building_stables_05_desc: "Prosté ubikace poskytují pracovníkům místo ke spánku mimo koňské ohrady, čímž zpříjemňují život lidem i zvířatům."
 building_stables_06: "Odvodňovací kanály"
 building_stables_06_desc: "Kanály vyhloubené v podlaze stájí udržují koně téměř bez námahy v suchu a pohodlí."
 building_stables_07: "Cechy podkovářů"
 building_stables_07_desc: "Množství práce a dovedností potřebných k řádné péči o kopyta podporuje rozvoj cechů podkovářů, kteří neúnavně vyrábějí, upravují a opravují podkovy."
 building_stables_08: "Hřebčíny"
 building_stables_08_desc: "Zvláštní zařízení určená k hřebelcování a péči o nejcennější ztělesnění koňské dokonalosti podporují chov nových nádherných ořů a dodávají těm stávajícím téměř oslnivý lesk."
 building_type_smiths_01: "Kovárny"
 building_type_smiths_01_desc: "Tavením rudy v pecích a kováním kovu do požadovaných tvarů poskytují kovárny okolním obcím nezbytné nástroje a zbraně."
 building_smiths_01: "Dýmačky"
 building_smiths_01_desc: "Po celé krajině stoupá kouř z dýmaček, prostých pecí se stěnami ze žáruvzdorné hlíny a kamene. Otevřeným vrchem se do nich sype směs dřevěného uhlí a drcené železné rudy, z níž vzniká železná houba."
 building_smiths_02: "Měchy"
 building_smiths_02_desc: "Měchy vyrobené z pevné zvířecí kůže obvykle obsluhuje kovářský učeň, který jimi neustále vhání do ohně silný proud vzduchu."
 building_smiths_03: "Průvlaková deska"
 building_smiths_03_desc: "Toto zařízení pomáhá kovářům vyrábět drát pro kroužkovou zbroj. Kusy rozžhaveného železa se protahují postupně menšími otvory, což je mnohem snazší než je pracně vykovávat na kovadlině."
 building_smiths_04: "Kovářské čtvrti"
 building_smiths_04_desc: "Kováři jsou důrazně pobízeni, aby své řemeslo provozovali mimo hustě obydlené oblasti. Nové postupy zpracování kovů jim umožňují pracovat téměř bez přestání, a tak s každým úderem kladiva a každým nočním burácením ohně roste nespokojenost okolních obyvatel."
 building_smiths_05: "Buchary"
 building_smiths_05_desc: "Vodní kolo či nešťastní učni pohánějí jednoduchou otočnou vačku, která kladivo zdvihá a poté je nechává v pravidelném rytmu vlastní vahou dopadat."
 building_smiths_06: "Zlatnické dílny"
 building_smiths_06_desc: "Přidání místností určených k odlévání a zpracování zlata i stříbra, z nichž každá má vlastní zvláštní pracovní stoly a výhně, značně usnadňuje výrobu šperků a pokovování drahými kovy."
 building_smiths_07: "Vysoké pece"
 building_smiths_07_desc: "Vysoké pece žhnou po celý den a taví železo, olovo i měď. Kov, který produkují, dosahuje mimořádné kvality."
 building_smiths_08: "Litina"
 building_smiths_08_desc: "Litina je sice o něco méně pevná, její výroba je však mnohem levnější než jiné postupy. Vyrábí se z ní široká škála nástrojů, například radlice, hřebíky či brány."
 building_type_horse_pastures_01: "Stáda koní"
 building_type_horse_pastures_01_desc: "Hrubou zbraň dokáže pozvednout a udeřit jí bližního téměř každý. Téměř každý také dokáže shromáždit dav rolníků s hrubými zbraněmi. Avšak pouze z dokonalého souladu dobře vychovaného koně, obratného válečníka a vhodné zbraně pod vedením nejlepších velitelů může vzniknout bezkonkurenční bojová síla, která se přežene světem."
 building_horse_pastures_01: "Krocení divokých koní"
 building_horse_pastures_01_desc: "Koně schopní samostatně přežít v drsné krajině mají pozoruhodné instinkty. Namísto jejich zlomení proto využijeme jejich nadání ve prospěch našich válečníků."
 building_horse_pastures_02: "Kožené jezdecké biče"
 building_horse_pastures_02_desc: "Namísto zraňování koní hrubými pomůckami, jako jsou ostruhy, používají naši válečníci biče s koženou smyčkou uvázanou kolem zápěstí. Po úderu nechají bič volně viset, a mají tak obě ruce opět volné."
 building_horse_pastures_03: "Sedla jízdních lučištníků"
 building_horse_pastures_03_desc: "Sedla s vysoko posazenými třmeny, hlubokým posedlím a vysokou přední i zadní rozsochou umožňují našim válečníkům pokračovat v jízdě, zatímco se plně soustředí na ostřelování nepřátel."
 building_horse_pastures_04: "Průbojné hroty šípů"
 building_horse_pastures_04_desc: "Skolit zpravidla neobrněného koně je mnohem snazší než zasáhnout a zranit nepřátelského jezdce."
 building_horse_pastures_05: "Kožená zbroj pro koně"
 building_horse_pastures_05_desc: "Lehká zbroj chrání celé zvíře, aniž by omezovala jeho pohyblivost či vytrvalost."
 building_horse_pastures_06: "Kompozitní reflexní luky"
 building_horse_pastures_06_desc: "Kompozitní luky vyráběné ze dřeva, zvířecích rohů a šlach spojených živočišným klihem jsou dokonalými zbraněmi pro naše vynikající jízdní lučištníky."
 building_horse_pastures_07: "Náhradní koně"
 building_horse_pastures_07_desc: "Když se válečný kůň unaví, jezdec sesedne a přesedne na jiného. Použitý kůň pokračuje v cestě vedle jezdce a ostatních náhradních koní, ovšem bez jezdcovy váhy. Tento přístup umožňuje našim armádám překonávat ohromné vzdálenosti a neustále provádět průzkum před hlavním vojskem."
 building_horse_pastures_08: "Pravidla jízdního válčení"
 building_horse_pastures_08_desc: "„Dohlédni, aby tví muži nechávali podocasníky na svých koních volné a udidla mimo jejich tlamy, vyjma chvílí, kdy jim dovolíš lovit. Tak se nebudou moci svévolně rozcválat. Jakmile tato pravidla zavedeš, každého, kdo je poruší, zadrž a zbij. Každému, kdo tento výnos odmítne uposlechnout, setni hlavu přímo na místě.“"
 building_type_warrior_lodges_01: "Válečnické síně"
 building_type_warrior_lodges_01_desc: "Osobní pouta ukovaná na bojištích si zaslouží pamětní síně, kde mohou staří válečníci vyprávět zasněným mladíkům své úžasné, ale stále uvěřitelné příběhy."
 building_warrior_lodges_01: "Síně trofejí"
 building_warrior_lodges_01_desc: "Život na bojišti i lidská paměť jsou pomíjivé, avšak zeď, na kterou může každý člen síně zavěsit své drahocenné trofeje, přetrvá mnohem déle."
 building_warrior_lodges_02: "Ubikace panošů"
 building_warrior_lodges_02_desc: "Skromný sklad výstroje a zavedený přísný výcvikový řád jsou vším, co mladíci příliš mladí na vzpomínky na minulé bitvy potřebují, aby se učili od mužů příliš starých na účast v těch budoucích."
 building_warrior_lodges_03: "Hodovní síně"
 building_warrior_lodges_03_desc: "Přidání hodovních síní, vždy překypujících jídlem a smíchem, odpovídá rostoucímu počtu bitev oslavovaných v této válečnické síni."
 building_warrior_lodges_04: "Cvičiště boje ve formaci"
 building_warrior_lodges_04_desc: "Na vyhrazených cvičištích napodobujících krajinu skutečných bojišť se skupiny válečníků učí bojovat a manévrovat jako soudržný celek. Zde vycvičené oddíly představují hrozivou sílu, protože se naučily důvěřovat svým velitelům i mužům stojícím po jejich boku."
 building_warrior_lodges_05: "Hroby válečníků"
 building_warrior_lodges_05_desc: "Na posvěcené půdě vyhrazené k pohřbívání mohou uctívaní členové této válečnické síně spočinout navěky, aniž by zůstali v cizí a chladné zemi bojiště... Zároveň budou inspirovat další generace válečníků."
 building_warrior_lodges_06: "Pamětní síně"
 building_warrior_lodges_06_desc: "V těchto síních dobře placení trubadúři a básníci opěvují činy nejstatečnějších válečníků. Když se shromáždí dostatečný dav nebo si to přeje dostatečně bohatý mecenáš, konají se celá představení znázorňující slavné vítězné bitvy minulosti."
 building_warrior_lodges_07: "Knihovna válečníků"
 building_warrior_lodges_07_desc: "Po celé generace se zde mladí učedníci vzdělávali pouze od dosud žijících a přítomných válečníků. Nyní může za drobný poplatek téměř kdokoli čerpat z nahromaděné zásoby vědomostí, které si jen občas vzájemně odporují."
 building_warrior_lodges_08: "Ubytovny pro návštěvníky"
 building_warrior_lodges_08_desc: "Tyto síně se staly uctívaným cílem světských poutí, který znají a o němž sní začínající i ostřílení válečníci ze širokého okolí."
 building_type_hillside_grazing_01: "Pastviny na svazích"
 building_type_hillside_grazing_01_desc: "Tyto kopce jsou nevhodné pro zemědělství a z velké části je pokrývá tráva a další rostlinstvo, jímž se mohou živit koně, proto slouží především k pastvě."
 building_hillside_grazing_01: "Kopcovité pastviny"
 building_hillside_grazing_01_desc: "Rozsáhlá otevřená prostranství jsou ideálními pastvinami pro koně všech velikostí a druhů. Každý majitel koně má právo je využívat, což podporuje zemědělství i místní jezdectvo."
 building_hillside_grazing_02: "Koňští pastevci"
 building_hillside_grazing_02_desc: "Chov koní získává pro místní hospodářství stále větší význam, a tak tyto pastviny nyní živí početnou skupinu lidí starajících se o stáda."
 building_hillside_grazing_03: "Rozšířené pastviny"
 building_hillside_grazing_03_desc: "Přestože je tato oblast k pastvě přirozeně vhodná, lze její využitelnou rozlohu dále zvětšovat. Kácejí se stromy, odstraňují kameny a získávání půdy na úkor divočiny nikdy zcela nekončí."
 building_hillside_grazing_04: "Koňské statky"
 building_hillside_grazing_04_desc: "Veškerou využitelnou zemědělskou půdu v oblasti postupně vykupují chovatelé koní, kterým zelenina a drobné plodiny pomáhají uživit rostoucí počet pracovníků."
 building_hillside_grazing_05: "Malé koňské ranče"
 building_hillside_grazing_05_desc: "Postupem času se nedílnou součástí místního hospodářství stalo několik specializovaných rančů, kde jsou koně chováni, krmeni a cvičeni."
 building_hillside_grazing_06: "Koňské trhy"
 building_hillside_grazing_06_desc: "Obchod s koňmi je přirozenou součástí jejich chovu. S rozvojem tohoto odvětví začínají v jednotlivých obdobích vznikat více či méně stálá tržní městečka zaměřená na prodej koní."
 building_hillside_grazing_07: "Stájní mistři"
 building_hillside_grazing_07_desc: "Chov a krmení kvalitních válečných koní vyžaduje člověka, který se stará o jejich neduhy a zranění a zároveň soustavně posuzuje jejich kvalitu. S rostoucím významem chovu koní v oblasti roste také význam stájních mistrů pečujících o zdejší zvířata."
 building_hillside_grazing_08: "Velké koňské ranče"
 building_hillside_grazing_08_desc: "Veškeré pastviny byly postupně sceleny pod několik velkých rančů odpovědných za chov a výcvik početných stád silných válečných koní."
 building_type_windmills_01: "Větrné mlýny"
 building_type_windmills_01_desc: "Větrné mlýny stojí na místech, kde bývá vítr nejsilnější, například na kopcích či při pobřeží. Na rozdíl od vodních mlýnů je nezastaví zamrzlé řeky, a mohou tak mlít po celý rok."
 building_windmills_01: "Prosté větrné mlýny"
 building_windmills_01_desc: "Prosté svislé plachty přidané na vrchol mlýna poháněného zvířaty nejen zvyšují jeho výkon, ale také šetří síly tažného zvířete."
 building_windmills_02: "Panemony"
 building_windmills_02_desc: "Panemony jsou větrné mlýny se svisle umístěným kolem, jehož jedna polovina je před větrem zakryta. Plachty pohybující se proti směru otáčení tak nekladou větru odpor."
 building_windmills_03: "Otočné větrné plachty"
 building_windmills_03_desc: "Důmyslná konstrukce umožňuje zpětným plachtám rychle se natáčet proti větru."
 building_windmills_04: "Větrná vodní kola"
 building_windmills_04_desc: "Využitím větru k pohonu vodního kola, které vytváří proud v kanálu či prostém dřevěném potrubí, lze žernovy umístit na dostupnější místa."
 building_windmills_05: "Vodorovné větrné mlýny"
 building_windmills_05_desc: "Když každá plachta tlačí správným směrem, lze přenést více síly na několik žernovů. Práci však často přerušují změny směru větru, kvůli nimž je nutné celý mlýn ručně přestavovat."
 building_windmills_06: "Sloupové větrné mlýny"
 building_windmills_06_desc: "Celý mlýn spočívá na pevném sloupu, takže jej lze snadno natáčet po směru větru. Změny síly větru vyžadují ruční úpravy, například svinování plachet a zatěžování křídel, aby se otáčení udrželo rovnoměrné."
 building_windmills_07: "Ozubené převody"
 building_windmills_07_desc: "Pomalé otáčení mohutných větrných křídel urychluje prostá soustava dřevěných ozubených kol, díky níž se mlýn otáčí rychleji. Stává se tak mnohem vhodnějším pro většinu materiálů přivážených ke zpracování."
 building_windmills_08: "Věžové větrné mlýny"
 building_windmills_08_desc: "Tělo mlýna je znamenitou kamenickou prací a pouze jeho vrchol zůstává dřevěný, aby bylo možné natáčet plachty proti větru. Tuto věž nepovalí žádná bouře ani pomýlený rytíř, a mletí tak nic nepřeruší."
 building_type_watermills_01: "Vodní mlýny"
 building_type_watermills_01_desc: "Vodní mlýny převádějí nejrůznější pohyb vody od přílivu až po vodopády v otáčivou sílu využívanou k mletí, řezání, drcení a valchování. Povolení k provozu vodního mlýna představují pro majitele državy snadný a spolehlivý zdroj dodatečných daní."
 building_watermills_01: "Kola na spodní vodu"
 building_watermills_01_desc: "Prosté kolo umístěné do rychle proudící řeky dokáže vykonat mnohem více práce než mlýn poháněný člověkem či koněm, a především se nikdy neunaví ani nežádá odměnu."
 building_watermills_02: "Kliky a ojnice"
 building_watermills_02_desc: "Díky prostému dřevěnému převodu již rychlost otáčení mlýnských kamenů není přímo závislá na rozmarech počasí."
 building_watermills_03: "Kola na horní vodu"
 building_watermills_03_desc: "Využití rozdílu vodních hladin, ať už přírodního, nebo vytvořeného lidským důmyslem, představuje mnohem účinnější a spolehlivější způsob získávání točivé síly."
 building_watermills_04: "Řemeslné mlýny"
 building_watermills_04_desc: "To, co začalo jako prostý sladový mlýn zpracovávající především zemědělské produkty, nyní přitahuje i další řemesla. Cechovní nosiči čekají, až mlýny semelou jejich hořčici, zvalchují látky nebo rozdrtí rudu."
 building_watermills_05: "Spravované cesty"
 building_watermills_05_desc: "Najaté stráže, přístřešky, cestovní propustky a dokonce i hostince rozmístěné podél cest vedoucích k mlýnům zajišťují pořádek a pohodlí čekajících. Ve dne v noci se zde řadí vozy tažené koňmi či lidmi a naložené zbožím určeným ke zpracování, například dřevem, konopím nebo zvířecími kůžemi."
 building_watermills_06: "Lodní mlýny"
 building_watermills_06_desc: "Čluny trvale zakotvené uprostřed řek využívají nejsilnější proudy. Na klikatých tocích je lze bez větší námahy přemístit k vnějším stranám říčních zákrutů."
 building_watermills_07: "Hráze a přehrady"
 building_watermills_07_desc: "Soustava vodních hrází, přehrad a umělých kanálů pro kola na spodní i horní vodu uspokojuje rostoucí potřeby mlynářství. Jelikož jsou téměř všechna přirozeně vhodná místa již obsazena, krajinou se vinou nově vyhloubené vodní cesty."
 building_watermills_08: "Prachové mlýny"
 building_watermills_08_desc: "Samostatný mlýn umístěný daleko od ostatních provozů je zcela vyhrazen účinnému a #EMP poněkud#! bezpečnému drcení dřevěného uhlí a síry."
 building_type_caravanserai_01: "Karavanseráj"
 building_type_caravanserai_01_desc: "Útočiště v nehostinné krajině, které vítá znavené cestovatele a zároveň se snaží držet pochybné živly venku."
 building_caravanserai_01: "Malý karavanseráj"
 building_caravanserai_01_desc: "Prostá obdélníková budova poskytující cestovatelům a obchodníkům základní pohodlí, aby si během dlouhých cest mohli odpočinout a nabrat síly."
 building_caravanserai_02: "Kupecké stánky"
 building_caravanserai_02_desc: "Malé kupecké stánky prodávají základní zásoby na cestu. Díky zaručenému místu k doplnění zásob mohou karavany převážet více obchodního zboží."
 building_caravanserai_03: "Ubikace stráží"
 building_caravanserai_03_desc: "Stálé ubikace stráží a soustava strážních věží obsazených bdělými hlídkami poskytují účinnou ochranu před nebezpečím číhajícím v hlubinách noci."
 building_caravanserai_04: "Kupecké síně"
 building_caravanserai_04_desc: "V těchto síních obchodníci ze všech koutů světa směňují zboží a vyprávějí si příběhy ze zemí, kterými procestovali."
 building_caravanserai_05: "Celní úřad"
 building_caravanserai_05_desc: "Pod spalujícím sluncem přísní úředníci váží, zapisují a náležitě zdaňují veškeré zboží procházející karavanserájem. Ve stínu pak přívětivé osoby nabízejí způsoby, jak zboží přepravit za ještě... #EMP přiměřenější#! poplatek."
 building_caravanserai_06: "Řemeslnické dílny"
 building_caravanserai_06_desc: "Díky hojnosti surovin a zámožných zákazníků mohou řemeslníci vyrábět a prodávat nádherné artefakty."
 building_caravanserai_07: "Lázně"
 building_caravanserai_07_desc: "Prostorné lázně uspokojí i ty nejpřepychovější nároky. Cestovatelům s lehčími měšci nabízejí alespoň prosté, ale vítané osvěžení."
 building_caravanserai_08: "Královské komnaty"
 building_caravanserai_08_desc: "Dostatečně honosné komnaty poskytují náležité ubytování často přijíždějícím významným a vysoce váženým osobnostem z tohoto panství i ciziny."
 building_type_workshops_01: "Dílny"
 building_type_workshops_01_desc: "Šípaři, lukostrojaři a tesaři v těchto dílnách stavějí obléhací stroje a zajišťují vojsku zásoby pro dlouhá tažení."
 building_workshops_01: "Střelnice"
 building_workshops_01_desc: "Rozlehlé prostranství bylo zbaveno překážek, aby zde lučištníci a stavitelé obléhacích strojů mohli zkoušet své výrobky a cvičit své dovednosti."
 building_workshops_02: "Provaznické dráhy"
 building_workshops_02_desc: "Ve dne v noci dělníci v dlouhém úzkém příkopu částečně chráněném před počasím stáčejí a splétají provazy i tětivy z rostlinných či živočišných vláken."
 building_workshops_03: "Sklady tětiv"
 building_workshops_03_desc: "Samostatné skladiště uchovává pohotovou zásobu tětiv pro luky, kuše a torzní obléhací stroje."
 building_workshops_04: "Cech podkopníků"
 building_workshops_04_desc: "Ražení podkopů během obléhání vypadá klamně prostě, ve skutečnosti však vyžaduje značné odhodlání a zkušenosti. Ti, kdo přežili své první obléhání, mohou předávat znalosti a praktické dovednosti dychtivým dobrovolníkům."
 building_workshops_05: "Cech šípařů"
 building_workshops_05_desc: "Kvůli rostoucí poptávce po zbraních i střelivu se šípaři oddělili od cechu lukostrojařů. Jejich vlastní cech nyní neúnavně dodává šípy potřebné k zásobování vojska v poli."
 building_workshops_06: "Síně matematiků"
 building_workshops_06_desc: "Opakované úpravy parametrů torzních strojů metodou pokusu a omylu, jejichž cílem bylo zvýšit přesnost a dostřel, přiměly některé obléhací inženýry zapisovat úspěšné postupy. Jejich záznamy nyní zaplňují celé síně plné ruchu a vášnivých rozprav."
 building_workshops_07: "Normalizované rozměry zbraní"
 building_workshops_07_desc: "Díky knihám plným požadovaných délek nejrůznějších dřevěných trámů můžeme konečně zajistit, aby střela vážící 90 kilogramů doletěla přesně 300 metrů. Za ideálního počasí. Většinou."
 building_workshops_08: "Prachárny"
 building_workshops_08_desc: "Samostatná pevná budova s přísně omezeným vstupem slouží ke skladování děsivého množství střelného prachu, který lze využít v silných náložích při podkopávání hradeb nebo jako hnací náplň pro bombardy."
 building_type_wind_furnace_01: "Větrné pece"
 building_type_wind_furnace_01_desc: "Větrné pece stojí v kopcovité krajině při mořském pobřeží, kde monzunové větry poprvé narážejí na pevninu, a taví světoznámou ocel bezchybné kvality."
 building_wind_furnace_01: "Malé větrné pece"
 building_wind_furnace_01_desc: "Pece jsou orientovány přímo k západu, aby zachytily a využily co největší část přicházejícího větru."
 building_wind_furnace_02: "Opakovaně použitelné dmyšny"
 building_wind_furnace_02_desc: "Dmyšny, kovové přívody vzduchu do pece, jsou pečlivě zasazeny doprostřed, aby udržovaly stálé proudění a tlumily nárazy větru. Při další tavbě se znovu použijí ve spodní části přední stěny, kudy může z pece vytékat struska."
 building_wind_furnace_03: "Hliněné čelní stěny"
 building_wind_furnace_03_desc: "Hliněné čelní stěny pecí jsou důmyslně navrženy tak, aby během tavby odolávaly žáru i vznikající strusce, ale po jejím skončení je bylo možné snadno rozbít."
 building_wind_furnace_04: "Postupy předehřívání"
 building_wind_furnace_04_desc: "Po dlouhém předehřívání, které umožní dřevěnému uhlí řádně se rozhořet, se postupně přidává směs rudy a uhlí a celý proces završuje další dávka dřevěného uhlí."
 building_wind_furnace_05: "Zakřivené zadní stěny"
 building_wind_furnace_05_desc: "Zakřivení stálé zadní stěny podepřené dvěma vztyčenými kameny omezuje její kontakt s horkou a žíravou struskou, takže pec vydrží pracovat déle bez úplné přestavby."
 building_wind_furnace_06: "Prodloužené čelní stěny"
 building_wind_furnace_06_desc: "Prodloužené čelní stěny umožňují při každé tavbě vyrobit více oceli, aniž by se měnily ostatní rozměry, a zachovávají tak vynikající vlastnosti pecí i výsledné oceli."
 building_wind_furnace_07: "Uhlíři"
 building_wind_furnace_07_desc: "Dále od pobřeží než samotné pece stojí řada milířů, v nichž uhlíři bez ustání žíhají dřevo pro potřeby rozrůstajícího se odvětví."
 building_wind_furnace_08: "Zpracování železné rudy"
 building_wind_furnace_08_desc: "Důkladnějším drcením rudy a jejím pražením před vložením do pecí lze dosáhnout větších výnosů a ještě vyšší kvality."
 building_type_theodosian_walls_01: "Theodosiovy hradby"
 building_type_theodosian_walls_01_desc: "Theodosiovy hradby byly vystavěny za vlády císaře Theodosia II. na počátku 5. století, dodnes však patří k nejmohutnějším opevněním vytvořeným lidskýma rukama."
 building_theodosian_walls_01: "Theodosiovy hradby"
 building_theodosian_walls_01_desc: "$building_type_theodosian_walls_01_desc$"
 building_type_aurelian_walls_01: "Aurelianovy hradby"
 building_type_aurelian_walls_01_desc: "Aurelianovy hradby byly vystavěny za vlády římských císařů Aureliana a Proba. Dodnes poskytují mohutnou obranu a zcela obklopují sedm římských pahorků."
 building_aurelian_walls_01: "Aurelianovy hradby"
 building_aurelian_walls_01_desc: "$building_type_aurelian_walls_01_desc$"
 building_type_the_colosseum_01: "Koloseum"
 building_type_the_colosseum_01_desc: "Koloseum je jedním z největších amfiteátrů, jaké kdy byly vystavěny, a konalo se v něm bezpočet podívaných včetně gladiátorských zápasů, lovů zvířat, a dokonce i napodobenin námořních bitev. Jeho výstavbu zahájil římský císař Vespasianus roku 72 n. l. a dokončil ji roku 80 jeho nástupce Titus.\n\nNavzdory své pestré historii dnes slouží především jako zdroj mramoru a bronzu pro jiné stavby."
 building_the_colosseum_01: "$building_type_the_colosseum_01$"
 building_the_colosseum_01_desc: "$building_type_the_colosseum_01_desc$"
 building_type_hadrians_wall_01: "Hadriánův val"
 building_type_hadrians_wall_01_desc: "Hadriánův val byl vystavěn za římských časů, aby zadržoval severní Pikty mimo provincii Britannia. Dnes již nemá obranný význam, jeho kameny však představují levný a snadno dostupný stavební materiál!"
 building_hadrians_wall_01: "$building_type_hadrians_wall_01$"
 building_hadrians_wall_01_desc: "$building_type_hadrians_wall_01_desc$"
 building_type_offas_dyke_01: "Offův val"
 building_type_offas_dyke_01_desc: "Offův val, dlouhý příkop lemovaný zemním náspem, nechal vybudovat anglosaský král Mercie k obraně hranice s Walesem. Vyvýšený val poskytuje výhodu tomu, kdo stojí na jeho straně, protože útočníci musí z příkopu bojovat do svahu."
 building_offas_dyke_01: "$building_type_offas_dyke_01$"
 building_offas_dyke_01_desc: "$building_type_offas_dyke_01_desc$"
 building_type_buddhas_of_bamian_01: "Buddhové z $c_bamian$"
 building_type_buddhas_of_bamian_01_desc: "Mohutní Buddhové vytesaní do horského svahu se tyčí nad každým návštěvníkem. Jejich okolí již sice není vzkvétajícím střediskem buddhistické vzdělanosti jako kdysi, sochy však stále navštěvuje množství buddhistických poutníků a učenců. Prozíravý vládce vyznávající $rf_eastern$ by mohl z poutníků kromě osobního poučení vytěžit i nemalý zisk."
 building_buddhas_of_bamian_01: "$building_type_buddhas_of_bamian_01$"
 building_buddhas_of_bamian_01_desc: "$building_type_buddhas_of_bamian_01_desc$"
 NOT_BUDDHAS_OF_BAMIAN_ENABLED: "[Concept('holder','Držitel')|E] musí náležet k [Concept('religious_family','náboženské rodině')|E] $rf_eastern$"
 building_type_petra_01: "Petra"
 building_type_petra_01_desc: "Město Petra je skutečným divem starověkého světa. Bylo vytesáno přímo do přirozeně se vyskytující narůžovělé skály a představuje pozoruhodnost, která zaujme i nejmocnějšího sultána."
 building_petra_01: "$building_type_petra_01$"
 building_petra_01_desc: "$building_type_petra_01_desc$"
 building_type_house_of_wisdom_01: "Dům moudrosti"
 building_type_house_of_wisdom_01_desc: "Dům moudrosti ukrývá rozsáhlou sbírku knih a zdejší písaři ve dne v noci neúnavně překládají další velká literární díla. Texty pocházejí z řeckých, perských, indických a mnoha dalších zdrojů. Toto místo skutečně obsahuje vědění celého světa! Zářivý maják lidského poznání! A navíc v příjemné vzdálenosti od negramotných jezdců ze stepi..."
 building_house_of_wisdom_01: "$building_type_house_of_wisdom_01$"
 building_house_of_wisdom_01_desc: "$building_type_house_of_wisdom_01_desc$"
 building_type_palace_of_aachen_01: "$building_palace_of_aachen_01$"
 building_type_palace_of_aachen_01_desc: "Palác v Cáchách si Karel Veliký zvolil za mocenské centrum Karlovské říše. Plnil politickou i náboženskou úlohu a dodnes je znamenitým místem pro pořádání významných shromáždění."
 building_palace_of_aachen_01: "Palác v Cáchách"
 building_palace_of_aachen_01_desc: "$building_type_palace_of_aachen_01_desc$"
 building_type_notre_dame_01: "$building_notre_dame_01$"
 building_type_notre_dame_01_desc: "Tato nádherná katedrála, známá také jako „Chrám Matky Boží v Paříži“, je zasvěcena Panně Marii. Byla vystavěna v gotickém slohu a uchvacuje množstvím soch i obrovskými barevnými rozetovými okny.\n\nVnější stěny katedrály pokrývají plastiky živě vyprávějící biblické příběhy, takže mohou Boží slávu pochopit i negramotní rolníci!"
 building_notre_dame_01: "Notre-Dame"
 building_notre_dame_01_desc: "$building_type_notre_dame_01_desc$"
 building_type_hagia_sophia_01: "Hagia Sofia"
 building_type_hagia_sophia_01_desc: "Hagia Sofia je skutečným divem stavitelství, jehož nejpůsobivějším prvkem je mohutná kupole. Stavbu dokončil roku 537 císař Justinián I. a nyní v ní sídlí ekumenický patriarcha. Zároveň představuje velkolepý pomník křesťanství.\n\nA tak tomu zůstane navěky, neboť moc Říma jistě nemůže nic svrhnout."
 building_hagia_sophia_01: "Katedrála Hagia Sofia"
 building_hagia_sophia_01_desc: "$building_type_hagia_sophia_01_desc$"
 building_hagia_sophia_02: "Mešita Hagia Sofia"
 building_hagia_sophia_02_desc: "Hagia Sofia je skutečným divem stavitelství, jehož nejpůsobivějšími prvky jsou mohutná kupole a čtyři impozantní minarety. Stavbu zahájil roku 537 císař Justinián I. a od té doby byla proměněna v úchvatnou mešitu.\n\nA tak tomu zůstane navěky, neboť moc Rúmu jistě nemůže nic svrhnout."
 building_type_dome_of_the_rock_01: "Chrám v Jeruzalémě"
 building_type_dome_of_the_rock_01_desc: "Skalní dóm se nachází uprostřed Chrámové hory na místě, kde stával Šalomounův chrám a později Druhý chrám. Základní kámen chrámu je údajně místem, kde Bůh stvořil svět a prvního člověka Adama. Skalní dóm a nedaleký chrám Božího hrobu přitahují abrahámovské poutníky z celého světa."
 building_dome_of_the_rock_01: "Skalní dóm"
 building_dome_of_the_rock_01_desc: "$building_type_dome_of_the_rock_01_desc$"
 building_temple_in_jerusalem_01: "Třetí chrám"
 building_temple_in_jerusalem_01_desc: "Stovky let po zničení Druhého chrámu konečně nadešel čas obnovit chrám v Jeruzalémě! Tento Třetí chrám přetrvá věky a bude bedlivě střežen před každým, kdo by jej chtěl zničit."
 building_type_stonehenge_01: "Stonehenge"
 building_type_stonehenge_01_desc: "Stonehenge je prastará tajemná stavba, která inspirovala nejednoho učence. Dokonce i dnes, v této osvícené době, ji přijíždějí zkoumat vzdělanci z celé Británie. Jaký je však její skutečný účel?"
 building_stonehenge_01: "$building_type_stonehenge_01$"
 building_stonehenge_01_desc: "$building_type_stonehenge_01_desc$"
 building_type_iron_pillar_of_dhar_01: "Železný sloup v Dháru"
 building_type_iron_pillar_of_dhar_01_desc: "Železný sloup v Dháru byl zhotoven z roztavených zbraní celé armády. Jeho řemeslné provedení je skutečně ohromující a přináší slávu dynastii, která jej drží."
 building_iron_pillar_of_dhar_01: "$building_type_iron_pillar_of_dhar_01$"
 building_iron_pillar_of_dhar_01_desc: "$building_type_iron_pillar_of_dhar_01_desc$"
 building_type_iron_pillar_of_delhi_01: "Železný sloup v Dillí"
 building_type_iron_pillar_of_delhi_01_desc: "Mohutný železný sloup v Dillí je symbolem slávy krále Čandragupty II., ačkoli do něj pozdější vládci také vyryli svá jména. Přestože stojí již velmi dlouho, nenese jedinou stopu rzi, což svědčí o mimořádném umění indických kovářů!"
 building_iron_pillar_of_delhi_01: "$building_type_iron_pillar_of_delhi_01$"
 building_iron_pillar_of_delhi_01_desc: "$building_type_iron_pillar_of_delhi_01_desc$"
 building_type_the_pyramids_01: "Pyramidy"
 building_type_the_pyramids_01_desc: "Pyramidy, z nichž nejvýznamnější je Cheopsova, patří mezi divy starověkého světa. Jsou rozlehlé a působivé a dodávají vážnost každému vládci, který je ovládá."
 building_the_pyramids_01: "$building_type_the_pyramids_01$"
 building_the_pyramids_01_desc: "$building_type_the_pyramids_01_desc$"
 building_type_alhambra_01: "Alhambra"
 building_type_alhambra_01_desc: "Alhambra je pevnost vystavěná na pozůstatcích starověkého římského opevnění. Jako obranná stavba sice slouží obstojně, ale s patřičnými investicemi by se mohla proměnit v něco mnohem velkolepějšího..."
 building_alhambra_01: "Ruiny pevnosti $building_type_alhambra_01$"
 building_alhambra_01_desc: "$building_type_alhambra_01_desc$"
 building_alhambra_02: "Královský palác $building_type_alhambra_01$"
 building_alhambra_02_desc: "Od dob, kdy byla pouhou římskou zříceninou, se Alhambra proměnila v královský palác hodný císaře! Je zářným příkladem místní architektury a kontrast barev jejích budov s okolními lesy přiměl básníky označit ji za „perlu zasazenou do smaragdů“."
 building_type_shwedagon_pagoda_01: "Šweitigoumská pagoda"
 building_type_shwedagon_pagoda_01_desc: "Šweitigoumská pagoda je posvátná buddhistická stúpa, kterou kolem roku 500 vystavěl monský lid. Ukrývá mnoho proslulých relikvií, například hůl Kakusandhy, vodní filtr Kónágamany, část roucha Kassapy a osm vlasů z hlavy Gautamy."
 building_shwedagon_pagoda_01: "Šweitigoumská pagoda"
 building_shwedagon_pagoda_01_desc: "$building_type_shwedagon_pagoda_01_desc$"
 building_type_khajuraho_01: "Chrámové město"
 building_type_khajuraho_01_desc: "Chrámy v Khadžuráhu jsou zasvěceny soužití hinduistů a džinistů a oslavují rozmanitost jejich náboženských názorů. Chrámové zdi pokrývají složitá umělecká díla a sochy, díky nimž je toto místo skutečně nádherné a přitažlivé pro poutníky i učence."
 building_khajuraho_01: "Khadžuráho"
 building_khajuraho_01_desc: "$building_type_khajuraho_01_desc$"
 building_type_the_tower_of_london_01: "Tower"
 building_type_the_tower_of_london_01_desc: "Tower je hrad sloužící zároveň jako životně důležité opevnění a vězení. Ústřední věž se nazývá „Bílá věž“ a sídlí v ní vládnoucí vrstva. Díky své poloze má Tower zásadní význam pro obranu celého hrabství."
 building_the_tower_of_london_01: "Tower"
 building_the_tower_of_london_01_desc: "$building_type_the_tower_of_london_01_desc$"
 building_type_london_bridge_01: "Londýnský most"
 building_type_london_bridge_01_desc: "Mosty přes Temži zde stojí od nepaměti, ale tento mohutný kamenný most je velkolepější než všechny předchozí. Divoké proudy pod ním vedly k rozšířenému rčení, že moudří přecházejí po mostě a hlupáci pod ním."
 building_london_bridge_01: "Londýnský most"
 building_london_bridge_01_desc: "Rozšířený $building_type_london_bridge_01_desc$"
 building_type_citadel_of_aleppo_01: "$building_citadel_of_aleppo_01$"
 building_type_citadel_of_aleppo_01_desc: "Aleppská citadela je starobylé opevnění, které od svého vzniku využívala řada mocností. Slouží jako královské sídlo, opevněné útočiště, chrám i vězení."
 building_citadel_of_aleppo_01: "Aleppská citadela"
 building_citadel_of_aleppo_01_desc: "$building_type_citadel_of_aleppo_01_desc$"
 building_citadel_of_aleppo_02: "Přestavěná Aleppská citadela"
 building_citadel_of_aleppo_02_desc: "Po rozsáhlé přestavbě byla Aleppská citadela výrazně opevněna a proměněna ve skutečné palácové město!"
 building_type_holy_site_cathedral_01: "Velkolepá katedrála"
 building_type_holy_site_cathedral_01_desc: "Zdejší [Concept('holy_site','svaté místo')|E] přitahuje křesťanské poutníky z celého známého světa. Velkolepá katedrála není pouze divem stavitelství a krásy, ale také bezpečným útočištěm pro cestovatele a prestižním pomníkem svého mecenáše."
 building_holy_site_cathedral_01: "Velkolepá katedrála"
 building_holy_site_cathedral_01_desc: "$building_type_holy_site_cathedral_01_desc$"
 building_type_holy_site_mosque_01: "Velkolepá mešita"
 building_type_holy_site_mosque_01_desc: "Zdejší [Concept('holy_site','svaté místo')|E] je oblíbeným cílem zbožných poutníků. Velkolepá mešita jim poskytuje místo k modlitbě, odpočinku a uctívání před pokračováním v cestě. Její nádherné kupole a vysoké zdobené minarety dávají všem na odiv velikost Boha."
 building_holy_site_mosque_01: "Velkolepá mešita"
 building_holy_site_mosque_01_desc: "$building_type_holy_site_mosque_01_desc$"
 building_type_holy_site_pagan_grand_temple_01: "Velkolepý chrám"
 building_type_holy_site_pagan_grand_temple_01_desc: "Zdejší [Concept('holy_site','svaté místo')|E] přitahuje zástupy věřících. Velkolepý chrám pokrývají zdobné rytiny zachycující hrdinské skutky bohů i polobohů. Mohutné ohně vysílají sloupy kouře vzhůru k samotným bohům, zatímco svatí muži žehnají všem, kdo uctívají duchy."
 building_holy_site_pagan_grand_temple_01: "Velkolepý chrám"
 building_holy_site_pagan_grand_temple_01_desc: "$building_type_holy_site_pagan_grand_temple_01_desc$"
 building_type_holy_site_indian_grand_temple_01: "Velkolepý chrám"
 building_type_holy_site_indian_grand_temple_01_desc: "Zdejší [Concept('holy_site','svaté místo')|E] přitahuje množství pokorných poutníků toužících očistit své duše. Velkolepý chrám je od základů až po věž pokryt sochami a modlami bohů, které vyprávějí starobylé legendy a životní příběhy vznešených proroků."
 building_holy_site_indian_grand_temple_01: "Velkolepý chrám"
 building_holy_site_indian_grand_temple_01_desc: "$building_type_holy_site_indian_grand_temple_01_desc$"
 building_type_holy_site_buddhist_grand_temple_01: "Velkolepý chrám"
 building_type_holy_site_buddhist_grand_temple_01_desc: "Zdejší [Concept('holy_site','svaté místo')|E] přitahuje množství pokorných poutníků toužících očistit své duše. Uprostřed komplexu stojí velkolepá stúpa, která ukrývá několik relikvií samotného Buddhy."
 building_holy_site_buddhist_grand_temple_01: "Velkolepý chrám"
 building_holy_site_buddhist_grand_temple_01_desc: "$building_type_holy_site_buddhist_grand_temple_01_desc$"
 building_type_holy_site_other_grand_temple_01: "Velkolepý chrám"
 building_type_holy_site_other_grand_temple_01_desc: "Zdejší [Concept('holy_site','svaté místo')|E] je místem setkávání zbožných a oddaných věřících. Velkolepý chrám představuje vznešenou poctu vyšším mocnostem a jeho vyhlazené zdi a kupole září nádhernými barvami oslavujícími božství."
 building_holy_site_other_grand_temple_01: "Velkolepý chrám"
 building_holy_site_other_grand_temple_01_desc: "$building_type_holy_site_other_grand_temple_01_desc$"
 building_holy_site_chinese_temple_01: "$building_type_holy_site_buddhist_grand_temple_01$"
 building_holy_site_chinese_temple_01_desc: "Zdejší [Concept('holy_site','svaté místo')|E] je středobodem života věřících. Palácové chrámové budovy a pagody v symbolických barvách jsou harmonicky rozmístěny kolem souměrného nádvoří. Vyvážené uspořádání celého komplexu vyzařuje pokojnou úctu."
 building_holy_site_japanese_temple_01: "Velkolepá svatyně"
 building_holy_site_japanese_temple_01_desc: "Zdejší [Concept('holy_site','svaté místo')|E] je místem setkávání zbožných a oddaných věřících. Působivá střecha tvoří téměř polovinu hlavní chrámové budovy a je viditelná zdaleka. Jediná rozlehlá vnitřní síň dokáže pojmout libovolné množství zbožných návštěvníků."
 building_holy_site_se_asia_pagan_temple_01: "$building_holy_site_other_grand_temple_01$"
 building_holy_site_se_asia_pagan_temple_01_desc: "$building_type_holy_site_other_grand_temple_01_desc$"
 building_type_holy_site_chinese_temple_01: "$building_holy_site_chinese_temple_01$"
 building_type_holy_site_chinese_temple_01_desc: "$building_holy_site_chinese_temple_01_desc$"
 building_type_holy_site_japanese_temple_01: "$building_holy_site_japanese_temple_01$"
 building_type_holy_site_japanese_temple_01_desc: "$building_holy_site_japanese_temple_01_desc$"
 building_type_holy_site_se_asia_pagan_temple_01: "$building_holy_site_other_grand_temple_01$"
 building_type_holy_site_se_asia_pagan_temple_01_desc: "$building_type_holy_site_other_grand_temple_01_desc$"
 HOLY_SITE_BUILDING_ENABLED: "[Concept('faith','Víra')|E] držitele považuje toto místo za [Concept('holy_site','svaté místo')|E]"
 NOT_HOLY_SITE_BUILDING_ENABLED: "[Concept('faith','Víra')|E] držitele musí toto místo považovat za [Concept('holy_site','svaté místo')|E]"
 NOT_holy_site_muslim_or_holy_site_trigger: "Držitel musí vyznávat islám nebo toto místo považovat za [Concept('holy_site','svaté místo')|E]"
 NOT_holy_site_christian_or_holy_site_trigger: "Držitel musí vyznávat křesťanství nebo toto místo považovat za [Concept('holy_site','svaté místo')|E]"
 NOT_holy_site_muslim_christian_or_holy_site_trigger: "Držitel musí vyznávat islám či křesťanství nebo toto místo považovat za [Concept('holy_site','svaté místo')|E]"
 NOT_holy_site_muslim_or_zoroastrian_or_holy_site_trigger: "Držitel musí vyznávat islám či zoroastrismus nebo toto místo považovat za [Concept('holy_site','svaté místo')|E]"
 NOT_holy_site_jewish_or_holy_site_trigger: "Držitel musí vyznávat judaismus nebo toto místo považovat za [Concept('holy_site','svaté místo')|E]"
 NOT_holy_site_shinto_or_holy_site_trigger: "Držitel musí vyznávat $shintoism_religion$ nebo toto místo považovat za [Concept('holy_site','svaté místo')|E]"
 building_type_holy_site_imam_ali_mosque_01: "Mešita imáma Alího"
 building_type_holy_site_imam_ali_mosque_01_desc: "Mešita imáma Alího ukrývá hrobku Alího, Mohamedova bratrance a prvního šíitského imáma po něm. Každý rok sem přicházejí tisíce poutníků vzdát mu úctu a vítá je nádherná zelená kupole mešity."
 building_holy_site_imam_ali_mosque_01: "$building_type_holy_site_imam_ali_mosque_01$"
 building_holy_site_imam_ali_mosque_01_desc: "$building_type_holy_site_imam_ali_mosque_01_desc$"
 building_type_holy_site_great_mosque_of_mecca_01: "Velká mešita v Mekce"
 building_type_holy_site_great_mosque_of_mecca_01_desc: "Velká mešita v Mekce je mohutná starobylá stavba, jejíž zdi obklopují posvátnou Kaabu. Od jejího vzniku mešitu i její okolí rozšířilo mnoho významných sultánů. Každý muslim by měl toto místo navštívit během hadždže."
 building_holy_site_great_mosque_of_mecca_01: "$building_type_holy_site_great_mosque_of_mecca_01$"
 building_holy_site_great_mosque_of_mecca_01_desc: "$building_type_holy_site_great_mosque_of_mecca_01_desc$"
 building_type_holy_site_cologne_cathedral_01: "Kolínská katedrála"
 building_type_holy_site_cologne_cathedral_01_desc: "Kolínská katedrála ukrývá ostatky Tří králů, které přitahují poutníky z celého křesťanského světa. Katedrála je vystavěna v gotickém slohu a bohatě zdobena věžemi a důmyslnými detaily."
 building_holy_site_cologne_cathedral_01: "$building_type_holy_site_cologne_cathedral_01$"
 building_holy_site_cologne_cathedral_01_desc: "$building_type_holy_site_cologne_cathedral_01_desc$"
 building_type_holy_site_canterbury_cathedral_01: "$building_type_holy_site_canterbury_cathedral_03$"
 building_type_holy_site_canterbury_cathedral_01_desc: "Římský misionář a pozdější arcibiskup Augustin vystavěl Canterburskou katedrálu poté, co si město zvolil za sídlo svého biskupství v Kentu. Nová katedrála obnovila význam města a zajistila mu autoritu nad anglickou církví."
 building_type_holy_site_canterbury_cathedral_01: "Canterburská bazilika"
 building_holy_site_canterbury_cathedral_01 "Canterbury Basilica" # TODO: MISSING KEY
 building_holy_site_canterbury_cathedral_01_desc: "$building_type_holy_site_canterbury_cathedral_01_desc$"
 building_type_holy_site_canterbury_cathedral_02: "$building_type_holy_site_canterbury_cathedral_03$"
 building_type_holy_site_canterbury_cathedral_02_desc: "Ani katedrála není uchráněna před působením času a nepříznivými událostmi. K opravě škod způsobených požárem byl zvolen normanský sloh. Původní baziliku nahradila nová loď ve tvaru kříže a později přibyla také samostatně stojící zvonice."
 building_holy_site_canterbury_cathedral_02: "Canterburský chrám"
 building_holy_site_canterbury_cathedral_02_desc: "$building_type_holy_site_canterbury_cathedral_02_desc$"
 building_type_holy_site_canterbury_cathedral_03: "Canterburská katedrála"
 building_type_holy_site_canterbury_cathedral_03_desc: "Vážné poškození katedrály si vyžádalo další přestavbu. Přestože byly v některých částech zachovány normanské prvky, k povznesení stavby byl zvolen vzkvétající gotický sloh."
 building_holy_site_canterbury_cathedral_03: "$building_type_holy_site_canterbury_cathedral_02$"
 building_holy_site_canterbury_cathedral_03_desc: "$building_type_holy_site_canterbury_cathedral_02_desc$"
 building_type_doges_palace_01: "Dóžecí palác"
 building_type_doges_palace_01_desc: "Dóžecí palác slouží jako sídlo vlády Benátské republiky. Tato působivá stavba ukrývá několik síní vyhrazených například radě, senátu, správě a soudnictví."
 building_doges_palace_01: "$building_type_doges_palace_01$"
 building_doges_palace_01_desc: "$building_type_doges_palace_01_desc$"
 building_type_visby_ringmur_01: "Hradby Visby"
 building_type_visby_ringmur_01_desc: "Městské hradby Visby chrání město před vnějšími hrozbami, jako jsou nájezdníci či Dánové. Zároveň účinně zadržují výběrčí daní vyslané gotlandským sněmem! Útočníci se musí k bohatství uvnitř nejprve probít přes množství věží obsazených lučištníky."
 building_visby_ringmur_01: "$building_type_visby_ringmur_01$"
 building_visby_ringmur_01_desc: "$building_type_visby_ringmur_01_desc$"
 building_type_walls_of_benin_01: "Beninské hradby"
 building_type_walls_of_benin_01_desc: "Beninské hradby tvoří mohutná soustava zemních opevnění #low (v jazyce Edo nazývaných Iya)#!, která obklopuje celý Benin. Opevnění sestává z příkopů a náspů, přičemž na vnitřní straně leží příkop a na vnější val."
 building_walls_of_benin_01: "$building_type_walls_of_benin_01$"
 building_walls_of_benin_01_desc: "$building_type_walls_of_benin_01_desc$"
 building_type_the_friday_mosque_01: "Páteční mešita"
 building_type_the_friday_mosque_01_desc: "Páteční mešita neboli Velká mešita v Isfahánu byla vystavěna za umajjovské dynastie. Říká se, že jeden z jejích sloupů osobně zhotovil chalífa. Než se stala mešitou, údajně sloužila jako místo bohoslužeb zoroastriánů."
 building_the_friday_mosque_01: "$building_type_the_friday_mosque_01$"
 building_the_friday_mosque_01_desc: "$building_type_the_friday_mosque_01_desc$"
 building_type_brihadeeswarar_temple_01: "Chrám Brihadíšvara"
 building_type_brihadeeswarar_temple_01_desc: "Chrám Brihadíšvara je zasvěcen hinduistickému božstvu Šivovi a patří mezi největší jihoindické chrámy vystavěné ve zdobném drávidském slohu. Jeho název je sanskrtskou složeninou, kterou lze přibližně přeložit jako „Chrám velkého pána Šivy“."
 building_brihadeeswarar_temple_01: "$building_type_brihadeeswarar_temple_01$"
 building_brihadeeswarar_temple_01_desc: "$building_type_brihadeeswarar_temple_01_desc$"
 building_type_holy_site_mahabodhi_temple_01: "Chrám Mahábódhi"
 building_type_holy_site_mahabodhi_temple_01_desc: "Chrám Mahábódhi označuje místo, kde Buddha údajně dosáhl osvícení. Jde o významný poutní cíl buddhistů i hinduistů. Stavbu chrámu zahájil kolem roku 200 císař Ašóka a od té doby byl chrám několikrát rozšířen a obnoven."
 building_holy_site_mahabodhi_temple_01: "$building_type_holy_site_mahabodhi_temple_01$"
 building_holy_site_mahabodhi_temple_01_desc: "$building_type_holy_site_mahabodhi_temple_01_desc$"
 building_type_holy_site_great_mosque_of_cordoba_01: "Velká mešita v Córdobě"
 building_type_holy_site_great_mosque_of_cordoba_01_desc: "Velká mešita v Córdobě byla po islámském dobytí Vizigótského království vystavěna na základech křesťanského kostela. Původně se o toto místo dělili muslimové s křesťany, ale křesťanská část byla nakonec vykoupena a zbořena, aby uvolnila místo Velké mešitě."
 building_holy_site_great_mosque_of_cordoba_01: "$building_type_holy_site_great_mosque_of_cordoba_01$"
 building_holy_site_great_mosque_of_cordoba_01_desc: "$building_type_holy_site_great_mosque_of_cordoba_01_desc$"
 building_type_walls_of_genoa_01: "Janovské hradby"
 building_type_walls_of_genoa_01_desc: "Janovské hradby byly vystavěny v 9. století poté, co město získalo značnou autonomii. Společně s ochranou pobřeží umožňují celému kraji rozvíjet se a vzkvétat."
 building_walls_of_genoa_01: "$building_type_walls_of_genoa_01$"
 building_walls_of_genoa_01_desc: "$building_type_walls_of_genoa_01_desc$"
 building_type_holy_site_great_mosque_of_djenne_01: "Velká mešita v Djenné"
 building_type_holy_site_great_mosque_of_djenne_01_desc: "Velká mešita v Djenné stojí na břehu řeky Bani. Je vystavěna výhradně z nepálených cihel a vyžaduje mnoho péče, kterou jí věřící ochotně poskytují. Každý rok se zde shromažďují velké davy, aby mešitu opravily a zvelebily."
 building_holy_site_great_mosque_of_djenne_01: "$building_type_holy_site_great_mosque_of_djenne_01$"
 building_holy_site_great_mosque_of_djenne_01_desc: "$building_type_holy_site_great_mosque_of_djenne_01_desc$"
 building_type_holy_site_great_mosque_of_samarra_01: "Velká mešita v Samaře"
 building_type_holy_site_great_mosque_of_samarra_01_desc: "Velkou mešitu v Samaře dokončil roku 851 abbásovský chalífa al-Mutawakkil, který ze Samarry vládl. Jejím nejvýraznějším prvkem je věž Malvíja, nádherný spirálovitý minaret tyčící se do úctyhodné výšky."
 building_holy_site_great_mosque_of_samarra_01: "$building_type_holy_site_great_mosque_of_samarra_01$"
 building_holy_site_great_mosque_of_samarra_01_desc: "$building_type_holy_site_great_mosque_of_samarra_01_desc$"
 building_type_holy_site_prophetic_mosque_01: "Prorokova mešita"
 building_type_holy_site_prophetic_mosque_01_desc: "Prorokova mešita neboli al-Masdžid an-Nabaví je mešita s otevřeným nádvořím, kterou založil samotný prorok Mohamed. Patřila mezi první mešity, které vystavěl, a nacházela se nedaleko jeho sídla."
 building_holy_site_prophetic_mosque_01: "$building_type_holy_site_prophetic_mosque_01$"
 building_holy_site_prophetic_mosque_01_desc: "$building_type_holy_site_prophetic_mosque_01_desc$"
 building_type_generic_university: "Univerzita"
 building_type_generic_university_desc: "Univerzita je místem vyššího vzdělávání vyhrazeným zámožným lidem s dobrou pověstí, kteří jsou uznáni za dostatečně hodné přijetí. Přitahuje učence a badatele, kteří v jejích zdech diskutují, studují, sepisují díla a shromažďují své poznatky."
