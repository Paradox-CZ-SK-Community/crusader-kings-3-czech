 building_type_capital_bureau_01: "Hlavní magistrát"
 building_type_capital_bureau_01_desc: "Samostatná větev vlády věnuje veškeré prostředky správě hlavního města. Za těmito zdmi sídlí zástup písařů a úředníků připravených plnit příkazy eparchy."
 building_capital_bureau_01: "Soudní budova"
 building_capital_bureau_01_desc: "Zákon umožňuje městu rozvíjet se a vzkvétat a prosazovat jej lze jedině u soudu."
 building_capital_bureau_02: "Bezpečnostní úřad"
 building_capital_bureau_02_desc: "Tento úřad zaměstnává početné strážní sbory, které chrání město před zločinci a zatýkají narušitele zákona."
 building_capital_bureau_03: "Velitelství hasičů"
 building_capital_bureau_03_desc: "Požáry představují neustálou hrozbu pro každou hustě obydlenou oblast. Dobře vycvičený hasičský sbor uhasí oheň dříve, než se rozšíří."
 building_capital_bureau_04: "Správa cechů"
 building_capital_bureau_04_desc: "Jmenování úředníků, kteří budou dohlížet na četné městské cechy, zajistí jejich účinné fungování, dodržování kvality a všech nezbytných postupů."
 building_capital_bureau_05: "Soudní oddělení"
 building_capital_bureau_05_desc: "Rozsáhlé oddělení pro soudní záležitosti je v rostoucím velkoměstě nezbytností. Celá armáda úředníků, písařů a soudců neúnavně prosazuje právo a pořádek."
 building_capital_bureau_06: "Městské vězení"
 building_capital_bureau_06_desc: "Po městě je sice roztroušeno několik malých věznic, větší žalář však zajistí, že na každého narušitele zákona bude čekat cela."
 building_capital_bureau_07: "Obchodní kolegium"
 building_capital_bureau_07_desc: "Obchod je příliš výnosný, než aby jej zákon důkladněji neupravoval. Dohledem nad mýtem a zbožím vstupujícím do města můžeme mnohem účinněji spravovat zásobování hlavního města a snad získat i trochu zlata navíc."
 building_capital_bureau_08: "Městský palác"
 building_capital_bureau_08_desc: "Rozlehlé a majestátní sídlo, které svou nádherou zahanbí většinu paláců, zajišťuje, že hlavní správce může být vždy nablízku a k dispozici. Město totiž nikdy doopravdy nespí, jeho správce však ano."
 capital_bureau_custom_effect_desc: "#low Zpřístupňuje:#!\nZvyšuje [Concept('aptitude','způsobilost')|E] pro [GetCourtPositionType('eparch_court_position').GetName()] jako [Concept('court_position','dvorský úřad')|E]"
 building_type_oath_warriors_building_01: "Válečnická léna"
 building_type_oath_warriors_building_01_desc: "Panovník těchto zemí složil korunovační přísahu, že zabezpečí válečníky."
 oath_warriors_building_01: "Veteránská hospodářství" # todo: NEW TRANSLATION
 oath_warriors_building_01_desc: "Dlouho sloužícím aristokratickým bojovníkům byla přidělena štědrá místní hospodářství, a tak zde vzrostl zájem o věrnou službu." # todo: NEW TRANSLATION
 oath_warriors_building_02: "Válečnická panství" # todo: NEW TRANSLATION
 oath_warriors_building_02_desc: "Příslušníci aristokratické válečnické vrstvy, kteří nepadnou na bojišti, žijí v pohodlí. Přidělená držba jim umožňuje najímat a vyzbrojovat dostatek mužů." # todo: NEW TRANSLATION
 oath_warriors_building_03: "Vesnická léna" # todo: NEW TRANSLATION
 oath_warriors_building_03_desc: "Mnohé místní vesnice jsou přidělovány rytířským důstojníkům do osobní držby, což jim umožňuje hromadit sílu a bohatství na úkor ostatních vrstev." # todo: NEW TRANSLATION
 oath_warriors_building_04: "Rozlehlá válečnická držba" # todo: NEW TRANSLATION
 oath_warriors_building_04_desc: "Značná část místních daní připadá nižší válečnické aristokracii, držitelům titulů k polím i osadám. Jejich mocné družiny však stále slouží." # todo: NEW TRANSLATION
 building_type_oath_faithful_building_01: "Náboženské památky"
 building_type_oath_faithful_building_01_desc: "Panovník těchto zemí složil korunovační přísahu, že zabezpečí věřící."
 oath_faithful_building_01: "Svatyně u cest" # todo: NEW TRANSLATION
 oath_faithful_building_01_desc: "V malých přístřešcích u cest jsou umístěny prosté posvátné ikony." # todo: NEW TRANSLATION
 oath_faithful_building_02: "Posvátné brány" # todo: NEW TRANSLATION
 oath_faithful_building_02_desc: "Nad vchody do osady i na dalších místech v ní se nacházejí propracovaná náboženská díla, která vzbuzují úctu a slibují bezpečný průchod." # todo: NEW TRANSLATION
 oath_faithful_building_03: "Chrámové svatyně" # todo: NEW TRANSLATION
 oath_faithful_building_03_desc: "Místní chrámové komplexy byly rozšířeny o zahrady s klenutými stropy, klidná místa se studnami se sladkou vodou." # todo: NEW TRANSLATION
 oath_faithful_building_04: "Monumentální náměstí" # todo: NEW TRANSLATION
 oath_faithful_building_04_desc: "Do rozlehlých centrálních náměstí, plných náboženských děl, se investovalo mnoho prostředků. Udržují se čistá od přebytečného odpadu a lichvy a poskytují místním vodu." # todo: NEW TRANSLATION
 building_type_oath_poor_building_01: "Veřejné chudobince"
 building_type_oath_poor_building_01_desc: "Panovník těchto zemí složil korunovační přísahu, že zabezpečí chudé."
 oath_poor_building_01: "Charitativní zvyklosti" # todo: NEW TRANSLATION
 oath_poor_building_01_desc: "Úřady nabádají majetné, aby přebytečné jídlo a bohatství věnovali potřebným, obvykle během svátků." # todo: NEW TRANSLATION
 oath_poor_building_02: "Chudobince" # todo: NEW TRANSLATION
 oath_poor_building_02_desc: "Velmi chudí, vdovy a staří lidé dostávají skromné ubytování a základní péči." # todo: NEW TRANSLATION
 oath_poor_building_03: "Dobročinné ústavy" # todo: NEW TRANSLATION
 oath_poor_building_03_desc: "O chudobince a další veřejná zařízení sloužící potřebným se dobře starají úřední správci s dostatkem prostředků." # todo: NEW TRANSLATION
 oath_poor_building_04: "Charitativní instituce" # todo: NEW TRANSLATION
 oath_poor_building_04_desc: "V celé zemi nikdo z potřebných nestrádá. Velkorysé ubytovny poskytují zázemí lidem bez domova, nemocnice pečují o nemocné a staré a chudým rolníkům se dostává štědré podpory." # todo: NEW TRANSLATION
