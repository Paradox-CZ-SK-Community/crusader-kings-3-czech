 building_type_fengtian_mines_01: "Nefritové doly Feng-tchien"
 building_type_fengtian_mines_01_desc: "Nefritové doly Feng-tchien leží uprostřed hornatého vnitrozemí ostrova a podporují námořní obchod s drahými kameny. Tento zářivě zelený nefrit je oblíbený u úřadů, místních obyvatel i obchodníků ze vzdálených zemí a představuje významný zdroj příjmů hrabství."
