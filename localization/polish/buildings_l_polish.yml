 building_taghaza_mines_02: "Důl Tagháza"
 building_taghaza_mines_02_desc: "S růstem osady se těží stále více soli. Příliv schopných inženýrů umožňuje vybudovat skutečný důl."
 building_taghaza_mines_03: "Velký důl Tagháza"
 building_taghaza_mines_03_desc: "S rozšiřováním těžby rostou i samotné doly. Vznikají další vstupy a jsou hloubeny rozsáhlé šachty umožňující získávat více soli."
 building_taghaza_mines_04: "Důlní komplex Tagháza"
 building_taghaza_mines_04_desc: "S rostoucí těžbou soli sem začali proudit obchodníci a řemeslníci z celého světa."
 building_type_ijil_mines_01: "Solné doly Idžil"
 building_type_ijil_mines_01_desc: "Idžil patří mezi nejstarší solné doly v Africe a v mnoha ohledech také mezi první obchodní střediska transsaharské sítě."
