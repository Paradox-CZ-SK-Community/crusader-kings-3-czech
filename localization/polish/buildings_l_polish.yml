 building_type_zigong_mines_01: "Solné studny C'-liou-ťing a Kung-ťing"
 building_type_zigong_mines_01_desc: "Díky jedinečným podmínkám pro těžbu soli se zde sůl získává z hlubin země již od dob dynastie Šang před několika tisíci lety. Dnes i v dohledné budoucnosti zůstává významnou součástí regionálního hospodářství."
