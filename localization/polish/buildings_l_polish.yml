 building_generic_silver_mines_04: "Komplex stříbrných dolů"
 building_generic_silver_mines_04_desc: "$building_rammelsberg_mines_04_desc$"
 building_type_generic_gold_mines_01: "Zlaté doly"
 building_type_generic_gold_mines_01_desc: "Nesmírně cenný a vzácný zlatý důl, po němž touží každý šlechtic v kraji."
 building_generic_gold_mines_01: "Zlatokopecká osada"
 building_generic_gold_mines_01_desc: "$building_rammelsberg_mines_01_desc$"
 building_generic_gold_mines_02: "Zlatý důl"
 building_generic_gold_mines_02_desc: "$building_rammelsberg_mines_02_desc$"
 building_generic_gold_mines_03: "Velký zlatý důl"
 building_generic_gold_mines_03_desc: "$building_rammelsberg_mines_03_desc$"
 building_generic_gold_mines_04: "Komplex zlatých dolů"
 building_generic_gold_mines_04_desc: "$building_rammelsberg_mines_04_desc$"
 building_type_capital_bureau_01: "Magistrát hlavního města"
 building_type_capital_bureau_01_desc: "Samostatná větev vlády věnuje veškeré prostředky správě hlavního města. Za těmito zdmi sídlí zástup písařů a úředníků připravených plnit příkazy eparchy."
 building_capital_bureau_01: "Soudní budova"
 building_capital_bureau_01_desc: "Zákon umožňuje městu rozvíjet se a vzkvétat a prosazovat jej lze jedině u soudu."
 building_capital_bureau_02: "Bezpečnostní úřad"
 building_capital_bureau_02_desc: "Tento úřad zaměstnává početné strážní sbory, které chrání město před zločinci a zatýkají narušitele zákona."
 building_capital_bureau_03: "Velitelství hasičů"
 building_capital_bureau_03_desc: "Požáry představují neustálou hrozbu pro každou hustě obydlenou oblast. Dobře vycvičený hasičský sbor uhasí oheň dříve, než se rozšíří."
 building_capital_bureau_04: "Správa cechů"
 building_capital_bureau_04_desc: "Jmenování úředníků, kteří budou dohlížet na četné městské cechy, zajistí jejich účinné fungování, dodržování kvality a všech nezbytných postupů."
 building_capital_bureau_05: "Soudní oddělení"
 building_capital_bureau_05_desc: "Rozsáhlé oddělení pro soudní záležitosti je v rostoucím velkoměstě nezbytností. Celá armáda úředníků, písařů a soudců neúnavně prosazuje právo a pořádek."
 building_capital_bureau_06: "Městské vězení"
 building_capital_bureau_06_desc: "Po městě je sice roztroušeno několik malých věznic, větší žalář však zajistí, že na každého narušitele zákona bude čekat cela."
 building_capital_bureau_07: "Obchodní kolegium"
 building_capital_bureau_07_desc: "Obchod je příliš výnosný, než aby jej zákon důkladněji neupravoval. Dohledem nad mýtem a zbožím vstupujícím do města můžeme mnohem účinněji spravovat zásobování hlavního města a snad získat i trochu zlata navíc."
 building_capital_bureau_08: "Městský palác"
 building_capital_bureau_08_desc: "Rozlehlé a majestátní sídlo, které svou nádherou zahanbí většinu paláců, zajišťuje, že hlavní správce může být vždy nablízku a k dispozici. Město totiž nikdy doopravdy nespí, jeho správce však ano."
 capital_bureau_custom_effect_desc: "#low Zpřístupňuje:#!\nZvyšuje [Concept('aptitude','způsobilost')|E] pro [GetCourtPositionType('eparch_court_position').GetName()] jako [Concept('court_position','dvorský úřad')|E]"
 building_type_breweries_01: "Pivovary"
 building_type_breweries_01_desc: "Tato budova je určena k vaření, kvašení a skladování různých druhů piva, ale i dalších kvašených nápojů. V místní kultuře a hospodářství zastává zásadní úlohu."
 building_breweries_01: "Varna"
 building_breweries_01_desc: "Srdce každého pivovaru, kde začíná proces vaření. Suroviny se zde mísí, vaří a připravují ke kvašení."
 building_breweries_02: "Skladovací sklep"
 building_breweries_02_desc: "Chladné a temné místo, kde uvařené nápoje zrají, aby získaly požadovanou chuť a vlastnosti."
 building_breweries_03: "Varné kádě"
 building_breweries_03_desc: "Velké nádoby, v nichž se vaří mladina a přidávají byliny či chmel. Tento zásadní krok dodává nápoji hořkost a vůni."
 building_breweries_04: "Obilná stodola"
 building_breweries_04_desc: "Stodola udržující velké množství obilí v suchu a bezpečí před škůdci zajišťuje stálý přísun surovin pro vaření piva."
 building_breweries_05: "Studniční dům"
 building_breweries_05_desc: "Studna zajišťuje čistý a spolehlivý zdroj vody, která je pro výrobu kvalitních nápojů nezbytná."
 building_breweries_06: "Sudový sklep"
 building_breweries_06_desc: "Prostor, v němž se kvašený nápoj pečlivě ukládá do řádně utěsněných sudů připravených k rozvozu."
 building_breweries_07: "Stáčírna"
 building_breweries_07_desc: "Samostatný prostor určený k plnění velkých sudů, které se hodí pro větší množství a jsou oblíbené v hostincích a krčmách."
 building_breweries_08: "Ochutnávková síň"
 building_breweries_08_desc: "Síň, v níž mohou sládci i hosté ochutnávat různé nápoje a vychutnávat si nejnovější várky."
 brewery_effect_desc: "#low Zpřístupňuje:#!\n[Concept('court_position','Dvorský úřad')|E]: [GetCourtPositionType('court_brewmaster_court_position').GetName()]"
 building_type_oath_warriors_building_01: "Válečnická léna"
 building_type_oath_warriors_building_01_desc: "Panovník těchto zemí složil korunovační přísahu, že zabezpečí válečníky."
 building_oath_warriors_building_01: "Malé statky veteránů"
 building_oath_warriors_building_01_desc: "Urození bojovníci s dlouholetou službou obdrželi štědré místní pozemky, což odpovídajícím způsobem zvýšilo zájem o věrnou službu."
 building_oath_warriors_building_02: "Válečnické statky"
 building_oath_warriors_building_02_desc: "Příslušníci urozené válečnické vrstvy, kteří nepadnou na bojišti, žijí v pohodlí a udělené državy jim umožňují získávat dostatek mužů i výzbroje."
 building_oath_warriors_building_03: "Vesnická léna"
 building_oath_warriors_building_03_desc: "Mnohé místní vesnice jsou uděleny rytířským důstojníkům jako osobní državy, díky nimž mohou získávat sílu a bohatství na úkor ostatních vrstev."
 building_oath_warriors_building_04: "Rozsáhlé válečnické državy"
 building_oath_warriors_building_04_desc: "Značná část místních daní připadá nižší válečnické šlechtě, která drží tituly nad poli i osadami. Její mocné družiny však nadále slouží panovníkovi."
 building_type_oath_faithful_building_01: "Náboženské památky"
 building_type_oath_faithful_building_01_desc: "Panovník těchto zemí složil korunovační přísahu, že zabezpečí věřící."
 building_oath_faithful_building_01: "Pocestné svatyně"
 building_oath_faithful_building_01_desc: "Malé přístřešky u cest ukrývají prostá posvátná vyobrazení."
 building_oath_faithful_building_02: "Posvátné brány"
 building_oath_faithful_building_02_desc: "Nad vstupy do osady i po celém jejím území vzbuzují podrobná náboženská díla úžas a slibují bezpečný průchod."
 building_oath_faithful_building_03: "Chrámové svatyně"
 building_oath_faithful_building_03_desc: "Místní chrámové komplexy byly rozšířeny o klenuté zahrady, poklidná místa ukrývající studny s čerstvou vodou."
 building_oath_faithful_building_04: "Monumentální náměstí"
 building_oath_faithful_building_04_desc: "Rozsáhlé prostředky byly vloženy do mohutných ústředních náměstí, která oplývají náboženským uměním, jsou udržována bez odpadků a lichvářů a zásobují místní obyvatele vodou."
 building_type_oath_poor_building_01: "Veřejné chudobince"
 building_type_oath_poor_building_01_desc: "Panovník těchto zemí složil korunovační přísahu, že zabezpečí chudé."
 building_oath_poor_building_01: "Dobročinné zvyklosti"
 building_oath_poor_building_01_desc: "Úřady povzbuzují majetné lidi, aby přebytečné potraviny a bohatství rozdávali méně šťastným, zpravidla během svátků."
 building_oath_poor_building_02: "Chudobince"
 building_oath_poor_building_02_desc: "Nejchudším, vdovám a starým lidem se dostává skromného ubytování a základní péče v prostých příbytcích."
 building_oath_poor_building_03: "Dobročinné úřady"
 building_oath_poor_building_03_desc: "O chudobince a další veřejné služby pro zbídačené se řádně starají úředníci s dostatečnými prostředky."
 building_oath_poor_building_04: "Dobročinné instituce"
 building_oath_poor_building_04_desc: "Potřební po celé zemi již netrpí nedostatkem. Přívětivé ubytovny poskytují střechu nad hlavou lidem, kteří by jinak žebrali, špitály pečují o nemocné a staré a chudým rolníkům se dostává štědrých podpor."
 oath_warriors_building_01_tooltip_high_medieval: "Alespoň #V 3#! z tvých [Concept('knights','rytířů')|E] (nyní: #P [GetPlayer.MakeScope.ScriptValue('oath_warriors_building_01_high_medieval_value')|0]#!):\n Mají alespoň #V 14#! bodů [Concept('prowess','udatnosti')|E] a nejméně jeden [Concept('commander_trait','velitelský rys')|E]"
