 building_type_zijinshan_mines_01_desc: "Přestože jsou tyto hory zpočátku poněkud odlehlé a divoké, ukrývají ohromné bohatství v podobě zlata a mědi. Při správném vedení by se zdejší drobná těžba mohla proměnit ve významný zdroj drahých kovů."
