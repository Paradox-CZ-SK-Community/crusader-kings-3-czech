 building_ratnapura_mines_04_desc: "Těžba drahokamů dosáhla téměř průmyslového rozsahu a počet dělníků se nyní pohybuje v tisících. Z dolů zdánlivě proudí nekonečné bohatství."
 building_type_mogok_mines_01: "Doly v údolí Mogok"
 building_type_mogok_mines_01_desc: "Údolí Mogok je proslulé rubíny a safíry i méně cennými kameny, jako jsou spinely a granáty.\n„Údolí rubínů“ však nad ostatní naleziště nevyniká pouze množstvím, ale především kvalitou kamenů. Když jsou temně rudé drahokamy vyzvednuty ze země, třpytí se v žhnoucím slunci způsobem, který nemá nikde jinde obdoby."
