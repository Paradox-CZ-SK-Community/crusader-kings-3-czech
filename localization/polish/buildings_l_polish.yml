 building_type_hpakant_mines_01: "Nefritové doly Hpakant"
 building_type_hpakant_mines_01_desc: "Hluboko pod zalesněnými kopci se mezi spletitými řekami a vápencovými hřebeny třpytí žíly jasného jadeitu. Po mnoho let zůstávala tato naleziště ukryta před pocestnými i zahraničními obchodníky a místním poskytovala množství balvanů cenného zeleného kamene."
