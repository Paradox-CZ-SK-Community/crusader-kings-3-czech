l_polish:
 BUILDING_DEBUG_KEY: "#D LADICÍ KLÍČ:#! [BUILDING.GetKey]"
 BUILDING_DEBUG_FULL: "#D LADICÍ KLÍČ A POPIS:#!\n[Building.GetKey]\n[Building.GetDescKey]"
 BUILDING_TOOLTIP_TEXT: "[Building.GetDescription]\n\n[Building.GetEffectDescription( GetPlayer )]"
 building_type_castle_01: "Hrad"
 building_type_castle_01_desc: "Opevněné sídlo navržené nejen k ubytování váženého šlechtického rodu, ale také k ochraně okolního města a zemědělské půdy."
 building_castle_01: "Mota"
 building_castle_01_desc: "Toto malé, avšak mohutné opevnění stojí na navršeném zemním pahorku."
 building_castle_02: "Donjon"
 building_castle_02_desc: "Donjon je mohutná věž sloužící jako opevněné sídlo a poslední obranné postavení."
 building_castle_03: "Soustředný hrad"
 building_castle_03_desc: "Soustředný hrad obklopují dvě nebo více hradeb, přičemž vnitřní hradba převyšuje tu vnější."
 building_castle_04: "Pevnost"
 building_castle_04_desc: "Pevnost představuje vrchol obranného stavitelství. Dokáže odrazit nepřátelské útoky a zároveň pojmout početnou posádku."
 building_type_temple_01: "Chrám"
 building_type_temple_01_desc: "Místo bohoslužeb spravované duchovenstvem, které obklopuje osada věřících rolníků."
 building_temple_01: "Svatyně"
 building_temple_01_desc: "$building_type_temple_01_desc$"
 building_temple_02: "Chrámový areál"
 building_temple_02_desc: "Uprostřed vesnice stojí chrám, který místní řemeslníci pečlivě vystavěli jako důkaz své oddanosti víře."
 building_temple_03: "Dům modlitby"
 building_temple_03_desc: "Chrám sice dokáže pojmout mnoho věřících, ale není to jeho jediný účel. Musí také ubytovat duchovenstvo, spravovat rozsáhlou knihovnu a chránit relikvie. Díky domu modlitby mají věřící vždy dostatek prostoru k modlitbám."
 building_temple_04: "Velkolepý chrám"
 building_temple_04_desc: "Místní řemeslníci a stavitelé se nespokojili s malým a skromným chrámem a společně vytvořili skutečné umělecké dílo. Zdá se, jako by tento velkolepý chrám přiváděl moc samotných nebes do každého věřícího, který vstoupí do jeho nádherných síní."
 building_type_city_01: "Město"
 building_type_city_01_desc: "Lidnaté město obývané početnými měšťany, obchodníky a pilnými obyvateli."
 building_city_01: "Střed vesnice"
 building_city_01_desc: "$building_type_city_01_desc$"
 building_city_02: "Velké město"
 building_city_02_desc: "Město přilákalo obchodníky a řemeslníky ze širokého okolí. Bohatí kupci si zde zakládají obchody a pilní řemeslníci téměř denně stavějí nové domy."
 building_city_03: "Městské centrum"
 building_city_03_desc: "Město se již nespokojuje se svým původním územím a pohlcuje okolní zemědělskou půdu, která se stává součástí jeho prosperujícího centra. Je rozlehlé a překypuje bohatstvím i příležitostmi."
 building_city_04: "Rušná metropole"
 building_city_04_desc: "Toto město je široko daleko proslulé množstvím příležitostí, které nabízí. Říká se, že zde může ke štěstí přijít i ten nejubožejší rolník. Kam až oko dohlédne, lemují ulice domy a všude kolem povozy i soumaři převážejí zboží."
 building_type_temple_citadel_01: "Chrámová citadela"
 building_type_temple_citadel_01_desc: "Místo zasvěcené stejnou měrou bohoslužbám i ochraně, jehož posvátný areál obklopují mohutné hradby."
 building_temple_citadel_01: "Chrámový donjon"
 building_temple_citadel_01_desc: "$building_type_temple_citadel_01_desc$"
 building_temple_citadel_02: "Opevněný klášter"
 building_temple_citadel_02_desc: "Citadela nyní nabízí větší kapacitu a lepší uspořádání. Poskytuje útočiště místním věřícím a zároveň dostatečné ubytování pro vojáky, kteří mohou pohotově čelit každému útoku."
 building_temple_citadel_03: "Chrámový komplex"
 building_temple_citadel_03_desc: "Další budovy zajišťují větší pohodlí a účelnější provoz, takže je toto místo bohoslužeb připraveno na většinu eventualit. Obyvatelé mají povinnost nejen modlit se v místních svatyních, ale také držet stráž na hradbách."
 building_temple_citadel_04: "Pevnost svatyně"
 building_temple_citadel_04_desc: "Tuto svatyni důkladně chrání donjony, hradby, příkopy a vojenské hlásky. Zdá se, že nad ní navíc bdí i samotná božská moc, takže se její obyvatelé i početní věřící cítí v bezpečí."
 building_type_common_tradeport_01: "Obchodní přístav"
 building_type_common_tradeport_01_desc: "V tomto přístavu obchodní galéry nakládají a vykládají svůj náklad."
 building_common_tradeport_01: "Malé přístaviště"
 building_common_tradeport_01_desc: "Na pobřeží se nachází skromné přístaviště, kde mohou lodě bez větších obtíží nakládat a vykládat svůj náklad."
 building_common_tradeport_02: "Dílna síťařů"
 building_common_tradeport_02_desc: "Byla zde zřízena dílna na výrobu rybářských sítí. Den co den se v ní sítě neúnavně pletou a opravují."
 building_common_tradeport_03: "Obchodní přístav"
 building_common_tradeport_03_desc: "Přístav se stal místním střediskem obchodu a cestování. Za obchodem sem připlouvají lodě z celého pobřeží."
 building_common_tradeport_04: "Lodní tesaři"
 building_common_tradeport_04_desc: "V tomto přístavu se shromažďují zruční lodní tesaři, aby stavěli a opravovali lodě pro toho, kdo nabídne nejvíce."
 building_common_tradeport_05: "Rozšířená přístaviště"
 building_common_tradeport_05_desc: "Početnější a větší přístaviště dokážou obsloužit stále rostoucí množství obchodních plavidel."
 building_common_tradeport_06: "Loděnice"
 building_common_tradeport_06_desc: "Vznik budov určených přímo k údržbě lodí představuje významný krok v přeměně prostého přístaviště v rušné centrum námořní moci."
 building_common_tradeport_07: "Velký přístav"
 building_common_tradeport_07_desc: "Tento velký přístav nabízí množství přístavišť, loděnic a nejlepší námořníky v širokém okolí. Lze zde nalézt veškeré zboží potřebné k dalekým plavbám a obchodníci, rybáři i vojsko tu mají všechnu potřebnou podporu."
 building_common_tradeport_08: "Suché doky"
 building_common_tradeport_08_desc: "Do suchého doku loď vpluje úzkým průplavem, z něhož je následně odčerpána voda. Poté spočine na kamenných podpěrách, takže ji lze mnohem snáze opravovat a udržovat."
 building_type_hall_of_heroes_01: "Síň hrdinů"
 building_type_hall_of_heroes_01_desc: "Velkolepá síň, kde se mohou hrdinní válečníci setkávat a plánovat svá další dobrodružství."
 building_hall_of_heroes_01: "Síň hrdinů I"
 building_hall_of_heroes_01_desc: "$building_type_hall_of_heroes_01_desc$"
 building_hall_of_heroes_02: "Síň hrdinů II"
 building_hall_of_heroes_02_desc: "$building_type_hall_of_heroes_01_desc$"
