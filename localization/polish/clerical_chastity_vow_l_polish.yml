l_polish:
 request_clerical_chastity_interaction: "Vyžádat slib cudnosti"
 request_clerical_chastity_interaction_desc: "Požaduj, aby [recipient.GetShortUINameNoTooltip] [Select_CString(recipient.IsFemale,'složila','složil')] slib cudnosti, jehož svědkem bude [recipient.GetFaith.HighGodName]. Pokud slib přijme, bude mít dlouhodobě sníženou [Concept('fertility','plodnost')|E] a až do skončení či odvolání slibu nebude moci zahájit svádění ani dvoření."
 request_clerical_chastity_notification_text: "Slož tento slib a podrob své tělo zdrženlivosti. [actor.GetFaith.HighGodName] bude jeho svědkem. Tvá poslušnost bude ctít [actor.GetFaith.Custom('CZ_Adjective_ou')] víru."
 clerical_chastity_offer_piety: "Nabídnout zbožnost"
 clerical_chastity_recipient_must_be_in_reach_tt: "Musíš být [Concept('head_of_faith','hlavou víry')|E] nebo držet [Concept('duchy','vévodství')|E] či [Concept('title','titul')|E] vyšší úrovně, ledaže [recipient.GetShortUINameNoTooltip] osobně drží [Concept('county','hrabství')|E] sousedící s hrabstvím, které osobně držíš"
 clerical_chastity_recipient_must_be_in_reach_tt_puppeteer: "[puppet_or_actor.GetShortUINameNoTooltip] musí být [Concept('head_of_faith','hlavou víry')|E] nebo držet [Concept('duchy','vévodství')|E] či [Concept('title','titul')|E] vyšší úrovně, ledaže [recipient.GetShortUINameNoTooltip] osobně drží [Concept('county','hrabství')|E] a [puppet_or_actor.GetShortUINameNoTooltip] osobně drží sousední hrabství"
 clerical_chastity_vow_blocks_scheme_tt: "Nesmíš mít aktivní [GetModifier('clerical_chastity_vow_modifier').GetNameWithTooltip|L]"
 request_clerical_chastity_actor_toast: "Požadavek přijat"
 request_clerical_chastity_actor_toast_puppeteer: "[recipient.GetShortUIName] [Select_CString(recipient.IsFemale,'souhlasila','souhlasil')] s požadavkem, který [Select_CString(puppet_or_actor.IsFemale,'vznesla','vznesl')] [puppet_or_actor.GetShortUIName]"
 request_clerical_chastity_recipient_toast: "Slib cudnosti složen"
 request_clerical_chastity_decline_actor_toast: "Požadavek odmítnut"
 request_clerical_chastity_decline_actor_toast_puppeteer: "[recipient.GetShortUIName] [Select_CString(recipient.IsFemale,'odmítla','odmítl')] požadavek, který [Select_CString(puppet_or_actor.IsFemale,'vznesla','vznesl')] [puppet_or_actor.GetShortUIName]"
 request_clerical_chastity_interaction_extra_icon: "$hook_extra_icon$"
 clerical_chastity_ai_virtuous_chaste: "[GetTrait('chaste').GetName(recipient.Self)] patří v mé [Concept('faith','víře')|E] mezi ctnosti: $VALUE|=+0$"
 clerical_chastity_ai_rival: "[actor.GetShortUINameNoTooltip|U] je můj sok: $VALUE|=+0$"
 clerical_chastity_ai_clerical_region: "[Concept('realm_capital','Hlavní sídlo panství')|E] v mé [Concept('clerical_region','církevní oblasti')|E]: $VALUE|=+0$"
 clerical_chastity_ai_piety_stipend: "Nabídnutá dodatečná [Concept('piety','zbožnost')|E]: $VALUE|=+0$"
 clerical_chastity_ai_tier_rank: "Je [recipient.Custom('CZ_TitleAsNameNoTooltip_I')|l]: $VALUE|=+0$"
 renounce_clerical_chastity_vow_decision: "Zříci se slibu cudnosti"
 renounce_clerical_chastity_vow_decision_confirm: "Zříci se slibu"
 renounce_clerical_chastity_vow_decision_desc: "K tomuto slibu mě přiměl kněz, který ode mě požadoval cudnost. Mohu se jej zříci, ale porušení posvátného slibu mě bude stát [Concept('piety','zbožnost')|E] a zatíží mé svědomí."
 renounce_clerical_chastity_vow_decision_tooltip: "Předčasně ukončíš slib. Ztratíš [Concept('piety','zbožnost')|E], získáš [Concept('stress','stres')|E] a na 10 let se ti sníží [Concept('clergy_opinion','mínění duchovenstva')|E]."
 renounce_clerical_chastity_vow_toast: "Zřeknutí se slibu"
 renounce_clerical_chastity_vow_toast_desc: "Zřekl ses svého slibu cudnosti."
 clerical_chastity_vow.0001.toast_released: "Slib skončil"
 clerical_chastity_vow.0001.toast_released_desc: "Tvůj slib cudnosti dospěl ke konci."
