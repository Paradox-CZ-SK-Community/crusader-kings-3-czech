l_polish:
 conqueror.0001.t: "Vládnout světu"
 conqueror.0001.desc: "Je to čím dál jasnější. Od posledního sedláka po nejurozenějšího z mých vazalů — všichni šeptají mé jméno, šeptají o mé moci, šeptají o #EMP válce!#! Má věc má podporu, protože můj lid věří, že mi náleží vláda nad celým světem.\n\n[ROOT.Char.GetPrimaryTitle.GetBaseName] mi dává svou sílu — a já ji využiji. Očekává se ode mě, že udeřím za hranice a silou si vezmu, co mi právem náleží. Mým osudem je vládnout a podrobit si všechny kolem. [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] pod mou vládou se musí rozrůst o jejich země.\n\nKdyž za mnou stojí můj lid, nemohu selhat."
 conqueror.0001.desc.temujin: "\n\nJako potomek modrošedého vlka a plavé laně nabídnu ostatním jen zkázu, nebo podrobení."
 conqueror.0001.a: "Ať dobývání začne!"
 conqueror_flavor: "Začne se ti dostávat podpory od vazalů i lidu, ale měj se na pozoru — pokud zůstaneš příliš dlouho v míru, prohraješ příliš mnoho válek, podřídíš se jinému panství nebo upadneš v nemilost, tvá podpora začne slábnout...\n\nPokud zemřeš, očekává se, že tvé děti budou v dobývání pokračovat."
 conqueror.0001.b: "Raději zůstanu tady, kde voní [ROOT.Char.GetCapitalLocation.Custom('get_region_flower_type_plural')]..."
 conqueror.0002.t: "Neúspěšný dobyvatel"
 conqueror.0002.intro: "Je konec. Bývalí přátelé se ke mně obracejí zády, proud podpory vysychá a mí vojáci zklamaně odkládají meče.\n\n"
 conqueror.0002.peace: "„Prý ‚velký‘ dobyvatel, který nic nedobývá? To je k smíchu!“ Hlasy mých poddaných se nesou mými síněmi. „Nechtěli jsme mír, chtěli jsme #EMP slávu!#!“"
 conqueror.0002.prestige: "„[root_scope.GetFirstName]? To jméno nemá cenu ani za mák!“ posmívají se mí poddaní. „Kdo by následoval někoho, kdo se tak zostudil?“"
 conqueror.0002.debt_level: "„[root_scope.GetFirstName] [Select_CString(root_scope.IsFemale, 'zruinovala', 'zruinoval')] vlastní říši!“ posmívají se mí poddaní. „[ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] má úplně prázdnou pokladnu. [ROOT.Char.GetTitleAsNameNoTooltip] přece nemůže dopustit něco takového!“"
 conqueror.0002.lost_wars: "„[ROOT.Char.GetTitleAsNameNoTooltip] je [Select_CString(root_scope.IsFemale, 'slabá', 'slabý')].“ Hlasy mých poddaných se rozléhají kolem. „Prohraná válka střídá prohranou válku. Kdo by následoval někoho tak neschopného ve velení?“"
 conqueror.0002.independence: "„Žádný #EMP skutečný#! dobyvatel se před nikým neplazí,“ šeptají si mezi sebou mí poddaní. „To je slabost, čistá a ryzí. Nic jiného. Slabost.“"
 conqueror.0002.incapable: "„[root_scope.GetFirstName] už nemá rozum, nezůstal tam nikdo, kdo by nás vedl,“ šeptají mí poddaní. „Bylo to dobré, dokud to trvalo...“"
 conqueror.0002.count: "„[root_scope.GetFirstName], [Select_CString(root_scope.IsFemale, 'pouhá', 'pouhý')] [ROOT.Char.GetTitleAsNameNoTooltip]... ubohé!“ šeptají mí poddaní. „Ten titul neznamená #EMP nic#!, chceme následovat někoho s královskou korunou — ne žebráka!“"
 conqueror.0002.outro: "Ta slova mě pálí v uších.\n\nZdá se, že mému dobývání je konec. Prozatím."
 conqueror.0002.a: "Bylo to příliš dobré, než aby to vydrželo..."
 conqueror_end_flavor: "Od vazalů ani lidu už nebudeš dostávat podporu."
 conqueror_title: "Od vazalů ani lidu už nebudeš dostávat podporu."
 conqueror_prefix: "Dobyvatel:"
 conqueror.1000.t: "$conqueror_prefix$ Pro válečnou pokladnu"
 conqueror.1000.desc: "„Pro válečnou pokladnu,“ stojí v [generous_vassal.GetTitledFirstNamePossessive] zprávě. „Použij tyto prostředky moudře. Jako [ROOT.Char.GetTitleAsNameNoTooltip] je můžeš využít k doplnění zbrojnic, nasycení vojáků nebo posílení svých řad žoldnéři. Toužím vidět slávu, jíž [ROOT.Char.GetPrimaryTitle.GetBaseName] dosáhne díky tobě!“\n\nTohle dokážu dobře využít."
 conqueror.1000.a: "Tohle zlato přijde náramně vhod."
 conqueror.1000.b: "Použít zlato k přilákání žoldnéřů!"
 conqueror.1000.c: "Co nejuctivěji [Select_CString(generous_vassal.IsFemale, 'jí', 'mu')] poděkovat, ale žádné dary nepotřebuji!"
 mercenary_bolstering: "Posily z řad žoldnéřů"
 mercenary_bolstering_desc: "Vidina slávy sem přilákala množství žoldnéřů."
 conqueror.1100.t: "$conqueror_prefix$ Posílené řady"
 conqueror.1100.desc: "„Má úcta,“ pronese $knight_culture_player_no_tooltip$ a ohlašuje tak svůj příchod. „[ROOT.Char.GetTitleAsNameNoTooltip] si může být mou službou jistý. Jsem [maa_leader.GetFirstName] a [generous_vassal.GetTitledFirstName] mě posílá, abych ti sloužil — přivádím s sebou družinu nejlepších vojáků, jaké [generous_vassal.GetCapitalLocation.GetTitle.GetName] dokáže postavit!“\n\n„[generous_vassal.GetTitleAsNameNoTooltip] žádá jediné: dobře nás využij a veď nás za slávou!“ Poté se napřímí do pozoru."
 conqueror.1100.a: "Nechám vám připravit ubikace!"
 conqueror.1100.b: "Rozdělit muže mezi mé pluky."
 conqueror.1100.c: "[generous_vassal.GetFirstNameNoTooltip] je štědrý, ale vaše služby nepotřebuji."
 maa_recruitment_boon: "Efektivní nábor ozbrojenců"
 maa_recruitment_boon_desc: "Této postavě pomáhají její vazalové s náborem profesionálních vojáků."
 war_war_war_opinion: "Válka, válka, válka!"
 conqueror.1200.t: "$conqueror_prefix$ Vypusť slávychtivce"
 conqueror.1200.desc: "Mými síněmi, hlavním městem i krajinou — celým mým panstvím — se rozléhá skandování: „Válka! Válka! Válka!“\n\nMí slávychtiví vazalové volají po krvi našich nepřátel a žádají, abych nám vydobyl věhlas, který mi osud předurčil.\n\nJejich podpora je neochvějná."
 conqueror.1200.a: "Nezklamu je!"
 conqueror.1200.b: "Chtějí-li válku, potřebuji vojáky."
 glory_hound_contribution: "Podpora slávychtivců"
 glory_hound_contribution_desc: "Tuto postavu neochvějně podporují její vazalové, jejichž postoj je [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName]."
 conqueror.1300.t: "$conqueror_prefix$ Podpora lidu"
 conqueror.1300.desc: "„[Select_CString(root_scope.IsFemale, 'M-má paní', 'M-můj pane')], [Select_CString(ROOT.IsFemale, 'm-má', 'm-můj')] [ROOT.Char.GetTitleAsNameNoTooltip|l], [Select_CString(root_scope.IsFemale, 'm-má', 'm-můj')] nesporný — nej[root_scope.Custom('ComplimentAdjective')] #EMP lenní pán!#!“ koktá rolník a padá přede mnou na kolena.\n\n„Přicházíme ze skromných osad. [peasant_barony.GetBaseName] je náš domov a neseme ti dary — obilí, zvěřinu a zlato. Tvrdě jsme dřeli, ale víme, že nám přineseš blahobyt!“ pokračuje.\n\nMožná patří k nejnižším z mých poddaných, ale udělali by cokoli, oč je požádám."
 conqueror.1300.a: "Nádherné dary, děkuji vám všem!"
 conqueror.1300.b: "Až uvidíte mé vojáky — nakrmte je."
 conqueror.1300.c: "Nechte svá pole ještě chvíli ležet ladem. Potřebuji vás."
 peasant_supplies: "Všeobecná podpora rolníků"
 peasant_supplies_desc: "Tato postava je mezi rolníky velmi oblíbená a ti jí ochotně poskytují více zásob než obvykle."
 peasant_draft: "Rolnický odvod"
 peasant_draft_desc: "Rolníci se houfně shromažďují pod prapory této postavy a ochotně se chopí zbraní v jejím vojsku."
 conqueror_feed_county_gift: "[county_target.GetNameNoTooltip] posílá zlato"
 conqueror_feed_county_gift_desc: "Rolníci jsou nadšeni tvými výboji, a tak ti [county_target.GetName] posílá zlato."
 conqueror_feed_county_gift_herd: "[county_target.GetNameNoTooltip] posílá stáda"
 conqueror_feed_county_gift_desc_herd: "[county_target.GetName] je domovem prostých pastevců, kteří žasnou nad tvou velikostí. V jejich očích je [ROOT.Char.GetTitleAsName] ztělesněním velikosti, a tak ti přivádějí vybraná zvířata."
 conqueror_feed_knight_joins: "$knight_culture_player_no_tooltip$ se přidává na tvou stranu"
 conqueror_feed_knight_joins_desc: "$knight_culture_player_no_tooltip$ [knight.GetFullName] ti přísahá věrnost! (@skill_prowess_icon![knight.GetProwess])"
 conqueror_feed_angry_vassal: "Rozhněvaný vazal pod dojmem"
 conqueror_feed_angry_vassal_desc: "Na tvého [Concept('vassal','vazala')|E] [angry_vassal.GetFullName] udělaly tvé výboje dojem."
 conqueror_feed_generous_courtier: "[generous_courtier.GetFirstName] přispívá zlatem"
 conqueror_feed_generous_courtier_desc: "Tvůj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('generous_courtier'))] [generous_courtier.GetFullName] přispívá na tvou věc zlatem!"
 conqueror_feed_siege_engineer: "Přidává se vojenský inženýr"
 conqueror_feed_siege_engineer_desc: "[GetTrait('military_engineer').GetName( GetNullCharacter )] [new_commander.GetFullName] se přidává do tvých řad!"
