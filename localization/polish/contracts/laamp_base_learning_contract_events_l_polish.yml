 laamp_base_learning_contract_events.4100.t.diplomacy: "$laamp_base_learning_contract_events_prefix.4100$ diplomatickou cestou"
 laamp_base_learning_contract_events.4100.t.martial: "$laamp_base_learning_contract_events_prefix.4100$ s plánem útoku"
