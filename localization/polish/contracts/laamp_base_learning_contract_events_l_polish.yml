 laamp_base_learning_contract_events.4025.tt.guaranteed_success: "#P +2#! ke skóre pro úspěšné dokončení [Concept('task_contract','zakázky')|E]"
 laamp_base_learning_contract_events.4025.tt.no_progress: "$laamp_base_learning_contract_events.4001.tt.no_progress$"
 laamp_base_learning_contract_events.4025.tt.prefered_topic: "Tato [Concept('task_contract','zakázka')|E] nabízí dodatečné odměny za téma [SCOPE.Custom('GetPreferedTopicConcept')]"
 laamp_base_learning_contract_events.4027.t: "$laamp_base_learning_contract_events_prefix.4021$ je dokončen"
 laamp_base_learning_contract_events.4027.desc.success.critical: "[employer.GetTitledFirstName] listuje rukopisem a na každé stránce se na chvíli zastaví, aby si něco pozorně prohlédl.\n\n„No tedy...“\n\nRukopis pak opatrně předá někomu ze svého služebnictva. „Viděli jste tohle? Možná to dokonce nechám #EMP vystavit#!. Tak ohromující dílo!“\n\n[employer.GetTitledFirstNameNoTooltip] tiše zatleská a šibalsky se ke mně nakloní. „Obzvlášť se mi líbila #EMP tahle#! poznámka na okraji. Výborná práce! Užijte si svou odměnu, a pokud se někdy znovu ocitnete v [employer.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], určitě se ozvěte.“\n\nHrdě se protáhnu a přikývnu."
 laamp_base_learning_contract_events.4027.desc.success.standard: "[employer.GetTitledFirstName] si rukopis zvědavě prohlíží, pobrukuje si a přikyvuje. „Celkově vzato dobrá práce. Nechám ho uložit na polici k ostatním dílům.“\n\nPak mi podá docela slušně naplněnou brašnu. „Věřím, že tohle vám dostatečně vynahradí váš čas.“\n\n„Pokud byste si to někdy chtěli zopakovat, dejte mi vědět,“ dodá [employer.GetTitledFirstNameNoTooltip] a obrátí se k odchodu.\n\nBrašnu přijmu a zdvořile přikývnu."
 laamp_base_learning_contract_events.4027.desc.success.qualified: "„Tohle... není úplně to, co jsem měl na mysli. Je to rozhodně #EMP nějaké dílo#!, ale...“ [employer.GetTitledFirstName] trochu nakrčí nos a předá rukopis někomu ze svého služebnictva.\n\n„...možná ho někam založím mezi ostatní. Cestu ven snad najdete sami?“ Než stihnu odpovědět, [employer.GetTitledFirstNameNoTooltip] už je pryč.\n\nU dveří vezmu skromnou brašnu a vydám se chodbami hledat cestu ven."
 laamp_base_learning_contract_events.4027.desc.failure: "„Co je to za...“ [employer.GetTitledFirstName] se na okamžik zarazí a pak hodí rukopis někomu ze svého služebnictva.\n\n„Vy jste měli tu drzost promrhat můj těžce získaný inkoust a pergamen na tyhle... #EMP bláboly#!?“\n\n[employer.GetTitledFirstNameNoTooltip] začne rozrušeně přecházet sem a tam a promne si spánky. „Pozval jsem vás do svého domu. Do své #EMP pracovny#!! A #EMP tohle#! je výsledek? Mám sto chutí zavolat stráže a nechat vás za tuhle zradu vyvést!“"
 laamp_base_learning_contract_events.4027.a: "„Podívejte se na to jinak. V rukou máte jedinečný rukopis.“"
 laamp_base_learning_contract_events.4027.a.tt: "Je to #EMP skutečně#! pozoruhodné dílo."
 laamp_base_learning_contract_events.4027.a.success.tt: "$laamp_base_learning_contract_events.4017.a.success.tt$"
 laamp_base_learning_contract_events.4027.a.failure.tt: "$laamp_base_learning_contract_events.4017.a.failure.tt$"
 laamp_base_learning_contract_events.4027.b.success_critical: "„Další div světa.“"
 laamp_base_learning_contract_events.4027.b.success_standard: "„K vašim službám.“"
 laamp_base_learning_contract_events.4027.b.success_qualified: "„No, [Select_CString(ROOT.Char.IsFemale, 'měla jsem', 'měl jsem')] trochu naspěch.“"
