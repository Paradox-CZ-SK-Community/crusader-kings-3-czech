l_polish:
 laamp_base_4001_request: "V této [Concept('task_contract','zakázce')|E] musíš přepsat rukopis a projít přitom #BOLD 3#! výzvami, které prověří [Concept('learning','Učenost')|E], jednu z tvých [Concept('skill','dovedností')|E]. Případně se můžeš opřít o [Concept('lifestyle_traits','rysy životního stylu')|E] a vytvořit ještě hodnotnější rukopis"
 laamp_base_learning_contract_events_prefix.4001: "Přepis"
 laamp_base_learning_contract_events.4001.tt.current_total.sub_t1: "#TUT Máš skóre #V [task_contract.MakeScope.Var('score_tally').GetValue]#! z potřebných #V [task_contract.MakeScope.Var('win_t1_threshold').GetValue]#! pro #P dostatečný úspěch#!#!"
 laamp_base_learning_contract_events.4001.tt.current_total.sub_t2: "#TUT Máš skóre #V [task_contract.MakeScope.Var('score_tally').GetValue]#! z potřebných #V [task_contract.MakeScope.Var('win_t2_threshold').GetValue]#! pro #P úspěch#! #WEAK (v současnosti máš dostatečný úspěch)#!#!"
 laamp_base_learning_contract_events.4001.tt.current_total.sub_t3: "#TUT Máš skóre #V [task_contract.MakeScope.Var('score_tally').GetValue]#! z potřebných #V [task_contract.MakeScope.Var('win_t3_threshold').GetValue]#! pro #P výjimečný úspěch#! #WEAK (v současnosti máš úspěch)#!#!"
 laamp_base_learning_contract_events.4001.tt.passages_left: "#TUT Zbývá ti přepsat #V [task_contract.MakeScope.Var('text_passages_left').GetValue]#! z #V [task_contract.MakeScope.Var('win_t1_threshold').GetValue]#! úseků textu#!"
 laamp_base_learning_contract_events.4001.tt.progress_towards_success_1: "#P +[SCOPE.ScriptValue('learning_task_contract_qualified_score_value')]#! ke skóre pro úspěšné dokončení [Concept('task_contract','zakázky')|E]"
 laamp_base_learning_contract_events.4001.tt.progress_towards_success_2: "#P +[SCOPE.ScriptValue('learning_task_contract_medium_score_value')]#! ke skóre pro úspěšné dokončení [Concept('task_contract','zakázky')|E]"
 laamp_base_learning_contract_events.4001.tt.progress_towards_success_3: "#P +[SCOPE.ScriptValue('learning_task_contract_major_score_value')]#! ke skóre pro úspěšné dokončení [Concept('task_contract','zakázky')|E]"
 laamp_base_learning_contract_events.4001.tt.no_progress: "Nezískáš #BOLD žádné#! skóre k úspěšnému dokončení [Concept('task_contract','zakázky')|E]"
 laamp_base_learning_contract_events.4001.success.tt.embellishment: "Přikrášlení se dokonale podaří"
 laamp_base_learning_contract_events.4001.success.tt: "Přepis se podaří"
 laamp_base_learning_contract_events.4001.failure.tt: "Úsek se nepovede a zahodíš ho"
 laamp_base_learning_contract_events.4001.success.t: "Zdařilý přepis"
 laamp_base_learning_contract_events.4001.failure.t: "Zahozený přepis"
 laamp_base_learning_contract_events.4001.t: "$laamp_base_learning_contract_events_prefix.4001$: Poslední úsilí"
 laamp_base_learning_contract_events.4001.t.diplomacy: "$laamp_base_learning_contract_events_prefix.4001$: Za zavřenými dveřmi"
 laamp_base_learning_contract_events.4001.t.martial: "$laamp_base_learning_contract_events_prefix.4001$: Mír skrze válku"
 laamp_base_learning_contract_events.4001.t.stewardship: "$laamp_base_learning_contract_events_prefix.4001$: Když promluví zlato"
 laamp_base_learning_contract_events.4001.t.intrigue: "$laamp_base_learning_contract_events_prefix.4001$: Všechny jazyky mlčí"
 laamp_base_learning_contract_events.4001.t.learning: "$laamp_base_learning_contract_events_prefix.4001$: Božská slova"
 laamp_base_learning_contract_events.4001.desc.01: "Denní světlo pomalu pohasíná. Sedím při svíčce v komnatě, kde přebývá [employer.GetTitledFirstName], a horečně přepisuji klikaté řádky inkoustu z jednoho listu na druhý.\n\nVíčka mi začínají těžknout a na okamžik podřimuji, než sebou trhnu a znovu se proberu. Pokud tomu správně rozumím, tématem tohoto úseku je [SCOPE.Custom('GetScriptTopic')]. Ale #EMP [ROOT.Char.GetFaith.HighGodName]#! je mi svědkem, že se to #EMP táhne a táhne#!."
 laamp_base_learning_contract_events.4001.desc.02: "Uplynulo několik dní a přepis pomalu postupuje. Současný úsek je však sušší než štěrk rozpálený na slunci...\n\nMyšlenky mi začínají utíkat jinam a několikrát zamrkám, abych se [Select_CString(ROOT.Char.IsFemale, 'přinutila', 'přinutil')] vrátit do skutečnosti. Tématem úseku je podle všeho [SCOPE.Custom('GetScriptTopic')], což samo o sobě vůbec nemusí být nudné."
 laamp_base_learning_contract_events.4001.desc.03: "Blížím se ke konci přepisu, který zatím pokračuje [SCOPE.Custom('GetScoreAdjective')]. Písař tohoto rukopisu se však znovu rozhodl pojednat téma tím nejvíc #EMP úmorným#! způsobem, jaký si lze představit.\n\nMůj pohled ulpí na [attendant.GetFirstNameNoTooltip], což je nekonečně zajímavější podívaná, dokud na mě [attendant.GetFirstNameNoTooltip] nevrhne podezřívavý pohled a já se raději nevrátím k textu. Tématem samotného úseku je [SCOPE.Custom('GetScriptTopic')]. Čtenáře by jistě zaujal, kdyby jen nebyl napsaný tak toporně."
 laamp_base_learning_contract_events.4001.desc.final_shot: "Napůl popsané stránky, inkoustové skvrny, brky #EMP všude#!. Promnu si spánky a hledím na spoušť, která po mém neúspěšném přepisování zůstala.\n\nČísi pohled z místního služebnictva mi propaluje záda a já se děsím chvíle, kdy se budu muset otočit a čelit svému blížícímu se neúspěchu.\n\nPak se ale zadívám na okraj stránky. Stojí tam [ROOT.Char.Custom('GetMarginalia')]. Náhle se v návalu vzdoru napřímím. #EMP Neúspěch?#! Stačí se jen prokousat těmi posledními několika stránkami!"
 laamp_base_learning_contract_events.4001.outro.01: "\n\nInkoustem potřísněným prstem přejedu po okraji stránky, kde stojí [ROOT.Char.Custom('GetMarginalia')]. Možná bych [Select_CString(ROOT.Char.IsFemale, 'mohla', 'mohl')] text trochu vylepšit, aby byl lákavější?"
 laamp_base_learning_contract_events.4001.outro.02: "\n\nZamyšleně přejíždím pohledem po okraji stránky, kde stojí [ROOT.Char.Custom('GetMarginalia')]."
 laamp_base_learning_contract_events.4001.outro.03: "\n\nPřemýšlím, jak nejlépe pokračovat, a přitom obdivuji okrajovou kresbu. [ROOT.Char.Custom('GetMarginalia')]..."
 laamp_base_learning_contract_events.4001.outro.secret: "\n\nPři přemýšlení si všimnu další čmáranice na okraji. Objevuje se v ní [employer.GetTitleAsNameNoTooltip]. Kdybych jen věnoval trochu času jejímu rozluštění..."
 laamp_base_learning_contract_events.4001.a: "Trocha přikrášlení neuškodí..."
 laamp_base_learning_contract_events.4001.b: "Můžu čerpat z vlastních zkušeností!"
 laamp_base_learning_contract_events.4001.b.unavailable: "Více zkušeností s tímto tématem by se hodilo."
 laamp_base_learning_contract_events.4001.b.tt.unavailable: "Pro tento úsek nemáš žádné použitelné [Concept('lifestyle_traits','rysy životního stylu')|E]"
 laamp_base_learning_contract_events.4001.b.tt.used: "Tento [Concept('lifestyle_trait','rys životního stylu')|E] už byl při tomto přepisu využit"
 laamp_base_learning_contract_events.4001.b.flavor.unlearned: "Ale jak to mám sepsat..."
 laamp_base_learning_contract_events.4001.c: "Hmm... připomíná mi to [additional_language_culture.GetLanguage.GetNameNoTooltip]"
 laamp_base_learning_contract_events.4001.c.tt.used: "Znalost [Concept('language','jazyka')|E] už byla při tomto přepisu využita"
 laamp_base_learning_contract_events.4001.c.unavailable: "Kéž bych toho věděl víc."
 laamp_base_learning_contract_events.4001.c.tt.unavailable: "Znáš pouze jeden [Concept('language','jazyk')|E]"
 laamp_base_learning_contract_events.4001.d: "Budu se prostě držet předlohy."
 laamp_base_learning_contract_events.4001.d.secret: "Věnuji ten čas navíc luštění."
 laamp_base_learning_contract_events.4001.d.flavor.unlearned: "Co... může tahle klikyháka znamenat..."
 laamp_base_learning_contract_events.4001.d.flavor.unwind: "Proč dělat víc, když můžu dělat míň."
 laamp_base_learning_contract_events.4001.d.secret.tt: "Odhalíš [Concept('secret','tajemství')|E], které skrývá [employer.GetShortUIName]"
 laamp_base_learning_contract_events.4001.e: "Raději se do toho pořádně opřu."
 laamp_base_learning_contract_events.4001.f: "Ne. Končím."
 laamp_base_learning_contract_events.4001.f.tt: "$laamp_base_learning_contract_events.4110.c.tt$"
 laamp_base_learning_contract_events.4005.t: "$laamp_base_learning_contract_events_prefix.4001$: Dokončení"
 laamp_base_learning_contract_events.4005.desc.success.critical: "[employer.GetTitledFirstName] se snaží potlačit nadšení.\n\n„No tedy! Vaše neobvyklé metody jsou očividně velmi úspěšné! [child_to_educate.GetFirstName] už začíná projevovat mnohem pronikavější úsudek a nápady!“\n\n„Způsoby útoku, společenské mravy, hospodářství... znamenitá práce! Děkuji vám a #EMP určitě#! se ozvěte, až budete zase v kraji!“ zvolá [employer.GetTitleAsNameNoTooltip] a nadšeně gestikuluje.\n\nNa rtech se mi mihne úsměv a přikývnu."
 laamp_base_learning_contract_events.4005.desc.success: "[employer.GetTitledFirstName] se zaujetím listuje stránkami. „No, tenhle rukopis je rozhodně zajímavější, než si pamatuji...\n\nRukopis pak předá svému doprovodu. „Prostudujte ho a večer se znovu sejdeme.“\n\nPoté se [employer.GetTitledFirstNameNoTooltip] obrátí ke mně, krátce se usměje a podá mi těžký měšec. „Dobrá práce. Jak jsme se dohodli, tady je vaše odměna.“"
 laamp_base_learning_contract_events.4005.desc.success.qualified: "[employer.GetTitledFirstName] sevře rty a prohlíží si rukopis. „Je to skutečně věrná kopie originálu. Děkuji za spolehlivé vyhotovení.“\n\n[employer.GetFirstNameNoTooltip] se obrátí k odchodu, ale ještě na okamžik se zastaví. „Ach. Odměnu si můžete vyzvednout u dveří. Cestu ven už jistě najdete.“\n\nKdyž se obrátím k odchodu, všimnu si u dveří brašny."
 laamp_base_learning_contract_events.4005.desc.failure: "[employer.GetTitledFirstName] zavrtí hlavou.\n\n„Co to... jak... tohle je nepřijatelné. Moje komnaty jsou zničené #EMP a#! vzácný písařský materiál promarněný.“\n\n[employer.GetFirstNameNoTooltip] zatne zuby. „Odejdi. Hned. Než mě přejde #EMP veškerá#! shovívavost.“\n\nRychle zamířím ke dveřím."
 laamp_base_learning_contract_events.4005.a.success_critical: "„To nestojí za řeč.“"
 laamp_base_learning_contract_events.4005.a.success_standard: "„Děkuji.“"
 laamp_base_learning_contract_events.4005.a.success_qualified: "„Jeden přepis, jak bylo slíbeno.“"
 laamp_base_learning_contract_events.4005.a.failure_standard: "„Rozumím.“"
 laamp_base_4011_request: "V rámci této [Concept('task_contract','zakázky')|E] musíš navštívit državy, kterým vládne [TaskContract.GetEmployer.GetTitledFirstName], a urovnat několik místních teologických sporů. Pomoci ti mohou výzvy, které prověří [Concept('learning','Učenost')|E], jednu z tvých [Concept('skill','dovedností')|E], dále [Concept('piety_level','úroveň oddanosti')|E], vhodné náboženské [Concept('traits','rysy')|E], [Concept('piety','zbožnost')|E] nebo [Concept('stress','stres')|E]."
 laamp_base_learning_contract_events_prefix.4011: "Teologická mise"
 laamp_base_learning_contract_events.4011.t: "$laamp_base_learning_contract_events_prefix.4011$ začíná"
 laamp_base_learning_contract_events.4011.desc: "Rozednívá se a já dávám dohromady doprovod na cestu. Naším cílem je [employer.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], kde sídlí [employer.GetTitledFirstName].\n\nKoně neklidně přešlapují na místě a já naposledy pohlédnu k táboru, než vyrazíme."
 laamp_base_learning_contract_events.4011.a: "Neztrácejme čas!"
 laamp_base_learning_contract_events.4011.a.tt: "@camp_travel_short_icon! Vydáš se na [Concept('travel','cestu')|E] bez svého [Concept('domicile','domicilu')|E]"
 laamp_base_learning_contract_events.4011.tt.destination_list.5_destinations: "Okamžitě vyrazíš. První zastávkou bude [employer_location_destination.GetName], potom [destination_1.GetNameNoTier], [destination_2.GetNameNoTier], [destination_3.GetNameNoTier], [destination_4.GetNameNoTier] a [destination_5.GetNameNoTier]. Nakonec se vrátíš na místo [employer_location_destination.GetName]"
 laamp_base_learning_contract_events.4011.tt.destination_list.4_destinations: "Okamžitě vyrazíš. První zastávkou bude [employer_location_destination.GetName], potom [destination_1.GetNameNoTier], [destination_2.GetNameNoTier], [destination_3.GetNameNoTier] a [destination_4.GetNameNoTier]. Nakonec se vrátíš na místo [employer_location_destination.GetName]"
 laamp_base_learning_contract_events.4011.tt.destination_list.3_destinations: "Okamžitě vyrazíš. První zastávkou bude [employer_location_destination.GetName], potom [destination_1.GetNameNoTier], [destination_2.GetNameNoTier] a [destination_3.GetNameNoTier]. Nakonec se vrátíš na místo [employer_location_destination.GetName]"
 laamp_base_learning_contract_events.4011.tt.explanation: "#TUT K dokončení [Concept('task_contract','zakázky')|E]:\n$EFFECT_LIST_BULLET$Zvládni výzvu zaměřenou na [Concept('learning','Učenost')|E], využij svou [Concept('piety_level','úroveň oddanosti')|E], náboženské [Concept('fame_traits','rysy pověsti')|E] nebo přesvědč místního držitele #EMP bezbožnými#! prostředky\n$EFFECT_LIST_BULLET$Uspěj v třetině výzev pro #P dostatečný úspěch#!\n$EFFECT_LIST_BULLET$Uspěj ve dvou třetinách výzev pro běžný #P úspěch#!\n$EFFECT_LIST_BULLET$Uspěj ve všech výzvách pro #P výjimečný úspěch#!\n\n@alert_icon! #alert_trial Zrušením [Concept('travel','cesty')|E] zneplatníš [Concept('task_contract','zakázku')|E]#!#!"
 laamp_base_learning_contract_events.4014.t: "$laamp_base_learning_contract_events_prefix.4011$ dostává směr"
 laamp_base_learning_contract_events.4014.desc: "„...a pak přišlo to #EMP pochechtávání#!!“ Z [employer.GetTitledFirstName] přímo sálá rozhořčení.\n\n„Za svůj život jsem vedl nespočet teologických rozprav a [employer.GetFaith.HighGodNameAlternate|U] ví, že se snažím zachovat trpělivost. Někteří z mých poddaných však potřebují #EMP trochu postrčit#!, aby spatřili světlo. Právě vy jim můžete ukázat správnou cestu.“\n\n[employer.GetTitledFirstNameNoTooltip] spokojeně přikývne nad vlastním řešením. „Ať vám [employer.GetFaith.HighGodName] žehná na cestách. Teď jděte.“"
 laamp_base_learning_contract_events.4014.a: "„Udělám, co bude v mých silách.“"
 laamp_base_learning_contract_events.4014.a.tt: "Začneš cestu. Prvním cílem je [destination_1.GetNameNoTier]"
 laamp_base_learning_contract_events.4015.tt.current_total.sub_t1: "#TUT Máš skóre #V [task_contract.MakeScope.Var('wins_tally').GetValue]#! z #V [task_contract.MakeScope.Var('win_t1_threshold').GetValue]#! potřebných k dosažení #P dostatečného úspěchu#!#!"
 laamp_base_learning_contract_events.4015.tt.current_total.sub_t2: "#TUT Máš skóre #V [task_contract.MakeScope.Var('wins_tally').GetValue]#! z #V [task_contract.MakeScope.Var('win_t2_threshold').GetValue]#! potřebných k dosažení #P úspěchu#! #WEAK (současný výsledek je dostatečný úspěch)#!#!"
 laamp_base_learning_contract_events.4015.tt.current_total.sub_t3: "#TUT Máš skóre #V [task_contract.MakeScope.Var('wins_tally').GetValue]#! z #V [task_contract.MakeScope.Var('win_t3_threshold').GetValue]#! potřebných k dosažení #P výjimečného úspěchu#! #WEAK (současný výsledek je úspěch)#!#!"
 laamp_base_learning_contract_events.4015.tt.disputes_left: "#TUT Zbývající spory #V [task_contract.MakeScope.Var('opportunities_left_tally').GetValue]#! z #V [task_contract.MakeScope.Var('win_t3_threshold').GetValue]#!#!"
 laamp_base_learning_contract_events.4015.tt.progress_towards_success: "$laamp_base_contract_schemes.2781.tt.progress_towards_success$"
 laamp_base_learning_contract_events.4015.tt.no_progress: "$laamp_base_learning_contract_events.4001.tt.no_progress$"
 laamp_base_learning_contract_events.4015.t: "$laamp_base_learning_contract_events_prefix.4011$: [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 laamp_base_learning_contract_events.4015.desc.surroundings.alley: "Když mířím k sídlu, kde přebývá [challenge_character.GetTitledFirstName], zahlédnu tuto postavu v jedné z uliček [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]. Jakmile se přiblížím, [challenge_character.GetFirstNameNoTooltip] přimhouří oči a vykročí ke mně."
 laamp_base_learning_contract_events.4015.desc.surroundings.market: "V jednom koutě tržiště nacházím [challenge_character.GetTitledFirstName], jak si důkladně prohlíží zboží nabízené místním kupcem. Je to [challenge_character.Custom('GetTradeGoods')]. Když se přiblížím, [challenge_character.GetFirstNameNoTooltip] ke mně vzhlédne."
 laamp_base_learning_contract_events.4015.desc.surroundings.outdoors_temple: "Když vstoupím na posvátnou půdu [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], přivítá mě jemný vánek. O kus dál se poklidně prochází [challenge_character.GetTitledFirstName] a při mém příchodu zpomalí a obrátí se ke mně."
 laamp_base_learning_contract_events.4015.desc.surroundings.temple: "Když dorazím, [challenge_character.GetTitledFirstName] právě odchází z místa zvaného [challenge_character.GetFaith.HouseOfWorship]. Jakmile si mě [challenge_character.GetFirstNameNoTooltip] všimne, nakloní hlavu a sleduje, jak přicházím blíž."
 laamp_base_learning_contract_events.4015.desc.surroundings.study: "Po příchodu nacházím [challenge_character.GetTitledFirstName] v pracovně, zcela [Select_CString(challenge_character.IsFemale, 'zabranou', 'zabraného')] do mapy. Aniž ke mně [challenge_character.GetFirstNameNoTooltip] vzhlédne, zabručením vezme mou přítomnost na vědomí."
 laamp_base_learning_contract_events.4015.desc.surroundings.physician: "Nacházím [challenge_character.GetTitledFirstName] v lékařově pracovně při rozhovoru se dvěma duchovními, pro něž se používá označení [challenge_character.GetFaith.AltPriestTermPlural]. Jakmile se přiblížím, všichni tři okamžitě zmlknou a zvědavě se na mě zadívají."
 laamp_base_learning_contract_events.4015.desc.surroundings.council_chamber: "Když dorazím, [challenge_character.GetTitledFirstName] stojí v radní síni a zamyšleně hledí z okna. Při zvuku mých kroků se pomalu otočí."
 laamp_base_learning_contract_events.4015.desc.surroundings.corridor: "Když dorazím, [challenge_character.GetTitledFirstName] se zamyšleně prochází jednou z dlouhých chodeb. Jakmile se přiblížím, otočí se ke mně."
 laamp_base_learning_contract_events.4015.desc.surroundings.relaxing_room: "Když vstoupím do odpočinkové místnosti, [challenge_character.GetTitledFirstName] pohodlně spočívá v čalouněném křesle. Při mém příchodu [challenge_character.GetFirstNameNoTooltip] zvedne hlavu."
 laamp_base_learning_contract_events.4015.desc.local_mood.disapproval: "„[employer.GetFirstNameNoTooltip] tohle téma nikdy příliš [Select_CString(employer.IsFemale, 'nechápala', 'nechápal')],“ uzná [challenge_character.GetFirstNameNoTooltip], když vysvětlím důvod své návštěvy. „Rozhodně s tím názorem nesouhlasím a pochybuji, že se to někdy změní.“"
 laamp_base_learning_contract_events.4015.desc.local_mood.anger: "„Kvůli #EMP tomuhle#! mě přicházíte vyrušovat? To je od někoho, kdo si říká [employer.GetTitleAsName], neuvěřitelně malicherné!“ [challenge_character.GetFirstNameNoTooltip] zatne pěsti, několikrát se zhluboka nadechne a snaží se uklidnit. „Nemůžete říct nic, co by mě přimělo souhlasit s tím #EMP [employer.Custom2('InsultNounClumsy', SCOPE.sC('challenge_character'))]#!!“"
 laamp_base_learning_contract_events.4015.desc.local_mood.admiration: "„Mrzí mě, že to [employer.GetFirstNameNoTooltip] vidí takhle. Na prvním místě je však pro mě [challenge_character.GetFaith.GetNameNoTooltip]. Obávám se, že tady toho moc nezmůžete,“ pronese [challenge_character.GetFirstNameNoTooltip] omluvně."
 laamp_base_learning_contract_events.4015.desc.local_mood.indifferent: "„Cože? Kdo že co chce? Ech. Dobře. Asi si o tom můžeme promluvit. Pochybuji, že to něco změní. Ale jestli se vám pak uleví.“"
 laamp_base_learning_contract_events.4015.desc.local_mood.indifferent.02: "[challenge_character.GetFirstNameNoTooltip] několikrát překvapeně zamrká, než pochopí, co mám na mysli. „Aha. Je škoda, že to [employer.GetFirstNameNoTooltip] vidí takhle, ale zkrátka se budeme muset shodnout, že se neshodneme.“ [challenge_character.GetFirstNameNoTooltip] se zamračí."
 laamp_base_learning_contract_events.4015.desc.local_mood.thinking: "„Ach? Ten malý spor? Ani jsem mu [Select_CString(challenge_character.IsFemale, 'nevěnovala', 'nevěnoval')] zvláštní pozornost, ale pokud máte další argumenty, sem s nimi.“ [challenge_character.GetFirstNameNoTooltip] pokrčí rameny. „Rozhodně nebylo mým záměrem vyvolat hněv, i když se v téhle konkrétní otázce neshodneme.“"
 laamp_base_learning_contract_events.4015.desc.outro: "Souhlasně zamručím a pečlivě zvažuji, jak nejlépe pokračovat."
 laamp_base_learning_contract_events.4015.desc.outro_priest.intro: "Po mé pravici stojí [camp_priest.GetFirstName], duchovní z mého tábora."
 laamp_base_learning_contract_events.4015.desc.outro_priest: "$laamp_base_learning_contract_events.4015.desc.outro_priest.intro$ Přikyvuje a tiše si pobrukuje, zatímco si v duchu utřiďuje své náboženské argumenty."
 laamp_base_learning_contract_events.4015.desc.outro_priest.wary: "$laamp_base_learning_contract_events.4015.desc.outro_priest.intro$ Začíná působit trochu unaveně a přimhouřenýma očima promýšlí možné protiargumenty."
 laamp_base_learning_contract_events.4015.desc.outro_priest.exhausted: "$laamp_base_learning_contract_events.4015.desc.outro_priest.intro$ Vypadá už značně vyčerpaně a čas od času nepřítomně zírá do prázdna. Jemně položím ruku na [Select_CString(camp_priest.IsFemale, 'její', 'jeho')] rameno."
 laamp_base_learning_contract_events.4015.a: "„Dovolte mi nabídnout vlastní výklad.“"
 laamp_base_learning_contract_events.4015.a.success.tt: "Podaří se ti přesvědčit [challenge_character.GetShortUIName]"
 laamp_base_learning_contract_events.4015.a.success.t: "[challenge_character.GetShortUIName] [Select_CString(challenge_character.IsFemale, 'změnila názor', 'změnil názor')]"
 laamp_base_learning_contract_events.4015.a.failure.tt: "[challenge_character.GetShortUIName] nadále nesouhlasí"
 laamp_base_learning_contract_events.4015.a.failure.t: "[challenge_character.GetShortUIName] [Select_CString(challenge_character.IsFemale, 'zůstává nepřesvědčená', 'zůstává nepřesvědčený')]"
 laamp_base_learning_contract_events.4015.b: "„Pojďme si o tom promluvit!“"
 laamp_base_learning_contract_events.4015.b.success.tt: "Úspěšně si pohovoříte o [challenge_character.GetFaith.GetName]"
 laamp_base_learning_contract_events.4015.b.success.t: "$laamp_base_learning_contract_events.4015.a.success.t$"
 laamp_base_learning_contract_events.4015.b.failure.tt: "[challenge_character.GetShortUIName] se nedá přesvědčit"
 laamp_base_learning_contract_events.4015.b.failure.t: "$laamp_base_learning_contract_events.4015.a.failure.t$"
 laamp_base_learning_contract_events.4015.c: "„Nuže, podle #EMP mých#! zkušeností...“"
 laamp_base_learning_contract_events.4015.d: "„[camp_priest.GetFirstNameNoTooltip], co si o tom #EMP myslíš ty#!?“"
 laamp_base_learning_contract_events.4015.d.success.tt: "[camp_priest.GetShortUIName] přesvědčí [challenge_character.GetShortUIName]"
 laamp_base_learning_contract_events.4015.d.success.t: "$laamp_base_learning_contract_events.4015.a.success.t$"
 laamp_base_learning_contract_events.4015.d.failure.tt: "[challenge_character.GetShortUIName] neustoupí ze svého přesvědčení"
 laamp_base_learning_contract_events.4015.d.failure.t: "$laamp_base_learning_contract_events.4015.a.failure.t$"
 laamp_base_learning_contract_events.4015.e: "Při přesvědčování [challenge_character.GetShortUIName] si nebudu brát servítky."
 laamp_base_learning_contract_events.4015.e.flavor: "A co na tom, že některé argumenty mohou být poněkud kontroverzní..."
 laamp_base_learning_contract_events.4017.t: "$laamp_base_learning_contract_events_prefix.4011$ se chýlí ke konci"
 laamp_base_learning_contract_events.4017.desc.success.critical: "[employer.GetTitledFirstName] se při mém návratu téměř vtančí do místnosti.\n\n„#EMP Nádhera!#! Zbloudilé ovce jsou zpátky ve stádu. Všechny do jedné. Dokonce i [mentioned_disputee.GetFirstName]...“\n\n[employer.GetTitledFirstNameNoTooltip] se otočí, vezme měšec obtěžkaný mincemi a bez váhání mi ho podá. „Zasloužíte si do poslední mince. Děkuji vám, a pokud vás cesta někdy znovu zavede do [employer.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], určitě se ozvěte!“\n\nUsměji se a přikývnu."
 laamp_base_learning_contract_events.4017.desc.success.standard: "[employer.GetTitledFirstName] moudře přikývne a sevře rty. „Dobrá práce. Od většiny z nich už mi přišly dopisy týkající se našich sporů. Všichni v nich uznávají, že pravda byla na mé straně.“\n\nNa okamžik se odmlčí a pak dodá. „Nepochybuji, že ostatní nakonec také prozřou. Koneckonců #EMP mám#! pravdu.“\n\nZdvořile přikývnu a obrátím se k odchodu."
 laamp_base_learning_contract_events.4017.desc.success.qualified: "Když se vrátím do [employer.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], [employer.GetTitledFirstName] se zamračí. „Hmm. Přijatelné, i když jsem možná [Select_CString(employer.IsFemale, 'čekala', 'čekal')] trochu víc.“\n\n[employer.GetFirstNameNoTooltip] se otočí a zamumlá si pro sebe. „Snad si příště někdo povede lépe...“\n\nKdyž si uvědomí, že jsem stále v místnosti, mávne směrem k útlé brašně u dveří. „Tak si ji vezměte. Cestu ven už jistě najdete.“"
 laamp_base_learning_contract_events.4017.desc.failure: "Když vstoupím do místnosti, [employer.GetTitledFirstName] si odfrkne. „Vy jste se vůbec [Select_CString(ROOT.Char.IsFemale, 'obtěžovala', 'obtěžoval')] vrátit? Po tak žalostném výkonu?“\n\n[employer.GetFirstNameNoTooltip] odmítavě zavrtí hlavou. „Víte vůbec něco o [employer.GetFaith.GetNameNoTooltip]? Ještě že se tam nic nepíše o tom, jak jednat s #EMP hlupáky#!.“\n\n[employer.GetFirstNameNoTooltip] se otočí k odchodu. Chvíli ještě zůstanu stát, než se vydám chodbami hledat cestu ven."
 laamp_base_learning_contract_events.4017.a: "„[Select_CString(ROOT.Char.IsFemale, 'Zasela jsem', 'Zasel jsem')] semínka pochybností.“"
 laamp_base_learning_contract_events.4017.a.tt: "Vrátí se do stáda. #EMP Vím#! to."
 laamp_base_learning_contract_events.4017.a.success.tt: "[employer.GetShortUIName] se nechá přesvědčit"
 laamp_base_learning_contract_events.4017.a.failure.tt: "Nepodaří se ti přesvědčit [employer.GetShortUIName]"
 laamp_base_learning_contract_events.4017.b.success_critical: "„[employer.GetFaith.HighGodNameAlternate] vede mé kroky.“"
 laamp_base_learning_contract_events.4017.b.success_standard: "„Stačilo je trochu postrčit.“"
 laamp_base_learning_contract_events.4017.b.success_qualified: "„Ještě změní názor.“"
 laamp_base_learning_contract_events.4017.b.failure_standard: "$laamp_base_learning_contract_events.4005.a.failure_standard$"
 laamp_base_4021_request: "V této [Concept('task_contract','zakázce')|E] musíš vytvořit rukopis pro [TaskContract.GetEmployer.GetTitledFirstName]. Hlavní překážkou budou výzvy zaměřené na [Concept('learning','Učenost')|E] jako [Concept('skill','dovednost')|E], ale mohou přijít i výzvy prověřující další relevantní [Concept('skills','dovednosti')|E], [Concept('lifestyle_traits','rysy životního stylu')|E] nebo zkušenosti z [Concept('travel','cestování')|E]."
 laamp_base_learning_contract_events_prefix.4021: "Rukopis"
 laamp_base_learning_contract_events.4021.t: "$laamp_base_learning_contract_events_prefix.4021$ nabývá obrysů"
 laamp_base_learning_contract_events.4021.desc: "Pobrukujem si a rozhlížím se po pracovně, kterou využívá [employer.GetTitledFirstName]. Všude kolem jsou úhledně naskládané svitky, rukopisy a kratší spisy, další zaplňují police.\n\nDílo se přece nemusí posuzovat jen podle délky. Vždyť i jediné slovo dokáže vyvolat složité emoce.\n\nAle popořadě. Na jak rozsáhlé dílo si vlastně troufám?"
 laamp_base_learning_contract_events.4021.a: "Raději to nebudu komplikovat."
 laamp_base_learning_contract_events.4021.a.tt: "Spokojíš se se #V 3#! kapitolami"
 laamp_base_learning_contract_events.4021.b: "Mé dílo bude #EMP důkladné až do posledního detailu#!."
 laamp_base_learning_contract_events.4021.b.tt: "Pustíš se do #V 5#! kapitol\n$EFFECT_LIST_BULLET$Dodatečná šance na bod [Concept('skill','dovednosti')|E] v poslední kapitole"
 laamp_base_learning_contract_events.4021.tt.chapter_explanation: "#TUT Čím více kapitol zvolíš, tím více výzev tě čeká. Odměny se budou sčítat, ale obtížnost také.#!"
 laamp_base_learning_contract_events.4021.tt.explanation: "#TUT K dokončení [Concept('task_contract','zakázky')|E]:\n$EFFECT_LIST_BULLET$Zvládni výzvu zaměřenou na [Concept('learning','Učenost')|E], kombinovanou výzvu prověřující jinou relevantní [Concept('skill','dovednost')|E] nebo využij své zkušenosti s [Concept('traveling','cestováním')|E]\n$EFFECT_LIST_BULLET$Uspěj v třetině výzev pro #P dostatečný úspěch#!\n$EFFECT_LIST_BULLET$Uspěj ve dvou třetinách výzev pro běžný #P úspěch#!\n$EFFECT_LIST_BULLET$Uspěj ve všech výzvách pro #P výjimečný úspěch#!#!"
 laamp_base_learning_contract_events.4025.t.first: "$laamp_base_learning_contract_events_prefix.4021$ začíná skromně"
 laamp_base_learning_contract_events.4025.t.last: "$laamp_base_learning_contract_events_prefix.4021$ dospěl k poslední kapitole"
 laamp_base_learning_contract_events.4025.t: "$laamp_base_learning_contract_events_prefix.4021$ pokračuje další kapitolou"
 laamp_base_learning_contract_events.4025.desc.intro.first: "Hledím na prázdnou stránku před sebou. #EMP Slova.#! Proč je vždycky tak těžké začít?"
 laamp_base_learning_contract_events.4025.desc.intro.final_shot: "Setřu si z čela krůpěj potu a hlavou mi víří jedna myšlenka za druhou. Dílo se blíží dokončení, ale jak si vlastně vedu? Dá se to vůbec někomu ukázat? "
 laamp_base_learning_contract_events.4025.desc.intro.last: "Pročítám své poznámky a spokojeně zabručím. Výstižné a k věci. Tohle snad [employer.GetTitledFirstName] ocení, ne?"
 laamp_base_learning_contract_events.4025.desc.intro.inspiration: "Náhle mě něco napadne. [SCOPE.Custom('GetInspirationTopic')|U]. Vždyť to není tak těžké, ne? Čím déle o tom přemýšlím, tím větší mám chuť podělit se o své znalosti."
 laamp_base_learning_contract_events.4025.desc.intro.01: "Po chvíli se dostanu do tempa a píšu bez přestání. Stránka za stránkou se plní myšlenkami a postřehy. Všechny se točí kolem jednoho tématu. Je jím [SCOPE.Custom('GetLatestTopic')]."
 laamp_base_learning_contract_events.4025.desc.intro.02: "Při psaní mě těší nádherný ptačí zpěv doléhající zvenčí. [employer.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] se pyšní překrásnými zahradami a jejich zvuky pronikají až ke mně."
 laamp_base_learning_contract_events.4025.desc.intro.03: "Čas u pultu rychle utíká, zatímco zaznamenávám i ty nejdrobnější postřehy a názory. Téma je [SCOPE.Custom('GetLatestTopic')]."
 laamp_base_learning_contract_events.4025.desc.first: "[ROOT.Char.Custom('WritingInstrument')] mi jemně přejíždí po bradě, zatímco pečlivě zvažuji, čemu by se měl rukopis věnovat."
 laamp_base_learning_contract_events.4025.desc.final_shot: "Venku pohasíná den a já sedím při svíčce. Začíná mi být citelně chladněji a v hlavě mi zůstávají jen pochybnosti o vlastních schopnostech. Ani pravidelné sousto jídla mi náladu nezlepší."
 laamp_base_learning_contract_events.4025.desc.last: "Talíře se dál kupí, zatímco si užívám poslední zbytky pohostinnosti před dokončením své práce. Nebo jsou snad sloužící s jídlem čím dál skoupější? Možná se mi to jen zdá..."
 laamp_base_learning_contract_events.4025.desc.01: "Venku pohasíná den a já sedím při svíčce v pracovně, kterou využívá [employer.GetTitledFirstName]. Užívám si přitom pohostinnosti, která k práci písaře příjemně patří."
 laamp_base_learning_contract_events.4025.desc.02: "Čas od času se zastaví sloužící, tiše uklidí místnost nebo přinesou něco k zakousnutí. Vždy si však dávají nesmírný pozor, aby nevydali ani hlásku, a při odchodu za sebou opatrně zavřou dveře."
 laamp_base_learning_contract_events.4025.desc.03: "Občas, když zrovna nemá jiné povinnosti, [employer.GetTitledFirstName] nakoukne do pracovny a prohlédne si mé postupně přibývající stránky potřísněné inkoustem. Chvíli si pobrukuje a pak zase odejde, očividně [Select_CString(employer.IsFemale, 'zaměstnaná', 'zaměstnaný')] důležitějšími záležitostmi."
 laamp_base_learning_contract_events.4025.desc.outro.first.has_topic: "Téma, které si [employer.GetTitledFirstName] pro rukopis [Select_CString(employer.IsFemale, 'přála', 'přál')], bylo [SCOPE.Custom('GetPreferedTopic')]. To rozhodně stojí za zvážení. Teď jen přijít na to, kde začít..."
 laamp_base_learning_contract_events.4025.desc.outro.first.no_topic: "Znovu nechám pohled bloudit po místnosti a v duchu hledám vhodné téma, kterým bych mohl svou první kapitolu otevřít..."
 laamp_base_learning_contract_events.4025.desc.outro.final_shot: "Chvíli nad tím přemýšlím a pak se trochu napřímím. Mám dvě možnosti. Přiznat si své nedostatky, nebo... vypnu hruď. Ještě jeden, #EMP pořádný#! pokus!"
 laamp_base_learning_contract_events.4025.desc.outro.01: "Vezmu to na vědomí a vrátím se k důležitější otázce. Má další kapitola pokračovat ve stejném tématu, nebo bude moudřejší zkusit něco jiného? Dosavadní téma je [SCOPE.Custom('GetLatestTopic')]..."
 laamp_base_learning_contract_events.4025.desc.outro.02: "Chvíli nad tím přemýšlím a zároveň zvažuji, čemu bych měl věnovat příští kapitolu..."
 laamp_base_learning_contract_events.4025.desc.outro.03: "Ta myšlenka mi stále leží v hlavě, když znovu obrátím pozornost ke stránce. Dosavadní téma je [SCOPE.Custom('GetLatestTopic')]. Má vůbec ještě smysl se mu věnovat...?"
 laamp_base_learning_contract_events.4025.a: "Oslním je svým důvtipem!"
 laamp_base_learning_contract_events.4025.a.second: "Trocha dalšího důvtipu neuškodí."
 laamp_base_learning_contract_events.4025.b: "Pojednání o společenském umění by se hodilo."
 laamp_base_learning_contract_events.4025.b.second: "Ještě jedna úvaha o diplomacii by nebyla na škodu."
 laamp_base_learning_contract_events.4025.c: "Mé vojenské znalosti se tu jistě uplatní."
 laamp_base_learning_contract_events.4025.c.second: "Co třeba další část o velitelích?"
 laamp_base_learning_contract_events.4025.d: "S jako správcovství. Téma přesně pro mě."
 laamp_base_learning_contract_events.4025.d.second: "Tentokrát se zaměřím na efektivitu."
 laamp_base_learning_contract_events.4025.e: "Jedno pojednání o klamu se už chystá."
 laamp_base_learning_contract_events.4025.e.second: "Možná ještě jednu kapitolu o diskrétnosti."
 laamp_base_learning_contract_events.4025.f: "Mám spoustu cestovatelských příběhů."
 laamp_base_learning_contract_events.4025.f.second: "Ještě pár cestovatelských postřehů by se hodilo."
 laamp_base_learning_contract_events.4025.g: "Poutě. Existuje vůbec něco #EMP božštějšího#!?"
 laamp_base_learning_contract_events.4025.g.second: "Dá se vůbec někdy říct o poutích všechno?"
 laamp_base_learning_contract_events.4025.h: "Ty #EMP divy#!, které jsem spatřil... O tom budu psát."
 laamp_base_learning_contract_events.4025.h.second: "O tolika dalších divech se ještě dá psát!"
 laamp_base_learning_contract_events.4025.i: "Asi se do toho raději pořádně opřu."
 laamp_base_learning_contract_events.4025.i.second: "Tak ještě jednou pořádně zabrat."
 laamp_base_learning_contract_events.4025.i.flavor: "Z toho mě bolí hlava..."
 laamp_base_learning_contract_events.4025.j: "Ještě jeden #EMP poslední#! nápor..."
 laamp_base_learning_contract_events.4025.k: "Ne. Nestojí to za to."
 laamp_base_learning_contract_events.4025.success.tt: "Kapitola se podaří"
 laamp_base_learning_contract_events.4025.success.t: "Skvělá kapitola"
 laamp_base_learning_contract_events.4025.failure.tt: "Kapitolu pokazíš"
 laamp_base_learning_contract_events.4025.failure.t: "Nepovedená kapitola"
 laamp_base_learning_contract_events.4025.tt.current_total.sub_t1: "$laamp_base_learning_contract_events.4015.tt.current_total.sub_t1$"
 laamp_base_learning_contract_events.4025.tt.current_total.sub_t2: "$laamp_base_learning_contract_events.4015.tt.current_total.sub_t2$"
 laamp_base_learning_contract_events.4025.tt.current_total.sub_t3: "$laamp_base_learning_contract_events.4015.tt.current_total.sub_t3$"
