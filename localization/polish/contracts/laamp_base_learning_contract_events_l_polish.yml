 laamp_base_learning_contract_events.4110.t: "$laamp_base_learning_contract_events_prefix.4100$ na poslední pokus"
 laamp_base_learning_contract_events.4110.desc: "Když pohled [child_to_educate.GetFirstNameNoTooltip] začne znovu bloudit kamsi do prázdna, začíná mi být jasné, že se blíží neúspěch.\n\nZ nějakého důvodu se dítěti moje výuka #EMP vůbec nechce dostat pod kůži#!... Zatnu pěsti a několikrát se zhluboka nadechnu. Možná na to jdu ze špatné strany?\n\nČas se nám krátí. Musím se ještě #EMP naposledy#! pokusit dítě zaujmout a naučit ho alespoň #EMP něco#! pořádného."
 laamp_base_learning_contract_events.4110.a: "„Tak co, [child_to_educate.Custom('ChildPetName')], co víš o...“"
 laamp_base_learning_contract_events.4110.b: "„Víš, jak se v jazyce [alternative_language_culture.GetLanguage.GetNameNoTooltip] řekne #EMP holub z nosu#!?“"
 laamp_base_learning_contract_events.4110.b.tt: "Neznáš žádný další [Concept('language','jazyk')|E], který by [child_to_educate.GetShortUIName] [Select_CString(child_to_educate.IsFemale, 'neznala', 'neznal')]"
 laamp_base_learning_contract_events.4110.c: "Ne. S tímhle dítětem je to marné."
 laamp_base_learning_contract_events.4110.c.tt: "@alert_icon! #alert_trial Neúspěch [Concept('task_contract','zakázky')|E] je na spadnutí#!"
 laamp_base_learning_contract_events.4120.t: "$laamp_base_learning_contract_events_prefix.4100$ přináší výsledky"
 laamp_base_learning_contract_events.4120.desc.success: "Výraz [employer.GetTitledFirstName] je těžko čitelný, ale snad v něm zahlédnu i trochu uznání.\n\n„Rozhodně máte neortodoxní přístup k výuce a [child_to_educate.GetFirstName] si skutečně odnesl[Select_CString(child_to_educate.IsFemale, 'a', '')] jeden či dva nové pohledy na svět... Pokud budu vaše služby v budoucnu znovu potřebovat, možná se ozvu.“\n\nPřikývnu, lehce skloním hlavu a obrátím se k odchodu."
 laamp_base_learning_contract_events.4120.desc.success_critical: "[employer.GetTitledFirstName] se snaží potlačit nadšení.\n\n„No tedy! Vaše neobvyklé metody jsou očividně velmi úspěšné! [child_to_educate.GetFirstName] už začíná projevovat mnohem pronikavější úsudek a nápady!“\n\n„Směry útoku, společenské mravy, hospodářství... znamenitá práce! Děkuji vám a #EMP určitě#! se ozvěte, až budete zase v kraji!“ [employer.GetTitledFirstNameNoTooltip] nadšeně zvolá a gestikuluje.\n\nNa rtech se mi mihne úsměv a přikývnu."
 laamp_base_learning_contract_events.4120.desc.failure: "[employer.GetTitledFirstName] nevěřícně zavrtí hlavou.\n\n„Nebudu lhát. [Select_CString(employer.IsFemale, 'Čekala jsem', 'Čekal jsem')] od vás víc. Tohle je žalostný výsledek výuky. Kdyby se [child_to_educate.GetFirstName] jen volně toulal[Select_CString(child_to_educate.IsFemale, 'a', '')] divočinou, bylo by to #EMP poučnější#!. Teď běžte a už se mi neukazujte na prahu.“\n\nRozpaky z nezvládnuté zakázky mi vehnají krev do tváří a já se obrátím k odchodu."
 laamp_base_learning_contract_events.4120.a.success_standard: "„Děkuji vám.“"
 laamp_base_learning_contract_events.4120.a.success_critical: "„[child_to_educate.GetFirstName] to [Select_CString(child_to_educate.IsFemale, 'dokázala', 'dokázal')] vlastními silami.“"
 laamp_base_learning_contract_events.4120.a.failure_standard: "To dítě je beznadějný případ... nebo možná já."
