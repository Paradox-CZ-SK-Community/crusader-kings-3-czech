 laamp_base_learning_contract_events.4100.desc.intro.first_time: "[child_to_educate.GetFirstName] se na mě při našem prvním setkání dívá zvědavě a s očekáváním."
 laamp_base_learning_contract_events.4100.desc.intro.stress: "Když přistoupím blíž, [child_to_educate.GetFirstName] instinktivně ustoupí a podezíravě přimhouří oči."
 laamp_base_learning_contract_events.4100.desc.intro.support_no_support: "[child_to_educate.GetFirstName] se na okamžik zatváří zmateně a přemýšlí, kam se poděl můj pomocník z minulé lekce."
 laamp_base_learning_contract_events.4100.desc.intro.support: "[child_to_educate.GetFirstName] si při našem příchodu zvědavě prohlíží [support_person.GetFirstName]."
 laamp_base_learning_contract_events.4100.desc.intro.learning: "Když se setkáme k další lekci, [child_to_educate.GetFirstName] se na mě dívá s nečitelným výrazem."
 laamp_base_learning_contract_events.4100.desc.intro.topic: "Když se znovu setkáme, [child_to_educate.GetFirstName] nakloní hlavu a poslouchá, jak shrnuji téma naší minulé lekce."
 laamp_base_learning_contract_events.4100.desc.surroundings.alley_day: "\n\nUlička překypuje ruchem a kupci čile přecházejí mezi náměstími, "
 laamp_base_learning_contract_events.4100.desc.surroundings.gallows: "\n\nDav kolem šibenice se právě rozchází, jeho žízeň po krvi byla ukojena, "
 laamp_base_learning_contract_events.4100.desc.surroundings.market: "\n\nNa tržišti mění zboží majitele a každý tu nachází, co potřebuje, "
 laamp_base_learning_contract_events.4100.desc.surroundings.docks: "\n\nRybářské lodě právě přirážejí k molu a jejich úlovky se vykládají na břeh, "
 laamp_base_learning_contract_events.4100.desc.surroundings.armory: "\n\nVýheň burácí a zbraně jsou vyskládané v rozích zbrojnice, "
 laamp_base_learning_contract_events.4100.desc.surroundings.garden: "\n\nPoklidné zahrady nabízejí spoustu příležitostí k výuce, "
 laamp_base_learning_contract_events.4100.desc.surroundings.tavern: "\n\nV krčmě se schází pestrá směsice štamgastů i pocestných, "
 laamp_base_learning_contract_events.4100.desc.surroundings.temple: "\n\nPo posvátném okrsku pokojně procházejí [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdherentNamePluralNoTooltip], "
 laamp_base_learning_contract_events.4100.desc.surroundings.throneroom: "\n\nSloužící pobíhají sem a tam po trůnním sále, "
 laamp_base_learning_contract_events.4100.desc.surroundings.farmlands: "\n\nPlochou zemědělskou krajinou proudí zástupy vesničanů tam i zpět, "
 laamp_base_learning_contract_events.4100.desc.surroundings.plains: "\n\nPo pláních se prohání vítr a jeho dech cítí každý, kdo tudy projde, "
 laamp_base_learning_contract_events.4100.desc.surroundings.steppe: "\n\nStep se zdá nekonečná, když se procházíme po okraji državy, "
 laamp_base_learning_contract_events.4100.desc.surroundings.desert: "\n\nPísek, písek a zase písek, kam až oko dohlédne. Touláme se po okraji državy, "
 laamp_base_learning_contract_events.4100.desc.surroundings.drylands: "\n\nVyprahlá krajina skrývá jen málo vody, přesto míjíme několik putujících skupin, "
 laamp_base_learning_contract_events.4100.desc.surroundings.oasis: "\n\nOáza na okraji državy přitahuje mnoho návštěvníků, "
 laamp_base_learning_contract_events.4100.desc.surroundings.hills: "\n\nNa zvlněných kopcích se pase mnoho [ROOT.Char.Custom('RegionalFarmAnimalPlural')], "
 laamp_base_learning_contract_events.4100.desc.surroundings.mountains: "\n\nNa zdejších horských svazích je rušno, hemží se to tu pocestnými a nejrůznějšími činnostmi, "
 laamp_base_learning_contract_events.4100.desc.surroundings.wetlands: "\n\nV bažinatých mokřadech žije všemožná havěť, jak záhy zjistí každý nepozorný pocestný, "
 laamp_base_learning_contract_events.4100.desc.surroundings.foggy_forest: "\n\nLes zahaluje zářící mlha a opodál si místní připravují další jídlo, "
 laamp_base_learning_contract_events.4100.desc.surroundings.managed_forest: "\n\nV nedalekém dřevorubeckém táboře panuje čilý ruch, "
 laamp_base_learning_contract_events.4100.desc.surroundings.pine_forest: "\n\nSběrači se prodírají křovím a sbírají místní pochoutky, "
 laamp_base_learning_contract_events.4100.desc.surroundings.forest: "\n\nV lese narazíme na tábor přátelsky naladěných dobrodruhů, "
 laamp_base_learning_contract_events.4100.desc.surroundings.forest_cave: "\n\nJeskyně, v níž přebývá [Select_CString(ROOT.Char.IsFemale, 'místní mudrkyně', 'místní mudrc')], přitahuje početný dav, "
 laamp_base_learning_contract_events.4100.desc.surroundings.snowy_forest: "\n\nVesničané se ve sněhu vydali po stopách zvěře, "
 laamp_base_learning_contract_events.4100.desc.topic.diplomacy: "a hned vidím několik příležitostí, jak [child_to_educate.GetFirstNameNoTooltip] naučit něco o půvabu společenského styku."
 laamp_base_learning_contract_events.4100.desc.topic.martial: "a při pohledu kolem sebe rychle vytipuji několik výhodných stanovišť, která mohou [child_to_educate.GetFirstNameNoTooltip] posloužit jako názorná lekce."
 laamp_base_learning_contract_events.4100.desc.topic.stewardship: "a při pohledu kolem sebe vidím spoustu příležitostí, jak zdejší organizaci zlepšit. To bude pro [child_to_educate.GetFirstNameNoTooltip] užitečná lekce."
 laamp_base_learning_contract_events.4100.desc.topic.intrigue: "a při procházce bedlivě sleduji okolí. Právě takové obezřetnosti se musí naučit i [child_to_educate.GetFirstNameNoTooltip]."
 laamp_base_learning_contract_events.4100.desc.topic.learning: "a v okolí nechybí ani [ROOT.Char.Custom('GetScientificObjects')], což se dá při výuce [child_to_educate.GetFirstNameNoTooltip] skvěle využít."
 laamp_base_learning_contract_events.4100.desc.topic.prowess: "a okamžitě si všímám všech míst, odkud by nás mohl někdo přepadnout. Pro [child_to_educate.GetFirstNameNoTooltip] je to dokonalá lekce sebeobrany."
 laamp_base_learning_contract_events.4100.desc.distraction.stress: "\n\nDítě kráčí za mnou, ale pokaždé, když se ohlédnu, demonstrativně odvrátí zrak a ignoruje mě, jako by čekalo na další výbuch mé netrpělivosti. Se svraštělým obočím přemýšlím, co s tím."
 laamp_base_learning_contract_events.4100.desc.distraction.hobbyhorse: "\n\nZa mnou se [child_to_educate.GetFirstName] jen tak loudá a z nedalekého stánku si vezme svého dřevěného koníka. Hned na něj nasedne a s nadšením začne kroužit po okolí."
 laamp_base_learning_contract_events.4100.desc.distraction.attention: "\n\nKdyž se však otočím, [Select_CString(child_to_educate.IsFemale, 'dívka se náhle zastavila', 'chlapec se náhle zastavil')] a zaujatě zkoumá klacek dlouhý jako paže, který leží na zemi. Na mé volání [child_to_educate.GetFirstNameNoTooltip] vůbec nereaguje."
 laamp_base_learning_contract_events.4100.desc.distraction.dog: "\n\nJako by se vzal odnikud, přiběhne k dítěti velký [ROOT.Char.Custom('get_region_dog_type')] a očividně si chce hrát. [child_to_educate.GetFirstName] radostně vypískne a okamžitě se pustí do hry se psem."
 laamp_base_learning_contract_events.4100.desc.distraction.running: "\n\n[Select_CString(child_to_educate.IsFemale, 'Mladá dívka', 'Mladý chlapec')] z [child_to_educate.GetCulture.GetNameNoTooltip] kultury náhle dostane divoký lesk v očích a začne křičet: „Bandité se blíží!“ [child_to_educate.GetFirstNameNoTooltip] pak málem pukne smíchy, zatímco pobíhá sem a tam se svým doprovodem."
 laamp_base_learning_contract_events.4100.desc.distraction.crushing: "\n\nO kus dál nese zásoby nápadná postava z prostého lidu, [dummy_gender.Custom('GirlBoy')], která mému svěřenci očividně učarovala. [child_to_educate.GetFirstName] se plíží kolem, zaujatě ji pozoruje a mou přítomnost #EMP naprosto#! ignoruje."
 laamp_base_learning_contract_events.4100.desc.distraction.other_kids: "\n\nNedaleko pobíhají další děti a hrají jakousi improvizovanou hru, která okamžitě upoutá pozornost [child_to_educate.GetFirstNameNoTooltip]. Než stačím zasáhnout, [child_to_educate.GetFirstNameNoTooltip] už běží k nim a zapojuje se do hry."
 laamp_base_learning_contract_events.4100.desc.distraction.friends: "\n\nZdá se, že si můj svěřenec přivedl celou skupinu přátel. To by mi nevadilo, kdyby je ovšem moje výuka nezajímala asi tak málo, jak jen může. Snažím se nemračit, zatímco se mezi sebou hašteří a škádlí."
 laamp_base_learning_contract_events.4100.desc.distraction.hiding: "\n\n[child_to_educate.GetFirstName] má očividně hravou náladu a neustále vyskakuje z nejrůznějších úkrytů a zase do nich mizí, jen aby mi unikl. Snažím se potlačit rostoucí podráždění."
 laamp_base_learning_contract_events.4100.desc.distraction.unimpressed: "\n\nSotva skončí úvodní zdvořilosti, dítě se z nějakého důvodu pohodlně zakloní, přestane mě poslouchat, zavře oči a uprostřed mého výkladu předstírá spánek."
 laamp_base_learning_contract_events.4100.desc.outro_body: "mi odtamtud zamává a je připraven pomoci, kdyby to bylo potřeba."
 laamp_base_learning_contract_events.4100.desc.outro: "\n\n[support_person.GetFirstName] $laamp_base_learning_contract_events.4100.desc.outro_body$"
 laamp_base_learning_contract_events.4100.desc.outro_other: "\n\n[support_person.GetFirstNameNoTooltip] $laamp_base_learning_contract_events.4100.desc.outro_body$"
 laamp_base_learning_contract_events.4100.a: "„[child_to_educate.Custom('ChildPetName')|U], víš #EMP vůbec#!, že...“"
 laamp_base_learning_contract_events.4100.b: "„Dobře, ještě chvilku. Pak se pustíme do výuky.“"
