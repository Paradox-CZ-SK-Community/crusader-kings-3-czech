 laamp_base_4100_desc_title: "Hledají se vzdělaní učenci,"
 laamp_base_4100_desc: "Učenci jsou žádáni, aby pomohli s výukou dětí na dvoře, kde vládne [TaskContract.GetEmployer.GetTitledFirstName]. Záslužný výkon bude náležitě oceněn."
 laamp_base_4100_request: "V této [Concept('task_contract','zakázce')|E] musíš uspět ve #BOLD 3#! výzvách zaměřených na [Concept('skill','dovednost')|E], abys vzdělal určené dítě."
 laamp_base_learning_contract_events_prefix.4100: "Chvíle pro výuku"
 laamp_base_learning_contract_events.4100.tt.current_total.sub_t1: "#TUT Máš skóre #V [task_contract.MakeScope.Var('wins_tally').GetValue]#! z #V [task_contract.MakeScope.Var('win_t1_threshold').GetValue]#! potřebných k dosažení #P úspěchu#!#!"
 laamp_base_learning_contract_events.4100.tt.current_total.sub_t2: "#TUT Máš skóre #V [task_contract.MakeScope.Var('wins_tally').GetValue]#! z #V [task_contract.MakeScope.Var('win_t2_threshold').GetValue]#! potřebných k dosažení #P výjimečného úspěchu#! #WEAK (v současnosti máš úspěch)#!#!"
 laamp_base_learning_contract_events.4100.tt.opportunities_left: "#TUT Zbývá ti #V [task_contract.MakeScope.Var('educational_moments_left').GetValue]#! z #V [task_contract.MakeScope.Var('win_t2_threshold').GetValue]#! příležitostí k výuce#!"
 laamp_base_learning_contract_events.4100.tt.boost_difficulty.learning: "Tvoje příští výzva zaměřená na [Concept('learning','Učenost')|E] bude ještě obtížnější"
 laamp_base_learning_contract_events.4100.tt.boost_difficulty.topic: "Tvoje příští výzva zaměřená na [Concept('skill','dovednost')|E] bude ještě obtížnější"
 laamp_base_learning_contract_events.4100.tt.boost_difficulty.support_person: "Spoléhat na svého pomocníka bude příště náročnější"
