 laamp_boost_legitimacy_contract_contract: "Podpora legitimity"
 laamp_boost_legitimacy_contract_desc_title: "Pocestní dobrého původu,"
 laamp_boost_legitimacy_contract_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] hledá výřečného řečníka, který by neposlušným sedlákům v panství pomohl pochopit, že [TaskContract.GetEmployer.GetName] má nezpochybnitelné právo vládnout. Bude třeba osobně promluvit k místním."
 laamp_boost_legitimacy_contract_request: "Pro splnění této [Concept('task_contract','zakázky')|E] musíš [Concept('travel','cestovat')|E] do [TaskContract.GetLocation.GetName]."
 ep3_contract_event.0510.t: "Právo vládnout"
 ep3_contract_event.0510.desc: "Když dorazím do [location.GetName], panuje tam pořádný rozruch. Prostý lid je očividně nespokojený a v čele davu stojí [peasant.GetFirstName], který právě burcuje shromážděné.\n\n„[task_contract_employer.GetTitledFirstName]? To má být #EMP [task_contract_employer.GetTitleAsNameNoTooltip]#!?“ zahřmí [peasant.GetFirstNameNoTooltip]. „Kdysi jsme mívali #EMP skutečné#! vládce! O tom, kdo smí vládnout, rozhoduje [peasant.GetFaith.FateGodName]!“\n\nŘeč je plamenná, ale na mnoha tvářích v davu vidím nejistotu. Ještě zdaleka nejsou rozhodnuti, na čí stranu se přikloní."
 ep3_contract_event.0510.a: "Když přesvědčím [peasant.GetFirstNameNoTooltip], ostatní se přidají."
 ep3_contract_event.0510.a.success: "Přesvědčíš [peasant.GetFirstNameNoTooltip] i přihlížející"
 ep3_contract_event.0510.a.failure: "Nepodaří se ti předložit přesvědčivé argumenty"
 ep3_contract_event.0510.a.critfailure: "Tvá výmluvnost tě zcela zradí"
 ep3_contract_event.0510.b: "Právo je na straně silnějšího..."
 ep3_contract_event.0510.b.success: "Tvé hrozby zaberou"
 ep3_contract_event.0510.b.failure: "[peasant.GetFirstNameNoTooltip] se tvým hrozbám vysměje"
 ep3_contract_event.0510.b.critfailure: "Špatně odhadneš situaci a schyluje se ke #EMP skutečným#! potížím"
 ep3_contract_event.0510.c: "Možná by měšec zlata dokázal změnit názor..."
 ep3_contract_event.0520.t.success: "$ep3_contract_event.0510.t$: Úspěch"
 ep3_contract_event.0520.t.failure: "$ep3_contract_event.0510.t$: Neúspěch"
 ep3_contract_event.0520.t.critfailure: "$ep3_contract_event.0510.t$: Katastrofální neúspěch"
 ep3_contract_event.0520.desc.success: "Místní buřič se drží svého, ale před silou mých argumentů nakonec veškeré odhodlání vezme za své. Dav, který byl ještě před chvílí na pokraji násilí, postupně utichá.\n\nNakonec se všichni rozejdou s přesvědčením, že [task_contract_employer.GetTitledFirstName] má plné právo vládnout v [location.GetName]. Zástupci [Select_CString(task_contract_employer.IsFemale, 'mé zaměstnavatelky', 'mého zaměstnavatele')] skládají zbraně, děkují mi za odvedenou práci a předávají zaslouženou odměnu."
 ep3_contract_event.0520.desc.failure: "Situace se nám rychle vymkne z rukou. Takový zápal a řečnická síla mě u [peasant.GetFirstNameNoTooltip] zaskočí. Na má chabá slova přichází jedna hřímavá odpověď za druhou a dav se brzy rozzuří.\n\nNezbývá mi než rychle ustoupit! Lůza skanduje, hází kameny a opakuje každou urážku, která zazněla z úst jejího vůdce.\n\n[task_contract_employer.GetTitledFirstName] z toho radost mít nebude..."
 ep3_contract_event.0520.desc.critfailure: "Tak houževnatý odpor mě zcela zaskočí.\n\nMůj pokus zastrašit místního buřiče dopadne jako kámen hozený do kachního rybníka a situace se děsivě rychle zvrtne. Beru nohy na ramena, zatímco mi plášť smáčejí sliny a ze všech stran na mě létá shnilá zelenina.\n\nPověst [task_contract_employer.GetTitledFirstNameNoTooltip] se očividně mění docela #EMP jiným#! směrem, než měl můj zásah přinést..."
 ep3_contract_event.0520.a: "Výborně."
 ep3_contract_event.0520.b: "Nu... alespoň jsem se [Select_CString(ROOT.Char.IsFemale, 'snažila.', 'snažil.')]"
 laamp_rid_councillor_contract_contract: "Odstranění potížisty"
 laamp_rid_councillor_contract_desc_title: "Hledají se odhodlaní řešitelé problémů,"
 laamp_rid_councillor_contract_desc: "[TaskContract.GetEmployer.GetTitledFirstName] hledá schopnou a nenápadnou čepel, která se postará o jednu... #EMP problematickou postavu#!. Za diskrétnost a rychlé vyřízení čeká zvláštní odměna."
 laamp_rid_councillor_contract_request: "Pro splnění této [Concept('task_contract','zakázky')|E] musíš [Concept('travel','cestovat')|E] do [TaskContract.GetLocation.GetName]."
 ep3_contract_event.0550.t: "Potížista: Poselství v temnotě"
 ep3_contract_event.0550.desc: "Dorazím na dohodnuté místo v [location.GetName]. Nikde téměř ani živáčka, ale po chvíli zahlédnu přicházet postavu zahalenou od hlavy až k patě v plášti. Jakmile se přiblíží, tiše na mě zasyčí:\n\n„Ty jsi [ROOT.Char.GetFirstNameNoTooltip], že ano?“\n\nPřikývnu a postava mi beze slova vrazí do rukou listinu. Pak rychle zmizí a zanedlouho ji znovu pohltí tma.\n\nJe zřejmé, že [task_contract_employer.GetTitledFirstName] nechce, aby se kdokoli dozvěděl, kdo za celou věcí stojí..."
 ep3_contract_event.0550.a: "Tak se podíváme, co mě čeká..."
 ep3_contract_event.0550.a.tt: "Otevři dopis."
 ep3_contract_event.0555.desc: "Doufám, že chápeš, proč je nutná naprostá diskrétnost. Zoufalství mě dohnalo až sem a nemohu si dovolit odhalit své úmysly.\n\nTvým cílem je [councillor.GetName]. Musíš [Select_CString(councillor.IsFemale, 'ji', 'ho')] odstranit... od moci, nebo rovnou z tohoto světa, na tom mi nezáleží.\n\nDnes v noci [Select_CString(councillor.IsFemale, 'ji', 'ho')] najdeš na místě zvaném [ROOT.Char.Custom('GetPubName')]. Tento dopis znič a už o něm nikdy nemluv."
 ep3_contract_event.0555.a: "Aha... takže [councillor.GetActiveCouncilTask.GetPositionName] musí zmizet."
 ep3_contract_event.0560.t: "Potížista: [councillor.GetActiveCouncilTask.GetPositionName] na odstřel"
 ep3_contract_event.0560.desc: "Krčma je nedaleko. Opatrně nakouknu zadním vchodem a spatřím [councillor.GetTitledFirstName], jak si užívá hlučný večer a vůbec netuší, jaké nebezpečí číhá nablízku.\n\nMohla by to být jednoduchá práce... prostě vtrhnout dovnitř a rozsekat [Select_CString(councillor.IsFemale, 'ji', 'ho')] na kusy. Možná by se ale našlo i něco nenápadnějšího.\n\nA třeba... by [councillor.GetFirstNameNoTooltip] nakonec [Select_CString(councillor.IsFemale, 'mohla', 'mohl')] zůstat naživu?"
 ep3_contract_event.0560.a: "#EMP Pěkně hlavním vchodem!#!"
 ep3_contract_event.0560.a.success: "Boj skončí rychle a nezůstane po něm žádný živý svědek"
 ep3_contract_event.0560.a.neutral: "[councillor.GetFirstNameNoTooltip] v potyčce zemře"
 ep3_contract_event.0560.a.failure: "Přepadení zpackáš a musíš uprchnout"
 ep3_contract_event.0560.a.critfailure: "Boj dopadne katastrofálně"
 ep3_contract_event.0560.b: "Nůž na latríně bude muset stačit."
 ep3_contract_event.0560.b.success: "Všechno vyjde dokonale"
 ep3_contract_event.0560.b.neutral: "Strhne se potyčka a tvého útěku si lidé všimnou"
 ep3_contract_event.0560.b.failure: "Spustí se poplach a tvůj plán ztroskotá"
 ep3_contract_event.0560.c: "Možná by stačilo otrávit [councillor.GetFirstNameNoTooltip] pohár?"
 ep3_contract_event.0560.c.critsuccess: "Na jed se nikdy nepřijde"
 ep3_contract_event.0560.c.success: "Když si jedu někdo všimne, je už příliš pozdě"
 ep3_contract_event.0560.c.failure: "[councillor.GetFirstNameNoTooltip] pouze onemocní"
 ep3_contract_event.0560.c.critfailure: "Přistihnou tě přímo při trávení"
 ep3_contract_event.0560.d: "Dobře provedený únos by posloužil stejně..."
 ep3_contract_event.0560.d.critsuccess: "Úspěšně uneseš [councillor.GetFirstNameNoTooltip]"
 ep3_contract_event.0560.d.success: "[councillor.GetFirstNameNoTooltip] se brání a musíš [Select_CString(councillor.IsFemale, 'ji', 'ho')] přemoci"
 ep3_contract_event.0560.d.failure: "[councillor.GetFirstNameNoTooltip] unikne"
 ep3_contract_event.0560.contractcritsuccess: "Tvá [Concept('task_contract','zakázka')|E] končí #P mimořádným úspěchem#!"
 ep3_contract_event.0560.contractsuccess: "Tvá [Concept('task_contract','zakázka')|E] končí #P úspěchem#!"
 ep3_contract_event.0560.contractfailure: "Tvá [Concept('task_contract','zakázka')|E] končí #N neúspěchem#!"
 ep3_contract_event.0560.contractcritfailure: "Tvá [Concept('task_contract','zakázka')|E] končí #N katastrofálním neúspěchem#!"
 ep3_contract_event.0565.t.critsuccess: "Potížista: Mimořádný úspěch"
 ep3_contract_event.0565.t.success: "Potížista: Úspěch"
 ep3_contract_event.0565.t.failure: "Potížista: Neúspěch"
 ep3_contract_event.0565.t.critfailure: "Potížista: Katastrofální neúspěch"
 ep3_contract_event.0565.desc.critsuccess: "S [councillor.GetTitledFirstName] je konec děsivě rychle. Umírá v hanbě a [Select_CString(councillor.IsFemale, 'její', 'jeho')] společníci nestačí ani spustit povyk.\n\nChladné ranní světlo mé hříchy téměř smyje a koupel v místním potoce dokoná zbytek.\n\nNa břehu čeká posel. Zda je to tatáž osoba jako předtím, nedokážu poznat. U nohou leží několik těžkých vaků.\n\n„[task_contract_employer.GetTitleAsNameNoTooltip] ti děkuje za odvedenou práci. Jako výraz vděčnosti pro tebe přichystal ještě jeden dar.“"
 ep3_contract_event.0565.desc.success: "[councillor.GetTitledFirstFirstName] už není mezi živými. Násilí nebylo provedeno dokonale, ale na výsledku to nic nemění. Můj cíl je mrtvý.\n\nChladné ranní světlo mé hříchy téměř smyje a koupel v místním potoce dokoná zbytek.\n\nNa břehu čeká posel. Zda je to tatáž osoba jako předtím, nedokážu poznat. Ze sedla visí těžký vak.\n\n„[task_contract_employer.GetTitleAsNameNoTooltip] ti děkuje za odvedenou práci. Na tvou službu se nezapomene.“"
 ep3_contract_event.0565.desc.failure: "V uších mi stále zní řev, rachot létajícího nádobí a stoliček i tvrdé údery. Zuřivě si drhnu ruce, ale tenhle potok ze mě stopy neúspěchu nesmyje.\n\nTaková pohroma. [councillor.GetTitledFirstName] žije a má zakázka pro [task_contract_employer.GetTitledFirstName] je u konce. [Select_CString(ROOT.Char.IsFemale, 'Neměla', 'Neměl')] bych se tu zdržovat, jinak si mě může najít pomsta z jedné či druhé strany."
 ep3_contract_event.0565.desc.critfailure: "Naprostá katastrofa! Všichni v té drsné putyce se obrátili proti mně a jen se štěstím jsem [Select_CString(ROOT.Char.IsFemale, 'vyvázla', 'vyvázl')] [Select_CString(ROOT.Char.IsFemale, 'živá', 'živý')].\n\nU nedaleké řeky si čistím rány, [Select_CString(ROOT.Char.IsFemale, 'celá', 'celý')] se přitom umažu od bláta a s námahou znovu upevňuji zavazadla.\n\nMusím prchat dál... [councillor.GetTitledFirstName] žije a [task_contract_employer.GetTitledFirstName] bude zuřit. Jen naprostý hlupák by se tu ještě zdržoval."
 ep3_contract_event.0565.a: "Už o [Select_CString(councillor.IsFemale, 'ní', 'něm')] nikdo nikdy neuslyší."
 ep3_contract_event.0565.b: "Zatraceně."
 laamp_gain_wanderer_contract_contract: "Pomoc pocestnému"
 laamp_gain_wanderer_contract_desc_title: "Prosíme, vyslyšte nás!"
 laamp_gain_wanderer_contract_desc: "V [TaskContract.GetEmployer.GetCurrentLocation.GetNameNoTooltip] je třeba někoho zachránit! Nabízí se služba, zlato i veškerá kořist, kterou při tom najdeš."
 laamp_gain_wanderer_contract_request: "Pro splnění této [Concept('task_contract','zakázky')|E] musíš [Concept('travel','cestovat')|E] do [TaskContract.GetLocation.GetName]."
 ep3_contract_event.0570.t: "Záchrana"
 ep3_contract_event.0570.desc: "Po příjezdu do [location.GetName] se párkrát vyptám a brzy zjistím, kde hledat. V lehce střežené budově najdu [task_contract_employer.GetFirstName] [Select_CString(task_contract_employer.IsFemale, 'připoutanou', 'připoutaného')] ke zdi.\n\nStráž pravidelně obchází okolí. Jakmile se vzdálí, využiji příležitosti a proplížím se k cele, kde je [task_contract_employer.GetFirstNameNoTooltip].\n\n„[Select_CString(ROOT.Char.IsFemale, 'Přišla', 'Přišel')] jsi mi pomoct?“ ozve se slabý hlas. „Prosím, rychle! Musíš mě dostat ven, než se ti ničemové, kteří mě uvěznili, vrátí!“"
 ep3_contract_event.0570.a: "Počkám, až se stráž vrátí. Meč bude připravený."
 ep3_contract_event.0570.a.tt: "#V Duel#! s [prisonguard.GetFirstNameNoTooltip].\nTvá [Concept('prowess','udatnost')|E]: [prowess_i]#V [root_for_loc.GetProwess]#!\n[prisonguard.GetFirstNameNoTooltip] [Concept('prowess','udatnost')|E]: [prowess_i]#V [prisonguard.GetProwess]#!"
 ep3_contract_event.0570.b: "Možná bych [Select_CString(ROOT.Char.IsFemale, 'mohla', 'mohl')] stráž nějak rozptýlit?"
 ep3_contract_event.0570.b.success: "Odvedení pozornosti zafunguje"
 ep3_contract_event.0570.b.failure: "Stráž se obelstít nenechá"
 ep3_contract_event.0570.b.failure.tt: "Při útěku utrpíš zranění"
 ep3_contract_event.0570.c: "Bude to těsné, ale ten zámek #EMP bych [Select_CString(ROOT.Char.IsFemale, 'mohla', 'mohl')]#! včas vypáčit..."
 ep3_contract_event.0570.c.success: "Vypáčíš zámek"
 ep3_contract_event.0570.c.failure: "Dojde ti čas a musíš uprchnout"
 ep3_contract_event.0575.t.success: "$ep3_contract_event.0570.t$: Úspěch"
 ep3_contract_event.0575.t.failure: "$ep3_contract_event.0570.t$: Neúspěch"
 ep3_contract_event.0575.desc.duel: "Bezvládné tělo [Select_CString(prisonguard.IsFemale, 'strážkyně', 'strážce')] se sesune k zemi a já už prohledávám měšce, sbírám klíče a všechno ostatní, co by se mohlo hodit. Najdu pár mincí a [newly_created_artifact.GetName], ale není času nazbyt.\n\n"
 ep3_contract_event.0575.desc.success: "Musíme jednat rychle. Okovy povolí a s hlasitým #EMP řinčením#! dopadnou na podlahu. Pak už prcháme. Dveřmi cely, ven z budovy, za roh a konečně na čerstvý vzduch. Svoboda.\n\n„Ani nevím, jak ti poděkovat!“ vydechne [task_contract_employer.GetFirstName] a stále ještě lapá po dechu. „Jsem [Select_CString(task_contract_employer.IsFemale, 'tvou dlužnicí.', 'tvým dlužníkem.')] Od této chvíle ti budu sloužit.“"
 ep3_contract_event.0575.desc.failure: "Pokus o útěk skončil katastrofou. [task_contract_employer.GetFirstName] zůstává [Select_CString(task_contract_employer.IsFemale, 'připoutaná', 'připoutaný')] ke zdi a s nadějí, že za záchranu získám [Select_CString(task_contract_employer.IsFemale, 'její', 'jeho')] služby, je konec.\n\nNezbývá mi než se nenápadně odplížit zpět ke koni, protože pronásledovatelé mohou být nablízku, a vydat se tam, odkud jsem přišel."
 ep3_contract_event.0575.a: "Bude mi potěšením mít tě po svém boku!"
 ep3_contract_event.0575.b: "Škoda."
 ep3_pilfered_brooch: "Pozlacená stříbrná brož"
 laamp_find_secret_contract_contract: "Odhalení tajemství"
 laamp_find_secret_contract_desc_title: "Ukoj mou zvědavost..."
 laamp_find_secret_contract_desc: "V [TaskContract.GetEmployer.GetCurrentLocation.GetNameNoTooltip] jsou zapotřebí všímavé oči a bystré uši, které dokážou odhalit osobní tajemství. Zájemce musí umět zachovat diskrétnost."
 laamp_find_secret_contract_request: "Pro splnění této [Concept('task_contract','zakázky')|E] musíš [Concept('travel','cestovat')|E] do [TaskContract.GetLocation.GetName]."
 ep3_contract_event.0580.t: "Důvěrné informace"
 ep3_contract_event.0580.desc: "[task_contract_employer.GetTitledFirstName] pojímá podezření vůči [secret_haver.GetTitledFirstName], a tak se za [secret_haver.GetFirstNameNoTooltip] plížím chodbami [secret_haver.GetFaith.HouseOfWorship].\n\n[secret_haver.GetFirstNameNoTooltip] zjevně vede hluboký rozhovor [Select_CString(secret_haver.IsFemale, 'sama', 'sám')] se sebou. Odvážím se o pár kroků blíž a ukryji se za vystupující zdí.\n\n#EMP Téměř#! rozeznávám šeptaná slova. Jestli se [secret_haver.GetFirstNameNoTooltip] zpovídá a vše slyší [secret_haver.GetFaith.HighGodName], nebo si jen divoce mumlá pro sebe, nedokážu říct..."
 ep3_contract_event.0580.a: "Ještě o kousek blíž..."
 ep3_contract_event.0580.a.success: "Proplížíš se dost blízko, abys všechno [Select_CString(ROOT.Char.IsFemale, 'slyšela', 'slyšel')]"
 ep3_contract_event.0580.a.failure: "Slovům pořád nedokážeš pořádně rozumět"
 ep3_contract_event.0580.b: "Možná stačí #EMP předstírat#!, že už všechno vím..."
 ep3_contract_event.0580.b.success: "[task_contract_employer.GetFirstNameNoTooltip] tvé lži uvěří"
 ep3_contract_event.0580.b.failure: "[task_contract_employer.GetFirstNameNoTooltip] ti nevěří ani slovo"
 ep3_contract_event.0580.c: "Už mám dost tohohle schovávání."
 ep3_contract_event.0580.c.tt: "Otevřené výhrůžky mohou uspět tam, kde odposlouchávání selhalo."
 ep3_contract_event.0580.c.neutral.tt: "[secret_haver.GetFirstNameNoTooltip] se podivně usmívá..."
 ep3_contract_event.0580.c.success: "Tvé výhrůžky zaberou"
 ep3_contract_event.0580.c.failure: "[secret_haver.GetFirstNameNoTooltip] tvými výhrůžkami pohrdá"
 ep3_contract_event.0580.c.neutral: "[secret_haver.GetFirstNameNoTooltip] navrhne dohodu"
 ep3_contract_event.0581.t: "$ep3_contract_event.0580.t$: Nová dohoda"
 ep3_contract_event.0581.desc: "Výhružně vykročím k [secret_haver.GetTitledFirstName], ale [secret_haver.GetFirstNameNoTooltip] zvedne ruce v prosebném gestu.\n\n„Počkej! Vím, že už jsi [Select_CString(ROOT.Char.IsFemale, 'slyšela', 'slyšel')] dost. A vím, že ze mě nakonec dostaneš i zbytek. Ale mám pro tebe nabídku.“\n\n„Přesně vím, kdo tě na mě poslal. [Select_CString(task_contract_employer.IsFemale, 'Tvá zaměstnavatelka', 'Tvůj zaměstnavatel')] totiž zdaleka nemá tak čisté svědomí, jak se snaží působit.“\n\n„Kdybych ti [Select_CString(secret_haver.IsFemale, 'dala', 'dal')] tohle...“ [secret_haver.GetFirstNameNoTooltip] vytáhne malý váček zlata a stáhne si z prstu prsten. „...možná by sis je [Select_CString(ROOT.Char.IsFemale, 'mohla', 'mohl')] vzít, odnést si s nimi i tuhle vědomost a mé tajemství nechat na pokoji?“"
 ep3_contract_event.0581.a: "Mám zakázku, kterou musím splnit."
 ep3_contract_event.0581.b: "To je lákavá nabídka..."
 ep3_contract_event.0585.t.success: "$ep3_contract_event.0580.t$: Úspěch"
 ep3_contract_event.0585.t.failure: "$ep3_contract_event.0580.t$: Neúspěch"
 ep3_contract_event.0585.desc.success: "„Výborně! Výborně!“ zahřmí [task_contract_employer.GetTitledFirstName], když přinesu zprávy. „Samozřejmě jsem [Select_CString(task_contract_employer.IsFemale, 'měla', 'měl')] své podezření, ale konečně mít jistotu...“\n\n[task_contract_employer.GetFirstNameNoTooltip] gestem přivolá strážce s mou odměnou a zamyšleně si přejede po bradě.\n\n„Tvá odměna. Pokud budu někdy znovu potřebovat pomoc, neváhej vyslyšet mé volání. Sbohem, [ROOT.Char.GetTitledFirstNameNoTooltip].“"
 ep3_contract_event.0585.desc.failure: "„Ty [Select_CString(ROOT.Char.IsFemale, 'hlupačko', 'hlupáku')]. Ty [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('task_contract_employer'))]!“ Mé úsilí odhalit tajemství, které skrývá [secret_haver.GetFirstName], na [task_contract_employer.GetTitledFirstName] příliš nezapůsobí.\n\n„Já to tajemství prostě #EMP musím#! znát! Každý, koho pošlu, je buď neschopný, nebo obyčejný lhář! [Select_CString(task_contract_employer.IsFemale, 'Myslela', 'Myslel')] jsem, že právě ty tuhle smůlu prolomíš.“ [task_contract_employer.GetFirstNameNoTooltip] pohrdavě ukáže ke dveřím.\n\n„Vypadni. Doufám, že se naše cesty už nikdy nezkříží, [ROOT.Char.GetTitledFirstNameNoTooltip].“"
 ep3_contract_event.0585.desc.liedsuccessfully: "„Opravdu?“ Se zatajeným dechem čekám, zatímco [task_contract_employer.GetTitledFirstName] zvažuje mou nestydatou lež. „Ano... ano! To dává #EMP dokonalý#! smysl!“\n\nS úlevou vydechnu, když [task_contract_employer.GetFirstNameNoTooltip] gestem přivolá strážce s mou odměnou.\n\n„Samozřejmě to není úplně to, co jsem [Select_CString(task_contract_employer.IsFemale, 'čekala', 'čekal')]... ale když se nad tím #EMP zamyslíš#!...“ [task_contract_employer.GetFirstNameNoTooltip] už očividně nemluví ke mně, ale [Select_CString(task_contract_employer.IsFemale, 'sama', 'sám')] k sobě.\n\nJe nejvyšší čas nenápadně zmizet."
 ep3_contract_event.0585.a: "Výborně."
 ep3_contract_event.0585.b: "Zatraceně!"
 laamp_eliminate_heir_contract_contract: "Odstranění dědice"
 laamp_eliminate_heir_contract_desc_title: "Hrdlořezové širých cest,"
 laamp_eliminate_heir_contract_desc: "Hledá se zkušená a tichá čepel, která by pomohla... urovnat jisté rodinné záležitosti. Nabízí se cenné známosti a tučná odměna."
 laamp_eliminate_heir_contract_request: "Pro splnění této [Concept('task_contract','zakázky')|E] musíš [Concept('travel','cestovat')|E] do [TaskContract.GetLocation.GetName]."
 ep3_contract_event.0590.t: "Špinavá práce"
 ep3_contract_event.0590.desc: "[heir.GetTitledFirstName] je [Select_CString(heir.IsFemale, 'problematická dědička', 'problematický dědic')] a vlastní bezpečnost nebere právě vážně. Pozdní noční procházka možná trochu otupí smysly, ale zanedlouho se do hry vloží ostří docela jiné...\n\nPřesto se mi ruka zarazí. Mám splnit zakázku, jenže na celé věci je něco... špatně.\n\nMožná existuje i jiné řešení?"
 ep3_contract_event.0590.a: "Dost váhání. Je čas zemřít, [heir.GetFirstNameNoTooltip]."
 ep3_contract_event.0590.a.success: "[heir.GetFirstNameNoTooltip] tiše zemře"
 ep3_contract_event.0590.a.failure: "[heir.GetFirstNameNoTooltip] tě zaslechne a uprchne"
 ep3_contract_event.0590.b: "Možná bych [Select_CString(ROOT.Char.IsFemale, 'mohla', 'mohl')] omráčit [heir.GetFirstNameNoTooltip]?"
 ep3_contract_event.0590.b.success: "[heir.GetFirstNameNoTooltip] se bezvládně sesune k zemi"
 ep3_contract_event.0590.b.failure: "[heir.GetFirstNameNoTooltip] tě zaslechne přicházet"
 ep3_contract_event.0590.b.fatalbonk: "[Select_CString(ROOT.Char.IsFemale, 'Udeřila', 'Udeřil')] jsi [heir.GetFirstNameNoTooltip] o něco #EMP silněji#!, než bylo třeba"
 ep3_contract_event.0590.c: "Možná by stačilo vysvětlit, o co jde..."
 ep3_contract_event.0590.c.success: "[heir.GetFirstNameNoTooltip] souhlasí, že půjde s tebou"
 ep3_contract_event.0590.c.failure: "[heir.GetFirstNameNoTooltip] se tvému příběhu vysměje"
 ep3_contract_event.0590.c.critfailure: "Prozradíš, kdo tě na tuhle práci najal"
 ep3_contract_event.0591.t: "$ep3_contract_event.0590.t$: Druhá šance"
 ep3_contract_event.0591.desc.knockedout: "Sedím na kameni za [location.GetName] a sleduji, jak [heir.GetTitledFirstName] pomalu přichází k sobě. Ránu do hlavy jsem očividně [Select_CString(ROOT.Char.IsFemale, 'odměřila', 'odměřil')] dobře. Jeden den bude hlava bolet, ale žádné trvalé následky by zůstat neměly.\n\nChvíli mi trvá, než vysvětlím, co se vlastně stalo. Vzhledem k tomu, jak zásadně se tím život [heir.GetFirstNameNoTooltip] obrátil naruby, bere celou věc překvapivě klidně.\n\n„Děkuji, že jsi mě [Select_CString(ROOT.Char.IsFemale, 'ušetřila', 'ušetřil')],“ řekne [heir.GetFirstNameNoTooltip] a připevní zavazadlo ke koni, kterého jsem sem [Select_CString(ROOT.Char.IsFemale, 'přivedla', 'přivedl')]. „Nezapomenu na to. Doufám, že se naše cesty ještě někdy zkříží.“ Pak pobídne koně, zvedne ruku na rozloučenou a odjíždí."
 ep3_contract_event.0591.desc.camewillingly: "Sedím na kameni a sleduji, jak [heir.GetTitledFirstName] připevňuje zavazadlo ke koni. Cesta sem za [location.GetName] mi poskytla dost času všechno vysvětlit a [heir.GetFirstNameNoTooltip] se mnou nakonec [Select_CString(heir.IsFemale, 'šla', 'šel')] více než ochotně.\n\n„Děkuji, že jsi mě [Select_CString(ROOT.Char.IsFemale, 'ušetřila', 'ušetřil')],“ řekne [heir.GetFirstNameNoTooltip], jakmile zavazadlo upevní. „Nezapomenu na to. Doufám, že se naše cesty ještě někdy zkříží.“ Pak pobídne koně, zvedne ruku na rozloučenou a odjíždí."
 ep3_contract_event.0591.a: "„Hodně štěstí!“"
 ep3_contract_event.0595.t: "$ep3_contract_event.0590.t$: Nedokončená práce"
 ep3_contract_event.0595.desc: "Mé pokusy splnit přání [task_contract_employer.GetFirstNameNoTooltip] vyšly vniveč.\n\n[heir.GetFirstName|U] žije a zůstává trnem v oku [task_contract_employer.GetFirstNameNoTooltip]. Já se musím co nejrychleji dostat z [location.GetName], než mě dostihne hněv [Select_CString(task_contract_employer.IsFemale, 'mé zaměstnavatelky', 'mého zaměstnavatele')]."
 ep3_contract_event.0595.a: "Zpátky na cestu..."
