 ep3_contract_event.0070.desc: "Do mého tábora dorazí ozbrojený oddíl pod praporem [task_contract_employer.GetName].\n\n„Zdravím tě, [ROOT.Char.GetTitledFirstNameNoTooltip]! Říká se, že tě zajímá naše věc, a tak jsme přišli promluvit o našem nepříteli, [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.GetName]. "
 ep3_contract_event.0070.desc_fallback_faction: "$ep3_contract_event.0070.desc$[task_contract_target.GetFirstNameNoTooltip] nám leze pod kůži a rozežírá nás zevnitř! Chceme světu ukázat, co je to za odpornou havěť!“\n\n„A co hůř..."
 ep3_contract_event.0070.desc_liberty_faction: "$ep3_contract_event.0070.desc$[task_contract_target.GetFirstNameNoTooltip] svírá naše panství pod krkem a nahromaděnou mocí dusí šlechtu!“\n\n„To už nelze snášet! A navíc..."
 ep3_contract_event.0070.desc_independence_faction: "$ep3_contract_event.0070.desc$[task_contract_target.GetFirstNameNoTooltip] si vládu nezaslouží — #EMP vůbec nezaslouží!#! My poddaní bychom si vedli lépe sami.“\n\n„A navíc..."
 ep3_contract_event.0070.desc_claimant_faction: "$ep3_contract_event.0070.desc$[task_contract_target.GetFirstNameNoTooltip] nemá na vládu nad [task_contract_faction.GetSpecialTitle.GetName] právo ani schopnosti. Naše naděje vkládáme do [task_contract_faction.GetSpecialCharacter.GetName], skutečného vůdce, [task_contract_faction.GetSpecialCharacter.Custom('PersonalityGetPositiveTraitDesc')] a zároveň [task_contract_faction.GetSpecialCharacter.Custom('DescriptorPositiveStandalone')]!“\n\n„A [task_contract_target.GetTitledFirstNameNoTooltip] navíc..."
 ep3_contract_event.0070.desc_nation_fracturing_faction: "$ep3_contract_event.0070.desc$Nejenže se [task_contract_target.GetFirstNameNoTooltip] nehodí na trůn, ale celé [task_contract_faction.GetSpecialTitle.GetName] je prohnilé až do morku kostí! Věříme, že toto prokleté panství už nic nezachrání.“\n\n„Jediná cesta vpřed je zničit je a z popela vybudovat nové!“"
 ep3_contract_event.0070.desc_liege_taxes: "Daně z nás i z našeho lidu ždímají poslední minci!“"
 ep3_contract_event.0070.desc_liege_levies: "Odvody mi z polí berou i posledního člověka schopného práce!“"
 ep3_contract_event.0070.desc_liege_culture: "[task_contract_target.GetCulture.GetName] kultura je pro [task_contract_target.GetFirstNameNoTooltip] nade vše!“"
 ep3_contract_event.0070.desc_liege_faith: "[task_contract_target.GetFaith.GetName] je pro [task_contract_target.GetFirstNameNoTooltip] nade vše!“"
 ep3_contract_event.0070.desc_liege_fallback: "[task_contract_target.GetFirstNameNoTooltip] je [task_contract_target.Custom('DescriptorNegativeStandalone')]!“"
 ep3_contract_event.0070.desc_outro: "odplivne vůdce ozbrojenců a natáhne ke mně ruku. „Přidáš se k nám?“"
 ep3_contract_event.0070.a: "[task_contract_target.GetFirstNameNoTooltip] má půdu, ze které chci svůj díl!"
 ep3_contract_event.0070.b: "Vskutku spravedlivá věc!"
 ep3_contract_event.0080.t: "$contract_event_prefix$ $laamp_help_fabricate_claim_contract_contract$"
 ep3_contract_event.0080.desc: "Do mého tábora zavítá [task_contract_councillor.GetCouncilTitleFirstName]. [task_contract_councillor_liege.GetPrimaryTitle.GetNameNoTier] je země, odkud přichází.\n\n„Zdravím tě, [ROOT.Char.GetTitledFirstNameNoTooltip]. Působíš jako [Select_CString(ROOT.Char.IsFemale, 'bystrá žena', 'bystrý muž')]... koneckonců už jsi [Select_CString(ROOT.Char.IsFemale, 'přišla', 'přišel')] na to, co se tu snažíme v tajnosti dokázat.“ [task_contract_councillor.GetFirstNameNoTooltip] mi položí ruku na rameno. „Víš, [task_contract_target.GetName]... je [Select_CString(task_contract_target.IsFemale, 'uzurpátorka', 'uzurpátor')]. Já to vím, [task_contract_employer.GetTitledFirstNameNoTooltip] to ví a ty to víš také.“ [task_contract_councillor.GetFirstNameNoTooltip] mě poplácá po hrudi.\n\n„Řekněme, že bys náhodou #EMP [Select_CString(ROOT.Char.IsFemale, 'našla', 'našel')]#! důkaz o dědičných nárocích [Select_CString(task_contract_councillor_liege.IsFemale, 'mé lenní paní', 'mého lenního pána')]. [Select_CString(ROOT.Char.IsFemale, 'Postarala', 'Postaral')] by ses pak, aby se všichni dozvěděli #EMP pravdu#!?“"
 ep3_contract_event.0080.open_start_generate_claim_interaction: "Otevře [Concept('character_interaction','interakci s postavou')|E] pro zahájení [Concept('scheme','intriky')|E] [GetScheme('generate_claim').GetTypeName]"
 ep3_contract_event.0080.a: "Podívám se, co se dá dělat."
 ep3_contract_event.0082.t: "$contract_event_prefix$ $laamp_fight_faith_conversion_contract_contract$"
 ep3_contract_event.0082.desc: "Do mého tábora dorazí delegace věrných [task_contract_employer.GetFaith.GetAdherentNamePluralNoTooltip] s prosbou, která by dokázala rozpálit krev.\n\n„Ó, [Select_CString(ROOT.Char.IsFemale, 'mocná', 'mocný')] [ROOT.Char.GetTitledFirstNameNoTooltip]!“ spustí. „Jsme jen hrstka ubohých [task_contract_employer.GetFaith.DevoteeNeuterPlural]. [task_contract_councillor_liege.GetCapitalLocation.GetName] je místo, odkud na nás [task_contract_councillor_liege.GetTitledFirstName] dnem i nocí posílá misionáře! Museli jsme uprchnout až sem, protože doma páchá [task_contract_councillor.GetCouncilTitleFirstName] samé zlo! Koho dostane do rukou, toho obrací na svou víru násilím!“\n\nOtrhaní uprchlíci přede mnou zoufale padnou na kolena.\n\n„[task_contract_employer.GetTitledFirstNameNoTooltip] tě žádá a [task_contract_employer.GetFaith.HighGodName] je nám svědkem — zachraň nás!“"
 ep3_contract_event.0082.a: "[task_contract_councillor.GetCouncilTitleFirstNameNoTooltip] s tím bude muset přestat!"
 ep3_contract_event.0082.b: "[task_contract_councillor_liege.GetCapitalLocation.GetNameNoTooltip] je hlavní město. Tam si mě [task_contract_councillor_liege.GetTitledFirstNameNoTooltip] vyslechne."
 ep3_contract_event.0082.to_destination: "Cílem cesty bude [task_contract_destination.GetName]. Tam zastavíš misijní činnost, kterou vede [task_contract_target.GetCouncilTitleFirstName]"
 ep3_contract_event.0082.to_liege: "[task_contract_councillor_liege.GetName] bude cílem tvé cesty. Pokusíš se dosáhnout toho, aby [task_contract_councillor_liege.GetName] [Select_CString(task_contract_councillor_liege.IsFemale, 'ukončila', 'ukončil')] misijní činnost, kterou vede [task_contract_councillor.GetCouncilTitleFirstName]"
 ep3_contract_event.0083.t: "$ep3_contract_event.0082.t$"
 ep3_contract_event.0083.desc: "Dorazíme do [task_contract_destination.GetName]. [task_contract_destination.Custom('GetLocationFaithTemple')|U] stojí přímo před námi. Jakmile dovnitř vstoupí [task_contract_employer.GetName], z hloubi duše se ozve zoufalý výkřik!\n\n„#EMP Všechno je zničeno!#! Podívej: [task_contract_employer.GetFaith.ReligiousSymbol]! A tady: [task_contract_employer.GetFaith.ReligiousSymbol2], zadupáno do země! Nejraději bych [Select_CString(task_contract_employer.IsFemale, 'křičela a odříkávala', 'křičel a odříkával')] [task_contract_employer.GetFaith.ReligiousText] od začátku do konce! Kdo měl tu drzost vyrabovat toto místo a zapálit je? Kdo jiný než [task_contract_councillor.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_councillor.GetTitledFirstName]!“\n\n„Teď už rozumíš, [ROOT.Char.GetTitledFirstNameNoTooltip]!“ [task_contract_employer.GetFirstNameNoTooltip] ukáže prstem. „A [task_contract_employer.GetFaith.ReligiousSymbol3]... podívej, co s tím provedli. Takhle už dál žít nemůžeme!“"
 ep3_contract_event.0083.a: "„Ať [task_contract_councillor.GetNameNoTooltip] zmizí ze scény.“"
 ep3_contract_event.0083.b: "„[task_contract_councillor.GetNameNoTooltip] rozumí jen síle.“"
 ep3_contract_event.0083.c: "„[task_contract_councillor.GetFaith.GetAdjectiveNoTooltip] [task_contract_councillor.GetFaith.PriestNeuter] přece vyslechne rozumné argumenty.“"
 ep3_contract_event.0083.d: "[task_contract_employer.GetFirstNameNoTooltip], uteč! U mě budeš v bezpečí."
 ep3_contract_event.0083.a_win: "[task_contract_councillor.GetCouncilTitleFirstNameNoTooltip] padne do tvých rukou"
 ep3_contract_event.0083.a_lose: "[task_contract_councillor.GetCouncilTitleFirstNameNoTooltip] ti unikne"
 ep3_contract_event.0083.b_win: "[task_contract_councillor.GetCouncilTitleFirstNameNoTooltip] se nechá zastrašit"
 ep3_contract_event.0083.b_lose: "[task_contract_councillor.GetCouncilTitleFirstNameNoTooltip] tvým hrozbám nepodlehne"
 ep3_contract_event.0083.c_win: "[task_contract_councillor.GetCouncilTitleFirstNameNoTooltip] souhlasí s mírovým soužitím"
 ep3_contract_event.0083.c_lose: "[task_contract_councillor.GetCouncilTitleFirstNameNoTooltip] tě v debatě porazí"
 ep3_contract_event.0084.t: "$ep3_contract_event.0082.t$"
 ep3_contract_event.0084.desc: "[task_contract_destination.GetName] je místo, kde po několika zákulisních tazích konečně získám audienci. [task_contract_councillor_liege.GetName] mě přijme.\n\n„[task_contract_councillor_liege.GetTitleAsNameNoTooltip]!“ začnu. „[task_contract_employer.GetTitledFirstName] a [task_contract_employer.GetFaith.GetAdherentNamePlural] ve tvých zemích žádají spravedlnost. [task_contract_councillor.GetCouncilTitleFirstName] [Select_CString(task_contract_councillor.IsFemale, 'spáchala', 'spáchal')] proti jejich společenství odporné činy a zaslouží trest! [task_contract_councillor_liege.GetFaith.HighGodName] přece stojí na straně spravedlnosti, ne?“\n\n[task_contract_councillor_liege.GetTitledFirstNameNoTooltip] se zamračí.\n\n„Nejsem [Select_CString(task_contract_councillor_liege.IsFemale, 'tyranka', 'tyran')]. Tvou žádost vyslechnu celou a teprve potom rozhodnu. [task_contract_councillor.GetCouncilTitleFirstName] i [task_contract_employer.GetFaith.GetAdherentNamePluralNoTooltip] v mém panství poznají můj verdikt.“"
 ep3_contract_event.0084.a: "Ať si [task_contract_employer.GetFaith.GetAdherentNamePluralNoTooltip] vládnou po svém."
 ep3_contract_event.0084.a_win_rights: "[task_contract_employer.GetFirstNameNoTooltip]: [task_contract_destination.GetCounty.GetTitle.GetNameNoTierNoTooltip] a práva na ochranu"
 ep3_contract_event.0084.a_win_rights.tt: "[Concept('obligation','Povinnost')|E]: [GetSubjectContractType('religious_rights').GetObligationName('religious_rights_protected')]"
 ep3_contract_event.0084.a_win: "[task_contract_employer.GetTitledFirstNameNoTooltip] získá titul: [task_contract_destination.GetCounty.GetTitle.GetNameNoTooltip]"
 ep3_contract_event.0084.a_lost: "[task_contract_councillor_liege.GetTitledFirstNameNoTooltip] zůstane [Select_CString(task_contract_councillor_liege.IsFemale, 'nepřesvědčena', 'nepřesvědčen')]"
 ep3_contract_event.0084.b: "Vaše národy se musí naučit žít spolu."
 ep3_contract_event.0084.b_win: "[task_contract_councillor_liege.GetTitledFirstNameNoTooltip] ukončí pokusy o obrácení oblasti: [task_contract_destination.GetCounty.GetTitle.GetNameNoTierNoTooltip]"
 ep3_contract_event.0084.b_lost: "$ep3_contract_event.0084.a_lost$"
 ep3_contract_event.0085.t: "$contract_event_prefix$ $laamp_help_faith_conversion_contract_contract$"
 ep3_contract_event.0085.desc: "[task_contract_destination.GetName] je"
 ep3_contract_event.0085.desc_good: "Od mého příjezdu je tu podivný klid. [task_contract_destination.GetName] působí téměř ospale. [task_contract_councillor_liege.GetName] sem [Select_CString(task_contract_councillor_liege.IsFemale, 'vyslala', 'vyslal')] [task_contract_councillor.GetCouncilTitleFirstName]. Kolem se shromáždil dav a [task_contract_destination.County.GetFaith.GetAdherentNamePlural] pozorně naslouchají.\n\n„Zdravím tě, [Select_CString(ROOT.Char.IsFemale, 'poutnice', 'poutníku')]! Právě jsem se [Select_CString(task_contract_councillor.IsFemale, 'chystala', 'chystal')] přednést svým učedníkům něco z našeho posvátného textu — [task_contract_councillor.GetFaith.ReligiousText].“ [task_contract_councillor.GetFirstNameNoTooltip] ukáže na vesničany. „Možná nám poradíš své oblíbené podobenství?“"
 ep3_contract_event.0085.desc_bad: "[task_contract_destination.Custom('GetLocationFaithTemple')|U] hoří! [task_contract_councillor_liege.GetName] sem [Select_CString(task_contract_councillor_liege.IsFemale, 'vyslala', 'vyslal')] [task_contract_councillor.GetCouncilTitleFirstName], který stojí na okraji všeho toho běsnění. [task_contract_councillor.Custom('WomenMenPeople_GenderPreference')|U] postávají opodál a na hrotech jejich mečů se houpají hlavy místních. [task_contract_destination.County.GetFaith.GetName] byla víra těch mrtvých.\n\n„Ach, právě včas! Ti sedláci odmítali poslouchat naše kazatele, a tak jsme se rozhodli ukázat jim skutečnou moc. [task_contract_councillor.GetFaith.HighGodName] jim dá lekci!“ [task_contract_councillor.GetTitledFirstNameNoTooltip] si to očividně užívá.\n\n„Prosím, smiluj se!“ žadoní přeživší. „Jsme jen [task_contract_destination.County.GetFaith.DevoteeNeuterPlural], prostý lid. Nikomu nechceme ublížit, nechte nás na pokoji!“"
 ep3_contract_event.0085.a: "Tohle je šílenství. [task_contract_councillor.GetTitledFirstNameNoTooltip] musí být zastaven!"
 ep3_contract_event.0085.a_win_critical: "[task_contract_councillor.GetTitledFirstNameNoTooltip] padne do tvých rukou"
 ep3_contract_event.0085.a_win: "Zaženeš všechny misionáře"
 ep3_contract_event.0085.a_lose: "[task_contract_councillor.GetTitledFirstNameNoTooltip] ti unikne a zakázka selže"
 ep3_contract_event.0085.b: "Myslím, že si tuhle misionářskou práci #EMP užiju#!."
 ep3_contract_event.0085.c: "Začnu s dobrými božstvy: [task_contract_councillor.GetFaith.GoodGodNames]."
 ep3_contract_event.0085.c_win: "Podobenství pochopí"
 ep3_contract_event.0085.c_lose: "Smysl příběhu jim unikne"
 ep3_contract_event.0085.d: "Možná je ke světlu přivede strach..."
 ep3_contract_event.0085.d_win: "Podobenství splní svůj účel"
 ep3_contract_event.0085.d_lose: "[task_contract_councillor.GetFaith.EvilGodName] jim zůstane v hlavě víc než ponaučení"
 ep3_contract_event.0090.t: "$contract_event_prefix$ [task_contract_employer.Custom('KnightCulturePluralNoTooltip')] potřebují instruktora"
 ep3_contract_event.0090.desc: "Při příjezdu mě uvítá [task_contract_councillor.GetCouncilTitleFirstName].\n\n„Jsem [Select_CString(task_contract_councillor.IsFemale, 'ráda', 'rád')], že jsi [Select_CString(ROOT.Char.IsFemale, 'dorazila', 'dorazil')]. Potřebujeme někoho, kdo se skutečně vyzná ve válečném umění. Naši velitelé totiž nemají zrovna nejlepší výcvik.“ [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip] sklopí hlavu a rychle dodá: „Tedy... alespoň podle [Select_CString(task_contract_councillor_liege.IsFemale, 'naší lenní paní', 'našeho lenního pána')].“\n\n„[Select_CString(task_contract_councillor.IsFemale, 'Ráda bych tě nejprve pohostila', 'Rád bych tě nejprve pohostil')], ale [Select_CString(task_contract_councillor_liege.IsFemale, 'má lenní paní', 'můj lenní pán')] očekává, že s výcvikem začneš okamžitě. Vyber si, koho chceš, a nech ho vyzbrojit.“"
 ep3_contract_event.0090.a: "Tak mi ukažte, co [task_contract_councillor_liege.Custom('WomenMenPeople_GenderPreference')] umějí!"
 ep3_contract_event.0090.opens_task_contract_train_knight_interaction: "Otevře [Concept('character_interaction','interakci s postavou')|E] $task_contract_train_knight_interaction$"
 ep3_contract_event.0091.t: "$ep3_contract_event.0090.t$"
 ep3_contract_event.0091.desc: "Potřebuji zjistit, co [knight.GetName] skutečně umí, a tak uspořádám cvičný souboj. Na druhé straně bude"
 ep3_contract_event.0091.desc_me: "stát moje maličkost.\n\nZaujmeme postoje a čekáme, kdo jako první odkryje svou obranu."
 ep3_contract_event.0091.desc_me_high_prowess: "[knight.GetFirstNameNoTooltip] udeří jako první. [knight.Custom('signature_weapon')|U] se na mě snese v přívalu ran. Útok mě zaskočí, ale rychle se vzpamatuji a odpovím několika vlastními výpady. [ROOT.Char.Custom('signature_weapon')|U] mi však příliš nepomáhá a [knight.GetFirstNameNoTooltip] mé protiútoky snadno odráží."
 ep3_contract_event.0091.desc_me_low_prowess: "[knight.GetFirstNameNoTooltip] jako první nechá v obraně mezeru. [helper.Custom('signature_weapon')|U] jí několikrát přesně pronikne. Je jasné, že [knight.GetFirstNameNoTooltip] na mě nestačí."
 ep3_contract_event.0091.desc_helper: "[helper.GetName].\n\nOba zaujmou postoje a čekají, kdo jako první odkryje svou obranu."
 ep3_contract_event.0091.desc_high_prowess: "[helper.GetFirstNameNoTooltip] sotva stíhá reagovat, když [knight.GetNameNoTooltip] udeří jako první. [knight.Custom('signature_weapon')|U] zasazuje jednu ránu za druhou. Je naprosto zřejmé, kdo má navrch."
 ep3_contract_event.0091.desc_low_prowess: "[knight.GetFirstNameNoTooltip] jako první poleví v obraně. [helper.Custom('signature_weapon')|U] toho okamžitě využije a několikrát přesně zasáhne. [knight.GetFirstNameNoTooltip] má potíže vůbec zůstat na nohou. Tohle bude nejspíš dlouhá lekce..."
 ep3_contract_event.0091.desc_outro: "\n\nSouboj ukončím dřív, než začne téct krev. „Děkuji za snahu, [knight.GetFirstNameNoTooltip]. Už vím, jak při tvém výcviku postupovat.“"
 ep3_contract_event.0091.a: "Někdo tak schopný by se hodil i mně!"
 ep3_contract_event.0091.b: "Tohle by mělo jít snadno: [trait_to_teach.GetNameNoTooltip( ROOT.Char )]!"
 ep3_contract_event.0091.c: "„[helper.GetFirstNameNoTooltip], [knight.GetFirstNameNoTooltip] potřebuje soukromou lekci. Postarej se o to.“"
 ep3_contract_event.0091.d: "[knight.GetFirstNameNoTooltip] bude prostě napodobovat mé pohyby."
 ep3_contract_event.0091_won: "[knight.GetFirstNameNoTooltip] se od tebe hodně naučí"
 ep3_contract_event.0091_won_helper: "[helper.GetFirstNameNoTooltip] předá [knight.GetFirstNameNoTooltip] mnoho nových znalostí"
 ep3_contract_event.0091_won_trait: "[knight.GetFirstNameNoTooltip] vše pochopí na místě"
 ep3_contract_event.0091_won_recruit: "[knight.GetFirstNameNoTooltip] se chce přidat k tvému táboru"
 ep3_contract_event.0091_lost: "[knight.GetFirstNameNoTooltip] nestačí tempu výcviku"
 ep3_contract_event.0091_lost_recruit: "[knight.GetFirstNameNoTooltip] se odmítne přidat k tvému táboru"
 ep3_contract_event.0100.t: "$contract_event_prefix$ $laamp_help_find_secrets_contract_contract$"
 ep3_contract_event.0100.desc: "Na místě mě má čekat [task_contract_councillor.GetCouncilTitleFirstName], ale když dorazím do [task_contract_destination.GetName], [task_contract_destination.GetHolding.GetType.GetName|l] zeje prázdnotou... nikde ani živáčka.\n\n„Vypadáš zmateně, [Select_CString(ROOT.Char.IsFemale, 'dobrodružko', 'dobrodruhu')],“ ozve se ze stínů šepot. „Opravdu se na tenhle úkol hodíš? Potřebujeme ostražitost, opatrnost, nenápadnost...“\n\nZmateně se rozhlížím. S každým slovem jako by hlas přicházel z jiného směru.\n\n„A tobě zřejmě chybí všechno z toho...“ dodá hlas a za mými zády se objeví [task_contract_councillor.GetNameNoTooltip]."
 ep3_contract_event.0100.a: "Působivé, [task_contract_councillor.GetFirstNameNoTooltip], ale já to zvládnu ještě lépe!"
 adventurer_not_famous_or_patron_trigger_tt: "$adventurer_not_famous_trigger_tt$ nebo [TARGET_CHARACTER.GetShortUIName] musí být [CHARACTER.GetShortUINamePossessive] [Concept('contact_list_contact','patron')|E]"
