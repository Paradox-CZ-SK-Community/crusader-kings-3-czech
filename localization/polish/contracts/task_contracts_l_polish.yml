 msg_peasant_supported.title: "Sedláci povstávají"
 msg_peasant_supported.desc: "[task_contract_taker.GetShortUIName] se [Select_CString(task_contract_taker.Char.IsFemale, 'postavila', 'postavil')] na stranu sedláků"
