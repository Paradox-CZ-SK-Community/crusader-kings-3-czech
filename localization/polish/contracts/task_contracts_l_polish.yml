 any_character_task_contract: "Libovolný případ označený jako [GetPlayer.Custom('GetContractOrIssue')]:"
 has_task_contract_type: "[TASK_CONTRACT_TYPE.GetName]"
 laamp_transport_vip_contract: "Doprovod vyslance"
 laamp_transport_vip_desc_title: "Udatní vojáci štěstěny,"
 laamp_transport_vip_desc: "Vznešený vyslanec postavy [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] potřebuje na cestě ochranu před bandity i nehodami a uvítá pomoc zkušených cestovatelů."
 laamp_transport_ward_contract: "Doprovod svěřence"
 laamp_transport_ward_desc_title: "Spolehliví žoldnéři dobrého jména,"
 laamp_transport_ward_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] odmění každého, kdo bezpečně doprovodí dítě na cestě ke dvoru jeho poručníka."
 laamp_transport_explorer_contract: "Zvídavý cestovatel"
 laamp_transport_explorer_desc_title: "Spolehliví žoldnéři,"
 laamp_transport_explorer_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] se chystá na další výpravu a hledá společnost i ochranu."
 laamp_transport_artifact_contract: "Doručení artefaktu"
 laamp_transport_artifact_desc_title: "Poctiví a zajištění cestovatelé,"
 laamp_transport_artifact_desc: "Cenné dědictví má přejít do nových rukou. [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] potřebuje někoho, kdo zajistí, aby předmět bezpečně dorazil na místo určení."
 laamp_transport_gold_contract: "Zlatý dar"
 laamp_transport_gold_desc_title: "Silní a ostražití,"
 laamp_transport_gold_desc: "Z místa [TaskContract.GetEmployer.GetCurrentLocation.GetNameNoTooltip] má vyrazit důležitý konvoj. [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] nabízí tučnou odměnu každému, kdo jej po cestě ochrání."
 laamp_transport_animal_contract: "Živý dar"
 laamp_transport_animal_desc_title: "Cestovatelé dobrého srdce,"
 laamp_transport_animal_desc: "Vzácný domácí mazlíček postavy [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] potřebuje na cestě ochranu."
 laamp_construction_contract_contract: "Stavební práce"
 laamp_construction_contract_desc_title: "Podnikaví dodavatelé se zkušenostmi,"
 laamp_construction_contract_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] požaduje dokončení stavby, které však dochází materiál. Za obstarání nových stavebních zásob je nabízena štědrá odměna."
 laamp_treasure_hunting_contract_contract: "Honba za pokladem"
 laamp_treasure_hunting_contract_desc_title: "Důvtipní dobrodruzi,"
 laamp_treasure_hunting_contract_desc: "K [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] se donesly zvěsti o bájném pokladu. Nyní hledá schopného dobrodruha, který jejich pravdivost ověří."
 laamp_join_war_contract_contract: "Stůjte při nás"
 laamp_join_war_contract_desc_title: "Tas železo po boku spravedlivých!"
 laamp_join_war_contract_desc: "Válkou zmítané panství [TaskContract.GetEmployer.GetPrimaryTitle.GetBaseNameNoTier] potřebuje vojenskou pomoc po dobu [TaskContract.MakeScope.Var('task_contract_war').War.MakeScope().ScriptValue('task_contract_war_duration_value')] dní."
 laamp_raid_contract_contract: "Nájezd pro zajatce"
 laamp_raid_contract_desc_title: "Nemilosrdní nájezdníci z pohraničí,"
 laamp_raid_contract_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] hledá někoho dost odvážného a schopného, aby při nájezdu zajal oběti živé a vyslal tak nepřátelům jasný vzkaz..."
 laamp_help_claimant_contract_contract: "Prosadit mé nároky"
 laamp_help_claimant_contract_desc_title: "Hledači spravedlivé věci,"
 laamp_help_claimant_contract_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] hledá zastánce legitimních nároků ochotné prosadit oprávněný nárok na titul [TaskContract.MakeScope.Var('task_contract_title').Title.GetName]. V cestě mu stojí [TaskContract.MakeScope.Var('task_contract_target').Char.GetTitledFirstName]."
 laamp_steal_artifact_contract_contract: "Získat artefakt zpět"
 laamp_steal_artifact_contract_desc_title: "Podnikaví darebáci,"
 laamp_steal_artifact_contract_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] odmění každého, kdo získá zpět předmět [TaskContract.MakeScope.Var('task_contract_object').Artifact.GetName], na který má právoplatný nárok."
 laamp_cultural_minority_contract_contract: "Ochrana dědictví"
 laamp_cultural_minority_contract_desc_title: "Vyslyšte naše trápení!"
 laamp_cultural_minority_contract_desc: "[TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] hledá pomoc. [TaskContract.GetEmployer.GetCulture.GetCollectiveNoun] i kdokoli další ochotný hájit jejich práva mají požádat o zastání [TaskContract.GetEmployer.GetLiege.GetName]."
 laamp_religious_minority_contract_contract: "Ochrana věřících"
 laamp_religious_minority_contract_desc_title: "Spravedlnost pod [TaskContract.GetEmployer.GetFaith.PositiveAfterLife]!"
 laamp_religious_minority_contract_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] hledá pomoc. [TaskContract.GetEmployer.GetFaith.GetAdherentNamePlural] i další ochotní sympatizanti mají vyjednat s [TaskContract.GetEmployer.GetLiege.GetName] ochranu svého vyznání."
 laamp_prison_break_contract_contract: "Útěk z vězení"
 laamp_prison_break_contract_desc_title: "Vy, kdo se pohybujete tak volně,"
 laamp_prison_break_contract_desc: "[TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] hledá někoho, kdo umí proklouznout i tam, kam nemá. Někdo z rodiny totiž skončil za mřížemi a čeká na vysvobození."
 laamp_join_faction_contract_contract: "Podpora frakce"
 laamp_join_faction_contract_desc_title: "Odpůrci všeho druhu,"
 laamp_join_faction_contract_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] už má dost vlády postavy [TaskContract.GetTarget.GetName]. Každý, kdo se staví proti [TaskContract.GetTarget.GetTitledFirstNameNoTooltip], je otevřeně vyzýván, aby se přidal k frakci s názvem [TaskContract.MakeScope.Var('task_contract_faction').Faction.GetName]."
 laamp_join_faction_contract_request: "V této [Concept('task_contract','zakázce')|E] se musíš připojit k [Concept('faction','frakci')|E]"
 laamp_help_faith_conversion_contract_contract: "Misionářské povinnosti"
 laamp_help_faith_conversion_contract_desc_title: "Horliví učedníci, které vede [TaskContract.GetEmployer.GetFaith.CreatorName],"
 laamp_help_faith_conversion_contract_desc: "[SelectLocalization(ObjectsEqual(TaskContract.GetEmployer,TaskContract.GetTarget.GetLiege),'laamp_council_task_contract_desc_liege','laamp_council_task_contract_desc_councillor')] šíří poselství, které hlásá [TaskContract.GetEmployer.GetFaith.HighGodName]. Místem této práce je [TaskContract.GetLocation.GetName]. Každý schopný věřící, který propůjčí svůj hlas, je vítán."
 laamp_help_faith_conversion_contract_request: "V této [Concept('task_contract','zakázce')|E] musíš [Concept('travel','odcestovat')|E] do [Concept('county','hrabství')|E], kde právě probíhá [Concept('convert_county','obracení hrabství na víru')|E]"
 laamp_fight_faith_conversion_contract_contract: "Umlčet misionáře"
 laamp_fight_faith_conversion_contract_desc_title: "Věřící jsou v ohrožení!"
 laamp_fight_faith_conversion_contract_desc: "[TaskContract.MakeScope.Var('task_contract_councillor').Char.GetFaith.GetNameNoTooltip] sem vysílá misionáře, kteří sužují místní komunity. Jejich vyznáním je [TaskContract.GetEmployer.GetFaith.GetNameNoTooltip]. Hledáme schopného vyjednavače nebo někoho dost hrozivého, aby se s těmito bezvěrci vypořádal."
 laamp_fight_faith_conversion_contract_request: "V této [Concept('task_contract','zakázce')|E] musíš [Concept('travel','odcestovat')|E] do [Concept('county','hrabství')|E], kde právě probíhá [Concept('convert_county','obracení hrabství na víru')|E], nebo za [Concept('liege','lenním pánem')|E] [Concept('realm_priest_possessive','vrchního duchovního')|E]"
 laamp_help_train_commanders_contract_contract: "Výcvik rytířů"
 laamp_help_train_commanders_contract_desc_title: "Ostřílení veteráni,"
 laamp_help_train_commanders_contract_desc: "[SelectLocalization(ObjectsEqual(TaskContract.GetEmployer,TaskContract.GetTarget.GetLiege),'laamp_council_task_contract_desc_liege','laamp_council_task_contract_desc_councillor')] chce zachovat bojovou připravenost těch, kdo slouží postavě [TaskContract.GetEmployer.GetTitledFirstName] jako [TaskContract.GetEmployer.Custom('KnightCulturePluralNoTooltip')|l]. Hledá se někdo se zkušenostmi s velením nebo šermem, kdo své znalosti předá dál."
 laamp_help_train_commanders_contract_request: "V této [Concept('task_contract','zakázce')|E] musíš použít $task_contract_train_knight_interaction$ [Concept('character_interaction','interakci s postavou')|E] na [Concept('knights','rytíře')|E], kteří slouží [Concept('contractor_possessive','zadavateli')|E]"
 task_contract_train_knight_interaction: "Cvičit rytíře"
 task_contract_train_knight_interaction_desc: "Během výcviku mohou [recipient.Custom('KnightCulturePlural')] ve službách postavy [recipient.GetFirstName] zvýšit [Concept('prowess','Udatnost')|E] nebo získat [Concept('commander_trait','velitelský rys')|E]"
 recipient_secondary_task_contract_train_knight_interaction: "Cíl výcviku"
 task_contract_train_knight_interaction.tt: "Má šanci zvýšit [Concept('prowess','Udatnost')|E] nebo získat [Concept('commander_trait','velitelský rys')|E]"
 laamp_help_find_secrets_contract_contract: "Oči ve stínech"
 laamp_help_find_secrets_contract_desc_title: "Psst!"
 laamp_help_find_secrets_contract_desc: "Je potřeba bystrý pozorovatel a jeho působištěm bude [TaskContract.GetLocation.GetName]. [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] chce mít přehled o sousedech a jejich činech. Je jen [Select_CString(TaskContract.GetEmployer.IsFemale, 'zvědavá', 'zvědavý')]... nic víc vědět nepotřebujete."
 laamp_help_find_secrets_contract_request: "V této [Concept('task_contract','zakázce')|E] musíš dokončit [Concept('scheme','intriku')|E] [GetScheme('laamp_help_find_secrets_scheme').GetTypeName]"
 laamp_help_fabricate_claim_contract_contract: "Zapomenuté nároky"
 laamp_help_fabricate_claim_contract_desc_title: "Učení znalci,"
 laamp_help_fabricate_claim_contract_desc: "$laamp_council_task_contract_desc_liege$ tvrdí, že [TaskContract.MakeScope.Var('task_contract_destination').Province.GetName] právoplatně patří právě [Select_CString(TaskContract.GetEmployer.IsFemale, 'jí', 'jemu')]. Důkaz se však prý jen někam zatoulal! Obnovte tato dávná práva a odměnou vám bude nehynoucí vděk."
 laamp_council_task_contract_desc_liege: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip]"
 laamp_council_task_contract_desc_councillor: "[Select_CString(TaskContract.GetTarget.IsFemale, 'Má lenní paní', 'Můj lenní pán')] [TaskContract.GetTarget.GetName]"
 laamp_help_fabricate_claim_contract_request: "V této [Concept('task_contract','zakázce')|E] musíš dokončit [Concept('scheme','intriku')|E] [GetScheme('generate_claim').GetTypeName]"
 laamp_help_increase_control_contract_contract: "Boj s korupcí"
 laamp_help_increase_control_contract_desc_title: "Vy, kdo umíte zacházet s kyjem,"
 laamp_help_increase_control_contract_desc: "[TaskContract.GetTarget.GetPrimaryTitle.GetNameNoTierNoTooltip] prochází těžkými časy. Řádí tam bandité, úředníci ždímají lidi lichvou a rolníci propadají panice. Každý, kdo je všechny dokáže udržet na uzdě, bude odměněn."
 laamp_help_increase_control_contract_request: "V této [Concept('task_contract','zakázce')|E] musíš [Concept('travel','odcestovat')|E] do [Concept('counties','hrabství')|E] [Concept('contractor_possessive','zadavatele')|E] s nízkou [Concept('county_control','kontrolou hrabství')|E]"
 laamp_transport_contract.transport_failed: "Zakázka selhala"
 laamp_transport_contract.success: "Zakázka dokončena"
 laamp_transport_contract.success_late: "Zakázka dokončena se zpožděním"
 laamp_transport_contract.contract_completion_limit: "Vypršel čas na dokončení zakázky"
 complete_task_contract_interaction: "Cestovat za dokončením zakázky"
 complete_task_contract: "Cestovat za dokončením zakázky"
 with_domicile: "Cestovat s táborem"
 without_domicile: "Cestovat bez tábora"
 contract_event_prefix: "Zakázka:"
 ep3_contract_event.0001.t: "Přepravní zakázka:"
 ep3_contract_event.0001.t_vip: "$ep3_contract_event.0001.t$ $laamp_transport_vip_contract$"
 ep3_contract_event.0001.t_child: "$ep3_contract_event.0001.t$ $laamp_transport_ward_contract$"
 ep3_contract_event.0001.t_explorer: "$ep3_contract_event.0001.t$ $laamp_transport_explorer_contract$"
 ep3_contract_event.0001.t_artifact: "$ep3_contract_event.0001.t$ $laamp_transport_artifact_contract$"
 ep3_contract_event.0001.t_gold: "$ep3_contract_event.0001.t$ $laamp_transport_gold_contract$"
 ep3_contract_event.0001.t_animal: "$ep3_contract_event.0001.t$ $laamp_transport_animal_contract$"
 ep3_contract_event.0001.t_construction: "$ep3_contract_event.0001.t$ $laamp_construction_contract_contract$"
 ep3_contract_event.0001.desc: "[task_contract_employer.GetName] ke mně vysílá delegaci, která nenuceně projde plachtami mého velkého stanu.\n\n„Buďte [Select_CString(ROOT.Char.IsFemale, 'zdráva, dobrodružko', 'zdráv, dobrodruhu')]!“ ujme se slova vyslanec. „Cest na tomto světě je mnoho a nebezpečí na nich ještě víc. Pokud přijmete tuto práci, [Select_CString(task_contract_employer.IsFemale, 'má paní', 'můj pán')] vám za vaše zkušenosti dobře zaplatí.“\n\n"
 ep3_contract_event.0001.desc_intro_explorer: "Před stanem zůstane funět obtížená mula a [task_contract_employer.GetName] je mezitím [Select_CString(task_contract_employer.IsFemale, 'uvedena', 'uveden')] dovnitř.\n\n„Zdravím! Říká se, že jste [Select_CString(ROOT.Char.IsFemale, 'žena protřelá', 'muž protřelý')] světem. Máte snad dost odvahy vydat se daleko po boku věčně [Select_CString(task_contract_employer.IsFemale, 'zvídavé dobrodružky', 'zvídavého dobrodruha')], jako jsem já?“\n\n"
 ep3_contract_event.0001.desc_vip: "„Já, [task_contract_object.GetName], jsem nejvěrnější [Select_CString(task_contract_object.IsFemale, 'služebnice', 'služebník')] postavy [task_contract_employer.GetTitleAsNameNoTooltip]. Musím doručit [Select_CString(task_contract_employer.IsFemale, 'její', 'jeho')] poselství. Mým cílem je [task_contract_destination.GetTitle.GetNameNoTier], kde sídlí [task_contract_target.GetTitledFirstName]. Doprovodíte mě, ochráníte mě a zajistíte, aby má zpráva nepadla do rukou zvědavců!“"
 ep3_contract_event.0001.desc_artifact: "„[task_contract_employer.GetTitledFirstName] vám svěří vzácný artefakt [escorted_artifact.GetName]. Cílem je [task_contract_destination.GetTitle.GetName], kde sídlí [task_contract_target.GetTitledFirstName]. Má posloužit jako knížecí dar. A mějte se na pozoru! Kdyby tento posvátný poklad nedorazil na místo určení, následky by byly strašlivé.“"
 ep3_contract_event.0001.desc_child: "„[task_contract_object.Custom2('MyCharacterIntroduction', task_contract_employer)|U] musí být v bezpečí!“ zněl příkaz postavy [task_contract_employer.GetTitleAsNameNoTooltip]. Dítě čeká výjimečné vzdělání. Jeho cílem je [task_contract_destination.GetTitle.GetNameNoTier], kde už čeká [Select_CString(task_contract_target.IsFemale, 'moudrá', 'moudrý')] [task_contract_target.GetTitledFirstName]. Držte dítě stále nablízku. Jeho osud může výrazně ovlivnit budoucnost panství [task_contract_employer.GetPrimaryTitle.GetNameNoTierNoTooltip]!“"
 ep3_contract_event.0001.desc_gold: "„Vezeme s sebou mohutnou truhlu plnou šperků, voňavek a drahých kovů. Dopravíte ji na místo [task_contract_destination.GetTitle.GetNameNoTier] a tam ji s náležitou okázalostí odevzdáte. Sídlí tam [task_contract_target.GetTitledFirstName]. Tak štědrý dar vytvoří dluh, na který jen tak nezapomene. Truhlu proto musíte bedlivě střežit.“"
 ep3_contract_event.0001.desc_explorer: "Prosím, vezměte mě na místo [task_contract_destination.GetTitle.GetName]. Chraňte mě po cestě a já se vám štědře odměním!“"
 ep3_contract_event.0001.desc_explorer_intro: "„[Select_CString(task_contract_employer.IsFemale, 'Slyšela', 'Slyšel')] jsem, že [task_contract_destination.GetHolding.GetSpecialBuildingType.GetName]"
 ep3_contract_event.0001.desc_capitals: "„Pocestní tvrdí, že [task_contract_destination.GetCounty.GetTitle.GetHolder.GetPrimaryTitle.GetDefinitiveName] má velkolepé a překrásné hlavní město, možná nejkrásnější v celém okolí.“"
 ep3_contract_event.0001.desc_special_buildings_martial: "$ep3_contract_event.0001.desc_explorer_intro$ patří k nejpůsobivějším připomínkám dávné válečné slávy.“"
 ep3_contract_event.0001.desc_special_buildings_learning: "$ep3_contract_event.0001.desc_explorer_intro$ patří k nejvýznamnějším střediskům učenosti a pokladnicím vědění.“"
 ep3_contract_event.0001.desc_special_buildings_religious: "$ep3_contract_event.0001.desc_explorer_intro$ patří k těm vzácným místům, kde návštěvník skutečně pocítí přítomnost božského.“"
 ep3_contract_event.0001.desc_special_buildings_diplomatic: "$ep3_contract_event.0001.desc_explorer_intro$ je místem opředeným příběhy o moci a člověk k němu musí přistupovat s úctou a náležitou důstojností.“"
 ep3_contract_event.0001.desc_special_buildings_economic: "$ep3_contract_event.0001.desc_explorer_intro$ je zdrojem nesmírného bohatství a znají ho kupci ze všech koutů světa.“"
 ep3_contract_event.0001.desc_grand_city: "„Chci navštívit velké město, skutečný městský ráj plný hrdých obyvatel, širokých ulic a rušných tržišť.“"
 ep3_contract_event.0001.desc_special_buildings_wonder: "$ep3_contract_event.0001.desc_explorer_intro$ patří mezi skutečné divy. Někteří o něm dokonce mluví jako o něčem kouzelném.“"
 ep3_contract_event.0001.desc_mausoleum_at_halicarnassus: "„Říká se, že $TRAVEL_POINT_OF_INTEREST_TT_poi_mausoleum_at_halicarnassus$ je monumentálním pomníkem jednoho z dávných vládců, jakému se v naší době nic nevyrovná...“"
 ep3_contract_event.0001.desc_lighthouse_of_alexandria: "„Žádný maják nehledí na Středozemní moře hrději než $TRAVEL_POINT_OF_INTEREST_TT_poi_lighthouse_of_alexandria$. Chci jeho vznešenou záři spatřit na vlastní oči.“"
 ep3_contract_event.0001.desc_natural_feature: "$ep3_contract_event.0001.desc_explorer_intro$ patří mezi nejúchvatnější výtvory tohoto světa. Při pohledu na něj se mi okamžitě vybaví [task_contract_employer.GetFaith.HighGodName]. Prý je to skutečně dechberoucí podívaná.“"
 ep3_contract_event.0001.desc_animal: "„[task_contract_target.GetTitledFirstName] si zvíře jménem [task_contract_employer.Custom('CatOrDogStoryName')], miláčka postavy [task_contract_employer.GetTitleAsNameNoTooltip], naprosto [Select_CString(task_contract_target.IsFemale, 'zamilovala', 'zamiloval')]. [task_contract_employer.GetTitledFirstName] proto velkoryse souhlasí, že zvíře pošle na místo [task_contract_destination.GetTitle.GetNameNoTier]. Mohu vám svěřit bezpečí miláčka jménem [task_contract_employer.Custom('CatOrDogStoryName')]?“"
 ep3_contract_event.0001.desc_construction: "„[task_contract_employer.GetTitledFirstName] nechává na místě [task_contract_destination.GetTitle.GetNameNoTier] vybudovat nové sídlo. Má tam vzniknout [task_contract_destination.GetHolding.GetConstructingHoldingType.GetName], ale stavba potřebuje další dřevo a kámen. Jakmile dorazíte na staveniště, můžeme se dohodnout na dalších povinnostech.“"
 ep3_contract_event.0001.vip: "[task_contract_object.GetTitledFirstNameNoTooltip] dorazí bezpečně a bez zbytečných průtahů!"
 ep3_contract_event.0001.child: "[task_contract_object.GetNameNoTooltip] bude v dobrých rukou."
 ep3_contract_event.0001.explorer: "[task_contract_destination.GetNameNoTooltip]! To bude podívaná! Vyrážíme!"
 ep3_contract_event.0001.artifact: "O artefakt se dobře postarám."
 ep3_contract_event.0001.gold: "Truhlu budu mít po celou cestu na očích."
 ep3_contract_event.0001.animal: "[task_contract_employer.Custom('CatOrDogStoryName')] bude cestovat na saténovém polštáři."
 ep3_contract_event.0001.construction: "Materiál doručím bez prodlení."
 ep3_contract_event.0001.with_domicile: "Celý můj tábor se přesune na místo [task_contract_destination.GetNameNoTooltip]."
 ep3_contract_event.0001.with_domicile.tt: "Přesun tvého [Concept('camp','tábora')|E] na místo [task_contract_destination.GetNameNoTooltip] bude stát [provisions_i][Concept('provisions','zásoby')|E]"
 ep3_contract_event.0001.invalidate: "Tuhle zakázku nechci."
 ep3_contract_event.0001.tt_vip: "[Concept('travel','Odcestuješ')|E] na místo [task_contract_destination.GetName] a doprovodíš [task_contract_object.GetName] ke [Concept('court','dvoru')|E], kde sídlí [task_contract_target.GetName]"
 ep3_contract_event.0001.tt_ward: "[Concept('travel','Odcestuješ')|E] na místo [task_contract_destination.GetName] a zajistíš, aby tam [task_contract_object.GetName] [Select_CString(task_contract_object.IsFemale, 'zahájila', 'zahájil')] své vzdělávání"
 ep3_contract_event.0001.tt_explorer: "[Concept('travel','Odcestuješ')|E] na místo [task_contract_destination.GetName] společně s cestovatelem [task_contract_object.GetName]"
 ep3_contract_event.0001.tt_gold: "[Concept('travel','Odcestuješ')|E] na místo [task_contract_destination.GetName] a doručíš dar, který posílá [task_contract_employer.GetName], kde ho obdrží [task_contract_target.GetName]"
 ep3_contract_event.0001.tt_animal: "[Concept('travel','Odcestuješ')|E] za postavou [task_contract_target.GetName]. Při cestě bude tvým úkolem chránit zvíře jménem [task_contract_employer.Custom('CatOrDogStoryName')]"
 ep3_contract_event.0001.tt_artifact: "[Concept('travel','Odcestuješ')|E] na místo [task_contract_destination.GetName] s artefaktem [escorted_artifact.GetNameNoTooltip], který posílá [task_contract_employer.GetName], kde ho obdrží [task_contract_target.GetName]"
 ep3_contract_event.0001.tt_construction: "[Concept('travel','Odcestuješ')|E] na místo [task_contract_destination.GetName] a předáš stavební materiál zadavateli [task_contract_employer.GetName]"
 ep3_contract_event.0001.tt_increase_control: "[Concept('travel','Odcestuješ')|E] do [task_contract_councillor_liege.GetPrimaryTitle.GetAdjective] [Concept('county','hrabství')|E], kde je [Concept('county_corruption','korupce hrabství')|E] nebo nízká [Concept('county_control','kontrola hrabství')|E]"
 ep3_contract_event.0003.t: "$contract_event_prefix$ Nájezd pro zajatce"
 ep3_contract_event.0003.desc: "$ep3_contract_event.0001.desc$„[Select_CString(task_contract_employer.IsFemale, 'Má paní', 'Můj pán')] má zapřisáhlého nepřítele. Je jím [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.GetName], [Select_CString(task_contract_target.IsFemale, 'která', 'který')] v poslední době působí samé potíže. Bylo by dobré srazit [Select_CString(task_contract_target.IsFemale, 'jí', 'mu')] hřebínek a zajmout několik [Select_CString(task_contract_target.IsFemale, 'jejích', 'jeho')] mužů.“"
 ep3_contract_event.0003.a: "Vztyčit prapory! Vyrážíme okamžitě!"
 ep3_contract_event.0003.b: "$ep3_contract_event.0001.invalidate$"
 ep3_contract_event.0004.opening: "[task_contract_employer.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 ep3_contract_event.0004.opening_failure: "[task_contract_employer.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 ep3_contract_event.0004.desc: "Tvého odhodlaného nasazení v mé válce si velmi cením! Užij si zasloužené zlato, [Select_CString(ROOT.Char.IsFemale, 'dobrá ženo', 'dobrý muži')]!"
 ep3_contract_event.0004.desc_failure: "Tvá válečnická pověst byla značně přehnaná. [Select_CString(ROOT.Char.IsFemale, 'Porušila', 'Porušil')] jsi smlouvu, kterou jsme uzavřeli — styď se!"
 ep3_contract_event.0004.a: "Raději se nebudu ptát, co s nimi [task_contract_employer.GetFirstNameNoTooltip] udělá."
 ep3_contract_event.0004.b: "Jen jsem [Select_CString(ROOT.Char.IsFemale, 'neměla', 'neměl')] štěstí..."
 ep3_contract_event.0004.success: "[task_contract_employer.GetName]: Zajatci byli dopraveni do [Concept('prison','vězení')|E]:"
 ep3_contract_event.0005.t: "$contract_event_prefix$ $laamp_treasure_hunting_contract_contract$"
 ep3_contract_event.0005.desc: "$ep3_contract_event.0001.desc$„[task_contract_employer.GetNameNoTooltip] má velkolepou představu o sbírce řemeslných výrobků z exotických krajů. Povinnosti však nepočkají, a tak ti nabízí příležitost vydat se do světa a najít vhodný artefakt do této sbírky.“"
 ep3_contract_event.0005.a: "Raději už vyberu, kam se vydat!"
 ep3_contract_event.0005.a_tt: "Otevře $treasure_hunting_contract_decision$ [Concept('decision','rozhodnutí')|E]"
 ep3_contract_event.0005.b: "$ep3_contract_event.0001.invalidate$"
 ep3_contract_event.0006.t: "$ep3_contract_event.0005.t$"
 ep3_contract_event.0006.desc: "[task_contract_destination.GetName] je konečně přede mnou. Nejdřív mé kroky vedou tam, kde působí [task_contract_destination.Custom('GetGuildType')], a pátrám po jakékoli zmínce o místních kuriozitách... ale bez úspěchu. Nakonec zamířím jinam."
 ep3_contract_event.0006.desc_locals: "Zastavím se v krčmě, kde zaslechnu zajímavý rozhovor dvou místních.\n\n„Říkám ti, [local_2.GetFirstName], [newly_created_artifact.GetName] je ukrytý někde tady! Přímo v našem kraji, kde převládá [task_contract_destination.GetTerrain.GetNameNoTooltip|l]! A já vím kde!“ šeptá [local_1.GetFirstNameNoTooltip].\n\n„Pššt, [local_1.GetFirstName]. Někdo nás sleduje...“ sykne [local_2.GetFirstNameNoTooltip] a kývne mým směrem."
 ep3_contract_event.0006.desc_locals_temple: "Další zastávkou je [task_contract_destination.Custom('GetLocationFaithTemple')].\n\n„Vítej, [Select_CString(ROOT.Char.IsFemale, 'poutnice', 'poutníku')]!“ pozdraví mě místní [local_1.GetFaith.PriestNeuter]. „Doslechlo se ke mně, že hledáš světské poklady. Ten předmět, který hledáš, je [newly_created_artifact.GetName]. Možná ti o něm něco povím.“\n\n„Ale nejdřív musíš dokázat, že [local_1.GetFaith.WealthGodName] ti přeje...“"
 ep3_contract_event.0006.desc_locals_city: "Další zastávkou je tržiště, kde mě hned u vchodu odchytí podomní obchodník.\n\n„Zdravím tě, [Select_CString(ROOT.Char.IsFemale, 'poutnice', 'poutníku')]! Inu, vypadáš jako [Select_CString(ROOT.Char.IsFemale, 'zkušená obchodnice', 'zkušený obchodník')]. Náhodou mám všechno, co potřebuješ, od hlavy až k patě, od zadku až po loket! A mám i něco výjimečného... [newly_created_artifact.GetName]. Co na to říkáš?“"
 ep3_contract_event.0006.desc_locals_castle: "Zamířím k místním branám, za nimiž se rozkládá [task_contract_destination.GetHolding.GetType.GetName|l], a všimnu si dvojice místních.\n\n„Nelžu ti, [local_2.GetFirstName]! Rod [local_ruler.GetDynastyHouseName] ho získal — [newly_created_artifact.GetName]! Právě jsem [Select_CString(local_1.IsFemale, 'viděla', 'viděl')], jak s tím mizí uvnitř. [local_ruler.Custom('ResidenceBuilding')|U] je hned za těmi branami,“ vykládá [local_1.GetFirstNameNoTooltip].\n\n„Nebude to snadné, [local_1.GetFirstName]... ale možná bychom to #EMP my#! mohli získat,“ odpoví [local_2.GetFirstNameNoTooltip] a v očích se zableskne."
 ep3_contract_event.0006.castle: "„Promiňte, ale možná bychom mohli spojit síly?“"
 ep3_contract_event.0006.castle_won: "Předmět úspěšně získáš"
 ep3_contract_event.0006.castle_lost_desc: "[local_1.GetTitledFirstNameNoTooltip] tě obelstí a zmizí. [newly_created_artifact.GetNameNoTooltip] je pryč také"
 ep3_contract_event.0006.castle_lost: "[local_1.GetShortUIName] získá artefakt"
 ep3_contract_event.0006.church: "„Jsem toho [Select_CString(ROOT.Char.IsFemale, 'hodna', 'hoden')], dokážu to!“"
 ep3_contract_event.0006.church_won: "Prokážeš svou horlivost a předmět získáš"
 ep3_contract_event.0006.church_lost_desc: "[local_1.GetTitledFirstNameNoTooltip] pochybuje o tvé zbožnosti"
 ep3_contract_event.0006.church_lost: "Neprokážeš dostatečnou zbožnost"
 ep3_contract_event.0006.city: "„Sniž cenu a máme dohodu!“"
 ep3_contract_event.0006.city_won: "[local_1.GetShortUIName] souhlasí s nižší cenou"
 ep3_contract_event.0006.city_lost_desc: "[local_1.GetTitledFirstNameNoTooltip] už ti předmět nechce prodat"
 ep3_contract_event.0006.city_lost: "[local_1.GetShortUIName] nabídku odmítne"
 ep3_contract_event.0006.buy: "„Zaplatím, a dobře!“"
 ep3_contract_event.0006.buy_won: "Učiníš přesvědčivou nabídku a předmět koupíš"
 ep3_contract_event.0006.buy_lost_desc: "$ep3_contract_event.0006.city_lost_desc$"
 ep3_contract_event.0006.buy_lost: "$ep3_contract_event.0006.city_lost$"
 ep3_contract_event.0006.intimidate: "„Dej mi to, #EMP HNED!#!“"
 ep3_contract_event.0006.intimidate_won: "[local_1.GetTitledFirstNameNoTooltip] se zalekne a předmět ti vydá"
 ep3_contract_event.0006.intimidate_lost_desc: "[local_1.GetTitledFirstNameNoTooltip] si artefakt ponechá"
 ep3_contract_event.0006.intimidate_lost: "[local_1.GetShortUIName] z tebe strach nemá"
 ep3_contract_event.0006.library: "Podívám se jinde. Něco tu přece být musí!"
 ep3_contract_event.0006.library_won: "Pokusíš se najít jiný artefakt"
 ep3_contract_event.0006.library_lost_desc: "Nenajdeš nic užitečného a odejdeš s prázdnou."
 ep3_contract_event.0006.library_lost: "Odejdeš s prázdnou"
 ep3_contract_event.0006.library.tt: "Staneš se majitelem jiného [Concept('artifact','artefaktu')|E]"
 ep3_contract_event.0006.explore: "[Select_CString(ROOT.Char.IsFemale, 'Sama', 'Sám')] si poradím lépe. Alespoň teď vím, že se tu poklady opravdu dají najít."
 ep3_contract_event.0006.explore_won: "$ep3_contract_event.0006.library_won$"
 ep3_contract_event.0006.explore_lost_desc: "Na vlastní pěst nenajdeš po žádných artefaktech ani stopu a odejdeš s prázdnou"
 ep3_contract_event.0006.explore_lost: "Nic nenajdeš"
 ep3_contract_event.0006.explore.tt: "$ep3_contract_event.0006.library.tt$"
 ep3_contract_event.0007.t: "$ep3_contract_event.0005.t$"
 ep3_contract_event.0007.desc_castle_castle: "Udeříme o půlnoci. Pod černočernou noční oblohou nepozorovaně pronikneme do [task_contract_destination.GetHolding.GetType.GetName|l]. Díky vedení [local_1.GetFirstName] rychle najdeme [newly_created_artifact.GetName]. Jenže cestou ven nás zahlédnou stráže! Popadnu artefakt a dám se na útěk, zatímco se ze všech stran vyhrnou ozbrojenci. Od ostatních se v nastalém zmatku oddělím.\n\nPo dlouhé honičce se ukryji ve stínu za hradbami. Z dálky zaslechnu udýchaný hlas [local_2.GetFirstName]:\n\n„[Select_CString(ROOT.Char.IsFemale, 'Ukradla nám, co nám po právu patřilo. Ta ďáblice!', 'Ukradl nám, co nám po právu patřilo. Ten ďábel!')]“"
 ep3_contract_event.0007.desc_church_church: "Padnu na kolena a začnu odříkávat verše z [local_1.GetFaith.ReligiousText].\n\n„[Select_CString(local_1.IsFemale, 'Viděla jsem a slyšela', 'Viděl jsem a slyšel')] dost. [local_1.GetFaith.HighGodName] má v tobě [Select_CString(ROOT.Char.IsFemale, 'oddanou ženu', 'oddaného muže')]!“ [local_1.GetName] mě chválí s neskrývaným úžasem. „Už nemusíš dál hledat. Svěřuji ti [newly_created_artifact.GetName]. Dobře se o něj starej. Není to jen můj dar. [local_1.GetFaith.HighGodName] ti ho svěřuje také!“"
 ep3_contract_event.0007.desc_city_city: "„Tvé ceny jsou vysoké... a já jsem jen [Select_CString(ROOT.Char.IsFemale, 'chudá poutnice', 'chudý poutník')],“ pokouším se smlouvat. „Musím platit svým mužům a živit naše koně. Tohle je všechno, co si mohu dovolit. Dohodneme se?“\n\n[local_1.GetFirstName] mi očividně nevěří, ale ve smlouvání se vyzná a rychle přijde s protinabídkou. „Dobrá, tolik mi bude stačit. Ale nejdřív ti musím něco ukázat.“ [local_1.GetFirstNameNoTooltip] vytáhne [newly_created_artifact.GetName]. „Jen se podívej na tu #EMP nádheru!#! Nabídka platí jen teď a jen pro tebe. Obojí ti prodám za rozumnou cenu!“"
 ep3_contract_event.0007.desc_castle_buy: "[local_1.GetFirstName] a [local_2.GetFirstName] se chvíli dohadují mezi sebou.\n\n„Podstupujeme velké riziko... ale tvá nabídka je štědrá. Kořist může být tvoje, #EMP pokud#! se nám ji podaří získat.“\n\nTé noci dorazím na smluvené místo před hradem a za hradbou zaslechnu pořádný povyk. [local_1.GetFirstNameNoTooltip] a [local_2.GetFirstNameNoTooltip] právě slézají po kamenech nade mnou.\n\n„Utíkej! Máme společnost!“ vykřikne [local_1.GetFirstNameNoTooltip], když mě míjí. Rozběhneme se do krajiny, kde převládá [task_contract_destination.GetTerrain.GetName|l], a nezastavíme, dokud nejsme v bezpečí.\n\n„Myslím, že nám teď dlužíš dvojnásobek,“ pronese [local_2.GetFirstNameNoTooltip] a stále popadá dech."
 ep3_contract_event.0007.desc_city_buy: "„To je ale štědrá nabídka! Prosím, vezmi si [newly_created_artifact.GetName]! Radost s tebou obchodovat!“ Má nabídka [local_1.GetFirstName] očividně ohromí.\n\nMožná jsem [Select_CString(ROOT.Char.IsFemale, 'mohla', 'mohl')] usmlouvat lepší cenu...? Příště si musím dát víc času..."
 ep3_contract_event.0007.desc_church_buy: "„[ROOT.Char.GetFaith.HighGodName] je můj jediný soudce!“ vykřiknu a rázně se ohradím proti slovům [local_1.GetFaith.PriestNeuter]. „Ale mohu ti nabídnout okamžité dobrodiní: mince!“\n\n„Ty se mě opravdu pokoušíš podplatit...?“ odpoví pohoršeně [local_1.GetFirstName]. Pohled však stále déle ulpívá na měšci stříbra a pokušení sílí.\n\n„Střechu [task_contract_destination.Custom('GetLocationFaithTemple')] #EMP opravdu#! musíme opravit. Vezmi si [newly_created_artifact.GetName] a o naší dohodě nikdy nemluv!“"
 ep3_contract_event.0007.desc_castle_intimidate: "„Za koho se vůbec považuješ?“ ušklíbne se sebejistě [local_1.GetFirstName]. „Je nás na tebe dvakrát tolik!“\n\n„Opravdu?“ odpovím a pokynu svým mužům, aby je obklíčili. „Takže prosím... obstarejte mi [newly_created_artifact.GetName].“\n\nNásledující noc se setkáme znovu. [local_1.GetFirstNameNoTooltip] a [local_2.GetFirstName] vypadají unaveně a zdrceně.\n\n„Málem nás tam chytili. Doufám, že ti ten artefakt za to stojí!“ pronese jeden z nich a s bolestnou grimasou mi předá kořist."
 ep3_contract_event.0007.desc_city_intimidate: "Pokynu svým následovníkům, aby vtrhli do krámku, kde osamělou obsluhu rychle přemůžeme.\n\n„Prosím, já tu jen pracuji! Musím živit rodinu a tenhle krám je všechno, co mám!“ žadoní [local_1.GetFirstName].\n\n„[follower.GetFirstName], ukaž, že si nehrajeme!“ poručím vybranému hromotlukovi. [follower.GetFirstNameNoTooltip] se natáhne k vratké polici přeplněné křehkým zbožím. Právě když se ji chystá převrhnout, [local_1.GetFirstNameNoTooltip] se vrhne do cesty.\n\n„Prosím, dost! Vezměte si, co chcete, a odejděte!“"
 ep3_contract_event.0007.desc_church_intimidate: "„[follower.GetFirstName]! Tady máme někoho tvrdohlavého!“ zavolám na své následovníky. Ti se nahrnou do [task_contract_destination.Custom('GetLocationFaithTemple')].\n\n„Prosím, mějte trochu úcty! Držte se zpátky!“ žadoní [local_1.GetFirstName]. Je však příliš pozdě. Moji společníci se utrhnou ze řetězu, popadají obětiny a už už se chystají krást a ničit všechno, co jim přijde pod ruku. [local_1.GetNameNoTooltip] pochopí, že proti takové přesile nic nezmůže, a ustoupí.\n\n„Dobrá, dobrá! Vezměte si [newly_created_artifact.GetName], vy bezvěrci! Jen ušetřete toto posvátné místo.“"
 ep3_contract_event.0007.desc_library: "„Děkuji za nabídku, ale nevíš náhodou o nějakém opuštěném sídle nebo nepoužívané pevnosti...?“ zeptám se. Po chvíli přemlouvání mi [local_1.GetFirstName] neochotně ukáže cestu ke zpustlému sídlu.\n\nJakmile vstoupím dovnitř, ohromí mě množství starých svazků rozházených po místnostech plných pavučin. Celou noc se jimi probírám. Nakonec hluboko ve sklepě objevím ručně kreslenou mapu. Nedaleké místo na ní označuje „X“!\n\nSe svými muži tam dorazím za úsvitu. Stačí několik záběrů lopatou a [follower.GetFirstName] mě zavolá k sobě.\n\n„Truhla! Je plná mincí! A co je tohle? Vzkaz tvrdí, že se tomu říká „[newly_created_artifact.GetName]“.“"
 ep3_contract_event.0007.desc_explore: "Místo abych [Select_CString(ROOT.Char.IsFemale, 'spoléhala', 'spoléhal')] na upovídanou osobu jménem [local_1.GetFirstName] a pochybné zvěsti, vrátím se k budově, která vypadala opuštěně.\n\nNejdřív se prosečeme zarostlou zahradou, potom přetrpíme plesnivý zápach uvnitř. Alespoň máme jistotu, že je místo opuštěné. Abychom vše prohledali co nejrychleji, moji společníci se rozdělí. Po nějaké době mě [follower.GetFirstName] zavolá do hlavní ložnice:\n\n„Tohle bylo pod postelí,“ pronese [follower.GetFirstNameNoTooltip] a ukáže na zrezivělou truhlu. „Je až po okraj plná mincí! A může to snad být... [newly_created_artifact.GetName]?“"
 ep3_contract_event.0007.a: "Proč by to nemohlo být moje?"
 ep3_contract_event.0007.b: "Výborně! Pošlete to [task_contract_employer.GetTitledFirstNameNoTooltip]."
 ep3_contract_event.0007.castle: "„Počkejte, tak to není. Pořád jsem s vámi!“"
 ep3_contract_event.0007.castle_buy: "„Dohodnuto, ale jen pokud půjdete se mnou.“"
 ep3_contract_event.0007.city_city: "Vezmu všechno."
 ep3_contract_event.0008.t: "$contract_event_prefix$ $laamp_join_war_contract_contract$"
 ep3_contract_event.0008.desc: "U mého tábora zastaví malá skupinka jezdců zmožených dlouhou jízdou a jeden z návštěvníků vstoupí do mého velkého stanu.\n\n„Velím těmto zvědům. [task_contract_employer.GetTitledFirstName] mě posílá jako svého mluvčího,“ začne příchozí. „Zaujala nás ta tvoje malá, ale houževnatá banda bojovníků.“\n\n„[task_contract_war.Custom('WarCasusBelliShort')] je důvod, proč [task_contract_employer.GetTitledFirstNameNoTooltip] po nocích nespí. Nepřítel klade tvrdý odpor, a proto mě poslali najmout vaše meče! [task_contract_employer.GetPrimaryTitle.GetNameNoTierNoTooltip] potřebuje vaši bojovnost. Přidáte se k nám?“"
 ep3_contract_event.0008.a: "To zní jako spravedlivá věc! [task_contract_employer.GetTitledFirstNameNoTooltip] může počítat s mou pomocí."
 ep3_contract_event.0008.b: "$ep3_contract_event.0001.invalidate$"
 join_war_contract.employer_military_strength: "Vojenská síla tvých spojenců: [task_contract_employer.GetMilitaryStrengthText|P]"
 join_war_contract.target_military_strength: "Vojenská síla tvých protivníků: [task_contract_target.GetMilitaryStrengthText|N]"
 ep3_contract_event.0009.t: "$contract_event_prefix$ $laamp_steal_artifact_contract_contract$"
 ep3_contract_event.0009.desc: "$ep3_contract_event.0001.desc$„[task_contract_employer.GetTitledFirstNameNoTooltip] je právoplatným vlastníkem předmětu [task_contract_object.GetName], který drží jako rukojmí [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.GetName]. [Select_CString(task_contract_employer.IsFemale, 'Má lenní paní', 'Můj lenní pán')] chce, abys ho [Select_CString(ROOT.Char.IsFemale, 'získala', 'získal')] zpět jakýmikoli prostředky!“"
 ep3_contract_event.0009.a: "Chytré! #EMP Mě#! nikdo podezírat nebude."
 ep3_contract_event.0009.b: "$ep3_contract_event.0001.invalidate$"
 ep3_contract_event.0009.open_start_stealing_back_artifact: "Otevře [Concept('character_interaction','interakci s postavou')|E] pro zahájení [Concept('scheme','intriky')|E] [GetScheme('steal_back_artifact').GetTypeName]"
 ep3_contract_event.0011.t_vip: "$ep3_contract_event.0001.t_vip$"
 ep3_contract_event.0011.t_child: "$ep3_contract_event.0001.t_child$"
 ep3_contract_event.0011.t_explorer: "$ep3_contract_event.0001.t_explorer$"
 ep3_contract_event.0011.t_artifact: "$ep3_contract_event.0001.t_artifact$"
 ep3_contract_event.0011.t_gold: "$ep3_contract_event.0001.t_gold$"
 ep3_contract_event.0011.t_animal: "$ep3_contract_event.0001.t_animal$"
 ep3_contract_event.0011.t_construction: "$ep3_contract_event.0001.t_construction$"
 ep3_contract_event.0011.desc: "[task_contract_target.GetTitledFirstName] mě přijme osobně.\n\n„[task_contract_target.Custom2('RelationToMeShort',task_contract_employer)|U], [task_contract_employer.GetTitledFirstName], tě posílá, že? S čím přicházíš?“\n\n"
 ep3_contract_event.0011.desc_vip: "$ep3_contract_event.0011.desc$[task_contract_object.GetName] předstoupí. „Ctihodný [task_contract_target.GetTitledFirstNameNoTooltip], promlouvám jménem [task_contract_employer.GetNameNoTooltip]! Zpráva, kterou nesu, je však určena pouze tvým uším.“\n\n„Pojď,“ odpoví temně [task_contract_target.GetTitledFirstNameNoTooltip]. „Promluvíme si v mých komnatách. [ROOT.Char.GetTitledFirstNameNoTooltip], tvé služby nezůstanou bez povšimnutí. Můžeš zůstat jako můj host. [task_contract_destination.GetHolding.GetType.GetName|U] ti poskytne přístřeší!“"
 ep3_contract_event.0011.desc_artifact: "$ep3_contract_event.0011.desc$Před dvorem odhalím [escorted_artifact.GetName] a přítomní užasnou.\n\n„Skvělý dar!“ zvolá [task_contract_target.GetTitledFirstNameNoTooltip]. „[Select_CString(ROOT.Char.IsFemale, 'Vedla', 'Vedl')] sis dobře, [Select_CString(ROOT.Char.IsFemale, 'dobrodružko', 'dobrodruhu')]. Můžeš zůstat a užívat si všeho, co nabízí [task_contract_destination.GetName].“"
 ep3_contract_event.0011.desc_ward: "$ep3_contract_event.0011.desc$[task_contract_object.GetFirstNameNoTooltip] vykročí vpřed a já [Select_CString(task_contract_object.IsFemale, 'jí', 'mu')] povzbudivě položím ruku na rameno. „Přivádím urozené dítě, které si zaslouží vytříbené vzdělání.“\n\n"
 ep3_contract_event.0011.desc_ward_accepted: "[task_contract_target.GetTitledFirstNameNoTooltip] přijme úklonu [task_contract_object.GetFirstNameNoTooltip] a pronese: „Od této chvíle budu [Select_CString(task_contract_target.IsFemale, 'tvou učitelkou a poručnicí', 'tvým učitelem a poručníkem')]. A pokud si to [ROOT.Char.GetTitledFirstNameNoTooltip] přeje, tvůj společník na cestách zde může nějaký čas zůstat také.“"
 ep3_contract_event.0011.desc_ward_too_old: "„Obávám se,“ odpoví [task_contract_target.GetTitledFirstNameNoTooltip] a prohlédne si mladého člověka před sebou, „že cesta už z [Select_CString(task_contract_object.IsFemale, 'této mladé ženy udělala dospělou', 'tohoto mladého muže udělala dospělého')]. Nemohu předstírat, že přede mnou stojí nezkušené dítě s očima dokořán.“"
 ep3_contract_event.0011.desc_ward_limit: "„Obávám se,“ odpoví [task_contract_target.GetTitledFirstNameNoTooltip], „že už teď mám na starosti víc kvílejících dětí, než je zdrávo. Pro dalšího svěřence na mém dvoře není místo.“"
 ep3_contract_event.0011.desc_gold: "„[task_contract_target.GetName], přivážím ti dar!“ zvolám. „Tato truhla překypuje zlatem, stříbrem a drahokamy vybranými z rozsáhlé pokladnice [task_contract_employer.GetName]!“\n\n[task_contract_target.GetTitledFirstNameNoTooltip] vyskočí z trůnu. „[task_contract_target.GetFaith.HighGodName]! [task_contract_employer.GetTitledFirstNameNoTooltip] si zaslouží veškerou chválu! Takovou štědrost poznal málokdo! Děkuji ti, [Select_CString(ROOT.Char.IsFemale, 'poutnice', 'poutníku')]. V [task_contract_destination.GetName] jsi více než [Select_CString(ROOT.Char.IsFemale, 'vítána', 'vítán')]... zvlášť pokud se ve tvém stanu ještě povalují nějaké mince.“"
 ep3_contract_event.0011.desc_explorer: "\n\n„[Select_CString(task_contract_object.IsFemale, 'Nebyla jsem si jistá,', 'Nebyl jsem si jistý,')] že to zvládnu!“ vydechne [task_contract_object.GetName]. „Celou cestu jsi mě spolehlivě [Select_CString(ROOT.Char.IsFemale, 'provázela', 'provázel')] všemi nástrahami! Děkuji ti. Svou odměnu sis [Select_CString(ROOT.Char.IsFemale, 'zasloužila', 'zasloužil')]. A musíš uznat, že [task_contract_destination.GetNameNoTooltip] je úžasné místo!“"
 ep3_contract_event.0011.desc_explorer_building: "Konečně jsme dorazili. [task_contract_destination.GetName] se rozkládá kolem nás a náš cíl stojí přímo před námi: [task_contract_destination.GetHolding.GetSpecialBuildingType.GetName].$ep3_contract_event.0011.desc_explorer$"
 ep3_contract_event.0011.desc_explorer_other: "Konečně jsme dorazili. [task_contract_destination.GetTitle.GetName] se rozkládá kolem nás a zdejší krajinu tvoří [task_contract_destination.GetTerrain.GetName]. Právě sem [task_contract_object.GetName] [Select_CString(task_contract_object.IsFemale, 'mířila', 'mířil')].$ep3_contract_event.0011.desc_explorer$"
 ep3_contract_event.0011.desc_animal_dog: "$ep3_contract_event.0011.desc$[task_contract_target.Custom('DogStoryName')|U] se mi vytrhne z vodítka a vrhne se vpřed. [task_contract_target.GetTitledFirstNameNoTooltip] po jeho náporu skončí na zemi a pes [Select_CString(task_contract_target.IsFemale, 'jí', 'mu')] nadšeně olizuje tvář."
 ep3_contract_event.0011.desc_animal_cat: "$ep3_contract_event.0011.desc$[task_contract_target.Custom('CatStoryName')|U] vykoukne z košíku. Jakmile se objeví [task_contract_target.GetTitledFirstNameNoTooltip], kočka začne příst."
 ep3_contract_event.0011.desc_animal_dog_hate: "$ep3_contract_event.0011.desc_animal_dog$\n\n„Sundejte ze mě toho špinavého čokla! Ten smrad je příšerný! Proklínám [task_contract_employer.GetTitledFirstNameNoTooltip] za to, že mi do síně posílá takovou bestii!“"
 ep3_contract_event.0011.desc_animal_dog_love: "$ep3_contract_event.0011.desc_animal_dog$\n\n„To je ale radost! Děkuji ti, [Select_CString(ROOT.Char.IsFemale, 'poutnice', 'poutníku')]. Tento tvor je požehnáním pro mé panství a ty zde můžeš zůstat tak dlouho, jak budeš chtít.“"
 ep3_contract_event.0011.desc_animal_cat_hate: "$ep3_contract_event.0011.desc_animal_cat$\n\n„To je kočka?! Okamžitě odsud toho vyzáblého démona odneste! Už teď mě z ní bolí hlava! A můj nos snad každou chvíli vybuchne!“"
 ep3_contract_event.0011.desc_animal_cat_love: "$ep3_contract_event.0011.desc_animal_cat$\n\n„Ach, to je [task_contract_target.Custom('CatStoryName')]? [task_contract_employer.GetTitledFirstNameNoTooltip] je až příliš [Select_CString(task_contract_employer.IsFemale, 'štědrá', 'štědrý')]! Za svou zásluhu můžeš, [Select_CString(ROOT.Char.IsFemale, 'poutnice', 'poutníku')], zůstat tak dlouho, jak budeš chtít.“"
 ep3_contract_event.0011.desc_construction: "Prohlížím si staveniště. [task_contract_destination.GetName] je plné ruchu a dělníci právě skládají materiál, který jsem [Select_CString(ROOT.Char.IsFemale, 'přivezla', 'přivezl')]. Přichází ke mně [task_contract_employer.GetName].\n\n„Dodávka právě včas, [ROOT.Char.GetTitleAsName]!“ ozve se [task_contract_employer.GetTitledFirstNameNoTooltip]. „Jak ale vidíš, dokončení [task_contract_destination.GetHolding.GetConstructingHoldingType.GetName] potrvá ještě asi [task_contract_destination.GetHolding.GetConstructionTimeLeft]. Potřebuji víc pracovních rukou.“\n\n„Zůstaneš tady se svými lidmi a pomůžeš mým dělníkům?“"
 ep3_contract_event.0011.a: "S radostí přesunu svůj tábor. [task_contract_destination.GetNameNoTooltip] bude naším novým stanovištěm."
 ep3_contract_event.0011.b: "[task_contract_object.GetTitledFirstNameNoTooltip] by s námi [Select_CString(task_contract_object.IsFemale, 'mohla', 'mohl')] zůstat natrvalo."
 ep3_contract_event.0011.c: "Třeba si to ještě rozmyslíš?"
 ep3_contract_event.0011.d_end: "[Select_CString(ROOT.Char.IsFemale, 'Měla', 'Měl')] bych se vrátit do tábora."
 ep3_contract_event.0011.d_continue: "[Select_CString(ROOT.Char.IsFemale, 'Měla', 'Měl')] bych pokračovat v cestě."
 ep3_contract_event.0011.reward: "Dokončíš zakázku [task_contract.GetType.GetName] a [task_contract_employer.GetTitledFirstNameNoTooltip] tě odmění"
 ep3_contract_event.0011.construction_invalidation: "@warning_icon! #X Pokud se změní poloha [Concept('camp','tábora')|E], modifikátor bude odstraněn a [Concept('task_contract','zakázka')|E] bude zrušena.#!"
 ep3_contract_event.0011.construction_reward: "Pokud [task_contract_destination.GetName] zůstane stanovištěm tvého [Concept('camp','tábora')|E] až do dokončení stavby, [Concept('task_contract','zakázka')|E] bude #P úspěšně dokončena#!:"
 ep3_contract_event.0012.opening_angry: "[task_contract_employer.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 ep3_contract_event.0012.opening: "[task_contract_employer.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 ep3_contract_event.0012.desc_employer_dead_outro: "Tvůj závazek tímto končí: [ROOT.Char.Custom('GetInvalidatedContractType')]. Neměj obavy, jako náhradu přijmi trochu zlata."
 ep3_contract_event.0012.desc_employer_dead: "Musím tě informovat, že [Select_CString(task_contract_employer.IsFemale, 'má předchůdkyně', 'můj předchůdce')], [task_contract_employer.GetTitledFirstName], [Select_CString(task_contract_employer.IsFemale, 'zemřela', 'zemřel')]. Zakázku nyní přebírám já. $ep3_contract_event.0012.desc_employer_dead_outro$"
 ep3_contract_event.0012.desc_unlanded_employer: "a proto už tvou zakázku nepotřebuji: [ROOT.Char.Custom('GetInvalidatedContractType')]."
 ep3_contract_event.0012.desc_unlanded_employer_is_imprisoned: "Musím tě informovat, že už nejsem [Select_CString(task_contract_employer.IsFemale, 'svobodná žena', 'svobodný muž')], $ep3_contract_event.0012.desc_unlanded_employer$"
 ep3_contract_event.0012.desc_target_dead: "Musím tě informovat, že [task_contract_target.GetTitledFirstName], [task_contract_employer.Custom2('RelationToMeShort',task_contract_target)], [Select_CString(task_contract_target.IsFemale, 'zemřela', 'zemřel')]. Vzhledem k okolnostem $ep3_contract_event.0012.desc_employer_dead_outro$"
 ep3_contract_event.0012.desc_prisoner_free: "Musím tě informovat, že [task_contract_object.GetFirstName], [task_contract_employer.Custom2('RelationToMeShort',task_contract_object)], je už na svobodě. Nevím, zda v tom máš prsty, ale $ep3_contract_event.0012.desc_employer_dead_outro$"
 ep3_contract_event.0012.desc_dead_intro: "Tvá neschopnost je ohromující a můj vztek nezná mezí. Jak jsi [Select_CString(ROOT.Char.IsFemale, 'mohla', 'mohl')] dopustit, že"
 ep3_contract_event.0012.desc_escortee_dead: "$ep3_contract_event.0012.desc_dead_intro$ [task_contract_object.GetFirstName] $ep3_contract_event.0012.desc_dead_outro$"
 ep3_contract_event.0012.desc_pet_dead: "$ep3_contract_event.0012.desc_dead_intro$ [ROOT.Char.Custom('CatOrDogStoryName')] $ep3_contract_event.0012.desc_dead_outro$"
 ep3_contract_event.0012.desc_dead_outro: "už nežije? [Select_CString(ROOT.Char.IsFemale, 'Přijala', 'Přijal')] jsi závazek: [ROOT.Char.Custom('GetInvalidatedContractType')]! Doufám, že tě už nikdy neuvidím, tak či #EMP onak#!."
 ep3_contract_event.0012.desc_not_vassal: "Raduj se, protože už nejsem [Select_CString(task_contract_employer.IsFemale, 'vazalkou', 'vazalem')] [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.GetName]. $ep3_contract_event.0012.desc_employer_dead_outro$"
 ep3_contract_event.0012.desc_faction_disbanded: "Okolnosti vedly k rozpuštění naší frakce. $ep3_contract_event.0012.desc_employer_dead_outro$"
 ep3_contract_event.0012.a: "Smutná zpráva, ale pár mincí je lepší než nic."
 ep3_contract_event.0012.b: "[Select_CString(ROOT.Char.IsFemale, 'Nemohla', 'Nemohl')] jsem s tím nic dělat."
 ep3_contract_event.0012.c: "Pokračujme dál k [travel_destination.GetNameNoTooltip]."
 ep3_contract_event.0013.opening_success: "[task_contract_employer.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 ep3_contract_event.0013.opening_failure: "[task_contract_employer.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 ep3_contract_event.0013.desc_success: "Tvůj přínos byl pro vítězství v mé válce zásadní a mí bojovníci obdivují odvahu tvých žoldnéřů.\n\nAť ti tato odměna pomůže náležitě oslavit naše velké vítězství!"
 ep3_contract_event.0013.desc_failure: "Za své žalostné selhání, když ses vůbec [Select_CString(ROOT.Char.IsFemale, 'neukázala', 'neukázal')] na bojišti, by sis [Select_CString(ROOT.Char.IsFemale, 'zasloužila přezdívku „Křivopřísežnice“', 'zasloužil přezdívku „Křivopřísežník“')]!\n\nJá, kdo bych bojoval po tvém boku, tě nyní nazývám [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('task_contract_employer'))] a [Select_CString(ROOT.Char.IsFemale, 'vůdkyní', 'vůdcem')] zbabělců."
 ep3_contract_event.0013.a: "Bylo mi ctí bojovat po tvém boku."
 ep3_contract_event.0013.b: "[Select_CString(ROOT.Char.IsFemale, '„Křivopřísežnice“', '„Křivopřísežník“')] vlastně nezní tak špatně..."
 treasure_hunting_contract_decision: "Hledání pokladů"
 treasure_hunting_contract_decision_desc: "Vzrušující dobrodružství čeká na každého, kdo má dost odvahy vydat se do dalekých krajů za zvěstmi o zlatě, drahokamech, pokladech a slávě. Podlehnu nízkým pokušením? Zdolá mě nebezpečná cesta? Nebo splním svůj závazek?"
