 laamp_base_5031_request: "Tato [Concept('task_contract','zakázka')|E] vyžaduje [Concept('travel','cestovat')|E] na několik [Concept('locations','míst')|E] a na každém prostřednictvím výzvy [Concept('prowess','udatnosti')|E] ukrást dobytek. Můžeš také prověřit vyšší z hodnot [Concept('martial','válečnictví')|E] a [Concept('stewardship','správcovství')|E], případně využít některé [Concept('officers','důstojníky')|E].\n$laamp_request_boilerplate_criminal$"
