 ep3_contract_event.0092.t: "$contract_event_prefix$ $laamp_help_increase_control_contract_contract$"
 ep3_contract_event.0092.desc: "[task_contract_councillor.GetName] mě na celý den navštíví v táboře. Jako [task_contract_councillor.GetCouncilTitle] slouží [task_contract_councillor_liege.GetName]. Jakmile osamíme, začne si něco rozmrzele mumlat.\n\n„Je mi trapné to přiznat... ale potřebuji tvou pomoc s neposlušnými sedláky z [task_contract_destination.GetName].“ [task_contract_councillor.GetCouncilTitle|U] si odfrkne a zamračí se.\n\n„Vůbec nerespektují autoritu [task_contract_councillor_liege.GetTitleAsNameNoTooltip]!"
 ep3_contract_event.0092.desc_taxes: "Výběrčí daní vítají zabouchnutými dveřmi a kamením! Kam se podívám, tam ignorují odvěká cla a poplatky.“"
 ep3_contract_event.0092.desc_bandits: "Zakládají vlastní domobrany a tvrdí, že je terorizují lapkové! Celá oblast se mění v jeden obrovský, neposlušný ozbrojený tábor...“"
 ep3_contract_event.0092.desc_riots: "Mám podezření, že za tím stojí cizí vliv, který ponouká prostý lid k hanebnostem... a s těmi musí okamžitě přestat!“"
 ep3_contract_event.0092.desc_low_control: "Nedokážu je udržet na uzdě! Každého, koho pošlu, zbijí a poníží a ještě mě vyzývají, ať proti nim vytáhnu se vší silou. Jejich chování je skvrnou na celém panství!“"
 ep3_contract_event.0092.a: "Nech to na mně!"
 ep3_contract_event.0092.a_tt: "$ep3_contract_event.0094.travel_without_domicile$"
 ep3_contract_event.0092.b: "Přesunu tam svůj tábor."
 ep3_contract_event.0092.b_tt: "$ep3_contract_event.0094.travel_with_domicile$"
 ep3_contract_event.0093.t: "$ep3_contract_event.0092.t$"
 ep3_contract_event.0093.desc: "Když dorazíme do [task_contract_destination.GetName], rychle pochytám nejhorší buřiče a žádám vysvětlení. Za ostatní promluví [corrupt_province_peasant.GetName], sedlák, kterého tu očividně každý zná.\n\n"
 ep3_contract_event.0093.desc_taxes: "„Desátky jsou vysoké, ale platíme je! Poplatky za naše zboží nám nenechají skoro nic! Všechno to snášíme, [task_contract_councillor_liege.GetTitledFirstName] po nás chce stále víc a výběrčí daní jsou mezitím čím dál bohatší. #EMP S nimi#! se máš vypořádat!“"
 ep3_contract_event.0093.desc_bandits: "„Bojíme se o své děti. [task_contract_councillor_liege.GetTitledFirstName] nás má chránit, ale místo toho se stará jen o to, jak nás ovládat! Jestli se ty vznešené meče nehodlají vypořádat s prokletými lapky, ochráníme své děti sami, kosami, cepy a šípy!“"
 ep3_contract_event.0093.desc_riots: "„Myslíme vlastní hlavou! Jako bychom snad stáli o vměšování cizinců — pche! A stejně tak nestojíme o pochopy a patolízaly, které sem posílá [task_contract_councillor_liege.GetTitledFirstName]! Copak si nemůžeme své místní záležitosti spravovat sami a mít od vás pokoj?“"
 ep3_contract_event.0093.desc_low_control: "„Víme, že nám má někdo vládnout, ale [task_contract_councillor_liege.GetTitledFirstName] nám vládne nespravedlivě! Země se zmítá v chaosu, sotva si dokážeme udržet to málo, co máme, a přesto nás ženou do práce jako tažná zvířata! Dřeme, ale nikdo nám nezaručí bezpečí před válkou, nemocemi ani ničím dalším!“"
 ep3_contract_event.0093.a: "„Udrž svůj lid na uzdě, nebo #EMP zemři#!, sedláku!“"
 ep3_contract_event.0093.b: "Takovou nespravedlnost nemohu přehlížet."
 ep3_contract_event.0093.a_win: "Pomůžeš prosadit autoritu, kterou zastupuje [task_contract_councillor.GetCouncilTitleFirstName]"
 ep3_contract_event.0093.a_lose: "[ROOT.Char.GetWomenMen] z tvého tábora však musí zůstat"
 every_lowborn_follower: "Každý [Concept('lowborn','neurozený')|E] [Concept('follower','družiník')|E]"
 ep3_contract_event.0094.t: "$ep3_contract_event.0092.t$"
 ep3_contract_event.0094.desc: "Když konečně skončí hlučné dohadování a poslední z vůdců sedláků se podvolí mé vůli, znovu vyrážíme na cestu. [task_contract_councillor.GetName] promluví o našem příštím cíli.\n\n„Ať se nám to líbí, nebo ne, zamíříme do [corrupt_province.GetName]. Tamní davy nám dělají vážné starosti."
 ep3_contract_event.0094.desc_taxes: "$ep3_contract_event.0092.desc_taxes$"
 ep3_contract_event.0094.desc_bandits: "$ep3_contract_event.0092.desc_bandits$"
 ep3_contract_event.0094.desc_riots: "$ep3_contract_event.0092.desc_riots$"
 ep3_contract_event.0094.desc_low_control: "$ep3_contract_event.0092.desc_low_control$"
 ep3_contract_event.0094.a: "Tak ať jsme co nejdřív na cestě!"
 ep3_contract_event.0094.b: "Přesunu tam svůj tábor."
 ep3_contract_event.0094.c: "Problémů, které má [task_contract_employer.GetFirstNameNoTooltip], už mám dost."
 ep3_contract_event.0094_success: "Splníš [Concept('task_contract','zakázku')|E] „[task_contract.GetType.GetName]“: [Select_CString(ROOT.Char.IsFemale, 'pomohla', 'pomohl')] jsi [task_contract_employer.GetShortUIName] více než sedlákům"
 ep3_contract_event.0094_fail: "Nesplníš [Concept('task_contract','zakázku')|E] „[task_contract.GetType.GetName]“: [Select_CString(ROOT.Char.IsFemale, 'pomohla', 'pomohl')] jsi sedlákům více než [task_contract_employer.GetShortUIName]"
 ep3_contract_event.0095.t: "$ep3_contract_event.0092.t$"
 ep3_contract_event.0095.desc: "Donesou se ke mně zprávy, že mé zastání prostého lidu je vyburcovalo k činu! Otužilí sedláci se houfují do hrdých zástupů, provolávají mé jméno a mávají provizorními zbraněmi, připraveni povstat! Bohužel se tyto zprávy donesly i k [task_contract_councillor.GetName].\n\n„[Select_CString(task_contract_councillor.IsFemale, 'Myslela', 'Myslel')] jsem, že jsme se dohodli! [Select_CString(ROOT.Char.IsFemale, 'Měla', 'Měl')] jsi ty hlupáky pochytat a nahnat jim strach! A místo toho nad údělem těch darebáků #EMP naříkáš#!? A teď #EMP co#!? Přidáš se snad k jejich povstání?!“"
 ep3_contract_event.0095.a: "„Práva pro sedláky!“"
 ep3_contract_event.0095.a_2: "Povedu je jen ve válce."
 ep3_contract_event.0095.a_become_landed: "@warning_icon! #X Pokud válku vyhraješ, staneš se [Concept('landed','zeměpánem')|E]#!"
 ep3_contract_event.0095.a_remain_laamp: "@alert_icon! #alert_trial Pokud válku vyhraješ, zůstaneš [Concept('adventurer','dobrodruhem')|E]#!"
 ep3_contract_event.0095.b: "Vlastně... jsou v tom sami."
 ep3_contract_event.0095.c: "„Ne, počkej! Všechno vysvětlím!“"
 ep3_contract_event.0095.a_win: "$ep3_contract_event.0083.a_win$"
 ep3_contract_event.0095.a_lose: "$ep3_contract_event.0083.a_lose$"
 ep3_contract_event.0095.c_win: "Přesvědčíš [task_contract_councillor.GetFirstNameNoTooltip], že jsi zakázku přece jen nějak [Select_CString(ROOT.Char.IsFemale, 'splnila', 'splnil')]"
 ep3_contract_event.0095.c_tie: "Přesvědčíš [task_contract_councillor.GetFirstNameNoTooltip], aby zakázku jednoduše [Select_CString(task_contract_councillor.IsFemale, 'zrušila', 'zrušil')]"
 ep3_contract_event.0095.c_lose: "[task_contract_councillor.GetFirstNameNoTooltip] trvá na tom, že jsi zakázku [Select_CString(ROOT.Char.IsFemale, 'nesplnila', 'nesplnil')]"
