 ep3_contract_event.0021.t: "$contract_event_prefix$ $laamp_religious_minority_contract_contract$"
 ep3_contract_event.0021.desc: "Do mého tábora vstoupí skupina [task_contract_employer.GetFaith.GetAdherentNamePlural] a žádá o rozhovor.\n\n„Zdravím tě, [Select_CString(ROOT.Char.IsFemale, 'dobrodružko', 'dobrodruhu')]!“ začne nejstarší z nich. „Přicházíme z [task_contract_destination.GetName], nedaleké země, kde [task_contract_employer.GetName] zbožně vládne podle posvátného učení [task_contract_employer.GetFaith.ReligiousText]!“ Několik nesmělých hlasů provolá: „[task_contract_employer.GetFaith.HighGodName]!“ Starší se na okamžik odmlčí a poté pokračuje:\n\n„Nad [Select_CString(task_contract_employer.IsFemale, 'naší paní', 'naším pánem')] však stojí [task_contract_target.GetName], [task_contract_employer.Custom2('GetUnbelieverTerm', task_contract_target)], komu na našich zvycích pramálo záleží. [task_contract_employer.GetFaith.HighGodName] je nám svědkem, prosíme tě, pomoz nám získat záruky náboženské svobody i za vlády [task_contract_target.GetTitledFirstNameNoTooltip]!“"
 ep3_contract_event.0021.a: "$ep3_contract_event.0020.a$"
 ep3_contract_event.0021.b: "Znám pár triků, po kterých budou [task_contract_target.GetFaith.GetAdherentNamePluralNoTooltip] na mé straně."
 ep3_contract_event.0021.c: "$ep3_contract_event.0020.c$"
 ep3_contract_event.0021.d: "[task_contract_target.GetFaith.ReligiousText] mi dá argument, kterým [task_contract_target.GetFirstNameNoTooltip] přesvědčím."
 ep3_contract_event.0021.e: "$ep3_contract_event.0020.e$"
 ep3_contract_event.0021.tt: "Úspěšná [Concept('scheme','intrika')|E] zajistí, že [task_contract_employer.GetShortUIName] získá od [task_contract_target.GetShortUIName] [GetSubjectContractType('religious_rights').GetObligationName('religious_rights_protected')] [Concept('obligation','povinnost')|E]"
 cultural_acceptance_laamp_cultural_minority_contract: "Díky úsilí [Concept('adventurer','dobrodruha')|E] byla vůči cizímu lennímu pánovi získána [GetSubjectContractType('title_revocation_rights').GetObligationName('title_revocation_rights_protected')] [Concept('obligation','povinnost')|E]"
 ep3_contract_event.0030.t: "$contract_event_prefix$ $laamp_prison_break_contract_contract$"
 ep3_contract_event.0030.desc: "„[task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.Custom2('InsultNoun', SCOPE.sC('task_contract_employer'))], [task_contract_target.GetName]!“ Hlasité nadávky před stanem mě vytrhnou ze spánku.\n\n„Kdo je tam? Kdo mě ruší uprostřed noci v mém vlastním táboře?“ zeptám se ještě napůl v mrákotách.\n\n„To jsem já, [task_contract_employer.GetName]!“ oznámí vetřelec hrdě. „Rychle, není času nazbyt! [task_contract_object.Custom2('MyCharacterIntroduction', task_contract_employer)|U] je ve vězení! Za tím stojí [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.Custom2('InsultNoun', SCOPE.sC('task_contract_employer'))], [task_contract_target.GetTitledFirstNameNoTooltip].“ Když spatří můj zmatený výraz, dodá:\n\n„Jestli se [task_contract_object.GetFirstNameNoTooltip] díky tobě dostane ven, bohatě ti zaplatím!“"
 ep3_contract_event.0030.a: "$ep3_contract_event.0020.a$"
 ep3_contract_event.0030.b: "Okamžitě začnu plánovat útěk!"
 ep3_contract_event.0030.c: "Tohle může počkat do rána."
 ep3_contract_event.0030.c.tt: "Odemkne [Concept('interaction','interakci')|E] $prison_break_contract_interaction$."
 ep3_contract_event.0030.agents: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType('agent_thief').GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType('agent_thug').GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType('agent_infiltrator').GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType('agent_lookout').GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType('agent_decoy').GetName]"
 treasure_map_prefix: "Mapa pokladu"
 ep3_contract_event.0040.t: "$treasure_map_prefix$: Roztržené naděje"
 ep3_contract_event.0040.desc: "Když mapu pokladu znovu vytáhnu, abych se v ní už poněkolikáté zmateně zorientoval, zachytí se o něco v brašně a ozve se příšerné #EMP „TR-R-RH!“#!\n\nMapa je teď roztržená přímo napůl a její cáry se snášejí k zemi.\n\nJen tam ohromeně stojím a v rukou svírám kusy, které jsou mi teď téměř k ničemu."
 ep3_contract_event.0040.a: "[Select_CString(task_contract_employer.IsFemale, 'Má zaměstnavatelka', 'Můj zaměstnavatel')] z toho radost mít nebude."
 ep3_contract_event.0040.a_travel: "Ale vždyť jsem jen... no nic."
 ep3_contract_event.0040.b: "Když už jsem tady, můžu tu zůstat."
 ep3_contract_event.0041.t_dead: "$treasure_map_prefix$: Věčnost na nikoho nečeká"
 ep3_contract_event.0041.t_incapable: "$treasure_map_prefix$: Padá noc"
 ep3_contract_event.0041.desc_intro: "Když mířím ke stanu [task_contract_employer.GetTitledFirstNameNoTooltip], zastaví mě strážce ohně. „[ROOT.Char.GetTitleAsNameNoTooltip|U], nechoď tam... [task_contract_employer.GetFirstNameNoTooltip] už tu není, [ROOT.Char.Custom('MistressMaster')].“"
 ep3_contract_event.0041.desc_dead: "$ep3_contract_event.0041.desc_intro$\n\nVstoupím do stanu a na okamžik se zdá, že [task_contract_employer.GetFirstNameNoTooltip] jen spí. Pak si ale všimnu, jak tvář pomalu bledne barvou smrti.\n\nStále ještě v šoku"
 ep3_contract_event.0041.desc_incapable: "$ep3_contract_event.0041.desc_intro$\n\nVstoupím do stanu a najdu [task_contract_employer.GetFirstNameNoTooltip] zhrouceně ležet na zemi. Žije, ale... jako by tu #EMP vůbec [Select_CString(task_contract_employer.IsFemale, 'nebyla', 'nebyl')]#!.\n\nStále ještě v šoku pomohu [task_contract_employer.GetFirstNameNoTooltip] posadit se a opřít o lůžko. Potom"
 ep3_contract_event.0041.desc_outro: "se rozhlédnu po mapě pokladu, ale rychle mi dojde, že nikde není.\n\nBez ní už poslední poklad nemohu najít..."
 ep3_contract_event.0041.a: "Měli bychom se vrátit."
 ep3_contract_event.0041.a.tt: "Přesuň svůj [Concept('camp','tábor')|E] do [THIS.Char.GetCurrentLocation.GetNameNoTooltip]"
 ep3_contract_event.0041.a.flavor_dead: "Ať [task_contract_employer.GetFaith.HighGodName] dopřeje této duši klid."
 ep3_contract_event.0041.a.flavor_incapable: "Jak strašlivý způsob... bytí?"
 ep3_contract_event.0041.b: "Stejně už není kvůli čemu se vracet."
 treasure_map_employer_is_incapable.tt: "[task_contract_employer.GetShortUIName|U] získá [Concept('trait','rys')|E] [GetTrait('incapable').GetName(GetNullCharacter)]"
 treasure_map_disappeared.tt: "Mapa není nikde k nalezení!"
 ep3_contract_event.0043.t: "$treasure_map_prefix$: Poklad, který unikl"
 ep3_contract_event.0043.desc: "[task_contract_employer.GetTitledFirstName] ke mně přijde a poplácá mě po rameni. „Ty jsi ale [ROOT.Char.Custom('GetLassLad')]! Opravdu si cením tvé pomoci při této poslední výpravě.“\n\nDo rukou dostanu potrhanou [0043_treasure_map.GetName]. Vrásky kolem očí [task_contract_employer.GetFirstNameNoTooltip] při úsměvu změknou. „Možná nevypadá nijak zvlášť, ale kvůli ní jsem se [Select_CString(task_contract_employer.IsFemale, 'musela', 'musel')] poprat se samotným ďáblem. [task_contract_employer.GetFaith.DevilName] mi ji rozhodně nevydal dobrovolně. Zacházej s ní opatrně.“\n\nPo krátké odmlce, během níž nechá svá slova doznít, se [Select_CString(task_contract_employer.IsFemale, 'stará žena', 'starý muž')] rozchechtá. „Až budeš [Select_CString(ROOT.Char.IsFemale, 'připravená', 'připraven')], vyrážíme. Čeká na nás poklad!“"
 ep3_contract_event.0043.a: "Vyrážíme!"
 ep3_contract_event.0043.a.tt: "Otevře obrazovku [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('treasure_map_contract_decision').GetName]"
 ep3_contract_event.0043.b: "Dostanu se k tomu. Brzy."
 ep3_contract_event.0045.t: "$treasure_map_prefix$: Lepší vrabec v hrsti..."
 ep3_contract_event.0045.desc_intro_artifact: "Za úsvitu dorazíme do [excavation_location.GetName], na místo, které by mělo odpovídat značce na [0045_treasure_map.GetName]. Začnu hledat místa, kam by někdo mohl ukrýt poklad.\n\nKam oko dohlédne, rozprostírá se jen tichá krajina, kde převládá [excavation_location.GetTerrain.GetNameNoTooltip|l]. Velkolepá kulisa pro mé pátrání."
 ep3_contract_event.0045.desc_artifact_historical: "$ep3_contract_event.0045.desc_intro_artifact$\n\nNakonec pod několika keři objevím pahorek. Rostou až #EMP příliš#! úhledně na to, aby to byla náhoda. Začnu kopat a brzy narazím na něco tvrdého. Opatrně nález vyprostím ze země a zjistím, že je to... [treasure_artifact_historical.GetName]!?"
 ep3_contract_event.0045.desc_artifact_jewelry: "$ep3_contract_event.0045.desc_intro_artifact$\n\nO kus dál, mezi prastarými stromy, zahlédnu něco v dutině jednoho z nich. Sáhnu dovnitř a vytáhnu... [treasure_artifact_jewelry.GetName]."
 ep3_contract_event.0045.desc_intro_gold: "Brzy odpoledne dorazíme do krajiny kolem [excavation_location.GetName] a začneme hledat stopy, které by nám napověděly, kam značka na [0045_treasure_map.GetName] ukazuje.\n\nPři průzkumu krajiny, kde převládá [excavation_location.GetTerrain.GetNameNoTooltip|l], si všimnu dobře ukryté pukliny ve skalním srázu. Za ní se skrývá malá jeskyně."
 ep3_contract_event.0045.desc_gold_great: "$ep3_contract_event.0045.desc_intro_gold$\n\nUvnitř jeskyně, jejíž výzdoba zachycuje nejrůznější podivné a ponuré výjevy, na mě čeká zaprášená dřevěná truhla.\n\nOtevřu ji a objevím pořádnou zásobu zlata, šperků a dalších cenností!"
 ep3_contract_event.0045.desc_gold_mediocre: "$ep3_contract_event.0045.desc_intro_gold$\n\nVnitřek jeskyně působí dojmem, že na něj už dávno všichni zapomněli, a po zemi se povalují nejrůznější předměty.\n\nZvednu starobylou a překvapivě těžkou urnu. Uvnitř objevím slušnou zásobu zlatých mincí."
 ep3_contract_event.0045.desc_gold_poor: "$ep3_contract_event.0045.desc_intro_gold$\n\nVnitřek jeskyně připomíná tajnou svatyni zasvěcenou nějakému neznámému božstvu. Pod pohledy cizích duchů však nenajdu nic cenného kromě jediné zlaté cetky na obětním podnosu."
 ep3_contract_event.0045.desc_intro_scenery: "Když dorazíme na okraj [excavation_location.GetName], vydám se podle značky na [0045_treasure_map.GetName] mezi útesy a křoviny a..."
 ep3_contract_event.0045.desc_riches_in_scenery_dry: "$ep3_contract_event.0045.desc_intro_scenery$\n\nKrajina, kde převládá [excavation_location.GetTerrain.GetNameNoTooltip|l], se náhle otevře a přede mnou se objeví dechberoucí oáza. Chladivá voda nabízí úlevu od neúprosného žáru a pod její zvlněnou hladinou tančí pestrobarevné ryby.\n\nPřemýšlím, jak i v těch nejtěžších dobách zůstávají taková klidná útočiště nedotčená. Právě na takových místech člověk nejvíc cítí, že [ROOT.Char.GetFaith.HighGodName] je nablízku..."
 ep3_contract_event.0045.desc_riches_in_scenery: "$ep3_contract_event.0045.desc_intro_scenery$\n\nKrajina, kde převládá [excavation_location.GetTerrain.GetNameNoTooltip|l], se otevře do nádherného prameniště. Místo je plné ptáků a pasoucích se zvířat, která okolní svět vůbec neruší.\n\nRozjímám nad krásou tohoto místa a nad tím, jak všichni tvorové existují v jemném řádu: hmyz, ryby, ptáci i zvěř.\n\nV hrudi se mi rozlévá teplo. Tohle musí být dotek božství, o tom není pochyb!"
 ep3_contract_event.0045.desc_pillaged: "$ep3_contract_event.0045.desc_intro_gold$\n\nPo něco málo přes hodině najdu napůl zasypanou jámu a v ní malou dřevěnou truhlu. Je téměř prázdná... až na několik cetek pocházejících z [excavation_location.GetCulture.GetNameNoTooltip] kultury."
 ep3_contract_event.0045.a: "To jsou skvělé zprávy pro [task_contract_employer.GetTitledFirstNameNoTooltip]!"
 ep3_contract_event.0045.a_artifact_historical: "[task_contract_employer.GetTitledFirstNameNoTooltip] bude #EMP [Select_CString(task_contract_employer.IsFemale, 'nadšená', 'nadšen')]!#!"
 ep3_contract_event.0045.a_pillaged: "Hm. Asi bych [Select_CString(ROOT.Char.IsFemale, 'měla', 'měl')] dát [Select_CString(task_contract_employer.IsFemale, 'své zaměstnavatelce', 'svému zaměstnavateli')] vědět..."
 ep3_contract_event.0045.b: "Co najdu, to si nechám."
 ep3_contract_event.0045.b_artifact_historical: "Tohle patří... #EMP mně.#!"
 ep3_contract_event.0045.b_pillaged: "Tady opravdu není co slavit."
 ep3_contract_event.0045.b.flavor_reforged: "Předělám to na něco užitečného."
 ep3_contract_event.0045.b.flavor: "Schovám si to na později."
 ep3_contract_event.0050.t: "$treasure_map_prefix$: ...než holub na střeše"
 ep3_contract_event.0050.desc_artifact_historical: "„[treasure_artifact_historical.GetName]!“ vydechne [task_contract_employer.GetTitledFirstName], když předám [treasure_artifact_historical.Custom('ArtifactType')].\n\n„Děkuji ti, [Select_CString(ROOT.Char.IsFemale, 'přítelkyně', 'příteli')], že jsi mi tento poklad [Select_CString(ROOT.Char.IsFemale, 'přinesla', 'přinesl')]. Chápu, jak nepředstavitelně těžké muselo být vzdát se něčeho tak vzácného...“\n\n[task_contract_employer.GetFirstNameNoTooltip] se vděčně usměje. „Zdá se, že moudrost mé matky stále platí. V laskavost cizinců lze přece jen věřit.“"
 ep3_contract_event.0045.desc_intro: "[task_contract_employer.GetFirstName] jen stěží skrývá nadšení, když se vrátím do stanu."
 ep3_contract_event.0050.desc_artifact_jewelry: "$ep3_contract_event.0045.desc_intro$ „Nádhera! Jen se podívej na tu neobvyklou řemeslnou práci!“\n\n[task_contract_employer.GetFirstNameNoTooltip] se s téměř dětským nadšením probírá nejmenšími detaily [treasure_artifact_jewelry.GetName] a pak se na mě usměje. „Za tohle ti budu navždy [Select_CString(task_contract_employer.IsFemale, 'vděčná', 'vděčný')].“"
 ep3_contract_event.0050.desc_gold: "$ep3_contract_event.0045.desc_intro$ „Zlato, říkáš? To je tedy poslední poklad jaksepatří!“\n\nPřes tvář [task_contract_employer.GetFirstNameNoTooltip] přelétne záchvěv melancholie, nepochybně při pomyšlení, že dobrodružství je u konce. „Za tento zlatý nález, svědomitě doručený až ke mně, ti děkuji. Jdi s mým požehnáním.“"
 ep3_contract_event.0050.desc_scenic: "$ep3_contract_event.0045.desc_intro$ „To... zní opravdu úchvatně. Tolik života jsem [Select_CString(task_contract_employer.IsFemale, 'strávila', 'strávil')] hledáním bohatství, cetek a všeho, co se třpytí. Ale tohle...“\n\n[task_contract_employer.GetFirstNameNoTooltip] se na okamžik odmlčí a ponoří do myšlenek. „...právě tam strávím své poslední dny. V pokoji. Děkuji ti, [Select_CString(ROOT.Char.IsFemale, 'přítelkyně', 'příteli')].“"
 ep3_contract_event.0050.desc_pillaged: "$ep3_contract_event.0045.desc_intro$ „Už to tam někdo vyraboval?“\n\n[task_contract_employer.GetFirstNameNoTooltip] těžce povzdechne. „Život dobrodruha zřejmě nekončí velkolepým třeskem, ale spíš... žalostným zakňučením. Inu. [Select_CString(ROOT.Char.IsFemale, 'Dopřála', 'Dopřál')] jsi mi tuhle poslední pošetilost a za to ti děkuji.“"
 ep3_contract_event.0050.a: "Bylo mi potěšením s tebou obchodovat."
 ep3_contract_event.0060.t: "$contract_event_prefix$ $laamp_help_claimant_contract_contract$"
 ep3_contract_event.0060.desc: "V mém táboře zastaví družina [task_contract_employer.GetCulture.GetCollectiveNoun], jejichž kopí zdobí zářivé, čerstvě ušité praporce. S prosbou [Select_CString(task_contract_employer.IsFemale, 'své paní', 'svého pána')] ke mně přichází [commander.GetName], [Select_CString(commander.IsFemale, 'jedna', 'jeden')] z [task_contract_employer.Custom('KnightCulturePluralNoTooltip')|l].\n\n„[task_contract_employer.GetName] shromažďuje vojsko k úderu proti [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.GetName] a silou zbraní hodlá získat zpět to, na co má právoplatný nárok!“\n\n„Až naše praporce zavlají nad [task_contract.MakeScope.Var('task_contract_title').Title.GetNameNoTier], čeká bohatá kořist na všechny, kdo bojovali za nárok, který vznáší [task_contract_employer.GetTitledFirstNameNoTooltip]!“"
 ep3_contract_event.0060.a: "$ep3_contract_event.0008.a$"
 ep3_contract_event.0060.join_war: "[task_contract_taker.GetShortUIName|U] se připojí k [Concept('war','válce')|E] na straně útočníka"
