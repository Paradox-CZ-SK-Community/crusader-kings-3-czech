 laamp_base_1021_request: "$laamp_request_boilerplate_martial_scheme$"
 laamp_base_1031_request: "$laamp_request_boilerplate_martial_scheme$"
 laamp_base_1041_request: "Tato [Concept('task_contract','zakázka')|E] vyžaduje [Concept('travel','cestovat')|E] do vzdálené [Concept('holding','državy')|E], cestou přepadávat [Concept('characters','postavy')|E] a brát jim [Concept('gold','zlato')|E] prostřednictvím výzev [Concept('prowess','udatnosti')|E], [Concept('martial','válečnictví')|E] nebo [Concept('intrigue','pletichářství')|E].\n$laamp_request_boilerplate_criminal$"
 laamp_base_2001_request: "Tato [Concept('task_contract','zakázka')|E] vyžaduje [Concept('travel','cestovat')|E] do [Concept('holding','državy')|E] představující [Concept('city','město')|E] a prostřednictvím událostí ji prošetřit. Plná odměna závisí na tom, zda prokážeš, že tamní [Concept('characters','postavy')|E] neodvádějí spravedlivý díl daní, a to úspěšným splněním výzev [Concept('skill','dovednosti')|E] [Concept('stewardship','správcovství')|E] nebo výzev [Concept('aptitude','způsobilosti')|E] [GetCourtPositionType('quartermaster_camp_officer').GetName()]."
 laamp_base_2011_request: "Tato [Concept('task_contract','zakázka')|E] vyžaduje [Concept('travel','cestovat')|E] mezi několika [Concept('holdings','državami')|E] v [Concept('contractor_possessive','zadavatelově')|E] [Concept('realm','panství')|E] a úspěšně zvládnout buď výzvu [Concept('skill','dovednosti')|E] [Concept('stewardship','správcovství')|E], výzvu [Concept('intrigue','pletichářství')|E], nebo zkoušku [Concept('aptitude','způsobilosti')|E] [GetCourtPositionType('quartermaster_camp_officer').GetName()]."
 laamp_base_2021_request: "$laamp_request_boilerplate_stewardship_scheme$"
 laamp_base_2031_request: "Tato [Concept('task_contract','zakázka')|E] vyžaduje [Concept('travel','cestovat')|E] do [Concept('holding','državy')|E], kterou vlastní [Concept('baron','baron')|E], a dokončit výzvu. Vždy budeš moci prověřit své [Concept('stewardship','správcovství')|E], další možnosti však budou záviset na povaze problému, tvém [Concept('camp_purpose','účelu tábora')|E], tvých [Concept('followers','družinících')|E] a [Concept('officers','důstojnících')|E]."
 laamp_base_2041_request: "Tato [Concept('task_contract','zakázka')|E] vyžaduje [Concept('travel','cestovat')|E] až do #BOL [TaskContract.GetEmployer.MakeScope.ScriptValue('laamp_base_2041_num_counties_to_rob_sans_capital_value')|0]#! [Concept('counties','hrabství')|E] v zemích [TaskContract.GetEmployer.GetTitledFirstNamePossessive] a plnit stále obtížnější výzvy [Concept('stewardship','správcovství')|E], [Concept('intrigue','pletichářství')|E] nebo [Concept('aptitude','způsobilosti')|E] [GetCourtPositionType('master_bard_camp_officer').GetName()], aby poddaní odevzdali daně určené pro [TaskContract.GetEmployer.GetTitleAsNameNoTooltip].\n$laamp_request_boilerplate_criminal$"
 laamp_base_3001_request: "Tato [Concept('task_contract','zakázka')|E] vyžaduje [Concept('travel','cestovat')|E] do tří [Concept('counties','hrabství')|E] a v každém z nich podstoupit výzvu [Concept('intrigue','pletichářství')|E] nebo [Concept('diplomacy','diplomacie')|E], případně prostě přijít o [Concept('prestige','prestiž')|E] a [Concept('opinion','mínění')|E]."
 laamp_base_3011_request: "$laamp_request_boilerplate_intrigue_scheme$\n$laamp_request_boilerplate_criminal$"
 laamp_base_3021_request: "$laamp_request_boilerplate_intrigue_scheme$\n$laamp_request_boilerplate_criminal$"
 laamp_base_3031_request: "Tato [Concept('task_contract','zakázka')|E] vyžaduje [Concept('travel','cestovat')|E] na určité [Concept('location','místo')|E] a prostřednictvím výzvy [Concept('intrigue','pletichářství')|E] tam založit požár. Místo toho můžeš využít také [Concept('martial','válečnictví')|E], [Concept('prowess','udatnost')|E] nebo své [Concept('officers','důstojníky')|E].\n$laamp_request_boilerplate_criminal$"
 laamp_base_3041_request: "$laamp_request_boilerplate_intrigue_scheme$; pokud uspěješ, budeš moci využít své [Concept('intrigue','pletichářství')|E], [Concept('agents','spolčence')|E] a [Concept('officers','důstojníky')|E] k odcizení ještě většího množství [Concept('gold','zlata')|E]\n$laamp_request_boilerplate_criminal$"
