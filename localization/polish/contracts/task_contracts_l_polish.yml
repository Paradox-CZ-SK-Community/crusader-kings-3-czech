 laamp_base_0031_request: "Tato [Concept('task_contract','zakázka')|E] vyžaduje [Concept('travel','cestovat')|E] do #BOLD 3#! [Concept('counties','hrabství')|E] v zemích [TaskContract.GetEmployer.GetTitledFirstNamePossessive] a v každém z nich použít jinou [Concept('skill','dovednost')|E], čímž pomůžeš odstranit negativní [Concept('modifier','modifikátor')|E]."
 laamp_base_0041_request: "$laamp_request_boilerplate_diplomacy_scheme$\n$laamp_request_boilerplate_criminal$"
 laamp_base_1001_request: "Tato [Concept('task_contract','zakázka')|E] vyžaduje zabít určitou [Concept('character','postavu')|E], a to buď v [Concept('single_combat_duel','duelu')|E], úspěšným splněním výzvy [Concept('skill','dovednosti')|E] [Concept('martial','válečnictví')|E], nebo tím, že proti ní vyšleš své [Concept('men_at_arms','ozbrojence')|E] a utrpíš ztráty."
