 event_target_desc: "Scope lze uložit jako „cíl události“. Poté k němu bude možné přistupovat z libovolného triggeru/efektu, který lze v přímé linii „zpětně vysledovat“ k místu, kde jsi cíl události uložil (tj. ze všech triggerů, které se kontrolují, nebo efektů, které se spouštějí po uložení cíle události, ale pouze v souvislém řetězci, například v řetězci událostí). Pokud řetězec událostí skončí, cíl události se ztratí.\nVšimni si, že řada on_actions nastavených kódem a řada zvláštních interakcí má vlastní předdefinované cíle událostí.\nNa závěr: jako cíle událostí můžeš ukládat také hodnoty a booly, což se může v některých situacích hodit."
 parameter_desc: "Pozůstatek ze Stellaris. Pokud uvažuješ o jeho použití, pravděpodobně bude lepší použít scopy uložené jako proměnné. (Pokud jsme z nějakého důvodu začali „parameter“ používat, změň tento popis!)"
 variable_desc: "Skriptové proměnné jsou přístupné a upravitelné pomocí skriptu. V současnosti mohou mít následující podoby:\n\nvariable:example_number = 1\nvariable:example_flag = flag:example\nvariable:example_scope = root\nvariable:example_bool = yes"
 flag_desc: "Příznaky jsou jednoduché značky, pomocí kterých lze sledovat, zda se ve hře něco stalo. Mají konkrétní typ podle toho, v jakém druhu scopu byly nastaveny (příznak postavy, příznak intriky, sC.). Daný scope (například konkrétní postava) bude mít příznak nastavený, dokud jej efekt neodstraní nebo dokud nevyprší jeho časovač, pokud pro něj byl časovač definován."
