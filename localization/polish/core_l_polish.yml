 event_target_desc: "Rozsah lze uložit jako „cílový objekt události“. Poté bude přístupný z jakéhokoli spouštěče/efektu, který lze „sledovat zpětně“ v přímé linii až k místu, kde jste cílový objekt události uložili (tj. jakékoliv spouštěče, které se kontrolují, nebo efekty, které se spouští po uložení cílového objektu události, ale pouze v souvislém řetězci, jako je řetězec událostí). Pokud řetězec událostí skončí, cílový objekt události se ztratí.\nPoznámka: Několik on_actions nastavených kódem a několik speciálních interakcí má své vlastní předdefinované cílové objekty událostí.\nZávěrem: Jako cílové objekty událostí můžete také uložit hodnoty a booleany, což může být v některých situacích užitečné."
 parameter_desc: "Pozůstatek ze Stellaris. Pokud to zvažujete, pravděpodobně je lepší použít rozsahy uložené jako proměnné. (Změňte tento popis, pokud jsme začali pro nějaký účel používat „parameter“!)"
 variable_desc: "Skriptové proměnné jsou skriptem přístupné a upravitelné. Aktuálně se vyskytují v následujících formách:\n\nvariable:example_number = 1\nvariable:example_flag = flag:example\nvariable:example_scope = root\nvariable:example_bool = yes"
 flag_desc: "Flagy jsou jednoduché značky, které můžete použít k sledování, že se v hře něco stalo. Mají konkrétní typ v závislosti na tom, v jakém rozsahu byly nastaveny (např. flag postavy, flag plánu, odv.). Konkrétní rozsah (např. konkrétní postava) bude mít tento flag nastaven, dokud nebude odstraněn některým efektem, nebo dokud nevyprší jeho časovač, pokud byl definován."
