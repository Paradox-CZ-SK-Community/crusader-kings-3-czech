 kurultai_task.1551.notification: "Slábnoucí kulturní vztahy"
 kurultai_task.1551.desc: "Úsilí [councillor.GetShortUIName] pouze zhoršilo kulturní vztahy."
 kurultai_task.1556.notification: "Zpřetrhaná pouta"
 kurultai_task.1556.desc: "Navzdory úsilí [councillor.GetShortUIName] se cizinci u dvora necítí vítáni."
