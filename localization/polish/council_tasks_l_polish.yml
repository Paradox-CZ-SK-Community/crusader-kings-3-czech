 task_kurultai_culture_cooldown_effect_desc: "Prodleva a cena [Concept('reformation','reformace')|E] [Concept('culture','kultury')|E]: #P [culture_i]-[SCOPE.ScriptValue('kurultai_culture_final_value')|2]%#!\n(Mění se o #P -[SCOPE.ScriptValue('kurultai_culture_monthly_increase')|2]%#!/měsíc až na #P -[SCOPE.ScriptValue('kurultai_culture_max_value')|0]%#!)\n$TAB$Základ: #P [culture_i]-[SCOPE.ScriptValue('kurultai_culture_base_monthly_increase')|2]%#!\n$TAB$[councillor.Custom('GetCouncillorKurultaiMemberPossessive')] [learning_i][Concept('learning_skill','učenost')|E]: #P [culture_i]-[SCOPE.ScriptValue('kurultai_culture_skill_monthly_increase')|2]%#!"
 task_kurultai_culture_hybridization_effect_desc: "\nPráh [Concept('hybridizing','hybridizace')|E] [Concept('culture','kultury')|E]: #P [cultural_acceptance_i]-[SCOPE.ScriptValue('kurultai_culture_final_value')|2]%#!\n(Mění se o #P -[SCOPE.ScriptValue('kurultai_culture_monthly_increase')|2]%#!/měsíc až na #P -[SCOPE.ScriptValue('kurultai_culture_max_value')|0]%#!)\n$TAB$Základ: #P [cultural_acceptance_i]-[SCOPE.ScriptValue('kurultai_culture_base_monthly_increase')|2]%#!\n$TAB$[councillor.Custom('GetCouncillorKurultaiMemberPossessive')] [learning_i][Concept('learning_skill','učenost')|E]: #P [cultural_acceptance_i]-[SCOPE.ScriptValue('kurultai_culture_skill_monthly_increase')|2]%#!"
