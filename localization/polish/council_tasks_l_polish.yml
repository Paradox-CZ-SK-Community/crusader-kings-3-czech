 kurultai_task.1001.notification: "Vzkvétající stáda"
 kurultai_task.1001.desc: "Díky usilovné práci [councillor.GetShortUIName] se našim stádům daří."
 kurultai_task.1006.notification: "Nábor hordy"
 kurultai_task.1006.desc: "Malá skupina pastevců vyhnaných ze svých zemí přísahala věrnost našemu kmeni."
 kurultai_herder_army: "Horda pastevců"
 kurultai_task.1051.notification: "Upadající stáda"
 kurultai_task.1051.desc: "Navzdory usilovné práci [councillor.GetShortUIName] naše stáda slábnou."
 kurultai_task.1056.notification: "Slábnoucí kontrola"
 kurultai_task.1056.desc: "Při snaze zvelebit naše stáda [councillor.GetShortUIName] [Select_CString( councillor.IsFemale, 'způsobila', 'způsobil' )] mezi naším lidem nepokoje a spory."
 kurultai_task.1101.notification: "Vzkvétající úrodnost"
 kurultai_task.1101.desc: "[county.GetDefinitiveName] vzkvétá díky [councillor.GetShortUIName]."
 kurultai_task.1106.notification: "Oblíbená vláda"
 kurultai_task.1106.desc: "Práce, kterou [councillor.GetShortUIName] [Select_CString( councillor.IsFemale, 'odvedla', 'odvedl' )] v [county.GetDefinitiveName], přinesla nečekaný prospěch."
 kurultai_task.1151.notification: "Klesající úrodnost"
 kurultai_task.1151.desc: "[councillor.GetShortUIName] [Select_CString( councillor.IsFemale, 'nezvládla', 'nezvládl' )] péči o naše stáda v [county.GetDefinitiveName], a úrodnost oblasti proto klesá."
 kurultai_task.1156.notification: "Neoblíbená vláda"
 kurultai_task.1156.desc: "Způsob, jakým [councillor.GetShortUIName] [Select_CString( councillor.IsFemale, 'spravovala', 'spravoval' )] [county.GetNameNoTier], se ukázal jako krajně neoblíbený a vrhá špatné světlo na mou vládu v roli [ROOT.Char.GetTitleAsNameNoTooltip]."
 kurultai_task.1201.notification: "Zbožná vláda"
 kurultai_task.1201.desc: "Na můj lid zapůsobila práce, kterou pro mě odvádějí [astrologer.GetShortUIName] a [councillor.GetShortUIName]."
 kurultai_task.1206.notification: "Přátelské vztahy s postavou ve funkci $court_astrologer_court_position$"
 kurultai_task.1206.desc: "[councillor.GetShortUIName], člen mého [Concept('kurultai','kurultaje')|E], prohlubuje mým jménem vztahy s [astrologer.GetShortUIName]."
 kurultai_task.1251.notification: "Hanebná vláda"
 kurultai_task.1251.desc: "Můj lid odsuzuje [astrologer.GetShortUIName] a [councillor.GetShortUIName] za zneužívání jejich postavení."
 kurultai_task.1256.notification: "Hněv postavy ve funkci $court_astrologer_court_position$"
 kurultai_task.1256.desc: "[councillor.GetShortUIName], člen mého [Concept('kurultai','kurultaje')|E], se neustále pře s [astrologer.GetShortUIName], [Select_CString( astrologer.IsFemale, 'mou', 'mým' )] $court_astrologer_court_position$."
 kurultai_task.1301.notification: "Nečekaný zisk"
 kurultai_task.1301.desc: "[councillor.GetShortUIName] [Select_CString( councillor.IsFemale, 'dokázala', 'dokázal' )] v [county.GetNameNoTier] shromáždit více zlata, než se očekávalo."
 kurultai_task.1306.notification: "Budování pověsti"
 kurultai_task.1306.desc: "Poté, co jsem [councillor.GetShortUIName] [Select_CString( councillor.IsFemale, 'pověřila', 'pověřil' )] vykořisťováním [county.GetNameNoTier], jsem [Select_CString( ROOT.Char.IsFemale, 'získala', 'získal' )] pověst obávaného vládce."
 kurultai_task.1351.notification: "Vykořisťované země"
 kurultai_task.1351.desc: "Snaha [councillor.GetShortUIName] vytěžit z [county.GetNameNoTier] co nejvíce měla nečekané, avšak nikterak překvapivé vedlejší účinky."
 kurultai_task.1356.notification: "Vykořisťovaný lid"
 kurultai_task.1356.desc: "Práce [councillor.GetShortUIName] měla katastrofální dopad na místní kmeny žijící v [county.GetNameNoTier]."
 kurultai_task.1401.notification: "Působiví nájezdníci"
 kurultai_task.1401.desc: "Díky tvrdému výcviku, který vede [councillor.GetShortUIName], budí naši nájezdníci strach široko daleko."
 kurultai_task.1406.notification: "Hrůzní nájezdníci"
 kurultai_task.1406.desc: "Naši nájezdníci budí hrůzu v srdcích nepřátel široko daleko, uvnitř našich hranic i za nimi."
 kurultai_task.1451.notification: "Nevýrazní nájezdníci"
 kurultai_task.1451.desc: "Naši nájezdníci kupodivu působí ještě hůře než předtím, než se jim [councillor.GetShortUIName] [Select_CString( councillor.IsFemale, 'začala', 'začal' )] věnovat."
 kurultai_task.1456.notification: "Ubozí nájezdníci"
 kurultai_task.1456.desc: "Žebráci, opilci a slaboši. [councillor.GetShortUIName], vrať mi mé nájezdníky!"
