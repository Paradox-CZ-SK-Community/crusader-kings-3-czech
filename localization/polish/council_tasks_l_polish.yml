 task_kurultai_raider_loot_desc: "Maximální [Concept('loot','kořist')|E]: #P [loot_i]+[SCOPE.ScriptValue('kurultai_organize_raiders_loot_final_value')|1]%#!\n$TAB$Základ: #P [loot_i]+[SCOPE.ScriptValue('kurultai_organize_raiders_loot_base_value')|1]%#!\n$TAB$[councillor.Custom('GetCouncillorKurultaiMemberPossessive')] [martial_i][Concept('martial_skill','válečnická dovednost')|E]: #P [loot_i]+[SCOPE.ScriptValue('kurultai_organize_raiders_loot_skill_value')|1]%#!"
 task_kurultai_raider_attrition_desc: "\n[Concept('attrition','Opotřebení')|E] v nepřátelském hrabství při [Concept('raiding','plenění')|E]: #P [attrition_i]-[SCOPE.ScriptValue('kurultai_organize_raiders_loot_final_value')|1]%#!\n$TAB$Základ: #P [attrition_i]-[SCOPE.ScriptValue('kurultai_organize_raiders_loot_base_value')|1]%#!\n$TAB$[councillor.Custom('GetCouncillorKurultaiMemberPossessive')] [martial_i][Concept('martial_skill','válečnická dovednost')|E]: #P [attrition_i]-[SCOPE.ScriptValue('kurultai_organize_raiders_loot_skill_value')|1]%#!"
 task_kurultai_raider_raiding_desc: "\nRychlost [Concept('raid','nájezdu')|E] a rychlost pohybu při [Concept('raiding','plenění')|E]: #P [raid_i]-[SCOPE.ScriptValue('kurultai_organize_raiders_raid_final_value')|1]%#!\n$TAB$Základ: #P [raid_i]-[SCOPE.ScriptValue('kurultai_organize_raiders_raid_base_value')|1]%#!\n$TAB$[councillor.Custom('GetCouncillorKurultaiMemberPossessive')] [martial_i][Concept('martial_skill','válečnická dovednost')|E]: #P [raid_i]-[SCOPE.ScriptValue('kurultai_organize_raiders_raid_skill_value')|1]%#!"
