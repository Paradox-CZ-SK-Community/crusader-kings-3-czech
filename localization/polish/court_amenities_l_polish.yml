l_polish:
 court_fashion: "Dvorní móda"
 court_fashion_default: "Móda minulého století"
 court_fashion_default_desc: "Dvořané se oblékají podle zavedených zvyklostí, což je sice bezpečné, ale nikterak nápadité."
 court_fashion_acceptable: "Zastaralá móda"
 court_fashion_acceptable_desc: "Když dvořané zavítají do městeček a měst, budí pozornost."
 court_fashion_decent: "Slušná móda"
 court_fashion_decent_desc: "Dvořané obratně obměňují svůj šatník podle ročních období a odkládají staré oděvy, jakmile se uchytí nový styl."
 court_fashion_good: "Stylová móda"
 court_fashion_good_desc: "Styly tohoto dvora se často šíří do celého světa a ovlivňují módu na jiných dvorech."
 court_fashion_fantastic: "Vytříbená móda"
 court_fashion_fantastic_desc: "Tento dvůr je považován za průkopníka módy. Služebnictvo se obléká jako vládci jiných panství a vkus jejich lenního pána vejde navždy do dějin."
 court_food_quality: "Kvalita jídla"
 court_food_quality_default: "Nevýrazné jídlo"
 court_food_quality_modest: "Skromné jídlo"
 court_food_quality_decent: "Slušné jídlo"
 court_food_quality_lavish: "Přepychové jídlo"
 court_food_quality_exotic: "Exotické jídlo"
 court_food_quality_default_desc: "Na jídlo u tohoto dvora se nikdo netěší, říká se však, že dobrá společnost to vynahradí."
 court_food_quality_modest_desc: "Hosté se dosyta najedí přiměřených pokrmů místní kuchyně."
 court_food_quality_decent_desc: "Tento dvůr si může čas od času dovolit nabídnout nějakou neobvyklou pochoutku."
 court_food_quality_lavish_desc: "Celý zástup kuchařů zajišťuje neustálý přísun chutných soust. Kamkoli se hosté shromáždí, následuje je služebník s podnosem plným jídla."
 court_food_quality_exotic_desc: "Služebnictvo je vysíláno do cizích zemí, odkud se vrací s hojností exotických potravin. Není kulinářského požitku, který by těmito síněmi dosud neprošel."
 court_lodging_standards: "Úroveň ubytování"
 court_lodging_standards_default: "Stísněné ubytování"
 court_lodging_standards_small: "Malé ubytování"
 court_lodging_standards_middling: "Obstojné ubytování"
 court_lodging_standards_spacious: "Prostorné ubytování"
 court_lodging_standards_grand: "Velkolepé ubytování"
 court_lodging_standards_default_desc: "Občas dochází k diplomatickým roztržkám, když jsou hosté požádáni, aby sdíleli ubytování."
 court_lodging_standards_small_desc: "Místa je dost, aby každý dvořan mohl mít vlastní pokoj."
 court_lodging_standards_middling_desc: "Pokoj každého dvořana je dobře vybaven."
 court_lodging_standards_spacious_desc: "Každý obyvatel tohoto dvora může očekávat vlastní soubor pokojů."
 court_lodging_standards_grand_desc: "Hosté vědí, že si ve svém ubytování mohou vyžádat jakýkoli přepych. Knihu ke studiu, nápoj pozdě v noci... o pokoje je postaráno v kteroukoli hodinu."
 court_servants: "Dvorní služebnictvo"
 court_servants_default: "Velmi málo služebnictva"
 court_servants_few: "Málo služebnictva"
 court_servants_some: "Dostatek služebnictva"
 court_servants_many: "Mnoho služebnictva"
 court_servants_endless: "Bezpočet služebnictva"
 court_servants_default_desc: "Hrstka služebnictva tohoto dvora je vyčerpaná snahou vyhovět každému přání hostů."
 court_servants_few_desc: "Tento dvůr má dost služebnictva, aby dokázalo zajistit téměř veškeré základní pohodlí."
 court_servants_some_desc: "Tento dvůr má specializované služebnictvo, které je na svou práci patřičně hrdé."
 court_servants_many_desc: "Tento dvůr má služebníka snad pro každý myslitelný účel."
 court_servants_endless_desc: "Tento dvůr má tolik služebnictva, že nikdo ani neví, co si s ním počít. Udělat i ten nejjednodušší úkon vlastníma rukama vyžaduje značné úsilí, aniž by se ho za tebe okamžitě snažil vykonat některý ze služebníků."
 court_servants_few_guest_recruitment: "Náklady na nábor [Concept('guest','hosta')|E]: #P -20%#!"
