l_polish:
 master_of_hunt_court_position_task_dangerous_game: "Stopovat nebezpečnou zvěř"
 master_of_hunt_court_position_task_dangerous_game_desc: "Tvůj $master_of_hunt_court_position$ bude stopovat nebezpečnou zvěř, například vlky či medvědy, jejíž lov přináší mnoho prestiže."
 master_of_hunt_court_position_task_dangerous_game_tt: "Každý rok má tvůj $master_of_hunt_court_position$ šanci objevit nebezpečnou zvěř. Po jejím [Concept('hunt_sighting_no_prefix','zpozorování')|E] se ti zpřístupní [GetActivityType('activity_hunt').GetTextIcon][GetActivityType('activity_hunt').GetName]\n$master_of_hunt_court_position_task_generic_tt$"
 master_of_hunt_court_position_task_regular_game: "Stopovat běžnou zvěř"
 master_of_hunt_court_position_task_regular_game_desc: "Tvůj $master_of_hunt_court_position$ bude stopovat běžnou zvěř, například lišky či jeleny, jejíž lov přináší průměrné množství prestiže."
 master_of_hunt_court_position_task_regular_game_tt: "Každý rok má tvůj $master_of_hunt_court_position$ šanci objevit běžnou zvěř. Po jejím [Concept('hunt_sighting_no_prefix','zpozorování')|E] se ti zpřístupní [GetActivityType('activity_hunt').GetTextIcon][GetActivityType('activity_hunt').GetName]\n$master_of_hunt_court_position_task_generic_tt$"
 master_of_hunt_court_position_task_legendary_game: "Stopovat legendární zvěř"
 master_of_hunt_court_position_task_legendary_game_desc: "Tvůj $master_of_hunt_court_position$ se bude pokoušet vystopovat legendární tvory, jejichž lov přináší obrovské množství prestiže."
 master_of_hunt_court_position_task_legendary_game_tt: "Každý rok má tvůj $master_of_hunt_court_position$ malou šanci objevit legendární zvěř. Po jejím [Concept('hunt_sighting_no_prefix','zpozorování')|E] se ti zpřístupní [GetActivityType('activity_hunt').GetTextIcon][GetActivityType('activity_hunt').GetName]\n$master_of_hunt_court_position_task_generic_tt$"
 master_of_hunt_court_position_task_generic_tt: "Četnost [Concept('hunt_sightings_no_prefix','zpozorování')|E] roste se [Concept('aptitude','způsobilostí')|E] #weak (nejvýše jedno zpozorování za 3 roky)#!"
 court_jester_court_position_task_entertain_court: "Bavit dvořany"
 court_jester_court_position_task_entertain_court_desc: "Tvůj $court_jester_court_position$ bude trávit čas tím, že bude bavit tvé dvořany vtipy, příběhy a akrobatickými kousky."
 court_jester_court_position_task_entertain_court_tt: "Každý rok má $court_jester_court_position$ šanci snížit [stress_loss_i] [Concept('stress','stres')|E] náhodnému [Concept('courtier','dvořanovi')|E] #weak (přednost mají ti, kdo jsou ti blízcí, například tvé [Concept('children','děti')|E])#!\nPokud je [Concept('aptitude','způsobilost')|E] alespoň $aptitude_good$, mohou být každý rok vybráni až dva [Concept('courtiers','dvořané')|E]"
 foreign_emissary_court_position_task_entertain_court_tt: "Každý rok má $foreign_emissary_court_position$ šanci snížit [stress_loss_i] [Concept('stress','stres')|E] náhodnému [Concept('courtier','dvořanovi')|E] #weak (přednost mají ti, kdo jsou ti blízcí, například tvé [Concept('children','děti')|E])#!\nPokud je [Concept('aptitude','způsobilost')|E] alespoň $aptitude_good$, mohou být každý rok vybráni až dva [Concept('courtiers','dvořané')|E]"
 court_jester_court_position_task_fuel_the_rumour_mill: "Přiživovat fámy"
 court_jester_court_position_task_fuel_the_rumour_mill_desc: "Tvůj $court_jester_court_position$ bude trávit čas šířením nesmyslných fám a zavádějících historek, aby zpomalil nepřátelské intriky."
 court_jester_court_position_task_fuel_the_rumour_mill_tt: "Každý rok má $court_jester_court_position$ šanci snížit [stress_loss_i] [Concept('stress','stres')|E] náhodnému [Concept('courtier','dvořanovi')|E] #weak (přednost mají ti, kdo jsou ti blízcí, například tvé [Concept('children','děti')|E])#!"
 court_jester_court_position_task_abuse_the_jester: "Zesměšňovat šaška"
 court_jester_court_position_task_abuse_the_jester_desc: "Tvůj $court_jester_court_position$ bude trávit čas snášením týrání a ponižování."
 court_jester_court_position_task_abuse_the_jester_tt: "Každý rok má $court_jester_court_position$ šanci snížit [stress_loss_i] [Concept('stress','stres')|E] náhodnému [Concept('courtier','dvořanovi')|E] #weak (přednost mají ti, kdo jsou ti blízcí, například tvé [Concept('children','děti')|E])#!"
 court_artificer_court_position_task_martial: "Vyrábět zbraně a zbroj a vyrážet za dobrodružstvím"
 court_artificer_court_position_task_martial_desc: "Tvůj $court_artificer_court_position$ bude hledat inspiraci k výrobě mečů, štítů a zbroje a k výpravám za dobrodružstvím pro vládce se zálibou ve vojenství."
 court_artificer_court_position_task_martial_tt: "Každý rok má $court_artificer_court_position$ šanci získat [Concept('inspiration','inspiraci')|E] pro #V Zbraň#!, #V Zbroj#! nebo #V Dobrodružství#! #weak (přednost mají [Concept('artifacts','artefakty')|E], které dosud nemáš)#!\n$court_artificer_court_position_task_improved_chances_tt$"
 court_artificer_court_position_task_learning: "Vyrábět knihy a tapiserie"
 court_artificer_court_position_task_learning_desc: "Tvůj $court_artificer_court_position$ bude hledat inspiraci k tvorbě knih, tapisérií či alchymistických směsí pro učeného vládce."
 court_artificer_court_position_task_learning_tt: "Každý rok má $court_artificer_court_position$ šanci získat [Concept('inspiration','inspiraci')|E] pro #V Knihu#!, #V Tkalcovství#! nebo #V Alchymii#! #weak (přednost mají [Concept('artifacts','artefakty')|E], které dosud nemáš)#!\n$court_artificer_court_position_task_improved_chances_tt$"
 court_artificer_court_position_task_stewardship: "Vyrábět koruny a sochy"
 court_artificer_court_position_task_stewardship_desc: "Tvůj $court_artificer_court_position$ bude hledat inspiraci k výrobě regálií, korun, trůnů a dalších artefaktů pro vládce se zálibou ve správcovství."
 court_artificer_court_position_task_stewardship_tt: "Každý rok má $court_artificer_court_position$ šanci získat [Concept('inspiration','inspiraci')|E] pro #V Kováře#! nebo #V Řemeslníka#!\n$court_artificer_court_position_task_improved_chances_tt$"
 court_artificer_court_position_task_improved_chances_tt: "Používání tohoto úkolu výrazně zvyšuje šanci na získání [Concept('inspiration','inspirace')|E]"
 must_have_an_equipped_illustrious_court_artifact: "Nemáš ve výbavě #V věhlasný#! [Concept('court_artifact','dvorský artefakt')|E]"
 must_have_upgradeable_artifact_tt: "Nemáš ve výbavě žádný [Concept('artifact','artefakt')|E], který lze vylepšit"
 antiquarian_court_position_task_scout_for_artifacts: "Pátrat po vzácných artefaktech"
 antiquarian_court_position_task_scout_for_artifacts_desc: "Tvůj $antiquarian_court_position$ bude pročítat starobylé svazky a prověřovat kusé zvěsti ve snaze najít někoho, kdo by mohl ke dvoru přinést něco velkolepého."
 antiquarian_court_position_task_scout_for_artifacts_tt: "Každý rok má $antiquarian_court_position$ šanci udělit někomu u [Concept('court','dvora')|E] [Concept('inspiration','inspiraci')|E] na #V Dobrodružství#! #weak (šance roste se [Concept('aptitude','způsobilostí')|E])#!"
 antiquarian_inspired_adventurer_message: "$antiquarian_court_position$: Inspirace k dobrodružství!"
 antiquarian_inspired_adventurer_effect: "[adventure_target.GetFirstName] ([ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('adventure_target'))]) získává [Concept('inspiration','inspiraci')|E] na #V Dobrodružství#!"
 antiquarian_court_position_task_improve_artifacts: "Vylepšovat artefakty"
 antiquarian_court_position_task_improve_artifacts_desc: "Tvůj $antiquarian_court_position$ bude vylepšovat a leštit artefakty, aby byly co nejpůsobivější a nejúčinnější."
 antiquarian_court_position_task_improve_artifacts_tt: "Každý rok má $antiquarian_court_position$ šanci vylepšit jeden vybavený [Concept('artifact','artefakt')|E]\nŠance na vylepšení #weak (#bold nikoli#! kvalita)#! roste se [Concept('aptitude','způsobilostí')|E]\nBěžné [Concept('artifacts','artefakty')|E] lze vylepšit jednou, mistrovské dvakrát a tak dále"
