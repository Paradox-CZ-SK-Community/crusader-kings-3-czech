 court_physician_tradition_bonus: "Z [Concept('culture_tradition','kulturní tradice')|E]"
 court_physician_court_position_desc: "$court_physician_court_position$ odpovídá za zdraví a blaho [Concept('court','dvora')|E], u něhož působí. Bude podle svých nejlepších schopností léčit nemoci a sešívat rány."
