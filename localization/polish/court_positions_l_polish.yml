 court_musician_court_position: "Dvorní hudebník"
 court_musician_employer_custom_effect_description: "$BULLET$Zvyšuje zisk [Concept('opinion','mínění')|E] při pořádání [GetActivityType('activity_feast').GetName]" # todo: CONCEPT CASE
