 yeke_jarquchi_culture_acceptance_tt: "[Concept('cultural_acceptance','Kulturní přijetí')|E] mezi kulturou [liege.GetCulture.GetName] a ostatními [Concept('cultures','kulturami')|E] v [Concept('realm','panství')|E] se každý rok zvýší o [liege.Custom('GetAptitudeYekeJarquchiLoc')] #weak (max. #V 50#!)#!"
