 court_poet_court_position_desc: "$court_poet_court_position$ je znalec slov a veršů, který poskytuje svému pánovi a celému dvoru zábavu, intelektuální stimulaci a emocionální prožitky."
 poet_inspired_message: "Přichází inspirace!"
 poet_inspired_effect: "Váš [GetCourtPositionType('court_poet_court_position').GetName()] [inspired_poet.GetFirstName] získal [Concept('inspiration','inspirace')|E]" # todo: CONCEPT CASE
 courtier_inspired_message: "$poet_inspired_message$"
 courtier_inspired_effect: "Váš [Concept('courtier','dvořan')|E] [inspired_courtier.GetFirstName] získal @inspiration_icon![Concept('inspiration','inspirace')|E]" # todo: CONCEPT CASE
 court_poet_skald: "Dvorní skald"
 court_poet_skald_desc: "$court_poet_skald$ je znalec slov a veršů, který svému pánovi i všem na dvoře poskytuje zábavu, intelektuální podněty a citové zážitky."
 bodyguard_court_position: "Osobní strážce"
 bodyguard_court_position_nomadic: "Kheshig"
 bodyguard_employer_custom_effect_description: "$BULLET$Má šanci zamezit pokusu o vraždu [GetScheme('murder').GetTypeName] [Concept('schemes','intriky')|E]#!\n#indent_newline:3 $BULLET$Snižuje riziko, že zemřete nebo budete zajati ve [Concept('battles','bitvách')|E], ve kterých bojujete společně#!#!" # todo: CONCEPT CASE
