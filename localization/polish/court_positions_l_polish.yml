 court_tutor_teach_kids_tt: "[Concept('children','Děti')|E] na [Concept('court','dvůr')|E] mají šanci každým rokem zvýšit jedno ze svých [diplomacy_i][stewardship_i][learning_i][martial_i][Concept('skills','dovedností')|E] o #p +1#! nebo #p +2#!" # todo: CONCEPT CASE
 royal_architect_court_position: "Královský architekt"
 royal_architect_court_position_desc: "$royal_architect_court_position$ dohlíží na prestižní stavební projekty v říši; žádná cihla není položená a haléř utracen bez jeho výslovného svolení."
 royal_architect_fortify_lands: "Opevnit země"
 royal_architect_fortify_lands_desc: "Tato postava má na starosti zajištění bezpečnosti panovníkových zemí a obyvatel."
 royal_architect_public_works: "Veřejné práce"
 royal_architect_public_works_desc: "Tato postava má na starosti rozvoj hlavního města."
 court_poet_court_position: "Dvorní básník"
