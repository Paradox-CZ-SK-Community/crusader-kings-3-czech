 grand_mentor_court_position: "Velký mentor"
 grand_mentor_court_position_desc: "$grand_mentor_court_position$ se stará o vzdělávání vládnoucí rodiny a je pověřen těžkým úkolem zajistit, aby další generace naplnila vznešený příklad svých předků."
 grand_mentor_court_position_task_edify_heirs: "Vychovávat císařské dědice" # todo: NEW TRANSLATION
 grand_mentor_court_position_task_edify_heirs_desc: "$grand_mentor_court_position$ zasvětí své dny pečlivému rozvoji nové generace."
 grand_mentor_edify_heirs_tt: "Každý měsíc mohou členové vládnoucího [Concept('house','rodu')|E], kteří jsou [Concept('courtiers','dvořané')|E] nebo [Concept('direct_vassals','přímí vazalové')|E] [Concept('liege','lenní pán')|E], získat [diplomacy_i][stewardship_i][learning_i][martial_i][Concept('skills','dovednosti')|E], [GetTrait('governor').GetName( GetPlayer )] nebo [GetTrait('confucian_education').GetName( GetPlayer )] [Concept('trait_level_track_xp','zkušenosti rysu')|E]" # todo: CONCEPT CASE
