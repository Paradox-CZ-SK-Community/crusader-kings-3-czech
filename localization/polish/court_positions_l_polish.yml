 foreign_emissary_court_position: "Cizí vyslanec"
 foreign_emissary_court_position_desc: "$foreign_emissary_court_position$ je najímán zdaleka, aby ohromoval dvůr svého lenního pána exotickými příběhy a působil jako diplomat vůči sousedním vládcům."
 court_position_different_culture: "Jsou jiné [Concept('culture','kultury')|E]"
 foreign_emissary_culture_acceptance_tt: "[Concept('cultural_acceptance','Kulturní přijetí')|E] mezi kulturou [liege.GetCulture.GetName] a [Concept('tributary','tributářskými')|E] [Concept('cultures','kulturami')|E] se každý rok zvýší o [liege.Custom('GetAptitudeForeignEmissaryLoc')] #weak (max. #V 50#!)#!"
