 faith_allows_recruitment_court_position: "#bold Nejsou#! součástí [Concept('clergy','duchovenstva')|E], nebo víra jejich [Concept('liege','lenního pána')|E] umožňuje najímání [Concept('clergy','duchovenstva')|E]"
