 grand_mentor_court_position_task_train_officials: "Vychovávat záslužné úředníky"
 grand_mentor_court_position_task_train_officials_desc: "$grand_mentor_court_position$ zajistí, aby úředníci říše měli schopnosti odpovídající jejich moudrosti a ctnosti."
 grand_mentor_train_officials_tt: "Každý měsíc může držitel [Concept('court_position','dvorský úřad')|E] nebo [Concept('direct_vassal','přímý vazal')|E] získat [diplomacy_i][stewardship_i][learning_i][martial_i][Concept('skills','dovednosti')|E], [GetTrait('governor').GetName( GetPlayer )] nebo [GetTrait('confucian_education').GetName( GetPlayer )] [Concept('trait_level_track_xp','zkušenosti rysu')|E], nebo [Concept('merit','zásluhy')|E]" # todo: CONCEPT CASE
