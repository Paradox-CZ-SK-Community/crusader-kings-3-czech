 court_physician_not_employed_or_away_tt: "Nemáš postavu [GetCourtPositionType('court_physician_court_position').GetName()], nebo není s tebou"
 hire_physician_decision: "Vyhledat lékaře"
 hire_physician_decision_tooltip: "Tví služebníci navrhnou několik vhodných kandidátů na úřad [GetCourtPositionType('court_physician_court_position').GetName()]"
 hire_physician_decision_desc: "$court_physician_court_position$ je nezbytný pro péči o nemocné a raněné u mého [ROOT.Char.Custom('GetCourtLower')]. Požádám své služebníky, aby přivedli několik vhodných kandidátů."
 hire_physician_decision_effect_tooltip: "Bude ti představena skupina kandidátů na úřad [GetCourtPositionType('court_physician_court_position').GetName()] a jednoho z nich budeš moci najmout za poplatek a měsíční plat [gold_i][SCOPE.ScriptValue('court_position_physician_salary')]"
 hire_physician_decision_confirm: "Zahájit hledání"
 antiquarian_employer_custom_effect_description: "[SelectLocalization( HasDlcFeature( 'court_artifacts' ), 'antiquarian_employer_custom_effect_reforge_description', '' )]$BULLET$Zpřístupňuje [Concept('decision','rozhodnutí')|E] #V $commission_artifact_decision$#!\n$BULLET$Chrání [Concept('artifacts','artefakty')|E] během [Concept('sieges','obléhání')|E] a [Concept('raids','nájezdů')|E]"
 antiquarian_employer_custom_effect_reforge_description: "$BULLET$Umožňuje ti [Concept('reforge','překovávat')|E] [Concept('artifacts','artefakty')|E]\n"
 chief_eunuch_court_position: "Vrchní eunuch"
 chief_eunuch_court_position_desc: "$chief_eunuch_court_position$ je důvěryhodný služebník odpovědný za eunuchy u dvora. Máločemu se stane, že by se o tom nedozvěděl – jak mezi služebnictvem, tak mezi urozenými."
 keeper_of_swans_court_position: "Strážce labutí"
 keeper_of_swans_court_position_desc: "$keeper_of_swans_court_position$ má na starosti královské labutě. Sčítá opeřené skvosty, na něž si jeho lenní pán činí nárok, a pečuje o ně; s tímto úřadem se pojí závažné povinnosti."
 master_of_horse_court_position: "Vrchní podkoní"
 master_of_horse_court_position_desc: "$master_of_horse_court_position$ odpovídá za vznešené oře a stáje svého lenního pána. Má plné ruce práce, neboť dobře udržovaný kůň je přínosem jak na bojišti, tak na cestách."
 master_of_horse_oversee_breeding: "Dohlížet na chov"
 master_of_horse_oversee_breeding_desc: "Tato postava má za úkol dohlížet na chov v královských stájích."
 master_of_horse_mightiest_warhorse: "Péče o válečného oře"
 master_of_horse_mightiest_warhorse_desc: "Válečnému vládci je hoden pouze ten nejlepší z ořů."
 court_jester_court_position: "Dvorní šašek"
 court_jester_employer_custom_effect_description: "$BULLET$Zpřístupňuje [Concept('decision','rozhodnutí')|E] #V $jester_entertainment_decision$#!"
 court_jester_court_position_desc: "$court_jester_court_position$ – blázen – je tu od toho, aby bavil jak svého lenního pána, tak hosty navštěvující dvůr. Chytrý obrat se čas od času ocení, ale nepěkný pád vždy vyvolá smích."
 master_of_hunt_court_position: "Vrchní lovčí"
 master_of_hunt_court_position_nomadic: "Vrchní lovčí"
 master_of_hunt_employer_custom_effect_description: "$BULLET$[GetActivityType('activity_hunt').GetName] – [Concept('hunt_success_chance_no_prefix','šance na úspěch')|E] se zvyšuje se [Concept('aptitude','způsobilostí')|E]"
 master_of_hunt_employee_custom_effect_description: "Zvýšená [Concept('hunt_success_chance_no_prefix','šance na úspěch')|E] při aktivitě [GetActivityType('activity_hunt').GetName]"
 master_of_hunt_court_position_desc: "$master_of_hunt_court_position$ odpovídá za všechny lovecké družiny, které pořádají členové dvora jeho lenního pána. Má také na starosti psince a psy v nich."
 master_of_hunt_court_position_nomadic_desc: "$master_of_hunt_court_position_nomadic$ odpovídá za velké lovecké družiny a zajištění úspěšného lovu pro svého lenního pána."
 high_almoner_court_position: "Vrchní almužník"
 high_almoner_court_position_desc: "$high_almoner_court_position$ má na starosti rozdělování almužen zasloužilým chudým a dalším poddaným v nouzi."
 cupbearer_court_position: "Číšník"
 cupbearer_employer_custom_effect_description: "$BULLET$Šance zastavit jedovaté [Concept('schemes','intriky')|E] typu [GetScheme('murder').GetTypeName]#!"
 cupbearer_court_position_desc: "$cupbearer_court_position$ odpovídá za nalévání nápojů u královského stolu a dbá na to, aby nikomu nikdy nevyschl pohár."
 seneschal_court_position: "Senešal"
 seneschal_court_position_desc: "$seneschal_court_position$ zastává důležitou úlohu v každodenním chodu královské domácnosti, spravuje služebnictvo a dbá na to, aby vše běželo hladce."
 seneschal_improve_court: "Organizovat dvůr"
 seneschal_improve_court_desc: "Tato postava organizuje dvůr a zajišťuje, aby všichni plnili své povinnosti."
 seneschal_improve_court_task_tt: "@aptitude:4:color_green![Concept('aptitude','Způsobilost')|E] ostatních [Concept('court_positions','dvorských úřadů')|E]: #p +[SCOPE.ScriptValue('seneschal_improve_court_value')|0]#!"
 seneschal_improve_court_task_fallback_tt: "@aptitude:4:color_green![Concept('aptitude','Způsobilost')|E] ostatních [Concept('court_positions','dvorských úřadů')|E]: #p +2/+10#!"
 seneschal_improve_domain: "Spravovat doménu"
 seneschal_improve_domain_desc: "Tato postava má za úkol spravovat panství svého lenního pána."
 seneschal_handling_estate: "Starat se o statek"
 seneschal_handling_estate_desc: "Tato postava má za úkol pečovat o statek svého lenního pána."
 antiquarian_court_position: "Antikvář"
 antiquarian_court_position_desc: "$antiquarian_court_position$ odpovídá za údržbu, péči a obstarávání artefaktů."
 court_tutor_court_position: "Dvorní učitel"
 court_tutor_court_position_desc: "$court_tutor_court_position$ má na starosti [Concept('education','vzdělání')|E] všech dětí u dvora a jeho dovednosti ovlivní, nakolik bude na žáky působit. Děti mohou mít i nadále jednotlivé [Concept('guardians','poručníky')|E]."
 court_tutor_employer_custom_effect_description: "$BULLET$Působí jako [Concept('guardian','poručník')|E] pro [Concept('children','děti')|E], které žádného nemají\n$BULLET$Zpřístupňuje [Concept('interaction','interakci')|E] #V $make_child_learn_language_interaction$#!"
 court_tutor_improve_others: "Vyučovat dvůr"
 court_tutor_improve_others_desc: "Tato postava má za úkol pomáhat zbytku dvora."
 court_tutor_improve_others_title: "Vyučování postavou [ROOT.Char.GetName]"
 court_tutor_improve_others_notification_desc: "[target_character.GetShortUIName|U] [CharHaveHas( target_character )] díky pomoci postavy [ROOT.Char.GetShortUIName] zlepšil[Select_CString( target_character.IsFemale, 'a', '' )] své dovednosti"
 court_tutor_improve_others_fallback_tt: "[Concept('liege','lenní pán')|E], [Concept('heir','dědic')|E] lenního pána nebo jiní držitelé [Concept('court_position','dvorského úřadu')|E] u [Concept('court','dvora')|E] mohou každý měsíc získat [diplomacy_i][stewardship_i][learning_i][martial_i][Concept('skills','dovednosti')|E] nebo [Concept('traits','rysy')|E]"
 court_tutor_teach_kids: "Vzdělávat děti"
 court_tutor_teach_kids_desc: "Tato postava zachází ve své povinnosti vzdělávat děti dvora nad rámec běžného očekávání."
 court_tutor_teach_kids_title: "Učitel vzdělává dítě"
 court_tutor_teach_kids_notification_desc: "Tvůj [court_owner.Custom2('RelationToMeShort', SCOPE.sC('child') )] byl vyučován postavou [court_tutor_scope.GetShortUIName]"
 court_tutor_teach_kids_notification_desc_you: "Byl[Select_CString( GetPlayer.IsFemale, 'a', '' )] jsi vyučován[Select_CString( GetPlayer.IsFemale, 'a', '' )] postavou [court_tutor_scope.GetShortUIName]"
 court_tutor_teach_kids_tt: "[Concept('children','Děti')|E] u [Concept('court','dvora')|E] mají každý rok šanci, že se jedna z jejich [diplomacy_i][stewardship_i][learning_i][martial_i][Concept('skills','dovedností')|E] zvýší o #p +1#! nebo #p +2#!"
 royal_architect_court_position: "Královský architekt"
 royal_architect_court_position_desc: "$royal_architect_court_position$ dohlíží na všechny prestižní stavební projekty v panství; bez jeho výslovného svolení není položena jediná cihla ani promarněna jediná chvíle."
 royal_architect_fortify_lands: "Opevňovat země"
 royal_architect_fortify_lands_desc: "Tato postava má za úkol zajišťovat bezpečí zemí a lidu svého lenního pána."
 royal_architect_public_works: "Veřejné stavby"
 royal_architect_public_works_desc: "Tato postava má za úkol řídit rozvoj hlavního sídla."
 court_poet_court_position: "Dvorní básník"
 court_poet_employer_custom_effect_description: "$BULLET$Může se náhodně stát [Concept('inspired','inspirovaným')|E]"
 court_poet_court_position_desc: "$court_poet_court_position$ je znalcem slov a veršů, který svému lennímu pánovi i všem u dvora poskytuje zábavu, intelektuální podněty a citové prožitky."
 poet_inspired_message: "Zrodila se inspirace!"
 poet_inspired_effect: "Tvůj [GetCourtPositionType('court_poet_court_position').GetName()] [inspired_poet.GetFirstName] získal[Select_CString( inspired_poet.IsFemale, 'a', '' )] [Concept('inspiration','inspiraci')|E]"
 courtier_inspired_message: "$poet_inspired_message$"
 courtier_inspired_effect: "Tvůj [Concept('courtier','dvořan')|E] [inspired_courtier.GetFirstName] získal[Select_CString( inspired_courtier.IsFemale, 'a', '' )] @inspiration_icon![Concept('inspiration','inspiraci')|E]"
 court_poet_skald: "Dvorní skald"
 court_poet_skald_desc: "$court_poet_skald$ je znalcem slov a veršů, který svému lennímu pánovi i všem u dvora poskytuje zábavu, intelektuální podněty a citové prožitky."
 bodyguard_court_position: "Osobní strážce"
 bodyguard_court_position_nomadic: "Kešig"
 bodyguard_employer_custom_effect_description: "$BULLET$Má šanci zabránit vražedným [Concept('schemes','intrikám')|E] typu [GetScheme('murder').GetTypeName]#!\n#indent_newline:3 $BULLET$Snižuje tvé riziko smrti nebo zajetí v [Concept('battles','bitvách')|E], v nichž oba bojujete#!#!"
 stooge_employer_custom_effect_description: "$BULLET$Zpřístupňuje zvláštní možnosti v událostech\n#indent_newline:3 $BULLET$Zpřístupňuje [Concept('decision','rozhodnutí')|E] $humiliate_the_stooge_decision$#!#!"
 bodyguard_court_position_desc: "$bodyguard_court_position$ je poslední obrannou linií proti všem útočníkům. Kamkoli jde jeho svěřenec, tam ho následuje, a nebude váhat postavit se do cesty jakémukoli nebezpečí, které tam může číhat."
 bodyguard_court_position_nomadic_desc: "$bodyguard_court_position_nomadic$ má čest bránit svého lenního pána v bitvě i v míru. Dělí se na denní a noční stráž a je vždy připraven nasadit vlastní život."
 champion_court_position: "Osobní šampion"
 champion_employer_custom_effect_description: "$BULLET$Může tě zastoupit v některých [Concept('single_combat_duel_plural','duelech')|E]\n[AddLocalizationIf( HasDlcFeature( 'tours_and_tournaments' ), 'champion_employer_custom_effect_description_TOTO_DLC' )]"
 champion_employer_custom_effect_description_TOTO_DLC: "$BULLET$Získává ti [Concept('prestige','prestiž')|E], když soutěží v aktivitě [GetActivityType( 'activity_tournament' ).GetName]"
 champion_court_position_desc: "$champion_court_position$ je zkušený a smrtonosný bojovník, který může zastupovat svého lenního pána v duelech."
 champion_compete_task: "Soutěžit jménem pána"
 champion_compete_task_desc: "Tato postava se aktivně účastní místních turnajů po celém panství jménem svého lenního pána."
 champion_exercise_ruler: "Cvičit s vládcem"
 champion_exercise_ruler_desc: "Tato postava má za úkol dbát na to, aby její lenní pán zůstával zdravý a v dobré kondici."
 champion_exercise_ruler_fallback_tt: "[Concept('liege','Lenní pán')|E] může každý měsíc získat [prowess_i][Concept('prowess_skill','udatnost')|E]"
 champion_exercise_ruler_title: "Cvičení s postavou [ROOT.Char.GetShortUIName]"
 champion_exercise_ruler_notification_desc: "[liege.GetShortUIName|U] [CharHaveHas( liege )] byl[Select_CString( liege.IsFemale, 'a', '' )] vyučován[Select_CString( liege.IsFemale, 'a', '' )] postavou [ROOT.Char.GetShortUIName]"
 champion_improve_self: "Zlepšovat dovednosti"
 champion_improve_self_desc: "Tato postava se soustředí na zlepšování svých dovedností osobního šampiona."
 champion_improve_self_fallback_tt: "Každý měsíc má tato postava šanci získat [GetTrait('tourney_participant').GetName( GetNullCharacter )] [Concept('trait_level_track_xp','zkušenosti rysu')|E] nebo [prowess_i][Concept('prowess_skill','udatnost')|E]"
 court_musician_court_position: "Dvorní hudebník"
 court_musician_employer_custom_effect_description: "$BULLET$Zvyšuje zisk [Concept('opinion','mínění')|E] při pořádání aktivity [GetActivityType('activity_feast').GetName]"
 court_musician_court_position_desc: "$court_musician_court_position$ je umělec, který zpívá a hraje na nástroje, aby bavil svého lenního pána i dvůr."
 food_taster_court_position: "Ochutnávač jídel"
 food_taster_employer_custom_effect_description: "$BULLET$Šance zastavit jedovaté [Concept('schemes','intriky')|E] typu [GetScheme('murder').GetTypeName]#!"
 food_taster_court_position_desc: "$food_taster_court_position$ má vážnou povinnost zajistit, aby se talíře jeho lenního pána nikdy nedotkl jed. A pokud se nějaký hanebný prášek či tekutina přece jen do jídla dostane... nu, právě proto musí ochutnávač ochutnat jídlo ještě před začátkem hostiny."
 lady_in_waiting_court_position: "Dvorní dáma"
 lady_in_waiting_court_position_desc: "$lady_in_waiting_court_position$ je pomocnice a společnice královny nebo císařovny, která se stará o každou její potřebu a plní každý její rozmar."
 executioner_court_position: "Popravčí"
 executioner_employer_custom_effect_description: "$BULLET$Může veřejně [Concept('execute','popravovat')|E] [Concept('prisoners','vězně')|E] za účelem zvýšení [Concept('control','kontroly')|E] a [Concept('county_opinion','lidového mínění')|E]\n@warning_icon! #X Zločiny postavy budou odpuštěny#!"
 executioner_court_position_desc: "Popravčí jsou zločinci, kteří výměnou za svobodu musí popravovat veškeré nepřátele trůnu. Někdo by to nazval poctou, jiný břemenem."
 executioner_terrify_court: "Děsit dvůr"
 executioner_terrify_court_desc: "Tato postava je voděna po dvoře, aby každý věděl, že ho od špalku dělí jen jediný krok."
 garuda_court_position: "Garuda"
 garuda_employer_custom_effect_description: "$BULLET$Snižuje tvé riziko smrti nebo zajetí v bitvách, v nichž oba bojujete"
 garuda_court_position_desc: "Tento rytíř přísahal, že splní vůli svého lenního pána, nebo při tom zemře. Stejně jako mytický pták $garuda_court_position$ nesl tíhu Višnua, nesou válečníci $garuda_court_position$ svrchovanost panovníka."
 court_gardener_court_position: "Dvorní zahradník"
 court_gardener_court_position_desc: "$court_gardener_court_position$ odpovídá za blaho zahrad patřících jeho lennímu pánovi a věnuje čas i dovednost tomu, aby skutečně vzkvétaly."
 chief_qadi_court_position: "Vrchní kádí"
 chief_qadi_court_position_desc: "$chief_qadi_court_position$ je nejvyšším soudcem panství a odpovídá za uplatňování islámského práva v různých sporech a právních záležitostech."
 cultural_emissary_court_position: "Kulturní vyslanec"
 cultural_emissary_court_position_desc: "Účelem úřadu $cultural_emissary_court_position$ je podporovat porozumění mezi různými kulturami prostřednictvím oslav a úcty."
 court_artificer_court_position: "Dvorní řemeslník"
 court_artificer_court_position_desc: "$court_artificer_court_position$ je někdo, kdo prokázal schopnost tvořit velká díla. Ačkoli většinou jen pobývá u tvého dvora, nadějí je, že ho znovu zasáhne inspirace."
 court_artificer_employer_custom_effect_description: "$BULLET$Má šanci znovu získat [Concept('inspired','inspiraci')|E] podle [Concept('aptitude','způsobilosti')|E]\n@alert_icon! #alert_trial Pokud bude propuštěn, opustí [Concept('court','dvůr')|E]#!"
 court_artificer_inspired_effect: "Tvůj [GetCourtPositionType('court_artificer_court_position').GetName()] [artificer.GetFirstName] získal[Select_CString( artificer.IsFemale, 'a', '' )] [Concept('inspiration','inspiraci')|E]"
