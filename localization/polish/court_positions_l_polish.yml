 food_taster_court_position: "Dvorní ochutnávač jídla"
 food_taster_employer_custom_effect_description: "$BULLET$Šance zamezit otrávení u [GetScheme('murder').GetTypeName] [Concept('schemes','intrik')|E]#!" # todo: CONCEPT CASE
