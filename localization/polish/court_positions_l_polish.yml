 fire_dragon_engineer_court_position: "Inženýr ohnivého draka"
 fire_dragon_engineer_court_position_desc: "$fire_dragon_engineer_court_position$ je mistr střelných zbraní, který vyzbrojuje vojska děsivými nástroji války chrlícími plameny."
 fire_dragon_engineer_court_position_forge_fire_dragons: "Odlívat ohnivé draky"
 fire_dragon_engineer_court_position_forge_fire_dragons_desc: "$fire_dragon_engineer_court_position$ zaměří svou energii na výrobu střelných zbraní, aby udržoval bohatý arzenál vždy připraven."
 fire_dragon_engineer_court_position_command_artillery: "Velit dělostřelectvu"
 fire_dragon_engineer_court_position_command_artillery_desc: "$fire_dragon_engineer_court_position$ osobně dohlíží na nasazení a používání svých ničivých nástrojů na bitevním poli."
 keeper_of_the_harem_court_position: "Správce harému"
 keeper_of_the_harem_court_position_desc: "$keeper_of_the_harem_court_position$ zastává významné postavení v císařském harému, dohlíží na vše od oděvů konkubín až po příznivé načasování císařských styků."
 keeper_of_the_harem_court_position_task_maintain_decorum: "Udržovat slušnost v harému"
 keeper_of_the_harem_court_position_task_maintain_decorum_desc: "$keeper_of_the_harem_court_position$ se zaměří na potlačení jedovatých intrik v harému a ochranu před nežádoucí pozorností z vnějšího světa."
 keeper_of_the_harem_maintaining_decorum.tt: "$keeper_of_the_harem_court_position$ bude výrazně ztěžovat [Concept('schemes','intriky')|E] zaměřené na členy harému." # todo: CONCEPT CASE
 keeper_of_the_harem_court_position_task_attend_to_wellness: "Pečovat o zdraví konkubín"
 keeper_of_the_harem_court_position_task_attend_to_wellness_desc: "$keeper_of_the_harem_court_position$ bude věnovat zvláštní pozornost zdraví a pohodlí harému, léčit nemocné a ulehčovat jejich trápení."
 keeper_of_the_harem_attend_to_wellness.tt: "$keeper_of_the_harem_court_position$ bude každý měsíc vyhledávat a ošetřovat nemocného člena harému, čímž sníží jejich stres a zmírní příznaky nemoci."
 keeper_of_the_harem_court_position_task_select_palace_beauties: "Vyhledávat palácové krásky"
 keeper_of_the_harem_court_position_task_select_palace_beauties_desc: "$keeper_of_the_harem_court_position$ bude pravidelně přehodnocovat složení harému, s grácií propouštět zestárlé a bezdětné a nahrazovat je nadanými a půvabnými novými členkami."
 keeper_of_the_harem_select_palace_beauties.tt: "Každý rok může $keeper_of_the_harem_court_position$ propustit jednu zestárlou a bezdětnou konkubínu a přijmout do harému novou."
 court_guru_court_position: "Guru"
 court_guru_court_position_desc: "Guru slouží jako rádce i mudrc, který vládci poskytuje vedení v pozemských záležitostech i duchovních pravdách."
 guru_teach_learning: "Prosvětlit mysl"
 guru_teach_learning_desc: "Guru sdílí posvátné texty a učenou moudrost, aby zostřil intelekt svého pána."
 guru_teach_diplomacy: "Zjemnit řeč"
 guru_teach_diplomacy_desc: "Guru vyučuje dvorní řeči, rozvážnému mlčení a umění ladného přesvědčování."
 guru_teach_intrigue: "Ostřit smysly"
 guru_teach_intrigue_desc: "Prostřednictvím podobenství a jemných her guru trénuje vládce, aby rozpoznal skryté úmysly a klamal s elegancí."
 court_brahmin_court_position: "Dvorský bráhmín"
 court_brahmin_court_position_desc: "Ctihodný kněz, který se vyskytuje jak u hinduistických, tak u buddhistických dvorů. Dvorský bráhmín je zodpovědný za vykonávání rituálů, dohlížení na obřady a posilování legitimity vládce."
 court_brahmin_court_position_task_increase_tribute: "Zvýšit tribut"
 court_brahmin_court_position_task_increase_tribute_desc: "Tato postava se pečlivě věnuje posilování toku bohatství od vazalů k suverénovi."
 khlon_glan_court_position: "Khlon Glan"
 khlon_glan_court_position_desc: "Khlon Glan je vysoký úředník, který má na starosti správu státních skladů a vojenských zásob."
 khlon_glan_assist_provisioning: "Rozvíjet hlavní město" # todo: NEW TRANSLATION
 khlon_glan_assist_provisioning_desc: "Tato postava se zaměřuje na zlepšování mandalového hlavního města."
 favored_minister_court_position: "Oblíbený ministr"
 favored_minister_court_position_desc: "$favored_minister_court_position$ je vyvolený oblíbenec [Concept('councillor','rádce')|E] [Concept('celestial','nebeská')|E] [Concept('son_of_heaven','syn Nebes')|E] a má volnost řídit své ministerstvo podle vlastního uvážení." # todo: CONCEPT CASE
