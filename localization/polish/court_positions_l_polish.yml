 chief_eunuch_court_position_desc: "$chief_eunuch_court_position$ je důvěryhodný služebník odpovědný za eunuchy na dvoře. Mnoho věcí se u něj dozví, jak mezi služebnictvem, tak i u panstva."
 keeper_of_swans_court_position: "Ošetřovatel labutí"
 keeper_of_swans_court_position_desc: "$keeper_of_swans_court_position$ má na starosti královské labutě. Počítá počet okřídlených pokladů, o které se jejich panovník stará, a poskytuje jim péči; tato pozice nese velkou odpovědnost."
 master_of_horse_court_position: "Královský podkoní"
 master_of_horse_court_position_desc: "$master_of_horse_court_position$ odpovídá za panovníkovy vznešené koně a stáje. Má co dělat, protože dobře udržovaný kůň je výhoda jak na bojišti, tak na cestách."
 master_of_horse_oversee_breeding: "Dohlížet na chov"
 master_of_horse_oversee_breeding_desc: "Tato postava má na starosti dohled nad chovem koní v královských stájích."
 master_of_horse_mightiest_warhorse: "Péče o válečného koně"
 master_of_horse_mightiest_warhorse_desc: "Jen toho nejlepšího oře si zaslouží panovník připravený k boji."
 court_jester_court_position: "Dvorní šašek"
 court_jester_employer_custom_effect_description: "$BULLET$Odemkne #V $jester_entertainment_decision$#! [Concept('decision','rozhodnutím')|E]" # todo: CONCEPT CASE
 court_jester_court_position_desc: "$court_jester_court_position$ – šašek – je tu, aby zabavil svého panovníka i hosty dvora. Zatímco občas potěší chytrá slovní hříčka, příslovečný pád vždy vyvolá smích."
 master_of_hunt_court_position: "Královský lovčí"
 master_of_hunt_court_position_nomadic: "Mistr honu"
 master_of_hunt_employer_custom_effect_description: "$BULLET$[GetActivityType('activity_hunt').GetName] [Concept('hunt_success_chance_no_prefix','Šance na úspěch')|E] se zvyšuje s [Concept('aptitude','způsobilostí')|E]" # todo: CONCEPT CASE
 master_of_hunt_employee_custom_effect_description: "Zvýšená [Concept('hunt_success_chance_no_prefix','šance na úspěch')|E] u [GetActivityType('activity_hunt').GetName]" # todo: CONCEPT CASE
 master_of_hunt_court_position_desc: "$master_of_hunt_court_position$ je zodpovědný za lovecké výpravy pořádané členy panovníkova dvora. Má také na starosti lovecké psi a jejich štěňata."
 master_of_hunt_court_position_nomadic_desc: "$master_of_hunt_court_position_nomadic$ je odpovědný za velké lovecké výpravy a za zajištění úspěchu lovu pro svého pána."
 high_almoner_court_position: "Dvorní almužník"
 high_almoner_court_position_desc: "$high_almoner_court_position$ má na starosti rozdělování almužen zasloužným chudým a dalším potřebným."
 cupbearer_court_position: "Dvorní šenk"
 cupbearer_employer_custom_effect_description: "$BULLET$Šance zadržet otrávení u [GetScheme('murder').GetTypeName] [Concept('schemes','intrik')|E]#!" # todo: CONCEPT CASE
 cupbearer_court_position_desc: "$cupbearer_court_position$ má na starosti nalévání nápojů u královského stolu a dbá na to, aby nikomu neubylo v poháru."
 seneschal_court_position: "Senešal"
 seneschal_court_position_desc: "$seneschal_court_position$ zastává důležitou roli v běžném životě královského sídla, řídí služebnictvo a udržuje chod všeho hladký."
 seneschal_improve_court: "Organizovat dvůr"
 seneschal_improve_court_desc: "Tato postava organizuje dvůr, aby každý plnil svou práci."
 seneschal_improve_court_task_tt: "@aptitude:4:color_green![Concept('aptitude','Způsobilost')|E] ostatních [Concept('court_positions','dvorských úřadů')|E]: #p +[SCOPE.ScriptValue('seneschal_improve_court_value')|0]#!" # todo: CONCEPT CASE
