 minister_bureaucrat_court_position: "Úřední pomocník"
 minister_bureaucrat_court_position_desc: "Ve vyšších patrech nebeské vlády je zapotřebí velké množství úředníků. Pečlivě vybraní vedoucími každého oddělení zajišťují, že vše funguje hladce."
 minister_bureaucrat_court_position_mod_desc: "$EFFECT_LIST_BULLET$Pomocník zlepšuje různé úkoly související s [Concept('ministry','ministerstvem')|E], jako jsou [Concept('great_projects','velké projekty')|E] (založeno na [Concept('aptitude','způsobilost')|E])" # todo: CONCEPT CASE
