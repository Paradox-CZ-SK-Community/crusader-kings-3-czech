 keeper_of_the_horses_court_position: "Podkoní"
 keeper_of_the_horses_court_position_desc: "$keeper_of_the_horses_court_position$ je prestižní post, který má na starosti koně a stáje svého pána."
 court_position_confucian_education_trait: "[GetTrait('confucian_education').GetName( ROOT.Char )]"
 court_physician_celestial_imperial: "Palácový lékař"
 court_physician_celestial_imperial_desc: "$court_physician_celestial_imperial$ je zodpovědný za zdraví a pohodu [Concept('court','dvůr')|E], ve kterém působí. Léčí nemoci a zašívá rány podle svých nejlepších schopností." # todo: CONCEPT CASE
 court_physician_celestial: "Hlavní lékař"
 court_physician_celestial_desc: "$court_physician_celestial$ je zodpovědný za zdraví a pohodu [Concept('court','dvůr')|E], ve kterém působí. Léčí nemoci a zašívá rány podle svých nejlepších schopností." # todo: CONCEPT CASE
 court_astrologer_celestial_imperial: "Hlavní astrolog"
 court_astrologer_celestial_imperial_desc: "$court_astrologer_celestial_imperial$ zkoumá oblohu, aby předpověděl, jaký osud nás může potkat."
 court_astrologer_celestial: "Věštec"
 court_astrologer_celestial_desc: "$court_astrologer_celestial$ zkoumá oblohu, aby předpověděl, jaký osud nás může potkat."
 travel_leader_celestial_imperial: "Čistič cesty"
 travel_leader_celestial_imperial_desc: "$travel_leader_celestial_imperial$ Vám pomáhá při cestování a má na starosti všechny itineráře. Usiluje o to, aby jste se dostal do cíle bezpečně a včas."
 travel_leader_celestial: "Vrchní průzkumník"
 travel_leader_celestial_desc: "$travel_leader_celestial$ Vám pomáhá při cestování a má na starosti všechny itineráře. Usiluje o to, aby jste se dostal do cíle bezpečně a včas."
 antiquarian_celestial: "Strážce pokladů"
 antiquarian_celestial_desc: "$antiquarian_celestial$ je zodpovědný za údržbu, péči a získávání artefaktů."
 seneschal_celestial: "Senešal"
 seneschal_celestial_desc: "$seneschal_celestial$ hraje důležitou roli v každodenním chodu královského dvora, řídí služebnictvo a zajišťuje plynulý provoz."
 court_tutor_celestial: "Erudovaný učitel"
 court_tutor_celestial_desc: "$court_tutor_celestial$ má na starosti [Concept('education','vzdělání')|E] všech dětí u dvora a jeho dovednosti ovlivňují, jaký bude mít vliv na své žáky. Děti mohou mít i své vlastní [Concept('guardians','poručníky')|E]." # todo: CONCEPT CASE
 chief_eunuch_celestial_imperial: "Vrchní eunuch"
 chief_eunuch_celestial_imperial_desc: "$chief_eunuch_celestial_imperial$ je důvěryhodný služebník zodpovědný za eunuchy u dvora. Máloco se děje, o čem by neslyšel – jak mezi služebníky, tak mezi šlechtou."
 chief_eunuch_celestial: "Hlavní eunuch"
 chief_eunuch_celestial_desc: "$chief_eunuch_celestial$ je důvěryhodný služebník zodpovědný za eunuchy u dvora. Máloco se děje, o čem by neslyšel – jak mezi služebníky, tak mezi šlechtou."
 master_of_horse_celestial_imperial: "Stájmistr"
 master_of_horse_celestial_imperial_desc: "$master_of_horse_celestial_imperial$ je zodpovědný za vznešené koně a stáje svého pána. Má plné ruce práce, neboť dobře udržovaný kůň je výhodou jak na bitevním poli, tak na cestách."
 master_of_horse_celestial: "Štolba"
 master_of_horse_celestial_desc: "$master_of_horse_celestial$ je zodpovědný za vznešené koně a stáje svého pána. Má plné ruce práce, neboť dobře udržovaný kůň je výhodou jak na bitevním poli, tak na cestách."
 master_of_hunt_celestial: "Správce lovů"
 master_of_hunt_celestial_desc: "$master_of_hunt_celestial$ je zodpovědný za všechny lovecké výpravy, které členové dvora svého pána pořádají. Má také na starosti psince a psy, kteří se v nich nacházejí."
 cave_hermit_celestial: "Moudrý poustevník"
 cave_hermit_celestial_desc: "$cave_hermit_celestial$ je osoba, která obývá pozemky tvého hradu a baví hosty proroctvími a hádankami. Někteří říkají, že může jít o skutečného mystika."
 court_gardener_celestial_imperial: "Hlavní zahradník"
 court_gardener_celestial_imperial_desc: "$court_gardener_celestial_imperial$ je zodpovědný za údržbu a péči o zahrady svého pána, do kterých vkládá svůj čas i um, aby byly krásně rozkvetlé."
 court_gardener_celestial: "Zahradník"
 court_gardener_celestial_desc: "$court_gardener_celestial$ je zodpovědný za údržbu a péči o zahrady svého pána, do kterých vkládá svůj čas i um, aby byly krásně rozkvetlé."
 chronicler_celestial_imperial: "Hlavní písař"
 chronicler_celestial_imperial_desc: "$chronicler_celestial_imperial$ má za úkol zaznamenávat skutky svého pána na papír a knih."
 chronicler_celestial: "Zapisovatel"
 chronicler_celestial_desc: "$chronicler_celestial$ má za úkol zaznamenávat skutky svého pána na papír."
 champion_celestial_imperial: "Šampion se statečností tygra"
 champion_celestial_imperial_desc: "$champion_celestial_imperial$ je zkušený a smrtící bojovník, který může svého pána zastupovat v duelech."
 champion_celestial: "Bojovník se statečností tygra"
 champion_celestial_desc: "$champion_celestial$ je zkušený a smrtící bojovník, který může svého pána zastupovat v duelech."
 court_brewmaster_celestial: "Správce vína" # todo: NEW TRANSLATION
 court_brewmaster_celestial_desc: "$court_brewmaster_celestial$ je zástupce pověřený přímou komunikací s pivovarníky v říši, aby zajistil, že jeho pán bude mít přístup k těm nejlepším nápojům."
 lady_in_waiting_celestial_imperial: "Palácová dáma"
 lady_in_waiting_celestial_imperial_desc: "$lady_in_waiting_celestial_imperial$ je společnice a asistentka královny nebo císařovny, která se stará o všechny její potřeby a naplňuje každé její přání."
 lady_in_waiting_celestial: "Komorná"
 lady_in_waiting_celestial_desc: "$lady_in_waiting_celestial$ je společnice a asistentka královny nebo císařovny, která se stará o všechny její potřeby a naplňuje každé její přání."
 royal_architect_celestial: "Mistr řemeslník"
 royal_architect_celestial_desc: "$royal_architect_celestial$ dohlíží na všechny prestižní stavební projekty v říši; žádná cihla není položena a žádný okamžik stráven bez jeho výslovného svolení."
 court_poet_celestial: "Dvorský básník"
 court_poet_celestial_desc: "$court_poet_celestial$ je znalec slov a veršů, který poskytuje svému pánovi a celému dvoru zábavu, intelektuální podněty a citové zážitky."
 court_musician_celestial_imperial: "Mistr hudby"
 court_musician_celestial_imperial_desc: "$court_musician_celestial_imperial$ je umělec, který zpívá a hraje na nástroje, aby bavil svého pána a dvůr."
 court_musician_celestial: "Hudebník"
 court_musician_celestial_desc: "$court_musician_celestial$ je umělec, který zpívá a hraje na nástroje, aby bavil svého pána a dvůr."
 bodyguard_celestial_imperial: "Císařský strážný"
 bodyguard_celestial_imperial_desc: "$bodyguard_celestial_imperial$ je poslední linií obrany proti všem útočníkům. Kam jde jeho chráněnec, tam ho následuje, a bez váhání se vrhne do cesty jakémukoli nebezpečí, které by mohlo číhat venku."
 bodyguard_celestial: "Dvorní strážný"
 bodyguard_celestial_desc: "$bodyguard_celestial$ je poslední linií obrany proti všem útočníkům. Kam jde jeho chráněnec, tam ho následuje, a bez váhání se vrhne do cesty jakémukoli nebezpečí, které by mohlo číhat venku."
 court_artificer_celestial_imperial: "Palácový řemeslník"
 court_artificer_celestial_imperial_desc: "$court_artificer_celestial_imperial$ je někdo, kdo prokázal schopnost tvořit velké věci. I když většinou tráví čas na dvoře nečinně, doufá se, že ho znovu zasáhne inspirace."
 court_artificer_celestial: "Řemeslník"
 court_artificer_celestial_desc: "$court_artificer_celestial$ je někdo, kdo prokázal schopnost tvořit velké věci. I když většinou tráví čas na dvoře nečinně, doufá se, že ho znovu zasáhne inspirace."
 grand_preceptor_court_position: "Vrchní vychovatel"
 grand_preceptor_court_position_desc: "$grand_preceptor_court_position$ je morálním pilířem svého dvora, jeho povinností je být majákem ctnosti, kterého ostatní mohou obdivovat a napodobovat."
 grand_preceptor_court_position_task_instill_righteousness: "Vnést mravní zbožnost"
 grand_preceptor_court_position_task_instill_righteousness_desc: "$grand_preceptor_court_position$ se bude věnovat morálnímu rozvoji svého pána."
 grand_preceptor_court_position_task_propagate_civic_virtue: "Propagovat občanské ctnosti"
 grand_preceptor_court_position_task_propagate_civic_virtue_desc: "$grand_preceptor_court_position$ převezme vedoucí roli při šíření morálních ctností mezi obyvatelstvem."
 grand_preceptor_court_position_task_exalt_imperial_deeds: "Oslavovat císařské činy"
 grand_preceptor_court_position_task_exalt_imperial_deeds_desc: "Jako $grand_preceptor_court_position$ má tato postava obrovskou morální autoritu a mnozí jsou ochotni přijmout její slova jako pravdu."
 grand_preceptor_powerfuL_family_score_desc: "$grand_preceptor_court_position$"
 grand_guardian_court_position: "Velký strážce"
 grand_guardian_court_position_desc: "$grand_guardian_court_position$ je mečem a štítem říše, uznávaný pro své vojenské zkušenosti a strategické schopnosti."
 grand_guardian_court_position_task_guard_the_capital: "Chránit hlavní město"
 grand_guardian_court_position_task_guard_the_capital_desc: "$grand_guardian_court_position$ převezme odpovědnost za ochranu bezpečnosti císařského hlavního města."
 grand_guardian_court_position_task_shield_the_realm: "Chránit říši"
 grand_guardian_court_position_task_shield_the_realm_desc: "$grand_guardian_court_position$ uplatní své mimořádné strategické schopnosti při obraně říše jako celku."
 grand_guardian_court_position_task_instill_martial_discipline: "Vnést vojenskou kázeň"
 grand_guardian_court_position_task_instill_martial_discipline_desc: "$grand_guardian_court_position$ se bude snažit vštípit nahromaděné lekce své výjimečné kariéry těm, kteří postrádají výsadu zkušenosti."
 grand_guardian_guard_the_capital_modifier: "Chráněno Velkým strážcem"
