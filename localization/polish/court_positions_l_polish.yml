 grand_mentor_court_position_task_teach_liege_desc: "$grand_mentor_court_position$ se bude výhradně věnovat vzdělávání svého pána."
 grand_mentor_teach_liege_tt: "Každý měsíc může [Concept('liege','lenní pán')|E] získat [diplomacy_i][stewardship_i][learning_i][martial_i][Concept('skills','dovednosti')|E], [GetTrait('governor').GetName( GetPlayer )] nebo [GetTrait('confucian_education').GetName( GetPlayer )] [Concept('trait_level_track_xp','zkušenosti rysu')|E]" # todo: CONCEPT CASE
