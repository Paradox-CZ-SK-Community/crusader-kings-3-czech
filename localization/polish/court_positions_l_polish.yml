 foreign_emissary_culture_acceptance: "Přizpůsobit tributáře"
 foreign_emissary_culture_acceptance_desc: "Tato postava zajistí, aby se tributáři podřídili svému suverénovi, a to jakýmikoli nezbytnými prostředky."
 culture_acceptance_desc_foreign_emissary: "[liege.GetName] vyšel[Select_CString( liege.IsFemale, 'a', '' )] vstříc svým tributářům této [Concept('culture','kultury')|E]"
 foreign_emissary_culture_acceptance_trigger_tt: "Žádní [Concept('tributaries','tributáři')|E] jiné [Concept('culture','kultury')|E]"
 keeper_of_the_horses_court_position: "Strážce koní"
 keeper_of_the_horses_court_position_desc: "$keeper_of_the_horses_court_position$ je prestižní úřad, který má na starosti oře a stáje svého lenního pána."
 court_position_confucian_education_trait: "[GetTrait('confucian_education').GetName( ROOT.Char )]"
 court_physician_celestial_imperial: "Palácový lékař"
 court_physician_celestial_imperial_desc: "$court_physician_celestial_imperial$ odpovídá za zdraví a blaho [Concept('court','dvora')|E], u něhož působí. Bude podle svých nejlepších schopností léčit nemoci a sešívat rány."
 court_physician_celestial: "Vrchní lékař"
 court_physician_celestial_desc: "$court_physician_celestial$ odpovídá za zdraví a blaho [Concept('court','dvora')|E], u něhož působí. Bude podle svých nejlepších schopností léčit nemoci a sešívat rány."
 court_astrologer_celestial_imperial: "Velký astrolog"
 court_astrologer_celestial_imperial_desc: "$court_astrologer_celestial_imperial$ zkoumá nebesa, aby předpověděl, jaký osud nás může potkat."
 court_astrologer_celestial: "Věštec"
 court_astrologer_celestial_desc: "$court_astrologer_celestial$ zkoumá nebesa, aby předpověděl, jaký osud nás může potkat."
 travel_leader_celestial_imperial: "Předjezdec"
 travel_leader_celestial_imperial_desc: "$travel_leader_celestial_imperial$ ti pomáhá při cestování a má na starosti všechny itineráře. Snaží se zajistit, abys do cíle dorazil[Select_CString( GetPlayer.IsFemale, 'a', '' )] bezpečně a včas."
 travel_leader_celestial: "Přední zvěd"
 travel_leader_celestial_desc: "$travel_leader_celestial$ ti pomáhá při cestování a má na starosti všechny itineráře. Snaží se zajistit, abys do cíle dorazil[Select_CString( GetPlayer.IsFemale, 'a', '' )] bezpečně a včas."
 antiquarian_celestial: "Strážce pokladů"
 antiquarian_celestial_desc: "$antiquarian_celestial$ odpovídá za údržbu, péči a obstarávání artefaktů."
 seneschal_celestial: "Vrchní správce"
 seneschal_celestial_desc: "$seneschal_celestial$ zastává důležitou úlohu v každodenním chodu královské domácnosti, spravuje služebnictvo a dbá na to, aby vše běželo hladce."
 court_tutor_celestial: "Učený učitel"
 court_tutor_celestial_desc: "$court_tutor_celestial$ má na starosti [Concept('education','vzdělání')|E] všech dětí u dvora a jeho dovednosti ovlivní, nakolik bude působit na žáky. Děti mohou mít i nadále jednotlivé [Concept('guardians','poručníky')|E]."
 chief_eunuch_celestial_imperial: "Palácový služebník"
 chief_eunuch_celestial_imperial_desc: "$chief_eunuch_celestial_imperial$ je důvěryhodný služebník odpovědný za eunuchy u dvora. Máločemu se stane, že by se o tom nedozvěděl – jak mezi služebnictvem, tak mezi urozenými."
 chief_eunuch_celestial: "Eunušský služebník"
 chief_eunuch_celestial_desc: "$chief_eunuch_celestial$ je důvěryhodný služebník odpovědný za eunuchy u dvora. Máločemu se stane, že by se o tom nedozvěděl – jak mezi služebnictvem, tak mezi urozenými."
 master_of_horse_celestial_imperial: "Prefekt stájí"
 master_of_horse_celestial_imperial_desc: "$master_of_horse_celestial_imperial$ odpovídá za vznešené oře a stáje svého lenního pána. Má plné ruce práce, neboť dobře udržovaný kůň je přínosem jak na bojišti, tak na cestách."
 master_of_horse_celestial: "Správce stájí"
 master_of_horse_celestial_desc: "$master_of_horse_celestial$ odpovídá za vznešené oře a stáje svého lenního pána. Má plné ruce práce, neboť dobře udržovaný kůň je přínosem jak na bojišti, tak na cestách."
 master_of_hunt_celestial: "Správce lovů"
 master_of_hunt_celestial_desc: "$master_of_hunt_celestial$ odpovídá za všechny lovecké družiny, které pořádají členové dvora jeho lenního pána. Má také na starosti psince a psy v nich."
 cave_hermit_celestial: "Moudrý poustevník"
 cave_hermit_celestial_desc: "$cave_hermit_celestial$ je někdo, kdo bude přebývat v areálu tvého hradu a bavit tvé hosty proroctvími a hádankami. Někteří říkají, že může jít o skutečného mystika."
 court_gardener_celestial_imperial: "Vrchní zahradník"
 court_gardener_celestial_imperial_desc: "$court_gardener_celestial_imperial$ odpovídá za blaho zahrad patřících jeho lennímu pánovi a věnuje čas i dovednost tomu, aby skutečně vzkvétaly."
 court_gardener_celestial: "Zahradník"
 court_gardener_celestial_desc: "$court_gardener_celestial$ odpovídá za blaho zahrad patřících jeho lennímu pánovi a věnuje čas i dovednost tomu, aby skutečně vzkvétaly."
 chronicler_celestial_imperial: "Velký písař"
 chronicler_celestial_imperial_desc: "$chronicler_celestial_imperial$ má za úkol svěřovat činy svého zaměstnavatele papíru."
 chronicler_celestial: "Zapisovatel"
 chronicler_celestial_desc: "$chronicler_celestial$ má za úkol svěřovat činy svého zaměstnavatele papíru."
 champion_celestial_imperial: "Tygří chrabrý šlechtic"
 champion_celestial_imperial_desc: "$champion_celestial_imperial$ je zkušený a smrtonosný bojovník, který může zastupovat svého lenního pána v duelech."
 champion_celestial: "Tygří chrabrý voják"
 champion_celestial_desc: "$champion_celestial$ je zkušený a smrtonosný bojovník, který může zastupovat svého lenního pána v duelech."
 court_brewmaster_celestial: "Správce vína"
 court_brewmaster_celestial_desc: "$court_brewmaster_celestial$ je zástupce vybraný k přímému jednání se sládky panství, aby zajistil, že lenní pán získá to nejlepší pití."
 lady_in_waiting_celestial_imperial: "Palácová dáma"
 lady_in_waiting_celestial_imperial_desc: "$lady_in_waiting_celestial_imperial$ je pomocnice a společnice královny nebo císařovny, která se stará o každou její potřebu a plní každý její rozmar."
 lady_in_waiting_celestial: "Komorná"
 lady_in_waiting_celestial_desc: "$lady_in_waiting_celestial$ je pomocnice a společnice královny nebo císařovny, která se stará o každou její potřebu a plní každý její rozmar."
 royal_architect_celestial: "Mistr řemeslník"
 royal_architect_celestial_desc: "$royal_architect_celestial$ dohlíží na všechny prestižní stavební projekty v panství; bez jeho výslovného svolení není položena jediná cihla ani promarněna jediná chvíle."
 court_poet_celestial: "Básník laureát"
 court_poet_celestial_desc: "$court_poet_celestial$ je znalcem slov a veršů, který svému lennímu pánovi i všem u dvora poskytuje zábavu, intelektuální podněty a citové prožitky."
 court_musician_celestial_imperial: "Mistr hudby"
 court_musician_celestial_imperial_desc: "$court_musician_celestial_imperial$ je umělec, který zpívá a hraje na nástroje, aby bavil svého lenního pána i dvůr."
 court_musician_celestial: "Hudebník"
 court_musician_celestial_desc: "$court_musician_celestial$ je umělec, který zpívá a hraje na nástroje, aby bavil svého lenního pána i dvůr."
 bodyguard_celestial_imperial: "Císařský gardista"
 bodyguard_celestial_imperial_desc: "$bodyguard_celestial_imperial$ je poslední obrannou linií proti všem útočníkům. Kamkoli jde jeho svěřenec, tam ho následuje, a nebude váhat postavit se do cesty jakémukoli nebezpečí, které tam může číhat."
 bodyguard_celestial: "Domácí gardista"
 bodyguard_celestial_desc: "$bodyguard_celestial$ je poslední obrannou linií proti všem útočníkům. Kamkoli jde jeho svěřenec, tam ho následuje, a nebude váhat postavit se do cesty jakémukoli nebezpečí, které tam může číhat."
 court_artificer_celestial_imperial: "Palácový řemeslník"
 court_artificer_celestial_imperial_desc: "$court_artificer_celestial_imperial$ je někdo, kdo prokázal schopnost tvořit velká díla. Ačkoli většinou jen pobývá u tvého dvora, nadějí je, že ho znovu zasáhne inspirace."
 court_artificer_celestial: "Řemeslník"
 court_artificer_celestial_desc: "$court_artificer_celestial$ je někdo, kdo prokázal schopnost tvořit velká díla. Ačkoli většinou jen pobývá u tvého dvora, nadějí je, že ho znovu zasáhne inspirace."
 grand_preceptor_court_position: "Velký preceptor"
 grand_preceptor_court_position_desc: "$grand_preceptor_court_position$ je mravním pilířem svého dvora a jeho povinností je sloužit jako maják spravedlnosti, který mohou všichni ostatní obdivovat a následovat."
 grand_preceptor_court_position_task_instill_righteousness: "Vštěpovat mravní spravedlnost"
 grand_preceptor_court_position_task_instill_righteousness_desc: "$grand_preceptor_court_position$ se bude věnovat mravní kultivaci svého lenního pána."
 grand_preceptor_court_position_task_propagate_civic_virtue: "Šířit občanskou ctnost"
 grand_preceptor_court_position_task_propagate_civic_virtue_desc: "$grand_preceptor_court_position$ převezme vedoucí úlohu v šíření mravní ctnosti mezi obecným lidem."
 grand_preceptor_court_position_task_exalt_imperial_deeds: "Velebit císařské činy"
 grand_preceptor_court_position_task_exalt_imperial_deeds_desc: "Jako $grand_preceptor_court_position$ mají slova této postavy nesmírnou mravní autoritu a mnozí jsou ochotni přijímat její výroky jako pravdu."
 grand_preceptor_powerfuL_family_score_desc: "$grand_preceptor_court_position$"
 grand_guardian_court_position: "Velký ochránce"
 grand_guardian_court_position_desc: "$grand_guardian_court_position$ je mečem a štítem panství, uctívaný pro své vojenské zkušenosti a strategický vhled."
 grand_guardian_court_position_task_guard_the_capital: "Střežit hlavní sídlo"
 grand_guardian_court_position_task_guard_the_capital_desc: "$grand_guardian_court_position$ převezme odpovědnost za ochranu bezpečí císařského hlavního sídla."
 grand_guardian_court_position_task_shield_the_realm: "Chránit panství"
 grand_guardian_court_position_task_shield_the_realm_desc: "$grand_guardian_court_position$ využije své impozantní strategické schopnosti k obraně celého panství."
 grand_guardian_court_position_task_instill_martial_discipline: "Vštěpovat vojenskou kázeň"
 grand_guardian_court_position_task_instill_martial_discipline_desc: "$grand_guardian_court_position$ se bude snažit předávat nashromážděná poučení své význačné kariéry těm, jimž se nedostalo výsady zkušenosti."
 grand_guardian_guard_the_capital_modifier: "Chráněno velkým ochráncem"
 MODIFIER_DEFINITION_VALUE_GRAND_GUARDIAN_APTITUDE: " \t#weak Zvýšení za každou úroveň [Concept('aptitude','způsobilosti')|E] úřadu $grand_guardian_court_position$#!"
 grand_guardian_powerfuL_family_score_desc: "$grand_guardian_court_position$"
 grand_mentor_court_position: "Velký mentor"
 grand_mentor_court_position_desc: "$grand_mentor_court_position$ se stará o vzdělávání vládnoucí rodiny a je pověřen závažnou povinností zajistit, aby příští generace dostála vznešeným příkladům svých předků."
 grand_mentor_court_position_task_edify_heirs: "Vzdělávat císařské dědice"
 grand_mentor_court_position_task_edify_heirs_desc: "$grand_mentor_court_position$ zasvětí své dny pečlivé kultivaci příští generace."
 grand_mentor_edify_heirs_tt: "Každý měsíc mohou členové vládnoucího [Concept('house','rodu')|E], kteří jsou [Concept('courtiers','dvořany')|E] nebo [Concept('direct_vassals','přímými vazaly')|E] [Concept('liege','lenního pána')|E], získat [diplomacy_i][stewardship_i][learning_i][martial_i][Concept('skills','dovednosti')|E], [GetTrait('governor').GetName( GetPlayer )] nebo [GetTrait('confucian_education').GetName( GetPlayer )] [Concept('trait_level_track_xp','zkušenosti rysu')|E]"
 grand_mentor_edify_heirs_fallback: "Každý měsíc mohou členové vládnoucího [Concept('house','rodu')|E], kteří jsou [Concept('courtiers','dvořany')|E] nebo [Concept('direct_vassals','přímými vazaly')|E] [Concept('liege','lenního pána')|E], získat [diplomacy_i][stewardship_i][learning_i][martial_i][Concept('skills','dovednosti')|E], [GetTrait('governor').GetName( GetPlayer )] nebo [GetTrait('confucian_education').GetName( GetPlayer )] [Concept('trait_level_track_xp','zkušenosti rysu')|E]"
 grand_mentor_court_position_task_teach_liege: "Vzdělávat císaře"
 grand_mentor_court_position_task_teach_liege_desc: "$grand_mentor_court_position$ se bude výhradně věnovat vzdělávání svého lenního pána."
 grand_mentor_teach_liege_tt: "Každý měsíc může [Concept('liege','lenní pán')|E] získat [diplomacy_i][stewardship_i][learning_i][martial_i][Concept('skills','dovednosti')|E], [GetTrait('governor').GetName( GetPlayer )] nebo [GetTrait('confucian_education').GetName( GetPlayer )] [Concept('trait_level_track_xp','zkušenosti rysu')|E]"
 grand_mentor_teach_liege_fallback: "Každý měsíc může [Concept('liege','lenní pán')|E] získat [diplomacy_i][stewardship_i][learning_i][martial_i][Concept('skills','dovednosti')|E], [GetTrait('governor').GetName( GetPlayer )] nebo [GetTrait('confucian_education').GetName( GetPlayer )] [Concept('trait_level_track_xp','zkušenosti rysu')|E]"
 grand_mentor_court_position_task_train_officials: "Vychovávat zasloužilé úředníky"
 grand_mentor_court_position_task_train_officials_desc: "$grand_mentor_court_position$ dohlédne na to, aby úředníci panství měli dovednosti odpovídající jejich moudrosti a ctnosti."
 grand_mentor_train_officials_tt: "Každý měsíc může držitel [Concept('court_position','dvorského úřadu')|E] nebo [Concept('direct_vassal','přímý vazal')|E] získat [diplomacy_i][stewardship_i][learning_i][martial_i][Concept('skills','dovednosti')|E], [GetTrait('governor').GetName( GetPlayer )] nebo [GetTrait('confucian_education').GetName( GetPlayer )] [Concept('trait_level_track_xp','zkušenosti rysu')|E], případně [Concept('merit','zásluhy')|E]"
 grand_mentor_train_officials_fallback: "Každý měsíc může držitel [Concept('court_position','dvorského úřadu')|E] nebo [Concept('direct_vassal','přímý vazal')|E] získat [diplomacy_i][stewardship_i][learning_i][martial_i][Concept('skills','dovednosti')|E], [GetTrait('governor').GetName( GetPlayer )] nebo [GetTrait('confucian_education').GetName( GetPlayer )] [Concept('trait_level_track_xp','zkušenosti rysu')|E], případně [Concept('merit','zásluhy')|E]"
 grand_mentor_mentoring_title: "Vedení postavy [target_character.GetFullNameNoTooltip]"
 grand_mentor_mentoring_notification_desc: "[ROOT.Char.GetShortUIName|U] zlepšil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] dovednosti postavy [target_character.GetTitledFirstNamePossessive]"
 grand_mentor_powerfuL_family_score_desc: "$grand_mentor_court_position$"
 fire_dragon_engineer_court_position: "Inženýr ohnivých draků"
 fire_dragon_engineer_court_position_desc: "$fire_dragon_engineer_court_position$ je mistr palných zbraní, který vybavuje vojsko hrozivými válečnými nástroji chrlícími plameny."
 fire_dragon_engineer_court_position_forge_fire_dragons: "Vyrábět ohnivé draky"
 fire_dragon_engineer_court_position_forge_fire_dragons_desc: "$fire_dragon_engineer_court_position$ zaměří své síly na výrobu palných zbraní a bude udržovat bohatý arzenál vždy připravený."
 fire_dragon_engineer_court_position_command_artillery: "Velel dělostřelectvu"
 fire_dragon_engineer_court_position_command_artillery_desc: "$fire_dragon_engineer_court_position$ bude osobně dohlížet na nasazení a využití svých nástrojů zkázy na bojišti."
 keeper_of_the_harem_court_position: "Správce harému"
 keeper_of_the_harem_court_position_desc: "$keeper_of_the_harem_court_position$ zastává v císařském harému úřad nemalé důležitosti a dohlíží na vše od šatů konkubín až po příznivé načasování císařských styků."
 keeper_of_the_harem_court_position_task_maintain_decorum: "Udržovat harémový řád"
 keeper_of_the_harem_court_position_task_maintain_decorum_desc: "$keeper_of_the_harem_court_position$ se zaměří na potlačování jedovatých intrik harému a jeho ochranu před nevhodnou pozorností vnějšího světa."
 keeper_of_the_harem_maintaining_decorum.tt: "$keeper_of_the_harem_court_position$ výrazně ztíží [Concept('schemes','intriky')|E] zaměřené na členy harému."
 keeper_of_the_harem_court_position_task_attend_to_wellness: "Pečovat o zdraví konkubín"
 keeper_of_the_harem_court_position_task_attend_to_wellness_desc: "$keeper_of_the_harem_court_position$ bude věnovat zvláštní pozornost zdraví a blahu harému, léčit nemocné a ulehčovat jejich břemenům."
 keeper_of_the_harem_attend_to_wellness.tt: "$keeper_of_the_harem_court_position$ bude každý měsíc vyhledávat a ošetřovat nemocnou členku harému, zmírňovat její stres a příznaky, které ji sužují."
 keeper_of_the_harem_court_position_task_select_palace_beauties: "Vybírat palácové krásky"
 keeper_of_the_harem_court_position_task_select_palace_beauties_desc: "$keeper_of_the_harem_court_position$ bude pravidelně posuzovat složení harému, důstojně propouštět zestárlé a bezdětné konkubíny a přijímat nadané a půvabné náhradnice."
 keeper_of_the_harem_select_palace_beauties.tt: "Každý rok může $keeper_of_the_harem_court_position$ propustit jednu zestárlou a bezdětnou konkubínu a přijmout do harému jednu novou konkubínu."
 court_guru_court_position: "Guru"
