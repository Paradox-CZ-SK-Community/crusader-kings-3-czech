 executioner_court_position: "Dvorní popravčí"
 executioner_employer_custom_effect_description: "$BULLET$Může veřejně [Concept('execute','popravit')|E] [Concept('prisoners','vězni')|E] pro zvýšení [Concept('control','kontrolu')|E] a [Concept('county_opinion','lidové mínění')|E]\n@warning_icon! #X Zločiny postavy jsou odpuštěny#!" # todo: CONCEPT CASE
