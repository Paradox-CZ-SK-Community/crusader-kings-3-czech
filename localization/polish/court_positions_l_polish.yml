 court_tutor_improve_others_fallback_tt: "[Concept('liege','Lenní pán')|E], nástupce [Concept('heir','dědic')|E] panovníka nebo jiní držitelé [Concept('court_position','dvorský úřad')|E] na [Concept('court','dvůr')|E] mohou každý měsíc získat [diplomacy_i][stewardship_i][learning_i][martial_i][Concept('skills','dovednosti')|E] nebo [Concept('traits','rysy')|E]" # todo: CONCEPT CASE
