 bodyguard_court_position_desc: "$bodyguard_court_position$ je poslední linií obrany proti všem útočníkům. Kam jeho pán jde, následuje ho, a neváhá postavit se do cesty jakémukoli nebezpečí."
 bodyguard_court_position_nomadic_desc: "$bodyguard_court_position_nomadic$ má tu čest bránit svého pána jak v boji, tak v míru. Je rozdělen na denní a noční hlídku a je připraven za svého pána položit život."
 champion_court_position: "Osobní šampion"
 champion_employer_custom_effect_description: "$BULLET$Může zastoupit vašeho panovníka v některých [Concept('single_combat_duel_plural','duelech')|E]\n[AddLocalizationIf( HasDlcFeature( 'tours_and_tournaments' ), 'champion_employer_custom_effect_description_TOTO_DLC' )]" # todo: CONCEPT CASE
