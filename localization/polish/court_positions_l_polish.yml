 seneschal_improve_domain: "Spravovat doménu"
 seneschal_improve_domain_desc: "Tato postava má na starosti vedení panovníkova panství."
 seneschal_handling_estate: "Spravovat statky"
 seneschal_handling_estate_desc: "Tato postava se stará o panovníkovo sídlo a jeho chod."
 antiquarian_court_position: "Antikvárián"
 antiquarian_court_position_desc: "$antiquarian_court_position$ je zodpovědný za údržbu, péči a získávání artefaktů."
 court_tutor_court_position: "Učitel"
 court_tutor_court_position_desc: "$court_tutor_court_position$ dohlíží na [Concept('education','vzdělání')|E] všech dětí na dvoře a jeho schopnosti ovlivňují, jak moc dokáže žáky ovlivnit. Děti mohou mít i individuální [Concept('guardians','poručníci')|E]." # todo: CONCEPT CASE
 court_tutor_employer_custom_effect_description: "$BULLET$Působí jako [Concept('guardian','poručník')|E] pro [Concept('children','děti')|E], kteří žádného nemají\n$BULLET$Odemkne #V $make_child_learn_language_interaction$#! [Concept('interaction','interakce')|E]" # todo: CONCEPT CASE
 court_tutor_improve_others: "Vyučovat dvůr"
