 garuda_court_position_desc: "Tento rytíř přísahal, že splní vůli svého pána nebo zemře při tom. Stejně jako mytologický pták $garuda_court_position$ nesl váhu Višnu, nosí válečníci $garuda_court_position$ svrchovanost monarchie."
 court_gardener_court_position: "Dvorní zahradník"
