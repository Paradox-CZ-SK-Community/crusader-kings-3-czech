 court_diplomatic: "Diplomatický dvůr"
 court_diplomatic_desc: "#low Diplomacie je klíčem k získání úcty našich vrstevníků a k udržení říše v míru. Spokojený vazal je loajální vazal. \n\nDvorané získají rysy [GetTrait('diplomatic_court_1').GetName( GetNullCharacter )].#!"
 court_diplomatic_tooltip_desc: "V $court_diplomatic$ se klade velký důraz na vztahy a mírové řešení konfliktů."
 court_warlike: "Válečný dvůr"
 court_warlike_desc: "#low Projevení síly je jediný způsob, jak získat úctu a respekt! Naši rytíři a vojáci jsou proslulí svou zdatností. \n\nDvorané získají rysy [GetTrait('warlike_court_1').GetName( GetNullCharacter )].#!"
 court_warlike_tooltip_desc: "V $court_warlike$ je vysoce ceněno silné tělo a strategická mysl."
 court_administrative: "Správní dvůr"
 court_administrative_desc: "#low Pouze efektivní a dobře spravovaný dvůr přivede naše panství k rozkvětu. \n\nDvorané získají rysy [GetTrait('administrative_court_1').GetName( GetNullCharacter )].#!"
 court_administrative_tooltip_desc: "Dvůr $court_administrative$ je zaměřený na rozvoj panství."
 court_intrigue: "Intrikový dvůr"
 court_intrigue_desc: "#low Nechat lidi na dvoře bez dohledu je nebezpečné, a musíme zajistit, aby nikdo nemohl škodit bez našeho vědomí. \n\nDvorané získají rysy [GetTrait('intrigue_court_1').GetName( GetNullCharacter )].#!"
 court_intrigue_tooltip_desc: "V $court_intrigue$ si musíte hlídat záda; tajemství může být stejně smrtící jako dýka v noci, a v tomto dvoře jich je víc než dost."
 court_scholarly: "Učený dvůr"
 court_scholarly_desc: "#low Dvůr je o přitahování vzdělaných myslí a lidí výjimečných schopností. \n\nDvorané získají rysy [GetTrait('scholarly_court_1').GetName( GetNullCharacter )].#!"
 court_scholarly_tooltip_desc: "V $court_scholarly$ si cení znalostí a pilného studia."
 court_tribal: "Kmenový dvůr"
 court_tribal_desc: "#low Na dvoře platí právo silnějšího – síně budou vyzdobeny kořistí a lupem! \n\nDvorané získají rysy [GetTrait('warlike_court_1').GetName( GetNullCharacter )].#!"
 court_tribal_tooltip_desc: "V $court_tribal$ si cení vojenské zdatnosti a odolnosti."
 court_nomadic: "Nomádský dvůr"
 court_nomadic_desc: "#low Náš dvůr je na cestách s mocí tisíce kopyt, kde vládnou luk a čepel. Sláva se získává dobytím a náš lid se živí válečnou kořistí. \n\nDvorané získají rysy [GetTrait('warlike_court_1').GetName( GetNullCharacter )].#!"
 court_nomadic_tooltip_desc: "V $court_nomadic$ si cení vojenské zdatnosti a odolnosti."
