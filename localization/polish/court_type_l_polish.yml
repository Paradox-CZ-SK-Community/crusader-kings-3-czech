 court_diplomatic: "Diplomatický dvůr"
 court_diplomatic_desc: "#low Diplomacie je klíčem k získání úcty našich sobě rovných a zachování míru v panství. Spokojený vazal je věrný vazal. \n\nDvořané získávají rys [GetTrait('diplomatic_court_1').GetName( GetNullCharacter )].#!"
 court_diplomatic_tooltip_desc: "$court_diplomatic$ klade velký důraz na vztahy a mírové řešení sporů."
 court_warlike: "Válečnický dvůr"
 court_warlike_desc: "#low Pouze demonstrací síly si lze vydobýt obdiv a respekt! Naši rytíři a vojáci jsou proslulí svou udatností. \n\nDvořané získávají rys [GetTrait('warlike_court_1').GetName( GetNullCharacter )].#!"
 court_warlike_tooltip_desc: "$court_warlike$ si vysoce cení tělesné zdatnosti a strategického myšlení."
 court_administrative: "Správní dvůr"
 court_administrative_desc: "#low Jen výkonný a dobře spravovaný dvůr zajistí, aby naše panství vzkvétalo. \n\nDvořané získávají rys [GetTrait('administrative_court_1').GetName( GetNullCharacter )].#!"
 court_administrative_tooltip_desc: "$court_administrative$ se zaměřuje na rozvoj panství."
 court_intrigue: "Intrikánský dvůr"
 court_intrigue_desc: "#low Je nebezpečné nechat lidi u dvora bez dozoru. Musíme zajistit, aby nikdo nemohl kout pikle, aniž bychom se o tom dozvěděli. \n\nDvořané získávají rys [GetTrait('intrigue_court_1').GetName( GetNullCharacter )].#!"
 court_intrigue_tooltip_desc: "$court_intrigue$ tě nutí mít oči na zádech. Tajemství může být stejně smrtící jako nůž ve tmě a na tomto dvoře je obojího dostatek."
 court_scholarly: "Učený dvůr"
 court_scholarly_desc: "#low Smyslem dvora je přitahovat vzdělané myslitele a lidi mimořádných schopností. \n\nDvořané získávají rys [GetTrait('scholarly_court_1').GetName( GetNullCharacter )].#!"
 court_scholarly_tooltip_desc: "$court_scholarly$ si cení vědomostí a pilného studia."
 court_tribal: "Kmenový dvůr"
 court_tribal_desc: "#low U dvora platí právo silnějšího a jeho síně budou ověšeny kořistí a lupem! \n\nDvořané získávají rys [GetTrait('warlike_court_1').GetName( GetNullCharacter )].#!"
 court_tribal_tooltip_desc: "$court_tribal$ si cení válečnické zdatnosti a odolnosti."
 court_nomadic: "Kočovný dvůr"
 court_nomadic_desc: "#low Náš dvůr putuje se silou tisíce kopyt a vládnou mu luk a čepel. Sláva se získává dobýváním a náš lid vzkvétá z válečné kořisti. \n\nDvořané získávají rys [GetTrait('warlike_court_1').GetName( GetNullCharacter )].#!"
 court_nomadic_tooltip_desc: "$court_nomadic$ si cení válečnické zdatnosti a odolnosti."
 COURT_TYPE_GENERAL_TOOLTIP: "[CourtType.GetTooltipDesc]\n\n[CourtType.GetEffectDesc]"
