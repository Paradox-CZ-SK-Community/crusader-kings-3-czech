 innovation_motte: "Zemní opevnění"
 innovation_motte_desc: "Prosté, avšak účinné budování hradů na vyvýšených zemních pahorcích je nejlepším způsobem, jak si nad nepřáteli zajistit doslova výhodnější postavení."
 innovation_motte_chinese: "Hāng Tu"
 innovation_motte_chinese_desc: "Budování opevnění z udusané hlíny je prosté, avšak účinné a představuje nejlepší způsob, jak si nad nepřáteli zajistit doslova výhodnější postavení."
 innovation_motte_actual_motte: "Motty"
 innovation_motte_actual_motte_desc: "$innovation_motte_desc$"
 innovation_catapult: "Onager"
 innovation_catapult_desc: "Přestože se tyto torzní katapulty pomalu nabíjejí a odpalují, umožňují nám útočit na nepřátelská opevnění mimo dosah jejich lučištníků."
 innovation_catapult_chinese: "Obléhací kuše"
 innovation_catapult_chinese_desc: "Velké přenosné kuše s několika protilehlými lučišti, která prodlužují nátah a zvyšují sílu, často upevněné na kolovém podvozku pro snadnější přesun."
 innovation_barracks: "Kasárna"
 innovation_barracks_desc: "Výstavbou zvláštních budov pro ubytování vojáků zajistíme dostatek prostoru pro naše rostoucí armády."
 innovation_mustering_grounds: "Shromaždiště"
 innovation_mustering_grounds_desc: "Pouhá ochota lidí za nás bojovat k vítězství ve válkách nestačí. Vyhrazením prostoru pro výcvik a shromažďování před bitvou dokážeme vydržovat skupiny zkušenějších bojovníků, kteří nás mohou dovést k vítězství."
 innovation_bannus: "Bannus"
 innovation_bannus_desc: "Bann, založený na pravomoci velet mužům v bitvě, dává našim vládcům moc přimět svobodné muže, aby za ně bojovali, a vytváří tak právní základ pro svolávání velkých armád."
 eligible_accolade_vanguard_attribute_ACCOLADES_DLC: "[Concept('knights','Rytíři')|E] této [Concept('culture','kultury')|E] mohou získat [Concept('accolades','vyznamenání')|E] [GetAccoladeType('vanguard_attribute').GetName]"
 eligible_accolade_vanguard_attribute: "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_vanguard_attribute_ACCOLADES_DLC')]"
 unlock_maa_armored_footmen: "Umožňuje verbovat [GetMaA('armored_footmen').GetName] jako [Concept('men_at_arms','ozbrojence')|E]"
 unlock_maa_onager: "Umožňuje verbovat [GetMaA('onager').GetName] jako [Concept('men_at_arms','ozbrojence')|E]"
 innovation_quilted_armor: "Prošívaná zbroj"
 innovation_quilted_armor_desc: "Tyto kabátce, tvořené nejméně tuctem sešitých vrstev plátna, dokážou zastavit i těžké šípy a představují dostupný způsob, jak vyzbrojit celý pluk do bitvy."
 innovation_gavelkind: "Gavelkind"
 innovation_gavelkind_desc: "Stabilita a blahobyt jdou ruku v ruce. Namísto soupeření vazalů o moc po smrti starého panovníka můžeme stanovit předem určený a spravedlivý systém dědictví, který odstraní značnou část nestability tradičně provázející následnictví."
 innovation_crop_rotation: "Střídání plodin"
 innovation_crop_rotation_desc: "Přechodem od tradičního dvoupolního hospodaření k trojpolnímu střídání plodin můžeme každoročně vypěstovat více úrody, aniž bychom vyčerpávali půdu na našich polích."
 innovation_city_planning: "Plánování měst"
 innovation_city_planning_desc: "Budeme-li města navrhovat ještě před zahájením výstavby, můžeme na strategických místech zakládat nové državy, které budou účelnější a vzhlednější než starší sídla, jež v průběhu času vznikala bez jakéhokoli plánu."
 innovation_casus_belli: "Casus belli"
 innovation_casus_belli_desc: "Po celé generace platilo právo silnějšího, avšak budeme-li mít pro své války oprávněný důvod, můžeme se vyhnout hněvu sousedů a odvetě, která jej často provází."
 innovation_plenary_assemblies: "Plenární shromáždění"
 innovation_plenary_assemblies_desc: "Abychom mohli účinně vládnout, musíme svolávat všechny svobodné muže panství k projednávání a řešení zákonodárných záležitostí. Účast je povinná a ti, kteří se nedostaví, budou pokutováni a pozbudou možnosti ovlivnit přijatá rozhodnutí."
 innovation_development_01: "Veřejné stavby"
 innovation_development_01_desc: "Financování výstavby veřejných děl, jako jsou cesty, školy a akvadukty, umožní našim sídlům růst a zajistí blahobyt našeho lidu na celé příští generace."
 innovation_currency_01: "Měna"
 innovation_currency_01_desc: "Směnný obchod je pomalý a neefektivní. Přijetí oficiálně uznávaného platidla, například mušlí kauri či kovových valounů, podpoří obchod a šíření myšlenek v našem panství."
 innovation_ledger: "Účetní kniha"
 innovation_ledger_desc: "S růstem našich držav potřebujeme lepší způsob, jak vést přehled o svém majetku. Pečlivé vedení účetní knihy zajistí, že vždy budeme vědět, jaké zdroje máme k dispozici."
 innovation_viking_tradition: "Vikinská taktika"
 innovation_viking_tradition_desc: "Národy severu mají dlouhou tradici obchodu, ale také pirátství. Jen málokdo je připraven čelit hrozbě, která se bez varování vynoří na říčním břehu, a vikingští válečníci jsou mistry takového způsobu boje."
 innovation_longboats: "Dlouhé lodě"
 innovation_longboats_desc: "Naše dlouhé lodě jsou znamenitá námořní plavidla, která se dostanou téměř kamkoli a odolají i nepříznivému počasí, čímž nám poskytují mimořádnou pohyblivost na moři."
 innovation_war_camels: "Váleční velbloudi"
 innovation_war_camels_desc: "Velbloudi jsou přirozeně uzpůsobeni životu v pouštním terénu, sami o sobě však nejsou bojovými zvířaty. Naši chovatelé a cvičitelé to mohou změnit a poskytnout nám přizpůsobivé jezdectvo, s nímž ovládneme písečné dálavy."
 eligible_accolade_camelry_attribute_ACCOLADES_DLC: "[Concept('knights','Rytíři')|E] této [Concept('culture','kultury')|E] mohou získat [Concept('accolades','vyznamenání')|E] [GetAccoladeType('camelry_attribute').GetName]"
 eligible_accolade_camelry_attribute: "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_camelry_attribute_ACCOLADES_DLC')]"
 innovation_elephantry: "Váleční sloni"
 innovation_elephantry_desc: "Slony je obtížné chovat v zajetí, a proto si každý mahút musí své divoké slony sám odchytit a vycvičit. Správné využívání těchto mohutných tvorů v bitvě je tedy náročným uměním, které jsme však odhodláni ovládnout."
 eligible_accolade_elephantry_attribute_ACCOLADES_DLC: "[Concept('knights','Rytíři')|E] této [Concept('culture','kultury')|E] mohou získat [Concept('accolades','vyznamenání')|E] [GetAccoladeType('elephantry_attribute').GetName]"
 eligible_accolade_elephantry_attribute: "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_elephantry_attribute_ACCOLADES_DLC')]"
 innovation_wootz_steel: "Wootzová ocel"
 innovation_wootz_steel_desc: "Tento kov bohatý na uhlík, známý také jako hinduwánská či serická ocel, se výborně hodí k výrobě zbraní. Wootzová ocel je předmětem rozsáhlého obchodu a bývá považována za nejlepší ocel na světě. Po většinu dějin přitahovala pozornost arabských, egyptských, čínských, a dokonce i římských obchodníků."
 innovation_african_canoes: "Západoafrické kánoe"
 innovation_african_canoes_desc: "Velké západoafrické kánoe jsou vynikající pro plavbu po řekách a umožňují nám rychle přepravovat vojska tam, kde jsou zapotřebí."
 innovation_table_of_princes: "Knížecí stolec"
 innovation_table_of_princes_desc: "Knížecí stolec je panovnickým sídlem českých vládců a ten, kdo na něm usedne, je uznáván za právoplatného vládce. Podle zásady rodové seniority byly tituly udělovány nejstaršímu žijícímu členu vládnoucí dynastie."
 unlock_single_heir_dynasty_house_changing: "Umožňuje zavést $single_heir_dynasty_house$ při jakékoli [Concept('crown_authority','korunní autoritě')|E]"
 tradition_visigothic_codes_name: "$innovation_visigothic_codes$"
 tradition_visigothic_codes_desc: "$innovation_visigothic_codes_desc$"
 innovation_visigothic_codes: "Vizigótské zákoníky"
 innovation_visigothic_codes_desc: "Přestože mnohé ze starých tradic Vizigótů již dávno vymizely ze světa, obyvatelé Pyrenejí si pamatují dávné zvyklosti i způsob, jakým byla půda účelně a spravedlivě rozdělována mezi syny a dcery."
 unlock_equal_succession_changing: "Umožňuje zavést [Concept('law','zákon')|E] $equal_law$ při jakékoli [Concept('crown_authority','korunní autoritě')|E]"
 innovation_battlements: "Cimbuří"
 innovation_battlements_desc: "Kromě opevnění samotné hradní věže poskytne našim hradům další vrstvu ochrany před útočníky také výstavba odolné vnější hradby, kterou mohou bezpečně obsadit naši lučištníci."
 innovation_mangonel: "Mangonely"
 innovation_mangonel_desc: "Mangonely poháněné tahem představují výrazné zdokonalení našich stávajících konstrukcí katapultů a lze je nabíjet i odpalovat mnohem rychleji než stroje poháněné torzí."
 innovation_mangonel_chinese: "Oblačné žebříky"
 innovation_mangonel_chinese_desc: "Kloubové skládací obléhací žebříky, často vybavené štíty, navijáky, háky a zdvihacími zařízeními využívajícími kladky. Během obléhání sloužily také jako vyvýšená pozorovací stanoviště."
 eligible_accolade_besieger_attribute_ACCOLADES_DLC: "[Concept('knights','Rytíři')|E] této [Concept('culture','kultury')|E] mohou získat [Concept('accolades','vyznamenání')|E] [GetAccoladeType('besieger_attribute').GetName]"
 eligible_accolade_besieger_attribute: "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_besieger_attribute_ACCOLADES_DLC')]"
 innovation_burhs: "Kamenné pevnosti"
 innovation_burhs_desc: "Nejvýznamnější shromaždiště a správní centra rozesetá po krajině chrání pevné kamenné hradby."
 innovation_burhs_japan: "Suki"
 innovation_burhs_japan_desc: "Od výstavby #italic Mizuki#! za vlády císaře Tendžiho získal význam opevnění nové uznání. Taková opevněná centra můžeme využívat jak ke shromažďování vojsk, tak jako správní střediska."
 innovation_burhs_chinese: "Wū Bì"
 innovation_burhs_chinese_desc: "Wū bì jsou významná opevněná sídla rozesetá po krajině, která můžeme využívat jak ke shromažďování vojsk, tak jako správní střediska."
 innovation_burhs_anglo_saxon: "Burhy"
 innovation_burhs_anglo_saxon_desc: "Burhy jsou významná opevněná sídla rozesetá po krajině, která můžeme využívat jak ke shromažďování vojsk, tak jako správní střediska."
 innovation_burhs_latin: "Castra"
 innovation_burhs_latin_desc: "Staré zásady opevňování jsou užitečné i dnes a taková opevněná centra můžeme využívat jak ke shromažďování vojsk, tak jako správní střediska."
 innovation_house_soldiers: "Domácí vojsko"
 innovation_house_soldiers_desc: "S rostoucí mocí našich urozených rodin roste i jejich potřeba vojáků, kteří prosadí jejich vůli. Zřízení stálého domácího vojska zajistí, že budeme mít jednotky lépe vycvičené a vybavené než běžní odvedenci."
 innovation_horseshoes: "Podkovy"
 innovation_horseshoes_desc: "Kůň s poškozeným kopytem rychle zchromne a nebude schopen práce ani jízdy do bitvy. Podkováním bronzovými či železnými pláty můžeme udržet jeho kopyta zdravá a chránit je před poškozením."
 innovation_arched_saddle: "Sedlo s vysokými rozsochami"
 innovation_arched_saddle_desc: "Lehká jízda je silou, s níž je třeba počítat, ale plně nevyužívá potenciál válečného koně. Sedla s vysokými rozsochami nám umožní nasazovat těžce obrněné bojovníky s kopími založenými pod paží, kteří při útoku do nepřátelských řad naplno využijí svou hybnost."
 eligible_accolade_lancer_attribute_ACCOLADES_DLC: "[Concept('knights','Rytíři')|E] této [Concept('culture','kultury')|E] mohou získat [Concept('accolades','vyznamenání')|E] [GetAccoladeType('lancer_attribute').GetName]"
 eligible_accolade_lancer_attribute: "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_lancer_attribute_ACCOLADES_DLC')]"
 unlock_maa_armored_horsemen: "Umožňuje verbovat [GetMaA('armored_horsemen').GetName] jako [Concept('men_at_arms','ozbrojence')|E]"
 innovation_hereditary_rule: "Dědičná vláda"
 innovation_hereditary_rule_desc: "Rovnoměrné rozdělení panství mezi všechny oprávněné dědice rozbíjí jednotu našeho lidu. Namísto toho, abychom při každém následnictví své panství tříštili, můžeme zavedením dědičné vlády zajistit stabilní a prosperující jádro."
 innovation_manorialism: "Manorialismus"
 innovation_manorialism_desc: "Soustředění vlastnictví půdy v rukou elit připravilo mnoho mužů a žen o možnost obživy. Zavedeme systém panských dvorů, v němž mohou svobodní lidé obdělávat naše pole výměnou za nájem, zatímco ti, kteří platit nedokážou, mohou vstoupit do našich služeb jako nevolníci."
 innovation_royal_prerogative: "Královské výsady"
 innovation_royal_prerogative_desc: "Stejně jako na členy panovnického rodu doléhá větší břemeno odpovědnosti za správu panství, budou jim také uděleny výsady vyhrazené výhradně jim."
 innovation_chronicle_writing: "Psaní kronik"
 innovation_chronicle_writing_desc: "Příběhy o činech naší rodiny se již nebudou předávat pouze ústním podáním. Budeme zaznamenávat vše, čeho dosáhneme, abychom inspirovali budoucí generace a zároveň doložili své nároky na země, které nám právem náleží."
 innovation_armilary_sphere: "Armilární sféra"
 innovation_armilary_sphere_desc: "Tato zařízení tvořená kulovitou soustavou pohyblivých kruhů nám umožňují zakreslovat a předvídat pohyb nebeských těles. Sama o sobě jsou fascinujícím astrologickým nástrojem a získané poznatky navíc pomohou našim kapitánům při plavbě daleko od pevniny."
 innovation_baliffs: "Rychtáři"
 innovation_baliffs_desc: "Vládce nemůže být všude zároveň. Jmenováním rychtářů a dalších zástupců, kteří budou v celém panství prosazovat pánův zákon, můžeme účinněji spravovat rozsáhlejší území."
 innovation_baliffs_bailiffs: "Bailifové"
 innovation_baliffs_bailiffs_desc: "$innovation_baliffs_desc$"
 innovation_baliffs_latin: "Potestas"
 innovation_baliffs_latin_desc: "Staří Římané označovali pravomoc úředníků vytvářet, prosazovat a soudit právo výrazem #italic potestas#!. Tento pojem umožňoval pověřit magistráty prosazováním zákona v celém panství. Udělením #italic potestas#! místním úředníkům můžeme účinněji spravovat rozsáhlejší území."
 innovation_development_02: "Obecní správa"
 innovation_development_02_desc: "Větší města pravidelně čelí stále složitějším problémům. Přenesení části pravomocí na místní rady jim umožní tyto záležitosti řešit, aniž by se do nich musel zapojovat král."
 innovation_currency_02: "Ražba mincí"
 innovation_currency_02_desc: "Neregulované měny se obtížně kontrolují a postrádají stabilitu. Ražené mince o přesně stanovené hmotnosti a opatřené královskou pečetí přinášejí obchodním transakcím novou důvěru."
 innovation_reconquista: "Duchovní expanzionismus"
 innovation_reconquista_desc: "Kvůli vnitřním sporům jsme přítomnost nevěřících v Hispánii snášeli příliš dlouho. Nastal čas shromáždit naše síly a jednou provždy je z této země vyhnat!"
 innovation_stem_duchies: "Kmenová vévodství"
 innovation_stem_duchies_desc: "Přestože pocházíme z různých kmenů, uznáváme význam jednoty a spolupráce. Nezávislost se přeceňuje, když právě stabilita přináší bezpečí a blahobyt."
 innovation_ghilman: "Ghulámové"
 innovation_ghilman_desc: "Ghulámové jsou otročtí vojáci získaní jako váleční zajatci. Jde o oddané bojovníky, kteří jsou nám věrnější a jejich žold je nižší než u běžných žoldnéřů."
 innovation_hoardings: "Podsebití"
 innovation_hoardings_desc: "Tyto dřevěné konstrukce umístěné na vrcholu cimbuří přečnívají nad patu hradních zdí.\n\nUmožňují obráncům střílet šípy, shazovat kameny či lít vroucí olej na útočníky, zatímco sami zůstávají zcela chráněni před nepřátelskými lučištníky."
 innovation_trebuchet: "Trebuchet"
 innovation_trebuchet_desc: "Trebuchet s protizávažím je mistrovským dílem stavitelství, které dokáže vrhat těžké střely dále než jakýkoli dřívější obléhací stroj."
 innovation_trebuchet_chinese: "Pojízdné obléhací věže"
 innovation_trebuchet_chinese_desc: "Tyto vysoké dřevěné věže na kolech byly přisunovány k nepřátelským kamenným věžím, aby vojáci mohli v relativním bezpečí dosáhnout nepřátelských hradeb."
 innovation_castle_baileys: "Hradní předhradí"
 innovation_castle_baileys_desc: "Ačkoli je hradní věž srdcem hradu, zdaleka není jeho jedinou důležitou stavbou. Výstavba stájí, zbrojnic a dalších budov v chráněném předhradí zajistí, že své odvedence dokážeme za všech okolností řádně ubytovat a vyzbrojit."
 innovation_men-at-arms: "Ozbrojenci"
 innovation_men-at-arms_desc: "Bojovníci zběhlí v jízdě na koni a zacházení s kopím budou vždy žádaní, ale nejsou vždy k dispozici. Budeme-li si vydržovat oddíly ozbrojenců, nezůstaneme bez zkušených bojovníků, až nevyhnutelně vypukne válka."
 innovation_knighthood: "Rytířství"
 innovation_knighthood_desc: "Udělíme-li svým nejlepším bojovníkům rytířský titul a odměníme je državami namísto pouhých mincí, prokážeme jim zaslouženou čest a zároveň si zajistíme jejich věrnost."
 innovation_advanced_bowmaking: "Pokročilá výroba luků"
 innovation_advanced_bowmaking_desc: "Lučištníci si své luky tradičně vyráběli a udržovali sami, řemeslníci však začali vytvářet nové druhy luků, které jsou pevnější a složitější než dříve. Přijetím těchto nových konstrukcí můžeme z mistrů lukařů učinit neocenitelnou vojenskou oporu."
 unlock_maa_crossbowmen: "Umožňuje verbovat [GetMaA('crossbowmen').GetName] jako [Concept('men_at_arms','ozbrojence')|E]"
 eligible_accolade_crossbower_attribute_ACCOLADES_DLC: "[Concept('knights','Rytíři')|E] této [Concept('culture','kultury')|E] mohou získat [Concept('accolades','vyznamenání')|E] [GetAccoladeType('crossbowmen_attribute').GetName]"
 eligible_accolade_crossbower_attribute: "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_crossbower_attribute_ACCOLADES_DLC')]"
 innovation_heraldry: "Heraldika"
 innovation_heraldry_desc: "Zavedení dědičných znaků rozlišujících naše urozené rodiny přiměje jejich členy, aby se vnímali jako součást většího celku a usilovali o zlepšení pověsti své dynastie, namísto aby se zabývali pouze vlastním postavením."
 innovation_windmills: "Větrné mlýny"
 innovation_windmills_desc: "Vynález svislého větrného mlýna nám umožňuje využívat sílu větru mnohem účinněji než dříve a výrazně snižuje množství práce potřebné k mletí obilí a zpracování surovin."
 innovation_divine_right: "Božské právo"
 innovation_divine_right_desc: "Nastal čas uznat, že naše vládce dosadila na trůny božská vůle, a kdo se jim postaví, staví se proti samotnému božstvu."
 innovation_land_grants: "Udělování půdy"
 innovation_land_grants_desc: "Půda je nejcennější odměnou, kterou můžeme svým poddaným udělit, avšak přímo jí vlastníme jen omezené množství. Kdybychom jim však dovolili začít obdělávat tamtu nevyužívanou půdu... kdo by mohl něco namítat? A i kdyby z toho vzešel spor, při obraně svých poddaných bude právo zjevně na naší straně!"
 innovation_scutage: "Štítovné"
 innovation_scutage_desc: "Od našich poddaných se vždy očekávala vojenská služba, někteří ji však nemohou nebo nechtějí vykonávat. Umožníme-li jim splnit své povinnosti mincemi namísto oceli, zajistíme, že od každého obdržíme, co nám náleží."
 innovation_guilds: "Cechy"
 innovation_guilds_desc: "S rozšiřováním našich zemí je stále méně účinné přímo řídit veškerý obchod probíhající v naší doméně. Udělením cechovních privilegií sdružením obchodníků a řemeslníků jim můžeme poskytnout větší samostatnost při vedení jejich živností a zároveň si zajistit podíl na jejich výnosech."
 innovation_development_03: "Urbanizace"
 innovation_development_03_desc: "Velká města Řím, Byzanc a Dillí již dlouho vynikají jako pozůstatky velkolepého a nedostižného dědictví. S růstem naší infrastruktury a obyvatelstva konečně získáváme prostředky k zakládání nových sídel, která se těmto starověkým městským centrům vyrovnají."
 innovation_currency_03: "Bankovnictví"
 innovation_currency_03_desc: "Mimořádně rozsáhlé či nákladné obchody často vyžadují nepraktické množství těžkých mincí. Uložením tohoto bohatství v bezpečných pokladnicích a převodem vlastnictví bez fyzického přemisťování mincí umožníme snazší obchodování s velkým množstvím zboží."
 innovation_east_settling: "Německá východní kolonizace"
 innovation_east_settling_desc: "Země na východ od nás jsou řídce osídlené, ale bohaté na přírodní zdroje. Podpora jejich osidlování a zakládání nových usedlostí přinese našemu lidu růst a blahobyt."
 innovation_seigneurialism: "Vrchnostenský systém"
 innovation_seigneurialism_desc: "Přenesením většího množství povinností na místní šlechtice je nejen potěšíme, ale zároveň si uvolníme ruce, abychom se mohli více soustředit na vlastní doménu."
 innovation_muladi: "Muladíové"
 innovation_muladi_desc: "Války, nájezdy a pronásledování po celém světě vyhnaly mnoho lidí z jejich domovů. Přivítáme-li tyto vyhnance ve svých zemích bez ohledu na jejich původ, můžeme vybudovat bohatou a prosperující společnost."
 innovation_french_peerage: "Francouzští pairové"
 innovation_french_peerage_desc: "Náležitým uznáním nejvýznamnějších z urozených vazalů našeho panství posílíme jejich věrnost koruně."
 innovation_machicolations: "Machikuly"
 innovation_machicolations_desc: "Machikuly z kamene představují významné zdokonalení dřívějšího podsebití. Slouží stejnému účelu, jsou však podstatně odolnější a poskytují obráncům lepší ochranu."
 innovation_gunpowder: "Střelný prach"
 innovation_gunpowder_desc: "Vývoj výbušných prachů dal vzniknout novým druhům zbraní i bojovníků, kteří je používají. Nasazení těchto mocných palných zbraní vyžaduje výrobu a zásobování v rozsahu, jaký dříve nebyl zapotřebí, náklady se však vrátí díky síle, kterou tato nová technologie poskytuje."
 innovation_royal_armory: "Královská zbrojnice"
 innovation_royal_armory_desc: "S rostoucí velikostí našich armád musíme zajistit, aby byl každý voják náležitě vyzbrojen a oděn do zbroje. Zřízení královské zbrojnice pro výrobu a skladování veškerého vybavení našich vojsk nám výrazně pomůže tuto potřebu naplnit."
 innovation_standing_armies: "Stálá vojska"
 innovation_standing_armies_desc: "Odvody nám poskytují velké množství vojáků, avšak bez ohledu na to, jak dobře je vycvičíme a vybavíme, budou vždy zaostávat za profesionálními bojovníky. Zřízení početného stálého vojska zajistí, že zájmy našeho panství budou prosazovat ti nejlepší dostupní bojovníci."
 innovation_sappers: "Sapéři"
 innovation_sappers_desc: "Na síle nepřátelských hradeb nezáleží, pokud lze podkopat půdu pod nimi. Nasazení sapérů k poddolování nepřátelských opevnění je účinným způsobem, jak prolomit i tu nejodolnější obranu."
 innovation_plate_armor: "Plátová zbroj"
 innovation_plate_armor_desc: "Dobře zhotovená plátová zbroj představuje vrchol osobní ochrany. Její pohyblivé klouby poskytují větší volnost pohybu než dřívější zbroje, zatímco pro nepřátelské zbraně zůstává téměř neproniknutelná."
 innovation_primogeniture: "Primogenitura"
 innovation_primogeniture_desc: "Jedno království, jeden dědic. Mladší děti našeho panovníka se mohou cítit opomenuty, když jim bude odepřeno dědictví, jde však o nejlepší způsob, jak zachovat stabilní panství, které nerozvrátí následnické krize."
 innovation_cranes: "Jeřáby"
 innovation_cranes_desc: "Římané při budování své říše s velkým úspěchem využívali šlapací jeřáby, tento pozapomenutý div stavitelství. Nyní je budeme využívat i my."
 innovation_noblesse_oblige: "Noblesse oblige"
 innovation_noblesse_oblige_desc: "Šlechtictví není pouze souborem výsad a práv, ale přináší také povinnost vůči panství a závazek jednat náležitě a spravedlivě. Jasným vymezením toho, co se od našich elit očekává, stanovíme ideál, k němuž můžeme směřovat, a spojíme své síly při jeho naplňování."
 innovation_rightful_ownership: "Právoplatné vlastnictví"
 innovation_rightful_ownership_desc: "Držet naše de iure země je naším božským právem a nastal čas, aby to uznal celý svět. Zastaralé postupy ani pravidla slušnosti nás již nebudou zdržovat."
 innovation_ermine_cloaks: "Exotické regálie"
 innovation_ermine_cloaks_desc: "Titul si může nárokovat kdokoli, avšak skutečný panovník musí ve svých poddaných vzbuzovat úžas a obdiv. Použití nejvzácnějších a nejexotičtějších materiálů v našem panovnickém oděvu toho zaručeně dosáhne."
 innovation_ermine_cloaks_ermine: "Hermelínové pláště"
 innovation_ermine_cloaks_ermine_desc: "Titul si může nárokovat kdokoli, avšak skutečný panovník musí ve svých poddaných vzbuzovat úžas a obdiv. Naše nové hermelínové pláště jsou panovnickým oděvem, který toho zaručeně dosáhne."
 innovation_court_officials: "Dvorští úředníci"
 innovation_court_officials_desc: "Naše panství se rozrostlo natolik, že ani drobní šlechtici již nedokážou vše účinně spravovat. Jmenování dvorských úředníků a byrokratů, kteří se postarají o všednější dvorské záležitosti, zajistí hladký chod vlády."
 innovation_development_04: "Renesanční myšlení"
 innovation_development_04_desc: "Pokrok ve vědě, filozofii a logice proměnil naše města v podivuhodná centra vzdělání a inovací. Mohutný technologický a kulturní rozmach, který nyní zažíváme, nám zpřístupnil možnosti, o nichž se dříve nikomu ani nesnilo."
 innovation_currency_04: "Směnky"
 innovation_currency_04_desc: "Papírové směnky, které představují další vývoj dřívějších bankovních systémů, umožňují našim obyvatelům rychle a bezpečně obchodovat se zbožím a službami na velké vzdálenosti, aniž by je zatěžovalo těžké kovové platidlo."
 innovation_wierdijks: "Wierdijky"
 innovation_wierdijks_desc: "Chceme-li žít a prosperovat v Nizozemí, je budování pevných a spolehlivých hrází nezbytností. Nové postupy zpevňování zemních hrází rohožemi z mořských řas zvýší jejich pevnost a odolnost."
 innovation_condottieri: "Kondotiéři"
 innovation_condottieri_desc: "Itálie se díky svému bohatství a výhodné poloze stala hlavním místem, kam míří žoldnéřské společnosti, když zrovna nebojují. Když už jsou zde, měli bychom s nimi dokázat vyjednat výhodnější cenu, než jakou si obvykle účtují."
 innovation_deccan_unity: "Jednota Dekánu"
 innovation_deccan_unity_desc: "Příliv nových vyznání a náboženství do naší společnosti jasně ukázal, že naše dřívější zaměření na regionalismus bylo chybou. Měli bychom se spojit s ostatními příslušníky naší víry a zajistit silný a trvalý stát, který dokáže čelit vnějším tlakům."
 students_of_knighthood: "Děti, které dokončí své [Concept('education','vzdělání')|E] s [Concept('education_focus','vzdělávacím zaměřením')|E] na [Concept('martial','vojenství')|E], získají [Concept('trait','rys')|E] $trait_education_martial_prowess$"
 fp3_innovation_mural_sextant: "Nástěnný sextant"
 fp3_innovation_mural_sextant_desc: "Tyto rozměrné nástěnné přístroje umožňují přesně určovat a měřit polohu nebeských těles."
 fp3_innovation_fritware: "Fritová keramika"
 fp3_innovation_fritware_desc: "Krásná kameninová keramika napodobující východní porcelán, vyráběná přimícháváním materiálů, jako je křemen či sklo. Představuje cenné obchodní zboží i působivý dar."
 fp3_innovation_fritware_tooltip: "Zisk [Concept('opinion','názoru')|E] z [Concept('send_gift','poslání daru')|E]: #P +20%#!"
 culture_parameter_silk_road_innovation_parameter: "Lze získat jako možnou [Concept('cultural_fascination','kulturní fascinaci')|E] pouze prostřednictvím [Concept('heritage','dědictví')|E] [GetCulturePillar('heritage_chinese').GetName], [Concept('tradition','tradice')|E] [GetCultureTradition('tradition_sinophilic').GetName] nebo [Concept('silk_road','Hedvábné stezky')|E]"
 innovation_fire_medicine: "Ohnivý lék"
 innovation_fire_medicine_desc: "Zkoumání tajemství života někdy odhalí věci, které přinášejí pouze smrt. Ohnivý lék, účinná směs síry, ledku a hořlavé látky, vytváří smrtící plamen, který hoří prudce, téměř výbušně."
 innovation_champa_rice: "Čamská rýže"
 innovation_champa_rice_desc: "Rýže vyžaduje hojnost času a vody — s výjimkou rýže z Čampy. Tato odrůda roste rychleji, lépe odolává suchu a poskytuje bohatší úrodu než téměř všechny ostatní známé druhy rýže. V některých případech ji lze sklízet dokonce dvakrát ročně. Při správném hospodaření může tato rýže podpořit zemědělství a vyvolat prudký růst obyvatelstva."
 culture_parameter_champa_rice_wet_land_paddies: "Řady [Concept('buildings','budov')|E] [GetBuilding('paddy_fields_01').GetTypeName|V] a [GetBuilding('farm_estates_01').GetTypeName|V] lze stavět v terénu [GetTerrain( 'wetlands' ).GetName]"
 culture_parameter_champa_rice_building_bonuses: "Řada [Concept('buildings','budov')|E] [GetBuilding('paddy_fields_01').GetTypeName|V] poskytuje dodatečné bonusy"
 building_paddy_fields_requirement_terrain_tt: "Jedna z následujících možností:\n$EFFECT_LIST_BULLET$[Concept('province','Provincie')|E] má terén [GetTerrain( 'terraced_hills' ).GetName]\n$EFFECT_LIST_BULLET$[Concept('province','Provincie')|E] má terén [GetTerrain( 'floodplains' ).GetName] a nachází se v [Concept('region','oblasti')|E] [GetGeographicalRegion('paddy_fields_region').GetName]\n$EFFECT_LIST_BULLET$[Concept('province','Provincie')|E] má terén [GetTerrain( 'wetlands' ).GetName] a [Concept('culture','kultura')|E] zná [Concept('innovation','inovaci')|E] #V $innovation_champa_rice$#!\n$EFFECT_LIST_BULLET$[Concept('province','Provincie')|E] má terén [GetTerrain( 'hills' ).GetName] nebo [GetTerrain( 'jungle' ).GetName] a [Concept('culture','kultura')|E] má [Concept('tradition','tradici')|E] [GetCultureTradition('tradition_tgp_rice_cultivators').GetName|V]"
 innovation_sericulture: "Hedvábnictví"
 innovation_sericulture_desc: "Umění výroby hedvábí je složitý, avšak velmi výnosný proces, jehož znalosti si žárlivě střeží ti, kteří těží ze svého mistrovství v tomto odvětví."
 culture_parameter_unlocks_silk_buildings_parameter: "Odemkne řadu [Concept('domicile_buildings','budov příbytku')|E] [GetDomicileBuilding('silk_01').GetNameNoTooltip|V]"
 innovation_dragon_kiln: "Dračí pece"
 innovation_dragon_kiln_desc: "Nejlepší porcelán lze vyrábět pouze ve vysoce specializovaných pecích poblíž cenných ložisek nerostů. Tyto pece se stavějí na strmých svazích, které pomáhají vytvářet vír žáru potřebný k výpalu co nejtvrdší keramiky. Přestože je jejich stavba náročná, jejich výrobky patří mezi nejmódnější a nejvýnosnější keramiku známou na kterémkoli dvoře."
 innovation_rocket_cart: "Raketové vozy"
 innovation_rocket_cart_chinese: "Huochē"
 innovation_rocket_cart_koreanic: "Hwačcha"
 innovation_rocket_cart_desc: "Pomocí výbušných směsí mnohem hrubších než těch, které vyžadují drahé bombardy, lze z jediného zařízení vypálit mohutné salvy zápalných šípů. Jelikož však tyto střely stále mají ničivost pouhého... šípu, hodí se mnohem lépe ke střelbě #italic z#! hradeb než #italic na#! ně."
 innovation_rocket_cart_chinese_desc: "$innovation_rocket_cart_desc$"
 innovation_rocket_cart_koreanic_desc: "$innovation_rocket_cart_desc$"
 innovation_compass: "Kompas"
 innovation_compass_desc: "S jednoduchým kusem magnetovce lze vždy určit směr, kterým člověk cestuje. Časem a s dalším vývojem snad bude možné plout, aniž by bylo kdy nutné zastavit a ptát se někoho na cestu."
 culture_parameter_cheaper_adventure_inspiration: "Cena dobrodružné [Concept('inspiration','inspirace')|E]: #P -50%#!"
 innovation_block_printing: "Deskotisk"
 innovation_block_printing_desc: "Pomocí soustavy vyřezávaných dřevěných desek lze sestavit soubor tiskových forem, které mohou být opakovaně použity k rozmnožování stejných slov a obrazů na jakémkoli vhodném materiálu. Tím se výroba knih výrazně zjednodušuje, snižují se náklady a psané slovo se stává mnohem dostupnějším všem."
 culture_parameter_block_printing_scriptorium_bonuses: "[SelectLocalization( HasDlcFeature( 'legends' ), 'culture_parameter_block_printing_scriptorium', 'blank_line' )]"
 culture_parameter_block_printing_scriptorium: "Řada [Concept('buildings','budov')|E] [GetBuilding('scriptorium_01').GetTypeName|V] poskytuje dodatečné bonusy"
 culture_parameter_block_printing_university_bonuses: "[SelectLocalization( HasDlcFeature( 'wards_and_wardens' ), 'culture_parameter_block_printing_university_bonuses_text', 'blank_line' )]"
 culture_parameter_block_printing_university_bonuses_text: "Cena studijních materiálů pro [GetActivityType('activity_adult_education').GetName]: #P -50%#!"
 innovation_grenades: "Granáty"
 innovation_grenades_desc: "Navzdory veškerému pokroku ve válečnictví zůstává jeden prastarý nástroj neocenitelný: lidská paže. Malé nádoby naplněné hořlavou či výbušnou látkou lze snadno vyrobit a hodit, má-li člověk alespoň trochu slušnou techniku hodu. Granáty rozdané vojákům před bitvou jim poskytují další způsob, jak zaútočit na nepřítele a otřást jím."
 innovation_cupellation: "Kupelace"
 innovation_cupellation_desc: "Specializované vysokoteplotní pece dokážou z důlních vzorků vytavit drahé kovy, oddělit je od roztavené rudy a vytvořit přečištěný vzorek, který mohou prubíři dále zkoumat. Kupelace rudy z olověného dolu je nejlepším způsobem, jak určit obsah stříbra v dole, zatímco kupelací zlata lze stanovit jeho ryzost pro případnou ražbu mincí."
 culture_parameter_cupellation_mine_building_bonuses: "[Concept('baronies','Daně')|E] z [Concept('holdings','držav')|E] se [Concept('special_building','zvláštní budovou')|E] #V Důl#! v [Concept('baronies','baronstvích')|E]: #P @gold_icon![EmptyScope.ScriptValue('innovation_cupellation_mine_tax_bonus_value')|%0+=]#! "
 innovation_lacquered_armor: "Lakovaná zbroj"
 innovation_lacquered_armor_desc: "Pečlivé nanášení určitých pryskyřic na zbroj ji značně zpevňuje a pomáhá chránit těžší železné pláty před nepříznivým počasím. Přestože je tento postup znám již delší dobu, jeho využití se dosud omezovalo převážně na skříňky, lahve a jiné výrobky. Lakovaná zbroj představuje nový způsob ochrany vojáků i jejich výstroje."
 culture_parameter_higher_quality_armor_artifacts_parameter: "Zbrojní [Concept('artifacts','artefakty')|E] ze [Concept('sponsored','sponzorovaných')|E] [Concept('inspirations','inspirací')|E] a [GetDecision('commission_artifact_decision').GetName] mají vyšší kvalitu"
 innovation_double_entry_bookkeeping: "Podvojné účetnictví"
 innovation_double_entry_bookkeeping_desc: "Záznamy musí držet krok s rostoucí složitostí financí a hospodářství. Zapisování všech příchozích a odchozích plateb do samostatných záznamů pomáhá udržovat spolehlivé účetní bilance a zajišťuje, že při kontrole účtů nebudou žádné položky náhodou — či „náhodou“ — přehlédnuty."
 culture_parameter_bookkeeping_collect_taxes_bonus: "$task_collect_taxes$ [Concept('councillor_task','úkol rádce')|E]: [gold_i|E]#P +10%#!"
 innovation_waterworks: "Vodní díla"
 innovation_waterworks_desc: "Voda dává život, má však mnoho dalších využití než jen hašení žízně či zavlažování polí. Dovedně využitá voda spadlá z nebes může pohánět stroje mnohonásobně silnější než jakékoli tažné zvíře, usnadňovat cestování a obchod po umělých kanálech nebo prostě udržovat rušné ulice čisté a obyvatelné."
 culture_parameter_unlocks_waterworks_buildings: "Odemkne řadu [Concept('buildings','budov')|E] [GetBuilding('waterworks_01').GetTypeName|V]"
 innovation_tiefutu: "$tiefutu$"
 innovation_tiefutu_desc: "$tiefutu_flavor$"
 innovation_bulkheads: "Vodotěsné přepážky"
 innovation_bulkheads_desc: "Nejjistějším způsobem, jak zabránit potopení lodi, je vůbec neprorazit její trup. Pokud by se tak přesto stalo, loď by bylo možné zachránit rozdělením trupu na oddíly oddělené vodotěsnými stěnami. I po poškození lodi může přepážka zabránit tomu, aby ji voda zcela potopila, a zachránit tak posádku, zásoby i samotné plavidlo."
 innovation_coking: "Koksování"
 innovation_coking_desc: "Dřevěné uhlí je pro kovářství nepostradatelné, jeho výroba však vyžaduje dostatek okolních lesů, jejichž dřevo lze přeměnit na toto nezbytné palivo. Zahříváním uhlí v zařízení podobném milíři lze získat koks. Ten je v kovářství a dalších průmyslových pecích stejně užitečný jako dřevěné uhlí, aniž by bylo nutné vykácet celý les."
 culture_parameter_coking_smith_bonuses: "Řady [Concept('buildings','budov')|E] [GetBuilding('smiths_01').GetTypeName|V] a [GetBuilding('blacksmiths_01').GetTypeName|V] poskytují dodatečné bonusy"
 innovation_composite_crossbow: "Kompozitní kuše"
 innovation_composite_crossbow_desc: "Stejně jako u jednoduchých luků určuje síla ramen luku možnou sílu jeho nátahu. Zpevněním lučiště rohovinou, či dokonce ocelí lze mnohonásobně zvýšit sílu nátahu, dostřel i průraznost kuše oproti jakékoli dřevěné obdobě a zároveň zvýšit její odolnost a životnost."
 innovation_pharmacopoeia: "Lékopis"
 innovation_pharmacopoeia_desc: "Každý dobrý lékař musí vědět, jak ve správný čas vyrobit správné léčivo ze správných přísad připravených správným způsobem a ve správném množství. Tyto znalosti se často předávají jednotlivě z mistra na učedníka, avšak #italic sepsání#! postupů pro výrobu konkrétních léčiv může výrazně napomoci sjednocení a šíření přípravy různých léčebných prostředků."
 culture_parameter_physician_pharmacopoeia_bonus: "Účinnost léčby [Concept('court_position','dvorského úřadu')|E] [GetCourtPositionType('court_physician_court_position').GetName()]: #P +20%#!"
