 innovation_heavy_plow: "Těžký pluh" # todo: NEW TRANSLATION
 innovation_heavy_plow_desc: "I těžší železné pluhy mohou snadno táhnout voli či koně, pokud jsou opatřeny koly a zapřaženi jsou k nim více zvířat. Tato inovace nám umožňuje obdělávat půdu, kterou by jinak bylo těžké, či dokonce nemožné, využívat." # todo: NEW TRANSLATION
 innovation_heavy_plow_eri: "Systém eri" # todo: NEW TRANSLATION
 innovation_heavy_plow_eri_desc: "Soustava hrázemi zpevněných nádrží zachytává monzunové deště a zadržuje vodu po suché měsíce, což nám umožňuje sázet, pěstovat i sklízet po celý rok." # todo: NEW TRANSLATION
 innovation_heavy_plow_transplanting: "Přesazování a roubování" # todo: NEW TRANSLATION
 innovation_heavy_plow_transplanting_desc: "Díky technikám pěstování a rozmnožování rostlin můžeme výrazně zvýšit výnosy." # todo: NEW TRANSLATION
 culture_parameter_stone_forts: "[GetBuildingType('wall_wardens_offices_1').GetName] vyžaduje [GetTradeGoodType('trade_good_stone').GetNameWithIcon] namísto [GetTradeGoodCategory('trade_category_carpentry_supplies').GetName]" # todo: NEW TRANSLATION
 culture_parameter_heavy_plow: "[GetDistrictType('grain_district').GetName] nyní vyžaduje [GetTradeGoodType('trade_good_iron').GetNameWithIcon] a [GetTradeGoodCategory('trade_category_beasts_of_burden').GetName] namísto pouhého [GetTradeGoodType('trade_good_cattle').GetNameWithIcon]" # todo: NEW TRANSLATION
 innovation_prospecting: "Průzkum nalezišť" # todo: NEW TRANSLATION
 innovation_prospecting_desc: "Aktivním a systematickým vyhledáváním nových rudných žil můžeme výrazně rozšířit těžbu v našem panství." # todo: NEW TRANSLATION
 innovation_coppicing: "Výmladkové hospodaření" # todo: NEW TRANSLATION
 innovation_coppicing_desc: "Pečlivým a systematickým prořezáváním a ošetřováním stromů můžeme výrazně zvýšit produkci v našich lesích a podpořit tak řemesla, jako je výroba dřevěného uhlí a palivového dříví." # todo: NEW TRANSLATION
 innovation_monasticism: "Mnišství" # todo: NEW TRANSLATION
 innovation_monasticism_desc: "Kláštery nejsou žádnou novinkou, ale rozrostly se a jsou čím dál běžnější. Kolem kdysi osamělých útočišť nyní vznikají celé náboženské obce s vlastní ekonomikou a přilehlými laickými sídly." # todo: NEW TRANSLATION
 innovation_craft_ordinances: "Řemeslnické řády" # todo: NEW TRANSLATION
 innovation_craft_ordinances_desc: "Řemeslníci sice nemusí mít regulace v oblibě, ale cení si práva stanovovat pravidla pro svá specializovaná řemesla. Kontrola kvality a cen je výhodná pro všechny." # todo: NEW TRANSLATION
 innovation_merchant_law: "Obchodní právo" # todo: NEW TRANSLATION
 innovation_merchant_law_desc: "Sepíšeme-li zvyklosti, kterými se obchod řídí, a budeme-li se jimi řídit, zajistíme, aby obchod v našich zemích probíhal svobodněji a spořádaněji." # todo: NEW TRANSLATION
 innovation_vaulting: "Klenby" # todo: NEW TRANSLATION
 innovation_vaulting_desc: "Vysoké a štíhlé klenby jsou nejen působivé na pohled, ale také mnohem bezpečnějším způsobem, jak zastřešit velké budovy. Klenby, které naši kameníci nyní stavějí, spotřebují méně kamene a prodlužují životnost budov." # todo: NEW TRANSLATION
 innovation_putting_out_system: "Rozptýlená výroba" # todo: NEW TRANSLATION
 innovation_putting_out_system_desc: "Zavedeme-li zastřešující organizaci výroby, která každý den probíhá v každé chalupě či usedlosti našeho panství, dosáhneme mnohem větší efektivity. Obchodníci se postarají o nákup surovin i prodej hotových výrobků." # todo: NEW TRANSLATION
 innovation_deep_mining: "Hlubinná těžba" # todo: NEW TRANSLATION
 innovation_deep_mining_desc: "Abychom mohli hloubit doly více než kdy dříve, vymysleli jsme řadu technických řešení: dřevem vyztužené chodby, lepší odvodňování a navijáky. Díky těmto vylepšením můžeme sledovat rudné žíly mnohem hlouběji než kdokoli před námi." # todo: NEW TRANSLATION
 innovation_pilot_books: "Plavební příručky" # todo: NEW TRANSLATION
 innovation_pilot_books_desc: "Navigace je nebezpečné řemeslo a bez místních lodivodů by většina lodí ztroskotala i podél relativně bezpečného, ale neznámého pobřeží. Zaznamenáním každého mysu, mělčiny a kotviště, jejich směrů a vzdáleností, můžeme navždy uchovat poznatky, které by jinak zanikly s jediným člověkem." # todo: NEW TRANSLATION
 innovation_pilot_books_portolan: "Portolánové mapy" # todo: NEW TRANSLATION
 innovation_pilot_books_portolan_desc: "Navigace je nebezpečné řemeslo a bez místních lodivodů by většina lodí ztroskotala i podél relativně bezpečného, ale neznámého pobřeží. Vyznačíme-li do map směrové linie vycházející z kompasové růžice a zaznamenáme-li podél nich každý mys, mělčinu a kotviště, můžeme navždy uchovat poznatky, které by jinak zanikly s jediným člověkem." # todo: NEW TRANSLATION
 innovation_agronomy: "Agronomie" # todo: NEW TRANSLATION
 innovation_agronomy_desc: "Obdělávání půdy může být náročné a znalosti se často předávají jen od jednoho rolníka druhému. Shromáždíme-li tyto poznatky a sepíšeme-li pojednání o plodinách a hospodaření, můžeme šířit osvědčené znalosti a proměnit tradice ve zdokonalené metody." # todo: NEW TRANSLATION
 innovation_bricks: "Cihly" # todo: NEW TRANSLATION
 innovation_bricks_desc: "Cihly našim předkům nebyly neznámé, ale znalost jejich výroby a použití už není tak rozšířená jako kdysi. Technologie spolehlivé výroby a využití tohoto jednoduchého umělého stavebního materiálu umožňuje stavět každý dům rychleji a efektivněji." # todo: NEW TRANSLATION
