 tradition_hird_name: "$innovation_hird$"
 tradition_hird_desc: "$innovation_hird_desc$"
 innovation_hird: "Hirdy"
 innovation_hird_desc: "Tradice vydržování ozbrojených družin ve službách domácnosti se nám dobře osvědčila. Formalizací a rozšířením tohoto systému můžeme ve svých armádách nasazovat celé pluky huskarlů."
 innovation_zweihanders: "Zweihändery"
 innovation_zweihanders_desc: "Tyto mohutné obouruční meče jsou stejně účinné při srážení útočících $knight_culture_player_plural_no_tooltip_lowercase$ jako při rozbíjení nepřátelských formací kopiníků, a představují tak hrozivou posilu našich vlastních kopinických pluků."
 innovation_adaptive_militia: "Přizpůsobivá domobrana"
 innovation_adaptive_militia_desc: "Zbraně jako goedendag jsou levné a snadno se vyrábějí, přesto však překvapivě účinně čelí útokům jízdy. Díky nim můžeme svou domobranu přizpůsobit tak, aby měla mnohem větší šanci v boji proti obrněným $knight_culture_player_plural_no_tooltip_lowercase$."
 innovation_valets: "Jízdní sluhové"
 innovation_valets_desc: "Zavedení systému oddaných sluhů pečujících o naše urozené jezdce nám umožní nasazovat $knight_culture_player_plural_no_tooltip_lowercase$, kteří budou lépe vyzbrojeni i chráněni zbrojí."
 innovation_pike_columns: "Kolony kopiníků"
 innovation_pike_columns_desc: "Kopiníci byli vždy silnými obránci, historicky jim však chyběla pohyblivost a útočná síla. Vytvoření nových formací, které tento nedostatek napraví, zvýší naše vyhlídky na vítězství v bitvě."
 innovation_legionnaires: "Legionáři"
 innovation_legionnaires_desc: "Stejně jako jsme obnovili Římskou říši, obnovíme i uspořádání staré římské legie a její obávané elitní jednotky!"
 innovation_desert_tactics: "Pouštní taktika"
 innovation_desert_tactics_desc: "Levant je nám neznámou zemí s terénem nevhodným pro útoky jízdy. Musíme se těmto podmínkám přizpůsobit a nasazovat jezdectvo, které se lépe hodí k boji v našem novém domově."
 innovation_caballeros: "Caballeros"
 innovation_caballeros_desc: "Andaluští hřebci se v obtížném terénu pohybují a bojují lépe než jiná plemena koní. Můžeme vycvičit specializované jízdní pluky, které této přednosti využijí."
 innovation_cataphracts: "Katafrakti"
 innovation_cataphracts_desc: "Naše obávaná katafraktní jízda, zcela oděná do ochranné železné zbroje, dokáže útokem s kopími prorazit téměř jakoukoli obrannou linii."
 innovation_hobbies: "Hobbyové"
 innovation_hobbies_desc: "Jezdci na našich keltských koních hobby jsou rychlí a obratní, takže se dokonale hodí k průzkumu a nájezdům v obtížném terénu, kam se nepřátelští $knight_culture_player_plural_no_tooltip_lowercase$ zdráhají vstoupit."
 innovation_rectilinear_schiltron: "Obdélníkový schiltron"
 innovation_rectilinear_schiltron_desc: "Tradiční kruh kopiníků je mocnou obrannou formací, má však omezené útočné možnosti a pohyblivost. Náš obdélníkový schiltron vyžaduje značnou kázeň, ale jde o dokonalejší formaci schopnou účinných útočných i obranných manévrů."
 tradition_forest_wardens_name: "$innovation_forest_wardens$"
 tradition_forest_wardens_desc: "$innovation_forest_wardens_desc$"
 innovation_forest_wardens: "Strážci lesů"
 innovation_forest_wardens_desc: "Naši předkové žili v těchto lesích po celé generace, nyní je však ohrožují cizinci. Staletí zkušeností s bojem v lesích nám pomohou chránit naši rodnou zem."
 innovation_compound_bows: "Kompozitní luky"
 innovation_compound_bows_desc: "Naše kompozitní luky, vyráběné z lepených vrstev rohoviny, dřeva a šlach, jsou mnohem menší než tradiční luky, přesto stejně silné. Díky menším rozměrům z nich lze pohodlně střílet ze sedla, což nám umožňuje nasazovat v bitvě skutečně ničivé jízdní lučištníky."
 tradition_khadga_puja_name: "Khadga púdža"
 tradition_khadga_puja_desc: "Tato kultura přijala bojové umění a rituální uctívání širokých obouručních mečů, což jí umožňuje vychovávat silné a schopné válečníky. Těžké meče jim dovolují kosit pěchotu i jízdu."
 innovation_khandayats: "Khandájati"
 innovation_khandayats_desc: "Naši cenění pěšáci, zběhlí v používání širokého meče khanda, se výborně hodí jak k boji v džungli, tak k porážení nepřátelské lehké jízdy."
 tradition_garuda_warriors_name: "Válečníci Garudové"
 tradition_garuda_warriors_desc: "Význační válečníci této kultury jsou označováni za Garudy a očekává se od nich boj až do smrti. Dokonce i ti, kdo Garudu následují, mají zemřít, padne-li jejich vůdce, ať už v bitvě, nebo vlastní rukou."
 tradition_futuwaa_name: "$innovation_futuwaa$"
 tradition_futuwaa_desc: "$innovation_futuwaa_desc$"
 innovation_futuwaa: "Futuwwa"
 innovation_futuwaa_desc: "Naši mladí začali zakládat spolky podporující udatnost, tělesnou zdatnost a mravné chování. Schválením a podporou těchto spolků si zajistíme dostatek schopných vojáků, které budeme moci povolat do svých služeb."
 tradition_land_of_the_bow_name: "Země luku"
 tradition_land_of_the_bow_desc: "Núbijci po celé generace prosperují v úrodné zemi obohacované Nilem a vlastní vynalézavostí. Téměř stejně dlouho je luk jejich oblíbenou zbraní k odhánění nájezdníků a lapků z okolních pouští."
 tradition_desert_ribat_name: "Pouštní ribáty"
 tradition_desert_ribat_desc: "Tato kultura má tradici opevněných pouštních útočišť, v nichž mohou zbožní lidé žít v sepětí s otevřeným nebem a písečnými pláněmi. Tento způsob života vychovává schopné a zbožné pouštní válečníky a přitahuje mystiky."
 tradition_mubarizuns_name: "$innovation_mubarizuns$"
 tradition_mubarizuns_desc: "$innovation_mubarizuns_desc$"
 innovation_mubarizuns: "Mubárizún"
 innovation_mubarizuns_desc: "Naši vojáci mubárizún, utvoření podle vzoru legendárních šampionů armády chalífy rášidského chalífátu, jsou cvičeni k vynikajícím výkonům ve formovaném boji i v soubojích muže proti muži."
 tradition_hussar_name: "$innovation_hussar_raids$"
 tradition_hussar_desc: "$innovation_hussar_raids_desc$"
 innovation_hussar_raids: "Nájezdy $hussar$"
 innovation_hussar_raids_desc: "Naši $hussar$ tvoří lehkou jízdu, která dokáže rychle udeřit na nechráněné nepřátele a vzápětí se stáhnout. Můžeme z nich sestavovat pluky specializované na obtěžování nepřítele a nájezdy."
 tradition_druzhina_name: "$innovation_druzhina$"
 tradition_druzhina_desc: "$innovation_druzhina_desc$"
 innovation_druzhina: "Družina"
 innovation_druzhina_desc: "Varjažští vojáci již dlouho slouží jako obávaní osobní strážci našich panovníků, stejně dobře však mohou v našich armádách působit jako oddaná těžká pěchota."
 tradition_horn_mountain_skirmishing_name: "$innovation_mountain_skirmishing$"
 tradition_horn_mountain_skirmishing_desc: "$innovation_mountain_skirmishing_desc$"
 innovation_mountain_skirmishing: "Horské šarvátky"
 innovation_mountain_skirmishing_desc: "Vysoké hory Afrického rohu představují pro mnohé druhy armád značné logistické obtíže, naši lehcí pěšáci se však těmto podmínkám snadno přizpůsobí a dokážou zahnat nepřátelské nájezdníky."
 tradition_bush_hunting_name: "$innovation_bush_hunting$"
 tradition_bush_hunting_desc: "$innovation_bush_hunting_desc$"
 innovation_bush_hunting: "Lov v buši"
 innovation_bush_hunting_desc: "Buš je drsným a nehostinným prostředím, těm, kdo vědí, kde hledat a jak využít její možnosti, však nabízí bohatou kořist. Výcvik našich lučištníků v těchto dovednostech jim poskytne výhodu při střetu s nepřáteli v těchto oblastech."
 tradition_mobile_guards_name: "$innovation_mobile_guards$"
 tradition_mobile_guards_desc: "$innovation_mobile_guards_desc$"
 innovation_mobile_guards: "Obranná taktika"
 innovation_mobile_guards_desc: "Náš lid byl znovu a znovu vyháněn a posílán do vyhnanství. Přestože jsou tyto zkušenosti tragické, naučily nás výjimečně dobře ovládat taktiku zadního voje, která omezuje ztráty."
 innovation_alpine_supremacy: "Horská nadvláda"
 innovation_alpine_supremacy_desc: "Vysoká nadmořská výška naší domoviny vyžaduje od vojáků jiné zásobování a bojové postupy než nížiny. Ovládnutím těchto schopností se staneme nespornými pány hor."
 innovation_sahel_horsemen: "Sahelští jezdci"
 innovation_sahel_horsemen_desc: "Sahel je suchá a vyprahlá rovina, kde se rozsáhlé vzdálenosti často překonávají na koních. Sahelští jezdci jsou bojovníci na koních, kteří používají lehkou prošívanou zbroj a oštěpy k ničení svých nepřátel. Jsou rychlí a snadno snášejí pouště i suché krajiny."
 innovation_bamboo_bows: "Bambusový luk"
 innovation_bamboo_bows_desc: "Jednou z nejstarších tradičních zbraní indických pěšáků je bambusový luk, který je levný na výrobu a snadno se přenáší i udržuje. Jelikož je luk také oblíbenou zbraní mnoha lovců, indické armády nemají nouzi o zkušené lučištníky."
 innovation_zbrojnosh: "Zbrojnoši"
 innovation_zbrojnosh_desc: "Zalesněné kopce a hory naší domoviny vyžadují odlišný přístup k válčení. Naši ozbrojení muži, zbrojnoši, jsou cvičeni k využívání terénu ve svůj prospěch a osvědčili se jako zdatní bojovníci schopní porazit i mnohem početnější armády."
 tradition_upland_skirmishing_name: "$innovation_upland_skirmishing$"
 tradition_upland_skirmishing_desc: "$innovation_upland_skirmishing_desc$"
 innovation_upland_skirmishing: "Šarvátky ve vysočině"
 innovation_upland_skirmishing_desc: "Kopce zalesněné savany jsou po celé generace naší domovinou. Naši předkové nás naučili tento terén využívat a nyní, když naše hranice ohrožují nájezdníci, můžeme tyto znalosti uplatnit při obraně."
 innovation_sarawit: "Sarawit"
 innovation_sarawit_desc: "Vysočina, v níž se usadili naši předkové, vyžaduje zvláštní přístup k zemědělství. Budování terasovitých polí nás naučilo rozvíjet nové vojenské taktiky, které využívají naši vojáci sarawit."
 tradition_mountain_herding_name: "Horské pastevectví"
 tradition_mountain_herding_desc: "Tato kultura nalezla domov v chladnějších horách jinak suchého a vyprahlého kraje. Pastevci a rolníci z těchto vysočin se stávají houževnatými a odolnými válečníky a jejich práce postupně umožnila tomuto lidu vzkvétat vysoko nad holou pouští."
 innovation_desert_mountain_herding: "Pastevectví v pouštních horách"
 innovation_desert_mountain_herding_desc: "Lidé z našich hor od pradávna hledají způsoby, jak pást svá stáda v nehostinném terénu. Díky tomu se z nich stali mimořádně houževnatí a odolní válečníci zvaní Abudrar."
 tradition_burman_royal_army_name: "Královská armáda"
 tradition_burman_royal_army_desc: "$innovation_royal_army_tradition_desc$"
 innovation_royal_army_tradition: "Tradice královské armády"
 innovation_royal_army_tradition_desc: "Máme dlouhou tradici stálé armády určené k ochraně hlavního sídla. Díky ní máme přístup k houževnatým vojákům, kteří mimořádně dobře spolupracují s podpůrnými jednotkami, jako jsou váleční sloni."
 innovation_repeating_crossbow: "Opakovací kuše"
 innovation_repeating_crossbow_chinese: "Shenbigong"
 innovation_repeating_crossbow_desc: "Spojením ocelí vyztužených ramen s mechanickými napínacími soustavami získaly tyto pokročilé kuše větší dostřel i ničivost. Tato inovace předznamenala přechod od obrany založené na množství střel k přesnému nasazení v poli a poskytla profesionálním armádám zbraně hodné říše."
 innovation_repeating_crossbow_chinese_desc: "$innovation_repeating_crossbow_desc$"
 innovation_men_at_arms: "Ozbrojenci"
 innovation_men_at_arms_desc: "Výcvik a vyzbrojování stálých vojsk, která zůstávají přímo k dispozici našim vládcům, bude důležitým krokem na cestě k centralizaci naší moci."
 innovation_pole_vault: "Skok o tyči"
 innovation_pole_vault_desc: "Skok o tyči je jednoduchý vynález, jehož zvládnutí však vyžaduje důkladný výcvik a značnou praxi. Zkušený skokan se dokáže přenést přes široké mezery, vysoké skály, a dokonce i některá opevnění."
