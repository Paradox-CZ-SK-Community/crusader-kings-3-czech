l_polish:
 culture_group_military: "Vojenské"
 culture_group_civic: "Občanské"
 culture_group_regional: "Kulturní a regionální"
 culture_group_any: "Libovolné"
 culture_era_tribal: "Kmenová éra"
 culture_era_tribal_desc: "Kmenová éra [Concept('culture','kultury')|E] předchází vzniku kodifikovaného práva a institucionalizované vlády. Vládci s [Concept('tribal_government','kmenovou vládou')|E] nebo [Concept('nomadic_government','kočovnou vládou')|E] mohou využívat pouze [Concept('innovations','inovace')|E] kmenové éry."
 culture_era_early_medieval: "Raný středověk"
 culture_era_early_medieval_desc: "Raný středověk přináší vzestup profesionálních správců a řadu významných [Concept('innovations','inovací')|E], díky nimž může [Concept('culture','kultura')|E] vystoupit z temného věku."
 culture_era_high_medieval: "Vrcholný středověk"
 culture_era_high_medieval_desc: "Vrcholný středověk je obdobím značného technologického a správního pokroku. Městečka se rozrůstají v města a sílí měšťanská vrstva, zatímco šlechta si nadále udržuje své výsadní postavení."
 culture_era_late_medieval: "Pozdní středověk"
 culture_era_late_medieval_desc: "Pozdní středověk představuje vrchol feudálního světa. Byrokraté, řemeslníci, obchodníci a lichvaři začínají narušovat moc starých privilegovaných vrstev, s výjimkou samotných panovníků."
