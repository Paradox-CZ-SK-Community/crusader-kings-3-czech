l_polish:
 language_events.0001.t: "Jazyková ochablost"
 language_events.0001.desc: "Je těžké udržet si všechny ty jazyky v hlavě, pořád zapomínám, kterým zrovna mluvím!\n\nNedávno jsem se omylem [Select_CString( ROOT.Char.IsFemale, 'představila', 'představil' )] zmatenou směsicí slov, když se mi dohromady smíchaly [language_to_forget.GetLanguage.GetNameNoTooltip|l] a [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip|l]... a vůbec jsem si toho [Select_CString( ROOT.Char.IsFemale, 'nevšimla', 'nevšiml' )], dokud mě na to někdo neupozornil!\n\nMožná bych měl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] prostě nechat, ať [language_to_forget.GetLanguage.GetNameNoTooltip|l] vyprchá z mé mysli...?"
 language_events.0001.a: "Ať upadne v zapomnění..."
 language_events.0001.b: "Ne! Musím se víc snažit a více studovat!"
 language_events.0002.b.tt: "Vyšleš výběrčí, aby „vybrali“ [gold_i]#P 50#! z každého [Concept('county','hrabství')|E], kde převládá [vassal_speaking_other_language.GetCulture.GetName] kultura v [vassal_speaking_other_language.GetTitledFirstNamePossessive] panství"
 language_events.0002.t: "Společný jazyk"
 language_events.0002.desc: "Doneslo se mi, že můj vazal [vassal_speaking_other_language.GetTitledFirstName] veřejně vychvaluje, jak mi jde [vassal_speaking_other_language.GetCulture.GetLanguage.GetName|l] — tím totiž mluví [Select_CString( vassal_speaking_other_language.IsFemale, 'její', 'jeho' )] vlastní poddaní!\n\nMí rádci navrhují, abych této příležitosti využil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] a poslal[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [Select_CString( vassal_speaking_other_language.IsFemale, 'jí', 'mu' )] dopis v tomto jazyce, v němž ocením [Select_CString( vassal_speaking_other_language.IsFemale, 'její', 'jeho' )] počínání."
 language_events.0002.a: "„S větším porozuměním přichází společná prosperita!“"
 language_events.0002.b: "„Ó, hó hó! Teď tě mohu zdanit mnohem účinněji, drahý vazale!“"
 language_events.0010.t: "Je čas na lekci! [language_to_forget.GetLanguage.GetNameNoTooltip|U] čeká!"
 language_events.0010.desc: "Probouzím se zpocen[Select_CString( ROOT.Char.IsFemale, 'á', 'ý' )] po úmorné noční můře, v níž mě neustále pronásledovala sova a zkoušela, zda má [language_to_forget.GetLanguage.GetNameNoTooltip] nezapadla prachem.\n\nTento opeřený netvor, v některých kulturách symbol moudrosti, mě celou noc sledoval a já se děsil[Select_CString( ROOT.Char.IsFemale, 'a', '' )], že jej zklamu. Možná opravdu existuje něco jako „příliš mnoho vědomostí“ a tento sen je výsledkem všeho stresu, který pociťuji při snaze udržet své schopnosti vytříbené."
 language_events.0010.a: "Takhle to nemůže pokračovat."
 language_events.0010.b: "Budu se i nadále každý den překonávat!"
