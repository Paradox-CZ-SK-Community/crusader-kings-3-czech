 tradition_cultural_primacy_name: "Kulturní prvenství"
 tradition_cultural_primacy_desc: "Tato hrdá kultura se spokojí s čerpáním z vlastní bohaté historie a společenského života a necítí potřebu se snižovat k mísení se svými sousedy."
