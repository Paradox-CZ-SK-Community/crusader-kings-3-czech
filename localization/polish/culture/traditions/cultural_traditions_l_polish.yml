 culture_parameter_kris_artifacts_are_more_powerful: "Vytvořené Kris $artifact_dagger$ [Concept('artifacts','artefakty')|e] získávají další výhody" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tradition_tgp_barangay_confederations_name: "Konfederace Barangay" # todo: NEW TRANSLATION
 tradition_tgp_barangay_confederations_desc: "Vládci této kultury vedou mnoho roztroušených městských států podél ústí řek a pobřeží. Takové státy se velmi liší velikostí, ale mají tendenci se sdružovat do konfederací, které vedou náčelník vybraný z členů, označovaný jako [Glossary( 'Datu', 'DATU_GLOSS' )]." # todo: NEW TRANSLATION
 DATU_GLOSS: "Titul označující náčelníky různých politických útvarů nacházejících se po celých Filipínách." # todo: NEW TRANSLATION
