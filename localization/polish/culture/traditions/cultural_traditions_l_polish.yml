 not_a_defense_focused_culture: "Méně než #N 50%#! [Concept('counties','hrabství')|e] této [Concept('culture','kultuře')|e] jsou [coastal|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tradition_tgp_hydraulic_builders_name: "Stavitelé vodních děl" # todo: NEW TRANSLATION
 tradition_tgp_hydraulic_builders_desc: "Tato kultura klade velký důraz na využití vodních staveb v duchovních praktikách. V centru tohoto zájmu stojí [GetBuilding('sacred_pool_06').GetName], které bývají rozšiřována do velkých rezervoárů s nejvyšším náboženským významem." # todo: NEW TRANSLATION
 culture_parameter_sacred_pool_additional_bonuses: "Řada [GetBuilding('sacred_pool_01').GetTypeName|V] [Concept('buildings','budovy')|E] má dodatečné bonusy v [Concept('counties','hrabství')|E] této [Concept('culture','kultuře')|E]#V $building_type_sacred_pool_01$#!" # todo: CONCEPT CASE
 culture_parameter_waterworks_additional_bonuses: "Řada [GetBuilding('waterworks_01').GetTypeName|V] [Concept('buildings','budovy')|E] má dodatečné bonusy v [Concept('counties','hrabství')|E] této [Concept('culture','kultuře')|E]#V $building_type_waterworks_01$#!" # todo: CONCEPT CASE
 culture_parameter_may_build_sacred_pools_ahead_of_time: "Všechny [GetBuilding('sacred_pool_01').GetTypeName|V] [Concept('buildings','budovy')|E] lze postavit o jedno [Concept('era','éra')|E] dříve" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tradition_tgp_esoteric_power_name: "Esoterická moc" # todo: NEW TRANSLATION
 tradition_tgp_esoteric_power_desc: "Božské a tajemné jsou slova, která popisují šlechtu v očích této kultury. Vládci, kteří chtějí zajistit svůj mandát, musí provádět složité rituály a manifestovat svou moc vystavováním posvátných artefaktů." # todo: NEW TRANSLATION
 culture_parameter_increases_effect_of_mandala_realm_contracts: "Zisk [Concept('piety','zbožnost')|e] a [Concept('legitimacy','legitimita')|e] z [Concept('mandala_rituals','rituálů mandaly')|e] je zvýšen" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 culture_parameter_may_commission_kris: "Může použít [GetDecisionWithKey('commission_artifact_decision').GetName] [Concept('decision','rozhodnutí')|e] k objednání Kris [Concept('artifacts','artefakty')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
