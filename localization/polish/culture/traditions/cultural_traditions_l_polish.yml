 culture_tradition_events.0100.t: "Střet kultury a víry"
 culture_tradition_events.0100.desc: "Dorazilo poselství od [head_of_faith.GetTitledFirstName]. Začíná zdvořilými slovy a zdůrazňuje význam, který mám v očích [culture_scope.GetName] lidu.\n\n"
 culture_tradition_events.0100.tradition_monogamous: "„Musíš pochopit, že dokud tvůj lid praktikuje monogamii, porušuješ to, co učí [faith_scope.GetAdjective|l] víra! Toužím pouze po tvé spáse. Povinnost každého dobrého věřícího nemůže být naplněna pouze s jedním manželem či manželkou.“ stojí v poselství." 
 culture_tradition_events.0100.tradition_polygamous: "„Tvé praktikování polygamie je v přímém rozporu s tím, co učí [faith_scope.GetAdjective|l] víra a [faith_scope.HighGodName] tyhle hříchy vidí! Toužím pouze po tvé spáse. Veď svůj lid ke světlu a zbavte se přebytečných manželů a manželek!“ stojí v poselství."
 culture_tradition_events.0100.tradition_concubines: "„Tvé praktikování konkubinátu [faith_scope.GetAdjective|l] víra nepodporuje. Pouze prostřednictvím řádného manželství se [faith_scope.HighGodName] usměje na tvůj lid! Toužím pouze po tvé spáse. Opusti své konkubíny pro dobro nás všech.“ stojí v poselství."
 culture_tradition_events.0100.end: "\n\nTo je skutečné dilema... čeho si cením více? Zvyků svého lidu, nebo doktrín naší víry?"
 culture_tradition_events.0100.a: "Musíme dodržovat, co nás učí [faith_scope.GetAdjectiveNoTooltip|l] víra."
 culture_tradition_events.0100.b: "Zvyky mého lidu jsou důležitější!"
 culture_tradition_events.0101.t: "Mysl mystika"
 culture_tradition_events.0101.desc: "Je už tak vzácné, když mám příležitost v klidu povečeřet bez přerušování pochlebovači nebo státními záležitostmi, ale dnes večer se mi to podařilo. Příjemná, poklidná večeře a příležitost odpočinout si od společenských povinností.\n\nBěhem několika vteřin se dveře s tragickou nevyhnutelností vyrazí z pantů a do místnosti vtrhne [mendicant_mystic.GetFaith.PriestNeuter]. Svírá pokroucenou vycházkovou hůl, stále pokrytou třískami po tom, co s ní jediným úderem vyrazil dveře.\n\n„Urozený [ROOT.Char.GetTitleAsNameNoTooltip], přicházím s nabídkou! Za malý příspěvek se já, #EMP [mendicant_mystic.GetFirstName]#!, podělím s dětmi tvého dvora o znalosti dávných zvyků našeho lidu!“"
 culture_tradition_events.0101.a: "Samozřejmě, urozený [mendicant_mystic.GetFaith.PriestNeuter]. Prosím, odložte tu údernou hůl."
 culture_tradition_events.0101.a.tt: "Všechny dostupné [Concept('children','děti')|E] u [Concept('court','dvora')|E] získají posílení své probíhající [Concept('education','výchovy')|E]"
 culture_tradition_events.0101.b: "Není tohle trochu příliš pro dílo [mendicant_mystic.GetFaith.HighGodNamePossessive]?"
 culture_tradition_events.0101.b.tt.success: "Přesvědčíš mystika"
 culture_tradition_events.0101.b.tt.failure: "Mystik znechuceně opouští tvůj dvůr"
 culture_tradition_events.0101.c: "Zmiz, žebráku, snažím se povečeřet!"
 culture_tradition_events.0111.t: "Mystikova řeč"
 culture_tradition_events.0111.desc: "„...proto se musíme v každém okamžiku svého života podřídit dobrodiní [mendicant_mystic.GetFaith.HighGodName]. Rozumíte? Mám pokračovat?“\n\nDvě. Nekonečné. Hodiny.\n\nAni nevím, jak se [mendicant_mystic.GetName] dostal do mých komnat, ale [mendicant_mystic.GetFaith.PriestNeuter] mi už #EMP dvě. Nekonečné. Hodiny.#! přednáší o jemnějších aspektech teologie [mendicant_mystic.GetFaith.GetName].\n\nNakonec [mendicant_mystic.GetWomanMan] zmlkne a hledí na mě, čekaje na odpověď. Cítím, jak mi začíná cukat oko."
 culture_tradition_events.0111.a: "Tak inspirující slova!"
 culture_tradition_events.0111.b: "Řekl jsi své, nyní nech říci své mně..."
 culture_tradition_events.0111.a.tt.success: "Rozdrtíš mystikův argument"
 culture_tradition_events.0111.a.tt.failure: "Zamotá se ti jazyk"
 culture_tradition_events.0111.c: "Kdo pustil toho tuláka do mého domu? Stráže! POMOC!"
 culture_tradition_events.0121.t: "Mystikova služba"
 culture_tradition_events.0121.desc: "Téměř netypicky pro jeho povolání [mendicant_mystic.GetFirstName] trpělivě čekal v předsíni, dokud jsem mu nemohl věnovat audienci.\n\nKdyž vstoupím, [mendicant_mystic.GetFaith.PriestNeuter] vypadá nervózně, ale okamžitě se pustí do ukvapené řeči.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], už nějakou dobu jsem žebravým mnichem a ačkoli je to dílo [mendicant_mystic.GetFaith.HighGodNamePossessive], je stejně náročné na mysl i tělo, jako je posilující pro duši.\n\nKdybys mě přijal, odložil bych svou poutnickou hůl a sloužil ti na dvoře, jak nejlépe dokážu. V-vezmeš mě k sobě?“"
 culture_tradition_events.0121.a: "Člověk s tvými schopnostmi by se mi jistě hodil..."
 culture_tradition_events.0121.b: "Věrný [mendicant_mystic.GetFaith.PriestNeuter], říkáš..."
 culture_tradition_events.0121.c: "Vypadáš takhle, #EMP páchneš#! takhle a chceš tady žít?"
 culture_tradition_events.0131.t: "Mystikův hněv"
 culture_tradition_events.0131.desc: "„[ROOT.Char.GetTitleAsNameNoTooltip]? Jsi sotva červ, #EMP zmítající se ve špíně#! vlastní zkaženosti! Čiň pokání ze svých hříchů před [mendicant_mystic.GetFaith.HighGodName]! [mendicant_mystic.GetFaith.HighGodName] Mocný! [mendicant_mystic.GetFaith.HighGodName] Neomylný! [mendicant_mystic.GetFaith.HighGodName] Nepřemožitelný!“\n\nK čertu s tímto otravným [mendicant_mystic.GetFaith.PriestNeuter]. Už to bylo dost zlé, když [mendicant_mystic.GetSheHe] stál na rohu ulice! Jestli #EMP někdy#! zjistím, kdo pustil [mendicant_mystic.GetFirstName] do mého #EMP domu#!, přijdou o oči; není tu ani deset minut a už mě rozbolela hlava.\n\nNemohu snášet mystikovo kázání o mnoho déle, musím jednat rychle, dokud se v [Select_CString( mendicant_mystic.IsFemale, 'její', 'jeho' )] řeči objeví přirozená přestávka."
 culture_tradition_events.0131.a: "#EMP Moje#! hříchy? Promluvme si o #EMP tvých#!."
 culture_tradition_events.0131.a.tt.success: "Dokážeš, že mystik je naprostý pokrytec"
 culture_tradition_events.0131.a.tt.failure: "Mystik z tebe udělá hlupáka"
 culture_tradition_events.0131.b: "Bu-budeš mě učit, jak být lepším?"
 culture_tradition_events.0131.b.tt.success: "Mystik ti pomůže překonat tvé nedostatky"
 culture_tradition_events.0131.b.tt.failure: "Přemůže tě duševní utrpení"
 culture_tradition_events.0131.c: "#EMP Zmítající se ve špíně?#! Hoďte toho šílence do nejbližší žumpy!"
 culture_tradition_events.0141.t: "Mystikova nabídka"
 culture_tradition_events.0141.desc: "„Copak nevidíš, [ROOT.Char.Custom('FormOfAddressForLiege')], jak svou duši ohrožuješ touto... myšlenkou [ROOT.Char.GetFaith.GetName]? Dovol mi přivést tě ke světlu pravé víry [mendicant_mystic.GetFaith.GetAdjective] a zachránit tě před věčným utrpením!“\n\nJako žebravý [mendicant_mystic.GetFaith.PriestNeuter] je [mendicant_mystic.GetFirstName] zvyklý kázat nevěřícím [ROOT.Char.GetCulture.GetName] lidem, ale metody, které fungují na rolníky, nemusí nutně obstát u šlechty.\n\nMezi námi zavládne ticho a já se zahledím hluboko do [Select_CString( mendicant_mystic.IsFemale, 'ženských', 'mužských' )] očí, sleduji světla naděje a touhy, která za nimi tančí a mihotají se."
 culture_tradition_events.0141.a: "Tvá slova mě přesvědčují, [mendicant_mystic.GetFaith.PriestNeuter]."
 culture_tradition_events.0141.b: "Dovol mi vysvětlit přednosti, které přináší [ROOT.Char.GetFaith.GetNameNoTooltip|l] víra..."
 culture_tradition_events.0141.b.tt.success: "Osvítíš [mendicant_mystic.GetFirstNameNoTooltip]"
 culture_tradition_events.0141.b.tt.failure: "Zůstanete ve vzájemném neporozumění"
 culture_tradition_events.0141.c: "Tvůj [mendicant_mystic.GetFaith.HighGodName]! Kolik odvedenců má?"
