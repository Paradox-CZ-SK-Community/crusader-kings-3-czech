 bear_sacrifice_war_modifier: "Medvědí válečná oběť" # todo: NEW TRANSLATION
 bear_sacrifice_war_modifier_desc: "Tato postava obětovala medvěda a věří, že je požehnána úspěchem ve válce." # todo: NEW TRANSLATION
