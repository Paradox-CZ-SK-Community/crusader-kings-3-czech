 mpo_siberian_permafrost_modifier: "Sibiřský permafrost"
 mpo_siberian_permafrost_modifier_desc: "Půda zmražená po tisíciletí, bez přístupu k podzemní vodě, řídká vegetace. Terén se každoročně mění vlivem opakovaného tání a zamrzání. Ti, kdo zde žijí, potřebují staletí, aby si tato území přivlastnili. Všechno ostatní zahyne a přidá se k dávno mrtvým pod ledem.\n\n#weak Tento modifikátor lze odstranit buď pomocí #V $feudalize_holding_interaction$#! [Concept('interaction','interakci')|E] nebo po dobytí celého Severu rozhodnutím #V $expand_the_steppe_decision_generic$#! [Concept('decision','rozhodnutí')|E] pro region #V $dlc_mpo_steppe_siberia_further_expansion_tooltip$#!\n\n" # todo: CONCEPT CASE
