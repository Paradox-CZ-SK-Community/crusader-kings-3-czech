 tradition_fortress_mastery_name: "Mistrovství pevností" # todo: NEW TRANSLATION
 tradition_fortress_mastery_desc: "Tato kultura má dlouhou tradici obranné vynalézavosti, využívá místní terén k ochraně své vlasti a odrážení případných útočníků. Toto umění kombinuje s mistrovstvím v lukostřelbě a hbitými jednotkami, schopnými přelsti každého nepřítele." # todo: NEW TRANSLATION
