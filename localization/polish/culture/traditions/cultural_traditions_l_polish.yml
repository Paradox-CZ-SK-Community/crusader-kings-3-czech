 culture_parameter_scholar_official_trait_bonuses: "Vlastnosti [GetTrait('confucian_education').GetName( GetNullCharacter )] a [GetTrait('loyal').GetName( GetNullCharacter )] [Concept('traits','rysy')|E] mají dodatečné bonusy" # todo: NEW TRANSLATION # todo: CONCEPT CASE
