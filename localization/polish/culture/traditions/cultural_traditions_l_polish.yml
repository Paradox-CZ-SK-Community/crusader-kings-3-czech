 tradition_stratified_society_toast_desc: "Jako privilegium vašeho váženého postavení získali vaši blízcí příbuzní [Concept('merit','zásluhy')|E] a nemusí skládat @provincial_exam_icon! [GetActivityType( 'activity_local_examination' ).GetName]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
