 tradition_ep3_cultivated_sophistication_desc: "Barbaři závistivě hledí na oslnivý přepych této kultury a vytříbenost její společnosti. Tato kultura, poháněná pocitem nadřazenosti, odmítá všechny rozpory, které leží mimo její kosmopolitní sféru vlivu."
