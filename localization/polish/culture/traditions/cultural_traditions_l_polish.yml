 recruit_open_specialist_decision_confirm: "$invite_knights_decision_confirm$"
 recruit_terrain_specialist_decision_desc: "Naši nepřátelé jsou nesčetní a naše armády si nemohou vždy vybrat terén, na kterém se s nimi střetnou.\n\nAbychom zajistili vítězství na každé frontě, potřebujeme velitele, kteří dokážou obratně využít i samotný terén ve svůj prospěch." # todo: NEW TRANSLATION
 commander_recruited.t: "Velitel přijat"
 commander_recruited.desc: "[new_commander.GetUIName] se připojil k vašemu dvoru!"
 recruit_gardener_decision: "Najmout zahradníka"
 recruit_gardener_decision_desc: "My, [ROOT.Char.GetCulture.GetCollectiveNoun], máme rozsáhlé znalosti v tvarování a péči o zahrady všech typů. Je tu mnoho zručných zahradníků, jejichž odbornosti mohu dobré využít."
