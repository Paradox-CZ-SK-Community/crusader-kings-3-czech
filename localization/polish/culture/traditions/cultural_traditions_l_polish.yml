 culture_parameter_military_governor_appointment_score: "[Concept('learning_skill','Učenost')|E] zvyšuje [Concept('candidate_score','skóre kandidáta')|E] pro [GetSubjectContractType( 'celestial_provinces' ).GetObligationNameShort( 'celestial_province_military' )] provincie" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tradition_tgp_ephemeral_grace_name: "Pomíjivá milost" # todo: NEW TRANSLATION
