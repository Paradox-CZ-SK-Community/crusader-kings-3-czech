 tradition_mpo_northern_tribes_name: "Kmeny severu"
 tradition_mpo_northern_tribes_desc: "Toto je jedna z kultur obecně známých jižním sousedům jako „lesní lid“. Tito seveřané jsou na některých místech proslulými lovci, jinde zdatnými říčními rybáři, někdy kováři železa a často pastevci."
 culture_parameter_unlock_maa_maturkan_warriors: "Lze najmout [GetMaA('maturkan_warriors').GetName] jako [Concept('men_at_arms','ozbrojence')|E]"
 tradition_devoted_horsemanship_name: "Oddané jezdecké umění"
 tradition_devoted_horsemanship_desc: "Ani pohodlí paláců nedokáže udržet lid této kultury mimo sedlo. Ať se ocitnou kdekoli, jejich stáda jsou tam s nimi a koním je věnována pečlivá péče."
