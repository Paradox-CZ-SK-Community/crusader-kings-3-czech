 REQUEST_REPUBLIC_TEXT: "Pozdravy, můj [actor.Custom2('RelationToMeShort', SCOPE.sC('recipient'))]. Již nějakou dobu je zřejmé, že nejbohatší částí země, které vládneš, je městská obec v jejím nitru. Vyzývám tě, abys mým jménem převzal úkol dohlížet na tuto rozrůstající se republiku."
