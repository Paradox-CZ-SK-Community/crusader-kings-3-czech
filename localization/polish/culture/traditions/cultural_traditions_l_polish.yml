l_polish:
 ethos_bellicose_name: "Bojovný"
 ethos_bellicose_desc: "Tato kultura považuje konflikt a násilí za nezbytnou součást života; v jejích příslušnících je hluboce zakořeněná představa, že se člověk má postavit na odpor a bojovat za své."
 ethos_stoic_name: "Stoický"
 ethos_stoic_desc: "Tato kultura věří, že je třeba stát pevně jako hora, snášet veškeré strasti, které život přinese, a vytrvat s chmurným odhodláním a nezlomným duchem."
 ethos_bureaucratic_name: "Byrokratický"
 ethos_bureaucratic_desc: "Žádná kultura nepřetrvá déle než její nejstarší záznam a tato kultura věří v tak pečlivé vedení účtů, že jí zajistí nesmrtelnost."
 ethos_spiritual_name: "Duchovní"
 ethos_spiritual_desc: "Zatímco některé kultury se obracejí k válce a jiné ke světskému vědění, tato kultura vkládá důvěru v jedinou stálou sílu napříč svými dějinami — božství. Duchovno je jedinou cestou vpřed v drsném a lhostejném světě."
 ethos_courtly_name: "Obřadný"
 ethos_courtly_desc_nhc: "Obřadnost dvorského života je pro tuto kulturu natolik zásadní, že tvoří samu podstatu společenského chování jejích příslušníků. Pro každého je určeno místo a každý zůstává na svém místě."
 ethos_egalitarian_name: "Rovnostářský"
 ethos_egalitarian_desc: "Nesnášenlivost a izolacionismus mohou vyhovovat jiným, tato kultura však uznává, že přijímat odlišnosti je mnohem lepší než je ničit."
 ethos_communal_name: "Pospolitý"
 ethos_communal_desc: "Tato kultura si nade vše cení pout společenství a společným úsilím o dosažení společných cílů pěstuje velkou věrnost a oddanost."
 martial_custom_equal_name: "Rovnoprávné"
 martial_custom_equal_desc: "V této kultuře může každý tělesně způsobilý člen domácnosti na výzvu pozvednout zbraň ve službách svého lenního pána."
 martial_custom_male_only_name: "Pouze muži"
 martial_custom_male_only_desc: "Tato kultura považuje pouze muže za fyzicky dostatečně silné a odolné, aby mohli bojovat v bitvě."
 martial_custom_female_only_name: "Pouze ženy"
 martial_custom_female_only_desc: "Tato kultura považuje pouze ženy za fyzicky dostatečně silné a odolné, aby mohly bojovat v bitvě."
 tradition_court_eunuchs_name: "Dvorští eunuchové"
 tradition_court_eunuchs_desc: "Tato kultura ve velké míře využívá u dvora eunuchy, kteří zastávají úlohy od domácího služebnictva přes byrokratické správce až po vojenské velitele. Mužům bez tužeb lze snadno důvěřovat."
 tradition_byzantine_succession_name: "Byzantské tradice"
 tradition_byzantine_succession_desc: "Tato kultura je úzce spjata s císařskými tradicemi Východořímské říše a jejím dědictvím v podobě složitého a propracovaného kodexu dvorského chování."
 tradition_african_tolerance_name: "Africká tolerance"
 tradition_african_tolerance_desc: "Ačkoli by to někteří odsoudili jako slabost, panství založené na porozumění a toleranci stojí na pevných základech."
 tradition_memories_of_bactria_name: "Vzpomínky na Baktrii"
 tradition_memories_of_bactria_desc: "V kulturní paměti tohoto lidu je uchován ideál dokonalé země Baktrie, nádherné koruny Východu, jejíž čas znovu nadejde."
 tradition_equal_inheritance_name: "Rovné dědictví"
 tradition_equal_inheritance_desc: "Tato kultura má tradici vládců, kteří rozdělují své země mezi všechny své děti, včetně těch, jež by za běžných okolností byly z dědictví vyloučeny."
 tradition_equal_inheritance_link: "Rovné dědictví"
 tradition_the_witenagemot_name: "Witenagemot"
 tradition_the_witenagemot_desc: "Tato kultura má dlouhou tradici pořádání shromáždění složených z mocných vládců země, kteří debatují o politice, právu, financích a především o tom, jak nejlépe... #EMP radit#! vládci."
 tradition_things_name: "Shromáždění thingu"
 tradition_things_desc: "Ve Skandinávii činí velké vzdálenosti a divočina centralizovanou moc neúčinnou. Když je třeba rozhodnout spory a přijmout rozhodnutí, svolává se #EMP shromáždění thingu#!, sněm sobě rovných, jemuž předsedá vykladač zákona."
 tradition_caravaneers_name: "Karavanisté"
 tradition_caravaneers_desc: "Tato kultura je pevně zapojena do obchodních zvyklostí regionu a její lid je úzce spjat s karavanním obchodem."
 tradition_xenophilic_name: "Xenofilní"
 tradition_xenophilic_desc: "Tato kultura přijímá každého a upřímně ji fascinují všechny kultury."
 tradition_legalistic_name: "Legalistická"
 tradition_legalistic_desc: "Tato kultura považuje vládu práva a jeho kodifikaci za nejdůležitější znak civilizované společnosti."
 tradition_warrior_culture_name: "Válečnická kultura"
 tradition_warrior_culture_desc: "Tato kultura si nade vše cení válečnické zdatnosti a síly. Děti jsou vedeny k boji a odrazovány od učených zájmů. Slabost se netoleruje."
 tradition_philosopher_culture_name: "Kultura filozofů"
 tradition_philosopher_culture_desc: "Tato kultura podporuje přemýšlení a sebereflexi."
 tradition_chivalry_name: "Rytířství"
 tradition_chivalry_desc: "Tato kultura přijala rytířství a rytířské kodexy chování jako společenský prostředek k usměrňování jednání. Cení se válečnická zdatnost, povinnost, čest a mravnost, stejně jako špatná poezie a romantická literatura."
 tradition_hit_and_run_name: "Taktici udeř a uteč"
 tradition_hit_and_run_desc: "Tato kultura dokonale ovládla nasazení lehce obrněných jednotek, které tvrdě udeří na nepřítele a poté se stáhnou."
 tradition_stand_and_fight_name: "Stůj a bojuj!"
 tradition_stand_and_fight_desc: "Válečníci této kultury jsou neústupní a neochvějní. Neustupují ani tváří v tvář drtivé přesile, ať už je to ku prospěchu, či ke škodě."
 tradition_horse_lords_name: "Páni koní"
 tradition_horse_lords_desc: "Tato kultura dokonale ovládla koně i jeho využití ve válce."
 tradition_adaptive_skirmishing_name: "Přizpůsobiví lehcí pěšáci"
 tradition_adaptive_skirmishing_desc: "Tato kultura umí účinně nasazovat lehké pěšáky v jakémkoli prostředí."
 tradition_formation_fighting_name: "Mistři boje ve formacích"
 tradition_formation_fighting_desc: "Tato kultura umí vytvářet souhru mezi různými druhy jednotek pomocí účinných ochranných formací."
 tradition_republican_legacy_name: "Republikánské dědictví"
 tradition_republican_legacy_desc: "Tato kultura má dlouhou tradici republikánských hodnot, v níž jsou městské vrstvy stejně důležité jako venkovští držitelé půdy."
 tradition_hereditary_hierarchy_name: "Dědičná hierarchie"
 tradition_hereditary_hierarchy_desc: "V této kultuře je hluboce zakořeněno, že vedení se předává krví, šlechtická moc je ukotvena v kamenných hradech a feudální uspořádání je neotřesitelné. Na ty, kdo poruší feudální řád, se jen tak nezapomíná."
 tradition_theocratic_autonomy_name: "Teokratická autonomie"
 tradition_theocratic_autonomy_desc: "Náboženským autoritám v této kultuře poskytují světští vládci značnou volnost a obyvatelstvo jim prokazuje úctu a poslušnost."
 tradition_saharan_nomads_name: "Saharští kočovníci"
 tradition_saharan_nomads_desc: "Tato kultura je důvěrně obeznámena se Saharou, kterou po staletí překračuje a propojuje tak Středomoří se subsaharskými královstvími Sahelu."
 tradition_himalayan_settlers_name: "Himálajští osadníci"
 tradition_himalayan_settlers_desc: "Tato kultura si vybudovala domov na „střeše světa“, kde je vzduch svěží, ale chladný a zimy dlouhé a kruté. Její příslušníci jsou hrdí na to, že jen málokterá kultura z nížin by dokázala žít mezi vrcholky a náhorními plošinami tak dobře jako oni, v kraji, kde se jinak daří pouze ovcím."
 tradition_esteemed_hospitality_name: "Vážená pohostinnost"
 tradition_esteemed_hospitality_desc: "Vládci této kultury jsou známí tím, že každého, kdo zavítá k jejich dvoru, vítají s otevřenou náručí, a totéž se od nich očekává. Hosty a návštěvníky přijímají s mimořádnou okázalostí."
 tradition_hard_working_name: "Pracovitost"
 tradition_hard_working_desc: "Tato kultura učí pracovitosti a tvrdé práci ve prospěch celého společenství a tyto hodnoty pevně zakotvuje."
 tradition_loyal_soldiers_name: "Věrní poddaní"
 tradition_loyal_soldiers_desc: "Pro tuto kulturu je služba lennímu pánovi a zemi ušlechtilá a spravedlivá, je povinností i výsadou, nikoli chamtivou dohodou či nechtěným břemenem."
 tradition_female_only_inheritance_name: "Matriarchální"
 tradition_female_only_inheritance_desc: "Tato kultura prosazuje matriarchální hierarchii, v níž vládnoucí vrstvu tvoří převážně ženy."
 tradition_pacifism_name: "Pacifisté"
 tradition_pacifism_desc: "Pro tuto kulturu nelze použití síly nikdy ospravedlnit. Pouze následováním cesty nenásilí mohou lidé skutečně žít v míru."
 tradition_scientific_curiosity_name: "Vědecká zvídavost"
 tradition_scientific_curiosity_desc: "Většina lidí hledá odpovědi nalevo, napravo, za sebou i před sebou. Tito lidé ne. Ti se dívají vzhůru."
 tradition_spartan_name: "Sparťanská"
 tradition_spartan_desc: "Tato kultura si necení okázalých znaků moci, obřadů, bohatství ani zbytečných ozdob. Zajímá ji samotná moc, nejlépe v podobě vysokých hradeb a hradních věží."
 tradition_tribe_unity_name: "Kmenová jednota"
 tradition_tribe_unity_desc: "Tato kultura zdůrazňuje rodinná a pospolitá pouta, která její lid spojují, a vybízí jej, aby nezapomínal na své společné dědictví."
 tradition_astute_diplomats_name: "Prozíraví diplomaté"
 tradition_astute_diplomats_desc: "V této kultuře je rozšířena představa, že nejčistším projevem převahy je schopnost podrobit si nepřítele bez boje."
 tradition_collective_lands_name: "Společná půda"
 tradition_collective_lands_desc: "Představa, že půdu osobně vlastní jednotlivci, je této kultuře cizí. Půda náleží všem lidem pro společné dobro."
 tradition_horse_breeder_name: "Chovatelé koní"
 tradition_horse_breeder_desc: "Tato kultura po generace pečlivě shromažďovala znalosti a zkušenosti v jemném umění i vědě chovu koní. Ať už jde o válečné či lehké jezdecké koně, prosluli koně tohoto lidu svou výjimečností."
 tradition_hunters_name: "Proslulí lovci"
 tradition_hunters_desc: "Ať už z hospodářské nutnosti, či pod tlakem společenských očekávání, tato kultura zdokonalila své lovecké postupy v přesné a téměř krásné umění."
 tradition_sacred_mountains_name: "Posvátné hory"
 tradition_sacred_mountains_desc: "Tato kultura považuje hory za spojení s božstvem a chová se k nim s úctou a respektem."
 tradition_culinary_art_name: "Kulinářští umělci"
 tradition_culinary_art_desc: "Jídlo není pro tuto kulturu pouhou obživou, ale také uměním a obřadem, který stojí v centru rodinného i společenského života."
 tradition_festivities_name: "Časté slavnosti"
 tradition_festivities_desc: "Četnost a bujarost, s jakou tato kultura pořádá slavnosti, by jiní mohli považovat za nevkusné, ale oslava je zkrátka oslava!"
 tradition_tea_ceremony_name: "Čajové obřady"
 tradition_tea_ceremony_desc: "Někdy stačí k nápravě všeho jen šálek dobrého čaje."
 tradition_vegetarianism_name: "Vegetariáni"
 tradition_vegetarianism_desc: "Tato kultura si vypěstovala silný odpor k pojídání zvířecího masa a v celé společnosti praktikuje vegetariánství."
 tradition_alpine_supremacy_name: "Horská nadvláda"
 tradition_alpine_supremacy_desc: "Lidé této kultury se přizpůsobili životu v horských oblastech a jejich znalosti a zkušenosti s alpským prostředím nemají obdoby."
 tradition_seafaring_name: "Mořeplavci"
 tradition_seafaring_desc: "Volání moře je pro tuto kulturu příliš silné, než aby mu odolala. Její lid žije pro plavbu po křišťálově klidné hladině i pro jízdu na hřebenech divokých bouřlivých vln."
 tradition_strength_display_name: "Projevy síly"
 tradition_strength_display_desc: "Pouhou sílu nestačí vlastnit. Člověk ji musí před ostatními také #EMP předvést#!, aby poznal, zda před ním stojí důstojný soupeř, nebo cenný spojenec."
 tradition_mystical_ancestors_name: "Mističtí předkové"
 tradition_mystical_ancestors_desc: "Původ je pro tuto kulturu natolik důležitý, že se její předkové proměnili v bájné a legendární bytosti, k jejichž potomkům se mnozí hlásí."
 tradition_priestly_caste_name: "Kněžská kasta"
 tradition_priestly_caste_desc: "Tato kultura prosazuje kastovní systém, který vyzdvihuje postavení kněžstva ve společnosti. Lidé pověření výkladem božské vůle mají být chráněni a posloucháni."
 tradition_religion_blending_name: "Prolínání náboženství"
 tradition_religion_blending_desc: "Příslušníci této kultury často žijí po boku lidí jiných vyznání a přesvědčení a obratně začleňují cizí prvky do vlastního způsobu uctívání."
 tradition_religious_festivities_name: "Náboženské slavnosti"
 tradition_religious_festivities_desc: "Pohyb Slunce a hvězd nemá pro pojetí času této kultury valný význam. Mnohem oblíbenějším způsobem, jak měřit běh dní, je množství pravidelných náboženských svátků a oslav, na něž je zván každý!"
 tradition_religious_patronage_name: "Náboženský patronát"
 tradition_religious_patronage_desc: "Pro spásu duše se člověk musí zasloužit skutky náboženského významu. Vykoupení si koupit nelze, ale když v chrámu kněží pějí vaše chvály, #EMP pomáhá to.#!"
 tradition_medicinal_plants_name: "Léčitelé bylinami"
 tradition_medicinal_plants_desc: "Tato kultura již dávno poznala léčivé vlastnosti rostlin a stromů. Podle jejího lidu lze většinu neduhů léčit správným obkladem, mastí či odvarem."
 tradition_storytellers_name: "Vypravěči"
 tradition_storytellers_desc: "Tato kultura má silnou a přetrvávající ústní tradici. Minulost uchovává prostřednictvím obřadného vyprávění, v němž se příběhy dávných hrdinů a legend předávají z generace na generaci."
 tradition_sacred_hunts_name: "Posvátné lovy"
 tradition_sacred_hunts_desc: "Lov není sportem ani kratochvílí. Je nejčistším vyjádřením lidské zkušenosti, při němž se člověk může přiblížit božstvu tím, že prokáže svou vládu nad přírodou."
 tradition_wedding_ceremonies_name: "Svatební obřady"
 tradition_wedding_ceremonies_desc: "Spojení dvou lidí v manželství je v této kultuře považováno za významnou veřejnou a obřadní událost."
 tradition_music_theory_name: "Hudební teoretici"
 tradition_music_theory_desc: "Tato kultura považuje hudbu téměř za jazyk božstva, a proto se mnozí již od mládí věnují ušlechtilému a oslavovanému studiu hudby."
 tradition_poetry_name: "Vytříbená poezie"
 tradition_poetry_desc: "Poezie je v této kultuře považována za ušlechtilé umění a mnozí tráví čas skládáním slov plných významu a myšlenek."
 tradition_culture_blending_name: "Prolínání kultur"
 tradition_culture_blending_desc: "Příslušníci této kultury často žili po boku lidí jiných kultur. Díky tomuto styku se naučili obratně začleňovat cizí jazyky, tradice a zvyklosti do vlastního života."
 tradition_family_entrepreneurship_name: "Rodinné podnikání"
 tradition_family_entrepreneurship_desc: "Tato kultura podporuje rozvoj rodinných živností, v nichž každá generace přebírá od té předchozí nástroje a postupy řemesla a buduje tak pevnou tradici děděného profesního mistrovství."
 tradition_fishermen_name: "Obratní rybáři"
 tradition_fishermen_desc: "Rybařit může každý, ale dosahovat takového mistrovství, aby byl úlovek bohatý bez ohledu na příliv či vítr, je mnohem vzácnější. Nikdo nezná pobřeží, pevninu ani moře lépe než tito rybáři."
 tradition_metal_craftsmanship_name: "Kovotepci"
 tradition_metal_craftsmanship_desc: "Tato kultura měla po staletí snadný přístup k železu. Postupem času rozvinula své znalosti zpracování kovů natolik, že se její jméno stalo synonymem odolných a vysoce kvalitních zbraní a zbrojí."
 tradition_isolationist_name: "Izolacionisté"
 tradition_isolationist_desc: "Tato kultura se raději drží stranou a jen zřídka obrací pozornost za hranice vlastního světa."
 tradition_winter_warriors_name: "Zimní válečníci"
 tradition_winter_warriors_desc: "Tato kultura je zvyklá na strádání, které přinášejí kruté větry a třeskutý mráz."
 tradition_forest_fighters_name: "Lesní bojovníci"
 tradition_forest_fighters_desc: "Tato kultura je zběhlá v boji v lesích."
 tradition_mountaineers_name: "Horští bojovníci"
 tradition_mountaineers_desc: "Vojáci této kultury s sebou nosí vše potřebné k překonávání hor."
 tradition_warriors_of_the_dry_name: "Válečníci vyprahlých krajin"
 tradition_warriors_of_the_dry_desc: "Tato kultura dokonale ovládla umění boje ve velmi suchém podnebí."
 tradition_highland_warriors_name: "Válečníci vysočin"
 tradition_highland_warriors_desc: "Válečníci této kultury bojují dobře na svazích a v údolích své kopcovité domoviny."
 tradition_jungle_warriors_name: "Válečníci džungle"
 tradition_jungle_warriors_desc: "Válečníci této kultury dobře vědí, jak se pohybovat zrádnou džunglí."
 tradition_only_the_strong_name: "Jen ti nejsilnější"
 tradition_only_the_strong_desc: "Tato kultura klade velký důraz na menší počet dobře vycvičených válečníků. Kdo nepatří mezi nejlepší z nejlepších, nesmí sloužit."
 tradition_warriors_by_merit_name: "Válečníci podle zásluh"
 tradition_warriors_by_merit_desc: "Tato kultura věří, že každý, kdo prokázal své válečnické schopnosti, má mít právo bojovat bez ohledu na svůj původ."
 tradition_warrior_monks_name: "Válečničtí kněží"
 tradition_warrior_monks_desc: "Tato kultura věří, že kdo se rozhodne věnovat teologickému studiu, musí být rovněž schopen bránit svou víru."
 tradition_talent_acquisition_name: "Uznání nadání"
 tradition_talent_acquisition_desc: "„Zabij mě, jestli si to přeješ, ale necháš-li mě žít, budu ti věrně sloužit.“"
 tradition_strength_in_numbers_name: "Síla v množství"
 tradition_strength_in_numbers_desc: "Tato kultura se vzdává elitních vojsk a namísto nich upřednostňuje početné armády."
 tradition_frugal_armorsmiths_name: "Úsporní zbrojíři"
 tradition_frugal_armorsmiths_desc: "Jedna vysoce kvalitní zbroj může zachránit jeden život, ale deset obstojných zbrojí může vyhrát bitvu."
 tradition_malleable_invaders_name: "Přizpůsobiví dobyvatelé"
 tradition_malleable_invaders_desc: "Vezmeme vám země, děti, tradice i vaši #EMP budoucnost#!."
 tradition_quarrelsome_name: "Svárná"
 tradition_quarrelsome_desc: "Mezi vládci této kultury jsou pohraniční spory běžné. Země často nespravedlivě přechází z rukou do rukou."
 tradition_swords_for_hire_name: "Meče k pronájmu"
 tradition_swords_for_hire_desc: "Tato kultura pohlíží příznivě na žoldnéřskou službu a vybízí válečníky, aby mezi válkami hledali slávu jako žoldnéři."
 tradition_reverence_for_veterans_name: "Úcta k veteránům"
 tradition_reverence_for_veterans_desc: "Tato kultura neopovrhuje těmi, kteří již kvůli zranění nemohou bojovat. Naopak je oslavuje jako hrdiny a využívá jejich zkušeností při výcviku ostatních."
 tradition_stalwart_defenders_name: "Neochvějní obránci"
 tradition_stalwart_defenders_desc: "Obrana vlastního majetku a domova má pro tuto kulturu prvořadý význam."
 tradition_battlefield_looters_name: "Plenitelé bojišť"
 tradition_battlefield_looters_desc: "V této kultuře se bitvy nevedou pro prestiž, ale pro zisk. K čemu je postavení, když člověk nedokáže zaplatit válku?"
 tradition_fervent_temple_builders_name: "Horliví stavitelé chrámů"
 tradition_fervent_temple_builders_desc: "Tato kultura považuje stavbu chrámů za nejpřímější cestu k božstvu. Od horlivých vládců se očekává, že budou budovat mnoho velkolepých chrámů."
 tradition_lords_of_the_elephant_name: "Páni slonů"
 tradition_lords_of_the_elephant_desc: "Tato kultura uctívá slony a přirovnává je k panovníkům. Její lid dokonale ovládá jejich odchyt, výcvik i ničivé nasazení ve válce."
 tradition_zealous_people_name: "Pevní ve víře"
 tradition_zealous_people_desc: "Lidé této kultury jsou mimořádně horliví a oddaní své víře."
 tradition_welcoming_name: "Charismatičtí"
 tradition_welcoming_desc: "Lidé této kultury vynikají v diplomatických záležitostech a nade vše si cení společenského vystupování."
 tradition_agrarian_name: "Zemědělská"
 tradition_agrarian_desc: "Tato kultura je výrazně zemědělská a její země poskytují dostatek úrody pro hladové armády. Díky hojnosti potravy lze povolat mnoho sedláků do odvodu, každý jednotlivý voják však postrádá odhodlání lidí z drsnějších krajů."
 tradition_eye_for_an_eye_name: "Oko za oko"
 tradition_eye_for_an_eye_desc: "V této kultuře se na urážky nezapomíná ani se neodpouštějí. Její lid dokáže dlouho chovat křivdu a pomstu vykonává s vášní."
 tradition_forbearing_name: "Shovívavá"
 tradition_forbearing_desc: "V této kultuře je běžné čelit protivenstvím s trpělivostí a sebeovládáním."
 tradition_equitable_name: "Spravedlivá"
 tradition_equitable_desc: "Tato kultura si velmi cení pravdy a nestranné spravedlnosti."
 tradition_charitable_name: "Dobročinná"
 tradition_charitable_desc: "Bez ohledu na víru jsou příslušníci této kultury vedeni k podpoře těch, kteří měli méně štěstí."
 tradition_modest_name: "Skromná"
 tradition_modest_desc: "Tato kultura si cení skromnosti. Člověk by neměl zabírat příliš mnoho prostoru ani se považovat za lepšího než ostatní."
 tradition_hill_dwellers_name: "Obyvatelé kopců"
 tradition_hill_dwellers_desc: "Tato kultura je v kopcích jako doma a umí jejich půdu účinně obdělávat."
 tradition_forest_folk_name: "Lesní lid"
 tradition_forest_folk_desc: "Tato kultura žije v blízkosti rozlehlých lesů a umí využívat jejich bohatství."
 tradition_mountain_homes_name: "Horská obydlí"
 tradition_mountain_homes_desc: "Tato kultura umí žít a prosperovat na náhorních plošinách poblíž nehostinných horských svahů."
 tradition_dryland_dwellers_name: "Obyvatelé suchých krajin"
 tradition_dryland_dwellers_desc: "Tato kultura je zvyklá na život v suchém podnebí a ví, kde nalézt vodu a jak obdělávat zdejší půdu."
 tradition_jungle_dwellers_name: "Obyvatelé džungle"
 tradition_jungle_dwellers_desc: "Tato kultura žije v blízkosti džungle a umí využívat její bohatství."
 tradition_faith_bound_name: "Spoutaní vírou"
 tradition_faith_bound_desc: "Příslušníci jiné víry nemají v této kultuře nárok na následnictví."
 tradition_by_the_sword_name: "Mečem"
 tradition_by_the_sword_desc: "Příslušníci této kultury věří, že nejlepším misionářem je ten, kdo nese meč. Podpora svatých válek je rozšířená, jejich pohnutky jsou však bedlivě posuzovány, aby bylo jisté, že by je božské mocnosti schválily."
 tradition_language_scholars_name: "Jazykovědci"
 tradition_language_scholars_desc: "Naučit se řeči souseda znamená přiblížit se o krok jazyku božstva."
 tradition_pastoralists_name: "Pastevci"
 tradition_pastoralists_desc: "Tato kultura je jako doma v rozlehlé otevřené krajině, kde pase velká stáda zvířat."
 tradition_desert_nomads_name: "Pouštní poutníci"
 tradition_desert_nomads_desc: "Této kultuře není drsné pouštní prostředí cizí a dokonale ovládla využití velbloudů při cestování, válčení i v každodenním životě."
 tradition_gardening_name: "Zahradní architekti"
 tradition_gardening_desc: "Tato kultura má dlouhou tradici budování a udržování nejrůznějších zahrad, v nichž si vytváří vlastní malý ráj."
 can_appoint_court_gardener_name: "[GetCultureTradition('tradition_gardening').GetName]"
 tradition_monogamous_name: "Monogamní"
 tradition_monogamous_desc: "V této kultuře má člověk bez ohledu na víru jediného manželského partnera."
 tradition_polygamous_name: "Polygamní"
 tradition_polygamous_desc: "V této kultuře mívá člověk bez ohledu na víru více manželských partnerů."
 tradition_concubines_name: "Konkubíny"
 tradition_concubines_desc: "Vládci této kultury často bez ohledu na svou víru vydržují ve své domácnosti několik konkubín."
 tradition_mendicant_mystics_name: "Žebraví mystikové"
 tradition_mendicant_mystics_desc: "Svatí lidé této kultury jsou pevně přesvědčeni, že víra má být hlásána mezi lidem, a ti nejoddanější proto často putují světem."
 tradition_parochialism_name: "Městský partikularismus"
 tradition_parochialism_desc: "Obyvatelé měst této kultury jsou mimořádně soupeřiví a nezávislí. Vynakládají velké množství peněz i úsilí, aby právě #EMP jejich#! město bylo tím nejvelkolepějším."
 tradition_martial_admiration_name: "Obdiv k válečnictví"
 tradition_martial_admiration_desc: "Ti, kteří jsou ochotni pozvednout meč a bojovat za svou kulturu, si zaslouží obdiv. Bez ohledu na vyhlídky."
 tradition_chanson_de_geste_name: "Chanson de geste"
 tradition_chanson_de_geste_desc: "Tato kultura si cení hrdinských činů dávno zesnulých předků. Romantická vyprávění o životě rytířů, jako byli Guillaume či Roland, budou inspirovat další generace."
 tradition_ruling_caste_name: "Vládnoucí kasta"
 tradition_ruling_caste_desc: "Vládci této kultury jsou zvyklí panovat poddaným jiné kultury. Umějí účinně potlačovat povstání, ovšem za cenu nepříznivého veřejného mínění."
 tradition_staunch_traditionalists_name: "Zarytí tradicionalisté"
 tradition_staunch_traditionalists_desc: "Tradice je tradice, pevná a neměnná. Musíme být připraveni a ochotni hájit vše, co určuje, kým jsme."
 tradition_sacred_groves_name: "Posvátné háje"
 tradition_sacred_groves_desc: "Tato kultura považuje stromy za posvátné. Les je živoucí bytostí, o niž je třeba pečovat, nikoli ji ničit."
 tradition_hold_the_line_name: "Udržte linii"
 tradition_hold_the_line_desc: "Tato kultura vede každého bojovníka k hrdosti na vlastní sílu. Strhující projevy velitelů udržují vojáky odhodlané až do samého konce."
 tradition_legendary_noble_families_name: "Legendární šlechtické rodiny"
 tradition_legendary_noble_families_desc: "Pokud nejsi spjat s některou ze šlechtických rodin, jež pomáhaly utvářet osud této kultury, neznamenáš nic."
 tradition_castle_keepers_name: "Strážci hradů"
 tradition_castle_keepers_desc: "Útok není nejlepší obranou. Nejlepší obranou je mít více hradů než kdokoli jiný ve známém světě."
 tradition_city_keepers_name: "Strážci měst"
 tradition_city_keepers_desc: "Města jsou tepajícím srdcem této kultury a její lid touží proměnit každou metropoli v záviděníhodný klenot proslulý po celém světě."
 tradition_fractious_name: "Rozhádaná"
 tradition_fractious_desc: "Nepřítel mého nepřítele je #EMP také#! můj nepřítel."
 tradition_runestones_name: "Vztyčovatelé runových kamenů"
 tradition_runestones_desc: "Smrt, dobývání a získávání hodností – nejsou právě tyto věci podstatou života šlechty? Kamkoli náš lid vstoupí, tam vztyčí také památníky hodnoty svých životů."
 tradition_insular_spirit_name: "Uzavřený duch"
 tradition_insular_spirit_desc: "Tato kultura je odhodlána nenechat se odvrátit od svých původních zvyklostí a bude bojovat za každého svého příslušníka napadeného jinou kulturou."
 tradition_monastic_communities_name: "Mnišská společenství"
 tradition_monastic_communities_desc: "Tato kultura má dlouhou tradici posílání potomků šlechticů do služeb víry. Z mnišských řádů často vycházejí uznávaní političtí myslitelé."
 tradition_roman_legacy_name: "Východořímské dědictví"
 tradition_roman_legacy_desc: "Vojenské uspořádání Římské říše je v této kultuře dosud živou vzpomínkou. Profesionální armáda má přednost před odvedenci."
 tradition_longbow_competitions_name: "Soutěže v dlouhém luku"
 tradition_longbow_competitions_desc: "Tato kultura upřednostňuje luk tak silný, že jej většina lidí nedokáže napnout. Každotýdenní cvičení s dlouhým lukem je od nejodlehlejších vesnic po největší metropole stejně posvátné jako kterýkoli náboženský obřad."
 tradition_illyrian_grit_name: "Ilyrská houževnatost"
 tradition_illyrian_grit_desc: "Tato kultura může neustále bojovat sama se sebou, až však přijde čas, společně povstane proti každému nájezdníkovi."
 tradition_maritime_mercantilism_name: "Námořní merkantilismus"
 tradition_maritime_mercantilism_desc: "Světu možná vládnou armády, tato kultura však ví, že jej ve skutečnosti ovládá ten, kdo řídí tok zlata přes moře."
 tradition_sacral_kingship_name: "Sakrální království"
 tradition_sacral_kingship_desc: "Vládci této kultury jsou buď považováni za bohy, nebo je královská moc chápána jako božská ctnost. Co znamená král tváří v tvář bohu?"
 tradition_reavers_name: "Plenitelé"
 tradition_reavers_desc: "Mnozí příslušníci této kultury žijící na pobřeží se vydávají na lodích loupit do cizích přístavů. Jejich přímí páni to sice neschvalují, každý vládce však ví, že z nich tato zkušenost časem učiní lepší vojáky."
 tradition_practiced_pirates_name: "Zkušení piráti"
 tradition_practiced_pirates_desc: "Vpadnout do přístavu, zapálit jej a odnést vše, co není přibité, možná není urozené, ale #EMP je#! to výnosné."
 tradition_determined_independence_name: "Odhodlaná nezávislost"
 tradition_determined_independence_desc: "Raději smrt než podrobení! Vládci této kultury nepovažují žádnou porážku za horší než vazalství a udělají cokoli, aby se stali vlastními pány."
 tradition_merciful_blindings_name: "Milosrdné oslepování"
 tradition_merciful_blindings_desc: "Ať už člověk překročil hranici odpuštění jakkoli daleko, tato kultura považuje vypíchnutí oka za lepší než probodnutí srdce."
 tradition_reindeer_hunters_name: "Lovci sobů"
 tradition_reindeer_hunters_desc: "Pronásledování sobů není ničím jiným než tancem na věčně zmrzlé půdě tajgy. Tato kultura se naučila využívat své lovecké vybavení do posledního kousku."
 tradition_mountaineer_ruralism_name: "Horské venkovanství"
 tradition_mountaineer_ruralism_desc: "Od pahorků Českého lesa po skalnaté svahy Krušných hor a Tater umí většina příslušníků této kultury nejen překonávat kamenitou krajinu, ale také snadno zvládat život v horách."
 tradition_life_is_just_a_joke_name: "Život je jen vtip"
 tradition_life_is_just_a_joke_desc: "Příslušníci této kultury by se smáli i na popravčím špalku se sekerou nad hlavou."
 tradition_steppe_tolerance_name: "Stepní tolerance"
 tradition_steppe_tolerance_desc: "Ti, kdo žijí ve stepi, budou mít vždy mnoho společného s ostatními, kteří sdílejí jejich způsob života. Cizinci mohou uctívat jiné bohy, ale přesto tráví život v sedle."
 tradition_nubian_warrior_queens_name: "Královny válečnice"
 tradition_nubian_warrior_queens_desc: "Obyvatelé východní Afriky dobře pamatují velké královny válečnice, které kdysi čelily nájezdníkům a zakládaly království v Kúši. Naši sousedé mohou trvat na nadřazenosti mužů, my však odvozujeme svůj původ od matek a válečný pokřik mocných núbijských žen žene tyto cizí „muže“ zpět domů."
 tradition_nubian_warrior_kings_name: "Králové válečníci"
 tradition_nubian_warrior_kings_desc: "Obyvatelé východní Afriky dobře pamatují velké krále válečníky, kteří kdysi čelili nájezdníkům a zakládali království v Kúši. Naši sousedé mohou trvat na nadřazenosti žen, my však odvozujeme svůj původ od otců a válečný pokřik mocných núbijských mužů žene tyto cizí „ženy“ zpět domů."
 tradition_maritime_mangroves_name: "Mořeplavci mangrovů"
 tradition_maritime_mangroves_desc: "Tato kultura se naučila plavit bažinami, které ostatní považují za neprůchodné. Využila toho k budování nedostupných základen, z nichž obchoduje, podniká nájezdy a prozkoumává svět."
 tradition_mixed_governance_name: "Smíšená správa"
 tradition_mixed_governance_desc: "Tato kultura považuje každou myšlenku za hodnou vyslechnutí a každý nový způsob vlády za hodný vyzkoušení. Vládci podporují vazaly, aby spravovali své země podle vlastního uvážení."
 tradition_ritual_scarrification_name: "Rituální skarifikace"
 tradition_ritual_scarrification_desc: "Tato kultura si váží těch, jejichž tělo okusilo ostří. Ať už chtějí prokázat svou odvahu, nebo vytvořit krásný vzor, záměrně si zjizvují kůži."
 tradition_hidden_cities_name: "Skrytá města"
 tradition_hidden_cities_desc: "Ať už se ukrývají v korunách stromů džungle, nebo je chrání přírodní bludiště, cizinci možná ani nevědí, že města této kultury existují, natož jak je obléhat."
 tradition_hereditary_bards_name: "Dědiční bardi"
 tradition_hereditary_bards_desc: "V některých kulturách se příběhy předávají z generace na generaci a mají stejnou hodnotu jako jakákoli vlastnická listina."
 tradition_ancient_miners_name: "Dávní horníci"
 tradition_ancient_miners_desc: "Tato kultura byla odjakživa obklopena surovinami, rudou a neopracovanými drahokamy. Její lid má nadání vyhledávat vhodná místa pro těžbu."
 tradition_wetlanders_name: "Obyvatelé mokřadů"
 tradition_wetlanders_desc: "Tato kultura si dokonale osvojila život v močálech a bažinách. Přestože je zdejší život občas bojem s plísní, její lid se naučil využívat rašelinu ve svůj prospěch."
 tradition_diasporic_name: "Diasporická"
 tradition_diasporic_desc: "Lidé této kultury ztratili vlast, která jim bývala drahá. Někteří z nich putují světem a hledají místo, kde by mohli začít znovu."
 tradition_sorcerous_metallurgy_name: "Čarodějná metalurgie"
 tradition_sorcerous_metallurgy_desc: "V této kultuře je snad tolik alchymistů, kteří se snaží proměnit kovy ve zlato, jako kovářů kujících zbraně. Co na tom záleží, pokud jsou bohatství i výzbroj této kultury posilovány čarodějnictvím?"
 tradition_polders_name: "Poldry"
 tradition_polders_desc: "Tato kultura má dlouhou tradici získávání půdy na úkor okolního moře. Díky tomu může využívat k zemědělství a výstavbě plochy, které by jinak tvořilo mělké mořské dno."
 tradition_caucasian_wolves_name: "Kavkazští vlci"
 tradition_caucasian_wolves_desc: "Po staletích budování domova v okolí kavkazských bran si tato kultura dokonale osvojila vše, co obnáší válčení v horách."
 tradition_artisans_name: "Zkušení řemeslníci"
 tradition_artisans_desc: "Děti v této kultuře často pokračují v povolání svých rodičů a po celé generace tak shromažďují rozsáhlé znalosti a dovednosti ve svém řemesle."
 tradition_debug_name: "Proměnlivé způsoby"
 tradition_debug_desc: "Tato kultura je známá množstvím nesourodých a vzájemně si odporujících postojů."
 tradition_fp1_coastal_warriors_name: "Pobřežní válečníci"
 tradition_fp1_coastal_warriors_desc: "Pobřeží nás odjakživa přitahovalo. Štiplavý mořský vzduch, křik racků, vůně uzených ryb... který válečník by se dobrovolně rozhodl žít daleko od vody a svobody, již přináší?"
 tradition_fp1_performative_honour_name: "Prokazovaná čest"
 tradition_fp1_performative_honour_desc: "Čest je sice vrozená, ale lze ji také získat či ztratit vlastními skutky. Ti, kdo napravují urážky a mstí se za ně, rostou z holobrádků ve válečníky, zatímco vojáci, kteří selžou, klesají mezi spodinu."
 tradition_fp1_northern_stories_name: "Severské příběhy"
 tradition_fp1_northern_stories_desc: "Život se prožívá, vypráví a uchovává v paměti prostřednictvím příběhů. To, co říkáme a co o nás říkají ostatní, je stejně důležité jako naše činy. Nezapomínáme na to a naše příběhy to dokazují."
 tradition_fp1_trials_by_combat_name: "Soudní souboje"
 tradition_fp1_trials_by_combat_desc: "Slova jsou zbabělou náhražkou zbraní. Proč svěřovat spravedlnost vetchým zákonům a zkorumpovaným soudcům, když lze spory vyřešit rychleji a spravedlivěji ostřím?"
 tradition_fp1_the_right_to_prove_name: "Právo se osvědčit"
 tradition_fp1_the_right_to_prove_desc: "Ne každý se rodí jako bojovník, ale s náležitou odvahou a silnou paží třímající meč může každý dokázat, že je válečníkem v srdci, a stát se jím i ve skutečnosti."
 culture_parameter_city_buildings_more_county_opinion: "[Concept('city','Městské')|E] [Concept('holdings','državy')|E] poskytují za každou úroveň více [Concept('county_opinion','názoru hrabství')|E]"
 culture_parameter_monastic_expectations: "[Concept('characters','Postavy')|E] této [Concept('culture','kultury')|E] s větší pravděpodobností přijmou řeholní sliby, zejména tvé nezletilé děti"
 culture_parameter_temperate_trait_bonuses: "[Concept('traits','Rysy')|E] [GetTrait('temperate').GetName( GetNullCharacter )] poskytují dodatečné bonusy"
 culture_parameter_devoted_trait_bonuses: "[Concept('traits','Rysy')|E] [GetTrait('devoted').GetName( GetNullCharacter )] poskytují dodatečné bonusy"
 tradition_strong_kinship_name: "Silné příbuzenské vazby"
 tradition_strong_kinship_desc: "Tato kultura má silnou tradici příbuzenských vazeb v rámci širší rodiny či klanu. V časech nouze se může vládce vždy spolehnout na své příbuzné."
 tradition_amharic_highlanders_name: "Amharští horalé"
 tradition_amharic_highlanders_desc: "Amharská vysočina je pro zemědělství velmi vhodná, pokud člověk ví, jak k němu správně přistupovat. Tento lid zde po mnoho generací žije a pracuje, prosperuje a zároveň rozvíjí vlastní tradice a zvyky."
 culture_parameter_witenagemot_succession_enabled: "Lze uzákonit [Concept('succession_law','zákon následnictví')|E] [GetLaw('saxon_elective_succession_law').GetName]"
