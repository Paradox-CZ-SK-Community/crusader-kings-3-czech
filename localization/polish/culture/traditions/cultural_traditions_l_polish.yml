 REQUEST_SPARRING_TEXT: "Pozdravy, můj [actor.Custom2('RelationToMeShort', SCOPE.sC('recipient'))]. Oba se musíme připravit na válku, zdokonalit své schopnosti a zbystřit svou mysl. Vyzývám tě k tréninku se mnou, přines si jakoukoli zbraň, kterou si přeješ!"
