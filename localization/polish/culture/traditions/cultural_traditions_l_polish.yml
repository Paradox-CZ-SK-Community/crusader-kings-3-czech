 culture_tradition_events.3000.t: "Pozorování medvěda" # todo: NEW TRANSLATION
 culture_tradition_events.3000.desc: "Lovci v [bear_sighting.GetName] spatřili [bear_sighting_county.Custom('GetAnimalGroup')] [bear_sighting_county.Custom('GetAnimalPlural')] pobíhajících po [bear_sighting.Custom('GetTerrainTypePlural')] — široké otisky v bahně, škrábance na stromech, ulámané křoví.\n\nKdybych [GetActivityType('activity_hunt').GetName|l] a [Select_CString(ROOT.Char.IsFemale,'zabila','zabil')] nebo ulovil jednoho, duchové si toho jistě všimnou." # todo: NEW TRANSLATION
