 tradition_scholar_officials_name: "Učenští úředníci" # todo: NEW TRANSLATION
 tradition_scholar_officials_desc: "Pero a štětec jsou mocnější než meč... Tato kultura pevně věří v ideál, kde je vliv svěřen loajálním úředníkům vzdělaným v ušlechtilých uměních." # todo: NEW TRANSLATION
 culture_parameter_can_always_convert_to_confucianism: "Může použít [GetDecisionWithKey('convert_to_confucianism').GetName] [Concept('decision','rozhodnutí')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 culture_parameter_can_always_convert_to_taoism: "Může použít [GetDecisionWithKey('convert_to_taoism').GetName] [Concept('decision','rozhodnutí')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
