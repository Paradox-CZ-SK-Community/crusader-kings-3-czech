 tradition_tgp_warrior_monks_name: "Bojující mniši" # todo: NEW TRANSLATION
 tradition_tgp_warrior_monks_desc: "Oddanost morálnímu životu nemusí vylučovat použití síly, zejména když je třeba chránit náboženskou komunitu před rivaly a zkaženými úředníky, nebo bránit potřebné." # todo: NEW TRANSLATION
