 tradition_maritime_way_of_life_name: "Námořní způsob života" # todo: NEW TRANSLATION
 tradition_maritime_way_of_life_desc: "Odnepaměti jsou vyplouvající čluny s výložníky této kultury viděny na obzoru. Dlouhé námořní plavby jsou pro tento lid druhou přirozeností.\nPro někoho, kdo považuje život na moři za přirozený, neexistují žádná omezení v tom, kam se mohou usadit, s kým mohou obchodovat nebo koho mohou přepadnout." # todo: NEW TRANSLATION
 tradition_nudists_name: "Nudisté" # todo: NEW TRANSLATION
 tradition_nudists_desc: "Příznivci této kultury nevěří v ochranu těla před živly; raději žijí tak, jak je stvořil jejich tvůrce." # todo: NEW TRANSLATION
 tradition_stratified_society_name: "Stratifikovaná společnost" # todo: NEW TRANSLATION
 tradition_stratified_society_desc: "Jsou ti, kteří se narodili, aby vedli, a ti, kteří se narodili, aby sloužili. V $tradition_stratified_society_name$ realita dědičných privilegií často převáží nad principy meritokracie a blízkost k moci je všechno." # todo: NEW TRANSLATION
