 culture_emergence_events.0003.desc: "[culture_check_2.GetName]\n[duchy_title.GetName]\n[diverge_dummy.GetFullName]"
 culture_emergence_events.0005.t: "Romantika románštiny"
 culture_emergence_events.0005.desc: "Zatímco [county_scope.GetNameNoTierNoTooltip] slaví vznik [new_culture_scope.GetName], všiml jsem si, že někteří z těch #italic rustikálních#! lidí této země stále mluví dialektem, který přesně neodpovídá tomu, co jsem si myslel, že [new_culture_scope.GetNameNoTooltip] je.\n\nJeden sedlák náhodou stojí blízko cesty, když projíždím, a žvaní s někým na polích. „Ty tam!“ hřímám. „Co to sakra mluvíš za řeč?“\n\n[rustic_peasant.GetWomanMan] se zarazí. „Myslím,“ pomalu odpovídá v [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip], „prostě tomu říkáme #italic románština#!.“\n\n„Románština,“ že? Jsou tohle opravdu mí lidé?"
 culture_emergence_events.0005.a: "Naše jazyky musí být stejně románské jako naše srdce."
 culture_emergence_events.0005.a.tt: "[new_culture_scope.GetNameNoTooltip] bude používat #bold pouze#! románské jména"
 culture_emergence_events.0005.b: "Románština se stane součástí mozaiky [new_culture_scope.GetName]."
 culture_emergence_events.0005.b.tt: "[new_culture_scope.GetNameNoTooltip] bude používat románské jména #bold navíc k#! svým současným jménům"
 culture_emergence_events.0005.c: "Tento selský jazyk pro [new_culture_scope.GetName] nemá žádnou hodnotu!"
 culture_emergence_events.0005.c.tt: "[new_culture_scope.GetNameNoTooltip] zůstane tak, jak je"
