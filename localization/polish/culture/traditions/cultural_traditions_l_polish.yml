 tradition_tgp_hydraulic_builders_name: "Stavitelé vodních děl"
 tradition_tgp_hydraulic_builders_desc: "Tato kultura přikládá velký význam duchovnímu využití vodních děl. Středem tohoto okouzlení je [GetBuilding('sacred_pool_06').GetName], který bývá rozšiřován na rozsáhlé nádrže s nesmírným náboženským významem."
 culture_parameter_sacred_pool_additional_bonuses: "Řada [GetBuilding('sacred_pool_01').GetTypeName|V] [Concept('buildings','budov')|E] má dodatečné bonusy v [Concept('counties','hrabstvích')|E] této [Concept('culture','kultury')|E]"
 culture_parameter_waterworks_additional_bonuses: "Řada [GetBuilding('waterworks_01').GetTypeName|V] [Concept('buildings','budov')|E] má dodatečné bonusy v [Concept('counties','hrabstvích')|E] této [Concept('culture','kultury')|E]"
 culture_parameter_may_build_sacred_pools_ahead_of_time: "Všechny [Concept('buildings','budovy')|E] [GetBuilding('sacred_pool_01').GetTypeName|V] lze postavit o jednu [Concept('era','éru')|E] dříve"
 tradition_tgp_esoteric_power_name: "Ezoterická moc"
 tradition_tgp_esoteric_power_desc: "Božská a tajemná jsou dvě slova, která v očích této kultury popisují šlechtu. Vládci, kteří si chtějí zajistit svůj mandát, se musí účastnit složitých rituálů a projevovat svou moc vystavováním božských artefaktů."
 culture_parameter_increases_effect_of_mandala_realm_contracts: "Zisk [Concept('piety','zbožnosti')|E] a [Concept('legitimacy','legitimity')|E] z [Concept('mandala_rituals','mandalových rituálů')|E] je zvýšen"
