 recruit_mountain_specialist_decision_confirm: "$invite_knights_decision_confirm$"
 recruit_dry_specialist_decision: "Naverbovat odborníka na poušť"
 recruit_dry_specialist_decision_desc: "[ROOT.Char.GetCulture.GetCollectiveNoun] jsou zvyklí na spalující žár slunce a pod jeho neúprosnými paprsky putují široko daleko. Chci-li přesouvat své armády, aniž by v horku zahynuly, měl bych požádat o jejich vedení."
 recruit_dry_specialist_decision.tt: "K tvému [Concept('court','dvoru')|E] se připojí [Concept('commander','velitel')|E] s vysokým [Concept('martial','vojenstvím')|E] a [Concept('trait','rysem')|E] [GetTrait('desert_warrior').GetName( GetNullCharacter )]"
