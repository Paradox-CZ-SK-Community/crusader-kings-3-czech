 culture_parameter_piety_level_affect_artifact_quality: "[Concept('inspirations','Inspirace')|E] vytvářejí kvalitnější [Concept('artifacts','artefakty')|E], čím vyšší je [Concept('piety_level','úroveň oddanosti')|E] zadavatele"
 culture_parameter_kris_artifacts_are_more_powerful: "Vyrobené krisové $artifact_dagger$ [Concept('artifacts','artefakty')|E] získávají další výhody"
 tradition_tgp_barangay_confederations_name: "Konfederace barangayů"
 tradition_tgp_barangay_confederations_desc: "Vládci této kultury vedou mnoho různorodých městských států roztroušených podél říčních ústí a pobřeží. Tyto státy se značně liší velikostí, ale často se spojují do konfederací vedených náčelníkem vybraným z řad [Glossary( 'Datu', 'DATU_GLOSS' )] jejich členů."
