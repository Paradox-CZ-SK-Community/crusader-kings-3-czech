 tradition_tgp_religious_hospitality_desc: "Tato kultura vyniká ve spojování cizích náboženství se svými zvyky, což vede ke kosmopolitnější společnosti, kde mnoho vyznání žije v míru vedle sebe. Velká část tohoto úspěchu vychází z obchodu a mezinárodních vztahů."
