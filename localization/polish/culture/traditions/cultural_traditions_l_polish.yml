 culture_parameter_stress_loss_bonus_from_harmonious_traits: "Zvýšené snižování [Concept('stress','stres')|E] z [GetTrait('temperate').GetName( GetNullCharacter )], [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )] a [GetTrait('compassionate').GetName( GetNullCharacter )] [Concept('traits','rysy')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tradition_tgp_imperial_peace_name: "Křehký mír" # todo: NEW TRANSLATION
 tradition_tgp_imperial_peace_desc: "Ačkoliv je oblast z velké části chráněna před invazemi díky moři, obrana proti nájezdům ze severu a udržení Kanmova míru proti pretendentům či vzpurným guvernérům stále vyžaduje zdatné bojovníky a organizaci." # todo: NEW TRANSLATION
 culture_parameter_unlock_mounted_samurai_units: "Může verbovat [GetMaA('japanese_horse_archers').GetName] jako [Concept('men_at_arms','ozbrojenci')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tradition_tgp_rice_cultivators_name: "Pěstitelé rýže" # todo: NEW TRANSLATION
 tradition_tgp_rice_cultivators_desc: "Rýže je životodárnou osou této kultury. Díky pilné práci a zemědělskému umění jsou jejich sklizně bohaté, pokud ovládají vhodné půdy. V důsledku toho jejich ekonomická prosperita a vojenská síla překonávají méně vyspělé sousedy." # todo: NEW TRANSLATION
 tradition_tgp_inward_perfection_name: "Vnitřní dokonalost" # todo: NEW TRANSLATION
 tradition_tgp_inward_perfection_desc: "Tato kultura upřednostňuje soběstačnost a kultivaci vnitřních cností před cizím vlivem. Diplomatická pouta mohou uvadat, ale znalosti a introspekce vzkvétají v klidné izolaci." # todo: NEW TRANSLATION
 tradition_tgp_fortified_strongholds_name: "Opevněná sídla" # todo: NEW TRANSLATION
 tradition_tgp_fortified_strongholds_desc: "Tato kultura se vyznačuje velkými opevněnými městy, která plní náboženské, vojenské i vládní funkce. Ochrana těchto kulturních opěrných bodů je zásadní a zakládání dalších měst je záležitostí velké prestiže." # todo: NEW TRANSLATION
 culture_parameter_founding_temple_citadels_gives_more_piety: "Založení [Concept('temple_citadel','chrámová citadela')|e] [Concept('holdings','državy')|e] uděluje #P +100%#! [Concept('piety','zbožnost')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
