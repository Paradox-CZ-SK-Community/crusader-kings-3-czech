 culture_parameter_military_governor_appointment_score: "[Concept('learning_skill','dovednost učenosti')|E] zvyšuje [Concept('candidate_score','hodnocení kandidáta')|E] pro provincie [GetSubjectContractType( 'celestial_provinces' ).GetObligationNameShort( 'celestial_province_military' )]" 
 tradition_tgp_ephemeral_grace_name: "Pomíjivá milost"
 tradition_tgp_ephemeral_grace_desc: "Estetická filozofie #EMP Mono no Aware#! oslavuje pomíjivou krásu prchavých okamžiků. Podporuje hluboký soulad s přírodou a rozjímavé oceňování umění a pomíjivosti života."
 culture_parameter_stress_loss_bonus_from_harmonious_traits: "Zvýšená ztráta [Concept('stress','stresu')|E] z [GetTrait('temperate').GetName( GetNullCharacter )], [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )] a [GetTrait('compassionate').GetName( GetNullCharacter )] [Concept('traits','rysů')|E]" 
 tradition_tgp_imperial_peace_name: "Křehký mír"
 tradition_tgp_imperial_peace_desc: "Ačkoli je tato kultura z velké části chráněna před nájezdy mořem, obrana proti vpádům ze severu a udržení Kammuova míru proti uchvatitelům či povýšeným místodržícím stále vyžaduje schopné bojovníky a organizaci."
 culture_parameter_unlock_mounted_samurai_units: "Lze najmout [GetMaA('japanese_horse_archers').GetName] jako [Concept('men_at_arms','ozbrojence')|E]" 
 tradition_tgp_rice_cultivators_name: "Pěstitelé rýže"
 tradition_tgp_rice_cultivators_desc: "Rýže je životní krví této kultury. Díky pilné práci a zemědělským znalostem jsou jejich sklizně bohaté, pokud ovládají vhodnou půdu pro své plodiny. Výsledkem je, že jejich hospodářská prosperita a vojenská síla vysoko převyšují méně vyspělé sousedy." 
 tradition_tgp_inward_perfection_name: "Vnitřní dokonalost"
 tradition_tgp_inward_perfection_desc: "Tato kultura upřednostňuje soběstačnost a rozvoj vnitřních ctností před cizími vlivy. Diplomatické vazby mohou chřadnout, avšak znalosti a rozjímání vzkvétají v poklidné izolaci."
 tradition_tgp_fortified_strongholds_name: "Opevněné pevnosti"
 tradition_tgp_fortified_strongholds_desc: "Tato kultura se vyznačuje velkými opevněnými městy, která plní náboženské, vojenské i správní funkce. Ochrana těchto kulturních pevností je zásadní a zakládání dalších měst je otázkou velké prestiže."
 culture_parameter_founding_temple_citadels_gives_more_piety: "Zakládání [Concept('temple_citadels','chrámových citadel')|E] [Concept('holdings','držav')|E] poskytuje #P +100%#! [Concept('piety','zbožnosti')|E]"
