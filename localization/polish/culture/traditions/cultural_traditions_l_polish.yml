 recruit_dry_specialist_decision_confirm: "$invite_knights_decision_confirm$"
 recruit_hill_specialist_decision: "Naverbovat odborníka na kopcovitý terén"
 recruit_hill_specialist_decision_desc: "[ROOT.Char.GetCulture.GetCollectiveNoun] jsou v kopcích a údolích jako doma, pasou zde svá stáda a snadno odhánějí divokou zvěř. O schopné pastevce, kteří by si stejně dobře vedli při provázení armády, není nouze."
 recruit_hill_specialist_decision.tt: "K tvému [Concept('court','dvoru')|E] se připojí [Concept('commander','velitel')|E] s vysokým [Concept('martial','vojenstvím')|E] a [Concept('trait','rysem')|E] [GetTrait('rough_terrain_expert').GetName( GetNullCharacter )]"
 recruit_hill_specialist_decision_tooltip: "$recruit_hill_specialist_decision.tt$"
 recruit_hill_specialist_decision_confirm: "$invite_knights_decision_confirm$"
 recruit_jungle_specialist_decision: "Naverbovat odborníka na džungli"
 recruit_jungle_specialist_decision_desc: "Cestování džunglí je drsné a zrádné, ale [ROOT.Char.GetCulture.GetCollectiveNoun] dokonale ovládají umění, jak jí bezpečně procházet. Zkušení průzkumníci a průvodci jsou připraveni provést mé vojsko tímto bujným, avšak smrtícím terénem."
 recruit_jungle_specialist_decision.tt: "K tvému [Concept('court','dvoru')|E] se připojí [Concept('commander','velitel')|E] s vysokým [Concept('martial','vojenstvím')|E] a [Concept('trait','rysem')|E] [GetTrait('jungle_stalker').GetName( GetNullCharacter )]"
