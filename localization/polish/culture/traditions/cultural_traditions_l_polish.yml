 culture_emergence_events.0002.t: "Nová identita"
 culture_emergence_events.0002.desc: "Můj lid, [ROOT.Char.GetCulture.GetCollectiveNoun], je hrdý a rozšířený národ.\n\nAčkoli jsme si podobní, nemohu popřít, že se moji poddaní začali chovat jinak než [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] jinde. Někdy dokonce dochází ke konfliktům mezi navštěvujícími skupinami [ROOT.Char.GetCulture.GetNameNoTooltip] a těmi pod mou vládou.\n\nVyvíjí se u nás nová identita — jsme [ROOT.Char.GetCulture.GetNameNoTooltip], a přitom zároveň ne. Možná by se tento vývoj měl podpořit?"
 culture_emergence_events.0002.a: "Vybudujeme novou, silnější identitu!"
 culture_emergence_events.0002.b: "Jsme [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] a nic jiného! Srovnejte se!"
 new_divergent_culture_tt: "Objeví se [Concept('divergent_culture','odštěpenou kulturou')|E], která bude sdílet většinu [Concept('traditions','tradic')|E] a [Concept('culture_pillars','kulturní pilíře')|E] [ROOT.Char.GetCulture.GetName] [Concept('culture','kultura')|E], ale s novými [Concept('ethos','étosem')|E] a některé [Concept('traditions','tradice')|E] budou nahrazeny." # todo: CONCEPT CASE
