 culture_parameter_learn_language_success_chance_for_others: "[GetScheme('learn_language').GetTypeName] [Concept('success_chance','Šance na úspěch')|E]: #P +50%#! při učení se [Concept('language','jazykem')|E] této [Concept('culture','kulturou')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 culture_parameter_mystic_trait_from_education: "Děti mohou získat [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [Concept('trait','rys')|E], pokud mají [Concept('guardian','poručník')|E] této [Concept('culture','kultury')|E] s #V 12+#! [learning_i][Concept('learning','učeností')|E] " # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tradition_cultivation_name: "Kultivace" # todo: NEW TRANSLATION
 tradition_cultivation_desc: "Vyladění těla, dechu a mysli, dokud se bláto srdce neusadí a vnitřní ctnost nevystoupí jako čistá voda." # todo: NEW TRANSLATION
 tradition_intensive_farming_name: "Intenzivní zemědělství" # todo: NEW TRANSLATION
 tradition_intensive_farming_desc: "Tato kultura si velmi cení rozsáhlé rolnické třídy, která podporuje její nezemědělské obyvatelstvo. Díky tisíciletím zkušeností dokázala výrazně zvýšit výnosy pšenice a rýže v závislosti na tom, co nejlépe vyhovuje místním podmínkám." # todo: NEW TRANSLATION
