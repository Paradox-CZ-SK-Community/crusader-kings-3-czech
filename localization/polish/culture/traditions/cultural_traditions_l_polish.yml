 culture_parameter_permafrost_modifier_mechanic: "[Concept('counties','Hrabství')|E] této [Concept('culture','kultury')|E] začínají s [Concept('modifier','modifikátorem')|E] #V $mpo_siberian_permafrost_modifier$#!, který snižuje [Concept('development','rozvoj')|E] a [Concept('control','kontrolu')|E]. Pokud mají [Concept('holder','držitel')|E] a [Concept('county','hrabství')|E] [Concept('culture','kulturu')|E] s touto [Concept('culture_tradition','kulturní tradicí')|E], #V $mpo_siberian_permafrost_modifier$#! nesnižuje [Concept('control','kontrolu')|E] a poskytuje bonusy."
