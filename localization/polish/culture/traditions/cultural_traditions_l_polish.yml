 mpo_siberian_permafrost_modifier: "Sibiřský permafrost"
 mpo_siberian_permafrost_modifier_desc: "Půda zmrzlá po tisíciletí, bez přístupu k podzemní vodě a s řídkou vegetací. Terén se každý rok mění v důsledku opakovaného tání a zamrzání. Aby si zdejší obyvatelé tyto země osvojili, potřebují staletí přizpůsobování. Všichni ostatní zahynou a připojí se k dávným mrtvým pod ledem.\n\n#weak Tento modifikátor lze odstranit pomocí #V $feudalize_holding_interaction$#! nebo #V $demand_admin_interaction$#! [Concept('interaction','interakce')|E] nebo po dobytí celého severu pomocí #V $expand_the_steppe_decision_generic$#! [Concept('decision','rozhodnutí')|E] pro oblast #V $dlc_mpo_steppe_siberia_further_expansion_tooltip$#! regionu#!\n\n"
