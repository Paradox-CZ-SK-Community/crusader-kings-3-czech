 tradition_maritime_way_of_life_name: "Námořní způsob života"
 tradition_maritime_way_of_life_desc: "Od nepaměti lze na obzoru spatřit katamarány s výložníky této kultury. Dlouhé plavby po moři jsou pro tento lid druhou přirozeností.\nPro toho, kdo považuje život na moři za přirozený, neexistují hranice toho, kde se může usadit, s kým může obchodovat ani koho může přepadávat."
 tradition_nudists_name: "Nudisté"
 tradition_nudists_desc: "Příslušníci této kultury nevěří v ochranu svého těla před živly a místo toho žijí tak, jak je jejich stvořitel učinil."
 tradition_stratified_society_name: "Rozvrstvená společnost"
 tradition_stratified_society_desc: "Někteří se rodí k vládnutí a jiní ke službě. V $tradition_stratified_society_name$ dědičná privilegia často převáží nad zásadami meritokracie a blízkost k moci znamená vše."
 culture_parameter_family_shares_merit: "Po dosažení @merit_level_5_icon![GetModifier( 'merit_level_5' ).GetNameWithTooltip|L] [Concept('merit','zásluh')|E] získá každý člen [Concept('close_family','blízké rodiny')|E] preferovaného pohlaví pod touto hodností značné množství [Concept('merit','zásluh')|E]"
 culture_parameter_family_skips_exams: "Navíc se bude s těmito členy [Concept('close_family','blízké rodiny')|E] zacházet, jako by složili @provincial_exam_icon! [GetActivityType( 'activity_local_examination' ).GetName]"
 culture_parameter_marrying_into_the_ruling_family_gives_influence: "Když se [Concept('independent_ruler','nezávislý vládce')|E] ožení s [Concept('character','postavou')|E] ve stejném [Concept('realm','panství')|E], která sdílí tuto [Concept('tradition','tradici')|E], získá [Concept('house_head','hlava rodu')|E] manžela či manželky značný [Concept('influence','vliv')|E]"
 culture_parameter_unlocks_gakgung_archers_maa: "Lze najmout [GetMaA('gakgung_archers').GetName] jako [Concept('men_at_arms','ozbrojence')|E]"
 tradition_stratified_society_toast_title: "[ROOT.Char.GetHouse.GetNameNoTooltip] na vzestupu"
 tradition_stratified_society_toast_desc: "Jako výsada tvé vznešené hodnosti získali tví blízcí příbuzní [Concept('merit','zásluhy')|E] a nemusí skládat @provincial_exam_icon! [GetActivityType( 'activity_local_examination' ).GetName]"
 tradition_stratified_society_family_member_toast_title: "$tradition_stratified_society_toast_title$"
 tradition_stratified_society_family_member_toast_desc: "Díky úspěchům [family_success.GetName] jsi získal [Concept('merit','zásluhy')|E] a nemusíš skládat @provincial_exam_icon! [GetActivityType( 'activity_local_examination' ).GetName]"
 tgp_nepotism_bypass_exams_modifier: "Osvobození od zkoušek"
 tgp_nepotism_bypass_exams_modifier_desc: "Tato postava obešla běžnou zkoušku potřebnou k získání úřednického postavení díky vlivu blízkého příbuzného."
 tradition_fortress_mastery_name: "Mistrovství v opevnění"
 tradition_fortress_mastery_desc: "Tato kultura má dlouhou tradici obranné vynalézavosti a využívá místní terén k ochraně své domoviny a odrážení případných nájezdníků. Tuto schopnost spojuje s mistrovstvím v lukostřelbě a hbitými jednotkami schopnými přelstít každého nepřítele."
 culture_parameter_governor_trait_gives_counter_resistance: "Každá úroveň [GetTrait('governor').GetName( GetPlayer )] [Concept('trait','rysu')|E] poskytuje [EmptyScope.ScriptValue('governor_trait_counter_bonus_value')|+%0] $MOD_COMBAT_COUNTER_RESISTANCE|V$"
 tenet_takamin_name: "Takamin"
 tenet_takamin_desc: "Víra v medvědy jako projevy bohů vyžaduje úctu k posvátnosti těchto zvířat a jejich zabití během lovu musí proběhnout s nejvyšší úctou."
 doctrine_parameter_allows_bear_sacrifice: "Odemyká [GetDecisionWithKey('sacrifice_bear_decision').GetName] [Concept('decision','rozhodnutí')|E]"
 doctrine_parameter_chance_to_gain_prowess_during_bear_hunts: "Zabití #V medvěda#! během [GetActivityType('activity_hunt').GetName] poskytne [prowess_i][Concept('prowess','udatnost')|E] a [martial_i][Concept('martial','vojenství')|E]"
 doctrine_parameter_frequent_bear_sightings: "[Concept('hunt_sightings','pozorování při lovu')|E] #V medvědů#! se budou pravidelně objevovat"
 doctrine_parameter_efficient_hunt_cornering: "Během [GetActivityType('activity_hunt').GetName] bude metoda #V Zahnaní do kouta#! pravděpodobněji úspěšná"
 culture_tradition_events.3000.t: "Pozorování medvěda"
 culture_tradition_events.3000.desc: "Lovci v [bear_sighting.GetName] spatřili [bear_sighting_county.Custom('GetAnimalGroup')] [bear_sighting_county.Custom('GetAnimalPlural')], které se potulují po [bear_sighting.Custom('GetTerrainTypePlural')] — široké stopy v blátě, stromy označené drápy, polámané křoví.\n\nKdybych se vydal na [GetActivityType('activity_hunt').GetName|l] a jednoho z nich zabil či chytil, duchové by si toho jistě všimli."
 culture_tradition_events.3000.a: "Měl bych si připravit kopí..."
 bear_sacrifice_war_modifier: "Válečná oběť medvěda"
 bear_sacrifice_war_modifier_desc: "Tato postava obětovala medvěda a věří, že jí to přinese úspěch ve válce."
 bear_sacrifice_authority_modifier: "Oběť medvěda za autoritu"
 bear_sacrifice_authority_modifier_desc: "Tato postava obětovala medvěda a věří, že jí to propůjčuje autoritativní přítomnost."
 sacrifice_bear_decision_effect: "Získá volbu mezi [piety_i][Concept('piety','zbožností')|E], [GetModifier('bear_sacrifice_war_modifier').GetNameWithTooltip] nebo [GetModifier('bear_sacrifice_authority_modifier').GetNameWithTooltip]"
 culture_tradition_events.3100.t: "Oběť medvěda"
 culture_tradition_events.3100.desc: "Svazujeme velkého medvěda v tichosti. Lovci tiše zpívají, hlasy pevné, zatímco kouř stoupá s vůní smrku.\n\nKlekám si, přikládám čelo k jeho čenichu a šeptám své díky, než čepel klesne. Podělíme se o jeho maso, aby jeho síla mohla žít mezi námi."
 culture_tradition_events.3100.a: "Ať hodujeme!"
 culture_tradition_events.3100.b: "Naši nepřátelé padnou!"
 culture_tradition_events.3100.c: "Poslouchejte, neboť duch medvěda stojí po mém boku."
 tradition_ordo_riders_name: "Jezdci Orda"
 tradition_ordo_riders_desc: "Požadavky na stáda a potřeba posílit jednotu kmene přiměly mnoho nájezdníků tohoto lidu stát se zocelenými válečníky, kteří dokážou odrážet útoky a zároveň účinně shromažďovat zásoby pro svůj lid."
 culture_parameter_unlocks_ordo_riders_maa: "Lze najmout [GetMaA('ordo_riders_horse_archers').GetName] jako [Concept('men_at_arms','ozbrojence')|E]"
 culture_parameter_reaver_gives_buffs_to_horse_archers: "[GetTrait('reaver').GetName( GetNullCharacter )] [Concept('traits','rysy')|E] budou poskytovat bonusy [Concept('archer_cavalry','jízdním lučištníkům')|E] [Concept('men_at_arms','ozbrojenců')|E]"
 tradition_chinese_arts_name: "Čínská umění"
 tradition_chinese_arts_desc: "Cesta pera, cesta štětce, to vše jsou důležité prvky této kultury. Namísto závislosti pouze na vojenské síle nebo složité správě kladou Číňané důraz na zdokonalování všech forem umění."
 culture_parameter_commissions_cheaper: "[Concept('decision','Rozhodnutí')|E] #bold $commission_artifact_decision$#! bude stát o #P 50%#! méně [gold_i] [Concept('gold','zlata')|E]"
 culture_parameter_scholars_and_poets_are_viewed_more_positively: "[GetTrait('lifestyle_poet').GetName( GetNullCharacter )] a [GetTrait('scholar').GetName( GetNullCharacter )] [Concept('traits','rysy')|E] jsou považovány za pozitivní"
 tradition_sinophilic_name: "Sinofilní"
 tradition_sinophilic_desc: "Vliv čínské hegemonie nad tímto panstvím vedl mnoho jeho obyvatel k přijetí jejich zvyků."
 culture_parameter_can_adopt_chinese_culture: "Lze přijmout [GetCultureByKey('han').GetCollectiveNoun] [Concept('culture','kulturu')|E]"
 culture_parameter_more_successful_kowtows: "[Concept('tribute_missions','tributární mise')|E] mají vyšší šanci na úspěch"
 culture_parameter_may_adopt_silk_road_innovations: "Lze získat přístup k [Concept('silk_road_innovations','inovacím Hedvábné stezky')|E] známým [GetCultureByKey('han').GetCollectiveNoun] [Concept('culture','kulturou')|E]"
 tradition_tgp_warrior_monks_name: "Váleční mniši"
 tradition_tgp_warrior_monks_desc: "Oddanost mravnému životu nevylučuje použití síly, zejména pokud je třeba chránit náboženské společenství před soupeřícími sektami a zkorumpovanými úředníky nebo bránit potřebné."
 culture_parameter_unlock_warrior_monk_units: "Lze najmout [GetMaA('warrior_monks').GetName] jako [Concept('men_at_arms','ozbrojence')|E]"
 tradition_scholar_officials_name: "Učené úřednictvo"
 tradition_scholar_officials_desc: "Pero a štětec jsou mocnější než meč... Tato kultura pevně věří v ideál, kdy je vliv svěřován loajálním úředníkům vzdělaným v ušlechtilých uměních."
 culture_parameter_can_always_convert_to_confucianism: "Lze použít [GetDecisionWithKey('convert_to_confucianism').GetName] [Concept('decision','rozhodnutí')|E]"
 culture_parameter_can_always_convert_to_taoism: "Lze použít [GetDecisionWithKey('convert_to_taoism').GetName] [Concept('decision','rozhodnutí')|E]"
 culture_parameter_can_author_books: "Lze přijmout [Concept('decision','rozhodnutí')|E] #V $author_book_decision$#!"
 culture_parameter_scholar_official_trait_bonuses: "[GetTrait('confucian_education').GetName( GetNullCharacter )] a [GetTrait('loyal').GetName( GetNullCharacter )] [Concept('traits','rysy')|E] mají dodatečné bonusy"
 culture_parameter_wants_to_learn_chinese: "Postavy této [Concept('culture','kultury')|E] se často budou učit čínský [Concept('language','jazyk')|E]"
 culture_parameter_learn_language_success_chance_for_others: "Šance na úspěch [GetScheme('learn_language').GetTypeName] [Concept('scheme','intriky')|E]: #P +50%#! při učení [Concept('language','jazyka')|E] této kultury"
 culture_parameter_mystic_trait_from_education: "Děti mohou získat [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [Concept('trait','rys')|E], pokud mají [Concept('guardian','vychovatele')|E] této [Concept('culture','kultury')|E] s #V 12+#! [learning_i][Concept('learning','učeností')|E]"
 tradition_cultivation_name: "Zušlechťování"
 tradition_cultivation_desc: "Ladění těla, dechu a mysli, dokud se bahno srdce neusadí a vnitřní ctnost nevystoupí jako čistá voda."
 tradition_intensive_farming_name: "Intenzivní zemědělství"
 tradition_intensive_farming_desc: "Tato kultura si velmi cení početné zemědělské vrstvy, která podporuje její nezemědělské obyvatelstvo. Díky tisíciletím zkušeností dokázala výrazně zvýšit výnosy pšenice a rýže podle toho, co nejlépe odpovídá místním podmínkám."
 oath_mend_the_fracture_tradition_name: "Odkaz smíření přísahou"
 oath_mend_the_fracture_tradition_desc: "Z hněvu a krvavé nedůvěry vzešlo smíření. Tato kultura vedená svým panovníkem vázaným přísahou zacelila rozkol mezi sebou a ostatními národy panství a dosáhla míru a prosperity."
 culture_parameter_synergy_cultures_counties_development: "Každé tři roky mohou [Concept('counties','hrabství')|E] této [Concept('culture','kultury')|E] získat [GetModifier('oath_mend_the_fracture_county').GetNameWithTooltip] [Concept('modifier','modifikátor')|E]"
 culture_parameter_synergy_cultures_maa_spawn: "Každé tři roky může [Concept('culture_head','hlava kultury')|E] získat další zvláštní [Concept('soldiers','vojáky')|E]"
 culture_parameter_synergy_cultures_opinion_gain: "Každé tři roky může [Concept('culture_head','hlava kultury')|E] získat [Concept('opinion','názor')|E] s [Concept('culture_head','hlavou kultury')|E] usmířené [Concept('culture','kultury')|E]"
 culture_parameter_synergy_cultures_positive_chance_desc: "Šance a síla výše uvedených účinků závisí na [Concept('cultural_acceptance','kulturním přijetí')|E] mezi usmířenými [Concept('cultures','kulturami')|E] a [Concept('opinion','názoru')|E] s druhou [Concept('culture_head','hlavou kultury')|E]"
 ach_culture_synergy_troops: "Vojáci přísahy"
