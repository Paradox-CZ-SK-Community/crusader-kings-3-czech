 culture_emergence_events.0001.t: "Kulturní prolnutí"
 culture_emergence_events.0001.desc: "Jsem [ROOT.Char.GetCulture.GetName], ale lidé mého hlavního města, [capital_county_scope.GetBaseName], jsou [hybdridization_offer_culture.GetName]. V poslední době jsem si všiml, že moji [hybdridization_offer_culture.GetNameNoTooltip] poddaní mě i mé [ROOT.Char.GetCulture.GetNameNoTooltip] zvyky napodobují.\n\nProlínají se naše tradice. Některé jsou staré, některé nové – ale nejdůležitější je, že jsou více přijímající mou vládu!\n\nMožná by se tento vývoj měl podpořit?"
 culture_emergence_events.0001.a: "Když se budou chovat jako já, budu se chovat jako oni. Brzy budeme jako jedno."
 culture_emergence_events.0001.b: "Jejich obdiv stačí!"
 cultural_acceptance_gain_event: "Z událostí"
