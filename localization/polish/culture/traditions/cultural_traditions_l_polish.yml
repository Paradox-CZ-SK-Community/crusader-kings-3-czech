 culture_parameter_non_admin_close_family_non_martial_gender_knights_in_defensive_wars: "Nesezdaní členové [Concept('close_family','blízké rodiny')|E] a [Concept('spouses','manželé')|E] ne-[Concept('administrative','správních')|E] [Concept('rulers','vládců')|E] pohlaví nezpůsobilého k vojenství mohou sloužit jako $knight_culture_player_plural$ v obranných [Concept('wars','válkách')|E]" 
 tradition_tgp_court_machinations_name: "Dvorní intriky"
 tradition_tgp_court_machinations_desc: "V labyrintu chodeb dvora vládnou eunuchové, konkubíny soupeří o přízeň a šepot zrady se odráží pozlacenými komnatami." 
 tradition_tgp_art_of_war_name: "Umění války"
 tradition_tgp_art_of_war_desc: "Tato kultura studuje vojenskou teorii již tisíc let a její generálové a maršálové mají k dispozici bohatou sbírku vojenských příruček a spisů. Toto bohatství znalostí zastiňuje pouze hluboké technické porozumění výrobě odolných zbrojí a zbraní."
 duchies_with_examination_halls_desc: "[Concept('culture','Kultura')|E] nedrží #high 5#! [Concept('duchies','vévodství')|E] s vybudovaným $building_type_examination_hall_01$ v jedné ze svých [Concept('holdings','držav')|E]"
