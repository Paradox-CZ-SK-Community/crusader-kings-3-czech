 culture_tradition_events.3100.t: "Medvědí oběť" # todo: NEW TRANSLATION
 culture_tradition_events.3100.desc: "Svazujeme velkého medvěda v tichu. Lovci zpívají nízko, hlasy vyrovnané, dým stoupá s vůní smrku.\n\nKlekám, tisknu čelo k jeho čenichu a šeptám poděkování předtím, než padne čepel. Podělíme se o jeho maso, aby jeho síla mezi námi přetrvala." # todo: NEW TRANSLATION
 culture_tradition_events.3100.a: "Pojďme hodovat!" # todo: NEW TRANSLATION
 culture_tradition_events.3100.b: "Naši nepřátelé padnou!" # todo: NEW TRANSLATION
 culture_tradition_events.3100.c: "Poslouchejte, medvědí duch je po mém boku." # todo: NEW TRANSLATION
 tradition_ordo_riders_name: "Ordo jezdci" # todo: NEW TRANSLATION
 tradition_ordo_riders_desc: "Požadavek na dobytek a potřeba posílit jednotu kmene přiměla mnoho kočovných lidí této kultury stát se zocelenými válečníky, schopnými odrazit útoky a zároveň efektivně shánět zásoby pro lid." # todo: NEW TRANSLATION
 culture_parameter_unlocks_ordo_riders_maa: "Může verbovat [GetMaA('ordo_riders_horse_archers').GetName] jako [Concept('men_at_arms','ozbrojenci')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 culture_parameter_reaver_gives_buffs_to_horse_archers: "[GetTrait('reaver').GetName( GetNullCharacter )] [Concept('traits','Rysy')|E] udělují posílení [Concept('archer_cavalry','jízdní lučištníci')|e] [Concept('men_at_arms','ozbrojenci')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tradition_chinese_arts_name: "Čínské umění" # todo: NEW TRANSLATION
 tradition_chinese_arts_desc: "Cesta pera, cesta štětce — všechny důležité prvky pro tuto kulturu. Místo spoléhání se pouze na vojenskou sílu nebo složitou administrativu, Číňané kladou důraz na zdokonalování forem umění." # todo: NEW TRANSLATION
 culture_parameter_commissions_cheaper: "Rozhodnutí #bold $commission_artifact_decision$#! [Concept('decision','rozhodnutí')|e] bude stát o #P 50%#! méně [gold_i] [Concept('gold','zlato')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 culture_parameter_scholars_and_poets_are_viewed_more_positively: "[GetTrait('lifestyle_poet').GetName( GetNullCharacter )] a [GetTrait('scholar').GetName( GetNullCharacter )] [Concept('traits','rysy')|E] jsou vnímány pozitivně" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tradition_sinophilic_name: "Sinofilní" # todo: NEW TRANSLATION
 tradition_sinophilic_desc: "Vliv čínské hegemonie nad tímto panstvím vedl mnoho obyvatel k přejímání zvyků od nich." # todo: NEW TRANSLATION
 culture_parameter_can_adopt_chinese_culture: "Může přijmout [GetCultureByKey('han').GetCollectiveNoun] [Concept('culture','kultura')|e]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
