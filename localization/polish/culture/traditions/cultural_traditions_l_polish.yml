 tradition_mpo_iron_cavalry_name: "Železné jezdectvo"
 tradition_mpo_iron_cavalry_desc: "Dokonce i kočovné národy mohou být poraženy jízdou oděnou od hlavy k patě do lamelové zbroje. Tato kultura si nejen osvojila zálibu v tak nákladné výzbroji, ale také využívá ty, kteří se narodili v sedle — s lukem v ruce — jako těžce obrněné jezdce."
 culture_parameter_unlock_maa_cataphract_archers: "Lze najmout [GetMaA('cataphract_archers').GetName] jako [Concept('men_at_arms','ozbrojence')|E]"
 tradition_mpo_wolves_of_the_deep_steppe_name: "Vlci hluboké stepi"
 tradition_mpo_wolves_of_the_deep_steppe_desc: "Daleko od doteku „civilizovaných“ vymožeností žijí lidé z toho, co si dokážou vzít, a sní o smrti v sedle svého koně. Slabší národy jsou před těmito bojovníky hnány na útěk."
