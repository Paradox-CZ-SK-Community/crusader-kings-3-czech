 tradition_noble_adoption_name: "Urozené osvojení"
 tradition_noble_adoption_desc: "Osvojování osiřelých dětí do urozených rodů je v této společnosti běžnou praxí. Krev smlouvy je hustší než voda lůna."
 culture_parameter_allows_adoption: "[Concept('characters','Postavy')|E] této [Concept('culture','kultury')|E] mohou nabídnout [Concept('adoption','osvojení')|E] [Concept('children','dětem')|E], které nejsou přímo spřízněny s žádnými [Concept('rulers','vládci')|E]"
 culture_parameter_free_adoption: "[Concept('characters','Postavy')|E] této [Concept('culture','kultury')|E] mohou [Concept('adopt','osvojit')|E] bez utracení [Concept('prestige','prestiže')|E] ani [Concept('dynasty_prestige','věhlasu dynastie')|E]"
 culture_parameter_wider_adoption: "[Concept('characters','Postavy')|E] této [Concept('culture','kultury')|E] mohou [Concept('adopt','osvojit')|E] nepříbuzné osiřelé [Concept('children','děti')|E] a neztratí za to [Concept('opinion','mínění')|E]"
 traditionalist_discount_desc: "[Concept('culture','Kultura')|E] byla vedena k tradicionalismu svou [Concept('culture_head','hlavou kultury')|E]"
 culture_parameter_more_hostage_acceptance: "[Concept('characters','Postavy')|E] této [Concept('culture','kultury')|E] jsou ochotnější posílat, přijímat a vracet [Concept('hostages','rukojmí')|E]"
 culture_parameter_more_hostage_acceptance_for_vassals: "[Concept('characters','Postavy')|E] této [Concept('culture','kultury')|E] jsou ochotnější posílat, přijímat a vracet [Concept('hostages','rukojmí')|E] společně se svým [Concept('liege','lenním pánem')|E]"
 tradition_ep3_indomitable_azatani_name: "Nepoddajní Azatanové"
 tradition_ep3_indomitable_azatani_desc: "Pro hrdě smýšlející šlechtice této kultury, kteří se řítí z vysokých pevností jako hromobití, platí: „Rána dýkou se zahojí, ale rána jazykem — nikdy!“"
 culture_parameter_house_hostility_more_common: "[Concept('rulers','Vládci')|E] jednají agresivněji vůči ostatním [Concept('houses','rodům')|E]"
 culture_parameter_vassals_more_likely_to_refuse_demands: "[Concept('characters','Postavy')|E] častěji odmítají [Concept('imprisonment','uvěznění')|E], [Concept('retractions','stažení nároků')|E] a [Concept('revocations','odebrání')|E]"
 tradition_ep3_audacious_cadets_name: "Smělí kadeti"
 tradition_ep3_audacious_cadets_desc: "Tato kultura je utvářena neklidnými zástupy mladších synů. Tito odvážní a bezohlední jezdci pronásledují sny o dalekých dobrodružstvích, žoldnéřské krutosti a slavné dobyvačnosti."
 culture_parameter_ambitious_trait_more_common: "Rys [GetTrait('ambitious').GetName( GetNullCharacter )] je běžnější"
 culture_parameter_reduced_bodyguard_aptitude: "Snížená [Concept('aptitude','způsobilost')|E] [GetCourtPositionType('bodyguard_court_position').GetName()]"
 tradition_ep3_imperial_tagmata_name: "Císařská tagmata"
 tradition_ep3_imperial_tagmata_desc: "Elitní, dobře obrněné pluky tvoří páteř vojenských tažení této kultury. Jejich povýšené vojsko si příliš neváží malicherných válečnických šlechticů ani bezhlavých činů osobní odvahy; místo toho ctí kázeň a posvátná jména svých jednotek. #EMP Exkoubitoi! Scholai! Hikanatoi!#!"
 domain_counties_with_stables_desc: "[Concept('culture_head','Kulturní vůdce')|E] nedrží #high 8#! [Concept('counties','hrabství')|E] s vybudovanými $building_type_stables_01$ v jedné ze svých [Concept('holdings','držav')|E]"
 tradition_ep3_roman_ceremonies_name: "Římské obřady"
 tradition_ep3_roman_ceremonies_desc: "Císaři minulosti této kultuře odkázali přetrvávající vznešenost, velkolepé obřady, úctu k císařskému úřadu... a veřejný život plný nepokojů."
 tradition_ep3_palace_politics_name: "Palácová politika"
 tradition_ep3_palace_politics_desc: "Mocní eunuchové a pochlebníci v hedvábných rouchách řídí rozsáhlý politický aparát, ohromují okázalostí, lichotí poctami a krutě kují pikle ve jménu vzestupu."
 culture_head_court_grandeur_desc: "[Concept('culture_head','Kulturní vůdce')|E] nemá [Concept('court_grandeur_level','úroveň velkoleposti dvora')|E] #high 8#! nebo vyšší"
 culture_parameter_unlock_akolouthos: "Lze jmenovat [GetCourtPositionType('akolouthos_court_position').GetName()] jako [Concept('court_position','dvorský úřad')|E], pokud byla založena Varjažská garda." 
 tradition_tgp_bushido_name: "Bušidó"
 tradition_tgp_bushido_desc: "Tato tradice, zakořeněná v odkazu cti a vojenské kázně, povyšuje pouto mezi lenním pánem a vazalem prostřednictvím činů oddanosti a udatnosti. Síla charakteru a činy čestnosti vytvářejí neotřesitelnou loajalitu a úctu."
