 tradition_tgp_bushido_name: "Bushidō" # todo: NEW TRANSLATION
 tradition_tgp_bushido_desc: "Zakotvena v odkazu cti a vojenské kázně, tato tradice povyšuje pouto mezi pánem a vazalem skrze akty pocty a odvahy. Síla charakteru a činy integrity formují neotřesitelnou loajalitu a úctu." # todo: NEW TRANSLATION
