 culture_emergence_events.0003.desc: "[culture_check_2.GetName]\n[duchy_title.GetName]\n[diverge_dummy.GetFullName]"
 culture_emergence_events.0005.t: "Romantika jazyka Romansh" # todo: NEW TRANSLATION
 culture_emergence_events.0005.desc: "Zatímco [county_scope.GetNameNoTierNoTooltip] slaví vznik [new_culture_scope.GetName], všiml jsem si, že někteří z těch #italic rustikálních#! lidí této země stále mluví dialektem, který přesně neodpovídá tomu, co jsem si myslel, že [new_culture_scope.GetNameNoTooltip] je.\n\nJeden sedlák náhodou stojí blízko cesty, když projíždím, a žvaní s někým na polích. „Ty tam!“ hřímám. „Co to sakra mluvíš za řeč?“\n\nThe [rustic_peasant.GetWomanMan] se zarazí. „Myslím,“ [rustic_peasant.GetSheHe] pomalu odpovídá v [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip], „prostě tomu říkáme #italic Romansh#!.“\n\n'Romansh,' že? Jsou tohle opravdu mí lidé?" # todo: NEW TRANSLATION
 culture_emergence_events.0005.a: "Naše jazyky musí být stejně Romansh jako naše srdce." # todo: NEW TRANSLATION
 culture_emergence_events.0005.a.tt: "[new_culture_scope.GetNameNoTooltip] bude používat #bold pouze#! Romansh jména" # todo: NEW TRANSLATION
 culture_emergence_events.0005.b: "Romansh se stane součástí mozaiky [new_culture_scope.GetName]." # todo: NEW TRANSLATION
 culture_emergence_events.0005.b.tt: "[new_culture_scope.GetNameNoTooltip] bude používat Romansh jména #bold navíc k#! svým současným jménům" # todo: NEW TRANSLATION
 culture_emergence_events.0005.c: "Tento selský jazyk pro [new_culture_scope.GetName] nemá žádnou hodnotu!" # todo: NEW TRANSLATION
 culture_emergence_events.0005.c.tt: "[new_culture_scope.GetNameNoTooltip] zůstane tak, jak je" # todo: NEW TRANSLATION
