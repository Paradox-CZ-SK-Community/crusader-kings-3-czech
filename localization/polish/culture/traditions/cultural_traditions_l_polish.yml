 culture_parameter_non_admin_close_family_non_martial_gender_knights_in_defensive_wars: "Ne-[Concept('martial','válečnictví')|E] pohlaví svobodní [Concept('close_family','blízká rodina')|E] a [Concept('spouses','choti')|E] ne-[Concept('administrative','administrativní')|E] [Concept('rulers','vládci')|E] mohou sloužit jako $knight_culture_player_plural$ v obranných [Concept('wars','válkách')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tradition_tgp_court_machinations_name: "Dvorní intriky" # todo: NEW TRANSLATION
 tradition_tgp_court_machinations_desc: "V bludištích dvorských síní drží moc eunuškové, konkubíny soupeří o přízeň a šeptání zrádných úmyslů se nese pozlacenými komnatami." # todo: NEW TRANSLATION
 tradition_tgp_art_of_war_name: "Umění války" # todo: NEW TRANSLATION
 tradition_tgp_art_of_war_desc: "Tato kultura studuje vojenskou teorii tisíc let, její generálové a maršálové mají k dispozici bohatou škálu vojenských manuálů a učebnic. Toto bohatství znalostí je doplněno hlubokým technickým porozuměním, jak vyrábět kvalitné brnění a zbraně." # todo: NEW TRANSLATION
