 recruit_terrain_specialist_decision_desc: "Našich nepřátel je bezpočet a naše armády si nemohou vždy vybrat terén, na němž se s nimi střetnou.\n\nChceme-li zvítězit na každé frontě, potřebujeme velitele, kteří dokážou obratně využít ve svůj prospěch i samotnou krajinu."
