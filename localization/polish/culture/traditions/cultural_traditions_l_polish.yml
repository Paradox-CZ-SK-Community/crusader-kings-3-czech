 REQUEST_REPUBLIC_TEXT: "Pozdravuji, můj [actor.Custom2('RelationToMeShort', SCOPE.sC('recipient'))]. Už nějaký čas je zřejmé, že nejbohatší část země, kterou spravujete, tvoří městská komunita v jejím rámci. Vyzývám vás, abyste přijal úkol dohlížet na tuto rostoucí republiku mým jménem."
