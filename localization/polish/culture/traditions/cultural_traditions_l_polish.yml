 recruit_terrain_specialist_decision_confirm: "Najmout"
 recruit_terrain_specialist_decision_tooltip: "Hledáte vysoce schopného [Concept('commander','velitele')|E] s vybraným [Concept('commander_trait','velitelským rysem')|E], aby se připojil k vašemu [Concept('court','dvoru')|E]\n\n#weak Vaše [Concept('culture_traditions','kulturní tradice')|E] ovlivňují typy velitelů, které můžete najmout#!" # todo: CONCEPT CASE
 recruit_terrain_specialist_decision_minister_tooltip: "Hledáte vysoce zručného [Concept('commander','velitele')|E] se zvolenou [Concept('commander_trait','velitelským rysem')|E], aby se připojil k vašemu [Concept('court','dvoru')|E]\n\n#weak Jako [Concept('minister','ministr')|E] můžete najmout jakýkoli typ [Concept('commander','velitel')|E]#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 recruit_winter_specialist_decision: "Najmout zimního specialistu"
 recruit_winter_specialist_decision_desc: "Můj odolný lid, [ROOT.Char.GetCulture.GetCollectiveNoun], jsou mistry chladu. Když budu potřebovat expertního velitele, který provede mé vojsko nemilosrdnou zimou, stačí poslat zprávu — není nouze o omrzlé veterány ochotné vyslyšet mé volání."
 recruit_winter_specialist_decision.tt: "Vysoce [Concept('martial','válečnictví')|E] [Concept('commander','velitel')|E] s [GetTrait('winter_soldier').GetName( GetNullCharacter )] [Concept('trait','rysem')|E] se připojí k vašemu [Concept('court','dvoru')|E]" # todo: CONCEPT CASE
 recruit_winter_specialist_decision_tooltip: "$recruit_winter_specialist_decision.tt$"
 recruit_winter_specialist_decision_confirm: "$invite_knights_decision_confirm$"
 recruit_forest_specialist_decision: "Najmout lesního specialistu"
 recruit_forest_specialist_decision_desc: "[ROOT.Char.GetCulture.GetCollectiveNoun] považují les za svůj druhý domov. Nabízí ochranu, úkryt a palivo do ohně. Pokud potřebuji někoho, kdo provede mé jednotky hlubokými a zrádnými lesy, není nouze o ochotné lovce, kteří vyslyší výzvu."
 recruit_forest_specialist_decision.tt: "Vysoce [Concept('martial','válečnictví')|E] [Concept('commander','velitel')|E] s [GetTrait('forest_fighter').GetName( GetNullCharacter )] [Concept('trait','rysem')|E] se připojí k vašemu [Concept('court','dvoru')|E]" # todo: CONCEPT CASE
 recruit_forest_specialist_decision_tooltip: "$recruit_forest_specialist_decision.tt$"
 recruit_forest_specialist_decision_confirm: "$invite_knights_decision_confirm$"
 recruit_mountain_specialist_decision: "Najmout horského specialistu"
 recruit_mountain_specialist_decision_desc: "Můj tvrdý lid, [ROOT.Char.GetCulture.GetCollectiveNoun], dokáže projít i nejobtížnějším horským průsmykem. Pokud chci přesouvat a bojovat v horách, mohu povolat zkušeného průvodce, který mé armádě pomůže najít cestu."
 recruit_mountain_specialist_decision.tt: "Vysoce [Concept('martial','válečnictví')|E] [Concept('commander','velitel')|E] s [GetTrait('rough_terrain_expert').GetName( GetNullCharacter )] [Concept('trait','rysem')|E] se připojí k vašemu [Concept('court','dvoru')|E]" # todo: CONCEPT CASE
 recruit_mountain_specialist_decision_tooltip: "$recruit_mountain_specialist_decision.tt$"
 recruit_mountain_specialist_decision_confirm: "$invite_knights_decision_confirm$"
 recruit_dry_specialist_decision: "Najmout specialistu na suchý terén"
 recruit_dry_specialist_decision_desc: "[ROOT.Char.GetCulture.GetCollectiveNoun] jsou zvyklí na pálivé slunce a putují daleko a široko pod jeho žhavým vlivem. Pokud chci přesunout své armády, aniž by hynuly v horku, měl bych požádat o jejich vedení."
 recruit_dry_specialist_decision.tt: "Vysoce [Concept('martial','válečnictví')|E] [Concept('commander','velitel')|E] s [GetTrait('desert_warrior').GetName( GetNullCharacter )] [Concept('trait','rysem')|E] se připojí k vašemu [Concept('court','dvoru')|E]" # todo: CONCEPT CASE
 recruit_dry_specialist_decision_tooltip: "$recruit_dry_specialist_decision.tt$"
 recruit_dry_specialist_decision_confirm: "$invite_knights_decision_confirm$"
 recruit_hill_specialist_decision: "Najmout specialistu na kopce"
 recruit_hill_specialist_decision_desc: "[ROOT.Char.GetCulture.GetCollectiveNoun] se cítí jako doma na kopcích a v údolích, kde pasou svá zvířata a snadno odhánějí divokou zvěř. Není nedostatek zručných pastýřů, kteří by stejně dobře dovedli vést armádu."
 recruit_hill_specialist_decision.tt: "Do vašeho [Concept('court','dvora')|E] se připojuje vysoce-[Concept('martial','válečnictví')|E] [Concept('commander','velitel')|E] s [GetTrait('rough_terrain_expert').GetName( GetNullCharacter )] [Concept('trait','rysem')|E]" # todo: CONCEPT CASE
 recruit_hill_specialist_decision_tooltip: "$recruit_hill_specialist_decision.tt$"
 recruit_hill_specialist_decision_confirm: "$invite_knights_decision_confirm$"
 recruit_jungle_specialist_decision: "Najmout specialistu na džungli"
 recruit_jungle_specialist_decision_desc: "Džungle je krutá a zrádná pro cesty — ale můj lid, [ROOT.Char.GetCulture.GetCollectiveNoun], ovládl umění jejího překonávání. Zkušení průzkumníci a vůdci jsou připraveni dovést moje síly tímto bujným, avšak smrtícím terénem."
 recruit_jungle_specialist_decision.tt: "Do vašeho [Concept('court','dvora')|E] se připojuje vysoce-[Concept('martial','válečnictví')|E] [Concept('commander','velitel')|E] s [GetTrait('jungle_stalker').GetName( GetNullCharacter )] [Concept('trait','rysem')|E]" # todo: CONCEPT CASE
 recruit_jungle_specialist_decision_tooltip: "$recruit_jungle_specialist_decision.tt$"
 recruit_jungle_specialist_decision_confirm: "$invite_knights_decision_confirm$"
 recruit_open_specialist_decision: "Najmout specialistu na pláně"
 recruit_open_specialist_decision_desc: "V moři trávy jsou manévry téměř zcela neomezené — [ROOT.Char.GetCulture.GetCollectiveNoun] ovládli umění, jak nejlépe využít tuto mobilitu. V našich vlastních řadách rychle najdeme velitele, kteří by naše síly použili k obchvatům a obklíčením."
 recruit_open_specialist_decision.tt: "Do vašeho [Concept('court','dvora')|E] se připojuje vysoce-[Concept('martial','válečnictví')|E] [Concept('commander','velitel')|E] s [GetTrait('open_terrain_expert').GetName( GetNullCharacter )] [Concept('trait','rysem')|E]" # todo: CONCEPT CASE
