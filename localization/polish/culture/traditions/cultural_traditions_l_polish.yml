 recruit_winter_specialist_decision: "Naverbovat zimního odborníka"
 recruit_winter_specialist_decision_desc: "Otužilí [ROOT.Char.GetCulture.GetCollectiveNoun] dokonale ovládají život v chladu. Budu-li potřebovat zkušeného velitele, který provede mé vojsko nelítostnou zimou, stačí rozeslat zprávu — omrzlých veteránů ochotných vyslyšet mé volání je vždy dost."
 recruit_winter_specialist_decision.tt: "K tvému [Concept('court','dvoru')|E] se připojí [Concept('commander','velitel')|E] s vysokým [Concept('martial','vojenstvím')|E] a [Concept('trait','rysem')|E] [GetTrait('winter_soldier').GetName( GetNullCharacter )]"
 recruit_winter_specialist_decision_tooltip: "$recruit_winter_specialist_decision.tt$"
 recruit_winter_specialist_decision_confirm: "$invite_knights_decision_confirm$"
 recruit_forest_specialist_decision: "Naverbovat lesního odborníka"
 recruit_forest_specialist_decision_desc: "[ROOT.Char.GetCulture.GetCollectiveNoun] považují les za svůj druhý domov. Poskytuje jim ochranu, přístřeší i palivo do krbu. Budu-li potřebovat někoho, kdo provede mé vojsko hlubokými a zrádnými lesy, vždy se najde dost ochotných lovců, kteří vyslyší mé volání."
 recruit_forest_specialist_decision.tt: "K tvému [Concept('court','dvoru')|E] se připojí [Concept('commander','velitel')|E] s vysokým [Concept('martial','vojenstvím')|E] a [Concept('trait','rysem')|E] [GetTrait('forest_fighter').GetName( GetNullCharacter )]"
 recruit_forest_specialist_decision_tooltip: "$recruit_forest_specialist_decision.tt$"
 recruit_forest_specialist_decision_confirm: "$invite_knights_decision_confirm$"
 recruit_mountain_specialist_decision: "Naverbovat horského odborníka"
 recruit_mountain_specialist_decision_desc: "Odolní [ROOT.Char.GetCulture.GetCollectiveNoun] se vyznají i v těch nejzrádnějších horských průsmycích. Budu-li chtít přesouvat své vojsko a bojovat v horách, mohu povolat zkušeného průvodce, který mé armádě pomůže najít cestu."
 recruit_mountain_specialist_decision.tt: "K tvému [Concept('court','dvoru')|E] se připojí [Concept('commander','velitel')|E] s vysokým [Concept('martial','vojenstvím')|E] a [Concept('trait','rysem')|E] [GetTrait('rough_terrain_expert').GetName( GetNullCharacter )]"
