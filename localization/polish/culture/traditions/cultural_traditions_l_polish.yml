 culture_tradition_events.0002.t: "Trénink s [GetPlayer.Custom( 'KnightCultureNoTooltip' )]: Závěr"
 culture_tradition_events.0002.desc: "Odložím zbraň a otočím se k [recipient.GetTitledFirstName], abych mu vzdal obvyklý potlesk. [recipient.GetSheHe|U] učiní totéž.\n\n"
 culture_tradition_events.0002.desc_actor_victor_good: "\"Dobře bojováno, můj [actor.GetTitleTierName|U]! Porazil jsi mě čestně a po právu.\" říká [recipient.GetFirstNameNoTooltip].\n\"Tento trénink nám jistě dobře poslouží, pokud v budoucnu [actor.GetPrimaryTitle.GetNameNoTierNoTooltip] čeká válka.\"\n\nBylo to povzbuzující, cítím se silný a připravený!"
 culture_tradition_events.0002.desc_actor_victor_bad: "\"Dobře bojováno, můj [actor.GetTitleTierName|U], byl jsem zcela poražen.\" naříká [recipient.GetFirstNameNoTooltip].\n\"Ale pamatuj, nenech se tímto vítězstvím unést. Nejsem tvůj nepřítel, oni stále číhají venku.\"\n\nPche! Cítím se naprosto v pořádku!"
 culture_tradition_events.0002.desc_recipient_victor_good: "\"Dobře bojováno, můj [actor.GetTitleTierName|U], toto kolo vyhrávám já!\" říká [recipient.GetFirstNameNoTooltip] sportovně. \"Nyní jsme připraveni čelit čemukoli!\"\n\nOpravdu jsme. Možná bych měl zvážit své další výboje?"
 culture_tradition_events.0002.desc_recipient_victor_bad: "\"Dobře bojováno, můj [actor.GetTitleTierName|U]. Mrzí mě, pokud jsem ti ublížil. Na krátký okamžik jsem byl v transu - já a moje zbraň jsme byli jedno...\" říká omluvně [recipient.GetFirstNameNoTooltip].\n\"Možná by sis měl trochu odpočinout?\"\n\nNesmysl, jsem zdravý jako řeznický pes!"
 culture_tradition_events.0002.a: "Dobrý zápas!"
 culture_tradition_events.0002.b: "Možná jsem prohrál, ale byl to dobrý trénink!"
