 culture_emergence_events.0001.t: "Kulturní prolínání"
 culture_emergence_events.0001.desc: "Moji předkové byli [ROOT.Char.GetCulture.GetCollectiveNoun], ale lidé mého hlavního sídla, [capital_county_scope.GetBaseName], jsou [hybdridization_offer_culture.GetCollectiveNoun]. V poslední době jsem si všiml, že mě mí [hybdridization_offer_culture.GetNameNoTooltip] poddaní napodobují a přejímají jejich způsoby.\n\nSpojují naše tradice. Některé jsou staré, jiné nové - ale nejdůležitější je, že lépe přijímají mou vládu!\n\nMožná bychom tento vývoj měli podpořit?"
 culture_emergence_events.0001.a: "Pokud se chovají jako já, budu se chovat jako oni. Brzy budeme jako bychom byli jedno."
 culture_emergence_events.0001.b: "Jejich obdiv mi stačí!"
