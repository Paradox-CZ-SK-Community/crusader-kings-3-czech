 recruit_jungle_specialist_decision_confirm: "$invite_knights_decision_confirm$"
 recruit_open_specialist_decision: "Naverbovat odborníka na roviny"
 recruit_open_specialist_decision_desc: "V moři trávy není pohyb téměř ničím omezen a [ROOT.Char.GetCulture.GetCollectiveNoun] dokonale ovládají využití této volnosti. V našich vlastních řadách snadno nalezneme velitele, kteří dokážou naše vojsko využít k obchvatům a obklíčení nepřítele."
 recruit_open_specialist_decision.tt: "K tvému [Concept('court','dvoru')|E] se připojí [Concept('commander','velitel')|E] s vysokým [Concept('martial','vojenstvím')|E] a [Concept('trait','rysem')|E] [GetTrait('open_terrain_expert').GetName( GetNullCharacter )]"
