 doctrine_parameter_chance_to_gain_prowess_during_bear_hunts: "Zabití #V medvěda#! během [GetActivityType('activity_hunt').GetName] dává [prowess_i][Concept('prowess','udatnosti')|e] a [martial_i][Concept('martial','válečnictví')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
