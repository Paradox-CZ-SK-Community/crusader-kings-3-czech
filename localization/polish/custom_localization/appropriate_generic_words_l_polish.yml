 ABALONE_GLOSS: "Ceněný mořský měkkýš s pevným, masitým tělem."
 SEA_CUCUMBER_GLOSS: "Měkký mořský živočich připravovaný jako lahůdka v čínské vysoké kuchyni."
 SWALLOW_NEST_GLOSS: "Vzácné ptačí hnízdo rozpouštěné v přepychové polévce."
 ENTREMETS_GLOSS: "Propracovaný sladký pokrm či překvapivá lahůdka podávaná mezi chody."
 MOCHI_GLOSS: "Pružný koláček z utlučené lepkavé rýže."
 DURIAN_GLOSS: "Velký tropický plod proslulý silným pachem a bohatou dužinou připomínající krém."
 AQUA_VITAE_GLOSS: "Silný destilát ceněný jako léčivý nápoj."
 TRIBUTE_CHILLED_TEA_GLOSS: "Jemný čaj chlazený ledem nebo sněhem a zasílaný jako dar ke dvoru."
 EMPEROR_TEA_GLOSS: "Nejjemnější lístky císařského čaje vyhrazené dvoru."
 BAIJIU_GLOSS: "Silná čínská pálenka destilovaná z obilí."
 HANAKUSA_GLOSS: "Japonský bylinný nálev ze směsi květů a listů."
 PEARL_POWDER_GLOSS: "Rozemleté perly používané jako nákladný posilující prostředek."
 CHRYSANTHEMUM_BEER_GLOSS: "Lehký kvašený nápoj ochucený chryzantémou."
 SHARBAT_GLOSS: "Slazený ovocný nápoj, často chlazený a kořeněný."
 SAMBUSA_GLOSS: "Smažené pečivo plněné kořeněným masem či zeleninou."
 PAKHALA_GLOSS: "Osvěžující pokrm z kvašené rýžové vody pocházející z východní Indie."
 PILAU_GLOSS: "Ochucená rýže vařená s kořením a masem či zeleninou."
 PASTILLA_GLOSS: "Maghrebský koláč z kořeněného masa zabaleného do tenkého těsta."
 BOTUO_GLOSS: "Čínská hustá polévka s pšeničnými knedlíčky nebo nudlemi."
 SPHOUNGATA_GLOSS: "Omeleta z rozšlehaných vajec připravovaná po byzantském způsobu."
 TARICHOS_GLOSS: "Solená a sušená ryba, základ byzantské stravy."
 BING_GLOSS: "Čínský plochý chléb či placka pečená na plotně."
 MANTOU_GLOSS: "Měkký čínský pšeničný bochánek vařený v páře."
 ZOSUI_GLOSS: "Japonská rýžová kaše vařená ve vývaru."
 KIMCHI_GLOSS: "Korejská zelenina kvašená se solí a kořením."
 BUBUR_GLOSS: "Rýžová kaše z Malajského souostroví."
 PIZZA_GLOSS: "Plochý kulatý chléb z jižní Itálie, připravovaný dávno předtím, než se z Ameriky dostala rajčata. Podle nájemní smlouvy z Gaety z roku 997 dlužil nájemce biskupovi dvanáct kusů o Vánocích a dvanáct o Velikonocích." # todo: NEW TRANSLATION
 IDLI_GLOSS: "Malý koláček z těsta z černé fazole mungo z jižní Indie. Kannadská kniha příběhů z doby kolem roku 920 jej již zmiňuje pod názvem iddalige." # todo: NEW TRANSLATION
 OUBLIE_GLOSS: "Tenká oplatka pečená mezi rozžhavenými železy a stočená do ruličky. Paříž měla cech pekařů oublie již v 60. letech 13. století a ti v noci vyvolávali svou nabídku v ulicích." # todo: NEW TRANSLATION
 BLIN_GLOSS: "Tenká palačinka podávaná horká přímo z plotny, připravovaná po hromadách na slavnost před začátkem postu." # todo: NEW TRANSLATION
 OBWARZANEK_GLOSS: "Kruh z těsta, který se nejprve vaří a poté peče a prodává navlečený na provázcích. V Krakově jim říkají obwarzanki a královský dvůr je kupoval už v roce 1394." # todo: NEW TRANSLATION
 POGACA_GLOSS: "Kulatý plochý chléb pečený v popelu ohniště. Jeho název pochází z latinského focacia, tedy chléb z ohniště." # todo: NEW TRANSLATION
 FUL_GLOSS: "Bob obecný dlouho a zvolna vařený; každodenní jídlo egyptských měšťanů." # todo: NEW TRANSLATION
 INJERA_GLOSS: "Široký, nadýchaný plochý chléb z kvašeného teffu, který slouží zároveň jako talíř i lžíce." # todo: NEW TRANSLATION
 NAREZUSHI_GLOSS: "Ryby naložené v rýži se solí a ponechané několik měsíců, aby zkvasily. Rýže se seškrábala a jedly se pouze ryby." # todo: NEW TRANSLATION
 AKARA_GLOSS: "Mleté černooké fazole smažené v palmovém oleji." # todo: NEW TRANSLATION
 FURA_GLOSS: "Jáhlové těsto vařené v páře, vytvarované do kuliček a vmíchané do zkyslého mléka." # todo: NEW TRANSLATION
 TSAMPA_GLOSS: "Pražená ječná mouka zadělaná máslem na těsto, které se jí prsty." # todo: NEW TRANSLATION
 AARUUL_GLOSS: "Tvaroh sušený na slunci dotuha a nošený s sebou na každou cestu. Vilém z Rubruku se s ním setkal u Mongolů v roce 1253." # todo: NEW TRANSLATION
