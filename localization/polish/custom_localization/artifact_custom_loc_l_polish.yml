 damage_artifact_fallback: "poškodit"
 marco_polo_quote_intro_1: "Uslyšíš to na vlastní uši a jistě tě to naplní úžasem."
 marco_polo_quote_intro_2: "Svět je nesmírná tapisérie utkaná z vláken rozličných kultur a tradic."
 marco_polo_quote_desc_1: "Chodíme nazí, protože od tohoto světa nic nechceme. Nazí a neodění jsme totiž na svět přišli. A pokud jde o to, že se nestydíme odhalovat své údy, pravdou je, že jimi nehřešíme, a proto se za ně nestydíme o nic více než vy, když ukazujete ruku, tvář či jiné části těla, které vás nesvádějí k tělesnému hříchu. Vy však svými údy hřešíte a smilníte, a proto je zakrýváte a stydíte se za ně. My se za jejich odhalování nestydíme o nic více než za ukazování prstů, neboť jimi nehřešíme."
 marco_polo_quote_desc_2: "Ujišťuji tě, že ženy nakupují, prodávají a obstarávají vše potřebné pro své manžely a domácnosti. Muži se totiž nestarají o nic kromě lovu, válčení a sokolnictví. Živí se masem, mlékem, zvěřinou a krysami, kterých je všude hojnost."
 marco_polo_quote_desc_3: "Jsou to zdatní bojovníci, kteří vynikají odvahou a odolností. Vysvětlím ti, jak je možné, že vydrží více než všichni ostatní lidé. Je-li třeba, často putují nebo zůstávají na místě celý měsíc bez zásob, pijí pouze kobylí mléko a jedí zvěřinu, kterou sami uloví."
 marco_polo_quote_desc_4: "Existuje zde ještě jeden podivný zvyk, který jsem zapomněl popsat. Věz, že pokud dvěma mužům zemřou děti, jednomu syn ve věku čtyř či kolika let a druhému dcera, která rovněž zemřela, sjednají mezi nimi sňatek."
 marco_polo_quote_desc_5: "Jsou tam jistá veliká a hluboká údolí, na jejichž dno není přístupu. Muži, kteří se vydávají hledat diamanty, si proto berou kusy co nejlibovějšího masa a házejí je na dno údolí. Když orli spatří shozené maso, vrhnou se na ně a odnesou je na některý skalnatý vrcholek. Lidé pak přicházejí k hnízdům těchto bílých orlů, kterých je tam mnoho, a v jejich trusu nacházejí spoustu diamantů, jež ptáci pozřeli spolu s masem vhozeným do údolí."
 marco_polo_quote_desc_6: "Je tam pramen oleje, z něhož vytéká takové množství, že by jím bylo možné naložit mnoho velbloudů. Nepoužívá se k jídlu, nýbrž jako mast k léčení kožních neduhů lidí i dobytka a rovněž dalších chorob. Hodí se také k pálení. V okolní krajině se v lampách nepoužívá žádný jiný olej a lidé si pro něj přicházejí z dalekých končin."
 marco_polo_quote_desc_7: "Ptáš-li se, jak může obyvatelstvo této země poskytovat dostatečný počet lidí k plnění těchto povinností a jak je lze všechny uživit, odpovím, že všichni modloslužebníci mají podle svých poměrů šest, osm či deset žen, s nimiž zplodí ohromné množství dětí. Někteří mají až třicet synů schopných následovat své otce do zbraně."
 marco_polo_quote_end_1: "Mluvím a mluvím, avšak posluchač si uchová jen slova, která očekává. Příběhu nevládne hlas, nýbrž sluch."
 marco_polo_quote_end_2: "Ať bych ti to vyprávěl jakkoli, nikdy bys neuvěřil, že se držím pravdy a rozumu."
