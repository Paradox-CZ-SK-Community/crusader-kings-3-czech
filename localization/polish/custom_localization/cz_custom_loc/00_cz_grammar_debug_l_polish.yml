 cz_grammar_debug.0008.t: "Manual Rich Adjective Test"

 cz_grammar_debug.0008.desc: "V posledních týdnech se na mém dvoře stále častěji vede spor o to, jakou podobu by měla mít budoucnost mé země.\n\n#bold Rich / Tooltip#!\nJedni tvrdí, že musíme především chránit [ROOT.Char.GetCulture.Custom('CZ_Adjective_ee')] tradice a vše, co po generace utvářelo náš lid. Druzí namítají, že časy se mění a že i [ROOT.Char.GetPrimaryTitle.Custom('CZ_Adjective_ee')] země se musí přizpůsobit novým poměrům. Duchovní mi připomínají, že [CZReligionAdjDecline(ROOT.Char.GetFaith.GetReligion,'é')] učení je základem řádu, avšak právě [CZFaithAdjDecline(ROOT.Char.GetFaith,'é')] zásady určují, jak má správný věřící skutečně žít. Někteří dokonce tvrdí, že obrana [CZFaithAdjDecline(ROOT.Char.GetFaith,'ého')] učení je důležitější než zachování odkazu [CZReligionAdjDecline(ROOT.Char.GetFaith.GetReligion,'ého')] náboženství.\n\n#bold NoTooltip#!\nStejný spor lze popsat i bez tooltipové vrstvy: [ROOT.Char.GetCulture.Custom('CZ_AdjectiveNoTooltip_ee')] tradice, [ROOT.Char.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_ee')] země, [ROOT.Char.GetFaith.GetReligion.Custom('CZ_AdjectiveNoTooltip_ee')] učení a [ROOT.Char.GetFaith.Custom('CZ_AdjectiveNoTooltip_ee')] zásady. Obrana [ROOT.Char.GetFaith.Custom('CZ_AdjectiveNoTooltip_eeho')] učení může stát proti odkazu [ROOT.Char.GetFaith.GetReligion.Custom('CZ_AdjectiveNoTooltip_eeho')] náboženství.\n\n#bold Přímé porovnání#!\nKultura: [ROOT.Char.GetCulture.Custom('CZ_Adjective_ee')] / [ROOT.Char.GetCulture.Custom('CZ_AdjectiveNoTooltip_ee')]\nTitul: [ROOT.Char.GetPrimaryTitle.Custom('CZ_Adjective_ee')] / [ROOT.Char.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_ee')]\nVíra: [CZFaithAdjDecline(ROOT.Char.GetFaith,'é')] / [ROOT.Char.GetFaith.Custom('CZ_AdjectiveNoTooltip_ee')]\nNáboženství: [CZReligionAdjDecline(ROOT.Char.GetFaith.GetReligion,'é')] / [ROOT.Char.GetFaith.GetReligion.Custom('CZ_AdjectiveNoTooltip_ee')]"

 cz_grammar_debug.0008.a: "Zavřít"


