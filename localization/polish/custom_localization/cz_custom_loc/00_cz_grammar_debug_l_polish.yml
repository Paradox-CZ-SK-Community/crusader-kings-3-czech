andCase_I('Kanárské ostrovy')]\n\n4. VĚTY (rich, s tooltipem)\nVálka o [GetTitleByKey('k_bohemia').Custom('CZ_LandedName_A')] skončila.\nŽije [CZPrepV(GetTitleByKey('k_bohemia').GetNameNoTierNoTooltip)] [GetTitleByKey('k_bohemia').Custom('CZ_LandedNameNoTier_L')] a obchoduje [CZPrepS(GetTitleByKey('k_poland').GetNameNoTierNoTooltip)] [GetTitleByKey('k_poland').Custom('CZ_LandedNameNoTier_I')].\nVyslanci [CZPrepZ(GetTitleByKey('e_hre').GetNameNoTooltip)] [GetTitleByKey('e_hre').Custom('CZ_LandedName_G')] přijeli [CZPrepK(ROOT.Char.GetPrimaryTitle.GetNameNoTooltip)] [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedName_D')].\nSpojenectví [CZPrepS(ROOT.Char.GetPrimaryTitle.GetNameNoTooltip)] [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedName_I')] trvá.\n\n5. ROZKLAD RICH ŘETĚZCE\nk_bohemia GetName: [Select_CString(CZLandRichOK(GetTitleByKey('k_bohemia').GetName,GetTitleByKey('k_bohemia').GetNameNoTooltip),'tooltip OK','BEZ TOOLTIPU')] | GetNameNoTier: [Select_CString(CZLandRichOK(GetTitleByKey('k_bohemia').GetNameNoTier,GetTitleByKey('k_bohemia').GetNameNoTierNoTooltip),'tooltip OK','BEZ TOOLTIPU')]\nk_poland GetName: [Select_CString(CZLandRichOK(GetTitleByKey('k_poland').GetName,GetTitleByKey('k_poland').GetNameNoTooltip),'tooltip OK','BEZ TOOLTIPU')] | GetNameNoTier: [Select_CString(CZLandRichOK(GetTitleByKey('k_poland').GetNameNoTier,GetTitleByKey('k_poland').GetNameNoTierNoTooltip),'tooltip OK','BEZ TOOLTIPU')]\ne_hre GetName: [Select_CString(CZLandRichOK(GetTitleByKey('e_hre').GetName,GetTitleByKey('e_hre').GetNameNoTooltip),'tooltip OK','BEZ TOOLTIPU')] | GetNameNoTier: [Select_CString(CZLandRichOK(GetTitleByKey('e_hre').GetNameNoTier,GetTitleByKey('e_hre').GetNameNoTierNoTooltip),'tooltip OK','BEZ TOOLTIPU')]\nk_venice GetName: [Select_CString(CZLandRichOK(GetTitleByKey('k_venice').GetName,GetTitleByKey('k_venice').GetNameNoTooltip),'tooltip OK','BEZ TOOLTIPU')] | GetNameNoTier: [Select_CString(CZLandRichOK(GetTitleByKey('k_venice').GetNameNoTier,GetTitleByKey('k_venice').GetNameNoTierNoTooltip),'tooltip OK','BEZ TOOLTIPU')]\nPrimární titul GetName: [Select_CString(CZLandRichOK(ROOT.Char.GetPrimaryTitle.GetName,ROOT.Char.GetPrimaryTitle.GetNameNoTooltip),'tooltip OK','BEZ TOOLTIPU')] | GetNameNoTier: [Select_CString(CZLandRichOK(ROOT.Char.GetPrimaryTitle.GetNameNoTier,ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip),'tooltip OK','BEZ TOOLTIPU')]\n\n6. PŘEDLOŽKY\nk_sweden: [CZPrepV(GetTitleByKey('k_sweden').GetNameNoTierNoTooltip)] [GetTitleByKey('k_sweden').Custom('CZ_LandedNameNoTier_L')] | [CZPrepZ(GetTitleByKey('k_sweden').GetNameNoTierNoTooltip)] [GetTitleByKey('k_sweden').Custom('CZ_LandedNameNoTier_G')] | [CZPrepS(GetTitleByKey('k_sweden').GetNameNoTierNoTooltip)] [GetTitleByKey('k_sweden').Custom('CZ_LandedNameNoTier_I')] | [CZPrepK(GetTitleByKey('k_sweden').GetNameNoTierNoTooltip)] [GetTitleByKey('k_sweden').Custom('CZ_LandedNameNoTier_D')]\nk_scotland: [CZPrepV(GetTitleByKey('k_scotland').GetNameNoTierNoTooltip)] [GetTitleByKey('k_scotland').Custom('CZ_LandedNameNoTier_L')] | [CZPrepZ(GetTitleByKey('k_scotland').GetNameNoTierNoTooltip)] [GetTitleByKey('k_scotland').Custom('CZ_LandedNameNoTier_G')] | [CZPrepS(GetTitleByKey('k_scotland').GetNameNoTierNoTooltip)] [GetTitleByKey('k_scotland').Custom('CZ_LandedNameNoTier_I')] | [CZPrepK(GetTitleByKey('k_scotland').GetNameNoTierNoTooltip)] [GetTitleByKey('k_scotland').Custom('CZ_LandedNameNoTier_D')]\nk_saxony: [CZPrepV(GetTitleByKey('k_saxony').GetNameNoTierNoTooltip)] [GetTitleByKey('k_saxony').Custom('CZ_LandedNameNoTier_L')] | [CZPrepZ(GetTitleByKey('k_saxony').GetNameNoTierNoTooltip)] [GetTitleByKey('k_saxony').Custom('CZ_LandedNameNoTier_G')] | [CZPrepS(GetTitleByKey('k_saxony').GetNameNoTierNoTooltip)] [GetTitleByKey('k_saxony').Custom('CZ_LandedNameNoTier_I')] | [CZPrepK(GetTitleByKey('k_saxony').GetNameNoTierNoTooltip)] [GetTitleByKey('k_saxony').Custom('CZ_LandedNameNoTier_D')]\nk_poland: [CZPrepV(GetTitleByKey('k_poland').GetNameNoTierNoTooltip)] [GetTitleByKey('k_