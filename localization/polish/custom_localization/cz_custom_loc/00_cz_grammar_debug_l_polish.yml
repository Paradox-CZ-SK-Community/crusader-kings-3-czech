 cz_grammar_debug.0018.a: "Zavřít"
 cz_grammar_debug.0019.t: "Lokál: v/ve + titul / provincie"
 cz_grammar_debug.0019.desc: "1. PROVINCIE (tooltip musí fungovat)\nHlavní město: [CZPrepV(ROOT.Char.GetCapitalLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetCapitalLocation,'L')]\nBez tooltipu: [CZPrepV(ROOT.Char.GetCapitalLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(ROOT.Char.GetCapitalLocation,'L')]\nNativně: v [ROOT.Char.GetCapitalLocation.GetName]\nAktuální poloha: [CZPrepV(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetCurrentLocation,'L')]\n\n2. TITULY\nPrimární titul: [CZPrepV(ROOT.Char.GetPrimaryTitle.GetNameNoTooltip)] [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedName_L')]\nBez tieru: [CZPrepV(ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip)] [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_L')]\n\n3. PŘEDLOŽKY (očekáváno: ve Švédsku, ve Francii, v Praze, v Čechách)\n[CZPrepV(GetTitleByKey('k_sweden').GetNameNoTierNoTooltip)] [GetTitleByKey('k_sweden').Custom('CZ_LandedNameNoTier_L')], [CZPrepV(GetTitleByKey('k_france').GetNameNoTierNoTooltip)] [GetTitleByKey('k_france').Custom('CZ_LandedNameNoTier_L')], [CZPrepV(GetTitleByKey('c_praha').GetNameNoTierNoTooltip)] [GetTitleByKey('c_praha').Custom('CZ_LandedNameNoTier_L')], [CZPrepV(GetTitleByKey('k_bohemia').GetNameNoTierNoTooltip)] [GetTitleByKey('k_bohemia').Custom('CZ_LandedNameNoTier_L')]\n\n4. GENITIV z/ze (očekáváno: ze Švédska, z Francie, z Prahy, z Čech)\n[CZPrepZ(GetTitleByKey('k_sweden').GetNameNoTierNoTooltip)] [GetTitleByKey('k_sweden').Custom('CZ_LandedNameNoTier_G')], [CZPrepZ(GetTitleByKey('k_france').GetNameNoTierNoTooltip)] [GetTitleByKey('k_france').Custom('CZ_LandedNameNoTier_G')], [CZPrepZ(GetTitleByKey('c_praha').GetNameNoTierNoTooltip)] [GetTitleByKey('c_praha').Custom('CZ_LandedNameNoTier_G')], [CZPrepZ(GetTitleByKey('k_bohemia').GetNameNoTierNoTooltip)] [GetTitleByKey('k_bohemia').Custom('CZ_LandedNameNoTier_G')]\nProvincie: [CZPrepZ(ROOT.Char.GetCapitalLocation.GetNameNoTooltip)|U] [CZProvName(ROOT.Char.GetCapitalLocation,'G')]\n\n5. DATIV k/ke (očekáváno: ke Švédsku, k Francii, ke Kastilii)\n[CZPrepK(GetTitleByKey('k_sweden').GetNameNoTierNoTooltip)] [GetTitleByKey('k_sweden').Custom('CZ_LandedNameNoTier_D')], [CZPrepK(GetTitleByKey('k_france').GetNameNoTierNoTooltip)] [GetTitleByKey('k_france').Custom('CZ_LandedNameNoTier_D')], [CZPrepK(GetTitleByKey('k_castille').GetNameNoTierNoTooltip)] [GetTitleByKey('k_castille').Custom('CZ_LandedNameNoTier_D')]\n6. INSTRUMENTÁL s/se (očekáváno: se Švédskem, s Francií, s Čechami)\n[CZPrepS(GetTitleByKey('k_sweden').GetNameNoTierNoTooltip)] [GetTitleByKey('k_sweden').Custom('CZ_LandedNameNoTier_I')], [CZPrepS(GetTitleByKey('k_france').GetNameNoTierNoTooltip)] [GetTitleByKey('k_france').Custom('CZ_LandedNameNoTier_I')], [CZPrepS(GetTitleByKey('k_bohemia').GetNameNoTierNoTooltip)] [GetTitleByKey('k_bohemia').Custom('CZ_LandedNameNoTier_I')]\n7. AKUZATIV pro/přes (očekáváno: pro Prahu, přes Čechy)\npro [GetTitleByKey('c_praha').Custom('CZ_LandedNameNoTier_A')], přes [GetTitleByKey('k_bohemia').Custom('CZ_LandedNameNoTier_A')]"
