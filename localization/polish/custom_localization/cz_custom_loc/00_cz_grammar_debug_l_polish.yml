T.Char.Custom('CZ_UINameNotMeNoTooltip_A')]<\n\n5. VOKATIV\nShortNotMeNT: >[ROOT.Char.Custom('CZ_ShortUINameNotMeNoTooltip_V')]<\nTitledNT: >[ROOT.Char.Custom('CZ_TitledFirstNameNoTooltip_V')]<\nTitledRegnalNT: >[ROOT.Char.Custom('CZ_TitledFirstNameNoTooltipRegnal_V')]<\nTitledRegnalTT: >[ROOT.Char.Custom('CZ_TitledFirstNameRegnal_V')]<\nFullNameNT: >[ROOT.Char.Custom('CZ_FullNameNoTooltip_V')]<\nFullNameTT: >[ROOT.Char.Custom('CZ_FullName_V')]<\nUINameNotMeNT: >[ROOT.Char.Custom('CZ_UINameNotMeNoTooltip_V')]<\n\n6. LOKÁL\nShortNotMeNT: >[ROOT.Char.Custom('CZ_ShortUINameNotMeNoTooltip_L')]<\nTitledNT: >[ROOT.Char.Custom('CZ_TitledFirstNameNoTooltip_L')]<\nTitledRegnalNT: >[ROOT.Char.Custom('CZ_TitledFirstNameNoTooltipRegnal_L')]<\nTitledRegnalTT: >[ROOT.Char.Custom('CZ_TitledFirstNameRegnal_L')]<\nFullNameNT: >[ROOT.Char.Custom('CZ_FullNameNoTooltip_L')]<\nFullNameTT: >[ROOT.Char.Custom('CZ_FullName_L')]<\nUINameNotMeNT: >[ROOT.Char.Custom('CZ_UINameNotMeNoTooltip_L')]<\n\n7. INSTRUMENTÁL\nShortNotMeNT: >[ROOT.Char.Custom('CZ_ShortUINameNotMeNoTooltip_I')]<\nTitledNT: >[ROOT.Char.Custom('CZ_TitledFirstNameNoTooltip_I')]<\nTitledRegnalNT: >[ROOT.Char.Custom('CZ_TitledFirstNameNoTooltipRegnal_I')]<\nTitledRegnalTT: >[ROOT.Char.Custom('CZ_TitledFirstNameRegnal_I')]<\nFullNameNT: >[ROOT.Char.Custom('CZ_FullNameNoTooltip_I')]<\nFullNameTT: >[ROOT.Char.Custom('CZ_FullName_I')]<\nUINameNotMeNT: >[ROOT.Char.Custom('CZ_UINameNotMeNoTooltip_I')]<"
