 cz_grammar_debug.0007.a: "Zavřít"


 cz_grammar_debug.0008.t: "Manual Rich Adjective Test"

 cz_grammar_debug.0008.desc: "V posledních týdnech se na mém dvoře stále častěji vede spor o to, jakou podobu by měla mít budoucnost mé země. Jedni tvrdí, že musíme především chránit [ROOT.Char.GetCulture.Custom('CZ_TEST_CultureAdjectiveRich_ee')] tradice a vše, co po generace utvářelo náš lid. Druzí namítají, že časy se mění a že i [ROOT.Char.GetPrimaryTitle.Custom('CZ_TEST_TitleAdjectiveRich_ee')] země se musí přizpůsobit novým poměrům.\n\nDo sporu se nyní vložili také duchovní. Připomínají mi, že [CZReligionAdjDecline(ROOT.Char.GetFaith.GetReligion,'é')] učení je základem řádu, na němž naše společnost stojí, avšak právě [CZFaithAdjDecline(ROOT.Char.GetFaith,'é')] zásady určují, jak má správný věřící skutečně žít. Někteří z nich dokonce tvrdí, že obrana [CZFaithAdjDecline(ROOT.Char.GetFaith,'ého')] učení je důležitější než zachování každého starého zvyku.\n\nKdyž naslouchám jejich slovům, uvědomuji si, že žádná z těchto otázek nestojí sama. [ROOT.Char.GetCulture.Custom('CZ_TEST_CultureAdjectiveRich_ee')] dědictví, [ROOT.Char.GetPrimaryTitle.Custom('CZ_TEST_TitleAdjectiveRich_ee')] země, odkaz [CZReligionAdjDecline(ROOT.Char.GetFaith.GetReligion,'ého')] náboženství i požadavky [CZFaithAdjDecline(ROOT.Char.GetFaith,'ého')] učení jsou součástí jediného celku — a bude na mně rozhodnout, které z nich mají dostat přednost."

 cz_grammar_debug.0008.a: "Zavřít"

