 cz_grammar_debug.0200.t: "Textová tabulka genitivů (CZ_TG_*)"
 cz_grammar_debug.0200.desc: "1. KLÍČ (CZTextKey) → CZLandTextFastG\nPolsko: >[CZTextKey('Polsko')]< → >[CZLandTextFastG('Polsko')]<\nČechy: >[CZTextKey('Čechy')]< → >[CZLandTextFastG('Čechy')]<\nHradec Králové: >[CZTextKey('Hradec Králové')]< → >[CZLandTextFastG('Hradec Králové')]<\nSvatá říše římská: >[CZTextKey('Svatá říše římská')]< → >[CZLandTextFastG('Svatá říše římská')]<\nKyjevská Rus: >[CZTextKey('Kyjevská Rus')]< → >[CZLandTextFastG('Kyjevská Rus')]<\nHorní Bavorsko: >[CZTextKey('Horní Bavorsko')]< → >[CZLandTextFastG('Horní Bavorsko')]<\nGaskoňská kopí: >[CZTextKey('Gaskoňská kopí')]< → >[CZLandTextFastG('Gaskoňská kopí')]<\nBarabinská step: >[CZTextKey('Barabinská step')]< → >[CZLandTextFastG('Barabinská step')]<\nOghuzové: >[CZTextKey('Oghuzové')]< → >[CZLandTextFastG('Oghuzové')]<\nKumáni: >[CZTextKey('Kumáni')]< → >[CZLandTextFastG('Kumáni')]<\nČeši: >[CZTextKey('Češi')]< → >[CZLandTextFastG('Češi')]<\nMaďaři: >[CZTextKey('Maďaři')]< → >[CZLandTextFastG('Maďaři')]<\nStaří Maďaři: >[CZTextKey('Staří Maďaři')]< → >[CZLandTextFastG('Staří Maďaři')]<\nDejr Allá: >[CZTextKey('Dejr Allá')]< → >[CZLandTextFastG('Dejr Allá')]<\nRod Přemyslovců: >[CZTextKey('Rod Přemyslovců')]< → >[CZLandTextFastG('Rod Přemyslovců')]<\nRegionální mandejský ritus navíc: >[CZTextKey('Regionální mandejský ritus navíc')]< → >[CZLandTextFastG('Regionální mandejský ritus navíc')]<\nXyzzy: >[CZTextKey('Xyzzy')]< → >[CZLandTextFastG('Xyzzy')]<\n\n2. PRIMÁRNÍ TITUL\n[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] → fast: [CZLandTextFastG(ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip)] | pravidla: [CZLandTextG(ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip)]\n\n4. TITULY PANOVNÍKŮ (CZ_TN_*)\nVelký kancléř G: >[Localize('CZ_TN_G_M_Velký_kancléř')]< | Nejvyšší věštec I: >[Localize('CZ_TN_I_M_Nejvyšší_věštec')]< | Velký generální protektor D: >[Localize('CZ_TN_D_M_Velký_generální_protektor')]<\nRoot titul: [ROOT.Char.GetTitleAsNameNoTooltip] → G: [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')] | I: [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_I')]\nShortUIName G: [ROOT.Char.Custom('CZ_ShortUIName_G')]\n\n5. RICH (tooltip musí fungovat)\nPrimární titul G: [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedName_G')] | NoTier L: [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_L')] | Hlavní město G: [CZProvName(ROOT.Char.GetCapitalLocation,'G')]\n\n3. JMÉNO POSTAVY\nGetFullName: [ROOT.Char.GetFullName]\nGetNameNoTooltip: [ROOT.Char.GetNameNoTooltip]\n\n6. AKTIVITY\nBěhem [CZActivity('activity_hunt','G')] | Zahájíš [CZActivity('activity_feast','A')] | na [CZActivity('activity_wedding','L')] | s [CZActivity('activity_tournament','I')] | k [CZActivity('activity_pilgrimage','D')]\nBez tooltipu: během [CZActivityNoTooltip('activity_hunt','G')] | na [CZActivityNoTooltip('activity_feast','L')]\nText: [CZActivityText(GetActivityType('activity_tour').GetNameNoTooltip,'G')] | [CZActivityText(GetActivityType('activity_imperial_examination').GetNameNoTooltip,'I')]\nNativní: [GetActivityType('activity_hunt').GetName] | NoTooltip: [GetActivityType('activity_hunt').GetNameNoTooltip]"
