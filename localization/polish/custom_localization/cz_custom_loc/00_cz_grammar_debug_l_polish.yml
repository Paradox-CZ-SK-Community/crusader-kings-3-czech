 cz_grammar_debug.0003.t: "Adjective scope and title grammar test"
 cz_grammar_debug.0003.desc: "1. ADJECTIVE SCOPE\nCulture: [ROOT.Char.GetCulture.Custom('CZ_Adjective_sti')]\nFaith: [CZFaithAdjSti(ROOT.Char.GetFaith)]\nReligion: [CZReligionAdjSti(ROOT.Char.GetFaith.GetReligion)]\nTitle: [ROOT.Char.GetPrimaryTitle.Custom('CZ_Adjective_sti')]\n\n2. TITLE TOKENIZER TEST\nRaw: Velký generální protektor\nW1: >[CZTitleWord1('Velký generální protektor')]<\nW2: >[CZTitleWord2('Velký generální protektor')]<\nW3: >[CZTitleWord3('Velký generální protektor')]<\nHasSecond: [CZTitleHasSecond('Velký generální protektor')]\nHasThird: [CZTitleHasThird('Velký generální protektor')]\n\n3. MALE - Kaiser\nG: [CZTitleCase_G_M('Kaiser')]\nD: [CZTitleCase_D_M('Kaiser')]\nA: [CZTitleCase_A_M('Kaiser')]\nV: [CZTitleCase_V_M('Kaiser')]\nL: [CZTitleCase_L_M('Kaiser')]\nI: [CZTitleCase_I_M('Kaiser')]\n\n4. MALE - Král\nG: [CZTitleCase_G_M('Král')]\nD: [CZTitleCase_D_M('Král')]\nA: [CZTitleCase_A_M('Král')]\nV: [CZTitleCase_V_M('Král')]\nL: [CZTitleCase_L_M('Král')]\nI: [CZTitleCase_I_M('Král')]\n\n5. MALE - Vévoda\nG: [CZTitleCase_G_M('Vévoda')]\nD: [CZTitleCase_D_M('Vévoda')]\nA: [CZTitleCase_A_M('Vévoda')]\nV: [CZTitleCase_V_M('Vévoda')]\nL: [CZTitleCase_L_M('Vévoda')]\nI: [CZTitleCase_I_M('Vévoda')]\n\n6. MALE - Velký generální protektor\nG: [CZTitleCase_G_M('Velký generální protektor')]\nD: [CZTitleCase_D_M('Velký generální protektor')]\nA: [CZTitleCase_A_M('Velký generální protektor')]\nV: [CZTitleCase_V_M('Velký generální protektor')]\nL: [CZTitleCase_L_M('Velký generální protektor')]\nI: [CZTitleCase_I_M('Velký generální protektor')]\n\n7. FEMALE - Královna\nG: [CZTitleCase_G_F('Královna')]\nD: [CZTitleCase_D_F('Královna')]\nA: [CZTitleCase_A_F('Královna')]\nV: [CZTitleCase_V_F('Královna')]\nL: [CZTitleCase_L_F('Královna')]\nI: [CZTitleCase_I_F('Královna')]\n\n8. FEMALE - Baronka\nG: [CZTitleCase_G_F('Baronka')]\nD: [CZTitleCase_D_F('Baronka')]\nA: [CZTitleCase_A_F('Baronka')]\nV: [CZTitleCase_V_F('Baronka')]\nL: [CZTitleCase_L_F('Baronka')]\nI: [CZTitleCase_I_F('Baronka')]\n\n9. FEMALE - Vévodkyně\nG: [CZTitleCase_G_F('Vévodkyně')]\nD: [CZTitleCase_D_F('Vévodkyně')]\nA: [CZTitleCase_A_F('Vévodkyně')]\nV: [CZTitleCase_V_F('Vévodkyně')]\nL: [CZTitleCase_L_F('Vévodkyně')]\nI: [CZTitleCase_I_F('Vévodkyně')]\n\n10. FEMALE - Černokněžná královna\nG: [CZTitleCase_G_F('Černokněžná královna')]\nD: [CZTitleCase_D_F('Černokněžná královna')]\nA: [CZTitleCase_A_F('Černokněžná královna')]\nV: [CZTitleCase_V_F('Černokněžná královna')]\nL: [CZTitleCase_L_F('Černokněžná královna')]\nI: [CZTitleCase_I_F('Černokněžná královna')]\n\n11. LIVE ROOT TITLE\nRaw: [ROOT.Char.GetTitleAsNameNoTooltip]\nG: [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')]\nD: [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_D')]\nA: [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_A')]\nV: [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]\nL: [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_L')]\nI: [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_I')]"
