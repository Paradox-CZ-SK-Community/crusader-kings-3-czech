l_polish:
 martial_good_trait_match_good_outcome: "Jelikož [ROOT.Char.GetFirstName] bývá [Select_CString( ROOT.Char.IsFemale, 'čilá a nadšená', 'čilý a nadšený' )], není divu, že se [Select_CString( ROOT.Char.IsFemale, 'jí', 'mu' )] ve studiu válčení a boje dařilo."
 martial_bad_trait_match_good_outcome: "Tvrdit, že se nezkrotná povaha postavy [ROOT.Char.GetFirstName] nehodila pro život válečníka, by bylo slabé slovo. [Select_CString( ROOT.Char.IsFemale, 'Přesto však překonala', 'Přesto však překonal' )] všechna očekávání."
 martial_neutral_trait_match_good_outcome: "S náležitým vedením může válčení skutečně porozumět i dítě, které k němu neprojevovalo mnoho přirozených vloh, jako [ROOT.Char.GetFirstName]."
 education_martial_3_outcome_description: "[Select_CString( ROOT.Char.IsFemale, 'Prokázala', 'Prokázal' )] značné nadání pro bitevní taktiku i vedení armád. Jsem si jist, že z [Select_CString( ROOT.Char.IsFemale, 'ní', 'něj' )] jednou bude znamenitý velitel."
 education_martial_3_outcome_description_not_commander: "[Select_CString( ROOT.Char.IsFemale, 'Prokázala', 'Prokázal' )] značné nadání pro bitevní taktiku i vedení armád. Je škoda, že nikdy nebude velet vojsku."
 education_martial_4_outcome_description: "Je obdivuhodné vidět takovou dovednost u někoho tak mladého. [Select_CString( ROOT.Char.IsFemale, 'Projevuje', 'Projevuje' )] úsudek, který je vzácný dokonce i mezi ostřílenými veliteli!"
 martial_good_trait_match_bad_outcome: "Mělo se za to, že [ROOT.Char.GetFirstNamePossessive] činorodá povaha svědčí o nadání pro válčení a boj, ale možná šlo jen o neukázněnost. "
 martial_bad_trait_match_bad_outcome: "[ROOT.Char.GetFirstName] nikdy neprojevoval[Select_CString( ROOT.Char.IsFemale, 'a', '' )] přílišný zájem o válčení, ale vždy jsem doufal, že je to jen přechodné období. Byl jsem naivní."
 martial_neutral_trait_match_bad_outcome: "Dlouho jsem doufal, že dobré vedení postačí k tomu, aby se [ROOT.Char.GetFirstName] naučil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] všem spletitostem válčení. Byl jsem naivní."
 education_martial_1_outcome_description: "[Select_CString( ROOT.Char.IsFemale, 'Prokázala', 'Prokázal' )] jen chabé pochopení látky, ale alespoň ví, za který konec držet meč, a snad dokonce rozezná pěšáka od postavy označované jako $knight_culture_player_no_tooltip_lowercase$."
 education_martial_2_outcome_description: "[Select_CString( ROOT.Char.IsFemale, 'Osvojila', 'Osvojil' )] si jen základní znalosti, ale alespoň se naučil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] nezbytné základy velení armádě. Mohu jen doufat, že zbytek přijde se zkušenostmi."
 education_martial_prowess_1_outcome_description: "\n\nV osobním boji si ze svého $knight_culture_player_adjective_no_tooltip_lowercase$ výcviku odnesl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jen málo a v soubojích jeden na jednoho si počíná těžkopádně."
 education_martial_prowess_2_outcome_description: "\n\nV osobním boji se rovněž úspěšně střetl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] s několika menšími skupinami vzbouřených sedláků a osvědčil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] se jako schopný $knight_culture_player_no_tooltip_lowercase$."
 education_martial_prowess_3_outcome_description: "\n\nV osobním boji se osvědčil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jako schopný bojovník na krátkou vzdálenost, který dokáže zacházet s mečem a vést svou osobní družinu jako jeden celek."
 education_martial_prowess_4_outcome_description: "\n\nV osobním boji se ukázal[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jako mimořádně zdatný samostatný bojovník a ovládl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] i nejobtížnější podoby tradičního boje vlastní kultury ([ROOT.Char.GetCulture.GetNameNoTooltip])."
 diplomacy_good_trait_match_good_outcome: "Už jako dítě uměl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetFirstName] zacházet se slovy. Není proto divu, že se [Select_CString( ROOT.Char.IsFemale, 'jí', 'mu' )] ve studiu diplomatických vztahů dařilo."
 diplomacy_good_trait_match_bad_outcome: "Přestože býval[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetFirstName] hovorným dítětem, někdy jen obtížně vychází s ostatními."
 diplomacy_bad_trait_match_good_outcome: "Přestože si [ROOT.Char.GetFirstName] s ostatními dětmi málokdy rozuměl[Select_CString( ROOT.Char.IsFemale, 'a', '' )], prokázal[Select_CString( ROOT.Char.IsFemale, 'a', '' )] překvapivé nadání pro diplomatické manévrování."
 diplomacy_bad_trait_match_bad_outcome: "[ROOT.Char.GetFirstName] se vždy soustředil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] především na to, co chce #EMP [Select_CString( ROOT.Char.IsFemale, 'ona', 'on' )]#!, takže asi není příliš překvapivé, že se [Select_CString( ROOT.Char.IsFemale, 'jí', 'mu' )] nedařilo naučit, jak ovlivňovat ostatní."
 diplomacy_neutral_trait_match_good_outcome: "S náležitým vedením může diplomatickému působení skutečně porozumět i dítě, které k němu neprojevovalo mnoho přirozených vloh, jako [ROOT.Char.GetFirstName]."
 diplomacy_neutral_trait_match_bad_outcome: "Dlouho jsem doufal, že dobré vedení postačí k tomu, aby se [ROOT.Char.GetFirstName] naučil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] všem spletitostem diplomacie. Veškeré úsilí však přišlo vniveč."
 stewardship_good_trait_match_good_outcome: "[ROOT.Char.GetFirstName] se pro správu narodil[Select_CString( ROOT.Char.IsFemale, 'a', '' )], a tak nikoho nepřekvapí, jak daleko dospěl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] ve studiu správy panství."
 stewardship_good_trait_match_bad_outcome: "Přestože [ROOT.Char.GetFirstName] vždy vyhledával[Select_CString( ROOT.Char.IsFemale, 'a', '' )] autoritu a řád, ve správě země a jejích obyvatel nedosáhl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] očekávané obratnosti."
 stewardship_bad_trait_match_good_outcome: "Přestože se [ROOT.Char.GetFirstName] více zajímal[Select_CString( ROOT.Char.IsFemale, 'a', '' )] o klepy o obyvatelích panství než o jeho daně a soupisy lidu, vypěstoval[Select_CString( ROOT.Char.IsFemale, 'a', '' )] si nadání pro správu."
 stewardship_bad_trait_match_bad_outcome: "Asi nepřekvapí, že [ROOT.Char.GetFirstNamePossessive] posedlost nejmenšími podrobnostmi ze života ostatních nijak neprospěla [Select_CString( ROOT.Char.IsFemale, 'jejímu', 'jeho' )] pochopení správy celého panství."
 stewardship_neutral_trait_match_good_outcome: "S náležitým vedením může správě skutečně porozumět i dítě, které k ní neprojevovalo mnoho přirozených vloh, jako [ROOT.Char.GetFirstName]."
 stewardship_neutral_trait_match_bad_outcome: "Dlouho jsem doufal, že dobré vedení postačí k tomu, aby se [ROOT.Char.GetFirstName] naučil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] všem spletitostem správy. Veškeré úsilí však přišlo vniveč."
 intrigue_good_trait_match_good_outcome: "[ROOT.Char.GetFirstName] býval[Select_CString( ROOT.Char.IsFemale, 'a', '' )] vždy bystrým dítětem a během studií znovu a znovu dokazoval[Select_CString( ROOT.Char.IsFemale, 'a', '' )], že má přirozené nadání pro pečlivé plánování i nemalou dávku klamu."
 intrigue_good_trait_match_bad_outcome: "Přestože měl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetFirstName] už od dětství s lhaním více než dost zkušeností, nikdy se [Select_CString( ROOT.Char.IsFemale, 'jí', 'mu' )] nedařilo tuto tvořivost uplatňovat soustavně."
 intrigue_bad_trait_match_good_outcome: "Přestože býval[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetFirstName] uzavřeným dítětem, které se často ztrácelo ve vlastních myšlenkách, začal[Select_CString( ROOT.Char.IsFemale, 'a', '' )] si osvojovat umění manipulace."
 intrigue_bad_trait_match_bad_outcome: "Jako tiché a samotářské dítě neprojevoval[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetFirstName] nikdy přílišný zájem o prosazování vlastní vůle."
 intrigue_neutral_trait_match_good_outcome: "S náležitým vedením může pochopit užitek pečlivého plánování i dítě, které k němu neprojevovalo mnoho přirozených vloh, jako [ROOT.Char.GetFirstName]."
 intrigue_neutral_trait_match_bad_outcome: "Dlouho jsem doufal, že dobré vedení postačí k tomu, aby se [ROOT.Char.GetFirstName] naučil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] všem spletitostem pečlivého plánování. Veškeré úsilí však přišlo vniveč."
 learning_good_trait_match_good_outcome: "[ROOT.Char.GetFirstName] býval[Select_CString( ROOT.Char.IsFemale, 'a', '' )] vždy zvídavým dítětem lačnícím po vědění a už od útlého věku projevoval[Select_CString( ROOT.Char.IsFemale, 'a', '' )] nadání pro učenost."
 learning_good_trait_match_bad_outcome: "Přestože býval[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetFirstName] zvídavým dítětem dychtícím po vědění, s přibývajícím věkem se [Select_CString( ROOT.Char.IsFemale, 'její', 'jeho' )] pozornost obrátila jinam."
 learning_bad_trait_match_good_outcome: "Přestože [ROOT.Char.GetFirstName] vždy působil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jako nepozorné dítě, dokázal[Select_CString( ROOT.Char.IsFemale, 'a', '' )], že učence netvoří pouze soustředěná píle."
 learning_bad_trait_match_bad_outcome: "Jelikož býval[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetFirstName] tak nepozorným dítětem, není těžké pochopit, proč se [Select_CString( ROOT.Char.IsFemale, 'jí', 'mu' )] nedařilo proniknout do učenosti."
 learning_neutral_trait_match_good_outcome: "S náležitým vedením může kterémukoli oboru skutečně porozumět i dítě, které neprojevovalo mnoho přirozených vloh k učenosti, jako [ROOT.Char.GetFirstName]."
 learning_neutral_trait_match_bad_outcome: "Dlouho jsem doufal, že dobré vedení postačí k tomu, aby se [ROOT.Char.GetFirstName] naučil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] všem spletitostem učenosti. Veškeré úsilí však přišlo vniveč."
 education_diplomacy_1_outcome_description: "Zásady zdvořilosti a cti jsou pro [Select_CString( ROOT.Char.IsFemale, 'ni', 'něj' )] značnou výzvou, ale alespoň se vyzná v základech etikety."
 education_diplomacy_2_outcome_description: "Jeho znalost etikety by na žádném dvoře příliš nezapůsobila, ale alespoň se dokáže obstojně pohybovat ve vybrané společnosti."
 education_diplomacy_3_outcome_description: "Díky znamenité znalosti veškerých způsobů, porozumění všem druhům zábavy a náležité výmluvnosti nebude mít s životem u dvora mnoho potíží."
 education_diplomacy_4_outcome_description: "Má skutečně stříbrný jazyk a dokáže ovlivnit mínění hrabat i králů! Když promluví, celý dvůr naslouchá v uchváceném tichu."
 education_stewardship_1_outcome_description: "Snad lze považovat za štěstí, že [Select_CString( ROOT.Char.IsFemale, 'ovládla', 'ovládl' )] umění počítat mince, protože většina ostatních stránek správcovské práce [Select_CString( ROOT.Char.IsFemale, 'jí', 'mu' )] zůstala utajena."
 education_stewardship_2_outcome_description: "Jeho znalost tohoto oboru by málokoho ohromila, ale alespoň si osvojil základy správy a první náznaky rozumné šetrnosti."
 education_stewardship_3_outcome_description: "[Select_CString( ROOT.Char.IsFemale, 'Prokazuje', 'Prokazuje' )] důkladné porozumění toku zlata i pohybu lidí a při řešení těchto záležitostí dokonce projevuje pozoruhodnou tvořivost."
 education_stewardship_4_outcome_description: "Nestačí [Select_CString( ROOT.Char.IsFemale, 'jí', 'mu' )] rozumět pohybu bohatství a lidí, jako by jej dokázal[Select_CString( ROOT.Char.IsFemale, 'a', '' )] předvídat pouhým instinktem! Navíc vždy nachází nové způsoby, jak z něj těžit."
 education_intrigue_1_outcome_description: "Kvůli nedostatku důvtipu a trpělivosti se [Select_CString( ROOT.Char.IsFemale, 'jí', 'mu' )] obtížně uskutečňují dlouhodobé plány. Alespoň se však nějaké snaží vytvářet."
 education_intrigue_2_outcome_description: "Přestože se ukázal[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jako plně schopný[Select_CString( ROOT.Char.IsFemale, 'á', '' )] drobných pletich, málokdo by je označil za vytříbené. Vytříbenost však není vždy zapotřebí."
 education_intrigue_3_outcome_description: "Nyní zná mnoho způsobů, jak dosáhnout svého. Především si však velmi dobře uvědomuje politické důsledky vlastních přání."
 education_intrigue_4_outcome_description: "Nyní je to však těžší posoudit. Vše, čím je pověřen[Select_CString( ROOT.Char.IsFemale, 'a', '' )], vykonají ostatní dříve, než se k tomu dostane, a už se neuchyluje k malicherným lžím jako dříve. Možná nakonec nebyl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] tak chytrý[Select_CString( ROOT.Char.IsFemale, 'á', '' )], jak se zdálo."
 education_learning_1_outcome_description: "Touha po vědění v jeho mysli nikdy pořádně nezakořenila a čas strávený mezi knihami a svazky je pro [Select_CString( ROOT.Char.IsFemale, 'ni', 'něj' )] nyní spíše povinností než potěšením."
 education_learning_2_outcome_description: "Přestože není právě studijní typ, podařilo se [Select_CString( ROOT.Char.IsFemale, 'jí', 'mu' )] alespoň zapamatovat několik vybraných citátů z klasických děl. Nejspíš nikdy nenapíše žádné velké pojednání, ale jedno či dvě si možná přečte."
 education_learning_3_outcome_description: "Jako nadšený[Select_CString( ROOT.Char.IsFemale, 'á', '' )] student[Select_CString( ROOT.Char.IsFemale, 'ka', '' )] se stal[Select_CString( ROOT.Char.IsFemale, 'a', '' )] skutečným šiřitelem vědění a prokázal[Select_CString( ROOT.Char.IsFemale, 'a', '' )], že dokáže vystavět složité teoretické i teologické argumenty."
 education_learning_4_outcome_description: "Jeho porozumění filozofickým a teoretickým dílům je působivé a často se pouští do debat se svými někdejšími učiteli. I v tak mladém věku jej lze zaslechnout, jak na podporu nových myšlenek a teorií cituje málo známé pasáže."
 ChildhoodPersonalityTrait_charming: "[GetTrait('charming').GetName( ROOT.Char )]"
 ChildhoodPersonalityTrait_rowdy: "[GetTrait('rowdy').GetName( ROOT.Char )]"
 ChildhoodPersonalityTrait_bossy: "[GetTrait('bossy').GetName( ROOT.Char )]"
 ChildhoodPersonalityTrait_curious: "[GetTrait('curious').GetName( ROOT.Char )]"
 ChildhoodPersonalityTrait_pensive: "[GetTrait('pensive').GetName( ROOT.Char )]"
 diplomatic_education: "$education_diplomacy_loc$"
 martial_education: "$education_martial_loc$"
 stewardship_education: "$education_stewardship_loc$"
 intrigue_education: "$education_intrigue_loc$"
 learning_education: "$education_learning_loc$"
