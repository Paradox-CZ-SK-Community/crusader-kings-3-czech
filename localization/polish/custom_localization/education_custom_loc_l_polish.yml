l_polish:
 martial_good_trait_match_good_outcome: "Jako aktivní a nadšené dítě není překvapením, že se [ROOT.Char.GetFirstName] dobře dařilo ve [Select_CString(ROOT.Char.IsFemale,'jejích','jeho')] studiích války a boje."
 martial_bad_trait_match_good_outcome: "Říci, že neukázněný [ROOT.Char.GetFirstName] se nezdál být stvořený pro život v válce, je slabé vyjádření. Přesto [ROOT.Char.GetSheHe] všem očekáváním vzdoruje."
 martial_neutral_trait_match_good_outcome: "S dostatečným vedením i dítě, které nejeví přirozený sklon k válčení, jako [ROOT.Char.GetFirstName], může skutečně porozumět tomuto umění."
 education_martial_3_outcome_description: "[Select_CString(ROOT.Char.IsFemale,'Prokázala','Prokázal')] velké nadání jak v taktice bitev, tak v řízení armád. Jsem si jistý, že z [ROOT.Char.GetSheHe|U] se jednoho dne stane vynikající velitel."
 education_martial_3_outcome_description_not_commander: "[Select_CString(ROOT.Char.IsFemale,'Prokázala','Prokázal')] velké nadání jak v taktice bitev, tak v řízení armád. Je škoda, že [ROOT.Char.GetSheHe] nikdy nebude velitele armád."
 education_martial_4_outcome_description: "Je působivé vidět takovou zručnost u někoho tak mladého. [ROOT.Char.GetSheHe|U] projevuje úroveň porozumění vzácnou i mezi zkušenými veliteli!"
 martial_good_trait_match_bad_outcome: "[ROOT.Char.GetFirstNamePossessive] energická povaha byla považována za znamení sklony k válčení a boji, ale možná to byla jen neukázněnost. "
 martial_bad_trait_match_bad_outcome: "[ROOT.Char.GetFirstName] nikdy neprojevoval velký zájem o problematiku válčení, ale vždy jsem doufal, že je to jen přechodná fáze. Byl jsem naivní."
 martial_neutral_trait_match_bad_outcome: "Po dlouhou dobu jsem doufal, že dobré vedení bude stačit, aby se [ROOT.Char.GetFirstName] [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] složitosti válčení. Byl jsem naivní."
 education_martial_1_outcome_description: "[ROOT.Char.GetSheHe|U] vykazuje malé porozumění předmětu, ale alespoň [ROOT.Char.GetSheHe] ví, jak držet meč, a možná dokáže rozeznat pěšáka od $knight_culture_player_no_tooltip_lowercase$."
 education_martial_2_outcome_description: "[Select_CString(ROOT.Char.IsFemale,'Osvojila','Osvojil')] si jen základní porozumění předmětu, ale alespoň se [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] základy vedení armády. Mohu jen doufat, že zbytek přijde s praxí."
 education_martial_prowess_1_outcome_description: "\n\nOsobně si [ROOT.Char.GetSheHe] z [ROOT.Char.GetHerHis] $knight_culture_player_adjective_no_tooltip_lowercase$ studií příliš [Select_CString(ROOT.Char.IsFemale,'neodnesla','neodnesl')] a v soubojích jeden na jednoho se často trápí."
 education_martial_prowess_2_outcome_description: "\n\nOsobně rovněž [Select_CString(ROOT.Char.IsFemale,'vedla','vedl')] několik úspěšných akcí proti malým skupinám vzbouřených sedláků, čímž [Select_CString(ROOT.Char.IsFemale,'ukázala','ukázal')], že je schopným $knight_culture_player_no_tooltip_lowercase$."
 education_martial_prowess_3_outcome_description: "\n\nOsobně [Select_CString(ROOT.Char.IsFemale,'prokázala','prokázal')], že je úspěšným bojovníkem v těsném kontaktu, schopným ovládat [Select_CString(ROOT.Char.IsFemale,'její','jeho')] meč a osobní družinu jako jednotný celek."
 education_martial_prowess_4_outcome_description: "\n\nOsobně [Select_CString(ROOT.Char.IsFemale,'ukázala','ukázal')] sobě i druhým, že je neuvěřitelně zdatným jednotlivým bojovníkem, který zvládl i nejtěžší formy tradičního [ROOT.Char.GetCulture.GetNameNoTooltip] boje."
 diplomacy_good_trait_match_good_outcome: "Ještě jako dítě [Select_CString(ROOT.Char.IsFemale,'měla','měl')] [ROOT.Char.GetFirstName] vždy dar slova. Není proto překvapením, že se dobře [Select_CString(ROOT.Char.IsFemale,'ujala','ujal')] studia diplomatických vztahů."
 diplomacy_good_trait_match_bad_outcome: "Přestože byl [ROOT.Char.GetFirstName] jako dítě hovorný, má občas potíže vycházet s lidmi."
 diplomacy_bad_trait_match_good_outcome: "Přestože se [ROOT.Char.GetFirstName] s ostatními dětmi málokdy snášel, [Select_CString(ROOT.Char.IsFemale,'prokázala','prokázal')] překvapivé nadání pro diplomatická manévrování."
 diplomacy_bad_trait_match_bad_outcome: "[ROOT.Char.GetFirstName] byl vždy tak zaměřený na to, co #EMP [ROOT.Char.GetSheHe]#! chtěl, takže není velkým překvapením, že [ROOT.Char.GetSheHe] [Select_CString(ROOT.Char.IsFemale,'měla','měl')] potíže naučit se, jak ovlivňovat ostatní."
 diplomacy_neutral_trait_match_good_outcome: "S dostatečným vedením i dítě, které neprojevovalo přirozený sklon k diplomatickému vlivu, jako [ROOT.Char.GetFirstName], může skutečně pochopit tuto disciplínu."
 diplomacy_neutral_trait_match_bad_outcome: "Dlouho jsem doufal, že dobré vedení bude stačit, aby se [ROOT.Char.GetFirstName] [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] jemnost diplomacie. Všechny snahy však vyšly nazmar."
 stewardship_good_trait_match_good_outcome: "Jako od přírody nadaný správce není pro nikoho překvapením, že se [ROOT.Char.GetFirstName] ve [Select_CString(ROOT.Char.IsFemale,'jejích','jeho')] studiích správy říše posunul daleko."
 stewardship_good_trait_match_bad_outcome: "Přestože se [ROOT.Char.GetFirstName] [Select_CString(ROOT.Char.IsFemale,'zdála','zdál')] vždy toužit po autoritě a pořádku, nestal se tak [Select_CString(ROOT.Char.IsFemale,'nestala se tak zdatnou','nestal se tak zdatným')], jak se očekávalo, ve správě zemí a lidí."
 stewardship_bad_trait_match_good_outcome: "Ačkoli se více zajímal o drby o lidech v říši než o její daně a sčítání lidu, [ROOT.Char.GetFirstName] si vyvinul nadání pro administraci."
 stewardship_bad_trait_match_bad_outcome: "Snad není překvapením, že [ROOT.Char.GetFirstNamePossessive] posedlost drobnými detaily životů lidí nepřispěla k [Select_CString(ROOT.Char.IsFemale,'její','jeho')] pochopení správy celé říše."
 stewardship_neutral_trait_match_good_outcome: "S dostatečným vedením i dítě, které neprojevovalo přirozený sklon ke správě, jako [ROOT.Char.GetFirstName], může tuto oblast skutečně pochopit."
 stewardship_neutral_trait_match_bad_outcome: "Dlouho jsem doufal, že dobré vedení stačí, aby se [ROOT.Char.GetFirstName] [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] složitosti správy. Veškeré snahy však vyšly naprázdno."
 intrigue_good_trait_match_good_outcome: "Vždy bystré dítě, [ROOT.Char.GetFirstName] během svých studií opakovaně [Select_CString(ROOT.Char.IsFemale,'dokazovala','dokazoval')], že má přirozenou zálibu v pečlivém plánování a dost klamavosti."
 intrigue_good_trait_match_bad_outcome: "I přes to, že [Select_CString(ROOT.Char.IsFemale,'měla','měl')] [ROOT.Char.GetFirstName] jako dítě mnoho zkušeností s lhaním, vždy mu připadalo obtížné uplatnit takovou tvořivost strukturovaně."
 intrigue_bad_trait_match_good_outcome: "I přes to, že bylo [ROOT.Char.GetFirstName] introvertní dítě, často ztracené v myšlenkách, rozvinul se u něj sklon k umění manipulace."
 intrigue_bad_trait_match_bad_outcome: "Jako tiché a samotářské dítě [ROOT.Char.GetFirstName] nikdy neprojevoval velký zájem o prosazení své vůle."
 intrigue_neutral_trait_match_good_outcome: "S dostatečným vedením i dítě, které neprojevovalo přirozený sklon k pečlivému plánování, jako [ROOT.Char.GetFirstName], může pochopit jeho užitečnost."
 intrigue_neutral_trait_match_bad_outcome: "Dlouho jsem doufal, že dobré vedení bude stačit, aby se [ROOT.Char.GetFirstName] [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] složitosti pečlivého plánování. Všechny snahy však vyšly naprázdno."
 learning_good_trait_match_good_outcome: "Jako zvědavé a po vědění lačnící dítě [Select_CString(ROOT.Char.IsFemale,'prokázala','prokázal')] [ROOT.Char.GetFirstName] zálibu ve studiu již od raného věku."
 learning_good_trait_match_bad_outcome: "I když byl [ROOT.Char.GetFirstName] zvědavým dítětem dychtícím po učení, [ROOT.Char.GetFirstNamePossessive] pozornost se s věkem přesouvala jinam."
 learning_bad_trait_match_good_outcome: "I přes to, že se [ROOT.Char.GetFirstName] vždy jevil jako nepozorné dítě, [Select_CString(ROOT.Char.IsFemale,'prokázala','prokázal')], že soustředěná pilnost není vše, co dělá učence."
 learning_bad_trait_match_bad_outcome: "Jelikož bylo dítě tak nepozorné, není těžké pochopit, proč [Select_CString(ROOT.Char.IsFemale,'měla','měl')] [ROOT.Char.GetFirstName] potíže s osvojováním si vzdělání."
 learning_neutral_trait_match_good_outcome: "S dostatečným vedením i dítě, které neprojevovalo přirozený sklon ke studiu, jako [ROOT.Char.GetFirstName], může skutečně zvládnout jakýkoli předmět."
 learning_neutral_trait_match_bad_outcome: "Dlouho jsem doufal, že dobré vedení bude stačit, aby se [ROOT.Char.GetFirstName] [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] složitosti jakéhokoli druhu bádání. Všechny snahy však vyšly naprázdno."
 education_diplomacy_1_outcome_description: "Zásady zdvořilosti a cti jsou pro [ROOT.Char.GetHerHim] docela výzvou, ale alespoň se [ROOT.Char.GetSheHe] orientuje v základním společenském chování."
 education_diplomacy_2_outcome_description: "Málo kdo na dvoře by byl příliš ohromen [Select_CString(ROOT.Char.IsFemale,'jejím','jeho')] pojetím etikety, ale alespoň [ROOT.Char.GetSheHe] ví, jak obstát v slušné společnosti."
 education_diplomacy_3_outcome_description: "S vynikajícím pochopením všech forem etikety, znalostí zábavy a s výmluvností k tomu nebude mít [ROOT.Char.GetSheHe] téměř žádné potíže pohybovat se na dvoře."
 education_diplomacy_4_outcome_description: "Skutečný stříbrný jazyk — [ROOT.Char.GetSheHe] by mohl přesvědčit hraběte i krále! Když [ROOT.Char.GetSheHe] mluví, dvůr naslouchá v okouzleném tichu."
 education_stewardship_1_outcome_description: "Možná má [ROOT.Char.GetSheHe] štěstí, že [Select_CString(ROOT.Char.IsFemale,'ovládla','ovládl')] umění počítání mincí, neboť většina ostatních aspektů práce správce mu uniká."
 education_stewardship_2_outcome_description: "Málo kdo by byl ohromen [Select_CString(ROOT.Char.IsFemale,'jejím','jeho')] porozuměním tématu, ale alespoň si [Select_CString(ROOT.Char.IsFemale,'osvojila','osvojil')] pevné základy správy a náznak rozumné šetrnosti."
 education_stewardship_3_outcome_description: "Projevujíc důkladné pochopení toku zlata a pohybu lidí, [ROOT.Char.GetSheHe] dokonce ukazuje pozoruhodnou tvořivost při řešení těchto záležitostí."
 education_stewardship_4_outcome_description: "Neuspokojujíc se pouze porozuměním toku bohatství a lidí, [ROOT.Char.GetSheHe] je schopný je předvídat téměř instinktivně! [ROOT.Char.GetSheHe|U] také vždy nachází nové způsoby, jak z toho profitovat."
 education_intrigue_1_outcome_description: "S nedostatkem subtilnosti a trpělivosti má [ROOT.Char.GetSheHe] potíže realizovat [Select_CString(ROOT.Char.IsFemale,'její','jeho')] dlouhodobé plány. Přinejmenším se však [ROOT.Char.GetSheHe] snaží plánovat."
 education_intrigue_2_outcome_description: "Zatímco [Select_CString(ROOT.Char.IsFemale,'prokázala','prokázal')], že je plně schopný drobných intrik, málokdo by je nazval vytříbenými — a vytříbenost není vždy to, co potřebujete."
 education_intrigue_3_outcome_description: "[ROOT.Char.GetSheHe|U] nyní zná mnoho způsobů, jak dosáhnout toho, co chce. Hlavní je, že si je vysoce [Select_CString(ROOT.Char.IsFemale,'vědoma','vědom')] politických důsledků těchto přání."
 education_intrigue_4_outcome_description: "Teď se to však hůře posuzuje. Vše, co je [ROOT.Char.GetHerHim] uloženo, udělají druzí dříve, než se [ROOT.Char.GetSheHe] dostane k věci, a [ROOT.Char.GetSheHe] už neříká drobné lži, jak to [Select_CString(ROOT.Char.IsFemale,'dělávala','dělával')] kdysi. Možná [Select_CString(ROOT.Char.IsFemale,'nebyla','nebyl')] nakonec tak [Select_CString(ROOT.Char.IsFemale,'chytrá','chytrý')], jak se [Select_CString(ROOT.Char.IsFemale,'zdála','zdál')]."
 education_learning_1_outcome_description: "Pátrání po vědění se v [ROOT.Char.GetHerHis] mysli nikdy pořádně neuchytilo a teď je čas strávený mezi knihami spíše povinností než potěšením."
 education_learning_2_outcome_description: "Těžko pilný, si přinejmenším [Select_CString(ROOT.Char.IsFemale,'zapamatovala','zapamatoval')] některé vybrané citáty z klasiků. [ROOT.Char.GetSheHe|U] pravděpodobně nikdy nenapíše žádné velké teorie, ale možná si přečte jednu nebo dvě."
 education_learning_3_outcome_description: "Horlivý učenec, [ROOT.Char.GetSheHe] se stal významným šiřitelem vědomostí a [Select_CString(ROOT.Char.IsFemale,'prokázala','prokázal')], že je plně schopen strukturovat pokročilé teoretické a teologické argumenty."
 education_learning_4_outcome_description: "[Select_CString(ROOT.Char.IsFemale,'Její','Jeho')] porozumění filozofickým a teoretickým dílům je působivé a [ROOT.Char.GetSheHe] se často pouští do debat se svými bývalými učiteli. I v tak mladém věku lze [ROOT.Char.GetSheHe] slyšet, jak cituje obskurní pasáže na podporu nových myšlenek a teorií."
 ChildhoodPersonalityTrait_charming: "[GetTrait('charming').GetName( ROOT.Char )]"
 ChildhoodPersonalityTrait_rowdy: "[GetTrait('rowdy').GetName( ROOT.Char )]"
 ChildhoodPersonalityTrait_bossy: "[GetTrait('bossy').GetName( ROOT.Char )]"
 ChildhoodPersonalityTrait_curious: "[GetTrait('curious').GetName( ROOT.Char )]"
 ChildhoodPersonalityTrait_pensive: "[GetTrait('pensive').GetName( ROOT.Char )]"
 diplomatic_education: "$education_diplomacy_loc$"
 martial_education: "$education_martial_loc$"
 stewardship_education: "$education_stewardship_loc$"
 intrigue_education: "$education_intrigue_loc$"
 learning_education: "$education_learning_loc$"
