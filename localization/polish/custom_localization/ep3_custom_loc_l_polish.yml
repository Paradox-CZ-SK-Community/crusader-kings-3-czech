 chariot_movement_cut_off_at_turn: "pevně svírá otěže a pobízí své znamenité oře, aby projeli zatáčku co nejtěsněji"
 chariot_governor_chitchat_1: "Jen se podívej na velkolepost závodů vozů, můj ctěný kolego. Právě na hipodromu skutečně ožívá duch Byzance!"
 chariot_governor_chitchat_2: "V ohlušujícím řevu davu a dunění koňských kopyt zní tlukot srdce naší velké říše, nemyslíš?"
 chariot_governor_chitchat_3: "Tyto závody nejsou pouhou podívanou. Jsou důkazem jednoty a síly našeho lidu a připomínkou, že i v soupeření zůstáváme jednotní."
 chariot_governor_chitchat_4: "Pohleď na zářivé barvy soupeřících frakcí. Je to pastva pro oči, jež odráží rozmanitost a bohatství naší milované říše."
 chariot_governor_chitchat_5: "Jako správci jsme strážci tradic. Závody vozů na hipodromu jsou nepřerušenou nití, která spojuje naši současnost se slavnou minulostí."
 chariot_governor_chitchat_6: "Slyšíš, jak se jásot i posměšky nesou napříč věky a připomínají dávno zesnulé císaře? Hipodrom je naším společným dědictvím."
 chariot_governor_chitchat_7: "Aréna, v níž se snoubí dovednost se strategií, je obrazem našich správcovských povinností. Stejně jako tito vozatajové musíme přesně překonávat každou překážku."
 chariot_governor_chitchat_8: "Pohleď na zápal lidu, který povzbuzuje své oblíbené vozataje. Připomíná nám to, že správa země je stejně jako závodění tancem s veřejným míněním."
 chariot_governor_chitchat_9: "Hipodrom šeptá příběhy o vítězstvích i porážkách a připomíná nám, že úspěch vyžaduje strategii i přizpůsobivost, stejně jako naše vlastní povinnosti."
 chariot_governor_chitchat_10: "Dopřejme si na chvíli odpočinek od povinností, příteli, a vychutnejme si podívanou na hipodromu. Koneckonců i správci si zaslouží několik okamžiků oddechu."
 chariot_comeback_fallback: "ze posledního místa se řítí vpřed a dotahuje se na čelo závodu"
 chariot_comeback_blazing: "ze zadních pozic se žene kolem soupeřů a vyráží proti vedoucím závodníkům"
 chariot_comeback_sprinting: "z konce pole vyráží vpřed a rychle se dotahuje na vedoucí závodníky"
 chariot_comeback_surging: "ze zadních pozic prudce vyráží a směle útočí na vedoucí vozataje"
 chariot_comeback_dashing: "z posledního místa se žene vpřed a rychle se zapojuje do boje s čelem závodu"
 chariot_comeback_rocketing: "z chvostu závodu vystřeluje vpřed a přímo útočí na vedoucí závodníky"
 chariot_comeback_bursting: "z posledních pozic prudce vyráží a dravě stíhá čelo závodu"
 chariot_comeback_miracle: "zázračně se odpoutává od posledního místa a přímo útočí na vedoucí závodníky"
 chariot_comeback_rallying: "ze zadních pozic znovu nabírá síly a odvážně se přibližuje k čelu závodu"
 chariot_comeback_soaring: "ze zadní části pole se vznáší vpřed a směle vyzývá vedoucí závodníky"
 chariot_comeback_propelling: "z konce pole se žene vpřed a odhodlaně soupeří s vedoucími vozataji"
