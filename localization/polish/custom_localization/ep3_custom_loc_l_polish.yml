 BLUE_VENETOI_GLOSS: "#bold Venetoi#!, dobové označení frakce „Modrých“, byli považováni za jeden z nejprestižnějších týmů závodících na konstantinopolském hipodromu a byli spojováni s vyššími vrstvami. Slavný vozataj Porfyrios byl váženým členem Modrých, přestože během povstání Níká nakrátko přešel k Zeleným."
 GREEN_PRASINOI_GLOSS: "#bold Prasinoi#!, dobové označení frakce „Zelených“, byli považováni za frakci lidu. V 6. století Zelení v konstantinopolském amfiteátru povraždili téměř 3 000 členů Modrých."
 WHITE_LEUKOI_GLOSS: "#bold Leukoi#!, dobové označení frakce „Bílých“, zůstávali v dějinách ve stínu Modrých a Zelených, rozhodně však nebyli bezvýznamní. Na počátku našeho období již byli začleněni mezi Modré."
 RED_RHOUSIOI_GLOSS: "#bold Rhousioi#!, dobové označení frakce „Červených“, zůstávali v dějinách ve stínu Modrých a Zelených, rozhodně však nebyli bezvýznamní. Na počátku našeho období již byli začleněni mezi Zelené."
