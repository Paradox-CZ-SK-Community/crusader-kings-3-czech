 greeting_supplimentary.negative.tales: "O tvých hanebných skutcích se vypráví od Irska až po Kitaj."
 greeting_supplimentary.negative.greek: "Tvá podlá povaha je námětem řeckých divadelních her."
 greeting_supplimentary.negative.insult.1: "Ať ti tělesné šťávy shnijí ještě zaživa."
 greeting_supplimentary.negative.insult.2: "Ať jsou tvá léta krátká a strastiplná."
 greeting_supplimentary.negative.insult.3: "Ať ti moudrost navždy uniká."
 greeting_supplimentary.negative.insult_muslim.1: "Ať je proklet tvůj předek do sedmého kolena."
 greeting_supplimentary.negative.insult_muslim.2: "Ať tě zaživa zašijí do břicha mrtvého velblouda."
 greeting_supplimentary.negative.insult_muslim.3: "Ať Alláh zahubí celý tvůj rod."
 greeting_supplimentary.negative.insult_muslim.4: "Ty potomku prašivého psa."
 greeting_supplimentary.negative.insult_muslim.5: "Kéž se šakali přou o tvé nepohřbené kosti." # todo: NEW TRANSLATION
 greeting_supplimentary.negative.insult_muslim.6: "Kéž se tvé studny naplní pískem a tvé stany štíry." # todo: NEW TRANSLATION
 greeting_supplimentary.negative.insult_christian.1: "Kéž tě svatí opustí." # todo: NEW TRANSLATION
 greeting_supplimentary.negative.insult_christian.2: "Tvé jméno bude vymazáno ze všech modliteb." # todo: NEW TRANSLATION
 greeting_supplimentary.negative.insult_norse.1: "Kéž tví předkové plivou na tvůj stín." # todo: NEW TRANSLATION
 greeting_supplimentary.negative.insult_norse.2: "Tvé odvahy je méně než zimního ledu." # todo: NEW TRANSLATION
 greeting_supplimentary.negative.insult_byzantine.1: "I krysy z Konstantinopole prchají před tvým zápachem." # todo: NEW TRANSLATION
