 greeting_supplimentary.negative: "[ROOT.Char.Custom2('NegativeSupplimentaryGreeting', second)]"
 greeting_supplimentary.negative.tales: "O tvých hanebných skutcích se vypráví od Irska až po Kitaj."
 greeting_supplimentary.negative.greek: "Tvá podlá povaha je námětem řeckých divadelních her."
 greeting_supplimentary.negative.insult.1: "Ať ti tělesné šťávy shnijí ještě zaživa."
 greeting_supplimentary.negative.insult.2: "Ať jsou tvá léta krátká a strastiplná."
 greeting_supplimentary.negative.insult.3: "Ať ti moudrost navždy uniká."
 greeting_supplimentary.negative.insult_muslim.1: "Ať je proklet tvůj předek do sedmého kolena."
 greeting_supplimentary.negative.insult_muslim.2: "Ať tě zaživa zašijí do břicha mrtvého velblouda."
 greeting_supplimentary.negative.insult_muslim.3: "Ať Alláh zahubí celý tvůj rod."
 greeting_supplimentary.negative.insult_muslim.4: "Ty potomku prašivého psa."
 greeting_supplimentary.negative.insult_muslim.5: "Kéž se šakalové porvou o tvé nepohřbené kosti."
 greeting_supplimentary.negative.insult_muslim.6: "Kéž tvé studny zaplní písek a tvé stany štíři."
 greeting_supplimentary.negative.insult_christian.1: "Kéž světci zavrhnou tvou věc."
 greeting_supplimentary.negative.insult_christian.2: "Tvé jméno bude vyškrtnuto z každé modlitby."
 greeting_supplimentary.negative.insult_norse.1: "Kéž tví předkové poplivou tvůj stín."
 greeting_supplimentary.negative.insult_norse.2: "Tvá odvaha je tenčí než zimní led."
 greeting_supplimentary.negative.insult_byzantine.1: "I krysy z Konstantinopole prchají před tvým zápachem."
 greeting_supplimentary.negative.insult.4: "Kéž tvá pole leží ladem a tvé studny vyschnou."
 greeting_supplimentary.negative.insult.unreliable_swine: "Ty nespolehlivá svině."
 greeting_supplimentary.negative.insult.oathbreaker: "Jsi [Select_CString(second.IsFemale,'lhářka a křivopřísežnice','lhář a křivopřísežník')]."
 greeting_supplimentary.negative.insult_jewish.1: "Kéž je tvé jméno vymazáno z knihy živých."
 greeting_supplimentary.negative.insult_zoroastrian.1: "Kéž temnota zadusí oheň, o který prý pečuješ."
 greeting_supplimentary.negative.insult_hindu.1: "Kráčíš daleko od cesty spravedlnosti – a já tě zaženu ještě dál."
 greeting_supplimentary.negative.insult_christian.3: "Kéž se peklo otevře dokořán, aby tě přijalo."
 greeting_supplimentary.negative.insult_norse.3: "Havrani se bohatě nasytí na tvých mrtvých."
 greeting_supplimentary.positive: "[ROOT.Char.Custom2('PositiveSupplimentaryGreeting', second)]"
 greeting_supplimentary.positive.flattery.1: "Požehnání tobě i tvému rodu."
 greeting_supplimentary.positive.flattery.2: "Tvá moudrost a milosrdenství jsou opředeny legendami."
 greeting_supplimentary.positive.flattery.3: "Mír s tebou."
 greeting_supplimentary.positive.flattery.4: "Kéž žiješ v souladu a spokojenosti."
 greeting_supplimentary.positive.flattery.5: "Tvá bezohlednost je záviděníhodná."
 greeting_supplimentary.positive.flattery.6: "Tvé nezměrné choutky jsou proslulé po celém světě."
 greeting_supplimentary.positive.flattery.7: "Tvá sláva tě předchází za každou hranicí."
 greeting_supplimentary.positive.flattery.8: "Kéž tvůj rod přetrvá tisíc let."
 greeting_supplimentary.positive.flattery.9: "Kéž Bůh zachová sílu tvé paže s mečem."
 greeting_supplimentary.positive.flattery.10: "Mír a hojnost tvému domu."
