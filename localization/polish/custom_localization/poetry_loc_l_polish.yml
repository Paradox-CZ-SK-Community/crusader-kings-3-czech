 generatepoem_outro_rhyming_incompetence_03: "#EMP [ROOT.Char.Custom('GeneratePoem_Outro_Rhyming_Incompetence_03_A')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming_Incompetence_03_B')]#!"
 GeneratePoem_Intro_Rhyming_Romance_01_A_01: "Ach, jak se půvab v té tváři rozzáří,"
 GeneratePoem_Intro_Rhyming_Romance_01_A_02: "$GeneratePoem_Intro_Rhyming_Romance_01_A_01$"
 GeneratePoem_Intro_Rhyming_Romance_01_A_03: "$GeneratePoem_Intro_Rhyming_Romance_01_A_01$"
 GeneratePoem_Intro_Rhyming_Romance_01_B_01: "Třpytí se, jiskří a mé sny noc co noc maří,"
 GeneratePoem_Intro_Rhyming_Romance_01_B_02: "Tak dokonale čistá, až mou soudnost rázem zmaří,"
 GeneratePoem_Intro_Rhyming_Romance_01_B_03: "[Select_CString( ROOT.Var('poem_subject').Char.IsFemale, 'Její', 'Jeho' )] úsměv mě hřeje, jak když slunce pohladí po tváři,"
 GeneratePoem_Intro_Rhyming_Romance_02_A_01: "[Select_CString( ROOT.Var('poem_subject').Char.IsFemale, 'Ta rozkošná žena mě okouzlila, přiznávám,', 'Ten rozkošný muž mě okouzlil, přiznávám,' )]"
 GeneratePoem_Intro_Rhyming_Romance_02_A_02: "$GeneratePoem_Intro_Rhyming_Romance_02_A_01$"
 GeneratePoem_Intro_Rhyming_Romance_02_A_03: "$GeneratePoem_Intro_Rhyming_Romance_02_A_01$"
 GeneratePoem_Intro_Rhyming_Romance_02_B_01: "[Select_CString( ROOT.Var('poem_subject').Char.IsFemale, 'Kde jen se ztratila, kde ji teď hledat mám?', 'Kde jen se ztratil, kde ho teď hledat mám?' )]"
 GeneratePoem_Intro_Rhyming_Romance_02_B_02: "V [Select_CString( ROOT.Var('poem_subject').Char.IsFemale, 'její', 'jeho' )] tváři věčný jas vždy shledávám,"
 GeneratePoem_Intro_Rhyming_Romance_02_B_03: "[Select_CString( ROOT.Var('poem_subject').Char.IsFemale, 'Jí', 'Jemu' )] svou věrnost navěky odevzdávám,"
 GeneratePoem_Intro_Rhyming_Romance_03_A_01: "Jaká tajemství [Select_CString( ROOT.Var('poem_subject').Char.IsFemale, 'její', 'jeho' )] maska střeží?"
 GeneratePoem_Intro_Rhyming_Romance_03_A_02: "$GeneratePoem_Intro_Rhyming_Romance_03_A_01$"
 GeneratePoem_Intro_Rhyming_Romance_03_A_03: "$GeneratePoem_Intro_Rhyming_Romance_03_A_01$"
 GeneratePoem_Intro_Rhyming_Romance_03_B_01: "Jaké skryté divy? Co vše v jejím stínu leží?"
 GeneratePoem_Intro_Rhyming_Romance_03_B_02: "[Select_CString( ROOT.Var('poem_subject').Char.IsFemale, 'Vždyť ona je bez chyby, žádná na ní neleží,', 'Vždyť on je bez chyby, žádná na něm neleží,' )]"
 GeneratePoem_Intro_Rhyming_Romance_03_B_03: "Je to štít, či pouhá přetvářka, jež [Select_CString( ROOT.Var('poem_subject').Char.IsFemale, 'ji', 'ho' )] tíží?"
 GeneratePoem_Intro_Rhyming_Mourning_01_A_01: "Ať sebevíc dnů se zkroutí a ubíhá dál,"
 GeneratePoem_Intro_Rhyming_Mourning_01_A_02: "$GeneratePoem_Intro_Rhyming_Mourning_01_A_01$"
 GeneratePoem_Intro_Rhyming_Mourning_01_A_03: "$GeneratePoem_Intro_Rhyming_Mourning_01_A_01$"
 GeneratePoem_Intro_Rhyming_Mourning_01_B_01: "Život bez [Select_CString( ROOT.Var('poem_subject').Char.IsFemale, 'ní', 'něj' )] je jen chorobný močál,"
 GeneratePoem_Intro_Rhyming_Mourning_01_B_02: "Svět se zdá vzdálený, jako by za sklem stál,"
 GeneratePoem_Intro_Rhyming_Mourning_01_B_03: "Chladný vítr v trávě šeptá pouze žal,"
 GeneratePoem_Intro_Rhyming_Mourning_02_A_01: "Když se tak krásná tvář navždy ztratí z očí,"
 GeneratePoem_Intro_Rhyming_Mourning_02_A_02: "$GeneratePoem_Intro_Rhyming_Mourning_02_A_01$"
 GeneratePoem_Intro_Rhyming_Mourning_02_A_03: "$GeneratePoem_Intro_Rhyming_Mourning_02_A_01$"
 GeneratePoem_Intro_Rhyming_Mourning_02_B_01: "Křičíme a bědujeme, bezmoc nás zotročí,"
 GeneratePoem_Intro_Rhyming_Mourning_02_B_02: "Ta bolest jako osobní křivda na nás útočí,"
 GeneratePoem_Intro_Rhyming_Mourning_02_B_03: "Ty, kdo tu zůstali, žal k zemi přitlačí,"
 GeneratePoem_Intro_Rhyming_Mourning_03_A_01: "Jak krutá vládkyně je náhoda zlá,"
 GeneratePoem_Intro_Rhyming_Mourning_03_A_02: "$GeneratePoem_Intro_Rhyming_Mourning_03_A_01$"
 GeneratePoem_Intro_Rhyming_Mourning_03_A_03: "$GeneratePoem_Intro_Rhyming_Mourning_03_A_01$"
 GeneratePoem_Intro_Rhyming_Mourning_03_B_01: "Když světu tak nádherný tanec odnímá,"
 GeneratePoem_Intro_Rhyming_Mourning_03_B_02: "Když [Select_CString( ROOT.Var('poem_subject').Char.IsFemale, 'ji', 'ho' )] bez jediného pohledu stranou dá,"
 GeneratePoem_Intro_Rhyming_Mourning_03_B_03: "Když nás v tom prokletém vytržení dál má,"
 GeneratePoem_Intro_Rhyming_Legacy_01_A_01: "I nejmocnější [ROOT.Var('poem_subject').Char.GetWomenMen] jednou přemůže čas,"
 GeneratePoem_Intro_Rhyming_Legacy_01_A_02: "$GeneratePoem_Intro_Rhyming_Legacy_01_A_01$"
 GeneratePoem_Intro_Rhyming_Legacy_01_A_03: "$GeneratePoem_Intro_Rhyming_Legacy_01_A_01$"
 GeneratePoem_Intro_Rhyming_Legacy_01_B_01: "Však jejich činy, skutky, sláva zůstávají v nás,"
 GeneratePoem_Intro_Rhyming_Legacy_01_B_02: "A dobrých slov se pro ně najde víc než dost zas,"
 GeneratePoem_Intro_Rhyming_Legacy_01_B_03: "I nad říšemi, jež zrodili, nakonec zavládne čas,"
 GeneratePoem_Intro_Rhyming_Legacy_02_A_01: "[ROOT.Var('poem_subject').Char.GetWomenMen|U] se nemusí bát, když nadejde čas umírat,"
 GeneratePoem_Intro_Rhyming_Legacy_02_A_02: "$GeneratePoem_Intro_Rhyming_Legacy_02_A_01$"
 GeneratePoem_Intro_Rhyming_Legacy_02_A_03: "$GeneratePoem_Intro_Rhyming_Legacy_02_A_01$"
 GeneratePoem_Intro_Rhyming_Legacy_02_B_01: "Pokud po sobě velké dílo dokážou zanechat,"
 GeneratePoem_Intro_Rhyming_Legacy_02_B_02: "A s ušlechtilým srdcem tiše smrti se vzdát,"
 GeneratePoem_Intro_Rhyming_Legacy_02_B_03: "Byť žal může pozůstalé na kusy rvát,"
 GeneratePoem_Intro_Rhyming_Legacy_03_A_01: "Kdo by po únavě netoužil v pokoji snít,"
 GeneratePoem_Intro_Rhyming_Legacy_03_A_02: "$GeneratePoem_Intro_Rhyming_Legacy_03_A_01$"
 GeneratePoem_Intro_Rhyming_Legacy_03_A_03: "$GeneratePoem_Intro_Rhyming_Legacy_03_A_01$"
 GeneratePoem_Intro_Rhyming_Legacy_03_B_01: "Ať dokázal sebevíc pokladů a bohatství mít?"
 GeneratePoem_Intro_Rhyming_Legacy_03_B_02: "Ať ve slavné paměti dál může podle svého srdce žít?"
 GeneratePoem_Intro_Rhyming_Legacy_03_B_03: "Ať [Select_CString( ROOT.Var('poem_subject').Char.IsFemale, 'její', 'jeho' )] díla mohou šťastného spáče navěky krýt?"
 GeneratePoem_Intro_Rhyming_Strife_01_A_01: "Když rudý chochol války rozpoutá v [ROOT.Var('poem_subject').Char.GetHerHis] zemi boj,"
 GeneratePoem_Intro_Rhyming_Strife_01_A_02: "$GeneratePoem_Intro_Rhyming_Strife_01_A_01$"
 GeneratePoem_Intro_Rhyming_Strife_01_A_03: "$GeneratePoem_Intro_Rhyming_Strife_01_A_01$"
 GeneratePoem_Intro_Rhyming_Strife_01_B_01: "Bystřejší ruce nikde nenajde nepřátelský voj,"
 GeneratePoem_Intro_Rhyming_Strife_01_B_02: "Takovou ohnivou duši nečekal žádný voj,"
 GeneratePoem_Intro_Rhyming_Strife_01_B_03: "Jen železo blýská a rozkazů burácí roj,"
 GeneratePoem_Intro_Rhyming_Strife_02_A_01: "Kde [Select_CString( ROOT.Var('poem_subject').Char.IsFemale, 'jiné', 'jiní' )] [ROOT.Var('poem_subject').Char.GetWomenMen] svádějí řečí stříbrnou,"
 GeneratePoem_Intro_Rhyming_Strife_02_A_02: "$GeneratePoem_Intro_Rhyming_Strife_02_A_01$"
 GeneratePoem_Intro_Rhyming_Strife_02_A_03: "$GeneratePoem_Intro_Rhyming_Strife_02_A_01$"
