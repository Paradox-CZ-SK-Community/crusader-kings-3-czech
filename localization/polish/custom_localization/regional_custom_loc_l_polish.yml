 trickster_spirit_britannia: "[Glossary( 'pixie', 'PIXIE_GLOSS' )]"
 PIXIE_GLOSS: "Drobný okřídlený duch z keltského a britského folkloru, který si libuje v rozpustilých kouscích a svádění pocestných z cesty."
 trickster_spirit_germania: "[Glossary( 'kobold', 'KOBOLD_GLOSS' )]"
 KOBOLD_GLOSS: "Domácí duch z německého folkloru, který střídavě pomáhá s prací a tropí zlomyslné kousky, když se cítí uražen."
 trickster_spirit_netherlands: "[Glossary( 'kabouter', 'KABOUTER_GLOSS' )]"
 KABOUTER_GLOSS: "Bytost podobná skřítkovi z nizozemského folkloru, která často pomáhá s prací, ale při neúctě tropí různé kousky."
 trickster_spirit_francia: "[Glossary( 'lutin', 'LUTIN_GLOSS' )]"
 LUTIN_GLOSS: "Drobný domácí či lesní duch z francouzského folkloru, známý rozpustilostmi, jako je cuchání vlasů a schovávání předmětů."
 trickster_spirit_iberia: "[Glossary( 'duende', 'DUENDE_GLOSS' )]"
 DUENDE_GLOSS: "Drobný, nepolapitelný šibalský duch z folkloru Pyrenejského poloostrova, který v domácnostech působí menší zmatek."
 trickster_spirit_north: "[Glossary( 'tomte', 'TOMTE_GLOSS' )]"
 TOMTE_GLOSS: "Skandinávský duch, který údajně chrání statky a zvířata, ale při rozhněvání rád tropí neplechu."
 trickster_spirit_east: "[Glossary( 'domovoj', 'DOMOVOI_GLOSS' )]"
 DOMOVOI_GLOSS: "Slovanský domácí duch, který střeží obydlí, ale při urážce či zanedbávání tropí různé kousky."
 trickster_spirit_middle_east: "[Glossary( 'džin', 'DJINN_GLOSS' )]"
 DJINN_GLOSS: "Duch z bezdýmného ohně z blízkovýchodního folkloru, schopný měnit podobu a klamat."
 trickster_spirit_india: "[Glossary( 'rákšasa', 'RAKSHASA_GLOSS' )]"
 RAKSHASA_GLOSS: "Zlovolný měňavec z indické mytologie, zběhlý v iluzích a úskocích."
 trickster_spirit_africa_north: "[Glossary( 'ifrít', 'IFRIT_GLOSS' )]"
 IFRIT_GLOSS: "Ohnivý a vzpurný duch ze severoafrického folkloru, spojovaný s klamem a silou."
 trickster_spirit_africa_west: "[Glossary( 'ninki nanka', 'NINKI_NANKA_GLOSS' )]"
 NINKI_NANKA_GLOSS: "Děsivý duch podobný drakovi ze západoafrických bažin, o němž se věří, že přivodí smrt každému, kdo jej spatří."
 trickster_spirit_africa_east: "[Glossary( 'popobawa', 'POPOBAWA_GLOSS' )]"
 POPOBAWA_GLOSS: "Duch podobný netopýru ze svahilského folkloru, známý tím, že v noci šíří strach pomocí proměn a duševního trýznění."
 trickster_spirit_steppe: "[Glossary( 'Guljabani', 'GULYABANI_GLOSS' )]"
 GULYABANI_GLOSS: "Vysoký chlupatý ghúl z tureckého folkloru, který obchází pustá místa a v noci číhá na osamělé pocestné."
 trickster_spirit_siberia: "[Glossary( 'kutch', 'KUTKH_GLOSS' )]"
 KUTKH_GLOSS: "Havraní duch ze sibiřských tradic, který je zároveň stvořitelem i rozpustilým šibalem."
 trickster_spirit_tibet: "[Glossary( 'ro-langs', 'ROLANGS_GLOSS' )]"
 ROLANGS_GLOSS: "Oživlá mrtvola z tibetského folkloru, známá strnulými pohyby a zlými úmysly."
 trickster_spirit_china: "[Glossary( 'chu-li ťing', 'HULIJING_GLOSS' )]"
 HULIJING_GLOSS: "Čínský liščí duch se schopností měnit podobu, proslulý klamnými a svůdnými úskoky."
 trickster_spirit_korea: "[Glossary( 'kumiho', 'KUMIHO_GLOSS' )]"
 KUMIHO_GLOSS: "Devítiocasý liščí duch z korejské mytologie, který klame lidi a loví je."
 trickster_spirit_japan: "[Glossary( 'tanuki', 'TANUKI_GLOSS' )]"
 TANUKI_GLOSS: "Duch psíka mývalovitého z japonského folkloru, který dokáže měnit podobu a je známý svými přeludy a rozpustilými kousky."
 trickster_spirit_sakhalin_hokkaido: "[Glossary( 'kamaitači', 'KAMAITACHI_GLOSS' )]"
 KAMAITACHI_GLOSS: "Lasičí duch z legend severního Japonska, který se nese na větru a bezbolestně rozřezává lidské maso."
 trickster_spirit_thailand: "[Glossary( 'phi tai hong', 'PHITAIHONG_GLOSS' )]"
 PHITAIHONG_GLOSS: "Pomstychtivý duch z thajských tradic, který povstává z člověka zemřelého náhlou či násilnou smrtí a pronásleduje a svádí lidi z cesty."
 trickster_spirit_malaysia: "[Glossary( 'penanggalan', 'PENANGGALAN_GLOSS' )]"
 PENANGGALAN_GLOSS: "Duch z malajského folkloru, který ve dne klamně působí jako člověk, zatímco v noci se zjevuje jako děsivá létající hlava."
 trickster_spirit_indonesia: "[Glossary( 'ebu gogo', 'EBU_GOGO_GLOSS' )]"
 EBU_GOGO_GLOSS: "Drobní chlupatí lesní duchové z indonéského folkloru, kteří napodobují lidskou řeč a z vesnic kradou jídlo či drobné předměty."
 trickster_spirit_philippines: "[Glossary( 'tikbalang', 'TIKBALANG_GLOSS' )]"
 TIKBALANG_GLOSS: "Vysoký duch s koňskou hlavou z filipínského folkloru, který svádí pocestné z cesty a tropí jim v lesích různé kousky."
 trickster_spirit_borneo: "[Glossary( 'orang bunian', 'ORANG_BUNIAN_GLOSS' )]"
 ORANG_BUNIAN_GLOSS: "Neviditelní lesní duchové z bornejského folkloru, kteří se stýkají s lidmi a někdy je svádějí z cesty či jim tropí neplechu."
 trickster_spirit_maluku: "[Glossary( 'jin kurcaci', 'JIN_KURCACI_GLOSS' )]"
 JIN_KURCACI_GLOSS: "Drobné bytosti lidského vzhledu z folkloru Moluk, které obývají lesy a hory a lidem, s nimiž se setkají, buď pomáhají, nebo tropí neplechu."
 trickster_spirit_italy: "[Glossary( 'mazapégul', 'MAZAPEGUL_GLOSS' )]"
 MAZAPEGUL_GLOSS: "Rozpustilý noční duch z italského folkloru, který obchází ložnice, splétá koňské hřívy a sedá spáčům na hruď, aby jim přivodil noční můry."
 trickster_spirit_balkans: "[Glossary( 'kallikantzaros', 'KALLIKANTZAROS_GLOSS' )]"
 KALLIKANTZAROS_GLOSS: "Zlovolný skřet, který podle pověstí během dvanácti vánočních dnů vychází na svět a působí neplechu a zmatek."
 trickster_spirit_indochina: "[Glossary( 'mrenh kongveal', 'MRENH_KONGVEAL_GLOSS' )]"
 MRENH_KONGVEAL_GLOSS: "Drobní a nepolapitelní duchové z khmerského folkloru, známí rozpustilými kousky a ochranou zvířat a pocestných."
 trickster_spirit_default: "šibalský duch"
