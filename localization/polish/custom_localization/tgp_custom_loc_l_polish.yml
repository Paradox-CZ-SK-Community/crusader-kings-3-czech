 pray_for_rain: "„Musím se modlit za déšť, aby se osud mé rodiny obrátil k lepšímu,“ říká mi hladovějící rolník."
 pray_for_health: "„Musím se modlit, aby se mé matce zlepšilo zdraví,“ říká mi člověk nízkého původu."
 pray_for_gold: "„Prohrál jsem všechny své úspory!“ říká mi zbídačený rolník."
 pray_for_love: "Zaslechnu rolníka, jak říká: „Vím, že je to sobecké, ale je snad špatné modlit se, aby mě někdo miloval? Stárnu a musím se oženit!“"
 BARAY_GLOSS: "Rozlehlá vodní nádrž, obvykle orientovaná od východu na západ. Její architektura měla v jihovýchodní Asii historicky duchovní význam a zároveň sloužila praktickým účelům."
