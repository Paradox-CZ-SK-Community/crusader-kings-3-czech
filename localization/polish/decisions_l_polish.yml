 appoint_a_righteous_caliph_decision_mutazila_variant_desc: "Od skončení mihny byli zastánci stvořenosti Koránu pronásledováni nebo přehlíženi samozvanými chalífy. Vezmu na sebe pomstu za křivdy, které jsme utrpěli, a znovu vynesu mu'tazilskou nauku do popředí islámského myšlení."
 appoint_a_righteous_caliph_decision_general_iranian_variant_desc: "Přestože byl islám do Persie přinesen násilím, nikdo dnes nemůže popřít naši víru v jedinost božstva [ROOT.Char.GetFaith.HighGodNameAlternate]. Naše a arabské způsoby se však rozešly a musíme se jednou provždy odtrhnout od [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName]. Od nynějška povedu [ROOT.Char.GetFaith.GetAdjective] víru osobně."
