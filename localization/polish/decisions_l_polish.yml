 secede_from_empire_decision: "Odtrhnout se od titulu [ROOT.Char.GetLiege.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 secede_from_empire_decision_desc: "[ROOT.Char.GetLiege.GetTitledFirstName] svou neschopností [Select_CString( ROOT.Char.GetLiege.IsFemale, 'připravila', 'připravil' )] titul [ROOT.Char.GetLiege.GetPrimaryTitle.GetNameNoTooltip] o schopnost chránit své poddané před vnitřními i vnějšími nepřáteli. Ani nový vládce by jen stěží napravil všechny způsobené škody.\n\nMnohem moudřejší bude odtrhnout se a vytvořit nové panství, které obstojí či padne vlastními zásluhami, než se nechat stáhnout ke dnu se zbytkem říše."
