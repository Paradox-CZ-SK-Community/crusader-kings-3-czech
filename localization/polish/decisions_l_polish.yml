 adopt_special_succession_decision_effects.tt: "Podle své [Concept('culture','kultury')|El] si můžeš vybrat tradiční formu volitelného [Concept('succession','nástupnictví')|El]\n$EFFECT_LIST_BULLET$Bude použita u všech tvých [Concept('titles','titulů')|El] nejvyšší [Concept('rank','hodnosti')|El] s děleným [Concept('succession','nástupnictvím')|El]"
