 stop_gain_weight_decision_desc: "Nekonečný přísun tučných jídel splnil svůj účel a já už jej nedokážu snášet. Zanechám svého úsilí přibrat na váze."
 stop_gain_weight_decision_tooltip: "Přestaneš se pokoušet přibrat na váze"
 stop_gain_weight_decision_confirm: "Přestat přibírat"
 lose_weight_decision: "Zhubnout"
 lose_weight_decision_desc: "Mé tělo každým dnem slábne a má corpulence mě tíží tělesně i duševně.\n\nBěh, teplé koupele, možná i mírně projímavá látka... Najdu způsob, jak trochu zhubnout."
 lose_weight_decision_tooltip: "Zaměříš se na hubnutí"
 lose_weight_decision_confirm: "Přineste skamoneu!"
 stop_lose_weight_decision: "Přestat hubnout"
 stop_lose_weight_decision_desc: "Vyzkoušel[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsem všechny doporučené tinktury a léčivé prostředky a pokračovat dál by již bylo příliš. Zanechám svého úsilí zhubnout."
 stop_lose_weight_decision_tooltip: "Přestaneš se pokoušet zhubnout"
 stop_lose_weight_decision_confirm: "Přestat hubnout"
 commit_suicide_decision: "Pokusit se o sebevraždu"
 commit_suicide_decision_desc: "Existuje jen temnota a bolest. Lidé mi tvrdí, že se to zlepší, ale jak to mohou vědět? A jak mi to pomůže právě teď? Nastal čas odvrhnout okovy tohoto smrtelného světa."
 commit_suicide_decision_desc_depressed: "$commit_suicide_decision_desc$"
 commit_suicide_decision_desc_incapable: "Přežívám, ale doopravdy nežiji. Můj současný stav mě nutí spoléhat se na ostatní i při těch nejprostších úkonech. Toto jsem si nevybral[Select_CString( ROOT.Char.IsFemale, 'a', '' )] a možná by bylo snazší všechno ukončit..."
 commit_suicide_decision_desc_cancer: "Cítím, jak se ve mně nemoc šíří. To, co začalo jako drobná obtíž, se změnilo v každodenní zápas. Smrt je nevyhnutelná. Chci jen, aby bolest ustala."
 commit_suicide_decision_desc_leper: "Hniloba pevně zachvátila mé smrtelné tělo. Několik prstů na nohou mi již odpadlo a z ran vytéká hnis. Jak dlouho ještě musím snášet tento příšerný osud?"
 commit_suicide_decision_desc_great_pox: "Mé tělo nyní pokrývají neštovice a každý vřed je větší a bolestivější než ten předchozí. V očích svých poddaných nevidím nic než strach a odpor. Bude se to už jen zhoršovat..."
 commit_suicide_decision_desc_lunatic: "Nemohu uniknout neustálému šeptání plnému nenávisti a zklamání. Nabádá mě k věcem, které bych neměl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] dělat. Nic nedává smysl a skutečnost sama sobě odporuje. Vysvobodí mě jedině smrt?"
 commit_suicide_decision_desc_parent: "Nedokážu jít dál. Žal nad ztrátou dítěte mě drží v zajetí. [ROOT.Var('mourning_parent').Char.Custom2('MyCharacterIntroduction', ROOT.Char)|U] pro mě znamenal[Select_CString( ROOT.Var('mourning_parent').Char.IsFemale, 'a', '' )] celý svět. Jaký smysl má žít, když život přišel o jediný zdroj radosti a smíchu?"
 commit_suicide_decision_desc_soulmate: "Už nedokážu snášet prázdnotu ve své duši. Život bez tebe, [ROOT.Var('mourning_soulmate').Char.GetFirstName], je pouhým břemenem. Pokud se mohu vrátit do tvého náručí jedině odchodem z tohoto světa, budiž."
 commit_suicide_decision_desc_friend: "Život je příliš bezútěšný, když jej nemohu sdílet s opravdovým přítelem. Okamžiky, kterým bychom se s [ROOT.Var('mourning_friend').Char.GetFirstName] celé hodiny smáli, mě nyní naplňují jen zoufalstvím. Tato cesta osamění není pro mě."
 commit_suicide_decision_desc_demoted: "Jen málokdo zažil takové ponížení jako já. Kdysi jsem stál[Select_CString( ROOT.Char.IsFemale, 'a', '' )] na vrcholu, ale nyní se musím plazit jako všichni ti hlupáci. Možná bych měl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] vzít svůj osud do vlastních rukou a odejít způsobem, který si sám[Select_CString( ROOT.Char.IsFemale, 'a', '' )] zvolím."
 commit_suicide_decision_desc_divorce: "Dny trávím utápěním se v lítosti. Co jsem mohl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] udělat, abych zabránil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] tomuto bolestnému rozchodu? Jak mohu obnovit ztracenou lásku? Je to beznadějné. Bez svého manželství nejsem nic."
 commit_suicide_decision_desc_witch: "Má fascinace tajemnými naukami mě zavedla na osamělou a nebezpečnou cestu. Za svou zvědavost jsem však zaplatil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] strašlivou cenu. Kvůli svému přesvědčení jsem zavrhován[Select_CString( ROOT.Char.IsFemale, 'a', '' )]. Obávám se, že mě nikdy nepřijmou takového[Select_CString( ROOT.Char.IsFemale, 'u', '' )], jaký[Select_CString( ROOT.Char.IsFemale, 'á', '' )] jsem."
 commit_suicide_decision_desc_cannibal: "V jak pokřivené společnosti to žijeme! Hodování na znamenité pochoutce, jakou je lidské maso, je jedinou věcí, která mi přináší radost. Nechci dál žít ve světě, který mi to zakazuje!"
 commit_suicide_decision_desc_sodomite: "Osud mi rozdal kruté karty. Proč musím být pronásledován[Select_CString( ROOT.Char.IsFemale, 'a', '' )] za touhy svého srdce? Nemohu za to, že jsem se tak narodil[Select_CString( ROOT.Char.IsFemale, 'a', '' )]. Jestli mě odsuzují za života, přijmou mě alespoň po smrti?"
 commit_suicide_decision_desc_deviant: "Kdo jsou, aby mě soudili? Mé chlípné výpravy mě možná zavedly na mnoho překvapivých cest, ale všechny vedly k nesmírné rozkoši. Bez těchto tělesných slastí nemám pro co žít."
 commit_suicide_decision_desc_criminal: "Své minulosti nemohu uniknout. Ať jdu kamkoli, cítím na sobě odsuzující pohledy. Jak se to mohlo stát? Proč jsem dovolil[Select_CString( ROOT.Char.IsFemale, 'a', '' )], aby to zašlo tak daleko? Doufám, že mi po smrti budou mé zločiny odpuštěny."
 commit_suicide_decision_desc_stressed: "Den za dnem tlak narůstá. Ať jdu kamkoli a dělám cokoli, brzy je toho příliš. Všechno se vymyká kontrole. Musí to skončit!"
 commit_suicide_decision_tooltip: "Nastal čas odejít z tohoto světa"
 commit_suicide_decision_effect_tooltip: "@warning_icon! Pokusíš se ukončit svůj život. Opravdu si to přeješ?"
