 mpo_pleasure_dome_tt: "V jednom z tvých baronství se odemkne slot [Concept('special_building','zvláštní budovy')|El]."
 mpo_pleasure_dome_decision_desc: "Když jsou mé země zajištěny a domov uspořádán, mé myšlenky se přirozeně obracejí k tomu, jakou stopu bych mohl na tomto světě zanechat. Co by mohlo být lepší než palác dokonalé nádhery? Místo, kde vysoké fontány tryskají vínem a zahradami v celé jejich majestátnosti zurčí potůčky."
