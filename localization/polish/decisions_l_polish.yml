 court_astrologer_events.0001.desc: "Sleduji [astrologer.GetFirstName], jak pokládá na zem dvě rákosové stonky v určité vzdálenosti od sebe. Rty se sotva pohybují při odříkávání zaklínadel a oči sledují, jak se stonky dotýkané větrem přibližují.\n\nJeden z nich přemůže druhý – nese váhu mnohem těžší než jeho vlastní tělo. Nebesa promluvila."
