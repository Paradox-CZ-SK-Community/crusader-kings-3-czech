 establish_norman_culture_decision: "Vytvořit normanskou kulturu"
 establish_norman_culture_decision_desc: "Naše staré tradice nám v novém domově neslouží dobře. Měli bychom se obrátit k místním a zjistit, čemu se od nich můžeme naučit."
 establish_norman_culture_decision_confirm: "Normandie povstává!"
