 isolating_modifier_desc: "Tato postava se uchýlila do ústraní, čímž znemožnila většinu způsobů komunikace s okolním světem a připravila se o moc a vliv.\n\n[Concept('infection_chance','Pravděpodobnost nákazy')|El]: #P -75%#!\nRiziko úmrtí při [Concept('disasters','pohromách')|El]: #P -75%#!"
 epidemic_events.0100.t: "Izolace"
 epidemic_events.0100.desc: "Pozdě v noci jsme se s rodinou nechali odvézt daleko od puchu srdce hlavního sídla. Nyní můžeme zůstat stranou od lidu panství, dokud nenastane správný čas znovu vyjít ven.\n\nKomunikace bude omezená a má nepřítomnost citelná, ale za našimi čtyřmi skromnými zdmi bychom měli zůstat v bezpečí před okolní smrtí a rozkladem."
 epidemic_events.0100.a: "Zamknout dveře."
 epidemic_events.0101.t: "Ven z klece"
 epidemic_events.0101.desc: "Slunce na mé kůži působí cize a nepřátelsky, vítr je chladný a dotěrný.\n\nKdy jsem naposledy [Select_CString( ROOT.Char.IsFemale, 'vdechla', 'vdechl' )] vzduch takový, jaký jej stvořil [ROOT.Char.GetFaith.HighGodName|U]?"
 epidemic_events.0101.a: "Je tak dobré být zpět!"
 epidemic_events.0101.b: "Zavřete dveře! Táhne sem!"
 natural_disaster.0110.t: "Izolace"
 natural_disaster.0110.desc: "Pozdě v noci jsme se s rodinou vytratili ze srdce hlavního sídla. Nyní můžeme na bezpečnějším místě zůstat stranou od lidu panství, dokud se neobnoví přirozený řád.\n\nKomunikace bude omezená a má nepřítomnost citelná, ale měli bychom zůstat v bezpečí před hněvem přírody."
 natural_disaster.0110.a: "Zamknout dveře."
