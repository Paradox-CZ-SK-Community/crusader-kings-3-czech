 establish_norman_culture_decision_effect.tt.2: "[normandy_title.GetName] bude přejmenována na $d_normandy$"
 form_the_kingdom_of_aragon_decision: "Založit Aragonské království"
 form_the_kingdom_of_aragon_decision_desc: "Děti mohutné řeky Ebro byly po staletí odsouvány stranou. Římany, Vizigóty, Franky i Araby. Dokud budou dřít pro cizí dobyvatele a vzdálená hlavní města, jejich země jim nebudou skutečně náležet a lid bude volat po vlastním místním království."
 form_the_kingdom_of_aragon_decision_confirm: "Náš domov, naše království!"
 form_the_kingdom_of_aragon_decision_tooltip: "Založ Aragonské království"
 form_the_kingdom_of_aragon_decision.tt.form_aragonese: "Budeš moci rozhodnout, zda zkopírovat [Concept('culture_pillars','kulturní pilíře')|El] z [founder_culture.GetName] kultury do [aragonese_culture.GetName] kultury"
 form_the_kingdom_of_aragon_decision.tt.drift.d_valencia: "Pokud [Concept('completely_control','zcela ovládáš')|El] [d_valencia.GetDefinitiveName], tento titul bude [Concept('de_jure_drift_drifted','de iure začleněn')|El] do [k_aragon.GetDefinitiveName]."
 form_the_kingdom_of_aragon_decision.tt.drift.d_barcelona: "Pokud [Concept('completely_control','zcela ovládáš')|El] [d_barcelona.GetDefinitiveName], tento titul bude [Concept('de_jure_drift_drifted','de iure začleněn')|El] do [k_aragon.GetDefinitiveName]."
 form_the_kingdom_of_aragon_decision.tt.drift.d_navarra: "Pokud [Concept('completely_control','zcela ovládáš')|El] [d_navarra.GetDefinitiveName], tento titul bude [Concept('de_jure_drift_drifted','de iure začleněn')|El] do [k_aragon.GetDefinitiveName]."
 convert_to_local_culture_decision: "Přijmout místní kulturu"
 convert_to_local_culture_decision_desc: "Popravdě mé tradice od tradic lidu v mém hlavním sídle téměř nic neodlišuje. Slavíme stejné svátky, pořádáme stejné veřejné slavnosti a dokonce i naše jazyky se staly téměř totožnými."
 convert_to_local_culture_decision_confirm: "Přijímám, kým jsem"
