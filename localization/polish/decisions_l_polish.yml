 diligent_development_focus_decision_desc: "Sním o tom, že [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] bude jednou předmětem závisti každého vládce pod nebem. Musím se stát tím, kdo z tohoto místa učiní klenot země. Stačí jen přidat trochu více práce...\n\nKdo ostatně potřebuje spát?"
 diligent_development_focus_decision_tooltip: "Zlepši rozvoj svého hlavního sídla"
