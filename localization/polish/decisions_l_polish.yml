 negotiate_the_danelaw_integrate_duchies_decision.duchies_within_danelaw.tt: "Musíš [Concept('completely_control','zcela ovládat')|El] alespoň jedno [Concept('duchy','vévodství')|El] v titulu $k_danelaw_article$$k_danelaw$"
 negotiate_the_danelaw_integrate_duchies_decision.duchies_within_england.tt: "Musíš [Concept('completely_control','zcela ovládat')|El] alespoň jedno [Concept('duchy','vévodství')|El] v titulu $k_england$"
