 major_decisions.3200.t: "Sjednocený titul [rightful_title.GetNameNoTierNoTooltip]"
 major_decisions.3200.desc: "Jako [rightful_liege.Custom('GetQueenKing')|l] trůnů [rightful_title.GetNameNoTier] a [destroyed_title.GetNameNoTier] se [rightful_liege.GetTitledFirstName] [Select_CString( rightful_liege.IsFemale, 'rozhodla', 'rozhodl' )], že nastal čas vládnout oběma z [rightful_liege.GetCapitalLocation.GetTitle.GetNameNoTier].\n\nNa [Select_CString( rightful_liege.IsFemale, 'její', 'jeho' )] vazaly již nebude pohlíženo jako na dva národy pod vládou jediného [rightful_liege.Custom('GetQueenKing')|l], nýbrž jako na lid jediného království."
 major_decisions.3200.a: "A tak pokračuje vláda [rightful_liege.GetCulture.GetNameNoTooltip] tyrana..."
 major_decisions.3200.b: "Pro blaho celého titulu [rightful_title.GetNameNoTierNoTooltip]."
 major_decisions.3300.t: "Vzestup Kartága"
 major_decisions.3300.desc: "Ze zasolené půdy povstává nová říše, obnovená ve své někdejší slávě. Zanedlouho naplní obchodní lodě přístavy bohatstvím a vláda nad Středozemním mořem bude naše.\n\nTam, kde velký Hannibal utrpěl trpkou porážku, povstanu já, abych znovu získal naše dědictví. Svět opět pozná skutečnou moc Kartága.\n\nJeště nás čeká mnoho práce, ale nyní stojím #EMP vítězně! #!"
 major_decisions.3300.a: "Přijmu dávné zvyky."
 major_decisions.3300.b: "Utvořím říši podle svých představ."
 major_decisions.3600.t: "Vzestup kozáků"
 major_decisions.3600.desc: "Po celé generace nacházeli svobodní muži a ženy, ať už dobrodruzi, vyhnanci či zločinci, cestu do kaspických stepí.\n\nTito lidé, někdy nazývaní „Kazaky“, žili podle vlastních zákonů. Kumáni však drželi tyto svobodné lidi pod svou mocí a ovládali stepi. [founder_culture.GetCollectiveNoun] pod mou vládou považují tyto Kazaky za své příbuzné a každým dnem jich mezi sebou vítáme více.\n\nMožná nastal čas společně uchopit nový osud?"
 major_decisions.3600.a: "My kozáci budeme žít svobodně pod nekonečným nebem."
 major_decisions.3600.b: "Budu jim vládnout, ale zachovám staré způsoby."
 cossack_custom_de_jure: "[Concept('duchies','Vévodství')|El] [GetTitleByKey('d_tana').GetBaseNameNoTier], [GetTitleByKey('d_red_levedia').GetBaseNameNoTier], [GetTitleByKey('d_levedia').GetBaseNameNoTier], [GetTitleByKey('d_don_valley').GetBaseNameNoTier] a [GetTitleByKey('d_itil').GetBaseNameNoTier] se stanou [Concept('de_jure','de iure')|El] [Concept('vassals','vazaly')|El] titulu [GetTitleByKey('k_cossack').GetDefinitiveName]"
