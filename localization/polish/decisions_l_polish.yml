 found_kingdom_of_livonia_decision: "Vyhlásit Terru Marianu"
 found_kingdom_of_livonia_decision_desc: "Baltové po staletí neměli království, které by mohli nazývat vlastním. Tato drsná, nezkrocená země kmenů a rozličných pohanských věr dlouho postrádala společnou identitu, ale snad to všechno změním..."
 found_kingdom_of_livonia_decision_tooltip: "Livonsko se stane [Concept('de_jure','de iure')|El] [Concept('kingdom','královstvím')|El]"
 found_kingdom_of_livonia_decision_confirm: "[ROOT.Char.GetLadyLord|U] všech Baltů!"
 introduce_a_new_fashion_at_court_decision: "Zavést u dvora novou módu"
 introduce_a_new_fashion_at_court_decision_desc: "Žádný dvůr se nám nemůže rovnat ve vytříbenosti! Dvůr je bojištěm módy a nejvyšší čas, abych se pokusil mezi šlechtou zavést nový styl..."
 introduce_a_new_fashion_at_court_decision_tooltip: "Pokus se výměnou za [Concept('prestige','prestiž')|El] zavést u dvora novou módu."
 introduce_new_fashion_duel_tooltip: "Někdo u dvora se s tebou může střetnout v [Concept('diplomacy','diplomacii')|El], aby zavedení tvého stylu zabránil."
 introduce_a_new_fashion_at_court_decision_confirm: "Za nový styl a eleganci!"
 court_already_has_a_fashion_tend_tt: "U dvora již panuje módní trend."
 court_amenities_interactions.0010.b_turned_down: "Všichni nový styl milují!"
 court_amenities_interactions.0010.t: "Nová móda u dvora"
 court_amenities_interactions.0010.desc_intro: "[actor.GetNameNoTooltip|U] [Select_CString( actor.IsFemale, 'vtrhla', 'vtrhl' )] ke dvoru a svým nanejvýš podivným oděvem [Select_CString( actor.IsFemale, 'upoutala', 'upoutal' )] pozornost všech pánů a dam panství."
 court_amenities_interactions.0010.desc.flag_big_collar: "[Select_CString( actor.IsFemale, 'Oblékla si', 'Oblékl si' )] oděv ozdobený límcem o obvodu vozového kola"
 court_amenities_interactions.0010.desc.flag_head_dress: "Tradiční pokrývku hlavy nosí nakřivo posazenou k jedné straně, čímž vytváří zpotvořenou karikaturu [actor.GetCulture.GetName] kultury"
 court_amenities_interactions.0010.desc.flag_gold_boots: "[Select_CString( actor.IsFemale, 'Těžce kráčela', 'Těžce kráčel' )] velkou síní v [debate_locale.GetNameNoTierNoTooltip] a [Select_CString( actor.IsFemale, 'její', 'jeho' )] celokovové boty se zlatým vykládáním svou nesmírnou vahou téměř drtily podlahu"
 court_amenities_interactions.0010.desc.flag_sleeveless: "Ze svého vznešeného oděvu [Select_CString( actor.IsFemale, 'odstranila', 'odstranil' )] rukávy"
 court_amenities_interactions.0010.desc.flag_commoner_clothes: "Do [debate_locale.GetNameNoTierNoTooltip] [Select_CString( actor.IsFemale, 'vstoupila', 'vstoupil' )] oděn jako neurozený venkovan"
 court_amenities_interactions.0010.desc_outro: "a [Select_CString( actor.IsFemale, 'opovážila', 'opovážil' )] se to prohlásit za nejnovější módu panství! Zdá se, že tomu všichni hlupáci u dvora podléhají, ale mám pozvednout ruku a učinit tomuto šílenství přítrž?"
 court_amenities_interactions.0010.a_flag_big_collar: "„Vypadáš jako pták, který spolkl talíř!“"
 court_amenities_interactions.0010.a: "„Co to máš #EMP na sobě#!?“"
 court_amenities_interactions.0010.b: "Kousnout se do rtu a pokusit se nesmát."
 court_amenities_interactions.0010.a.tt_success: "Přesvědčíš dav, že [actor.GetNameNoTooltip] má směšný oděv"
 court_amenities_interactions.0010.a.tt_failure: "Dav s tebou nesouhlasí a oděv, který má [actor.GetNameNoTooltip] na sobě, považuje za nový módní trend"
 court_amenities_interactions.0011.t: "Móda a sváry"
 court_amenities_interactions.0011.desc_intro: "Pyšně se procházím po svém dvoře a okázale předvádím svůj nový odvážný styl,"
 court_amenities_interactions.0011.desc.flag_big_collar: "přičemž můj oděv zdobí obrovský kulatý límec, který mohou všichni obdivovat."
 court_amenities_interactions.0011.desc.flag_head_dress: "obvyklou pokrývku hlavy mám posazenou nakřivo, čímž tomuto jinak starému a fádnímu kusu oděvu dodávám něco nového a svěžího."
 court_amenities_interactions.0011.desc.flag_gold_boots: "mé těžké zlaté boty se třpytí ve světle síně v [debate_locale.GetNameNoTierNoTooltip]."
 court_amenities_interactions.0011.desc.flag_sleeveless: "můj nový oděv bez rukávů odhaluje mé paže všem přítomným!"
 court_amenities_interactions.0011.desc.flag_commoner_clothes: "a kladu si otázku, proč se šlechta musí oblékat tak odlišně od prostého lidu, když je jednoduchost tak elegantní."
 court_amenities_interactions.0011.desc_bridge: "[recipient.Custom2('MyCharacterIntroduction', ROOT.Char)] na mě přes celou síň pokřikuje.\n\nVyměňujeme si urážky a já hájím očividně vytříbenou módu, která dalece přesahuje chápání tak prosté mysli."
 court_amenities_interactions.0011.desc_won: "Místní šlechta se kolem mě shromažďuje, takže mohu svůj módní počin považovat za ohromný úspěch!"
 court_amenities_interactions.0011.desc_lost: "Šlechta z [debate_locale.GetNameNoTierNoTooltip] se rychle přidává k [recipient.GetNameNoTooltip] a vysmívá se mému oděvu. Je zřejmé, že můj módní počin byl svou dobou krutě nedoceněn."
 court_amenities_interactions.0011.a_won: "Já přece vždy vím nejlépe!"
 court_amenities_interactions.0011.a_lost: "Oni mi zkrátka #EMP nerozumějí#!!"
 court_amenities_interactions.0012.desc_intro: "„Někteří z nás následují a jiní vedou.“ [actor.GetNameNoTooltip] neochvějně trvá na tom směšném oděvu.\n\nNásledující hodiny trávíme debatou o podstatě vysoké módy, zatímco nás sleduje hlouček dvořanů a já častuju toho hlupáka jednou urážkou za druhou."
 court_amenities_interactions.0012.desc_won: "Zanedlouho se ke mně ve výsměchu postavě [actor.GetNameNoTooltip] přidává mnoho dalších dvořanů a já vím, že má práce je u konce."
 court_amenities_interactions.0012.desc_lost: "Dav mé argumenty bohužel nepřesvědčily a během několika dní jsem u dvora jediný, kdo se #EMP neobléká#! jako [actor.GetNameNoTooltip]."
 court_amenities_interactions.0012.desc_lost.kof: "A nejen to – mnozí začali [actor.GetNameNoTooltip] říkat „[actor.GetTitleAsNameNoTooltip] módy“."
 court_amenities_interactions.0012.a_lost: "Obklopují mě pochlebovači a hlupáci!"
 court_amenities_interactions.0013.desc: "Postupem času mi mnozí v [debate_locale.GetNameNoTierNoTooltip] začali říkat [actor.GetTitleAsNameNoTooltip] módy!"
 court_amenities_interactions.0013.a: "Sláva titulu [actor.GetTitleAsNameNoTooltip]!"
