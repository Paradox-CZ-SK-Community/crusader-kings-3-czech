 roman_restoration.1211.t: "Zmařený Justiniánův sen"
 roman_restoration.1211.desc.intro: "Po staletí se Byzantinci drželi svých posledních opěrných bodů na Apeninském poloostrově, zarývali do země zkrvavené nehty a odmítali se pustit, ať jsme do nich kopali sebevíc.\n\nTomu je konec. Dnes je jejich sevření konečně natolik slabé, že je lze jednou provždy odtrhnout, a já zajistím, aby se o tom dozvěděl celý svět.\n\n"
 roman_restoration.1211.desc.body.emperor_exists: "[emperor.GetTitledFirstNameNicknamed] může zuřit a hřímat, jak je libo – pokud se vůbec obtěžuje všimnout si odtržené provincie daleko od svého pohodlného paláce – ale nemůže mě zastavit."
 roman_restoration.1211.desc.body.emperor_absent: "Proti mému prohlášení nemůže protestovat ani žádný císař. Ubohé."
 roman_restoration.1211.desc.outro: "\n\nZbývá jediná otázka... Kam podle mě nyní krásný titul [GetTitleByKey('k_sicily').GetNameNoTier] patří?"
 roman_restoration.1211.a: "Se svými severními bratry jsme spojeni navěky."
 roman_restoration.1211.b: "Osud Sicílie leží, jako vždy, za mořem."
 roman_restoration.1211.c: "Přece k titulu [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]!"
 roman_restoration.1212.t: "$roman_restoration.1211.t$"
 roman_restoration.1212.desc.intro: "Po staletích houževnatého a odhodlaného odporu proti nejrůznějším barbarským hordám, které plenily poslední zbytky naší dávné vlasti, se [taker.GetTitledFirstName] konečně podařilo to, v čem tolik jiných selhalo.\n\nTen prašivý pes odstranil poslední zbytky římské moci na západním poloostrově,"
 roman_restoration.1212.desc.new_empire.italia: " a místo toho území pevně přičlenil k titulu [GetTitleByKey('e_italy').GetNameNoTier]."
 roman_restoration.1212.desc.new_empire.maghreb: " a spolu s titulem [GetTitleByKey('e_maghreb').GetNameNoTier] je začlenil do africké sféry."
 roman_restoration.1212.desc.new_empire.own: " a připojil území ke svému vlastnímu panství [taker.GetPrimaryTitle.GetBaseNameNoTier]."
 roman_restoration.1212.desc.outro.territory_left: "\n\nNěkolik roztroušených a nepatrných opěrných bodů, které nám zůstaly, nemůže tomuto výsměchu klást skutečný odpor."
 roman_restoration.1212.desc.outro.no_territory_left: "\n\nKdyž nám na jihu nezůstal ani jediný přístav, nemůžeme proti této nespravedlnosti nic podniknout."
 roman_restoration.1212.a: "Ten opovážlivý hulvát!"
 roman_restoration.1213.t: "$roman_restoration.1211.t$"
 roman_restoration.1213.desc.intro: "Přestože Římané v průběhu staletí prolili za svá italská území celé moře krve, [taker.GetTitledFirstNameNicknamed] je nakonec [Select_CString( taker.IsFemale, 'donutila', 'donutil' )] přiznat, že [GetTitleByKey('k_sicily').GetNameNoTier] je pro ně ztracená.\n\nTyto země nyní vzhlížejí k"
 roman_restoration.1213.desc.new_empire.italia: " zbytku poloostrova, od něhož očekávají pomoc."
 roman_restoration.1213.desc.new_empire.maghreb: " svým africkým sousedům za mořem a považují se za součást dávného společenství s titulem [GetTitleByKey('e_maghreb').GetNameNoTier]."
 roman_restoration.1213.desc.new_empire.own: " vlastnímu titulu [taker.GetPrimaryTitle.GetBaseName] jako k #EMP nové#! říši."
 roman_restoration.1213.desc.body.emperor_exists: "[emperor.GetTitledFirstName] protestuje právě tolik, kolik lze při ztrátě bezvýznamnější provincie očekávat, ale ani o trochu více."
 roman_restoration.1213.desc.body.emperor_absent: "Bez císaře, který by vyjádřil odpor, římská Itálie umírá s tichým zakňučením."
 roman_restoration.1213.desc.outro.territory_left: "\n\nNěkolik zbývajících opěrných bodů říše za Jaderským mořem nyní působí ohroženěji než kdy dřív."
 roman_restoration.1213.desc.outro.no_territory_left: "\n\nKdyž v těchto ztracených zemích nezůstalo ani jediné římské město, nemá smrt Justiniánova snu kdo oplakávat."
 roman_restoration.1213.a: "Jen ať táhnou!"
 roman_restoration.1213.b: "V jak temných časech to žijeme..."
