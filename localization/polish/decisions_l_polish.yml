 invite_poets_decision: "Pozvat básníky"
 invite_poets_decision_desc: "Pečuji o krásná umění a chráním všechny, kdo si váží slov, a proto se sluší shromáždit v mém salonu více básníků. Vyšlu heroldy, aby mým poddaným oznámil, že hledám obratné mistry slova."
 invite_poets_decision.tt: "Během nadcházejících měsíců dorazí do tvého tábora alespoň #P 3#! básníci s hodnotou [Concept('diplomacy','diplomacie')|El] #V [SCOPE.ScriptValue('invite_poets_decision_standard_value')|0]#! nebo vyšší\n$EFFECT_LIST_BULLET$Ve vzácných případech mohou dorazit mimořádně schopní uchazeči"
 invite_poets_decision_tooltip: "Básníci obdrží pozvání k tvému dvoru"
 minor_decisions.0004.t: "[Select_CString( poet.IsFemale, 'Dorazila básnířka', 'Dorazil básník' )]"
 minor_decisions.0004.desc: "[poet.GetTitledFirstName] [Select_CString( poet.IsFemale, 'vyslyšela mé pozvání a dorazila jako má hostka', 'vyslyšel mé pozvání a dorazil jako můj host' )]"
 invite_poets_decision_confirm: "$invite_knights_decision_confirm$"
 invite_claimants_decision: "Pozvat pretendenty"
 invite_claimants_decision_desc: "K rozšíření svého panství potřebuji platné nároky na cizí země. Naštěstí existuje mnoho pretendentů, kteří by se výměnou za vojenskou podporu ochotně stali mými vazaly."
 invite_claimants_decision.tt: "Pravděpodobnost, že k tvému dvoru dorazí jako [Concept('guests','hosté')|El] [Concept('claimants','pretendenti')|El] s relevantními [Concept('claims','nároky')|El], se na #V 5#! let výrazně zvýší"
 invite_claimants_decision_confirm: "Vyslat heroldy"
 minor_decisions.0002.t: "[Select_CString( claimant.IsFemale, 'Dorazila pretendentka', 'Dorazil pretendent' )]"
 minor_decisions.0002.desc: "[claimant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString( claimant.IsFemale, 'vyslyšela mé volání a dorazila ke dvoru jako má hostka', 'vyslyšel mé volání a dorazil ke dvoru jako můj host' )]"
 invite_claimants_decision_tooltip: "[Concept('claimants','Pretendenti')|El] obdrží pozvání k tvému dvoru"
 scrape_the_barrel_decision: "Sáhnout až na dno"
 scrape_the_barrel_decision_desc: "Můj královský dvůr postrádá schopné jedince k obsazení mnoha dvorských úřadů nezbytných pro prosperitu panství na úrovni [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]!\n\nMému dvoru schází velkolepost, kterou si zaslouží, ale řešení se možná skrývá na tom nejméně očekávaném místě..."
 scrape_the_barrel_decision_tooltip: "Najmeš [Concept('lowborn','neurozenou postavu')|El] k obsazení náhodného [Concept('court_position','dvorského úřadu')|El]"
 scrape_the_barrel_decision.tt: "$scrape_the_barrel_decision_tooltip$"
 scrape_the_barrel_decision_confirm: "Zahájit pátrání!"
 minor_decisions.0003.t: "Na samém dně"
 minor_decisions.0003.desc.opening: "Při pročesávání oblasti [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ke mně přivlekli [barrel_character.GetName]!"
 minor_decisions.0003.desc.diseased: "Přede mnou stojí [Select_CString( barrel_character.IsFemale, 'nemocná venkovanka pokrytá', 'nemocný venkovan pokrytý' )] špínou a zaschlými zvratky a v očích se sotva zračí vědomí."
 minor_decisions.0003.desc.physical: "Přede mnou stojí [Select_CString( barrel_character.IsFemale, 'venkovanka', 'venkovan' )] nanejvýš neobvyklého vzhledu a hledí na mě v šoku a posvátné bázni, jako by ve mně [Select_CString( barrel_character.IsFemale, 'spatřovala', 'spatřoval' )] [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself]. Okolnosti [Select_CString( barrel_character.IsFemale, 'jejího', 'jeho' )] narození [Select_CString( barrel_character.IsFemale, 'jí', 'mu' )] zjevně způsobily nezměrnou bolest a vedly k zavržení prostým lidem z oblasti [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 minor_decisions.0003.desc.maimed: "Zdá se, že [Select_CString( barrel_character.IsFemale, 'tato žena zakusila', 'tento muž zakusil' )] více násilí a krutosti, než by komukoli náleželo, a na těle nese stopy každé pěsti a čepele, které [Select_CString( barrel_character.IsFemale, 'ji', 'ho' )] srazily k zemi a zohavily."
 minor_decisions.0003.desc.criminal: "[Select_CString( barrel_character.IsFemale, 'Tuto ubožačku', 'Tohoto ubožáka' )] vytáhli ze žaláře, kde [Select_CString( barrel_character.IsFemale, 'byla uvězněna', 'byl uvězněn' )] za nevýslovné zločiny proti koruně; nyní doufá v milost výměnou za své schopnosti."
 minor_decisions.0003.desc.ewan: "Musím se dívat na [Select_CString( barrel_character.IsFemale, 'ženu', 'muže' )] jako z odporné noční můry, sotva připomínající lidskou bytost. Ubohé stvoření je tak zubožené nemocemi, deformacemi a zraněními, že musí být dílem čarodějnictví, když vůbec dokáže stát!"
 minor_decisions.0003.desc.criminal_bridge: "\n\nAčkoli jde o [Select_CString( barrel_character.IsFemale, 'usvědčenou zrádkyni', 'usvědčeného zrádce' )],"
 minor_decisions.0003.desc.bridge_1: "\n\nNavzdory svému postižení,"
 minor_decisions.0003.desc.bride_2: "vyšlo najevo, že je to [Select_CString( barrel_character.IsFemale, 'schopná', 'schopný' )]"
 minor_decisions.0003.desc.educated: "[Select_CString( barrel_character.IsFemale, 'učenka', 'učenec' )], jež navzdory svému nízkému postavení jakýmsi způsobem ovládá písmo. Mám za to, že [barrel_character.GetNameNoTooltip] by dvoru ve věcech víry, učenosti či zdraví dobře [Select_CString( barrel_character.IsFemale, 'posloužila', 'posloužil' )]."
 minor_decisions.0003.desc.cunning: "[Select_CString( barrel_character.IsFemale, 'podvodnice, která', 'podvodník, který' )] si plní měšec tím, že místní připravuje o každou minci, kterou z nich dokáže vymámit. Taková lstivost a hbité prsty by se mi po boku hodily při naslouchání šepotu, který se line dvorem, a trestání těch, kdo se proviní proti koruně."
 minor_decisions.0003.desc.charismatic: "[Select_CString( barrel_character.IsFemale, 'diplomatka', 'diplomat' )] se znalostí jazyka [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip], která se vyrovná kterémukoli šlechtici! Podmanivé charisma a neobvyklý vzhled nepochybně upoutají každého cizího šlechtice, který navštíví můj dvůr."
 minor_decisions.0003.desc.organised: "[Select_CString( barrel_character.IsFemale, 'obchodnice', 'obchodník' )] se znalostmi financí a organizace, které dalece přesahují vše, co bych očekával od obyčejného venkovana. Nepochybně je škoda, aby takový talent zůstával mezi neurozenými; [ROOT.Char.GetFaith.HighGodName] si jistě přeje [Select_CString( barrel_character.IsFemale, 'její', 'jeho' )] povýšení mezi šlechtu a službě u mého dvora."
 minor_decisions.0003.desc.strong: "[Select_CString( barrel_character.IsFemale, 'vůdkyně', 'vůdce' )] se zkušenostmi z nesčetných vítězných šarvátek, vedoucí vlastní tlupu lotrů od jednoho nájezdu ke druhému. Takový talent je nepochybně promrháván válením se ve směsi bláta a krve a pácháním drobných krádeží na venkově; místo toho by [Select_CString( barrel_character.IsFemale, 'měla obléci', 'měl obléci' )] královské regálie a připojit se k mému vznešenému dvoru!"
 minor_decisions.0003.desc.outro: "Má rada určila úřad, pro který má [barrel_character.GetNameNoTooltip] nejlepší předpoklady. Zbývá už jen otázka, zda to skutečně chci dotáhnout do konce."
 minor_decisions.0003.a: "Samozřejmě! Vítej mezi šlechtou, [barrel_character.GetNameNoTooltip]!"
 minor_decisions.0003.b: "Tomuto #EMP tvorovi#! sluší jedině poprava."
 minor_decisions.0003.c: "[ROOT.Char.GetFaith.HighGodName], přiveď mi někoho jiného!"
 minor_decisions.0003.d: "Ehm, tak zoufalá situace ještě není..."
 revoke_false_conversion_decision: "Odhalit pravou víru"
 revoke_false_conversion_decision.tt: "Veřejně se navrať ke své dřívější [Concept('faith','víře')|El]"
 revoke_false_conversion_decision.desc: "#F Ačkoli se oficiálně hlásím k víře [ROOT.Char.GetFaith.GetAdjectiveNoTooltip], nedokážu se vzdát mnoha osobních obřadů a skrytých přesvědčení svých předků. Možná byly staré způsoby skutečně lepší?#!"
 revoke_false_conversion_decision.desc.tt: "Veřejně se navrátíš ke své předchozí [Concept('faith','víře')|El]. Tví [Concept('vassals','vazalové')|El] a členové tvé [Concept('close_family','blízké rodiny')|El] mohou konvertovat s tebou"
 revoke_false_conversion_decision.desc.tt_landless: "Navrátíš se ke své předchozí [Concept('faith','víře')|El]. Členové tvé [Concept('close_family','blízké rodiny')|El] mohou konvertovat s tebou."
 revoke_false_conversion_decision.desc.tt_own_faith_counties: "Pokud je tvé panství [Concept('independent','nezávislé')|El], [Concept('counties','hrabství')|El] ve tvém [Concept('realm','panství')|El] s modifikátorem [GetModifier('false_convert_modifier').GetNameWithTooltip] mohou konvertovat s tebou, pokud tajně vyznávají tutéž [Concept('faith','víru')|El]"
 revoke_false_conversion_decision_confirm: "Vydat prohlášení"
 encourage_confession_of_false_conversions_decision: "Amnestie pro tajné věřící"
 encourage_confession_of_false_conversions_decision.tt: "Skrytí vyznavači mohou odhalit svou tajnou [Concept('faith','víru')|El]"
 encourage_confession_of_false_conversions_decision.desc: "#F Je veřejným tajemstvím, že v mém panství žijí skrytí vyznavači, kteří svou víru praktikují v ústraní. Možná by je oficiální amnestie přesvědčila, aby odhodili přetvářku?#!"
 encourage_confession_of_false_conversions_decision.desc.tt_pluralist: "Skrytí vyznavači ve tvém panství se mohou odhalit, pokud je jejich tajná [Concept('faith','víra')|El] tvou [Concept('faith','vírou')|El] [Concept('tolerates','tolerována')|El] lépe než víra, kterou vyznávají veřejně"
 encourage_confession_of_false_conversions_decision.desc.tt_paranoia: "[Concept('characters','Postavy')|El] s rysem [GetTrait('deceitful').GetName( GetNullCharacter )] nebo [GetTrait('paranoid').GetName( GetNullCharacter )] svou tajnou [Concept('faith','víru')|El] neodhalí, pokud se neshoduje s tvou"
 encourage_confession_of_false_conversions_decision.desc.tt_pluralist_counties: "Pokud je tvé panství [Concept('independent','nezávislé')|El], [Concept('counties','hrabství')|El] ve tvém [Concept('realm','panství')|El] s modifikátorem [GetModifier('false_convert_modifier').GetNameWithTooltip] mohou otevřeně konvertovat podle toho, jak nepřátelsky se stavíš k jejich nové [Concept('faith','víře')|El]"
 encourage_confession_of_false_conversions_decision.desc.tt_coreligionist: "Skrytí vyznavači ve tvém panství se mohou odhalit, pokud se jejich soukromá [Concept('faith','víra')|El] shoduje s tou, kterou veřejně vyznáváš"
 encourage_confession_of_false_conversions_decision_confirm: "Vydat prohlášení"
 abandon_crypto_faith_decision: "Opustit tajnou víru"
 abandon_crypto_faith_decision.tt: "Přestaň tajně praktikovat svou dřívější víru"
 abandon_crypto_faith_decision.desc: "#F Všechna ta tajná kázání a šeptané modlitby už vyčerpávají mou trpělivost. Zároveň jsem si zvykl na svůj veřejný život ve víře [ROOT.Char.GetFaith.GetName]. Možná nastal čas nechat svou starou víru jednou provždy spočinout.#!"
