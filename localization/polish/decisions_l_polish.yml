 gain_weight_decision: "Přibrat na váze"
 gain_weight_decision_desc: "Nedostatky mého těla jsou čím dál patrnější – sotva mám dost sil, abych vydržel[Select_CString( ROOT.Char.IsFemale, 'a', '' )] celý den!\n\nByla mi doporučena strava obsahující mimo jiné mnoho mléka, másla a datlí a myslím, že nastal čas ji vyzkoušet."
