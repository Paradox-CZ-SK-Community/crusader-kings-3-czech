 stress_loss_drunkard_decision_desc: "Družnost ve společnosti dalších milovníků pití, klid propůjčený oparem... Nastal čas oddat se pořádnému pití!"
 stress_loss_drunkard_decision_tooltip: "Uvolni se a zbav se trochy stresu"
 stress_loss_drunkard_decision_effect_tooltip: "Ztratíš část [Concept('stress','stresu')|El]"
 stress_loss_drunkard_decision_confirm: "Na zdraví!"
 stress_loss_hashishiyah_decision: "Požít hašišové koláčky"
 stress_loss_hashishiyah_decision_desc: "Stačí pár soust a stres jako by odtékal z mého těla. Mysl mi zahaluje opar a zmocňuje se mě pocit klidu a odpočinku. Nic není tak uklidňující jako dobrý hašiš!"
 stress_loss_hashishiyah_decision_tooltip: "Nech svůj stres rozplynout v omamném oparu"
 stress_loss_hashishiyah_decision_confirm: "Přineste mi podnos!"
 stress_loss_rakish_decision: "Navštívit nevěstinec"
 stress_loss_rakish_decision_desc: "Na klíně mi sedí [ROOT.Char.Custom('AttractionWomanManIndef')] a vše i všichni, co může nevěstinec nabídnout, jsou mi k službám..."
 stress_loss_rakish_decision_desc_woman_ending: "Nic neuleví mysli tak jako trocha tělesného potěšení."
 stress_loss_rakish_decision_desc_man_ending: "Nic neuvolní mysl tak jako pořádné vyvrcholení."
 stress_loss_rakish_decision_tooltip: "Ulev své mysli oddáním se touhám"
 stress_loss_rakish_decision_confirm: "Už jdu, [ROOT.Char.Custom('AttractionGirlBoyPlural')|l]!"
 stress_loss_reclusive_decision: "Uchýlit se do ústraní"
 stress_loss_reclusive_decision_desc: "Abych skutečně nalezl vnitřní rovnováhu a zbavil mysl všech myšlenek a starostí, musím být ponechán o samotě. Jen tak se mohu soustředit a zotavit."
 stress_loss_reclusive_decision_tooltip: "Uchyl se do ústraní a soustřeď svou mysl"
 stress_loss_reclusive_decision_confirm: "Sbohem."
 stress_loss_irritable_decision: "Vybít si vztek"
 stress_loss_irritable_decision_desc: "Uvolnit všechen ten hněv a podráždění, které v sobě dusím... Ach, nic nepročistí mysl lépe! Až se příště naskytne příležitost, nebudu se držet zpátky."
 stress_loss_irritable_decision_effect_tooltip: "Urazíš náhodného vazala"
 stress_loss_irritable_decision_effect_courtier_tooltip: "Urazíš náhodnou postavu: [THIS.Char.Custom('GetCourtier')|l]"
 stress_loss_irritable_decision_tooltip: "Popusť uzdu jazyku a uklidni svou mysl"
 stress_loss_irritable_decision_confirm: "Hej! Ty tam!"
 stress_loss_flagellant_decision: "Oddat se sebemrskání"
 stress_loss_flagellant_exaltation_decision_desc: "Nic neočistí mysl tak jako katarze bolesti. A že se přitom cítím blíže k [ROOT.Char.GetFaith.HighGodName], je... #EMP božská#! shoda okolností."
 stress_loss_exaltation_decision_desc: "Tělo je pouhou nádobou určenou ke spojení s [ROOT.Char.GetFaith.HighGodName]. Nechť je zlomím, aby mohla vzniknout taková harmonie."
 stress_loss_flagellant_decision_desc: "Nic neočistí mysl tak jako katarze bolesti. Budu bičovat vlastní záda, dokud se má mysl nepročistí."
 stress_loss_flaggelant_decision_effect_tooltip: "Ztratíš stres"
 stress_loss_flagellant_decision_tooltip: "Očisti svou mysl bolestí"
 stress_loss_flagellant_decision_confirm: "Ugh–!"
 stress_loss_profligate_decision: "Navštívit tržiště"
 stress_loss_profligate_decision_desc: "Něco nového, něco lesklého, něco vzácného... Nic mě neuklidní tak jako nový nákup a místní tržiště ukrývá mnoho pokladů!"
 stress_loss_profligate_decision_tooltip: "Utrať zlato a soustřeď svou mysl"
 stress_loss_profligate_decision_confirm: "Naplňte mi měšec!"
 stress_loss_improvident_decision: "Přispět na dobročinnost"
 stress_loss_improvident_decision_desc: "Mnozí potřebují mé zlato více než já. Mé vlastní problémy to sice přímo nevyřeší, ale rozdávání ulehčuje mysli."
 stress_loss_improvident_decision_tooltip: "Obdaruj potřebné a ulev své mysli"
 stress_loss_improvident_decision_confirm: "Je to pro dobrou věc!"
 stress_loss_contrite_decision: "Vyznat se"
 stress_loss_contrite_decision_desc: "Jen máloco přináší takovou úlevu a pocit svobody jako zpověď. Vyslovením svých tajemství a provinění mohu uklidnit svou mysl."
 stress_loss_contrite_decision_tooltip: "Vyznej svá provinění a osvoboď svou mysl"
 stress_loss_contrite_decision_expose_random_secret: "Bude odhaleno jedno z tvých náhodných tajemství"
 stress_loss_contrite_decision_confirm: "Musím něco říct!"
 stress_loss_comfort_eater_decision: "Oddat se hodování"
 stress_loss_comfort_eater_decision_desc: "Když už je všeho trochu #EMP příliš#!, vždy se mohu spolehnout, že jídlo uklidní mou mysl – plný žaludek znamená prázdnou a klidnou mysl."
 stress_loss_comfort_eater_decision_tooltip: "Jez a uklidni svou mysl"
 stress_loss_comfort_eater_decision_confirm: "Prostřete stůl!"
 lackluster_diet_hindrance_desc: "Máš nevalnou stravu"
 stress_loss_inappetetic_decision: "Odpírat si jídlo"
 stress_loss_inappetetic_decision_desc: "Už tak toho mám na talíři příliš, a to ani nepočítám skutečné jídlo, které na něm leží! Vynecháváním jídel se mohu soustředit na záležitosti, na nichž skutečně záleží."
 stress_loss_inappetetic_decision_tooltip: "Vyhýbej se jídlu i stresu"
 stress_loss_inappetetic_decision_confirm: "Informovat kuchaře"
 stress_loss_journaller_decision: "Zapsat své myšlenky"
 stress_loss_journaller_decision_desc: "Svěřím své myšlenky a břemena písmu. Nic nepročistí mysl tak jako inkoust a papír!"
 stress_loss_journaller_decision_tooltip: "Svěř své myšlenky papíru a pročisti si mysl"
 stress_loss_journaller_decision_confirm: "Přineste můj deník!"
 stress_loss_confider_decision: "Promluvit si s důvěrníkem"
 stress_loss_confider_decision_desc: "Být skutečně vyslechnut je vzácným potěšením. Nic neuleví mysli tak jako dobrý rozhovor s někým, komu lze důvěřovat, a problémy pak obvykle vypadají mnohem menší!"
 stress_loss_confider_decision_tooltip: "Poděl se o svá břemena s někým jiným"
 stress_loss_confider_decision_confirm: "Tak poslouchej..."
 stress_loss_athletic_decision: "Vybít stres cvičením"
 stress_loss_athletic_decision_desc: "Nic neuleví mysli tak jako zrychlený tep a zdravý pot! Budu namáhat tělo, dokud se má mysl neuklidní."
 stress_loss_athletic_decision_tooltip: "Ve zdravém těle zdravý duch"
 stress_loss_athletic_decision_confirm: "Do toho!"
