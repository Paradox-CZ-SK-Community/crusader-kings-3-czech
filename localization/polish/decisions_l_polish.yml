 write_muwashshah_poem_decision_tooltip: "Napiš novou báseň, kterou můžeš prodat, ponechat si ji nebo ji bezplatně rozšířit.\n\n$EFFECT_LIST_BULLET$Prodejem básně získáš určité množství [gold_i][Concept('gold','zlata')|El]\n$EFFECT_LIST_BULLET$Ponecháním básně získá [Concept('artifact','artefakt')|El] Kniha dvojího měsíce modifikátor\n$EFFECT_LIST_BULLET$Rozšířením básně získáš dodatečnou [prestige_i][Concept('prestige','prestiž')|El]"
