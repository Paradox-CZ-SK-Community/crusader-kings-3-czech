 every_consort_sharing_your_culture: "Každá choť sdílející tvou [Concept('culture','kulturu')|El]"
 assimilate_local_traditions_decision: "Přimět panství přijmout místní tradice"
 assimilate_local_traditions_decision_desc: "Dobrodružství budeme mít navždy v krvi, ale uznáváme, že jsme daleko od svého mrazivého skandinávského domova. Místní tradice zdejšímu lidu dobře slouží, místní dokonale znají svou zemi a jejich bohové jsou mocní – to respektujeme. Časem se jim připodobníme."
 assimilate_local_traditions_decision_confirm: "Přizpůsobíme se"
 assimilate_local_traditions_decision_tooltip: "Přijmi spolu se všemi svými severskými [Concept('vassals','vazaly')|El] [Concept('culture','kulturu')|El] a [Concept('faith','víru')|El] svého [Concept('capital','hlavního sídla')|El]"
 every_norse_vassal: "Každý [Concept('vassal','vazal')|El] sdílející tvou [Concept('culture','kulturu')|El] spolu se členy své [Concept('close_family','blízké rodiny')|El]"
