 formalise_the_daneland_decision: "Formálně ustavit Dánskou zemi"
 formalise_the_daneland_decision_desc: "Proč by našemu lidu mělo záležet na titulu $k_england$? Máme mnohem víc než jen vlastní zákony: vlastní zvyky, jazyky, tradice i vlastní #EMP kulturu#!. Na naši zemi nemají o nic větší nárok než my na jejich."
