 mozarabic_bind_the_faith_to_rome_decision_desc: "Ačkoli [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] stále zůstává naším jediným pravým papežem, odloučení od vůle Kristova náměstka nás svedlo na podivné cesty. Pryč jsou časy, kdy síněmi Toleda kráčela velká shromáždění evropského duchovenstva.\n\nNemusí však zůstat minulostí... Jestliže naše víra zbloudila, nemohl by ji silný pastýř přivést zpět ke stádu?"
