 launch_hungarian_migration_decision: "Připravit se na překročení Karpat"
 launch_hungarian_migration_decision_desc: "Soupeřící kmeny ve stepi, zejména plenící pečeněžské válečné družiny rozeseté po našem území, nám stále více ztěžují život. Za Karpaty však leží úrodná, lesnatá údolí a zvlněné pláně slabé Panonie..."
 launch_hungarian_migration_decision_tooltip: "Uprchni ze stepi a usaď se v Panonii"
 launch_hungarian_migration_decision_flavour_effect: "Získáš jednorázový zvláštní [Concept('hungarian_invasion_casus_belli','casus belli maďarské invaze')|El]"
