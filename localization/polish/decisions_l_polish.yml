 found_kingdom_of_bosnia_decision: "Založit Bosenské království"
 found_kingdom_of_bosnia_decision_desc: "Hory a lesy střední Bosny bez ustání přecházejí z rukou pánů ze severu do rukou pánů z jihu. Možná už ne nadlouho..."
 found_kingdom_of_bosnia_decision_tooltip: "Bosna se stane [Concept('de_jure','de iure')|El] [Concept('kingdom','královstvím')|El]"
 found_kingdom_of_bosnia_decision_confirm: "[ROOT.Char.GetLadyLord|U] celé Bosny!"
 accuse_krstjani_of_heresy_decision: "Obvinit $bosnian_church$ z kacířství"
 accuse_krstjani_of_heresy_decision_desc: "Divoká bosenská vrchovina již léta skýtá útočiště sektě, která ve skutečnosti nepatří ani k Východu, ani k Západu, přesto obě strany spokojeně přehlížejí její sílící odklon.\n\nUž ne! Přimějeme hlavu víry – [ROOT.Char.GetFaith.ReligiousHeadName] – aby je oficiálně prohlásila za kacíře, a nebudou se mít kam skrýt!"
 accuse_krstjani_of_heresy_decision_tooltip: "Křesťanský svět už tyto schizmatiky nebude tolerovat!"
 accuse_krstjani_of_heresy_flavour_effect.tt: "Pošleš dopis hlavě víry – [GetPlayer.GetFaith.ReligiousHeadName] – s naléhavou žádostí o prošetření záležitosti $bosnian_church$..."
 accuse_krstjani_of_heresy_decision_confirm: "Nejprve pero, potom meč!"
