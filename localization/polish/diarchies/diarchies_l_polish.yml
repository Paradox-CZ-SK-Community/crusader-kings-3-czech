 unlock_scapegoat_counterpart_interaction: "[Concept('diarch','Diarcha')|E] i [Concept('liege','lenní pán')|E] mohou veřejně napadnout svůj protějšek:\n$SPACE4$$EFFECT_LIST_BULLET$Získají [Concept('influence','vliv')|E]\n$SPACE4$$EFFECT_LIST_BULLET$Výrazně zhorší jeho [Concept('opinion','mínění')|E] o sobě\n$SPACE4$$EFFECT_LIST_BULLET$Vyvolají problémy v [Concept('realm','panství')|E]\n$SPACE4$$EFFECT_LIST_BULLET$Účinek se odvíjí od toho, o kolik lepší mají [Concept('diplomacy','diplomacii')|E] nebo [Concept('intrigue','pletichářství')|E]"
 unlock_diarch_requests_military_expedition_interaction: "[Concept('diarch','Diarcha')|E] může svého [Concept('liege','lenního pána')|E] požádat o přístup k [Concept('casus_belli','casus belli')|E] [Concept('imperial_expedition_cb','Císařské tažení')|E] a získat tak území, která si může ponechat nebo odevzdat výměnou za velké množství [Concept('influence','vlivu')|E]"
 unlock_diarch_demand_kingdom_interaction: "[Concept('diarchs','Diarchové')|E] s [Concept('title_tier','titulem úrovně')|E] [Concept('duchy','vévodství')|E] mohou požadovat vlastní [Concept('governorship','guvernérství')|E] úrovně [Concept('kingdom','království')|E]"
 diarch_more_efficient_administrative_emperor_promotion_candidate_massive: "Povýšení [Concept('co_emperors','spolucísařů')|E] do [Concept('administrative','administrativních')|E] úřadů je o [EmptyScope.ScriptValue('diarch_more_efficient_administrative_emperor_promotion_candidate_massive_value')|%=+0] efektivnější"
