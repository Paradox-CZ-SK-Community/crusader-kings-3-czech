 viz_extravagance.t1.treasure.hankerchiefs: "Tato postava spotřebuje zcela nehorázné množství jemných lněných kapesníků — v létě i deset denně, přesto každý po použití zahodí."
 viz_extravagance.t1.treasure.cosmetics: "Na někoho svého postavení má tato postava rozhodně přístup k nezvykle velkým zásobám vybraných parfémů, mastí a líčidel."
 viz_extravagance.t1.treasure.jewellery: "Zdá se, že této postavě nikdy nechybějí nové tretky, jimiž by se mohla ozdobit; zlato, stříbro a drahokamy se třpytí na její tváři i [ROOT.Char.GetDiarchy.GetDiarch.Custom('HandHands')]."
 viz_extravagance.t1.treasure.furniture: "Nábytek této postavy je vždy vyroben z nejkvalitnějšího dováženého dřeva a kovů — a jak velí dobrý vkus, obměňuje se tak často, jak jen móda dovolí."
 viz_extravagance.t1.treasure.clothing: "Tato postava má zdánlivě bezedný šatník plný nádherných oděvů podle nejnovější módy — a také dost takových, které mohou samy založit nové módní trendy."
 viz_extravagance.t1.treasure.hats: "Tato postava se málokdy obtěžuje nosit tentýž klobouk déle než týden či dva — proč se omezovat, když se každý rok objevuje tolik novějších a vyšších?"
 viz_extravagance.t1.treasure.relics: "Je známo, že tato postava vlastní malou, ale vybranou sbírku svatých relikvií."
 viz_extravagance.t1.treasure.drugs: "Skříně této postavy jsou proslulé znamenitou sbírkou exotických omamných látek, nápojů a lektvarů, z nichž mnohé patří k nejvzácnějším látkám dostupným v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 viz_extravagance.t1.treasure.game_pieces: "Tato postava vlastní každou deskovou hru známou v této části světa, s figurkami vyřezanými ze všeho možného od drahokamů až po kosti bájných tvorů."
 viz_extravagance.t1.treasure.hourglasses: "Tato postava vlastní jedny z nejpečlivěji zhotovených a nejpřesnějších přesýpacích hodin na světě — státní úředník může jen stěží vlastnit přepychovější pracovní nástroj."
 viz_extravagance.t1.activities.parades: "Tato postava s oblibou pořádá průvody, při nichž se potřebným rozhazují mince a rozdává jídlo, vždy na vlastní náklady — a samozřejmě pod vlastním jménem."
 viz_extravagance.t1.activities.festivals: "Tato postava je známá tím, že pro menší slavnosti otevírá zahrady a dolní síně svých soukromých sídel a nechává prostý lid na chvíli okusit vznešenou nádheru."
 viz_extravagance.t1.activities.auctions: "Tato postava pravidelně pořádá dobročinné dražby, v nichž prodává část svých nashromážděných pokladů a výtěžek věnuje chudým v panství."
 viz_extravagance.t1.activities.feasts: "Tato postava ráda pravidelně hostí místní šlechtu na soukromých hostinách. Někteří šeptají, že kvůli pozvánce už tekla i krev."
 viz_extravagance.t1.activities.board_game_tourneys: "Tato postava s oblibou pořádá pro vyšší vrstvy turnaje v deskových hrách, na nichž se smetánka z [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] utkává v nejnovějších variantách her."
 viz_extravagance.t1.activities.pigeon_racing: "Tato postava chová poněkud trapnou vášeň pro závody holubů; dokonce vlastní rozlehlý holubník."
 viz_extravagance.t1.activities.orgies: "Tato postava je známá pořádáním #EMP diskrétních#! setkání pro některé z poněkud... prostopášnějších obyvatel [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 viz_extravagance.t1.activities.feasts.weekly: "Tato postava s oblibou pořádá každý týden obrovské hostiny — nižší šlechta z [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] je na nich kvůli zásobování vlastních kuchyní téměř závislá."
 viz_extravagance.t1.activities.exhibitions: "Tato postava má zálibu v umění a dbá nejen na jeho podporu, ale také na vystavování plodů své štědrosti, někdy dokonce i pro ty nejprostší členy společnosti."
 viz_extravagance.t1.activities.feasts.commoners: "Tato postava si ráda dopřává pravidelné vydatné hostiny, ale vždy dbá na to, aby pozvala i nejvýznamnější občany [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], třebaže by je jejich původ jinak vylučoval."
 viz_extravagance.t1.property.townhouse: "Tato postava vlastní v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] bohatě zařízený, ale patřičně skromný městský dům."
 viz_extravagance.t1.property.minor_businesses: "Obchodní zájmy této postavy jsou četné a rozmanité a zahrnují malé dílny, drobné cechy i menší svobodné državy po celém hlavním městě."
 viz_extravagance.t1.property.small_arena: "Tato postava vlastní a udržuje malou soukromou arénu pro koňské dostihy. Hazard, který umožňuje, je samozřejmě jen vedlejší výhodou."
 viz_extravagance.t1.property.manse: "Tato postava má soukromé sídlo kousek za [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] — dost blízko pro pohodlí a dost daleko pro diskrétnost."
 viz_extravagance.t1.property.toll_road: "Tato postava je výhradním vlastníkem mimořádně výnosné zpoplatněné cesty vedoucí do [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. Jak se jí zmocnila a kdy bylo mýto zavedeno, je předmětem mnoha dohadů."
 viz_extravagance.t1.property.agent_network: "Tato postava udržuje po celém panství síť prostředníků, kteří dohlížejí na její obchodní zájmy a pečují o ně i v těch nejodlehlejších končinách."
 viz_extravagance.t1.property.rooftop_garden: "Tato postava platí za údržbu rozlehlé střešní zahrady v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], k velkému úžasu obyvatel v ulicích pod ní."
 viz_extravagance.t1.property.market_officials_on_payroll: "Je známo, že tato postava má na výplatní listině každého inspektora i celníka na jednom z hlavních tržišť hlavního města. Samozřejmě jen proto, aby zachovali svou bezúhonnost vůči panství."
 viz_extravagance.t1.property.hostel: "Tato postava vlastní v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] levnou ubytovnu, která je záměrně určena těm nejchudším a nejubožejším členům společnosti."
 viz_extravagance.t1.property.gangers: "Tato postava má #EMP údajně#! na výplatní listině jeden z hlavních gangů v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]; k čemu by vážený státní úředník potřeboval bandu brutálních hrdlořezů, zůstává záhadou."
 viz_extravagance.t1.charity.orphans: "Tato postava financuje veřejný příspěvek, díky němuž je každý rok přijímán a vzděláván stanovený počet sirotků. Mladí dostávají náležité vzdělání, stravu, ubytování i mravní výchovu až do dosažení dospělosti."
 viz_extravagance.t1.charity.building_repair: "Tato postava financuje malý fond dostupný obyvatelům hlavního města, jejichž budovy utrpěly škody — pokud si opravy nemohou dovolit, dostanou příspěvek."
 viz_extravagance.t1.charity.feasts.religious: "Tato postava financuje několik každoročních náboženských slavností pro prostý lid z [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 viz_extravagance.t1.charity.widowers: "Tato postava vyplácí podporu některým nemajetným vdovcům z hlavního města."
 viz_extravagance.t1.charity.widows: "Tato postava vyplácí podporu některým nemajetným vdovám z hlavního města."
 viz_extravagance.t1.charity.beggars: "Tato postava financuje fond, který poskytuje jídlo a oděv žebrákům a nuzákům z [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] — pro spodinu panství je to životně důležitá pomoc."
 viz_extravagance.t1.charity.awkward_children: "Tato postava financuje program, který kupuje nové džbány na vodu mladým dětem ze služebnictva, pokud ty své rozbijí při ranní cestě pro vodu — a jejich rodiny se o těchto malých nehodách vůbec nic nedozvědí."
 viz_extravagance.t1.charity.civil_service.guard: "Tato postava financuje malé strážní stanoviště i hlídku před jednou z významnějších správních budov v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 viz_extravagance.t1.charity.birds: "Tato postava platí za pravidelné sypání zrní do některých uliček pro ptactvo hlavního města — jen barbar by nechal taková zvířata trpět a hladovět."
 viz_extravagance.t1.charity.monastery: "Tato postava financuje provoz odlehlé náboženské komunity — a zaplatila i její založení — daleko od hříchů běžného života."
 viz_extravagance.t1.charity.judges: "Tato postava platí některým profesionálním soudcům panství, aby věnovali více času projednávání sporů a cestám po svých soudních obvodech."
 viz_extravagance.t1.charity.kitchens: "Tato postava financuje několik malých bezplatných kuchyní, které sytí vděčnou chudinu z [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 viz_extravagance.t2.treasure.cabinet_of_curiosities: "Tato postava má celou místnost vyhrazenou exotickým kuriozitám a podivuhodným předmětům z dalekých krajů; praktický užitek sice téměř nemají, zato mezi hosty jsou #EMP nesmírně#! oblíbené."
 viz_extravagance.t2.treasure.gems: "Tato postava údajně vlastní celé pytle drahokamů. Těch několik málo lidí, kteří sbírku spatřili, tvrdí, že každý váček obsahuje jiný druh nádherných kamenů."
 viz_extravagance.t2.treasure.sculpture: "Tato postava je velkým milovníkem umění a její sídla často zdobí sochy odlité z drahých kovů nebo vytesané z těch nejlesklejších a nejdražších kamenů."
 viz_extravagance.t2.treasure.decorative_martial_gear: "Tato postava si libuje v ozdobných zbraních a zbroji — její sídla jsou přeplněna neprakticky zdobenou vojenskou výstrojí, od zlatých mečů až po štíty vykládané drahokamy."
 viz_extravagance.t2.treasure.bezoar_cutlery: "Tato postava vlastní nesmírně drahou soupravu příborů z bezoáru: o těchto tajemných kamenech se tvrdí, že dokážou zpomalit, neutralizovat, či dokonce zvrátit účinky i těch nejsmrtelnějších jedů, takže náčiní je zároveň nanejvýš elegantní #EMP i#! praktické."
 viz_extravagance.t2.treasure.fly_stones: "Tato postava vlastní malou sbírku takzvaných muších kamenů: mystických kamenů, o nichž se tvrdí, že z malého okruhu odpuzují mouchy, komáry a další bzučivou havěť, takže jsou u jídelního stolu velmi ceněnou ozdobou."
 viz_extravagance.t2.treasure.indexed_bribes: "Tato postava je známá svými pečlivě uspořádanými a odstupňovanými úplatky, údajně natolik pravidelnými a předvídatelnými, že musí mít kdykoli připravenou snad stovku váčků od každé velikosti — každý s přesně odpočítaným počtem mincí."
 viz_extravagance.t2.treasure.map_of_world: "Tato postava vlastní mapu celého známého světa. Údajně patří k nejpřesnějším v panství, zabírá celou stěnu a svého majitele často zastihne pohrouženého do myšlenek při jejím pozorování."
 viz_extravagance.t2.treasure.horse_armour: "Mnozí koně této postavy se jen málokdy objeví bez stejně drahocenné nádhery a okázalých ozdob, jaké nosí jejich majitel — od sedel posázených perlami až po stříbrné otěže."
 viz_extravagance.t2.treasure.crockery: "Tato postava se pravidelně chlubí tím, že její kuchyně vlastní jedny z největších hrnců a pánví vyrobených z nejvzácnějších materiálů dostupných v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 viz_extravagance.t2.activities.feasts.pool: "Tato postava s oblibou pořádá slavnosti kolem rozlehlého umělého bazénu, který nechala za obrovské náklady vybudovat v jednom ze svých soukromých sídel a obklopit měkkými polštáři, pohovkami a neustálým zurčením nalévaných nápojů."
 viz_extravagance.t2.activities.gambling.horse: "Pýchou a radostí této postavy je celá stáj závodních hřebců — téměř všichni pocházejí z těch nejčistších zahraničních chovů."
 viz_extravagance.t2.activities.feasts.interactive: "Hostiny této postavy jsou proslulé svými hravými překvapeními: váčky mincí ukrytými v jídle hostů, listinami k pozemkům, které stačí podepsat a nechat v latríně, sochami rozevírajícími se a odhalujícími drahokam prvnímu, kdo rozluští jejich tajemství, a mnoha dalšími."
 viz_extravagance.t2.activities.feasts.long: "Tato postava pevně věří, že slavnost nekončí, dokud hostiteli nedojdou zásoby — některé její hostiny proto trvají celý týden či ještě déle."
 viz_extravagance.t2.activities.concerts: "Tato postava si ze všech umění nejvíce cení hudby a její nepřítomnost považuje za skutečnou tragédii. Mnohé z jejích slavností jsou v podstatě velkými koncerty — někdy dokonce natolik rozsáhlými, že se na ně dostane i několik prostých lidí."
 viz_extravagance.t2.activities.theatre: "Tato postava miluje divadlo, herectví a akrobacii jako málokdo. Na jejích hostinách se potuluje nezvykle mnoho účinkujících a staré klasické kusy v novém obsazení patří k běžným vrcholům každé slavnosti."
 viz_extravagance.t2.activities.poetry: "Tato postava se považuje za jakéhosi básníka — ať už s tím ostatní souhlasí, či nikoli, pozvánky na přepychové hostiny, kde přednáší své verše, jsou velice žádané."
 viz_extravagance.t2.activities.amnesties: "Tato postava věří, že každému lze odpustit, pokud projeví lítost a napraví své provinění — svého správního postavení využívá k pravidelnému pořádání amnestií pro zločince, kteří prokážou dostatečné pokání."
 viz_extravagance.t2.activities.animal_baiting: "Tato postava nemiluje nic víc než frkání, vrčení a řev divoké šelmy bojující o život. Na většině jejích hostin se v jámách střetávají dráždiči, psi i zuřivá zvířata, exotická i docela obyčejná."
 viz_extravagance.t2.activities.sermons: "Tato postava je vášnivě zbožná daleko nad míru, kterou vyžadují dobré mravy, a své slavnosti záměrně zaplňuje kázáními; pravidelně se na nich objevují i [ROOT.Char.GetDiarchy.GetDiarch.GetFaith.PriestNeuterPlural]."
 viz_extravagance.t2.property.monopoly: "Tato postava má to štěstí, že drží monopol na prodej určitého základního zboží uvnitř hradeb [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]; skutečnost, že zároveň ovládá úřad, který takové monopoly uděluje, s tím nejspíš nijak nesouvisí."
 viz_extravagance.t2.property.exotic_market: "Tato postava vlastní jeden z proslulejších trhů s exotickým zbožím v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] a vybírá z něj tučnou daň."
 viz_extravagance.t2.property.mine: "Tato postava vlastní výnosný důl nedaleko hlavního města, který je důležitým zdrojem běžných kovů pro domácnosti i obchodníky."
 viz_extravagance.t2.property.warehouses: "Tato postava vlastní skutečně rozsáhlý komplex skladišť ukrytý poblíž obchodního centra hlavního města. Je tak dobře zásoben exotickým obchodním zbožím, že mu místní říkají „Trezory [ROOT.Char.GetDiarchy.GetDiarch.GetFirstNameNoTooltip]“."
 viz_extravagance.t2.property.messenger_network: "Tato postava zaměstnává po celém panství síť diskrétních — a především #EMP věrných#! — poslů, kteří dokážou doručit její vůli a pokyny do každého kouta země."
 viz_extravagance.t2.property.workshops: "Tato postava vlastní téměř každou dílnu v jedné z nejrušnějších řemeslnických ulic [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], proslulé rozmanitým a nádherným zbožím."
 viz_extravagance.t2.property.personal_temple: "Tato postava vlastní okázalé soukromé místo bohoslužeb — [ROOT.Char.GetDiarchy.GetDiarch.GetFaith.HouseOfWorship] — které smí využívat pouze ona, její rodina a nejbližší spojenci."
 viz_extravagance.t2.property.fort: "Tato postava vlastní malou pevnost v nebezpečném pohraničí. Nedaleko působí [ROOT.Char.GetDiarchy.GetDiarch.GetFaith.PriestNeuterPlural]. Ačkoli je údržba pevnosti drahá, bohatý výskyt odchycené zvěře v kraji přináší značné zisky."
 viz_extravagance.t2.property.treasury: "Pokladnice této postavy je tak rozsáhlá, že zabírá vlastní budovu — opevněný komplex v samém srdci [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], kde jsou její mince zaručeně v bezpečí."
 viz_extravagance.t2.property.defensible_palace: "Tato postava udržuje v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] malý opevněný palác — údajně protkaný tajnými chodbami a skrytými únikovými cestami."
 viz_extravagance.t2.charity.schools: "Tato postava osobně financuje několik škol určených ke vzdělávání malých dětí, které by jinak neměly ani nejmenší naději na vzdělání."
 viz_extravagance.t2.charity.hospitals: "Tato postava osobně financuje několik proslulých nemocnic v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], které pečují o nejchudší členy společnosti, ale jsou zcela závislé na její štědrosti."
 viz_extravagance.t2.charity.poor_funerals: "Tato postava osobně hradí pohřby těch, kteří v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] zemřou bez peněz, rodiny či přátel, a nemohli by tak být důstojně pohřbeni."
 viz_extravagance.t2.charity.scholars.philosophical: "Tato postava osobně podporuje několik významných filozofů a institucí, které se zabývají hlubším poznáním světa."
 viz_extravagance.t2.charity.scholars.legal: "Tato postava osobně podporuje některé z nejvýznamnějších právníků, právních učenců a duchovních v panství, a přispívá tak k jasnějšímu výkladu a prosazování spravedlivého práva pro všechny."
 viz_extravagance.t2.charity.civil_service.extra_positions: "Tato postava osobně financuje obsazení klíčových míst ve státní správě a mnohonásobně tak posiluje byrokracii tím, že poskytuje prostředky právě tam, kde jsou nejvíce zapotřebí."
 viz_extravagance.t2.charity.police: "Tato postava osobně financuje oddaný sbor strážníků a vykonavatelů, kteří hlídkují v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] a dbají na to, aby se zákony dodržovaly přesně do té míry, jakou vezír požaduje."
 viz_extravagance.t2.charity.scholars.theological: "Tato postava osobně podporuje některé z nejproslulejších teologických učenců v panství a jménem svých souvěrců přispívá k rozvoji [ROOT.Char.GetDiarchy.GetDiarch.GetFaith.GetAdjective] teologie."
 viz_extravagance.t2.charity.scholars.mystical: "Tato postava osobně podporuje řadu známých mystiků, esoteriků a extatiků, kteří své podivuhodné vědění šíří po dvorech [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 viz_extravagance.t2.charity.circumcision: "Tato postava osobně hradí každý rok obřízku a náboženskou výchovu určitého počtu osiřelých chlapců z ulic [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 viz_extravagance.t2.charity.preachers: "Tato postava osobně podporuje žebravé [ROOT.Char.GetDiarchy.GetDiarch.GetFaith.PriestNeuterPlural], kteří putují zemí, pečují o potřebné souvěrce a nabízejí moudré duchovní rady i lidem jiného vyznání."
 viz_extravagance.t3.treasure.mirrors: "Tato postava vlastní desítky těch nejčistších zrcadel, jaká lze za peníze pořídit, a dopřává si tak téměř neslušnou míru marnivého přepychu, o jaké si může nechat zdát i málokterý šlechtic."
 viz_extravagance.t3.treasure.parasols: "Zdá se, že tato postava vlastní slunečník na každý den v roce: některé vyšívané zlatem, jiné stříbrem, některé z hedvábí, jiné z damašku, některé posázené rubíny, jiné smaragdy, a tak dále a dále..."
 viz_extravagance.t3.treasure.silk_bigtop: "Tato postava vlastní cestovní stan z nejpřepychovějšího hedvábí, do něhož se pohodlně vejde padesát i více hostů — každý díl je bohatě vyšívaný a každá tyč z drahého kovu či opatřená nákladným lakem."
 viz_extravagance.t3.treasure.fabrics: "Tato postava se pyšní ohromnými zásobami nejpřepychovějších textilií známého světa: hedvábím, damaškem, sametem, jemnými brokáty, nádhernými prošívanými látkami a téměř nekonečným mořem drobných obměn a krajových specialit."
 viz_extravagance.t3.treasure.exotic_pets: "Tato postava své hosty okouzluje i děsí sbírkou exotických zvířat: její soukromý zvěřinec zdobí lvi, tygři, podivní cizokrajní jeleni a ještě bizarnější tvorové."
 viz_extravagance.t3.treasure.carpets: "Tato postava vlastní zvláště proslulý koberec: sto loktů dlouhý a padesát široký, utkaný z jemného hedvábí prošívaného zlatou nití a podšitý stříbřitým saténem. Výšivky s náboženskými a historickými výjevy prý zachycují celé dějiny světa."
 viz_extravagance.t3.treasure.gold_mattress: "Tato postava vlastní matraci údajně utkanou výhradně ze zlatých nití, na níž spočinuly některé z nejslavnějších osobností nedávných dějin."
 viz_extravagance.t3.treasure.birth_control: "Tato postava vlastní lektvary, pilulky i exotičtější prostředky, které mají zajistit bezpečné, příjemné a neplodné milování."
 viz_extravagance.t3.treasure.sculpture.articulated: "Pýchou a radostí této postavy je důmyslná pohyblivá socha jí samotné, jejíž postoj i oděv lze podle vezírovy libosti donekonečna měnit."
 viz_extravagance.t3.treasure.plants: "Tato postava vlastní proslulou sbírku vzácných rostlin, mechů a bylin — každá z nich je uchovávána v jednom z pěti set křišťálových květináčů."
 viz_extravagance.t3.activities.feasts.surprise: "Tato postava je známá hostinami, při nichž obdarovává hosty, kteří ji zaujmou: vtipný žert odmění deseti tisíci kusy dobytka, nádherný oděv vzdáleným palácem i s jeho služebnictvem a poutavý rozhovor šatem z barveného hedvábí."
 viz_extravagance.t3.activities.aid: "Tato postava si udržuje přízeň šlechticů sousedících se svými statky drobnými dárky tu a tam: stovkou přepychových koberců, třemi tisíci jemných sedel, dvanácti nádobami ambry, deseti tisíci kvalitních kopí a podobnými maličkostmi."
 viz_extravagance.t3.activities.scholars.debates: "Tato postava zve na svá shromáždění učence všeho druhu z celého známého světa a s potěšením naslouchá rozhovorům největších myslí své doby usazených u jediného stolu."
 viz_extravagance.t3.activities.feasts.give_away: "Tato postava ráda pořádá hostiny pro své věrné spojence, stoupence a kumpány — a čistě náhodou při nich často rozdá majetek v hodnotě královského výkupného, přesto jí vždy zbývají další nehorázně drahé dary."
 viz_extravagance.t3.activities.land_and_livestock_grants: "Nesčetná stáda této postavy jsou předmětem místních legend; zvířat, která každoročně rozdá jako odměnu za věrné služby či dobročinnou náhradu, jsou snad desetitisíce."
 viz_extravagance.t3.activities.feasts.spectacle: "Hostiny této postavy stojí především na podívané: pokud se nemůže pochlubit #EMP alespoň#! skotačícím hadím mužem, který balancuje tyč s dovádějícím dítětem žonglujícím žhavými uhlíky na vrcholu, jaký by to vůbec mělo smysl?"
 viz_extravagance.t3.activities.feasts.coin_shower: "Tato postava si na hostinách libuje v nádherně doslovných projevech bohatství: na její oblíbené hosty se pravidelně snášejí celé spršky stovek či tisíců mincí."
 viz_extravagance.t3.activities.gambling.palanquin: "Tato postava tvrdí, že vynalezla a dokonale ovládla neobvyklý sport: závody nosítek, při nichž její nosiči soupeří s vyzyvateli o to, kdo dopraví svého pasažéra na určené místo v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] za nejkratší čas."
 viz_extravagance.t3.activities.orgies: "Tato postava bez ostychu pořádá hostiny zaměřené na tělesné rozkoše, při nichž jsou hosté hýčkáni a obsluhováni v té nejúplnější a nejolejnatější možné míře."
 viz_extravagance.t3.activities.parades: "Tato postava věří, že skryté bohatství nemá žádný smysl, a proto s oblibou pořádá průvody, v nichž se ulicemi [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] pravidelně předvádějí její exotická zvířata, nádherní koně, pečlivě upravené služebnictvo a drahocenné oděvy."
 viz_extravagance.t3.property.pool.cushions: "Tato postava udržuje velký bazén lemovaný polštáři — ani koupání přece není důvodem vzdát se přepychu."
 viz_extravagance.t3.property.businesses: "Obchodní zájmy této postavy tvoří spletité a téměř neproniknutelné bludiště vzájemně provázaných obchodních cest, monopolů, patronátu a statků."
 viz_extravagance.t3.property.palace.huge: "Tato postava udržuje palác, který je oficiálně jen #EMP o něco#! menší než [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] palác. Ti, kteří jej spatřili na vlastní oči, o tom obvykle pochybují."
 viz_extravagance.t3.property.bathhouse: "Tato postava udržuje okázalé soukromé lázně pro sebe a své nejbližší spojence, politické centrum všech nejšpinavějších — byť dokonale umytých — pletich v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 viz_extravagance.t3.property.stables: "Tato postava vlastní jednoduše kolosální stáje, v nichž jsou ustájeny stovky těch nejlepších koní v panství."
 viz_extravagance.t3.property.pool.gold: "Tato postava vlastní bazén, jehož dno nechává pokrývat silnou vrstvou zlatých mincí — k čemu je bohatství, když se nad ním člověk nemůže vznášet?"
 viz_extravagance.t3.property.fleet.commercial: "Tato postava vlastní desítky soukromých obchodních lodí, skutečnou flotilu plavidel rozesetou po celém světě."
 viz_extravagance.t3.property.business.stolen: "Zdá se, že této postavě neustále padají do rukou menší podniky, které nedokázaly splatit své dluhy různým lichvářům či samotnému státu. Pud sebezáchovy většině lidí velí, aby se k tomu nevyjadřovali."
 viz_extravagance.t3.property.tycoon: "Tato postava vlastní téměř celou čtvrtinu [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]; celé čtvrti spadají do jejích soukromých držav."
 viz_extravagance.t3.property.den_of_vice: "Proslýchá se, že tato postava vlastní jeden z nejvyhlášenějších neřestných podniků v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], kde lze získat nejrůznější směsi exotických látek. Samozřejmě za dostatek stříbra."
 viz_extravagance.t3.charity.observatories: "Tato postava podporuje velkou hvězdárnu, která sleduje nebesa a zaznamenává pohyb hvězd."
 viz_extravagance.t3.charity.universities: "Tato postava financuje několik menších, ale prestižních místních univerzit a svým jménem podporuje vzdělanost a učenost."
 viz_extravagance.t3.charity.libraries: "Peníze této postavy často směřují na zakládání, rozšiřování a uchovávání vybraných knihoven, kde se opisují významná díla, aby se mezi šlechtou šířilo vědění."
 viz_extravagance.t3.charity.bathhouses: "Tato postava nechala v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] vybudovat velké veřejné lázně a dodnes je financuje, díky čemuž se těší oblibě prostého lidu, který by si jinak takový přepych sotva mohl dovolit."
 viz_extravagance.t3.charity.hospitals.equipment: "Tato postava nejen financuje místní nemocnice, ale také dbá na to, aby měly nejnovější léčivé masti, chirurgické nástroje a nejrůznější tajemné lékařské pomůcky."
 viz_extravagance.t3.charity.civil_service.expansion: "Tato postava hradí platy celé řady správních úředníků, čímž rovnoměrněji rozděluje každodenní pracovní zátěž a ulevuje státní správě."
 viz_extravagance.t3.charity.watermills: "Tato postava financuje stavbu společných vodních mlýnů v chudých vesnicích a dalších venkovských oblastech, čímž výrazně zlepšuje život místních obyvatel."
 viz_extravagance.t3.charity.beggar_spies: "Legendární paranoia této postavy údajně sahá tak daleko, že má na výplatní listině snad polovinu žebráků a tuláků v panství, kterým za jejich oči a uši občas poskytuje jídlo a přístřeší."
 viz_extravagance.t3.charity.hajj_water_tanks: "Tato postava osobně hradí budování a plnění nádrží za branami svaté Mekky, jejichž voda pomáhá žíznivým poutníkům při vykonávání spravedlivého hadždže."
 viz_extravagance.t3.charity.holy_warrior_gear: "Tato postava pravidelně daruje zbraně a zbroj bojovníkům sloužícím různým svatým záležitostem, ať už útočí na nepřátele víry, nebo chrání její vyznavače."
 viz_extravagance.t4.treasure.cushions: "Tato postava vlastní tisíce a tisíce polštářů, téměř nekonečnou lavinu taftu a hedvábí, díky níž je radost v každé místnosti každého jejího sídla posedět — nebo si třeba zdřímnout."
 viz_extravagance.t4.treasure.martial_gear: "Tato postava má až přílišnou slabost pro vojenské hračky; údajně vlastní více ozdobných zbraní a zbrojí, než kolik má [ROOT.Char.GetTitleAsNameNoTooltip] #EMP skutečných#! kusů obojího ve výzbroji."
 viz_extravagance.t4.treasure.cosmetics: "Tato postava vlastní parfumerii v ceně císařského výkupného: celé nádoby vzácné ambry, parfémovanou růžovou vodu, vonnou ghálii, pižmový prášek, výtažek z agarového dřeva a samozřejmě šafrán, vše v množstvích a nádobách, za něž by se daly vydržovat celé armády."
 viz_extravagance.t4.treasure.office: "Vezírský úřad této postavy je vytesán z drahého kamene a skla vykládaného kovem a stejně nákladně zařízen, takže vyzařuje klidnou, pevnou moc."
 viz_extravagance.t4.treasure.crockery.historic: "Tato postava udržuje úplnou sadu hodovního nádobí a příborů, přičemž každý kus údajně kdysi patřil vládci některého exotického cizího panství či dávno zaniklé říše."
 viz_extravagance.t4.treasure.precious_orchard: "Tato postava je proslulá svým drahocenným sadem: nádvořím plným umělých stromů ukovaných ze zlata a stříbra, na jejichž větvích visí rozmanité plody vyřezané z drahokamů."
 viz_extravagance.t4.treasure.fleet.personal: "Tato postava je proslulá nádhernou osobní výletní bárkou i množstvím menších lodí a člunů, které pod jejím jménem brázdí vodní cesty [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 viz_extravagance.t4.treasure.massive_sword: "Tato postava neblaze proslula vlastnictvím ozdobného meče dlouhého jako tři vojáci položení za sebou od pat k hlavě, který spočívá podél jedné z širokých stěn její oblíbené síně."
 viz_extravagance.t4.treasure.mystic_ingredients: "O této postavě se šeptá kvůli její sbírce exotických alchymistických přísad: podivných cizokrajných rostlin, zvláštních rud z hlubin země a prášků získaných z masa a kostí bájných tvorů."
 viz_extravagance.t4.treasure.sensible_investments_for_smart_adults: "Tato postava vlastní jediný iluminovaný rukopis s nevzhledným obrázkem opice — dílo je údajně nehorázně drahé, ale nikdo přesně neví proč."
 viz_extravagance.t4.activities.feasts.pool.rose: "Tato postava pořádá slavnosti, při nichž hladinu jejího bazénu pokryjí květiny v hodnotě desítek tisíc mincí, vonná podívaná v měřítku, jaké většina hostů za celý život nespatří."
 viz_extravagance.t4.activities.give_aways: "Tato postava rozdává z pouhého rozmaru dary, vedle nichž blednou i jmění, jaká by si za celý život mohli vydělat ti nejšťastnější obchodníci."
 viz_extravagance.t4.activities.feasts.big: "To, čemu tato postava říká „soukromá hostina mezi přáteli“, by většina ostatních nazvala „rozsáhlou slavností, jaká se koná jednou za deset let“."
 viz_extravagance.t4.activities.menagerie: "Zvěřinec této postavy ukrývá syčící plazy, zářivě zbarvené ptáky, obrovské savce a zdánlivě zástupce snad každého druhu z nepřeberné rozmanitosti tvorů, které svět nabízí."
 viz_extravagance.t4.activities.aid: "Štědrost této postavy financuje tak velkorysou pomoc, že někteří údajní „šlechtici“ v okolí jsou na jejích darech zřejmě zcela závislí, chtějí-li si zachovat zdání blahobytu."
 viz_extravagance.t4.activities.host: "Tato postava považuje hostění zahraničních diplomatů za záležitost nejvyšší důležitosti, hned po utrácení ohromných částek za dokazování, o kolik jsou panství jejích hostů ve srovnání s jejím vlastním podřadnější."
 viz_extravagance.t4.activities.gambling.xtra_xtreme: "Tato postava sází mince, zvířata, půdu, životy i cokoli dalšího, co ji právě napadne — a v tak ohromném množství, že někteří začínají pochybovat, zda její bohatství skutečně #EMP je#! bezedné."
 viz_extravagance.t4.activities.masquerade: "Tato postava pravidelně pořádá kostýmní slavnosti, pro které vybírá náměty z dějin a mýtů, a od každého hosta očekává, že za jediný oděv utratí měsíční příjem či ještě více."
 viz_extravagance.t4.activities.plants.ever_changing: "Tato postava věří, že kořením života je rozmanitost, a proto udržuje zahradu neustále se měnících rostlin, vůní a exotických bylin, z nichž každá kvete a plodí v jinou roční dobu a za jiných podmínek."
 viz_extravagance.t4.activities.feasts.cannibal: "Všichni se shodují, že tato postava pořádá jedny z nejlahodnějších hostin, jaké kdy panství poznalo, plné šťavnatých kusů masa — málokdo se však shodne na tom, z jakého zvířete vlastně pocházejí."
 viz_extravagance.t4.property.palace.pool: "Tato postava udržuje samostatný palác určený výhradně pro svůj obrovský bazén. Sama sídlí jinde, takže může své soukromé komnaty a úřady zcela oddělit od prostor, kde baví hosty."
 viz_extravagance.t4.property.palace.spa: "Tato postava vlastní rozlehlé venkovské sídlo kousek za [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], klidné útočiště před městským shonem, jehož soukromí zajišťují rozsáhlé okolní pozemky."
 viz_extravagance.t4.property.army: "Tato postava vydržuje soukromou armádu hrdlořezů a kapsářů, připravených prosadit její vůli kdekoli v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 viz_extravagance.t4.property.livestock: "Rozsáhlá soukromá stáda této postavy, od jezdeckých koní po tažná zvířata, se rozprostírají po značné části panství."
 viz_extravagance.t4.property.palace.guest: "Tato postava udržuje soukromý palác určený výhradně pro návštěvy hostů — okázalý projev bohatství a moci, kterého si málokdo nevšimne."
 viz_extravagance.t4.property.spire: "Tato postava vyřizuje značnou část vezírských záležitostí v ponuré věži, která se tyčí vysoko nad většinou budov v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. Z jejích četných oken je údajně vidět do každé uličky i na každý roh."
 viz_extravagance.t4.property.palace.monthly: "Tato postava udržuje v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] nejméně tucet paláců a každý měsíc se stěhuje z jednoho do dalšího."
 viz_extravagance.t4.property.bordello: "Tato postava si vydržuje soukromý nevěstinec, kde ji její oblíbení umělci pravidelně zahrnují těmi nejprostopášnějšími rozkošemi."
 viz_extravagance.t4.property.gaol: "Tato postava vlastní soukromé vězení pro dlužníky — když chudší lidé nedokážou vezírovi splatit dluhy, trest přichází rychle a bez pochybností. Snad alespoň do chvíle, než jejich rodina sežene peníze."
 viz_extravagance.t4.property.palace.torture: "Říkají tomu „Peklo [ROOT.Char.GetDiarchy.GetDiarch.GetFirstNameNoTooltip]“ — údajná zahrada podivných rozkoší a děsivých nástrojů, kde tato postava krutě trýzní své nepřátele a soky."





 viz_extravagance.t4.charity.waystations: "Tato postava financuje po celém panství zájezdní stanice a karavanseráje, zaměřené především na menší skupiny a osamělé cestovatele."
 viz_extravagance.t4.charity.bridges: "Tato postava je proslulá množstvím peněz, které vynakládá na stavbu a údržbu nových mostů po celém panství — pro státního úředníka je to známka mimořádné prestiže."
 viz_extravagance.t4.charity.dole: "Tato postava financuje soukromé rozdávání potravin nejpotřebnějším obyvatelům [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] a dbá na to, aby nikdo nemusel zcela hladovět, dokud jí zbývají peníze."
 viz_extravagance.t4.charity.housing: "Tato postava financuje výstavbu malých nájemních domů na volných místech v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] či těsně u jeho hradeb pro ty, kteří přístřeší potřebují nejvíce."
 viz_extravagance.t4.charity.gardens: "Tato postava platí za údržbu velké veřejné zahrady — malého útočiště míru a klidu ve světě, který se někdy zdá až příliš krutý."
 viz_extravagance.t4.charity.civil_service.fire: "Tato postava osobně financuje hasičskou službu pro [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] — něco, co je ve zbytku světa téměř neslýchané."
 viz_extravagance.t4.charity.aqueducts: "Tato postava nechala vybudovat a udržuje několik kratších akvaduktů přivádějících čerstvou vodu do [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], čímž si získává vděk mnoha nejchudších obyvatel."
 viz_extravagance.t4.charity.festivals: "Tato postava každoročně financuje velkou slavnost pro všechny obyvatele [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], na kterou se celé město těší po celý rok."
 viz_extravagance.t4.charity.pilgrimage: "Tato postava spravuje dobročinný fond, který lidem poskytuje příspěvek, vhodnou výbavu a znalosti potřebné k úspěšnému vykonání pouti."
 viz_extravagance.t4.charity.loans: "Tato postava spravuje dobročinný fond, který zajišťuje odpuštění půjček a dluhů, zákonných i jiných, jež sužují chudé obyvatele panství."
