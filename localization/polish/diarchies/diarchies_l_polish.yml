 fill_coffers_mandate: "Naplnit pokladnu"
 fill_coffers_mandate_desc: "#BOL Možné účinky [Concept('mandate','mandátu')|E]:#!\n$EFFECT_LIST_BULLET$ Dodatečné [Concept('gold','zlato')|E]\n$EFFECT_LIST_BULLET$ Bezplatný [Concept('development','rozvoj')|E] [Concept('domain','domény')|E]\n$EFFECT_LIST_BULLET$ [Concept('vassal_contracts','Vazalské smlouvy')|E] upravené ve prospěch [Concept('liege','lenního pána')|E]\n\n#WEAK [Concept('regent','Regent')|E] má za úkol za každou cenu zvýšit příjmy, které získává $game_concept_liege$.#!"
 swell_armies_mandate: "Posílit armády"
 swell_armies_mandate_desc: "#BOL Možné účinky [Concept('mandate','mandátu')|E]:#!\n$EFFECT_LIST_BULLET$ Příznivé [Concept('modifiers','modifikátory')|E] [Concept('men_at_arms','ozbrojenců')|E]\n$EFFECT_LIST_BULLET$ Příznivé $game_concept_modifiers$ [Concept('levy','odvedenců')|E]\n$EFFECT_LIST_BULLET$ Zkušení [Concept('knights','rytíři')|E] z řad [Concept('courtiers','dvořanů')|E]\n\n#WEAK Současná či budoucí tažení vyžadují nové bojovníky a [Concept('regent','regent')|E] je má na příkaz svého [Concept('liege','lenního pána')|E] obstarat.#!"
 promote_authority_mandate: "Posílit autoritu"
 promote_authority_mandate_desc: "#BOL Možné účinky [Concept('mandate','mandátu')|E]:#!\n$EFFECT_LIST_BULLET$ [Concept('characters','Postavy')|E] a [Concept('counties','hrabství')|E] opouštějí [Concept('factions','frakce')|E]\n$EFFECT_LIST_BULLET$ Vyšší [Concept('crown_authority','korunní autorita')|E]\n$EFFECT_LIST_BULLET$ Vyšší [Concept('opinion','mínění')|E] [Concept('councillor','rádce')|E]\n\n#WEAK [Concept('liege','Lenní pán')|E] žádá svého [Concept('regent','regenta')|E], aby pomohl upevnit a soustředit moc trůnu.#!"
