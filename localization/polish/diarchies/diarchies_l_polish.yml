 fill_coffers_mandate_desc: "#BOL Možné účinky [Concept('mandate','mandát')|E]:#!\n$EFFECT_LIST_BULLET$ Dodatečné [Concept('gold','zlato')|E]\n$EFFECT_LIST_BULLET$ Zdarma [Concept('domain','doména')|E] [Concept('development','rozvoj')|E]\n$EFFECT_LIST_BULLET$ [Concept('vassal_contracts','Vazalské smlouvy')|E] upraveny v prospěch [Concept('liege','lenní pán')|E]\n\n#WEAK [Concept('regent','Regent')|E] je instruován, aby zvýšil příjmy svého lenního pána, za každou cenu.#!" # todo: CONCEPT CASE
 swell_armies_mandate: "Rozšířit armády"
