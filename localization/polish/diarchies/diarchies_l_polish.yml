 unlock_adjust_imperial_bureaucracy_interaction: "[Concept('diarchs','Diarchové')|E] mohou požádat o úpravu [Concept('imperial_bureaucracy','imperiální byrokracii')|E] jejich [Concept('liege','lenní pán')|E], buď:\n$SPACE4$$EFFECT_LIST_BULLET$Centralizace, pohlcuje náklady a pokles [Concept('opinion','mínění')|E]\n$SPACE4$$EFFECT_LIST_BULLET$Decentralizace, snižuje jejich [Concept('strife','svár')|E]" # todo: CONCEPT CASE
 unlock_scapegoat_counterpart_interaction: "Oba, [Concept('diarch','diarcha')|E] i [Concept('liege','lenní pán')|E], mohou veřejně útočit na svého protějška:\n$SPACE4$$EFFECT_LIST_BULLET$Získání [Concept('influence','vliv')|E]\n$SPACE4$$EFFECT_LIST_BULLET$Zničení [Concept('opinion','mínění')|E] toho druhého o nich\n$SPACE4$$EFFECT_LIST_BULLET$Podněcování problémů v [Concept('realm','panství')|E]\n$SPACE4$$EFFECT_LIST_BULLET$Závisí na tom, o kolik lepší je jejich [Concept('diplomacy','diplomacie')|E] nebo [Concept('intrigue','pletichářství')|E]" # todo: CONCEPT CASE
 unlock_diarch_requests_military_expedition_interaction: "[Concept('diarch','Diarcha')|E] může požádat svého [Concept('liege','lenního pána')|E] o přístup k [Concept('imperial_expedition_cb','císařskému tažení')|E] [Concept('casus_belli','casu belli')|E], čímž získá území, které si může ponechat nebo odevzdat za velké množství [Concept('influence','vliv')|E]" # todo: CONCEPT CASE
 unlock_diarch_demand_kingdom_interaction: "[Concept('duchy','Vévodství')|E]-[Concept('title_tier','úroveň')|E] [Concept('diarchs','diarchové')|E] mohou požadovat vlastní [Concept('kingdom','království')|E]-úroveň [Concept('governorship','guvernérství')|E]" # todo: CONCEPT CASE
