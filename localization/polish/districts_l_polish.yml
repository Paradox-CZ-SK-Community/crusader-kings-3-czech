 guild_district_desc_flavor: "V cechovních síních se usadili nejlepší řemeslníci města, kteří si svá obchodní tajemství úzkostlivě střeží. Jejich práce je prvotřídní, ceny vysoké a učni přepracovaní." # todo: NEW TRANSLATION
 market_district: "Tržní čtvrť" # todo: NEW TRANSLATION
