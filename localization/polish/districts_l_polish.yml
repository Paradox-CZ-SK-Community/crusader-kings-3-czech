 border_forts_district: "Čtvrť pohraničních pevností" # todo: NEW TRANSLATION
 border_forts_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[garrison_i][Concept('garrison','Posádka')|E]\n$BULLET_WITH_TAB$[stationed_regiment_i][Concept('stationed_regiment','Umístěný pluk')|E]\n$BULLET_WITH_TAB$[levies_i][Concept('levies','Odvedenci')|E]\n$BULLET_WITH_TAB$[control_i][Concept('control','Kontrola')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 border_forts_district_desc_flavor: "Okraje baronství střeží řetězec pevností, v každé z nichž slouží vojáci, kteří znají každou cestu i brod. Nájezdníci, kteří se vydají touto cestou, se daleko nedostanou." # todo: NEW TRANSLATION
 walls_district: "Čtvrť hradeb" # todo: NEW TRANSLATION
 walls_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[fort_level_i][Concept('fort_level','Úroveň opevnění')|E]\n$BULLET_WITH_TAB$[control_i][Concept('control','Kontrola')|E]\n$BULLET_WITH_TAB$[garrison_i][Concept('garrison','Posádka')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 walls_district_desc_flavor: "Město obklopují pevné kamenné hradby, které poskytují vynikající ochranu před nájezdníky. Měšťané brblají kvůli mýtu u brány, pořád je to však levnější než nechat se oloupit." # todo: NEW TRANSLATION
 military_district: "Vojenská čtvrť" # todo: NEW TRANSLATION
 military_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies_i][Concept('levies','Odvedenci')|E]\n$BULLET_WITH_TAB$[stationed_regiment_i][Concept('stationed_regiment','Umístěný pluk')|E]\n$BULLET_WITH_TAB$[siege_weapon_i][Concept('siege_weapons','Obléhací zbraně')|E]\n$BULLET_WITH_TAB$[garrison_i][Concept('garrison','Posádka')|E]\n$BULLET_WITH_TAB$[supply_i][Concept('supply','Zásoby')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 military_district_desc_flavor: "V pevných kasárnách sídlí vojáci panství, kteří tu mají jídlo, výcvik a jsou připraveni vyrazit na pochod. Udržet je střízlivé je však něco jiného." # todo: NEW TRANSLATION
 bureaucratic_district: "Byrokratická čtvrť" # todo: NEW TRANSLATION
 bureaucratic_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[vassal_i][Concept('vassals','Vazalové')|E]\n$BULLET_WITH_TAB$[Concept('realm','Panství')|E]\n$BULLET_WITH_TAB$[influence_i][Concept('influence','Vliv')|E]\n$BULLET_WITH_TAB$[Concept('tax_collector','Výběrčí daní')|E] & [Concept('governor_efficiency','efektivita guvernéra')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 bureaucratic_district_desc_flavor: "V těchto síních úředníci všech hodností opisují, pečetí a zakládají dokumenty týkající se záležitostí panství. Za jejich práci se chvála dočká málokdy, bez ní by se však panství brzy zastavilo." # todo: NEW TRANSLATION
 household_district: "Královská domácnost" # todo: NEW TRANSLATION
 imperial_household_district: "Císařská domácnost" # todo: NEW TRANSLATION
 household_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i][Concept('prestige','Prestiž')|E]\n$BULLET_WITH_TAB$[Concept('court_grandeur','Velkolepost dvora')|E]\n$BULLET_WITH_TAB$[knight_i][Concept('knights','Rytíři')|E]\n$BULLET_WITH_TAB$[opinion_i][Concept('opinion','Mínění')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 household_district_desc_flavor: "V těchto velkolepých síních vládce pořádá dvůr. Za vysokými zdmi udržují majestát panství služebnictvo, zruční řemeslníci i rádci. Někteří stráví celý život, aniž by tuto čtvrť opustili." # todo: NEW TRANSLATION
 mandala_district: "Mandálová čtvrť" # todo: NEW TRANSLATION
 mandala_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i][Concept('piety','Zbožnost')|E]\n$BULLET_WITH_TAB$[dynasty_prestige_i][Concept('dynasty_prestige','Věhlas')|E]\n$BULLET_WITH_TAB$[gold_i][Concept('tax','Daň')|E]\n$BULLET_WITH_TAB$[opinion_i][Concept('opinion','Mínění')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 mandala_district_desc_flavor: "Každý chrám, socha i obřad v této posvátné čtvrti vypráví tentýž příběh: král vládne z vůle bohů. Vypráví se často a velmi hlasitě." # todo: NEW TRANSLATION
 temple_district: "Náboženská enkláva" # todo: NEW TRANSLATION
 temple_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i][Concept('piety','Zbožnost')|E]\n$BULLET_WITH_TAB$[religious_tax_i][Concept('religious_tax','Náboženská daň')|E]\n$BULLET_WITH_TAB$[epidemic_resistance_i][epidemic_resistance|E]\n$BULLET_WITH_TAB$[popular_opinion_i][Concept('popular_opinion','Lidové mínění')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 temple_district_desc_flavor: "Tuto čtvrť zaplňují svatá místa a jejich zvony, zpěvy či svolávání k modlitbě označují každou hodinu dne. Duchovenstvo zde má téměř stejně velký vliv jako lenní pán." # todo: NEW TRANSLATION
 temple_district_christian: "Církevní enkláva" # todo: NEW TRANSLATION
 temple_district_islamic: "Mešitová čtvrť" # todo: NEW TRANSLATION
 entertainment_district: "Zábavní čtvrť" # todo: NEW TRANSLATION
 entertainment_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[popular_opinion_i][Concept('popular_opinion','Lidové mínění')|E]\n$BULLET_WITH_TAB$[urban_tax_i][Concept('urban_tax','Městská daň')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 entertainment_district_desc_flavor: "Hudba, hry a nejrůznější představení lákají do této čtvrti měšťany všech vrstev. Šlechtici předstírají, že si to neužívají, a rolníci předstírají, že si jich nevšímají." # todo: NEW TRANSLATION
 patrician_district: "Patricijská čtvrť" # todo: NEW TRANSLATION
 patrician_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size','Velikost sídla')|E]\n$BULLET_WITH_TAB$[prestige_i][Concept('prestige','Prestiž')|E]\n$BULLET_WITH_TAB$[popular_opinion_i][Concept('popular_opinion','Lidové mínění')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 patrician_district_desc_flavor: "Mramor, hedvábí a dovážené koření jsou v této čtvrti bohatých domácností běžným pohledem. Zdejší rodiny se navzájem berou, půjčují si peníze a kují proti sobě pikle." # todo: NEW TRANSLATION
 urban_housing_district: "Obytná čtvrť" # todo: NEW TRANSLATION
 urban_housing_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size','Velikost sídla')|E] & [Concept('settlement_size_growth_short','růst')|E]\n$BULLET_WITH_TAB$[urban_tax_i][Concept('urban_taxes_short','Městská')|E] & [artisan_tax_i][Concept('artisan_tax','řemeslnické daně')|E]\n$BULLET_WITH_TAB$Odemkne [Concept('urban_districts','městské čtvrti')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 urban_housing_district_desc_flavor: "Většina obyvatel města žije v těchto přeplněných ulicích, kde pod jednou střechou bydlí několik rodin. Pro nově příchozí z venkova je to první krok k lepšímu životu." # todo: NEW TRANSLATION
 manor_houses_district: "Čtvrť panských sídel" # todo: NEW TRANSLATION
 manor_houses_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[control_i][Concept('control','Kontrola')|E]\n$BULLET_WITH_TAB$[fort_level_i][Concept('fort_level','Úroveň opevnění')|E]\n$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax_short','Zemědělská')|E] & [woodland_tax_i][Concept('woodland_tax','daně ze zázemí')|E]\n$BULLET_WITH_TAB$[supply_i][Concept('supply','Zásoby')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 manor_houses_district_desc_flavor: "Po venkově jsou rozeseta panská sídla, v nichž žijí drobné šlechtické rody a dohlížejí na okolní pozemky. Obilí a peníze putují vzhůru, a s nimi i stížnosti." # todo: NEW TRANSLATION
 religious_community_district: "Čtvrť náboženské komunity" # todo: NEW TRANSLATION
 religious_community_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i][Concept('piety','Zbožnost')|E]\n$BULLET_WITH_TAB$[religious_tax_i][Concept('religious_tax','Náboženská daň')|E]\n$BULLET_WITH_TAB$[epidemic_resistance_i][epidemic_resistance|E]\n$BULLET_WITH_TAB$[travel_danger_i][Concept('travel_danger','Nebezpečí')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 religious_community_district_desc_flavor: "Zbožní se shromažďují v této tiché komunitě, aby žili stranou od světa, modlili se, hospodařili a opisovali svaté texty. Svět jim však neustále posílá své problémy." # todo: NEW TRANSLATION
 villages_district: "Vesnická čtvrť" # todo: NEW TRANSLATION
 villages_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i]Snížená [Concept('settlement_size','velikost sídla')|E]\n$BULLET_WITH_TAB$[trade_goods_i][Concept('trade_goods_production','Produkce obchodních komodit')|E]\n$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax_short','Zemědělská')|E] & [woodland_tax_i][Concept('woodland_tax','daně ze zázemí')|E]\n$BULLET_WITH_TAB$[supply_i][Concept('supply','Zásoby')|E]\n$BULLET_WITH_TAB$Odemkne [Concept('rural_districts','venkovské čtvrti')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 villages_district_desc_flavor: "Za městskými hradbami jsou po venkově rozesety vesnice, každá s vlastními poli a studnou. Zdejší rolníci pěstují potraviny, které město považuje za samozřejmost." # todo: NEW TRANSLATION
 tribal_economy_prestige_district: "Čtvrť hodovních síní" # todo: NEW TRANSLATION
 tribal_economy_prestige_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i][Concept('prestige','Prestiž')|E]\n$BULLET_WITH_TAB$[gold_i][Concept('tax','Daň')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tribal_economy_prestige_district_desc_flavor: "V těchto hodovních síních se kmen schází, aby jedl, pil a vychloubal se svými činy. S každým pohárem příběhy o něco narostou." # todo: NEW TRANSLATION
 tribal_military_district: "Čtvrť válečnických síní" # todo: NEW TRANSLATION
 tribal_military_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies_i][Concept('levies','Odvedenci')|E]\n$BULLET_WITH_TAB$[men_at_arms_i][Concept('men_at_arms','Ozbrojenci')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tribal_military_district_desc_flavor: "Válečníci kmene si v těchto síních brousí zbraně a vyprávějí si o dávných nájezdech. Mladí pozorně naslouchají a už plánují vlastní výpravy." # todo: NEW TRANSLATION
 tribal_wanua_district: "Čtvrť wantilanů" # todo: NEW TRANSLATION
 tribal_wanua_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[barter_goods_i][Concept('barter_goods','Směnné zboží')|E]\n$BULLET_WITH_TAB$[vassal_limit_i][Concept('vassal_limit','Limit vazalů')|E]\n$BULLET_WITH_TAB$[domain_limit_i][Concept('domain_limit','Limit domény')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tribal_wanua_district_desc_flavor: "Lidé se scházejí v těchto otevřených síních, aby předložili starším své stížnosti. Starší se zase postarají, aby se o nich dozvěděl i náčelník." # todo: NEW TRANSLATION
 bailiwick_district: "Čtvrť rychtářství" # todo: NEW TRANSLATION
 bailiwick_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax_short','Zemědělská')|E] & [woodland_tax_i][Concept('woodland_tax','daně ze zázemí')|E]\n$BULLET_WITH_TAB$[trade_goods_i][Concept('trade_goods_production','Produkce obchodních komodit')|E]\n$BULLET_WITH_TAB$[popular_opinion_i][Concept('popular_opinion','Lidové mínění')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 bailiwick_district_desc_flavor: "Venkov platí za všechno, co vévodství podniká, a v této čtvrti na to rychtáři dohlížejí — jedno pole, stádo a vesnici po druhé." # todo: NEW TRANSLATION
 staple_district: "Základní čtvrť" # todo: NEW TRANSLATION
 staple_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[urban_tax_i][Concept('urban_taxes_short','Městská')|E], [commerce_tax_i][Concept('commerce_tax_short','obchodu')|E], [artisan_tax_i][Concept('artisan_tax_short','řemeslnické')|E] & [maritime_tax_i][Concept('maritime_tax','námořní daně')|E]\n$BULLET_WITH_TAB$[gold_i][Concept('sell_prices','Prodejní ceny')|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i][Concept('trade_route_capacity_short','Obchodní kapacita')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline','Základní velikost sídla')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 staple_district_desc_flavor: "Obchodní čtvrť je přeplněná skladišti, vahami a účtárnami. Právě zde se váží, zdaňuje a střeží nejcennější obchodní zboží vévodství." # todo: NEW TRANSLATION
