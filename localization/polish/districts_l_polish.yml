 entrepot_location_district_desc_flavor: "[Concept( 'entrepot', 'Allows reselling goods over long distances via its buildings' )|E]\n\nV tomto skladišti se dovážené zboží počítá, třídí a odesílá dál na trh. Zdejší obchodníci vždy vědí, čeho je nedostatek, a podle toho také účtují." # todo: NEW TRANSLATION
