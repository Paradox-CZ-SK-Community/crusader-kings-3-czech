 market_district_desc_flavor: "Místní rolníci, řemeslníci a obchodníci od úsvitu do soumraku zaplňují toto rušné náměstí. Cokoli město nedokáže vyrobit samo, lze koupit zde — za „férovou“ cenu." # todo: NEW TRANSLATION
 port_district: "Přístavní čtvrť" # todo: NEW TRANSLATION
 port_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prosperity_i][Concept('prosperity','Rozkvět')|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i][Concept('trade_route_capacity_short','Obchodní kapacita')|E]\n$BULLET_WITH_TAB$[maritime_tax_i][Concept('maritime_tax','Námořní daň')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size','Velikost sídla')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 port_district_desc_flavor: "Podél nábřeží se táhnou mola a skladiště, kde přístavní dělníci vykládají náklad z lodí všech velikostí. Cokoli přichází přes moře, prochází nejprve tudy." # todo: NEW TRANSLATION
 entrepot_location_district: "Čtvrť překladiště" # todo: NEW TRANSLATION
