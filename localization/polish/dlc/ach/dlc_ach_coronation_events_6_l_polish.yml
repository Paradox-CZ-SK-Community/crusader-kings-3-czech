 coronation_events.6140.t: "Choť [host.GetTitleAsNameNoTooltip]"
 coronation_events.6140_desc_intro_spouse: "Obřady nastolení [host.GetTitleAsNameNoTooltip] jsou u konce a nyní je třeba náležitě uvést do postavení i choť po jeho boku.\n\n"
 coronation_events.6140_desc_polygamous_spouse: "Obřady nastolení [host.GetTitleAsNameNoTooltip] jsou u konce a nyní je třeba náležitě uvést do postavení nejvýše postavenou z jeho chotí.\n\n"
 coronation_events.6140_desc_spouse: "Zatímco mě má [spouse.Custom2('RelationToMe', SCOPE.sC('host'))] sleduje, podstupuji obřady [host.GetPrimaryTitle.GetAdjective]."
 coronation_events.6140_desc_foreign_wife_no_court_spouse: "Má výchova v [spouse.GetCulture.GetName] kultuře mě sotva připravila na podivné obřady [host.GetCulture.GetName] kultury provázené [host.GetFaith.GetAdjective] modlitbami... [host.GetCulture.GetLanguage.GetName] neovládám, a přísahy proto musím odříkávat jen podle toho, jak si pamatuji jejich zvuk."
 coronation_events.6140_desc_foreign_wife_spouse: "Má výchova v [spouse.GetCulture.GetName] kultuře mě sotva připravila na podivné obřady [host.GetCulture.GetName] kultury provázené [host.GetFaith.GetAdjective] modlitbami... [host.GetCourtLanguage.GetName] neovládám, a přísahy proto musím odříkávat jen podle toho, jak si pamatuji jejich zvuk."
 coronation_events.6140_desc_lowly_wife_spouse: "My, skromní členové rodu [spouse.GetHouse.GetName], jsme podobným panovnickým obřadům sotva kdy přihlíželi. Obskurní přísahy věrnosti, které musím skládat [host.GetFaith.random_GoodGodNames], jsou pro mě docela výzvou..."
 coronation_events.6140_desc_regal_wife_spouse: "Pocházím ze slavného rodu: my, [Select_CString(ROOT.Char.IsFemale,'dcery','synové')] rodu [spouse.GetHouse.GetName], jsme mistry obřadů a já se nesu s vážností a noblesou."
 coronation_events.6140_desc_mid_wife_spouse: "Pronáším předepsaná slova a ve vzletných výrazech mluvím o [host.GetFirstNameNoTooltip], [host.GetFaith.HighGodName] a své povinnosti vůči panství, které sdílím s [spouse.Custom2('RelationToMe', SCOPE.sC('host'))]."
 coronation_events.6140_desc_crown_spouse: "\n\nNetrvá dlouho a za velké slávy mi na hlavu pokládají korunu hodnou místa po boku [host.GetFirstNameNoTooltip]. [host.GetPrimaryTitle.GetName|U] nás oslavuje, když společně usedáme na trůny."
 coronation_events.6140_desc_neutral_spouse: "\n\nNetrvá dlouho a za velké slávy mě vedou na čestné místo po boku [host.GetFirstNameNoTooltip], kde usedám na trůn jako [spouse.GetTitleAsNameNoTooltip]."
 coronation_events.6140_desc: "Obřady nastolení [host.GetTitleAsNameNoTooltip] jsou u konce a nyní má být jeho choť náležitě uvedena do postavení [spouse.GetTitleAsName].\n\n"
 coronation_events.6140_desc_polygamous: "Obřady nastolení [host.GetTitleAsNameNoTooltip] jsou u konce a nyní má být nejvýše postavená z jeho chotí náležitě uvedena do postavení [spouse.GetTitleAsName].\n\n"
 coronation_events.6140_desc_guest: "[spouse.GetFirstNameNoTooltip], choť [host.GetTitledFirstNameRegnal], provádí obřady s nezaměnitelnou [host.Custom2('QuirkNounPosOrNeg', spouse.MakeScope.Char)]."
 coronation_events.6140_desc_host: "Má [host.Custom2('RelationToMe', SCOPE.sC('spouse'))] provádí obřady se svou charakteristickou [host.Custom2('QuirkNounPosOrNeg', spouse.MakeScope.Char)]."
 coronation_events.6140_desc_foreign_wife_no_court: "Výchova [spouse.GetFirstNameNoTooltip] v [spouse.GetCulture.GetName] kultuře ji sotva připravila na obřady [host.GetCulture.GetName] kultury provázené [host.GetFaith.GetAdjective] modlitbami: přísahy v jazyce [host.GetCulture.GetLanguage.GetName] odříkává jen podle toho, jak si pamatuje jejich zvuk."
 coronation_events.6140_desc_foreign_wife: "Výchova [spouse.GetFirstNameNoTooltip] v [spouse.GetCulture.GetName] kultuře ji sotva připravila na obřady [host.GetCulture.GetName] kultury provázené [host.GetFaith.GetAdjective] modlitbami: přísahy v jazyce [host.GetCourtLanguage.GetName] odříkává jen podle toho, jak si pamatuje jejich zvuk."
 coronation_events.6140_desc_lowly_wife: "Nízký původ [spouse.GetFirstNameNoTooltip] se poněkud projeví, když zápolí s méně známými přísahami věrnosti vůči [host.GetFaith.random_GoodGodNames]..."
 coronation_events.6140_desc_regal_wife: "Jako důkaz svého slavného původu [spouse.GetFirstName] povstane k přednesení přísah s vážností a noblesou."
 coronation_events.6140_desc_mid_wife: "[spouse.GetFirstName], [Select_CString(spouse.IsFemale,'dcera','syn')] rodu [spouse.GetHouse.GetName], pronáší slova způsobem poznamenaným svou urozenou výchovou v [spouse.GetCulture.GetName] kultuře."
 coronation_events.6140_desc_crown: "\n\nNetrvá dlouho a za velké slávy je [spouse.GetFirstNameNoTooltip] poprvé nasazena koruna. [host.GetPrimaryTitle.GetDefinitiveName|U] oslavuje svého [spouse.GetTitleAsNameNoTooltip]."
 coronation_events.6140_desc_neutral: "\n\nNetrvá dlouho a za velké slávy je [spouse.GetFirstNameNoTooltip] uvedena na čestné místo po mém boku a usedá na trůn jako [spouse.GetTitleAsNameNoTooltip] [host.GetPrimaryTitle.GetNameNoTier]."
 coronation_events.6140.a_like: "Je mi to líto, ale musím se téhle [Select_CString(spouse.IsFemale,'ženy','muže')] zbavit..."
 coronation_events.6140.a_dislike: "#EMP Musím#! se téhle [Select_CString(spouse.IsFemale,'ženy','muže')] zbavit..."
 coronation_events.6140.a: "Musím se téhle [Select_CString(spouse.IsFemale,'ženy','muže')] zbavit..."
 coronation_magnificence_spouse_effects_tt: "#EMP #low Tyto efekty se mění podle [Concept('coronation_magnificence','pompéznosti')|E] [Concept('coronation','korunovace')|E]#!#!"
 coronation_events.6140.b_like: "Můj [spouse.GetTitleAsNameNoTooltip], má sladká láska — [spouse.GetFirstNameNoTooltip]!"
 coronation_events.6140.b_dislike: "Můj [spouse.GetTitleAsNameNoTooltip]... #EMP [spouse.GetFirstNameNoTooltip]#!."
 coronation_events.6140.b: "Má choť, můj [spouse.GetTitleAsNameNoTooltip] — [spouse.GetFirstNameNoTooltip]."
 coronation_events.6140.c: "Má úloha při korunovaci mého chotě je u konce."
 coronation_events.6140.c_flavor: "Záležitosti [ROOT.Char.GetPrimaryTitle.GetAdjective] mi jistě zaberou mnoho času. Ale být chotí po boku vládce [host.GetPrimaryTitle.GetNameNoTier]... to něco znamená."
 coronation_spouse_hostile_scheme_bonus_tt: "Proti [spouse.GetShortUIName] budeš mít #P +15#! k [Concept('success_chance','šanci na úspěch')|E] [Concept('hostile_schemes','nepřátelských intrik')|E]"
 coronation_events.6140.d_likes_spouse: "Slavný den pro [spouse.GetFirstNameNoTooltip]!"
 coronation_events.6140.d_dislikes_spouse: "[Select_CString(spouse.IsFemale,'Pořád je to odporná žena','Pořád je to odporný muž')]..."
 coronation_events.6140.d_dislikes_host: "[ROOT.Char.GetFaith.HighGodName], pomoz [spouse.GetFirstNameNoTooltip]..."
 coronation_events.6140.d_likes_host: "Dobře pečuj o [host.GetFirstNameNoTooltip], [spouse.GetFirstNameNoTooltip]."
 coronation_events.6140.d: "[host.GetTitleAsNameNoTooltip] má po svém boku [spouse.GetTitleAsNameNoTooltip]."
 coronation_events.6140.aa: "Takže... [spouse.GetFirstNameNoTooltip] je teď [host.GetFaith.GetAdherentNameNoTooltip], že ano?"
 coronation_events.6140.aa_success: "[spouse.GetFirstNameNoTooltip] [Select_CString(spouse.IsFemale,'byla získána','byl získán')] pro víru"
 coronation_events.6140.aa_fail: "[spouse.GetFirstNameNoTooltip] [Select_CString(spouse.IsFemale,'přetrpěla','přetrpěl')] pohanské obřady kvůli tobě"
 coronation_events.6140.aa.flavor: "Copak [spouse.GetFirstNameNoTooltip] nevidí, že tento obřad, vykonaný samotnou posvátnou rukou [anointer.GetTitledFirstNameNoTooltipRegnal], ji vlastně uznal za jednu z věřících [host.GetFaith.GetName]? Má choť by měla přijmout svou konverzi!"
 anointment_available_because_magnificence_tt: "#EMP #low Tato možnost je dostupná díky [Concept('coronation_magnificence','pompéznosti')|E] tvého [Concept('anointment','pomazání')|E]#!#!"
 ach_yearly_crown_name: "Panovnická koruna [owner.GetFirstNameNoTooltipRegnal]"
 ach_yearly_crown_desc: "Tuto obřadní korunu nechal [owner.GetName] narychlo zhotovit pro svou korunovaci. Mezi skromnými drahokamy nese výraznou symboliku [owner.GetCulture.GetName] kultury, typickou pro řemeslníky z [owner.GetCapitalLocation.GetName]."
 ach_yearly_regalia_name: "Korunovační insignie [owner.GetFirstNameNoTooltipRegnal]"
 ach_yearly_regalia_desc: "Tyto insignie pořídil dvůr [owner.GetName] krátce před korunovací. Stejnou měrou vyjadřují oddanost [owner.GetFaith.GetName] a [owner.GetFaith.random_GoodGodNames] i panovnickou moc nad lidem [owner.GetCulture.GetName] kultury."
 coronation_events.6150.t: "Panovnický přímluvce"
 coronation_events.6150.desc: "„Ó, [ROOT.Char.GetTitleAsName], na tvou tvář hledí všichni a tvůj hlas udává tón těmto posvátným obřadům!“ lichotí mi [advisor.GetTitledFirstName], můj [advisor.GetCouncilTitle]. „Mocní panovníci i četní [ROOT.Char.Custom('GetLowOfficialPlural')] sem přišli, aby poznali tvou vládu... a zjistili, jaké místo jim náleží před novým [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetPrimaryTitle.GetNameNoTier].“\n\n„Zatímco tebe zaměstnávají slavnostní slova a úřední záležitosti... #EMP já#! mohu v tichých zákoutích prosazovat tvou vůli. Třeba u někoho jako [neighbor.GetName]?“"
 coronation_events.6150.a: "„Přimluv se za věrnost [disobedient_vassal.GetFirstNameNoTooltip] v můj prospěch.“"
 coronation_events.6150.a.flavor: "Zprávy o mých prosbách a o vlídnosti a laskavosti, které slibuje můj krb, se roznesou... ale při [ROOT.Char.GetFaith.HighGodName], poslušnost [disobedient_vassal.GetFirstNameNoTooltip] si vynutím!"
 coronation_events.6150.b: "„Ukaž našim vzácným hostům okolí, neformálně.“"
 coronation_events.6150.b.flavor: "Přítomnost mocných hodnostářů nadchne celé [location.GetNameNoTooltip]! Zaveď je k mým panovnickým pokladům a ať se na jejich hlubokou úctu nikdy nezapomene!"
 coronation_tour_of_notables_modifier: "Poctěni návštěvou mocných"
 coronation_tour_of_notables_modifier_desc: "Vzpomínka na mocné vládce, kteří procházeli mezi místním lidem a v úžasu poklekali před zdejšími poklady, je stále živá."
 coronation_events.6150.c: "„[confederation.GetName] mě trápí...“"
 coronation_events.6150.c.flavor: "...naštěstí sem dorazili její členové a lesk v jejich očích prozrazuje, že by svou věrnost rádi vyměnili za zlato!"
 coronation_events.6150.c.success_crit: "Tři konfederáti přijmou tvé úplatky"
 coronation_events.6150.c.success: "Dva konfederáti přijmou tvé úplatky"
