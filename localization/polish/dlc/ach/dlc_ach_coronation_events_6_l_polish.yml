 coronation_events.6001.t: "Naše hlasy napříč věky"
 coronation_events.6001.desc: "#EMP „První mezi náčelníky! [ROOT.Char.GetTitleAsName] z posvátné přísahy a vůle kmenů!“#!\n\n[loyal_vassal.GetTitledFirstName] máchne mečem mým směrem, druhou ruku na srdci. Pak umlkne a pronese vážný slib.\n\n„V [loyal_vassal.GetPrimaryTitle.GetBaseNameNoTier] neuznáváme [old_de_jure.GetBaseName]. Milujeme [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] a můj lid přísahá, že jej bude ctít navždy! #EMP Navždy!#!“"
 coronation_events.6001.a: "„Dobře mě poslouchejte. Vybuduji nám budoucnost.“"
 coronation_events.6001.b: "„Toto společenství musí přetrvat navěky!“"
 coronation_events.6001.c: "A ještě pomáhat naší směšné „Konfederaci“ přežít...? Ne."
 coronation_events.6001.c.flavor: "Ne když mohu být skutečným [ROOT.Char.GetTitleAsNameNoTooltip], jako byli ti dávní..."
 coronation_events.6010.t: "[Select_CString(host.IsFemale,'Ta, která brání','Ten, který brání')]"
 coronation_events.6010.desc: "Osada na okraji [location.GetTitle.GetBaseNameNoTier] hoří.\n\n„Nájezdníci,“ vysvětlí [host.Custom('KnightCultureNoTooltipLowercase')] z [host.GetPrimaryTitle.GetNameNoTier]. „Vyvrhelové z kmenů. [assailer.GetTitleAsName] z [assailer.GetPrimaryTitle.GetNameNoTier] je sem posílá. Platí té chátrě, aby pokořila naši Konfederaci a [host.GetTitleAsName] v jejím čele.“\n\n„[host.GetTitledFirstNameNoTooltip] usedá na trůn #EMP [Select_CString(host.IsFemale,'sama','sám')]#!,“ zamumlá jeden z náčelníků. „Obávám se, že se nám bude stýskat po časech, kdy naše národy čelily zlu společně...“"
 coronation_events.6010.a: "#EMP „Mí válečníci stále bojují za nás všechny!“#!"
 coronation_events.6010.b: "„Náš trůn není žádná posvátná věc...“"
 coronation_events.6010.b.flavor: "...a nárokovat si jej není žádná velká křivda."
 coronation_events.6010.c: "„Kdyby #EMP mě#! poslouchali, tahle ponížení by skončila!“"
 coronation_events.6010.d: "Všichni bychom měli složit dávnou přísahu bdělosti."
 confederation_claim_throne: "Zpřístupníš [GetScheme('claim_throne').GetTypeName] [Concept('scheme','intriku')|E]"
 confederation_warrior_modifier_stacking_tt: "Tento [Concept('modifier','modifikátor')|E] se bude sčítat, pokud jej během [Concept('coronation','korunovace')|E] udělí další [Concept('vassals','vazalové')|E]"
 confederation_warrior_modifier: "Válečníci Konfederace"
 confederation_warrior_modifier_desc: "Válečná družina této postavy překypuje rozvášněnými obránci panství."
 confederation_elective_claim_throne: "[Concept('succession','Nástupnictví')|E] [GetLaw('confederation_elective_succession_law').GetName]: $VALUE|+=0$"
 coronation_vote_log_title: "Zajištěn hlas Konfederace"
 coronation_vote_log: "Politikaření [root_scope.GetShortUIName] vyneslo na #high 10 let#! #P 1#! [Concept('vote_strength','sílu hlasu')|E] v zákoně [GetLaw('confederation_elective_succession_law').GetName]"
 coronation_vote_log_2_title: "Získány dva hlasy Konfederace"
 coronation_vote_log_2: "Politikaření [root_scope.GetShortUIName] vyneslo na #high 10 let#! #P 2#! [Concept('vote_strength','síly hlasu')|E] v zákoně [GetLaw('confederation_elective_succession_law').GetName]"
 coronation_house_candidates_log_title: "Kandidáti rodu usilují o nástupnictví"
 coronation_house_candidates_log: "[Concept('house','Rod')|E] [root_scope.GetHouse.GetName] všechny ohromil a jeho potomci získávají na #high 10 let#! #P 20#! [Concept('candidate_score','skóre kandidáta')|E] v zákoně [GetLaw('confederation_elective_succession_law').GetName]"
 admires_regal_kingdoms: "Obdiv královské nádhery"
 admires_regal_kingdoms_desc: "Ideály Konfederace u této postavy vyvolávají jen protáčení očí. Při zmínce o pompě a okázalých obřadech se jí však oči zasněně rozzáří."
 confederation_king_accepts_promise_tt: "[host.GetTitledFirstName] přijme tvůj slib"
 confederation_king_rejects_promise_tt: "[host.GetTitledFirstName] odmítne tvůj slib"
 coronation_confederation_de_jure_log_title: "De iure pro Konfederaci"
 coronation_confederation_de_jure_log: "[host.GetShortUIName] a [loyal_vassal.GetShortUIName] ve svých zemích podpořili [Concept('de_jure','de iure')|E] uznání [host.GetPrimaryTitle.GetDefinitiveName]."
 coronation_confederation_defender_log_title: "Obránce přísahal Konfederaci"
 coronation_confederation_defender_log: "[loyal_vassal.GetShortUIName] [Select_CString(loyal_vassal.IsFemale,'slíbila','slíbil')] [host.GetShortUIName], že pomůže bránit [host.GetPrimaryTitle.GetDefinitiveName]."
 confederate_king_youth_warrior_tt: "[host.GetShortUIName|U] a [warrior_youth.GetShortUIName] se stanou [Concept('allies','spojenci')|E]"
 adventurer_name_free_warriors: "Svobodní válečníci [host.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 adventurer_name_youths: "Mládež rodu [host.GetHouse.GetNameNoTooltip]"
 coronation_events.6011.t: "Společná věc"
 coronation_events.6011.desc: "„[assailer.GetName] přináší oheň! Aby zneuctil tvou korunovaci, vyslal náš proradný soused plenitele až sem!“ zvolá [loyal_vassal.GetName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('loyal_vassal'))], když mě přivede na místo této urážky od [assailer.GetTitledFirstNameNoTooltip].\n\nHoří jen několik nuzných chatrčí za [location.GetName], přesto se [loyal_vassal.GetTitledFirstNameNoTooltip] třese vzteky.\n\n„[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] stále #EMP něco znamená#!,“ přísahá. „A já jsem stále připraven bránit jej! Přijmi mou válečnickou přísahu! Chátra z [assailer.GetPrimaryTitle.GetNameNoTier] — a všichni ostatní — poznají mé válečné družiny, jakmile vkročí do našich zemí!“"
 coronation_events.6011.a: "„Slož zbraně. Věř v [ROOT.Char.GetFaith.HighGodNamePossessive] mír.“"
 coronation_events.6011.a.flavor: "Naše konfederace má zásob pro válku dost... místo toho můžeme přinášet obětiny. [ROOT.Char.GetFaith.HouseOfWorshipPlural|U] jich nikdy nemají dost."
 coronation_events.6011.b: "„Mladí i staří: žádný válečník nesmí zahálet.“"
 coronation_events.6011.b.flavor: "Copak v našich domovech neklidná mládež nesní o válce a dobrodružství? Spojme je dohromady, abychom je jednoho dne mohli povolat do boje!"
 coronation_events.6011.c: "„Bojuj se mnou, nejstatečnější duše [loyal_vassal.GetCulture.GetName] kultury!“"
 coronation_events.6011.d_house: "„Rod [ROOT.Char.GetHouse.GetName|U] brání toto panství.“"
 coronation_events.6011.d: "„Odpočívej. Bdít je má povinnost jako [ROOT.Char.GetTitleAsNameNoTooltip].“"
 mass_mob_dev_tt: "Každé [Concept('county','hrabství')|E] v [Concept('domain','doméně')|E], kterou drží [supporter.GetShortUIName], má [Concept('development','rozvoj')|E] snížený o #N [supporter.MakeScope.Var('mass_mobilitization_development_value').GetValue|0]#!"
 mass_mob_fertility_tt: "Každé [Concept('county','hrabství')|E] v [Concept('domain','doméně')|E], kterou drží [supporter.GetShortUIName], má [Concept('county_fertility','úrodnost hrabství')|E] sníženou o #N [supporter.MakeScope.Var('mass_mobilitization_fertility_value').GetValue|0]#!"
 mass_mob_dev_progress_tt: "Každé [Concept('county','hrabství')|E] v [Concept('domain','doméně')|E], kterou drží [supporter.GetShortUIName], má [Concept('development_growth','růst rozvoje')|E] snížený o #N [supporter.MakeScope.Var('mass_mobilitization_development_progress_value').GetValue|0]#!"
 coronation_mobilized_army_name: "Velká hotovost [host.GetTitleAsNameNoTooltip]"
 coronation_supporter_declare_war_tt: "[supporter.GetShortUIName] zahájí válku proti [foe.GetShortUIName] o [title_claim_1.GetName]"
 coronation_supporter_declare_war_no_title_tt: "[supporter.GetShortUIName] zahájí válku proti [foe.GetShortUIName]"
 coronation_supporter_declare_war_2_tt: "[supporter.GetShortUIName] zahájí válku proti [foe_2.GetShortUIName] o [title_claim_2.GetName]"
 coronation_supporter_declare_war_no_title_2_tt: "[supporter.GetShortUIName] zahájí válku proti [foe_2.GetShortUIName]"
 coronation_events.6020.t: "Válečný pes pro [ROOT.Char.GetTitleAsNameNoTooltip]"
 coronation_events.6020.desc: "„Jak se od nás může čekat, že se budeme usmívat?“ zavrčí [supporter.GetName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('supporter'))]. „Popíjet [ROOT.Char.Custom('RegionalDrink')], vychvalovat mír, doufat v budoucnost panství...“\n\n[supporter.GetTitledFirstNameNoTooltip] probodne pohledem podezřelou skupinku šlechticů z [foe.GetPrimaryTitle.GetNameNoTier].\n\n„...zatímco nás ta #EMP havěť#! zlověstně sleduje a kuje tvou zkázu, [ROOT.Char.GetTitleAsName]!“ odplivne si. „Jen mi dovol zatroubit na válečný roh! [foe.GetName] rozdrtím, o tom nepochybuj!“"
 coronation_events.6020.a: "„Seber ze svých zemí všechny síly a udeř!“"
 coronation_events.6020.b: "„Zmobilizuj vše, co ti [supporter.GetPrimaryTitle.GetNameNoTierNoTooltip] může dát, a poraz [foe_2.GetTitledFirstNameNoTooltip]!“"
 coronation_events.6020.c: "„S mým svolením rozdrť [foe.GetTitledFirstNameNoTooltip].“"
 coronation_events.6020.d: "„Tvým nepřítelem je [foe_2.GetTitledFirstNameNoTooltip]!“"
 coronation_events.6020.e: "„Ale no tak. Taková vášeň patří k mému hodovnímu stolu.“"
 coronation_supporter_declares_war_log_title: "Podporovatel vypuštěn do války"
 coronation_supporter_declares_war_log: "Koruna dodala [supporter.GetShortUIName] moc i odvahu a [supporter.GetShortUIName] [Select_CString(supporter.IsFemale,'vyzvala','vyzval')] [supporter_war_target.GetShortUIName] k válce."
 coronation_events.6030.t: "Přátelé nového [host.GetTitleAsNameNoTooltip]"
 coronation_events.6030.t_feast: "Přátelé [host.GetTitleAsNameNoTooltip]"
 coronation_events.6030.desc: "„Ale ano, [ROOT.Char.GetFirstName],“ zamumlá [host.GetTitledFirstName] potutelně, „být [host.GetTitleAsNameNoTooltip] je #EMP příjemné#!...“\n\nPřed námi se rozprostírá komnata plná nahých těl. Kurtizány se svůdně červenají a [host.GetFirstNameNoTooltip] se ke mně otočí s oplzlým úsměvem. „[host.GetTitleAsNameNoTooltip] musí být štědrý. Kdokoli z těchto [Select_CString(fearsome_courtesan.IsFemale,'žen','mužů')], z těchto oslavujících... může být tvůj. Na jednu noc, na mnoho nocí... tihle [Select_CString(fearsome_courtesan.IsFemale,'dívky','chlapci')] se nemohou dočkat, až se s tebou podělí o své #EMP nadání#!.“"
 coronation_events.6030.a: "Ta děsivá [Select_CString(fearsome_courtesan.IsFemale,'žena','muž')]... [Select_CString(fearsome_courtesan.IsFemale,'mohla by mě #EMP rozdrtit!#!','mohl by mě #EMP rozdrtit!#!')]"
 coronation_events.6030.a_flavor: "Ach, zemřít udušením v [Select_CString(fearsome_courtesan.IsFemale,'jejích','jeho')] rukou!"
 coronation_events.6030.a_thighs: "Ach, zemřít udušením mezi těmi stehny!"
 coronation_events.6030.b: "Tenhle chlapec je ale #EMP nezbeda#!..."
 coronation_events.6030.b_minx: "Tak tahle je ale #EMP mazaná#! lištička..."
 coronation_events.6030.b_flavor: "Za tím úšklebkem [cunning_courtesan.GetTitledFirstNameNoTooltip] se jistě skrývají tak lahodné lži..."
 coronation_events.6030.c: "Inteligentní starší muž s rukama jako vydělaná kůže..."
 coronation_events.6030.c_dame: "Moudrá starší dáma, zkušená a přísná..."
 coronation_events.6030.c_flavor: "Pro změnu někdo, kdo bude říkat #EMP mně#!, co mám dělat... [Select_CString(experienced_courtesan.IsFemale,'žena protřelá světem','muž protřelý světem')], která mě povede zkušeným dotykem."
 coronation_events.6030.d: "Dva okouzlující bratři? Vezmu si oba!"
 coronation_events.6030.d_sisters: "Dvě okouzlující sestry? Vezmu si obě!"
 coronation_events.6030.d_flavor: "Copak [host.GetTitleAsNameNoTooltip] není štědrý?"
 coronation_events.6030.e_expose: "Odporné smilstvo! Všichni se o tom dozvědí!"
 coronation_events.6030.e: "Možná bychom si mohli jen povídat o poezii..."
 coronation_host_orgy_exposed_log_title: "[host.GetTitledFirstName] [Select_CString(host.IsFemale,'přistižena','přistižen')] s kurtizánami"
 coronation_host_orgy_exposed_log: "Oslavné sexuální radovánky, které provádí [host.GetTitledFirstName], [exposer.GetTitledFirstName] [Select_CString(exposer.IsFemale,'odhalila a veřejně odsoudila','odhalil a veřejně odsoudil')]."
 host_has_courtesan_hooks_tt: "#weak [host.GetShortUIName] má [Concept('hooks','páky')|E] na všechny tyto kurtizány#!"
 coronation_events.6100.t: "Korunovace: [host.GetFirstNameNoTooltipRegnal]"
 coronation_events.6100.desc_intro: "Přinášejí [host.Custom('GetTitleTierAdjective')] insignie."
 coronation_events.6100.desc_byzantine: "Na ramena mi kladou purpurový [Glossary('chlamys','CHLAMYS_GLOSS')] — ve světle tisíce svící září v celé své nádheře. #EMP „Sláva Bohu na výsostech!“#! volají shromáždění. #EMP „A na zemi pokoj!“#! Prelát slavnostně pronese: „Ve jménu Otce, Krista [Glossary('Pantokrator','PANTOKRATOR_GLOSS')] a Ducha svatého tě zavazuji, [host.GetFirstNameRegnal], abys vládl jako [Glossary('Augoustos','AUGOUSTOS_GLOSS')] [Glossary('Romaioi','ROMAIOS_GLOSS')] a pastýř Božích věrných.“"
 coronation_events.6100.desc_byzantine_femme: "Na ramena mi kladou purpurový [Glossary('chlamys','CHLAMYS_GLOSS')] — ve světle tisíce svící září v celé své nádheře. #EMP „Sláva Bohu na výsostech!“#! volají shromáždění. #EMP „A na zemi pokoj!“#! Prelát slavnostně pronese: „Ve jménu Otce, Krista [Glossary('Pantokrator','PANTOKRATOR_GLOSS')] a Ducha svatého tě zavazuji, [host.GetFirstNameRegnal], abys vládla jako [Glossary('Augousta','AUGOUSTOS_GLOSS')] [Glossary('Romaioi','ROMAIOS_GLOSS')] a pastýřka Božích věrných.“"
 CHLAMYS_GLOSS: "Rozměrný hedvábný plášť nošený byzantskými hodnostáři a symbol světské moci nad císařským státem. #G Chlamys#! se spínal sponou zvanou fibula a zdobily jej velké drahokamy osázené panely zvané #EMP tablia#!. Pokud byly zhotoveny ze zlata, náležely výhradně císařům."
 coronation_events.6100.desc_christian: "K boku mi připínají třpytivý [host.Custom('GetRegionalSword')]. Do ruky přijímám žezlo panovnické moci. Prsty sevřu [Glossary('globus cruciger','GLOBUS_CRUCIGER_GLOSS')]; na tělo mi kladou [Glossary('armills','ARMILLS_GLOSS')] a [Glossary('pallium','PALLIUM_GLOSS')]. Modlitby dunějí dál."
 coronation_events.6100.desc_high: "K boku mi připínají lesknoucí se [host.Custom('GetRegionalSword')]. Zdobí mě nádherné drahokamy a skvostné pláště. Elita [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] — [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] a [host.Custom('KnightCulturePluralNoTooltipLowercase')] této země — jako jeden hlas pronáší závěrečné modlitby a nakonec zazní: „#EMP [host.GetFaith.HighGodName], pohleď na [Select_CString(host.IsFemale,'naši milovanou','našeho milovaného')] [host.GetTitleAsNameNoTooltip|l]!#!“"
 coronation_events.6100.desc_low: "K boku mi připínají starý [host.Custom('GetRegionalSword')]. Zdobí mě křiklavé šperky a obnošené pláště. Dokonce i zachmuřená smetánka [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] — [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] a [host.Custom('KnightCulturePluralNoTooltipLowercase')] této ubohé země — se nakonec nechá pohnout k zamumlání závěrečných modliteb a posledního zvolání: „#EMP [host.GetFaith.HighGodName], pohleď na [Select_CString(host.IsFemale,'naši','našeho')] [host.GetTitleAsNameNoTooltip|l]!#!“"
 coronation_events.6100.desc_generic: "K boku mi připínají lesknoucí se [host.Custom('GetRegionalSword')]. Na tělo mi kladou zdobené šperky a těžké pláště. Šlechta [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] — [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] a [host.Custom('KnightCulturePluralNoTooltipLowercase')] této země — jako jeden hlas pronáší závěrečné modlitby a nakonec zazní: „#EMP [host.GetFaith.HighGodName], pohleď na [Select_CString(host.IsFemale,'naši','našeho')] [host.GetTitleAsNameNoTooltip|l]!#!“"
 coronation_events.6100.desc_ending_byzantine_cynical: "\n\nOzdobený [host.Custom('GetTitleTierAdjective')] poklady pokleknu před [crowner.GetTitledFirstNameRegnal]. [crowner.GetTitledFirstNameNoTooltip] tvrdí, že vládnu z Kristovy milosti a že [ROOT.Char.GetPrimaryTitle.GetTierAsName] chrání jedině Boží milosrdenství... ale [Select_CString(ROOT.Char.IsFemale,'pastýřkou','pastýřem')] tohoto lidu jsem já. Já jsem [ROOT.Char.GetTitleAsNameNoTooltip]. Osud [Glossary('Romaioi','ROMAIOS_GLOSS')] patří mně. Jen mně..."
 coronation_events.6100.desc_ending_byzantine: "\n\nOzdobený pradávnými [host.Custom('GetTitleTierAdjective')] poklady pokleknu před [crowner.GetTitledFirstNameRegnal] i před Kristem — neboť vládnu ze svaté milosti a jen díky jeho milosrdenství [ROOT.Char.GetPrimaryTitle.GetTierAsName] stále stojí. A konečně..."
 coronation_events.6100.desc_ending_non_abrahamic_vassal: "\n\nOzdobený [host.Custom('GetTitleTierAdjective')] poklady pokleknu. Diadém mého [host.GetPrimaryTitle.GetTierAsName], symbol [host.GetPrimaryTitle.GetNameNoTierNoTooltip], totiž od této chvíle zůstane navždy... těsně nade mnou."
 coronation_events.6100.desc_ending_non_abrahamic: "\n\nOzdobený [host.Custom('GetTitleTierAdjective')] poklady pokleknu... tentokrát naposledy. Čeká mě titul [host.GetTitleAsName] z [host.GetPrimaryTitle.GetNameNoTier]. Jakmile se skutečně stanu [host.GetTitleAsNameNoTooltip|l], už se nebudu klanět nikomu."
 coronation_events.6100.desc_ending_vassal: "\n\nOzdobený [host.Custom('GetTitleTierAdjective')] poklady pokleknu. Čeká mě titul [host.GetTitleAsName] z [host.GetPrimaryTitle.GetNameNoTier]. Jakmile se skutečně stanu [host.GetTitleAsNameNoTooltip|l], nade mnou budou stát dvě autority: [host.GetLiege.GetPrimaryTitle.GetAdjective] [host.GetLiege.GetTitleAsName] a [host.GetFaith.HighGodName]."
 coronation_events.6100.desc_ending: "\n\nOzdobený [host.Custom('GetTitleTierAdjective')] poklady pokleknu... tentokrát naposledy. Čeká mě titul [host.GetTitleAsName] z [host.GetPrimaryTitle.GetNameNoTier]. Jakmile se skutečně stanu [host.GetTitleAsNameNoTooltip|l], nade mnou bude stát jedině [host.GetFaith.HighGodName]."
 coronation_events.6100.desc_byzantine_guest: "Na ramena [host.GetFirstNamePossessiveRegnal] kladou purpurový [Glossary('chlamys','CHLAMYS_GLOSS')] — ve světle tisíce svící září v celé své nádheře. #EMP „Sláva Bohu na výsostech!“#! volají shromáždění. #EMP „A na zemi pokoj!“#! Prelát slavnostně pronese: „Ve jménu Otce, Krista [Glossary('Pantokrator','PANTOKRATOR_GLOSS')] a Ducha svatého tě zavazuji, [host.GetFirstNameRegnal], abys vládl jako [Glossary('Augoustos','AUGOUSTOS_GLOSS')] [Glossary('Romaioi','ROMAIOS_GLOSS')] a pastýř Božích věrných.“"
 coronation_events.6100.desc_byzantine_femme_guest: "Na ramena [host.GetFirstNamePossessiveRegnal] kladou purpurový [Glossary('chlamys','CHLAMYS_GLOSS')] — ve světle tisíce svící září v celé své nádheře. #EMP „Sláva Bohu na výsostech!“#! volají shromáždění. #EMP „A na zemi pokoj!“#! Prelát slavnostně pronese: „Ve jménu Otce, Krista [Glossary('Pantokrator','PANTOKRATOR_GLOSS')] a Ducha svatého tě zavazuji, [host.GetFirstNameRegnal], abys vládla jako [Glossary('Augousta','AUGOUSTOS_GLOSS')] [Glossary('Romaioi','ROMAIOS_GLOSS')] a pastýřka Božích věrných.“"
 coronation_events.6100.desc_christian_guest: "K boku [host.GetFirstNamePossessive] připínají třpytivý [host.Custom('GetRegionalSword')]. Do ruky přichází žezlo panovnické moci. Prsty [host.GetFirstNameNoTooltip] sevřou [Glossary('globus cruciger','GLOBUS_CRUCIGER_GLOSS')]; na tělo pak přicházejí [Glossary('armills','ARMILLS_GLOSS')] a [Glossary('pallium','PALLIUM_GLOSS')]. Modlitby dunějí dál."
 coronation_events.6100.desc_high_guest: "K boku [host.GetFirstNamePossessive] připínají lesknoucí se [host.Custom('GetRegionalSword')]. [host.GetFirstNameNoTooltip] zdobí nádherné drahokamy a skvostné pláště. Elita [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] — [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] a [host.Custom('KnightCulturePluralNoTooltipLowercase')] tamní země — jako jeden hlas pronáší závěrečné modlitby a nakonec zazní: „#EMP [host.GetFaith.HighGodName], pohleď na [host.GetTitleAsNameNoTooltip|l], kterého tolik milujeme!#!“"
 coronation_events.6100.desc_low_guest: "K boku [host.GetFirstNamePossessive] připínají starý [host.Custom('GetRegionalSword')]. [host.GetFirstNameNoTooltip] zdobí křiklavé šperky a obnošené pláště. Dokonce i zachmuřená smetánka [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] — [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] a [host.Custom('KnightCulturePluralNoTooltipLowercase')] té ubohé země — se nakonec nechá pohnout k zamumlání závěrečných modliteb a posledního zvolání: „#EMP [host.GetFaith.HighGodName], pohleď na [host.GetTitleAsNameNoTooltip|l]!#!“"
 coronation_events.6100.desc_generic_guest: "K boku [host.GetFirstNamePossessive] připínají lesknoucí se [host.Custom('GetRegionalSword')]. [host.GetFirstNameNoTooltip] zdobí jemné šperky a těžké pláště. Šlechta [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] — [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] a [host.Custom('KnightCulturePluralNoTooltipLowercase')] tamní země — jako jeden hlas pronáší závěrečné modlitby a nakonec zazní: „#EMP [host.GetFaith.HighGodName], pohleď na [host.GetTitleAsNameNoTooltip|l]!#!“"
 coronation_events.6100.desc_ending_byzantine_guest: "\n\nOzdobený pradávnými [host.Custom('GetTitleTierAdjective')] poklady [host.GetFirstNameNoTooltipRegnal] poklekne před [crowner.GetTitledFirstNameRegnal] i před Kristem — neboť vládne ze svaté milosti a jen díky Božímu milosrdenství [ROOT.Char.GetPrimaryTitle.GetTierAsName] stále stojí. A konečně..."
 coronation_events.6100.desc_ending_non_abrahamic_vassal_guest: "\n\nOzdobený [host.Custom('GetTitleTierAdjective')] poklady [host.GetFirstNameNoTooltipRegnal] poklekne. Diadém [host.GetPrimaryTitle.GetTierAsName], symbol [host.GetPrimaryTitle.GetNameNoTierNoTooltip], totiž od této chvíle zůstane navždy... těsně nad [Select_CString(host.IsFemale,'ní','ním')]."
 coronation_events.6100.desc_ending_non_abrahamic_guest: "\n\nOzdobený [host.Custom('GetTitleTierAdjective')] poklady [host.GetFirstNameNoTooltipRegnal] poklekne... tentokrát naposledy. Čeká [Select_CString(host.IsFemale,'ji','ho')] titul [host.GetTitleAsName] z [host.GetPrimaryTitle.GetNameNoTier]. Jakmile se skutečně stane [host.GetTitleAsNameNoTooltip|l], nebude se klanět nikomu."
 coronation_events.6100.desc_ending_vassal_guest: "\n\nOzdobený [host.Custom('GetTitleTierAdjective')] poklady [host.GetFirstNameNoTooltipRegnal] poklekne. Čeká [Select_CString(host.IsFemale,'ji','ho')] titul [host.GetTitleAsName] z [host.GetPrimaryTitle.GetNameNoTier]. Jakmile se skutečně stane [host.GetTitleAsNameNoTooltip|l], pokloní se [host.GetLiege.GetPrimaryTitle.GetAdjective] [host.GetLiege.GetTitleAsName] a [host.GetFaith.HighGodName]."
 coronation_events.6100.desc_ending_guest: "\n\nOzdobený [host.Custom('GetTitleTierAdjective')] poklady [host.GetFirstNameNoTooltipRegnal] poklekne... tentokrát naposledy. Čeká [Select_CString(host.IsFemale,'ji','ho')] titul [host.GetTitleAsName] z [host.GetPrimaryTitle.GetNameNoTier]. Jakmile se skutečně stane [host.GetTitleAsNameNoTooltip|l], pokloní se už jen [host.GetFaith.HighGodName]."
 GLOBUS_CRUCIGER_GLOSS: "„Jablko s křížem“, obvykle zhotovené z drahého kovu. Drží se v ruce jako součást královských insignií a symbol Spasitelovy vlády nad celým světem."
 ARMILLS_GLOSS: "Pár jemně zhotovených obřadních náramků nošených na pažích preláta či panovníka. #G Armilly#! bývaly zdobeny výjevy, jako je Kristovo zmrtvýchvstání či ukřižování."
 PALLIUM_GLOSS: "Okázalý panovnický plášť, příbuzný řeckému císařskému #G lorosu#! a #G palliím#! nošeným církevními hodnostáři."
 coronation_events.6100.a: "Koruna mi spočine na čele."
 coronation_events.6100.a_guest: "Koruna spočine [host.GetFirstNameNoTooltip] na čele."
 coronation_events.6100.a_guest_low: "Koruna je nasazena... ale na jak dlouho?"
 coronation_events.6100.a_flavor_decent: "A tak [host.GetPrimaryTitle.GetAdjectiveNoTooltip] [Glossary('coronation crown','CORONATION_CROWN_GLOSS')] konečně spočine na svém místě."
 coronation_events.6100.a_flavor_low_guest: "Na hlavě [host.GetFirstNameNoTooltipRegnal] působí [host.GetPrimaryTitle.GetAdjectiveNoTooltip] [Glossary('coronation crown','CORONATION_CROWN_GLOSS')] poněkud zvláštně..."
 coronation_events.6100.a_flavor_low: "Uprostřed tohoto ubohého obřadu si sotva dokážu vychutnat dotek [host.GetPrimaryTitle.GetAdjectiveNoTooltip] [Glossary('coronation crown','CORONATION_CROWN_GLOSS')]..."
 coronation_events.6100.a_flavor_giant: "Při [host.GetFaith.HighGodName] — [crowner.GetTitledFirstNameNoTooltip] sotva dokáže tu titěrnou [Glossary('coronation crown','CORONATION_CROWN_GLOSS')] nasadit!"
 coronation_events.6100.a_flavor_adolescent: "Pohleďte: má [Glossary('coronation crown','CORONATION_CROWN_GLOSS')]! A — #EMP ach#! — skoro mi padá přes oči..."
 CORONATION_CROWN_GLOSS: "Koruny používané při korunovačních obřadech byly někdy totožné s těmi, které se nosily běžně. #G Korunovační koruny#! však mohly být také zaprášenými relikviemi, vytahovanými pouze pro tuto jedinou příležitost."
 coronation_events.6101.desc_crowning_intro: "Někteří by řekli, že [host.GetTitleAsName], který pozvedne korunu a vlastní rukou si ji nasadí na čelo, propadá nestoudné pýše — vždyť se tím sám prohlašuje za jednoho z panovníků, které si [host.GetFaith.HighGodNamePossessive] vyvolil na zemi.\n\n"
 coronation_events.6101.desc_no_being_crowned_intro: "Když [host.GetTitleAsName|l] oblékne slavnostní roucho a má za sebou souhlas svého lidu... může se korunovat sám. Takový je náš zvyk, třebaže někteří [host.GetFaith.BishopNeuterPlural] nám toto [host.Custom('GetTitleTierAdjective')] právo závidí.\n\n"
 coronation_events.6101.desc_crowning_priests_iberian: "#EMP Ha!#! My #EMP Ibeřané#! to vidíme jinak. Proneseme svá pokorná slova k Bohu a #EMP Nejsvětější Panně Marii#! — a pak si uděláme, co chceme!"
 coronation_events.6101.desc_crowning_priests_high: "Přesto těch několik pochybujících [host.GetFaith.PriestNeuterPlural] zpívá tenkými hlasy a s úžasem přihlíží, když zahajuji obřad."
 coronation_events.6101.desc_crowning_priests_low: "Pod příkrovem šepotu davu skutečně slyším [host.GetFaith.PriestNeuterPlural], jak si temně mumlají svá odsouzení."
 coronation_events.6101.desc_crowning_priests_mid: "K [host.GetFaith.NegativeAfterLife] s mými odpůrci! Žádného [host.GetFaith.PriestNeuter] nepotřebuji."
 coronation_events.6101.desc_words_christian: "V prstech svírám diadém s křížem a pronáším: „#EMP Pane Bože, stojíš nade všemi králi; tvé vládě náleží všechna království nebes i země#!“ a další slova obřadu. Poté si vlastní rukou nasadím korunu a ujímám se vlády nad [host.GetPrimaryTitle.GetNameNoTier].\n\n"
 coronation_events.6101.desc_words_generic: "V prstech svírám drahokamy posázený kovový kruh a obracím se ke všem z [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l]. Slibuji bdělost, spravedlnost a sílu — a vlastní rukou si nasazuji korunu jako vládce [host.GetPrimaryTitle.GetNameNoTier]!\n\n"
 coronation_events.6101.desc_ending_humble: "Pomalými, vážnými kroky se blížím k trůnu, který na mě čeká. Stát se [host.GetTitleAsNameNoTooltip|l] není žádná maličkost."
 coronation_events.6101.desc_ending: "Konečně přistupuji k panovnickému trůnu jako [host.GetTitleAsNameNoTooltip|l], kterým jsem se měl vždy stát."
 coronation_events.6101.desc_crowning_priests_high_guest: "Přesto těch několik pochybujících [host.GetFaith.PriestNeuterPlural] zpívá tenkými hlasy a s úžasem přihlíží, když [host.Custom('FormalComplimentAdjective')] [host.GetFirstName] zahajuje obřad."
 coronation_events.6101.desc_crowning_priests_low_guest: "Pod příkrovem šepotu davu slyším [host.GetFaith.PriestNeuterPlural], jak si temně mumlají svá odsouzení."
 coronation_events.6101.desc_crowning_priests_mid_guest: "[host.GetFaith.PriestNeuterPlural|U] však tento obřad zřejmě přijímají. Možná kdysi totéž učinil některý panovník z [host.GetFaith.ReligiousText]."
 coronation_events.6101.desc_words_christian_guest: "[host.GetFirstNameRegnal] sevře v prstech diadém s křížem a pronese: „#EMP Pane Bože, stojíš nade všemi králi; tvé vládě náleží všechna království nebes i země#!“ a další slova obřadu. Poté si vlastní rukou nasadí korunu a ujme se vlády nad [host.GetPrimaryTitle.GetNameNoTier].\n\n"
 coronation_events.6101.desc_words_generic_guest: "[host.GetFirstNameRegnal] sevře v prstech drahokamy posázený kovový kruh a obrátí se ke všem z [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l]. Slíbí bdělost, spravedlnost a sílu — a vlastní rukou si nasadí korunu jako vládce [host.GetPrimaryTitle.GetNameNoTier]!\n\n"
 coronation_events.6101.desc_ending_humble_guest: "Pomalými, vážnými kroky přistupuje [host.GetTitleAsNameNoTooltip] k trůnu, který na [Select_CString(host.IsFemale,'ni','něj')] čeká. Na tváři se zračí tíha toho, co právě vykonal, i toho, čím se stal."
 coronation_events.6101.desc_ending_guest: "[host.GetTitleAsNameNoTooltip] hrdě přistupuje ke svému panovnickému trůnu."
 coronation_events.6101.a_guest_neg: "A tak jsme sledovali, jak [Select_CString(host.IsFemale,'zvrácená žena miluje sama sebe','zvrácený muž miluje sám sebe')]."
 coronation_events.6101.a_guest_pos: "Právoplatný [host.GetTitleAsNameNoTooltip]. Sláva!"
 coronation_events.6101.a_guest: "Korunu si [Select_CString(host.IsFemale,'nasadila sama','nasadil sám')]. A také ji bude nosit."
 coronation_events.6101.a: "Kéž na tomto trůnu sedím ještě mnoho let."
 coronation_events.6101.a_oh_noes: "Na ústup už je asi pozdě..."
 coronation_events.6102.t: "Nastolení [host.GetFirstNameNoTooltipRegnal]"
 coronation_events.6102_middle: "\n\nK tomuto vrcholnému obřadu kráčím [Select_CString(host.IsFemale,'sama','sám')], oděn do inauguračních insignií."
 coronation_events.6102.desc_high_east_asian: "Můj historický průvod provází zvučné hlaholení zvonů. Uctiví ministři i zahraniční hodnostáři — těch několik málo, kterým bylo dopřáno být u této chvíle — leží přede mnou tváří k zemi. Velký [host.GetTitleAsName] usedá na trůn své vlády.\n\n"
 coronation_events.6102.desc_low_east_asian: "Zhasínají snad světla, když kolem nich procházím? Velký trůnní sál potemněl, téměř zčernal. Září jen sklopené tváře těch, kolem nichž procházím — skoro bělavé jako kosti, přitisknuté k podlaze, jako by lid [host.GetPrimaryTitle.GetNameNoTier] byl už mrtvý.\n\n"
 coronation_events.6102.desc_mid_east_asian: "Vše probíhá v dokonalém souladu s přísnými pravidly pradávného obřadu. Všichni hodnostáři a ministři leží přede mnou tváří k zemi a já usedám na trůn své vlády.\n\n"
 coronation_events.6102.desc_high_east_asian_ending_japan: "V harmonických trojicích zaznívají mocné edikty, pronášejí se vroucí sliby poslušnosti a přede mě jsou předloženy [Glossary('Tři posvátné poklady','THREE_SACRED_TREASURES_GLOSS')]. [host.Custom('GetTitleTierAdjective')|U] pečeť je má a v [host.GetPrimaryTitle.GetNameNoTier] je vše tak, jak má být."
 coronation_events.6102.desc_high_east_asian_ending: "V harmonických trojicích zaznívají mocné edikty, pronášejí se vroucí sliby poslušnosti a přede mě jsou předloženy pradávné posvátné poklady. [host.Custom('GetTitleTierAdjective')|U] pečeť je má a v [host.GetPrimaryTitle.GetNameNoTier] je vše tak, jak má být."
 coronation_events.6102.desc_low_east_asian_ending_japan: "Edikty monotónně zaznívají, [Glossary('Tři posvátné poklady','THREE_SACRED_TREASURES_GLOSS')] jsou předloženy, ale když usedám na [host.Custom('GetTitleTierAdjective')] trůn... mé myšlenky bloudí kamsi do temnot..."
 coronation_events.6102.desc_low_east_asian_ending: "Edikty monotónně zaznívají, předkládají se zaprášené relikvie, ale když usedám na [host.Custom('GetTitleTierAdjective')] trůn... mé myšlenky bloudí kamsi do temnot..."
 coronation_events.6102.desc_mid_east_asian_ending_japan: "Edikty jsou vyhlášeny, ministři skládají přísahy svým úřadům a [Glossary('Tři posvátné poklady','THREE_SACRED_TREASURES_GLOSS')] jsou odhaleny, jak velí tradice. A konečně je velká [host.Custom('GetTitleTierAdjective')|U] pečeť má."
 coronation_events.6102.desc_mid_east_asian_ending: "Edikty jsou vyhlášeny, ministři skládají přísahy svým úřadům a pradávné poklady jsou odhaleny, jak velí tradice. A konečně je velká [host.Custom('GetTitleTierAdjective')|U] pečeť má."
 THREE_SACRED_TREASURES_GLOSS: "Japonské císařské insignie, které měl podle tradice přinést na zem mytický dobyvatel Japonska, božský předek tamních císařů. Tyto poklady představují tři hlavní ctnosti: #EMP Ame-no-Murakumo-no-Tsurugi#! — „Nebeský meč shromažďujících se mraků“ — symbolizuje statečnost, bronzové zrcadlo #EMP Yata no Kagami#! představuje moudrost a kapkovitý drahokam #EMP Yasakani no Magatama#! ztělesňuje laskavost."
 coronation_events.6102.desc_high: "Ale... nejsem [Select_CString(host.IsFemale,'sama','sám')]. Od nejnižší stoky až po nejvyšší věž burácí prázdným vzduchem ohlušující jásot — jako by křik tisíců rval velkou budovu [host.Custom('ResidenceBuilding')] na kusy a #EMP otřásal jí až do základů!#!\n\nNa trůn neusedám jako [Select_CString(host.IsFemale,'žena','muž')], nýbrž jako [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l]. Ne jako smrtelník, nýbrž — jak mí poddaní skandují a zpívají — jako dar, který [host.GetFaith.HighGodName] seslal lidu [host.GetPrimaryTitle.GetAdjective], jako příslib [host.GetFaith.PositiveAfterLife]!"
 coronation_events.6102.desc_low: "Cesta je dlouhá... a tichá. Každý krok se rozléhá jako kapka dopadající na bezednou hladinu. [anointer.GetName], se slzami v očích, začne zpívat pradávný žalozpěv:\n\n„#EMP [host.GetFaith.random_GoodGodNames], zachraňte nás! Z propasti, ze zoufalství: zachraňte děti [host.GetPrimaryTitle.GetNameNoTier]! [host.GetFaith.HighGodName], ušetři nás pustoty [host.GetFaith.NegativeAfterLife]! Kéž se náš [host.GetTitleAsNameNoTooltip|l] postaví zlu člověka!#!“\n\nPřed tímto sklíčeným shromážděním usedám na trůn."
 coronation_events.6102.desc_mid: "Modlitby z mých rtů se mísí se sílícím zpěvem. Společně se svými poddanými se modlím: „#EMP [host.GetFaith.random_GoodGodNames], ochraňujte tento [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] pod [host.GetFaith.PositiveAfterLife] vždy, nyní i navěky! Na věky věků! [host.GetFaith.random_GoodGodNames], požehnejte síle [host.GetTitleAsNameNoTooltip]!#!“\n\n[host.Custom('GetLowOfficialPlural')|U], [host.Custom('KnightCulturePluralNoTooltipLowercase')] a [host.Custom('GetLocalCommonerTermPlural')] se hluboce uklánějí. Usedám na posvátný trůn, sídlo své moci. #EMP „Sláva [host.GetFirstNameNoTooltipRegnal]!“#! volají všichni. „#EMP Z vůle [host.GetFaith.HighGodName], náš [host.GetTitleAsNameNoTooltip|l]!#!“"
 coronation_events.6102_middle_guest: "\n\n[host.GetFirstName] kráčí dál, ozdoben inauguračními insigniemi."
 coronation_events.6102.desc_high_east_asian_guest: "Historický průchod [host.GetTitleAsNameNoTooltip] provází zvučné hlaholení zvonů. Uctiví ministři i zahraniční hodnostáři — těch několik z nás, kterým bylo dopřáno být u této chvíle — leží tváří k zemi. Velký [host.GetTitleAsNameNoTooltip] usedá na trůn své vlády.\n\n"
 coronation_events.6102.desc_low_east_asian_guest: "Zhasínají snad světla, když [host.GetTitleAsNameNoTooltip] prochází kolem? Velký trůnní sál potemněl, téměř zčernal. Září jen sklopené tváře, kolem nichž se vleče špinavé roucho [host.GetTitleAsNameNoTooltip] — skoro bělavé jako kosti, přitisknuté k podlaze, jako by lid [host.GetPrimaryTitle.GetNameNoTier] byl už mrtvý.\n\n"
 coronation_events.6102.desc_mid_east_asian_guest: "Vše probíhá v dokonalém souladu s přísnými pravidly pradávného obřadu. Všichni leží před [host.GetTitleAsNameNoTooltip] tváří k zemi a [host.GetFirstNameNoTooltip] usedá na trůn své vlády.\n\n"
 coronation_events.6102.desc_high_east_asian_ending_japan_guest: "V harmonických trojicích zaznívají mocné edikty, pronášejí se vroucí sliby poslušnosti a jsou předloženy [Glossary('Tři posvátné poklady','THREE_SACRED_TREASURES_GLOSS')]. [host.Custom('GetTitleTierAdjective')|U] pečeť přechází do rukou nového vládce a v [host.GetPrimaryTitle.GetNameNoTier] je vše tak, jak má být."
 coronation_events.6102.desc_high_east_asian_ending_guest: "V harmonických trojicích zaznívají mocné edikty, pronášejí se vroucí sliby poslušnosti a jsou předloženy pradávné posvátné poklady. [host.Custom('GetTitleTierAdjective')|U] pečeť přechází do rukou nového vládce a v [host.GetPrimaryTitle.GetNameNoTier] je vše tak, jak má být."
 coronation_events.6102.desc_low_east_asian_ending_japan_guest: "Edikty monotónně zaznívají, [Glossary('Tři posvátné poklady','THREE_SACRED_TREASURES_GLOSS')] jsou předloženy, ale když se [host.GetTitleAsNameNoTooltip] — [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('host'))] jako vždy — sesune na [host.Custom('GetTitleTierAdjective')] trůn... mé myšlenky bloudí kamsi do temnot..."
 coronation_events.6102.desc_low_east_asian_ending_guest: "Edikty monotónně zaznívají, předkládají se zaprášené relikvie, ale když se [host.GetTitleAsNameNoTooltip] — [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('host'))] jako vždy — sesune na [host.Custom('GetTitleTierAdjective')] trůn... mé myšlenky bloudí kamsi do temnot..."
 coronation_events.6102.desc_mid_east_asian_ending_japan_guest: "Edikty jsou vyhlášeny, ministři skládají přísahy svým úřadům a [Glossary('Tři posvátné poklady','THREE_SACRED_TREASURES_GLOSS')] jsou odhaleny, jak velí tradice. A konečně je předána velká [host.Custom('GetTitleTierAdjective')|U] pečeť."
 coronation_events.6102.desc_mid_east_asian_ending_guest: "Edikty jsou vyhlášeny, ministři skládají přísahy svým úřadům a pradávné poklady jsou odhaleny, jak velí tradice. A konečně je předána velká [host.Custom('GetTitleTierAdjective')|U] pečeť."
 coronation_events.6102.desc_high_guest: "Ale... [host.GetFirstNameNoTooltipRegnal] rozhodně nevykonává obřad [Select_CString(host.IsFemale,'sama','sám')]! Od nejnižší stoky až po nejvyšší věž burácí prázdným vzduchem ohlušující jásot — jako by křik tisíců mohl budovu [host.Custom('ResidenceBuilding')] otřást až do základů!\n\n[host.GetFirstNameNoTooltipRegnal] usedá na trůn nikoli jako [Select_CString(host.IsFemale,'žena','muž')], nýbrž jako [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l]. Ne jako smrtelník, nýbrž — jak poddaní skandují a zpívají — jako dar, který [host.GetFaith.HighGodName] seslal lidu [host.GetPrimaryTitle.GetAdjective]."
 coronation_events.6102.desc_low_guest: "Cesta je dlouhá... a tichá. Každý krok se rozléhá jako kapka dopadající na bezednou hladinu. [anointer.GetName], se slzami v očích, začne zpívat žalozpěv:\n\n„#EMP [host.GetFaith.random_GoodGodNames], zachraňte nás! Z propasti, ze zoufalství: zachraňte děti [host.GetPrimaryTitle.GetNameNoTier]! [host.GetFaith.HighGodName], ušetři nás pustoty [host.GetFaith.NegativeAfterLife]! Kéž se náš [host.GetTitleAsNameNoTooltip|l] postaví zlu člověka!#!“\n\nZatímco lid [host.GetPrimaryTitle.GetAdjectiveNoTooltip] propadá strachu a nářku, [host.GetTitledFirstNameNoTooltipRegnal] usedá na trůn."
 coronation_events.6102.desc_mid_guest: "Modlitby z úst [host.GetFirstNameNoTooltipRegnal] se mísí se sílícím zpěvem. Spolu se svými poddanými se [host.GetFirstNameNoTooltipRegnal] modlí: „#EMP [host.GetFaith.random_GoodGodNames], ochraňujte tento [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] pod [host.GetFaith.PositiveAfterLife] vždy, nyní i navěky! Na věky věků! [host.GetFaith.random_GoodGodNames], požehnejte síle [host.GetTitleAsName]!#!“\n\n[host.Custom('GetLowOfficialPlural')|U], [host.Custom('KnightCulturePluralNoTooltipLowercase')] a [host.Custom('GetLocalCommonerTermPlural')] se hluboce uklánějí. [host.GetNameNoTooltipRegnal] usedá na posvátný trůn, sídlo své moci. #EMP „Sláva [host.GetFirstNameNoTooltipRegnal]!“#! volají všichni. „#EMP Z vůle [host.GetFaith.HighGodName], náš [host.GetTitleAsNameNoTooltip|l]!#!“"
 coronation_events.6102.a_guest_neg: "[host.GetFirstNameNoTooltipRegnal] je poskvrnou svého vznešeného trůnu."
 coronation_events.6102.a_guest_pos: "Sláva trůnu [host.GetPrimaryTitle.GetAdjectiveNoTooltip]!"
 coronation_events.6102.a_guest: "Obřad je u konce. [host.GetTitleAsNameNoTooltip] je nastolen."
 coronation_events.6102.a_host_neg: "#EMP Takhle#! začíná má vláda...?"
 coronation_events.6110.t_nomad: "Klenoty [ROOT.Char.GetTitleAsNameNoTooltip]"
 coronation_events.6110.t: "Klenoty [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 coronation_events.6110.desc: "Ve slavnostním průvodu přinášejí symboly [ROOT.Char.GetPrimaryTitle.GetAdjective] vlády — a také"
 coronation_events.6110.desc_crown: "korunu,"
 coronation_events.6110.desc_crowns: "koruny,"
 coronation_events.6110.desc_regalia: "insignie,"
 coronation_events.6110.desc_2: "jež mám nést. Vše je prostoupeno modlitbami a požehnáním. [ROOT.Char.GetFaith.PriestNeuterPlural] připravují mou slavnostní výbavu obřadními úkony a při jejich vzývání zaznívá jméno"
 coronation_events.6110.desc_st_peter: "svatý Petr, klíčník nebeského království."
 coronation_events.6110.desc_samuel: "prorok Samuel."
 coronation_events.6110.desc_generic: "[ROOT.Char.GetFaith.KnowledgeGodName]."
 coronation_events.6110.desc_old_artifact: "\n\nMá se nádherný [crowning_artifact.GetName] navždy stát součástí dědictví [ROOT.Char.GetPrimaryTitle.GetNameNoTier]? Vždyť už máme panovnickou insignii: [old_title_artifact.GetName]."
 coronation_events.6110.desc_no_old_artifact: "\n\nMá se tímto obřadem můj milovaný [crowning_artifact.GetName] navždy stát součástí dědictví [ROOT.Char.GetPrimaryTitle.GetNameNoTier]?"
 coronation_events.6110.desc_no_old_artifact_plural: "\n\nMá se můj milovaný [crowning_artifact.GetName] navždy stát součástí dědictví [ROOT.Char.GetPrimaryTitle.GetNameNoTier]? Nebo snad raději [crowning_artifact_2.GetName]...?"
 coronation_events.6110.a: "#EMP Ó, [crowning_artifact.GetNameNoTooltip] — ó, nádhera nad veškerou nádheru!#!"
 coronation_events.6110.b: "Zasvětím skutečně [ROOT.Char.Custom('GetTitleTierAdjective')] klenot: [crowning_artifact_2.GetNameNoTooltip]."
 coronation_events.6110.c: "Zasvětím vznešený [crowning_artifact_3.GetNameNoTooltip]."
 coronation_events.6110.d: "Pro [ROOT.Char.GetTitleAsNameNoTooltip]: [crowning_artifact_4.GetNameNoTooltip]."
 coronation_events.6110.e: "Panství získá [crowning_artifact_5.GetNameNoTooltip]."
 coronation_events.6110.f: "[crowning_artifact.GetNameNoTooltip] patří mému rodu."
 coronation_events.6110.f_plural: "Tyto poklady patří mému rodu."
