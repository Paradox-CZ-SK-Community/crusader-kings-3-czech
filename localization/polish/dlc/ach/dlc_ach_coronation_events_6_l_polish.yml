l_polish:
 coronation_events.6000.t: "Shromáždění Konfederace"
 coronation_events.6000.desc: "V očích ostatních náčelníků se lesknou slzy — slzy radosti a smíchu!\n\nMezi námi stojí [host.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('host'))]: skromně, nikoli vysoko nad ostatními jako nějaký chladný cizácký císař. [host.GetTitleAsName] si pohrává s koněm [other_vassal.GetFirstNameNoTooltip], dokud zvíře [Select_CString(host.IsFemale,'nekousne hostitelku','nekousne hostitele')] do prstů, a my šlechtici propukneme v upřímný smích!\n\nMožná už nestojíme v bitevní řadě jako skutečně rovní, ale... stále jsme [host.GetPrimaryTitle.GetDefinitiveName] a tento den patří nám."
 coronation_events.6000.a: "„Přísahám — #EMP Konfederace navěky!#!“"
 coronation_events.6000.a.flavor: "Kéž toto nejsou poslední roky [host.GetPrimaryTitle.GetNameNoTooltip], nýbrž jeho skutečné znovuzrození!"
 coronation_events.6000.b: "„Pojďte, rodino: ať vás poznají naši přísežní druhové!“"
 coronation_events.6000.b.flavor: "Smích válečníků a úsměvy žen — má rodina rozzáří tuto korunovační hostinu."
 coronation_events.6000.c: "Časy se možná mění, ale stále jsme jedno."
 confederation_remove_destroy_chance_tt: "@alert_icon! #alert_trial [host.GetPrimaryTitle.GetName] již nebude zničeno, když jeho [Concept('holder','držitel')|E] získá další [Concept('kingdom','království')|E]#!"
