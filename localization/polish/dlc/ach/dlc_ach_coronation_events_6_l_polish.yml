 coronation_artifact_improved: "[artifact_target.GetName] získá nový [Concept('modifier','modifikátor')|E]"
 crowning_artifact_desc: "[chosen_artifact.GetDesc]\n\nV roce [year] byl tento předmět požehnán jako panovnická insignie [host.GetPrimaryTitle.GetNameNoTier] při korunovaci [host.GetTitledFirstNameRegnal]."
 old_title_artifact_remains_tt: "[old_title_artifact.GetName] bude použito při tvé [Concept('coronation','korunovaci')|E]"
 coronation_title_artifact_log_title: "Artefakt zasvěcen [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 coronation_title_artifact_log: "[chosen_artifact.GetName] se nyní bude dědit společně s [host.GetPrimaryTitle.GetName]"
 HOF_DOESNT_EXIST: "Tvá [Concept('faith','víra')|E] nemá [Concept('head_of_faith','hlavu víry')|E]"
 coronation_events.6120.t: "Přísahající [host.GetFaith.BishopNeuterPlural|l]"
 coronation_events.6120.desc_cathedral: "Vzduchem se line kadidlo, zatímco mé [ROOT.Char.Custom('GetTitleTierAdjective')] procesí proudí do katedrály."
 coronation_events.6120.desc_holy_site: "Vzduchem se linou posvátné vůně, zatímco mé [ROOT.Char.Custom('GetTitleTierAdjective')] procesí proudí do [ROOT.Char.GetFaith.HouseOfWorship]."
 coronation_events.6120.desc_generic_intro: "Za branami [host.Custom('ResidenceBuilding')] se mé [ROOT.Char.Custom('GetTitleTierAdjective')] procesí vine k posvátnému oltáři, kde už čekají obřadníci."
 coronation_events.6120.desc_low_magnificence: "Šlechta a [host.GetFaith.AltPriestTermPlural] se strkají o místa a hašteří se mezi sebou. Několik slabých hlasů ze sebe namáhavě souká posvátné modlitby."
 coronation_events.6120.desc_high_magnificence: "Šlechta, [host.GetFaith.AltPriestTermPlural] i já slavnostně zaujímáme svá místa za podmanivého přílivu a odlivu posvátných modliteb."
 coronation_events.6120.desc_generic_mid: "Šlechta ustupuje stranou a přicházejí [host.GetFaith.AltPriestTermPlural], jejichž hlasy se spojují v jedinou posvátnou modlitbu."
 coronation_events.6120.desc_anointment: "\n\nNyní přichází obřad, při němž [host.GetFaith.BishopNeuterPlural] přednášejí svou žádost, zatímco [hof.GetTitledFirstNameRegnal] vše pozorně sleduje."
 coronation_events.6120.desc: "\n\nNyní přichází obřad, při němž [host.GetFaith.BishopNeuterPlural] přednášejí svou žádost."
 coronation_events.6120.desc_low_clergy: "Tito malicherní tyrani mnou pohrdají a svou posvátnou žádost pronášejí jako ponižující urážku.\n\n„Služebníku [ROOT.Char.GetFaith.HighGodName], kaješ se za své četné hříchy? Přísaháš, že potlačíš své smrtelné rozmary a budeš chránit [host.GetFaith.AltPriestTermPlural], neboť [ROOT.Char.GetFaith.HighGodName] je miluje?“"
 coronation_events.6120.desc_high_clergy: "Tito prostředníci božské vůle mě chovají v hluboké úctě a s téměř zbožnou pokorou prosí:\n\n„Velký [host.GetTitleAsName], budeš chránit věřící a zachovávat práva [host.GetFaith.AltPriestTermPlural]?“"
 coronation_events.6120.desc_mid_clergy: "Tito duchovní si mnou nejsou úplně jisti a svou obvyklou žádost pronášejí s opravdovým zájmem.\n\n„Budeš jako [ROOT.Char.GetTitleAsName] chránit věřící? Zachováš práva a výsady [host.GetFaith.AltPriestTermPlural]?“"
 coronation_events.6120.a: "#EMP „Budu kladivem na nevěřící!“#!"
 coronation_events.6120.a.flavor: "Přísaha, že s naprostou nenávistí vyhladím kacíře a nevěřící, potěší [host.GetFaith.AltPriestTermPlural]... a nasměruje mou vládu na spravedlivou cestu!"
 coronation_events.6120.b: "Překroutím obvyklou odpověď ve svůj prospěch."
 coronation_events.6120.b.flavor: "Mezi slibem věrnosti těmto [ROOT.Char.GetFaith.PriestNeuterPlural]... a postavením mandátu od [ROOT.Char.GetFaith.HighGodName] nad jejich vlastní je tak tenká hranice..."
 coronation_denying_clergy_modifier: "Využívání duchovenstva"
 coronation_denying_clergy_modifier_desc: "Namísto služby víře tato postava uplatňuje nadvládu nad duchovenstvem a jeho příjmy."
 coronation_events.6120.c_begrudging: "Řeknu ta slova. Jak musím."
 coronation_events.6120.c_christian: "„Budu bránit svatou Kristovu církev.“"
 coronation_events.6120.c: "„Budu bránit věřící, jimž vládne [ROOT.Char.GetFaith.HighGodName].“"
 coronation_swore_persecution_modifier: "Přísaha pronásledování"
 coronation_swore_persecution_modifier_desc: "Významnou součástí korunovace této postavy byla nezapomenutelně zuřivá přísaha pronásledovat nevěřící."
 coronation_events.6121.t_kurultai: "Kurultaj"
 coronation_events.6121.t: "Prosba šlechty"
 cultural_acceptance_favored_during_oath: "Vzájemný projev úcty během korunovačních přísah"
 coronation_events.6121.desc_kurultai: "Žádný jediný hlas jako první nevykřikne titul [ROOT.Char.GetTitleAsNamePossessive] k Věčnému modrému nebi! Žádná #EMP jediná#! ruka nepozvedne prapor z koňských žíní! Všichni páni kmenů, shromáždění na tomto [Glossary('kurultaji','KURULTAI_GLOSS')], musí vyslovit souhlas s tím, kdo jejich koně požene do války."
 KURULTAI_GLOSS: "Rada vládců kočovníků, svolaná k volbě nového panovníka za doprovodu hodování, zápasů a lukostřeleckých soutěží. Při těchto příležitostech se často plánovala i velká vojenská tažení."
 coronation_events.6121.desc_byzantine: "Šlechta přichází vzdát hold svému [Glossary('Autokratorovi','AUTOKRATOR_GLOSS')]. Kdybychom byli v poli a oni byli vojáci, vyzdvihli by mě na velikém naleštěném štítu. Tady se připlazí vpřed a líbají mi kolena."
 coronation_events.6121.desc_generic_intro: "Vazalové [ROOT.Char.GetPrimaryTitle.GetNameNoTier] přicházejí složit přísahu věrnosti. Jeden po druhém pozvedají otevřené dlaně, jeden po druhém se sklánějí k polibkům oddanosti."
 coronation_events.6121.desc_low_approval: "\n\nJenže... mí vazalové zanedbávají projevy úcty. Někdo zasyčí: „#EMP [ROOT.Char.GetFirstNameNicknamed]? [vassal_2.Custom('CulturalCurse')|U]!#!“ a naruší předepsaná slova. [vassal_1.GetTitledFirstNameNicknamed] mi během své přísahy hledí do očí s čirou záští. [vassal_2.GetTitledFirstNameNicknamed] se dokonce odvažuje přede mnou nosit zbraň a sotva ze sebe něco šeptem dostane."
 coronation_events.6121.desc_high_approval: "\n\nJeště jsem se ani pořádně nestal [ROOT.Char.GetTitleAsNameNoTooltip], a přesto je v těchto prosbách tolik oddanosti, že by pohnula každým srdcem. Hlasy nejmocnějších osobností panství se chvějí dojetím a jejich tváře září nadějí!"
 coronation_events.6121.desc_mid_approval: "\n\nJak přicházejí, přemítám... v dechu, který vyslovuje slovo „[ROOT.Char.GetTitleAsName]“, necítím ani vroucnost lásky, ani náznak věrnosti..."
 coronation_events.6121.a: "„Tihle odpůrci jsou loutkami cizích mocností!“"
 coronation_events.6121.a.flavor: "Tvá poplašná tiráda nedá odpůrcům jinou možnost než zavrhnout své zahraniční spojence."
 coronation_events.6121.b: "Musím vyzdvihnout ty, pro které jsou tyto zvyky nové."
 coronation_events.6121.b_flavor: "Povstanu a vzdám čest menšinovým pánům svého panství!"
 coronation_events.6121.c: "Mí podporovatelé stojí při mně!"
 coronation_events.6121.d: "„Pohleďte, zrádci! #EMP Na moc svého [ROOT.Char.GetTitleAsNameNoTooltip]!#!“"
 coronation_events.6121.d_flavor: "[vassal_2.GetTitledFirstNameNoTooltip] přede mnou tasí čepel — #EMP donutím [Select_CString(vassal_2.IsFemale,'ji','ho')], aby ji použil!#!"
 coronation_events.6121.e_low: "Nenávidí mě. Ale zastavit mě nedokážou."
 coronation_events.6121.e_high: "Naprosté podrobení. Nádherný pohled."
 coronation_events.6121.e_mid: "To jsou mí vazalové, opory mé vlády."
 coronation_events.6121_duel_tt: "#V Souboj#! s [vassal_2.GetShortUIName]\n@death_icon! #X Tento souboj je na život a na smrt!#!\nTvá [Concept('prowess','udatnost')|E]: [prowess_i]#V [host.GetProwess]#!\n[Concept('prowess','Udatnost')|E] [vassal_2.GetFirstNameNoTooltip]: [prowess_i]#V [vassal_2.GetProwess]#!"
 coronation_events.6122.t: "Prosba k lidu"
 coronation_events.6122.desc_intro_foreign: "Jako další přicházejí stařešinové z řad [host.Custom('GetLocalCommonerTermPlural')] z [location.GetTitle.GetNameNoTier], aby v nepřítomnosti ostatních zastoupili prosté [host.GetPrimaryTitle.GetAdjective] poddané. [host.GetFaith.BishopNeuter] tyto shrbené starce upozorní na mou velikou moc a autoritu a požádá je o symbolický souhlas s tím, abych se stal právoplatným [ROOT.Char.GetTitleAsName].\n\n"
 coronation_events.6122.desc_intro: "Jako další přicházejí stařešinové z řad [host.Custom('GetLocalCommonerTermPlural')] z [location.GetTitle.GetNameNoTier], aby vyslovili souhlas prostého lidu. [host.GetFaith.BishopNeuter] tyto shrbené starce upozorní na mou velikou moc a autoritu a zeptá se jich, zda mě přijímají jako právoplatného [ROOT.Char.GetTitleAsName].\n\n"
 coronation_events.6122.desc_high_approval_christian: "Když pronášejí předepsaná slova, dolehnou ke mně i jiné hlasy. Za [ROOT.Char.GetFaith.HouseOfWorship] čekající zástupy zpívají v můj prospěch [Glossary('Kýrie, eléison','KYRIE_ELEISON_GLOSS')]. Stovky duší se v jediném mocném, valícím se hlasu modlí za tu mou!"
 coronation_events.6122.desc_high_approval: "Když pronášejí předepsaná slova, dolehnou ke mně i jiné hlasy. Za [ROOT.Char.GetFaith.HouseOfWorship] čekající zástupy radostně volají v očekávání. Stovky lidí znovu a znovu skandují mé jméno:\n\n„#EMP [ROOT.Char.GetFirstName]! [ROOT.Char.GetFirstNameNoTooltip]! [ROOT.Char.GetFirstNameNoTooltip] z [ROOT.Char.GetPrimaryTitle.GetNameNoTier]!#!“"
 coronation_events.6122.desc_low_approval: "Pronášejí slova rozechvělými hlasy, zatímco kolem sílí řev. Za [ROOT.Char.GetFaith.HouseOfWorship] vyjí všichni ti nemytí chudáci z [location.GetTitle.GetNameNoTier] — příšerný rámus! Něco je popudilo. Nesmyslná rvačka, místní svár... nebo snad nový [ROOT.Char.GetTitleAsNameNoTooltip], kterého všichni nenávidí."
 coronation_events.6122.desc_mid_approval: "Předepsaná slova pronesou dostatečně dobře a já jim na oplátku slíbím ochranu — má pravomoc se přece nevztahuje jen na urozené [ROOT.Char.GetFaith.PriestNeuterPlural] a šlechtu. A svůj domov mezi [capital_p.Custom('TerrainTypeProvince')] v [capital_p.GetTitle.GetNameNoTier] sdílím s mnoha neurozenými z [capital_p.GetCulture.GetName] kultury."
 coronation_events.6122.a: "Kéž nikdo z přítomných na tento den nezapomene!"
 coronation_events.6122.a.flavor: "Všichni tito věrní lidé si zaslouží, abych se jim osobně ukázal! A také chléb od svého [ROOT.Char.GetTitleAsNameNoTooltip]!"
 coronation_events.6122.b: "Dost odporu. Každý, kdo se ozve, dostane výprask."
 coronation_events.6122.b.flavor: "Na tenhle hlučný dav i na každého dalšího v zemi čeká bota [host.Custom('GetFighterTermPossessive')]!"
 coronation_events.6122.c_low: "Ale já vládnu nade všemi."
 coronation_events.6122.c_high: "Jak #EMP úpěnlivě prosí#!, abych jim vládl!"
 coronation_events.6122.c_mid: "Je mi ctí."
 coronation_events.6122.c_v_low_humble: "Úděl prostého lidu se mě dotýká."
 coronation_events.6122.c_v_low: "Špinavá neurozená chátra."
 coronation_events.6123.t: "Trojí souhlas"
 coronation_events.6123.desc_intro: "Dokud [host.GetFaith.BishopNeuterPlural], [host.GetPrimaryTitle.GetAdjective] šlechta i prostý lid nesplní svou tradiční úlohu, [host.GetFirstName] není skutečným [host.GetTitleAsNameNoTooltip|l]. Bez jejich souhlasu nemůže být jeho vláda spravedlivá.\n\nNejprve [ROOT.Char.GetFaith.PriestNeuterPlural]."
 coronation_events.6123.desc_low_clergy: "S pokrytecky pozdviženými bradami nutí [host.GetTitleAsNameNoTooltip|l], aby nejen přísahal ochranu věřících [host.GetFaith.GetAdherentNamePlural], ale také činil pokání za své hříchy."
 coronation_events.6123.desc_high_clergy: "S obdivem vychvalují zbožnost [host.GetTitleAsNameNoTooltip|l] a velikou oddanost ochraně [host.GetFaith.GetAdherentNamePlural] a žádají, aby se stal jejich velkým zastáncem."
 coronation_events.6123.desc_mid_clergy: "Žádají [host.GetTitleAsNameNoTooltip|l], aby ctil jejich posvátná práva a bránil věřící. [host.GetFirstNameNoTooltip] souhlasí."
 coronation_events.6123.desc_then: "Poté"
 coronation_events.6123.desc_pop_foreign: "místní [host.Custom('GetLocalCommonerTermPlural')] zastupují prostý [host.GetPrimaryTitle.GetAdjective] lid. A"
 coronation_events.6123.desc_low_populace: "stařešinové z [location.GetTitle.GetBaseNameNoTier] předstupují rozechvělí strachem, zatímco za [ROOT.Char.GetFaith.HouseOfWorship] zuří nepokoje. Zdejší chátra nechová k [host.GetTitleAsNameNoTooltip|l] žádnou náklonnost.\n\n"
 coronation_events.6123.desc_high_populace: "stařešinové z [location.GetTitle.GetBaseNameNoTier] hledí na [host.GetTitleAsNameNoTooltip|l] s úžasem, zatímco davy venku oslavují [host.Custom('GetTitleTierAdjective')] jméno [host.GetFirstNameNoTooltip].\n\n"
 coronation_events.6123.desc_mid_populace: "stařešinové z [location.GetTitle.GetBaseNameNoTier] chraplavě vysloví svůj symbolický souhlas a [host.GetTitleAsNameNoTooltip|l] slíbí prostému lidu [Select_CString(host.IsFemale,'mateřskou','otcovskou')] lásku.\n\n"
 coronation_events.6123.desc_low_vassals: "Vazalové [host.GetFirstNameNoTooltip] ponuře kráčejí vpřed. Většina z nich se mezi projevy zášti sotva obtěžuje pronést slova věrnosti."
 coronation_events.6123.desc_high_vassals: "Vazalové [host.GetFirstNameNoTooltip] předstupují, aby se pokořili. Většině tváře září nadějí a upřímně přísahají věrnost i oddanost."
 coronation_events.6123.desc_mid_vassals: "Vazalové [host.GetFirstNameNoTooltip] předstupují, aby polibkem a přísahou stvrdili svou věrnost. Někteří přikládají tomuto aktu velikou váhu, jiní ponuře mumlají a oči od prachu nezvednou."
 coronation_events.6123.desc_end_vassal: "Nakonec přichází... řada na mě."
 coronation_events.6123.desc_end_spectator: "Obřad pokračuje dál a dál."
 coronation_events.6123.a: "Hlasitě přísahám, #EMP s naprostou oddaností!#!"
 coronation_events.6123.a_flavor: "Pozvedněte hlasy, druhové! Skandujte slavné jméno našeho nového [host.GetTitleAsNameNoTooltip|l]!"
 coronation_events.6123.b: "Svým pohrdáním způsobím skandál."
 coronation_events.6123.b_flavor: "Tenhle malý obřad [host.GetFirstNameNoTooltip] má vyžadovat mé podrobení? Raději pohorším všechny ty ubohé přívržence a plivnu [Select_CString(host.IsFemale,'jí','mu')] do tváře!"
 coronation_events.6123.c_vassal_resents: "Zamumlám, co se tak obvykle říká."
 coronation_events.6123.c_vassal_pleased: "Pokleknu před [host.GetFirstNameNoTooltipRegnal], pravým [host.GetTitleAsNameNoTooltip]."
 coronation_events.6123.c_vassal_neutral: "Pokleknu před svým [host.GetTitleAsNameNoTooltip]."
 coronation_events.6123.c_likes_disrespect: "Vazalové [host.GetFirstNameNoTooltip] vidí skrz tuhle frašku..."
 coronation_events.6123.c_dislikes_disrespect: "Jejich [host.GetTitleAsNameNoTooltip] si zaslouží víc!"
 coronation_events.6123.c_dislikes_loyalty: "Tihle [host.GetPrimaryTitle.GetAdjectiveNoTooltip] červi patří na zem..."
 coronation_events.6123.c_likes_loyalty: "Důkaz jejich cti a ctnosti [host.GetFirstNameNoTooltip]."
 coronation_events.6123.c_dislikes_host: "Představte si přísahat věrnost takovému [host.Custom('InsultNoun')]..."
 coronation_events.6123.c: "[host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] se sklání před [host.GetFirstNameNoTooltipRegnal]."
 coronation_supporter_pledge_leader_log_title: "Podporovatel vede přísahy věrnosti"
 coronation_detractor_pledge_insult_log_title: "Odpůrce pohrdá přísahou novému lennímu pánovi"
 coronation_events.6130.t_anointment: "Pomazání"
 coronation_events.6130.t_dharmic: "Posvátné vody"
 coronation_events.6130.t: "Svatý olej"
 coronation_events.6130.desc.intro: "Blíží se poslední posvátný okamžik."
 coronation_events.6130.papal_intro_host: "Nejprve však přichází pomazání svatým olejem, znamení souhlasu [anointer.GetTitledFirstNameRegnal]: nejen se mnou jako vládcem [ROOT.Char.GetPrimaryTitle.GetNameNoTier], ale i s mým místem mezi nejvznešenějšími z Kristových vyvolených."
 coronation_events.6130.papal_intro_guest: "Nejprve však přichází pomazání, znamení toho, že [host.GetTitledFirstNameRegnal] vládne z Božího pověření. [anointer.GetTitledFirstNameRegnal] [Select_CString(anointer.IsFemale,'sama přináší','sám přináší')] svatý olej a ujímá se role proroka Samuela při pomazání [host.GetPrimaryTitle.GetAdjective] obdoby krále Davida."
 coronation_events.6130.abrahamic_intro_host: "Nejprve musím být pomazán svatým olejem a pověřen vedením věřících, jimž vládne [host.GetFaith.HighGodName], jako někdo povznesený nad obyčejné stádo."
 coronation_events.6130.abrahamic_intro_guest: "Nejprve musí být [host.GetTitledFirstNameRegnal] [Select_CString(host.IsFemale,'pomazána','pomazán')] svatým olejem, [Select_CString(host.IsFemale,'povznesena','povznesen')] nad ostatní věřící, jimž vládne [host.GetFaith.HighGodName], a [Select_CString(host.IsFemale,'pověřena','pověřen')] péčí o duše svého panství."
 coronation_events.6130.dharmic_intro_host: "Obětiny byly přineseny a [Glossary('Rádžasúja','RAJASUYA_GLOSS')] započala. Nyní přichází posvátná [Glossary('Abhišéka','ABHISHEKA_GLOSS')]. Recituji védské mantry a kolem se shromažďují nositelé sedmnácti posvátných vod."
 coronation_events.6130.dharmic_intro_guest: "Obětiny byly přineseny a [Glossary('Rádžasúja','RAJASUYA_GLOSS')] započala. Nyní přichází posvátná [Glossary('Abhišéka','ABHISHEKA_GLOSS')]. [host.GetTitledFirstNameRegnal] recituje védské mantry a kolem [Select_CString(host.IsFemale,'ní','něj')] se shromažďují nositelé sedmnácti posvátných vod."
 RAJASUYA_GLOSS: "Běžně praktikovaná série obřadů užívaných při nastolování panovníků dharmických věr. #G Rádžasúja#! zahrnuje například kropení posvátnými vodami, převzetí luku se třemi šípy, stoupnutí na tygří kůži a hru v kostky."
 ABHISHEKA_GLOSS: "Pradávný dharmický obřad, při němž jsou králové či stařešinové kropeni vodou přinesenou z posvátných řek a ze čtyř koutů indického pobřeží. Obřad je spojen s nástupem na trůn."
 coronation_events.6130.generic_intro_host: "Nejprve však přichází pomazání svatým olejem, znamení souhlasu [anointer.GetTitledFirstNameRegnal]: nejen se mnou jako vládcem [ROOT.Char.GetPrimaryTitle.GetNameNoTier], ale i s mým místem mezi věřícími, jimž přeje [host.GetFaith.HighGodName]."
 coronation_events.6130.generic_intro_guest: "Nejprve však přichází pomazání, znamení toho, že [host.GetTitledFirstNameRegnal] vládne z pověření [host.GetFaith.HighGodName]. [anointer.GetTitledFirstNameRegnal] [Select_CString(anointer.IsFemale,'sama přináší','sám přináší')] svatý olej."
 coronation_events.6130.faith_head_disapproves: "\n\n[anointer.GetTitledFirstName] s patrnou nechutí"
 coronation_events.6130.faith_head_likes: "\n\n[anointer.GetTitledFirstName] s rodičovskou hrdostí"
 coronation_events.6130.faith_head: "\n\n[anointer.GetTitledFirstName], přímluvce za [host.GetFaith.GetAdherentNamePlural],"
 coronation_events.6130.christian_non_hof_non_cc: "\n\n[anointer.GetTitledFirstName], duchovní pastýř svého lidu,"
 coronation_events.6130.christian_non_hof: "\n\n[anointer.GetTitledFirstName], duchovní pastýř lidu [host.GetPrimaryTitle.GetNameNoTier],"
 coronation_events.6130.anointer_fallback: "\n\n[anointer.GetTitledFirstName], [Select_CString(anointer.IsFemale,'vážná a moudrá','vážný a moudrý')],"
 coronation_events.6130.anointing_abrahamic_host_disrespectful: "mě pomazává štiplavým zlatavým olejem. Na natažené ruce, hlavu, hruď, ramena i loketní jamky... toto pomazání náleží prorokům, [host.GetFaith.PriestNeuterPlural] a panovníkům.\n\n"
 coronation_events.6130.anointing_abrahamic_host: "mě pomazává posvátným, sladce vonícím zlatavým olejem. Na rozechvělé ruce, hlavu, hruď, ramena i loketní jamky... týmž pomazáním, jakého se dostává prorokům, [host.GetFaith.PriestNeuterPlural] a panovníkům.\n\n"
 coronation_events.6130.anointing_abrahamic_guest: "pomazává [host.GetFirstNameNoTooltip] posvátným zlatavým olejem. Ruce, hlavu, hruď, ramena i loketní jamky... požehnání určené prorokům, [host.GetFaith.PriestNeuterPlural] a panovníkům.\n\n"
 coronation_events.6130.anointing_dharmic_host: "vede ty, kdo mě zasvěcují. Ze zlatých nádob proudí životodárné vody. V zářivých proudech skrápějí mé tělo a přinášejí sladké vzpomínky na Sarasvatí, Gangu a moře.\n\n"
 coronation_events.6130.anointing_dharmic_guest: "vede ty, kdo provádějí zasvěcení. Ze zlatých nádob proudí životodárné vody a v zářivých proudech skrápějí [host.GetFirstNameNoTooltip].\n\n"
 coronation_events.6130.ending_abrahamic_host_zealous: "Na mé kůži se zračí samotná přízeň, kterou mi dává [host.GetFaith.HighGodName]."
 coronation_events.6130.ending_abrahamic_host_cynical: "[host.GetFaith.HighGodName] mi dává svou přízeň. A já jsem [Select_CString(host.IsFemale,'celá mastná','celý mastný')]."
 coronation_events.6130.ending_abrahamic_guest_zealous: "Na kůži [host.GetFirstNameNoTooltip] se zračí samotná přízeň, kterou dává [host.GetFaith.HighGodName]."
 coronation_events.6130.ending_abrahamic_guest_cynical: "Mastná kůže [host.GetFirstNameNoTooltip] je pro věřící znamenitým potvrzením."
 coronation_events.6130.ending_dharmic_host: "Říční bohyně a bohové moří, [ROOT.Char.GetFaith.WaterGodName] i [host.GetFaith.FertilityGodName] mi vzdávají poctu jako [host.GetTitleAsName]."
 coronation_events.6130.ending_dharmic_guest: "Říční bohyně a bohové moří, [host.GetFaith.WaterGodName] i [host.GetFaith.FertilityGodName] vzdávají [host.GetFirstNameNoTooltip] poctu jako [host.GetTitleAsName]."
 coronation_events.6130.a: "Ze svatého oleje — #EMP svatý oheň!#!"
 coronation_events.6130.a_dharmic: "A tyto vody musí být bráněny!"
 coronation_events.6130.a.flavor: "Když je [host.GetFaith.GetNameNoTooltip] v ohrožení, potřebuji snad ještě další požehnání, abych se stal skutečným zastáncem víry? Ne!"
 coronation_events.6130.b: "Je na mně šířit požehnané slovo."
 coronation_events.6130.c: "[anointer.GetTitledFirstNameNoTooltip] mi [Select_CString(anointer.IsFemale,'dala','dal')] poznat, že [host.GetFaith.HighGodName] mi přeje."
 coronation_events.6130.c_dharmic: "[anointer.GetTitledFirstNameNoTooltip] mi svou pomocí [Select_CString(anointer.IsFemale,'prokázala','prokázal')] velikou čest."
 coronation_events.6130.c.flavor: "Musím prelátovi vyjádřit svou vděčnost."
 coronation_events.6130.d.faithful_host: "Zářím samotnou přízní, kterou mi dává [host.GetFaith.HighGodName]!"
 coronation_events.6130.d.cynical_host: "Kdo z [host.GetFaith.GetAdherentNamePlural] by mě teď mohl odmítnout?"
 coronation_events.6130.d.faithful_guest: "A tak si [host.GetFaith.HighGodName] vybírá [host.GetTitledFirstNameNoTooltip]."
 coronation_events.6130.d.cynical_guest: "A tak duchovenstvo přijímá [host.GetTitleAsNameNoTooltip]."
 coronation_events.6130.d.faithful_host_dharmic: "Kéž má mysl navždy spočívá u jejich lotosových nohou."
 coronation_events.6130.d.faithful_guest_dharmic: "Kéž čisté a neklidné vody přinesou moudrost."
 coronation_anointed_imperial_modifier: "Nejvyšší pomazání"
 coronation_anointed_imperial_modifier_desc: "Tento pomazaný panovník nedovolí nikomu zapomenout, že jeho vládu požehnal a stvrdil nejvyšší prelát víry."
 coronation_anointed_modifier: "Vysoké pomazání"
 coronation_anointed_modifier_desc: "Tento pomazaný panovník dává důrazně najevo své poslání vést věřící."
