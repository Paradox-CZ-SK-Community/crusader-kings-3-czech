l_polish:
 coronation_events_klank.1001.t: "Podezřele pestrá společnost"
 coronation_events_klank.1001.desc: "Darebáci, tuláci, ničemové, jeden vedle druhého... krouží kolem jako supi a čekají na chvíli, kdy si urvou svůj kus masa. Mému bdělému oku však neuniknou.\n\nTamhle jsou. [first_culture_char.GetFullName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('first_culture_char'))], v tom nejlepším oděvu [first_culture_char.GetCulture.GetName] kultury, a [second_culture_char.GetFullName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('second_culture_char'))], ve stejně okázalém šatu [second_culture_char.GetCulture.GetName] kultury. Nevinné sbližování kultur, nebo rodící se spiknutí?\n\nAlespoň jejich pestrobarevný vzhled oživuje dnešní den jako hejno rozpustilých ptáků."
 coronation_events_klank.1001.a: "„Vy dva! Poklekněte před svým [ROOT.Char.GetTitleAsNameNoTooltip].“"
 coronation_events_klank.1001.b: "Ti cizinci si mou pozornost nezaslouží."
 coronation_events_klank.1002.t: "Nádherně pestrá společnost"
 coronation_events_klank.1002.desc: "[ROOT.Char.GetPrimaryTitle.GetName] je rozlehlé a překypuje věrnými poddanými všeho druhu. Ne všichni jsou samozřejmě stejně věrní, ale dost z nich na to, aby zajistili stabilitu na dlouhá léta.\n\nTamhle jsou, zabraní do hovoru. Jistě rozmlouvají o laskavosti mé vlády a blahobytu mého panství. [first_culture_char.GetFullName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('first_culture_char'))], v tom nejlepším oděvu [first_culture_char.GetCulture.GetName] kultury, a [second_culture_char.GetFullName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('second_culture_char'))], ve stejně působivém šatu [second_culture_char.GetCulture.GetName] kultury.\n\nJejich pestrobarevný vzhled oživuje dnešní den jako hejno nádherných ptáků."
 coronation_events_klank.1002.a: "Uznale jim pokývnu."
 coronation_events_klank.1002.b: "Srdečně hodnostáře přivítám."
 coronation_events_klank.1003.t: "Nový úsvit, staré kobky"
 coronation_events_klank.1003.desc: "Ach, [child_of_executee.GetName]... [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child_of_executee'))]. Není to poprvé, co někdo z rodu [child_of_executee.GetHouse.GetName] stojí před někým z rodu [ROOT.Char.GetHouse.GetName] a neví, jaký osud jej čeká.\n\nPředchozí [executed_previous_holder.GetTitleAsNameNoTooltip] z [child_of_executee.GetPrimaryTitle.GetNameNoTier], [executed_previous_holder.GetFirstName], [executed_previous_holder.GetDeathReason]. Od smrti [executor_ancestor.GetTitledFirstName] zůstal přesný důvod popravy pohřben spolu s [executed_previous_holder.GetFirstNameNoTooltip]. Po celá léta neměl rod [child_of_executee.GetHouse.GetNameNoTooltip] na svých praporech své heslo #weak [child_of_executee.GetHouse.GetMotto]#!, nýbrž hanbu a hněv vepsané krví.\n\nDnešní přítomnost [child_of_executee.GetFirstNameNoTooltip] lze chápat jako pokorný akt podrobení... nebo jako vzdor."
 coronation_events_klank.1003.a: "„Jako správný [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] ti odpouštím.“"
 coronation_events_klank.1003.b: "Strach máme hluboko v krvi."
 coronation_events_klank.1003.c: "„Tohle je začátek nádherné tradice. Stráže!“"
 coronation_events_klank.1004.t: "Shromáždění korunovaných hlav"
 coronation_events_klank.1004.desc.intro: "Je mimořádným potěšením vidět zde ostatní vládce:"
 coronation_events_klank.1004.desc.intro_many_kings: "Má korunovace je skutečně událostí roku, ba celého desetiletí! Je mimořádným potěšením vidět zde tolik ostatních vládců, mezi nimi:"
 coronation_events_klank.1004.desc.second_king: "[first_king.GetName] a [second_king.GetName]."
 coronation_events_klank.1004.desc.third_king: "[first_king.GetName], [second_king.GetName] a [third_king.GetName]."
 coronation_events_klank.1004.desc.fourth_king: "[first_king.GetName], [second_king.GetName], [third_king.GetName] a [fourth_king.GetName]."
 coronation_events_klank.1004.desc.fifth_king: "[first_king.GetTitledFirstNameRegnal], [second_king.GetTitledFirstNameRegnal], [third_king.GetTitledFirstNameRegnal], [fourth_king.GetTitledFirstNameRegnal] a [fifth_king.GetTitledFirstNameRegnal]."
 coronation_events_klank.1004.desc.extoll_reign_intent: "\n\nPři mé korunovaci budou vypadat skvěle, až budou stát vzadu jako svědci #EMP mého#! nástupu. Po [ROOT.Char.GetFaith.HighGodNamePossessive] zemi může kráčet mnoho hlav s drahokamy posázenými korunami, ale skutečný [ROOT.Char.GetTitleAsNameNoTooltip] bude jen jeden."
 coronation_events_klank.1004.desc.empower_loyalists_intent: "\n\nLepší svědky své korunovace jsem si skutečně nemohl přát. Musím si promluvit s těmi, jejichž srdce jsou mi nakloněna, a vybudovat trvalé vztahy mezi našimi dvory."
 coronation_events_klank.1004.desc.other_intent: "\n\nLepší svědky své korunovace jsem si skutečně nemohl přát. Naše společné bohatství, moc a nádhera nemají obdoby."
 coronation_events_klank.1004.desc.outro: "\n\nPřítomnost těchto panovníků je požehnáním i příležitostí. Svou královskou důstojnost budu dokazovat od prvního dne své vlády až do posledního."
 coronation_events_klank.1004.a: "Všichni budou stát pode mnou."
 coronation_events_klank.1004.a_tt: "#weak Zisk [Concept('prestige','prestiže')|E] a [Concept('legitimacy','legitimity')|E] se odvíjí od počtu přítomných [Concept('independent','nezávislých')|E] [Concept('kings','králů')|E] a [Concept('emperors','císařů')|E] na tvé [Concept('coronation','korunovaci')|E]#!"
 coronation_events_klank.1004.b: "„Jsem rád, že jste tu všichni.“"
 coronation_events_klank.1004.c: "Budu lepší než oni."
 coronation_events_klank.1004.d: "„Vítejte, sobě rovní!“"
 forced_to_kneel_opinion: "Donucení pokleknout"
 coronation_events_klank.1005.t: "Příběhy prohraných válek"
 coronation_events_klank.1005.desc: "[friendly_king.GetName] už nějakou dobu huláká [npc_guest.GetName] přímo do ucha.\n\n„A říkám ti, nikdo není podlejší než [unfriendly_king.GetName]! [war_memory.GetDescription], a to jen proto, že zaprodal své syny i budoucnost [unfriendly_king.GetPrimaryTitle.GetName] — a komu jinému než [friendly_king.GetFaith.DevilName]! Ale mám plán! Potřebuji jen pořádný meč a jednoho spojence, nebo dva, nebo tři, a [Select_CString(unfriendly_king.IsFemale,'pomstím se jí','pomstím se mu')]!“\n\nUrčitě to není poprvé, co [friendly_king.GetFirstNameNoTooltip] vypráví o křivdách, které [Select_CString(friendly_king.IsFemale,'utrpěla','utrpěl')]. Ale dnes... by to mohlo být naposledy."
 coronation_events_klank.1005.a: "Vyslechnu si [Select_CString(friendly_king.IsFemale,'její','jeho')] žalostné příběhy."
 coronation_events_klank.1005.b: "„Nemáš právo dovolávat se spravedlnosti.“"
 coronation_events_klank.1005.flavor: "Schovej meč, [friendly_king.GetTitledFirstNameNoTooltip], k ničemu ti nebude. Srdce máš obtížené a mysl zastřenou."
 coronation_events_klank.1005.c: "„Společně [Select_CString(unfriendly_king.IsFemale,'jí','mu')] dáme lekci, na kterou nikdy nezapomene.“"
 coronation_events_klank.1005.c.tooltip: "#high Ty#! a [friendly_king.GetShortUIName] se můžete po dobu #high 6 let#! navzájem povolat do jakékoli [Concept('war','války')|E] proti [unfriendly_king.GetShortUIName]"
 coronation_events_klank.1005.c.vengeful: "„Nikdo ti nemůže rozumět lépe než já. Pomsta bude naše!“"
 coronation_events_klank.1005.other_player_informed_tt: "[unfriendly_king.GetTitledFirstName] bude o tomto výsledku [Select_CString(unfriendly_king.IsFemale,'informována','informován')]"
 coronation_events_klank.1005.d: "„[Select_CString(ROOT.Char.IsFemale,'Jsem ráda','Jsem rád')], že tě [npc_guest.GetFirstNameNoTooltip] poslouchá. #EMP Celý. Dlouhý. Týden.#!“"
 coronation_events_klank.1006.t: "[npc_guest.Custom2('AppropriateGreeting', ROOT.Char)|U]"
 coronation_events_klank.1006.desc: "S potěšením ti oznamuji, že během korunovace [coronation_host.GetName] se podařilo přesvědčit [friendly_king.GetName], aby [Select_CString(friendly_king.IsFemale,'zanechala','zanechal')] své pošetilé touhy po pomstě za tvé spravedlivé vítězství ve válce [war_memory.GetName]."
 coronation_events_klank.1006.a: "Zajímavé."
 coronation_events_klank.1007.t: "[npc_guest.Custom2('AppropriateGreeting', ROOT.Char)|U]"
 coronation_events_klank.1007.desc: "S lítostí ti oznamuji, že během [coronation_activity.GetName], kterou pořádá [coronation_host.GetName], [coronation_host.GetName] [Select_CString(coronation_host.IsFemale,'uzavřela','uzavřel')] s [friendly_king.GetName] dohodu o společném postupu proti tobě. Dohoda má podpořit pošetilou touhu po pomstě, kterou [friendly_king.GetName] živí od tvého spravedlivého vítězství ve válce [war_memory.GetName]."
 coronation_events_klank.1007.a: "Znepokojivé."
 coronation_events_klank.1008.t: "[dynasty_king.GetTitleAsNameNoTooltip] z dynastie [ROOT.Char.GetDynasty.GetNameNoTooltip]"
 coronation_events_klank.1008.desc.friendly: "[Select_CString(dynasty_king.IsFemale,'Skvělá','Skvělý')] [dynasty_king.GetTitledFirstName] — [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dynasty_king'))] — [Select_CString(dynasty_king.IsFemale,'opustila','opustil')] pohodlí svého sídla v [dynasty_king.GetPrimaryTitle.GetName], aby [Select_CString(dynasty_king.IsFemale,'oslavila','oslavil')] mou korunovaci. [Select_CString(dynasty_king.IsFemale,'Její','Jeho')] přítomnost je znamením podpory, důvěry a společného pokrevního pouta."
 coronation_events_klank.1008.desc.hostile: "Stačí jediný pohled na [dynasty_king.GetTitledFirstName] a napadne mě: [ROOT.Char.Custom('InsultAdjective')]. [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dynasty_king'))|U] se ze svého odporného doupěte v [dynasty_king.GetPrimaryTitle.GetName] [Select_CString(dynasty_king.IsFemale,'připlazila','připlazil')] až sem, jistě jen proto, aby [Select_CString(dynasty_king.IsFemale,'zkazila','zkazil')] mou korunovaci. [Select_CString(dynasty_king.IsFemale,'Její','Jeho')] přítomnost je odpudivý pohled. Není snad člověka, který by byl mé vznešenosti vzdálenější. Kromě krve nás nespojuje vůbec nic."
 coronation_events_klank.1008.desc.neutral: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dynasty_king'))|U] [dynasty_king.GetTitledFirstName] [Select_CString(dynasty_king.IsFemale,'přicestovala','přicestoval')] z [dynasty_king.GetPrimaryTitle.GetName], aby [Select_CString(dynasty_king.IsFemale,'byla svědkyní','byl svědkem')] mé korunovace."
 coronation_events_klank.1008.desc.outro: "\n\n#EMP „[ROOT.Char.GetHouse.GetMotto]“#! Tato slova provázejí [ROOT.Char.GetDynasty.GetName] po celé generace. Naši předkové se jich drželi v dobrých i zlých časech. Ať už společně, či každý zvlášť, nyní je na mně a [dynasty_king.GetTitledFirstName], aby zněla i nadále."
 coronation_events_klank.1008.a: "Jsem velmi rád, že tě tu vidím."
 coronation_events_klank.1008.b: "$coronation_events_klank.1008.a$"
 coronation_events_klank.1008.c: "Vítej. Jsi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dynasty_king'))] a patříš sem."
 coronation_events_klank.1008.d: "$coronation_events_klank.1008.c$"
 coronation_events_klank.1008.e: "Budeš svědkem nástupu [Select_CString(ROOT.Char.IsFemale,'skutečné členky','skutečného člena')] dynastie [ROOT.Char.GetDynasty.GetNameNoTooltip]."
 coronation_events_klank.1008.f: "Poklekni! Jinak [dynasty_king.GetTitleAsNameNoTooltip] z dynastie [ROOT.Char.GetDynasty.GetNameNoTooltip] dnešní den nepřežije."
 coronation_events_klank.1008.g: "Já jsem skutečným ztělesněním dynastie [ROOT.Char.GetDynasty.GetNameNoTooltip]."
 happened_because_intent_tt: "#EMP #low Tuto událost způsobil tvůj [Concept('intent','záměr')|E] [THIS.Char.GetInvolvedActivityIntent.GetName]#!#!"
 coronation_events_klank.1009.t: "V časech sváru"
 coronation_events_klank.1009.desc: "[left_struggle.GetName] a [right_struggle.GetName] se už celé dny vášnivě přou. Časy jsou těžké: celé panství, celý kraj zmítá svár trvající už desítky let.\n\n„[first_struggle_faith.GetAdherentNamePlural] jen čekají na příležitost udeřit! Jejich cílem budou [right_struggle.GetFaith.GetAdherentNamePlural], zatímco [first_struggle_culture.GetCollectiveNoun] nečinně přihlížejí! [host.GetTitledFirstName] tímhle minovým polem nemůže projít!“\n\n[right_struggle.GetTitledFirstName] se odmlčí a nabírá dech, zatímco [left_struggle.GetTitledFirstName] si v hlavě skládá odpověď. Ideální chvíle vložit se do hovoru."
 coronation_events_klank.1009.a: "[char_struggle.GetNameNoTooltip] může počkat. Dnes večer si užijte mou korunovaci."
 coronation_events_klank.1009.b: "Ticho. Dost těch námitek."
 coronation_events_klank.1009.c: "Když nastává [char_struggle.GetCurrentPhase.GetNameNoTooltip], podporujeme [host.GetTitledFirstNameNoTooltip]."
 coronation_events_klank.1009.d: "Když nastává [char_struggle.GetCurrentPhase.GetNameNoTooltip], [host.GetTitledFirstNameNoTooltip] je příliš [Select_CString(host.IsFemale,'slabá','slabý')]."
 coronation_events_klank.1009.e: "Oba se mýlíte."
 coronation_guest_struggle_support_log_title: "Podpora v časech sváru"
 coronation_guest_struggle_support_log: "[CHARACTER.GetTitledFirstName|U] veřejně [Select_CString(CHARACTER.IsFemale,'vyjádřila','vyjádřil')] svou důvěru v [TARGET_CHARACTER.GetTitledFirstName] v těchto těžkých časech"
 coronation_guest_struggle_undermine_log_title: "Rozbroje v časech sváru"
 coronation_guest_struggle_undermine_log: "[CHARACTER.GetTitledFirstName|U] veřejně [Select_CString(CHARACTER.IsFemale,'vyjádřila','vyjádřil')] svou nedůvěru vůči [TARGET_CHARACTER.GetTitledFirstName] v těchto těžkých časech"
 ach_enlightened_centrist: "Vždy existuje třetí cesta"
 ach_enlightened_centrist_desc: "Tato postava se snaží hledat střední cestu, i když tím popouzí své okolí."
 coronation_events_klank.1010.t: "Osud Persie"
 coronation_events_klank.1010.desc.intro_detractor: "Jak krásný den v nádherném [location.GetName], daleko od [caliph.GetName]. Stačí na [Select_CString(caliph.IsFemale,'ni','něj')] pomyslet a vybaví se mi jediné: [caliph.Custom('InsultAdjective')].\n\n[ROOT.Char.GetPrimaryTitle.GetNameNoTier|U] — skutečný rozkvět by byl na dosah. Jenže [caliph.Custom('InsultAdjective')] [caliph.Custom('InsultNoun')] stojí v cestě.\n\n"
 coronation_events_klank.1010.desc.intro_supporter: "Jak krásný den v nádherném [location.GetName]. [ROOT.Char.GetFaith.HighGodName] tomuto dni žehná a [caliph.GetName] mu dodává další lesk — [ROOT.Char.Custom('ComplimentAdjective')] jako vždy.\n\n[ROOT.Char.GetPrimaryTitle.GetNameNoTier|U] — skutečný rozkvět je na dosah, kdyby [ROOT.Char.GetFaith.GetAdherentNamePlural] uznali moudrost a zbožnost [caliph.GetTitleAsNameNoTooltip] stejně jako já.\n\n"
 coronation_events_klank.1010.desc.intro_caliph: "Jak krásný den v nádherném [location.GetName] a korunovace [caliph.GetName] už je tak blízko. [ROOT.Char.Custom('ComplimentAdjective')|U] jako vždy.\n\n[ROOT.Char.GetPrimaryTitle.GetName|U] — skutečný rozkvět je na dosah, kdyby [ROOT.Char.GetFaith.GetAdherentNamePlural] uznali moudrost a zbožnost [caliph.GetTitleAsNameNoTooltip] stejně jako já.\n\n"
 coronation_events_klank.1010.desc.mid_supporter: "Na tuto korunovaci se vplížil někdo z těch, kdo [caliph.GetName] odmítají, a nesouvisle blábolí o proradnosti, již zosobňuje [struggle_participant.GetFaith.DevilName], o budoucnosti Persie, o moudrosti, kterou ztělesňuje [struggle_participant.GetFaith.HighGodName], a nakonec o tom, jak podmanivě voní chodidla [caliph.GetName]."
 coronation_events_klank.1010.desc.mid_detractor: "Na tuto korunovaci se vplížil někdo z těch, kdo [caliph.GetName] podporují, a nesouvisle blábolí o proradnosti, již zosobňuje [struggle_participant.GetFaith.DevilName], o budoucnosti Persie, o moudrosti, kterou ztělesňuje [struggle_participant.GetFaith.HighGodName], a nakonec o tom, jak páchnou chodidla [caliph.GetName]."
 coronation_events_klank.1010.outro: "Nuže, je načase uvést [Select_CString(struggle_participant.IsFemale,'ji','ho')] na pravou míru.\n\n„Mír s tebou, [struggle_participant.GetTitledFirstNameNoTooltip], [ROOT.Char.Custom2('NegativeSupplimentaryGreeting', struggle_participant)|l]. Pohled na tvou tvář mi působí bolest, [ROOT.Char.Custom2('NegativeSupplimentaryGreeting', struggle_participant)|l]. Musíš...“"
 coronation_events_klank.1010.a: "„Odvrhnout své falešné přesvědčení.“"
 coronation_events_klank.1010.b: "„Pochopit, že [persian_struggle.GetCurrentPhase.GetName] je v rozporu s rodem [ROOT.Char.GetHouse.GetName].“"
 coronation_events_klank.1010.c: "„Uznat Ústupek jako jedinou schůdnou cestu.“"
 coronation_events_klank.1010.d: "„Pokleknout před pravým kalifem!“"
 coronation_events_klank.1010.e: "„Odejít a fňukat venku!“"
 coronation_events_klank.1010.b.catalyst_unrest: "Aktivuješ [Concept('struggle_catalyst','katalyzátor sváru')|E] směřující k [Concept('struggle_persia_phase_unrest','nepokojům')|E]"
 coronation_events_klank.1010.b.catalyst_concession: "Aktivuješ [Concept('struggle_catalyst','katalyzátor sváru')|E] směřující k [Concept('struggle_persia_phase_concession','ústupku')|E]"
 coronation_events_klank.1010.b.catalyst_stabilization: "Aktivuješ [Concept('struggle_catalyst','katalyzátor sváru')|E] směřující ke [Concept('struggle_persia_phase_stabilisation','stabilizaci')|E]"
 coronation_events_klank.1011.t: "[ROOT.Char.GetPrimaryTitle.GetName]: země bez konce"
 coronation_events_klank.1011.desc: "Země pod mou vládou jako by neměly konce a stejně bezmezné jsou i mé ambice. Jsou zde mí nejmocnější vazalové: [first_char.GetTitledFirstName], [second_char.GetTitledFirstName] a [third_char.GetTitledFirstName]. Všichni jsou připraveni přede mnou pokleknout, všichni čekají, jakou budoucnost jim načrtnu. Má vláda bude [ROOT.Char.GetPrimaryTitle.GetNameNoTier] utvářet po celá desetiletí, ba celé generace. Právě teď je dokonalá chvíle oznámit velkou panovnickou vizi.\n\nCentralizace panství by sice nebyla oblíbená, ale mohla by mi vložit do rukou mocný meč a naplnit můj měšec zlatem. Pokud však vazalům ponechám autonomii a prostředky, mohou se stát pevným štítem, který mě ochrání před hrozbami..."
 coronation_events_klank.1011.a: "Já jsem [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]."
 coronation_events_klank.1011.a.custom_tooltip: "@alert_icon! Zahájíš proces centralizace. Po #V 10#! letech sklidíš výsledky:\n$EFFECT_LIST_BULLET$Zvýšený [development_i][Concept('development','rozvoj')|E] ve tvé [Concept('domain','doméně')|E]\n$EFFECT_LIST_BULLET$Snížený [development_i][Concept('development','rozvoj')|E] v [Concept('domains','doménách')|E] [Concept('vassals','vazalů')|E].\n$EFFECT_LIST_BULLET$Rozsah změny závisí na tvých [Concept('skills','dovednostech')|E] v [stewardship_i][Concept('stewardship','správcovství')|E] a [learning_i][Concept('learning','učenosti')|E]."
 custom.ten_most_powerful_vassals: "Deset nejmocnějších vazalů přítomných na tvé korunovaci"
 coronation_events_klank.1011.a.county_modifier: "Každé [Concept('county','hrabství')|E] v jejich [Concept('domain','doméně')|E] získá na 10 let [Concept('modifier','modifikátor')|E] [GetModifier('ach_realm_centralization_county_lvl_1').GetNameWithTooltip]."
 custom.coronation_events_klank.1011.a.disrespect: "Tví #V odpůrci#! z řad [Concept('vassals','vazalů')|E], kterých se tvůj plán týká"
 custom.coronation_events_klank.1011.a.respect: "Ostatní [Concept('vassals','vazalové')|E], kterých se tvůj plán týká"
 coronation_events_klank.1011.b: "Bez silných vazalů nejsem nic."
 coronation_events_klank.1011.b.custom_tooltip: "@alert_icon! Zahájíš proces decentralizace a posilování autonomie. Po #V 10#! letech sklidíš výsledky:\n$EFFECT_LIST_BULLET$Zvýšený [development_i][Concept('development','rozvoj')|E] v [Concept('domains','doménách')|E] [Concept('vassals','vazalů')|E].\n$EFFECT_LIST_BULLET$Rozsah změny závisí na tvých [Concept('skills','dovednostech')|E] v [stewardship_i][Concept('stewardship','správcovství')|E] a [diplomacy_i][Concept('diplomacy','diplomacii')|E]."
 coronation_events_klank.1011.b.county_modifier: "Každé [Concept('county','hrabství')|E] v jejich [Concept('domain','doméně')|E] získá na 10 let [Concept('modifier','modifikátor')|E] [GetModifier('ach_realm_autonomy_county_lvl_1').GetNameWithTooltip]."
 custom.coronation_events_klank.1011.b.disrespect: "$custom.coronation_events_klank.1011.a.disrespect$"
 custom.coronation_events_klank.1011.b.respect: "$custom.coronation_events_klank.1011.a.respect$"
 coronation_events_klank.1011.c: "Mé panství je dobré takové, jaké je."
 coronation_events_klank.1012.t: "Velký plán centralizace: [host.GetTitledFirstName]"
 coronation_events_klank.1012.desc: "Během své korunovace [host.GetName] [Select_CString(host.IsFemale,'oznámila','oznámil')] velkolepý a ambiciózní plán na posílení panství soustředěním prostředků do samotného jádra [host.GetPrimaryTitle.GetName] — shodou okolností právě do osobní domény, kterou drží [host.GetTitledFirstName]. Potřebné prostředky však musí odněkud přijít, protože jediným skutečným nadbytkem na tomto světě je milost, již uděluje [ROOT.Char.GetFaith.HighGodName]. Zaplatí za to tedy okrajové oblasti, jako je má vlastní doména!\n\nŽivot v mocném panství pod vládou [host.GetTitleAsNameNoTooltip] má své výhody — ale co když bude tato moc v budoucnu zneužita, a dokonce obrácena proti mně? [ROOT.Char.GetPrimaryTitle.GetNameNoTier] budí hrdost... a možná i obavy."
 coronation_events_klank.1012.a: "Budu [host.GetTitledFirstNameNoTooltip] sloužit s nejhlubší pokorou."
 coronation_events_klank.1012.b: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] se bez nápadů [host.GetTitleAsNameNoTooltip] obejde."
 coronation_events_klank.1012.b.desc: "Ve tvé [Concept('domain','doméně')|E] se za 10 let [Concept('development','rozvoj')|E] nesníží."
 coronation_events_klank.1012.ten_year_plan: "Po 10 letech se [Concept('development','rozvoj')|E] tvé [Concept('domain','domény')|E] i [Concept('domains','domén')|E] ostatních [Concept('vassals','vazalů')|E] sníží, zatímco tvůj [Concept('liege','lenní pán')|E] z toho bude těžit. Skutečný rozsah změny závisí na [Concept('skills','dovednostech')|E] tvého lenního pána: [Concept('stewardship','správcovství')|E] a [Concept('learning','učenosti')|E]."
 coronation_events_klank.1013.t: "Velký plán decentralizace: [host.GetTitledFirstName]"
 coronation_events_klank.1013.desc: "Během své korunovace [host.GetName] [Select_CString(host.IsFemale,'oznámila','oznámil')] velkolepý a ambiciózní plán na posílení panství soustředěním prostředků do okrajových oblastí [host.GetPrimaryTitle.GetName], mezi něž patří i má vlastní doména. Potřebné prostředky však musí odněkud přijít, protože jediným skutečným nadbytkem na tomto světě je milost, již uděluje [ROOT.Char.GetFaith.HighGodName]. [host.GetTitleAsNameNoTooltip] [Select_CString(host.IsFemale,'velkoryse nabídla','velkoryse nabídl')], že se s celým panstvím podělí o bohatství své domény."
 coronation_events_klank.1013.a: "$coronation_events_klank.1012.a$"
 coronation_events_klank.1013.b: "$coronation_events_klank.1012.b$"
 coronation_events_klank.1013.b.desc: "Ve tvé [Concept('domain','doméně')|E] se za 10 let [Concept('development','rozvoj')|E] nezvýší."
 coronation_events_klank.1013.ten_year_plan: "Po 10 letech se [Concept('development','rozvoj')|E] tvé [Concept('domain','domény')|E] i [Concept('domains','domén')|E] ostatních [Concept('vassals','vazalů')|E] zvýší. Skutečný rozsah změny závisí na [Concept('skills','dovednostech')|E] tvého [Concept('liege','lenního pána')|E]: [Concept('stewardship','správcovství')|E] a [Concept('diplomacy','diplomacii')|E]."
 coronation_events_klank.1014.t: "[ROOT.Char.GetPrimaryTitle.GetName]: završení centralizace"
 coronation_events_klank.1014.desc: "Před deseti lety jsem při své korunovaci [ROOT.Char.GetPrimaryTitle.GetNameNoTier] [Select_CString(ROOT.Char.IsFemale,'určila','určil')] nový směr. Přes bolest a strádání proudilo bohatství přímo do mé domény, zatímco mí vazalové trpěli. Ale stálo to za to.\n\nNyní nastal čas sklidit plody mého hospodaření a prozíravosti, s níž jsem svou velkou vizi uskutečnil."
 coronation_events_klank.1014.county_effect: "V každém [Concept('county','hrabství')|E] v jejich [Concept('domain','doméně')|E] se [Concept('development','rozvoj')|E] sníží o 20 %"
 coronation_events_klank.1014.a: "Nádhera!"
 coronation_events_klank.1014.b: "Tady to nekončí."
 coronation_events_klank.1014.development_gain: "Tvá reforma připravila [Concept('domains','domény')|E] tvého [Concept('vassal','vazala')|E] celkem o #P [ROOT.Char.MakeScope.Var('development_lost').GetValue]#! [Concept('development','rozvoje')|E]. Tvé [Concept('skills','dovednosti')|E] [Concept('stewardship','správcovství')|E] a [Concept('learning','učenosti')|E] ti umožňují rozdělit #P [ROOT.Char.MakeScope.Var('development_gain_percent').GetValue]%#! z této hodnoty ve své [Concept('domain','doméně')|E]."
 custom.ten_most_powerful_vassals.1014: "[Concept('vassals','Vazalové')|E], kterých se tvá reforma týkala:"
 coronation_events_klank.1014.b.county_effect: "Každé [Concept('county','hrabství')|E] v jejich [Concept('domain','doméně')|E] získá na 10 let [Concept('modifier','modifikátor')|E] [GetModifier('ach_realm_centralization_county_lvl_2').GetNameWithTooltip]."
 coronation_events_klank.1015.t: "[ROOT.Char.GetPrimaryTitle.GetName]: završení decentralizace"
 coronation_events_klank.1015.desc: "Před deseti lety jsem při své korunovaci [ROOT.Char.GetPrimaryTitle.GetNameNoTier] [Select_CString(ROOT.Char.IsFemale,'určila','určil')] nový směr. Díky mé prozíravé politice mí vazalové vzkvétali, zatímco má vlastní doména zůstala zanedbaná. Ale stálo to za to.\n\nNyní nastal čas sklidit plody mého hospodaření, prozíravosti a obratné diplomacie, díky nimž jsem svou velkou vizi uskutečnil."
 coronation_events_klank.1015.county_effect: "V každém [Concept('county','hrabství')|E] v jejich [Concept('domain','doméně')|E] se [Concept('development','rozvoj')|E] zvýší o #P [ROOT.Char.MakeScope.Var('development_gain_percent').GetValue]%#! díky tvým [Concept('skills','dovednostem')|E] [Concept('stewardship','správcovství')|E] a [Concept('diplomacy','diplomacie')|E]."
 coronation_events_klank.1015.a: "$coronation_events_klank.1014.a$"
 coronation_events_klank.1015.b: "$coronation_events_klank.1014.b$"
 custom.ten_most_powerful_vassals.1015: "$custom.ten_most_powerful_vassals.1014$"
 coronation_events_klank.1015.b.county_effect: "Každé [Concept('county','hrabství')|E] v jejich [Concept('domain','doméně')|E] získá na 10 let [Concept('modifier','modifikátor')|E] [GetModifier('ach_realm_autonomy_county_lvl_2').GetNameWithTooltip]."
 ach_realm_centralization_vassal_lvl_1: "Reforma centralizace: Nesení břemene"
 ach_realm_centralization_vassal_lvl_1_desc: "Tento vazal podléhá centralizační reformě svého nejvyššího lenního pána."
 ach_realm_centralization_vassal_lvl_2: "$ach_realm_autonomy_vassal_lvl_1$"
 ach_realm_centralization_vassal_lvl_2_desc: "$ach_realm_autonomy_vassal_lvl_1_desc$"
 ach_realm_centralization_county_lvl_1: "Reforma centralizace: Zdroj prostředků"
 ach_realm_centralization_county_lvl_1_desc: "Toto hrabství nese břemeno centralizační reformy svého nejvyššího lenního pána. Prostředky běžně využívané k místnímu rozvoji nyní proudí do hlavního sídla."
 ach_realm_centralization_county_lvl_2: "$ach_realm_autonomy_county_lvl_1$"
 ach_realm_centralization_county_lvl_2_desc: "$ach_realm_autonomy_county_lvl_1_desc$"
 ach_realm_centralization_liege_lvl_1: "Reforma centralizace: Velký architekt"
 ach_realm_centralization_liege_lvl_1_desc: "Tato postava má velkolepou vizi budoucnosti panství bez ohledu na cenu či názor vazalů, kteří nesou její břemeno. O výsledku reformy rozhodnou její dovednosti ve správcovství a učenosti."
 ach_realm_centralization_liege_lvl_2: "$ach_realm_autonomy_liege_lvl_1$"
 ach_realm_centralization_liege_lvl_2_desc: "$ach_realm_autonomy_liege_lvl_1_desc$"
 ach_realm_autonomy_vassal_lvl_1: "Reforma decentralizace: Příjemce výhod"
 ach_realm_autonomy_vassal_lvl_1_desc: "Tento vazal podléhá decentralizační reformě svého nejvyššího lenního pána."
 ach_realm_autonomy_vassal_lvl_2: "$ach_realm_autonomy_vassal_lvl_1$"
 ach_realm_autonomy_vassal_lvl_2_desc: "$ach_realm_autonomy_vassal_lvl_1_desc$"
 ach_realm_autonomy_county_lvl_1: "Reforma decentralizace: Cíl"
 ach_realm_autonomy_county_lvl_1_desc: "Toto hrabství je cílem decentralizační reformy svého nejvyššího lenního pána. Prostředky, které běžně proudí do hlavního sídla, jsou nyní rozdělovány mezi jeho vazaly."
 ach_realm_autonomy_county_lvl_2: "$ach_realm_autonomy_county_lvl_1$"
 ach_realm_autonomy_county_lvl_2_desc: "$ach_realm_autonomy_county_lvl_1_desc$"
 ach_realm_autonomy_liege_lvl_1: "Reforma decentralizace: Velký architekt"
 ach_realm_autonomy_liege_lvl_1_desc: "Tato postava má velkolepou vizi budoucnosti panství, v níž je každý jeho kout stejně skvostný jako hlavní sídlo. O výsledku reformy rozhodnou její dovednosti ve správcovství a diplomacii."
 ach_realm_autonomy_liege_lvl_2: "$ach_realm_autonomy_liege_lvl_1$"
 ach_realm_autonomy_liege_lvl_2_desc: "$ach_realm_autonomy_liege_lvl_1_desc$"
 ach_no_reforms_modifier: "Velkolepé panství"
 ach_no_reforms_modifier_desc: "Rozlehlé panství této postavy je považováno za dokonalé takové, jaké je, a žádnou reformu nepotřebuje. Vládce si tak může jednoduše odpočinout a užívat si jeho velkoleposti."
 coronation_events_klank.1016.t: "[Select_CString(host.IsFemale,'Dívka, která se stala','Chlapec, který se stal')] [host.GetTitleAsNameNoTooltip]"
 coronation_events_klank.1016.desc: "[teller.GetName] dokončí svůj podivný příběh o tom, jak si [supporter.Custom('GetRandomRegionalBird')] hraje s [supporter.Custom('RandomWeirdObject')] na mrtvém [supporter.Custom('RegionalFarmAnimal')]. Zdá se, že [listener.GetName] se alespoň trochu baví.\n\nTeď je řada na mně. A mám dokonalý příběh. Povím jim o tom, jak [memory.GetDescription|l], v době, kdy byl náš laskavý host ještě dítětem."
 coronation_events_klank.1016.desc.supporter: "Je totiž zřejmé, že [host.GetTitledFirstName] [Select_CString(host.IsFemale,'byla vždy předurčena','byl vždy předurčen')] k velikosti a že jednoho dne budeme svědky [Select_CString(host.IsFemale,'jejího','jeho')] nástupu na trůn."
 coronation_events_klank.1016.desc.detractor: "Je totiž zřejmé, že [host.GetTitledFirstName] [Select_CString(host.IsFemale,'byla předurčena','byl předurčen')] ke všemu možnému, jen ne k trůnu. Běda všem [Select_CString(host.IsFemale,'jejím','jeho')] budoucím poddaným."
 coronation_events_klank.1016.a: "„Už od útlého věku [Select_CString(host.IsFemale,'nehodna','nehoden')] svého titulu.“"
 coronation_events_klank.1016.b: "„Už od útlého věku [Select_CString(host.IsFemale,'hodna','hoden')] svého titulu.“"
 coronation_events_klank.1016.c: "Vlastně budu mluvit jen o sobě."
 coronation_events_klank.1016.d: "Povím to přesně tak, jak se to stalo."
 custom.every_king_plus_attendee: "Každý [Concept('activity_guest','host aktivity')|E] s [Concept('title_tier','úrovní')|E] [Concept('king','krále')|E] nebo vyšší"
