l_polish:
 prelude_events.0001.t: "Pomocná ruka"
 prelude_events.0001.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U] [ROOT.Char.GetTitledFirstName], od [Select_CString(regent.IsFemale,'vážené regentky','váženého regenta')] [regent.GetTitledFirstName] jsem slyšel, že v tobě dřímá veliký příslib,“ říká [guest.GetShortUIName], [guest.Custom('quirk_pos_pp')]. „[guest.Custom2('DescriptorPositive', ROOT.Char)|U] a [guest.Custom2('DescriptorPositive', ROOT.Char)], lepší [ROOT.Char.GetTitleAsNameNoTooltip] si snad ani nelze přát!“"
 prelude_events.0001.a: "„To je báječné! [regent.GetTitledFirstNameNoTooltip] dělá všechnu práci za mě!“"
 prelude_events.0001.b: "„[Select_CString(ROOT.Char.IsFemale,'Ráda','Rád')] tvůj dar přijímám.“"
 prelude_events.0001.b.tt.supporter: "[guest.GetShortUIName] se stane tvým #high podporovatelem#!"
 prelude_events.0001.c.tt.every_supporter: "$every_supporter$: získáš [prestige_i]#P 20#!"
 prelude_events.0001.c: "„Rozneste to dál!“"
 prelude_events.0001.c.opinion: "$every_detractor$: získá #P 10#! [Concept('opinion','mínění')|E] o tobě #weak (-1,20/rok) (Respekt)#!"
 every_supporter: "Každý [Concept('coronation_supporter','podporovatel')|E] ([THIS.ScriptValue('number_of_supporters_activity')|V0])"
 every_supporter_activity: "Každý [Concept('coronation_supporter','podporovatel')|E] ([THIS.ScriptValue('number_of_supporters_activity')|V0])"
 every_detractor: "Každý [Concept('coronation_detractor','odpůrce')|E] ([THIS.ScriptValue('number_of_detractors_activity')|V0])"
 every_detractor_activity: "Každý [Concept('coronation_detractor','odpůrce')|E] ([THIS.ScriptValue('number_of_detractors_activity')|V0])"
 silent_coronation_modifier: "Tichá korunovace"
 silent_coronation_modifier_desc: "Tato postava nechává za sebe mluvit své činy."
 prelude_events.0010.t: "Zprávy z domova"
 prelude_events.0010.desc: "„[Select_CString(guest_2.IsFemale,'Slyšela jsi','Slyšel jsi')], co je nového u [Select_CString(ROOT.Char.IsFemale,'naší drahé','našeho drahého')] [ROOT.Char.GetTitledFirstName]?“ [guest.GetTitledFirstName] při rozhovoru s [guest_2.GetTitledFirstName] sotva dokáže skrýt radost.\n\n„Prý [regent.GetTitledFirstName], kdo zastává regentství, tvrdí, že [ROOT.Char.GetTitledFirstNameNoTooltip] na zasedáních rady sotva udrží oči otevřené. Jak má [Select_CString(ROOT.Char.IsFemale,'vládnout tomuto panství, když nezvládá ani sama sebe','vládnout tomuto panství, když nezvládá ani sám sebe')]?“"
 prelude_events.0010.a: "Já jsem #EMP [Select_CString(ROOT.Char.IsFemale,'věděla','věděl')]#!, že [regent.GetTitledFirstNameNoTooltip] proti mně něco chystá!"
 prelude_events.0010.b: "Pošlu své lidi infiltrovat dvůr, kde pobývá [guest.GetFirstNameNoTooltip]."
 prelude_events.0010.c: "Musíme [Select_CString(guest.IsFemale,'ji','ho')] porazit zevnitř."
 prelude_events.0010.c.tt.success: "Tvým lidem se podaří infiltrovat dvůr"
 prelude_events.0010.c.tt.failure: "Tvým lidem se nepodaří proniknout dovnitř"
 prelude_events.0010.d: "„Oba se shodneme, že jsi nic [Select_CString(guest.IsFemale,'neslyšela','neslyšel')]...“"
 prelude_events.0010.d.supporter.tt: "[guest.GetShortUIName] přestane být tvým #high odpůrcem#! a stane se #high podporovatelem#!"
 prelude_events.0010.e: "[regent.GetFirstNameNoTooltip] ať si říká, co chce."
 prelude_events.0020.t: "Spiklenci u dvora"
 prelude_events.0020.desc.intro: "„...[Select_CString(ROOT.Char.IsFemale,'jak její vláda slábne, její hlava bez koruny tak také zůstane','jak jeho vláda slábne, jeho hlava bez koruny tak také zůstane')].“ [faction_member.GetTitledFirstName] se nakloní blíž k [faction_member_2.GetTitledFirstName]. „Tahle korunovace je ideálním místem k hledání urozených, kteří smýšlejí stejně jako my.“\n\nSamozřejmě dobře vím, co zamýšlí"
 prelude_events.0020.desc.faction_member: "[faction.GetName], v jejímž čele stojí [faction_member.GetTitledFirstNameNoTooltip] [Select_CString(faction_member.IsFemale,'sama','sám')]."
 prelude_events.0020.desc.faction_member_2: "[faction.GetName], v jejímž čele stojí [faction_member_2.GetTitledFirstNameNoTooltip] [Select_CString(faction_member_2.IsFemale,'sama','sám')]."
 prelude_events.0020.desc.no_leader: "[faction.GetName]."
 prelude_events.0020.desc.outro: "Jestli mě chtějí vidět bez koruny, budou mi muset #EMP setnout hlavu#!."
 prelude_events.0020.a: "„Mluvíte snad o zradě?“"
 prelude_events.0020.b: "„Mám uši v každém koutě, [faction_member.GetTitledFirstNameNoTooltip].“"
 prelude_events.0020.b.tt.success: "[faction_member.GetShortUIName] je [Select_CString(faction_member.IsFemale,'zastrašena','zastrašen')]"
 prelude_events.0020.b.tt.failure: "[faction_member.GetShortUIName] zůstává lhostejný"
 prelude_events.0020.c: "„Tvá věrnost je pro mě #EMP k nezaplacení#!.“"
 prelude_events.0020.d: "Ať si mluví."
 coronation_events.3001.opening: "[Select_CString(ROOT.Char.IsFemale,'Zapomnětlivé','Zapomnětlivému')] [ROOT.Char.GetTitledFirstNameNoTooltip],"
 coronation_events.3001.desc: "Několik tvých věrných vazalů si povšimlo, že se poslové s pozvánkami na tvou korunovaci cestou k našim dvorům patrně ztratili.\n\nNeradi bychom tuto událost zmeškali."
 coronation_events.3001.a: "Díky za připomenutí."
 coronation_events.3001.b: "K žádnému omylu nedošlo."
 not_invited_coronation_opinion: "Bez pozvání na korunovaci"
 prelude_events.0030.t: "[Select_CString(ROOT.Char.IsFemale,'Ráda tě vidím','Rád tě vidím')]"
 prelude_events.0030.desc.intro: "Nádvoří v [activity.GetCurrentPhase.GetLocation.GetName] zalévá zlatavá záře. Vánek rozechvívá listí a pod korunami stromů se procházejí hosté.\n\n„[ROOT.Char.GetFirstNameNoTooltip]!“ Otočím se a spatřím [guest.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))], jak volá mé jméno."
 prelude_events.0030.desc.lover: "[Select_CString(guest.IsFemale,'Krásná jako vždy','Krásný jako vždy')] ke mně [guest.GetTitledFirstNameNoTooltip] přichází. „[Select_CString(guest.IsFemale,'Doufala','Doufal')] jsem, že tu budeš,“ usměje se na mě svůdně."
 prelude_events.0030.desc.friend: "S širokým úsměvem ke mně [guest.GetTitledFirstName] téměř přikluse. [Select_CString(ROOT.Char.IsFemale,'„Přítelkyně!“','„Příteli!“')] vykřikne. „Tak [Select_CString(guest.IsFemale,'ráda','rád')] tě vidím!“"
 prelude_events.0030.a: "„[Select_CString(ROOT.Char.IsFemale,'Slyšela','Slyšel')] jsem, že stáje jsou mimořádně romantické.“"
 prelude_events.0030.b: "„[guest.GetFirstNameNoTooltip], jestli tě mohu o něco požádat...“"
 prelude_events.0030.c: "$prelude_events.0030.b$"
 prelude_events.0030.d: "„Koukám, že tu podávají [ROOT.Char.Custom('GetExpensiveDrink_Singular')].“"
 prelude_events.0030.e: "[Select_CString(ROOT.Char.IsFemale,'Vždycky ráda vidím','Vždycky rád vidím')] známou tvář."
 lover_coronation_prelude_sneak_out: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] — tajná schůzka ve stájích před korunovací"
 lover_coronation_prelude_sneak_out_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] a [CHARACTER.GetShortUIName] — tajná schůzka ve stájích před korunovací"
 every_party_character: "Každý host s některým z rysů [GetTrait('lifestyle_reveler').GetName(GetNullCharacter)], [GetTrait('gregarious').GetName(GetNullCharacter)] nebo [GetTrait('drunkard').GetName(GetNullCharacter)]"
 prelude_events.0040.t: "Jen ne ty"
 prelude_events.0040.desc: "Den byl až příliš příjemný, takže ho samozřejmě musel zkazit pohled na [guest.GetTitledFirstName], mého nenáviděného soka. Jediné, co mě při pohledu na [Select_CString(guest.IsFemale,'ni','něj')] napadne: [guest.Custom2('InsultAdjective', ROOT.Char)].\n\n„[Select_CString(ROOT.Char.IsFemale,'Paní','Pane')] [ROOT.Char.GetFirstNameNoTooltip],“ [guest.GetTitledFirstNameNoTooltip] předstírá, že mě nevidí, dokud se nepřiblížím. „Budeš nás při večeři bavit? Nebo se [ROOT.Char.GetTitleAsNameNoTooltip] takhle obléká na korunovaci?“"
 prelude_events.0040.a: "Až skončím, tolik řečí už mít nebude."
 prelude_events.0040.b: "„Inspirovala mě tvá matka.“"
 prelude_events.0040.c: "Budu poslouchat každé slovo, které tu [guest.GetFirstNameNoTooltip] pronese."
 prelude_events.0040.c.tt: "[Concept('scheme','Intrika')|E] bude mít #P zvýšenou#! [Concept('success_chance','šanci na úspěch')|E]"
 prelude_events.0040.d: "„Tohle není místo na hádky.“"
 every_callous_vengeful_wrathful_guest: "Každý host s některým z rysů [GetTrait('callous').GetName(GetNullCharacter)], [GetTrait('vengeful').GetName(GetNullCharacter)] nebo [GetTrait('wrathful').GetName(GetNullCharacter)]"
 prelude_events.0050.t: "Známá tvář"
 prelude_events.0050.desc.intro: "Nádvoří překypuje květinami, hosté se netrpělivě smějí, [ROOT.Char.Custom('GetIncidentalDetail')].\n\n„[guest.Custom2('RelationToMe', SCOPE.sC('root_scope'))|U]!“ Ozve se mi"
 prelude_events.0050.desc.callous: " protivně"
 prelude_events.0050.desc.normal: " důvěrně"
 prelude_events.0050.desc.outro: " známý hlas. [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))|U] [guest.GetFirstName] na mě volá. „Všichni tady buď kují pikle, nebo jsou opilí,“ ztiší [guest.GetTitledFirstNameNoTooltip] hlas. „Stýskalo se mi po tobě.“"
 prelude_events.0050.a: "„Já to ale necítím stejně.“"
 prelude_events.0050.b: "„Rod [ROOT.Char.GetHouse.GetNameNoTooltip] musí držet při sobě.“"
 prelude_events.0050.c: "„A co říkáš na [Select_CString(host.IsFemale,'naši hostitelku','našeho hostitele')] [host.GetFirstNameNoTooltip]?“"
 prelude_events.0050.d: "„Ale podívej se na sebe! [Select_CString(guest.IsFemale,'Vdaná','Ženatý')] za [Select_CString(host.IsFemale,'samotnou korunovanou','samotného korunovaného')] [host.GetTitleAsNameNoTooltip]!“"
 prelude_events.0060.t: "Nádherné [province.GetNameNoTooltip]"
 prelude_events.0060.desc: "„Musím říct, že je působivé, čeho se ti podařilo dosáhnout s tím, co ti zdejší krajina nabízí: [ROOT.Char.GetCapitalLocation.Custom('TerrainTypeProvince')], [Select_CString(ROOT.Char.IsFemale,'paní','pane')] [ROOT.Char.GetFirstNameNoTooltip],“ [host.GetTitledFirstName] [host.Custom('quirk_pos_present')].\n\n„Slyším, že [ROOT.Char.GetCapitalLocation.GetNameNoTooltip] pod tvým vedením vzkvétá a zdejší [ROOT.Char.GetCapitalLocation.GetHolding.GetType.GetName|l] je dobře udržovaný a spořádaný. Ale vidím ti na tváři stín, [ROOT.Char.GetTitleAsNameNoTooltip|l]. Co tě trápí?“"
 prelude_events.0060.a: "„To je radost! A za všechno vděčím tvé laskavé pomoci.“"
 prelude_events.0060.b: "„Kdybys mohl postrádat několik řemeslníků ze svého hlavního města...“"
 prelude_events.0060.c: "„V růstu nám brání nedostatek zlata.“"
 prelude_events.0060.c.tt.success: "[host.GetShortUIName] souhlasí s požadavky"
 prelude_events.0060.c.tt.failure: "[host.GetShortUIName] považuje požadavky za nestoudné"
 prelude_events.0060.d: "„Dnes nemám svůj den, [host.GetTitleAsNameNoTooltip].“"
 bp4_advocate_domain_construction_county_modifier: "Královští stavitelé"
 friend_coronation_support: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'nabídla','nabídl')] [TARGET_CHARACTER.GetShortUIName] svou podporu během [Select_CString(TARGET_CHARACTER.IsFemale,'její','jeho')] korunovace a nic za ni [Select_CString(CHARACTER.IsFemale,'nežádala','nežádal')]."
