 friend_coronation_ambitious_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'zahrnula','zahrnul')] [CHARACTER.GetShortUIName] komplimenty během [Select_CString(CHARACTER.IsFemale,'její','jeho')] korunovace."
 supporter_hook: "Podporovatel"
 bp4_advocate_domain_construction_county_modifier_desc: "Majitel tohoto hrabství obětoval část své cti výměnou za stavební pomoc nově korunovaného panovníka."
 prelude_events.0070.t: "Dvorská nabídka"
 prelude_events.0070.desc.intro: "Mezi nohama hostů se skrývá drobný tvor — [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')] — a některé z nich rozesměje, včetně [Select_CString(host.IsFemale,'mé lenní paní','mého lenního pána')] a důvodu celého našeho shromáždění, [host.GetTitledFirstName].\n\n„[Select_CString(ROOT.Char.IsFemale,'Paní','Pane')] [ROOT.Char.GetFirstNameNoTooltip],“ zavolá na mě [host.GetTitledFirstNameNoTooltip], stále s úsměvem."
 prelude_events.0070.desc.friend: "„Víš, že je mi naše přátelství drahé a že si ze všeho nejvíc přeji slyšet tvé rady. Prosím tě, usedni vedle mě."
 prelude_events.0070.desc.diplomacy: "„Slyším, že tvé schopnosti v umění diplomacie nemají obdoby."
 prelude_events.0070.desc.stewardship: "„Všiml jsem si, s jakou účinností spravuješ své panství. Je v tom nezaměnitelná ruka správce."
 prelude_events.0070.desc.intrigue: "„Říká se, že dokud jsi nablízku, žádný milenec není v bezpečí, žádný hříšník není volný a žádné tajemství nezůstane skutečně skryté."
 prelude_events.0070.desc.learning: "„Moji dvořané tvrdí, že neexistuje starobylý text, který bys nedokázal přečíst, ani slavný autor, jehož dílo bys nedokázal rozluštit."
 prelude_events.0070.desc.martial: "„Bylo mi řečeno, že tvé brilantní válečné lsti přinášejí vítězství i v těch nejzoufalejších situacích."
 prelude_events.0070.desc.outro: "V radě ze všeho nejvíc potřebuji [Select_CString(ROOT.Char.IsFemale,'schopnou ženu','schopného muže')].“"
 prelude_events.0070.a: "„Musím se soustředit na... své panství.“"
 prelude_events.0070.a.flavor: "Nebo spíš na sebe."
 prelude_events.0070.b: "„[Select_CString(ROOT.Char.IsFemale,'Ráda','Rád')] se k tobě připojím.“"
 prelude_events.0070.c: "„Na tohle nemám čas.“"
 bp4_lazy_realm_focus_modifier: "V pohodlí domova"
 bp4_lazy_realm_focus_modifier_desc: "Tato postava odmítla nabídku stát se rádcem, aby se mohla soustředit na vlastní panství... alespoň to tvrdí."
 prelude_events.0080.t: "Přijmi to nejlepší, co mám"
 prelude_events.0080.desc.intro: "„[Select_CString(ROOT.Char.IsFemale,'Má dobrá','Můj dobrý')] [ROOT.Char.GetTitleAsNameNoTooltip],“ otočím se a spatřím [guest.GetTitledFirstName] vedle nervózní [Select_CString(courtier.IsFemale,'ženy','muže')]. „Víš, jak moc si tě vážím, a bylo by mi velikou radostí ti pomoci.“\n\n„Nabízím ti to nejlepší ze svých [Select_CString(courtier.IsFemale,'žen','mužů')], [courtier.GetFirstName]. [guest.Custom2('RelationToMe', SCOPE.sC('courtier'))|U] a člověk mnoha schopností. Kéž je to"
 prelude_events.0080.desc.same_house: " znamením přátelství v našem rodě.“"
 prelude_events.0080.desc.fallback: " počátkem přátelství mezi našimi rody.“"
 prelude_events.0080.desc.friend: " znamením našeho přátelství.“"
 prelude_events.0080.aa: "„Myslíš, že nepoznám špeha?“"
 prelude_events.0080.a: "„Přesně vím, co by [Select_CString(courtier.IsFemale,'měla','měl')] dělat.“"
 prelude_events.0080.b: "„[courtier.GetFirstNameNoTooltip] je u mého dvora [Select_CString(courtier.IsFemale,'vítána','vítán')].“"
 prelude_events.0080.c: "„Málokdo je tak štědrý jako ty, [guest.GetTitleAsNameNoTooltip].“"
 friend_coronation_offered_courtier: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'nezištně nabídla','nezištně nabídl')] [CHARACTER.GetShortUIName] schopného dvořana během korunovace."
 friend_coronation_offered_courtier_corresponding: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'nezištně nabídla','nezištně nabídl')] [TARGET_CHARACTER.GetShortUIName] schopného dvořana během korunovace."
 rival_rejected_courtier_paranoid: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'odmítla','odmítl')] dvořana, kterého [Select_CString(TARGET_CHARACTER.IsFemale,'nabídla','nabídl')] [TARGET_CHARACTER.GetShortUIName], a [Select_CString(CHARACTER.IsFemale,'obvinila','obvinil')] ho ze špionáže."
 rival_rejected_courtier_paranoid_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'odmítla','odmítl')] dvořana, kterého [Select_CString(CHARACTER.IsFemale,'nabídla','nabídl')] [CHARACTER.GetShortUIName], a [Select_CString(TARGET_CHARACTER.IsFemale,'obvinila','obvinil')] ho ze špionáže."
 bp4_paranoid_measures_modifier: "Paranoidní opatření"
 bp4_paranoid_measures_modifier_desc: "Tato postava zvýšila svou ostražitost poté, co jí byl nabídnut podezřelý dvořan."
 prelude_events.0090.t: "Dar pro [ROOT.Char.GetTitleAsNameNoTooltip]"
 prelude_events.0090.desc.intro: "„Klid!“ zaslechnu hlas [guest.GetTitledFirstName] a otočím se. [guest.GetTitledFirstNameNoTooltip] jemně poplácává svého koně po boku.\n\n"
 prelude_events.0090.desc.blood_brother: "Nikdo mi nikdy nebyl tak blízký jako [guest.GetTitledFirstNameNoTooltip]. Sotva skrývám úsměv, když ke mně rozpřáhne náruč."
 prelude_events.0090.desc.bad_opinion: "Stačí jediný pohled na [guest.GetTitledFirstName] a napadne mě: [guest.Custom('InsultAdjective')] [guest.Custom('InsultNoun')]. Nějak se [Select_CString(guest.IsFemale,'dokázala','dokázal')] dostat až na mou korunovaci. Sotva dokážu skrýt úšklebek, když ke mně přichází."
 prelude_events.0090.desc.fallback: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))|U] [guest.GetTitledFirstName] ke mně přichází se širokým úsměvem."
 prelude_events.0090.desc.outro: "\n\n„Tak co říkáš?“ [guest.GetTitledFirstNameNoTooltip] ukáže na stádo ovcí hned za sebou. „Důstojný dar?“"
 prelude_events.0090.aa: "„[Select_CString(guest.IsFemale,'Má sestro','Můj bratře')]! Oslavme to společně!“"
 prelude_events.0090.a: "„Můžeš je odvést zpátky do [guest.GetCapitalLocation.GetNameNoTooltip].“"
 prelude_events.0090.b: "„#EMP Skvělý#! dar.“"
 prelude_events.0090.c: "„Prosím, nech si je! Tvá přítomnost je dar sama o sobě.“"
 friend_nomadic_guest_coronation_herd: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'nabídla','nabídl')] [CHARACTER.GetShortUIName] část stáda během [Select_CString(CHARACTER.IsFemale,'její','jeho')] korunovace"
 friend_nomadic_guest_coronation_herd_corresponding: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'nabídla','nabídl')] [TARGET_CHARACTER.GetShortUIName] část stáda během [Select_CString(TARGET_CHARACTER.IsFemale,'její','jeho')] korunovace"
 prelude_events.0100.t: "Slibná výstavba"
 prelude_events.0100.desc: "„Co je to za [ROOT.Char.GetTitleAsNameNoTooltip], když nechává panství svých vazalů chřadnout a pustnout? Lidé o tom mluví, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')],“ varuje mě vážně [vassal.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))]), [vassal.Custom('quirk_pos_pp')].\n\n„Naléhám na tebe, abys obrátil pozornost dovnitř svého panství a pamatoval, že věhlas panství stojí na věhlasu jeho domény.“"
 prelude_events.0100.a: "„Slibuji, že na to nezapomenu.“"
 prelude_events.0100.b: "„Ať tvé panství vzkvétá, [vassal.GetTitledFirstNameNoTooltip].“"
 prelude_events.0100.c: "„Možná bych se měl zaměřit na studium těch postupů...“"
 coronation_vassal_building_tt: "Díky modifikátoru [GetModifier('coronation_vassal_building_modifier').GetName]"
 coronation_vassal_building_modifier: "Příslib výstavby"
 coronation_vassal_building_modifier_desc: "Tato postava získá [prestige_i][Concept('prestige','prestiž')|E] pokaždé, když postaví budovy v panství svých vazalů."
 friend_coronation_paid_for_building: "[CHARACTER.GetShortUIName] [Select_CString(CHARACTER.IsFemale,'přispěla','přispěl')] zlatem na stavební úsilí [TARGET_CHARACTER.GetShortUIName]."
 friend_coronation_paid_for_building_corresponding: "[TARGET_CHARACTER.GetShortUIName] [Select_CString(TARGET_CHARACTER.IsFemale,'přispěla','přispěl')] zlatem na stavební úsilí [CHARACTER.GetShortUIName]."
 prelude_events.0110.t: "Nevyslyšení"
 prelude_events.0110.desc: "Všimnu si, že [guest.GetTitledFirstName] po mně pokradmu pokukuje. [guest.Custom('quirk_pos_present')|U] a nakonec ke mně přistoupí. S uctivou úklonou začne:\n\n„[Select_CString(ROOT.Char.IsFemale,'Má nejdražší','Můj nejdražší')] [ROOT.Char.GetTitleAsNameNoTooltip], my, [guest_culture.GetCollectiveNounNoTooltip], tě chceme podporovat nyní i v dalších dnech. Koruna ti brzy spočine na hlavě, ale najdou v tvém srdci místo i naše zvyky?“"
 prelude_events.0110.a: "„Budu mluvit jazykem vašich srdcí.“"
 prelude_events.0110.b: "Všichni musí vědět, že [guest_culture.GetCollectiveNounNoTooltip] mají v mém srdci místo."
 prelude_events.0110.c: "Korunovace si žádá mou pozornost jinde."
 cultural_acceptance_gain_coronation_impress_attendees: "Několik slov pronesených při korunovaci změnilo kulturní přijetí"
 friend_coronation_learn_language: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'projevila','projevil')] během své korunovace zájem naučit se jazyk, kterým mluví [TARGET_CHARACTER.GetShortUIName]."
 friend_coronation_learn_language_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'projevila','projevil')] během své korunovace zájem naučit se jazyk, kterým mluví [CHARACTER.GetShortUIName]."
 prelude_events.0120.t: "Nezapomínej na své přátele"
 prelude_events.0120.desc: "„Není to jistě snadné,“ pronese [guest.GetTitledFirstName], [guest.Custom('quirk_pos_pp')]. „Dokážu si jen představit tíhu koruny, která ti brzy spočine na hlavě.“\n\n„Ale netrap se. Tví věrní vazalové budou stát po tvém boku, teď i navždy. Tady, vezmi si tohle.“ [guest.GetTitledFirstNameNoTooltip] pokyne jednomu ze svých služebníků, který se ukloní a předloží úhledně zabalený dar. „[guest_artifact.GetName],“ vysvětlí [guest.GetFirstNameNoTooltip]. „Dobře mi [Select_CString(guest_artifact.IsValid,'sloužil','sloužil')].“"
 prelude_events.0120.aa: "„Oplatím ti to stejným gestem.“"
 prelude_events.0120.a: "„Má láska má cenu jen tohohle?“"
 prelude_events.0120.b: "„Děkuji za tvou štědrost, [guest.GetTitleAsNameNoTooltip].“"
 prelude_events.0120.c: "Ať všichni vidí jeho lesk!"
 coronation_gift_artifact_desc: "[guest_artifact.GetDesc]\n\nPromyšlený dar od [guest.GetShortUINamePossessive] ke korunovaci."
 coronation_gift_artifact_host_desc: "[my_artifact.GetDesc]\n\nDarováno při výměně darů během korunovace."
 friend_coronation_gift_exchange: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] si během korunovace [CHARACTER.GetShortUIName] vyměnili dary."
 friend_coronation_gift_exchange_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] a [CHARACTER.GetShortUIName] si během korunovace [TARGET_CHARACTER.GetShortUIName] vyměnili dary."
 prelude_events.0130.t: "Požehnání tvému majetku"
 prelude_events.0130.desc: "„Kéž tě [coronator.GetFaith.HighGodName] v tento šťastný den zahrne požehnáním, [ROOT.Char.GetTitledFirstNameNoTooltip],“ pronese [coronator.GetTitledFirstName], skloní hlavu a [coronator.Custom('quirk_pos_pp')].\n\n„Rád bych tuto příležitost připomněl požehnáním tvého nejmilovanějšího artefaktu [my_artifact.GetName].“"
 prelude_events.0130.a: "Kéž jej [coronator.GetFaith.HighGodName] chrání."
 prelude_events.0130.a.tt: "[my_artifact.GetName]:\n$BULLET_WITH_TAB$Získá [piety_i|E]#positive_value +10%#! měsíční [Concept('piety','zbožnosti')|E]\n$BULLET_WITH_TAB$Získá #positive_value +10#! [Concept('clergy','mínění duchovenstva')|E]"
 prelude_events.0130.b: "Ať připomíná tuto korunovaci."
 prelude_events.0130.b.tt: "[my_artifact.GetName]:\n$BULLET_WITH_TAB$Získá [prestige_i|E]#positive_value +8%#! měsíční [Concept('prestige','prestiže')|E]"
 prelude_events.0130.c: "„Moji hosté by jej rádi viděli.“"
 prelude_events_0130_cynical_tt: "Díky tvému #high [GetTrait('cynical').GetName(GetNullCharacter)] [Concept('trait','rysu')|E]#! se [Concept('coronation_magnificence','pompéznost')|E] aktivity [GetActivityType('activity_coronation').GetName] #P výrazně zvýší#!"
 coronation_blessed_artifact_desc: "[my_artifact.GetDesc]\n\nZdá se, jako by vyzařoval mihotavé světlo. Připomínka požehnání uděleného během korunovace [artifact_owner.GetTitledFirstNamePossessive]."
 prelude_events.0140.t: "V záři tvé slávy"
 prelude_events.0140.desc: "[host.GetTitledFirstName] se na chvíli zadívá na dav, [host.Custom('quirk_pos_pp')]. Hlasy dvořanů už znějí stejně neustále jako ptačí švitoření a nepochybuji, že [guest.GetTitledFirstName] se k nim hodlá přidat.\n\n„[Select_CString(ROOT.Char.IsFemale,'Má dobrá','Můj dobrý')] [ROOT.Char.GetTitleAsNameNoTooltip]!“ pronese [guest.GetTitledFirstNameNoTooltip] a přisune se ke mně. „Smím se odvážit zeptat, co si myslíš o oslavách? Nepochybuji, že vláda [host.GetTitledFirstNamePossessiveNoTooltip] bude plná lásky a spravedlnosti.“"
 prelude_events.0140.a: "#EMP Nic neříkat.#!"
 prelude_events.0140.b: "„Budou nás považovat za šťastlivce, že jsme mohli být u toho!“"
 prelude_events.0140.b.offer_support_tt: "Díky tvému [Concept('intent','záměru')|E] #high $coronation_offer_support$#! se [Concept('coronation_magnificence','pompéznost')|E] aktivity [GetActivityType('activity_coronation').GetName] #P znatelně zvýší#!"
 prelude_events.0140.c: "„Ať [Select_CString(host.IsFemale,'její vláda trvá','jeho vláda trvá')] dlouhá léta!“"
 prelude_events.0150.t: "Znáš [Select_CString(guest.IsFemale,'ji','ho')]?"
 prelude_events.0150.desc: "„[ROOT.Char.GetTitledFirstNameNoTooltip],“ zavolá na mě [host.GetTitledFirstName] se širokým úsměvem. Vedle [Select_CString(host.IsFemale,'ní','něj')] stojí další host, [guest.GetTitleAsNameNoTooltip|l], kterého neznám.\n\n„Tohle je [guest.GetTitledFirstName],“ představí [Select_CString(guest.IsFemale,'ji','ho')] [host.GetTitledFirstNameNoTooltip]. „Myslím, že byste našli mnoho společného. Třeba [guest.Custom('MatchingConversationSubject_alone')].“"
 prelude_events.0150.aa: "„Bude mi potěšením provést [Select_CString(guest.IsFemale,'ji','ho')] po okolí.“"
 prelude_events.0150.a: "[Select_CString(guest.IsFemale,'Působí velmi zdvořile','Působí velmi zdvořile')]."
 prelude_events.0150.b: "Mnohem raději bych si promluvil s [host.GetTitledFirstNameNoTooltip]."
 prelude_events.0150.c: "„Jsem přítelem #EMP všech#!, [host.GetTitledFirstNameNoTooltip].“"
 lover_coronation_introduction: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] po seznámení při korunovaci pocítili nepopiratelné vzájemné pouto."
 lover_coronation_introduction_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] a [CHARACTER.GetShortUIName] po seznámení při korunovaci pocítili nepopiratelné vzájemné pouto."
 friend_coronation_introduction: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] se po seznámení při korunovaci sblížili."
 friend_coronation_introduction_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] a [CHARACTER.GetShortUIName] se po seznámení při korunovaci sblížili."
 prelude_events.0160.t: "[ROOT.Char.GetDynasty.GetNameNoTooltip] v davu"
 prelude_events.0160.desc: "„[guest.GetHouse.GetMotto],“ pronese známý hlas. Otočím se a spatřím [guest.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))], jak se snaží upoutat mou pozornost.\n\n„[ROOT.Char.GetFirstNameNoTooltip],“ pozdraví mě [guest.GetTitledFirstNameNoTooltip], [guest.Custom('quirk_pos_pp')]. „Je mimořádným potěšením při takové příležitosti potkat dalšího člena dynastie [ROOT.Char.GetDynasty.GetName]. Připadá mi, jako by od našeho posledního setkání uplynul celý život.“"
 prelude_events.0160.aa: "„[ROOT.Char.GetDynasty.GetNameNoTooltip] zvítězí!“"
 prelude_events.0160.a: "„Potěšení není vzájemné.“"
 prelude_events.0160.b: "„Ať celý svět ví, že jsme tady!“"
 prelude_events.0160.c: "Musíme zůstat skromní."
 rival_coronation_dynasty_insult: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'urazila','urazil')] [TARGET_CHARACTER.GetShortUIName] při korunovaci tím, že [Select_CString(TARGET_CHARACTER.IsFemale,'ji označila za ostudu její dynastie','ho označil za ostudu jeho dynastie')]."
 rival_coronation_dynasty_insult_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'urazila','urazil')] [CHARACTER.GetShortUIName] při korunovaci tím, že [Select_CString(CHARACTER.IsFemale,'ji označila za ostudu její dynastie','ho označil za ostudu jeho dynastie')]."
 coronation_famed_dynasty_modifier: "Proslulá dynastie"
 coronation_famed_dynasty_modifier_desc: "Vysokou úroveň slávy jednoho z členů této dynastie uznali všichni hosté korunovace."
 prelude_events.0170.t: "[guest.GetFaith.GetAdjectiveNoTooltip] hlas"
 prelude_events.0170.desc: "Jak denní světlo slábne, všimnu si, že [guest.GetTitledFirstName] hledí mým směrem. Na pozdrav kývne, usměje se a přistoupí blíž.\n\n„Byl to krásný den, nemyslíš, [ROOT.Char.GetFirstNameNoTooltip]? Za takové požehnání musí mít [guest.GetFaith.HighGodName] naši vděčnost. My, [guest.GetFaith.GetAdherentNamePluralNoTooltip|l], chováme toto učení v hluboké úctě.“ [guest.GetTitledFirstNameNoTooltip] to pronese s hrdostí, zhluboka se nadechne a pokračuje ve svém teologickém výkladu."
 prelude_events.0170.aa: "„Bláboly! Teď si poslechni o [ROOT.Char.GetFaith.HighGodName].“"
 prelude_events.0170.aa.success: "[guest.GetShortUIName] pochopí slávu [ROOT.Char.GetFaith.HighGodName]"
 prelude_events.0170.aa.failure: "[guest.GetShortUIName] se cítí [Select_CString(guest.IsFemale,'uražena','uražen')]"
 prelude_events.0170.a: "Teologická debata by nebyla na škodu."
 prelude_events.0170.a.crit_success: "[host.GetShortUIName] je ohromen"
 prelude_events.0170.a.success: "Veřejnost je ohromena"
 prelude_events.0170.a.failure: "Ztrapníš se"
 prelude_events.0170.b: "„Pokračuj.“"
 prelude_events.0170.c: "Korunovace není místem pro podobné debaty."
 prelude_events.0170.c.bad: "Pošlu toho žvanila nudit nějakého nevzdělaného podporovatele."
 prelude_events.0170.c.bad_flavor: "Tirádami [guest.GetFirstNameNoTooltip] se ten nevzdělaný hlupák [supporter.GetName] určitě rozzuří!"
 cheaper_to_convert_to_guest_faith_tt: "Získáš #P 50%#! slevu na konverzi k [guest.GetFaith.GetName]"
 prelude_events.0170.c.disrupt_loyalists_tt: "Díky tvému [Concept('intent','záměru')|E] #high $coronation_disrupt_loyalists$#! se [Concept('coronation_magnificence','pompéznost')|E] aktivity [GetActivityType('activity_coronation').GetName] #N sníží#!"
 prelude_events.0180.t: "Chvíle klidu"
 prelude_events.0180.desc.host: "Nechám hosty za sebou a vstoupím do [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship], abych si dopřál chvíli klidu, než na mě dolehla tíha koruny.\n\n"
 prelude_events.0180.desc.outro: "Oltář zalévá tlumené světlo tuctu svící. Chladné zdi naplňuje voňavé ticho. Napravo na mě přísně hledí vyobrazení [ROOT.Char.GetFaith.WealthGodName]. Nalevo pomalu blednou barvy postavy [ROOT.Char.GetFaith.HealthGodName] a její úsměv je už sotva patrný."
 prelude_events.0180.desc.guest: "Konečně se mi podaří nechat ostatní hosty za sebou a vstoupit do [ROOT.Province.GetCounty.GetFaith.HouseOfWorship], abych si dopřál chvíli klidu.\n\n"
 prelude_events.0180.a: "[ROOT.Char.GetFaith.HighGodName], neopouštěj [host.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 prelude_events.0180.b: "[ROOT.Char.GetFaith.WarGodName], sraz [host.GetTitledFirstNameNoTooltip]!"
 prelude_events.0180.c: "Svěřuji se do péče [ROOT.Char.GetFaith.HealthGodName]."
 prelude_events.0180.d: "[ROOT.Char.GetFaith.WealthGodName] mě povede."
 prelude_events.0180.a.impress_attendees_tt: "Díky tvému [Concept('intent','záměru')|E] #high $coronation_impress_attendees$#! se [Concept('coronation_magnificence','pompéznost')|E] aktivity [GetActivityType('activity_coronation').GetName] #P výrazně zvýší#!"
 coronation_good_health_modifier: "Modlitba za dobré zdraví"
 coronation_good_health_modifier_desc: "Tato postava si během korunovace našla chvíli na modlitbu za dobré zdraví."
 coronation_wealth_modifier: "Modlitba za bohatství"
 coronation_wealth_modifier_desc: "Tato postava si během korunovace našla chvíli na modlitbu za bohatství."
 prelude_events.0190.t: "Povzbudivá slova"
 prelude_events.0190.desc.intro: "Plameny v krbu tančí, jako by předváděly [ROOT.Char.Custom('GetMedievalDance')]. Dveře do mých komnat se náhle otevřou a zaslechnu známý hlas, který volá mé jméno.\n\n"
 prelude_events.0190.desc.spouse: "„[ROOT.Char.Custom('WifeHusband')|U],“ pronese [councillor.GetFirstName] jemným a klidným hlasem."
 prelude_events.0190.desc.other: "„[ROOT.Char.GetTitledFirstNameNoTooltip],“ začne [councillor.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))]."
 prelude_events.0190.desc.outro: "„Vím, že se blíží den, kdy pohlédneš na svůj odraz v chladném kovu a budeš přemýšlet, zda děláš správnou věc. Ať to všichni vědí, ať se to křičí z každého kouta této pevnosti: budu stát po tvém boku.“\n\n[councillor.GetTitledFirstNameNoTooltip] vytáhne z váčku malý dárek. „Nechal jsem jej vyrobit pro tebe.“"
 prelude_events.0190.a: "„To je víc, než jsem si mohl přát.“"
 prelude_events.0190.b: "„[councillor.GetFirstNameNoTooltip]... děkuji.“"
 prelude_events.0190.c: "Teď se cítím klidněji."
 artifact_coronation_gift_desc: "[newly_created_artifact.GetDesc]\n\nDar od [councillor.GetShortUIName] v předvečer korunovace [root_scope.GetShortUIName]."
