l_polish:
 game_concept_coronation: "Korunovace"
 game_concept_coronations: "Korunovace"
 game_concept_coronation_desc: "[Concept('coronation','Korunovace')|E] je [Concept('activity','aktivita')|E], při níž [Concept('ruler','vládce')|E] zve [Concept('vassals','vazaly')|E], sobě rovné i [Concept('guests','hosty')|E] zblízka i zdaleka, aby byli svědky jeho nástupu na trůn.\n\nKorunovace má dvě podoby: běžnou korunovaci a [Concept('anointment','pomazání')|E], přičemž druhé z nich poskytuje lepší odměny, avšak za vyšší cenu.\n\nOčekávané odměny:\n$activity_coronation_host_desc$"
 game_concept_coronation_i: "@activity_coronation!"
 game_concept_oath: "Přísaha"
 game_concept_oaths: "Přísahy"
 game_concept_oath_desc: "[Concept('oaths','Přísahy')|E] skládá [Concept('host','hostitel')|E] během [Concept('activity','aktivity')|E] [Concept('coronation','korunovace')|E] a hrají důležitou roli při zajištění [Concept('legitimacy','legitimity')|E] nového [Concept('ruler','vládce')|E], když nastupuje na trůn.\n\nPřísahy odemknou zvláštní časově omezená [Concept('decisions','rozhodnutí')|E], která bude muset vládce splnit, aby prokázal, že je hoden svého [Concept('title','titulu')|E]. Získané odměny budou ovlivněny [Concept('coronation_magnificence','okázalostí korunovace')|E]."
 game_concept_coronation_magnificence: "Okázalost"
 game_concept_coronation_magnificence_desc: "[Concept('coronation_magnificence','Okázalost')|E] [Concept('coronation','korunovace')|E] určuje výsledek [Concept('activity','aktivity')|E]; vyšší hodnota okázalosti vede k lepšímu výsledku pro [Concept('host','hostitele')|E].\n\nOkázalost lze získat prostřednictvím [Concept('intents','záměrů')|E], [Concept('activity_options','možností aktivity')|E] a událostí v rámci aktivity. Její hodnotu mohou ovlivnit také [Concept('coronation_supporters','podporovatelé korunovace')|E] a [Concept('coronation_detractors','odpůrci korunovace')|E]."
 game_concept_coronation_supporter: "Podporovatel"
 game_concept_coronation_supporters: "Podporovatelé"
 game_concept_coronation_supporter_desc: "[Concept('coronation_supporters','Podporovatelé')|E] jsou [Concept('activity_guests_short','hosté aktivity')|E] [Concept('coronation','korunovace')|E], kteří podporují [Concept('host','hostitele')|E] v jeho nástupu na trůn. Dostanou zvláštní příležitosti pomoci [Concept('ruler','vládci')|E] zajistit jeho [Concept('legitimacy','legitimitu')|E].\n\nStojí v přímém protikladu k [Concept('coronation_detractors','odpůrcům korunovace')|E], tedy hostům, kteří se snaží hostitele zmařit."
 game_concept_coronation_detractor: "Odpůrce"
 game_concept_coronation_detractors: "Odpůrci"
 game_concept_coronation_detractor_desc: "[Concept('coronation_detractors','Odpůrci')|E] jsou [Concept('activity_guests_short','hosté aktivity')|E] [Concept('coronation','korunovace')|E], kteří odporují [Concept('host','hostiteli')|E] v jeho nástupu na trůn. Pokusí se [Concept('ruler','vládci')|E] uškodit a zničit jeho [Concept('legitimacy','legitimitu')|E].\n\nStojí v přímém protikladu k [Concept('coronation_supporters','podporovatelům korunovace')|E], tedy hostům, kteří se snaží hostiteli pomoci."
 game_concept_coronation_anointment: "Pomazání"
 game_concept_anointment: "$game_concept_coronation_anointment$"
 game_concept_anointments: "Pomazání"
 game_concept_coronation_anointment_desc: "[Concept('anointment','Pomazání')|E] je jeden typ [Concept('coronation','korunovace')|E], při němž [Concept('ruler','vládce')|E] vyhledá [Concept('head_of_faith','hlavu víry')|E], aby požehnala jeho nástupu na trůn. U některých věr je to nezbytné, má-li být skutečně považován za [Concept('legitimate','legitimního')|E] vládce svých zemí.\n\nAby si [Concept('host','hostitel')|E] zajistil podporu své hlavy víry, může použít [Concept('anointment_request','žádost o pomazání')|E] jako [Concept('interaction','interakci')|E]."
 game_concept_anointment_request: "Žádost o pomazání"
 game_concept_request_anointment: "$game_concept_anointment_request$"
 game_concept_anointment_request_desc: "[Concept('anointment_request','Žádost o pomazání')|E] je zvláštní [Concept('character_interaction','interakce postavy')|E], kterou může [Concept('ruler','vládce')|E] použít vůči své [Concept('head_of_faith','hlavě víry')|E], aby si zajistil její podporu při [Concept('anointment','pomazání')|E]."
