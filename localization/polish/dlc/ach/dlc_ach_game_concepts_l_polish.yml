l_polish:
 game_concept_coronation: "Korunovace"
 game_concept_coronations: "Korunovace"
 game_concept_coronation_desc: "Korunovace je [Concept('activity','aktivita')|E], při níž [Concept('ruler','vládce')|E] zve [Concept('vassals','vazaly')|E], sobě rovné a [Concept('guests','hosty')|E] z širokého okolí, aby byli svědky jeho nástupu na trůn.\n\nKorunovace může mít dvě podoby: běžnou korunovaci a [Concept('anointment','pomazání')|E]. Pomazání přináší lepší odměny, ale také vyšší náklady.\n\nOčekávané odměny:\n$activity_coronation_host_desc$"
 game_concept_coronation_i: "@activity_coronation!"
 game_concept_oath: "Přísaha"
 game_concept_oaths: "Přísahy"
 game_concept_oath_desc: "Přísahy skládá během [Concept('coronation','korunovační')|E] [Concept('activity','aktivity')|E] [Concept('host','hostitel')|E] a hrají důležitou roli při upevňování [Concept('legitimacy','legitimity')|E] nového [Concept('ruler','vládce')|E] při jeho nástupu na trůn.\n\nPřísahy zpřístupní zvláštní časově omezená [Concept('decisions','rozhodnutí')|E], která musí vládce splnit, aby prokázal, že je hoden svého [Concept('title','titulu')|E]. Získané odměny budou ovlivněny [Concept('coronation_magnificence','pompézností')|E] korunovace."
 game_concept_coronation_magnificence: "Pompéznost"
 game_concept_coronation_magnificence_desc: "Pompéznost [Concept('coronation','korunovace')|E] určuje výsledek [Concept('activity','aktivity')|E]; čím vyšší je pompéznost, tím lepší bude výsledek pro [Concept('host','hostitele')|E].\n\nPompéznost lze získat prostřednictvím [Concept('intents','záměrů')|E], [Concept('activity_options','možností aktivity')|E] a událostí během aktivity. Její hodnotu mohou ovlivnit také [Concept('coronation_supporters','podporovatelé')|E] a [Concept('coronation_detractors','odpůrci')|E]."
 game_concept_coronation_supporter: "Podporovatel"
 game_concept_coronation_supporters: "Podporovatelé"
 game_concept_coronation_supporter_desc: "Podporovatelé jsou [Concept('activity_guests_short','hosté')|E] [Concept('coronation','korunovace')|E], kteří podporují [Concept('host','hostitele')|E] při jeho nástupu na trůn. Dostanou zvláštní příležitosti pomoci [Concept('ruler','vládci')|E] upevnit jeho [Concept('legitimacy','legitimitu')|E].\n\nJejich přímým protějškem jsou [Concept('coronation_detractors','odpůrci')|E], tedy hosté, kteří se snaží hostiteli překazit jeho záměry."
 game_concept_coronation_detractor: "Odpůrce"
 game_concept_coronation_detractors: "Odpůrci"
 game_concept_coronation_detractor_desc: "Odpůrci jsou [Concept('activity_guests_short','hosté')|E] [Concept('coronation','korunovace')|E], kteří vystupují proti [Concept('host','hostiteli')|E] při jeho nástupu na trůn. Budou se snažit [Concept('ruler','vládci')|E] překazit jeho záměry a podkopat jeho [Concept('legitimacy','legitimitu')|E].\n\nJejich přímým protějškem jsou [Concept('coronation_supporters','podporovatelé')|E], tedy hosté, kteří se snaží hostiteli pomoci."
 game_concept_coronation_anointment: "Pomazání"
 game_concept_anointment: "$game_concept_coronation_anointment$"
 game_concept_anointments: "Pomazání"
 game_concept_coronation_anointment_desc: "Pomazání je jedním z typů [Concept('coronation','korunovace')|E], při němž [Concept('ruler','vládce')|E] vyhledá [Concept('head_of_faith','hlavu víry')|E], aby požehnala jeho nástupu na trůn. U některých věr je pomazání nezbytné k tomu, aby byl skutečně považován za [Concept('legitimate','legitimního')|E] vládce svých zemí.\n\nAby si [Concept('host','hostitel')|E] zajistil podporu své hlavy víry, může použít [Concept('anointment_request','Žádost o pomazání')|E] [Concept('interaction','interakci')|E]."
 game_concept_anointment_request: "Žádost o pomazání"
 game_concept_request_anointment: "$game_concept_anointment_request$"
 game_concept_anointment_request_desc: "[Concept('character_interaction','Interakce s postavou')|E] Žádost o pomazání je zvláštní interakce, kterou může [Concept('ruler','vládce')|E] použít na svou [Concept('head_of_faith','hlavu víry')|E], aby si zajistil její podporu při [Concept('anointment','pomazání')|E]."
