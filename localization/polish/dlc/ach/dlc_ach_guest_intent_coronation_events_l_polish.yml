l_polish:
 guest_intent_coronation_events.0001.t: "[Select_CString(ROOT.Char.IsFemale,'Jako tvá svědkyně','Jako tvůj svědek')]"
 guest_intent_coronation_events.0001.desc.collective: "„Tamhle je.“ [guest.GetTitledFirstName] ukáže na [host.GetTitledFirstName], [Select_CString(host.IsFemale,'která stojí','který stojí')] o samotě. Konečně.\n\n„Tohle je naše příležitost,“ naléhá [guest.GetFirstNameNoTooltip]. „Jsme tu, abychom byli svědky korunovace a podpořili [Select_CString(host.IsFemale,'její','jeho')] korunovaci. Je jen spravedlivé, abychom za to něco dostali.“"
 guest_intent_coronation_events.0001.desc.alone: "Na nádvoří nacházím našeho hostitele [host.GetTitledFirstName] o samotě. Konečně mám příležitost dát najevo své úmysly.\n\nJako [Select_CString(ROOT.Char.IsFemale,'svědkyně','svědek')] [Select_CString(host.IsFemale,'její','jeho')] korunovace mám přece právo dostat za svou podporu něco na oplátku."
 guest_intent_coronation_events.0001.a: "Buďme svému lidu příkladem míru."
 guest_intent_coronation_events.0001.b: "A [ROOT.Char.GetFaith.HighGodName] nám bude svědkem."
 guest_intent_coronation_events.0001.c: "Všichni uvidí, že [host.GetTitleAsNameNoTooltip] stojí při nás."
 cultural_acceptance_coronation_bear_witness: "Kulturní přijetí se zvýšilo díky svědectví při korunovaci a projevené podpoře."
 guest_intent_coronation_events.0010.t: "Projev podpory"
 guest_intent_coronation_events.0010.desc.collective: "„[host.GetTitledFirstName] — [host.Custom('ComplimentAdjective')] jako vždy — je konečně o samotě,“ poznamená [guest.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMeShort',SCOPE.sC('guest'))]), [guest.Custom('quirk_pos_pp')]. „Tohle je naše příležitost ukázat, jak jsme věrní.“\n\n„Jen běž, [ROOT.Char.GetFirstNameNoTooltip], nesmíme tuhle příležitost promarnit.“"
 guest_intent_coronation_events.0010.desc.alone: "Konečně je [host.GetTitledFirstName] o samotě — [host.Custom('ComplimentAdjective')] jako vždy. S úsměvem se pomalu vydávám směrem k [Select_CString(host.IsFemale,'ní','němu')].\n\nNemohu promarnit příležitost projevit svou věrnost."
 guest_intent_coronation_events.0010.a: "[host.GetTitledFirstNameNoTooltip] na své podporovatele nezapomene."
 guest_intent_coronation_events.0010.b: "Nebo prostě posílím svůj vztah s [Select_CString(host.IsFemale,'ní','ním')]..."
 guest_intent_coronation_events.0010.c: "Aliance by byla nejvýhodnějším tahem."
 friend_coronation_offer_support: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'podpořila','podpořil')] [TARGET_CHARACTER.GetShortUIName] během [Select_CString(TARGET_CHARACTER.IsFemale,'její','jeho')] korunovace."
 friend_coronation_offer_support_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'podpořila','podpořil')] [CHARACTER.GetShortUIName] během korunovace."
 create_alliance_host_tt: "Uzavřeš s [petition_sender.GetShortUIName] [Concept('alliance','alianci')|E]"
 create_alliance_guest_tt: "Uzavřeš s [host.GetShortUIName] [Concept('alliance','alianci')|E]"
 guest_intent_coronation_events.0020.t: "Za zájmy domény"
 guest_intent_coronation_events.0020.desc.collective: "Pohroužím se do rozhovoru na téma [guest.Custom('MatchingConversationSubject_alone')], který [guest.GetTitledFirstName] odmítá ukončit.\n\n„Ale počkej!“ [guest.GetTitledFirstName] se náhle zarazí. „Vypadá to, že [Select_CString(host.IsFemale,'naše paní','náš pán')] [host.GetTitleAsNameNoTooltip] také míří do svých komnat. Tohle je naše příležitost, [ROOT.Char.GetFirstName]. Postarejme se, ať [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] i [guest.GetPrimaryTitle.GetNameNoTier] vzkvétají.“"
 guest_intent_coronation_events.0020.desc.alone: "Hlavou se mi cestou zpět do komnat honí jediné téma: [ROOT.Char.Custom('MatchingConversationSubject_alone')]. Brzy mi však dochází, že tu na chodbách [Select_CString(ROOT.Char.IsFemale,'nejsem sama','nejsem sám')].\n\n[host.GetTitledFirstName] míří stejným směrem. Tohle může být moje příležitost získat pro [ROOT.Char.GetPrimaryTitle.GetNameNoTier] pomoc, kterou si zaslouží."
 guest_intent_coronation_events.0020.a: "Musíme své úsilí zaměřit na rozvoj našich měst."
 guest_intent_coronation_events.0020.b: "Bez kontroly není vlády."
 guest_intent_coronation_events.0020.c: "Důvěra lidu je ze všeho nejdůležitější."
 guest_intent_coronation_events_advocate_domain_development_tt: "Každá další zúčastněná [Concept('character','postava')|E] se [Concept('intent','záměrem')|E] #high Prosazování zájmů domény#! zvýší [Concept('development_growth','růst rozvoje')|E] v [Concept('counties','hrabstvích')|E], která drží, o #P [EmptyScope.ScriptValue('major_development_progress_gain')|0]#!"
 guest_intent_coronation_events_advocate_domain_control_tt: "Každá další zúčastněná [Concept('character','postava')|E] se [Concept('intent','záměrem')|E] #high Prosazování zájmů domény#! zvýší [Concept('control','kontrolu')|E] v [Concept('counties','hrabstvích')|E], která drží, o #P +[EmptyScope.ScriptValue('major_county_control_gain')|0]#!"
 guest_intent_coronation_events_advocate_domain_county_opinion_tt: "Každá další zúčastněná [Concept('character','postava')|E] se [Concept('intent','záměrem')|E] #high Prosazování zájmů domény#! získá v [Concept('counties','hrabstvích')|E], která drží, na #V 10#! let [GetModifier('coronation_advocate_domain_county_opinion_modifier').GetNameWithTooltip]"
 coronation_advocate_domain_county_opinion_modifier: "Prosazování zájmů domény"
 coronation_advocate_domain_county_opinion_modifier_desc: "Tato postava při korunovaci prosazovala zájmy své domény a blahobyt svého lidu."
 guest_intent_coronation_events.0030.t: "Mám na to právo"
 guest_intent_coronation_events.0030.desc.collective: "„...tak se podíváme, jestli se z tohohle dostaneš.“ [guest.GetTitledFirstName] pyšně pronese a posune jeden ze svých kamenů směrem k mému. Chystám se odpovědět, když se dveře do místnosti náhle rozletí.\n\nVe dveřích stojí [host.GetTitledFirstName], [Select_CString(host.IsFemale,'stejně překvapená','stejně překvapený')] jako my. Okamžitě vstáváme, ale [host.GetTitledFirstNameNoTooltip] nám pokyne, abychom zase usedli. „Omlouvám se,“ zamumlá. „Mám toho hodně k promyšlení.“\n\n[guest.GetTitledFirstNameNoTooltip] povytáhne obočí. Tohle může být naše příležitost obrátit se na [Select_CString(host.IsFemale,'naši lenní paní','našeho lenního pána')]."
 guest_intent_coronation_events.0030.desc.alone: "[Select_CString(ROOT.Char.IsFemale,'Jsem ponořená','Jsem ponořený')] do myšlenek, když se dveře do místnosti náhle rozletí.\n\nVe dveřích stojí [host.GetTitledFirstName], [Select_CString(host.IsFemale,'stejně překvapená','stejně překvapený')] jako já. Okamžitě vstávám, ale [host.GetTitledFirstNameNoTooltip] mi pokyne, abych zase [Select_CString(ROOT.Char.IsFemale,'usedla','usedl')]. „Omlouvám se,“ zamumlá. „Mám toho hodně k promyšlení.“\n\nTohle může být moje jediná příležitost otevřeně promluvit se [Select_CString(host.IsFemale,'svou lenní paní','svým lenním pánem')]."
 guest_intent_coronation_events.0030.a: "Dobrou radou si můžeme získat laskavost."
 guest_intent_coronation_events.0030.b: "Musíme se zasadit o snížení odvodů."
 guest_intent_coronation_events.0030.c: "[Select_CString(host.IsFemale,'Musíme ji upozornit','Musíme ho upozornit')], že daně, které platíme, jsou vyděračské."
 guest_intent_coronation_events.0040.t: "Využít příležitosti"
 guest_intent_coronation_events.0040.desc.intro: "Všechny hosty zaměstnávají kejklíři, jídlo, pití a společnost ostatních. [host.GetTitledFirstName] si konečně může užít chvíli o samotě.\n\n"
 guest_intent_coronation_events.0040.desc.collective: "„Musíme s [Select_CString(host.IsFemale,'ní','ním')] hned mluvit,“ zamumlá [guest.GetTitledFirstName] zpoza poháru. „Jsme tu přece kvůli [Select_CString(host.IsFemale,'ní','němu')]. Je jen spravedlivé, abychom z toho také něco měli.“"
 guest_intent_coronation_events.0040.desc.alone: "Musím s [Select_CString(host.IsFemale,'ní','ním')] okamžitě mluvit. Jsem tu přece kvůli [Select_CString(host.IsFemale,'ní','němu')], takže je jen spravedlivé, abych z toho také něco [Select_CString(ROOT.Char.IsFemale,'měla','měl')]."
 guest_intent_coronation_events.0040.a: "Jedinou skutečně cennou měnou je zlato."
 guest_intent_coronation_events.0040.b: "Prestiž se vždy vyplatí."
 guest_intent_coronation_events.0040.c: "Musíme [Select_CString(host.IsFemale,'ji','ho')] přesvědčit, aby [Select_CString(host.IsFemale,'otevřela','otevřel')] hranice."
 guest_intent_coronation_events.0040.c.flavor: "Miluj zemi bližního svého, jak se říká..."
 guest_intent_coronation_events.0050.t: "Narušení"
 guest_intent_coronation_events.0050.desc.collective: "„Temnota této noci je odrazem temnoty [Select_CString(host.IsFemale,'její','jeho')] vlády,“ zamumlá [guest.GetTitledFirstName], když kolem nás prochází [host.GetTitledFirstName].\n\n„Teď, [ROOT.Char.GetFirstNameNoTooltip], teď konečně nadešel náš čas vnést trochu světla do tohoto zkaženého panství.“"
 guest_intent_coronation_events.0050.desc.alone: "Temnota této noci je odrazem temnoty vlády [host.GetTitledFirstNamePossessive]. V dálce zahlédnu [host.GetTitledFirstNameNoTooltip], jak se vrací do svých komnat.\n\nTohle je moje příležitost. Konečně mohu vnést trochu světla do tohoto zkaženého panství."
 guest_intent_coronation_events.0050.aa: "Teď je to korunovace [claimant_scope.GetTitledFirstNamePossessiveNoTooltip]."
 guest_intent_coronation_events.0050.a: "Musí vidět, čeho jsme schopni."
 guest_intent_coronation_events.0050.b: "[Select_CString(ROOT.Char.IsFemale,'Měla bych','Měl bych')] se zaměřit na získání ostatních hostů na svou stranu."
 guest_intent_coronation_events.0050.c: "Je načase našeho hostitele ponížit."
 guest_intent_coronation_events.0050.d: "Nebudu se [host.GetFirstNameNoTooltip] otevřeně stavět na odpor."
 guest_intent_coronation_events.0050.d_tt: "Další [Concept('ruler','vládce')|E] se [THIS.Char.GetInvolvedActivityIntent.GetName] [Concept('intent','záměrem')|E] pohrozí [host.GetShortUIName] #N snížením#! [Concept('coronation_magnificence','pompéznosti korunovace')|E]"
 guest_intent_coronation_events.0050.d_tt_acceptance: "#alert_trial @alert_icon! [host.GetShortUIName] bude mít #bold menší ochotu ustoupit#!"
 guest_intent_coronation_events.0050.e: "$guest_intent_coronation_events.0050.d$"
 guest_intent_coronation_events.0050.e_tt: "#alert_trial @alert_icon! #bold Už nebudeš mít další příležitost narušit korunovaci [host.GetShortUIName]#!"
 guest_intent_coronation_events.0100.t: "Žadatelé"
 guest_intent_coronation_events.0100.desc.intro: "„Chvilku, prosím...“ osloví mě [petition_sender.GetTitledFirstName] a úslužně se ukloní."
 guest_intent_coronation_events.0100.desc.intro_2: "„[ROOT.Char.GetTitledFirstNameNoTooltip]!“ [petition_sender.GetTitledFirstName] ke mně přichází s otevřenou náručí."
 guest_intent_coronation_events.0100.desc.intro_3: "„Konečně, [ROOT.Char.GetTitledFirstName].“ [petition_sender.GetTitledFirstName] se přede mnou přehnaně hluboce ukloní."
 guest_intent_coronation_events.0100.desc.intro_4: "„[Select_CString(ROOT.Char.IsFemale,'Má nejdražší','Můj nejdražší')] [ROOT.Char.GetTitleAsNameNoTooltip].“ [petition_sender.GetTitledFirstName] mě pozdraví úslužnou úklonou a potutelným úsměvem."
 guest_intent_coronation_events.0100.desc.intro_5: "„Tady jsi, [ROOT.Char.GetTitledFirstNameNoTooltip]!“ [petition_sender.GetTitledFirstName] ke mně kráčí s tím nejširším úsměvem a nakonec předvede nepříliš dobře nacvičenou úklonu."
 guest_intent_coronation_events.0100.desc.intro_6: "„Promiň mou smělost,“ pronese [petition_sender.GetTitledFirstName] a ukloní se tak hluboko, až to vypadá, že se snad přelomí vejpůl."
 guest_intent_coronation_events.0100.desc.intro_7: "„Ach, [Select_CString(ROOT.Char.IsFemale,'má dobrá','můj dobrý')] [ROOT.Char.GetTitleAsNameNoTooltip],“ pronese [petition_sender.GetTitledFirstName] a ukloní se přede mnou, s oděvem pečlivě upraveným."
 guest_intent_coronation_events.0100.desc.intro_8: "„[Select_CString(ROOT.Char.IsFemale,'Má dobrá','Můj dobrý')] [ROOT.Char.GetTitleAsNameNoTooltip]!“ [petition_sender.GetTitledFirstName] můj titul při úkloně téměř vykřikne."
 guest_intent_coronation_events.0100.desc.intro_9: "„Konečně jsem s tebou o samotě, [ROOT.Char.GetTitledFirstNameNoTooltip],“ pozdraví mě [petition_sender.GetTitledFirstName] dobře nacvičenou úklonou."
 guest_intent_coronation_events.0100.desc.disrupt_loyalists: "Jemný úšklebek na tváři [petition_sender.GetTitledFirstNameNoTooltip] ve mně vyvolává pochybnosti o [Select_CString(petition_sender.IsFemale,'jejích','jeho')] upřímných úmyslech."
 guest_intent_coronation_events.0100.desc.same_house: "„Naplňuje mě radostí, když vidím, jak velkou čest přinášíš rodu [ROOT.Char.GetHouse.GetName].“"
 guest_intent_coronation_events.0100.desc.friendship: "„Ne každý den člověk vidí, jak korunují [Select_CString(ROOT.Char.IsFemale,'drahou přítelkyni','drahého přítele')].“"
 guest_intent_coronation_events.0100.desc.winter: "Chlad dne rozechvívá [petition_sender.GetTitledFirstNameNoTooltip] celé tělo."
 guest_intent_coronation_events.0100.desc.summer: "V záři dne stékají [petition_sender.GetTitledFirstNameNoTooltip] po čele krůpěje potu."
 guest_intent_coronation_events.0100.desc.neutral_1: "[ROOT.Char.Custom('GetRandomExteriorDetail')|U]."
 guest_intent_coronation_events.0100.desc.neutral_2: "[petition_sender.Custom('quirk_pos_standalone')|U] a před pokračováním se napije [ROOT.Char.Custom('RegionalDrink')]:"
 guest_intent_coronation_events.0100.desc.neutral_3: "[petition_sender.Custom('quirk_pos_present')|U], když [petition_sender.GetTitledFirstNameNoTooltip] přeruší [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')], který začne tančit mezi [Select_CString(petition_sender.IsFemale,'jejíma','jeho')] nohama."
 guest_intent_coronation_events.0100.desc.cultural_acceptance: "\n\n„Žádáme o porozumění mezi našimi národy. Kéž se nezapomene na podporu, kterou ti projevujeme na počátku tvé vlády.“"
 guest_intent_coronation_events.0100.desc.piety: "\n\n„Prosím, dovol nám modlitbu. Kéž [petition_sender.GetFaith.HighGodName] požehná tvé vládě a učiní ji dlouhou a blahobytnou.“"
 guest_intent_coronation_events.0100.desc.legitimacy: "\n\n„Dnes tu stojíme jako svědci tvé velkoleposti a bylo by nám velikou ctí, kdybys v náš prospěch [Select_CString(ROOT.Char.IsFemale,'pronesla','pronesl')] pár slov.“"
 guest_intent_coronation_events.0100.desc.opinion: "\n\n„Jsme tví nejvěrnější podporovatelé a nejoddanější vazalové. Stojíme tu na tvou počest a nabízíme ti svou pomoc, ať přijde cokoli.“"
 guest_intent_coronation_events.0100.desc.friend: "\n\n„Stojím tu, abych tě [Select_CString(petition_sender.IsFemale,'podpořila','podpořil')], [Select_CString(ROOT.Char.IsFemale,'má vážená','můj vážený')] [ROOT.Char.GetTitleAsNameNoTooltip]. Dovol mi stát po tvém boku, ať se stane cokoli.“"
 guest_intent_coronation_events.0100.desc.alliance: "\n\n„Nabízím ti svou neochvějnou věrnost a podporu. Aliance mezi námi by pro mě byla tou největší ctí.“"
 guest_intent_coronation_events.0100.desc.development: "\n\n„Žádám tě, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')], abys [Select_CString(ROOT.Char.IsFemale,'obrátila','obrátil')] svou pozornost k městům v [petition_sender.GetPrimaryTitle.GetNameNoTier]. Jako [Select_CString(petition_sender.IsFemale,'tvá nejvěrnější vazalka','tvůj nejvěrnější vazal')] nemohu snést pohled na opuštěnou zdejší krajinu.“"
 guest_intent_coronation_events.0100.desc.control: "\n\n„[Select_CString(petition_sender.IsFemale,'Chtěla bych','Chtěl bych')] tě požádat o pomoc s prosazováním práva na území [petition_sender.GetPrimaryTitle.GetNameNoTier].“"
 guest_intent_coronation_events.0100.desc.popular_opinion: "\n\n„Žádám tě, abys [Select_CString(ROOT.Char.IsFemale,'věnovala','věnoval')] pozornost lidu v [petition_sender.GetPrimaryTitle.GetNameNoTier], protože na jeho blahobytu mi záleží ze všeho nejvíc.“"
 guest_intent_coronation_events.0100.desc.hook: "\n\n„Budu tě za tvé vlády podporovat a šířit dobré jméno [ROOT.Char.GetTitleAsNameNoTooltip]. Na oplátku žádám jediné: nezapomeň na tuto laskavost.“"
 guest_intent_coronation_events.0100.desc.vassal_levies: "\n\n„Můj lid stále umírá. Pole zůstávají opuštěná, domy vypálené. Prosím, dovol nám snížit odvody.“"
 guest_intent_coronation_events.0100.desc.vassal_taxes: "\n\n„Daně už jsou nesnesitelné, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]. Ani ti nejbohatší kupci už nedokážou uživit své děti.“"
 guest_intent_coronation_events.0100.desc.gold: "\n\n„Koruna by skutečně ukázala svou velkorysost, kdyby své poddané za jejich podporu náležitě odměnila.“"
 guest_intent_coronation_events.0100.desc.prestige: "\n\n„Bylo by nám velikou radostí získat trochu prestiže, která náleží k postavení tvých vazalů.“"
 guest_intent_coronation_events.0100.desc.claim: "\n\n„Hranice panství jsou příliš strnulé, až nehybné. Pro všechny by bylo nejlepší, kdyby mohli vládnout ti, kdo mají nejpevnější ruku.“"
 guest_intent_coronation_events.0100.desc.faction_discontent: "\n\n„[petition_sender_faction.GetName] jistě znáš, že ano? Naše věc je spravedlivá! A tady nezahálíme... šeptáme mezi tvými hosty, burcujeme tvé nepřátele! Taková moc, tak nádherná korunovace... nás se přece nemusíš bát...“"
 guest_intent_coronation_events.0100.desc.faction_members: "\n\n„Tví hosté dychtí slyšet o [petition_sender_faction.GetName]... ale bojí se tvé odplaty. Dopřej nám naše vazalská práva — dovol nám otevřeně mluvit o našich křivdách!“"
 guest_intent_coronation_events.0100.desc.magnificence_loss: "\n\n„Jaká fraška!“ vysmívá se mi [petition_sender.GetTitledFirstNameNoTooltip], [Select_CString(petition_sender.IsFemale,'jistá','jistý')] si bezpečím tohoto odlehlého místa. „Všichni to vědí! Kolem [host.GetTitleAsNameNoTooltip|l] samí nepřátelé? Vlastní hosté [Select_CString(host.IsFemale,'jí','jím')] pohrdají? Plivu na tvou vládu, plivu na ty, kdo se klaní — plivu na tuhle korunovaci!“"
 guest_intent_coronation_events.0100.desc.magnificence_loss_subtle: "\n\n„O samotě, vysoko nad všemi ostatními,“ pronese [petition_sender.GetTitledFirstNameNoTooltip] temně, „je [ROOT.Char.GetTitleAsName] ve svém dokonalém osamění [Select_CString(ROOT.Char.IsFemale,'ušetřena','ušetřen')] odporných řečí plných rozbrojů. Přesto mám pocit, že musím [ROOT.Char.GetTitleAsNameNoTooltip] ujistit...“\n\n„...že toto shromáždění je takových zrádných řečí #EMP plné#!.“"
 guest_intent_coronation_events.0100.desc.critical_fail: "\n\n„Je konec, [host.GetTitledFirstNameNoTooltip]. Teď je to korunovace [claimant_scope.GetTitledFirstNamePossessive].“"
 guest_intent_coronation_events.0100.a: "„[Select_CString(ROOT.Char.IsFemale,'Ráda vyhovím','Rád vyhovím')].“"
 guest_intent_coronation_events.0100.a.bad: "Neodpovím."
 guest_intent_coronation_events.0100.b.bad: "„Mlč, pse! #EMP Mlč, nebo zemřeš!#!“"
 guest_intent_coronation_events.0100.b: "„Pochlebníkům naslouchat nebudu.“"
 guest_intent_coronation_events.0100.a.tt: "[host.GetShortUIName] přijímá tvou žádost"
 guest_intent_coronation_events.0100.b.tt: "[host.GetShortUIName] odmítá tvou žádost"
