l_polish:
 ach_yearly_events.1001.t: "Otázky financí"
 ach_yearly_events.1001.desc: "Jako [Concept('steward',GetPlayer.GetCouncillorPosition('councillor_steward').GetPositionName)|E] svého lenního pána [liege.GetTitledFirstName] mám za úkol radit [Select_CString(liege.IsFemale,'jí','mu')] se správou pokladnice. Nemalou součástí této povinnosti je vysvětlovat výhody i nevýhody různých způsobů utrácení.\n\n„Tak mi to řekni ještě jednou,“ zeptá se [liege.GetTitledFirstNameNoTooltip], „jaké jsou vlastně #EMP nevýhody#! toho, když budeme peníze panství šetřit? Přece je rozumné mít něco stranou na horší časy?“\n\nNo... [Select_CString(liege.IsFemale,'nemýlí se','nemýlí se')], ale je to poněkud zjednodušený pohled..."
 ach_yearly_events.1001.a: "„Pokud si nejsi [Select_CString(liege.IsFemale,'jistá','jistý')], #EMP mohla bych|mohl bych#! to spravovat za tebe...“"
 ach_yearly_events.1001.a.success: "[liege.GetFirstNameNoTooltip] ti ochotně svěří peníze"
 ach_yearly_events.1001.a.failure: "[liege.GetFirstNameNoTooltip] pojme podezření ohledně tvého plánu"
 ach_yearly_events.1001.b: "Opatrnost je správná cesta."
 ach_yearly_events.1001.c: "[liege.GetTitleAsNameNoTooltip] si zaslouží žít v blahobytu!"
 ach_yearly_events.1001.d: "Možná bude nejlepší vyvážený přístup?"
 ach_yearly_events.1001.d.success: "[liege.GetFirstNameNoTooltip] oceňuje tvůj zdravý úsudek"
 ach_yearly_events.1001.d.failure: "[liege.GetFirstNameNoTooltip] se vysmívá tvé nerozhodnosti"
 ach_fence_sitter_modifier: "Nerozhodnost"
 ach_fence_sitter_modifier_desc: "Nerozhodnost této postavy je všeobecně známá a její neochota zaujmout jasný postoj se stala pověstnou."
 ach_spending_advice_modifier: "Finanční poradenství"
 ach_spending_advice_modifier_desc: "Tato postava se specializuje na poskytování rozumných finančních rad."
 ach_cautious_spender_modifier: "Opatrné hospodaření"
 ach_cautious_spender_modifier_desc: "Tato postava drží měšec pevně sevřený."
 ach_extravagant_spender_modifier: "Rozmařilé utrácení"
 ach_extravagant_spender_modifier_desc: "Tato postava neváhá štědře utrácet, když je to zapotřebí."
 ach_budgeting_mentor_modifier: "Mentor hospodaření"
 ach_budgeting_mentor_modifier_desc: "Tato postava je známým odborníkem na finance a dokáže ostatní učit, jak se svými penězi nakládat co nejrozumněji."
 ach_balanced_budget_modifier: "Vyrovnaný rozpočet"
 ach_balanced_budget_modifier_desc: "Tato postava těží z mimořádně dobře spravovaných financí."
 ach_yearly_events.1002.t: "Krysí hnízdo"
 ach_yearly_events.1002.desc: "Jako [Concept('chancellor',GetPlayer.GetCouncillorPosition('councillor_chancellor').GetPositionName)|E] [liege.GetPrimaryTitle.GetNameNoTier] mám povinnost tahat neposlušné vazaly za ocasy a bránit tomu, aby se havěť zamořující [liege.GetPrimaryTitle.GetTierAsNameNoTooltip|l] slila v jediný velký roj...\n\nZatímco [faction.GetName] nabírá na síle, rozvraceči jako [faction_member.GetName] cestují široko daleko a šeptají svá slova do vnímavých uší.\n\n„[unjoined_vassal.GetPrimaryTitle.GetNameNoTier] je silné a hladové,“ naléhá zrádce na [unjoined_vassal.GetTitleAsNameNoTooltip], [unjoined_vassal.GetFirstName], „věř této síle, tomuto hladu... a také té naší.“"
 ach_yearly_events.1002.a: "Tuhle krysí pakáž musíme izolovat."
 ach_yearly_events.1002.b: "$ach_yearly_events.1002.a$"
 ach_yearly_events.1002.b.success: "Otrávíš myšlenku na vzpouru"
 ach_yearly_events.1002.b.failure: "Tvé pohrdavé odsouzení selže"
 ach_yearly_events.1002.c: "Jsem snad tak servilní? I můj hlas musí být slyšet!"
 ach_yearly_events.1002.c.flavor: "Můj hlas patří k nejvlivnějším v panství. A mezi #EMP nesouhlasnými#! hlasy je ze všech nejsilnější!"
 ach_yearly_events.1002.d: "S krysami se vypořádává... jedna po druhé."
 ach_yearly_events.1002.d.flavor: "Jako [Concept('chancellor',GetPlayer.GetCouncillorPosition('councillor_chancellor').GetPositionName)|E] mám dostatečný vliv, abych tohoto vzpurného [faction_member.GetTitleAsNameNoTooltip] umlčel."
 ach_chancellor_isolating_factions_modifier: "Kancléř izoluje frakce"
 ach_chancellor_isolating_factions_modifier_desc: "Zastánce tohoto vládce obratně dělá z rebelů a odpůrců vyděděnce.\n#weak [Concept('vassals','Vazalové')|E] mají menší sklon přidávat se k [Concept('factions','frakcím')|E]#!"
 chancellor_isolates_factions_title: "[Concept('chancellor',GetPlayer.GetCouncillorPosition('councillor_chancellor').GetPositionName)|E] oslabuje podporu frakce"
 chancellor_isolates_factions_desc: "[ROOT.Char.GetTitledFirstName] obrací nálady mezi tvými vazaly ve tvůj prospěch."
 chancellor_removes_faction_member_title: "[Concept('chancellor',GetPlayer.GetCouncillorPosition('councillor_chancellor').GetPositionName)|E] usmiřuje člena frakce"
 chancellor_removes_faction_member_desc: "[ROOT.Char.GetTitledFirstName] se ukazuje jako rázný odpůrce tvých nespokojených vazalů."
 ach_yearly_events.1003.t: "[Select_CString(ROOT.Char.IsFemale,'Paní poražených','Pán poražených')]"
 ach_yearly_events.1003.desc: "Konflikt mého lenního pána s [foe.GetPrimaryTitle.GetNameNoTier] se vleče. Jako [Select_CString(liege.IsFemale,'její','jeho')] [Concept('marshal',GetPlayer.GetCouncillorPosition('councillor_marshal').GetPositionName)|E] plánuju zásobování, povolávám [liege.Custom('GetLocalCommonerTermPlural')] do služby, tiším místní nepokoje... teď však jezdci přinášejí chmurné zprávy.\n\nU [battle_province.GetName] [liege.Custom('KnightCulturePluralNoTooltip')|l] z [liege.GetPrimaryTitle.GetNameNoTier] selhali. Bitevní linie [commander.GetNamePossessive] se zhroutila a celá naše armáda byla zahnána na zoufalý útěk. Zatímco naši [liege.Custom('GetFighterTermPlural')] prchají, vojsko [foe.GetNamePossessive] postupuje na [liege.GetPrimaryTitle.GetTierAsNameNoTooltip|l]!\n\nMoji rádci mě nabádají, abych dostál své funkci a pevnou rukou v železné rukavici sevřel otěže této pohromy."
 ach_yearly_events.1003.a: "Teď je zapotřebí rázných činů [Concept('marshal',GetPlayer.GetCouncillorPosition('councillor_marshal').GetPositionName)|E]!"
 ach_yearly_events.1003.b: "[ROOT.Char.Custom('KnightCulturePluralNoTooltip')]! #EMP Jeďte zachránit [liege.GetPrimaryTitle.GetNameNoTierNoTooltip]!#!"
 ach_yearly_events.1003.c: "Shromáždím rozprášenou armádu."
 ach_yearly_events.1003.c.success: "Přeživší shromažďuje [liege.GetTitledFirstNameNoTooltip] pod svým praporem"
 ach_yearly_events.1003.c.failure: "Jen málokdo vyslyší tvou výzvu"
 ach_yearly_events.1003.d: "Nechte přeživší za jejich selhání zbičovat."
 ach_yearly_events.1003.d.flavor: "...a [Select_CString(liege.IsFemale,'ta zabedněná','ten zabedněný')] [liege.GetTitleAsNameNoTooltip|l] dostane taky, jestli začne remcat, že je to #EMP moje#! vina!"
 marshal_joins_war_title: "Maršál vyráží do války"
 marshal_joins_war_desc: "Tvá zdrcující porážka přiměla [marshal.GetTitledFirstName], aby se přidal k boji!"
 marshal_joins_war_title_foe: "Nepřátelský maršál vyráží do války"
 marshal_joins_war_desc_foe: "Zdrcující porážka [liege.GetShortUIName] přiměla [marshal.GetShortUIName], [Select_CString(liege.IsFemale,'jejího','jeho')] maršála, aby se přidal k [combat_war.GetName]."
 marshal_aids_troop_recovery_title: "[Concept('marshal',GetPlayer.GetCouncillorPosition('councillor_marshal').GetPositionName)|E] shromažďuje poražené vojsko"
 marshal_aids_troop_recovery_desc: "[ROOT.Char.GetTitledFirstName] rázně reaguje na porážku tvé armády."
 ach_marshal_reconstituting_army_modifier: "Maršál obnovuje armádu"
 ach_marshal_reconstituting_army_modifier_desc: "Po drtivé porážce se maršál této postavy ze všech sil snaží obnovit bojeschopnost vojska."
 custom.every_liege_domain_county: "[liege.GetShortUIName]:\n$EFFECT_LIST_BULLET$Každé [Concept('county','hrabství')|E] v [Concept('domain','doméně')|E]"
 custom.every_liege_lending_vassal: "[liege.GetShortUIName]:\n$EFFECT_LIST_BULLET$Každý [Concept('powerful_vassal','mocný vazal')|E] s požadovaným množstvím [Concept('gold','zlata')|E]"
 ach_yearly_events.1004.t: "Velký, splasklý měšec"
 ach_yearly_events.1004.desc: "S mým zchudlým lenním pánem [liege.GetTitledFirstName] si jako [Select_CString(liege.IsFemale,'její','jeho')] [Concept('steward',GetPlayer.GetCouncillorPosition('councillor_steward').GetPositionName)|E] najdu chvíli na rozhovor. Tedy... zatímco kolem nás dav běsní kvůli prázdnotě [liege.Custom('GetTitleTierAdjective')] pokladnice.\n\n„Jak volají po nových slavných činech!“ vyloží si to velkoryse [liege.GetTitledFirstNameNoTooltip].\n\n„A čím těch slavných činů dosáhneme?“ ptám se. „Kopími pobitými zlatem? Šípy s hroty z drahokamů? Bohatství panství je pryč, ale hlavně že máme #EMP slávu#!...“\n\n"
 ach_yearly_events.1004.desc_end: "„Jen zbožné přání!“ odpoví [liege.GetTitledFirstNameNoTooltip]. „Stav pokladnice znám až příliš dobře...“"
 ach_yearly_events.1004.desc_harsh: "„Jsi můj [Concept('steward',GetPlayer.GetCouncillorPosition('councillor_steward').GetPositionName)|E],“ odpoví [liege.GetTitledFirstNameNoTooltip]. „Najdi zlato. Najdi drahokamy.“"
 ach_yearly_events.1004.a: "„Mohu je vzít tvým vazalům a svalit vinu na sebe.“"
 ach_yearly_events.1004.a.flavor: "Když je pokladnice slabá, musí být [Concept('steward',GetPlayer.GetCouncillorPosition('councillor_steward').GetPositionName)|E] zřejmě silný... a nenáviděný."
 ach_yearly_events.1004.b: "Pílí a časem může bohatství vyrůst."
 ach_yearly_events.1004.b.success: "Obratně reformuješ místní správu"
 ach_yearly_events.1004.b.failure: "Tvůj instinkt se ukáže být překvapivě k ničemu"
 ach_yearly_events.1004.c: "Z píle a času bohatství vyrůstá."
 ach_yearly_events.1004.d: "„Až tvůj lid začne hladovět, pošli ho ke mně.“"
 ach_yearly_events.1004.d.flavor: "Žádná povinnost mě nemůže přinutit spravovat tenhle zubožený měšec dlužníka..."
 ach_stewardship_bankruptcy_modifier: "Správa zaměřená na prosperitu"
 ach_stewardship_bankruptcy_modifier_desc: "Když panství hrozil bankrot, byly zpřísněny místní zákony a odvedenci byli nasazeni na civilní práce."
 ach_welcoming_lieges_creditors_modifier: "Přijímání zchudlých"
 ach_welcoming_lieges_creditors_modifier_desc: "Místní populace roste: špatné hospodaření jinde nutí rodiny přesídlovat sem."
 steward_aids_financial_recovery_title: "[Concept('steward',GetPlayer.GetCouncillorPosition('councillor_steward').GetPositionName)|E] usiluje o ozdravení financí"
 steward_aids_financial_recovery_desc: "[ROOT.Char.GetTitledFirstName] v reakci na tvé finanční potíže reformuje tvou [Concept('domain','doménu')|E]."
 steward_gathers_emergency_tithe_title: "[Concept('steward',GetPlayer.GetCouncillorPosition('councillor_steward').GetPositionName)|E] vybírá mimořádnou daň od vazalů"
 steward_gathers_emergency_tithe_desc: "Kvůli potížím tvé pokladnice [ROOT.Char.GetTitledFirstName] vybral tuto mimořádnou dávku a vzal veškerou vinu na sebe."
 custom.every_scope_faction_member: "Každý člen #high [faction.GetName]#!"
 ach_yearly_events.1005.t: "[ROOT.Char.GetTitleAsNameNoTooltip] z [ROOT.Char.GetPrimaryTitle.GetNameNoTier]"
 ach_yearly_events.1005.desc: "„Od tvého nástupu na trůn [ROOT.Char.GetPrimaryTitle.GetName] uplynuly roky. Jsi [Select_CString(ROOT.Char.IsFemale,'skutečnou panovnicí','skutečným panovníkem')] těchto zemí a [Select_CString(ROOT.Char.IsFemale,'ochránkyní','ochráncem')] lidu, který žije v mém panství.“\n\nSlova [messenger.GetNamePossessive] znějí přesvědčeně. [Select_CString(messenger.IsFemale,'Její','Jeho')] starost o mé panství je upřímná.\n\n„Přesto je tvé čelo stále holé, nezdobí je pomazaná koruna. Tvá ruka je prázdná, bez posvěcených insignií. Ačkoli se nikdo neodváží zpochybnit tvou vládu, #EMP musíš#! uspořádat řádnou korunovaci. Jinak se budu obávat o budoucnost [ROOT.Char.GetPrimaryTitle.GetNameNoTier].“"
 ach_yearly_events.1005.a: "Přiveďte mi kováře."
 ach_yearly_events.1005.b: "Ať začnou přípravy."
 ach_yearly_events.1005.c: "Uspořádám ji později."
 ach_yearly_events.1010.t: "[ROOT.Char.Custom('GetTitleTierAdjective')|U] uznání"
 ach_yearly_events.1010.desc: "Stal jsem se [ROOT.Char.GetTitleAsName] a [ROOT.Char.GetPrimaryTitle.GetNameNoTier] je nyní pod mou vládou. Mezi řády lidstva jsem postavou mocnou i obávanou a každé mé rozhodnutí utváří osudy tisíců.\n\nJako vládce [title.GetNameNoTier] jsem si své právo vládnout vydobyl."
 ach_yearly_events.1010.desc_vassals: "Nyní však musí lid [title.GetAdjectiveNoTooltip] a všichni, kdo náleží pod mocný prapor [ROOT.Char.GetPrimaryTitle.GetName] — [vassal_title_1.GetAdjective] [ROOT.Char.Custom('GetLocalCommonerTermPlural')], [vassal_title_2.GetAdjective] šlechtici... všichni tito poddaní [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] uznat mé [ROOT.Char.Custom('GetTitleTierAdjective')] postavení."
 ach_yearly_events.1010.desc_no_vassals: "Nyní však musí [title.GetAdjectiveNoTooltip] šlechta a všechny poddané národy, které náleží pod mocný prapor [ROOT.Char.GetPrimaryTitle.GetName]... všichni tito poddaní [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] uznat mé [ROOT.Char.Custom('GetTitleTierAdjective')] postavení."
 ach_yearly_events.1010.desc_outro_regalia: "\n\nMusím vykonat nové slavné obřady uvedení do úřadu a stvrdit tak své vznešené insignie."
 ach_yearly_events.1010.desc_outro_crown: "\n\nMusím vykonat nové slavné obřady uvedení do úřadu a stvrdit tak svou vznešenou korunu."
 ach_coronation_suggestion_tt: "Měl bys zvážit uspořádání [Concept('coronation','korunovace')|E]"
 ach_yearly_events.1010.a: "Je na místě další, ještě velkolepější korunovace."
