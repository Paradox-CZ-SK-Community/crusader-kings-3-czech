l_polish:
 bp1_yearly.2020.t: "Velká očekávání"
 bp1_yearly.2020.desc: "[bp1_yearly_2020_influencing_partner.GetTitledFirstName] ke mně přichází s přátelským úsměvem. „Lásko! Vidíš, jak majestátně naše [bp1_yearly_2020_child_to_become_heir.GetFirstName] působí? [Select_CString(bp1_yearly_2020_child_to_become_heir.IsFemale,'Dokázala','Dokázal')] by snad vládnout celé zemi s jednou rukou svázanou za zády; a přísahám - [bp1_yearly_2020_influencing_partner.GetFaith.HighGodNameAlternate] je mi svědkem - že by ti [Select_CString(bp1_yearly_2020_child_to_become_heir.IsFemale,'dělala','dělal')] velkou čest.“\n\nÚkosem po mně pohlédne. „Samozřejmě, pokud bych [Select_CString(bp1_yearly_2020_influencing_partner.IsFemale,'mohla','mohl')] udělat #EMP cokoli#!, aby ta představa byla lákavější... Jistě bys mi [Select_CString(bp1_yearly_2020_influencing_partner.IsFemale,'dala','dal')] vědět a mohli bychom se nějak dohodnout, [bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', ROOT.Char)].“ Na rtech [bp1_yearly_2020_influencing_partner.GetTitledFirstNameNoTooltip] pohrává potutelný úsměv.\n\n#EMP Cokoli#!, [Select_CString(bp1_yearly_2020_influencing_partner.IsFemale,'řekla','řekl')]?"
 bp1_yearly.2020.a: "Přines mi na podnose hlavu [bp1_yearly_2020_target.GetFirstNamePossessiveNoTooltip]. #EMP [bp1_yearly_2020_target.Custom('InsultAdjectiveGeneric')]#!."
 bp1_yearly.2020.b: "Spíš mě zajímají #EMP užitečnější#! dvořané."
 bp1_yearly.2020.b_tt: "[bp1_yearly_2020_influencing_partner.GetFirstNameNoTooltip] ti nabídne výběr schopných dvořanů. "
 bp1_yearly.2020.c: "Moje pokladnice #EMP zeje#! prázdnotou."
 bp1_yearly.2020.c_tt_only_hook: "[bp1_yearly_2020_influencing_partner.GetTitledFirstName] ti nabídne páku na [bp1_yearly_2020_influencing_partners_parent_only_hook.GetTitledFirstName] ([bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', SCOPE.sC('bp1_yearly_2020_influencing_partners_parent_only_hook') )])."
 bp1_yearly.2020.c_tt_halfsies: "[bp1_yearly_2020_influencing_partner.GetTitledFirstName] získá polovinu prostředků od [bp1_yearly_2020_influencing_partners_parent_halfsies.GetTitledFirstName] ([bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', SCOPE.sC('bp1_yearly_2020_influencing_partners_parent_halfsies') )]) a nabídne ti na [bp1_yearly_2020_influencing_partners_parent_halfsies.GetTitledFirstName] páku."
 bp1_yearly.2020.c_tt_pay_and_hook: "[bp1_yearly_2020_influencing_partner.GetTitledFirstName] získá prostředky od [bp1_yearly_2020_influencing_partners_parent_pays.GetTitledFirstName] ([bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', SCOPE.sC('bp1_yearly_2020_influencing_partners_parent_pays') )]) a nabídne ti na [bp1_yearly_2020_influencing_partners_parent_pays.GetTitledFirstName] páku."
 bp1_yearly.2020.d: "Tohle je #EMP nanejvýš#! podezřelé. Stráže!"
 bp1_yearly.2020.d_tt: "Kdo ví, co dalšího může [bp1_yearly_2020_influencing_partner.GetTitledFirstNameNoTooltip] osnovat!"
 bp1_yearly.2020.e: "Od tebe nic nepotřebuji, [bp1_yearly_2020_influencing_partner.GetFirstNameNoTooltip]."
 bp1_yearly.2021.t: "Persona grata"
 bp1_yearly.2021.desc: "[bp1_yearly_2020_influencing_partner.GetFirstName] mě znovu dohání. „[bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', ROOT.Char)|U]! Přináším novinky!“ Spěchá ke mně a přitom rozvine jemný list papíru pokrytý poznámkami. „Tito znamenití lidé by s největší radostí přišli pracovat pro tebe, sem k našemu dvoru!“\n\nPřejedu list pohledem. To jsou vskutku působivé schopnosti, to [Select_CString(bp1_yearly_2020_influencing_partner.IsFemale,'jí','mu')] musím uznat!"
 bp1_yearly.2021.a: "[Select_CString(bp1_yearly_2021_martial_person.IsFemale,'Tahle vycvičená bojovnice','Tenhle vycvičený válečník')] má jistou #EMP autoritu#!."
 bp1_yearly.2021.a_tt: "[bp1_yearly_2021_martial_person.GetShortUIName|U] se připojí k tvému dvoru"
 bp1_yearly.2021.b: "[Select_CString(bp1_yearly_2021_learning_person.IsFemale,'Učená žena','Učený muž')] by se mému dvoru jistě [Select_CString(bp1_yearly_2021_learning_person.IsFemale,'hodila','hodil')]."
 bp1_yearly.2021.b_tt: "[bp1_yearly_2021_learning_person.GetShortUIName|U] se připojí k tvému dvoru"
 bp1_yearly.2021.c: "[Select_CString(bp1_yearly_2021_stewardship_person.IsFemale,'Tahle','Tenhle')] má na finance opravdu mimořádný talent!"
 bp1_yearly.2021.c_tt: "[bp1_yearly_2021_stewardship_person.GetShortUIName|U] se připojí k tvému dvoru"
 bp1_yearly.2021.d: "Diplomacie se zdá být nejrozumnější volbou."
 bp1_yearly.2021.d_tt: "[bp1_yearly_2021_diplomacy_person.GetShortUIName|U] se připojí k tvému dvoru"
 bp1_yearly.2021.e: "Velmi #EMP [Select_CString(bp1_yearly_2021_intrigue_person.IsFemale,'zajímavá kandidátka','zajímavý kandidát')]#!!"
 bp1_yearly.2021.e_tt: "[bp1_yearly_2021_intrigue_person.GetShortUIName|U] se připojí k tvému dvoru"
 bp1_yearly.2021.f: "[Select_CString(ROOT.Char.IsFemale,'Rozmyslela','Rozmyslel')] jsem si to."
 bp1_yearly.2022.t: "[bp1_yearly_2020_target.Custom2('AppropriateGreetingNegative', ROOT.Char )]"
 bp1_yearly.2022.desc_intro: "[bp1_yearly_2020_target.Custom2('NegativeSupplimentaryGreeting', ROOT.Char )]"
 bp1_yearly.2022.desc_imprisoned: "\n\nMám v rukou jistou osobu, která přísahá, že jsi [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')] nic společného s jejím #EMP pokusem o atentát#! na můj život. Té zrádné osobě nevěřím ani slovo. #EMP [bp1_yearly_2020_influencing_partner.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_2020_target'))]#!.\n\nBer to jako varování."
 bp1_yearly.2022.desc_dead: "\n\nAni bys [Select_CString(ROOT.Char.IsFemale,'nevěřila','nevěřil')], co se mi onehdy přihodilo. [bp1_yearly_2020_influencing_partner.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_2020_target'))] se mě [Select_CString(bp1_yearly_2020_influencing_partner.IsFemale,'pokusila','pokusil')] zabít, ale [bp1_yearly_2020_influencing_partner.GetFaith.HighGodName] nade mnou drží ochrannou ruku a [Select_CString(bp1_yearly_2020_target.IsFemale,'vyvázla','vyvázl')] jsem bez úhony. A teď mi [Select_CString(bp1_yearly_2020_influencing_partner.IsFemale,'její','jeho')] hlava zdobí pracovnu.\n\nBer to jako varování."
 bp1_yearly.2022.a_imprisoned: "#EMP [bp1_yearly_2020_target.Custom2('InsultNoun', ROOT.Char)]#!!"
 bp1_yearly.2022.b_dead: "Cože? Ne! To není možné! [bp1_yearly_2020_influencing_partner.GetTitledFirstNameNoTooltip]..."
 bp1_yearly.2023.t: "Ať žije [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]!"
 bp1_yearly.2023.desc_triumphant: "[bp1_yearly_2020_influencing_partner.GetFirstName] se na mě vítězoslavně usmívá, když k [Select_CString(bp1_yearly_2020_influencing_partner.IsFemale,'ní','němu')] rázně kráčím."
 bp1_yearly.2023.desc_sad: "Rozhlédnu se po prázdné kuchyni. Bez [bp1_yearly_2020_influencing_partner.GetFirstName] po mém boku působí její ozvěna až skličujícím dojmem."
 bp1_yearly.2023.desc_hesitant: "[bp1_yearly_2020_influencing_partner.GetFirstName] při mém příchodu do kuchyně vzhlédne a lehce nakloní hlavu."
 bp1_yearly.2023.desc_killed_target: "[bp1_yearly_2020_influencing_partner.GetTitledFirstName] sáhne za pult a vytáhne cosi, co vypadá jako silně potřísněný pytel z hrubé tkaniny. Jediným prudkým pohybem vysype jeho obsah na rovnou plochu.\n\nPřede mnou skončí useknutá hlava. [bp1_yearly_2020_target.GetTitledFirstName] na mě hledí nehybnýma očima a v břiše mě příjemně zamrazí.\nJaký #EMP nádherný#! den se z toho nakonec vyklubal!"
 bp1_yearly.2023.desc_imprisoned: "Když pomyslím na to, že [bp1_yearly_2020_influencing_partner.GetFirstName] [Select_CString(bp1_yearly_2020_influencing_partner.IsFemale,'skončila','skončil')] v zajetí kvůli [bp1_yearly_2020_target.GetFirstName]...\n\nZavřu oči a snažím se nemyslet na hrůzy, kterým může být [Select_CString(bp1_yearly_2020_influencing_partner.IsFemale,'vystavena','vystaven')] v zajetí.\n\n"
 bp1_yearly.2023.desc_died: "Když pomyslím, že [bp1_yearly_2020_influencing_partner.GetFirstName] [Select_CString(bp1_yearly_2020_influencing_partner.IsFemale,'zemřela','zemřel')] kvůli [bp1_yearly_2020_target.GetTitledFirstName]... Já... já... #EMP dýchám#!.\nNěkolik okamžiků jen o samotě dýchám.\n\n[Select_CString(bp1_yearly_2020_influencing_partner.IsFemale,'Její','Jeho')] smrt #EMP pomstím#!. Přísahám na [ROOT.Char.GetFaith.HighGodNamePossessive] soud, že [bp1_yearly_2020_target.GetFirstName] musí být [Select_CString(bp1_yearly_2020_target.IsFemale,'zastavena','zastaven')].\n\n"
 bp1_yearly.2023.desc_picked_martial: "„Doufám, že [bp1_yearly_2021_new_courtier.GetTitledFirstName] je podle tvého gusta? Svaly z oceli, to ti povídám.“"
 bp1_yearly.2023.desc_picked_learning: "„[bp1_yearly_2021_new_courtier.GetTitledFirstName] je hotová studnice vědomostí! Vždycky jsem ten důvtip [Select_CString(bp1_yearly_2020_influencing_partner.IsFemale,'záviděla','záviděl')].“"
 bp1_yearly.2023.desc_picked_stewardship: "„Doufám, že [bp1_yearly_2021_new_courtier.GetTitledFirstName] ti plní pokladnici! Je to skutečný poklad.“"
 bp1_yearly.2023.desc_picked_diplomacy: "„O tom nepochybuji, [bp1_yearly_2021_new_courtier.GetTitledFirstName] se dokáže [Select_CString(bp1_yearly_2021_new_courtier.IsFemale,'sama','sám')] za sebe výmluvně postavit - já si alespoň vždycky musím dvakrát rozmyslet, s čím souhlasím, aby nakonec nebylo #EMP vždycky#! po [Select_CString(bp1_yearly_2021_new_courtier.IsFemale,'jejím','jeho')].“"
 bp1_yearly.2023.desc_picked_intrigue: "„[bp1_yearly_2021_new_courtier.GetTitledFirstName] umí spřádat pořádně spletité sítě, viď? Já se alespoň vždycky snažím být s [Select_CString(bp1_yearly_2021_new_courtier.IsFemale,'ní','ním')] zadobře.“"
 bp1_yearly.2023.desc_picked_none: "\n\n„Mrzí mě, že se ti žádný z kandidátů nezamlouval, [bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', ROOT.Char)]. Snad alespoň oceníš práci, kterou mi dalo shromáždit ty nejlepší lidi, jaké [ROOT.Char.GetCapitalLocation.GetName] a okolí nabízí.“\n\n[bp1_yearly_2020_influencing_partner.GetTitledFirstName] na mě vyčkávavě hledí."
 bp1_yearly.2023.desc_outro: "\n\n[bp1_yearly_2020_influencing_partner.GetTitledFirstName] na mě mrkne. „A teď je řada na tobě, [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]!“"
 bp1_yearly.2023.desc_outro_sad: "Správné by bylo odměnit [Select_CString(bp1_yearly_2020_influencing_partner.IsFemale,'její','jeho')] odvahu tím, že vyhovím [Select_CString(bp1_yearly_2020_influencing_partner.IsFemale,'její','jeho')] žádosti."
 bp1_yearly.2023.a: "[Select_CString(bp1_yearly_2020_influencing_partner.IsFemale,'Zasloužila','Zasloužil')] sis to, [bp1_yearly_2020_influencing_partner.GetTitledFirstNameNoTooltip]."
 bp1_yearly.2023.a_imprisoned_dead: "Je to čestné rozhodnutí."
 bp1_yearly.2023.b: "Tvé intrikánské schopnosti mě znepokojují, lásko."
 bp1_yearly.2023.b_killer: "Po tomhle tě nemohu nechat volně pobíhat."
 bp1_yearly.2023.c: "Podívej, oba víme, že tohle není správné..."
 bp1_yearly.2023.c_imprisoned_dead: "#EMP Technicky vzato#! ten úkol [bp1_yearly_2020_influencing_partner.GetTitledFirstNameNoTooltip] nedokončil..."
 bp1_yearly.2030.t: "Co má [bp1_yearly_2030_mopey_consort.Custom('GirlBoy')|U] dělat?"
 bp1_yearly.2030.desc: "Když vstoupím do [ROOT.Char.Custom('GetRoom')], všimnu si, že [bp1_yearly_2030_mopey_consort.GetTitledFirstName] působí odtažitě a uzavřeně. Přistoupím blíž a položím [Select_CString(bp1_yearly_2030_mopey_consort.IsFemale,'jí','mu')] ruku na rameno. „Co se děje?“ zeptám se.\n\n[bp1_yearly_2030_mopey_consort.GetTitledFirstName] se na mě chvíli dívá a pak si těžce povzdechne. „Tohle místo je prostě tak... nudné.“\n\nJen pokrčí rameny. „Vůbec nevím, co se sebou dělat.“"
 bp1_yearly.2030.a: "Co se trochu víc stýkat s lidmi?"
 bp1_yearly.2030.a_tt_paranoia: "Ale co když nakonec budou mluvit #EMP o mně...#!"
 bp1_yearly.2030.a_tt_gregarious: "Určitě to dopadne dobře."
 bp1_yearly.2030.b: "Vsadím se, že [bp1_yearly_2030_target_consort.GetTitledFirstNameNoTooltip] by [Select_CString(bp1_yearly_2030_target_consort.IsFemale,'mohla','mohl')] být #EMP zajímavým rozptýlením#!..."
 bp1_yearly.2030.b_tt: "Stačí jen láska?"
 bp1_yearly.2030.c: "Nová dovednost mi vždycky #EMP zvedne#! náladu!"
 bp1_yearly.2030.d: "Upřímně, mám na práci důležitější věci."
 bp1_yearly.2030.tt_success: "Vztah se zlepšil"
 bp1_yearly.2030.tt_failure: "Vztah se zhoršil"
 bp1_yearly.2030.tt_potential_friend: "Začnou se mít o něco raději"
 bp1_yearly.2030.tt_friend: "Padnou si do oka"
 bp1_yearly.2030.tt_best_friend: "Jejich vztah rozkvete"
 bp1_yearly.2030.tt_lover: "Padnou si #EMP opravdu#! do oka"
 bp1_yearly.2030.tt_potential_rival: "Narazí na neshody"
 bp1_yearly.2030.tt_rival: "Začnou se silně nesnášet"
 bp1_yearly.2030.tt_nemesis: "Stanou se úhlavními nepřáteli"
 bp1_yearly.2030.tt_nothing: "Jejich vztah zůstává poněkud vlažný"
 bp1_yearly.2040.t: "Domácí rozepře"
 bp1_yearly.2040.desc: "[bp1_yearly_2040_upset_consort.GetTitledFirstName] vtrhne do [ROOT.Char.Custom('GetRoom')] a vře vzteky jako hrnec na plotně. Ten příval zlosti je až trochu děsivý.\n\n„Tohle je #EMP NEPŘIJATELNÉ#!, jak se [bp1_yearly_2040_target_consort.GetFirstName]... jak se... ach! [bp1_yearly_2040_target_consort.GetFirstNameNoTooltip] je takový #EMP [bp1_yearly_2040_target_consort.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_2040_upset_consort'))]#!!“ [bp1_yearly_2040_upset_consort.GetFirstNameNoTooltip] zuřivě rozhazuje rukama. „Nemůžeš s tím #EMP něco#! udělat?!“"
 bp1_yearly.2040.desc_paranoia: "\n\nVzhledem k tomu, v jakém rozpoložení je [bp1_yearly_2040_upset_consort.GetFirstNameNoTooltip], si ani nemohu být [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')], zda se #EMP vůbec něco#! stalo."
 bp1_yearly.2040.desc_default: "\n\nJe zřejmé, že se mezi nimi něco semlelo."
 bp1_yearly.2040.desc_outro: "Musím našlapovat opatrně."
 bp1_yearly.2040.a: "#EMP Já#! jsem od [bp1_yearly_2040_target_consort.GetFirstNameNoTooltip] o tobě [Select_CString(ROOT.Char.IsFemale,'slyšela','slyšel')] jen samou chválu."
 bp1_yearly.2040.a_tt: "Uklidni situaci."
 bp1_yearly.2040.b: "Víš, [bp1_yearly_2040_target_consort.GetFirstNameNoTooltip] #EMP přece jen#! něco [Select_CString(bp1_yearly_2040_target_consort.IsFemale,'poznamenala','poznamenal')] o tvém [bp1_yearly_2040_target_consort.Custom('RandomBodyFeatureNoun')]..."
 bp1_yearly.2040.b_tt: "Ještě [bp1_yearly_2040_upset_consort.GetFirstNameNoTooltip] popíchni."
 bp1_yearly.2040.c: "[bp1_yearly_2040_upset_consort.GetFirstNameNoTooltip], #EMP uklidni se#!. Běž si promluvit s [bp1_yearly_2040_target_consort.GetFirstNameNoTooltip]."
 bp1_yearly.2040.c_tt: "Všechno se dá vyřešit rozhovorem."
 bp1_yearly.2040.d: "Je mi to #EMP opravdu#! jedno. Vyřešte si to."
 bp1_yearly.2040.d_tt: "Tohle je směšné!"
 bp1_yearly.2040.tt_success: "Situace je vyřešena"
 bp1_yearly.2040.tt_critical_success: "Nedorozumění je nakonec oba rozesměje"
 bp1_yearly.2040.tt_severe_success: "[bp1_yearly_2040_upset_consort.GetFirstName] možná [Select_CString(bp1_yearly_2040_upset_consort.IsFemale,'vzala','vzal')] slova až příliš doslova"
 bp1_yearly.2040.tt_failure: "Situace #EMP není#! vyřešena"
 bp1_yearly.2040.tt_critical_failure: "Situace se ještě vyhrotí"
 bp1_yearly.2040.tt_severe_failure: "Věci naberou ještě horší směr"
 bp1_yearly.2050.t: "Studie o [bp1_yearly_2050_first_consort.Custom('SisterhoodBrotherhood')|U]"
 bp1_yearly.2050.desc_intro: "Během odpolední procházky za mnou přijdou moji partneři."
 bp1_yearly.2050.desc_intro_paranoid: "Během odpolední procházky mě přepadnou moji partneři."
 bp1_yearly.2050.desc: "\n\n„Už nějakou dobu se spolu radíme, [ROOT.Char.GetTitledFirstName].\nChceme společnosti něco vrátit a pod vedením [highest_consort_skill_person.GetFirstName] bychom se spolu s dalšími rádi věnovali "
 bp1_yearly.2050.desc_diplomacy: "studiu diplomacie a umění tasit meč jen tehdy, když slova selžou.“"
 bp1_yearly.2050.desc_martial: "studiu válečnictví a umění přesvědčovat hrubou silou.“"
 bp1_yearly.2050.desc_stewardship: "studiu správy a umění dobře hospodařit s panstvím.“"
 bp1_yearly.2050.desc_intrigue: "studiu intrik a umění nenápadnosti i úskoků.“"
 bp1_yearly.2050.desc_learning: "studiu učenosti a umění psaného slova.“"
 bp1_yearly.2050.desc_duo: "\n\nOba se na sebe podívají a svorně přikývnou."
 bp1_yearly.2050.desc_trio: "\n\nVšichni tři se na sebe podívají a svorně přikývnou."
 bp1_yearly.2050.desc_quartet: "\n\nVšichni čtyři se na sebe podívají a svorně přikývnou."
 bp1_yearly.2050.desc_paranoid: "Pozorně si je měřím. Pokaždé, když [bp1_yearly_2050_first_consort.GetFirstNameNoTooltip] vysloví slovo #EMP my#!, zježí se mi chlupy na zátylku."
 bp1_yearly.2050.a: "Výborně, tohle bude vítané zpestření!"
 bp1_yearly.2050.a_tt: "Cokoli, co prospěje panství!"
 bp1_yearly.2050.b: "Hm, možná bychom mohli najít #EMP kompromis.#!"
 bp1_yearly.2050.b_tt_greedy: "O zlato si tedy řekli pořádné."
 bp1_yearly.2050.c: "Tohle se mi vůbec nelíbí. #EMP Stráže!#!"
 bp1_yearly.2050.c_tt_irritable: "Ta drzost!"
 bp1_yearly.2050.c_tt_paranoid: "Kdo ví, na čem všem dalším se mohou shodnout..."
 bp1_yearly.2050.d: "#EMP Nejsem#! [Select_CString(ROOT.Char.IsFemale,'přesvědčena','přesvědčen')], že z toho vzejde něco dobrého."
 bp1_yearly.2050.d_tt: "Raději je v tom nebudu podporovat."
 bp1_yearly.2060.t: "Na výchovu je třeba celé vesnice"
 bp1_yearly.2060.desc_intro: "V poslední době si nelze nevšimnout, kolik času spolu [bp1_yearly_2060_first_consort.GetTitledFirstName] a [bp1_yearly_2060_second_consort.GetTitledFirstName] tráví. Dnes ráno za mnou společně přijdou a očividně je něco nadchlo.\n\n„[ROOT.Char.GetTitledFirstName]! [bp1_yearly_2060_second_consort.GetFirstNameNoTooltip] a já jsme se sblížili díky společnému zájmu o "
 bp1_yearly.2060.desc_diplomacy: "diplomacii a umění udržovat mezi lidmi dobré vztahy,“"
 bp1_yearly.2060.desc_martial: "válečnictví a bojové umění,“"
 bp1_yearly.2060.desc_stewardship: "hospodářství a správu panství,“"
 bp1_yearly.2060.desc_intrigue: "intriky a umění dvorských úskoků,“"
 bp1_yearly.2060.desc_learning: "učenost a naši společnou lásku k vědění,“"
 bp1_yearly.2060.desc_outro: " dodává nadšeně [bp1_yearly_2060_first_consort.GetFirstNameNoTooltip].\n\nDo řeči vstoupí [bp1_yearly_2060_second_consort.GetFirstNameNoTooltip]: „[bp1_yearly_2060_target_child.GetFirstNameNoTooltip], [bp1_yearly_2060_second_consort.Custom2('RelationToMeShort', bp1_yearly_2060_target_child)], v tomhle směru projevuje velké nadání a rádi bychom se ujali [Select_CString(bp1_yearly_2060_target_child.IsFemale,'jejího','jeho')] vzdělávání!“"
 bp1_yearly.2060.a: "To zní jako skvělý nápad!"
 bp1_yearly.2060.a_paranoid: "Když na tom trváte."
 bp1_yearly.2060.a_tt_paranoid: "Kdo ví, co dalšího [bp1_yearly_2060_target_child.GetFirstNameNoTooltip] ještě vštípí..."
 bp1_yearly.2060.b: "[bp1_yearly_2060_target_child.GetFirstNameNoTooltip] by [Select_CString(bp1_yearly_2060_target_child.IsFemale,'udělala','udělal')] lépe, kdyby se [Select_CString(bp1_yearly_2060_target_child.IsFemale,'zdokonalila','zdokonalil')] v tom, co [Select_CString(bp1_yearly_2060_target_child.IsFemale,'jí','mu')] jde nejhůř: [bp1_yearly_2060_target_child.Custom('LowestSkillFlag')]."
 bp1_yearly.2060.c: "Ne, tohle mi nepřipadá jako dobrý nápad."
 bp1_yearly.2060.tt_success: "Výuka je úspěšná"
 bp1_yearly.2060.tt_critical_success: "[bp1_yearly_2060_target_child.GetFirstNameNoTooltip] nasává vědomosti jako houba"
 bp1_yearly.2060.tt_failure: "Výuka není úspěšná"
 bp1_yearly.2070.t: "Náš dosavadní příběh"
 bp1_yearly.2070.desc: "V poslední době je [bp1_yearly_2070_soulmate.GetFirstName] skleslého ducha a drží se ode mě stranou. Během naší tradiční procházky krajinou kolem domova konečně seberu odvahu a zeptám se, co se děje.\n\n„Tak sis toho [Select_CString(ROOT.Char.IsFemale,'všimla','všiml')], co.“ [bp1_yearly_2070_soulmate.GetFirstNameNoTooltip] zpomalí, až se nakonec zastaví a zahledí se do krajiny. Sluneční paprsky se třpytí na [Select_CString(bp1_yearly_2070_soulmate.IsFemale,'její','jeho')] kůži.\n\n„Miluji tě. A miluji i náš společný život.“ Oči [bp1_yearly_2070_soulmate.GetFirstNameNoTooltip] se zalijí slzami. „Jediné, čeho lituji, je, že jsem ti... vlastně nám... nikdy [Select_CString(bp1_yearly_2070_soulmate.IsFemale,'nedokázala','nedokázal')] dát dítě, které by po nás na tomto světě zůstalo.“\n\nTa slova mi znějí v uších. Celou tu tíhu [Select_CString(bp1_yearly_2070_soulmate.IsFemale,'nesla','nesl')] [Select_CString(bp1_yearly_2070_soulmate.IsFemale,'sama','sám')], [Select_CString(bp1_yearly_2070_soulmate.IsFemale,'má milovaná, silná','můj milovaný, silný')] [bp1_yearly_2070_soulmate.GetFirstName]!"
 bp1_yearly.2070.a: "Drahá duše, [bp1_yearly_2070_soulmate.GetFirstNameNoTooltip] - vždyť celý ten čas jsem [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] být s #EMP tebou#!."
 bp1_yearly.2070.a_tt: "Obejmeš [bp1_yearly_2070_soulmate.GetFirstNameNoTooltip]."
 bp1_yearly.2070.b: "Takový zkrátka byl [ROOT.Char.GetFaith.HighGodNamePossessive] záměr."
 bp1_yearly.2070.b_tt: "[bp1_yearly_2070_soulmate.GetFirstNameNoTooltip] v tom nachází jistou útěchu."
 bp1_yearly.2070.c: "Oba víme, že je to tak nejlepší."
 bp1_yearly.2070.c_tt: "Tenhle svět je strašné místo."
