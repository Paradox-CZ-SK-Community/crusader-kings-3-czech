l_polish:
 bp1_house_feud.0001.t: "Zatracený rod"
 bp1_house_feud.0001.desc: "[house_feud_rival.GetTitledFirstName] a všechna ta podlost — snáším to už příliš dlouho.\n\nNěkdy sním o tom, že rod [house_feud_rival.GetHouse.GetBaseName] zadupu do země a tu [house_feud_rival.Custom2('InsultAdjective', ROOT.Char)] rodinu vymažu z dějin i se vším utrpením, které mi způsobila.\n\nLežím vzhůru, [Select_CString(ROOT.Char.IsFemale,'znepokojená','znepokojený')] vlastní nenávistí, ale kdo jiný si ji zaslouží víc než [house_feud_rival.GetFirstNameNoTooltip]?"
 bp1_house_feud.0001.target: "\n\nMohou být ty zvěsti pravdivé? Začalo to snad už dávno kvůli tomu, čemu se říká [relation.Custom('GetFamilyFeudShort')]?"
 bp1_house_feud.0001.a: "Učiním z toho své životní poslání."
 bp1_house_feud.0001.b: "Svou energii snad dokážu využít lépe..."
 bp1_house_feud.0002.t: "Dynastická soudržnost"
 bp1_house_feud.0002.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))|U] [house_feud_victim.GetTitledFirstName] si neustále stěžuje na podlost [Select_CString(house_feud_attacker.IsFemale,'své sokyně','svého soka')], [house_feud_attacker.GetTitledFirstName].\n\nPokaždé, když se setkáme, přijde řeč na „[SCOPE.Custom('VenomousCreature')|U] z rodu [house_feud_attacker.GetHouse.GetBaseName]“ a také naléhání, abych [Select_CString(ROOT.Char.IsFemale,'poradila','poradil')] či [Select_CString(ROOT.Char.IsFemale,'pomohla','pomohl')] s [Select_CString(house_feud_attacker.IsFemale,'jejím','jeho')] poražením."
 bp1_house_feud.0002.a: "Tohle vypadá na rodinnou záležitost."
 bp1_house_feud.0002.b: "Jak se [house_feud_attacker.GetFirstNameNoTooltip] opovažuje napadat [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))]?"
 bp1_house_feud.0002.c: "[house_feud_victim.GetFirstNameNoTooltip] si musí své problémy vyřešit [Select_CString(house_feud_victim.IsFemale,'sama','sám')]."
 bp1_house_feud.0003.t: "Oko za oko"
 bp1_house_feud.0003.desc: "Přecházím před [ROOT.Char.Custom('ResidenceBuilding')] sem a tam a nedokážu zahnat vzpomínky na [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))], [house_feud_victim.GetTitledFirstName]. [house_feud_attacker.GetTitledFirstName] nám [Select_CString(house_feud_victim.IsFemale,'ji','ho')] [Select_CString(house_feud_attacker.IsFemale,'vyrvala','vyrval')] příliš brzy... ta odporná bestie z rodu [house_feud_attacker.GetHouse.GetBaseName]!\n\nMá čest může být obnovena a [house_feud_victim.GetFirstNameNoTooltip] [Select_CString(house_feud_victim.IsFemale,'pomstěna','pomstěn')] jediným způsobem..."
 bp1_house_feud.0003.a: "Prokletí na rod [house_feud_attacker.GetHouse.GetBaseNameNoTooltip]!"
 bp1_house_feud.0003.b: "[house_feud_attacker.GetFirstNameNoTooltip] pošlu do [ROOT.Char.GetFaith.NegativeAfterLife] vlastní rukou!"
 bp1_house_feud.0003.c: "Pomsta mi [house_feud_victim.GetFirstNameNoTooltip] nevrátí."
 bp1_house_feud.0004.t: "[Select_CString(house_feud_rival.IsFemale,'Zděděná nepřítelkyně','Zděděný nepřítel')]"
 bp1_house_feud.0004.desc: "Po smrti [old_house_head.GetTitledFirstNamePossessiveRegnal] přechází vedení rodu [ROOT.Char.GetHouse.GetName] na mě a s ním i odpovědnost za ochranu celé rodiny.\n\nNepřátelství mezi [house_feud_rival.GetTitledFirstName] a [old_house_head.GetFirstName] nebylo žádným tajemstvím; nenávist, kterou [old_house_head.GetFirstNameNoTooltip] [Select_CString(old_house_head.IsFemale,'chovala','choval')] k potomstvu rodu [house_feud_rival.GetHouse.GetBaseName], prostupovala každodenním životem [old_house_head.GetPrimaryTitle.GetAdjectiveNoTooltip] [old_house_head.Custom('GetCourt')].\n\nNevím, zda tyto staré spory nechat upadnout v zapomnění, nebo respektovat přání [Select_CString(old_house_head.IsFemale,'zesnulé','zesnulého')] [old_house_head.GetFirstNameNoTooltip]..."
 bp1_house_feud.0004.a: "Rod [ROOT.Char.GetHouse.GetBaseNameNoTooltip] na své nepřátele nezapomíná."
 bp1_house_feud.0004.b: "Nenávist [old_house_head.GetFirstNamePossessiveNoTooltip] zemřela spolu s [Select_CString(old_house_head.IsFemale,'ní','ním')]."
 bp1_house_feud.0005.t: "Vábení vendety"
 bp1_house_feud.0005.desc: "Smrt [house_feud_victim.GetFirstNamePossessive] mi v srdci zanechala prázdnotu, která se znovu bolestně otevírá pokaždé, když pomyslím na [Select_CString(house_feud_attacker.IsFemale,'odpornou vražedkyni','odporného vraha')] a na spravedlnost, která dosud nebyla vykonána.\n\nDen za dnem ovládá mé myšlenky krutá logika pomsty a každou noc ji přiživují neklidné sny, v nichž vidím [house_feud_attacker.GetFirstName] i celý rod [house_feud_attacker.GetHouse.GetBaseName] zmítané stejným zármutkem, jaký nyní sužuje mou rodinu..."
 bp1_house_feud.0005.a: "„[ROOT.Char.GetHouse.GetMotto]!“"
 bp1_house_feud.0005.b: "[house_feud_attacker.GetFirstNameNoTooltip] tohle neprojde."
 bp1_house_feud.0005.c: "Nic mi [house_feud_victim.GetFirstNameNoTooltip] nevrátí..."
 bp1_house_feud.0005.c.rival: "[ROOT.Char.GetFaith.HighGodName] zlo potrestá."
 bp1_house_feud.0006.t: "[house_feud_claim.GetBaseNameNoTierPossessiveNoTooltip] [Select_CString(house_feud_rival.IsFemale,'pravá','pravý')] [house_feud_rival.GetTitleAsNameNoTooltip]"
 bp1_house_feud.0006.desc: "Před očima se mi znovu vynoří samolibý úšklebek [house_feud_rival.GetTitledFirstNamePossessive]. Vyskočím na nohy, chabě se vymluvím a vzdálím se od ohně, abych se [Select_CString(ROOT.Char.IsFemale,'procházela','procházel')] tmou.\n\nNemohu dostat toho [house_feud_rival.Custom2('InsultNoun', ROOT.Char)] z hlavy; představa, že [house_feud_rival.GetFirstNameNoTooltip] a celý [Select_CString(house_feud_rival.IsFemale,'její','jeho')] rod zůstávají bez odporu a škodolibě se radují v [house_feud_rival.GetCapitalLocation.GetName]...\n\n"
 bp1_house_feud.0006.higher: "Ne [ROOT.Char.GetFaith.HighGodName]! #EMP Já#! jsem [Select_CString(ROOT.Char.IsFemale,'právoplatná vládkyně','právoplatný vládce')] [house_feud_claim.GetBaseNameNoTier]."
 bp1_house_feud.0006.same: "Nenajdu snad klid, dokud [house_feud_claim.GetBaseNameNoTier] nebude patřit mně?"
 bp1_house_feud.0006.multi: "[house_feud_claim.GetBaseNameNoTier] i další země, na nichž se [house_feud_rival.GetTitledFirstName] [Select_CString(house_feud_rival.IsFemale,'usadila','usadil')], musí být mé."
 bp1_house_feud.0006.previous: "Země [house_feud_previous.GetTitledFirstNamePossessive] se nám vrátí."
 bp1_house_feud.0006.a: "Rod [house_feud_rival.GetHouse.GetBaseNameNoTooltip] musí skončit."
 bp1_house_feud.0006.b: "Problém je [house_feud_rival.GetFirstNameNoTooltip]."
 bp1_house_feud.0006.c: "Dej si [ROOT.Char.Custom('RegionalAlcoholicDrink')] a mysli na něco jiného..."
 bp1_house_feud.0007.t: "Doutnající zášť v zajetí"
 bp1_house_feud.0007.house_arrest: "Být [Select_CString(ROOT.Char.IsFemale,'zavřená','zavřený')] v komnatách [house_feud_attacker.GetTitledFirstNamePossessive] je sice lepší než žalář, ale takhle se žít nedá.\n\nJídlo je mizerné — zábava ještě horší — zato času pěstovat nenávist vůči [Select_CString(house_feud_attacker.IsFemale,'své věznitelce','svému vězniteli')] mám víc než dost."
 bp1_house_feud.0007.dungeon: "Být [Select_CString(ROOT.Char.IsFemale,'zavřená','zavřený')] v žaláři [house_feud_attacker.GetTitledFirstNamePossessive], kde mi společnost dělá jen vzdálený ruch [house_feud_attacker.GetCapitalLocation.GetNameNoTooltip] a občasné zachrochtání [house_feud_attacker.GetCulture.GetNameNoTooltip] stráže, mi dává víc než dost času pěstovat nenávist vůči [Select_CString(house_feud_attacker.IsFemale,'své věznitelce','svému vězniteli')]."
 bp1_house_feud.0007.camp: "[house_feud_attacker.Custom('GetCourt')|U] [house_feud_attacker.GetTitledFirstNamePossessive] je místo, kde jsem [Select_CString(ROOT.Char.IsFemale,'vydaná','vydaný')] napospas živlům a posměškům stráží. Času pěstovat nenávist vůči [Select_CString(house_feud_attacker.IsFemale,'své věznitelce','svému vězniteli')] mám víc než dost."
 bp1_house_feud.0007.desc: "\n\n[house_feud_attacker.GetFirstNameNoTooltip] mě drží v zajetí mnohem déle, než je únosné, a za tím otálením dokážu vidět jen malichernost nebo rozmar. Už nevím kudy kam..."
 bp1_house_feud.0007.a: "Tenhle prokletý rod zničím."
 bp1_house_feud.0007.b: "Jednoho dne bude v podobných okovech [house_feud_attacker.GetFirstNameNoTooltip]."
 bp1_house_feud.0007.c: "Možná k tomu má [house_feud_attacker.GetFirstNameNoTooltip] dobrý důvod..."
 bp1_house_feud.0008.t: "Nespravedlivé uvěznění"
 bp1_house_feud.0008.desc: "Z kuchyně [ROOT.Char.Custom('ResidenceBuilding')] se line vůně bylinek a vydatného dušeného pokrmu, ale já nedokážu přestat myslet na nešťastný úděl [house_feud_victim.GetFirstName]."
 bp1_house_feud.0008.house_arrest: "\n\nDoufám, že [Select_CString(house_feud_attacker.IsFemale,'věznitelka','věznitel')] [house_feud_attacker.GetTitledFirstName] dává [house_feud_victim.GetFirstNameNoTooltip] v domácím vězení pořádně najíst — ale nikdo z rodu [ROOT.Char.GetHouse.GetBaseName] by neměl žít pod stráží!"
 bp1_house_feud.0008.dungeon: "\n\nPomyšlení na [house_feud_victim.GetFirstNameNoTooltip], [Select_CString(house_feud_victim.IsFemale,'zavřenou','zavřeného')] v [house_feud_attacker.GetPrimaryTitle.GetAdjectiveNoTooltip] žaláři jako nějaké podřadné zvíře... člen rodu [ROOT.Char.GetHouse.GetBaseName]!"
 bp1_house_feud.0008.camp: "\n\nPomyšlení na [house_feud_victim.GetFirstNameNoTooltip], [Select_CString(house_feud_victim.IsFemale,'spoutanou','spoutaného')] jako nějaké podřadné zvíře v [house_feud_attacker.GetTitledFirstNamePossessive] [ROOT.Char.Custom('GetCourt')]... člen rodu [ROOT.Char.GetHouse.GetBaseName]!"
 bp1_house_feud.0008.closing: "\n\nPři pomyšlení na dlouhé měsíce, které [house_feud_victim.GetFirstNameNoTooltip] [Select_CString(house_feud_victim.IsFemale,'strávila','strávil')] v zajetí, ve mně vře hněv. [house_feud_attacker.GetFirstNameNoTooltip] [Select_CString(house_feud_attacker.IsFemale,'zašla','zašel')] příliš daleko, ať už je [house_feud_attacker.GetTitleAsNameNoTooltip], nebo ne!"
 bp1_house_feud.0008.a: "Na tohle zacházení rodu [house_feud_attacker.GetHouse.GetBaseNameNoTooltip] se nezapomene."
 bp1_house_feud.0008.b: "[house_feud_attacker.GetFirstNameNoTooltip] za to zaplatí."
 bp1_house_feud.0008.c: "Mohu se jen modlit za propuštění [house_feud_victim.GetFirstNameNoTooltip]."
 bp1_house_feud.0009.t: "[Select_CString(old_house_head.IsFemale,'Pomstychtivá','Pomstychtivý')] [old_house_head.Custom2('RelationToMeShort', ROOT.Char)|U]"
 bp1_house_feud.0009.adult: "[ROOT.Char.GetCapitalLocation.GetName] stále truchlí za [old_house_head.GetFirstName]. Venku před [ROOT.Char.Custom('ResidenceBuilding')] mohu uniknout truchlícím, jejich neustálému bědování nad jménem „[old_house_head.GetTitledFirstName]“ a zůstat o samotě se svými myšlenkami.\n\nPomyšlení, že [old_house_head.GetFirstNameNoTooltip] [old_house_head.GetDeathReasonHideKiller] vinou [house_feud_rival.GetTitledFirstName], toho [house_feud_rival.Custom2('InsultNoun', ROOT.Char)] z rodu [house_feud_rival.GetHouse.GetBaseName]..."
 bp1_house_feud.0009.child: "Postupem času se o [old_house_head.GetFirstName] dozvídám čím dál víc, včetně toho, jak [old_house_head.GetFirstNameNoTooltip] [old_house_head.GetDeathReasonHideKiller] vinou [house_feud_rival.GetTitledFirstName]..."
 bp1_house_feud.0009.reciprocate: "[house_feud_rival.GetFirstNameNoTooltip] pozná cenu své vendety!"
 bp1_house_feud.0009.new: "Osud je krutý!"
 bp1_house_feud.0009.closing: "\n\nMá-li na tomto světě existovat spravedlnost a má-li být obnovena čest rodu [ROOT.Char.GetHouse.GetBaseName], možná ji budu muset vykonat vlastní rukou."
 bp1_house_feud.0009.a: "Jméno „[house_feud_rival.GetHouse.GetBaseNameNoTooltip]“ bude ode dneška prokletím."
 bp1_house_feud.0009.b: "Jednoho dne s [house_feud_rival.GetFirstNameNoTooltip] skoncuji."
 bp1_house_feud.0009.c: "Už bylo prolito dost krve rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip]..."
 bp1_house_feud.0010.t: "Neodpustitelné zacházení"
 bp1_house_feud.0010.torture: "Ta bolest byla nesnesitelná, nekonečná... [Select_CString(ROOT.Char.IsFemale,'Nečekala','Nečekal')] bych od [house_feud_attacker.GetTitledFirstName] takové barbarství, natož takové zacházení s člověkem mého postavení!\n\n"
 bp1_house_feud.0010.blinding: "Se ztrátou zraku jsem se stále úplně [Select_CString(ROOT.Char.IsFemale,'nesmířila','nesmířil')]... možná jsem [house_feud_attacker.GetTitledFirstName] [Select_CString(ROOT.Char.IsFemale,'podcenila','podcenil')]... [Select_CString(ROOT.Char.IsFemale,'Plakala','Plakal')] bych nad tím, jak naprosto [Select_CString(ROOT.Char.IsFemale,'bezmocná','bezmocný')] teď jsem, kdyby mi to bolest dovolila.\n\n"
 bp1_house_feud.0010.castration: "Bolest po tom... zacházení... stále nepolevuje a každý pohyb mi připomíná, o co jsem přišel. Jediné, co mě dokáže rozptýlit, je plánování pomsty na [house_feud_attacker.GetTitledFirstName].\n"
 bp1_house_feud.0010.house_arrest: "Mohu být [Select_CString(ROOT.Char.IsFemale,'ráda','rád')], že nejsem v žaláři rodu [house_feud_attacker.GetHouse.GetBaseNameNoTooltip], ale za těchto okolností je to jen slabá útěcha. "
 bp1_house_feud.0010.dungeon: "Tady dole, v téhle vlhké díře... Jak hluboko jsem [Select_CString(ROOT.Char.IsFemale,'klesla','klesl')] rukou toho ničemy z rodu [house_feud_attacker.GetHouse.GetBaseNameNoTooltip]."
 bp1_house_feud.0010.free: "Jsem opět na svobodě, ale už nikdy nebudu jako dřív. Jen [house_feud_attacker.GetFirstNameNoTooltip] ví, oč všechno mě [Select_CString(house_feud_attacker.IsFemale,'připravila','připravil')]. "
 bp1_house_feud.0010.a: "Všichni budou litovat, že se vůbec narodili."
 bp1_house_feud.0010.b: "Rod [house_feud_existing.GetHouse.GetBaseNameNoTooltip] konečně narazil na sobě rovného soupeře."
 bp1_house_feud.0010.c: "[house_feud_attacker.GetFirstNameNoTooltip] za to nějak zaplatí."
 bp1_house_feud.0010.d: "Násilí už mám dost..."
 bp1_house_feud.0011.t: "[Select_CString(house_feud_victim.IsFemale,'Týraná','Týraný')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))|U]"
 bp1_house_feud.0011.torture: "Jen stěží snáším vyprávění o tom, jak [house_feud_attacker.GetTitledFirstName] [Select_CString(house_feud_attacker.IsFemale,'mučila','mučil')] [house_feud_victim.GetFirstName].\n\n"
 bp1_house_feud.0011.blinding: "Stále nedokážu plně vstřebat zprávu o tom, že [house_feud_attacker.GetTitledFirstName] [Select_CString(house_feud_attacker.IsFemale,'nechala','nechal')] [house_feud_victim.GetTitledFirstName] #EMP oslepit#!.\n\n"
 bp1_house_feud.0011.castration: "Zpráva o... #EMP kastraci#! [house_feud_victim.GetFirstName] visí nad [ROOT.Char.Custom('GetCourt')] jako temný mrak.\n\n"
 bp1_house_feud.0011.house_arrest: "Jedinou útěchou je, že [house_feud_victim.GetFirstNameNoTooltip] je ušetřen [house_feud_attacker.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] [house_feud_attacker.Custom('GetDungeon')]..."
 bp1_house_feud.0011.dungeon: "A aby toho nebylo málo, [house_feud_victim.GetFirstNameNoTooltip] musí snášet i [house_feud_attacker.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] [house_feud_attacker.Custom('GetDungeon')]..."
 bp1_house_feud.0011.camp: "A aby toho nebylo málo, [house_feud_victim.GetFirstNameNoTooltip] musí živořit i ve smrdutém [house_feud_attacker.Custom('GetDungeon')]..."
 bp1_house_feud.0011.free: "Ačkoli je [house_feud_victim.GetFirstNameNoTooltip] nyní na svobodě, následky tohoto zacházení si ponese až do konce života."
 bp1_house_feud.0011.closing: "\n\nMohu opravdu nechat takovou hanebnost rodu [house_feud_attacker.GetHouse.GetBaseName] bez odezvy?"
 bp1_house_feud.0011.a: "Celý rod [house_feud_attacker.GetHouse.GetBaseNameNoTooltip] za to zaplatí."
 bp1_house_feud.0011.b: "[house_feud_attacker.GetFirstNameNoTooltip] bude trpět."
 bp1_house_feud.0011.c: "Nedá se nic dělat..."
 bp1_house_feud.0012.t: "Paroháč"
 bp1_house_feud.0012.t.female: "Paroháčka"
 bp1_house_feud.0012.desc: "Vědomí, že [house_feud_spouse.GetFirstName] má tělesný poměr s tím [house_feud_attacker.Custom2('InsultNoun', ROOT.Char)], [house_feud_attacker.GetTitledFirstName], mě sžírá.\n\nZa zády se mi smějí, zatímco [house_feud_spouse.GetFirstNameNoTooltip] si užívá pohodlí mého [ROOT.Char.Custom('ResidenceBuilding')]..."
 bp1_house_feud.0012.good: "\n\nJak mi to [house_feud_spouse.GetFirstNameNoTooltip] [Select_CString(house_feud_spouse.IsFemale,'mohla','mohl')] udělat?"
 bp1_house_feud.0012.bad: "\n\nKéž bych si toho [house_feud_spouse.Custom2('InsultNoun', ROOT.Char)] nikdy [Select_CString(ROOT.Char.IsFemale,'nevzala','nevzal')]..."
 bp1_house_feud.0012.a: "S rodem [house_feud_attacker.GetHouse.GetBaseNameNoTooltip] se musí něco udělat."
 bp1_house_feud.0012.b: "Kašlu na rod [house_feud_existing.GetHouse.GetBaseNameNoTooltip], tohle je skandál!"
 bp1_house_feud.0012.c: "[house_feud_attacker.GetFirstNameNoTooltip] zabiju."
 bp1_house_feud.0012.d: "Takhle si nijak nepomáhám..."
 bp1_house_feud.0013.t: "[house_feud_spouse.Custom2('RelationToMePossessive', ROOT.Char)|U] čest"
 bp1_house_feud.0013.desc: "Zvěsti o nevěře [house_feud_spouse.GetTitledFirstNamePossessive] se šíří a já si nemohu pomoci — za úsměvem každého sluhy i každého [ROOT.Char.Custom('GetCourtier')] vidím skryté pohrdání.\n\n[house_feud_attacker.GetTitledFirstName] si [Select_CString(house_feud_attacker.IsFemale,'udělala','udělal')] posměch ze mě i z mé rodiny..."
 bp1_house_feud.0013.a: "Celý rod [house_feud_attacker.GetHouse.GetBaseNameNoTooltip] za to zaplatí."
 bp1_house_feud.0013.b: "Vedle [house_feud_attacker.GetFirstNameNoTooltip] vypadá rod [house_feud_existing.GetHouse.GetBaseNameNoTooltip] jako ztělesnění ctnosti!"
 bp1_house_feud.0013.c: "[house_feud_attacker.GetFirstNameNoTooltip] bude trpět."
 bp1_house_feud.0013.d: "Tohle už je minulost..."
 bp1_house_feud.0014.t: "[ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('house_feud_victim'))|U] hrdost"
 bp1_house_feud.0014.desc: "[house_feud_victim.GetTitledFirstName] si [Select_CString(house_feud_victim.IsFemale,'nedokázala','nedokázal')] udržet pořádek ve vlastní rodině; pletky [house_feud_victim.Custom2('RelationToMeShort', SCOPE.sC('house_feud_spouse'))] [house_feud_spouse.GetTitledFirstNamePossessive] s [house_feud_attacker.Custom2('InsultAdjective', ROOT.Char)] [house_feud_attacker.GetTitledFirstName] přinášejí naší rodině hanbu a posměch...\n\nMezi zaprášenými nádobami od [ROOT.Char.Custom('RegionalAlcoholicDrink')] mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] tlumeným hlasem všechno vysvětluje. „Musíme s tím [house_feud_attacker.Custom2('InsultNoun', SCOPE.sC('house_feud_victim'))] něco udělat, [house_feud_victim.Custom2('RelationToMeShort', ROOT.Char)]! Tohle nemůžeme nechat bez odezvy!“"
 bp1_house_feud.0014.a: "Rod [house_feud_attacker.GetHouse.GetBaseNameNoTooltip] překročil všechny meze."
 bp1_house_feud.0014.b: "[house_feud_attacker.GetFirstNameNoTooltip] tohle nesmí projít."
 bp1_house_feud.0014.c: "Lepší bude odpustit a zapomenout..."
 bp1_house_feud.0100.t: "$story_cycle_house_feud_title$: Nerovná zášť"
 bp1_house_feud.0100.desc: "Nevěstí nic dobrého, že ten ničema [house_feud_rival.GetFirstName] zůstává [house_feud_rival.GetTitleAsNameNoTooltip], zatímco já jsem [Select_CString(ROOT.Char.IsFemale,'pouhá','pouhý')] [ROOT.Char.GetTitleAsNameNoTooltip]... Bránit rodinu před tak mocnými nepřáteli vyžaduje spoustu pozornosti.\n\n[relation.Custom('GetFamilyFeudShortFlavor')|U] bylo nespravedlivé, ale možná nám tahle rozepře přináší víc potíží, než za kolik stojí..."
 bp1_house_feud.0100.a: "I [house_feud_rival.GetTitleAsNameNoTooltip] se musí zodpovídat spravedlnosti."
 bp1_house_feud.0100.b: "Trvá to už příliš dlouho..."
 bp1_house_feud.0110.t: "$story_cycle_house_feud_title$: Nerovní protivníci"
 bp1_house_feud.0110.desc: "O podlosti [house_feud_rival.GetTitledFirstName] i celého rodu [house_feud_rival.GetHouse.GetBaseName] není pochyb, ale sluší se vůbec rodině [ROOT.Char.GetTitleAsNameNoTooltip] hašteřit s rodinou [house_feud_rival.GetTitleAsNameNoTooltip]?\n\n[relation.Custom('GetFamilyFeudShortFlavor')] je neodpustitelné, ale máme se opravdu ponižovat a marnit čas s tak #EMP bezvýznamnými#! lidmi?"
 bp1_house_feud.0110.a: "[house_feud_rival.GetTitleAsNameNoTooltip] nebo [ROOT.Char.GetTitleAsNameNoTooltip], spravedlnosti musí být učiněno zadost."
 bp1_house_feud.0110.b: "Ano, [house_feud_rival.GetFirstNameNoTooltip] mi za tu námahu nestojí..."
 bp1_house_feud.0200.t: "$story_cycle_house_feud_title$: Zoufalá opatření"
 bp1_house_feud.0200.desc: "Náš spor s rodem [house_feud_rival.GetHouse.GetBaseName] je pohroma; pomstě nejsme o nic blíž a jejich křivdy jen pokračují.\n\nChceme-li tu vendetu skutečně ukončit, možná nadešel čas zasadit poslední ránu..."
 bp1_house_feud.0200.a: "Čas [house_feud_rival.GetTitledFirstNamePossessiveNoTooltip] nadešel."
 bp1_house_feud.0200.b: "Dny [house_feud_target.GetTitledFirstNamePossessiveNoTooltip] jsou sečteny."
 bp1_house_feud.0200.c: "Mám s nimi jiné plány."
 bp1_house_feud.0200.d: "Ne, tohle byla chyba..."
 bp1_house_feud.0210.t: "$story_cycle_house_feud_title$: Krutá daň"
 bp1_house_feud.0210.desc: "K pomstě na rodu [house_feud_rival.GetHouse.GetBaseName] máme stále daleko; od začátku našeho sporu se [house_feud_rival.GetTitledFirstName] a celá [Select_CString(house_feud_rival.IsFemale,'její','jeho')] zmijí sebranka dopustili jen dalších křivd.\n\nObčas přemýšlím, jestli jsme své nepřátele nepodcenili a zda by nebylo lepší smířit se se ztrátami, než bude pozdě."
 bp1_house_feud.0210.recent: "[house_feud_recent_death.GetTitledFirstName] by si možná [Select_CString(house_feud_recent_death.IsFemale,'myslela','myslel')] totéž..."
 bp1_house_feud.0210.a: "Ne, ještě jim ukážeme!"
 bp1_house_feud.0210.b: "Dost... dost!"
 bp1_house_feud.0220.t: "$story_cycle_house_feud_title$: Meze zášti"
 bp1_house_feud.0220.desc: "Naše oprávněné kroky proti rodu [house_feud_rival.GetHouse.GetBaseName] nezůstaly bez povšimnutí; téměř jistě už litují toho, čemu se říká [relation.Custom('GetFamilyFeudShort')].\n\nTaková stvoření si sice nezaslouží soucit ani slitování, ale původní křivda už byla oplacena; nekonečně tenhle konflikt protahovat nemusí být v našem zájmu."
 bp1_house_feud.0220.recent: "Možná už krev [house_feud_recent_kill.GetTitledFirstNamePossessive] stačí..."
 bp1_house_feud.0220.a: "Ne, teprve začínáme."
 bp1_house_feud.0220.b: "Je konec."
 bp1_house_feud.0300.t: "$story_cycle_house_feud_title$: Únavná rozepře"
 bp1_house_feud.0300.desc: "Celý rod [ROOT.Char.GetHouse.GetBaseNameNoTooltip] zná příběh o počátku našeho sporu s rodem [house_feud_rival.GetHouse.GetBaseNameNoTooltip]; o tom, jak [relation.Custom('GetFamilyFeudLongFlavor')].\n\nTen příběh už je pořádně omšelý. Opravdu máme tuhle vendetu vést navěky kvůli něčemu, čemu se říká [relation.Custom('GetFamilyFeudShort')], a co se stalo před lety?"
 bp1_house_feud.0300.a: "Rod [ROOT.Char.GetHouse.GetBaseNameNoTooltip] na své nepřátele nezapomíná."
 bp1_house_feud.0300.b: "Trvá to už příliš dlouho."
 bp1_house_feud.0410.t: "$story_cycle_house_feud_title$: Ze všech stran hrozby"
 bp1_house_feud.0410.desc: "„Prosím!“ kňourá [house_feud_victim.GetTitledFirstName]. „Tahle šílená zášť musí skončit! Bojím se chodit #EMP kamkoli#! a stačí jen zaslechnout jméno rodu [house_feud_rival.GetHouse.GetBaseName] a už sebou trhnu!“\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))|U] je očividně [Select_CString(house_feud_victim.IsFemale,'otřesená','otřesený')]... Musím volit mezi nebezpečím, které hrozí mé rodině, a nutností dát [house_feud_rival.GetTitledFirstName] pořádnou lekci. "
 bp1_house_feud.0410.a: "Máš pravdu... je načase s tím skončit."
 bp1_house_feud.0410.b: "Ne, musíme dokončit, co jsme začali."
 bp1_house_feud.0420.t: "$story_cycle_house_feud_title$: [house_feud_liege.GetTitleAsNamePossessiveNoTooltip] výzva"
 bp1_house_feud.0420.desc: "Bylo mi dáno jasně najevo, že můj lenní pán, [house_feud_liege.GetTitledFirstName], neschvaluje spor mé rodiny s [house_feud_rival.GetTitledFirstName] a rodem [house_feud_rival.GetHouse.GetBaseName] a přeje si, aby byly tyto [house_feud_liege.GetPrimaryTitle.GetAdjectiveNoTooltip] rozepře urovnány.\n\nKdo je [house_feud_liege.GetFirstNameNoTooltip], aby požadoval, že spravedlnosti nemá být učiněno zadost? Na druhou stranu možná není moudré dál zvyšovat napětí, zvlášť když jde o [house_feud_liege.GetTitleAsNameNoTooltip]..."
 bp1_house_feud.0420.a: "[house_feud_rival.GetTitledFirstNameNoTooltip] nikdy neodpustím."
 bp1_house_feud.0420.b: "Dobrá tedy..."
 bp1_house_feud.0500.t: "$story_cycle_house_feud_title$: Terče hněvu"
 bp1_house_feud.0500.desc: "Zpočátku jsem tomu [Select_CString(ROOT.Char.IsFemale,'nevěřila','nevěřil')], ale když poslouchám klepy na [ROOT.Char.Custom('GetCourt')], začínám být [Select_CString(ROOT.Char.IsFemale,'přesvědčená','přesvědčený')], že [house_feud_rival.GetTitledFirstName] chce mou hlavu, a to všechno kvůli něčemu, čemu se říká [relation.Custom('GetFamilyFeudShort')].\n\nKvůli spojení se mnou je pro [house_feud_rival.GetFirstNameNoTooltip] lovnou zvěří celý rod [ROOT.Char.GetHouse.GetName] a tahle nenávist se od [Select_CString(house_feud_rival.IsFemale,'ní','něj')] rozšířila na celou [Select_CString(house_feud_rival.IsFemale,'její','jeho')] [house_feud_rival.Custom2('InsultAdjective', ROOT.Char)] rodinu."
 bp1_house_feud.0500.a: "Rod [house_feud_rival.GetHouse.GetBaseNameNoTooltip] toho bude litovat."
 bp1_house_feud.0500.b: "Mám důležitější starosti."
 bp1_house_feud.0501.t: "$story_cycle_house_feud_title$: Soupeření s rodem [house_feud_attacker.GetHouse.GetBaseNameNoTooltip]"
 bp1_house_feud.0501.reciprocating: "[house_feud_attacker.GetFirstName], [house_feud_attacker.Custom2('InsultNoun', ROOT.Char)], [Select_CString(house_feud_attacker.IsFemale,'odpověděla','odpověděl')] na veřejné nepřátelství naší rodiny nepřátelstvím vlastním — ubohou a pomlouvačnou reakcí na naše oprávněné křivdy."
 bp1_house_feud.0501.new: "Dozvídám se, že [house_feud_attacker.GetTitledFirstName], [house_feud_attacker.Custom2('InsultNoun', ROOT.Char)], [Select_CString(house_feud_attacker.IsFemale,'přísahala','přísahal')], že rod [ROOT.Char.GetHouse.GetBaseName] bude navěky nepřítelem [Select_CString(house_feud_attacker.IsFemale,'její','jeho')] rodiny."
 bp1_house_feud.0501.desc: "\n\nHa, kdo by si pomyslel, že [relation.Custom('GetFamilyFeudShortFlavor')] skutečně tak rozčílí rod [house_feud_attacker.GetDynastyHouseName]!"
 bp1_house_feud.0501.a: "Ach, ten pocit je #EMP vzájemný#!!"
 bp1_house_feud.0501.b: "Zdá se, že máme nového nepřítele."
 bp1_house_feud.0501.c: "Jak dětinské."
 bp1_house_feud.0501.c.busy: "Musíme se soustředit na rod [house_feud_existing.GetBaseNameNoTooltip]."
 bp1_house_feud.0501.c.existing: "Pošetilé. Velmi pošetilé."
 bp1_house_feud.0502.t: "$story_cycle_house_feud_title$: Napětí polevuje"
 bp1_house_feud.0502.desc: "Uvolnění napětí mezi mnou a [house_feud_attacker.GetTitledFirstName], je-li něco takového vůbec možné, zřejmě potvrzuje, že [house_feud_attacker.GetFirstNameNoTooltip] [Select_CString(house_feud_attacker.IsFemale,'zanechala','zanechal')] vendety proti rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 bp1_house_feud.0502.another: "\n\nDoslechl jsem se, že [house_feud_attacker.GetFirstNameNoTooltip] nyní zcela pohltila nenávist k [house_feud_new.GetHeadOfHouse.GetTitledFirstName] a rodu [house_feud_new.GetBaseName]."
 bp1_house_feud.0502.peace: "\n\nJe těžké tomu uvěřit, ale [Select_CString(ROOT.Char.IsFemale,'ráda','rád')] bych se konečně [Select_CString(ROOT.Char.IsFemale,'zbavila','zbavil')] obav z hrozby rodu [house_feud_attacker.GetHouse.GetBaseNameNoTooltip]."
 bp1_house_feud.0502.a: "Příliš málo a příliš pozdě."
 bp1_house_feud.0502.b: "Možná #EMP opravdu#! nadešel čas to nechat být."
 bp1_house_feud.0502.c: "Takže polevili v ostražitosti!"
 bp1_house_feud.0502.d: "Proč vůbec ztrácím čas takovými nesmysly?"
 bp1_house_feud.0600.t: "$story_cycle_house_feud_title$: Společní nepřátelé"
 bp1_house_feud.0600.desc: "Celé ráno přemítám nad ostře formulovaným dopisem, který mi [house_head_scope.GetTitledFirstName] [Select_CString(house_head_scope.IsFemale,'poslala','poslal')].\n\n[ROOT.Char.GetHouse.GetHeadOfHouse.GetFirstNameNoTooltip] v něm důrazně žádá, aby celý náš rod otevřeně vystoupil proti „psům z rodu [house_feud_rival.GetHouse.GetBaseName]“.\n\n[relation.Custom('GetFamilyFeudShortFlavor')] nedokážu obhájit — ale co rizika pro naši rodinu?"
 bp1_house_feud.0600.a: "[ROOT.Char.GetHouse.GetHeadOfHouse.GetFirstNameNoTooltip] nemohu odmítnout."
 bp1_house_feud.0600.b: "Už bylo načase!"
 bp1_house_feud.0600.c: "Tohle nás nikam nedovede..."
 bp1_house_feud.0700.t: "$story_cycle_house_feud_title$: Zakázané ovoce"
 bp1_house_feud.0700.desc: "Mé podezření se potvrdilo; [owner.GetTitledFirstName], člověk z nenáviděného rodu [owner.GetHouse.GetBaseName], touží po mé náklonnosti...\n\n"
 bp1_house_feud.0700.desc_positive: "Vždy mi říkali, ať si dávám pozor na nepřátele naší rodiny, ale nemohu popřít, že v tom je jisté... #EMP vzrušení#!."
 bp1_house_feud.0700.desc_neutral: "Nebýt sporů mezi našimi rodinami, možná bych o námluvách [owner.GetTitledFirstNamePossessive] i [Select_CString(ROOT.Char.IsFemale,'uvažovala','uvažoval')]."
 bp1_house_feud.0700.desc_negative: "To je ale [Select_CString(owner.IsFemale,'směšná nápadnice','směšný nápadník')] — copak si [owner.GetFirstNameNoTooltip] myslí, že jsme úplní hlupáci?"
 bp1_house_feud.0700.a: "Táhni, [house_feud_rival.Custom2('InsultNoun', ROOT.Char)] z rodu [house_feud_rival.GetHouse.GetBaseNameNoTooltip]!"
 bp1_house_feud.0700.b: "Růže by voněla stejně sladce, i kdyby se jmenovala jinak."
 bp1_house_feud.0701.t: "Obezřetná kořist"
 bp1_house_feud.0701.desc: "„To, co se říká o zdravém rozumu rodu [owner.GetHouse.GetBaseName], musí být pravda, jestli si myslíš, že by mě vůbec někdy napadlo dvořit se ti. Zkus ty své směšné triky na někoho jiného.“\n\n[target.GetFirstName] [target.Custom('quirk_neg_present')] a nemilosrdně mě zahrnuje pohrdáním."
 bp1_house_feud.0701.a: "[Select_CString(ROOT.Char.IsFemale,'Myslela','Myslel')] jsem, že ty... ale nic..."
 bp1_house_feud.0810.t: "$story_cycle_house_feud_title$: Pochodeň přechází dál"
 bp1_house_feud.0810.child: "[Select_CString(ROOT.Char.IsFemale,'Slyšela','Slyšel')] jsem mnoho příběhů o [old_house_head.GetTitledFirstName] a o sporech s rodem [house_feud_rival.GetHouse.GetBaseName]."
 bp1_house_feud.0810.adult: "Po smrti [old_house_head.GetTitledFirstName] začínám pochybovat o sporu naší rodiny s rodem [house_feud_rival.GetHouse.GetBaseName]."
 bp1_house_feud.0810.desc: "\n\n[relation.Custom('GetFamilyFeudShortFlavor')] si možná žádalo odpověď, ale je skutečně v našem zájmu v tom pokračovat?\n\nRod [ROOT.Char.GetHouse.GetBaseName] ode mě očekává vedení, které zajistí jeho přežití a vážnost, ale možná už při této vendetě bylo prolito dost krve..."
 bp1_house_feud.0810.a: "Ne, právě to ty ropuchy z rodu [house_feud_rival.GetHouse.GetBaseNameNoTooltip] chtějí!"
 bp1_house_feud.0810.b: "Ano, mám důležitější starosti."
 bp1_house_feud.0810.b.rival: "[house_feud_rival.GetFirstNameNoTooltip] je prašivý pes, ale tohle šílenství musí skončit."
 bp1_house_feud.0830.t: "$story_cycle_house_feud_title$: Nejsladší pocit"
 bp1_house_feud.0830.opening_drink: "Konečně si mohu vychutnat pohár [ROOT.Char.Custom('RegionalAlcoholicDrink')],"
 bp1_house_feud.0830.opening: "Konečně mohu klidně spočinout,"
 bp1_house_feud.0830.desc: "s vědomím, že prokletý rod [first_rival.GetHouse.GetBaseName] byl vymazán ze světa a vendeta, kterou tak pošetile vyvolal tím, čemu se říká [relation.Custom('GetFamilyFeudShortFlavor')], je jednou provždy u konce."
 bp1_house_feud.0830.first_owner: "\n\n[Select_CString(ROOT.Char.IsFemale,'Zvítězila','Zvítězil')] jsem a [ROOT.Char.GetFaith.NegativeAfterLife] je konečně [Select_CString(first_rival.IsFemale,'jejím','jeho')] údělem!"
 bp1_house_feud.0830.fallback: "\n\nAčkoli se [first_owner.GetTitledFirstName] tohoto dne [Select_CString(first_owner.IsFemale,'nedožila','nedožil')], doufám, že [ROOT.Char.GetFaith.PositiveAfterLife] je nyní [Select_CString(first_owner.IsFemale,'jejím','jeho')] domovem."
 bp1_house_feud.0830.losing: "\n\nV následujících letech sice naši rodinu draze poznamenali, ale nic nepřináší větší zadostiučinění ani úlevu než vědomí, že jejich prapor už nikdy nezavlaje."
 bp1_house_feud.0830.winning: "\n\nJejich řady jsme naprosto zdecimovali a dali všem jasně najevo, že kdo se postaví naší rodině, musí být připraven zaplatit vysokou cenu."
 bp1_house_feud.0830.even: "\n\nKaždou ztrátu, kterou jsme jim zasadili, následovala odplata, ale nyní jsme konečně uzavřeli poslední stránku příběhu rodu [first_rival.GetHouse.GetBaseNameNoTooltip]."
 bp1_house_feud.0830.a: "Nikdy se nestavěj proti rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 bp1_house_feud.0840.t: "$story_cycle_house_feud_title$: Další nepřítel"
 bp1_house_feud.0840.desc: "Nenáviděný rod [house_feud_rival.GetHouse.GetName] je nyní v rukou [house_feud_rival.GetFirstName], [house_feud_rival.GetTitleAsNameNoTooltip], jistě stejně [Select_CString(house_feud_rival.IsFemale,'zlotřilé','zlotřilého')] jako všichni předchůdci."
 bp1_house_feud.0840.child: "Jenže [house_feud_rival.GetFirstNameNoTooltip] je ještě pouhé dítě..."
 bp1_house_feud.0840.closing: "\n\nKaždý zná příběh o tom, jak „[relation.Custom('GetFamilyFeudShortFlavor')]“, ale co přinese budoucnost?"
 bp1_house_feud.0840.a: "#EMP Nic#! se nemění! Všichni psi z rodu [house_feud_rival.GetHouse.GetBaseNameNoTooltip] jsou stejní!"
 bp1_house_feud.0840.b: "Tohle už zašlo dost daleko."
 bp1_house_feud.0840.b.rival: "K čertu s [house_feud_rival.GetFirstNameNoTooltip], ale čeho je moc, toho je příliš."
 bp1_house_feud.7000.t: "$story_cycle_house_feud_title$: [Select_CString(ROOT.Char.IsFemale,'Právoplatná','Právoplatný')] [ROOT.Char.GetTitleAsNameNoTooltip]"
 bp1_house_feud.7000.desc: "Po mnoha útrapách jsme konečně vyrvali [house_feud_title.GetNameNoTier] z rukou [previous_holder.GetTitledFirstName] a rodu [house_feud_rival.GetHouse.GetBaseName]!\n\nKdyž byla tato křivda napravena, možná by bylo moudré nechat starý spor konečně odpočívat, než se jeho původní příčina ztratí v dalším krveprolití."
 bp1_house_feud.7000.a: "Rod [house_feud_rival.GetHouse.GetBaseNameNoTooltip] ještě nezaplatil dost."
 bp1_house_feud.7000.b: "Je konec, zvítězili jsme."
 bp1_house_feud.7001.t: "$story_cycle_house_feud_title$: Krev za krev"
 bp1_house_feud.7001.desc: "[house_feud_attacker.GetTitledFirstName], [Select_CString(house_feud_attacker.IsFemale,'odporná vražedkyně','odporný vrah')] [house_feud_victim.GetTitledFirstName], konečně [Select_CString(house_feud_attacker.IsFemale,'skončila','skončil')] naší rukou a čest naší rodiny byla obnovena.\n\nKdyž nyní vendeta rodu [ROOT.Char.GetHouse.GetBaseName] dosáhla svého cíle, možná bude nejlepší nechat tuto... #EMP šarvátku#! za sebou."
 bp1_house_feud.7001.a: "S rodem [house_feud_attacker.GetHouse.GetBaseNameNoTooltip] ještě nejsem hotov."
 bp1_house_feud.7001.b: "Nedopusťme, aby nakonec oslepl celý svět."
 bp1_house_feud.7002.t: "$story_cycle_house_feud_title$: Zasloužený osud"
 bp1_house_feud.7002.opening: "[house_feud_attacker.GetTitledFirstName], [Select_CString(house_feud_attacker.IsFemale,'bezcitná mučitelka','bezcitný mučitel')] [house_feud_victim.GetTitledFirstName], [Select_CString(house_feud_attacker.IsFemale,'zakusila','zakusil')] naší rukou stejný osud!"
 bp1_house_feud.7002.opening_self: "[house_feud_attacker.GetTitledFirstName], [Select_CString(house_feud_attacker.IsFemale,'má bezcitná mučitelka','můj bezcitný mučitel')], [Select_CString(house_feud_attacker.IsFemale,'zakusila','zakusil')] mou rukou stejný osud!"
 bp1_house_feud.7002.desc: "\n\nKdyž byla původní křivda proti rodu [ROOT.Char.GetHouse.GetBaseName] pomstěna, vyvstává otázka, jak dlouho ještě povedeme válku s rodem [house_feud_attacker.GetHouse.GetBaseName]..."
