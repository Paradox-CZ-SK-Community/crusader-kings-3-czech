 action_ongoing_house_feud_desc: "Tvá rodina považuje rod [recipient.GetHouse.GetBaseName] za nepřátele a za úspěchy proti němu získá odměny.\n\n#help Zabíjení, [Concept('torturing','mučení')|E], nasazování parohů, okrádání a vítězství ve [Concept('wars','válkách')|E] proti jeho členům zvýší skóre tvého rodu, zatímco pokud se obětí těchto činů stanou jeho členové, skóre se sníží.#!\n"
