 bp1_house_feud.7002.b: "Zvítězili jsme."
 bp1_house_feud.7003.t: "$story_cycle_house_feud_title$: Smyslná pomsta"
 bp1_house_feud.7003.opening: "[house_feud_attacker.GetTitledFirstName], [Select_CString(house_feud_attacker.IsFemale,'zlotřilá svůdnice','zlotřilý svůdce')], [Select_CString(house_feud_attacker.IsFemale,'která svedla','který svedl')] [house_feud_spouse.GetTitledFirstName], choť [house_feud_victim.GetTitledFirstNamePossessive],"
 bp1_house_feud.7003.opening_self: "[house_feud_attacker.GetTitledFirstName], [Select_CString(house_feud_attacker.IsFemale,'zlotřilá svůdnice','zlotřilý svůdce')], [Select_CString(house_feud_attacker.IsFemale,'která svedla','který svedl')] [house_feud_spouse.GetTitledFirstName], mou choť,"
 bp1_house_feud.7003.desc: "konečně [Select_CString(house_feud_attacker.IsFemale,'zakusila','zakusil')] stejný osud, a to naší rukou!\n\nKdyž byla tato křivda napravena, zápas s rodem [house_feud_rival.GetHouse.GetBaseNameNoTooltip] se zřejmě blíží ke svému přirozenému konci."
 bp1_house_feud.7003.a: "Tohle je teprve začátek!"
 bp1_house_feud.7003.b: "Uspokojivý závěr..."
