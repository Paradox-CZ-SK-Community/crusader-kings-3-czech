 game_concept_house_feud_desc: "Někdy může soupeření přerůst ve vendetu proti konkrétnímu [Concept('house','rodu')|E].\n\n#help Zabíjení, [Concept('torturing','mučení')|E], nasazování parohů, okrádání a vítězství ve [Concept('wars','válkách')|E] proti členům cílového [Concept('house','rodu')|E] zvýší skóre tvého rodu, zatímco pokud se obětí těchto činů stanou jeho členové, skóre se sníží.\n\nDokud rodová msta probíhá, všichni členové [Concept('house','rodu')|E] získají bonus k [Concept('hostile_schemes','nepřátelským intrikám')|E] proti členům cílového [Concept('house','rodu')|E] a budou je častěji volit za své cíle.\n\nPo skončení rodové msty získá tvůj [Concept('house','rod')|E] odměnu podle škod způsobených nepřátelům v porovnání se škodami, které utrpěl, a to v rozmezí od [GetModifier('house_feud_terrible_modifier').GetNameWithTooltip] po [GetModifier('house_feud_excellent_modifier').GetNameWithTooltip]."
