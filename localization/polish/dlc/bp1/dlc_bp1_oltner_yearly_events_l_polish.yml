l_polish:
 bp1_yearly.4000.t: "Rodinné zamyšlení"
 bp1_yearly.4000.desc: "Vzpomínám na den, kdy [family_memory.GetDescription]! [family_memory_participant.Custom('ComplimentAdjective')|U] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('family_memory_participant'))]!\n\n"
 bp1_yearly.4000.desc.alive: "Takové vzpomínky mě hřejí u srdce. Ať se stane cokoli, vím, že se mohu spolehnout na svou rodinu a že rod [ROOT.Char.GetHouse.GetName] zůstává silný."
 bp1_yearly.4000.desc.dead: "Kéž bys tu pořád [Select_CString(family_memory_participant.IsFemale,'byla','byl')]. Čekalo nás ještě tolik smíchu, tolik sporů k urovnání, tolik dalších vzpomínek... Rod [ROOT.Char.GetHouse.GetName] je bez tebe chudší."
 bp1_yearly.4000.desc_end: "\n\n#EMP „[ROOT.Char.GetHouse.GetMotto].“#! šeptám si pro sebe."
 bp1_yearly.4000.a: "[Select_CString(family_memory_participant.IsFemale,'Kéž bys tu byla a mohla to říct se mnou','Kéž bys tu byl a mohl to říct se mnou')]..."
 bp1_yearly.4000.b: "Tu vzpomínku si budu navždy hýčkat!"
 bp1_yearly.4000.c: "Tvou památku uctím básní!"
 bp1_yearly.4000.c.success: "Tvá rodina toto gesto ocení"
 bp1_yearly.4000.c.failure: "Zlomíš se pod tíhou zármutku"
 bp1_yearly.4000.d: "[family_memory_participant.GetFirstNameNoTooltip] si za svou věrnost zaslouží dar!"
 bp1_yearly.4000.family_first: "Ať rod [ROOT.Char.GetHouse.GetNameNoTooltip] přetrvá navěky!"
 bp1_yearly.4001.desc: "Když se kolem mě shromáždí ti nejbližší, začnu recitovat:\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\n"
 bp1_yearly.4001.desc.success_poem: "Po tvářích shromážděných stékají slzy. Myslím, že jsem tvou památku [Select_CString(ROOT.Char.IsFemale,'uctila','uctil')] důstojně, [family_memory_participant.GetFirstNameNoTooltip]."
 bp1_yearly.4001.desc.fail_poem: "...tohle nebylo moc dobré, že ne?"
 bp1_yearly.4001.a: "Odpočívej v pokoji."
 bp1_yearly.4001.b: "[Select_CString(ROOT.Char.IsFemale,'Zneuctila','Zneuctil')] jsem tvou památku!"
 bp1_yearly.4010.t: "[Select_CString(proposed_guardian.IsFemale,'Lepší poručnice','Lepší poručník')]"
 bp1_yearly.4010.desc: "„[Select_CString(ROOT.Char.IsFemale,'Má drahá ženo','Můj drahý muži')], mám obavy o [child_to_change_guardian.GetFirstNamePossessive] vzdělání,“ říká [parent_that_want_guardian_change.GetFirstName] se starostí v hlase.\n\n"
 bp1_yearly.4010.desc.root: "„Pravda je taková... na výchovu vlastního dítěte prostě #EMP nemáš dost času#!. "
 bp1_yearly.4010.desc.other: "„[current_guardian.Custom2('InsultNoun', SCOPE.sC('parent_that_want_guardian_change'))] [current_guardian.GetFirstName] se jako [Select_CString(current_guardian.IsFemale,'poručnice','poručník')] neosvědčuje. Je prostě až příliš... #EMP [current_guardian.Custom2('InsultAdjective', SCOPE.sC('parent_that_want_guardian_change'))]!#! "
 bp1_yearly.4010.desc_end: "[Select_CString(child_to_change_guardian.IsFemale,'Naše dcera','Náš syn')] potřebuje [Select_CString(proposed_guardian.IsFemale,'dobrou a oddanou poručnici','dobrého a oddaného poručníka')], někoho jako [proposed_guardian.Custom('ComplimentAdjective')] [child_to_change_guardian.Custom2('RelationToMeShort', SCOPE.sC('proposed_guardian'))] [proposed_guardian.GetFirstName]!“ pokračuje [parent_that_want_guardian_change.GetFirstName].\n\n„Mám to zařídit?“ dodá a s nadějí se na mě podívá."
 bp1_yearly.4010.a: "Samozřejmě, [Select_CString(parent_that_want_guardian_change.IsFemale,'drahá','drahý')]. [proposed_guardian.GetFirstNameNoTooltip] je lepší volba."
 bp1_yearly.4010.a_effect: "[child_to_change_guardian.GetFirstNamePossessive] [Concept('education','vzdělání')|E] pokračuje"
 bp1_yearly.4010.b: "Pro [current_guardian.GetFirstNameNoTooltip] jsem se [Select_CString(ROOT.Char.IsFemale,'rozhodla','rozhodl')] z dobrého důvodu, [parent_that_want_guardian_change.GetFirstNameNoTooltip]!"
 bp1_yearly.4010.b_alt: "Pche! [Select_CString(ROOT.Char.IsFemale,'Mám dost času, abych se o výchovu postarala sama','Mám dost času, abych se o výchovu postaral sám')]!"
 bp1_yearly.4010.c: "Moje volba je lepší, věř mi!"
 bp1_yearly.4010.c_effect: "[child_to_change_guardian.GetFirstNamePossessive] [Concept('education','vzdělání')|E] výrazně pokročí"
 bp1_yearly.4020.t: "Básnické přátelství"
 bp1_yearly.4020.desc: "„[ROOT.Char.GetFirstNameNoTooltip], [Select_CString(ROOT.Char.IsFemale,'má drahá přítelkyně','můj drahý příteli')], znovu jsem si [Select_CString(poetry_friend.IsFemale,'vzpomněla','vzpomněl')] na tvé vítězství. [war_memory_participant.GetTitledFirstName] tehdy [Select_CString(war_memory_participant.IsFemale,'prohrála','prohrál')], a tak mě napadlo zvěčnit tvůj triumf básní!“ pronese [poetry_friend.GetFirstName] a odkašle si:\n\n[poetry_artifact.GetName]\n[poetry_artifact.GetDesc]"
 bp1_yearly.4020.a: "[ROOT.Char.Custom('GetCourt')|U] uslyší každé její slovo!"
 bp1_yearly.4020.b: "Děkuji, [Select_CString(poetry_friend.IsFemale,'přítelkyně','příteli')]. Tu báseň si uchovám nablízku."
 bp1_yearly.4020.c: "Ha! Ať kopii dostanou všichni, koho [war_memory_participant.GetFirstNameNoTooltip] zná!"
 bp1_yearly.4020.d: "Tohle už je příliš, takovou chválu si zaslouží jedině [ROOT.Char.GetFaith.HighGodName]."
 bp1_yearly.4020.poetry: "[poetry_friend.Custom('GeneratePoem_Intro_Rhyming')]\n[poetry_friend.Custom('GeneratePoem_Outro_Rhyming')]"
 bp1_yearly.4020.poetry_title: "[poetry_friend.Custom('GeneratePoem_Title')]"
 artifact_poetry_name: "$bp1_yearly.4020.poetry_title$"
 artifact_poetry_description: "Básnické dílo věnované [ROOT.Char.GetTitledFirstNamePossessive] vítězství. [war_memory_participant.GetTitledFirstName] je v něm [war_memory_participant.Custom2('InsultAdjective', ROOT.Char)] [Select_CString(war_memory_participant.IsFemale,'poražená soupeřka','poražený soupeř')]. Dílo [Select_CString(poetry_friend.IsFemale,'napsala','napsal')] [poetry_friend.GetTitledFirstName], [Select_CString(poetry_friend.IsFemale,'dobrá přítelkyně','dobrý přítel')] [ROOT.Char.GetFirstNamePossessiveNoTooltip].\n\n$bp1_yearly.4020.poetry$"
 poetry_artifact_appended_desc: "Básnické dílo věnované [ROOT.Char.GetTitledFirstNamePossessive] vítězství. [war_memory_participant.GetTitledFirstName] je v něm [war_memory_participant.Custom2('InsultAdjective', ROOT.Char)] [Select_CString(war_memory_participant.IsFemale,'poražená soupeřka','poražený soupeř')]. Dílo [Select_CString(poetry_friend.IsFemale,'napsala','napsal')] [poetry_friend.GetTitledFirstName], [Select_CString(poetry_friend.IsFemale,'dobrá přítelkyně','dobrý přítel')] [ROOT.Char.GetFirstNamePossessiveNoTooltip].\n\nBáseň zní:\n$artifact_poetry_description$"
 bp1_yearly.4020.a_effect: "[newly_created_artifact.GetName] se stane [Concept('court_artifact','dvorským artefaktem')|E] a získá modifikátor [Concept('grandeur','velkoleposti')|E]"
 bp1_yearly.4020.b_effect: "Získáš [Concept('artifact','artefakt')|E] [newly_created_artifact.GetName]"
 bp1_yearly.4030.t: "[Select_CString(marriage_rival.IsFemale,'Svůdná sokyně','Svůdný sok')]"
 bp1_yearly.4030.desc: "„[ROOT.Char.Custom('CulturalCurse')|U]!“ vykřiknu při čtení dopisu.\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('marriage_rival'))|U] [marriage_rival.GetFirstName] — jediné slovo, které tě vystihuje, je „[marriage_rival.Custom2('InsultAdjective', ROOT.Char)]“! Plivu na tvé jméno!"
 bp1_yearly.4030.desc_bond_broken: "\n\nNejenže jsi lstí a šarmem [Select_CString(marriage_rival.IsFemale,'přesvědčila','přesvědčil')] [marriage_vassal.GetTitledFirstName], aby si tě [Select_CString(marriage_vassal.IsFemale,'vzala','vzal')] a [Select_CString(marriage_vassal.IsFemale,'zpřetrhala','zpřetrhal')] svazek s [spurned_partner.GetFirstName] — ne — ty jsi [marriage_vassal.GetTitledFirstNameNoTooltip] ještě [Select_CString(marriage_rival.IsFemale,'poštvala','poštval')] proti mně!"
 bp1_yearly.4030.desc_no_broken_bonds: "\n\nNejenže jsi lstí a šarmem [Select_CString(marriage_rival.IsFemale,'přesvědčila','přesvědčil')] [marriage_vassal.GetTitledFirstName], aby si tě [Select_CString(marriage_vassal.IsFemale,'vzala','vzal')] — ne — ty jsi [marriage_vassal.GetTitledFirstNameNoTooltip] ještě [Select_CString(marriage_rival.IsFemale,'poštvala','poštval')] proti mně!"
 bp1_yearly.4030.desc_end: "\n\nTvůj jedovatý jazyk o mně šíří jednu lež za druhou... [marriage_vassal.GetFirstNameNoTooltip] nemiluješ, chceš jen, abych #EMP [Select_CString(ROOT.Char.IsFemale,'trpěla','trpěl')]!#!"
 bp1_yearly.4030.a: "Musím [marriage_vassal.GetFirstNameNoTooltip] přesvědčit, jak [Select_CString(marriage_rival.IsFemale,'zákeřná','zákeřný')] [marriage_rival.GetFirstNameNoTooltip] je!"
 bp1_yearly.4030.b: "[marriage_vassal.GetFirstNameNoTooltip] [Select_CString(marriage_vassal.IsFemale,'zrušila','zrušil')] svůj svazek? Za to [marriage_vassal.GetFirstNameNoTooltip] čeká oheň a síra od [ROOT.Char.GetFaith.PriestNeuterPlural]!"
 bp1_yearly.4030.c: "Možná by se [spurned_partner.GetFirstNameNoTooltip] [Select_CString(spurned_partner.IsFemale,'mohla','mohl')] hodit..."
 bp1_yearly.4030.d: "[marriage_rival.Custom2('InsultNoun', ROOT.Char)|U] stejně ničeho [Select_CString(marriage_rival.IsFemale,'nedosáhla','nedosáhl')]!"
 distrustful: "Nedůvěřivý"
 bp1_yearly.4030.a.success: "[marriage_vassal.GetTitledFirstName] uvěří a začne svého jednání litovat"
 bp1_yearly.4030.a.failure: "[marriage_vassal.GetTitledFirstName] si myslí, že jen chrlíš další lži"
 bp1_yearly.4030.b.success: "[marriage_vassal.GetTitledFirstName] si uvědomí svou chybu"
 bp1_yearly.4030.b.failure: "[marriage_vassal.GetTitledFirstName] odmítne argumenty [ROOT.Char.GetFaith.PriestNeuterPlural]"
 bp1_yearly.4040.t: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))|U] s dobrým srdcem"
 bp1_yearly.4040.desc.intro.1: "„Ach, [ROOT.Char.GetFirstNameNoTooltip], moje zlatíčko — já tě tak miluji!“ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))|U] [kindly_grandmother.GetFirstName] ke mně přichází s talířem neodolatelných dobrot. „A mám pro tebe překvapení: [ROOT.Char.Custom('FavoriteTreatDemand')]! Vím, že to máš nejraději!“\n\nAch, [kindly_grandmother.GetFirstNameNoTooltip] mě zná tak dobře! Samozřejmě, pro [kindly_grandmother.GetFirstNameNoTooltip] je vlastnoruční příprava něčeho takového pod úroveň, ale... kdo jsem já, abych [Select_CString(ROOT.Char.IsFemale,'odmítala','odmítal')]?"
 bp1_yearly.4040.desc.intro.2: "„Další [ROOT.Char.Custom('FavoriteTreatDemand')]! [ROOT.Char.Custom('GirlBoy')|U] přece pořád roste!“ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))|U] [kindly_grandmother.GetFirstName] huláká z kuchyně. „Tak pojď, jez!“\n\nMmm, voní to báječně... další sousto snad neuškodí?"
 bp1_yearly.4040.desc.feeding.1: "„[ROOT.Char.GetFirstNameNoTooltip], když ti [ROOT.Char.Custom('FavoriteTreatDemand')] tak chutná, mám největší radost na světě!“ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))|U] [kindly_grandmother.GetFirstName] radostně volá z kuchyně. „Dnes jsem [Select_CString(kindly_grandmother.IsFemale,'udělala','udělal')] #EMP obrovskou#! várku! Tak všechno sněz!“\n\n#flatulence Uurp..!#! Ach, to snad nikdy neskončí... Ale přece nemůžu říct ne a ranit [kindly_grandmother.GetFirstNameNoTooltip], že ne?"
 bp1_yearly.4040.desc.feeding.2: "„Podívej, tenhle kousek vypadá jako [ROOT.Char.Custom('GetLivestockFowlIndef')]!“ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))|U] [kindly_grandmother.GetFirstName] prozpěvuje a nese další talíř. Je na něm [ROOT.Char.Custom('FavoriteTreatDemand')]. „Pozor, už ti to letí rovnou do pusy!“\n\nAch, [ROOT.Char.GetFaith.HighGodName], toho je moc! Ale... nesmím ranit [kindly_grandmother.GetFirstNameNoTooltip]..."
 bp1_yearly.4040.desc.feeding.3: "„[ROOT.Char.GetFirstNameNoTooltip], kde jsi? Tuhle várku [ROOT.Char.Custom('FavoriteTreatDemand')] jsem [Select_CString(kindly_grandmother.IsFemale,'uvařila','uvařil')] v másle!“ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))|U] [kindly_grandmother.GetFirstName] šeptá a očima mě hledá po kuchyni.\n\nTohle už se úplně vymklo kontrole... #EMP Co mám dělat!?#!"
 bp1_yearly.4040.desc.feeding.4: "„[ROOT.Char.Custom('FavoriteTreatDemand')] a [ROOT.Char.Custom('GetExpensiveMeal')] — kdo by řekl, že k sobě jdou tak skvěle? No přece [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))]!“ [kindly_grandmother.GetFirstName] volá a nese talíř toho nejodpornějšího jídla, jaké jsem v životě [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')]. „Večeře je hotová, [ROOT.Char.GetFirstNameNoTooltip]!“\n\nAť se schovám sebelepší, [kindly_grandmother.GetFirstNameNoTooltip] mě vždycky najde! Ach, moje ubohé, nafouklé tělo!"
 bp1_yearly.4040.a: "„[ROOT.Char.Custom('FavoriteTreatDemand')]!“ Už se těším!"
 bp1_yearly.4040.b: "Ne, děkuji, nic nechci."
 bp1_yearly.4040.c: "Ještě jedno sousto neuškodí..."
 bp1_yearly.4040.d: "Už mám dost."
 bp1_yearly.4040.e: "#EMP [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))|U]#! pro mě tolik znamená... Nemohu říct ne!"
 bp1_yearly.4040.f: "Už do sebe #EMP nedostanu#! ani sousto!"
 bp1_yearly.4040.desc.dead: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))|U] [kindly_grandmother.GetFirstName] už tu není. S tebou pryč bude i [ROOT.Char.Custom('FavoriteTreatDemand')] na každém kroku, ale ta úleva má hořkosladkou příchuť — mnohem raději bych tě [Select_CString(ROOT.Char.IsFemale,'měla','měl')] tady po svém boku, než o tebe navždy přijít.\n\nSbohem, [kindly_grandmother.GetFirstName], odpočívej v pokoji."
 bp1_yearly.4040.dead: "Možná si na tvou počest nechám připravit tohle: [ROOT.Char.Custom('FavoriteTreatDemand')]."
 bp1_yearly.4040.family_first: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))|U] [kindly_grandmother.GetFirstNameNoTooltip] si zaslouží trochu mého času. Raději si jen chvíli popovídáme!"
