 raconteur_modifier_desc: "Vypravěčskému umění této postavy se téměř nikdo nevyrovná."
 toilet_humor_modifier: "Přízemní humor"
 toilet_humor_modifier_desc: "Tato postava si získala jistou pověst svým poněkud přízemním smyslem pro humor."
 effective_agents_modifier: "Schopní spolčenci"
 effective_agents_modifier_desc: "Tato postava budí obavy dosahem a schopnostmi svých špehů."
 spyamateur_modifier: "Amatérský vyzvědač"
 spyamateur_modifier_desc: "Tato postava má ve vedení sítě špehů ještě co dohánět."
 sycophant_story_failed_scheme_detection_modifier: "Neodhalené spiknutí"
 sycophant_story_failed_scheme_detection_modifier_desc: "Toto spiknutí uniklo pozornosti těch, kteří měli nejlepší předpoklady je odhalit."
 welcome_distraction_modifier: "Vítané rozptýlení"
 welcome_distraction_modifier_desc: "Tato postava si dopřává zasloužený odpočinek a trochu zábavy."
 fanned_flame_modifier: "Rozdmýchaný plamen"
 fanned_flame_modifier_desc: "Povzbuzování důvěrníka v této postavě rozdmýchalo plamen touhy."
