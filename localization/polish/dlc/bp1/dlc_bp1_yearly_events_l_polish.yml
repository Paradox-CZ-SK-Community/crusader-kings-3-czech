 placated_vassals_modifier_desc: "Tato postava dala před svým oblíbencem přednost mocným šlechticům země."
 personal_guard_modifier: "Osobní stráž"
 personal_guard_modifier_desc: "Této postavě byla přidělena osobní stráž, která nad ní bdí."
