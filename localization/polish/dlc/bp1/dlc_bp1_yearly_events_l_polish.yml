l_polish:
 bp1_yearly.2000.t: "Dárek hodný..."
 bp1_yearly.2000.desc.intro: "Mezi putovními obchodními stánky je cítit shon. Dočasné kůlny jsou naložené až po stropy a obsahují všelijaké cetky. "
 bp1_yearly.2000.desc.greed_flavor: "Tyhle kousky vypadají draze... ale možná by stály za to."
 bp1_yearly.2000.desc.not_greed_flavor: "Tyto kousky jsou doslova zářivé a udělaly by krásný dar."
 bp1_yearly.2000.desc.single: "\n\nKdyž [bp1_yearly_2000_partner_a.GetTitledFirstName] a já procházíme kolem jednoho z obchodníků prodávajících šperky, [bp1_yearly_2000_partner_a.GetSheHe] se mírně zadrží, když se [bp1_yearly_2000_partner_a.GetSheHe] nakloní, aby se [Select_CString(bp1_yearly_2000_partner_a.IsFemale,'podívala','podíval')] blíže.\n\nMožná by jeden z těchto kousků rozjasnil den mému [ROOT.Char.Custom2('PartnerOpinionDescription', SCOPE.sC('bp1_yearly_2000_partner_a') )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bp1_yearly_2000_partner_a'))]?"
 bp1_yearly.2000.desc.duo: "\n\nKdyž procházím kolem jednoho z obchodníků prodávajících šperky, zdržuji se a nakláním se, abych se [Select_CString(ROOT.Char.IsFemale,'podívala','podíval')] blíže.\n\nMožná by jeden z těchto kousků rozjasnil den mé milované [bp1_yearly_2000_partner_a.GetTitledFirstName] nebo [bp1_yearly_2000_partner_b.GetTitledFirstName]?"
 bp1_yearly.2000.a_single: "A [ROOT.Char.Custom('RandomJewelry')], hodí se pro [bp1_yearly_2000_partner_a.GetFirstNameNoTooltip]!"
 bp1_yearly.2000.a_duo: "A [ROOT.Char.Custom('RandomJewelry')], hodí se pro mého/mou [bp1_yearly_2000_partner_a.Custom('ComplimentAdjective')] [bp1_yearly_2000_partner_a.GetFirstNameNoTooltip]."
 bp1_yearly.2000.b: "Tento [ROOT.Char.Custom('RandomJewelry')] by vypadal [ROOT.Char.Custom('RandomPositiveLookAdjective')] na [bp1_yearly_2000_partner_b.GetFirstNamePossessiveNoTooltip] [bp1_yearly_2000_partner_b.Custom('ComplimentAdjective')] postavě."
 bp1_yearly.2000.c: "Proč se spokojit jen s jedním!"
 bp1_yearly.2000.c_flavor: "Rozmazlíme je oba!"
 bp1_yearly.2000.d: "Dostatečným darem je má společnost."
 bp1_yearly.2001.t: "... Vládce"
 bp1_yearly.2001.t.first_title_duo: "... Vládce..."
 bp1_yearly.2001.t.second_title_duo: "... A dobrý [ROOT.Char.GetWomanMan|U]"
 bp1_yearly.2001.desc.intro_high_opinion: "„Má nejdražší [ROOT.Char.GetFirstNameNoTooltip], jaké je to potěšení tě vidět!\n\nPozoruji tě, jak svědomitě vládneš našemu [ROOT.Char.Custom('GetRealmOrDomicile')] a [Select_CString(ROOT.Char.IsFemale,'ráda','rád')] bych ti [Select_CString(ROOT.Char.IsFemale,'pomohla','pomohl')], jak jen budu moci.„"
 bp1_yearly.2001.desc.intro: "„[bp1_yearly_2001_partner.Custom2('RelationToMeShort', ROOT.Char)|U], zdá se, že se už málokdy vídáme!\n\nMožná jsem [Select_CString(ROOT.Char.IsFemale,'přišela','přišel')] na pár zajímavostí, které by se mohly hodit pro naše vládnutí.„"
 bp1_yearly.2001.desc.segway_secret_hook: "\n\n[bp1_yearly_2001_partner.GetSheHe|U] pohlédne přes [bp1_yearly_2001_partner.GetHerHis] rameno "
 bp1_yearly.2001.desc.secret: "„Nedávno jsem při poslechu sloužících [Select_CString(ROOT.Char.IsFemale,'zaslechla','zaslechl')] něco, čemu neuvěříš.“"
 bp1_yearly.2001.desc.hook: "„Možná jsem... no, nebudeme se zdržovat tím, co jsem v té záležitosti [Select_CString(ROOT.Char.IsFemale,'dělala','dělal')], ale řeknu, že mi jeden společný známý dluží službu.“"
 bp1_yearly.2001.desc.segway_lover: "\n\nTichý vánek přejede [bp1_yearly_2001_partner.GetHerHis] vlasy "
 bp1_yearly.2001.desc.lover: "a nemohu si pomoci a zírám na [bp1_yearly_2001_partner.GetHerHis] [ROOT.Char.Custom('RandomPositiveLookAdjective')] rysy, snažím se je vtisknout do paměti."
 bp1_yearly.2001.desc.segway_modifier: "\n\nPak se [bp1_yearly_2001_partner.GetSheHe] skrčí, jako by si [Select_CString(ROOT.Char.IsFemale,'vzpomněla','vzpomněl')] na něco důležitého. „[Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')] bych "
 bp1_yearly.2001.desc.close_modifier: "hlídat jakékoliv... nevhodné... chování, které by nás mohlo potkat.„"
 bp1_yearly.2001.desc.finance_modifier: "zajistit ti ty nejlepší finanční rady od mého zdroje.„"
 bp1_yearly.2001.desc.close_finance_modifier: "\n\n„Nebo alternativně zjistit, jak ti zajistit nejlepší finanční rady od mých zdrojů.“"
 bp1_yearly.2001.desc.fallback: "\n\n„...nebo vlastně jsem se [Select_CString(ROOT.Char.IsFemale,'mýlila','mýlil')]. Omlouvám se, že jsem ti [Select_CString(ROOT.Char.IsFemale,'ztrácela','ztrácel')] čas!“"
 bp1_yearly.2001.desc.outro: "\n\n[bp1_yearly_2001_partner.GetSheHe|U] nakloní [bp1_yearly_2001_partner.GetHerHis] hlavu a očekávavě se na mě dívá."
 bp1_yearly.2001.a: "Ó, prosím, vyzraď mi to, můj [ROOT.Char.Custom('PartnerOpinionHighDescription')]!"
 bp1_yearly.2001.a.tt_secret: "[bp1_yearly_2001_secret_owner.GetTitledFirstNamePossessive] tajemství"
 bp1_yearly.2001.a_tt: "[bp1_yearly_2001_partner.GetShortUINameNoTooltip] se s tebou podělí o tajemství."
 bp1_yearly.2001.b: "Více mě zajímáš #EMP ty#!, můj [ROOT.Char.Custom('LoverPetName')]!"
 bp1_yearly.2001.c: "Jak jsi to... nevadí. Prosím, vysvětli mi to!"
 bp1_yearly.2001.c_tt: "[bp1_yearly_2001_partner.GetShortUINameNoTooltip] ti poskytne páku v té záležitosti."
 bp1_yearly.2001.d: "Důvěřuji ti, že mě podržíš, můj [ROOT.Char.Custom('PartnerOpinionHighDescription')]."
 bp1_yearly.2001.e: "Opravdu bych #EMP [Select_CString(ROOT.Char.IsFemale,'ocenila','ocenil')]#! lepší finance."
 bp1_yearly.2010.t: "Dvě lodě v noci"
 bp1_yearly.2010.desc.intro: "Na první pohled chodba vypadá opuštěně. Klidným krokem směřuji k prvnímu bodu dne.\n\nNáhle zaslechnu potlačený chichot a zarazím se. Předkloním se a zachytím letmý pohled na [bp1_yearly_2010_first_partner.GetShortUIName] a [bp1_yearly_2010_second_partner.GetShortUIName],"
 bp1_yearly.2010.desc.default: "omámení něžným objetím ve světle ranního slunce.\n\n„[bp1_yearly_2010_second_partner.GetFirstNameNoTooltip], nedrž si mě jen tak, můj [ROOT.Char.Custom('LoverPetName')]...“ [bp1_yearly_2010_first_partner.GetSheHe|U] zaboří [bp1_yearly_2010_first_partner.GetHerHis] tvář do výstřihu [bp1_yearly_2010_second_partner.GetFirstNameNoTooltip].\n\n„Můžeme strávit zítřejší noc spolu, můj [ROOT.Char.Custom('LoverPetName')]“, odvětí [bp1_yearly_2010_second_partner.GetFirstNameNoTooltip]. „Pokud budu moci být přes den s tebou, nic dalšího není důležité.“"
 bp1_yearly.2010.desc.lustful: "vášniví a divocí, zabraní do... ó #EMP můj#!.\n\nNa denním světle? A co dělají s tím #EMP [ROOT.Char.Custom('DeviantObjectNoun')]#!?"
 bp1_yearly.2010.a: "To je milé. A možná užitečné."
 bp1_yearly.2010.a_lustful: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych si začít dělat poznámky!"
 bp1_yearly.2010.a_tt: "Co #EMP dalšího#! se asi děje pod mou střechou..."
 bp1_yearly.2010.a_tt_lustful: "Tohle #EMP zbožňuji#!"
 bp1_yearly.2010.b: "Možná potřebují #EMP třetího#! pomocníka..."
 bp1_yearly.2010.tt: "Takové okolnosti!"
 bp1_yearly.2010.c: "To je skandál!"
 bp1_yearly.2010.c_tt: "Mám zlomené srdce."
 bp1_yearly.5100.t: "Šíp lásky"
 bp1_yearly.5100.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('unloved_courtier'))] [unloved_courtier.GetName] vypadá už přes týden sklesle, a až pátý těžký, sklíčený vzdech dne mě konečně přiměje jemně se zeptat, co se děje.\n\n„Jsem tak osamělý(á). Chci jen někoho výjimečného! Někdo, kdo by mi stál po boku ve dne a sdílel mou postel v noci!“ [unloved_courtier.GetSheHe|U] se na chvíli odmlčí, pak smutně potřese [unloved_courtier.GetHerHis] hlavou.\n\n„Co to vykládám? Nechápeš mou nouzi, že ne, můj [ROOT.Char.GetLadyLord]? Podívej se na sebe! Jsi tak"
 bp1_yearly.5100.desc.male: "drsně pohledný!"
 bp1_yearly.5100.desc.female: "přirozeně krásná!"
 bp1_yearly.5100.desc.swole: "přitažlivý a navíc postavený jako socha!"
 bp1_yearly.5100.desc.scarred: "vznešeného vzhledu, s těmi jizvami!"
 bp1_yearly.5100.desc.fallback: "dokonale utvořený!"
 bp1_yearly.5100.desc.end: "Nic z toho pro tebe nikdy nebyl problém, že ne?„"
 bp1_yearly.5100.a: "Buď prostě sám/sama sebou, [unloved_courtier.GetNameNoTooltip]!"
 bp1_yearly.5100.b: "Máš pravdu, nikdy to nebyl problém!"
 bp1_yearly.5100.c: "Pomohu ti!"
 bp1_yearly.5100.d: "Nevzdávej se naděje, [unloved_courtier.GetNameNoTooltip]."
 bp1_yearly.5100.toast: "Nepovedlo se."
 bp1_yearly.5101.t: "Šíp lásky: Cíl"
 bp1_yearly.5101.desc: "„Uděláš to, můj [ROOT.Char.GetLadyLord]? Opravdu mi pomůžeš?“\n\nVzpomínám si, jak se [unloved_courtier.GetNamePossessive] tvář rozzářila, když jsem [Select_CString(unloved_courtier.IsFemale,'souhlasila','souhlasil')], s jistou ostražitostí, že pomohu [unloved_courtier.GetHerHim] najít lásku. Nejsem zrovna mistr v dohazování, takže spíše s nadějí než s jistotou vkročím mezi hemžící se davy na [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], abych [Select_CString(ROOT.Char.GetCapitalLocation.GetTitle.IsFemale,'hledala','hledal')] možný plamen.\n\nProhlédnu si tržiště, zaznamenávám několik slibných kandidátů, ale pro [unloved_courtier.GetNamePossessiveNoTooltip] bych [Select_CString(unloved_courtier.IsFemale,'měla','měl')] opravdu hledat někoho, kdo by [unloved_courtier.GetHerHim] seděl. Někdo..."
 bp1_yearly.5101.a: "...starostlivý a citlivý."
 bp1_yearly.5101.b: "...spravedlivý a bez předsudků."
 bp1_yearly.5101.c: "...zbožný a horlivý."
 bp1_yearly.5101.d: "...vlastně — vyberme prostě toho nejpřitažlivějšího."
 bp1_yearly.5102.t: "Šíp lásky: Dopadl"
 bp1_yearly.5102.desc: "Když pokračuji v hledání, jedna postava upoutá mou pozornost. [potential_lover.GetSheHe|U]"
 bp1_yearly.5102.desc.compassionate: "je schoulený(á) v koutě náměstí a zdá se, že pomáhá toulavé kočce, která zoufale potřebuje napít. Zatímco [potential_lover.GetWomanMan] utěšuje ubohé zvíře, začnu si představovat, že by ten ubohý [ROOT.Char.Custom('GetCourtierPlural')] [Select_CString(ROOT.Char.IsFemale,'dostala','dostal')] stejný projev altruismu..."
 bp1_yearly.5102.desc.just: "zdá se, že řeší spor mezi dvěma sedláky. [potential_lover.GetSheHe|U] pozorně naslouchá oběma stranám a vynáší spravedlivý rozsudek, se kterým oba zdají souhlasit."
 bp1_yearly.5102.desc.zealous: "pozorně naslouchá kazateli, který burcuje dav. Mně to připadá jako výkřiky šílence, ale v očích posluchače plane nadšení a [potential_lover.GetSheHe] nadšeně přikyvuje u náboženského blábolení."
 bp1_yearly.5102.desc.peng: "bylo by těžké je přehlédnout: obklopený(á) skupinkou obdivovatelů, [potential_lover.GetHerHis] poněkud ošuntělé oblečení skrývá nápadný vzhled."
 bp1_yearly.5102.desc.end: "\n\nStačí pozvání na můj [ROOT.Char.Custom('GetCourt')] a slib nápadníka, aby lichocený a nadšený [potential_lover.GetWomanMan] — [potential_lover.GetName], jak jsem [Select_CString(potential_lover.IsFemale,'zjistila','zjistil')] — šel s námi. Hrdě vtrhnuvší dovnitř, spatřím [unloved_courtier.GetName] zaujmutého [unloved_courtier.GetHerHis] obvyklým beznadějným trudnomyslním na druhé straně dvora.\n\n[unloved_courtier.GetNameNoTooltip] se ke mně očekávavě otočí, oči mu/jí září nadějí."
 bp1_yearly.5102.a: "[unloved_courtier.GetNameNoTooltip]! Poď sem!"
 bp1_yearly.5102.b: "Vlastně, možná bys raději [Select_CString(ROOT.Char.IsFemale,'vynechala','vynechal')] setkání?"
 bp1_yearly.5102.c: "„U [unloved_courtier.GetWomanMan] mého [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('unloved_courtier'))] bys [Select_CString(ROOT.Char.IsFemale,'byla','byl')] [Select_CString(ROOT.Char.IsFemale,'promarněna','promarněn')].“"
 bp1_yearly.5102.a.success: "Padli si do oka"
 bp1_yearly.5102.a.failure: "Není tam žádná jiskra"
 bp1_yearly.5301.t: "Těžký problém"
 bp1_yearly.5301.start: "V celé večer jsem si [Select_CString(ROOT.Char.IsFemale,'vědoma','vědom')] pohledů [concerned_friend.GetFirstNamePossessive] na sobě, zatímco jíme, "
 bp1_yearly.5301.thicc: "ale když vesele přijmu třetí porci [ROOT.Char.Custom('GetExpensiveDessert')], [concerned_friend.GetHerHis] pěst náhle udeří do stolu.\n\n„Tohle už dál nemohu tolerovat!“ vykřikne na mě [concerned_friend.GetSheHe]. „Nemohu tu sedět a dívat se, jak se jíš k smrti, [ROOT.Char.GetFirstName]!“\n\nTrochu se pozlíbím, ale těžko vypadat uraženě s plnou pusou. Možná si #EMP občas užiju#! nějaké mlsání, ale řízení [ROOT.Char.GetPrimaryTitle.GetTierAsName] je stresující záležitost!"
 bp1_yearly.5301.thinn: "ale když dál ohlodávám první chod a další chody se řadí, [concerned_friend.GetHerHis] pěst náhle udeří do stolu.\n\n„Toto už dál nemohu tolerovat!“ vykřikne na mě [concerned_friend.GetSheHe]. „Nemohu tu sedět a dívat se, jak chřadneš, [ROOT.Char.GetFirstName]!“\n\nTrochu se pozlobím, ale těžko vypadat uraženě za rostoucím hromadícím se množstvím talířů. Možná #EMP nemám#! příliš času na jídlo, ale velice časově náročné je vládnout [ROOT.Char.GetPrimaryTitle.GetTierAsName]!"
 bp1_yearly.5301.a: "Víš co, [concerned_friend.GetFirstNameNoTooltip]? Máš pravdu."
 bp1_yearly.5301.a.tt: "Společně hledáte způsoby, jak se dostat do formy"
 bp1_yearly.5301.b: "Tak [Select_CString(ROOT.Char.IsFemale,'tlustá','tlustý')] nejsem!"
 bp1_yearly.5301.b.tt: "Hledáš způsob, jak to dokázat"
 bp1_yearly.5301.c: "Nejsem tak [Select_CString(ROOT.Char.IsFemale,'hubená','hubený')]!"
 bp1_yearly.5301.d: "Kdo by to [Select_CString(ROOT.Char.IsFemale,'řekla','řekl')], že zrovna ty budeš mluvit o vzhledu!"
 bp1_yearly.5301.d.tt: "Vy dva se pustíte do poněkud směšného souboje pěstmi"
 bp1_yearly.5301.d.tt.win: "Vyhraješ souboj"
 bp1_yearly.5301.d.tt.lose: "Prohraješ souboj"
 bp1_yearly.5302.t: "$bp1_yearly.5301.t$: Těžká cesta"
 bp1_yearly.5302.desc: "Je svěží, slunečný den a vidím pot kapající z brady [concerned_friend.GetFirstNamePossessive], zatímco [concerned_friend.GetSheHe] mě dál povzbuzuje. Sáček kamenů na mých zádech sténá pod tíhou, a i já, když jej hodím přes čáru v zemi, kterou [concerned_friend.GetFirstNameNoTooltip] narýsoval holí. [concerned_friend.GetSheHe|U] spokojeně tleská rukama.\n\n„Už vypadáš silnější! Myslím, že je čas přejít k něčemu trochu většímu.“\n\n„Vím, že právě provádějí odvodňovací práce na sousedním poli a mohli by pomoc. Nebo pokud se cítíš [Select_CString(ROOT.Char.IsFemale,'odvážná','odvážný')], je tam háj za hřebenem, který momentálně těží. Co na to říkáš?“"
 bp1_yearly.5302.a: "Přines mi sekiru!"
 bp1_yearly.5302.a.tt: "Směřuješ k háji stromů"
 bp1_yearly.5302.b: "Lépe zůstat u odvodňovacích prací."
 bp1_yearly.5302.b.tt: "Vydáváš se na blízké pole"
 bp1_yearly.5303.t: "$bp1_yearly.5301.t$: Sekání dřeva"
 bp1_yearly.5303.desc: "Těžba stromů je nebezpečná záležitost pro někoho tak nezkušeného, jako jsem já. I když mě dohlíží ostražité oko [concerned_friend.GetFirstNamePossessive], kombinace mé nepozornosti a úsilí už vedla k několika úzkým úhybným momentům. Zapichuji sekeru do dřeva blízkého kmene a na chvíli se zastavím, abych si [Select_CString(ROOT.Char.IsFemale,'dala','dal')] doušek z placatky. [concerned_friend.GetFirstNameNoTooltip] ke mně přistupuje, [concerned_friend.GetHerHis] vlastní sekerou pověšenou přes rameno.\n\n„Myslím, že jsi [Select_CString(ROOT.Char.IsFemale,'připravena','připraven')] vzít si na sebe něco většího!“ říká [concerned_friend.GetSheHe] vesele a ukazuje sekerou. Strom, na který ukazuje, je obrovský, mohutný tvrdý strom, a já ho obezřetně sleduji, zatímco se mé bolavé svaly napínají v očekávání."
 bp1_yearly.5303.a: "No tak, jak těžké to může být?"
 bp1_yearly.5303.a.criticalsuccess: "Úspěšně se ti podařilo strom pokácet!"
 bp1_yearly.5303.a.failure: "Nejde ti strom pokácet bez pomoci"
 bp1_yearly.5303.a.wounded: "Strom tě zasáhne při pádu"
 bp1_yearly.5303.a.criticalfailure: "Strom spadne přímo na tebe!"
 bp1_yearly.5303.b: "[Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')] bys mi pomoct, [concerned_friend.GetFirstNameNoTooltip]?"
 bp1_yearly.5304.t: "$bp1_yearly.5301.t$: Bažinatý standard"
 bp1_yearly.5304.desc: "Vodou promočená, bažinatá půda, s níž jsem se nabídl pomoct, je pot upocená práce. Tvrdě pracuji po boku nic netušících rolníků s krumpáčem, kopu příkopy a odkládám pytle mokrého bláta z oblasti.\n\n[concerned_friend.GetFirstName] a já si dáváme pauzu, stojíme na úzkém pásu mezi dvěma částmi bažiny, když [waterboy.GetFirstName], jedno z dětí pověřených držet dělníky hydratované, se ke mně přiblíží a nabídne mi placatku. Než stačím upít jeden doušek, [waterboy.GetFirstNameNoTooltip], při natahování pro láhev, ztratí rovnováhu a spadne přímo do bažiny!"
 bp1_yearly.5304.a: "Drž se, dítě! Mám tě!"
 bp1_yearly.5304.b: "...všimne si někdo kromě nás, kdyby se [Select_CString(waterboy.IsFemale,'utopila','utopil')]?"
 bp1_yearly.5305.t: "$bp1_yearly.5301.t$: Ve skvělé kondici"
 bp1_yearly.5305.desc: "Po splnění úkolů se se [concerned_friend.GetFirstName] rozloučím s rolníky, s nimiž jsem [Select_CString(concerned_friend.IsFemale,'pracovala','pracoval')] — veselě mi zamávají, zcela netušíc mých šlechtických kořenů — a vrátím se do obvyklého ubytování. Ačkoli mě bolí svaly, cítím se [Select_CString(ROOT.Char.IsFemale,'plná','plný')] síly a vitality.\n\nKdyž spatřím na druhé straně místnosti velkou nádrž s vodou, zvednu se na nohy a přistoupím k ní. Sundám si košili a ve světle svíček se zadívám na svůj odraz ve vodě."
 bp1_yearly.5305.a: "Vypadám skvěle!"
 bp1_yearly.5305.b: "Za všechno vděčím tobě, [concerned_friend.GetFirstNameNoTooltip]."
 bp1_yearly.5306.t: "$bp1_yearly.5301.t$: Test síly"
 bp1_yearly.5306.start: "Zuřivě zuřím po [ROOT.Char.Custom('GetCourt')], [concerned_friend.GetFirstName] v patách.\n\n„[ROOT.Char.GetFirstName]! Prosím, nemusíš mi nic dokazovat! Můžeme prostě zapomenout, že jsem něco [Select_CString(ROOT.Char.IsFemale,'řekla','řekl')]!“ [concerned_friend.GetSheHe] je přerušeno opovržlivým mávnutím mé ruky, zatímco prohledávám místnost po něčem dostatečně objemném. Jak si dovolí [concerned_friend.GetSheHe] zpochybnit mou čest!\n\n"
 bp1_yearly.5306.artifact: "Můj pohled spočine na [bulky_artifact.GetName]. "
 bp1_yearly.5306.throne: "Můj pohled spočine na mém trůnu."
 bp1_yearly.5306.table: "Můj pohled spočine na mohutném stole."
 bp1_yearly.5306.ending: "K [concerned_friend.GetFirstNamePossessiveNoTooltip] hrůze strhnu ze sebe košili a hned se postavím, abych [Select_CString(concerned_friend.IsFemale,'zvedla','zvedl')] jeho ohromnou váhu."
 bp1_yearly.5306.a: "Sleduj mě, [concerned_friend.GetFirstNameNoTooltip]!"
 bp1_yearly.5306.a.success: "Vzneseš to do vzduchu!"
 bp1_yearly.5306.a.failure: "Přetížíš si záda"
 bp1_yearly.5306.a.criticalfailure: "Spadne ti to na tělo!"
 bp1_yearly.5306.a.criticalsuccess: "Zvedneš to do vzduchu"
 bp1_yearly.5306.b: "...po druhé úvaze, možná máš pravdu."
 bp1_yearly.5800.t: "Podivný zápach"
 bp1_yearly.5800.desc: "Probudiv se ráno vedle mého [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('surprised_sniffer'))] [surprised_sniffer.GetFirstName], povzdechnu si a rozležím se jen proto, abych zahlédl, jak můj [Select_CString(surprised_sniffer.IsFemale,'milovaná','milovaný')] [surprised_sniffer.GetHerHis] škubne nosem. Otevřu ústa, abych se [Select_CString(ROOT.Char.IsFemale,'zeptala','zeptal')] více, jenže [surprised_sniffer.GetFirstNameNoTooltip] se ještě víc odtáhne.\n\n„Poslouchej, [ROOT.Char.GetFirstName], můj miláčku...“ začne rychle [surprised_sniffer.GetSheHe], jako by se slova vyhrnula z [surprised_sniffer.GetHerHis] úst omylem. „Je těžké to nadhodit, ale... v poslední době už moc nevoníš svěže.“\n\nOhromeně si očichám podpaží zvědavým #flatulence sniff#!.\n\nNo, možná má [surprised_sniffer.GetSheHe] pravdu."
 bp1_yearly.5800.a: "Musíme najít způsob, jak to napravit!"
 bp1_yearly.5800.a.tt: "Hledáš řešení problému"
 bp1_yearly.5800.b: "Není to #EMP až tak#! špatné!"
 bp1_yearly.5801.t: "$bp1_yearly.5800.t$: Skvělé"
 bp1_yearly.5801.desc: "Zívnu unaveně, když mě [surprised_sniffer.GetFirstName] nadšeně vede do nedalekého města. [Select_CString(surprised_sniffer.IsFemale,'Trvala','Trval')] na tom, abychom vyrazili co nejdřív — což je s odstupem poněkud urážlivé — a prodrali jsme se malými davy tam, kde prodával ovoce a byliny.\n\n„Tak!“ [Select_CString(ROOT.Char.IsFemale,'řekla','řekl')] očekávavě [surprised_sniffer.GetFirstNameNoTooltip]. „Vyber si z tohohle. Udělají z počáteční vůně svěží a ovocnou!“ [surprised_sniffer.GetSheHe|U] protočí oči nad mým zmateným výrazem.\n\n„Samozřejmě že vyrábíme #EMP parfém#!“"
 bp1_yearly.5801.a: "Je to fík?"
 bp1_yearly.5801.b: "Třeba máta?"
 bp1_yearly.5801.c: "Mám [Select_CString(ROOT.Char.IsFemale,'ráda','rád')] vůni citronu!"
 bp1_yearly.5801.d: "Granátové jablko by bylo drahé..."
 bp1_yearly.5801.fig: "[perfume_bottle.GetDesc] Má tóny fíků"
 bp1_yearly.5801.mint: "[perfume_bottle.GetDesc] Má tóny máty"
 bp1_yearly.5801.lemon: "[perfume_bottle.GetDesc] Má tóny citronu"
 bp1_yearly.5801.pomegranate: "[perfume_bottle.GetDesc] Má tóny granátového jablka"
 bp1_yearly.5802.t: "$bp1_yearly.5800.t$: Ze srdce"
 bp1_yearly.5802.desc: "Po mém výběru před týdnem jsem skoro [Select_CString(ROOT.Char.IsFemale,'zapomněla','zapomněl')] na [surprised_sniffer.GetFirstNamePossessive] snahu vytvořit mi vůni. [Select_CString(ROOT.Char.IsFemale,'Vzpomněla','Vzpomněl')] jsem si teprve, když vprostřed ulice [Select_CString(surprised_sniffer.IsFemale,'ztuhnula','ztuhnul')] a prudce se [Select_CString(ROOT.Char.IsFemale,'otočila','otočil')] na patě a [Select_CString(ROOT.Char.IsFemale,'dotáhla','dotáhl')] mě ke kořenáři u silnice.\n\n„Tohle by bylo dokonalé!“ [Select_CString(ROOT.Char.IsFemale,'pomrkávala','pomrkával')] [surprised_sniffer.GetSheHe]. „Cokoliv tady bude dokonalé pro srdce parfému!“\n\nProhlédnu si nasbírané koření a kadidla, tolik z nich cizích a exotických pro mé oko."
 bp1_yearly.5802.a: "Co to je... kardamom?"
 bp1_yearly.5802.b: "[Select_CString(ROOT.Char.IsFemale,'Řekla','Řekl')] jsi, že tomu říkáš muškátový oříšek?"
 bp1_yearly.5802.c: "Tahle skořice krásně voní!"
 bp1_yearly.5802.d: "Kadidlo by dalo božskou vůni!"
 bp1_yearly.5802.cardamom: "[perfume_bottle.GetDesc], aromatický kardamom"
 bp1_yearly.5802.nutmeg: "[perfume_bottle.GetDesc], pikantní muškátový oříšek"
 bp1_yearly.5802.cinnamon: "[perfume_bottle.GetDesc], hřejivá skořice"
 bp1_yearly.5802.frankincense: "[perfume_bottle.GetDesc], kořeněné kadidlo"
 bp1_yearly.5803.t: "$bp1_yearly.5800.t$: [Select_CString(ROOT.Char.IsFemale,'Silná','Silný')] základ"
 bp1_yearly.5803.desc: "Projíždím kolem prodejce na okraji lesa, který prodává různé druhy dřeva a příbuzné produkty, a pocit rostoucí úzkosti mě zasáhne jen na vteřinu, než se [surprised_sniffer.GetFirstNamePossessive] oči rozsvítí a [surprised_sniffer.GetSheHe] mě přitáhne k nim.\n\n„Teď #EMP tyhle#! by byly přesně to pravé pro naše účely!“ [surprised_sniffer.GetSheHe|U] ukáže na některé z vzácnějších dřev a jejich pryskyřic naskládaných vlevo od obchodníka. „Daly by vůni tak [Select_CString(ROOT.Char.IsFemale,'silná','silný')] základ a vydržely by celý den!“"
 bp1_yearly.5803.a: "Dub je vynikající dřevo!"
 bp1_yearly.5803.b: "Líbí se mi, jak tyto pryskyřice vypadají."
 bp1_yearly.5803.c: "Santalové dřevo? To je neobvyklé."
 bp1_yearly.5803.d: "Nazýváte tyto hobliny 'oud'? Voní sladce!"
 bp1_yearly.5803.oak: "[perfume_bottle.GetDesc], [Select_CString(ROOT.Char.IsFemale,'silná','silný')] dub"
 bp1_yearly.5803.resin: "[perfume_bottle.GetDesc], jantarová pryskyřice"
 bp1_yearly.5803.sandalwood: "[perfume_bottle.GetDesc], hladké santalové dřevo"
 bp1_yearly.5803.oud: "[perfume_bottle.GetDesc], lepivý oud"
 bp1_yearly.5804.t: "$bp1_yearly.5800.t$: Poslední kapka"
 bp1_yearly.5804.desc: "Navzdory sobě jsem si nakonec docela [Select_CString(ROOT.Char.IsFemale,'oblíbila','oblíbil')] hledání ingrediencí pro parfém. S jistým očekáváním se pak dozvím o prodejci v místním městě, který má několik vysoce vzácných a žádaných předmětů, které by mě mohly zajímat.\n\nProhlédnu si zboží. Několik stébel usušené trávy, bílý prášek a... něco, co vypadá jako tupé, drobící se šedé kaménky?\n\nObchodník se na mě očekávavě dívá, zatímco [surprised_sniffer.GetFirstName] zkoumá zboží."
 bp1_yearly.5804.a: "No, alespoň tahle sušená tráva voní dobře."
 bp1_yearly.5804.a.tt: "Nakoupíš vetiver."
 bp1_yearly.5804.b: "Možná by se ten bílý prášek [Select_CString(ROOT.Char.IsFemale,'dala','dal')] dobře zpracovat."
 bp1_yearly.5804.b.tt: "Koupíš kafr."
 bp1_yearly.5804.c: "[Select_CString(ROOT.Char.IsFemale,'Říkala','Říkal')] jsi, že tohle je #EMP velrybí zvratky#!?!"
 bp1_yearly.5804.c.tt: "Koupíš ambra."
 bp1_yearly.5804.d: "Nic z toho nevypadá, že by se hodilo!"
 bp1_yearly.5805.t: "$bp1_yearly.5800.t$: Přitažlivé aroma"
 bp1_yearly.5805.desc: "Po tom, co jsem před pár dny [Select_CString(ROOT.Char.IsFemale,'předala','předal')] místnímu řemeslníkovi všechny nasbírané ingredience, s radostí i napětím rozbaluji kožené pouzdro výsledného parfému.\n\nUvnitř je malá, jednoduchá lahvička obsahující směs barev; zpočátku [ROOT.Char.Custom('GetSimpleColor')], ale když ji přidržíš ke světlu, změní se na [ROOT.Char.Custom('GetComplexColor')].\n\nOdstavuji hrubý zátku a mé čichové smysly jsou pohladěny vůní. Nadšeně přivolám [surprised_sniffer.GetFirstName] a oba obdivujeme vůni, která se vznáší po [ROOT.Char.Custom('GetRoom')]."
 bp1_yearly.5805.a: "Cítím se jako nejbohatší [ROOT.Char.GetWomanMan] na světě!"
 bp1_yearly.5805.b: "Vezmu si trochu; má láska může mít tu celou lahvičku."
 bp1_yearly.5805.vetiver: "[perfume_bottle.GetDesc] a dřevitý, kožovitý vetiver."
 bp1_yearly.5805.camphor: "[perfume_bottle.GetDesc] a bylinný, kořeněný kafr."
 bp1_yearly.5805.ambergris: "[perfume_bottle.GetDesc] a sladká, zemitá ambra."
 bp1_yearly.5805.blended: "[perfume_bottle.GetDesc] a vydává sladkou vůni."
 bp1_yearly.5708.t: "Věrný přítel"
 bp1_yearly.5708.start: "Bloumám rušnou uličkou se svým přítelem [heathen_friend.GetFirstName], když [heathen_friend.GetSheHe] najednou zmizí. Otočím se a vidím [heathen_friend.GetHerHim] hluboce rozmlouvat s obchodníkem, jehož zboží se zdá sestávat převážně z podivných drobností. [heathen_friend.GetFirstNameNoTooltip|U], po dokončeném obchodu, se ke mně pomalu vrátí a roztržitě si přejíždí prstem po novém nákupu.\n\n"
 bp1_yearly.5708.normal: "„Je to náboženská ikona. Ne tvé [ROOT.Char.GetFaith.GetAdjective] víry, můj [heathen_friend.Custom2('RelationToMeShort', ROOT.Char)], ale mé.“ [heathen_friend.GetSheHe] vysvětluje. Úsměv se přehoupne přes [heathen_friend.GetHerHis] tvář, když [heathen_friend.GetSheHe] zahlédne můj vlastní symbol, zavěšený na řetězu kolem mého krku."
 bp1_yearly.5708.aniconist: "„Je to malá tyčinka kadidla, můj [heathen_friend.Custom2('RelationToMeShort', ROOT.Char)]. Shledávám, že mi pomáhá soustředit mysl, když praktikuji svou víru.“ [heathen_friend.GetSheHe] vysvětluje. Úsměv se přehoupne přes [heathen_friend.GetHerHis] tvář, když [heathen_friend.GetSheHe] mě pozoruje."
 bp1_yearly.5708.end: "„Vždycky jsem si [Select_CString(ROOT.Char.IsFemale,'vážila','vážil')], jak se ke mně chováš, přestože máme teologické rozdíly.“"
 bp1_yearly.5708.a: "To je pohanské nesmysl!"
 bp1_yearly.5708.b: "No, když [heathen_friend.GetFirstNameNoTooltip] vlastně není až tak špatný, tak..."
 bp1_yearly.5708.b.tt: "Všichni [GetTrait('zealous').GetName( GetNullCharacter )] jiní-[faith|E] vazalové ztratí #negative_value 10#! [opinion|E] vůči vám"
 bp1_yearly.5708.c: "Možná se od [heathen_friend.GetFirstNameNoTooltip] něco naučím?"
 bp1_yearly.5708.c.tt.success: "Dozvíte se více o [heathen_friend.GetFirstNamePossessiveNoTooltip] způsoby"
 bp1_yearly.5708.c.tt.failure: "Nepodaří se vám pochopit [heathen_friend.GetFirstNamePossessiveNoTooltip] způsoby"
 bp1_yearly.5709.t: "Háček, vlasec..."
 bp1_yearly.5709.desc: "Jaký nádherný den na rybaření! [Select_CString(ROOT.Char.IsFemale,'Měla','Měl')]bych pocit, že nic nemůže setřít úsměv z mé tváře, nebýt hlasu za mnou a mého rybářského parťáka [friend_backup.GetFirstName].\n\n„Podívejte se, koho tu máme!“ [rival_on_sight.GetFirstName], zjevně právě se vrátil z vlastní rybařské výpravy, je obklopen postavou [rival_friend.GetFirstName]. Ten první sáhne dolů a chytne jednoho z jejich čvachtajících úlovků. „Podoba je #EMP ohromující#!!“\n\nOtočím se, abych odcházel s dramatickým přetočením očí, ale #EMP tlukot#! a stekající vlhkost po zadní straně mého krku mě zastaví. Oči [friend_backup.GetFirstNamePossessiveNoTooltip] se zúží, když [friend_backup.GetSheHe] sleduje rybu, která nám byla hozena."
 bp1_yearly.5709.a: "Vyřešíme to pěstmi!"
 bp1_yearly.5709.a.tt.success: "Vyhrajete rvačku"
 bp1_yearly.5709.a.tt.failure: "Prohrajete rvačku"
 bp1_yearly.5709.b: "[rival_on_sight.GetFirstNameNoTooltip], ty [rival_on_sight.Custom('InsultNoun')]! Dueluj se mnou!"
 bp1_yearly.5709.b.tt: "Zahajte $game_concept_single_combat_duel$ s [rival_on_sight.GetFirstNameNoTooltip]"
 bp1_yearly.5709.c: "Nenechám se zatáhnout do dětinské rvačky."
 bp1_yearly.5709.c.tt: "Necháte je při jejich dětinském chování."
 bp1_yearly.5711.t: "...a olůvko"
 bp1_yearly.5711.desc: "[rival_on_sight.GetFirstName] se po našem souboji rozklepe na nohou, stále pošetile vzdorný. [rival_on_sight.GetSheHe|U] otevírá [rival_on_sight.GetHerHis] ústa, aby si postěžoval, ale sotva stačí vyslovit slovo, než mu ta samá ústa naplním rybou, která byla nedávno použita jako projektil. Vrávorající, [rival_on_sight.GetFirstNameNoTooltip] se nebezpečně zakymácí směrem k okraji mola.\n\n[Select_CString(ROOT.Char.IsFemale,'Udělala','Udělal')] jsem rychlý krok vpřed a pevně mu vrazím nohu do břicha. Na okamžik, který se zdá jako věčnost, [rival_on_sight.GetSheHe] visí ve vzduchu: paže se točí, oči vyvalené, ryba pevně na obličeji, než náhle padá přímo dolů.\n\nHrozný šplouch vyvolá velikou vodní fontánu a zděšený [rival_friend.GetFirstName] se rozběhne k okraji mola, aby natáhl ruku k svému dusícímu se příteli."
 bp1_yearly.5711.a: "Ty do toho můžeš taky!"
 bp1_yearly.5711.b: "Ha, ha! Tak ti to patří!"
 bp1_yearly.5712.t: "Něco se pokazilo?"
 bp1_yearly.5712.desc: "Rozzuřeně se zvednu, abych čelil posměškům [rival_on_sight.GetFirstName] a [rival_on_sight.GetHerHis] kumpána [rival_friend.GetFirstName]. Nejistý na nohou však při pokusu namířit prst do [rival_on_sight.GetFirstNamePossessiveNoTooltip] hrudi minu [rival_on_sight.GetHerHim] úplně. Stačil jen švih kotníkem a najednou se mi zrak znovu zaclání hlínou.\n\n[rival_on_sight.GetFirstNameNoTooltip], rozjařeně se šklebí, sarkasticky tleská, když se kutálím na záda. Můj hněv znovu vzplane, ale sotva usednu do sedu, zasáhne mě zatracená ryba přímo do obličeje s ozvěnným #EMP plácnutím#!! [rival_on_sight.GetFirstNameNoTooltip] a [rival_friend.GetFirstNameNoTooltip] propuknou v hřmění smíchu, když odcházejí, a nechávají starostlivého [friend_backup.GetFirstName], aby mě konečně vytáhl na nohy."
 bp1_yearly.5712.a: "Nezapomenu na to, [rival_on_sight.GetFirstNameNoTooltip]!"
 bp1_yearly.5712.b: "Možná bych se [Select_CString(ROOT.Char.IsFemale,'měla','měl')] raději držet z cesty [rival_on_sight.GetHerHis]..."
 bp1_yearly.5713.t: "Nerozvážné vztahy"
 bp1_yearly.5713.desc: "Hned jak jsme spolu v posteli, poznám, že je s mou [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('destitute_spouse'))] [destitute_spouse.GetFirstName] něco v nepořádku. [destitute_spouse.GetSheHe|U] je zjevně rozptýlený(á) a já jemně sevřu [destitute_spouse.GetHerHis] ruku, když se ptám, co se děje.\n\n„Je to... záležitost peněz.“ [destitute_spouse.GetSheHe] povzdechne a druhou rukou si přejede po hlavě. „Mám rodinu, které se nedaří, a hrozí jim ztráta domova. Jako dítě jsem tam [Select_CString(ROOT.Char.IsFemale,'trávila','trávil')] čas...“\n\n[destitute_spouse.GetSheHe|U] se na mě prosícně dívá. „Je... je něco, co můžeme udělat? Jsem si [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')](á), že by nám to mohli vrátit, jen potřebují opět stát na nohou. Budou to schopni splatit, přísahám!“"
 bp1_yearly.5713.a: "Postarám se o to. A teď mi dovol, abych se s tebou #EMP vypořádal#!..."
 bp1_yearly.5713.b: "Mohou mít vše, co potřebují, a ještě víc."
 bp1_yearly.5713.c: "Nech to na mně."
 bp1_yearly.5713.d: "Jak se opovažuješ mě vydírat?!"
 bp1_yearly.5714.t: "Loučení"
 bp1_yearly.5714.desc: "V mém srdci je hluboká a nekonečná díra.\n\n[deceased_pal.GetFirstName] [Select_CString(deceased_pal.IsFemale,'byla','byl')] stálým společníkem a důvěrníkem, a mít [deceased_pal.GetHerHim] vyrvaného z mého života působí jako smrtelná rána, z níž se nikdy nezotavím. V ruce svírám lístek, který mi [Select_CString(deceased_pal.IsFemale,'dala','dal')] — ten #EMP poslední#! lístek, který mi [deceased_pal.GetSheHe] kdy dá, uvědomuji si to hořce. Snažím se ho přečíst, ale vše, co dokážu, je odtáhnout ho od obličeje, aby drahé slova v něm nebyla smyta mými slzami.\n\nI když je kolem mě mnoho truchlících, nikdy jsem se [Select_CString(ROOT.Char.IsFemale,'necítila','necítil')] tak osaměle."
 bp1_yearly.5714.a: "Nikdy na tento den nezapomenu."
 bp1_yearly.5714.a.catharsis: "#weak Poznáte určitý stupeň katarze#!"
 bp1_yearly.5714.a.sad: "#weak Váš smutek se volně projevuje#!"
 bp1_yearly.5714.a.reallysad: "#weak Smutek vás přemáhá#!"
 bp1_yearly.5714.a.depressed: "#weak Upadáte do deprese#!"
 bp1_yearly.5714.b: "Musím být [Select_CString(ROOT.Char.IsFemale,'silná','silný')] a jít dál."
 bp1_yearly.5715.t: "Blebetající blázen"
 bp1_yearly.5715.desc: "„Ne! To prostě není tak, jak to vyslovujete! Vznešený učenec, který #EMP vynalezl#! to slovo, [Select_CString(ROOT.Char.IsFemale,'řekla','řekl')], že se vyslovuje tak, jak to říkám já—“\n\nSe svým [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('gibbet_friend'))] [gibbet_friend.GetFirstName] vedu zuřivou debatu, která nejeví známky ústupu. Když jsme minuli poblíž stojící šibenici, o tom [Select_CString(gibbet_friend.IsFemale,'poznamenala','poznamenal')]. Jako plynulý mluvčí [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] jazyka jsem [gibbet_friend.GetHerHim] jemně [Select_CString(ROOT.Char.GetCulture.GetLanguage.IsFemale,'opravila','opravil')] v [gibbet_friend.GetHerHis] výslovnosti — začíná to tvrdým zvukem, ne měkkým, #EMP samozřejmě#! — a [Select_CString(gibbet_friend.IsFemale,'měla','měl')] drzost nesouhlasit, a to hlasitě!\n\n„Nemohu uvěřit, že stále trváš na tom svém [ROOT.Char.Custom('InsultAdjective')] lingvistickém postoji!“ vyhrkne [gibbet_friend.GetSheHe], frustrovaný(á) mým trváním."
 bp1_yearly.5715.a: "Dohodneme se, že nesouhlasíme."
 bp1_yearly.5715.b: "Je to tak, jak říkám. A tím to končí!"
 bp1_yearly.5715.c: "Je to 'gibbet' a dokážu to!"
 bp1_yearly.5715.c.tt.success: "Vyhrajete debatu"
 bp1_yearly.5715.c.tt.failure: "Prohrajete debatu"
 bp1_yearly.5716.t: "Pryč, [ROOT.Char.GetFaith.random_EvilGodNames]!"
 bp1_yearly.5716.desc: "Při pobíhání po mém [ROOT.Char.Custom('GetCourt')] zaslechnu zvednutý hlas, téměř na pokraji hněvu. Otočím se a před sebou spatřím neobvyklou scénu. [book_burner.GetFirstName] stojí, vztyčen nad mým [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('book_child'))] [book_child.GetFirstName], vynadává mu/ji, zatímco můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('book_burner'))] hází další knihu do chřestivého ohně.\n\n„Už si nebudeš číst žádný z těchto #EMP nečistých škvárů#!!“ huláká [book_burner.GetSheHe], odsuzuje další knihu k plamenům. „Žádné dítě v tomto domě nebude pod vlivem [ROOT.Char.GetFaith.DevilNamePossessive]!“"
 bp1_yearly.5716.nobook: "\n\nZvednu knihu ze hromady, kterou [book_burner.GetFirstNameNoTooltip] [Select_CString(book_burner.IsFemale,'označila','označil')] k zničení, a najdu v ní jen neškodný obsah o... stavění malých hradečků z hlíny?"
 bp1_yearly.5716.yesbook: "\n\nZvednu [burned_book.GetName] z hromady, kterou [book_burner.GetFirstNameNoTooltip] [Select_CString(book_burner.IsFemale,'označila','označil')] k zničení, ve stejný okamžik, kdy ho [book_burner.GetSheHe] také chytne."
 bp1_yearly.5716.a: "Tento hřích nesmí zůstat!"
 bp1_yearly.5716.b: "Dobře, cokoliv pro udržení míru..."
 bp1_yearly.5716.c: "Přestaňte s tím okamžitě! Dítě se musí učit!"
 bp1_yearly.5717.t: "Opilá rvačka"
 bp1_yearly.5717.desc: "Hostinec v [tavern_county.GetNameNoTier] je obvykle ideálním místem k zapomenutí na starosti, ale dnes večer je výjimka.\n\nJaké neštěstí — sedí jen u stolu vedle nás s [bff_defender.GetFirstName] moje [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('5717_nemesis'))], [5717_nemesis.GetFirstName], a [5717_nemesis.GetSheHe] je obtěžující už od našeho příchodu. Stačilo jedno další „náhodné“ rozlití [5717_nemesis.GetHerHis] [5717_nemesis.Custom('RegionalDrink')] na mé rameno a najednou [Select_CString(ROOT.Char.IsFemale,'byla','byl')] [bff_defender.GetFirstNameNoTooltip] na nohou.\n\n[5717_nemesis.GetFirstNameNoTooltip] se pak postaví a ti dva se už, poměrně opile, chystají na rvačku, než se stačím postavit i já."
 bp1_yearly.5717.a: "Udeř [5717_nemesis.GetHerHim] do tváře, [bff_defender.GetFirstNameNoTooltip]!"
 bp1_yearly.5717.a.tt.win: "[bff_defender.GetNameNoTooltip] vyhrává rvačku"
 bp1_yearly.5717.a.tt.lose: "[bff_defender.GetNameNoTooltip] prohrává rvačku"
 bp1_yearly.5717.b: "[5717_nemesis.GetSheHe|U] nestojí za to, kámo!"
 bp1_yearly.5717.c: "Ustup; [5717_nemesis.GetFirstNameNoTooltip] je můj."
 bp1_yearly.5717.c.tt: "#weak Vy dva si vezmete svůj spor ven...#!"
 bp1_yearly.5717.c.tt.duel: "Začíná [single_combat_duel|E] mezi tebou a [5717_nemesis.GetFirstNameNoTooltip]"
 bp1_yearly.5718.t.win: "[Select_CString(ROOT.Char.IsFemale,'Vyhrála','Vyhrál')] jste rvačku"
 bp1_yearly.5718.t.lose: "[Select_CString(ROOT.Char.IsFemale,'Prohrála','Prohrál')] jste rvačku"
 bp1_yearly.5719.t: "Daňová dilemata"
 bp1_yearly.5719.start: "Už několik dní si můj kancléř [chancellor.GetFirstName] všímal, že se v příjmech ztrácí drobný proud peněz. Teď, když vidím důkazy, svolávám svého vazala [disloyal_vassal.GetFirstName], aby vysvětlil, o co jde.\n\nDůkazy [chancellor.GetFirstNamePossessiveNoTooltip] byly přesvědčivé a nevyvratitelné; [disloyal_vassal.GetFirstNameNoTooltip] zpronevěřoval daně určené pro mě!"
 bp1_yearly.5719.normal: "Zkorumpovaný [disloyal_vassal.GetTitleAsNameNoTooltip|l] se nesnaží bránit [disloyal_vassal.GetHerselfHimself], pyšně se usmívá.\n\n„To je všechno pravda, můj [ROOT.Char.GetLadyLord]. [Select_CString(ROOT.Char.IsFemale,'Toužila','Toužil')] jsem po tlustších pokladnicích.“\n\nJe to otevřená výzva mé autoritě."
 bp1_yearly.5719.terrified: "Zkorumpovaný [disloyal_vassal.GetTitleAsNameNoTooltip|l] se pokouší bránit [disloyal_vassal.GetHerselfHimself], ale marně hledá slova a chvěje se před mým hněvem.\n\nVidím strach v očích [disloyal_vassal.GetHerHis], když před ním/ní kráčím sem a tam a předstírám, že vážím své rozhodnutí."
 bp1_yearly.5719.a: "Vrátíš ty peníze a budeš si pamatovat tento den!"
 bp1_yearly.5719.a.tt.dread: "#medium Tato možnost je vám dostupná díky vysoké úrovni [dread|E]#!"
 bp1_yearly.5719.b: "Vrať ty peníze. Hned."
 bp1_yearly.5719.b.tt.win: "[disloyal_vassal.GetFirstNameNoTooltip] mrzutě vrátí peníze"
 bp1_yearly.5719.b.tt.lose: "[disloyal_vassal.GetFirstNameNoTooltip] otevřeně pohrdá vaším požadavkem"
 bp1_yearly.5719.c: "Možná bychom se mohli dohodnout na kompromisu?"
 bp1_yearly.5719.d: "Jen... jen to znovu nedělej!"
 bp1_yearly.5720.t: "Zkouška síly"
 bp1_yearly.5720.desc: "U tohoto jídla jsem [Select_CString(ROOT.Char.IsFemale,'vypila','vypil')] několik šálků [ROOT.Char.Custom('RegionalDrink')], ale prokletá přítomnost [rival_challenger.GetFirstName] mi pokazí večer.\n\n„Ty [ROOT.Char.Custom('InsultNoun')]! Ty [ROOT.Char.Custom('InsultNoun')]!“ [rival_challenger.GetSheHe] řve. „Nedokázal bys porazit dítě v zkoušce síly! [Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')] bych ti právě teď přitlačit ruku ke stolu bez sebemenší námahy!“"
 bp1_yearly.5720.a: "Samozřejmě; s naší #EMP levou#! rukou, že?"
 bp1_yearly.5720.a.tt: "To mi možná nezíská oblibu u [THIS.Char.Custom('GetCourt')], ale bude to #EMP skvělé#!..."
 bp1_yearly.5720.b: "Ha! Ha! Tak pojď!"
 bp1_yearly.5720.b.tt.win: "Porazíte [rival_challenger.GetNameNoTooltip] s pohrdavou lehkostí"
 bp1_yearly.5720.b.tt.bigwin: "Zlomíte [rival_challenger.GetNamePossessiveNoTooltip] ruku"
 bp1_yearly.5720.c: "Dokaž to, ty [rival_challenger.Custom('InsultNoun')]!"
 bp1_yearly.5720.c.tt.win: "Porazíte [rival_challenger.GetFirstNameNoTooltip]"
 bp1_yearly.5720.c.tt.lose: "[rival_challenger.GetFirstNameNoTooltip] přitlačí vaši paži ke stolu"
 bp1_yearly.5720.d: "Nenechám se zatáhnout do těchto malicherných her."
 bp1_yearly.5721.t: "U ohně"
 bp1_yearly.5721.desc: "Jaký nádherný večer! Táborák praská a plive kouř do noční oblohy. Medový pamlsek napíchnutý na konci mé tyčky se pomalu karamelizuje a se zájmem sleduji jeho pomalu se měnící barvu.\n\nVedle mě [marshmallow_friend.GetFirstName] dělá totéž, zatímco dospělí pijí [ROOT.Char.Custom('RegionalDrink')] a baví se vyprávěním příběhů o událostech dávno před naším narozením.\n\nS [marshmallow_friend.GetSheHe|U] jsme si dřív moc nemluvili, ale bylo by hezké si konečně popovídat s někým přibližně v mém věku..."
 bp1_yearly.5721.a: "Chceš... chceš být přátelé, [marshmallow_friend.GetFirstNameNoTooltip]?"
 bp1_yearly.5721.a.tt.yes: "Navážete přátelství"
 bp1_yearly.5721.a.tt.no: "[marshmallow_friend.GetFirstNameNoTooltip] nemá zájem"
 bp1_yearly.5721.b: "To bylo zábavné!"
 bp1_yearly.5721.c: "[Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')] bych si dát další pamlsek..."
 bp1_yearly.5721.c.tt: "S drobným rozptýlením byste pravděpodobně [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] ukrást sladkost, kterou [marshmallow_friend.GetSheHe] opéká..."
 bp1_yearly.5722.t: "Kočkopult"
 bp1_yearly.5722.desc: "„Setkáváme se znovu, [ROOT.Char.GetFirstName], ty [ROOT.Char.Custom('InsultNoun')]!“ šklebí se můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rival_catapulter'))], [rival_catapulter.GetFirstName], když mě oslovuje, zatímco prohlížím nějaké nové vojenské vybavení. „Konečně, my dva lidé cti, setkáváme se na rovných podmínkách — haha! Mám tě!“\n\nTrvá mi chvilku, než pochopím, že [rival_catapulter.GetFirstNameNoTooltip] právě nabral mou kočku [ROOT.Char.Custom('CatStoryName')], a o chvíli později si uvědomím, že [rival_catapulter.GetSheHe] se dává na útěk. Když překonám šok, běžím za [rival_catapulter.GetFirstNameNoTooltip], jen abych ho/ji našel/našla, jak nakládá mou milovanou kočku do nedalekého katapultu!\n\nUčiním krok vpřed, ruka natažená, ale je pozdě.\n\n„Mraaaao#DIE1 ooooo#!#DIE2 oooowwww—#!“"
 bp1_yearly.5722.a: "To si nedovolíš!"
 bp1_yearly.5722.a.tt: "Svrhnete [rival_catapulter.GetFirstNameNoTooltip] na zem dřív, než uteče"
 bp1_yearly.5722.b: "[ROOT.Char.Custom('CatStoryName')]! #EMP Neeee!#!"
 bp1_yearly.5722.c: "Dostanu tě, [rival_catapulter.GetFirstNameNoTooltip]! PŘISAHÁM!"
 bp1_yearly.5723.t: "Dlouhý výstřel"
 bp1_yearly.5723.desc: "[rival_catapulter.GetFirstNamePossessive] oči se roztáhnou překvapením a strachem, když [rival_catapulter.GetHerHim] svrhnu na zem.\n\n„[Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')] jsi mi ublížit,“ pronesu, znovu vstanu a požádám shromážděné stráže o provaz.\n\n„Dokonce bys [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] ublížit i mé rodině,“ pokračuji a svazuji bezmocnému zajatci ruce a nohy.\n\n„Ale [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')] jsi osudnou chybu, když jsi ublížil #EMP [ROOT.Char.Custom('CatStoryName')]#!.“ [rival_catapulter.GetFirstNameNoTooltip], [Select_CString(rival_catapulter.IsFemale,'svázaná','svázaný')] a třesoucí se, otevírá [rival_catapulter.GetHerHis] ústa, aby se prosil(la).\n\nSahám po páce."
 bp1_yearly.5723.a: "#EMP Bwoing!#!"
 bp1_yearly.5723.b: "Ušetřím tě. Kvůli [ROOT.Char.Custom('CatStoryName')]."
 bp1_yearly.5724.t: "[ROOT.Char.Custom('CatStoryName')]: Kočičí pohoda"
 bp1_yearly.5724.desc: "Poslední tři dny jsem [Select_CString(ROOT.Char.IsFemale,'byla','byl')] pod temným mrakem. Můj drahý, nevinný [ROOT.Char.Custom('CatStoryName')]... je, jako bych občas [Select_CString(ROOT.Char.IsFemale,'slyšela','slyšel')] mňoukání i teď.\n\nNe, počkej... #EMP opravdu slyším#! mňoukání. Přísahám, že to slyším! V nadšení klopýtám přes malý stolek po holeně. Nadávám a vyhrabu se na nohy. Další mňouk, tentokrát hlasitější a žalostný. Konečně dobiju ke dveřím a prudce je otevřu a najdu [ROOT.Char.Custom('CatStoryName')] sedící tam: v bezpečí, v pořádku a velmi rozčílený!\n\nOkamžitě svého milovaného kocoura svírám v náruči a zabořím obličej do špinavé, větvemi poseté srsti.\n\n[ROOT.Char.Custom('CatStoryName')] se v mé náruči zuřivě brání."
 bp1_yearly.5724.a: "[ROOT.Char.Custom('CatStoryName')]! Jsi #EMP naživu!#!"
 bp1_yearly.5724.b: "Už tě nikdy nepustím!"
 bp1_yearly.5725.t: "Divoký [khutulun.GetWomanMan|U]"
 bp1_yearly.5725.desc: "„#EMP Jaktože#![Select_CString(ROOT.Char.IsFemale,'slyšela','slyšel')] jsi o [khutulun.GetHerHim], můj [ROOT.Char.GetLadyLord]?“\n\nOdfrknu a zavrtím hlavou. Říct, že výmysly [matchmaker_courtier.GetFirstName] jsou mi právě teď pod úroveň, by bylo slabé vyjádření.\n\n„Prý má [khutulun.GetSheHe] otevřenou výzvu pro kohokoli, kdo by [Select_CString(ROOT.Char.IsFemale,'byla','byl')] vhodný pro mého [ROOT.Char.GetLadyLord]!“ snaží se znovu [matchmaker_courtier.GetFirstNameNoTooltip], tentokrát naléhavěji. Sníží hlas spiklenecky a pokračuje. „Poslyš, vím, že tě všechny manželské otázky unavují. Tenhle [khutulun.GetWomanMan] nabízí svou ruku v manželství komukoli, kdo [khutulun.GetHerHim] přemůže v tělesné zdatnosti.“\n\nUsednu a zvážím ten příběh. Válečně laděný [khutulun.GetWomanMan]? Jistě z toho mohu vyjít vítězně a získat nového [khutulun.GetWifeHusband] po svém boku, bez ohledu na jeho/její dovednosti."
 bp1_yearly.5725.a: "Dobře, [matchmaker_courtier.GetFirstNameNoTooltip], vyrazíme to prozkoumat."
 bp1_yearly.5725.b: "Dost tvých vymyšlených historek!"
 bp1_yearly.5726.t: "Potlučený [khutulun.Custom('GetBrideGroom')|U]"
 bp1_yearly.5726.desc: "Po dlouhém dni jízdy dorazíme na místo, o kterém [matchmaker_courtier.GetFirstName] [Select_CString(matchmaker_courtier.IsFemale,'slyšela','slyšel')], že se tam náš cíl často zdržuje, a najdeme překvapivou scénu. Šikovný [khutulun.GetWomanMan] právě zápasí s mnohem větším [dummy_gender.GetWomanMan].\n\nNormálně by se to vůbec nezdálo jako férový souboj, ale o okamžik později zápas končí překvapivě; první postava, široce se usmívající, pomůže soupeři vstát, než přehodí pohled na mě.\n\n„[Select_CString(ROOT.Char.IsFemale,'Neviděla','Neviděl')] jsem tě tady v okolí!“ [khutulun.GetSheHe] se šklebí, když se ke mně obrací, skláníc se s ironickým, přehnaným úklonem. „Jmenuji se [khutulun.GetFirstName]. Vím, proč tu jsi, ale dovol mi varovat tě: kdo mi ztrácí čas, musí mi zaplatit za mé potíže.“"
 bp1_yearly.5726.a: "Pozdravuj svého nového [ROOT.Char.GetWifeHusband], [khutulun.GetFirstNameNoTooltip]!"
 bp1_yearly.5726.a.tt.win: "Porazíte [khutulun.GetFirstNameNoTooltip]"
 bp1_yearly.5726.a.tt.lose: "[khutulun.GetSheHe|U] vás přemůže"
 bp1_yearly.5726.b: "Zde může být opatrnost lepší než odvaha..."
 bp1_yearly.5727.t: "Svatba?"
 bp1_yearly.5727.desc: "[khutulun.GetFirstName] unaveně odfukne, když se znovu od sebe odtahujeme. Ani já se s tím moc lépe nevyrovnávám; je jasné, proč je [khutulun.GetSheHe] stále svobodný(á). [khutulun.GetSheHe|U] se usmívá, spokojený(á) s výzvou.\n\n„[Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] bys pro mě dobrým [ROOT.Char.GetWomanMan]!“ poznamená [khutulun.GetSheHe], aniž by [Select_CString(ROOT.Char.IsFemale,'odtrhla','odtrhl')] zrak od mých pohybů. „Je škoda, že tě musím zklamat!“\n\n[khutulun.GetFirstNameNoTooltip] znovu vyráží vpřed, ale tentokrát jsem [Select_CString(khutulun.IsFemale,'připravena','připraven')]. Hbitý krok stranou srazí [khutulun.GetHerHim] z rovnováhy a zaháknutá noha ho/ji přehodí.\n\n[khutulun.GetHerHis|U] obličej je směsicí šoku, údivu a vzrušení, když mu/ji nabídnu ruku."
 bp1_yearly.5727.a: "Dobře, dohoda je dohoda."
 bp1_yearly.5727.b: "Tak, [Select_CString(ROOT.Char.IsFemale,'dosáhla','dosáhl')] jsem všeho, co jsem tu [Select_CString(ROOT.Char.IsFemale,'potřebovala','potřeboval')]."
 bp1_yearly.5727.c: "Jen to nejlepší pro [khutulun.GetFirstNameNoTooltip]!"
 bp1_yearly.5728.t: "Hořící rivalita"
 bp1_yearly.5728.desc: "Jiskry táboráku líně stoupají do noční oblohy s kouřem, ale nemohu si scenérii užívat jako obvykle.\n\nMůj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rival_burner'))] [rival_burner.GetFirstName] stojí triumfálně před ohněm a vyzývá mě, abych [Select_CString(rival_burner.IsFemale,'přišela','přišel')]. V [rival_burner.GetHerHis] ruce drží můj vlastní artefakt: [burned_artifact.GetName], ukradený mi tím hadem.\n\n„Ani krok blíž, [ROOT.Char.GetFirstName]!“ volá [rival_burner.GetSheHe]. „Tvůj cenný drobeček shoří, pokud uděláš sebemenší pohyb!“\n\n„[rival_burner.GetFirstNameNoTooltip]!“ křičím. „Vrať mi, co je moje, a nebudeme dál bojovat!“ [rival_burner.GetFirstNameNoTooltip] se jen zubí a přesune můj předmět nad oheň."
 bp1_yearly.5728.a: "Spal to tedy, ty [rival_burner.Custom('InsultNoun')]!"
 bp1_yearly.5728.b: "Krádež? Bojíš se mi postavit?"
 bp1_yearly.5728.b.tt.duel: "Začíná [single_combat_duel|E] mezi tebou a [rival_burner.GetFirstNameNoTooltip]"
 bp1_yearly.5729.tt.lose: "[rival_burner.GetFirstNameNoTooltip] spálí předmět"
 bp1_yearly.5730.t: "Kde je kouř..."
 bp1_yearly.5730.desc: "[rival_burner.GetFirstName] se po našem souboji s obtížemi zvedá na nohy, otlučený a potlučený. [rival_burner.GetHerHis|U] oči hoří stejně jasně jako táborák, vedle kterého stojí, když mě spatří, jak si schovávám svůj [burned_artifact.GetName] pod paži.\n\nKdyž se naši společníci vrací ze svého dřívějšího stanoviště kousek dál, jejich konverzace pomalu utichá, když nás najdou tváří v tvář, jednoho vítězného, druhého poraženého.\n\nPodívám se na svůj [burned_artifact.GetNameNoTooltip] a pak zpět na [rival_burner.GetWomanMan], který riskoval život i končetiny, aby ho spálil."
 bp1_yearly.5730.a: "Ať ti to poslouží jako ponaučení."
 bp1_yearly.5730.b: "Vezmi si to. Ať ti to vždy připomíná tuto noc."
 bp1_yearly.5730.b.tt: "[burned_artifact.GetName] získává #N negativní#! modifikátory"
 bp1_yearly.8000.t: "Vysněný nárok"
 bp1_yearly.8000.desc: "[bp1_8000_informer.GetTitledFirstName], můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bp1_8000_informer'))], se celý den obává a zjevně se snaží najít ta správná slova. \n\nNakonec, když jdeme k jídlu, [bp1_8000_informer.GetSheHe] nesměle začne: „Můj [bp1_8000_informer.Custom2('RelationToMeShort', ROOT.Char)]...“"
 bp1_yearly.8000.desc_vassal: "Říkají, že [bp1_8000_new_rival.GetTitledFirstName], tvůj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bp1_8000_new_rival'))], bere své údajn é nároky na tvé země vážněji každým dnem..."
 bp1_yearly.8000.desc_foreign: "Slyším zvěsti, že [bp1_8000_new_rival.GetFirstName], [bp1_8000_new_rival.GetTitleAsNameNoTooltip] z [bp1_8000_new_rival.GetPrimaryTitle.GetBaseNameNoTier], si vás začal považovat za cíl svého nepřátelství..."
 bp1_yearly.8000.desc_single: "\n\n„[bp1_8000_new_rival.GetSheHe|U] otevřeně mluví o 'nelegitimním [ROOT.Char.GetTitleAsNameNoTooltip] z [bp1_8000_claimed_title.GetNameNoTier]', který denně připravuje [bp1_8000_new_rival.GetHerHis] o jeho/její právem náležející země a příjmy.“"
 bp1_yearly.8000.desc_multi: "\n\n„[bp1_8000_new_rival.GetSheHe|U] trvá na tom, že [bp1_8000_new_rival.GetSheHe] pociťuje osobní křivdu z vašeho pokračujícího panování nad [bp1_8000_new_rival.GetHerHis] právoplatným územím, zejména [bp1_8000_claimed_title.GetNameNoTier].“"
 bp1_yearly.8000.a: "Ha! Ten jedovatý [bp1_8000_new_rival.Custom('InsultNoun')]!"
 bp1_yearly.8000.b: "Okamžitě napíšu [bp1_8000_new_rival.GetFirstNameNoTooltip]."
 bp1_yearly.8000.b.success: "Váš dopis zmírnil [bp1_8000_new_rival.GetTitledFirstNameNoTooltip]"
 bp1_yearly.8000.b.failure: "[bp1_8000_new_rival.GetTitledFirstNameNoTooltip] ignoruje váš dopis"
 bp1_yearly.8000.c: "Takže je to velezrada."
 bp1_yearly.8000.c.success: "Vaši muži zatknou [bp1_8000_new_rival.GetTitledFirstNameNoTooltip]"
 bp1_yearly.8000.c.failure: "[bp1_8000_new_rival.GetTitledFirstNameNoTooltip] unikne"
 bp1_yearly.8000.d: "Jistě jen bezvýznamné tlachy."
 bp1_yearly.8000.d.rival: "Pověsti byly pravdivé"
 bp1_yearly.8000.d.bluff: "[bp1_8000_new_rival.GetTitledFirstNameNoTooltip] blafoval"
 bp1_yearly_8000_trusting_modifier: "Důvěřivý panovník"
 bp1_yearly_8000_trusting_modifier_desc: "Tato postava je známá tím, že dává svým poddaným výhodu pochybnosti."
 bp1_yearly.8010.opening: "[bp1_8010_best_friend.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp1_yearly.8010.desc: "Každý den děkuji [bp1_8010_best_friend.GetFaith.HighGodName], že mám tak skvělého [ROOT.Char.Custom('GetFriendNoun')] jako jsi ty — je málokdo, komu mohu bez obav věřit. \n\nMěli bychom sladit naše zájmy těsněji a bojovat bok po boku. Pojď, [ROOT.Char.GetFirstNameNoTooltip], naši nepřátelé uvidí, že si s námi nelze zahrávat!"
 bp1_yearly.8010.a: "Ano! Budeš mít mou [bp1_8010_best_friend.Custom('SignatureWeaponNameOrType')]!"
 bp1_yearly.8010.b: "Nejsem si [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')] ohledně [bp1_8010_best_friend.GetFirstNameNoTooltip]..."
 bp1_yearly.8020.opening: "[bp1_8020_friend.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp1_yearly.8020.desc: "[Select_CString(ROOT.Char.IsFemale,'Slyšela','Slyšel')] jsem o tvých sporech s tím [bp1_8020_rival.Custom('InsultAdjective')] [bp1_8020_rival.Custom('InsultNoun')], [bp1_8020_rival.GetFirstName], zcela pohrdavý případ [bp1_8020_rival.GetWomanMan].\n\nVzhledem k našim společným zájmům si jsem [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')], že si rozumíme, příteli."
 bp1_yearly.8020.a: "Těším se na příležitost to dále probrat."
 bp1_yearly.8020.b: "Poslové jsou v těchto dnech tak nespolehliví..."
 bp1_yearly.8020.b.flavor: "Přepošlete dopis [bp1_8020_rival.GetTitledFirstNameNoTooltip]"
 bp1_yearly.8020.b.joke: "[bp1_8020_rival.GetTitledFirstNameNoTooltip] ocení vaši otevřenost"
 bp1_yearly.8020.b.insult: "Zpráva rozzuří [bp1_8020_rival.GetTitledFirstNameNoTooltip]"
 bp1_yearly.8020.c: "To je nízký tah od nízkého hráče."
 bp1_yearly.8020.d: "Nejsi mým přítelem, [bp1_8020_friend.GetFirstNameNoTooltip]."
 bp1_yearly.8040.t: "Naprosto protikladní"
 bp1_yearly.8040.desc.opening: "Můj dobrý společníku, [bp1_yearly_8040_friend.GetTitledFirstName], se ke mně posledních pár dní choval odtažitě, každou noc se vyhýbal mému pozvání k večeři.\n\nDnes mě [bp1_yearly_8040_friend.GetSheHe] zastihne o samotě v mém [ROOT.Char.Custom('GetChamber')]. „[ROOT.Char.GetFirstNameNoTooltip], omlouvám se, ale musím ti to říct jako přítel.“\n\n„Tvé"
 bp1_yearly.8040.desc.diligent: "neustálé pracovní vytížení a nároky na výsledky"
 bp1_yearly.8040.desc.brave: "zbytečné riskování a odvaha"
 bp1_yearly.8040.desc.just: "pečlivé rozsudky a zkoumání důkazů"
 bp1_yearly.8040.desc.compassionate: "citlivost k utrpení a péče o druhé"
 bp1_yearly.8040.desc.fickle: "časté změny názorů a snadná přemluvitelnost"
 bp1_yearly.8040.desc.temperate: "odtažitost od banketního stolu"
 bp1_yearly.8040.desc.generous: "volná peněženka pro každého, kdo o pomoc požádá"
 bp1_yearly.8040.desc.humble: "skromné zlehčování vlastní důležitosti"
 bp1_yearly.8040.desc.honest: "odmítání klamat ostatní i když je to nutné"
 bp1_yearly.8040.desc.forgiving: "přehlížení urážek a snášenlivost k nevděčnosti"
 bp1_yearly.8040.desc.wrathful: "zlá povaha a neustálé výbuchy hněvu"
 bp1_yearly.8040.desc.calm: "klid v tváři oprávněných rozhořčení"
 bp1_yearly.8040.desc.cynical: "skepticismus ohledně [ROOT.Char.GetFaith.HighGodNamePossessive] božího plánu"
 bp1_yearly.8040.desc.zealous: "touha následovat [ROOT.Char.GetFaith.AltPriestTermPlural]"
 bp1_yearly.8040.desc.paranoid: "nekonečné pochybnosti o motivacích druhých"
 bp1_yearly.8040.desc.trusting: "neochvějná důvěra v motivy ostatních"
 bp1_yearly.8040.desc.shy: "nechuť mluvit s ostatními"
 bp1_yearly.8040.desc.gregarious: "rozptýlení prázdnou konverzací a veselím"
 bp1_yearly.8040.desc.lustful: "otroctví svým chtíčům a pokušením"
 bp1_yearly.8040.desc.chaste: "nechuť k tělesným radovánkám"
 bp1_yearly.8040.desc.impatient: "bezhlavý zvyk pouštět se do věcí"
 bp1_yearly.8040.desc.patient: "přehnaná opatrnost a pomalá reakce na události"
 bp1_yearly.8040.desc.content: "nedostatek snahy uspět a překonat své vrstevníky"
 bp1_yearly.8040.desc.ambitious: "neúprosné nutkání postupovat vpřed bez konce"
 bp1_yearly.8040.desc.closing: "— to tě staví do špatného světla. Jistě přece musíš vidět, že [ROOT.Char.GetTitleAsNameNoTooltip]u to nesluší, když se tak chováš?„"
 bp1_yearly.8040.a: "Jak si #EMP dovoluješ#! se mnou tak mluvit? Vypadni!"
 bp1_yearly.8040.a.lazy: "Můžeme o tom mluvit později?"
 bp1_yearly.8040.a.diligent: "Musím to jen dokončit a pak si promluvíme."
 bp1_yearly.8040.a.craven: "Riskování je pro blázny."
 bp1_yearly.8040.a.brave: "Působí na mě to jako zbabělost."
 bp1_yearly.8040.a.arbitrary: "Mohu se chovat, jak chci."
 bp1_yearly.8040.a.just: "Nebylo by správné jednat jinak."
 bp1_yearly.8040.a.callous: "Ach, prosím, zmlkni."
 bp1_yearly.8040.a.compassionate: "Neztvrdím své srdce."
 bp1_yearly.8040.a.stubborn: "Nezměníš můj názor."
 bp1_yearly.8040.a.fickle: "Dobře, jak chceš!"
 bp1_yearly.8040.a.gluttonous: "Probereme to po večeři."
 bp1_yearly.8040.a.temperate: "Všeho s mírou."
 bp1_yearly.8040.a.greedy: "Cože, a nechat ostatní vzít si #EMP mé#! mince?"
 bp1_yearly.8040.a.generous: "Je toho dost pro všechny."
 bp1_yearly.8040.a.arrogant: "Já jsem [ROOT.Char.GetTitleAsNameNoTooltip]!"
 bp1_yearly.8040.a.humble: "Jsem jen [ROOT.Char.GetWomanMan], jako mnozí jiní."
 bp1_yearly.8040.a.deceitful: "Pravda tě neosvobodí."
 bp1_yearly.8040.a.honest: "Pravda je, že jsi lhář."
 bp1_yearly.8040.a.vengeful: "Na to nezapomenu, až #EMP ty#! budeš žádat o #EMP mou#! společnost."
 bp1_yearly.8040.a.forgiving: "Neboj, už jsem tvou hrubost [Select_CString(ROOT.Char.IsFemale,'zapomněla','zapomněl')]."
 bp1_yearly.8040.a.wrathful: "Jak si #EMP dovoluješ#! se mnou takhle mluvit?!"
 bp1_yearly.8040.a.calm: "Zhluboka se nadechni, není třeba se rozčilovat."
 bp1_yearly.8040.a.cynical: "#EMP Jistě#! to má rozhodnout [ROOT.Char.GetFaith.HighGodName], ne?"
 bp1_yearly.8040.a.zealous: "To má rozhodnout [ROOT.Char.GetFaith.HighGodName]!"
 bp1_yearly.8040.a.paranoid: "Ne... ne #EMP ty#! taky!"
 bp1_yearly.8040.a.trusting: "Děkuji, vždy mě podporuješ."
 bp1_yearly.8040.a.shy: "Můžeš mě nechat na pokoji?"
 bp1_yearly.8040.a.gregarious: "Uvolni cestu, lidé na mě čekají."
 bp1_yearly.8040.a.lustful: "Myslím, že jsi [Select_CString(ROOT.Char.IsFemale,'byla','byl')] příliš dlouho sám."
 bp1_yearly.8040.a.chaste: "Nenechám se tak snadno svést."
 bp1_yearly.8040.a.impatient: "Na tohle nemám čas."
 bp1_yearly.8040.a.patient: "Spěch je matkou neštěstí."
 bp1_yearly.8040.a.content: "A kdy to bude dost?"
 bp1_yearly.8040.a.ambitious: "Nezůstanu pozadu."
 bp1_yearly.8040.b: "Dohodněme se, že se neshodneme! Uvolni se."
 bp1_yearly.8040.b.success: "[bp1_yearly_8040_friend.GetTitledFirstNameNoTooltip] se nechá přesvědčit"
 bp1_yearly.8040.b.failure: "[bp1_yearly_8040_friend.GetTitledFirstNameNoTooltip] zůstává s kamennou tváří"
 bp1_yearly.8040.c: "Máš pravdu, [bp1_yearly_8040_friend.GetFirstNameNoTooltip]."
 bp_yearly_8040_trying_to_be_mindful_modifier: "Uvědomování si nedostatků"
 bp_yearly_8040_trying_to_be_mindful_modifier_desc: "Tato postava byla konfrontována kvůli své osobnosti a snaží se být ohleduplnější."
 bp1_yearly.8050.t: "Zavražděný [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim_scope'))]"
 bp1_yearly.8050.desc: "Ztráta mého drahého [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim_scope'))], [victim_scope.GetFirstName], je tíživá; pomalý proud truchlících poddaných a jejich útěch nic neznamená proti díře v mém srdci. \n\nStále nemohu uvěřit, že [victim_scope.GetSheHe] [victim_scope.GetDeathReasonHideKiller], nebo že [murderer_scope.GetTitledFirstName], [victim_scope.GetHerHis] vrah, zůstává nepotrestán. \n\n"
 bp1_yearly.8050.desc.prisoner: "I když [murderer_scope.GetSheHe] hnije v žalářích [murderer_scope.GetImprisonedBy.GetTitledFirstNameNoTooltip], toto vědomí mou zuřivost neuhasí."
 bp1_yearly.8050.desc.free: "Pěst se mi svírají a krev mi buší v uších, když pomyslím na toho tvora, jak volně chodí... urážka spravedlnosti i [ROOT.Char.GetFaith.HighGodName]."
 bp1_yearly.8050.a: "Jednoho dne tě pomstím, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim_scope'))]..."
 bp1_yearly.8050.b: "Tady stopa krve končí."
 bp1_yearly.8060.t: "V mé moci"
 bp1_yearly.8060.opening: "Věnuji chvilku pohledu rozházenému [combat_location.GetTerrain.GetNameNoTooltip|l] [combat_location.GetNameNoTooltip], posetému mrtvými [primary_combat_winner.GetPrimaryTitle.GetAdjectiveNoTooltip] a [primary_combat_loser.GetPrimaryTitle.GetAdjectiveNoTooltip], než se obrátím k okovaným válečným zajatcům. \n\n"
 bp1_yearly.8060.desc.nemesis: "[captured_rival.GetTitledFirstName], ten zatracený [captured_rival.Custom('InsultNoun')] [ROOT.Char.GetFaith.NegativeAfterLife], je konečně v mých rukou! Dlouho jsem snil o tom, skolit mého [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('captured_rival'))]..."
 bp1_yearly.8060.desc.war_leader: "Konečně mám mého [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('captured_rival'))], [captured_rival.GetTitledFirstName], v mých rukou a vítězství v naší válce je téměř zajištěno...\n\n„Podvolím se,“ zachroptí [captured_rival.GetSheHe|U], „propusť mě a dostaneš, co chceš.“"
 bp1_yearly.8060.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('captured_rival'))], [captured_rival.GetTitledFirstName], se mračně dívá na mě, což mi zahřeje srdce."
 bp1_yearly.8060.closing.multi: "\n\nZa [captured_rival.GetHerHim] zlomyslný [captured_rival_2.GetTitledFirstName] klečí netrpělivě."
 bp1_yearly.8060.closing.ransom: "\n\n[captured_rival.GetSheHe|U] zachrčí, o něco příliš zoufale, „Mám nárok na výkupné!“"
 bp1_yearly.8060.a.war_leader: "Tato válka je u konce, ale jen pro tebe."
 bp1_yearly.8060.a.ransom: "Psům se výkupné neuděluje."
 bp1_yearly.8060.a: "Tvé dny jsou sečteny, ničemo."
 bp1_yearly.8060.b: "Zabij [captured_rival.GetHerHim]. Zabij je všechny."
 bp1_yearly.8060.c: "Postarám se, že na tento den nikdy nezapomeneš, [captured_rival.GetFirstNameNoTooltip]."
 bp1_yearly.8060.d: "Vzpomínej na mou milost, červe."
 bp1_yearly.8060.d.multi: "Nezapomeňte na mou milost, bídáci."
 bp1_yearly.8061.t: "Milost [combat_winner.GetTitledFirstNamePossessiveNoTooltip]"
 bp1_yearly.8061.desc: "Stojím, označen nepřátelskými strážemi, na chaotickém [combat_location.GetTerrain.GetNameNoTooltip|l] [combat_location.GetNameNoTooltip], zatímco ten ničema, [battle_rival_winner.GetTitledFirstName], obhlíží své vítězství.\n\n[battle_rival_winner.GetSheHe|U] se konečně přiblíží, s radostným úšklebkem a děsivým leskem v oku vytahuje [battle_rival_winner.Custom('SignatureWeaponNameOrType')].\n\n"
 bp1_yearly.8061.killed: "Vidím, že je to konec..."
 bp1_yearly.8061.a: "„[battle_rival_winner.Custom('InsultAdjective')] do-“"
 bp1_yearly.8061.b: "„Ne takhle!“"
 bp1_yearly.8061.c: "[ROOT.Char.GetFaith.HighGodName] ochraňuj mě."
 bp1_yearly.8062.wounded: "„To bude bolet.“ [battle_rival_winner.GetSheHe] se ušklíbá."
 bp1_yearly.8062.a: "„[battle_rival_winner.Custom('InsultNoun')]!“"
 bp1_yearly.8070.t: "[ROOT.Char.GetGovernment.GetNameNoTooltip|U] Přízeň"
 bp1_yearly.8070.opening: "[claim_vassal.GetTitledFirstName] [Select_CString(claim_vassal.IsFemale,'byla','byl')] celý večer tiše [Select_CString(claim_vassal.IsFemale,'rozzuřená','rozzuřený')], ale nakonec vybuchne, když sáhnu po [ROOT.Char.Custom('GetExpensiveMealAlt')].\n\n„Prostě nemohu pochopit, proč jsi udělil [claim_title.GetName] [favorite_vassal.GetTitledFirstName].“"
 bp1_yearly.8070.strength_strong: "Můj oprávněný nárok na tato území je uznáván všemi!„\n\n"
 bp1_yearly.8070.strength_weak: "Tato území mi právoplatně patří!„\n\n"
 bp1_yearly.8070.claim: "„Proč bys zvýhodnil [favorite_vassal.GetHerHim] těmito zeměmi před mnou? Nebyl jsem věrným vazalem?“"
 bp1_yearly.8070.lowborn: "„Povýšení tohoto nízkého rodu místo mě je urážkou!“"
 bp1_yearly.8070.other: "„Jaký těžký prohřešek jsem spáchal, že mě tak ponižuješ?“"
 bp1_yearly.8070.hostile: "\n\n„Dát pozemky zatracenému [favorite_vassal.GetFaith.GetAdherentName] před mě!“ moje [ROOT.Char.Custom2('RelationToMe', claim_vassal)] zaskřípe, „To odporuje svědomí!“"
 bp1_yearly.8070.culture: "\n\n„Myslím...“ moje [ROOT.Char.Custom2('RelationToMe', claim_vassal)] koktá, „[favorite_vassal.GetSheHe|U] dokonce ani není [claim_vassal.GetCulture.GetName]!“"
 bp1_yearly.8070.faith: "\n\n„Myslím...“ moje [ROOT.Char.Custom2('RelationToMe', claim_vassal)] koktá, „[favorite_vassal.GetSheHe|U] dokonce ani není [ROOT.Char.GetFaith.GetAdherentName]!“"
 bp1_yearly.8070.a: "[favorite_vassal.GetFirstNameNoTooltip] má vlastnosti, které tobě chybí."
 bp1_yearly.8070.b: "Odpusť mi, [claim_vassal.GetFirstNameNoTooltip], [claim_title.GetNameNoTierNoTooltip] je tvůj."
 bp1_yearly.8070.c: "Dám ti jiný titul."
 bp1_yearly.8070.d: "Znovu nespochybňuj má rozhodnutí."
 bp1_yearly.8070.d.success: "[claim_vassal.GetTitledFirstNameNoTooltip] je uklidněn"
 bp1_yearly.8070.d.failure: "[claim_vassal.GetTitledFirstNameNoTooltip] je uražen"
 bp1_yearly.8100.t: "Neoblíbený favorit"
 bp1_yearly.8100.joke: "Pořád se usmívám nad žertem mého [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetFirstName], který zazněl na dnešní radě, když mě [jealous_scope.GetTitledFirstName] chytá za paži."
 bp1_yearly.8100.thighs: "Jsem ztracen v myšlenkách nad ladnými stehny mého [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetTitledFirstNamePossessive], když za mnou zaslechnu, jak [jealous_scope.GetTitledFirstName] zakašle."
 bp1_yearly.8100.desc: "\n\n„[jealous_scope.Custom2('RelationToMe', ROOT.Char)|U], chtěl jsem s tebou mluvit."
 bp1_yearly.8100.lover_known: "Tvoje... náklonnost k [sycophant_scope.GetFirstNameNoTooltip] neunikne pozornosti a vyvolává... otázky ohledně tvých důvodů.„\n\n"
 bp1_yearly.8100.lover_secret: "Já i ostatní na dvoře nerozumíme poctám a odpovědnostem, které naléváš na [sycophant_scope.GetHerHim]. Uznávaný šlechtic by ti jistě [Select_CString(ROOT.Char.IsFemale,'byla','byl')] užitečnější.„\n\n"
 bp1_yearly.8100.lover: "Vím, že k [sycophant_scope.GetHerHim] cítíš... velkou náklonnost, ale opravdu, místo v radě?„\n\n"
 bp1_yearly.8100.friend: "Chápu, že jste blízcí přátelé, ale jsou tací, kdo si myslí, že upřednostňuješ [sycophant_scope.GetHerHim] před zasloužilejšími rádci.„\n\n"
 bp1_yearly.8100.faction: "„Abych [Select_CString(ROOT.Char.IsFemale,'byla','byl')] upřímný, pokud tyto urážky nebudou napraveny, pouze [jealous_scope.GetFaith.HighGodName] ví, co postihne [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]...“"
 bp1_yearly.8100.hostile: "„Myslím, nevíš, jaký [sycophant_scope.Custom('InsultAdjective')] [sycophant_scope.Custom('InsultNoun')] ten [sycophant_scope.GetWomanMan] je?“"
 bp1_yearly.8100.lowborn: "„Není náležité dávat názor prostého člověka výše, nebo dokonce vedle, nejvyšší šlechty [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierPossessiveNoTooltip].“"
 bp1_yearly.8100.rank: "„Jistě, názor [jealous_scope.GetTitleAsNameNoTooltip] by [Select_CString(ROOT.Char.IsFemale,'měla','měl')] mít váhu nad názorem pouhého [sycophant_scope.GetTitleAsNameNoTooltip]!“"
 bp1_yearly.8100.faith: "„Je skutečně moudré naslouchat [sycophant_scope.GetFaith.GetAdjective] [jealous_scope.Custom2('GetUnbelieverTerm', sycophant_scope)]?“"
 bp1_yearly.8100.culture: "„Jistě by ti lépe posloužil jiný [jealous_scope.GetCulture.GetName] hlas než tento [sycophant_scope.GetCulture.GetName] cizinec?“"
 bp1_yearly.8100.unskilled: "„Kromě urážky je [sycophant_scope.GetWomanMan] zjevně neschopný pro úřad [sycophant_scope.GetCouncilTitle].“"
 bp1_yearly.8100.skilled: "„Ať je [sycophant_scope.GetCouncilTitle] [sycophant_scope.GetSheHe] jakkoli schopný, tato urážka je zjevná.“"
 bp1_yearly.8100.jealous: "„Vezmi si třeba mne - loajálního [jealous_scope.GetTitleAsNameNoTooltip] [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].“"
 bp1_yearly.8100.fallback: ""
 bp1_yearly.8100.a: "[ROOT.Char.GetTitleAsNameNoTooltip|l] si může vybrat vlastní radu."
 bp1_yearly.8100.a.hostile: "Jak si dovolíš mluvit špatně o [sycophant_scope.GetFirstNameNoTooltip]!"
 bp1_yearly.8100.a.flavor: "[jealous_scope.GetFirstNameNoTooltip] může mít zášť"
 bp1_yearly.8100.b: "Myslím, že chceš [sycophant_scope.GetHerHis] místo, [jealous_scope.GetFirstNameNoTooltip]."
 bp1_yearly.8100.b.flavor: "Doufám, že [sycophant_scope.GetFirstNameNoTooltip] to pochopí"
 bp1_yearly.8100.fired_tt: "[sycophant_scope.GetShortUIName|U] je propuštěn z tvé [council|E] na 5 let"
 bp1_yearly.8100.c: "Dobře, odvolám [sycophant_scope.GetFirstNameNoTooltip]."
 bp1_yearly.8100.c.flavor: "I když mě to bolí..."
 bp1_yearly.8100.d.flavor: "[sycophant_scope.GetSheHe|U] je opravdu velká zábava!"
 bp1_yearly.8100.d.success: "[sycophant_scope.GetTitledFirstNameNoTooltip] udělá dobrý dojem"
 bp1_yearly.8100.d.failure: "[jealous_vassal.GetTitledFirstNameNoTooltip] nemůže vystát [sycophant_scope.GetWomanMan]"
 bp1_yearly.8100.d.tt: "Tato možnost není k dispozici, protože [jealous_scope.GetFirstNameNoTooltip] je [sycophant_scope.GetFirstNamePossessiveNoTooltip] [jealous_scope.Custom2('RelationToMe', sycophant_scope)|U]"
 bp1_yearly.8100.reveal_tt: "[jealous_scope.GetTitledFirstName] může vyzradit tvé a [sycophant_scope.GetFirstNamePossessive] [sycophant_secret.GetName] tajemství"
 bp1_yearly.8100.support: "[ROOT.Char.Custom2('RelationToMe', sycophant_scope)|U], [sycophant_scope.GetTitledFirstName], je uklidňující přítomnost v mé radě, vždy ochotný mě podpořit, i když [jealous_scope.GetTitledFirstName] má zjevně jiný názor."
 bp1_yearly.8100.knowledgeable: "Přikyvuji a souhlasím s [ROOT.Char.Custom2('RelationToMe', sycophant_scope)|U], [sycophant_scope.GetTitledFirstName], je tak znalý, jsem [Select_CString(sycophant_scope.IsFemale,'ráda','rád')], že mám tak důvěryhodného a schopného rádce. [jealous_scope.GetTitledFirstName] má zjevně jiný názor."
 bp1_yearly.8110.t: "[sycophant_scope.GetFirstNamePossessiveNoTooltip] Tajemství"
 bp1_yearly.8110.desc: "Když si před druhým spánkem dám tichou procházku, rozptýlen myšlenkami na mého [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetTitledFirstNamePossessive], okouzlující oči, spatřím známou postavu [revealer_scope.GetTitledFirstNamePossessive], jak se ke mně blíží.\n\n„Ach, můj [ROOT.Char.GetLadyLord]... nemohl jsem pochopit, proč prokazujete tak velké uznání [sycophant_scope.GetFirstNameNoTooltip] - #EMP až doteď#!.“ \n\n"
 bp1_yearly.8110.known_secret_homosexual: "„Učiň místo zaslouženějšímu vazalovi ve svém vnitřním kruhu, nebo budu nucen odhalit tvé nenormální spojení.“"
 bp1_yearly.8110.known_secret_adulterer: "„Odvolej [sycophant_scope.GetHerHim] z rady, nebo tvé bezbožné cizoložství bude známo všem.“"
 bp1_yearly.8110.known_secret_other: "„Odstraň z rady toho [sycophant_scope.Custom('InsultAdjective')] rváče, nebo budu nucen odhalit váš vztah.“"
 bp1_yearly.8110.c: "Velmi dobře..."
 bp1_yearly.8110.c.flavor: "...měj to po svém!"
 bp1_yearly.8110.d: "Neomlouvám se za nic."
 bp1_yearly.8110.e: "Jsi si jist, že by [secondary_scope.GetFirstNameNoTooltip] to chtěl?"
 every_powerful_vassal_tt: "Každý [powerful_vassal|E]"
 bp1_yearly.8120.t: "[sycophant_scope.GetFirstNamePossessiveNoTooltip] Půvab"
 bp1_yearly.8120.desc: "Ach, [sycophant_scope.GetTitledFirstNamePossessive] úžasné... odtrhnu se od rozjímání, když [matchmaker_scope.GetTitledFirstName] přistoupí a zavře dveře za [matchmaker_scope.GetHerHim].\n\n„Má paní/pane [ROOT.Char.GetLadyLord], přicházím k vám v důvěře s delikátní záležitostí...“ [matchmaker_scope.GetSheHe|U] váhá. „Nemyslíte, že byste... [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] dávat [sycophant_scope.GetFirstNameNoTooltip] odpovědnosti a pocty proto, že ho/ji... #EMP máte [Select_CString(ROOT.Char.IsFemale,'ráda','rád')]#! [sycophant_scope.GetHerHim]?“\n\n[matchmaker_scope.GetFirstNameNoTooltip] nervózně zdrbe výstřih.\n\n„Možná by bylo pro všechny lepší, kdybyste #EMP vy#! tomu #EMP [Select_CString(ROOT.Char.IsFemale,'věnovala','věnoval')] pozornost#, a nechal úřady svým šlechticům?“"
 bp1_yearly.8120.a: "Vypadni."
 bp1_yearly.8120.a.flavor: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych tě nechat bičovat!"
 bp1_yearly.8120.b: "[sycophant_scope.GetFirstNameNoTooltip]? Ha, ani náhodou!"
 bp1_yearly.8120.seduce: "[scheme|E] bude mít zvýšenou [success_chance|E]"
 bp1_yearly.8120.b.flavor: "Jaká směšná představa!"
 bp1_yearly.8120.c: "Co- #EMP Ach...#! Možná máš pravdu..."
 bp1_yearly.8120.c.flavor: "Myslíš, že mě [sycophant_scope.GetSheHe] taky má [Select_CString(ROOT.Char.IsFemale,'ráda','rád')]?"
 bp1_yearly.8120.d: "Jsi #EMP bystrý#!, ale neustoupím."
 bp1_yearly.8120.d.flavor: "Co to prozradilo?"
 bp1_yearly.8121.t: "[sycophant_scope.GetFirstNamePossessiveNoTooltip] Vůně"
 bp1_yearly.8121.opening: "Erotické myšlenky mě sužují od mého rozhovoru s [matchmaker_scope.GetTitledFirstName], sny o mně a [sycophant_scope.GetTitledFirstName]...\n\n"
 bp1_yearly.8121.homosexual: "Vím, že to není, co [ROOT.Char.GetFaith.HighGodName] zamýšlel mezi jedním [ROOT.Char.GetWomanMan] a druhým... ó [ROOT.Char.GetFaith.PositiveAfterLife]!"
 bp1_yearly.8121.adultery: "Nebylo by správné zradit [ROOT.Char.GetConsort.GetTitledFirstName], ale [ROOT.Char.GetFaith.HighGodNameAlternate] jistě má důvod, proč mě takto cítit!"
 bp1_yearly.8121.other: "Co když [sycophant_scope.GetSheHe] cítí totéž? Trápím se zbytečně? [ROOT.Char.GetFaith.FertilityGodName] pomoz mi..."
 bp1_yearly.8121.desc: "\n\nCo mám dělat..."
 bp1_yearly.8121.a: "Musím následovat své srdce."
 bp1_yearly.8121.a.flavor: "Tuto příležitost nelze promarnit"
 bp1_yearly.8121.b: "To by skončilo jen špatně..."
 bp1_yearly.8121.b.friend: "[sycophant_scope.GetSheHe|U] je jen přítel! A #EMP přítel#!!"
 bp1_yearly.8121.b.flavor: "Zpátky k práci..."
 bp1_yearly.8130.t: "[sycophant_scope.GetFirstNamePossessiveNoTooltip] Nepřátelé"
 bp1_yearly.8130.desc: "Můj [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetTitledFirstName], vběhne do mých komnat, shodí lampu a téměř zapálí polštář.\n\n„[ROOT.Char.GetFirstNameNoTooltip]! Jsem si jist, že mě někdo sleduje!“ vykřikne [sycophant_scope.GetSheHe], ukazující za [sycophant_scope.GetHerHim].\n\n„Venku u mých komnat byli muži skrytí; moje věci byly přemístěny!“"
 bp1_yearly.8130.a: "No tak, tohle na tebe není."
 bp1_yearly.8130.a.paranoid: "„No tak, pravděpodobně to [Select_CString(ROOT.Char.IsFemale,'byla','byl')] sluha.“"
 bp1_yearly.8130.a.flavor: "Není třeba se tím znepokojovat"
 bp1_yearly.8130.b: "Postarám se, že budeš hlídán dnem i nocí."
 bp1_yearly.8130.c: "[spymaster_scope.GetFirstNameNoTooltip] to vyšetří."
 bp1_yearly.8130.c.flavor: "Pravda neunikne [spymaster_scope.GetHerHim]"
 bp1_yearly.8130.c.success: "[spymaster_scope.GetCouncilTitleFirstNameNoTooltip] najde důkazy"
 bp1_yearly.8130.c.failure: "Nebyly nalezeny žádné důkazy"
 bp1_yearly.8130.exposed: "[scheme|E] proti [sycophant_scope.GetShortUIName] bude odhalen"
 bp1_yearly.8130.progress: "[scheme|E] proti [sycophant_scope.GetShortUIName] bude pokračovat"
 bp1_yearly.8130.d: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bys to prošetřit, špione."
 bp1_yearly.8130.d.flavor: "Zrovna o takové lidi mám starost..."
 bp1_yearly.8130.d.success: "[spymaster_scope.GetFirstNameNoTooltip] najde důkazy"
 bp1_yearly.8130.d.failure: "[spymaster_scope.GetFirstNameNoTooltip] zmizí"
 bp1_yearly.8130.e: "Nikdo neohrožuje #EMP mého#! [ROOT.Char.Custom2('RelationToMe', sycophant_scope)]!"
 bp1_yearly.8130.e.flavor: ""
 bp1_yearly.8130.e.success: "Objevíš spiknutí"
 bp1_yearly.8130.e.failure: "Nic nebylo nalezeno"
 bp1_yearly.8131.t.sycophant: "[spymaster_scope.GetFirstNamePossessiveNoTooltip] Lstivost"
 bp1_yearly.8131.t: "[sycophant_scope.GetFirstNamePossessiveNoTooltip] Osvědčení"
 bp1_yearly.8131.desc.sycophant: "Jsem překvapen, že mě zavolali do kobek hluboko v útrobách mého, a nikdo jiný než [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetTitledFirstName].\n\nTam, v cele, nacházím [sycophant_scope.GetHerHim], povzbuzeného úlevou, vedle rozhodně méně spokojeně vyhlížejícího [murderous_scope.GetTitledFirstName], okovaného.\n\nZakuckám se, „[sycophant_scope.GetFirstNameNoTooltip]! Co jsi—“ dřív než se [sycophant_scope.GetSheHe] vloží, „Tento [murderous_scope.Custom('InsultNoun')] se mě pokusil nechat zabít — mám přiznání [murderous_scope.GetHerHis] rvače, které to dokážou!“"
 bp1_yearly.8131.desc.spymaster: "Když odpočívám se svým [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetTitledFirstName], dorazí nám zpráva od mého špeha, [spymaster_scope.GetTitledFirstName], která nás oba vyzývá, abychom přišli do mých kobek.\n\nTam, v vlhkých útrobách mého [ROOT.GetCharacter.Custom('FortifiedBuilding')], nacházíme [spymaster_scope.GetHerHim], s ubohým [murderous_scope.GetTitledFirstName] v řetězech po [spymaster_scope.GetHerHis] boku.\n\n„To je pachatel, má [ROOT.Char.GetLadyLord],“ [spymaster_scope.GetSheHe] vykřikuje pýchou, „Není pochyb.“"
 bp1_yearly.8131.desc: "Jsem napjatý očekáváním, když moji strážci vtrhnou s chyceným agentem do mých kobek, svázaného, zahozeného a sténajícího.\n\n„Pojď, [sycophant_scope.GetFirstName], uvidíme, kdo se pokoušel najmout tvého nájemného vraha!“\n\nS flourishí a vykřikem můj vězeňský dozorce odhalí nikoho jiného než [murderous_scope.GetTitledFirstName]!\n\n[sycophant_scope.GetFirstNameNoTooltip] a já zabručíme současně: „#EMP Ty!#“"
 bp1_yearly.8131.tt: "[murderous_scope.GetTitledFirstNamePossessive] zapojení do [scheme|E] k [sycophant_scheme.GetSchemeType.GetTypeNameNoTooltip] [sycophant_scope.GetFirstName] je odhaleno"
 bp1_yearly.8131.a: "Zdá se, že máš co vysvětlovat, [murderous_scope.GetFirstNameNoTooltip]."
 bp1_yearly.8131.a.flavor: "Přímo přes mříže mojí cely!!"
 bp1_yearly.8131.b: "Se [Select_CString(murderous_scope.IsFemale,'naučila','naučil')] svou lekci."
 bp1_yearly.8131.b.flavor: "Nakonec to není #EMP zrada#!"
 bp1_yearly.8131.c: "Kdo další je do toho [Select_CString(ROOT.Char.IsFemale,'zapojena','zapojen')]?"
 bp1_yearly.8131.c.flavor: "Podaj mi kladivo!"
 bp1_yearly.8131.torture: "Budeš [torture|E] [murderous_scope.GetShortUIName]"
 bp1_yearly.8131.agent: "Jiný [agent|E] zapojený do [scheme|E] může být odhalen"
 bp1_yearly.8131.attempted: "[agent_scope.GetTitledFirstNameNoTooltip] [Select_CString(agent_scope.IsFemale,'byla','byl')] [Select_CString(agent_scope.IsFemale,'zapojena','zapojen')] do spiknutí!"
 released_attempted_murderer_opinion: "Propuštěný pachatel pokusu o vraždu"
 bp1_yearly.8132.t: "[sycophant_scope.GetFirstNamePossessiveNoTooltip] Strach"
 bp1_yearly.8132.desc.sycophant: "Můj [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetTitledFirstNamePossessive], se vrací ke mně pouze více [Select_CString(sycophant_scope.IsFemale,'rozhořčená','rozhořčený')].\n\nZdá se, že [Select_CString(sycophant_scope.IsFemale,'vyčerpala','vyčerpal')] všechny možnosti, které [Select_CString(ROOT.Char.IsFemale,'měla','měl')], aniž by se [Select_CString(ROOT.Char.IsFemale,'přiblížila','přiblížil')] k odhalení důkazů o spiknutí.\n\n„Co mám dělat, [ROOT.Char.GetFirstNameNoTooltip],“ povzdechne si [sycophant_scope.GetSheHe], „Jsem v milosti mých nepřátel!“"
 bp1_yearly.8132.desc.spymaster: "Můj špeh, [spymaster_scope.GetTitledFirstNamePossessive], konečně [Select_CString(spymaster_scope.IsFemale,'přiznala','přiznal')], že [Select_CString(spymaster_scope.IsFemale,'nenašela','nenašel')] žádné důkazy o spiknutí proti mému [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] [sycophant_scope.GetFirstName].\n\nDokonce [Select_CString(spymaster_scope.IsFemale,'navrhla','navrhl')], že celá záležitost je výplod fantazie [sycophant_scope.GetFirstNamePossessiveNoTooltip]..."
 bp1_yearly.8132.desc: "[Select_CString(ROOT.Char.IsFemale,'Prozkoumala','Prozkoumal')] jsem obavy mého [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetTitledFirstNamePossessive], [Select_CString(sycophant_scope.IsFemale,'postavila','postavil')] hlídku u [sycophant_scope.GetHerHis] komnat a [Select_CString(sycophant_scope.IsFemale,'vyslýchala','vyslýchal')] služebnictvo po celém [ROOT.GetCharacter.Custom('FortifiedBuilding')], ale bez úspěchu.\n\n„Možná to [Select_CString(ROOT.Char.IsFemale,'byla','byl')] jen služebník, který uklízel?“ nabídnu slabě.\n\n[sycophant_scope.GetSheHe|U] přechází po mém pokoji, zjevně [Select_CString(ROOT.Char.IsFemale,'nepřesvědčena','nepřesvědčen')]."
 bp1_yearly.8132.a: "Postarám se o tvou ochranu, pro jistotu."
 bp1_yearly.8132.a.flavor: "Lépe být v bezpečí než litovat"
 bp1_yearly.8132.b: "Nebo to [Select_CString(ROOT.Char.IsFemale,'byla','byl')] neškodný žert?"
 bp1_yearly.8132.b.flavor: "Tohle je ztráta času"
 bp1_yearly.8134.t: "Nepřítomnost [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8134.desc: "Už je příliš dlouho, co jsem [Select_CString(ROOT.Char.IsFemale,'měla','měl')] zprávu od mého [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetTitledFirstNamePossessive], a začínám se obávat nejhoršího.\n\nKdyby opravdu existovalo ohrožení [sycophant_scope.GetHerHis] života... ach, [ROOT.Char.GetFaith.HighGodName]..."
 bp1_yearly.8134.a: "Kde jsi, [sycophant_scope.GetFirstNameNoTooltip]?"
 bp1_yearly.8134.a.flavor: "Co jsem to [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')]..."
 bp1_yearly.8140.t: "Pomsta [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8140.desc: "Prohlížeje svou sbírku vybraných [ROOT.Char.Custom('RegionalAlcoholicDrink')|U], zaslechnu známý hlas mého [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetFirstName].\n\nUkrytý mezi sudy [sycophant_scope.GetSheHe] nadává a klade kletby na [jealous_scope.GetTitledFirstName] nějakému služebníkovi.\n\nPrávě když chci ztratit zájem, slyším to, mrazí mi krev v žilách: „zabij [jealous_scope.GetTitledFirstName]!“"
 bp1_yearly.8140.a: "[sycophant_scope.GetFirstNameNoTooltip]! [Select_CString(ROOT.Char.IsFemale,'Slyšela','Slyšel')] jsem každé slovo!"
 bp1_yearly.8140.a.flavor: "Hanba ti!"
 bp1_yearly.8140.b: "Ano! [jealous_scope.GetFirstNameNoTooltip] #EMP zemře#!!"
 bp1_yearly.8140.b.flavor: "Konečně trochu zábavy!"
 bp1_yearly.8140.c: "#EMP Tiše se vzdalím#!"
 bp1_yearly.8140.c.flavor: "Nic jsem #EMP [Select_CString(ROOT.Char.IsFemale,'neslyšela','neslyšel')]#!"
 bp1_yearly.8160.t: "Šarm [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8160.desc: "Můj [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetFirstName], a já se procházíme po zahradách, hlasitě se smějeme rýmům, které [Select_CString(sycophant_scope.IsFemale,'zaslechla','zaslechl')] od služebníka, když nám cestu zkříží [jealous_scope.GetTitledFirstName].\n\n[jealous_scope.GetSheHe|U] se na nás podívá přísně, „Má [ROOT.Char.GetLadyLord], [Select_CString(ROOT.Char.IsFemale,'ráda','rád')]/a bych si [Select_CString(ROOT.Char.IsFemale,'promluvila','promluvil')], máte chvíli?“"
 bp1_yearly.8160.a: "Dobrá, o co jde?"
 bp1_yearly.8160.a.flavor: "Tohle by mělo stát za to!"
 bp1_yearly.8160.b: "Přidej se k nám, musíš to slyšet!"
 bp1_yearly.8160.b.flavor: "Co by se #EMP mohlo#! pokazit?"
 bp1_yearly.8160.b.success: "[sycophant_scope.GetFirstNameNoTooltip] si získá [jealous_scope.GetHerHim]"
 bp1_yearly.8160.b.failure: "Tohle je poslední kapka pro [jealous_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8160.d: "Ne teď, [jealous_scope.GetFirstNameNoTooltip]!"
 bp1_yearly.8160.d.flavor: "Nevidíš, že jsem #EMP zaneprázdněn/a#!?"
 bp1_yearly.8161.t: "Kouzlo [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8161.opening: "Jak ozvěny posledních efektů [sycophant_scope.GetTitledFirstNamePossessive] utichají v ptačím zpěvu, můj [jealous_scope.GetTitledFirstNamePossessive] vypadá stále vážněji než kdy dřív.\n\n"
 bp1_yearly.8161.desc: "Pomalu se v koutcích [jealous_scope.GetHerHis] úst objevuje náznak úsměvu, který se rozšíří do širokého úšklebku, až nakonec vyprskne do hlubokého smíchu!\n\n„To— #EMP *chrocht*#! To je ten nejvtipnější— #EMP *chrocht*#! Ach! [Select_CString(ROOT.Char.IsFemale,'Mýlila','Mýlil')] jsem se, [sycophant_scope.GetFirstNameNoTooltip]! Jdeme na jídlo!“"
 bp1_yearly.8161.a: "#EMP *kopne do žeber*#! [ROOT.Char.Custom('GetLaughType')]"
 bp1_yearly.8161.a.flavor: "Skoro jsi mě [Select_CString(ROOT.Char.IsFemale,'dostala','dostal')]!"
 bp1_yearly.8162.t: "Přešlap [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8162.desc: "Mám hrozivé tušení, že vtip nevyšel.\n\nMé obavy se potvrdí, když [jealous_scope.GetFirstNameNoTooltip] vydechne srdcervoucí povzdech, protočí očima a odkráčí.\n\n[sycophant_scope.GetFirstName] pokrčí rameny: „No tak, co za prudér...?“"
 bp1_yearly.8162.a: "Proč jsi to #EMP [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')]#!, [sycophant_scope.GetFirstNameNoTooltip]..."
 bp1_yearly.8162.a.flavor: "Drž se materiálu pro služebníky, ano?"
 bp1_yearly.8170.t: "Přítel [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8170.desc: "Víc a víc málo vídám mého [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetFirstName]. Zdá se, že [sycophant_scope.GetSheHe] tráví hodně času s mým [ROOT.Char.Custom2('RelationToMe', friendly_scope)], [friendly_scope.GetTitledFirstName]...\n\nPotkám je; poplácávají se po stehnech nad nějakým vtipem; chichotají se, když se na mě podívají.\n\nCo z toho mám vyvodit..."
 bp1_yearly.8170.a: "Jsem nad to."
 bp1_yearly.8170.a.flavor: "Už nebudu ztrácet čas s [sycophant_scope.GetHerHim]"
 bp1_yearly.8170.b: "Ah, [sycophant_scope.GetFirstNameNoTooltip], chvíli?"
 bp1_yearly.8170.b.flavor: "Vím, co má [sycophant_scope.GetSheHe] [Select_CString(ROOT.Char.IsFemale,'ráda','rád')]/a"
 bp1_yearly.8170.b.success: "[sycophant_scope.GetFirstNameNoTooltip] jde s tebou"
 bp1_yearly.8170.b.failure: "[sycophant_scope.GetFirstNameNoTooltip] zůstane s [friendly_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8170.c: "Už tě dál nepotřebuji, [sycophant_scope.GetFirstNameNoTooltip]."
 bp1_yearly.8170.c.flavor: "Užij si ten smích #EMP tam#!!"
 bp1_yearly.8180.t: "Ultimátum [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8180.desc: "Můj [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetFirstName], [Select_CString(sycophant_scope.IsFemale,'požádala','požádal')] o soukromé audienci, neobvyklá formalita, která může znamenat jen špatné zprávy.\n\n„[ROOT.Char.GetFirstNameNoTooltip]! [ROOT.Char.GetTitleAsNameNoTooltip]... Už to nemohu snášet! Vylučujete mě, dáváte přednost své ‚povinnosti‘, když víte, že jsem [Select_CString(ROOT.Char.IsFemale,'byla','byl')] naprosto [Select_CString(ROOT.Char.IsFemale,'skvělá','skvělý')] rádce!“\n\n„Pokud se mnou takhle budete zacházet, budu hledat nové možnosti. [Select_CString(ROOT.Char.IsFemale,'Slyšela','Slyšel')] jsem, že [new_realm.GetHolder.GetName] ví, jak odměnit věrné poddané...“"
 bp1_yearly.8180.a: "Víš, že tě nemůžu ztratit, [sycophant_scope.GetFirstNameNoTooltip]."
 bp1_yearly.8180.a.flavor: "Víš to moc dobře..."
 bp1_yearly.8180.b: "Pojď, víš, že to není tak jednoduché!"
 bp1_yearly.8180.b.flavor: "Je tu mnoho faktorů..."
 bp1_yearly.8180.b.success: "[sycophant_scope.GetFirstNameNoTooltip] zůstává"
 bp1_yearly.8180.b.failure: "[sycophant_scope.GetFirstNameNoTooltip] odchází"
 bp1_yearly.8180.c: "Jdi tedy, jestli to tak myslíš!"
 bp1_yearly.8180.c.flavor: "Ven!"
 bp1_yearly.8180.d: "Hrozíš zradu!"
 bp1_yearly.8180.d.flavor: "Když tě nemohu mít..."
 bp1_yearly.8190.t: "Talent [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8190.opening: "Když přecházím nádvoří, konečně slyším někoho, kdo oceňuje mého [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetFirstName].\n\n„Ach neposlouchej ty kyselé hrozny,“ brouká [friendly_scope.GetTitledFirstName], „jsi nejlepší [sycophant_scope.GetCouncilTitle], jakého [Select_CString(friendly_scope.IsFemale,'měla','měl')] [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] za dlouhé roky — alespoň co já #EMP vím#!“\n\n"
 bp1_yearly.8190.twitch: "Na okamžik jsem si [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')], že zahlédnu [jealous_scope.GetTitledFirstName] ve stinných stájích přes nádvoří, s tikajícím okem, než se [jealous_scope.GetSheHe] rozplyne v temnotě."
 bp1_yearly.8190.desc: "[Select_CString(ROOT.Char.IsFemale,'Věděla','Věděl')] jsem, že to, co vidím u [sycophant_scope.GetHerHis], je pravda!"
 bp1_yearly.8190.a: "Konečně někdo, kdo rozumí charakteru!"
 bp1_yearly.8190.a.flavor: "Společnost obdivovatelů [sycophant_scope.GetFirstNameNoTooltip] roste"
 bp1_yearly.8190.b: "Řekni, co takhle večírek jen pro nás tři!"
 bp1_yearly.8190.b.flavor: "Drž své přátele blízko"
 bp1_yearly.8191.t: "Odměny [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8191.opening: "Další nekonečné zasedání rady se vleče, až náhle zpozorním při zvuku vítězného tónu mého [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetFirstNamePossessive].\n\n„Naléhavá záležitost, má [ROOT.Char.GetLadyLord], "
 bp1_yearly.8191.taken: "[ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] zoufale potřebuje schopného [sycophant_scope.Custom('GetTargetCourtPosition')]; někoho, kdo by řádně [sycophant_scope.Custom('GetTargetCourtPositionDesc')]... úkol, který [old_holder.GetTitledFirstName] #EMP docela#! zpackal.„"
 bp1_yearly.8191.open: "[ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] zoufale potřebuje [sycophant_scope.Custom('GetTargetCourtPosition')]; někoho, kdo by se postaral o [sycophant_scope.Custom('GetTargetCourtPositionDesc')]...„"
 bp1_yearly.8191.arrogant: "\n\n[sycophant_scope.GetSheHe|U] se grandiózně ukáže, „Nechte to na mně, mé panstvo, tento druh práce vyžaduje jistou jemnost.“"
 bp1_yearly.8191.other: "\n\n[sycophant_scope.GetSheHe|U] položí ruku na srdce, „Samozřejmě, #EMP já#! bych [Select_CString(ROOT.Char.IsFemale,'byla','byl')] ochoten/ochotna vzít si tuto důležitou zátěž na sebe, mé panstvo.“"
 bp1_yearly.8191.desc: "\n\n[annoyed_scope.GetTitledFirstName] je zjevně [Select_CString(annoyed_scope.IsFemale,'rozzuřená','rozzuřený')]."
 bp1_yearly.8191.a: "Výborný nápad, [sycophant_scope.GetFirstNameNoTooltip]!"
 bp1_yearly.8191.a.flavor: "Díky Bohu za [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8191.b: "Ano, je čas, aby [old_holder.GetFirstNameNoTooltip] [Select_CString(old_holder.IsFemale,'ustoupila','ustoupil')]!"
 bp1_yearly.8191.b.flavor: "[sycophant_scope.GetFirstNameNoTooltip] ukáže [old_holder.GetHerHim], jak se to dělá!"
 bp1_yearly.8191.c: "Co kdybys [Select_CString(ROOT.Char.IsFemale,'vzala','vzal')] volné místo místo toho?"
 bp1_yearly.8191.c.flavor: "Talenty [sycophant_scope.GetFirstNameNoTooltip] jsou nekonečné"
 bp1_yearly.8191.d: "Myslím, že tohle je práce pro [annoyed_scope.GetFirstNameNoTooltip]."
 bp1_yearly.8191.d.flavor: "[sycophant_scope.GetFirstNameNoTooltip] nemůže mít #EMP všechno#!"
 bp1_yearly.8191.e: "Určitě #EMP musí#! být naléhavější záležitosti?"
 bp1_yearly.8191.e.flavor: "[sycophant_scope.GetFirstNameNoTooltip] to překoná"
 bp1_yearly.8192.t: "Chyby [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8192.desc: "Když si na pohovce dám chvíli pauzu, abych [Select_CString(ROOT.Char.IsFemale,'přemýšlela','přemýšlel')] o tom, jak odměnit mého [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetFirstNamePossessive], za skvělou práci, náhle se zámek dveří otevře a odhalí [insulting_scope.GetTitledFirstName].\n\n„Promiňte, že mluvím tak svobodně, má [ROOT.Char.GetLadyLord], ale tohle s [sycophant_scope.GetFirstNameNoTooltip] už přerostlo únosnou mez!“\n\n„Ten blázen není dobrý v tom být [sycophant_scope.GetCouncilTitle]; pokaždé, když je [sycophant_scope.GetSheHe] v čele, věci se zhorší až k zkáze celého [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]!“"
 bp1_yearly.8192.a: "[Select_CString(ROOT.Char.IsFemale,'Netušila','Netušil')] jsem, že je to tak špatné..."
 bp1_yearly.8192.a.flavor: "Je čas, aby [sycophant_scope.GetFirstNameNoTooltip] [Select_CString(sycophant_scope.IsFemale,'odešela','odešel')]"
 bp1_yearly.8192.b: "Na mé radě není místo pro malichernou žárlivost."
 bp1_yearly.8192.b.flavor: "Nenávistníci budou vždy nenávidět"
 bp1_yearly.8192.fired_tt: "[insulting_scope.GetShortUIName|U] je propuštěn/a z tvé [council|E] na 5 let"
 bp1_yearly.8192.c: "#EMP *vzdech*#! Nevidíš, že jsem #EMP zaneprázdněn/a#!, [insulting_scope.GetFirstNameNoTooltip]?"
 bp1_yearly.8192.c.flavor: "Talenty [sycophant_scope.GetFirstNameNoTooltip] jsou nekonečné"
