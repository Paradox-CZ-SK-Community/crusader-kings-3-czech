l_polish:
 bp1_yearly.2000.t: "Dar hodný..."
 bp1_yearly.2000.desc.intro: "Mezi stánky kočovných obchodníků panuje čilý ruch. Provizorní krámky jsou napěchované až po střechu nejrůznějšími cetkami. "
 bp1_yearly.2000.desc.greed_flavor: "Tyhle kousky vypadají draze... ale možná by za to stály."
 bp1_yearly.2000.desc.not_greed_flavor: "Tyhle kousky přímo září a byly by nádherným darem."
 bp1_yearly.2000.desc.single: "\n\nKdyž s [bp1_yearly_2000_partner_a.GetTitledFirstName] míjíme jednoho z obchodníků se šperky, [bp1_yearly_2000_partner_a.GetTitledFirstNameNoTooltip] na okamžik zaváhá a nakloní se blíž, aby si je lépe [Select_CString(bp1_yearly_2000_partner_a.IsFemale,'prohlédla','prohlédl')].\n\nMožná by některý z nich rozjasnil den [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bp1_yearly_2000_partner_a'))], kterého si tolik cením jako [ROOT.Char.Custom2('PartnerOpinionDescription', SCOPE.sC('bp1_yearly_2000_partner_a') )]?"
 bp1_yearly.2000.desc.duo: "\n\nKdyž míjím jednoho z obchodníků se šperky, na okamžik se zastavím a nakloním se blíž, abych si je lépe [Select_CString(ROOT.Char.IsFemale,'prohlédla','prohlédl')].\n\nMožná by některý z nich rozjasnil den [bp1_yearly_2000_partner_a.GetTitledFirstName] nebo [bp1_yearly_2000_partner_b.GetTitledFirstName]?"
 bp1_yearly.2000.a_single: "[ROOT.Char.Custom('RandomJewelry')|U] - přesně pro [bp1_yearly_2000_partner_a.GetFirstNameNoTooltip]!"
 bp1_yearly.2000.a_duo: "[ROOT.Char.Custom('RandomJewelry')|U] - přesně pro [bp1_yearly_2000_partner_a.GetFirstNameNoTooltip]!"
 bp1_yearly.2000.b: "[ROOT.Char.Custom('RandomJewelry')|U] by na [bp1_yearly_2000_partner_b.GetFirstNameNoTooltip] vypadal [ROOT.Char.Custom('RandomPositiveLookAdjective')]."
 bp1_yearly.2000.c: "Proč se spokojit jen s jedním!"
 bp1_yearly.2000.c_flavor: "Rozmazlím je oba!"
 bp1_yearly.2000.d: "Má společnost je dostatečným darem."
 bp1_yearly.2001.t: "...panovníka"
 bp1_yearly.2001.t.first_title_duo: "...panovníka..."
 bp1_yearly.2001.t.second_title_duo: "...a dobrého člověka"
 bp1_yearly.2001.desc.intro_high_opinion: "„Má nejdražší [ROOT.Char.GetFirstNameNoTooltip], tak [Select_CString(bp1_yearly_2001_partner.IsFemale,'ráda','rád')] tě zase vidím!\n\nSleduji, jak svědomitě vládneš našemu [ROOT.Char.Custom('GetRealmOrDomicile')], a [Select_CString(bp1_yearly_2001_partner.IsFemale,'ráda bych ti byla jakkoli nápomocna','rád bych ti byl jakkoli nápomocen')].“"
 bp1_yearly.2001.desc.intro: "„[bp1_yearly_2001_partner.Custom2('RelationToMeShort', ROOT.Char)|U], připadá mi, že se poslední dobou skoro nevídáme!\n\nMožná jsem [Select_CString(bp1_yearly_2001_partner.IsFemale,'narazila','narazil')] na pár drobností, které by se nám při vládnutí mohly hodit.“"
 bp1_yearly.2001.desc.segway_secret_hook: "\n\n[bp1_yearly_2001_partner.GetTitledFirstName] se ohlédne přes rameno "
 bp1_yearly.2001.desc.secret: "„Nedávno jsem [Select_CString(bp1_yearly_2001_partner.IsFemale,'zaslechla','zaslechl')] od služebnictva něco, čemu nebudeš věřit.“"
 bp1_yearly.2001.desc.hook: "„Možná jsem... no, raději se nezabývejme tím, co přesně jsem [Select_CString(bp1_yearly_2001_partner.IsFemale,'udělala','udělal')]. Důležité je, že jeden náš společný známý mi dluží laskavost.“"
 bp1_yearly.2001.desc.segway_lover: "\n\nTichý vánek si pohrává s vlasy [bp1_yearly_2001_partner.GetFirstNameNoTooltip] "
 bp1_yearly.2001.desc.lover: "a já nemohu odtrhnout oči od těch [ROOT.Char.Custom('RandomPositiveLookAdjective')] rysů a snažím se je navždy vtisknout do paměti."
 bp1_yearly.2001.desc.segway_modifier: "\n\nPak sebou [bp1_yearly_2001_partner.GetTitledFirstName] trhne, jako by si na něco důležitého [Select_CString(bp1_yearly_2001_partner.IsFemale,'vzpomněla','vzpomněl')]. „[Select_CString(bp1_yearly_2001_partner.IsFemale,'Mohla','Mohl')] bych "
 bp1_yearly.2001.desc.close_modifier: "dávat pozor na jakékoli... nevhodné... chování, které by se kolem nás mohlo objevit.“"
 bp1_yearly.2001.desc.finance_modifier: "získávat od svého zdroje ty nejlepší rady ohledně financí.“"
 bp1_yearly.2001.desc.close_finance_modifier: "\n\n„Případně bych [Select_CString(bp1_yearly_2001_partner.IsFemale,'mohla','mohl')] získávat od svých zdrojů ty nejlepší rady ohledně financí.“"
 bp1_yearly.2001.desc.fallback: "\n\n„...nebo vlastně ne. [Select_CString(bp1_yearly_2001_partner.IsFemale,'Zmýlila','Zmýlil')] jsem se. Promiň, že jsem tě [Select_CString(bp1_yearly_2001_partner.IsFemale,'připravila','připravil')] o čas!“"
 bp1_yearly.2001.desc.outro: "\n\n[bp1_yearly_2001_partner.GetTitledFirstName] nakloní hlavu a vyčkávavě se na mě zadívá."
 bp1_yearly.2001.a: "Tak povídej, [ROOT.Char.Custom('PartnerOpinionHighDescription')]!"
 bp1_yearly.2001.a.tt_secret: "Tajemství postavy [bp1_yearly_2001_secret_owner.GetTitledFirstName]"
 bp1_yearly.2001.a_tt: "[bp1_yearly_2001_partner.GetShortUINameNoTooltip] se s tebou podělí o tajemství."
 bp1_yearly.2001.b: "Mě zajímáš mnohem víc #EMP ty#!, [ROOT.Char.Custom('LoverPetName')]!"
 bp1_yearly.2001.c: "Jak se ti... Ale nic. Povídej!"
 bp1_yearly.2001.c_tt: "[bp1_yearly_2001_partner.GetShortUINameNoTooltip] ti poskytne páku na jednoho poddaného."
 bp1_yearly.2001.d: "Věřím, že mi budeš krýt záda, [ROOT.Char.Custom('PartnerOpinionHighDescription')]."
 bp1_yearly.2001.e: "Lepší finance bych #EMP rozhodně#! [Select_CString(ROOT.Char.IsFemale,'uvítala','uvítal')]."
 bp1_yearly.2010.t: "Dvě lodě v noci"
 bp1_yearly.2010.desc.intro: "Na první pohled je chodba liduprázdná. Rázným krokem mířím za první dnešní povinností.\n\nNáhle zaslechnu tlumené zahihňání a zarazím se na místě. Nakloním se vpřed a zahlédnu [bp1_yearly_2010_first_partner.GetShortUIName] a [bp1_yearly_2010_second_partner.GetShortUIName],"
 bp1_yearly.2010.desc.default: "jak se v ranním světle něžně objímají.\n\n„[bp1_yearly_2010_second_partner.GetFirstNameNoTooltip], nezahrávej si se mnou, [ROOT.Char.Custom('LoverPetName')]...“ [bp1_yearly_2010_first_partner.GetTitledFirstName] zaboří tvář do šíje [bp1_yearly_2010_second_partner.GetFirstNameNoTooltip].\n\n„Zítřejší noc můžeme strávit spolu, [ROOT.Char.Custom('LoverPetName')],“ odvětí [bp1_yearly_2010_second_partner.GetFirstNameNoTooltip]. „Dokud s tebou mohu trávit své dny, na ničem jiném nezáleží.“"
 bp1_yearly.2010.desc.lustful: "v tak vášnivém objetí, že... ó #EMP můj#!.\n\nZa bílého dne? A co to proboha dělají s tím #EMP [ROOT.Char.Custom('DeviantObjectNoun')]#!?"
 bp1_yearly.2010.a: "To je roztomilé. A možná i užitečné."
 bp1_yearly.2010.a_lustful: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych si začít dělat poznámky!"
 bp1_yearly.2010.a_tt: "Co #EMP dalšího#! se asi děje pod mou střechou..."
 bp1_yearly.2010.a_tt_lustful: "#EMP Tohle#! se mi líbí!"
 bp1_yearly.2010.b: "Možná by se jim hodil #EMP třetí#! pár rukou..."
 bp1_yearly.2010.tt: "To jsou ale poměry!"
 bp1_yearly.2010.c: "Tohle je nehoráznost!"
 bp1_yearly.2010.c_tt: "Mé srdce je zlomené."
 bp1_yearly.5100.t: "Amorův šíp"
 bp1_yearly.5100.desc: "Už přes týden se [unloved_courtier.GetName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('unloved_courtier'))], tváří sklesle a až pátý těžký, zoufalý povzdech dne mě konečně přiměje opatrně se zeptat, co se děje.\n\n„Jsem tak [Select_CString(unloved_courtier.IsFemale,'osamělá','osamělý')]. Chci jen někoho výjimečného! Někoho, kdo bude přes den stát po mém boku a v noci se mnou sdílet lože!“ [unloved_courtier.GetFirstNameNoTooltip] se odmlčí a smutně zavrtí hlavou.\n\n„Co to vůbec říkám? Ty mému trápení nerozumíš, že ne, [ROOT.Char.Custom('FormOfAddressForLiege')]? Jen se na sebe podívej! Vždyť jsi tak "
 bp1_yearly.5100.desc.male: "mužně pohledný!"
 bp1_yearly.5100.desc.female: "přirozeně krásná!"
 bp1_yearly.5100.desc.swole: "[Select_CString(ROOT.Char.IsFemale,'přitažlivá a navíc stavěná jako socha','přitažlivý a navíc stavěný jako socha')]!"
 bp1_yearly.5100.desc.scarred: "[Select_CString(ROOT.Char.IsFemale,'vznešená, zvlášť s těmi jizvami','vznešený, zvlášť s těmi jizvami')]!"
 bp1_yearly.5100.desc.fallback: "dokonale [Select_CString(ROOT.Char.IsFemale,'souměrná','souměrný')]!"
 bp1_yearly.5100.desc.end: "Tobě tohle nikdy nedělalo problém, viď?“"
 bp1_yearly.5100.a: "Prostě buď [Select_CString(unloved_courtier.IsFemale,'sama sebou','sám sebou')], [unloved_courtier.GetNameNoTooltip]!"
 bp1_yearly.5100.b: "Máš pravdu, nedělalo!"
 bp1_yearly.5100.c: "Pomohu ti!"
 bp1_yearly.5100.d: "Neztrácej naději, [unloved_courtier.GetNameNoTooltip]."
 bp1_yearly.5100.toast: "Nevyšlo to."
 bp1_yearly.5101.t: "Amorův šíp: Cíl"
 bp1_yearly.5101.desc: "„Opravdu to uděláš, [ROOT.Char.Custom('FormOfAddressForLiege')]? Opravdu mi pomůžeš?“\n\nVzpomenu si, jak se tvář [unloved_courtier.GetName] rozzářila, když jsem poněkud váhavě [Select_CString(ROOT.Char.IsFemale,'slíbila','slíbil')] pomoc s hledáním lásky. S dohazováním však nemám zrovna mnoho zkušeností, a tak se do davu v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] vydávám spíš s nadějí než s jistotou, že najdu vhodnou známost.\n\nRozhlížím se po tržišti a všímám si několika nadějných tváří, ale kvůli [unloved_courtier.GetNameNoTooltip] bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] hledat především někoho, kdo se k [Select_CString(unloved_courtier.IsFemale,'ní','němu')] hodí. Někoho..."
 bp1_yearly.5101.a: "...laskavého a citlivého."
 bp1_yearly.5101.b: "...spravedlivého a nezaujatého."
 bp1_yearly.5101.c: "...zbožného a horlivého."
 bp1_yearly.5101.d: "...nebo prostě vyberu toho, kdo mě zaujme nejvíc."
 bp1_yearly.5102.t: "Amorův šíp: Zásah do černého"
 bp1_yearly.5102.desc: "Při dalším hledání mě zaujme [Select_CString(potential_lover.IsFemale,'žena, která','muž, který')]"
 bp1_yearly.5102.desc.compassionate: " sedí stranou v koutě náměstí a očividně pomáhá toulavé kočce, která zoufale potřebuje napít. Když ubohé zvíře konejší, začínám si představovat, jak by taková laskavost prospěla jisté nešťastné duši z mého dvora..."
 bp1_yearly.5102.desc.just: " právě urovnává spor mezi dvěma rolníky. Pozorně vyslechne obě strany a nakonec vynese spravedlivý rozsudek, se kterým oba zřejmě souhlasí."
 bp1_yearly.5102.desc.zealous: " pozorně naslouchá kazateli, který hřímá na shromážděný dav. Mně to zní jako blábolení šílence, ale v očích je patrný zápal a každé další náboženské horlení doprovází nadšené přikyvování."
 bp1_yearly.5102.desc.peng: " se rozhodně nedá přehlédnout. Kolem se tlačí hlouček obdivovatelů a poněkud obnošené šaty jen stěží zakrývají nápadně půvabný zjev."
 bp1_yearly.5102.desc.end: "\n\nStačí pozvání k mému [ROOT.Char.Custom('GetCourt')] a příslib možné lásky, aby se [Select_CString(potential_lover.IsFemale,'polichocená a nadšená','polichocený a nadšený')] [potential_lover.GetName] [Select_CString(potential_lover.IsFemale,'vydala','vydal')] se mnou. Vítězoslavně vtrhnu dveřmi a na opačném konci dvora zahlédnu [unloved_courtier.GetName], jak se jako obvykle bezcílně utápí ve své trudomyslnosti.\n\n[unloved_courtier.GetNameNoTooltip] se ke mně otočí s očekáváním a v očích se zaleskne naděje."
 bp1_yearly.5102.a: "[unloved_courtier.GetNameNoTooltip]! Pojď sem!"
 bp1_yearly.5102.b: "Vlastně... možná by bylo lepší to setkání vynechat?"
 bp1_yearly.5102.c: "„Na někoho, jako je [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('unloved_courtier'))] [unloved_courtier.GetNameNoTooltip], je tě škoda.“"
 bp1_yearly.5102.a.success: "Padnou si do oka"
 bp1_yearly.5102.a.failure: "Jiskra nepřeskočí"
 bp1_yearly.5301.t: "Těžký problém"
 bp1_yearly.5301.start: "[concerned_friend.GetFirstName] mě během večeře celý večer pozoruje, "
 bp1_yearly.5301.thicc: "ale teprve když si s chutí nechám naložit třetí porci [ROOT.Char.Custom('GetExpensiveDessert')], náhle udeří pěstí do stolu.\n\n„Už to nemůžu nechat jen tak!“ vykřikne. „Nemůžu tu sedět a dívat se, jak se ujíš k smrti, [ROOT.Char.GetFirstName]!“\n\nTrochu mě to popudí, ale s plnými ústy se těžko tvářím pohoršeně. Možná si #EMP opravdu#! občas [Select_CString(ROOT.Char.IsFemale,'ráda','rád')] něco zobnu, ale vládnout [ROOT.Char.GetPrimaryTitle.GetTierAsName] je zatraceně stresující!"
 bp1_yearly.5301.thinn: "ale teprve když se stále jen nimrám v prvním chodu, zatímco se přede mnou hromadí další, náhle udeří pěstí do stolu.\n\n„Už to nemůžu nechat jen tak!“ vykřikne. „Nemůžu tu sedět a dívat se, jak chřadneš před očima, [ROOT.Char.GetFirstName]!“\n\nTrochu mě to popudí, ale za rostoucí hromadou talířů se těžko tvářím pohoršeně. Možná si #EMP opravdu#! na jídlo nenacházím dost času, ale vládnout [ROOT.Char.GetPrimaryTitle.GetTierAsName] zabere skoro všechen čas!"
 bp1_yearly.5301.a: "Víš co, [concerned_friend.GetFirstNameNoTooltip]? Máš pravdu."
 bp1_yearly.5301.a.tt: "Společně hledáte způsob, jak se dostat do formy"
 bp1_yearly.5301.b: "Nejsem zas tak [Select_CString(ROOT.Char.IsFemale,'tlustá','tlustý')]!"
 bp1_yearly.5301.b.tt: "Pokusíš se dokázat, že máš pravdu"
 bp1_yearly.5301.c: "Nejsem zas tak [Select_CString(ROOT.Char.IsFemale,'hubená','hubený')]!"
 bp1_yearly.5301.d: "Ty máš co mluvit o vzhledu!"
 bp1_yearly.5301.d.tt: "Pustíte se do poněkud trapné pěstní rvačky"
 bp1_yearly.5301.d.tt.win: "Rvačku vyhraješ"
 bp1_yearly.5301.d.tt.lose: "Rvačku prohraješ"
 bp1_yearly.5302.t: "$bp1_yearly.5301.t$: Kamenitá cesta"
 bp1_yearly.5302.desc: "Je svěží slunečný den a z brady [concerned_friend.GetFirstName] stéká pot, zatímco mě dál povzbuzuje. Pytel kamení na mých zádech se pod svou vahou napíná a já sténám spolu s ním, když ho konečně shodím za čáru, kterou [concerned_friend.GetFirstNameNoTooltip] [Select_CString(concerned_friend.IsFemale,'nakreslila','nakreslil')] klackem do hlíny. [concerned_friend.GetFirstNameNoTooltip] nadšeně zatleská.\n\n„Už teď vypadáš silněji! Myslím, že je čas pustit se do něčeho trochu většího.“\n\n„Na vedlejším poli zrovna odvodňují půdu a nějaká pomoc by se jim hodila. Nebo, jestli si troufáš, za tím hřebenem je hájek, kde kácejí stromy. Co myslíš?“"
 bp1_yearly.5302.a: "Přines mi sekeru!"
 bp1_yearly.5302.a.tt: "Vyrazíš k hájku"
 bp1_yearly.5302.b: "Raději zůstanu u toho odvodňování."
 bp1_yearly.5302.b.tt: "Vyrazíš na nedaleké pole"
 bp1_yearly.5303.t: "$bp1_yearly.5301.t$: Vzhůru na dřevo"
 bp1_yearly.5303.desc: "Kácení stromů je pro někoho tak nezkušeného, jako jsem já, nebezpečná práce. Ani pod bedlivým dohledem [concerned_friend.GetFirstName] mě kombinace nepozornosti a vyčerpání neuchránila před několika okamžiky, kdy šlo doslova o vlásek. Zaseknu sekeru do nedalekého kmene a na chvíli si odpočinu, abych se napil z čutory. [concerned_friend.GetFirstNameNoTooltip] ke mně přichází s vlastní sekerou přehozenou přes rameno.\n\n„Myslím, že už jsi [Select_CString(ROOT.Char.IsFemale,'připravená','připravený')] na něco trochu většího!“ pronese vesele a ukáže sekerou. Strom, na který míří, je obrovský, mohutný listnáč tyčící se vysoko nad námi. Obezřetně si ho měřím a bolavé svaly se při té představě napnou."
 bp1_yearly.5303.a: "No, jak těžké to může být?"
 bp1_yearly.5303.a.criticalsuccess: "Úspěšně strom pokácíš!"
 bp1_yearly.5303.a.failure: "Bez pomoci strom pokácet nedokážeš"
 bp1_yearly.5303.a.wounded: "Padající strom tě zasáhne"
 bp1_yearly.5303.a.criticalfailure: "Strom spadne přímo na tebe!"
 bp1_yearly.5303.b: "Pomůžeš mi, [concerned_friend.GetFirstNameNoTooltip]?"
 bp1_yearly.5304.t: "$bp1_yearly.5301.t$: Po kolena v bahně"
 bp1_yearly.5304.desc: "Práce na podmáčené, bažinaté půdě, s jejímž odvodněním jsem se [Select_CString(ROOT.Char.IsFemale,'nabídla','nabídl')] pomoci, ze mě lije pot. Bok po boku s nic netušícími sedláky tvrdě kopu krumpáčem příkopy a odnáším pytle mokrého bahna pryč.\n\nS [concerned_friend.GetFirstName] právě odpočíváme na úzkém pruhu pevné země mezi dvěma močály, když ke mně zamíří [waterboy.GetFirstName], jedno z dětí pověřených roznášením vody dělníkům, a nabídne mi čutoru. Sotva se napiji, [waterboy.GetFirstNameNoTooltip] se natáhne po lahvi, ztratí rovnováhu a spadne přímo do močálu!"
 bp1_yearly.5304.a: "Drž se, dítě! Mám tě!"
 bp1_yearly.5304.b: "...všiml by si vůbec někdo kromě nás, kdyby se [waterboy.GetFirstNameNoTooltip] [Select_CString(waterboy.IsFemale,'utopila','utopil')]?"
 bp1_yearly.5305.t: "$bp1_yearly.5301.t$: Ve skvělé kondici"
 bp1_yearly.5305.desc: "Když je práce hotová, rozloučím se se sedláky, po jejichž boku jsme s [concerned_friend.GetFirstName] pracovali. Vesele mi zamávají, aniž by tušili cokoli o mém urozeném původu, a já se vrátím do svého obvyklého příbytku. Svaly mě sice bolí, ale zároveň překypuji silou a vitalitou.\n\nNa druhé straně místnosti zahlédnu velkou nádobu s vodou, zvednu se na nohy a přistoupím k ní. Sundám si košili a v mihotavém světle svíček si prohlížím svůj odraz na hladině."
 bp1_yearly.5305.a: "Vypadám skvěle!"
 bp1_yearly.5305.b: "Za všechno vděčím tobě, [concerned_friend.GetFirstNameNoTooltip]."
 bp1_yearly.5306.t: "$bp1_yearly.5301.t$: Zkouška síly"
 bp1_yearly.5306.start: "Rozzuřeně přecházím po [ROOT.Char.Custom('GetCourt')] a [concerned_friend.GetFirstName] mě následuje.\n\n„[ROOT.Char.GetFirstName]! Prosím, nemusíš mi nic dokazovat! Prostě zapomeňme, že jsem vůbec něco [Select_CString(concerned_friend.IsFemale,'řekla','řekl')]!“ Má pohrdavá mávnutí rukou však další slova utnou, zatímco očima pátrám po něčem dostatečně těžkém. Jak se opovažuje takhle zpochybňovat mou čest!\n\n"
 bp1_yearly.5306.artifact: "Můj pohled spočine na [bulky_artifact.GetName]. "
 bp1_yearly.5306.throne: "Můj pohled spočine na mém trůnu."
 bp1_yearly.5306.table: "Můj pohled spočine na masivním stole."
 bp1_yearly.5306.ending: "K hrůze [concerned_friend.GetFirstNameNoTooltip] ze sebe strhnu košili a okamžitě se postavím tak, abych tu obrovskou váhu [Select_CString(ROOT.Char.IsFemale,'zvedla','zvedl')]."
 bp1_yearly.5306.a: "Sleduj mě, [concerned_friend.GetFirstNameNoTooltip]!"
 bp1_yearly.5306.a.success: "Vyzdvihneš to do vzduchu!"
 bp1_yearly.5306.a.failure: "Natáhneš si záda"
 bp1_yearly.5306.a.criticalfailure: "Upustíš to na sebe!"
 bp1_yearly.5306.a.criticalsuccess: "Zvedneš to do vzduchu"
 bp1_yearly.5306.b: "...když o tom tak přemýšlím, možná máš pravdu."
 bp1_yearly.5800.t: "Podivný zápach"
 bp1_yearly.5800.desc: "Ráno se probudím vedle [surprised_sniffer.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('surprised_sniffer'))], spokojeně si povzdechnu a líně se protáhnu. Pak si ale všimnu, jak můj milovaný protějšek krčí nos. Otevřu ústa, abych se [Select_CString(ROOT.Char.IsFemale,'zeptala','zeptal')], co se děje, ale [surprised_sniffer.GetFirstNameNoTooltip] se ode mě ještě víc odtáhne.\n\n„Poslyš, [ROOT.Char.GetFirstName], lásko...“ začne rychle, jako by ta slova mimoděk vyklouzla z úst. „Těžko se mi o tom mluví, ale... poslední dobou zrovna nevoníš.“\n\nOhromeně si podezřívavě #flatulence přičichnu#! k podpaží.\n\nNo... možná na tom něco bude."
 bp1_yearly.5800.a: "Musíme vymyslet, jak to napravit!"
 bp1_yearly.5800.a.tt: "Hledáš způsob, jak problém vyřešit"
 bp1_yearly.5800.b: "Není to #EMP tak#! hrozné!"
 bp1_yearly.5801.t: "$bp1_yearly.5800.t$: Prvotřídní"
 bp1_yearly.5801.desc: "Unaveně zívnu, zatímco mě [surprised_sniffer.GetFirstName] nadšeně vede do nedalekého města. Na cestě [Select_CString(surprised_sniffer.IsFemale,'trvala','trval')] hned, jak to bylo možné - což je při zpětném pohledu vlastně trochu urážlivé - a teď se prodíráme menším davem ke stánku obchodníka s ovocem a bylinami.\n\n„Tak!“ pronese [surprised_sniffer.GetFirstNameNoTooltip] s očekáváním. „Vyber si něco z tohohle. Vůni to dodá svěží, ovocný úvod!“ Nad mým nechápavým výrazem jen protočí oči.\n\n„Vyrábíme přece #EMP parfém#!!“"
 bp1_yearly.5801.a: "Tohle je fík?"
 bp1_yearly.5801.b: "Co třeba trochu máty?"
 bp1_yearly.5801.c: "Líbí se mi vůně citronu!"
 bp1_yearly.5801.d: "Granátové jablko bude drahé..."
 bp1_yearly.5801.fig: "[perfume_bottle.GetDesc] Nese v sobě tóny fíků"
 bp1_yearly.5801.mint: "[perfume_bottle.GetDesc] Nese v sobě tóny máty"
 bp1_yearly.5801.lemon: "[perfume_bottle.GetDesc] Nese v sobě tóny citronu"
 bp1_yearly.5801.pomegranate: "[perfume_bottle.GetDesc] Nese v sobě tóny granátového jablka"
 bp1_yearly.5802.t: "$bp1_yearly.5800.t$: Ze srdce"
 bp1_yearly.5802.desc: "Po své volbě před týdnem jsem na snahu [surprised_sniffer.GetFirstName] namíchat mi vůni skoro [Select_CString(ROOT.Char.IsFemale,'zapomněla','zapomněl')]. Vzpomenu si na ni až ve chvíli, kdy se [surprised_sniffer.GetFirstNameNoTooltip] uprostřed ulice náhle zastaví, prudce se otočí a odtáhne mě ke stánku obchodníka s kořením.\n\n„Tohle bude dokonalé!“ zajásá. „Cokoli z toho se skvěle hodí do srdce parfému!“\n\nProhlížím si vystavené koření a vykuřovadla. Tolik z nich je mým očím cizích a exotických."
 bp1_yearly.5802.a: "Co je tohle... kardamom?"
 bp1_yearly.5802.b: "Říkáš, že se tomu říká muškátový oříšek?"
 bp1_yearly.5802.c: "Ta skořice nádherně voní!"
 bp1_yearly.5802.d: "Kadidlo by tomu dodalo božskou vůni!"
 bp1_yearly.5802.cardamom: "[perfume_bottle.GetDesc], aromatického kardamomu"
 bp1_yearly.5802.nutmeg: "[perfume_bottle.GetDesc], pronikavého muškátového oříšku"
 bp1_yearly.5802.cinnamon: "[perfume_bottle.GetDesc], hřejivé skořice"
 bp1_yearly.5802.frankincense: "[perfume_bottle.GetDesc], kořeněného kadidla"
 bp1_yearly.5803.t: "$bp1_yearly.5800.t$: Pevný základ"
 bp1_yearly.5803.desc: "Když míjíme obchodníka na kraji lesa, který prodává nejrůznější druhy dřeva a výrobky z něj, stihne mě jen na okamžik přepadnout neblahé tušení. Oči [surprised_sniffer.GetFirstName] se vzápětí rozzáří a už mě táhne ke stánku.\n\n„Tak #EMP tohle#! je přesně to, co potřebujeme!“ [surprised_sniffer.GetFirstNameNoTooltip] ukáže na hromádku vzácnějšího dřeva a pryskyřic po obchodníkově levici. „Ty vůni dodají pořádný základ a vydrží díky nim celý den!“"
 bp1_yearly.5803.a: "Dub je poctivé dřevo!"
 bp1_yearly.5803.b: "Tyhle pryskyřice se mi líbí."
 bp1_yearly.5803.c: "Santalové dřevo? To je ale nezvyklé."
 bp1_yearly.5803.d: "Těmhle hoblinám říkáš „oud“? Voní nasládle!"
 bp1_yearly.5803.oak: "[perfume_bottle.GetDesc], výrazného dubového dřeva"
 bp1_yearly.5803.resin: "[perfume_bottle.GetDesc], jantarové pryskyřice"
 bp1_yearly.5803.sandalwood: "[perfume_bottle.GetDesc], jemného santalového dřeva"
 bp1_yearly.5803.oud: "[perfume_bottle.GetDesc], sladce pryskyřičného oudu"
 bp1_yearly.5804.t: "$bp1_yearly.5800.t$: Poslední kapka"
 bp1_yearly.5804.desc: "Navzdory počátečním pochybnostem mě shánění přísad do parfému začalo docela bavit. Proto mě potěší zpráva o obchodníkovi v nedalekém městě, který nabízí několik nesmírně vzácných a vyhledávaných surovin, jež by mě mohly zajímat.\n\nProhlížím si jeho zboží. Několik stébel sušené trávy, bílý prášek a... cosi, co připomíná matné, drolivé šedé kameny?\n\nObchodník na mě vyčkávavě hledí, zatímco [surprised_sniffer.GetFirstName] si prohlíží nabídku."
 bp1_yearly.5804.a: "No, tahle sušená tráva alespoň hezky voní."
 bp1_yearly.5804.a.tt: "Koupíš vetiver."
 bp1_yearly.5804.b: "Ten bílý prášek by se snad dal dobře zpracovat."
 bp1_yearly.5804.b.tt: "Koupíš kafr."
 bp1_yearly.5804.c: "Říkáš, že tohle jsou #EMP velrybí zvratky#!?!"
 bp1_yearly.5804.c.tt: "Koupíš ambru."
 bp1_yearly.5804.d: "Nic z toho nevypadá ani trochu použitelně!"
 bp1_yearly.5805.t: "$bp1_yearly.5800.t$: Svůdná vůně"
 bp1_yearly.5805.desc: "Před několika dny jsem místnímu řemeslníkovi [Select_CString(ROOT.Char.IsFemale,'předala','předal')] všechny nasbírané přísady a teď se směsicí radosti a nervozity rozbaluji kožený obal hotového parfému.\n\nUvnitř se skrývá malá prostá lahvička naplněná směsí barev. Na první pohled je [ROOT.Char.Custom('GetSimpleColor')], ale když ji pozvednu proti světlu, promění se v [ROOT.Char.Custom('GetComplexColor')].\n\nOtevřu jednoduchou zátku a vůně pohladí mé smysly. Nadšeně zavolám [surprised_sniffer.GetFirstName] a společně žasneme nad vůní, která se line po [ROOT.Char.Custom('GetRoom')]."
 bp1_yearly.5805.a: "Připadám si jako nejbohatší [Select_CString(ROOT.Char.IsFemale,'žena','muž')] na světě!"
 bp1_yearly.5805.b: "Trochu si odliji a lahvičku nechám své lásce."
 bp1_yearly.5805.vetiver: "[perfume_bottle.GetDesc] a dřevitého, kožovitého vetiveru."
 bp1_yearly.5805.camphor: "[perfume_bottle.GetDesc] a bylinného, kořeněného kafru."
 bp1_yearly.5805.ambergris: "[perfume_bottle.GetDesc] a sladké, zemité ambry."
 bp1_yearly.5805.blended: "[perfume_bottle.GetDesc] a vydává sladkou vůni."
 bp1_yearly.5708.t: "Věrný přítel"
 bp1_yearly.5708.start: "Procházím rušnou uličkou a [heathen_friend.GetFirstName] mi dělá společnost, když mi náhle zmizí z očí. Otočím se a spatřím [heathen_friend.GetFirstNameNoTooltip] zabraného do hovoru s obchodníkem, jehož zboží tvoří převážně nejrůznější podivné cetky. Když je obchod uzavřen, [heathen_friend.GetFirstNameNoTooltip] se ke mně vrátí a zamyšleně si pohrává s novým úlovkem.\n\n"
 bp1_yearly.5708.normal: "„Je to náboženský symbol. Ne tvého vyznání, [heathen_friend.Custom2('RelationToMeShort', ROOT.Char)], ale mého,“ vysvětlí [heathen_friend.GetFirstNameNoTooltip]. Když zahlédne můj vlastní symbol zavěšený na řetízku kolem krku, na tváři se [Select_CString(heathen_friend.IsFemale,'jí','mu')] objeví úsměv."
 bp1_yearly.5708.aniconist: "„Je to jen malá vonná tyčinka, [heathen_friend.Custom2('RelationToMeShort', ROOT.Char)]. Pomáhá mi soustředit mysl při modlitbách,“ vysvětlí [heathen_friend.GetFirstNameNoTooltip]. Když na mě pohlédne, na tváři se [Select_CString(heathen_friend.IsFemale,'jí','mu')] objeví úsměv."
 bp1_yearly.5708.end: "„Vždycky jsem si [Select_CString(heathen_friend.IsFemale,'vážila','vážil')] toho, jak dobře se ke mně chováš navzdory našim rozdílům ve víře.“"
 bp1_yearly.5708.a: "Tohle jsou pohanské nesmysly!"
 bp1_yearly.5708.b: "No, když [heathen_friend.GetFirstNameNoTooltip] přece jen není tak [Select_CString(heathen_friend.IsFemale,'špatná','špatný')], pak..."
 bp1_yearly.5708.b.tt: "Všichni [GetTrait('zealous').GetName( GetNullCharacter )] vazalové jiné [Concept('faith','víry')|E] na tebe ztratí #negative_value 10#! [Concept('opinion','mínění')|E]"
 bp1_yearly.5708.c: "Možná se od [heathen_friend.GetFirstNameNoTooltip] mohu něco naučit?"
 bp1_yearly.5708.c.tt.success: "Dozvíš se více o zvycích postavy [heathen_friend.GetFirstNameNoTooltip]"
 bp1_yearly.5708.c.tt.failure: "Nedokážeš pochopit zvyky postavy [heathen_friend.GetFirstNameNoTooltip]"
 bp1_yearly.5709.t: "Na háčku..."
 bp1_yearly.5709.desc: "Jak nádherný den na rybaření! [friend_backup.GetFirstName] mi dělá společnost a nic by mi snad nedokázalo setřít úsměv z tváře, nebýt hlasu, který se ozve za námi.\n\n„Jen se podívejme, koho to tu máme!“ [rival_on_sight.GetFirstName], očividně právě po vlastním rybolovu, stojí po boku [rival_friend.GetFirstName]. Sáhne dolů a popadne jeden ze zmítajících se úlovků. „Ta podoba je #EMP neuvěřitelná#!!“\n\nS teatrálním protočením očí se obrátím k odchodu, ale náhlé #EMP žuchnutí#! a studená voda stékající po zátylku mě zarazí. [friend_backup.GetFirstNameNoTooltip] přimhouří oči a zadívá se na rybu, kterou po nás právě hodili."
 bp1_yearly.5709.a: "Vyřídíme si to pěstmi!"
 bp1_yearly.5709.a.tt.success: "Rvačku vyhraješ"
 bp1_yearly.5709.a.tt.failure: "Rvačku prohraješ"
 bp1_yearly.5709.b: "[rival_on_sight.GetFirstNameNoTooltip], ty [rival_on_sight.Custom2('InsultNoun', ROOT.Char)]! Vyzývám tě na souboj!"
 bp1_yearly.5709.b.tt: "Zahájíš $game_concept_single_combat_duel$ s [rival_on_sight.GetFirstNameNoTooltip]"
 bp1_yearly.5709.c: "Do téhle dětinské rvačky se zatáhnout nenechám."
 bp1_yearly.5709.c.tt: "Necháš je jejich dětinskému chování."
 bp1_yearly.5711.t: "...a potopíš se"
 bp1_yearly.5711.desc: "[rival_on_sight.GetFirstName] se po našem souboji vratce vyškrábe na nohy a stále se pošetile tváří vzdorovitě. Otevře ústa, aby si začal stěžovat, ale sotva ze sebe vydá hlásku, nacpu [Select_CString(rival_on_sight.IsFemale,'jí','mu')] do nich rybu, která ještě před chvílí sloužila jako střela. [rival_on_sight.GetFirstNameNoTooltip] zavrávorá a nebezpečně se přiblíží k okraji mola.\n\nRychle vykročím vpřed a vrazím [Select_CString(rival_on_sight.IsFemale,'jí','mu')] chodidlo přímo do břicha. Na okamžik, který se zdá být věčností, visí [rival_on_sight.GetFirstNameNoTooltip] ve vzduchu - rukama divoce máchá, oči má vytřeštěné a rybu stále připlácnutou k obličeji - než se náhle zřítí přímo dolů.\n\nMohutné šplouchnutí vyšle do vzduchu gejzír vody a [Select_CString(rival_friend.IsFemale,'zděšená','zděšený')] [rival_friend.GetFirstName] se vrhne k okraji mola, aby tonoucímu člověku [Select_CString(rival_friend.IsFemale,'podala','podal')] ruku."
 bp1_yearly.5711.a: "Ty tam můžeš taky!"
 bp1_yearly.5711.b: "Ha! Dobře ti tak!"
 bp1_yearly.5712.t: "Něco ti nevoní?"
 bp1_yearly.5712.desc: "Zuřivě se vyškrábu na nohy. [rival_on_sight.GetFirstName] a [rival_friend.GetFirstName] se mi posmívají. Jenže na nohou se sotva držím, a když se pokusím výhružně píchnout prstem do hrudi [rival_on_sight.GetFirstNameNoTooltip], setrvačnost mě odnese úplně kolem. Stačí mi podrazit nohy a vzápětí mám výhled znovu plný hlíny.\n\n[rival_on_sight.GetFirstNameNoTooltip] se vítězoslavně šklebí a sarkasticky tleská, zatímco se převalím na záda. Zlost ve mně znovu vzplane, ale sotva se posadím, ta zatracená ryba mě s hlasitým #EMP plesknutím#! znovu trefí přímo do obličeje! [rival_on_sight.GetFirstNameNoTooltip] a [rival_friend.GetFirstNameNoTooltip] propuknou v hurónský smích a odcházejí, zatímco [friend_backup.GetFirstName] mi konečně pomůže zpátky na nohy."
 bp1_yearly.5712.a: "Na tohle nezapomenu, [rival_on_sight.GetFirstNameNoTooltip]!"
 bp1_yearly.5712.b: "Možná bych se [rival_on_sight.GetFirstNameNoTooltip] [Select_CString(ROOT.Char.IsFemale,'měla','měl')] raději klidit z cesty..."
 bp1_yearly.5713.t: "Neuvážené závazky"
 bp1_yearly.5713.desc: "Jakmile spolu ulehneme, hned poznám, že [destitute_spouse.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('destitute_spouse'))], něco trápí. [destitute_spouse.GetFirstNameNoTooltip] je očividně duchem jinde, a tak [Select_CString(destitute_spouse.IsFemale,'ji','ho')] jemně vezmu za ruku a zeptám se, co se děje.\n\n„Jde... o peníze.“ [destitute_spouse.GetFirstNameNoTooltip] si povzdechne a volnou rukou si přejede po hlavě. „Někteří z mé rodiny měli smůlu a hrozí jim, že přijdou o domov. Jako dítě jsem tam [Select_CString(destitute_spouse.IsFemale,'trávila','trávil')] spoustu času...“\n\nPak na mě prosebně pohlédne. „Nemohli bychom... nemohli bychom něco udělat? Určitě by nám to později splatili, jen se potřebují znovu postavit na nohy. Přísahám, že se na ně můžeme spolehnout!“"
 bp1_yearly.5713.a: "Postarám se o to. A teď se nech #EMP postarat#! o #EMP tebe...#!"
 bp1_yearly.5713.b: "Dostanou všechno, co potřebují, a ještě něco navíc."
 bp1_yearly.5713.c: "Nech to na mně."
 bp1_yearly.5713.d: "Jak se opovažuješ ze mě tahat peníze?!"
 bp1_yearly.5714.t: "Rozloučení"
 bp1_yearly.5714.desc: "V srdci mám hlubokou, bezednou prázdnotu.\n\n[deceased_pal.GetFirstName] mi [Select_CString(deceased_pal.IsFemale,'byla stálou společnicí a důvěrnicí','byl stálým společníkem a důvěrníkem')] a [Select_CString(deceased_pal.IsFemale,'její','jeho')] ztráta v mém životě bolí jako smrtelná rána, ze které se už nikdy nevzpamatuji. V ruce svírám vzkaz, který mi [deceased_pal.GetFirstNameNoTooltip] [Select_CString(deceased_pal.IsFemale,'dala','dal')] - #EMP poslední#! vzkaz, který mi kdy dá, uvědomím si hořce. Pokusím se ho přečíst, ale nakonec ho jen odtáhnu od tváře, aby vzácná slova nesmyly mé slzy.\n\nPřestože mě obklopuje dav truchlících, nikdy jsem se [Select_CString(ROOT.Char.IsFemale,'necítila sama','necítil sám')]."
 bp1_yearly.5714.a: "Na tento den nikdy nezapomenu."
 bp1_yearly.5714.a.catharsis: "#weak Pocítíš alespoň jistou úlevu#!"
 bp1_yearly.5714.a.sad: "#weak Necháš svůj žal volně proudit#!"
 bp1_yearly.5714.a.reallysad: "#weak Žal tě zcela pohltí#!"
 bp1_yearly.5714.a.depressed: "#weak Propadneš depresi#!"
 bp1_yearly.5714.b: "Musím být [Select_CString(ROOT.Char.IsFemale,'silná','silný')] a jít dál."
 bp1_yearly.5715.t: "Bazilika, nebo basilika?"
 bp1_yearly.5715.desc: "„Ne! Takhle se to prostě nevyslovuje! Ctihodný učenec, který ten výraz #EMP zavedl#!, přece jasně vyslovoval ostré ‚s‘-“\n\nS [gibbet_friend.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('gibbet_friend'))], vedeme bouřlivou hádku, která ani zdaleka nekončí. Když jsme míjeli nedalekou baziliku, [gibbet_friend.GetFirstNameNoTooltip] se o ní [Select_CString(gibbet_friend.IsFemale,'zmínila','zmínil')]. Jelikož jazyk [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] ovládám plynně, jemně jsem [Select_CString(gibbet_friend.IsFemale,'ji','ho')] [Select_CString(ROOT.Char.IsFemale,'opravila','opravil')] ve výslovnosti - je to přece „bazilika“, ne „basilika“, #EMP samozřejmě#! - a [gibbet_friend.GetFirstNameNoTooltip] [Select_CString(gibbet_friend.IsFemale,'měla','měl')] tu drzost nesouhlasit. A ještě k tomu tak vehementně!\n\n„Nemůžu uvěřit, že se pořád držíš tohohle [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('gibbet_friend'))] názoru na výslovnost!“ vyhrkne [gibbet_friend.GetFirstNameNoTooltip], očividně [Select_CString(gibbet_friend.IsFemale,'rozčilená','rozčilený')] mou neústupností."
 bp1_yearly.5715.a: "Shodneme se, že se neshodneme."
 bp1_yearly.5715.b: "Je to „bazilika“. A tím to končí!"
 bp1_yearly.5715.c: "„Bazilika.“ A já ti to dokážu!"
 bp1_yearly.5716.t: "Pryč, [ROOT.Char.GetFaith.random_EvilGodNames]!"
 bp1_yearly.5716.desc: "Při procházení po [ROOT.Char.Custom('GetCourt')] zaslechnu zvýšený hlas, který už hraničí se vztekem. Vrátím se a přede mnou se odehrává neobvyklá scéna. [book_burner.GetFirstName] stojí nad [book_child.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('book_child'))], a spílá [Select_CString(book_child.IsFemale,'jí','mu')], zatímco [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('book_burner'))] hází další knihu do chřtánu praskajícího ohně.\n\n„Žádnou další z téhle #EMP nečisté špíny#! už číst nebudeš!“ zahřmí [book_burner.GetFirstNameNoTooltip] a odsoudí další knihu k plamenům. „Žádné dítě v tomto domě už [ROOT.Char.GetFaith.DevilName] nezkazí!“"
 bp1_yearly.5716.nobook: "\n\nZ hromady, kterou [book_burner.GetFirstNameNoTooltip] [Select_CString(book_burner.IsFemale,'určila','určil')] ke zničení, vezmu jednu knihu. Nenacházím v ní nic závadného, jen... návod na stavění malých hradů z hlíny?"
 bp1_yearly.5716.yesbook: "\n\nNatáhnu se po [burned_book.GetName] z hromady, kterou [book_burner.GetFirstNameNoTooltip] [Select_CString(book_burner.IsFemale,'určila','určil')] ke zničení, přesně ve chvíli, kdy po ní sáhne také."
 bp1_yearly.5716.a: "Takový hřích nelze tolerovat!"
 bp1_yearly.5716.b: "Nu, cokoli pro zachování klidu..."
 bp1_yearly.5716.c: "Okamžitě přestaň! Dítě se musí učit!"
 bp1_yearly.5717.t: "Opilecká rvačka"
 bp1_yearly.5717.desc: "Krčma v [tavern_county.GetNameNoTier] bývá dokonalým místem, kde zapomenout na starosti světa, ale dnešní večer je výjimkou.\n\nJako naschvál sedí [5717_nemesis.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('5717_nemesis'))], jen o stůl vedle mě a [bff_defender.GetFirstName] a od našeho příchodu nám nedá pokoj. Stačí, aby mi ještě jednou „náhodou“ [Select_CString(5717_nemesis.IsFemale,'vylila','vylil')] trochu [5717_nemesis.Custom('RegionalDrink')] na ruku, a [bff_defender.GetFirstNameNoTooltip] už stojí na nohou.\n\n[5717_nemesis.GetFirstNameNoTooltip] se zvedne také a než se stihnu vyškrábat na nohy i já, už proti sobě stojí v poněkud opileckém bojovém postoji."
 bp1_yearly.5717.a: "Dej [Select_CString(5717_nemesis.IsFemale,'jí','mu')] do držky, [bff_defender.GetFirstNameNoTooltip]!"
 bp1_yearly.5717.a.tt.win: "[bff_defender.GetNameNoTooltip] rvačku vyhraje"
 bp1_yearly.5717.a.tt.lose: "[bff_defender.GetNameNoTooltip] rvačku prohraje"
 bp1_yearly.5717.b: "[5717_nemesis.GetFirstNameNoTooltip] ti za to nestojí!"
 bp1_yearly.5717.c: "Ustup stranou. [5717_nemesis.GetFirstNameNoTooltip] je [Select_CString(5717_nemesis.IsFemale,'moje','můj')]."
 bp1_yearly.5717.c.tt: "#weak Svůj spor si jdete vyřídit ven...#!"
 bp1_yearly.5717.c.tt.duel: "Mezi tebou a [5717_nemesis.GetFirstNameNoTooltip] začne [Concept('single_combat_duel','osobní souboj')|E]"
 bp1_yearly.5718.t.win: "Rvačku jsi [Select_CString(ROOT.Char.IsFemale,'vyhrála','vyhrál')]"
 bp1_yearly.5718.t.lose: "Rvačku jsi [Select_CString(ROOT.Char.IsFemale,'prohrála','prohrál')]"
 bp1_yearly.5719.t: "Daňové potíže"
 bp1_yearly.5719.start: "Už několik dní si [chancellor.GetFirstName], [Select_CString(chancellor.IsFemale,'má kancléřka','můj kancléř')], všímá, že část příjmů někam záhadně mizí. Teď, když mám před sebou důkazy, si předvolám [Select_CString(disloyal_vassal.IsFemale,'vazalku','vazala')] [disloyal_vassal.GetFirstName], aby mi to [Select_CString(disloyal_vassal.IsFemale,'vysvětlila','vysvětlil')].\n\nDůkazy, které [chancellor.GetFirstNameNoTooltip] [Select_CString(chancellor.IsFemale,'předložila','předložil')], jsou nezvratné. [disloyal_vassal.GetFirstNameNoTooltip] [Select_CString(disloyal_vassal.IsFemale,'zpronevěřovala','zpronevěřoval')] daně, které náležely mně!"
 bp1_yearly.5719.normal: "[Select_CString(disloyal_vassal.IsFemale,'Zkorumpovaná','Zkorumpovaný')] [disloyal_vassal.GetTitleAsNameNoTooltip|l] se ani nepokusí hájit a jen se samolibě usmívá.\n\n„Je to všechno pravda, [ROOT.Char.Custom('FormOfAddressForLiege')]. Prostě jsem [Select_CString(disloyal_vassal.IsFemale,'zatoužila','zatoužil')] po naditější pokladnici.“\n\nTohle je otevřená výzva mé autoritě."
 bp1_yearly.5719.terrified: "[Select_CString(disloyal_vassal.IsFemale,'Zkorumpovaná','Zkorumpovaný')] [disloyal_vassal.GetTitleAsNameNoTooltip|l] se pokouší obhájit, ale pod tíhou mého hněvu sotva hledá slova.\n\nV očích [disloyal_vassal.GetFirstNameNoTooltip] vidím strach, zatímco před [Select_CString(disloyal_vassal.IsFemale,'ní','ním')] přecházím sem a tam a okázale předstírám, že zvažuji své rozhodnutí."
 bp1_yearly.5719.a: "Ty peníze vrátíš a na dnešní den nezapomeneš!"
 bp1_yearly.5719.a.tt.dread: "#medium Tato možnost je dostupná díky tvé vysoké úrovni [Concept('dread','hrůzy')|E] #!"
 bp1_yearly.5719.b: "Vrať ty peníze. Hned."
 bp1_yearly.5719.b.tt.win: "[disloyal_vassal.GetFirstNameNoTooltip] neochotně peníze vrátí"
 bp1_yearly.5719.b.tt.lose: "[disloyal_vassal.GetFirstNameNoTooltip] se tvému požadavku otevřeně vysměje"
 bp1_yearly.5719.c: "Možná bychom mohli najít kompromis?"
 bp1_yearly.5719.d: "Jen... už to znovu nedělej!"
 bp1_yearly.5720.t: "Zkouška síly"
 bp1_yearly.5720.desc: "Během tohoto hodování už mám v sobě několik pohárů [ROOT.Char.Custom('RegionalDrink')], ale večer mi kazí proklatá přítomnost [rival_challenger.GetFirstName].\n\n„Ty [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rival_challenger'))]! Ty [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rival_challenger'))]!“ zařve [rival_challenger.GetFirstNameNoTooltip]. „V souboji síly bys [Select_CString(ROOT.Char.IsFemale,'neporazila','neporazil')] ani dítě! Klidně bych ti teď [Select_CString(rival_challenger.IsFemale,'přitlačila','přitlačil')] ruku ke stolu, aniž bych se u toho [Select_CString(rival_challenger.IsFemale,'zapotila','zapotil')]!“"
 bp1_yearly.5720.a: "Jistě. Levou rukou, že ano?"
 bp1_yearly.5720.a.tt: "U [THIS.Char.Custom('GetCourt')] mi to možná na oblibě nepřidá, ale bude to #EMP nádherný#! pocit..."
 bp1_yearly.5720.b: "Ha! Ha! Tak pojď!"
 bp1_yearly.5720.b.tt.win: "[rival_challenger.GetNameNoTooltip] porazíš s pohrdavou lehkostí"
 bp1_yearly.5720.b.tt.bigwin: "Zlomíš [rival_challenger.GetNameNoTooltip] ruku"
 bp1_yearly.5720.c: "Tak to dokaž, ty [rival_challenger.Custom2('InsultNoun', ROOT.Char)]!"
 bp1_yearly.5720.c.tt.win: "Porazíš [rival_challenger.GetFirstNameNoTooltip]"
 bp1_yearly.5720.c.tt.lose: "[rival_challenger.GetFirstNameNoTooltip] ti přitlačí ruku ke stolu"
 bp1_yearly.5720.d: "Do těchhle malicherných her se zatáhnout nenechám."
 bp1_yearly.5721.t: "U ohně"
 bp1_yearly.5721.desc: "To je ale nádherná noc! Táborák praská a syčí a kouř stoupá vzhůru k noční obloze. Medová pochoutka napíchnutá na konci mého klacíku pomalu karamelizuje a já se zájmem sleduji, jak mění barvu.\n\nVedle mě dělá [marshmallow_friend.GetFirstName] totéž, zatímco dospělí popíjejí [ROOT.Char.Custom('RegionalDrink')] a baví se příběhy o událostech z dávných časů, mnoho let předtím, než jsme se vůbec narodili.\n\nS [marshmallow_friend.GetFirstNameNoTooltip] jsme spolu zatím moc nemluvili, ale jednou by bylo fajn popovídat si s někým přibližně stejně starým..."
 bp1_yearly.5721.a: "Ne... nechceš se se mnou kamarádit, [marshmallow_friend.GetFirstNameNoTooltip]?"
 bp1_yearly.5721.a.tt.yes: "Navážete přátelství"
 bp1_yearly.5721.a.tt.no: "[marshmallow_friend.GetFirstNameNoTooltip] nemá zájem"
 bp1_yearly.5721.b: "To byla zábava!"
 bp1_yearly.5721.c: "Další dobrota by se hodila..."
 bp1_yearly.5721.c.tt: "Stačilo by malé rozptýlení a nejspíš bys [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] sebrat sladkost, kterou si [marshmallow_friend.GetFirstNameNoTooltip] opéká..."
 bp1_yearly.5722.t: "Kočkopult"
 bp1_yearly.5722.desc: "„Zase se setkáváme, [ROOT.Char.GetFirstName], ty [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rival_catapulter'))]!“ ušklíbne se [rival_catapulter.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rival_catapulter'))], když mě osloví při prohlídce nového vojenského vybavení. „Konečně se my dva čestní lidé střetneme za rovných podmínek- ha! Mám tě!“\n\nChvíli mi trvá, než pochopím, že [rival_catapulter.GetFirstNameNoTooltip] právě popadl moji kočku [ROOT.Char.Custom('CatStoryName')], a další okamžik, než mi dojde, že s ní bere nohy na ramena. Jakmile se vzpamatuji z šoku, rozběhnu se za [Select_CString(rival_catapulter.IsFemale,'ní','ním')], jen abych [Select_CString(rival_catapulter.IsFemale,'ji','ho')] zastihl, jak mou milovanou kočku nakládá do nedalekého katapultu!\n\nUdělám k němu jediný krok s nataženou rukou, ale už je pozdě.\n\n„Mňáááá#DIE1 áááá#!#DIE2 áááááá—#!“"
 bp1_yearly.5722.a: "To tedy ne!"
 bp1_yearly.5722.a.tt: "Srazíš [rival_catapulter.GetFirstNameNoTooltip] k zemi dřív, než stačí uniknout"
 bp1_yearly.5722.b: "[ROOT.Char.Custom('CatStoryName')]! #EMP Nééééé!#!"
 bp1_yearly.5722.c: "Dostanu tě, [rival_catapulter.GetFirstNameNoTooltip]! PŘÍSAHÁM!"
 bp1_yearly.5723.t: "Daleký dostřel"
 bp1_yearly.5723.desc: "[rival_catapulter.GetFirstName] vytřeští oči překvapením a strachem, když [Select_CString(rival_catapulter.IsFemale,'ji','ho')] srazím k zemi.\n\n„[Select_CString(rival_catapulter.IsFemale,'Mohla jsi','Mohl jsi')] mi ublížit.“ Znovu se postavím a požádám okolní stráže o provaz.\n\n„[Select_CString(rival_catapulter.IsFemale,'Mohla jsi','Mohl jsi')] dokonce ublížit mé rodině,“ pokračuji a svazuji [Select_CString(rival_catapulter.IsFemale,'své bezmocné zajatkyni','svému bezmocnému zajatci')] ruce i nohy.\n\n„Ale [Select_CString(rival_catapulter.IsFemale,'udělala jsi','udělal jsi')] osudovou chybu. [Select_CString(rival_catapulter.IsFemale,'Ublížila jsi','Ublížil jsi')] #EMP [ROOT.Char.Custom('CatStoryName')]#!.“ [rival_catapulter.GetFirstNameNoTooltip], se spoutanými končetinami třesoucími se strachy, otevře ústa a chystá se prosit.\n\nNatáhnu ruku k páce."
 bp1_yearly.5723.a: "#EMP Pružžž!#!"
 bp1_yearly.5723.b: "Ušetřím tě. Kvůli [ROOT.Char.Custom('CatStoryName')]."
 bp1_yearly.5724.t: "[ROOT.Char.Custom('CatStoryName')]: Kočka je v pohodě"
 bp1_yearly.5724.desc: "Poslední tři dny nad mým životem visí temný mrak. Má drahá, nevinná [ROOT.Char.Custom('CatStoryName')]... občas mám pocit, jako bych stále [Select_CString(ROOT.Char.IsFemale,'slyšela','slyšel')] mňoukání.\n\nNe, počkat... já #EMP opravdu#! slyším mňoukání. Přísahám! Vzrušeně se rozběhnu přes místnost a zakopnu o nízký stolek sotva do půli lýtek. Zakleji a vyškrábu se na nohy. Další zamňoukání, tentokrát hlasitější a žalostnější. Konečně dorazím ke dveřím, prudce je otevřu a tam sedí [ROOT.Char.Custom('CatStoryName')] - živá, zdravá a pořádně naštvaná!\n\nOkamžitě svou milovanou kočku popadnu do náruče a zabořím tvář do špinavé srsti plné větviček.\n\n[ROOT.Char.Custom('CatStoryName')] se mi v náručí vztekle zmítá."
 bp1_yearly.5724.a: "[ROOT.Char.Custom('CatStoryName')]! Ty #EMP žiješ!#!"
 bp1_yearly.5724.b: "Už tě nikdy nepustím!"
 bp1_yearly.5725.t: "Divoká [Select_CString(khutulun.IsFemale,'žena','muž')]"
 bp1_yearly.5725.desc: "„#EMP Jak#! je možné, že jsi o [Select_CString(khutulun.IsFemale,'ní','něm')] ještě [Select_CString(ROOT.Char.IsFemale,'neslyšela','neslyšel')], [ROOT.Char.Custom('FormOfAddressForLiege')]?“\n\nProtočím oči a odmítavě zabručím. Říct, že mě teď výmysly [matchmaker_courtier.GetFirstName] ani trochu nezajímají, by bylo ještě slabé slovo.\n\n„Říká se, že [khutulun.GetFirstNameNoTooltip] přijme výzvu od kohokoli, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]!“ zkusí to [matchmaker_courtier.GetFirstNameNoTooltip] znovu, tentokrát naléhavěji. Spiklenecky ztiší hlas a pokračuje. „Poslyš, vím, že už máš dost všech těch otázek kolem sňatku. [Select_CString(khutulun.IsFemale,'Tahle žena nabízí svou ruku komukoli, kdo ji dokáže porazit v souboji tělesných schopností','Tenhle muž nabízí svou ruku komukoli, kdo ho dokáže porazit v souboji tělesných schopností')].“\n\nOpřu se a zamyslím nad tím příběhem. [Select_CString(khutulun.IsFemale,'Žena','Muž')] se zálibou v boji? Jistě dokážu zvítězit a odvézt si novou [Select_CString(khutulun.IsFemale,'manželku','manžela')], bez ohledu na [Select_CString(khutulun.IsFemale,'její','jeho')] schopnosti."
 bp1_yearly.5725.a: "Dobrá, [matchmaker_courtier.GetFirstNameNoTooltip], pojedeme se na to podívat."
 bp1_yearly.5725.b: "Dost už těch báchorek!"
 bp1_yearly.5726.t: "[Select_CString(khutulun.IsFemale,'Nevěsta samá modřina','Ženich samá modřina')]"
 bp1_yearly.5726.desc: "Po náročném dni v sedle dorazíme na místo, kde se podle [matchmaker_courtier.GetFirstName] náš cíl často zdržuje, a naskytne se nám překvapivý pohled. Štíhlá postava [khutulun.GetFirstNameNoTooltip] právě zápasí s postavou, která je mnohem mohutnější.\n\nZa normálních okolností by to sotva vypadalo jako vyrovnaný souboj, ale o okamžik později skončí překvapivým výsledkem. [khutulun.GetFirstNameNoTooltip] se široce usměje, velkoryse pomůže protivníkovi na nohy a pak stočí pohled ke mně.\n\n„Tebe jsem v těchto končinách ještě [Select_CString(khutulun.IsFemale,'neviděla','neviděl')]!“ ušklíbne se [khutulun.GetFirstNameNoTooltip] a předvede přehnaně okázalou úklonu. „Jmenuji se [khutulun.GetFirstName]. Vím, proč jsi tady, ale varuji tě: kdo marní můj čas, musí mi za tu námahu zaplatit.“"
 bp1_yearly.5726.a: "Pozdrav [Select_CString(ROOT.Char.IsFemale,'svou novou manželku','svého nového manžela')], [khutulun.GetFirstNameNoTooltip]!"
 bp1_yearly.5726.a.tt.win: "Porazíš [khutulun.GetFirstNameNoTooltip]"
 bp1_yearly.5726.a.tt.lose: "[khutulun.GetFirstNameNoTooltip] tě porazí"
 bp1_yearly.5726.b: "Tady možná bude opatrnost lepší než odvaha..."
 bp1_yearly.5727.t: "Svatební zvony?"
 bp1_yearly.5727.desc: "[khutulun.GetFirstName] unaveně odfoukne, když se od sebe po dalším zápasnickém sevření odtrhneme. Ani já na tom nejsem o mnoho lépe a začíná mi být jasné, proč [khutulun.GetFirstNameNoTooltip] dosud zůstává [Select_CString(khutulun.IsFemale,'neprovdaná','neženatý')]. S úsměvem je vidět, jak si tuhle výzvu užívá.\n\n„Pro mě bys [Select_CString(ROOT.Char.IsFemale,'byla dobrá žena','byl dobrý muž')]!“ poznamená a nespouští oči z mých pohybů. „Škoda, že tě budu muset zklamat!“\n\n[khutulun.GetFirstNameNoTooltip] znovu vyrazí vpřed, tentokrát jsem však připraven. Obratně uskočím stranou, vyvedu [Select_CString(khutulun.IsFemale,'ji','ho')] z rovnováhy a podmetu [Select_CString(khutulun.IsFemale,'jí','mu')] nohy.\n\nKdyž [Select_CString(khutulun.IsFemale,'jí','mu')] nabídnu ruku, v tváři se mísí šok, úžas a nadšení."
 bp1_yearly.5727.a: "Dohoda je dohoda."
 bp1_yearly.5727.b: "Nu, [Select_CString(ROOT.Char.IsFemale,'dosáhla','dosáhl')] jsem všeho, kvůli čemu jsem sem [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')]."
 bp1_yearly.5727.c: "Pro [khutulun.GetFirstNameNoTooltip] jen to nejlepší!"
 bp1_yearly.5728.t: "Žhavá rivalita"
 bp1_yearly.5728.desc: "Jiskry z táboráku líně stoupají spolu s kouřem k noční obloze, ale tentokrát si ten pohled nedokážu užít.\n\nPřed ohněm vítězoslavně stojí [rival_burner.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rival_burner'))], a vyzývá mě, ať se přiblížím. V ruce svírá můj vlastní artefakt: [burned_artifact.GetName], který mi ta zmije ukradla.\n\n„Ani krok blíž, [ROOT.Char.GetFirstName]!“ zavolá. „Jen se pohni a tvá drahocenná cetka skončí v plamenech!“\n\n„[rival_burner.GetFirstNameNoTooltip]!“ vykřiknu. „Vrať mi, co je moje, a tím náš spor skončí!“ Odpovědí je mi jen široký úšklebek a [burned_artifact.GetName] se ocitne ještě blíž ohni."
 bp1_yearly.5728.a: "Tak to spal, ty [rival_burner.Custom2('InsultNoun', ROOT.Char)]!"
 bp1_yearly.5728.b: "Krádež? Bojíš se mi postavit?"
 bp1_yearly.5728.b.tt.duel: "Mezi tebou a [rival_burner.GetFirstNameNoTooltip] začne [Concept('single_combat_duel','osobní souboj')|E]"
 bp1_yearly.5729.tt.lose: "[rival_burner.GetFirstNameNoTooltip] artefakt spálí"
 bp1_yearly.5730.t: "Kde je kouř..."
 bp1_yearly.5730.desc: "[rival_burner.GetFirstName] se po našem souboji [Select_CString(rival_burner.IsFemale,'potlučená a samá modřina pracně zvedá','potlučený a samá modřina pracně zvedá')] na nohy. V očích [Select_CString(rival_burner.IsFemale,'jí','mu')] plane stejný žár jako v táboráku po boku, když vidí, jak si [burned_artifact.GetName] zasouvám pod paži.\n\nNaši společníci se vracejí z místa, kde předtím postávali opodál. Jejich rozhovor postupně utichá, když nás spatří stát proti sobě po skončeném souboji.\n\nPohlédnu na [burned_artifact.GetNameNoTooltip] a potom zpět na [rival_burner.GetFirstNameNoTooltip], [Select_CString(rival_burner.IsFemale,'která','který')] kvůli jeho zničení [Select_CString(rival_burner.IsFemale,'riskovala','riskoval')] zdraví i život."
 bp1_yearly.5730.a: "Ať je ti to ponaučením."
 bp1_yearly.5730.b: "Vezmi si to. Ať ti to navždy připomíná dnešní noc."
 bp1_yearly.5730.b.tt: "[burned_artifact.GetName] získá #N negativní#! modifikátory"
 bp1_yearly.8000.t: "Vytoužený nárok"
 bp1_yearly.8000.desc: "[bp1_8000_informer.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bp1_8000_informer'))], je [Select_CString(bp1_8000_informer.IsFemale,'celý den nesvá','celý den nesvůj')] a očividně hledá správná slova.\n\nKonečně, když se vydáme k jídlu, [bp1_8000_informer.GetFirstNameNoTooltip] rozpačitě začne: „[bp1_8000_informer.Custom2('RelationToMeShort', ROOT.Char)]..."
 bp1_yearly.8000.desc_vassal: "říká se, že [bp1_8000_new_rival.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bp1_8000_new_rival'))], bere své údajné nároky na tvé země každým dnem vážněji...“"
 bp1_yearly.8000.desc_foreign: "slýchám zvěsti, že [bp1_8000_new_rival.GetFirstName], [bp1_8000_new_rival.GetTitleAsNameNoTooltip] z [bp1_8000_new_rival.GetPrimaryTitle.GetBaseNameNoTier], začíná veškerou svou zášť obracet proti tobě..."
 bp1_yearly.8000.desc_single: "\n\n„Otevřeně tvrdí, že [ROOT.Char.GetTitleAsNameNoTooltip] z [bp1_8000_claimed_title.GetNameNoTier] vládne nelegitimně a každý den [Select_CString(bp1_8000_new_rival.IsFemale,'ji','ho')] připravuje o země a příjmy, které [Select_CString(bp1_8000_new_rival.IsFemale,'jí','mu')] právem náležejí.“"
 bp1_yearly.8000.desc_multi: "\n\n„Tvou pokračující vládu nad územím, které považuje za své právoplatné panství - zejména [bp1_8000_claimed_title.GetNameNoTier] - bere jako osobní křivdu.“"
 bp1_yearly.8000.a: "Ha! [bp1_8000_new_rival.Custom2('InsultNoun', ROOT.Char)|U]!"
 bp1_yearly.8000.b: "Okamžitě [bp1_8000_new_rival.GetFirstNameNoTooltip] napíšu."
 bp1_yearly.8000.b.success: "Tvůj dopis obměkčí [bp1_8000_new_rival.GetTitledFirstNameNoTooltip]"
 bp1_yearly.8000.b.failure: "[bp1_8000_new_rival.GetTitledFirstNameNoTooltip] tvůj dopis ignoruje"
 bp1_yearly.8000.c: "Takže zrada."
 bp1_yearly.8000.c.success: "Tví muži zatknou [bp1_8000_new_rival.GetTitledFirstNameNoTooltip]"
 bp1_yearly.8000.c.failure: "[bp1_8000_new_rival.GetTitledFirstNameNoTooltip] unikne"
 bp1_yearly.8000.d: "Jistě jsou to jen bezvýznamné tlachy."
 bp1_yearly.8000.d.rival: "Zvěsti byly pravdivé"
 bp1_yearly.8000.d.bluff: "[bp1_8000_new_rival.GetTitledFirstNameNoTooltip] jen blafoval"
 bp1_yearly_8000_trusting_modifier: "Důvěřivost vůči poddaným"
 bp1_yearly_8000_trusting_modifier_desc: "Tato postava je známá tím, že svým poddaným důvěřuje, dokud se neprokáže opak."
 bp1_yearly.8010.opening: "[bp1_8010_best_friend.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp1_yearly.8010.desc: "Ó [bp1_8010_best_friend.GetFaith.HighGodName], každý den děkuji za to, že mám tak skvělého [ROOT.Char.Custom('GetFriendNoun')] jako jsi ty - jen málokomu jinému mohu s jistotou říct, že mu důvěřuji. \n\nMěli bychom své zájmy ještě více spojit a bojovat bok po boku. Pojď, [ROOT.Char.GetFirstNameNoTooltip], naši nepřátelé poznají, že si s námi není radno zahrávat!"
 bp1_yearly.8010.a: "Ano! Máš k dispozici mou [bp1_8010_best_friend.Custom('SignatureWeaponNameOrType')]!"
 bp1_yearly.8010.b: "Nejsem si [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')], [bp1_8010_best_friend.GetFirstNameNoTooltip]..."
 bp1_yearly.8020.opening: "[bp1_8020_friend.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp1_yearly.8020.desc: "[Select_CString(bp1_8020_friend.IsFemale,'Doslechla','Doslechl')] jsem se o tvých sporech s tím [bp1_8020_rival.Custom2('InsultAdjective', SCOPE.sC('bp1_8020_friend'))] [bp1_8020_rival.Custom2('InsultNoun', SCOPE.sC('bp1_8020_friend'))], [bp1_8020_rival.GetFirstName] - žalostnou napodobeninou člověka.\n\nVzhledem k našim společným zájmům jsem si [Select_CString(bp1_8020_friend.IsFemale,'jistá','jistý')], že si budeme dobře rozumět, [Select_CString(ROOT.Char.IsFemale,'přítelkyně','příteli')]."
 bp1_yearly.8020.a: "Už se těším, až si o tom promluvíme podrobněji."
 bp1_yearly.8020.b: "Poslové jsou dnes tak nespolehliví..."
 bp1_yearly.8020.b.flavor: "Přepošli dopis [bp1_8020_rival.GetTitledFirstNameNoTooltip]"
 bp1_yearly.8020.b.joke: "[bp1_8020_rival.GetTitledFirstNameNoTooltip] oceňuje tvou otevřenost"
 bp1_yearly.8020.b.insult: "Zpráva [bp1_8020_rival.GetTitledFirstNameNoTooltip] rozzuří"
 bp1_yearly.8020.c: "Tohle je podlá hra od podlého hráče."
 bp1_yearly.8020.d: "Ty nejsi žádný můj přítel, [bp1_8020_friend.GetFirstNameNoTooltip]."
 bp1_yearly.8040.t: "Protiklady"
 bp1_yearly.8040.desc.opening: "[Select_CString(bp1_yearly_8040_friend.IsFemale,'Má dobrá přítelkyně','Můj dobrý přítel')] [bp1_yearly_8040_friend.GetTitledFirstName] se ke mně posledních pár dní chová odtažitě a každý večer odmítá mé pozvání k večeři.\n\nDnes mě [bp1_yearly_8040_friend.GetFirstNameNoTooltip] zastihne o samotě v [ROOT.Char.Custom('GetChamber')]. „[ROOT.Char.GetFirstNameNoTooltip], mrzí mě to, ale [Select_CString(bp1_yearly_8040_friend.IsFemale,'jako tvá přítelkyně','jako tvůj přítel')] ti to musím říct.“\n\n„Tvé "
 bp1_yearly.8040.desc.diligent: "neustálé pracovní vytížení a nároky na výsledky"
 bp1_yearly.8040.desc.brave: "zbytečné riskování a bezhlavá odvaha"
 bp1_yearly.8040.desc.just: "puntičkářské rozsudky a nekonečné probírání důkazů"
 bp1_yearly.8040.desc.compassionate: "soucítění s každým utrpením a starost o druhé"
 bp1_yearly.8040.desc.fickle: "neustálé změny názorů a ochota nechat se snadno přesvědčit"
 bp1_yearly.8040.desc.temperate: "odtažitost od hodovní tabule"
 bp1_yearly.8040.desc.generous: "otevřený měšec pro každého, kdo požádá o pomoc"
 bp1_yearly.8040.desc.humble: "neustálé umenšování vlastní důležitosti"
 bp1_yearly.8040.desc.honest: "odmítání klamat druhé, i když je to třeba"
 bp1_yearly.8040.desc.forgiving: "přehlížení urážek a trpění neloajality"
 bp1_yearly.8040.desc.wrathful: "prchlivost a neustálé výbuchy hněvu"
 bp1_yearly.8040.desc.calm: "klid i tváří v tvář naprosto oprávněnému rozhořčení"
 bp1_yearly.8040.desc.cynical: "pochybování o božském záměru [ROOT.Char.GetFaith.HighGodName]"
 bp1_yearly.8040.desc.zealous: "horlivost, s jakou následuješ [ROOT.Char.GetFaith.AltPriestTermPlural]"
 bp1_yearly.8040.desc.paranoid: "nekonečné pochybování o pohnutkách ostatních"
 bp1_yearly.8040.desc.trusting: "bezmezná důvěra v úmysly všech ostatních"
 bp1_yearly.8040.desc.shy: "nechuť rozmlouvat s ostatními"
 bp1_yearly.8040.desc.gregarious: "věčné rozptylování planým tlacháním a veselím"
 bp1_yearly.8040.desc.lustful: "otročení vlastnímu chtíči a pokušením"
 bp1_yearly.8040.desc.chaste: "odpor k tělesným rozkoším"
 bp1_yearly.8040.desc.impatient: "pošetilý zvyk vrhat se do všeho po hlavě"
 bp1_yearly.8040.desc.patient: "přehnaná opatrnost a rozvláčné reagování na události"
 bp1_yearly.8040.desc.content: "nedostatek touhy uspět a překonat své vrstevníky"
 bp1_yearly.8040.desc.ambitious: "neutuchající potřeba hnát se dál bez konce a cíle"
 bp1_yearly.8040.desc.closing: " - ti nedělají dobrou službu. Copak nevidíš, že [ROOT.Char.GetTitleAsNameNoTooltip] by se takhle chovat [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')]?“"
 bp1_yearly.8040.a: "Jak se #EMP opovažuješ#! se mnou takhle mluvit? Ven!"
 bp1_yearly.8040.a.lazy: "Nemůžeme si o tom promluvit později?"
 bp1_yearly.8040.a.diligent: "Jen tohle dokončím a pak si promluvíme."
 bp1_yearly.8040.a.craven: "Riskování je pro hlupáky."
 bp1_yearly.8040.a.brave: "Mně to zní jako zbabělost."
 bp1_yearly.8040.a.arbitrary: "Mohu se chovat, jak se mi zachce."
 bp1_yearly.8040.a.just: "Jinak by to nebylo správné."
 bp1_yearly.8040.a.callous: "Ach, už zmlkni."
 bp1_yearly.8040.a.compassionate: "Své srdce nezatvrdím."
 bp1_yearly.8040.a.stubborn: "Můj názor nezměníš."
 bp1_yearly.8040.a.fickle: "Ano, jak myslíš!"
 bp1_yearly.8040.a.gluttonous: "Promluvíme si o tom po večeři."
 bp1_yearly.8040.a.temperate: "Všeho s mírou."
 bp1_yearly.8040.a.greedy: "Cože, a nechat ostatní utrácet #EMP mé#! peníze?"
 bp1_yearly.8040.a.generous: "Pro všechny je toho dost."
 bp1_yearly.8040.a.arrogant: "Já jsem [ROOT.Char.GetTitleAsNameNoTooltip]!"
 bp1_yearly.8040.a.humble: "Jsem jen [Select_CString(ROOT.Char.IsFemale,'jedna žena','jeden muž')] z bezpočtu dalších."
 bp1_yearly.8040.a.deceitful: "Pravda tě nespasí."
 bp1_yearly.8040.a.honest: "Pravda je, že lžeš."
 bp1_yearly.8040.a.vengeful: "Vzpomenu si na to, až budeš #EMP ty#! stát o #EMP mou#! společnost."
 bp1_yearly.8040.a.forgiving: "Nic si z toho nedělej, na tvou drzost už jsem [Select_CString(ROOT.Char.IsFemale,'zapomněla','zapomněl')]."
 bp1_yearly.8040.a.wrathful: "Jak se #EMP opovažuješ#! se mnou takhle mluvit?!"
 bp1_yearly.8040.a.calm: "Uklidni se, není třeba se rozčilovat."
 bp1_yearly.8040.a.cynical: "O tom přece rozhodne [ROOT.Char.GetFaith.HighGodName], nebo snad ne?"
 bp1_yearly.8040.a.zealous: "O tom rozhodne [ROOT.Char.GetFaith.HighGodName]!"
 bp1_yearly.8040.a.paranoid: "Ne... už i #EMP ty#!!"
 bp1_yearly.8040.a.trusting: "Děkuji, vždycky stojíš při mně."
 bp1_yearly.8040.a.shy: "Nemůžeš mě nechat o samotě?"
 bp1_yearly.8040.a.gregarious: "Uhni, ostatní na mě čekají."
 bp1_yearly.8040.a.lustful: "Myslím, že jsi [Select_CString(bp1_yearly_8040_friend.IsFemale,'byla příliš dlouho sama','byl příliš dlouho sám')]."
 bp1_yearly.8040.a.chaste: "Tak snadno se zlákat nenechám."
 bp1_yearly.8040.a.impatient: "Na tohle nemám čas."
 bp1_yearly.8040.a.patient: "Práce kvapná, málo platná."
 bp1_yearly.8040.a.content: "A kdy už toho bude dost?"
 bp1_yearly.8040.a.ambitious: "Nenechám se předběhnout."
 bp1_yearly.8040.b: "Shodněme se, že se neshodneme! Trochu se uvolni."
 bp1_yearly.8040.b.success: "[bp1_yearly_8040_friend.GetTitledFirstNameNoTooltip] nakonec ustoupí"
 bp1_yearly.8040.b.failure: "[bp1_yearly_8040_friend.GetTitledFirstNameNoTooltip] zachová kamennou tvář"
 bp1_yearly.8040.c: "Máš pravdu, [bp1_yearly_8040_friend.GetFirstNameNoTooltip]."
 bp_yearly_8040_trying_to_be_mindful_modifier: "Zamyšlení nad vlastními chybami"
 bp_yearly_8040_trying_to_be_mindful_modifier_desc: "Tato postava byla konfrontována se svými povahovými nedostatky a snaží se na ně více dbát."
 bp1_yearly.8050.t: "[Select_CString(victim_scope.IsFemale,'Zavražděná','Zavražděný')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim_scope'))|U]"
 bp1_yearly.8050.desc: "Ztráta [victim_scope.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim_scope'))], mě nesmírně tíží. Nekonečný proud truchlících poddaných a jejich slova útěchy nedokážou zaplnit prázdnotu v mém srdci. \n\nStále nemohu uvěřit, že [victim_scope.GetFirstNameNoTooltip] [victim_scope.GetDeathReasonHideKiller], ani tomu, že [murderer_scope.GetTitledFirstName], [Select_CString(murderer_scope.IsFemale,'její vražedkyně','jeho vrah')], zůstává [Select_CString(murderer_scope.IsFemale,'nepotrestána','nepotrestán')]. \n\n"
 bp1_yearly.8050.desc.prisoner: "Ačkoli [murderer_scope.GetFirstNameNoTooltip] hnije v žaláři [murderer_scope.GetImprisonedBy.GetTitledFirstNameNoTooltip], ani to nedokáže uhasit zuřivost v mém srdci."
 bp1_yearly.8050.desc.free: "Když pomyslím na tu zrůdu, která si stále chodí po svobodě, zatínám pěsti a krev mi buší ve spáncích... Je to urážka spravedlnosti — a [ROOT.Char.GetFaith.HighGodName] si takovou troufalost nenechá líbit."
 bp1_yearly.8050.a: "Jednou tě pomstím, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim_scope'))]..."
 bp1_yearly.8050.b: "Tady ten krvavý řetězec končí."
 bp1_yearly.8060.t: "V mé moci"
 bp1_yearly.8060.opening: "Na okamžik se rozhlédnu po [combat_location.GetTerrain.GetNameNoTooltip|l] u [combat_location.GetNameNoTooltip], posetém mrtvými z řad [primary_combat_winner.GetPrimaryTitle.GetAdjectiveNoTooltip] i [primary_combat_loser.GetPrimaryTitle.GetAdjectiveNoTooltip] vojsk, a pak obrátím pozornost ke spoutaným válečným zajatcům. \n\n"
 bp1_yearly.8060.desc.nemesis: "[captured_rival.GetTitledFirstName], [captured_rival.Custom2('InsultNoun', ROOT.Char)], je konečně v mých rukou! [ROOT.Char.GetFaith.NegativeAfterLife] je jistě [Select_CString(captured_rival.IsFemale,'jejím','jeho')] údělem. Jak dlouho jsem [Select_CString(ROOT.Char.IsFemale,'snila','snil')] o tom, že [captured_rival.GetFirstNameNoTooltip] srazím na kolena..."
 bp1_yearly.8060.desc.war_leader: "Konečně držím [captured_rival.GetTitledFirstName] v rukou a vítězství v této válce je nyní téměř jisté...\n\n„Vzdávám se,“ zavrčí [captured_rival.GetFirstNameNoTooltip]. „Propusť mě a dostaneš, co chceš.“"
 bp1_yearly.8060.desc: "[captured_rival.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('captured_rival'))], na mě zachmuřeně zírá, což mě hřeje u srdce."
 bp1_yearly.8060.closing.multi: "\n\nZa [captured_rival.GetFirstNameNoTooltip] netrpělivě klečí [Select_CString(captured_rival_2.IsFemale,'ničemná','ničemný')] [captured_rival_2.GetTitledFirstName]."
 bp1_yearly.8060.closing.ransom: "\n\n„Mám právo na výkupné!“ vyhrkne [captured_rival.GetFirstNameNoTooltip] až příliš zoufale."
 bp1_yearly.8060.a.war_leader: "Tahle válka skončila, ale jen pro tebe."
 bp1_yearly.8060.a.ransom: "Psi nemají právo na výkupné."
 bp1_yearly.8060.a: "Tvé dny jsou sečteny, špíno."
 bp1_yearly.8060.b: "Zabijte [Select_CString(captured_rival.IsFemale,'ji','ho')]. Zabijte je všechny."
 bp1_yearly.8060.c: "Postarám se, abys na dnešní den nikdy [Select_CString(captured_rival.IsFemale,'nezapomněla','nezapomněl')], [captured_rival.GetFirstNameNoTooltip]."
 bp1_yearly.8060.d: "Pamatuj na mou milost, červe."
 bp1_yearly.8060.d.multi: "Nezapomeňte na mou milost, bídáci."
 bp1_yearly.8061.t: "V moci [combat_winner.GetTitledFirstNameNoTooltip]"
 bp1_yearly.8061.desc: "Stojím na chaotickém [combat_location.GetTerrain.GetNameNoTooltip|l] u [combat_location.GetNameNoTooltip] pod dohledem nepřátelských stráží, zatímco [battle_rival_winner.GetTitledFirstName], [battle_rival_winner.Custom2('InsultNoun', ROOT.Char)], si prohlíží své vítězství.\n\nNakonec ke mně přistoupí a se škodolibou radostí tasí [battle_rival_winner.Custom('SignatureWeaponNameOrType')]. V očích [Select_CString(battle_rival_winner.IsFemale,'jí','mu')] se děsivě zableskne.\n\n"
 bp1_yearly.8061.killed: "Vidím, že tohle je konec..."
 bp1_yearly.8061.a: "„Ty [battle_rival_winner.Custom2('InsultAdjective', ROOT.Char)]-!“"
 bp1_yearly.8061.b: "„Takhle ne!“"
 bp1_yearly.8061.c: "[ROOT.Char.GetFaith.HighGodName], ochraň mě."
 bp1_yearly.8062.wounded: "„Tohle bude bolet.“ [battle_rival_winner.GetFirstNameNoTooltip] se zašklebí."
 bp1_yearly.8062.a: "„[battle_rival_winner.Custom2('InsultNoun', ROOT.Char)]!“"
 bp1_yearly.8070.t: "[ROOT.Char.GetGovernment.GetNameNoTooltip|U] protekce"
 bp1_yearly.8070.opening: "[claim_vassal.GetTitledFirstName] celý večer mlčky vře vzteky, ale když sáhnu po [ROOT.Char.Custom('GetExpensiveMealAlt')], konečně vybuchne.\n\n„Prostě nechápu, proč jsi [claim_title.GetName] [Select_CString(ROOT.Char.IsFemale,'udělila','udělil')] [favorite_vassal.GetTitledFirstName]."
 bp1_yearly.8070.strength_strong: "Můj právoplatný nárok na tyto země přece uznávají všichni!“\n\n"
 bp1_yearly.8070.strength_weak: "Tyto země mi po právu náleží!“\n\n"
 bp1_yearly.8070.claim: "„Proč dáváš přednost [favorite_vassal.GetTitledFirstNameNoTooltip] přede mnou? Copak jsem ti [Select_CString(claim_vassal.IsFemale,'nebyla věrnou vazalkou','nebyl věrným vazalem')]?“"
 bp1_yearly.8070.lowborn: "„Povýšit místo mě [Select_CString(favorite_vassal.IsFemale,'tu neurozenou povýšenkyni','toho neurozeného povýšence')] je urážka!“"
 bp1_yearly.8070.other: "„Čím tak strašným jsem se [Select_CString(claim_vassal.IsFemale,'provinila','provinil')], že se mnou zacházíš tak nedůstojně?“"
 bp1_yearly.8070.hostile: "\n\n„Dát země raději zatracenému [favorite_vassal.GetFaith.GetAdherentName] než mně!“ prská [ROOT.Char.Custom2('RelationToMe', claim_vassal)]. „To se příčí svědomí!“"
 bp1_yearly.8070.culture: "\n\n„Vždyť...“ prská [ROOT.Char.Custom2('RelationToMe', claim_vassal)], „[favorite_vassal.GetTitledFirstNameNoTooltip] ani nepochází z [claim_vassal.GetCulture.GetName] kultury!“"
 bp1_yearly.8070.faith: "\n\n„Vždyť...“ prská [ROOT.Char.Custom2('RelationToMe', claim_vassal)], „[favorite_vassal.GetTitledFirstNameNoTooltip] ani není [ROOT.Char.GetFaith.GetAdherentName]!“"
 bp1_yearly.8070.a: "[favorite_vassal.GetFirstNameNoTooltip] má vlastnosti, které tobě chybí."
 bp1_yearly.8070.b: "Odpusť mi, [claim_vassal.GetFirstNameNoTooltip]. [claim_title.GetNameNoTierNoTooltip] je tvůj."
 bp1_yearly.8070.c: "Udělím ti jiný titul."
 bp1_yearly.8070.d: "Už nikdy nezpochybňuj má rozhodnutí."
 bp1_yearly.8070.d.success: "[claim_vassal.GetTitledFirstNameNoTooltip] se uklidní"
 bp1_yearly.8070.d.failure: "[claim_vassal.GetTitledFirstNameNoTooltip] se cítí uraženě"
 bp1_yearly.8100.t: "Neoblíbený oblíbenec"
 bp1_yearly.8100.joke: "Ještě se usmívám nad vtipem, kterým mě při dnešním ranním zasedání rady [Select_CString(sycophant_scope.IsFemale,'pobavila','pobavil')] [sycophant_scope.GetFirstName], [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], když mě [jealous_scope.GetTitledFirstName] chytí za paži."
 bp1_yearly.8100.thighs: "Jdu zamyšleně chodbou a hlavou se mi honí půvabná stehna [sycophant_scope.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], když těsně za sebou zaslechnu zakašlání [jealous_scope.GetTitledFirstName]."
 bp1_yearly.8100.desc: "\n\n„[jealous_scope.Custom2('RelationToMe', ROOT.Char)|U], už nějakou dobu jsem s tebou [Select_CString(jealous_scope.IsFemale,'chtěla','chtěl')] mluvit."
 bp1_yearly.8100.lover_known: "Tvá... náklonnost k [sycophant_scope.GetFirstNameNoTooltip] nezůstává bez povšimnutí a vyvolává... otázky ohledně tvých pohnutek.“\n\n"
 bp1_yearly.8100.lover_secret: "Já ani ostatní u dvora nechápeme, proč [sycophant_scope.GetFirstNameNoTooltip] zahrnuješ tolika poctami a povinnostmi. Některý z vážených šlechticů panství by ti jistě posloužil lépe.“\n\n"
 bp1_yearly.8100.lover: "Vím, že k [sycophant_scope.GetFirstNameNoTooltip] chováš... značnou náklonnost, ale místo v radě? Opravdu?“\n\n"
 bp1_yearly.8100.friend: "Chápu, že jste si velmi blízcí, ale někteří mají za to, že [sycophant_scope.GetFirstNameNoTooltip] upřednostňuješ před zasloužilejšími rádci.“\n\n"
 bp1_yearly.8100.faction: "„Řeknu to bez obalu: pokud se tyto křivdy nenapraví, jen [jealous_scope.GetFaith.HighGodName] ví, co čeká [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]...“"
 bp1_yearly.8100.hostile: "„Vždyť copak nevíš, jaký [sycophant_scope.Custom2('InsultAdjective', SCOPE.sC('jealous_scope'))] [sycophant_scope.Custom2('InsultNoun', SCOPE.sC('jealous_scope'))] [sycophant_scope.GetFirstNameNoTooltip] je?“"
 bp1_yearly.8100.lowborn: "„Nesluší se stavět názor neurozeného člověka nad nejvyšší šlechtu [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], ba ani na její úroveň.“"
 bp1_yearly.8100.rank: "„Názor [jealous_scope.GetTitleAsNameNoTooltip] by přece měl mít větší váhu než názor [Select_CString(sycophant_scope.IsFemale,'pouhé','pouhého')] [sycophant_scope.GetTitleAsNameNoTooltip]!“"
 bp1_yearly.8100.faith: "„Je skutečně moudré naslouchat někomu, kdo je [sycophant_scope.GetFaith.GetAdjective] [jealous_scope.Custom2('GetUnbelieverTerm', sycophant_scope)]?“"
 bp1_yearly.8100.culture: "„Copak by ti další hlas z [jealous_scope.GetCulture.GetName] kultury neposloužil lépe než tenhle cizinec z [sycophant_scope.GetCulture.GetName] kultury?“"
 bp1_yearly.8100.unskilled: "„A nehledě na tu urážku je [sycophant_scope.GetFirstNameNoTooltip] pro úřad [sycophant_scope.GetCouncilTitle] očividně naprosto [Select_CString(sycophant_scope.IsFemale,'nevhodná','nevhodný')].“"
 bp1_yearly.8100.skilled: "„Ať je [sycophant_scope.GetFirstNameNoTooltip] jako [sycophant_scope.GetCouncilTitle] sebeschopnější, tahle urážka je očividná.“"
 bp1_yearly.8100.jealous: "„Vezmi si třeba mě - jen jako příklad - [Select_CString(jealous_scope.IsFemale,'věrné','věrného')] [jealous_scope.GetTitleAsNameNoTooltip] z [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].“"
 bp1_yearly.8100.fallback: ""
 bp1_yearly.8100.a: "[ROOT.Char.GetTitleAsNameNoTooltip|U] si může svou radu vybrat [Select_CString(ROOT.Char.IsFemale,'sama','sám')]."
 bp1_yearly.8100.a.hostile: "Jak se opovažuješ pomlouvat [sycophant_scope.GetFirstNameNoTooltip]!"
 bp1_yearly.8100.a.flavor: "[jealous_scope.GetFirstNameNoTooltip] si může vypěstovat křivdu"
 bp1_yearly.8100.b: "Mám dojem, že chceš místo [sycophant_scope.GetFirstNameNoTooltip], [jealous_scope.GetFirstNameNoTooltip]."
 bp1_yearly.8100.b.flavor: "Snad to [sycophant_scope.GetFirstNameNoTooltip] pochopí"
 bp1_yearly.8100.fired_tt: "[sycophant_scope.GetShortUIName|U] bude na 5 let [Select_CString(sycophant_scope.IsFemale,'propuštěna','propuštěn')] z tvé [Concept('council','rady')|E]"
 bp1_yearly.8100.c: "Dobrá, [sycophant_scope.GetFirstNameNoTooltip] bude [Select_CString(sycophant_scope.IsFemale,'propuštěna','propuštěn')]."
 bp1_yearly.8100.c.flavor: "Ačkoli mě to bolí..."
 bp1_yearly.8100.d.flavor: "S [sycophant_scope.GetFirstNameNoTooltip] je přece ohromná zábava!"
 bp1_yearly.8100.d.success: "[sycophant_scope.GetTitledFirstNameNoTooltip] udělá dobrý dojem"
 bp1_yearly.8100.d.failure: "[jealous_vassal.GetTitledFirstNameNoTooltip] nemůže [sycophant_scope.GetFirstNameNoTooltip] vystát"
 bp1_yearly.8100.d.tt: "Tato možnost není dostupná, protože [jealous_scope.GetFirstNameNoTooltip] je ve vztahu k [sycophant_scope.GetFirstNameNoTooltip] [jealous_scope.Custom2('RelationToMe', sycophant_scope)|U]"
 bp1_yearly.8100.reveal_tt: "[jealous_scope.GetTitledFirstName] může odhalit tajemství [sycophant_secret.GetName], které sdílíš s [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8100.support: "[sycophant_scope.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', sycophant_scope)|U], je pro mě v radě skutečnou oporou a vždy stojí při mně, ale [jealous_scope.GetTitledFirstName] to očividně vidí jinak."
 bp1_yearly.8100.knowledgeable: "Přistihnu se, jak souhlasně přikyvuji. [sycophant_scope.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', sycophant_scope)|U], toho tolik ví a jsem [Select_CString(ROOT.Char.IsFemale,'ráda','rád')], že mám tak [Select_CString(sycophant_scope.IsFemale,'schopnou a důvěryhodnou rádkyni','schopného a důvěryhodného rádce')]. [jealous_scope.GetTitledFirstName] to očividně vidí jinak."
 bp1_yearly.8110.t: "Tajemství [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8110.desc: "Při klidné procházce před druhým spánkem mám stále před očima okouzlující pohled [sycophant_scope.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], když proti mně znenadání vykročí známá postava [revealer_scope.GetTitledFirstName].\n\n„Ach, [ROOT.Char.Custom('FormOfAddressForLiege')]... [Select_CString(revealer_scope.IsFemale,'Nechápala','Nechápal')] jsem, proč si [sycophant_scope.GetFirstNameNoTooltip] tak nesmírně vážíš - #EMP až doteď#!.“\n\n"
 bp1_yearly.8110.known_secret_homosexual: "„Uvolni ve svém nejužším kruhu místo zasloužilejšímu vazalovi, jinak budu [Select_CString(revealer_scope.IsFemale,'nucena','nucen')] odhalit váš nepřirozený vztah.“"
 bp1_yearly.8110.known_secret_adulterer: "„Odvolej [sycophant_scope.GetFirstNameNoTooltip] z rady, jinak se o tvém bezbožném cizoložství dozvědí všichni.“"
 bp1_yearly.8110.known_secret_other: "„Odvolej [Select_CString(sycophant_scope.IsFemale,'tu potížistku','toho potížistu')] z rady, jinak budu [Select_CString(revealer_scope.IsFemale,'nucena','nucen')] váš vztah odhalit.“"
 bp1_yearly.8110.c: "Dobrá..."
 bp1_yearly.8110.c.flavor: "...bude po tvém!"
 bp1_yearly.8110.d: "Za nic se nestydím."
 bp1_yearly.8110.e: "Jsi si [Select_CString(revealer_scope.IsFemale,'jistá','jistý')], že by si to [secondary_scope.GetFirstNameNoTooltip] [Select_CString(secondary_scope.IsFemale,'přála','přál')]?"
 every_powerful_vassal_tt: "Každý [Concept('powerful_vassal','mocný vazal')|E]"
 bp1_yearly.8120.t: "Půvab [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8120.desc: "Ach, [sycophant_scope.GetTitledFirstName] je tak... Vytrhnu se ze zasnění, když se přede mnou objeví [matchmaker_scope.GetTitledFirstName] a zavře za sebou dveře.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], přicházím za tebou důvěrně s jednou choulostivou záležitostí...“ [matchmaker_scope.GetFirstNameNoTooltip] zaváhá. „Nemyslíš, že [sycophant_scope.GetFirstNameNoTooltip] svěřuješ tolik povinností a poct proto, že se ti... #EMP líbí#!?“\n\n[matchmaker_scope.GetFirstNameNoTooltip] si nervózně upraví výstřih.\n\n„Možná by pro všechny bylo lepší, kdybys se #EMP o tohle#! [Select_CString(ROOT.Char.IsFemale,'postarala sama','postaral sám')] a úřady [Select_CString(ROOT.Char.IsFemale,'přenechala','přenechal')] šlechticům?“"
 bp1_yearly.8120.a: "Vypadni."
 bp1_yearly.8120.a.flavor: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych tě nechat zbičovat!"
 bp1_yearly.8120.b: "[sycophant_scope.GetFirstNameNoTooltip]? Ha, ani náhodou!"
 bp1_yearly.8120.seduce: "[Concept('scheme','Intrika')|E] bude mít vyšší [Concept('success_chance','šanci na úspěch')|E]"
 bp1_yearly.8120.b.flavor: "To je naprosto směšná představa!"
 bp1_yearly.8120.c: "Což- #EMP Ach...#! Možná máš pravdu..."
 bp1_yearly.8120.c.flavor: "Myslíš, že se [Select_CString(sycophant_scope.IsFemale,'jí','mu')] líbím také?"
 bp1_yearly.8120.d: "Ty #EMP jsi#! všímavý člověk, ale neustoupím."
 bp1_yearly.8120.d.flavor: "Co mě prozradilo?"
 bp1_yearly.8121.t: "Vůně [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8121.opening: "Od rozhovoru s [matchmaker_scope.GetTitledFirstName] mě pronásledují chlípné myšlenky, představy o mně a [sycophant_scope.GetTitledFirstName]...\n\n"
 bp1_yearly.8121.homosexual: "Vím, že [ROOT.Char.GetFaith.HighGodName] si nepřeje, aby spolu dvě [Select_CString(ROOT.Char.IsFemale,'ženy','muži')] takto... ach, [ROOT.Char.GetFaith.PositiveAfterLife]!"
 bp1_yearly.8121.adultery: "Zradit [ROOT.Char.GetConsort.GetTitledFirstName] by nebylo správné, ale [ROOT.Char.GetFaith.HighGodNameAlternate] mě přece nemůže nechat cítit tohle bez důvodu!"
 bp1_yearly.8121.other: "Co když [sycophant_scope.GetFirstNameNoTooltip] cítí totéž? Trápím se úplně zbytečně? Kéž mi [ROOT.Char.GetFaith.FertilityGodName] pomůže..."
 bp1_yearly.8121.desc: "\n\nCo mám dělat..."
 bp1_yearly.8121.a: "Musím následovat své srdce."
 bp1_yearly.8121.a.flavor: "Takovou příležitost nesmím promarnit"
 bp1_yearly.8121.b: "Tohle by mohlo skončit jedině špatně..."
 bp1_yearly.8121.b.friend: "[sycophant_scope.GetFirstNameNoTooltip] je jen [Select_CString(sycophant_scope.IsFemale,'přítelkyně','přítel')]! #EMP [Select_CString(sycophant_scope.IsFemale,'Přítelkyně','Přítel')]#!!"
 bp1_yearly.8121.b.flavor: "Zpátky k povinnostem..."
 bp1_yearly.8130.t: "Nepřátelé [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8130.desc: "[sycophant_scope.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], vtrhne do mých komnat, převrhne lampu a málem zapálí polštář.\n\n„[ROOT.Char.GetFirstNameNoTooltip]! Jsem si [Select_CString(sycophant_scope.IsFemale,'jistá','jistý')], že mě někdo sleduje!“ vykřikne a ukáže za sebe.\n\n„Před mými komnatami se potloukali nějací muži a někdo mi přemisťoval věci!“"
 bp1_yearly.8130.a: "Ale no tak, tohle se ti nepodobá."
 bp1_yearly.8130.a.paranoid: "Ale no tak, nejspíš to byl sluha."
 bp1_yearly.8130.a.flavor: "Není čeho se obávat"
 bp1_yearly.8130.b: "Nechám tě hlídat ve dne v noci."
 bp1_yearly.8130.c: "[spymaster_scope.GetFirstNameNoTooltip] tomu přijde na kloub."
 bp1_yearly.8130.c.flavor: "Pravda [spymaster_scope.GetFirstNameNoTooltip] neunikne"
 bp1_yearly.8130.c.success: "[spymaster_scope.GetCouncilTitleFirstNameNoTooltip] najde důkazy"
 bp1_yearly.8130.c.failure: "Žádné důkazy se nenajdou"
 bp1_yearly.8130.exposed: "[Concept('scheme','Intrika')|E] proti [sycophant_scope.GetShortUIName] bude odhalena"
 bp1_yearly.8130.progress: "[Concept('scheme','Intrika')|E] proti [sycophant_scope.GetShortUIName] pokročí"
 bp1_yearly.8130.d: "[spymaster_scope.GetFirstNameNoTooltip], prošetři to."
 bp1_yearly.8130.d.flavor: "Zrovna ty máš co dělat starosti..."
 bp1_yearly.8130.d.success: "[spymaster_scope.GetFirstNameNoTooltip] najde důkazy"
 bp1_yearly.8130.d.failure: "[spymaster_scope.GetFirstNameNoTooltip] zmizí"
 bp1_yearly.8130.e: "Nikdo nebude vyhrožovat #EMP [sycophant_scope.GetFirstNameNoTooltip]#!!"
 bp1_yearly.8130.e.flavor: ""
 bp1_yearly.8130.e.success: "Odhalíš spiknutí"
 bp1_yearly.8130.e.failure: "Nic nenajdeš"
 bp1_yearly.8131.t.sycophant: "Lstivost [spymaster_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8131.t: "Zadostiučinění [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8131.desc.sycophant: "Překvapí mě, když jsem [Select_CString(ROOT.Char.IsFemale,'povolána','povolán')] do žaláře, a ještě víc, když zjistím, že mě tam [Select_CString(sycophant_scope.IsFemale,'nechala','nechal')] zavolat [sycophant_scope.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', sycophant_scope)].\n\nV jedné z cel najdu [sycophant_scope.GetFirstNameNoTooltip], očividně [Select_CString(sycophant_scope.IsFemale,'uklidněnou','uklidněného')], a vedle [Select_CString(sycophant_scope.IsFemale,'ní','něj')] [Select_CString(murderous_scope.IsFemale,'mnohem méně spokojenou','mnohem méně spokojeného')] [murderous_scope.GetTitledFirstName] v poutech.\n\nZalapám po dechu. „[sycophant_scope.GetFirstNameNoTooltip]! Co jsi-“ [sycophant_scope.GetFirstNameNoTooltip] mě však přeruší: „[murderous_scope.GetTitledFirstName] se mě [Select_CString(murderous_scope.IsFemale,'pokusila','pokusil')] nechat zabít - a mám přiznání [Select_CString(murderous_scope.IsFemale,'jejího','jeho')] najatého hrdlořeza, které to dokazuje!“"
 bp1_yearly.8131.desc.spymaster: "Když odpočívám po boku [sycophant_scope.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], dorazí nám zpráva od [spymaster_scope.GetTitledFirstName] s pokynem, abychom se oba dostavili do žaláře.\n\nTam, v zatuchlém podzemí [ROOT.GetCharacter.Custom('FortifiedBuilding')], najdeme [spymaster_scope.GetFirstNameNoTooltip] a po [Select_CString(spymaster_scope.IsFemale,'jejím','jeho')] boku [Select_CString(murderous_scope.IsFemale,'zbědovanou','zbědovaného')] [murderous_scope.GetTitledFirstName] v řetězech.\n\n„Tady vidíš, kdo za tím stojí, [ROOT.Char.Custom('FormOfAddressForLiege')],“ pronese [spymaster_scope.GetFirstNameNoTooltip] vítězoslavně. „Není o tom pochyb.“"
 bp1_yearly.8131.desc: "Napjatě čekám, zatímco stráže vlečou do mého žaláře postavu s kápí přes hlavu a rukama v poutech. Ozývá se jen hlasité sténání.\n\n„Pojď, [sycophant_scope.GetFirstName], zjistíme, kdo stojí za pokusem tě zavraždit!“\n\nŽalářník jediným okázalým pohybem strhne kápi a já zalapám po dechu. Je to [murderous_scope.GetTitledFirstName]!\n\nSe [sycophant_scope.GetFirstNameNoTooltip] zavrčíme jednohlasně: „#EMP Ty!#!“"
 bp1_yearly.8131.tt: "Bude odhaleno zapojení [murderous_scope.GetTitledFirstName] do [Concept('scheme','intriky')|E], jejímž cílem bylo [sycophant_scheme.GetSchemeType.GetTypeNameNoTooltip] [sycophant_scope.GetFirstName]"
 bp1_yearly.8131.a: "Vypadá to, že máš co vysvětlovat, [murderous_scope.GetFirstNameNoTooltip]."
 bp1_yearly.8131.a.flavor: "Skrz #EMP mříže#! své cely!"
 bp1_yearly.8131.b: "[murderous_scope.GetFirstNameNoTooltip] už se [Select_CString(murderous_scope.IsFemale,'poučila','poučil')]."
 bp1_yearly.8131.b.flavor: "Koneckonců to není #EMP zrada#!"
 bp1_yearly.8131.c: "Kdo další v tom jede?"
 bp1_yearly.8131.c.flavor: "Podej mi palici!"
 bp1_yearly.8131.torture: "Budeš [murderous_scope.GetShortUIName] [Concept('torture','mučit')|E]"
 bp1_yearly.8131.agent: "Může být odhalen další [Concept('agent','spolčenec')|E] zapojený do [Concept('scheme','intriky')|E]"
 bp1_yearly.8131.attempted: "[agent_scope.GetTitledFirstNameNoTooltip] [Select_CString(agent_scope.IsFemale,'byla do spiknutí zapojena','byl do spiknutí zapojen')]!"
 released_attempted_murderer_opinion: "Propustil člověka, který se pokusil o vraždu"
 bp1_yearly.8132.t: "Strach [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8132.desc.sycophant: "[sycophant_scope.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], se ke mně vrací ještě zoufalejší než předtím.\n\nZdá se, že [sycophant_scope.GetFirstNameNoTooltip] [Select_CString(sycophant_scope.IsFemale,'vyčerpala','vyčerpal')] všechny možnosti, které [Select_CString(sycophant_scope.IsFemale,'měla','měl')] k dispozici, aniž by se byť jen [Select_CString(sycophant_scope.IsFemale,'přiblížila','přiblížil')] k důkazu o nějakém spiknutí.\n\n„Co mám dělat, [ROOT.Char.GetFirstNameNoTooltip]?“ povzdechne si. „Jsem [Select_CString(sycophant_scope.IsFemale,'vydána','vydán')] na milost svým nepřátelům!“"
 bp1_yearly.8132.desc.spymaster: "[Select_CString(spymaster_scope.IsFemale,'Má špehmistryně','Můj špehmistr')] [spymaster_scope.GetTitledFirstName] nakonec [Select_CString(spymaster_scope.IsFemale,'přiznala','přiznal')], že nedokáže najít žádný důkaz o spiknutí proti [sycophant_scope.GetFirstName], [ROOT.Char.Custom2('RelationToMe', sycophant_scope)].\n\nDokonce [Select_CString(spymaster_scope.IsFemale,'zašla','zašel')] tak daleko, že [Select_CString(spymaster_scope.IsFemale,'naznačila','naznačil')], že celý ten příběh je jen výplodem fantazie [sycophant_scope.GetFirstNameNoTooltip]..."
 bp1_yearly.8132.desc: "Obavy [sycophant_scope.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], důkladně prověřuji. Nechávám hlídat [Select_CString(sycophant_scope.IsFemale,'její','jeho')] komnaty a vyptávám se služebnictva po celém [ROOT.GetCharacter.Custom('FortifiedBuilding')], ale bez výsledku.\n\n„Možná to byl jen sluha, který uklízel?“ nadhodím nepřesvědčivě.\n\n[sycophant_scope.GetFirstNameNoTooltip] přechází po místnosti sem a tam a očividně [Select_CString(sycophant_scope.IsFemale,'přesvědčená není','přesvědčený není')]."
 bp1_yearly.8132.a: "Pro jistotu tě nechám hlídat."
 bp1_yearly.8132.a.flavor: "Opatrnosti není nikdy dost"
 bp1_yearly.8132.b: "A co když to byl jen neškodný žert?"
 bp1_yearly.8132.b.flavor: "Tohle je ztráta času"
 bp1_yearly.8134.t: "Zmizení [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8134.desc: "Už je to příliš dlouho, co jsem naposledy [Select_CString(ROOT.Char.IsFemale,'slyšela','slyšel')] o [sycophant_scope.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], a začínám se obávat nejhoršího.\n\nJestli [Select_CString(sycophant_scope.IsFemale,'jí','mu')] skutečně někdo usiloval o život... ó [ROOT.Char.GetFaith.HighGodName]..."
 bp1_yearly.8134.a: "Kde jsi, [sycophant_scope.GetFirstNameNoTooltip]?"
 bp1_yearly.8134.a.flavor: "Co jsem to [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')]..."
 bp1_yearly.8140.t: "Pomsta [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8140.desc: "Prohlížím si svou sbírku kvalitního [ROOT.Char.Custom('RegionalAlcoholicDrink')|U], když zaslechnu známý hlas [sycophant_scope.GetFirstName], [ROOT.Char.Custom2('RelationToMe', sycophant_scope)].\n\nUkrytý mezi sudy [sycophant_scope.GetFirstNameNoTooltip] právě zasypává [jealous_scope.GetTitledFirstName] kletbami a nadávkami před jakýmsi sluhou.\n\nUž se chystám ztratit zájem, když zaslechnu slova, při nichž mi ztuhne krev v žilách: „Zabij [jealous_scope.GetTitledFirstName]!“"
 bp1_yearly.8140.a: "[sycophant_scope.GetFirstNameNoTooltip]! [Select_CString(ROOT.Char.IsFemale,'Slyšela','Slyšel')] jsem každé slovo!"
 bp1_yearly.8140.a.flavor: "Styď se!"
 bp1_yearly.8140.b: "Ano! [jealous_scope.GetFirstNameNoTooltip] #EMP zemře#!!"
 bp1_yearly.8140.b.flavor: "Konečně nějaká zábava!"
 bp1_yearly.8140.c: "#EMP Potichu se vytratím#!"
 bp1_yearly.8140.c.flavor: "#EMP Nic#! jsem [Select_CString(ROOT.Char.IsFemale,'neslyšela','neslyšel')]!"
 bp1_yearly.8160.t: "Kouzlo [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8160.desc: "S [sycophant_scope.GetFirstName], [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], se procházíme mými zahradami a hlasitě se smějeme říkance, kterou [sycophant_scope.GetFirstNameNoTooltip] [Select_CString(sycophant_scope.IsFemale,'zaslechla','zaslechl')] od jednoho ze sluhů, když nám cestu zkříží [jealous_scope.GetTitledFirstName].\n\n[jealous_scope.GetFirstNameNoTooltip] se na nás přísně zadívá. „[ROOT.Char.Custom('FormOfAddressForLiege')|U], [Select_CString(jealous_scope.IsFemale,'chtěla','chtěl')] bych s tebou něco probrat, jestli máš chvilku?“"
 bp1_yearly.8160.a: "Dobrá, o co jde?"
 bp1_yearly.8160.a.flavor: "Doufám, že to bude stát za to!"
 bp1_yearly.8160.b: "Přidej se k nám, tohle musíš slyšet!"
 bp1_yearly.8160.b.flavor: "Co by se #EMP asi tak#! mohlo pokazit?"
 bp1_yearly.8160.b.success: "[sycophant_scope.GetFirstNameNoTooltip] si [jealous_scope.GetFirstNameNoTooltip] získá"
 bp1_yearly.8160.b.failure: "Pro [jealous_scope.GetFirstNameNoTooltip] je to poslední kapka"
 bp1_yearly.8160.d: "Teď ne, [jealous_scope.GetFirstNameNoTooltip]!"
 bp1_yearly.8160.d.flavor: "Copak nevidíš, že mám #EMP práci#!?"
 bp1_yearly.8161.t: "Čáry [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8161.opening: "Když mezi ptačím zpěvem doznějí poslední zvuky vyprávění [sycophant_scope.GetTitledFirstName], výraz na tváři [jealous_scope.GetTitledFirstName] zůstává stále stejně vážný.\n\n"
 bp1_yearly.8161.desc: "Pak se v koutcích úst [jealous_scope.GetFirstNameNoTooltip] pomalu objeví náznak úsměvu. Ten se rozšíří v široký škleb a nakonec propukne v hlasitý smích!\n\n„To- #EMP *lapá po dechu*#! To je nejvtipněj- #EMP *lapá po dechu*#! Ach! Úplně jsem se v tobě [Select_CString(jealous_scope.IsFemale,'spletla','spletl')], [sycophant_scope.GetFirstNameNoTooltip]! Pojďme se najíst!“"
 bp1_yearly.8161.a: "#EMP *šťouchne loktem do žeber*#! [ROOT.Char.Custom('GetLaughType')]"
 bp1_yearly.8161.a.flavor: "Málem jsi mě [Select_CString(sycophant_scope.IsFemale,'dostala','dostal')]!"
 bp1_yearly.8162.t: "Přešlap [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8162.desc: "Mám hrozný pocit, že ten vtip vůbec nezabral.\n\nMé obavy se potvrdí o chvíli později, když [jealous_scope.GetFirstNameNoTooltip] zdrceně povzdechne, protočí oči a odejde.\n\n[sycophant_scope.GetFirstName] pokrčí rameny. „Ale no tak, takový prudérní patron...“"
 bp1_yearly.8162.a: "Proč zrovna #EMP tenhle#!, [sycophant_scope.GetFirstNameNoTooltip]..."
 bp1_yearly.8162.a.flavor: "Raději zůstaň u materiálu od služebnictva, ano?"
 bp1_yearly.8170.t: "[Select_CString(sycophant_scope.IsFemale,'Přítelkyně','Přítel')] [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8170.desc: "S [sycophant_scope.GetFirstName], [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], se vídám čím dál méně. Zdá se, že místo toho tráví spoustu času s [friendly_scope.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', friendly_scope)]...\n\nNarazím na ně, jak se smějí nějakému žertu, plácají se do stehen a při pohledu na mě se pochechtávají.\n\nCo si o tom mám myslet..."
 bp1_yearly.8170.a: "Tohle je pod mou úroveň."
 bp1_yearly.8170.a.flavor: "Nebudu už s [sycophant_scope.GetFirstNameNoTooltip] ztrácet čas"
 bp1_yearly.8170.b: "Ach, [sycophant_scope.GetFirstNameNoTooltip], můžeme si promluvit?"
 bp1_yearly.8170.b.flavor: "Vím, co má [sycophant_scope.GetFirstNameNoTooltip] [Select_CString(sycophant_scope.IsFemale,'ráda','rád')]"
 bp1_yearly.8170.b.success: "[sycophant_scope.GetFirstNameNoTooltip] jde s tebou"
 bp1_yearly.8170.b.failure: "[sycophant_scope.GetFirstNameNoTooltip] zůstane s [friendly_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8170.c: "Už tě nepotřebuji, [sycophant_scope.GetFirstNameNoTooltip]."
 bp1_yearly.8170.c.flavor: "Tak se směj #EMP tomu#!!"
 bp1_yearly.8180.t: "Ultimátum [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8180.desc: "[sycophant_scope.GetFirstName], [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [Select_CString(sycophant_scope.IsFemale,'požádala','požádal')] o soukromou audienci. Tak neobvyklá formálnost nemůže věstit nic dobrého.\n\n„[ROOT.Char.GetFirstNameNoTooltip]! [ROOT.Char.GetTitleAsNameNoTooltip]... Už to dál nevydržím! Odsouváš mě stranou a podléháš své ‚povinnosti‘, i když dobře víš, že jsem [Select_CString(sycophant_scope.IsFemale,'byla naprosto schopnou rádkyní','byl naprosto schopným rádcem')]!“\n\n„Jestli se mnou má být zacházeno takhle, budu se muset poohlédnout po nových možnostech. [Select_CString(sycophant_scope.IsFemale,'Slyšela','Slyšel')] jsem, že [new_realm.GetHolder.GetName] umí věrné poddané náležitě odměnit...“"
 bp1_yearly.8180.a: "Víš, že tě nemohu ztratit, [sycophant_scope.GetFirstNameNoTooltip]."
 bp1_yearly.8180.a.flavor: "A víš to až příliš dobře..."
 bp1_yearly.8180.b: "Ale no tak, víš přece, že to není tak jednoduché!"
 bp1_yearly.8180.b.flavor: "Ve hře je mnoho okolností..."
 bp1_yearly.8180.b.success: "[sycophant_scope.GetFirstNameNoTooltip] zůstane"
 bp1_yearly.8180.b.failure: "[sycophant_scope.GetFirstNameNoTooltip] odejde"
 bp1_yearly.8180.c: "Tak běž, když si to myslíš!"
 bp1_yearly.8180.c.flavor: "Ven!"
 bp1_yearly.8180.d: "Vyhrožuješ zradou!"
 bp1_yearly.8180.d.flavor: "Když tě nemohu mít já..."
 bp1_yearly.8190.t: "Nadání [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8190.opening: "Když přecházím nádvoří, potěší mě, že konečně slyším někoho oceňovat [sycophant_scope.GetFirstName], [ROOT.Char.Custom2('RelationToMe', sycophant_scope)].\n\n„Ale neposlouchej ty závistivé řeči,“ hlaholí [friendly_scope.GetTitledFirstName], „už dlouho tu nikdo nezastával úřad [sycophant_scope.GetCouncilTitle] tak dobře jako ty - alespoň pokud #EMP já#! vím!“\n\n"
 bp1_yearly.8190.twitch: "Na okamžik bych [Select_CString(ROOT.Char.IsFemale,'přísahala','přísahal')], že jsem ve stínu stájí na druhé straně nádvoří [Select_CString(ROOT.Char.IsFemale,'zahlédla','zahlédl')] [jealous_scope.GetTitledFirstName], jak [Select_CString(jealous_scope.IsFemale,'jí','mu')] cuká oko, než znovu zmizí ve tmě."
 bp1_yearly.8190.desc: "[Select_CString(ROOT.Char.IsFemale,'Věděla','Věděl')] jsem, že to, co jsem v [sycophant_scope.GetFirstNameNoTooltip] [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')], bylo skutečné!"
 bp1_yearly.8190.a: "Konečně někdo, kdo se vyzná v lidech!"
 bp1_yearly.8190.a.flavor: "Spolek obdivovatelů [sycophant_scope.GetFirstNameNoTooltip] se rozrůstá"
 bp1_yearly.8190.b: "Co takhle vyrazit večer ven, jen my tři?"
 bp1_yearly.8190.b.flavor: "Přátele si drž nablízku"
 bp1_yearly.8191.t: "Odměna pro [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8191.opening: "Další nekonečné zasedání rady se vleče dál, dokud mou pozornost náhle neupoutá líbezný hlas [sycophant_scope.GetFirstName], [ROOT.Char.Custom2('RelationToMe', sycophant_scope)].\n\n„Naléhavá záležitost, [ROOT.Char.Custom('FormOfAddressForLiege')], "
 bp1_yearly.8191.taken: "[ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] naléhavě potřebuje někoho schopného do úřadu [sycophant_scope.Custom('GetTargetCourtPosition')]; někoho, kdo se řádně postará o [sycophant_scope.Custom('GetTargetCourtPositionDesc')]... což [old_holder.GetTitledFirstName] #EMP rozhodně#! nezvládá.“"
 bp1_yearly.8191.open: "[ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] naléhavě potřebuje někoho do úřadu [sycophant_scope.Custom('GetTargetCourtPosition')]; někoho, kdo se postará o [sycophant_scope.Custom('GetTargetCourtPositionDesc')]...“"
 bp1_yearly.8191.arrogant: "\n\n[sycophant_scope.GetFirstNameNoTooltip] velkolepě ukáže [Select_CString(sycophant_scope.IsFemale,'sama na sebe','sám na sebe')]. „Nech to na mně, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]. Taková práce vyžaduje jistý cit.“"
 bp1_yearly.8191.other: "\n\n[sycophant_scope.GetFirstNameNoTooltip] si položí ruku na srdce. „Samozřejmě, #EMP já#! bych se tohoto důležitého břemene [Select_CString(sycophant_scope.IsFemale,'ujala','ujal')], [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')].“"
 bp1_yearly.8191.desc: "\n\n[annoyed_scope.GetTitledFirstName] očividně vře vzteky."
 bp1_yearly.8191.a: "Výborný nápad, [sycophant_scope.GetFirstNameNoTooltip]!"
 bp1_yearly.8191.a.flavor: "Ještě že mám [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8191.b: "Ano, je načase, aby [old_holder.GetFirstNameNoTooltip] [Select_CString(old_holder.IsFemale,'uvolnila','uvolnil')] místo!"
 bp1_yearly.8191.b.flavor: "[sycophant_scope.GetFirstNameNoTooltip] ukáže [old_holder.GetFirstNameNoTooltip], jak se to dělá!"
 bp1_yearly.8191.c: "Co kdybys místo toho [Select_CString(sycophant_scope.IsFemale,'přijala','přijal')] některý z volných úřadů?"
 bp1_yearly.8191.c.flavor: "Nadání [sycophant_scope.GetFirstNameNoTooltip] nezná mezí"
 bp1_yearly.8191.d: "Myslím, že tahle práce je pro [annoyed_scope.GetFirstNameNoTooltip]."
 bp1_yearly.8191.d.flavor: "[sycophant_scope.GetFirstNameNoTooltip] přece nemůže dostat #EMP všechno#!"
 bp1_yearly.8191.e: "#EMP Musí#! být něco naléhavějšího, čím bychom se měli zabývat."
 bp1_yearly.8191.e.flavor: "[sycophant_scope.GetFirstNameNoTooltip] se přes to přenese"
 bp1_yearly.8192.t: "Chyby [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8192.desc: "Odpočívám na pohovce a přemýšlím, jak odměnit [sycophant_scope.GetFirstName], [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], za skvělou práci posledních dní, když náhle cvakne klika a ve dveřích se objeví [insulting_scope.GetTitledFirstName].\n\n„Odpusť mi mou otevřenost, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')], ale tohle už zašlo příliš daleko — [sycophant_scope.GetFirstNameNoTooltip] přece nemůže mít všechno!“\n\n„[Select_CString(sycophant_scope.IsFemale,'Ta hlupačka','Ten hlupák')] se na úřad [sycophant_scope.GetCouncilTitle] vůbec nehodí. Každým dnem, kdy ho zastává, se poměry budou jen zhoršovat, až nakonec přivede [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] do záhuby!“"
 bp1_yearly.8192.a: "[Select_CString(ROOT.Char.IsFemale,'Netušila','Netušil')] jsem, že je to až tak zlé..."
 bp1_yearly.8192.a.flavor: "Je načase, aby [sycophant_scope.GetFirstNameNoTooltip] [Select_CString(sycophant_scope.IsFemale,'skončila','skončil')]"
 bp1_yearly.8192.b: "V mé radě není místo pro malichernou žárlivost."
 bp1_yearly.8192.b.flavor: "Závistivci budou závidět vždy"
 bp1_yearly.8192.fired_tt: "[insulting_scope.GetShortUIName|U] bude na 5 let [Select_CString(insulting_scope.IsFemale,'propuštěna','propuštěn')] z tvé [Concept('council','rady')|E]"
 bp1_yearly.8192.c: "#EMP *povzdech*#! Copak nevidíš, že mám #EMP práci#!, [insulting_scope.GetFirstNameNoTooltip]?"
 bp1_yearly.8192.c.flavor: "Nadání, které má [sycophant_scope.GetFirstNameNoTooltip], nezná mezí"
 disgruntled_vassals_modifier: "Nespokojení vazalové"
