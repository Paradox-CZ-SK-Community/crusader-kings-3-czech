l_polish:
 bp1_yearly.5001.t: "Noční děsy"
 bp1_yearly.5001.desc: "Proč jsem se probudil? Rozespalá mysl se ztěžka snaží zjistit, co mě vytrhlo ze spánku. Noc je chladná, ale nemrzne, postel je teplá a pohodlná a-\n\nU nohou mé postele stojí silueta. Jak se přibližuje, nabývá podoby [sibling_murderer.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', sibling_murderer)]. Otevřu ústa, abych [sibling_murderer.GetFirstNameNoTooltip] připomněl, že [Select_CString(sibling_murderer.IsFemale,'její','jeho')] komnata je hned vedle té mé, když si všimnu polštáře v [Select_CString(sibling_murderer.IsFemale,'jejích','jeho')] rukou.\n\nJen díky bledému měsíčnímu světlu vidím v očích [sibling_murderer.GetFirstNameNoTooltip] divoký, šílený a vražedný lesk."
 bp1_yearly.5001.a: "Za tuhle zradu tě #bold zabiju#!!"
 bp1_yearly.5001.b: "Ne! Nedovolím ti to!"
 bp1_yearly.5001.c: "POMOC!"
 bp1_yearly.5001.win.tt: "Střet pro tebe dopadne dobře"
 bp1_yearly.5001.lose.tt: "Střet pro tebe nedopadne dobře"
 bp1_yearly.5001.shout.tt: "Voláš o pomoc a doufáš, že tě někdo uslyší"
 bp1_yearly.5001.kill.tt: "[sibling_murderer.GetFirstNameNoTooltip] ti bude vydán[Select_CString(sibling_murderer.IsFemale,'a','')] na milost"
 bp1_yearly.5001.die.tt: "V zápase prohraješ"
 bp1_yearly.5002.t: "$bp1_yearly.5001.t$: Zmařené ambice"
 bp1_yearly.5002.desc: "Jakmile [sibling_murderer.GetFirstName] spatří můj pohyb, vrhne se na mě, ale náhlý příval adrenalinu mi dodá sílu. Ještě v půli postele [sibling_murderer.GetFirstNameNoTooltip] zastaví má pěst, která [Select_CString(sibling_murderer.IsFemale,'ji','ho')] zasáhne přímo do čelisti.\n\n[sibling_murderer.GetFirstNameNoTooltip] bezvládně zavrávorá a ani zmatená sprška dalších ran mě nezastaví, když [Select_CString(sibling_murderer.IsFemale,'ji','ho')] strhnu k zemi. Pevně [Select_CString(sibling_murderer.IsFemale,'jí','mu')] sedím na hrudi a tvrdým úderem rozdrtím nos. Hlava [sibling_murderer.GetFirstNameNoTooltip] udeří o kamennou podlahu a všechen dosavadní odpor se změní v žalostné kňučení.\n\nPrávě tak nás najde [guard.GetFirstName] - naštěstí dost [Select_CString(guard.IsFemale,'pohotová','pohotový')], aby rychle pochopil[Select_CString(guard.IsFemale,'a','')], co se děje. Zatímco vysvětluji, co se stalo, [sibling_murderer.GetFirstNameNoTooltip] trucovitě hledí do země."
 bp1_yearly.5002.a: "Vlastní [ROOT.Char.Custom2('RelationToMeShort', sibling_murderer)]... Jak #EMP jsi mohl[Select_CString(sibling_murderer.IsFemale,'a','')]#!?"
 bp1_yearly.5003.t: "$bp1_yearly.5001.t$: Remus"
 bp1_yearly.5003.desc: "Ležím napůl [Select_CString(ROOT.Char.IsFemale,'svlečená','svlečený')], [Select_CString(ROOT.Char.IsFemale,'sama','sám')] a zcela bezbrann[Select_CString(ROOT.Char.IsFemale,'á','ý')]. Než vůbec stačím pochopit ten šok a zradu, [sibling_murderer.GetFirstNameNoTooltip] je nade mnou. Jednu mou paži sevře pod nohou, volnou rukou mi přitiskne polštář na tvář a druhou zachytí mé zmítající se zápěstí o sloupek postele.\n\nMezi odporným škubnutím, kterým mi [sibling_murderer.GetFirstNameNoTooltip] zlomí ruku, a oslnivou bolestí vystřelující až do ramene jako by uplynuly celé hodiny. Zápěstí mi bezvládně klesne, roztříštěná paže se zoufale snaží zvednout, zatímco ruka [sibling_murderer.GetFirstNameNoTooltip] sklouzne k mému hrdlu.\n\n„Trůn je #EMP můj!#!“ zasyčí [sibling_murderer.GetFirstNameNoTooltip] a pomalu se mi ztrácí před očima."
 bp1_yearly.5003.a: "[sibling_murderer.GetFirstNameNoTooltip]! #DIE1 N-ne...#! #DIE2 [ROOT.Char.Custom2('RelationToMeShort', sibling_murderer)]...#!"
 bp1_yearly.5004.t: "$bp1_yearly.5001.t$: Pravá ruka"
 bp1_yearly.5004.desc: "[sibling_murderer.GetFirstName] vyrazí vpřed a vzdálenost k čelu mé postele překoná mrknutím oka, ale už je pozdě. Výkřik o pomoc mi vyrazil z hrdla ještě dřív, než se [sibling_murderer.GetFirstNameNoTooltip] vůbec pohnul[Select_CString(sibling_murderer.IsFemale,'a','')], a přestože jej polštář vzápětí zadusí, už slyším hřmění rychle se blížících kroků."
 bp1_yearly.5004.guard.death: "\n\nDveře se s rachotem rozletí dokořán a v nich, díky bohům, stojí [guard.GetFirstName]. [guard.GetFirstNameNoTooltip] zalapá po dechu a otočí se, aby zavolal[Select_CString(guard.IsFemale,'a','')] o pomoc, ale umlčí [Select_CString(guard.IsFemale,'ji','ho')] syknutí mého [sibling_murderer.Custom2('RelationToMeShort', ROOT.Char)], které vysloví [Select_CString(guard.IsFemale,'její','jeho')] jméno. S narůstající hrůzou mohu jen poslouchat, jak si [sibling_murderer.GetFirstNameNoTooltip] rychle vykupuje mlčení a věrnost [guard.GetFirstNameNoTooltip].\n\nHruď mi zaplaví mohutná vlna paniky, když se kroky znovu dají do pohybu a vše zakončí poslední, děsivé #EMP cvaknutí#! dveřní západky."
 bp1_yearly.5004.guard.save: "\n\nDveře se s rachotem rozletí dokořán a v nich, díky bohům, stojí [guard.GetFirstName]. [guard.GetFirstNameNoTooltip] zalapá po dechu a přes rameno vykřikne do otevřených dveří. O pár okamžiků později vtrhnou dovnitř dva strážní, strhnou [sibling_murderer.GetFirstNameNoTooltip] z nohou a odtáhnou [Select_CString(sibling_murderer.IsFemale,'ji','ho')] ode mě.\n\n[sibling_murderer.GetFirstNameNoTooltip] jen zachmuřeně hledí do podlahy a ani se nepokusí své jednání popřít."
 bp1_yearly.5004.parent.save: "\n\nDveře se s rachotem rozletí dokořán a v nich stojí [sibling_parent.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', sibling_parent)]. Stačí jediný okamžik, aby [sibling_parent.GetFirstNameNoTooltip] pochopil[Select_CString(sibling_parent.IsFemale,'a','')], co se děje. S řevem volá o pomoc a zároveň strhne [sibling_murderer.GetFirstNameNoTooltip] ze mě na zem.\n\n[sibling_parent.GetFirstNameNoTooltip] mi vezme hlavu do náruče, zatímco [sibling_murderer.GetFirstNameNoTooltip] prchá ke dveřím. Tam však narazí na [guard.GetFirstName], který [Select_CString(sibling_murderer.IsFemale,'ji','ho')] popadne a hodí zpátky do místnosti."
 bp1_yearly.5004.parent.death: "\n\nDveře se s rachotem rozletí dokořán a v nich stojí [sibling_parent.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', sibling_parent)]. Prvotní úleva se však pomalu mění v mrazivou hrůzu, když spatřím úsměv na rtech [sibling_parent.GetFirstNameNoTooltip] a přimhouřené oči plné zloby. Zvedá se mi z toho žaludek.\n\n[sibling_parent.GetFirstNameNoTooltip] se otočí a bez jediné známky starosti odkráčí do chodby. Za sebou pomalu přitáhne dveře.\n\n#EMP „Cvak.“#!"
 bp1_yearly.5005.t: "Noční děsy: Touha po moci"
 bp1_yearly.5006.t: "$bp1_yearly.5001.t$: Rodičovská láska"
 bp1_yearly.5006.a: "[ROOT.Char.Custom2('RelationToMeShort', sibling_parent)|U] mi [Select_CString(sibling_parent.IsFemale,'zachránila','zachránil')] život!"
 bp1_yearly.5007.t: "$bp1_yearly.5001.t$: Vražedné rodičovské sklony"
 bp1_yearly.5007.a: "#DIE1 Vždyť [ROOT.Char.Custom2('RelationToMeShort', sibling_parent)|U] má své dítě chránit!#! #DIE2 ...prosím!#!"
 bp1_yearly.5008.t: "$bp1_yearly.5001.t$: Romulus"
 bp1_yearly.5008.desc: "[sibling_murderer.GetFirstName] je [Select_CString(sibling_murderer.IsFemale,'rychlá','rychlý')], ale okamžitě je jasné, že mě osudově [Select_CString(sibling_murderer.IsFemale,'podcenila','podcenil')]. Vrhnout se přes místnost je snadné, jenže já už jsem na nohou a v pohybu. Vlastní prudkost [sibling_murderer.GetFirstNameNoTooltip] zradí - zakopne o nerovnou dlaždici a rozplácne se na podlaze.\n\nStačí mi jediný krok. Chodidlem zasáhnu [sibling_murderer.GetFirstNameNoTooltip] právě ve chvíli, kdy se snaží zvednout na kolena, a hlava s odporným křupnutím narazí do zdi. Následující slepý úder mého [ROOT.Char.Custom2('RelationToMeShort', sibling_murderer)] mine cíl a já využiji příležitosti sáhnout ke stolku vedle postele.\n\n[sibling_murderer.GetFirstNameNoTooltip] se prudce otočí a u hrdla spatří malý, ale ďábelsky ostrý nůž. Poprvé v očích [sibling_murderer.GetFirstNameNoTooltip] vidím opravdový strach."
 bp1_yearly.5008.a: "Tvé tělo nikdy nenajdou, [sibling_murderer.GetFirstNameNoTooltip]."
 bp1_yearly.5008.b: "Už se mi nikdy nestav do cesty. Rozumíš?"
 bp1_yearly.5601.t: "Život v barvách"
 bp1_yearly.5601.start: "To je ale nádherný den! Vítr příjemně osvěžuje, slunce hřeje a v podrostu vesele cvrliká hmyz. Všechno je najednou jasnější, živější - a jen proto, že [bp1_yearly_5601_dead_nemesis.GetFirstName], [bp1_yearly_5601_dead_nemesis.Custom2('InsultAdjective', ROOT.Char)] [bp1_yearly_5601_dead_nemesis.Custom2('InsultNoun', ROOT.Char)], je konečně a požehnaně po smrti!\n\nNedokážu potlačit široký úsměv, když kolem mě prochází zástup přátel a příbuzných [bp1_yearly_5601_dead_nemesis.GetFirstNameNoTooltip], aby se naposledy rozloučili."
 bp1_yearly.5601.bodysnatcher: "Ačkoli už [bp1_yearly_5601_dead_nemesis.GetFirstNameNoTooltip] nemůže nic namítat, přece jen mě popudí drzost rodiny, která se mlčky snaží hájit [Select_CString(bp1_yearly_5601_dead_nemesis.IsFemale,'její','jeho')] čest.\n\nPrůvod mě mine a pokračuje dál, aby tělo pohřbil."
 bp1_yearly.5601.notinsane: "Zamračené pohledy pozůstalých můj úsměv jen rozšíří. Otočím se k odchodu a oči mladého žebráka se rozzáří stejně jako má tvář, když mu vesele hodím minci tak cennou, že z ní bude celá jeho rodina dobře jíst celé týdny."
 bp1_yearly.5601.a: "Já jim ukážu!"
 bp1_yearly.5601.a.tt: "Počkáš do setmění a pak vyrazíš s lopatou..."
 bp1_yearly.5601.b: "Tohle je nejlepší den mého života!"
 bp1_yearly.5601.c: "Je načase jít dál."
 bp1_yearly.5602.t: "Hlava vzhůru"
 bp1_yearly.5602.desc: "Noční vzduch je nehybný a tichý. Jediným zvukem je škrábání mé lopaty, která se snadno zakusuje do čerstvě navršené hlíny. Hromada vedle hrobu pomalu roste, dokud se tělo [bp1_yearly_5601_dead_nemesis.GetFirstName] znovu neocitne na čerstvém vzduchu, o který přišlo teprve nedávno.\n\nStrhnu látku zakrývající tvář. Rty jsou pootevřené a stažené do strnulého šklebu, na krku stále ulpívá vlhká hlína a špína. Mrtvolu si bez jediného hnutí prohlížím.\n\nZnovu sevřu lopatu a přiložím ji k tomu samému krku. Kov, který jsem dnes vlastnoručně nabrousil, má zlověstně ostré ostří. Jedno dupnutí, druhé, třetí..."
 bp1_yearly.5602.a: "Aspoň jednou z tebe bude nějaký užitek."
 bp1_yearly.5602.b: "Tvá duše patří [ROOT.Char.GetFaith.HighGodName]. Tvou hlavu dostanou prasata!"
 bp1_yearly.5701.t: "Půjdeš si hrát?"
 bp1_yearly.5701.desc: "Nepochybuji, že vztah mezi [married_friend.GetFirstName] a [friend_spouse.GetFirstName] je velmi šťastný a naplňující, ale čím jsou si bližší, tím méně času má [married_friend.GetFirstNameNoTooltip] na společné chvíle se mnou. Pokaždé, když se pokusím [married_friend.GetFirstNameNoTooltip] vytáhnout třeba jen na obyčejnou procházku, prý mají přednost manželské povinnosti.\n\nChybí mi staré dobré časy a naše společné "
 bp1_yearly.5701.desc.ladsladslads: "výpravy za zábavou, při nichž teklo proudem to nejlepší [ROOT.Char.Custom('RegionalDrink')], dokud nám nebylo zle - a další večer jsme začali nanovo!"
 bp1_yearly.5701.desc.nodrinky: "večery strávené sledováním místních opilců, jak padají na zem a dělají ze sebe hlupáky!"
 bp1_yearly.5701.desc.ending: "\n\nTo byly časy! Kdyby nám jen [friend_spouse.Custom2('InsultAdjective', ROOT.Char)] [friend_spouse.GetFirstNameNoTooltip] [Select_CString(friend_spouse.IsFemale,'nebránila','nebránil')] znovu si je užívat..."
 bp1_yearly.5701.a: "[friend_spouse.GetFirstNameNoTooltip] nás už od sebe neodtrhne!"
 bp1_yearly.5701.b: "Možná jim dokážu otevřít oči..."
 bp1_yearly.5701.c: "Asi se naše cesty prostě rozešly."
 bp1_yearly.5701.tt.critical_success: "Jejich vztah se nenapravitelně rozpadne"
 bp1_yearly.5701.tt.success: "Vrazíš mezi ně klín"
 bp1_yearly.5701.tt.failure: "Ani jeden z nich s tebou nebude spokojený"
 bp1_yearly.5701.tt.critical_failure: "Zašel jsi příliš daleko"
 bp1_yearly.5702.t: "Mistrovský výkon"
 bp1_yearly.5702.desc: "Jaké nadání má [skilful_friend.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('skilful_friend'))]!\n\n"
 bp1_yearly.5702.diplomacy: "Když [skilful_friend.GetFirstNameNoTooltip] promluví, lidé visí na každém slovu. Každou větu dokáže obratně osladit tak, že jejímu kouzlu neodolají ani ti největší cynici a mrzouti. Snad by dokázal[Select_CString(skilful_friend.IsFemale,'a','')] prodat dřevo i lesu!"
 bp1_yearly.5702.martial: "Taktický důvtip [skilful_friend.GetFirstNameNoTooltip] by zahanbil i ty nejlepší vojevůdce světa. Slabiny na bojišti dokáže odhalit a využít téměř instinktivně, takže je neocenitelnou oporou každému, kdo chápe význam válečného umění."
 bp1_yearly.5702.stewardship: "Říct, že se [skilful_friend.GetFirstNameNoTooltip] vyzná v penězích, by bylo slabé slovo. Když dostane na starost finance, neunikne [Select_CString(skilful_friend.IsFemale,'jí','mu')] jediná mince a při vyrovnávání účtů jako by snad skutečně čaroval[Select_CString(skilful_friend.IsFemale,'a','')]."
 bp1_yearly.5702.intrigue: "Představa, že by proti mně stál [skilful_friend.GetFirstNameNoTooltip], patří k těm nejhorším. S lidmi dokáže manipulovat stejně mistrně, jako spřádat složité intriky - a své schopnosti využije stejně obratně při krádeži sladkosti kuchyňské služce jako při přípravě pádu celé dynastie."
 bp1_yearly.5702.learning: "Učenost [skilful_friend.GetFirstNameNoTooltip] je skutečně ohromující a na mém [ROOT.Char.Custom('GetCourt')] se [Select_CString(skilful_friend.IsFemale,'jí','mu')] může rovnat jen málokdo. I teď slyším, jak v jiné [ROOT.Char.Custom('GetRoom')] zasvěceně rozpráví o jakémsi obskurním tématu s lehkostí zkušeného mistra svého řemesla."
 bp1_yearly.5702.prowess: "Bojové umění [skilful_friend.GetFirstNameNoTooltip] je proslulé po celé zemi a mistrovství s mečem nikdo nezpochybňuje. Stačí sledovat, s jakou silou a ladností se na nádvoří pouští do cvičné figuríny, a strach by dostal i ten nejmazanější duelant."
 bp1_yearly.5702.fallback: "FALLBACK"
 bp1_yearly.5702.ending: "\n\nMožná by stálo za to požádat [skilful_friend.GetFirstNameNoTooltip] o pár rad a triků z tohoto oboru?"
 bp1_yearly.5702.a: "Uč mě, [skilful_friend.GetFirstNameNoTooltip]!"
 bp1_yearly.5702.a.tt.success: "[skilful_friend.GetFirstNameNoTooltip] tě zasvětí do svých postupů"
 bp1_yearly.5702.a.tt.neutral: "Nenaučíš se nic užitečného, ale poděkuješ [skilful_friend.GetFirstNameNoTooltip] za snahu"
 bp1_yearly.5702.a.tt.failure: "Jsi tak beznadějný případ, že to [skilful_friend.GetFirstNameNoTooltip] nakonec vzdá"
 bp1_yearly.5702.b: "Myslím, že jsem stejně dobrý!"
 bp1_yearly.5702.b.tt.success: "V soutěži zvítězíš"
 bp1_yearly.5702.b.tt.failure: "V soutěži prohraješ"
 bp1_yearly.5702.c: "Takové úrovně nikdy nedosáhnu!"
 bp1_yearly.5703.t: "Podivní milenci"
 bp1_yearly.5703.desc: "Ležím na zádech, lapám po dechu a celé tělo mám zpocené. Vedle mě se spokojeně rozvaluje [rival_lover.GetFirstName], můj dnešní milostný úlovek. Kdo by si pomyslel, že se tak zavilé nepřátelství může v posteli změnit v takovou... #EMP souhru#!?\n\n„Zavři oči,“ řekne [rival_lover.GetFirstNameNoTooltip] rozpustile a v koutcích úst se objeví hravý úsměv. Poslechnu, složím ruce nad hlavou a vychutnávám si doznívající opojení. Náhlý dotek chladné oceli kolem zápěstí mě však přiměje oči okamžitě otevřít. [rival_lover.GetFirstNameNoTooltip] se právě natahuje ke stolku vedle postele.\n\n„Na tohle čekám už hodně, hodně dlouho,“ zasyčí. V měsíčním světle se zaleskne ostří nože."
 bp1_yearly.5703.a: "NE! Prosím, vyslechni mě!"
 bp1_yearly.5703.a.tt.success: "Podaří se ti [rival_lover.GetFirstNameNoTooltip] přesvědčit"
 bp1_yearly.5703.a.tt.failure: "[rival_lover.GetFirstNameNoTooltip] tě zraní"
 bp1_yearly.5703.a.tt.criticalfailure: "[rival_lover.GetFirstNameNoTooltip] neprojeví žádné slitování"
 bp1_yearly.5703.b: "Počkej! Copak nechceš ještě trochu?"
 bp1_yearly.5703.b.tt.success: "Tvé svůdnické umění tě zachrání"
 bp1_yearly.5703.b.tt.failure: "V posteli zase tak dobrý nejsi"
 bp1_yearly.5703.c: "Ukážu ti, proč je to špatný nápad..."
 bp1_yearly.5704.t: "Vztek [seduced_rival.GetFirstNameNoTooltip] sluší"
 bp1_yearly.5704.desc: "[seduced_rival.GetFirstName] je znovu v mé [ROOT.Char.GetChamber] a mele cosi o tom, jak jsem [Select_CString(seduced_rival.IsFemale,'jí','mu')] ublížil[Select_CString(ROOT.Char.IsFemale,'a','')]. Oči [seduced_rival.GetFirstNameNoTooltip] planou, když znovu proklíná mé jméno, a pohrdavé zavrtění hlavou rozzuří [seduced_rival.GetFirstNameNoTooltip] ještě víc.\n\nZatímco na mě dál chrlí výčitky a já je oplácím stejně ostrými poznámkami, přistihnu se, že znovu přemýšlím o těch očích. Sotva se z krátkého zasnění vzpamatuji, můj pohled už bloudí ke křivce čelisti, tak výrazně napjaté vztekem. Aniž si to uvědomuji, dál zírám a všimnu si, jak se hruď [seduced_rival.GetFirstNameNoTooltip] při každém rozčileném nádechu tak lákavě zdvihá, zatímco tiráda pokračuje, a-\n\nDo čeho jsem se to #EMP [Select_CString(ROOT.Char.IsFemale,'dostala','dostal')]#!?"
 bp1_yearly.5704.a: "Snad se budeme vídat #EMP mnohem#! častěji, [seduced_rival.GetFirstNameNoTooltip]."
 bp1_yearly.5704.b: "Tohle je směšné!"
 bp1_yearly.5705.t: "Nestojí ti za to!"
 bp1_yearly.5705.desc: "Možná jsem se sebou v poslední době až příliš [Select_CString(ROOT.Char.IsFemale,'spokojená','spokojený')]? Právě to zřejmě přimělo [concerned_friend.GetFirstName] konečně zasáhnout. Můj přítel si mě odchytí a postaví mě před nepříjemnou pravdu o mém... komplikovaném vztahu s [lover_rival.GetFirstName].\n\n„Chováš se naprosto směšně!“ pronese [concerned_friend.GetFirstNameNoTooltip] bez obalu. Mé zasněné rozpoložení po milostných radovánkách [Select_CString(concerned_friend.IsFemale,'ji','ho')] očividně dráždí, a tak mě nataženým prstem píchne do hrudi. „#EMP Víš#!, že z toho nevzejde nic dobrého! Řítíš se do maléru a dobře to víš!“"
 bp1_yearly.5705.a: "Ale... #EMP vidíš#!, jak [lover_rival.GetFirstNameNoTooltip] vypadá?!"
 bp1_yearly.5705.a.tt: "Tato možnost je dostupná díky pověstné přitažlivosti [lover_rival.GetFirstNameNoTooltip]."
 bp1_yearly.5705.b: "Ty našemu vztahu prostě nerozumíš!"
 bp1_yearly.5705.c: "Já vím, já vím. Máš pravdu."
 bp1_yearly.5706.t: "Hříchy [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))|U]"
 bp1_yearly.5706.desc: "Při cestě krajem [meeting_county.GetProvince.GetCounty.GetName] spatřím [rival_parent.Custom2('MyCharacterIntroduction', ROOT.Char)], jak spěchá mým směrem. V poslední době po sobě při každé příležitosti házíme jednu jedovatější urážku za druhou. Čekám proto další příval odporných řečí, ale [rival_parent.GetFirstNameNoTooltip] mě beze slova okázale mine.\n\nTeprve potom si všimnu, že [rival_parent.GetFirstNameNoTooltip] není [Select_CString(rival_parent.IsFemale,'sama','sám')]. Za [Select_CString(rival_parent.IsFemale,'ní','ním')] kráčí [rival_child.GetFirstName], [rival_child.Custom('GetDaughterSon')]. [rival_child.GetFirstNameNoTooltip] se na mě usměje, sotva znatelně koketně pozvedne obočí a pak rychle vyrazí za [rival_parent.GetFirstNameNoTooltip].\n\nSleduji, jak oba mizí v dálce. Co to mělo znamenat...?"
 bp1_yearly.5706.a: "Bylo by nezdvořilé neoplatit to stejnou mincí..."
 bp1_yearly.5706.a.tt: "Svádění bude mít vyšší šanci na úspěch"
 bp1_yearly.5706.b: "Příbuzenstva té špíny se ani nedotknu!"
 bp1_yearly.5707.t: "Hříchy [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))|U]: Přistiženi při činu"
 bp1_yearly.5707.start: "Dunivé kroky slyším zřetelně i uprostřed milostného zápalu a na tváři se mi rozhostí samolibý úsměv.\n\n[rival_parent.GetFirstName|U] vtrhne do [ROOT.Char.Custom('GetRoom')] a výraz naprostého zděšení ve tváři [rival_parent.GetFirstNameNoTooltip] je k nezaplacení. [rival_child.GetFirstName],"
 bp1_yearly.5707.child_dislike: "k mému překvapení, se při pohledu na [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))] zazubí skoro stejně široce jako já. Dokonce mě obejme a přitiskne se ke mně ještě blíž.\n\n„Možná mě teď konečně začneš brát vážně, #EMP [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))]#!!“"
 bp1_yearly.5707.child_deviant: "k mému překvapení, se při pohledu na [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))] zazubí skoro stejně široce jako já. Pak mě překvapí ještě víc, když okázalým pohybem odhodí přikrývku a odhalí nás oba!\n\n„Nenecháš se zlákat a #EMP nepřidáš se k nám#!, [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))]?“"
 bp1_yearly.5707.child_like: "vykřikne a horečně se snaží přikrývkou zakrýt svou nahotu.\n\nDožadují se vysvětlení, padají obvinění a rodič s dítětem se přes mé vyčerpané, ale spokojené tělo navzájem překřikují."
 bp1_yearly.5707.a: "Ha! Ha! Mám tě, mizero!"
 bp1_yearly.5707.a.deviant: "Co se to tu při [ROOT.Char.GetFaith.HighGodNamePossessive] jménu děje?!"
 bp1_yearly.5707.a.doubledeviant: "...tak co, [rival_parent.GetFirstNameNoTooltip]?"
 bp1_yearly.5707.b: "Prosím, já a [rival_child.GetFirstNameNoTooltip] se milujeme!"
 bp1_yearly.5707.c: "Dobře jsi své dítě [Select_CString(rival_parent.IsFemale,'vychovala','vychoval')], [rival_parent.GetFirstNameNoTooltip]!"
 bp1_yearly.5740.t: "Vejce plné otázek"
 bp1_yearly.5740.desc: "Rozespale se probudím za zpěvu ptáků, zatímco do mé [ROOT.Char.Custom('GetChamber')] pronikají paprsky ranního slunce. Zívnu, protáhnu se a znovu klesnu do postele, kde si užívám příjemného tepla. Teprve po chvíli si něčeho všimnu.\n\nVedle mě, stejně dokonale usazený na polštáři jako já pod přikrývkou, leží vskutku záhadný předmět.\n\nStředně velké, bělavé a dokonale obyčejné...\n\nVejce."
 bp1_yearly.5740.a: "Co... co to má #EMP znamenat#!?"
 bp1_yearly.5740.a.tt: "Musím najít viníka!"
 bp1_yearly.5740.b: "Jak podivné. No nic."
 bp1_yearly.5740.c: "Kdo to udělal? Kde je?! #EMP STRÁŽE!#!"
 bp1_yearly.5741.t: "$bp1_yearly.5740.t$: Uloupené"
 bp1_yearly.5741.desc: "Nejdřív zamířím do kuchyně, kde služebnictvo čile kmitá kolem stolů a připravuje jídlo. Několikrát mě dokonce odeženou od hromad potravin; skutečnost, že jsem jejich [ROOT.Char.GetLadyLord], na zaneprázdněné kuchaře očividně nijak nepůsobí.\n\nNakonec najdu, co hledám: úhledně vyskládanou zásobu vajec! Každé pohodlně spočívá v malém důlku ze sena ve velké otevřené dřevěné bedně, vyskládané v řadách po deseti. Deset krát deset krát deset krát... osm.\n\n#EMP Dvě#! vejce chybí!"
 bp1_yearly.5741.a: "Další?! Viníka nechám #EMP stáhnout z kůže#!!"
 bp1_yearly.5741.a.tt: "Nenechám kámen na kameni!"
 bp1_yearly.5741.b: "Ať to byl kdokoli, měl přístup do kuchyně! Záhada vyřešena!"
 bp1_yearly.5742.t: "$bp1_yearly.5740.t$: Čert aby to vzal!"
 bp1_yearly.5742.desc: "Seběhnu po schodech do sklepa a na okamžik se zastavím, abych se nadechl chladného, vlhkého vzduchu. V regálech se tu vrší zásoby jídla a pití, ale na rozdíl od ruchu v kuchyni nade mnou je sklep naprosto prázdný. Opřu se o nízkou polici a snažím se srovnat si myšlenky. Kdokoli mi to vejce podstrčil, musí mít přístup do mých komnat, do kuchyně a...\n\nMyšlenka se náhle rozplyne. Ruka, kterou jsem bezmyšlenkovitě strčil do kapsy, znehybní. Nevěřícně nahmatám prsty předmět a pomalu jej vytáhnu z oděvu.\n\nJe tvrdý. Vlažný. #EMP Vejčitého tvaru.#!"
 bp1_yearly.5742.a: "Jak? JAK?!"
 bp1_yearly.5742.b: "Jaké štěstí! #EMP Dvě#! vejce zadarmo!"
 bp1_yearly.5743.t: "$bp1_yearly.5740.t$: Líhne se plán"
 bp1_yearly.5743.desc: "Jako v mrákotách vtrhnu s vytřeštěnýma očima do trůnního sálu. Přede mnou stojí moji vazalové i rodina a mezi nimi obzvlášť vynikají zděšené tváře [egg_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] a [egg_friend.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n„Vejce! DVĚ vejce!“ zahřmím a mávám před nimi nenápadným oválným předmětem. „Kdo to byl?! Kdo to udělal? Nechám vás hodit do moře!“\n\nOzve se několik nervózních, zmatených uchechtnutí. Zvednu ruku vysoko nad hlavu a s nesrozumitelným, ohlušujícím zařváním mrštím tím proklatým předmětem přímo o podlahu. Smích okamžitě utichne."
 bp1_yearly.5743.a: "[egg_spouse.GetFirstNameNoTooltip]! Okamžitě se přiznej!"
 bp1_yearly.5743.a.tt.success: "Správně označíš podezřelého"
 bp1_yearly.5743.a.tt.failure: "Tvůj odhad je chybný"
 bp1_yearly.5743.a.tt.outcome: "Šance na"
 bp1_yearly.5743.b: "[egg_friend.GetFirstNameNoTooltip]! Ty [egg_friend.Custom2('InsultNoun', ROOT.Char)]!"
 bp1_yearly.5743.c: "Podezřelí jste všichni! #EMP Všichni!#!"
 bp1_yearly.5743.c.tt.success: "Správně označíš... úplně všechny"
 bp1_yearly.5743.c.tt: "Všichni dvořané"
 bp1_yearly.5744.t: "$bp1_yearly.5740.t$: Rozšlehané"
 bp1_yearly.5744.start: "Zuřivost dodává mému obvinění patřičnou váhu, ale jak vteřiny plynou, zmatený výraz na "
 bp1_yearly.5744.spouse: "tváři [egg_spouse.GetFirstNameNoTooltip]"
 bp1_yearly.5744.friend: "tváři [egg_friend.GetFirstNameNoTooltip]"
 bp1_yearly.5744.crowd: "tvářích všech přítomných"
 bp1_yearly.5744.end: "ani na okamžik nemizí. Pokusím se udělat další krok, ale celé tělo ochabne a začne se kácet k zemi.\n\nV příštím okamžiku už ležím na zádech a výhled mi lemuje kruh ustaraných tváří. Někdo mi přikládá ke spánku hadřík namočený ve studené vodě.\n\n„Ne, ne, [ROOT.Char.Custom('FormOfAddressForLiege')]! Musíte odpočívat. A pošleme pro sluhu, aby vás také očistil.“ Slova ke mně dolehnou právě ve chvíli, kdy si sáhnu na tvář a prsty lehce rozetřu žloutek z rozbitého vejce, do kterého jsem se při pádu zabořil."
 bp1_yearly.5744.a: "...bolí mě hlava."
 bp1_yearly.5744.b: "Viníka najdu! Jen... ne teď."
 bp1_yearly.5745.t: "$bp1_yearly.5740.t$: Nekalá hra"
 bp1_yearly.5745.desc: "Po celodenní dřině si zasloužím pořádný odpočinek! Mou velkou pohodlnou postel ozařuje mihotavé světlo ohně a praskající plameny nechávají po stěnách tančit stíny. S vděčností vklouznu do jejího teplého objetí, přetáhnu přes unavené tělo přikrývku a položím hlavu na polštář.\n\nA teprve tehdy to spatřím. Ani ne na délku paže ode mě, neposkvrněné, uložené na vlastním polštáři a ozářené třpytivými plameny z krbu.\n\nVejce."
 bp1_yearly.5745.a: "#DIE2 ...ne. ...ne,#! #DIE1 ne, ne, ne,#! #EMP nééééé!#!"
 bp1_yearly.5745.b: "Tohle má na svědomí [egg_spouse.GetFirstNameNoTooltip], já to prostě vím."
 bp1_yearly.5745.c: "To musí být dílo [egg_friend.GetFirstNameNoTooltip]!"
 bp1_yearly.5745.d: "Do těchhle směšných hrátek se už odmítám zapojovat!"
