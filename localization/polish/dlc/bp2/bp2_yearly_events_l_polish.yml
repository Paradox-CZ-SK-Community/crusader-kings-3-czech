l_polish:
 pet_rock.0001.t: "Kámen úrazu"
 pet_rock.0001.desc: " #EMP Cink!#! \n\nZrovna se procházím venku, když špičkou boty zavadím o malý kamínek. Ten se s jasným cinknutím odrazí od několika dalších a zastaví se kousek ode mě. Ze zvědavosti ho zvednu. Jeho hrbolatý povrch je zvláštně teplý.\n\nNajednou přesně vím, co chce. Z kamínku vyzařuje #EMP přátelská#! aura. Když si ho prohlížím, jak mi leží v dlani, jeho tíha mě zároveň uklidňuje i naplňuje zvláštním nadšením."
 pet_rock.0001.a: "Budeme nejlepší přátelé!"
 pet_rock.0001.a.tt: "Vaše společná dobrodružství začínají!"
 pet_rock.0001.b: "Co mě to napadlo?"
 pet_rock.0001.b.tt: "Opravdu by mi prospělo trávit méně času venku..."
 pet_rock.0002.t: "Kámen"
 pet_rock.0002.desc: "Kámen mi spokojeně spočívá na klíně a já přemítám, jak [ROOT.Char.Custom('RockStoryHerHim')|l] pojmenovat. Něco z historie? Něco, co připomíná [ROOT.Char.Custom('RockStoryHerHis')|l] tvar? Nebo jméno vystihující ten uklidňující pocit, když hladím [ROOT.Char.Custom('RockStoryHerHis')|l] [ROOT.Char.Custom('RockColor')|l] povrch?\n\nUž to mám! Budu [ROOT.Char.Custom('RockStoryHerHim')|l] říkat..."
 pet_rock.0002.a: "To je skvělé jméno!"
 pet_rock.0100.t: "[ROOT.Char.Custom('RockStoryName')]: Sedimentální hodnota"
 pet_rock.0100.desc: "Po dalším vyčerpávajícím dni se sesunu na židli. [ROOT.Char.Custom('GetChamber')|U] mi poskytuje alespoň trochu klidu, ale jak dlouho ještě takové tempo vydržím?\n\nKdyž pohnu nohou, ozve se tiché klapnutí. Vedle židle sedí můj kamenný mazlíček [ROOT.Char.Custom('RockStoryName')]. Chvíli spolu jen tak pobýváme, nasloucháme uklidňujícímu tichu a já hladím [ROOT.Char.Custom('RockStoryHerHis')|l] [ROOT.Char.Custom('RockColor')|l] povrch."
 pet_rock.0100.a: "Ještě nějakou dobu to snad zvládnu."
 pet_rock.0101.t: "[ROOT.Char.Custom('RockStoryName')]: Lesk jako blesk"
 pet_rock.0101.desc: "Na okraji mého stolu sedí [ROOT.Char.Custom('RockStoryName')] a tváří se uraženě. Pohlédnu tím směrem. Je jasné, že [ROOT.Char.Custom('RockStorySheHe')|l] trucuje.\n\nOba dobře víme, že [ROOT.Char.Custom('RockStorySheHe')|l] chce pořádně vyleštit ten nádherný [ROOT.Char.Custom('RockColor')|l] povrch. Jenže [ROOT.Char.Custom('RockStoryHerHis')|l] oblíbená leštěnka je tak #EMP drahá#!..."
 pet_rock.0101.a: "Dobře, dobře, necháme tě vyleštit."
 pet_rock.0101.b: "Budeš se muset spokojit s tím, co máš."
 pet_rock.0102.t: "[ROOT.Char.Custom('RockStoryName')]: Čistý jako křišťál"
 pet_rock.0102.desc: "Povrch mého kamínku [ROOT.Char.Custom('RockStoryName')] dnes vypadá poněkud zašle. Jeho obvykle zářivý [ROOT.Char.Custom('RockColor')|l] odstín ztratil lesk. [ROOT.Char.Custom('RockStorySheHe')|U] sedí na svém obvyklém místě a vyčítavě se dožaduje koupele.\n\nZrovna #EMP dnes#! mám přece důležitou audienci, ne? Tohle se bude těžko vysvětlovat..."
 pet_rock.0102.a: "Audience může počkat!"
 pet_rock.0102.b: "Jindy, [ROOT.Char.Custom('RockStoryName')]."
 pet_rock.0103.t: "[ROOT.Char.Custom('RockStoryName')]: Tajná pochoutka"
 pet_rock.0103.desc: "Přede mnou přistane další talíř vrchovatě naložený jídlem. Žaludek už mi z předchozích soust skoro sténá, ale vtom mě do nosu udeří nádherná vůně. Máta!\n\nTa mi okamžitě připomene můj kamínek [ROOT.Char.Custom('RockStoryName')]. Máta je přece [ROOT.Char.Custom('RockStoryHerHis')|l] nejoblíbenější vůně!\n\nSkoro #EMP cítím#! tu naléhavou prosbu, která ke mně vyzařuje z váčku, kde [ROOT.Char.Custom('RockStoryName')] odpočívá."
 pet_rock.0103.a: "Zkusím pár lístků nenápadně propašovat do váčku..."
 pet_rock.0103.b: "Raději ne."
 pet_rock.0104.t: "[ROOT.Char.Custom('RockStoryName')]: Kámen na srdci"
 pet_rock.0104.desc: "[ROOT.Char.Custom('GetRoom')|U] se rozléhá ozvěnou mých kroků, zatímco se utápím v myšlenkách. Kolik jen strastí a útrap musí snášet [ROOT.Char.GetTitleAsNameNoTooltip|l]! Třeba mi můj kamínek [ROOT.Char.Custom('RockStoryName')] dokáže dobře poradit?\n\nSáhnu po váčku, kde obvykle odpočívá. Nic. Prázdno. Bez [ROOT.Char.Custom('RockStoryHerHis')|l] uklidňující přítomnosti se najednou cítím naprosto ztraceně.\n\nZačíná mě zachvacovat panika."
 pet_rock.0104.a: "Venku leží jeden #EMP podobný#! kamínek..."
 pet_rock.0104.b: " #EMP [ROOT.Char.Custom('RockStoryName')]!#! Kde [ROOT.Char.Custom('RockStorySheHe')|l] je?"
 pet_rock.0104.b.success: "Najdeš svůj kamínek v truhle"
 pet_rock.0104.b.failure: "...[ROOT.Char.Custom('RockStoryName')]?"
 pet_rock.0104.b.failure.tt: "Tvůj přítel je navždy pryč."
 pet_rock.0104.c: "Třeba [ROOT.Char.Custom('RockStorySheHe')|l] jen navštěvuje nějakého kamaráda?"
 pet_rock.0104.c.tt: "Asi je čas smířit se s tím, že naše společné cesty se rozešly..."
 pet_rock.0105.t: "[ROOT.Char.Custom('RockStoryName')]: Kámen ke kameni sedá"
 pet_rock.0105.desc: "Zrovna si venku povídám se svým kamínkem [ROOT.Char.Custom('RockStoryName')] a vzpomínám na naše první setkání, když ke mně dolehne radostný výkřik. Blíží se [other_rock_owner.GetFirstName] a něco svírá v rukou... Počkat, to je snad...?\n\n„To mám radost, že také máte kamenného společníka, [ROOT.Char.Custom('FormOfAddressForLiege')|l]!“ [other_rock_owner.GetFirstName] mi nadšeně ukazuje vlastní kamínek. „Třeba by se z nich mohli stát přátelé?“"
 pet_rock.0105.a: "Ten kámen vypadá pěkně hloupě."
 pet_rock.0105.b: "Určitě si budou skvěle rozumět!"
 pet_rock.0105.c: "Promiň, [ROOT.Char.Custom('RockStoryName')] se před cizími trochu ostýchá."
 pet_rock.0106.t: "[ROOT.Char.Custom('RockStoryName')]: Žuch!"
 pet_rock.0106.desc: "Sedím u stolu a pročítám dopisy a zprávy. Vedle mě odpočívá [ROOT.Char.Custom('RockStoryName')] a vyhřívá se v paprscích slunce.\n\nNatáhnu ruku, abych pohladil ten nádherný [ROOT.Char.Custom('RockColor')|l] povrch, ale zdá se, že [ROOT.Char.Custom('RockStorySheHe')|l] má dnes obzvlášť hravou náladu. Jakmile se přiblížím, stůl se zakymácí a [ROOT.Char.Custom('RockStoryName')] se střemhlav vrhne přes jeho okraj!"
 pet_rock.0106.a: "Ha! Ty malý blázínku!"
 pet_rock.0107.t: "[ROOT.Char.Custom('RockStoryName')]: Neber kámen na lehkou váhu"
 pet_rock.0107.desc: "Když nesu [ROOT.Char.Custom('RockStoryName')] zpátky do svého příbytku, [ROOT.Char.Custom('RockStoryHerHis')|l] [ROOT.Char.Custom('RockColor')|l] povrch mi příjemně spočívá v dlani. Napadá mě, jestli mi tenhle kamenný společník náhodou nezávidí. Já mám přece vlastní domov – [ROOT.Char.Custom('ResidenceBuilding')|l] – který si mohu zařídit podle svého a kde mohou bydlet i mí přátelé a rodina.\n\n[ROOT.Char.Custom('RockStoryName')] nic takového nemá. Není tedy načase to napravit?\n\nPohlédnu do dlaně a zamyslím se."
 pet_rock.0107.a: "[ROOT.Char.Custom('RockStoryName')] může spát se mnou v posteli!"
 pet_rock.0107.b: "Proč to nezkusit?"
 pet_rock.0107.b.success: "Postavíš obstojný přístřešek"
 pet_rock.0107.b.failure: "Praštíš se do palce"
 pet_rock.0107.c: "Myslím, že [ROOT.Char.Custom('RockStoryName')] má raději pobyt pod širým nebem."
 pet_rock.0108.t: "[ROOT.Char.Custom('RockStoryName')]: Být, či nebýt... ve zdi?"
 pet_rock.0108.desc: "Všimnu si zvláštního otvoru ve zdi, zatímco mi [ROOT.Char.Custom('RockStoryName')] spočívá v dlani. [ROOT.Char.Custom('ResidenceBuilding')|U] má ve vnější zdi díru, jako by z ní někdo vyrval kus kamene.\n\nV dlani skoro cítím zvědavost, kterou [ROOT.Char.Custom('RockStoryName')] vyzařuje. Pozvednu svůj kamínek k otvoru, aby si ho mohl prohlédnout, a pak ho z náhlého rozmaru přímo do díry vsadím. Přesně podle očekávání tam padne jako ulitý.\n\nNajednou mě napadne, že by možná pro nás oba bylo nejlepší nechat tenhle kamínek právě tady"
 pet_rock.0108.landed: ", jako součást mého domova? Třeba dokonce přijdeme na nové a lepší způsoby, jak z jeho kamenných přátel stavět další domy?"
 pet_rock.0108.adventurer: ", aby tu našel nový domov? A až se sem příště vrátíme, mohli bychom mu přivést pár nových přátel..."
 pet_rock.0108.a: "Nedokážu si představit větší poctu!"
 pet_rock.0108.a.adventurer: "Je čas nechat ho jít."
 pet_rock.0108.a.tt: "Vaše společná dobrodružství končí."
 pet_rock.0108.b: "Nikdy se s [ROOT.Char.Custom('RockStoryName')] nedokážu rozloučit!"
 pet_rock.0108.b.tt: "[ROOT.Char.Custom('RockStorySheHe')|U] se mnou bude cestovat navždy."
