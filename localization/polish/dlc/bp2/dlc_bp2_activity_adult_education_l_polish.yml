 bp2_adult_education.1012.a.failure.tt: "Rodný jazyk [teacher.Custom('CZ_FirstNameNoTooltip_G')] se ti nepodařilo naučit"
 bp2_adult_education.1020.t: "Goliardi"
 bp2_adult_education.1020.desc: "Právě odcházím z přednášky [teacher.Custom('CZ_FirstName_G')], která mě přiměla k hlubokému zamyšlení, když mou pozornost upoutá bouřlivý smích a pokřikování zvenčí."
 bp2_adult_education.1020.desc.lusty_poetry: "\n\nBlíží se hlučná skupina studentů v čele s [student.Custom('CZ_FirstName_I')]. Všichni zpívají #EMP nestydatou#! píseň o svých milostných dobrodružstvích, a to s takovými podrobnostmi, že se mi až tají dech."
 bp2_adult_education.1020.desc.drinking_poetry: "\n\n[student.GetFirstName|U] má očividně pořádně upito a sotva stojí na nohou, ale přesto dokáže nadšený dav bavit elegantními verši o slastech pití, které ostatně tak dobře zná i místní duchovenstvo."
 bp2_adult_education.1020.desc.satyre_poetry: "\n\nBlíží se cosi, co lze popsat jedině jako studentské #EMP procesí#!, v jehož čele kráčí [student.GetFirstName]. Účastníci se snaží zachovat vážnou tvář, zatímco střídavě přednášejí úryvky z posvátného textu [location.GetCounty.GetFaith.ReligiousText] a rouhavé parodie náboženských obřadů."
 bp2_adult_education.1020.desc.carmina_burana: "\n\n„#EMP O Fortuna velut luna statu variabilis, semper crescis aut decrescis#!,“ zpívá [student.GetFirstName] obklopen nadšeně jásajícím davem."
 bp2_adult_education.1020.desc.dice: "\n\nHlučná skupina studentů obklopuje [student.Custom('CZ_FirstName_A')] a dalšího člověka, kterého nepoznávám. Oba hrají kostky na schodech vedoucích k [location.Custom('GetLocationFaithTemple')]."
 bp2_adult_education.1020.desc.donkey: "\n\n[student.GetFirstName|U] vede za sebou #EMP osla#! a zpívá na něj oslavné ódy. Po každém verši skupina studentů sborově odpovídá: „Í-á, pane osle, í-á!“"
 bp2_adult_education.1020.desc.end: "Jakmile si mě všimnou, začnou skandovat: „PŘIDEJ SE K NÁM! PŘIDEJ SE K NÁM!“\n\nZamračený výraz ve tváři [teacher.Custom('CZ_FirstNameNoTooltip_G')] jasně prozrazuje, co si o tom všem myslí."
 participated_in_goliardy_log: "[CHARACTER.GetTitledFirstName|U] se [Select_CString(CHARACTER.IsFemale,'přidala','přidal')] k [TARGET_CHARACTER.Custom('CZ_FirstName_D')] a ostatním goliardům při jejich radovánkách"
 participated_in_goliardy_log_title: "Připojení ke goliardům"
 bp2_adult_education.1020.a: "To je #EMP NEHORÁZNOST#!!"
 bp2_adult_education.1020.b: "Proč vlastně ne...?"
 bp2_adult_education.1020.c: "Na to se vůbec nemusíte ptát!"
 bp2_adult_education.1020.d: "Možná někdy příště."
 goliard_shenanigans_get_lovers_pox.tt: "Nakazíš se nemocí [GetTrait('lovers_pox').GetName( GetNullCharacter )]"
 bp2_adult_education.1020.c.tt: "Pořádně si vyhodíš z kopýtka!"
 bp2_adult_education.1020.b.tt: "Ochutnat něco z toho „goliardského způsobu života“ přece nemůže být tak špatné, nebo ano?"
 bp2_adult_education.1030.t: "[Select_CString(ROOT.Char.IsFemale,'Jedna z holek','Jeden z kluků')|U]"
 bp2_adult_education.1030.desc: "Univerzity a centra vyššího vzdělávání jsou vždy rušnými středisky společenského života.\n\nV těchto posvátných síních jsou si všichni studenti rovni. Všichni jsou učedníky na cestě za poznáním, a proto se vyplatí navazovat přátelství a stát se součástí zdejšího společenství."
 bp2_adult_education.1030.desc_alcohol: "\n\nPrávě to mě napadne, když ke mně přistoupí [student.GetFirstName]. Z dechu je cítit [student.Custom('RegionalAlcoholicDrink')|l].\n\n„Přidej se ke mně a mým přátelům, [ROOT.Char.GetFirstNameNoTooltip]! Dokaž nám, jakou výdrž má [ROOT.Char.GetTitleAsNameNoTooltip]! Vypij víc pohárů než kdokoli z nás a přijmeme tě mezi sebe!“"
 bp2_adult_education.1030.desc_fallback: "\n\nPrávě to mě napadne, když ke mně přistoupí [student.GetFirstName] s podezřelým úšklebkem.\n\n„Přidej se ke mně a mým přátelům, [ROOT.Char.GetFirstNameNoTooltip]! Dokaž nám, co vydrží [ROOT.Char.GetTitleAsNameNoTooltip]! Prohýři s námi celou noc a přijmeme tě mezi sebe!“"
 bp2_adult_education.1030.a: "...Možná?"
 bp2_adult_education.1030.b: "Jdu do toho!"
 bp2_adult_education.1030.b.tt: "Uděláš na ně dojem!"
 bp2_adult_education.1030.a.success: "Ostatní studenti skandují tvé jméno"
 bp2_adult_education.1030.a.success.tt: "Získáš si jejich sympatie"
 bp2_adult_education.1030.a.failure: "Ostatní studenti se smějí tvým chabým pokusům"
 bp2_adult_education.1030.a.failure.tt: "Nepodaří se ti na ně zapůsobit"
 bp2_adult_education.1030.c: "Ne, díky."
 one_of_the_boys_log: "[CHARACTER.GetTitledFirstName|U] [Select_CString(CHARACTER.IsFemale,'zapůsobila','zapůsobil')] svými bujarými radovánkami na [Select_CString(TARGET_CHARACTER.IsFemale,'spolužačku','spolužáka')] [TARGET_CHARACTER.Custom('CZ_FirstName_A')]"
 one_of_the_boys_log_title: "Jeden z party"
 bp2_adult_education.1040.t: "Myšlenkové školy"
 bp2_adult_education.1040.desc: "Místo zvané [location.GetBaronyNameExplicitly] je domovem univerzity, jejíž síně se často rozléhají debatami studentů a učitelů. Některé spory přerůstají v pověstná soupeření, jako například to mezi [teacher_1.Custom('CZ_FirstName_I')] a [teacher_2.Custom('CZ_FirstName_I')].\n\nKdyž na ně dnes narazím, jako obvykle po sobě pokřikují a snaží se dokázat, který z jejich oborů je lépe vybaven k debatě na téma „[teacher_1.Custom('EruditeTopic')]“. Neobvyklé ovšem je, že si najednou všimnou mého příchodu a požádají #EMP mě#!, abych [Select_CString(ROOT.Char.IsFemale,'zaujala','zaujal')] stanovisko."
 bp2_adult_education.1040.a: "[teacher_1.GetFirstNameNoTooltip|U] má pravdu."
 bp2_adult_education.1040.b: "[teacher_2.GetFirstNameNoTooltip|U] se věnuje hodnotnějšímu poznání."
 bp2_adult_education.1040.c: "Oba obory mají své nesporné přednosti."
 bp2_adult_education.1040.c.success: "Přesvědčíš je svou argumentací a [Select_CString(And(teacher_1.IsFemale,teacher_2.IsFemale),'obě jsou spokojené','oba jsou spokojeni')|l]"
 bp2_adult_education.1040.c.success.tt: "Uděláš na své učitele dojem"
 bp2_adult_education.1040.c.failure: "Domnívají se, že jen kalíš vodu"
 bp2_adult_education.1040.c.failure.tt: "Na učitele tvá argumentace nezapůsobí"
 bp2_adult_education.1040.d: "Co kdybychom pokračovali v krčmě?"
 bp2_adult_education.1040.d.success: "Díky tobě najdou společnou řeč"
 bp2_adult_education.1040.d.success.tt: "Podaří se ti učitele usmířit"
 bp2_adult_education.1040.d.failure: "Spor se ještě více vyhrotí"
 bp2_adult_education.1040.d.failure.tt: "Učitelé dávají vinu tobě"
 bp2_adult_education.1040.d.tt: "Dobrým jídlem a pitím by se ti mohlo podařit obměkčit [teacher_1.Custom('CZ_FirstNameNoTooltip_A')] i [teacher_2.Custom('CZ_FirstNameNoTooltip_A')]"
 bp2_adult_education.1040.e: "Záleží na tom vůbec?"
 sided_with_teacher_log: "[CHARACTER.GetTitledFirstName|U] se v učeném sporu [Select_CString(CHARACTER.IsFemale,'přiklonila','přiklonil')] na stranu [TARGET_CHARACTER.Custom('CZ_FirstName_G')]"
 sided_with_teacher_log_title: "Podpora učitele"
 balanced_teachers_opinions_log: "[CHARACTER.GetTitledFirstName|U] [Select_CString(CHARACTER.IsFemale,'dovedla','dovedl')] své učitele ke shodě v učeném sporu"
 balanced_teachers_opinions_log_title: "Nalezení shody mezi učiteli"
 bp2_adult_education.1050.t: "Cizinci v cizí zemi"
 bp2_adult_education.1050.desc: "Místo zvané [location.GetBaronyNameExplicitly] je skutečně střediskem vzdělanosti, které přitahuje studenty z celého světa!\n\nUvědomím si to, když přemýšlím o sobě a mnoha dalších studentech, kteří sem přišli za poznáním. Patří mezi ně i [student_1.GetFirstName] a [student_2.GetFirstName]. Všichni jsme tu vlastně cizinci! Napadá mě, jestli by se toho nedalo nějak využít..."
 bp2_adult_education.1050.a: "Všichni se od sebe můžeme něco naučit!"
 bp2_adult_education.1050.b: "Připijme si na naše odlišnosti!"
 bp2_adult_education.1050.c: "Jsem tu jen kvůli studiu."
 bp2_adult_education.1060.t: "Ano a ne"
 bp2_adult_education.1060.desc: "Při důkladném studiu [CZFaithAdjDecline(ROOT.Char.GetFaith,'é')|l] nauky v místě zvaném [location.GetBaronyNameExplicitly] narážím na tolik nových otázek, že na některé z nich ani nedokážu najít jednoznačnou odpověď. Některá vysvětlení si dokonce přímo odporují!\n\nMá rozum doplňovat víru, nebo ne?\nZabývá se víra pouze tím, co je neviditelné, nebo ne?\nA můžeme vůbec poznat něco, co je neviditelné, nebo ne?\n\n#EMP Ano, nebo ne?#!"
 bp2_adult_education.1060.a: "I v těch rozporech se musí skrývat nějaký smysl..."
 bp2_adult_education.1060.b: "Odpověď musí vycházet z empirické zkušenosti!"
 bp2_adult_education.1060.c: "Bolí mě z toho hlava."
 bp2_adult_education.1060.a.tt: "Získáš knižní artefakt"
 sic_et_non_log: "[CHARACTER.GetTitledFirstName|U] [Select_CString(CHARACTER.IsFemale,'napsala','napsal')] během studia na základě svých poznámek knihu o teologických otázkách"
 sic_et_non_log_title: "Sepsání knihy"
 bp2_adult_education.1060.a.crit_success: "Tvé úvahy jsou natolik pronikavé, že mohou pomoci i budoucím učencům"
 bp2_adult_education.1060.a.crit_success.tt: "Teď už to všechno dává smysl"
 bp2_adult_education.1060.a.success: "Cítíš se moudřejší a blíže pravdě"
 bp2_adult_education.1060.a.success.tt: "Podařilo se ti pokročit v poznání"
 bp2_adult_education.1060.a.failure: "Máš v tom ještě větší zmatek než předtím"
 bp2_adult_education.1060.a.failure.tt: "Nedokážeš v tom najít žádný smysl"
 sic_et_non_book_name: "Ano a ne"
 sic_et_non_book_desc: "Tato kniha vznikla na základě teologických a filozofických úvah [book_creator.Custom('CZ_TitledFirstName_G')] během studií v místě zvaném [location.GetBaronyNameExplicitly].\n\nObsahuje hlubokou a pečlivě propracovanou rozpravu o rozporech v [CZFaithAdjDecline(book_creator.GetFaith,'é')|l] teologii a o tom, jak je nejlépe uvést v soulad."
 bp2_adult_education.1060.b.tt: "Jak vlastně zněla ta otázka?"
 bp2_adult_education.1070.t: "Debata"
 bp2_adult_education.1070.desc: "Výuka v místě zvaném [location.GetBaronyNameExplicitly] probíhá převážně ústní formou. Studenti jsou vedeni k tomu, aby si cvičili své řečnické schopnosti a prokazovali pokroky ve vzdělání v debatách před spolužáky a učiteli.\n\nDnes mě [teacher.GetFirstName] [Select_CString(teacher.IsFemale,'vyzvala','vyzval')], abych se s [student.Custom('CZ_FirstName_I')] [Select_CString(ROOT.Char.IsFemale,'ujala','ujal')] protichůdných stanovisek a společně jsme se pustili do debaty na téma „[teacher.Custom('EruditeTopic')]“."
 bp2_adult_education.1070.a: "Začnu posvátným textem [ROOT.Char.GetFaith.ReligiousText]. Jak všichni víme..."
 bp2_adult_education.1070.b: "Nemůžu říct, že se nemýlíš. Ale [Select_CString(ROOT.Char.IsFemale,'lhala','lhal')|l] bych, kdybych to [Select_CString(ROOT.Char.IsFemale,'řekla','řekl')|l]?"
 bp2_adult_education.1070.c: "Vždyť [student_2.GetFirstNameNoTooltip] [Select_CString(student_2.IsFemale,'se chtěla','se chtěl')] taky zapojit!"
 won_a_debate_log: "[CHARACTER.GetTitledFirstName|U] [Select_CString(CHARACTER.IsFemale,'překonala','překonal')] [TARGET_CHARACTER.Custom('CZ_FirstName_A')] v učené debatě během výuky"
 won_a_debate_log_title: "Debata během výuky"
 bp2_adult_education.1070.a.success: "Tvé stanovisko je přesvědčivější"
 bp2_adult_education.1070.a.success.tt: "Vítězíš v debatě!"
 bp2_adult_education.1070.a.failure: "Protivník má navrch"
 bp2_adult_education.1070.a.failure.tt: "Prohráváš debatu!"
 bp2_adult_education.1070.b.success: "Svou výřečností dokážeš natolik zamotat celý spor, že se protivník vzdá"
 bp2_adult_education.1070.b.failure: "Nepodaří se ti zamotat hlavu [student.Custom('CZ_FirstName_D')]"
 bp2_adult_education.1080.t: "Otázka víry?"
 bp2_adult_education.1080.desc: "Místo zvané [location.GetBaronyNameExplicitly] je proslulým střediskem vzdělanosti, které přitahuje učitele i studenty z blízka i daleka.\n\nAž dodnes mě to nijak zvlášť nezajímalo. Pak se však [teacher.GetFirstName] při výuce [Select_CString(teacher.IsFemale,'zmínila','zmínil')] o náboženství způsobem, který mě hluboce pobouřil. Takové rouhání odporuje všemu, co mě kdy učili! Najednou mi dochází, že [teacher.GetFirstName] je [teacher.GetFaith.GetAdherentNameNoTooltip], z mého pohledu přímo [ROOT.Char.Custom2('GetUnbelieverTerm', teacher)]! A já vůbec nevím, co si o tom mám myslet."
 bp2_adult_education.1080.a: "Dokud se mám co naučit, je mi to jedno."
 bp2_adult_education.1080.b: "Má [CZReligionAdjDecline(ROOT.Char.GetFaith.GetReligion,'á')|l] povinnost je jasná! Jestli je [ROOT.Char.Custom2('GetUnbelieverTerm', teacher)], zaslouží si nějaký žertík!"
 bp2_adult_education.1080.c: "Co mě může [teacher.GetFaith.GetAdherentNameNoTooltip] vůbec naučit?!"
 bp2_adult_education.1080.d: "Možná právě [teacher.GetFirstName] zná odpovědi, které mi dosud unikaly..."
 bp2_adult_education.1080.e: "Tak to mě [teacher.GetFirstNameNoTooltip] může naučit ještě mnohem víc!"
 bp2_adult_education.1080.b.tt: "Žertík má nečekané následky"
 bp2_adult_education.1090.t: "Pohled pod peří"
 bp2_adult_education.1090.desc: "„Dnes,“ začne [Select_CString(teacher.IsFemale,'naše učitelka','náš učitel')|l] [teacher.GetFirstName], „se budeme zabývat anatomií sokola.“\n\nPřednáškovým sálem se rozšíří vzrušené šeptání. Všichni obdivujeme ptáka s nasazenou čepičkou, který hrdě sedí na [Select_CString(teacher.IsFemale,'učitelčině','učitelově')|l] ruce chráněné rukavicí.\n\n„Jak nás učili již starověcí mudrci, studiem zvířecích těl se můžeme mnohému naučit. Chtěl by mi někdo pomoci s názornou ukázkou pitvy?“"
 bp2_adult_education.1090.a: "Hlásím se jako dobrovolník!"
 bp2_adult_education.1090.a.tt: "Tento čin odporuje tvému přesvědčení"
 bp2_adult_education.1090.b: "Dovolte mi, ať se o toho ptáka postarám..."
 bp2_adult_education.1090.b.tt: "Bleskově mu sundáš čepičku a vypustíš ho do učebny, abys [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')|l] sledovat následný chaos!"
 bp2_adult_education.1090.c: "Velmi zajímavé."
