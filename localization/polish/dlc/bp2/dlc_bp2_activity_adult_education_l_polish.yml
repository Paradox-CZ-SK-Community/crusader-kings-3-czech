 bp2_adult_education.9000.b: "#EMP *Zuřivě si zapisuji poznámky*#!"
 bp2_adult_education.9000.c: "„Každý přece ví, že za tím stojí [guest_speaker.GetFaith.random_EvilGodNames]!“"
 bp2_adult_education.9000.d: "Nemůžu zůstat, v krčmě na mě čeká [ROOT.Char.Custom('GetExpensiveDrink_Singular')]!"
 bp2_adult_education.9000.e: "Aha? Hm. Opravdu? Fascinující, ano, ano..."
 you_learn_something: "Něco se naučíš"
 you_are_hampered: "Tvé studium utrpí"
 bp2_adult_education.9100.t: "Sedlácké řádění"
 bp2_adult_education.9100.desc: "Z půlnočního studia mě náhle vytrhne hlasité #EMP *PRÁSK*#!, ohlušující #EMP *BUM*#! a draze znějící #EMP *TŘÍSK*#!. Co se to pro všechno na světě děje?!\n\nUkáže se, že původci toho rozruchu jsou dva sedláci. Jak se sem dostali, ví snad jen [ROOT.Char.GetFaith.HighGodName]! Teď hltají přímo ze sudu, v němž se uchovává univerzitní [ROOT.Char.Custom('GetExpensiveDrink_Singular')]!\n\n„Tohle je #EMP *škyt*#! naučí!“ vykřikne jeden z nich. „Jo! Myslej si, že jsou lepší než my, jen proto, že uměj #EMP číst!#!“ přisadí si druhý."
 bp2_adult_education.9100.read: "Ubozí nešťastníci... Postarám se, abyste se naučili číst!"
 bp2_adult_education.9100.a: "Hodilo by se mi pár sluhů na nošení knih..."
 bp2_adult_education.9100.b: "„Sedláci, přineste další poháry! Já dojdu pro ostatní studenty!“"
 bp2_adult_education.9100.c: "Raději upozorním učitele, než to tu celé zdemolují..."
 changed_my_life_opinion: "Změna mého života"
 bp2_adult_education.9200.t: "Svůdná přestávka"
 bp2_adult_education.9200.desc: "Knihovna je prázdná. Jsme tu jen já a [student_flirt.GetFirstName]. Už poněkolikáté čtu stejnou stránku knihy „[SCOPE.Custom('RandomInformativeTextName')]“, ale není to k ničemu. Nedokážu se soustředit.\n\nJak bych také [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')|l], když si [student_flirt.GetFirstNameNoTooltip] pořád jemně okusuje konec brku, zatímco prstem něžně přejíždí po [student_flirt.Custom('ObjectifiedFeature')]? A při tom všem se mi #EMP dívá přímo do očí#!!\n\n„Myslím, že si zasloužíme... přestávku, [Select_CString(ROOT.Char.IsFemale,'má','můj')] [ROOT.Char.Custom('RomanticComplimentNoun')]?“ ozve se tiché, smyslné zavzdychání."
 bp2_adult_education.9200.a: "Musím. Se. Soustředit. Na. Knihu."
 bp2_adult_education.9200.b: "„Co takhle si to rozdat na střeše univerzity?“"
 bp2_adult_education.9200.c: "Tak je čas na praktickou výuku anatomie!"
 bp2_adult_education.9200.d: "To nemá smysl... Potřebuji si odpočinout..."
 blew_off_some_steam_opinion: "Společné uvolnění napětí"
 bp2_adult_education.9300.t: "Výstřední nápady"
 bp2_adult_education.9300.desc: "„Poslouchej!“ vykřikne [eccentric_student.GetFirstName] s téměř šíleným výrazem. „Když čteš mezi řádky knihy „[SCOPE.Custom('RandomInformativeTextName')]“, je to naprosto jasné! Potřebuješ jen tři věci: [eccentric_student.Custom('ThrowableObjectArticle')], [eccentric_student.Custom('RandomWeirdObject')] a [eccentric_student.Custom('GetObjectToBalanceOnNose')]. Přitom se samozřejmě musíš řídit zásadami oboru „[eccentric_student.Custom('EruditeTopic')]“. Věř mi, #EMP bude to fungovat!#!“\n\nMožná nebyl nejlepší nápad, aby [eccentric_student.GetFirstNameNoTooltip] [Select_CString(eccentric_student.IsFemale,'studovala','studoval')] šestatřicet hodin v kuse..."
 bp2_adult_education.9300.eccentric: "Vždyť je to naprosto zřejmé!"
 bp2_adult_education.9300.a: "Na tyhle nesmysly nemám čas, [eccentric_student.Custom('CZ_FirstNameNoTooltip_V')]."
 bp2_adult_education.9300.b: "Povídej dál! Chci vědět #EMP úplně všechno!#!"
 bp2_adult_education.9300.c: "Já... raději půjdu."
 bp2_adult_education.9400.t: "Návštěva [local_ruler.Custom('CZ_TitleAsNameNoTooltip_G')]"
 bp2_adult_education.9400.desc: "„Pozor, studenti!“ zvolá [Select_CString(teacher.IsFemale,'naše učitelka','náš učitel')|l] [teacher.GetFirstName], zatímco do sálu vstupuje [local_ruler.GetTitledFirstName]. „[Select_CString(local_ruler.IsFemale,'Naše dobrodinka','Náš dobrodinec')|U] [local_ruler.GetTitledFirstNameNoTooltip] nám [Select_CString(local_ruler.IsFemale,'prokázala','prokázal')] čest svou návštěvou! [Select_CString(local_ruler.IsFemale,'Je vládkyní','Je vládcem')|U] těchto zemí, tak se chovejte slušně!“\n\n„Ach, vy právě debatujete na téma „[local_ruler.Custom('education_conversation_subject')]“? To mě osobně velice zajímá! Doufám, že vám studium jde dobře,“ pronese [local_ruler.GetTitleAsNameNoTooltip], zatímco [local_ruler.Custom('quirk_pos_pp')].\n\nMístní vládce má pravomoc udělovat studentům, jako jsem já, zvláštní privilegia. Možná bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] využít příležitosti a promluvit..."
 bp2_adult_education.9400.friend: "„[Select_CString(ROOT.Char.IsFemale,'Ráda','Rád')] tě zase vidím!“"
 bp2_adult_education.9400.liege: "„Ach, můj [Select_CString(ROOT.Char.IsFemale,'věrná poddaná','věrný poddaný')]. Připomeneš všem, kdo jsem?“"
 bp2_adult_education.9400.tier: "„Měli byste si vážit přítomnosti [root_scope.Custom('CZ_TitleAsNameNoTooltip_G')]!“"
 bp2_adult_education.9400.tier.toast: "[root_scope.GetTitleAsNameNoTooltip|U] navštíví tvou univerzitu"
 bp2_adult_education.9400.gold_lots: "„[Select_CString(ROOT.Char.IsFemale,'Ráda','Rád')] bych [Select_CString(ROOT.Char.IsFemale,'přispěla','přispěl')] štědrým darem!“"
 bp2_adult_education.9400.gold_lots.toast: "Univerzitní student věnoval velké množství zlata"
 bp2_adult_education.9400.drink: "„To je ale nuda. Raději vyrazím do města!“"
 bp2_adult_education.9400.gold: "„Přijměte, prosím, tento skromný dar.“"
 bp2_adult_education.9400.gold.toast: "Univerzitní student věnoval zlato"
 bp2_adult_education.9400.nothing: "„Jste vskutku [local_ruler.Custom('ComplimentAdjective')]!“"
