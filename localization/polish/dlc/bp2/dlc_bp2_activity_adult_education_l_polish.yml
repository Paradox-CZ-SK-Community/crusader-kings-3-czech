 bp2_adult_education.9000.t: "Hostující přednášející"
 bp2_adult_education.9000.desc: "„Studenti, dnes mezi námi přivítáme vzácného hosta!“ zvolá [Select_CString(teacher.IsFemale,'naše učitelka','náš učitel')|l] [teacher.GetFirstName]. „Přivítejme [guest_speaker.Custom('CZ_FullName_A')] – nejvyšší autoritu na [CZFaithAdjDecline(guest_speaker.GetFaith,'ou')|l] nauku v místě [location.GetName]!“\n\n„Zdravím vás,“ začne slavnostně [guest_speaker.GetFirstNameNoTooltip], zatímco [guest_speaker.Custom('quirk_pos_pp')]. „Dnes se budeme zabývat tématem „[guest_speaker.Custom('education_conversation_subject')]“ a tím, jak nám může pomoci pochopit, kým skutečně je [guest_speaker.GetFaith.HighGodName].“\n\nOstatní studenti se vzpřímí a vytáhnou brky. Tohle bude na dlouho."
 bp2_adult_education.9000.a: "Cože?! Vždyť to je kacířství!"
 bp2_adult_education.9000.a.success: "Rozdrtíš [guest_speaker.Custom('CZ_FirstNameNoTooltip_A')] pomocí #EMP faktů#! a #EMP logiky#!"
 bp2_adult_education.9000.a.failure: "Bez okolků tě vyvedou z přednáškového sálu"
