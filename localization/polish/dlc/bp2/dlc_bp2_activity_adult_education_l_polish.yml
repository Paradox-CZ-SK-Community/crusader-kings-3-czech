 bp2_adult_education.0005.t: "Zmařené naděje"
 bp2_adult_education.0005.desc: "Mé naděje a sny o osobním rozvoji se rozplynuly v prach.\n\nSedím ve své cele a můžu jen toužebně snít o všech těch vědomostech, které jsem [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')|l] získat. Studium bude muset počkat na jindy."
 bp2_adult_education.0005.a: "Brzy."
 bp2_adult_education.0009.t: "Závěr studia"
 bp2_adult_education.0009.desc: "To byl ale úžasný zážitek!\n\nKdyž jsem [Select_CString(ROOT.Char.IsFemale,'vyrážela','vyrážel')|l] na cestu, ani ve snu by mě nenapadlo, kolik moudrých hlav studuje v místě zvaném [province.GetName], jak hluboké jsou jejich myšlenky a jak rozsáhlý je jejich výzkum! Už jen pobyt mezi takovými učenci ze mě udělal lepšího člověka. S nově nabytými vědomostmi se teď můžu vrátit domů s pocitem opravdového uspokojení."
 bp2_adult_education.0009.desc_teacher_1: "\n\nBěhem pobytu jsme si však s [teacher_1.Custom('CZ_FirstName_I')] natolik padli do oka, že se mi ještě vůbec nechce loučit."
 bp2_adult_education.0009.desc_teacher_2: "\n\nNa druhou stranu je tu také [teacher_2.GetFirstName]. Společné hodiny ve mně zanechaly tak hluboký dojem, že bych v nich [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')|l] pokračovat."
 bp2_adult_education.0009.a: "Vědění je moc!"
 bp2_adult_education.0009.b: "Můj [ROOT.Char.Custom('GetCourt')|l] by uvítal někoho jako [teacher_1.Custom('CZ_FirstNameNoTooltip_A')]!"
 bp2_adult_education.0009.c: "[teacher_2.Custom('CZ_FirstNameNoTooltip_V')|U], mám se od tebe ještě tolik co učit!"
 bp2_adult_education.0009.d: "Místo učitele je mezi studenty."
 bp2_adult_education.0009.e: "Zůstaneme v kontaktu."
 imprisoned_adult_education: "[GetActivityType('activity_adult_education').GetName|U] přerušena uvězněním"
 imprisoned_adult_education_desc: "má [GetActivityType('activity_adult_education').GetName|l] byla přerušena, když mě [jailor.GetTitledFirstName] [Select_CString(jailor.IsFemale,'uvěznila','uvěznil')]"
 imprisoned_adult_education_desc_second_perspective: "tvá [GetActivityType('activity_adult_education').GetName|l] byla přerušena, když tě [jailor.GetTitledFirstName] [Select_CString(jailor.IsFemale,'uvěznila','uvěznil')]"
 imprisoned_adult_education_desc_third_perspective: "návštěva univerzity [owner.Custom('CZ_TitledFirstName_G')] byla přerušena, když [Select_CString(owner.IsFemale,'ji','ho')] [jailor.GetTitledFirstName] [Select_CString(jailor.IsFemale,'uvěznila','uvěznil')]"
 completed_adult_education: "[GetActivityType('activity_adult_education').GetName|U] dokončena"
 completed_adult_education_desc: "[Select_CString(ROOT.Char.IsFemale,'Dokončila','Dokončil')] jsem svou [CZActivity('activity_adult_education','A')|l] [CZPrepV(ROOT.Var('education_destination').GetProvince.GetNameNoTooltip)|l] [CZProvName(ROOT.Var('education_destination').GetProvince,'L')]"
 completed_adult_education_desc_second_perspective: "[Select_CString(ROOT.Char.IsFemale,'Dokončila','Dokončil')] jsi svou [CZActivity('activity_adult_education','A')|l] [CZPrepV(ROOT.Var('education_destination').GetProvince.GetNameNoTooltip)|l] [CZProvName(ROOT.Var('education_destination').GetProvince,'L')]"
 completed_adult_education_desc_third_perspective: "[owner.GetTitledFirstName|U] [Select_CString(owner.IsFemale,'dokončila','dokončil')] [CZActivity('activity_adult_education','A')|l] [CZPrepV(ROOT.Var('education_destination').GetProvince.GetNameNoTooltip)|l] [CZProvName(ROOT.Var('education_destination').GetProvince,'L')]"
 bp2_adult_education.0010.t: "Konečně na místě: [location.GetBaronyNameExplicitlyNoTooltip]"
 bp2_adult_education.0010.desc_uni: "Konečně jsem tady! [location.GetBaronyNameExplicitly|U] je sídlem proslulé univerzity a já právě stojím před jejími branami.\n\nZa těmito posvátnými zdmi se shromažďují vědomosti celého světa. V těchto chodbách se setkávají proslulí učenci ze všech koutů země, aby uchovávali a rozšiřovali skutečné bohatství moudrosti. A brzy se k nim připojím i já!"
 bp2_adult_education.0010.desc_religious: "Konečně jsem tady! [location.GetBaronyNameExplicitly|U] je pro [CZFaithAdjDecline(location.GetCounty.GetFaith,'ý')|l] svět uctívaným centrem vzdělanosti a já právě procházím jeho posvátnými síněmi.\n\nTolik se toho můžu naučit od svatých mužů a žen, kteří se scházejí mezi těmito ctihodnými zdmi! A co teprve všechny ty starobylé svitky a knihy?"
 bp2_adult_education.0010.desc_end: "\n\nVelká kulturní centra jsou samozřejmě také rušnými tržišti a nabízejí všechna možná #EMP rozptýlení#!, po kterých může studentské srdce zatoužit..."
 bp2_adult_education.0010.desc_very_very_far: "\n\nZatímco přemýšlím o všech možnostech, místní si mě prohlížejí se směsicí zvědavosti a údivu. Je jasné, že [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] tu nejsou právě každodenními návštěvníky!"
 bp2_adult_education.0010.a: "Je čas pustit se do studia."
 bp2_adult_education.1000.t: "Učená rozprava"
 bp2_adult_education.1000.desc: "[location.GetBaronyNameExplicitly|U] bývá častým dějištěm vášnivých debat mezi učiteli a studenty. Po obzvlášť podnětné přednášce [Select_CString(teacher.IsFemale,'naší učitelky','našeho učitele')|l] [teacher.Custom('CZ_TitledFirstName_G')] se najednou zapletu do jedné takové rozpravy [Select_CString(student.IsFemale,'s další studující','s dalším studujícím')|l], [student.Custom('CZ_FirstName_I')].\n\n„NE! To vůbec nedává smysl! Úplně překrucuješ, co chtěl Filozof říct!“ vykřiknu.\n\n„#EMP Ty#! jsi úplně mimo!“ vypálí na oplátku [student.GetFirstName].\n\nKoutkem oka zahlédnu [teacher.Custom('CZ_FirstNameNoTooltip_A')], jak nás pozoruje se zamyšleným výrazem."
 bp2_adult_education.1000.a: "Ale jak pravil Mistr..."
 bp2_adult_education.1000.a.tt: "Cituješ klasická díla"
 bp2_adult_education.1000.b: "Já pravdu mám, tvůj výklad je jen klam!"
 bp2_adult_education.1000.b.tt: "Pokusíš se [Select_CString(student.IsFemale,'ji','ho')] zmást provokativními rýmy"
 bp2_adult_education.1000.b.success: "[student.GetFirstNameNoTooltip|U] [Select_CString(student.IsFemale,'zůstala','zůstal')] beze slov"
 bp2_adult_education.1000.b.success.tt: "Podařilo se ti přelstít [student.Custom('CZ_FirstNameNoTooltip_A')]"
 bp2_adult_education.1000.b.failure: "[student.GetFirstNameNoTooltip|U] se [Select_CString(student.IsFemale,'nenechala','nenechal')] zviklat"
 bp2_adult_education.1000.b.failure.tt: "Nepodařilo se ti přesvědčit [student.Custom('CZ_FirstNameNoTooltip_A')]"
 bp2_adult_education.1000.c: "Nechám to být. Mám ještě spoustu knih ke čtení."
 bp2_adult_education.1000.a.success: "[student.GetFirstNameNoTooltip|U] [Select_CString(student.IsFemale,'je přesvědčena','je přesvědčen')]"
 bp2_adult_education.1000.a.success.tt: "Podařilo se ti přesvědčit [student.Custom('CZ_FirstNameNoTooltip_A')]"
 bp2_adult_education.1000.a.failure: "Uznáváš, že [student.GetFirstNameNoTooltip] má pravdu"
 bp2_adult_education.1000.a.failure.tt: "[student.GetFirstNameNoTooltip|U] tě [Select_CString(student.IsFemale,'překonala','překonal')] v debatě"
 university_debate_won_log: "[CHARACTER.GetTitledFirstName|U] [Select_CString(CHARACTER.IsFemale,'přelstila','přelstil')] [TARGET_CHARACTER.Custom('CZ_TitledFirstName_A')] v učené debatě"
 university_debate_won_log_title: "Vítězství v učené debatě"
 bp2_adult_education.1010.t: "Jazyk lidu"
 bp2_adult_education.1010.desc: "Studium mi jde dobře, ale přesto se nedokážu zbavit pocitu, že jsem od místního společenství poněkud odtržen. [location.GetBaronyNameExplicitly|U] je pro mě stále cizím místem.\n\nJsem [Select_CString(ROOT.Char.IsFemale,'cizinkou','cizincem')] v cizí zemi a zdejší jazyk, [location.GetCounty.GetCulture.GetLanguage.GetName], kterým se mluví v městských krčmách a na tržištích, mi připadá exotický a tajemný. I mezi mými spolužáky a učiteli se mnozí narodili a vyrostli právě tady. Kdybych s nimi [Select_CString(ROOT.Char.IsFemale,'dokázala','dokázal')] sdílet vědomosti přímo v jejich jazyce, nepochybně by to mému studiu prospělo."
 learned_language_of_uni_log: "[CHARACTER.GetTitledFirstName|U] [Select_CString(CHARACTER.IsFemale,'se naučila','se naučil')] jazyk, kterým se mluví na univerzitě"
 learned_language_of_uni_log_title: "Osvojení univerzitního jazyka"
 bp2_adult_education.1010.a: "Musím se pilně učit, abych mezi ně [Select_CString(ROOT.Char.IsFemale,'zapadla','zapadl')]!"
 bp2_adult_education.1010.b: "Mou učitelkou se stane poezie!"
 bp2_adult_education.1010.c: "Tímhle se nesmím nechat rozptylovat."
 bp2_adult_education.1010.d: "Kdo mě to naučí lépe než sami místní?"
 bp2_adult_education.1010.d.tt: "Pokoušíš se pochytit místní jazyk v nevěstincích, krčmách a na tržištích."
 bp2_adult_education.1010.b.success: "Ovládneš místní jazyk"
 bp2_adult_education.1010.b.success.tt: "Osvojíš si místní jazyk"
 bp2_adult_education.1010.b.failure: "Místnímu jazyku stále nerozumíš"
 bp2_adult_education.1010.b.failure.tt: "Místní jazyk pro tebe zůstává záhadou!"
 bp2_adult_education.1011.t: "Jazyk vzdělanců"
 bp2_adult_education.1011.desc: "Na univerzitách a v náboženských centrech se scházejí lidé ze všech koutů známého světa, aby získávali a sdíleli vědomosti. To je však možné jen díky společnému jazyku, zpravidla nějaké starobylé liturgické řeči, které tradice propůjčila nezpochybnitelnou autoritu.\n\nBohužel jazyk zdejších vzdělanců příliš neovládám. [location.GetBaronyNameExplicitly|U] je proto pro mě mnohem náročnějším místem ke studiu, než by muselo být.\n\nNaučit se takový jazyk nebude snadné, ale není právě překonávání podobných překážek samotnou podstatou vyššího vzdělání?"
 learned_language_of_lithurgy_log: "[CHARACTER.GetTitledFirstName|U] [Select_CString(CHARACTER.IsFemale,'se naučila','se naučil')] liturgický jazyk používaný na univerzitě"
 learned_language_of_lithurgy_log_title: "Osvojení liturgického jazyka"
 bp2_adult_education.1011.a: "Je čas zabořit nos do knih."
 bp2_adult_education.1011.b: "Přednášky mi bohatě postačí."
 bp2_adult_education.1011.b.failure: "Samotné přednášky nestačí"
 bp2_adult_education.1011.b.tt: "Alespoň ti zbyl volný čas na vlastní zájmy"
 bp2_adult_education.1011.d: "Naučí mě to samotní mistři!"
 bp2_adult_education.1011.d.success: "Ovládneš liturgický jazyk"
 bp2_adult_education.1011.d.success.tt: "Osvojíš si liturgický jazyk"
 bp2_adult_education.1011.d.failure: "Uděláš ze sebe hlupáka"
 bp2_adult_education.1011.d.failure.tt: "Liturgický jazyk se ti nepodařilo naučit"
 bp2_adult_education.1012.t: "Jazyk mistra"
 bp2_adult_education.1012.desc: "[teacher.GetFirstName|U] patří mezi nejuznávanější učitele v místě zvaném [location.GetBaronyNameExplicitly], ale je očividně odjinud. Přízvuk a vystupování jasně prozrazují [teacher.GetCulture.Custom('CZ_Adjective_yy')|l] původ.\n\nPro samotné studium to sice není nezbytné, ale kdybych se [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] rodný jazyk [Select_CString(teacher.IsFemale,'této učitelky','tohoto učitele')|l], [Select_CString(And(ROOT.Char.IsFemale,teacher.IsFemale),'mohly','mohli')|l] bychom navázat mnohem bližší vztah. To by se mi v budoucnu jistě vyplatilo."
 learned_language_of_teacher_log: "[CHARACTER.GetTitledFirstName|U] [Select_CString(CHARACTER.IsFemale,'se naučila','se naučil')] jazyk jednoho z univerzitních učitelů"
