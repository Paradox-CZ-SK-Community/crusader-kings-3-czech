 activity_adult_education_desc: "Strav semestr v proslulém středisku vzdělanosti, kde se můžeš učit od nejmoudřejších hlav široko daleko.\n\nJe to příležitost doplnit mezery ve vzdělání z mládí, ale také všestranně se zdokonalit, rozvíjet své dovednosti, osvojit si nové schopnosti a navázat důležité kontakty."
 activity_adult_education_host_desc: "$BULLET_WITH_TAB$Můžeš si vylepšit [Concept('education_trait','rys vzdělání')|E]\n$BULLET_WITH_TAB$Můžeš získat body [Concept('skill','dovedností')|E]\n$BULLET_WITH_TAB$Můžeš získat [Concept('lifestyle_experience','zkušenosti životního stylu')|E]\n$BULLET_WITH_TAB$Můžeš získat [Concept('lifestyle_traits','rysy životního stylu')|E]\n$BULLET_WITH_TAB$Můžeš získat knižní [Concept('artifacts','artefakty')|E]\n$BULLET_WITH_TAB$Můžeš naverbovat postavu s vysokými dovednostmi\n$BULLET_WITH_TAB$Získáš [Concept('trait_level_track_xp','zkušenosti rysu')|E] [GetTrait('confucian_education').GetName( GetNullCharacter )] na [CZReligionAdjDecline(GetReligionByKey('confucianism_religion'),'ých')|l] univerzitách"
