 bp2_adult_education.1012.a: "S magistrem si budeme mnohem bližší!"
 bp2_adult_education.1012.b: "Budu potřebovat někoho, kdo mi pomůže..."
 bp2_adult_education.1012.b.tt: "Se správnými známostmi je možné všechno!"
