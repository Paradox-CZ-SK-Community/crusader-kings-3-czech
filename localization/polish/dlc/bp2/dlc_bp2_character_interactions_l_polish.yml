l_polish:

 influence_child_personality_interaction: "Ovlivnit osobnost svěřence"
 influence_child_personality_interaction_desc: "Předej svému [Concept('ward','svěřenci')|E] určitý [Concept('personality_trait','osobnostní rys')|E]"
 had_guardian_influence_interaction: "Tato interakce již proběhla dne [DATE.GetStringLong]"
 bp2_character_interaction.1001.t: "$influence_child_personality_interaction$: [target_trait.GetNameNoTooltip(GetPlayer)] – Úspěch"
 bp2_character_interaction.1001.desc_intro: "Vyhledám [recipient.Custom('CZ_FirstName_A')]. [Select_CString(recipient.IsFemale,'Je to má','Je to můj')] [ROOT.Char.Custom2('RelationToMeShort', recipient)]. Přistoupím blíž "
 bp2_character_interaction.desc_lustful: "s otázkou: „Poznal[Select_CString(recipient.IsFemale,'a','')] jsi už lásku?“\n\n„Ano,“ odpoví [recipient.GetFirstNameNoTooltip] nesměle. „Miluji svou rodinu! A... no... je tu někdo, na koho musím pořád myslet...“\n\n„Jdi za tím pocitem, [recipient.Custom('GirlBoy')|l]. Romantika a uspokojení nepřijdou samy od sebe. Musíš o ně usilovat! Neboj se následovat své touhy, vždyť jsou přirozenou součástí lidského života.“\n\n"
 bp2_character_interaction.1001.desc_lustful: "$bp2_character_interaction.desc_lustful$„To zní dobře,“ zasměje se [recipient.GetFirstNameNoTooltip]. „Třeba jednou políbím úplně všechny v celém [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]!“"
 bp2_character_interaction.desc_chaste: "s otázkou: „Rozhořelo se ti někdy srdce touhou při pohledu na někoho jiného?“\n\n„Ano...“ odpoví [recipient.GetFirstNameNoTooltip] váhavě. „Někdy.“\n\n„Takový plamen musíš uhasit! V srdci ti plane oheň, jaký rozdmýchává [ROOT.Char.GetFaith.NegativeAfterLife]. Myslíš, že ti [ROOT.Char.GetFaith.FertilityGodName] požehná, když se oddáváš hanebným touhám? Nikdy! Pamatuj, [recipient.Custom('GirlBoy')|l], že chtíč vede do záhuby.“\n\n"
 bp2_character_interaction.1001.desc_chaste: "$bp2_character_interaction.desc_chaste$„Přísahám,“ zaníceně prohlásí [recipient.GetFirstNameNoTooltip], „že se budu tělesných rozkoší štítit!“"
 bp2_character_interaction.desc_gluttonous_common: "a všimnu si mastné tváře s provinilým výrazem. „Co jsi to [Select_CString(recipient.IsFemale,'jedla','jedl')]...?“ zeptám se.\n\n„Jé! A co tady dělá [recipient.Custom('GetLocalStreetFood')]?“\n\n"
 bp2_character_interaction.desc_gluttonous: "$bp2_character_interaction.desc_gluttonous_common$„Přineslo ti služebnictvo ještě něco?“ zazubím se. „Mám #EMP ukrutný hlad!#!“\n\nKdyž se společně pustíme do jídla, povzbuzuji [recipient.Custom('CZ_FirstName_A')], aby se pořádně [Select_CString(recipient.IsFemale,'najedla','najedl')] a [Select_CString(recipient.IsFemale,'vyrostla','vyrostl')] do síly. „Za své sny a touhy se nemusíš stydět! Vychutnávej si všechno, co ti dvůr nabízí.“\n\n"
 bp2_character_interaction.1001.desc_gluttonous: "$bp2_character_interaction.desc_gluttonous$„S radostí!“ odpoví [recipient.GetFirstNameNoTooltip] a hlasitě si říhne."
 bp2_character_interaction.desc_temperate: "$bp2_character_interaction.desc_gluttonous_common$„Takže [recipient.Custom('GetLocalStreetFood')]!“ vyhrknu. Okamžitě dítěti pochoutku vytrhnu z ruky a zahodím ji pryč. „To nemáš #EMP ani špetku trpělivosti?! Žádné sebeovládání?#! Přísahej, že se budeš ve všem mírnit, [recipient.Custom('GirlBoy')|l]. Ať je svědkem tvé zdrženlivosti [ROOT.Char.GetFaith.HealthGodName]! Svět nepotřebuje dalšího zvrhlíka.“\n\n"
 bp2_character_interaction.1001.desc_temperate: "$bp2_character_interaction.desc_temperate$„Přísahám,“ pronese [recipient.GetFirstNameNoTooltip] vážně. „[recipient.Custom2('RelationToMeShort', ROOT.Char)|U], tolik se stydím...“"
 bp2_character_interaction.desc_greedy_common: "a spatřím, jak [recipient.GetFirstNameNoTooltip] mává lukem a vykřikuje jméno jiného mladíka.\n\n„Jeden z panošů! [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|U] ho mají ve službách!“ rozčiluje se [recipient.GetFirstNameNoTooltip]. „Za to, že žebral o něco, co patří mně, mu prostřelím hrdlo!“\n\n"
 bp2_character_interaction.desc_greedy: "$bp2_character_interaction.desc_greedy_common$„Uklidni se. Kdo jedná s rozvahou, ten na tom vydělá. Ano, všichni budou žebrat, ale jakmile zjistí, že si svůj majetek dokážeš ochránit, přestanou. Z kamene krev nevyždímáš! Nikomu nedávej ani krev, ani zlato, [recipient.GetFirstNameNoTooltip].“\n\n"
 bp2_character_interaction.1001.desc_greedy: "$bp2_character_interaction.desc_greedy$„Anebo,“ zamyslí se [recipient.GetFirstNameNoTooltip], „bychom mohli uzavřít obchod... #EMP opravdu#! výhodný obchod...“"
 bp2_character_interaction.desc_generous: "$bp2_character_interaction.desc_greedy_common$„Kolik hádek vzniká kvůli naprostým maličkostem? Odlož ten luk, [recipient.Custom('GirlBoy')|l]. Nikdy nemůžeš ztratit nic cennějšího než svou čest. A pokud budeš jednat moudře, i věci, které daruješ ostatním, ti nakonec přinesou užitek.“\n\n"
 bp2_character_interaction.1001.desc_generous: "$bp2_character_interaction.desc_generous$„Když ty žiješ pro mě,“ povzdechne si [recipient.GetFirstNameNoTooltip], „mohu se já pokusit žít pro ostatní.“"
 bp2_character_interaction.desc_lazy_common: "a zeptám se: „Když tě zavolám, abys mi [Select_CString(recipient.IsFemale,'posloužila','posloužil')], plníš své povinnosti svědomitě?“\n\n„Já... snažím se ze všech sil, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')].“\n\n"
 bp2_character_interaction.desc_lazy: "$bp2_character_interaction.desc_lazy_common$„Po pravdě... splnit očekávání bez námahy je stejně dobré jako je překonat,“ povím a rozcuchám [recipient.Custom('CZ_FirstName_D')] vlasy. „Ať se budeš snažit jakkoli, nakonec z tebe vyroste právě takový člověk, jakým se máš stát. Proč se vůbec obtěžovat celým tím divadlem kolem služby? Raději si častěji zdřímni.“\n\n"
 bp2_character_interaction.1001.desc_lazy: "$bp2_character_interaction.desc_lazy$[recipient.GetFirstNameNoTooltip|U] drobně zívne a přikývne. „Ale jistě!“"
 bp2_character_interaction.desc_diligent: "$bp2_character_interaction.desc_lazy_common$„Ze všech sil? Ještě od tebe neočekávám žádné mistrovství, [recipient.Custom('GirlBoy')|l]. Očekávám vytrvalost. Necítíš snad radost ze hry, když máš za sebou dobře vykonanou práci? Přestaň pochybovat a přemýšlet. Jednej! Prostě něco udělej!“\n\n"
 bp2_character_interaction.1001.desc_diligent: "$bp2_character_interaction.desc_diligent$[recipient.GetFirstNameNoTooltip|U] vyskočí na nohy. „Nezklamu tě, [recipient.Custom2('RelationToMeShort', ROOT.Char)]!“"
 bp2_character_interaction.desc_wrathful_common: "s otázkou: „Co je to moc?“\n\n"
 bp2_character_interaction.desc_wrathful: "$bp2_character_interaction.desc_wrathful_common$V očích [recipient.Custom('CZ_FirstName_G')] se mihne drobný plamínek, když začnu odpovídat. „Moc znamená svobodu projevit svůj hněv. Svobodu srazit k zemi a ponížit každého, kdo tě rozzuří.“\n\n„Třeba když mi nějaká [Select_CString(recipient.IsFemale,'hloupá holka roztrhala','hloupý kluk roztrhal')] plášť! Nikdy v životě jsem necítil[Select_CString(recipient.IsFemale,'a','')] takový vztek!“ rozčiluje se [recipient.GetFirstNameNoTooltip] a já nadšeně souhlasím.\n\n"
 bp2_character_interaction.1001.desc_wrathful: "$bp2_character_interaction.desc_wrathful$„Jen počkejte!“ vykřikne [recipient.GetFirstNameNoTooltip]. „Ti hlupáci ještě poznají, že #EMP chrlím oheň#!!“"
 bp2_character_interaction.desc_calm: "$bp2_character_interaction.desc_wrathful_common$„[ROOT.Char.Custom('KnightCulturePluralNoTooltip')|U] a šlechtici, kteří plní tvé rozkazy? Dnes jsem [Select_CString(recipient.IsFemale,'přišla','přišel')] o svou oblíbenou věc, [recipient.Custom('GetAccessory')|l], a nikoho to nezajímá...“\n\n„Skutečná moc začíná mocí nad sebou samým,“ vysvětluji. „Když hledáš viníky v ostatních, rozčiluješ se a útočíš kolem sebe, jen tím zaháníš pocit bezmoci a vlastní pošetilosti. Místo toho se zhluboka nadechni a zachovej si jasný úsudek.“\n\n"
 bp2_character_interaction.1001.desc_calm: "$bp2_character_interaction.desc_calm$Po chvíli ticha si [recipient.GetFirstName] povzdechne. „Pokusím se.“"
 bp2_character_interaction.desc_impatient_common: "a vložím [recipient.Custom('CZ_FirstName_D')] do dlaně vejce. „Podrž ho. Vrátím se.“\n\nOdejdu a věnuji se svým běžným povinnostem. Když se po několika hodinách vrátím, [recipient.GetFirstNameNoTooltip] stále sedí na téže lavici, trochu shrbeně, s vejcem v ruce.\n\n"
 bp2_character_interaction.desc_impatient: "$bp2_character_interaction.desc_impatient_common$Prudce plesknu do dlaně s vejcem, až skořápka praskne. Ruku okamžitě pokryje slizká hmota a tvář [recipient.Custom('CZ_FirstName_G')] výraz naprostého šoku!\n\n„Promarnil[Select_CString(recipient.IsFemale,'a','')] jsi celý den, [recipient.Custom('GirlBoy')|l]...“ poznamenám a pomalu odcházím.\n\n"
 bp2_character_interaction.1001.desc_impatient: "$bp2_character_interaction.desc_impatient$„Už na tebe nikdy čekat nebudu!“ zařve [recipient.GetFirstNameNoTooltip]. „#EMP Přísahám!#!“"
 bp2_character_interaction.desc_patient: "$bp2_character_interaction.desc_impatient_common$Vezmu [recipient.Custom('CZ_FirstName_D')] vejce z ruky a obejmu dítě kolem ramen. „Jsem na tebe tak [Select_CString(ROOT.Char.IsFemale,'hrdá','hrdý')]. Jak slepice pečuje o nový život? Jak ostražitý kohout chrání své družky? Odpovědí je trpělivost.“\n\n"
 bp2_character_interaction.1001.desc_patient: "$bp2_character_interaction.desc_patient$[recipient.GetFirstNameNoTooltip|U] se usměje. „Bylo příjemné mít čas přemýšlet.“"
 bp2_character_interaction.desc_arrogant_common: "a blahopřeji [recipient.Custom('CZ_FirstName_D')] k vítězství nad jedním z vychovatelů ve hře [SCOPE.Custom('BG_GameType_Generic')|l].\n\n„To nic nebylo,“ odpoví [recipient.GetFirstNameNoTooltip]. „Vlastně jsem [Select_CString(recipient.IsFemale,'porazila','porazil')] skoro všechny dospělé, se kterými jsem [Select_CString(recipient.IsFemale,'hrála','hrál')]!“\n\n"
 bp2_character_interaction.desc_arrogant: "$bp2_character_interaction.desc_arrogant_common$„Výborně. Víš, [recipient.Custom('GirlBoy')|l], to proto, že tě čeká velkolepý osud. Neboj se vlastní hrdosti. Jen zbabělci nevěří ve své schopnosti! Ukaž všem bez rozdílu, kdo skutečně jsi, a oni tě podle toho budou ctít!“\n\n"
 bp2_character_interaction.1001.desc_arrogant: "$bp2_character_interaction.desc_arrogant$„Ha!“ ušklíbne se [recipient.GetFirstNameNoTooltip]. „Snad mi trochu nezávidíš?“"
 bp2_character_interaction.desc_humble: "$bp2_character_interaction.desc_arrogant_common$„A co kdybys [Select_CString(recipient.IsFemale,'vyzvala','vyzval')]... mě? Pozveme celé [ROOT.Char.GetPrimaryTitle.GetTierAsName]!“ předstírám nadšení, zatímco [recipient.GetFirstNameNoTooltip] se přikrčí a začne protestovat.\n\n„Musíme si dávat pozor,“ pokračuji, „aby nás vlastní přednosti neopily natolik, že začneme ostatní přehlížet a přeceňovat sami sebe.“\n\n"
 bp2_character_interaction.1001.desc_humble: "$bp2_character_interaction.desc_humble$„Prosím!“ žadoní [recipient.GetFirstNameNoTooltip]. „Odpusť mi!“"
 bp2_character_interaction.desc_deceitful_common: "s otázkou: „Lžeš mi?“\n\n„Já... ehm... nikdy!“\n\n"
 bp2_character_interaction.desc_deceitful: "$bp2_character_interaction.desc_deceitful_common$„Vždyť lžeš právě teď,“ zasměji se. „A dost špatně. Kdy už se naučíš lhát nenápadně, zato vytrvale, a každou lež ochutit trochou sladké pravdy? Chceš se stát [Select_CString(recipient.IsFemale,'významnou ženou','významným mužem')]? Svět je jedno velké zmijí hnízdo a jen ti nejprohnanější se dokážou vyšvihnout na vrchol.“\n\n"
 bp2_character_interaction.1001.desc_deceitful: "$bp2_character_interaction.desc_deceitful$„Ach, [recipient.Custom2('RelationToMeShort', ROOT.Char)]! Ty jsi můj nejoblíbenější had,“ zalže [recipient.GetFirstNameNoTooltip]."
 bp2_character_interaction.desc_honest: "$bp2_character_interaction.desc_deceitful_common$„Možná. To ale nemohu vědět,“ vysvětluji. „Copak však nedokážeš lež #EMP vycítit#!, [Select_CString(recipient.IsFemale,'děvče','chlapče')]? Lhář je člověk beze cti, kterému nezáleží na následcích jeho nepravd. Opravdu chceš být takovým člověkem?“\n\n"
 bp2_character_interaction.1001.desc_honest: "$bp2_character_interaction.desc_honest$„No... už jsem někdy [Select_CString(recipient.IsFemale,'lhaní podlehla','lhaní podlehl')],“ přizná [recipient.GetFirstNameNoTooltip]. „Ale chci být jako ty, [recipient.Custom2('RelationToMeShort', ROOT.Char)]. [Select_CString(recipient.IsFemale,'Dobrá a pravdomluvná','Dobrý a pravdomluvný')]!“"
 bp2_character_interaction.desc_craven_common: "a popadnu dítě za límec. Skrz zaťaté zuby procedím: #EMP „Udeř mě!“#!\n\n[recipient.GetFirstNameNoTooltip|U] se vyděsí a začne protestovat. „Ale vždyť jsi [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]!“\n\n"
 bp2_character_interaction.desc_craven: "$bp2_character_interaction.desc_craven_common$„To skutečně jsem, [Select_CString(recipient.IsFemale,'děvče','chlapče')]. Vztáhnout na mě ruku znamená vystavit se strašlivému trestu. Dobře si to zapamatuj. Povinnost i vášeň tě mohou přivést do záhuby. Je lepší přežít než zemřít kvůli nějakému bláznovství!“\n\n"
 bp2_character_interaction.1001.desc_craven: "$bp2_character_interaction.desc_craven$[recipient.GetFirstNameNoTooltip|U] se přede mnou poníženě krčí. „Prosím, neubližuj mi!“ žadoní."
 bp2_character_interaction.desc_brave: "$bp2_character_interaction.desc_craven_common$„Tak do toho!“ naléhám, dokud mě skutečně nezasáhne rána do rozesmáté tváře.\n\n„Ničeho se neboj, [Select_CString(recipient.IsFemale,'děvče','chlapče')]! Když dokážeš udeřit dokonce mě, co potom #EMP nedokážeš#!? Zkoušej to, usiluj o své cíle, třeba i selhávej! A když už máš zemřít, pak pro čest, lásku nebo povinnost. Cokoli je lepší než skonat po životě, který neměl žádný smysl!“\n\n"
 bp2_character_interaction.1001.desc_brave_self: "$bp2_character_interaction.desc_brave$„[recipient.GetFaith.HighGodName|U] a [recipient.GetPrimaryTitle.GetNameNoTier]!“ vykřikne [recipient.GetFirstNameNoTooltip]. „Neselžu!“"
 bp2_character_interaction.1001.desc_brave_liege: "$bp2_character_interaction.desc_brave$„[recipient.GetFaith.HighGodName|U] a [recipient.GetLiege.GetPrimaryTitle.GetNameNoTier]!“ vykřikne [recipient.GetFirstNameNoTooltip]. „Neselžu!“"
 bp2_character_interaction.1001.desc_brave_root: "$bp2_character_interaction.desc_brave$„[recipient.GetFaith.HighGodName|U] a [ROOT.Char.GetPrimaryTitle.GetNameNoTier]!“ vykřikne [recipient.GetFirstNameNoTooltip]. „Neselžu!“"
 bp2_character_interaction.desc_shy_common: "a zastihnu dítě, jak si zase hraje o samotě. V poslední době se to stává poměrně často. Zeptám se: „Proč si nehraješ s ostatními?“\n\n„A jaký by to mělo smysl, [recipient.Custom2('RelationToMeShort', ROOT.Char)]? Všechno to chichotání a klevetění... Jen ztráta času.“\n\n"
 bp2_character_interaction.desc_shy: "$bp2_character_interaction.desc_shy_common$„Obávám se, že to se nikdy nezmění,“ povzdechnu si. „Lidé tě budou vždycky přemlouvat, abys s nimi trávil[Select_CString(recipient.IsFemale,'a','')] čas, abys byl[Select_CString(recipient.IsFemale,'a','')] jen veřejnou tváří bez vlastního soukromí. Nepodléhej jim. I samota má své půvaby.“\n\n"
 bp2_character_interaction.1001.desc_shy: "$bp2_character_interaction.desc_shy$[recipient.GetFirstNameNoTooltip|U] tiše přitaká, ale vyhýbá se mému pohledu."
 bp2_character_interaction.desc_gregarious: "$bp2_character_interaction.desc_shy_common$„Jen se zamysli,“ odpovím. „Kolik krásných vzpomínek máš na chvíle strávené o samotě? A kde bys našel[Select_CString(recipient.IsFemale,'našla','')] vzrušení, vřelost a lásku? Jestli chceš, naučím tě vyprávět příběhy a vtipkovat. Pak budeš mít všechno to chichotání a klevetění pevně v rukou!“\n\n"
 bp2_character_interaction.1001.desc_gregarious: "$bp2_character_interaction.desc_gregarious$„Tak dobře,“ usměje se [recipient.GetFirstNameNoTooltip]. „Nauč mě to.“"
 bp2_character_interaction.desc_ambitious_common: "s otázkou: „Líbí se ti být dítětem?“\n\n„Ne,“ ohrne [recipient.GetFirstNameNoTooltip] nos. „Dospělí se mnou zacházejí jako se psem! Pořád mi jen rozkazují, co mám dělat!“\n\n"
 bp2_character_interaction.desc_ambitious: "$bp2_character_interaction.desc_ambitious_common$„Tak jim ukaž, jak se mýlí! Projev nadšení a snaž se dokázat víc, než dokážeš dnes. Ledaže... #EMP chceš#!, aby tebou lidé pohrdali jako malým dítětem, i když už ti tělo začne chřadnout stářím?“\n\n"
 bp2_character_interaction.1001.desc_ambitious: "$bp2_character_interaction.desc_ambitious$„Ne! Je toho ještě tolik, co musím vykonat,“ odpoví [recipient.GetFirstNameNoTooltip]. „Jen počkejte! Jednou budou všichni vzhlížet k mému vedení!“"
 bp2_character_interaction.desc_content: "$bp2_character_interaction.desc_ambitious_common$„Ale,“ namítnu, „opravdu chceš řešit majetkové spory, počítat daně a nést neustálou odpovědnost za všechny, které miluješ? Brzy už ti na hraní nezbude čas. Užívej si toho, co máš, [Select_CString(recipient.IsFemale,'děvče','chlapče')]. Važ si toho ze všech sil.“\n\n"
 bp2_character_interaction.1001.desc_content: "$bp2_character_interaction.desc_content$„Jsem [Select_CString(recipient.IsFemale,'vděčná','vděčný')]! Opravdu! Za všechen ten čas, který s tebou mohu trávit, [recipient.Custom2('RelationToMeShort', ROOT.Char)],“ rozzáří se [recipient.GetFirstNameNoTooltip]."
 bp2_character_interaction.desc_arbitrary_common: "a přinesu oblíbenou hračku jiného dítěte. Je to [recipient.Custom('child_favorite_toy')|l]. „Tohle můžeš mít,“ prohlásím.\n\n„Proč?“ podiví se [recipient.GetFirstNameNoTooltip]. „Vždyť to ani nechci.“\n\n"
 bp2_character_interaction.desc_arbitrary: "$bp2_character_interaction.desc_arbitrary_common$„Tak ji zahoď! Je to jen symbol, [Select_CString(recipient.IsFemale,'děvče','chlapče')]. Řiď se pouze vlastními pocity a úsudkem. Nedbej na pravidla ani zákony a získáš svobodu dělat si, co chceš. Můžeš mít všechno, po čem zatoužíš.“\n\n"
 bp2_character_interaction.1001.desc_arbitrary: "$bp2_character_interaction.desc_arbitrary$„Ano,“ přisvědčí [recipient.GetFirstNameNoTooltip] a vezme si hračku. „Proč bych se měl[Select_CString(recipient.IsFemale,'a','')] snažit být [Select_CString(recipient.IsFemale,'spravedlivá','spravedlivý')] v nespravedlivém světě?“"
 bp2_character_interaction.desc_just: "$bp2_character_interaction.desc_arbitrary_common$„Ne? A proč ne? Je přece přirozené toužit po tom, co ti nepatří, a radovat se z toho, když někoho překonáš. Proč si tedy nevzít všechno, co můžeš, a nenechat mě, abych svou moc používal[Select_CString(ROOT.Char.IsFemale,'a','')] podle libosti?“\n\n"
 bp2_character_interaction.1001.desc_just: "$bp2_character_interaction.desc_just$„Nebuď [Select_CString(ROOT.Char.IsFemale,'tyrankou','tyranem')], [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]! To přece není správné!“\n\n„Přesně tak,“ usměji se. „Je to nespravedlivé.“"
 bp2_character_interaction.desc_cynical_common: "s otázkou: „Proč je [recipient.GetFaith.GetName] naší vírou?“\n\n„Protože [ROOT.Char.GetFaith.HighGodName] koná dobro,“ odříká [recipient.GetFirstNameNoTooltip].\n\n"
 bp2_character_interaction.desc_cynical: "$bp2_character_interaction.desc_cynical_common$„Nejen dobro, ale také #EMP projevuje moc#!. [ROOT.Char.GetFaith.HighGodName|U] udržuje pořádek v [recipient.GetFaith.Custom('CZ_AdjectiveNoTooltip_yych')|l] zemích. A dovoláváním se posvátna mohou [ROOT.Char.GetFaith.AltPriestTermPlural|l] napodobovat panovníky, zatímco [ROOT.Char.GetFaith.DevoteeNeuterPlural|l] mohou usilovat o světský prospěch. Vidíš za tím skutečné božské působení? Jedná tak [ROOT.Char.GetFaith.HighGodName], nebo je to všechno jen lidská vypočítavost?“\n\n"
 bp2_character_interaction.1001.desc_cynical: "$bp2_character_interaction.desc_cynical$„Vidím...“ odpoví [recipient.GetFirstNameNoTooltip] s námahou. „Smutný svět.“"
 bp2_character_interaction.desc_zealous: "$bp2_character_interaction.desc_cynical_common$„Ano. Tvá dobrota je [ROOT.Char.GetFaith.HighGodNamePossessive] dar. Tvá moudrost je [ROOT.Char.GetFaith.KnowledgeGodNamePossessive] dar a tvá odvaha je [ROOT.Char.GetFaith.WarGodNamePossessive] dar. Chceš snad zůstat v tomto světě [Select_CString(recipient.IsFemale,'sama','sám')], s prázdnotou v duši? Nebo se raději staneš hlasem božské vůle? Mohu ti ukázat cestu.“\n\n"
 bp2_character_interaction.1001.desc_zealous: "$bp2_character_interaction.desc_zealous$„Úplně mi naskočila husí kůže, [recipient.Custom2('RelationToMeShort', ROOT.Char)]!“ vykřikne [recipient.GetFirstNameNoTooltip]. „[recipient.GetFaith.HighGodName|U] mi přeje! Cítím tu přízeň!“"
 bp2_character_interaction.desc_paranoid_common: "s otázkou: „Komu důvěřuješ nejvíc?“\n\n„Přece tobě,“ odpoví [recipient.GetFirstNameNoTooltip] poslušně.\n\n"
 bp2_character_interaction.desc_paranoid: "$bp2_character_interaction.desc_paranoid_common$„Tak mi věř, když ti řeknu... že nás u dvora neustále někdo sleduje. Poslouchej, co se šeptá za tvými zády. A nevěř ani... ani mně nevěř...“\n\nV blízkém okně se náhle objeví temná tvář. „#EMP Rychle!#!“ zasyčím. „Schovej se za mě, [Select_CString(recipient.IsFemale,'děvče','chlapče')]!“\n\n"
 bp2_character_interaction.1001.desc_paranoid: "$bp2_character_interaction.desc_paranoid$[recipient.GetFirstNameNoTooltip|U] se okamžitě schová za má záda a přitom odhalí důmyslně ukrytou dýku."
 bp2_character_interaction.desc_trusting: "$bp2_character_interaction.desc_paranoid_common$Pokleknu před [recipient.Custom('CZ_FirstName_I')] a vezmu dítě za ruku.\n\n„Přísahám, že tě nikdy nezklamu. V tomto smrtelném světě se #EMP musíš#! spoléhat na ostatní, chceš-li přežít. A ze všech lidí, kterým můžeš důvěřovat... tu pro tebe vždycky budu především já.“\n\n"
 bp2_character_interaction.1001.desc_trusting: "$bp2_character_interaction.desc_trusting$[recipient.GetFirstNameNoTooltip|U] má slzy na krajíčku. „Věřím ti,“ odpoví."
 bp2_character_interaction.desc_compassionate: "$bp2_character_interaction.desc_callous_common$„V jejich srdcích je dobro,“ zamumlám a obejmu dítě. „Jenže moc dokáže zaslepit a síla člověka omámit. Nedovol, aby ti pohled na zlo zatvrdil srdce. Raději v něm spatřuj příležitost projevit laskavost.“\n\n"
 bp2_character_interaction.1001.desc_compassionate: "$bp2_character_interaction.desc_compassionate$„Budu se snažit jednat ušlechtile po celý život!“ rozpláče se [recipient.GetFirstNameNoTooltip]."
 bp2_character_interaction.desc_callous_common: "se znepokojením. Nedávno byl [recipient.GetFirstNameNoTooltip] svědkem toho, jak [ROOT.Char.Custom('KnightCultureNoTooltip')|l] z mé družiny zmrzačil neposlušného služebníka.\n\nVyděšené dítě se mě ptá: „Proč jsou lidé tak násilní?“\n\n"
 bp2_character_interaction.desc_callous: "$bp2_character_interaction.desc_callous_common$„Ten sluha,“ odpovím, „bude svou práci vykonávat jen ze strachu z bití. Bez násilí a síly bychom ztratili své postavení ve světě. A kromě toho... copak chceš promarnit život oplakáváním služebnictva?“\n\n"
 bp2_character_interaction.1001.desc_callous: "$bp2_character_interaction.desc_callous$„Fuj,“ ušklíbne se [recipient.GetFirstNameNoTooltip]. „Ne.“"
 bp2_character_interaction.desc_sadistic: "$bp2_character_interaction.desc_callous_common$„Svět je plný násilí,“ odpovím. „Lidé jsou slabí a sobečtí, dítě. A je jich mnoho. Prolévat jejich krev nic neznamená. Jen pomysli, jakou moc při tom pocítil [ROOT.Char.Custom('KnightCultureNoTooltip')|l] z mé družiny. Takovou moc bys přece [Select_CString(recipient.IsFemale,'chtěla','chtěl')] mít také, nebo ne...?“\n\n"
 bp2_character_interaction.1001.desc_sadistic: "$bp2_character_interaction.desc_sadistic$„Ano,“ zašeptá [recipient.GetFirstNameNoTooltip]. „Ano, [Select_CString(recipient.IsFemale,'chtěla','chtěl')] bych...“"
 bp2_character_interaction.desc_stubborn: "a rozhodně se zeptám: „Jak se dnes hodláš pobavit?“\n\n„Ach... kamarádi mě zase přemluvili, abych s nimi [Select_CString(recipient.IsFemale,'sbírala','sbíral')] ty hloupé květiny...“\n\n„[recipient.GetFirstNameNoTooltip]!“ vykřiknu. „Kolik života ještě promarníš plněním rozmarů ostatních? Stůj si za vlastním úsudkem! Buď neochvějnou oporou svých rozhodnutí, jako je [ROOT.Char.Custom('KnightCultureNoTooltip')|l] v boji! Copak by tě vlastní volba nebavila ze všeho nejvíc?“\n\n"
 bp2_character_interaction.1001.desc_stubborn: "$bp2_character_interaction.desc_stubborn$„Ano,“ zamyslí se [recipient.GetFirstNameNoTooltip]. „Vím, co chci! Proč bych se měl[Select_CString(recipient.IsFemale,'a','')] nechat někým měnit?“"
 bp2_character_interaction.desc_fickle: "a z náhlého rozmaru se zeptám: „Jak se dnes hodláš pobavit?“\n\nKdyž [recipient.GetFirstNameNoTooltip] začne vyjmenovávat své plány, mimoděk se otřesu.\n\n„Jak snadno by nepřítel mohl sledovat každý tvůj krok! A pomysli, jak rychle tě všechny tyhle radovánky omrzí! Dá se snad naplánovat radost? Dá se předvídat bolest? Ne! Nech si svobodu dělat v každém okamžiku to, co se ti zachce.“\n\n"
 bp2_character_interaction.1001.desc_fickle: "$bp2_character_interaction.desc_fickle$[recipient.GetFirstNameNoTooltip|U] pokrčí rameny. „Jasně. Stejně už mě ty věci vlastně nezajímají.“"
 bp2_character_interaction.desc_eccentric: "a obratně hodím [recipient.Custom('CZ_FirstName_D')] na klín zmítající se krysu.\n\nKdyž dítě konečně přestane vyskakovat a vyděšeně vykřikovat, zeptá se: „Proč? Proč?!“\n\n„Člověk by neměl prožít život v nešťastném studu za své zvláštnosti. A už vůbec ne někdo, kdo zastává postavení [ROOT.Char.GetTitleAsNameNoTooltip|l]! Pohrdej očekáváním ostatních, kráčej vlastní cestou a stane se z tebe... něco. Něco velkého.“\n\n"
 bp2_character_interaction.1001.desc_eccentric: "$bp2_character_interaction.desc_eccentric$[Select_CString(recipient.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', recipient)] [recipient.GetFirstNameNoTooltip] se zachichotá a na souhlas na mě vyplázne jazyk."
 bp2_character_interaction.desc_vengeful: "ve chvíli, kdy [recipient.GetFirstNameNoTooltip] mrzutě naříká nad prohrou ve hře [ROOT.Char.Custom('BG_GameType_Generic')|l].\n\n„Ten ničema podváděl!“ rozčiluje se [recipient.GetFirstNameNoTooltip]. „To se mě mí přátelé nikdy nepřestanou pokoušet přelstít?“\n\nChopím se příležitosti. „Vědí, že si k tobě mohou dovolit cokoli, protože se tě nebojí! Vraž tomu podvodníkovi figurku do oka! Rozbij mu hrací desku o záda! Ať všichni vědí, že žádnou křivdu neodpouštíš!“\n\n"
 bp2_character_interaction.1001.desc_vengeful: "$bp2_character_interaction.desc_vengeful$„Pomsta,“ uchechtne se [recipient.GetFirstName]. „Už mám pár nápadů...“"
 bp2_character_interaction.desc_forgiving: "ve chvíli, kdy [recipient.GetFirstNameNoTooltip] mrzutě naříká nad prohrou ve hře [ROOT.Char.Custom('BG_GameType_Generic')|l].\n\n„Ta holka podváděla!“ trvá na svém [recipient.GetFirstNameNoTooltip]. „Zasloužila si tu figurku do oka! Jenže... teď už se mnou nechce kamarádit...“\n\nChopím se příležitosti. „Zamysli se nad odpuštěním. Uchovávej si je ve svém srdci, ať se stane cokoli. Kdybys té podvodnici [Select_CString(recipient.IsFemale,'prokázala','prokázal')] milost, neměl[Select_CString(recipient.IsFemale,'a','')] bys teď o jednu kamarádku víc?“\n\n"
 bp2_character_interaction.1001.desc_forgiving: "$bp2_character_interaction.desc_forgiving$„Ano,“ povzdechne si [recipient.GetFirstNameNoTooltip]. „To si budu pamatovat.“"
 bp2_character_interaction.1001.a: "[Select_CString(recipient.IsFemale,'To je moje holka!','To je můj kluk!')]"
 bp2_character_interaction.1001.a.tt: "Předáš osobnostní rys [target_trait.GetNameNoTooltip(GetPlayer)|l]"
 bp2_character_interaction.1001.a.flavor: "Začínáte si lépe rozumět a [recipient.GetFirstNameNoTooltip] se ti začíná čím dál více podobat."
 bp2_character_interaction.1002.t: "$influence_child_personality_interaction$: [target_trait.GetNameNoTooltip(GetPlayer)] – Neúspěch"
 bp2_character_interaction.1002.desc_intro: "$bp2_character_interaction.1001.desc_intro$"
 bp2_character_interaction.1002.desc_lustful: "$bp2_character_interaction.desc_lustful$„Ach...“ zabručí [recipient.GetFirstNameNoTooltip]. „Ale je přece tolik #EMP lepších#! věcí, které se dají dělat...“"
 bp2_character_interaction.1002.desc_chaste: "$bp2_character_interaction.desc_chaste$„Ale...“ zakňourá [recipient.GetFirstNameNoTooltip]. „Moje vlastní srdce by mě přece takhle nezradilo!“"
 bp2_character_interaction.1002.desc_gluttonous: "$bp2_character_interaction.desc_gluttonous$„Ale... já jen chci mít pocit, že mám něco #EMP pod kontrolou#!...“"
 bp2_character_interaction.1002.desc_temperate: "$bp2_character_interaction.desc_temperate$„Ale... co jen malou porci něčeho dobrého? Třeba [recipient.Custom('GetLocalStreetFood')|l]?“ namítne [recipient.GetFirstNameNoTooltip]. „Vždyť [ROOT.Char.GetFaith.HealthGodName] přece takovou radost dovoluje!“"
 bp2_character_interaction.1002.desc_greedy: "$bp2_character_interaction.desc_greedy$„Kámen?“ podiví se [recipient.GetFirstNameNoTooltip]. „Ano... asi nikdo nemá rád člověka s kamenným srdcem...“"
 bp2_character_interaction.1002.desc_generous: "$bp2_character_interaction.desc_generous$„Pořiď mi novou čapku zdobenou zlatou výšivkou,“ žadoní [recipient.GetFirstNameNoTooltip], „a já o tom #EMP popřemýšlím#!...“"
 bp2_character_interaction.1002.desc_lazy: "$bp2_character_interaction.desc_lazy$„Ne!“ odsekne [recipient.GetFirstNameNoTooltip]. „Nesmím selhat! Budu se snažit ještě víc.“"
 bp2_character_interaction.1002.desc_diligent: "$bp2_character_interaction.desc_diligent$„Nevím, co mám dělat!“ zakňourá [recipient.GetFirstNameNoTooltip]. „Prosím, nech mě být...“"
 bp2_character_interaction.1002.desc_wrathful: "$bp2_character_interaction.desc_wrathful$„Ale...“ polkne [recipient.GetFirstNameNoTooltip] naprázdno. „Tohle už nikdy nechci znovu cítit...“"
 bp2_character_interaction.1002.desc_calm: "$bp2_character_interaction.desc_calm$„Můj úsudek je naprosto jasný!“ vyštěkne [recipient.GetFirstNameNoTooltip]. „A podle mě je to hloupost!“"
 bp2_character_interaction.1002.desc_impatient: "$bp2_character_interaction.desc_impatient$„Ehm...“ zaslechnu mumlat [recipient.Custom('CZ_FirstName_A')]. „Hrát si na slepici bylo vlastně docela uklidňující.“"
 bp2_character_interaction.1002.desc_patient: "$bp2_character_interaction.desc_patient$„No,“ zabručí [recipient.GetFirstNameNoTooltip], „já ale nechci být slepice.“"
 bp2_character_interaction.1002.desc_arrogant: "$bp2_character_interaction.desc_arrogant$„Nevím... možná jsem [Select_CString(recipient.IsFemale,'vyhrála','vyhrál')] jen díky náhodě...“"
 bp2_character_interaction.1002.desc_humble: "$bp2_character_interaction.desc_humble$„Brzy...“ zamumlá [recipient.GetName]. „Brzy mě nikdo neporazí...“"
 bp2_character_interaction.1002.desc_deceitful: "$bp2_character_interaction.desc_deceitful$„Ano, je to zmijí hnízdo,“ ohradí se [recipient.GetFirstNameNoTooltip]. „Ale myslím, že v něm uvízli jen samotní hadi.“"
 bp2_character_interaction.1002.desc_honest: "$bp2_character_interaction.desc_honest$„Já? To rozhodně ne,“ trvá na svém [recipient.GetFirstNameNoTooltip], ale zní to prázdně. „Jak už jsem [Select_CString(recipient.IsFemale,'řekla','řekl')]... vždycky mluvím pravdu.“"
 bp2_character_interaction.1002.desc_craven: "$bp2_character_interaction.desc_craven$„Pusť mě!“ vykřikne [recipient.GetFirstNameNoTooltip]. „Jako vznešený [recipient.Custom('KnightCultureNoTooltip')|l] se smrti nebojím!“"
 bp2_character_interaction.1002.desc_brave: "$bp2_character_interaction.desc_brave$„Ale... já...“ zakňourá [recipient.GetFirstNameNoTooltip]. „Já nechci umřít...“"
 bp2_character_interaction.1002.desc_shy: "$bp2_character_interaction.desc_shy$„Kdybys [Select_CString(ROOT.Char.IsFemale,'slyšela','slyšel')], co o tobě lidé říkají, když nejsi poblíž, [recipient.Custom2('RelationToMeShort', ROOT.Char)]... už by ti samota tak vznešená nepřipadala.“"
 bp2_character_interaction.1002.desc_gregarious: "$bp2_character_interaction.desc_gregarious$„Prosím...“ [recipient.GetFirstNameNoTooltip] se úzkostlivě přikrčí. „Nech mě prostě být.“"
 bp2_character_interaction.1002.desc_ambitious: "$bp2_character_interaction.desc_ambitious$„Mně... je to jedno,“ povzdechne si [recipient.GetFirstNameNoTooltip]. „Stejně nakonec zestárnu.“"
 bp2_character_interaction.1002.desc_content: "$bp2_character_interaction.desc_content$„Ale jednou,“ zamumlá [recipient.GetFirstNameNoTooltip], „jednou budu mít mnohem víc...“"
 bp2_character_interaction.1002.desc_arbitrary: "$bp2_character_interaction.desc_arbitrary_common$"
 bp2_character_interaction.1002.desc_just: "$bp2_character_interaction.desc_just$„No dobře,“ řekne [recipient.GetFirstName] s potutelným úsměvem. „Když na tom trváš...“"
 bp2_character_interaction.1002.desc_cynical: "$bp2_character_interaction.desc_cynical$„Já vidím řád, který ustanovil [recipient.GetFaith.HighGodName]!“ namítne [recipient.GetFirstNameNoTooltip]. „A [recipient.GetFaith.HighGodName] koná dobro!“"
 bp2_character_interaction.1002.desc_zealous: "$bp2_character_interaction.desc_zealous$„Prosím tě, [recipient.Custom2('RelationToMeShort', ROOT.Char)],“ zabručí [recipient.GetFirstNameNoTooltip], „vždyť na mě při tom úplně prskáš!“"
 bp2_character_interaction.1002.desc_paranoid: "$bp2_character_interaction.desc_paranoid$[recipient.GetFirstNameNoTooltip|U] se zachichotá."
 bp2_character_interaction.1002.desc_trusting: "$bp2_character_interaction.desc_trusting$„No jo,“ zamumlá [recipient.GetFirstNameNoTooltip]. „#EMP Určitě...#!“"
 bp2_character_interaction.1002.desc_compassionate: "$bp2_character_interaction.desc_compassionate$„Laskavost? Příště mohou ublížit mně! A jak mě před tím ochrání laskavost?!“"
 bp2_character_interaction.1002.desc_callous: "$bp2_character_interaction.desc_callous$„Ale někdo se přece o ty ubožáky musí zajímat!“"
 bp2_character_interaction.1002.desc_sadistic: "$bp2_character_interaction.desc_sadistic$„Nikdy!“ zděšeně ucukne [recipient.GetFirstNameNoTooltip]. „Já chci být [Select_CString(recipient.IsFemale,'dobrá','dobrý')]!“"
 bp2_character_interaction.1002.desc_stubborn: "$bp2_character_interaction.desc_stubborn$„Možná...“ povzdechne si [recipient.GetFirstNameNoTooltip]. „Ale mně to nevadí...“"
 bp2_character_interaction.1002.desc_fickle: "$bp2_character_interaction.desc_fickle$„Ale,“ namítne [recipient.GetFirstNameNoTooltip], „vždyť jsem svým přátelům [Select_CString(recipient.IsFemale,'dala','dal')] slovo!“"
 bp2_character_interaction.1002.desc_eccentric: "$bp2_character_interaction.desc_eccentric$„Myslím,“ ošije se [recipient.GetFirstNameNoTooltip], „že bych raději [Select_CString(recipient.IsFemale,'zapadla','zapadl')] mezi ostatní...“"
 bp2_character_interaction.1002.desc_vengeful: "$bp2_character_interaction.desc_vengeful$„Ale... pak už by si se mnou nikdy nehrál...“"
 bp2_character_interaction.1002.desc_forgiving: "$bp2_character_interaction.desc_forgiving$„#EMP Jednu kamarádku?!#!“ vykřikne [recipient.GetFirstNameNoTooltip]. „Ne! Pořád by mě obtěžovala ta #EMP podvodnice#!!“"
 bp2_character_interaction.1002.a: "Copak si s tímhle [recipient.Custom('GetLassLad')|l] nikdy neporadím...?"
 bp2_character_interaction.1002.a.tt: "Nepodařilo se předat rys [target_trait.GetNameNoTooltip(GetPlayer)]"
 bp2_character_interaction.1002.a.flavor: "Tvé rady nenacházejí ochotného posluchače."
 selected_sinful_trait_tt: "Vybraný [Concept('trait','rys')|E] je ve víře [recipient.GetFaith.GetName] považován za [Concept('sinful','hříšný')|E]: $VALUE|+=0$"
 selected_virtuous_trait_tt: "Vybraný [Concept('trait','rys')|E] je ve víře [recipient.GetFaith.GetName] považován za [Concept('virtuous','ctnostný')|E]: $VALUE|+=0$"
 has_three_traits_already: "[recipient.GetShortUIName|U] už [Select_CString(recipient.IsLocalPlayer,'máš','má')] #V 3#! [Concept('personality_traits','osobnostní rysy')|E]: $VALUE|+=0$"
 has_commander_traits_already: "[recipient.GetShortUIName|U] už [Select_CString(recipient.IsLocalPlayer,'máš','má')] [Concept('commander_traits','velitelské rysy')|E]: $VALUE|+=0$"
 has_compatible_personality_tt: "[recipient.GetShortUIName|U] už [Select_CString(recipient.IsLocalPlayer,'máš','má')] slučitelný [Concept('childhood_trait','dětský rys')|E]: $VALUE|+=0$"
 has_incompatible_personality_tt: "[recipient.GetShortUIName|U] už [Select_CString(recipient.IsLocalPlayer,'máš','má')] neslučitelný [Concept('childhood_trait','dětský rys')|E]: $VALUE|+=0$"
 guardian_influenced_personality: "Ovlivnění osobnosti dítěte"
 guardian_influenced_personality_desc: "Tvé dítě [recipient.GetShortUINameNoTooltip] získalo díky [actor.Custom('CZ_ShortUINameNoTooltip_D')] rys [target_trait.GetName(recipient)]."
 guardian_influenced_personality_fail: "Nepodařilo se ovlivnit osobnost dítěte"
