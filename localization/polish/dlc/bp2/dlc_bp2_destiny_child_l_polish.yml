l_polish:
 destiny_child.0001.t: "Dítě osudu"
 destiny_child.0001.desc: "V pohledu [destiny_child.Custom('CZ_FirstName_G')] je cosi pronikavého.\n\nTaké chůze má v sobě hrdou ladnost. [destiny_child.GetFirstName|U] mluví s pevným přesvědčením a rozhodností, každou slabiku vyslovuje s obdivuhodnou zřetelností. Dokonce i stařešinové pětkrát starší než toto dítě pozorně naslouchají. Přitažlivost osobnosti [destiny_child.Custom('CZ_FirstNameNoTooltip_G')] je k sobě vábí jako můry k plameni.\n\nNa tom dítěti je něco výjimečného. Staré písně vyprávějí o vyvolených, kteří jsou předurčeni vést svůj lid kupředu, o osobnostech vznešeného vystupování a ještě vznešenějších schopností. Mohlo by na těch příbězích něco být?\n\nJe možné, že si osud vybral právě [destiny_child.Custom('CZ_FirstNameNoTooltip_A')]?"
 destiny_child.0001.a: "Tohle dítě potřebuje náležitou péči."
 destiny_child.0001.a.tt: "Na tom dítěti prostě #EMP něco#! je..."
 destiny_child.0001.b: "Nesmysly. To škvrně ať se naučí znát své místo."
 destiny_child.1000.t: "Zdatné mládí"
 destiny_child.1000.desc: "Když pozoruji, jak [destiny_child.GetFirstName] procvičuje seky mečem, uvědomím si, že z tohoto dítěte vyrůstá někdo neobyčejně tělesně zdatný.\n\nVzduchem zasviští další sek, který [destiny_child.GetFirstNameNoTooltip] dokončí s obdivuhodnou jistotou a odhodláním. Až mě zamrazí při představě, jaké by to bylo ocitnout se v dráze takového úderu. Přesto ve mně hlodá pochybnost, zda je takové soustředění na hrubou sílu skutečně prospěšné."
 destiny_child.1000.a: "„Výborný sek! Jen tak dál!“"
 destiny_child.1000.b: "„Nezanedbávej vytrvalost, [destiny_child.Custom('CZ_FirstNameNoTooltip_V')]!“"
 destiny_child.1005.t: "Nečekaný úhel pohledu"
 destiny_child.1005.desc: "Za rohem mě čeká překvapení. [destiny_child.GetFirstName] právě zaníceně rozmlouvá s [realm_priest.Custom('CZ_FirstName_I')], jehož znám jako [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('realm_priest'))]. Podle všeho nejde o hádku, ale o živou výměnu názorů.\n\n[destiny_child.GetFirstNameNoTooltip|U] se zářícíma očima horlivě rozebírá ty nejjemnější podrobnosti náboženského učení. [realm_priest.GetFirstNameNoTooltip|U] k [destiny_child.Custom('CZ_FirstNameNoTooltip_D')] přistupuje jako k sobě rovnému, což je vzhledem k jejich věkovému rozdílu vskutku chvályhodné."
 destiny_child.1005.a: "Taková výmluvnost! Taková moudrost!"
 destiny_child.1005.b: "„Zdržuješ [destiny_child.Custom('CZ_FirstNameNoTooltip_A')] od výcviku se zbraní, [realm_priest.Custom('CZ_FirstNameNoTooltip_V')]!“"
 destiny_child.1005.c: "Z toho se jistě hodně naučí."
 destiny_child.1010.t: "Válečnický důvtip"
 destiny_child.1010.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))|U] [marshal.GetFirstName] se mnou právě rozehrává válečnou hru. Skláníme se nad stolem pokrytým figurkami představujícími různé vojenské oddíly. Sotva si všimnu, že se k nám nenápadně přiblíží [destiny_child.GetFirstName], ale pronikavý pohled upřený na figurky okamžitě prozrazuje, jak usilovně se v té mladé hlavě přemýšlí.\n\n„Tady.“ Hlas [destiny_child.Custom('CZ_FirstNameNoTooltip_G')] mě vytrhne z myšlenek. „Tenhle oddíl je vázán čelním bojem. Kdybyste využili tamten les k utajení svého postupu, mohli byste nepřítele úplně zaskočit...“\n\n[marshal.GetFirstNameNoTooltip|U] za zády [destiny_child.Custom('CZ_FirstNameNoTooltip_G')] povytáhne obočí, zatímco se náš mladý stratég sklání nad stolem a přesouvá figurky."
 destiny_child.1010.a: "„Pravda, ale tím by odkryli své postavení. Vidíš?“"
 destiny_child.1010.a.tt: "[destiny_child.Custom('CZ_FirstNamePossessiveNoTooltip_F')|U] znalost válečných úskoků je už značně pokročilá, ale stále se má čemu učit."
 destiny_child.1010.b: "No tedy! [destiny_child.GetFirstNameNoTooltip|U] má pravdu!"
 destiny_child.1010.c: "„Pojď sem, můžeš mi to ještě jednou vysvětlit?“"
 destiny_child.1015.t: "Cvičení dělá..."
 destiny_child.1015.desc: "Dvě čepele se střetnou v jasném slunečním světle a s kovovým #EMP šššing!#! se sklouznou jedna po druhé.\n\n[destiny_child.GetFirstName|U] lehce odskočí dozadu a drží meč, jako by byl prodloužením vlastní paže. Protivník [knight.GetFirstName] se s mírným supěním potácí za [Select_CString(destiny_child.IsFemale,'ní','ním')].\n\nTi dva spolu šermují už nějakou dobu, ale [destiny_child.GetFirstNameNoTooltip] se sotva zapotí. Začínám si říkat, jestli se vůbec #EMP snaží#!."
 destiny_child.1015.a: "„Musíš ze sebe vydat víc, [destiny_child.Custom('CZ_FirstNameNoTooltip_V')]!“"
 destiny_child.1015.a.success: "[destiny_child.GetFirstNameNoTooltip|U] dosáhne nové úrovně dovedností"
 destiny_child.1015.a.failure: "[destiny_child.GetFirstNameNoTooltip|U] se při výcviku [Select_CString(destiny_child.IsFemale,'přepjala','přepjal')]"
 destiny_child.1015.a.critfailure: "[destiny_child.GetFirstNameNoTooltip|U] pod tlakem udělá strašlivou chybu"
 destiny_child.1015.b: "Možná bych měl převzít výcvik?"
 destiny_child.1015.b.success: "Tvé rady se ukážou být ještě cennější než rady [knight.Custom('CZ_FirstNameNoTooltip_G')]"
 destiny_child.1015.b.failure: "Ani ty nedokážeš držet krok s [destiny_child.Custom('CZ_FirstNameNoTooltip_I')]"
 destiny_child.1015.c: "„Jen pokračujte, vy dva! A [knight.Custom('CZ_FirstNameNoTooltip_D')] za tu námahu přihodím pár mincí!“"
 destiny_child.1020.t: "Učení mimo osnovy"
 destiny_child.1020.desc: "Ty nejpodivnější věci člověk obvykle spatří ve chvíli, kdy je nejméně čeká. Přesně to se mi potvrdí, když přede mnou stanou [Select_CString(physician.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('physician'))|l] [physician.GetFirstName] a [herbalist.GetFirstName], [Select_CString(herbalist.IsFemale,'zkušená léčitelka','zkušený léčitel')]. Doprovází je [destiny_child.GetFirstName], celé bez sebe nadšením.\n\n„Mladá [destiny_child.Custom('CZ_FirstNameNoTooltip_A')] láká jedno z našich povolání, [ROOT.Char.Custom('FormOfAddressForLiege')|l],“ začne [physician.GetFirstNameNoTooltip]. „A my bychom [Select_CString(destiny_child.IsFemale,'ji','ho')] docela rádi zaučili.“ [herbalist.GetFirstNameNoTooltip] však netrpělivě skočí do řeči.\n\n„Potřebujeme jen váš souhlas! Bez něj rozhodně nebudu tím, kdo [destiny_child.Custom('CZ_FirstNameNoTooltip_A')] odvede od studia!“"
 destiny_child.1020.a: "Čas strávený s lékařem rozhodně nepřijde nazmar..."
 destiny_child.1020.b: "Bylinkářství je nesmírně zajímavý obor!"
 destiny_child.1020.c: "„Jen... ať ti to nezabere příliš mnoho času na úkor studia.“"
 destiny_child.1025.t: "Pověst se šíří"
 destiny_child.1025.desc: "Náhlé odfrknutí koně mě vyleká. Mým směrem na válečném oři přijíždí [famous_knight.Custom('KnightCultureNoTooltip')|l].\n\n„[ROOT.Char.GetTitledFirstName]! Jste to opravdu vy?“ [Select_CString(famous_knight.IsFemale,'Jezdkyně','Jezdec')] uctivě skloní hlavu. „Přicházím kvůli jednomu dítěti. Jmenuje se [destiny_child.GetFirstNameNoTooltip]. Je ve vaší péči, nemýlím se?“ Přikývnu a mí strážci se ostražitě přiblíží.\n\n„Nemějte obavy. Mé jméno je samo o sobě proslulé... ale zprávy o nadání [destiny_child.Custom('CZ_FirstNameNoTooltip_G')] se šíří jako požár! Bylo by mi ctí se s tímto dítětem seznámit a třeba i pomoci rozvíjet jeho mimořádné schopnosti.“"
 destiny_child.1025.a: "„#EMP Zmiz#!, odporný vrahu! #EMP Stráže!#!“"
 destiny_child.1025.b: "Vycvičit [destiny_child.Custom('CZ_FirstName_A')]? Skvělý nápad!"
 destiny_child.1025.c: "„Možná bych tě dokonce mohl přesvědčit, abys tu [Select_CString(famous_knight.IsFemale,'zůstala','zůstal')]?“"
 destiny_child.1030.t: "Kdo bude další na řadě?"
 destiny_child.1030.desc: "[destiny_child.GetFirstName|U] má skutečně mimořádné nadání. Každé slovo zní, jako by vycházelo z úst někoho o desítky let staršího, a ostatní se přirozeně podřizují tomuto vedení. Nemůže být pochyb, v kom spočívá budoucnost mé rodiny. A přece, a přece...\n\nAť už je [destiny_child.GetFirstNameNoTooltip] jakkoli [Select_CString(destiny_child.IsFemale,'okouzlující a schopná','okouzlující a schopný')], pravidla, kterými se řídí [SelectLocalization(IsLandlessAdventurer(ROOT.Char), 'camp', 'land')|l], jsou neúprosná. Toto dítě není mým hlavním dědicem. Až zemřu, všechno to nadání a všechny schopnosti budou sloužit jen plánům [destiny_child.Custom2('CZ_RelationToMeShort_G', SCOPE.sC('current_heir'))|l] [current_heir.Custom('CZ_FirstName_G')].\n\nKdesi v koutku mysli se mi rýsuje závažnost celé situace. Na tomhle rozhodnutí bude záviset můj odkaz budoucím generacím."
 destiny_child.1030.a: "Když využiji všechen svůj důvtip, možná se to podaří zařídit..."
 destiny_child.1030.a.success: "Tvé nenápadné intriky uspějí"
 destiny_child.1030.a.failure: "Tvé plány vyjdou najevo a vyvolají pozdvižení"
 destiny_child.1030.b: "Nemohu dopustit, aby příběh [destiny_child.Custom('CZ_FirstNameNoTooltip_G')] zůstal nenapsaný."
 destiny_child.1030.c: "Zákony jsou zákony. Nesmím je obcházet."
 destiny_child.1030.c.tt: "Musím připravit právoplatného dědice na budoucnost, ale také vybavit [destiny_child.Custom('CZ_FirstNameNoTooltip_A')] schopnostmi potřebnými k ochraně [current_heir.Custom('CZ_FirstName_A')]."
 destiny_child.1035.t: "První láska"
 destiny_child.1035.desc: "Schopnosti [destiny_child.Custom('CZ_FirstName_G')] jsou tak mimořádné, že někdy zapomínám, že jde stále ještě o dítě. Když však společně procházíme [ROOT.Char.Custom('GetCourtyard')|l] a opodál zaslechnu chichotání dvou dětí, okamžitě si připomenu, že děti zůstávají dětmi.\n\nObě chichotající se děti jsou do [destiny_child.Custom('CZ_FirstNameNoTooltip_G')] očividně až po uši zamilované. Jakmile je [destiny_child.GetFirstNameNoTooltip] vesele pozdraví, obě okamžitě sklopí oči k zemi."
 destiny_child.1035.interested: "\n\nAčkoli [destiny_child.GetFirstNameNoTooltip] projevuje moudrost daleko přesahující svůj věk, neunikne mi drobný úsměv v koutku úst..."
 destiny_child.1035.notinterested: "\n\nK mému překvapení však [destiny_child.GetFirstNameNoTooltip] už nic dalšího neřekne. Bez sebemenšího zaváhání pokračuje dál a vyběhne po schodech vedoucích dovnitř."
 destiny_child.1035.a: "Zdá se, že [destiny_child.GetFirstNameNoTooltip] má pro [flirter_1.Custom('CZ_FirstNameNoTooltip_A')] slabost..."
 destiny_child.1035.b: "Mám dojem, že se [destiny_child.GetFirstNameNoTooltip] [Select_CString(destiny_child.IsFemale,'zakoukala','zakoukal')] do [flirter_2.Custom('CZ_FirstNameNoTooltip_G')]!"
 destiny_child.1035.c: "„Je dobře, že se takovými malichernostmi nenecháš rozptylovat, [destiny_child.Custom('CZ_FirstNameNoTooltip_V')].“"
 destiny_child.1035.d: "„Musíš se soustředit, [destiny_child.Custom('CZ_FirstNameNoTooltip_V')]!“"
 destiny_child.1035.d.tt: "Na #EMP takové věci#! bude mít [destiny_child.GetFirstNameNoTooltip] v životě ještě dost času..."
 destiny_child.9999.t: "Naplněný osud"
 destiny_child.9999.desc: "Ani jsem si nevšiml, jak rychle [destiny_child.GetFirstName] dospívá. Teď už však před sebou vidím někoho sobě rovného. Kdysi dávno jsem v tomto dítěti [Select_CString(ROOT.Char.IsFemale,'rozpoznala','rozpoznal')] mimořádný potenciál a [Select_CString(ROOT.Char.IsFemale,'rozhodla','rozhodl')] se jej rozvíjet. Tehdy jsem sotva [Select_CString(ROOT.Char.IsFemale,'tušila','tušil')], co od toho čekat, ale dnes je jasné, že mé úsilí nebylo marné.\n\n[destiny_child.GetFirstNameNoTooltip|U] stojí přede mnou tváří v tvář s úsměvem na rtech. Ačkoli se dobře známe, stále cítím tu přirozenou přitažlivost, která z této osobnosti vyzařuje. Není pochyb, že [Select_CString(destiny_child.IsFemale,'tato žena','tento muž')] je jakýmsi tajemným způsobem [Select_CString(destiny_child.IsFemale,'předurčena','předurčen')] k velkým činům.\n\nJsem pevně [Select_CString(ROOT.Char.IsFemale,'přesvědčena','přesvědčen')], že jsem [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')] správně, když jsem pomáhala vést [destiny_child.Custom('CZ_FirstName_A')] po spletité a zrádné cestě osudu."
 destiny_child.9999.a: "Bylo mi ctí."
