l_polish:
 child_personality.7300.t: "Přátelství se zvířaty"
 child_personality.7300.desc: "Mezi zvířaty ve zvěřincích a stájích se obvykle cítím mnohem příjemněji než mezi vrstevníky a vychovateli u dvora. A tak se znovu ocitám ve stájích, kde hřebelcuji svého koně a projíždím se na něm.\n\nCítím mezi námi silné pouto, jako bychom byli dobří přátelé. Sesednu, důkladně svého oře vykartáčuji a začnu přemýšlet, jestli bychom se ke svým koním neměli chovat spíš jako ke skutečným druhům."
 child_personality.7300.a: "Já... já snad mluvím koňsky!"
 child_personality.7300.b: "Jsou stejní jako my."
 child_personality.7300.c: "Zvíře je jen nástroj. Nic víc."
 child_personality.7301.t: "$child_personality.7300.t$"
 child_personality.7301.desc: "[child.GetFirstName] v poslední době tráví neobvykle mnoho času ve stájích a začíná zanedbávat své vrstevníky u dvora. Zdá se, že se veškerá pozornost tohoto dítěte upnula na jednoho konkrétního koně"
 child_personality.7301.eccentric.desc: " a dokonce prý dokáže „mluvit koňsky“.\n\nDítě pak začne prskat rty a vydávat řehtavé zvuky. Občas přestane, jen aby mi vysvětlilo, o čem si s koněm právě povídají."
 child_personality.7301.eccentric.obligatory_glitterhoof_reference: "Ten kůň prý dokonce sní o tom, že jednou bude [child.GetFaith.ReligiousHeadName]."
 child_personality.7301.eccentric.fallback: "Ten kůň prý touží po křesle v radě."
 child_personality.7301.compassionate.desc: " a tvrdí, že i zvířata si zaslouží péči a důstojné zacházení.\n\nKůň je dokonale vyhřebelcovaný a upravený, na rozdíl od [child.Custom('CZ_FirstNameNoTooltip_G')], na jehož oblečení je jasně vidět, kdo tu zastával práci stájníka."
 child_personality.7301.callous.desc: ", ale když na to přijde řeč, dítě trvá na tom, že zvíře je pouhý nástroj, který lze odhodit, jakmile přestane být užitečný.\n\n[child.GetFirstNameNoTooltip|U] při jízdě vůbec nedbá na bezpečí ani pohodlí koně, a když zvíře projeví sebemenší pud sebezáchovy, vyvolá to jen podráždění."
 child_personality.7301.eccentric: "Jaká to úžasná představivost!"
 child_personality.7301.compassionate: "Chovej se k ostatním..."
 child_personality.7301.callous: "„Výborně, toho se drž.“"
 child_personality.7301.change.eccentric: "„Ne, promluv si s tím koněm. Pověz mi, co říká.“"
 child_personality.7301.change.compassionate: "„Kůň je společník, jakému není rovno, [child.Custom('CZ_FirstNameNoTooltip_V')].“"
 child_personality.7301.change.callous: "„Hloupé dítě, kůň je jen nástroj.“"
 child_personality.7400.t: "Hrát, nebo jezdit?"
 child_personality.7400.desc: "S [other_child.Custom('CZ_FirstName_I')] si už většinu dne báječně hraji a mám pocit, že bychom mohli pokračovat, dokud mě nezačnou bolet všechny svaly.\n\nJenže jakmile vytáhnu svou sadu pro hru [ROOT.Char.Custom('BG_GameType_Generic')], úsměv z tváře [other_child.Custom('CZ_FirstName_G')] zmizí.\n\n"
 child_personality.7400.desc.outro.young: "„Nechci hrát takovou hloupou a nudnou hru! Chci jezdit na koních!“"
 child_personality.7400.desc.outro.older: "„Ale no tak, [ROOT.Char.GetFirstNameNoTooltip], celý den jsme zavření uvnitř. Co kdybychom si vyjeli na koních?“"
 child_personality.7400.a: "„A proč ne obojí?“"
 child_personality.7400.b: "„Ne! Budeme hrát MOJI hru podle MÝCH pravidel!“"
 child_personality.7400.c: "„Dobře, projížďka taky nezní špatně...“"
 child_personality.7401.t: "$child_personality.7400.t$"
 child_personality.7401.desc: "[child.GetFirstName] je dnes po většinu dne nezvykle zticha, a tak se raději vydám zjistit, co se děje. Nakonec narazím na [child.Custom('CZ_FirstNameNoTooltip_A')]"
 child_personality.7401.eccentric.desc: " venku na jízdárně s [other_child.Custom('CZ_FirstName_I')]. Obě děti na sebe pokřikují z koňských hřbetů a vyvolávají něco, co nápadně připomíná tahy při hře [child.Custom('BG_GameType_Generic')]. Když přijdu blíž, zjistím, že se skutečně pokoušejí hrát deskovou hru přímo na koních! Celá jízdárna je posetá hracími figurkami a obě děti už ze sedla několikrát spadly."
 child_personality.7401.fickle.desc: " venku na jízdárně s [other_child.Custom('CZ_FirstName_I')]. [child.GetFirstNameNoTooltip|U] se však příliš nadšeně netváří. Skoro to vypadá, jako by sem šlo jen kvůli svému kamarádovi.\n\n„[Select_CString(child.IsFemale,'Chtěla','Chtěl')] jsem hrát deskové hry, ale [other_child.GetFirstNameNoTooltip] [Select_CString(other_child.IsFemale,'řekla','řekl')], že bychom měli raději jezdit na koních. A to taky znělo dobře!“"
 child_personality.7401.stubborn.desc: " nahoře v pokoji ve společnosti [other_child.Custom('CZ_FirstName_G')]. Zatímco [child.GetFirstNameNoTooltip] nadšeně hraje [child.Custom('BG_GameType_Generic')], druhé dítě se do hry zapojuje jen s polovičním zájmem.\n\n„[other_child.GetFirstNameNoTooltip|U] [Select_CString(other_child.IsFemale,'chtěla','chtěl')] jezdit na koních, ale já jsem [Select_CString(child.IsFemale,'rozhodla','rozhodl')], že si místo toho zahrajeme deskovou hru!“"
 child_personality.7401.eccentric: "„To je ale skvělý kompromis!“"
 child_personality.7401.fickle: "„Rozmary se mění častěji než počasí.“"
 child_personality.7401.stubborn: "„Zůstaň pevný jako skála.“"
 child_personality.7401.change.eccentric: "„Proč nehrát obojí zároveň?“"
 child_personality.7401.change.fickle: "„Nálady se musí měnit jako proudící voda.“"
 child_personality.7401.change.stubborn: "„Ne! Zapři se a trvej na tom, ať ustoupí ostatní.“"
 stress_threshold.2360.t: "Duševní zhroucení: Návštěvník"
 stress_threshold.2360.desc: "Konečně nacházím trochu úlevy od starostí dvorského života v soukromí svých komnat. Už téměř usínám, když mě náhle vyruší ostré, melodické ťukání.\n\nPrudce otevřu [ROOT.Char.Custom('GetDoor')], abych zjistil, kdo mě to uprostřed noci navštěvuje. Místo odpovědi mi však přímo do obličeje vletí malý černý pták.\n\nJindy bych návštěvu tvora, kterému vdechl život [ROOT.Char.GetFaith.CreatorName], považoval za dar. Jenže tenhle malý černý prevít kolem mě neustále poletuje, kráká a vříská. Cítím, jak se mi zatínají pěsti a srdce se mi prudce rozbuší."
 stress_threshold.2360.a.eccentric.gain: "Myslím, že se mnou mluví."
 stress_threshold.2360.a.eccentric.effect: "Á, návštěva v takovou hodinu! Tak si popovídáme."
 stress_threshold.2360.b.irritable.gain: "Už to dál nevydržím!"
 stress_threshold.2360.b.irritable.effect: "Toho zatraceného ptáka zabiju!"
 stress_threshold.2360.c: "Určitě nakonec odletí sám."
 bp2_yearly.8000.t: "K obrazu svému"
 bp2_yearly.8000.desc.intro: "[hostage.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se mnou v poslední době hovoří výhradně dvorním jazykem ([ROOT.Char.GetCourtLanguage.GetNameNoTooltip]), a to s pozoruhodnou plynulostí.\n\n"
 bp2_yearly.8000.desc.tutor: "Za toto mimořádné jazykové nadání nepochybně vděčí času strávenému v péči [Select_CString(tutor.IsFemale,'mé dvorní vychovatelky','mého dvorního vychovatele')] [tutor.Custom('CZ_FirstName_G')]. Už se těším, až uvidím, jak se toto dítě ve dvorním jazyce ještě více zdokonalí."
 bp2_yearly.8000.desc.chaplain: "[hostage.GetFirstNameNoTooltip|U] mi vypráví, že za svou znalost dvorního jazyka vděčí především duchovním, kteří se starají o vzdělání. Patří mezi ně i [tutor.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 bp2_yearly.8000.desc.guardian: "Je zřejmé, že mezi [hostage.Custom('CZ_FirstName_I')] a [tutor.Custom('CZ_FirstName_I')] vzniká skutečně blízké pouto. Mohu se tedy těšit na další příjemná překvapení v průběhu vzdělávání tohoto dítěte."
 bp2_yearly.8000.a: "Výuky [hostage.Custom('CZ_FirstName_G')] se ujmu osobně."
 bp2_yearly.8000.b: "Tohle má být [ROOT.Char.GetCourtLanguage.GetNameNoTooltip]? Jak žalostný pokus."
 bp2_yearly.8000.c: "To je milé."
 bp2_yearly.8000.b.tt: "[hostage.GetFirstNameNoTooltip|U] ztratí chuť učit se tvůj [Concept('court_language','dvorní jazyk')|E]"
 tutor_child_in_language_tt: "[hostage.GetFirstNameNoTooltip|U] zahájí [Concept('scheme','intriku')|E] zaměřenou na osvojení tvého [Concept('court_language','dvorního jazyka')|E] s výrazným bonusem"
 child_learning_language_tt: "[hostage.GetFirstNameNoTooltip|U] získá povzbuzení k zahájení [Concept('scheme','intriky')|E] zaměřené na osvojení tvého [Concept('court_language','dvorního jazyka')|E]"
 bp2_yearly.8010.t: "Legrační řeč"
 bp2_yearly.8010.desc: "Právě vedu lekci a mým žákem je [child.Custom2('MyCharacterIntroduction', ROOT.Char)]. Jenže ten sotva potlačovaný úšklebek mi napovídá, že z mého výkladu nepadne na úrodnou půdu ani jediné slovo. Čas od času totiž dítě jen zopakuje něco, co jsem právě řekl, ale podivně při tom pitvoří hlas.\n\n„Co to vlastně děláš?“\n\n„Co to vlastně děláš?“ zopakuje [child.Custom2('InsultNoun', ROOT.Char)] a vyprskne smíchy. „Promiň, ale ten tvůj přízvuk je prostě k popukání!“"
 bp2_yearly.8010.a: "Možná by pomohlo naučit [child.Custom('CZ_FirstName_A')] základy mého rodného jazyka ([ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip])."
 bp2_yearly.8010.a.tt: "Během několika příštích lekcí budeš vyučovat základy svého rodného jazyka ([ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip])"
 tutor_child_in_native_language_tt: "[child.GetFirstName|U] zahájí [Concept('scheme','intriku')|E] zaměřenou na osvojení tvého [Concept('language','jazyka')|E] s výrazným bonusem"
 bp2_yearly.8010.a.success: "Úspěšně předáš základy svého rodného jazyka ([ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip])"
 bp2_yearly.8010.a.failure: "Nepodaří se ti naučit dítě základy svého rodného jazyka ([ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip])"
 bp2_yearly.8010.b: "„Ne, to #EMP ty#! mluvíš legračně!“"
 bp2_yearly.8010.b.success: "Úspěšně dítě zesměšníš"
 bp2_yearly.8010.b.failure: "Ještě více se zesměšníš"
 bp2_yearly.8010.c: "Dobře."
 bp2_yearly.8010.d: "„Japakapak sepe mápáš?“"
 bp2_yearly.8010.d.tt: "Zbytek lekce strávíte společným vymýšlením tajného jazyka"
 bp2_yearly.8020.t: "Na co si zahrajeme?"
 bp2_yearly.8020.desc: "Už většinu dne si hraji s [other_child.Custom2('MyCharacterIntroduction', ROOT.Char)] a báječně se bavím! Právě dokončujeme partii hry [ROOT.Char.Custom('BG_GameType_Generic')] a k mému úžasu mě [other_child.GetFirstNameNoTooltip] porazí tak důkladně, že mi nezbývají slova.\n\n„To byla zábava! Co budeme dělat teď?“\n\nTohle je moje příležitost vybrat něco, v čem bych ještě mohl vyhrát..."
 bp2_yearly.8020.a: "Zazávodíme si na chůdách!"
 bp2_yearly.8020.b: "Zahrajeme si s káčou!"
 bp2_yearly.8020.c: "S loutkami vyhrává každý."
 bp2_yearly.8021.t: "Hra"
 bp2_yearly.8021.desc.intro: "Odložíme herní desku a připravíme si "
 bp2_yearly.8021.desc.stilts: "chůdy. Najednou se tyčím vysoko nad zemí, skoro jako dospělý člověk, a mé krátké nohy mají co dělat, aby mě v té závratné výšce udržely. Jakmile se i můj soupeř nejistě postaví na chůdy, závod začíná!"
 bp2_yearly.8021.desc.teetotum: "hrací káču. Roztočí se a víří dokola, zatímco oba sázíme své kuličky na výsledek. Přestože nehrajeme o nic skutečně cenného, srdce mi buší vzrušením, když se káča konečně převrátí na bok.\n\nŠtěstí se přelévá z jedné strany na druhou a kuličky neustále mění majitele. Brzy se však ukáže, že "
 bp2_yearly.8021.desc.stilts.outro: "\n\n[other_child.GetFirstNameNoTooltip|U] urazí sotva pár kroků, než sebou plácne přímo na obličej. Vítězství je moje! Z výšky svých mohutných chůd shlížím na poraženého soupeře a mohu si vyzvednout svou odměnu."
 bp2_yearly.8021.desc.teetotum.outro: "nakonec všechny kuličky skončí u mě. [other_child.GetFirstNameNoTooltip|U] si poraženě povzdechne, zatímco já se pyšně kochám svou výhrou."
 bp2_yearly.8021.a: "To bylo až moc snadné! Prohráls!"
 bp2_yearly.8021.b: "Dobrá hra."
 bp2_yearly.8021.c: "Přece jsem [Select_CString(ROOT.Char.IsFemale,'říkala','říkal')], že vítěz získá laskavost..."
 bp2_yearly.8022.desc.stilts.outro: "\n\nSnažím se na vratkých chůdách běžet ze všech sil, ale po několika krocích sebou praštím přímo na obličej. Vítězem se stává [other_child.GetFirstNameNoTooltip]."
 bp2_yearly.8022.desc.teetotum.outro: "mi nezůstane ani jediná kulička. Všechny vyhraje [other_child.GetFirstNameNoTooltip]."
 bp2_yearly.8022.desc.rubbed_it_in: "\n\nMůj soupeř ovšem nemá ani špetku skromnosti. Místo toho si mé vítězství náležitě vychutnává, posmívá se mi a ponižuje mě za prohru."
 bp2_yearly.8022.desc.normal_child: "\n\n„To byla ale zábava!“"
 bp2_yearly.8022.a: "No a co."
 bp2_yearly.8022.a.mean: "„Sklapni! Nenávidím tě!“"
 bp2_yearly.8022.b: "„Stráže!“"
 bp2_yearly.8022.c: "„Jo, měli bychom si zase zahrát!“"
 bp2_yearly.8030.t: "Osamělá panenka"
 bp2_yearly.8030.desc: "Všude kolem mě šlehají plameny a ozývá se křik, zatímco mé vojsko drancuje [CZProvName(ROOT.Char.GetCurrentLocation,'A')] a pátrá po cennostech a zajatcích. Vzduch naplňuje štiplavý zápach hořícího masa.\n\nMezi troskami leží odhozená malá panenka. Očka z knoflíků a ručně vyšívaný úsměv mi připomínají dětskou nevinnost, která na mě čeká doma.\n\nI když je celá obalená blátem, její jemné vlásky jsou na dotek tak hebké. Nemohu se ubránit myšlence, že by to byl dokonalý dárek pro některé z dětí u mého dvora."
 bp2_yearly.8030.a: "[child_1.GetFirstNameNoTooltip|U] z ní bude mít ohromnou radost!"
 bp2_yearly.8030.b: "Tahle panenka mi tolik připomíná [child_2.Custom('CZ_FirstNameNoTooltip_A')]."
 bp2_yearly.8020.a.win: "Vítězíš!"
 bp2_yearly.8020.a.lose: "Prohráváš..."
 bp2_yearly.8040.t: "[Select_CString(crush.IsFemale,'Už je z ní žena','Už je z něj muž')]"
 bp2_yearly.8040.desc.intro: "Už je to pěkně dlouho, co jsem se naposledy [Select_CString(ROOT.Char.IsFemale,'setkala','setkal')] se svou dávnou láskou [crush.Custom('CZ_FirstName_I')]."
 bp2_yearly.8040.desc.mid.same_location: "A pak najednou spatřím, jak [crush.GetFirstName] přichází na můj dvůr. Ta nádhera mi bere dech, až mě napadne, zda právě takhle nevypadá [ROOT.Char.GetFaith.PositiveAfterLife]. Srdce se mi rozbuší a dlaně se začnou potit, přesně jako kdysi, když jsem ještě [Select_CString(ROOT.Char.IsFemale,'byla','byl')] [ROOT.Char.Custom('GirlBoy')].\n\nJen těžko se mi věří, že přede mnou stojí stejná osoba, do které jsem byl[Select_CString(ROOT.Char.IsFemale,'a','')] v mládí tolik [Select_CString(ROOT.Char.IsFemale,'zamilovaná','zamilovaný')]. A ještě těžší je uvěřit, že mé city zůstaly beze změny."
 bp2_yearly.8040.desc.mid.different_location: "I po všech těch letech mě vzpomínky na mou dětskou lásku přepadávají v tichých nočních hodinách.\n\n[crush.GetFirstName|U] už dávno [Select_CString(crush.IsFemale,'dospěla v ženu','dospěl v muže')], a přesto kdykoli na [crush.Custom('CZ_FirstName_A')] pomyslím, ruka mi sama sahá po brku."
 bp2_yearly.8040.desc.outro: "Možná už konečně nastal čas své city vyznat."
 bp2_yearly.8040.a: "Vyznám svou lásku!"
 bp2_yearly.8040.b: "Musím ty dětinské představy nechat za sebou."
 bp2_yearly.8040.c: "Ráno se vezmeme!"
 bp2_yearly.8041.t: "[Select_CString(ROOT.Char.IsFemale,'Už jsi žena','Už jsi muž')]"
 bp2_yearly.8041.desc.intro.same_location: "Vracím se do svého sídla a mezi přítomnými zahlédnu [crushee.Custom2('MyCharacterIntroduction', ROOT.Char)], [Select_CString(crushee.IsFemale,'která','který')] na mě hledí jako vyhladovělý dravec na svou příští kořist. [crushee.GetFirstNameNoTooltip|U] se prodere davem až ke mně a "
 bp2_yearly.8041.desc.intro.different_location: "Mezi obvyklou státní korespondencí nacházím něco zcela neobvyklého. Dopis převázaný jemnou krvavě rudou stuhou, jehož voskovou pečeť zdobí vyobrazení srdce.\n\nPíše mi [crushee.Custom2('MyCharacterIntroduction', ROOT.Char)] a v dopise se mi vyznává ze svých hlubokých citů."
 bp2_yearly.8041.desc.mid.same_location_marriage: "poklekne přede mnou.\n\n„Ach, [ROOT.Char.Custom('LoverPetName')], od dětství mám oči jen pro tebe. Má láska je čistší než jakákoli jiná na tomto světě. Pokud mě přijmeš, budu [Select_CString(crushee.IsFemale,'tvá','tvůj')] [crushee.Custom('WifeHusband')]!“"
 bp2_yearly.8041.desc.mid.different_location_marriage: "\n\nPo dlouhém líčení dětské zamilovanosti dopis přechází k překvapivé nabídce. [crushee.GetFirstNameNoTooltip|U] mi navrhuje sňatek!\n\n„Jakmile mi odpovíš, můžeme se vzít, má lásko. Přijmi mě a zasvětím celý svůj život tomu, abych ti přinášel[Select_CString(crushee.IsFemale,'a','')] štěstí.“"
 bp2_yearly.8041.desc.mid.same_location_lovers: "odvede mě stranou do klidného zákoutí dvora, kde mi tiše pošeptá do ucha.\n\n„Už od dětství k tobě chovám hluboké city. Nabízím ti svou lásku, pokud ji chceš přijmout.“"
 bp2_yearly.8041.desc.mid.different_location_lovers: "\n\n„Má lásko, žiji jen pro tebe a už nedokážu snášet naše odloučení. Miluji tě od dob, kdy jsem ještě [Select_CString(crushee.IsFemale,'byla','byl')] [crushee.Custom('GirlBoy')]. Prosím, opětuj mé city a slibuji, že tě budu dělat šťastnou duší až do konce života.“"
 bp2_yearly.8041.a: "Opětuji tuto lásku!"
 bp2_yearly.8041.b: "Já to tak necítím."
 bp2_yearly.8042.t: "Opětovaná láska"
 bp2_yearly.8042.desc.intro: "Vyznávám svou lásku [crush.Custom('CZ_FirstName_D')]"
 bp2_yearly.8042.desc.mid.same_location: " a [crush.GetFirstNameNoTooltip] se ke mně nakloní a pošeptá mi do ucha stejně vroucí vyznání."
 bp2_yearly.8042.desc.mid.different_location: " v dopise. Netrvá ani několik dní a přichází odpověď, že mé city jsou opětovány!"
 bp2_yearly.8042.desc.outro: "\n\nJsem radostí bez sebe! Je až neuvěřitelné, že naše láska dokázala překonat pošetilosti mládí a rozkvést ve skutečný, zralý vztah."
