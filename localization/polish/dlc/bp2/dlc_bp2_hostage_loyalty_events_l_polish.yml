l_polish:
 bp2_yearly.8050.t: "Kdo vlastně jsem?"
 bp2_yearly.8050.desc.intro: "Dnes zastihnu [hostage.Custom('CZ_Name_A')] [Select_CString(hostage.IsFemale,'zasněnou a zamyšlenou','zasněného a zamyšleného')], jak hledí na lidi pod námi.\n\nPřistoupím blíž, položím [Select_CString(hostage.IsFemale,'jí','mu')|l] ruku na svěšené rameno a zeptám se, co [Select_CString(hostage.IsFemale,'ji','ho')|l] tolik trápí.\n\n„Ach, [Select_CString(ROOT.Char.IsFemale,'teto','strýčku')|l],"
 bp2_yearly.8050.desc.mid.friendship: "s tebou mě pojí silnější přátelství než s kýmkoli z místa, kterému jsem kdysi [Select_CString(hostage.IsFemale,'říkala','říkal')|l] domov."
 bp2_yearly.8050.desc.mid.childhood_friendship: "s [hostage_friend.Custom('CZ_FirstName_I')] mě pojí silnější přátelství než s kýmkoli z místa, kterému jsem kdysi [Select_CString(hostage.IsFemale,'říkala','říkal')|l] domov."
 bp2_yearly.8050.desc.mid.hatred: "[hated_parent.Custom2('MyCharacterIntroduction', SCOPE.sC('hostage'))|l] je opravdu [hated_parent.Custom2('InsultAdjective', SCOPE.sC('hostage'))|l] [hated_parent.Custom2('InsultNoun', SCOPE.sC('hostage'))|l] a nedokážu si představit, že bych se k [Select_CString(hated_parent.IsFemale,'ní','němu')|l] [Select_CString(hostage.IsFemale,'vrátila','vrátil')|l]."
 bp2_yearly.8050.desc.mid.culture: "s [hated_parent.GetCulture.Custom('CZ_Adjective_ou')|l] kulturou už nemám nic společného a před [Select_CString(hated_parent.IsFemale,'vlastní matkou','vlastním otcem')|l] bych si [Select_CString(hostage.IsFemale,'připadala jako cizinka','připadal jako cizinec')|l]. Mnohem bližší jsou mi [hostage.GetCulture.Custom('CZ_Adjective_ee')|l] zvyky, které jsem si tu [Select_CString(hostage.IsFemale,'osvojila','osvojil')|l]."
 bp2_yearly.8050.desc.mid.faith: "víra [Select_CString(hated_parent.IsFemale,'mé matky','mého otce')|l] je [hated_parent.GetFaith.GetName] a má víra je [hostage.GetFaith.GetName]. Jak mám dál tvrdit, že jsem [Select_CString(hated_parent.IsFemale,'její','jeho')|l] [hostage.Custom('GetDaughterSon')|l], když se naše vyznání tak zásadně liší?"
 bp2_yearly.8050.desc.mid.traits: "prostě mám pocit, že toho máme společného mnohem víc než já s lidmi z místa, kterému jsem kdysi [Select_CString(hostage.IsFemale,'říkala','říkal')|l] domov."
 bp2_yearly.8050.desc.outro: "Nemohu se ubránit otázce: Kdo vlastně jsem? Patřím k rodu [hostage.GetHouse.GetName], nebo k rodu [ROOT.Char.GetHouse.GetName]?“"
 bp2_yearly.8050.a: "„Samozřejmě. Jsem přece [Select_CString(ROOT.Char.IsFemale,'tvoje teta','tvůj strýc')|l].“"
 bp2_yearly.8050.b: "„Jsi jen rukojmí, nic víc.“"
 bp2_yearly.8051.t: "Kompromitující dopisy"
 bp2_yearly.8051.desc: "Vstoupím do ložnice [hostage.Custom('CZ_FirstName_G')], ale [Select_CString(hostage.IsFemale,'ji','ho')|l] tam nenajdu. Na [Select_CString(hostage.IsFemale,'jejím','jeho')|l] psacím stole však leží rozházená hromádka rozepsaných dopisů adresovaných do [hostage.GetHomeCourt.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')].\n\nDopisy obsahují podrobnosti o mém dvoře: různé úkryty, informace o tom, kdo mi nosí jídlo, i jména nespokojených služebníků, kteří by mě nejspíš zradili. Otočím se a ve dveřích stojí [hostage.GetFirstNameNoTooltip], [Select_CString(hostage.IsFemale,'vyděšená','vyděšený')|l] jako štvané zvíře, které se chystá prchnout."
 bp2_yearly.8051.a: "„Ach, [Select_CString(hostage.IsFemale,'neteři','synovče')|l], všechno ti odpouštím.“"
 bp2_yearly.8051.b: "„Domů už nikdy nenapíšeš.“"
 bp2_yearly.8051.c: "„Už nikdy neopustíš svůj pokoj!“"
 invalidates_hostage_tt: "[hostage.GetFirstName|U] přestane být [Select_CString(hostage.IsFemale,'tvou rukojmí','tvým rukojmím')|l]"
 bp2_yearly.8052.t: "Šikana"
 bp2_yearly.8052.desc: "Nádvoří zaplňuje důvěrně známý dupot a křik pobíhajících dětí, které si tu hrají. Přes všechen hluk tu panuje zvláštní klid, dokud mě bolestné výkřiky [hostage.Custom('CZ_FirstName_G')] nepřimějí zasáhnout.\n\n„Přestaň! Přestaň! [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')|U], [mean_child.GetFirstName] mě pořád bije!“"
 bp2_yearly.8052.a: "[mean_child.GetFirstNameNoTooltip|U] musí přestat ostatní trýznit."
 bp2_yearly.8052.b: "Povzbudím [hostage.Custom('CZ_FirstNameNoTooltip_A')], aby se [Select_CString(hostage.IsFemale,'bránila','bránil')|l]."
 bp2_yearly.8052.b.success: "[hostage.GetFirstName|U] [Select_CString(hostage.IsFemale,'ocenila','ocenil')|l] tuto lekci"
 bp2_yearly.8052.b.failure: "[hostage.GetFirstName|U] [Select_CString(hostage.IsFemale,'byla zraněna','byl zraněn')|l]"
 bp2_yearly.8052.c: "Je mi to jedno."
 bp2_yearly.8053.t: "Výtečné heslo"
 bp2_yearly.8053.desc: "Děti si opět hrají na nádvoří, tentokrát s dřevěnými meči. [hostage.GetFirstName|U] se neúnavně vrhá na ostatní a snadno přemáhá i několik protivníků najednou.\n\nUprostřed obvyklého dětského křiku náhle zbystřím, když [hostage.GetFirstNameNoTooltip] zvolá: „#EMP [ROOT.Char.GetHouse.GetMotto|U]#!, vy bídáci!“"
 bp2_yearly.8053.a: "To je skvělé heslo."
 bp2_yearly.8053.b: "Tato slova patří na rty jen členům rodu [ROOT.Char.GetHouse.GetNameNoTooltip]!"
 bp2_yearly.8054.t: "Legendy rodu [ROOT.Char.GetHouse.GetNameNoTooltip]"
 bp2_yearly.8054.desc: "Konečně se mi podaří strávit vzácnou chvíli o samotě s [hostage.Custom('CZ_FirstName_I')]. Jako obvykle předávám poučení o světských i duchovních záležitostech, ale [Select_CString(hostage.IsFemale,'dívka','chlapec')|l] má zjevně na mysli něco jiného.\n\n„Tvůj slavný rod mě nesmírně zajímá, [Select_CString(ROOT.Char.IsFemale,'teto','strýčku')|l]. Můžeš mi vyprávět některou z legend rodu [ROOT.Char.GetHouse.GetNameNoTooltip]?“"
 bp2_yearly.8054.a: "[Select_CString(hostage.IsFemale,'Slyšela','Slyšel')|U] jsi už o [ROOT.Char.GetHouse.GetFounder.Custom('CZ_NameNoTooltip_L')]?"
 bp2_yearly.8054.b: "[Select_CString(ROOT.Char.IsFemale,'Sama','Sám')|U] jsem tak trochu legenda."
 bp2_yearly.8054.b.success: "Tvůj příběh udělal dojem na [hostage.Custom('CZ_FirstName_A')]"
 bp2_yearly.8054.b.failure: "[hostage.GetFirstName|U] ti nevěří"
 bp2_yearly.8054.c: "Víš, že jsem kdysi [Select_CString(ROOT.Char.IsFemale,'zabila','zabil')|l] draka?"
 bp2_yearly.8055.t: "Střet povah"
 bp2_yearly.8055.desc: "[hostage.GetFirstName|U] se ke mně v poslední době chová odtažitě a nedůvěřivě a vyhýbá se mi, kdykoli se potkáme. Když se mi konečně podaří zastihnout [Select_CString(hostage.IsFemale,'ji','ho')|l] o samotě, položím [Select_CString(hostage.IsFemale,'jí','mu')|l] soucitně ruku na chladné rameno.\n\n[Select_CString(hostage.IsFemale,'Ona','On')|U] však jen pokrčí rameny a ucouvne. „Co po mně chceš? Každá chvíle, kterou s tebou musím trávit, je utrpení! Ty [ROOT.Char.Custom2('CZ_InsultNoun_V', SCOPE.sC('hostage'))|l]! Nemůžu se dočkat, až odsud vypadnu.“"
 bp2_yearly.8055.a: "Možná se dokážu změnit!"
 bp2_yearly.8055.b: "Smyslem mého života není dělat dojem na [Select_CString(hostage.IsFemale,'ni','něj')|l]."
 bp2_yearly.8055.c: "Pokusím se [hostage.Custom('CZ_FirstName_A')] přesvědčit, aby [Select_CString(hostage.IsFemale,'změnila','změnil')|l] své chování."
 bp2_yearly.8055.c.success: "Přesvědčíš [Select_CString(hostage.IsFemale,'ji','ho')|l] o správnosti svých zásad"
 bp2_yearly.8055.c.failure: "[hostage.GetFirstName|U] [Select_CString(hostage.IsFemale,'je uražená','je uražený')|l]"
 bp2_yearly.8056.t: "Přátelské rukojmí"
 bp2_yearly.8056.desc: "Rozhovory s [hostage.Custom('CZ_FirstName_I')] jsou pro mě čirým potěšením a zdá se, že to cítí stejně. Máme toho tolik společného, až si někdy připadám, jako bychom si četli myšlenky.\n\nPři dnešním vyučování [hostage.GetFirstNameNoTooltip] napjatě poslouchá každé mé slovo. Opravdu je to dítě, které mohu právem nazývat [Select_CString(hostage.IsFemale,'svou neteří','svým synovcem')|l]."
 bp2_yearly.8056.a: "Nádhera."
 bp2_yearly.8056.b: "Konečně někdo, kdo mi #EMP opravdu rozumí#!."
 bp2_yearly.8057.t: "Jako [hostage.Custom('SisterBrother')|l]"
 bp2_yearly.8057.desc: "Na nádvoří si [hostage.GetFirstName] a [nice_child.GetFirstName] spokojeně hrají, jak se na děti sluší. Všude kolem se ozývá štěbetání a šelest, jimiž žije [ROOT.Char.GetFaith.CreatorNamePossessive] svět, a do nich se mísí veselý dětský smích. Všechno je přesně tak, jak má být.\n\nV té poklidné chvíli dokonce zaslechnu, jak [nice_child.GetFirstNameNoTooltip] jen tak mimochodem osloví [hostage.Custom('CZ_FirstNameNoTooltip_A')] „[Select_CString(hostage.IsFemale,'sestro','bratře')|l]“."
 bp2_yearly.8057.a: "To je nádhera."
 bp2_yearly.8057.b: "To si zaslouží pochvalu!"
 bp2_yearly.8060.t: "[Select_CString(ROOT.Char.IsFemale,'Matko','Otče')|U]?"
 bp2_yearly.8060.desc: "[hostage.GetFirstName|U] konečně [Select_CString(hostage.IsFemale,'dospěla','dospěl')|l] a já nemohu být pyšnější, když dnes ráno sleduji, jak sebejistě vstupuje ke dvoru s důstojností a noblesou hodnou mého vlastního potomka. Zda u dvora zůstane, se teprve ukáže. Když však přistoupí, aby mě obvyklým způsobem [Select_CString(hostage.IsFemale,'pozdravila','pozdravil')|l], mám pocit, že přede mnou stojí [Select_CString(hostage.IsFemale,'má vlastní dcera','můj vlastní syn')|l].\n\n„Jaká čest tě vidět, [Select_CString(ROOT.Char.IsFemale,'matko','otče')|l].“ Teprve když dvořané překvapeně zalapají po dechu a začnou si šeptat, [hostage.GetFirstNameNoTooltip] si uvědomí svůj omyl. „Ach, totiž [Select_CString(ROOT.Char.IsFemale,'teto','strýčku')|l]!“"
 bp2_yearly.8060.a: "„Oslovení ‚[Select_CString(ROOT.Char.IsFemale,'matko','otče')|l]‘ mi vyhovuje.“"
 bp2_yearly.8060.b: "„Jsi [Select_CString(hostage.IsFemale,'mou dcerou','mým synem')|l], ale jen na papíře.“"
 bp2_yearly.8060.c: "„Vždycky budu [Select_CString(ROOT.Char.IsFemale,'tvou tetou','tvým strýcem')|l].“"
 bp2_yearly.8061.t: "Navždy [Select_CString(ROOT.Char.IsFemale,'tetou','strýcem')|l]"
 bp2_yearly.8061.desc: "Je to už dávno, co [hostage.GetFirstName] poprvé [Select_CString(hostage.IsFemale,'přišla','přišel')|l] ke dvoru a [Select_CString(hostage.IsFemale,'našla','našel')|l] ve mně [Select_CString(ROOT.Char.IsFemale,'tetu','strýce')|l]. Když dnes vidím, že [Select_CString(hostage.IsFemale,'z ní vyrostla dospělá žena','z něj vyrostl dospělý muž')|l], cítím k [Select_CString(hostage.IsFemale,'ní','němu')|l] tak silné rodinné pouto, jako by nás spojovala stejná krev.\n\n[hostage.GetFirstNameNoTooltip|U] přede mnou u dvora poklekne a přísahá mi věčnou věrnost jako [Select_CString(ROOT.Char.IsFemale,'své nejoblíbenější tetě','svému nejoblíbenějšímu strýci')|l]."
 bp2_yearly.8061.a: "Nádhera."
 bp2_yearly.8063.t: "Zatrpklé rukojmí"
 bp2_yearly.8063.desc: "Je to už dávno, co [hostage.GetFirstName] poprvé [Select_CString(hostage.IsFemale,'přišla','přišel')|l] ke dvoru a [Select_CString(hostage.IsFemale,'našla','našel')|l] ve mně [Select_CString(ROOT.Char.IsFemale,'tetu','strýce')|l]. Dnes už je [Select_CString(hostage.IsFemale,'dospělou ženou','dospělým mužem')|l] a sotva snese pohled na mě. Když [hostage.GetFirstNameNoTooltip] sedí u dvora, v [Select_CString(hostage.IsFemale,'jejích','jeho')|l] očích vidím nenávist a zášť, za něž zřejmě může jen má nezdařená snaha vychovat [Select_CString(hostage.IsFemale,'ji','ho')|l] podle zásad, jimiž se řídí rod [ROOT.Char.GetHouse.GetNameNoTooltip]."
 bp2_yearly.8063.a: "A jéje."
 bp2_yearly.8065.t: "[ROOT.Char.Custom2('AppropriateGreetingNegative', ROOT.Char)|U]"
 bp2_yearly.8065.desc: "Už dlouho vím, že [new_parent.GetFirstName] je pro mě [Select_CString(new_parent.IsFemale,'skutečnou matkou','skutečným otcem')|l], a konečně jsme to stvrdili písemně. Ode dneška už nepatřím ke svému původnímu rodu a jsem plnoprávnou součástí rodu [new_parent.GetHouse.GetName]."
 bp2_yearly.8065.a: "Šílenství!"
 rival_manipulated_me: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer,'ses ','se ')|l][Select_CString(TARGET_CHARACTER.IsFemale,'pokusila','pokusil')|l] manipulovat s [CHARACTER.Custom('CZ_ShortUIName_I')]"
 rival_manipulated_me_corresponding: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer,'ses ','se ')|l][Select_CString(CHARACTER.IsFemale,'pokusila','pokusil')|l] manipulovat s [TARGET_CHARACTER.Custom('CZ_ShortUIName_I')]"
 friend_deep_understanding: "Mezi [CHARACTER.Custom('CZ_ShortUIName_I')] a [TARGET_CHARACTER.Custom('CZ_ShortUIName_I')] vzniklo hluboké vzájemné porozumění"
 rival_chastised_child: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer,'jsi ','')|l][Select_CString(CHARACTER.IsFemale,'pokárala','pokáral')|l] [TARGET_CHARACTER.Custom('CZ_ShortUIName_A')]"
 rival_chastised_child_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer,'jsi ','')|l][Select_CString(TARGET_CHARACTER.IsFemale,'pokárala','pokáral')|l] [CHARACTER.Custom('CZ_ShortUIName_A')]"
 bp2_security_compromised: "Ohrožená bezpečnost"
 bp2_security_compromised_desc: "Tato postava zjistila, že někdo u dvora vyzrazuje citlivé informace."
 bp2_start_loyalty_story_cycle: "[hostage.GetFirstName|U] si začne klást otázku, komu vlastně dluží věrnost."
 bp2_make_hostage_more_loyal: "Až [hostage.GetFirstName] dospěje, s větší pravděpodobností ti zachová věrnost."
 bp2_make_hostage_less_loyal: "Až [hostage.GetFirstName] dospěje, s menší pravděpodobností ti zachová věrnost."
 hostage_loyalty: "Loajální rukojmí"
