l_polish:
 bp2_hostage_system.0100.t: "Za každou cenu"
 bp2_hostage_system.0100.intro: "[war.Custom('WarCasusBelliShort')|U] je nyní v plném proudu a já musím rozhodnout o osudu svého rukojmí [hostage.Custom('CZ_FirstName_G')]. [hostage.GetFirstName|U] je totiž [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] [hostage_home_court.Custom('CZ_TitledFirstName_G')].\n\n"
 bp2_hostage_system.0100.desc: "Každá rána, kterou mohu zasadit těm [hostage_home_court.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_yym')] ničemům, je vítaná. [hostage_home_court.GetFirstNameNoTooltip|U] za to může vinit jen [Select_CString(hostage_home_court.IsFemale,'samu sebe','sám sebe')|l]."
 bp2_hostage_system.0100.executed_hostage: "Ten ničema nechal popravit [victim.Custom('CZ_FirstName_A')]! [victim.GetFirstName|U] je přece [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim'))]! Spravedlnost si žádá nemilosrdnou odplatu..."
 bp2_hostage_system.0100.spared_hostage: "[hostage_home_court.GetFirstNameNoTooltip|U] [Select_CString(hostage_home_court.IsFemale,'prokázala','prokázal')|l] milost [my_hostage.Custom('CZ_FirstName_D')], ačkoli [my_hostage.GetFirstNameNoTooltip] je [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))]. Možná bychom měli své spory řešit výhradně na bojišti..."
 bp2_hostage_system.0100.my_hostage: "\n\nAle co bude s [my_hostage.Custom('CZ_FirstName_I')]? [my_hostage.GetFirstName|U] je [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] a nyní je [Select_CString(my_hostage.IsFemale,'vydána','vydán')|l] napospas [hostage_home_court.Custom('CZ_TitledFirstNameNoTooltip_D')]..."
 bp2_hostage_system.0100.a: "Už jsem se [Select_CString(ROOT.Char.IsFemale,'rozhodla','rozhodl')]."
 bp2_hostage_system.0100.b: "[hostage.GetFirstNameNoTooltip|U] je prozatím v bezpečí."
 bp2_hostage_system.0110.t: "Prázdný slib"
 bp2_hostage_system.0110.desc: "[hostage_home_court.GetTitledFirstName|U] mi [Select_CString(hostage_home_court.IsFemale,'poslala','poslal')|l] na dvůr [hostage.Custom('CZ_FirstName_A')], ačkoli [hostage.GetFirstNameNoTooltip] je [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] [hostage_home_court.Custom('CZ_TitledFirstName_G')]. Přesto tento proradný [hostage_home_court.Custom2('InsultNoun', ROOT.Char)] proti mně rozpoutává válku [CZPrepZ(hostage_home_court.GetPrimaryTitle.GetNameNoTierNoTooltip)] [hostage_home_court.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')].\n\n[hostage_home_court.GetFirstNameNoTooltip|U] mě zřejmě považuje za slaboduchého zbabělce, nebo [Select_CString(hostage_home_court.IsFemale,'jí','mu')|l] na osudu [hostage.Custom('CZ_FirstName_G')] vůbec nezáleží. Jak jinak si vysvětlit, že proti strážci vlastního rukojmí vede [war.Custom('WarCasusBelliShort')]?"
 bp2_hostage_system.0110.a: "[hostage_home_court.GetFirstNameNoTooltip|U] [Select_CString(hostage_home_court.IsFemale,'učinila','učinil')|l] své rozhodnutí."
 bp2_hostage_system.0110.b: "Není třeba jednat ukvapeně..."
 bp2_hostage_system.0120.t: "Nepřítel mého přítele"
 bp2_hostage_system.0120.intro: "Události se obracejí proti mému rukojmí [hostage.Custom('CZ_FirstName_G')], které je [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] [hostage_home_court.Custom('CZ_TitledFirstName_G')]. Ačkoli jsem [hostage.Custom('CZ_FirstName_A')] [Select_CString(hostage.IsFemale,'přijala','přijal')|l] na svůj dvůr s čestnými úmysly, nyní musím dostát také svým závazkům vůči [war_joiner_ally.Custom('CZ_TitledFirstName_D')]. Vždyť probíhá [war.Custom('WarCasusBelliShort')]...\n\n"
 bp2_hostage_system.0120.desc: "Mým cílem bylo zachovat mír [CZPrepS(hostage_home_court.GetPrimaryTitle.GetNameNoTierNoTooltip)] [hostage_home_court.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_I')], ale nyní už s tím nic nenadělám. Milosrdenství by snad mohlo uchovat alespoň špetku vzájemné důvěry, jenže ve válce je dovoleno všechno."
 bp2_hostage_system.0120.a: "Situace se změnila."
 bp2_hostage_system.0120.b: "Tohle je spor mezi [war_joiner_ally.Custom('CZ_FirstName_I')] a [hostage_home_court.Custom('CZ_FirstName_I')]..."
 bp2_hostage_system.0130.t: "Přítel mého nepřítele"
 bp2_hostage_system.0130.desc: "Dozvídám se, že [hostage_home_court.GetTitledFirstName] se pošetile [Select_CString(hostage_home_court.IsFemale,'přidala','přidal')|l] k mému nepříteli [war_joiner_ally.Custom('CZ_TitledFirstName_D')], přestože mi [Select_CString(hostage_home_court.IsFemale,'svěřila','svěřil')|l] jako rukojmí [hostage.Custom('CZ_FirstName_A')]. [hostage.GetFirstName|U] je přitom [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] [hostage_home_court.Custom('CZ_TitledFirstName_G')].\n\nTato malicherná [war.Custom('WarCasusBelliShort')] jasně ukázala, jakou cenu mají [Select_CString(hostage_home_court.IsFemale,'její','jeho')|l] sliby míru. O bezcitné lhostejnosti k osudu [hostage.Custom('CZ_FirstName_G')] ani nemluvě."
 bp2_hostage_system.0130.a: "Mé hrozby nejsou plané."
 bp2_hostage_system.0130.b: "Nic není jen černé nebo bílé."
 bp2_hostage_system.0140.opening: "[executioner.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp2_hostage_system.0140.attacker: "Tvůj ubohý pokus oklamat mě sliby míru dnes končí. [hostage.GetFirstName|U], [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] [hostage_home_court.Custom('CZ_TitledFirstName_G')], za tvou proradnost zaplatí životem. Kéž [executioner.GetFaith.PositiveAfterLife|U] poskytne [hostage.Custom('CZ_FirstName_D')] více pokoje, než jaký [Select_CString(hostage.IsFemale,'poznala','poznal')|l] na tomto světě."
 bp2_hostage_system.0140.defender: "Ani to, že jsi mi [Select_CString(hostage_home_court.IsFemale,'svěřila','svěřil')|l] [hostage.Custom('CZ_FirstName_A')] jako rukojmí, tě neodradilo od nečestného vpádu do mé země. [hostage.GetFirstName|U] je přitom [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] [hostage_home_court.Custom('CZ_TitledFirstName_G')]. Takovou zradu mohu potrestat jediným způsobem. Kéž ti [hostage.GetFirstNameNoTooltip] i [executioner.GetFaith.HighGodName] odpustí."
 bp2_hostage_system.0140.attacker_ally: "Kvůli [war_joiner_ally.Custom('CZ_TitledFirstName_D')] jsme se ocitli ve válce. Mám ve své moci [hostage.Custom('CZ_FirstName_A')], tvé rukojmí. [hostage.GetFirstName|U] je [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] [hostage_home_court.Custom('CZ_TitledFirstName_G')], ale za tuto válku nyní zaplatí životem."
 bp2_hostage_system.0140.defender_ally: "Tvá zrada stála [hostage.Custom('CZ_FirstName_A')] život. [hostage.GetFirstName|U] je přitom [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] [hostage_home_court.Custom('CZ_TitledFirstName_G')]. Jen doufám, že ti přátelství s [war_joiner_ally.Custom('CZ_TitledFirstName_I')] za tuto cenu stálo."
 bp2_hostage_system.0140.a.attacker: "To není možné..."
 bp2_hostage_system.0140.a.defender: "Za tohle zaplatíš..."
 bp2_hostage_system.0140.a.attacker_ally: "Jak jen [Select_CString(executioner.IsFemale,'ona','on')|l] [Select_CString(executioner.IsFemale,'mohla','mohl')|l]..."
 bp2_hostage_system.0140.a.defender_ally: "Jaká bezcitnost..."
 bp2_hostage_system.0141.opening: "[hostage_sparer.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp2_hostage_system.0141.intro: "[Select_CString(hostage_sparer.IsFemale,'Rozhodla','Rozhodl')|U] jsem se ušetřit [hostage.Custom('CZ_FirstName_A')]. [hostage.GetFirstName|U] je přece [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))]. "
 bp2_hostage_system.0141.attacker: "Není to nic víc než nevinná figurka ve tvých proradných hrách."
 bp2_hostage_system.0141.defender: "A to navzdory tvému zrádnému útoku, jímž jsi [Select_CString(ROOT.Char.IsFemale,'pošlapala','pošlapal')|l] naše dohody."
 bp2_hostage_system.0141.attacker_ally: "Nemusí přece trpět kvůli [war_joiner_ally.Custom('CZ_TitledFirstName_D')]."
 bp2_hostage_system.0141.defender_ally: "Nemusí přece trpět kvůli [war_joiner_ally.Custom('CZ_TitledFirstName_D')]."
 bp2_hostage_system.0141.request: "\n\nVěřím, že stejnou milost projevíš i [my_hostage.Custom('CZ_FirstName_D')]. [my_hostage.GetFirstName|U] je přece [spared.Custom2('RelationToMe', SCOPE.sC('my_hostage'))]."
 bp2_hostage_system.0141.a.attacker: "Kéž [ROOT.Char.GetFaith.HighGodName] přijme mé díky..."
 bp2_hostage_system.0141.a.defender: "Možná v [hostage_sparer.Custom('CZ_FirstName_L')] přece jen je něco dobrého..."
 bp2_hostage_system.0141.a.attacker_ally: "To se mi ulevilo..."
 bp2_hostage_system.0141.a.defender_ally: "Alespoň něco..."
 bp2_hostage_system.0200.t: "Dospělost"
 bp2_hostage_system.0200.desc: "Mé rukojmí [hostage.GetFirstName] už [Select_CString(hostage.IsFemale,'dospělo v ženu','dospělo v muže')|l] a těší se, že se podle zvyku brzy vrátí domů. Nepochybně v to doufá i [hostage_home_court.GetTitledFirstName], [hostage.Custom2('RelationToMe', SCOPE.sC('hostage_home_court'))] [hostage.Custom('CZ_FirstName_G')]."
 bp2_hostage_system.0200.my_hostage: "\n\nMožná by skutečně bylo lepší zachovat dobré vztahy, alespoň dokud [my_hostage.GetFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] – zůstává v [hostage_home_court.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_eem')|l] zajetí..."
 bp2_hostage_system.0200.closing: "\n\nMusím však myslet především na zájmy #EMP vlastního#! rodu."
 bp2_hostage_system.0200.a: "Sbal si věci, je čas vrátit se domů."
 bp2_hostage_system.0200.b: "[hostage.GetFirstNameNoTooltip|U] tu ještě nějakou dobu zůstane."
 bp2_hostage_system.0200.b.my_hostage: "Až se [my_hostage.GetFirstNameNoTooltip] vrátí domů, propustím i [hostage.Custom('CZ_FirstNameNoTooltip_A')]."
 hostage_more_likely_to_return_tt: "[hostage_home_court.GetTitledFirstName|U] s větší pravděpodobností propustí [my_hostage.Custom('CZ_FirstName_A')] domů"
 bp2_hostage_system.0201.desc: "[hostage.GetTitledFirstName|U] se konečně vrací domů, nyní už jako [Select_CString(hostage.IsFemale,'dospělá žena','dospělý muž')|l]! [hostage.GetFirstNameNoTooltip|U] je přece [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))] a [Select_CString(hostage.IsFemale,'byla','byl')|l] [hostage_warden.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_eem')|l] rukojmím. Dohoda s [hostage_warden.Custom('CZ_TitledFirstName_I')] je u konce a [hostage.GetFirstNameNoTooltip] je konečně v bezpečí."
 bp2_hostage_system.0201.my_hostage_adult: "\n\n[my_hostage.GetFirstName|U] je [hostage_warden.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] [hostage_warden.Custom('CZ_FirstName_G')] a nadále zůstává mým rukojmím, ačkoli už [Select_CString(my_hostage.IsFemale,'dospěla v ženu','dospěl v muže')|l]. Při pohledu na návrat [hostage.Custom('CZ_FirstName_G')] domů je v [Select_CString(my_hostage.IsFemale,'jejích','jeho')|l] očích patrná jistá závist. Bylo by spravedlivé propustit i [my_hostage.Custom('CZ_FirstName_A')]..."
 bp2_hostage_system.0201.my_hostage: "\n\n[my_hostage.GetFirstName|U] je [hostage_warden.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] [hostage_warden.Custom('CZ_FirstName_G')] a nadále zůstává mým rukojmím, ačkoli je zatím jen [Select_CString(my_hostage.IsFemale,'malou dívkou','malým chlapcem')|l]."
 bp2_hostage_system.0201.a: "Máme si toho tolik co vyprávět!"
 bp2_hostage_system.0201.b: "[my_hostage.GetFirstNameNoTooltip|U] se může vrátit také."
 bp2_hostage_system.0201.c: "Možná až [my_hostage.GetFirstNameNoTooltip] trochu povyroste."
 bp2_hostage_system.0201.c.adult: "To si nemyslím."
 bp2_hostage_system.0202.t: "Očekávaný návrat"
 bp2_hostage_system.0202.desc: "S nadějí jsem [Select_CString(ROOT.Char.IsFemale,'vyhlížela','vyhlížel')|l] blížící se narozeniny [hostage.Custom('CZ_FirstName_G')]. [hostage.GetFirstName|U] je přece [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))] a podle zvyku se rukojmí po dosažení dospělosti vracejí domů.\n\nBohužel se zdá, že [hostage_warden.GetTitledFirstName] hodlá [hostage.Custom('CZ_FirstNameNoTooltip_A')] ponechat [CZPrepV(hostage_warden.GetCapitalLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(hostage_warden.GetCapitalLocation,'L')] ještě nějakou dobu...\n\n"
 bp2_hostage_system.0202.a: "Jistě k tomu má dobrý důvod."
 bp2_hostage_system.0203.t: "Znovu doma"
 bp2_hostage_system.0203.desc: "S jistým napětím jsem [Select_CString(ROOT.Char.IsFemale,'očekávala','očekával')|l] odpověď od [hostage_home_court.Custom('CZ_TitledFirstName_G')], když jsem [Select_CString(ROOT.Char.IsFemale,'poslala','poslal')|l] domů [hostage.Custom('CZ_FirstName_A')]. [hostage.GetFirstName|U] je totiž [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] [hostage_home_court.Custom('CZ_TitledFirstName_G')].\n\n"
 bp2_hostage_system.0203.closing: "Odpověď však přišla rychle a zanedlouho se u mé brány objevuje [my_hostage.GetFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))]!"
 bp2_hostage_system.0204.t: "V nejistotě"
 bp2_hostage_system.0204.closing: "Odpověď byla jasná. [hostage_home_court.GetTitledFirstName|U] si bohužel musí pro zachování míru ponechat [my_hostage.Custom('CZ_FirstName_A')] ještě na neurčitou dobu. [my_hostage.GetFirstName|U] je přitom [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))]..."
 bp2_hostage_system.0204.a: "Chudák [Select_CString(my_hostage.IsFemale,'holka','kluk')|l]..."
 bp2_hostage_system.0300.t: "Pod mou ochranou"
 bp2_hostage_system.0300.intro: "Za bezpečí rukojmí odpovídá jeho strážce. Je to jeho povinnost i čestný závazek. [Select_CString(ROOT.Char.IsFemale,'Přísahala jsem','Přísahal jsem')|U] chránit [hostage.Custom('CZ_FirstName_A')] před veškerým nebezpečím,"
 bp2_hostage_system.0300.killer: "a přesto jsem [hostage.Custom('CZ_FirstName_A')] [Select_CString(ROOT.Char.IsFemale,'zabila','zabil')|l]."
 bp2_hostage_system.0300.violent: "ale [hostage.GetFirstName] [Select_CString(hostage.IsFemale,'zemřela','zemřel')|l] u mého dvora obzvlášť strašlivou smrtí."
 bp2_hostage_system.0300.fallback: "a přesto tu nyní [hostage.GetFirstName] [Select_CString(hostage.IsFemale,'leží mrtvá','leží mrtvý')|l]."
 bp2_hostage_system.0300.desc: "\n\nUž se nedá nic dělat. [hostage_home_court.GetTitledFirstName|U] se jistě rozzuří, jakmile zpráva dorazí na [hostage_home_court.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_yy')|l] dvůr. Naše dohody tím nejspíš vezmou za své."
 bp2_hostage_system.0300.my_hostage: "\n\nJen doufám, že [hostage_home_court.GetTitledFirstName] nebude chtít vykonat pomstu na [my_hostage.Custom('CZ_FirstName_L')]. [my_hostage.GetFirstName|U] je přece [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))]."
 bp2_hostage_system.0300.a.killer: "No, co se dá dělat..."
 bp2_hostage_system.0300.a.violent: "Jaké neštěstí..."
 bp2_hostage_system.0300.a: "Tragédie..."
 bp2_hostage_system.0301.opening: "[hostage_warden.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp2_hostage_system.0301.intro: "S hlubokou lítostí ti oznamuji, že [hostage.GetFirstName] [Select_CString(hostage.IsFemale,'zemřela','zemřel')|l]. [hostage.GetFirstNameNoTooltip|U] je přece [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))].\n\n"
 bp2_hostage_system.0301.killer: "Věz, že jsem [Select_CString(hostage_warden.IsFemale,'neměla','neměl')|l] jinou možnost než [hostage.Custom('CZ_FirstName_A')] připravit o život."
 bp2_hostage_system.0301.violent: "Způsob, jakým [hostage.GetFirstName] [Select_CString(hostage.IsFemale,'opustila','opustil')|l] tento svět pod mou ochranou, mě bude pronásledovat navždy."
 bp2_hostage_system.0301.fallback: "Odpusť mi, že jsem tak žalostně [Select_CString(hostage_warden.IsFemale,'selhala','selhal')|l] ve své povinnosti chránit [hostage.Custom('CZ_FirstName_A')]."
 bp2_hostage_system.0301.desc: "Doufám, že mi jednoho dne dokážeš odpustit. Pro dobro nás obou."
 bp2_hostage_system.0301.my_hostage: "\n\nAť už se zde stalo cokoli, [my_hostage.GetFirstName] na tom nenese žádnou vinu. [my_hostage.GetFirstNameNoTooltip|U] je přece [hostage_warden.Custom2('RelationToMe', SCOPE.sC('my_hostage'))]."
 bp2_hostage_system.0301.a.killer: "[Select_CString(hostage_warden.IsFemale,'Ta... #EMP mrcha!#!','Ten... #EMP parchant!#!')|U]"
 bp2_hostage_system.0301.a.violent: "[hostage.GetFirstNameNoTooltip|U]... proč...?"
 bp2_hostage_system.0301.a: "To není možné..."
 bp2_hostage_system.0301.b: "Oko za oko!"
 bp2_hostage_system.0400.t: "Změna okolností"
 bp2_hostage_system.0400.landed_hostage: "Mé rukojmí [hostage.GetFirstName] právě [Select_CString(hostage.IsFemale,'zdědila','zdědil')|l] [hostage.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_A')], a já se tak najednou starám o [hostage.Custom('CZ_TitleAsNameNoTooltip_A')]!"
 bp2_hostage_system.0400.ruler_hostage: "Mé rukojmí [hostage.GetFirstName] nyní spravuje vlastní [hostage.GetDomicile.GetType.GetName|l], a já se tak najednou starám o [hostage.Custom('CZ_TitleAsNameNoTooltip_A')]!"
 bp2_hostage_system.0400.imprisoned_hostage_self: "Mé někdejší rukojmí [hostage.GetFirstName] nyní chřadne v mém žaláři. Tím je má dohoda s [home_court.Custom('CZ_TitledFirstName_I')] definitivně u konce."
 bp2_hostage_system.0400.imprisoned_hostage_fail: "Mé někdejší rukojmí [hostage.GetFirstName] [Select_CString(hostage.IsFemale,'unikla','unikl')|l] mému pokusu o uvěznění. Tím je má dohoda s [home_court.Custom('CZ_TitledFirstName_I')] definitivně u konce."
 bp2_hostage_system.0400.imprisoned_hostage: "Mé rukojmí [hostage.GetFirstName] nyní chřadne v žaláři [imprisoner.Custom('CZ_TitledFirstName_G')]. Má dohoda s [home_court.Custom('CZ_TitledFirstName_I')] tak náhle ztratila smysl."
 bp2_hostage_system.0400.unrelated_hostage: "Mé rukojmí [hostage.GetFirstName] už pro [home_court.Custom('CZ_TitledFirstName_A')] nemá žádný význam. Naše dohoda tak náhle ztratila smysl."
 bp2_hostage_system.0400.unlanded_warden_title: "Ztrátou [lost_title.Custom('CZ_LandedNameNoTierNoTooltip_G')] pozbyla má dohoda s [home_court.Custom('CZ_TitledFirstName_I')] smyslu. [home_court.GetFirstNameNoTooltip|U] je přitom [hostage.Custom2('RelationToMe', SCOPE.sC('home_court'))] mého rukojmí [hostage.Custom('CZ_FirstName_G')]."
 bp2_hostage_system.0400.unlanded_warden: "Ztrátou všech svých území jsem [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')|l] i o důvod udržovat dohodu s [home_court.Custom('CZ_TitledFirstName_I')]. [home_court.GetFirstNameNoTooltip|U] je přitom [hostage.Custom2('RelationToMe', SCOPE.sC('home_court'))] mého rukojmí [hostage.Custom('CZ_FirstName_G')]."
 bp2_hostage_system.0400.unlanded_home_court_title: "[home_court.GetTitledFirstName|U], [hostage.Custom2('RelationToMe', SCOPE.sC('home_court'))|l] mého rukojmí [hostage.Custom('CZ_FirstName_G')], [Select_CString(home_court.IsFemale,'přišla','přišel')|l] o svá [lost_title.Custom('CZ_AdjectiveNoTooltip_ee')|l] území. Naše dohoda tím náhle ztratila smysl."
 bp2_hostage_system.0400.unlanded_home_court: "[home_court.GetTitledFirstName|U], [hostage.Custom2('RelationToMe', SCOPE.sC('home_court'))|l] mého rukojmí [hostage.Custom('CZ_FirstName_G')], [Select_CString(home_court.IsFemale,'přišla','přišel')|l] o všechna svá území. Naše dohoda tím náhle ztratila smysl."
 bp2_hostage_system.0400.dead_home_court: "[home_court.GetTitledFirstName|U], [hostage.Custom2('RelationToMe', SCOPE.sC('home_court'))|l] mého rukojmí [hostage.Custom('CZ_FirstName_G')], [Select_CString(home_court.IsFemale,'zemřela','zemřel')|l], aniž by [Select_CString(home_court.IsFemale,'zajistila','zajistil')|l] nástupnictví rodu [home_court.GetHouse.GetBaseNameNoTooltip]. Naše dohoda tím náhle ztratila smysl."
 bp2_hostage_system.0400.imprisoned_self: "\n\n[home_court.GetFirstNameNoTooltip|U] z toho nebude mít radost..."
 bp2_hostage_system.0400.imprisoned: "\n\n[hostage.GetFirstNameNoTooltip|U] se jistě brzy dostane na svobodu..."
 bp2_hostage_system.0400.ruler: "\n\n[hostage.GetFirstNameNoTooltip|U] brzy odjede převzít svůj trůn [CZPrepV(hostage.GetCapitalLocation.GetNameNoTooltip)|l] [CZProvName(hostage.GetCapitalLocation,'L')]."
 bp2_hostage_system.0400.family: "\n\n[hostage.GetFirstNameNoTooltip|U] může svobodně odejít a vrátit se ke své rodině, pokud si to bude přát."
 bp2_hostage_system.0400.no_family: "\n\n[hostage.GetFirstNameNoTooltip|U] může svobodně odejít, ale [Select_CString(hostage.IsFemale,'její','jeho')|l] další osud zůstává nejistý."
 bp2_hostage_system.0400.adopted: "Mé někdejší rukojmí [hostage.GetFirstName] je nyní [Select_CString(hostage.IsFemale,'považována','považován')|l] za plnoprávnou součást rodu [ROOT.Char.GetHouse.GetBaseName]. Původní dohoda s [home_court.Custom('CZ_TitledFirstName_I')] tak pozbyla smyslu."
 bp2_hostage_system.0400.adopted_stay: "\n\n[hostage.GetFirstNameNoTooltip|U] se přesto [Select_CString(hostage.IsFemale,'rozhodla','rozhodl')|l] prozatím dobrovolně zůstat na mém dvoře [CZPrepV(ROOT.Char.GetCapitalLocation.GetNameNoTooltip)|l] [CZProvName(ROOT.Char.GetCapitalLocation,'L')]."
 bp2_hostage_system.0400.my_hostage: "\n\nOčekávám, že se mi na oplátku vrátí i [my_hostage.GetFirstName], [warden.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] [warden.Custom('CZ_FirstName_G')]."
 bp2_hostage_system.0400.a: "Nedá se nic dělat."
 bp2_hostage_system.0400.b: "A já [Select_CString(hostage.IsFemale,'ji','ho')|l] tu [Select_CString(ROOT.Char.IsFemale,'ráda','rád')|l] přivítám!"
 bp2_hostage_system.0400.home: "[hostage.GetFirstNameNoTooltip|U] odchází"
 bp2_hostage_system.0401.landed_hostage: "[hostage.GetFirstName|U], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))], právě [Select_CString(hostage.IsFemale,'zdědila','zdědil')|l] [hostage.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_A')]. [warden.GetTitledFirstName|U] se tak najednou stará o [hostage.Custom('CZ_TitleAsNameNoTooltip_A')]!"
 bp2_hostage_system.0401.ruler_hostage: "[hostage.GetFirstName|U], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))], nyní spravuje vlastní [hostage.GetDomicile.GetType.GetName|l]. [warden.GetTitledFirstName|U] se tak najednou stará o [hostage.Custom('CZ_TitleAsNameNoTooltip_A')]!"
 bp2_hostage_system.0401.imprisoned_hostage_self: "Dozvídám se, že [warden.GetTitledFirstName] [Select_CString(warden.IsFemale,'uvěznila','uvěznil')|l] [hostage.Custom('CZ_FirstName_A')]! [hostage.GetFirstName|U] je přece [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))], a [warden.GetFirstNameNoTooltip] mi [Select_CString(warden.IsFemale,'slíbila','slíbil')|l], že se o [Select_CString(hostage.IsFemale,'ni','něj')|l] jako o rukojmí postará. Jaká nehoráznost!"
 bp2_hostage_system.0401.imprisoned_hostage_fail: "Dozvídám se, že [hostage.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))], jen o vlásek [Select_CString(hostage.IsFemale,'unikla','unikl')|l] uvěznění ze strany svého strážce [imprisoner.Custom('CZ_TitledFirstName_G')]!"
 bp2_hostage_system.0401.imprisoned_hostage: "[hostage.GetFirstName|U], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))], nyní chřadne v žaláři [imprisoner.Custom('CZ_TitledFirstName_G')]. Má dohoda s [warden.Custom('CZ_TitledFirstName_I')] tak náhle ztratila smysl."
 bp2_hostage_system.0401.unrelated_hostage: "[hostage.GetFirstName|U] [Select_CString(hostage.IsFemale,'byla poslána','byl poslán')|l] z mého dvora jako [warden.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_ee')|l] rukojmí, ale nyní už nemá žádnou spojitost s [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_I')]. Naše dohoda s [warden.Custom('CZ_TitledFirstName_I')] tak náhle ztratila smysl."
 bp2_hostage_system.0401.unlanded_home_court_title: "Ztrátou [lost_title.Custom('CZ_LandedNameNoTierNoTooltip_G')] pozbyla má dohoda s [warden.Custom('CZ_TitledFirstName_I')] smyslu. [warden.GetFirstNameNoTooltip|U] má přitom v péči [hostage.Custom('CZ_FirstName_A')], [home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))]."
 bp2_hostage_system.0401.unlanded_home_court: "Ztrátou všech svých území jsem [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')|l] i o důvod udržovat dohodu s [warden.Custom('CZ_TitledFirstName_I')]. [warden.GetFirstNameNoTooltip|U] je přitom [hostage.Custom2('RelationToMe', SCOPE.sC('warden'))] mého rukojmí [hostage.Custom('CZ_FirstName_G')]."
 bp2_hostage_system.0401.unlanded_warden_title: "[warden.GetTitledFirstName|U], [hostage.Custom2('RelationToMe', SCOPE.sC('warden'))|l] mého rukojmí [hostage.Custom('CZ_FirstName_G')], [Select_CString(warden.IsFemale,'přišla','přišel')|l] o svá [lost_title.Custom('CZ_AdjectiveNoTooltip_ee')|l] území. Naše dohoda tím náhle ztratila smysl."
 bp2_hostage_system.0401.unlanded_warden: "[warden.GetTitledFirstName|U], [hostage.Custom2('RelationToMe', SCOPE.sC('warden'))|l] mého rukojmí [hostage.Custom('CZ_FirstName_G')], [Select_CString(warden.IsFemale,'přišla','přišel')|l] o všechna svá území. Naše dohoda tím náhle ztratila smysl."
 bp2_hostage_system.0401.dead_warden: "[warden.GetTitledFirstName|U], [Select_CString(warden.IsFemale,'strážkyně','strážce')|l] [hostage.Custom('CZ_FirstName_G')], [Select_CString(warden.IsFemale,'zemřela','zemřel')|l], aniž by [Select_CString(warden.IsFemale,'zajistila','zajistil')|l] nástupnictví rodu [warden.GetHouse.GetBaseNameNoTooltip]. [hostage.GetFirstName|U] je přitom [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))]."
 bp2_hostage_system.0401.imprisoned: "\n\nKéž [ROOT.Char.GetFaith.HighGodName|U] dopřeje [hostage.Custom('CZ_FirstNameNoTooltip_D')] brzké propuštění."
 bp2_hostage_system.0401.imprisoned_fail: "\n\nTakhle se s rukojmím rozhodně zacházet nemá! Bezpečný návrat [hostage.Custom('CZ_FirstNamePossessiveNoTooltip_M')] však považuji za požehnání."
 bp2_hostage_system.0401.adopted: "Donesly se ke mně zvěsti, že [hostage.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))], se nyní považuje za součást rodu [hostage.GetHouse.GetBaseName]! [warden.GetTitledFirstName|U] je [warden.Custom2('InsultNoun', ROOT.Char)|l] a jistě [hostage.Custom('CZ_FirstName_D')] [Select_CString(warden.IsFemale,'otrávila','otrávil')|l] mysl!"
 bp2_hostage_system.0401.adopted_stay: "\n\nDokonce se povídá, že [hostage.GetFirstNameNoTooltip] považuje za svůj #EMP skutečný domov#! [CZProvName(warden.GetCapitalLocation,'A')], a nikoli [CZProvName(ROOT.Char.GetCapitalLocation,'A')]!"
 bp2_hostage_system.0401.a: "Budiž."
 bp2_hostage_system.0401.b: "Zrada!"
 bp2_hostage_system.0402.inherited: "Dnes ráno dorazila zpráva [CZPrepZ(ROOT.Char.GetCapitalLocation.GetNameNoTooltip)|l] [CZProvNameNoTooltip(ROOT.Char.GetCapitalLocation,'G')]. [Select_CString(home_court.IsFemale,'Má','Můj')|U] [hostage.Custom2('RelationToMe', SCOPE.sC('home_court'))|l], [home_court.GetTitledFirstName], [Select_CString(home_court.IsFemale,'zemřela','zemřel')|l]...\n\nPrý [home_court.GetDeathReasonHideKiller|l].\n\n[warden.GetTitledFirstName|U] mi [Select_CString(warden.IsFemale,'dala','dal')|l] svolení k odjezdu. Jako [Select_CString(ROOT.Char.IsFemale,'dědička','dědic')|l] [home_court.Custom('CZ_FirstNameNoTooltip_G')] musím najít sílu ujmout se vlády v zemi zvané [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]."
 bp2_hostage_system.0402.dead: "\n\nUž nikdy nespatřím [home_court.Custom('CZ_TitledFirstName_A')]..."
 bp2_hostage_system.0402.a: "Musíme vyrazit."
 bp2_hostage_system.0410.t: "Obrat osudu"
 bp2_hostage_system.0410.desc: "Postavení [home_court.Custom('CZ_TitledFirstName_G')] se změnilo. [home_court.GetFirstNameNoTooltip|U] je [hostage.Custom2('RelationToMe', SCOPE.sC('home_court'))|l] mého rukojmí [hostage.Custom('CZ_FirstName_G')], ale nyní už má jen postavení [home_court.GetTitleAsNameNoTooltip].\n\nNaši dohodu jsme uzavírali za zcela jiných okolností. Možná by bylo moudré ji přehodnotit..."
 bp2_hostage_system.0410.a: "[hostage.GetFirstNameNoTooltip|U] i [my_hostage.GetFirstNameNoTooltip] se vrátí domů."
 bp2_hostage_system.0410.b: "[my_hostage.GetFirstNameNoTooltip|U] se musí okamžitě vrátit domů."
 bp2_hostage_system.0410.c: "Už mi nejsi k ničemu, [hostage.Custom('CZ_FirstNameNoTooltip_V')]."
 bp2_hostage_system.0410.d: "Nic se nemění."
 bp2_hostage_system.0411.opening: "[warden.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp2_hostage_system.0411.intro: "Od chvíle, kdy jsi mi [hostage.Custom('CZ_TitledFirstName_A')] [Select_CString(ROOT.Char.IsFemale,'poslala','poslal')|l] jako rukojmí, se tvé postavení změnilo. [hostage.GetFirstNameNoTooltip|U] je přece [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))|l].\n\n"
 bp2_hostage_system.0411.my_hostage: "Žádám, abys mi okamžitě [Select_CString(ROOT.Char.IsFemale,'vrátila','vrátil')|l] [my_hostage.Custom('CZ_TitledFirstName_A')]. [my_hostage.GetFirstNameNoTooltip|U] je přece [warden.Custom2('RelationToMe', SCOPE.sC('my_hostage'))|l]."
 bp2_hostage_system.0411.hostage: "[hostage.GetFirstName|U] se brzy vrátí domů a naše dohoda tím pozbude platnosti."
 bp2_hostage_system.0411.both: "[hostage.GetTitledFirstName|U] je již na cestě domů a nepochybuji, že se záhy vrátí také [my_hostage.GetFirstName], [warden.Custom2('RelationToMe', SCOPE.sC('my_hostage'))|l]."
 bp2_hostage_system.0411.a: "Budiž."
 bp2_hostage_system.0500.t: "Nový domov"
 bp2_hostage_system.0500.desc: "Dozvídám se, že mé rukojmí [hostage.GetFirstName] konečně [Select_CString(hostage.IsFemale,'dorazila','dorazil')|l] [CZPrepZ(hostage_home_court.GetPrimaryTitle.GetNameNoTierNoTooltip)|l] [hostage_home_court.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')]."
 bp2_hostage_system.0500.anxious: "[hostage_home_court.GetTitledFirstName|U] má jistě obavy o nový život [hostage.Custom('CZ_FirstName_G')] [CZPrepV(ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip)|l] [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')]. Vždyť [hostage.GetFirstNameNoTooltip] je [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))|l] [hostage_home_court.Custom('CZ_TitledFirstName_G')]."
 bp2_hostage_system.0500.home: "\n\n„Důvěřuj [hostage_home_court.Custom('CZ_TitledFirstName_D')],“ uklidňuji [hostage.Custom('CZ_FirstName_A')]. „Tady se o tebe dobře postaráme.“"
 bp2_hostage_system.0500.away: "\n\nVěřím, že se můj lid postará, aby se tu [hostage.GetFirstNameNoTooltip] [Select_CString(hostage.IsFemale,'cítila','cítil')|l] jako doma."
 bp2_hostage_system.0500.a.home: "Ukážu ti tvůj pokoj."
 bp2_hostage_system.0500.a: "Dohoda je uzavřena."
 bp2_hostage_system.0501.opening: "Zdravím tě, [hostage.Custom2('CZ_RelationToMeShort_V', hostage_home_court)|l],"
 bp2_hostage_system.0501.desc: "Bezpečně jsem [Select_CString(hostage.IsFemale,'dorazila','dorazil')|l] [CZPrepV(hostage_warden.GetPrimaryTitle.GetNameNoTierNoTooltip)|l] [hostage_warden.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')] a [hostage_warden.GetTitledFirstName] [Select_CString(hostage_warden.IsFemale,'potvrdila','potvrdil')|l] vaši dohodu.\n\n"
 bp2_hostage_system.0501.child_alone: "Nejsou tu žádné další děti a všechno mi připadá hrozně cizí."
 bp2_hostage_system.0501.child: "[Select_CString(hostage.IsFemale,'Seznámila','Seznámil')|U] jsem se s ostatními dětmi u dvora. Zdají se být milé."
 bp2_hostage_system.0501.adult: "Prosím, nezapomeň na mě."
 bp2_hostage_system.0501.a.child_alone: "Chudák [Select_CString(hostage.IsFemale,'holka','kluk')|l]..."
 bp2_hostage_system.0501.a.child: "Doufám, že tam bude [hostage.GetFirstNameNoTooltip] [Select_CString(hostage.IsFemale,'šťastná','šťastný')|l]."
 bp2_hostage_system.0501.a: "Všechno jde podle plánu."
 bp2_hostage_system.0502.opening: "[hostage_warden.Custom2('AppropriateGreeting', hostage_home_court)]"
 bp2_hostage_system.0502.desc: "[hostage.GetFirstName|U], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))|l], bezpečně [Select_CString(hostage.IsFemale,'dorazila','dorazil')|l] [CZPrepV(hostage_warden.GetPrimaryTitle.GetNameNoTierNoTooltip)|l] [hostage_warden.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')].\n\nTímto považuji naši dohodu za potvrzenou."
 bp2_hostage_system.0502.a: "Výborně."
 bp2_hostage_system.0510.intro: "Stráže mi hlásí, že se [Select_CString(hostage.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))|l], [hostage.GetFirstName], blíží [CZPrepK(ROOT.Char.GetCapitalLocation.GetNameNoTooltip)|l] [CZProvNameNoTooltip(ROOT.Char.GetCapitalLocation,'D')],"
 bp2_hostage_system.0510.duration_short: "ačkoli se mi zdá, jako by teprve včera [Select_CString(hostage.IsFemale,'odjela','odjel')|l] do [hostage_warden.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')]."
 bp2_hostage_system.0510.duration_long: "po mnoha letech strávených [CZPrepV(hostage_warden.GetPrimaryTitle.GetNameNoTierNoTooltip)|l] [hostage_warden.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')]. $bp2_hostage_system.0510.older$"
 bp2_hostage_system.0510.duration: "po pobytu [CZPrepV(hostage_warden.GetPrimaryTitle.GetNameNoTierNoTooltip)|l] [hostage_warden.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')]. $bp2_hostage_system.0510.older$"
 bp2_hostage_system.0510.older: "Za tu dobu [Select_CString(hostage.IsFemale,'povyrostla','povyrostl')|l], ale poznávám [Select_CString(hostage.IsFemale,'ji','ho')|l] na první pohled."
 bp2_hostage_system.0510.home: "\n\nU brány se obejmeme. „Musíš mi všechno vyprávět, [ROOT.Char.Custom2('CZ_RelationToMeShort_V', SCOPE.sC('hostage'))|l]! Bylo to tam hrozné?“"
 bp2_hostage_system.0510.away: "\n\nVšechno si povíme, až se vrátím domů."
