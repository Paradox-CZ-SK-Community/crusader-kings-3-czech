l_polish:
 teeming_horde_of_cats_modifier: "Hemžící se horda koček"
 teeming_horde_of_cats_modifier_desc: "Tuto postavu jako by neustále obklopovala potulná smečka povýšených koček. Tato důstojná zvířata zajišťují, že v jejich blízkosti není po škůdcích ani památky."
 loyal_pack_of_hounds_modifier: "Věrná smečka psů"
 loyal_pack_of_hounds_modifier_desc: "Tuto postavu všude doprovází smečka věrných psů. Kamkoli se vydá, psi ji následují. U dvora to občas způsobuje rozpaky, ale při vojenských taženích jsou vítanými společníky."
 frequent_daydreamer_modifier: "Věčné snění"
 frequent_daydreamer_modifier_desc: "Tato postava se často zdá být pohroužená do vlastních myšlenek, které jsou jistě nesmírně hluboké a závažné."
 strong_flock_of_eagles_modifier: "Mohutné hejno orlů"
 strong_flock_of_eagles_modifier_desc: "Tuto postavu často doprovází hejno orlů, kteří ji zřejmě následují na každém kroku. Tito majestátní ptáci jsou symbolem síly a moci."
 bp2_yearly_0641_vs_courtly_modifier: "Dobrá pověst: Dvorští vazalové"
 bp2_yearly_0641_vs_courtly_modifier_desc: "Kdosi vazalům této postavy našeptává samé lichotky."
 bp2_yearly_0641_vs_glory_hound_modifier: "Dobrá pověst: Slávychtiví vazalové"
 bp2_yearly_0641_vs_glory_hound_modifier_desc: "$bp2_yearly_0641_vs_courtly_modifier_desc$"
 bp2_yearly_0641_vs_parochial_modifier: "Dobrá pověst: Vazalové hájící místní zájmy"
 bp2_yearly_0641_vs_parochial_modifier_desc: "$bp2_yearly_0641_vs_courtly_modifier_desc$"
 bp2_yearly_0641_vs_zealot_modifier: "Dobrá pověst: Nábožensky horliví vazalové"
 bp2_yearly_0641_vs_zealot_modifier_desc: "$bp2_yearly_0641_vs_courtly_modifier_desc$"
 bp2_yearly_0641_vs_minority_modifier: "Dobrá pověst: Menšinoví vazalové"
 bp2_yearly_0641_vs_minority_modifier_desc: "$bp2_yearly_0641_vs_courtly_modifier_desc$"
 bp2_yearly_0641_vs_baron_modifier: "Dobrá pověst: Baronští vazalové"
 bp2_yearly_0641_vs_baron_modifier_desc: "$bp2_yearly_0641_vs_courtly_modifier_desc$"
 bp2_yearly_0641_dynasty_modifier: "Dobrá pověst: Dynastie"
 bp2_yearly_0641_dynasty_modifier_desc: "Kdosi členům rodiny této postavy našeptává samé lichotky."
 bp2_yearly_0641_fellow_vassals_modifier: "Dobrá pověst: Ostatní vazalové"
 bp2_yearly_0641_fellow_vassals_modifier_desc: "$bp2_yearly_0641_vs_courtly_modifier_desc$"
 bp2_yearly_0641_powerful_vassal_modifier: "Dobrá pověst: Mocní vazalové"
 bp2_yearly_0641_powerful_vassal_modifier_desc: "$bp2_yearly_0641_vs_courtly_modifier_desc$"
 bp2_yearly_0641_hof_modifier: "Dobrá pověst: Hlava víry"
 bp2_yearly_0641_hof_modifier_desc: "Kdosi duchovenstvu této postavy našeptává samé lichotky."
 bp2_yearly_0641_realm_priest_modifier: "Dobrá pověst: Vrchní duchovní"
 bp2_yearly_0641_realm_priest_modifier_desc: "$bp2_yearly_0641_hof_modifier_desc$"
 bp2_yearly_0641_maa_maintenance_modifier: "Šetření každého groše"
 bp2_yearly_0641_maa_maintenance_modifier_desc: "Kdosi spravuje ozbrojence této postavy s velmi napjatým, ale účinně využívaným rozpočtem."
 bp2_yearly_0641_cowed_vassal_modifier: "Zdvořilá připomenutí"
 bp2_yearly_0641_cowed_vassal_modifier_desc: "Vazalové této postavy se naučili velmi, velmi dobře číst mezi řádky."
 bp2_yearly_0641_war_income_modifier: "Válečná daň"
 bp2_yearly_0641_war_income_modifier_desc: "Politické okolnosti poskytly této postavě dodatečnou finanční podporu během války."
 next_free_ho_hire_modifier: "Bezplatné najmutí vojenského řádu"
 next_free_ho_hire_modifier_desc: "Příští najmutí vojenského řádu bude pro tuto postavu bezplatné."
 bp2_yearly_0641_mercenary_cost_reduction_modifier: "Žoldnéřský merkantilismus"
 bp2_yearly_0641_mercenary_cost_reduction_modifier_desc: ""
 bp2_yearly_0641_raid_speed_modifier: "Mistři drancování"
 bp2_yearly_0641_raid_speed_modifier_desc: "V armádách této postavy slouží jedni z nejzkušenějších válečných lupičů na světě."
 bp2_yearly.0601.t: "Jak správně vládnout"
 bp2_yearly.0601.desc.intro: "Jako [ROOT.Char.GetDiarchTitle|l] se [regent.Custom2('MyCharacterIntroduction', ROOT.Char)] očividně [Select_CString(regent.IsFemale,'rozhodla','rozhodl')] naučit mě svým oblíbeným způsobům vládnutí."
 bp2_yearly.0601.desc.rationale.disloyal.likes_you: "Ve své funkci se sice [regent.GetFirstNameNoTooltip] chová tak trochu jako [Select_CString(regent.IsFemale,'ničemnice','ničema')], ale přesto si zjevně [Select_CString(regent.IsFemale,'oblíbila','oblíbil')] roli mého učitele.\n\n"
 bp2_yearly.0601.desc.rationale.neutral.likes_you: "Do svých povinností se sice [regent.GetFirstNameNoTooltip] nijak zvlášť nehrne, ale přesto si na mé vzdělávání občas najde čas.\n\n"
 bp2_yearly.0601.desc.rationale.loyal.predecessor_hook: "Jen málokterá lekce se obejde bez připomínky přísahy, kterou [regent.GetFirstNameNoTooltip] [Select_CString(regent.IsFemale,'složila','složil')] mému předchůdci.\n\n"
 bp2_yearly.0601.desc.rationale.loyal.loyalty_hook: "Každá lekce bez výjimky začíná ujištěním, že mi [regent.GetFirstNameNoTooltip] [Select_CString(regent.IsFemale,'přísahala','přísahal')] věrnost ve všem, a to včetně mého vzdělávání.\n\n"
 bp2_yearly.0601.desc.rationale.loyal.honourable: "Všechny metody se nakonec nějakým způsobem vracejí ke cti, přísným pravidlům jejího dodržování a způsobům, jakými si ji lze vysloužit.\n\n"
 bp2_yearly.0601.desc.rationale.loyal.fallback: "Lekce jsou dlouhé, ale zdá se, že vycházejí z upřímné dobroty srdce, nebo alespoň z náklonnosti, kterou ke mně [regent.GetFirstNameNoTooltip] chová.\n\n"
 bp2_yearly.0601.desc.rationale.fallback: "Nikdy se mi nepodařilo přijít na to, proč to [regent.GetFirstNameNoTooltip] dělá, ale občas na těchto lekcích prostě trvá.\n\n"
 bp2_yearly.0601.desc.skill.boilerplate: "Dnešní lekce se #EMP opět#! věnuje "
 bp2_yearly.0601.desc.diplomacy.arrogant: "státnickému umění. Podle [regent.Custom('CZ_FirstName_G')] všechno spočívá v tom, ukázat ostatním jejich místo, dát najevo svou moc a posilovat vlastní majestát. Slova jsou nástrojem, kterým si lze zajistit skutečnou převahu."
 bp2_yearly.0601.desc.diplomacy.humble: "státnickému umění. Podle [regent.Custom('CZ_FirstName_G')] je klíčem empatie. Člověk, s nímž jednáš, může stát hluboko pod tebou, ale skromnost v diplomacii je projevem velkorysosti. A velkorysost sama o sobě svědčí o skutečné síle."
 bp2_yearly.0601.desc.diplomacy.fallback: "státnickému umění. Správné držení těla, vytříbená mluva, rétorika, složitosti vyjednávání... Zkrátka všechny ty obvyklé okázalosti a plané řeči, kterými jsou dospělí v politice tak posedlí."
 bp2_yearly.0601.desc.martial.wrathful: "vojenské teorii. [regent.GetFirstNameNoTooltip|U] při výkladu téměř pění vzteky a neustále zdůrazňuje, že jakmile začne bitva, je třeba zasadit nepříteli rychlé a drtivé údery. Jen tak lze zvítězit. Projevovat milost znamená koledovat si o porážku."
 bp2_yearly.0601.desc.martial.calm: "vojenské teorii. [regent.GetFirstNameNoTooltip|U] zdůrazňuje význam rozvahy při plánování, udržování úsporně vedeného vojska a využívání strategie k omezení ztrát na životech. Vítězství podle tohoto výkladu přináší obezřetnost a klid."
 bp2_yearly.0601.desc.martial.fallback: "vojenské teorii. Kde rozbít tábor, jak se během tažení starat o velké množství koní, které formace se nejlépe osvědčují proti našim tradičním nepřátelům... A tak pořád dokola."
 bp2_yearly.0601.desc.stewardship.greedy: "obchodu a daním. Nic nedokáže [regent.Custom('CZ_FirstName_A')] nadchnout tolik jako právě obchod a daně. Výraz blažené chamtivosti, který se [regent.Custom('MaskFace_BehindAcross')|l] [Select_CString(regent.IsFemale,'její','jeho')] [regent.Custom('MaskFace')|l] zračí, hraničí s vytržením. Hodiny dokáže s neskrývaným nadšením vyjmenovávat jeden způsob získávání stříbra za druhým."
 bp2_yearly.0601.desc.stewardship.generous: "obchodu a daním. Pro [regent.Custom('CZ_FirstName_A')] je stříbro pouze prostředkem k dosažení cíle. A tento cíl je důležitější než samotné hromadění bohatství. Panovník samozřejmě musí vybírat mince, ale pouze tehdy, když je to nezbytné, a měl by je také štědře vracet potřebným."
 bp2_yearly.0601.desc.stewardship.fallback: "obchodu a daním. Daně a obchod. Nekonečný výklad o nejmenších podrobnostech ražby mincí, nejlepších způsobech získávání bohatství a nesčetných metodách, kterými se prostí lidé i šlechtici mohou pokoušet ukrýt přede mnou to, co mi právem náleží."
 bp2_yearly.0601.desc.intrigue.compassionate: "politickým intrikám. Podle [regent.Custom('CZ_FirstName_G')] je nejdůležitější naučit se procházet zmijím hnízdem tak, aby si člověk nemusel potřísnit ruce krví, pokud to není naprosto nezbytné."
 bp2_yearly.0601.desc.intrigue.callous: "politickým intrikám. [regent.GetFirstNameNoTooltip|U] mluví vždy stručně, rozhodně a bez zbytečných okolků. Soupeře je třeba vyřídit rychle, ať už silou, nebo šarmem. Nemá smysl je zbytečně trestat, ale ani jim projevovat pošetilou milost."
 bp2_yearly.0601.desc.intrigue.sadistic: "politickým intrikám. [regent.GetFirstNameNoTooltip|U] si většinu času vychutnává barvité popisy vynalézavých trestů pro soupeře, rozebírá jemnosti budování vlastní pověsti a neustále opakuje, že je snazší vzbuzovat strach než lásku."
 bp2_yearly.0601.desc.intrigue.fallback: "politickým intrikám. Jak se chránit před spiknutími, jak prosazovat svou vůli prostřednictvím skrytých hrozeb, které úřady disponují tajným vlivem a tak dále. A co hůř, samotný výklad je plný dvojsmyslů a náznaků, které musím neustále luštit."
 bp2_yearly.0601.desc.learning.shy: "učenosti a teologii. [regent.GetFirstNameNoTooltip|U] mluví tak tiše, že sotva slyším jednotlivá slova. Přesto výklad pokračuje dlouhé hodiny a pojednává o nesčetných ponaučeních pro správné vládnutí, která lze najít v dílech velikánů minulosti."
 bp2_yearly.0601.desc.learning.gregarious: "učenosti a teologii. [regent.GetFirstNameNoTooltip|U] hřímavým a zaníceným hlasem vyjmenovává oblíbené historiky a filozofy, nastupující hvězdy učeného světa i vášnivě probírané teorie. Přitom vysvětluje, jak vzdělanost prospívá panovníkům i jejich poddaným."
 bp2_yearly.0601.desc.learning.fallback: "učenosti a teologii. Je to suchopárný výklad o historii, filozofii a podivně páchnoucích učencích z dalekých zemí. Zkrátka všechny ty obvyklé učené řeči. Hlavní myšlenkou však zřejmě je, že vzdělaný panovník přináší svému lidu spokojenost."
 bp2_yearly.0601.desc.child_reaction.disgust: "\n\nMně to ale připadá naprosto špatné. Děsí mě představa, že [regent.GetFirstNameNoTooltip] takhle zachází s lidmi nižšího postavení a navíc to považuje za něco #EMP dobrého#!."
 bp2_yearly.0601.desc.child_reaction.admiration: "\n\nNěco mi říká, že přesně takhle by to mělo být. [regent.GetFirstNameNoTooltip|U] chápe skutečný řád světa a ví, jak by se #EMP měla#! chovat pravá šlechta."
 bp2_yearly.0601.desc.child_reaction.boredom: "\n\n[regent.Custom('CZ_FirstNamePossessiveNoTooltip_M')|U] pohled na tuto záležitost mě #EMP vůbec#! nezajímá, ale z téhle přednášky se nemám jak vytratit. Vždyť na učení podobných věcí budu mít ještě spoustu času, až se stanu [ROOT.Char.GetTitleAsNameNoTooltip|l] a budu vládnout [Select_CString(ROOT.Char.IsFemale,'sama','sám')], ne?"
 bp2_yearly.0601.option.skill: "Soustředit se na odborné podrobnosti."
 bp2_yearly.0601.option.perk: "Zaměřit se na podstatu rad."
 bp2_yearly.0601.a: "$bp2_yearly.0601.option.skill$"
 bp2_yearly.0601.b: "$bp2_yearly.0601.option.perk$"
 bp2_yearly.0601.c: "$bp2_yearly.0601.option.skill$"
