 bp2_yearly.0601.e: "$bp2_yearly.0601.option.skill$"
 bp2_yearly.0601.f: "$bp2_yearly.0601.option.perk$"
 bp2_yearly.0601.g: "$bp2_yearly.0601.option.skill$"
 bp2_yearly.0601.h: "$bp2_yearly.0601.option.perk$"
 bp2_yearly.0601.i: "$bp2_yearly.0601.option.skill$"
 bp2_yearly.0601.j: "$bp2_yearly.0601.option.perk$"
 bp2_yearly.0601.k: "Zasnít se a celou odpolední lekci prospat s otevřenýma očima."
 bp2_yearly.0611.t: "Druhé hlavní město [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')]"
 bp2_yearly.0611.desc.intro.bad_history: "Přestože mi [regent.Custom2('MyCharacterIntroduction', ROOT.Char)] v minulosti [Select_CString(regent.IsFemale,'ublížila','ublížil')] a nešetřila ani mé blízké, stále zastává funkci [ROOT.Char.GetDiarchTitle|l]. Jenže [regent.GetFirstNameNoTooltip] téměř nikdy neopouští [regent_capital.Custom('CZ_LandedNameNoTier_A')].\n\n"
 bp2_yearly.0611.desc.intro.fallback: "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vykonává funkci [ROOT.Char.GetDiarchTitle|l] s takovým nasazením, že celé dny tráví zavřen[Select_CString(regent.IsFemale,'á','ý')] ve své pracovně, kterou má [CZPrepV(regent_capital.GetBaseNameNoTierNoTooltip)|l] [regent_capital.Custom('CZ_LandedNameNoTier_L')].\n\n"
 bp2_yearly.0611.desc.regent_opinion.positive: "Vím, že mě má [regent.GetFirstNameNoTooltip] chránit, dokud nedospěji, ale i když mě přijede navštívit, vždycky je to jen kvůli"
 bp2_yearly.0611.desc.regent_opinion.negative: "Vím, že mě [regent.GetFirstNameNoTooltip] nemá příliš v oblibě, ale copak jsem tak nesnesitelné dítě, že každá návštěva musí být jen kvůli"
 bp2_yearly.0611.desc.regent_opinion.fallback: "Vím, že mě [regent.GetFirstNameNoTooltip] považuje za pouhé dítě, ale snad si přece zasloužím trochu pozornosti! Jenže každá návštěva je zase jen kvůli"
 bp2_yearly.0611.desc.government.tribal: "rozhovoru s nějakým vlivným stařešinou, poradě s radou, zapůjčení úředních poslů nebo... nebo..."
 bp2_yearly.0611.desc.government.fallback: "důležitým listinám, použití úředních pečetí, rozhovoru s nějakým hodnostářem nebo... nebo..."
 bp2_yearly.0611.desc.outro: "\n\nJen bych si [Select_CString(ROOT.Char.IsFemale,'přála','přál')], aby [regent.GetFirstNameNoTooltip] někdy [Select_CString(regent.IsFemale,'myslela','myslel')] také na #EMP mě#!, a ne pořád jen na [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_A')]."
 bp2_yearly.0611.a: "Možná by pomohl dopis od srdce..."
 bp2_yearly.0611.b: "#BER Já jsem [ROOT.Char.GetTitleAsNameNoTooltip|l] a požaduji, aby mě všichni vyslechli!#!"
 bp2_yearly.0611.b.tt: "Budeš tak dlouho vyvádět, až tě [regent.GetFirstNameNoTooltip] začne brát na důležitá jednání"
 bp2_yearly.0611.c: "Koho to zajímá? Aspoň budu mít víc času na hraní venku!"
 bp2_yearly.0611.d: "Cítím příležitost."
 bp2_yearly.0611.d.tt.success: "Podaří se ti od [regent.Custom('CZ_FirstName_G')] vyloudit příslib odškodnění"
 bp2_yearly.0611.d.tt.failure: "[regent.GetFirstNameNoTooltip|U] je tvým fňukáním [Select_CString(regent.IsFemale,'otrávená','otrávený')]"
 bp2_yearly.0611.d.tt.failure.deceitful: "Vzhledem ke své [Concept('personality','osobnosti')|E] [regent.GetFirstNameNoTooltip] tvůj pokus ocení"
 bp2_yearly.0611.e: "Co asi [regent.GetFirstNameNoTooltip] ukrývá ve svých soukromých komnatách, když je pryč?"
 bp2_yearly.0611.f.young: "Najdu si někoho jiného, kdo mi bude předčítat!"
 bp2_yearly.0611.f.fallback: "Pche, dějiny si dokážu číst i bez [regent.Custom('CZ_FirstName_G')]."
 bp2_yearly.0611.g: "Pche, vlastní zábavu si dokážu uspořádat i bez pomoci."
 bp2_yearly.0611.g.tt: "Za svou příští [Concept('activity','aktivitu')|E] [CZActivity('activity_playdate','A')|l] nic nezaplatíš a [Concept('characters','postavy')|E] se jí s větší pravděpodobností zúčastní"
 bp2_yearly.0621.t.close_family: "Dary pro [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_A')]"
 bp2_yearly.0621.t.fallback: "Dárky od [Select_CString(regent.IsFemale,'tety','strýce')] [regent.Custom('CZ_FirstNameNoTooltip_G')]"
 bp2_yearly.0621.desc.intro.bad_history: "Přestože mi [regent.Custom2('MyCharacterIntroduction', ROOT.Char)] v minulosti [Select_CString(regent.IsFemale,'hodně ublížila','hodně ublížil')], zdá se, že mi to nyní hodlá vynahradit velkolepými dary.\n\n"
 bp2_yearly.0621.desc.intro.fallback: "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se ke mně poslední dobou chová neobyčejně pozorně. Vždycky mi přinese ty nejlepší dárky, takže nikdo snad nemůže zastávat funkci [ROOT.Char.GetDiarchTitle|l] lépe.\n\n"
 bp2_yearly.0621.desc.midtro: "„Á, tady jsi, [Select_CString(ROOT.Char.IsFemale,'mladá paní','mladý pane')]!“ zasměje se [regent.GetFirstNameNoTooltip], když přiběhnu na nádvoří. Čeká tam na mě s čímsi zahaleným látkou. „Dnes pro tebe mám něco opravdu výjimečného,“ zašeptá spiklenecky.\n\nPak stáhne látku a přede mnou se objeví "
 bp2_yearly.0621.desc.gift.gold: "vysoké sloupce stříbrných a zlatých mincí, uspořádané do tvaru koruny."
 bp2_yearly.0621.desc.gift.prestige: "skupina pěvců a tanečníků, kteří přede mnou začnou poskakovat, vířit v tanci a prozpěvovat písničku složenou na mou počest."
 bp2_yearly.0621.desc.gift.piety: "pečlivě zhotovený model posvátné stavby s tabulkou popisující plánované nové křídlo. [ROOT.Char.GetFaith.HouseOfWorship|U] se totiž díky mému daru dočká rozšíření."
 bp2_yearly.0621.desc.gift.event_troops: "[Select_CString(dummy_soldier.IsFemale,'ozbrojená družinice','ozbrojený družiník')], [Select_CString(dummy_soldier.IsFemale,'která poklekne a nabídne','který poklekne a nabídne')] mi ruku na znamení věrnosti."
 bp2_yearly.0621.desc.gift.dog: "štíhlý, ušlechtilý pes, který nadšeně vrtí ocasem."
 bp2_yearly.0621.desc.gift.cat: "elegantní kočka s jednou tlapkou zdviženou do vzduchu. Vypadá stejně překvapeně, že mě vidí, jako jsem já překvapen[Select_CString(ROOT.Char.IsFemale,'á','ý')] její přítomností."
 bp2_yearly.0621.desc.gift.eagle: "bystré orlí mládě, které sedí na bidýlku s široce roztaženými křídly."
 bp2_yearly.0621.extra_stuff.success: "[regent.GetFirstName|U] narychlo sežene ještě další dary"
 bp2_yearly.0621.extra_stuff.failure: "Dostaneš, co dostaneš, a ještě za to budeš rád[Select_CString(ROOT.Char.IsFemale,'a','')]"
 bp2_yearly.0621.a: "To je nádherné překvapení!"
 bp2_yearly.0621.b: "Hmm... Co si dát páku a vsadit se o dvojnásobek?"
 bp2_yearly.0621.c: "Nezdá se ti, že jsi ještě na něco maličkého zapomněl[Select_CString(regent.IsFemale,'a','')]?"
 bp2_yearly.0621.d: "Já vím, že máš ještě někde něco schovaného..."
 bp2_yearly.0621.e: "Četl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem, že štědré dary přinášejí štěstí..."
 bp2_yearly.0621.f: "To přece nemůže být všechno?"
 bp2_yearly.0621.g.bad_blood: "Mou lásku si nekoupíš, #EMP [regent.GetFirstNameNoTooltip]#!."
 bp2_yearly.0621.g.good_terms: "Děkuji, ale jednoho už mám. Nejspíš."
 bp2_yearly.0631.t: "Šeptaná slova"
 bp2_yearly.0631.desc.intro.positive: "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi ve funkci [ROOT.Char.GetDiarchTitle|l] dosud prokazuje věrnost a ve svých radách má zpravidla na srdci mé nejlepší zájmy.\n\nO to závažněji a znepokojivěji působí, když mi začne vyprávět o všech těch hanebných prohřešcích, z nichž je [rival_successor.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(rival_successor.IsFemale,'obviňována','obviňován')].\n\n"
 bp2_yearly.0631.desc.intro.negative: "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] má ve funkci [ROOT.Char.GetDiarchTitle|l] poněkud... rozporuplné výsledky. [Select_CString(regent.IsFemale,'Měla','Měl')] by mě chránit a být mým štítem, ale zdá se, že [regent.GetFirstNameNoTooltip] se mnohem raději stará o vlastní obohacení.\n\nNení tedy divu, že k vyprávění o všech těch hanebných prohřešcích, z nichž je [rival_successor.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(rival_successor.IsFemale,'obviňována','obviňován')], přistupuji s nedůvěrou.\n\n"
 bp2_yearly.0631.desc.intro.vague: "Působení [regent.Custom2('MyCharacterIntroductionPossessive', ROOT.Char)] ve funkci [ROOT.Char.GetDiarchTitle|l] zdaleka neodpovídá původním slibům. Někdy mi [regent.GetFirstNameNoTooltip] pomáhá, ale stejně často se zdá, že dbá pouze na vlastní prospěch.\n\nProto nevím, co si mám myslet, když mi začne vyprávět o všech těch hanebných prohřešcích, z nichž je [rival_successor.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(rival_successor.IsFemale,'obviňována','obviňován')].\n\n"
 bp2_yearly.0631.desc.rationale.nemesis: "„...ten odporný červ jistě chystá tvůj pád, [ROOT.Char.GetFirstNameNoTooltip], stejně jako plánuje můj! A spolu s námi hodlá přivést do záhuby i [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedName_A')]!“"
 bp2_yearly.0631.desc.rationale.warmonger: "„...[Select_CString(rival_successor.IsFemale,'ta ničemnice','ten ničema')] je hotový běs a válečný štváč, [ROOT.Char.GetFirstNameNoTooltip]! Touha po nespravedlivém ničení nezná hranic. Stačí sebemenší příležitost a celé území [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedName_G')] zachvátí občanská válka!“"
 bp2_yearly.0631.desc.rationale.rival: "„...[Select_CString(rival_successor.IsFemale,'ta žena je ničemnice nejhrubšího zrna','ten muž je ničema nejhrubšího zrna')], [ROOT.Char.GetFirstNameNoTooltip]! [Select_CString(rival_successor.IsFemale,'Lhářka, zlodějka a podvodnice','Lhář, zloděj a podvodník')], [Select_CString(rival_successor.IsFemale,'která','který')] chce ve tvém panství rozsévat sváry a rozbroje.“"
 bp2_yearly.0631.desc.rationale.revenge: "„...[Select_CString(rival_successor.IsFemale,'ta uječená služebnice','ten uječený poskok')], [Select_CString(rival_successor.IsFemale,'jejímž','jehož')] pánem je [regent.GetFaith.DevilName], [Select_CString(rival_successor.IsFemale,'spáchala','spáchal')] na mně a mých blízkých nepopsatelné zločiny, [ROOT.Char.GetFirstNameNoTooltip]! Dostane-li příležitost, jistě obrátí svůj hněv proti celému území [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedName_G')]!“"
 bp2_yearly.0631.desc.rationale.criminality: "„...[Select_CString(rival_successor.IsFemale,'je to známá zločinka','je to známý zločinec')], [ROOT.Char.GetFirstNameNoTooltip], [Select_CString(rival_successor.IsFemale,'která','který')] nepochybně vyhlíží další příležitosti k hříchu a neřesti. Představ si, jakou moc by [rival_successor.GetFirstNameNoTooltip] [Select_CString(rival_successor.IsFemale,'získala','získal')], kdyby se [Select_CString(rival_successor.IsFemale,'stala','stal')] [ROOT.Char.GetDiarchTitle|l]...“"
 bp2_yearly.0631.desc.rationale.opposing_traits: "„...stačí s [rival_successor.Custom('CZ_FirstName_I')] promluvit na víc než okamžik a člověk se může zbláznit, [ROOT.Char.GetFirstNameNoTooltip]! Je až neuvěřitelné, jak se může [Select_CString(rival_successor.IsFemale,'jedna žena','jeden muž')] tak nesmírně mýlit úplně #EMP ve všem#!!“"
 bp2_yearly.0631.desc.rationale.sins: "„...u jednoho stolu s [rival_successor.Custom('CZ_FirstName_I')] prostě sedět nemohu! Žádný řádný [regent.GetFaith.GetAdherentName|l] by to nedokázal. A ty bys také neměl[Select_CString(ROOT.Char.IsFemale,'a','')], [ROOT.Char.GetFirstNameNoTooltip], pokud nechceš, aby se ty hříchy otiskly do tvého mladého a zranitelného srdce.“"
 bp2_yearly.0631.desc.rationale.petty_opinions: "„...nejde ani o žádnou konkrétní příhodu, [ROOT.Char.GetFirstNameNoTooltip]. Vadí mi úplně všechno na tom, jak se [rival_successor.GetFirstNameNoTooltip] chová! Dříve či později proti tobě poštve celé [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedName_A')], už jen tím, jak je nesnesitelná [Select_CString(rival_successor.IsFemale,'její','jeho')] přítomnost!“"
 bp2_yearly.0631.desc.rationale.hideousness: "„...jen se #EMP podívej#! na [rival_successor.Custom('CZ_FirstName_A')]! Tedy pokud se tomu vůbec dá říkat [Select_CString(rival_successor.IsFemale,'žena','muž')]. Viděl[Select_CString(regent.IsFemale,'a','')] jsem i napůl rozmačkané žáby pod koly vozů, které vypadaly lépe. Taková ohavnost jistě prozrazuje ty nejnižší hříšné choutky, které se derou na povrch skrz tu odpudivou kůži!“"
 bp2_yearly.0631.desc.rationale.generic: "„...kamkoli [rival_successor.GetFirstNameNoTooltip] přijde, všude si nadělá nepřátele, [ROOT.Char.GetFirstNameNoTooltip]. A já k nim patřím také. Pokud budeš vůči [rival_successor.Custom('CZ_FirstName_D')] příliš [Select_CString(ROOT.Char.IsFemale,'laskavá','laskavý')], jistě tvé štědrosti zneužije a při první příležitosti tě zradí!“"
 bp2_yearly.0631.desc.outro: "\n\n„Pokud se proti [rival_successor.Custom('CZ_FirstName_D')] nepostavíš hned, možná se [rival_successor.GetFirstNameNoTooltip] nakonec zmocní mého postavení a způsobí ti #EMP nenapravitelnou#! újmu.“"
 bp2_yearly.0631.a: "Jestli... myslíš, že je to nejlepší..."
 bp2_yearly.0631.b: "Nikdy! Vždyť jsou to jen překroucené lži!"
 bp2_yearly.0631.b.tt: "Odmítneš zavrhnout [rival_successor.Custom('CZ_FirstNameNoTooltip_A')]"
 bp2_yearly.0631.c.rowdy: "Už jsem dost [Select_CString(ROOT.Char.IsFemale,'stará','starý')] na to, abych poznal[Select_CString(ROOT.Char.IsFemale,'a','')], co je osobní spor."
 bp2_yearly.0631.c.charming: "Určitě se s [rival_successor.Custom('CZ_FirstName_I')] dokážu domluvit, pokud na to dojde."
 bp2_yearly.0631.c.curious: "Nemohu jen tak věřit tvému slovu ani slovu [rival_successor.Custom('CZ_FirstNameNoTooltip_G')], [regent.Custom('CZ_FirstNameNoTooltip_V')]."
 bp2_yearly.0631.c.pensive: "Já... budu si to muset promyslet..."
 bp2_yearly.0631.c.bossy: "Nezatahuj #EMP mě#! do svých osobních sporů."
 bp2_yearly.0641.t: "Něco za něco"
 bp2_yearly.0641.desc.intro.request_boilerplate: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U] a [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')], jako [ROOT.Char.GetDiarchTitle|l] potřebuji pro vyřízení jisté důležité záležitosti trochu větší pravomoci."
 bp2_yearly.0641.desc.intro.tribal: "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vstoupí do malé pracovny a v patách se [Select_CString(regent.IsFemale,'jí','mu')] vleče postarší vykladač zákonů.\n$bp2_yearly.0641.desc.intro.request_boilerplate$ Tento svědek dosvědčí tvou přísahu.“\n\n"
 bp2_yearly.0641.desc.intro.fallback: "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] sebejistě vstoupí do malé pracovny se svazkem pergamenů v rukou.\n$bp2_yearly.0641.desc.intro.request_boilerplate$ Stačí, když budeš tak [Select_CString(ROOT.Char.IsFemale,'laskavá','laskavý')] a tyto listiny podepíšeš a opatříš pečetí.“\n\n"
 bp2_yearly.0641.desc.midtro: "„Samozřejmě za tebou nepřicházím s prázdnou! Za tuhle drobnou laskavost ti "
 bp2_yearly.0641.desc.vs_courtly: "promluvím do duše tvým nejvytříbenějším vazalům a postarám se, abys zůstal[Select_CString(ROOT.Char.IsFemale,'a','')] v jejich přízni.“"
 bp2_yearly.0641.desc.vs_glory_hound: "promluvím s tvými nejbojovnějšími vazaly a ujistím je o tvé slavné budoucnosti.“"
 bp2_yearly.0641.desc.vs_parochial: "promluvím s vazaly, kteří nejvíce lpějí na svých místních zájmech, a ujistím je, že jejich starosti nejsou hlavnímu městu lhostejné.“"
 bp2_yearly.0641.desc.vs_zealot: "přesvědčím tvé nejhorlivější vazaly o tvé zbožnosti a oddanosti víře. Vždyť [ROOT.Char.GetFaith.HighGodName] je ti přece nade vše!“"
 bp2_yearly.0641.desc.vs_minority: "promluvím s tvými vazaly nejrůznějšího původu a přesvědčení a pomohu tak udržet rozmanité panství pohromadě.“"
 bp2_yearly.0641.desc.vs_baron: "promluvím s tvými méně významnými vazaly a postarám se, aby i ta nejnižší vrstva šlechty zůstala poslušná.“"
 bp2_yearly.0641.desc.dynasty: "nechám tvým jménem rozeslat lichotivé dopisy i těm nejvzdálenějším příbuzným.“"
 bp2_yearly.0641.desc.fellow_vassals: "nechám rozeslat přátelské dopisy ostatním vazalům [ROOT.Char.GetLiege.Custom('CZ_TitledFirstName_G')], aby sis mezi nimi získal[Select_CString(ROOT.Char.IsFemale,'a','')] spojence. Přátele tak získáš v celém území, které tvoří [ROOT.Char.GetLiege.GetPrimaryTitle.GetDefinitiveName].“"
 bp2_yearly.0641.desc.powerful_vassal: "promluvím s nejmocnějšími velmoži tvých zemí a ujistím je, že jejich názory mají patřičnou váhu.“"
 bp2_yearly.0641.desc.hof: "nechám poslat [ROOT.Char.GetFaith.GetReligiousHead.Custom('CZ_TitledFirstName_D')] velkolepý pochvalný dopis, který vyzdvihne tvé zásluhy. [ROOT.Char.GetFaith.HighGodNamePossessive|U] vyvolený zástupce si tě pak jistě bude více vážit.“"
 bp2_yearly.0641.desc.realm_priest: "promluvím s tvým duchovním rádcem, jehož úřadem je [ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName|l], a zajistím, abys u duchovenstva zůstal[Select_CString(ROOT.Char.IsFemale,'a','')] v dobré pověsti.“"
 bp2_yearly.0641.desc.maa_maintenance: "pokusím najít nějaké peníze navíc na vydržování tvého dvorského vojska.“"
 bp2_yearly.0641.desc.cowed_vassal: "zařídím, aby tví nejvystrašenější vazalové odváděli ještě štědřejší #EMP příspěvky#!.“"
 bp2_yearly.0641.desc.war_income: "zařídím výběr válečné daně, která ti pomůže překonat tyto těžké časy.“"
 bp2_yearly.0641.desc.free_ho_hire: "zajistím služby některých z nejzuřivějších bojovníků naší víry, které budeš moci využít, až dospěješ.“"
 bp2_yearly.0641.desc.mercenary_cost_reduction: "vyjednám výhodnější ceny s některými žoldnéři, kterých jsou tvé země plné. Slevu samozřejmě využiješ až po dosažení dospělosti.“"
 bp2_yearly.0641.desc.raid_speed: "zařídím, aby se k tvým válečným družinám připojili zkušení nájezdníci, kteří ti pomohou získat bohatou kořist v cizích zemích.“"
 bp2_yearly.0641.desc.outro.tribal: "\n\nStačí jen vyslovit přísahu."
 bp2_yearly.0641.desc.outro.fallback: "\n\nStačí jen načmárat pár písmen."
 bp2_yearly.0641.a: "Když to říkáš..."
 bp2_yearly.0641.b: "To už zacházíš příliš daleko, [regent.Custom('CZ_FirstNameNoTooltip_V')]."
 bp2_yearly.0641.c.rowdy: "Ty jsi [ROOT.Char.GetDiarchTitle|l], tak si to vyřiď!"
 bp2_yearly.0641.c.charming: "Vždyť tomu rozumíš nejlépe! Nemůžeš se o to #EMP postarat#!?"
 bp2_yearly.0641.c.curious: "To je otrava! Nemůžeme si povídat o něčem jiném?"
 bp2_yearly.0641.c.pensive: "Obávám se, že se musím věnovat studiu."
 bp2_yearly.0641.c.bossy: "Takové maličkosti jsou pod mou úroveň. Dělej, co uznáš za vhodné."
 bp2_yearly.0641.c.tt: "Dáš [regent.Custom('CZ_FirstNameNoTooltip_D')] volnou ruku, ale neposkytneš výslovný souhlas"
 bp2_yearly.0651.t: "Kdykoli [Select_CString(regent.IsFemale,'ji','ho')] budeš potřebovat"
 bp2_yearly.0651.desc.intro: "[regent.GetFirstName|U], [Select_CString(regent.IsFemale,'která','který')] u mě zastává úřad [ROOT.Char.GetDiarchTitle|l], zaujatě naslouchá mému vyprávění. V očích se [Select_CString(regent.IsFemale,'jí','mu')] zračí zájem a náklonnost, zatímco "
 bp2_yearly.0651.desc.story.rowdy.invented_game: "podrobně vysvětluji pravidla nové míčové hry, kterou jsem právě [Select_CString(ROOT.Char.IsFemale,'vymyslela','vymyslel')]. Jsem na ni #EMP nesmírně#! [Select_CString(ROOT.Char.IsFemale,'hrdá','hrdý')]."
 bp2_yearly.0651.desc.story.rowdy.climbed_roof: "podrobně popisuji, kudy jsem se [Select_CString(ROOT.Char.IsFemale,'vyšplhala','vyšplhal')] na novou věž. Bylo to dost nebezpečné, ale nikdo neumí lézt lépe než já, alespoň [CZPrepV(ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier)|l] [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_L')]."
 bp2_yearly.0651.desc.story.rowdy.prank: "se chichotám při vyprávění o svém posledním žertíku. Možná jsem se [Select_CString(ROOT.Char.IsFemale,'smála','smál')] jen já, ale zato #EMP pořádně#!!"
 bp2_yearly.0651.desc.story.charming.composed_poem: "rozebírám symboliku a význam básně, kterou jsem [Select_CString(ROOT.Char.IsFemale,'napsala','napsal')]. Myslím, že je to mé dosud nejlepší dílo, i když si nejsem [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')], zda už se mohu nazývat [Select_CString(ROOT.Char.IsFemale,'básnířkou','básníkem')]."
 bp2_yearly.0651.desc.story.charming.new_friend: "vyprávím o jednom dítěti ze služebnické rodiny, které mé hry zřejmě naprosto uchvátily. Myslím, že jsem si našel[Select_CString(ROOT.Char.IsFemale,'a','')] nového přítele, alespoň na nějaký čas."
 bp2_yearly.0651.desc.story.charming.new_word: "vysvětluji správnou výslovnost slova, které jsem právě [Select_CString(ROOT.Char.IsFemale,'vymyslela','vymyslel')]. Očekávám, že se brzy ujme, jakmile ho poddaní uslyší používat [Select_CString(ROOT.Char.IsFemale,'samotnou','samotného')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_A')]."
 bp2_yearly.0651.desc.story.curious.distant_land: "vyprávím o podivné daleké zemi, o které jsem se nedávno [Select_CString(ROOT.Char.IsFemale,'dozvěděla','dozvěděl')], a o zvláštních lidech, kteří ji obývají."
 bp2_yearly.0651.desc.story.curious.book_gift: "podrobně rozebírám obsah knihy, kterou mi koupil jeden z méně významných vazalů. Není to zrovna velkolepé dílo, ale s nadšením jsem [Select_CString(ROOT.Char.IsFemale,'zhltla','zhltl')] každou stránku."
 bp2_yearly.0651.desc.story.curious.strange_bird: "ukazuji jednotlivé části svého náčrtku a snažím se vysvětlit, jak se ten podivný pták zvláštně pohyboval, jaké měl peří, a dokonce napodobuji jeho pronikavý zpěv."
 bp2_yearly.0651.desc.story.pensive.distant_letter: "vyprávím o dopise, který jsem s nesmírnou pečlivostí [Select_CString(ROOT.Char.IsFemale,'sepsala','sepsal')] pro vzdálenou šlechtickou osobu, o níž jsem slyšel[Select_CString(ROOT.Char.IsFemale,'a','')] různé příběhy. Nevím, zda můj dopis vůbec dorazí, ale už samotná představa, že bych mohl[Select_CString(ROOT.Char.IsFemale,'a','')] dostat odpověď, mě naplňuje radostí."
 bp2_yearly.0651.desc.story.pensive.foreign_custom: "popisuji zvláštní cizokrajný zvyk, o kterém jsem se nedávno [Select_CString(ROOT.Char.IsFemale,'dozvěděla','dozvěděl')]. Moc bych si [Select_CString(ROOT.Char.IsFemale,'přála','přál')], aby se podobná tradice ujala i u nás, [CZPrepV(ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier)|l] [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_L')]."
 bp2_yearly.0651.desc.story.pensive.draft_law: "vysvětluji obsah zákona, který se pokouším sepsat. Ještě #EMP zdaleka#! není hotový, ale na dosavadní pokrok jsem [Select_CString(ROOT.Char.IsFemale,'hrdá','hrdý')]."
 bp2_yearly.0651.desc.story.bossy.servants_caught: "vyprávím o služebnících, které jsem [Select_CString(ROOT.Char.IsFemale,'přistihla','přistihl')] při zahálce, a o tom, jak jsem je důkladně [Select_CString(ROOT.Char.IsFemale,'potrestala','potrestal')] za jejich nedbalý přístup k práci."
 bp2_yearly.0651.desc.story.bossy.court_protocol: "podrobně vysvětluji a předvádím nový dvorský protokol, který hodlám zavést. Myslím, že náležitě zdůrazní mou důstojnost a postavení. Koneckonců právě já jsem [ROOT.Char.GetTitleAsName] a vládnu území [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')]."
 bp2_yearly.0651.desc.story.bossy.organised_game: "vysvětluji, jak jsem [Select_CString(ROOT.Char.IsFemale,'uspořádala','uspořádal')] hru pro ostatní děti u dvora, [Select_CString(ROOT.Char.IsFemale,'rozdělila','rozdělil')] je do družstev a úplně všechno [Select_CString(ROOT.Char.IsFemale,'zorganizovala','zorganizoval')] bez cizí pomoci."
 bp2_yearly.0651.desc.rationale.predecessor: "\n\n„[ROOT.Char.GetFirstNameNoTooltip], když takhle mluvíš, tolik mi připomínáš [predecessor.Custom('CZ_FirstName_A')],“ povzdechne si [regent.GetFirstNameNoTooltip] a zjevně se ponoří do vzpomínek. „Vypadáš úplně jako [Select_CString(predecessor.IsFemale,'tvá','tvůj')] [ROOT.Char.Custom2('RelationToMeShort', predecessor)].“"
 bp2_yearly.0651.desc.rationale.loyalty: "\n\n„Víš, jakou mi děláš radost? Jsem [Select_CString(regent.IsFemale,'hrdá','hrdý')], že tě mohu chránit, dokud jsi ještě [ROOT.Char.Custom('GirlBoy')|l], a jednou budu ještě hrdější, až ti budu sloužit jako [ROOT.Char.GetWomanMan|l].“"
 bp2_yearly.0651.desc.rationale.compassion: "\n\n„Jaké mám štěstí, že ti mohu sloužit, [ROOT.Char.GetFirstNameNoTooltip],“ povzdechne si [regent.GetFirstNameNoTooltip]. „A ještě větší štěstí, že mohu sledovat, jak z tebe vyrůstá [ROOT.Char.GetWomanMan|l].“"
 bp2_yearly.0651.desc.rationale.fallback: "\n\n„[ROOT.Char.GetFirstNameNoTooltip], jednou z tebe bude [Select_CString(ROOT.Char.IsFemale,'ta největší','ten největší')] [ROOT.Char.GetTitleAsNameNoTooltip|l], [Select_CString(ROOT.Char.IsFemale,'jakou','jakého')] kdy dějiny [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] poznaly. Jsem [Select_CString(regent.IsFemale,'hrdá','hrdý')] na to, [Select_CString(ROOT.Char.IsFemale,'jakou ženou se stáváš','jakým mužem se stáváš')].“"
 bp2_yearly.0651.desc.outro: "\n\n„Vždycky tu pro tebe budu, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]. Ať třeba povstane i [regent.GetFaith.random_NegativeAfterLife], na mě se můžeš spolehnout.“"
 bp2_yearly.0651.a: "A přísaháš, že mě nikdy nezradíš?"
 bp2_yearly.0651.b: "[ROOT.Char.GetFirstNameNoTooltip] a [regent.GetFirstNameNoTooltip], přátelé navždy!"
 bp2_yearly.0651.c: "To je hezké, ale já přece vyprávím příběh."
 bp2_yearly.0651.d: "Pojď, povíme celému dvoru, co jsem dnes [Select_CString(ROOT.Char.IsFemale,'zažila','zažil')]!"
 bp2_yearly.0661.t: "Nástroj v cizích rukou"
 bp2_yearly.0661.desc: "„#EMP Vždyť [Select_CString(ROOT.Char.IsFemale,'ta','ten')] [offended_family.Custom2('GetWomanManGirlBoy', ROOT.Char)|l] je [Select_CString(ROOT.Char.IsFemale,'moje','můj')] [offended_family.Custom2('RelationToMeShort', ROOT.Char)]!#!“ křičí [offended_family.GetFirstName] na [regent.Custom('CZ_FirstName_A')], [Select_CString(regent.IsFemale,'která','který')] u mě zastává úřad [ROOT.Char.GetDiarchTitle|l]. Hádají se v jedné z mnoha prázdných síní [CZPrepV(ROOT.Char.GetCapitalLocation.GetNameNoTooltip)|l] [CZProvName(ROOT.Char.GetCapitalLocation,'L')]. „Nemůžeš mi [Select_CString(ROOT.Char.IsFemale,'ji','ho')] takhle odpírat!“\n\nPůvodně jsem neměl[Select_CString(ROOT.Char.IsFemale,'a','')] v úmyslu poslouchat cizí rozhovor. Na jejich hádku jsem narazil[Select_CString(ROOT.Char.IsFemale,'a','')] náhodou, když jsem se [Select_CString(ROOT.Char.IsFemale,'hnala','hnal')] za jedním ze služebníků. Teď však zůstávám skrytě poblíž a naslouchám jejich sporu.\n\n„[ROOT.Char.GetFirstNameNoTooltip|U] je možná [Select_CString(ROOT.Char.IsFemale,'tvá','tvůj')] [offended_family.Custom2('RelationToMeShort', ROOT.Char)], ale do doby, než uznám, že [Select_CString(ROOT.Char.IsFemale,'je připravena','je připraven')] spravovat své vlastní záležitosti, zůstává #EMP v mé#! péči. Do té doby zastupuji [ROOT.Char.Custom('CZ_TitledFirstName_A')] já! A podle mého názoru jsou lidé jako ty tím nejhorším možným vlivem na mladou mysl.“"
 bp2_yearly.0661.a: "[regent.GetFirstNameNoTooltip|U] má pravdu! Styď se, [offended_family.Custom('CZ_FirstNameNoTooltip_V')]!"
 bp2_yearly.0661.b: "[offended_family.GetFirstNameNoTooltip|U] je [Select_CString(offended_family.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', offended_family)] a ty [Select_CString(offended_family.IsFemale,'ji','ho')] budeš respektovat!"
 bp2_yearly.0661.c.rowdy: "Ať si to vyřeší sami. Mám důležitější věci na práci."
 bp2_yearly.0661.c.charming: "Když se přikloním na jednu stranu, nic tím nezískám."
 bp2_yearly.0661.c.curious: "Zajímavé, ale co ten služebník..."
 bp2_yearly.0661.c.pensive: "S touhle hádkou nechci mít nic společného."
 bp2_yearly.0661.c.bossy: "Až budu skutečně [ROOT.Char.GetTitleAsNameNoTooltip|l], vyřídím si to s nimi [Select_CString(ROOT.Char.IsFemale,'sama','sám')]."
