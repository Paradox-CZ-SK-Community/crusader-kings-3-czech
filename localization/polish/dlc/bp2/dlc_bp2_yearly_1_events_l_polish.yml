l_polish:
 bp2_yearly.1000.t: "Jak se do lesa volá..."
 bp2_yearly.1000.desc_drunkard: "„Ještě... ještě jednu rundu, služebníku, proším... #EMP *škyt*!#!“\n\n[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] mi tak zamotal jazyk, že sotva mluvím, ale jeho příjemnému opojení jsem propadl[Select_CString(ROOT.Char.IsFemale,'a','')] natolik, že už je mi to jedno. Vlastně je mi jedno skoro všechno.\n\nAlkohol se najednou rozhodne opustit mé tělo v mohutném proudu, a to přímo na mou večeři! Hosté kolem mě znechuceně odfrknou."
 bp2_yearly.1000.desc_hashishiyah: "Hašiš je tentokrát mimořádně kvalitní. Tak silný, že mě z něj začne svědit kůže a oblečení mi připadá #EMP nesnesitelně těsné!#!\n\nSvléknu se donaha a z náhlého rozmaru se rozběhnu ven za ptačím zpěvem. O chvíli později se otočím..."
 bp2_yearly.1000.desc_reclusive: "„Zatracení hlupáci a prašiví čoklové, jeden jako druhý!“ zamumlám, když se konečně uchýlím do vytouženého ticha a samoty. Promnu si spánky a zavřu oči.\n\nNečekaný zvuk mě vrátí do reality. Prudce otevřu oči. #EMP Copak ani tady nemůžu mít svůj vytoužený klid?!#! Zamumlám další kletbu."
 bp2_yearly.1000.desc_irritable: "Je pozdní večer. Všude kolem mě žvaní bezvýznamní příživníci a bolest hlavy mi zatlouká hřebíky přímo do myšlenek.\n\nHned vedle mě někdo upustí džbán, který se s rachotem roztříští o podlahu.\n\nBez zaváhání vybuchnu a rozkřičím se na provinilého sluhu: „Ty drzá #EMP [dummy_gender.Custom2('InsultNounClumsy', ROOT.Char)|l]!#! Copak tě zplodil nějaký [dummy_gender.Custom2('InsultAdjectiveClumsy', ROOT.Char)|l] zlobr?!“"
 bp2_yearly.1000.desc_flagellant: "#EMP *PRÁSK!*#! Bič se mi zuřivě zařezává do těla, #EMP znovu#! a #EMP znovu#!. Ta ostrá, palčivá bolest mi pomáhá soustředit myšlenky.\n\nJeště několikrát se udeřím bičem. Každá rána mě přivádí o nepatrný krůček blíž ke sladkému rozhřešení."
 bp2_yearly.1000.desc_profligate: "„#EMP Hmm#!, tohle vypadá dobře. Ano, a tamto také.“ Když dokončím výběr, předám všechny ty nádherné věci svým služebníkům.\n\nOtočím se a spatřím celou horu zbytečností, které se mi podařilo nashromáždit. Začíná být poněkud... rozměrná. A můj měšec je zase... poněkud prázdný."
 bp2_yearly.1000.desc_improvident: "Nádherné kázání, dokonalý obřad. [ROOT.Char.GetFaith.HouseOfWorship|U] už zůstává za námi a já samozřejmě nezapomenu náležitě odměnit duchovní službu. [ROOT.Char.Custom('DefaultPriestTitle')|U] dostane nejen mince, ale i všechny šperky, které si mohu dovolit darovat. Někteří přihlížející se na mě dívají úkosem.\n\nAle zlato je pomíjivé! Mnohem tíživější je břemeno viny a hanby..."
 bp2_yearly.1000.desc_contrite: "[other_guest.GetTitledFirstName|U] na mě nevěřícně zírá, očividně [Select_CString(other_guest.IsFemale,'zděšená','zděšený')] důvěrnými podrobnostmi, které jsem právě při večeři [Select_CString(ROOT.Char.IsFemale,'přiznala','přiznal')]. „Ty jsi [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')] #EMP co#!?“ zopakuje zmateně.\n\nMá kajícnost má své výhody, ale přiznávám, že i nevýhody. Cítím, jak ze mě spadlo břemeno... Jenže není to proto, že jsem ho právě [Select_CString(ROOT.Char.IsFemale,'přenesla','přenesl')] na někoho jiného?"
 bp2_yearly.1000.desc_comfort_eater: "Opřu se do židle, #EMP nejspíš#! už pořádně [Select_CString(ROOT.Char.IsFemale,'přejedená','přejedený')], ale mezi rty mi přesto vklouzne další lahodné sousto. Po náročném a rušném dopoledni jako by se všechny starosti rozplynuly.\n\nRozhlédnu se. Všude kolem mě leží bezpočet prázdných talířů a ve vzduchu stále voní [ROOT.Char.Custom('FavoriteTreat')|l]. Bezpočet talířů."
 bp2_yearly.1000.desc_inappetetic: "Bezmyšlenkovitě se přehrabuji v jídle před sebou a přesouvám sousta po talíři, aby to vypadalo, že jsem něco [Select_CString(ROOT.Char.IsFemale,'snědla','snědl')]. Nechci nikoho znepokojovat.\n\nKdo má vůbec čas jíst? Den patří vládnutí a noc politickým jednáním. Jak bych si mohl[Select_CString(ROOT.Char.IsFemale,'a','')] vychutnat jídlo, když na mně leží tolik starostí?"
 bp2_yearly.1000.desc_journaller: "S úlevou si povzdechnu a odložím psací potřeby. Pohledem přejedu svůj malý, značně ohmataný deník, plný poznámek a čmáranic, který mě téměř nikdy neopouští.\n\nZvednu hlavu a zjistím, že ranní sluneční světlo už dávno vystřídal západ slunce. #EMP Jak dlouho#! jsem se to vlastně [Select_CString(ROOT.Char.IsFemale,'trápila','trápil')] s hledáním správných slov?"
 bp2_yearly.1000.desc_confider: "Ať už při snídani, nebo na neformálním setkání, často se nakláním ke své důvěrné osobě [confider_friend.Custom('CZ_TitledFirstName_D')] a svěřuji se se svými názory.\n\nJak příjemné je vyslovit své myšlenky nahlas a spolehnout se na názor přítele! Když si vyslechnu radu [confider_friend.Custom('CZ_FirstNameNoTooltip_G')] ohledně jedné drobné záležitosti, rozhlédnu se po rušném stole..."
 bp2_yearly.1000.desc_athletic: "Dávám si další běžecké kolečko a kolem mě se znovu míhá [ROOT.Char.Custom('ResidenceBuilding')|l]. Po zádech mi stéká pot a občas zachytím pohledy přihlížejících. Silné tělo skutečně plodí zdravého ducha!\n\nS hlasitým výkřikem zastavím, popadnu veliký kámen a zvednu ho až k hrudi."
 bp2_yearly.1000.outro_bad: "\n\n...a vtom spatřím, jak na mě upřeně hledí [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))|l] [appropriate_child.GetTitledFirstName]. #EMP Hmm.#!"
 bp2_yearly.1000.outro: "\n\n...a pak si všimnu, že mě zvědavě pozoruje [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))|l] [appropriate_child.GetFirstName]."
 bp2_yearly.1000.a: "Tohle zrovna nebyla má nejlepší chvíle..."
 bp2_yearly.1000.a_good: "Tak kde jsme to přestali..."
 bp2_yearly.1000.a.flavor: "Určitě to [appropriate_child.GetFirstNameNoTooltip] nijak nepoznamená..."
 bp2_yearly.1000.a.flavor_good: "Přece ne všechny návyky jsou špatné?"
 bp2_yearly.1000.a.tt: "Tvé chování může na [appropriate_child.Custom('CZ_ShortUIName_A')] zanechat trvalé následky"
 bp2_yearly.1000.b: "Nechceš se přidat?"
 bp2_yearly.1000.b_drunkard: "Nechceš se #EMP *škyt*!#! přidat?"
 bp2_yearly.1000.b_contrite: "A co #EMP ty#! mi přiznáš, dítě?"
 bp2_yearly.1000.b_inappetetic: "Jídlo je pro zvířata."
 bp2_yearly.1000.b_us: "Nechceš se k nám přidat?"
 bp2_yearly.1000.b_hashishiyah: "...Nechceš si taky trochu dát?"
 bp2_yearly.1000.b_reclusive: "Prosím, #EMP odejdi#!."
 bp2_yearly.1000.b_flagellant: "Někdy ti útěchu přinese jedině bič."
 bp2_yearly.1000.b_improvident: "Měšec je lehký, ale srdce ještě lehčí."
 bp2_yearly.1000.b_athletic: "Víš, ani [ROOT.Char.GetFaith.WitchGodName] mě nedokáže předběhnout."
 bp2_yearly.1000.b_agitated: "Na co #EMP čumíš#!?!"
 bp2_yearly.1000.b.flavor: "Čím víc nás bude, tím líp!"
 bp2_yearly.1000.b.flavor_contrite: "Tajemství jsou jako zanícené rány..."
 bp2_yearly.1000.b.flavor_inappetetic: "Raději bychom se měli vrátit ke skutečné práci."
 bp2_yearly.1000.b.flavor_confider: "Svěřovat se je umění!"
 bp2_yearly.1000.b.flavor_flagellant: "Je to pravda."
 bp2_yearly.1000.b.flavor_improvident: "Musíme se starat o ty, kteří neměli tolik štěstí."
 bp2_yearly.1000.b.flavor_athletic: "...No, ne že bych to někdy [Select_CString(ROOT.Char.IsFemale,'zkoušela','zkoušel')]."
 bp2_yearly.1000.b.flavor_agitated: "Ta #EMP drzost#! některých lidí!"
 bp2_yearly.1001.t: "...tak se z lesa ozývá"
 bp2_yearly.1001.desc_drunkard: "Zásoby bývají #EMP obvykle#! dobře zabezpečené. Kuchařovo neustálé stěžování na krysy mi to připomíná dost často. Ostražitě se blížím k otevřeným dveřím, za nimiž se v přítmí rýsuje [ROOT.Char.Custom('GetRoom')|l].\n\nZnenadání se přede mnou objeví [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))|l] [appropriate_child.GetFirstName]. Ústa dokořán, oči skelné a z dechu je cítit [ROOT.Char.Custom('RegionalAlcoholicDrink')|l] i ukradené pamlsky."
 bp2_yearly.1001.desc_hashishiyah: "Najednou zaslechnu chichotání. Zvláštní, vždyť [ROOT.Char.Custom('GetRoom')|l] na první pohled zeje prázdnotou. Zvědavě vstoupím dovnitř a v koutě objevím [appropriate_child.Custom('CZ_FirstName_A')].\n\nDítě se snaží potlačit smích, ale ten pokřivený úsměv #EMP moc dobře znám#!. A co teprve zarudlé oči a nezaměnitelný pach hašiše!"
 bp2_yearly.1001.desc_reclusive: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))|U] [appropriate_child.GetFirstName] se už několik dní neukázal[Select_CString(appropriate_child.IsFemale,'a','')] v našich sídlech. Sluhové si začínají šeptat a příbuzní projevují znepokojení, a tak se vydám dítě hledat. Za dveřmi, k nimž dorazím, se nachází [ROOT.Char.Custom('GetChamber')|l].\n\nKdyž vstoupím dovnitř, koneckonců celé to tu patří #EMP mně#!, [appropriate_child.GetFirstNameNoTooltip] se prudce otočí a bez sebemenší zdvořilosti na mě zasyčí, ať vypadnu a nechám dítě na pokoji."
 bp2_yearly.1001.desc_irritable: "Cestou od večeře na záchod narazím na [appropriate_child.Custom('CZ_FirstName_A')], [Select_CString(appropriate_child.IsFemale,'která je','který je')] #EMP pořádně#! rozzuřený[Select_CString(appropriate_child.IsFemale,'á','')].\n\n„#EMP Ty drzá [appropriate_child.Custom2('InsultNounClumsy', SCOPE.sC('appropriate_child'))]!#!“ řve na služebníka. „Pošpinil[Select_CString(dummy_gender.IsFemale,'a','')] jsi mi [appropriate_child.Custom('child_object_of_interest')]! Proč se raději neutopíš v sudu, kde je [ROOT.Char.Custom('RegionalDrink')|l]?!“"
 bp2_yearly.1001.desc_flagellant: "[ROOT.Char.Custom('GetDungeonPlural')|U] duní bolestným křikem... #EMP dětským#! křikem. Okamžitě se tam rozběhnu.\n\nPřimhouřím oči a spatřím [appropriate_child.Custom('CZ_FirstName_A')]. A... #EMP není to snad jeden z mých bičů?!#! Zůstanu stát s otevřenou pusou, zatímco se dítě samo bičuje. Každý úder jako by měl dokázat, že [ROOT.Char.GetFaith.HighGodNameAlternate] si žádá pokání."
 bp2_yearly.1001.desc_profligate: "Už potřetí během několika týdnů mě [appropriate_child.GetFirstName] prosí o novou, drahou hračku. Kupci nás pronásledují při každém kroku, sotva opustíme [ROOT.Char.Custom('FortifiedBuilding')|l].\n\nZačíná mě to poněkud znepokojovat. Co když bude mít [appropriate_child.GetFirstNameNoTooltip] jednou vlastní pokladnici? Takové utrácení...\n\nA co si to dítě právě pořídilo? Vypadá to jako [ROOT.Char.Custom('GetAccessory')|l]! Vždyť přesně takovou věc jsem si kdysi koupil[Select_CString(ROOT.Char.IsFemale,'a','')] i já!"
 bp2_yearly.1001.desc_improvident: "V posledních dnech jsem si všiml[Select_CString(ROOT.Char.IsFemale,'a','')], že [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))|l] [appropriate_child.GetFirstName] rozdává ostatním dětem spoustu svých hraček.\n\nPři vzácných návštěvách mezi prostým lidem mě navíc neustále přemlouvá, abych [Select_CString(ROOT.Char.IsFemale,'obdarovávala','obdarovával')] žebráky. A při každém vyprávění o nešťastném osudu nějaké chudé vdovy se zastaví a rozpláče!"
 bp2_yearly.1001.desc_contrite: "[appropriate_child.GetFirstName|U] stojí na truhle a kolem sebe shromáždil[Select_CString(appropriate_child.IsFemale,'a','')] hlouček dětí. Vypráví jim ta nejobyčejnější tajemství, jaká si lze představit, a postupně je přiměje, aby se i ony přiznaly ke svým prohřeškům.\n\n„J-já jsem snědl[Select_CString(dummy_gender.IsFemale,'a','')] poslední [appropriate_child.Custom('FavoriteTreat')],“ přizná roztřeseně [dummy_gender.Custom('GirlBoy')]. „Já jsem zabil krysu!“ svěří se další dítě."
 bp2_yearly.1001.desc_comfort_eater: "Při plnění každodenních povinností si všimnu něčeho neobvyklého. [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))|U] [appropriate_child.GetFirstName] se schovává v úkrytu a spokojeně se cpe. Všude kolem se povalují hromady dobrot, mezi nimiž nechybí [appropriate_child.Custom('FavoriteTreat')|l].\n\nV poslední době se toho tu #EMP opravdu hodně#! děje a [appropriate_child.GetFirstNameNoTooltip] se mezitím #EMP poněkud zakulatil[Select_CString(appropriate_child.IsFemale,'a','')]#!..."
 bp2_yearly.1001.desc_inappetetic: "Při večeři si všímám, že [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))|l] [appropriate_child.GetFirstName] působí pokaždé netrpělivě. Gesty odhání služebníky s podnosy, aby dali pokoj.\n\nMožná se jen nemůže dočkat, až odejde za jinými činnostmi? Anebo se mi to nezdá a tváře toho dítěte jsou nějaké... bledé a propadlé?"
 bp2_yearly.1001.desc_journaller: "V poslední době se všude povalují ručně popsané lístky. Dokonce i [ROOT.Char.Custom('GetCourt')|l] je jimi doslova posetý. Odkud se berou? Původcem je [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))|l] [appropriate_child.GetFirstName], [Select_CString(appropriate_child.IsFemale,'schoulená','schoulený')] v prázdné komnatě nad papírem a zcela [Select_CString(appropriate_child.IsFemale,'pohroužená','pohroužený')] do psaní.\n\nVzpomenu si na vlastní zálibu v psaní a svůj deník plný nejrůznějších úvah. Možná se mi podařilo předat skutečně užitečný návyk."
 bp2_yearly.1001.desc_confider: "V poslední době pozoruji u [appropriate_child.Custom('CZ_FirstName_G')] nenápadnou změnu. Dítě tráví stále více času se svými blízkými přáteli, s nimiž si šeptá a směje se.\n\nPřísahal[Select_CString(ROOT.Char.IsFemale,'a','')] bych, že ti [appropriate_child.Custom('GirlBoyPlural')|l] vědí o [appropriate_child.Custom('CZ_FirstName_I')] víc než já. Jejich pouto se zdá být velmi silné. Takoví přátelé, kterým se člověk může bez obav svěřit, jsou skutečným darem."
 bp2_yearly.1001.desc_athletic: "Vyjdu ven a kolem mě se prožene skupinka dětí. Jedno z nich je očividně rychlejší a obratnější než ostatní.\n\nVždyť je to [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))|l] [appropriate_child.GetFirstName], [Select_CString(appropriate_child.IsFemale,'která','který')] nechává ostatní daleko za sebou!\n\nPovzbudivě se usměji, ohromen[Select_CString(ROOT.Char.IsFemale,'á','')] nečekaným projevem vůle a vytrvalosti. Ostatní běžci brzy vyčerpaně zastaví, ale [appropriate_child.GetFirstNameNoTooltip] běží dál. Srdce se mi nadouvá pýchou!"
 bp2_yearly.1001.outro_bad: "\n\nPotácivě od toho výjevu ustoupím. Takhle se snad chovám i #EMP já#!?"
 bp2_yearly.1001.outro: "\n\nMožná to nakonec není tak strašný návyk?"
 bp2_yearly.1001.a: "[appropriate_child.Custom('CZ_FirstNameNoTooltip_V')], pojď sem."
 bp2_yearly.1001.a.flavor: "Dělej, co říkám, ne to, co dělám."
 bp2_yearly.1001.a.flavor_good: "Takové chování si zaslouží povzbuzení!"
 bp2_yearly.1001.a.no_trait.t: "Poučení"
 bp2_yearly.1001.a.no_trait.desc: "[appropriate_child.GetFirstNameNoTooltip|U] se zbaví tohoto návyku"
 bp2_yearly.1001.a.trait.t: "Získaný rys"
 bp2_yearly.1001.a.trait.desc: "[appropriate_child.GetFirstNameNoTooltip|U] si tento návyk ještě více osvojí"
 bp2_yearly.1001.b: "Co to #EMP vlastně#! dělám?"
 bp2_yearly.1001.b.flavor: "Musím na sobě zapracovat."
 bp2_yearly.1001.c: "Já... teď se s tím nedokážu vypořádat."
 bp2_yearly.1001.c_ecc_sadist: "[Select_CString(appropriate_child.IsFemale,'To je moje holka!','To je můj kluk!')]"
 bp2_yearly.1001.c_callous: "Kdo jsem, abych do toho zasahoval[Select_CString(ROOT.Char.IsFemale,'a','')]?"
 bp2_yearly.1001.c.flavor: "Určitě se o to postará někdo jiný."
 bp2_yearly.1001.c.flavor_ecc_sadist: "Ať maso #EMP zpívá!#!"
 bp2_yearly.1001.c.flavor_callous: "Kdo vůbec tvrdil, že je výchova dětí obtížná?"
 bp2_yearly.1005.t: "Děti vidí, děti..."
 bp2_yearly.1005.intro: "V poslední době si všímám, že [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('stressed_adult'))|l] [stressed_adult.GetTitledFirstName]"
 bp2_yearly.1005.desc_drunkard: " často popíjí [ROOT.Char.Custom('RegionalAlcoholicDrink')|l].\n\nJednou jsem dokonce objevil[Select_CString(ROOT.Char.IsFemale,'a','')] [stressed_adult.Custom('CZ_FirstName_A')] v zákoutí [stressed_adult.Custom('ResidenceBuilding')|l], obličejem zabořeným do louže... pochybného původu. Alkohol očividně zcela zatemnil [stressed_adult.Custom('CZ_FirstNameNoTooltip_D')] mysl.\n\nNavzdory tomu žalostnému vzezření však [stressed_adult.GetFirstNameNoTooltip] působil[Select_CString(stressed_adult.IsFemale,'a','')] docela spokojeně."
 bp2_yearly.1005.desc_hashishiyah: " se poslední dobou často vytrácí někam do ústraní, aby si dopřál[Select_CString(stressed_adult.IsFemale,'a','')] hašiš.\n\nJednou dokonce [stressed_adult.GetFirstNameNoTooltip] strávil[Select_CString(stressed_adult.IsFemale,'a','')] celý den na podlaze místnosti, kterou nazývá [stressed_adult.Custom('GetChamber')|l]. Prý bylo potřeba „důkladně prozkoumat strop“, jak mi bylo vysvětleno skelným pohledem.\n\nMusí to být docela příjemný způsob odpočinku."
 bp2_yearly.1005.desc_reclusive: " se v poslední době skrývá před světem a téměř nevychází z místa zvaného [stressed_adult.Custom('GetChamber')|l].\n\nMinulý týden tam [stressed_adult.GetFirstNameNoTooltip] zůstal[Select_CString(stressed_adult.IsFemale,'a','')] dokonce několik dní a nechával[Select_CString(stressed_adult.IsFemale,'a','')] si nosit jídlo až dovnitř.\n\nPůsobilo to docela poklidně, přestože kvůli tomu [stressed_adult.GetFirstNameNoTooltip] zanedbal[Select_CString(stressed_adult.IsFemale,'a','')] některé události u dvora."
 bp2_yearly.1005.desc_irritable: " v poslední době často ostatní přísně kárá a vybuchuje kvůli naprostým maličkostem.\n\nNedávno málem ukousl[Select_CString(stressed_adult.IsFemale,'a','')] hlavu jednomu ze služebníků jen proto, že špatně ohrnul prostěradlo.\n\nPotom však [stressed_adult.GetFirstNameNoTooltip] působil[Select_CString(stressed_adult.IsFemale,'a','')] pozoruhodně klidně."
 bp2_yearly.1005.desc_flagellant: " si v poslední době dobrovolně způsobuje bolest.\n\nNedávno jsem dokonce zaslechl[Select_CString(ROOT.Char.IsFemale,'a','')], jak se [stressed_adult.GetFirstNameNoTooltip] bičuje a přitom odříkává náboženské verše.\n\nZpočátku mě to vyděsilo, ale zdálo se, že to [stressed_adult.Custom('CZ_FirstNameNoTooltip_D')] skutečně přináší úlevu."
 bp2_yearly.1005.desc_profligate: " si v poslední době pořizuje spoustu neobvyklých předmětů.\n\nNěkteří služebníci je považují za bezcenné cetky a říkají, že [stressed_adult.GetFirstNameNoTooltip] jen vyhazuje zlato oknem.\n\nJá si tím však nejsem tak [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')]. Vždyť sbírání těch drobností očividně přináší [stressed_adult.Custom('CZ_FirstNameNoTooltip_D')] radost!"
 bp2_yearly.1005.desc_improvident: " v poslední době rozdává značné množství zlata na dobročinné účely.\n\nVšiml[Select_CString(ROOT.Char.IsFemale,'a','')] jsem si, že někteří lidé u dvora to neschvalují. Dokonce tvrdí, že [stressed_adult.GetFirstNameNoTooltip] vůbec neumí hospodařit s penězi.\n\nAle jestli to [stressed_adult.Custom('CZ_FirstNameNoTooltip_D')] zlepšuje náladu, pak je to přece dobře, ne...?"
 bp2_yearly.1005.desc_contrite: " se v poslední době přiznává i k těm nejmenším prohřeškům.\n\nNedávno se dokonce [stressed_adult.GetFirstNameNoTooltip] přiznal[Select_CString(stressed_adult.IsFemale,'a','')] jednomu služebníkovi, že se [Select_CString(stressed_adult.IsFemale,'jí','mu')] příliš nelíbí jeho oblečení a že kvůli tomu má výčitky svědomí.\n\nPřipadalo mi to trochu malicherné, ale jestli to přináší klid na duši...?"
 bp2_yearly.1005.desc_comfort_eater: " v poslední době spořádá neuvěřitelné množství dobrot, mezi nimiž nechybí [stressed_adult.Custom('FavoriteTreat')|l].\n\nA tím neuvěřitelným množstvím nemyslím pět nebo deset porcí, ale klidně třikrát tolik! Dokonce jsem zaslechl[Select_CString(ROOT.Char.IsFemale,'a','')], jak si služebníci šeptají, že krejčí musel nedávno zvětšovat oblečení [stressed_adult.Custom('CZ_FirstNameNoTooltip_G')].\n\nZdá se však, že takové hodování přináší [stressed_adult.Custom('CZ_FirstNameNoTooltip_D')] skutečnou útěchu..."
 bp2_yearly.1005.desc_inappetetic: " v poslední době občas vynechává večeři.\n\nVlastně jsem [stressed_adult.Custom('CZ_FirstName_A')] neviděl[Select_CString(ROOT.Char.IsFemale,'a','')] jíst už od včerejšího rána. Služebníci si navíc šeptají, že krejčí musel minulý týden zmenšovat oblečení [stressed_adult.Custom('CZ_FirstNameNoTooltip_G')].\n\nJe to něco špatného?"
 bp2_yearly.1005.desc_journaller: " má poslední dobou prsty neustále umazané inkoustem.\n\n[stressed_adult.GetFirstNameNoTooltip|U] nikam nechodí bez své knihy v kožené vazbě a pořád si do ní něco zapisuje.\n\nOdhlédnu-li od těch inkoustových skvrn, zdá se mi, že [stressed_adult.GetFirstNameNoTooltip] je v poslední době klidnější a má ve všem větší pořádek. Vypadá to... příjemně."
 bp2_yearly.1005.desc_confider: " v poslední době téměř neustále něco šeptá do ucha své důvěrné osobě [confidant_friend.Custom('CZ_TitledFirstName_D')].\n\nKdyž spolu chodí bok po boku, chichotají se a svěřují si snad úplně všechno.\n\nMusí být krásné mít někoho, komu se člověk může svěřit se vším dobrým i špatným, co ho v životě potká."
 bp2_yearly.1005.desc_athletic: " v poslední době za slunce i deště běhá jedno kolečko za druhým kolem svého sídla, jímž je [stressed_adult.Custom('ResidenceBuilding')|l].\n\nNěkteří dvořané ohrnují nos nad pižmovým pachem potu, který po takovém cvičení zůstává. Zdá se však, že jejich posměšky jen posilují odhodlání [stressed_adult.Custom('CZ_FirstNameNoTooltip_G')].\n\nDocela mě to zajímá."
 bp2_yearly.1005.a: "To bych měl[Select_CString(ROOT.Char.IsFemale,'a','')] zkusit."
 bp2_yearly.1005.a.flavor: "Co by se mohlo stát...?"
 bp2_yearly.1005.a.stressed.t: "Stres"
 bp2_yearly.1005.a.stressed.desc: "Rozhodně to #EMP nebyl#! příjemný zážitek"
 bp2_yearly.1005.a.trait.desc: "#EMP Velmi#! se ti to zalíbí"
 bp2_yearly.1005.a.insight.t: "Prozření"
 bp2_yearly.1005.a.insight.desc: "Najdeš lepší způsob"
 bp2_yearly.1005.b: "Raději ne."
 bp2_yearly.1010.t: "Bezpodmínečná láska"
 bp2_yearly.1010.intro: "Skláním se nad mapou ve své pracovně, když mě náhlé #EMP zavrzání#! přiměje otočit hlavu ke dveřím. Na prahu se objeví [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hugging_child'))|l] [hugging_child.GetFirstName]"
 bp2_yearly.1010.desc_toddler: " a na svůj věk překvapivě rychle se ke mně přibatolí.\n\nDítě se pevně obejme kolem mé nohy, přitulí se k ní a zakloní hlavičku, aby se na mě mohlo podívat."
 bp2_yearly.1010.desc_rambler: " a jako vítr se ke mně rozběhne s hlasitým výkřikem: #EMP „Obejmout!“#!\n\nPřitulí se ke mně a pevně mě obejme kolem pasu."
 bp2_yearly.1010.desc_kid: " a vstoupí dovnitř.\n\nChvíli si mě prohlíží s nečitelným výrazem, pak ke mně přistoupí a pevně mě obejme."
 bp2_yearly.1010.desc_teenager: " a ledabyle vstoupí do místnosti, jako by si mé přítomnosti ani nevšímalo.\n\nPak mě však bez varování pevně obejme. Vzápětí mě s rozpačitým výrazem zase pustí."
 bp2_yearly.1010.outro_callous: "\n\nCo je to za zvláštní hřejivý pocit v mé hrudi...?"
 bp2_yearly.1010.outro_young: "\n\nPodívám se na [hugging_child.Custom('CZ_FirstName_A')] a v oku se mi zaleskne nenápadná slza. Jemně pohladím dítě po vlasech, abych mu objetí oplatil[Select_CString(ROOT.Char.IsFemale,'a','')]."
 bp2_yearly.1010.outro_older: "\n\nPodívám se na [hugging_child.Custom('CZ_FirstName_A')] a v oku se mi zaleskne nenápadná slza. Jemně stisknu dítěti rameno, abych mu objetí oplatil[Select_CString(ROOT.Char.IsFemale,'a','')]."
 bp2_yearly.1010.a: "Jsi [Select_CString(hugging_child.IsFemale,'hodná dcera','hodný syn')]..."
 bp2_yearly.1010.a_callous: "No tak, no tak."
 bp2_yearly.1010.a.flavor: "Neplač. Hlavně NEPLAČ."
 bp2_yearly.1010.a.flavor_callous: "A teď už mě pusť..."
 bp2_yearly.1015.t: "Zlaté dítě"
 bp2_yearly.1015.intro: "Jednoho rána, když se připravuji na nový den, ke mně přistoupí [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('golden_child'))|l] [golden_child.GetFirstName] a osloví mě:"
 bp2_yearly.1015.desc_guardian: "\n\n„[ROOT.Char.Custom('MistressMaster')|U] [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')],"
 bp2_yearly.1015.desc_parent: "\n\n„[Select_CString(ROOT.Char.IsFemale,'Maminko','Tatínku')],"
 bp2_yearly.1015.outro: " včera jsme to našli při prozkoumávání sídla. Měl[Select_CString(ROOT.Char.IsFemale,'a','')] bys to mít ty.“ Dítě mi podá malý, ošoupaný měšec, v němž to zacinká."
 bp2_yearly.1015.a: "Mnohokrát děkuji!"
 bp2_yearly.1015.a.flavor: "Jaké milé dítě."
 bp2_yearly.1015.a.flavor_greedy: "To je všechno...?"
 bp2_yearly.1015.b: "Nech si to. A investuj!"
 bp2_yearly.1015.b.tt: "Tím se dále podpoří [Concept('education_focus','zaměření vzdělání')|E] [golden_child.Custom('CZ_FirstNameNoTooltip_G')] na [Concept('stewardship','správcovství')|E]"
 bp2_yearly.1015.b.tt_matching: "Tím se výrazně podpoří [Concept('education_focus','zaměření vzdělání')|E] [golden_child.Custom('CZ_FirstNameNoTooltip_G')] na [Concept('stewardship','správcovství')|E]"
 bp2_yearly.1020.t: "Tajemství na dosah"
 bp2_yearly.1020.intro: "Právě se skláním pro náboženský spis, abych se pustil[Select_CString(ROOT.Char.IsFemale,'a','')] do studia, když mě vyruší hlasitý dupot. [ROOT.Char.Custom('GetRoom')|U] už rozhodně není místem klidného rozjímání, protože dovnitř vtrhne [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('secrety_child'))|l] [secrety_child.GetFirstName].\n\n"
 bp2_yearly.1020.desc_guardian: "„[ROOT.Char.Custom('MistressMaster')|U] [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')]! "
 bp2_yearly.1020.desc_parent: "„[Select_CString(ROOT.Char.IsFemale,'Maminko','Tatínku')]! "
 bp2_yearly.1020.desc: "Neuvěříš, co se mi podařilo zjistit o [secret_keeper.Custom('CZ_TitledFirstName_L')]!“ Dítě se na okamžik odmlčí, aby popadlo dech a dodalo svému odhalení na dramatičnosti."
 bp2_yearly.1020.a: "Tak tedy mluv!"
 bp2_yearly.1020.a.secret.t: "Odhalené tajemství"
 bp2_yearly.1020.a.tt: "Odhalíš tajemství jednoho ze svých dvořanů"
 bp2_yearly.1020.b: "Ale kdepak! Tajemství jsou cenná měna, [Select_CString(secrety_child.IsFemale,'má drahá','můj drahý')]!"
 bp2_yearly.1020.b.tt: "Tím se dále podpoří [Concept('education_focus','zaměření vzdělání')|E] [secrety_child.Custom('CZ_FirstNameNoTooltip_G')] na [Concept('intrigue','pletichářství')|E]"
 bp2_yearly.1020.b.tt_matching: "Tím se výrazně podpoří [Concept('education_focus','zaměření vzdělání')|E] [secrety_child.Custom('CZ_FirstNameNoTooltip_G')] na [Concept('intrigue','pletichářství')|E]"
 bp2_yearly.1030.t: "Jablko nepadá daleko od stromu"
 bp2_yearly.1030.desc: "V poslední době přemýšlím nad vzděláním svého dítěte [focus_child.Custom('CZ_FirstName_G')]. Opravdu je [focus_child.Custom('GetChildEducationFocus')|l] tou správnou volbou?\n\nJá sám jsem kdysi získal[Select_CString(ROOT.Char.IsFemale,'a','')] vzdělání v oboru [ROOT.Char.Custom('education_focus')|l] a získané znalosti mi už mnohokrát dobře posloužily.\n\nCopak by nemohly být stejně užitečné i pro [focus_child.Custom('CZ_FirstName_A')]?"
 bp2_yearly.1030.a: "Vychovám [focus_child.Custom('CZ_FirstName_A')] k obrazu svému."
 bp2_yearly.1030.a.tt_change: "[Concept('education_focus','Zaměření vzdělání')|EU] [focus_child.Custom('CZ_FirstNameNoTooltip_G')] se změní na [THIS.Char.Custom('GetEducationTraitConcept')|l]"
 bp2_yearly.1030.a.tt_tutor: "Osobně se ujmeš výuky [focus_child.Custom('CZ_FirstNameNoTooltip_G')], abys nahradil[Select_CString(ROOT.Char.IsFemale,'a','')] případné zameškané vzdělání"
 bp2_yearly.1030.b: "Rozmanité schopnosti mohou být jedině ku prospěchu."
 bp2_yearly.1030.b.tt: "Tím se dále podpoří [Concept('education_focus','zaměření vzdělání')|E] [focus_child.Custom('CZ_FirstNameNoTooltip_G')] na [focus_child.Custom('GetEducationTraitConcept')|l]"
 bp2_yearly.1035.t: "Neopracovaný poklad"
 bp2_yearly.1035.desc: "Během jedné z našich lekcí se zdržujeme v komnatě, kterou [rock_child.GetFirstName] používá ke studiu. Je to [ROOT.Char.Custom('GetChamber')|l], kde mě na polici zaujme působivá sbírka úhledně vystavených kamenů.\n\nJeden z kamenů obzvlášť vyniká. Na první pohled je drsný a nevzhledný, ale při bližším prozkoumání v něm objevím nádherný, sytě rudý lesk.\n\n[rock_child.GetFirstNameNoTooltip|U] si všimne mého zájmu, vezme kámen do ruky a podá mi jej. „Můžeš si ho nechat, "
 bp2_yearly.1035.desc_guardian: "[ROOT.Char.Custom('MistressMaster')|l] [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')].“"
 bp2_yearly.1035.desc_parent: "[Select_CString(ROOT.Char.IsFemale,'maminko','tatínku')].“"
 bp2_yearly.1035.a: "Ach. Děkuji."
 bp2_yearly.1035.a.flavor: "Není to snad... drahokam?"
 gemstone_trinket_rough: "Surový drahokam"
 gemstone_trinket_rough.desc: "Neopracovaný drahokam, který [rock_child.Custom('CZ_TitledFirstNameNoTooltip_I')] nalezl[Select_CString(rock_child.IsFemale,'a','')] v okolí [CZProvNameNoTooltip(trinket_location,'G')]."
 gemstone_trinket_modest: "Pěkný drahokam"
 gemstone_trinket_modest.desc: "Pěkný drahokam, který [rock_child.Custom('CZ_TitledFirstNameNoTooltip_I')] nalezl[Select_CString(rock_child.IsFemale,'a','')] v okolí [CZProvNameNoTooltip(trinket_location,'G')]."
 gemstone_trinket_brilliant: "Zářivý drahokam"
 gemstone_trinket_brilliant.desc: "Zářivý drahokam, který [rock_child.Custom('CZ_TitledFirstNameNoTooltip_I')] nalezl[Select_CString(rock_child.IsFemale,'a','')] v okolí [CZProvNameNoTooltip(trinket_location,'G')]."
 bp2_yearly.1035.b: "Tenhle kámen by sis měl[Select_CString(rock_child.IsFemale,'a','')] pořádně prostudovat."
 bp2_yearly.1035.b.tt: "Tím se dále podpoří [Concept('education_focus','zaměření vzdělání')|E] [rock_child.Custom('CZ_FirstNameNoTooltip_G')] na [Concept('learning','učenost')|E]"
 bp2_yearly.1035.b.tt_matching: "Tím se výrazně podpoří [Concept('education_focus','zaměření vzdělání')|E] [rock_child.Custom('CZ_FirstNameNoTooltip_G')] na [Concept('learning','učenost')|E]"
 bp2_yearly.1040.t: "Mocné pero"
 bp2_yearly.1040.desc: "Právě beru do ruky cvičné meče, abych si zašermoval[Select_CString(ROOT.Char.IsFemale,'a','')] [Select_CString(sparring_child.IsFemale,'se svou','se svým')] [ROOT.Char.Custom2('CZ_RelationToMeShort_I', SCOPE.sC('sparring_child'))|l] [sparring_child.Custom('CZ_FirstName_I')], když si všimnu odloženého, značně opotřebovaného sešitu.\n\nPodle obálky zřejmě obsahuje různá cvičení a doporučené postupy týkající se bojových umění.\n\n[sparring_child.GetFirstNameNoTooltip|U] si všimne mého pohledu. „Ach, tohle? Většinou si prohlížím obrázky. Klidně si to půjč.“"
 bp2_yearly.1040.a: "Zajímavé."
 bp2_yearly.1040.a.flavor: "„Uchop jílec, nikoli ostrý konec.“ Hm."
 bp2_yearly.1040.b: "Měli bychom si to vyzkoušet!"
 bp2_yearly.1040.b.tt: "Tím se dále podpoří [Concept('education_focus','zaměření vzdělání')|E] [sparring_child.Custom('CZ_FirstNameNoTooltip_G')] na [Concept('martial','válečnictví')|E]"
 bp2_yearly.1040.b.tt_matching: "Tím se výrazně podpoří [Concept('education_focus','zaměření vzdělání')|E] [sparring_child.Custom('CZ_FirstNameNoTooltip_G')] na [Concept('martial','válečnictví')|E]"
 bp2_yearly.1045.t: "Vyjednavač"
 bp2_yearly.1045.intro: "Při odpolední procházce ulicemi [CZProvNameNoTooltip(ROOT.Char.GetCurrentLocation,'G')] ke mně přiběhne [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('diplomacy_child'))|l] [diplomacy_child.GetFirstName]:"
 bp2_yearly.1045.desc_guardian: "$bp2_yearly.1020.desc_guardian$"
 bp2_yearly.1045.desc_parent: "„[Select_CString(ROOT.Char.IsFemale,'Maminko','Tatínku')]! "
 bp2_yearly.1045.desc: "Najednou se do sebe pustili a pak...“\n\n[diplomacy_child.GetFirstNameNoTooltip|U] nestačí ani domluvit, když nás přeruší pronikavý výkřik. Obrátíme se směrem k potyčce, která zuří o kus dál v ulici.\n\nDva mladí chlapci z #EMP mého#! dvora kolem sebe krouží a připravují se na další kolo rvačky."
 bp2_yearly.1045.a: "#EMP Okamžitě toho nechte, oba!#!"
 bp2_yearly.1045.a.perk.t: "Získaný talent"
 bp2_yearly.1045.a.flavor: "Rvačka... #EMP přímo na mém vlastním prahu#!..."
 bp2_yearly.1045.b: "#EMP Lákavé!#! Vsadím si na..."
 bp2_yearly.1045.b.flavor: "Tenhle vypadá pořádně nebezpečně."
 bp2_yearly.1045.b.win.t: "Vyhraná rvačka"
 bp2_yearly.1045.b.win.desc: "Tvůj bojovník zvítězí"
 bp2_yearly.1045.b.loss.t: "Prohraná rvačka"
 bp2_yearly.1045.b.loss.desc: "Tvůj bojovník prohraje"
 bp2_yearly.1045.c: "[diplomacy.Custom('CZ_FirstNameNoTooltip_V')], pomoz jim urovnat spor."
 bp2_yearly.1045.c.tt: "Tím se dále podpoří [Concept('education_focus','zaměření vzdělání')|E] [diplomacy_child.Custom('CZ_FirstNameNoTooltip_G')] na [Concept('diplomacy','diplomacii')|E]"
 bp2_yearly.1045.c.tt_matching: "Tím se výrazně podpoří [Concept('education_focus','zaměření vzdělání')|E] [diplomacy_child.Custom('CZ_FirstNameNoTooltip_G')] na [Concept('diplomacy','diplomacii')|E]"
 bp2_yearly.1050.t_builder: "[Select_CString(ROOT.Char.IsFemale,'Stavitelka','Stavitel')]"
 bp2_yearly.1050.t: "$bp2_yearly.1050.t_builder$: Hrad z písku"
 bp2_yearly.1050.t_twig: "$bp2_yearly.1050.t_builder$: Blížící se bouře"
 bp2_yearly.1050.desc: "Můj velkolepý hrad z písku se majestátně tyčí nad pláží. Celé odpoledne jsem [Select_CString(ROOT.Char.IsFemale,'strávila','strávil')] pečlivým vyřezáváním těch nejdrobnějších detailů do vlhkého písku.\n\nJenže čas neúprosně plyne a s ním postupuje i příliv. Každou vteřinou se přibližuje k mému blátivému mistrovskému dílu a pomalu nahlodává jeho základy.\n\nZoufale hledím na příliv a horečně přemýšlím, jak svůj hrad zachránit, než budu muset ustoupit."
 bp2_yearly.1050.desc_desert: "Slunce nám celý den nemilosrdně praží na záda, zatímco služebníci neúnavně nosí vodu pro můj velkolepý písečný hrad uprostřed pouště.\n\nPrávě dokončuji poslední drobný detail na nejvyšší věži, když si na obzoru všimnu blížící se písečné bouře.\n\nOkamžitě svraštím čelo a zoufale přemýšlím, jak svůj hrad ochránit před nadcházející bouří, než budu muset ustoupit do bezpečí."
 bp2_yearly.1050.desc_twig: "Můj nádherný model hradu z větviček a drobných kamenů působí vskutku velkolepě.\n\nPrávě dokončuji poslední úpravy nejvyšší věže, když se spustí déšť. Bouře, která se už nějakou dobu sbírala na obzoru, konečně dorazila až sem.\n\nZoufale vzhlédnu k bouřkovým mrakům a usilovně přemýšlím, jak svůj výtvor ochránit, než budu muset utéct do bezpečí."
 bp2_yearly.1050.a: "Uplatím příliv těmito lesklými oblázky!"
 bp2_yearly.1050.a.flavor: "Tyhle oblázky mám opravdu rád[Select_CString(ROOT.Char.IsFemale,'a','')]... ale obětuji je pro dobrou věc."
 bp2_yearly.1050.a_twig: "Uplatím bouři těmito třpytivými kamínky!"
 bp2_yearly.1050.a.flavor_twig: "Tyhle kamínky mám opravdu rád[Select_CString(ROOT.Char.IsFemale,'a','')]... ale obětuji je pro dobrou věc."
 bp2_yearly.1050.b: "Měl[Select_CString(ROOT.Char.IsFemale,'a','')] bych zpevnit vnější hradby."
 bp2_yearly.1050.b.flavor: "Za hradbami se #EMP vždycky#! cítím bezpečně."
 bp2_yearly.1050.c: "Na hlavním nádvoří postavím malou svatyni."
 bp2_yearly.1050.c.flavor: "Můj hrad jistě ochrání [ROOT.Char.GetFaith.HighGodNameAlternate]!"
 bp2_yearly.1051.t: "$bp2_yearly.1050.t_builder$: Pohyblivé písky"
 bp2_yearly.1051.t_twig: "$bp2_yearly.1050.t_builder$: Co zůstalo"
 bp2_yearly.1051.desc: "Když se následujícího dne vrátím na pláž, okamžitě pospíchám k místu, kde se ještě včera nad mokrým pískem tyčil můj majestátní hrad."
 bp2_yearly.1051.desc_desert: "Následujícího dne bouře konečně utichne a já se rozběhnu k místu, kde jsem ještě včera tak pečlivě budoval[Select_CString(ROOT.Char.IsFemale,'a','')] svůj velkolepý písečný hrad."
 bp2_yearly.1051.desc_twig: "Za časného úsvitu bouře konečně utichne a já se rozběhnu mezi keře, abych zjistil[Select_CString(ROOT.Char.IsFemale,'a','')], jaké škody napáchala na mém velkolepém hradu z větviček."
 bp2_yearly.1051.outro: "\n\nVětšina hradu zmizela, ale jedna část přece jen odolala. Nejvyšší věž, na níž stále zůstává drobný znak, který jsem si pečlivě [Select_CString(ROOT.Char.IsFemale,'vyřezala','vyřezal')]. #EMP Úspěch!#!\n\nU paty věže objevím malý duhově lesklý kámen, napůl zabořený do hlíny. Možná se mi to jen zdá, ale při bližším pohledu na něm rozeznávám obrys malého... kladívka?"
 bp2_yearly.1051.a: "Tentokrát jsi #EMP vyhrál#!, přílive."
 bp2_yearly.1051.a_twig: "Tentokrát jsi #EMP vyhrála#!, bouře."
 iridescent_stone_trinket: "Duhově lesklý kámen"
 iridescent_stone_trinket.desc: "Hladký kámen s duhovými odlesky, nalezený [CZPrepV(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)|l] [CZProvName(ROOT.Char.GetCurrentLocation,'L')]. Na jedné straně má tmavou skvrnu ve tvaru drobného kladívka. Zajímavé."
 bp2_yearly.1055.t: "$bp2_yearly.1050.t_builder$: Soutěž o nejlepší úkryt"
 bp2_yearly.1055.desc: "Celý den si hraji venku v přírodě a náramně si to užívám. Je to zkrátka báječný den, když ke mně najednou přistoupí "
 bp2_yearly.1055.desc_related: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('den_challenger'))|l] [den_challenger.GetTitledFirstName] a prohlásí: „Vyzývám tě na soutěž ve stavění úkrytů, [den_challenger.Custom2('RelationToMeShort', ROOT.Char)]!“"
 bp2_yearly.1055.desc_relations: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('den_challenger'))|l] [den_challenger.GetTitledFirstName] a prohlásí: „Vyzývám tě na soutěž ve stavění úkrytů, [ROOT.Char.GetFirstNameNoTooltip]!“"
 bp2_yearly.1055.desc_liege: "místní dítě: „Jmenuji se [den_challenger.GetTitledFirstName] a vyzývám tě na soutěž ve stavění úkrytů, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')] [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')]!“"
 bp2_yearly.1055.outro: "\n\n[den_challenger.GetFirstNameNoTooltip|U] se pyšně naparuje a vítězoslavně se na mě ušklíbá. O svém vítězství očividně vůbec nepochybuje."
 bp2_yearly.1055.a: "Jen si najmu pár pomocníků..."
 bp2_yearly.1055.a.flavor: "Když jim zaplatím, není to podvádění."
 bp2_yearly.1055.b: "Společně dokážeme postavit #EMP pevnější úkryt!#!"
 bp2_yearly.1055.b.flavor: "S vysokými hradbami."
 bp2_yearly.1055.c: "Mám práci se stavbou oltáře. Dej mi pokoj."
 bp2_yearly.1055.c.flavor: "Mé dílo smí soudit jedině [ROOT.Char.GetFaith.HighGodName]."
 bp2_yearly.1056.t_economy: "$bp2_yearly.1050.t_builder$: Bylo nás mnoho"
 bp2_yearly.1056.t_martial: "$bp2_yearly.1050.t_builder$: Byli jsme dva"
 bp2_yearly.1056.t_pious: "$bp2_yearly.1050.t_builder$: Promáčení na kost"
 bp2_yearly.1056.desc_economy: "Najmout místní děti a platit jim kořenovou zeleninou, jako je [ROOT.Char.Custom('RegionalRootVegetablePlural')|l], se ukázalo jako skvělý nápad. Díky tomu se nám podařilo postavit ten nejvelkolepější úkryt široko daleko v okolí [CZProvNameNoTooltip(ROOT.Char.GetCurrentLocation,'G')].\n\n[den_challenger.GetTitledFirstName|U] jen neradostně hledí na mé mistrovské dílo a rozmrzele bručí. Vlastnoručně postavený přístřešek mého soupeře je tak ubohý, že sotva ochrání před deštěm."
 bp2_yearly.1056.desc_martial: "[den_challenger.GetTitledFirstName|U] je překvapivě [Select_CString(den_challenger.IsFemale,'silná','silný')]. Společnými silami postavíme pořádný, pevný úkryt, a to právě včas! Sotva skončíme, nebesa se otevřou a spustí se mohutný liják.\n\nOblohou se míhají blesky, ale žádný nás nezasáhne. Pevné stěny našeho úkrytu nás spolehlivě chrání.\n\nSedíme uvnitř, v suchu a bezpečí díky vlastnímu úsilí, a já přemýšlím, jak cenná je vzájemná spolupráce a opravdové kamarádství."
 bp2_yearly.1056.desc_pious: "Sotva ozdobím vrchol oltáře starou větví, spustí se prudký déšť a my se musíme běžet schovat. Vtom z oblohy sjede mohutný blesk a s ohlušujícím #EMP PRÁSK!#! zasáhne přímo oltář. Okamžitě vyběhnu ven, abych [Select_CString(ROOT.Char.IsFemale,'zjistila','zjistil')], jaké škody napáchal.\n\nKdyž se oltář znovu objeví přede mnou, všimnu si slabého proužku kouře stoupajícího z větve. Jeden její konec je celý zčernalý a zásah ji pořádně poznamenal.\n\nOpatrně ji zvednu a důkladně si ji prohlédnu. V dlani je stále teplá."
 bp2_yearly.1056.a_economy: "Zaměstnávání druhých je skutečným #EMP kořenem#! prosperity."
 bp2_yearly.1056.a_martial: "Spojenectví je skvělá obrana. A hradby také."
 bp2_yearly.1056.a_pious: "Tím mi [ROOT.Char.GetFaith.HighGodNameAlternate] jistě dává znamení!"
 holy_stick: "Svatá hůl"
 holy_stick.desc: "Hůl zasažená bleskem [CZPrepV(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)|l] [CZProvName(ROOT.Char.GetCurrentLocation,'L')]. Na jejím držadle je černá stopa ve tvaru kladiva."
 bp2_yearly.1060.t: "$bp2_yearly.1050.t_builder$: Nezapomenutelná podívaná"
 bp2_yearly.1060.desc: "Na dnešek nemám žádné zvláštní plány, a tak se nabízí skvělá příležitost poznat různé stránky naší slavné državy [ROOT.Var('the_builder_sightseed_capital').GetProvince.GetName].\n\nOtázkou je, co by mi přineslo nejvíce užitku. Mám navštívit vojenský areál, kterému velí [martial_character.GetTitledFirstName], obchodní čtvrť spravovanou [steward_character.Custom('CZ_TitledFirstName_I')], nebo se setkat s [learned_character.Custom('CZ_TitledFirstName_I')] tam, kde stojí [ROOT.Char.GetFaith.HouseOfWorship]?"
 economical_architecture_book: "Architektura obchodu"
 economical_architecture_book_desc: "Kronika dějin obchodních přístavů a jejich strategického umístění."
 martial_architecture_book: "Hrad a jeho služebnictvo"
 martial_architecture_book_desc: "Kronika pojednávající o umění stavby hradů."
 religious_architecture_book: "Dei Gratia"
 religious_architecture_book_desc: "Pečlivě sestavený soupis významných bohoslužebných míst [CZPrepV(ROOT.Char.GetCurrentLocation.GetCounty.GetNameNoTooltip)|l] [ROOT.Char.GetCurrentLocation.GetCounty.Custom('CZ_LandedName_L')] a přilehlém okolí."
 bp2_yearly.1060.a: "[steward_character.GetTitledFirstNameNoTooltip|U] toho zjevně hodně ví."
 bp2_yearly.1060.a.flavor: "Co vlastně dělá z obchodního centra úspěšné místo?"
 bp2_yearly.1060.b: "Měl[Select_CString(ROOT.Char.IsFemale,'a','')] bych si prohlédnout obranu vojenského areálu."
 bp2_yearly.1060.b.flavor: "Dobrá obrana je nejlepší útok. ...Moment."
 bp2_yearly.1060.c: "Víra má přednost. Vyrazím tam, kde stojí [ROOT.Char.GetFaith.HouseOfWorship]."
 bp2_yearly.1060.c.flavor: "Jakými stavbami můžeme projevit svou oddanost? [ROOT.Char.GetFaith.HighGodNameAlternate|U] jistě ocení naše úsilí."
 bp2_yearly.1061.t: "$bp2_yearly.1050.t_builder$: Před západem slunce"
 bp2_yearly.1061.desc_steward: "Celý den procházíme cechovními domy, zkoumáme rozmístění řemeslníků vzhledem k tržištím a seznamujeme se s dalšími hospodářskými stránkami městské výstavby.\n\n[architecture_character.GetTitledFirstName|U] se ukazuje jako skutečně zasvěcený průvodce. Při výkladu o daních a poplatcích mi postupně vykresluje podrobný obraz současného stavu našeho hospodářství."
 bp2_yearly.1061.desc_martial: "Celý den věnujeme prohlídce vojenského vybavení a opevnění [CZProvName(ROOT.Var('the_builder_sightseed_capital').GetProvince,'G')]. Zkoumáme silné stránky obrany, ale také její slabiny.\n\n„Každý řetěz je jen tak silný jako jeho nejslabší článek,“ opakuje [architecture_character.GetTitledFirstName] během prohlídky. Nemohu než souhlasit."
 bp2_yearly.1061.desc_religion: "Jen těžko si dokážu vybavit klidnější a pokojnější den. Společně s [architecture_character.Custom('CZ_TitledFirstName_I')] se procházíme [CZPrepV(ROOT.Var('the_builder_sightseed_capital').GetProvince.GetNameNoTooltip)|l] [CZProvName(ROOT.Var('the_builder_sightseed_capital').GetProvince,'L')], kde nás na každém kroku obklopují [ROOT.Char.GetFaith.HouseOfWorshipPlural|l] a svatyně.\n\nV jednu chvíli se ke mně [architecture_character.GetFirstNameNoTooltip] otočí a poznamená: „Dobře vystavěný oblouk dokáže v člověku probudit zvláštní pocit posvátna, nemyslíš?“"
 bp2_yearly.1061.outro: "\n\nNa závěr prohlídky mi [architecture_character.GetFirstNameNoTooltip] předá značně opotřebovaný svazek s názvem [book_to_get.GetName], který se věnuje právě probíranému tématu."
 bp2_yearly.1061.a: "Dnešek se opravdu vydařil."
 bp2_yearly.1061.a.flavor: "Tolik nových poznatků!"
 bp2_yearly.1065.t: "$bp2_yearly.1050.t_builder$: Obecní prostranství"
 bp2_yearly.1065.intro_parent: "Nastal čas přebudovat obecní prostranství [CZPrepV(ROOT.Var('the_builder_constructed_building_in').GetProvince.GetNameNoTooltip)|l] [CZProvName(ROOT.Var('the_builder_constructed_building_in').GetProvince,'L')]. [Select_CString(current_regent.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('current_regent'))|l] [current_regent.GetTitledFirstName] se mě [Select_CString(current_regent.IsFemale,'zeptala','zeptal')], co si o plánovaných změnách myslím."
 bp2_yearly.1065.intro_regent: "Nastal čas přebudovat obecní prostranství [CZPrepV(ROOT.Var('the_builder_constructed_building_in').GetProvince.GetNameNoTooltip)|l] [CZProvName(ROOT.Var('the_builder_constructed_building_in').GetProvince,'L')]. [Select_CString(current_regent.IsFemale,'Má','Můj')] [ROOT.Char.GetDiarchTitle|l] [current_regent.GetTitledFirstName] se mě [Select_CString(current_regent.IsFemale,'zeptala','zeptal')], co si o plánovaných změnách myslím."
 bp2_yearly.1065.intro: "Nastal čas přebudovat obecní prostranství [CZPrepV(ROOT.Var('the_builder_constructed_building_in').GetProvince.GetNameNoTooltip)|l] [CZProvName(ROOT.Var('the_builder_constructed_building_in').GetProvince,'L')]. Požádali mě, abych se k plánovaným změnám vyjádřil[Select_CString(ROOT.Char.IsFemale,'a','')]."
 bp2_yearly.1065.desc_parent_mayor: "\n\n[province_holder.GetTitledFirstName|U], [Select_CString(province_holder.IsFemale,'vládkyně','vládce')] [CZProvNameNoTooltip(ROOT.Var('the_builder_constructed_building_in').GetProvince,'G')], a [Select_CString(current_regent.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('current_regent'))|l] [current_regent.GetTitledFirstName] celé dopoledne vedou vášnivou diskusi. Nyní však jednání uvázlo na mrtvém bodě."
 bp2_yearly.1065.desc_parent: "\n\n[Select_CString(current_regent.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('current_regent'))|l] [current_regent.GetTitledFirstName] a hlavní stavitel [CZProvNameNoTooltip(ROOT.Var('the_builder_constructed_building_in').GetProvince,'G')] se celé dopoledne vášnivě přou. Nyní však jednání uvázlo na mrtvém bodě."
 bp2_yearly.1065.desc_regent_mayor: "\n\n[province_holder.GetTitledFirstName|U], [Select_CString(province_holder.IsFemale,'vládkyně','vládce')] [CZProvNameNoTooltip(ROOT.Var('the_builder_constructed_building_in').GetProvince,'G')], a [current_regent.GetFirstNameNoTooltip] celé dopoledne vedou vášnivou diskusi. Nyní však jednání uvázlo na mrtvém bodě."
 bp2_yearly.1065.desc_regent: "\n\n[current_regent.GetFirstNameNoTooltip|U] a hlavní stavitel [CZProvNameNoTooltip(ROOT.Var('the_builder_constructed_building_in').GetProvince,'G')] se celé dopoledne vášnivě přou. Nyní však jednání uvázlo na mrtvém bodě."
 bp2_yearly.1065.desc_mayor: "\n\n[province_holder.GetTitledFirstName|U], [Select_CString(province_holder.IsFemale,'vládkyně','vládce')] [CZProvNameNoTooltip(ROOT.Var('the_builder_constructed_building_in').GetProvince,'G')], a [Select_CString(province_holder.IsFemale,'její','jeho')] hlavní stavitel celé dopoledne vedou vášnivou diskusi. Nyní však jednání uvázlo na mrtvém bodě."
 bp2_yearly.1065.desc: "\n\nHlavní stavitel a správce zásob [CZProvNameNoTooltip(ROOT.Var('the_builder_constructed_building_in').GetProvince,'G')] se celé dopoledne přou o to, jaká nová vylepšení by se měla vybudovat. Jednání však dospělo do slepé uličky."
 bp2_yearly.1065.outro: "\n\nJakmile vstoupím do místnosti, všichni obrátí pozornost ke mně. Očividně čekají, že právě já jejich spor rozhodnu."
 bp2_yearly.1065.a: "Měli bychom se zaměřit na obchod a výrobu."
 bp2_yearly.1065.a.flavor: "Vzkvétající hospodářství prospívá všem."
 bp2_yearly.1065.b: "Država potřebuje větší vojenskou sílu."
 bp2_yearly.1065.b.flavor: "Trocha násilí vyřeší každý problém."
 bp2_yearly.1065.c: "Větší náboženské zanícení nám jedině prospěje."
 bp2_yearly.1065.c.flavor: "Víra je všechno, co potřebujeme."
 bp2_yearly.1065.c.tt: "#X Tím se změní [Concept('holding_type','typ državy')|E] a zároveň se odstraní všechny neplatné budovy [CZPrepV(1065_province_for_building.GetNameNoTooltip)|l] [CZProvName(1065_province_for_building,'L')]#!"
 bp2_yearly.1070.t: "$bp2_yearly.1050.t_builder$: Tajemství oblouku"
 bp2_yearly.1070.intro: "Všechna ta léta věnovaná stavitelství – od stavění hradů na hraní v dětství přes budování úkrytů v divočině a studium velkolepé architektury, jíž se pyšní [sightseed_capital.GetName], až po rady ohledně toho, jak se má dále rozvíjet [constructed_building_in.GetName] – mě přivedla právě k tomuto okamžiku."
 bp2_yearly.1070.desc: "\n\nNastal čas zanechat ve světě vlastní stopu založením nové državy [CZPrepV(1070_province_to_build_in.GetNameNoTooltip)|l] [CZProvName(1070_province_to_build_in,'L')]. A právě já musím rozhodnout, jakým směrem se bude ubírat její rozvoj."
 bp2_yearly.1070.desc_no_province: "\n\nDržava [CZPrepV(1070_province_to_buff.GetNameNoTooltip)|l] [CZProvName(1070_province_to_buff,'L')] potřebuje trochu zvelebit. Je na mně, abych využil[Select_CString(ROOT.Char.IsFemale,'a','')] své znalosti a vylepšil[Select_CString(ROOT.Char.IsFemale,'a','')] její současnou podobu."
 bp2_yearly.1070.desc_no_province_no_buff: "\n\nMé državy jsou však v dokonalém stavu a nepotřebují žádné další úpravy ani vylepšení. Přesto mě neustále trápí jedna otázka, která mi nedá spát. V čem vlastně spočívá pravá podstata stavitelství? V hospodářství? Ve víře?"
 bp2_yearly.1070.a: "Nejrozumnější bude založit město."
 bp2_yearly.1070.a_buff: "Úpravy podporující obchod budou prospěšné."
 bp2_yearly.1070.a_none: "Budujme pro prosperitu a lidé sami přijdou."
 bp2_yearly.1070.a.flavor: "Vybudujeme prosperující hospodářské centrum!"
 bp2_yearly.1070.a.flavor_none: "Plný měšec dokáže vyřešit každý problém."
 bp2_yearly.1070.b: "Budoucnost patří dalším hradům."
 bp2_yearly.1070.b_buff: "Dobrá obrana je nejlepší zárukou prosperity."
 bp2_yearly.1070.b_none: "Hradby sjednotí obyvatele."
 bp2_yearly.1070.b.flavor: "S velkolepými hradbami."
 bp2_yearly.1070.b.flavor_none: "...a ochrání nás před zbloudilými střelami."
 bp2_yearly.1070.c: "Rozkvět nám dopřeje [ROOT.Char.GetFaith.HighGodName]."
 bp2_yearly.1070.c.flavor: "Kéž [ROOT.Char.GetFaith.HighGodNameAlternate] přijme tuto državu zasvěcenou své slávě."
 bp2_yearly.1070.c.flavor_none: "Vskutku."
 bp2_yearly.1071.t_city: "[Select_CString(ROOT.Char.IsFemale,'Stavitelka měst','Stavitel měst')]"
 bp2_yearly.1071.t_castle: "[Select_CString(ROOT.Char.IsFemale,'Stavitelka hradů','Stavitel hradů')]"
 bp2_yearly.1071.t_temple: "[Select_CString(ROOT.Char.IsFemale,'Stavitelka chrámů','Stavitel chrámů')]"
 bp2_yearly.1071.desc_city: "Ruch pečlivě naplánovaného tržiště plynule přechází do řemeslnických čtvrtí a odtud do obchodních domů, kde se přijímá a odesílá zboží z dalekých krajů."
 bp2_yearly.1071.desc_castle: "Věže se třpytí v ranním slunci a mohutné hradby drží každého útočníka v bezpečné vzdálenosti."
 bp2_yearly.1071.desc_temple: "Velkolepé svědectví oddanosti. [ROOT.Char.GetFaith.HighGodNameAlternate|U] zde nachází důstojnou poctu. Oblouky vyzařují posvátnou atmosféru a hradby mají stejně pevné základy jako naše víra."
 bp2_yearly.1071.outro: "\n\n[constructed_holding.GetName|U] je skutečně velkolepým stavitelským dílem, které se zapíše do dějin jako počátek kariéry nového stavitelského talentu. Tedy mé kariéry."
 bp2_yearly.1071.a: "To bude stačit."
 bp2_yearly.1071.a.flavor: ""
 bp2_yearly.1072.t: "$bp2_yearly.1050.t_builder$: Stavitel zmařených snů"
