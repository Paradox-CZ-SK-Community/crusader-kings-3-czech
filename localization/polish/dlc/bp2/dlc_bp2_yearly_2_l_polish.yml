l_polish:
 bp2_yearly.2000.t: "V jejich stopách"
 bp2_yearly.2000.desc_dynasty: "„...a tak, [Select_CString(ROOT.Char.IsFemale,'má milá','můj milý')|l] [story_teller.Custom2('CZ_RelationToMeShort_V', ROOT.Char)|l], vznikl slavný rod [ROOT.Char.GetHouse.GetBaseNameNoTooltip]! [Select_CString(root_house_founder.IsFemale,'Tvá','Tvůj')|U] [ROOT.Char.Custom2('RelationToMeShort', root_house_founder)|l], [root_house_founder.GetTitledFirstName], [Select_CString(root_house_founder.IsFemale,'proslula tím, že byla','proslul tím, že byl')|l] [target_trait.GetName(root_house_founder)|l].“\n\n[Select_CString(story_teller.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMeShort', story_teller)|l], [story_teller.GetTitledFirstName], právě dokončuje vyprávění o původu našeho rodu. [story_teller.GetFirstNameNoTooltip|U] mě rád[Select_CString(story_teller.IsFemale,'a','')|l] poučuje o dějinách [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_G')], ale dnes jsme si povídali především o inspirujících činech [Select_CString(root_house_founder.IsFemale,'mé','mého')|l] [ROOT.Char.Custom2('CZ_RelationToMeShort_G', root_house_founder)|l], zakladatele našeho rodu."
 bp2_yearly.2000.desc: "„...a tak, [Select_CString(ROOT.Char.IsFemale,'milá dívko','milý chlapče')|l], vznikl rod [ROOT.Char.GetHouse.GetBaseName]. [root_house_founder.GetTitledFirstName|U] [Select_CString(root_house_founder.IsFemale,'proslula tím, že byla','proslul tím, že byl')|l] [target_trait.GetName(root_house_founder)|l].“\n\n[Select_CString(story_teller.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMeShort', story_teller)|l], [story_teller.GetTitledFirstName], právě dokončuje vyprávění o původu mého rodu. [story_teller.GetFirstNameNoTooltip|U] mě často poučuje o dějinách [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_G')], ale dnes se naše povídání točilo kolem inspirujících příběhů o [Select_CString(root_house_founder.IsFemale,'mé','mém')|l] [ROOT.Char.Custom2('CZ_RelationToMeShort_L', root_house_founder)|l], [root_house_founder.GetFirstNameNoTooltip], zakladateli rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 bp2_yearly.2000.a: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] bych jít v [Select_CString(root_house_founder.IsFemale,'jejích','jeho')|l] stopách..."
 bp2_yearly.2000.a.negative: "Rod [ROOT.Char.GetHouse.GetBaseNameNoTooltip] nedosáhl velikosti bez odvážných rozhodnutí..."
 bp2_yearly.2000.b: "Musím se od svých předků odlišit."
 bp2_yearly.2000.c: "Budu hrdě nosit znak rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip]!"
 bp2_yearly.2000.c.tt: "[GetCourtPositionType('court_artificer_court_position').GetNameNoTooltip|U] [artificer.GetName] dostane za úkol vyrobit šperk se znakem rodu [GetPlayer.GetHouse.GetBaseNameNoTooltip]"
 bp2_yearly.2000.d: "Já si chci jen jít ven hrát!"
 bp2_yearly.2001.desc: "„...a tak, [Select_CString(ROOT.Char.IsFemale,'milá dívko','milý chlapče')|l], končí příběh tvého předka. [Select_CString(ancestor.IsFemale,'Tvá','Tvůj')|U] [ROOT.Char.Custom2('RelationToMe', ancestor)|l], [ancestor.GetTitledFirstName], [Select_CString(ancestor.IsFemale,'proslula tím, že byla','proslul tím, že byl')|l] [target_trait.GetName(ancestor)|l].“\n\n[Select_CString(story_teller.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMe', story_teller)|l], [story_teller.GetTitledFirstName], právě dokončuje vyprávění o legendách mého předka. [story_teller.GetFirstNameNoTooltip|U] mě rád[Select_CString(story_teller.IsFemale,'a','')|l] seznamuje s dějinami našeho rodu, ale dnešní povídání bylo plné úžasných a inspirujících příběhů o vítězstvích mé rodiny."
 bp2_yearly.2001.a: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] bych jít v [Select_CString(ancestor.IsFemale,'jejích','jeho')|l] stopách..."
 bp2_yearly.2002.desc: "[Select_CString(artificer.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMe', artificer)|l], [artificer.GetFirstName], konečně [Select_CString(artificer.IsFemale,'dokončila','dokončil')|l] objednaný artefakt [newly_created_artifact.GetNameNoTooltip]! Nyní mi své dílo představuje:\n\n„[Select_CString(ROOT.Char.IsFemale,'Má paní','Můj pane')|U], zde je výsledek mé práce. [newly_created_artifact.GetDesc|U]“"
 bp2_yearly.2002.a: "Výborná práce, [artificer.Custom('CZ_FirstNameNoTooltip_V')]!"
 house_founder_ring_name: "$artifact_ring$ rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 house_founder_ring_desc: "Elegantní prsten mistrovského zpracování, na němž se výrazně vyjímá erb rodu [ROOT.Char.GetHouse.GetBaseName]. $house_founder_artifact_motto_desc$"
 house_founder_necklace_name: "$artifact_necklace$ rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 house_founder_necklace_desc: "[newly_created_artifact.GetDesc]\n\nUprostřed je vyryt erb rodu [ROOT.Char.GetHouse.GetBaseName]. $house_founder_artifact_motto_desc$"
 house_founder_brooch_name: "$artifact_brooch$ rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 house_founder_brooch_desc: "[newly_created_artifact.GetDesc]\n\nUprostřed je vyryt erb rodu [ROOT.Char.GetHouse.GetBaseName]. $house_founder_artifact_motto_desc$"
 house_founder_artifact_motto_desc: "Na rubu je jemným písmem vyryto „#EMP [ROOT.Char.GetHouse.GetMotto]#!“."
 gained_imaginary_friend: "Získání imaginárního přítele"
 imaginary_friend_significantly_increase_relationship: "Tvé přátelství s [THIS.Var('imaginary_friend_name').Char.Custom('CZ_FirstNameNoTooltip_I')] se #difficulty_easy výrazně zlepší#!"
 imaginary_friend_increase_relationship: "Tvé přátelství s [THIS.Var('imaginary_friend_name').Char.Custom('CZ_FirstNameNoTooltip_I')] se #p zlepší#!"
 imaginary_friend_decrease_relationship: "Tvé přátelství s [THIS.Var('imaginary_friend_name').Char.Custom('CZ_FirstNameNoTooltip_I')] se #n zhorší#!"
 please_imaginary_friend: "[THIS.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip|U] bude [Select_CString(THIS.Var('imaginary_friend_name').Char.IsFemale,'potěšená','potěšený')|l]"
 displease_imaginary_friend: "[THIS.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip|U] bude [Select_CString(THIS.Var('imaginary_friend_name').Char.IsFemale,'nespokojená','nespokojený')|l]"
 bp2_yearly.2010.t: "Záhadný nový přítel"
 bp2_yearly.2010.desc: "Zase sedím [Select_CString(ROOT.Char.IsFemale,'sama','sám')|l] a hraju si se svou oblíbenou hračkou [ROOT.Char.Custom('child_favorite_toy')|l]... Už zase.\n\nŽivot [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')] nabízí spoustu věcí. Ze všeho nejvíc však samotu. "
 bp2_yearly.2010.desc.landed: "Zvlášť když [Select_CString(ruler_parent.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMeShort', ruler_parent)|l] vládne [ruler_parent.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_D')], zatímco já musím plnit všechny své povinnosti vůči [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_D')]."
 bp2_yearly.2010.desc.parents_dead: "Zvlášť když oba moji rodiče už zemřeli."
 bp2_yearly.2010.outro: "\n\nNajednou zaslechnu tiché cupitání. Zvednu hlavu a spatřím neznámé dítě přibližně svého věku. [ROOT.Char.Custom('GetSheHeOpposite')|U] si zvědavě prohlíží mou hračku.\n\n„Nemůžu si vzpomenout, jak se jmenuju...“ zamumlá [ROOT.Char.Custom('GetSheHeOpposite')|l] a v očích se začnou třpytit slzy.\n\n„To vůbec nevadí! Budu ti říkat...“"
 bp2_yearly.2010.a: "[name_option_1.GetFirstNameNoTooltip|U]"
 bp2_yearly.2010.b: "[name_option_2.GetFirstNameNoTooltip|U]"
 bp2_yearly.2010.c: "[name_option_3.GetFirstNameNoTooltip|U]"
 bp2_yearly.2011.t: "Hra představivosti"
 bp2_yearly.2011.desc: "Se [Select_CString(ROOT.Var('imaginary_friend_name').Char.IsFemale,'svou kamarádkou','svým kamarádem')|l] [ROOT.Var('imaginary_friend_name').Char.Custom('CZ_FirstNameNoTooltip_I')] právě hrajeme napínavou partii [ROOT.Char.Custom('BG_GameType_Generic')|l], když k nám přistoupí [participant.GetFirstName], [Select_CString(participant.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMe', participant)|l], s povýšeným úšklebkem na tváři.\n\n„Hraješ [ROOT.Char.Custom('BG_GameType_Generic')|l] úplně [Select_CString(ROOT.Char.IsFemale,'sama','sám')|l]? #EMP Jak ubohé!#! Ale když nemáš žádné přátele, asi ti nic jiného nezbývá...“\n\n[ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip|U] na nás sklesle hledí a vůbec nechápe, co se děje..."
 bp2_yearly.2011.a: "Nemluv o [ROOT.Var('imaginary_friend_name').Char.Custom('CZ_FirstNameNoTooltip_L')] tak, jako by tu [Select_CString(ROOT.Var('imaginary_friend_name').Char.IsFemale,'nebyla','nebyl')|l]!"
 bp2_yearly.2011.b: "Nemáš nic lepšího na práci?"
 bp2_yearly.2011.c: "Jen si procvičuju hru, nic víc..."
 bp2_yearly.2011.bully.toast: "Získán vztah $relation_bully|U$"
 bp2_yearly.2012.t: "Upevnění mé autority"
 bp2_yearly.2012.desc: "[Select_CString(regent_scope.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMe', regent_scope)], [regent_scope.GetFirstName], mi neustále hází klacky pod nohy. Už mě unavují [Select_CString(regent_scope.IsFemale,'její','jeho')] intriky, jejichž cílem je zmocnit se vlády, která právem náleží mně. Bohužel má [regent_scope.GetFirstNameNoTooltip] v hrsti i mnoho mých rádců.\n\n„[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] by ses [regent_scope.Custom('CZ_FirstNameNoTooltip_D')] postavit,“ ozve se náhle vedle mě [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]. „Nebo [Select_CString(regent_scope.IsFemale,'ji','ho')] alespoň nějak veřejně zesměšnit.“"
 bp2_yearly.2012.a: "Je čas předstoupit před dvůr a prokázat své schopnosti."
 bp2_yearly.2012.a.success: "Připomeneš dvoru, komu náleží moc"
 bp2_yearly.2012.a.failure: "[regent_scope.GetFirstNameNoTooltip|U] tě zesměšní"
 bp2_yearly.2012.b: "Poškodím sedlo [regent_scope.Custom('CZ_FirstNameNoTooltip_G')]."
 bp2_yearly.2012.b.success: "Zesměšníš [regent_scope.Custom('CZ_FirstNameNoTooltip_A')]"
 bp2_yearly.2012.b.failure: "[regent_scope.GetFirstNameNoTooltip|U] odhalí sabotáž"
 bp2_yearly.2012.c: "Narušit rovnováhu moci je příliš riskantní."
 bp2_yearly.2013.t: "Opravdu to tak chceš?"
 bp2_yearly.2013.desc: "[ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip|U] mě celý den peskuje kvůli mému chování. Zdá se, že naše hádka konečně dospěla k vrcholu.\n\n„Všiml[Select_CString(ROOT.Var('imaginary_friend_name').Char.IsFemale,'a','')], že se poslední dobou chováš čím dál víc [target_trait.GetNameNoTooltip(ROOT.Char)|l]... Nemyslíš, že by z tebe [ROOT.Char.GetTitleAsNameNoTooltip|l] [Select_CString(ROOT.Char.IsFemale,'byla','byl')] lepší, kdyby ses místo toho [Select_CString(ROOT.Char.IsFemale,'stala','stal')] [opposite_trait.GetNameNoTooltip(ROOT.Char)|l]?“"
 bp2_yearly.2013.a: "Jsem naprosto [Select_CString(ROOT.Char.IsFemale,'spokojená','spokojený')] s tím, že jsem [target_trait.GetNameNoTooltip(ROOT.Char)|l]."
 bp2_yearly.2013.b: "Myslím, že máš částečně pravdu..."
 bp2_yearly.2013.c: "Máš pravdu. Když budu [opposite_trait.GetNameNoTooltip(ROOT.Char)|l], budu si vést lépe."
 bp2_yearly.2014.t: "Tajná náklonnost"
 bp2_yearly.2014.desc: "S [ROOT.Var('imaginary_friend_name').Char.Custom('CZ_FirstNameNoTooltip_I')] se procházím zahradami, když [ROOT.Char.Custom('GetSheHeOpposite')|l] náhle stočí náš rozhovor k lásce a touze.\n\n„Já vím, že se ti tajně líbí [crush.GetFirstName]. [Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bys [Select_CString(crush.IsFemale,'jí','mu')] napsat dopis plný chvály, zahrnout [Select_CString(crush.IsFemale,'ji','ho')] komplimenty a vylíčit všechny [Select_CString(crush.IsFemale,'její','jeho')] přednosti.“\n\n„A jestli máš obzvlášť velkou odvahu, můžeš [Select_CString(crush.IsFemale,'jí','mu')] rovnou prozradit, že si uvědomuješ, jak [crush.Custom('RomanticComplimentAdjective')|l] ve skutečnosti je...“"
 bp2_yearly.2014.a: "[crush.GetFirstNameNoTooltip|U] je tak [crush.Custom('RomanticComplimentAdjective')|l]! Musí se dozvědět, co k [Select_CString(crush.IsFemale,'ní','němu')] cítím!"
 bp2_yearly.2014.a.success: "[crush.GetFirstNameNoTooltip|U] k tobě začne chovat romantické city"
 bp2_yearly.2014.b: "Raději [Select_CString(crush.IsFemale,'ji','ho')] nevyplaším."
 bp2_yearly.2014.c: "Ve skutečnosti mě mnohem víc zajímáš #EMP ty#!..."
 bp2_yearly.2014.d: "To bych nikdy [Select_CString(ROOT.Char.IsFemale,'neudělala','neudělal')]!"
 bp2_yearly.2015.t: "Povzbuzení od přítele"
 bp2_yearly.2015.desc: "„Copak se [Select_CString(bully.IsFemale,'té','toho')] [bully.Custom2('CZ_InsultNoun_G', ROOT.Char)] nikdy nezbavím?!“ běduji se svěšenou hlavou poté, co mě [bully.GetFirstName] opět veřejně [Select_CString(bully.IsFemale,'ponížila','ponížil')].\n\nPo tvářích mi stékají horké slzy, když náhle ucítím jemný dotek na rameni. Je to [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip], můj imaginární přítel. Vždycky je tu pro mě, když potřebuju pomoc.\n\n„Už je nejvyšší čas postavit se [bully.Custom('CZ_FirstNameNoTooltip_D')]! Navrhuju začít šířit drby o tom, co [bully.GetFirstNameNoTooltip] údajně vyvádí ve své komnatě, když je [Select_CString(bully.IsFemale,'sama','sám')] s hračkou, jako je [bully.Custom('child_favorite_toy')|l]...“"
 bp2_yearly.2015.a: "Postavím se [Select_CString(bully.IsFemale,'jí','mu')] a obhájím svou čest."
 bp2_yearly.2015.a.success: "Zbiješ [bully.Custom('CZ_FirstNameNoTooltip_A')]"
 bp2_yearly.2015.a.failure: "[bully.GetFirstNameNoTooltip|U] tě zbije"
 bp2_yearly.2015.b: "Tyhle drby se rozšíří jako požár!"
 bp2_yearly.2015.b.success: "Úspěšně rozšíříš pohoršlivou pomluvu"
 bp2_yearly.2015.b.failure: "Tvá pomluva se neujme"
 bp2_yearly.2015.c: "Následky by mohly být příliš vážné..."
 bp2_yearly.2016.t: "Rozkvétající přátelství"
 bp2_yearly.2016.desc: "Jaká nádherná směsice vůní!\n\nRád[Select_CString(ROOT.Char.IsFemale,'a','')] se procházím zahradami a užívám si jejich uklidňující atmosféru. Jen bych si [Select_CString(ROOT.Char.IsFemale,'přála','přál')], aby tu byl někdo, s kým bych se o všechny ty krásné vjemy [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] podělit. Život [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')] může být osamělý.\n\nSotva mi tato myšlenka proběhne hlavou, vyskočí zpoza květinového záhonu [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]: „Natrháme [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type_plural')|l] a uvijeme si květinové věnečky!“"
 bp2_yearly.2016.a: "Nic bych si nepřál[Select_CString(ROOT.Char.IsFemale,'a','')] víc!"
 bp2_yearly.2016.b: "Dnes nemám na takové pošetilosti náladu."
 bp2_yearly.2017.t: "Ponocování nad knihami"
 bp2_yearly.2017.desc: "S [ROOT.Var('imaginary_friend_name').Char.Custom('CZ_FirstNameNoTooltip_I')] trávíme už téměř celý den zavření mezi knihami. Hodina však pokročila. Příliš dlouho jsem se [Select_CString(ROOT.Char.IsFemale,'oddávala','oddával')] četbě a začínám zanedbávat své ostatní povinnosti.\n\nZavřu knihu a [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] se na mě ostře podívá.\n\n„No tak, [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')],“ zazní prosebný hlas. „Zůstaň tu ještě a čti si se mnou. Máš tak zvídavou mysl! [Select_CString(ROOT.Var('imaginary_friend_name').Char.IsFemale,'Nerada','Nerad')] bych [Select_CString(ROOT.Var('imaginary_friend_name').Char.IsFemale,'viděla','viděl')], aby se promarnila něčím jiným než poznáváním světa.“"
 bp2_yearly.2017.a: "Ještě trocha čtení snad neuškodí..."
 bp2_yearly.2017.a.tt: "Výrazně pokročíš ve svém [Concept('education_focus','zaměření vzdělání')|E] v oblasti [Concept('learning','učenosti')|E]"
 bp2_yearly.2017.b: "Ne, tělo potřebuje cvičení stejně jako mysl."
 bp2_yearly.2017.b.tt: "Výrazně pokročíš ve svém [Concept('education_focus','zaměření vzdělání')|E] v oblasti [Concept('martial','válečnictví')|E]"
 bp2_yearly.2018.t: "Přítel, kterému se mohu svěřit"
 bp2_yearly.2018.desc: "Sedím [Select_CString(ROOT.Char.IsFemale,'sama','sám')] a mnu si spánky, [Select_CString(ROOT.Char.IsFemale,'unavená','unavený')] po dlouhém dni plném povinností.\n\n„Poslední dobou máš pořád nějaké starosti, [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')].“ Vedle mě se objeví [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] a promluví laskavým hlasem.\n\n„Je důležité najít si čas pro sebe nebo někoho, komu se můžeš svěřit, když na tebe tíha povinností [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')] začne příliš doléhat.“\n\n„Vždycky tu budu, abych tě [Select_CString(ROOT.Var('imaginary_friend_name').Char.IsFemale,'vyslechla','vyslechl')], když to budeš potřebovat. Ale vím, že někdy je těžké vyslovit nahlas to, co člověka trápí. Co kdybys zkusil[Select_CString(ROOT.Char.IsFemale,'a','')] své starosti vyjádřit básní?“"
 bp2_yearly.2018.a: "Důvěrný přítel je přesně to, co potřebuji."
 bp2_yearly.2018.b: "Pokusím se své myšlenky proměnit v nějaké dílo..."
 bp2_yearly.2018.c: "Ve skutečnosti potřebuji hlavně pořádný výcvikový plán!"
 bp2_yearly.2019.t: "Výstřednosti"
 bp2_yearly.2019.desc.intro: "Zrovna si povídám se svým imaginárním přítelem [ROOT.Var('imaginary_friend_name').Char.Custom('CZ_FirstNameNoTooltip_I')], když k nám přistoupí [target_councilor.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', target_councilor)|l].\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ osloví mě [target_councilor.GetFirstNameNoTooltip] se zamyšleně svraštělým obočím. „Mohu vás na okamžik vyrušit? [Select_CString(target_councilor.IsFemale,'Ráda bych s vámi probrala','Rád bych s vámi probral')|U] "
 bp2_yearly.2019.desc.chaplain: "stav náboženských držav našeho panství, jejichž součástí je [ROOT.Char.Custom('GetFaithTemple')|l].“"
 bp2_yearly.2019.desc.chaplain_unlanded: "stav rodové svatyně rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip].“"
 bp2_yearly.2019.desc.steward: "naše způsoby výběru daní.“"
 bp2_yearly.2019.desc.steward_unlanded: "hospodaření rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip].“"
 bp2_yearly.2019.desc.marshal: "výcvikové postupy pro nové rekruty.“"
 bp2_yearly.2019.desc.marshal_unlanded: "výcvikové postupy pro nové rekruty.“"
 bp2_yearly.2019.desc.spymaster: "rozmístění našich klíčových spolčenců u cizích dvorů.“"
 bp2_yearly.2019.desc.spymaster_unlanded: "rozmístění našich klíčových spolčenců po celém panství.“"
 bp2_yearly.2019.desc.chancellor: "naše vztahy se sousedními panstvími.“"
 bp2_yearly.2019.desc.chancellor_unlanded: "naše vztahy se sousedními rody.“"
 bp2_yearly.2019.desc.kurultai: "péči o naše stáda.“"
 bp2_yearly.2019.desc.outro: "\n\n„Samozřejmě!“ odpovím. „Pojď, [ROOT.Var('imaginary_friend_name').Char.Custom('CZ_FirstNameNoTooltip_V')]. Rád[Select_CString(ROOT.Char.IsFemale,'a','')|l] bych znal[Select_CString(ROOT.Char.IsFemale,'a','')|l] i tvůj názor na tyto záležitosti.“\n\n„A-ale, [ROOT.Char.Custom('FormOfAddressForLiege')|l],“ zamračí se [target_councilor.GetFirstNameNoTooltip], „vždyť tu kromě nás dvou nikdo není...“"
 bp2_yearly.2019.a: "Ale jistěže je! [ROOT.Char.Custom('GetSheHeOpposite')|U] je [Select_CString(ROOT.Char.IsFemale,'můj nejdůvěryhodnější rádce','má nejdůvěryhodnější rádkyně')|l]!"
 bp2_yearly.2019.a.tt: "Přijmeš své přátelství s [ROOT.Var('imaginary_friend_name').Char.Custom('CZ_FirstNameNoTooltip_I')]"
 bp2_yearly.2019.b: "#EMP Ehm...#! Přeřekl[Select_CString(ROOT.Char.IsFemale,'a','')|l] jsem se. Proberme to mezi čtyřma očima."
 bp2_yearly.2019.b.tt: "Zavrhneš své přátelství s [ROOT.Var('imaginary_friend_name').Char.Custom('CZ_FirstNameNoTooltip_I')]"
 bp2_yearly.2020.t: "Návrat záhadného přítele"
 bp2_yearly.2020.desc: "„[ROOT.Char.GetFirstNameNoTooltip|U]... Jak rád[Select_CString(ROOT.Var('imaginary_friend_name').Char.IsFemale,'a','')|l] tě zase vidím... Už je to tak dávno, co jsme spolu naposledy mluvili.“ Z temné chodby se ozve povědomý hlas.\n\nTrhnu sebou a náhle si uvědomím, komu ten hlas patří... Ale ne... To přece není možné! #EMP [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]?!#! Můj imaginární přítel z dětství?\n\n„Jsem to já, [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')]. Před lety jsme se navzájem potřebovali a teď se potřebujeme znovu.“\n\n„Potřebuji, abys pro mě něco [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')] – vlastně #EMP pro nás oba#!. Musíš zabít [Select_CString(murder_target.IsFemale,'svou','svého')] [ROOT.Char.Custom2('CZ_RelationToMeShort_A', murder_target)], [murder_target.Custom('CZ_FirstName_A')]. Věř mi, přinese to jen samé dobré věci... Uvidíš.“"
 bp2_yearly.2020.a: "Když na tom trváš..."
 bp2_yearly.2020.b: "Ne! To neudělám!"
 imaginary_friend_first_murder_scheme_tt: "Získáš #EMP obrovský#! bonus k [Concept('scheme','intrice')|E] typu [GetScheme('murder').GetTypeName|l], jejímž cílem je [murder_target.GetName]"
 imaginary_friend_future_murder_scheme_tt: "Získáš #EMP obrovský#! bonus k [Concept('scheme','intrice')|E] typu [GetScheme('murder').GetTypeName|l], jejímž cílem je [new_murder_target.GetName]"
 bp2_yearly.2021.t: "Odkládaná vražda"
 bp2_yearly.2021.desc: "„C-c-c, #EMP c-c-c!#!“\n\n„Měli jsme dohodu, [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')]. [Select_CString(ROOT.Char.IsFemale,'Slíbila','Slíbil')|U] jsi, že zabiješ [new_murder_target.Custom('CZ_TitledFirstName_A')], ale zatím jsi pro to vůbec nic [Select_CString(ROOT.Char.IsFemale,'neudělala','neudělal')],“ kárá mě [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] za mou nečinnost.\n\n„Jsem [Select_CString(ROOT.Var('imaginary_friend_name').Char.IsFemale,'zklamaná','zklamaný')|l]...“"
 bp2_yearly.2021.a: "Začnu okamžitě."
 bp2_yearly.2021.b: "Jen potřebuji trochu víc času na přípravu..."
 bp2_yearly.2021.c: "Mezi námi je #EMP konec#!, [ROOT.Var('imaginary_friend_name').Char.Custom('CZ_FirstNameNoTooltip_V')]!"
 bp2_yearly.2022.t: "$bp2_yearly.2020.t$"
 bp2_yearly.2022.desc: "„#EMP Výborně, [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')]! Výborně!#!“\n\n„Vedl[Select_CString(ROOT.Char.IsFemale,'a','')|l] sis skvěle, [Select_CString(ROOT.Char.IsFemale,'má přítelkyně','můj příteli')|l].“ [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip|U] mi blahopřeje k tomu, že se mi podařilo zavraždit [Select_CString(target.IsFemale,'svou','svého')] [ROOT.Char.Custom2('CZ_RelationToMeShort_A', target)], [target.Custom('CZ_FirstName_A')].\n\n„[target.Custom2('InsultAdjective', ROOT.Char)|U] [target.Custom2('InsultNoun', ROOT.Char)|l]! [target.GetFirstNameNoTooltip|U] si [Select_CString(target.IsFemale,'zasloužila','zasloužil')|l] všechno, co [Select_CString(target.IsFemale,'ji','ho')|l] potkalo. Jsme #EMP skvělý#! tým,“ pokračuje [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]. „Cítíš se lépe, že ano? Přesně jak jsem [Select_CString(ROOT.Var('imaginary_friend_name').Char.IsFemale,'slíbila','slíbil')|l]...“\n\n"
 bp2_yearly.2022.desc.next_target: "„Ale nezdržujme se, drahý příteli. Čeká nás ještě spousta zábavy. [new_murder_target.GetFirstName|U] už je #EMP [Select_CString(new_murder_target.IsFemale,'zralá','zralý')|l] na zabití...#!“"
 bp2_yearly.2022.a: "To bylo... #EMP příjemné#!."
 bp2_yearly.2022.b: "Ne! Prosím, prostě zmiz..."
 bp2_yearly.2023.t: "Zmařená vražda"
 bp2_yearly.2023.desc: "„Zdá se, že tvůj plán zavraždit [target.Custom('CZ_TitledFirstName_A')] překazily jisté... #EMP nepředvídané okolnosti#!... Ale na tom nezáleží. Brzy tuhle chybu napravíme.“\n\n"
 bp2_yearly.2023.a: "$bp2_yearly.2020.a$"
 bp2_yearly.2023.b: "Už toho mám dost..."
 bp2_yearly.2024.t: "$bp2_yearly.2023.t$"
 bp2_yearly.2024.desc: "$bp2_yearly.2023.desc$"
 bp2_yearly.2024.a: "$bp2_yearly.2020.a$"
 bp2_yearly.2024.b: "$bp2_yearly.2023.b$"
 bp2_yearly.2025.t: "[Select_CString(ROOT.Char.IsFemale,'Šílená','Šílený')] [ROOT.Char.GetTitleAsNameNoTooltip|l]"
 bp2_yearly.2025.desc: "„To je ono, [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')]! Jsem na tebe tak [Select_CString(ROOT.Var('imaginary_friend_name').Char.IsFemale,'hrdá','hrdý')|l].“ Přede mnou se zjeví [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip].\n\nMohu si jen představovat – a přímo #EMP vychutnávat#! – pronikavý, zoufalý křik, který [target.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMe', target)|l], [Select_CString(target.IsFemale,'vydala','vydal')|l] při svém posledním ubohém nádechu!\n\n„Myslím, že tady má práce skončila,“ pronese [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip].\n\n...ale přes vlastní hysterické chechtání sotva slyším, co říká."
 bp2_yearly.2025.a: "Praahnu po #EMP krvi!#!"
 imaginary_friend_mad_modifier_bribe_discount: "Přizvání [Concept('agents','spolčenců')|E] do [Concept('schemes','intrik')|E] bude stát o 50 % méně"
 bp2_yearly.2030.t: "Posel"
 bp2_yearly.2030.desc: "„#EMP [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')]...#!“\n\nOtočím se a spatřím za sebou [ROOT.Var('imaginary_friend_name').Char.Custom('CZ_FirstNameNoTooltip_A')]. Můj dávný přítel stojí přímo přede mnou a v [Select_CString(ROOT.Var('imaginary_friend_name').Char.IsFemale,'její','jeho')|l] tváři se zračí naprostý klid.\n\n„Musím ti něco říct. Všechna ta léta jsem tě nenápadně provázel[Select_CString(ROOT.Var('imaginary_friend_name').Char.IsFemale,'a','')|l] životem jako tvůj přítel. Nejsem však pouhý přítel. Jsem poslem, kterého ti seslal [ROOT.Char.GetFaith.HighGodName].“\n\n„Mám pro tebe ještě jednu poslední prosbu. Musíš na mou počest zapálit svíci [CZPrepV(target_holy_site.GetNameNoTierNoTooltip)|l] [target_holy_site.Custom('CZ_LandedNameNoTier_L')]. Teprve potom se budu smět vrátit do [ROOT.Char.GetFaith.PositiveAfterLife].“"
 bp2_yearly.2030.a: "Vím, co musím udělat."
 bp2_yearly.2030.a.tt: "Za svou příští [CZActivityNoTooltip('activity_pilgrimage','A')|l] do [target_holy_site.Custom('CZ_LandedNameNoTier_G')] zaplatíš o 50 % méně"
 bp2_yearly.2030.b: "Opravdu? Možná bych měl[Select_CString(ROOT.Char.IsFemale,'a','')|l] svůj postoj přehodnotit..."
 bp2_yearly.2030.c: "Věřím, že [ROOT.Char.GetFaith.HighGodName] vyslyší mé modlitby i odsud."
 imaginary_friend_pilgrimage_discount: "Uctění imaginárního přítele"
 bp2_yearly.2031.t: "Pocta [ROOT.Var('imaginary_friend_name').Char.Custom('CZ_FirstNameNoTooltip_D')]"
 bp2_yearly.2031.desc: "Konečně jsem [Select_CString(ROOT.Char.IsFemale,'dorazila','dorazil')|l] [CZPrepV(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)|l] [CZProvName(ROOT.Char.GetCurrentLocation,'L')]. Nadešel čas vzdát poctu [ROOT.Var('imaginary_friend_name').Char.Custom('CZ_FirstNameNoTooltip_D')]. Můj přítel mě provázel mnoha těžkými chvílemi a byl pro mě skutečným požehnáním. Pochybuji, že bych bez [Select_CString(ROOT.Var('imaginary_friend_name').Char.IsFemale,'ní','něj')|l] dnes [Select_CString(ROOT.Char.IsFemale,'byla ženou, kterou jsem','byl mužem, kterým jsem')|l].\n\nPřestože [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] možná už nebude stát po mém boku, vzpomínka na naše přátelství ve mně zůstane navždy. Když na [Select_CString(ROOT.Var('imaginary_friend_name').Char.IsFemale,'její','jeho')|l] počest zapaluji svíci, ucítím na rameni lehký dotek. Plamínek se zachvěje a vzduchem se nese tichý šepot: „#EMP Sbohem, [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')]...#!“\n\nDěkuji ti, můj příteli."
 bp2_yearly.2031.a: "Odpočívej v pokoji, [Select_CString(ROOT.Var('imaginary_friend_name').Char.IsFemale,'má drahá','můj drahý')|l] [ROOT.Var('imaginary_friend_name').Char.Custom('CZ_FirstNameNoTooltip_V')]."
 imaginary_friend_pilgrimage_log_title: "[CHARACTER.GetName|U] [Select_CString(CHARACTER.IsFemale,'uctila','uctil')|l] svého imaginárního přítele"
 imaginary_friend_pilgrimage_log: "[CHARACTER.GetName|U] [Select_CString(CHARACTER.IsFemale,'uctila','uctil')|l] svého imaginárního přítele v baronii [PROVINCE.GetBaronyNameExplicitly]"
 honored_imaginary_friend_memory: "Uctění imaginárního přítele"
 honored_imaginary_friend_memory_desc: "[Select_CString(ROOT.Char.IsFemale,'Uctila','Uctil')] jsem svého imaginárního přítele [ROOT.Var('imaginary_friend_name').Char.Custom('CZ_FirstNameNoTooltip_A')] [CZPrepV(ROOT.Var('location').GetProvince.GetNameNoTooltip)|l] [CZProvNameNoTooltip(ROOT.Var('location').GetProvince,'L')]"
 honored_imaginary_friend_memory_desc_second_perspective: "[Select_CString(owner.IsFemale,'Uctila','Uctil')] jsi svého imaginárního přítele [ROOT.Var('imaginary_friend_name').Char.Custom('CZ_FirstNameNoTooltip_A')] [CZPrepV(ROOT.Var('location').GetProvince.GetNameNoTooltip)|l] [CZProvNameNoTooltip(ROOT.Var('location').GetProvince,'L')]"
 honored_imaginary_friend_memory_desc_third_perspective: "[owner.GetFirstName|U] [Select_CString(owner.IsFemale,'uctila','uctil')|l] svého imaginárního přítele [ROOT.Var('imaginary_friend_name').Char.Custom('CZ_FirstNameNoTooltip_A')] [CZPrepV(ROOT.Var('location').Province.GetNameNoTooltip)|l] [CZProvNameNoTooltip(ROOT.Var('location').Province,'L')]"
 bp2_yearly.2040.t: "Odchod přítele"
 bp2_yearly.2040.desc: "„[ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')], dnes už jsi [Select_CString(ROOT.Char.IsFemale,'pozoruhodná','pozoruhodný')|l] [ROOT.Char.GetTitleAsNameNoTooltip|l],“ pronese [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] a v očích se začnou třpytit slzy.\n\n„Už mě nepotřebuješ. Je načase, abych [Select_CString(ROOT.Var('imaginary_friend_name').Char.IsFemale,'odešla','odešel')|l] a nechal[Select_CString(ROOT.Var('imaginary_friend_name').Char.IsFemale,'a','')|l] tě žít naplno a užívat si slávy, kterou sis [Select_CString(ROOT.Char.IsFemale,'vydobyla','vydobyl')|l]. Máš kolem sebe tolik lidí, o které se můžeš opřít.“\n\n"
 bp2_yearly.2040.desc.lover: "„[lover.GetFirstNameNoTooltip|U], [Select_CString(lover.IsFemale,'tvá','tvůj')|l] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('lover'))|l], se na tebe dívá s touhou v očích. Možná sis toho nikdy [Select_CString(ROOT.Char.IsFemale,'nevšimla','nevšiml')|l], ale je to tak. [lover.GetFirstNameNoTooltip|U] touží po tvém doteku.“\n\n"
 bp2_yearly.2040.desc.friend: "„[friend.GetFirstNameNoTooltip|U] se [Select_CString(friend.IsFemale,'stala tvou přítelkyní','stal tvým přítelem')|l] před [ROOT.Char.Custom('GetPeriodOfTimeWord')|l]. Možná to tehdy ještě [Select_CString(friend.IsFemale,'netušila','netušil')|l], ale [Select_CString(friend.IsFemale,'její','jeho')|l] oddanost vůči tobě nezná hranic. Na [Select_CString(friend.IsFemale,'její','jeho')|l] podporu se můžeš vždy spolehnout.“"
 bp2_yearly.2040.a: "[lover.GetFirstNameNoTooltip|U] mi bude v tvé nepřítomnosti oporou a zahřeje mě."
 bp2_yearly.2040.b: "O takové oddanosti [friend.Custom('CZ_FirstNameNoTooltip_G')] jsem [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')|l] ani tušení!"
 bp2_yearly.2100.t: "Kladení základů"
 bp2_yearly.2100.desc: "Pod nohama nám křupe sypký štěrk, když jím společně s [interlocutor.Custom('CZ_FirstName_I')] procházíme. Připomíná mi to drsné kamenné zdi budov rozesetých po celém kraji.\n\n„Chci něco postavit!“ vyhrkne náhle [interlocutor.GetFirstNameNoTooltip], jako by mi [Select_CString(interlocutor.IsFemale,'četla','četl')|l] myšlenky. „Měli bychom něco postavit přímo tady! Nějaký model!“ Okamžitě se začne rozhlížet po vhodném materiálu.\n\nZatímco [interlocutor.GetFirstNameNoTooltip] odběhne k nedaleké hromadě dřeva, zamyslím se nad naším plánem. Ale #EMP co#! vlastně postavíme?"
 bp2_yearly.2100.a: "Co třeba [ROOT.Char.Custom('GetDiplomacyBuilding')|l]?"
 bp2_yearly.2100.b: "Co takhle [ROOT.Char.Custom('GetMartialBuilding')|l]? Tam bychom si mohli brousit meče!"
 bp2_yearly.2100.c: "Možná [ROOT.Char.Custom('GetStewardshipBuilding')|l]? To by nás mohlo naučit vážit si peněz!"
 bp2_yearly.2100.d: "Něco pořádně velkého! Třeba [ROOT.Char.Custom('GetIntrigueBuilding')|l]!"
 bp2_yearly.2100.e: "Vlastní středisko vzdělanosti! Třeba [ROOT.Char.Custom('GetLearningBuilding')|l]!"
 bp2_yearly.2100.a.tt: "To podpoří tvé [Concept('diplomacy','diplomatické')|E] [Concept('education_focus','zaměření')|E]"
 bp2_yearly.2100.b.tt: "To podpoří tvé [Concept('martial','válečnické')|E] [Concept('education_focus','zaměření')|E]"
 bp2_yearly.2100.c.tt: "To podpoří tvé [Concept('stewardship','správcovské')|E] [Concept('education_focus','zaměření')|E]"
 bp2_yearly.2100.d.tt: "To podpoří tvé [Concept('intrigue','pletichářské')|E] [Concept('education_focus','zaměření')|E]"
 bp2_yearly.2100.e.tt: "To podpoří tvé [Concept('learning','učenecké')|E] [Concept('education_focus','zaměření')|E]"
 bp2_yearly.2110.t: "[GetTrait('humble').GetNameNoTooltip(ROOT.Char)|U], nebo [GetTrait('arrogant').GetNameNoTooltip(ROOT.Char)|l]?"
 bp2_yearly.2110.desc: "Společně s [Select_CString(interlocutor.IsFemale,'mou','mým')] [ROOT.Char.Custom2('CZ_RelationToMeShort_I', interlocutor)], [interlocutor.Custom('CZ_FirstName_I')], cvičíme na nádvoří bojové umění.\n\n„#EMP Uf!#!“ vyhrkne [interlocutor.GetFirstNameNoTooltip], když [Select_CString(interlocutor.IsFemale,'ji','ho')] srazím k zemi. Vzhlédne ke mně s neskrývaným obdivem. „Se zbraní to opravdu umíš, [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')]. Kéž bych [Select_CString(interlocutor.IsFemale,'měla','měl')] alespoň polovinu tvých schopností.“"
 bp2_yearly.2110.a: "„To se naučíš, [interlocutor.Custom('CZ_FirstNameNoTooltip_V')]. Pojď, zkusíme to znovu!“"
 bp2_yearly.2110.b: "„Je mi souzeno stát se nejlepším válečníkem rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip]!“"
 bp2_yearly.2110.c: "Zůstanu potichu."
 bp2_yearly.2120.t: "[GetTrait('temperate').GetNameNoTooltip(ROOT.Char)|U], nebo [GetTrait('gluttonous').GetNameNoTooltip(ROOT.Char)|l]?"
 bp2_yearly.2120.desc: "#EMP Cink, cink!#!\n\nLžící škrábu po dně mísy, zatímco hltám další porci dušeného masa. Žízeň zaháním pořádnými doušky z poháru, který bude co nevidět potřeba znovu naplnit. Pořád nemám dost!\n\n„[ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')]! Co to vyvádíš? Nemyslíš, že toho poslední dobou... no, #EMP jíš#! trochu moc?“"
 bp2_yearly.2120.a: "„Máš pravdu. Musím svou nenasytnost zkrotit.“"
 bp2_yearly.2120.b: "„Pořádné hostiny přece dělají z člověka [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_A')]!“"
 bp2_yearly.2130.t: "[GetTrait('generous').GetNameNoTooltip(ROOT.Char)|U], nebo [GetTrait('greedy').GetNameNoTooltip(ROOT.Char)|l]?"
 bp2_yearly.2130.desc: "Jen málokdy se mi podaří proklouznout kolem všech služebníků bez povšimnutí a získat pár vzácných chvil jen pro sebe. Konečně mám příležitost cítit se jako ostatní děti.\n\n[ROOT.Char.Custom('child_favorite_toy')|U] je moje nejoblíbenější hračka a pevně ji svírám v náručí, zatímco se procházím ulicemi [CZProvNameNoTooltip(ROOT.Char.GetCurrentLocation,'G')]. Všude kolem panuje čilý ruch. Lidé spěchají za svými záležitostmi a obchodníci hlasitě nabízejí zboží.\n\nV koutě úzké uličky spatřím schoulené selské dítě, které vypadá nemocně a zbědovaně."
 bp2_yearly.2130.a: "„Tady, to je [ROOT.Char.Custom('child_favorite_toy')|l], moje oblíbená hračka. Opatruj ji stejně jako já.“"
 bp2_yearly.2130.a.flavor: "Daruješ dítěti svou hračku"
 bp2_yearly.2130.b: "„Ti, kdo neměli v životě tolik štěstí, si mou štědrost nezaslouží.“"
 bp2_yearly.2140.t: "[GetTrait('honest').GetNameNoTooltip(ROOT.Char)|U], nebo [GetTrait('deceitful').GetNameNoTooltip(ROOT.Char)|l]?"
 bp2_yearly.2140.desc: "Tiše se plížím chodbou s noční pochoutkou v ruce. V kuchyni bývá i v časných ranních hodinách vždycky něco dobrého. A nic nechutná lépe než čerstvě připravená dobrota, jako je [ROOT.Char.Custom('FavoriteTreat')|l].\n\nZa rohem však narazím na [Select_CString(interlocutor.IsFemale,'svou','svého')] [ROOT.Char.Custom2('CZ_RelationToMeShort_A', interlocutor)], [interlocutor.Custom('CZ_FirstName_A')]. Rozespale si protírá oči. „[ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')]! To už jsi #EMP zase#! vyplenil[Select_CString(ROOT.Char.IsFemale,'a','')|l] kuchyni?“\n\nS provinilým výrazem rychle schovám svou pochoutku za záda."
 bp2_yearly.2140.a: "„Ano, [ROOT.Char.Custom2('CZ_RelationToMeShort_V', interlocutor)|l]. Nedokázal[Select_CString(ROOT.Char.IsFemale,'a','')|l] jsem odolat.“"
 bp2_yearly.2140.b: "„Samozřejmě že ne! Jen jsem nemohl[Select_CString(ROOT.Char.IsFemale,'a','')|l] spát.“"
 bp2_yearly.2150.t: "[GetTrait('lifestyle_herbalist').GetNameNoTooltip(ROOT.Char)|U], nebo [GetTrait('lifestyle_gardener').GetNameNoTooltip(ROOT.Char)|l]?"
 bp2_yearly.2150.desc: "Poslední dva týdny mě [interlocutor.GetFirstName], [GetCourtPositionType('court_physician_court_position').GetNameNoTooltip()|l], zasvěcuje do pěstování rostlin a jejich využití v lékařství.\n\nDnes mi [Select_CString(interlocutor.IsFemale,'ukázala','ukázal')|l] své knihy. „[Select_CString(ROOT.Char.IsFemale,'Má','Můj')|U] [interlocutor.Custom2('CZ_RelationToMeShort_V', ROOT.Char)|l], [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')|l] jsi neuvěřitelný pokrok. Nyní však nastal čas rozhodnout se, na co zaměříš své studium.“\n\n„Chceš se věnovat samotnému zahradničení, nebo tě více lákají praktické léčivé účinky rostlin?“"
 bp2_yearly.2150.a: "„Bez znalosti jejich využití jsou byliny k ničemu.“"
 bp2_yearly.2150.b: "„Není nic krásnějšího než pomáhat novému životu růst.“"
 bp2_yearly.2150.c: "„Už nebudu rostlinami ztrácet čas.“"
 bp2_yearly.2160.t: "[GetTrait('compassionate').GetNameNoTooltip(ROOT.Char)|U], nebo [GetTrait('sadistic').GetNameNoTooltip(ROOT.Char)|l]?"
 bp2_yearly.2160.desc: "Procházím [ROOT.Char.Custom('GetCourtyard')|l] a spatřím [interlocutor.Custom('CZ_FirstNameNoTooltip_A')], jak pod dohledem [marshal.Custom('CZ_TitledFirstName_G')] cvičně bojuje s ostatními dětmi. Bohužel se [Select_CString(interlocutor.IsFemale,'jí','mu')|l] příliš nedaří. Náhle [Select_CString(interlocutor.IsFemale,'dostane prudký úder a zavrávorá','dostane prudký úder a zavrávorá')|l] přímo ke mně. Málem mě srazí k zemi.\n\n„Promiň, [Select_CString(ROOT.Char.IsFemale,'má','můj')|l] [interlocutor.Custom2('CZ_RelationToMeShort_V', ROOT.Char)|l],“ omlouvá se [interlocutor.GetFirstNameNoTooltip], když se zvedá na nohy a oprašuje si šaty.\n\nNa [Select_CString(interlocutor.IsFemale,'jejím','jeho')|l] těle se objeví čerstvá rána."
 bp2_yearly.2160.a: "„Neboj se, [interlocutor.Custom('CZ_FirstNameNoTooltip_V')]. Cvičením se zlepšíš.“"
 bp2_yearly.2160.b: "„Trocha další bolesti zajistí, že na tuhle chybu nezapomeneš!“"
 bp2_yearly.2160.b.flavor: "Nabereš hrst hlíny ze země pokrývající [ROOT.Char.Custom('GetCourtyard')|l] a vetřeš ji do rány [interlocutor.Custom('CZ_FirstName_G')]"
