l_polish:
 bp2_yearly.3000.t: "Jakou cenu má den studia?"
 bp2_yearly.3000.desc: "[educator.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi už poněkolikáté monotónním hlasem přednáší o tom, jak se má chovat [Select_CString(ROOT.Char.IsFemale,'pravá dáma','pravý pán')]. Nekonečný výklad je navíc prokládán strohými citáty z posvátného textu [educator.GetFaith.ReligiousText]."
 bp2_yearly.3000.desc_no_educator: "Obracím další stránku a toužebně vyhlížím z okna. [ROOT.Char.Custom('GetCourt')|U] je plný ostatních dětí, které si venku hrají. Ten smích, radostné výskání... Znovu sklouznu pohledem k opisu posvátného textu [ROOT.Char.GetFaith.ReligiousText], který leží na stole."
 bp2_yearly.3000.desc_ending: "\n\nTohle všechno je jistě velmi důležité pro mou budoucnost, ale... Opravdu by si někdo všiml, kdybych se jednou, nebo třeba i dvakrát, [Select_CString(ROOT.Char.IsFemale,'vytratila','vytratil')] ven a [Select_CString(ROOT.Char.IsFemale,'šla','šel')] si hrát?"
 bp2_yearly.3000.a: "Vědění je klíčem k poznání celého světa!"
 bp2_yearly.3000.a.tt: "Je šance, že tvé vzdělání přinese lepší výsledky"
 bp2_yearly.3000.b: "Trocha píle mi neuškodí."
 bp2_yearly.3000.c: "Proč se učit, když si můžu #EMP hrát#!?"
 bp2_yearly.3010.t: "Tohle místo přece zná"
 bp2_yearly.3010.desc: "Srdce se mi sevře, když spatřím [Select_CString(child.IsFemale,'svou milovanou dceru','svého milovaného syna')] [child.Custom('CZ_FirstName_A')], jak opět zmateně bloudí pohledem po okolí a nic nepoznává.\n\nPrávě v těchto komnatách [child.GetFirstNameNoTooltip] kdysi [Select_CString(child.IsFemale,'udělala','udělal')] své první krůčky. Jenže to už je dávno. Dlouhá léta strávená v cizině jako rukojmí musela tyto vzpomínky z mladé mysli vymazat.\n\n[child.GetFirstNameNoTooltip|U] se znovu rozhlédne a povzdechne si."
 bp2_yearly.3010.a: "Musím si s [child.Custom('CZ_FirstName_I')] promluvit."
 bp2_yearly.3010.b: "Časem si zvykne."
 bp2_yearly.3011.t: "[Select_CString(ROOT.Char.IsFemale,'Tudy jsem už chodila','Tudy jsem už chodil')|U]"
 bp2_yearly.3011.desc: "Někde hluboko v mysli #EMP vím#!, že jsem tu už [Select_CString(ROOT.Char.IsFemale,'byla','byl')]. Jenže vzpomínky jsou mlhavější než sny a sny o domově mě už dříve oklamaly. Po tolika letech strávených v cizině jako rukojmí je těžké vůbec rozlišit, co je #EMP domov#! a co #EMP není#!...\n\nStával tady ten krb odjakživa? Byla tahle chodba vždycky tak temná? Vůbec nevím."
 bp2_yearly.3011.desc_parent: "\n\nKdyž se na druhé straně místnosti setká můj pohled s pohledem [Select_CString(parent.IsFemale,'mé matky','mého otce')], spatřím v těch očích odraz vlastního smutku. Pevně se obejmeme."
 bp2_yearly.3011.desc_no_parent: "\n\nKdyž se na druhé straně místnosti setká můj pohled s pohledem [Select_CString(parent.IsFemale,'mé matky','mého otce')], přijde jen povzdech a odvrácený zrak."
 bp2_yearly.3011.a: "Teď už jsem tu cizincem."
 bp2_yearly.3011.b: "Pořád sem patřím!"
 bp2_yearly.3010.a.tt: "[child.GetFirstNameNoTooltip|U] [Select_CString(child.IsFemale,'přijala','přijal')] svou odlišnost"
 bp2_yearly.3010.b.tt: "[child.GetFirstNameNoTooltip|U] [Select_CString(child.IsFemale,'zůstala pevně spjatá','zůstal pevně spjatý')] se svým původem"
