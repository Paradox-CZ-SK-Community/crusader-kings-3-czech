l_polish:
 bp2_yearly.4000.t: "Obavy z minulosti"
 bp2_yearly.4000.desc: "Když v náručí kolébám [Select_CString(first_babby.IsFemale,'svou novorozenou dceru','svého novorozeného syna')], [first_babby.Custom('CZ_Name_A')], opojná radost se ve mně mísí se smutkem a palčivým strachem, z něhož mi běhá mráz po zádech.\n\nChovali mě takhle kdysi v náručí i moji rodiče, než oba zemřeli, když jsem [Select_CString(ROOT.Char.IsFemale,'byla ještě malá','byl ještě malý')], a nechali mě úplně [Select_CString(ROOT.Char.IsFemale,'samotnou','samotného')]?\n\nJe to snad prokletí? Připraví [ROOT.Char.GetFaith.FateGodName] i mé milované dítě o rodiče, stejně jako kdysi připravil osud mě?"
 bp2_yearly.4000.a: "Slibuji ti, že tě nikdy neopustím!"
 bp2_yearly.4000.a.flavor: "Dokážu svůj slib dodržet?"
 bp2_yearly.4000.b: "Svět je kruté místo, mé dítě."
 bp2_yearly.4000.b.flavor: "A životem nakonec každý prochází sám."
 bp2_yearly.4000.c: "Věřím, že [ROOT.Char.GetFaith.HighGodNameAlternate] nade mnou bude bdít."
 bp2_yearly.4001.t: "Opožděná spravedlnost"
 bp2_yearly.4001.desc: "[Select_CString(ROOT.Char.IsFemale,'Byla','Byl')|U] jsem ještě dítě, když [imprisoned_murderer.GetName] [Select_CString(imprisoned_murderer.IsFemale,'nařídila','nařídil')|l] zavraždit [Select_CString(murdered_relative.IsFemale,'mou','mého')|l] [ROOT.Char.Custom2('CZ_RelationToMeShort_A', murdered_relative)], [murdered_relative.Custom('CZ_Name_A')]. Tehdy jsem tomu [Select_CString(ROOT.Char.IsFemale,'nedokázala','nedokázal')|l] zabránit. [Select_CString(ROOT.Char.IsFemale,'Neměla','Neměl')|U] jsem žádnou moc ani možnost zjednat spravedlnost.\n\nDnes je [Select_CString(imprisoned_murderer.IsFemale,'bezmocná','bezmocný')|l] [imprisoned_murderer.GetNameNoTooltip]. [Select_CString(imprisoned_murderer.IsFemale,'Spoutaná','Spoutaný')|U] a [Select_CString(imprisoned_murderer.IsFemale,'vydaná','vydaný')|l] mé vůli. Co by si asi [murdered_relative.GetFirstNameNoTooltip] [Select_CString(murdered_relative.IsFemale,'přála','přál')|l]? Pomstu? Život za život? Nebo projev milosrdenství?"
 bp2_yearly.4001.a: "[murdered_relative.GetFirstNameNoTooltip|U] už nic nepotřebuje, díky tobě, [imprisoned_murderer.Custom2('CZ_InsultNoun_V', ROOT.Char)|l]!"
 bp2_yearly.4001.b: "V odpuštění je síla. Stejně jako ve správném rozhodnutí."
 bp2_yearly.4002.t: "Volání předků"
 bp2_yearly.4002.desc: "Další noc, další pitka. Jak dlouho už vlastně piju? Dny? Týdny? Záleží na tom vůbec? Ve vířící pěně poloprázdného korbele náhle spatřím cosi nevídaného. Hledí na mě ustarané tváře mých dávno zesnulých příbuzných [first_aa_relative.Custom('CZ_FirstNameNoTooltip_G')] a [second_aa_relative.Custom('CZ_FirstNameNoTooltip_G')].\n\nOpileckým oparem proniknou dávno zapomenuté vzpomínky z dětství. Znovu vidím jejich mrtvá, oteklá těla, stále prosycená alkoholem. Tak jsem je tehdy [Select_CString(ROOT.Char.IsFemale,'našla','našel')|l], když se upili k smrti.\n\nČeká mě stejný osud?"
 bp2_yearly.4002.a: "Předkové, dejte mi sílu! Už se alkoholu ani nedotknu!"
 bp2_yearly.4002.b: "Na vaše zdraví, [first_aa_relative.Custom('CZ_FirstNameNoTooltip_V')] a [second_aa_relative.Custom('CZ_FirstNameNoTooltip_V')]!"
 bp2_yearly.4003.t: "Cesta vládce"
 bp2_yearly.4003.desc: "[child_ruler.GetName|U] je nyní ve stejném věku, v jakém jsem se [Select_CString(ROOT.Char.IsFemale,'ujala','ujal')|l] vlády já. Má cesta byla plná útrap. Nést odpovědnost za celé panství v tak útlém věku nebylo snadné, ale právě tyto zkušenosti ze mě udělaly [Select_CString(ROOT.Char.IsFemale,'ženu, kterou jsem dnes','muže, kterým jsem dnes')|l]. Mé dětství se od dětství vrstevníků zásadně lišilo. Místo dětských her jsem [Select_CString(ROOT.Char.IsFemale,'hrála','hrál')|l] hru dospělých. A [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')|l] jsem se ji hrát dobře.\n\nJe tu vhodné území, [giveaway_county.GetDefinitiveName], kde by [child_ruler.GetFirstNameNoTooltip] [Select_CString(child_ruler.IsFemale,'mohla','mohl')|l] začít vládnout stejně jako kdysi já. Ale je na to [Select_CString(child_ruler.IsFemale,'připravená','připravený')|l]? Je má cesta skutečně jediným způsobem, jak se připravit na drsnou budoucnost?"
 bp2_yearly.4003.a: "Půjdeš v mých stopách, [child_ruler.Custom('CZ_FirstNameNoTooltip_V')]."
 bp2_yearly.4003.b: "Chyby minulosti opakovat nebudeme."
 bp2_yearly.4003.c: "Tohle hrabství má větší cenu než [Select_CString(child_ruler.IsFemale,'její','jeho')|l] vzdělání!"
 bp2_yearly.4010.t: "Stín slávy: Soumrak"
 bp2_yearly.4010.desc: "Ať se vydám kamkoli, všude slýchám příběhy o skutcích [Select_CString(famous_parent.IsFemale,'mé matky','mého otce')|l]. [ROOT.Char.Custom('ParentPrestigeLevelText')|U] [famous_parent.GetTitledFirstName] – tak se o [Select_CString(famous_parent.IsFemale,'ní','něm')|l] mluví. Zdá se, že široko daleko není nikdo, kdo by [Select_CString(famous_parent.IsFemale,'její','jeho')|l] jméno neznal.\n\nZůstanu navždy ve stínu [Select_CString(famous_parent.IsFemale,'své matky','svého otce')|l]? Nebo se mi podaří dosáhnout stejné slávy? Jak vysoko se dokážu vyšplhat?"
 bp2_yearly.4010.a: "Pokora? Já a pokora? To sotva!"
 bp2_yearly.4010.b: "Jednoho dne budu jako ty, [famous_parent.Custom('CZ_FirstNameNoTooltip_V')]!"
 bp2_yearly.4010.b.flavor: "Proslavím se a má hvězda zazáří, ať to stojí cokoli."
 bp2_yearly.4010.c: "[Select_CString(ROOT.Char.IsFemale,'Jsem ráda','Jsem rád')|U], že mám tak [Select_CString(famous_parent.IsFemale,'slavnou matku','slavného otce')|l]!"
 bp2_yearly.4010.c.flavor: "A spokojím se s životem v [Select_CString(famous_parent.IsFemale,'jejím','jeho')|l] stínu."
 bp2_yearly.4011.t: "Stín slávy: Úsvit"
 bp2_yearly.4011.desc: "[Select_CString(famous_dead_parent.IsFemale,'Má matka, slavná','Můj otec, slavný')|U] [famous_dead_parent.GetTitledFirstName], [famous_dead_parent.GetDeathReason|l] už před mnoha lety. Přesto plamen [Select_CString(famous_dead_parent.IsFemale,'jejího','jeho')|l] života stále jasně září. Sláva, která [Select_CString(famous_dead_parent.IsFemale,'ji','ho')|l] provázela na každém kroku, nyní jako by následovala mě.\n\nMnozí mě stále považují především za [Select_CString(ROOT.Char.IsFemale,'dceru','syna')|l] [famous_dead_parent.Custom('CZ_TitledFirstName_G')], nikoli za [Select_CString(ROOT.Char.IsFemale,'samostatnou ženu','samostatného muže')|l]! Ještě včera nějaký starý rolník [Select_CString(famous_dead_parent.IsFemale,'ji','ho')|l] velebil, jako by stále [Select_CString(famous_dead_parent.IsFemale,'žila','žil')|l]!\n\nNadešel čas vystoupit z [Select_CString(famous_dead_parent.IsFemale,'jejího','jeho')|l] stínu! Zanechat ve světě vlastní stopu! Dosáhnout toho, aby každý uznával mou velikost a znal mě jako [ROOT.Char.GetTitledFirstName]!"
 bp2_yearly.4011.a: "Svět si [famous_dead_parent.Custom('CZ_FirstNameNoTooltip_A')] zapamatuje jako #EMP [Select_CString(famous_dead_parent.IsFemale,'mou matku','mého otce')|l]#!!"
 bp2_yearly.4011.b: "Bohužel navždy zůstanu jen [Select_CString(ROOT.Char.IsFemale,'dcerou','synem')|l] [famous_dead_parent.Custom('CZ_TitledFirstName_G')]."
 bp2_yearly.4011.c: "Už jsem toho [Select_CString(ROOT.Char.IsFemale,'dokázala','dokázal')|l] dost."
 bp2_yearly.4011.d: "$bp2_yearly.4011.a$"
 bp2_yearly.4012.t: "Stín slávy: Denní světlo"
 bp2_yearly.4012.desc: "Od chvíle, kdy jsem se [Select_CString(ROOT.Char.IsFemale,'rozhodla','rozhodl')|l] vyrovnat slávě svého zesnulého rodiče, uplynula dlouhá doba. Od smrti [Select_CString(famous_dead_parent.IsFemale,'mé matky','mého otce')|l] ještě delší. Vymanit se z [Select_CString(famous_dead_parent.IsFemale,'jejího','jeho')|l] stínu je vyčerpávající a náročné. Stále mám pocit, že mě svět neposuzuje jen podle mých vlastních činů, ale neustále mě srovnává s [famous_dead_parent.Custom('CZ_TitledFirstName_I')].\n\nVím, že se těším úctě, ale stačí to? Co ještě mohu udělat, abych se [Select_CString(ROOT.Char.IsFemale,'zapsala','zapsal')|l] do paměti budoucích generací? Abych [Select_CString(ROOT.Char.IsFemale,'dokázala','dokázal')|l] víc než [Select_CString(famous_dead_parent.IsFemale,'má matka','můj otec')|l]!"
 bp2_yearly.4012.a: "Ještě toho musím mnoho dokázat."
 bp2_yearly.4012.b: "Ach, proč se vůbec namáhat? Navždy budu žít ve stínu [famous_dead_parent.Custom('CZ_FirstNameNoTooltip_G')]."
 bp2_yearly.4012.c: "Teď už jsme si rovni, [Select_CString(famous_dead_parent.IsFemale,'matko','otče')|l]."
 bp2_yearly.4012.d: "Nikdy to nebude dost! Nikdy!"
 bp2_yearly.4013.t: "Stín slávy: Vrchol"
 bp2_yearly.4013.desc_success: "Dnes jsem se poprvé v životě [Select_CString(ROOT.Char.IsFemale,'probudila','probudil')|l] s naprostou jistotou. Má sláva nezná hranic a já už nejsem pouhou [Select_CString(ROOT.Char.IsFemale,'dcerou','synem')|l] [famous_dead_parent.Custom('CZ_TitledFirstName_G')]. Konečně se mohu vyhřívat ve vlastní slávě, [Select_CString(ROOT.Char.IsFemale,'osvobozená','osvobozený')|l] od stínu [Select_CString(famous_dead_parent.IsFemale,'své matky','svého otce')|l].\n\nJe načase přestat se bez ustání hnát za uznáním? Nebo mám hořet a zářit ještě jasněji, dokud mé jméno nebude znát každé dítě, dokonce i za mnoho generací?"
 bp2_yearly.4013.desc_failure: "Dnes jsem se [Select_CString(ROOT.Char.IsFemale,'probudila','probudil')|l] s drtivým poznáním. Navzdory dlouhým letům úsilí mé životní úspěchy stále blednou ve srovnání s činy [Select_CString(famous_dead_parent.IsFemale,'mé velkolepé matky','mého velkolepého otce')|l], [famous_dead_parent.Custom('CZ_TitledFirstName_G')]. [Select_CString(ROOT.Char.IsFemale,'Hnala','Hnal')|U] jsem se až na hranici svých sil, ale stále nedokážu uniknout dlouhému stínu [Select_CString(famous_dead_parent.IsFemale,'její','jeho')|l] slávy.\n\nJe to snad prokletí, které [Select_CString(famous_dead_parent.IsFemale,'každá matka','každý otec')|l] předává svým dětem? Rodíme se snad všichni jen proto, abychom marně soupeřili s velikány minulosti?"
 bp2_yearly.4013.a: "[Select_CString(ROOT.Char.IsFemale,'Zklamala','Zklamal')|U] jsem tě, [famous_dead_parent.Custom('CZ_FirstNameNoTooltip_V')], a [Select_CString(ROOT.Char.IsFemale,'zklamala','zklamal')|l] jsem i sebe."
 bp2_yearly.4013.b: "[ROOT.Char.Custom('PrestigeLevelText')|U] [ROOT.Char.GetFirstNameNoTooltip]. To zní dobře."
 bp2_yearly.4013.c: "Nedopřeji si klid, dokud mé jméno nebude znát celý svět!"
 bp2_yearly.4020.t: "Stín víry: Soumrak"
 bp2_yearly.4020.desc: "Jaké štěstí být [Select_CString(ROOT.Char.IsFemale,'dcerou','synem')] tak příkladného služebníka víry! [ROOT.Char.GetFaith.HighGodName] má v [Select_CString(pious_parent.IsFemale,'mé matce vzornou služebnici','mém otci vzorného služebníka')]. Srdce mi přetéká hrdostí, kdykoli slyším, s jakou úctou lidé vyslovují [Select_CString(pious_parent.IsFemale,'její','jeho')] jméno: [ROOT.Char.Custom('ParentPietyLevelText')] [pious_parent.GetTitledFirstName]! [Select_CString(pious_parent.IsFemale,'Její','Jeho')|U] ctností si váží [ROOT.Char.GetFaith.PriestNeuterPlural|l] i zbožní [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|l].\n\nZůstanu navždy pokorně ve stínu [Select_CString(pious_parent.IsFemale,'své matky','svého otce')]? Nebo dokážu dosáhnout ještě větší zbožnosti? Bude mě [ROOT.Char.GetFaith.HighGodName] zahrnovat stejnou přízní jako [pious_parent.Custom('CZ_TitledFirstName_A')]?"
 bp2_yearly.4020.b: "Jednoho dne budu jako ty, [pious_parent.Custom('CZ_FirstNameNoTooltip_V')]!"
 bp2_yearly.4020.b.flavor: "Budu žít ctnostně a [ROOT.Char.GetFaith.HighGodName] ve mně najde oddanou duši, ať to stojí cokoli."
 bp2_yearly.4020.c: "[Select_CString(ROOT.Char.IsFemale,'Jsem ráda','Jsem rád')|U], že mám tak [Select_CString(pious_parent.IsFemale,'zbožnou matku','zbožného otce')]!"
 bp2_yearly.4020.c.flavor: "A spokojím se s životem v [Select_CString(pious_parent.IsFemale,'jejím','jeho')] stínu."
 bp2_yearly.4021.t: "Stín víry: Úsvit"
 bp2_yearly.4021.desc: "Už uplynula léta od chvíle, kdy [Select_CString(pious_dead_parent.IsFemale,'má slavná matka','můj slavný otec')], [pious_dead_parent.GetTitledFirstName], [pious_dead_parent.GetDeathReason|l]. Doufám, že [ROOT.Char.GetFaith.PositiveAfterLife|U] je nyní [Select_CString(pious_dead_parent.IsFemale,'jejím','jeho')] domovem a [ROOT.Char.GetFaith.HighGodName] stále přijímá [Select_CString(pious_dead_parent.IsFemale,'její','jeho')] služby. Duch [Select_CString(pious_dead_parent.IsFemale,'její','jeho')] víry však nadále přebývá mezi živými, zároveň jako zdroj inspirace i výzva. Zbožní [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|l] mě stále považují především za [Select_CString(ROOT.Char.IsFemale,'dceru','syna')] [pious_dead_parent.Custom('CZ_TitledFirstName_G')]. Ještě včera nějaký starý [ROOT.Char.GetFaith.PriestNeuter|l] velebil [Select_CString(pious_dead_parent.IsFemale,'její','jeho')] činy, jako by stále [Select_CString(pious_dead_parent.IsFemale,'vládla','vládl')]!\n\nZajímalo by mě, zda mě stejně vnímá i [ROOT.Char.GetFaith.HighGodName]. Cítím palčivou potřebu dokázat, že jsem [Select_CString(ROOT.Char.IsFemale,'samostatnou ženou','samostatným mužem')] pevné víry a dokážu vystoupit ze stínu [Select_CString(pious_dead_parent.IsFemale,'své matky','svého otce')]!"
 bp2_yearly.4021.a: "[ROOT.Char.GetFaith.HighGodName|U] ve mně pozná svébytnou osobnost!"
 bp2_yearly.4021.b: "Bohužel zůstanu v [Select_CString(pious_dead_parent.IsFemale,'jejím','jeho')] stínu, abych [Select_CString(ROOT.Char.IsFemale,'uctila','uctil')] památku [pious_dead_parent.Custom('CZ_FirstNameNoTooltip_G')]. [ROOT.Char.GetFaith.HighGodName] snad mou oddanost ocení."
 bp2_yearly.4021.c: "Už jsem toho [Select_CString(ROOT.Char.IsFemale,'dokázala','dokázal')] dost."
 bp2_yearly.4021.d: "Kéž [ROOT.Char.GetFaith.HighGodName] pamatuje na [pious_dead_parent.Custom('CZ_FirstNameNoTooltip_A')] především jako na #EMP [Select_CString(pious_dead_parent.IsFemale,'mou matku','mého otce')]#!!"
 bp2_yearly.4022.t: "Stín víry: Denní světlo"
 bp2_yearly.4022.desc: "Světlo, jímž mě vede [ROOT.Char.GetFaith.HighGodName], mi ukazuje cestu na mé posvátné pouti. Stejně kdysi vedlo i [Select_CString(pious_dead_parent.IsFemale,'mou matku','mého otce')], [pious_dead_parent.Custom('CZ_TitledFirstName_A')]. Život zasvěcený víře není snadný, přesto cítím nutkání stát se ještě významnější osobností, než [Select_CString(pious_dead_parent.IsFemale,'jakou byla má matka','jakou byl můj otec')].\n\nJe snad povinností každého [CZAdherent_G(ROOT.Char.GetFaith)|l] neúnavně usilovat o uznání svých současníků i o přízeň, kterou uděluje [ROOT.Char.GetFaith.HighGodName]? Je příklad [Select_CString(pious_dead_parent.IsFemale,'mé matky','mého otce')] světlem, které mám následovat, nebo cílem, jehož musím dosáhnout a překonat?"
 bp2_yearly.4022.a: "Ještě toho musím mnoho dokázat."
 bp2_yearly.4022.b: "Ach, proč se vůbec namáhat? Snad mi [ROOT.Char.GetFaith.HighGodName] odpustí."
 bp2_yearly.4022.c: "Teď už jsme si rovni, [Select_CString(pious_dead_parent.IsFemale,'matko','otče')]."
 bp2_yearly.4022.d: "Nikdy to nebude dost! Nikdy!"
 bp2_yearly.4023.t: "Stín víry: Vrchol"
 bp2_yearly.4023.desc_success: "Kéž [ROOT.Char.GetFaith.FateGodName] přijme mou chválu! Dnes jsem se poprvé v životě [Select_CString(ROOT.Char.IsFemale,'probudila','probudil')] s naprostou jistotou. [Select_CString(ROOT.Char.IsFemale,'Dokázala','Dokázal')|U] jsem, že mohu být vzorem pro [CZAdherentPl_A(ROOT.Char.GetFaith)|l], nikoli jen [Select_CString(ROOT.Char.IsFemale,'dcerou','synem')] [pious_dead_parent.Custom('CZ_TitledFirstName_G')]. Konečně se mohu vyhřívat ve světle, které mi dopřává [ROOT.Char.GetFaith.HighGodName]. Už nežiji ve stínu [Select_CString(pious_dead_parent.IsFemale,'své matky','svého otce')].\n\nJe načase věnovat se více světským záležitostem s jistotou, že [ROOT.Char.GetFaith.HighGodName] mi zachová svou přízeň? Nebo je povinností každého [CZAdherent_G(ROOT.Char.GetFaith)|l] nikdy nepolevit v posvátném úsilí, dokud [ROOT.Char.GetFaith.HighGodName] neuzná jeho oddanost?"
 bp2_yearly.4023.desc_failure: "Dnes jsem se [Select_CString(ROOT.Char.IsFemale,'probudila','probudil')] s drtivým poznáním. Celé roky jsem [Select_CString(ROOT.Char.IsFemale,'usilovala','usiloval')|l] o co největší zbožnost, ale světlo, které nabízí [ROOT.Char.GetFaith.HighGodName], je pro mě stále zastřené vzpomínkou na [Select_CString(pious_dead_parent.IsFemale,'mou slavnou matku','mého slavného otce')], [pious_dead_parent.Custom('CZ_TitledFirstName_A')]. Stojí snad za tím vším [ROOT.Char.GetFaith.FateGodName]?\n\nJe to prokletí, které rodiče předávají svým dětem? Rodíme se snad všichni jen proto, abychom marně soupeřili s velikány minulosti? Je snad tohle svět, jaký si přeje [ROOT.Char.GetFaith.CreatorName]?"
 bp2_yearly.4023.a: "[Select_CString(ROOT.Char.IsFemale,'Zklamala','Zklamal')|U] jsem tě! Kéž mi [ROOT.Char.GetFaith.HighGodName] odpustí."
 bp2_yearly.4023.b: "[ROOT.Char.Custom('PietyLevelText')|U] [ROOT.Char.GetFirstNameNoTooltip]. To zní dobře."
 bp2_yearly.4023.c: "[ROOT.Char.GetFaith.PositiveAfterLife|U] i celý svět budou navždy znát mé jméno!"
 bp2_yearly.4030.t: "Za zasněženého večera"
 bp2_yearly.4030.desc: "„M-my už pochodujeme touhle zmrzlou zemí tak dlouho, že snad jen [frosty_knight.GetFaith.CreatorName] ví, kolik času uplynulo! A všichni ti lidé [CZPrepV(ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip)|l] [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')] si zatím nic nedělají a spí si v teplých postelích!“ stěžuje si můj $knight_culture_player_no_tooltip$ [frosty_knight.GetFirstName] a třese se zimou. Jak dlouho už vlastně pochodujeme? Dny jsou krátké a temné a slunce na obloze nám neposkytuje žádnou úlevu.\n\nZavřu oči. Slunce! Náhle si vybavím první sluneční paprsky po dlouhé zimě, která jako by trvala celé mé dětství. Vzpomínka se mi rozlévá žilami jako horká voda a přináší útěchu i pocit bezpečí. Tehdy se nakonec vrátilo slunce a přišlo jaro.\n\nA vrátí se i teď!"
 bp2_yearly.4030.a: "A se sluncem přijde i vítězství!"
 bp2_yearly.4030.b: "„A co by sis tedy [Select_CString(frosty_knight.IsFemale,'přála','přál')], [frosty_knight.Custom('CZ_FirstNameNoTooltip_V')]? Jsi přece můj $knight_culture_player_no_tooltip$!“"
 bp2_yearly.4030.b.flavor: "Slyšte mě, válečníci [CZPrepZ(ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip)|l] [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')]! Jakkoli dlouhá je noc, slunce nakonec vyjde! A s ním přijde vítězství! Vrátíme se s věčnou slávou a jistotou, že nás žádné útrapy nedokážou zastavit!"
 bp2_yearly.4030.c: "Další krutá zima? Alespoň se připravíme na tu příští!"
 bp2_yearly.4030.c.tt: "Otužování v kruté zimě"
 bp2_yearly.4031.t: "Bludný kruh zajetí"
 bp2_yearly.4031.desc_first: "Už podruhé v životě mě někdo připravil o svobodu a uvrhl do okovů. V dětství jsem [Select_CString(ROOT.Char.IsFemale,'padla','padl')] do rukou [old_imp.Custom2('CZ_InsultAdjective_G', ROOT.Char)] [old_imp.Custom('CZ_TitledFirstName_G')].\n\n"
 bp2_yearly.4031.desc_base: "Nyní mě v zajetí drží [new_imp.GetTitledFirstName], [Select_CString(new_imp.IsFemale,'ta','ten')] [new_imp.Custom2('InsultAdjective', ROOT.Char)|l] ničema.\n\nPřivedl mě sem znovu osud? Jsou snad i řetězy stejné? Byla má svoboda jen krátkou přestávkou mezi dvěma obdobími zajetí? "
 bp2_yearly.4031.desc_same_captor: "A teď mě [old_imp.GetTitledFirstName] drží v zajetí znovu!\n\n[Select_CString(old_imp.IsFemale,'Ta stará','Ten starý')|U] [old_imp.Custom2('InsultNoun', ROOT.Char)|l] [Select_CString(old_imp.IsFemale,'měla','měl')|l] dokonce tu drzost prokázat mi #EMP laskavost#! a přidělit mi stejnou celu! Přivedla mě sem jen [Select_CString(old_imp.IsFemale,'její','jeho')] zlomyslnost? Nebo je mi snad souzeno, aby má svoboda byla jen krátkou přestávkou mezi dvěma obdobími zajetí?\n\n"
 bp2_yearly.4031.desc_last: "Budu navždy [Select_CString(ROOT.Char.IsFemale,'vydána','vydán')|l] napospas rozmarům jiných?\n\nNe! Už jako dítě jsem zajetí [Select_CString(ROOT.Char.IsFemale,'přežila','přežil')] a znovu [Select_CString(ROOT.Char.IsFemale,'získala','získal')|l] svobodu. Co mi brání dokázat to znovu?"
 bp2_yearly.4031.a: "Už nikdy! Znovu budu na svobodě!"
 bp2_yearly.4031.a.flavor: "Zpřetrhej ty zatracené řetězy!"
 bp2_yearly.4031.a.ct: "Pokusy o útěk mají vyšší šanci na úspěch, ale jejich selhání je nebezpečnější..."
 bp2_yearly.4031.b: "Trpělivost, [ROOT.Char.GetFirstNameNoTooltip]. Tenkrát jsem to [Select_CString(ROOT.Char.IsFemale,'vydržela','vydržel')]."
 bp2_yearly.4031.b.flavor: "A vydržím to i tentokrát."
 bp2_yearly.4032.t: "Rukojmí minulosti a současnosti"
 bp2_yearly.4032.desc: "Nadešel čas, aby [hostage_kiddo.GetFirstName] [Select_CString(hostage_kiddo.IsFemale,'odešla','odešel')]. Zahledím se [Select_CString(hostage_kiddo.IsFemale,'jí','mu')] do očí a spatřím v nich vlastní dětství. Tehdy mě poslali jako rukojmí k [new_papa.Custom('CZ_TitledFirstName_D')]. [tru_papa.GetTitledFirstName|U] se na mě [Select_CString(tru_papa.IsFemale,'dívala','díval')|l] stejně jako já dnes. Už si nepamatuji slova, která tehdy zazněla. Na co asi [tru_papa.GetTitledFirstName] [Select_CString(tru_papa.IsFemale,'myslela','myslel')|l], když jsem [Select_CString(ROOT.Char.IsFemale,'odcházela','odcházel')|l]?\n\nBude jednou i [hostage_kiddo.GetFirstNameNoTooltip] posílat své děti do cizích dvorů jako rukojmí? Co mohu [Select_CString(hostage_kiddo.IsFemale,'jí','mu')] v této poslední chvíli dát?"
 bp2_yearly.4032.a: "„[ROOT.Char.GetHouse.GetMotto|U], [Select_CString(hostage_kiddo.IsFemale,'má dcero','můj synu')].“"
 bp2_yearly.4032.a.flavor: "Pamatuj si tato slova. Každý příslušník dynastie [ROOT.Char.GetDynasty.GetNameNoTooltip] musí jednoho dne splnit svou povinnost. Tvůj čas nadešel právě dnes."
 bp2_yearly.4032.b: "Jednoho dne se vrátíš domů, stejně jako já."
