l_polish:
 bp2_yearly.5000.t: "Nepohodlná překážka"
 bp2_yearly.5000.desc: "Jako [Select_CString(ROOT.Char.IsFemale,'regentka','regent')] mám téměř neomezenou moc, ale stále se nedokážu zbavit pocitu, že mé postavení stojí na vratkých základech. Jsem [Select_CString(ROOT.Char.IsFemale,'uzurpátorka','uzurpátor')] a lidé jako já musí občas sáhnout k drastickým opatřením.\n\nV cestě mi stojí jeden obzvlášť nepříjemný trn, který by se při troše opatrnosti dal odstranit. [tower_prince.GetFirstName|U] je ještě [Select_CString(tower_prince.IsFemale,'mladá','mladý')], ale stále zůstává [Select_CString(tower_prince.IsFemale,'právoplatnou','právoplatným')] [tower_prince.Custom('CZ_TitleAsNameNoTooltip_I')]. Ať už své sevření nad tímto panstvím utahuji sebevíc, s dospíváním tohoto dítěte budou přibývat lidé, kteří začnou zpochybňovat mé postavení.\n\nCo kdybych tedy dítě [Select_CString(ROOT.Char.IsFemale,'dostala','dostal')] pod svou kontrolu? Stačilo by podmáznout správné lidi..."
 bp2_yearly.5000.a: "Musím to udělat."
 bp2_yearly.5000.a.flavor: "#WEAK Mocná věž se stane vězením [Select_CString(tower_prince.IsFemale,'nešťastné princezny','nešťastného prince')]!#!"
 bp2_yearly.5000.a.success: "Tvůj plán uspěje"
 bp2_yearly.5000.a.failure: "Tvůj plán selže"
 bp2_yearly.5000.a.tt: "Všichni vazalové [tower_prince.Custom('CZ_FirstName_G')] vůči tobě ztratí #negative_value 15#! bodů mínění"
 bp2_yearly.5000.b: "Nejsem žádná zrůda."
 bp2_yearly.5001.t: "[tower_prince.Custom('GetPrincessPrince')|U] ve věži"
 bp2_yearly.5001.desc: "Můj plán uspěl a [tower_prince.GetFirstName] je nyní [Select_CString(tower_prince.IsFemale,'nenápadně uvězněna','nenápadně uvězněn')]. Mou autoritu už téměř nikdo nezpochybňuje. Přesto ke mně stále doléhá šeptání od dvora. Lidé se ptají, modlí se a dožadují se odpovědi: #EMP Kde je [Select_CString(tower_prince.IsFemale,'mladá','mladý')] [tower_prince.GetTitleAsNameNoTooltip]?#!\n\nMohlo by být rozumné ponechat dítě naživu a využít je k upevnění svého postavení. Jeho návrat by však zároveň mohl dodat odvahu těm, kteří mě chtějí svrhnout.\n\nExistuje ale ještě třetí možnost. Lidé mají krátkou paměť. Jak rychle by na celou záležitost zapomněli, kdyby se dítě náhle ocitlo v poněkud... nezáviděníhodném stavu?"
 bp2_yearly.5001.a: "Sbohem, milý rušiteli mého sladkého spánku..."
 bp2_yearly.5001.a.flavor: "[Select_CString(tower_prince.IsFemale,'Mladá princezna','Mladý princ')|U] ještě jednou spatří denní světlo, ale docela jinýma očima..."
 bp2_yearly.5001.b: "Možná teď dokážu přimět ostatní k poslušnosti..."
 bp2_yearly.5001.b.tt: "Všichni [Concept('vassals','vazalové')|E] [tower_prince.Custom('CZ_FirstName_G')] získají vůči tobě #P 25#! bodů mínění"
 bp2_yearly.5001.b.flavor: "Stačí rozdat pořádný obnos mincí na správných místech a základy převratu budou položeny!"
 bp2_yearly.5001.b.bypass: "#WEAK Umožní ti to obejít veškeré požadavky na délku [Concept('regency','regentství')|E] pro [Concept('decision','rozhodnutí')|E] Pokusit se svrhnout lenního pána#!"
 bp2_yearly.5001.c: "Dítě mohu propustit, pokud podpoří mé postavení."
 bp2_yearly.5005.t: "[foreign_hostage.Custom('GetPrettyAdjective')|U] [Select_CString(foreign_hostage.IsFemale,'cizinka','cizinec')]"
 bp2_yearly.5005.desc: "Čím častěji vídám [foreign_hostage.Custom('CZ_FirstName_A')], tím více mě přitahuje [Select_CString(foreign_hostage.IsFemale,'její','jeho')|l] přítomnost. Honíme se po zahradě a [foreign_hostage.GetFirstNameNoTooltip] se náhle otočí, zaujme pevný postoj a pokusí se kolem mě proklouznout. Sluneční paprsky pronikající listím přitom rozehrávají na té tváři tanec světla a stínu.\n\nSrdce mi buší nejen kvůli běhání. Zpomalím a zastavím se. Co se to se mnou děje?\n\n„[ROOT.Char.GetFirstNameNoTooltip|U]? Co se stalo?“ [foreign_hostage.GetFirstNameNoTooltip|U] se na okamžik zastaví. V hlase zaznívá lehké znepokojení nad mým podivným chováním.\n\nJsem #EMP tak#! nervózní..."
 bp2_yearly.5005.a: "Já..."
 bp2_yearly.5005.a.tt: "Možná jsou tvé city opětované?"
 bp2_yearly.5005.b: "To... nic není."
 bp2_yearly.5006.t: "Sladké vyznání"
 bp2_yearly.5006.desc: "Zrovna se s [crusher.Custom('CZ_FirstName_I')] honíme a hrajeme si na zahradě, když si všimnu, že se můj protějšek zastavil. Otočím se, ale [crusher.GetFirstNameNoTooltip] se vyhýbá mému pohledu a upřeně hledí do země.\n\n„Já... já...“ vykoktá ze sebe po několika vteřinách [crusher.GetFirstNameNoTooltip]. Pak těžce polkne, zvedne hlavu a zadívá se na místo těsně nad mou hlavou.\n\n„Já tě mám vážně... [Select_CString(crusher.IsFemale,'ráda','rád')]!“ vypraví ze sebe nakonec a nervozitou se téměř třese."
 bp2_yearly.5006.a: "Já tebe taky!"
 bp2_yearly.5006.b: "To je divné. Chováš se divně."
 bp2_yearly.5007.t: "Mladá láska"
 bp2_yearly.5007.desc: "K mé nesmírné úlevě se tvář [foreign_hostage.Custom('CZ_FirstName_G')] rozzáří. Objeví se široký úsměv a nesmělé, ale nadšené přikývnutí. Ani jeden z nás nedokáže najít ta správná slova.\n\nMísto toho ke mně [foreign_hostage.GetFirstNameNoTooltip] natáhne ruku a jemně uchopí tu mou. Pak se znovu usměje.\n\nRuku v ruce se vydáme na procházku zahradní kolonádou, zcela nevšímaví ke všemu kolem nás. V duchu si přeji, aby tenhle okamžik nikdy neskončil."
 bp2_yearly.5007.a: "Mám pro tebe dárek."
 bp2_yearly.5007.b: "Vyšlo to! Nikdy mi nebylo tak nádherně!"
 bp2_yearly.5008.t: "Dýka do srdce"
 bp2_yearly.5008.desc: "K mému zděšení se tvář [foreign_hostage.Custom('CZ_FirstName_G')] stáhne do rozpačité grimasy.\n\n„Co tím myslíš? Proč se chováš tak divně?“ zazní pohrdavá otázka.\n\nMé srdce se roztříští na tisíc střepů, které jako by se rozsypaly po štěrku zahradní cestičky. Skryji tvář, aby [foreign_hostage.GetFirstNameNoTooltip] [Select_CString(foreign_hostage.IsFemale,'neviděla','neviděl')] mé slzy.\n\n„To nic. Musím jít.“"
 bp2_yearly.5008.a: "Možná... možná si to [foreign_hostage.GetFirstNameNoTooltip] časem rozmyslí?"
 bp2_yearly.5008.b: "Jak můžeš být tak #EMP krutá#!!"
 bp2_yearly.5009.t: "Plány do budoucna"
 bp2_yearly.5009.desc: "Slunce příjemně hřeje, zatímco se s [marry_crush.Custom('CZ_FirstName_I')] procházíme zahradou. Najednou se ke mně [marry_crush.GetFirstNameNoTooltip] otočí.\n\n„Až vyrosteme, vezmeme se?“ zazní upřímná otázka. Můj nechápavý výraz si okamžitě vyžádá vysvětlení. „Až budeme [Select_CString(And(ROOT.Char.IsFemale,marry_crush.IsFemale),'obě dospělé','oba dospělí')|l], určitě bychom se [Select_CString(And(ROOT.Char.IsFemale,marry_crush.IsFemale),'měly','měli')|l] vzít. Je to náš osud!“\n\nTiše o té možnosti přemýšlím. Mé city jsou tak silné! Copak si vůbec dokážu představit budoucnost bez [marry_crush.Custom('CZ_FirstName_G')]?"
 bp2_yearly.5009.a: "Samozřejmě že se vezmeme!"
 bp2_yearly.5009.b: "Ještě se toho může hodně změnit..."
 bp2_yearly.5010.t: "Ozvěny minulosti"
 bp2_yearly.5010.desc: "„Je to jako za starých časů, viď?“\n\nZ rozjímání mě vytrhne hlas [marry_crush.Custom('CZ_FirstName_G')]. [marry_crush.GetFirstNameNoTooltip|U] se posadí vedle mě a široce se usměje. Už jen společný pobyt v této zahradě ve mně probouzí vzpomínky na dobu, kdy jsme [Select_CString(And(ROOT.Char.IsFemale,marry_crush.IsFemale),'byly obě mladé a až trapně zamilované jedna do druhé','byli oba mladí a až trapně zamilovaní jeden do druhého')|l].\n\n„Vzpomínáš si na tu dobu? Dokonce jsme si slíbili, že pokud budeme v dospělosti [Select_CString(And(ROOT.Char.IsFemale,marry_crush.IsFemale),'obě svobodné','oba svobodní')|l], vezmeme se!“ [marry_crush.GetFirstNameNoTooltip|U] se té vzpomínce hlasitě zasměje. [Select_CString(And(ROOT.Char.IsFemale,marry_crush.IsFemale),'Byly jsme tehdy obě tak naivní','Byli jsme tehdy oba tak naivní')|U].\n\nA přece..."
 bp2_yearly.5010.a: "No... co kdybychom ten slib splnili?"
 bp2_yearly.5010.a.flavor: "Z uhlíků naší dětské lásky dosud tu a tam vyšlehne plamínek..."
 bp2_yearly.5010.a.tt: "Požádáš [marry_crush.Custom('CZ_FirstNameNoTooltip_A')] o ruku"
 bp2_yearly.5010.b: "Byly to krásné časy, viď?"
 bp2_yearly.5011.t: "Slušná nabídka"
 bp2_yearly.5011.desc: "„Pamatuješ si,“ začne [root_crush.GetFirstName] a při rozhovoru v zahradě se ke mně otočí, „jak jsme si v dětství slíbili, že se vezmeme, pokud budeme v dospělosti [Select_CString(And(ROOT.Char.IsFemale,root_crush.IsFemale),'obě svobodné','oba svobodní')|l]?“\n\nTa otázka mě zaskočí a já zapátrám v paměti. Samozřejmě, že si #EMP vzpomínám#!. V zahradě velmi podobné téhle jsme si tehdy dávali ty naivní sliby plné naděje. [Select_CString(And(ROOT.Char.IsFemale,root_crush.IsFemale),'Byly jsme tak mladé a plné vášně','Byli jsme tak mladí a plní vášně')|U]. Při té vzpomínce se mimoděk usměji.\n\n„Já jsem na to [Select_CString(root_crush.IsFemale,'nezapomněla','nezapomněl')].“ [root_crush.GetFirstNameNoTooltip|U] mluví mnohem vážněji, než jsem [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')]. Vezme mě za ruku a pokračuje: „[Select_CString(root_crush.IsFemale,'Myslela','Myslel')|U] jsem to vážně. [Select_CString(And(ROOT.Char.IsFemale,root_crush.IsFemale),'Ani jedna z nás','Ani jeden z nás')|U] není v manželství. Pamatuji si, jak jsme [Select_CString(And(ROOT.Char.IsFemale,root_crush.IsFemale),'byly šťastné','byli šťastní')|l].“"
 bp2_yearly.5011.a: "...Ano. Ano, vezmeme se."
 bp2_yearly.5011.b: "To jsou dětinské nesmysly! Vzpamatuj se."
 bp2_yearly.5012.t: "Znovu zažehnutá láska"
 bp2_yearly.5012.desc: "Ve tváři [marry_crush.Custom('CZ_FirstName_G')] se několik okamžiků nedá nic vyčíst, ale pak ji rozzáří radostné překvapení.\n\n„Samozřejmě! Samozřejmě, že ano!“ [marry_crush.GetFirstNameNoTooltip|U] se mi vrhne do náruče. Na okamžik je to, jako bychom [Select_CString(And(ROOT.Char.IsFemale,marry_crush.IsFemale),'byly','byli')|l] znovu dětmi a [Select_CString(And(ROOT.Char.IsFemale,marry_crush.IsFemale),'snažily','snažili')|l] se vyznat ve svých opojných a zmatených citech.\n\nVezmu [marry_crush.Custom('CZ_FirstName_A')] za ruku a společně zamíříme k východu ze zahrady. Koneckonců máme před sebou spoustu zařizování."
 bp2_yearly.5012.a: "Navždy a napořád!"
 bp2_yearly.5012.b: "...Možná bych si to [Select_CString(ROOT.Char.IsFemale,'měla','měl')] ještě rozmyslet."
 bp2_yearly.5013.t: "Uhaslá jiskra"
 bp2_yearly.5013.desc: "Ve tváři [marry_crush.Custom('CZ_FirstName_G')] se několik okamžiků nedá nic vyčíst, ale pak se v ní objeví zmatení.\n\n„Co tím myslíš? To myslíš vážně?“ [marry_crush.GetFirstNameNoTooltip|U] svraští obočí. „Proč vytahuješ nějaké dávné dětské sliby?“\n\nPokouším se najít správná slova, ale [marry_crush.GetFirstNameNoTooltip] už odchází a odmítavě kroutí hlavou."
 bp2_yearly.5013.a: "Ach..."
 bp2_yearly.5050.t: "Znalec jazyků"
 bp2_yearly.5050.desc: "Když se procházím po nádvoří, vítr mi přivane k nohám útržek pergamenu. Zachytím jej, ale podivné znaky, které jsou na něm napsané, se nepodobají ničemu, co jsem kdy [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')].\n\n„Á! Tak tady je můj lístek!“ Leknu se, když se ozve [polyglot.GetFirstName]. Jakmile si všimne mého zmatení, povzbudivě poklepe na pergamen.\n\n„Je to napsané v jiném jazyce, [Select_CString(ROOT.Char.IsFemale,'má malá paní','můj malý pane')]. Ale neboj se! Já to přečíst umím a ty si s tím zatím nemusíš lámat hlavu.“"
 bp2_yearly.5050.a: "„Už umím víc než jeden jazyk! Nauč mě to!“"
 bp2_yearly.5050.b: "Ale... já chci!"
 bp2_yearly.5050.c: "Aspoň že teď o tom vím."
 bp2_yearly.5051.t: "Kuk!"
 bp2_yearly.5051.desc: "Slyším to po celém sídle. Tiché chichotání, které občas přeroste v hlasité výbuchy smíchu. Když vstoupím do jedné z komnat, konečně odhalím původce toho veselí.\n\n[child.GetFirstName|U] podle odhozených knih rozházených po stole očividně [Select_CString(child.IsFemale,'nechala','nechal')] studium stranou. V náručí chová svého sourozence [baby.Custom('CZ_FirstName_A')]. Miminko spokojeně žvatlá, zatímco na něj [child.GetFirstNameNoTooltip] vykukuje skrz prsty. Obě děti se přitom vesele chichotají."
 bp2_yearly.5051.a: "Je dobře, že spolu tráví čas!"
 bp2_yearly.5051.b: "„[child.Custom('CZ_FirstNameNoTooltip_V')|U]! Nezapomínej na učení!“"
 bp2_yearly.5052.t: "Příběhy starých časů"
 bp2_yearly.5052.desc: "Když se blížím k jedné z komnat, zpomalím. Zdá se mi, že slyším něčí hlas. Ano, skutečně!\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('grandparent'))|U] [grandparent.GetFirstName] drží v náručí své vnouče [child.Custom('CZ_FirstName_A')], které napjatě poslouchá poutavé vyprávění. Také se zaposlouchám, ale zachytím jen útržky.\n\n[grandparent.GetFirstNameNoTooltip|U] vypráví příběhy ze svého dlouhého a bohatého života. Historky z dávných i nedávných časů očividně [child.Custom('CZ_FirstNameNoTooltip_A')] zcela uchvátily. Dítě poslouchá s ústy dokořán."
 bp2_yearly.5052.a: "„A co třeba ta příhoda, kdy jsem něco podobného [Select_CString(ROOT.Char.IsFemale,'dokázala','dokázal')] #EMP já#!?“"
 bp2_yearly.5052.b: "„Nevadí, když se k vám přidám?“"
 bp2_yearly.5052.c: "To je milé. Raději je nechám o samotě."
 bp2_yearly.5053.t: "Zajatec srdce"
 bp2_yearly.5053.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('ward'))|U] [ward.GetFirstName] se pobaveně usměje mému vtipu a s vřelým zamáváním se vrátí ke studiu. Vtom ke mně rozzuřeně přiběhne mé dítě [angry_kid.GetFirstName].\n\n„Tak to přiznej!“ vykřikne. „Ten #EMP cizinec#! ti přirůstá k srdci čím dál víc! Záleží ti na [ward.Custom('CZ_FirstName_I')] víc než na #EMP mně#!, na tvé vlastní krvi!“\n\nZdá se, že můj sílící pocit, že [ward.GetFirstNameNoTooltip] už sem prostě #EMP patří#!, rozhodně nesdílejí všichni..."
 bp2_yearly.5053.a: "„Víš přece, že mi nikdo nemůže nahradit vlastní rodinu, [angry_kid.Custom('CZ_FirstNameNoTooltip_V')].“"
 bp2_yearly.5053.b: "„Nikdy bych nic takového [Select_CString(ROOT.Char.IsFemale,'necítila','necítil')]!“"
 bp2_yearly.5053.b.success: "Podaří se ti dítě přesvědčit"
 bp2_yearly.5053.b.failure: "Dítě ti nevěří"
 bp2_yearly.5053.c: "„[ward.GetFirstNameNoTooltip|U] je pro mě víc jako vlastní dítě, než jsi kdy [Select_CString(angry_kid.IsFemale,'byla','byl')] ty!“"
 bp2_yearly.5054.t: "Pevné přátelství"
 bp2_yearly.5054.desc: "Do mých komnat vtrhne veselý smích a dětské dovádění. Přibíhají [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] a [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] [hostage.GetFirstName]. Obě děti se s hračkami v rukou vesele honí po místnosti.\n\nDvě děti z naprosto odlišných poměrů si spolu nevinně hrají a zjišťují, že toho mají společného mnohem víc, než by se podle jejich rozdílů mohlo zdát.\n\nMožná je to vlastně dobře?"
 bp2_yearly.5054.a: "Jsem [Select_CString(ROOT.Char.IsFemale,'ráda','rád')], že spolu tak dobře vycházejí."
 bp2_yearly.5054.b: "„[child.Custom('CZ_FirstNameNoTooltip_V')|U]! Počkej chvilku a dobře mě poslouchej...“"
 bp2_yearly.5054.b.tt: "[child.GetFirstName|U] se musí naučit, že nemůže jen tak důvěřovat každému."
 bp2_yearly.5100.t: "Přichází vyzyvatel"
 bp2_yearly.5100.desc: "#EMP Svišt, prásk!#! Zvuk dřevěného meče, který prosviští vzduchem a zasáhne cíl, mě naplňuje nadšením. Připravím se k dalšímu úderu, ale všimnu si, že mě někdo pozoruje. [challenger.GetFirstName|U] seběhne hlučně ze schodů a v ruce se ohání vlastním mečem.\n\n„[ROOT.Char.GetFirstNameNoTooltip|U]! Uvidíme, jak si povedeš proti #EMP mně!#!“\n\nObezřetně si [challenger.Custom('CZ_FirstNameNoTooltip_A')] prohlédnu od hlavy až k patě. Tyhle „meče“ by dokázaly pořádně ublížit, kdyby jimi člověk někoho udeřil. A [challenger.GetFirstNameNoTooltip] se zdá být na můj vkus až příliš... #EMP [Select_CString(challenger.IsFemale,'nadšená','nadšený')|l]#!."
 bp2_yearly.5100.a: "Dobrá. Do střehu!"
 bp2_yearly.5100.a.tt: "Zahájíš souboj s [challenger.Custom('CZ_FirstNameNoTooltip_I')]."
 bp2_yearly.5100.b: "Co kdybychom si místo toho zahráli na bitvu?"
 bp2_yearly.5100.b.tt: "Když se zaměříme na manévrování, snad si ušetříme pořádné rány do hlavy..."
 bp2_yearly.5101.t: "Koníčky na koníčcích"
 bp2_yearly.5101.desc: "Dveře se s rachotem rozletí a já cválám za [child.Custom('CZ_FirstName_I')]. [Select_CString(And(ROOT.Char.IsFemale,child.IsFemale),'Obě','Oba')|U] sedíme na svých dřevěných konících a při divokém pobíhání po pracovně se nadšeně smějeme. [councillor.GetFirstName|U], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|l], unaveně vzhlédne od hromady pergamenů, které právě pročítá.\n\n„To tady musíte dělat takový příšerný rámus?“ vykřikne a ukáže na nás. „#EMP Někdo#! se přece musí starat o správu panství, [ROOT.Char.Custom('FormOfAddressForLiege')|l], a opravdu bych při tom [Select_CString(councillor.IsFemale,'ocenila','ocenil')] trochu klidu a ticha!“\n\nOhlédnu se za [child.Custom('CZ_FirstNameNoTooltip_I')], [Select_CString(child.IsFemale,'která','který')|l] stále nadšeně poskakuje po místnosti."
 bp2_yearly.5101.a: "Jak #EMP se opovažuješ#! mi rozkazovat?!"
 bp2_yearly.5101.b: "Kdo bude první venku, [child.Custom('CZ_FirstNameNoTooltip_V')]!"
 bp2_yearly.5101.b.tt: "Ani jeden z nich si nevšimne, že se nás tím jen snažím dostat z místnosti..."
 bp2_yearly.5101.b.success: "Vyhraješ závod"
 bp2_yearly.5101.b.failure: "Prohraješ závod"
 bp2_yearly.5101.c: "„Promiň, [councillor.Custom('CZ_FirstNameNoTooltip_V')]. Už přestaneme.“"
 bp2_yearly.5102.t: "Okamžitá odplata"
 bp2_yearly.5102.desc: "Při hře na honěnou na nádvoří mě teď pronásleduje [sibling.GetFirstName]. Srdce mi divoce buší, zatímco kličkuji mezi květinovými záhony.\n\n[sibling.GetFirstNameNoTooltip|U] ztratí rovnováhu a začne divoce mávat rukama. Ani na okamžik nezaváhám a využiji příležitosti k pořádnému strčení. [sibling.GetFirstNameNoTooltip|U] se bezmocně zapotácí... a spadne přímo do trnitého růžového keře!\n\nVzápětí se ozve stejně předvídatelný jako hlasitý nářek. [sibling.GetFirstNameNoTooltip|U] se nejistě postaví na nohy a okamžitě zamíří k pokoji, kde sídlí náš [parent.GetMotherFather]. S hrůzou si uvědomím, co se chystá!"
 bp2_yearly.5102.a: "Prosím, počkej! Já... koupím ti hračku!"
 bp2_yearly.5102.a.tt: "[sibling.GetFirstNameNoTooltip|U] získá [newly_created_artifact.GetName]"
 bp2_yearly.5102.b: "Ne, ne, jen to neříkej [Select_CString(parent.IsFemale,'mamince','tatínkovi')]!"
 bp2_yearly.5102.b.success: "Podaří se ti [sibling.Custom('CZ_FirstNameNoTooltip_A')] přemluvit"
 bp2_yearly.5102.b.failure: "[sibling.GetFirstNameNoTooltip|U] se nenechá odradit"
 bp2_yearly.5102.c: "„Ale vzpamatuj se, ty ufňukané mimino!“"
 bp2_yearly.5103.t: "Tajná výprava za sladkostmi"
 bp2_yearly.5103.desc: "Když procházím kolem kuchyně, zavane ke mně nádherná vůně. Žaludek mi hlasitě zakručí, a tak se přikradnu ke dveřím a opatrně nakouknu dovnitř. Přesně jak jsem [Select_CString(ROOT.Char.IsFemale,'doufala','doufal')]!\n\n[ROOT.Char.Custom('FavoriteTreatDemand')|U]! A nikdo je nehlídá! Tedy alespoň #EMP zdánlivě#!. Ještě jednou se obezřetně rozhlédnu po místnosti, ale nikoho nevidím. Stačí se jen rychle natáhnout a...\n\n„[ROOT.Char.GetFirstNameNoTooltip|U]!“ Ztuhnu s nataženou rukou, pouhých pár prstů od vytoužené slasti. „Co si myslíš, že děláš?“ To mě volá [ROOT.Char.Custom2('RelationToMeShort', parent)] [parent.GetFirstName]. Přísnost toho hlasu mi rve srdce."
 bp2_yearly.5103.a: "„Mě nezastavíš! Brzy budu #EMP vládnout#! já!“"
 bp2_yearly.5103.b: "Teď, nebo nikdy! Musím utéct!"
 bp2_yearly.5103.b.success: "Podaří se ti uniknout i s pochoutkou"
 bp2_yearly.5103.b.failure: "[parent.GetFirstNameNoTooltip|U] tě chytí a zbije"
 bp2_yearly.5103.c: "„Promiň. Už to nikdy neudělám.“"
 bp2_yearly.5104.t: "Osamělé dítě"
 bp2_yearly.5104.desc: "S hračkou v ruce nadšeně přiběhnu na nádvoří, ale na lavičce spatřím sklíčenou postavu. Je to [child.GetFirstName]. Sotva si mě všimne a na mé pokusy o rozveselení reaguje jen povzdechy. Dokonce ani má hračka nevzbudí sebemenší zájem, takže si bezradně drbu hlavu.\n\nCo mám teď dělat?"
 bp2_yearly.5104.a: "Prostě si přisednu a budu sdílet ten smutek."
 bp2_yearly.5104.b: "„Ale no tak, [child.Custom('CZ_FirstNameNoTooltip_V')], pojď si hrát!“"
 bp2_yearly.5104.b.success: "Podaří se ti [child.Custom('CZ_FirstNameNoTooltip_A')] přemluvit ke hře a brzy se zase rozveselí"
 bp2_yearly.5104.b.failure: "Ať děláš cokoli, [child.GetFirstNameNoTooltip] se rozveselit nepodaří"
 bp2_yearly.5104.c: "No... možná bude lepší nechat to být?"
 bp2_yearly.5104.c.tt: "Možná se z toho něco naučím..."
 bp2_yearly.5105.t: "Za čest a slávu!"
 bp2_yearly.5105.desc: "„[ROOT.Char.GetFirstNameNoTooltip|U]!“ Nádvořím se rozlehne pronikavý hlas. „Vyzývám tě na rytířský souboj, abych [Select_CString(child.IsFemale,'obhájila','obhájil')] svou čest! Vyber si oře a pozvedni kopí, [Select_CString(ROOT.Char.IsFemale,'udatná bojovnice','udatný bojovníku')|l]!“\n\n[child.GetFirstName|U] se ohání větví a mezi nohama svírá dřevěného koníka. Můj vlastní oř už spořádaně čeká na nedaleké lavičce, hned vedle stejně dlouhé větve.\n\nZdá se, že [child.GetFirstNameNoTooltip] [Select_CString(child.IsFemale,'přišla','přišel')] do boje opravdu dokonale [Select_CString(child.IsFemale,'připravená','připravený')]!"
 bp2_yearly.5105.a: "„Tak pojď, [Select_CString(child.IsFemale,'paní','pane')] [child.Custom('CZ_FirstNameNoTooltip_V')]! Změříme síly!“"
 bp2_yearly.5105.a.tt: "Rytířský souboj začíná!"
 bp2_yearly.5105.a.success: "Podaří se ti zasáhnout soupeře"
 bp2_yearly.5105.a.failure: "[child.GetFirstNameNoTooltip|U] zasadí první úder"
 bp2_yearly.5105.b: "Myslím, že opatrnost je v tomhle případě lepší stránkou odvahy."
 bp2_yearly.5106.t: "První zásah"
 bp2_yearly.5106.desc.winning: "Mé „kopí“ zasáhne [child.Custom('CZ_FirstName_A')] přímo do hrudi a zanechá na kůži drobnou podlitinu. Vítězoslavně se otočím a odcválám, zatímco si [child.GetFirstNameNoTooltip] rozmrzele tře zasažené místo."
 bp2_yearly.5106.desc.losing: "„Kopí“ [child.Custom('CZ_FirstName_G')] mě zasáhne přímo do hrudi a úder mě málem srazí ze sedla. [child.GetFirstNameNoTooltip|U] vítězoslavně obrátí svého oře a odcválá."
 bp2_yearly.5106.ending: "\n\nPrvní střet je vždycky trochu loterie. Teď už však záleží na tom, co jsem se při výcviku [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')], a na schopnosti využít každou taktickou výhodu.\n\nVítr čechrá listí stromů, zatímco se znovu stavíme proti sobě. Další střet může rozhodnout o všem."
 bp2_yearly.5106.a: "Uvidíme, jak to dopadne..."
 bp2_yearly.5106.a.tt: "Toto kolo je rozhodující. Buď zvítězíš, nebo si udržíš šanci pokračovat v souboji..."
 bp2_yearly.5106.a.success: "Tvůj úder přesně zasáhne cíl"
 bp2_yearly.5106.a.failure: "Hůl [child.Custom('CZ_FirstNameNoTooltip_G')] pronikne tvou obranou"
 bp2_yearly.5106.b: "„Nemohli bychom už přestat?“"
 bp2_yearly.5107.t: "Odvetný úder"
 bp2_yearly.5107.desc.winning: "Má hůl nejprve klesne, pak prudce vyletí vzhůru, prosmýkne se pod obranou [child.Custom('CZ_FirstName_G')] a dokonale zasáhne břicho! [child.GetFirstNameNoTooltip|U] se snaží narovnat a popadnout dech."
 bp2_yearly.5107.desc.losing: "[child.GetFirstName|U] rozhodně není tak snadným soupeřem, jak jsem [Select_CString(ROOT.Char.IsFemale,'doufala','doufal')]. Místo aby [Select_CString(child.IsFemale,'ustoupila','ustoupil')], udeří mě holí přímo do břicha. Předkloním se bolestí a snažím se skrýt podráždění, zatímco se [child.GetFirstNameNoTooltip] vítězoslavně šklebí."
 bp2_yearly.5107.ending: "[Select_CString(And(ROOT.Char.IsFemale,child.IsFemale),'Obě','Oba')|U] už na sobě neseme památky našeho souboje.\n\nPrvní střet zahnal nervozitu, ve druhém rozhodovala taktika. Ale třetí... Ve třetím záleží na tom, kdo dokáže lépe odhadnout protivníka, využít všechno dosavadní poznání a rozpoznat sebemenší náznak jeho příštího pohybu.\n\nJsem [Select_CString(ROOT.Char.IsFemale,'připravená','připravený')]."
 bp2_yearly.5107.a: "Za vítězstvím!"
 bp2_yearly.5107.a.success: "Tvůj úder zasáhne cíl a vyhraješ rytířský souboj"
 bp2_yearly.5107.a.failure: "[child.GetFirstNameNoTooltip|U] je prostě příliš [Select_CString(child.IsFemale,'rychlá','rychlý')]"
 bp2_yearly.5107.b: "„Každý jsme jednou vyhráli. Co to prohlásit za remízu?“"
 bp2_yearly.5107.b.tt: "To byl ale vyrovnaný souboj!"
 bp2_yearly.5107.b.tt_success: "Možná vyhraješ příští turnaj"
 bp2_yearly.5107.b.tt_fail: "Byla to jen hra"
 bp2_yearly.5107.b_tt_fail: "Nic ses z toho [Select_CString(ROOT.Char.IsFemale,'nenaučila','nenaučil')] "
 bp2_yearly.5108.t: "Skvělý střet!"
 bp2_yearly.5108.desc.winning: "V okamžiku střetu téměř zavřu oči, ale můj úder opět zasáhne přesně. Hůl narazí do hrudní kosti [child.Custom('CZ_FirstName_G')] a s hlasitým prasknutím se roztříští.\n\nÚder dokonce srazí soupeře na zem. Na okamžik stojím nad bezvládně ležící postavou, než se [child.GetFirstNameNoTooltip] s námahou zvedne na nohy.\n\nVítězství je moje a chutná opravdu, #EMP opravdu#! sladce."
 bp2_yearly.5108.desc.losing: "Hůl [child.Custom('CZ_FirstName_G')] na okamžik zaváhá, ale nejde o chybu. Je to lest! Vzápětí mi prudce narazí do hrudi, vyrazí mi dech a já se zhroutím na zem.\n\n[child.GetFirstNameNoTooltip|U] ustoupí a nechá mě vstát. Jenže bolest porážky pálí ještě víc než všechny mé odřeniny a modřiny."
 bp2_yearly.5108.a: "„[Select_CString(child.IsFemale,'Bojovala','Bojoval')|U] jsi výborně, [child.Custom('CZ_FirstNameNoTooltip_V')].“"
 bp2_yearly.5108.b: "„Ha! A proto jsem #EMP nejlepší!#!“"
 bp2_yearly.5108.c: "„Skvělý souboj, [child.Custom('CZ_FirstNameNoTooltip_V')]!“"
 bp2_yearly.5108.d: "Tohle [child.Custom('CZ_FirstName_D')] vrátím! Byla to jen náhoda..."
 bp2_yearly.5109.t: "Bolest, která nepomíjí"
 bp2_yearly.5109.desc: "Nádvořím se rozléhá tichý pláč. [child.GetFirstName|U] sedí na lavičce a po tvářích stékají slzy. Když se přiblížím, pokusí se vzlyky potlačit a nešťastným gestem mi ukáže na volné místo vedle sebe.\n\n"
 bp2_yearly.5109.desc_unrelated: "„Tak moc mi chybí [Select_CString(parent.IsFemale,'maminka','tatínek')]. Já... já na [Select_CString(parent.IsFemale,'ni','něj')] nemůžu přestat myslet.“\n\nUž je to poměrně dlouho, co [parent.GetFirstName], [Select_CString(parent.IsFemale,'matka','otec')] [child.Custom('CZ_FirstNameNoTooltip_G')], [Select_CString(parent.IsFemale,'zemřela','zemřel')]. Je však zřejmé, že [child.GetFirstNameNoTooltip] tuto ztrátu stále velmi bolestně prožívá."
 bp2_yearly.5109.desc_sibling: "„Tak moc mi chybí [Select_CString(parent.IsFemale,'maminka','tatínek')]. Já... já na [Select_CString(parent.IsFemale,'ni','něj')] nemůžu přestat myslet.“\n\nUž je to poměrně dlouho, co náš [Select_CString(parent.IsFemale,'milovaná matka','milovaný otec')] [parent.GetFirstName] [Select_CString(parent.IsFemale,'zemřela','zemřel')]. Je však zřejmé, že [child.GetFirstNameNoTooltip] tuto ztrátu stále velmi bolestně prožívá."
 bp2_yearly.5109.a: "„Pamatuj, že na tebe [Select_CString(parent.IsFemale,'maminka','tatínek')] stále dohlíží.“"
 bp2_yearly.5109.b: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] bych se pokusit odvést pozornost od toho smutku."
 bp2_yearly.5109.b.success: "Podaří se ti [child.Custom('CZ_FirstNameNoTooltip_A')] utěšit"
 bp2_yearly.5109.b.failure: "[child.GetFirstNameNoTooltip|U] se nedá utišit"
 bp2_yearly.5109.c: "Já... vůbec nevím, co říct."
 bp2_yearly.5109.c.tt: "Uvidíme, jestli se dokážu nenápadně vytratit..."
