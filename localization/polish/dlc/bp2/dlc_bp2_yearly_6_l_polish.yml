 bp2_yearly.6010.t: "[Select_CString(sad_boi.IsFemale,'Žádná žena','Žádný muž')|U] ve vězení"
 bp2_yearly.6010.desc: "„#EMP Přátel mám mnoho, však darů od nich málo...#!“ zpívá [sad_boi.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sad_boi'))|l], a hlas se [Select_CString(sad_boi.IsFemale,'jí','mu')|l] láme dojetím.\n\nOdloží nástroj a zvolá: „Už mám [ROOT.Char.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_G')] dost! "
 bp2_yearly.6010.adult: "Chybí tu každé pohodlí.“\n\nVrátí mi zničující pohled a dodá: „Ta píseň bude mou prosbou o pomoc v tomto nešťastném zajetí. Trochu peněz... jestli na mně mému lidu ještě záleží...“"
 bp2_yearly.6010.child: "Je mi tu tak smutno.“\n\n[Select_CString(sad_boi.IsFemale,'Dívka','Chlapec')|U] ke mně vzhlédne se slzami v očích a dodá: „Když má rodina tu píseň uslyší, něco pošle! Něco, co mi zpříjemní tohle #EMP vyhnanství#!, jestli... jim na mně ještě záleží...“"
 bp2_yearly.6010.outro: "\n\nZnovu se pustí do teskné melodie a v očích má vzdálený domov."
 bp2_yearly.6010.a: "Ano, uvidíme, na jakou „dobročinnost“ se zmohou..."
 bp2_yearly.6010.a.tt: "...pro můj měšec."
 bp2_yearly.6010.b: "Smutno?! #EMP Mohu nějak pomoci?#!"
 bp2_yearly.6010.b.tt: "O mém dvoře se nesmí zpívat jako o místě utrpení!"
 bp2_yearly.6010.c: "Musím [Select_CString(sad_boi.IsFemale,'jí','mu')|l] vysvětlit, že sem patří."
 bp2_yearly.6010.c.tt: "Všichni, ať už jsme se tu narodili, nebo ne, musíme snášet těžkosti s tichou důstojností."
 bp2_yearly.6010.c.success: "Dá [ROOT.Char.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_D')] další šanci"
 bp2_yearly.6010.c.tt_education: "Výsledek vzdělání [sad_boi.Custom('CZ_FirstName_G')] se zlepší"
 bp2_yearly.6010.c.failure: "Popírání pravdivosti veršů rozruší [sad_boi.Custom('CZ_FirstNameNoTooltip_A')]"
 bp2_yearly.6010.d: "Vlastně je to krásná skladba."
 bp2_yearly.6010.d.tt: "Ať ten nářek zní široko daleko. Jeho krása je důležitější než obsah."
 bp2_yearly.6020.t: "Děti říkají tak legrační věci"
 bp2_yearly.6020.desc: "Když vyprávím nejnovější zprávy ze dvora [snitch.GetHomeCourt.Custom('CZ_TitledFirstName_G')], [snitch.GetName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('snitch'))|l], se zvláštně pobaveným výrazem usmívá "
 bp2_yearly.6020.child: "tou svou drobnou tvářičkou.\n\n„Znám příběh, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]. Příběh, který [Select_CString(snitch.IsFemale,'jsem viděla','jsem viděl')|l] na vlastní oči! Ale... nesmím ho říct. [Select_CString(snitch.IsFemale,'Slíbila','Slíbil')|U] jsem to.“\n\nChichotá se zlomyslnou radostí a užívá si vzácnou moc nad dospělými.\n\n„Nezbedníci!“ zajásá [snitch.GetFirstNameNoTooltip]. "
 bp2_yearly.6020.youth: "tou svou uhrovitou dospívající tváří.\n\n„Znám příběh, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]. Právě jsi mi ho [Select_CString(ROOT.Char.IsFemale,'připomněla','připomněl')|l]. Něco, co se nikdy nesmí opakovat! Ale... tehdy [Select_CString(snitch.IsFemale,'jsem byla tak malá','jsem byl tak malý')|l]. Teď už mi to připadá tak dávno.“\n\nZlomyslně se uchechtne a užívá si vzácnou moc nad lidmi, mezi nimiž [Select_CString(snitch.IsFemale,'vyrůstala','vyrůstal')|l].\n\n„Nezbedníci!“ zajásá [snitch.GetFirstNameNoTooltip]. "
 bp2_yearly.6020.liege: "„Tak svatí, a přitom tak nezbední!“"
 bp2_yearly.6020.family: "„Rodina dokáže být tak nezbedná!“"
 bp2_yearly.6020.a: "Jen pokračuj..."
 bp2_yearly.6020.a.secret: "Dozvíš se [Concept('secret','tajemství')|e] rodiny [snitch.Custom('CZ_ShortUIName_G')]"
 bp2_yearly.6020.a.non_family_secret: "Dozvíš se [Concept('secret','tajemství')|e] z úzkého kruhu [Concept('court','dvora')|E] [no_no_doer.Custom('CZ_ShortUIName_G')]"
 bp2_yearly.6020.a.success: "Rozkošně hanebná historka"
 bp2_yearly.6020.a.failure: "Asi jen nezralá hloupost..."
 bp2_yearly.6020.a.no_secret: "Nedozvíš se nic důležitého"
 bp2_yearly.6020.b: "Prostořekost vede k potupě."
 bp2_yearly.6020.b.tt: "[snitch.GetFirstNameNoTooltip|U] by [Select_CString(snitch.IsFemale,'měla','měl')|l] dát přednost diskrétnosti před drby."
 bp2_yearly.6020.b.discretion: "[snitch.GetShortUIName|U] [Select_CString(snitch.IsLocalPlayer,'budeš','bude')|l] tvá [Concept('secrets','tajemství')|E] vyzrazovat mnohem méně často"
 bp2_yearly.6030.t: "Oči rodiny"
 bp2_yearly.6030.desc: "[snitch.GetFirstName|U], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('snitch'))|l], mi zpříjemňuje ranní procházku v mlžném oparu. Je [Select_CString(snitch.IsFemale,Select_CString(CZEnds(snitch.Custom('ComplimentAdjective'),'ýá'),CZAdjectiveDecline(snitch.Custom('ComplimentAdjective'),'á'),snitch.Custom('ComplimentAdjective')),snitch.Custom('ComplimentAdjective'))|l] a vypráví mi o svém pobytu jako rukojmí v péči [warden.Custom('CZ_Name_G')].\n\n[Select_CString(snitch.IsFemale,'Vrátila se','Vrátil se')|U] zcela [Select_CString(snitch.IsFemale,'proměněná: moudřejší a všímavější','proměněný: moudřejší a všímavější')|l]. Věrnost rodu „[snitch.GetDynastyHouseName]“ a schopnost přizpůsobit se cizímu prostředí jsou zjevné.\n\nVěrnost rodu „[snitch.GetDynastyHouseNameNoTooltip]“... možná můžeme těžit z toho, že naše rodina měla oči na dvoře [warden.Custom('CZ_TitledFirstNameNoTooltip_G')]...?"
 bp2_yearly.6030.hostage_reticent: "\n\n[snitch.GetFirstNameNoTooltip|U] se však zdá být #negative_value velmi [Select_CString(snitch.IsFemale,'neochotná','neochotný')|l]#! předávat mi zprávy. Možná [Select_CString(snitch.IsFemale,'ji','ho')|l] před tím dokonce někdo varoval."
 bp2_yearly.6030.hostage_normal: "\n\nPřesněji — co vlastně [snitch.GetFirstNameNoTooltip] ví, pokud vůbec něco?"
 bp2_yearly.6030.a: "Mohu z [warden.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] vylákat tajemství..."
 bp2_yearly.6030.maybe_secret: "#high [snitch.GetFirstName|U]#! se #EMP možná#! podělí o [Concept('secret','tajemství')|E] z úzkého kruhu [warden.Custom('CZ_ShortUIName_G')]"
 bp2_yearly.6030.a.success: "Dozvíš se všechno, co [snitch.GetFirstNameNoTooltip] ví"
 bp2_yearly.6030.a.failure: "[snitch.GetFirstNameNoTooltip|U] se vyhýbá otázkám"
 bp2_yearly.6030.a.no_secret: "[snitch.GetFirstName|U] ví... jen samé nepodstatné věci"
 bp2_yearly.6030.a.evade: "#high [snitch.GetFirstName|U]#! neřekne nic užitečného"
 bp2_yearly.6030.b: "Za službu rodině — odměna!"
 bp2_yearly.6030.b.tt: "Ať ví, jak štědře odměňuji spolčence a informátory!"
 bp2_yearly.6030.b.failure: "[snitch.GetFirstNameNoTooltip|U] neprozradí žádné [Concept('secrets','tajemství')|E]"
 bp2_yearly.6030.b.rewarded: "#high [snitch.GetFirstName|U]#! se mnohem ochotněji zapojí do tvých [Concept('schemes','intrik')|E]"
 bp2_yearly.6030.refuse_reward: "#high [snitch.GetFirstName|U]#! nepomůže a odměna nic nezmění"
 bp2_yearly.6030.c: "Bez cti nemá rukojemnictví cenu."
 bp2_yearly.6030.c.tt: "Pravidla této dohody jsou přísná a nedotknutelná."
 bp2_yearly.6030.c.honor: "[Concept('rulers','Vládci')|EU] ti budou ochotněji nabízet [Concept('hostages','rukojmí')|E] a požadovat je od tebe"
 bp2_yearly.6030.c.hostage_secrets: "@alert_icon! #alert_trial Když budeš z [Concept('hostages','rukojmích')|E] vynucovat [Concept('secrets','tajemství')|E], získáš [Concept('tyranny','tyranii')|E]#!"
 honorable_warden_modifier: "Čestný strážce"
 honorable_warden_modifier_desc: "Tato postava tvrdí, že [Concept('hostages','rukojmím')|e] zaručuje nedotknutelnou důstojnost."
 bp2_yearly.6040.t: "Vše, čím nejsme"
 bp2_yearly.6040.desc: "Pozoruji nejmladší [ROOT.Char.GetCulture.GetCollectiveNoun] při učení v [ROOT.Char.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_L')]. Učí se pomalu, chybí jim kázeň a hádají se jako jejich rodiče.\n\nZcela jinak než [advanced_culture.GetCollectiveNoun] v úchvatných končinách [childhood_location.GetCounty.GetTitle.Custom('CZ_LandedNameNoTier_G')]. Jejich panství oplývá řádem, velkolepými díly a vznešenými myšlenkami. Když [Select_CString(ROOT.Char.IsFemale,'jsem tam byla','jsem tam byl')|l] "
 bp2_yearly.6040.hostage: "[Select_CString(ROOT.Char.IsFemale,'držena','držen')|l] jako rukojmí"
 bp2_yearly.6040.education: "[Select_CString(ROOT.Char.IsFemale,'vychovávána','vychováván')|l]"
 bp2_yearly.6040.outro: ", otevřely se mi oči.\n\n[Select_CString(ROOT.Char.IsFemale,'Pochopila','Pochopil')|U] jsem, jak primitivní můj lid ve skutečnosti je.\n\nMohu to změnit. Se znalostmi [advanced_culture.Custom('CZ_AdjectiveNoTooltip_ee')|l] kultury, které [Select_CString(ROOT.Char.IsFemale,'jsem získala','jsem získal')|l] v mládí... možná bych nás [Select_CString(ROOT.Char.IsFemale,'měla','měl')|l] vést po nejisté cestě reformy?"
 bp2_yearly.6040.a: "Má vláda může přinést znovuzrození."
 bp2_yearly.6040.a.tt: "Zavedu cizí poznatky, které nahradí zvyky mého lidu — nebo jim dodají ještě větší slávu."
 bp2_yearly.6040.a.reforms: "Pokusíš se reformovat a povznést svou [Concept('culture','kulturu')|E], [Concept('court','dvůr')|E] a [Concept('realm','panství')|E] podle [advanced_culture.Custom('CZ_Adjective_eeho')|l] vzoru"
 bp2_yearly.6040.a.warning: "@alert_icon! #alert_trial Bude to náročné a nákladné. Připrav se na to.#!"
 bp2_yearly.6040.b: "Proč vůbec #EMP uvažovat#! o zpochybnění našich tradic?"
 bp2_yearly.6040.b.tt: "Přijímám naše vytříbené [ROOT.Char.GetCulture.Custom('CZ_AdjectiveNoTooltip_ee')|l] zvyky a ke všemu ostatnímu se obracím zády!"
 bp2_yearly.6040.b.promote_culture: "[Concept('councillor_task','Úkol rádce')|EU] [Concept('promote_culture','Podporovat kulturu')|E] bude po #high 25 let#! účinnější"
 bp2_yearly.6040.b.no_reforms: "O těchto reformách už nebudeš uvažovat"
 bp2_yearly.6040.c: "Teď na to prostě není vhodná chvíle."
 bp2_yearly.6040.c.recurring: "Podnět k reformě se pravděpodobně objeví znovu"
 devoted_to_tradition_modifier: "Zastánce tradic"
 devoted_to_tradition_modifier_desc: "Tato postava odmítá styk s cizinci a je proslulým zastáncem svého lidu."
 bp2_devoted_to_tradition_modifier_conversion_task_desc: "$devoted_to_tradition_modifier$"
 bp2_yearly.6050.t: "Kámen, železo, hlína a proutí"
 bp2_yearly.6050.desc: "Na můj příkaz se od [ROOT.Char.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_G')] rozbíhají první nově vytyčené cesty a skromné stanice, budované po vzoru velkých [advanced_culture.Custom('CZ_Adjective_yych')|l] silnic, pevností a berních úřadů.\n\nMé hlavní sídlo stále nesnese srovnání s třpytem [childhood_location.GetCounty.GetTitle.Custom('CZ_LandedNameNoTier_G')] a [ROOT.Char.GetPrimaryTitle.GetNameNoTier] se dosud nemůže chlubit početným obyvatelstvem, obchodem a řemesly. #EMP Zatím.#!\n\nVedle mě [noble_representative.GetTitledFirstName] nevraživě pozoruje nové stavby a cizí architekty.\n\n„Obohacuješ #EMP kupce#! a #EMP prostý lid#!,“ ušklíbne se [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('noble_representative'))|l], „zatímco tvá věrná šlechta by z tvé štědrosti mohla stavět nové síně!“"
 bp2_yearly.6050.a: "Mé nové velkolepé hlavní sídlo bude vzkvétat!"
 bp2_yearly.6050.a.tt: "Mezi městy usedlých zemí zazáří nový klenot. Jeho obyvatelé budou prosperovat — a já s nimi."
 bp2_yearly.6050.b: "My civilizovaní lidé #EMP nedáváme#!. Vybíráme daně a stavíme."
 bp2_yearly.6050.b.tt: "Tyto odvody jsou v cizích zemích běžné — a odteď budou i tady!"
 bp2_yearly.6050.every_county_development: "Úroveň [Concept('development','rozvoje')|E] v každém [Concept('county','hrabství')|E] tvé [Concept('domain','domény')|E] se změní o #positive_value +1#!"
 bp2_yearly.6050.county_control_loss: "Úroveň [Concept('control','kontroly')|E] se v každém [Concept('county','hrabství')|E] tvé [Concept('domain','domény')|E] změní o #negative_value -30#!"
 bp2_yearly.6050.county_opinion_modifier: "Každé [Concept('county','hrabství')|E] tvé [Concept('domain','domény')|E], které nemá [advanced_culture.Custom('CZ_Adjective_ou')|l] kulturu, získá [GetModifier('unprecedented_taxation_modifier').GetNameWithTooltip]"
 bp2_yearly.6050.c: "Nemohu se obrátit ke své šlechtě zády!"
 bp2_yearly.6050.c.tt: "Vždy a především budu upřednostňovat velmože [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')]."
 bp2_yearly.6020.pay_vassals: "Všem svým [Concept('powerful_vassals','mocným vazalům')|E] zaplatíš [gold_i|E]#N [root_scope.MakeScope.ScriptValue('minor_gold_value')]#! #EMP a#! ztratíš [gold_i|E]#N [root_scope.MakeScope.ScriptValue('minor_gold_value')]#!"
 bp2_yearly.6050.reaffirmation_path: "@alert_icon! #alert_trial To #EMP rychle#! přispívá k opětovnému potvrzení tvých [root_scope.GetCulture.Custom('CZ_AdjectiveNoTooltip_yych')|l] zvyklostí#!"
 bp2_yearly.6050.reform_path: "@alert_icon! #alert_trial To přispívá k tvým rozsáhlým reformám podle [advanced_culture.Custom('CZ_AdjectiveNoTooltip_eeho')|l] vzoru#!"
 cultural_acceptance_gain_beginning_reforms: "[Concept('ruler','Vládce')|EU] začal přejímat zvyklosti jiné [Concept('culture_possessive','kultury')|E]"
 cultural_acceptance_gain_building_familiar_settlements: "[Concept('realm','Panství')|EU] reformátora bylo přestavěno ve stylu společném oběma kulturám"
 cultural_acceptance_turned_away_trade: "[Concept('ruler','Vládce')|EU] pod záminkou velkých projektů oklamal stavitele a kupce jiné [Concept('culture','kultury')|E]"
 massive_construction_efforts_modifier: "Rozsáhlé stavební úsilí"
 massive_construction_efforts_modifier_desc: "Na velkolepé projekty sem ve velkém přicházejí zkušení zahraniční stavitelé."
 great_builder_modifier: "Velký stavitel"
 great_builder_modifier_desc: "Oddaný mecenáš odvážných stavebních plánů, průkopník změn a zaměstnavatel zkušených zahraničních odborníků."
 unprecedented_taxation_modifier: "Nebývalé zdanění"
 unprecedented_taxation_modifier_desc: "Cizí způsob zdanění, tvrdší, než si kdo dříve dokázal představit, financuje zdejší rozvoj, který budí všeobecnou nelibost."
 loyal_realm_nobility_modifier: "Miláček šlechty panství"
 loyal_realm_nobility_modifier_desc: "Tato postava si získala vřelou přízeň urozených válečníků svého lidu."
 bp2_yearly.6060.t: "Studium věčnosti"
 bp2_yearly.6060.desc: "Naše ubohé [ROOT.Char.GetCulture.Custom('CZ_Adjective_ee')|l] obřady, náš způsob vyznávání víry [ROOT.Char.GetFaith.GetName]... nejsme snad jen děti naříkající v temnotě?\n\nKdyž [clergy_representative.GetFirstName] a [clergy_representative.GetFaith.PriestNeuterPlural|l] z našich řad malicherně prosí o přízeň, kterou jim může projevit [ROOT.Char.GetFaith.HighGodName], v duchu znovu slyším šustění [advanced_culture.Custom('CZ_Adjective_yych')|l] posvátných rouch a podléhám pravdivosti jejich učení. Toužím po učeneckých síních [childhood_location.GetCounty.GetTitle.Custom('CZ_LandedNameNoTier_G')] a po tajemstvích, která se tam odhalují.\n\n"
 bp2_yearly.6060.same_faith: "[advanced_culture.GetCollectiveNounNoTooltip|U] nacházejí svou víru ve velkoleposti, kterou upevňují studiem. Víra se dostává od nejvýše postavených až k nejnižším a na rozdíl od našich pověr zůstává neměnná."
 bp2_yearly.6060.different_faith: "Spoléhají všechny duše panství, v němž je málo chrámů a ještě méně vzdělanosti... na má slova, aby poznaly pravdu, kterou hlásá [advanced_culture_faith.GetName]?"
 bp2_yearly.6060.a: "Jen pro tohle [Select_CString(ROOT.Char.IsFemale,'jsem žila','jsem žil')|l]. Hlásím se k vyznání [advanced_culture_faith.GetNameNoTooltip]."
 bp2_yearly.6060.a.tt: "Kdo jiný může propojit naše víry? A která jiná víra přinese do [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] duchovní řád a osvícení?"
 bp2_yearly.6060.b: "Víru je třeba budovat a uspořádat."
 bp2_yearly.6060.b.tt: "Napodobíme uspořádání cizích vyznání, jejich cestu k nebesům i pronikání do všech oblastí každodenního života."
 bp2_yearly.6060.b.conversion_bonus: "Rychlost postupu [Concept('convert_county','obracení hrabství')|E]: #P +[EmptyScope.ScriptValue('zealous_proselytizer_percentage')|0]%#!"
 bp2_yearly.6060.c: "Učenost je zdrojem veškeré síly."
 bp2_yearly.6060.c.tt: "Pokud budu [Select_CString(ROOT.Char.IsFemale,'nejvzdělanější a nejmoudřejší ze všech, plně oddaná','nejvzdělanější a nejmoudřejší ze všech, plně oddaný')|l] svému cíli, mé panství jistě bude vzkvétat!"
 bp2_yearly.6060.c.nerd: "Všechny tvé dovednosti kromě [Concept('learning','učenosti')|E] se sníží o #negative_value 2#!"
 bp2_yearly.6060.c.tribal_warning: "@warning_icon! #X $building_type_generic_university$ budeš moci postavit teprve poté, co opustíš [Concept('tribal_government','kmenovou vládu')|E]#!"
 bp2_yearly.6060.d: "Přesto mám pocit... že pravými věřícími jsme #EMP my#!!"
 bp2_yearly.6060.d.tt: "Naše pravda není okázalá ani složitá. A právě v tom je spravedlnost."
 fervor_gain_reformer_converts: "Proslulý reformátor přestoupil na víru"
 fervor_gain_reformer_champions_faith: "Vládce vdechuje této [Concept('faith','víře')|E] nový život"
 fervor_loss_reformer_rejects_faith: "Proslulý zastánce jiné [Concept('faithpossessive','víry')|E] ji odsoudil"
 adapted_rituals_modifier: "Převzaté cizí obřady"
 adapted_rituals_modifier_desc: "Staví se chrámy po cizím vzoru a zavádějí se cizí obřady. Lidé si říkají, zda je této postavě všechno svaté... nebo vůbec nic."
 court_of_scholars_modifier: "Dvůr učenců"
 court_of_scholars_modifier_desc: "Tato postava podporuje vzdělance i podivíny a vládne lidu, který se rychle proměňuje."
 bp2_yearly.6070.t: "Kam se dívá celý svět"
 bp2_yearly.6070.desc: "„Dlouho [Select_CString(foreign_official.IsFemale,'jsem sloužila','jsem sloužil')|l] [advanced_court_owner.Custom('CZ_TitledFirstName_D')], [Select_CString(advanced_court_owner.IsFemale,'největší představitelce','největšímu představiteli')|l] [advanced_culture.Custom('CZ_Adjective_ee')|l] kultury, [Select_CString(advanced_court_owner.IsFemale,'jakou','jakého')|l] svět zná,“ prohlašuje [foreign_official.GetName], údajně [Select_CString(foreign_official.IsFemale,'úřednice','úředník')|l] [advanced_court_owner.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')].\n\n„Poezie moci, móda, která oslňuje svět, dvorské tance, odznaky a všechno ostatní — toužíš také po nejvyšší kultuře, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]? Mohu ti pomoci. Vím, kde se skrývá #EMP nenapodobitelné#! bohatství.“\n\nMé reformní snahy lákají tyhle bezskrupulózní bytosti s podobnými ambicemi. V mém zájmu o změnu vidí... příležitost, po níž se lačně vrhají."
 bp2_yearly.6070.a: "Raději se naučím, jak vládne [advanced_court_owner.GetTitleAsNameNoTooltip]."
 bp2_yearly.6070.a.tt: "Nezajímají mě prostředky okázalosti, ale prostředky civilizace."
 bp2_yearly.6070.b: "Přines nám civilizované mravy a nádherné oděvy."
 bp2_yearly.6070.b.tt: "Za nejvybranější [advanced_culture.Custom('CZ_AdjectiveNoTooltip_ee')|l] šaty zaplatím nejvyšší cenu! Bez ohledu na jejich... původ..."
 bp2_yearly.6070.artifact_warning: "@warning_icon! #X [advanced_court_owner.GetTitledFirstName|U] je možná bude chtít zpět#!"
 bp2_yearly.6070.change_clothes: "Někteří tví poddaní se budou po celou dobu tvé vlády oblékat jako [advanced_culture.GetCollectiveNoun]"
 bp2_yearly.6070.change_clothes_heir: "Někteří tví poddaní se budou oblékat jako [advanced_culture.GetCollectiveNoun], dokud budeš vládnout ty nebo tvůj současný [Concept('primary_heir','hlavní dědic')|E]"
 bp2_yearly.6070.c: "Jazyk moci je nejdůležitější ozdobou."
 bp2_yearly.6070.c.tt: "Pokud skutečně ovládnu jazyk „[advanced_culture.GetLanguage.GetNameNoTooltip]“, budu jim [Select_CString(ROOT.Char.IsFemale,'rovna','roven')|l] i bez parády."
 bp2_yearly.6070.court_language_discount: "Změna [Concept('court_language','dvorního jazyka')|E] tě bude stát podstatně méně [Concept('prestige','prestiže')|E]"
 bp2_yearly.6070.d: "Ty [advanced_culture.Custom('CZ_AdjectiveNoTooltip_yy')|l] odporný hmyze!"
 bp2_yearly.6070.d.tt: "Opravdu mě mají za [Select_CString(ROOT.Char.IsFemale,'příbuznou','příbuzného')|l] toho červa? Když z [Select_CString(foreign_official.IsFemale,'ní','něj')|l] udělám odstrašující příklad, snad je to přejde!"
 artifact_admired_culture_regalia: "Okázalé [advanced_court_owner.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_ee')|l] regálie"
 artifact_famed_culture_regalia_desc: "Honosný soubor „dovezených“ [advanced_culture.Custom('CZ_Adjective_yych')|l] ozdob té kvality, jakou by si [advanced_court_owner.GetTitleAsNameNoTooltip] [Select_CString(advanced_court_owner.IsFemale,'mohla','mohl')|l] objednat u svých nejzručnějších řemeslníků."
 artifact_admired_culture_crown: "Koruna [root_scope.Custom('CZ_FirstNameNoTooltip_G')]"
 artifact_famed_culture_crown_desc: "Majestátní koruna v [advanced_culture.Custom('CZ_Adjective_eem')|l] stylu, jaký [root_scope.GetCulture.Custom('CZ_Adjective_ee')|l] země dosud nepoznaly. Tato zlatá koruna nejasného původu urazila dlouhou cestu, než spočinula na hlavě [Select_CString(root_scope.IsFemale,'vizionářské','vizionářského')|l] [root_scope.Custom('CZ_TitleAsNameNoTooltip_G')]."
 artifact_advanced_culture_treatise: "[root_scope.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_yy')|U] traktát v jazyce [advanced_culture.GetLanguage.GetNameNoTooltip]"
 bp2_yearly.6080.t: "[ROOT.Char.GetCulture.Custom('CZ_AdjectiveNoTooltip_aa')|U] krev"
 bp2_yearly.6080.desc: "Zástup [advanced_culture.Custom('CZ_Adjective_yych')|l] žoldnéřů pod vedením dvou zkušených velitelů mi nabízí službu palácové stráže i výcvik mého vojska. Čekají před branami. Uvnitř na mě křičí [angry_vassal.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('angry_vassal'))|l].\n\n„#EMP [Select_CString(ROOT.Char.IsFemale,'Zrádná','Zrádný')|U] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]! Ať ti [advanced_culture.GetCollectiveNounNoTooltip] hodí kost, pse!#! Chceš být [Select_CString(ROOT.Char.IsFemale,'tyrankou','tyranem')|l], [Select_CString(ROOT.Char.IsFemale,'jakou by','jakým by')|l] se nikdo z [ROOT.Char.GetCulture.Custom('CZ_Adjective_ee')|l] kultury nikdy nestal, a vládnout cizími zákony a cizí mocí? Naše zvyky pro tebe přestaly platit?!“\n\n„Pak ani naše přísahy věrnosti nemají cenu!“ prohlásí [Select_CString(angry_vassal.IsFemale,'obklopena','obklopen')|l] ozbrojeným doprovodem. „My vazalové jsme zajedno. Pokud [advanced_culture.GetCollectiveNounNoTooltip] neodejdou, naše pouta k tobě jsou bezcenná!“"
 bp2_yearly.6080.a: "Mohu je usadit jako pokojné přistěhovalce?"
 bp2_yearly.6080.a.tt: "Šlechtu jistě přesvědčím, aby si příliš nestěžovala, pokud bude nahrazen pouze prostý lid..."
 bp2_yearly.6080.pop_opinion_modifier: "Každé [Concept('county','hrabství')|E] téhož [Concept('duchy','vévodství')|E], které nemá [advanced_culture.Custom('CZ_Adjective_ou')|l] kulturu, získá #N [GetModifier('forcible_resettlement_modifier').GetNameWithTooltip]#!"
 bp2_yearly.6080.b: "Vůdce vzpoury! #EMP Chyťte [Select_CString(angry_vassal.IsFemale,'ji','ho')|l]!#!"
 bp2_yearly.6080.b.tt: "Uvidíme, jak se ostatní milovníci tradic dokážou zorganizovat bez [Select_CString(angry_vassal.IsFemale,'ní','něj')|l]!"
 bp2_yearly.6080.b.success: "Odpůrce je zajat"
 bp2_yearly.6080.b.failure: "[angry_vassal.GetFirstNameNoTooltip|U] si probojuje cestu ven"
 bp2_yearly.6080.add_both_courtiers: "[foreign_mercenary_1.GetName|U] a [foreign_mercenary_2.GetName] se připojí k tvému dvoru"
 bp2_yearly.6080.c: "Všechna stará pouta pozbývají platnosti. Nic mě nezastaví."
 bp2_yearly.6080.c.tt: "Náš lid se znovu rodí. Primitivní závazky a staré dluhy už nic neznamenají. Záleží jen na dokončení mých reforem."
 bp2_yearly.6080.hook_removal_vassals: "[Concept('vassals','Vazalové')|EU] ztratí všechny [Concept('hooks','páky')|E], které na tebe mají"
 bp2_yearly.6080.hook_removal: "@warning_icon! #X Ztratíš všechny [Concept('hooks','páky')|E], které máš na [Concept('vassals','vazaly')|E]#!"
 bp2_yearly.6080.truce_removal: "@warning_icon! #X Všechna [Concept('truces','příměří')|E] mezi tebou a tvými [Concept('vassals','vazaly')|E] se ruší#!"
 bp2_yearly.6080.d: "Krev mého lidu nesmí být prolita."
 bp2_yearly.6080.d.tt: "Náš lid a společný cíl nás musí vést a sjednocovat. Musíme si být navzájem oddáni."
 elite_foreign_guard_modifier: "Kasárna elitní stráže"
 elite_foreign_guard_modifier_desc: "Sídlí zde vysoce disciplinovaní bojovníci, většinou z cizích zemí a národů. Cvičí se v boji a čekají na povolání od lenního pána."
 custom.every_non_advanced_culture_vassal: "Každý [Concept('vassal','vazal')|E], který nemá [advanced_culture.Custom('CZ_Adjective_ou')|l] kulturu"
 custom.every_non_advanced_culture_unhooked_no_truce_vassal: "Každý [Concept('vassal','vazal')|E], který nemá [advanced_culture.Custom('CZ_Adjective_ou')|l] kulturu a s nímž nemáš [Concept('truce','příměří')|E] ani na něj [Concept('hook','páku')|E]"
 forcible_resettlement_modifier: "Nucené přesídlení"
 forcible_resettlement_modifier_desc: "Lidé vytlačení přistěhovalci vyspělejší kultury zde rozdmýchávají prudkou zášť."
 common_noble_cause_modifier: "Společný cíl šlechty"
 common_noble_cause_modifier_desc: "Tato postava povzbuzuje své soukmenovce připomínáním společného cíle."
 cultural_acceptance_learning_from_culture: "Mezi těmito [Concept('cultures','kulturami')|E] byla předána [Concept('innovation','inovace')|E]"
 bp2_yearly.6090.t: "Obnovené dědictví"
 bp2_yearly.6090.desc: "[Select_CString(ROOT.Char.IsFemale,'Hnala','Hnal')|U] jsem se za uznáním [advanced_culture.Custom('CZ_Adjective_ee')|l] kultury, [Select_CString(ROOT.Char.IsFemale,'toužila','toužil')|l] po cizí nádheře a kvůli svým snům ze sebe [Select_CString(ROOT.Char.IsFemale,'udělala hlupačku','udělal hlupáka')|l]. S tím je konec.\n\n"
 bp2_yearly.6090.burn_letters: "Dary, které mi [advanced_court_owner.GetTitledFirstName] posílá, hoří, zatímco má [ROOT.Char.GetCulture.Custom('CZ_Adjective_aa')|l] šlechta oslavuje mé jméno.\n\n"
 bp2_yearly.6090.burn_else: "Většina mých [advanced_culture.Custom('CZ_AdjectiveNoTooltip_yych')|l] ozdob hoří, zatímco má [ROOT.Char.GetCulture.Custom('CZ_Adjective_aa')|l] šlechta oslavuje mé jméno.\n\n"
 bp2_yearly.6090.reaffirm_social: "Když mocichtiví [advanced_culture.GetCollectiveNounNoTooltip] zneužívali mé chamtivosti, moji vazalové mě nabádali k opatrnosti."
 bp2_yearly.6090.reaffirm_realm: "Zatímco [Select_CString(ROOT.Char.IsFemale,'jsem rozvracela','jsem rozvracel')|l] naše země, oni stavěli krásné síně a znamenití $knight_culture_player_plural_no_tooltip_lowercase$ dostávali výzbroj."
 bp2_yearly.6090.reaffirm_ritual: "I když [Select_CString(ROOT.Char.IsFemale,'jsem pohrdala','jsem pohrdal')|l] jejich dávnou vírou, stále se za mě modlili."
 bp2_yearly.6090.reaffirm_maa: "Riskovali čest i životy, aby zabránili tomu, že vydám [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_A')] cizincům."
 bp2_yearly.6090.outro: "\n\nMé mládí v [childhood_location.GetCounty.GetTitle.Custom('CZ_LandedNameNoTier_L')] mě svedlo na scestí. [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|U] jsou můj lid. A žádné „civilizování“ nepotřebují."
 bp2_yearly.6090.a.bow: "Celý svět se před námi musí sklonit."
 bp2_yearly.6090.a.strength: "Celý svět musí pocítit naši sílu."
 bp2_yearly.6090.a.governed: "Celý svět musí dbát naší moudrosti."
 bp2_yearly.6090.a.zeal: "Celý svět musí poznat naši horlivost."
 bp2_yearly.6090.a.kin: "Celý svět se musí zodpovídat naší rodině."
 bp2_yearly.6090.a.virtue: "Celý svět musí žasnout nad našimi ctnostmi."
 bp2_yearly.6090.a.tt: "Obnovme dávná pouta v plameni, který pohltí každého, kdo se odváží pochybovat o lidu zvaném [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]!"
 bp2_yearly.6090.tribal_invasion: "[Concept('casus_belli','Casus belli')|EU] Invaze můžeš použít ještě jednou"
 bp2_yearly.6090.non_tribal_invasion: "[Concept('casus_belli','Casus belli')|EU] Invaze můžeš použít jednou"
 bp2_yearly.6090.no_invasion_req: "Tvůj [Concept('casus_belli','casus belli')|E] Invaze nevyžaduje žádnou [Concept('prestige_level','úroveň slávy')|E]"
 bp2_yearly.6090.b: "Musíme navždy bránit svou zem a své rodiny."
 bp2_yearly.6090.b.tt: "Při pomyšlení, že ztratíme všechno, co máme, se mi svírá srdce. Buďme pevní a oddaní. To se nikdy nesmí stát."
 bp2_yearly.6090.traditionalist_traditions: "Získáš slevy na související [Concept('traditions','tradice')|E]"
 a_cultures_great_defender_modifier: "Největší ochránce lidu"
 a_cultures_great_defender_modifier_desc: "Tato postava překonala tíživé pochybnosti a stala se proslulým hrdinou svého lidu a oddaným zastáncem vlasti."
 inspired_defenders_modifier: "Odhodlání k poslušnosti i odporu"
 inspired_defenders_modifier_desc: "Obyvatelé této země urputně chrání to, co jim patří, a horlivě se stavějí na obranu svého pána."
 uniter_and_conqueror_modifier: "Sjednotitel a dobyvatel"
 uniter_and_conqueror_modifier_desc: "Tento vizionářský vůdce prověřoval sílu svého lidu, dokud velikost společného osudu nebyla všem zřejmá."
 cultural_acceptance_loss_rejected_influence: "Reformátor odmítl cizí kulturu a zvolil izolaci"
 bp2_yearly.6091.t: "Nezměnitelný lid"
 bp2_yearly.6091: "Mé neúspěšné reformy zanechaly hluboké stopy jak na dvořanech v honosných síních, tak na vesnické cháse.\n\nOtřesy zatvrdily srdce všech příslušníků [ROOT.Char.GetCulture.Custom('CZ_Adjective_ee')|l] kultury vůči cizincům. Vládne podezíravost a nepřátelství, ale také láska ke starým tradicím, radostné slavnosti a hrdý válečnický duch.\n\nMoji rádci mi tlumočí naděje lidu: jeho vůdci, včetně mě, se v příštích letech mají obrátit k tradici, víře "
 bp2_yearly.6091.dominance: "a osudu svého lidu."
 bp2_yearly.6091.defense: "a obraně svého lidu."
 bp2_yearly.6091.a: "Oslavujme všechno, čím jsme."
 bp2_yearly.6091.a.tt: "...a nic jiného."
 bp2_yearly.6091.aggressive: "Tvá [Concept('culture','kultura')|E] nyní platí méně [Concept('prestige','prestiže')|E] za tradice [GetCultureTradition('tradition_ruling_caste').GetName], [GetCultureTradition('tradition_hereditary_hierarchy').GetName], [GetCultureTradition('tradition_staunch_traditionalists').GetName], [GetCultureTradition('tradition_zealous_people').GetName], [GetCultureTradition('tradition_faith_bound').GetName] a [GetCultureTradition('tradition_warrior_culture').GetName]"
 bp2_yearly.6091.defensive: "Tvá [Concept('culture','kultura')|E] nyní platí méně [Concept('prestige','prestiže')|E] za tradice [GetCultureTradition('tradition_isolationist').GetName], [GetCultureTradition('tradition_hereditary_hierarchy').GetName], [GetCultureTradition('tradition_tribe_unity').GetName], [GetCultureTradition('tradition_staunch_traditionalists').GetName], [GetCultureTradition('tradition_stalwart_defenders').GetName], [GetCultureTradition('tradition_zealous_people').GetName] a [GetCultureTradition('tradition_faith_bound').GetName]"
 bp2_yearly.6100.t: "Můj lid — [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] — se znovu rodí!"
 bp2_yearly.6100.desc: "Roky posměchu a nedůvěry, obětí a otřesů... to všechno vedlo sem.\n\nZatímco se mi moji poddaní, [ROOT.Char.GetCulture.GetCollectiveNoun], klanějí, hřmotně zaznívají poslední slova největšího reformního ediktu. Budeme vládnout novým způsobem, inspirovaným [advanced_culture.Custom('CZ_Adjective_ou')|l] kulturou. Budeme stavět, dokud se nevyrovnáme nádheře [childhood_location.GetCounty.GetTitle.Custom('CZ_LandedNameNoTier_G')]. A každé [ROOT.Char.GetCulture.Custom('CZ_AdjectiveNoTooltip_ee')|l] dítě si osvojí dovednosti a pozná zázraky, které [Select_CString(ROOT.Char.IsFemale,'jsem poznala','jsem poznal')|l] v mládí.\n\nTolik se toho změnilo!"
 bp2_yearly.6100.reform_court: "Můj dvůr ožívá novou elegancí."
 bp2_yearly.6100.reform_maa: "Železné zbraně a slova zákona chrání mou vládu."
 bp2_yearly.6100.reform_faith: "Má víra získala jasný cíl, vytříbenost a vznešenost."
 bp2_yearly.6100.reform_realm: "Obchod vzkvétá, sídla rostou a znovuzrození [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] každým dnem láká další přistěhovalce."
 bp2_yearly.6100.outro: "\n\nStále patřím k [ROOT.Char.GetCulture.Custom('CZ_AdjectiveNoTooltip_ee')|l] kultuře. Jsem ale [Select_CString(ROOT.Char.IsFemale,'její novou představitelkou','jejím novým představitelem')|l] — nová [ROOT.Char.GetCulture.Custom('CZ_AdjectiveNoTooltip_aa')|l] generace."
 bp2_yearly.6100.a: "Tohle je můj odkaz — musí být úplný!"
 bp2_yearly.6100.a.tt: "Větší změny jsou nákladné a drobné pozemkové držitele nebude snadné přesvědčit... ale [advanced_culture.GetCollectiveNounNoTooltip] nás mohou naučit ještě víc!"
 bp2_yearly.6100.b: "[Select_CString(ROOT.Char.IsFemale,'Dokázala','Dokázal')|U] jsem to!"
 bp2_yearly.6100.b.tt: "Můj lid už není třeba pobízet dál. Už [Select_CString(ROOT.Char.IsFemale,'jsem ho dovedla','jsem ho dovedl')|l] na práh nového věku."
 cultural_acceptance_gain_completed_reform: "Vládce zcela proměnil své panství po vzoru jiné kultury"
 bp2_yearly.6100.2_more_innovations: "[root_scope.GetCulture.Custom('CZ_Adjective_aa')|U] [Concept('culture','kultura')|E] získá #high 2#! další [Concept('innovations','inovace')|E] od [advanced_culture.Custom('CZ_Adjective_ee')|l] kultury"
 bp2_yearly.6100.1_more_innovation: "[root_scope.GetCulture.Custom('CZ_Adjective_aa')|U] [Concept('culture','kultura')|E] získá #high 1#! další [Concept('innovation','inovaci')|E] od [advanced_culture.Custom('CZ_Adjective_ee')|l] kultury"
 bp2_yearly.6100.gained_2_innovations: "[root_scope.GetCulture.Custom('CZ_Adjective_aa')|U] [Concept('culture','kultura')|E] získala #high 2#! náhodné [Concept('innovations','inovace')|E] od [advanced_culture.Custom('CZ_Adjective_ee')|l] kultury"
 bp2_yearly.6100.gained_1_innovation: "[root_scope.GetCulture.Custom('CZ_Adjective_aa')|U] [Concept('culture','kultura')|E] získala #high 1#! náhodnou [Concept('innovation','inovaci')|E] od [advanced_culture.Custom('CZ_Adjective_ee')|l] kultury"
 flourishing_settlements_modifier: "Vzkvétající sídla"
 flourishing_settlements_modifier_desc: "Zavedení nových postupů a technologií přineslo místním obyvatelům prosperitu i vděčnost."
 bp2_yearly.6110.t: "Cizí reformy"
 bp2_yearly.6110.realm: "Pozoruji sloužícího chlapce, jak přikládá do ohně. Jeho světlo sotva vydrží a proti temnotě dnešní noci je žalostně slabé.\n\nMožná je chyba už v samotném způsobu, jakým žijeme my, [ROOT.Char.GetCulture.GetCollectiveNoun]. Jak mocný protivník! Mám v sobě ještě dost odhodlání, abych [Select_CString(ROOT.Char.IsFemale,'čelila','čelil')|l] [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_D')] jako celku?\n\nPřemýšlím o [advanced_culture.Custom('CZ_Adjective_eem')|l] způsobu života a vlády. Možná stojí za to některé jeho části prosadit i u mého lidu?"
 bp2_yearly.6110.combat: "Pozoruji, jak se moji domácí $knight_culture_player_plural_no_tooltip_lowercase$ povalují na odpoledním slunci a baví se vyprávěním o svých činech.\n\nMají za sebou vítězství a tradiční [ROOT.Char.GetCulture.Custom('CZ_Adjective_yy')|l] způsob boje ovládají dobře. Přesto... přemýšlím o dovednostech a taktice [advanced_culture.Custom('CZ_Adjective_yych')|l] ozbrojenců. Neměli by si moji bojovníci osvojit jejich válečné postupy?\n\nNebo snad máme přijmout jinou podobu [advanced_culture.Custom('CZ_AdjectiveNoTooltip_eeho')|l] vlivu?"
 bp2_yearly.6110.social: "Tržiště. Do uší mi zní jazyk „[ROOT.Char.GetCulture.GetLanguage.GetName]“ v osobité podobě, jakou má v [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.Custom('CZ_LandedNameNoTier_L')]. [ROOT.Char.GetCulture.GetCollectiveNoun|U] pokračují v každodenní dřině, ačkoli ve mně vidí někoho výjimečného.\n\nVím, že jsem jako oni, a přece #EMP [Select_CString(ROOT.Char.IsFemale,'jiná','jiný')|l]#!. Rozdíl je mezi nimi a těmi, jimž se říká [advanced_culture.GetCollectiveNoun].\n\nMá se to rychle změnit? Ačkoli [Select_CString(ROOT.Char.IsFemale,'jsem mezi nimi nevyrostla','jsem mezi nimi nevyrostl')|l], na mém rozmaru závisí budoucnost každého člověka [ROOT.Char.GetCulture.Custom('CZ_AdjectiveNoTooltip_ee')|l] kultury. Prvky [advanced_culture.Custom('CZ_AdjectiveNoTooltip_ee')|l] kultury mohu zavádět podle své vůle."
 bp2_yearly.6110.ritual: "Pravidla cizích bohů se prý liší stejně jako pravidla lidí. V různých krajích mají lidé zálibu v různých věcech a jejich bohové je podporují, ať už jsou dobré, nebo špatné.\n\nNa našem posvátném místě, zvaném [ROOT.Char.GetFaith.HouseOfWorship], vládne ticho a rozjímání.\n\nUrazilo by změněné chování mého lidu dávné předky, jimž vděčíme za dědictví „[ROOT.Char.GetCulture.GetHeritage.GetName]“? Vezme si to tak zle [ROOT.Char.GetFaith.HighGodName]? A která z [advanced_culture.Custom('CZ_Adjective_yych')|l] zvyklostí nejlépe sloužila lidem, kteří mě vychovávali?"
 bp2_yearly.6110.regional: "Přecházím téměř prázdným trůnním sálem a zápolím se vzpomínkami i sny.\n\nPromítám ulice [childhood_location.GetCounty.GetTitle.Custom('CZ_LandedNameNoTier_G')] do budoucí podoby [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.Custom('CZ_LandedNameNoTier_G')], vidím [advanced_culture.Custom('CZ_Adjective_ou')|l] hostinu na [ROOT.Char.GetCulture.Custom('CZ_Adjective_eem')|l] stole a vedu nově uspořádané družiny za jejich prvními vítězstvími.\n\nČím se [advanced_culture.GetCollectiveNounNoTooltip] mezi ostatními národy tak vyjímají? Takový zvyk lze převzít, ale vše musí začít u mého dvora a u mě."
 bp2_yearly.6110.a: "[considered_tradition_1.GetNameNoTooltip|U]"
 bp2_yearly.6110.b: "[considered_tradition_2.GetNameNoTooltip|U]"
 bp2_yearly.6110.c: "[considered_tradition_3.GetNameNoTooltip|U]"
 bp2_yearly.6110.d: "[considered_tradition_4.GetNameNoTooltip|U]"
 bp2_yearly.6110.e: "Raději zvážím jiné změny..."
 bp2_yearly.6110.e.tt: "Prostě si neumím představit, že [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] přijmou tyto zvyklosti."
 cultural_acceptance_gain_adapted_tradition: "Byla převzata [Concept('tradition','tradice')|E]"
 introduced_foreign_custom_modifier: "Zavedení cizího zvyku"
 introduced_foreign_custom_modifier_desc: "Tato postava všem vnutila cizí zvyklost, aniž by svému lidu poskytla čas na přizpůsobení."
 repeated_foreign_reforms_modifier: "Opakované cizí reformy"
 repeated_foreign_reforms_modifier_desc: "Lidé této kultury se bouří proti útokům na svůj způsob života."
 assault_on_tradition_modifier: "Útok na tradici"
 assault_on_tradition_modifier_desc: "Tato postava během jediného života změnila svou kulturu k nepoznání."
 bp2_yearly.6120.t: "Zkouška pout"
 bp2_yearly.6120.desc: "[hostage.GetName|U], mé rukojmí, se neklidně vrtí mezi úzkostí a nadějí. [hostage_giver.GetTitledFirstName|U], [hostage.Custom2('RelationToMeShort', SCOPE.sC('hostage_giver'))|l], je nablízku, zde [CZPrepV(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetCurrentLocation,'L')], a od posledního takového setkání uplynula dlouhá doba.\n\n[hostage.Custom('GirlBoy')|U] teď žije se mnou. S [hostage.Custom2('CZ_RelationToMeShort_I', SCOPE.sC('hostage_giver'))|l] mám dohodu. [hostage.GetFirstNameNoTooltip|U] je v mé moci a má být [Select_CString(hostage.IsFemale,'věrná','věrný')|l] #EMP mně#!. Dovolit [Select_CString(hostage.IsFemale,'jí','mu')|l] znovu rozdmýchat lásku k rodině je riskantní...\n\n„Prosím,“ žadoní. „Prosím, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')], tak moc mi chybí [hostage.Custom2('RelationToMeShort', SCOPE.sC('hostage_giver'))|l]!“"
 bp2_yearly.6120.a: "Vychutnej si shledání. Je vzácné."
 bp2_yearly.6120.a.tt: "[hostage.Custom('GirlBoy')|U] přece stále patří k rodu „[hostage.GetDynastyHouseNameNoTooltip]“ a má právo na přízeň své rodiny."
 bp2_yearly.6120.b: "Za tak velkorysou laskavost očekávám odměnu!"
 bp2_yearly.6120.b.tt: "K čemu jinému jsou rukojmí než k takovým ústupkům?"
 bp2_yearly.6120.hook: "Pokud [hostage_giver.GetShortUIName] [Select_CString(hostage_giver.IsLocalPlayer,'přijmeš','přijme')|l], získáš na [Select_CString(hostage_giver.IsFemale,'ni','něj')|l] [Concept('weak_hook','slabou páku')|E]"
 bp2_yearly.6120.hook_acceptance: "[Concept('personality','Osobnost')|EU] [hostage_giver.Custom('CZ_ShortUIName_G')] rozhoduje o přijetí"
 bp2_yearly.6120.c: "Pojď, promluvíme si [Select_CString(hostage_giver.IsFemale,'s ní','s ním')|l] #EMP společně#!."
 bp2_yearly.61020.c.tt: "Zastíním [Select_CString(hostage_giver.IsFemale,'tu nudnou patronku','toho nudného patrona')|l] a [Select_CString(hostage_giver.IsFemale,'její','jeho')|l] vlastní rodina dá přednost mé společnosti před tou [Select_CString(hostage_giver.IsFemale,'její','jeho')|l]!"
 bp2_yearly.6120.c.success: "Při setkání s [hostage_giver.Custom('CZ_FirstNameNoTooltip_I')] na sebe strhneš veškerou pozornost"
 bp2_yearly.6120.c.failure: "Budeš působit jako [Select_CString(ROOT.Char.IsFemale,'nesnesitelná dotěra','nesnesitelný dotěra')|l]"
 bp2_yearly.6120.d: "#EMP Ticho!#! Zasloužíš si pohlavek, [Select_CString(hostage.IsFemale,'děvče','chlapče')|l]!"
 bp2_yearly.6120.d.tt: "[hostage.GetFirstNameNoTooltip|U] patří ke mně, nikoli ke své rodině. Výprask to [Select_CString(hostage.IsFemale,'jí','mu')|l] připomene."
 bp2_yearly.6121.t: "Bez [ROOT.Char.Custom2('CZ_RelationToMeShort_G', SCOPE.sC('hostage'))|l]"
 bp2_yearly.6121.reunion: "Na tuhle chvíli [Select_CString(ROOT.Char.IsFemale,'jsem čekala','jsem čekal')|l]. Přede mnou [CZPrepV(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetCurrentLocation,'L')] stojí [hostage.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))|l], rukojmí zajišťující můj mír.\n\n„[hostage.Custom2('CZ_RelationToMeShort_V', ROOT.Char)|U]!“\n\nBěží mi do náruče a jako by nikdy [Select_CString(hostage.IsFemale,'neodešla','neodešel')|l]. Pevné objetí však prozrazuje, jak se [Select_CString(hostage.IsFemale,'dívce','chlapci')|l] stýská po domově.\n\n[warden.GetTitledFirstName|U] nám dovoluje trávit čas spolu, což je laskavé, ale stále to nestačí."
 bp2_yearly.6121.intrusion: "Přede mnou stojí [hostage.GetFirstName], po boku s [warden.Custom('CZ_TitledFirstName_I')]. Od chvíle, kdy jsem [Select_CString(hostage.IsFemale,'ji','ho')|l] [Select_CString(ROOT.Char.IsFemale,'poslala','poslal')|l] jako rukojmí pryč, [Select_CString(hostage.IsFemale,'se velmi změnila','se velmi změnil')|l], ale [Select_CString(hostage.IsFemale,'členku','člena')|l] rodu „[ROOT.Char.GetDynastyHouseName]“ poznám kdekoli! [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))|U] se nezapře.\n\nObejmu [Select_CString(hostage.IsFemale,'dívku','chlapce')|l]. Snaží se ovládnout, ale pevné objetí prozrazuje touhu po domově.\n\nPotom zasáhne [warden.GetTitledFirstNameNoTooltip], strhne pozornost na sebe a žvaní o našem shledání... i o zdejší úrodě [CZPrepV(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetCurrentLocation,'L')]? To sotva zajímá [ROOT.Char.Custom2('CZ_RelationToMeShort_A', SCOPE.sC('hostage'))|l].\n\nPřesto za svou rodinu děkuji. Kéž [ROOT.Char.GetFaith.HouseholdGodName] přijme mé díky."
 bp2_yearly.6121.hook: "„Přemýšlíš, jestli se shledáš s [ROOT.Char.Custom2('CZ_RelationToMeShort_I', SCOPE.sC('hostage'))|l], že?“ vemlouvá se [warden.GetTitledFirstName]. „S dítětem — [Select_CString(hostage.IsFemale,'dívkou','chlapcem')|l] jménem [hostage.GetFirstName] — které jsi tak štědře [Select_CString(ROOT.Char.IsFemale,'odevzdala','odevzdal')|l] ve jménu míru.“\n\n[warden.GetFirstNameNoTooltip|U] se zdá být [Select_CString(warden.IsFemale,'až příliš spokojená sama se sebou','až příliš spokojený sám se sebou')|l].\n\n„Dokud jsme spolu [CZPrepV(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetCurrentLocation,'L')], smíš se stýkat se svým rukojmím, přestože tím ohrožujeme naši dohodu...“\n\n„...pokud přísaháš, že tuto mou štědrost nezapomeneš.“"
 bp2_yearly.6121.forbidden: "„Opravdu sis [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')|l], že se budete moci stýkat jen proto, že ty a [hostage.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))|l], jste [Select_CString(ROOT.Char.IsFemale,Select_CString(hostage.IsFemale,'obě','oba'),'oba')|l] [CZPrepV(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetCurrentLocation,'L')]?“\n\n[warden.GetTitledFirstName|U] zavrtí hlavou.\n\n„Mé rukojmí má mnoho povinností. Po celou dobu platnosti dohody ostatně patří ke mně.“\n\nOpravdu [Select_CString(ROOT.Char.IsFemale,'jsem skoro nezahlédla','jsem skoro nezahlédl')|l] [Select_CString(hostage.IsFemale,'dívku','chlapce')|l], [Select_CString(hostage.IsFemale,'kterou','kterého')|l] [Select_CString(ROOT.Char.IsFemale,'jsem poslala','jsem poslal')|l] pryč..."
 bp2_yearly.6121.a: "„[hostage.Custom('CZ_FirstNameNoTooltip_V')|U]! Beru tě domů.“"
 bp2_yearly.6121.a.tt: "Čest ať jde k čertu! [hostage.GetFirstNameNoTooltip|U] patří ke mně! Ať si [warden.GetTitledFirstNameNoTooltip] dělá, co chce."
 bp2_yearly.6121.b: "„Velký dar, abys [Select_CString(hostage.IsFemale,'nemusela','nemusel')|l] hladovět!“"
 bp2_yearly.6121.b.tt: "„Jez! Jez! A dej všem najevo své postavení v rodu „[ROOT.Char.GetDynastyHouseNameNoTooltip]“.“"
 bp2_yearly.6121.c: "„[Select_CString(ROOT.Char.IsFemale,'Ráda','Rád')|U] tě vidím, [Select_CString(hostage.IsFemale,'děvče','chlapče')|l].“"
 bp2_yearly.6121.d: "Pro lásku k rodu „[ROOT.Char.GetDynastyHouseNameNoTooltip]“ udělám cokoli."
 bp2_yearly.6121.d.tt: "Nikoho z mé rodiny neopustí jeho vlastní příbuzní."
 bp2_yearly.6121.e: "Ke kradmému objetí nepotřebuji svolení..."
 bp2_yearly.6121.e.tt: "[warden.GetTitledFirstNameNoTooltip|U] mi přece nemůže zabránit, abych [Select_CString(ROOT.Char.IsFemale,'našla','našel')|l] [hostage.Custom('CZ_FirstNameNoTooltip_A')] a alespoň na chvíli si [Select_CString(hostage.IsFemale,'s ní','s ním')|l] [Select_CString(ROOT.Char.IsFemale,'promluvila','promluvil')|l]."
 bp2_yearly.6121.e.success: "Proklouzneš k objetí"
 bp2_yearly.6121.e.failure: "Přistihnou tě"
 bp2_yearly.6121.f: "Eh. Nestýská se mi [Select_CString(hostage.IsFemale,'po ní','po něm')|l]."
 bp2_yearly.6121.f.tt: "Jednou [Select_CString(hostage.IsFemale,'ji','ho')|l] zase uvidím... a to mi stačí."
 bp2_yearly.6122.t: "Nezapomenutí"
 bp2_yearly.6122.sneaking: "Zatímco moji spolčenci využili velké večeře, aby [hostage.Custom('CZ_FirstName_A')] odvedli od stráží [warden.Custom('CZ_TitledFirstName_G')], také [Select_CString(ROOT.Char.IsFemale,'jsem se přikradla','jsem se přikradl')|l] k rodinnému setkání.\n\nNa nedůstojné okolnosti sotva myslím. [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))|U] mě objímá, směje se mým vráskám a překypuje vzrušením.\n\nDlouho [Select_CString(hostage.IsFemale,'tu nebyla','tu nebyl')|l] a brzy se musí vrátit [Select_CString(warden.IsFemale,'ke své strážkyni','ke svému strážci')|l]. Takový je běh věcí, ale [Select_CString(warden.IsFemale,'tu přísnou paní','toho přísného pána')|l] [Select_CString(hostage.IsFemale,'jí','mu')|l] nezávidím."
 bp2_yearly.6122.rescue: "Jak [warden.GetTitledFirstName] [Select_CString(warden.IsFemale,'zuřila','zuřil')|l], když jsem [Select_CString(warden.IsFemale,'ji','ho')|l] [Select_CString(ROOT.Char.IsFemale,'vykázala','vykázal')|l] ze své přítomnosti a po mém boku přitom [Select_CString(hostage.IsFemale,'stála','stál')|l] [hostage.GetFirstName], dřívější rukojmí!\n\n„Vrátí se, [hostage.Custom2('CZ_RelationToMeShort_V', ROOT.Char)|l]?“ ptá se [hostage.Custom('GirlBoy')|l]. „[Select_CString(hostage.IsFemale,'Chtěla','Chtěl')|U] jsem domů, ale... nechci tě přimět k boji proti [warden.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_D')].“\n\nUjišťuji [hostage.Custom('CZ_FirstNameNoTooltip_A')], že to nehrozí, ale pravda je zřejmá.\n\n[Select_CString(ROOT.Char.IsFemale,'Porušila','Porušil')|U] jsem dohodu. Ať už to dopadne jakkoli, možná [Select_CString(ROOT.Char.IsFemale,'jsem obětovala','jsem obětoval')|l] mír."
 bp2_yearly.6122.c: "„Společně počkáme, co přijde.“"
 bp2_yearly.6122.c.tt: "Pokud přijde válka, alespoň [hostage.GetFirstNameNoTooltip] nebude mezi prvními oběťmi..."
 bp2_yearly.6123.t: "Potomek míru"
 bp2_yearly.6123.desc: "Shledání příbuzných je dojemná podívaná, na kterou [Select_CString(ROOT.Char.IsFemale,'ráda','rád')|l] dohlížím.\n\nDen pokročil a [hostage_giver.GetTitledFirstName] vypráví [hostage.Custom('CZ_FirstName_D')] několik moudrých podobenství. S dobrou náladou čekám, až se ke mně rukojmí vrátí.\n\n„Dobře se [Select_CString(hostage.IsFemale,'o ni','o něj')|l] starej,“ nabádá mě [hostage_giver.GetTitleAsNameNoTooltip], když odvádím [hostage_giver.Custom2('CZ_RelationToMeShort_A', SCOPE.sC('hostage'))|l]. „Chraň [Select_CString(hostage.IsFemale,'ji','ho')|l] před cizinci, jako jsem já.“"
 bp2_yearly.6123.stolen_hostage: "[hostage_giver.GetTitledFirstName|U] [Select_CString(hostage_giver.IsFemale,'udělala','udělal')|l] něco nemyslitelného! Na mou vstřícnost odpovídá zradou.\n\n[Select_CString(hostage_giver.IsFemale,'Ta bídnice','Ten bídák')|U] mě posílá pryč, zatímco [hostage.Custom('GirlBoy')|l] [hostage.GetFirstName], symbol našeho míru, stojí neprávem po [Select_CString(hostage_giver.IsFemale,'jejím','jeho')|l] boku... a já musím odejít. Nemám tu dost sil. Je to urážka! Je to hanebné!\n\nTeď se vracím domů, [Select_CString(ROOT.Char.IsFemale,'ponížená a opovrhovaná','ponížený a opovrhovaný')|l], bez jistoty, že nepřijde ještě něco horšího.\n\n[hostage_giver.GetFirstNameNoTooltip|U] bude této pošetilosti litovat stejně jako já lituji, že [Select_CString(ROOT.Char.IsFemale,'jsem rukojmí přivedla','jsem rukojmí přivedl')|l] k takové chamtivé zmiji..."
 bp2_yearly.6123.favor_accepted: "[Select_CString(ROOT.Char.IsFemale,'Odhadla','Odhadl')|U] jsem to správně... [hostage_giver.GetTitledFirstName] je [hostage_giver.Custom('WomanManPerson_GenderPreference')|l] a dá se přimět k ústupkům.\n\nKdyž si k sobě tiskne [hostage.Custom('CZ_FirstName_A')], je zcela zřejmé, jakou něhu vyhrazuje své rodině.\n\nS novým závazkem, který proti [Select_CString(hostage_giver.IsFemale,'ní','němu')|l] mohu využít, a tak milovaným rukojmím ve své péči nečekám, že by [hostage_giver.GetTitleAsNameNoTooltip] v příštích dnech [Select_CString(hostage_giver.IsFemale,'představovala','představoval')|l] hrozbu."
 bp2_yearly.6123.sneaker: "[hostage_giver.GetTitledFirstName|U], ta bezectná krysa, zřejmě nerespektuje mou moc nad [hostage.GetFirstName], [hostage_giver.Custom2('CZ_RelationToMeShort_I', SCOPE.sC('hostage'))|l].\n\nPopírá, že by [Select_CString(hostage_giver.IsFemale,'poslala','poslal')|l] lstivé služebníky odvést [Select_CString(hostage.IsFemale,'dívku','chlapce')|l] od mého pečlivě střeženého stolu. Vím ale, že usiluje jen o porušení našich dohod.\n\n„Lži!“ protestuje.\n\nDokud žije na mém dvoře, [hostage.GetFirstNameNoTooltip] se #EMP musí#! vždy držet daleko od [hostage_giver.Custom('CZ_TitleAsNameNoTooltip_G')]."
 bp2_yearly.6123.forbidden_desc: "Ačkoli si myslím, že to [Select_CString(hostage_giver.IsFemale,'ji','ho')|l] mrzí, [hostage_giver.GetTitledFirstName] [Select_CString(hostage_giver.IsFemale,'respektovala','respektoval')|l] mé rozhodnutí o tom, zda se smí setkat s [hostage_giver.Custom2('CZ_RelationToMeShort_I', SCOPE.sC('hostage'))|l].\n\n„Po [Select_CString(hostage.IsFemale,'děvčeti','chlapci')|l] se mi sotva stýská,“ tvrdí. „Skoro [Select_CString(hostage_giver.IsFemale,'jsem ráda','jsem rád')|l], že musíš ještě nějaký čas snášet tu pošetilost.“\n\nTak to musí být. Kromě toho... je dobré podrobit zkoušce někoho, kdo o sobě říká, že je [hostage_giver.Custom('WomanManPerson_GenderPreference')|l], a zjistit, jak si stojí."
 bp2_yearly.6123.a: "Jsi [hostage_giver.Custom('WomanManPerson_GenderPreference')|l] — a rodina je pro tebe nade vše, že, [hostage_giver.Custom('CZ_FirstNameNoTooltip_V')]?"
 bp2_yearly.6123.return_hostage: "[hostage.GetShortUIName|U] [Select_CString(hostage.IsLocalPlayer,'už nejsi','už není')|l] tvým [Concept('hostage','rukojmím')|E]"
 bp2_yearly.6130.t: "V zajetí blízkosti"
 bp2_yearly.6130.desc.different_ages: "[kin.GetFirstName|U], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))|l], a rukojmí [hostage.GetName] k sobě přes věkový rozdíl mají stále blíž.\n\nStarší neochvějně chrání mladší dítě a dobře mu radí, jak se vyznat ve světě. Mladší naopak vždy dokáže vyloudit úsměv.\n\nPři pohledu na [Select_CString(kin.IsFemale,Select_CString(hostage.IsFemale,'tyto nečekané společnice','tyto nečekané společníky'),'tyto nečekané společníky')|l] se neubráním lítosti nad blížícím se odloučením. Jednou dohoda s rodinou [hostage.Custom('CZ_FirstNameNoTooltip_G')] skončí..."
 bp2_yearly.6130.desc: "[kin.GetFirstName|U], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))|l], a rukojmí [hostage.GetName] se zřejmě stávají [Select_CString(kin.IsFemale,Select_CString(hostage.IsFemale,'pevnými přítelkyněmi a důvěrnicemi','pevnými přáteli a důvěrníky'),'pevnými přáteli a důvěrníky')|l].\n\nKdykoli se [hostage.Custom('CZ_FirstNameNoTooltip_D')] stýská po domově, [kin.GetFirstNameNoTooltip] vždy dokáže zvednout náladu. Když naopak [ROOT.Char.Custom2('CZ_RelationToMeShort_A', SCOPE.sC('kin'))|l] tíží postavení, [hostage.GetFirstNameNoTooltip] pomáhá s povinnostmi, které na [Select_CString(kin.IsFemale,'ni','něj')|l] doléhají.\n\nKdyž vidím děti sdílet radost, je mi líto odloučení, které je čeká. Jednou dohoda s rodinou [hostage.Custom('CZ_FirstNameNoTooltip_G')] skončí..."
 bp2_yearly.6130.a: "„Přísahejte, že se budete vždy podporovat.“"
 bp2_yearly.6130.a.tt: "Pouto mezi našimi dvěma dvory... možná stojí za to o něj pečovat?"
 bp2_yearly.6130.b: "„Láska k rodině musí být nade vše!“"
 bp2_yearly.6130.b.tt: "Jdi si hrát s někým, kdo tu pro tebe vždy bude, [Select_CString(kin.IsFemale,'děvče','chlapče')|l]."
 bp2_yearly.6130.family_opinion: "[kin.GetShortUIName|U] [Select_CString(kin.IsLocalPlayer,'získáš','získá')|l] #P 30#! [Concept('opinion','mínění')|E] o své [Concept('close_family','blízké rodině')|E]"
 bp2_yearly.6130.alliance: "Pokud se [Select_CString(kin.IsFemale,Select_CString(hostage.IsFemale,'obě','oba'),'oba')|l] stanou [Concept('rulers',Select_CString(kin.IsFemale,Select_CString(hostage.IsFemale,'vládkyněmi','vládci'),'vládci'))|E], [kin.GetShortUIName] a [hostage.GetShortUIName] [Select_CString(kin.IsLocalPlayer,'můžete',Select_CString(hostage.IsLocalPlayer,'můžete','mohou'))|l] vyjednat [Concept('alliance','alianci')|E]"
 bp2_yearly.6140.t: "[Select_CString(And(kin.IsFemale,hostage.IsFemale),'Příliš mladé','Příliš mladí')|U] na přátelství"
 bp2_yearly.6140.desc: "Posvátné obřady zaujaly všechny vychovatele a [kin.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))|l], s rukojmím [hostage.Custom('CZ_Name_I')] dávají naplno průchod rostoucí nenávisti.\n\n„[kin.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))|U] je nejmocnější [ROOT.Char.GetTitleAsName] v celé zemi!“ syčí [kin.GetFirstNameNoTooltip]. „Jednou [Select_CString(ROOT.Char.IsFemale,'její','jeho')|l] zásluhou [home_court.GetPrimaryTitle.GetNameNoTier] vzplane a $knight_culture_player_no_tooltip_lowercase$ si pověsí tvou hlavu k sedlu!“\n\n„Kéž mě domů vezme [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))|l],“ odpovídá [hostage.GetFirstNameNoTooltip]. „Tam by ses mě [Select_CString(kin.IsFemale,'bála','bál')|l] urážet!“\n\nOdkdy [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))|l] takhle mluví? A ještě ke ctěnému hostu!"
 bp2_yearly.6140.a: "Soutěž zbystří rozum [ROOT.Char.Custom2('CZ_RelationToMeShort_G', SCOPE.sC('kin'))|l]."
 bp2_yearly.6140.a.tt: "Pokoř [Select_CString(hostage.IsFemale,'ji','ho')|l], [Select_CString(kin.IsFemale,'děvče','chlapče')|l]! [hostage.GetFirstNameNoTooltip|U] je [Select_CString(hostage.IsFemale,'nepřítelkyně, kterou','nepřítel, kterého')|l] máš přímo na dosah."
 bp2_yearly.6140.b: "Rukojmí si necháváme pro mír, ne pro sváry."
 bp2_yearly.6140.b.tt: "Raději se modlete #EMP proti#! stínání hlav, děti."
 bp2_yearly.6150.t: "Záruka míru promlouvá"
 bp2_yearly.6150.desc: "Jako [ROOT.Char.GetTitleAsName] přijímám žádosti a pořádám obřady. Přitom úředníky a rodinu obvykle doprovázejí shromáždění rukojmí.\n\nMé rukojmí [hostage.GetFirstName] z toho nemá radost.\n\n„Prosím, pořád na mě zírají, jako bych [Select_CString(hostage.IsFemale,'byla','byl')|l] nějaká trofej...“ stěžuje si, zatímco odcházejí poslední prosebníci.\n\n„Připadám si jako duch ztracený v záhrobí — [hostage.GetFaith.NegativeAfterLife]. Všichni na mě zírají... vědí, že sem nepatřím.“"
 bp2_yearly.6150.a: "Patříš k mé rodině. Postav se k ní."
 bp2_yearly.6150.a.tt: "Nemáš se čeho bát! Prakticky už patříš mezi nás."
 bp2_yearly.6150.b: "Asi se jdi učit k duchovním, kterým se říká [ROOT.Char.GetFaith.PriestNeuterPlural]..."
 bp2_yearly.6150.b.tt: "Svou velkolepost dokážu předvést i [Select_CString(ROOT.Char.IsFemale,'sama','sám')|l]. Mou první povinností vůči rukojmím je jejich výchova."
 bp2_yearly.6150.c: "Patříš mně a budu s tebou zacházet, jak uznám za vhodné."
 bp2_yearly.6150.c.tt: "Nemohu svému rukojmí dovolit, aby mi diktovalo, co mám dělat."
 hostages_accepted_into_family_modifier: "Přijetí rukojmí do rodiny"
 hostages_accepted_into_family_modifier_desc: "Laskavý a zdvořilý hostitel, který okázale zachází s rukojmími jako s příbuznými."
 eschews_flaunting_of_hostages_modifier: "Bez předvádění rukojmí"
 eschews_flaunting_of_hostages_modifier_desc: "Rukojmím této postavy se dostává péče a výchovy, nikoli veřejného vystavování."
 bp2_yearly.6150.family_opinion_hostage: "[hostage.GetShortUIName|U] [Select_CString(hostage.IsLocalPlayer,'získáš','získá')|l] #P 20#! [Concept('opinion','mínění')|E] o tvé [Concept('close_family','blízké rodině')|E]"
 bp2_yearly.6160.t: "Nejhorší z mých jezdců"
 bp2_yearly.6160.desc: "Mezi vzlykáním a lhaním konečně poznávám pravdu o včerejší noci.\n\n[kin.GetFirstName|U], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))|l], a rukojmí [hostage.GetFirstName] se [Select_CString(kin.IsFemale,Select_CString(hostage.IsFemale,'vykradly','vykradli'),'vykradli')|l] pod rouškou tmy. Zvědavost na svět za hranicemi mé domácnosti je zavedla do osady.\n\n[Select_CString(kin.IsFemale,Select_CString(hostage.IsFemale,'Obdivovaly','Obdivovali'),'Obdivovali')|U] koně místní rodiny, brzy je však někdo přistihl — a tak [Select_CString(kin.IsFemale,Select_CString(hostage.IsFemale,'ujely','ujeli'),'ujeli')|l] na ukradených ořích.\n\nNešikovné děti skončily v příkopu.\n\n„[hostage.GetFirstNameNoTooltip|U] mě k tomu [Select_CString(hostage.IsFemale,'přemluvila','přemluvil')|l]!“ vzlyká bolestí [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))|l], stejně žalostně jako vesničané nad svým nyní chromým koněm."
 bp2_yearly.6160.a: "Ochutnejte práci, abyste splatili své dluhy."
 bp2_yearly.6160.a.tt: "[Select_CString(And(kin.IsFemale,hostage.IsFemale),'Ty malé','Ti malí')|U] chtějí poznat prostý lid? Ať tedy nějaký čas pracují pro majitele koně."
 bp2_yearly.6160.b: "Ublížíš [ROOT.Char.Custom2('CZ_RelationToMeShort_D', SCOPE.sC('kin'))|l], rukojmí?! #EMP Táhni!#!"
 bp2_yearly.6160.b.tt: "Žádné příměří nestojí za to, aby mou rodinu ohrožovala přítomnost takové chátry!"
 bp2_yearly.6160.c: "#EMP Ach jo.#! Asi to zaplatím..."
 bp2_yearly.6160.d: "Vyléčit koně? Příliš snadné."
 bp2_yearly.6160.e: "Jsou to děti! To se stává."
 bp2_yearly.6160.e.tt: "Ať si [Select_CString(And(kin.IsFemale,hostage.IsFemale),'ty nezbednice','ti nezbedníci')|l] odpočinou. Žádný skandál se nekoná."
 labored_with_the_commons_modifier: "Práce s prostým lidem"
 labored_with_the_commons_modifier_desc: "Za chyby mládí přišla tvrdá práce mezi pacholky a chovateli koní."
 renowned_knowledge_of_horses_modifier: "Proslulé znalosti koní"
 renowned_knowledge_of_horses_modifier_desc: "Mnozí se obracejí na moudrost této postavy při léčení koní a posilování jejich zdraví."
 bp2_yearly.6200.t: "Kde [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] znají mír"
 bp2_yearly.6200.desc: "Rada plánuje obranu [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] a přivádějí ke mně rukojmí [hostage.Custom('CZ_Name_A')].\n\n„[Select_CString(ROOT.Char.IsFemale,'Vznešená','Vznešený')|U] [ROOT.Char.Custom('CZ_TitleAsName_V')], zacházíš se mnou dobře a spravedlivě. Když nám hrozí zkáza, je správné, aby v [home_court.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_L')], mé vlasti, [home_court.Custom('KnightCulturePluralNoTooltipLowercase')|l] zaháleli se svinutými prapory?“\n\nPoklekne.\n\n„Dovol mi odjet. Donesu naši prosbu o pomoc [home_court.Custom('CZ_TitledFirstName_D')]! Vždyť jsem [Select_CString(home_court.IsFemale,'její','jeho')|l] krev. Kvůli mně tě podpoří!“"
 bp2_yearly.6200.a: "Jdi a vrať se se železem."
 bp2_yearly.6200.a.tt: "Prosím, dokaž svou věrnost! Pomoz mi v této chvíli nouze!"
 bp2_yearly.6200.hostage_travel: "[hostage.GetShortUIName|U] [Select_CString(hostage.IsLocalPlayer,'odcestuješ','odcestuje')|l] do [home_court.GetCapitalLocation.GetTitle.Custom('CZ_LandedName_G')]"
 bp2_yearly.6200.hostage_warning: "@alert_icon! #alert_trial [hostage.GetShortUIName|U] [Select_CString(hostage.IsLocalPlayer,'možná přestaneš','možná přestane')|l] být tvým [Concept('hostage','rukojmím')|E]#!"
 bp2_yearly.6200.war_positive: "[home_court.GetShortUIName|U] ti [Select_CString(home_court.IsLocalPlayer,'můžeš','může')|l] pomoci ve [Concept('war','válce')|E]"
 bp2_yearly.6200.b: "Vezmi s sebou pěkný dar."
 bp2_yearly.6200.b.tt: "Štědrost probudí v [home_court.Custom('CZ_TitleAsNameNoTooltip_L')] chuť válčit."
 bp2_yearly.6200.c: "Vezmi s sebou [Select_CString(target_knight.IsFemale,'věrnou','věrného')|l] [target_knight.Custom('CZ_FirstNameNoTooltip_A')] a pospěš si!"
 bp2_yearly.6200.war_very_positive: "#P [home_court.GetShortUIName|U] ti ochotněji [Select_CString(home_court.IsLocalPlayer,'pomůžeš','pomůže')|l] ve [Concept('war','válce')|E]#!"
 bp2_yearly.6200.c.tt: "Spolehlivý doprovod... a někdo, kdo pohlídá, aby [hostage.GetFirstNameNoTooltip] [Select_CString(hostage.IsFemale,'nezapomněla','nezapomněl')|l] na mé zájmy."
 bp2_yearly.6200.hostage_positive: "#P [hostage.GetShortUIName|U] se s větší pravděpodobností [Select_CString(hostage.IsLocalPlayer,'vrátíš','vrátí')|l] k tvému [Concept('court','dvoru')|E]#!"
 bp2_yearly.6200.hostage_travel_knight: "[hostage.GetShortUIName|U] a [target_knight.GetShortUIName] [Select_CString(Or(hostage.IsLocalPlayer,target_knight.IsLocalPlayer),'odcestujete','odcestují')|l] do [home_court.GetCapitalLocation.GetTitle.Custom('CZ_LandedName_G')]"
 bp2_yearly.6200.imprison_warning: "@alert_icon! #alert_trial [target_knight.GetShortUIName|U] [Select_CString(target_knight.IsLocalPlayer,'můžeš být','může být')|l] [Select_CString(target_knight.IsFemale,'uvězněna','uvězněn')|l] [home_court.Custom('CZ_ShortUIName_I')]#!"
 bp2_yearly.6200.d: "Ne, nemohu dovolit rukojmí odejít."
 bp2_yearly.6200.d.tt: "Nemám záruku tvého návratu! Ani záruku, že [home_court.GetTitledFirstNameNoTooltip] raději nepodpoří mé nepřátele."
 bp2_yearly.6202.t: "[hostage.Custom2('AppropriateGreeting', ROOT.Char )|U]"
 bp2_yearly.6202.opening: "Jsem znovu v [home_court.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_L')]."
 bp2_yearly.6202.assembled_nobles: "Když [Select_CString(hostage.IsFemale,'jsem přednášela','jsem přednášel')|l] tvou prosbu, dvůr [home_court.Custom('CZ_TitleAsName_G')] zaplnili významní šlechtici.\n\n"
 bp2_yearly.6202.nostalgia: "Vánek šumí ve známých stromech. [Select_CString(hostage.IsFemale,'Seznámila','Seznámil')|U] jsem zdejší lidi s tvým trápením.\n\n"
 bp2_yearly.6202.impatient: "Drobní šlechtici, kteří mě znali jen jako miminko, začali při mé prosbě něžně šišlat. Pak však zmlkli.\n\n"
 bp2_yearly.6202.received_empathy: "Shromáždění plakali nad neštěstím [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')]. Na [hostage.Custom2('CZ_RelationToMeShort_A', SCOPE.sC('home_court'))|l] to hluboce zapůsobilo"
 bp2_yearly.6202.received_debate: "Rozpoutala se vášnivá debata. [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))|U] sice není [Select_CString(home_court.IsFemale,'tvou spojenkyní','tvým spojencem')|l], ale chce se stát [Select_CString(home_court.IsFemale,'hrdinkou své rodiny','hrdinou své rodiny')|l]"
 bp2_yearly.6202.received_scorn: "„Jakým právem od nás žádá pomoc?“ zněla otázka a já [Select_CString(hostage.IsFemale,'jsem sotva dokázala','jsem sotva dokázal')|l] odpovědět. [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))|U] zřejmě nemá radost"
 bp2_yearly.6202.received_apathy: "Některým je to zcela lhostejné, zatímco [home_court.Custom('KnightCulturePluralNoTooltipLowercase')|l] se scházejí a čekají, až [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))|l] rozhodne. Ptá se mě, kdy hodlám odjet"
 bp2_yearly.6202.fears_returning: " — a bojí se mého návratu do tvé neklidné země."
 bp2_yearly.6202.awaiting: " — stále však čekáme na [Select_CString(home_court.IsFemale,'její','jeho')|l] rozhodnutí."
 bp2_yearly.6202.want_to_stay: " — na ukvapený úsudek má však příliš mnoho moudrosti."
 bp2_yearly.6202.want_to_return: " — nechává mě tu však dál čekat, zatímco válka pokračuje!"
 bp2_yearly.6202.a: "Alespoň [hostage.GetFirstNameNoTooltip] stále žije."
 bp2_yearly_6203_army_name: "[ROOT.Var( 'bp2_yearly_6203_army_name_origin' ).Char.GetHomeCourt.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_yy')|U] zástup [ROOT.Var( 'bp2_yearly_6203_army_name_origin' ).Char.Custom('CZ_FirstNameNoTooltip_G')]"
 bp2_yearly.6203.t: "[ROOT.Char.Custom('CZ_NameNoTooltip_V')|U],"
 bp2_yearly.6203.join_war: "[home_court.GetPrimaryTitle.GetNameNoTier|U] stojí při tobě! [home_court.GetTitledFirstName|U], [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))|l], nezná strach a pouto mezi vámi potvrdí silou zbraní.\n\nAť nikdo neohrožuje síň, v níž přebývá člen rodu „[hostage.GetDynastyHouseName]“!\n\n"
 bp2_yearly.6203.assist: "[home_court.GetName|U] lituje, že ti nemůže přispěchat na pomoc. Přesto [Select_CString(hostage.IsFemale,'jsem s příslibem války a slávy shromáždila','jsem s příslibem války a slávy shromáždil')|l] zástup potulných žebráků a [home_court.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_yych')|l] dobrodruhů! Ať dobře bojují za [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_A')].\n\n"
 bp2_yearly.6203.betray: "Nemůžeme přehlížet slabost, kterou prozrazují tvé prosby. [home_court.GetTitledFirstName|U] místo toho vloží důvěru v sílu tvého nepřítele. Připrav se na [Select_CString(home_court.IsFemale,'její','jeho')|l] příchod.\n\nAž [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))|l] vyplení tvé hlavní sídlo, možná mě na svém dvoře zase uvidíš."
 bp2_yearly.6203.decline: "[Select_CString(hostage.IsFemale,'Udělala','Udělal')|U] jsem, co se dalo, ale [home_court.GetTitledFirstName] tvé argumenty příliš neuznává. Bez aliance se vojska [home_court.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] nevydají na pochod jen proto, že [ROOT.Char.GetPrimaryTitle.GetNameNoTier] žádá pomoc. [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))|U] ti děkuje, že jsi mě sem [Select_CString(ROOT.Char.IsFemale,'poslala','poslal')|l], a posílá pozdravy.\n\n"
 bp2_yearly.6203.dont_keep_knight: "Mé místo je na tvém dvoře, takže se s [target_knight.Custom('CZ_FirstName_I')] brzy vrátíme."
 bp2_yearly.6203.dont_keep: "Mé místo je na tvém dvoře, takže se brzy vrátím."
 bp2_yearly.6203.keep: "Už ale nejsem tvé rukojmí."
 bp2_yearly.6203.a: "Ať se jim daří! Naše pouto přesahuje rukojemnictví."
 bp2_yearly.6203.a.tt: "[home_court.GetFirstNameNoTooltip|U] se chopí zbraně na obranu příbuzných a odpoví na prosby potřebných. Je to [Select_CString(home_court.IsFemale,'dobrá přítelkyně','dobrý přítel')|l]."
 bp2_yearly.6203.b: "#EMP Zrada!#! Zemi zaliji krví!"
 bp2_yearly.6203.b.tt: "Porazím všechny nepřátele a vykonám pomstu!"
 bp2_yearly.6203.c.positive: "Do války, [hostage.Custom('CZ_FirstNameNoTooltip_V')]! #EMP Do války!#!"
 bp2_yearly.6203.c.negative: "[Select_CString(ROOT.Char.IsFemale,'Byla jsem hlupačka','Byl jsem hlupák')|U], když jsem [Select_CString(hostage.IsFemale,'ji','ho')|l] [Select_CString(ROOT.Char.IsFemale,'poslala','poslal')|l] z dohledu..."
 bp2_yearly.6203.c.tt: "Já chráním tebe, ale ty chráníš celé panství!"
 from_victory_vengeance_modifier: "Z vítězství pomsta"
 from_victory_vengeance_modifier_desc: "Tato postava žene vojska a rytíře k nelítostným krutostem, odhodlána jednou pomstít dávnou zradu."
 bp2_yearly.6204.t: "Prosba mé vlastní krve"
 bp2_yearly.6204.desc: "[hostage.GetFirstName|U], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))|l], se nečekaně vrací! [Select_CString(hostage.IsFemale,'Obalená','Obalený')|U] prachem cesty a pachem koňského potu.\n\n„Tvé příměří neohrožuji, [hostage.Custom2('CZ_RelationToMeShort_V', SCOPE.sC('home_court'))|l],“ zalapá po dechu. „Sem válka nepřichází! Ta strašná válka míří do [warden.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] — do síně, kde mě drží jako rukojmí!“\n\n"
 bp2_yearly.6204.desc_gift: "Předloží dopis a měšec zlata od [warden.Custom('CZ_TitledFirstName_G')]."
 bp2_yearly.6204.desc_chaperone: "[Select_CString(target_knight.IsFemale,'Ostražitá','Ostražitý')|U] [target_knight.GetName], doprovod rukojmí, předloží dopis od [warden.Custom('CZ_TitledFirstName_G')]."
 bp2_yearly.6204.desc_outro: "\n\n„Nemáš povinnost pomáhat,“ říká [hostage.GetFirstNameNoTooltip], „ale [Select_CString(warden.IsFemale,'má strážkyně','můj strážce')|l] se mnou zachází dobře! Nezaslouží si, aby [Select_CString(warden.IsFemale,'ji','ho')|l] [Select_CString(attacker.IsFemale,'zničila','zničil')|l] [attacker.GetName]!“"
 bp2_yearly.6204.desc_none: "Předloží dopis od [warden.Custom('CZ_TitledFirstName_G')]."
 bp2_yearly.6204.a: "Ať je [ROOT.Char.Custom('signature_weapon')|l] rychle po ruce! #EMP My z rodu „[ROOT.Char.GetDynastyHouseNameNoTooltip]“ budeme bojovat!#!"
 bp2_yearly.6204.a.tt: "Ať nikdo neohrožuje síň, v níž přebývají moji příbuzní!"
 bp2_yearly.6204.b: "Přispěji na vyzbrojení a vyplacení vojska."
 bp2_yearly.6204.b.tt: "Shromážděte ozbrojenou mládež a potulné žebráky, kteří odjedou s [hostage.Custom('CZ_FirstNameNoTooltip_I')]! Mohou bojovat bez mého oficiálního zapojení."
 bp2_yearly.6204.c: "Obrana [warden.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] není mou povinností."
 bp2_yearly.6204.c.tt: "Máme jen příměří. Nejsme spojenci!"
 bp2_yearly.6205.t: "Do zemí svárů"
 bp2_yearly.6205.desc: "[hostage.GetFirstName|U], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))|l], v naprostém tichu nasedá na svého koně. Čeká [Select_CString(hostage.IsFemale,'ji','ho')|l] cesta přes [warden.GetCapitalLocation.Custom('CZ_TerrainTypeProvince_A')|l] v okolí [warden.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_G')]. Tam možná čekají obávaní [attacker.GetPrimaryTitle.Custom('CZ_Adjective_sti')|l] [attacker.Custom('KnightCulturePluralNoTooltip')|l].\n\n"
 bp2_yearly.6205.desc_gift: "Mé pokladnice přetékají dary [warden.Custom('CZ_TitledFirstName_G')], ale [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))|l] přesto jede do války téměř bez doprovodu.\n\n"
 bp2_yearly.6205.desc_chaperone: "[target_knight.GetFirstName|U], [warden.Custom2('RelationToMeShort', SCOPE.sC('target_knight'))|l] [warden.Custom('CZ_TitledFirstName_G')], bude jediným doprovodem [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('hostage'))|l]. S otěžemi přitisknutými k srdci přísahá, že v případě potřeby zemře pro mou rodinu.\n\n"
 bp2_yearly.6205.desc_none: "Několik otrhaných mladíků se shromáždilo, aby podpořili věc [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('hostage'))|l], ale všechna má vojska zůstanou tady... zatímco [hostage.GetFirstNameNoTooltip] jede do války [warden.Custom('CZ_TitledFirstName_G')].\n\n"
 bp2_yearly.6205.desc_outro: "Přesto — právě [warden.GetFirstNameNoTooltip] mě [Select_CString(warden.IsFemale,'postavila','postavil')|l] před tak hroznou podívanou! [Select_CString(warden.IsFemale,'Ta slabá žena','Ten slabý muž')|U] posílá ctěné hosty, jako je [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))|l], aby se klaněli už při jediném zařinčení meče!\n\nA já mám věřit tomu #EMP červu#! a jemu podobným, že ochrání mou rodinu?"
 bp2_yearly.6205.a: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))|U] zůstane tady."
 bp2_yearly.6205.b: "[warden.GetFirstNameNoTooltip|U] za tu urážku zaplatí!"
 bp2_yearly.6205.c: "Nu... hodně štěstí, [ROOT.Char.Custom2('CZ_RelationToMeShort_V', SCOPE.sC('hostage'))|l]."
 bp2_yearly.6170.t: "Dohoda s necivilizovanými"
 bp2_yearly.6170.desc: "„Nikdo z rodu „[ROOT.Char.GetDynastyHouseName]“ není spokojený s tím, co jsi [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')|l]!“ zavrčí [kin.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))|l].\n\n„[hostage.GetName|U] — [kin.Custom2('RelationToMeShort', SCOPE.sC('hostage'))|l] — je [Select_CString(hostage.IsFemale,Select_CString(CZEnds(hostage.Custom('ComplimentAdjective'),'ýá'),CZAdjectiveDecline(hostage.Custom('ComplimentAdjective'),'á'),hostage.Custom('ComplimentAdjective')),hostage.Custom('ComplimentAdjective'))|l]! Jak jsi [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')|l] poslat [hostage.Custom('CZ_Name_A')] do páchnoucí síně, kde barbaři křičí ‚[warden.Custom('CulturalCurse')|U]!‘, ale nikdy ‚Kéž [ROOT.Char.GetFaith.HighGodName] přijme naši chválu!‘? Kde psi volně kálí na divochy i na zdejší [warden.GetCulture.Custom('CZ_Adjective_ee')|l] pány?“\n\n[warden.GetName|U] opravdu nemá vytříbenost [ROOT.Char.GetCulture.Custom('CZ_Adjective_ee')|l] kultury, přesto je [Select_CString(warden.IsFemale,'docela úctyhodná','docela úctyhodný')|l]—\n\n„[hostage.GetFirstNameNoTooltip|U] drží jako rukojmí v chatrči!“ vykřikne [kin.GetFirstNameNoTooltip]. „#EMP Postarej se o [Select_CString(hostage.IsFemale,'její','jeho')|l] potřeby!#! O práva, která náleží [ROOT.Char.Custom2('CZ_RelationToMeShort_D', SCOPE.sC('hostage'))|l] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')]!“"
 bp2_yearly.6170.a: "Ano, je to urážka [Select_CString(hostage.IsFemale,'její','jeho')|l] důstojnosti i té mé."
 bp2_yearly.6170.a.tt: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))|U] musí mít všechno vytříbené pohodlí domova!"
 bp2_yearly.6170.b: "Povinnost vůči rodině vás zavazuje všechny."
 bp2_yearly.6170.b.tt: "[hostage.Custom('CZ_FirstNamePossessiveNoTooltip_F')|U] oběť by měla být jen jednou z mnoha služeb rodu „[ROOT.Char.GetDynastyHouseNameNoTooltip]“."
 bp2_yearly.6170.c: "Pozná, jak žijí jiné národy."
 bp2_yearly.6170.c.tt: "Život mezi nevzdělanými naučí [ROOT.Char.Custom2('CZ_RelationToMeShort_A', SCOPE.sC('hostage'))|l] obejít se bez parády, snášet těžkosti a poradit si..."
 bp2_yearly.6170.scheme_bonus: "[Concept('close_family','Blízká rodina')|EU] a [Concept('spouses','choti')|E] se budou po #high 10 let#! ochotněji připojovat k tvým [Concept('hostile_schemes','nepřátelským intrikám')|E]"
 bp2_yearly.6170.leave_court_bonus: "[Concept('courtiers','Dvořané')|EU] z řad [Concept('close_family','blízké rodiny')|E] budou po #high 10 let#! méně ochotní odejít"
 lavish_care_modifier: "Štědrá péče"
 lavish_care_modifier_desc: "Tuto postavu rozmazlují desítky kultivovaných sloužících a žije v nádheře a pohodlí."
 trained_by_the_uncivilized_modifier: "Výchova mezi drsným lidem"
 trained_by_the_uncivilized_modifier_desc: "Tato postava se jako rukojmí naučila venkovským zvyklostem a postupům „nižší“ kultury."
 cultural_acceptance_hostage_exchange: "Styk prostřednictvím prestižních rukojmí"
 united_family_modifier: "Sjednocená rodina"
 united_family_modifier_desc: "Tato postava žádá od příbuzných nejvyšší úctu k vzájemným poutům."
 bp2_yearly.6180.notification_high: "Reformy: [Select_CString(pleased_ruler.IsFemale,'Spokojená','Spokojený')|U] [Select_CString(pleased_ruler.IsFemale,advanced_culture.Custom('CZ_AdjectiveNoTooltip_aa'),advanced_culture.Custom('CZ_AdjectiveNoTooltip_yy'))|l] [Select_CString(pleased_ruler.IsFemale,'vládkyně','vládce')|l]"
 bp2_yearly.6180_notification_tooltip_high: "[pleased_ruler.GetTitledFirstName|U] chválí tvůj zájem napodobit vznešené národy — [advanced_culture.GetCollectiveNoun]."
 bp2_yearly.6181.notification_high: "Reformy: Odsouzeno zanedbané panství"
 bp2_yearly.6181_notification_tooltip_high: "[disappointed_ruler.GetTitledFirstName|U] [Select_CString(disappointed_ruler.IsFemale,'je zklamaná','je zklamaný')|l], že tvé reformy nepřinesou mnoho nových příležitostí [advanced_culture.Custom('CZ_Adjective_yym')|l] kupcům."
 bp2_yearly.6182.notification_high: "Reformy: [Select_CString(disappointed_ruler.IsFemale,'Cizí panovnice','Cizí panovník')|U] odsuzuje obřady"
 bp2_yearly.6182_notification_tooltip_high: "[disappointed_ruler.GetTitledFirstName|U] tě nabádá, abys [Select_CString(ROOT.Char.IsFemale,'opustila','opustil')|l] [ROOT.Char.GetCulture.Custom('CZ_Adjective_ee')|l] pověry, chceš-li svůj lid osvobodit."
 bp2_yearly.6183.notification_high: "Reformy: [Select_CString(disappointed_ruler.IsFemale,'Urozená dáma','Urozený pán')|l] lituje hrubosti"
 bp2_yearly.6183_notification_tooltip_high: "[disappointed_ruler.GetTitledFirstName|U] se pozastavuje nad tvým „barbarským“ přijetím vytříbených [advanced_culture.Custom('CZ_Adjective_yych')|l] dvořanů."
 bp2_yearly.6184.notification_high: "Reformy: [Select_CString(disappointed_ruler.IsFemale,'Válečnice','Válečník')|U] vyjadřuje pohrdání"
 bp2_yearly.6184_notification_tooltip_high: "[disappointed_ruler.GetTitledFirstName|U] odsuzuje tvé odmítání [advanced_culture.Custom('CZ_Adjective_yych')|l] elit a slabou kontrolu nad vazaly."
 bp2_yearly.6185.notification_high: "Reformy: [ROOT.Char.Custom('KnightCultureNoTooltip')|U] čelí útoku žoldnéřů"
 bp2_yearly.6185_notification_tooltip_high: "[beaten_knight.GetTitledFirstName|U] [Select_CString(beaten_knight.IsFemale,'byla těžce zbita a ponížena','byl těžce zbit a ponížen')|l] potulnou skupinou pomstychtivých [advanced_culture.Custom('CZ_Adjective_yych')|l] žoldnéřů."
 bp2_yearly.6186.notification_high: "Reformy: Zvěsti o barbarství"
 bp2_yearly.6186_notification_tooltip_high: "Tvému dvoru se vysmívají jako baště nekultivovaných mravů, místu, kterému se dvořané vyspělých kultur vyhýbají."
 dearth_of_intellectuals_modifier: "Nedostatek vzdělanců"
 dearth_of_intellectuals_modifier_desc: "Horlivci vyhnali z panství této postavy mnoho zahraničních učenců, misionářů a úředníků."
 bereft_of_intellectuals_modifier: "Bez vzdělanců"
 bereft_of_intellectuals_modifier_desc: "Horlivci vyhnali z panství této postavy téměř všechny zahraniční učence, misionáře a úředníky."
 bp2_yearly.6187.notification_high: "Reformy: Útěk zkušených cizinců"
 bp2_yearly.6187_notification_tooltip_high: "[zealot_vassal.GetTitledFirstName|U] vede ostatní horlivce při vyhánění učenců, misionářů a úředníků z panství"
 bp2_yearly.6187_no_vassal_notification_tooltip_high: "Nově roznícení horlivci vyhánějí učence, misionáře a úředníky z panství"
 bp2_yearly.6188.notification_high: "Reformy: Převaha místní šlechty"
 bp2_yearly.6188_notification_tooltip_high: "V [isolating_county.Custom('CZ_LandedName_L')] posílení drobní šlechtici potlačují růst měst, dusí obchod a hromadí bohatství."
 bp2_yearly.6189.notification_high: "Reformy: Příliš rychlá výstavba"
 bp2_yearly.6189_notification_tooltip_high: "Velkolepé stavby [CZPrepV(affected_province.GetNameNoTooltip)] [CZProvName(affected_province,'L')], budované v [advanced_culture.Custom('CZ_Adjective_eem')|l] stylu, byly špatně naplánovány. Povolaní válečníci dřou, aby odvrátili katastrofu."
 grand_buildings_collapsed_modifier: "Problematická výstavba"
 grand_buildings_collapsed_modifier_desc: "V tomto hrabství budí neklid spoušť způsobená odvážnými stavebními projekty."
 conscripted_warriors_modifier: "Povolaní bojovníci"
 conscripted_warriors_modifier_desc: "Všichni práceschopní muži jsou zde vyčerpáni překotnou a vysilující stavební prací."
 bp2_yearly.6190.notification_high: "Reformy: Vypleněná svatyně — [ROOT.Char.GetFaith.HouseOfWorship]"
 bp2_yearly.6190_notification_tooltip_high: "V [affected_county.Custom('CZ_LandedName_L')] zdejší náboženští fanatici — [ROOT.Char.GetFaith.AltPriestTermPlural] — zničili tvé drahocenné [advanced_culture.Custom('CZ_Adjective_ee')|l] ikony a votivní dary."
 bp2_yearly.6191.notification_high: "Reformy: Odcizení příbuzným kulturám"
 bp2_yearly.6191_notification_tooltip_high: "[annoyed_culture.Custom('CZ_Adjective_sti')|U] předáci se cítí odcizení tvou dvorskou kulturou, která se od té jejich stále více liší."
 cultural_acceptance_diverging_court: "Rozcházení [Concept('cultures','kultur')|E] [Concept('court','dvora')|E]"
 bp2_yearly.6192.notification_high: "Reformy: Vazal ztrácí důvěru"
 bp2_yearly.6192_notification_tooltip_high: "[vassal.GetTitledFirstName|U] se ve tvém rychle se měnícím panství cítí ztraceně a ve stálosti a věrnosti už nevidí smysl."
 bp2_yearly.6193.notification_high: "Reformy: Posílená správa"
 bp2_yearly.6193_notification_tooltip_high: "Velmoži už své bohatství nebudou schovávat! Infrastruktura v [advanced_culture.Custom('CZ_Adjective_eem')|l] stylu posiluje tvou moc."
 bp2_yearly.6194.notification_high: "Reformy: Vděčnost vazala"
 bp2_yearly.6194_notification_tooltip_high: "[vassal.GetTitledFirstName|U] chválí tvé jméno před svými vrstevníky. Dary a opětovné potvrzení vzájemných pout [Select_CString(vassal.IsFemale,'ji naplňují','ho naplňují')|l] vděčností."
 bp2_yearly.6195.notification_high: "Reformy: Posvátná znamení změny"
 bp2_yearly.6195_notification_tooltip_high: "Mnozí o tobě pochybovali, ale [ROOT.Char.GetFaith.KnowledgeGodName] svými znameními potvrzuje správnost tvých duchovních praktik v [advanced_culture.Custom('CZ_Adjective_eem')|l] stylu."
 bp2_yearly.6196.notification_high: "Reformy: Požehnaný objev"
 bp2_yearly.6196_notification_tooltip_high: "[priest.GetTitledFirstName|U] nabízí poklad. Buď je to bohatství, které před tebou ukrývaly svatyně — [ROOT.Char.GetFaith.HouseOfWorshipPlural] — nebo zázračné požehnání, jímž tě obdařuje [ROOT.Char.GetFaith.HighGodName]."
 bp2_yearly.6197.notification_high: "Reformy: Nádhera v praxi"
 bp2_yearly.6197_notification_tooltip_high: "Dozvídám se, že [vassal.GetTitledFirstName] napodobuje [advanced_culture.Custom('CZ_Adjective_ee')|l] prvky mého dvora. Je to jen jedna z mnoha reakcí plných úžasu."
 custom.every_non_advanced_culture_courtier: "Každý [Concept('courtier','dvořan')|E], který nemá [advanced_culture.Custom('CZ_Adjective_ou')|l] kulturu"
 bp2_yearly.6198.notification_high: "Reformy: [Select_CString(courtier.IsFemale,'Ochránkyně','Ochránce')|U] dvora"
 bp2_yearly.6198_notification_tooltip_high: "[courtier.GetTitledFirstName|U] jménem tvých dvořanů slibuje nehynoucí oddanost tvému rodu. [Select_CString(ROOT.Char.IsFemale,'Dokázala','Dokázal')|U] jsi, že dokážeš odrazit soupeře dychtící po moci."
 bp2_yearly.6199.notification_high: "Reformy: [ROOT.Char.Custom('KnightCultureNoTooltip')|U] se přizpůsobuje"
 bp2_yearly.6199_notification_tooltip_high: "[knight.GetTitledFirstName|U] [Select_CString(knight.IsFemale,'ovládla','ovládl')|l] [advanced_culture.Custom('CZ_Adjective_ee')|l] válečné techniky a okázale je využívá."
 bp2_yearly.6210.notification_high: "Reformy: Inspirativní slib"
 bp2_yearly.6210_notification_tooltip_high: "[ruler.GetTitledFirstName|U] chce na tvůj slib neprolévat [ruler.GetCulture.Custom('CZ_Adjective_ou')|l] krev odpovědět vyhlášením bratrství."
 cultural_acceptance_embracing_identity: "Vzájemné pochvaly společného [Concept('heritage','dědictví')|E]"
 bp2_yearly.6211.notification_high: "Reformy: Spokojené příbuzné kultury"
 bp2_yearly.6211_notification_tooltip_high: "[pleased_culture.Custom('CZ_Adjective_sti')|U] šlechtici i prostí lidé jsou nadšeni novou horlivostí svých [ROOT.Char.GetCulture.Custom('CZ_Adjective_yych')|l] příbuzných a ve větším počtu se stěhují do tvých zemí."
 cultural_acceptance_reformer_migration: "Stěhování a rychlé přejímání zvyklostí"
 bp2_yearly.6212.notification_high: "Reformy: [advanced_culture.Custom('CZ_Adjective_yy')|l] vliv"
 bp2_yearly.6212_notification_tooltip_high: "Kultivované [advanced_culture.Custom('CZ_Adjective_ee')|l] rodiny založily v tvém hlavním sídle novou komunitu, zatímco venkovští přistěhovalci osidlují venkov."
 bp2_yearly.6212_2_notification_tooltip_high: "Každodenní správa [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] získala výrazně [advanced_culture.Custom('CZ_Adjective_yy')|l] ráz, na který cestovatelé často upozorňují."
 bp2_yearly.6213.notification_high: "Reformy: Krutý pokrok"
 bp2_yearly.6213_notification_tooltip_high: "Tvoji vykonavatelé začali z vlastní vůle potlačovat řeči o tvé [advanced_culture.Custom('CZ_Adjective_ee')|l] indoktrinaci a krutosti tvých [advanced_culture.Custom('CZ_Adjective_yych')|l] postupů."
 bp2_yearly.6213_notification_2_tooltip_high: "[advanced_culture.Custom('CZ_Adjective_sti')|U] úředníci, kteří vykonávají tvou vůli, přehlížejí tradiční [ROOT.Char.GetCulture.Custom('CZ_Adjective_ee')|l] obřady a porušují odvěká práva."
 bp2_yearly.6214.notification_high: "Reformy: Proměna komunit"
 bp2_yearly.6214_notification_1_tooltip_high: "Kupci a řemeslníci v [affected_county.Custom('CZ_LandedName_L')] pracují podle nových smluv a zákonů a soupeří o mince v [advanced_culture.Custom('CZ_Adjective_eem')|l] stylu, které se nyní dostaly do oběhu."
 bp2_yearly.6214_notification_2_tooltip_high: "Drobní bojovníci — [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] — a svárliví svobodní vlastníci v [affected_county.Custom('CZ_LandedName_L')] přijali [advanced_culture.Custom('CZ_Adjective_ee')|l] podmínky služby a věrnosti. Díky tomu ubývá násilí i svárů."
 bp2_yearly.6214_notification_3_tooltip_high: "Svatyně a vesnické farnosti v [affected_county.Custom('CZ_LandedName_L')] nyní vedou vzdělaní a kultivovaní muži. [ROOT.Char.GetFaith.HouseOfWorshipPlural|U] tak podporují vzdělávání a správu v [advanced_culture.Custom('CZ_Adjective_eem')|l] stylu."
 bp2_yearly.6215.notification_high: "Reformy: [ROOT.Char.GetTitleAsNameNoTooltip] s jasným cílem"
 bp2_yearly.6215_notification_1_tooltip_high: "Velmoži bažící po bohatství pobízejí své pány, aby napodobili tvůj proslulý zájem o reformu [ROOT.Char.GetCulture.Custom('CZ_Adjective_ee')|l] společnosti a obchodu."
 bp2_yearly.6215_notification_2_tooltip_high: "Válečnická síla tvé družiny, vojska zoceleného snahou o znovuzrození [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')], budí všeobecnou úctu."
 bp2_yearly.6215_notification_3_tooltip_high: "O obřadech tvých posvátných síní se vypráví široko daleko, zatímco lidé horlivě spekulují o rozpolcenosti tvé [ROOT.Char.GetCulture.Custom('CZ_Adjective_ee')|l] duše."
 bp2_yearly.6216.notification_high: "„Reformy: Je [ROOT.Char.GetTitleAsNameNoTooltip] opravdu #EMP [Select_CString(ROOT.Char.IsFemale,'jednou z nás','jedním z nás')|l]#!?“"
 bp2_yearly.6216_notification_tooltip_high: "Tvoji spolčenci hlásí, že šlechta šeptá a reptá... zaslouží si její úctu někdo podlézavý, napůl [advanced_culture.Custom('CZ_Adjective_yy')|l]?"
 bp2_yearly.6216_notification_2_tooltip_high: "Šíří se zvěst o cizím spiknutí. O loutce, kterou [advanced_culture.GetCollectiveNoun] zkazili a dosadili na [ROOT.Char.GetPrimaryTitle.Custom('CZ_Adjective_yy')|l] trůn..."
