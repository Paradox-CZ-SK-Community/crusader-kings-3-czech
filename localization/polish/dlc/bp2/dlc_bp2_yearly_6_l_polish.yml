 bp2_yearly.6001.opening: "[childs_host.Custom2('AppropriateGreeting', ROOT.Char)|U]"
 bp2_yearly.6001.desc: "Péče o [hosted_child.Custom('CZ_Name_A')], [ROOT.Char.Custom2('CZ_RelationToMeShort_A', SCOPE.sC('hosted_child'))|l], odhalila nepříjemnou pravdu: na tradičních [ROOT.Char.GetCulture.Custom('CZ_AdjectiveNoTooltip_yych')|l] ctnostech ti pramálo záleží. Z nevychovaných spratků, kteří neznají naše způsoby, na tvém dvoře vyrostou "
 bp2_yearly.6001.desc.insult.bellicose: "slabochové"
 bp2_yearly.6001.desc.insult_bureaucratic: "darmošlapové"
 bp2_yearly.6001.desc.insult.communal: "tuláci"
 bp2_yearly.6001.desc.insult.courtly: "hrubiáni"
 bp2_yearly.6001.desc.insult.egalitarian: "darebáci"
 bp2_yearly.6001.desc.insult.spiritual: "kacíři"
 bp2_yearly.6001.desc.insult.stoic: "padouši"
 bp2_yearly.6001.desc.outro: ".\n\nVůdci našeho lidu už o tom všem vědí. O to [Select_CString(childs_host.IsFemale,'jsem se postarala','jsem se postaral')|l]."
 bp2_yearly.6001.a: "Musím to napravit! Dokážeme [Select_CString(childs_host.IsFemale,'jí','mu')|l], že se mýlí!"
 bp2_yearly.6001.a.tt: "Vychovatelé na mém dvoře potřebují pořádně promluvit do duše o hodnotách."
 bp2_yearly.6001.b: "Budu jednat po svém."
 bp2_yearly.6001.b.tt: "Nejsem [Select_CString(ROOT.Char.IsFemale,'typickou představitelkou','typickým představitelem')|l] [ROOT.Char.GetCulture.Custom('CZ_AdjectiveNoTooltip_ee')|l] kultury, ale mohu být [Select_CString(ROOT.Char.IsFemale,'výjimečnou','výjimečným')|l]."
 enforcing_cultural_values_modifier: "Prosazování kulturních hodnot"
 enforcing_cultural_values_modifier_desc: "Tato postava neúnavně vyžaduje dodržování zvyků své kultury."
 rejecting_bellicose_ways_modifier: "Odmítání bojovných zvyklostí"
 rejecting_bellicose_ways_modifier_desc: "„Tradice? Který hlupák si vůbec váží našich tradic?“"
 rejecting_bureaucratic_ways_modifier: "Odmítání byrokratických zvyklostí"
 rejecting_bureaucratic_ways_modifier_desc: "$rejecting_bellicose_ways_modifier_desc$"
