 bp2_yearly.6010.t: "Žádný [sad_boi.GetWomanMan|U] ve vězení"
 bp2_yearly.6010.desc: "„#EMP Mám mnoho přátel, ale jejich dary jsou vzácné...#!“ zpívá [sad_boi.GetFirstName], [sad_boi.GetHerHis] hlas praská emocemi.\n\nMůj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sad_boi'))] odhodí [sad_boi.GetHerHis] nástroj stranou a volá: „Dost už [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]!“"
 bp2_yearly.6010.adult: "Je to zbavené veškerého pohodlí.„\n\nVrhnuv na mě vypadaný pohled, [sad_boi.GetSheHe] dodává: „Tato píseň bude mou prosbou o pomoc během tohoto nešťastného zajetí. Nějaké drobné... pokud se můj lid o mě ještě stará...“"
 bp2_yearly.6010.child: "Jsem tu opravdu nešťastný.„\n\nUpřeně na mě hledí [sad_boi.Custom('GirlBoy')] a dodává: „Poslechnutí této písně přiměje mou rodinu! Pošlou něco, co učiní mé #EMP vyhnanství#! snesitelným, jestli... se o mě ještě starají...“"
 bp2_yearly.6010.outro: "\n\n[sad_boi.GetSheHe|U] znovu zachytí smutnou melodii, v očích [sad_boi.GetHerHis] je vzdálený [home_court_liege.GetPrimaryTitle.GetNameNoTier]."
 bp2_yearly.6010.a: "Ano, uvidíme, jakou 'charitu' dokážou..."
 bp2_yearly.6010.a.tt: "...pro mou peněženku."
 bp2_yearly.6010.b: "Nešťastný?! #EMP Můžu pomoci?#!"
 bp2_yearly.6010.b.tt: "O mém dvoře se nesmí říkat, že je to místo utrpení!"
 bp2_yearly.6010.c: "Musím naučit [sad_boi.GetHerHim], že [sad_boi.GetHerHis] místo je tady."
 bp2_yearly.6010.c.tt: "Všichni, ať už se tu narodíme nebo ne, musíme nést strasti s tichou důstojností."
 bp2_yearly.6010.c.success: "[sad_boi.GetSheHe|U] dá [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] další šanci"
 bp2_yearly.6010.c.tt_education: "Výsledek vzdělání [sad_boi.GetFirstNamePossessive] se zlepší"
 bp2_yearly.6010.c.failure: "Popírání pravdy [sad_boi.GetHerHis] textu rozruší [sad_boi.GetFirstNameNoTooltip]"
 bp2_yearly.6010.d: "Vlastně krásná skladba."
 bp2_yearly.6010.d.tt: "Ať se tato žaloba zpívá daleko a široce: její krása má větší váhu než obsah."
 bp2_yearly.6020.t: "Děti říkají takové legrační věci"
 bp2_yearly.6020.desc: "Když sdílím nejnovější zprávy z [snitch.GetHomeCourt.GetTitledFirstNamePossessive] dvora, můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('snitch'))] [snitch.GetName] se zdá podivně pobavený, s zasněným úsměvem"
 bp2_yearly.6020.child: "na [snitch.GetHerHis] malém obličeji.\n\n„Mám příběh, [ROOT.Char.GetTitleAsNameNoTooltip]. Příběh, který jsem si vymyslel z vlastních pozorování! Ale... nemám to říkat. Slibila jsem, že to neudělám.“\n\n[snitch.GetSheHe|U] se zachichotá s rošťáckou radostí, užívajíc si vzácnou moc nad svými staršími.\n\n„Zlobivý!“ zakřičí [snitch.GetFirstNameNoTooltip]."
 bp2_yearly.6020.youth: "na [snitch.GetHerHis] ulepené dospívající tváři.\n\n„Mám příběh, [ROOT.Char.GetTitleAsNameNoTooltip]: právě jsi mi to připomněl. Něco, o čem se nemá mluvit! Ale... [Select_CString(ROOT.Char.IsFemale,'byla','byl')] jsem tak malý. Teď se to zdá být dávno.“\n\n[snitch.GetSheHe|U] se zachichotá s ďábelskou radostí, užívajíc si vzácnou moc nad těmi, kdo ho vychovali [snitch.GetHerHim].\n\n„Zlobivý!“ zvolá [snitch.GetFirstNameNoTooltip]."
 bp2_yearly.6020.liege: "„Tak posvátný, tak zlobivý!“"
 bp2_yearly.6020.family: "„Rodina může být tak zlobivá!“"
 bp2_yearly.6020.a: "Pokračuj..."
 bp2_yearly.6020.a.secret: "Dozvíte se [secret|e] držené rodinou [snitch.GetShortUINamePossessive]"
 bp2_yearly.6020.a.non_family_secret: "Získáte [secret|e] z vnitřního kruhu [no_no_doer.GetShortUINamePossessive] [court|E]"
 bp2_yearly.6020.a.success: "Příjemně špinavý příběh"
 bp2_yearly.6020.a.failure: "Asi jen nedozrálá hloupost..."
 bp2_yearly.6020.a.no_secret: "Nedozvíte se nic důležitého"
 bp2_yearly.6020.b: "Lehké řeči vedou ke ztrátě cti."
 bp2_yearly.6020.b.tt: "[snitch.GetFirstNameNoTooltip] by měl dát přednost ctnosti diskrétnosti před drby."
 bp2_yearly.6020.b.discretion: "[snitch.GetShortUIName] je mnohem méně pravděpodobné, že odhalí vaše [secrets|E]"
 bp2_yearly.6030.t: "Oči rodiny"
 bp2_yearly.6030.desc: "Můj [snitch.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('snitch'))] [snitch.GetFirstName] rozzáří mlhavé ranní putování a vypráví mi o svém pobytu jako rukojmí v péči [warden.GetNamePossessive].\n\nSe [Select_CString(snitch.IsFemale,'vrátila','vrátil')] očividně změněný(á): moudřejší, vnímavější. Věrný [snitch.GetDynastyHouseName], dobře přizpůsobený životu v cizím místě.\n\nVěrný [snitch.GetDynastyHouseNameNoTooltip]... možná je hodnota vytěžit z očí naší rodiny, které byly v [warden.GetTitledFirstNamePossessiveNoTooltip] dvoře...?"
 bp2_yearly.6030.hostage_reticent: "\n\n[snitch.GetFirstNameNoTooltip], nicméně, vypadá #negative_value velmi neochotně#! být mou informátorkou. Možná byla dokonce varována."
 bp2_yearly.6030.hostage_normal: "\n\nTedy — co, pokud vůbec něco, [snitch.GetFirstNameNoTooltip] ví?"
 bp2_yearly.6030.a: "Mohu vylákat tajemství [warden.GetPrimaryTitle.GetNameNoTierNoTooltip]..."
 bp2_yearly.6030.maybe_secret: "#high [snitch.GetFirstName]#! #EMP may#! share a [secret|E] from [warden.GetShortUINamePossessive] inner circle"
 bp2_yearly.6030.a.success: "Dozvíte se vše, co [snitch.GetFirstNameNoTooltip] ví"
 bp2_yearly.6030.a.failure: "[snitch.GetFirstNameNoTooltip] se vyhne výslechu"
 bp2_yearly.6030.a.no_secret: "[snitch.GetFirstName] neví... nic důležitého"
 bp2_yearly.6030.a.evade: "#high [snitch.GetFirstName]#! shares nothing useful"
 bp2_yearly.6030.b: "Za službu rodině [snitch.GetHerHis] — odměna!"
 bp2_yearly.6030.b.tt: "Ukažte [snitch.GetHerHim], jak dobře odměňuji agenty a informátory!"
 bp2_yearly.6030.b.failure: "[snitch.GetFirstNameNoTooltip] neposkytuje žádné [secrets|E]"
 bp2_yearly.6030.b.rewarded: "#high [snitch.GetFirstName]#! je mnohem pravděpodobnější, že se připojí k vašim [schemes|E]"
 bp2_yearly.6030.refuse_reward: "#high [snitch.GetFirstName]#! je neochotná a nezaujatá"
 bp2_yearly.6030.c: "Bez cti je držení rukojmích bezcenné."
 bp2_yearly.6030.c.tt: "Pravidla dohody jsou přísná a nedotknutelná."
 bp2_yearly.6030.c.honor: "[rulers|E] jsou více nakloněni nabízet a požadovat [hostages|E] s vámi"
 bp2_yearly.6030.c.hostage_secrets: "@alert_icon! #alert_trial Získáte [tyranny|E], když budete vyvíjet tlak na získání [secrets|E] od [hostages|E]#!"
 honorable_warden_modifier: "Čestný opatrovník"
 honorable_warden_modifier_desc: "Tato postava prohlašuje, že rukojmím poskytuje nedotknutelnou důstojnost."
 bp2_yearly.6040.t: "Vše, čím nejsme"
 bp2_yearly.6040.desc: "Sleduji nejmladší [ROOT.Char.GetCulture.GetCollectiveNoun] z [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] při jejich studiích. Pomalu se učí, jsou nedisciplinovaní, hádají se jako jejich rodiče.\n\nVůbec nejsou jako [advanced_culture.GetCollectiveNoun] z bájného [childhood_location.GetCounty.GetTitle.GetNameNoTier]. Jejich říše je plná řádu, velkých děl a velkolepých myšlenek. Když jsem [Select_CString(ROOT.Char.IsFemale,'byla','byl')]"
 bp2_yearly.6040.hostage: "držen jako rukojmí"
 bp2_yearly.6040.education: "vzděláván"
 bp2_yearly.6040.outro: "tam jsem [Select_CString(ROOT.Char.IsFemale,'byla','byl')] osvícen.\n\nZačal jsem své lidi vidět jako primitivy, kterými jsou.\n\nMohu to změnit. Obraný poznatky [advanced_culture.GetNameNoTooltip] z mládí... snad bychom měli vykročit na nejistou cestu reforem?"
 bp2_yearly.6040.a: "Moje vláda může být znovuzrozením."
 bp2_yearly.6040.a.tt: "Zavést zahraniční poznatky místo zvyků mého lidu — nebo je dovést k větší slávě."
 bp2_yearly.6040.a.reforms: "Pokusíte se reformovat a pozvednout svou [culture|E], [court|E] a [realm|E], následujíc model [advanced_culture.GetName]"
 bp2_yearly.6040.a.warning: "@alert_icon! #alert_trial Toto bude náročné a nákladné. Ujistěte se, že jste připraveni.#!"
 bp2_yearly.6040.b: "Proč vůbec #EMP uvažovat#! o zpochybnění našich tradic?"
 bp2_yearly.6040.b.tt: "Přijímám naše vytříbené [ROOT.Char.GetCulture.GetNameNoTooltip] způsoby a odvracím se od všeho ostatního!"
 bp2_yearly.6040.b.promote_culture: "Úkol [promote_culture|E] [councillor_task|E] bude účinnější po #high 25 years#!"
 bp2_yearly.6040.b.no_reforms: "Už nebudete tyto reformy zvažovat"
 bp2_yearly.6040.c: "Nyní jednoduše není ten pravý čas."
 bp2_yearly.6040.c.recurring: "Tento impuls k reformě se pravděpodobně znovu objeví"
 devoted_to_tradition_modifier: "Obhájce tradice"
 devoted_to_tradition_modifier_desc: "Tato postava odmítá spojení s cizinci a je známým zastáncem svého lidu."
 bp2_devoted_to_tradition_modifier_conversion_task_desc: "$devoted_to_tradition_modifier$"
 bp2_yearly.6050.t: "Kámen, železo, hlína a proutí"
 bp2_yearly.6050.desc: "Na můj rozkaz se od [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] rozbíhají první nově vytesané uličky a skromné předmostí — postavené ve stylu velkých [advanced_culture.GetName] cest, pevností a daňových úřadů.\n\nPřesto mé hlavní město není třpytivým [childhood_location.GetCounty.GetTitle.GetNameNoTier], ani [ROOT.Char.GetPrimaryTitle.GetNameNoTier] není lidnatou zemí bohatou na obchod a řemesla. #EMP Zatím.#!\n\nPo mém boku se [noble_representative.GetTitledFirstName] mračí na mé nové stavby, mé zahraniční architekty.\n\n„Obohacujete #EMP obchodníky#! a #EMP běžné lidi#!,“ posmívá se můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('noble_representative'))], „zatímco vaše věrná šlechta by z vaší štědrosti mohla stavět nové síně!\" # todo: RETRANSLATED ENGLISH
 bp2_yearly.6050.a: "Mé nové velkolepé hlavní město bude prosperovat!"
 bp2_yearly.6050.a.tt: "Nový klenot bude zářit mezi městy usazených zemí; jeho obyvatelé budou prosperovat, stejně jako já."
 bp2_yearly.6050.b: "My civilizovaní lidé #EMP nedarujeme#!. Daníme a stavíme."
 bp2_yearly.6050.b.tt: "Tyto výběry jsou obvyklé v cizích zemích — a tak jsou i zde, nyní!"
 bp2_yearly.6050.every_county_development: "Úroveň [development|E] v každém [county|E] vašeho [domain|E] se změní o #positive_value +1#!"
 bp2_yearly.6050.county_control_loss: "Úroveň [control|E] se změní o #negative_value -30#! v každém [county|E] vašeho [domain|E]"
 bp2_yearly.6050.county_opinion_modifier: "Každý ne-[advanced_culture.GetName] [county|E] ve vašem [domain|E] získá [GetModifier('unprecedented_taxation_modifier').GetNameWithTooltip]"
 bp2_yearly.6050.c: "Nemohu se odvrátit od své šlechty!"
 bp2_yearly.6050.c.tt: "Budu dávat přednost magnátům [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] nad vším ostatním, vždy."
 bp2_yearly.6020.pay_vassals: "Zaplatíte [gold_i|E]#N [root_scope.MakeScope.ScriptValue('minor_gold_value')]#! všem svým [powerful_vassals|E] #EMP and#! ztratíte [gold_i|E]#N [root_scope.MakeScope.ScriptValue('minor_gold_value')]"
 bp2_yearly.6050.reaffirmation_path: "@alert_icon! #alert_trial Toto #EMP rychle#! přispívá k obnovení vašich [root_scope.GetCulture.GetNameNoTooltip] zvyků#!"
 bp2_yearly.6050.reform_path: "@alert_icon! #alert_trial Toto přispívá k vašim rozsáhlým [advanced_culture.GetNameNoTooltip] reformám#!"
 cultural_acceptance_gain_beginning_reforms: "Vládce začal zavádět zvyky jiné [culture_possessive|E]"
 cultural_acceptance_gain_building_familiar_settlements: "Reformátorovo [realm|E] přestavěné ve stylu, který je nyní sdílený"
 cultural_acceptance_turned_away_trade: "Lží o velkolepých projektech [ruler|E] ošidil stavitele a obchodníky jiné [culture|E]"
 massive_construction_efforts_modifier: "Masivní stavební úsilí"
 massive_construction_efforts_modifier_desc: "Odborní stavitelé jsou agresivně dováženi, aby pracovali na zdejších velkolepých projektech."
 great_builder_modifier: "Velký stavitel"
 great_builder_modifier_desc: "Oddaný mecenáš ambiciózní výstavby: modernizátor a zaměstnavatel kvalifikovaných zahraničních odborníků."
 unprecedented_taxation_modifier: "Bezprecedentní zdanění"
 unprecedented_taxation_modifier_desc: "Daně v cizím stylu, tvrdé nad rámec dosavadních představ, financují místní rozvoj, který je vysoce neoblíbený."
 loyal_realm_nobility_modifier: "Oblíbený u šlechty království"
 loyal_realm_nobility_modifier_desc: "Tato postava si vybudovala zanícený vztah s urozenými bojovníky svého lidu."
 bp2_yearly.6060.t: "Studia v věčnosti"
 bp2_yearly.6060.desc: "Špinavé rituály [ROOT.Char.GetCulture.GetName], náš způsob [ROOT.Char.GetFaith.GetName]... jsme jen děti blekotající ve tmě?\n\nKdyž [clergy_representative.GetFirstName] a naši úzkoprsí [clergy_representative.GetFaith.PriestNeuterPlural] prosí o přízeň [ROOT.Char.GetFaith.HighGodName], má mysl je unášena vzpomínkou na šustění posvátných rouch [advanced_culture.GetName], pohlcena pravdou jejich rétoriky. Toužím po sálech vědění v [childhood_location.GetCounty.GetTitle.GetNameNoTier], abych bloumal po tajemstvích tam odhalených.\n\n"
 bp2_yearly.6060.same_faith: "Pro [advanced_culture.GetCollectiveNounNoTooltip] žije víra ve velkoleposti, posílena učením. Je přenášena shora dolů a, na rozdíl od našich pověr, zůstává stálá."
 bp2_yearly.6060.different_faith: "Mohou všechny duše říše, kde je málo chrámů a ještě méně písma... spoléhat na má ústa, aby sdílela pravdu [advanced_culture_faith.GetName]?"
 bp2_yearly.6060.a: "Žil jsem jen pro to. Jsem [advanced_culture_faith.GetAdherentNameNoTooltip]."
 bp2_yearly.6060.a.tt: "Kdo jiný by mohl spojit naše víry? A jaká lepší víra přinese duchovní řád a osvícení [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]?"
 bp2_yearly.6060.b: "Víra musí být vybudována, musí být uspořádána."
 bp2_yearly.6060.b.tt: "Budeme napodobovat, jak jsou cizí víry organizovány, jak sahají k nebi a do každého aspektu každodenního života."
 bp2_yearly.6060.b.conversion_bonus: "[convert_county|E] Rychlost postupu: #P +[EmptyScope.ScriptValue('zealous_proselytizer_percentage')|0]%#!"
 bp2_yearly.6060.c: "Učení je pramenem veškeré síly."
 bp2_yearly.6060.c.tt: "A pokud jsem nejvzdělanější a nejmoudřejší ze všech, pokud jsem zcela oddaný, má říše jistě vzkvétá!"
 bp2_yearly.6060.c.nerd: "Snižujete všechny dovednosti kromě [learning|E] o #negative_value 2#!"
 bp2_yearly.6060.c.tribal_warning: "@warning_icon! #X Budete moci postavit $building_type_generic_university$ jen pokud už nebudete mít [tribal_government|E]#!"
 bp2_yearly.6060.d: "A přesto cítím... #EMP my#! jsme pravými věřícími!"
 bp2_yearly.6060.d.tt: "Naší pravdě nic není okázalé ani spletité. Toto je spravedlivé."
 fervor_gain_reformer_converts: "Proslulý reformátor konvertoval"
 fervor_gain_reformer_champions_faith: "Vládce oživuje tuto [faith|E]"
 fervor_loss_reformer_rejects_faith: "Odsouzení dalšího proslulého zastánce [faithpossessive|E]"
 adapted_rituals_modifier: "Přizpůsobené cizí rituály"
 adapted_rituals_modifier_desc: "Jak se stavějí chrámy v cizím stylu a zavádějí se cizí rituály, lidé říkají, že pro tuto osobu není nic posvátné... nebo je snad vše?"
 court_of_scholars_modifier: "Dvůr učenců"
 court_of_scholars_modifier_desc: "Patron intelektuálů i bláznů, tato postava vládne rychle se měnícímu lidu."
 bp2_yearly.6070.t: "Kam se celý svět dívá"
 bp2_yearly.6070.desc: "„Dlouho sloužím [advanced_court_owner.GetTitledFirstName], největšímu [advanced_culture.GetName], který žije,“ tvrdí [foreign_official.GetName], takzvaný úředník [advanced_court_owner.GetPrimaryTitle.GetNameNoTier].\n\n„Poetika [advanced_court_owner.GetHerHis] moci, móda, která ohromuje svět, dvorové tance, insignie a všechno ostatní — chceš okusit nejvyšší kulturu, [ROOT.Char.GetTitleAsNameNoTooltip]? Mohu ti pomoci. Vím, kde jsou #EMP nezaměnitelné#! bohatství ukrytá.“\n\nMoje reformní ambice přitahují tyto nemorální tvory, stejně ambiciózní: okukují můj zájem o změnu... s hrabivým oportunismem."
 bp2_yearly.6070.a: "Raději se naučím, jak vládne [advanced_court_owner.GetTitleAsNameNoTooltip]."
 bp2_yearly.6070.a.tt: "Nezajímá mě metoda okázalosti, ale metody civilizace."
 bp2_yearly.6070.b: "Přineste nám civilizované způsoby, nádherné oděvy."
 bp2_yearly.6070.b.tt: "Za ty nejkvalitnější [advanced_culture.GetNameNoTooltip] roucha — za nejvyšší cenu! Nezáleží na jejich... původu..."
 bp2_yearly.6070.artifact_warning: "@warning_icon! #X [advanced_court_owner.GetTitledFirstName] si je může vyžádat zpět#!"
 bp2_yearly.6070.change_clothes: "Někteří z vašich poddaných se budou oblékat jako [advanced_culture.GetCollectiveNoun] po celou dobu, co vládnete"
 bp2_yearly.6070.change_clothes_heir: "Někteří z vašich poddaných budou nosit oděv jako [advanced_culture.GetCollectiveNoun], po celou dobu, co vy nebo váš současný [primary_heir|E] vládnete"
 bp2_yearly.6070.c: "Jazyk moci je hlavní mezi atributy."
 bp2_yearly.6070.c.tt: "Pokud skutečně ovládnu [advanced_culture.GetLanguage.GetNameNoTooltip], budu rovnocenný bez potřeby ozdob."
 bp2_yearly.6070.court_language_discount: "Při změně [court_language|E] zaplatíte mnohem méně [prestige|E]"
 bp2_yearly.6070.d: "Ty, [advanced_culture.GetNameNoTooltip], jsi odporný hmyz!"
 bp2_yearly.6070.d.tt: "Jsem #EMP já#! považován za příbuzného tomuto červu? Učinění příkladu z [foreign_official.GetHerHim] by to mělo změnit!"
 artifact_admired_culture_regalia: "Okázalé [advanced_court_owner.GetPrimaryTitle.GetAdjectiveNoTooltip] regálie"
 artifact_famed_culture_regalia_desc: "Nádherná sbírka 'dovážených' [advanced_culture.GetName] ozdob, té kvality, jakou by si jejich [advanced_court_owner.GetTitleAsNameNoTooltip] mohl objednat u svých nejsofistikovanějších řemeslníků."
 artifact_admired_culture_crown: "Koruna [root_scope.GetFirstNameNoTooltip]"
 artifact_famed_culture_crown_desc: "Majestátní záležitost ve stylu [advanced_culture.GetName], jaká v [root_scope.GetCulture.GetName] zemích dosud nebyla viděna; tato zlatá koruna sporného původu cestovala daleko, aby spočinula na hlavě vizionářského [root_scope.GetTitleAsNameNoTooltip]."
 artifact_advanced_culture_treatise: "Pojednání [root_scope.GetPrimaryTitle.GetAdjectiveNoTooltip] v jazyce [advanced_culture.GetLanguage.GetNameNoTooltip]"
 bp2_yearly.6080.t: "Krev [ROOT.Char.GetCulture.GetNameNoTooltip]"
 bp2_yearly.6080.desc: "Horda [advanced_culture.GetName] žoldnéřů, pod vedením dvou zkušených velitelů, se nabízí jako palácová garda a školitelé mých sil. Čekají za mými branami. Uvnitř mi můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('angry_vassal'))] [angry_vassal.GetTitledFirstName] vyje.\n\n„#EMP Zrádce [ROOT.Char.GetTitleAsNameNoTooltip], psu [advanced_culture.GetCollectiveNounNoTooltip]!#! Přeješ si být tyranem nepodobným žádnému pravému [ROOT.Char.GetCulture.GetName], vládnout cizími zákony a cizí mocí? Považuješ naše zvyky za ztracené?!“\n\n„Pak musí být zrušeny i naše věrnostní přísahy!“ říká [angry_vassal.GetSheHe], obklopen [angry_vassal.GetHerHis] ozbrojenou eskortou. „My vazalové se shodujeme: pokud [advanced_culture.GetCollectiveNounNoTooltip] neodejdou, naše pouta k tobě jsou bezcenná!“"
 bp2_yearly.6080.a: "Mohl bych je usadit jako pokojné migranty?"
 bp2_yearly.6080.a.tt: "Moji šlechtici se jistě dají přesvědčit, pokud budou vytlačeni pouze prostí lidé..."
 bp2_yearly.6080.pop_opinion_modifier: "Každý ne-[advanced_culture.GetName] [county|E] ve stejné [duchy|E] získá #N [GetModifier('forcible_resettlement_modifier').GetNameWithTooltip]#!"
 bp2_yearly.6080.b: "Vůdce vzpoury! #EMP Chyťte [angry_vassal.GetHerHim]!#!"
 bp2_yearly.6080.b.tt: "Uvidíme, jak se ostatní milovníci tradic pokusí organizovat v jeho nepřítomnosti!"
 bp2_yearly.6080.b.success: "Disident [Select_CString(ROOT.Char.IsFemale,'byla','byl')] zajat"
 bp2_yearly.6080.b.failure: "[angry_vassal.GetFirstNameNoTooltip] si proráží cestu ven"
 bp2_yearly.6080.add_both_courtiers: "[foreign_mercenary_1.GetName] a [foreign_mercenary_2.GetName] se přidávají k vašemu dvoru"
 bp2_yearly.6080.c: "Všechna stará pouta jsou zrušena: nenechám se zastavit."
 bp2_yearly.6080.c.tt: "Náš lid se zrodil znovu. Primitivní povinnosti a staré dluhy už neplatí. Jediná věc, na které záleží, je dokončení mých reforem."
 bp2_yearly.6080.hook_removal_vassals: "[vassals|E] ztratí všechny [hooks|E], které na vás mají"
 bp2_yearly.6080.hook_removal: "@warning_icon! #X Ztratíte všechny [hooks|E], které máte na [vassals|E]#!"
 bp2_yearly.6080.truce_removal: "@warning_icon! #X Všechny [truces|E] mezi vámi a vašimi [vassals|E] jsou zrušeny#!"
 bp2_yearly.6080.d: "Krev mého lidu nesmí být prolita."
 bp2_yearly.6080.d.tt: "Náš lid, naše společná věc, by nás měla pohánět a spojovat: měli bychom být oddáni jeden druhému."
 elite_foreign_guard_modifier: "Kasárny elitní gardy"
 elite_foreign_guard_modifier_desc: "Vysoce disciplinovaní bojovníci, většinou z jiných zemí a národů, mají zde své středisko. Trénují bojové dovednosti a čekají na volání svého pána."
 custom.every_non_advanced_culture_vassal: "Každý [vassal|E], který není [advanced_culture.GetName]"
 custom.every_non_advanced_culture_unhooked_no_truce_vassal: "Každý [vassal|E], který není [advanced_culture.GetName] a se kterým nemáte [truce|E] ani [hook|E]"
 forcible_resettlement_modifier: "Nucené přesídlování"
 forcible_resettlement_modifier_desc: "Migranti vystěhovaní kvůli dovezeným osadníkům s pokročilejší kulturou zde vzbuzují prudký odpor."
 common_noble_cause_modifier: "Společná šlechtická věc"
 common_noble_cause_modifier_desc: "Tato postava inspiruje své soukmenovce pocitem společného cíle."
 cultural_acceptance_learning_from_culture: "Mezi těmito [cultures|E] se předalo [innovation|E]"
 bp2_yearly.6090.t: "Obnovené dědictví"
 bp2_yearly.6090.desc: "Hledal jsem uznání [advanced_culture.GetName], toužil po cizích zdobnostech, dělal ze sebe blázna kvůli svým snům. Už ne.\n\n"
 bp2_yearly.6090.burn_letters: "Různé dary poslané [advanced_court_owner.GetTitledFirstName] hoří, zatímco moji [ROOT.Char.GetCulture.GetName] šlechtici uctívají mé jméno.\n\n"
 bp2_yearly.6090.burn_else: "Hlavní část [advanced_culture.GetNameNoTooltip] výbavy shoří, zatímco moji [ROOT.Char.GetCulture.GetName] šlechtici uctívají mé jméno.\n\n"
 bp2_yearly.6090.reaffirm_social: "Když mocichtiví [advanced_culture.GetCollectiveNounNoTooltip] zneužívali mou chamtivost, moji vazalové vyzývali k opatrnosti."
 bp2_yearly.6090.reaffirm_realm: "Když jsem ničil naše země, oni stavěli krásné sídly a vyzbrojovali vynikající $knight_culture_player_plural_no_tooltip_lowercase$."
 bp2_yearly.6090.reaffirm_ritual: "I když jsem se provinil proti jejich dávným vírám, zůstal jsem v jejich modlitbách."
 bp2_yearly.6090.reaffirm_maa: "Riskovali svou čest, své životy, aby zabránili tomu, abych dal [ROOT.Char.GetPrimaryTitle.GetNameNoTier] cizincům."
 bp2_yearly.6090.outro: "\n\nMoje mládí v [childhood_location.GetCounty.GetTitle.GetNameNoTier] mě zavedlo na scestí. [ROOT.Char.GetCulture.GetCollectiveNoun] jsou můj lid. A nepotřebují 'civilizaci'."
 bp2_yearly.6090.a.bow: "Celý svět by se měl před námi sklonit."
 bp2_yearly.6090.a.strength: "Celý svět by měl pocítit naši sílu."
 bp2_yearly.6090.a.governed: "Celý svět by měl respektovat naši moudrost."
 bp2_yearly.6090.a.zeal: "Celý svět by měl poznat naše zanícení."
 bp2_yearly.6090.a.kin: "Celý svět by se měl podřizovat našemu rodu."
 bp2_yearly.6090.a.virtue: "Celý svět by měl obdivovat naši ctnost."
 bp2_yearly.6090.a.tt: "Rozžehněme naše starodávná pouta — v ohni, který spálí všechny, kdo by pochybyovali o [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]!"
 bp2_yearly.6090.tribal_invasion: "Můžete použít invazní [casus_belli|E] jednou navíc"
 bp2_yearly.6090.non_tribal_invasion: "Můžete použít invazní [casus_belli|E] jednou"
 bp2_yearly.6090.no_invasion_req: "Vaše invazní [casus_belli|E] nemá požadavek na [prestige_level|E]"
 bp2_yearly.6090.b: "Musíme chránit naši zemi, naše rodiny, navěky."
 bp2_yearly.6090.b.tt: "Srdce mi puká při představě ztráty všeho, co máme. Stůjme pevně, buďme oddaní: toto se nesmí stát."
 bp2_yearly.6090.traditionalist_traditions: "Získáte slevy na související [traditions|E]"
 a_cultures_great_defender_modifier: "Největší obránce lidu"
 a_cultures_great_defender_modifier_desc: "Po překonání vlny pochybností se tato postava stala pro svůj lid proslulým hrdinou a oddaným ochráncem vlasti."
 inspired_defenders_modifier: "Inspirace v otroctví a v odporu"
 inspired_defenders_modifier_desc: "Obyvatelé této země jsou zuřivě ochranitelští ke svému majetku a horlivě brání svého pána."
 uniter_and_conqueror_modifier: "Spojitel a dobyvatel"
 uniter_and_conqueror_modifier_desc: "Tento vizionářský vůdce zkoušel odvahu svého lidu, až se všem jasně ukázala velikost jejich sdíleného osudu."
 cultural_acceptance_loss_rejected_influence: "Reformátor odmítl jinou kulturu a zvolil izolaci"
 bp2_yearly.6091.t: "Neměnný lid"
 bp2_yearly.6091: "Mezi dvořany mých přepychových síní i vesnickým drobotem měly mé neúspěšné reformy značný dopad.\n\nOtřesy zatvrdily srdce každého [ROOT.Char.GetCulture.GetName] proti cizincům. Panuje podezřívavost a nepřátelství, ale stejně tak přetrvává milé praktikování našich starých tradic, radostné slavnosti a hrdý vojenský duch.\n\nMoji poradci mi tlumočí naděje lidu: že vůdci jako já se obrátí k tradici, víře,"
 bp2_yearly.6091.dominance: "a jejich osud v následujících letech."
 bp2_yearly.6091.defense: "a jejich obranu v následujících letech."
 bp2_yearly.6091.a: "Oslavme vše, čím jsme."
 bp2_yearly.6091.a.tt: "...a nic jiného."
 bp2_yearly.6091.aggressive: "Vaše [culture|E] nyní platí méně [prestige|E] za [GetCultureTradition('tradition_ruling_caste').GetName], [GetCultureTradition('tradition_hereditary_hierarchy').GetName], [GetCultureTradition('tradition_staunch_traditionalists').GetName], [GetCultureTradition('tradition_zealous_people').GetName], [GetCultureTradition('tradition_faith_bound').GetName], a [GetCultureTradition('tradition_warrior_culture').GetName]"
 bp2_yearly.6091.defensive: "Vaše [culture|E] nyní platí méně [prestige|E] za [GetCultureTradition('tradition_isolationist').GetName], [GetCultureTradition('tradition_hereditary_hierarchy').GetName], [GetCultureTradition('tradition_tribe_unity').GetName], [GetCultureTradition('tradition_staunch_traditionalists').GetName], [GetCultureTradition('tradition_stalwart_defenders').GetName], [GetCultureTradition('tradition_zealous_people').GetName], a [GetCultureTradition('tradition_faith_bound').GetName]"
 bp2_yearly.6100.t: "Můj [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip], znovuzrozen!"
 bp2_yearly.6100.desc: "Léta posměchu a podezření, obětí a otřesů... to vše bylo pro toto.\n\nKdyž se můj [ROOT.Char.GetCulture.GetCollectiveNoun] klaní přede mnou, poslední slova mého největšího reformatorského dekretu se dunivě recitují. Budeme vládnout novým, [advanced_culture.GetName]-inspirovaným způsobem. Budeme stavět, až se vyrovnáme slávě [childhood_location.GetCounty.GetTitle.GetNameNoTier]. A každé dítě [ROOT.Char.GetCulture.GetNameNoTooltip] se naučí dovednosti — pozná zázraky — které jsem znal v mládí.\n\nMnohé bylo změněno!"
 bp2_yearly.6100.reform_court: "Nová elegance oživuje můj dvůr."
 bp2_yearly.6100.reform_maa: "Železné zbraně a slova zákona hájí mou vládu."
 bp2_yearly.6100.reform_faith: "Má víra je soustředěná, zdokonalená, vznešená."
 bp2_yearly.6100.reform_realm: "Obchod kvete, osady rostou a každý den do mé znovuzrozené [ROOT.Char.GetPrimaryTitle.GetNameNoTier] přichází více migrantů."
 bp2_yearly.6100.outro: "\n\nStále jsem [ROOT.Char.GetCulture.GetNameNoTooltip]. Ale jsem novým [ROOT.Char.GetCulture.GetNameNoTooltip]."
 bp2_yearly.6100.a: "Tohle je mé dědictví - musí být absolutní!"
 bp2_yearly.6100.a.tt: "Větší změny jsou nákladné, všichni malomocní držitelé půdy se těžko přemlouvají... ale mohli bychom se ještě více přizpůsobit [advanced_culture.GetCollectiveNounNoTooltip]!"
 bp2_yearly.6100.b: "Dokázal jsem to!"
 bp2_yearly.6100.b.tt: "Můj lid nemusí být tlačen dál. Už jsem je dovedl na počátek nového věku."
 cultural_acceptance_gain_completed_reform: "Vládce kompletně přetvořil své království podle vzoru jiné kultury"
 bp2_yearly.6100.2_more_innovations: "[root_scope.GetCulture.GetName] [culture|E] obdrží #high 2#! dodatečné [innovations|E] z kultury [advanced_culture.GetName]"
 bp2_yearly.6100.1_more_innovation: "[root_scope.GetCulture.GetName] [culture|E] obdrží #high 1#! dodatečné [innovation|E] z kultury [advanced_culture.GetName]"
 bp2_yearly.6100.gained_2_innovations: "[root_scope.GetCulture.GetName] [culture|E] obdržela #high 2#! náhodné [innovations|E] z kultury [advanced_culture.GetName]"
 bp2_yearly.6100.gained_1_innovation: "[root_scope.GetCulture.GetName] [culture|E] obdržela #high 1#! náhodné [innovation|E] z kultury [advanced_culture.GetName]"
 flourishing_settlements_modifier: "Vzkvétající osady"
 flourishing_settlements_modifier_desc: "S příchodem nových zvyků a technologií jsou místní vděční a prosperují."
 bp2_yearly.6110.t: "Cizí reformy"
 bp2_yearly.6110.realm: "Sleduji, jak sluha přikládá do ohně. Jeho světlo sotva stačí, ubohé srovnání s tmou té noci.\n\nMožná právě způsob, jak žijeme jako [ROOT.Char.GetCulture.GetCollectiveNoun], je tím, co je na vině. Takový mocný protivník k čelení — a mám v sobě ještě přesvědčení, abych obstál před všemi [ROOT.Char.GetPrimaryTitle.GetNameNoTier]?\n\nPřemýšlím o způsobu života [advanced_culture.GetName], jak žijí a vládnou. Možná stojí za to některé jeho části vnucovat mému lidu?"
 bp2_yearly.6110.combat: "Sleduji své domácí $knight_culture_player_plural_no_tooltip_lowercase$, jak lenoší v odpoledním slunci a vyprávějí si příběhy o svých činech.\n\nMěli své vítězství a bojují dobře v tradičním [ROOT.Char.GetCulture.GetName] stylu. Přesto... přemýšlím o dovednostech a taktikách ozbrojeného [advanced_culture.GetName]. Měli by si moji bojovníci osvojit jejich způsoby vedení války?\n\nNebo bychom měli přijmout nějakou jinou formu vlivu [advanced_culture.GetNameNoTooltip]?"
 bp2_yearly.6110.social: "Trh. Do mých uší se liní naše specifická [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] mluva [ROOT.Char.GetCulture.GetLanguage.GetName]. [ROOT.Char.GetCulture.GetCollectiveNoun], přestože se nade mnou vznášejí v úžasu, se starají o své každodenní starosti.\n\nVím, že jsem jim podobný, ale #EMP zároveň odlišný#!. Oni a [advanced_culture.GetCollectiveNoun] jsou odlišní.\n\nJe to něco, co změnit hbitě? I když jsem mezi nimi nedorůstal, moje rozmary jsou budoucností každého [ROOT.Char.GetCulture.GetNameNoTooltip]. Některé aspekty kultury [advanced_culture.GetNameNoTooltip] jsou mé k zavedení."
 bp2_yearly.6110.ritual: "Pravidla cizích bohů jsou odlišná, jak mi říkají, stejně jako pravidla lidí. A na různých místech lidé užívají odlišné věci — zatímco jejich bohové povzbuzují, co chtějí, ať už správně nebo ne.\n\n[ROOT.Char.GetFaith.HouseOfWorship] je tiché, kontemplativní.\n\nByli by předci [ROOT.Char.GetCulture.GetHeritage.GetName], [Select_CString(ROOT.Char.GetCulture.GetHeritage.IsFemale,'byla','byl')] by [ROOT.Char.GetFaith.HighGodName], tak pobouřeni... kdyby se zvyky mého lidu změnily? Ale který [advanced_culture.GetName] nejlépe sloužil těm, kteří mě vychovali?"
 bp2_yearly.6110.regional: "Procházím skoro prázdnou trůnní síní a bojuji se svými vzpomínkami a sny.\n\nPřenáším ulice [childhood_location.GetCounty.GetTitle.GetNameNoTier] nad budoucí [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier], vidím hostinu [advanced_culture.GetName] na stole [ROOT.Char.GetCulture.GetName], vedu reorganizované válečné družiny k jejich prvnímu ochutnání vítězství.\n\nCo dělá [advanced_culture.GetCollectiveNounNoTooltip] tak výjimečnými mezi národy? Takový zvyk lze přizpůsobit, ale začíná to mým dvorem, u mě."
 bp2_yearly.6110.a: "[considered_tradition_1.GetNameNoTooltip]"
 bp2_yearly.6110.b: "[considered_tradition_2.GetNameNoTooltip]"
 bp2_yearly.6110.c: "[considered_tradition_3.GetNameNoTooltip]"
 bp2_yearly.6110.d: "[considered_tradition_4.GetNameNoTooltip]"
 bp2_yearly.6110.e: "Raději zvážím jiné změny..."
 bp2_yearly.6110.e.tt: "Nedokážu si představit, že by si [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] osvojili tyto praktiky."
 cultural_acceptance_gain_adapted_tradition: "Byla přizpůsobena [tradition|E]"
 introduced_foreign_custom_modifier: "Zavedl cizí zvyk"
 introduced_foreign_custom_modifier_desc: "Aniž by dal svému lidu čas přizpůsobit se, tato postava vnutila všem podivný zvyk."
 repeated_foreign_reforms_modifier: "Opakované cizí reformy"
 repeated_foreign_reforms_modifier_desc: "Členové této kultury bouří kvůli útokům na jejich způsob života."
 assault_on_tradition_modifier: "Útok na tradici"
 assault_on_tradition_modifier_desc: "Během jednoho života tato postava učinila svou kulturu zcela nepoznatelnou."
 bp2_yearly.6120.t: "Kde jsou pouta zkoušena"
 bp2_yearly.6120.desc: "Můj rukojmí [hostage.GetName] neklidně, s nadějí, vrtí. [hostage.GetHerHis|U] [hostage.Custom2('RelationToMeShort', SCOPE.sC('hostage_giver'))] [hostage_giver.GetTitledFirstName] je blízko, tady v [ROOT.Char.GetCurrentLocation.GetName], a už je to dlouho, co tomu tak bylo.\n\n[hostage.Custom('GirlBoy')] nyní žije se mnou. [hostage.GetHerHis|U] [hostage.Custom2('RelationToMeShort', SCOPE.sC('hostage_giver'))] a já máme pakt. [hostage.GetFirstNameNoTooltip] je pod mou vládou a [hostage.GetSheHe] by měl být oddaný #EMP mně#!. Je riskantní nechat [hostage.GetHerHim] znovu zažít lásku k [hostage.GetHerHis] rodině...\n\n„Prosím,“ prosí [hostage.GetSheHe]. „Prosím, můj [ROOT.Char.GetTitleAsNameNoTooltip], strašně mi chybí můj [hostage.Custom2('RelationToMeShort', SCOPE.sC('hostage_giver'))]!“"
 bp2_yearly.6120.a: "Vychutnej si shledání. Je vzácné."
 bp2_yearly.6120.a.tt: "Ten [hostage.Custom('GirlBoy')] je přeci stále [hostage.GetDynastyHouseNameNoTooltip] a patří do milosti své rodiny."
 bp2_yearly.6120.b: "Očekával bych odměnu za tuto velkorysou laskavost!"
 bp2_yearly.6120.b.tt: "Proč držet rukojmí, když ne kvůli takovým vymoženostem?"
 bp2_yearly.6120.hook: "Pokud [hostage_giver.GetShortUIName] souhlasí, získáte [weak_hook|E] na [hostage_giver.GetHerHim]"
 bp2_yearly.6120.hook_acceptance: "[hostage_giver.GetShortUINamePossessive] [personality|E] určuje, zda [hostage_giver.GetSheHe] přijme"
 bp2_yearly.6120.c: "Pojď, promluvme si s [hostage_giver.GetHerHim] #EMP společně#."
 bp2_yearly.61020.c.tt: "Dokážu toho nudného člověka překonat šarmem a přimět [hostage_giver.GetHerHis] vlastní příbuzné, aby dávali přednost mé společnosti před [hostage_giver.GetHerHis]!"
 bp2_yearly.6120.c.success: "Převládáte v hovoru s [hostage_giver.GetFirstNameNoTooltip]"
 bp2_yearly.6120.c.failure: "Vypadáte jako příliš dotěrný otravář"
 bp2_yearly.6120.d: "#EMP Ticho!#! Zasloužíš si facku, [hostage.Custom('GirlBoy')]!"
 bp2_yearly.6120.d.tt: "[hostage.GetFirstNameNoTooltip] patří mně, ne do společnosti své rodiny. Bití mu pomůže si to pamatovat."
 bp2_yearly.6121.t: "Ztracený [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))|U]"
 bp2_yearly.6121.reunion: "Čekal jsem na tento okamžik. Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] [hostage.GetFirstName], rukojmí zajišťující můj klid, stojí přede mnou v [ROOT.Char.GetCurrentLocation.GetName].\n\n„[hostage.Custom2('RelationToMeShort', ROOT.Char)|U]!“\n\nKdyž se ke mně [hostage.GetSheHe] vrhá do náruče, zdá se, jako by nikdy neodešel. Přesto napětí v [hostage.GetHerHis] sevření prozrazuje touhu [hostage.Custom('GirlBoy')] po domově.\n\n[warden.GetTitledFirstName] [Select_CString(warden.IsFemale,'byla','byl')] laskavý, že nám dal tuto společnost, ale stále to není mnoho."
 bp2_yearly.6121.intrusion: "S [warden.GetTitledFirstName] po boku [hostage.GetHerHis] stojí [hostage.GetFirstName] přede mnou. Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] se od doby, kdy jsem ho poslal jako rukojmí, hodně změnil, ale [ROOT.Char.GetDynastyHouseName] poznám všude!\n\nObjímám [hostage.Custom('GirlBoy')]. Se snaží zůstat [Select_CString(hostage.IsFemale,'složená','složený')], ale pevnost [hostage.GetHerHis] sevření prozrazuje [hostage.GetHerHis] touhu po domově.\n\nPak [warden.GetTitledFirstNameNoTooltip] zasahuje, odváděje pozornost mého [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] řečmi o tomto shledání... a o místních úrodách [ROOT.Char.GetCurrentLocation.GetName]?\n\nPřesto děkuji [ROOT.Char.GetFaith.HouseholdGodName] jménem mé rodiny."
 bp2_yearly.6121.hook: "„Přemýšlíš, jestli se shledáš se svým [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))], že?“ vyptává se [warden.GetTitledFirstName]. „Ten [hostage.Custom('GirlBoy')] [hostage.GetFirstName], kterého jsi tak štědře obětoval ve jménu míru.“\n\n[warden.GetFirstNameNoTooltip] se zdá být až příliš spokojený sám se sebou.\n\n„Dokud jsme spolu v [ROOT.Char.GetCurrentLocation.GetName], můžeš sdílet společnost rukojmího, i když to ohrožuje naši dohodu...“\n\n„...pokud přísaháš, že toto mé velkorysost nebude zapomenuta.“"
 bp2_yearly.6121.forbidden: "„Myslel jsi si, jen proto, že ty a tvůj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] [hostage.GetFirstName] jste oba v [ROOT.Char.GetCurrentLocation.GetName], že budete trávit čas spolu?“\n\n[warden.GetTitledFirstName] zavrtí [warden.GetHerHis] hlavou.\n\n„Moje rukojmí je velmi zaneprázdněné. A tak po dobu naší dohody, [hostage.GetSheHe] patří jen mně.“\n\nOpravdu, sotva jsem zahlédl stopu po tom [hostage.Custom('GirlBoy')], který [Select_CString(ROOT.Char.IsFemale,'byla','byl')] poslán pryč..."
 bp2_yearly.6121.a: "„[hostage.GetFirstNameNoTooltip]! Vezmu tě domů.“"
 bp2_yearly.6121.a.tt: "Hanba stranou: [hostage.GetFirstNameNoTooltip] patří ke mně! Nechť [warden.GetTitledFirstNameNoTooltip] dělá, co chce."
 bp2_yearly.6121.b: "„Veliký dar, abys nezemřel hlady!“"
 bp2_yearly.6121.b.tt: "„Jez! Jez! A pyšně se ukaž jako [ROOT.Char.GetDynastyHouseNameNoTooltip].“"
 bp2_yearly.6121.c: "„Je dobré tě vidět, [hostage.Custom('GetLassLad')].“"
 bp2_yearly.6121.d: "Pro lásku k rodu [ROOT.Char.GetDynastyHouseNameNoTooltip] cokoliv."
 bp2_yearly.6121.d.tt: "Žádný můj příbuzný nebude opuštěn svým vlastním."
 bp2_yearly.6121.e: "Pro ukradené objetí nepotřebuji povolení..."
 bp2_yearly.6121.e.tt: "[warden.GetTitledFirstNameNoTooltip] mi nemůže zabránit v tom najít [hostage.GetFirstNameNoTooltip] a promluvit si s [hostage.GetHerHim], byť jen na okamžik."
 bp2_yearly.6121.e.success: "Propašujete se k objetí"
 bp2_yearly.6121.e.failure: "Jste přistižen"
 bp2_yearly.6121.f: "Hm. [hostage.GetHerHim] mi nechybí."
 bp2_yearly.6121.f.tt: "Jednou znovu uvidím [hostage.GetHerHim]... a to stačí."
 bp2_yearly.6122.t: "Nezapomenuto"
 bp2_yearly.6122.sneaking: "Když moji agenti rychle odvedli [hostage.GetFirstName] od stráží [warden.GetTitledFirstNamePossessive], využívajíc velkolepé večeře, vplížil jsem se i já na toto rodinné setkání.\n\nNehorázné okolnosti mě sotva zajímají, když mě můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] objímá, směje se mým vráskám, nadšený.\n\n[hostage.GetSheHe|U] [Select_CString(ROOT.Char.IsFemale,'byla','byl')] dlouho pryč a brzy se musí vrátit ke svému dohledci. Takový je řád věcí, ale nezávidím [hostage.GetHerHim] jeho/jejího přísného pána."
 bp2_yearly.6122.rescue: "Jak [warden.GetTitledFirstName] vřel, když jsem ho vykázal ze své přítomnosti, s [warden.GetHerHis] někdejším rukojmím [hostage.GetFirstName] po mém boku.\n\n„Vrátí se [warden.GetSheHe] zpět, [hostage.Custom2('RelationToMeShort', ROOT.Char)]?“ ptá se [hostage.Custom('GirlBoy')]. „[Select_CString(ROOT.Char.IsFemale,'Chtěla','Chtěl')] jsem se vrátit domů, ale... nechci, abys kvůli mně [Select_CString(ROOT.Char.IsFemale,'bojovala','bojoval')] s [warden.GetPrimaryTitle.GetNameNoTier].“\n\nUjišťuji [hostage.GetFirstNameNoTooltip] o opaku, ale pravda zůstává jasná.\n\nZlomil jsem pakt. K lepšímu nebo horšímu, může se ukázat, že jsem obětoval mír."
 bp2_yearly.6122.c: "„Společně vyčkáme toho, co přijde.“"
 bp2_yearly.6122.c.tt: "Pokud se ukáže, že jde o válku, alespoň [hostage.GetFirstNameNoTooltip] nebude první mezi padlými..."
 bp2_yearly.6123.t: "Potomek míru"
 bp2_yearly.6123.desc: "Shledání příbuzných je dojemné představení, nad nímž rád předsedám.\n\n[hostage_giver.GetTitledFirstName] vypráví [hostage.GetFirstName] několik moudrých podobenství, jak den ubíhá, a já v dobré náladě očekávám návrat svého rukojmí.\n\n„Pečujte o něj dobře,“ naléhá [hostage_giver.GetTitleAsNameNoTooltip], když odnáším [hostage_giver.GetHerHis] [hostage_giver.Custom2('RelationToMeShort', SCOPE.sC('hostage'))]. „Držte ho dál od cizinců jako jsem já.“"
 bp2_yearly.6123.stolen_hostage: "[hostage_giver.GetTitledFirstName] udělal to nepředstavitelné! Má spravedlnost [hostage_giver.GetSheHe] se setkává se zradou.\n\nTen psanec mě odhání, zatímco [hostage.Custom('GirlBoy')] [hostage.GetFirstName], symbol našeho míru, stojí nesprávně po boku [hostage_giver.GetHerHis]... a musím jít. Nemám tu skoro žádnou sílu. Je to urážka! Je to zahanbující!\n\nTeď jdu domů, uražený a opovrhovaný, bez jakýchkoli jistot, že nepřijde něco horšího.\n\n[hostage_giver.GetFirstNameNoTooltip] bude žít a litovat této pošetilosti, stejně jako já lituji, že jsem přivedl své rukojmí blízko takového dychtivého hada..."
 bp2_yearly.6123.favor_accepted: "Měl jsem pravdu... [hostage_giver.GetTitledFirstName] je [hostage_giver.Custom('WomanManPerson_GenderPreference')] ochotný být dotlačen.\n\nKdyž [hostage_giver.GetSheHe] drží [hostage.GetFirstName] blízko, něžnost, kterou [hostage_giver.GetSheHe] chová ke své rodině, je zřejmá.\n\nS novým dluhem, který mohu držet nad [hostage_giver.GetHerHim], a s tak milovaným rukojmím v mé péči, nevidím v následujících dnech hrozbu ze strany [hostage_giver.GetTitleAsNameNoTooltip]."
 bp2_yearly.6123.sneaker: "[hostage_giver.GetTitledFirstName], bezctný krysa, zdá se, nerespektuje mou autoritu nad [hostage_giver.GetHerHis] [hostage_giver.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] [hostage.GetFirstName].\n\n[hostage_giver.GetSheHe|U] popírá, že by poslal mazané služebníky, aby odvedli [hostage.Custom('GirlBoy')] od mé dobře střežené večeře. Ale vím, že [hostage_giver.GetSheHe] se snaží jen porušit dohody mezi námi.\n\n„Lež!“ protestuje [hostage_giver.GetSheHe].\n\nDokud [hostage.GetSheHe] žije na mém dvoře, [hostage.GetFirstNameNoTooltip] #EMP musí#! zůstat daleko od [hostage_giver.GetTitleAsNameNoTooltip], vždy."
 bp2_yearly.6123.forbidden_desc: "Ačkoliv mám podezření, že to [hostage_giver.GetHerHim] rozčiluje, [hostage_giver.GetTitledFirstName] respektoval mé rozhodnutí ohledně toho, zda se může setkat se svým [hostage_giver.Custom2('RelationToMeShort', SCOPE.sC('hostage'))].\n\n„Sotva mi ten [hostage.Custom('GetLassLad')] chybí,“ tvrdí [hostage_giver.GetSheHe]. „Skoro mě těší, že se musíš ještě chvíli potýkat s jeho pošetilostí.“\n\nTak to musí být… kromě toho je dobré vyzkoušet [hostage_giver.Custom('WomanManPerson_GenderPreference')] a zjistit, kde [hostage_giver.GetSheHe] stojí."
 bp2_yearly.6123.a: "To je ale rodina, [hostage_giver.Custom('WomanManPerson_GenderPreference')], [hostage_giver.GetFirstNameNoTooltip]."
 bp2_yearly.6123.return_hostage: "[hostage.GetShortUIName] už není tvůj [hostage|E]"
 bp2_yearly.6130.t: "Zajatec, okouzlen"
 bp2_yearly.6130.desc.different_ages: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] [kin.GetFirstName] a rukojmí [hostage.GetName] se navzdory věkovému rozdílu stávají čím dál neoddělitelnějšími.\n\nStarší z nich toho druhého pevně chrání a poskytuje mu moudré rady o světě, zatímco mladší nikdy nezklame v tom, aby vykouzlil úsměv.\n\nKdyž sleduji tyto nepravděpodobné společníky, nemohu si pomoci a lituji je kvůli nadcházejícímu odloučení. Jednoho dne dohoda o rukojmích s příbuzným [hostage.GetFirstNamePossessiveNoTooltip] skončí..."
 bp2_yearly.6130.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] [kin.GetFirstName] a rukojmí [hostage.GetName] se zdají stávat pevnými druhy, důvěrnými přáteli.\n\n[hostage.GetFirstNameNoTooltip], když teskní po domově, je vždy rozveselen [kin.GetFirstNameNoTooltip]. Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))], na kterého někdy doléhá jeho postavení, má [hostage.GetFirstNameNoTooltip], aby ho doprovázel v jeho povinnostech.\n\nKdyž sleduji, jak tyto dvě děti sdílejí radosti, nemohu si pomoci a lituji je kvůli nadcházejícímu odloučení. Jednoho dne dohoda o rukojmích s příbuzným [hostage.GetFirstNamePossessiveNoTooltip] skončí..."
 bp2_yearly.6130.a: "„Přísaháte, že se budete navzájem podporovat, navždy.“"
 bp2_yearly.6130.a.tt: "Pouto mezi našimi dvory… možná stojí za to ho rozvíjet?"
 bp2_yearly.6130.b: "„Láska k rodině má být nade vše!“"
 bp2_yearly.6130.b.tt: "Jdi si hrát s někým, kdo tu pro tebe vždy bude, [kin.Custom('GirlBoy')]."
 bp2_yearly.6130.family_opinion: "[kin.GetShortUIName] získá #P 30#! [opinion|E] u své [close_family|E]"
 bp2_yearly.6130.alliance: "Pokud se oba stanou [rulers|E], [kin.GetShortUIName] a [hostage.GetShortUIName] mohou vyjednat [alliance|E]"
 bp2_yearly.6140.t: "Příliš mladý na přátelství" # todo: NEW TRANSLATION
 bp2_yearly.6140.desc: "Když posvátné obřady rozptýlí všechny dozorce, můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] [kin.GetFirstName] a rukojmí [hostage.GetName] projevují svoji rostoucí nenávist.\n\n\"Můj [kin.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))] je nejsilnější [ROOT.Char.GetTitleAsName] v celé zemi!\" syčí [kin.GetFirstNameNoTooltip]. \"Jednoho dne, díky jemu, bude hanebný [home_court.GetPrimaryTitle.GetNameNoTier v plamenech, a tvá hlava bude viset na sedle $knight_culture_player_no_tooltip_lowercase$!\"\n\n\"Kéž by mě vzal domů,\" odpovídá [hostage.GetFirstNameNoTooltip], \"tam by ses smrtelně bál mě urazit!\"\n\nKdy se můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] začal takhle vyjadřovat? A navíc k poctěnému hostu!" # todo: NEW TRANSLATION
 bp2_yearly.6140.a: "Soutěž ostří důvtip mého [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))]." # todo: NEW TRANSLATION
 bp2_yearly.6140.a.tt: "Ponížit [hostage.GetHerHim], [kin.Custom('GirlBoy')]! [hostage.GetFirstNameNoTooltip] je nepřítel doslova na dosah." # todo: NEW TRANSLATION
 bp2_yearly.6140.b: "Rukojmí nejsou drženi kvůli konfliktu, ale kvůli míru." # todo: NEW TRANSLATION
 bp2_yearly.6140.b.tt: "Lépe se modlit #EMP proti#! stínání hlav, děti." # todo: NEW TRANSLATION
 bp2_yearly.6150.t: "Ujištění promlouvá" # todo: NEW TRANSLATION
 bp2_yearly.6150.desc: "Rukojmí jsou obvykle přítomni, postaveni vedle úředníků a rodiny, když takoví [ROOT.Char.GetTitleAsName] jako já přijímají žádosti a konají obřady.\n\nMé rukojmí [hostage.GetFirstName] si toho neužívá.\n\n\"Prosím, abych [Select_CString(ROOT.Char.IsFemale,'byla','byl')] předváděn/a, abych [Select_CString(ROOT.Char.IsFemale,'byla','byl')] trofejí...\" protestuje [hostage.GetSheHe], zatímco poslední žadatelé odcházejí.\n\n\"Cítím se jako nějaký duch vytržený z [hostage.GetFaith.NegativeAfterLife]. Všichni na mě zírají... vědí, že sem nepatřím.\"" # todo: NEW TRANSLATION
 bp2_yearly.6150.a: "Patříš k mé rodině. Stůj po jejich boku." # todo: NEW TRANSLATION
 bp2_yearly.6150.a.tt: "Není čeho se bát! Jsi prakticky jeden z nás." # todo: NEW TRANSLATION
 bp2_yearly.6150.b: "Jdi studovat k [ROOT.Char.GetFaith.PriestNeuterPlural], tuším..." # todo: NEW TRANSLATION
 bp2_yearly.6150.b.tt: "Mohu se postarat o svou vlastní velkolepost: mou první povinností k těmto rukojmím je je kultivovat." # todo: NEW TRANSLATION
 bp2_yearly.6150.c: "Jsi můj, budu s tebou zacházet, jak mi libo." # todo: NEW TRANSLATION
 bp2_yearly.6150.c.tt: "Nemohu dovolit, aby mi rukojmí určovalo, co mám dělat." # todo: NEW TRANSLATION
 hostages_accepted_into_family_modifier: "Přijímání rukojmích do rodiny" # todo: NEW TRANSLATION
 hostages_accepted_into_family_modifier_desc: "Vznešený a obřadný hostitel, který dává najevo, že rukojmí jsou považováni za příbuzné." # todo: NEW TRANSLATION
 eschews_flaunting_of_hostages_modifier: "Vyhýbá se předvádění rukojmích" # todo: NEW TRANSLATION
 eschews_flaunting_of_hostages_modifier_desc: "Rukojmí tohoto panovníka jsou opečováváni a vychováváni, nejsou předváděni." # todo: NEW TRANSLATION
 bp2_yearly.6150.family_opinion_hostage: "[hostage.GetShortUIName] získá #P 20#! [opinion|E] od vaší [close_family|E]" # todo: NEW TRANSLATION
 bp2_yearly.6160.t: "Nejhorší z mých jezdců" # todo: NEW TRANSLATION
 bp2_yearly.6160.desc: "Mezi vzlyky a lhaním se dovídám pravdu o uplynulé noci.\n\nMůj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] [kin.GetFirstName] a rukojmí [hostage.GetFirstName] v noci vyklouzli ven. Zvědaví na svět mimo můj dům, vplížili se do osady.\n\nObdivujíce koně místní rodiny byli brzy odhaleni — a ujeli na ukradených hřebcích.\n\nNemotorné děti zajely do příkopu.\n\n\"[hostage.GetFirstNameNoTooltip mě k tomu pobízel/a!\" vzlyká mé zraněné [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))], jako vesničané, kteří oplakávají svého teď kulhavého koně." # todo: NEW TRANSLATION
 bp2_yearly.6160.a: "Okuste práci, abyste splatili své dluhy." # todo: NEW TRANSLATION
 bp2_yearly.6160.a.tt: "Děti chtějí zažít život lidu? Nechte je chvilku pracovat pro majitele koně." # todo: NEW TRANSLATION
 bp2_yearly.6160.b: "Ublížíš mému [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))], rukojmí?! #EMP Pryč!#!" # todo: NEW TRANSLATION
 bp2_yearly.6160.b.tt: "Žádné příměří nestojí za to, ohrozit mou rodinu přítomností téhle havěti!" # todo: NEW TRANSLATION
 bp2_yearly.6160.c: "#EMP Ach.#! Asi to zaplatím..." # todo: NEW TRANSLATION
 bp2_yearly.6160.d: "Vyléčit koně? Příliš snadné." # todo: NEW TRANSLATION
 bp2_yearly.6160.e: "Jsou to děti! To se stává." # todo: NEW TRANSLATION
 bp2_yearly.6160.e.tt: "Nechte tyto rošťáky být. Žádný skandál tu není." # todo: NEW TRANSLATION
 labored_with_the_commons_modifier: "Pracoval mezi lidmi" # todo: NEW TRANSLATION
 labored_with_the_commons_modifier_desc: "Známý tím, že dřel mezi konšely a chovateli koní, aby odčinil bláznivosti mládí." # todo: NEW TRANSLATION
 renowned_knowledge_of_horses_modifier: "Proslulé znalosti o koních" # todo: NEW TRANSLATION
 renowned_knowledge_of_horses_modifier_desc: "Mnozí se obracejí na tohoto člověka pro radu při léčení koní a posilování jejich síly." # todo: NEW TRANSLATION
 bp2_yearly.6200.t: "Kde [ROOT.Char.Custom('KnightCulturePluralNoTooltip')] znají mír" # todo: NEW TRANSLATION
 bp2_yearly.6200.desc: "Zatímco mé rady plánují obranu [ROOT.Char.GetPrimaryTitle.GetNameNoTier], je přivedeno mé rukojmí [hostage.GetName].\n\n\"Vznešený [ROOT.Char.GetTitleAsName], zacházel jste se mnou dobře a spravedlivě. Když hrozí zkáza, je správné, že v [home_court.GetPrimaryTitle.GetNameNoTier], mé vlasti, [home_court.Custom('KnightCulturePluralNoTooltipLowercase')] zahálejí se staženými prapory?\"\n\n[hostage.GetSheHe|U] se kleká.\n\n\"Dovol mi cestovat — ponesu naši žádost o pomoc [home_court.GetTitledFirstName]! Jsem krví [home_court.GetHerHis]. [home_court.GetSheHe|U] tě podpoří kvůli mně!\"" # todo: NEW TRANSLATION
 bp2_yearly.6200.a: "Jdi a vrať se se železem." # todo: NEW TRANSLATION
 bp2_yearly.6200.a.tt: "Prosím, buď věrný! Prosím, doruč mi pomoc v této hodině nouze!" # todo: NEW TRANSLATION
 bp2_yearly.6200.hostage_travel: "[hostage.GetShortUIName] odcestuje do [home_court.GetCapitalLocation.GetTitle.GetName]" # todo: NEW TRANSLATION
 bp2_yearly.6200.hostage_warning: "@alert_icon! #alert_trial [hostage.GetShortUIName] může přestat být vaším [hostage|E]#!" # todo: NEW TRANSLATION
 bp2_yearly.6200.war_positive: "[home_court.GetShortUIName] může pomoci ve vašem [war|E]" # todo: NEW TRANSLATION
 bp2_yearly.6200.b: "Vezmi si s sebou pěkný dar." # todo: NEW TRANSLATION
 bp2_yearly.6200.b.tt: "Štědrost rozproudí chuť [home_court.GetTitleAsNameNoTooltip] k válce." # todo: NEW TRANSLATION
 bp2_yearly.6200.c: "Vezmi věrného [target_knight.GetFirstNameNoTooltip] a pospěš!" # todo: NEW TRANSLATION
 bp2_yearly.6200.war_very_positive: "#P [home_court.GetShortUIName] bude s větší pravděpodobností pomáhat ve vašem [war|E]#!" # todo: NEW TRANSLATION
 bp2_yearly.6200.c.tt: "Silný doprovod... a někdo, kdo zajistí, že [hostage.GetFirstNameNoTooltip] nezapomene na mé zájmy." # todo: NEW TRANSLATION
 bp2_yearly.6200.hostage_positive: "#P [hostage.GetShortUIName] má větší šanci vrátit se do vašeho [court|E]#!" # todo: NEW TRANSLATION
 bp2_yearly.6200.hostage_travel_knight: "[hostage.GetShortUIName] a [target_knight.GetShortUIName] odcestují do [home_court.GetCapitalLocation.GetTitle.GetName]" # todo: NEW TRANSLATION
 bp2_yearly.6200.imprison_warning: "@alert_icon! #alert_trial [target_knight.GetShortUIName] může být uvězněn [home_court.GetShortUIName]#!" # todo: NEW TRANSLATION
 bp2_yearly.6200.d: "Ne, nemohu dovolit, aby rukojmí odjelo." # todo: NEW TRANSLATION
 bp2_yearly.6200.d.tt: "Není žádná záruka, že se vrátíš! Nemohu zaručit, že [home_court.GetTitledFirstNameNoTooltip] by raději nevyhledal útěchu u mých nepřátel." # todo: NEW TRANSLATION
 bp2_yearly.6202.t: "[hostage.Custom2('AppropriateGreeting', ROOT.Char )]" # todo: NEW TRANSLATION
 bp2_yearly.6202.opening: "Znovu jsem v [home_court.GetCapitalLocation.GetTitle.GetNameNoTier]." # todo: NEW TRANSLATION
 bp2_yearly.6202.assembled_nobles: "Významní šlechtici zaplnili [home_court.GetTitleAsNamePossessive] dvůr, když jsem pronesl vaši prosbu.\n\n" # todo: NEW TRANSLATION
 bp2_yearly.6202.nostalgia: "Váněk prochází známými stromy. Zde jsem dal na vědomí váš boj.\n\n" # todo: NEW TRANSLATION
 bp2_yearly.6202.impatient: "Malicherní šlechtici, kteří mě znali jen jako dítě, pobrukovali, když jsem začal vaši prosbu, a pak ztichli.\n\n" # todo: NEW TRANSLATION
 bp2_yearly.6202.received_empathy: "Shromáždění plakalo nad neštěstím [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessive]. Můj [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] působil hluboce dojatě" # todo: NEW TRANSLATION
 bp2_yearly.6202.received_debate: "Rozhořel se vášnivý spor. Můj [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))], ač není vaším spojencem, chce být obhájcem rodiny [home_court.GetHerHis]" # todo: NEW TRANSLATION
 bp2_yearly.6202.received_scorn: "\"Na jakém právu žádá [ROOT.Char.GetSheHe] naši pomoc?\" ptali se mě, a měl jsem málo odpovědí. Můj [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] se zdá nespokojen" # todo: NEW TRANSLATION
 bp2_yearly.6202.received_apathy: "Někteří se vůbec nestarají, zatímco někteří [home_court.Custom('KnightCulturePluralNoTooltipLowercase')] čekají na slovo mého [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))]. [home_court.GetSheHe|U] se ptá, kdy doufám vyrazit" # todo: NEW TRANSLATION
 bp2_yearly.6202.fears_returning: "— a [home_court.GetSheHe] obává mého návratu do tvé sužované země." # todo: NEW TRANSLATION
 bp2_yearly.6202.awaiting: "— přesto stále čekáme na rozsudek [home_court.GetHerHis]." # todo: NEW TRANSLATION
 bp2_yearly.6202.want_to_stay: "— přesto je příliš [Select_CString(home_court.IsFemale,'moudrá','moudrý')] na rychlé soudy." # todo: NEW TRANSLATION
 bp2_yearly.6202.want_to_return: "— přesto mě [home_court.GetSheHe] nechává tu zdržet, zatímco válka pokračuje!" # todo: NEW TRANSLATION
 bp2_yearly.6202.a: "Alespoň [hostage.GetFirstNameNoTooltip] je stále naživu." # todo: NEW TRANSLATION
 bp2_yearly_6203_army_name: "[ROOT.Var( 'bp2_yearly_6203_army_name_origin' ).Char.GetFirstNamePossessiveNoTooltip] [ROOT.Var( 'bp2_yearly_6203_army_name_origin' ).Char.GetHomeCourt.GetPrimaryTitle.GetAdjectiveNoTooltip] Host" # todo: NEW TRANSLATION
 bp2_yearly.6203.t: "[ROOT.Char.GetNameNoTooltip]," # todo: NEW TRANSLATION
 bp2_yearly.6203.join_war: "[home_court.GetPrimaryTitle.GetNameNoTier] stojí po vašem boku! Můj [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))], neohrožený [home_court.GetTitledFirstName], ctí svazek mezi vámi a [home_court.GetSheHe] silou zbraní.\n\nAť nikdo neohrozí síň, která hostí [hostage.GetDynastyHouseName]!\n\n" # todo: NEW TRANSLATION
 bp2_yearly.6203.assist: "Je smutné pro [home_court.GetName], že [home_court.GetSheHe] nemůže přijít vám na pomoc. Přesto jsme svyzbrojeni nadějí na válku a její slávu, shromáždili jsme sílu žebravých tuláků a [home_court.GetPrimaryTitle.GetAdjectiveNoTooltip] dobrodruhů! Ať bojují dobře pro [ROOT.Char.GetPrimaryTitle.GetNameNoTier].\n\n" # todo: NEW TRANSLATION
 bp2_yearly.6203.betray: "Nemůžeme ignorovat slabost, kterou vaše prosby prozrazují. [home_court.GetTitledFirstName] se spolehne raději na sílu vašeho nepřítele. Připravte se na [home_court.GetHerHis] příchod.\n\nPoté, co můj [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] vyplenil vaše hlavní město, možná mě znovu uvidíte na vašem dvoře." # todo: NEW TRANSLATION
 bp2_yearly.6203.decline: "Udělal jsem, co jsem mohl, ale [home_court.GetTitledFirstName] v vašich argumentech mnoho nevidí. Bez aliance [home_court.GetPrimaryTitle.GetNameNoTier] nevyráží, když volá [ROOT.Char.GetPrimaryTitle.GetNameNoTier]. Můj [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] vám děkuje za to, že jste mě poslali k [home_court.GetHerHim], a posílá [home_court.GetHerHis] pozdravy.\n\n" # todo: NEW TRANSLATION
 bp2_yearly.6203.dont_keep_knight: "Mé místo je na vašem dvoře, takže [target_knight.GetFirstName] a já se brzy vrátíme." # todo: NEW TRANSLATION
 bp2_yearly.6203.dont_keep: "Mé místo je na vašem dvoře, takže se brzy vrátím." # todo: NEW TRANSLATION
 bp2_yearly.6203.keep: "Ale už nejsem vaše rukojmí." # todo: NEW TRANSLATION
 bp2_yearly.6203.a: "Bůh je žehnej! Naše pouto přesahuje stav rukojmí." # todo: NEW TRANSLATION
 bp2_yearly.6203.a.tt: "A [home_court.GetFirstNameNoTooltip] bere zbraň, aby bránil příbuzné, vyslyší prosby potřebných — [home_court.GetSheHe] se zdá být dobrým spojencem." # todo: NEW TRANSLATION
 bp2_yearly.6203.b: "#EMP Zrada!#! Zmořím zemi krví!" # todo: NEW TRANSLATION
 bp2_yearly.6203.b.tt: "Přemohu všechny nepřátele a vykonám svou pomstu!" # todo: NEW TRANSLATION
 bp2_yearly.6203.c.positive: "Do zbraní, [hostage.GetFirstNameNoTooltip]! #EMP Do zbraní!#!" # todo: NEW TRANSLATION
 bp2_yearly.6203.c.negative: "[Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] jsem blázen, že jsem [hostage.GetHerHim] poslal z dohledu..." # todo: NEW TRANSLATION
 bp2_yearly.6203.c.tt: "Já tě ochraňuji, ale ty ochraňuješ celé panství!" # todo: NEW TRANSLATION
 from_victory_vengeance_modifier: "Z vítězství, pomsta" # todo: NEW TRANSLATION
 from_victory_vengeance_modifier_desc: "Tento panovník žene armády a rytíře k nelítostným zvěrstvům, s cílem jednou pomstít minulé zrady." # todo: NEW TRANSLATION
 bp2_yearly.6204.t: "Prosba mé krve" # todo: NEW TRANSLATION
 bp2_yearly.6204.desc: "Pokrytý prachem z cesty a zápachem koňského potu se můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] [hostage.GetFirstName] nečekaně [Select_CString(hostage.IsFemale,'vrátila','vrátil')]!\n\n\"Neohrožuji vaše příměří, [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))],\" lapá po dechu [hostage.GetSheHe]. \"Válka sem nepřichází! Ne, strašná válka přichází do [warden.GetPrimaryTitle.GetNameNoTier] — do síně, kde mě drží jako rukojmí!\"\n\n" # todo: NEW TRANSLATION
 bp2_yearly.6204.desc_gift: "[hostage.GetSheHe|U] předkládá jak poselství, tak měšec zlatých od [warden.GetTitledFirstName]." # todo: NEW TRANSLATION
 bp2_yearly.6204.desc_chaperone: "[hostage.GetHerHis|U] ostražitý doprovod [target_knight.GetName] předkládá poselství od [warden.GetTitledFirstName]." # todo: NEW TRANSLATION
 bp2_yearly.6204.desc_outro: "\n\n\"Nemáš povinnost pomáhat,\" říká [hostage.GetFirstNameNoTooltip], \"ale můj vychovatel [Select_CString(hostage.IsFemale,'byla','byl')] ke mně dobrotivý! [warden.GetSheHe|U] si nezaslouží být zničen [attacker.GetName]!\"" # todo: NEW TRANSLATION
 bp2_yearly.6204.desc_none: "[hostage.GetSheHe|U] předkládá poselství od [warden.GetTitledFirstName]." # todo: NEW TRANSLATION
 bp2_yearly.6204.a: "Přiveďte mou [ROOT.Char.Custom('signature_weapon')]! #EMP My [ROOT.Char.GetDynastyHouseNameNoTooltip] se postavíme!#!" # todo: NEW TRANSLATION
 bp2_yearly.6204.a.tt: "Ať nikdo neohrozí síň, která hostí mé příbuzné!" # todo: NEW TRANSLATION
 bp2_yearly.6204.b: "Pomohu s placením a vyzbrojením síly." # todo: NEW TRANSLATION
 bp2_yearly.6204.b.tt: "Shromážděte ozbrojené mládence a žebravé tuláky, aby odjeli s [hostage.GetFirstNameNoTooltip]! Mohou bojovat bez mé formální účasti." # todo: NEW TRANSLATION
 bp2_yearly.6204.c: "Obrana [warden.GetPrimaryTitle.GetNameNoTierNoTooltip] není mou povinností." # todo: NEW TRANSLATION
 bp2_yearly.6204.c.tt: "Sdílíme jen příměří. Nejsme spojenci!" # todo: NEW TRANSLATION
 bp2_yearly.6205.t: "Do zemí svárů" # todo: NEW TRANSLATION
 bp2_yearly.6205.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] [hostage.GetFirstName] usedá na svého hřebce, smrtelně tichý. Před ním leží [warden.GetCapitalLocation.Custom('TerrainTypeProvince')] [warden.GetCapitalLocation.GetTitle.GetNameNoTier] — kde mohou číhat děsiví [attacker.GetPrimaryTitle.GetAdjective] [attacker.Custom('KnightCulturePluralNoTooltip')|l].\n\n" # todo: NEW TRANSLATION
 bp2_yearly.6205.desc_gift: "Mé pokladnice jsou naplněny dary od [warden.GetTitledFirstNamePossessive], ale mé rukojmí jede do války prakticky samo.\n\n" # todo: NEW TRANSLATION
 bp2_yearly.6205.desc_chaperone: "[target_knight.GetFirstName], [warden.GetTitledFirstNamePossessive] [warden.Custom2('RelationToMeShort', SCOPE.sC('target_knight'))], bude jediným doprovodem mého [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('hostage'))]. Držíce otěže u svého srdce, [target_knight.GetSheHe] přísahá zemřít za mou rodinu, pokud k tomu dojde.\n\n" # todo: NEW TRANSLATION
 bp2_yearly.6205.desc_none: "Několik otrhaných mládenců se shromáždilo, aby sloužili věci mého [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('hostage'))], ale všichni moji hostitelé zůstanou zde... zatímco [hostage.GetFirstNameNoTooltip] jede do [warden.GetTitledFirstNamePossessive] války.\n\n" # todo: NEW TRANSLATION
 bp2_yearly.6205.desc_outro: "A přesto — [Select_CString(ROOT.Char.IsFemale,'byla','byl')] to [warden.GetFirstNameNoTooltip], kdo mi přinesl tak děsivý obraz! Slabý [warden.GetWomanMan], [warden.GetSheHe] posílá vážené hosty jako mého [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))], aby se podrobili kvůli škubnutí meče!\n\nA mám věřit tomuto #EMP škůdci#! a jeho druhu, že ochrání mé příbuzné?" # todo: NEW TRANSLATION
 bp2_yearly.6205.a: "Mé [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] zůstane zde." # todo: NEW TRANSLATION
 bp2_yearly.6205.b: "Nechám [warden.GetFirstNameNoTooltip] trpět za tuto urážku!" # todo: NEW TRANSLATION
 bp2_yearly.6205.c: "No... hodně štěstí, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))]." # todo: NEW TRANSLATION
 bp2_yearly.6170.t: "Smlouva s necivilizovanými" # todo: NEW TRANSLATION
 bp2_yearly.6170.desc: "\"Žádný [ROOT.Char.GetDynastyHouseName] není potěšen tím, co jsi udělal!\" bruslí můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] [kin.GetFirstName].\n\n\"Jak jsi mohl poslat [hostage.GetName], mého [hostage.Custom('ComplimentAdjective')] [kin.Custom2('RelationToMeShort', SCOPE.sC('hostage'))], do zapáchající síně, kde barbarskí muži vykřikují '[warden.Custom('CulturalCurse')|U]!' a nikdy 'Chvála [ROOT.Char.GetFaith.HighGodName]'? Kde psi volně kakají na divochy i na místní pány [warden.GetCulture.GetName]?\"\n\nSkutečně, [warden.GetName] není kultivovaný jako [ROOT.Char.GetCulture.GetName], ale přesto docela hodný—\n\n\"[hostage.GetFirstNameNoTooltip] je držen jako rukojmí v chatrči!\" křičí [kin.GetFirstNameNoTooltip]. \"#EMP Postarej se o [hostage.GetHerHis] potřeby!#! Má práva jako [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))]!\"" # todo: NEW TRANSLATION
 bp2_yearly.6170.a: "Ano, je to urážka důstojnosti [hostage.GetHerHis] i mé vlastní." # todo: NEW TRANSLATION
 bp2_yearly.6170.a.tt: "Mé [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] musí mít všechny sofistikované pohodlí domova!" # todo: NEW TRANSLATION
 bp2_yearly.6170.b: "Povinnost k tvé rodině vás všechny poutá." # todo: NEW TRANSLATION
 bp2_yearly.6170.b.tt: "Oběť [hostage.GetFirstNamePossessiveNoTooltip] by měla být jen jednou z mnoha ve službě domu [ROOT.Char.GetDynastyHouseNameNoTooltip]." # todo: NEW TRANSLATION
 bp2_yearly.6170.c: "[hostage.GetSheHe|U] pozná, jak lidé jiní žijí." # todo: NEW TRANSLATION
 bp2_yearly.6170.c.tt: "Život mezi neotesanci naučí mého [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] obejít se bez ozdob, být tvrdý a vynalézavý..." # todo: NEW TRANSLATION
 bp2_yearly.6170.scheme_bonus: "[close_family|E] a [spouses|E] jsou více nakloněni připojit se k vašim [hostile_schemes|E] na #high 10 let#!" # todo: NEW TRANSLATION
