l_polish:
 bp2_yearly.6000.t: "Tohle nejsou [ROOT.Char.GetCulture.Custom('CZ_AdjectiveNoTooltip_ee')|l] způsoby"
 bp2_yearly.6000.desc.intro: "Když se mi představí [hosted_child.GetName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hosted_child'))|l], [tutor.GetName] líčí celý týden marného učení a zklamání."
 bp2_yearly.6000.desc.fault.bellicose: "\n\n„Nikdo tomu dítěti neřekl, že všechno, co chce, si musí #EMP vzít#!! [hosted_child.GetFirstNameNoTooltip|U] dává přednost míru s vrstevníky, místo aby [Select_CString(hosted_child.IsFemale,'dokázala','dokázal')|l], co v sobě má! Nic jiného [hosted_child.Custom('GirlBoy')|l] nezná!“"
 bp2_yearly.6000.desc.fault.bureaucratic: "\n\n„To dítě je zosobněný zmatek! Celé dny jen sní. Ani čisté spodní prádlo nerozezná od špinavého! [Select_CString(hosted_child.IsFemale,'Ta dívka','Ten chlapec')|U] nezná nic než chaos!“"
 bp2_yearly.6000.desc.fault.communal: "\n\n„To dítě pomlouvá vlastní matku! Nikdo [Select_CString(hosted_child.IsFemale,'ji','ho')|l] před tím nevaroval. [Select_CString(hosted_child.IsFemale,'Ta dívka vyrůstala','Ten chlapec vyrůstal')|U] bez vedení, [Select_CString(hosted_child.IsFemale,'odkázaná','odkázaný')|l] jen na sebe a bez zájmu o příbuzné, kteří na [Select_CString(hosted_child.IsFemale,'ni','něj')|l] čekají.“"
 bp2_yearly.6000.desc.fault.courtly: "\n\n„To dítě nezná nic vznešeného! Musím [Select_CString(hosted_child.IsFemale,'ji','ho')|l] klepnout přes hlavu, aby se před tebou vůbec [Select_CString(hosted_child.IsFemale,'uklonila','uklonil')|l], ó [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]. Dokáže přednést báseň? Způsobně oslovit opačné pohlaví? Ne!“"
 bp2_yearly.6000.desc.fault.egalitarian: "\n\n„Nikdo [Select_CString(hosted_child.IsFemale,'ji','ho')|l] neučil úctě k národům, s nimiž sdílíme svou zemi. To dítě napodobovalo přízvuk [realm_minority.Custom('CZ_AdjectiveNoTooltip_eeho')|l] hodnostáře tím, že bečelo jako ovce! Tohle má být výchova?!“"
 bp2_yearly.6000.desc.fault.egalitarian_no_culture: "\n\n„Nikdo [Select_CString(hosted_child.IsFemale,'ji','ho')|l] neučil úctě k národům, s nimiž sdílíme svou zemi. To dítě napodobuje jejich jazyky tím, že bečí jako ovce! Tohle má být výchova?!“"
 bp2_yearly.6000.desc.fault.spiritual: "\n\n„Zastaví se to dítě, aby poděkovalo za jídlo, kterého se mu dostalo? Prosí o boží pomoc? Ne! [Select_CString(hosted_child.IsFemale,'Byla vychována','Byl vychován')|U] k životu bez úcty.“"
 bp2_yearly.6000.desc.fault.stoic: "\n\n„To dítě ohrnuje nos nad krásou naší vlasti. Pohrdá povinností stát pevně, bojovat — bránit náš lid! [Select_CString(hosted_child.IsFemale,'Naučila se','Naučil se')|U] jen ufňukanému sobectví.“"
 bp2_yearly.6000.desc.mid: "\n\n[tutor.Custom('CZ_FirstNamePossessiveNoTooltip_M')|U] hněv se obrací proti [hosted_child.Custom2('CZ_RelationToMeShort_D', SCOPE.sC('childs_home_liege'))|l] dítěte.\n\n„Má v sobě vůbec "
 bp2_yearly.6000.desc.value.bellicose: "zápal a odvahu"
 bp2_yearly.6000.desc.value.bureaucratic: "zdravý rozum"
 bp2_yearly.6000.desc.value.communal: "lásku k blízkým a příbuzným"
 bp2_yearly.6000.desc.value.courtly: "úctu ke vznešeným mravům"
 bp2_yearly.6000.desc.value.egalitarian: "společenský takt"
 bp2_yearly.6000.desc.value.spiritual: "úctu k našim posvátným obřadům"
 bp2_yearly.6000.desc.value.stoic: "smysl pro povinnost vůči svému lidu"
 bp2_yearly.6000.desc.outro: " [childs_home_liege.GetTitledFirstName]? Jak by z takového dvora mohli vzejít řádní [ROOT.Char.GetCulture.Custom('CZ_AdjectiveNoTooltip_sti')|l] mladí lidé, když je tam neučí nic o našich tradicích?“"
 bp2_yearly.6000.a: "Všichni se dozvědí, jaké pohrdání projevuje [childs_home_liege.GetTitleAsNameNoTooltip]!"
 bp2_yearly.6000.a.tt: "Zastaň se [Select_CString(hosted_child.IsFemale,'nešťastné mladé','nešťastného mladého')|l] [hosted_child.Custom('CZ_FirstNameNoTooltip_G')], oběti lhostejnosti k našim zvykům ze strany [hosted_child.Custom2('CZ_RelationToMeShort_G', SCOPE.sC('childs_home_liege'))|l]."
 bp2_yearly.6000.a.response: "Ostatní [childs_home_liege.GetCulture.GetCollectiveNounNoTooltip] mohou mít o [childs_home_liege.Custom('CZ_ShortUIName_L')] horší [Concept('opinion','mínění')|E]"
 bp2_yearly.6000.b: "To dítě napravím [Select_CString(ROOT.Char.IsFemale,'sama','sám')|l]."
 bp2_yearly.6000.b.success: "Naše vznešené hodnoty zapustí hluboké kořeny"
 bp2_yearly.6000.b.failure: "Nechápe všechny zásady a přijímá je s hořkostí"
 bp2_yearly.6000.c: "S těmi zatracenými zvyky mě neobtěžuj."
