l_polish:
 bp2_yearly.8070.t: "Čas na hraní"
 bp2_yearly.8070.desc.intro: "Konečně mám chvíli jen pro sebe a můžu si hrát. Samozřejmě z truhly s hračkami vytáhnu "
 bp2_yearly.8070.desc.mid.horses: "svého věrného dřevěného koníka a představuji si, jak na něm vyrážím na velkolepý turnaj."
 bp2_yearly.8070.desc.mid.puppets: "své poslušné loutky a pustím se do hry. Je tak příjemné mít úplnou kontrolu nad jejich malými životy a rozehrávat s nimi nejrůznější příběhy přesně podle svých představ."
 bp2_yearly.8070.desc.mid.board_game: "svou oblíbenou hrací desku na [ROOT.Char.Custom('BG_GameType_Generic')|l]. Není nic lepšího než prokazovat svůj důvtip a sledovat, jak všechny figurky zapadají na správná místa. A kdo by mi mohl být lepším soupeřem než já?"
 bp2_yearly.8070.desc.mid.teetotum: "svou nevyzpytatelnou káču. Je tak uspokojivé sledovat, jak se točí a točí, a sázet na to, jak nakonec dopadne."
 bp2_yearly.8070.desc.mid.marbles: "své nádherné kuličky. Vždyť nic nedokáže spojit přátele lépe než pořádný pytlík kuliček a trocha představivosti!"
 bp2_yearly.8070.desc.outro: "\n\nJenže pak ke mně přistoupí [other_child.GetFirstName] a s očekáváním v očích se zeptá: „Můžu si hrát s tebou?“"
 bp2_yearly.8070.a: "Raději si budu hrát o samotě."
 bp2_yearly.8070.b: "S kamarádem je všechno zábavnější!"
 bp2_yearly.8070.b.success: "Společně si užijete spoustu zábavy"
 bp2_yearly.8070.b.failure: "Společné hraní se neobejde bez hádek"
 bp2_yearly.8071.t: "Oblíbená hračka z dětství"
 bp2_yearly.8071.desc.intro: "Při prohledávání svých starých věcí kvůli jakési státnické záležitosti narazím na něco důvěrně známého."
 bp2_yearly.8071.desc.mid.horses: "V zapadlém koutě mé šatní skříně, pohřbený pod hromadou oblečení, odpočívá malý dřevěný koník. V rukou mi připadá tak lehký a drobný. Vždyť tohle už jsou ruce [Select_CString(ROOT.Char.IsFemale,'dospělé ženy','dospělého muže')]. Kam se všechen ten čas poděl?\n\n"
 bp2_yearly.8071.desc.mid.puppets: "Na dně staré truhly leží malá sbírka zaprášených loutek. Jejich barvy vybledly a šaty se potrhaly během let nadšeného hraní i mnoha dalších let zanedbávání.\n\n"
 bp2_yearly.8071.desc.mid.board_games: "Na dně staré truhly leží má první deska na [ROOT.Char.Custom('BG_GameType_Generic')|l]. Chybí jí nejméně polovina figurek a sama je značně poškozená. Každý odštípnutý kousek a každá prasklina vyprávějí příběh z mého mládí, na který jsem už dávno [Select_CString(ROOT.Char.IsFemale,'zapomněla','zapomněl')].\n\n"
 bp2_yearly.8071.desc.mid.spinning_top: "Mezi státními listinami leží malá káča. Bývaly časy, kdy pro mě nic na světě nebylo důležitější než tahle točící se hračka. Dnes slouží sotva jako těžítko. Jak jsem [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] něco takového dopustit?\n\n"
 bp2_yearly.8071.desc.mid.marbles: "Mezi ostatními dávno zapomenutými věcmi objevím malý kožený váček plný zaprášených kuliček. Mnohé jsou poškozené nebo se ztratily, ale ty, které zůstaly, jsou pro mě cennější než zlato.\n\n"
 bp2_yearly.8071.desc.mid.other_child_alive: "Vzpomínám si na nesčetná letní odpoledne strávená hraním s [other_child.Custom('CZ_FirstName_I')], kdy se zdálo, že na ničem jiném nezáleží. Co asi [other_child.GetFirstNameNoTooltip] dělá dnes? A pamatuje si ještě na naše společné hry?\n\n"
 bp2_yearly.8071.desc.mid.other_child_dead: "Vzpomínám si, jak mé dětství naplňoval smích [other_child.Custom('CZ_FirstName_G')], když jsme si spolu hráli. Ten smích nikdy nezapomenu. A už ho nikdy neuslyším.\n\n"
 bp2_yearly.8071.desc.outro: "Teď, když držím svou nejoblíbenější hračku v rukou, připadá mi, jako bych v nich [Select_CString(ROOT.Char.IsFemale,'držela','držel')] celé své dětství."
 bp2_yearly.8071.a.puppet: "Znovu mohu tahat za nitky!"
 bp2_yearly.8071.a.gambler: "Vždycky jsem [Select_CString(ROOT.Char.IsFemale,'věděla','věděl')], kdy je lepší vsadit na jistotu."
 bp2_yearly.8071.a.marbles: "Musím lidi spojovat, tak jako mě kdysi spojovaly s ostatními kuličky."
 bp2_yearly.8071.a: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] bych si splnit své dětské sny."
 bp2_yearly.8071.b: "Podívám se, co teď dělá [other_child.GetFirstNameNoTooltip]!"
 bp2_yearly.8071.c: "Dnes už jsem jiný člověk. A to je v pořádku."
 bp2_yearly.8080.t: "[Select_CString(ward.IsFemale,'Dívčí','Chlapecký')|U] půvab"
 bp2_yearly.8080.desc: "Ať se snažím sebevíc, [target.Custom2('MyCharacterIntroduction', ROOT.Char)] mé city stále neopětuje. Přesto mám pocit, že jsem na stopě něčemu velkému. Vždyť [ward.Custom2('MyCharacterIntroduction', ROOT.Char)] je v mé výchově, a právě díky tomu bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] při svém dvoření konečně uspět!\n\nStačilo by drobné popostrčení a [ward.GetFirstNameNoTooltip] by možná [Select_CString(ward.IsFemale,'začala','začal')] vychvalovat mé přednosti. Všichni by tak viděli, jak skvěle to umím s dětmi. A takovému kouzlu by přece [Select_CString(target.IsFemale,'žádná žena','žádný muž')] [Select_CString(target.IsFemale,'nemohla','nemohl')] odolat!"
 bp2_yearly.8080.a: "Jdeme na to!"
 bp2_yearly.8080.a.likes.tt: "[ward.GetFirstNameNoTooltip|U] o tobě mluví v dobrém"
 bp2_yearly.8080.a.dislikes.tt: "[ward.GetFirstNameNoTooltip|U] o tobě mluví špatně"
 bp2_yearly.8080.b: "K něčemu takovému se nesnížím."
 bp2_yearly.8081.t: "Chvála na mou počest"
 bp2_yearly.8081.desc: "Pošlu [ward.Custom('CZ_FirstName_A')] za osobou, k níž chovám náklonnost. Netrvá dlouho a [target.GetFirstName] se na mě během rozhovoru s mým mladým svěřencem usměje."
 bp2_yearly.8081.a: "Jaké báječné dítě."
 bp2_yearly.8082.t: "Výsměch"
 bp2_yearly.8082.desc: "Pošlu [ward.Custom('CZ_FirstName_A')] za osobou, k níž chovám náklonnost, a očekávám jen to nejlepší. Zanedlouho se však [target.GetFirstName] po mně začne ohlížet a pokaždé, když [ward.GetFirstNameNoTooltip] otevře ústa, propukne v hlasitý smích.\n\nVětšinu rozhovoru neslyším, ale slova jako „[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('ward'))|l]“, „[ROOT.Char.Custom2('InsultNoun', SCOPE.sC('ward'))|l]“ a „smraďoch“ se ozývají podezřele často."
 bp2_yearly.8082.a: "Zatracené dítě!"
 bp2_yearly.8082.b: "Smraďoch? Tohle si musím vyřídit!"
 bp2_yearly.8090.t: "Důvěrně známé hračky"
 bp2_yearly.8090.desc: "[monk.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě uvede do spoře osvětlené místnosti. Přede mnou rozloží řadu starých hraček, všechny otlučené a poznamenané zubem času.\n\n„Už dlouho mám podezření, že v tobě znovu žije [ancestor.GetName]. Nyní, když ti je [ROOT.Char.GetAge] let, nastal čas tuto domněnku ověřit. Před sebou vidíš pět předmětů, ale pouze jeden z nich kdysi patřil [ancestor.Custom('CZ_FirstNameNoTooltip_D')], [Select_CString(ancestor.IsFemale,'slavné předkyni','slavnému předkovi')]. Vzpomínáš si na svůj předchozí život? Který z těchto předmětů je tvůj?“"
 bp2_yearly.8090.a: "Koník."
 bp2_yearly.8090.b: "Loutky."
 bp2_yearly.8090.c: "Deska na [ROOT.Char.Custom('BG_GameType_Generic')|l]."
 bp2_yearly.8090.d: "Káča."
 bp2_yearly.8090.e: "Kuličky."
 bp2_yearly.8090.f: "Ani jeden."
 ancestor_horse_guess_tt: "Máš pocit, že tvůj předek měl rád dřevěného koníka..."
 ancestor_puppet_guess_tt: "Máš pocit, že tvůj předek měl rád loutky..."
 ancestor_board_games_guess_tt: "Máš pocit, že tvůj předek měl rád hru [ROOT.Char.Custom('BG_GameType_Generic')|l]..."
 ancestor_spinning_tops_guess_tt: "Máš pocit, že tvůj předek měl rád káči..."
 ancestor_marbles_guess_tt: "Máš pocit, že tvůj předek měl rád kuličky..."
 ancestor_nothing_guess_tt: "Máš pocit, že tvého předka žádný z těchto předmětů nezajímal..."
 bp2_yearly.8091.t: "Znovuzrození!"
 bp2_yearly.8091.desc: "Jakmile vyslovím svou odpověď, [monk.GetName|U] údivem vytřeští oči a s posvátnou úctou přede mnou poklekne.\n\n„Úžasné dítě! Už nemám nejmenších pochyb! [ancestor.GetName|U] se v tobě skutečně znovu [Select_CString(ancestor.IsFemale,'narodila','narodil')]!“"
 bp2_yearly.8091.a: "Páni! A kdo to vlastně je?"
 bp2_yearly.8091.a.knew_them: "[Select_CString(ancestor.IsFemale,'Moje vlastní','Můj vlastní')|U] [ROOT.Char.Custom2('RelationToMeShort',ancestor)|l]... to jsem já!"
 bp2_yearly.8092.t: "Žádné znovuzrození"
 bp2_yearly.8092.desc: "Vyslovím svou odpověď a [monk.GetName] zklamaně klesne na kolena.\n\n„Běda, má představivost mě zřejmě zavedla příliš daleko. Tento předmět nepatřil [ancestor.Custom('CZ_Name_D')], a mé pátrání po [Select_CString(ancestor.IsFemale,'její','jeho')] duši tak musí pokračovat.“"
 bp2_yearly.8092.a: "Můžu to zkusit znovu?"
 bp2_yearly.8100.t: "Kutálení ze svahu"
 bp2_yearly.8100.desc: "Společně s ostatními dětmi si hraji v zahradách [CZProvNameNoTooltip(ROOT.Char.GetCurrentLocation,'G')]. Je to jedna z těch vzácných chvil, kdy nás nesledují bedlivé oči poručníků a vychovatelů.\n\nVšechno se seběhne tak náhle! Než se naději, ztratím půdu pod nohama a už se řítím dolů z prudkého svahu. [potential_crush.GetFirstName|U] mě pevně objímá a společně se kutálíme stále níž a níž. Když konečně dopadneme na úpatí kopce, mám hlavu jako v oblacích. [potential_crush.GetFirstNameNoTooltip|U] se na mě dívá přímo do očí, usmívá se a tiše se chichotá.\n\nKdyž ten pohled opětuji, ucítím v hrudi něco zvláštního. Co je to za pocit?"
 bp2_yearly.8100.a: "Láska!"
 bp2_yearly.8100.b: "Nenávist!"
 bp2_yearly.8100.c: "Špatné trávení!"
 bp2_yearly.8110.t: "Pozorní dvořané"
 bp2_yearly.8110.desc: "Nosit pod srdcem dítě je něco nádherného a posvátného, ale i ty nejobyčejnější každodenní činnosti se staly těžkou zkouškou mé trpělivosti. Naštěstí s postupujícím těhotenstvím přibývá lidí ochotných mi pomáhat.\n\n[caretaker_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] je mi neustále po ruce a plní každé mé přání. Chce tím prokázat oddanost nejen mně, ale i své víře. Kéž [caretaker_1.GetFaith.HighGodName] ocení takovou oddanost stejně jako já. [caretaker_2.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se zase zřejmě snaží získat si mou náklonnost tím, že mi ulehčuje každodenní starosti. A [caretaker_3.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi s neutuchající věrností dokáže splnit každou potřebu dřív, než ji vůbec vyslovím."
 bp2_yearly.8110.a: "„Děkuji vám všem.“"
 bp2_yearly.8110.b: "Vím, že na [caretaker_1.Custom('CZ_FirstNameNoTooltip_A')] se mohu vždy spolehnout."
 bp2_yearly.8110.c: "[caretaker_2.GetFirstNameNoTooltip|U] si [Select_CString(caretaker_2.IsFemale,'získala','získal')] mou náklonnost."
 bp2_yearly.8110.d: "[caretaker_3.GetFirstNameNoTooltip|U] přesně ví, co potřebuji."
 bp2_yearly.8120.t: "Břemeno těhotenství"
 bp2_yearly.8120.desc: "[spouse.Custom2('MyCharacterIntroduction', ROOT.Char)|U] čeká dítě a těhotenství už je znát na každém kroku. I ty nejjednodušší činnosti představují opravdovou námahu. Ležím v posteli a sleduji, jak se [spouse.GetFirstNameNoTooltip] s obtížemi svléká, přestože služebnictvo pomáhá, jak může.\n\nNakonec se ke mně [spouse.GetFirstNameNoTooltip] otočí s toužebným, ale unaveným pohledem, jako by mě [Select_CString(spouse.IsFemale,'prosila','prosil')] o pomoc."
 bp2_yearly.8120.a: "Postarám se o všechno, co potřebuješ."
 bp2_yearly.8120.b: "A od čeho máme služebnictvo?"
 bp2_yearly.8120.c: "Myslím, že vím, jak ti ulevit od stresu."
