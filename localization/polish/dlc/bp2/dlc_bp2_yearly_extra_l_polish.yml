l_polish:
 bp2_yearly_extra.0001.t: "[Select_CString(target_councilor.IsFemale,'Má oblíbená rádkyně','Můj oblíbený rádce')]"
 bp2_yearly_extra.0001.desc: "Pozorovat práci rady je fascinující. Už nějakou dobu sleduji její jednání a obzvlášť mě zajímá [ROOT.Char.Custom2('RelationToMe', target_councilor)] [target_councilor.GetTitledFirstName].\n\nJe mi jasné, že sdílíme stejné zájmy. Zjišťuji, že s radou trávím stále více času."
 bp2_yearly_extra.0001.a: "Chci přiložit ruku k dílu!"
 bp2_yearly_extra.0001.a.tt: "Pomůžeš, nebo spíš naděláš nepořádek? Nejvíc se naučíš, když přiložíš ruku k dílu. "
 bp2_yearly_extra.0001.b: "Raději se jen dívám, jak pracují."
 bp2_yearly_extra.0001.b.tt: "Vždy je bezpečnější držet se stranou a dělat si poznámky."
