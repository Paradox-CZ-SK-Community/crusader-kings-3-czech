l_polish:
 enact_legacy_of_adventurer_decision: "Odkaz rodu [GetPlayer.GetHouse.GetBaseNameNoTooltip]"
 enact_legacy_of_adventurer_decision_desc: "Během let se můj skromný tábor rozrostl co do velikosti i ducha.\n\nS každým splněným úkolem sílí naše pouto k této zemi a jejím obyvatelům. O našich činech se zpívá v krčmách a naše jména se šeptají ve tmě, a tak tomu bude po celé příští generace."
 enact_legacy_of_adventurer_decision_confirm: "Ať žije [GetPlayer.GetPrimaryTitle.GetNameNoTooltip]!"
 enact_legacy_of_adventurer_decision_tooltip: "Upevni místo [Concept('house','rodu')|E] [GetPlayer.GetHouse.GetBaseNameNoTooltip] ve světě [Concept('adventurer','dobrodruhů')|E]"
 have_enough_followers_tt: "Máš alespoň #V 15#! [Concept('follower','následovníků')|E] #weak (#color_white [GetPlayer.MakeScope.ScriptValue('tally_current_followers')]#!)#!"
 have_enough_patrons_tt: "Ve svém [Concept('contact_list','seznamu kontaktů')|E] máš alespoň #V 5#! lidí #weak (#color_white [GetPlayer.MakeScope.ScriptValue('tally_roll_of_patrons')]#!)#!"
 has_max_level_pavilion_tt: "Tvá [Concept('building','budova')|E] [GetDomicileBuilding('camp_main_01').GetName] má úroveň #V 4#! #weak (#color_white [GetPlayer.MakeScope.ScriptValue('camp_pavillion_level')]#!)#!"
 has_enough_contracts_tt: "Dokončil jsi #V [contract_tally]/50#! [Concept('task_contract','zakázek')|E], které nebyly [Concept('criminal','zločinné')|E]"
 legacy_adventurer_legitimacy_on_landing: "Pokud se kterýkoli [Concept('adventurer','dobrodruh')|E] z [Concept('house','rodu')|E] [GetPlayer.GetHouse.GetBaseName] stane [Concept('ruler','vládcem')|E]:\n$BULLET$ Získá [legitimacy_i][GetPlayer.MakeScope.ScriptValue('massive_legitimacy_gain')|+0] [Concept('legitimacy','legitimity')|E]\n$BULLET$ Za každého [Concept('follower','následovníka')|E], kterého měl, získá [soldier_i] #P 25#! [Concept('levies','odvedenců')|E]"
 criminal_contracts_blocked_tt: "@warning_icon! #warning Už nebudeš moci přijímat [Concept('criminal','zločinné')|E] [Concept('task_contract','zakázky')|E]#!"
 task_successful_noncrim_contract_count_effect_tt: "Postupuješ v [Concept('decision','rozhodnutí')|E] $enact_legacy_of_adventurer_decision$"
 remnants_adventurer_army: "Pozůstatky [prev_title.GetNameNoTooltip]"
 legacy_adventurer_house_modifier: "Dobrodružná pokrevní linie"
 legacy_adventurer_house_modifier_desc: "Tento rod si cení života dobrodruhů a toho, že se nemusí trápit dvorskými záležitostmi.\n[adventurer_i] Odměny v podobě [Concept('prestige','prestiže')|E] za [Concept('task_contract','zakázky')|E]: [prestige_i]#P +15%#!"
 bp3_decisions.0100.t: "$enact_legacy_of_adventurer_decision$"
 bp3_decisions.0100.desc: "Všem, kdo mě následují, nabízím bezpečné místo k odpočinku a příležitost zanechat ve světě svou stopu.\n\nV mém světě není místo pro bezuzdnou korupci ani podlé intriky a vše, co děláme, bude sloužit ku prospěchu panství, jimiž putujeme. Právě to znamená být členem rodu [GetPlayer.GetHouse.GetBaseName].\n\nDokud povedu [GetPlayer.GetPrimaryTitle.GetName], budeme trestat ničemy!"
 bp3_decisions.0100.a: "Vpřed, mí následovníci!"
 bp3_decisions.0100.a_tt: "Vytvoří na mapě až #V 3#! [Concept('justicar_task_contract','zakázky soudce')|E]"
 bp3_decisions.0100.b: "Přesto toužím po vlastní zemi..."
