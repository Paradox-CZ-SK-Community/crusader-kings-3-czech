l_polish:
 travel_events_bp3.1.t: "Střídání ročních období"
 travel_events_bp3.1.desc: "Když se ráno chystáme vyrazit, vidím, že před táborem úplně o samotě stojí [ROOT.Char.Custom2('RelationToMeShort', friendly_character)] [friendly_character.GetFirstName]. Když se vydám za [friendly_character.GetFirstName] na kus řeči, všimnu si změny ve větru.\n\n"
 travel_events_bp3.1.desc.spring: "Překvapivě teplý vánek mi na okamžik pohladí tvář, což je citelná změna oproti nedávnému chladu. Konečně je tu jaro."
 travel_events_bp3.1.desc.summer: "Teplý vítr mi na okamžik rozvlní šaty a všimnu si příjemných slunečních paprsků dopadajících na tábor. Předzvěst teplejších dnů, které nás čekají."
 travel_events_bp3.1.desc.autumn: "Osvěžující podzimní vítr se prožene táborem a zvedá ze země listí a prach. Léto je za námi, je čas připravit se na chlad podzimu a zimy."
 travel_events_bp3.1.desc.autumn_desert: "Osvěžující podzimní vítr se prožene táborem a zvedá ze země písek a prach. Léto je za námi, je čas připravit se na chlad podzimu a zimy."
 travel_events_bp3.1.desc.winter: "Když mě do zad udeří poryv studeného větru, přitáhnu si oděv těsněji k tělu. Chlad šeptá, že opět nastal čas zimy."
 travel_events_bp3.1.desc.winter_snow: "Když mě do zad udeří poryv studeného větru, přitáhnu si oděv těsněji k tělu a spatřím první známky sněhu. Chlad šeptá, že opět nastal čas zimy."
 travel_events_bp3.1.desc.dry_season: "Táborem se prožene suchý vítr a zanechá za sebou oblak prachu. Období sucha je tu, tak doufejme, že naši cestu příliš nepoznamená."
 travel_events_bp3.1.desc.rainy_season: "Poryv větru mi na okamžik zachytí šaty a začne lehce pršet, ale temně šedé mraky nad námi dávají jasně najevo, že se schyluje k bouři."
 travel_events_bp3.1.a: "„Tak zase přichází [ROOT.Char.Custom('GetSeason')], co?“"
 travel_events_bp3.1.b: "„Zpátky na koně, [friendly_character.GetFirstNameNoTooltip].“"
 travel_events_bp3.1.b.flavor: "„Cestou budeme mít víc než dost času kochat se krajinou. Naším cílem je [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName].“"
 travel_events_bp3.5.t: "Venku na pospas živlům"
 travel_events_bp3.5.desc.snow: "Právě když se chystáme vyrazit, začne sněžit. Nezbývá mi než proklínat smůlu, ačkoli už nějakou dobu bylo vidět, jak se stahují mraky. A nevypadá to, že by mělo brzy přestat.\n\nChceme-li dorazit včas, musíme vyrazit, ale jízda sněhovou bouří je přinejmenším riskantní."
 travel_events_bp3.5.desc.rain: "Právě když se chystáme vyrazit, spustí se liják. Kam oko dohlédne, všude jen déšť. Nezbývá mi než proklínat smůlu, ačkoli už nějakou dobu bylo vidět, jak se stahují temné mraky.\n\nChceme-li dorazit včas, musíme vyrazit, ale za takového počasí bude cesta nebezpečná."
 travel_events_bp3.5.a: "Ideální příležitost k odpočinku."
 travel_events_bp3.5.b.snow: "Trocha sněhu nikomu neublíží."
 travel_events_bp3.5.b.rain: "Trocha deště nikomu neublíží."
 travel_events_bp3.5.b.tt: "Členové [Concept('entourage','doprovodu')|E] mohou získat [Concept('trait','vlastnost')|E] #color_white [GetTrait('ill').GetName(GetNullCharacter)]#!"
 travel_events_bp3.10.t: "Poutníci: [holy_location.GetNameNoTooltip]"
 travel_events_bp3.10.desc: "Když po dlouhém dni sedíme u táborového ohně, přiblíží se k nám ze tmy skupina pocestných. "
 travel_events_bp3.10.desc.holy_order: "Skupina rytířů, kterou vede [Select_CString(holy_order_character.IsFemale,'hrdě vyhlížející žena','hrdě vyhlížející muž')]. Jeden rytíř vypadá bohatší než druhý.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], je mi ctí vás poznat. Jmenuji se [holy_order_character.GetName] a přicházím z [grandmaster.GetPrimaryTitle.GetName]. Naším cílem je [holy_location.GetName] a máme za sebou dlouhou cestu. Před posledním úsekem si potřebujeme odpočinout. Smíme posedět u vašeho ohně?“"
 travel_events_bp3.10.desc.pilgrims: "Vypadají jako houf ztracených poutníků, v jejichž čele kráčí [Select_CString(pilgrim_character.IsFemale,'strhaně vyhlížející poutnice','strhaně vyhlížející poutník')]. Navzdory prvnímu dojmu si všimnu, že každý z nich nese nějakou cennost.\n\n„Prosím, [ROOT.Char.Custom('FormOfAddressForLiege')], dovolíte nám odpočinout si u vašeho ohně? Máme za sebou dlouhou cestu...“"
 travel_events_bp3.10.a: "„Jen pojďte! Posedněte u našeho ohně a vyprávějte nám o svých cestách!“"
 travel_events_bp3.10.b: "„Můžeme pokračovat společně. [holy_location.GetNameNoTooltip] je i naším cílem.“"
 travel_events_bp3.10.c.holy_order: "„#emp Léčka! Braňte tábor!#!“"
 travel_events_bp3.10.c.pilgrims: "„Ach, já vás těch starostí zbavím...“"
 travel_events_bp3.10.c.flavor: "Nikdo si nevšimne, když se pár poutníků cestou ztratí, ne?"
 travel_events_bp3.10.d: "„Ne, pro vás tu místo není.“"
 holy_pilgrims_travel_modifier: "Doprovázení poutníků"
 holy_pilgrims_travel_modifier_desc: "Tento doprovod chrání skupinu poutníků na cestě k posvátnému místu."
 holy_knights_travel_modifier: "Cesta s rytíři"
 holy_knights_travel_modifier_desc: "Tento doprovod chrání skupina statečných rytířů."
 travel_events_bp3.15.t: "Písně o [liege.GetTitledFirstNameNoTooltip]"
 travel_events_bp3.15.desc: "Když cestujeme krajinou na okraji území, kde leží [location.GetName], náhle v dálce spatříme [Select_CString(bard_character.IsFemale,'rozjařenou pěvkyni','rozjařeného pěvce')]. Poskakuje, tančí a zpívá si pro sebe - opravdu svérázná postava.\n\n„Nechcete si poslechnout nějakou tu mou písničku? Co třeba "
 travel_events_bp3.15.desc.murderer: "#emp [liege.GetFirstName], tyranská ropucha [liege.GetCulture.GetName] kultury#!"
 travel_events_bp3.15.desc.lustful.man: "#emp [liege.GetFirstName], děvkař, jehož panstvím je [liege.GetPrimaryTitle.GetName]#!"
 travel_events_bp3.15.desc.lustful.woman: "#emp [liege.GetFirstName], děvka, jejímž panstvím je [liege.GetPrimaryTitle.GetName]#!"
 travel_events_bp3.15.desc.gluttonous: "#emp [liege.GetFirstName], prase od dvora [liege.GetCulture.GetName] kultury#!"
 travel_events_bp3.15.desc.fool: "#emp [liege.GetFirstName], [liege.GetPrimaryTitle.GetAdjective] šašek#!"
 travel_events_bp3.15.desc.craven: "#emp [liege.GetFirstName], zbabělá duše s titulem [liege.GetTitleAsNameNoTooltip]#!"
 travel_events_bp3.15.desc.outro: "?“ zavolá na nás, jakmile se přiblížíme na doslech. Než stačíme odpovědět, [bard_character.GetFirstName] spustí veselou píseň a začne v ní líčit neřesti, které má na svědomí [liege.GetTitledFirstNameNoTooltip]."
 travel_events_bp3.15.a: "„Co je [liege.GetTitleAsNameNoTooltip] vlastně zač? Vyprávěj mi víc.“"
 travel_events_bp3.15.a.tt: "Můžeš odhalit jedno z [Concept('secret','tajemství')|E], která [liege.GetFirstName] skrývá"
 travel_events_bp3.15.b: "„[Select_CString(bard_character.IsFemale,'Jsi zajímavá pěvkyně','Jsi zajímavý pěvec')], nechceš se ke mně přidat?“"
 travel_events_bp3.15.c: "„[Select_CString(bard_character.IsFemale,'Drž jazyk za zuby, odporná selko','Drž jazyk za zuby, odporný sedláku')]!“"
 travel_events_bp3.20.t: "[SCOPE.Custom('LocalGuildsLoc')|U]"
 travel_events_bp3.20.desc: "Když můj doprovod prochází [ROOT.Char.GetCurrentLocation.GetName], dáme se do řeči s [Select_CString(merchant_character.IsFemale,'nadšenou a charismatickou obchodnicí','nadšeným a charismatickým obchodníkem')] jménem [merchant_character.GetFirstName]. [merchant_character.GetFirstNameNoTooltip] zastupuje [SCOPE.Custom('LocalGuildsLoc')].\n\n„Takže vaším domovem je [ROOT.Char.GetPrimaryTitle.GetNameNoTier]? Už nějakou dobu bychom rádi založili dílnu a jako ideální místo se nám jeví [new_home_province.GetName]. Nešlo by nám s tím trochu pomoct?“ [merchant_character.GetFirstNameNoTooltip] na mě mrkne a položí na stůl minci."
 travel_events_bp3.20.a: "„[new_home_province.GetNameNoTooltip]? Jistě, proč ne!“"
 travel_events_bp3.20.b: "„Dej ty peníze rovnou mně a já už něco vymyslím...“"
 travel_events_bp3.20.b.tt: "Jistě nikomu nebude vadit, když při tomhle obchodu obejdeme pár zákonů a nařízení."
 travel_events_bp3.20.c: "„Raději mi pověz víc o svém obchodu a tomhle krásném městě.“"
 travel_events_bp3.25.t: "Strasti války"
 travel_events_bp3.25.desc: "Když procházíme ulicemi [ROOT.Char.GetCurrentLocation.GetName], z boční uličky se vynoří průvod vojáků. Většina je zraněná a podpírají je sklíčení civilisté.\n\nPřed davem shromažďujícím se na tržišti se hrdě vztyčí hlasatel a mocným hlasem prohlásí: „Ty psy ze země jménem [opponent.GetPrimaryTitle.GetName] jsme zase rozdrtili! Je jen otázkou času, kdy bude vítězství naše!“\n\n"
 travel_events_bp3.25.desc.outro: "Slova o vítězství však znějí naprázdno, když pohlédnu na zraněné vojáky a jejich truchlící příbuzné."
 travel_events_bp3.25.desc.outro.sadistic: "Při pohledu na ty hlupáky, kteří si zničili život, se však neubráním uchechtnutí."
 travel_events_bp3.25.a: "Těm ubožákům věnuji pár mincí."
 travel_events_bp3.25.b: "Možná se ze svých bitev naučili něco, o co se mohou podělit?"
 travel_events_bp3.25.b.insulted: "Urazíš přeživší"
 travel_events_bp3.25.b.stories: "Vyslechneš si několik příběhů z bitev"
 travel_events_bp3.25.b.martial: "Slyšíš o strategických přešlapech vojska ze země jménem [liege.GetPrimaryTitle.GetNameNoTooltip]"
 travel_events_bp3.25.b.prowess: "Slyšíš vyprávění o tom, jak bojovali lidé ze země jménem [liege.GetPrimaryTitle.GetNameNoTooltip]"
 travel_events_bp3.25.c: "No nic... Dost už té bídy a nářků, musíme pokračovat."
 travel_events_bp3.30.t: "Žoldnéři: [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 travel_events_bp3.30.desc: "Sedíme v tiché krčmě v [ROOT.Char.GetCurrentLocation.GetName], když dovnitř vtrhne hlučná banda otrhaných žoldáků. Postava v čele družiny odstrčí jednoho z mých strážných a bezostyšně se posadí k mému stolu.\n\n„[Select_CString(ROOT.Char.IsFemale,'Urozená dámo','Urozený pane')], hm? Nemáte zájem o služby nejlepší bandy žoldáků v [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]? Věrnější žoldáky nenajdete! Tedy pokud nám pořádně zaplatíte...“"
 travel_events_bp3.30.a: "„#emp Nejlepší#!? To mě zaujalo...“"
 travel_events_bp3.30.b: "„Co se přidat k mé družině?“"
 travel_events_bp3.30.c: "„Mám pro vás #emp dokonalou#! práci.“"
 travel_events_bp3.30.d: "„Ne, jen si tu dávám krátkou přestávku.“"
 travel_events_bp3.30.e: "„#bold #emp Prosím?! #!#!“"
 mercenary_army_default: "Žoldnéři"
 travel_events_bp3.35.t: "Rytířský výcvik"
 travel_events_bp3.35.desc.traveling: "Když procházíme ulicemi [ROOT.Char.GetCurrentLocation.GetName], [kid_character.GetFirstName] náhle odběhne do postranní uličky. Celý doprovod to zaskočí a všichni se rozběhneme za [kid_character.GetFirstNameNoTooltip], až dítě najdeme, jak mává šišatým dřevěným mečem před [Select_CString(soldier_character.IsFemale,'nějakou starou vojačkou','nějakým starým vojákem')].\n\n„A [kid_character.Custom('GetPrincessPrince')|l] se nezmůže na nic lepšího?“ Po poškádlení rozzlobené postavy [kid_character.GetFirstNameNoTooltip] se otočí k nám,"
 travel_events_bp3.35.desc.home: "Když procházíme ulicemi [ROOT.Char.GetCurrentLocation.GetName], spatříme v malé postranní uličce hlouček selských dětí shromážděných kolem [Select_CString(soldier_character.IsFemale,'staré vojačky','starého vojáka')]. Několik z nich mává šišatými dřevěnými mečíky, nadšeně pokřikuje a snaží se zasáhnout svůj pohyblivý cíl.\n\n„Koho by ohromila taková práce nohou, co?“ Po poškádlení jednoho z dětí se otočí k nám,"
 travel_events_bp3.35.outro.non_martial_gender: " lehce přede mnou skloní hlavu. „Mohu vám nějak posloužit, [ROOT.Char.Custom('FormOfAddressForLiege')]? Snad se vás to nijak nedotklo, jen těm dětem ukazuji, jak zacházet s čepelí.“"
 travel_events_bp3.35.outro.martial_gender: " a s potutelným úsměvem poznamená: „Nechcete se taky přidat, [ROOT.Char.Custom('FormOfAddressForLiege')]? Na mou obvyklou skupinku už jste možná trochu starší.“"
 travel_events_bp3.35.a.travel: "„Chci, aby výuka pokračovala. [kid_character.GetFirstNameNoTooltip] se od tebe může ještě hodně naučit.“"
 travel_events_bp3.35.a.home: "„Nechceš učit u mého dvora? Mé sídlo je [ROOT.Char.GetCapitalLocation.GetNameNoTooltip].“"
 travel_events_bp3.35.a.tt: "Zlepší výsledek [Concept('education','vzdělávání')|E] [Concept('ward','svěřence')|E] [kid_character.GetFirstName]"
 travel_events_bp3.35.b.martial: "„Jistě, můžu to zkusit.“"
 travel_events_bp3.35.b.non_martial: "„Vlastně to chci také vyzkoušet...“"
 travel_events_bp3.35.b.win: "Vyhraješ souboj"
 travel_events_bp3.35.b.lose: "Prohraješ souboj, ale [soldier_character.GetFirstName] ti pomůže vypilovat dovednosti"
 travel_events_bp3.35.c.travel: "„Děkuji. [kid_character.Custom('GetDaughterSon')|U] je zase se mnou.“"
 travel_events_bp3.35.c.home: "„Ne, jen se dívám.“"
 knight_teacher_modifier: "Rytířský výcvik"
 knight_teacher_modifier_desc: "Výcvik pod vedením člověka s celoživotními zkušenostmi z boje i výuky ostatních.\n\nZlepšuje [Concept('education','vzdělávání')|E] [Concept('ward','svěřence')|E]"
 travel_events_bp3.40.t: "Bojová soutěž"
 travel_events_bp3.40.desc: "Když procházíme tržištěm v [ROOT.Char.GetCurrentLocation.GetName], zaslechneme hlasitý křik a narazíme na právě probíhající potyčku dvou lidí, kterou bedlivě sleduje skupina přihlížejících.\n\nDav bouřlivě jásá, když jedna ze zápasících postav ztratí rovnováhu a skončí tváří v prachu, čímž zápas končí.\n\n„Kdo je další?!“ ozve se do davu a pohled se zastaví na naší skupině. "
 travel_events_bp3.40.outro.challenger: "Po mém boku [challenger_character.GetTitledFirstName] na výzvu pohrdavě odfrkne."
 travel_events_bp3.40.fallback: "[Select_CString(soldier_character.IsFemale,'Soupeřce','Soupeři')] se při pohledu na nás roztáhne tvář do zlomyslného úšklebku."
 travel_events_bp3.40.a: "„Já do toho jdu.“"
 travel_events_bp3.40.b: "„Do toho, [challenger_character.GetFirstNameNoTooltip], zvládneš to!“"
 travel_events_bp3.40.c: "Vypadá to, že je čas odejít..."
 travel_events_bp3.40.win: "Vyhraješ souboj"
 travel_events_bp3.40.lose: "Prohraješ souboj"
 travel_events_bp3.45.t: "[Select_CString(knight_character.IsFemale,'Potulná rytířka','Potulný rytíř')]"
 travel_events_bp3.45.desc: "Když procházíme ulicemi [ROOT.Char.GetCurrentLocation.GetName], ozve se od jednoho z tržištních stánků hlasitý povyk. Dvě osoby na sebe křičí, ale než se k nim stačíme dostat, [knight_character.GetFirstName] už mezi ně vstoupí a spor uklidní.\n\n„Vidíš? Všechno bude v pořádku.“ [knight_character.GetFirstNameNoTooltip] se usměje na obsluhu stánku a podá jí [ROOT.Char.GetCurrentLocation.Custom('GetByzantineCoinWithGloss')]. Jediné prosté gesto laskavé štědrosti a vše se opět vrací do normálu.\n\nKdyž se přiblížíme, [knight_character.GetFirstNameNoTooltip] se k nám otočí. Žádný prapor ani znak neprozrazuje, komu slouží. Snad [Select_CString(knight_character.IsFemale,'potulná rytířka','potulný rytíř')]?"
 travel_events_bp3.45.a: "[Select_CString(knight_character.IsFemale,'„Čestná rytířka jako ty by měla sloužit','„Čestný rytíř jako ty by měl sloužit')] [Select_CString(ROOT.Char.IsFemale,'urozené dámě','urozenému pánovi')], jako jsem já.“"
 travel_events_bp3.45.b: "„Mohu ti nabídnout něco k pití?“"
 travel_events_bp3.45.diplomacy: "Vyprávění o galantnosti"
 travel_events_bp3.45.prowess: "Vyprávění o udatnosti"
 travel_events_bp3.45.piety: "Vyprávění o rytířskosti"
 travel_events_bp3.45.prestige: "Vyprávění o odvaze"
 travel_events_bp3.45.b.flavor: "Možná má nějaké zajímavé příběhy k vyprávění?"
 travel_events_bp3.45.c: "[Select_CString(knight_character.IsFemale,'Na tuhle tulačku nemám čas.','Na tohohle tuláka nemám čas.')]"
 travel_events_bp3.50.t: "Družina ve dvou"
 travel_events_bp3.50.desc: "Když procházím postranní uličkou v [ROOT.Char.GetCurrentLocation.GetName], spatřím za nízkou zídkou [Select_CString(child_character.IsFemale,'osamělou dívku','osamělého chlapce')] se psem. „Tumáš, Valore.“ Dítě mu podá malý kousek chleba a samo si nenechá nic.\n\nKdyž si tu dvojici prohlížím, je zřejmé, že o psa je postaráno mnohem lépe než o dítě. Pes nejspíš dostává vše, co dítě dokáže sehnat."
 travel_events_bp3.50.a: "[Select_CString(child_character.IsFemale,'„Tumáš trochu jídla, děvče.“','„Tumáš trochu jídla, chlapče.“')]"
 travel_events_bp3.50.b: "„Pojď, postarám se o tebe.“"
 travel_events_bp3.50.c: "„Tvůj pes? #bold Můj#! pes.“"
 travel_events_bp3.50.d: "Na špinavé sirotky nemám čas."
 heartless_modifier: "Bezcitnost"
 heartless_modifier_desc: "Bezcitný vládce, který okrádá osiřelé děti."
 kind_ruler_modifier: "Laskavý vládce"
 kind_ruler_modifier_desc: "Je známý laskavostí i k těm nejubožejším sirotkům."
 travel_events_bp3.55.t: "Obchodníci na cestách"
 travel_events_bp3.55.desc: "Když se procházím tržištěm v [ROOT.Char.GetCurrentLocation.GetName], ozve se o pár stánků dál hlasitý povyk. Stojí tam [Select_CString(merchant_character.IsFemale,'rozzuřená obchodnice','rozzuřený obchodník')], divoce mává rukama a křičí na jiného obchodníka. „[republic_ruler.GetTitledFirstName] tě za tohle připraví o hlavu!“ Druhý obchodník vypadá pokud možno ještě rozzuřeněji.\n\n„Jen ať si to [republic_ruler.GetTitledFirstNameNoTooltip] zkusí!“ Majitel stánku odmítavě mávne rukou. [merchant_character.GetFirstNameNoTooltip] se vztekle otočí ke své stráži a je zřejmé, že hodlá obchod uzavřít po dobrém, nebo po zlém."
 travel_events_bp3.55.a: "Musíme zasáhnout, než se to vymkne kontrole."
 travel_events_bp3.55.a.flavor: "Dokonalá příležitost navázat cenné vztahy - [republic_ruler.GetTitledFirstName] jistě ocení, když pomůžeme člověku v [Select_CString(republic_ruler.IsFemale,'jejích','jeho')] službách."
 travel_events_bp3.55.a.tt: "Uzavřeš [Concept('alliance','alianci')|E]. Druhou stranou bude [republic_ruler.GetName]"
 travel_events_bp3.55.b: "Ideální chvíle vydělat pár mincí..."
 travel_events_bp3.55.b.flavor: "Třeba [merchant_character.GetFirstNameNoTooltip] přistoupí na směšně nízkou cenu."
 travel_events_bp3.55.b.win: "Využiješ situace"
 travel_events_bp3.55.b.lose: "Někdo využije situace na tvůj úkor"
 travel_events_bp3.55.c: "Budu se dívat na to divadlo."
 travel_events_bp3.60.t: "Drobný obchod"
 travel_events_bp3.60.desc: "Když procházíme [ROOT.Char.GetCurrentLocation.GetName], ocitneme se v davu lidí čekajících, až z cesty zmizí velký vůz naložený stavebním materiálem.\n\n„Tvoje zboží nepotřebuji, jinde jsem ho sehnal levněji!“ Dvě osoby se u vozu hlasitě hádají. Jedna z nich působí sklíčeně a zmateně.\n\n„Ale-ale... Co s tím vším mám teď dělat?“ ozve se slabě [merchant_character.GetFirstNameNoTooltip], spíš pro sebe než pro kohokoli jiného."
 travel_events_bp3.60.a: "„Koupím všechen tvůj materiál.“"
 travel_events_bp3.60.b: "„Mým hlavním městem je [ROOT.Char.GetCapitalLocation.GetNameNoTooltip] - přivez své zboží tam!“"
 travel_events_bp3.60.c: "„Tak už konečně uhněte z cesty!“"
 travel_extra_building_resources_modifier: "Přebytečný stavební materiál"
 travel_extra_building_resources_modifier_desc: "V této provincii zbylo velké množství materiálu připraveného k využití na nové stavební projekty.\n\n"
 MODIFIER_DEFINITION_EXTRA_BUILDING_RESOURCES: "#emp Používá se při stavbě nové [Concept('building','budovy')|E]#!\nZbývající materiál pro [Concept('building','budovy')|E]: #bold $MULTIPLIER|0$/3#!"
 modifier_extra_building_resources_desc: "\t#weak Snižuje se s každým použitím#!"
 travel_extra_building_resources_character_modifier: "Obchod se stavebním materiálem"
 travel_extra_building_resources_character_modifier_desc: "Cenná obchodní trasa, která zajišťuje snadný přístup ke stavebnímu materiálu."
 travel_events_bp3.65.t: "Honba za měšcem"
 travel_events_bp3.65.desc: "Když si prohlížím stánky na tržišti v [ROOT.Char.GetCurrentLocation.GetName], ucítím, jak mi někdo přeřízne šňůrku měšce. Přestože okamžitě zareaguji, zloděj zmizí v davu.\n\nJen čirou náhodou jeden z mých strážných zahlédne [Select_CString(thief_character.IsFemale,'zlodějku','zloděje')], jak mizí v postranní uličce. „Stůj, nebo přijdeš o hlavu!“ zakřičí za [Select_CString(thief_character.IsFemale,'ní','ním')] jeden ze strážných. [Select_CString(thief_character.IsFemale,'Zlodějka se otočí','Zloděj se otočí')] a vrhne na nás vzteklý, nedůvěřivý pohled."
 travel_events_bp3.65.a: "„Mám pro tebe práci. Ty peníze ber jako první výplatu.“"
 travel_events_bp3.65.b: "[Select_CString(thief_character.IsFemale,'„Ty špinavá zlodějko, myslíš, že můžeš okrádat #bold #emp mě#!#!?“','„Ty špinavý zloději, myslíš, že můžeš okrádat #bold #emp mě#!#!?“')]"
 travel_events_bp3.65.c: "„Vrať peníze a tím to pro mě končí.“"
 travel_events_bp3.70.t: "[ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] festival"
 travel_events_bp3.70.desc: "Když vstoupíme do [ROOT.Char.GetCurrentLocation.GetName], všimnu si veselé nálady a sváteční výzdoby po celém městě. Než se nadějeme, slavnosti pohltí i celý můj doprovod.\n\n"
 travel_events_bp3.70.desc.entourage: "„Je to tu tak přátelské, nemyslíš?“ zeptá se mě [dancing_partner.GetFirstName], zatímco spolu tančíme v davu."
 travel_events_bp3.70.desc.local: "„Vítejte v [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]!“ nadšeně mě přivítá [local_character.GetFirstName] a při tanci mi položí ruku do dlaně."
 travel_events_bp3.70.desc.outro: " Když hudebníci dohrají jednu píseň a spustí další, všude kolem nás propukne hlasitý jásot."
 travel_events_bp3.70.a: "Kéž by [ROOT.Char.GetCapitalLocation.GetNameNoTooltip] vypadalo trochu víc jako tohle..."
 travel_events_bp3.70.a.cultural_acceptance: "[Concept('cultural_acceptance','Kulturní přijetí')|E] potřebné k [Concept('hybridize','hybridizaci')|E] s kulturou [root_scope.MakeScope.Var('special_culture_tooltip').Culture.GetName] se sníží o #color_white 25%#!"
 travel_events_bp3.70.a.counties: "Můžeš [Concept('hybridize','hybridizovat')|E] s kulturou [root_scope.MakeScope.Var('special_culture_tooltip').Culture.GetName], i když žádné [Concept('counties','hrabství')|E] v tvém [Concept('realm','panství')|E] tuto [Concept('culture','kulturu')|E] nemá"
 travel_events_bp3.70.b: "Tady je to jako doma!"
 travel_events_bp3.75.t: "Rodící se sny"
 travel_events_bp3.75.desc: "Když procházím kolem malého tržiště v [ROOT.Char.GetCurrentLocation.GetName], spatřím [brewmaster_character.GetFirstName], jak rozdává nápoje každému, kdo jde kolem. „[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ osloví mě [brewmaster_character.GetFirstNameNoTooltip] a podá mi pohár. Okamžitě mě udeří do nosu vůně [ROOT.Char.Custom('RegionalDrink')] a při přebírání nápoje sleduji, jak se tekutina v poháru lehce zavlní. Stejně jako ostatní jej vypiji jediným douškem a chutná #emp neuvěřitelně#! dobře.\n\n„Chutná vám, [ROOT.Char.Custom('FormOfAddressForLiege')|U]?“ [brewmaster_character.GetFirstNameNoTooltip] se na mě zvídavě podívá a pak významně dodá: „Kdybych tak [Select_CString(brewmaster_character.IsFemale,'měla','měl')] místo, kde bych toho [Select_CString(brewmaster_character.IsFemale,'mohla','mohl')] vyrábět víc...“"
 travel_events_bp3.75.a: "„[target_barony.GetNameNoTierNoTooltip] potřebuje někoho, jako jsi ty.“"
 travel_events_bp3.75.b: "„Přesuň své podnikání do mých zemí a přidej se k mému dvoru.“"
 travel_events_bp3.75.c: "„Děkuji, bylo to výborné!“"
 travel_events_bp3.80.t: "Život ve službě"
 travel_events_bp3.80.desc.holy_order: "Při návštěvě místa, které zde nazývají [ROOT.Char.Custom('GetFaithTemple')], v [ROOT.Char.GetCurrentLocation] si všimnu [monk_character.GetFirstName], jak je [Select_CString(monk_character.IsFemale,'zabraná','zabraný')] do rozhovoru s potulným [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')]. [monk_character.GetFirstNameNoTooltip] visí na každém slově a v očích [Select_CString(monk_character.IsFemale,'jí','mu')] září nadšení.\n\n„[monk_character.Custom2('RelationToMeShort', ROOT.Char)|U], už vím, co chci v životě dělat,“ oznámí mi [monk_character.GetFirstNameNoTooltip] slavnostně, když k nim přistoupím. [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')|U] přikývne a lehce poplácá [monk_character.GetFirstNameNoTooltip] po zádech, očividně se snaží toto rozhodnutí podpořit. „Chci svůj život zasvětit službě, kterou žádá [ROOT.Char.GetFaith.HighGodName], a řádu [grandmaster.GetPrimaryTitle.GetName].“"
 travel_events_bp3.80.desc.monk: "Při návštěvě místa, které zde nazývají [ROOT.Char.Custom('GetFaithTemple')], v [ROOT.Char.GetCurrentLocation] si všimnu [monk_character.GetFirstName], jak je [Select_CString(monk_character.IsFemale,'zabraná','zabraný')] do rozhovoru s místním duchovním. [monk_character.GetFirstNameNoTooltip] visí na každém slově a v očích [Select_CString(monk_character.IsFemale,'jí','mu')] září nadšení.\n\n„[monk_character.Custom2('RelationToMeShort', ROOT.Char)|U], už vím, co chci v životě dělat,“ oznámí mi [monk_character.GetFirstNameNoTooltip] slavnostně, když k nim přistoupím. Duchovní se na mě usměje a očividně se snaží toto rozhodnutí podpořit."
 travel_events_bp3.80.desc.adult: "$travel_events_bp3.80.desc.monk$ „Chci svůj život zasvětit službě, kterou žádá [ROOT.Char.GetFaith.HighGodName], tady v [ROOT.Char.GetCurrentLocation.GetName].“"
 travel_events_bp3.80.desc.child: "$travel_events_bp3.80.desc.monk$ „Chci svůj život zasvětit službě, kterou žádá [ROOT.Char.GetFaith.HighGodName].“"
 travel_events_bp3.80.a: "„Jestli tě to učiní šťastným...“"
 travel_events_bp3.80.b: "„Mysli na svou budoucnost, [monk_character.GetFirstNameNoTooltip]!“"
 travel_events_bp3.85.t: "Slavní sládci"
 travel_events_bp3.85.desc.monk: "Když procházíme [ROOT.Char.GetCurrentLocation.GetName], víme, že musíme navštívit zdejší slavný klášterní pivovar. Sotva vstoupíme dovnitř, spatříme u malého stolu poblíž dveří obsluhovanou skupinu lidí, zatímco vzadu se mniši věnují své práci."
 travel_events_bp3.85.desc: "Když procházíme [ROOT.Char.GetCurrentLocation.GetName], víme, že musíme navštívit zdejší slavný pivovar. Sotva vstoupíme dovnitř, spatříme u malého stolu poblíž dveří obsluhovanou skupinu lidí, zatímco vzadu se sládci věnují své práci."
 travel_events_bp3.85.desc.outro: "\n\nPočkáme, až předchozí skupina odejde, a konečně dostaneme své nápoje. Lehce zavířím pohárem a ucítím výraznou vůni piva, která z něj stoupá. Když vidím, jak ochutnávají všichni ostatní, nakonec se napiji také."
 travel_events_bp3.85.a: "Na tradiční [brewery_county.GetAdjectiveNoTooltip] pivo to nemá."
 travel_events_bp3.85.a.tt: "Protože tradice vaření piva v [brewery_county.GetName] je starší než #color_white [brewery_county.MakeScope.ScriptValue('brewery_counter_25')|0]#! let:"
 travel_events_bp3.85.b: "Koupím trochu i domů."
 travel_events_bp3.85.c: "Není divu, že je tak proslulé."
 popular_beer_character_modifier: "Oblíbené pivo"
 popular_beer_character_modifier_desc: "Proslulé pivo z dalekých krajů, které si u dvora získalo nesmírnou oblibu."
 travel_events_bp3.90.t: "Mecenášství: [ROOT.Char.Custom('GetFaithTemple')|U]"
 travel_events_bp3.90.desc: "V centru [ROOT.Char.GetCurrentLocation.GetName] stojí velký svatostánek označovaný jako [ROOT.Char.Custom('GetFaithTemple')] a zbytek města se rozkládá kolem něj. Sotva vstoupíme dovnitř, přiběhne k nám [priest_character.GetFirstName].\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], vypadáte jako někdo, kdo má dostatek prostředků. Náš svatostánek nese označení [ROOT.Char.Custom('GetFaithTemple')]. Nepřispějete na jeho opravu?“ [priest_character.GetFirstNameNoTooltip] se uklání a bezostyšně natahuje ruku. Vidím, že na budově probíhají drobné práce, ale zdaleka nestačí. [ROOT.Char.Custom('GetFaithTemple')|U] má stále mnoho nedostatků."
 travel_events_bp3.90.a: "„Ať [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] pozná mou štědrost!“"
 travel_events_bp3.90.a.flavor: "S mou podporou se z něj může znovu stát důstojné místo bohoslužeb."
 travel_events_bp3.90.b: "„Samozřejmě, menší příspěvek je jen na místě.“"
 travel_events_bp3.90.c: "Zdá se, že je čas pokračovat dál..."
 church_investment_modifier: "Zbožný mecenáš"
 church_investment_modifier_desc: "Tato postava vyčlenila část vlastního bohatství a prostředků na podporu místního duchovenstva.\n\n"
 church_investment_cost_modifier: "Zbožné investice"
 church_investment_cost_modifier_desc: "$church_investment_modifier_desc$#emp Lze odstranit pomocí [Concept('decision','rozhodnutí')|E] #color_white Ukončit zbožné investice#!#!"
 MODIFIER_DEFINITION_CHURCH_INVESTMENTS: "Tento modifikátor se zvyšuje každý druhý rok, aktuální násobitel je #bold $MULTIPLIER|0$#!"
 modifier_church_investments_desc: "\t#weak Zvyšuje se každý druhý uplynulý rok#!"
 end_investments_minor_decision: "Ukončit zbožné investice"
 end_investments_minor_decision_desc: "Copak už ty pijavice nedostaly dost mého bohatství? Mám i jiné věci, za které ho můžu utratit!"
 end_investments_minor_decision_tooltip: "Ukonči své investice do [ROOT.Char.Custom('GetFaithTemple')]"
 end_investments_minor_decision_confirm: "Ukončit investice"
 travel_events_bp3.95.t: "Poutníkovo vyprávění"
 travel_events_bp3.95.desc: "Když procházíme místem označovaným jako [ROOT.Char.Custom('GetFaithTemple')] v [ROOT.Char.GetCurrentLocation.GetName], zaslechnu skupinu pocestných, kteří si tiše povídají. [Select_CString(pilgrim_character.IsFemale,'Poutnice','Poutník')] [pilgrim_character.GetFirstName] začne vyprávět o své cestě do [unvisited_holy_site.GetNameNoTier] a porovnávat tamní svatyni s tou zdejší.\n\nNemohu si pomoct a zaposlouchám se, zatímco [pilgrim_character.GetFirstName] podrobně líčí všechny úžasné věci, které [Select_CString(pilgrim_character.IsFemale,'spatřila','spatřil')] v [unvisited_holy_site.GetProvince.GetCounty.GetName]. Když se rozhlédnu kolem sebe, mohu si jen představovat, oč velkolepější to tam musí být než zdejší skromná podívaná..."
 travel_events_bp3.95.a: "„Pověz mi víc o [unvisited_holy_site.GetNameNoTierNoTooltip]!“"
 travel_events_bp3.95.a.tt: "Když během [Concept('pilgrimage','pouti')|E] navštívíš [unvisited_holy_site.GetName], získáš [Concept('piety','zbožnost')|E] a [Concept('stress_loss','úbytek stresu')|E]"
 travel_events_bp3.95.a.tt.wanderer: "Když během [Concept('pilgrimage','pouti')|E] navštívíš [unvisited_holy_site.GetName], získáš [Concept('piety','zbožnost')|E], [Concept('stress_loss','úbytek stresu')|E] a zkušenosti v [Concept('wanderer_lifestyle','potulném životním stylu')|E]"
 travel_events_bp3.95.a.flavor: "Možná přesvědčím [pilgrim_character.GetFirstName], aby mi [Select_CString(pilgrim_character.IsFemale,'pověděla','pověděl')] víc o [unvisited_holy_site.GetProvince.GetCounty.GetName]?"
 travel_events_bp3.95.b: "To je ale zajímavé vyprávění."
 travel_events_bp3.100.t: "Země mlékem a... rybami oplývající?"
 travel_events_bp3.100.desc: "Když časně ráno vstanu, neubráním se hlasitému zívnutí. Protáhnu se, vyjdu ze stanu a zjistím, že tábor už dávno ožil.\n\nUprostřed všeho ruchu si všimnu [friend_character.GetFirstName], jak odchází s čímsi, co připomíná provizorní rybářský prut. „Kam máš namířeno?“ zeptám se.\n\n[friend_character.GetFirstNameNoTooltip] jen lhostejně pokrčí rameny. „Dnes je pěkný den na ryby.“"
 travel_events_bp3.100.a: "„Vlastně to vůbec nezní špatně.“"
 travel_events_bp3.100.a.flavor: "Dnes #emp opravdu je#! pěkný den na ryby."
 travel_events_bp3.100.b: "Pár dní si tu odpočineme."
 travel_events_bp3.100.b.flavor: "Vypadá to jako příjemné místo k odpočinku před další etapou naší cesty."
 travel_events_bp3.100.c: "„Zpátky na koně, [friend_character.GetFirstNameNoTooltip], musíme pokračovat!“"
 travel_events_bp3.105.t: "[Select_CString(lifestyle_character.IsFemale,'Žena neobyčejných schopností','Muž neobyčejných schopností')]"
 travel_events_bp3.105.desc: "Po nějaké době společného cestování jsem si [Select_CString(ROOT.Char.IsFemale,'všimla','všiml')], že na [lifestyle_character.GetFirstName] je zkrátka něco zvláštního."
 travel_events_bp3.105.desc.reveler: "Kdykoli někde zastavíme, [lifestyle_character.GetFirstName] jako první vyráží prozkoumat nové město či vesnici.\n\nAni dnes večer tomu není jinak. [lifestyle_character.GetFirstNameNoTooltip] se dává do řeči s každým kolem a nějakým způsobem dokáže zařídit, že se tu všichni cítí jako doma. Možná bych se od [lifestyle_character.GetFirstNameNoTooltip] [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] něco přiučit?"
 travel_events_bp3.105.desc.blademaster: "Každé ráno [lifestyle_character.GetFirstName] vstává a cvičí s čepelí.\n\nAni dnes večer, když si všichni ostatní vychutnávají jídlo, [lifestyle_character.GetFirstNameNoTooltip] nezahálí a o samotě provádí své úchvatné sestavy. Nemohu se ubránit touze osvojit si alespoň něco z takového způsobu života."
 travel_events_bp3.105.desc.hunter: "Jednou jsem [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')], jak [lifestyle_character.GetFirstName] za pochodu sestřelí ptáka z oblohy, jako by to byla ta nejjednodušší věc na světě.\n\nDnes [lifestyle_character.GetFirstNameNoTooltip] spolu s několika dalšími [Select_CString(lifestyle_character.IsFemale,'vyrazila','vyrazil')] na lov, aby pro nás obstarali jídlo, a vrátili se s úlovkem. Ta obliba, tolik lidí, kteří se kolem [lifestyle_character.GetFirstNameNoTooltip] shlukují... Nemohu se ubránit chuti zkusit si to také."
 travel_events_bp3.105.desc.mystic: "[lifestyle_character.GetFirstName] jako by [Select_CString(lifestyle_character.IsFemale,'znala','znal')] ty nejpodivnější věci a často se kvůli tomu pouští do zvláštních rozhovorů s lidmi kolem sebe.\n\nNěkterými názory se [lifestyle_character.GetFirstNameNoTooltip] nebezpečně přibližuje k herezi a často zpochybňuje věci, které ostatní považujeme za samozřejmé... A přesto se nemohu zbavit pocitu, že v mnohém má pravdu."
 travel_events_bp3.105.desc.physician: "[lifestyle_character.GetFirstName] často pomáhá ostatním s drobnými ranami a škrábanci a s naprostou lehkostí připravuje nejrůznější obklady.\n\nKdyž procházíme [ROOT.Char.GetCurrentLocation.GetName], spatřím [lifestyle_character.GetFirstNameNoTooltip], jak náhle přiběhne k malému selskému dítěti v postranní uličce, které lapá po dechu a jeho tvář získává nepřirozenou barvu. Než se naděju, dítě má zase normální barvu. Jak to [lifestyle_character.GetFirstNameNoTooltip] [Select_CString(lifestyle_character.IsFemale,'dokázala','dokázal')]?"
 travel_events_bp3.105.desc.herbalist: "Při cestování [lifestyle_character.GetFirstName] neustále sbírá byliny a květiny a pečlivě je ukládá pro pozdější použití.\n\nDnes jsem [Select_CString(ROOT.Char.IsFemale,'slyšela','slyšel')], jak [lifestyle_character.GetFirstNameNoTooltip] dlouze vypráví o vlastnostech jedné byliny, kterou cestou [Select_CString(lifestyle_character.IsFemale,'našla','našel')]. Prý ji lze využít k dobrému i ke zlému. Možná na tomhle koníčku přece jen něco je?"
 travel_events_bp3.105.desc.gardener: "[Select_CString(ROOT.Char.IsFemale,'Všimla','Všiml')] jsem si, že [lifestyle_character.GetFirstName] často vyráží jako první, kdykoli dorazíme do nové vesnice či města.\n\nDnes jsem [lifestyle_character.GetFirstNameNoTooltip] [Select_CString(ROOT.Char.IsFemale,'našla','našel')] při návštěvě [ROOT.Char.GetCurrentLocation.GetName], jak zaujatě zkoumá malou zahradu. Musím se několikrát ozvat, než si vůbec všimne, že tam stojím a snažím se dát do řeči."
 travel_events_bp3.105.a.reveler: "„Jak se můžu naučit být [Select_CString(ROOT.Char.IsFemale,'stejně společenská','stejně společenský')] jako ty?“"
 travel_events_bp3.105.a.blademaster: "„Můžeš mě naučit víc o boji s čepelí?“"
 travel_events_bp3.105.a.hunter: "„Můžeš mě naučit zacházet s lukem?“"
 travel_events_bp3.105.a.mystic: "„[Select_CString(ROOT.Char.IsFemale,'Ráda','Rád')] bych [Select_CString(ROOT.Char.IsFemale,'slyšela','slyšel')] víc o tom, co víš.“"
 travel_events_bp3.105.a.physician: "„Jak toho můžeš tolik vědět o neduzích a nemocech?“"
 travel_events_bp3.105.a.herbalist: "„Můžeš mi povědět víc o bylinách, které jsi [Select_CString(lifestyle_character.IsFemale,'našla','našel')]?“"
 travel_events_bp3.105.a.gardener: "„Co ti na nich připadá tak zajímavé?“"
 travel_events_bp3.105.b: "„Jsi chloubou tohoto doprovodu, [lifestyle_character.GetFirstNameNoTooltip].“"
 bp3_skill_travel_skill_learn_win: "Osvojíš si [Select_CString(lifestyle_character.IsFemale,'její','jeho')] způsob života"
 bp3_skill_travel_skill_learn_fail: "Prostě mi to nejde"
 travel_events_bp3.110.t: "Od srdce k srdci"
 travel_events_bp3.110.desc.intro: "Dlouho poté, co už většina ostatních ulehla ke spánku, stále sedím u táborového ohně. „Co se děje?“ zeptá se [friend_character.GetFirstName] a s ustaraným výrazem se posadí vedle mě.\n\nZpočátku nevím, co říct, ale jakmile začnu mluvit, všechno ze mě začne vycházet samo - všechen stres, starosti i každodenní trápení. „Pořád musím myslet na "
 travel_events_bp3.110.desc.negative_memory: "to, jak [negative_memory.GetDescription]. "
 travel_events_bp3.110.desc.fallback: "všechna svá rozhodnutí z poslední doby. "
 travel_events_bp3.110.desc.outro: "Nemohu se zbavit otázky, zda jsem [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')] jednat jinak.“"
 travel_events_bp3.110.a: "„A co ty?“"
 travel_events_bp3.110.a.flavor: "Možná se mi uleví, když si vyslechnu trápení postavy [friend_character.GetFirstName]?"
 travel_events_bp3.110.b: "„Ani neuvěříš, čím vším si musím procházet...“"
 travel_events_bp3.110.b.flavor: "Teď jde o mě a mé problémy, ne o [friend_character.GetFirstName]."
 travel_events_bp3.115.t: "Noc u táborového ohně"
 travel_events_bp3.115.desc.intro: "Je hluboká noc a já se stále směji, vyprávím příběhy a popíjím s "
 travel_events_bp3.115.desc.3_characters: "[ROOT.Char.Custom2('RelationToMeShort', character_number_1)] [character_number_1.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', character_number_2)] [character_number_2.GetFirstName] a [ROOT.Char.Custom2('RelationToMeShort', character_number_3)] [character_number_3.GetFirstName]."
 travel_events_bp3.115.desc.2_characters: "[ROOT.Char.Custom2('RelationToMeShort', character_number_1)] [character_number_1.GetFirstName] a [ROOT.Char.Custom2('RelationToMeShort', character_number_2)] [character_number_2.GetFirstName]."
 travel_events_bp3.115.desc.1_character: "[ROOT.Char.Custom2('RelationToMeShort', character_number_1)] [character_number_1.GetFirstName]."
 travel_events_bp3.115.desc.outro: " Do [character_number_1.GetFirstNameNoTooltip] bych to nikdy [Select_CString(ROOT.Char.IsFemale,'neřekla','neřekl')], ale nakonec přijde obzvlášť peprný příběh o čtyřech sedlácích z [ROOT.Char.GetCapitalLocation.GetName].\n\nKdyž si osuším oči od smíchu a trochou pití si pročistím hrdlo, rozhodnu se..."
 travel_events_bp3.115.a: "Vyprávět vlastní příběh..."
 travel_events_bp3.115.b: "...a trochu si ho přikrášlit!"
 travel_events_bp3.115.b.impressed: "Uděláš na ně dojem"
 travel_events_bp3.115.b.unimpressed: "Neuděláš na ně dojem"
 travel_events_bp3.115.c: "Požádat [character_number_1.GetFirstNameNoTooltip] o další příběh!"
 travel_events_bp3.120.t: "Ztroskotaná loď"
 travel_events_bp3.120.desc.intro.coast: "Když cestujeme podél pobřeží [ROOT.Char.GetCurrentLocation.GetName],"
 travel_events_bp3.120.desc.intro.river: "Když cestujeme podél toku [river_province.Custom('RiverNameLoc')],"
 travel_events_bp3.120.desc: " všimneme si [Select_CString(merchant_character.IsFemale,'obchodnice','obchodníka')], jak hlasitě proklíná svůj život a spílá zrádné posádce. Když se přiblížíme, spatříme [merchant_character.GetFirstNameNoTooltip] stát u trosek malé obchodní lodi.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], smím vás na chvíli zdržet? [Select_CString(merchant_character.IsFemale,'Ráda','Rád')] zaplatím za trochu jídla a pomoc s opravou lodi.“ [merchant_character.GetFirstNameNoTooltip] se na mě bolestně usměje. Všimnu si, že navzdory neštěstí zůstala většina zboží v dobrém stavu."
 travel_events_bp3.120.a: "Samozřejmě pomůžeme."
 travel_events_bp3.120.b: "Možná... za správnou cenu."
 travel_events_bp3.120.c: "„Kolik že toho vlastně máš?“"
 travel_events_bp3.120.d: "„Omlouvám se, ale spěcháme.“"
 RiverNameTheNile: "[ROOT.Province.GetName]"
 RiverNameNotTheNile: "[ROOT.Province.GetName]"
