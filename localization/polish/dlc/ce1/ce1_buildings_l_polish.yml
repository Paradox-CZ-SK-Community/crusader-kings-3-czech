l_polish:
 leg_building_name: "[ROOT.Province.GetLocalizedText('leg_b_name')]"
 checked_leg_b_name: "[ROOT.Province.Custom('GetLegBName')]"
 building_legendary_shrine: "$building_type_legendary_shrine$"
 building_legendary_palace: "$building_type_legendary_palace$"
 building_legendary_statue: "$building_type_legendary_statue$"
 building_legendary_watchtower: "$building_type_legendary_watchtower$"
 building_legendary_hunting_lodge: "$building_type_legendary_hunting_lodge$"
 building_legendary_shrine_desc: "Toto místo uctívání není jen velkolepým stavitelským počinem, ale také bezpečným útočištěm pro poutníky a zbožné věřící a svědectvím o zbožnosti toho, kdo je nechal vybudovat. Přestože není považováno za svaté místo, velkolepost této stavby učinila z hrabství významné náboženské centrum celého kraje."
 building_legendary_palace_desc: "Rozlehlý a honosný palác obklopený zahradami a loveckými revíry. Toto přepychové sídlo poskytuje pohodlí a zábavu každému panovníkovi, který v něm pobývá, a zároveň slouží jako okázalý symbol bohatství a moci."
 building_legendary_statue_desc: "Podoba legendárního vládce byla navěky zvěčněna v kameni. Tento monument nejen připomíná velké činy toho, kdo jej nechal vztyčit, ale každý, kdo jej drží ve své doméně, si zároveň osobuje roli strážce samotné legendy."
 building_legendary_watchtower_desc: "Tento obrovský monument, tyčící se vysoko nad okolím, nepůsobí jen hrozivým dojmem, ale je také sám o sobě dobře hájitelnou pevností, která chrání panství před případnými nájezdníky."
 building_legendary_hunting_lodge_desc: "Toto místo proslulo svou podivuhodnou a legendární zvěří, a proto zde byl vystavěn rozlehlý lovecký zámeček poskytující pohodlí lovcům, kteří touží zvěčnit své jméno."
 building_type_legendary_shrine: "Legendární svatostánek"
 building_type_legendary_palace: "Legendární palác"
 building_type_legendary_statue: "Legendární socha"
