 epidemic_events.2001.t: "Mor války"
 epidemic_events.2001.desc: "[pleading_vassal.GetName|U] padá na kolena a třese se.\n\n„[Select_CString(ROOT.Char.IsFemale,'Má paní','Můj pane')], sužují mě dvě pohromy. [epidemic_scope.GetName|U] požírá můj lid a teď po mých zemích sahá [attacking_vassal.GetName]. S obojím bojovat nedokážu.“\n\n[pleading_vassal.GetNameNoTooltip] přede mě položí malou truhličku se zlatem - vše, co se podařilo přinést.\n\n„Prosím tě. Pomoz mi ukončit tuhle válku, než zničí obě panství.“"
 epidemic_events.2001.a: "[Select_CString(ROOT.Char.IsFemale,'Ráda zaplatím','Rád zaplatím')] za konec téhle pošetilosti."
 epidemic_events.2001.b: "Jak se opovažuješ přivést [epidemic_scope.GetNameNoTooltip] až k #EMP mému#! prahu!"
 epidemic_events.2001.b.desc: "Stráže! #EMP Opatrně#! zatkněte [pleading_vassal.GetFirstNameNoTooltip] a pak #EMP ještě opatrněji#! umyjte všechno, s čím tato osoba přišla do styku!"
 epidemic_events.2001.c: "S [attacking_vassal.GetTitledFirstNameNoTooltip] se jistě dá rozumně promluvit."
 epidemic_events.2001.c.success: "[attacking_vassal.GetFirstNameNoTooltip] souhlasí s ukončením války [vassal_war.GetName]"
 epidemic_events.2001.c.failure: "Válka [vassal_war.GetName] pokračuje"
 epidemic_events.2001.epidemic_spread.t: "Postava [pleading_vassal.GetFirstNameNoTooltip] rozšířila mor [epidemic_scope.GetName]!"
 epidemic_events.2001.danger: "#color_red Pokud válka rychle neskončí, může za to přijít drahá cena...#!"
 epidemic_events.2002.t: "Mor války: Následky"
 epidemic_events.2002.desc: "Zatímco se [vassal_war.GetName|U] vleče dál, muži umírají kvůli půdě a země je vrací v hromadách mrtvol.\n\nNákaza [epidemic_scope.GetName] se teď šíří rychleji, živena hnijícími těly, opuštěnými vesnicemi a šílenstvím obléhání. Nikdo nevítězí. Všichni umírají."
 epidemic_events.2002.a: "Ale ne."
 epidemic_events.2003.t: "Neviditelný nepřítel"
 epidemic_events.2003.desc: "„Naši vojáci padají bez boje. [epidemic_scope.GetName|U] si vybírá větší daň než jakákoli čepel.“\n\n[marshal.GetName] mluví tvrdě, ale má pravdu. V [first_epidemic_province.GetName] i [second_epidemic_province.GetName] zejí kasárna prázdnotou. Nezbyli žádní válečníci - jen sedláci a mor."
 epidemic_events.2003.a: "Nedá se nic dělat - ať zemřou."
 epidemic_events.2003.a.flavor: "Dobří vojáci si zlato vždy najdou, ale zlato dobré vojáky málokdy."
 epidemic_events.2003.b: "Bude-li třeba, odtáhněte sedláky přímo z polí."
 epidemic_events.2003.b.flavor: "Nevymydlený dav někdy dokáže nahradit zkušené válečníky - pokud se člověk nedívá příliš zblízka."
 epidemic_events.2003.c: "Uzavřete kasárna. Lepší nečinní než mrtví."
 epidemic_events.2003.c.flavor: "Bez každodenního výcviku budou mí vojáci méně zdatní, ale snad alespoň zůstanou naživu."
 epidemic_events.2005.t: "Léčivá nádoba"
 epidemic_events.2005.desc: "Každý den míjím pracovnu, kde [physician.GetName] pracuje, a děs z [epidemic_scope.GetName] mě nikdy zcela neopouští. Podivné nástroje uvnitř mi obvykle žádnou útěchu neposkytují, dnes však mou pozornost upoutá jedna malovaná nádoba.\n\n„Chrání mě,“ říká [physician.GetFirstNameNoTooltip] a tiskne ji k sobě. „Je to mistrovské dílo a štít proti nemocem.“"
 epidemic_events.2005.a: "Neměla by ta ochrana patřit spíš mně?"
 epidemic_events.2005.a.success: "[physician.GetFirstName] souhlasí a nádobu ti přenechá"
 epidemic_events.2005.a.failure: "[physician.GetFirstName] se nenechá přesvědčit"
 epidemic_events.2005.b: "Zachraňuje životy? Tak si ji vezmu."
 epidemic_events.2005.b.success: "Předmět [medicine_jar.GetName] vytrhneš z rukou, v nichž ho drží [physician.GetFirstName]"
 epidemic_events.2005.b.failure: "Nádoba se rozbije!"
 epidemic_events.2005.c: "Jestli ti přináší útěchu, nech si ji."
 epidemic_events.2006.t: "Taneční mánie"
 epidemic_events.2006.desc: "[Select_CString(dance_victim.IsFemale,'Selka','Sedlák')] se zmítá na mém nádvoří a nohama bez ustání buší do země v šíleném rytmu.\n\n„[Select_CString(dance_victim.IsFemale,'Odpusť jí','Odpusť mu')], [ROOT.Char.GetTitleAsNameNoTooltip|U],“ říká jeden z přihlížejících. „[dance_victim.GetFirstName] tančí už celé dny bez odpočinku - někteří se dokonce přidali! Nechce přestat.“\n\n[Select_CString(dance_victim.IsFemale,'Žena zasténá a tvář se jí zkřiví','Muž zasténá a tvář se mu zkřiví')] bolestí i radostí. Šílenství, nebo něco ještě horšího, [Select_CString(dance_victim.IsFemale,'se jí zmocňuje','se ho zmocňuje')]."
 epidemic_events.2006.a: "Tančit bez přestávky? #EMP Výborně!#!"
 epidemic_events.2006.b: "Každý tanec jednou skončí. #EMP Že ano?#!"
 epidemic_events.2006.c: "Popadněte provazy a [Select_CString(dance_victim.IsFemale,'svažte ji','svažte ho')]!"
 epidemic_events.2006.d: "Ve jménu [ROOT.Char.GetFaith.HighGodName] tě srazím, démone!"
 epidemic_events.3000.t: "$travel_danger_prefix$ Krev na dveřích"
 epidemic_events.3000.desc: "V [epidemic_location.GetName] je všude jen rudá. Jediným zvukem je kašel. Pobízíme své koně dál, ale vidím, že [companion.GetTitledFirstName] je [Select_CString(companion.IsFemale,'bledá','bledý')] a rty svírá tak pevně, až z nich zmizela všechna krev.\n\n„Pomoc...“ Jedno z těl, která jsme považovali za mrtvoly, se pomalu a bolestivě pohne. Zjevně trpí [sick_peasant.Custom('disease_desc_short')]."
 epidemic_events.3000.a: "„Nemohu před tím zavřít oči.“"
 epidemic_events.3000.b: "„[companion.GetFirstNameNoTooltip], můžeš pomoci.“"
 epidemic_events.3000.c: "„Na tohle nemáme čas.“"
 epidemic_events.3000.b.sick: "[companion.GetShortUIName] onemocní"
 epidemic_events.3010.t: "$travel_danger_prefix$ Mrchožrouti"
 epidemic_events.3010.desc: "Když vstupujeme do [epidemic_location.GetName], zásoby vody nám docházejí. Zdánlivě opuštěná vesnice má přímo uprostřed lákavou studnu, a tak k ní pobídneme koně.\n\nBrzy se ukáže, proč je vesnice opuštěná.\n\nPo zemi leží těla lidí, kteří před smrtí zjevně trpěli [sick_peasant.Custom('disease_desc_short')], a nad jejich bledými hlavami krouží mrchožrouti. Ponurý pohled."
 epidemic_events.3010.a: "[Select_CString(ROOT.Char.IsFemale,'Četla jsem','Četl jsem')] něco o zkažené vodě..."
 epidemic_events.3010.b: "Voda! #EMP Konečně!#!"
 epidemic_events.3010.b.sick: "Onemocníš"
 epidemic_events.3010.c: "Musíme pokračovat."
 humour_knowledge_modifier: "Rozumné závěry"
 humour_knowledge_modifier_desc: "Tato postava si všimla, že vesničané onemocněli poté, co se napili z nakažené studny."
 no_water_modifier: "Nedostatek vody"
 no_water_modifier_desc: "Tato postava se nezastavila, aby se napila ze studny."
 ce1_flung_corpse: "vymrštění mrtvoly"
 ce1_flung_corpse_desc: "Z mého rozkazu katapult vymrštil mrtvolu přes hradby do državy, kterou vlastní [flingee.GetName]"
 ce1_flung_corpse_desc_second_perspective: "Z tvého rozkazu katapult vymrštil mrtvolu přes hradby do državy, kterou vlastní [flingee.GetName]"
 ce1_flung_corpse_desc_third_perspective: "Z rozkazu [owner.GetName] katapult vymrštil mrtvolu přes hradby do državy, kterou vlastní [flingee.GetName]"
 ce1_corpse_flung_at_me: "mrtvola vymrštěná proti mně"
 ce1_corpse_flung_at_me_desc: "Z rozkazu [flingee.GetName] katapult vymrštil mrtvolu na mou državu"
 ce1_corpse_flung_at_me_desc_second_perspective: "Z rozkazu [flingee.GetName] katapult vymrštil mrtvolu na tvou državu"
 ce1_corpse_flung_at_me_desc_third_perspective: "Z rozkazu [flingee.GetName] katapult vymrštil mrtvolu na državu, kterou vlastní [owner.GetName]"
 ce1_meat_shower: "déšť masa"
 ce1_meat_shower_desc: "Z rozkazu [flinger.GetName] katapult vymrštil mrtvolu do mé državy a rozmetal ji na déšť krve a vnitřností"
 ce1_meat_shower_desc_second_perspective: "Z rozkazu [flinger.GetName] katapult vymrštil mrtvolu do tvé državy a rozmetal ji na déšť krve a vnitřností"
 ce1_meat_shower_desc_third_perspective: "Z rozkazu [flinger.GetName] katapult vymrštil mrtvolu do državy, kterou vlastní [owner.GetName], a rozmetal ji na déšť krve a vnitřností"
 epidemic_events.5000.t: "Udělejte něco!"
 epidemic_events.5000.desc: "Další chmurná zpráva z [infected_county.GetName].\n\n[church_person.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi ji podává. „Lidé požadují, abychom jednali!“ [church_person.GetFirstNameNoTooltip] divoce gestikuluje. „Vyhubme ta zvířata - šíří [epidemic.GetName]! [ROOT.Char.GetFaith.HighGodName] si to přeje!“\n\nPohlédnu na pergamen. [church_person.GetFirstNameNoTooltip] má v očích odhodlání. Já... pochybnosti."
 epidemic_events.5000.a: "Vlastně... ty krysy vypadají dost špinavě..."
 epidemic_events.5000.b: "Kočky se dostanou #EMP všude.#! Musí to být jejich vina."
 epidemic_events.5000.c: "Psi jsou neustále pokrytí špínou. Zbavte se jich!"
 epidemic_events.5000.d: "Musíme vybít ovce."
 epidemic_events.5000.e: "Není to nutné."
 epidemic_events.5001.t: "Zataraste dveře!"
 epidemic_events.5001.desc: "[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vtrhne dovnitř s vytřeštěnýma očima. Náruč zaplňuje [ROOT.Char.Custom('GetWritingMaterial')].\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U] - [epidemic_county.GetNameNoTier] se topí v mrtvolách! Ulice jsou ucpané těly!“ [courtier.GetFirstNameNoTooltip] práskne dopisy o stůl. Probírám se tou zběsilou změtí.\n\nNaposledy, co jsem [Select_CString(ROOT.Char.IsFemale,'slyšela','slyšel')] zprávy, byla [epidemic_scope.GetName] pod kontrolou..."
 epidemic_events.5001.a: "„Uzavřete to! Uzavřete #EMP všechno!#!“"
 epidemic_events.5001.b: "Věřím těm, kdo mají [epidemic_county.GetName] na starosti."
 epidemic_events.5001.c: "„Copak nemám dost starostí?! Tohle mi ještě chybělo: [courtier.Custom2('InsultNoun', ROOT.Char)]!“"
 epidemic_events.5001.d: "Nejlepší bude poslat pomoc, dokud je problém teprve v zárodku."
 epidemic_events.5001.e: "Budou si muset poradit."
 epidemic_events.5002.t: "Ticho na pobřeží"
 epidemic_events.5002.desc: "Při společné procházce mi [steward.GetFirstName] ponuře líčí epidemii, která se šíří v [coastal_province.GetName]. V dálce vidíme těla navršená podél pobřeží a poblíž nich opuštěnou loď vyvrženou na břeh. [steward.GetFirstNameNoTooltip] se ke mně otočí a ve tváři se objeví zamyšlený výraz.\n\n„Co kdybychom, [ROOT.Char.Custom('FormOfAddressForLiege')],“ začne, „prostě zařídili, aby ta těla přestala být naším problémem?“\n\nNa okamžik zůstanu zaraženě stát, ale pomalu mi dochází, co má na mysli. Loď je koneckonců opuštěná a těch těl se stejně musíme nějak zbavit..."
 epidemic_events.5002.a: "Kam asi proudí tahle voda?"
 epidemic_events.5002.a.tt: "Možná bychom z této lodi mohli udělat #EMP problém někoho jiného#!..."
 epidemic_events.5002.b: "„Naložte ji a pošlete po proudu.“"
 epidemic_events.5002.b.success: "Loď už nikdo nikdy nespatří"
 epidemic_events.5002.b.failure: "Loď o několik dní později znovu vypluje na břeh"
 epidemic_events.5002.b.criticalfailure: "Loď se potopí a těla vyplaví voda zpět na břeh"
 epidemic_events.5002.c: "Zaslouží si řádné pohřební obřady."
 epidemic_events.5002.d: "No, alespoň ta loď vypadá schopná plavby..."
 epidemic_events.5003.t: "Léčivé ruce"
 epidemic_events.5003.desc: "Ulice [location.GetName] pokrývá bláto a bída. [peasant.GetFirstName] se vrhne před mého koně a v náručí svírá zesláblé dítě.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], prosím,“ žadoní [peasant.GetFirstNameNoTooltip]. „[child.GetFirstName] je tak [Select_CString(child.IsFemale,'nemocná','nemocný')]. Váš královský dotek by [Select_CString(child.IsFemale,'ji','ho')] mohl uzdravit...“\n\nDéšť vytrvale bubnuje. Dítě se sotva drží na nohou."
 epidemic_events.5003.a: "„Stráže, dostaňte ode mě tu #EMP věc#!!“"
 epidemic_events.5003.b: "Pochybuji, že to pomůže, ale..."
 epidemic_events.5003.b.tt: "Víra rolníků v léčivou moc panovnického doteku má své výhody i nevýhody..."
 epidemic_events.5003.b.criticalsuccess: "Dítě se zázračně uzdraví"
 epidemic_events.5003.b.success: "Nákaza přetrvává, ale lidé vypadají spokojenější"
 epidemic_events.5003.b.failure: "Dítěti se přitíží"
 epidemic_events.5003.c: "Prostě pokračujme dál."
 epidemic_events.5004.t: "Lidský příliv"
 epidemic_events.5004.desc: "Řev, rána - dveře trůnního sálu se rozletí a dovnitř se valí záplava rolníků. Staří, mladí, nemocní, vyděšení - všechny oči se upírají na mě.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ prosí jeden z nich, „ochraňte nás před [epidemic_scope.GetName]. Musíte.“\n\nMé stráže stojí připravené a čekají na můj rozkaz."
 epidemic_events.5004.a: "„Pojďte dál, všichni!“"
 epidemic_events.5004.a.new_courtiers: "Všichni noví dvořané získají #positive_value 40#! mínění o #color_white tobě#!"
 epidemic_events.5004.a.old_courtiers: "Všichni dosavadní dvořané ztratí #negative_value 10#! mínění o #color_white tobě#!"
 epidemic_events.5004.b: "Vyprovoďte je ven."
 epidemic_events.5004.b.success: "Pochopí nutnost izolace"
 epidemic_events.5004.b.failure: "Musejí být násilím vyvedeni"
 epidemic_events.5004.c: "Stráže! Vyžeňte je."
 epidemic_events.5005.t: "Životy, nebo zlato?"
 epidemic_events.5005.desc: "Z pobřeží proudí zlato - a s ním i [epidemic_scope.GetName].\n\n[steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] má plán: obchodníci musejí před vyložením zboží projít izolací. „Udrží nás to v bezpečí,“ naléhá [steward.GetFirstNameNoTooltip].\n\nZavedení karantény znamená méně daní. Stojí bezpečí za tu cenu?"
 epidemic_events.5005.a: "Ať je to čtyřicet dní."
 epidemic_events.5005.a.coastal_quarantine: "Každá pobřežní provincie v [Concept('realm','panství')|E]"
 epidemic_events.5005.a.landholders: "Všichni $barons_and_minor_landholders_vassals$"
 epidemic_events.5005.b: "Dvacet dní v karanténě. Ani o den víc, ani míň."
 epidemic_events.5005.b.success: "Pochopí nutnost izolace"
 epidemic_events.5005.b.failure: "Musejí být násilím odvedeni"
 epidemic_events.5005.c: "Obchod je na prvním místě. Zdržení si nemůžeme dovolit."
 epidemic_events.5006.t: "Tady není čemu se smát"
 epidemic_events.5006.desc: "Chodbami se rozléhá smích - zvláštní, když venku stále řádí [epidemic_scope.GetName].\n\nPřede mnou stojí [councillor.Custom2('MyCharacterIntroduction', ROOT.Char)]. „Co je tak směšné?“\n\n[councillor.GetFirstNameNoTooltip] se zazubí. „Lékaři tvrdí, že nemoc pramení ze špatné nálady... tak ji prostě vysmějeme!“"
 epidemic_events.5006.a: "Máš naprostou pravdu! Ha ha ha! Hi hi!"
 epidemic_events.5006.b: "Jedinou spásou jsou prosby k [ROOT.Char.GetFaith.HighGodName]."
 epidemic_events.5006.c: "No... možná na tom něco je."
 epidemic_events.5006.c.success: "Opravdu se cítíš o něco lépe"
 epidemic_events.5006.c.failure: "Nevypadáš zrovna přesvědčivě"
 epidemic_events.5006.d: "Směšné."
 epidemic_events.5007.t: "Obvinění z čarodějnictví"
 epidemic_events.5007.desc: "Rozruch - [accuser.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vede rozzuřený dav. V koutě stojí [herbalist.Custom2('MyCharacterIntroduction', ROOT.Char)], [Select_CString(herbalist.IsFemale,'obklopená','obklopený')] ze všech stran.\n\n„Čarodějnice, co sbírá byliny!“ řve [accuser.GetFirstNameNoTooltip]. „Sotva [herbalist.GetFirstNameNoTooltip] [Select_CString(herbalist.IsFemale,'vyšla','vyšel')] ven, hned se za [Select_CString(herbalist.IsFemale,'ní','ním')] přihnala nákaza [epidemic_scope.GetName]!“\n\n[herbalist.GetFirstNameNoTooltip] neustupuje a odmítavě mává rukou, zatímco hlasy kolem sílí."
 epidemic_events.5007.a: "„Dost! Bylinkářství je ušlechtilé umění.“"
 epidemic_events.5007.b: "[Select_CString(herbalist.IsFemale,'Uvězněte tu čarodějnici!','Uvězněte toho čaroděje!')]"
 epidemic_events.5007.c: "Nesmysl."
 epidemic_events.5007.c.success: "Podaří se ti dav přesvědčit"
 epidemic_events.5007.c.failure: "Dav tvé argumenty ignoruje"
 epidemic_events.5007.d: "„Dost! Přestaň s těmi nepodloženými obviněními, [accuser.GetFirstNameNoTooltip].“"
 epidemic_events.5007.e: "Možná kdyby [herbalist.GetFirstNameNoTooltip] [Select_CString(herbalist.IsFemale,'slíbila','slíbil')], že s bylinkářstvím skončí...?"
 epidemic_events.5008.t: "V bezpečí"
 epidemic_events.5008.desc: "[epidemic_scope.GetName] rozhodně není #EMP nic dobrého#!, ale musím přiznat, že si tu samotu užívám. Žádné návštěvy, sotva pár sluhů. Je tu ticho. Klid.\n\nMožná mi tahle izolace pomáhá vyhnout se nemoci... nebo se prostě jen [Select_CString(ROOT.Char.IsFemale,'ráda','rád')] schovávám.\n\nPřesto... [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')] bych se zase ukázat lidem? Aspoň trochu?"
 epidemic_events.5008.a: "Nikdo mě nesmí spatřit bez mého svolení!"
 epidemic_events.5008.b: "Moji poddaní mě musejí vídat."
 epidemic_events.5008.c: "[epidemic_scope.GetNameNoTooltip] je ale skvělá výmluva!"
 epidemic_events.5009.t: "Vůně, která se drží"
 epidemic_events.5009.desc: "Tržiště páchne - z jednoho stánku se však kupodivu line příjemná vůně.\n\n„Čerstvé vonné váčky! Ty nejlepší byliny!“ volá obchodník a vtiskne mi jeden váček do ruky. „Odežene [epidemic_scope.GetName]!“\n\nVoní skutečně slibně... jen ta cena je pořádně vysoká."
 epidemic_events.5009.a: "„Kolik jich máte na prodej?“"
 epidemic_events.5009.b: "Vezmu si váš nejlepší váček [newly_created_artifact.GetNameNoTooltip]."
 epidemic_events.5009.b.success: "[merchant.GetFirstNameNoTooltip] neochotně souhlasí"
 epidemic_events.5009.b.failure: "[merchant.GetFirstNameNoTooltip] odmítá ustoupit"
 epidemic_events.5009.b.criticalfailure: "[merchant.GetFirstNameNoTooltip] vztekle odmítá prodat"
 epidemic_events.5009.c: "Jeden přece nemůže uškodit."
 epidemic_events.5009.d: "Tyhle váčky nikoho nezachrání."
 epidemic_events.5010.t: "Dusivé ulice: [capital.GetBaseNameNoTierNoTooltip]"
 epidemic_events.5010.opening: "Konečně dorazila. Obávaná nákaza se plíží ulicemi [capital.GetBaseNameNoTier] a její bezuzdná kosa sráží každého, kdo jí přijde do cesty.\n\n"
 epidemic_events.5010.santiago: "Po Svatojakubské cestě už kráčí jen hrstka poutníků. Pouze ti nejodolnější a nejzbožnější stále míří k městu zachvácenému nákazou a hledají spásu u Všemohoucího, i když sami podléhají odporné nemoci.\n\nNádherná náměstí, obvykle plná veselí a přátelského smlouvání, se stala útočištěm zatracených. Mrtví a umírající zde vydávají poslední chrčivé výdechy, žalostně opuštění."
 epidemic_events.5010.london: "Poklidný příliv Temže už nepřináší jen bahno a obchodníky. Po proudu plují nafouklé mrtvoly vybělené sluncem, jejich tváře zkřivené utrpením do němého šklebu a na bledé kůži se rudě rýsují prasklé boule.\n\nStaré římské hradby, které tolikrát chránily město před vpádem živých, jsou teď obloženy mrtvými. Křivolaké úzké ulice se změnily v bludiště navršených těl, mezi nimiž krysy nacházejí úkryt i potravu."
 epidemic_events.5010.rome: "Řím! Slavný Řím. Hlavní město světa.\n\nPo těchto ctihodných cestách kráčely nesčetné duše, ale řady mrtvých se každým dnem rozrůstají stále rychleji. Pohroma se valí ulicemi a ničí každé půvabné náměstí i velkolepý oblouk. Starý mramor mlčky přihlíží, bezmocný vůči utrpení živých. Umírající vydávají poslední chrčivé výdechy a na rtech mají otázku, na kterou se v lepších časech sotva kdo odvážil pomyslet:\n\n„Jak věčné je vlastně Věčné město?“"
 epidemic_events.5010.paris: "Klikaté vody Seiny spokojeně omývají břehy Île de la Cité a vůbec nedávají tušit katastrofu na souši.\n\nNemocní se beznadějně potácejí mezi chatrnými budovami. Tam, kde kdysi pekaři nabízeli své zboží, teď leží hromady mrtvých, protože živí už nestačí držet krok s přívalem nemoci svírajícím město.\n\nNebýt sténání a kašle umírajících, působila by ta scéna téměř pokojně."
 epidemic_events.5010.constantinople: "Město touhy světa. Královna měst. Brána ke štěstí. Křižovatka světa.\n\nTak vznešená a oslnivá jména nese mocná metropole rozprostřená od nepaměti na svém třpytivém výběžku. Teď však znějí krutě ironicky, když nemocní a zesláblí s námahou klopýtají mezi mrtvolami těch, kteří už podlehli.\n\nNacházejí snad ve chvíli smrti nějakou útěchu v dávné slávě?"
 epidemic_events.5010.prague: "Tržiště a obchodní náměstí, obvykle překypující ruchem, smrtelně ztichla. Hrdé mosty přes Vltavu jsou ucpané nemocnými a mrtvá těla vytvářejí mezi pilíři pod nimi hráze.\n\nVyšehrad smutně shlíží na tu zkázu. Jeho přísné hradby, založené před mnoha generacemi knížetem Krokem, nedokážou zastavit tak smrtícího a tichého zabijáka, jakým je obávaná nákaza.\n\nStověžatá Praha pomalu umírá a ani její vychvalované věže nedokážou zabránit tomu, aby se zřítilo samo nebe."
 epidemic_events.5010.toledo: "Které město je proslulejší svou ocelí než Toledo? Ve vodách Taja byly kaleny čepele milionu mečů, existují však hrozby, před nimiž neochrání ani to nejlepší řemeslo.\n\nJe krutou ironií, že tak rozmanité místo tváří v tvář této pohromě náhle sjednotil právě společný úděl. Nemoc nerozlišuje a sráží k zemi lidi ze všech vrstev.\n\nStarobylé kovárny umlkají. Ti, kdo v nich pracovali, teď své mozolnaté ruce nesvírají kolem nástrojů, ale spínají je k modlitbě v naději, že je božská moc zachrání tam, kde zbraň selhává."
 epidemic_events.5010.cairo: "Káhira je nepředstavitelně stará. Viděla vzestup i pád svých sesterských měst Memfidy a Héliopole, a přesto stále stojí. Už vydržela mnoho, ale teď bude muset vydržet ještě víc.\n\nNil, Řeka života, dnes ve svém proudu nese smrt. Zhoubou poznamenané mrtvoly odnáší voda, aby hnily v bahnitých deltách u moře, ale stále přibývají další a další. Nilometry se dusí těly, která do nich lidé zoufale házejí, aby ušetřili čas, místo i životy dosud živých.\n\nStaré město chřadne."
 epidemic_events.5010.kanyakubja: "Nikdo neví, kolik generací zde už žilo a zemřelo, všichni se však shodují, že samotné město je nepředstavitelně staré. Aby tuto hrozbu přežilo, bude potřebovat veškeré své zkušenosti a moudrost.\n\nProslulé voňavkářské dílny dál vyrábějí attary. Lahvičky z velbloudí kůže se plní až po okraj a zdraví je nosí na krku, aby odehnali zhoubné pachy.\n\nJinde se však od hradeb odráží už jen sténání mrtvých a umírajících, jejichž těla jsou v úzkých uličkách navršena do neuvěřitelné výše."
 epidemic_events.5010.varanasi: "Váránasí je známé především jako Město světla, ale stejně dlouho je také Městem mrtvých. Je tedy snad příhodné, že se stalo dějištěm této nejsmrtelnější z nákaz.\n\nV lepších časech se Ganga hemžila životem, teď však unáší jen mrtvé. Jejich nafouklá těla se zachytávají na březích a těch několik živých, kteří se ještě odváží ven, je odkopává zpět do proudu.\n\nPláč a kašel se odrážejí od prastarých kamenů tohoto města staršího než paměť."
 epidemic_events.5010.fallback: "Křivolaké ulice a natěsnané domy, obvykle překypující davy, teď mlčí. Ticho narušuje jen žalostný nářek pozůstalých a chrčivý vlhký kašel těch, kteří se brzy připojí k rostoucím řadám mrtvých."
 epidemic_events.5010.a: "Almužny mohou umírajícím alespoň ulehčit poslední cestu."
 epidemic_events.5010.b: "#DIE1 To město...#! #DIE2 mé drahocenné město...#!"
 epidemic_events.5010.b.win: "Odhodláš se město znovu vybudovat"
 epidemic_events.5010.b.neutral: "Trápí tě obtíže, které tě čekají"
 epidemic_events.5010.b.lose: "Propadneš děsu"
 epidemic_events.5900.t: "Černá smrt"
 epidemic_events.5900.desc: "Mor se plíží zemí.\n\nNa tělech obětí vyrůstají odporné mokvající boule a jejich žalostné volání o pomoc postupně umlká, když chroptí a dusí se ve vlastních hnisem zalitých hrdlech.\n\nOd nejubožejšího uličníka až po nejslavnějšího císaře se všichni děsí nerozlišující kosy nelítostného moru. Ti, kteří přežijí, mohou jen bezmocně přihlížet, jak kolem nich ostatní umírají.\n\nOddaní hledají spásu u božských sil a mocní ve svém bohatství, nikdo však není skutečně v bezpečí. Děsivá chapadla se rozpínají krajinou a svírají ji stále pevněji, až přestává dýchat.\n\nČerná smrt je tady. Kéž nás všechny ochrání [ROOT.Char.GetFaith.HighGodName]."
 epidemic_events.5900.desc_asia: "Mor kráčí mezi námi.\n\nTěla postižených otékají a pokrývají se vředy, jejich výkřiky slábnou v chrčení, jak jim dochází dech. Ve smrti umlknou i ti nejhlasitější.\n\nUšetřen není nikdo. Od bosého dělníka až po prince ukrytého za zdmi paláce se kolo utrpení otáčí pro všechny. Živým zbývá jen vymetat popel z prahů a počítat prázdná lůžka.\n\nJedni odříkávají sútry, druzí se upínají k obřadům a svému postavení - žádný rozkaz však nezastaví rozklad a žádné zásluhy nesmažou daň, kterou si nemoc vybírá. Jako mlha v údolí se mor šíří nepozorovaně, a přesto je cítit v každém nehybném ránu.\n\nČerná smrt je tady. Kéž Nebesa odvrátí svůj zrak."
 epidemic_events.5900.christian: "„Otče náš, jenž jsi na nebesích, posvěť se jméno tvé...“"
 epidemic_events.5900.fallback: "Kéž v těchto chmurných časech vytrváme."
 epidemic_events.5901.t: "Až po lokty"
 epidemic_events.5901.desc: "Mrtvola leží na stole mezi nejrůznějšími hrůznými nástroji. U ní stojíme já a [physician.GetFirstName], [Select_CString(physician.IsFemale,'má lékařka','můj lékař')].\n\n„Nejsem si [Select_CString(physician.IsFemale,'jistá','jistý')], [ROOT.Char.Custom('FormOfAddressForLiege')],“ začne [physician.GetFirstNameNoTooltip] nervózně a upírá pohled k zemi. „Nevím, co bychom z téhle mrtvoly mohli zjistit...“\n\n[physician.GetFirstNameNoTooltip] moc dobře ví, co bychom #EMP mohli#! udělat, jen nechce, aby takový požadavek vůbec zazněl. Pitva těla člověka, který zemřel na mor, by nám mohla poskytnout cenné poznatky o tom, jak s nemocí bojovat. Otázkou zůstává jen to, zda při tom nehrozí nákaza..."
 epidemic_events.5901.a: "„Co kdybychom to udělali společně?“"
 epidemic_events.5901.a.tt: "Získáš nové poznatky"
 epidemic_events.5901.a.tt.plague: "Nakazíš se morem"
 epidemic_events.5901.b: "Požaduji pitvu."
 epidemic_events.5901.c: "Dobrá, obejdeme se bez ní."
 epidemic_events.5902.t: "Na hranicích"
 epidemic_events.5902.desc: "Spěšně seskočím z koně a prodírám se zástupy vojáků v [border_province.GetName], ležícím v pohraničním hrabství [border_county.GetNameNoTier]. [marshal.GetFirstName] mě ve zprávě žádá o osobní přítomnost a rozhodnutí, a když ho spatřím, hned chápu proč.\n\nPřed námi nejistě postává otrhaný dav unavených a hladových lidí. Zjevně jsou to uprchlíci před krutým morem, který stále sužuje vzdálené země, ale nikdo nemůže zaručit, že vyvázli bez nákazy.\n\nUž teď vidím, jak jeden muž v davu chrchlá a kašle. [marshal.GetFirstNameNoTooltip] si nejistě zakryje ústa."
 epidemic_events.5902.a: "Nemůžeme to riskovat. Zabijte je všechny."
 epidemic_events.5902.b: "Mohli bychom pro ně zřídit provizorní tábory."
 epidemic_events.5902.c: "Pošlete je pryč."
 epidemic_events.5902.d: "Nechte je projít."
 epidemic_events.5903.t: "Odříkání prostých radostí"
 epidemic_events.5903.desc: "„[ROOT.Char.GetFirstName]! Ne!“ Hlas [family.GetFirstName] se ozve přes klapot kopyt mého koně kráčejícího po cestě. [family.GetFirstNameNoTooltip] ke mně přiběhne a vyčítavě ke mně vzhlédne.\n\n„Už [Select_CString(ROOT.Char.IsFemale,'jsi slyšela','jsi slyšel')], co se blíží. Všechna ta smrt a nemoc...“ [family.GetFirstNameNoTooltip] nešťastně lomí rukama. „Musíš zůstat tady. V bezpečí. [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'camp', 'walls')] mezi tebou a nákazou. Prosím.“\n\nNezbývá mi než si povzdechnout. Stačilo vyrazit o trochu dřív a teď bych [Select_CString(ROOT.Char.IsFemale,'projížděla','projížděl')] krajinou a v klidu si [Select_CString(ROOT.Char.IsFemale,'užívala','užíval')] přírody."
 epidemic_events.5903.a: "Asi má pravdu."
 epidemic_events.5903.b: "„Pche, nic se mi nestane!“"
 epidemic_events.5904.t: "Kazatelé konce světa"
 epidemic_events.5904.desc: "Na tržišti obvykle panuje čilý ruch, dnes se však celým místem rozléhá skutečná kakofonie. Brzy odhalím její zdroj: postavu, která křičí z plných plic.\n\n„Konec časů je tady!“ běduje [doomsday_preacher.GetFirstNameNoTooltip] a spílá kolemjdoucím. „Všichni zahyneme! Tak je psáno!“\n\nKapky slin létající z úst [doomsday_preacher.GetFirstNameNoTooltip] většinu lidí znechucují, několik přihlížejících však začíná hlasitě přitakávat."
 epidemic_events.5904.a: "Má pravdu! Musíme se připravit!"
 epidemic_events.5904.b: "Stráže? Zatkněte [Select_CString(doomsday_preacher.IsFemale,'tu kazatelku','toho kazatele')]."
 epidemic_events.5904.c: "„Ukaž mi, kde je to psáno. Dokaž svá slova.“"
 epidemic_events.5904.c.tt.success: "Dokážeš, že se mýlí"
 epidemic_events.5904.c.tt.failure: "Prohraješ disputaci"
 epidemic_events.5904.d: "„Neposlouchejte [doomsday_preacher.GetFirstNameNoTooltip]!“"
 epidemic_events.5904.d.tt: "Všechna [Concept('baronies','baronství')|E] sousedící s [doomsday_province.GetName] mají #color_white 15%#! šanci získat stejný [Concept('modifier','modifikátor')|E]"
 epidemic_events.5905.t: "Nakažlivá nervozita"
 epidemic_events.5905.desc: "Jakmile opadne počáteční rozruch, který mezi štamgasty vyvolala má přítomnost, ukáže se tahle krčma jako docela příjemné místo k odpočinku. [peasant.GetFirstName], místní [Select_CString(peasant.IsFemale,'hostinská','hostinský')], však působí poněkud nervózně.\n\n„Víte, [ROOT.Char.Custom('FormOfAddressForLiege')], o té velké morové ráně? Slyšeli jste, co to dělá s lidmi? Prý z nich dělá #EMP [ROOT.GetCharacter.Custom('GetPlagueEffect')]!#!“ [peasant.GetFirstNameNoTooltip] zběsile gestikuluje. „To se povídá! Jak tohle vůbec přežijeme?!“\n\nVěčně zaměstnané #EMP „povídá se“#! zase odvádí znamenitou práci..."
 epidemic_events.5905.a: "„Není třeba panikařit. Věřte mi, [Select_CString(ROOT.Char.IsFemale,'jsem lékařka','jsem lékař')].“"
 epidemic_events.5905.a.tt: "Všechna [Concept('baronies','baronství')|E], s kterými sousedí [province.GetName], mají #color_white 50%#! šanci získat stejný [Concept('modifier','modifikátor')|E]"
 epidemic_events.5905.b: "„Připadá vám to vůbec pravděpodobné?“"
 epidemic_events.5905.b.tt.success: "Úspěšně je přesvědčíš"
 epidemic_events.5905.b.tt.failure: "Nevypadají přesvědčeně"
 epidemic_events.5905.c: "Stejně [Select_CString(peasant.IsFemale,'ji','ho')] žádnou debatou nepřesvědčím."
 epidemic_events.5906.t: "Potulné blouznění"
 epidemic_events.5906.desc: "Stráže mě v radní síni obvykle neruší tak bezohledně, dnes však bez váhání vtrhnou dovnitř v čele s [marshal.GetFirstName], mým maršálem. Za nimi bez okolků vlečou zbědovanou postavu s vytřeštěnýma očima a bičem pevně sevřeným v rukou.\n\n„[Select_CString(flagellant.IsFemale,'Našli jsme ji','Našli jsme ho')] v [doomsday_province.GetName], jak bloumá ulicemi a bičuje se tím do krve.“ [marshal.GetFirstNameNoTooltip|U] ukáže na bič. „Místní k smrti děsí řečmi o tom, že se k nám blíží strašlivý mor a že všichni musíme činit pokání.“"
 epidemic_events.5906.a: "„Ty a tobě podobní ničíte [ROOT.Char.GetFaith.GetName]!“"
 epidemic_events.5906.a.tt.success: "Úspěšně obhájíš svůj názor"
 epidemic_events.5906.a.tt.failure: "Flagelant neustoupí"
 epidemic_events.5906.b: "Možná na tom něco je..."
 epidemic_events.5906.c: "„[Select_CString(flagellant.IsFemale,'Zavři ji','Zavři ho')], [marshal.GetFirstNameNoTooltip].“"
 epidemic_events.5906.d: "[Select_CString(flagellant.IsFemale,'Nechte ji jít','Nechte ho jít')]. Nikomu neubližuje."
 epidemic_events.5906.d.tt: "Všechna [Concept('baronies','baronství')|E] sousedící s [doomsday_province.GetName] mají #color_white 25%#! šanci získat stejný [Concept('modifier','modifikátor')|E]"
 fervor_loss_flagellants: "Volně se potulující flagelanti"
 epidemic_events.5907.t: "Lehké škrábání"
 epidemic_events.5907.desc: "Ranní slunce mi dopadá na víčka a ta se pomalu rozevřou. Posadím se, protáhnu, zívnu a... #EMP zakašlu#!.\n\nTrochu mě škrábe v krku. Oči mám také kalnější než obvykle. Dokonce cítím lehkou rýmu.\n\nAch ne. Prosím, jen ne já. Ušetři mě tohoto osudu. Řekni mi, [ROOT.Char.GetFaith.HighGodName], že se obávaný mor do těchto zemí nerozšířil a že si za oběť nevybral právě mě..."
 epidemic_events.5907.a: "Na mém dvoře dostanu tu nejlepší možnou léčbu!"
 epidemic_events.5907.b: "Nic to není. Určitě to nic není."
 epidemic_events.5907.b.success: "Opravdu to nic nebylo"
 epidemic_events.5907.b.failure: "Je to jen rýma"
 epidemic_events.5907.b.criticalfailure: "Skutečně onemocníš"
 epidemic_events.5908.t: "Hrobařská dřina"
 epidemic_events.5908.desc: "Hned první člověk, který ke mně dnes přichází s prosbou, zjevně nepatří k vyšším vrstvám. Hlína a špína pod nehty to jen potvrzují, [Select_CString(gravedigger.IsFemale,'třebaže si zjevně dala záležet na upraveném vzhledu','třebaže si zjevně dal záležet na upraveném vzhledu')].\n\n„Zastupuji hrobaře z [province.GetName], [ROOT.Char.Custom('FormOfAddressForLiege')],“ začne [gravedigger.GetFirstNameNoTooltip]. „Máme na vás prosbu. Obávaný mor se k nám blíží a naše ušlechtilé řemeslo bude brzy velmi žádané, o tom není pochyb.“\n\n„Právě my budeme zacházet s mrtvými těly a vystavovat se největšímu nebezpečí. Na oplátku žádáme jen o malé zvýšení odměny. Našlo by se v pokladnici pár mincí navíc?“"
 epidemic_events.5908.a: "„Ještě jednou si řeknete o přidání a vykopete si vlastní hrob.“"
 epidemic_events.5908.b: "Zajistěte jim spravedlivou odměnu."
 epidemic_events.5908.c: "„Pche! Takových jako vy je spousta.“"
 epidemic_events.5999.t: "Temný obzor"
 epidemic_events.5999.desc: "Na mém stole se vrší dopisy a zprávy. Všechny se týkají jediného tématu. Z jejich slov prosakuje panika a v mém nitru se rychle vzdouvá příval děsu.\n\nNemoc začíná zimnicí a horečkou, než se nešťastníkům v podpaží vytvoří nekrotické boule. Mezi záchvaty vykašlávání krve lapají po dechu a rty i prsty u nohou jim černají. Pak nemoc zabíjí bez rozdílu - bohaté i chudé, mladé i staré, vévodu i vyděděnce.\n\nZprávy zatím přicházejí ze vzdálených zemí, mé roztřesené prsty však sledují jejich data.\n\nBlíží se to."
 epidemic_events.5999.a: "Ha! Ať si zemřou."
 epidemic_events.5999.a.tt: "Je to tak daleko! Klidně se můžeme radovat z jejich neštěstí."
 epidemic_events.5999.b: "Musíme něco udělat!"
 epidemic_events.5999.b.tt: "Uzavřete budovy! Zataraste dveře! Vysaďte záhony růží!"
 epidemic_events.5999.c.christian: "#EMP „Pohlédl jsem, a hle, zelený kůň...“#!"
 epidemic_events.5999.c.notchristian: "Zlé znamení časů, které přijdou..."
 epidemic_events.0110.t: "Z prachu"
 epidemic_events.0110.desc: "Mor konečně opustil panství a my musíme využít příležitosti povstat z chaosu, který za sebou zanechal.\n\nVynořujeme se z trosek starého světa a nastal čas zamyslet se nad tím novým."
 epidemic_events.0110.desc.new_capital: "\n\nDavy přeživších se už začaly stěhovat do [new_preferred_capital.GetName] a hledají tam nové útočiště. Mohla by to být jedinečná příležitost založit nové hlavní město."
 epidemic_events.0110.a: "Jako nové hlavní město by se skvěle hodilo [new_preferred_capital.GetNameNoTierNoTooltip|U]."
 epidemic_events.0110.b: "Na obnově nesmíme šetřit."
 epidemic_events.0110.c: "Nemohu nic udělat."
 every_county_infected_10_years: "Každé [Concept('county','hrabství')|E], které bylo během posledních 10 let zasaženo nákazou"
 epidemic_events.alert_title: "Vypuknutí moru: [infected_county.GetNameNoTierNoTooltip]"
 epidemic_events.alert_description: "[Concept('epidemic','Mor')|E] známý jako [epidemic.GetName] zasáhl [infected_county.GetName]"
 msg_epidemic_infection: "[epidemic.GetNameNoTooltip|U] se šíří"
