 msg_epidemic_infection_desc_2: "[Concept('epidemic','Mor')|E] známý jako [epidemic.GetName] se rozšířil do [LEFT_TITLE.GetProvince.GetBaronyNameExplicitly] a [RIGHT_TITLE.GetProvince.GetBaronyNameExplicitly]"
 msg_epidemic_infection_desc: "[Concept('epidemic','Mor')|E] známý jako [epidemic.GetName] se rozšířil do [LEFT_TITLE.GetProvince.GetBaronyNameExplicitly], [RIGHT_TITLE.GetProvince.GetBaronyNameExplicitly] a $message_consolidation_others$"
