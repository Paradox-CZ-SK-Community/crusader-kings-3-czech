l_polish:
 health.1015.t: "[SCOPE.Custom('EventTitleDisease')]: Malé trápení"
 health.1015.desc: "#EMP Svědění.#! Uprostřed noci se probouzím a zjišťuji, že mám nohu rozškrábanou do krve. Nehty taky. Svědí to tak strašně, že se nedokážu přestat škrábat hlouběji a hlouběji.\n\nPonořím obličej do studené vody a doufám, že to přejde. V odrazu na mě hledí rudé oči."
 health.1015.court_physician.desc: "\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], obávám se, že jsou to spalničky.“"
 health.1015.a: "Už to nevydržím!"
 health.1016.t: "[SCOPE.Custom('EventTitleDisease')]: Karmínová fontána"
 health.1016.desc: "#EMP Agh.#! Svírám si břicho v bolestech. Už ani nevím, jak dlouho v téhle latríně sedím. Hodiny, dny? #EMP Týdny?#! Aghhhhhhh. Krvavá stolice bolí pokaždé víc. A ten zápach tomu vůbec nepomáhá.\n\nMám pocit, že omdlím..."
 health.1016.court_physician.desc: "\n\n„Obávám se, že jde o obléhací neduh, [ROOT.Char.Custom('FormOfAddressForLiege')].“"
 health.1016.a: "Prosím... vodu."
 health.1017.t: "[SCOPE.Custom('EventTitleDisease')]: Žár"
 health.1017.desc: "Nemůžu ty pohyby zastavit. Dost! Přestaň! Ruce se mi samy od sebe třesou a vidím, jak mi černají prsty. Křeče mi zmítají celým tělem, jako bych [Select_CString(ROOT.Char.IsFemale,'tančila','tančil')].\n\nVšechno hoří. Přestaň! #EMP PŘESTAŇ!#!"
 health.1017.court_physician.desc: "\n\n„Zdá se, že vás zachvátil oheň, který sesílá [ROOT.Char.GetFaith.HouseholdGodName], [ROOT.Char.Custom('FormOfAddressForLiege')].“"
 health.1017.a: "Ať to přestane!"
 health.1112.t: "[SCOPE.Custom('EventTitleDisease')]: Konečně se nadechnout"
 health.1112.desc: "Sednu si na postel a prohlédnu si ruce, dlaněmi vzhůru. Vyrážka je konečně pryč a kůže má zase svou normální barvu.\n\nSkoro mi přijde zvláštní zase volně dýchat bez toho úmorného svědění."
 health.1112.a: "Je čas vrátit se do života."
 health.1112.a.tt: "Získáváš imunitu proti této nemoci: [GetTrait('measles').GetName( GetNullCharacter )]"
 health.1113.t: "[SCOPE.Custom('EventTitleDisease')]: Oddech"
 health.1113.desc: "Skoro si ani nevšimnu okamžiku, kdy zase dokážu jasně myslet. Mlha, která mi svírala mysl, se jako by bez varování rozplynula.\n\nJídlo i voda ve mně konečně zůstávají a hlavou mi běží jediné: [ROOT.Char.Custom('FavoriteTreatDemand')]."
 health.1113.a: "Je čas něco zakousnout."
 health.1114.t: "[SCOPE.Custom('EventTitleDisease')]: Návrat k normálu"
 health.1114.desc: "Vstanu z postele a pohled na prsty se zdravou barvou mi připadá vzácný jako bílý jelen. Tělo mi konečně dopřálo trochu klidu. Po křečích ani stopy, už žádný tanec.\n\nÚlevně vydechnu. Klid. Jak mi chyběl."
 health.1114.a: "Odteď budu tančit jen na hostinách."
 epidemic_events.0001.t: "Šíří se"
 epidemic_events.0001.desc: "Přichází noc. Svírám dřevěný válečný stůl a zavírám oči. Na jeho desku dopadá můj pot. [disease_scope.GetNameNoTooltip( GetPlayer )|l] mě oslabuje a trpím [ROOT.Char.Custom('disease_desc_short')]. #EMP Co se to se mnou stalo?#!\n\nZvenčí stanu slyším tlumený kašel. Pro mě už je příliš pozdě - můžu jen doufat, že se nákaza nedostane k mým [Select_CString(dummy_gender.IsFemale,'ženám','mužům')]."
 epidemic_events.0001.a: "#EMP Zatraceně.#!"
 epidemic_events.0001.a.toast: "Nákaza se šíří"
 epidemic_events.0001.a.christian: "#EMP [ROOT.Char.Custom('christian_curse')|U].#!"
 epidemic_infected_knights_modifier: "Nakažení rytíři"
 epidemic_infected_army_modifier: "Nakažená armáda"
 christian_curse_bones: "[ROOT.Char.GetFaith.HighGodNamePossessive] hrob"
 christian_curse_nails: "[ROOT.Char.GetFaith.HighGodNamePossessive] kříž"
 christian_curse_nails2: "ať mě $chistianity_good_god_christ$ chrání"
 christian_curse_arms: "[ROOT.Char.GetFaith.HighGodNamePossessive] hněv"
 christian_curse_blood: "ať mě $chistianity_good_god_christ$ spasí"
 christian_curse_death: "[ROOT.Char.GetFaith.HighGodNamePossessive] soud"
 christian_curse_wounds: "[ROOT.Char.GetFaith.HighGodNamePossessive] trest"
 christian_curse_body: "[ROOT.Char.GetFaith.HighGodNamePossessive] kříž"
 disease_desc_short_plague: "černými boulemi"
 disease_desc_short_measles: "rudými skvrnami"
 disease_desc_short_dysentery: "krvavými výměšky"
 disease_desc_short_ergotism: "nekontrolovatelnými pohyby"
 disease_desc_short_typhus: "táborovou horečkou"
 disease_desc_short_consumption: "krvavým kašlem"
 disease_desc_short_smallpox: "jizvami a vyrážkou"
 disease_desc_short_cancer: "rakovinou"
 disease_desc_short_gout: "oteklými klouby"
 disease_desc_short_pneumonic: "úporným kašlem"
 disease_desc_short_great_pox: "pohlavními vředy"
 disease_desc_short_lovers_pox: "pohlavními puchýři"
 disease_desc_short_leper: "odpadávající kůží"
 disease_desc_short_incapable: "naprostou bezmocí"
 disease_desc_short_infirm: "tělesnou slabostí"
 disease_desc_short_ill: "neduhem"
 epidemic_events.1000.t: "[cult_epidemic.GetNameNoTooltip]: Kult nákazy"
 epidemic_events.1000.desc: "[Select_CString(charismatic_priest.IsFemale,'Kněžka','Kněz')] [charismatic_priest.GetFirstName] s horečnatým pohledem hlásá, že [cult_epidemic.GetName] je božím trestem a jedině uctívání [charismatic_priest.GetFaith.HighGodName|U] nás může zachránit. Davy se k [charismatic_priest.GetFirstName] hrnou, strženy zápalem a strachem.\n\nPokud [Select_CString(charismatic_priest.IsFemale,'ji','ho')] nikdo nezastaví, mohl by tento morový kult v [infected_county.GetName] i za jeho hranicemi svrhnout vládu těch, kdo vyznávají [ROOT.Char.GetFaith.GetName]."
 epidemic_events.1000.a: "[Select_CString(charismatic_priest.IsFemale,'Upalte tu šílenkyni!','Upalte toho šílence!')]"
 epidemic_events.1000.b: "Jistě je to neškodné."
 epidemic_events.1000.c: "Konečně jsem [Select_CString(ROOT.Char.IsFemale,'našla','našel')] [charismatic_priest.GetFaith.HighGodName|U]!"
 epidemic_events.1010.t: "Láska ze záhrobí"
 epidemic_events.1010.desc: "[epidemic_scope.GetName|U] se plíží mými zeměmi a [superstitious_courtier.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('superstitious_courtier'))], teď šeptá o něčem ještě horším.\n\n„Prosím, [ROOT.Char.GetTitleAsNameNoTooltip|U],“ naléhá [superstitious_courtier.GetFirstName], „všichni vědí, co pro tebe [dead_lover.GetFirstName] [Select_CString(dead_lover.IsFemale,'znamenala','znamenal')]. Nákaza však přichází s mrtvými. Musíme uzavřít rakev, v níž [dead_lover.GetFirstName] leží - přibít víko - než vstane a rozšíří kletbu.“"
 epidemic_events.1010.a: "„Jak se opovažuješ!“"
 epidemic_events.1010.b: "Možná má [superstitious_courtier.GetFirstName] pravdu..."
 epidemic_events.1010.c: "Přibijte víka všech rakví v panství!"
 all_realm_county_epidemic_scope: "Každé [Concept('county','hrabství')|E] v [Concept('realm','panství')|E], kde se šíří [epidemic_scope.GetName]"
 epidemic_events.1020.t: "Zkažený vzduch: [epidemic_county.GetNameNoTierNoTooltip|U]"
 epidemic_events.1020.desc: "[epidemic_county.GetNameNoTier] zažívá úpadek obchodu. [miasma_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] z toho viní miasma smrti a navrhuje podivný lék.\n\n„Pokud pole pokryjí sladce vonící [epidemic_province.Custom('get_region_flower_type_plural')], jejich vůně možná zažene nákazu.“\n\nPodivné. Ale možná o nic podivnější než sama nákaza."
 epidemic_events.1020.a: "Za pokus to stojí."
 epidemic_events.1020.b: "Jaké plýtvání zlatem."
 epidemic_events.1030.t: "Pijavice!"
 epidemic_events.1030.desc: "[leeched_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vpadne dovnitř s vytřeštěnýma očima a pytlem pijavic v rukou.\n\n„[epidemic_scope.GetName] řádí dál. Tu nákazu zastaví jedině pijavice!“ křičí [leeched_courtier.GetFirstName].\n\nPodle tradice by se měly používat jen pod dohledem odborníka, ale tohle jsou zoufalé časy. Opravdu si můžeme dovolit čekat?"
 epidemic_events.1030.a: "Rozdejte pijavice všem!"
 epidemic_events.1030.a.success: "Pijavice se osvědčí"
 epidemic_events.1030.a.failure: "Pijavice napáchají škodu"
 epidemic_events.1030.b: "Držme se osvědčených postupů."
 epidemic_events.1040.t: "Kult flagelantů"
 epidemic_events.1040.desc.intro: "[epidemic_scope.GetName|U] se šíří a v ulicích se objevují fanatici, kteří se bičují a tvrdí, že si tak vyslouží boží milost.\n\n"
 epidemic_events.1040.desc.mid.approves: "[chaplain.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chaplain'))], ke mně přichází s planoucíma očima. „[Select_CString(ROOT.Char.IsFemale,'Má paní','Můj pane')] - tohle je božské pokání v živé podobě. Musíme jejich počínání požehnat!“"
 epidemic_events.1040.desc.mid: "[chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] zuří. „Je to kacířství - zvrácené a nebezpečné! Musíš to odsoudit.“\n\nDav skanduje ještě hlasitěji."
 epidemic_events.1040.a: "Musíme tu zvrácenost zastavit!"
 epidemic_events.1040.b: "Ubližují jen sobě."
 epidemic_events.1040.c: "Jestli mluví pravdu, budu se bičovat i já!"
 epidemic_events.1050.t: "Soudný den"
 epidemic_events.1050.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chaplain'))|U] [chaplain.GetFirstName] přechází venku sem a tam, [Select_CString(chaplain.IsFemale,'bledá a otřesená','bledý a otřesený')]. „[ROOT.Char.GetTitleAsNameNoTooltip|U], kacíři křičí, že [epidemic_scope.GetName] je [ROOT.Char.GetFaith.HighGodNamePossessive] hněv a že se blíží konec!“\n\nNásilí. Panika. Fanatici v ulicích hlásají zkázu.\n\n„Musíme jednat. Jinak jejich šílenství pohltí i ten zbytek pořádku, který nám zbývá.“"
 epidemic_events.1050.a: "Vymýtit je!"
 epidemic_events.1050.b: "Pošlete teology, ať s nimi vedou disputaci!"
 epidemic_events.1050.b.tt.success: "Strach z apokalypsy je zažehnán"
 epidemic_events.1050.b.tt.failure: "Lidé se nenechají přesvědčit"
 epidemic_events.1050.c: "Možná mají pravdu..."
 story_plague_trials_title: "Morové procesy:"
 epidemic_events.1060.t: "$story_plague_trials_title$ Původci nákazy"
 epidemic_events.1060.desc.intro: "S tím, jak se [epidemic_scope.GetName] šíří, strach plodí šílenství.\n\n"
 epidemic_events.1060.desc.mid.cats: "Šeptá se, že nákazu přinášejí kočky - prokletí familiáři s lesklou srstí. Vesničané je topí ve studnách nebo pálí v koších. Kde dříve lovily havěť, jsou teď samy loveny."
 epidemic_events.1060.desc.mid.dogs: "Rolníci teď tvrdí, že nákazu roznášejí psi a že jim v očích plane prokleté světlo. Psi jsou loveni, hnáni před fraškovité soudy, a dokonce upalováni."
 epidemic_events.1060.desc.mid.faith: "[faith_to_blame.GetAdherentNamePlural] už dlouho žijí mezi námi, teď v nich však lidé vidí prokletí. „Jejich víra rozhněvala nebesa,“ říkají sedláci, „a teď za to trpíme.“ Jejich chrámy jsou hanobeny. Jejich vlastní modlitby se obracejí proti nim."
 epidemic_events.1060.desc.mid.trait: "Každý, kdo dává najevo zakázané touhy, podivné zvyky či zavrhované neřesti, končí v rukou davu. Zženštilé gesto, oplzlý vtip, zastřené obvinění - cokoli stačí k odsouzení."
 epidemic_events.1060.desc.mid2.witches: "Říká se, že zemi proklely čarodějnice - kořenářky, porodní báby, vyvrhelkyně. Sousedé je obviňují, vláčejí z domovů a odsuzují bez soudu, stačí jediný výkřik."
 epidemic_events.1060.desc.mid2.sin: "Věří, že jsem až příliš [sinful_trait.GetName(ROOT.Char)] a že jedině hromadné pokání a tvrdé tresty nám dovolí znovu žít tak, jak si přeje [ROOT.Char.GetFaith.HighGodName]."
 epidemic_events.1060.desc.outro: "\n\n[ROOT.Char.GetFaith.PriestNeuterPlural|U] toto počínání odsuzují. Zabíjení však pokračuje."
 epidemic_events.1060.a: "Nemohu nic udělat."
 epidemic_events.1060.b: "Okamžitě je zastavte!"
 epidemic_events.1060.c: "Možná nám odpověď dá [ROOT.Char.GetFaith.ReligiousText|U]."
 witch_trial_story_tt: "#EMP To nejhorší možná teprve přijde...#!"
 epidemic_events.1061.t: "$story_plague_trials_title$ Zvířecí hranice"
 epidemic_events.1061.desc.intro: "Probouzím se pod oranžově zářící oblohou a vzduch je prosycen dusivým kouřem. Zapálili snad rolníci celé město?\n\n"
 epidemic_events.1061.desc.mid.cats: "Ne - jsou to kočky. [chaplain.GetTitledFirstName] mi sděluje, že je lidé upalují zaživa, aby zahnali [epidemic_scope.GetName]."
 epidemic_events.1061.desc.mid.dogs: "Ne - jsou to psi. [chaplain.GetTitledFirstName] mi sděluje, že je lidé upalují zaživa, aby zahnali [epidemic_scope.GetName]."
 epidemic_events.1061.desc.outro: "\n\n„Příšerná záležitost,“ zamumlá [chaplain.GetFirstNameNoTooltip]. „Ale velice oblíbená.“"
 epidemic_events.1061.a: "Asi s tím nic nezmůžu."
 epidemic_events.1061.a.success: "Pálení zvířat nemá žádný účinek"
 epidemic_events.1061.a.failure: "Pálení zvířat jakýmsi způsobem zvyšuje počet nakažených"
 epidemic_events.1061.b: "Tohle musí přestat!"
 epidemic_events.1061.c: "Ubližování těmto zvířatům se musí stát zločinem."
 epidemic_events.1062.t: "$story_plague_trials_title$ Lovci"
 epidemic_events.1062.desc.intro: "[ROOT.Char.Custom('GetCourt')|U] náhle zaplní skupina pytláků páchnoucích potem a kouřem.\n\n"
 epidemic_events.1062.desc.mid.cats: "„[Select_CString(ROOT.Char.IsFemale,'Má paní','Můj pane')], za všechno mohou kočky. Kluzké potvory - příliš mnoho očí a nikdy nespí. Lidé říkají, že svým předením roznášejí nákazu.“"
 epidemic_events.1062.desc.mid.dogs: "„[ROOT.Char.GetTitleAsNameNoTooltip|U], psi jsou prokletí. To přece ví každý. Dovol nám dokončit očistu - každé zvíře, každý čokl musí zemřít, dokud nákaza neskončí.“"
 epidemic_events.1062.desc.outro: "\n\nS úšklebky čekají na mé požehnání. Krev už mají na botách."
 epidemic_events.1062.a: "Zabijte je všechny."
 epidemic_events.1062.a.no_effect: "Zabíjení zvířat nemá žádný účinek"
 epidemic_events.1062.a.success: "Nákaza ustupuje"
 epidemic_events.1062.a.failure: "Nákaza se zhoršuje"
 epidemic_events.1062.b: "Přiveďte je živé do hlavního sídla."
 epidemic_events.1062.b.no_effect: "Nemá to žádný účinek"
 epidemic_events.1062.b.failure: "Hlavní sídlo zaplaví vzteklá zvířata"
 epidemic_events.1063.t: "$story_plague_trials_title$ Kajícníci!"
 epidemic_events.1063.desc.intro: "V centru [ROOT.Char.GetCurrentLocation.GetNameNoTooltip|U] se shromáždil dav a vzduch je prosycen panikou. Nad všechen ten hluk se nese hlas osamělého kazatele - chraplavý, naléhavý a jakýmsi způsobem hlasitější než všichni ostatní.\n\n„Kajícnost! Čiňte pokání!“"
 epidemic_events.1063.desc.mid.faith: "„Tuhle nákazu nezpůsobili ti, kdo vyznávají [faith_blamed.GetName]!“"
 epidemic_events.1063.desc.mid.sin: "„Tahle nákaza je trestem, který na nás sesílá [ROOT.Char.GetFaith.HighGodName|U] za naši slabost a hřích, kterému jsme propadli - [trait_blamed.GetName(ROOT.Char)]!“"
 epidemic_events.1063.desc.mid.witch: "„Neměli bychom obracet zrak k čarodějnicím, ale sami k sobě!“"
 epidemic_events.1063.desc.mid.cats: "„Svalovat tuto nákazu na tak ubohé a politováníhodné tvory, jako jsou kočky, je absurdní!“"
 epidemic_events.1063.desc.mid.dogs: "„Svalovat tuto nákazu na prostoduché psy je nesmysl!“"
 epidemic_events.1063.desc.outro: "„Jedině když budeme usilovat o ctnost, kterou představuje [virtuous_trait.GetName(ROOT.Char)], můžeme vůbec doufat, že nákaza skončí.“\n\nLidé souhlasně mumlají. Po pravdě řečeno část mého nitra přemítá, zda nemají pravdu. Můj hřích sahá hluboko, hlouběji, než bych [Select_CString(ROOT.Char.IsFemale,'byla ochotná','byl ochotný')] nahlas přiznat. A jestli je tahle nákaza soudem... možná začíná právě u mě."
 epidemic_events.1063.a: "Činím pokání!"
 epidemic_events.1063.b: "Samé žvásty."
 epidemic_events.1063.c: "Pouličního kazatele snad v disputaci porazím."
 epidemic_events.1063.c.success: "Přesvědčíš kazatele, aby ustoupil"
 epidemic_events.1063.c.failure: "Ztrapníš se"
 epidemic_events.1064.t: "$story_plague_trials_title$ Hranice čistoty"
 epidemic_events.1064.desc.intro: "Přes veškerou mou snahu pověru potlačit se po celém panství rozhořely čarodějnické procesy, nikde však tak prudce jako v hrabství [witch_trial_county.GetNameNoTier]. Nákaza [epidemic_scope.GetName] tam proměnila strach v zuřivost.\n\n"
 epidemic_events.1064.desc.mid.sin: "Topí nevinné a upalují nemocné - to vše ve jménu vymýcení těch, jimž přisuzují neřest „[trait_blamed.GetName(ROOT.Char)]“. Každá další hranice zanechává mé země chudší a vyděšenější."
 epidemic_events.1064.desc.mid.witch: "Topí nevinné a upalují nemocné - to vše ve jménu čistoty. Každá další hranice zanechává mé země chudší a vyděšenější."
 epidemic_events.1064.desc.outro: "\n\nJestli je tohle spravedlnost, nemá z ní prospěch ani [ROOT.Char.GetFaith.HighGodName|U], ani koruna."
 epidemic_events.1064.a: "Pošlete rychtáře do hrabství [witch_trial_county.GetNameNoTierNoTooltip]. Tady to skončí."
 epidemic_events.1064.b: "Ty procesy musí skončit!"
 epidemic_events.1064.c: "Musíme proti tomu kázat."
 epidemic_events.1064.c.success: "Tvá slova lidi přesvědčí"
 epidemic_events.1064.c.failure: "Procesy pokračují"
 epidemic_events.1065.t: "$story_plague_trials_title$ Potupa"
 epidemic_events.1065.desc.intro: "Mor strachu teď zasáhl i mou vlastní domácnost.\n\nKazatelé poštvali dav proti [shamed_buddy.Custom2('MyCharacterIntroduction', ROOT.Char)]. Tvrdí, že [shamed_buddy.GetFirstNameNoTooltip] "
 epidemic_events.1065.desc.mid.sin: "je [trait_blamed.GetName(shamed_buddy)],"
 epidemic_events.1065.desc.mid.witch: "se věnuje čarodějnictví,"
 epidemic_events.1065.desc.outro: "[Select_CString(shamed_buddy.IsFemale,'společnost jí dělají','společnost mu dělají')] [ROOT.Char.GetFaith.EvilGodNames] a oddává se hříchu zahalenému do hedvábí. Teď dav požaduje veřejný trest - vyvlečení ze síní a veřejné pokání.\n\nOdmítnutí hrozí vzpourou. Ustoupit znamená zostudit korunu."
 epidemic_events.1065.a: "Dejte jim, co chtějí."
 epidemic_events.1065.b: "Odmítám!"
 epidemic_events.1065.c: "Převezmu ten trest na sebe."
 epidemic_events.1066.t: "$story_plague_trials_title$ Vyhnání"
 epidemic_events.1066.desc: "Žádná slova už rolníky nepřesvědčí - [faith_blamed.GetAdherentNamePlural] jsou podle nich důvodem, proč se šíří [epidemic_scope.GetName]. Jejich obchodníci jsou obtěžováni a jejich domovy hanobeny. Mnozí už uprchli a obchod upadá.\n\nA co hůř, v některých vesnicích je dokonce loví.\n\nPokud bude toto pronásledování pokračovat, mé panství se může vykrvácet - ne kvůli nákaze, ale kvůli strachu."
 epidemic_events.1066.a: "Takové jednání musí být potrestáno."
 epidemic_events.1066.b: "Tohle už nedokážu ovlivnit."
 epidemic_events.1066.c: "V hlavním městě jim mohu nabídnout útočiště."
 epidemic_events.1067.t: "[faith_blamed.GetName|U]: Příliv uprchlíků před nákazou"
 epidemic_events.1067.desc: "Zatímco [epidemic_scope.GetName] pustoší [bigoted_ruler_that_everyone_hates.GetNamePossessive] panství, tamní rolníci vytrvale svalovali vinu na [faith_blamed.GetAdherentNamePlural]. Situace zašla tak daleko, že [bigoted_ruler_that_everyone_hates.GetPrimaryTitle.GetNameNoTierNoTooltip|U] zažívá masový odchod obyvatel a mnozí z nich teď míří do mých zemí."
 epidemic_events.1067.a: "Tady jsou vítáni."
 epidemic_events.1067.b: "Brány nákaze otevřít nemůžeme."
 epidemic_events.1067.c: "Nabídněte jim útočiště v hlavním městě."
 every_bordering_county: "Každé hrabství sousedící s panstvím, jemuž vládne [bigoted_ruler_that_everyone_hates.GetName]"
 epidemic_events.1068.t: "$story_plague_trials_title$ Půjčky v nedohlednu"
 epidemic_events.1068.desc: "Hony na čarodějnice kvůli [epidemic_scope.GetName] namířené proti těm, kteří vyznávají [faith_blamed.GetName], dusí obchod po celém panství.\n\n[loneless_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se vpotácí ke dvoru a vypadá jako žebrák. „Pronásledování vyhnalo všechny věřitele, [ROOT.Char.GetTitleAsNameNoTooltip]. Strach z nákazy - a z davu - umlčel cinkot každé mince. Půjčky na úrok zmizely. Má pokladnice je prázdná. Tvá může být další.“"
 epidemic_events.1068.a: "[loneless_vassal.GetPrimaryTitle.GetNameNoTierNoTooltip|U] se stane bezpečným útočištěm pro všechny."
 epidemic_events.1068.b: "Mohu ti nabídnout půjčku."
 epidemic_events.1068.c: "To je nemilé."
 all_of_vassals_holding: "Všechny državy, které vlastní [loneless_vassal.GetName]"
 epidemic_events.1100.t: "Stín nákazy: [infected_county.GetNameNoTierNoTooltip|U]"
 epidemic_events.1100.desc.intro.apocalyptic: "Ulice hrabství [infected_county.GetNameNoTier] utichly. Mor, který sesílá [ROOT.Char.GetFaith.DeathDeityName|U], zahalil"
 epidemic_events.1100.desc.intro.major: "Projít hrabstvím [infected_county.GetNameNoTier] znamená vyslechnout děsivou symfonii lidského utrpení. Mor zachvátil"
 epidemic_events.1100.desc.intro.fallback: "Procházka hrabstvím [infected_county.GetNameNoTier] odhalí něco hluboce znepokojivého. Mor zasáhl"
 epidemic_events.1100.desc.intro2.holy_site: "toto nejsvětější místo.\n\n"
 epidemic_events.1100.desc.intro2.cool_place: "tuto kdysi vzkvétající metropoli.\n\n"
 epidemic_events.1100.desc.intro2.backwater: "tuto nenápadnou osadu.\n\n"
 epidemic_events.1100.desc.mid.typhus: "Nakažení jsou od hlavy až k patě pokryti vyrážkou, která na dotek pálí.\n\n"
 epidemic_events.1100.desc.mid.bubonic_plague: "Kůži nakažených pokrývají černé hnisavé boule plné odporné tekutiny, z nichž po prasknutí uniká zkažený vzduch.\n\n"
 epidemic_events.1100.desc.mid.smallpox: "Kůže nakažených je temně rudá a posetá boulemi a puchýři. Nekonečné svědění na ní zanechalo bezpočet čerstvých jizev a jejich beznadějné oči jsou podlité krví.\n\n"
 epidemic_events.1100.desc.mid.measles: "Hrbolatá kůže nemocných je jasně rudá a bolestivá na dotek. Potí se i v chladu a v očích mají výraz malomocných.\n\n"
 epidemic_events.1100.desc.mid.dysentery: "Když pohlédnu nakaženým do očí, zeje v nich prázdnota, jako by jejich duch pobýval někde jinde. Oděv mají vzadu potřísněný temně rudou barvou a svírají si břicho, jako by se snažili zabránit tomu, aby jim vypadlo z těla.\n\n"
 epidemic_events.1100.desc.mid.ergotism: "Nakažení se v náhodných chvílích svíjejí v bezbožném tanci, který střídá bezmyšlenkovité sténání a kálení přímo na ulici.\n\n"
 epidemic_events.1100.desc.mid.consumption: "Kamkoli člověk přijde, všude ho pronásleduje neustávající chrchlání a kašel nakažených, jejichž oděv barví sražená krev do temně karmínova.\n\n"
 epidemic_events.1100.desc.mid.fallback: "Obyvatelstvo sužují nejrůznější zkažené tělesné šťávy a příznaků je tolik, že je ani nelze všechny vyjmenovat.\n\n"
 epidemic_events.1100.desc.mid2.apocalyptic: "Ve městě už téměř nezůstala duše, kterou by tato strašlivá nemoc nezasáhla, a rychle se blíží i k urozeným."
 epidemic_events.1100.desc.mid2.major: "Nakažena je nejméně polovina selského obyvatelstva a je jen otázkou času, kdy se nemoc rozšíří mezi urozené."
 epidemic_events.1100.desc.mid2.fallback: "Počet nakažených je zatím nízký, ale je jen otázkou času, kdy se nemoc rozšíří dál."
 epidemic_events.1100.desc.outro.capital: "Lidé už tomuto neduhu říkají „[epidemic.GetName]“ a všechno se to odehrává přímo za mým prahem."
 epidemic_events.1100.desc.outro: "Lidé už tomuto neduhu říkají „[epidemic.GetName]“."
 epidemic_events.1100.a.already_has_it: "Obávám se, že už je příliš pozdě..."
 epidemic_events.1100.a.compassionate: "Ti ubozí nemocní rolníci..."
 epidemic_events.1100.a.callous: "No, s tím nic nenadělám."
 epidemic_events.1100.a.diligent: "Budu to bedlivě sledovat."
 epidemic_events.1100.a.paranoid: "#EMP Nikdy#! neopustím svůj pokoj!"
 epidemic_events.1100.a.brave: "Už jsem [Select_CString(ROOT.Char.IsFemale,'přežila','přežil')] horší."
 epidemic_events.1100.a.cannibal: "Takové plýtvání dobrým masem."
 epidemic_events.1100.a.eccentric: "Nemůžu to prostě přečkat na lodi?"
 epidemic_events.1100.a.zealous: "Ať nás [ROOT.Char.GetFaith.HealthGodName|U] chrání."
 epidemic_events.1100.a: "Někdo by s tím měl něco udělat."
 epidemic_events.1100.b: "Přivolejte lékaře!"
 epidemic_events.1100.c: "Sežeňte lékaře!"
 look_for_physician_epidemic_tt: "Vyhledáš postavu na pozici [GetCourtPositionType('court_physician_court_position').GetName()], která ti pomůže zmírnit dopady [Concept('epidemic','moru')|E]"
 physician_will_help_epidemic_tt: "Díky pozici [GetCourtPositionType('court_physician_court_position').GetName()] získáš řadu možností, jak zmírnit dopady [Concept('epidemic','moru')|E]"
 epidemic_events.1110.t: "Mrtvoly v ulicích"
 epidemic_events.1110.desc: "[chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] přichází s popelavou tváří.\n\n„[Select_CString(ROOT.Char.IsFemale,'Má paní','Můj pane')], mrtví hnijí v ulicích. Nedokážeme je pohřbívat dost rychle - miasma houstne. Musíme zpřístupnit [GetBuilding('burial_site_01').GetName] v hrabství [graveyard_county.GetName].“\n\nNežádá o svolení. Prosí o ně."
 epidemic_events.1110.a: "Budiž."
 epidemic_events.1110.b: "To místo je určeno jen mně a mým blízkým."
 epidemic_events.1120.t: "Hrůzný dar"
 epidemic_events.1120.desc: "Při vstupu na území [flung_corpse_location.GetName] mi hlavou probleskne ďábelský nápad. Několik vojáků je kvůli nákaze [epidemic_scope.GetName] na pokraji smrti a brzy opustí tento svět. I po smrti by mi však ještě mohli posloužit v této válce.\n\nZ mrtvol se jistě bude šířit miasma, kvůli němuž onemocní další mí vojáci, pokud se těl nějak nezbavíme. Možná [corpse_flingee.GetName] konečně padne na kolena, když tam katapultem pošleme malý dárek..."
 epidemic_events.1120.a: "Naložte těla!"
 epidemic_events.1120.b: "To je odporné!"
 epidemic_events.1121.t: "Dar z nebes"
 epidemic_events.1121.desc: "Vojsko pod velením [corpse_flinger.GetName] vstoupilo do mých zemí a zastavilo se před mou državou. Možná je to začátek obléhání.\n\nKrátce nato se zvenčí ozve náhlá rána následovaná mokrým plácnutím. Vyběhnu ven zjistit, co mohlo vydat tak nepřirozený zvuk, a při tom pohledu mi ztuhne krev v žilách.\n\nZohavené pozůstatky mrtvoly leží v louži masa a kostí jako nějaká děsivá výstavka v řeznictví. Tělo zjevně rozežírá jakási cizí nemoc, a pokud nic neuděláme, nákaza jistě propukne."
 epidemic_events.1121.a: "Pošlete ten dárek zpátky!"
 plague_averted_tt: "Mor je odvrácen"
 plague_still_infects_tt: "Těla jsou příliš rozdrcená na převoz"
 epidemic_events.1121.b: "Izolujte tělo a vyčistěte okolí!"
 epidemic_events.1121.b.success: "Karanténa je úspěšná"
 epidemic_events.1121.b.failure: "Karanténa selže"
 epidemic_events.1121.c: "Hlavně to ode mě držte dál!"
 epidemic_events.1122.t: "Vrácený dar"
 epidemic_events.1122.desc: "Vzduchem se nese tiché hvízdání, když se za hradbami [flung_corpse_location.GetName] cosi objeví. Hvízdání sílí, až předmět náhle s mokrým žuchnutím dopadne doprostřed tábora.\n\nV kráteru leží krev, kosti a zuby, sotva ještě spojené s beztvarou hmotou masa, k níž kdysi patřily. Zdá se, že si náš „dar“ našel cestu zpátky."
 epidemic_events.1122.a: "Teď už je to příliš zohavené na převoz."
 epidemic_events.1122.b: "Posbírejte to a zkuste to znovu!"
 epidemic_events.1122.b.success: "Vymrštíš „tělo“ zpět"
 epidemic_events.1122.b.failure: "$plague_still_infects_tt$"
 epidemic_events.1123.t: "Déšť masa"
 epidemic_events.1123.desc: "Slyším jemné bubnování deště na okenní parapet. Trochu mě to zarazí, protože když jsem se naposledy [Select_CString(ROOT.Char.IsFemale,'dívala','díval')] ven, obloha byla jasná. Vyhlédnu tedy z okna a vidím, že je stále modrá.\n\nNatáhnu ruku z okna a s hrůzou sleduji, jak mi prsty smáčí tmavě hnědá krev. Všude kolem jsou mé země skrápěny tou odpornou tekutinou a tu a tam s těžkým plácnutím dopadne kus masa. Těla byla očividně znovu vymrštěna, jenže tentokrát už je ta hrůzná cesta proměnila v pouhou kaši z krve a vnitřností."
 epidemic_events.1123.a: "Naprosto příšerné."
 burning_animals_does_nothing_tt: "Pálení zvířat nemělo žádný účinek"
 cats_and_dogs_trial_will_end_tt: "#EMP Procesy skončí...#!"
 friend_plague_financial_help: "Během moru poskytla postava jménem [CHARACTER.GetShortUIName|U] finanční pomoc postavě jménem [TARGET_CHARACTER.GetShortUIName]."
