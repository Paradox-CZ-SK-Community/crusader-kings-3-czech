 book_is_gibberish: "Kniha je naprostý blábol"
 minor_epidemic_treatment.tt: "Volíš bezpečnou léčbu"
 moderate_epidemic_treatment.tt: "Volíš riskantnější léčbu"
 mystic_epidemic_treatment.tt: "Volíš mystickou léčbu"
