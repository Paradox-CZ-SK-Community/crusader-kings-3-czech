 rival_prevented_from_protecting_sick_corresponding: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'zabránila','zabránil')] tomu, aby [TARGET_CHARACTER.GetShortUIName] [Select_CString(TARGET_CHARACTER.IsFemale,'poskytovala','poskytoval')] lékařskou péči nepřátelským bojovníkům"
 rival_heretical_physician: "[CHARACTER.GetShortUIName|U] se [Select_CString(CHARACTER.IsFemale,'rozzuřila','rozzuřil')], když [TARGET_CHARACTER.GetShortUIName] [Select_CString(TARGET_CHARACTER.IsFemale,'povolila','povolil')] kacířskou léčbu nákazy"
 rival_heretical_physician_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] se [Select_CString(TARGET_CHARACTER.IsFemale,'rozzuřila','rozzuřil')], když [CHARACTER.GetShortUIName] [Select_CString(CHARACTER.IsFemale,'povolila','povolil')] kacířskou léčbu nákazy"
 pharmaceuticals: "O léčivech podle [physician.GetFirstName]"
 pharmaceuticals_desc: "Kompendium bylinných léčiv a radikálních způsobů léčby nejrůznějších neduhů se zvláštním důrazem na to, jak působí [epidemic_scope.GetName]."
