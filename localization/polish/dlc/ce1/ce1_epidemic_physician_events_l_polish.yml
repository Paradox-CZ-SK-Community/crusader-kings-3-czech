l_polish:
 physician_epidemic_events.1000.t: "Neortodoxní léčba"
 physician_epidemic_events.1000.desc: "[physician.Custom2('MyCharacterIntroduction', ROOT.Char)] a [zealous_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] se zuřivě přou o to, jak se vypořádat se šířící se nákazou [epidemic_scope.GetName].\n\n„Jsem [Select_CString(physician.IsFemale,'lékařka','lékař')]!“ trvá na svém [physician.GetFirstNameNoTooltip]. „Nechte mě tu pohromu vymýtit!“\n\n„Kacířství!“ zavrčí [zealous_courtier.GetFirstNameNoTooltip]. „Musíme mrtvé pomazat a dopřát jim řádné obřady, jak přikazuje [zealous_courtier.GetFaith.GetName].“"
 physician_epidemic_events.1000.a: "Možná bychom prostě měli držet mrtvá těla dál od živých."
 physician_epidemic_events.1000.b: "Musíme udělat vše, co je v našich silách, abychom tuto pohromu zastavili."
 physician_epidemic_events.1000.b.success: "Léčba zabere"
 physician_epidemic_events.1000.b.failure: "Léčba selže"
 physician_epidemic_events.1000.c: "Tato těla znesvětit nedovolíme."
 physician_epidemic_events.1010.t: "Karanténa"
 physician_epidemic_events.1010.desc: "Zatímco se [epidemic_scope.GetName] šíří, [physician.Custom2('MyCharacterIntroduction', ROOT.Char)] mě naléhavě vybízí k drastickému řešení: nemocné izolovat. „Miasma ulpívá na mrtvolách,“ varuje [Select_CString(physician.IsFemale,'lékařka','lékař')], „a zkažený vzduch živí nákazu.“\n\nChce zavést karanténu — z nakažených oblastí nikdo nesmí ven ani dovnitř.\n\n„V zoufalých časech, můj císaři, musíme udělat, co je třeba.“"
 physician_epidemic_events.1010.a: "Uzavřete cesty. Nemocné dejte do karantény."
 physician_epidemic_events.1010.b: "Tohle už je příliš."
 physician_epidemic_events.1020.t: "[epidemic.GetNameNoTooltip|U]: Včasná prevence"
 physician_epidemic_events.1020.start.desc: "Tlumené, mihotavé světlo z [physician.GetFirstNamePossessive] ošetřovny osvětluje místnost, zatímco [Select_CString(physician.IsFemale,'lékařka','lékař')]  předkládá plán dalšího postupu.\n\n„Ti, které zasáhla [epidemic.GetName], trpí"
 missing_epidemic: "nesnesitelnými bolestmi"
 physician_epidemic_events.1020.start.desc2: ". Něco takového jsem ještě nikdy [Select_CString(physician.IsFemale,'neviděla','neviděl')].“"
 physician_epidemic_events.1020.safe_recommendation.desc: "„Z odborného hlediska doporučuji postupovat mírně a soustředit se na omezení šíření. Koneckonců nechceme poškodit hospodářství.“"
 physician_epidemic_events.1020.risky_recommendation.desc: "„Tato pohroma může rozvrátit celé panství. Pokud nepřistoupíme k radikálním opatřením, naši lidé i úroda budou zdecimováni.“"
 physician_epidemic_events.1020.mystic_recommendation.desc: "„Tuto pohromu na nás seslal [physician.GetFaith.DevilName] a jedinou nadějí na zlomení této kletby je překročit hranice tradiční medicíny!“"
 physician_epidemic_events.1020.end.desc: "\n\nO přesném postupu, kterým se pokusíme zabránit šíření této pohromy, nakonec rozhoduji já."
 physician_epidemic_events.1020.a: "Nejlepší bude mírný přístup."
 physician_epidemic_events.1020.b: "Zoufalá situace si žádá zoufalá opatření."
 physician_epidemic_events.1020.c: "Ať už jsou zapotřebí jakékoli esoterické praktiky, provedeme je."
 physician_epidemic_events.1020.d: "Nejlepší bude nedělat nic."
 physician_epidemic_events.1021.t: "Včasná prevence: Úspěch"
 physician_epidemic_events.1021.desc: "Zdá se, že umírněný přístup přinesl úspěch a příznaky nemoci se mezi prostým lidem šíří pomaleji. Dopad je sice poměrně malý, ale alespoň nám poskytne více času na nalezení trvalejšího řešení."
 physician_epidemic_events.1021.a: "Výborně!"
 physician_epidemic_events.1022.t: "Včasná prevence: Neúspěch"
 physician_epidemic_events.1022.desc: "Preventivní opatření, které [Select_CString(physician.IsFemale,'udělala','udělal')] [physician.GetNamePossessive], nejenže selhala, ale zdá se, že dokonce podráždila tělesné šťávy a nákaza je nyní nakažlivější i závažnější."
 physician_epidemic_events.1023.t: "$physician_epidemic_events.1021.t$"
 physician_epidemic_events.1023.desc: "Nemoc, která se měla mým panstvím šířit jako oheň po suché trávě, se nyní vleče hlemýždím tempem. Radikální opatření, které [Select_CString(physician.IsFemale,'navrhla','navrhl')] [physician.GetFirstName], si z krátkodobého hlediska vybrala daň na hospodářství, ale [epidemic.GetName] možná přece jen nebude takovou hrozbou, jaké jsme se všichni obávali."
 physician_epidemic_events.1023.a: "$physician_epidemic_events.1021.a$"
 physician_epidemic_events.1024.t: "$physician_epidemic_events.1022.t$"
 physician_epidemic_events.1024.desc: "Léčebné postupy, které [Select_CString(physician.IsFemale,'navrhla','navrhl')] [physician.GetFirstName], si kromě obrovské hospodářské škody vyžádaly i nespočet životů. Rolníci, už tak zesláblí řáděním nemoci, nedokázali snést nápor pouštění žilou a přikládání pijavic. Zdá se, že tato ztráta životů zároveň urychlila šíření nemoci, protože miasma ulpívá na mrtvolách a zamořuje plíce zdravých."
 physician_epidemic_events.1025.t: "$physician_epidemic_events.1021.t$"
 physician_epidemic_events.1025.desc: "Přestože je mnozí odsuzují jako kacířské, léčebné postupy, které [Select_CString(physician.IsFemale,'zavedla','zavedl')] [physician.GetName], zřejmě šíření nemoci docela úspěšně zpomalily. Cvičení, při němž se má nákaza vypotit, pouštění žilou kvůli vypuzení špatných tělesných šťáv a důkladná očista zabraňující hromadění miasmatu jsou podle všeho přesně tím, co dokáže [epidemic.GetName] zastavit!"
 physician_epidemic_events.1025.a: "$physician_epidemic_events.1021.a$"
 physician_epidemic_events.1026.t: "$physician_epidemic_events.1022.t$"
 physician_epidemic_events.1026.desc: "[Select_CString(ROOT.Char.IsFemale,'Riskovala jsem, když jsem schválila','Riskoval jsem, když jsem schválil')] kacířské léčebné postupy navržené postavou [physician.GetName], a podle všeho jsem si tím [Select_CString(ROOT.Char.IsFemale,'vysloužila','vysloužil')] [ROOT.Char.GetFaith.HighGodNamePossessive] hněv. Nyní za to platím krví svého lidu, protože léčebné postupy, které [Select_CString(physician.IsFemale,'zavedla','zavedl')] [physician.GetNameNoTooltip], zanechávají nemocné a zesláblé vyčerpané a bez krve na ulicích. Do krku jim jsou cpány podivné a neověřené „léky“, načež je jim pouštěno žilou a jejich těla jsou vysilována až na pokraj sil. Příšerný pohled pro každého, kdo jej spatří, a skutečně zrůdný způsob, jak zacházet s umírajícími."
 physician_epidemic_events.1030.t: "Lékopis"
 physician_epidemic_events.1030.desc: "[Select_CString(physician.IsFemale,'Má dvorní lékařka ke mně přichází','Můj dvorní lékař ke mně přichází')] s knihou v ruce a odhodláním v očích.\n\n„[Select_CString(ROOT.IsFemale,'Má','Můj')] [ROOT.Char.GetTitleAsNameNoTooltip|l], [Select_CString(physician.IsFemale,'prostudovala jsem','prostudoval jsem')] mnoho takzvaných léků na [epidemic_scope.GetName]. S vaší podporou bych [Select_CString(physician.IsFemale,'mohla','mohl')] sepsat knihu se svými poznatky — dar budoucím generacím.“"
 physician_epidemic_events.1030.a: "Budiž."
 physician_epidemic_events.1030.a.failure: "Kniha je naprostý nesmysl"
 physician_epidemic_events.1030.a.success: "Vznikne významné dílo o léčivech"
 physician_epidemic_events.1030.b: "To zní jako vyhazování peněz."
 physician_epidemic_events.1040.t: "Almužny"
 physician_epidemic_events.1040.desc: "[Select_CString(physician.IsFemale,'Má dvorní lékařka se hluboce ukloní','Můj dvorní lékař se hluboce ukloní')], než promluví.\n\n„[Select_CString(ROOT.Char.IsFemale,'Má paní','Můj pane')], péče o nemocné vyčerpává naše možnosti — a lidé si šeptají, že koruně už na nich nezáleží. Kdybyste mince [Select_CString(ROOT.Char.IsFemale,'požehnala a sama je rozdávala','požehnal a sám je rozdával')], možná by to utišilo jejich hněv. Panovnický dotek prý uzdravuje.“"
 physician_epidemic_events.1040.a: "Ať pocítí panovnický dotek."
 physician_epidemic_events.1040.b: "Ať se o chudé postarají kněží."
 physician_epidemic_events.1050.t: "[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip|U] hostinec"
 physician_epidemic_events.1050.desc: "Moje stráže přede mě v řetězech přivlečou [physician.Custom2('MyCharacterIntroduction', ROOT.Char)]. [Select_CString(physician.IsFemale,'Po každé bitvě ošetřovala','Po každé bitvě ošetřoval')] raněné vojáky — přátele i nepřátele.\n\n[Select_CString(physician.IsFemale,'Jejímu','Jeho')] útočišti říkají „[ROOT.Char.GetPrimaryTitle.GetAdjective|U] hostinec“ a moji velitelé požadují, aby bylo zavřeno. [physician.GetFirstNameNoTooltip] však pouze říká: „Krvácejí a trpí stejně jako naši. Jak bych je [Select_CString(physician.IsFemale,'mohla','mohl')] odmítnout?“"
 physician_epidemic_events.1050.a: "Může pokračovat."
 physician_epidemic_events.1050.b: "Sloužíš jen #EMP mně!#!"
 physician_epidemic_events.1060.t: "Zoufalé vyhnání"
 physician_epidemic_events.1060.desc: "[gross_sick_person.Custom2('MyCharacterIntroduction', ROOT.Char)|U] leží [Select_CString(gross_sick_person.IsFemale,'bledá','bledý')] a sípá. Nákaza pronikla až do mých vlastních síní.\n\n[physician.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě naléhavě vybízí k drastickému řešení: „Ti, kteří už onemocněli, musí pryč, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')] — jinak riskujeme, že přijdeme o všechny.“\n\nJe to krutá myšlenka. Ale nebylo by ještě krutější jen čekat?"
 physician_epidemic_events.1060.a: "Všechny je okamžitě vyžeňte!"
 physician_epidemic_events.1060.b: "Jak hrubý návrh."
