l_polish:
 epidemic_level_minor: "[Concept('plague_minor','Menší')|E]"
 epidemic_level_major: "[Concept('plague_major','Velký')|E]"
 epidemic_level_apocalyptic: "[Concept('plague_apocalyptic','Apokalyptický')|E]"
 game_concept_epidemic: "Mor"
 game_concept_epidemic_desc: "$game_concept_epidemic$ je propuknutí nemoci, která se šíří po mapě, způsobuje místní následky a infikuje postavy ve zasažené oblasti. Zasažená [Concept('baronies','baronství')|E] mají [Concept('infection_rate','míru nákazy')|E], která určuje závažnost nákazy a jejíž růst lze omezit zvýšením [Concept('epidemic_resistance','odolnosti vůči moru')|E].\n\nMor může mít různé [Concept('plague_intensities','intenzity moru')|E], které ovlivňují rozsah jeho šíření, trvání a počet [Concept('fatalities','obětí')|E]."
 game_concept_epidemic_i: "@epidemic_icon!"
 game_concept_epidemics: "Mory"
 game_concept_epidemics_desc: "$game_concept_epidemic_desc$"
 game_concept_infection_rate: "Míra nákazy"
 game_concept_infection_rate_desc: "[Concept('baronies','Baronství')|E] zasažená [Concept('epidemics','mory')|E] mají $game_concept_infection_rate$, která určuje závažnost nákazy a sílu jejích účinků.\n\nPokud proti ní nebude nic podniknuto, $game_concept_infection_rate$ bude vždy narůstat až k maximální hodnotě. Menší, velké a apokalyptické [Concept('epidemics','mory')|E] postupují různou rychlostí podle své intenzity.\n\nAby zmírnili dopad nákazy, mohou [Concept('rulers','vládci')|E] zvyšovat [Concept('epidemic_resistance','odolnost vůči moru')|E] svého [Concept('realm','panství')|E]."
 game_concept_infection_rates: "Míry nákazy"
 game_concept_infection_rates_desc: "$game_concept_infection_rate_desc$"
 game_concept_epidemic_resistance: "Odolnost vůči moru"
 game_concept_epidemic_resistance_desc: "$game_concept_epidemic_resistance$ snižuje [Concept('infection_rate','míru nákazy')|E] [Concept('barony','baronství')|E] nebo [Concept('county','hrabství')|E], a tím zmírňuje účinky [Concept('epidemic','moru')|E].\n\n$game_concept_epidemic_resistance$ lze zvýšit pomocí [Concept('buildings','budov')|E], jako jsou $building_type_hospices_01$ nebo $building_type_burial_site_01$ #weak ([Concept('duchy_building','vévodská budova')|E])#!, [Concept('court_position_tasks','úkolů dvorských úřadů')|E] vykonávaných $court_physician_court_position$, [Concept('decisions','rozhodnutí')|E] nebo událostí."
 game_concept_epidemic_res: "Odol. vůči moru"
 game_concept_epidemic_res_desc: "$game_concept_epidemic_resistance_desc$"
 game_concept_infection_chance: "Pravděpodobnost nákazy"
 game_concept_chance_of_infection: "Pravděpodobnost nákazy"
 game_concept_infection_chance_desc: "Tvoje $game_concept_infection_chance$ určuje, s jakou pravděpodobností se nakazíš [Concept('diseases','nemocí')|E] z probíhajícího [Concept('epidemic','moru')|E]."
 game_concept_plague_intensity: "Intenzita moru"
 game_concept_plague_intensity_desc: "[Concept('epidemic','Mor')|E] může být apokalyptický, velký nebo menší. Jeho intenzita ovlivňuje rozsah šíření, trvání a počet [Concept('characters','postav')|E], které nakazí, a tím i počet [Concept('fatalities','obětí')|E]."
 game_concept_plague_intensities: "Intenzity moru"
 game_concept_plague_intensities_desc: "$game_concept_plague_intensity_desc$"
 game_concept_plague_apocalyptic: "Apokalyptický"
 game_concept_plague_apocalyptic_desc: "$game_concept_infection_chance_desc$"
