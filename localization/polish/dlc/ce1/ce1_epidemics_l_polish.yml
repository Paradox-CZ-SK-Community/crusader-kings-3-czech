l_polish:
 epidemic_level_minor: "[plague_minor|E]"
 epidemic_level_major: "[plague_major|E]"
 epidemic_level_apocalyptic: "[plague_apocalyptic|E]"
 game_concept_epidemic: "Mor"
 game_concept_epidemic_desc: "$game_concept_epidemic$ je propuknutí nemoci, která se šíří po mapě, způsobuje místní účinky a nakažuje postavy ve své oblasti. Zasažená [Concept('baronies','baronství')|E] mají [Concept('infection_rate','míru nákazy')|E], která určuje jejich závažnost a lze jí čelit zlepšováním [Concept('epidemic_resistance','odolnosti vůči moru')|E].\n\nMor může mít různé [Concept('plague_intensities','intenzity moru')|E], které ovlivňují jeho oblast působení, trvání a [Concept('fatalities','oběti')|E]."
 game_concept_epidemic_i: "@epidemic_icon!"
 game_concept_epidemics: "Mory"
 game_concept_epidemics_desc: "$game_concept_epidemic_desc$"
 game_concept_infection_rate: "Míra nákazy"
 game_concept_infection_rate_desc: "[Concept('baronies','Baronství')|E] zasažená [Concept('epidemics','mory')|E] mají $game_concept_infection_rate$, která určuje jejich závažnost a sílu jejich účinků.\n\n$game_concept_infection_rate$ bude vždy postupovat ke své maximální hodnotě, pokud proti ní nebude nic podniknuto. Menší, velké a apokalyptické [Concept('epidemics','mory')|E] budou postupovat různou rychlostí, danou jejich intenzitou.\n\nAby [Concept('rulers','vládci')|E] zmírnili dopad nákazy, mohou zlepšovat [Concept('epidemic_resistance','odolnost vůči moru')|E] svého [Concept('realm','panství')|E]."
 game_concept_infection_rates: "Míry nákazy"
 game_concept_infection_rates_desc: "$game_concept_infection_rate_desc$"
 game_concept_epidemic_resistance: "Odolnost vůči moru"
 game_concept_epidemic_resistance_desc: "$game_concept_epidemic_resistance$ snižuje [Concept('infection_rate','míru nákazy')|E] [Concept('barony','baronství')|E] nebo [Concept('county','hrabství')|E], čímž zmírňuje účinky [Concept('epidemic','moru')|E].\n\n$game_concept_epidemic_resistance$ lze zvýšit prostřednictvím [Concept('buildings','budov')|E], jako jsou $building_type_hospices_01$ nebo $building_type_burial_site_01$ #weak ([Concept('duchy_building','vévodská budova')|E])#!, [Concept('court_position_tasks','úkolů dvorských úřadů')|E] vykonávaných $court_physician_court_position$, [Concept('decisions','rozhodnutí')|E] nebo událostí."
 game_concept_epidemic_res: "Odol. vůči moru"
 game_concept_epidemic_res_desc: "$game_concept_epidemic_resistance_desc$"
 game_concept_infection_chance: "Pravděpodobnost nákazy"
 game_concept_chance_of_infection: "Pravděpodobnost nákazy"
 game_concept_infection_chance_desc: "Tvá $game_concept_infection_chance$ určuje, jak pravděpodobné je, že se nakazíš [Concept('diseases','nemocemi')|E] z probíhajícího [Concept('epidemic','moru')|E]."
 game_concept_plague_intensity: "Intenzita moru"
 game_concept_plague_intensity_desc: "[Concept('epidemic','Mor')|E] může být apokalyptický, velký nebo menší, což ovlivňuje oblast jeho šíření, trvání a [Concept('characters','postavy')|E], které se jím nakazí, a způsobuje [Concept('fatalities','oběti')|E]."
 game_concept_plague_intensities: "Intenzity moru"
 game_concept_plague_intensities_desc: "$game_concept_plague_intensity_desc$"
 game_concept_plague_apocalyptic: "Apokalyptický"
