l_polish:
 feast_type_legendary: "Legendární hostina"
 feast_type_legendary_desc: "$EFFECT_LIST_BULLET$ $feast_phase_toast$ se zaměřuje na tvou [Concept('legend','legendu')|E]\n$EFFECT_LIST_BULLET$ Události přinesou příležitosti ke zvýšení [Concept('opinion','mínění')|E]\n$EFFECT_LIST_BULLET$ Některé volby ti umožní snížit [Concept('stress','stres')|E]\n\n#weak Příběh, který přetrvá věky.#!"
 legendary_feast_valid_tt: "#bold Nemáš#! [Concept('promoted_legend','podporovanou legendu')|E]"
 feast.7204.t: "Příběh k vyprávění"
 feast.7204.desc: "Síně [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] rozeznívají [ROOT.GetCharacter.Custom('GetMusicalInstrumentPlural')], zatímco hosté dopíjejí poslední doušky [ROOT.Char.Custom('RegionalAlcoholicDrink')]. Nad tím vším se melodicky nese zpěv [bard.GetTitledFirstName].\n\n„Nuže, poslouchejte! Poslouchejte! Neboť vám nyní povím příběh legendy [ROOT.Char.GetPromotedLegend.GetName].“"
 feast.7204.a: "O tomhle budou mluvit všichni!"
 feast.7204.b: "Ha! Nezapomeňte, že je to #EMP moje#! legenda!"
 feast.7204.c: "Na takové vystoupení moji hosté nikdy nezapomenou."
 feast.7204.d: "Na mnoho dalších!"
 feast.7205.t: "Příběh k poslechu"
 feast.7205.desc: "$feast.7204.desc$\n\nPo boku [bard.GetTitledFirstName] se [host.GetTitledFirstName] hrdě usmívá."
 feast.7205.a: "Jak nádherná píseň!"
 feast.7205.b: "#EMP Ach!#! Mají tu dokonce [host.Custom('GetExpensiveDessert')]!"
 legendary_feast_legend_modifier: "Sláva z legendární hostiny"
 legendary_feast_legend_modifier_desc: "Legenda této postavy zazněla na velkolepé hostině — a její sláva dosud nepohasla."
 legendary_feast_legend_boost_modifier: "Legendární hostina"
 legendary_feast_legend_boost_modifier_desc: "Legenda této postavy zazněla na velkolepé hostině."
