l_polish:
 ce1_heroic_track_name: "Hrdinská krev"
 ce1_heroic_track_desc: "Naše těla se mohou zlomit, ale legendy nikdy neumírají"
 ce1_heroic_legacy_1_name: "Dávní hrdinové"
 ce1_heroic_legacy_2_name: "Mýtičtí předkové"
 ce1_heroic_legacy_2_effect: "Zpřístupní [Concept('casus_belli','casus belli')|E] [Concept('ancestral_claim','Nárok předků')|E] pro všechny [Concept('claims','nároky')|E] získané prostřednictvím [Concept('legend_legitimizing','legitimační')|E] [Concept('legend','legendy')|E]"
 ce1_heroic_legacy_3_name: "Zlatá legenda"
 ce1_heroic_legacy_3_effect: "Po dokončení [Concept('legend_mythical','mýtické')|E] [Concept('legend_holy','svaté legendy')|E] získáš [Concept('trait','rys')|E] [GetTrait('saint').GetName( GetPlayer )]\nSleva na vytvoření [Concept('legend','legendy')|E]: #positive_value 15%#!"
 ce1_heroic_legacy_4_name: "Žijící legendy"
 ce1_heroic_legacy_4_effect: "Po dokončení [Concept('legend_mythical','mýtické')|E] [Concept('legend_heroic','hrdinské legendy')|E] získáš [Concept('trait','rys')|E] [GetTrait('legend').GetName( GetPlayer )]\nSleva na vytvoření [Concept('legend','legendy')|E]: #positive_value 25%#!"
 ce1_heroic_legacy_5_name: "Zapsáni do dějin"
 ce1_heroic_legacy_5_effect: "Vyber [Concept('trait','rys')|E] [Concept('education','vzdělání')|E] páté úrovně, který bude v tvé [Concept('dynasty','dynastii')|E] častější"
 has_legitimizing_access_tt: "[GetPlayer.GetDynasty.GetName] musí mít [Concept('perk','talent')|E] $ce1_heroic_legacy_1_name$"
 has_legit_intent_access_tt: "[GetPlayer.GetDynasty.GetName] musí mít [Concept('perk','talent')|E] $ce1_legitimacy_legacy_3_name$"
 ce1_heroic_legacy_1_useable_once: "Tento [Concept('legend_seed','zárodek legendy')|E] lze v rámci jedné [Concept('dynasty','dynastie')|E] použít pouze jednou a může jej využít kterýkoli její člen"
 ce1_legitimacy_legacy_track_name: "Legitimita"
 ce1_legitimacy_legacy_track_desc: "Právo vládnout; moc toto právo prosadit"
 ce1_legitimacy_legacy_track: "[Concept('dynasty_perk','Dynastický odkaz')|E] legitimity"
 ce1_legitimacy_legacy_1_name: "Právoplatní vládci"
 ce1_legitimacy_legacy_2_name: "Přetrvávající rod"
 ce1_legitimacy_legacy_3_name: "Synové našich otců"
 ce1_legitimacy_legacy_4_name: "Božský mandát"
 ce1_legitimacy_legacy_5_name: "Dieu et Mon Droit"
 LEGACY_DYNASTY_LASTING_LINE_DESCRIPTION: "Každý [Concept('heir','dědic')|E] začíná s [Concept('modifier','modifikátorem')|E] [GetModifier('ce1_lasting_line').GetNameWithTooltip], který během prvních 10 let jeho vlády zvyšuje zisk [Concept('legitimacy','legitimity')|E] o #positive_value 10%#!"
 LEGACY_DYNASTY_DIVINE_MANDATE_DESCRIPTION: "[Concept('vassal','Vazalové')|E] se s menší pravděpodobností přidají k [Concept('dissolution_factions','frakcím za rozpad')|E] a [Concept('claimant_factions','frakcím pretendenta')|E]"
 ce1_legitimacy_legacy_3_effect: "Zpřístupní $legitimacy_intent$ [Concept('intent','záměr')|E], díky němuž můžeš během některých [Concept('activities','aktivit')|E], jako jsou [GetActivityType( 'activity_funeral' ).GetName], [GetActivityType( 'activity_feast' ).GetName] a [GetActivityType( 'activity_wedding' ).GetName], získávat [Concept('legitimacy','legitimitu')|E]"
 LEGACY_DYNASTY_DIEU_ET_MON_DROIT_DESCRIPTION: "Po dokončení [Concept('legend','legendy')|E] zpřístupní [Concept('building','budovu')|E] [GetBuilding('legendary_watchtower').GetName]"
