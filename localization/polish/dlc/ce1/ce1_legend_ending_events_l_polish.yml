l_polish:
 story_event_legends.0001.t: "O konci legendy"
 story_event_legends.0001.desc.intro: "Zde končí kniha o [legend_protagonist.GetTitledFirstName] a [Select_CString(legend_protagonist.IsFemale,'jejích vznešených skutcích','jeho vznešených skutcích')], jimž se v celé zemi nic nevyrovnalo. A zde končí i [promoted_legend.GetName].\n\n"
 story_event_legends.0001.desc.famous_deed: "#EMP [promoted_legend.GetChapterDescriptionByName('famous_deed')]#!"
 story_event_legends.0001.desc.battle: "#EMP [promoted_legend.GetChapterDescriptionByName('battle')]#!"
 story_event_legends.0001.desc.hunt: "#EMP [promoted_legend.GetChapterDescriptionByName('hunt')]#!"
 story_event_legends.0001.desc.fallback: "#EMP Legenda o [legend_protagonist.GetTitledFirstNameNoTooltip] vrcholí podivuhodným dobrodružstvím: [Select_CString(legend_protagonist.IsFemale,'její válečné činy byly tak velké','jeho válečné činy byly tak velké')], že nad nimi žasli všichni králové a mnozí šlechtici i prostí lidé přicházeli, aby [Select_CString(legend_protagonist.IsFemale,'ji spatřili','jej spatřili')] na vlastní oči jako živoucí legendu.#!"
 story_event_legends.0001.desc.outro: "\n\nA zde bylo dílo sepsáno: [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], [GetCurrentDate.GetStringLong]."
 story_event_legends.0001.a: "Ať se o tom vypráví."
 story_event_legends.0002.t: "Kniha rodu [legend_protagonist.GetHouse.GetBaseNameNoTooltip]"
 story_event_legends.0002.desc.intro: "Zde končí kniha o [legend_protagonist.GetTitledFirstName] a vznešeném rodu [legend_protagonist.GetHouse.GetBaseName], jehož sláva a legitimita jsou známy po celé zemi. A zde končí i [promoted_legend.GetName].\n\n"
 story_event_legends.0002.desc.famous_deed: "#EMP [promoted_legend.GetChapterDescriptionByName('famous_deed')]#!"
 story_event_legends.0002.desc.battle: "#EMP [promoted_legend.GetChapterDescriptionByName('battle')]#!"
 story_event_legends.0002.desc.fallback: "$story_event_legends.0001.desc.fallback$"
 story_event_legends.0002.desc.outro: "\n\nA zde bylo dílo sepsáno: [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], [GetCurrentDate.GetStringLong]."
 story_event_legends.0002.a: "#EMP [legend_protagonist.GetHouse.GetMotto].#!"
 story_event_legends.0003.t: "[Select_CString(legend_protagonist.IsFemale,'Zázraky, jež vykonala','Zázraky, jež vykonal')] [legend_protagonist.GetTitledFirstNameNoTooltip]"
 story_event_legends.0003.desc.intro: "Zde končí kniha o [legend_protagonist.GetTitledFirstName] a zázracích, jimiž se [Select_CString(legend_protagonist.IsFemale,'proslavila','proslavil')] mezi všemi [legend_protagonist.GetFaith.GetAdherentNamePluralNoTooltip]. Ó, všemohoucí [legend_protagonist.GetFaith.HighGodName], prosím o tvé požehnání této knize, [promoted_legend.GetName].\n\n"
 story_event_legends.0003.desc.famous_deed: "#EMP [promoted_legend.GetChapterDescriptionByName('famous_deed')]#!"
 story_event_legends.0003.desc.fallback: "#EMP Legenda o [legend_protagonist.GetTitledFirstNameNoTooltip] je jedním z mnoha divů. [Select_CString(legend_protagonist.IsFemale,'Vykonala bezpočet zázraků a oplývala mnoha ctnostmi','Vykonal bezpočet zázraků a oplýval mnoha ctnostmi')]. V [Select_CString(legend_protagonist.IsFemale,'její','jeho')] přítomnosti se nemocní uzdravovali a z neúrodné země vyrůstaly rostliny.#!"
 story_event_legends.0003.desc.outro: "\n\nA zde bylo dílo sepsáno: [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], [GetCurrentDate.GetStringLong]."
 story_event_legends.0003.a: "Tak budiž."
 can_select_legendary_culture_pillars_tt: "Když [Concept('diverge','odštěpíš')|E] svou [Concept('culture','kulturu')|E], můžeš pro ni zvolit [Concept('heritage','dědictví')|E] a [Concept('language','jazyk')|E] ze své legendární kultury"
 legend_title_does_not_exist_sub_realm_claims_given_tt: "Získáš [Concept('claim','nárok')|E] na každý existující de iure [Concept('title','titul')|E] v této oblasti: [title_claim.GetName]"
