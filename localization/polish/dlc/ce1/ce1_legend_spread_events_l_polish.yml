 legend_spread_events.0070.t: "[Select_CString(ROOT.Char.IsFemale,'Hodna?','Hoden?')]"
 legend_spread_events.0070.desc: "Pěvci obsadili dřevěné pódium a plní noc hudbou. Loknu si [ROOT.Char.Custom('RegionalAlcoholicDrink')], zavřu oči a dopřeji si chvíli odpočinku.\n\n„A nyní! Všichni poslouchejte! Všichni poslouchejte! #EMP [ROOT.Char.GetPromotedLegend.GetName]#!!“\n\nMístnost zaplní rámus mých [ROOT.Char.Custom('GetCourtierPlural')] — příbory buší do stolů a všude zní halasný smích. Uprostřed obdivu celého [ROOT.Char.Custom('GetCourt')] se mi však do mysli vkrádá pochybnost.\n\nJsem toho... [Select_CString(ROOT.Char.IsFemale,'hodna','hoden')]?"
 legend_spread_events.0070.a: "#EMP Samozřejmě#! že jsem!"
 legend_spread_events.0070.b: "Já... už si nejsem jist[Select_CString(ROOT.Char.IsFemale,'á','ý')]."
 legend_spread_events.0070.c: "Nejsem! Nejsem! #EMP Nejsem!#!"
 legend_spread_events.0070.d: "Myslím, že jsem."
 legend_spread_events.0070.a.tt: "Budeš o tom rozjímat"
 legend_spread_events.0071.t: "[Select_CString(ROOT.Char.IsFemale,'Skutečná hrdinka','Skutečný hrdina')]"
 legend_spread_events.0071.desc.intro: "Z hlubin pramene stoupá voda a na hladině pukají drobné bublinky. Zahledím se do modři a spatřím vlastní odraz.\n\n"
 legend_spread_events.0071.desc.mid.arrogant: "[Select_CString(ROOT.Char.IsFemale,'Silná. Krásná. #EMP Hodna.#!','Silný. Krásný. #EMP Hoden.#!')]"
 legend_spread_events.0071.desc.mid: "Za očima se skrývá stín pochybností. Snažím se jej zahnat."
 legend_spread_events.0071.desc.promoter: "\n\n„[ROOT.Char.GetTitledFirstNameNoTooltip]...?“ Otočím se a přímo vedle mě stojí [promoter.GetTitledFirstName]. „Prosím, pověz mi svou legendu. [Select_CString(promoter.IsFemale,'Putovala jsem','Putoval jsem')] mnoho dní a nocí, jen abych ji mohl[Select_CString(promoter.IsFemale,'a','')] vyslechnout.“"
 legend_spread_events.0071.desc.fallback: "\n\nMoji [ROOT.Char.Custom('GetFollowerOrVassalPlural')]... co ve mně vlastně vidí? Natáhnu ruku k vodě. Co vidí? [Select_CString(ROOT.Char.IsFemale,'Hrdinku','Hrdinu')]...? Alespoň doufám."
 legend_spread_events.0071.a: "„Spřízněná duše. Přidej se ke mně.“"
 legend_spread_events.0071.b: "[other_promoter.GetFirstNameNoTooltip] by se možná dal[Select_CString(other_promoter.IsFemale,'a','')] přesvědčit... pravý opak."
 legend_spread_events.0071.c: "Přesvědčím svůj lid."
 legend_spread_events.0071.d: "Musím být [Select_CString(ROOT.Char.IsFemale,'hrdinkou','hrdinou')] především sám[Select_CString(ROOT.Char.IsFemale,'a pro sebe',' pro sebe')]."
 legend_chain_arrogant_modifier: "Pravé hrdinství"
 legend_chain_arrogant_modifier_desc: "Tato postava neochvějně věří ve svou hrdinskou povahu."
 legend_chain_kinda_arrogant_modifier: "Hrdinské sebevědomí"
 legend_chain_kinda_arrogant_modifier_desc: "Tato postava je odhodlána všem dokázat svou hrdinskou povahu."
 legend_spread_events.0072.t: "Hledání odpovědí"
 legend_spread_events.0072.desc.intro: "Vstoupím do [ROOT.Char.Custom('GetFaithTemple')] a světlo barví stěny jemnými odstíny soumraku.\n\n"
 legend_spread_events.0072.desc.mid.depressed: "Zhluboka se nadechnu. [ROOT.Char.GetFaith.HighGodName], zklamal[Select_CString(ROOT.Char.IsFemale,'a','')] jsem tě. Pouhý smrtelník, [Select_CString(ROOT.Char.IsFemale,'nehodná, zbytečná, #EMP ubohá.#!','nehodný, zbytečný, #EMP ubohý.#!')]\n\n"
 legend_spread_events.0072.desc.mid.fallback: "[ROOT.Char.GetFaith.HighGodName], vidíš mě? A co je vůbec k vidění? Pouhý smrtelník, snad nehodný, snad ztracený. Nezůstal nikdo, kdo by mě vedl.\n\n"
 legend_spread_events.0072.desc.vassal: "„[ROOT.Char.GetTitledFirstNameNoTooltip]...?“ Nevšiml[Select_CString(ROOT.Char.IsFemale,'a','')] jsem si, že je v chrámu ještě někdo. Vedle mě stojí [praying_vassal.GetTitledFirstName] s rukama sepjatýma k modlitbě. „[Select_CString(praying_vassal.IsFemale,'Putovala jsem','Putoval jsem')] mnoho dní a nocí, abych vyslechl[Select_CString(praying_vassal.IsFemale,'a','')] tvou legendu. Vím, že [ROOT.Char.GetFaith.HighGodName] ji touží slyšet také.“"
 legend_spread_events.0072.desc.fallback: "Přecházím sem a tam. Uvnitř mě tíží obavy, které nedokážu vyslovit. Má víra se chvěje. Co vlastně znamená být svatý? Nedokážu-li takový[Select_CString(ROOT.Char.IsFemale,'á','')] být, alespoň se o to pokusím."
 legend_spread_events.0072.a: "Záleží jen na soudu [ROOT.Char.GetFaith.HighGodNamePossessive]."
 legend_spread_events.0072.b: "„[praying_vassal.GetFirstNameNoTooltip]... máš pravdu.“"
 legend_spread_events.0072.c: "Můj lid se musí dozvědět o mé zbožnosti."
 legend_spread_events.0072.d: "Útěchu naleznu u [bishop.GetTitledFirstNameNoTooltip]."
 legend_chain_zealous_modifier: "Legenda víry"
 legend_chain_zealous_modifier_desc: "Tato postava nalezla potřebné odpovědi u vyšší moci."
 legend_spread_events.0073.t: "[Select_CString(ROOT.Char.IsFemale,'Sama?','Sám?')]"
 legend_spread_events.0073.desc.intro: "Vzduch je tichý. Nehybný. Listí se ani nezachvěje a já nedokážu poznat, zda snad všechny stromy přes noc nezemřely.\n\n"
 legend_spread_events.0073.desc.mid.depressed: "I já se cítím stejně.\n\n"
 legend_spread_events.0073.desc.mid.fallback: "Jak rád[Select_CString(ROOT.Char.IsFemale,'a','')] bych tu prostě zůstal[Select_CString(ROOT.Char.IsFemale,'a','')]. Tady, kam nedolehne zvuk trub. Tady, kde jsou slova legendy pouhým tlumeným šepotem.\n\n"
 legend_spread_events.0073.desc.vassal: "„[ROOT.Char.GetTitledFirstNameNoTooltip]?“ Otočím se a spatřím [fighting_vassal.GetTitledFirstName], jak na mě upřeně hledí, ruku položenou na meči a pot stékající po čele. „[Select_CString(fighting_vassal.IsFemale,'Putovala jsem','Putoval jsem')] mnoho dní a nocí, abych tě našel[Select_CString(fighting_vassal.IsFemale,'a','')]. Ozvěny tvé legendy mě přiměly stát se lepším[Select_CString(fighting_vassal.IsFemale,' bojovnicí',' bojovníkem')]. Prosím, pověz mi o svých činech.“"
 legend_spread_events.0073.desc.fallback: "Zavřu oči. V mysli se mi zableskne ostří čepele. Sluneční paprsky se odrážejí od oceli. A také jakési oči. Snad bestie. Snad nepřítele. Sevřu pěst — už jsem to dokázal[Select_CString(ROOT.Char.IsFemale,'a','')] dříve. A #EMP musím#! pokračovat."
 legend_spread_events.0073.a: "Čekají na nás další bitvy."
 legend_spread_events.0073.b: "„Samozřejmě. Pojď a poslouchej.“"
 legend_spread_events.0073.c: "Musím svůj lid inspirovat."
 legend_spread_events.0073.d: "[marshal.GetTitledFirstNameNoTooltip] mi vždy kryje záda."
 legend_chain_army_modifier: "Zocelení bojem"
 legend_chain_army_modifier_desc: "Tato postava nalezla novou vůli v bitvách, které teprve přijdou."
 legend_chain_marshal_modifier: "Válečnická legenda"
 legend_chain_marshal_modifier_desc: "Tato postava se soustředí na to, aby se stala tím nejlepším možným bojovníkem."
 legend_spread_events.0074.t: "V jeskyních mysli"
 legend_spread_events.0074.desc.intro: "V těchto katakombách přebývá temnota a chlad."
 legend_spread_events.0074.desc.mid.depressed: "Zmocňuje se mě pokušení zůstat zde. Jen se ukrýt a na všechno ostatní zapomenout. Nutkání.\n\n"
 legend_spread_events.0074.desc.mid.fallback: "Co kdybych tu prostě zůstal[Select_CString(ROOT.Char.IsFemale,'a','')]? V tichu. Jen kámen a já. Tu a tam nějaký hlodavec jako jediný návštěvník. Je v tom zvláštní pokoj.\n\n"
 legend_spread_events.0074.desc.vassal: "„[ROOT.Char.GetTitledFirstNameNoTooltip]?“ Za rohem se objeví postava [wise_vassal.GetTitledFirstName]. „Co tu dole děláš? Jak osudové setkání. [Select_CString(wise_vassal.IsFemale,'Putovala jsem','Putoval jsem')] mnoho dní a nocí, abych tě našel[Select_CString(wise_vassal.IsFemale,'a','')]. Tvá legenda... musím přiznat, že se mě dotkla.“\n\n"
 legend_spread_events.0074.desc.spouse: "„Má lásko...“ Vedle [wise_vassal.GetFirstNameNoTooltip] stojí [spouse.GetFirstName]. „Měl[Select_CString(spouse.IsFemale,'a','')] jsem o tebe strach.“"
 legend_spread_events.0074.desc.fallback: "Bez cíle kráčím chodbami a nevím, kam mě vedou. Lhostejně. Temnota za temnotou za temnotou. Kdybych byl[Select_CString(ROOT.Char.IsFemale,'a','')] této legendy opravdu hoden[Select_CString(ROOT.Char.IsFemale,'na','')], cítil[Select_CString(ROOT.Char.IsFemale,'a','')] bych to, ne? Snad. Snad."
 legend_spread_events.0074.a: "„Má lásko... nezklamu tě.“"
 legend_spread_events.0074.b: "„[wise_vassal.GetFirstNameNoTooltip], #EMP ty#! ses dotkl[Select_CString(wise_vassal.IsFemale,'a','')] mého srdce.“"
 legend_spread_events.0074.c: "Nesmím svůj lid zklamat."
 legend_spread_events.0074.d: "[chancellor.GetTitledFirstNameNoTooltip] mi může pomoci s diplomatickými podrobnostmi."
 legend_chain_spouse_modifier: "Neocenitelná opora"
 legend_chain_spouse_modifier_desc: "Tuto postavu hluboce zasáhla neocenitelná podpora, kterou její legendě poskytl manželský protějšek."
 legend_chain_chancellor_modifier: "Obratná legenda"
 legend_chain_chancellor_modifier_desc: "Tato postava se spolehla na pomoc svého kancléře, aby znovu nalezla důvěru ve svou legendu."
 legend_protagonist_legitimacy_miniscule_tt: "Od svého [Concept('legend_protagonist','protagonisty legendy')|E] získáš navíc #positive_value [SCOPE.ScriptValue('miniscule_legitimacy_gain')|0]#! [Concept('legitimacy','legitimity')|E]"
 legend_protagonist_legitimacy_minor_tt: "Od svého [Concept('legend_protagonist','protagonisty legendy')|E] získáš navíc #positive_value [SCOPE.ScriptValue('minor_legitimacy_gain')|0]#! [Concept('legitimacy','legitimity')|E]"
 legend_protagonist_legitimacy_medium_tt: "Od svého [Concept('legend_protagonist','protagonisty legendy')|E] získáš navíc #positive_value [SCOPE.ScriptValue('medium_legitimacy_gain')|0]#! [Concept('legitimacy','legitimity')|E]"
 legend_protagonist_legitimacy_major_tt: "Od svého [Concept('legend_protagonist','protagonisty legendy')|E] získáš navíc #positive_value [SCOPE.ScriptValue('major_legitimacy_gain')|0]#! [Concept('legitimacy','legitimity')|E]"
 legend_spread_events.5400.t: "Nezbytná přikrášlení"
 legend_spread_events.5400.desc: "„Mohu tě na okamžik vyrušit, [ROOT.Char.Custom('FormOfAddressForLiege')]?“ začne [chronicler.GetFirstName] tónem na můj vkus až příliš vemlouvavým. „Velmi by nám pomohlo, kdybychom [promoted_legend.GetName] doplnili o pár dalších podrobností. Čím... #EMP velkolepějších,#! tím lépe!“ [chronicler.GetFirstNameNoTooltip] na mě očekávavě pohlédne.\n\nV mysli mi začínají klíčit semínka úskoku. Vyprávět stávající příběh znovu, tentokrát v okázalejších barvách, jistě neuškodí. Ovšem nahradit jednu jeho část něčím docela jiným má také své kouzlo..."
 legend_spread_events.5400.a: "„Samozřejmě, projdeme si to ještě jednou!“"
 legend_spread_events.5400.a.majorsuccess: "Tvá přikrášlení příběh výrazně obohatí"
 legend_spread_events.5400.a.minorsuccess: "Tvá přikrášlení jsou poměrně střídmá"
 legend_spread_events.5400.b: "„Víš, ono se to často vypráví špatně...“"
 legend_spread_events.5400.b.success: "Tvá verze zní věrohodně"
 legend_spread_events.5400.b.failure: "Tvé úpravy působí poněkud žalostně"
 legend_spread_events.5400.c: "Možná bude nejlepší nechat příběh růst přirozeně?"
 legend_chapter_silver_tongued: "[ROOT.Legend.GetProtagonist.GetName|U] byl[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] znovu a znovu přepadán[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] a sužován[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] ničemy, kteří se [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí','mu')] snažili zabránit v plnění spravedlivého poslání. Pokaždé je však důvtip [ROOT.Legend.GetProtagonist.GetFirstName|U] přelstil a z jejich spárů se podařilo uniknout."
 legend_chapter_easily_captured: "[ROOT.Legend.GetProtagonist.GetName|U] byl[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] znovu a znovu přepadán[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] a sužován[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] ničemy, kteří se [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí','mu')] snažili zabránit v plnění spravedlivého poslání. Nejednou však [ROOT.Legend.GetProtagonist.GetFirstName|U] padl[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] do léčky a dlouhé chvíle strávil[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] v zajetí, takže cesta za vznešeným cílem byla znovu a znovu mařena."
 legend_spread_events.5405.t: "Zvěsti z divočiny"
 legend_spread_events.5405.desc: "„Ale no tak, [ROOT.Char.Custom('FormOfAddressForLiege')]!“ [chronicler.GetFirstName] neústupně trvá na svém, zatímco probíráme další podrobnosti [promoted_legend.GetName].\n\n„Musím to vědět — #EMP lidé#! to musí vědět,“ rozmáchne se [chronicler.GetFirstNameNoTooltip] velkolepě, byť bez jasného směru, „kolik pravdy je na těch zvěstech?“ Sotva stačím otevřít ústa k otázce, [chronicler.GetFirstNameNoTooltip] už pokračuje.\n\n„Že ses totiž na svých cestách setkal[Select_CString(ROOT.Char.IsFemale,'a','')] s mocným [ROOT.Char.Custom('RegionalMythicalCreature')]!“"
 legend_spread_events.5405.a: "„Ano, skutečně!“"
 legend_spread_events.5405.a.success: "Tvůj příběh je podmanivý"
 legend_spread_events.5405.a.failure: "Tvému příběhu schází věrohodnost"
 legend_spread_events.5405.b: "„To je nesmysl. Ale #EMP něco jiného#! jsem viděl[Select_CString(ROOT.Char.IsFemale,'a','')]...“"
 legend_spread_events.5405.b.success: "Podaří se ti na místě vymyslet novou bestii"
 legend_spread_events.5405.b.failure: "[chronicler.GetFirstNameNoTooltip] ti nevěří"
 legend_spread_events.5405.c: "„Kdo ví? Viděl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem tolik podivuhodných věcí...“"
 legend_chapter_discovery_mythical_beast: "Během své pouti učinil[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] [ROOT.Legend.GetProtagonist.GetFirstName] objev, který [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí','mu')] otřásl samotnou duší. Prastaré báje o divokých a podivuhodných tvorech se ukázaly být nade vši pochybnost pravdivé a všichni velebili [ROOT.Legend.GetProtagonist.GetFirstName] za odvahu i neuhasitelnou touhu poznávat neznámé."
 legend_chapter_discovery_new_myth: "Když [ROOT.Legend.GetProtagonist.GetFirstName] putoval[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] světem, nalezl[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] mnohem víc, než v co se vůbec odvažoval[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] doufat při odchodu na cestu. Tvora vzácného a nevídaného, dvakrát vyššího než člověk, o šesti nohách a s paží vyrůstající přímo z trupu! O takové bestii dosud nikdo neslyšel, a tak [ROOT.Legend.GetProtagonist.GetFirstName] přidal[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] další podivuhodnou kapitolu k rostoucímu příběhu [ROOT.Legend.GetName]."
 legend_spread_events.5410.t: "Co leží za obzorem?"
 legend_spread_events.5410.desc: "Další a další [ROOT.Char.Custom('GetWritingMaterialPlural')] se plní, zatímco [chronicler.GetFirstName] zaznamenává mé vyprávění. Cesty přes kopce a doly, přes mohutné řeky a dokonce i...\n\n„Tak daleko ses vydal[Select_CString(ROOT.Char.IsFemale,'a','')], [ROOT.Char.Custom('FormOfAddressForLiege')]?“ Oči [chronicler.GetFirstNamePossessiveNoTooltip] se rozzáří úžasem. „Tak hluboko do divokého oceánu?“\n\nNikdo neví, co leží za našimi bezpečnými, známými vodami. Jistě, existují dohady, na nichž se lidé víceméně shodují... ale není právě tohle má příležitost příst si vlastní báji?"
 legend_spread_events.5410.a: "„Leží tam další veliký kontinent, kde rostou vinné bobule...“"
 legend_spread_events.5410.a.flavor: "Takové zvěsti ostatně kolují už mnoho let..."
 legend_spread_events.5410.a.success: "Zvěst o tvém objevu se šíří jako požár"
 legend_spread_events.5410.a.failure: "[chronicler.GetFirstNameNoTooltip] při tom odhalení nevypadá přesvědčeně"
 legend_spread_events.5410.b: "V těch vrtkavých hlubinách přebývají zuřivé nestvůry!"
 legend_spread_events.5410.c: "Naši výpravu zastavily boje s divokými piráty."
 legend_spread_events.5410.d: "„Tam venku? Nic než další oceán a smrt.“"
 sea_monsters_modifier: "Mořské nestvůry"
 sea_monsters_modifier_desc: "Tato postava spatřila titány hlubin a dokázala je zahnat."
 legend_chapter_discovery_vinland: "Na svých cestách objevil[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] [ROOT.Legend.GetProtagonist.GetFirstName] něco, o čem se dosud jen šeptalo a co bývalo považováno za pouhou báji. Mýtický Vinland, rozlehlá země na mrazivém severu, nejenže skutečně existoval, ale byl i obyvatelný! Do velkých příběhů věků tak mělo být vyryto další jméno — tentokrát jméno [ROOT.Legend.GetProtagonist.GetFirstName]."
 legend_chapter_sea_monsters: "Poutě [ROOT.Legend.GetProtagonist.GetFirstName] vedly přes širé moře a tam [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'spatřila hrůzy, jaké si málokdo dovede představit','spatřil hrůzy, jaké si málokdo dovede představit')]. Ze všech stran se na výpravu vrhaly obrovské, svíjející se mořské nestvůry a jen obratné námořnické umění [ROOT.Legend.GetProtagonist.GetFirstName] dovedlo všechny bezpečně zpět domů."
 legend_spread_events.5415.t: "Prostý lid?"
 legend_spread_events.5415.desc: "Podivuhodný příběh [ROOT.Char.GetPromotedLegend.GetName] se šíří dál a dál a stále více lidí ze všech vrstev společnosti do jeho bohaté tapisérie vplétá vlastní pohled. Alespoň to tvrdí [chronicler.GetFirstName].\n\n„Páni i dámy jsou přesvědčeni, že tento příběh dokládá jejich nezpochybnitelné právo vládnout,“ zamyslí se [chronicler.GetFirstNameNoTooltip], „ale stačí zajít do místní krčmy a bude plná těch, kteří tvrdí, že je zasvěcen prostému lidu této země a jeho poctivé, pilné práci.“"
 legend_spread_events.5415.a: "Je to #EMP zjevně#! příběh šlechty."
 legend_spread_events.5415.b: "Samozřejmě že je o prostém lidu!"
 legend_spread_events.5415.c: "Je to přece příběh o [protagonist.GetFirstNameNoTooltip], o nikom jiném!"
 legend_spread_events.5415.c.protag: "...to jsi mé jméno nezapsal[Select_CString(chronicler.IsFemale,'a','')] #EMP dost často#!?"
 legend_nobles_noted: "Šlechta, připomenuta"
 legend_nobles_noted_desc: "Tento příběh se soustředí na činy šlechty a upevňuje její právo vládnout."
 legend_commoners_celebrated: "Prostý lid, oslavován"
 legend_commoners_celebrated_desc: "Tento příběh oslavuje těžce pracující rolníky a pozvedá jejich ducha."
 legend_spread_events.5420.t: "Legendární korbel"
 legend_spread_events.5420.desc: "[chronicler.GetFirstName] dál zapisuje další a další příběhy z [ROOT.Char.GetPromotedLegend.GetName], až se náhle zarazí a na rtech se [Select_CString(chronicler.IsFemale,'jí','mu')] objeví potutelný úsměv.\n\n„Inu, zaslechl[Select_CString(chronicler.IsFemale,'a','')] jsem #EMP jeden#! obzvlášť zajímavý příběh,“ začne [chronicler.GetFirstNameNoTooltip] pomalu, „o jistém pijáckém klání s obrem, představ si! Jaký výkon našeho [ROOT.Char.Custom('GetHeroineHero')], když dokázal[Select_CString(ROOT.Char.IsFemale,'a','')] takového tvora upít pod stůl! Snad by mi malá ukázka pomohla skutečně docenit velikost tohoto činu?“\n\nNetuším, odkud se tahle báchorka vzala, ale v nitru mě začne nepříjemně šimrat pýcha..."
 legend_spread_events.5420.a: "Přineste mi sud a já to dokážu!"
 legend_spread_events.5420.a.success: "Vypiješ celý sud"
 legend_spread_events.5420.a.failure: "Po několika pohárech odpadneš"
 legend_spread_events.5420.b: "Stalo se to. A raději tomu věř!"
 legend_spread_events.5420.b.success: "[chronicler.GetFirstNameNoTooltip] je přesvědčen[Select_CString(chronicler.IsFemale,'a','')]"
 legend_spread_events.5420.b.failure: "[chronicler.GetFirstNameNoTooltip] zůstává nepřesvědčen[Select_CString(chronicler.IsFemale,'a','')]"
 legend_spread_events.5420.c: "Já... totiž... zrovna mám strašlivé #EMP nachlazení#!..."
 legend_spread_events.5420.c.tt: "Získáš jistou pověst"
 legend_hangover_modifier: "Kocovina"
 legend_hangover_modifier_desc: "Tato postava to přehnala s pitím a nyní za to platí."
 legend_shy_drinker: "Slabý piják"
 legend_shy_drinker_desc: "Tato postava si vysloužila pověst někoho, kdo mnoho nevydrží."
