l_polish:
 legend_debug.0001.desc: "#D Toto je ladicí událost#!"
 legend_spread_events.0001.t: "Nevinné hlasy"
 legend_spread_events.0001.desc: "V knihovně mě s vřelým úsměvem přijímá [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chronicler'))] [chronicler.GetFirstName].\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], při sepisování tvé legendy nás napadlo poslat po tržištích několik dětí, aby vychvalovaly skutky [ancestor.GetName].“"
 legend_spread_events.0001.a: "„Ihned je vyšlete!“"
 legend_spread_events.0001.b: "„Nemáme to čím dokázat. Buďte nenápadní.“"
 legend_spread_events.0001.c: "„Vlastně... [my_child.GetShortUIName] se k nim může přidat.“"
 legend_spread_events.0001.d: "„[Select_CString(ROOT.Char.IsFemale,'Sama','Sám')] jsem svou vlastní legendou.“"
 legend_spread_events.0001.a.tt.success: "Tvá slova znějí přesvědčivě"
 legend_spread_events.0001.a.tt.failure: "Dětem nikdo nevěří"
 legend_my_own_ancestor_modifier: "Má vlastní legenda"
 legend_my_own_ancestor_modifier_desc: "Tato postava se má stát mytickým počátkem vlastního rodu."
 legend_spread_events.0010.t: "[Select_CString(ROOT.Char.IsFemale,'Opravdová lovkyně','Opravdový lovec')]"
 legend_spread_events.0010.desc: "Melodický hlas upoutá mou pozornost hned, jak otevřu [ROOT.Char.Custom('GetDoor')] síně. [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bard'))] [bard.GetFirstName] stojí uprostřed hloučku a kolem se tlačí [ROOT.Char.Custom('GetFollowerOrVassalPlural')]. [Select_CString(bard.IsFemale,'Celá rozohněná','Celý rozohněný')] hraje a téměř při tom leze na stůl; v rukou svírá hudební nástroj: [bard.Custom('GetMusicalInstrument')].\n\n„A tady je!“ zvolá [bard.GetFirstName]. „Je to právě [ROOT.Char.GetTitleAsNameNoTooltip], [Select_CString(ROOT.Char.IsFemale,'jejíž legendu tak horlivě opěvuji, protože vlastníma rukama skolila','jehož legendu tak horlivě opěvuji, protože vlastníma rukama skolil')]...“"
 legend_spread_events.0010.a: "...draka!"
 legend_spread_events.0010.a.tt.success: "Celá síň jásá!"
 legend_spread_events.0010.a.tt.failure: "Tvé lži jsou příliš očividné"
 legend_spread_events.0010.b: "...#EMP obrovskou#! bestii!"
 legend_spread_events.0010.b.tt.success: "Dvořané zpívají s tebou"
 legend_spread_events.0010.c: "...jen pěkného medvěda."
 legends_dragon_slayer: "Lov draka"
 legends_dragon_slayer_desc: "Tato postava tvrdí, že má na kontě uloveného draka."
 legend_spread_events.0020.t: "Šíření zvěstí"
 legend_spread_events.0020.desc.intro: "Když sejdu po schodech, přejdu nádvoří a dorazím k jedné z chodeb, odkud služebnictvo obvykle dohlíží na děti, nečeká mě tam nikdo z nich.\n\nMísto toho ke mně jasně a hlasitě doléhá hlas [courtier.GetTitledFirstNamePossessive]. Ukryji se mezi kamennými sloupy:\n\n„Co vůbec [protagonist.GetTitledFirstName] [Select_CString(protagonist.IsFemale,'dokázala','dokázal')]? Byl tam snad někdo z nás, aby na vlastní oči viděl [Select_CString(ROOT.Char.IsFemale,'její','jeho')] takzvanou #EMP legendu#!, kterou nám teď"
 legend_spread_events.0020.desc.you_protag: "[Select_CString(ROOT.Char.IsFemale,'ona','on')]"
 legend_spread_events.0020.desc.other_protag: "[ROOT.Char.GetTitledFirstName]"
 legend_spread_events.0020.desc.outro: "tak hrdě nutí opěvovat?“"
 legend_spread_events.0020.a: "[Select_CString(courtier.IsFemale,'Ona','On')] si může říkat, co chce. V žaláři."
 legend_spread_events.0020.b: "„Ty tam!“"
 legend_spread_events.0020.b.tt.success: "[courtier.GetShortUINameNoTooltip] se omlouvá"
 legend_spread_events.0020.b.tt.failure: "[courtier.GetShortUINameNoTooltip] se cítí uraženě"
 legend_spread_events.0020.c: "Raději budu předstírat, že [Select_CString(ROOT.Char.IsFemale,'jsem nic neslyšela','jsem nic neslyšel')]..."
 legend_put_out_rumors_modifier: "Umlčené zvěsti"
 legend_put_out_rumors_modifier_desc: "Tato postava potlačila zvěsti zpochybňující její legendu."
 legend_sus_rumors_modifier: "Zpochybňovaná legenda"
 legend_sus_rumors_modifier_desc: "Legenda této postavy vzbudila mezi jejími dvořany pochybnosti."
 legend_spread_events.0030.t: "Vzpomínáš?"
 legend_spread_events.0030.desc.intro: "„Tak mi pověz, [ROOT.Char.Custom('FormOfAddressForLiege')]...“ Z myšlenek mě vytrhne známý hlas. Přede mnou už [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chronicler'))] [chronicler.GetFirstName] mává rukou a brk přitom kropí podlahu inkoustem.\n\n"
 legend_spread_events.0030.desc.you_protag: "„A co tehdy, když [legend_memory.GetSecondPerspectiveDescription]? To přece stojí za přidání do tvé legendy...“"
 legend_spread_events.0030.desc.other_protag: "„A co tehdy, když [legend_memory.GetThirdPerspectiveDescription]? To přece stojí za přidání do [Select_CString(protagonist.IsFemale,'její','jeho')] legendy...“"
 legend_spread_events.0030.a: "„[Select_CString(chronicler.IsFemale,'Minule jsi mě snad neslyšela?','Minule jsi mě snad neslyšel?')]“"
 legend_spread_events.0030.a.flavor: "#EMP Zív...#! Svůj čas umím využít lépe."
 legend_spread_events.0030.b: "Ach, to byla tak #EMP skvělá#! chvíle..."
 legend_spread_events.0030.b.tt.success: "Na tvůj velký čin si všichni vzpomínají"
 legend_spread_events.0030.b.tt.failure: "Lidé nevypadají přesvědčeně"
 legend_spread_events.0030.c: "Necítím potřebu to znovu vytahovat."
 humble_content_courtiers_and_guests: "Všichni [Concept('courtiers','dvořané')|E] a [Concept('guests','hosté')|E] ([GetTrait('humble').GetName( GetNullCharacter )] nebo [GetTrait('content').GetName( GetNullCharacter )])"
 legend_lazy_modifier: "To není moje práce"
 legend_lazy_modifier_desc: "Tato postava přenechala sepisování jemnějších podrobností své legendy někomu jinému."
 legend_memory_deed_modifier: "Čerstvá vzpomínka"
 legend_memory_deed_modifier_desc: "Mimořádné činy této postavy zůstávají v živé paměti jejího lidu."
 legend_spread_events.0040.t: "Plačtivá prosba"
 legend_spread_events.0040.desc.intro: "„Ach, dnes ráno sem do [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'room_command_tent','room_throne_room')] dopadá světlo tak příjemně, [ROOT.Char.Custom('FormOfAddressForLiege')],“ poznamená [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chronicler'))] [chronicler.GetFirstName], zatímco prochází po [ROOT.Char.Custom('GetRoom')].\n\n„Připomíná mi to den, kdy se osud rozhodl dát počátek"
 legend_spread_events.0040.desc.you_protag: "tvé legendě... vzpomínáš, jak [Select_CString(ROOT.Char.IsFemale,'jsi tehdy byla laskavá','jsi tehdy byl laskavý')],"
 legend_spread_events.0040.desc.other_protag: "legendě [protagonist.GetTitledFirstName]... vzpomínáš, jak [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'tehdy byla laskavá','tehdy byl laskavý')],"
 legend_spread_events.0040.desc.outro: "když [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vyslyšela','vyslyšel')] zoufalé prosby onoho rolníka?“ pronese [chronicler.GetFirstName] a výmluvně na mě mrkne."
 legend_spread_events.0040.a: "„Copak bych #EMP já#! někdy [Select_CString(ROOT.Char.IsFemale,'naslouchala','naslouchal')] rolníkovi?“"
 legend_spread_events.0040.b: "„Ach, jak [Select_CString(ROOT.Char.IsFemale,'zbožná duše ze mě je','zbožný člověk ze mě je')]!“"
 legend_spread_events.0040.b.tt.success: "Tvá zbožnost budí obdiv"
 legend_spread_events.0040.b.tt.failure: "Tvá zbožnost je očividně jen lež"
 legend_spread_events.0040.c: "„A co by to mělo přinést?“"
 legend_spread_events.0050.t: "Ve službách [Select_CString(honored_lady.IsFemale,'dámy','pána')]"
 legend_spread_events.0050.desc: "„#EMP A [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ona byla galantní','on byl galantní')]\na [Select_CString(honored_lady.IsFemale,'ona byla krásná','on byl krásný')]\nA [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ona byla hrdinkou','on byl hrdinou')]\na [Select_CString(honored_lady.IsFemale,'ona byla překrásnááááá','on byl překrásnýýýýý')]!#!“\n\nNetrvá dlouho a zjistím, odkud hudba přichází. Brzy spatřím [bard.GetTitledFirstName], jak se opírá o kamennou lavici a pohrává si s laděním svého nástroje.\n\n„Ach, [ROOT.Char.Custom('FormOfAddressForLiege')],“ [Select_CString(bard.IsFemale,'hned se jí rozzáří oči','hned se mu rozzáří oči')], „není snad pravda, že důvodem tvé legendy bylo zapůsobit na [honored_lady.GetTitledFirstName]?“"
 legend_spread_events.0050.a: "„Jak se opovažuješ!? Vždyť [Select_CString(ROOT.Char.IsFemale,'jsem #EMP vdaná#!','jsem #EMP ženatý#!')]!“"
 legend_spread_events.0050.b: "„[Select_CString(honored_lady.IsFemale,'Opravdu je krásná','Opravdu je krásný')]...“"
 legend_spread_events.0050.b.tt.success: "Tvé gesto udělá dojem na [honored_lady.GetFirstNameNoTooltip]"
 legend_spread_events.0050.b.tt.failure: "Tvé gesto [honored_lady.GetFirstNameNoTooltip] znechutí"
 legend_spread_events.0050.c: "„[Select_CString(ROOT.Char.IsFemale,'Udělala','Udělal')] jsem to pro sebe.“"
 legend_spread_events.0060.t: "Spíš mýtus než legenda"
 legend_spread_events.0060.desc.intro: "„Na slovíčko, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')],“ přistoupí ke mně [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier'))] [courtier.GetFirstName] s ustaraným výrazem. „Jde o"
 legend_spread_events.0060.desc.you_protag: "tvou"
 legend_spread_events.0060.desc.other_protag: "legendu [ROOT.Legend.GetProtagonist.GetShortUIName]"
 legend_spread_events.0060.desc.outro: "... [bad_vassal.GetTitledFirstName] ji prý zpochybňuje a dvorské klepy začínají jeho tvrzení opakovat.“\n\n„Jestli tomu včas neučiníš přítrž, obávám se, že každý rolník v tomto panství uvěří, že je to celé lež.“"
 legend_spread_events.0060.a: "„Ten otravný [bad_vassal.Custom2('InsultNoun', ROOT.Char)]...“"
 legend_spread_events.0060.b: "Mé slovo má větší váhu než slovo [bad_vassal.GetShortUINameNoTooltip]."
 legend_spread_events.0060.b.tt.success: "Lidé ti věří"
 legend_spread_events.0060.b.tt.failure: "Lidé věří [bad_vassal.GetShortUIName]"
 legend_spread_events.0060.c: "Od [bad_vassal.GetShortUINameNoTooltip] je dost odvážné něco takového na mě zkoušet..."
 legend_spread_events.0060.d: "Ať si mluví."
 legend_no_mocking_modifier: "Respektovaná legenda"
 legend_no_mocking_modifier_desc: "Tato postava okamžitě zarazila výsměch své legendě."
 legend_extra_mocking_modifier: "Vysmívaná legenda"
 legend_extra_mocking_modifier_desc: "Legendě této postavy se mnozí vysmívali."
 not_believable_modifier: "Zjevně proradná"
 not_believable_modifier_desc: "Lži této postavy proti jejímu lennímu pánovi byly odhaleny a obrátily se proti ní."
 legend_spread_events.5000.t: "Pevné základy"
 legend_spread_events.5000.desc: "Slunce jasně září nad [capital.GetName], zatímco se s [chronicler.GetFirstName] procházíme rušnými ulicemi. Je to krásné sídlo.\n\n#EMP Velmi#! krásné sídlo, pomyslím si a rozhlížím se po složitém kamenickém zpracování oblouku, pod kterým právě procházíme. [chronicler.GetFirstNameNoTooltip] zachytí můj pohled.\n\n„Předkové zdejších lidí si zaslouží uznání za to, že toto místo vybudovali,“ začne [chronicler.GetFirstNameNoTooltip]. „Dokonce tolik uznání, až člověka někdy napadne, jestli ho vůbec postavili oni...“"
 legend_spread_events.5000.a: "„Tato architektura #EMP zjevně#! nepochází z [culture.GetNameNoTooltip] kultury!“"
 legend_spread_events.5000.b: "Tohle přece #EMP nemohli#! postavit [culture.GetCollectiveNounNoTooltip]?"
 legend_spread_events.5000.b.tt.success: "Lidé vypadají přesvědčeně"
 legend_spread_events.5000.b.tt.failure: "Hrdý prostý lid tvá tvrzení rozhořčeně odmítá"
 legend_spread_events.5000.c: "Takové kamenické umění by přece šlo využít lépe, ne?"
 legend_spread_events.5000.d: "Ti předkové byli opravdu pracovití lidé."
 legend_spread_events.5005.t: "[parent.Custom('MotherFatherPossessive')|U] požehnání"
 legend_spread_events.5005.desc: "Setkat se v poslední době se [Select_CString(parent.IsFemale,'svou matkou','svým otcem')] [parent.GetFirstName] je stále vzácnější potěšení, ale právě teď se oba ocitáme na tomto místě bohoslužeb. [chronicler.GetFirstName] zůstává uctivě opodál, zatímco se zdravíme.\n\n„[ROOT.Char.GetFirstName]! To je překvapení!“ zvolá [parent.GetFirstName] a obejme mě. Pak se s nostalgickým úsměvem rozhlédne po stěnách. „Tady si zase připadám mladě. Už jako dítě [Select_CString(ROOT.Char.IsFemale,'jsi byla tak zbožná','jsi byl tak zbožný')]. Víš, že když [Select_CString(ROOT.Char.IsFemale,'jsi byla ještě nemluvně','jsi byl ještě nemluvně')], [Select_CString(ROOT.Char.IsFemale,'odmítala jsi','odmítal jsi')] v posvátné dny jíst?“\n\nTo... [Select_CString(ROOT.Char.IsFemale,'jsem tedy nevěděla','jsem tedy nevěděl')]."
 legend_spread_events.5005.regular: "Koutkem oka zahlédnu, jak [chronicler.GetFirstNameNoTooltip] sahá po [ROOT.Char.Custom('GetWritingMaterial')]."
 legend_spread_events.5005.parent_chronicler: "Možná by šlo [Select_CString(parent.IsFemale,'mou drahou matku','mého drahého otce')] jakožto mého kronikáře přesvědčit, aby to [Select_CString(parent.IsFemale,'zapsala','zapsal')]?"
 legend_spread_events.5005.a: "„[Select_CString(parent.IsFemale,'Mami','Tati')], prosím, ztrapňuješ mě!“"
 legend_spread_events.5005.b: "„Prosím, připomeň mi to.“"
 legend_spread_events.5005.b.tt: "No, tohle by se mi mohlo hodit..."
 legend_spread_events.5005.c: "Dost už o mně. Jak se máš #EMP ty#!, [Select_CString(parent.IsFemale,'mami','tati')]?"
 legend_spread_events.5010.t: "Vkládání rukou"
 legend_spread_events.5010.desc: "[Select_CString(chronicler.IsFemale,'Má kronikářka','Můj kronikář')] [chronicler.GetFirstName] je [Select_CString(chronicler.IsFemale,'prudce odstrčena','prudce odstrčen')] stranou, když se ke mně ulicí potácí podivná postava. Stráže okamžitě zakročí a namíří zbraně, ale je zřejmé, že mi tahle nebohá duše nechce ublížit.\n\n„Prosím!“ sípá [sick.GetFirstName]. „[Select_CString(sick.IsFemale,'Jsem velmi nemocná','Jsem velmi nemocný')]. Sotva [Select_CString(sick.IsFemale,'jsem se sem dokázala dostat, když jsem tě uviděla','jsem se sem dokázal dostat, když jsem tě uviděl')] procházet kolem, [ROOT.Char.Custom('FormOfAddressForLiege')]!“\n\n„[Select_CString(sick.IsFemale,'Slyšela jsem','Slyšel jsem')]... o zázracích, které dokážeš. Stačí mi jediný dotek!“ [sick.GetFirstName] se potácí blíž a prosebně ke mně vztahuje ruce."
 legend_spread_events.5010.a: "„Musíš přispět těm, kteří jsou v ještě větší nouzi.“"
 legend_spread_events.5010.a.tt: "Když nic jiného, pobízení k darům potřebným bude vrhat #EMP mě#! do dobrého světla..."
 legend_spread_events.5010.b: "Nuže, jestli to zabere..."
 legend_spread_events.5010.b.criticalsuccess: "Nemocná osoba je uzdravena"
 legend_spread_events.5010.b.success: "[Select_CString(sick.IsFemale,'Tvrdí, že už je jí o něco lépe','Tvrdí, že už je mu o něco lépe')]"
 legend_spread_events.5010.b.failure: "Zdá se, že se vůbec nic nezměnilo"
 legend_spread_events.5010.c: "„Prosím. Musíš vyhledat skutečnou léčbu v místním špitále.“"
 legend_spread_events.5015.t: "Krvavé dědictví"
 legend_spread_events.5015.desc: "Zkouším ostří meče, zatímco se s [Select_CString(chronicler.IsFemale,'kronikářkou','kronikářem')] [chronicler.GetFirstName] probíráme zbrojnicí v [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'my camp','location.GetName')]. Čepel je ostrá a dobře nabroušená. [chronicler.GetFirstNameNoTooltip] však mnohem víc zajímá jiná zbraň visící na stěně.\n\n„O téhle mocné zbrani už jsem toho tolik slyšel[Select_CString(chronicler.IsFemale,'a','')], [ROOT.Char.Custom('FormOfAddressForLiege')],“ vydechne [chronicler.GetFirstNameNoTooltip] a obdivně si ji prohlíží. „Prý jen tvou rukou zahynulo nejméně půl tuctu lidí!“\n\n[artifact.GetName] tam poklidně visí. Je pravda, že za dobu své existence byla spolehlivou a smrtící zbraní a její boky opakovaně smáčela krev nepřátel. Dobrá čepel. Rudá čepel."
 legend_spread_events.5015.a: "„A vezme život ještě mnoha dalším.“"
 legend_spread_events.5015.b: "„No, to jsou jen ti, na které si vzpomínám...“"
 legend_spread_events.5015.b.success: "Pověst zbraně roste"
 legend_spread_events.5015.b.failure: "Někteří se nad těmi historkami podezíravě pozastavují"
 legend_spread_events.5015.c: "„O mnoho víc jich nebylo, [chronicler.GetFirstNameNoTooltip].“"
 legend_spread_events.5015.c.tt: "[artifact.GetName] získá náhodný pozitivní modifikátor"
 legend_spread_events.5020.t: "Poskvrna"
 legend_spread_events.5020.desc: "Naši společnou cestu [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'the camp','a corridor')] za soumraku přeruší [chronicler.GetFirstName], když natáhne prst k mé ruce svírající lucernu.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ vyhrkne [chronicler.GetFirstNameNoTooltip] s chvěním v hlase. „Ta skvrna na tvé ruce! Je to snad... svatá rána?“\n\nPohlédnu na svou ruku. Hřbet pokrývá velká skvrna. Popravdě jsem si jí sotva všiml[Select_CString(ROOT.Char.IsFemale,'a','')]. [chronicler.GetFirstNameNoTooltip] už ale mezitím popustil[Select_CString(chronicler.IsFemale,'a','')] uzdu fantazii.\n\n„Musíme to zaznamenat! Lidé se to musí dozvědět! Neseš na těle svaté rány samotného Krista!“"
 legend_spread_events.5020.a: "„Víš, že mám ještě jednu i v boku?“"
 legend_spread_events.5020.a.tt: "Stará jizva. Třeba má nějaký hlubší význam?"
 legend_spread_events.5020.b: "Je to #EMP opravdu#! docela zajímavé..."
 legend_spread_events.5020.c: "„Je to jen stará skvrna, [chronicler.GetFirstNameNoTooltip].“"
 legend_spread_events.5025.t: "Zaprášené svazky"
 legend_spread_events.5025.desc: "Klid a ticho mé [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'tent','study')] jsou rázně u konce, když dovnitř vtrhne [chronicler.GetFirstName] a v náručí svírá cosi, co vypadá jako letitý [ROOT.Char.Custom('GetWritingMaterial')].\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ vykřikne [chronicler.GetFirstNameNoTooltip]. „Podívej, podívej! Našli jsme starý rukopis!“ Hodí jej na můj stůl a nadšeně do něj zabodne prst.\n\n„Je napsaný prastarým jazykem, který vůbec nedokážeme rozluštit. Ale ty...“ [chronicler.GetFirstNameNoTooltip] ke mně vzhlédne s úctou, „ty bys mohl[Select_CString(ROOT.Char.IsFemale,'a','')]! Musí to být dílo tvých předků!“"
 legend_spread_events.5025.a: "„Máš pravdu, [chronicler.GetFirstNameNoTooltip]! Tohle se překládá snadno!“"
 legend_spread_events.5025.b: "Tak se podíváme, co z toho vyčtu..."
 legend_spread_events.5025.b.success: "Podaří se ti text přeložit"
 legend_spread_events.5025.b.failure: "Jazyk ti zůstává naprostou záhadou"
 legend_spread_events.5025.c: "„Obávám se, že to nevypadá jako jazyk mých předků.“"
 legend_spread_events.5030.t: "Přátelé na vysokých místech"
 legend_spread_events.5030.desc: "Povinnosti spojené se správou panství málokdy dovolí, aby se naše cesty zkřížily, ale tentokrát mě okolnosti svedly dohromady s [vassal.GetFirstName]. [vassal.GetFirstNameNoTooltip] mě srdečně přivítá s vědoucím zábleskem v očích.\n\n„[ROOT.Char.GetFirstName], [ROOT.Char.Custom('FormOfAddressForLiege')]! Rád[Select_CString(vassal.IsFemale,'a','')] tě vidím!“ [vassal.GetFirstNameNoTooltip] mě poplácá po rameni. „Víš, poslední dobou o tobě slýchám #EMP fascinující#! historky.“ Při pohledu na mé mírné rozpaky se [vassal.GetFirstNameNoTooltip] široce usměje.\n\n„Popravdě mě docela pobavily. Třeba bys mi mohl[Select_CString(ROOT.Char.IsFemale,'a','')] doplnit pár podrobností?“"
 legend_spread_events.5030.a: "„Byl[Select_CString(ROOT.Char.IsFemale,'a','')] bych ti zavázán[Select_CString(ROOT.Char.IsFemale,'a','')], kdybys mi pomohl[Select_CString(vassal.IsFemale,'a','')] šířit ty zvěsti!“"
 legend_spread_events.5030.b: "„Samozřejmě. Tak třeba jednou jsem-“"
 legend_spread_events.5030.c: "„Rád[Select_CString(ROOT.Char.IsFemale,'a','')] tě vidím, [vassal.GetFirstNameNoTooltip].“"
 legend_spread_events.5035.t: "Rodinné záležitosti"
 legend_spread_events.5035.desc: "„Je to velmi zvláštní, [ROOT.Char.Custom('FormOfAddressForLiege')], opravdu velmi zvláštní. Nevím, co si o tom myslet. Třeba tomu přijdeš na kloub ty?“\n\n[chronicler.GetFirstName] mi podá [ROOT.Char.Custom('GetWritingMaterial')], který byl vyhrabán z jakéhosi zaprášeného kouta rodového sídla. Zmateně si jej prohlížím. Nejsem si jist[Select_CString(ROOT.Char.IsFemale,'á','')], co tím [chronicler.GetFirstNameNoTooltip] myslí, zvlášť-\n\n„Podívej. Tvá rodová linie se nikde na tomhle seznamu neobjevuje.“ [chronicler.GetFirstNameNoTooltip] to upřesní způsobem, který podle [Select_CString(chronicler.IsFemale,'ní','něj')] zřejmě působí nápomocně. Ve skutečnosti mi tím náladu jen ještě víc zkazí.\n\nPro mé snahy o legitimizaci by to mohla být skutečně velmi špatná zpráva."
 legend_spread_events.5035.a: "„Tohle znič. A [chronicler.GetFirstNameNoTooltip]...?“"
 legend_spread_events.5035.a.tt: "„Jestli z této místnosti unikne jediné slovo, budu #EMP vědět#!, že to bylo od tebe.“"
 legend_spread_events.5035.b: "„Nesmysl! Podívej, tady přece je jméno mého otce!“"
 legend_spread_events.5035.b.success: "[chronicler.GetFirstNameNoTooltip] opravu ochotně přijme"
 legend_spread_events.5035.b.failure: "[chronicler.GetFirstNameNoTooltip] tomu nevěří"
 legend_spread_events.5035.c: "Musíme to udržet v tajnosti. #EMP Naprostém#! tajnosti."
 legend_spread_events.5035.c.success: "Tajemství zůstane pohřbeno"
 legend_spread_events.5035.c.failure: "Tajemství unikne"
 legend_spread_events.5035.d: "Budeme muset najít jiný dokument."
 legend_spread_events.5040.t: "Rodová květena"
 legend_spread_events.5040.desc: "„Ještě pár posledních otázek, [ROOT.Char.Custom('FormOfAddressForLiege')], a pak tě konečně nechám jít!“ Falešně veselý tón [chronicler.GetFirstNamePossessive] nijak nezmírňuje mou únavu, zatímco se naše nekonečné probírání [ROOT.Char.Custom('GetWritingMaterial')] při zkoumání mého rodokmenu dál vleče. [chronicler.GetFirstNameNoTooltip] důrazně poklepe na jednu jeho část.\n\n„Jen si nejsem jist[Select_CString(chronicler.IsFemale,'á','')], kdo přesně by měl zaplnit #EMP tahle#! konkrétní místa.“ [chronicler.GetFirstNameNoTooltip] starostlivě svraští obočí. „Nevíš to náhodou, [ROOT.Char.Custom('FormOfAddressForLiege')]?“"
 legend_spread_events.5040.a: "#EMP Samozřejmě#! že vím!"
 legend_spread_events.5040.a.tt: "Ne, nevím, ale při dobré lži jsou znalosti zbytečné..."
 legend_spread_events.5040.b: "[Select_CString(parent.IsFemale,'Matka','Otec')] to určitě bude vědět!"
 legend_spread_events.5040.c.tt: "Vůbec to nevím, ale třeba budu-li dost přesvědčiv[Select_CString(ROOT.Char.IsFemale,'á','ý')]..."
 legend_spread_events.5040.c.success: "Tvé výmysly znějí přesvědčivě"
 legend_spread_events.5040.c.failure: "Tvé lži jsou očividné"
 legend_spread_events.5040.d: "Klidně tam dej [ROOT.Char.Custom('RegionalMythicalCreature')], mně je to jedno!"
 legend_spread_events.5040.d.success: "Někteří důvěřivci tomu skutečně uvěří"
 legend_spread_events.5040.d.failure: "Taková ledabylost vzbudí pochybnosti o tvém rodokmenu"
 legend_spread_events.5045.t: "Pár slov?"
 legend_spread_events.5045.desc: "S [chronicler.GetFirstName] právě přemýšlíme, jak dostat zvěsti o mé oddanosti ještě dál, když mě [chronicler.GetFirstNameNoTooltip] chytí za paži a kývnutím hlavy na něco upozorní. Do mešity právě vstoupí [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('imam'))] [imam.GetFirstName] a očividně se začíná připravovat na pozdější bohoslužbu.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ zasyčí [chronicler.GetFirstNameNoTooltip]. „Tohle je #EMP dokonalé#!! [imam.GetFirstNameNoTooltip] právě připravuje dnešní #EMP chutbu#!! Rychle, běž a přesvědč [imam.GetFirstNameNoTooltip], ať v ní zazní tvé jméno!“\n\nSkvělý nápad! Jen by mě zajímalo, co bude potřeba, aby se stal skutečností..."
 legend_spread_events.5045.a: "[imam.GetFirstNameNoTooltip] přece neodmítne protislužbu."
 legend_spread_events.5045.b: "Úplatek může být riskantní, ale mohl by se vyplatit..."
 legend_spread_events.5045.b.success: "[imam.GetFirstNameNoTooltip] přijme tvou nabídku"
 legend_spread_events.5045.b.failure: "Tvá nabídka [imam.GetFirstNameNoTooltip] pobouří"
 legend_spread_events.5045.c: "Prostě [imam.GetFirstNameNoTooltip] přesvědčím."
 legend_spread_events.5045.c.success: "[imam.GetFirstNameNoTooltip] souhlasí"
 legend_spread_events.5045.c.failure: "[imam.GetFirstNameNoTooltip] tvé prosby odmítne"
 legend_spread_events.5045.d: "„Nebuď směšný[Select_CString(chronicler.IsFemale,'á','')], [chronicler.GetFirstNameNoTooltip].“"
 legend_spread_events.5050.t: "Vstup na scénu"
 legend_spread_events.5050.desc: "Měl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem tušit potíže už ve chvíli, kdy do [ROOT.Char.Custom('GetRoom')] nakráčí [chronicler.GetFirstName] a vede s sebou neznámou tvář.\n\n„Dovol mi představit [jeweller.GetFirstName], [ROOT.Char.Custom('FormOfAddressForLiege')].“ [jeweller.GetFirstNameNoTooltip] se hluboce ukloní. „[Select_CString(jeweller.IsFemale,'Je to šperkařka a kovotepkyně','Je to šperkař a kovotepec')]. Napadlo mě, že by sis možná rád[Select_CString(ROOT.Char.IsFemale,'a','')] prohlédl[Select_CString(ROOT.Char.IsFemale,'a','')] některé [Select_CString(jeweller.IsFemale,'její','jeho')] práce.“\n\n„Dovolil[Select_CString(jeweller.IsFemale,'a','')] jsem si připravit několik kusů, které se hodí obzvlášť pro tebe a... pro to, čím se teď zabýváš,“ začne [jeweller.GetFirstNameNoTooltip] a položí na stůl podnos.\n\n#EMP „Čím se teď zabývám?“#! [chronicler.GetFirstNameNoTooltip] má očividně napilno."
 legend_spread_events.5050.a: "Tahle koruna je opravdu něco."
 legend_spread_events.5050.b: "Z tohoto náhrdelníku vyzařuje cosi zvláštního."
 legend_spread_events.5050.c: "Nechce se mi utrácet #EMP tolik#!..."
 legend_spread_events.5050.d: "„Překračuješ meze, [chronicler.GetFirstNameNoTooltip].“"
 legend_spread_events.5055.t: "Kulturní volby"
 legend_spread_events.5055.desc: "Když přemýšlím, co si dnes obléknout, [chronicler.GetFirstName] překypuje radami: „Co třeba něco, co by tvé vazaly inspirovalo, [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]? Něco tradičního?“\n\nPokud si chci získat přízeň svých poddaných, měl[Select_CString(ROOT.Char.IsFemale,'a','')] bych skutečně vypadat tak, jak si představují panovníka. Mé panství však obývá mnoho různých kultur.\n\nMůj majestátní oděv by mohl potěšit někoho z [vassal1.GetCulture.GetName] kultury, jako je [vassal1.GetTitledFirstName], ale ti, kteří náš společný původ nesdílejí — například [vassal2.GetTitledFirstName] — by v něm viděli jen další připomínku našich rozdílů."
 legend_spread_events.5055.a: "Obě strany lze uspokojit."
 legend_spread_events.5055.a.tt: "Doplňky z [vassal1.GetCulture.GetNameNoTooltip] i [vassal2.GetCulture.GetNameNoTooltip] kultury mě představí jako tolerantního a respektujícího panovníka."
 legend_spread_events.5055.b: "Budu zastupovat svůj lid."
 legend_spread_events.5055.c: "Poddaní z [vassal2.GetCulture.GetNameNoTooltip] kultury potřebují někoho, ke komu mohou vzhlížet."
 legend_spread_events.5055.d: "Neměl[Select_CString(ROOT.Char.IsFemale,'a','')] bych si dělat nepřátele."
 legend_spread_events.5055.d.tt: "Vyhnout se konfliktu je mnohem snazší než dávat okázale najevo své postoje."
 5055_vassal1_culture: "Každý vazal [vassal1.GetCulture.GetName] [Concept('culture','kultury')|E]"
 5055_vassal2_culture: "Každý vazal [vassal2.GetCulture.GetName] [Concept('culture','kultury')|E]"
 5055_every_culture_vassal: "Každý vazal [vassal1.GetCulture.GetName] a [vassal2.GetCulture.GetName] [Concept('culture','kultury')|E]"
 legend_spread_events.5060.t: "Svatý zrak"
 legend_spread_events.5060.opening: "„Víš, [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip],“ začne [chronicler.GetFirstName] váhavě, zatímco procházíme [ROOT.Char.Custom('GetCourtyard')], „nerad[Select_CString(chronicler.IsFemale,'a','')] to zmiňuji, ale věřící budou chtít vědět, jak jsi přišel[Select_CString(ROOT.Char.IsFemale,'a','')] o"
 legend_spread_events.5060.one_eyed: "oko.“"
 legend_spread_events.5060.blind: "oči.“"
 legend_spread_events.5060.ending: "\n\nZastavím se. Chvění v hlase [chronicler.GetFirstNamePossessiveNoTooltip] naznačuje, že celé záležitosti přikládá mnohem větší váhu, než by bylo třeba. Když však ve větru zaslechnu vzdálený zpěv [ROOT.Char.GetFaith.PriestNeuterPlural], napadne mě...\n\nMožná konečně nastal čas obrátit toto prokleté trápení ve svůj prospěch?"
 legend_spread_events.5060.a: "„[Select_CString(ROOT.Char.IsFemale,'Spatřila jsem','Spatřil jsem')] [ROOT.Char.GetFaith.HighGodName] a to vidění mě oslepilo!“"
 legend_spread_events.5060.b: "„Byla to zkouška od [ROOT.Char.GetFaith.HighGodName], abych mohl[Select_CString(ROOT.Char.IsFemale,'a','')] dokázat svou oddanost!“"
 legend_spread_events.5060.c: "„Ať už byla příčina jakákoli, pokořilo mě to před [ROOT.Char.GetFaith.HighGodName].“"
 legend_spread_events.5060.d: "„Je to jen staré zranění, [chronicler.GetFirstNameNoTooltip].“"
 legend_spread_events.5060.d.tt: "Nemá smysl o tomhle starém zranění lhát."
 legend_spread_events.5065.t: "Svatý chléb"
 legend_spread_events.5065.desc: "Právě se po bradu cpu druhou porcí [ROOT.Char.Custom('GetExpensiveDessert')], když si všimnu, že na mě [chronicler.GetFirstName] hledí poněkud vyčítavě.\n\n„Víš, [ROOT.Char.Custom('FormOfAddressForLiege')],“ začne [chronicler.GetFirstNameNoTooltip] mírně, „když se snažíš, ehm, dávat na odiv svou svatost, možná by nebylo od věci trochu se krotit?“\n\nPohlédnu na jídlo. Je výtečné, ale možná má [chronicler.GetFirstNameNoTooltip] pravdu?"
 legend_spread_events.5065.a: "Pche, takhle jsem spokojenější!"
 legend_spread_events.5065.b: "„Máš pravdu. Polepším se.“"
 legend_spread_events.5065.c: "Trocha sem tam přece nemůže uškodit?"
 legend_spread_events.5070.t: "Velkolepý vstup"
 legend_spread_events.5070.desc: "Stojím bez hnutí, zatímco kolem mě [chronicler.GetFirstName] pobíhá a upravuje mi oděv. Když je [chronicler.GetFirstNameNoTooltip] s výsledkem spokojen[Select_CString(chronicler.IsFemale,'á','ý')], na chvíli se zamyslí.\n\n„Napadlo mě,“ začne [chronicler.GetFirstNameNoTooltip], „jestli bys nechtěl[Select_CString(ROOT.Char.IsFemale,'a','')] zkusit trochu jiný styl?“ Podezíravě pohled opětuji.\n\n„Snažíš se přece zdůrazňovat své vazby na předky. Možná by stálo za to zamyslet se nad tím, zda se nepředstavit k obrazu jejich?“"
 legend_spread_events.5070.a: "Obléknu se jako první [culture.GetCollectiveNounNoTooltip]!"
 legend_spread_events.5070.a.success: "Tvůj oděv sklízí chválu"
 legend_spread_events.5070.a.failure: "Nikoho nepřesvědčíš"
 legend_spread_events.5070.b: "Pár náznaků jejich stylu by možná nebylo na škodu..."
 legend_spread_events.5070.c: "Minulost mě inspiruje, ale nepodřizuji se jí."
 every_culture_vassal: "Každý vazal tvé [culture.GetNameNoTooltip] [Concept('culture','kultury')|E]"
 legend_spread_events.5075.t: "Neochvějná zbožnost"
 legend_spread_events.5075.desc: "[imam.GetFirstName] kolem mě spěšně projde, aniž by mi věnoval[Select_CString(imam.IsFemale,'a','')] víc než letmé uznání, ale já se zarazím. [chronicler.GetFirstName], který si všimne mého zmatení, začne vysvětlovat.\n\n„To je modlitební mozol.“ Společně chvíli sledujeme vzdalujícího se [imam.GetFaith.PriestNeuter], zatímco [chronicler.GetFirstNameNoTooltip] natahuje krk, aby lépe viděl[Select_CString(chronicler.IsFemale,'a','')] na čelo [imam.GetFirstNameNoTooltip]. „Ti, kdo se prohlašují za svaté, dokazují svou oddanost tak usilovnými úklonami při modlitbě, až se jim na čele vytvoří boule.“"
 legend_spread_events.5075.a: "Určitě musí existovat způsob, jak to předstírat..."
 legend_spread_events.5075.a.success: "Lidé se nechají snadno oklamat"
 legend_spread_events.5075.a.failure: "Tvůj podvod selže"
 legend_spread_events.5075.b: "Musím se modlit #EMP usilovněji!#!"
 legend_spread_events.5075.b.success: "Funguje to"
 legend_spread_events.5075.b.failure: "Au"
 legend_spread_events.5075.c: "To je naprostý nesmysl."
 legend_spread_events.5200.t: "Exotické cíle"
 legend_spread_events.5200.desc: "[chronicler.GetFirstName] se znovu pustí do práce a zapisuje další podrobnosti mé legendy.\n\n„Jedna věc mi vrtá hlavou,“ zamyslí se [chronicler.GetFirstNameNoTooltip]. „Proč ses rozhodl[Select_CString(ROOT.Char.IsFemale,'a','')] lovit právě tuto bestii? Proč sis ze všech zvířat vybral[Select_CString(ROOT.Char.IsFemale,'a','')] zrovna [legend.GetProperty( 'beast' ).GetFlagName]?“"
 legend_spread_events.5200.a: "Chtěl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem ochutnat jeho #EMP exotické maso#!."
 legend_spread_events.5200.b: "Ono... zabilo [Select_CString(dead_parent.IsFemale,'mou matku','mého otce')] [dead_parent.GetFirstNameNoTooltip]!"
 legend_spread_events.5200.b.success: "Tvůj příběh zní věrohodně"
 legend_spread_events.5200.b.failure: "Všichni už vědí, že takhle [Select_CString(dead_parent.IsFemale,'nezemřela','nezemřel')]"
 legend_spread_events.5200.c: "Pro slávu, samozřejmě."
 legend_spread_events.5205.t: "Být nejlepší"
 legend_spread_events.5205.desc: "[chronicler.GetFirstName] se krátce protáhne a sáhne po dalším [ROOT.Char.Custom('GetWritingMaterial')], kterým nakrmí rostoucí hromadu.\n\n„Takže, [ROOT.Char.Custom('FormOfAddressForLiege')],“ začne [chronicler.GetFirstNameNoTooltip] znovu klidným hlasem, „vysvětli mi, proč jsi byl[Select_CString(ROOT.Char.IsFemale,'a','')] tak odhodlaný[Select_CString(ROOT.Char.IsFemale,'á','ý')] ulovit tak zuřivého protivníka, jako je [legend.GetProperty( 'beast' ).GetFlagName]? To přece musí být skutečně nebezpečný protivník.“"
 legend_spread_events.5205.a: "Co jiného by dělal nejlepší lovec v celé zemi?"
 legend_spread_events.5205.b: "Byla to jen příprava na ještě nebezpečnější kořist..."
 legend_spread_events.5205.b.tt: "...a teď už vím, jak ji najít."
 legend_spread_events.5205.c: "Potřeboval[Select_CString(ROOT.Char.IsFemale,'a','')] jsem vypilovat své stopařské schopnosti."
 legend_spread_events.5205.d: "Abych dokázal[Select_CString(ROOT.Char.IsFemale,'a','')], jak dobrý[Select_CString(ROOT.Char.IsFemale,'á','ý')] jsem lovec."
 legend_spread_events.5210.t: "Jednooký loupežník"
 legend_spread_events.5210.desc: "„Je to opravdu pravda?“ [chronicler.GetFirstName] horečně hledá další [ROOT.Char.Custom('GetWritingMaterial')], aby si mohl[Select_CString(chronicler.IsFemale,'a','')] zapisovat poznámky, a přitom po mně žádá potvrzení jednotlivých historek. „Prý došlo i na setkání s jednou obzvlášť odpornou bytostí.“\n\n„Slyšel[Select_CString(chronicler.IsFemale,'a','')] jsem zvěsti o obrovském, těžkopádném tvorovi s jediným okem. Mocném kyklopovi!“"
 legend_spread_events.5210.a: "A dokonce si myslel, že jsem také kyklop!"
 legend_spread_events.5210.b: "„A byla to opravdu zuřivá bestie!“"
 legend_spread_events.5210.c: "Myslím, že to byl ve skutečnosti jen někdo z místních."
 legend_spread_events.5215.t: "Neuvěřitelná zeleň"
 legend_spread_events.5215.desc: "Sedím s [chronicler.GetFirstName], zatímco [chronicler.GetFirstNameNoTooltip] zapisuje další části mé legendy.\n\n„Byla ta část o rostlinách pravdivá, [ROOT.Char.Custom('FormOfAddressForLiege')]?“ Mé tázavě zdvižené obočí [chronicler.GetFirstNameNoTooltip] očividně pobídne k pokračování. „Přece ty nepřátelské rostliny! Flora s obřími listy, která tě dokáže zdálky omámit svým pylem!“"
 legend_spread_events.5215.a: "O pravdivosti toho mohu podat velmi zasvěcené svědectví."
 legend_spread_events.5215.b: "Strašlivá situace, ale dalo se z ní dostat."
 legend_spread_events.5215.c: "Ne, ale zjistil[Select_CString(ROOT.Char.IsFemale,'a','')] jsem, že takové rostliny skutečně existují!"
 legend_spread_events.5216.t: "Místní sport"
 legend_spread_events.5216.desc: "Pohrávám si se zatoulaným šípem ze svazku opřeného o zeď, zatímco [chronicler.GetFirstName] dál zaznamenává mou legendu.\n\n„To mi něco připomíná, [ROOT.Char.Custom('FormOfAddressForLiege')],“ začne [chronicler.GetFirstNameNoTooltip] a zadívá se na šíp. „Je pravda, že tam proběhla nějaká výzva? Místní [ROOT.Char.Custom('GetLassLad')], zkušený[Select_CString(dummy_gender.IsFemale,'á','ý')] s lukem, vyzýval[Select_CString(dummy_gender.IsFemale,'a','')] každého příchozího k lukostřeleckému klání? A kdo zvítězil?“"
 legend_spread_events.5216.a: "„Vyhrál[Select_CString(ROOT.Char.IsFemale,'a','')] jsem tak, že jsem vlastním šípem rozpůlil[Select_CString(ROOT.Char.IsFemale,'a','')] ten [Select_CString(dummy_gender.IsFemale,'její','jeho')]!“"
 legend_spread_events.5216.b: "Byla to snadná výhra!"
 legend_spread_events.5216.b.success: "Zní to věrohodně"
 legend_spread_events.5216.b.failure: "Nikdo tomu nevěří"
 legend_spread_events.5216.c: "Byl to vlastně jen trénink."
 legend_spread_events.5220.t: "Pasti přírody"
 legend_spread_events.5220.desc.start: "[chronicler.GetFirstName] si mě zamyšleně prohlíží.\n\n„Slyšel[Select_CString(chronicler.IsFemale,'a','')] jsem, že ses na svých cestách potýkal[Select_CString(ROOT.Char.IsFemale,'a','')] s pořádnou řadou nástrah.“ Mé opatrné přikývnutí [chronicler.GetFirstNameNoTooltip] zřejmě povzbudí. „Prý ses málem stal[Select_CString(ROOT.Char.IsFemale,'a','')] obětí"
 legend_spread_events.5220.desc.wet: "páchnoucího, vtahujícího močálu. "
 legend_spread_events.5220.desc.dry: "pohyblivého, vtahujícího písku. "
 legend_spread_events.5220.desc.ending: "Říká se, že ses musel[Select_CString(ROOT.Char.IsFemale,'a','')] doslova probojovat ven a že kdyby ti došly síly, zahynul[Select_CString(ROOT.Char.IsFemale,'a','')] bys!“ [chronicler.GetFirstNameNoTooltip] na mě očekávavě hledí."
 legend_spread_events.5220.a: "„Pche, pro [Select_CString(ROOT.Char.IsFemale,'ženu','muže')] mého formátu to nic nebylo!“"
 legend_spread_events.5220.b: "Přesně tak! Nakonec jsem se ale přece jen dostal[Select_CString(ROOT.Char.IsFemale,'a','')] ven."
 legend_spread_events.5220.c: "Byla to jen podmáčená půda."
 legend_spread_events.5225.t: "Síla květin"
 legend_spread_events.5225.desc: "Malá kytička na mém stole zřejmě upoutá pozornost [chronicler.GetFirstNamePossessive].\n\n„To mi něco připomíná, [Select_CString(ROOT.Char.IsFemale,'má dobrá paní','můj dobrý pane')],“ začne [chronicler.GetFirstNameNoTooltip]. „Slyšel[Select_CString(chronicler.IsFemale,'a','')] jsem o tobě jednu historku. Prý jsi na svých cestách objevil[Select_CString(ROOT.Char.IsFemale,'a','')] naprosto jedinečnou rostlinu?“ [chronicler.GetFirstNameNoTooltip] ke mně rychle vzhlédne.\n\n„Nemáš náhodou nějaký exemplář u sebe?“"
 legend_spread_events.5225.a: "„Samozřejmě!“"
 legend_spread_events.5225.a.tt: "Tahle květina rozhodně není jedinečná, ale je dost neobvyklá, aby oklamala laika."
 legend_spread_events.5225.b: "Jednu mám přímo tady!"
 legend_spread_events.5225.b.tt: "No, tahle květina přece jen nepatří mezi #EMP úplně#! nejběžnější..."
 legend_spread_events.5225.b.success: "[chronicler.GetNameNoTooltip] takovou květinu ještě nikdy neviděl[Select_CString(chronicler.IsFemale,'a','')]"
 legend_spread_events.5225.b.failure: "[chronicler.GetNameNoTooltip] už podobných květin viděl[Select_CString(chronicler.IsFemale,'a','')] spoustu"
 legend_spread_events.5225.c: "#EMP Květiny?!#! Neměli bychom se bavit o velkolepějších věcech?"
 legend_spread_events.5225.d: "„Obávám se, že ne.“"
 legend_spread_events.5230.t: "Chuť na krev"
 legend_spread_events.5230.desc: "Když [chronicler.GetFirstName] vtrhne do [ROOT.Char.Custom('GetRoom')], často to znamená, že přijdou nějaké podivné otázky, a tentokrát tomu není jinak.\n\n„[Select_CString(ROOT.Char.IsFemale,'Má paní','Můj pane')]! Právě jsem slyšel[Select_CString(chronicler.IsFemale,'a','')] tu nejneuvěřitelnější historku!“ vykřikne [chronicler.GetFirstNameNoTooltip] a začne horečně hledat další [ROOT.Char.Custom('GetWritingMaterial')]. „Prý tě na cestách napadli #EMP kanibalové#!! Lidojedi, věříš tomu?!“"
 legend_spread_events.5230.a: "„Vidíš tuhle jizvu? Tu mi udělal jeden z nich.“"
 legend_spread_events.5230.b: "...popravdě opravdu uměli připravit maso."
 legend_spread_events.5230.c: "A přežil[Select_CString(ROOT.Char.IsFemale,'a','')] jsem, abych o tom mohl[Select_CString(ROOT.Char.IsFemale,'a','')] vyprávět!"
 legend_spread_events.5230.d: "Myslím, že to byli jen bandité."
 legend_spread_events.5235.t: "Jeden na jednoho"
 legend_spread_events.5235.desc: "Právě [chronicler.GetFirstName] vyprávím o svých činech v bitvě, když mě náhle přeruší.\n\n„Takže je to pravda? [Select_CString(ROOT.Char.IsFemale,'Zabila jsi','Zabil jsi')] v souboji nepřátelského velitele?“ Oči [chronicler.GetFirstNamePossessive] se rozzáří nadšením nad všemi možnostmi. Zjevně jde o jednu z přikrášlených historek, které se šíří od úst k ústům.\n\nV té bitvě jsem skutečně byl[Select_CString(ROOT.Char.IsFemale,'a','')], ale v chaosu boje se mohlo stát prakticky cokoli..."
 legend_spread_events.5235.a: "Pod mou čepelí zemřel[Select_CString(ROOT.Char.IsFemale,'a','')] se ctí."
 legend_spread_events.5235.b: "Nezáleží na tom, čí ruka vedla meč, který [Select_CString(enemy_commander.IsFemale,'ji','ho')] zabil."
 legend_spread_events.5240.t: "Rozvaha, nebo odvaha?"
 legend_spread_events.5240.desc: "[chronicler.GetFirstName] rychlými tahy do rozsypaných semínek z převrženého poháru zakresluje průběh dávné bitvy. Když si všimne, že se dívám, rychle změní směr hovoru.\n\n„Právě tahle část mě zajímá nejvíc,“ pronese [chronicler.GetFirstNameNoTooltip] a zabodne prst do jedné z linií mezi semínky. „Slyšel[Select_CString(chronicler.IsFemale,'a','')] jsem, že jsi tady předstíral[Select_CString(ROOT.Char.IsFemale,'a','')] ústup. Na druhou stranu jsem zaslechl[Select_CString(chronicler.IsFemale,'a','')] i poněkud méně #EMP lichotivá#! nařčení...“\n\nMé zbabělé srdce se rozbuší panikou i při tomto zdvořilém vyptávání."
 legend_spread_events.5240.a: "Byl to dokonalý taktický ústup."
 legend_spread_events.5240.b: "Sa... samozřejmě že to byl #EMP taktický#! ústup!"
 legend_spread_events.5240.b.success: "Tvé vysvětlení zní věrohodně"
 legend_spread_events.5240.b.failure: "Tvá horlivá obhajoba jen potvrzuje podezření"
 legend_spread_events.5240.c: "...raději se v tom nešťourejme."
 legend_spread_events.5245.t: "Drtivý úder"
 legend_spread_events.5245.desc: "Další čas strávený s [chronicler.GetFirstName] znamená další únavné probírání dávné bitvy, aby mohla být zapsána do mé legendy. [chronicler.GetFirstNameNoTooltip] si všimne mého nezájmu a zkusí to jinak.\n\n„Když se nepřátelské levé křídlo zhroutilo a my vpadli do jejich týlu,“ začne [chronicler.GetFirstNameNoTooltip], „je skutečně pravda, že jsi ten obchvatný útok vedl[Select_CString(ROOT.Char.IsFemale,'a','')] ty? To byl vskutku geniální tah!“"
 legend_spread_events.5245.a: "„Ano. Pod našimi čepelemi jich zemřelo mnoho.“"
 legend_spread_events.5245.b: "„Ve skutečnosti jsem vedl[Select_CString(ROOT.Char.IsFemale,'a','')] rozhodující úder středem.“"
 legend_spread_events.5245.c: "Pouze jsem dohlížel[Select_CString(ROOT.Char.IsFemale,'a','')] na průběh bitvy."
 legend_spread_events.5250.t: "Záchrana nevinné duše"
 legend_spread_events.5250.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Ach, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]!“ Vášnivá naléhavost [chronicler.GetFirstNamePossessive] mě přiměje zpozornět. „Právě jsem slyšel[Select_CString(chronicler.IsFemale,'a','')] o tvém romantickém dobrodružství na bitevním poli! Ztracený a zmatený, ale skutečně nádherný venkovan bloudil mezi bojujícími a #EMP ty#! jsi [ROOT.Char.Custom('GetHerHimOpposite')] zachránil[Select_CString(ROOT.Char.IsFemale,'a','')]!“\n\nJe zřejmé, že [chronicler.GetFirstNameNoTooltip] se tohoto tématu jen tak nevzdá."
 legend_spread_events.5250.a: "„Ale ano, zachránil[Select_CString(ROOT.Char.IsFemale,'a','')] jsem [ROOT.Char.Custom('GetHerHimOpposite')]. Rovnou do svého #EMP stanu#!!“"
 legend_spread_events.5250.b: "„A za odměnu jsem dokonce dostal[Select_CString(ROOT.Char.IsFemale,'a','')] polibek.“"
 legend_spread_events.5250.c: "„Musíš si mě s někým plést.“"
 legend_spread_events.5255.t: "Válečné historky"
 legend_spread_events.5255.desc: "„Když člověk poslouchá vyprávění o tvých bitvách, [ROOT.Char.Custom('FormOfAddressForLiege')],“ pronese [chronicler.GetFirstName] s hlasem trochu teatrálně rozechvělým, „je skutečný zázrak, že jsi přežil[Select_CString(ROOT.Char.IsFemale,'a','')]! Všude kolem smrt a krveprolití, a ty jsi tím prošel[Select_CString(ROOT.Char.IsFemale,'a','')] bez jediného škrábnutí.“\n\nKaždý má rád dobrou válečnou historku. Možná by trocha přikrášlení té mé pomohla šířit mou legendu?"
 legend_spread_events.5255.a: "„Bez jediného škrábnutí rozhodně ne, [chronicler.GetFirstNameNoTooltip].“"
 legend_spread_events.5255.b: "„Odkud myslíš, že mám všechny tyhle jizvy?“"
 legend_spread_events.5255.c: "„Jen díky [ROOT.Char.GetFaith.HighGodName].“"
 legend_spread_events.5255.d: "„Probojoval[Select_CString(ROOT.Char.IsFemale,'a','')] jsem se tím, jak nejstatečněji to šlo!“"
 legend_spread_events.5260.t: "V pravý čas"
 legend_spread_events.5260.desc: "„Naše vojsko bylo pod obrovským tlakem a ze všech stran sužované,“ vytrhne mě [chronicler.GetFirstName] ze zamyšlení, když probíráme dávnou bitvu, „a přesto jsme zvítězili! Dokonce jsem slyšel[Select_CString(chronicler.IsFemale,'a','')], že právě #EMP ty#! jsi v rozhodující chvíli dorazil[Select_CString(ROOT.Char.IsFemale,'a','')] s posilami! Jak dokonale načasovaný příchod, který nám zajistil vítězství!“\n\nZvěst o [promoted_legend.GetName] se musí šířit široko daleko a příběhy o mých hrdinských činech tomu mohou pomoci. Pokud si tedy chci připsat zásluhy i za tenhle čin..."
 legend_spread_events.5260.a: "„Dorazil[Select_CString(ROOT.Char.IsFemale,'a','')] jsem právě včas.“"
 legend_spread_events.5260.b: "„Naplánovali jsme to dlouho dopředu.“"
 legend_spread_events.5305.t: "Dobré sousedské vztahy"
 legend_spread_events.5305.desc: "[chronicler.GetFirstName] pilně zapisuje má slova, jak mu je diktuji. Musím volit opatrně: [potential_promoter.GetFirstName], vládce sousedního panství, by se mohl nechat přesvědčit, aby podpořil mou snahu šířit zvěst o [promoted_legend.GetName], ale špatná formulace by mohla vyznít... možná až příliš samolibě.\n\nOdmlčím se. [chronicler.GetFirstNameNoTooltip] také a trpělivě čeká. Co by asi [potential_promoter.GetFirstNameNoTooltip] #EMP chtěl[Select_CString(potential_promoter.IsFemale,'a','')]#! slyšet?"
 legend_spread_events.5305.a: "[potential_promoter.GetFirstNameNoTooltip] jistě rád[Select_CString(potential_promoter.IsFemale,'a','')] uvidí úspěch někoho z [root_culture.GetName] kultury!"
 legend_spread_events.5305.a.success: "[potential_promoter.GetFirstNameNoTooltip] souhlasí"
 legend_spread_events.5305.a.failure: "[potential_promoter.GetFirstNameNoTooltip] není ohromen[Select_CString(potential_promoter.IsFemale,'a','')]"
 legend_spread_events.5305.b: "Možná... nenápadná výhrůžka."
 legend_spread_events.5305.b.success: "[potential_promoter.GetFirstNameNoTooltip] je patřičně zastrašen[Select_CString(potential_promoter.IsFemale,'a','')]"
 legend_spread_events.5305.b.failure: "[potential_promoter.GetFirstNameNoTooltip] tvé výhrůžky odmítne"
 legend_spread_events.5305.c: "Snad zabere odvolání na dobré sousedské vztahy?"
 legend_spread_events.5305.c.success: "[potential_promoter.GetFirstNameNoTooltip] svolí"
 legend_spread_events.5305.c.failure: "[potential_promoter.GetFirstNameNoTooltip] tvé prosby nezajímají"
 legend_spread_events.5305.d: "Pche, prostě to pošli tak, jak to je."
 legend_spread_events.5305.d.success: "[potential_promoter.GetFirstNameNoTooltip] je ohromen[Select_CString(potential_promoter.IsFemale,'a','')]"
 legend_spread_events.5310.t: "Hlasatel legendy"
 legend_spread_events.5310.desc: "Nemohu si pomoct a neklidně přecházím sem a tam, zatímco [herald.GetFirstName] chystá zásoby na návštěvu dvora [potential_promoter.GetFirstName], vládce sousedního panství. [herald.GetFirstNameNoTooltip|U] má výslovný úkol šířit zvěst o [promoted_legend.GetName] a pokud možno si odchytit [potential_promoter.GetTitleAsNameNoTooltip] a přesvědčit [potential_promoter.GetFirstNameNoTooltip], aby se přidal[Select_CString(potential_promoter.IsFemale,'a','')] k naší věci.\n\nTento úkol bude vyžadovat sebejistotu a šarm... a možná i nějakou další pobídku."
 legend_spread_events.5310.a: "„Použij svůj důvtip!“"
 legend_spread_events.5310.a.success: "[potential_promoter.GetFirstNameNoTooltip] je okouzlen[Select_CString(potential_promoter.IsFemale,'a','')]"
 legend_spread_events.5310.a.failure: "[herald.GetFirstNameNoTooltip] působí podlézavě"
 legend_spread_events.5310.b: "Tenhle dar ve zlatě by mohl [potential_promoter.GetFirstNameNoTooltip] přesvědčit."
 legend_spread_events.5310.b.success: "Lákadlo zlata se ukáže být mocné"
 legend_spread_events.5310.b.failure: "Dar [potential_promoter.GetFirstNameNoTooltip] nepřesvědčí"
 legend_spread_events.5310.c: "Prostě... tam běž a nic nepokaz."
 legend_spread_events.5310.c.success: "[herald.GetFirstNameNoTooltip] se osvědčí"
 legend_spread_events.5315.t: "Šíření zvěsti"
 legend_spread_events.5315.desc: "Zastavím se, píšu, znovu se zastavím a zase píšu...\n\nSlova tohoto dopisu musím volit opatrně. Jakoukoli neuváženou formulaci ve zprávě pro [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('vassal'))] [vassal.GetFirstName] by [vassal.GetFirstNameNoTooltip] nepřijal[Select_CString(vassal.IsFemale,'a','')] zrovna vlídně, ale pokud se trefím do černého, podpora [promoted_legend.GetName] by byla skutečně cenná.\n\nTak se podívejme. Co by vlastně [vassal.GetFirstNameNoTooltip] #EMP chtěl[Select_CString(vassal.IsFemale,'a','')]#! slyšet?"
 legend_spread_events.5315.a: "[vassal.GetFirstNameNoTooltip] je přece nesmírně cílevědom[Select_CString(vassal.IsFemale,'á','ý')]!"
 legend_spread_events.5315.a.success: "[vassal.GetFirstNameNoTooltip] je potěšen[Select_CString(vassal.IsFemale,'a','')]"
 legend_spread_events.5315.a.failure: "Netrefil ses"
 legend_spread_events.5315.b: "[promoted_legend.GetNameNoTooltip] může být také příběhem #EMP pomsty#!..."
 legend_spread_events.5315.c: "Možná bych měl[Select_CString(ROOT.Char.IsFemale,'a','')] být prostě co nejupřímnější?"
 legend_spread_events.5315.d: "Mohl[Select_CString(ROOT.Char.IsFemale,'a','')] bych to formulovat tak, aby to [vassal.GetFirstNameNoTooltip] zalichotilo..."
 legend_spread_events.5320.t: "Mazání úst"
 legend_spread_events.5320.desc: "Vazal se obvykle snaží upoutat pozornost svého lenního pána, ale tentokrát se role obrátily. [vassal.GetFirstName] by byl[Select_CString(vassal.IsFemale,'a','')] neocenitelnou oporou při šíření [promoted_legend.GetName]. Musím udělat vše pro to, abych [vassal.GetFirstNameNoTooltip] získal[Select_CString(ROOT.Char.IsFemale,'a','')] na svou stranu.\n\nMusím dobře promyslet, čím nejlépe upoutat pozornost. Třeba příslib investice do držav [vassal.GetFirstNamePossessiveNoTooltip]? Nebo snad prostý příslib protislužby?"
 legend_spread_events.5320.artifact: "\n\nPohled mi sklouzne k [artifact.GetName] na druhé straně místnosti. Nechal[Select_CString(vassal.IsFemale,'a','')] by se [vassal.GetFirstNameNoTooltip] zviklat takovým darem?"
 legend_spread_events.5320.a: "Tohle přece [vassal.GetFirstNameNoTooltip] neodmítne?"
 legend_spread_events.5320.a.success: "[vassal.GetFirstNameNoTooltip] dar vděčně přijme"
 legend_spread_events.5320.a.failure: "[vassal.GetFirstNameNoTooltip] dar odmítne"
 legend_spread_events.5320.a.artifact: "Tvůj [artifact.GetName] získá #negative_value negativní#! modifikátor [Concept('prestige','prestiže')|E]"
 legend_spread_events.5320.b: "Investice do [capital_county.GetNameNoTierNoTooltip] by mohla zapůsobit."
 legend_spread_events.5320.b.success: "[vassal.GetFirstNameNoTooltip] je nabídkou nadšen[Select_CString(vassal.IsFemale,'á','ý')]"
 legend_spread_events.5320.b.failure: "[vassal.GetFirstNameNoTooltip] není ohromen[Select_CString(vassal.IsFemale,'a','')]"
 legend_spread_events.5320.c: "Přízeň lenního pána by měla [vassal.GetFirstNameNoTooltip] stačit."
 legend_spread_events.5320.d: "[vassal.GetFirstNameNoTooltip] by mě měl[Select_CString(vassal.IsFemale,'a','')] následovat tak jako tak!"
 legend_spread_events.5320.d.success: "[vassal.GetFirstNameNoTooltip] následuje tvého příkladu"
 legend_spread_events.5325.t: "Ptáčci zpívají"
 legend_spread_events.5325.desc: "Posel mi doručí #EMP další#! dopis — tentokrát od [legend_person.GetFirstName] — a já už předem vím, čeho se bude týkat. Příběhy o [promoted_legend.GetName] se šíří široko daleko a stále více úst je nese ještě dál.\n\nJe to skutečně působivý příběh. Možná by mělo své výhody přidat se k lidem, jako je [legend_person.GetFirstNameNoTooltip]?"
 legend_spread_events.5325.protag: "\n\nA co třeba nějaký hmotný prospěch? [promoted_legend_owner.GetFirstName], ústřední postava legendy, má na jejím šíření vlastní zájem. Navíc disponuje nemalým bohatstvím. Možná by odpověď mohla přinést své ovoce?"
 legend_spread_events.5325.a: "Váha mého slova bude mít svou cenu."
 legend_spread_events.5325.b: "Přidám se k těm, kteří jí veřejně věří."
 legend_spread_events.5325.c: "Podpořím ji, ale za jistou částku..."
 legend_spread_events.5325.c.success: "[promoted_legend_owner.GetFirstNameNoTooltip] je nabídkou nadšen[Select_CString(promoted_legend_owner.IsFemale,'á','ý')]"
 legend_spread_events.5325.c.failure: "[promoted_legend_owner.GetFirstNameNoTooltip] není ohromen[Select_CString(promoted_legend_owner.IsFemale,'a','')]"
 legend_spread_events.5325.c.success.tt: "Tvůj dopis je přijat příznivě"
 legend_spread_events.5325.c.failure.tt: "Tvůj dopis je přijat špatně"
 legend_spread_events.5325.d: "To jsou všechno nesmysly!"
 legend_spread_events.5325.stop_promoting_warning: "@alert_icon! #alert_trial Budeš muset přestat šířit svou současnou [Concept('legend','legendu')|E]!#!"
 legend_spread_events.5325.stop_promoting: "Přestaneš šířit svou současnou [Concept('legend','legendu')|E]"
 legend_spread_events.5326.opening: "[ROOT.Char.Custom2('AppropriateGreetingPositive', promoted_legend_owner)]"
 legend_spread_events.5326.desc: "Tvůj návrh má rozhodně něco do sebe! Přijmi prosím tento dar jako odměnu za své úsilí při šíření dobré pověsti o [promoted_legend.GetName]."
 legend_spread_events.5326.a: "Výborně!"
 legend_spread_events.5326.b: "Svého současného příběhu se nevzdám."
 legend_spread_events.5327.opening: "[ROOT.Char.Custom2('AppropriateGreetingNegative', promoted_legend_owner)]"
 legend_spread_events.5327.desc: "Tvůj pokus o úplatek je pošetilý a urážlivý! Mé proslulé činy nepotřebují, abys je šířil[Select_CString(ROOT.Char.IsFemale,'a','')] svým jedovatým jazykem!"
 legend_spread_events.5327.a: "Sakra!"
 legend_spread_events.5330.t: "Nevhodné šeptandy"
 legend_spread_events.5330.desc: "Dobrý příběh by měl přece šířit dobrý člověk, ne? Přesto ke mně stále doléhají zvěsti o hříšném, [promoted_legend_owner.Custom('SinfulTrait')|l] počínání [promoted_legend_owner.GetFirstName], [Select_CString(promoted_legend_owner.IsFemale,'která','který')] tak vytrvale propaguje [promoted_legend.GetName].\n\nMohl[Select_CString(ROOT.Char.IsFemale,'a','')] bych se od tak nechvalně proslulé postavy distancovat, ale spojení s tak známým příběhem přináší i své výhody..."
 legend_spread_events.5330.a: "Jak se opovažuje! Jsem zbožný[Select_CString(ROOT.Char.IsFemale,'á','')] [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]!"
 legend_spread_events.5330.b: "S [promoted_legend_owner.GetFirstNameNoTooltip] nechci mít nic společného."
 legend_spread_events.5330.c: "Tentokrát nad tím přimhouřím oko..."
 legend_spread_events.5330.c.success: "Tvá pověst posílí postavení [promoted_legend_owner.GetFirstNamePossessiveNoTooltip]"
 legend_spread_events.5335.t: "Téma hodné pozornosti"
 legend_spread_events.5335.desc: "Očekává se ode mě samozřejmě, že budu mluvit o skvělém příběhu [promoted_legend.GetName], ale nutno uznat, že vznešené vystupování a pevné zásady [promoted_legend_owner.GetFirstName] mi to značně usnadňují.\n\nŠlechta i prostý lid mluví o ctnostné povaze [promoted_legend_owner.GetFirstNamePossessiveNoTooltip] a tyto řeči rozhodně neminuly ani mé uši."
 legend_spread_events.5335.a: "Jaké požehnání, že mohu pomáhat šířit legendu [promoted_legend_owner.GetFirstNamePossessiveNoTooltip]!"
 legend_spread_events.5335.b: "Možná bych toho mohl[Select_CString(ROOT.Char.IsFemale,'a','')] využít ku prospěchu nás obou..."
 legend_spread_events.5335.c: "Mohl[Select_CString(ROOT.Char.IsFemale,'a','')] bych se od [promoted_legend_owner.GetFirstNameNoTooltip] něco naučit?"
 legend_spread_events.5335.c.success: "Od [promoted_legend_owner.GetFirstNameNoTooltip] získáš několik užitečných poznatků"
 legend_spread_events.8000.t: "Ukrytý svazek"
 legend_spread_events.8000.desc: "Navzdory veškerému úsilí se stále najdou tací, kteří popírají, že [promoted_legend.GetProtagonist.GetCulture.GetName] jsou skutečnými dědici lidu [promoted_legend.GetProperty('culture').Culture.GetName] kultury. Dnes za mnou přišel[Select_CString(chronicler.IsFemale,'a','')] [chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)] s informací, která by mohla rozptýlit veškeré pochybnosti o oprávněnosti mého nároku!\n\n[chronicler.GetFirstNameNoTooltip] mi vypráví o prastarém svazku, který se podle [Select_CString(chronicler.IsFemale,'ní','něj')] nachází kdesi v [promoted_legend.GetProperty('original_region').GeographicalRegion.GetName], přesněji v [province_to_visit.GetName]. Zdroje nejsou zrovna nejspolehlivější, ale pokud se jej pokusím najít, možná ještě dokážu oprávněnost [promoted_legend.GetName]."
 legend_spread_events.8000.a: "Vyrážím za dobrodružstvím!"
 legend_spread_events.8000.b: "Zůstanu doma!"
 travel_to_tome_tt: "Budeš [Concept('travel','cestovat')|E] do [province_to_visit.GetName], kde můžeš najít prastarý svazek"
 legend_spread_events.8001.t: "Svazek [promoted_legend.GetProperty('culture').Culture.GetNameNoTooltip] kultury: Ztracený v čase"
 legend_spread_events.8001.desc: "Okolnosti mě bohužel donutily vzdát se plánované cesty a stopa důkazů, po které jsem šel[Select_CString(ROOT.Char.IsFemale,'a','')], mezitím vychladla. Teď už nemohu udělat nic, čím bych svazek vypátral[Select_CString(ROOT.Char.IsFemale,'a','')], a obávám se, že jej navždy pohltil čas."
 legend_spread_events.8001.a: "Zatraceně!"
 legend_spread_events.8002.t: "Svazek [promoted_legend.GetProperty('culture').Culture.GetNameNoTooltip] kultury: Příjezd"
 legend_spread_events.8002.desc: "Konečně jsem dorazil[Select_CString(ROOT.Char.IsFemale,'a','')] do [province_to_visit.GetName] a po krátkém vyptávání místních jsem našel[Select_CString(ROOT.Char.IsFemale,'a','')] ruiny, v nichž se má svazek nacházet. Tato rozpadající se památka na kdysi mocnou civilizaci [promoted_legend.GetProperty('culture').Culture.GetName] kultury mi tolik připomíná [promoted_legend.GetProperty('title').Title.GetNameNoTier], že jsem si jist[Select_CString(ROOT.Char.IsFemale,'á','ý')], že někde musí existovat důkaz jejich spojení!\n\nRuiny jsou v žalostném stavu. Slyším, jak podpěry pod tíhou věků praskají a povolují, takže musím našlapovat opatrně, pokud nechci riskovat zničení celé památky."
 legend_spread_events.8002.a: "Je třeba vše pečlivě prozkoumat."
 legend_spread_events.8002.b: "K čertu s ruinami, musím najít ten svazek!"
 legend_spread_events.8002.c: "Je tu tolik věcí k poznání, k čertu se svazkem!"
 legend_spread_events.8002.d: "O tomhle místě jsem četl[Select_CString(ROOT.Char.IsFemale,'a','')]! Přesně vím, kde hledat."
 legend_spread_events.8003.t: "Svazek [promoted_legend.GetProperty('culture').Culture.GetNameNoTooltip] kultury: Nalezený"
 legend_spread_events.8003.desc: "Se svou družinou prohledáváme ruiny už celé dny, ale dosud jsme nenašli nic, co by naznačovalo spojení mezi [promoted_legend.GetProtagonist.GetCulture.GetCollectiveNoun] a [promoted_legend.GetProperty('culture').Culture.GetCollectiveNoun]. Pak mi však výprava náhle přinese schránku napůl rozdrcenou nemilosrdným během času, uvnitř které leží kniha pokrytá silnou vrstvou prachu a špíny.\n\nNěkolikrát do ní bouchnu, zatřesu s ní a zjistím, že se jen hemží vyobrazeními bytostí z mytologie [promoted_legend.GetProperty('culture').Culture.GetName] kultury, ovšem v nezaměnitelném stylu [promoted_legend.GetProtagonist.GetCulture.GetNameNoTooltip] kultury! Slova už sice vybledla a čas je připravil o význam, ale musím věřit, že tato úžasná kniha dokazuje jasné spojení mezi oběma kulturami!"
 legend_spread_events.8003.a: "To je neuvěřitelný objev!"
 legend_spread_events.8004.t: "Svazek [promoted_legend.GetProperty('culture').Culture.GetNameNoTooltip] kultury: Ztracený"
 legend_spread_events.8004.desc: "Se svou družinou jsme tyto ruiny prohledali tak důkladně, jak jen bylo možné, ale po údajném svazku není ani stopy. Mezi troskami však leží řada nesmírně zajímavých předmětů a u některých není pochyb, že je vytvořily ruce lidí z [promoted_legend.GetProperty('culture').Culture.GetName] kultury.\n\nDo kapsy si schovám malou kamennou řezbu zvířete a připravím se na cestu domů."
 legend_spread_events.8004.a: "Alespoň to nebyla úplná ztráta času."
 legend_spread_events.8010.t: "Podivná postava"
 legend_spread_events.8010.desc: "Na cestě se zastavíme k odpočinku. Má družina obklopí mýtinu, pobíhá kolem, vyhlíží bandity a shání zásoby, takže na okamžik zůstanu sám[Select_CString(ROOT.Char.IsFemale,'a','')]. Vítr sfoukne praskající táborový oheň stejně snadno jako já plamen svíčky. Za zády něco ucítím a otočím se. Do mého tábora se nějak dostal[Select_CString(challenger.IsFemale,'a','')] cizinec[Select_CString(challenger.IsFemale,'ka','')]. Nenuceně se usmívá, jako by tam byl[Select_CString(challenger.IsFemale,'a','')] odjakživa.\n\n„Jaké štěstí, že dnes potkávám samotnou ‚legendu‘, [ROOT.Char.GetNameNoTooltip].“ [challenger.GetFirstNameNoTooltip] mi ukáže svou zbraň. „Dokaž, že jsi legenda, [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('challenger'))].“"
 legend_spread_events.8010.a: "„Náš souboj bude legendární.“"
 legend_spread_events.8010.b: "„Stráže!“"
 legend_spread_events.8012.t: "I legendy umírají"
 legend_spread_events.8012.desc: "Má družina se vrátí právě včas, aby mě viděla padnout k nohám [challenger.GetFirstNamePossessiveNoTooltip]. Sotva se zvednu, abych znovu čelil[Select_CString(ROOT.Char.IsFemale,'a','')] svému mocnému a podivnému protivníkovi, [challenger.GetFirstNameNoTooltip] zmizí v divočině, jako by tam nikdy ani nebyl[Select_CString(challenger.IsFemale,'a','')]."
 legend_spread_events.8012.a: "Ostatní [challenger.GetFirstNameNoTooltip] také viděli, že ano?"
 legend_spread_events.8012.b: "Nikdo nic neviděl."
 legend_spread_events.8013.t: "Legendární vítězství"
 legend_spread_events.8013.desc: "Má družina se vrátí právě ve chvíli, kdy nad svým záhadným protivníkem vítězím. Zbraň [challenger.GetFirstNamePossessiveNoTooltip] dopadne na zem a [challenger.GetFirstNameNoTooltip] ke mně ohromeně vzhlédne.\n\nZavolám na svou družinu, ale když se znovu podívám k nohám, [challenger.GetFirstNameNoTooltip] je pryč, jako by tam nikdy ani nebyl[Select_CString(challenger.IsFemale,'a','')]."
 legend_spread_events.8013.a: "Vyhrál[Select_CString(ROOT.Char.IsFemale,'a','')] jsem... myslím."
 legend_spread_events.8020.t: "Kacířství!"
 legend_spread_events.8020.desc: "Dnes mě v [ROOT.Char.Custom('GetCourt')] vyruší [challenger.Custom2('MyCharacterIntroduction', ROOT.Char)], když se ke mně vrhne, ukazuje na mě a cestou křičí: „Kacíř[Select_CString(ROOT.Char.IsFemale,'ko','i')]!“\n\n„[legend.GetName|U] tvrdí, že [legend.GetProtagonist.GetNameNoTooltip] má moc převyšující dokonce [ROOT.Char.GetFaith.HighGodName]! Kacířství nejvyššího stupně!“\n\n[challenger.GetFirstNameNoTooltip] mi připadá jako šílenec[Select_CString(challenger.IsFemale,'kyně','')], ale mumlání kolem [ROOT.Char.Custom('GetRoom')] naznačuje, že někteří už s tímto tvrzením souhlasí."
 legend_spread_events.8020.a: "Dokážu je přesvědčit."
 legend_spread_events.8020.a.win: "Vyhráváš debatu"
 legend_spread_events.8020.a.lose: "Prohráváš debatu"
 legend_spread_events.8020.b: "Vyhoďte toho [challenger.Custom2('InsultNoun', ROOT.Char)] z mého [ROOT.Char.Custom('GetCourt')]."
 legend_spread_events.8020.c: "Ne, božská moc pochází #EMP od#! [ROOT.Char.GetFaith.HighGodName]."
 legend_spread_events.8030.t: "Jako ty"
 legend_spread_events.8030.desc: "V dálce slyším [child.Custom2('MyCharacterIntroduction', ROOT.Char)], jak se směje při hře s ostatními dětmi.\n\n„Já jsem [legend.GetProtagonist.GetNameNoTooltip], já jsem hrdina!“ [child.GetFirstNameNoTooltip] před svými nadšenými druhy přehrává příběh [legend.GetName].\n\nVšechny děti hledí na [child.GetFirstNameNoTooltip] s úžasem a obdivem, zcela uchvácené vyprávěním. Srdce mi poskočí radostí, když slyším, s jakým zápalem a nadšením vyslovuje další generace ona legendární jména a místa. Jednoho dne se všichni obrátíme v prach, ale legenda nikdy nezemře."
 legend_spread_events.8030.a: "Nechám [child.GetFirstNameNoTooltip] pokračovat."
 legend_spread_events.8030.b: "Měl[Select_CString(ROOT.Char.IsFemale,'a','')] bych jim to převyprávět osobně!"
 legend_spread_events.8040.t: "Hříšný předek"
 legend_spread_events.8040.desc: "„Ty tvrdíš, že pocházíš od [ancestor.GetName]?“ [challenger.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě dnes ráno přivítá nataženým prstem a fanatickým výrazem v očích. „Rouhání! [ancestor.GetFirstNameNoTooltip] [Select_CString(ancestor.IsFemale,'byla zkažená hříšnice oddávající se bezbožným neřestem','byl zkažený hříšník oddávající se bezbožným neřestem')]. Nebyla[Select_CString(ancestor.IsFemale,'','')] [virtue_trait.GetName(ancestor)], jak nám všem namluvili, nýbrž [sin_trait.GetName(ancestor)] — [Select_CString(ancestor.IsFemale,'hříšnice','hříšník')] každým coulem!“\n\n[challenger.GetFirstNameNoTooltip] nejenže mluví s naprostým přesvědčením, ale přinesl[Select_CString(challenger.IsFemale,'a','')] i množství záznamů a písemných svědectví o bezbožném chování [ancestor.GetNamePossessiveNoTooltip]. Pro mé tvrzení o původu od [ancestor.GetFirstNameNoTooltip] to nevypadá dobře..."
 legend_spread_events.8040.a: "Tohle všechno je určitě nesmysl."
 legend_spread_events.8040.a.win: "Přesvědčíš [challenger.GetFirstNameNoTooltip]"
 legend_spread_events.8040.a.lose: "Tvá pověst utrpí"
 legend_spread_events.8040.b: "Rouhání! Ven z mého [ROOT.Char.Custom('GetCourt')]!"
 legend_spread_events.8050.t: "Ctnostný předek"
 legend_spread_events.8050.desc: "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně dnes ráno přispěchá s náručí starých [chronicler.Custom('GetWritingMaterialPlural')] a tváří rozzářenou nadšením.\n\n„[ROOT.Char.GetTitleAsNameNoTooltip|U], mám skvělé zprávy. Pátral[Select_CString(chronicler.IsFemale,'a','')] jsem po informacích o [ancestor.GetName] a našel[Select_CString(chronicler.IsFemale,'a','')] jsem důkazy naznačující, že pověst [ancestor.GetFirstNamePossessiveNoTooltip] coby [sin_trait.GetName(ancestor)] byla značně přehnaná a ve skutečnosti [Select_CString(ancestor.IsFemale,'byla','byl')] docela [virtue_trait.GetName(ancestor)]!“\n\nNebude snadné to dokázat, ale pokud se mi to podaří, odkaz [ancestor.GetNameNoTooltip] získá ještě větší věhlas!"
 legend_spread_events.8050.a: "Musí to být pravda!"
 legend_spread_events.8050.a.win: "Přesvědčíš všechny"
 legend_spread_events.8050.a.lose: "Nepřesvědčíš nikoho"
 legend_spread_events.8050.b: "Soustřeďme se na to, co dokážeme prokázat."
 legend_spread_events.8050.c: "Ale... co #EMP já?#!"
 legend_spread_events.8060.t: "Přiznání na smrtelné posteli"
 legend_spread_events.8060.desc: "Přivítá mě [chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)] s tvrzením, že má nové informace o [legend.GetName].\n\nPodle [chronicler.GetFirstNameNoTooltip] na smrtelné posteli vstoupilo do srdce [ancestor.GetNamePossessive] světlo od [ROOT.Char.GetFaith.HighGodName] a otevřelo [Select_CString(ancestor.IsFemale,'jí','mu')] oči pro ctnosti [ROOT.Char.GetFaith.GetName].\n\nTímto posledním činem došel[Select_CString(ancestor.IsFemale,'a','')] [ancestor.GetFirstNameNoTooltip] vykoupení a čekal[Select_CString(ancestor.IsFemale,'a','')] na [Select_CString(ancestor.IsFemale,'ni','něj')] [ROOT.Char.GetFaith.PositiveAfterLife]."
 legend_spread_events.8060.a: "Samozřejmě, [ancestor.GetFirstNameNoTooltip] [Select_CString(ancestor.IsFemale,'byla','byl')] [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]!"
 legend_spread_events.8060.a.win: "Přesvědčíš všechny"
 legend_spread_events.8060.a.lose: "Tvé tvrzení zůstává nepřesvědčivé"
 legend_spread_events.8060.b: "Alespoň hodnoty [ancestor.GetFirstNamePossessiveNoTooltip] byly [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip]."
 legend_spread_events.8070.t: "Svatá událost"
 legend_spread_events.8070.desc: "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] za mnou dnes přijde se zajímavým návrhem. Tvrdí, že by mohl[Select_CString(chronicler.IsFemale,'a','')] trochu ohnout pravdu a přepsat [legend.GetName] tak, aby se příběh odehrával ve svaté zemi [holy_site.GetName] namísto pozemského [location.GetName].\n\nSamozřejmě by to byl podvrh, ale příběhu by to dodalo trochu zbožnosti navíc."
 legend_spread_events.8070.a: "Uděláme to."
 legend_spread_events.8070.a.win: "Všichni tomu uvěří"
 legend_spread_events.8070.a.lose: "Nikdo tomu nevěří"
 legend_spread_events.8070.b: "Ne, [location.GetNameNoTooltip] je přece #EMP úplně jako#! [holy_site.GetNameNoTooltip]."
 legend_spread_events.8080.t: "Legendární pěst"
 legend_spread_events.8080.desc: "Bouřlivě rozmlouvám s [chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)] a skupinou svých dvořanů. Právě vyprávím příběh [legend.GetName], když mě [chronicler.GetNameNoTooltip] přeruší.\n\n„Připomeň mi, jak přesně byl [legend.GetProperty('beast').GetFlagName] zabit, [ROOT.Char.GetTitleAsNameNoTooltip]. Není snad pravda, že byl zblízka utlučen k smrti?“"
 legend_spread_events.8080.a: "Ano. Přesně tak se to stalo."
 legend_spread_events.8080.a.crit_win: "Všichni ti věří"
 legend_spread_events.8080.a.win: "Lidé ti zřejmě věří"
 legend_spread_events.8080.a.lose: "Lidé ti zřejmě nevěří"
 legend_spread_events.8080.a.crit_lose: "Nikdo ti nevěří"
 legend_spread_events.8080.b: "Byl uloven tak, jak by ho ulovil každý lovec."
 legend_spread_events.8090.t: "[Select_CString(person_of_the_lake.IsFemale,'Paní','Pán')] z [watery_place.GetProvince.GetTerrain.GetNameNoTooltip]"
 legend_spread_events.8090.desc: "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] zapisuje [legend.GetName] na [chronicler.Custom('GetWritingMaterial')], zatímco mu znovu diktuji její znění. Když se však dostanu k samotnému počátku příběhu, [chronicler.GetFirstNameNoTooltip] přestane má slova zapisovat.\n\n„Nemohu si nevšimnout, že tu něco chybí, [ROOT.Char.GetTitleAsNameNoTooltip|U]. Nesetkal[Select_CString(legend.GetProtagonist.IsFemale,'a','')] se snad [legend.GetProtagonist.GetShortUIName] v [watery_place.GetName] s tajemnou [Select_CString(person_of_the_lake.IsFemale,'ženou','mužem')]? A nevynořil[Select_CString(person_of_the_lake.IsFemale,'a','')] se snad z vod, aby [legend.GetProtagonist.GetShortUIName] svěřil[Select_CString(person_of_the_lake.IsFemale,'a','')] božské poslání?“"
 legend_spread_events.8090.a: "Ach ano, jak jsme na to mohli zapomenout."
 legend_spread_events.8090.b: "Nesmysl. Vykoval[Select_CString(ROOT.Char.IsFemale,'a','')] jsem to vlastníma rukama!"
 legend_spread_events.8100.t: "Nejstrašidelnější"
 legend_spread_events.8100.desc: "Ze spánku mě vytrhne úder blesku a s rachotem se rozletí [ROOT.Char.Custom('GetDoor')]. U nohou mé postele stojí [superstitious_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n„Omlouvám se, že tě budím, [ROOT.Char.GetTitleAsNameNoTooltip|U], ale mnozí z nás nemohou spát. Jsem pevně přesvědčen[Select_CString(superstitious_courtier.IsFemale,'a','')], že tu řádí zlý duch a chce si nás všechny vzít.“\n\nPřestože mě probuzení v tak pozdní hodinu nemálo rozčiluje, znám obřad, kterým lze zlého ducha uvěznit v nějakém předmětu..."
 legend_spread_events.8100.a: "Spoutám ho se svým artefaktem!"
 legend_spread_events.8100.a.win: "Spoutáš ducha"
 legend_spread_events.8100.a.lose: "Zaklínadlo se ti nepodaří"
 legend_spread_events.8100.a.crit_lose: "Propadneš záchvatu"
 legend_spread_events.8100.b: "Zbláznil[Select_CString(superstitious_courtier.IsFemale,'a','')] ses? Ven!"
 legend_spread_events.8100.c: "Vím přesně, co dělat."
 legend_spread_events.8100.d: "Pohltím toho ducha do sebe!"
 artifact_dread_gain_mult_3_modifier: "Hrůzostrašný"
 legend_spread_events.8110.t: "Když padají [loser.GetFaith.GetAdherentNamePluralNoTooltip|l]"
 legend_spread_events.8110.desc: "„Ale prosím tě, to se přece nemohlo stát.“\n\n„Ne, je to pravda! [infidel_weapon.GetName|U] rudne krví tisíce [loser.GetFaith.GetAdherentNamePluralNoTooltip]! [ROOT.Char.GetNameNoTooltip|U] je v [memory.GetName] všechny zabil[Select_CString(ROOT.Char.IsFemale,'a','')] vlastní rukou!“\n\n[courtier_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] a [courtier_2.Custom2('MyCharacterIntroduction', ROOT.Char)] se právě vášnivě přou, ale jakmile si uvědomí, že poslouchám, oba zmlknou."
 legend_spread_events.8110.a: "Je to pravda, všechny jsem zabil[Select_CString(ROOT.Char.IsFemale,'a','')] vlastní rukou."
 legend_spread_events.8110.a.win: "Přesvědčíš oba"
 legend_spread_events.8110.a.lose: "Nezníš přesvědčivě"
 legend_spread_events.8110.b: "Ne, to není pravda."
 legend_spread_events.8110.c: "Byla to velká bitva a zaslouží si připomínat."
 travel_to_distant_land_tt: "Budeš [Concept('travel','cestovat')|E] do [distant_location.GetName]"
 legend_spread_events.8120.t: "Tajemné [distant_title.GetBaseNameNoTooltip|U]"
 legend_spread_events.8120.desc: "Zdvořile mě pozdraví [chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)], který[Select_CString(chronicler.IsFemale,'á','ý')] překypuje nadšením.\n\n[chronicler.GetFirstNameNoTooltip] mi vypráví o tajemné zemi známé jednoduše jako „[distant_title.GetBaseNameNoTooltip|U]“ a přede mnou rozvine mapu této podivuhodné země. Prý tam řeky oplývají mlékem a medem a dokonce i prostý lid tloustne z hojnosti, kterou země nabízí. Za normálních okolností bych se nikdy nevydal[Select_CString(ROOT.Char.IsFemale,'a','')] tak daleko, ale příběhy o mé hrdinské cestě by jistě prospěly [legend.GetName]!"
 legend_spread_events.8120.a: "Musím tam vyrazit!"
 legend_spread_events.8120.b: "[distant_title.GetBaseNameNoTooltip|U]? Takové místo přece nemůže existovat."
 legend_spread_events.8121.t: "Daleké kraje: Opuštěná výprava"
 legend_spread_events.8121.desc: "Má podivuhodná mapa [distant_title.GetBaseNameNoTooltip|U] se ztratila a obávám se, že se do té země za svého života už nikdy nepodívám."
 legend_spread_events.8121.a: "Běda."
 legend_spread_events.8122.t: "Daleké kraje: Příjezd"
 legend_spread_events.8122.desc.intro: "Konečně jsem dorazil[Select_CString(ROOT.Char.IsFemale,'a','')] do vzdáleného [distant_location.GetName] a"
 legend_spread_events.8122.desc.disappointing.sweden: "mé zklamání nezná mezí. Obloha je i za dne černá, jídlo není nic než nakládané ryby a okoralý chléb, místní spolu odmítají mluvit a zima je nesnesitelná."
 legend_spread_events.8122.desc.disappointing.tribal: "větší zklamání si snad ani nedokážu představit. Slibovali mi obrovskou metropoli, ale vidím jen pár stanů a chatrčí."
 legend_spread_events.8122.desc.disappointing.wet: "to, co vidím, mě rmoutí. Po úmorném brodění vodou přede mnou stojí jen několik roztroušených chatrčí kolem bahnitých tůní."
 legend_spread_events.8122.desc.disappointing.dry: "stav tohoto místa mě šokuje. Opuštěnou krajinou rozpadajících se budov jsou roztroušeny jen seschlé keře a živé duše tu téměř není."
 legend_spread_events.8122.desc.disappointing.fallback: "to má daleko k tomu, co mi bylo slíbeno. Velkolepá kouzelná země „[distant_title.GetBaseNameNoTooltip|U]“, která tolik podněcovala mou představivost, byla právě jen tím: představou. Skutečné [distant_title.GetBaseNameNoTooltip] je chudé a skromné."
 legend_spread_events.8122.desc.not_disappointing: "[distant_title.GetBaseNameNoTooltip] je přesně takové, jak jsem doufal[Select_CString(ROOT.Char.IsFemale,'a','')]! Toto podivné místo kypí lidmi a rozsáhlou civilizací. Tržiště přetékají jídlem a celé město žije hovorem."
 legend_spread_events.8122.desc.slightly_disappointing: "[distant_title.GetBaseNameNoTooltip] není úplně takové, jak mi bylo slíbeno. Je to sice působivé sídlo, ale řekami neteče mléko ani med a bohatství místní šlechty se nezdá nijak nepředstavitelné."
 legend_spread_events.8122.desc.somewhat_disappointing: "nemohu se ubránit zklamání. Je to sice naprosto obstojné sídlo, ale pokud je tohle to nejlepší, co [distant_title.GetBaseNameNoTooltip] nabízí, pak byla jeho nádhera značně přehnaná."
 legend_spread_events.8122.desc.bridge: "\n\nZamířím k domu, o němž se domnívám, že patří nějaké šlechtické rodině, a přivítá mě"
 legend_spread_events.8122.desc.outro.same_culture: "podivně povědom[Select_CString(distant_courtier.IsFemale,'á','ý')] [Select_CString(distant_courtier.IsFemale,'žena','muž')]. [distant_courtier.GetName|U] se představí dokonalou [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] a žádá vědět, co chci od dvora [distant_liege.GetName]."
 legend_spread_events.8122.desc.outro.same_religion: "[Select_CString(distant_courtier.IsFemale,'žena','muž')] vyznávající [ROOT.Char.GetFaith.GetReligion.GetAdherentNameNoTooltip]! Zdá se, že i zde se [ROOT.Char.GetFaith.HighGodName|U] dostává náležité úcty. [distant_courtier.GetFirstNameNoTooltip] chce vědět, kdo jsem a co mě přivedlo tak daleko."
 legend_spread_events.8122.desc.outro.fallback: "podivně působící [Select_CString(distant_courtier.IsFemale,'šlechtična','šlechtic')]. Mé vznešené vystupování mě zjevně předchází, protože [distant_courtier.GetFirstNameNoTooltip] chce okamžitě vědět, kdo jsem a co mě sem přivádí."
 legend_spread_events.8122.a: "Chci vidět, jak se zde bojuje."
 legend_spread_events.8122.b: "Dovol mi povědět tvému pánovi o [legend.GetName]."
 legend_spread_events.8122.b.success: "Tvá legenda je podmanivá"
 legend_spread_events.8122.b.failure: "[distant_liege.GetFirstName] se nudí"
 legend_spread_events.8122.c: "Nemáš pro mě nějaký dar?"
 legend_spread_events.8124.t: "Daleké kraje: Porážka"
 legend_spread_events.8124.desc: "Ačkoli jsem bojoval[Select_CString(ROOT.Char.IsFemale,'a','')] statečně, zdá se, že na bojový styl válečníka z [distant_title.GetAdjective] nestačím. I přes porážku už samotný fakt, že jsem v této tajemné zemi zkřížil[Select_CString(ROOT.Char.IsFemale,'a','')] zbraně s cizincem, posílí mou legendární pověst."
 legend_spread_events.8124.a: "Běda."
 legend_spread_events.8125.t: "Daleké kraje: Vítězství"
 legend_spread_events.8125.desc: "Můj protivník bojoval způsobem, jaký jsem nikdy předtím neviděl[Select_CString(ROOT.Char.IsFemale,'a','')], a přestože mě zpočátku zaskočil, nakonec jsem zvítězil[Select_CString(ROOT.Char.IsFemale,'a','')]. Příběhy o mém vítězství nad válečníkem z [distant_title.GetAdjective] se bezpochyby rozšíří široko daleko."
 legend_spread_events.8125.a: "Nádhera."
 legend_spread_events.8125.b: "Přidej se ke mně!"
 legend_spread_events.8130.t: "Andělské ustanovení"
 legend_spread_events.8130.desc: "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] za mnou přichází se zprávami o [legend.GetName]. Podle [chronicler.GetFirstNameNoTooltip] existuje několik záznamů dosvědčujících, že [founder.GetName] nebyl[Select_CString(founder.IsFemale,'a','')] pouhým [founder.GetTitleAsNameNoTooltip]. Právo vládnout [legend_title.GetName] totiž [Select_CString(founder.IsFemale,'jí','mu')] svěřil anděl.\n\nTento posel z [ROOT.Char.GetFaith.PositiveAfterLife] slíbil, že rod [ROOT.Char.GetHouse.GetNameNoTooltip] bude navěky vládnout [legend_title.GetName] a na zemi naplňovat vůli [ROOT.Char.GetFaith.HighGodNamePossessive]. Je to neuvěřitelné tvrzení, ale pokud mu uvěří dost lidí, nikdo nebude zpochybňovat mou vládu."
 legend_spread_events.8130.a: "Je to pravda."
 legend_spread_events.8130.a.win: "Tvé tvrzení zní věrohodně"
 legend_spread_events.8130.a.lose: "Tvé tvrzení je považováno za kacířství"
 legend_spread_events.8130.b: "Ne, tohle je kacířství."
 legend_spread_events.8141.t: "Legendární vítězství"
 legend_spread_events.8141.desc: "Když se vojsko [enemy_commander.GetNamePossessive] dává na útěk, nezbývá mi než se kochat vlastní slávou. Všude kolem leží rozervané prapory a hnijící těla těch, kteří se mi postavili. Vedle mě leží voják, naříká bolestí a ruce má zkrvavené vlastními vnitřnostmi. Zhluboka se nadechnu štiplavého vzduchu prosyceného smrtí. Vůně vítězství.\n\nO výsledku této bitvy bezpochyby rozhodla má vlastní [Concept('prowess','udatnost')|E] v boji a mé schopnosti velitele. Tohle je bitva, která mé jméno jistě proslaví."
 legend_spread_events.8141.a: "Legenda hodná vyprávění."
 legend_spread_events.8141.b: "Tohle byla předzvěst věcí příštích."
 legend_spread_events.8150.t: "Trvalá stopa"
 legend_spread_events.8150.desc: "Během hostiny si všimnu, že [intrigued_guest.Custom2('MyCharacterIntroduction', ROOT.Char)] upřeně zírá na [ROOT.Char.Custom('GetInjuredBodyPart')], bezpochyby zaujat[Select_CString(intrigued_guest.IsFemale,'á','ý')] mým [ROOT.Char.Custom('PermanentInjuryAdjective')].\n\nJakmile dám najevo, že jsem si toho všiml[Select_CString(ROOT.Char.IsFemale,'a','')], [intrigued_guest.GetFirstNameNoTooltip] rychle odvrátí pohled, zjevně v rozpacích, že byl[Select_CString(intrigued_guest.IsFemale,'a','')] přistižen[Select_CString(intrigued_guest.IsFemale,'a','')] při zírání na mou deformaci. Jeho fascinace mě sice poněkud uráží, zároveň mi ale dává příležitost povyprávět, jak přesně jsem k tomuto zranění přišel[Select_CString(ROOT.Char.IsFemale,'a','')]."
 legend_spread_events.8150.a: "„Zranil[Select_CString(ROOT.Char.IsFemale,'a','')] jsem se v boji s mocnou bestií!“"
 legend_spread_events.8150.b: "„Při boji za [ROOT.Char.GetFaith.HighGodName|U] mě napadli nevěřící.“"
 legend_spread_events.8150.c: "„Tenhle příběh si vezmu do hrobu.“"
 legend_spread_events.8150.d: "„Nemáš žádné vychování? Nezírej!“"
 legend_spread_events.8160.t: "Legendární láska"
 legend_spread_events.8160.desc: "Srdce se mi zachvěje při pouhé vzpomínce na [soulmate.GetFirstNameNoTooltip] a i když sedím o samotě ve [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'tent', 'study')], nejraději bych o naší lásce zpíval[Select_CString(ROOT.Char.IsFemale,'a','')] každému, kdo by naslouchal. [ROOT.Char.Custom('WritingInstrument')] klouže po stránce a mé city proudí inkoustem rychleji, než je stačím zapisovat.\n\nKdyž plním stránku chválou na [soulmate.GetFirstNameNoTooltip], napadne mě, že bych naši lásku mohl[Select_CString(ROOT.Char.IsFemale,'a','')] zvěčnit prostřednictvím [legend.GetName]! Příběh se sice soustředí na mě, ale získat srdce mého krásného [soulmate.Custom('PetName')] by bylo skvělým doplněním legendy."
 legend_spread_events.8160.a: "Společně se staneme legendami."
 legend_spread_events.8160.b: "Ne, ten příběh patří jen mně."
 legend_spread_events.8170.t: "Komu zvoní hrana"
 legend_spread_events.8170.desc.intro: "Jednoho večera se uchýlím do svých komnat, vyčerpan[Select_CString(ROOT.Char.IsFemale,'á','ý')] a znaven[Select_CString(ROOT.Char.IsFemale,'á','ý')] dalším dnem plným nudy a jednotvárnosti. Když už se propadám do spánku, náhle mě probudí pronikavé skřípění kovu o kámen.\n\nTrhnu sebou a na kraji postele spatřím stínovou postavu. Z temnoty jasně rozeznávám jen zubatý úsměv [ROOT.Char.GetFaith.DeathDeityName]. Nemohu se pohnout, jen zírám, jak ke mně smrt kráčí s dýkou v ruce.\n\nPak se náhle probudím znovu."
 legend_spread_events.8170.desc.mid.taoist: "Je to jasné znamení, že mé energie nejsou v harmonii s [ROOT.Char.GetFaith.HighGodName|U]."
 legend_spread_events.8170.desc.mid.reincarnation: "Můj duch bude jednoho dne pokračovat v koloběhu převtělování, ale ještě nejsem připraven[Select_CString(ROOT.Char.IsFemale,'á','ý')]."
 legend_spread_events.8170.desc.mid.fallback: "Touto návštěvou si mě [ROOT.Char.GetFaith.DeathDeityName|U] označil[Select_CString(ROOT.Char.IsFemale,'a','')]."
 legend_spread_events.8170.desc.outro: "Obávám se, že si pro mě [ROOT.Char.GetFaith.DeathDeityName|U] přijde už velmi brzy. Takový osud musím změnit!"
 legend_spread_events.8170.a: "Musím se stát nesmrtelným[Select_CString(ROOT.Char.IsFemale,'ou','')]."
 legend_spread_events.8170.b.chess: "[ROOT.Char.GetFaith.DeathDeityName|U] si nejspíš jen chtěl zahrát šachy."
 legend_spread_events.8170.b.fallback: "Byl to sen. Nic víc, vůbec nic víc."
 legend_spread_events.8171.t: "Ozvěny budoucnosti"
 legend_spread_events.8171.desc: "Když držím své novorozené dítě v náručí, nemohu si nevšimnout, jak moc v jeho tváři vidím tu svou. Všichni mi říkají, že [child.GetFirstNameNoTooltip] vypadá přesně jako já, a mají pravdu.\n\nMožná právě tohle je nesmrtelnost, kterou jsem hledal[Select_CString(ROOT.Char.IsFemale,'a','')]: někdo, kdo ponese můj odkaz dál a bude pokračovat v mém příběhu, až tu nebudu."
 legend_spread_events.8171.a: "Příběh nikdy nekončí."
 legend_spread_events.8172.t: "Jaký je můj smysl?"
 legend_spread_events.8172.desc: "Všude kolem mě je tma. Jen kdesi vpředu v dálce září osamělé světlo. Jako by mě vedl instinkt, kráčím prázdnotou k jedinému světlému bodu, dokud mě nepřivítá osamělá postava celá oděná v bílém, která vypadá jako starší verze mě samotného.\n\nPostava se na mě usměje s vřelostí, jakou dokáže dát jen [Select_CString(ROOT.Char.IsFemale,'matka','otec')], a vybídne mě, abych si přisedl[Select_CString(ROOT.Char.IsFemale,'a','')]. V její blízkosti mě zalije nevysvětlitelná radost a pokoj.\n\n„Víš, proč jsem učinil smrtelníky smrtelnými, [ROOT.Char.GetFirstNameNoTooltip]? Právě to tě ode mě odlišuje. Víš, jak vzácný je život. Věčnost v [ROOT.Char.GetFaith.PositiveAfterLife] tě čeká, ale zatím tam dole stále jsou lidé, kteří čekají na tebe.“"
 legend_spread_events.8172.a: "„Už to chápu. Konečně to chápu.“"
 legend_spread_events.8172.b: "„Ne! Já #EMP budu#! žít navěky!“"
 legend_spread_events.8172.c: "„Myslím, že teď už jsem připraven[Select_CString(ROOT.Char.IsFemale,'á','ý')].“"
 legend_spread_events.8172.a.flavor: "Probouzíš se jako změněný[Select_CString(ROOT.Char.IsFemale,'á','ý')] člověk!"
 legend_spread_events.8172.b.flavor: "Probouzíš se plný[Select_CString(ROOT.Char.IsFemale,'á','')] nových sil."
 legend_spread_events.8172.c.flavor: "Rozhodneš se v tichosti odejít."
 legend_spread_events.8180.t: "Spravedlivá pomsta"
 legend_spread_events.8180.desc: "V poslední době mě sužují bezesné noci, během nichž stále vzpomínám, jak [dead_parent.Custom2('MyCharacterIntroduction', ROOT.Char)] [dead_parent.GetDeathReason]. Jak může člověk věřit ve spravedlnost, když [killer.GetFirstNameNoTooltip] žije, zatímco [dead_parent.GetFirstNameNoTooltip] musel[Select_CString(dead_parent.IsFemale,'a zemřít',' zemřít')]?\n\nJen pomyšlení na to, jak si [killer.GetFirstNameNoTooltip] dál vykračuje po světě a dýchá, mi vaří krev. Nejraději bych tomu jednou provždy učinil[Select_CString(ROOT.Char.IsFemale,'a přítrž',' přítrž')]."
 legend_spread_events.8180.a: "[killer.GetNameNoTooltip] je můj nepřítel."
 legend_spread_events.8180.b: "Musím se naučit odpouštět."
 8180_bonus_if_you_kill_tt: "Kvalita tvé legendy se výrazně zvýší, pokud zavraždíš [killer.GetName]"
 legend_spread_events.8181.t: "[killer.Custom2('InsultNoun'), ROOT.Char|U] pod drnem"
 legend_spread_events.8181.desc.intro: "Konečně [killer.GetName] naposledy vydechl[Select_CString(killer.IsFemale,'a','')] a já si mohu úlevně oddechnout, protože [killer.GetFirstNameNoTooltip] už svou přítomností neposkvrňuje tento svět."
 legend_spread_events.8181.desc.mid.murder: "Dopravit [killer.GetFirstNameNoTooltip] vlastníma rukama do [ROOT.Char.GetFaith.NegativeAfterLife] je pro mě velká čest."
 legend_spread_events.8181.desc.mid.fallback: "Doufal[Select_CString(ROOT.Char.IsFemale,'a jsem, že toho',' jsem, že toho')] [killer.Custom2('InsultNoun', ROOT.Char)] zabiju vlastní rukou, ale zdá se, že [ROOT.Char.GetFaith.HighGodName] měl s [killer.Custom2('InsultNoun', ROOT.Char)] vlastní plány."
 legend_spread_events.8181.desc.outro: "\n\nMám pocit, že [dead_parent.Custom2('MyCharacterIntroduction', ROOT.Char)] teď konečně může pokojně spočinout a svět je zase takový, jaký má být."
 legend_spread_events.8181.a: "Konečně spravedlnost."
 legend_spread_events.8190.t: "Když tě vychová [ROOT.Char.MakeScope.Var('animal_type').GetFlagName|U]"
 legend_spread_events.8190.desc: "Jednoho pozdního večera pohodlně sedím ve své pracovně a vyprávím [legend.GetName] [chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)], když mě náhle něco napadne. Lidé mého postavení mě často označují za „podivína“. Je na mně zkrátka něco, kvůli čemu si ke mně ostatní jen těžko hledají cestu.\n\nZ raného dětství si toho mnoho nevybavuji, ale odjakživa cítím silné pouto k ušlechtilému [ROOT.Char.MakeScope.Var('animal_type').GetFlagName], téměř jako člověk ke své matce či otci. Rázem se postavím a [chronicler.GetNameNoTooltip] upustí [chronicler.Custom('WritingInstrument')]. Mám odvahu něco takového tvrdit? Mám snad prohlásit, že mě vychoval [ROOT.Char.MakeScope.Var('animal_type').GetFlagName]?"
 legend_spread_events.8190.a: "Mám!"
 legend_spread_events.8190.a.win: "[chronicler.GetFirstNameNoTooltip] je [Select_CString(chronicler.Char.IsFemale,'přesvědčena','přesvědčen')]"
 legend_spread_events.8190.a.lose: "Něco se ztratilo v překladu"
 legend_spread_events.8190.a.crit_lose: "[chronicler.GetFirstNameNoTooltip] se ti zřejmě vysmívá"
 legend_spread_events.8190.b: "Nemám."
 you_find_the_tome_tt: "Najdeš svazek"
 you_fail_to_find_the_tome_tt: "Svazek se ti nepodaří najít"
 you_destroy_the_tome_tt: "Svazek je zničen"
 major_legend_quality_decrease_tt: "Sleva na vylepšení tvé [Concept('legend','legendy')|E] se výrazně #difficulty_hard sníží#!"
 medium_legend_quality_decrease_tt: "Sleva na vylepšení tvé [Concept('legend','legendy')|E] se #difficulty_hard sníží#!"
 minor_legend_quality_decrease_tt: "Sleva na vylepšení tvé [Concept('legend','legendy')|E] se mírně #difficulty_hard sníží#!"
 major_legend_quality_increase_tt: "Sleva na vylepšení tvé [Concept('legend','legendy')|E] se výrazně #difficulty_easy zvýší#!"
 medium_legend_quality_increase_tt: "Sleva na vylepšení tvé [Concept('legend','legendy')|E] se #difficulty_easy zvýší#!"
 minor_legend_quality_increase_tt: "Sleva na vylepšení tvé [Concept('legend','legendy')|E] se mírně #difficulty_easy zvýší#!"
 legend_quality_if_wins_tt: "Pokud vyhraješ souboj, sleva na vylepšení tvé [Concept('legend','legendy')|E] se #difficulty_easy zvýší#!"
 friend_legendary_tale: "[CHARACTER.GetShortUIName|U] vyprávěl[Select_CString(CHARACTER.IsFemale,'a','')] [TARGET_CHARACTER.GetShortUIName] legendární příběh."
 friend_legendary_tale_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] vyprávěl[Select_CString(TARGET_CHARACTER.IsFemale,'a','')] [CHARACTER.GetShortUIName] legendární příběh."
 ancient_culture_tome: "Svazek [promoted_legend.GetProperty('culture').Culture.GetNameNoTooltip|U] kultury"
 ancient_culture_tome_desc: "Tento prastarý svazek zřejmě dokládá, že [promoted_legend.GetProperty('culture').Culture.GetCollectiveNoun] a [ROOT.Char.GetCulture.GetCollectiveNoun] byli nějakým způsobem propojeni."
 ancient_culture_artifact: "Řezba [promoted_legend.GetProperty('culture').Culture.GetNameNoTooltip|U] kultury"
 ancient_culture_artifact_desc: "Prastará řezba zvířete, kterou vytvořili staří [promoted_legend.GetProperty('culture').Culture.GetCollectiveNoun]. Je vybledlá a sotva rozeznatelná, ale držet v ruce kousek minulosti v člověku probouzí pocit jakéhosi spojení s ní."
 legend_chapter_punched_animal_great: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] se vrhl[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] proti [Localize( beast )] se zaťatou pěstí a jediným strašlivým úderem do lebky proměnil[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] bestii v hromadu krvavých ostatků."
 legend_chapter_punched_animal_good: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] byl[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a přepadena',' přepaden')] [Localize( beast )] a svedl[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] s bestií boj zblízka. Přestože útok přišel znenadání, [ROOT.Legend.GetProtagonist.GetNameNoTooltip] skolil[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] tvora pouhýma holýma rukama."
 legend_chapter_punched_animal_bad: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] byl[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a přepadena',' přepaden')] [Localize( beast )] a svedl[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] s bestií boj zblízka. Nakonec sice musela[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,' být zachráněna','')] zasáhnout lovecká družina, přesto byla bestie sražena k zemi a zabita."
 legend_chapter_punched_animal_very_bad: "K naprostému údivu své lovecké družiny se [ROOT.Legend.GetProtagonist.GetNameNoTooltip] odtrhl[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] od ostatních a vrhl[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] se na [Localize( beast )], aby zaútočil[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] na nejchoulostivější části jeho těla. Teprve poté, co [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ohrozila celou družinu a uvrhla sama sebe v hanbu','ohrozil celou družinu a uvrhl sám sebe v hanbu')], byla bestie konečně zabita."
 legend_chapter_person_of_lake_great: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] spatřil[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')], jak se z vod vynořuje bytost z onoho světa, [ROOT.Legend.GetProtagonist.GetFaith.PositiveAfterLife]. [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Promluvila s ní a bylo jí svěřeno','Promluvil s ní a bylo mu svěřeno')] [ROOT.Legend.GetProtagonist.GetFaith.HighGodNamePossessive] poslání."
 legend_chapter_person_of_lake_good: "Při putování mokřinami se [ROOT.Legend.GetProtagonist.GetNameNoTooltip] setkal[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] s mocnou a moudrou bytostí přebývající ve vodách, od níž obdržel[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] božské poslání."
 legend_chapter_person_of_lake_bad: "Když [ROOT.Legend.GetProtagonist.GetNameNoTooltip] bloudil[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] krajinou v horečnatém mámení po požití nečisté vody, zjevila se [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí','mu')] vidina krásné a moudré postavy, která [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí','mu')] ukázala cestu k údajnému kouzelnému údělu."
 legend_chapter_person_of_lake_very_bad: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] narazil[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] na zuboženého starého poustevníka, jemuž pěna stála u úst a který chrlil proroctví na každého, kdo byl ochoten naslouchat. [ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] vzal[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] slova tohoto obyvatele močálů za pravdu a učinil[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] z nich svůj osud."
 legend_chapter_great_battle: "Vojsko [ROOT.Legend.GetProtagonist.GetNamePossessive|U] sevřela armáda pod velením [ROOT.Legend.MakeScope.Var('8141_commander').Char.GetNameNoTooltip]. Bitva byla dlouhá a krvavá a vyžádala si bezpočet životů, avšak [ROOT.Legend.GetProtagonist.GetNameNoTooltip] z ní nakonec vyšel[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] vítězně, zatímco prapory i zbraně rudly krví nepřátel."
 legend_chapter_battled_mighty_beast_good: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] se statečně postavil[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] mohutné a strašlivé bestii a zvítězil[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')], avšak zápas zanechal na těle trvalou stopu."
 legend_chapter_battled_mighty_beast_bad: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] se rozhodl[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] napadnout mocnou bestii, avšak marný podnik skončil trvalým zraněním."
 legend_chapter_injured_evangelising_good: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] neohroženě šířil[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] víru mezi kacíři a nevěřícími, dokud [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nebyla pro svou víru napadena a navždy zohavena','nebyl pro svou víru napaden a navždy zohaven')]."
 legend_chapter_injured_evangelising_bad: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] kázal[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] mezi rolníky kacířství a za své řeči utrpěl[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] zranění rukou pravověrných."
 legend_chapter_mysterious_injury: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] [ROOT.Legend.GetProtagonist.Custom('GainedPermanentInjury')] za okolností zahalených tajemstvím. Následek byl nesmazatelný: [ROOT.Legend.GetProtagonist.Custom('PermanentInjuryAdjective')]. Co se onoho dne skutečně přihodilo, neví dodnes nikdo kromě [ROOT.Legend.GetProtagonist.GetNameNoTooltip]."
 legend_chapter_love: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] získal[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] srdce své životní lásky, [ROOT.Legend.MakeScope.Var('8160_soulmate').Char.GetNameNoTooltip]. Při všech velikých činech vykonaných pro druhé stál[Select_CString(ROOT.Legend.MakeScope.Var('8160_soulmate').Char.IsFemale,'a','')] [ROOT.Legend.MakeScope.Var('8160_soulmate').Char.GetFirstNameNoTooltip] po boku [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] a říká se, že jejich láska byla darem od [ROOT.Legend.GetProtagonist.GetFaith.FertilityGodName]."
 legend_chapter_immortal: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] byl[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] jedné noci vytržen[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] ze spánku děsivou návštěvou: [ROOT.Legend.GetProtagonist.GetFaith.DeathDeityName|U]. Od onoho hrůzného zjevení se [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] rozhodl[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] prchnout před tím, co ostatní nazývají nevyhnutelným, a hledat věčný život na tomto světě."
 legend_chapter_immortal_child_conclusion: "Obavy [ROOT.Legend.GetProtagonist.GetNamePossessiveNoTooltip|U] z věčnosti, již slibuje [ROOT.Legend.GetProtagonist.GetFaith.PositiveAfterLife|U], utišilo jednou provždy narození [ROOT.Legend.MakeScope.Var('8171_child').Char.GetNameNoTooltip]. [ROOT.Legend.MakeScope.Var('8171_child').Char.Custom('GetDaughterSon')|U] — nové pokračování rodu a příběhu. V novorozeném dítěti spatřil[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] vlastní budoucnost i nesmrtelnost svého odkazu."
 legend_chapter_accept_mortality_conclusion: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] zakusil[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] zjevení [ROOT.Legend.GetProtagonist.GetFaith.CreatorName], během něhož zazněla slova o podstatě stvoření a kráse života, jenž není věčný. Z tohoto legendárního setkání vyšel[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a proměněná',' proměněný')], smířen[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'á','')] s pomíjivostí života i pokojem, který skýtá [ROOT.Legend.GetProtagonist.GetFaith.PositiveAfterLife|U]."
 legend_chapter_confronted_creator_conclusion: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] zakusil[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] zjevení [ROOT.Legend.GetProtagonist.GetFaith.CreatorName], během něhož zazněla slova o podstatě stvoření a kráse života, jenž není věčný. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] však vzdoroval[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] i vlastnímu stvořiteli a přísahal[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')], že ve své pouti za nesmrtelností neustane."
 legend_chapter_revenge_quest: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] přísahal[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] pomstu [ROOT.Legend.MakeScope.Var('8180_revenge_quest').Char.GetNameNoTooltip] za vraždu vlastního rodiče. Ve jménu všeho, co je na tomto světě spravedlivé a řádné, pojal[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] [ROOT.Legend.GetProtagonist.GetNameNoTooltip] za svůj úděl přivést tohoto ničemu před soud."
 legend_chapter_revenge_quest_complete: "Nakonec byl[Select_CString(ROOT.Legend.MakeScope.Var('8180_revenge_quest').Char.IsFemale,'a','')] [ROOT.Legend.MakeScope.Var('8180_revenge_quest').Char.GetNameNoTooltip] rukou [ROOT.Legend.GetProtagonist.GetNameNoTooltip] zabit[Select_CString(ROOT.Legend.MakeScope.Var('8180_revenge_quest').Char.IsFemale,'a','')] a odeslán[Select_CString(ROOT.Legend.MakeScope.Var('8180_revenge_quest').Char.IsFemale,'a','')] do [ROOT.Legend.GetProtagonist.GetFaith.NegativeAfterLife]."
 legend_chapter_revenge_quest_divine_justice: "Zdálo se, že [ROOT.Legend.GetProtagonist.GetFaith.HighGodName|U] sdílí úsudek [ROOT.Legend.GetProtagonist.GetNamePossessive]. [ROOT.Legend.MakeScope.Var('8180_revenge_quest').Char.GetNameNoTooltip] byl[Select_CString(ROOT.Legend.MakeScope.Var('8180_revenge_quest').Char.IsFemale,'a zbavena života a uvržena',' zbaven života a uvržen')] do [ROOT.Legend.GetProtagonist.GetFaith.NegativeAfterLife] samotným božským zásahem."
 legend_chapter_raised_by_animal: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] se jako dítě ztratil[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] a náhradním rodičem se [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí','mu')] stalo zvíře — [ROOT.Legend.MakeScope.Var('animal_parent').GetFlagName]. Mnozí se domnívají, že právě zde má původ údajná podivínskost [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]."
 legend_chapter_forged_own_path: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] věděl[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')], že nadcházející pouť bude plná nebezpečí, avšak cesta byla vytýčena od samého počátku. Bez jediného zaváhání si [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] určil[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] směr i cíl a nechal[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'a','')] se vést jedině silou vlastní vůle."
 possessed_artifact_desc: "[witchy_artifact.GetDesc]\n\nUvnitř je spoután mocný zlý duch, jehož do předmětu uvěznila mocná čarodějnice."
 infidel_artifact_desc: "[infidel_weapon.GetDesc]\n\nTato zbraň byla užita v [memory.GetName], kde před ní padlo tisíc duší. Všichni byli [memory.loser.GetFaith.GetAdherentNamePluralNoTooltip]."
 ce1_battle_artifact_desc: "[infidel_weapon.GetDesc]\n\nDo této zbraně byl vyryt popis [memory.GetName]."
