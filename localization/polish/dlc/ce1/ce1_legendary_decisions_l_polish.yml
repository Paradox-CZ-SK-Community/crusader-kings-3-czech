 legend_demand_fealty: "Požadovat místní podrobení"
 legend_demand_fealty_desc: "Má legenda o hrdinských činech je známá široko daleko. Už stojím nad pouhými smrtelníky; jsem živoucí legenda a všichni přede mnou musí sklonit hlavu."
 legend_demand_fealty_tooltip: "$fifteen_year_vassalization_tt$"
 legend_demand_fealty_confirm: "Všichni přede mnou skloní hlavu."
 launch_a_legendary_adventure: "Vypravit se na legendární výpravu"
 launch_a_legendary_adventure_desc: "Zdá se, že má zdejší legenda dospěla ke konci, ale než odejdu z tohoto světa, stále toužím po dalších velkých činech. Tam venku toho musí být víc a já hodlám zanést svou legendu až do dalekých a bájných krajů!"
 launch_a_legendary_adventure_tooltip: "$launch_a_legendary_adventure_tt$"
 launch_a_legendary_adventure_confirm: "Legenda nikdy nekončí!"
 legendary_integration_e: "Povznést panství"
 legendary_integration_e_desc: "Po celém panství se vyprávějí legendy, které upevňují autoritu mé vlády. Mé slovo je zákonem, a kdybych [Select_CString(ROOT.Char.IsFemale,'prohlásila','prohlásil')], že dvě říše jsou jedinou, stalo by se tak."
 legendary_integration_e_tooltip: "$select_empire_to_drift_tt$"
 legendary_integration_e_confirm: "Má vůle se stane skutečností."
 control_the_entirety_of_title_empire_tt: "Musíš ovládat celou [Concept('empire','říši')|E]"
 legendary_integration_k: "Upevnit panství"
 legendary_integration_k_desc: "Po celém panství se vyprávějí legendy, které upevňují autoritu mé vlády. Mé slovo je zákonem, a kdybych [Select_CString(ROOT.Char.IsFemale,'prohlásila','prohlásil')], že dvě království jsou jediným, stalo by se tak."
 legendary_integration_k_tooltip: "$select_kingdom_to_drift_tt$"
 legendary_integration_k_confirm: "Má vůle se stane skutečností."
 control_the_entirity_of_title_tt: "Musíš ovládat celé [Concept('kingdom','království')|E]"
 legendary_integration_d: "Rozšířit panství"
 legendary_integration_d_desc: "Po celém panství se vyprávějí legendy, které upevňují autoritu mé vlády. Tuto nově nabytou legitimitu mohu využít k rozšíření území považovaného za samotné jádro mého panství a vyžádat si trvalou lenní přísahu od vládce historicky cizího vévodství."
 legendary_integration_d_tooltip: "$select_duchy_to_drift_tt$"
 legendary_integration_d_confirm: "Má vůle se stane skutečností."
 legendary_holy_war: "Znovu prosadit svaté poslání"
 legendary_holy_war_desc: "Má legendární pouť zbožnosti dospěla ke konci, a přestože ji pravověrní velebí, srdce nevěřících téměř neobměkčila. Musíme dál šířit své mírumilovné způsoby jediným způsobem, který známe: mečem."
 legendary_holy_war_tooltip: "$bonus_holy_war_tt$"
 legendary_holy_war_confirm: "Korouhev spravedlnosti se pozvedá!"
 legendary_pacifism_spread: "Hlásat pacifismus"
 legendary_pacifism_spread_desc: "Zbožná vyprávění se rozšířila daleko za mé hranice a uchvátila srdce nevěřících. Naše příběhy o míru a soužití otřásají přesvědčením hašteřivých válečníků za našimi hranicemi a s trochou pobídky tito barbaři jistě pochopí hodnotu života bez násilí."
 legendary_pacifism_spread_tooltip: "$legendary_pacifism_spread_tt$"
 legendary_pacifism_spread_confirm: "Mír zvítězí!"
 legendary_conversion: "Obrátit panství na svou víru"
 legendary_conversion_desc: "Legendární příběh zbožnosti a oddanosti uchvátil srdce lidí v celém panství. Stačí trochu povzbuzení a i zdejší nevěřící mohou přijmout mou víru."
 legendary_conversion_tooltip: "$legendary_conversion_tt$"
 legendary_conversion_confirm: "Pravá víra zvítězí."
 ce1_decision_events.1020.conversion: "[liege_convert.GetFirstName] přijímá novou víru!"
 ce1_decision_events.1000.t: "Legendární začlenění"
 ce1_decision_events.1000.desc: "Jako [ROOT.Char.GetTitleAsNameNoTooltip|U] velkého věhlasu držím ve svém panství mnoho titulů. Ne všechny však [ROOT.Char.GetPrimaryTitle.GetName] zahrnuje, přestože má správa se na nich nepochybně podepsala.\n\nNyní, když má pověst dosáhla legendárních rozměrů, má mé slovo ohromnou váhu a jen málokdo by se mi odvážil odporovat. Kdyby z mých úst zaznělo, že den je nocí, bylo by to tak zapsáno. A kdyby stejně tak zaznělo, že [kingdom_01.GetName] právoplatně náleží k [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], i to by bylo zapsáno jako pravda."
 ce1_decision_events.1000.a.empire: "[kingdom_01.GetNameNoTooltip] je odteď součástí mé říše!"
 ce1_decision_events.1000.a.kingdom: "[kingdom_01.GetNameNoTooltip] přestává existovat."
 ce1_decision_events.1000.b.empire: "[kingdom_02.GetNameNoTooltip] mou říši znamenitě doplní."
 ce1_decision_events.1000.b.kingdom: "[kingdom_02.GetNameNoTooltip] nakonec žádným skutečným panstvím není."
 ce1_decision_events.1000.c.empire: "[kingdom_03.GetNameNoTooltip] je lepší volba."
 ce1_decision_events.1000.c.kingdom: "[kingdom_03.GetNameNoTooltip] bude navždy součástí mého panství."
 ce1_decision_events.1000.d: "Volím [kingdom_04.GetNameNoTooltip]."
 ce1_decision_events.1000.e: "Lepší přírůstek než [kingdom_05.GetNameNoTooltip] si nedovedu představit."
 ce1_decision_events.1000.f: "Bude to [kingdom_06.GetNameNoTooltip]."
 ce1_decision_events.1010.t: "$ce1_decision_events.1000.t$"
 ce1_decision_events.1010.desc: "Má pověst coby [ROOT.Char.GetTitleAsNameNoTooltip|U] dosáhla legendárních rozměrů a mé jméno je opěvováno v mém panství i za jeho hranicemi.\n\nBudoucnost zemí jako [duchy_01.GetName] zůstává nejistá: není jasné, zda je má [ROOT.Char.GetPrimaryTitle.GetName] zahrnovat, nebo nikoli. Má obliba je však na vrcholu a postavení těchto titulů se stále mění, takže mohu svou legendární pověst využít k tomu, abych tuto otázku jednou provždy [Select_CString(ROOT.Char.IsFemale,'rozhodla','rozhodl')]."
 ce1_decision_events.1010.a: "Připojím [duchy_01.GetNameNoTooltip]!"
 ce1_decision_events.1010.b: "[duchy_02.GetNameNoTooltip] mé panství znamenitě doplní."
 ce1_decision_events.1010.c: "[duchy_03.GetNameNoTooltip] je lepší volba."
 ce1_decision_events.1010.d: "[duchy_04.GetNameNoTooltip] je volba má."
 ce1_decision_events.1010.e: "Lepší přírůstek než [duchy_05.GetNameNoTooltip] si nedovedu představit."
 ce1_decision_events.1010.f: "Bude to [duchy_06.GetNameNoTooltip]."
 ce1_decision_events.1015.t: "$ce1_decision_events.1000.t$"
 ce1_decision_events.1015.desc: "Jako [ROOT.Char.GetTitleAsNameNoTooltip|U] velkého věhlasu držím ve svém panství mnoho titulů. Ne všechny však [ROOT.Char.GetPrimaryTitle.GetName] zahrnuje, přestože má správa se na nich nepochybně podepsala.\n\nNyní, když má pověst dosáhla legendárních rozměrů, má mé slovo ohromnou váhu a jen málokdo by se mi odvážil odporovat. Kdyby z mých úst zaznělo, že den je nocí, bylo by to tak zapsáno. A kdyby stejně tak zaznělo, že [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] právoplatně zahrnuje [empire_01.GetDefinitiveName], i to by se stalo pravdou."
 ce1_decision_events.1015.a: "Připojím [empire_01.GetNameNoTooltip]!"
 ce1_decision_events.1015.b: "[empire_02.GetNameNoTooltip] mou říši znamenitě doplní."
 ce1_decision_events.1015.c: "[empire_03.GetNameNoTooltip] je lepší volba."
 ce1_decision_events.1015.d: "Volím [empire_04.GetNameNoTooltip]."
 ce1_decision_events.1015.e: "Lepší přírůstek než [empire_05.GetNameNoTooltip] si nedovedu představit."
 ce1_decision_events.1015.f: "Bude to [empire_06.GetNameNoTooltip]."
 ce1_decision_events.1020.t: "Mír pro naši dobu"
 ce1_decision_events.1020.desc: "Příběhy o [Select_CString(legendary_character.IsFemale,'válečnici, která řeší spory nikoli čepelí, nýbrž slovy a rozumem','válečníkovi, který řeší spory nikoli čepelí, nýbrž slovy a rozumem')] si získaly nesmírnou oblibu po celém panství. Ačkoli [ROOT.Char.GetFaith.HighGodName|U] stojí v centru mých modliteb a [ROOT.Char.GetFaith.GetName] určuje jejich tradiční podobu, nemohu popřít, že na mě tento příběh, v němž [legendary_character.GetFaith.GetName] hraje tak významnou roli, přece jen zapůsobil.\n\nTeď celé mé panství hovoří o této legendární postavě a o moci míru, kterou [legendary_character.GetFaith.GetName] této postavě propůjčuje. U dvora mě osloví kazatel, jehož domovem je [legendary_character.GetPrimaryTitle.GetName] a jehož vírou je [legendary_character.GetFaith.GetName]. Možná je to má příležitost přijmout pokojnější způsob života."
 ce1_decision_events.1020.a: "Odkládám zbraň."
 ce1_decision_events.1020.b: "Vyžeňte toho kacíře z mého dvora."
 ce1_decision_events.1021.t: "Legendární obrácení"
 ce1_decision_events.1021.desc: "Příběhy o [Select_CString(legendary_character.IsFemale,'válečnici, která řeší spory nikoli čepelí, ale svými slovy a rozumem','válečníkovi, který řeší spory nikoli čepelí, ale svými slovy a rozumem')] si získaly nesmírnou oblibu po celém panství. Vyprávění o [legendary_character.GetName|U] zasáhlo srdce mnohých. [liege_convert.Custom2('MyCharacterIntroduction',ROOT.Char)|U] patří mezi ně. Nyní vyznává [legendary_character.GetFaith.GetName], odvrací se od veškerého násilí a požaduje totéž i od všech svých poddaných."
 ce1_decision_events.1021.a: "Mír je jediná možnost."
 ce1_decision_events.1021.b: "Mír nikdy nebyl možností."
 fifteen_year_vassalization_tt: "Po dobu patnácti let budeš mít přístup k [Concept('casus_belli','casus belli')|E] Požadovat lenní přísahu"
 select_empire_to_drift_tt: "Můžeš vybrat jednu [Concept('empire','říši')|E], kterou trvale začleníš do svého [Concept('realm','panství')|E] pomocí [Concept('de_jure_drift','de iure posunu')|E]. Říši musíš buď držet, nebo již musí probíhat její de iure posun směrem k některému z titulů, které držíš."
 select_kingdom_to_drift_tt: "Můžeš vybrat jedno [Concept('kingdom','království')|E], které trvale začleníš do svého [Concept('realm','panství')|E] pomocí [Concept('de_jure_drift','de iure posunu')|E]. Království musíš buď držet, nebo již musí probíhat jeho de iure posun směrem k některému z titulů, které držíš."
 select_duchy_to_drift_tt: "Můžeš vybrat jedno [Concept('duchy','vévodství')|E], které trvale začleníš do svého [Concept('realm','panství')|E] pomocí [Concept('de_jure_drift','de iure posunu')|E]. Vévodství musíš buď držet, nebo již musí probíhat jeho de iure posun směrem k některému z titulů, které držíš."
 legendary_pacifism_spread_tt: "Všechna tvá sousední panství dostanou možnost přijmout tvou [Concept('faith','víru')|E]."
 unlock_legendary_adventure_tt: "Získáš přístup k [Concept('decision','rozhodnutí')|E] #EMP $launch_a_legendary_adventure$#!, které ti umožní opustit své panství a začít nový život ve vzdáleném [Concept('kingdom','království')|E]."
 unlock_legendary_fealty_tt: "Získáš přístup k [Concept('decision','rozhodnutí')|E] #EMP $legend_demand_fealty$#!, které ti umožní podrobit kterékoli blízké panství."
 unlock_legendary_integration_d_tt: "Získáš přístup k [Concept('decision','rozhodnutí')|E] #EMP $legendary_integration_d$#!, které ti umožní okamžitě začlenit [Concept('duchy','vévodství')|E] do svého panství pomocí [Concept('de_jure_drift','de iure posunu')|E]."
 unlock_legendary_integration_k_tt: "Získáš přístup k [Concept('decision','rozhodnutí')|E] #EMP $legendary_integration_k$#!, které ti umožní okamžitě začlenit [Concept('kingdom','království')|E] do svého panství pomocí [Concept('de_jure_drift','de iure posunu')|E]."
 unlock_legendary_integration_e_tt: "Získáš přístup k [Concept('decision','rozhodnutí')|E] #EMP $legendary_integration_e$#!, které ti umožní okamžitě začlenit [Concept('empire','říši')|E] do svého panství pomocí [Concept('de_jure_drift','de iure posunu')|E]."
 unlock_legendary_conversion_tt: "Získáš přístup k [Concept('decision','rozhodnutí')|E] #EMP $legendary_conversion$#!, které okamžitě obrátí rozsáhlé části tvého [Concept('realm','panství')|E] na tvou [Concept('faith','víru')|E]"
 unlock_legendary_pacifism_spread_tt: "Získáš přístup k [Concept('decision','rozhodnutí')|E] #EMP $legendary_pacifism_spread$#!, které ti umožní šířit svou [Concept('faith','víru')|E] do cizích sousedních panství."
 unlock_legendary_holy_war_tt: "Získáš přístup k [Concept('decision','rozhodnutí')|E] #EMP $legendary_holy_war$#!, které ti poskytne jedno další použití [Concept('casus_belli','casus belli')|E] $major_religious_war$."
 non_true_faith_neighbour: "Musíš mít alespoň jednoho sousedního vládce, který nevyznává tvou [Concept('faith','víru')|E]."
 leg_conv_valid_county: "V tvém [Concept('realm','panství')|E] musí být alespoň jedno [Concept('county','hrabství')|E], které nevyznává tvou [Concept('faith','víru')|E]."
 every_same_faith_vassal: "Každý [Concept('vassal','vazal')|E] tvé [Concept('faith','víry')|E]"
 every_same_faith_county_in_realm: "Každé [Concept('county','hrabství')|E] ve tvém [Concept('realm','panství')|E], které vyznává tvou [Concept('faith','víru')|E]"
