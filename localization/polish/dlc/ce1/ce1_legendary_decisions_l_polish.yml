 legend_demand_fealty: "Požadovat místní podrobení"
 legend_demand_fealty_desc: "Legenda o mých hrdinských činech mě obklopuje. Nejsem už jen pouhý smrtelník, jsem žijící legenda a všichni se musí přede mnou sklonit."
 legend_demand_fealty_tooltip: "$fifteen_year_vassalization_tt$"
 legend_demand_fealty_confirm: "Všichni se přede mnou pokloní."
 launch_a_legendary_adventure: "Vydat se na legendární dobrodružství"
 launch_a_legendary_adventure_desc: "Zdá se, že moje legenda tady došla konce, ale stále toužím po dalších velkých činech dřív, než opustím tento svět. Musí existovat ještě něco, a mám v úmyslu přenést svou legendu do vzdálených a mytických zemí!"
 launch_a_legendary_adventure_tooltip: "$launch_a_legendary_adventure_tt$"
 launch_a_legendary_adventure_confirm: "Legenda nikdy nekončí!"
 legendary_integration_e: "Vznešit říši" # todo: NEW TRANSLATION
 legendary_integration_e_desc: "V celé říši se vyprávějí legendy, které upevňují autoritu mé vlády. Mé slovo je absolutní, a kdybych prohlásil, že dvě říše jsou jednou, tak by tomu tak bylo." # todo: NEW TRANSLATION
 legendary_integration_e_tooltip: "$select_empire_to_drift_tt$" # todo: NEW TRANSLATION
 legendary_integration_e_confirm: "Ať se stane má vůle." # todo: NEW TRANSLATION
 control_the_entirety_of_title_empire_tt: "Musíte ovládat celé [Concept('empire','říše')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 legendary_integration_k: "Upevnit království"
 legendary_integration_k_desc: "Po celém království se vyprávějí legendy, které upevňují autoritu mé vlády. Mé slovo je konečné, a kdybych prohlásil, že dvě království jsou jedno, stalo by se tak."
 legendary_integration_k_tooltip: "$select_kingdom_to_drift_tt$"
 legendary_integration_k_confirm: "Ať se má vůle stane."
 control_the_entirity_of_title_tt: "Musíte ovládat celé [Concept('kingdom','království')|E]" # todo: CONCEPT CASE
 legendary_integration_d: "Rozšířit království"
 legendary_integration_d_desc: "Po celém království se vyprávějí legendy, které upevňují autoritu mé vlády. Tato nově nabytá legitimita by mohla být využita k rozšíření toho, co se považuje za jádrové území mého panství, a k požadování trvalého podřízení od historicky cizího vévody."
 legendary_integration_d_tooltip: "$select_duchy_to_drift_tt$"
 legendary_integration_d_confirm: "Ať se má vůle stane."
 legendary_holy_war: "Znovu potvrdit svatou misi"
 legendary_holy_war_desc: "Má legendární pověst zbožnosti došla konce, a i když ji pravověrní vyzdvihují, málo změnila srdce nevěřících. Musíme pokračovat ve šíření našich mírumilovných způsobů jediným způsobem, který známe: mečem."
 legendary_holy_war_tooltip: "$bonus_holy_war_tt$"
 legendary_holy_war_confirm: "Prapor spravedlnosti povstává!"
 legendary_pacifism_spread: "Šířit pacifismus"
 legendary_pacifism_spread_desc: "Pobožné příběhy se šíří daleko za mé hranice a uchvátily srdce nevěřících. Naše vyprávění o míru a soužití ohrožuje hašteřící se válečníky na našich hranicích, a s mírnou pobídkou tito barbaři jistě uvidí hodnotu nenásilného života."
 legendary_pacifism_spread_tooltip: "$legendary_pacifism_spread_tt$"
 legendary_pacifism_spread_confirm: "Mír zvítězí!"
 legendary_conversion: "Evangelizovat říši"
 legendary_conversion_desc: "Legendární příběh zbožnosti a oddanosti uchvátil srdce všech v říši. Trocha povzbuzení by mohla přimět nevěřící v říši, aby začali vyznávat mou víru."
 legendary_conversion_tooltip: "$legendary_conversion_tt$"
 legendary_conversion_confirm: "Pravá víra zvítězí."
 ce1_decision_events.1020.conversion: "[liege_convert.GetFirstName] Converts!"
 ce1_decision_events.1000.t: "Legendární integrace"
 ce1_decision_events.1000.desc: "Jako velký a proslulý [ROOT.Char.GetTitleAsNameNoTooltip|U] držím v mém panství mnoho titulů. I když nejsou všechny považovány za součást [ROOT.Char.GetPrimaryTitle.GetName], moje opatrovnictví nad nimi rozhodně zanechalo stopu.\n\nS tím, jak se můj status stal legendárním, má slova mají velkou váhu a mám pocit, že je málo těch, kteří by se mě odvážili zpochybnit. Kdybych řekl, že den je noc, bylo by to tak zapsáno. Stejně tak, kdybych prohlásil, že [kingdom_01.GetName] je právoplatnou součástí [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], bylo by to napsáno."
 ce1_decision_events.1000.a.empire: "[kingdom_01.GetName] je nyní [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]!"
 ce1_decision_events.1000.a.kingdom: "[kingdom_01.GetName] už neexistuje."
 ce1_decision_events.1000.b.empire: "[kingdom_02.GetName] je dobrým přírůstkem do impéria."
 ce1_decision_events.1000.b.kingdom: "[kingdom_02.GetName] přece není pravým královstvím."
 ce1_decision_events.1000.c.empire: "[kingdom_03.GetName] je lepší volba."
 ce1_decision_events.1000.c.kingdom: "[kingdom_03.GetName] bude navždy [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]."
 ce1_decision_events.1000.d: "Volím [kingdom_04.GetName]."
 ce1_decision_events.1000.e: "Nemohu si představit lepší přírůstek než [kingdom_05.GetName]."
 ce1_decision_events.1000.f: "Tak tedy [kingdom_06.GetName]."
 ce1_decision_events.1010.t: "$ce1_decision_events.1000.t$"
 ce1_decision_events.1010.desc: "Jako legendárně proslulý [ROOT.Char.GetTitleAsNameNoTooltip|U] je mé jméno oslavováno po celé mé říši i daleko za ní.\n\nNěkterá území jako [duchy_01.GetName] mají nejasnou budoucnost, buď uvnitř, nebo mimo [ROOT.Char.GetPrimaryTitle.GetName], ale když je má popularita na vrcholu a status těchto titulů je v pohybu, mohl bych využít svého legendárního postavení k definitivnímu vyřešení otázky."
 ce1_decision_events.1010.a: "[duchy_01.GetName] je nyní [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]!"
 ce1_decision_events.1010.b: "[duchy_02.GetName] je příjemným přírůstkem do mé říše."
 ce1_decision_events.1010.c: "[duchy_03.GetName] je lepší volba."
 ce1_decision_events.1010.d: "Volím [duchy_04.GetName]."
 ce1_decision_events.1010.e: "Nemohu si představit lepší přírůstek než [duchy_05.GetName]."
 ce1_decision_events.1010.f: "Tak tedy [duchy_06.GetName]."
 ce1_decision_events.1015.t: "$ce1_decision_events.1000.t$" # todo: NEW TRANSLATION
 ce1_decision_events.1015.desc: "Jako velký a proslulý [ROOT.Char.GetTitleAsNameNoTooltip|U] držím v rámci své říše mnoho titulů. Ač nejsou všechny z nich považovány za součást [ROOT.Char.GetPrimaryTitle.GetName], moje opatrovnictví nad nimi jistě zanechalo svůj otisk.\n\nS mým nynějším legendárním postavením má mé slovo velkou váhu a soudím, že jen málokdo by si troufl mě zpochybnit. Kdybych řekl, že den je noc, bylo by to tak zaznamenáno. Stejně tak, kdybych řekl, že [empire_01.GetDefinitiveName] je právoplatnou součástí [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip], tak by tomu tak bylo." # todo: NEW TRANSLATION
 ce1_decision_events.1015.a: "[empire_01.GetNameNoTooltip] je nyní [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]!" # todo: NEW TRANSLATION
 ce1_decision_events.1015.b: "[empire_02.GetNameNoTooltip] je výborným přírůstkem do říše." # todo: NEW TRANSLATION
 ce1_decision_events.1015.c: "[empire_03.GetNameNoTooltip] je lepší volba." # todo: NEW TRANSLATION
 ce1_decision_events.1015.d: "Volím [empire_04.GetNameNoTooltip]." # todo: NEW TRANSLATION
 ce1_decision_events.1015.e: "Nemohu si představit lepší přírůstek než [empire_05.GetNameNoTooltip]." # todo: NEW TRANSLATION
 ce1_decision_events.1015.f: "Ať je to [empire_06.GetNameNoTooltip]." # todo: NEW TRANSLATION
 ce1_decision_events.1020.t: "Mír v našich časech"
 ce1_decision_events.1020.desc: "Příběhy o válečníkovi, který řeší konflikty ne mečem, ale slovy a rozumem [legendary_character.GetHerHis], se staly nesmírně populární po celé říši. I když se modlím k [ROOT.Char.GetFaith.HighGodName|U] v tradičním [ROOT.Char.GetFaith.GetName] způsobu, nemohu si pomoci a nějak mě tento příběh [legendary_character.GetFaith.GetName] nepochybně dojal.\n\nNyní je mé království plné řečí o této legendární postavě a o síle míru, kterou [Select_CString(legendary_character.IsFemale,'její','jeho')] víra přinesla [legendary_character.GetHerHim]. Na dvoře mě oslovuje kazatel [legendary_character.GetFaith.GetName] z [legendary_character.GetPrimaryTitle.GetName], a to by mohla být moje šance přejít k mírumilovnějšímu způsobu života."
 ce1_decision_events.1020.a: "Složím svůj meč."
 ce1_decision_events.1020.b: "Vyžeňte tohoto kacíře z mého dvora."
 ce1_decision_events.1021.t: "Legendární konverze"
 ce1_decision_events.1021.desc: "Příběhy o válečníkovi, který řeší konflikty ne mečem, ale slovy a rozumem [legendary_character.GetHerHis], se staly nesmírně populární po celé říši. [legendary_character.GetName|U] se dotkl srdcí mnoha, včetně [liege_convert.Custom2('MyCharacterIntroduction', ROOT.Char)]. [Select_CString(liege_convert.IsFemale,'Přijala','Přijal')] víru [legendary_character.GetFaith.GetName], [Select_CString(legendary_character.GetFaith.IsFemale,'odložila','odložil')] veškeré myšlenky na násilí a nyní požaduje, aby všichni [Select_CString(legendary_character.IsFemale,'její','jeho')] poddaní učinili totéž."
 ce1_decision_events.1021.a: "Mír je jediná možnost."
 ce1_decision_events.1021.b: "Mír nikdy nebyl možností."
 fifteen_year_vassalization_tt: "Po dobu patnácti let budete mít přístup k Požadovat věrnost [Concept('casus_belli','casus belli')|E]." # todo: CONCEPT CASE
 select_empire_to_drift_tt: "Můžete vybrat jedno [Concept('empire','říše')|E], které bude trvale [Concept('de_jure_drift','de iure posun')|E] do vašeho panství. Říše musí být buď ve vašem držení, nebo mít nějaký pokrok driftu směrem k jednomu z vašich držených titulů." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 select_kingdom_to_drift_tt: "Můžete vybrat jedno [Concept('kingdom','království')|E], které bude trvale [Concept('de_jure_drift','de iure posun')|E] do vašeho panství. Království musí být buď ve vašem držení, nebo mít nějaký postup driftu směrem k některému z vašich držených titulů." # todo: CONCEPT CASE
 select_duchy_to_drift_tt: "Můžete vybrat jedno [Concept('duchy','vévodství')|E], které bude trvale [Concept('de_jure_drift','de iure posun')|E] do vašeho panství. Vévoda musí být buď ve vašem držení, nebo mít nějaký postup driftu směrem k některému z vašich držených titulů." # todo: CONCEPT CASE
 legendary_pacifism_spread_tt: "Všem sousedním říším bude dána možnost konvertovat k vaší víře."
 unlock_legendary_adventure_tt: "Získáte přístup k #EMP $launch_a_legendary_adventure$#! [Concept('decision','rozhodnutí')|E], který vám umožní opustit vaše panství a začít nový život v dalekém [Concept('kingdom','království')|E]." # todo: CONCEPT CASE
 unlock_legendary_fealty_tt: "Získáte přístup k #EMP $legend_demand_fealty$#! [Concept('decision','rozhodnutí')|E], který vám umožní podrobit jakékoli blízké panství." # todo: CONCEPT CASE
 unlock_legendary_integration_d_tt: "Získáte přístup k #EMP $legendary_integration_d$#! [Concept('decision','rozhodnutí')|E], který vám umožní okamžitě [Concept('de_jure_drift','de iure posun')|E] [Concept('duchy','vévodství')|E] titul do vašeho panství." # todo: CONCEPT CASE
 unlock_legendary_integration_k_tt: "Získáte přístup k #EMP $legendary_integration_k$#! [Concept('decision','rozhodnutí')|E], který vám umožní okamžitě [Concept('de_jure_drift','de iure posun')|E] [Concept('kingdom','království')|E] do vašeho panství." # todo: CONCEPT CASE
 unlock_legendary_integration_e_tt: "Získejte přístup k #EMP $legendary_integration_e$#! [Concept('decision','rozhodnutí')|E], který vám umožní okamžitě [Concept('de_jure_drift','de iure posun')|E] [Concept('empire','říše')|E] do vašeho panství." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 unlock_legendary_conversion_tt: "Získáte přístup k #EMP $legendary_conversion$#! [Concept('decision','rozhodnutí')|E], který okamžitě přemění rozsáhlé části vašeho [Concept('realm','panství')|E] na vaši [Concept('faith','víru')|E]" # todo: CONCEPT CASE
 unlock_legendary_pacifism_spread_tt: "Získáte přístup k #EMP $legendary_pacifism_spread$#! [Concept('decision','rozhodnutí')|E], který vám umožní šířit vaši [Concept('faith','víru')|E] do cizích říší na vašich hranicích." # todo: CONCEPT CASE
 unlock_legendary_holy_war_tt: "Získáte přístup k #EMP $legendary_holy_war$#! [Concept('decision','rozhodnutí')|E], který vám poskytne jedno další použití $major_religious_war$ [Concept('casus_belli','casus belli')|E]." # todo: CONCEPT CASE
 non_true_faith_neighbour: "Musíte mít alespoň jednoho sousedního vládce, který nevyznává vaši [Concept('faith','víru')|E]." # todo: CONCEPT CASE
 leg_conv_valid_county: "Musí existovat alespoň jedna [Concept('county','hrabství')|E] ve vašem [Concept('realm','panství')|E], která nevyznává vaši [Concept('faith','víru')|E]." # todo: CONCEPT CASE
 every_same_faith_vassal: "Každý [Concept('vassal','vazal')|E] vaší [Concept('faith','víru')|E]" # todo: CONCEPT CASE
 every_same_faith_county_in_realm: "Každý [Concept('county','hrabství')|E] ve vašem [Concept('realm','panství')|E], který vyznává vaši [Concept('faith','víru')|E]" # todo: CONCEPT CASE
