l_polish:
 ce1_lasting_line: "Přetrvávající rodová linie"
 plague_cult_persecuted: "Pronásledování morového kultu"
 plague_cult_persecuted_desc: "Oblíbený a charismatický kněz byl nedávno popraven za šíření kacířství."
 plague_cult_embraced: "Přijetí morového kultu"
 plague_cult_embraced_desc: "Oblíbený a charismatický kněz v této provincii káže kacířské učení a tvrdí, že přinese úlevu od moru."
 beset_by_revenants: "Sužováni nemrtvými"
 beset_by_revenants_desc: "Lidé v této provincii věří, že mrtví vstávají z hrobů a přinášejí s sebou mor a nemoci."
 revenant_expelled: "Nemrtvý zažehnán"
 revenant_expelled_desc: "Rakev jednoho šlechtice byla nedávno přibita, což uklidnilo obavy místních, že by mrtvý mohl vstát z hrobu."
 revenants_expelled: "Nemrtví zažehnáni"
 revenants_expelled_desc: "Každá rakev v tomto hrabství je před uložením do země pevně přibita, což uklidňuje obavy místních, že by mrtví mohli vstát z hrobů."
 flowers_planted: "Hojnost květin"
 flowers_planted_desc: "Bylo zde vysázeno rozlehlé květinové pole, které má potlačit zkažený vzduch šířený morem."
 miasma_ignored: "Bujné miasma"
 miasma_ignored_desc: "Tuto provincii plní zkažený vzduch a vládnoucí vrstva odmítla vysázet vonné rostliny, které by mu měly čelit."
 medicating_with_leeches_good: "Úspěšná léčba pijavicemi"
 medicating_with_leeches_good_desc: "Tato postava se léčí pijavicemi, což zvyšuje její celkovou odolnost vůči nemocem."
 medicating_with_leeches_bad: "Neúspěšná léčba pijavicemi"
 medicating_with_leeches_bad_desc: "Tato postava se léčí pijavicemi, ale výsledkem je jen ospalost a malátnost bez známek skutečného zlepšení."
 persecuted_flagellants: "Pronásledovaní flagelanti"
 persecuted_flagellants_desc: "Sebebičování se v tomto hrabství stalo mimořádně rozšířeným a místní páni tuto praktiku tvrdě potírají, ovšem bez valného úspěchu."
 rampant_flagellants: "Bujné sebebičování"
 rampant_flagellants_desc: "Kult náboženských extremistů v tomto hrabství provozuje sebebičování navzdory tomu, že jej náboženské autority odsuzují."
 apocalyptic_inquisition: "Apokalyptická inkvizice"
 apocalyptic_inquisition_desc: "Část obyvatel tohoto hrabství nabyla přesvědčení, že nedávný mor je znamením apokalypsy. Inkvizici je nyní podrobeno veškeré obyvatelstvo bez ohledu na to, zda tomuto kultu věří."
 plague_cult: "Apokalyptický kult"
 plague_cult_desc: "Nespočet mužů a žen v tomto hrabství věří, že nedávný mor je znamením apokalypsy, a šíří tak strach a hysterii po celém hrabství."
 rampant_witch_trials: "Morové procesy"
 rampant_witch_trials_desc: "Místní obyvatelé pořádají procesy s lidmi, které viní z nedávného moru."
 witch_trials_slowed: "Postihované morové procesy"
 witch_trials_slowed_desc: "$rampant_witch_trials_desc$ Šlechta tuto praxi ve velké míře odsoudila."
 protected_jews: "Ochránce Židů"
 protected_jews_desc: "Tato postava se zasazuje o bezpečí a ochranu židovských cestovatelů ve svém panství, díky čemuž si získala široký věhlas v židovských komunitách."
 divine_guidance: "Božské vedení"
 divine_guidance_desc: "Místní obyvatelstvo tohoto hrabství bylo nedávno teologickými argumenty přesvědčeno, aby výrazně omezilo pronásledování menšin."
 plague_animals_loose: "Morová zvířata"
 plague_animals_loose_desc: "Toto hrabství je plné zvířat, o nichž místní věří, že šíří mor a nemoci."
 royal_cats: "Královské zvíře: Kočky"
 royal_cats_desc: "Tato postava prohlásila kočky za královské zvíře panství a ubližování jim je považováno za zločin proti trůnu."
 royal_dogs: "Královské zvíře: Psi"
 royal_dogs_desc: "Tato postava prohlásila psy za královské zvíře panství a ubližování jim je považováno za zločin proti trůnu."
 lacking_cats_and_dogs_good: "Úbytek morových zvířat"
 lacking_cats_and_dogs_good_desc: "Nedávné vybíjení výrazně snížilo počet toulavých zvířat v tomto hrabství a omezilo šíření moru."
 lacking_cats_and_dogs: "Úbytek zvířat"
 lacking_cats_and_dogs_desc: "Nedávné vybíjení výrazně snížilo počet toulavých zvířat v tomto hrabství, což však kupodivu zvýšilo nakažlivost nemocí."
 full_of_rabid_animals: "Plno vzteklých zvířat"
 full_of_rabid_animals_desc: "Do tohoto hrabství bylo přivezeno nespočet toulavých zvířat, která mezi obyvatelstvem šíří nemoci."
 refused_to_repent: "Odmítnuté pokání"
 refused_to_repent_desc: "Místní obyvatelé tohoto hrabství nedávno požadovali, aby byl jeden šlechtic za svůj hřích veřejně zostuzen, jejich požadavek však byl odmítnut."
 witch_trials_obstructed: "Mařené čarodějnické procesy"
 witch_trials_obstructed_desc: "$witch_trials_slowed_desc$"
 persecuted_minorities_expelled: "Vyhnané menšiny"
 persecuted_minorities_expelled_desc: "Menšiny byly z tohoto hrabství vyhnány, což výrazně omezilo obchod."
 persecuted_minorities_protected: "Ochrana pronásledovaných menšin"
 persecuted_minorities_protected_desc: "Menšinám, kterým by v jejich domovině hrozilo pronásledování, zde bylo nabídnuto útočiště."
 plague_minorities_sanctuary: "Útočiště pro menšiny"
 plague_minorities_sanctuary_desc: "Menšinám, které byly nedávno vyhnány ze svých domovů, zde bylo nabídnuto nové útočiště. Bohužel byly vyhnány během moru a často si s sebou přinášejí i nemoc ze své domoviny."
 plague_minorities_sanctuary_boosted: "Velké útočiště pro menšiny"
 plague_minorities_sanctuary_boosted_desc: "$plague_minorities_sanctuary_desc$"
 persecuted_minorities_financial_sanctuary: "Obchodní útočiště"
 persecuted_minorities_financial_sanctuary_desc: "Zahraničním obchodníkům a obchodníkům z menšin bylo v tomto hrabství nabídnuto útočiště před pronásledováním."
 minority_persecution_forbidden: "Zákaz pronásledování menšin"
 minority_persecution_forbidden_desc: "Místní se nedávno pokusili násilně vyhnat menšiny, ale místní šlechta tuto praktiku zakázala."
 rats_eradicated: "Vyhubené krysy"
 rats_eradicated_desc: "Prozíravé hubení každé spatřené krysy přispělo k větší prosperitě provincie."
 pets_eradicated: "Vyhubení domácích zvířat"
 pets_eradicated_desc: "Kruté vybíjení místních domácích zvířat zde rozhněvalo mnoho lidí."
 vectors_reduced: "Omezení přenašečů nákazy"
 vectors_reduced_desc: "Vybití velké části místních ovcí zpomalilo šíření moru."
 disastrous_cull: "Katastrofální vybíjení"
 disastrous_cull_desc: "Vybití velké části místních ovcí poškodilo místní hospodářství."
 pleas_ignored: "Nevyslyšené prosby"
 pleas_ignored_desc: "Tato postava ignorovala prosby duchovenstva a udělala si z něj nepřítele."
 draconian_lockdown: "Drakonická uzávěra"
 draconian_lockdown_desc: "Tvrdá omezení zde způsobila rozsáhlé škody místnímu hospodářství."
 trusted_ruler: "Důvěryhodný vládce"
 trusted_ruler_desc: "Místní vládci zde požívají plné důvěry svého lenního pána."
 supplies_sent: "Odeslané zásoby"
 supplies_sent_desc: "Byly sem odeslány zásoby, které mají pomoci čelit hrozbě místního moru."
 plight_ignored: "Přehlížené strádání"
 plight_ignored_desc: "Vládce této provincie zcela přehlíží zdejší mor, který je teprve v počátcích."
 dead_boats: "Lodě mrtvých"
 dead_boats_desc: "Na zdejší pláže byly vyplaveny lodě plné mrtvých, které šíří nákazu a zkázu."
 clear_beaches: "Čisté pláže"
 clear_beaches_desc: "Na plážích této provincie nejsou žádní nemocní ani umírající."
 contaminated_beaches: "Kontaminované pláže"
 contaminated_beaches_desc: "Na pláže této provincie občas připlouvají lodě plné mrtvých."
 pestilent_beaches: "Morem zamořené pláže"
 pestilent_beaches_desc: "Pláže této provincie jsou poseté nakaženými mrtvolami, což je skutečně děsivý pohled."
 respected_dead: "Uctívaní mrtví"
 respected_dead_desc: "Tato provincie prokazuje svým mrtvým plnou úctu i uprostřed moru."
 health_first: "Zdraví na prvním místě"
 health_first_desc: "Tato postava se snaží upřednostňovat vlastní zdraví před zdravím ostatních."
 dismissed_peasantry: "Uctívaní mrtví"
 dismissed_peasantry_desc: "Prostý lid této provincie má pocit, že jej vládci přehlížejí a odsouvají na okraj."
 miracle_worker: "Divotvůrce"
 miracle_worker_desc: "Zdálo se, že tato postava pouhým dotykem uzdravila nemocné!"
 man_of_the_people: "Šlechtic mezi lidmi"
 man_of_the_people_desc: "Tato postava projevuje soucit s níže postavenými i uprostřed moru."
 out_of_touch: "Odtržený od lidu"
 out_of_touch_desc: "„Královský dotek“ této postavy nemocné ani tak neuzdravil, jako spíš definitivně dorazil!"
 commoners_welcomed_in: "Přijetí poddaných"
 commoners_welcomed_in_desc: "Lenní pán přijal poddané této provincie a všichni jsou za projevenou pohostinnost vděční."
 commoners_turned_away: "Odmítnutí poddaní"
 commoners_turned_away_desc: "Lenní pán odmítl poddané této provincie ve chvíli nouze a mnozí z nich tím rozhodně nejsou nadšeni."
 fears_allayed: "Rozptýlené obavy"
 fears_allayed_desc: "Poddaní této provincie mají pocit, že jejich obavy byly rozptýleny, a ochotně se řídí pokyny."
 fears_ignored: "Přehlížené obavy"
 fears_ignored_desc: "Poddaní této provincie mají pocit, že jejich obavy byly smeteny ze stolu, a dál si stěžují."
 strict_coastal_quarantine: "Přísná pobřežní karanténa"
 strict_coastal_quarantine_desc: "Obchodníci, kteří do této provincie připlouvají po moři, musejí před prodejem svého zboží strávit mnoho dní v izolaci."
 coastal_quarantine: "Pobřežní karanténa"
 coastal_quarantine_desc: "Obchodníci, kteří do této provincie připlouvají po moři, musejí před prodejem svého zboží strávit určitou dobu v izolaci."
 cackling_loon: "Potrhlý smích"
 cackling_loon_desc: "Snaha této postavy vysmát se vlastním problémům má přece jen #EMP nějaké#! nevýhody..."
 herbalist_suspicions: "Podezřelé bylinkářství"
 herbalist_suspicions_desc: "Znalost mastí a bylin učinila z této postavy v dobách moru terč podezření."
 absent_ruler: "Nepřítomnost vládce"
 absent_ruler_desc: "Na hrozbu blížícího se moru tato postava reagovala tím, že prakticky odmítá opouštět své komnaty."
 present_ruler: "Přítomnost vládce"
 present_ruler_desc: "Tato postava zůstává aktivním a viditelným vládcem i v časech moru a zkázy."
 hiding_from_epidemic: "Úkryt před morem"
 hiding_from_epidemic_desc: "Tato postava tráví čas zavřená v ústraní, zatímco jejím panstvím řádí mor.\n\n[Concept('infection_chance','Pravděpodobnost nákazy')|E]: #P -75%#!"
 sachet_protection: "Ochranný vonný váček"
 sachet_protection_desc: "Vonný bylinný váček, který tato postava nosí u sebe, ji možná ve skutečnosti před nemocí nechrání, ale rozhodně jí i lidem v okolí dodává #EMP pocit#! bezpečí."
 overly_fragrant: "Přehnaně navoněný"
 overly_fragrant_desc: "Přehnané používání několika bylinných váčků tuto postavu možná ve skutečnosti před nemocí nechrání, ale rozhodně jí #EMP zlepšuje#! náladu - byť za cenu slzících očí všech v okolí."
 ce1_legendary_feaster: "Legendární hodování"
 ce1_legendary_feaster_desc: "Tato postava putuje světem a při nejrůznějších událostech a oslavách vypráví svou legendu každému, kdo je ochoten naslouchat."
 ce1_legendary_performance: "Legendární představení"
 ce1_legendary_performance_desc: "Tato postava nedávno uspořádala dramatické představení své legendy. K zamýšlenému publiku sice neproniklo, prostý lid však zjevně velmi zaujalo."
 ce1_legendary_taverns: "Místní legendy"
 ce1_legendary_taverns_desc: "Prostý lid v panství této postavy její legendu nadšeně přijal, což výrazně urychluje její šíření. Muži putují od krčmy ke krčmě a předávají si její příběh."
 ce1_legend_mocked: "Zesměšněná legenda"
 ce1_legend_mocked_desc: "Legenda této postavy byla nedávno zesměšněna na kulturní slavnosti, takže ostatní se teď stydí ji dál šířit."
 studying_ancient_cultures: "Studium starověkých kultur"
 studying_ancient_cultures_desc: "Tato postava nedávno prozkoumala starobylé ruiny kdysi obývané dávným národem a to, co tam objevila, jí přineslo nové poznání."
 kids_legend_modifier: "Dětská legenda"
 kids_legend_modifier_desc: "Děti přehrávají příběhy z legendy této postavy, čímž urychlují její šíření."
 legendary_holy_site: "Legendární poutní místo"
 legendary_holy_site_desc: "Přestože toto místo nemá pro danou víru žádný skutečný význam, do hrabství proudí poutníci kvůli legendárnímu příběhu, který je přirovnává ke svatému místu."
 legend_county_culture_builders: "Kultura hlavního sídla"
 legend_county_culture_builders_desc: "Obyvatelé tohoto místa jsou hrdí na to, že je vybudovali právě jejich předkové."
 legend_character_culture_builders: "Odkaz stavitelů"
 legend_character_culture_builders_desc: "Tato postava s oblibou ujišťuje obyvatele svého hlavního sídla, že tak mocné sídlo vybudovali právě jejich společní předkové a nikdo jiný."
 legend_humble_king: "Pokorný vládce"
 legend_humble_king_desc: "Skromnost, s níž tato postava zlehčuje význam svých posvátných činů, jí v očích věřících přináší o něco větší vážnost."
 legend_mothers_boy: "Úcta k rodičům"
 legend_mothers_boy_desc: "Úcta této postavy k rodičům představuje příklad, který by měli následovat všichni."
 legend_charitable_donations: "Dobročinné dary"
 legend_charitable_donations_desc: "Tato provincie těží z četných dobročinných darů."
 legend_sick_hospitals: "Hojně využívané hospice"
 legend_sick_hospitals_desc: "Obyvatelé této provincie vědí, že pokud onemocní, mají se v první řadě obrátit na hospic."
 legend_bloodthirsty_warrior: "Krvelačná pověst"
 legend_bloodthirsty_warrior_desc: "Tato postava je hrdá na své válečné činy."
 legend_stigmatic: "Stigmata"
 legend_stigmatic_desc: "Tato postava má několik starých ran na místech odpovídajících ranám Ježíše."
 legend_culturally_sensitive: "Kulturní ohleduplnost"
 legend_culturally_sensitive_desc: "Tato postava chápe, že mezi různými kulturami může vznikat napětí, a přijímá opatření, aby jen zřídka přerostlo v otevřený konflikt."
 legend_visions_of_god: "Vize božství"
 legend_visions_of_god_desc: "Tato postava tvrdí, že o zrak přišla poté, co ji oslepila posvátná vize."
 legend_holy_sacrifice: "Svatá oběť"
 legend_holy_sacrifice_desc: "Tato postava tvrdí, že obětovala jedno oko božským silám."
 legend_gods_humble_servant: "Pokorný služebník"
 legend_gods_humble_servant_desc: "Tato postava tvrdí, že ji zrakové postižení naučilo pokoře a učinilo zbožnější."
 legend_sneaks_food: "Tajné mlsání"
 legend_sneaks_food_desc: "Tato postava se bojí, že by kvůli přejídání mohla působit bezbožně, ale nedokáže odolat tomu, aby si tu a tam tajně něco nezakousla."
 legend_fat_and_happy: "Tlustý a spokojený"
 legend_fat_and_happy_desc: "Tato postava je poněkud rozměrnější, ale dokonale se s tím smířila."
 legend_historical_bedecking: "Starobylý oděv"
 legend_historical_bedecking_desc: "Tato postava nosí dávný oděv svého lidu a záměrně tak připomíná jeho minulost."
 legend_modern_ruler: "Moderní vládce"
 legend_modern_ruler_desc: "Tato postava se odmítá podřizovat pravidlům minulosti a razí si vlastní cestu."
 legend_prayer_callus: "Modlitební mozol"
 legend_prayer_callus_desc: "Tato postava má na čele „zabíbu“ neboli „modlitební mozol“, stopu dokazující její oddanost při opakovaných úklonách k zemi."
 legend_bruised_head: "Pohmožděné čelo"
 legend_bruised_head_desc: "Tato postava si způsobila drobné zranění, kvůli němuž ji občas bolí hlava."
 legend_claimed_stigmatic: "Údajná stigmata"
 legend_claimed_stigmatic_desc: "Tato postava nese znamení, o němž tvrdí, že se podobá ranám Ježíše. Toto tvrzení vyvolalo značné kontroverze."
 mysterious_sword_giver_great: "Mýtické vody"
 mysterious_sword_giver_great_desc: "Říká se, že ve vodách tohoto hrabství přebývá mocná mystická bytost, která každému, kdo ji nalezne, přisuzuje tajuplný osud."
 mysterious_sword_giver: "Proslulé vody"
 mysterious_sword_giver_desc: "$mysterious_sword_giver_great_desc$"
 ce1_evil_spirit: "Zlý duch"
 ce1_evil_spirit_desc: "Tato postava věří, že ji posedl zlý duch, a následkem toho je velmi podrážděná a nevyzpytatelná."
 angelic_founder: "Andělský původ"
 angelic_founder_desc: "Členové tohoto rodu se shodují, že jeho založení uvedl do pohybu anděl."
 legendary_item: "Cizokrajná půda"
 legendary_item_desc: "Místní vládce sem přivezl trochu půdy ze vzdálené mystické země, což mnohé přivedlo k přesvědčení, že má kouzelné vlastnosti."
 legendary_item_personal: "Legendární cesta"
 legendary_item_personal_desc: "Tato postava doputovala do velmi vzdálené země a cestou šířila příběhy o své legendě."
 ce1_heartthrob: "Lamač srdcí"
 ce1_heartthrob_desc: "Tato postava se vydala na legendární romantickou výpravu a odmítá označit dokonce i svého nejbližšího milence za svou pravou lásku."
 ce1_legendary_battle: "Legendární bitva"
 ce1_legendary_battle_desc: "Tato postava se nedávno zúčastnila bitvy, kterou lze samu o sobě nazvat legendární, což předznamenává ještě větší legendární skutky."
 legend_renowned_herbalist: "Proslulý bylinkář"
 legend_renowned_herbalist_desc: "Tato postava údajně narazila na vzácné rostliny, z nichž získala mnoho nových poznatků."
 legend_eagle_eyed: "Orlí zrak"
 legend_eagle_eyed_desc: "Podle vyprávění tato postava prokázala své mistrovství s lukem proti každému, kdo se jí odvážil postavit."
 legend_cannibal_scarred: "Nepřítel kanibalů"
 legend_cannibal_scarred_desc: "Říká se, že tato postava odrazila útok kanibalů a odnesla si z něj jizvy."
 legend_nick_of_time: "V pravý čas"
 legend_nick_of_time_desc: "Tato postava prý během rozhodující bitvy dorazila s posilami právě včas."
 legend_well_organised: "Dobře organizovaný"
 legend_well_organised_desc: "Díky prozíravosti ve vojenské organizaci tuto postavu jen málokdy zastihne bitva nepřipravenou."
 legend_bravely_ran_away: "Statečný útěk"
 legend_bravely_ran_away_desc: "Tato postava údajně vzala nohy na ramena, když se blížila bitva. Jelikož se jí to nakonec vyplatilo, ostatní se jí alespoň nemohou vysmívat úplně bez zábran."
 ce1_immortal: "Hledání nesmrtelnosti"
 ce1_immortal_desc: "Tato postava hledá způsob, jak se stát nesmrtelnou."
 ce1_level_headed: "Střízlivý pohled"
 ce1_level_headed_desc: "Tato postava chápe, že sny jsou jen sny. Nic víc."
 ce1_accepted_mortality: "Smíření"
 ce1_accepted_mortality_desc: "Tato postava se nedávno postavila vlastní smrtelnosti a našla útěchu v pomíjivosti života."
 ce1_will_to_live: "Existenciální krize"
 ce1_will_to_live_desc: "Tato postava se děsí smrti."
 ce1_forgiveness: "Vnitřní odpuštění"
 ce1_forgiveness_desc: "Tato postava se nedávno rozhodla odpustit někomu, kdo jí velmi ublížil."
 plague_tales: "Příběhy o moru"
 plague_tales_desc: "Paranoia této postavy z moru v dalekých zemích se alespoň přetavila v aktivní úsilí o ochranu vlastního panství."
 plague_insights_gained: "Poznatky o moru"
 plague_insights_gained_desc: "Včasná pitva mrtvoly poskytla této postavě cenné poznatky o účincích dýmějového moru."
 brutal_crackdown: "Brutální zásah"
 brutal_crackdown_desc: "Krutý zásah proti uprchlíkům na hranicích posílil autoritu, ale v tomto baronství vyvolal značný hněv."
 shanty_towns: "Provizorní osady"
 shanty_towns_desc: "Vybudování několika provizorních osad na hranicích tohoto baronství umožnilo ubytovat uprchlíky alespoň na delší dobu."
 border_defended: "Bráněná hranice"
 border_defended_desc: "Odmítání uprchlíků na hranicích tohoto baronství některé potěšilo, ale zpomalení přistěhovalectví má i svou cenu."
 refugees_coddled: "Hýčkaní uprchlíci"
 refugees_coddled_desc: "Uprchlíkům prchajícím do tohoto baronství byl umožněn vstup bez jakýchkoli překážek."
 dangerous_rides: "Nebezpečné vyjížďky"
 dangerous_rides_desc: "Vyjížďky této postavy do divočiny ohrožují ji i její rodinu, ale její náladě prospívají znamenitě."
 cautious_rider: "Opatrný jezdec"
 cautious_rider_desc: "Tato postava se odmítá vystavovat nebezpečí vyjížďkami do krajiny, která může být zasažena nákazou."
 overly_protective: "Přehnaná opatrnost"
 overly_protective_desc: "Paranoia přiměla tuto postavu, aby se na příchod moru připravila mimořádně důkladně."
 mass_panic: "Masová panika"
 mass_panic_desc: "Zprávy o mocném moru, který se blíží, uvrhly toto baronství do masové paniky."
 allayed_fears: "Rozptýlené obavy"
 allayed_fears_desc: "Obavy obyvatel tohoto baronství z blížícího se moru byly uklidněny."
 angry_crowds: "Rozhněvané davy"
 angry_crowds_desc: "Obyvatele tohoto baronství děsí a rozčiluje vlna zatýkání kazatelů konce světa."
 rumours_stifled: "Potlačené zvěsti"
 rumours_stifled_desc: "Rázné potlačování zvěstí o moru v dalekých zemích učinilo z tohoto baronství klidnější místo."
 rumours_proliferated: "Rozšířené zvěsti"
 rumours_proliferated_desc: "Pokusy potlačit zvěsti v této provincii selhaly a mnozí nyní propadají panice při představě, že mor dorazí i do jejich zemí."
 uncaring_ruler: "Lhostejný vládce"
 uncaring_ruler_desc: "Obyvatelé tohoto baronství mají pocit, že je jejich vládce opustil."
 flagellants_acquiesce: "Uklidnění flagelanti"
 flagellants_acquiesce_desc: "Tato postava uklidnila flagelanty, kteří se potulují městy a vesnicemi."
 pacified_flagellants: "Zpacifikovaní flagelanti"
 pacified_flagellants_desc: "Obyvatele tohoto baronství už neobtěžují hlasatelé zkázy, protože potulní flagelanti byli zpacifikováni."
 eager_populace: "Odhodlané obyvatelstvo"
 eager_populace_desc: "Obyvatelé tohoto baronství vyslyšeli slova místních hlasatelů zkázy a jsou ochotni udělat cokoli, aby se připravili."
 unrestrained_flagellants: "Nezkrocení flagelanti"
 unrestrained_flagellants_desc: "Neúspěšné pokusy uklidnit flagelanty v tomto baronství vedly k nárůstu jejich počtu."
 regular_checkups: "Pravidelné prohlídky"
 regular_checkups_desc: "Pravidelné dávky drahých léčiv podávané lékaři udržují tuto postavu v nejlepším možném zdraví."
 under_the_weather: "Pod psa"
 under_the_weather_desc: "Tato postava se necítí úplně ve své kůži."
 gravediggers_threatened: "Zastrašení hrobaři"
 gravediggers_threatened_desc: "Hrobařům v tomto baronství bylo vyhrožováno a byli vydíráni, takže jsou chudší a mnohem méně ochotní pracovat."
 gravediggers_compensated: "Lépe placení hrobaři"
 gravediggers_compensated_desc: "Hrobaři v tomto baronství dostávají vyšší odměnu, což zlepšilo jejich morálku."
 gravediggers_replaced: "Nahrazení hrobaři"
 ce1_commoners_in_graves: "Společný hřbitov"
 ce1_commoners_in_graves_desc: "Tato postava nedávno zpřístupnila část svého královského hřbitova prostému lidu, čímž potěšila místní, ale poškodila svou pověst v očích části šlechty."
 ce1_common_graves: "Společné hroby"
 ce1_common_graves_desc: "Prostý lid je odvážen k pohřbení na hřbitov v tomto hrabství."
 ce1_bodies_in_the_street: "Těla v ulicích"
 ce1_bodies_in_the_street_desc: "Hřbitovy jsou plné a mrtvých stále přibývá, takže těla zůstávají hnít přímo v ulicích."
 ce1_siege_corpse: "Nakažené mrtvoly"
 ce1_siege_corpse_desc: "Nepřátelská armáda nedávno vymrštila nakažená těla do državy v tomto hrabství."
 ce1_quarantined_corpse: "Izolované mrtvoly"
 ce1_quarantined_corpse_desc: "Nepřátelská armáda nedávno vymrštila nakažená těla do državy v tomto hrabství, ale podařilo se je úspěšně oddělit od většiny obyvatelstva."
 ce1_heavily_ill: "Těžce nemocný"
 ce1_heavily_ill_desc: "Blízký kontakt s nakaženými mrtvolami vážně poškodil zdraví této postavy."
 ce1_non_heretical_solution: "Oddělení nakažených"
 ce1_non_heretical_solution_desc: "Těla postižená morem jsou v panství této postavy oddělována od zdravých."
 ce1_unorthodox_epidemic_treatment: "Nekonvenční léčba"
 ce1_unorthodox_epidemic_treatment_desc: "Pomocí esoterických a silně kacířských praktik se této postavě daří zpomalovat šíření moru."
 ce1_unorthodox_epidemic_treatment_bad: "Neúspěšná kacířská léčba"
 ce1_unorthodox_epidemic_treatment_bad_desc: "Pomocí esoterických a silně kacířských praktik se tato postava neúspěšně pokouší zpomalit šíření moru."
 ce1_major_quarantine: "Karanténa celého panství"
 ce1_major_quarantine_desc: "Tato postava nechává místní zavírat v jejich domovech ve snaze zabránit šíření moru."
 ce1_major_quarantine_county: "Karanténa"
 ce1_major_quarantine_county_desc: "Nikdo nesmí do tohoto hrabství vstoupit ani je opustit, čímž se omezuje šíření moru."
 war_doctor: "Válečný lékař"
 war_doctor_desc: "Proslulý lékař se svými následovníky putuje po bojištích a poskytuje nemocným a churavým vojákům prvotřídní péči."
 ce1_banishment_resistance: "Bez nákazy"
 ce1_banishment_resistance_desc: "Těžce nemocní dvořané byli vykázáni z domovského dvora této postavy, čímž se výrazně snížilo její vystavení nemocem."
 minor_epidemic_treatment: "Mírná prevence epidemie"
 minor_epidemic_treatment_desc: "Lékař této postavy nedávno předepsal umírněná opatření, která mají zabránit šíření blížící se epidemie."
 major_epidemic_treatment: "Důrazná prevence epidemie"
 major_epidemic_treatment_desc: "Lékař této postavy nedávno přistoupil k mimořádně tvrdým opatřením, která mají zabránit šíření blížící se epidemie."
 critical_epidemic_treatment: "Mystická prevence epidemie"
 critical_epidemic_treatment_desc: "Mystický lékař doporučil proti blížící se epidemii radikální a podivné léčebné postupy. Přestože pobouřily náboženské autority, zdají se být velmi účinné."
 minor_epidemic_treatment_failed: "Zpackaná mírná prevence epidemie"
 minor_epidemic_treatment_failed_desc: "Přestože byla opatření této postavy proti blížícímu se moru umírněná, nakonec přinesla více škody než užitku."
 major_epidemic_treatment_failed: "Zpackaná důrazná prevence epidemie"
 major_epidemic_treatment_failed_desc: "Tato postava přijala radikální opatření proti šíření blížící se epidemie, která nejen způsobila hospodářskou stagnaci, ale navíc byla v potlačení nákazy zcela neúčinná."
 critical_epidemic_treatment_failed: "Zpackaná mystická prevence epidemie"
 critical_epidemic_treatment_failed_desc: "Opatření, která tato postava přijala k léčbě lidí sužovaných morem, byla nejen účinná, ale svou nekonvenčností také značně pobouřila náboženské autority."
 ce1_royal_touch: "Královský dotek"
 ce1_royal_touch_desc: "Nemocné a umírající v tomto hrabství nedávno navštívil jejich lenní pán a udělil jim svůj královský dotek prostřednictvím požehnaných mincí."
 funeral_unrelenting_devotion: "Neochvějná oddanost"
 funeral_unrelenting_devotion_desc: "Tato postava přísahala nad hrobem milované osoby, že se stane lepším vládcem."
 funeral_comfort: "Útěcha"
 funeral_comfort_desc: "Tato postava se nedávno postavila vlastní smrtelnosti a nalezla útěchu ve smyslu pomíjivého života."
 funeral_existential_dread: "Existenciální děs"
 funeral_existential_dread_desc: "Tato postava si nedávno uvědomila, že jednoho dne zemře. Vůbec se jí to nelíbilo."
 ce1_modest_leader: "Skromný vůdce"
 ce1_modest_leader_desc: "Legenda této postavy na bojišti roste spolu s její tichou a skromnou povahou."
 ce1_black_thumb: "Černý palec"
 ce1_black_thumb_desc: "Tuto postavu by příroda nemohla zajímat méně."
 legend_chaste_faithful: "Cudní a věrní"
 legend_chaste_faithful_desc: "Ti, kdo následují tuto legendu, jsou známí svou věrností."
 legend_lecherous_lewd: "Chlipní a necudní"
 legend_lecherous_lewd_desc: "Ti, kdo následují tuto legendu, jsou proslulí svou bezuzdnou smyslností."
 ce1_forward_thinking: "Pokrokové smýšlení"
 ce1_forward_thinking_desc: "Tato postava se nezajímá o kultury dávné minulosti a raději žije pevně zakotvená v přítomnosti."
 ce1_avenging_child: "Pomstychtivé dítě"
 ce1_avenging_child_desc: "Tato postava je odhodlána pomstít smrt svého rodiče, kterého zabilo divoké zvíře."
 legend_palatial_palatable: "Palácové požitky"
 legend_palatial_palatable_desc: "Vskutku, nic není velkolepějšího než stůl plný nejexotičtějších mas!"
 ce1_consequentialist: "Konsekvencialista"
 ce1_consequentialist_desc: "Tato postava ráda připomíná ostatním, že důležitý je cíl, nikoli cesta."
 legend_edifices_enduring: "Stavby přetrvávají"
 legend_edifices_enduring_desc: "Inspirovat se dávnými kameníky není vůbec špatné. Vždyť skutečnost, že jejich díla dodnes hrdě stojí, je nejlepším důkazem jejich dovedností."
 legend_monophthalmic_mythical: "Bájní jednoocí"
 legend_monophthalmic_mythical_desc: "Kyklopové kráčejí mezi námi! Když budeš pozorně sledovat okolí, možná některého zahlédneš i ty..."
 legendary_adventurer: "Dobrodružný duch"
 legendary_adventurer_desc: "Tato postava je připravena opustit své panství a šířit svou legendu v cizině."
 epidemic_increased_maintance: "Zvýšené náklady"
 epidemic_increased_maintance_desc: "Tato postava vyplácí vyšší žold, aby nahradila vojáky, které si vyžádala epidemie."
 epidemic_pressed_levies: "Nucené odvody"
 epidemic_pressed_levies_desc: "V této provincii jsou sedláci nuceně odváděni do pluků ozbrojenců."
 epidemic_closed_barracks: "Uzavřená kasárna"
 epidemic_closed_barracks_desc: "Aby se předešlo zbytečným ztrátám, vojáci budou izolováni a veškerý výcvik je zakázán."
 ce1_gone_dancing: "Připojení k nekonečnému tanci"
 ce1_gone_dancing_desc: "Tato postava se připojila k sedlákům v jejich nekonečném tanci."
 fealty_demanded: "Požadovaná lenní věrnost"
 fealty_demanded_desc: "Tato postava požaduje od svých podřízených lenní věrnost."
 legend_investments: "Finanční investice"
 legend_investments_desc: "Do tohoto hrabství v poslední době proudí investice plynoucí z obchodů jeho lenního pána, což podporuje místní hospodářství."
 legend_loose_lips: "Prodejná přízeň"
 legend_loose_lips_desc: "Tato postava je ochotna nechat si svou přízeň koupit, čímž ostatním dává možnost přimět ji, aby jednala podle jejich vůle."
 legend_esteemed_expanding: "Vážená, rozmáhající se"
 legend_esteemed_expanding_desc: "Mezi příznivci této vážené legendy se nacházejí i skutečně významné osobnosti."
 legend_irreverent_immoral: "Neuctivá, nemravná"
 legend_irreverent_immoral_desc: "Podpora této legendy ze strany lidí, od nichž by se něco takového nečekalo, ji značně pošpinila."
 legend_wicked_ways: "Hříšné způsoby"
 legend_wicked_ways_desc: "Údajně hříšný způsob života této postavy poněkud ztěžuje šíření příznivých zpráv o jejích skutcích."
 legend_errors_exonerated: "Očištěná pověst"
 legend_errors_exonerated_desc: "Hříšné skutky této postavy byly díky podpoře jejích vrstevníků důkladně zameteny pod koberec."
 legend_principled_pious: "Zásadová, zbožná"
 legend_principled_pious_desc: "Všichni, kdo tuto legendu šíří, těží z důvěryhodnosti, které se těší v očích prostého lidu."
 legend_saintly_sinless: "Svatá, bezhříšná"
 legend_saintly_sinless_desc: "Ti, kdo tuto legendu šíří, se těší takové úctě, že tím posilují i samotnou legendu."
 healthy_court: "Zdravý dvůr"
 healthy_court_desc: "Činy této postavy vedly ke zdravému a spokojenému dvoru."
 strange_levity: "Pochmurná nálada"
 strange_levity_desc: "Od chvíle, kdy zeměmi prošel mor, se tato postava utápí v pochmurné náladě."
 free_boats: "Opuštěné lodě"
 free_boats_desc: "Tato postava těží z řady opuštěných lodí vyplavených na jejích březích, díky nimž má při cestování větší výběr."
 corpse_piles: "Hromady mrtvol"
 corpse_piles_desc: "Břehy tohoto baronství jsou zavalené hromadami nakažených mrtvol ponechaných napospas rozkladu."
 shattered_by_plague: "Silně náchylné k moru"
 shattered_by_plague_desc: "Toto živé a hustě osídlené hrabství dělí od rozsáhlé epidemie jen jediný zakašlaný dech."
 ravaged_by_plague: "Náchylné k moru"
 ravaged_by_plague_desc: "Rušné ulice sídel v tomto hrabství vytvářejí ideální podmínky pro šíření moru."
 blighted_by_plague: "Zranitelné vůči moru"
 blighted_by_plague_desc: "Nadprůměrná hustota obyvatelstva činí toto hrabství zranitelným vůči šíření moru."
 struck_by_plague: "Ohrožené morem"
 struck_by_plague_desc: "V tomto hrabství se nacházejí dostatečně velká sídla na to, aby se zde mor šířil o něco snáze."
 legend_secure_safe: "Jistá, bezpečná"
 legend_secure_safe_desc: "Tato legenda je proslulá tím, že sbližuje lidi a dokáže z nepřátel učinit přátele i v cizím prostředí."
 plague_new_capital: "Nové hlavní město"
 plague_new_capital_desc: "Nedávný mor zpustošil okolní země a učinil z tohoto hrabství ideálního kandidáta na nové hlavní město panství."
 plague_alms_donations: "Almužny"
 plague_alms_donations_desc: "Chudí a potřební v tomto baronství těží z rozdávaných almužen, které jim zvedají morálku a poskytují místo k přebývání."
 plague_determined_recover: "Odhodlání k obnově"
 plague_determined_recover_desc: "Přestože hlavní město této postavy zpustošil mor, je odhodlána zajistit jeho obnovu."
 plague_the_long_road: "Dlouhá cesta"
 plague_the_long_road_desc: "Hlavní město této postavy zpustošil mor, přesto je odhodlána překonat všechny překážky a obnovit je."
 plague_crippling_sorrow: "Zdrcující žal"
 plague_crippling_sorrow_desc: "Hlavní město této postavy zpustošil mor a rozsah smrti a zkázy ji uvrhl do hlubokého zoufalství."
 legend_tolerant_trusting: "Tolerantní, důvěřivá"
 legend_tolerant_trusting_desc: "Tato legenda dostala prostor volně růst a její vlastník povzbuzuje potulné bardy, aby její příběh dále přikrášlovali."
