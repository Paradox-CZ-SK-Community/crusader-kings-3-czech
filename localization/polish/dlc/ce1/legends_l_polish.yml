 legend_chapter_opening_generic: "Legenda o [ROOT.Legend.GetProtagonist.GetNameNoTooltip] je veliká jako sám svět, neboť [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jejím','jeho')] činům není rovno."
 legend_chapter_extra_deed_memory: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] však [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nezůstala','nezůstal')] jen u toho, nýbrž s velikou odvahou [ROOT.Legend.MakeScope.Var('extra_deed_memory').CharacterMemory.GetThirdPerspectiveDescription]."
 legend_chapter_motivation_generic: "Když se zemí začaly šířit znepokojivé zvěsti, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'se odhodlala','se odhodlal')] podstoupit nesnadný úkol."
 legend_chapter_motivation_evil: "Nebyly to prosby lidu ani zoufalství svírající zemi, co [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] přimělo vydat se za dobrodružstvím, nýbrž touha pramenící z temnoty [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jejího','jeho')] vlastního srdce."
 legend_chapter_motivation_peasant: "K postavě [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] se jednoho dne dostavil uplakaný a zoufalý chudý rolník a požádal o slyšení. [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Zbožná','Zbožný')] [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nedokázala jeho prosby oslyšet a bez prodlení se vydala na cestu','nedokázal jeho prosby oslyšet a bez prodlení se vydal na cestu')]."
 legend_chapter_motivation_spouse: "Když jednoho rána přišla za [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'její','jeho')] choť se znepokojivými zvěstmi, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'neváhala a přísahala','neváhal a přísahal')], že dostojí jejich věčné lásce."
 legend_chapter_motivation_honor_lady: "Jakmile se pohled [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] střetl s pohledem milované osoby, bylo rozhodnuto. Po vyslechnutí proseb o pomoc a s touhou dokázat velikost své odvahy se [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vydala','vydal')] za dobrodružstvím."
 legend_chapter_discovery_generic: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'prozkoumala','prozkoumal')] se svou družinou místo zvané [Localize(location)] a netrvalo dlouho, než [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nalezla','nalezl')] přesně to, co [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'hledala','hledal')]."
 legend_chapter_hunt_generic: "Tvor známý jako [Localize(beast)] už byl na místě a pil z potoka. Zvedl hlavu a vzápětí se hnal proti [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]. Hladový. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] však [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'byla rychlejší a jediným obratným úderem bestii skolila','byl rychlejší a jediným obratným úderem bestii skolil')]."
 legend_chapter_battle_generic: "Bitva byla nelítostná. Uprostřed bitevního pole se [ROOT.Legend.GetProtagonist.GetNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'střetla','střetl')] s [loser.GetNameNoTooltip] a v [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jejích','jeho')] očích plála odvaha. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'pozvedla svou zbraň a zasadila nepříteli úder do hrudi','pozvedl svou zbraň a zasadil nepříteli úder do hrudi')]. Tekla krev. Vítězství."
 legend_chapter_conclusion_generic: "Cesta domů nebyla snadná, avšak [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vstoupila','vstoupil')] do města za vítězoslavného jásotu. Radujme se tedy a hodujme, neboť legenda o [ROOT.Legend.GetProtagonist.GetNameNoTooltip] si zaslouží být oslavována!"
 legend_chapter_famous_deed_generic: "Legenda o [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] vrcholí podivuhodným dobrodružstvím. [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Její','Jeho')] slavné válečné činy budily úžas všech králů a mnozí šlechtici i prostí lidé přicházeli, aby [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] spatřili na vlastní oči — živoucí legendu z masa a kostí."
 legend_chapter_extra_deed_generic: "Tím však vyprávění nekončí. Když se [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vracela','vracel')] domů, [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'pomáhala','pomáhal')] těm, kdo se ocitli v nebezpečí, a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'mstila','mstil')] křivdy na nich spáchané. Před hněvem [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'její','jeho')] čepele se neskryli lapkové, bestie ani ničemové."
 legend_chapter_opening_debug: "#D Úvodní kapitola#!"
 legend_chapter_motivation_debug: "#D Kapitola o motivaci#!"
 legend_chapter_discovery_debug: "#D Kapitola o objevu#!"
 legend_chapter_hunt_debug: "#D Kapitola o lovu#!"
 legend_chapter_battle_debug: "#D Kapitola o bitvě#!"
 legend_chapter_famous_deed_debug: "#D Kapitola o slavném činu#!"
 legend_chapter_extra_deed_debug: "#D Kapitola o dalším činu#!"
 legend_chapter_conclusion_debug: "#D Závěrečná kapitola#!"
 legend_chapter_motivation_delicious_meats: "Tvor známý jako [Localize(beast)] proslul svou divokostí a nebezpečností, avšak [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'se svého záměru odmítala vzdát','se svého záměru odmítal vzdát')]. [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Toužila','Toužil')] okusit jeho maso a tato vidina [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ji hnala','ho hnala')] vpřed, dokud se sen nestane skutečností."
 legend_chapter_motivation_dead_parent: "Tvor známý jako [Localize(beast)] byl vskutku nebezpečný, avšak odhodláním [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] nic neotřáslo. [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Chovala','Choval')] k té bestii osobní zášť, neboť se povídalo, že připravila o život jednoho z [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jejích','jeho')] rodičů."
 legend_chapter_motivation_great_venator: "V té době už [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'proslula','proslul')] po celé zemi jako její největší [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'lovkyně','lovec')]. [ROOT.Legend.GetProtagonist.GetTitleAsNameNoTooltip|U] však [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'hodlala','hodlal')] svou pověst stvrdit ještě velkolepějším činem."
 legend_chapter_motivation_accomplished_hunter: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'byla odhodlána','byl odhodlán')] dokázat svou cenu na lovu. Když se přiblížil mocný tvor známý jako [Localize(beast)], konečně nadešla příležitost předvést své umění."
 legend_chapter_discovery_befriended_cyclops: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'dokázala','dokázal')] nalézt přítele v každém podivuhodném a neobyčejném tvoru, kterého na cestách [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'potkala','potkal')], a dokonce se [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'spřátelila','spřátelil')] s obrovským a popudlivým kyklopem!"
 legend_chapter_discovery_cyclops: "Na svých cestách [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'potkávala','potkával')] ty nejpodivuhodnější a nejneobvyklejší lidi, až nakonec [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'objevila','objevil')], že skutečně existuje i mocný kyklop!"
 legend_chapter_discovery_renowned_herbalist: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] už [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'byla proslulou bylinkářkou','byl proslulým bylinkářem')], další slávu si však [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vydobyla','vydobyl')], když [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'objevila','objevil')] smrtící háj jedovatých rostlin a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'proklouzla','proklouzl')] mezi jejich jedovatými úponky."
 legend_chapter_discovery_evil_plants: "Cesty [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] byly od samého počátku plné nebezpečí. Dokonce [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ji napadl','ho napadl')] háj jedovatých rostlin, jejichž pyl omamoval a mátl každého, kdo se přiblížil na dosah."
 legend_chapter_discovery_legendary_archer: "Cesty zavedly [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] do kraje, kde se vychloubal jistý lučištník a vyzval [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'urozenou paní','urozeného pána')] k soutěži v lukostřelbě. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] však jediným vlastním šípem pohotově rozštípl šíp svého soupeře vedví!"
 legend_chapter_discovery_archery_contest_won: "Cesty zavedly [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] do kraje, kde se vychloubal jistý lučištník a vyzval [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'urozenou paní','urozeného pána')] k soutěži v lukostřelbě. Souboj byl urputný, ale nakonec [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'prokázala','prokázal')], že [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'její šípy nacházejí cíl přesněji','jeho šípy nacházejí cíl přesněji')]."
 legend_chapter_discovery_bog_stronk: "Cesta [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] vedla zrádnou krajinou, kde se dokonce sama země pokusila [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ji stáhnout','ho stáhnout')] pod svůj povrch. Jen nesmírná síla, kterou [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vládla','vládl')], [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí umožnila vyprostit se','mu umožnila vyprostit se')] z jejího sevření."
 legend_chapter_discovery_bog_struggle: "Cesta [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] vedla zrádnou krajinou, kde se dokonce sama země pokusila [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ji stáhnout','ho stáhnout')] pod svůj povrch. Po urputném zápase se [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] nakonec [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vyprostila','vyprostil')] ze sevření zrádné půdy."
 legend_chapter_discovery_wildflower_expert: "Cesty zavedly [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] do nových a cizokrajných zemí, kde byly neznámé a podivuhodné dokonce i rostliny. V listnatém podrostu tam [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'objevila','objevil')] rostlinu, jakou prý nikdo nikdy předtím ani potom nespatřil."
 legend_chapter_discovery_cannibal_scarred: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'procestovala','procestoval')] daleké kraje a dokonce [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'padla','padl')] do spárů vyhladovělých lidojedů! Desítky z nich [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'přemohla','přemohl')] a jizvy ve tváři pak po zbytek života svědčily o krutosti onoho střetu."
 legend_chapter_discovery_cannibal_fight: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'procestovala','procestoval')] daleké kraje a dokonce [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'padla','padl')] do spárů vyhladovělých lidojedů! Boj trval až do západu slunce a teprve poté zbylí lidojedi uprchli, zatímco naše [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'hrdinka zůstala vyčerpaná','hrdina zůstal vyčerpaný')]."
 legend_chapter_battle_enemy_commander: "Uprostřed bitevní vřavy se [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ocitla','ocitl')] tváří v tvář nikomu menšímu než samotnému proklatému nepřátelskému veliteli! Po velkolepém souboji [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] toho podlého psa [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'srazila','srazil')] k zemi a zatímco kolem dál zuřila bitva, po [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'její','jeho')] čepeli stékala krev."
 legend_chapter_battle_faked_retreat: "Válečný důvtip [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] prošel zkouškou v ohni bitvy a [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'dokázala','dokázal')], že je jí [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'hodna','hoden')]. Lstivě předstíraný ústup vlákal nepřítele do zranitelného postavení, načež naše [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'statečná hrdinka znovu vyrazila vpřed a pobila jeho řady','statečný hrdina znovu vyrazil vpřed a pobil jeho řady')]."
 legend_chapter_battle_flanking_success: "Na bitevním poli se znovu ukázala smělost a brilantní válečnický důvtip [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U], když [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'osobně vedla','osobně vedl')] drtivý útok z boku. Zbabělý nepřítel zaváhal a dal se na útěk; jediný úder rozhodl celý den."
 legend_chapter_battle_ravished_maiden: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] nikdy [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nenechávala','nenechával')] nevinné napospas smrti a dokonce si uprostřed bitevní vřavy [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'našla','našel')] čas nejen zachránit půvabnou dívku prostého původu, která se zatoulala do nebezpečí, ale dokonce se jí #EMP zmocnit#!!"
 legend_chapter_battle_maiden_kiss: "Když [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] uprostřed bitevní vřavy [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'spatřila','spatřil')] bezmocnou, avšak vskutku půvabnou dívku prostého původu, bez váhání [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'přispěchala','přispěchal')] na pomoc a odnesla ji do bezpečí. Naše [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'hrdinka byla vzápětí odměněna polibkem, jak se na ženu takové udatnosti sluší','hrdina byl vzápětí odměněn polibkem, jak se na muže takové udatnosti sluší')]!"
 legend_chapter_battle_wounded: "Bitva byla zuřivá a boj nelítostný. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] v něm [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'utrpěla','utrpěl')] mnoho trvalých zranění; nepatrná cena pro [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ženu tak pevného odhodlání a cti','muže tak pevného odhodlání a cti')]!"
 legend_chapter_battle_reinforcement_arrival: "Když bitva dospěla k vrcholu, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'sama dorazila','sám dorazil')] v čele mohutných posil. Štěstěna se tak obrátila ve prospěch naší [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'statečné hrdinky, která vedla útok hluboko do nepřátelských řad','statečného hrdiny, který vedl útok hluboko do nepřátelských řad')]."
 legend_chapter_opening_new_faith: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'se narodila','se narodil')] v časech, kdy náboženství [ROOT.Legend.GetProperty('religion').Religion.GetNameNoTooltip] hluboce upadlo a vzdálilo se pravé víře. Kazatelé a [ROOT.Legend.GetProperty('faith').Faith.PriestNeuterPlural] hlásali kacířství, zatímco [ROOT.Legend.GetProperty('faith').Faith.HouseOfWorshipPlural] pustly a chátraly. Lid se obracel k jiným náboženstvím a cizí víry si tak podmaňovaly srdce lidí."
 legend_chapter_motivation_new_faith: "Když [ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'spatřila','spatřil')] slabost a zkaženost víry, [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'povstala','povstal')] s novou vizí pro [ROOT.Legend.GetProperty('religion').Religion.GetNameNoTooltip] — s vírou pevnou a jednotnou, jež nepřipustí žádný odklon od toho, co žádá [ROOT.Legend.GetProperty('faith').Faith.PantheonTerm], a rozšíří se až do nejzazších koutů světa!"
 legend_chapter_famous_deed_new_faith: "Ve snaze uniknout prázdnému blábolení kacířů [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vystoupala','vystoupal')] [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] na nejvyšší horu celé země a svou bezpečnost [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'svěřila','svěřil')] pouze milosti, již skýtá [ROOT.Legend.GetProperty('faith').Faith.HealthGodName]. Na vrcholu se před [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ní','ním')] rozestoupila oblaka a zjevil se [ROOT.Legend.GetProperty('faith').Faith.PantheonTerm], aby [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí','mu')] seslal vidění. Na smrtelném loži se choulila vyzáblá postava, [ROOT.Legend.GetProperty('faith').Faith.PriestNeuter] starých časů, která se zoufale držela života, zatímco mnohem mladší [ROOT.Legend.GetProperty('faith').Faith.PriestNeuter] ukládal svého předchůdce k věčnému odpočinku. Nebylo pochyb: vidění zvěstovalo, že [ROOT.Legend.GetProperty('faith').Faith.PantheonTerm] žehná nové víře [ROOT.Legend.GetProperty('faith').Faith.GetNameNoTooltip]."
 legend_chapter_extra_deed_new_faith: "Lidstvo si během věků vytvořilo bezpočet falešných mocností, jež se stavěly po bok toho, koho představuje [ROOT.Legend.GetProperty('faith').Faith.PantheonTerm]. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] je však jednu po druhé [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'strhla','strhl')] z jejich piedestalů a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'shromáždila kolem sebe nesmírné stádo, které nyní vede jako pastýřka své víry','shromáždil kolem sebe nesmírné stádo, které nyní vede jako pastýř své víry')]."
 legend_chapter_conclusion_new_faith: "Kněžstvo [ROOT.Legend.GetProperty('faith').Faith.PriestNeuterPlural] se shromáždilo a posvátný text „[ROOT.Legend.GetProperty('faith').Faith.ReligiousText|U]“ získal novou podobu. [ROOT.Legend.GetProperty('religion').Religion.GetNameNoTooltip|U] se tak konečně podařilo obnovit podle vize, již zjevil [ROOT.Legend.GetProperty('faith').Faith.PantheonTerm]!"
 legend_chapter_battle_legendary_battle: "$legendary_battle_desc$"
 legend_chapter_opening_struggle: "Do bouřlivého víru událostí známých jako [ROOT.Legend.GetProperty('struggle').GetFlagName] se [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'zrodila','zrodil')] [ROOT.Legend.GetProtagonist.GetNameNoTooltip], aniž [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'tušila','tušil')], že právě [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ona má','on má')] jednoho dne přinést kraji mír a řád."
 legend_chapter_motivation_struggle: "Když [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'viděla','viděl')], jak bratr pozvedá zbraň proti bratru a [ROOT.Legend.GetProtagonist.GetFaith.GetAdherentNameNoTooltip] proti [ROOT.Legend.GetProtagonist.GetFaith.GetAdherentNameNoTooltip], [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'pronesla','pronesl')] jen: „Dost.“ Bylo [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí','mu')] jasné, že sváry [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jejího','jeho')] lidu musejí skončit a že z trosek toho, čemu se říká [ROOT.Legend.GetProperty('struggle').GetFlagName], musí být vytesána nová budoucnost."
 legend_chapter_extra_deed_struggle: "Přes všechnu velikost, jíž [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'dosáhla','dosáhl')], stále zůstávali tací, kteří pochybovali o [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'její','jeho')] vizi, jak ukončit [ROOT.Legend.GetProperty('struggle').GetFlagName]. Brzy však byli [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'její','jeho')] protivníci poraženi jak na bojišti slov, tak na bojišti zbraní, až nakonec všichni klečeli u [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jejích','jeho')] nohou a žadonili o milost."
 legend_chapter_conclusion_ended_struggle: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'poznala','poznal')], že svět se řídí špatnými pravidly. Díky [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jejímu','jeho')] úsilí však to, čemu se říká [ROOT.Legend.GetProperty('struggle').GetFlagName], konečně skončilo a kraj už nikdy nebude jako dřív. Nad všemi ostatními nyní vítězně povstává [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U], [ROOT.Legend.GetProtagonist.GetTitleAsNameNoTooltip|U]."
 legend_chapter_opening_priesthood_restoration: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'přišla','přišel')] na svět v čase, kdy byli věřící [ROOT.Legend.GetProperty('faith').Faith.GetName] rozprášeni po světě v beznadějné diaspoře. V mysli [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí','mu')] však zářila vidina svatyně [ROOT.Legend.GetProperty('faith').Faith.HouseOfWorship], tyčící se nad celým stvořením, a [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'věděla','věděl')], že [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí','mu')] [ROOT.Legend.GetProperty('faith').Faith.HighGodName] svěřil svaté poslání: sjednotit všechny [ROOT.Legend.GetProperty('faith').Faith.GetAdherentNamePluralNoTooltip]."
 legend_chapter_famous_deed_religious: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'zasvětila','zasvětil')] celý svůj život víře, v jejímž středu stojí [ROOT.Legend.GetProperty('faith').Faith.HighGodName], a každý svůj čin [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'konala','konal')] podle božské vůle. Po celé zemi putovali [ROOT.Legend.GetProperty('faith').Faith.GetReligion.GetAdherentNameNoTooltip|U] se jménem „[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]“ na rtech a vyprávěli o nesčetných zázracích, jež se s tímto jménem pojily."
 legend_chapter_extra_deed_religious: "Ani tím však příběh neskončil. Věrné stále sužovali lapkové a ničemové a kacíři je poutali do otroctví! [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'pomáhala','pomáhal')] těm, kdo žili pod útlakem, povstat a nalézt útočiště ve víře, v jejímž středu stojí [ROOT.Legend.GetProperty('faith').Faith.HighGodName|U]. Ať už proti nim stál [ROOT.Legend.GetProperty('faith').Faith.DevilName] či jeho služebníci, vítězství nakonec vždy připadlo věrným."
 legend_chapter_conclusion_priesthood_restored: "Kněží byli znovu shromážděni a diaspora skončila. Už nikdy nebudou [ROOT.Legend.GetProperty('faith').Faith.GetAdherentNamePluralNoTooltip] rozptýleni do všech stran bez vedení, neboť [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] nyní uvádí do nové éry [ROOT.Legend.GetProperty('faith').Faith.ReligiousHeadName]."
 legend_chronicle_opening_exotic_backstory: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'přicestovala','přicestoval')] z daleké a tajemné země zvané [ROOT.Legend.GetProperty('location').GetFlagName] s jasným posláním. Ve své domovině [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'byla hrdinkou svého lidu','byl hrdinou svého lidu')], nyní však přichází, aby svou přízní [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'obdařila','obdařil')] i náš nepatrný kout tohoto nesmírného světa."
 legend_chronicle_motivation_exotic_backstory: "Když [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'spatřila','spatřil')] svůj nový domov, [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'zaplakala','zaplakal')]. Jeho umění, vědění i kultura byly žalostně primitivní proti divům, na něž [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'byla zvyklá','byl zvyklý')] v zemi zvané [ROOT.Legend.GetProperty('location').GetFlagName]. Úkol byl jasný: [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] musí do tohoto koutu stvoření přinést světlo své vzdálené domoviny."
 legend_chronicle_conclusion_exotic_backstory: "Od příchodu [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] se mnohé změnilo. Tam, kde se kdysi rolníci váleli v bídě a barbaři vysávali zemi do krve, nyní zářilo světlo civilizace, které [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'rozšířila','rozšířil')]. Na cestě [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí','mu')] leželo mnoho kamenů, [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ona je však všechny posbírala','on je však všechny posbíral')] a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vystavěla','vystavěl')] z nich nový [ROOT.Legend.GetProperty('location').GetFlagName]. Po celém panství dnes dostávají novorozeňata jméno [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] a davy zpívají vděčné chvalozpěvy na [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'cizinku','cizince')] ze země zvané [ROOT.Legend.GetProperty('location').GetFlagName], [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'která jim vystavěla','který jim vystavěl')] veliké město."
 legend_chronicle_divine_intervention_motivation: "[Localize(god)|U] promlouvá k [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ve světě snů a svěřuje [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí','mu')] svaté poslání. Od té chvíle se [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] modlí a putuje zemí v naději, že nalezne znamení, jež [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí','mu')] odhalí pravou podstatu úkolu, který [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí','mu')] určil [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm]."
 legend_chapter_famous_deed_divine_intervention: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'zasvětila','zasvětil')] svůj život víře, v jejímž středu stojí [Localize(god)], a ve všem se [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'řídila','řídil')] vůlí [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm]. Po mnoha dnech a nocích strávených o samotě v modlitbách [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí','mu')] byla konečně odhalena pravá podstata [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jejího','jeho')] poslání!"
 legend_chapter_extra_deed_divine_intervention: "Země se hemžila bezcitnými lapky, kteří ubližovali věřícím, avšak [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] se svou družinou věrných tyto služebníky zla [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'zahnala','zahnal')] tam, kam podle víry náleželi: [ROOT.Legend.GetProtagonist.GetFaith.NegativeAfterLife|U]. Lid byl opět svobodný. [Localize(god)|U] od té chvíle shlíží s přízní na [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] za dobro, které [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vykonala','vykonal')], a završení svatého poslání se přiblížilo."
 legend_chapter_conclusion_divine_intervention: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vládla spravedlivě a zbožně','vládl spravedlivě a zbožně')] a na své cestě se [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'řídila','řídil')] znameními, která sesílá [Localize(god)]. Božský plán byl naplněn a [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'prožila','prožil')] život naplněný velikou ctí a zbožností."
 legend_chapter_opening_ancestral_glory: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vzešla','vzešel')] z masa a krve prastarého rodu, na jehož počátku stojí [ROOT.Legend.Custom('GetAncestorNameNoTooltip')]. S mocí tak vznešeného původu v žilách mohl snad někdo pochybovat, že [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'je předurčena','je předurčen')] k velikým činům?"
 legend_chapter_motivation_ancestral_glory: "V mysli [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] nebylo nejmenších pochyb: celá země známá jako [ROOT.Legend.GetProperty('title').Title.GetBaseNameNoTooltip] bude sjednocena pod [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'její','jeho')] vládou. V srdci [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí','mu')] přitom znělo jediné jméno — [ROOT.Legend.Custom('GetAncestorFirstNameNoTooltip')]. Malicherné sváry nižších pánů a dam měly skončit a všichni měli uznat [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] za [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'svou lenní paní','svého lenního pána')]."
 legend_chapter_famous_deed_ancestral_glory: "Pošetilci se houfně stavěli proti [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip], ale byli jen větrem narážejícím do hory. S každým podivuhodným činem, který [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vykonala','vykonal')] ve službě víře, v jejímž středu stojí [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm], rostl zástup [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jejích','jeho')] následovníků. Nakonec lidé šeptali, že [ROOT.Legend.Custom('GetAncestorFirstNameNoTooltip')] znovu kráčí světem."
 legend_chapter_extra_deed_ancestral_glory: "Kraj známý jako [ROOT.Legend.GetProperty('title').Title.GetBaseNameNoTooltip] byl od časů, které ještě pamatují jméno [ROOT.Legend.Custom('GetAncestorFirstNameNoTooltip')], vydán napospas lupičům a lapkům. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] se však bez prodlení [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'pustila','pustil')] do nápravy křivd a ochrany lidu, nad nímž [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí','mu')] po právu náležela vláda."
 legend_chapter_conclusion_ancestral_glory: "Cesta byla plná nebezpečí, ale po všem, co [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vykonala','vykonal')] pro zemi známou jako [ROOT.Legend.GetProperty('title').Title.GetBaseNameNoTooltip] a její lid, mohl snad někdo pochybovat, že právě [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí','jemu')] je vláda souzena z vůle nebes? Od městských hradeb až po nejubožejší chalupu všichni v radostném vytržení volají: „[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]!“"
 legend_chapter_opening_ancient_people: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vzešla','vzešel')] z mocného rodu [ROOT.Legend.GetProperty('culture').Culture.GetNameNoTooltip] kultury, aby [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vládla','vládl')] zemi zvané [ROOT.Legend.GetProperty('title').Title.GetBaseNameNoTooltip] tak, jak jí vládli dávní předkové."
 legend_chapter_conclusion_ancient_people: "S nesmírným úsilím [ROOT.Legend.GetProtagonist.GetNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'neúnavně pracovala','neúnavně pracoval')], aby zemi [ROOT.Legend.GetProperty('title').Title.GetNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'proměnila','proměnil')] v dokonalý obraz toho, čím má být [ROOT.Legend.GetProperty('culture').Culture.GetNameNoTooltip] kultura. Jen díky legendárním činům [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] se dnes lid této země hrdě hlásí ke svým [ROOT.Legend.GetProperty('culture').Culture.GetNameNoTooltip] kořenům!"
 legend_chapter_motivation_saintly_deed: "Poslání [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] bylo jasné: má konat zázraky! Všichni [ROOT.Legend.GetProperty('religion').Religion.GetAdherentNamePluralNoTooltip] nosí ve svých srdcích jméno [ROOT.Legend.Custom('GetAncestorNameNoTooltip')], nikdo však ještě netušil, jaké divy [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] teprve vykoná."
 legend_chapter_extra_deed_saintly_deed: "Cesty věřících sužovali bezbožníci, a tak je [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] s čepelí požehnanou nebesy [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'zahnala','zahnal')] na útěk. Ani poté však nebylo po nebezpečí: na stezky se zatoulávaly divoké šelmy a hadi a napadali poutníky. Tehdy [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'rozezněla','rozezněl')] hudební nástroj označovaný jako [ROOT.Legend.GetProtagonist.Custom('GetMusicalInstrument')] a jeho tóny odvedly stvoření, v nichž dřímal [ROOT.Legend.GetProtagonist.GetFaith.CreatorNamePossessive] dech, daleko od obydlených zemí."
 legend_chapter_conclusion_saintly_deed: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'neúnavně sloužila','neúnavně sloužil')] všem, kdo vyznávají [ROOT.Legend.GetProperty('religion').Religion.GetNameNoTooltip], a zde na zemi [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'bojovala','bojoval')] proti přisluhovačům sil, jimž vládne [ROOT.Legend.GetProtagonist.GetFaith.DevilName]. Nakonec však všechny zápasy skončily. Božský plán byl naplněn a [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'prožila','prožil')] život naplněný velikou ctí a zbožností."
 legend_chapter_opening_mythical_descent: "Stejně jako všichni z rodu [ROOT.Legend.GetProtagonist.GetDynastyNameNoTooltip] před [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ní','ním')] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nesla','nesl')] [ROOT.Legend.GetProtagonist.GetNameNoTooltip] už od narození v krvi odkaz tvora známého jako [ROOT.Legend.GetProperty('beast').GetFlagName]. Tak neobyčejný původ [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ji staví','ho staví')] nad ostatní a předurčuje k velikosti."
 legend_chapter_famous_deed_mythical_descent: "Ve veliké bitvě proti ničemovi, který zpochybnil [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'její','jeho')] původ, [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'utrpěla','utrpěl')] [ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] zranění a božská krev skropila celé bojiště. Zářila a třpytila se jako čerstvě vybroušené drahokamy a během několika dní z nehostinné půdy vyrašily květy nádherných barev."
 legend_chapter_extra_deed_mythical_descent: "Ani tím však příběh nekončí, neboť mnozí stále pochybovali o božství proudícím v krvi [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]. [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Svou velikou mocí seslala','Svou velikou mocí seslal')] [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] na pochybovače strašlivou pohromu šelem, až se jejich paláce a domovy naplnily hladovým řevem, štěkotem a vřískotem."
 legend_chapter_opening_godly_descent: "U početí dávného předka stálo samo božství — [ROOT.Legend.GetProperty('god').GetFlagName|U] — a z lůna světa tak vzešel první člen rodu, který dnes známe jako [ROOT.Legend.GetProtagonist.GetDynastyNameNoTooltip]. Od narození nese každý, kdo náleží k tomuto rodu, posvátné poslání: přinášet blahobyt a víru [ROOT.Legend.GetProtagonist.GetFaith.GetNameNoTooltip] do všech koutů země známé jako [ROOT.Legend.GetProperty('title').Title.GetBaseNameNoTooltip]."
 legend_chapter_famous_deed_war_won: "Bitvy se přelévaly sem a tam a válka barvila zemi do ruda krví spravedlivých i ničemů bez rozdílu. [ROOT.Legend.GetProperty('winner').Char.GetNameNoTooltip|U] však [Select_CString(ROOT.Legend.GetProperty('winner').Char.IsFemale,'zůstávala neochvějná','zůstával neochvějný')], zatímco síly zla marně hledaly způsob, jak přelstít [Select_CString(ROOT.Legend.GetProperty('winner').Char.IsFemale,'její','jeho')] mistrovské válečné plány. Veškeré jejich úsilí nakonec přišlo vniveč."
 legend_chapter_conclusion_war_won: "[ROOT.Legend.GetProperty('loser').Char.GetNameNoTooltip|U] a [Select_CString(ROOT.Legend.GetProperty('loser').Char.IsFemale,'její','jeho')] přisluhovači skláněli hlavy pod potrhaným praporcem a žadonili u [ROOT.Legend.GetProperty('winner').Char.GetFirstNameNoTooltip] o milost. V nejtemnějších dnech války si [ROOT.Legend.GetProperty('winner').Char.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProperty('winner').Char.IsFemale,'dokázala představit sama sebe nanejvýš jako tu, která válku přežije','dokázal představit sám sebe nanejvýš jako toho, kdo válku přežije')]. Nyní však [Select_CString(ROOT.Legend.GetProperty('winner').Char.IsFemale,'vychází z války jako vítězka. Jediná vítězka','vychází z války jako vítěz. Jediný vítěz')]."
 legend_chapter_motivation_new_title: "Dávno předtím, než se rod [ROOT.Legend.GetProperty('founder').Char.GetDynastyNameNoTooltip] stal správcem země známé jako [ROOT.Legend.GetProperty('title').Title.GetBaseNameNoTooltip], se [ROOT.Legend.GetProperty('founder').Char.GetNameNoTooltip] dostalo vidění od [ROOT.Legend.GetProperty('founder').Char.GetFaith.PantheonTerm]. Od té chvíle [Select_CString(ROOT.Legend.GetProperty('founder').Char.IsFemale,'věděla, že se narodila k vládě','věděl, že se narodil k vládě')]."
 legend_chapter_famous_deed_new_title: "Země, z nichž se jednou měla zrodit [ROOT.Legend.GetProperty('title').Title.GetBaseNameNoTooltip], drtili pod svou patou strašliví služebníci sil, jimž vládne [ROOT.Legend.GetProperty('founder').Char.GetFaith.DevilName]. V čele velikých vojsk však [ROOT.Legend.GetProperty('founder').Char.GetNameNoTooltip] [Select_CString(ROOT.Legend.GetProperty('founder').Char.IsFemale,'osvobozovala','osvobozoval')] vesnici za vesnicí a město za městem. Lid povstal se zbraní v ruce, svrhl své zlovolné pány a přidal se k [ROOT.Legend.GetProperty('founder').Char.GetFirstNameNoTooltip], připraven zemřít za [Select_CString(ROOT.Legend.GetProperty('founder').Char.IsFemale,'svou právoplatnou vládkyni','svého právoplatného vládce')]. Takovou oběť však nebylo třeba přinést, neboť [ROOT.Legend.GetProperty('founder').Char.GetFaith.HighGodName] seslal na vojsko božskou ochranu. Žádná čepel se nedokázala dotknout rostoucích zástupů [ROOT.Legend.GetProperty('founder').Char.GetFirstNameNoTooltip], zatímco [Select_CString(ROOT.Legend.GetProperty('founder').Char.IsFemale,'osvobozovala','osvobozoval')] lid země známé jako [ROOT.Legend.GetProperty('title').Title.GetBaseNameNoTooltip]."
 legend_chapter_conclusion_new_title: "Hašteření vévodů a bezvýznamných drobných šlechticů konečně skončilo, když je [ROOT.Legend.GetProperty('founder').Char.GetNameNoTooltip] všechny [Select_CString(ROOT.Legend.GetProperty('founder').Char.IsFemale,'přinutila pokleknout a přísahat jí věčnou věrnost','přinutil pokleknout a přísahat mu věčnou věrnost')]. Když se země známá jako [ROOT.Legend.GetProperty('title').Title.GetBaseNameNoTooltip] zrodila v nové podobě, změnil se navždy i obraz světa."
 legend_chronicle_sacred_birth_opening: "Od samého narození bylo zřejmé, že [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] má s [ROOT.Legend.GetProtagonist.GetNameNoTooltip] veliké úmysly. [ROOT.Legend.Custom('GetBirthCircumstancesLegend')|U] bylo znamením, že [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'její','jeho')] velikost je předurčena."
 born_to_a_virgin_mother: "zrození z panenské matky"
 born_under_auspicious_stars: "zrození pod příznivými hvězdami"
 legend_chapter_motivation_sacred_birth: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'strávila bezpočet bezesných nocí sužována','strávil bezpočet bezesných nocí sužován')] vidinami vlastního narození, až se jedné osudové noci zjevil [ROOT.Legend.GetProtagonist.GetFaith.HighGodName|U]. Tehdy [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'uslyšela, že byla seslána na svět s božským posláním, jež dalece přesahuje obyčejný úděl ženy','uslyšel, že byl seslán na svět s božským posláním, jež dalece přesahuje obyčejný úděl muže')]. Od toho dne [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'věděla','věděl')], že okolnosti [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jejího','jeho')] narození nejsou pouhou pověstí ani náhodou, nýbrž přímým zásahem [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm]!"
 legend_chapter_conclusion_sacred_birth: "Po všech velikých činech, které [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vykonala','vykonal')] ve službě [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm], přišlo další zjevení — tentokrát však nešlo o pouhý sen či vidinu. [ROOT.Legend.GetProtagonist.GetFaith.HighGodName|U] se zjevil v tělesné podobě a nabídl [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] pohár vody. Jediný doušek [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí propůjčil','mu propůjčil')] jiskru božství. Davy provolávaly jméno „[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]“ a žadonily, aby se jich dotkly [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'její božské, uzdravující ruce','jeho božské, uzdravující ruce')]."
 legend_chronicle_unsuspecting_opening: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'se narodila jako každá jiná žena','se narodil jako každý jiný muž')], aniž by [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'tušila','tušil')] velikost činů, které jednou vykoná ve službě [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm]."
 legend_chapter_motivation_fought_devil: "Noční můry nedávaly [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] pokoje. Ve vidinách se zjevoval [ROOT.Legend.GetProperty('faith').Faith.DevilName], syčel a trýznil [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ji','ho')]. Každého rána se však [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'probouzela','probouzel')] s ještě pevnějším odhodláním a rostoucí jistotou, že [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] má pro [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ni','něj')] zvláštní úkol."
 legend_chapter_famous_deed_fought_devil: "Jedné noci se před [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] zjevil [ROOT.Legend.GetProperty('faith').Faith.DevilName|U] v síni, jejíž krví potřísněné stěny lemovaly biče a všemožné nástroje krutého mučení. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'stanula nahá, avšak neochvějná, a vrhla se','stanul nahý, avšak neochvějný, a vrhl se')] na něj se silou a přesvědčením pramenícími z víry, v jejímž středu stojí [ROOT.Legend.GetProperty('faith').Faith.HighGodName|U]. Když pak [ROOT.Legend.GetProperty('faith').Faith.DevilName|U] bezmocně ležel pod [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jejím','jeho')] sevřením, odporná bestie jen syčela a vrčela. Samotné zlo bylo pokořeno pouhou [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ženou','mužem')]!"
 legend_chapter_extra_deed_fought_devil: "Ani porážka neutišila nenávist, kterou [ROOT.Legend.GetProperty('faith').Faith.DevilName|U] choval ke všemu dobrému a spravedlivému, a tak vyzval [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] k hudebnímu klání na nástroj zvaný [ROOT.Legend.GetProtagonist.Custom('GetMusicalInstrument')]. Jakmile [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'zahrála','zahrál')] svou melodii, [ROOT.Legend.GetProperty('faith').Faith.DevilName|U] se před jejími tóny rozplynul a zmizel tam, kam podle víry náleží: [ROOT.Legend.GetProperty('faith').Faith.NegativeAfterLife|U]. Samotná melodie pak vyvanula z mysli [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] jako dým — bezpochyby byla příliš božská pro svět smrtelníků."
 legend_chapter_conclusion_fought_devil: "Když byl [ROOT.Legend.GetProperty('faith').Faith.DevilName|U] poražen, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'zasvětila','zasvětil')] svůj život potírání sil zla ve světě smrtelníků. Po všechny své dny [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'kráčela obklopena','kráčel obklopen')] svatou září a všude, kudy [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'prošla','prošel')], zanechávala mír a civilizaci."
 legend_chapter_famous_deed_tournament_won: "Na velikém turnaji se střetávaly důvtip a slova stejně prudce jako čepele, avšak žádná mysl nebyla bystřejší a žádná čepel ostřejší než ta, kterou [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vládla','vládl')] [ROOT.Legend.GetProtagonist.GetNameNoTooltip]! Jeden soupeř za druhým nastupoval proti [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip], jen aby odcházel se slzami v očích, neboť [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nepřemožitelnou šampionku','nepřemožitelného šampiona')] nedokázal nikdo překonat."
 legend_chapter_extra_deed_tournament_won: "Nikdo nedokázal zapomenout na slávu prvního turnaje [ROOT.Legend.GetProtagonist.GetNameNoTooltip], jediné vítězství však [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí','mu')] nestačilo. Ostatní soutěžící [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ji obklopili','ho obklopili')] bouří čepelí, ale [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'zůstala neochvějná','zůstal neochvějný')]. Nakonec [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vyšla z klání jako vítězka','vyšel z klání jako vítěz')] za řevu davu, který skandoval [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'její','jeho')] jméno!"
 legend_chronicle_opening_raised_by_animals: "Bez potravy a bez naděje na záchranu ležela [ROOT.Legend.GetProtagonist.GetNameNoTooltip] jako nemluvně opuštěná u řeky, dokud ji nenalezla mocná samice tvora známého jako [ROOT.Legend.GetProperty('beast').GetFlagName]. Kojila dítě vlastním mlékem a pod její ochranou z něj [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vyrostla žena herkulovské síly a odvahy','vyrostl muž herkulovské síly a odvahy')]."
 legend_chapter_motivation_raised_by_animals: "Když se [ROOT.Legend.GetProtagonist.GetFirstName] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vrátila','vrátil')] mezi lidi, [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'spatřila','spatřil')], jaký chaos zachvátil zemi. Soused se vrhal na souseda jako [ROOT.Legend.GetProperty('beast').GetFlagName] na svou kořist a [ROOT.Legend.GetProtagonist.GetFirstName] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'pochopila','pochopil')], že [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'její','jeho')] lid potřebuje silného vůdce, jenž sjednotí smečku za společným cílem."
 legend_chapter_conclusion_raised_by_animals: "[ROOT.Legend.GetProtagonist.GetFirstName|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vládla','vládl')] stejně, jako žije tvor známý jako [ROOT.Legend.GetProperty('beast').GetFlagName] — silně a hrdě. Přestože svou zvířecí matku už nikdy [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nespatřila','nespatřil')], [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nepochybovala','nepochyboval')], že tato poselkyně [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] shlíží na [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'její','jeho')] vládu s velikou pýchou. Země zůstala klidná a pokojná a žádný nepřítel se neodvážil vybočit z řady, aby na sebe nepřivolal zuřivost tvora známého jako [ROOT.Legend.GetProperty('beast').GetFlagName]."
 legend_chapter_extra_deed_recent_battle: "Při návratu domů [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'statečně čelila','statečně čelil')] svým nepřátelům a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vedla','vedl')] vojsko s nepřekonatelnou odvahou a válečnickým důvtipem. S mečem vztyčeným k nebi a neochvějným odhodláním v srdci [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'strhla','strhl')] své bojovníky k vítězství."
 legend_chapter_extra_deed_recent_siege: "Při návratu domů se [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'postavila','postavil')] do čela obléhání nepřátelské pevnosti s neochvějným odhodláním a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'rozdrtila','rozdrtil')] ji jako nejkřehčí sklo. Vojska se seřadila, praporce zavlály a [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vedla','vedl')] neúprosný útok, který prolomil obranu a přinesl vítězství."
 legend_chapter_extra_deed_recent_imprisonment: "V hlubinách nejtemnějšího žaláře, bez jídla a vody, v okovech a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'obklopená','obklopený')] stíny, [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nalezla','nalezl')] [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] odhodlání potřebné k útěku. Se zatnutými zuby a srdcem planoucím vzdorem [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'spřádala','spřádal')] noc co noc plán úniku. Díky lsti a pouhé síle vůle nakonec [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'pronikla','pronikl')] tajnými chodbami až do ranního světla."
 legend_chapter_extra_deed_recent_tournament: "Při návratu domů [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'stanula okouzlena','stanul okouzlen')] nádherou velkolepého turnajového kolbiště. S mečem v ruce a zbrojí třpytící se ve slunečním svitu [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'čelila','čelil')] hrozivým soupeřům s neochvějným odhodláním. Dav bouřil, krásné dámy i nezkušení pážata se vrhali k [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jejím','jeho')] nohám! [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Vítězka! Nejlepší rytířka','Vítěz! Nejlepší rytíř')]!"
 legend_chapter_famous_deed_saintly_deed: "Uprostřed šeptaných pochybností a stínů nedůvěry lidu zůstala víra [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] neochvějná. Vše se zdálo ztraceno. Bojiště rudlo krví a kopí, opuštěná svými nositeli, trčela ze země. Tehdy [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'padla','padl')] na kolena a z [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jejích','jeho')] rtů plynuly modlitby. Z kopí náhle vykvetly květy a nepřátelé se zhroutili k zemi, neboť právě spatřili zázrak."
 legend_chapter_famous_deed_holy_warrior: "[ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] vždy [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'stála','stál')] pevně na obranu víry a ve svaté válce proti nepřátelům víry, v jejímž středu stojí [ROOT.Legend.GetProtagonist.GetFaith.HighGodName], se [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'projevila jako skutečná hrdinka','projevil jako skutečný hrdina')]. [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Vydala','Vydal')] se do cizích zemí s odhodláním navrátit mír a blahobyt lidem, které falešní bohové připravili o obojí. Do předloktí si [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vyřízla','vyřízl')] symbol víry [ROOT.Legend.GetProtagonist.GetFaith.GetNameNoTooltip] a krev stékala na těla nevěřících."
 legend_chapter_opening_legendary_battle: "V kronikách věků plane příběh bitvy tak slavné, že její ozvěna zní samotnou věčností — bitvy, v jejíž válečné bouři [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'stanula jako kolos','stanul jako kolos')]."
 legend_chapter_famous_deed_raised_by_animals: "S každým dalším dnem [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'sílila a nabývala moudrosti','sílil a nabýval moudrosti')], [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nedotčená','nedotčený')] změkčilostí civilizace. Jako zakladatelé Říma [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'přijala','přijal')] svět, který [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí','mu')] dal život, a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'naučila','naučil')] obyvatele domů pravému umění lovu. Vrcholem bylo skolení bílé šelmy známé jako [ROOT.Legend.GetProtagonist.Custom('RegionalFerociousAnimal')]."
 legend_chapter_conclusion_dead_loved_spouse: "Když se [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vrátila','vrátil')] domů, srdce [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí','mu')] tlouklo jako drobná holubice, která se každou chvíli chystá vyletět z hrudi. [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Plná','Plný')] očekávání [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'toužila','toužil')] znovu sevřít svou pravou lásku v náručí. Pak se hradem rozlehl strašlivý výkřik a jeho síně naplnil žal: bledé rty milované choti už nejevily známky života. V tichu samoty se vzpomínky na lásku, která kdysi rozpalovala [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'její','jeho')] srdce, proměnily v nesnesitelnou bolest. Jakou cenu měla [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'její','jeho')] legenda, když už nezůstal nikdo, s kým by ji [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'mohla','mohl')] sdílet?"
 legend_chapter_conclusion_point_of_interest: "Na svých nesmírných cestách [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'narazila','narazil')] na div tak úchvatný, až se zdál přesahovat hranice pozemského světa — místo, kde se krása přírody snoubila s lidským důmyslem v dokonalý celek. K nebesům se vypínaly věže mistrovského řemesla a jejich ladné tvary koupalo měkké světlo prvního úsvitu. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] se zhluboka [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nadechla','nadechl')]. Lepší završení své cesty si [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nemohla','nemohl')] přát."
 legend_chapter_motivation_child_mother: "V tichých chodbách hradu, kde po kamenných zdech tančily stíny a vzduchem se nesl šepot dávných příběhů, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] něžně kolébala své novorozené dítě. Když hleděla do nevinných očí nemluvněte, v srdci se jí rozhořelo odhodlání. Jaký odkaz po sobě zanechá? Chce snad, aby na ni jednou vzpomínali jako na zbabělce, který se ukrýval mezi hedvábím a květinami?"
 legend_chapter_motivation_child_father: "Ve slavnostním tichu síní rodového sídla, kde mihotavé světlo svící vrhalo stíny na prastaré tapiserie, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] s úžasem hleděl na zázrak života, jímž byl obdařen. Spolu s tímto dítětem se v něm zrodilo i odhodlání ochránit svůj odkaz."
 legend_chapter_opening_witch: "Zájem [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] o skrytá umění odjakživa vzbuzoval podezření. Kolem [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ní','něj')] se množila obvinění z čarodějnictví a kouzel a na kdysi slavné jméno padl temný stín. Když i věrní poddaní začali sledovat každý [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'její','jeho')] krok, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'pocítila','pocítil')] tíhu nedůvěry, která na [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ni','něj')] doléhala."
 legend_chapter_motivation_celibacy: "[ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip], kdysi [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'oděná','oděný')] do královského roucha, nyní [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'stanula','stanul')] v prostém šatu, jaký nosí [ROOT.Legend.GetProtagonist.GetFaith.PriestNeuter], [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'zbavená','zbavený')] koruny i světské nádhery. Na učení, které hlásá [ROOT.Legend.GetProtagonist.GetFaith.HighGodName], však nikdy [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nezapomněla','nezapomněl')], neboť [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'její','jeho')] oddanost hořela stále jasnějším, nehynoucím plamenem. [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Naplněna','Naplněn')] božským vnuknutím se [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'rozhodla','rozhodl')] vykročit cestou, která navždy zvěční [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'její','jeho')] jméno."
 legend_chapter_opening_new_culture: "[ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'se narodila','se narodil')] v době, kdy staré tradice ztratily svůj význam. S novou vizí v mysli se [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'rozhodla','rozhodl')] vytvořit tradice vlastní — a tak vznikla [ROOT.Legend.GetProtagonist.GetCulture.GetNameNoTooltip] kultura."
 legend_chapter_opening_new_faith_generic: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'se narodila','se narodil')] v časech, kdy se náboženství hluboce odchýlilo od zásad víry [ROOT.Legend.GetProtagonist.GetFaith.GetNameNoTooltip]. Kazatelé hlásali kacířství a tvrdili přitom, že za nimi stojí [ROOT.Legend.GetProtagonist.GetFaith.HighGodName], zatímco samotná víra upadala a byla opouštěna. Lid se obracel k jiným náboženstvím a cizí božstva si tak podmaňovala lidská srdce."
