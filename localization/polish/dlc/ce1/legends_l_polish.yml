 legend_events.0001.t: "Kronikář: Nalezena legenda"
 legend_events.0001.desc.intro: "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě při vstupu ke dvoru spěchá nadšeně přivítat.\n\n"
 legend_events.0001.desc.mid.slew_dragon: "„Nesu výtečné zprávy, [Select_CString(ROOT.Char.IsFemale,'má','můj')|l] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]! [Select_CString(chronicler.IsFemale,'Pátrala','Pátral')|U] jsem v knihách a legendách po příbězích o [legend_character.Custom('CZ_Name_L')] a mám důvod věřit, že [Select_CString(legend_character.IsFemale,'bojovala','bojoval')|l] s drakem a [Select_CString(legend_character.IsFemale,'zabila','zabil')|l] jej!"
 legend_events.0001.desc.mid.ancestral_saint: "„[ROOT.Char.GetFaith.HighGodName|U] dnes [Select_CString(Or(EqualTo_string(ROOT.Char.GetFaith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(ROOT.Char.GetFaith.HighGodName,Localize('confucianism_high_god_name'))),'přejí','přeje')|l] tvému rodu, [Select_CString(ROOT.Char.IsFemale,'má','můj')|l] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]. [Select_CString(chronicler.IsFemale,'Pátrala','Pátral')|U] jsem po [Select_CString(legend_character.IsFemale,'tvé slavné předkyni','tvém slavném předkovi')|l] [legend_character.Custom('CZ_Name_L')] a [Select_CString(chronicler.IsFemale,'našla','našel')|l] doklady, podle nichž by si [legend_character.GetName] [Select_CString(legend_character.IsFemale,'zasloužila','zasloužil')|l] označení [GetTrait('saint').GetNameNoTooltip( ROOT.Char )]."
 legend_events.0001.desc.mid.godly_descent: "Padá na kolena a líbá mi nohy. „Ó, [Select_CString(ROOT.Char.IsFemale,'přesvatá','přesvatý')|l] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]. Mám pádný důvod se domnívat, že [ROOT.Char.GetFaith.HighGodName] patří k tvým pokrevním předkům!"
 legend_events.0001.desc.mid.old_godly_descent: "„Dobrý den, [Select_CString(ROOT.Char.IsFemale,'má','můj')|l] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]. Nebo mám říkat, že [Select_CString(Or(EqualTo_string(legend_character.GetFaith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(legend_character.GetFaith.HighGodName,Localize('confucianism_high_god_name'))),'tvými božskými rodiči jsou','tvým božským rodičem je')|l] [legend_character.GetFaith.HighGodName]? [Select_CString(chronicler.IsFemale,'Prohledala','Prohledal')|U] jsem záznamy a věřím, že ‚bůh‘ tvých předků byl ve skutečnosti hrdinný smrtelník, který vykonal mnoho velkých činů."
 legend_events.0001.desc.mid.raised_by_animals: "„Dobrý den, [Select_CString(ROOT.Char.IsFemale,'má','můj')|l] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]. Kolik si pamatuješ z raného dětství? Některé knihy v archivu naznačují, že tě v divočině vychovali tvorové [ROOT.Char.Custom('GetAnimalPlural')|l]."
 legend_events.0001.desc.mid.auspicious_stars: "„[ROOT.Char.GetFaith.HighGodName|U] se na nás dnes [Select_CString(Or(EqualTo_string(ROOT.Char.GetFaith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(ROOT.Char.GetFaith.HighGodName,Localize('confucianism_high_god_name'))),'usmívají','usmívá')|l], [Select_CString(ROOT.Char.IsFemale,'má','můj')|l] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')], stejně jako v den tvého narození. [Select_CString(ROOT.Char.IsFemale,'Narodila','Narodil')|U] ses pod příznivými hvězdami – znamením velikých činů, které tě v životě čekaly."
 legend_events.0001.desc.mid.virgin_birth: "„[ROOT.Char.GetFaith.HighGodName|U] se na nás dnes [Select_CString(Or(EqualTo_string(ROOT.Char.GetFaith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(ROOT.Char.GetFaith.HighGodName,Localize('confucianism_high_god_name'))),'usmívají','usmívá')|l], [Select_CString(ROOT.Char.IsFemale,'má','můj')|l] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')], stejně jako na tvou matku při tvém početí. [Select_CString(ROOT.Char.IsFemale,'Nebyla','Nebyl')|U] jsi žádný levoboček. Tvé matce se dostalo požehnání neposkvrněného početí!"
 legend_events.0001.desc.mid.spoke_to_angels: "„Pamatuji si, jak jsi mi před mnoha nocemi [Select_CString(ROOT.Char.IsFemale,'vyprávěla','vyprávěl')|l] o návštěvě andělů. [Select_CString(ROOT.Char.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')], mám důvod věřit, že nešlo o pouhý sen, ale o vidění z blaženého záhrobí zvaného [ROOT.Char.GetFaith.PositiveAfterLife]."
 legend_events.0001.desc.mid.fought_the_devil: "„Vím, že tě poslední dobou sužují noční můry. Mám důvod věřit, že jsou záblesky tvého souboje se zlem jménem [ROOT.Char.GetFaith.DevilName] v temném záhrobí zvaném [ROOT.Char.GetFaith.NegativeAfterLife]."
 legend_events.0001.desc.mid.exotic_backstory: "„[Select_CString(ROOT.Char.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')], nikdy ses [Select_CString(ROOT.Char.IsFemale,'necítila','necítil')|l] zcela doma mezi příslušníky [ROOT.Char.GetCulture.Custom('CZ_Adjective_eeho')|l] lidu, že? Věřím, že jsi před mnoha lety [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')|l] z tajemné vzdálené země."
 legend_events.0001.desc.mid.ancient_people: "„[Select_CString(ROOT.Char.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')], [Select_CString(chronicler.IsFemale,'prohledala','prohledal')|l] jsem záznamy a [Select_CString(chronicler.IsFemale,'našla','našel')|l] důkazy, podle nichž tvůj rod sahá až k velkým [ancient_culture.Custom('CZ_Adjective_yych')|l] dynastiím!"
 legend_events.0001.desc.outro: "Někomu to může připadat přitažené za vlasy. Dokázat pravdivost příběhu bude stát úsilí, ale základ pro to, aby se z tebe stala živoucí legenda, je pevný!“"
 legend_events.0001.a: "Výtečná práce!"
 legend_events.0001.b: "I mně se tomu těžko věří."
 legend_events.0010.t: "$chronicler_court_position$: Legenda se šíří"
 legend_events.0010.desc: "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě dnes ráno vítá u dvora a zprávy má na jazyku.\n\n„[Select_CString(ROOT.Char.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')], věřím, že [potential_promoter.Custom2('YourCharacterIntroduction', ROOT.Char)] téměř věří pravdivosti legendy [ROOT.Char.GetPromotedLegend.GetName]! Příběh zná a zdá se být zcela [Select_CString(potential_promoter.IsFemale,'okouzlená','okouzlený')|l], ale o skutečnosti za ním stále pochybuje.“"
 legend_events.0010.a: "Snad se [Select_CString(potential_promoter.IsFemale,'ji','ho')|l] podaří přesvědčit."
 legend_events.0010.a.success: "[potential_promoter.GetName|U] [Select_CString(potential_promoter.IsFemale,'uvěřila','uvěřil')|l]"
 legend_events.0010.a.failure: "[potential_promoter.GetName|U] [Select_CString(potential_promoter.IsFemale,'neuvěřila','neuvěřil')|l]"
 legend_events.0010.b: "Možná by [Select_CString(potential_promoter.IsFemale,'ji','ho')|l] přesvědčilo trochu přikrášlit pravdu."
 legend_events.0010.c: "Může si myslet, co chce."
 legend_events.0020.t: "Přivlastnění legendy"
 legend_events.0020.desc: "K mému trůnu přistoupí [Select_CString(seed_presenter.IsFemale,'cizí hostka','cizí host')|l] a hlasitě prohlásí:\n\n„Od mého příchodu na tvůj dvůr už nějaký čas uplynul. Pečlivě jsem [Select_CString(seed_presenter.IsFemale,'sledovala','sledoval')|l], jak vládneš a řešíš záležitosti panství, malé i velké. A [Select_CString(seed_presenter.IsFemale,'byla','byl')|l] jsem hluboce [Select_CString(seed_presenter.IsFemale,'ohromena','ohromen')|l].\n\nMezi [seed_presenter.GetCulture.Custom('CZ_Adjective_yym')|l] lidem se traduje starý příběh o legendárním vládci z význačné dynastie. Vyprávěla mi jej matka, když byla mladá. Sama jej kdysi slyšela od své matky.\n\nA nyní ti s velikým potěšením mohu říci, že tě považuji za [Select_CString(ROOT.Char.IsFemale,'legendární vládkyni','legendárního vládce')|l] s titulem [ROOT.Char.GetTitleAsNameNoTooltip] z [seed_presenter.GetCulture.Custom('CZ_Adjective_yych')|l] příběhů. Každý pravý příslušník [seed_presenter.GetCulture.Custom('CZ_Adjective_eeho')|l] lidu by jistě souhlasil!“"
 legend_events.0020.a: "Ano! Vaši stařešinové mluvili o rodu [ROOT.Char.GetDynasty.GetNameNoTooltip]!"
 legend_events.0020.b: "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip|U] je námětem [seed_presenter.GetCulture.Custom('CZ_AdjectiveNoTooltip_yych')|l] příběhů."
 legend_events.0020.c: "[Select_CString(ROOT.Char.IsFemale,'Vládkyni','Vládce')|U] [ROOT.Char.GetCulture.Custom('CZ_AdjectiveNoTooltip_eeho')|l] lidu nezajímá, co žvaní rolníci [seed_presenter.GetCulture.Custom('CZ_AdjectiveNoTooltip_eeho')|l] lidu."
 legend_seed_ghw.tt: "Získá [Concept('legend_seed','zárodek legendy')|E] $trait_crusader_king$"
 gain_heroic_legend_seed.tt: "Získáš hrdinský [Concept('legend_seed','zárodek legendy')|E]"
 gain_holy_legend_seed.tt: "Získáš svatý [Concept('legend_seed','zárodek legendy')|E]"
 gain_legitimizing_legend_seed.tt: "Získáš legitimizující [Concept('legend_seed','zárodek legendy')|E]"
 legend_events.1000.t: "[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('legend_owner'))|U] [ROOT.Char.Custom('CZ_TitledFirstNameNoTooltip_V')],"
 legend_events.1000.desc: "Tak hanebná povaha! Taková prolhanost! [Select_CString(SCOPE.sC('legend_owner').IsFemale,'Nabídla','Nabídl')|U] jsem ti zlato za podporu mé legendy a ty mi oplácíš tím, že ji zahodíš jako prašivého psa."
 legend_events.1000.a: "#EMP Pche!#! Tak si to vezmi."
 legend_events.1000.b: "[Select_CString(ROOT.Char.IsFemale,'Jsem si jistá','Jsem si jistý')|U], že to bylo #EMP mnohem#! levnější."
 legend_spread_notification_title: "Legenda se šíří do tvého panství!"
 legend_spread_notification_desc: "Legenda [spread_legend.GetName] se šíří do [spread_county.Custom('CZ_LandedName_G')]"
