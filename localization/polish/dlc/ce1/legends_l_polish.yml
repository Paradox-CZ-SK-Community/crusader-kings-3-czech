 game_concept_legend: "Legenda"
 game_concept_legend_i: "@legend_icon!"
 game_concept_legend_desc: "$game_concept_legend$ představuje významné činy, kterých postava za života dosáhla, a vzniká z [Concept('legend_seeds','zárodků legend')|E].\n\nLegendy jsou účinným způsobem, jak získat [Concept('legitimacy','legitimitu')|E] a další možné odměny, například zvýšení [Concept('skill','dovednosti')|E], bonusy k [Concept('opinion','mínění')|E], [Concept('dynasty_prestige','věhlas')|E], [Concept('prestige','prestiž')|E] nebo [Concept('piety','zbožnost')|E]. [Concept('baronies','Baronství')|E], do nichž se $game_concept_legend$ rozšířila, mohou také získat další účinky, pokud je drží ten, komu $game_concept_legend$ patří, nebo [Concept('legend_promoter','podporovatel legendy')|E].\n\n$game_concept_legends$ mají [Concept('legend_type','typ legendy')|E], který určuje tyto odměny: mohou být legitimační, svaté nebo hrdinské. Každá $game_concept_legend$ má také úroveň [Concept('legend_quality','kvality legendy')|E], která ovlivňuje sílu těchto odměn i její šíření."
 game_concept_owned_legend: "Vlastněná legenda"
 game_concept_owning_legend: "Vlastnictví legendy"
 game_concept_owned_legend_desc: "$game_concept_owned_legend$ je [Concept('legend','legenda')|E] vlastněná [Concept('ruler','vládcem')|E], který je hlavním příjemcem jejích účinků.\n\nVlastník $game_concept_legend$ může být zároveň jejím [Concept('legend_protagonist','protagonistou legendy')|E], ale není to nutné.\n\n$game_concept_legend$ mohou také podporovat [Concept('legend_promoters','podporovatelé legendy')|E], kteří odvádějí měsíční příspěvek a získávají za něj část jejích bonusů."
 game_concept_owning_legend_desc: "$game_concept_owned_legend_desc$"
 game_concept_promoted_legend: "Podporovaná legenda"
 game_concept_promoted_legend_desc: "$game_concept_promoted_legend$ je [Concept('legend','legenda')|E] vlastněná jiným [Concept('ruler','vládcem')|E], kterou podporují [Concept('legend_promoters','podporovatelé legendy')|E]. Ti odvádějí měsíční příspěvek a získávají za něj část jejích bonusů."
 game_concept_promoting_legend: "Podporování"
 game_concept_promoting_legend_desc: "$game_concept_promoting_legend$"
 game_concept_legend_promoter: "Podporovatel legendy"
 game_concept_legend_promoter_desc: "$game_concept_legend_promoter$ je [Concept('ruler','vládce')|E], který podporuje [Concept('legend','legendu')|E] jiného vládce.\n\n$game_concept_legend_promoter$ získává dodatečné bonusy, které se liší podle [Concept('legend_type','typu legendy')|E] a [Concept('legend_quality','kvality legendy')|E] dané $game_concept_legend$. Výměnou za ně odvádí měsíční příspěvek v [Concept('gold','zlatě')|E]."
 game_concept_legend_promoters: "Podporovatelé legendy"
 game_concept_legend_promoters_desc: "$game_concept_legend_promoter_desc$"
 game_concept_legends: "Legendy"
 game_concept_legends_desc: "$game_concept_legend_desc$"
 game_concept_legend_seed: "Zárodek legendy"
 game_concept_legend_seed_desc: "[Concept('legend','Legenda')|E], která teprve vzniká. $game_concept_legend_seeds$ jsou základem $game_concept_legend$ a jejich založením může [Concept('ruler','vládce')|E] zahájit $game_concept_legend$.\n\n$game_concept_legend_seeds$ lze získat splněním určitých podmínek, například pokud se staneš dědicem Karla Velikého, nebo vykonáním legendárních činů: přijetím významných [Concept('decisions','rozhodnutí')|E], vítězstvím ve [Concept('great_holy_war','velké svaté válce')|E], získáním postavení [Concept('king','krále')|E] či [Concept('emperor','císaře')|E], uspořádáním velkolepé [Concept('activity','aktivity')|E], ulovením legendárního zvířete a podobně.\n\nNeaktivní $game_concept_legend_seeds$ nic nestojí, ale nemají žádné účinky. První založení $game_concept_legend_seed$ vyžaduje [Concept('gold','zlato')|E]."
 game_concept_legend_seeds: "Zárodky legend"
 game_concept_legend_seeds_desc: "$game_concept_legend_seed_desc$"
 game_concept_legend_quality: "Kvalita legendy"
 game_concept_legend_quality_desc: "Kvalita [Concept('legend','legendy')|E] určuje sílu jejích účinků, dosah jejího šíření i konečné odměny. $game_concept_legends$ mohou být proslulé, věhlasné nebo mýtické — obyčejná $game_concept_legend$ totiž neexistuje.\n\nKvalitu lze zvýšit rozšířením legendy do více [Concept('baronies','baronství')|E] a zaplacením ceny za vylepšení.\n\nPo smrti vlastníka $game_concept_legend$ v ní může jeho rodina pokračovat bez ztráty kvality."
 game_concept_legend_famed: "Proslulá"
 game_concept_legend_famed_desc: "$game_concept_legend_quality_desc$"
 game_concept_legend_illustrious: "Věhlasná"
 game_concept_legend_illustrious_desc: "$game_concept_legend_quality_desc$"
 game_concept_legend_mythical: "Mýtická"
 game_concept_legend_mythical_desc: "$game_concept_legend_quality_desc$"
 game_concept_legend_protagonist: "Protagonista legendy"
 game_concept_legend_protagonist_desc: "$game_concept_legend_protagonist$ je hlavní postavou [Concept('legend','legendy')|E], jejíž činy jsou v ní popsány. Vlastník $game_concept_legend$ může být zároveň jejím $game_concept_legend_protagonist$, stejně tak jím může být kterákoli osoba z rodiny vlastníka — živá či mrtvá — pokud jí je alespoň 16 let.\n\n$game_concept_legend_protagonists$ sami nezískávají žádné přímé dodatečné bonusy, ale obsah $game_concept_legend$ se soustředí právě na ně. Vlastníkovi legendy však poskytují #color_white dodatečnou#! [Concept('legitimacy','legitimitu')|E] podle počtu [Concept('virtuous','ctnostných')|E] [Concept('traits','rysů')|E], které mají.\n\n$game_concept_legend_protagonist$ musí být dospělý, protože tvrdit, že nemluvně zabilo draka, by mohlo být poněkud kontroverzní."
 game_concept_legend_protagonists: "Protagonisté legend"
 game_concept_legend_protagonists_desc: "$game_concept_legend_protagonist_desc$"
 game_concept_legend_type: "Typ legendy"
 game_concept_legend_types: "Typy legend"
 game_concept_legend_types_desc: "$game_concept_legend_type_desc$"
 game_concept_legend_type_desc: "[Concept('legend','Legenda')|E] má typ, který určuje kategorii poskytovaných účinků i tematiku jejího obsahu.\n\n$game_concept_legend_types$ jsou legitimační, hrdinské a svaté a poskytují v tomto pořadí [Concept('legitimacy','legitimitu')|E], [Concept('prestige','prestiž')|E] a [Concept('piety','zbožnost')|E]."
 game_concept_legend_heroic: "Hrdinská legenda"
 game_concept_legend_heroic_desc: "$game_concept_legend_type_desc$"
 game_concept_legend_holy: "Svatá legenda"
 game_concept_legend_holy_desc: "$game_concept_legend_type_desc$"
 game_concept_legend_legitimizing: "Legitimační legenda"
 game_concept_legend_legitimizing_desc: "$game_concept_legend_type_desc$"
 game_concept_legend_library: "Knihovna legend"
 game_concept_legend_library_i: "@legend_icon!"
 game_concept_legend_library_desc: "[Concept('legend_library','Knihovna legend')|E] uchovává dokončené [Concept('legends','legendy')|E], které se rozšířily do tvé [Concept('domain','domény')|E], byly tebou vytvořeny nebo získaly tvou aktivní podporu.\nDokončené [Concept('legends','legendy')|E] můžeš také aktivně přidávat, pokud cestuješ oblastí, do níž se daná legenda rozšířila.\n\n[Concept('legends','Legendy')|E] můžeš ze své knihovny libovolně odstraňovat."
 game_concept_ancestral_claim: "Nárok předků"
 game_concept_ancestral_claim_desc: "Nárok předků je [Concept('casus_belli','casus belli')|E], které ti umožňuje připojit všechna území v rámci titulu, na který máš nárok získaný prostřednictvím legitimační [Concept('legend','legendy')|E]."
 legend_heroic: "Hrdinská legenda"
 legend_heroic_name: "Legenda o [ROOT.Legend.GetOwner.GetNameNoTooltip]"
 legend_heroic_desc: "[ROOT.Legend.GetOwner.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetOwner.IsFemale,'je proslulá','je proslulý')] svými hrdinskými činy."
 legend_legitimizing: "Legitimační legenda"
 legend_legitimizing_name: "[ROOT.Legend.GetOwner.GetNameNoTooltip] a [Select_CString(ROOT.Legend.GetOwner.IsFemale,'její','jeho')] předkové"
 legend_legitimizing_desc: "Dynastie [ROOT.Legend.GetOwner.GetDynasty.GetBaseNameNoTooltip] vládne těmto zemím po staletí."
 legend_holy: "Svatá legenda"
 legend_holy_name: "[ROOT.Legend.GetOwner.GetNameNoTooltip] a [Select_CString(ROOT.Legend.GetOwner.IsFemale,'její','jeho')] zázraky"
 legend_holy_desc: "Zbožnost, kterou [ROOT.Legend.GetOwner.GetTitledFirstNameNoTooltip] prokazuje, obdivuje každý [ROOT.Char.GetFaith.HighGodNamePossessive] následovník."
 legend_king_arthur: "Odkaz Artuše Pendragona"
 legend_king_arthur_desc: "Král, který byl a jednou opět bude, žije dál v krvi této dynastie."
 legend_carolingian: "Dědicové Karla Velikého"
 legend_carolingian_desc: "Než se vlády ujala tato dynastie, panoval této zemi Karel Veliký. Její příslušníci tvrdí, že jsou přímými potomky jeho císařské krve."
 legend_holy_warrior: "Svatá pěst"
 legend_holy_warrior_desc: "Legenda o velkém hrdinství a statečném boji za víru."
 legend_chapter_opening_holy_warrior: "[Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Velká válečnice','Velký válečník')] vyznávající [religion.GetNameNoTooltip], [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip], [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'se narodila za příznivých znamení','se narodil za příznivých znamení')]. Už od útlého věku [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'slyšela','slyšel')] [ROOT.Legend.GetProtagonist.GetFaith.HighGodNamePossessive] hlas."
 legend_el_cid: "Píseň o Cidovi"
 legend_el_cid_desc: "Rodrigo Díaz de Vivar býval zneuctěným drobným šlechticem, nyní se však sám stal králem."
 legend_alfred_of_wessex: "Svatý král"
 legend_alfred_of_wessex_desc: "[ancestor.GetNameNoTooltip|U] [Select_CString(ancestor.IsFemale,'odolala','odolal')] nájezdům Seveřanů v Anglii a [Select_CString(ancestor.IsFemale,'stala se oporou křesťanství a šířila je','stal se oporou křesťanství a šířil je')]."
 legend_sons_of_david: "Dědicové krále Davida"
 legend_sons_of_david_desc: "David, král Izraele, byl pomazán Bohem a jeho krev koluje v žilách každého z rodu [GetDynastyHouseByID('house_bagrationi').GetNameNoTooltip]."
 legend_peasant_emperor: "Z rolníka basileem"
 legend_peasant_emperor_desc: "Basileios se narodil do rodiny rolníků a vstoupil do služeb císaře, než se oženil s jeho dcerou a nakonec sám dosáhl hodnosti basilea."
 legend_the_wheelwright: "Sklep hojnosti"
 legend_the_wheelwright_desc: "Na sedmé narozeniny svého syna navštívili Piasta Oráče dva cizinci. Z vděčnosti za jeho pohostinnost očarovali Piastův sklep, aby zůstal navždy plný."
 legend_vercingetorix: "Dědicové Vercingetoriga"
 legend_vercingetorix_desc: "Vercingetorix kdysi sjednotil galské kmeny v povstání proti římské invazi. Ačkoli padl do Caesarových rukou, jeho keltský duch žije dál v naší krvi."
 legend_saman_khudah: "Potomek Bahráma Čóbína"
 legend_saman_khudah_desc: "Vojevůdce, dobyvatel a uzurpátor Bahrám Čóbín uchvátil sásánovský trůn a jeho hrdinská krev proudí v našich žilách."
 legend_bahram_gur: "Rod Bahráma Gúra"
 legend_bahram_gur_desc: "Bahrám Gúr byl velký válečnický král, který bojoval proti nesčetným nájezdníkům a vzdoroval jim. Jeho krev proudí v našich žilách a činí z nás perské hrdiny."
 bahram_gur: "Bahrám Gúr"
 legend_cadell: "Cadellova krev"
 legend_cadell_desc: "Cadell prožil dětství jako otrok, ale díky požehnání světce, kterého se mu dostalo, vyrval království Powys Vortigernovi."
 legend_descendants_of_brahman: "Brahmova krev"
 legend_descendants_of_brahman_desc: "Jsme synové a dcery bohů. Náš původ sahá přes Brahmu a Višnua až k samotnému počátku času."
 legend_gothic_kings: "Gótští králové"
 legend_gothic_kings_desc: "Gótové přivodili zkázu Říma a založili naše království. Jsme jejich dědicové, králové a královny Gótů."
 legend_sons_of_rurik: "Rurikovi synové"
 legend_sons_of_rurik_desc: "Varjažský kníže Rurik vedl svou dobrodružnou družinu na východ a založil velké Novgorodské království. Právě jeho legendární krev proudí v našich žilách."
 legend_william_gellones: "Dobytí Orange"
 legend_william_gellones_desc: "Vilém z Gellone porazil muslimská vojska v Orange, bojoval za křesťanství a založil opatství v Gellone, kam se později uchýlil jako mnich a vzdal se vlády."
 legend_edward_the_martyr: "Eduard Mučedník"
 legend_edward_the_martyr_desc: "Eduard Mučedník byl zavražděn a pohřben bez poct, ale po roce bylo jeho tělo nalezeno neporušené. Říká se, že vlastní smrt přijal z hluboké lásky ke Kristu."
 legend_yazdagird_iii: "[ancestor.GetFirstNameNoTooltip] III. a [Select_CString(ancestor.IsFemale,'její','jeho')] krev"
 legend_yazdagird_iii_desc: "V žilách nám koluje krev posledního sásánovského šáha. Přestože [ancestor.GetNameNoTooltip] [Select_CString(ancestor.IsFemale,'čelila','čelil')] ze všech stran Turkům, Chazarům a arabským nájezdníkům, až do posledního dechu [Select_CString(ancestor.IsFemale,'zůstala Persii věrná','zůstal Persii věrný')]."
 legend_afrasiyab: "Afrásijáb, král Túránu"
 legend_afrasiyab_desc: "Slavný král Túránu a hrdina Turků Afrásijáb byl úhlavním nepřítelem Perské říše a největším ze všech túránských králů. Jeho kouzelná krev proudí v našich žilách a dává nám božské právo znovu vládnout Túránu."
 legend_sceafa: "Sceafa, Noemův vnuk"
 legend_sceafa_desc: "Dávný langobardský král Sceafa se jako dítě vynořil z moře a později vládl Anglii. Víme, že byl Noemovým vnukem, a právě jemu vděčíme za svou božskou krev."
 legend_new_troy_london: "Nová Trója"
 legend_new_troy_london_desc: "Bruta, vyhnaného z Tróje, dovedla Diana do Albionu. Poté, co porazil veliké obry obývající tuto zemi, založil Troia Nova, město, které dnes známe jako Londýn."
 legend_corineus: "Balada o Corineovi"
 legend_corineus_desc: "Corineus, dávný trojský válečník, byl prvním zakladatelem Cornwallu. Přišel do Británie, pobil obry obývající tuto oblast a pojmenoval Cornwall po sobě."
 legend_scota: "Synové Scoty"
 legend_scota_desc: "Právě podle Scoty, dcery mocného egyptského faraona, nazýváme svou zemi „Skotskem“. Je matkou všech Skotů a v našich žilách proudí krev dávných faraonů."
 legend_pyusawhti: "Dědicové dračí bohyně"
 legend_pyusawhti_desc: "Zrozeni z lůna dračí bohyně a pocházející od Mahásammaty, neseme ve svém rodě tu nejsvětější a nejmocnější krev."
 legend_tosny: "Labutí rytíř"
 legend_tosny_desc: "Mocný Roger de Tosny byl potomkem Labutího rytíře a na počest jeho legendy nosíme znak labutě dodnes."
 legend_menelik_i: "Synové Davidovi"
 legend_menelik_i_desc: "Zakladatel naší dynastie Menelik I. se zrodil z lásky izraelského krále Šalomouna a královny ze Sáby."
 legend_kings_of_semien: "Králové Semienu"
 legend_kings_of_semien_desc: "Beta Israel je legendární židovské království, které i nadále houževnatě vzdoruje christianizaci. Pocházíme z kmene Dan, který uprchl z Izraele během občanské války mezi vojsky Rechabeáma a Jarobeáma."
 legend_roman_heritage: "Římské dědictví"
 legend_roman_heritage_desc: "Naše rodina nejenže vládne v dnešní Římské říši, ale už od dob republiky patří v Římě mezi vlivné dvořany."
 legend_hunnic_heritage: "Hunské dědictví"
 legend_hunnic_heritage_desc: "Původ našeho lidu sahá až k rodům Hunů a zakladatelem naší dynastie nebyl nikdo jiný než divoký Attila, který srazil Řím na kolena."
 legend_premysl: "Přemysl Oráč"
 legend_premysl_desc: "Náš předek začínal jako pouhý rolník ve vsi Stadice, brzy však padl do oka Libuši, oženil se s ní a stal se knížetem Čechů."
 legend_borjigin: "Zářící návštěvník"
 legend_borjigin_desc: "Alan Gua, pramáti dynastie [GetDynastyByID('11100').GetNameNoTooltip], navštěvovala ve dne i v noci podivná zářící postava. Jako veliký žlutý pes se do její jurty plížila v noci po měsíčních paprscích a ve dne po paprscích slunce a darovala jí tři syny. Své božsky počaté syny varovala, že musejí držet pohromadě jako svazek pěti šípů, jinak budou zlomeni jako pět osamělých šípů."
 legend_naga_descent: "Krev nágů"
 legend_naga_descent_desc: "Nágové jsou posvátné bytosti napůl lidé a napůl hadi, které přebývají v Pátále a příležitostně mohou vstoupit do našeho světa v plně lidské podobě. Původ naší rodiny lze vystopovat až k nágovi, který kdysi navštívil Kašmír a spojil se s člověkem."
 legend_hieros_gamos_skirnismal: "Hieros gamos"
 legend_hieros_gamos_skirnismal_desc: "Fjölnir, zakladatel dynastie Ynglingů, vzešel ze spojení Gerðr a Freyra. Kdo jiný než Fjölnirovi potomci by mohl mít v žilách božskou krev nezbytnou k vládě nad Norskem?"
 legend_shibi_chakravarti: "Šibi Čakravartin"
 legend_shibi_chakravarti_desc: "Hrdinský král Šibi, vzor pokory a zbožnosti, dostal za úkol chránit mudrce Agniho, který byl proměněn v ptáka. Když luňák požadoval, aby Šibi obětoval vlastní maso a zachránil tak holubici, král se ochotně nabídl celý. Nakonec však byl ušetřen a odměněn synem Kapotaromou. Krev tohoto nezištného krále proudí v žilách každého člena dynastie [GetDynastyByID('1043008').GetNameNoTooltip]."
 legend_magi: "Synové mudrců"
 legend_magi_desc: "Po Ježíšově narození jej navštívili bibličtí mudrci a přinesli mu dary v podobě zlata, kadidla a myrhy. Matoušovo evangelium praví, že tři mudrci přišli z východu.\nPomýlený západní cestovatel by mohl spatření Betlémské hvězdy umístit do perského města Sába.\nSlunce však vychází ještě dále na východě. Bohatství pochází z měst, ale neochvějná víra z drsné stepi.\nBible vypráví, že se Melichar, Kašpar a Baltazar po vzdání úcty novorozenému králi Židů vrátili do svých domovů. Jejich krev a tělo, nejzbožnější nestoriáni, dodnes uctívají jediného pravého Boha a jeho Syna."
 legend_the_red_hand: "Rudá ruka Ulsteru"
 legend_the_red_hand_desc: "Říká se, že v dávných dobách Irska bylo přislíbeno, že kdo jako první položí ruku na Ulster, získá na něj nárok a stane se velekrálem Irska. Byl to náš předek, koho napadlo useknout si vlastní ruku a mrštit ji na břeh Ulsteru, kde svou krví potřísnila smaragdovou trávu."
 legend_ragnarr: "Synové muže zvaného $nick_lodbrok$"
 legend_ragnarr_desc: "Král Dánů a přemožitel mocného draka, [ancestor.GetFirstNameNoTooltip], [Select_CString(ancestor.IsFemale,'byla postrachem','byl postrachem')] křesťanů a legendárním dobrodruhem. Velkých činů, které [ancestor.GetFirstNameNoTooltip] za života [Select_CString(ancestor.IsFemale,'vykonala','vykonal')], je příliš mnoho, než aby je bylo možné všechny vyjmenovat, a když mi v žilách proudí [Select_CString(ancestor.IsFemale,'její','jeho')] krev, je jedině správné, že si činím nárok na [Select_CString(ancestor.IsFemale,'její','jeho')] odkaz a vytvořím vlastní legendární příběh!"
 legend_holy_site: "$legend_saintly_location_name$"
 legend_holy_site_desc: "$legend_saintly_location_desc$"
 legend_saintly_location_name: "[ROOT.Char.CustomFixedRandom('GetCustodianSynonym')|U] posvátného místa víry [protagonist.GetFaith.GetName]"
 legend_saintly_location_desc: "Držet posvátné místo víry [faith.GetNameNoTooltip] je samo o sobě známkou svatosti."
 legend_chapter_opening_saintly_location: "Země [location.GetNameNoTooltip] má mimořádný náboženský význam a říká se, že z její půdy vyvěrá zázračná voda schopná vyléčit všechny neduhy."
 legend_chapter_motivation_religious: "Když se o tom [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'dozvěděla','dozvěděl')], [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'pocítila','pocítil')] v srdci veliké teplo, neboť [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'její','jeho')] oddanost byla tak hluboká, že pouhá myšlenka na svaté místo [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jí vehnala slzy do očí','mu vehnala slzy do očí')]."
 legend_saintly_life_name: "[protagonist.GetTitledFirstNameNoTooltip] a [Select_CString(protagonist.IsFemale,'její','jeho')] nanejvýš [ROOT.Char.CustomFixedRandom('GetPiousAdj')|l] život"
 legend_saintly_life_desc: "Oddaný život, který [protagonist.GetTitledFirstNameNoTooltip] [Select_CString(protagonist.IsFemale,'vedla','vedl')], [Select_CString(protagonist.IsFemale,'jí','mu')] vynesl téměř světecké postavení."
 legend_chapter_opening_saintly_life: "[ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'se narodila s hlubokou láskou ke své víře','se narodil s hlubokou láskou ke své víře')], v jejímž středu stojí [ROOT.Legend.GetProtagonist.GetFaith.HighGodName], a celý život [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'zasvětila','zasvětil')] její cti."
 holy_seed_toast: "Získáváš svatý [Concept('legend_seed','zárodek legendy')|E]"
 holy_seed_toast_traits: "Získáváš uznání za rys [ROOT.Char.CustomFixedRandom('GetSaintlyTrait')]"
 legend_saintly_building_name: "[Select_CString(ROOT.Char.IsFemale,'Stavitelka','Stavitel')] z [location.GetNameNoTooltip] ([ROOT.Char.CustomFixedRandom('GetPiousAdj')|U])"
 legend_saintly_building_desc: "Stavět [ROOT.Char.GetFaith.HouseOfWorshipPlural] je nezištný čin — velký důkaz zbožné duše."
 legend_ancient_people_name: "[ROOT.Char.CustomFixedRandom('GetDescendantSynonym')|U] [culture.GetNameNoTooltip] kultury"
 legend_ancient_people_desc: "V žilách všeho našeho lidu proudí tatáž krev, která kdysi proudila lidem označovaným jako [culture.GetCollectiveNoun]."
 legend_saintly_deed_name: "[ancestor.GetNameNoTooltip|U] a [Select_CString(ancestor.IsFemale,'její','jeho')] skutky — [ROOT.Char.CustomFixedRandom('GetPiousAdj')|U]"
 legend_saintly_deed_desc: "[ancestor.GetNameNoTooltip|U] [Select_CString(ancestor.IsFemale,'vykonala','vykonal')] ve jménu náboženství [religion.GetName] mnoho zbožných skutků, které si jistě zaslouží úctu."
 legend_saintly_descent_name: "[Localize(ancestor_flag)|U] a [ROOT.Char.CustomFixedRandom('GetDescendantSynonym')|U]"
 legend_saintly_descent_desc: "[Localize(ancestor_flag)|U] stojí na počátku posvátné krve, která proudí v našich žilách, a s ní budeme konat zázraky."
 legend_mythical_descent_name: "[Localize(creature)|U] v mé krvi"
 legend_mythical_descent_desc: "Mezi mé předky patří mocná bytost známá jako [Localize(creature)]."
 legend_godly_descent_name: "[Localize(god)|U] v mých žilách"
 legend_godly_descent_desc: "V mém rodokmenu je [Localize(god)|U] a s touto krví v žilách budu konat zázraky."
 legend_chronicle_ancestral_glory_desc: "[ancestor.GetName] [Select_CString(ancestor.IsFemale,'byla skutečně velkou ženou, kterou všichni uctívali','byl skutečně velkým mužem, kterého všichni uctívali')]."
 legend_chronicle_ancestral_glory_nohistory_desc: "V našem rodě se kdysi zrodila skutečně velká osobnost, kterou všichni uctívali."
 legend_crusader: "[ancestor.GetTitleAsNameNoTooltip|U] — [GetTrait('faith_warrior').GetNameNoTooltip( protagonist )]"
 legend_crusader_desc: "[protagonist.GetName] [Select_CString(protagonist.IsFemale,'vykonala','vykonal')] při dobývání Svaté země mnoho velkých a zbožných skutků."
 legend_chronicle_raised_by_animals: "Dítě vychované tvorem zvaným [Localize(beast)|U]"
 legend_chronicle_raised_by_animals_desc: "[protagonist.GetNameNoTooltip|U] [Select_CString(protagonist.IsFemale,'vyrůstala','vyrůstal')] pod ochranou tvora známého jako [Localize(beast)|U]. [protagonist.GetFaith.CreatorNamePossessive|U] svět a drsný život v divočině [Select_CString(protagonist.IsFemale,'ji dokonale připravily','ho dokonale připravily')] na vládu."
 legend_auspicious_birth: "Zrození pod šťastnou hvězdou"
 legend_auspicious_birth_desc: "[protagonist.GetNameNoTooltip|U] [Select_CString(protagonist.IsFemale,'se narodila','se narodil')] v noci, kdy obloha zářila příznivými hvězdami — neklamné znamení velkých činů, k nimž [Select_CString(protagonist.IsFemale,'byla předurčena','byl předurčen')]."
 legend_virgin_birth: "Neposkvrněné početí"
 legend_virgin_birth_desc: "[protagonist.GetMother.GetNameNoTooltip|U] otěhotněla, aniž by naplnila manželství se svým mužem. Je to bezpochyby znamení zázraku: za darem dítěte stojí [protagonist.GetFaith.HighGodName|U]."
 legend_sacred_birth_name: "[protagonist.GetFirstNameNoTooltip|U], [Select_CString(protagonist.IsFemale,'její','jeho')] zrození a [ROOT.Char.CustomFixedRandom('GetPiousAdj')|l] život"
 legend_sacred_birth_desc: "[protagonist.GetNameNoTooltip|U] [Select_CString(protagonist.IsFemale,'se narodila','se narodil')] za okolností zahalených tajemstvím, což je jasné znamení, že [protagonist.GetFaith.HighGodName|U] od samého počátku drží nad [Select_CString(protagonist.IsFemale,'ní','ním')] ochrannou ruku."
 legend_divine_intervention_name: "[Localize(god)|U] a požehnání"
 legend_divine_intervention_desc: "[protagonist.GetNameNoTooltip|U] [Select_CString(protagonist.IsFemale,'ve snu spatřila','ve snu spatřil')] božskou bytost známou jako [Localize(god)], která [Select_CString(protagonist.IsFemale,'jí','mu')] svěřila božské poslání."
 legend_fought_devil_name: "[protagonist.GetFaith.DevilName|U] a souboj"
 legend_fought_devil_desc: "[protagonist.GetNameNoTooltip] [Select_CString(protagonist.IsFemale,'ve snu bojovala','ve snu bojoval')] s bytostí známou jako [protagonist.GetFaith.DevilName], což bylo příznivé znamení budoucího vítězství nad zlem."
 legend_exotic_backstory_name: "[protagonist.GetNameNoTooltip|U] na odyseji"
 legend_exotic_backstory_desc: "[protagonist.GetName] [Select_CString(protagonist.IsFemale,'kdysi podnikla','kdysi podnikl')] dalekou cestu, která [Select_CString(protagonist.IsFemale,'ji','ho')] zavedla až k místu známému jako [Localize(location.GetString)] a zase zpět."
 pilgrim_legend_name: "Pouť světem"
 pilgrim_legend_desc: "[ancestor.GetNameNoTooltip|U] [Select_CString(ancestor.IsFemale,'zasvětila','zasvětil')] celý život nekonečné namáhavé pouti vzhůru. Jejím cílem bylo [ancestor.GetFaith.PositiveAfterLife]. Jen [ancestor.GetFaith.HighGodName|U] skutečně ví, jaké skutky provázely [Select_CString(ancestor.IsFemale,'její','jeho')] svatou cestu ke spáse."
 consecrated_blood_legend: "Svatá krev"
 consecrated_blood_legend_desc: "[founder.GetName|U] [Select_CString(founder.IsFemale,'dala','dal')] počátek krvi, která dnes proudí všem členům dynastie [dynasty.GetName]. [founder.GetFaith.HighGodName|U] stojí v samém středu naší bezmezné oddanosti a všechny své činy konáme ve jménu víry."
 dyn_many_crown_legend: "[dynasty.GetNameNoTooltip|U] na trůnech"
 dyn_many_crown_legend_desc: "Ať už osudem, nebo záměrem, moc připadá do rukou dynastie [dynasty.GetName]. Našich zemí je mnoho a naše činy jsou veliké; naše vláda nad trůny světa je předurčena."
 legend_of_rome_name: "Nový Caesar"
 legend_of_israel_name: "[Select_CString(founder.IsFemale,'Nová','Nový')] [founder.GetTitleAsNameNoTooltip|U] Izraele"
 legend_of_slavia_name: "Říše Slovanů"
 legend_of_n_sea_name: "Vláda nad mořem"
 legend_of_mann_name: "[Select_CString(founder.IsFemale,'Pirátská','Pirátský')] [founder.GetTitleAsNameNoTooltip|U]"
 legend_of_genghis_name: "Největší z chánů"
 new_title_name: "[Select_CString(founder.IsFemale,'Nová','Nový')] [founder.GetTitleAsNameNoTooltip|U]"
 jewish_priesthood_name: "Proroctví se naplnilo"
 zoroast_priesthood_name: "Znovuzažehnutí plamenů"
 priesthood_restoration_name: "Nové kněžstvo"
 iberian_ender_name: "[GetTitleByKey('e_spain').GetNameNoTierNoTooltip|U] na rozcestí"
 persian_ender_name: "[GetTitleByKey('e_persia').GetNameNoTierNoTooltip|U] na rozcestí"
 struggle_conclusion_name: "[Localize(struggle.GetString)|U] končí"
 legendary_battle_name: "Bitva u [location.GetName|U]"
 reformed_faith: "[religion.GetNameNoTooltip|U] na pevných základech"
 new_faith_legend_name: "[faith.GetNameNoTooltip|U] vítězí"
 khan_beater_name: "Postrach chánů"
 legend_of_rome_desc: "Řím, kdysi pouhá vzdálená vzpomínka na zašlou slávu, nyní znovu povstává s novým Caesarem, připraveným přivést civilizaci do nové éry."
 legend_of_israel_desc: "Izrael, království Božího vyvoleného lidu, si podrobili Asyřané, Babyloňané i Římané. Náš odchod ze Země zaslíbené vyslal náš lid na pouť napříč světem, nyní však povstává nové Izraelské království a Boží lid opět obývá jeho země!"
 legend_of_slavia_desc: "Slovanské národy se rozšířily široko daleko po Evropě, ale nyní [founder.GetFirstName] stojí jako první [founder.GetTitleAsNameNoTooltip|U] všech Slovanů!"
 legend_of_n_sea_desc: "Severnímu moři odedávna vládli Dánové a nyní, když vládne [founder.GetName], povstává nad jeho vlnami říše."
 legend_of_mann_desc: "Za vlnami omývajícími Británii si námořníci vyprávějí příběhy o [founder.GetTitleAsNameNoTooltip] jménem [founder.GetName], [Select_CString(founder.IsFemale,'obávané pirátce','obávaném pirátovi')], která budí hrůzu široko daleko. I ti nejmocnější válečníci blednou, když spatří její lodě u svých břehů. Vzdát se by bylo jediným východiskem, kdyby ovšem [founder.GetTitleAsNameNoTooltip|U] něco takového [Select_CString(founder.IsFemale,'přijala','přijal')]."
 legend_of_genghis_desc: "Vše pod nebem patří největšímu ze všech chánů. Mongoly nyní sjednocuje jediný [founder.GetTitleAsNameNoTooltip|U]; vlci vyjí, orli křičí a Čingischán vypaluje své jméno do celého světa."
 new_title_desc: "Z popela povstává [Select_CString(founder.IsFemale,'nová','nový')] [founder.GetTitleAsNameNoTooltip|U], aby svou laskavou vládou [Select_CString(founder.IsFemale,'přinesla','přinesl')] blahobyt."
 jewish_priesthood_desc: "Diaspora měla být věčná, ale [founder.GetName] nyní stojí u zrodu nového velekněžstva, které povede [faith.GetAdjective] lid do nové a světlejší éry."
 zoroast_priesthood_desc: "Zoroastrijskou víru kdysi vedli velcí mágové, jejich řád však byl rozvrácen. Z milosti Ahura Mazdy, Anáhity a Mithry [protagonist.GetName] řád mágů [Select_CString(protagonist.IsFemale,'obnovila','obnovil')]."
 priesthood_restoration_desc: "Krutá ruka času téměř zničila [faith.GetName]. Nyní [founder.GetName] znovu buduje kněžstvo a [faith.HighGodName|U] nad tím drží ochrannou ruku."
 iberian_ender_desc: "Svár iberské šlechty skončil a [struggle_ender.GetFirstName] se stává [Select_CString(struggle_ender.IsFemale,'zachránkyní','zachráncem')] Iberie. [struggle_ender.GetTitleAsNameNoTooltip|U] [Select_CString(struggle_ender.IsFemale,'zvítězila','zvítězil')]."
 struggle_conclusion_desc: "[Localize(struggle.GetString)|U] je konečně u konce a [struggle_ender.GetFirstName] se stává [Select_CString(struggle_ender.IsFemale,'hrdinkou','hrdinou')], která region uvede do nové éry."
 khan_beater_desc: "Legendární „Čingischán“ chtěl přivést vše pod nebem do [Select_CString(loser.IsFemale,'její','jeho')] říše, ale [Select_CString(winner.IsFemale,'hrdinná','hrdinný')] [winner.GetName], mocná postava s titulem [winner.GetTitleAsNameNoTooltip|U], mu překazila plány!"
 legendary_battle_desc: "[loser.GetName|U] [Select_CString(loser.IsFemale,'se pokusila','se pokusil')] zničit [winner.GetName] a [Select_CString(loser.IsFemale,'byla vskutku důstojnou soupeřkou','byl vskutku důstojným soupeřem')]. Nyní však vítězí [winner.GetFirstNameNoTooltip] a [Select_CString(winner.IsFemale,'jejím','jeho')] hrdinským činům nebude konce!"
 reformed_faith_desc: "Organizované náboženství hrozilo zničením starých způsobů, ale [faith.GetName] vstupuje pod moudrým a zbožným vedením [reformer.GetName] do nové éry. Legendy jsou nyní zachyceny ve svaté knize, vznikla uspořádaná kněžská vrstva a [faith.HighGodNamePossessive] záměr se konečně naplní!"
 new_faith_legend_desc: "Slabá a zkažená církev se vzdálila tomu, co pro lidstvo zamýšlí [faith.HighGodName]. Nyní [reformer.GetName] následuje božské vedení a na svět přichází [faith.GetName], jediná pravá víra."
 legend_chronicle_debug_legend: "#D Legenda QA#!"
 legend_chronicle_debug_legend_desc: "#D QA je prastaré a vznešené povolání#!"
 legend_chronicle_beast_slayer: "Přemožitel [Localize(beast)|U]"
 legend_chronicle_beast_slayer_desc: "Na místě [location.GetName] padl tvor známý jako [Localize(beast)]."
 legend_chronicle_holy_war: "Svatá válka o [location.GetName]"
 legend_chronicle_holy_war_desc: "Na místě [location.GetName] byl poražen nepřítel známý jako [Localize(antagonist)]."
