 legend_chapter_opening_generic: "Legenda o [ROOT.Legend.GetProtagonist.Custom('CZ_NameNoTooltip_L')] je stejně veliká a rozlehlá jako svět, neboť [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'její','jeho')|l] činy nemají obdoby."
 legend_chapter_extra_deed_memory: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] však [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nezůstala','nezůstal')|l] jen u toho. S velikou odvahou pak [ROOT.Legend.MakeScope.Var('extra_deed_memory').CharacterMemory.GetThirdPerspectiveDescription|l]."
 legend_chapter_motivation_generic: "Když se krajem začaly šířit neurčité znepokojivé zvěsti, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] si [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'umínila','umínil')|l] vykonat tento obtížný čin."
 legend_chapter_motivation_evil: "Na dobrodružnou cestu nevyhnaly [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_A')] prosby lidu ani zoufalství sužující kraj, nýbrž touha vlastního temného srdce."
 legend_chapter_motivation_peasant: "Když uplakaný, zoufalý a chudý rolník požádal o slyšení, zbožná duše [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_G')] nemohla jeho prosby nevyslyšet. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] se rychle [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vydala','vydal')|l] za dobrodružstvím."
 legend_chapter_motivation_spouse: "Jednoho rána přišla milovaná polovička [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_G')] se znepokojivými zprávami. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'neváhala','neváhal')|l] a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'slíbila','slíbil')|l], že dostojí jejich věčné lásce."
 legend_chapter_motivation_honor_lady: "Když se oči [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_G')] setkaly s očima milované osoby, bylo rozhodnuto. Prosby o pomoc i touha dokázat vlastní odvahu přiměly [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_A')] vydat se za dobrodružstvím."
 legend_chapter_discovery_generic: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] s družinou [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'prohledávala','prohledával')|l] oblast [Localize( location )] a zanedlouho [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'našla','našel')|l] přesné místo."
 legend_chapter_hunt_generic: "[Localize( Concatenate( 'animal_type_' , beast ) )|U] už pije vodu z potoka. Zvíře zvedlo hlavu a hladově vyrazilo k [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_D')]. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] však [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'byla rychlejší','byl rychlejší')|l] a obratným úderem bestii [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'skolila','skolil')|l]."
 legend_chapter_battle_generic: "Bitva byla zuřivá. [ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] se uprostřed pole [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'střetla','střetl')|l] s [loser.Custom('CZ_NameNoTooltip_I')], s očima plnýma odvahy. [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Pozvedla','Pozvedl')|U] svou zbraň a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'zasadila','zasadil')|l] [Select_CString(loser.IsFemale,'protivnici','protivníkovi')|l] ránu do hrudi. Vytryskla krev. Vítězství."
 legend_chapter_conclusion_generic: "Cesta domů nebyla snadná. [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip|U] však [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vstoupila','vstoupil')|l] do města za vítězného zpěvu. Radujme se nyní a hodujme, neboť tuto legendu je třeba oslavit!"
 legend_chapter_famous_deed_generic: "[ROOT.Legend.GetProtagonist.Custom('CZ_FirstNamePossessiveNoTooltip_F')|U] legenda vrcholí úžasným dobrodružstvím. Tak veliké byly hrdinské činy, že nad nimi žasli všichni králové. Mnozí šlechtici i prostí lidé přicházeli, aby spatřili [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_A')] – živoucí legendu."
 legend_chapter_extra_deed_generic: "Tím však příběh nekončil. Na cestě domů [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'pomáhala','pomáhal')|l] lidem v nebezpečí a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'mstila','mstil')|l] jejich příkoří. Před hněvem této čepele se nemohli ukrýt lapkové, bestie ani zlosyni."
 legend_chapter_opening_debug: "#D Úvodní kapitola#!"
 legend_chapter_motivation_debug: "#D Kapitola o pohnutkách#!"
 legend_chapter_discovery_debug: "#D Kapitola o objevu#!"
 legend_chapter_hunt_debug: "#D Kapitola o lovu#!"
 legend_chapter_battle_debug: "#D Kapitola o bitvě#!"
 legend_chapter_famous_deed_debug: "#D Kapitola o slavném činu#!"
 legend_chapter_extra_deed_debug: "#D Kapitola o dalším činu#!"
 legend_chapter_conclusion_debug: "#D Závěrečná kapitola#!"
 legend_chapter_motivation_delicious_meats: "[Localize( Concatenate( 'animal_type_' , beast ) )|U] má pověst zuřivého a nebezpečného tvora. [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNamePossessiveNoTooltip_M')|U] úmysl však nešlo zvrátit. [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Trvala','Trval')|U] na tom, že okusí maso tohoto tvora, a tato touha hnala každý další krok."
 legend_chapter_motivation_dead_parent: "[Localize( Concatenate( 'animal_type_' , beast ) )|U] představuje skutečné nebezpečí, ale [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNamePossessiveNoTooltip_N')] srdce neochvějné. Prý toto zvíře zahubilo jednoho z rodičů – a to byl osobní důvod k pomstě."
 legend_chapter_motivation_great_venator: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] už [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'proslula','proslul')|l] po celé zemi jako [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'největší lovkyně','největší lovec')|l]. Pro odvážnou postavu s titulem [ROOT.Legend.GetProtagonist.GetTitleAsNameNoTooltip] však bylo třeba tuto pověst ještě potvrdit."
 legend_chapter_motivation_accomplished_hunter: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'hodlala','hodlal')|l] dokázat svou cenu při lovu. Konečně přišla příležitost předvést své umění – [Localize( Concatenate( 'animal_type_' , beast ) )|l] se blíží v celé své síle."
 legend_chapter_discovery_befriended_cyclops: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nacházela','nacházel')|l] přátele mezi všemi podivuhodnými lidmi na cestě. Dokonce se [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'spřátelila','spřátelil')|l] s velikým a mrzutým kyklopem!"
 legend_chapter_discovery_cyclops: "Na cestách se [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'setkávala','setkával')|l] s těmi nejpodivuhodnějšími lidmi. Vrcholem bylo odhalení, že mocní kyklopové skutečně existují!"
 legend_chapter_discovery_renowned_herbalist: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] už [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'měla','měl')|l] věhlasnou pověst v bylinkářství. Další slávu [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'získala','získal')|l] objevením smrtícího háje a průchodem mezi jeho jedovatými šlahouny."
 legend_chapter_discovery_evil_plants: "Cesty [ROOT.Legend.GetProtagonist.Custom('CZ_FirstName_G')] byly od začátku plné nebezpečí. Dokonce [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'čelila','čelil')|l] útoku háje jedovatých rostlin, jejichž pyl omamoval a mátl každého, kdo se přiblížil."
 legend_chapter_discovery_legendary_archer: "Cesty [ROOT.Legend.GetProtagonist.Custom('CZ_FirstName_G')] vedly k místu, kde se pyšnil vychloubačný lučištník. Vyzval [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'dobrou paní','dobrého pána')|l] ke střeleckému klání. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] jediným vlastním šípem vzápětí [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'rozštípla','rozštípl')|l] lučištníkův šíp ve dví!"
 legend_chapter_discovery_archery_contest_won: "Cesty [ROOT.Legend.GetProtagonist.Custom('CZ_FirstName_G')] vedly k místu, kde se pyšnil vychloubačný lučištník. Vyzval [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'dobrou paní','dobrého pána')|l] ke střeleckému klání. Souboj byl vyrovnaný, ale nakonec [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'prokázala','prokázal')|l] přesnější mušku."
 legend_chapter_discovery_bog_stronk: "Cesta [ROOT.Legend.GetProtagonist.Custom('CZ_FirstName_G')] vedla zrádným terénem, kde se i sama země pokoušela stáhnout [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'poutnici','poutníka')|l] pod svůj povrch. Jen nesmírná síla umožnila [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_D')] vyváznout."
 legend_chapter_discovery_bog_struggle: "Cesta [ROOT.Legend.GetProtagonist.Custom('CZ_FirstName_G')] vedla zrádným terénem, kde se i sama země pokoušela stáhnout [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'poutnici','poutníka')|l] pod svůj povrch. Po urputném zápasu se [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] nakonec ze zrádné půdy [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vyprostila','vyprostil')|l]."
 legend_chapter_discovery_wildflower_expert: "Cesty [ROOT.Legend.GetProtagonist.Custom('CZ_FirstName_G')] vedly do nových, neznámých zemí, kde i rostliny působily cize a podivuhodně. V hustém podrostu [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'objevila','objevil')|l] rostlinu, jakou nikdo nespatřil nikdy předtím ani potom."
 legend_chapter_discovery_cannibal_scarred: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'putovala','putoval')|l] daleko široko a dokonce [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'čelila','čelil')|l] útoku hladových lidojedů! Desítky jich [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'porazila','porazil')|l]. Jizvy v tváři zůstaly svědectvím tohoto zápasu až do konce života."
 legend_chapter_discovery_cannibal_fight: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'putovala','putoval')|l] daleko široko a dokonce [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'čelila','čelil')|l] útoku hladových lidojedů! Zápas trval až do západu slunce. Když zbylí lidojedi uprchli, [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'zůstala','zůstal')|l] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'naše hrdinka vyčerpaná','náš hrdina vyčerpaný')|l]."
 legend_chapter_battle_enemy_commander: "Uprostřed vřavy se [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ocitla','ocitl')|l] tváří v tvář samotnému ničemnému veliteli nepřátel! Po mohutném souboji jej [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'srazila','srazil')|l] k zemi. Po čepeli [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_G')] stékala krev, zatímco kolem dál zuřila bitva."
 legend_chapter_battle_faked_retreat: "[ROOT.Legend.GetProtagonist.Custom('CZ_FirstNamePossessive_F')|U] taktická obratnost prošla zkouškou v ohni bitvy a obstála. Lstivý předstíraný ústup vylákal nepřítele do zranitelného postavení. Poté [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'naše statečná hrdinka','náš statečný hrdina')|l] znovu [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vyrazila','vyrazil')|l] a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'pobila','pobil')|l] jej."
 legend_chapter_battle_flanking_success: "Odvážné a brilantní manévrování [ROOT.Legend.GetProtagonist.Custom('CZ_FirstName_G')] se na bojišti znovu osvědčilo. Osobně [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vedla','vedl')|l] burácivý útok do boku nepřítele. Zbabělý protivník zaváhal a dal se na útěk. Jediný úder rozhodl celý den."
 legend_chapter_battle_ravished_maiden: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] nikdy [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nedopustila','nedopustil')|l], aby nevinný člověk zahynul. I uprostřed bitvy si [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'našla','našel')|l] čas nejen zachránit, ale dokonce #EMP svést#! půvabnou osobu prostého původu, která zabloudila do nebezpečí!"
 legend_chapter_battle_maiden_kiss: "Když [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] uprostřed bitevní vřavy [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'spatřila','spatřil')|l] bezmocnou, zato oslnivě krásnou osobu z prostého lidu, ihned ji [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'odnesla','odnesl')|l] do bezpečí. Za odměnu [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'dostala','dostal')|l] polibek – přesně jak náleží [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ženě','muži')|l] takové rytířské cti!"
 legend_chapter_battle_wounded: "Bitva byla zuřivá a boj nelítostný. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] si z něj [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'odnesla','odnesl')|l] mnoho trvalých zranění. Malá cena pro [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ženu','muže')|l] takového přesvědčení a cti!"
 legend_chapter_battle_reinforcement_arrival: "Když bitva vrcholila, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] osobně [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'dorazila','dorazil')|l] v čele zástupu posil. Boj se obrátil ve prospěch [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'naší statečné hrdinky','našeho statečného hrdiny')|l], [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'která','který')|l] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vedla','vedl')|l] útok hluboko do nepřátelských řad."
 legend_chapter_opening_new_faith: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'přišla','přišel')|l] na svět v době, kdy se náboženství [ROOT.Legend.GetProperty( 'religion' ).Religion.GetNameNoTooltip] hluboce vzdálilo tomu, co [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName] [Select_CString(Or(EqualTo_string(ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName,Localize('confucianism_high_god_name'))),'žádají','žádá')|l]. Kazatelé a [ROOT.Legend.GetProperty( 'faith' ).Faith.PriestNeuterPlural|l] hlásali ve jménu tohoto božstva kacířství, zatímco [ROOT.Legend.GetProperty( 'faith' ).Faith.HouseOfWorshipPlural|l] chátrají bez péče věřících. Lid se obracel k jiným náboženstvím a lidská srdce dobývaly soupeřící božské síly."
 legend_chapter_motivation_new_faith: "Při pohledu na slabost a zkaženost víry se [ROOT.Legend.GetProtagonist.GetNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vydala','vydal')|l] za novou vizí náboženství [ROOT.Legend.GetProperty( 'religion' ).Religion.GetNameNoTooltip]. Za vírou, v níž [ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTerm] [ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTermHasHave|l] poslední slovo – silnou a jednotnou vírou šířící se do všech koutů světa!"
 legend_chapter_famous_deed_new_faith: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'hledala','hledal')|l] samotu daleko od prázdného žvanění kacířů. [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Vystoupila','Vystoupil')|U] na nejvyšší horu v zemi, [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'chráněna','chráněn')|l] pouze božskou milostí. [ROOT.Legend.GetProperty( 'faith' ).Faith.HealthGodName|U] – to byla jediná naděje na ochranu. Na vrcholu se rozestoupila oblaka. [ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTerm|U] [ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTermHasHave|l] pro [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_A')] vidění. Na smrtelném loži leží [ROOT.Legend.GetProperty( 'faith' ).Faith.PriestNeuter|l] s tělem vyzáblým věkem a žárlivě lpí na životě. Další [ROOT.Legend.GetProperty( 'faith' ).Faith.PriestNeuter|l], mnohem mladší, však toto tělo ukládá k poslednímu odpočinku. Vidění nepochybně předpovídalo božské požehnání nové víře [ROOT.Legend.GetProperty( 'faith' ).Faith.GetNameNoTooltip]."
 legend_chapter_extra_deed_new_faith: "[ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTerm|U] [ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTermHasHave|l] mnoho soupeřů stvořených lidstvem a [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] je všechny [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'svrhla','svrhl')|l]. Tak kolem sebe [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'shromáždila','shromáždil')|l] veliké stádo, které [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'mohla','mohl')|l] vést."
 legend_chapter_conclusion_new_faith: "[ROOT.Legend.GetProperty( 'faith' ).Faith.PriestNeuterPlural|U] se shromažďují a znovu sepisují posvátný text „[ROOT.Legend.GetProperty( 'faith' ).Faith.ReligiousText]“. Náboženství [ROOT.Legend.GetProperty( 'religion' ).Religion.GetNameNoTooltip] se konečně obnovilo a [ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTerm] [ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTermHasHave|l] víru podle své vůle!"
 legend_chapter_battle_legendary_battle: "$legendary_battle_desc$"
 legend_chapter_opening_struggle: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'se narodila','se narodil')|l] uprostřed bouřlivého chaosu zápasu [ROOT.Legend.GetProperty( 'struggle' ).GetFlagName|l]. Ani [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'netušila','netušil')|l], že právě tato životní pouť přinese kraji mír a pořádek."
 legend_chapter_motivation_struggle: "Když [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'spatřila','spatřil')|l], jak se bratr obrací proti bratru – [ROOT.Legend.GetProtagonist.GetFaith.GetAdherentNameNoTooltip|l] proti vlastnímu souvěrci – [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'pronesla','pronesl')|l] k hádajícím se bláznům jen: „Už dost.“ Bylo jasné, že utrpení lidu musí skončit a že z trosek zápasu [ROOT.Legend.GetProperty( 'struggle' ).GetFlagName|l] musí vzejít nová budoucnost."
 legend_chapter_extra_deed_struggle: "Navzdory všemu, čeho [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'dosáhla','dosáhl')|l], stále někteří pochybovali o této vizi ukončení zápasu [ROOT.Legend.GetProperty( 'struggle' ).GetFlagName|l]. Jejich odpor brzy padl na poli debat i bitev. Nakonec se všichni plazili u [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jejích','jeho')|l] nohou a prosili o milost."
 legend_chapter_conclusion_ended_struggle: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'viděla','viděl')|l], že řád světa je špatný. Díky tomuto úsilí však takzvaný zápas [ROOT.Legend.GetProperty( 'struggle' ).GetFlagName|l] skončil a kraj už nikdy nebude stejný. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] vychází jako [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vítězná','vítězný')|l] [ROOT.Legend.GetProtagonist.GetTitleAsNameNoTooltip] nad všemi ostatními."
 legend_chapter_opening_priesthood_restoration: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vstoupila','vstoupil')|l] do světa, v němž se [ROOT.Legend.GetProperty( 'faith' ).Faith.Custom('CZ_AdjectiveNoTooltip_sti')|l] věřící rozptýlili po všech zemích v beznadějné diaspoře. Před očima se zjevovala mohutná svatyně [ROOT.Legend.GetProperty( 'faith' ).Faith.HouseOfWorship|l], tyčící se nad celým stvořením. [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Věděla','Věděl')|U], že [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName] [Select_CString(Or(EqualTo_string(ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName,Localize('confucianism_high_god_name'))),'ukládají','ukládá')|l] posvátné poslání: sjednotit všechny věřící [ROOT.Legend.GetProperty( 'faith' ).Faith.GetAdherentNamePluralNoTooltip|l]."
 legend_chapter_famous_deed_religious: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'zasvětila','zasvětil')|l] svůj život tomu, co [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName] [Select_CString(Or(EqualTo_string(ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName,Localize('confucianism_high_god_name'))),'žádají','žádá')|l], a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jednala','jednal')|l] pouze podle této božské vůle. Každý věřící [ROOT.Legend.GetProperty( 'faith' ).Faith.GetReligion.GetAdherentNameNoTooltip|l] putoval zemí se jménem „[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]“ na rtech a vyprávěl o nesčetných posvátných událostech konaných v tomto jménu."
 legend_chapter_extra_deed_religious: "Tím však příběh nekončil. Věřící stále sužovali lapkové a zlosyni a zotročovali je kacíři! [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'pomohla','pomohl')|l] lidem pod tyranskou vládou pozvednout se a přijmout ochranu, kterou [Select_CString(Or(EqualTo_string(ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName,Localize('confucianism_high_god_name'))),'nabízejí','nabízí')|l] [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName]. [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Zvítězila','Zvítězil')|U] nad zlem jménem [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName] i jeho přisluhovači."
 legend_chapter_conclusion_priesthood_restored: "Duchovenstvo se shromáždilo a diaspora skončila. Už nikdy nebudou věřící [ROOT.Legend.GetProperty( 'faith' ).Faith.GetAdherentNamePluralNoTooltip|l] rozptýleni bez vedení. [ROOT.Legend.GetProperty( 'faith' ).Faith.ReligiousHeadName|U] stojí v čele obnovené víry z vůle [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_G')]."
 legend_chronicle_opening_exotic_backstory: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'přicestovala','přicestoval')|l] se svým posláním z daleké, tajemné země [ROOT.Legend.GetProperty( 'location' ).GetFlagName]. Mezi svým lidem [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'byla hrdinkou','byl hrdinou')|l]. Nyní však nabízí dobrodiní i našemu malému koutku rozlehlého a nekonečného světa."
 legend_chronicle_motivation_exotic_backstory: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'pohlédla','pohlédl')|l] na nový domov a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'rozplakala se','rozplakal se')|l]. Jeho umění a kultura byly tak primitivní ve srovnání s divy domoviny [ROOT.Legend.GetProperty( 'location' ).GetFlagName]. Úkol byl jasný: [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] musí do tohoto koutku stvoření rozšířit osvícenost vlastní země."
 legend_chronicle_conclusion_exotic_backstory: "Od příchodu [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_G')] se mnoho změnilo. Tam, kde se kdysi rolníci váleli ve špíně a barbaři vysávali zemi, se nyní šířilo světlo civilizace. Všechny kameny na cestě [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'posbírala','posbíral')|l] a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'použila','použil')|l] je ke stavbě nové země [ROOT.Legend.GetProperty( 'location' ).GetFlagName]. Po celém panství dostávají děti jméno [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] a zástupy vděčně zpívají o [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'cizince','cizinci')|l] ze země [ROOT.Legend.GetProperty( 'location' ).GetFlagName], [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'která','který')|l] jim [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vystavěla','vystavěl')|l] veliké město."
 legend_chronicle_divine_intervention_motivation: "Ve světě snů [Localize( god )] [Select_CString(EqualTo_string(Localize( god ),Localize('the_angels')),'svěřují','svěřuje')|l] [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_D')] posvátné poslání. Od té chvíle se [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'modlila','modlil')|l] a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'prohledávala','prohledával')|l] země, aby [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'pochopila','pochopil')|l], jaké poslání pro [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ni','něj')|l] [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] [ROOT.Legend.GetProtagonist.GetFaith.PantheonTermHasHave|l]."
 legend_chapter_famous_deed_divine_intervention: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'zasvětila','zasvětil')|l] život poslání, které [Localize( god )] [Select_CString(EqualTo_string(Localize( god ),Localize('the_angels')),'ukládají','ukládá')|l], a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jednala','jednal')|l] tak, aby [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] [ROOT.Legend.GetProtagonist.GetFaith.PantheonTermHasHave|l] důvod k přízni. Po mnoha dnech a nocích v odloučení a modlitbách se konečně ukázala pravá podstata tohoto poslání!"
 legend_chapter_extra_deed_divine_intervention: "Země byla plná bezcitných lapků, kteří ubližovali věřícím. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] je však s družinou [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'zahnala','zahnal')|l] zpět do záhrobí zvaného [ROOT.Legend.GetProtagonist.GetFaith.NegativeAfterLife], kam přisluhovači zla jménem [ROOT.Legend.GetProtagonist.GetFaith.DevilName] patří. Lid byl svobodný. [Localize( god )|U] [Select_CString(EqualTo_string(Localize( god ),Localize('the_angels')),'shlížejí','shlíží')|l] s úsměvem na dobrotu [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_G')] a posvátné poslání se blížilo svému vrcholu."
 legend_chapter_conclusion_divine_intervention: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vládla','vládl')|l] spravedlivě a zbožně pod vedením, které [Localize( god )] [Select_CString(EqualTo_string(Localize( god ),Localize('the_angels')),'poskytují','poskytuje')|l]. Božský plán se naplnil a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'prožila','prožil')|l] život plný cti a zbožnosti."
 legend_chapter_opening_ancestral_glory: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'pocházela','pocházel')|l] přímo z krve předka jménem [ROOT.Legend.Custom('GetAncestorNameNoTooltip')]. Mohlo snad být s přirozenou silou tohoto velkého rodu pochyb o budoucích velkých činech?"
 legend_chapter_motivation_ancestral_glory: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nepochybovala','nepochyboval')|l] o svém úkolu: sjednotit celé území [CZLandTextG(ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip)] pod svou vládou. Na počest předka jménem [ROOT.Legend.Custom('GetAncestorFirstNameNoTooltip')] měly skončit sváry drobných pánů a paní a všichni měli přijmout [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_A')] za [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'svou lenní paní','svého lenního pána')|l]."
 legend_chapter_famous_deed_ancestral_glory: "Blázni se shromažďovali, aby vyzvali [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_A')], ale byli jako vítr proti hoře. S každým podivuhodným činem přibývalo následovníků, přesvědčených, že [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] [ROOT.Legend.GetProtagonist.GetFaith.PantheonTermHasHave|l] v tomto díle zalíbení. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] se [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'stávala','stával')|l] živoucím obrazem předka jménem [ROOT.Legend.Custom('GetAncestorFirstNameNoTooltip')]."
 legend_chapter_extra_deed_ancestral_glory: "Krásný venkov území [CZLandTextG(ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip)] ovládli po časech předka jménem [ROOT.Legend.Custom('GetAncestorFirstNameNoTooltip')] lupiči a lapkové. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] se však záhy [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'pustila','pustil')|l] do nápravy křivd a ochrany lidí, jimž [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'měla','měl')|l] po právu vládnout."
 legend_chapter_conclusion_ancestral_glory: "Cesta byla plná nebezpečí. Po všem, co [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vykonala','vykonal')|l] pro území [CZLandTextG(ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip)] a jeho lid, však nemohlo být pochyb, že [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] [ROOT.Legend.GetProtagonist.GetFaith.PantheonTermHasHave|l] pro [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_A')] místo na trůně. Od měst po nejskromnější usedlosti všichni nadšeně provolávají jméno „[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]“!"
 legend_chapter_opening_ancient_people: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'se narodila','se narodil')|l] do velkého [ROOT.Legend.GetProperty( 'culture' ).Culture.Custom('CZ_AdjectiveNoTooltip_eeho')|l] rodu, aby [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vládla','vládl')|l] území [CZLandTextG(ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip)] tak, jako kdysi předkové."
 legend_chapter_conclusion_ancient_people: "S nesmírným úsilím [ROOT.Legend.GetProtagonist.GetNameNoTooltip] neúnavně [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'pracovala','pracoval')|l] na tom, aby z [ROOT.Legend.GetProperty( 'title' ).Title.Custom('CZ_LandedNameNoTooltip_G')] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'učinila','učinil')|l] obraz [ROOT.Legend.GetProperty( 'culture' ).Culture.Custom('CZ_AdjectiveNoTooltip_eeho')|l] dokonalého světa. Jen díky legendárním činům [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_G')] lidé v [ROOT.Legend.GetProperty( 'title' ).Title.Custom('CZ_LandedNameNoTooltip_L')] hrdě hlásají své [ROOT.Legend.GetProperty( 'culture' ).Culture.Custom('CZ_AdjectiveNoTooltip_ee')|l] kořeny!"
 legend_chapter_motivation_saintly_deed: "[ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm|U] [ROOT.Legend.GetProtagonist.GetFaith.PantheonTermHasHave|l] pro [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_A')] jasné poslání: konat divy! Všichni věřící [ROOT.Legend.GetProperty( 'religion' ).Religion.GetAdherentNamePluralNoTooltip|l] uchovávají v srdci památku předka jménem [ROOT.Legend.Custom('GetAncestorNameNoTooltip')], ale nikdo netušil, jaké zázraky [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] teprve vykoná!"
 legend_chapter_motivation_saintly_life: "[ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm|U] [ROOT.Legend.GetProtagonist.GetFaith.PantheonTermHasHave|l] pro [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_A')] jasné poslání: konat divy! Všichni věřící [ROOT.Legend.GetProperty( 'religion' ).Religion.GetAdherentNamePluralNoTooltip|l] chovají v srdci takové naděje, ale nikdo netušil, jaké zázraky [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] teprve vykoná!"
 legend_chapter_extra_deed_saintly_deed: "Cesty věřících napadali bezbožníci. Čepelí požehnanou Všemohoucím je [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] všechny [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'zahnala','zahnal')|l]. Divoké bestie a hadi však dál zraňovali poutníky. [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Vytáhla','Vytáhl')|U] proto svůj nástroj [ROOT.Legend.GetProtagonist.Custom('GetMusicalInstrument')|l] a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'očarovala','očaroval')|l] jím tvorstvo, jehož původcem je [ROOT.Legend.GetProtagonist.GetFaith.CreatorName], aby opustilo zdejší země."
 legend_chapter_conclusion_saintly_deed: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'pracovala','pracoval')|l] neúnavně pro celé náboženství [ROOT.Legend.GetProperty( 'religion' ).Religion.GetNameNoTooltip] a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'bojovala','bojoval')|l] proti přisluhovačům zla jménem [ROOT.Legend.GetProtagonist.GetFaith.DevilName] zde na zemi. Nakonec však zápasy skončily. Božský plán se naplnil a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'prožila','prožil')|l] život plný cti a zbožnosti."
 legend_chapter_opening_mythical_descent: "Stejně jako všichni dřívější členové rodu [ROOT.Legend.GetProtagonist.GetDynastyNameNoTooltip] se [ROOT.Legend.GetProtagonist.GetNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'narodila','narodil')|l] s prastarou krví. [ROOT.Legend.GetProperty( 'beast' ).GetFlagName|U] patří k předkům tohoto rodu. Tento mimořádný původ vyvyšuje [ROOT.Legend.GetProtagonist.Custom('CZ_NameNoTooltip_A')] nade všechny a předurčuje k velikosti."
 legend_chapter_famous_deed_mythical_descent: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'utrpěla','utrpěl')|l] zranění ve velké bitvě s padouchem, který pochyboval o božském původu. Krev se rozlila po poli. Zářila a jiskřila jako čerstvě broušené drahokamy. Během několika dní nehostinnou půdu pokryly květy nádherných barev."
 legend_chapter_extra_deed_mythical_descent: "Tím však příběh nekončil. Mnozí stále pochybovali o božské krvi. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] na ně svou velikou mocí [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'seslala','seslal')|l] pohromu v podobě bestií. Paláce a domy pochybovačů naplnil hladový štěkot a křik."
 legend_chapter_opening_godly_descent: "Božstvo [ROOT.Legend.GetProperty( 'god' ).GetFlagName] zplodilo dítě s předkem [ROOT.Legend.GetProtagonist.Custom('CZ_NameNoTooltip_G')] a z lůna světa vzešel první člen rodu [ROOT.Legend.GetProtagonist.GetDynastyNameNoTooltip]. Od narození nesou všichni členové tohoto rodu posvátné poslání: přinášet blahobyt a víru [ROOT.Legend.GetProtagonist.GetFaith.GetNameNoTooltip] do všech koutů území [CZLandTextG(ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip)]."
 legend_chapter_famous_deed_war_won: "Bitvy se přelévaly sem a tam. Válka zbarvila zemi do ruda krví spravedlivých i ničemů. [ROOT.Legend.GetProperty( 'winner' ).Char.GetNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProperty( 'winner' ).Char.IsFemale,'zůstala neochvějně pevná','zůstal neochvějně pevný')|l], zatímco síly zla se pokoušely přelstít tuto mistrovskou vojenskou strategii. Jejich snahy však nakonec přišly vniveč."
 legend_chapter_conclusion_war_won: "[ROOT.Legend.GetProperty( 'loser' ).Char.GetNameNoTooltip|U] s přisluhovači sklopili hlavy pod rozbitou korouhví a prosili [ROOT.Legend.GetProperty( 'winner' ).Char.Custom('CZ_FirstNameNoTooltip_A')] o milost. V temných dnech války bylo jedinou představitelnou nadějí přežít. Nyní však [ROOT.Legend.GetProperty( 'winner' ).Char.GetNameNoTooltip] [Select_CString(ROOT.Legend.GetProperty( 'winner' ).Char.IsFemale,'vyšla','vyšel')|l] jako [Select_CString(ROOT.Legend.GetProperty( 'winner' ).Char.IsFemale,'vítězka','vítěz')|l]. [Select_CString(ROOT.Legend.GetProperty( 'winner' ).Char.IsFemale,'Jediná vítězka','Jediný vítěz')|U]."
 legend_chapter_motivation_new_title: "Dávno předtím, než rod [ROOT.Legend.GetProperty( 'founder' ).Char.GetDynastyNameNoTooltip] převzal správu území [CZLandTextG(ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip)], [ROOT.Legend.GetProperty( 'founder' ).Char.GetNameNoTooltip] [Select_CString(ROOT.Legend.GetProperty( 'founder' ).Char.IsFemale,'obdržela','obdržel')|l] vidění, které odhalilo, jaký plán pro [Select_CString(ROOT.Legend.GetProperty( 'founder' ).Char.IsFemale,'ni','něj')|l] [ROOT.Legend.GetProperty( 'founder' ).Char.GetFaith.PantheonTerm] [ROOT.Legend.GetProperty( 'founder' ).Char.GetFaith.PantheonTermHasHave|l]. Od té chvíle [Select_CString(ROOT.Legend.GetProperty( 'founder' ).Char.IsFemale,'věděla','věděl')|l], že [Select_CString(ROOT.Legend.GetProperty( 'founder' ).Char.IsFemale,'se narodila','se narodil')|l] k vládě."
 legend_chapter_famous_deed_new_title: "Země, z nichž mělo vzniknout území [CZLandTextG(ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip)], úpěly pod vládou krutých přisluhovačů zla jménem [ROOT.Legend.GetProperty( 'founder' ).Char.GetFaith.DevilName]. [ROOT.Legend.GetProperty( 'founder' ).Char.GetNameNoTooltip|U] je však s velkými vojsky [Select_CString(ROOT.Legend.GetProperty( 'founder' ).Char.IsFemale,'osvobozovala','osvobozoval')|l], vesnici za vesnicí, město za městem. Lid se chopil zbraní a ve službách [ROOT.Legend.GetProperty( 'founder' ).Char.Custom('CZ_FirstNameNoTooltip_G')] svrhl zlé vládce, připraven zemřít za [Select_CString(ROOT.Legend.GetProperty( 'founder' ).Char.IsFemale,'právoplatnou panovnici','právoplatného panovníka')|l]. [ROOT.Legend.GetProperty( 'founder' ).Char.GetFaith.HighGodName|U] tuto oběť [Select_CString(Or(EqualTo_string(ROOT.Legend.GetProperty( 'founder' ).Char.GetFaith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(ROOT.Legend.GetProperty( 'founder' ).Char.GetFaith.HighGodName,Localize('confucianism_high_god_name'))),'odmítají','odmítá')|l] a [Select_CString(Or(EqualTo_string(ROOT.Legend.GetProperty( 'founder' ).Char.GetFaith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(ROOT.Legend.GetProperty( 'founder' ).Char.GetFaith.HighGodName,Localize('confucianism_high_god_name'))),'poskytují','poskytuje')|l] jim božskou ochranu. Žádná čepel se nemohla dotknout rostoucích vojsk [ROOT.Legend.GetProperty( 'founder' ).Char.Custom('CZ_FirstNameNoTooltip_G')] při osvobozování lidu území [CZLandTextG(ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip)]."
 legend_chapter_conclusion_new_title: "Svár vévodů a bezejmenných drobných šlechticů konečně skončil. [ROOT.Legend.GetProperty( 'founder' ).Char.GetNameNoTooltip|U] je všechny [Select_CString(ROOT.Legend.GetProperty( 'founder' ).Char.IsFemale,'přinutila','přinutil')|l] sklonit se a slíbit věčnou věrnost. Když se území [CZLandTextG(ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip)] zrodilo nanovo, podoba světa se navždy změnila."
 legend_chronicle_sacred_birth_opening: "Už ode dne narození bylo jasné, že [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] [ROOT.Legend.GetProtagonist.GetFaith.PantheonTermHasHave|l] pro [ROOT.Legend.GetProtagonist.Custom('CZ_NameNoTooltip_A')] přichystaný velký osud. [ROOT.Legend.Custom('GetBirthCircumstancesLegend')|U] předznamenalo budoucí velikost."
 born_to_a_virgin_mother: "zrození z panenské matky"
 born_under_auspicious_stars: "zrození pod příznivými hvězdami"
 legend_chapter_motivation_sacred_birth: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'probděla','probděl')|l] mnoho nocí sužovaných vidinami vlastního narození. Jedné osudné noci se [Select_CString(Or(EqualTo_string(ROOT.Legend.GetProtagonist.GetFaith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(ROOT.Legend.GetProtagonist.GetFaith.HighGodName,Localize('confucianism_high_god_name'))),'zjevují','zjevuje')|l] [ROOT.Legend.GetProtagonist.GetFaith.HighGodName] a [Select_CString(Or(EqualTo_string(ROOT.Legend.GetProtagonist.GetFaith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(ROOT.Legend.GetProtagonist.GetFaith.HighGodName,Localize('confucianism_high_god_name'))),'prohlašují','prohlašuje')|l], že [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] přichází na svět s posvátným úkolem, který přesahuje obvyklé poslání [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ženy','muže')|l]. Od toho dne [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'věděla','věděl')|l], že okolnosti narození nebyly pověstí ani náhodou: [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] [ROOT.Legend.GetProtagonist.GetFaith.PantheonTermHasHave|l] v celém příběhu přímý podíl!"
 legend_chapter_conclusion_sacred_birth: "Po všech velkých činech přišlo další zjevení: [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] [ROOT.Legend.GetProtagonist.GetFaith.PantheonTermHasHave|l] ještě jedno poselství. Tentokrát nešlo o pouhý sen či vidění. [ROOT.Legend.GetProtagonist.GetFaith.HighGodName|U] se [Select_CString(Or(EqualTo_string(ROOT.Legend.GetProtagonist.GetFaith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(ROOT.Legend.GetProtagonist.GetFaith.HighGodName,Localize('confucianism_high_god_name'))),'ukazují','ukazuje')|l] v tělesné podobě a [Select_CString(Or(EqualTo_string(ROOT.Legend.GetProtagonist.GetFaith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(ROOT.Legend.GetProtagonist.GetFaith.HighGodName,Localize('confucianism_high_god_name'))),'nabízejí','nabízí')|l] [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_D')] pohár vody. Doušek přinesl dotek božskosti. Zástupy provolávaly jméno [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_G')] a prosily o pouhý dotek božských léčivých rukou."
 legend_chronicle_unsuspecting_opening: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'se narodila','se narodil')|l] jako [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'kterákoli jiná žena','kterýkoli jiný muž')|l], bez tušení velkých činů, které pro [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ni','něj')|l] [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] [ROOT.Legend.GetProtagonist.GetFaith.PantheonTermHasHave|l] v plánu."
 legend_chapter_motivation_fought_devil: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'trpěla','trpěl')|l] nočními můrami. Vidiny zla jménem [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName] syčely a působily muka. Každého dne se [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'probouzela','probouzel')|l] s novým odhodláním a pocitem, že [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] [ROOT.Legend.GetProtagonist.GetFaith.PantheonTermHasHave|l] s tímto životem svůj plán."
 legend_chapter_famous_deed_fought_devil: "Jedné noci navštívilo [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_A')] zlo jménem [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName]. Na zakrvácených stěnách visely všelijaké biče a kruté nástroje mučení. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nahá a neochvějná zápasila','nahý a neochvějný zápasil')|l] s touto stvůrou. Celou bytostí proudila síla a odhodlání, které [Select_CString(Or(EqualTo_string(ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName,Localize('confucianism_high_god_name'))),'udílejí','udílí')|l] [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName]. Zlá stvůra bezmocně přitisknutá k zemi jen syčela a vrčela. Zlo podlehlo [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'pouhé ženě','pouhému muži')|l]!"
 legend_chapter_extra_deed_fought_devil: "Zlo jménem [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName], nespokojené a plné nenávisti ke všemu dobrému a spravedlivému, vyzvalo [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_A')] k hudebnímu klání na nástroj [ROOT.Legend.GetProtagonist.Custom('GetMusicalInstrument')|l]. Melodie [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_G')] je přiměla rozplynout se do záhrobí zvaného [ROOT.Legend.GetProperty( 'faith' ).Faith.NegativeAfterLife]. Sama melodie se pak z mysli vytratila jako kouř – nepochybně byla příliš božská pro svět lidí."
 legend_chapter_conclusion_fought_devil: "Po porážce zla jménem [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName] se [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'zasvětila','zasvětil')|l] vymýcení sil zla ve světě smrtelníků. Po celý život nesla tato duše posvátnou záři a zanechávala za sebou mír a civilizaci."
 legend_chapter_famous_deed_tournament_won: "Ve velkolepé přehlídce válečného umění se střetávaly mysli a hlasy stejně jako čepele. Žádná mysl však nebyla tak bystrá a žádná čepel tak ostrá jako u [ROOT.Legend.GetProtagonist.Custom('CZ_NameNoTooltip_G')]! Jeden soupeř za druhým nastupoval jen proto, aby jej [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nedostižná','nedostižný')|l] [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'dohnala','dohnal')|l] k pláči."
 legend_chapter_extra_deed_tournament_won: "Nikdo nemohl zapomenout na slávu prvního turnaje [ROOT.Legend.GetProtagonist.Custom('CZ_NameNoTooltip_G')]. Jediné vítězství však nestačilo. Soupeři obklopili [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_A')] bouří čepelí, avšak [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'zůstala','zůstal')|l] neochvějně stát. [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Vyšla','Vyšel')|U] vítězně před dav provolávající [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'její','jeho')|l] jméno!"
 legend_chronicle_opening_raised_by_animals: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] jako nemluvně bez jídla a naděje na záchranu [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'ležela ztracená','ležel ztracený')|l] u řeky, dokud se neobjevila mocná zvířecí matka – [ROOT.Legend.GetProperty( 'beast' ).GetFlagName|l]. Krmila dítě svým mlékem, až z něj [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vyrostla herkulovská žena','vyrostl herkulovský muž')|l] se vší silou a odvahou tohoto zvířete."
 legend_chapter_motivation_raised_by_animals: "Po návratu mezi lidi [ROOT.Legend.GetProtagonist.GetFirstName] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'poznala','poznal')|l], jak se kraje zmocnil chaos. Soused napadal souseda stejně, jako [ROOT.Legend.GetProperty( 'beast' ).GetFlagName|l] napadá svou kořist. Bylo jasné, že lid potřebuje silného vůdce, který sjednotí smečku za společným cílem."
 legend_chapter_conclusion_raised_by_animals: "[ROOT.Legend.GetProtagonist.GetFirstName|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vládla','vládl')|l] silně a hrdě, tak, jak vládne [ROOT.Legend.GetProperty( 'beast' ).GetFlagName|l]. Přestože svou zvířecí matku už nikdy [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nespatřila','nespatřil')|l], nebylo pochyb, že [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] [ROOT.Legend.GetProtagonist.GetFaith.PantheonTermHasHave|l] ve zvířecí matce svého posla, který na tuto vládu shlíží s velikou hrdostí. Země zůstala klidná a mírumilovná. Žádný nepřítel se neodvážil vybočit, protože [ROOT.Legend.GetProperty( 'beast' ).GetFlagName|l] umí takový vzdor krutě potrestat."
 legend_chapter_extra_deed_recent_battle: "Na cestě domů [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] statečně [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'bojovala','bojoval')|l] s nepřáteli a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vedla','vedl')|l] své lidi s nedostižnou odvahou a strategickou brilantností. S mečem vysoko nad hlavou a neochvějným odhodláním je [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'povzbuzovala','povzbuzoval')|l] k vítězství."
 legend_chapter_extra_deed_recent_siege: "Na cestě domů [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] s neústupným odhodláním [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vedla','vedl')|l] obléhání nepřátelské pevnosti a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'roztříštila','roztříštil')|l] město jako nejjemnější sklo. [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Shromáždila','Shromáždil')|U] vojska, [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'rozvinula','rozvinul')|l] korouhve a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vyrazila','vyrazil')|l] k nelítostnému útoku, který prolomil obranu a přinesl vítězství."
 legend_chapter_extra_deed_recent_imprisonment: "V hlubinách nejtemnějšího žaláře, bez jídla a vody, v okovech a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'obklopena','obklopen')|l] stíny, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nalezla','nalezl')|l] odhodlání k útěku. [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip|U] se zaťatými zuby a srdcem hořícím vzdorem noc co noc [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'plánovala','plánoval')|l] únik. Lstí a nezlomnou vůlí nakonec [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'prošla','prošel')|l] tajnými chodbami do ranního světla."
 legend_chapter_extra_deed_recent_tournament: "Na cestě domů [ROOT.Legend.GetProtagonist.Custom('CZ_TitledFirstNameNoTooltip_A')] uchvátila nádhera slavného turnajiště. S mečem v ruce a zbrojí zářící na slunci [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'čelila','čelil')|l] mocným soupeřům s neochvějným odhodláním. Diváci jásali, sličné dámy a snadno okouzlená pážata se vrhaly k [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'jejím','jeho')|l] nohám! [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Vítězka','Vítěz')|U]! [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Nejlepší rytířka','Nejlepší rytíř')|U]!"
 legend_chapter_famous_deed_saintly_deed: "Uprostřed pochybností a nedůvěry lidu [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'stála','stál')|l] neochvějně ve víře. Vše se zdálo ztracené. Krev zbarvila bojiště a v zemi vězela kopí opuštěná svými držiteli. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] však [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'padla','padl')|l] na kolena s ústy plnými modliteb. Z kopí vykvetly květiny. Nepřátelé při pohledu na zázrak padli k zemi."
 legend_chapter_famous_deed_holy_warrior: "[ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip|U], vždy pevná opora víry, [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'prokázala','prokázal')|l] opravdové hrdinství ve svaté válce proti těm, kdo se staví proti tomu, co [Select_CString(Or(EqualTo_string(ROOT.Legend.GetProtagonist.GetFaith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(ROOT.Legend.GetProtagonist.GetFaith.HighGodName,Localize('confucianism_high_god_name'))),'žádají','žádá')|l] [ROOT.Legend.GetProtagonist.GetFaith.HighGodName]. [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Putovala','Putoval')|U] do cizích zemí s odhodláním obnovit mír a blahobyt, o něž falešní bohové připravili svůj nevědomý lid. Do předloktí si [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vyryla','vyryl')|l] symbol víry [ROOT.Legend.GetProtagonist.GetFaith.GetNameNoTooltip]. Krev stékala na mrtvoly nevěřících."
 legend_chapter_opening_legendary_battle: "V kronikách času plane příběh bitvy tak slavné, že její ozvěna zní věčností. V této bitvě [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'stála','stál')|l] jako kolos uprostřed válečné bouře."
 legend_chapter_famous_deed_raised_by_animals: "S každým dnem [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'rostla','rostl')|l] v síle a moudrosti, [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nedotčena','nedotčen')|l] barbarstvím civilizace. Podobně jako zakladatelé Říma [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'přijala','přijal')|l] svět, který dal život, a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'naučila','naučil')|l] obyvatele domů mistrovství lovu. Při jedné takové výpravě padla bílá šelma – [ROOT.Legend.GetProtagonist.Custom('RegionalFerociousAnimal')|l]."
 legend_chapter_conclusion_dead_loved_spouse: "Když se [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'vrátila','vrátil')|l] domů, srdce se zachvělo jako holubička, která chce vyletět z hrudi. [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Plná emocí se nemohla','Plný emocí se nemohl')|U] dočkat shledání s pravou láskou. Pak strašlivý výkřik. Hradní síně naplnil žal: bledé rty milované polovičky byly bez života. V tichu samoty vyvstaly vzpomínky na lásku, která rozpalovala srdce, a přinesly strašlivou bolest. Jakou cenu měla tato legenda, nebylo-li s kým se o ni podělit?"
 legend_chapter_conclusion_point_of_interest: "Na dalekých cestách [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'narazila','narazil')|l] na úchvatný div přesahující pozemské meze – místo, kde se krása přírody pojila s lidským důmyslem. Vysoké věže vytříbeného řemeslného umění se tyčily k nebesům, jejich ladné tvary zalévala měkká záře úsvitu. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] se zhluboka [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nadechla','nadechl')|l]. Lepší konec si [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nemohla','nemohl')|l] přát."
 legend_chapter_motivation_child_mother: "V tichých hradních chodbách, kde na kamenných stěnách tančí stíny a ve vzduchu se vznáší šepot dávných příběhů, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'kolébala','kolébal')|l] v něžném objetí novorozené dítě. Při pohledu do jeho nevinných očí se v srdci rozhořelo odhodlání. Jaký odkaz po sobě zanechat? Má si svět pamatovat [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'zbabělkyni, která se ukrývala','zbabělce, který se ukrýval')|l] mezi hedvábím a květinami?"
 legend_chapter_motivation_child_father: "Ve vážných komnatách rodového sídla, kde mihotavé svíce vrhaly stíny na staré tapiserie, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] s úžasem [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'hleděla','hleděl')|l] na darovaný zázrak života. S narozením dítěte se zrodilo i odhodlání ochránit vlastní odkaz."
 legend_chapter_opening_witch: "Zájem [ROOT.Legend.GetProtagonist.Custom('CZ_TitledFirstNameNoTooltip_G')] o skryté umění vždy budil podezření. Kolovala obvinění z čarodějnictví a kouzel, která vrhala temný stín na kdysi slavné jméno. Když věrní poddaní začali sledovat každý krok, tíha nedůvěry stále více doléhala."
 legend_chapter_motivation_celibacy: "[ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip|U], kdysi v královském šatu, nyní [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'stála','stál')|l] v prostém rouchu, jaké nosí [ROOT.Legend.GetProtagonist.GetFaith.PriestNeuter|l], [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'zbavena','zbaven')|l] koruny. Nikdy však [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nezapomněla','nezapomněl')|l], co [Select_CString(Or(EqualTo_string(ROOT.Legend.GetProtagonist.GetFaith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(ROOT.Legend.GetProtagonist.GetFaith.HighGodName,Localize('confucianism_high_god_name'))),'žádají','žádá')|l] [ROOT.Legend.GetProtagonist.GetFaith.HighGodName]. Oddanost hořela ještě jasněji, věčná a neuhasitelná. Božská inspirace přiměla [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNameNoTooltip_A')] vykročit po cestě, která navždy zvěční toto jméno."
 legend_chapter_opening_new_culture: "[ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'se narodila','se narodil')|l] v době, kdy staré tradice dosloužily. S vizí v mysli se [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'rozhodla','rozhodl')|l] vytvořit vlastní tradice – a tak vznikla [ROOT.Legend.GetProtagonist.GetCulture.Custom('CZ_AdjectiveNoTooltip_aa')|l] kultura."
 legend_chapter_opening_new_faith_generic: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'přišla','přišel')|l] na svět v době, kdy se náboženství vzdálilo zásadám víry [ROOT.Legend.GetProtagonist.GetFaith.GetNameNoTooltip]. Kazatelé hlásali kacířství ve jménu víry, jejímž středem [Select_CString(Or(EqualTo_string(ROOT.Legend.GetProtagonist.GetFaith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(ROOT.Legend.GetProtagonist.GetFaith.HighGodName,Localize('confucianism_high_god_name'))),'jsou','je')|l] [ROOT.Legend.GetProtagonist.GetFaith.HighGodName], zatímco víra chátrala a byla opuštěná. Lid se obracel k jiným náboženstvím a soupeři tohoto božstva dobývali lidská srdce."
 legend_chapter_winner_change_toast: "Legenda [winner.GetPromotedLegend.GetName] se mění"
 legend_chapter_change_toast: "Legenda [ROOT.Char.GetPromotedLegend.GetName] se mění"
 legend_chapter_change_culture_toast: "Legenda [founder.GetPromotedLegend.GetName] se mění"
 spread_legend_intent: "Šířit legendu"
 spread_legend_intent_desc: "Tuto aktivitu využiješ jako příležitost k šíření své [Concept('legend','legendy')|E]."
 spread_legend_intent_not_valid_desc: "#X V tuto chvíli nevlastníš žádnou [Concept('legend','legendu')|E]#!"
 legend_chronicle_war_won_chronicle: "Dobytí [title.Custom('CZ_LandedNameNoTooltip_G')]"
 legend_chronicle_war_won_chronicle_desc: "[winner.GetTitledFirstName|U] po právu [Select_CString(winner.IsFemale,'dobyla','dobyl')|l] [title.Custom('CZ_LandedName_A')], dříve v rukou [Select_CString(loser.IsFemale,'nehodné protivnice','nehodného protivníka')|l] [loser.Custom('CZ_FirstName_G')]."
 legend_chronicle_new_title: "Založení titulu [title.GetNameTooltip]"
 legend_chronicle_new_title_desc: "Z vůle, síly a důmyslu [founder.Custom('CZ_Name_G')] vzniklo panství [title.GetName]. Nikdy nezakolísá!"
 legend_chronicle_great_deed_faith: "Duchovní triumf víry [new_faith.GetNameNoTooltip]"
 legend_chronicle_great_deed_faith_desc: "[founder.GetName|U] [Select_CString(founder.IsFemale,'vedena','veden')|l] vírou, že [new_faith.HighGodName] [Select_CString(Or(EqualTo_string(new_faith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(new_faith.HighGodName,Localize('confucianism_high_god_name'))),'ukazují','ukazuje')|l] cestu, [Select_CString(founder.IsFemale,'dovedla','dovedl')|l] věrné [CZFaithAdjDecline(new_faith,'é')|l] věřící k vítězství nad [CZFaithAdjDecline(old_faith,'ými')|l] protivníky, které [Select_CString(antagonist.IsFemale,'vedla','vedl')|l] [Select_CString(antagonist.IsFemale,'ničemná','ničemný')|l] [antagonist.GetName]."
 legend_chronicle_great_deed_title: "Velký čin pro [title.Custom('CZ_LandedNameNoTooltip_A')]"
 legend_chronicle_great_deed_title_desc: "Za celé dějiny vládců [title.Custom('CZ_LandedName_G')] nikdo nedosáhl tak mnoho. Nikdo nebude opěvován více než [founder.GetName]."
 legend_chronicle_great_deed_region: "[Select_CString(founder.IsFemale,'Pravá hrdinka','Pravý hrdina')|U] kraje [legend_region.GetNameNoTooltip]"
 legend_chronicle_great_deed_region_desc: "V kraji [legend_region.GetName] není duše, která by neznala jméno [founder.Custom('CZ_Name_G')] a velikost [Select_CString(founder.IsFemale,'jejích','jeho')|l] činů."
 legend_chronicle_great_deed_dynasty: "Mocný počin pro rod [dynasty.GetNameNoTooltip]"
 legend_chronicle_great_deed_dynasty_desc: "Málokdo z těch, kdo nesou jméno rodu [dynasty.GetName], vykonal pro svou dynastii tolik jako [founder.GetName]."
 legend_chronicle_valiant_defense: "Statečná obrana"
 legend_chronicle_valiant_defense_desc: "Navzdory všem vyhlídkám [defender.GetName] [Select_CString(defender.IsFemale,'odrazila','odrazil')|l] hordy [attacker.Custom('CZ_Name_G')]."
 legend_chronicle_tournament_won: "Tři vítězství [winner.Custom('CZ_FirstNameNoTooltip_G')]"
 legend_chronicle_tournament_won_desc: "Na kolbišti u [CZProvName(location,'G')] [winner.GetName] [Select_CString(winner.IsFemale,'zvítězila','zvítězil')|l] v turnaji potřetí. Žádná živá duše na světě se nemohla [winner.Custom('CZ_Name_D')] rovnat."
 legend_chronicle_accolade_chronicle: "Nejstatečnější [founder.Custom( 'KnightCulturePluralNoTooltip' )|l]"
 legend_chronicle_accolade_chronicle_desc: "[founder.GetName|U] [Select_CString(founder.IsFemale,'měla','měl')|l] mnoho skvělých bojovníků – [founder.Custom( 'KnightCulturePluralNoTooltipLowercase' )|l] – ale žádný se nevyrovnal [first_accolade_knight.Custom('CZ_Name_D')], [Select_CString(first_accolade_knight.IsFemale,'nositelce','nositeli')|l] vyznamenání [first_accolade.GetName]."
 legend_conqueror_chronicle: "$legend_chronicle_conqueror_chronicle$"
 legend_conqueror_chronicle_desc: "$legend_chronicle_conqueror_chronicle_desc$"
 legend_chronicle_conqueror_chronicle: "Největší dobyvatel"
 legend_chronicle_conqueror_chronicle_desc: "Putování skončilo. Z nezkrotné duše se zrodil dobyvatel."
 legend_chapter_opening_conqueror: "Z popela už nic nepovstane. [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'přísahala','přísahal')|l], že se stane metlou, kterou [ROOT.Legend.GetProtagonist.GetFaith.HighGodName] [Select_CString(Or(EqualTo_string(ROOT.Legend.GetProtagonist.GetFaith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(ROOT.Legend.GetProtagonist.GetFaith.HighGodName,Localize('confucianism_high_god_name'))),'pozvedají','pozvedá')|l] nad rudou zemí. A od nynějška bude země už jen rudá."
 legend_chapter_famous_deed_conqueror: "Bitva za bitvou a zpěv sílil. Bitva za bitvou a kořist rostla. Bitva za bitvou a [ROOT.Legend.GetProtagonist.Custom('CZ_FirstNamePossessiveNoTooltip_F')] legenda zářila jasněji."
