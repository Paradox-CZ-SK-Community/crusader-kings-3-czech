 no_pagans_in_britannia_tt: "V oblasti [GetGeographicalRegion('world_europe_west_britannia').GetName] nesmí být žádní [Concept('independent','nezávislí')|E] [Concept('rulers','vládci')|E] náboženské rodiny [GetReligionFamily('rf_pagan').GetName]."
 must_own_france_or_hre_tt: "Musíš osobně držet [GetTitleByKey('k_france').Custom('CZ_LandedNameNoTier_A')], [GetTitleByKey('e_france').Custom('CZ_LandedNameNoTier_A')] nebo [GetTitleByKey('e_hre').Custom('CZ_LandedNameNoTier_A')]."
 must_own_georgia_or_be_georgian_tt: "Musíš držet [GetTitleByKey('k_georgia').Custom('CZ_LandedNameNoTier_A')], mít hlavní město v [GetTitleByKey('k_georgia').Custom('CZ_LandedNameNoTier_L')] nebo patřit ke gruzínské kultuře."
 persian_or_zoroastrian_tt: "Buď máš hlavní město v oblasti [GetGeographicalRegion('world_middle_east_persia').GetName], tvá [Concept('culture','kultura')|E] má dědictví $heritage_iranian_name$, nebo vyznáváš [CZReligionAdjDecline(GetReligionByKey('zoroastrianism_religion'),'ou')|l] víru."
 theologian_or_high_piety_tt: "Musíš mít [Concept('trait','rys')|E] [GetTrait('theologian').GetName( GetNullCharacter )] nebo alespoň [Concept('piety_level','úroveň oddanosti')|E] $piety_level_3$."
