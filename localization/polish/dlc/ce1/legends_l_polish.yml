 legend_events.0001.t: "Kronikář: Nalezena legenda"
 legend_events.0001.desc.intro: "[chronicler.Custom2('MyCharacterIntroduction',ROOT.Char)|U] mi vzrušeně spěchá naproti, sotva vstoupím ke dvoru.\n\n"
 legend_events.0001.desc.mid.slew_dragon: "„Přináším skvělé zprávy, [ROOT.Char.GetTitleAsNameNoTooltip|U]! Pátrám v knihách a legendách o [legend_character.GetName] a mám důvod věřit, že [legend_character.GetFirstNameNoTooltip] [Select_CString(legend_character.IsFemale,'bojovala s drakem a zabila ho','bojoval s drakem a zabil ho')]!"
 legend_events.0001.desc.mid.ancestral_saint: "„[ROOT.Char.GetFaith.HighGodName|U] dnes hledí na váš rod s přízní, [ROOT.Char.GetTitleAsNameNoTooltip|U]. Pátrám po zprávách o [Select_CString(legend_character.IsFemale,'vaší slavné předkyni','vašem slavném předkovi')] [legend_character.GetName] a [Select_CString(chronicler.IsFemale,'nalezla','nalezl')] jsem zmínky, podle nichž by [legend_character.GetFirstNameNoTooltip] [Select_CString(legend_character.IsFemale,'mohla být považována','mohl být považován')] za [GetTrait('saint').GetNameNoTooltip(ROOT.Char)]!"
 legend_events.0001.desc.mid.godly_descent: "[chronicler.GetFirstNameNoTooltip|U] klesá na kolena a líbá mi nohy. „Ó, nejsvětější [ROOT.Char.GetTitleAsNameNoTooltip|U]. Mám pádný důvod věřit, že krev ve vašich žilách je [ROOT.Char.GetFaith.HighGodNamePossessive] dar!“"
 legend_events.0001.desc.mid.old_godly_descent: "„Dobrý den, [ROOT.Char.GetTitleAsNameNoTooltip|U] — nebo vám snad mám říkat [Select_CString(ROOT.Char.IsFemale,'božská dcero','božský synu')], protože [legend_character.GetFaith.HighGodName] stojí na počátku vašeho rodu? [Select_CString(chronicler.IsFemale,'Prohledala','Prohledal')] jsem záznamy a věřím, že ‚bůh‘ vašich předků byl ve skutečnosti [Select_CString(legend_character.IsFemale,'hrdinská smrtelnice, která vykonala','hrdinský smrtelník, který vykonal')] bezpočet velkých činů.“"
 legend_events.0001.desc.mid.raised_by_animals: "„Dobrý den, [ROOT.Char.GetTitleAsNameNoTooltip|U]. Kolik si pamatujete ze svého nejranějšího dětství? Některé svazky v archivu naznačují, že vás ve skutečnosti v divočině vychovali [ROOT.Char.Custom('GetAnimalPlural')].“"
 legend_events.0001.desc.mid.auspicious_stars: "„[ROOT.Char.GetFaith.HighGodName|U] se na nás dnes usmívá, [ROOT.Char.GetTitleAsNameNoTooltip], stejně jako v den vašeho narození. Vždyť jste [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')] na svět pod příznivými hvězdami — znamením velikých činů, které jste [Select_CString(ROOT.Char.IsFemale,'měla','měl')] v životě vykonat.“"
 legend_events.0001.desc.mid.virgin_birth: "„[ROOT.Char.GetFaith.HighGodName|U] se na nás dnes usmívá, [ROOT.Char.GetTitleAsNameNoTooltip], stejně jako na vaši matku v době vašeho početí. [Select_CString(ROOT.Char.IsFemale,'Nebyla jste žádná bastardka','Nebyl jste žádný bastard')] — vaší matce se dostalo požehnání neposkvrněného početí!“"
 legend_events.0001.desc.mid.spoke_to_angels: "„Pamatuji si, jak jste mi před mnoha nocemi [Select_CString(ROOT.Char.IsFemale,'vyprávěla','vyprávěl')] o návštěvě andělů. [ROOT.Char.GetTitleAsNameNoTooltip|U], mám důvod věřit, že to nebyl pouhý sen, nýbrž vidění pocházející z místa zvaného [ROOT.Char.GetFaith.PositiveAfterLife].“"
 legend_events.0001.desc.mid.fought_the_devil: "„Vím, že vás v poslední době sužují noční můry. Mám důvod věřit, že tato vidění nejsou pouhé sny. Proti vám v nich stojí [ROOT.Char.GetFaith.DevilName] a všude kolem se rozprostírá [ROOT.Char.GetFaith.NegativeAfterLife].“"
 legend_events.0001.desc.mid.exotic_backstory: "„[ROOT.Char.GetTitleAsNameNoTooltip|U], nikdy vám [ROOT.Char.GetCulture.GetName] kultura nebyla tak docela vlastní, že? Věřím, že jste před mnoha lety [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')] z tajemné země daleko odsud.“"
 legend_events.0001.desc.mid.ancient_people: "„[ROOT.Char.GetTitleAsNameNoTooltip|U], [Select_CString(chronicler.IsFemale,'prohledala','prohledal')] jsem záznamy a [Select_CString(chronicler.IsFemale,'nalezla','nalezl')] zmínky naznačující, že váš rod sahá až k velkým dynastiím [ancient_culture.GetName] kultury!“"
 legend_events.0001.desc.outro: "Někomu se to možná bude zdát trochu přitažené za vlasy a dokázat pravdivost celého příběhu nebude snadné, ale základy jsou pevné. Můžeme z vás učinit živoucí legendu!“"
 legend_events.0001.a: "Výborná práce!"
 legend_events.0001.b: "Tomu mám problém uvěřit i já."
 legend_events.0010.t: "$chronicler_court_position$: Legenda se šíří"
 legend_events.0010.desc: "[chronicler.Custom2('MyCharacterIntroduction',ROOT.Char)|U] mě dnes ráno vítá u dvora a jen hoří nedočkavostí podělit se o novinky.\n\n„[ROOT.Char.GetTitleAsNameNoTooltip|U], myslím, že [potential_promoter.Custom2('YourCharacterIntroduction',ROOT.Char)] už téměř [Select_CString(potential_promoter.IsFemale,'uvěřila','uvěřil')] pravdivosti legendy [ROOT.Char.GetPromotedLegend.GetName]! [potential_promoter.GetFirstNameNoTooltip|U] ten příběh zná a očividně [Select_CString(potential_promoter.IsFemale,'je jím zcela okouzlena','je jím zcela okouzlen')], stále však pochybuje, zda je skutečně pravdivý.“"
 legend_events.0010.a: "Možná by se [potential_promoter.GetFirstNameNoTooltip] [Select_CString(potential_promoter.IsFemale,'dala přesvědčit','dal přesvědčit')]."
 legend_events.0010.a.success: "[potential_promoter.GetName] [Select_CString(potential_promoter.IsFemale,'je přesvědčena','je přesvědčen')]"
 legend_events.0010.a.failure: "[potential_promoter.GetName] [Select_CString(potential_promoter.IsFemale,'zůstává nepřesvědčena','zůstává nepřesvědčen')]"
 legend_events.0010.b: "Trochu přikrášlit pravdu a [potential_promoter.GetFirstNameNoTooltip] možná uvěří."
 legend_events.0010.c: "Ať si [potential_promoter.GetFirstNameNoTooltip|U] myslí, co chce."
 legend_events.0020.t: "Přivlastnění legendy"
 legend_events.0020.desc: "K mému trůnu přistoupí cizí host a hlasitě prohlásí:\n\n„Už je tomu nějaký čas, co jsem [Select_CString(seed_presenter.IsFemale,'dorazila','dorazil')] k vašemu dvoru. Pozorně jsem [Select_CString(seed_presenter.IsFemale,'sledovala','sledoval')], jak vládnete a jak řešíte záležitosti panství, od těch nejmenších až po ty největší. A musím říci, že jsem hluboce [Select_CString(seed_presenter.IsFemale,'ohromena','ohromen')].\n\nMezi lidem [seed_presenter.GetCulture.GetCollectiveNoun] se odedávna vypráví příběh o legendárním vládci ze vznešené dynastie. Vyprávěla mi jej má matka, když jsem [Select_CString(seed_presenter.IsFemale,'byla ještě malá','byl ještě malý')]. A ona jej před mnoha a mnoha lety slyšela od své matky.\n\nA nyní vám s velikou radostí mohu říci, že podle mě se pověsti [seed_presenter.GetCulture.GetPrefix] vztahují právě k vám, [ROOT.Char.GetTitleAsNameNoTooltip|U]. A věřím, že všichni z [seed_presenter.GetCulture.GetName] kultury by se mnou souhlasili!“"
 legend_events.0020.a: "Ano! Vaši předkové mluvili o dynastii [ROOT.Char.GetDynasty.GetNameNoTooltip]!"
 legend_events.0020.b: "O [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] vyprávějí příběhy [seed_presenter.GetCulture.GetPrefixNoTooltip] lidu."
 legend_events.0020.c: "Jako panovnická osoba nesoucí označení „[ROOT.Char.GetCulture.GetPrefixNoTooltip]“ se nemusím starat o žvásty [seed_presenter.GetCulture.GetCollectiveNounNoTooltip] sedláků."
 legend_seed_ghw.tt: "Získáš $trait_crusader_king$ [Concept('legend_seed','zárodek legendy')|E]"
 gain_heroic_legend_seed.tt: "Získáš hrdinský [Concept('legend_seed','zárodek legendy')|E]"
 gain_holy_legend_seed.tt: "Získáš svatý [Concept('legend_seed','zárodek legendy')|E]"
