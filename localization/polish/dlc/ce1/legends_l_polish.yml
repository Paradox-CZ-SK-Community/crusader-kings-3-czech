 legend_chronicle_war_won_chronicle_desc: "[winner.GetTitledFirstName] po právu [Select_CString(winner.IsFemale,'vyrvala','vyrval')] [title.GetName] z rukou nehodného [loser.GetFirstName]."
 legend_chronicle_new_title: "Založení země [title.GetNameTooltip]"
 legend_chronicle_new_title_desc: "Vůlí, silou a důvtipem [founder.GetName] vznikla [title.GetName] — a nikdy nepadne!"
 legend_chronicle_great_deed_faith: "Duchovní triumf pro [new_faith.GetNameNoTooltip]"
 legend_chronicle_great_deed_faith_desc: "[Select_CString(founder.IsFemale,'Vedena','Veden')] vírou, v jejímž středu stojí [new_faith.HighGodName], [founder.GetName] [Select_CString(founder.IsFemale,'dovedla','dovedl')] věřící [new_faith.GetAdherentNamePlural] k vítězství nad [old_faith.GetAdherentName], které vedl podlý [antagonist.GetName]."
 legend_chronicle_great_deed_title: "Velký čin pro [title.GetNameNoTooltip]"
 legend_chronicle_great_deed_title_desc: "Za celé dějiny se mezi všemi vládci země [title.GetName] nenašel nikdo, kdo by dokázal tolik. O nikom se nebude vyprávět dříve než o [Select_CString(founder.IsFemale,'veliké','velikém')] [founder.GetName]."
 legend_chronicle_great_deed_region: "Pravý hrdina země [legend_region.GetNameNoTooltip]"
 legend_chronicle_great_deed_region_desc: "V zemi [legend_region.GetName] není jediné duše, která by neznala jméno [founder.GetName] a [Select_CString(founder.IsFemale,'její','jeho')] činy."
 legend_chronicle_great_deed_dynasty: "Velký čin pro dynastii [dynasty.GetNameNoTooltip]"
 legend_chronicle_great_deed_dynasty_desc: "Jen málokdo nesoucí jméno [dynasty.GetName] vykonal pro svou dynastii tolik jako [founder.GetName]."
 legend_chronicle_valiant_defense: "Hrdinná obrana"
 legend_chronicle_valiant_defense_desc: "Navzdory veškeré přesile [defender.GetName] [Select_CString(defender.IsFemale,'odrazila','odrazil')] hordy [attacker.GetName]."
 legend_chronicle_tournament_won: "Tři vítězství [winner.GetFirstNameNoTooltip]"
 legend_chronicle_tournament_won_desc: "Na kolbišti v [location.GetName] [Select_CString(winner.IsFemale,'zvítězila nepřekonatelná','zvítězil nepřekonatelný')] [winner.GetName] v turnaji již potřetí. Na celém světě nežije nikdo, kdo by se [Select_CString(winner.IsFemale,'jí','mu')] mohl rovnat."
 legend_chronicle_accolade_chronicle: "Nejudatnější z [founder.Custom('KnightCulturePluralNoTooltip')]"
 legend_chronicle_accolade_chronicle_desc: "[founder.GetName|U] [Select_CString(founder.IsFemale,'měla','měl')] ve svých službách mnoho znamenitých [founder.Custom('KnightCulturePluralNoTooltipLowercase')], žádný však nepředčil [first_accolade_knight.GetName] z [first_accolade.GetName]."
 legend_conqueror_chronicle: "$legend_chronicle_conqueror_chronicle$"
 legend_conqueror_chronicle_desc: "$legend_chronicle_conqueror_chronicle_desc$"
 legend_chronicle_conqueror_chronicle: "Největší dobyvatel"
 legend_chronicle_conqueror_chronicle_desc: "Tuláctví skončilo. Z nezlomné duše se zrodil Dobyvatel."
 legend_chapter_opening_conqueror: "Z popela už nic nepovstane. [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'přísahala','přísahal')], že se stane metlou světa, a [ROOT.Legend.GetProtagonist.GetFaith.HighGodName] tomu bude svědkem. [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'Stála','Stál')] na půdě rudé krví — a od této chvíle už jinou barvu mít nebude."
 legend_chapter_famous_deed_conqueror: "Bitvu za bitvou zněl válečný pokřik hlasitěji. Bitvu za bitvou rostla kořist. Bitvu za bitvou zářila legenda o [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] stále jasněji."
