 LEGEND_OWNER_DESCRIPTION: "Vlastník: [Legend.GetOwner.GetShortUIName]"
 LEGEND_PROMOTING_LEGEND: "Věnuješ se [Concept('promoting_legend','podporování')|E] této [Concept('legend','legendy')|E]"
 LEGEND_OWNING_LEGEND: "Vlastníš tuto [Concept('legend','legendu')|E]"
 LEGEND_UNOWNED_GRACE_PERIOD: "Tuto [Concept('legend','legendu')|E] můžeš převzít až $DATE$"
 game_concept_legend: "Legenda"
 game_concept_legend_i: "@legend_icon!"
 game_concept_legend_desc: "$game_concept_legend$ vypráví o významných činech, které postava vykonala za svého života, a vzniká ze [Concept('legend_seeds','zárodků legend')|E].\n\nLegendy jsou účinným prostředkem k získání [Concept('legitimacy','legitimity')|E] i dalších odměn, například zvýšení [Concept('skill','dovednosti')|E], bonusů k [Concept('opinion','mínění')|E], [Concept('dynasty_prestige','věhlasu')|E], [Concept('prestige','prestiže')|E] či [Concept('piety','zbožnosti')|E]. [Concept('baronies','Baronství')|EU], do nichž se $game_concept_legend$ rozšířila, mohou získat další účinky, pokud je drží její vlastník, kterému tato $game_concept_legend$ patří, nebo [Concept('legend_promoter','podporovatel legendy')|E].\n\n$game_concept_legends$ mají [Concept('legend_type','typ legendy')|E], který určuje jejich odměny: mohou být legitimizující, svaté nebo hrdinské. Každá $game_concept_legend$ má také určitou úroveň [Concept('legend_quality','kvality legendy')|E], která ovlivňuje sílu odměn i její šíření."
 game_concept_owned_legend: "Vlastněná legenda"
 game_concept_owning_legend: "Vlastnění legendy"
 game_concept_owned_legend_desc: "$game_concept_owned_legend$ je [Concept('legend','legenda')|E] patřící [Concept('ruler','vládci')|E], který získává hlavní výhody z jejích účinků.\n\n$game_concept_legend$ může mít svého vlastníka také jako [Concept('legend_protagonist','protagonistu legendy')|E], ale není to nutné.\n\n$game_concept_legend$ může být podporována také [Concept('legend_promoters','podporovateli legendy')|E], kteří platí měsíční příspěvek, aby získali část jejích bonusů."
 game_concept_owning_legend_desc: "$game_concept_owned_legend_desc$"
 game_concept_promoted_legend: "Podporovaná legenda"
 game_concept_promoted_legend_desc: "$game_concept_promoted_legend$ je [Concept('legend','legenda')|E] jiného [Concept('ruler','vládce')|E], kterou podporují [Concept('legend_promoters','podporovatelé legendy')|E]. Za měsíční příspěvek získávají část jejích bonusů."
 game_concept_promoting_legend: "Podporování"
 game_concept_promoting_legend_desc: "$game_concept_promoting_legend$"
 game_concept_legend_promoter: "Podporovatel legendy"
 game_concept_legend_promoter_desc: "$game_concept_legend_promoter$ je [Concept('ruler','vládce')|E], který podporuje [Concept('legend','legendu')|E] jiného vládce.\n\nZa měsíční příspěvek ve [Concept('gold','zlatě')|E] získává $game_concept_legend_promoter$ další bonusy; $game_concept_legend$ určuje jejich podobu svým [Concept('legend_type','typem legendy')|E] a [Concept('legend_quality','kvalitou legendy')|E]."
 game_concept_legend_promoters: "Podporovatelé legendy"
 game_concept_legend_promoters_desc: "$game_concept_legend_promoter_desc$"
 game_concept_legends: "Legendy"
 game_concept_legends_desc: "$game_concept_legend_desc$"
 game_concept_legend_seed: "Zárodek legendy"
 game_concept_legend_seed_desc: "Dosud nezapočatá [Concept('legend','legenda')|E]. $game_concept_legend_seeds$ představují základ pro vyprávění, kterým je $game_concept_legend$; založí-li je [Concept('ruler','vládce')|E], může být $game_concept_legend$ zahájena.\n\n$game_concept_legend_seeds$ lze získat splněním určitých podmínek, například jako dědic Karla Velikého nebo vykonáním legendárního činu: významného [Concept('decisions','rozhodnutí')|E], vítězství ve [Concept('great_holy_war','velké svaté válce')|E], získání titulu [Concept('king','krále')|E] či [Concept('emperor','císaře')|E], uspořádání velkolepé [Concept('activity','aktivity')|E], ulovení legendárního zvířete a podobně.\n\nNeaktivní $game_concept_legend_seeds$ nic nestojí, ale neposkytují žádné účinky. Je-li $game_concept_legend_seed$ založen poprvé, vyžaduje [Concept('gold','zlato')|E]."
 game_concept_legend_seeds: "Zárodky legend"
 game_concept_legend_seeds_desc: "$game_concept_legend_seed_desc$"
 game_concept_legend_quality: "Kvalita legendy"
 game_concept_legend_quality_desc: "Kvalita [Concept('legend','legendy')|E] určuje sílu jejích účinků, dosah jejího šíření i konečné odměny. $game_concept_legends$ mohou být proslulé, věhlasné nebo mýtické – obyčejná $game_concept_legend$ totiž neexistuje.\n\nKvalitu lze zvýšit rozšířením legendy do dalších [Concept('baronies','baronství')|E] a zaplacením nákladů na vylepšení.\n\nKdyž $game_concept_legend$ smrtí přijde o svého vlastníka, může v ní pokračovat jeho rodina, aniž by její kvalita utrpěla."
 game_concept_legend_famed: "Proslulá"
 game_concept_legend_famed_desc: "$game_concept_legend_quality_desc$"
 game_concept_legend_illustrious: "Věhlasná"
 game_concept_legend_illustrious_desc: "$game_concept_legend_quality_desc$"
 game_concept_legend_mythical: "Mýtická"
 game_concept_legend_mythical_desc: "$game_concept_legend_quality_desc$"
 game_concept_legend_protagonist: "Protagonista legendy"
 game_concept_legend_protagonist_desc: "$game_concept_legend_protagonist$ je hlavní postavou [Concept('legend','legendy')|E], jejíž činy vyprávění popisuje. $game_concept_legend$ může mít jako hlavní postavu ($game_concept_legend_protagonist$) svého vlastníka nebo kteréhokoli člena jeho rodiny – živého či mrtvého, pokud dosáhl věku 16 let.\n\n$game_concept_legend_protagonists$ sami nezískávají žádné přímé bonusy navíc, ale $game_concept_legend$ se soustředí na ně. Vlastníkovi legendy však poskytují #color_white dodatečnou#! [Concept('legitimacy','legitimitu')|E] podle počtu svých [Concept('virtuous','ctnostných')|E] [Concept('traits','rysů')|E].\n\n$game_concept_legend_protagonist$ musí být dospělý; tvrzení, že nemluvně zabilo draka, by mohlo vzbudit pochybnosti."
 game_concept_legend_protagonists: "Protagonisté legendy"
 game_concept_legend_protagonists_desc: "$game_concept_legend_protagonist_desc$"
 game_concept_legend_type: "Typ legendy"
 game_concept_legend_types: "Typy legend"
 game_concept_legend_types_desc: "$game_concept_legend_type_desc$"
 game_concept_legend_type_desc: "[Concept('legend','Legenda')|EU] má typ, který ovlivňuje druh poskytovaných účinků i téma jejího vyprávění.\n\n$game_concept_legend_types$ jsou legitimizující, hrdinské a svaté; poskytují postupně [Concept('legitimacy','legitimitu')|E], [Concept('prestige','prestiž')|E] a [Concept('piety','zbožnost')|E]."
 game_concept_legend_heroic: "Hrdinská legenda"
 game_concept_legend_heroic_desc: "$game_concept_legend_type_desc$"
 game_concept_legend_holy: "Svatá legenda"
 game_concept_legend_holy_desc: "$game_concept_legend_type_desc$"
 game_concept_legend_legitimizing: "Legitimizující legenda"
 game_concept_legend_legitimizing_desc: "$game_concept_legend_type_desc$"
 game_concept_legend_library: "Knihovna legend"
 game_concept_legend_library_i: "@legend_icon!"
 game_concept_legend_library_desc: "[Concept('legend_library','Knihovna legend')|EU] uchovává dokončené [Concept('legends','legendy')|E], které se rozšířily do tvé [Concept('domain','domény')|E], které [Select_CString(GetPlayer.IsFemale,'jsi vytvořila nebo aktivně podporovala','jsi vytvořil nebo aktivně podporoval')|l].\nDokončené [Concept('legends','legendy')|E] do ní můžeš přidat také při cestování oblastí jejich rozšíření.\n\n[Concept('legends','Legendy')|EU] můžeš z knihovny libovolně odstraňovat."
 game_concept_ancestral_claim: "Nárok předků"
 game_concept_ancestral_claim_desc: "Nárok předků je [Concept('casus_belli','casus belli')|E], které ti umožňuje připojit všechna území v rámci titulu, na nějž máš nárok získaný prostřednictvím legitimizující [Concept('legend','legendy')|E]."
 legend_heroic: "Hrdinská legenda"
 legend_heroic_name: "Legenda o [ROOT.Legend.GetOwner.Custom('CZ_NameNoTooltip_L')]"
 legend_heroic_desc: "[ROOT.Legend.GetOwner.GetTitledFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetOwner.IsFemale,'proslula','proslul')|l] svými hrdinskými činy."
 legend_legitimizing: "Legitimizující legenda"
 legend_legitimizing_name: "Rodokmen [ROOT.Legend.GetOwner.Custom('CZ_NameNoTooltip_G')]"
 legend_legitimizing_desc: "Rod [ROOT.Legend.GetOwner.GetDynasty.GetBaseNameNoTooltip] vládne těmto zemím již po staletí."
 legend_holy: "Svatá legenda"
 legend_holy_name: "Zázraky [ROOT.Legend.GetOwner.Custom('CZ_NameNoTooltip_G')]"
 legend_holy_desc: "Svatost, kterou [ROOT.Legend.GetOwner.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetOwner.IsFemale,'projevila','projevil')|l], obdivuje každý, jehož víru [Select_CString(Or(EqualTo_string(ROOT.Char.GetFaith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(ROOT.Char.GetFaith.HighGodName,Localize('confucianism_high_god_name'))),'zosobňují','zosobňuje')|l] [ROOT.Char.GetFaith.HighGodName]."
 legend_king_arthur: "Odkaz Artuše Pendragona"
 legend_king_arthur_desc: "Král minulý i budoucí žije dál v krvi tohoto rodu."
 legend_carolingian: "Dědicové Karla Velikého"
 legend_carolingian_desc: "Před tímto rodem vládl zdejší zemi velký král Karel Veliký. Rod tvrdí, že pochází přímo z jeho císařské krve."
 legend_holy_warrior: "Svatá pěst"
 legend_holy_warrior_desc: "Veliký svatý bojovník; tento hrdina statečně bojoval za svou víru."
 legend_chapter_opening_holy_warrior: "Legenda o [ROOT.Legend.GetProtagonist.Custom('CZ_TitledFirstNameNoTooltip_L')], [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'velké bojovnici','velkém bojovníkovi')|l] víry [religion.GetNameNoTooltip], začíná příznivým zrozením. Již od útlého věku [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'cítila','cítil')|l], že [ROOT.Legend.GetProtagonist.GetFaith.HighGodName] [Select_CString(Or(EqualTo_string(ROOT.Legend.GetProtagonist.GetFaith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(ROOT.Legend.GetProtagonist.GetFaith.HighGodName,Localize('confucianism_high_god_name'))),'volají','volá')|l]."
 legend_el_cid: "Píseň o Cidovi"
 legend_el_cid_desc: "Rodrigo Díaz de Vivar býval zneuctěným drobným šlechticem. Nyní se stal králem z vlastní vůle."
 legend_alfred_of_wessex: "Svatý král"
 legend_alfred_of_wessex_desc: "[ancestor.GetNameNoTooltip|U] [Select_CString(ancestor.IsFemale,'odolala','odolal')|l] nájezdům Seveřanů v Anglii a [Select_CString(ancestor.IsFemale,'stala se','stal se')|l] oporou i [Select_CString(ancestor.IsFemale,'šiřitelkou','šiřitelem')|l] křesťanství."
 legend_sons_of_david: "Dědicové Davidovi"
 legend_sons_of_david_desc: "Davida, krále Izraele, pomazal Bůh. Jeho krev proudí v žilách každého příslušníka rodu [GetDynastyHouseByID('house_bagrationi').GetNameNoTooltip]."
 legend_peasant_emperor: "Z rolníka basileem"
 legend_peasant_emperor_desc: "Basileios se narodil rolníkům a vstoupil do císařových služeb. Poté se oženil s jeho dcerou a sám se stal basileem."
 legend_the_wheelwright: "Sklep hojnosti"
 legend_the_wheelwright_desc: "Na sedmé narozeniny jeho syna navštívili Piasta Koloděje dva cizinci. Za jeho pohostinnost se mu odvděčili kouzlem, díky němuž zůstával Piastův sklep navždy plný."
 legend_vercingetorix: "Dědicové Vercingetorigovi"
 legend_vercingetorix_desc: "Vercingetorix sjednotil galské kmeny v povstání proti římským nájezdníkům. Přestože padl Caesarovou rukou, jeho keltský duch žije dál v naší krvi."
 legend_saman_khudah: "Potomek Bahráma Čóbína"
 legend_saman_khudah_desc: "Vojevůdce, dobyvatel a uzurpátor Bahrám Čóbín se zmocnil sásánovského trůnu. Jeho hrdinská krev proudí našimi žilami."
 legend_bahram_gur: "Gúrův rod"
 legend_bahram_gur_desc: "Bahrám Gúr byl velký král a bojovník, který vzdoroval nesčetným nájezdníkům. Jeho krev proudí našimi žilami a činí z nás perské hrdiny."
 bahram_gur: "Bahrám Gúr"
 legend_cadell: "Cadellova krev"
 legend_cadell_desc: "Cadell začal svůj život jako otrok. S požehnáním světce vyrval Powyské království z Vortigernových rukou."
 legend_descendants_of_brahman: "Brahmanova krev"
 legend_descendants_of_brahman_desc: "Jsme synové a dcery bohů. Brahman, Višnu – náš původ sahá až k samotnému počátku věků."
 legend_gothic_kings: "Gótští králové"
 legend_gothic_kings_desc: "Gótové způsobili zkázu Říma a založili naše království. Jsme jejich dědici, králové a královny Gótů."
 legend_sons_of_rurik: "Synové Rurikovi"
 legend_sons_of_rurik_desc: "Varjažský kníže Rurik vedl svou dobrodružnou hordu na východ a založil velké Novgorodské království. Jeho legendární krev proudí našimi žilami."
 legend_william_gellones: "Dobytí Orange"
 legend_william_gellones_desc: "Vilém z Gellone porazil islámská vojska u Orange, bojoval za křesťanstvo a založil opatství v Gellone. Později se vzdal vlády a uchýlil se tam jako mnich."
 legend_edward_the_martyr: "Eduard Mučedník"
 legend_edward_the_martyr_desc: "Tělo zavražděného a bez poct pohřbeného Eduarda Mučedníka bylo po roce nalezeno neporušené. Říká se, že přijal vlastní smrt z hluboké lásky ke Kristu."
 legend_yazdagird_iii: "Krev [ancestor.Custom('CZ_FirstNameNoTooltip_G')] III."
 legend_yazdagird_iii_desc: "V našich žilách proudí krev posledního sásánovského šáha. Přestože [Select_CString(ancestor.IsFemale,'byla obklíčena','byl obklíčen')|l] ze všech stran Turky, Chazary a arabskými nájezdníky, [Select_CString(ancestor.IsFemale,'zůstala Persii věrná','zůstal Persii věrný')|l] až do posledního dechu."
 legend_afrasiyab: "Král Túránu: Afrásijáb"
 legend_afrasiyab_desc: "Velkolepý král Túránu a hrdina Turků Afrásijáb byl úhlavním nepřítelem Perské říše a největším ze všech túránských králů. Jeho kouzelná krev proudí našimi žilami a dává nám božské právo znovu vládnout Túránu."
 legend_sceafa: "Sceafa, vnuk Noemův"
 legend_sceafa_desc: "Prastarý langobardský král Sceafa se jako dítě vyplazil z moře a později vládl Anglii. Víme, že byl Noemovým vnukem; právě od něj pochází naše božská krev."
 legend_new_troy_london: "Nová Trója"
 legend_new_troy_london_desc: "Bruta, vyhnaného z Tróje, vedla Diana do Albionu. Porazil veliké obry, kteří zemi obývali, a založil Troia Nova, město dnes známé jako Londýn."
 legend_corineus: "Balada o Corineovi"
 legend_corineus_desc: "Corineus, dávný trójský bojovník, byl prvním zakladatelem Cornwallu. Přišel do Británie, zabil obry, kteří kraj obývali, a pojmenoval jej Cornwall podle sebe."
 legend_scota: "Synové Scoty"
 legend_scota_desc: "Po Scotě, dceři mocného egyptského faraona, nazýváme svou zemi „Skotsko“. Je matkou všech Skotů a v našich žilách proudí krev dávných faraonů."
 legend_pyusawhti: "Dědicové dračí bohyně"
 legend_pyusawhti_desc: "Zrozeni z lůna dračí bohyně a jako potomci Mahásammaty neseme v našem rodu tu nejsvětější a nejmocnější krev."
 legend_tosny: "Labutí rytíř"
 legend_tosny_desc: "Mocný Roger de Tosny pocházel z rodu Labutího rytíře. Na počest jeho legendy nosíme labutí znamení dodnes."
 legend_menelik_i: "Synové Davidovi"
 legend_menelik_i_desc: "Zakladatel naší dynastie Menelik I. vzešel z lásky izraelského Šalomouna a královny ze Sáby."
 legend_kings_of_semien: "Králové Semienu"
 legend_kings_of_semien_desc: "Beta Izrael je legendární židovské království, které stále horlivě vzdoruje christianizaci. Pocházíme z kmene Dan, který uprchl z Izraele za občanské války mezi vojsky Rechabeáma a Jarobeáma."
 legend_roman_heritage: "Římské dědictví"
 legend_roman_heritage_desc: "Náš rod nevládne pouze v dnešní Římské říši. Už od dob republiky jsme patřili mezi vlivné dvořany v Římě."
 legend_hunnic_heritage: "Hunské dědictví"
 legend_hunnic_heritage_desc: "Naše rodokmeny sahají k hunským rodům. Zakladatelem naší dynastie byl sám divoký Attila, který srazil Řím na kolena."
 legend_premysl: "Přemysl Oráč"
 legend_premysl_desc: "Náš předek začal svůj život jako prostý rolník ve Stadicích. Brzy však upoutal Libušinu pozornost, oženil se s ní a stal se českým knížetem."
 legend_borjigin: "Zářící návštěvník"
 legend_borjigin_desc: "Alan Gua, matku všech příslušníků dynastie [GetDynastyByID('11100').GetNameNoTooltip], navštěvovala dnem i nocí podivná zářící postava. Jako velký žlutý pes se do její jurty vkrádala v noci po měsíčních paprscích a ve dne po slunečních. Darovala jí tři syny. Svým božsky počatým synům přikázala, aby drželi při sobě jako svazek pěti šípů, jinak budou zlomeni jako pět osamělých šípů."
 legend_naga_descent: "Krev nágů"
 legend_naga_descent_desc: "Nágové jsou posvátné bytosti, napůl lidé a napůl hadi. Žijí v Pátále a někdy vstupují do našeho světa v lidské podobě. Náš rod pochází z nágy, který kdysi navštívil Kašmír a ulehl s člověkem."
 legend_hieros_gamos_skirnismal: "Hieros gamos"
 legend_hieros_gamos_skirnismal_desc: "Fjölnir, zakladatel dynastie Ynglingů, vzešel z lásky Gerðr a Freye. Kdo jiný než Fjölnirovi potomci by mohl nést božskou krev potřebnou k vládě nad Norskem?"
 legend_shibi_chakravarti: "Šibi Čakravartí"
 legend_shibi_chakravarti_desc: "Hrdinný král Šibi, vzor pokory a zbožnosti, měl ochránit mudrce Agniho proměněného v ptáka. Když luňák požadoval jeho vlastní maso výměnou za život holubice, Šibi ochotně nabídl celé své tělo. Byl však ušetřen a odměněn synem Kapotarómou. Krev tohoto nesobeckého krále proudí v žilách každého příslušníka dynastie [GetDynastyByID('1043008').GetNameNoTooltip]."
 legend_magi: "Synové mudrců"
 legend_magi_desc: "Po Ježíšově narození jej navštívili bibličtí mudrci s dary zlata, kadidla a myrhy. Matoušovo evangelium praví, že přišli z východu.\nPomýlený západní poutník by mohl pozorování betlémské hvězdy klást do perského města Sába.\nSlunce však vychází ještě dále na východě. Bohatství pochází z měst, ale neochvějná víra z drsné stepi.\nBible vypráví, že se Melichar, Kašpar a Baltazar po vzdání pocty novorozenému židovskému králi vrátili do svých zemí. Jejich potomci, nejzbožnější nestoriáni, dodnes uctívají jediného pravého Boha a jeho syna."
 legend_the_red_hand: "Rudá ruka Ulsteru"
 legend_the_red_hand_desc: "Vypráví se, že za dávných časů v Irsku připadl nárok na Ulster tomu, kdo na něj jako první položil ruku, a stal se velekrálem Irska. Náš předek byl natolik důvtipný, že si vlastní ruku usekl a hodil ji do Ulsteru. Jeho krev zbarvila smaragdovou trávu."
 legend_ragnarr: "Synové $nick_lodbrok$"
 legend_ragnarr_desc: "[Select_CString(ancestor.IsFemale,'Královna Dánů a přemožitelka mocného draka','Král Dánů a přemožitel mocného draka')|U] [ancestor.GetFirstNameNoTooltip] [Select_CString(ancestor.IsFemale,'byla','byl')|l] postrachem křesťanů a [Select_CString(ancestor.IsFemale,'legendární dobrodružkou','legendárním dobrodruhem')|l]. Velkých činů za [Select_CString(ancestor.IsFemale,'jejího','jeho')|l] života je příliš mnoho, než aby je bylo možné vyjmenovat. Když ve mně proudí [Select_CString(ancestor.IsFemale,'její','jeho')|l] krev, mám plné právo přihlásit se k tomuto odkazu a vytvořit vlastní legendární příběh!"
 legend_holy_site: "$legend_saintly_location_name$"
 legend_holy_site_desc: "$legend_saintly_location_desc$"
 legend_saintly_location_name: "[ROOT.Char.CustomFixedRandom('GetCustodianSynonym')|U] [protagonist.GetFaith.Custom('CZ_AdjectiveNoTooltip_eeho')|l] posvátného místa"
 legend_saintly_location_desc: "Držba posvátného místa víry [faith.GetNameNoTooltip] je sama o sobě známkou svatosti."
 legend_chapter_opening_saintly_location: "Země [CZProvNameNoTooltip(location,'G')] má nejvyšší duchovní hodnotu. Z její půdy prý vyvěrá zázračná voda, která dokáže vyléčit všechny neduhy."
 legend_chapter_motivation_religious: "Když se o tom [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'doslechla','doslechl')|l], srdce zaplavilo hluboké teplo. Tak veliká byla tato oddanost, že pouhá myšlenka na posvátné místo vyvolávala slzy."
 legend_saintly_life_name: "Nejvíce [ROOT.Char.CustomFixedRandom('GetPiousAdj')|l] život [protagonist.Custom('CZ_TitledFirstNameNoTooltip_G')]"
 legend_saintly_life_desc: "Oddaný život, který [protagonist.GetTitledFirstNameNoTooltip] [Select_CString(protagonist.IsFemale,'vedla','vedl')|l], přinesl téměř svatou pověst."
 legend_chapter_opening_saintly_life: "[ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip|U] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'přišla','přišel')|l] na svět s hlubokou láskou k božstvu jménem [ROOT.Legend.GetProtagonist.GetFaith.HighGodName] a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'zasvětila','zasvětil')|l] celý svůj život úctě ke své víře."
 holy_seed_toast: "Získán svatý [Concept('legend_seed','zárodek legendy')|E]"
 holy_seed_toast_traits: "Získáváš uznání díky svému rysu [ROOT.Char.CustomFixedRandom('GetSaintlyTrait')|l]"
 legend_saintly_building_name: "[ROOT.Char.CustomFixedRandom('GetPiousAdj')|U] budovatelský odkaz [CZProvNameNoTooltip(location,'G')]"
 legend_saintly_building_desc: "Stavět [ROOT.Char.GetFaith.HouseOfWorshipPlural|l] je nesobecký čin – velký důkaz zbožné duše."
 legend_ancient_people_name: "[ROOT.Char.CustomFixedRandom('GetDescendantSynonym')|U] [culture.Custom('CZ_AdjectiveNoTooltip_eeho')|l] rodu"
 legend_ancient_people_desc: "V krvi všech našich lidí proudí stejná krev jako v žilách [culture.Custom('CZ_Adjective_eeho')|l] národa."
 legend_saintly_deed_name: "[CZAdjectiveDecline(ROOT.Char.CustomFixedRandom('GetPiousAdj'),'é')|U] činy [ancestor.Custom('CZ_NameNoTooltip_G')]"
 legend_saintly_deed_desc: "Zbožné činy, které [ancestor.GetShortUIName] [Select_CString(ancestor.IsLocalPlayer,'konáš','koná')|l] ve jménu víry [religion.GetName], jsou jistě hodny úcty."
 legend_saintly_descent_name: "[ROOT.Char.CustomFixedRandom('GetDescendantSynonym')|U] předka jménem [Localize( ancestor_flag )]"
 legend_saintly_descent_desc: "Posvátná krev předka jménem [Localize( ancestor_flag )] proudí našimi žilami a díky ní budeme konat zázraky."
 legend_mythical_descent_name: "[Localize( creature )|U] v naší krvi"
 legend_mythical_descent_desc: "[Localize( creature )|U] patří k mým mocným předkům."
 legend_godly_descent_name: "[Localize( god )|U] v naší krvi"
 legend_godly_descent_desc: "[Localize( god )|U] je mým předkem. S touto krví v žilách budu konat divy."
 legend_chronicle_ancestral_glory_desc: "[ancestor.GetName|U] [Select_CString(ancestor.IsFemale,'byla skutečně velkou ženou','byl skutečně velkým mužem')|l], [Select_CString(ancestor.IsFemale,'kterou','kterého')|l] všichni uctívali."
 legend_chronicle_ancestral_glory_nohistory_desc: "Náš předek skutečně patřil mezi velikány, které všichni uctívali."
 legend_crusader: "[GetTrait('faith_warrior').GetNameNoTooltip( protagonist )|U] [ancestor.GetTitleAsNameNoTooltip]"
 legend_crusader_desc: "[protagonist.GetName|U] [Select_CString(protagonist.IsFemale,'vykonala','vykonal')|l] při dobývání Svaté země mnoho velkých a zbožných činů."
 legend_chronicle_raised_by_animals: "[Localize( Concatenate( 'animal_type_' , beast ) )|U] vychovává dítě"
 legend_chronicle_raised_by_animals_desc: "[Localize( Concatenate( 'animal_type_' , beast ) )|U] vychovává [protagonist.Custom('CZ_NameNoTooltip_A')] v divočině. Drsná zkušenost ve světě, jehož tvůrcem je [protagonist.GetFaith.CreatorName], byla božskou průpravou k vládě."
 legend_auspicious_birth: "Příznivé zrození"
 legend_auspicious_birth_desc: "[protagonist.GetNameNoTooltip|U] [Select_CString(protagonist.IsFemale,'se narodila','se narodil')|l], když noční oblohu rozzářily příznivé hvězdy – neklamné znamení velkých činů, k nimž [Select_CString(protagonist.IsFemale,'byla předurčena','byl předurčen')|l]."
 legend_virgin_birth: "Neposkvrněné početí"
 legend_virgin_birth_desc: "[protagonist.GetMother.GetNameNoTooltip|U] nějakým způsobem počala dítě, aniž by ulehla se svým manželem. Vskutku znamení, že [protagonist.GetFaith.HighGodName] [Select_CString(Or(EqualTo_string(protagonist.GetFaith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(protagonist.GetFaith.HighGodName,Localize('confucianism_high_god_name'))),'projevují','projevuje')|l] svou přízeň tímto zázračným dítětem."
 legend_sacred_birth_name: "[protagonist.Custom('CZ_FirstNamePossessiveNoTooltip_N')|U] [CZAdjectiveDecline(ROOT.Char.CustomFixedRandom('GetPiousAdj'),'é')|l] zrození"
 legend_sacred_birth_desc: "Okolnosti narození [protagonist.Custom('CZ_NameNoTooltip_G')] zahaluje tajemství, neklamný důkaz, že již od počátku [Select_CString(protagonist.IsFemale,'požívala','požíval')|l] požehnání, které [Select_CString(Or(EqualTo_string(protagonist.GetFaith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(protagonist.GetFaith.HighGodName,Localize('confucianism_high_god_name'))),'udílejí','udílí')|l] [protagonist.GetFaith.HighGodName]."
 legend_divine_intervention_name: "[Localize( god )|U] [Select_CString(EqualTo_string(Localize( god ),Localize('the_angels')),'žehnají','žehná')|l]"
 legend_divine_intervention_desc: "Ve spánku k [protagonist.Custom('CZ_NameNoTooltip_D')] [Localize( god )] [Select_CString(EqualTo_string(Localize( god ),Localize('the_angels')),'promlouvají','promlouvá')|l] a [Select_CString(EqualTo_string(Localize( god ),Localize('the_angels')),'svěřují','svěřuje')|l] posvátné poslání."
 legend_fought_devil_name: "Souboj se zlem jménem [protagonist.GetFaith.DevilName]"
 legend_fought_devil_desc: "Ve snu [protagonist.GetNameNoTooltip] [Select_CString(protagonist.IsFemale,'svedla','svedl')|l] souboj se samotným zlem jménem [protagonist.GetFaith.DevilName] – příznivé znamení předurčení k porážce zla."
 legend_exotic_backstory_name: "Odyssea [protagonist.Custom('CZ_NameNoTooltip_G')]"
 legend_exotic_backstory_desc: "[protagonist.GetName|U] kdysi [Select_CString(protagonist.IsFemale,'putovala','putoval')|l] daleko, až do země [Localize( location.GetString )], a zpět."
 pilgrim_legend_name: "[Select_CString(ancestor.IsFemale,'Poutnice světem','Poutník světem')|U]"
 pilgrim_legend_desc: "[ancestor.GetName|U] [Select_CString(ancestor.IsFemale,'zasvětila','zasvětil')|l] svůj život nekonečné strmé pouti k blaženému záhrobí zvanému [ancestor.GetFaith.PositiveAfterLife]. Jen [ancestor.GetFaith.HighGodName] skutečně [Select_CString(Or(EqualTo_string(ancestor.GetFaith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(ancestor.GetFaith.HighGodName,Localize('confucianism_high_god_name'))),'znají','zná')|l] všechny činy vykonané na posvátné cestě [ancestor.Custom('CZ_FirstNameNoTooltip_G')] ke spáse."
 consecrated_blood_legend: "Svatá krev"
 consecrated_blood_legend_desc: "Krev [founder.Custom('CZ_Name_G')] proudí ve všech členech rodu [dynasty.GetName]. [founder.GetFaith.HighGodName|U] [Select_CString(Or(EqualTo_string(founder.GetFaith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(founder.GetFaith.HighGodName,Localize('confucianism_high_god_name'))),'mají','má')|l] naši naprostou oddanost a všechny činy konáme pouze v tomto posvátném jménu."
 dyn_many_crown_legend: "Svrchovanost rodu [dynasty.GetNameNoTooltip]"
 dyn_many_crown_legend_desc: "Ať už dílem osudu, nebo záměrně, moc připadá rodu [dynasty.GetName]. Naše země jsou rozlehlé, naše činy veliké a vláda nad trůny světa nám byla předurčena."
 legend_of_rome_name: "Nový Caesar"
 legend_of_israel_name: "[Select_CString(founder.IsFemale,'Nová','Nový')|U] [founder.GetTitleAsNameNoTooltip] Izraele"
 legend_of_slavia_name: "Říše Slovanů"
 legend_of_n_sea_name: "Vláda nad mořem"
 legend_of_mann_name: "[Select_CString(founder.IsFemale,'Pirátská','Pirátský')|U] [founder.GetTitleAsNameNoTooltip]"
 legend_of_genghis_name: "Největší z chánů"
 new_title_name: "[Select_CString(founder.IsFemale,'Nová','Nový')|U] [founder.GetTitleAsNameNoTooltip]"
 jewish_priesthood_name: "Naplněné proroctví"
 zoroast_priesthood_name: "Znovu zažehnuté plameny"
 priesthood_restoration_name: "Nové kněžstvo"
 iberian_ender_name: "Osud [GetTitleByKey('e_spain').Custom('CZ_LandedNameNoTierNoTooltip_G')]"
 persian_ender_name: "Osud [GetTitleByKey('e_persia').Custom('CZ_LandedNameNoTierNoTooltip_G')]"
 struggle_conclusion_name: "Konec zápasu [Localize(struggle.GetString)]"
 legendary_battle_name: "Bitva u [CZProvName(location,'G')]"
 reformed_faith: "Upevnění víry [religion.GetNameNoTooltip]"
 new_faith_legend_name: "[faith.GetNameNoTooltip|U] vítězí"
 khan_beater_name: "Postrach chánů"
 legend_of_rome_desc: "Řím, kdysi pouhá vzdálená vzpomínka, znovu povstává s novým Caesarem, připraveným přivést civilizaci do nové éry."
 legend_of_israel_desc: "Izrael, království Bohem vyvoleného lidu, podrobené Asyřany, Babyloňany a Římany. Exodus ze zaslíbené země vyslal náš lid na pouť po celém světě. Nyní však povstává nové izraelské království a Boží lid znovu obývá jeho země!"
 legend_of_slavia_desc: "Slovanské národy se rozšířily po celé Evropě. Nyní je však [founder.GetFirstName] [Select_CString(founder.IsFemale,'první držitelkou','prvním držitelem')|l] titulu [founder.GetTitleAsNameNoTooltip] všech Slovanů!"
 legend_of_n_sea_desc: "Severní moře bývalo doménou Dánů. Nyní pod vládou [founder.Custom('CZ_Name_G')] povstává nad jeho vlnami říše."
 legend_of_mann_desc: "Na vodách kolem Británie si námořníci vyprávějí o [Select_CString(founder.IsFemale,'mocné a děsivé pirátce','mocném a děsivém pirátovi')|l] s titulem [founder.GetTitleAsNameNoTooltip], [Select_CString(founder.IsFemale,'jejíž','jehož')|l] jméno zní [founder.GetName]. I největší bojovníci zblednou, když spatří [Select_CString(founder.IsFemale,'její','jeho')|l] lodě u svých břehů. Jedinou možností by bylo vzdát se – kdyby [founder.GetTitleAsNameNoTooltip] něco takového vůbec [Select_CString(founder.IsFemale,'přijímala','přijímal')|l]."
 legend_of_genghis_desc: "Vše pod nebesy patří největšímu ze všech chánů. Mongolský lid [Select_CString(founder.IsFemale,'sjednotila jediná','sjednotil jediný')|l] [founder.GetTitleAsNameNoTooltip]. Vlci vyjí a orli křičí, zatímco Čingischán vypaluje své jméno do celého světa."
 new_title_desc: "Z popela povstává [Select_CString(founder.IsFemale,'nová','nový')|l] [founder.GetTitleAsNameNoTooltip], aby pod svou laskavou vládou [Select_CString(founder.IsFemale,'přinesla','přinesl')|l] blahobyt."
 jewish_priesthood_desc: "Diaspora se zdála být věčná. Pod vládou [founder.Custom('CZ_Name_G')] však vzniklo nové velekněžstvo, které povede lid víry [faith.GetName] do nové, jasnější éry."
 zoroast_priesthood_desc: "Zoroastrijskou víru kdysi vedli velcí mágové, jejich řád však zanikl. Z milosti Ahury Mazdy, Anáhity a Mithry [protagonist.GetName] tento řád [Select_CString(protagonist.IsFemale,'obnovila','obnovil')|l]."
 priesthood_restoration_desc: "Náboženství [faith.GetName] se pod krutou rukou času proměnilo v popel. Nyní [founder.GetName] znovu buduje kněžstvo a [faith.HighGodName] tomuto dílu [Select_CString(Or(EqualTo_string(faith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(faith.HighGodName,Localize('confucianism_high_god_name'))),'udílejí','udílí')|l] svou milost."
 iberian_ender_desc: "Svár iberské šlechty skončil a [struggle_ender.GetFirstName] přináší spásu. [struggle_ender.GetTitleAsNameNoTooltip|U] vítězí."
 struggle_conclusion_desc: "Zápas [Localize(struggle.GetString)] konečně skončil. [struggle_ender.GetFirstName|U] přichází jako [Select_CString(struggle_ender.IsFemale,'hrdinka, která','hrdina, který')|l] uvede kraj do nové éry."
 khan_beater_desc: "Legendární „Čingischán“ chtěl vše pod nebesy připojit ke své říši. Jeho plány však [Select_CString(winner.IsFemale,'zhatila hrdinná','zhatil hrdinný')|l] [winner.GetTitleAsNameNoTooltip] [winner.GetName]!"
 legendary_battle_desc: "[loser.GetName|U] [Select_CString(loser.IsFemale,'hodlala','hodlal')|l] zničit [winner.Custom('CZ_Name_A')] a [Select_CString(loser.IsFemale,'byla','byl')|l] vskutku [Select_CString(loser.IsFemale,'důstojnou soupeřkou','důstojným soupeřem')|l]. Vítězství [winner.Custom('CZ_FirstNameNoTooltip_G')] slibuje, že odvážným činům nebude konce!"
 reformed_faith_desc: "Organizované náboženství mělo zničit staré zvyky. Pod moudrým a zbožným vedením [reformer.Custom('CZ_Name_G')] však víra [faith.GetName] vstoupila do nové éry. Legendy byly zapsány do posvátné knihy a vzniklo uspořádané kněžstvo. Co [Select_CString(Or(EqualTo_string(faith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(faith.HighGodName,Localize('confucianism_high_god_name'))),'žádají','žádá')|l] [faith.HighGodName], se naplní!"
 new_faith_legend_desc: "Slabá a zkažená církev se vzdálila tomu, co [faith.HighGodName] [Select_CString(Or(EqualTo_string(faith.HighGodName,Localize('jainism_high_god_name')),EqualTo_string(faith.HighGodName,Localize('confucianism_high_god_name'))),'žádají','žádá')|l] od lidstva. Pod božským vedením [reformer.Custom('CZ_Name_G')] se zrodila jediná pravá víra [faith.GetName]."
 legend_chronicle_debug_legend: "#D Legenda o QA#!"
 legend_chronicle_debug_legend_desc: "#D QA je starobylé a vznešené povolání#!"
 legend_chronicle_beast_slayer: "[Localize( Concatenate( 'animal_type_' , beast ) )|U] nachází smrt"
 legend_chronicle_beast_slayer_desc: "[CZPrepV(location.GetNameNoTooltip)|U] [CZProvName(location,'L')] padá [Localize( Concatenate( 'animal_type_' , beast ) )|l]."
 legend_chronicle_holy_war: "Svatá válka v kraji [location.GetName]"
 legend_chronicle_holy_war_desc: "V kraji [location.GetName] utrpěl porážku nepřítel [Localize( antagonist )|l]."
 legend_chronicle_generic_opening: "$legend_chapter_opening_generic$"
 legend_ruler_loc: "[protagonist.Custom('CZ_FirstNameNoTooltip_G')]"
 legend_ruler_loc_possessive: "[protagonist.Custom('CZ_FirstNameNoTooltip_G')]"
 legend_ruler_family_loc: "[protagonist.GetDynastyNameNoTooltip]"
