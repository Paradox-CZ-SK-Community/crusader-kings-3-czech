l_polish:
 building_type_drassanes_01: "$building_drassanes_01$"
 building_type_drassanes_01_desc: "$building_drassanes_01_desc$"
 building_drassanes_01: "Drassanes"
 building_drassanes_01_desc: "Za hradbami Barcelony, na úpatí vrchu #italic Montjuïc#!, se rozkládá mohutný arzenál se suchými doky, který vyzbrojuje a chrání flotilu válečných galér.\nPod lomenými kamennými klenbami neúnavně pracují dělníci. Vysoké věže a dlouhé hradby střeží tajemství jejich práce před zraky cizinců."
 building_type_kyz_kala_01: "$building_kyz_kala_01$"
 building_type_kyz_kala_01_desc: "$building_kyz_kala_01_desc$"
 building_kyz_kala_01: "Velká Kyz Kala"
 building_kyz_kala_01_desc: "Tento mohutný palác se tyčí nad bujnou oázou Mervu. Rýhované zdi obklopují dílny, zbrojnice a rozlehlé síně, v nichž vyslanci a úředníci vyřizují své záležitosti.\nNapůl sídlo a napůl pevnost, tato velkolepá stavba dokáže stejně dobře hostit ty nejnádhernější hostiny jako odrážet ty nejdivočejší nájezdy."
 building_type_cluny_abbey_01: "Klášter Cluny"
 building_type_cluny_abbey_01_desc: "$building_cluny_abbey_01_desc$"
 building_cluny_abbey_01: "Opatství Cluny"
 building_cluny_abbey_01_desc: "Dar půdy a práv výměnou za věčnou spásu. Taková je úmluva uzavřená mezi mnišským společenstvím v Cluny a místním pánem.\nPostupem času zde vyrostlo živé a vlivné společenství, osvobozené od světských zásahů a prosazující benediktinskou kázeň široko daleko.\n\nPod mnoha červenými střechami se mniši modlí, pracují a iluminují rukopisy - a dávají tak příklad hodný následování po celém kontinentu."
 building_cluny_abbey_02: "Maior Ecclesia"
 building_cluny_abbey_02_desc: "Někdejší hrstku mnišských obydlí nahradil rozlehlý náboženský komplex.\nAby opati toto dědictví završili, pustili se do kolosálního stavebního projektu, #italic Maior Ecclesia#!. Chrám, jenž má být největší v celém křesťanstvu, má pět lodí delších než ty ve Vatikánu a jeho mohutné kamenné klenby představují architektonický div, nad nímž se tyčí množství věží a střech."
 building_type_york_walls_01: "$building_york_walls_01$"
 building_type_york_walls_01_desc: "$building_york_walls_01_desc$"
 building_york_walls_01: "Hradby Yorku"
 building_york_walls_01_desc: "Tyto rozsáhlé hradby, táhnoucí se několik mil, chrání město již od dob římských císařů. Důmyslně využívají dvou řek, které se vinou okolními loukami, a chrání tak město před nepřáteli z východu i západu. Veškerý provoz je veden přes několik úzkých průchodů, takzvané #italic Bars#!, kde lze vybírat mýtné - nebo na nepřátele sesílat déšť šípů a ohně."
 building_type_damascus_mosque_01: "$building_damascus_mosque_01$"
 building_type_damascus_mosque_01_desc: "$building_damascus_mosque_01_desc$"
 building_damascus_mosque_01: "Velká mešita v Damašku"
 building_damascus_mosque_01_desc: "Tato mešita v sobě nese úctyhodnou historii. Staletí duchovního života a pozoruhodné lidské vynalézavosti se zde vrství jedno přes druhé, neboť stavba stojí na místě římského chrámu a raně křesťanské baziliky.\nProslula honosnými pestrobarevnými mramory i zlatými mozaikami, které skládali umělci přicházející až z Konstantinopole."
 building_type_jokhang_01: "$building_jokhang_01$"
 building_type_jokhang_01_desc: "$building_jokhang_01_desc$"
 building_jokhang_01: "Chrám Džókhang"
 building_jokhang_01_desc: "Legendy praví, že Džókhang byl vybudován nad prastarým posvátným jezerem, které tvořilo srdce démonky mající podobu Tibetu. Třikrát byl vztyčen a třikrát jej pohltil běsnící živel jezera, než jej modlitby a obětní dary manželky prvního císaře dokázaly konečně utišit.\nJe to nejposvátnější chrám v celé zemi, spletitý komplex nádvoří a mnišských obydlí protkaný rozlehlými chodbami a síněmi, jejichž stěny pokrývá jačí máslo."
 building_type_wartburg_01: "$building_wartburg_01$"
 building_type_wartburg_01_desc: "$building_wartburg_01_desc$"
 building_wartburg_01: "Wartburg"
 building_wartburg_01_desc: "V Durynském lese, vysoko na mohutném skalním srázu, stojí pevnost, která ovládá veškerý pohyb zboží i lidí krajem.\nJediný přístup k hradu střeží mohutný barbakán a vysoké bílé hradby se vinou mezi skalními rozsedlinami. #italic Palas#! je nejdůležitější budovou celého komplexu, mohutnou síní z chladného kamene, kterou zahřívají četná ohniště."
 building_type_beta_giyorgis_01: "$building_beta_giyorgis_01$"
 building_type_beta_giyorgis_01_desc: "$building_beta_giyorgis_01_desc$"
 building_beta_giyorgis_01: "Kostel svatého Jiří v Lalibele"
 building_beta_giyorgis_01_desc: "#italic Bete Gijorgis#! byl celý vytesán do teplé, rudé sopečné horniny. Obklopuje jej tucet dalších sesterských chrámů a staveb, které mají představovat pozemský i nebeský Jeruzalém. Jsou živoucím důkazem pouta mezi Svatým královstvím a touto zemí.\nHlavní chrámová síň, ukrytá hluboko ve skále, je bohatě vyzdobena nádhernými freskami a její stěny zdobí posvátné ikony."
 building_type_holy_wisdom_01: "$building_holy_wisdom_01$"
 building_type_holy_wisdom_01_desc: "$building_holy_wisdom_01_desc$"
 building_holy_wisdom_01: "Chrám Boží Moudrosti"
 building_holy_wisdom_01_desc: "Tento velkolepý chrám byl vystavěn podle vzoru chrámu Hagia Sofia, aby v mrazivé severní zemi ztělesňoval tutéž záři, bohatství a moc. Strohá bílá vápencová fasáda nedává tušit záplavu barev fresek ukrytých uvnitř. V teplém světle svící tančí stíny po zlatých mozaikách pod četnými kupolemi katedrály."
 building_type_kano_walls_01: "$building_kano_walls_01$"
 building_type_kano_walls_01_desc: "$building_kano_walls_01_desc$"
 building_kano_walls_01: "Zemní opevnění Kana"
 building_kano_walls_01_desc: "Starobylé město Kano obklopují mohutné, několik metrů vysoké hradby z hlíny a jílu.\nOpevnění zabírá mnohem větší plochu než samotná městská zástavba a obepíná i pšeničná pole, která mají obyvatelstvo zásobovat během dlouhých obléhání."
 building_type_somapura_university_01: "$building_somapura_university_01$"
 building_type_somapura_university_01_desc: "$building_somapura_university_01_desc$"
 building_somapura_university_01: "Univerzita Sómapura"
 building_somapura_university_01_desc: "Sómapura po staletí slouží jako jedno z nejvýznamnějších center vzdělanosti v Indii a díky svým četným vazbám na buddhistické, džinistické a hinduistické kláštery přitahuje učence ze vzdálených krajů.\nČtvercový půdorys ztělesňuje dokonalou harmonii a čistotu vesmíru a vytváří ideální místo pro rozkvět ducha."
 building_type_duomo_florence_01: "Florentský dóm"
 building_type_duomo_florence_01_desc: "Sídlo místního arcibiskupa a velký zdroj občanské hrdosti všech obyvatel Florencie, dóm patří k největším architektonickým dílům, jaká kdy byla vytvořena."
 building_duomo_florence_01: "Santa Reparata"
 building_duomo_florence_01_desc: "Tato raně křesťanská bazilika, stojící podél starých římských hradeb poblíž jejich severní brány, slouží florentským křesťanům již od dob před Konstantinem. Přežila žhářství i plenění, přestavby i nová vysvěcení, přesto si uchovala původní tři lodě a elegantní půlkruhové oblouky.\nJak však město roste, možná bude muset růst spolu s ním i stará bazilika."
 building_duomo_florence_02: "Baptisterium svatého Jana"
 building_duomo_florence_02_desc: "V samém středu města stojí kolosální osmiboké baptisterium zasvěcené jeho patronu svatému Janu.\nStavbu pokrývá drahocenný mramor a zdobí ji mistrovské sochy a zlaté mozaiky, skutečné svědectví o bohatství města. Podle legendy zde kdysi stával chrám boha Marta a vzhled budovy nápadně připomíná římský Pantheon."
 building_duomo_florence_03: "Santa Maria del Fiore"
 building_duomo_florence_03_desc: "Nad městem se nyní tyčí velkolepá katedrála - #italic Duomo#! - hodná bohaté Florencie.\nDlouhé lodě a obrovská osmiboká apsida jsou obloženy mramorem výrazných barev, který vytváří působivé optické hry s hloubkou. Průčelí zdobí sochy proroků, bohů a patronů. Vysoká zvonice odbíjí obyvatelům města hodiny práce a modliteb."
 building_duomo_florence_04: "Kupole"
 building_duomo_florence_04_desc: "Nad celým komplexem se monumentálně tyčí #italic kupole#!. Štíhlá a téměř beztížná proti modrému nebi představuje největší úspěch florentských stavitelů.\nJe vyšší a širší než cokoli, co si kdy stavitelé dokázali představit, a přesto nepotřebuje žádné vnější opěrné pilíře ani podpůrné konstrukce, které by ji chránily před zřícením, a to díky důmyslnému využití dvojitého pláště z cihel a zdiva."
 building_type_konark_temple_01: "$building_konark_temple_01$"
 building_type_konark_temple_01_desc: "$building_konark_temple_01_desc$"
 building_konark_temple_01: "Sluneční chrám v Kónáraku"
 building_konark_temple_01_desc: "Sluneční chrám v Kónáraku, na němž pracovaly tisíce řemeslníků, je mohutnou svatyní zasvěcenou slunečnímu bohu Súrjovi. Celý komplex má podobu božského velkolepého vozu, který veze světlo od moře směrem na východ.\nChrám je nádherným příkladem kalingské architektury a pokrývají jej reliéfy a sochy bohů, vojáků, hudebníků i bájných tvorů, které vyprávějí příběhy hinduistických písem."
 building_type_al_qarawiyyin_university_01: "$building_al_qarawiyyin_university_01$"
 building_type_al_qarawiyyin_university_01_desc: "$building_al_qarawiyyin_university_01_desc$"
 building_al_qarawiyyin_university_01: "Univerzita al-Karawíjín"
 building_al_qarawiyyin_university_01_desc: "Rozlehlý komplex založený obchodníky a přistěhovalci z Kajruvánu se stal jedním z nejprestižnějších center vyššího vzdělávání v západním islámském světě. Přitahuje učence ze vzdálených krajů a místním elitám poskytuje vzdělání v nejvytříbenějších naukách.\n#italic Madrasa#! se skládá z několika síní a místností, které zahraničním studentům poskytují lůžko a odpočinek, zatímco ústředním nádvořím veřejných debat je #italic sahn#!."
 building_type_kairouan_basins_01: "$building_kairouan_basins_01$"
 building_type_kairouan_basins_01_desc: "$building_kairouan_basins_01_desc$"
 building_kairouan_basins_01: "Kajruvánské nádrže"
 building_kairouan_basins_01_desc: "Tyto mohutné nádrže, vybudované k zásobování města pitnou vodou v dobách nouze, čistí dešťovou vodu tím, že slouží jako usazovací nádrže a zachycují sedimenty.\nSystém tvoří několik propojených částí, od menší nádrže přes větší až po zdobenou zděnou cisternu."
 building_type_ghana_palace_01: "$building_ghana_palace_01$"
 building_type_ghana_palace_01_desc: "$building_ghana_palace_01_desc$"
 building_ghana_palace_01: "Ghanský palác"
 building_ghana_palace_01_desc: "Uprostřed posvátného háje stojí palác #italic Ghanů#!, královských vládců města.\nKomplex tvoří stavby z pískovce a nepálených cihel chráněné ohrazením s branami. Jejich stěny pokrývají nádherně zbarvené reliéfy a řezby. Tento mohutný palác vévodí celému okolnímu městu."
 building_type_visegrad_castle_01: "$building_visegrad_castle_01$"
 building_type_visegrad_castle_01_desc: "$building_visegrad_castle_01_desc$"
 building_visegrad_castle_01: "Visegrádská citadela"
 building_visegrad_castle_01_desc: "Tato citadela je velkolepým a nedobytným systémem hradeb a věží. Chrání ohyb Dunaje a ovládá bohatý obchod, který jím proudí. \nVisegrádskou citadelu tvoří dolní část s mohutnou šestibokou věží obrácenou k řece a horní akropole korunující vysoký vrch. Mohutné trojúhelníkové opevnění slouží zároveň jako rezidence i honosný lovecký zámeček."
 building_type_wawel_cathedral_01: "$building_wawel_cathedral_01$"
 building_type_wawel_cathedral_01_desc: "$building_wawel_cathedral_01_desc$"
 building_wawel_cathedral_01: "Kolegiátní kostel Panny Marie a svatého Alexia"
 building_wawel_cathedral_01_desc: "Tento velký kamenný kostel, vystavěný z ruly a vápence za pomoci řemeslníků z Německa, patří k prvním stavbám svého druhu v polských zemích a je svědectvím moci církve.\nMohutné zdi nabízejí věřícím nejen příslib spásy, ale i nezbytnou ochranu jejich pozemských životů. Na západní věži jsou prý dodnes patrné stopy Ďáblových drápů, což jen dosvědčuje její obrannou sílu."
 building_wawel_cathedral_02: "Arcikolegiátní kostel Panny Marie a svatého Alexia"
 building_wawel_cathedral_02_desc: "$building_wawel_cathedral_01_desc$\nPo povýšení na arcikolegiátní kostel se o něj nyní stará kolegium kanovníků, organizované společenství tvořené výhradně duchovními. Jeho rozměry a nádhera jsou velkolepé, ale protože není sídlem biskupa, nemůže nést titul katedrály."
 building_wawel_cathedral_03: "Katedrála Panny Marie a svatého Alexia"
 building_wawel_cathedral_03_desc: "$building_wawel_cathedral_01_desc$\nPo vynaložení značných prostředků zde papež konečně zřídil novou diecézi i sídlo biskupa. Tato hrdá stavba se tak konečně může nazývat katedrálou."
 building_type_vatapi_caves_01: "$building_vatapi_caves_01$"
 building_type_vatapi_caves_01_desc: "$building_vatapi_caves_01_desc$"
 building_vatapi_caves_01: "Jeskyně Vátápi"
 building_vatapi_caves_01_desc: "Tyto posvátné jeskyně, vybudované za rané dynastie Čálukjů, byly vytesány hluboko do majestátního pískovcového masivu. Uvnitř se skrývá tichý a navýsost posvátný svět.\nTriumfální brána přivádí poutníky k monolitické stěně hory. Jeskyně zdobí zpodobnění božstev všech hlavních indických náboženství."
 building_type_jaisalmer_fort_01: "$building_jaisalmer_fort_01$"
 building_type_jaisalmer_fort_01_desc: "$building_jaisalmer_fort_01_desc$"
 building_jaisalmer_fort_01: "Zlatá pevnost"
 building_jaisalmer_fort_01_desc: "Zlaté hradby Džajsalméru neukrývají uprostřed pouště Thár jen obrannou pevnost, ale celé město.\nPři západu slunce prý hradby získávají teplou barvu sladkého medu, zatímco za dne městu umožňují téměř splynout s okolní krajinou."
