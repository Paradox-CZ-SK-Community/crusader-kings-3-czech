l_polish:
 building_type_drassanes_01: "$drassanes_01$" # todo: CHANGED (predtym: $building_drassanes_01$)
 building_type_drassanes_01_desc: "$drassanes_01_desc$" # todo: CHANGED (predtym: $building_drassanes_01_desc$)
 drassanes_01: "Drassanes" # todo: NEW TRANSLATION
 drassanes_01_desc: "Za městskými hradbami Barcelony, na úpatí kopce #italic Montjuich#!, tento velký suchý dok slouží jako arzenál a ochrana flotily válečných galér.\nPod špičatými kamennými klenbami pracují dělníci bez ustání. Vysoké věže a dlouhé hradby chrání tajemství jejich práce před cizinci." # todo: NEW TRANSLATION
 building_type_kyz_kala_01: "$kyz_kala_01$" # todo: CHANGED (predtym: $building_kyz_kala_01$)
 building_type_kyz_kala_01_desc: "$kyz_kala_01_desc$" # todo: CHANGED (predtym: $building_kyz_kala_01_desc$)
 kyz_kala_01: "Velká Kyz Kala" # todo: NEW TRANSLATION
 kyz_kala_01_desc: "Tento mohutný palác se tyčí nad bujnou oázou Mervu. Jeho žlábkované zdi obklopují dílny, zbrojnice a rozlehlé síně, kde se věnují své práci vyslanci a úředníci.\nTato velkolepá stavba je zčásti sídlem a zčásti pevností. Dokáže hostit ty nejskvostnější slavnosti, ale také odrazit ty nejbarbarštější nájezdy." # todo: NEW TRANSLATION
 building_type_cluny_abbey_01: "Klášter Cluny"
 building_type_cluny_abbey_01_desc: "$cluny_abbey_01_desc$" # todo: CHANGED (predtym: $building_cluny_abbey_01_desc$)
 cluny_abbey_01: "Klášter v Cluny" # todo: NEW TRANSLATION
 cluny_abbey_01_desc: "Dar půdy a práv výměnou za věčnou spásu. Taková je úmluva mezi mnišskou komunitou v Cluny a místním pánem.\nPostupem času se z ní stala živá a vlivná komunita, prostá světského vměšování, která široko daleko prosazuje benediktinskou kázeň.\n\nPod mnoha červenými střechami se mniši modlí, pracují a iluminují rukopisy – jsou vzorem, který mohou ostatní na celém kontinentu následovat." # todo: NEW TRANSLATION
 cluny_abbey_02: "Maior Ecclesia" # todo: NEW TRANSLATION
 cluny_abbey_02_desc: "Několik skromných mnišských obydlí nahradil rozsáhlý náboženský komplex.\nAby opati upevnili tento odkaz, pustili se do kolosálního stavebního projektu, #italic Maior Ecclesia#!. Má jít o největší kostel křesťanstva: jeho pět lodí je delších než lodě ve Vatikánu a mohutné kamenné klenby jsou architektonickým počinem, který doplňuje množství věží a střech." # todo: NEW TRANSLATION
 building_type_york_walls_01: "$york_walls_01$" # todo: CHANGED (predtym: $building_york_walls_01$)
 building_type_york_walls_01_desc: "$york_walls_01_desc$" # todo: CHANGED (predtym: $building_york_walls_01_desc$)
 york_walls_01: "Yorkské hradby" # todo: NEW TRANSLATION
 york_walls_01_desc: "Tyto rozlehlé hradby, táhnoucí se na několik mil, chrání město už od dob Caesarů. Důmyslně využívají dvě řeky, které se vinou loukami a chrání město před nepřáteli z východu i západu. Veškerý provoz vedou přes několik úzkých míst zvaných #italic Bars#!, kde lze vybírat mýto, nebo na nepřátele sesílat déšť šípů a ohně." # todo: NEW TRANSLATION
 building_type_damascus_mosque_01: "$damascus_mosque_01$" # todo: CHANGED (predtym: $building_damascus_mosque_01$)
 building_type_damascus_mosque_01_desc: "$damascus_mosque_01_desc$" # todo: CHANGED (predtym: $building_damascus_mosque_01_desc$)
 damascus_mosque_01: "Velká damašská mešita" # todo: NEW TRANSLATION
 damascus_mosque_01_desc: "Tato mešita má úctyhodnou historii. Vrství se v ní staletí duchovního života a úžasné vynalézavosti, neboť byla postavena na římském chrámu a raně křesťanské bazilice.\nStavba je proslulá přepychovým a pestrobarevným mramorem i zlatými mozaikami, které vytvořili umělci až z daleké Konstantinopole." # todo: NEW TRANSLATION
 building_type_jokhang_01: "$jokhang_01$" # todo: CHANGED (predtym: $building_jokhang_01$)
 building_type_jokhang_01_desc: "$jokhang_01_desc$" # todo: CHANGED (predtym: $building_jokhang_01_desc$)
 jokhang_01: "Chrám Džókhang" # todo: NEW TRANSLATION
 jokhang_01_desc: "Podle legend byl Džókhang postaven nad prastarým posvátným jezerem, které představovalo srdce démonky v podobě Tibetu. Třikrát byl vybudován a třikrát jej pohltila zuřivost jezera. Teprve modlitby a obětní dary manželky prvního císaře je nakonec dokázaly uklidnit.\nChrám je nejposvátnějším místem v zemi, spletitým komplexem nádvoří a klášterních sídel, kterými se vinou rozlehlé chodby a síně pokryté jačím máslem." # todo: NEW TRANSLATION
 building_type_wartburg_01: "$wartburg_01$" # todo: CHANGED (predtym: $building_wartburg_01$)
 building_type_wartburg_01_desc: "$wartburg_01_desc$" # todo: CHANGED (predtym: $building_wartburg_01_desc$)
 wartburg_01: "Wartburg" # todo: NEW TRANSLATION
 wartburg_01_desc: "Tato pevnost se tyčí na mohutném skalnatém srázu v Durynském lese a ovládá veškerý pohyb zboží i lidí v oblasti.\nJediný přístup k hradu střeží mohutná barbakanová věž a vysoké bílé hradby se vinou horskými rozsedlinami. #italic Palas#! je nejdůležitější stavbou komplexu: mohutnou síní z chladného kamene, kterou zahřívá množství ohnišť." # todo: NEW TRANSLATION
 building_type_beta_giyorgis_01: "$beta_giyorgis_01$" # todo: CHANGED (predtym: $building_beta_giyorgis_01$)
 building_type_beta_giyorgis_01_desc: "$beta_giyorgis_01_desc$" # todo: CHANGED (predtym: $building_beta_giyorgis_01_desc$)
 beta_giyorgis_01: "Svatý Jiří v Lalibele" # todo: NEW TRANSLATION
 beta_giyorgis_01_desc: "#italic Beta Giyorgis#! byl celý vytesán z teplého červeného sopečného kamene. Obklopuje ho tucet dalších sesterských chrámů a budov, které mají představovat pozemský i nebeský Jeruzalém. Je živým důkazem spojení mezi svatým královstvím a touto zemí.\nHlavní síň kostela, vyhloubená hluboko ve skále, je bohatě vyzdobena nádhernými freskami a její stěny zdobí svaté ikony." # todo: NEW TRANSLATION
 building_type_holy_wisdom_01: "$holy_wisdom_01$" # todo: CHANGED (predtym: $building_holy_wisdom_01$)
 building_type_holy_wisdom_01_desc: "$holy_wisdom_01_desc$" # todo: CHANGED (predtym: $building_holy_wisdom_01_desc$)
 holy_wisdom_01: "Svatá Boží Moudrost" # todo: NEW TRANSLATION
 holy_wisdom_01_desc: "Tento skvostný kostel byl vystavěn podle vzoru Hagie Sofie, aby i v mrazivé severní zemi představoval stejné světlo, bohatství a moc. Strohý bílý vápenec skrývá zářivé barvy vnitřních fresek. Svíčky osvětlují zlaté mozaiky mnoha kopulí katedrály a kolem nich tančí stíny." # todo: NEW TRANSLATION
 building_type_kano_walls_01: "$kano_walls_01$" # todo: CHANGED (predtym: $building_kano_walls_01$)
 building_type_kano_walls_01_desc: "$kano_walls_01_desc$" # todo: CHANGED (predtym: $building_kano_walls_01_desc$)
 kano_walls_01: "Hliněné valy Kana" # todo: NEW TRANSLATION
 kano_walls_01_desc: "Starobylé město Kano obklopují mohutné hliněné a blátěné hradby, vysoké mnoho stop.\nValy se rozkládají na mnohem větší ploše, než jakou obývají měšťané, a obepínají také pšeničná pole, která mají obyvatelstvo uživit během dlouhého obléhání." # todo: NEW TRANSLATION
 building_type_somapura_university_01: "$somapura_university_01$" # todo: CHANGED (predtym: $building_somapura_university_01$)
 building_type_somapura_university_01_desc: "$somapura_university_01_desc$" # todo: CHANGED (predtym: $building_somapura_university_01_desc$)
 somapura_university_01: "Univerzita v Somapuře" # todo: NEW TRANSLATION
 somapura_university_01_desc: "Somapura po staletí sloužila jako jedno z nejvýznamnějších center vzdělanosti v Indii. Díky četným vazbám na buddhistické, džinistické a hinduistické kláštery přitahuje učence z dalekých krajů.\nČtyřúhelníkový půdorys představuje pravou harmonii a čistotu vesmíru a je dokonalým místem pro rozvoj ducha." # todo: NEW TRANSLATION
 building_type_duomo_florence_01: "Florentský dóm"
 building_type_duomo_florence_01_desc: "Sídlo místního arcibiskupa a velký zdroj občanské hrdosti všech obyvatel Florencie, dóm patří k největším architektonickým dílům, jaká kdy byla vytvořena."
 duomo_florence_01: "Santa Reparata" # todo: NEW TRANSLATION
 duomo_florence_01_desc: "Tato raně křesťanská bazilika, stojící u starobylých římských hradeb poblíž severní brány, slouží florentským křesťanům už od dob před Konstantinem. Zažila žhářství i plenění, přestavby i požehnání, přesto si zachovala původní tři lodě a elegantní okrouhlé oblouky.\nJak se však město rozrůstá, možná s ním bude muset růst i stará bazilika." # todo: NEW TRANSLATION
 duomo_florence_02: "Křtitelnice svatého Jana" # todo: NEW TRANSLATION
 duomo_florence_02_desc: "Tato kolosální osmiboká křtitelnice stojí uprostřed města a je zasvěcena jeho patronu, svatému Janovi.\nStavbu pokrývá drahý mramor a zdobí mistrovské sochy i zlaté mozaiky, což dokládá bohatství města. Podle legendy tu kdysi stával chrám boha Marta a stavba se nápadně podobá římskému Pantheonu." # todo: NEW TRANSLATION
 duomo_florence_03: "Santa Maria del Fiore" # todo: NEW TRANSLATION
 duomo_florence_03_desc: "Nad městem se nyní tyčí velká katedrála – #italic Duomo#!, jaká se sluší na bohatou Florencii.\nDlouhé lodě a obrovský osmiboký chór zdobí mramor výrazných barev, jehož vzory si pohrávají s hloubkou. Průčelí zdobí sochy proroků, bohů a patronů. Vysoká zvonice určuje měšťanům čas práce i modlitby." # todo: NEW TRANSLATION
 duomo_florence_04: "Kupole" # todo: NEW TRANSLATION
 duomo_florence_04_desc: "#italic Kupole#! se nad komplexem tyčí v obrovské výšce. Štíhlá a vzdušná proti modré obloze je největším počinem florentských stavitelů.\nVěž je vyšší a širší, než si kdo kdy dokázal představit, a přesto se nehroutí bez vnějších opěr ani podpůrných konstrukcí. Umožnilo to důmyslné použití dvojité skořepiny z cihel a zdiva." # todo: NEW TRANSLATION
 building_type_konark_temple_01: "$konark_temple_01$" # todo: CHANGED (predtym: $building_konark_temple_01$)
 building_type_konark_temple_01_desc: "$konark_temple_01_desc$" # todo: CHANGED (predtym: $building_konark_temple_01_desc$)
 konark_temple_01: "Sluneční chrám v Konáraku" # todo: NEW TRANSLATION
 konark_temple_01_desc: "Na stavbě Slunečního chrámu v Konáraku pracovaly tisíce řemeslníků. Je to mohutný chrám zasvěcený bohu slunce Súrjovi. Celý komplex připomíná mocný boží vůz, který přiváží světlo od moře na východ.\nChrám je nádherným příkladem kalingské architektury. Pokrývají ho reliéfy a sochy bohů, vojáků, hudebníků i bájných tvorů, které vyprávějí příběhy hinduistických písem." # todo: NEW TRANSLATION
 building_type_al_qarawiyyin_university_01: "$al_qarawiyyin_university_01$" # todo: CHANGED (predtym: $building_al_qarawiyyin_university_01$)
 building_type_al_qarawiyyin_university_01_desc: "$al_qarawiyyin_university_01_desc$" # todo: CHANGED (predtym: $building_al_qarawiyyin_university_01_desc$)
 al_qarawiyyin_university_01: "Univerzita al-Karawíjín" # todo: NEW TRANSLATION
 al_qarawiyyin_university_01_desc: "Rozsáhlý komplex založili obchodníci a přistěhovalci z Kajruánu a stal se jedním z nejprestižnějších center vyššího vzdělávání v západním islámském světě. Přitahuje učence z dalekých krajů a místní elity vzdělává v náročnějších oborech.\n#italic Madrasa#! se skládá z několika síní a místností, které zahraničním studentům poskytují lůžko a odpočinek. Jejím ústředním nádvořím pro veřejné diskuse je #italic Sahn#!." # todo: NEW TRANSLATION
 building_type_kairouan_basins_01: "$kairouan_basins_01$" # todo: CHANGED (predtym: $building_kairouan_basins_01$)
 building_type_kairouan_basins_01_desc: "$kairouan_basins_01_desc$" # todo: CHANGED (predtym: $building_kairouan_basins_01_desc$)
 kairouan_basins_01: "Nádrže v Kajruánu" # todo: NEW TRANSLATION
 kairouan_basins_01_desc: "Tyto mohutné nádrže byly vybudovány, aby v dobách nouze zásobovaly město čerstvou vodou. Dešťovou vodu čistí tím, že ji nechávají usazovat a filtrují z ní sedimenty.\nSoustava se skládá z několika propojených částí: od menší nádrže přes větší až po zdobenou zděnou vodní nádrž." # todo: NEW TRANSLATION
 building_type_ghana_palace_01: "$ghana_palace_01$" # todo: CHANGED (predtym: $building_ghana_palace_01$)
 building_type_ghana_palace_01_desc: "$ghana_palace_01_desc$" # todo: CHANGED (predtym: $building_ghana_palace_01_desc$)
 ghana_palace_01: "Palác Ghany" # todo: NEW TRANSLATION
 ghana_palace_01_desc: "Palác #italic Ghanů#!, královských náčelníků města, obklopuje posvátný háj.\nKomplex tvoří budovy z pískovce a nepálených cihel, chráněné ohrazením s bránou. Jejich zdi pokrývají nádherně barevné reliéfy a řezby. Palác je mohutnou stavbou, která dominuje okolnímu městu." # todo: NEW TRANSLATION
 building_type_visegrad_castle_01: "$visegrad_castle_01$" # todo: CHANGED (predtym: $building_visegrad_castle_01$)
 building_type_visegrad_castle_01_desc: "$visegrad_castle_01_desc$" # todo: CHANGED (predtym: $building_visegrad_castle_01_desc$)
 visegrad_castle_01: "Višegrádská citadela" # todo: NEW TRANSLATION
 visegrad_castle_01_desc: "Tato citadela je velkolepým a nedobytným systémem hradeb a věží. Chrání dunajský ohyb a ovládá jeho výnosný obchod.\nVišegrádská citadela se skládá z dolní části s mohutnou šestibokou věží obrácenou k řece a z horní akropole na vrcholu vysokého kopce. Mohutné trojúhelníkové opevnění slouží jako sídlo i přepychový lovecký zámeček." # todo: NEW TRANSLATION
 building_type_wawel_cathedral_01: "$wawel_cathedral_01$" # todo: CHANGED (predtym: $building_wawel_cathedral_01$)
 building_type_wawel_cathedral_01_desc: "$wawel_cathedral_01_desc$" # todo: CHANGED (predtym: $building_wawel_cathedral_01_desc$)
 wawel_cathedral_01: "Kolegiátní kostel Panny Marie a svatého Alexia" # todo: NEW TRANSLATION
 wawel_cathedral_01_desc: "Tento velký kamenný kostel, postavený z ruly a vápence za pomoci řemeslníků z Německa, je jedním z prvních svého druhu v polských zemích a svědčí o moci církve.\nMohutné zdi věřícím slibují spásu a poskytují také zásadní ochranu před pozemskými hrozbami. Západní věž údajně nese stopy Ďáblových spárů, což svědčí o jejích obranných schopnostech." # todo: NEW TRANSLATION
 wawel_cathedral_02: "Arci-kolegiátní kostel Panny Marie a svatého Alexia" # todo: NEW TRANSLATION
 wawel_cathedral_02_desc: "$wawel_cathedral_01_desc$\nPo povýšení na arci-kolegiátní kostel o něj nyní pečuje kolegium kanovníků, organizovaný sbor tvořený výhradně duchovními. Jeho velikost a nádhera jsou obdivuhodné, ale protože není sídlem biskupa, nenáleží mu titul katedrály." # todo: NEW TRANSLATION
 wawel_cathedral_03: "Katedrála Panny Marie a svatého Alexia" # todo: NEW TRANSLATION
 wawel_cathedral_03_desc: "$wawel_cathedral_01_desc$\nPo vynaložení značných prostředků zde papež konečně zřídil novou diecézi a biskupské sídlo. Tuto hrdou stavbu lze konečně nazývat katedrálou." # todo: NEW TRANSLATION
 building_type_vatapi_caves_01: "$vatapi_caves_01$" # todo: CHANGED (predtym: $building_vatapi_caves_01$)
 building_type_vatapi_caves_01_desc: "$vatapi_caves_01_desc$" # todo: CHANGED (predtym: $building_vatapi_caves_01_desc$)
 vatapi_caves_01: "Jeskyně Vatápi" # todo: NEW TRANSLATION
 vatapi_caves_01_desc: "Tyto posvátné jeskyně vybudovala raná dynastie Čálukjů hluboko v mohutném pískovcovém masivu. Uvnitř se nachází svatý a tichý svět.\nPoutníky do monolitického nitra hory vede vítězný oblouk. Jeskyně zdobí modly všech hlavních indických vír." # todo: NEW TRANSLATION
 building_type_jaisalmer_fort_01: "$jaisalmer_fort_01$" # todo: CHANGED (predtym: $building_jaisalmer_fort_01$)
 building_type_jaisalmer_fort_01_desc: "$jaisalmer_fort_01_desc$" # todo: CHANGED (predtym: $building_jaisalmer_fort_01_desc$)
 jaisalmer_fort_01: "Zlatá pevnost" # todo: NEW TRANSLATION
 jaisalmer_fort_01_desc: "Zlaté hradby Džaisalmeru neobklopují jen obrannou pevnost, ale celé město uprostřed pouště Thár.\nPři západu slunce prý hradby získávají teplý odstín sladkého medu, zatímco ve dne město splývá s okolní krajinou." # todo: NEW TRANSLATION
