l_polish:
 building_type_holy_site_st_peters_basilica_01: "$building_holy_site_st_peters_basilica_01$"
 building_type_holy_site_st_peters_basilica_01_desc: "$building_holy_site_st_peters_basilica_01_desc$"
 building_holy_site_st_peters_basilica_01: "Bazilika svatého Petra"
 building_holy_site_st_peters_basilica_01_desc: "Bazilika svatého Petra byla na příkaz císaře Konstantina I. po jeho obrácení na křesťanství vystavěna nad hrobem svatého Petra na Vatikánském pahorku a slouží jako centrum západního křesťanstva. \n\nTento chrám je tradičně sídlem římskokatolického papeže a během staletí se rozrostl v rozsáhlý komplex chráněný Leonskou hradbou."
 building_type_mont_st_michel_01: "Mont-Saint-Michel"
 building_type_mont_st_michel_01_desc: "$building_mont_st_michel_01_desc$"
 building_mont_st_michel_01: "Oratoř svatého Auberta zasvěcená svatému Michaelovi"
 building_mont_st_michel_01_desc: "Roku 708 spatřil svatý Aubert, biskup z Avranches, ve snu archanděla Michaela, který mu přikázal vybudovat oratoř na nedalekém přílivovém ostrově. Aubert vidění zprvu ignoroval a považoval je za ďáblův klam. Archanděl jej nakonec přece jen přesvědčil - podle legendy tím, že mu pouhým dotykem prorazil otvor do lebky - a biskup nařídil na Mont Tombe vystavět novou svatyni. \n\nTak začíná historie Mont-Saint-Michel."
 building_mont_st_michel_02: "Románské opatství Mont-Saint-Michel"
 building_mont_st_michel_02_desc: "Nový opatský chrám stojí na nejvyšším bodě ostrova jako svědectví o moci Boha nade vším na nebi i na zemi a zároveň o lidském důvtipu. \n\nPod opatstvím pomalu vyrůstá malé městečko poutníků a rybářů."
 building_mont_st_michel_03: "La Merveille"
 building_mont_st_michel_03_desc: "Opatství bylo rozšířeno o soustavu křížových chodeb, kaplanství, vinný sklep, Rytířský sál a množství obytných prostor, čímž vznikl gotický komplex, který lze označit jedině za div stavitelského umění. \n\nOpatství získalo nové mohutné opevnění a osada pod ním se proměnila ve skutečné město, v němž žije množství poutníků i místních obyvatel."
 building_mont_st_michel_04: "Opevněný klášter Mont-Saint-Michel"
 building_mont_st_michel_04_desc: "Nedávné války jasně ukázaly, že i ostrov pokoje, jakým je Mont-Saint-Michel, může mít zásadní strategický význam. Skála proto byla důkladně opevněna mohutnými hradbami a baštami a pro posádku vzniklo několik nových obytných budov. \n\nPobřežní městečko je nyní rušným městem a téměř celý ostrov pokrývají domy."
 building_type_sanchi_stupa_01: "$building_sanchi_stupa_01$"
 building_type_sanchi_stupa_01_desc: "$building_sanchi_stupa_01_desc$"
 building_sanchi_stupa_01: "Velká stúpa v Sáňčí"
 building_sanchi_stupa_01_desc: "Velkou stúpu nechal ve 3. století př. n. l. vystavět maurjovský císař Ašóka poblíž místa, kde se oženil se svou manželkou Déví. Velkolepá stavba ukrývající Buddhovy relikvie patří k nejstarším svého druhu a proslula také svými bohatě vyřezávanými branami zvanými tórany."
 building_type_boudhanath_01: "$building_boudhanath_01$"
 building_type_boudhanath_01_desc: "$building_boudhanath_01_desc$"
 building_boudhanath_01: "Boudhanáth"
 building_boudhanath_01_desc: "Stúpa Boudhanáth v Káthmándú, známá také jako Džarung Khašór a Khása čaitja, patří k největším buddhistickým stúpám a možná stála u zrodu toho, co se později stalo tibetskou větví buddhismu. Její obrovská kupole a mandala ukrývají ostatky několika buddhů a nesčetné posvátné relikvie nejrůznějších tvarů a podob. \n\nDíky své poloze na starobylé obchodní cestě mezi Nepálem a Tibetem se zde často zastavují pocestní a obchodníci, aby si odpočinuli a pomodlili se."
 building_type_yazd_mosque_01: "$building_yazd_mosque_01$"
 building_type_yazd_mosque_01_desc: "$building_yazd_mosque_01_desc$"
 building_yazd_mosque_01: "Velká mešita v Jazdu"
 building_yazd_mosque_01_desc: "Tato proslulá stavba, vybudovaná na místě chrámu ohně ze 4. století, uchvacuje pocestné i poutníky svými velkolepými ívány, obkládanou kupolí a majestátním vstupním portálem, nad nímž se tyčí dvojice závratně vysokých minaretů."
 building_type_qutb_minar_01: "$building_qutb_minar_01$"
 building_type_qutb_minar_01_desc: "$building_qutb_minar_01_desc$"
 building_qutb_minar_01: "Železný sloup v Dillí"
 building_qutb_minar_01_desc: "Mohutný Železný sloup v Dillí je symbolem slávy krále Čandragupty II., třebaže do něj pozdější vládci vyryli i svá vlastní jména. Přestože stojí již velmi dlouho, nenese jedinou stopu rzi - svědectví o mistrovství indických kovářů!"
 building_qutb_minar_02: "Kutub mínár"
 building_qutb_minar_02_desc: "Kuvvat-ul-islám, velkolepou mešitu obklopující staré místo se Železným sloupem v Dillí, korunuje skutečně obrovský minaret zvaný Kutub mínár. \n\nVelkolepý pomník moci dillíských vládců."
 building_qutb_minar_03: "Rozšířená mešita Kuvvat-ul-islám"
 building_qutb_minar_03_desc: "Komplex kolem Kutub mínáru byl rozšířen o několik dalších nádvoří, bran a mauzoleí a dosáhl tak téměř legendárních rozměrů."
 building_qutb_minar_04: "Aláí mínár"
 building_qutb_minar_04_desc: "Ke komplexu přibyl druhý minaret, navržený podle vzoru Kutub mínáru, avšak s dvojnásobnými rozměry. Tento kolos tyčící se nad Dillí představuje vrchol indoislámské architektury."
