l_polish:
 building_type_holy_site_st_peters_basilica_01: "$holy_site_st_peters_basilica_01$" # todo: CHANGED (predtym: $building_holy_site_st_peters_basilica_01$)
 building_type_holy_site_st_peters_basilica_01_desc: "$holy_site_st_peters_basilica_01_desc$" # todo: CHANGED (predtym: $building_holy_site_st_peters_basilica_01_desc$)
 holy_site_st_peters_basilica_01: "Bazilika svatého Petra" # todo: NEW TRANSLATION
 holy_site_st_peters_basilica_01_desc: "Bazilika svatého Petra, postavená na místě hrobu svatého Petra na Vatikánském pahorku na příkaz císaře Konstantina I. po jeho obrácení ke křesťanství, slouží jako centrum západního křesťanstva. \n\nTento kostel tradičně slouží jako sídlo římskokatolického papeže a během staletí se rozrostl v rozsáhlý komplex chráněný Lví hradbou." # todo: NEW TRANSLATION
 building_type_mont_st_michel_01: "Mont-Saint-Michel"
 building_type_mont_st_michel_01_desc: "$mont_st_michel_01_desc$" # todo: CHANGED (predtym: $building_mont_st_michel_01_desc$)
 mont_st_michel_01: "Oratoř svatého Auberta zasvěcená svatému Michaelovi" # todo: NEW TRANSLATION
 mont_st_michel_01_desc: "Roku 708 spatřil svatý Aubert, biskup z Avranches, ve snu archanděla Michaela, který mu přikázal postavit oratoř na nedalekém přílivovém ostrově. Aubert zpočátku toto vidění ignoroval a přičítal ho ďáblovu úskoku. Nakonec se archandělovi podařilo ho přesvědčit – podle legendy tak, že se ho dotkl a prorazil mu otvor v lebce. Biskup pak nařídil postavit na Mont Tombe novou svatyni. \n\nTak začíná historie Mont-Saint-Michel." # todo: NEW TRANSLATION
 mont_st_michel_02: "Románské opatství Mont-Saint-Michel" # todo: NEW TRANSLATION
 mont_st_michel_02_desc: "Nový klášterní kostel stojí na nejvyšším místě ostrova jako svědectví o Boží moci, která převyšuje vše na nebi i na zemi, i o lidské vynalézavosti. \n\nPod opatstvím pomalu vyrůstá malé městečko poutníků a rybářů." # todo: NEW TRANSLATION
 mont_st_michel_03: "Merveille" # todo: NEW TRANSLATION
 mont_st_michel_03_desc: "Opatství bylo rozšířeno o řadu křížových chodeb, kaplanství, vinný sklep, Rytířský sál a četná ubytování. Vznikl tak gotický komplex, který lze popsat jedině jako zázrak stavitelského umění. \n\nOpatství nyní chrání nové mohutné opevnění a osada pod ním se proměnila v opravdové město, kde žije mnoho poutníků i místních obyvatel." # todo: NEW TRANSLATION
 mont_st_michel_04: "Opevněný klášter Mont-Saint-Michel" # todo: NEW TRANSLATION
 mont_st_michel_04_desc: "Nedávné války ukázaly, že i ostrov míru, jako je Mont-Saint-Michel, může být strategicky důležitým místem. Skála proto byla důkladně opevněna mohutnými hradbami a baštami a pro posádku vzniklo několik nových ubytoven. \n\nPobřežní město je nyní rušným sídlem a domy pokrývají téměř celý ostrov." # todo: NEW TRANSLATION
 building_type_sanchi_stupa_01: "$sanchi_stupa_01$" # todo: CHANGED (predtym: $building_sanchi_stupa_01$)
 building_type_sanchi_stupa_01_desc: "$sanchi_stupa_01_desc$" # todo: CHANGED (predtym: $building_sanchi_stupa_01_desc$)
 sanchi_stupa_01: "Velká stúpa v Sánčí" # todo: NEW TRANSLATION
 sanchi_stupa_01_desc: "Velkou stúpu nechal ve třetím století př. n. l. postavit maurjovský císař Ašóka poblíž místa, kde se oženil se svou manželkou Déví. Monumentální stavba uchovávající Buddhovy relikvie je jednou z nejstarších staveb svého druhu a proslula také bohatě zdobenými branami torana." # todo: NEW TRANSLATION
 building_type_boudhanath_01: "$boudhanath_01$" # todo: CHANGED (predtym: $building_boudhanath_01$)
 building_type_boudhanath_01_desc: "$boudhanath_01_desc$" # todo: CHANGED (predtym: $building_boudhanath_01_desc$)
 boudhanath_01: "Boudhanáth" # todo: NEW TRANSLATION
 boudhanath_01_desc: "Boudhanáthská stúpa v Káthmándú, známá také jako Jarung Kashor a Khāsa Chaitya, je jednou z největších buddhistických stúp a možná i rodištěm tibetské větve buddhismu. Její mohutná kupole a mandala ukrývají ostatky několika buddhů a nespočet posvátných relikvií nejrůznějších tvarů a podob. \n\nDíky své poloze na staré obchodní cestě mezi Nepálem a Tibetem se zde cestovatelé a kupci často zastavují, aby si odpočinuli a pomodlili se." # todo: NEW TRANSLATION
 building_type_yazd_mosque_01: "$yazd_mosque_01$" # todo: CHANGED (predtym: $building_yazd_mosque_01$)
 building_type_yazd_mosque_01_desc: "$yazd_mosque_01_desc$" # todo: CHANGED (predtym: $building_yazd_mosque_01_desc$)
 yazd_mosque_01: "Velká mešita v Jazdu" # todo: NEW TRANSLATION
 yazd_mosque_01_desc: "Tato honosná stavba, vybudovaná na místě ohňového chrámu ze čtvrtého století, uchvacuje cestovatele i poutníky svými velkými ívány, dlážděnou kopulí a majestátním vstupním portálem, nad nímž se tyčí dvojice minaretů." # todo: NEW TRANSLATION
 building_type_qutb_minar_01: "$qutb_minar_01$" # todo: CHANGED (predtym: $building_qutb_minar_01$)
 building_type_qutb_minar_01_desc: "$qutb_minar_01_desc$" # todo: CHANGED (predtym: $building_qutb_minar_01_desc$)
 qutb_minar_01: "Železný sloup v Dillí" # todo: NEW TRANSLATION
 qutb_minar_01_desc: "Mohutný železný sloup v Dillí je symbolem slávy krále Čandragupty II., ačkoli do něj svá jména vyryli i pozdější panovníci. Přestože zde stojí už dlouhá staletí, nenajdeme na něm ani stopu rzi – je to svědectví o umu indických kovářů!" # todo: NEW TRANSLATION
 qutb_minar_02: "Kutub Minár" # todo: NEW TRANSLATION
 qutb_minar_02_desc: "Velká mešita Kuvvat-ul-islám obklopuje někdejší místo železného sloupu v Dillí a korunuje ji skutečně obrovský minaret zvaný Kutub Minár. \n\nVelkolepý pomník moci dillíských panovníků." # todo: NEW TRANSLATION
 qutb_minar_03: "Rozšířená mešita Kuvvat-ul-islám" # todo: NEW TRANSLATION
 qutb_minar_03_desc: "Komplex kolem Kutub Mináru byl rozšířen o několik dalších nádvoří, bran a mauzoleí a dosáhl legendárních rozměrů." # todo: NEW TRANSLATION
 qutb_minar_04: "Aláí Minár" # todo: NEW TRANSLATION
 qutb_minar_04_desc: "Ke komplexu přibyl druhý minaret, navržený podle Kutub Mináru, ale dvakrát vyšší. Tento kolos, tyčící se nad Dillí, představuje vrchol indoislámské architektury." # todo: NEW TRANSLATION
