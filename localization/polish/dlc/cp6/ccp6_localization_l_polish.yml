l_polish:
 building_type_holy_site_st_peters_basilica_01: "$building_holy_site_st_peters_basilica_01$" # todo: NEW TRANSLATION
 building_type_holy_site_st_peters_basilica_01_desc: "$building_holy_site_st_peters_basilica_01_desc$" # todo: NEW TRANSLATION
 building_holy_site_st_peters_basilica_01: "Bazilika svatého Petra" # todo: NEW TRANSLATION
 building_holy_site_st_peters_basilica_01_desc: "Postavená na místě hrobu svatého Petra na Vatikánském pahorku na příkaz císaře Konstantina I. po jeho přijetí křesťanství, bazilika svatého Petra slouží jako centrum křesťanstva na Západě. \n\nTento chrám tradičně slouží jako sídlo papeže římskokatolické církve a v průběhu staletí vyrostl v rozlehlý komplex, chráněný Leoninským valem." # todo: NEW TRANSLATION
 building_type_mont_st_michel_01: "Mont-Saint-Michel" # todo: NEW TRANSLATION
 building_type_mont_st_michel_01_desc: "$building_mont_st_michel_01_desc$" # todo: NEW TRANSLATION
 building_mont_st_michel_01: "Oratoř sv. Auberta zasvěcená sv. Michaelovi" # todo: NEW TRANSLATION
 building_mont_st_michel_01_desc: "V roce 708 měl svatý Aubert, biskup z Avranches, sen, v němž se mu zjevil archanděl Michael a přikázal mu postavit oratoř na blízkém přílivovém ostrově. Aubert toto zjevení zpočátku ignoroval a přisuzoval ho ďáblově lestě. Archanděl ho nakonec přesvědčil – podle legendy mu prstem propíchl lebku – a biskup nařídil výstavbu nového svatostánku na Mont Tombe. \n\nTak začíná historie Mont-Saint-Michel." # todo: NEW TRANSLATION
 building_mont_st_michel_02: "Románské opatství Mont-Saint-Michel" # todo: NEW TRANSLATION
 building_mont_st_michel_02_desc: "Nový kostel opatství stojí na nejvyšším bodě ostrova jako důkaz Boží moci nad nebem i zemí a jako ukázka lidského umu. \n\nPod opatstvím se pomalu rozrůstá malé městečko poutníků a rybářů." # todo: NEW TRANSLATION
 building_mont_st_michel_03: "The Merveille" # todo: NEW TRANSLATION
 building_mont_st_michel_03_desc: "Opatství bylo rozšířeno o řadu klášterních chodeb, kaplancí, vinných sklepů, rytířských síní a mnoha ubytoven, čímž vznikl gotický komplex, jenž lze nazvat opravdovým divem inženýrství. \n\nOpatství získalo impozantní nová opevnění a osada pod ním se proměnila v opravdové město, kde bydlí mnoho poutníků i místních." # todo: NEW TRANSLATION
 building_mont_st_michel_04: "Opevněné opatství Mont-Saint-Michel" # todo: NEW TRANSLATION
 building_mont_st_michel_04_desc: "Nedávné války ukázaly, že i ostrov míru jako Mont-Saint-Michel může být strategicky důležitý. Skála byla proto důkladně opevněna těžkými zdmi a bastiony a pro posádku bylo zřízeno několik nových ubytovacích kapacit. \n\nPobřežní městečko se proměnilo v rušné město, téměř celý ostrov je nyní zastavěn domy." # todo: NEW TRANSLATION
 building_type_sanchi_stupa_01: "$building_sanchi_stupa_01$" # todo: NEW TRANSLATION
 building_type_sanchi_stupa_01_desc: "$building_sanchi_stupa_01_desc$" # todo: NEW TRANSLATION
 building_sanchi_stupa_01: "Velká stúpa v Sanchi" # todo: NEW TRANSLATION
 building_sanchi_stupa_01_desc: "Velká stúpa byla postavena maurijským císařem Ašókou ve 3. století př. n. l. poblíž místa, kde se oženil se svou manželkou Devi. Tento velkolepý objekt uchovávající pozůstatky Buddhy je jedním z nejstarších svého druhu a proslul také propracovaně vyřezávanými toranami." # todo: NEW TRANSLATION
 building_type_boudhanath_01: "$building_boudhanath_01$" # todo: NEW TRANSLATION
 building_type_boudhanath_01_desc: "$building_boudhanath_01_desc$" # todo: NEW TRANSLATION
 building_boudhanath_01: "Boudhanath" # todo: NEW TRANSLATION
 building_boudhanath_01_desc: "Boudha stúpa v Káthmándú, známá také jako Jarung Kashor a Khāsa Chaitya, patří mezi největší stúpy v buddhismu a mohla být kolébkou toho, co se později stalo tibetskou větví buddhismu. Její obrovská kopule a mandala uchovávají pozůstatky mnoha buddhů a nespočet posvátných relikvií různých podob a tvarů. \n\nDíky své poloze na starověké obchodní stezce mezi Nepálem a Tibetem sem často zavítají cestovatelé a obchodníci, aby si odpočinuli a pomodlili se." # todo: NEW TRANSLATION
 building_type_yazd_mosque_01: "$building_yazd_mosque_01$" # todo: NEW TRANSLATION
 building_type_yazd_mosque_01_desc: "$building_yazd_mosque_01_desc$" # todo: NEW TRANSLATION
 building_yazd_mosque_01: "Velká mešita v Yazdu" # todo: NEW TRANSLATION
 building_yazd_mosque_01_desc: "Postavená na místě ohnivého chrámu ze čtvrtého století, tato významná budova ohromuje poutníky i cestovatele svými rozsáhlými iwany, kachlovou kopulí a majestátním vstupním portálem se dvojicí vysokých minaretů." # todo: NEW TRANSLATION
 building_type_qutb_minar_01: "$building_qutb_minar_01$" # todo: NEW TRANSLATION
 building_type_qutb_minar_01_desc: "$building_qutb_minar_01_desc$" # todo: NEW TRANSLATION
 building_qutb_minar_01: "Železný sloup v Dillí" # todo: NEW TRANSLATION
 building_qutb_minar_01_desc: "Mocný Železný sloup v Dillí stojí jako symbol slávy krále Čandragupty II., a pozdější vládcové do něj také vryli svá jména. Přestože stojí již dlouhou dobu, není na něm žádný náznak rzi – důkaz dovednosti indických kovářů!" # todo: NEW TRANSLATION
 building_qutb_minar_02: "Qutb Minar" # todo: NEW TRANSLATION
 building_qutb_minar_02_desc: "Quwwat-ul-Islam, velká mešita obklopující staré místo Železného sloupu v Dillí, korunovaná skutečně ohromujícím minaretem zvaným Qutb Minar. \n\nVelkolepý památník moci vládců Dillí." # todo: NEW TRANSLATION
 building_qutb_minar_03: "Rozšířená mešita Quwwat-ul-Islam" # todo: NEW TRANSLATION
 building_qutb_minar_03_desc: "Areál kolem Qutb Minaru byl rozšířen o další nádvoří, vstupní brány a mauzolea, dosahující legendárních rozměrů." # todo: NEW TRANSLATION
 building_qutb_minar_04: "Alai Minar" # todo: NEW TRANSLATION
 building_qutb_minar_04_desc: "K areálu byl přidán druhý minaret navržený podle vzoru Qutb Minaru, avšak dvojnásobné velikosti. Tento kolos tyčící se nad Dillí je vrcholem indo-islámské architektury." # todo: NEW TRANSLATION
