l_polish:
 building_type_goguryeo_tomb_01: "$building_goguryeo_tomb_01$"
 building_type_goguryeo_tomb_01_desc: "$building_goguryeo_tomb_01_desc$"
 building_goguryeo_tomb_01: "Hrobka krále z Kogurja"
 building_goguryeo_tomb_01_desc: "Tato velkolepá obdélníková hrobka z opracovaného kamene údajně patří dávnému králi Kogurja, jehož jméno však již upadlo v zapomnění. Chodby vedoucí k hrobce zdobí pestrobarevné fresky a na vrcholu pyramidy stojí malý dřevěný pavilon uctívající pohřbeného."
 building_type_buddha_kamakura_01: "$building_buddha_kamakura_01$"
 building_type_buddha_kamakura_01_desc: "$building_buddha_kamakura_01_desc$"
 building_buddha_kamakura_01: "Velký Buddha z Kamakury"
 building_buddha_kamakura_01_desc: "Kamakurský #italic daibucu#! je úctyhodná bronzová socha buddhy Amitábhy, vážící několik tun a zdobená pozlacenými detaily. Je ukryta ve velké síni inspirované chrámy jihozápadu a obklopuje ji dvaatřicet lotosových okvětních lístků."
 building_type_pyramid_lingapura_01: "$building_pyramid_lingapura_01$"
 building_type_pyramid_lingapura_01_desc: "$building_pyramid_lingapura_01_desc$"
 building_pyramid_lingapura_01: "Pyramida v Lingapuře"
 building_pyramid_lingapura_01_desc: "Tato mohutná stupňovitá pyramida vystupuje z džungle jako posvátná hora a na každé z jejích sedmi teras stojí stále honosnější svatyně a oltáře. Stavbu korunuje horní svatyně, která ve svém nitru střeží posvátný Šivův #italic lingam#!, ústřední bod důmyslného osového uspořádání celého náboženského komplexu."
 building_type_maijishan_grottoes_01: "$building_maijishan_grottoes_01$"
 building_type_maijishan_grottoes_01_desc: "$building_maijishan_grottoes_01_desc$"
 building_maijishan_grottoes_01: "Jeskyně Maj-ťi-šan"
 building_maijishan_grottoes_01_desc: "Hora Maj-ťi-šan je odedávna místem uctívání a do jejích jižních útesů, podle geomantie obzvláště příznivých, byly v načervenalé skále vytesány stovky svatyní se sochami a pestrobarevnými freskami poklidných buddhů a bódhisattvů. Mnohé z nich nechaly vybudovat rodiny z nedalekého města, pro něž je toto místo příležitostným cílem poutí a meditativního rozjímání."
 building_type_three_pagodas_dali_01: "$building_three_pagodas_dali_01$"
 building_type_three_pagodas_dali_01_desc: "$building_three_pagodas_dali_01_desc$"
 building_three_pagodas_dali_01: "Tři pagody v Ta-li"
 building_three_pagodas_dali_01_desc: "Z rozlehlého chrámového komplexu vládnoucího rodu města se tyčí tři vysoké pagody s cihlovými stěnami a kamennými podstavci. Tvoří vrcholy rovnoramenného trojúhelníku, vyznačují posvátnou geometrii tohoto místa a rámují okolní hory a jezero."
 building_type_iron_lion_cangzhou_01: "$building_iron_lion_cangzhou_01$"
 building_type_iron_lion_cangzhou_01_desc: "$building_iron_lion_cangzhou_01_desc$"
 building_iron_lion_cangzhou_01: "Železný lev z Cchang-čou"
 building_iron_lion_cangzhou_01_desc: "Monumentální lev je největší litinovou sochou v celé Číně a na svém mohutném hřbetě nese bódhisattvu, který pokojně sedí na lotosovém podstavci a je bohatě zdoben pozlacenými detaily. Jelikož stojí poblíž pláně sužované záplavami, místní obyvatelé jej začali považovat za strážce před stoupající vodou."
 building_type_dengfeng_observatory_01: "$building_dengfeng_observatory_01$"
 building_type_dengfeng_observatory_01_desc: "$building_dengfeng_observatory_01_desc$"
 building_dengfeng_observatory_01: "Observatoř Kao-čcheng"
 building_dengfeng_observatory_01_desc: "Toto místo je již po staletí vyhledáváno k astronomickým pozorováním díky svým geomantickým vlastnostem a symbolické poloze v geografickém středu Číny. Současná stavba složitého lichoběžníkového tvaru slouží jako obrovské sluneční hodiny, jejichž vysoké centrální měřidlo vrhá stín do žlabu protínajícího plošinu a zaznamenává tak pohyb slunce."
 building_type_muara_takus_01: "$building_muara_takus_01$"
 building_type_muara_takus_01_desc: "$building_muara_takus_01_desc$"
 building_muara_takus_01: "Čandi v Muara Takus"
 building_muara_takus_01_desc: "Chrámový komplex tvoří množství staveb, všechny vybudované z cihel a zdobené pískovcovými prvky. V jeho středu se tyčí velké stúpy #italic Mahligai#! a #italic Tuo#!, první vysoká a štíhlá, druhá mohutná jako hora a čnící nad menšími svatyněmi a terasami v okolí."
 building_type_stone_pagoda_01: "$building_stone_pagoda_01$"
 building_type_stone_pagoda_01_desc: "$building_stone_pagoda_01_desc$"
 building_stone_pagoda_01: "Kamenná pagoda Miruksa"
 building_stone_pagoda_01_desc: "Devítipatrová pagoda stojí na širokém kamenném podstavci a její světlé zdivo září pod prosluněnou oblohou. Je první z kamenných pagod v Koreji a díky svému tvaru a vyváženým proporcím se stala vzorem pro stavitele chrámů po celém poloostrově."
 building_type_thuriang_kilns_01: "$building_thuriang_kilns_01$"
 building_type_thuriang_kilns_01_desc: "$building_thuriang_kilns_01_desc$"
 building_thuriang_kilns_01: "Pece Thuriang"
 building_thuriang_kilns_01_desc: "Na tomto místě se nachází přes dvě stě velkých pecí, které tvoří největší centrum výroby celadonu v celém kraji. Zdejší keramika je známá svou hrubou, tvrdě vypalovanou strukturou a charakteristickou žlutozelenou glazurou a obchoduje se s ní na tržištích po celé jihovýchodní Asii."
 building_type_yuelu_academy_01: "$building_yuelu_academy_01$"
 building_type_yuelu_academy_01_desc: "$building_yuelu_academy_01_desc$"
 building_yuelu_academy_01: "Akademie Jüe-lu"
 building_yuelu_academy_01_desc: "Jüe-lu patří k nejprestižnějším vzdělávacím akademiím v Číně a již dlouho slouží jako centrum studia a zkoušek. Její uspořádání se soustředí kolem hlavního nádvoří, od něhož se v harmonické souměrnosti rozbíhají vedlejší síně a pavilony, kde se celé generace učenců připravovaly na úřednickou dráhu."
 building_type_chocolate_hills_01: "$building_chocolate_hills_01$"
 building_type_chocolate_hills_01_desc: "$building_chocolate_hills_01_desc$"
 building_chocolate_hills_01: "Rezavé svahy"
 building_chocolate_hills_01_desc: "Tento geologický útvar tvoří nesčetné oblé kuželovité kopce, které se v pravidelných rozestupech táhnou krajinou. Pokrývá je vrstva trávy, která během období sucha získává sytě hnědé a oranžové odstíny a propůjčuje krajině nezvyklé podzimní zbarvení."
 building_type_fanfang_guangzhou_01: "$building_fanfang_guangzhou_01$"
 building_type_fanfang_guangzhou_01_desc: "$building_fanfang_guangzhou_01_desc$"
 building_fanfang_guangzhou_01: "Fanfang v Kantonu"
 building_fanfang_guangzhou_01_desc: "#italic Fanfang#! je významná komunita zahraničních obchodníků, především muslimských Arabů a Peršanů, kteří sem připluli po námořních obchodních trasách. Získala vlastní čtvrť na západ od města se svými vlastními úředníky a zvyklostmi. V jejím středu stojí mešita s rudými zdmi, korunovaná vysokým minaretem a majákem, který navádí lodě i duše do bezpečí přístavu."
 building_type_wilwatikta_palace_01: "$building_wilwatikta_palace_01$"
 building_type_wilwatikta_palace_01_desc: "$building_wilwatikta_palace_01_desc$"
 building_wilwatikta_palace_01: "Palác Wilwatikta"
 building_wilwatikta_palace_01_desc: "Wilwatikta je rozlehlý palácový komplex pavilonů, síní, chrámů a nádvoří, tak rozsáhlý, že připomíná samostatné město. Areál obklopují obdélné cihlové hradby a vstup na obřadní třídu vyznačuje řada vysokých bran #italic paduraksa#!."
 building_type_ha_long_bay_01: "$building_ha_long_bay_01$"
 building_type_ha_long_bay_01_desc: "$building_ha_long_bay_01_desc$"
 building_ha_long_bay_01: "Zátoka Ha Long"
 building_ha_long_bay_01_desc: "Z klidných smaragdových vod zálivu vystupuje úchvatná krajina krasových a vápencových ostrůvků, v jejichž stínu se místní rybáři nechávají unášet proudem při hledání úlovku."
 building_type_my_son_sanctuary_01: "$building_my_son_sanctuary_01$"
 building_type_my_son_sanctuary_01_desc: "$building_my_son_sanctuary_01_desc$"
 building_my_son_sanctuary_01: "Svatyně My Son"
 building_my_son_sanctuary_01_desc: "Největší a nejvytříbenější z čamských chrámových komplexů tvoří řada ohrazených areálů rozesetých nedaleko od sebe v zalesněné krajině, z nichž každý má vlastní brány, svatyně a stúpy. Všechny stavby jsou z červených cihel, uspořádané do geometrických obrazců a zdobené pískovcovými překlady."
 building_type_gunung_api_01: "$building_gunung_api_01$"
 building_type_gunung_api_01_desc: "$building_gunung_api_01_desc$"
 building_gunung_api_01: "Gunung Api"
 building_gunung_api_01_desc: "Tato hora vystupující z divoké džungle je pro místní obyvatele posvátná. Její svahy zahalené vlhkostí a mlhou pokrývají nápadné vápencové věže a hluboké jeskyně, které voda vyhloubila během nesčetných věků."
 building_type_suwalesi_megaliths_01: "$building_suwalesi_megaliths_01$"
 building_type_suwalesi_megaliths_01_desc: "$building_suwalesi_megaliths_01_desc$"
 building_suwalesi_megaliths_01: "Megalithy Sulawesi"
 building_suwalesi_megaliths_01_desc: "V údolích středního Sulawesi jsou rozesety četné megalitické postavy a modly, které místní obyvatelé vztyčili pro obřady a k uctění duchů. Tyto podobizny, známé jako #italic arca#!, jsou vytesány s minimalistickou přesností a jejich tvary vykreslují jemné a elegantní linie."
 building_type_izumo_taisha_01: "$building_izumo_taisha_01$"
 building_type_izumo_taisha_01_desc: "$building_izumo_taisha_01_desc$"
 building_izumo_taisha_01: "Kizuki taiša"
 building_izumo_taisha_01_desc: "Tato velká šintoistická svatyně - #italic taiša#! - byla vybudována poblíž pobřeží a obrací se k moři. Stojí na soustavě obrovských dřevěných pilířů a mohutných kmenů, které zvedají její síně vysoko nad zem, po níž kráčejí smrtelníci, až k nebi, kde přebývají bohové a duchové této země."
 building_type_confucius_temple_01: "$building_confucius_temple_01$"
 building_type_confucius_temple_01_desc: "$building_confucius_temple_01_desc$"
 building_confucius_temple_01: "Konfuciův chrám"
 building_confucius_temple_01_desc: "Tento nejstarší a nejvlivnější ze všech konfuciánských chrámů je rozsáhlým komplexem síní a nádvoří, jehož harmonické geometrické uspořádání a vytříbené detaily se staly vzorem a inspirací pro stavitele chrámů po celé Číně i za jejími hranicemi. Nedaleko se rozkládá tichý les, v němž spočívají Konfucius a jeho potomci a který je významným poutním místem jeho stoupenců."
 building_type_citadel_linan_01: "$building_citadel_linan_01$"
 building_type_citadel_linan_01_desc: "$building_citadel_linan_01_desc$"
 building_citadel_linan_01: "Císařská citadela v Lin-anu"
 building_citadel_linan_01_desc: "Císařská citadela, vystavěná na severních svazích Fénixova vrchu, slouží jako sídlo dvora a jeho správy a ve svých rozlehlých síních a chodbách hostí nesčetné učence a úředníky. Přestože není tak rozsáhlá jako paláce severních hlavních měst, vytříbeností a elegancí svých terasovitých zahrad a pavilonů se jim více než vyrovná."
 building_type_temples_angkor_01: "$building_temples_angkor_01$"
 building_type_temples_angkor_01_desc: "$building_temples_angkor_01_desc$"
 building_temples_angkor_01: "Chrámy Angkoru"
 building_temples_angkor_01_desc: "V prosperujícím městě Indry se tyčí nesčetné pozlacené střechy a věžičky chrámů, jeden zdobenější než druhý vytesávanými reliéfy a sochami božstev a dévarádžů."
 building_temples_angkor_02: "Angkor Vat"
 building_temples_angkor_02_desc: "Angkor Vat je mohutný chrámový komplex zasvěcený bohu Višnuovi. Jeho podoba má představovat horu Méru, sídlo bohů v hinduistické mytologii. Komplex obklopuje působivý vodní příkop a nachází se v něm několik chrámů s ochozy, překypujících náboženským uměním, sochami a reliéfy."
