l_polish:
 building_type_goguryeo_tomb_01: "$goguryeo_tomb_01$" # todo: CHANGED (predtym: $building_goguryeo_tomb_01$)
 building_type_goguryeo_tomb_01_desc: "$goguryeo_tomb_01_desc$" # todo: CHANGED (predtym: $building_goguryeo_tomb_01_desc$)
 goguryeo_tomb_01: "Hrobka krále království Kogurjo" # todo: NEW TRANSLATION
 goguryeo_tomb_01_desc: "Tato velká obdélníková hrobka z opracovaného kamene údajně patří starověkému králi království Kogurjo, jehož jméno však upadlo v zapomnění. Chodby vedoucí k hrobce zdobí pestré fresky a na vrcholu pyramidy stojí malý dřevěný pavilon, který vzdává čest pohřbenému." # todo: NEW TRANSLATION
 building_type_buddha_kamakura_01: "$buddha_kamakura_01$" # todo: CHANGED (predtym: $building_buddha_kamakura_01$)
 building_type_buddha_kamakura_01_desc: "$buddha_kamakura_01_desc$" # todo: CHANGED (predtym: $building_buddha_kamakura_01_desc$)
 buddha_kamakura_01: "Velký Buddha z Kamakury" # todo: NEW TRANSLATION
 buddha_kamakura_01_desc: "#italic Daibutsu#! z Kamakury je ctihodná bronzová socha Buddhy Amitábhy, vážící několik tun a zdobená pozlacenými detaily. Obklopuje ji velká síň inspirovaná chrámy jihozápadu a třicet dva okvětních lístků lotosu." # todo: NEW TRANSLATION
 building_type_pyramid_lingapura_01: "$pyramid_lingapura_01$" # todo: CHANGED (predtym: $building_pyramid_lingapura_01$)
 building_type_pyramid_lingapura_01_desc: "$pyramid_lingapura_01_desc$" # todo: CHANGED (predtym: $building_pyramid_lingapura_01_desc$)
 pyramid_lingapura_01: "Pyramida v Lingapuře" # todo: NEW TRANSLATION
 pyramid_lingapura_01_desc: "Tato velká stupňovitá pyramida se tyčí z džungle jako posvátná hora. Na každé ze sedmi teras se nacházejí svatyně a oltáře, které jsou s každou další úrovní zdobnější. Stavbu korunuje horní svatyně, jež uvnitř střeží posvátný Šivův #italic lingam#!, středobod důmyslného náboženského návrhu s osovou symetrií." # todo: NEW TRANSLATION
 building_type_maijishan_grottoes_01: "$maijishan_grottoes_01$" # todo: CHANGED (predtym: $building_maijishan_grottoes_01$)
 building_type_maijishan_grottoes_01_desc: "$maijishan_grottoes_01_desc$" # todo: CHANGED (predtym: $building_maijishan_grottoes_01_desc$)
 maijishan_grottoes_01: "Jeskyně Maijishan" # todo: NEW TRANSLATION
 maijishan_grottoes_01_desc: "Hora Maijishan je již dlouho místem úcty. Do jejích jižních útesů, považovaných z geomantického hlediska za příznivé, byly ve načervenalém kameni vytesány stovky svatyní se sochami a pestrými freskami klidných Buddhů a bódhisattvů. Mnohé z nich nechaly zbudovat městské rodiny z okolí, pro něž je toto místo příležitostným cílem poutí i rozjímavé meditace." # todo: NEW TRANSLATION
 building_type_three_pagodas_dali_01: "$three_pagodas_dali_01$" # todo: CHANGED (predtym: $building_three_pagodas_dali_01$)
 building_type_three_pagodas_dali_01_desc: "$three_pagodas_dali_01_desc$" # todo: CHANGED (predtym: $building_three_pagodas_dali_01_desc$)
 three_pagodas_dali_01: "Tři pagody v Dali" # todo: NEW TRANSLATION
 three_pagodas_dali_01_desc: "Z rozlehlého chrámového komplexu vládnoucí rodiny města se tyčí tři vysoké pagody s cihlovými zdmi a kamennými podstavci. Stojí ve vrcholech rovnoramenného trojúhelníku, který vyznačuje posvátnou geometrii místa a rámuje okolní hory i jezero." # todo: NEW TRANSLATION
 building_type_iron_lion_cangzhou_01: "$iron_lion_cangzhou_01$" # todo: CHANGED (predtym: $building_iron_lion_cangzhou_01$)
 building_type_iron_lion_cangzhou_01_desc: "$iron_lion_cangzhou_01_desc$" # todo: CHANGED (predtym: $building_iron_lion_cangzhou_01_desc$)
 iron_lion_cangzhou_01: "Železný lev z Cchang-čou" # todo: NEW TRANSLATION
 iron_lion_cangzhou_01_desc: "Tento monumentální lev je největší litinovou sochou v celé Číně. Na svém silném hřbetě nese bódhisattvu, který klidně sedí na lotosovém podstavci a je bohatě zdoben pozlacenými detaily. Socha stojí poblíž záplavové nížiny a místní obyvatelé ji začali považovat za strážce, který je chrání před stoupajícími vodami." # todo: NEW TRANSLATION
 building_type_dengfeng_observatory_01: "$dengfeng_observatory_01$" # todo: CHANGED (predtym: $building_dengfeng_observatory_01$)
 building_type_dengfeng_observatory_01_desc: "$dengfeng_observatory_01_desc$" # todo: CHANGED (predtym: $building_dengfeng_observatory_01_desc$)
 dengfeng_observatory_01: "Gaočchengská observatoř" # todo: NEW TRANSLATION
 dengfeng_observatory_01_desc: "Díky geomantickým kvalitám a symbolické poloze v geografickém středu Číny je toto místo již po staletí oblíbené pro astronomická pozorování. Současná stavba složitého lichoběžníkového tvaru slouží jako obrovské sluneční hodiny: vysoké centrální ukazovátko vrhá stín do příkopu rozdělujícího plošinu a označuje pohyb slunce." # todo: NEW TRANSLATION
 building_type_muara_takus_01: "$muara_takus_01$" # todo: CHANGED (predtym: $building_muara_takus_01$)
 building_type_muara_takus_01_desc: "$muara_takus_01_desc$" # todo: CHANGED (predtym: $building_muara_takus_01_desc$)
 muara_takus_01: "Candi Muara Takus" # todo: NEW TRANSLATION
 muara_takus_01_desc: "Chrámový komplex tvoří mnoho staveb z cihel, zdobených pískovcovými detaily. Uprostřed se tyčí velké stúpy #italic Mahligai#! a #italic Tuo#!. První je vysoká a štíhlá, druhá rozložitá jako hora a převyšuje okolní menší svatyně a terasy." # todo: NEW TRANSLATION
 building_type_stone_pagoda_01: "$stone_pagoda_01$" # todo: CHANGED (predtym: $building_stone_pagoda_01$)
 building_type_stone_pagoda_01_desc: "$stone_pagoda_01_desc$" # todo: CHANGED (predtym: $building_stone_pagoda_01_desc$)
 stone_pagoda_01: "Kamenná pagoda Mireuksa" # todo: NEW TRANSLATION
 stone_pagoda_01_desc: "Devítipatrová pagoda stojí na širokém kamenném podstavci a její bledé zdivo září pod sluncem zalitou oblohou. Je první kamennou pagodou v Koreji a její podoba i vyvážené proporce se staly vzorem pro stavitele chrámů po celém poloostrově." # todo: NEW TRANSLATION
 building_type_thuriang_kilns_01: "$thuriang_kilns_01$" # todo: CHANGED (predtym: $building_thuriang_kilns_01$)
 building_type_thuriang_kilns_01_desc: "$thuriang_kilns_01_desc$" # todo: CHANGED (predtym: $building_thuriang_kilns_01_desc$)
 thuriang_kilns_01: "Thuriangské pece" # todo: NEW TRANSLATION
 thuriang_kilns_01_desc: "Areál pokrývá více než dvě stě velkých pecí a je největším střediskem výroby seladonu v oblasti. Keramika vypalovaná zde je známá svou hrubou, tvrdě vypálenou strukturou a osobitou žlutozelenou glazurou. Obchoduje se s ní na trzích po celé jihovýchodní Asii." # todo: NEW TRANSLATION
 building_type_yuelu_academy_01: "$yuelu_academy_01$" # todo: CHANGED (predtym: $building_yuelu_academy_01$)
 building_type_yuelu_academy_01_desc: "$yuelu_academy_01_desc$" # todo: CHANGED (predtym: $building_yuelu_academy_01_desc$)
 yuelu_academy_01: "Akademie Juelu" # todo: NEW TRANSLATION
 yuelu_academy_01_desc: "Juelu, jedna z nejprestižnějších vzdělávacích akademií v Číně, již dlouho slouží jako středisko studia a zkoušek. Její půdorys se soustředí kolem hlavního nádvoří, od nějž se v harmonické symetrii rozbíhají další síně a pavilony, kde se celé generace učenců připravovaly na službu ve státní správě." # todo: NEW TRANSLATION
 building_type_chocolate_hills_01: "$chocolate_hills_01$" # todo: CHANGED (predtym: $building_chocolate_hills_01$)
 building_type_chocolate_hills_01_desc: "$chocolate_hills_01_desc$" # todo: CHANGED (predtym: $building_chocolate_hills_01_desc$)
 chocolate_hills_01: "Rezavé svahy" # todo: NEW TRANSLATION
 chocolate_hills_01_desc: "Tento geologický útvar se vyznačuje velkým množstvím zaoblených kuželovitých kopců, které se pravidelně táhnou krajinou. Pokrývá je vrstva trávy, která v období sucha získává sytě hnědý a oranžový odstín a dodává krajině neobvyklý podzimní nádech." # todo: NEW TRANSLATION
 building_type_fanfang_guangzhou_01: "$fanfang_guangzhou_01$" # todo: CHANGED (predtym: $building_fanfang_guangzhou_01$)
 building_type_fanfang_guangzhou_01_desc: "$fanfang_guangzhou_01_desc$" # todo: CHANGED (predtym: $building_fanfang_guangzhou_01_desc$)
 fanfang_guangzhou_01: "Fang-fang v Kantonu" # todo: NEW TRANSLATION
 fanfang_guangzhou_01_desc: "#italic Fang-fang#! je významná komunita zahraničních obchodníků, především muslimských Arabů a Peršanů, kteří sem připluli po námořních obchodních trasách. Dostala vlastní čtvrť západně od města i vlastní úředníky a zvyklosti. Uprostřed stojí mešita s červenými zdmi, korunovaná vysokým minaretem a majákem, které ukazují lodím i duším cestu do bezpečného přístavu." # todo: NEW TRANSLATION
 building_type_wilwatikta_palace_01: "$wilwatikta_palace_01$" # todo: CHANGED (predtym: $building_wilwatikta_palace_01$)
 building_type_wilwatikta_palace_01_desc: "$wilwatikta_palace_01_desc$" # todo: CHANGED (predtym: $building_wilwatikta_palace_01_desc$)
 wilwatikta_palace_01: "Palác Wilwatikta" # todo: NEW TRANSLATION
 wilwatikta_palace_01_desc: "Rozlehlý palácový komplex pavilonů, síní, chrámů a nádvoří je natolik rozlehlý, že Wilwatikta připomíná samostatné město. Areál obklopují obdélníkové cihlové zdi a vstup na slavnostní avenue označuje řada vysokých bran #italic Paduraksa#!." # todo: NEW TRANSLATION
 building_type_ha_long_bay_01: "$ha_long_bay_01$" # todo: CHANGED (predtym: $building_ha_long_bay_01$)
 building_type_ha_long_bay_01_desc: "$ha_long_bay_01_desc$" # todo: CHANGED (predtym: $building_ha_long_bay_01_desc$)
 ha_long_bay_01: "Zátoka Ha Long" # todo: NEW TRANSLATION
 ha_long_bay_01_desc: "Tato úchvatná krajina krasových vápencových ostrůvků se zvedá z klidných smaragdových vod zálivu. Místní rybáři pod stínem skalních pilířů plují a hledají úlovek." # todo: NEW TRANSLATION
 building_type_my_son_sanctuary_01: "$my_son_sanctuary_01$" # todo: CHANGED (predtym: $building_my_son_sanctuary_01$)
 building_type_my_son_sanctuary_01_desc: "$my_son_sanctuary_01_desc$" # todo: CHANGED (predtym: $building_my_son_sanctuary_01_desc$)
 my_son_sanctuary_01: "Svatyně Mí Šon" # todo: NEW TRANSLATION
 my_son_sanctuary_01_desc: "Tato svatyně je největším a nejpropracovanějším z chrámových komplexů Čamů. Tvoří ji řada ohrad roztroušených nedaleko od sebe v zalesněné krajině, z nichž každá má vlastní brány, svatyně a stúpy. Všechny stavby jsou z červených cihel, uspořádané do geometrických vzorů a zdobené pískovcovými překlady." # todo: NEW TRANSLATION
 building_type_gunung_api_01: "$gunung_api_01$" # todo: CHANGED (predtym: $building_gunung_api_01$)
 building_type_gunung_api_01_desc: "$gunung_api_01_desc$" # todo: CHANGED (predtym: $building_gunung_api_01_desc$)
 gunung_api_01: "Gunung Api" # todo: NEW TRANSLATION
 gunung_api_01_desc: "Tato hora vystupující z divoké džungle je pro místní obyvatele posvátná. Její svahy pokrývají v dusném vlhku a mlze nápadné vápencové věže a hluboké jeskyně, které voda utvářela po nespočetná věky." # todo: NEW TRANSLATION
 building_type_suwalesi_megaliths_01: "$suwalesi_megaliths_01$" # todo: CHANGED (predtym: $building_suwalesi_megaliths_01$)
 building_type_suwalesi_megaliths_01_desc: "$suwalesi_megaliths_01_desc$" # todo: CHANGED (predtym: $building_suwalesi_megaliths_01_desc$)
 suwalesi_megaliths_01: "Sulaweské megality" # todo: NEW TRANSLATION
 suwalesi_megaliths_01_desc: "V údolích středního Sulawesi stojí roztroušené četné megalitické postavy a modly, které místní obyvatelé vztyčili k rituálům a uctění duchů. Tyto podobizny, známé jako #italic arcas#!, jsou vytesány s minimalistickou precizností a jejich obrysy lemují jemné a elegantní linie." # todo: NEW TRANSLATION
 building_type_izumo_taisha_01: "$izumo_taisha_01$" # todo: CHANGED (predtym: $building_izumo_taisha_01$)
 building_type_izumo_taisha_01_desc: "$izumo_taisha_01_desc$" # todo: CHANGED (predtym: $building_izumo_taisha_01_desc$)
 izumo_taisha_01: "Kizuki Taiša" # todo: NEW TRANSLATION
 izumo_taisha_01_desc: "Tato velká šintoistická svatyně, #italic taiša#!, byla postavena poblíž pobřeží čelem k moři. Stojí na obrovských dřevěných pilířích a mohutných kmenech, které její síně pozvedají vysoko nad zem, kde chodí smrtelníci, až k nebi, kde žijí bohové a duchové země." # todo: NEW TRANSLATION
 building_type_confucius_temple_01: "$confucius_temple_01$" # todo: CHANGED (predtym: $building_confucius_temple_01$)
 building_type_confucius_temple_01_desc: "$confucius_temple_01_desc$" # todo: CHANGED (predtym: $building_confucius_temple_01_desc$)
 confucius_temple_01: "Konfuciův chrám" # todo: NEW TRANSLATION
 confucius_temple_01_desc: "Tento rozlehlý komplex síní a nádvoří je nejstarším a nejvlivnějším ze všech konfuciánských chrámů. Díky harmonickému geometrickému uspořádání a propracovaným detailům slouží jako vzor i inspirace stavitelům chrámů po celé Číně i za jejími hranicemi. Nedaleko se rozkládá tichý les, v němž spočinuly hrobky Konfucia a jeho potomků. Pro věřící je důležitým poutním místem." # todo: NEW TRANSLATION
 building_type_citadel_linan_01: "$citadel_linan_01$" # todo: CHANGED (predtym: $building_citadel_linan_01$)
 building_type_citadel_linan_01_desc: "$citadel_linan_01_desc$" # todo: CHANGED (predtym: $building_citadel_linan_01_desc$)
 citadel_linan_01: "Císařská citadela Lin-an" # todo: NEW TRANSLATION
 citadel_linan_01_desc: "Císařská citadela, postavená na severních svazích Fénixí hory, slouží jako sídlo dvora a jeho správy. V jejích rozlehlých síních a chodbách působí nespočet učenců a úředníků. Ačkoli není tak rozlehlá jako paláce severních hlavních měst, terasovité zahrady a pavilony citadely jim svou vytříbeností a elegancí přinejmenším konkurují." # todo: NEW TRANSLATION
 building_type_temples_angkor_01: "$temples_angkor_01$" # todo: CHANGED (predtym: $building_temples_angkor_01$)
 building_type_temples_angkor_01_desc: "$temples_angkor_01_desc$" # todo: CHANGED (predtym: $building_temples_angkor_01_desc$)
 temples_angkor_01: "Chrámy Angkoru" # todo: NEW TRANSLATION
 temples_angkor_01_desc: "V prosperujícím městě Indra se tyčí nespočet chrámů se zlacenými střechami a věžemi. Každý je zdobenější než ten předchozí, s vytesanými reliéfy a sochami božstev a dévarádžů." # todo: NEW TRANSLATION
 temples_angkor_02: "Angkor Vat" # todo: NEW TRANSLATION
 temples_angkor_02_desc: "Angkor Vat je rozsáhlý chrámový komplex zasvěcený bohu Višnuovi. Jeho podoba představuje horu Méru, sídlo bohů v hinduistické mytologii. Komplex obklopuje mohutný příkop a tvoří jej několik chrámů s galeriemi, které překypují náboženským uměním, sochami a reliéfy." # todo: NEW TRANSLATION
