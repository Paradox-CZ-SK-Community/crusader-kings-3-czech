l_polish:
 building_type_goguryeo_tomb_01: "$building_goguryeo_tomb_01$" # todo: NEW TRANSLATION
 building_type_goguryeo_tomb_01_desc: "$building_goguryeo_tomb_01_desc$" # todo: NEW TRANSLATION
 building_goguryeo_tomb_01: "Hrobka krále Goguryeo" # todo: NEW TRANSLATION
 building_goguryeo_tomb_01_desc: "Tato velká obdélná hrobka z opracovaného kamene má patřit dávnému králi Goguryeo, jehož jméno se však ztratilo v paměti. Koridory vedoucí k hrobce jsou malované barevnými freskami a na vrcholu pyramidy stojí malý dřevěný pavilon na počest pohřbeného." # todo: NEW TRANSLATION
 building_type_buddha_kamakura_01: "$building_buddha_kamakura_01$" # todo: NEW TRANSLATION
 building_type_buddha_kamakura_01_desc: "$building_buddha_kamakura_01_desc$" # todo: NEW TRANSLATION
 building_buddha_kamakura_01: "Velký Buddha v Kamakuře" # todo: NEW TRANSLATION
 building_buddha_kamakura_01_desc: "Kamakurský #italic Daibutsu#! je vážená bronzová socha Buddhy Amitáby, vážící několik tun a zdobená pozlacenými detaily. Je ukrytá ve velkém sále inspirovaném chrámy jihozápadu a obklopena třiceti dvěma lotosovými okvětními lístky." # todo: NEW TRANSLATION
 building_type_pyramid_lingapura_01: "$building_pyramid_lingapura_01$" # todo: NEW TRANSLATION
 building_type_pyramid_lingapura_01_desc: "$building_pyramid_lingapura_01_desc$" # todo: NEW TRANSLATION
 building_pyramid_lingapura_01: "Pyramida Lingapury" # todo: NEW TRANSLATION
 building_pyramid_lingapura_01_desc: "Tato velká stupňovitá pyramida vystupuje z džungle jako posvátná hora; každá ze sedmi teras obsahuje stále bohatě zdobenější svatyně a oltáře. Horní svatyně korunuje stavbu a uvnitř chrání posvátný #italic lingam#! Šivy, střed složitého osového náboženského uspořádání." # todo: NEW TRANSLATION
 building_type_maijishan_grottoes_01: "$building_maijishan_grottoes_01$" # todo: NEW TRANSLATION
 building_type_maijishan_grottoes_01_desc: "$building_maijishan_grottoes_01_desc$" # todo: NEW TRANSLATION
 building_maijishan_grottoes_01: "Maijishanské jeskyně" # todo: NEW TRANSLATION
 building_maijishan_grottoes_01_desc: "Hora Maijishan byla dlouho místem uctívání, a podél jejích jižních útesů, považovaných za geomanticky příznivé, byly do načervenalé skály vytesány stovky svatyní, které uchovávají sochy a barevné fresky pokojných buddhů a bodhisattvů. Mnohé z nich nechaly postavit místní městské rodiny, pro které je místo příležitostným cílem poutí a meditativního rozjímání." # todo: NEW TRANSLATION
 building_type_three_pagodas_dali_01: "$building_three_pagodas_dali_01$" # todo: NEW TRANSLATION
 building_type_three_pagodas_dali_01_desc: "$building_three_pagodas_dali_01_desc$" # todo: NEW TRANSLATION
 building_three_pagodas_dali_01: "Tři pagody Dali" # todo: NEW TRANSLATION
 building_three_pagodas_dali_01_desc: "Z rozsáhlého chrámového komplexu vládnoucí rodiny města vystupují tři vysoké pagody z cihlových zdí a kamenných podstavců. Jsou to vrcholy rovnoramenného trojúhelníku, vyznačující posvátnou geometrii místa a rámující okolní hory a jezero." # todo: NEW TRANSLATION
 building_type_iron_lion_cangzhou_01: "$building_iron_lion_cangzhou_01$" # todo: NEW TRANSLATION
 building_type_iron_lion_cangzhou_01_desc: "$building_iron_lion_cangzhou_01_desc$" # todo: NEW TRANSLATION
 building_iron_lion_cangzhou_01: "Železný lev z Cangzhou" # todo: NEW TRANSLATION
 building_iron_lion_cangzhou_01_desc: "Monumentální lev je největší litinovou sochou v celé Číně, a na jeho pevných zádech spočívá bodhisattva jemně sedící na lotosovém podstavci a bohatě zdobený pozlacenými detaily. Umístěný poblíž nížiny ohrožené povodněmi se stal pro místní obyvatele strážcem proti stoupajícím vodám." # todo: NEW TRANSLATION
 building_type_dengfeng_observatory_01: "$building_dengfeng_observatory_01$" # todo: NEW TRANSLATION
 building_type_dengfeng_observatory_01_desc: "$building_dengfeng_observatory_01_desc$" # todo: NEW TRANSLATION
 building_dengfeng_observatory_01: "Observatoř Gaocheng" # todo: NEW TRANSLATION
 building_dengfeng_observatory_01_desc: "Toto místo bylo po staletí vyhledáváno pro astronomická pozorování díky svým geomantickým kvalitám a symbolické geografické středovosti v rámci Číny. Současná stavba, složitého lichoběžníkového tvaru, slouží jako obrovské sluneční hodiny, přičemž vysoký centrální sloup vrhá svůj stín do rýhy dělící platformu a značí průchod slunce." # todo: NEW TRANSLATION
 building_type_muara_takus_01: "$building_muara_takus_01$" # todo: NEW TRANSLATION
 building_type_muara_takus_01_desc: "$building_muara_takus_01_desc$" # todo: NEW TRANSLATION
 building_muara_takus_01: "Candi Muara Takus" # todo: NEW TRANSLATION
 building_muara_takus_01_desc: "Komplex chrámů tvoří mnoho staveb, všechny z cihel a zdobené pískovcovými detaily. V centru se tyčí velké stupy #italic Mahligai#! a #italic Tuo#!, první vysoká a štíhlá, druhá obrovská jako hora, převyšující menší svatyně a terasy kolem nich." # todo: NEW TRANSLATION
 building_type_stone_pagoda_01: "$building_stone_pagoda_01$" # todo: NEW TRANSLATION
 building_type_stone_pagoda_01_desc: "$building_stone_pagoda_01_desc$" # todo: NEW TRANSLATION
 building_stone_pagoda_01: "Kamenná pagoda Mireuksa" # todo: NEW TRANSLATION
 building_stone_pagoda_01_desc: "Devítipatrová pagoda stojící na širokém kamenném podstavci, její světlá kamenná konstrukce se leskne pod slunečnou oblohou. Je to první z kamenných pagod v Koreji a její tvar a vyvážené proporce se staly vzorem pro stavitele chrámů po celé poloostrově." # todo: NEW TRANSLATION
 building_type_thuriang_kilns_01: "$building_thuriang_kilns_01$" # todo: NEW TRANSLATION
 building_type_thuriang_kilns_01_desc: "$building_thuriang_kilns_01_desc$" # todo: NEW TRANSLATION
 building_thuriang_kilns_01: "Thuriangovy pece" # todo: NEW TRANSLATION
 building_thuriang_kilns_01_desc: "Na místě se nachází více než dvě stě velkých pecí, největší centrum výroby celadonu v regionu. Keramika pálená zde je známá svou hrubou, silně vypálenou strukturou a charakteristickou žlutozelenou glazurou a obchoduje se s ní napříč trhy jihovýchodní Asie." # todo: NEW TRANSLATION
 building_type_yuelu_academy_01: "$building_yuelu_academy_01$" # todo: NEW TRANSLATION
 building_type_yuelu_academy_01_desc: "$building_yuelu_academy_01_desc$" # todo: NEW TRANSLATION
 building_yuelu_academy_01: "Akademie Yuelu" # todo: NEW TRANSLATION
 building_yuelu_academy_01_desc: "Jedna z nejprestižnějších učebních akademií v Číně, Yuelu dlouho sloužila jako centrum studia a zkoušek. Její uspořádání je soustředěno kolem hlavního nádvoří, od kterého se v symetrickém uspořádání rozbíhají přilehlé sály a pavilony, kde generace učenců připravovaly na státní službu." # todo: NEW TRANSLATION
 building_type_chocolate_hills_01: "$building_chocolate_hills_01$" # todo: NEW TRANSLATION
 building_type_chocolate_hills_01_desc: "$building_chocolate_hills_01_desc$" # todo: NEW TRANSLATION
 building_chocolate_hills_01: "Rezavé svahy" # todo: NEW TRANSLATION
 building_chocolate_hills_01_desc: "Tato geologická formace se vyznačuje množstvím zaoblených kuželovitých kopců táhnoucích se jednotně krajinou. Jsou pokryty vrstvou trávy, která se během suchého období zbarví do výrazných odstínů hnědé a oranžové, čímž dává terénu neobvyklý podzimní nádech." # todo: NEW TRANSLATION
 building_type_fanfang_guangzhou_01: "$building_fanfang_guangzhou_01$" # todo: NEW TRANSLATION
 building_type_fanfang_guangzhou_01_desc: "$building_fanfang_guangzhou_01_desc$" # todo: NEW TRANSLATION
 building_fanfang_guangzhou_01: "Fanfang v Guangzhou" # todo: NEW TRANSLATION
 building_fanfang_guangzhou_01_desc: "#italic Fanfang#! je důležitou komunitou zahraničních obchodníků - převážně muslimských Arabů a Peršanů, kteří sem přišli po námořních obchodních trasách - které byl přidělen vlastní distrikt na západě města s vlastními úředníky a zvyky. V jeho středu stojí červeně zděná mešita korunovaná vysokým minaretem a majákem, které vedou lodě i duše do bezpečí přístavu." # todo: NEW TRANSLATION
 building_type_wilwatikta_palace_01: "$building_wilwatikta_palace_01$" # todo: NEW TRANSLATION
 building_type_wilwatikta_palace_01_desc: "$building_wilwatikta_palace_01_desc$" # todo: NEW TRANSLATION
 building_wilwatikta_palace_01: "Palác Wilwatikta" # todo: NEW TRANSLATION
 building_wilwatikta_palace_01_desc: "Rozsáhlý palácový komplex pavilonů, síní, chrámů a nádvoří, Wilwatikta je natolik rozlehlá, že připomíná město samo o sobě. Areál obklopují obdélné cihlové zdi a vchod do procesní aleje je vymezen sérií vysokých #italic Paduraksa#! bran." # todo: NEW TRANSLATION
 building_type_ha_long_bay_01: "$building_ha_long_bay_01$" # todo: NEW TRANSLATION
 building_type_ha_long_bay_01_desc: "$building_ha_long_bay_01_desc$" # todo: NEW TRANSLATION
 building_ha_long_bay_01: "Zátoka Ha Long" # todo: NEW TRANSLATION
 building_ha_long_bay_01_desc: "Tato ohromující krajina vápencových karstů a ostrůvků vystupuje z klidných smaragdových vod zálivu, kde místní rybáři plují hledajíc úlovek ve stínu skalních pilířů." # todo: NEW TRANSLATION
 building_type_my_son_sanctuary_01: "$building_my_son_sanctuary_01$" # todo: NEW TRANSLATION
 building_type_my_son_sanctuary_01_desc: "$building_my_son_sanctuary_01_desc$" # todo: NEW TRANSLATION
 building_my_son_sanctuary_01: "Svatyně My Son" # todo: NEW TRANSLATION
 building_my_son_sanctuary_01_desc: "Největší a nejvznešenější z chamských chrámových komplexů, svatyně se skládá ze série prostorů roztroušených blízko sebe v zalesněném území, každý s vlastními bránami, svatyněmi a stupami. Stavby jsou všechny postaveny z červených cihel, uspořádaných do geometrických vzorů a zdobených pískovcovými překlady." # todo: NEW TRANSLATION
 building_type_gunung_api_01: "$building_gunung_api_01$" # todo: NEW TRANSLATION
 building_type_gunung_api_01_desc: "$building_gunung_api_01_desc$" # todo: NEW TRANSLATION
 building_gunung_api_01: "Gunung Api" # todo: NEW TRANSLATION
 building_gunung_api_01_desc: "Hora, která se tyčí z džunglové divočiny, je pro místní obyvatele posvátná. Uprostřed vlhkosti a mlhy jsou její svahy pokryty nápadnými vápencovými hrotmi a hlubokými jeskyněmi vytesanými vodou během nesčetných věků." # todo: NEW TRANSLATION
 building_type_suwalesi_megaliths_01: "$building_suwalesi_megaliths_01$" # todo: NEW TRANSLATION
 building_type_suwalesi_megaliths_01_desc: "$building_suwalesi_megaliths_01_desc$" # todo: NEW TRANSLATION
 building_suwalesi_megaliths_01: "Sulaweské megality" # todo: NEW TRANSLATION
 building_suwalesi_megaliths_01_desc: "V údolích středního Sulawesi leží rozesetě mnoho megalitických figur a ikon, které místní lidé vztyčili pro rituály a uctívání duchů. Tyto figuríny, známé jako #italic arcas#!, jsou vyřezány s minimalistickou přesností, jejich tvary jsou vykresleny jemnými a elegantními liniemi." # todo: NEW TRANSLATION
 building_type_izumo_taisha_01: "$building_izumo_taisha_01$" # todo: NEW TRANSLATION
 building_type_izumo_taisha_01_desc: "$building_izumo_taisha_01_desc$" # todo: NEW TRANSLATION
 building_izumo_taisha_01: "Kizuki Taisha" # todo: NEW TRANSLATION
 building_izumo_taisha_01_desc: "Tento velký šintoistický svatostánek - #italic taisha#! - byl postaven u pobřeží, obrácen k moři. Vztyčuje se na sérii obrovských dřevěných pilířů a tlustých kmenů, zvedajících jeho síně vysoko nad zem, po níž chodí smrtelníci, a do nebe, kde žijí bohové a duchové země." # todo: NEW TRANSLATION
 building_type_confucius_temple_01: "$building_confucius_temple_01$" # todo: NEW TRANSLATION
 building_type_confucius_temple_01_desc: "$building_confucius_temple_01_desc$" # todo: NEW TRANSLATION
 building_confucius_temple_01: "Chrám Konfucia" # todo: NEW TRANSLATION
 building_confucius_temple_01_desc: "Nejstarší a nejvlivnější ze všech konfuciánských chrámů, tento rozsáhlý komplex síní a nádvoří byl vzorem a inspirací pro stavitele chrámů po celé Číně i dál díky svému harmonickému geometrickému uspořádání a vytříbeným detailům. V blízkosti leží tichý les, kde byly uloženy hroby Konfucia a jeho potomků, tvořící důležité poutní místo pro věřící." # todo: NEW TRANSLATION
 building_type_citadel_linan_01: "$building_citadel_linan_01$" # todo: NEW TRANSLATION
 building_type_citadel_linan_01_desc: "$building_citadel_linan_01_desc$" # todo: NEW TRANSLATION
 building_citadel_linan_01: "Císařská citadela Lin'an" # todo: NEW TRANSLATION
 building_citadel_linan_01_desc: "Postavena na severních svazích Fénixí hory slouží císařská citadela jako sídlo dvora a jeho správy, hostící nesčetné učence a úředníky ve svých rozlehlých síních a chodbách. Ačkoli není tak rozsáhlá jako paláce severních metropolí, její vytříbenost a elegance terasových zahrad a pavilonů jim více než vyrovnává." # todo: NEW TRANSLATION
 building_type_temples_angkor_01: "$building_temples_angkor_01$" # todo: NEW TRANSLATION
 building_type_temples_angkor_01_desc: "$building_temples_angkor_01_desc$" # todo: NEW TRANSLATION
 building_temples_angkor_01: "Angkorské chrámy" # todo: NEW TRANSLATION
 building_temples_angkor_01_desc: "V prosperujícím městě Indra jsou pozlacené střechy a špičky jeho chrámů nesčetné, každý bohatěji zdobený než ten druhý sochařskými reliéfy a sochami božstev a devarajů." # todo: NEW TRANSLATION
 building_temples_angkor_02: "Angkor Wat" # todo: NEW TRANSLATION
 building_temples_angkor_02_desc: "Angkor Wat je mohutný chrámový komplex zasvěcený božstvu Višnu. Je navržen jako zpodobnění hory Meru, domova bohů v hinduistické mytologii. Komplex je obklopen impozantním příkopem a má několik chrámů s galeriemi, přetékajících náboženským uměním, sochami a reliéfy." # todo: NEW TRANSLATION
