 ACHIEVEMENT_DESC_patronage_achievement: "Zafinancujte [Concept('inspired','inspirovaný')|E] [Concept('character','postava')|E]ův [Concept('project','projekt')|E] a získejte konečný výsledek" # todo: CONCEPT CASE
 ACHIEVEMENT_DESC_converging_paths_achievement: "Vytvořte [Concept('hybrid_culture','hybridní kultura')|E]" # todo: CONCEPT CASE
 ACHIEVEMENT_DESC_changing_course_achievement: "Vytvořte [Concept('divergent_culture','odštěpená kultura')|E]" # todo: CONCEPT CASE
 ACHIEVEMENT_DESC_hoarder_achievement: "Mějte [Concept('artifact','artefakt')|E] v každém slotu inventáře i v [Concept('royal_court','královském dvoře')|E]" # todo: CONCEPT CASE
 ACHIEVEMENT_DESC_creme_de_la_creme_achievement: "Dosáhněte maximální úrovně [Concept('court_grandeur','velkoleposti dvora')|E]" # todo: CONCEPT CASE
 ACHIEVEMENT_DESC_polyglot_achievement: "Osobně ovládejte 10 [Concept('languages','jazyky')|E]" # todo: CONCEPT CASE
 ACHIEVEMENT_DESC_inspirational_achievement: "Během jedné hry [Concept('sponsor','mecenáš')|E] 30 úspěšných [Concept('inspirations','inspirací')|E]" # todo: CONCEPT CASE
 ACHIEVEMENT_DESC_one_of_a_kind_achievement: "Získejte epický [Concept('artifact','artefakt')|E] z inspirace dobrodruha." # todo: CONCEPT CASE
 ACHIEVEMENT_DESC_true_tolerance_achievement: "Vládněte [Concept('realm','panství')|E], který obsahuje alespoň 10 [Concept('cultures','kultury')|E] s [Concept('cultural_acceptance','kulturním přijetím')|E] 95 % nebo více" # todo: CONCEPT CASE
 ACHIEVEMENT_DESC_delusions_of_grandeur_achievement: "Buďte alespoň o 6 úrovní nad svými [Concept('court_grandeur_expectations','očekávanou velkolepostí dvora')|E]" # todo: CONCEPT CASE
 ACHIEVEMENT_DESC_bod_chen_po_achievement: "Jako člen rodu Pugyel [Concept('dynasty','dynastie')|E] znovu založte Tibetskou říši" # todo: CONCEPT CASE
 ACHIEVEMENT_DESC_turkish_eagle_achievement: "Začněte jako libovolný člen [Concept('house','rod')|E] Seljuk v roce 1066, kromě Alpa Arslana, založte Rum a vytvořte [Concept('hybrid_culture','hybridní kultura')|E] mezi Oghuz a řeckou kulturou" # todo: CONCEPT CASE
 ACHIEVEMENT_DESC_rise_of_the_ghurids_achievement: "Začněte jako vévoda Ghur v roce 867 nebo 1066 a dobyjte [Concept('region','region')|E] [GetGeographicalRegion('dlc_ep1_achievement_rise_of_the_ghurids').GetName]" # todo: CONCEPT CASE
 ACHIEVEMENT_DESC_brave_and_bold_achievement: "Začněte jako Piastové v roce 867, vládněte Polsku, přijměte feudalismus a vlastněte regálie, korunu, zbraň a brnění rarity Famed nebo Illustrious"
 ACHIEVEMENT_DESC_lingua_franca_achievement: "Zajistěte, aby všechny [Concept('royal_courts','královské dvory')|E] na světě mluvily vaším [Concept('court_language','dvorním jazykem')|E]. $rd_character_blocked_from_achievement$" # todo: CONCEPT CASE
 ACHIEVEMENT_DESC_beta_israel_achievement: "Jako židovský král ve Východní Africe odlište svou [Concept('culture','kulturu')|E]. $rd_character_blocked_from_achievement$" # todo: CONCEPT CASE
 ACHIEVEMENT_DESC_they_belong_in_a_museum_achievement: "Jmenujte [Concept('character','postava')|E] s dokončenou dobrodružnou [Concept('inspiration','inspirací')|E] do funkce $antiquarian_court_position$" # todo: CONCEPT CASE
 ACHIEVEMENT_DESC_i_made_this_achievement: "Vyloupte [Concept('artifact','artefakt')|E], na který nemáte [Concept('artifact_claim','nárok na artefakt')|E], a předejte jej svému [Concept('heir','dědici')|E]" # todo: CONCEPT CASE
 ACHIEVEMENT_DESC_nobody_comes_to_fika_achievement: "S hrabstvím Fika jako vaším [Concept('primary_title','hlavním titulem')|E] odlište svou [Concept('culture','kulturu')|E] a rozšiřte ji do 30 [Concept('counties','hrabství')|E], které držíte vy nebo vaši [Concept('vassals','vazaly')|E]" # todo: CONCEPT CASE
 ACHIEVEMENT_DESC_the_true_royal_court_achievement: "Jako [Concept('vassal','vazal')|E] vůči [Concept('emperor','císaři')|E] mějte vyšší [Concept('court_grandeur','velkolepost dvora')|E], než má on" # todo: CONCEPT CASE
