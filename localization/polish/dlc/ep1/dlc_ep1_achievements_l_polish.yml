 ACHIEVEMENT_DESC_changing_course_achievement: "Vytvoř [Concept('divergent_culture','odštěpenou kulturu')|E]"
 ACHIEVEMENT_DESC_hoarder_achievement: "Měj [Concept('artifact','artefakt')|E] v každém slotu inventáře i [Concept('royal_court','královského dvora')|E]"
 ACHIEVEMENT_DESC_creme_de_la_creme_achievement: "Dosáhni maximální úrovně [Concept('court_grandeur','velkoleposti dvora')|E]"
 ACHIEVEMENT_DESC_polyglot_achievement: "Osobně ovládej 10 [Concept('languages','jazyků')|E]"
 ACHIEVEMENT_DESC_inspirational_achievement: "Během jedné hry se staň [Concept('sponsor','mecenášem')|E] 30 úspěšných [Concept('inspirations','inspirací')|E]"
 ACHIEVEMENT_DESC_one_of_a_kind_achievement: "Získej epický [Concept('artifact','artefakt')|E] z inspirace dobrodruha."
 ACHIEVEMENT_DESC_true_tolerance_achievement: "Vládni [Concept('realm','panství')|E], které zahrnuje alespoň 10 [Concept('cultures','kultur')|E] s [Concept('cultural_acceptance','kulturním přijetím')|E] alespoň 95 %"
 ACHIEVEMENT_DESC_delusions_of_grandeur_achievement: "Buď alespoň o 6 úrovní nad svou [Concept('court_grandeur_expectations','očekávanou velkolepostí dvora')|E]"
 ACHIEVEMENT_DESC_bod_chen_po_achievement: "Jako člen [Concept('dynasty','dynastie')|E] Pugyel obnov Tibetskou říši"
 ACHIEVEMENT_DESC_turkish_eagle_achievement: "Začni v roce 1066 jako libovolný člen [Concept('house','rodu')|E] Seldžuk kromě Alp Arslana, založ Rúm a vytvoř [Concept('hybrid_culture','hybridní kulturu')|E] z oghuzské a řecké kultury"
 ACHIEVEMENT_DESC_rise_of_the_ghurids_achievement: "Začni v roce 867 nebo 1066 jako vévoda Ghuru a dobuď [Concept('region','region')|E] [GetGeographicalRegion('dlc_ep1_achievement_rise_of_the_ghurids').GetName]"
 ACHIEVEMENT_DESC_brave_and_bold_achievement: "Začni v roce 867 jako Piastovec, vládni Polsku, přijmi feudalismus a vlastni regálie, korunu, zbraň a zbroj ve vzácnosti $famed$ nebo $illustrious$"
 ACHIEVEMENT_DESC_lingua_franca_achievement: "Zajisti, aby všechny [Concept('royal_courts','královské dvory')|E] na světě mluvily tvým [Concept('court_language','dvorním jazykem')|E]. $rd_character_blocked_from_achievement$"
 ACHIEVEMENT_DESC_beta_israel_achievement: "Jako židovský král ve východní Africe odštěp svou [Concept('culture','kulturu')|E]. $rd_character_blocked_from_achievement$"
 ACHIEVEMENT_DESC_they_belong_in_a_museum_achievement: "Jmenuj [Concept('character','postavu')|E] s dokončenou dobrodružnou [Concept('inspiration','inspirací')|E] do funkce $antiquarian_court_position$"
 ACHIEVEMENT_DESC_i_made_this_achievement: "Ukořisti [Concept('artifact','artefakt')|E], na který nemáš [Concept('artifact_claim','nárok')|E], a předej jej svému [Concept('heir','dědici')|E]"
 ACHIEVEMENT_DESC_nobody_comes_to_fika_achievement: "S hrabstvím Fika jako svým [Concept('primary_title','hlavním titulem')|E] odštěp svou [Concept('culture','kulturu')|E] a rozšiř ji do 30 [Concept('counties','hrabství')|E], která držíš ty nebo tví [Concept('vassals','vazalové')|E]"
 ACHIEVEMENT_DESC_the_true_royal_court_achievement: "Jako [Concept('vassal','vazal')|E] [Concept('emperor','císaře')|E] měj vyšší [Concept('court_grandeur','velkolepost dvora')|E] než tvůj lenní pán"
