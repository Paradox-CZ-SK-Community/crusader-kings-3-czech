l_polish:
 ep1_character_interaction.0001.t: "Rozumná odměna"
 ep1_character_interaction.0001.desc.intro: "[recipient.GetFirstName] vypadá naprosto #EMP vyděšeně#!, jak jeden sluha za druhým předstupuje, aby [Select_CString(recipient.IsFemale,'ji','ho')] obvinil, a každý dosvědčuje, že"
 ep1_character_interaction.0001.desc.lustful: "nenávratně [Select_CString(recipient.IsFemale,'zprznila','zprznil')] většinu drahého ložního prádla na dvoře,"
 ep1_character_interaction.0001.desc.chaste: "neustále přemisťuje či zakrývá umělecká díla, která považuje za nevkusná, takže sluhové musejí denně hodiny vracet věci na místo,"
 ep1_character_interaction.0001.desc.gluttonous: "[Select_CString(recipient.IsFemale,'snědla','snědl')] [recipient.GetHerselfHimself] víc než celý zbytek dvora dohromady,"
 ep1_character_interaction.0001.desc.temperate: "[Select_CString(recipient.IsFemale,'vyhnala','vyhnal')] tři z našich nejlepších kuchařů tím, že večeři co večeři ohrnuje nad jídlem nos,"
 ep1_character_interaction.0001.desc.greedy: "[Select_CString(recipient.IsFemale,'byla spatřena','byl spatřen')], jak z našich nejdražších ozdob vyřezává kusy drahých kovů,"
 ep1_character_interaction.0001.desc.generous: "opakovaně [Select_CString(recipient.IsFemale,'rozdala','rozdal')] majetek dvora, jako by byl [Select_CString(recipient.IsFemale,'její','jeho')] vlastní,"
 ep1_character_interaction.0001.desc.lazy: "zabírá sluhům víc času nicotnými úkoly, než kolik jim zbytek dvora zabere těmi důležitými,"
 ep1_character_interaction.0001.desc.diligent: "je [Select_CString(recipient.IsFemale,'nutila','nutil')] opakovat práci až do dokonalosti bez ohledu na množství úkolů,"
 ep1_character_interaction.0001.desc.wrathful: "[Select_CString(recipient.IsFemale,'vyházela','vyházel')] ze svého balkonu většinu židlí na dvoře,"
 ep1_character_interaction.0001.desc.calm: "týden co týden [Select_CString(recipient.IsFemale,'odkládala','odkládal')] večeři rozjímáním nad tím, kterému jídlu dává přednost,"
 ep1_character_interaction.0001.desc.patient: "neustále zadává úkoly, jejichž splnění trvá týdny či měsíce,"
 ep1_character_interaction.0001.desc.impatient: "jim denně zadává stovky úkolů a další přidává dřív, než se stihnou pustit do předchozího,"
 ep1_character_interaction.0001.desc.arrogant: "odmítá, aby pro [Select_CString(recipient.IsFemale,'ni','něj')] obyčejní sluhové cokoli dělali, a trvá na tom, že se [Select_CString(recipient.IsFemale,'jí','mu')] musí věnovat vedoucí služebnictvo,"
 ep1_character_interaction.0001.desc.humble: "pokoru jen předstírá a ve skutečnosti povýšeně mate služebnictvo, až z toho vzniká chaos,"
 ep1_character_interaction.0001.desc.deceitful: "zjevně bez důvodu s chutí šíří lži a rozsévá po celém dvoře chaos,"
 ep1_character_interaction.0001.desc.honest: "denně ponižuje sluhy upřímnými názory na jejich vzhled, chování a pracovní morálku, takže mnozí odešli,"
 ep1_character_interaction.0001.desc.craven: "je ze strachu z otrávení nutí drhnout mýdlem každé jídlo, které sní,"
 ep1_character_interaction.0001.desc.brave: "nevynechá sebemenší příležitost ke rvačce a [recipient.GetHerselfHimself] tak způsobuje většinu nepořádku, který se musí uklízet,"
 ep1_character_interaction.0001.desc.shy: "pokaždé zpanikaří, když sluhové nečekaně vstoupí do [Select_CString(recipient.IsFemale,'její','jeho')] přítomnosti, a všude, kam jde, způsobuje zdržení,"
 ep1_character_interaction.0001.desc.gregarious: "neustále pořádá z dvorních zásob okázalé soukromé hostiny,"
 ep1_character_interaction.0001.desc.ambitious: "je neustále nutí stát celé hodiny v davu a tleskat [Select_CString(recipient.IsFemale,'jejím','jeho')] projevům,"
 ep1_character_interaction.0001.desc.content: "je neustále přemlouvá, aby nechávali práci napůl hotovou nebo ji vůbec nedělali, čímž později vzniká ještě víc práce,"
 ep1_character_interaction.0001.desc.arbitrary: "je běžně nutí páchat drobné zločiny [Select_CString(recipient.IsFemale,'jejím','jeho')] jménem, za což se platí pokuty,"
 ep1_character_interaction.0001.desc.just: "[Select_CString(recipient.IsFemale,'nahlásila','nahlásil')] tolik drobných prohřešků služebnictva, že se sluhové víc hádají o domnělou vinu, než pracují,"
 ep1_character_interaction.0001.desc.cynical: "[Select_CString(recipient.IsFemale,'provedla','provedl')] cosi nevyslovitelného se dveřmi soukromé dvorní svatyně,"
 ep1_character_interaction.0001.desc.zealous: "jim každý den bere hodiny času svým kázáním a fanatismem,"
 ep1_character_interaction.0001.desc.paranoid: "ze strachu z podvodu trvá na tom, že bude osobně dohlížet na každý jejich úkol,"
 ep1_character_interaction.0001.desc.trusting: "neustále vodí do síní šarlatány a podvodníky, kteří tu klamou a kradou,"
 ep1_character_interaction.0001.desc.compassionate: "[Select_CString(recipient.IsFemale,'rozdala','rozdal')] bezdomovcům a žebrákům téměř všechny zásoby ze spíže,"
 ep1_character_interaction.0001.desc.callous: "bezcitně [Select_CString(recipient.IsFemale,'týrala','týral')] služebnictvo a mnohé [Select_CString(recipient.IsFemale,'dohnala','dohnal')] k odchodu,"
 ep1_character_interaction.0001.desc.sadistic: "[Select_CString(recipient.IsFemale,'napadla','napadl')] sekáčkem na maso cenami ověnčenou kozu,"
 ep1_character_interaction.0001.desc.stubborn: "[Select_CString(recipient.IsFemale,'vyvolala','vyvolal')] hádku s družinou hostujícího šlechtice, která skončila ničením majetku,"
 ep1_character_interaction.0001.desc.fickle: "zaměstnává celé zástupy služebnictva neustále se měnícími požadavky,"
 ep1_character_interaction.0001.desc.vengeful: "z malicherné zlomyslnosti neustále rozbíjí drahé nádobí,"
 ep1_character_interaction.0001.desc.forgiving: "jen předstírá, že odpouští, a místo toho $ep1_character_interaction.0001.desc.vengeful$"
 ep1_character_interaction.0001.desc.fallback_1: "se [Select_CString(recipient.IsFemale,'pokusila','pokusil')] chovat ve svých komnatách hejno slepic a [Select_CString(recipient.IsFemale,'napáchala','napáchal')] škody,"
 ep1_character_interaction.0001.desc.fallback_2: "naprosto [Select_CString(recipient.IsFemale,'zdemolovala','zdemoloval')] můj osobní záchod a [Select_CString(recipient.IsFemale,'napáchala','napáchal')] škody,"
 ep1_character_interaction.0001.desc.fallback_3: "[Select_CString(recipient.IsFemale,'vyměnila','vyměnil')] jednoho z mých nejlepších hřebců za „kouzelnou“ kozu,"
 ep1_character_interaction.0001.desc.fallback_4: "nese výhradní vinu za požár, který zachvátil západní křídlo,"
 ep1_character_interaction.0001.desc.fallback_5: "[Select_CString(recipient.IsFemale,'pomalovala','pomaloval')] můj trůn obrázky svých předností,"
 ep1_character_interaction.0001.desc.outro: "což mě (údajně) stálo malé osobní jmění.\n\n[Select_CString(recipient.IsFemale,'Ta žena','Ten muž')] sotva začne koktat cosi o své nevině a spiknutí, když zvednu ruku.\n\n„Je jasné, že ses [Select_CString(recipient.IsFemale,'provinila','provinil')], [recipient.Custom('CZ_FirstNameNoTooltip_V')]. #EMP [Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')] bych#! tvé prohřešky přehlédnout, pokud bys mi [Select_CString(recipient.IsFemale,'byla ochotna','byl ochoten')] dát #EMP malý#! slib…“"
 ep1_character_interaction.0001.a: "*Chichot* Ach ano, to [actor_nemesis.GetFirstNameNoTooltip] nečeká ani ve snu!"
 ep1_character_interaction.0001.b: "Výborně! Teď se odebereš na dvůr, kterému vládne [actor_rival.GetFirstNameNoTooltip]…"
 ep1_character_interaction.0001.c: "Zmiz, dokud tě nebudu potřebovat!"
 ep1_character_interaction.0001.d: "Pochopitelně zůstaneš tam, kde na tebe uvidím."
