l_polish:
 ep1_character_interaction.0001.t: "Rozumná odměna"
 ep1_character_interaction.0001.desc.intro: "[recipient.GetFirstName] vypadá naprosto #EMP zděšeně#!, když jsou předvoláváni sluha za sluhou, aby [recipient.GetHerHim] obvinili; každý tvrdí, že [recipient.GetSheHe]"
 ep1_character_interaction.0001.desc.lustful: "neopravitelně znehodnotil většinu drahého ložního prádla dvora,"
 ep1_character_interaction.0001.desc.chaste: "neustále přesouvá nebo zakrývá jakékoli umění, které [recipient.GetSheHe] považuje za nevhodné, nutí je trávit hodiny denně uváděním věcí do pořádku a"
 ep1_character_interaction.0001.desc.gluttonous: "snědl více [recipient.GetHerselfHimself] než zbytek dvora dohromady,"
 ep1_character_interaction.0001.desc.temperate: "vyhnal tři z našich nejlepších kuchařů tím, že [Select_CString(recipient.IsFemale,'její','jeho')] večeři za večeří krčí nad jídlem nos,"
 ep1_character_interaction.0001.desc.greedy: "[Select_CString(ROOT.Char.IsFemale,'byla','byl')] spatřen, jak z našich nejdražších ozdob vyřezává kusy drahých kovů,"
 ep1_character_interaction.0001.desc.generous: "opakovaně rozdává majetek dvora, jako by [Select_CString(ROOT.Char.IsFemale,'byla','byl')] [recipient.GetHerHis] vlastní,"
 ep1_character_interaction.0001.desc.lazy: "zabírá jim více času drobnými úkoly, než kolik zbytek dvora věnuje těm důležitým,"
 ep1_character_interaction.0001.desc.diligent: "nutí je opakovat práci do dokonalosti bez ohledu na množství úkolů,"
 ep1_character_interaction.0001.desc.wrathful: "vyhodil většinu jednoosobových sedadel dvora z [Select_CString(recipient.IsFemale,'jejímu','jeho')] balkonu,"
 ep1_character_interaction.0001.desc.calm: "týden co týden odkládá večeři meditativním rozhodováním, které jídlo [recipient.GetSheHe] dává přednost,"
 ep1_character_interaction.0001.desc.patient: "průběžně zadává úkoly, jejichž dokončení potrvá týdny nebo měsíce,"
 ep1_character_interaction.0001.desc.impatient: "dává jim stovky úkolů denně, zřídka čeká, až se jeden začne, než přidá další a"
 ep1_character_interaction.0001.desc.arrogant: "odmítá nechat obyčejné služebníky vykonávat úkoly pro [recipient.GetHerHim], trvá na tom, aby si na ně dělali čas přední zaměstnanci a"
 ep1_character_interaction.0001.desc.humble: "jen předstírá pokoru a ve skutečnosti tráví čas pohrdavým zmatením personálu. Chaos je"
 ep1_character_interaction.0001.desc.deceitful: "zdá se, že si užívá šíření dezinformací bez zjevného důvodu, rozhazuje chaos po celém dvoře a"
 ep1_character_interaction.0001.desc.honest: "denně je ponižuje upřímnými názory na jejich vzhled, chování a pracovní morálku. Ztracený personál sám o sobě je"
 ep1_character_interaction.0001.desc.craven: "nutí je drhnout každou potravinu, kterou [recipient.GetSheHe] jí, mýdlem ze strachu z otravy,"
 ep1_character_interaction.0001.desc.brave: "nikdy neodmítne sebemenší příležitost k boji, což způsobuje, že většinu úklidu provádí [recipient.GetHerselfHimself] a"
 ep1_character_interaction.0001.desc.shy: "panikaří pokaždé, když služebníci vstoupí náhle do [Select_CString(recipient.IsFemale,'její','jeho')] přítomnosti, způsobuje zpoždění všude, kam [recipient.GetSheHe] jde a"
 ep1_character_interaction.0001.desc.gregarious: "neustále pořádá okázalé soukromé oslavy na úkor dvorových zásob,"
 ep1_character_interaction.0001.desc.ambitious: "vždy je nutí stát v davu hodiny a tleskat při [Select_CString(recipient.IsFemale,'jejích','jeho')] projevech,"
 ep1_character_interaction.0001.desc.content: "vždy je povzbuzuje, aby nechávali práci nedokončenou nebo jí vůbec neprováděli, čímž vlastně později vzniká více práce a"
 ep1_character_interaction.0001.desc.arbitrary: "rutinně je nutí páchat drobné zločiny jménem [recipient.GetHerHis], což vede k pokutám"
 ep1_character_interaction.0001.desc.just: "ohlásil tolik drobných přestupků mezi personálem, že tráví více času hádkami o domnělé vině než prací,"
 ep1_character_interaction.0001.desc.cynical: "provedl něco nevyslovitelného s dveřmi soukromého [actor.GetFaith.HouseOfWorship] na dvoře,"
 ep1_character_interaction.0001.desc.zealous: "každý den jim bere hodiny [Select_CString(recipient.IsFemale,'jejím','jeho')] kázáním a fanatismem,"
 ep1_character_interaction.0001.desc.paranoid: "trvá na osobním dohledu nad každým jejich úkolem ze strachu z podvodu,"
 ep1_character_interaction.0001.desc.trusting: "stále přivádí do síní šarlatány a podvodníky, aby je obelstili a oloupili,"
 ep1_character_interaction.0001.desc.compassionate: "[Select_CString(ROOT.Char.IsFemale,'rozdala','rozdal')] téměř celý proviant bezdomovcům a žebrákům,"
 ep1_character_interaction.0001.desc.callous: "[Select_CString(ROOT.Char.IsFemale,'zneužívala','zneužíval')] personál bez lítosti, [Select_CString(ROOT.Char.IsFemale,'přivedla','přivedl')] mnoho k odchodu a"
 ep1_character_interaction.0001.desc.sadistic: "[Select_CString(ROOT.Char.IsFemale,'zaútočila','zaútočil')] na oceněnou kozu sekáčem na maso,"
 ep1_character_interaction.0001.desc.stubborn: "[Select_CString(ROOT.Char.IsFemale,'vyvolala','vyvolal')] hádku se družinou hostujícího šlechtice, což vedlo k ničení"
 ep1_character_interaction.0001.desc.fickle: "zabírá hordy jejich lidí neustále se měnícími požadavky,"
 ep1_character_interaction.0001.desc.vengeful: "pořád ničí drahé nádobí ze zlomyslnosti,"
 ep1_character_interaction.0001.desc.forgiving: "pouze předstírá odpuštění, a ve skutečnosti $ep1_character_interaction.0001.desc.vengeful$"
 ep1_character_interaction.0001.desc.fallback_1: "[Select_CString(ROOT.Char.IsFemale,'pokusila','pokusil')] se chovat v [Select_CString(recipient.IsFemale,'jejích','jeho')] komnatách stádo kuřat, což způsobilo škody"
 ep1_character_interaction.0001.desc.fallback_2: "úplně [Select_CString(ROOT.Char.IsFemale,'zničila','zničil')] mé osobní záchodky, což způsobilo škody"
 ep1_character_interaction.0001.desc.fallback_3: "[Select_CString(ROOT.Char.IsFemale,'vyměnila','vyměnil')] jednoho z mých ceněných hřebců za „kouzelnou“ kozu"
 ep1_character_interaction.0001.desc.fallback_4: "[Select_CString(ROOT.Char.IsFemale,'byla','byl')] jedině zodpovědný za požár, který sežehnul západní křídlo,"
 ep1_character_interaction.0001.desc.fallback_5: "[Select_CString(ROOT.Char.IsFemale,'zohavila','zohavil')] můj trůn graffiti zobrazující [Select_CString(recipient.IsFemale,'její','jeho')] přednosti,"
 ep1_character_interaction.0001.desc.outro: "(údajně) mě to stálo malé osobní jmění.\n\n[recipient.GetWomanMan] sotva začíná koktat o [Select_CString(recipient.IsFemale,'její','jeho')] nevině a spiknutí, když zvednu ruku.\n\n„Jasně jsi zhřešil, [recipient.GetFirstNameNoTooltip]. Já #EMP bych mohl#! přehlédnout tvé provinění, pokud bys [Select_CString(ROOT.Char.IsFemale,'byla','byl')] ochoten udělat mi #EMP malý#! slib..." # todo: RETRANSLATED ENGLISH
 ep1_character_interaction.0001.a: "*Chichotání* Ach ano, [actor_nemesis.GetFirstNameNoTooltip] to nikdy nečekal!"
 ep1_character_interaction.0001.b: "Výborně! Nyní se vydáš na [actor_rival.GetFirstNamePossessiveNoTooltip] dvůr..."
 ep1_character_interaction.0001.c: "Zmizni, dokud tě nepotřebuji!"
 ep1_character_interaction.0001.d: "Samozřejmě, zůstaneš tam, kde na tebe budu mít dohled."
