l_polish:
 court_new.0001.t: "Damoklův meč"
 court_new.0001.desc.intro: "Ozve se náhlé prasknutí, část lešení se zlomí a zřítí k zemi. Jen díky bleskové reakci [bodyguard_candidate.Custom('CZ_FirstName_G')] to těsně mine jednoho ze sluhů."
 court_new.0001.desc.murdered: "Okamžitě se mi vybaví hrůzná vražda [murdered_person.Custom('CZ_Name_G')], [Select_CString(murdered_person.IsFemale,'která zemřela','který zemřel')] předčasně."
 court_new.0001.desc.murderer: "Okamžitě se mi vybaví vražedné úklady [murder_dude.Custom('CZ_Name_G')], darebáka nejhoršího zrna."
 court_new.0001.desc.paranoid: "V poslední době vidím stíny na okraji zorného pole, ďábelské přízraky bezpochyby s vražednými úmysly. Nejnovější incident jen posiluje můj pocit bezprostředního nebezpečí."
 court_new.0001.desc.outro: "\n\nNebylo to snad další ohavné spiknutí? Život [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')] bývá plný těch nejhorších nebezpečí, jako by mi nad hlavou neustále visel špatně upevněný meč a jen čekal, až spadne.\n\nKéž bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] někoho, kdo by na mě dával pozor, jakéhosi ochránce mého smrtelného těla. Třeba [Select_CString(bodyguard_candidate.IsFemale,'tamta žena','tamten chlapík')], [bodyguard_candidate.GetFirstName]; [Select_CString(bodyguard_candidate.IsFemale,'pečlivější a statnější žena','pečlivější a statnější muž')] aby člověk pohledal. Možná bych [Select_CString(bodyguard_candidate.IsFemale,'ji','ho')] do té funkce [Select_CString(ROOT.Char.IsFemale,'měla','měl')] jmenovat."
 court_new.0001.a: "[bodyguard_candidate.GetFirstNameNoTooltip] bude [Select_CString(bodyguard_candidate.IsFemale,'vynikající osobní strážkyně','vynikající osobní strážce')]."
 court_new.0001.a.murderer: "Nejsem tady [Select_CString(ROOT.Char.IsFemale,'jediná','jediný')], kdo zabíjí..."
 court_new.0001.b: "Určitě se bez [Select_CString(bodyguard_candidate.IsFemale,'ní','něj')] obejdu."
