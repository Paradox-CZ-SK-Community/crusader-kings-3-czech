l_polish:
 court_position.9001.t: "$murder_save_header$ $food_taster_court_position$"
 court_position.9001.desc: "Můj pokus o život [target.Custom('CZ_TitledFirstName_G')] byl zmařen!\n\nMoji agenti nepočítali s tím, že [target.GetTitledFirstName] má ochutnávače jídel, a jed se tak na [Select_CString(target.IsFemale,'její','jeho')] talíř vůbec nedostal."
 court_position.9001.food_taster_dies: "\n\n[Select_CString(food_taster.IsFemale,'Ochutnávačka aspoň jedu podlehla','Ochutnávač aspoň jedu podlehl')]. [food_taster.GetTitledFirstName] mi už nebude stát v cestě."
 court_position.9002.desc: "Na můj život byl spáchán pokus!\n\nNaštěstí [Select_CString(food_taster.IsFemale,'moje důvěryhodná ochutnávačka','můj důvěryhodný ochutnávač')] jídel [food_taster.GetFirstName] [Select_CString(food_taster.IsFemale,'odvedla','odvedl')] svou práci a jed se na můj talíř vůbec nedostal."
 court_position.9002.food_taster_dies: "Bohužel [food_taster.GetFirstNameNoTooltip] [Select_CString(food_taster.IsFemale,'pozřela','pozřel')] příliš mnoho jedu a už [Select_CString(food_taster.IsFemale,'ji','ho')] nebylo možné zachránit."
 court_position.9002.owner_discovered: "\n\nNemůže být pochyb, že za tím vším stojí [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 court_position.9011.t: "$murder_save_header$ $cupbearer_court_position$"
 court_position.9011.desc: "Můj pokus o život [target.Custom('CZ_TitledFirstName_G')] byl zmařen!\n\nMoji agenti nepočítali s [Select_CString(target.IsFemale,'jejím','jeho')] [Select_CString(cupbearer.IsFemale,'číšnicí','číšníkem')], a přestože se jed do nápoje [target.Custom('CZ_TitledFirstName_G')] dostal, dál než ke rtům [cupbearer.Custom('CZ_TitledFirstName_G')] se nedostal."
 court_position.9011.cupbearer_dies: "\n\n[Select_CString(cupbearer.IsFemale,'Číšnice aspoň jedu podlehla','Číšník aspoň jedu podlehl')]. [cupbearer.GetSheHe|U] mi už nebude stát v cestě."
 court_position.9012.desc: "Na můj život byl spáchán pokus!\n\nNaštěstí si [Select_CString(cupbearer.IsFemale,'moje číšnice','můj číšník')] [cupbearer.GetFirstName] [Select_CString(cupbearer.IsFemale,'dovolila','dovolil')] upít z mého nápoje (dnes to bylo [ROOT.Char.Custom('RegionalDrink')]) dřív, než mi ho [Select_CString(cupbearer.IsFemale,'podala','podal')]."
 court_position.9012.cupbearer_dies: "Bohužel [cupbearer.GetFirstNameNoTooltip] [Select_CString(cupbearer.IsFemale,'pozřela','pozřel')] příliš mnoho jedu a už [Select_CString(cupbearer.IsFemale,'ji','ho')] nebylo možné zachránit. Někde se v tom skrývá ponaučení o tom, že by si člověk neměl dovolovat příliš..."
 court_position.9021.t: "$murder_save_header$ $bodyguard_court_position$"
 court_position.9021.desc: "Můj pokus o život [target.Custom('CZ_TitledFirstName_G')] byl zmařen!\n\n[target.GetHerHis|U] [bodyguard.Custom2('InsultAdjective', ROOT.Char)] osobní strážce přemohl vraha, kterého jsem [Select_CString(ROOT.Char.IsFemale,'poslala','poslal')], a [target.GetFirstNameNoTooltip] [Select_CString(target.IsFemale,'neutrpěla','neutrpěl')] ani škrábnutí!"
 court_position.9021.bodyguard_dies: "\n\nOsobní strážce aspoň podlehl svým zraněním a už mi nebude stát v cestě."
 court_position.9022.desc: "Na můj život byl spáchán pokus!\n\nKdyž jsem se pozdě v noci [Select_CString(ROOT.Char.IsFemale,'procházela','procházel')] prázdnými chodbami, náhle se ze tmy vyřítil vrah. Děsím se pomyšlení, co by se stalo, kdyby mě [Select_CString(bodyguard.IsFemale,'nedoprovázela moje důvěryhodná osobní strážkyně','nedoprovázel můj důvěryhodný osobní strážce')] [bodyguard.GetTitledFirstName]."
 court_position.9022.bodyguard_dies: "\n\nBohužel v následném boji [Select_CString(bodyguard.IsFemale,'utrpěla','utrpěl')] těžká zranění a už [Select_CString(bodyguard.IsFemale,'ji','ho')] nebylo možné zachránit."
