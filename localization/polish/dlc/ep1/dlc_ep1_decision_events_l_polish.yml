 ep1_decision.0201.desc: "Konečně pátrání po [target_court_language.GetCourtLanguage.GetName] lingvistovi přineslo ovoce. Kandidáti mi byli představení, každý z nich přináší vlastní odborné znalosti cizích jazyků."
