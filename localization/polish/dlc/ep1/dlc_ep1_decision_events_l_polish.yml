l_polish:
 ep1_decision.0101.t: "Pryč s příživníky"
 ep1_decision.0101.desc: "Flákači! Lenoši! Darmošlapové!\n\nMůj dvůr je #EMP zamořen#! příživníky jako zahrada mšicemi. Zabrali každý volný pokoj, chrápou ve dne v noci a po stísněných chodbách nechávají povalovat své nočníky.\n\nTakhle to dál nejde. Prostě nemáme dost #EMP místa#! pro všechny ty tuláky."
 ep1_decision.0101.a: "[capital.GetNameNoTierNoTooltip] není hostinec. Pryč, pijavice!"
 ep1_decision.0101.b: "Všichni, kdo nemají práci ani mou krev, #EMP ven#!!"
 ep1_decision.0101.c: "Asi bychom mohli dát nějaké postele do stájí..."
 ep1_decision.0111.t: "Velkolepá výzdoba"
 ep1_decision.0111.desc.1: "Jediným vhodným kandidátem na novou výzdobu, nejbližším a nejpozoruhodnějším, je panství [option_1.Custom('CZ_TitledFirstName_G')]."
 ep1_decision.0111.desc.2: "Nabízejí se dva vhodní kandidáti na novou výzdobu, ti nejbližší a nejpozoruhodnější: panství [option_1.Custom('CZ_TitledFirstName_G')] a [option_2.Custom('CZ_TitledFirstName_G')]."
 ep1_decision.0111.desc.3: "Nabízí se několik vhodných kandidátů na novou výzdobu, ti nejbližší a nejpozoruhodnější: panství [option_1.Custom('CZ_TitledFirstName_G')], [option_2.Custom('CZ_TitledFirstName_G')] a [option_3.Custom('CZ_TitledFirstName_G')]."
 ep1_decision.0111.desc.outro: "\n\nVolba stylu, který je považován za proslulejší než můj vlastní dvůr, by pro mě byla pokořující, ale propůjčila by mi něco z velkoleposti cizí říše.\n\nNapodobení méně významné říše by naopak prokázalo mou velkorysost a posílilo mou pověst v cizině, ovšem za cenu jisté ztráty vážnosti doma."
 ep1_decision.0111.toast.t: "[ROOT.Char.GetTitledFirstName] [Select_CString(ROOT.Char.IsFemale,'napodobila','napodobil')] jeden z mých sálů"
 ep1_decision.0111.a.greater_cgv: "[option_1.GetPrimaryTitle.GetAdjectiveNoTooltip|U] dvůr je opravdu, opravdu velkolepý."
 ep1_decision.0111.a.lesser_cgv: "Lidu [option_1.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] by se má štědrost #EMP hodila#!."
 ep1_decision.0111.b.greater_cgv: "[option_2.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_ou')|U] architekturu považuji za strhující!"
 ep1_decision.0111.b.lesser_cgv: "[option_2.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_aa')|U] architektura je hrubá, ale inspirující!"
 ep1_decision.0111.c.greater_cgv: "Co takhle hodovní síň v [option_3.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_eem')|l] stylu?"
 ep1_decision.0111.c.lesser_cgv: "Co takhle prostá hodovní síň v [option_3.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_eem')|l] stylu? To by byla novinka!"
 ep1_decision.0111.d: "Všechno to působí až #EMP znepokojivě#! cize..."
 ep1_decision.0111.d.single: "Působí to až #EMP znepokojivě#! cize..."
 ep1_decision.0111.d.tt: "[Concept('gold','Zlato')|E] ti bude vráceno"
 promote_other_culture_development_decision_name: "Oslava jiných kultur"
 promote_other_culture_development_decision_desc: "Odměňme ty, kteří nám věrně sloužili, aby mohli růst a rozvíjet se spolu s dynastií, které tak věrně slouží!"
 promote_other_culture_development_decision_tooltip: "Zvýší rozvoj [Concept('counties','hrabství')|E] jiných [Concept('cultures','kultur')|E] s vysokým [Concept('cultural_acceptance','kulturním přijetím')|E]"
 promote_other_culture_development_decision_not_acceptance_tt: "Ve tvém [Concept('realm','panství')|E] není žádná [Concept('culture','kultura')|E] s [Concept('cultural_acceptance','kulturním přijetím')|E] vyšším než #V 75%#!"
 promote_other_culture_development_decision_confirm: "Rozdělit mince"
 promote_other_culture_development_decision_effect_summary: "Každé [Concept('county','hrabství')|E] tvého [Concept('realm','panství')|E] s [current_culture.Custom('CZ_Adjective_ou')|l] kulturou získá na 10 let [GetModifier('promote_culture_modifier' ).GetNameWithTooltip|L]"
 promote_other_culture_development_decision_no_effect: "Každé [Concept('county','hrabství')|E] tvého [Concept('realm','panství')|E], jehož [Concept('culture','kultura')|E] má [Concept('cultural_acceptance','kulturní přijetí')|E] vyšší než #V 75%#!, získá na 10 let [GetModifier('promote_culture_modifier' ).GetNameWithTooltip|L]"
 promote_culture_leader_modifier: "Oslava kulturní rozmanitosti"
 ep1_decision.0201.t: "Lingvisté na dvoře"
 ep1_decision.0201.desc: "Pátrání po lingvistovi, jehož jazykem je [target_court_language.GetCourtLanguage.GetNameNoTooltip|l], konečně přineslo ovoce. Byli mi představeni kandidáti a každý z nich má vlastní znalosti cizích jazyků."
 ep1_decision.0201.tt.aptitude: "[Concept('aptitude','Způsobilost')|E] [selected_linguist.Custom('CZ_UIName_G')] je [selected_linguist.GetCourtPositionAptitude( GetCourtPositionType( 'court_tutor_court_position' ) )]"
 ep1_decision.0201.a: "[good_linguist.GetNameNoTooltip] je [Select_CString(good_linguist.IsFemale,'uznávaná lingvistka','uznávaný lingvista')] se znalostí jazyka [target_court_language.GetCourtLanguage.GetNameNoTooltip|l]."
 ep1_decision.0201.b: "[medium_linguist.GetNameNoTooltip] bude stačit."
 ep1_decision.0201.c: "[scholarly_linguist.GetNameNoTooltip] je [Select_CString(scholarly_linguist.IsFemale,'proslulá znalkyně','proslulý znalec')] jazyka [target_court_language.GetCourtLanguage.GetNameNoTooltip|l]!"
 ep1_decision.0201.d: "Vím, že [cheap_linguist.GetNameNoTooltip] bude prakticky pracovat zadarmo!"
 ep1_decision.0201.e: "Po krátkém zamyšlení..."
 learn_court_language_toast_title: "Najat učitel jazyka [target_court_language.GetCourtLanguage.GetNameNoTooltip|l]"
