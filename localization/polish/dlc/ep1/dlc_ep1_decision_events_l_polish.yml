l_polish:
 ep1_decision.0101.t: "Vyžeňte staré"
 ep1_decision.0101.desc: "Flákači! Lenivci! Neschopníci!\n\nMůj dvůr je #EMP zamořen#! parazity jako mšice v zahradě, ubytovanými v každém dostupném pokoji, chrápajícími dnem i nocí a nechávajícími své nočníky rozházené po stísněných chodbách.\n\nToto nesmí pokračovat. Prostě nemáme #EMP místo#! pro všechny tyto tuláky."
 ep1_decision.0101.a: "[capital.GetNameNoTierNoTooltip] není hostinec. Pryč, pijavice!"
 ep1_decision.0101.b: "Všichni, kdo postrádají práci nebo moji krev, #EMP pryč#!!"
 ep1_decision.0101.c: "Asi bychom mohli dát nějaké postele do stájí..."
 ep1_decision.0111.t: "Velkolepá výzdoba"
 ep1_decision.0111.desc.1: "Jediný pravděpodobný kandidát na změnu výzdoby, který se nabízí a je mi nejbližší a nejvýznamnější: říše [option_1.GetTitledFirstName]." # todo: NEW TRANSLATION
 ep1_decision.0111.desc.2: "Nabízejí se dva pravděpodobní kandidáti na změnu výzdoby, ti nejbližší a nejvýznamnější: říše [option_1.GetTitledFirstName] a [option_2.GetTitledFirstName]." # todo: NEW TRANSLATION
 ep1_decision.0111.desc.3: "Nabízí se několik pravděpodobných kandidátů na změnu výzdoby, ti nejbližší a nejvýznamnější: říše [option_1.GetTitledFirstName], [option_2.GetTitledFirstName] a [option_3.GetTitledFirstName]." # todo: NEW TRANSLATION
 ep1_decision.0111.desc.outro: "\n\nVolba stylu, který je považován za vznešenější než styl mého vlastního dvora, by pro mě byla pokořující, ale propůjčila by mu něco z velkoleposti cizí říše.\n\nNapodobení méně významné říše by naopak prokázalo mou velkorysost a posílilo mou pověst v zahraničí, ovšem za cenu jisté ztráty vážnosti doma." # todo: NEW TRANSLATION
 ep1_decision.0111.toast.t: "[ROOT.Char.GetTitledFirstName] napodobil jeden z mých sálů"
 ep1_decision.0111.a.greater_cgv: "Dvůr [option_1.GetPrimaryTitle.GetAdjectiveNoTooltip|U] je opravdu, opravdu velkolepý."
 ep1_decision.0111.a.lesser_cgv: "[option_1.GetPrimaryTitle.GetNamePossessiveNoTooltip|U] lidé #EMP by mohli#! využít mé dobroty."
 ep1_decision.0111.b.greater_cgv: "Považuji [option_2.GetPrimaryTitle.GetAdjectiveNoTooltip] architekturu za strhující!"
 ep1_decision.0111.b.lesser_cgv: "[option_2.GetPrimaryTitle.GetAdjectiveNoTooltip] architektura je hrubá, ale inspirující!"
 ep1_decision.0111.c.greater_cgv: "Možná slavnostní síň ve stylu [option_3.GetPrimaryTitle.GetAdjectiveNoTooltip]?"
 ep1_decision.0111.c.lesser_cgv: "Možná by byla novinkou surová [option_3.GetPrimaryTitle.GetAdjectiveNoTooltip] slavnostní síň?"
 ep1_decision.0111.d: "Všechny se mi zdají docela #EMP znepokojivě#! cizí..."
 ep1_decision.0111.d.single: "Zdá se to být až #EMP znepokojivě#! cizí..." # todo: NEW TRANSLATION
 ep1_decision.0111.d.tt: "Vaše [Concept('gold','zlato')|E] byly vráceny" # todo: CONCEPT CASE
 promote_other_culture_development_decision_name: "Oslava jiných kultur"
 promote_other_culture_development_decision_desc: "Odměňme ty, kteří nám věrně sloužili, aby mohli růst a rozvíjet se spolu s dynastií, které tak věrně slouží!"
 promote_other_culture_development_decision_tooltip: "Zlepšit rozvoj [Concept('counties','hrabství')|E] z různých [Concept('cultures','kultur')|E] s vysokým [Concept('cultural_acceptance','kulturním přijetím')|E]" # todo: CONCEPT CASE
 promote_other_culture_development_decision_not_acceptance_tt: "Ve vašem [Concept('realm','panství')|E] není žádná [Concept('culture','kultura')|E] s [Concept('cultural_acceptance','kulturním přijetím')|E] vyšší než #V 75%#!" # todo: CONCEPT CASE
 promote_other_culture_development_decision_confirm: "Rozdělte mince"
 promote_other_culture_development_decision_effect_summary: "Každý [current_culture.GetName] [Concept('county','hrabství')|E] v [Concept('realm','panství')|E] získá [GetModifier('promote_culture_modifier' ).GetNameWithTooltip|L] na 10 let" # todo: CONCEPT CASE
 promote_other_culture_development_decision_no_effect: "Každý [Concept('county','hrabství')|E] v [Concept('realm','panství')|E] pocházející z [Concept('culture','kultury')|E] s [Concept('cultural_acceptance','kulturním přijetím')|E] vyšší než #V 75%#! získá [GetModifier('promote_culture_modifier' ).GetNameWithTooltip|L] na 10 let" # todo: CONCEPT CASE
 promote_culture_leader_modifier: "Oslava kulturní rozmanitosti"
