 ep1_decision.0201.tt.aptitude: "[selected_linguist.GetUINamePossessive] [Concept('aptitude','Způsobilost')|E] je [selected_linguist.GetCourtPositionAptitude( GetCourtPositionType( 'court_tutor_court_position' ) )]" # todo: CONCEPT CASE
