 ep1_flavor.2030.desc_outro: "kteří se dostali do sporu.\n\nHlava se mi točí z malicherných podrobností a brzy je jasné, že pravdu nemá ani jedna strana a spokojeně odsud odejde jen jedna z nich..."
 ep1_flavor.2030.a: "„Rozhoduji ve prospěch [local_dispute_1.Custom('CZ_TitledFirstNameNoTooltip_G')].“"
