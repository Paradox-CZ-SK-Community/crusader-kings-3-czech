 ep1_flavor.2040.t: "Exotické zbraně"
 ep1_flavor.2040.desc: "Spolu s podivným zbožím přinášejí kupci i přibarvené historky z dalekých krajů; neověřitelné a plné divů.\n\nSkupina [foreign_merchant.GetCulture.Custom('CZ_AdjectiveNoTooltip_yych')|l] podomních obchodníků tvrdí, že přivezla #EMP [exotic_blade_holder.GetCulture.Custom('CZ_AdjectiveNoTooltip_ee')|l]#! předměty, které prý pocházejí z dalekého dvora velkého vládce, a to nikoho menšího než #EMP [exotic_blade_holder.GetFullNameNoTooltipRegnal]#!.\n\n[foreign_merchant.GetTitledFirstName], [Select_CString(foreign_merchant.IsFemale,'hlavní obchodnice','hlavní obchodník')], se temně usměje:"
 ep1_flavor.2040.desc.artifact: "„[Select_CString(foreign_merchant.IsFemale,'Viděla','Viděl')] jsem tvůj [my_artifact.GetName], rozluč se s ním a dám ti [CZGen4(exotic_blade.Custom('CZ_ArtifactTypeGender'),'tento jedinečný','tuto jedinečnou','toto jedinečné','tyto jedinečné')] [exotic_blade.Custom('CZ_ArtifactType_A')|l]...“"
 ep1_flavor.2040.desc.gold: "„[CZGen4(exotic_blade.Custom('CZ_ArtifactTypeGender'),'Tento jedinečný','Tato jedinečná','Toto jedinečné','Tyto jedinečné')] [exotic_blade.Custom('ArtifactType')|l] by [CZGen4(exotic_blade.Custom('CZ_ArtifactTypeGender'),'mohl být váš','mohla být vaše','mohlo být vaše','mohly být vaše')] — samozřejmě za zvláštní cenu — velký [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]...“\n\nVskutku věrohodné!"
 ep1_flavor.2040.desc.outro: "Kéž bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] nějakou možnost, jak historku toho šmelináře ověřit..."
 ep1_flavor.2040.desc.outro_antiquarian: "Obracím se o radu na [antiquarian.Custom('CZ_TitledFirstName_A')]:"
 ep1_flavor.2040.desc.outro_good_praise: "„Rozhodně to není padělek, [ROOT.Char.Custom('FormOfAddressForLiege')]. Toto dílo je skutečně [exotic_blade_holder.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_ee')|l] a velmi kvalitní.“"
 ep1_flavor.2040.desc.outro_good_unsure: "„S [exotic_blade_holder.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_ou')|l] prací [Select_CString(antiquarian.IsFemale,'nejsem obeznámena','nejsem obeznámen')], ale vypadá to na jemně zhotovený kus.“"
 ep1_flavor.2040.desc.outro_good_warning: "„Toto dílo nemohu doporučit, [ROOT.Char.Custom('FormOfAddressForLiege')]. Ty... důlky od kladiva jsou... zasněné.“ Přitom mi hloupě přikyvuje."
 ep1_flavor.2040.desc.outro_bad_warning: "„Ať už [exotic_blade_holder.GetPrimaryTitle.GetNameNoTierNoTooltip], nebo ne, tohle je nekvalitní kus, [ROOT.Char.Custom('FormOfAddressForLiege')]. O jeho údajném původu silně pochybuji.“"
 ep1_flavor.2040.desc.outro_bad_unsure: "„Nerad bych tvrdil něco s jistotou, ale [Select_CString(antiquarian.IsFemale,'nejsem přesvědčená','nejsem přesvědčený')], že tento předmět je tím, za co se vydává.“"
 ep1_flavor.2040.desc.outro_bad_praise: "„Jaká vynikající řemeslná práce [CZPrepZ(exotic_blade_holder.GetPrimaryTitle.GetNameNoTierNoTooltip)] [exotic_blade_holder.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')]! Jen se podívejte, jak se to leskne!“"
 ep1_flavor.2040.a: "„Předpokládám, že se ho mohu vzdát...“"
 ep1_flavor.2040.tt_my: "Přijdeš o [my_artifact.GetName]"
 ep1_flavor.2040.tt_exotic: "Předmět [exotic_blade.GetNameNoTooltip] připadne tobě"
 ep1_flavor.2040.toast: "[CZGen4(exotic_blade.Custom('CZ_ArtifactTypeGender'),'Tento','Tato','Toto','Tyto')] [exotic_blade.Custom('ArtifactType')|l] [CZGen4(exotic_blade.Custom('CZ_ArtifactTypeGender'),'je skvostný','je skvostná','je skvostné','jsou skvostné')]"
 ep1_flavor.2040.toast_poor: "[CZGen4(exotic_blade.Custom('CZ_ArtifactTypeGender'),'Tento','Tato','Toto','Tyto')] [exotic_blade.Custom('ArtifactType')|l] [CZGen4(exotic_blade.Custom('CZ_ArtifactTypeGender'),'je podprůměrný','je podprůměrná','je podprůměrné','jsou podprůměrné')]"
 ep1_flavor.2040.b: "„Přineste můj měšec!“"
 ep1_flavor.2040.c: "„Ha! '#EMP [exotic_blade_holder.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip]#!'... jaký nesmysl! Pryč s vámi!“"
 ep1_flavor.2060.t: "Větší dobro"
 ep1_flavor.2060.desc: "[detective_scope.GetFirstName], [Select_CString(detective_scope.IsFemale,'podřízená','podřízený')] místního [sandford_scope.GetTitle.GetHolder.Custom('CZ_TitleAsNameNoTooltip_G')], žádá o soukromé slyšení a tvrdí, že ví, kdo stojí za nedávným zmizením [victim_scope.Custom('CZ_TitledFirstName_G')] a dalších pocestných mířících k mému dvoru.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]! [Select_CString(detective_scope.IsFemale,'Odhalila','Odhalil')] jsem tajný spolek, v jehož čele [Select_CString(grocer_scope.IsFemale,'stojí obchodnice','stojí obchodník')] [grocer_scope.GetTitledFirstName]. Říkají si [ROOT.Char.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_aa')|U] stráž a ti, které obviní, že kazí velkolepost naší říše, brzy často zmizí!“\n\nKdyž si [Select_CString(grocer_scope.IsFemale,'obchodnici','obchodníka')] předvolám, vše popře a tvrdí, že [Select_CString(detective_scope.IsFemale,'ta žena','ten muž')] blouzní po příliš mnoha letech strávených v drsných ulicích [CZProvNameNoTooltip(ROOT.Char.GetCapitalLocation,'G')]..."
 ep1_flavor.2060.a: "„Jsem si [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')], že existuje nějaké... rozumné vysvětlení.“"
 ep1_flavor.2060.a.tt: "[detective_scope.GetFirstName] a [grocer_scope.GetFirstName] odcházejí"
 ep1_flavor.2060.b: "„Zatkni [grocer_scope.Custom('CZ_FirstNameNoTooltip_A')] a pak přijď pracovat pro mě!“"
 ep1_flavor.2060.b.title: "Zatracený šťoural"
 ep1_flavor.2060.c: "„Škoda, že ses do toho [Select_CString(detective_scope.IsFemale,'musela','musel')] plést, [detective_scope.Custom('CZ_FirstNameNoTooltip_V')]...“"
 ep1_flavor.2060.c.title: "Vrahy se dopadnout nepodařilo"
 ep1_flavor.2060.death_tt: "[victim_scope.GetName] záhadně [Select_CString(victim_scope.IsFemale,'zmizela','zmizel')]"
 ep1_flavor.2070.t: "Když se střetávají mysli"
 ep1_flavor.2070.desc.intro: "Když procházím kolem knihovny, upoutá mě hlasitá nespokojenost [symposium_courtier.Custom('CZ_TitledFirstName_G')]. Pře se s [symposium_scholar.Custom('CZ_TitledFirstName_I')], [Select_CString(symposium_scholar.IsFemale,'hostující učenkyní','hostujícím učencem')] jistého věhlasu.\n\n"
 ep1_flavor.2070.desc.theo_same_faith: "„Děláte stejné chyby jako [CZFaithAdjSti(symposium_courtier.GetFaith)] novicové,“ ohrnuje nos [symposium_courtier.GetFirstNameNoTooltip], „tohle je opravdu cesta k herezi.“\n\n„Ale no tak,“ přemlouvá [Select_CString(symposium_scholar.IsFemale,'ta žena','ten muž')], „[symposium_scholar.GetFaith.HighGodName] jistě nechtěl, aby bylo učení tak neměnné, zvlášť když jeho výklad ponechal na nás.“"
 ep1_flavor.2070.desc.theo_same_faith_diff_cult: "„Netušil[Select_CString(symposium_courtier.IsFemale,'a','')] jsem, jak moc se [symposium_courtier.GetFaith.GetNameNoTooltip] v [symposium_ruler.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')] odchýlila od původního učení!“ ušklíbne se [symposium_courtier.GetFirstNameNoTooltip].\n\n„Nesmysl,“ zahrozí prstem [Select_CString(symposium_scholar.IsFemale,'ta žena','ten muž')], „to [symposium_courtier.GetFaith.GetAdherentNamePluralNoTooltip] s kulturou [symposium_courtier.GetCulture.GetNameNoTooltip|l] sešli z cesty a vracejí se k pohanským zvykům.“"
 ep1_flavor.2070.desc.theo_same_relig: "„Rozdíly mezi vírami [symposium_courtier.GetFaith.GetNameNoTooltip] a [symposium_scholar.GetFaith.GetNameNoTooltip] nejsou jen technické,“ poučuje [symposium_courtier.GetFirstNameNoTooltip], „vaše hereze se odchýlila od pravého učení.“\n\n„Skutečnou podstatu náboženství [symposium_courtier.GetFaith.GetReligion.GetNameNoTooltip] obsahují obě víry,“ prohlásí vážně [Select_CString(symposium_scholar.IsFemale,'ta žena','ten muž')], „jen nevědomí dělají z potůčků propasti.“"
 ep1_flavor.2070.desc.theo_diff_relig: "„Nikdy jsem nerozuměl[Select_CString(symposium_courtier.IsFemale,'a','')] [CZReligionAdjDecline(symposium_scholar.GetFaith.GetReligion,'ému')] učení,“ přemítá [symposium_courtier.GetFirstNameNoTooltip], „[symposium_scholar.GetFaith.HighGodName] mi ve srovnání s pravou vírou připadá tak nepřesvědčivý.“\n\n[Select_CString(symposium_scholar.IsFemale,'Ta žena','Ten muž')] se sarkasticky usměje: „Jak hluboké porozumění! Kdybyste byl[Select_CString(symposium_courtier.IsFemale,'a','')] [symposium_scholar.GetFaith.BishopNeuter], jistě byste dosáhl[Select_CString(symposium_courtier.IsFemale,'a','')] spásy!“"
 ep1_flavor.2070.desc.mystic: "„Těmto esoterickým praktikám tady není místo,“ přísně kárá [symposium_courtier.GetFirstNameNoTooltip], „je to jen kouř a zrcadla a schovávání se za tajemství.“\n\n[Select_CString(symposium_scholar.IsFemale,'Ta žena','Ten muž')] se pohrdavě usměje: „Jen se bojíte toho, čemu nerozumíte, a chybí vám odvaha či rozum se to naučit.“"
 ep1_flavor.2070.desc.medicine: "„Lékař má své využití, ale poslední slovo nad životem a smrtí má [symposium_courtier.GetFaith.HighGodName],“ naříká [symposium_courtier.GetFirstNameNoTooltip], „žádný obklad duši nevyléčí.“\n\n„Vidím, že lékařství nerozumíte,“ povzdechne si [Select_CString(symposium_scholar.IsFemale,'ta žena','ten muž')], „kdyby nebylo takové nevědomosti, mohlo být zachráněno tolik lidí.“"
 ep1_flavor.2070.desc.ling_same_cult: "„[ROOT.Char.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_ee')|U] písmo je mnohem rozvinutější než cokoli [CZPrepV(symposium_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip)] [symposium_ruler.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')],“ zívá [symposium_courtier.GetFirstNameNoTooltip], „až budeš odcházet, musíš si s sebou vzít nějaké knihy.“\n\n„Je neuvěřitelné, jak moc se někdo může mýlit,“ odfrkne si [Select_CString(symposium_scholar.IsFemale,'ta žena','ten muž')], „a přitom to tvrdit s takovou jistotou...“"
 ep1_flavor.2070.desc.ling_diff_cult: "„Pro [symposium_courtier.GetFaith.HighGodName], poslouchej se!“ ošklíbne se [symposium_courtier.GetFirstNameNoTooltip]. „Tohle nářečí zohavuje krásný jazyk [symposium_courtier.GetCulture.GetLanguage.GetNameNoTooltip|l], to bys rovnou mohl[Select_CString(symposium_scholar.IsFemale,'a','')] mluvit jazykem [ling_cul_1_bonus.GetLanguage.GetNameNoTooltip|l]!“\n\n[symposium_scholar.GetFirstNameNoTooltip] se ovládne: „Dvůr i jazyk [symposium_ruler.Custom('CZ_TitledFirstName_G')] jsou mnohem čistší než tahle ubohá napodobenina vlády.“"
 ep1_flavor.2070.desc.ling_diff_lang: "„Tvůj cizí jazyk postrádá nuance, aby se v něm o těchto myšlenkách dalo mluvit,“ prohlásí pohrdavě [symposium_courtier.GetFirstNameNoTooltip], „proto ses samozřejmě [Select_CString(symposium_scholar.IsFemale,'naučila','naučil')] jazyk #EMP [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip|l]#!.“\n\n[Select_CString(symposium_scholar.IsFemale,'Ta žena','Ten muž')] protočí oči a pohrdavě si pod vousy zamumlá několik kleteb v jazyce [symposium_scholar.GetCulture.GetLanguage.GetNameNoTooltip|l]."
 ep1_flavor.2070.desc.fall_alchemy: "„Tenhle poměr by nikdy nefungoval,“ kroutí hlavou [symposium_courtier.GetFirstNameNoTooltip] a zkoumá škrábance na kousku kůry. „Tohle už všechno někdo zkoušel.“\n\n[Select_CString(symposium_scholar.IsFemale,'Ta žena','Ten muž')] odpoví: „Každý dělá chyby – i alchymisté – možná něco přehlédli.“"
 ep1_flavor.2070.desc.fall_stars: "„Ne, ne, ne! Tyhle teorie byly vyvráceny už před staletími,“ mračí se [symposium_courtier.GetFirstNameNoTooltip] v upřímném úžasu, „copak jsi [Select_CString(symposium_scholar.IsFemale,'nečetla','nečetl')] klasická díla o astronomii?“\n\n„Ty čteš, místo abys přemýšlel[Select_CString(symposium_courtier.IsFemale,'a','')],“ odsekne [Select_CString(symposium_scholar.IsFemale,'ta žena','ten muž')], „pořád se máme hodně co učit.“"
 ep1_flavor.2070.desc.fall_books: "„Evidentně jsi #EMP četl[Select_CString(symposium_scholar.IsFemale,'a','')]#! špatné knihy,“ mávne rukou [symposium_courtier.GetFirstNameNoTooltip], „dám ti seznam doporučené četby...“\n\n„To nebude nutné,“ odpoví klidně [Select_CString(symposium_scholar.IsFemale,'ta žena','ten muž')], „v nich toho #EMP evidentně#! moc není.“"
 ep1_flavor.2070.a: "„Nezůstal[Select_CString(symposium_scholar.IsFemale,'a','')] bys tu ještě chvíli, [symposium_scholar.Custom('CZ_FirstNameNoTooltip_V')]?“"
 ep1_flavor.2070.c: "„Mýlíš se: a tady je proč.“"
 ep1_flavor.2070.c.lang: "„Řekl[Select_CString(symposium_scholar.IsFemale,'a','')] jsi právě to, co si myslím?“"
 ep1_flavor.2070.c.success: "Dokážeš, že se [symposium_scholar.GetFirstNameNoTooltip] mýlí"
 ep1_flavor.2070.c.failure: "[symposium_scholar.GetFirstNameNoTooltip] tě ztrapní"
 ep1_flavor.2070.c.tt: "[symposium_scholar.GetFirstNameNoTooltip] se může připojit k tvému dvoru"
 ep1_flavor.2070.d: "„Myslím, že je čas, abyste [Select_CString(symposium_scholar.IsFemale,'odešla','odešel')].“"
 ep1_flavor.2070.e: "Pryč, rouhači!"
