 ep1_flavor.2020.t: "Rivalita vojenských složek"
 ep1_flavor.2020.desc: "Trocha zdravé soutěživosti mezi vojáky je přirozená, ale rivalita mezi mými oddíly – [SCOPE.Custom('GetMAAType1')] na jedné straně a [SCOPE.Custom('GetMAAType2')] na druhé – je markantní.\n\nOdráží se to v rostoucím nepřátelství mezi jejich veliteli. [ROOT.Char.Custom('MountedWarriorTermPlural')|U] [knight_1.GetTitledFirstName] a [knight_2.GetTitledFirstName] se přede mnou opět hašteří.\n\n"
 ep1_flavor.2020.desc_knight_1_archers: "„...doufejme, že ti nedojdou šípy; to bys pak #EMP doopravdy#! [Select_CString(knight_2.IsFemale,'musela','musel')] bojovat!“"
 ep1_flavor.2020.desc_knight_1_light_cavalry: "„...útočit a utíkat, že? Připadá mi to spíš jako #EMP uhni a uteč#!.“"
 ep1_flavor.2020.desc_knight_1_heavy_infantry: "„...jak jsi #EMP [Select_CString(knight_2.IsFemale,'statečná','statečný')]#!, když jsi od hlavy až k patě ve zbroji!“"
 ep1_flavor.2020.desc_knight_1_pikemen: "„...copak, bojíš se, že se k tobě nepřítel dostane příliš #EMP blízko#!?“"
 ep1_flavor.2020.desc_knight_1_heavy_cavalry: "„...chápu: Proč se #EMP prát#! s nepřítelem, když je můžeš prostě rozšlapat?“"
 ep1_flavor.2020.desc_knight_1_archer_cavalry: "„...[Select_CString(knight_2.IsFemale,'viděla','viděl')] jsi vůbec někdy #EMP doopravdy#! nepřítele, když se pohybuješ tak rychle a tak daleko?“"
 ep1_flavor.2020.desc_knight_1_skirmishers: "„...trénuješ zase, jak je připravit pro #EMP opravdové#! bojovníky?“"
 ep1_flavor.2020.desc_knight_1_elephant_cavalry: "„...co, jen slon? Nechceš jezdit na něčem #EMP větším#!?“"
 ep1_flavor.2020.desc_knight_1_camel_cavalry: "„Pouštní koně? Spíš #EMP krávy#!, jestli chceš znát můj názor.“"
 ep1_flavor.2020.desc_bridge: "[knight_2.GetFirstNameNoTooltip] se šklebí, než [knight_1.GetFirstNameNoTooltip] zlomyslně odsekne:"
 ep1_flavor.2020.desc_knight_2_archers: "„Ale prosím tě, od přerostlého lovce si lekce boje dávat nenechám.“"
 ep1_flavor.2020.desc_knight_2_light_cavalry: "„Jo, to má opravdu velkou váhu, když to říká nafoukaný #EMP hlídkář#!.“"
 ep1_flavor.2020.desc_knight_2_heavy_infantry: "„To se ti to řekne, když máš na sobě tak #EMP silnou#! kroužkovou zbroj.“"
 ep1_flavor.2020.desc_knight_2_pikemen: "„Ale jdi, schovej se za svou zeď jehlic, hlupáku.“"
 ep1_flavor.2020.desc_knight_2_heavy_cavalry: "„Pche, [Select_CString(knight_1.IsFemale,'ztratila','ztratil')] jsi soudnost, tam nahoře na obrovském válečném koni.“"
 ep1_flavor.2020.desc_knight_2_archer_cavalry: "„Od pomateného #EMP krotitele koní#! s lukem si kázat nenechám.“"
 ep1_flavor.2020.desc_knight_2_skirmishers: "„Přijď si se mnou promluvit, až vůbec tasíš meč, natož abys ho [Select_CString(knight_1.IsFemale,'použila','použil')].“"
 ep1_flavor.2020.desc_knight_2_elephant_cavalry: "„To říká [Select_CString(knight_2.IsFemale,'ta, která','ten, který')] jezdí na obrovské obludě s klem.“"
 ep1_flavor.2020.desc_knight_2_camel_cavalry: "„Uf, drž se ode mě dál, smrad velblouda je nesnesitelný.“"
 ep1_flavor.2020.a: "„[SCOPE.Custom('GetMAAType1')] jsou naší páteří!“"
 ep1_flavor.2020.b: "„Bez našich [SCOPE.Custom('GetMAAType2')] nejsme nic!“"
 ep1_flavor.2020.c: "„K čemu je jeden bez druhého?“"
 ep1_flavor.2020.c.success: "Tvůj argument je přesvědčivý"
 ep1_flavor.2020.c.failure: "Tvůj argument neobstál"
 ep1_flavor.2020.d: "„Tak už s tím přestaňte, vy dva.“"
 ep1_flavor_2020_both_modifier: "Vojenské uznání"
 ep1_flavor_2020_both_modifier_desc: "Rytíři této postavy jsou motivováni tím, že jejich pán uznal důležitost jejich vojsk."
