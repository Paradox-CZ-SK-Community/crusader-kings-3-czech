l_polish:
 tradition_header: "Tradice:"
 ep1_flavor.1000.t: "$tradition_header$ Návštěva eunucha"
 ep1_flavor.1000.desc: "Dnes se na mém dvoře představuje potulný eunuch.\n\n„Zdravím vás, ó [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitleTierName],“ praví uctivě.\n\n„Jmenuji se [eunuch_target.GetFirstName] a jsem poutník jistého věhlasu – propůjčoval jsem své vědomosti urozeným králům-učencům a pečoval o harémy velkých sultánů – a nyní jsem zde a nabízím své služby vám. Za skromný poplatek.“\n\nZajímavá postava. Možná bych ho [Select_CString(ROOT.Char.IsFemale,'měla','měl')] zaměstnat?"
 ep1_flavor.1000.a: "Férová nabídka, přijímám."
 ep1_flavor.1000.b: "[eunuch_target.GetFirstNameNoTooltip], můj [eunuch_target.Custom('ComplimentAdjective')] příteli, zůstaň o něco déle?"
 ep1_flavor.1000.c: "Vašich služeb nepotřebuji."
 eunuch_moves_tt: "[eunuch_target.GetFirstNameNoTooltip] odchází do [new_court.GetBaseName]"
 ep1_flavor.1000.c.success: "Přesvědčíš [eunuch_target.Custom('CZ_FirstNameNoTooltip_A')], aby zůstal"
 ep1_flavor.1000.c.failure: "[eunuch_target.GetFirstNameNoTooltip] tě označí za skrblíka a odchází"
 ep1_flavor.1200.t: "$tradition_header$ Triky řemesla"
 ep1_flavor.1200.desc: "Eunuch [eunuch_target.GetFirstName] vstoupí do mého zorného pole, [eunuch_target.Custom('quirk_pos_pp')].\n\n„Víte mnoho věcí, veliký [ROOT.Char.GetTitleTierName]. Existují však věci, které unikají i vaší nevyzpytatelné mysli – tajemství a vědění, o která se s vámi rád podělím,“ zašeptá.\n\n„Za odměnu.“\n\nSamozřejmě. Přesto mě to zaujalo."
 ep1_flavor.1200.a: "[Select_CString(ROOT.Char.IsFemale,'Slyšela','Slyšel')] jsem, že znáte tajemství jazyka?"
 ep1_flavor.1200.b: "Mám mnoho nepřátel. Jak je přemohu?"
 ep1_flavor.1200.c: "Mé panství musí prosperovat. Jak toho dosáhnu?"
 ep1_flavor.1200.d: "Šarlatáne! Tvá tajemství jsou pouhé výmysly."
 secrets_of_language_modifier: "Tajemství jazyka"
 secrets_of_language_modifier_desc: "Tato postava byla zasvěcena do tajemství týkajících se osvojování jazyků."
 secrets_of_murder_modifier: "Tajemství pomsty"
 secrets_of_murder_modifier_desc: "Tato postava byla zasvěcena do tajemství týkajících se zničení nepřátel."
 secrets_of_the_realm_modifier: "Tajemství panství"
 secrets_of_the_realm_modifier_desc: "Tato postava byla zasvěcena do tajemství týkajících se správy hlavního města."
 ep1_flavor.0001.t: "[Select_CString(scion_actual.IsFemale,'Tajná dcera','Tajný syn')]"
 ep1_flavor.0001.desc: "Drobná obchodní záležitost ve městě zavede mě i mou žíznivou a hladovou družinu do malé zakouřené krčmy.\n\nZe všech lidí bych nejméně [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')], že tu vzadu narazím na [scion_parent.Custom('CZ_TitledFirstName_A')], [Select_CString(scion_parent.IsFemale,'chabě přestrojenou','chabě přestrojeného')] do pláště s kapucí. Vedle [Select_CString(scion_parent.IsFemale,'ní','něj')] sedí [Select_CString(scion_actual.IsFemale,'mladá žena, která','mladý muž, který')]... to přece nemůže být!\n\nPodle [Select_CString(scion_actual.IsFemale,'její','jeho')] tváře, podle toho, jak se s úžasem rozhlíží po místnosti, a podle toho, jak napodobuje typická gesta [scion_parent.Custom('CZ_FirstNameNoTooltip_G')], jsem [Select_CString(ROOT.Char.IsFemale,'přesvědčená','přesvědčený')], že jde o [Select_CString(scion_actual.IsFemale,'tajnou nemanželskou dceru','tajného nemanželského syna')] [scion_parent.Custom('CZ_TitleAsNameNoTooltip_G')], [Select_CString(scion_actual.IsFemale,'která','který')] možná poprvé vidí svět venku."
 ep1_flavor.0001.a: "[scion_parent.GetFirstNameNoTooltip]! [Select_CString(scion_parent.IsFemale,'Přivedla','Přivedl')] jsi mi [Select_CString(scion_actual.IsFemale,'nevěstu','ženicha')]?"
 ep1_flavor.0001.a.tt.success: "Vynutíš si [Concept('marriage','sňatkovou')|E] [Concept('alliance','alianci')|E]"
 ep1_flavor.0001.a.tt.failure: "[scion_parent.GetFirstNameNoTooltip] uprchne [Select_CString(scion_actual.IsFemale,'se svou dcerou','se svým synem')]"
 ep1_flavor.0001.b: "[scion_parent.GetFirstNameNoTooltip]! [Select_CString(scion_parent.IsFemale,'Přivedla','Přivedl')] jsi [Select_CString(scion_actual.IsFemale,'nevěstu','ženicha')] pro [prospective_spouse.Custom('CZ_FirstNameNoTooltip_A')]?"
 ep1_flavor.0001.c: "Přiveď městského hlásatele, #EMP okamžitě#!!"
 ep1_flavor.0001.c.tt.success: "Najdeš dost důkazů, abys prokázal[Select_CString(ROOT.Char.IsFemale,'a','')] existenci nemanželského dítěte"
 ep1_flavor.0001.c.tt.failure: "[scion_parent.GetFirstNameNoTooltip] zakryje své stopy příliš dobře"
 ep1_flavor.0001.d: "Neboj se, [Select_CString(scion_parent.IsFemale,'má','můj')] [scion_parent.Custom('CZ_TitleAsNameNoTooltip_V')], můžeš se spolehnout, že na to zapomenu..."
 ep1_flavor.0001.tt.scion_escapes: "[scion_actual.GetFirstName] [Select_CString(scion_actual.IsFemale,'je odvezena','je odvezen')] do ústraní a už o [Select_CString(scion_actual.IsFemale,'ní','něm')] nikdy neuslyšíš"
 ep1_flavor.0001.e.no_bastards: "Tajné dítě? Jak divné. Najíme se jinde."
 ep1_flavor.0001.e.fallback: "To není naše věc. Najíme se jinde."
 ep1_flavor.0011.t: "Naprostý zmatek"
 ep1_flavor.0011.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], není to, jak to vypadá!“ volá [diplomat_1.GetTitledFirstName], když vcházím do své oblíbené jídelny.\n\n#EMP Vypadá#! to tak, že místnost úplně [Select_CString(diplomat_1.IsFemale,'zdemolovala','zdemoloval')]. Stěny jsou obalené jídlem, ze stolů zbyly třísky, někdo naskládal všechny židle do pyramidy a na jedné z #EMP mých#! postelí leží na zádech v bezvědomí [Select_CString(diplomat_2.IsFemale,'polévkou politá','polévkou politý')] [diplomat_2.GetTitledFirstName] (zcela [Select_CString(diplomat_2.IsFemale,'nahá','nahý')]).\n\nOba diplomaté přijeli teprve včera. [Select_CString(ROOT.Char.IsFemale,'Dovolila','Dovolil')] jsem jim pořádně se najíst a trochu se pobavit, ne uspořádat pekelný mejdan, který by vzbudil i mrtvé."
 ep1_flavor.0011.a: "Za ty škody zaplatíte, vy podlézaví psi!"
 ep1_flavor.0011.b: "Dobře, zdemolovali jste to, tak si to i ukliďte. SLUHOVÉ! Hadr!"
 ep1_flavor.0011.c: "Ale kdeže, tahle oslava ještě nekončí: dolijte mi někdo pohár!"
 ep1_flavor.0011.d: "Jedna noc? Ubohé! Dělejte místo pro Párty [ROOT.Char.GetTitleAsNameNoTooltip]!"
 ep1_flavor.0011.e: "Beze slova opustit sál."
 ep1_flavor.0011.e.tt: "Necháš je oba dusit se ve vlastním strachu"
 ep1_flavor.0021.t: "Dvě říše rozdělené dvorním jazykem"
 ep1_flavor.0021.desc: "Když vejdu do komnaty, uvítá mě chichotání: hlouček dvořanů v čele s [nitpicker.Custom('CZ_TitledFirstName_I')] se tlačí kolem čerstvého dopisu od [rival_monarch.Custom('CZ_TitledFirstName_G')].\n\n[nitpicker.GetFirstNameNoTooltip] mi se smíchem kyne, ať přijdu blíž.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], tohle si #EMP musíte#! přečíst! Je to opatřeno oficiální pečetí [rival_realm.Custom('CZ_LandedNameNoTier_G')], ale každé druhé slovo je napsané, jako by to psal negramotný sedlák. Ti roztržití lenoši neumějí ani správné souhlásky, natož aby pořádně ovládali jazyk [ROOT.Char.GetCourtLanguage.GetName|l], a je to #EMP k popukání#!.“"
 ep1_flavor.0021.a: "Tato zpráva postrádá polovinu samohlásek! Ohavné!"
 ep1_flavor.0021.a.tt: "Oba [Concept('courts','dvory')|E] o sobě navzájem ztrácejí [SCOPE.ScriptValue('ep1_flavour_0021_courts_lose_opinion_value')|N0] [Concept('opinion','mínění')|E]"
 ep1_flavor.0021.a.tt.success: "[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip|U] pravopis je nejlepší!"
 ep1_flavor.0021.a.tt.failure: "[rival_monarch.GetPrimaryTitle.GetAdjectiveNoTooltip|U] pravopis je nejlepší!"
 ep1_flavor.0021.b: "Nejsou to snad naši jazykoví příbuzní?"
 ep1_flavor.0021.b.tt: "Oba [Concept('courts','dvory')|E] o sobě navzájem získávají [SCOPE.ScriptValue('ep1_flavour_0021_courts_gain_opinion_value')|P0] [Concept('opinion','mínění')|E]"
 ep1_flavor.0021.c: "Dva urozené dvory a mezi nimi ani špetka rozumu..."
 ep1_flavor.0021.c.tt: "$ep1_flavor.0021.a.tt$"
 cultural_acceptance_courtly_spelling_differences: "Šlechtické hádky o pravopisu"
 cultural_acceptance_courtly_cousins: "Šlechta se sblíží díky společnému dvornímu jazyku"
 ep1_flavor.0031.t: "Nováčci u dvora"
 ep1_flavor.0031.desc: "Dobře se říká, že velké mysli potřebují velké tradice, a žádné akademické zasvěcovací tradice nejsou větší než ty [CZPrepV(ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip)] [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_L')]!\n\nTento týden u dvora přijímáme několik nových nadaných učenců ze všech koutů říše a každý z nich teď v místní krčmě podstupuje různé #EMP akademické#! zkoušky.\n\nMůj pohled padne na [scholar_1.Custom('CZ_FirstName_A')], [Select_CString(scholar_1.IsFemale,'která','který')] podezíravě pozoruje tajemný, pěnivý a syčivý nápoj, který stojí před [Select_CString(scholar_1.IsFemale,'ní','ním')]. Za [Select_CString(scholar_1.IsFemale,'opatrnou učenkyní','opatrným učencem')] [scholar_2.GetFirstName] dolévá do celého #EMP džbánu#! cosi hustého a mazlavého za jásotu i posměšků [Select_CString(scholar_2.IsFemale,'svých','svých')] kolegů."
 ep1_flavor.0031.a: "Dopij to, [scholar_1.GetFirstNameNoTooltip]!"
 ep1_flavor.0031.b: "S [scholar_2.Custom('CZ_FirstNameNoTooltip_I')] pijeme rádi, protože [scholar_2.GetFirstNameNoTooltip] je [Select_CString(scholar_2.IsFemale,'naše kámoška','náš kámoš')]!"
 ep1_flavor.0031.c: "Existují techniky, které může naučit jen zkušenost..."
 ep1_flavor.0031.c.tt: "Ukážeš nováčkům, jak se to dělá"
 ep1_flavor.0031.d: "Tyto rituály jsou #EMP nevhodné#! pro učence."
 ep1_flavor.0031.inspire.scholar_1.tt: "[scholar_1.GetFirstNameNoTooltip] získá [Concept('inspiration','inspiraci')|E]"
 ep1_flavor.0031.inspire.scholar_2.tt: "[scholar_2.GetFirstNameNoTooltip] získá [Concept('inspiration','inspiraci')|E]"
 ep1_flavor.2000.t: "Vojenské cvičení"
 ep1_flavor.2000.desc_intro: "Při prohlídce místního vojenského tábora je jasné, že se mě [marshal_scope.GetTitledFirstName] a [knight_scope.GetTitledFirstName] snaží zahnat do kouta.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], když panuje mír, muži zahálejí. Nějaké činnosti by je udržely v kondici...“ naléhá můj [marshal_scope.GetCouncilTitle]."
 ep1_flavor.2000.desc_archers: "„[ROOT.Char.Custom('GetRegionalArcherMAA')|U] jsou nenahraditelní, měli bychom zajistit, aby jejich šípy vždy zasáhly cíl.“"
 ep1_flavor.2000.desc_infantry: "„Naši [ROOT.Char.Custom('GetRegionalInfantryMAA')|l] jsou klíčem k vítězství, nesmíme jim dovolit zeslábnout.“"
 ep1_flavor.2000.desc_cavalry: "„Vaše [ROOT.Char.Custom('GetRegionalCavalryMAA')|l] jsou nejcennější; nenechte je zlenivět.“"
 ep1_flavor.2000.desc_archer_cavalry: "„Jízdní lučištníci jsou naší páteří; soutěže ve střelbě z koně je udrží obávanými.“"
 ep1_flavor.2000.desc_skirmishers: "„Naši talentovaní [ROOT.Char.Custom('GetRegionalSkirmisherMAA')|l] musí soutěžit, aby vždy zasahovali cíl.“"
 ep1_flavor.2000.desc_elephant_cavalry: "„Děsiví sloni nám přinášejí vítězství; musí být stále připraveni.“"
 ep1_flavor.2000.desc_camel_cavalry: "„Důležití jezdci na velbloudech jsou jádrem vaší síly; musíte se na ně zaměřit.“"
 ep1_flavor.2000.desc_levies: "„Chudý lid potřebuje činnost, aby byl zdatný a užitečný, až bude povolán.“"
 ep1_flavor.2000.desc_bridge: "\n\n„Ne, je třeba se zaměřit jinam,“ skočí do řeči [knight_scope.GetFirstNameNoTooltip],"
 ep1_flavor.2000.desc_outro: "\n\nPředpokládám, že praxe #EMP skutečně#! dělá mistra..."
 ep1_flavor.2000.c: "„Sport je pro šlechtu a jmenuje se lov.“"
 ep1_flavor.2000.culture_tt: "Každý dvořan a vazal [THIS.Char.GetCulture.Custom('CZ_Adjective_ee')|l] kultury"
 ep1_flavor.2000.knight_tt: "Každý [THIS.Char.Custom('MountedWarriorTerm')|U]"
 ep1_flavor.2000.d: "„Na vojáky už takhle dost utrácím.“"
 ep1_flavor.2000.archers: "„Cvičte, dokud všichni nebudou trefovat střed terče.“"
 ep1_flavor.2000.archers_longbow: "„Muži i chlapci budou cvičit s dlouhým lukem na terči.“"
 ep1_flavor.2000.infantry: "„[ROOT.Char.Custom('GetRegionalInfantryMAA')|U] milují pořádnou bitku.“"
 ep1_flavor.2000.cavalry: "„Přineste kolíky od stanů! [ROOT.Char.Custom('GetRegionalCavalryMAA')|U] budou soutěžit v jízdě!“"
 ep1_flavor.2000.cavalry_joust: "„Klání vyžaduje dobrou techniku.“"
 ep1_flavor.2000.cavalry_tzykanion: "„Jezdci budou hrát tyzkanion!“"
 ep1_flavor.2000.cavalry_chovgan: "„Nechte je hrát chovgan!“"
 ep1_flavor.2000.archer_cavalry: "„Pánové koní budou trénovat na běžících králících.“"
 ep1_flavor.2000.skirmishers: "„Moji [ROOT.Char.Custom('GetRegionalInfantryMAA')|l] nikdy netrefí vedle.“"
 ep1_flavor.2000.elephant_cavalry: "„Mahúti budou soupeřit o slávu!“"
 ep1_flavor.2000.camel_cavalry: "Závody zdokonalí dovednosti jezdců na velbloudech."
 ep1_flavor.2000.levies_caid: "„Každý muž i žena bude kopat do caidu!“"
 ep1_flavor.2000.levies: "„Povzbuzujte prostý lid, aby zůstal hbitý.“"
 ep1_2000_archer_modifier: "Mistři lučištníci"
 ep1_2000_archer_modifier_desc: "$ep1_2000_generic_modifier_desc$"
 ep1_2000_infantry_modifier: "Cvičení pěšáci"
 ep1_2000_infantry_modifier_desc: "$ep1_2000_generic_modifier_desc$"
 ep1_2000_cavalry_modifier: "Zkušení jezdci"
 ep1_2000_cavalry_modifier_desc: "$ep1_2000_generic_modifier_desc$"
 ep1_2000_acavalry_modifier: "Obávaní nomádi"
 ep1_2000_acavalry_modifier_desc: "$ep1_2000_generic_modifier_desc$"
 ep1_2000_skirmisher_modifier: "Elitní lehká pěchota"
 ep1_2000_skirmisher_modifier_desc: "$ep1_2000_generic_modifier_desc$"
 ep1_2000_ecavalry_modifier: "Sloní hry"
 ep1_2000_ecavalry_modifier_desc: "$ep1_2000_generic_modifier_desc$"
 ep1_2000_ccavalry_modifier: "Závody na velbloudech"
 ep1_2000_ccavalry_modifier_desc: "$ep1_2000_generic_modifier_desc$"
 ep1_2000_levies_modifier: "Aktivní sedláci"
 ep1_2000_levies_modifier_desc: "$ep1_2000_generic_modifier_desc$"
 ep1_2000_knights_modifier: "Sponzorované honby"
 ep1_2000_knights_modifier_desc: "$ep1_2000_generic_modifier_desc$"
 ep1_2000_generic_modifier_desc: "Tato postava podporovala vojenské sporty, aby klíčoví bojovníci byli vždy připraveni."
 infantry: "pěchota"
 cavalry: "jízda"
 ep1_flavor.2000.tradition_tt: "Díky [Concept('traditions','tradicím')|E] tvé [Concept('culture_possessive','kultury')|E]"
 ep1_flavor.2010.t: "Dvůr zmijí"
 ep1_flavor.2010.desc: "Každou noc, jakmile zhasnou svíce a temný [ROOT.Char.Custom('FortifiedBuilding')] utichne, obchází komnatami šepot o spiknutí proti mně: [real_plot.GetSchemeType.GetTypeNameNoTooltip|l]."
 ep1_flavor.2010.desc_spy_real: "[spymaster.GetCouncilTitleFirstName] si je zřejmě [Select_CString(spymaster.IsFemale,'jistá','jistý')], že za tím stojí můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('real_plotter'))], [real_plotter.GetTitledFirstName]... \n\n"
 ep1_flavor.2010.desc_spy_1: "[spymaster.GetCouncilTitleFirstName] tvrdí, že za tím pravděpodobně, #EMP možná#! stojí můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scapegoat_1'))], [scapegoat_1.GetTitledFirstName]... \n\n"
 ep1_flavor.2010.desc_spy_2: "[spymaster.GetCouncilTitleFirstName] je tak napůl [Select_CString(spymaster.IsFemale,'přesvědčená','přesvědčený')], že za tím stojí můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scapegoat_2'))], [scapegoat_2.GetTitledFirstName]... \n\n"
 ep1_flavor.2010.desc_1_real: "[councillor_1.GetCouncilTitleFirstName] mezi čtyřma očima nesouhlasí a tvrdí, že na vině je [real_plotter.GetTitledFirstName], můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('real_plotter'))], zatímco"
 ep1_flavor.2010.desc_1_1: "[councillor_1.GetCouncilTitleFirstName] mezi čtyřma očima nesouhlasí a tvrdí, že by stálo za to prošetřit zápach [scapegoat_1.Custom('CZ_TitledFirstName_G')], mého [ROOT.Char.Custom2('CZ_RelationToMeShort_G', SCOPE.sC('scapegoat_1'))], zatímco"
 ep1_flavor.2010.desc_1_2: "[councillor_1.GetCouncilTitleFirstName] mezi čtyřma očima nesouhlasí a tvrdí, že [scapegoat_2.GetTitledFirstName], můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scapegoat_2'))], se chová podezřele, zatímco"
 ep1_flavor.2010.desc_2_real: "[councillor_2.GetCouncilTitleFirstName] mě naléhavě žádá, abych [Select_CString(ROOT.Char.IsFemale,'uvěznila','uvěznil')] svého [ROOT.Char.Custom2('CZ_RelationToMeShort_A', SCOPE.sC('real_plotter'))] [real_plotter.Custom('CZ_TitledFirstName_A')], „zjevného zrádce“, dřív než bude pozdě.\n\n"
 ep1_flavor.2010.desc_2_1: "[councillor_2.GetCouncilTitleFirstName] mě naléhavě žádá, abych [Select_CString(ROOT.Char.IsFemale,'uvěznila','uvěznil')] svého [ROOT.Char.Custom2('CZ_RelationToMeShort_A', SCOPE.sC('scapegoat_1'))] [scapegoat_1.Custom('CZ_TitledFirstName_A')], „strašidlo [CZPrepZ(scapegoat_1.GetCurrentLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(scapegoat_1.GetCurrentLocation,'G')]“, dřív než bude pozdě.\n\n"
 ep1_flavor.2010.desc_2_2: "[councillor_2.GetCouncilTitleFirstName] mě naléhavě žádá, abych [Select_CString(ROOT.Char.IsFemale,'uvěznila','uvěznil')] svého [ROOT.Char.Custom2('CZ_RelationToMeShort_A', SCOPE.sC('scapegoat_2'))] [scapegoat_2.Custom('CZ_TitledFirstName_A')], „[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] ďábla“, dřív než bude pozdě.\n\n"
 ep1_flavor.2010.desc_family: "Že by se proti mně spikla má vlastní krev?"
 ep1_flavor.2010.desc_consort: "Že bych [Select_CString(ROOT.Char.IsFemale,'sdílela','sdílel')] lože s někým, kdo mě chce vidět [Select_CString(ROOT.Char.IsFemale,'mrtvou','mrtvého')]?"
 ep1_flavor.2010.desc_councillor: "Že by mi chtěl ublížit někdo z mých nejbližších rádců?"
 ep1_flavor.2010.desc_fallback: "V každých očích vidím zradu a zkoumám ruce dvořanů, zda neskrývají čepel."
 ep1_flavor.2010.desc_outro: "Při [ROOT.Char.GetFaith.HighGodName] jsem na konci sil..."
