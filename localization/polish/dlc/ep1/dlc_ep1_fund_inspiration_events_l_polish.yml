 fund_inspiration.0082.t: "Inspirace alchymie podpořena"
 fund_inspiration.0091.desc: "[inspiration_owner.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('inspiration_owner'))] a pak se hluboce ukloní. „Samozřejmě vám mohu vyrobit luk, má [ROOT.Char.GetLadyLord],“ [Select_CString(inspiration_owner.IsFemale,'její','jeho')] nadšení prozrazuje [Select_CString(inspiration_owner.IsFemale,'její','jeho')] úzkostné snahy udržet formálnost.\n\n„Ale jaký styl střelby preferujete? Rád vyřezám něco, co by vám nejlépe sedělo.“"
 fund_inspiration.0091.a: "Dobrý starý prostý luk, nic víc."
 fund_inspiration.0091.b: "Vyřez mi mohutný dlouhý luk."
 fund_inspiration.0091.c: "Lepidlo a šlachy drží nejlépe."
