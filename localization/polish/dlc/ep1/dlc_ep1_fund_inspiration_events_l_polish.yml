 fund_inspiration.0091.tooltip_crossbow.tt: "Na konci [Concept('inspiration','inspirace')|E] získáš: kuše"
 fund_inspiration.1001.t: "Inspirace uskutečněna"
 fund_inspiration.1001.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se ke mně přiblíží se širokým úsměvem. „Pilně jsem [Select_CString(inspiration_owner.IsFemale,'pracovala','pracoval')] mnoho dní i nocí a konečně je má práce hotova!“\n\nPředkládá mi předmět zabalený v látce, a když odkrývám, co je ukryto, oči se mi rozšíří.\n\n"
 fund_inspiration.1001.a: "To je nádherné!"
 fund_inspiration.1001.b: "Nechť přípravy započnou."
 fund_inspiration.1001.b.coronation_ready: "Nyní můžeš uspořádat [Concept('coronation','korunovaci')|E]"
 fund_inspiration.1071.coronation: "\n\nMoje koruna je hotová, nyní mohu uspořádat korunovaci a upevnit svou autoritu [Select_CString(ROOT.Char.IsFemale,'panovnice','panovníka')]."
 fund_inspiration.1011.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně přichází se širokým úsměvem, potem stékajícím po čele a sazí umazanou tváří. „[Select_CString(inspiration_owner.IsFemale,'Dřela','Dřel')] jsem u výhně mnoho dní i nocí, ale konečně je má práce hotova!“\n\nPředkládá mi předmět zabalený v látce, a když odhaluji, co je uvnitř, oči se mi rozšíří.\n\n"
 fund_inspiration.1021.desc_opening_1: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mává na mě se širokým úsměvem a ukazuje na zakrytý stojan na zbroj. „[Select_CString(inspiration_owner.IsFemale,'Dřela','Dřel')] jsem u výhně mnoho dní i nocí, ale konečně je má práce hotova!“"
 fund_inspiration.1021.desc_opening_2: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě mávnutím ruky přivolá ke krytému stojanu se zbrojí. Snaží se zachovat profesionální vystupování, ale když mi oznamuje, že je dílo hotové, vidím [Select_CString(inspiration_owner.IsFemale,'jí','mu')] v očích oheň."
 fund_inspiration.1021.desc: "\n\nS efektním gestem strhne pokrývku a oči se mi rozšíří.\n\n"
 fund_inspiration.1021.a: "Nádherné!"
 fund_inspiration.1031.desc_opening: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se usměje a inkoustem potřísněnou rukou mi pokyne, ať přijdu blíž."
 fund_inspiration.1031.desc_crime: "„Téma knihy je poněkud kontroverzní, ale je to mistrovské dílo. Podívejte se!“\n\n"
 fund_inspiration.1031.desc_soulmate_died: "„[Select_CString(soulmate.IsFemale,'Vaše milovaná','Váš milovaný')] [soulmate.GetTitledFirstName] možná [Select_CString(soulmate.IsFemale,'zemřela','zemřel')], ale tato kniha je svědectvím lásky, kterou jste sdíleli.“\n\n"
 fund_inspiration.1031.desc_nemesis_died: "„[nemesis.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)|U] možná [Select_CString(nemesis.IsFemale,'zemřela','zemřel')], ale tato kniha je svědectvím nenávisti, kterou jste k [Select_CString(nemesis.IsFemale,'ní','němu')] [Select_CString(ROOT.Char.IsFemale,'cítila','cítil')].“\n\n"
 fund_inspiration.1031.desc_cat_died: "„Vaše milovaná kočka možná zemřela, ale tato kniha by měla zajistit, že nikdo nezapomene na kočku jménem [inspiration_owner.Custom('CatStoryName')]!“\n\n"
 fund_inspiration.1031.desc_dog_died: "„Váš milovaný pes možná zemřel, ale tato kniha zajistí, že nikdo nezapomene na psa jménem [inspiration_owner.Custom('DogStoryName')]!“\n\n"
 fund_inspiration.1031.desc_low_content_quality: "„Kniha je hotová. Doufám, že hotové dílo přehluší mé nedostatečné znalosti o tématu. Prosím, podívejte se!“\n\n"
 fund_inspiration.1031.desc: "„Má kniha... mé #EMP mistrovské dílo#! je hotovo! Pohleďte.“\n\n"
 fund_inspiration.1031.a: "Jsem [Select_CString(ROOT.Char.IsFemale,'ohromena','ohromen')]!"
 fund_inspiration.1032.t: "Psané city"
 fund_inspiration.1032.desc: "„Můj [ROOT.Char.Custom('LoverPetName')], mám pro tebe překvapení!“\n\n[inspiration_sponsor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi předkládá krásnou knihu a když v ní listuji, sotva věřím vlastním očím. [Select_CString(inspiration_sponsor.IsFemale,'Nechala','Nechal')] sepsat knihu o #EMP nás#!!\n\n„Vazba bledne tvou krásou a obsah se nemůže rovnat tvé společnosti, ale tyto stránky nesou podstatu mé lásky k tobě.“"
 fund_inspiration.1032.a: "Ó, můj [inspiration_sponsor.Custom('LoverPetName')]!"
 fund_inspiration.1033.desc: "„Mám pro tebe překvapení!“\n\n[inspiration_sponsor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi předkládá krásnou knihu, ale když v ní listuji, sotva věřím vlastním očím. [Select_CString(inspiration_sponsor.IsFemale,'Nechala','Nechal')] sepsat knihu s jediným cílem – pomluvit #EMP mě#!!\n\n„Ačkoli žádná slova na tomto světě nemohou vyjádřit pohrdání, které k tobě cítím, a žádná ilustrace nemůže přesně zachytit pohromu, kterou je tvá tvář, přesto jsem to [Select_CString(inspiration_sponsor.IsFemale,'zkusila','zkusil')]. Celý svět to bude číst a vědět, [Select_CString(ROOT.Char.IsFemale,'jak podlá jsi','jak podlý jsi')].“"
 fund_inspiration.1033.a: "[Select_CString(inspiration_sponsor.IsFemale,'Ta','Ten')] [inspiration_sponsor.Custom('InsultNoun')]!"
 fund_inspiration.1033.a_proud: "Ale oni #EMP budou vědět#! o mně!"
 fund_inspiration.1041.desc: "„Sem, [ROOT.Char.Custom('FormOfAddressForLiege')]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ukazuje na dveře své tkalcovny, kde celé měsíce [Select_CString(inspiration_owner.IsFemale,'pracovala','pracoval')] na mé zakázce. Vstoupím dovnitř, a když pohlédnu na dílo, které visí přede mnou, vydechnu úžasem.\n\n"
 fund_inspiration.1051.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] oznámí svůj příchod překvapivě hlasitě. Pyšně drží balík pevně zabalený v látce.\n\n„Vracím se z [inspiration_owner.Custom('CZ_InspirationAdventureDestination_G')] s artefaktem ze své cesty!“\n\nVezmu objemný balík do rukou, rozvážu šňůry a odhaluji vrstvu za vrstvou látky. Uvnitř"
 fund_inspiration.1051_throne.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] oznámí svůj příchod překvapivě hlasitě. Hrdě vede velké procesí až k mému trůnu. Za [Select_CString(inspiration_owner.IsFemale,'ní','ním')] do audienční síně vjíždí vůz.\n\n„Vracím se z [inspiration_owner.Custom('CZ_InspirationAdventureDestination_G')] s velkolepým symbolem královské ctnosti!“\n\nKdyž se vůz přiblíží, uvědomím si, že veze trůn."
 fund_inspiration.1051_ark_covenant.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] oznámí svůj příchod překvapivě hlasitě. Hrdě vede velké procesí až k mému trůnu. Za [Select_CString(inspiration_owner.IsFemale,'ní','ním')] několik pomocníků nese něco, co vypadá jako obrovská bedna.\n\n„Vracím se z [inspiration_owner.Custom('CZ_InspirationAdventureDestination_G')] s cennou kořistí ze své cesty!“\n\nPřistoupím k obří bedně a jeden z pomocníků odtrhne prkna, která skrývají její poklad. Uvnitř"
 fund_inspiration.1051_cupboard.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] oznámí svůj příchod překvapivě hlasitě. Pyšně ukazuje na kus nábytku, který nesou dva pomocníci.\n\n„Vracím se s artefaktem ze své cesty!“\n\nPřistoupím k artefaktu a prohlížím si, co mi [Select_CString(inspiration_owner.IsFemale,'přivezla','přivezl')] z [inspiration_owner.Custom('CZ_InspirationAdventureDestination_G')]."
 fund_inspiration.1051.desc.skull: "je lebka [newly_created_artifact.GetFeatureText( 'animal_skull_type' )]. Zeptám se [inspiration_owner.Custom('CZ_FirstNameNoTooltip_G')] na podrobnosti a [Select_CString(inspiration_owner.IsFemale,'ona','on')] mi vylíčí, jak bylo to obrovské zvíře skoleno."
 fund_inspiration.1051.desc.goblet: "je kalich. Zeptám se [inspiration_owner.Custom('CZ_FirstNameNoTooltip_G')], kde ho [Select_CString(inspiration_owner.IsFemale,'získala','získal')], a [Select_CString(inspiration_owner.IsFemale,'ona','on')] mi vypráví o mrazivé sázce s cizincem, která skončila tím, že protivník vypil jed a prohrál."
 fund_inspiration.1051.desc.box: "je krabice. Místní řemeslník ji daroval [inspiration_owner.Custom('CZ_FirstNameNoTooltip_D')] poté, co [Select_CString(dummy_gender.IsFemale,'ji','ho')] [Select_CString(inspiration_owner.IsFemale,'zachránila','zachránil')] před smečkou divokých zvířat. Vypráví mi, jak krvelačné šelmy [Select_CString(inspiration_owner.IsFemale,'vylákala','vylákal')] a [Select_CString(inspiration_owner.IsFemale,'přelstila','přelstil')], až zahynuly."
 fund_inspiration.1051.desc.hide: "je kůže [newly_created_artifact.GetFeatureText( 'animal_hide_type' )]. [inspiration_owner.GetFirstNameNoTooltip] mi vypráví, jak [Select_CString(inspiration_owner.IsFemale,'porazila','porazil')] krvelačné zvíře, zatímco já obdivuji kůži toho, co muselo být majestátní zvíře."
 fund_inspiration.1051.desc.tapestry: "je tapisérie. [inspiration_owner.GetFirstNameNoTooltip] mi hrdě vypráví o svém společníkovi na cestách, mistrném krejčím. Jejich společné dobrodružství inspirovalo motivy této tapisérie."
 fund_inspiration.1051.desc.epic: "je artefakt, jaký jsem dosud [Select_CString(ROOT.Char.IsFemale,'neviděla','neviděl')].\n\n[inspiration_owner.GetFirstNameNoTooltip] se pyšně usměje: „[epic.GetDesc]“"
 fund_inspiration.1051.desc.epic.ark: "je velká kamenná truhla a v ní leží několik kamenných desek.\n\n[inspiration_owner.GetFirstNameNoTooltip] pyšně ohlásí: „Toto je Archa úmluvy! Obsahuje kamenné desky, které Izraelitům dal Mojžíš.“\n\n[inspiration_owner.GetFirstNameNoTooltip] pak dvoru vypráví o svých dobrodružstvích na cestě do [inspiration_owner.Custom('CZ_InspirationAdventureDestination_G')]. V příběhu nechybějí protivníci hnaní temnými ideologiemi ani návštěvy mnoha malebných míst."
 fund_inspiration.1051.desc.epic.throne: "\n\n[inspiration_owner.GetFirstNameNoTooltip] pyšně oznamuje: „[epic.GetDesc]“"
 fund_inspiration.1051.desc.epic.cupboard: "\n\nS velkým úsměvem [inspiration_owner.GetFirstNameNoTooltip] proklamuje: „[epic.GetDesc]“"
 fund_inspiration.1051.desc.regalia: "leží regálie hodné královského dvora.\n\n[inspiration_owner.GetFirstNameNoTooltip] se pyšně usměje a v dlouhém příběhu vysvětlí, jak si [Select_CString(inspiration_owner.IsFemale,'získala','získal')] vděčnost místního vládce [CZPrepV(inspiration_owner.GetCurrentLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(inspiration_owner.GetCurrentLocation,'L')], který nakonec nabídl [newly_created_artifact.GetName] [Select_CString(inspiration_owner.IsFemale,'jejímu','jeho')] pánovi – tedy mně."
 fund_inspiration.1051.desc.regalia_2: "leží regálie hodné královského dvora.\n\n[inspiration_owner.GetFirstNameNoTooltip] se pyšně usměje a vysvětlí, že se jedná o dar od dalekého vládce, který slyšel o velkoleposti vašeho dvora a chce vás zaujmout."
 fund_inspiration.1051.desc.armor: "leží zbroj.\n\n[inspiration_owner.GetFirstNameNoTooltip] vypráví dvoru příběh o tom, jak [Select_CString(inspiration_owner.IsFemale,'přišla','přišel')] k této neobvyklé zbroji, kterou mi nyní nabízí."
 fund_inspiration.1051.desc.weapon: "leží [newly_created_artifact.GetName].\n\n[inspiration_owner.GetFirstNameNoTooltip] začíná znovu vyprávět příběh o tom, jak se tato zbraň dostala do [Select_CString(inspiration_owner.IsFemale,'její','jeho')] držení. Je to příběh plný zvratů, z nichž některé jsou méně pravděpodobné než jiné."
 fund_inspiration.1051.desc.necklace: "leží náhrdelník.\n\n[inspiration_owner.GetFirstNameNoTooltip] je zjevně [Select_CString(inspiration_owner.IsFemale,'potěšená','potěšený')], že mi může tento skvost předat, ale nemá chuť vyprávět, jak k němu [Select_CString(inspiration_owner.IsFemale,'přišla','přišel')]."
 fund_inspiration.1051.a: "To je nádherné!"
 fund_inspiration.1051.b: "Musí se o něj starat jen „ti nejlepší“."
 fund_inspiration.1061.desc_floor_bound_artifact: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě se širokým úsměvem přivolá k předmětu přikrytému látkou. „[Select_CString(inspiration_owner.IsFemale,'Dřela','Dřel')] jsem mnoho dní a nocí a konečně je má práce hotova!“\n\nStrhne pokrývku a oči se mi rozšíří, když spatřím, co se pod ní skrývá.\n\n"
 fund_inspiration.1061.desc: "„Sem, [ROOT.Char.Custom('FormOfAddressForLiege')]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě se širokým úsměvem přivolá blíž. „[Select_CString(inspiration_owner.IsFemale,'Dřela','Dřel')] jsem mnoho dní a nocí a konečně je má práce hotova!“\n\nPředloží mi předmět zabalený v látce, a když odhrnu plátno, oči se mi rozšíří.\n\n"
 fund_inspiration.1081.desc_opening: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě s obrovským úsměvem na tváři přivolá ke svému zaneřáděnému psacímu stolu."
 fund_inspiration.1081.immortality_fail_desc_opening: "„Vím, že jsem [Select_CString(inspiration_owner.IsFemale,'říkala','říkal')], že bych [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] najít způsob, jak prodloužit život donekonečna, ale bohužel se to nepovedlo."
 fund_inspiration.1081.immortality_fail_desc_young: "Podařilo se mi však vyrobit elixír, který vás do jisté míry ochrání před stárnutím! Prosím, ochutnejte, nebo si alespoň prohlédněte plody mé práce.“\n\n"
 fund_inspiration.1081.immortality_fail_desc_old: "Podařilo se mi však vyrobit elixír, který vám vrátí část ztracené síly! Prosím, ochutnejte, nebo si alespoň prohlédněte plody mé práce.“\n\n"
 fund_inspiration.1081.elixir_desc_desc_young: "„Mé experimenty přinesly ovoce. Hle, elixír, který do jisté míry zabraňuje stárnutí! Prosím, podívejte se, a možná i ochutnejte.“\n\n"
 fund_inspiration.1081.elixir_desc_desc_old: "„Mé experimenty přinesly ovoce. Hle, elixír, který vám navrátí část ztracené síly! Prosím, podívejte se, a možná i ochutnejte.“\n\n"
 fund_inspiration.1081.panacea_desc: "„Je to panacea založená na ustálené tradici theriaku, obsahující myrhu, šafrán, opium, hadí maso a řadu dalších ingrediencí. Po staletí se ukazuje jako velmi účinná a já ji ještě [Select_CString(inspiration_owner.IsFemale,'zdokonalila','zdokonalil')]! Podívejte se.“\n\n"
 fund_inspiration.1081.metals_philosophers_stone_desc: "„[Select_CString(inspiration_owner.IsFemale,'Dokázala','Dokázal')] jsem to! [Select_CString(inspiration_owner.IsFemale,'Vytvořila','Vytvořil')] jsem kámen mudrců! Toto je mé Magnum Opus, mé zlaté dědictví. Prosím, pohleďte!“\n\n"
 fund_inspiration.1081.metals_mercury_desc: "„[Select_CString(inspiration_owner.IsFemale,'Zahřála','Zahřál')] jsem v nádobě směs rtuti a síry, takže se vypařila a zkondenzovala v horní části baňky. Když jsem pak nádobu [Select_CString(inspiration_owner.IsFemale,'rozbila','rozbil')] a vzniklou sloučeninu [Select_CString(inspiration_owner.IsFemale,'rozemlela','rozemlel')], [Select_CString(inspiration_owner.IsFemale,'získala','získal')] jsem rumělku, jasně červenou a zářivou! Své poznatky mám zapsané tady.“\n\n"
 fund_inspiration.1081.metals_arsenic_desc: "„[Select_CString(inspiration_owner.IsFemale,'Zahřála','Zahřál')] jsem arzenovou rudu a vznikl bílý prášek rozpustný ve vodě. Jsem si [Select_CString(inspiration_owner.IsFemale,'jistá','jistý')], že je při požití smrtelný, a přitom nemá žádnou chuť ani vůni! Své poznatky mám zapsané tady.“\n\n"
 fund_inspiration.1081.metals_gold_desc: "„[Select_CString(inspiration_owner.IsFemale,'Vytvořila','Vytvořil')] jsem zlato! Jak předpokládaly velké mysli přede mnou, olovu chyběla jen vlhkost a teplo.“\n\nKdyž požádám, zda bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] proces vidět, trvá na tom, že kousek zlata na stole mluví sám za sebe. „Své poznatky jsem ale samozřejmě [Select_CString(inspiration_owner.IsFemale,'zapsala','zapsal')], podívejte se.“\n\n"
 fund_inspiration.1081.metals_silver_desc: "„[Select_CString(inspiration_owner.IsFemale,'Vytvořila','Vytvořil')] jsem stříbro! Jak tvrdí teorie předchůdců, stříbro vzniká zahříváním mědi a dalších obecných kovů, dokud nezbělají.“\n\nKdyž požádám, zda bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] proces vidět, trvá na tom, že kousek stříbra na stole mluví sám za sebe. „Své poznatky jsem ale samozřejmě [Select_CString(inspiration_owner.IsFemale,'zapsala','zapsal')], podívejte se.“\n\n"
 fund_inspiration.1081.metals_fallback_desc: "„Své poznatky o obecných kovech a jejich přeměnách jsem [Select_CString(inspiration_owner.IsFemale,'shromáždila','shromáždil')] v této knize. Tady, podívejte se.“\n\n"
 fund_inspiration.1081.a_elixirs: "Hned ochutnám!"
 fund_inspiration.1081.a: "Fascinující!"
 fund_inspiration.1091.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně přistupuje se spokojeným úsměvem na tváři. „[Select_CString(inspiration_owner.IsFemale,'Dřela','Dřel')] jsem u pracovního stolu mnoho dní i nocí, ale konečně je mé dílo hotové!“\n\nPodá mi předmět zabalený v látce, a když odhalím, co se skrývá uvnitř, oči se mi rozšíří.\n\n"
 fund_inspiration.1091.a: "Skvělá práce! Opravdu výborné!"
 fund_inspiration.9001.t: "Inspirace skončila"
 fund_inspiration.9001.desc: "Katastrofa! [inspiration_owner.GetTitledFirstName], [Select_CString(inspiration_owner.IsFemale,'má chráněnkyně','můj chráněnec')], [Select_CString(inspiration_owner.IsFemale,'zemřela','zemřel')]. [inspiration_owner.GetSheHe|U] [inspiration_owner.GetDeathReason] dřív, než [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] splnit svůj... totiž #EMP můj#! sen!\n\n"
 fund_inspiration.9001.desc_weapon: "Teď nikdy nezjistím, jaké mistrovské dílo by [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] vykovat..."
 fund_inspiration.9001.desc_armor: "Teď už nikdy nezjistím, jaké mistrovské dílo by [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] vytvořit..."
 fund_inspiration.9001.desc_book: "Teď už nikdy nezjistím, jaké mistrovské dílo by [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] napsat..."
 fund_inspiration.9001.desc_weaver: "Teď už nikdy nezjistím, jaké mistrovské dílo by [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] utkat..."
 fund_inspiration.9001.desc_adventurer: "Teď už nikdy nezjistím, co by mi [Select_CString(inspiration_owner.IsFemale,'její','jeho')] dobrodružství mohlo přinést..."
 fund_inspiration.9001.desc_artisan: "Teď už nikdy nezjistím, jaké mistrovské dílo by [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] vytvořit..."
 fund_inspiration.9001.desc_smith: "Teď už nikdy nezjistím, jaké mistrovské dílo by [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] vykovat..."
 fund_inspiration.9001.desc_alchemy: "Teď už nikdy nezjistím, jaké zázraky by [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] vytvořit nebo objevit..."
 fund_inspiration.9001.desc_research: "Teď už nikdy nezjistím, k jakým objevům by [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] dospět..."
 fund_inspiration.9001.desc_religious_artifact: "Teď už nikdy nezjistím, jaké mistrovské dílo by [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] vytvořit..."
 fund_inspiration.9001.a: "Jaká tragédie!"
 fund_inspiration.9001.a_tt: "Přestáváš financovat inspiraci [inspiration_owner.Custom('CZ_TitledFirstName_G')]"
 fund_inspiration.9002.desc: "Katastrofa! [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(inspiration_owner.IsFemale,'byla zajata','byl zajat')] a už nemůže pracovat na splnění svého snu"
 fund_inspiration.9002.desc_weapon: "vykovat zbraň."
 fund_inspiration.9002.desc_armor: "vyrobit zbroj."
 fund_inspiration.9002.desc_book: "napsat knihu."
 fund_inspiration.9002.desc_weaver: "utkat mistrovské dílo."
 fund_inspiration.9002.desc_adventurer: "vypravit se na dobrodružství."
 fund_inspiration.9002.desc_artisan: "vytvořit něco velikého."
 fund_inspiration.9002.desc_smith: "vykovat mistrovské dílo."
 fund_inspiration.9002.desc_alchemy: "odhalit tajemství tohoto světa."
 fund_inspiration.9002.desc_research: "dosáhnout dalších vědeckých objevů."
 fund_inspiration.9002.desc_religious_artifact: "vytvořit zbožné umělecké dílo."
 fund_inspiration.9003.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] už není mým dvořanem, takže už nemohu podporovat [Select_CString(inspiration_owner.IsFemale,'její','jeho')] snahu"
 fund_inspiration.9004.desc: "[inspiration_owner.GetTitledFirstName] se vrací na můj dvůr nedlouho poté, co [Select_CString(inspiration_owner.IsFemale,'odešla','odešel')]."
 fund_inspiration.9004.desc_adventurer_tired_of_europe: "\n\nPo návratu na můj dvůr se sklání, aby [Select_CString(inspiration_owner.IsFemale,'políbila','políbil')] zem a pak mou botu. „[ROOT.Char.Custom('FormOfAddressForLiege')], budu vám navždy [Select_CString(inspiration_owner.IsFemale,'zavázána','zavázán')], že mi dovolíte vrátit se do civilizace... pryč od té zablácené a masité země zvané Evropa.“"
 fund_inspiration.9004.desc_adventurer_stuck_in_swamp: "Do mé soudní síně se přibelhá hromada hlíny, listí a bláta. Cítím, že mi zvoní hrana. Možná jsem se [Select_CString(ROOT.Char.IsFemale,'modlila','modlil')] málo. Když však sluhové hromadu polijí vědrem vody, špína opadá a odhalí [inspiration_owner.Custom('CZ_TitledFirstName_A')], [Select_CString(inspiration_owner.IsFemale,'navrátivší se','navrátivšího se')] z bažin. Okamžitě se vrhne k mým nohám a líbá je. „Už jsem to [Select_CString(inspiration_owner.IsFemale,'nevydržela','nevydržel')]. Jak [Select_CString(inspiration_owner.IsFemale,'ráda','rád')] jsem zpátky v civilizovaném světě!“\n\nTak"
 fund_inspiration.9004.a: "Vzchopte se."
 change_artifact_quality_effect_gain: "[Concept('artifact','Artefakt')|E] z inspirace „[inspiration.GetName]“, kterou má [artifact_quality_scope.GetShortUIName], bude #P kvalitnější#!"
 change_artifact_quality_effect_slight_gain: "[Concept('artifact','Artefakt')|E] z inspirace „[inspiration.GetName]“, kterou má [artifact_quality_scope.GetShortUIName], může být #P o něco kvalitnější#!"
 change_artifact_quality_effect_loss: "[Concept('artifact','Artefakt')|E] z inspirace „[inspiration.GetName]“, kterou má [artifact_quality_scope.GetShortUIName], bude #N méně kvalitní#!"
 change_artifact_quality_effect_slight_loss: "[Concept('artifact','Artefakt')|E] z inspirace „[inspiration.GetName]“, kterou má [artifact_quality_scope.GetShortUIName], může být #N o něco méně kvalitní#!"
 change_artifact_book_content_quality_effect_gain: "Obsah knižního [Concept('artifact','artefaktu')|E] bude pravděpodobně #P kvalitnější#!"
 change_artifact_book_content_quality_effect_loss: "Obsah knižního [Concept('artifact','artefaktu')|E] bude pravděpodobně #N méně kvalitní#!"
 fund_inspiration.9005.t: "Nedokončená záležitost"
 fund_inspiration.9005.desc_intro: "[inherited_insp_owner.GetTitledFirstName], [Select_CString(SCOPE.sC('inherited_insp_owner').IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('inherited_insp_owner'))], žádá uprostřed zmatku po nástupnictví o slovo.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], [old_ruler.GetTitledFirstNameRegnal] mi před svou smrtí [Select_CString(old_ruler.IsFemale,'zadala','zadal')] zakázku a já [Select_CString(inherited_insp_owner.IsFemale,'měla','měl')] v plánu [inherited_insp_owner.Custom('InspirationTypeDescription')] pro [Select_CString(old_ruler.IsFemale,'ni','něj')].“\n\n"
 fund_inspiration.9005.desc_multiple: "„I další řemeslníci také pracovali, a chceme vědět, zda budete sponzorovat naše úsilí.“"
 fund_inspiration.9005.desc_single: "„Práce už začala a byla by škoda ji nedokončit...“"
 fund_inspiration.9005.a: "Práce bude pokračovat!"
 fund_inspiration.9005.b: "Tato pošetilá rozptýlení skončí."
 inherited_inspiration_continue_tt: "Budeš sponzorovat zakázky [old_ruler.Custom('CZ_TitledFirstNameRegnal_G')]"
 inherited_inspiration_end_tt: "#X Veškeré investované zlato bude ztraceno#!"
 fund_inspiration.title: "Inspirace:"
 fund_inspiration.2001.t: "$fund_inspiration.title$ Žádost o prostředky"
 fund_inspiration.2001.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] trvá na tom, že prostředky, které jsem [Select_CString(inspiration_owner.IsFemale,'jí','mu')] [Select_CString(ROOT.Char.IsFemale,'poskytla','poskytl')], nestačí k vytvoření artefaktu hodného mého postavení.\n\n„Jen o trochu víc zlata a [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] bych vytvořit něco #EMP skutečně#! velkolepého!“"
 fund_inspiration.2001.a: "Cokoli potřebujete!"
 fund_inspiration.2001.b: "Vystačte si s tím, co máte."
 fund_inspiration.2002.t: "$fund_inspiration.title$ Žádost o... materiály"
 fund_inspiration.2002.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] má tu drzost předvolat mě do své ubohé a páchnoucí komnaty.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')], práce pokračuje, ale kdybych [Select_CString(inspiration_owner.IsFemale,'měla','měl')] ještě nějaké součásti... nějaký #EMP lidský#! materiál, [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] bych vytvořit něco #EMP opravdu ohromujícího#!. Potřebuji toho člověka živého, alespoň zpočátku.“\n\nKdyž [inspiration_owner.GetFirstName] domluví, "
 fund_inspiration.2002.desc.fingernails: "můj pohled padne na krví potřísněné nástroje a utržené nehty rozházené po stole."
 fund_inspiration.2002.desc.potions: "můj pohled bezmyšlenkovitě sklouzne k psacímu stolu a policím plným záhadných živočišných částí, barevných tekutin a nebezpečně vypadajících rostlin."
 fund_inspiration.2002.desc.blind: "Slyším slabé sténání a vzlyky někoho jiného v místnosti. Po sérii škytavých záchvatů následuje bolestivě znějící zvracení doprovázené silným kyselým zápachem zvratků."
 fund_inspiration.2002.a: "„Použij lidi v mých žalářích, jak uznáš za vhodné.“"
 fund_inspiration.2002.b: "„Tady, nějaké mince na unesení pár poddaných.“"
 fund_inspiration.2002.c: "„Hraniční pás není daleko. Jdi unést nějaké cizí poddané.“"
 fund_inspiration.2002.toast_outcome.negative: "Důkazy ukazují na tebe jako na viníka zmizení poddaných"
 fund_inspiration.2002.toast_outcome.positive: "Únos poddaných ti projde bez následků"
 fund_inspiration.2002.d: "Odmítnout žádost [inspiration_owner.Custom('CZ_TitledFirstNameNoTooltip_G')]."
 fund_inspiration.2003.t: "$fund_inspiration.title$ Přerušení"
 fund_inspiration.2003.desc: "„Pro #EMP [inspiration_owner.GetFaith.HighGodName]#!, [Select_CString(previous_inspired.IsFemale,'ženská','chlape')]! Nech mě být!“\n\nPoklidnou atmosféru protne křik [inspiration_owner.Custom('CZ_FirstName_G')], [Select_CString(inspiration_owner.IsFemale,'která','který')] vtrhne na nádvoří. [previous_inspired.GetFirstName] [Select_CString(previous_inspired.IsFemale,'ji','ho')] spěšně následuje, ale když mě spatří, zastaví se.\n\n„[ROOT.Char.Custom2('RelationToMeAddress', previous_inspired)|U], prosím, promluvte [inspiration_owner.Custom('CZ_FirstNameNoTooltip_D')] do duše! Snažím se [Select_CString(inspiration_owner.IsFemale,'jí','mu')] pomoci, mám zkušenosti, které by [Select_CString(inspiration_owner.IsFemale,'její','jeho')] práci mohly zlepšit!“"
 fund_inspiration.2003.a: "Přesvědčit [inspiration_owner.Custom('CZ_FirstNameNoTooltip_A')], aby [Select_CString(inspiration_owner.IsFemale,'poslechla','poslechl')] [previous_inspired.Custom('CZ_FirstNameNoTooltip_A')]."
 fund_inspiration.2003.b: "„No tak, aspoň [Select_CString(previous_inspired.IsFemale,'ji','ho')] vyslechni.“"
 fund_inspiration.2003.c: "Přikázat [previous_inspired.Custom('CZ_FirstNameNoTooltip_D')], aby [Select_CString(previous_inspired.IsFemale,'nechala','nechal')] [inspiration_owner.Custom('CZ_FirstNameNoTooltip_A')] na pokoji."
 fund_inspiration.2003.toast_outcome.positive: "[inspiration_owner.GetFirstNameNoTooltip] naslouchá [previous_inspired.Custom('CZ_FirstNameNoTooltip_D')]"
 fund_inspiration.2003.toast_outcome.refusal: "[inspiration_owner.GetFirstNameNoTooltip] odmítá naslouchat"
 fund_inspiration.2003.toast_outcome.negative: "[previous_inspired.GetFirstNameNoTooltip] poskytuje špatnou zpětnou vazbu"
 fund_inspiration.2004.t: "$fund_inspiration.title$ Nejvyšší kvalita"
 fund_inspiration.2004.desc_metal: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], podívejte se na ten kov! Nikdy jsem [Select_CString(inspiration_owner.IsFemale,'neviděla','neviděl')] takovou kvalitu.“"
 fund_inspiration.2004.desc_fabric: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], podívejte se na tu tkaninu! Vlákna, hloubka barvy... Nikdy jsem [Select_CString(inspiration_owner.IsFemale,'neviděla','neviděl')] takovou kvalitu.“"
 fund_inspiration.2004.desc_thread: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], podívejte se na tu nit! Takovou kvalitu jsem nikdy [Select_CString(inspiration_owner.IsFemale,'neviděla','neviděl')].“"
 fund_inspriation.2004.desc_paint: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], podívejte se na ten pigment! Takovou kvalitu jsem nikdy [Select_CString(inspiration_owner.IsFemale,'neviděla','neviděl')].“"
 fund_inspiration.2004.desc_wood: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], podívejte se na to dřevo! Letokruhy, hustota... Nikdy jsem [Select_CString(inspiration_owner.IsFemale,'neviděla','neviděl')] takovou kvalitu!“"
 fund_inspiration.2004.desc_paper: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], podívejte se na ten papír! Nikdy jsem [Select_CString(inspiration_owner.IsFemale,'neviděla','neviděl')] takovou kvalitu.“"
 fund_inspiration.2004.desc_ink: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], podívejte se na ten inkoust! Barvy, sytost... Nikdy jsem [Select_CString(inspiration_owner.IsFemale,'neviděla','neviděl')] takovou kvalitu!“"
 fund_inspiration.2004.desc_alchemy_metal: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], podívejte se na to! Nikdy jsem [Select_CString(inspiration_owner.IsFemale,'neviděla','neviděl')] tak čistou rudu.“"
 fund_inspiration.2004.desc_elixirs: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], podívejte se na ty baňky! Nikdy jsem [Select_CString(inspiration_owner.IsFemale,'neviděla','neviděl')] tak čiré sklo.“"
 fund_inspiration.2004.desc_fallback: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], podívejte se na to! Nikdy jsem [Select_CString(inspiration_owner.IsFemale,'neviděla','neviděl')] tak kvalitní materiály.“"
 fund_inspiration.2004.desc: "\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se odpojí od naší výpravy na trh a zamíří k obchodníkovi, který onu žádanou věc prodává, [Select_CString(inspiration_owner.IsFemale,'nadšená','nadšený')] svým nálezem.\n\n„S tímhle by můj projekt dosáhl nových výšin. [Select_CString(inspiration_owner.IsFemale,'Mohla','Mohl')] bych vytvořit něco skutečně #EMP skvělého#!! Prosím, [ROOT.Char.Custom('FormOfAddressForLiege')], dopřejte mi to.“"
 fund_inspiration.2004.a: "Váš projekt stojí za investici!"
 fund_inspiration.2004.b: "Samozřejmě, ale určitě můžeme získat přiměřenou cenu?"
 fund_inspiration.2004.b.success: "Obchodníka se podaří přesvědčit, aby slevil"
 fund_inspiration.2004.b.failure: "Obchodník není přesvědčen"
 fund_inspiration.2004.c: "Rozhodně. Stráže, zabavte to, co [inspiration_owner.GetFirstNameNoTooltip] potřebuje."
 fund_inspiration.2004.d: "Myslíte si, že mám peněz nazbyt?"
 fund_inspiration.2005.t: "$fund_inspiration.title$ Nová kovárna"
 fund_inspiration.2005.desc_opening: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se ke mně přiblíží se zamračením, spáleným obočím a nějakým ohnutým kovem.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], nemyslím to jako urážku, ale tahle vaše výheň..."
 fund_inspiration.2005.desc_weapon: "Stačí říct, že pokud chcete, aby výsledná zbraň – [inspiration_owner.Custom('ArtifactWeaponType')] – byla alespoň trochu použitelná,"
 fund_inspiration.2005.desc_armor: "Stačí říct, že pokud chcete, aby výsledná zbroj – [inspiration_owner.Custom('ArtifactArmorTypeLowercase')] – byla alespoň trochu použitelná,"
 fund_inspiration.2005.desc_smith: "Řekněme, že pokud chcete, aby výsledný předmět – [inspiration_owner.Custom('InspirationSmithType')] – byl alespoň trochu elegantní,"
 fund_inspiration.2005.desc_ending: "budete muset investovat do nové.“"
 fund_inspiration.2005.a: "Samozřejmě, cokoli potřebujete."
 fund_inspiration.2005.b: "Je to naprosto dobrá kovárna!"
 fund_inspiration.2006.t: "$fund_inspiration.title$ Putující učenec"
 fund_inspiration.2006.desc: "[inspiration_owner.Custom('GetInspirationOwnerType')|U] [inspiration_owner.GetTitledFirstName] přede mě přivádí [Select_CString(scholar_character.IsFemale,'ženu','muže')] a nešetří úsměvy ani chválou.\n\n„Toto je [scholar_character.GetTitledFirstName], [Select_CString(scholar_character.IsFemale,'uznávaná učenkyně','uznávaný učenec')] v mých kruzích.“\n\n[Select_CString(scholar_character.IsFemale,'Žena','Muž')] se ukloní, zároveň [Select_CString(scholar_character.IsFemale,'potěšená','potěšený')] i [Select_CString(scholar_character.IsFemale,'zahanbená','zahanbený')]. „Prosím, to není třeba. Jsem tu, abych vám [Select_CString(scholar_character.IsFemale,'nabídla','nabídl')] své služby, [ROOT.Char.Custom('FormOfAddressForLiege')], budete-li si to přát.“"
 fund_inspiration.2006.a: "Ano. Prosím, pomozte [inspiration_owner.Custom('CZ_FirstNameNoTooltip_D')]."
 fund_inspiration.2006.b: "Jistě. Budeš mým osobním učitelem."
 fund_inspiration.2006.c: "Tady nenajdeš domov."
 fund_inspiration.2021.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] trvá na tom, že má-li být zbroj hodná [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')] mého věhlasu, bude potřebovat víc prostředků.\n\n„Výroba takové zbroje není levná, už jen samotný materiál... Teď není čas šetřit, [ROOT.Char.Custom('FormOfAddressForLiege')]!“"
 fund_inspiration.2021.a: "Dostaneš peníze."
 fund_inspiration.2021.b: "Nedám ti více zlata."
 fund_inspiration.2030.t: "$fund_inspiration.title$ Přátelské slovo"
 fund_inspiration.2030.desc: "[Select_CString(friend.IsFemale,'Moje přítelkyně','Můj přítel')] [friend.GetTitledFirstName] mě se širokým úsměvem zastaví v síni.\n\n„Á, tady #EMP jsi#!, [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')]! Právě jsem [Select_CString(friend.IsFemale,'mluvila','mluvil')] s [inspiration_owner.Custom('CZ_TitledFirstName_I')]! [Select_CString(friend.IsFemale,'Slyšela','Slyšel')] jsem, že [inspiration_owner.Custom('InspirationTypeDescriptionFuturePresent')] pro tebe, a [Select_CString(friend.IsFemale,'nemohla','nemohl')] jsem odolat, abych se za [Select_CString(inspiration_owner.IsFemale,'ní','ním')] [Select_CString(friend.IsFemale,'nezastavila','nezastavil')]!“\n\n„[Select_CString(friend.IsFemale,'Probrala','Probral')] jsem s [Select_CString(inspiration_owner.IsFemale,'ní','ním')], jak naplnit tvá očekávání; myslím, že se ti výsledek bude líbit!“"
 fund_inspiration.2030.a: "„Och! Díky, [friend.GetFirstNameNoTooltip]!“"
 fund_inspiration.2040.t: "$fund_inspiration.title$ Sabotáž"
 fund_inspiration.2040.desc: "Tichou chvíli přeruší zoufalé výkřiky [inspiration_owner.Custom('CZ_TitledFirstName_G')]: „Jak mám pracovat, když se mi pořád ztrácí [inspiration_owner.Custom('GetInspirationTypeTool')|l]?!“\n\nSpěchá ke mně. „[ROOT.Char.Custom('FormOfAddressForLiege')], pokaždé, když se pohnu kupředu, něco se pokazí! Jsem si [Select_CString(inspiration_owner.IsFemale,'jistá','jistý')], že mi někdo na dvoře do práce zasahuje!“\n\nPak si posteskne a odkráčí zpět do své dílny."
 fund_inspiration.2040.a: "Jaký amatér."
 fund_inspiration.2040.b: "Platím za kvalitu, ne za drama!"
 fund_inspiration.2040.c: "Že by to [Select_CString(rival.IsFemale,'byla','byl')]... ne... #EMP [rival.GetFirstNameNoTooltip]?#!"
 fund_inspiration.2040.c.tt: "Sabotér bude zatčen"
 fund_inspiration.2040.c.flavor: "Čas nastražit past!"
 fund_inspiration.2040.c.success: "Chytíš sabotéra"
 fund_inspiration.2040.c.failure: "Sabotér ti unikne"
 ep1_fund_inspiration_2040_scheme_modifier: "Nenápadné činy"
 ep1_fund_inspiration_2040_scheme_modifier_desc: "Tato postava je zdatná v nenápadných aktivitách."
 fund_inspiration.2041.desc: "Po večeři čekám se skupinkou stráží u komnat [inspiration_owner.Custom('CZ_TitledFirstName_G')] a sleduji chodbu, zatímco [ROOT.Char.Custom('FortifiedBuilding')] tone ve tmě.\n\nPrávě když to chci vzdát, zatančí chodbou rozechvělé světélko a za ním zahalená postava.\n\nTemná postava otevře dveře dílny, ještě jednou se kradmo rozhlédne po chodbě a blikající olejová lampa ozáří [Select_CString(rival.IsFemale,'její','jeho')] tvář: [rival.GetTitledFirstName]!"
 fund_inspiration.2041.a: "„A-ha! Do žaláře!“"
 fund_inspiration.2041.b: "„Vyhoďte [Select_CString(rival.IsFemale,'ji','ho')] odsud!“"
 fund_inspiration.2041.c: "Vyřídím to po svém..."
 fund_inspiration.2050.t: "$fund_inspiration.title$ Zvážený názor"
 fund_inspiration.2050.desc: "[inspiration_owner.GetTitledFirstName] mě informuje o svém pokroku a jednotvárně vysvětluje omezení, která [Select_CString(inspiration_owner.IsFemale,'jí','mu')] kladou [inspiration_owner.Custom('GetInspirationTypeTool')|l] a [inspiration_owner.Custom('GetInspirationTypeStation')|l], zatímco se mi v hlavě rodí odvážné nápady...\n\n[inspiration_owner.Custom('GetInspirationTypeVerb')|U] možná není #EMP moje#! silná stránka, ale to neznamená, že nemohu mluvit do toho, jak se utrácejí mé peníze!"
 fund_inspiration.2050.a: "Mám pár návrhů..."
 fund_inspiration.2050.b: "Mé zázemí mi dává jedinečný vhled."
 fund_inspiration.2050.c: "[Select_CString(inspiration_owner.IsFemale,'Uvažovala','Uvažoval')] jste o #EMP tomhle#! úhlu pohledu?"
 fund_inspiration.2050.d: "Nechte mě nahlédnout do vašich skic..."
 fund_inspiration.2050.e: "Ne, [inspiration_owner.GetFirstNameNoTooltip] ví, co dělá."
 fund_inspiration.2050.success: "Tvoje nápady fungují"
 fund_inspiration.2050.nothing: "Nikdo tě neposlouchá"
 fund_inspiration.2050.failure: "Tvoje nápady jsou špatné"
 fund_inspiration_half_refund_tt: "Polovina tvé investice bude vrácena:"
 fund_inspiration_quarter_refund_tt: "Čtvrtina tvé investice bude vrácena:"
 fund_inspiration.2060.t: "$fund_inspiration.title$ Poklad pro [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_A')]"
 fund_inspiration.2060.desc.religious: "Má oddanost je příkladem pro všechny, od mocného krále po ubohého žebráka, a s tím přicházejí učedníci."
 fund_inspiration.2060.desc.fame: "O mých činech se po celém světě vypráví s úctou i závistí, od cizích dvorů po vesnické krčmy, a s tím přicházejí stoupenci."
 fund_inspiration.2060.desc.court: "Můj okázalý dvůr je po celém světě obdivován i záviděn, všichni mu chtějí konkurovat a užívat si jeho nádhery, a s tím přicházejí obdivovatelé."
 fund_inspiration.2060.desc: "\n\nDnes ke mně přivedou [donator.Custom('CZ_TitledFirstName_A')], [Select_CString(donator.IsFemale,'zástupkyni','zástupce')] "
 fund_inspiration.2060.desc.brotherhood: "malého [CZFaithAdjDecline(donator.GetFaith,'ého')] [Select_CString(donator.IsFemale,'sesterstva','bratrstva')] [CZPrepZ(barony_scope.GetNameNoTierNoTooltip)] [barony_scope.Custom('CZ_LandedNameNoTierNoTooltip_G')] [CZPrepV(barony_scope.GetDeJureLiege.GetNameNoTierNoTooltip)] [barony_scope.GetDeJureLiege.Custom('CZ_LandedNameNoTier_L')].\n\n"
 fund_inspiration.2060.desc.abbey: "malé [CZFaithAdjDecline(donator.GetFaith,'é')] svatyně [CZPrepV(barony_scope.GetDeJureLiege.GetNameNoTierNoTooltip)] [barony_scope.GetDeJureLiege.Custom('CZ_LandedNameNoTier_L')].\n\n"
 fund_inspiration.2060.desc.mercenary: "malého žoldnéřského oddílu [CZPrepZ(barony_scope.GetNameNoTierNoTooltip)] [barony_scope.Custom('CZ_LandedNameNoTierNoTooltip_G')] [CZPrepV(barony_scope.GetDeJureLiege.GetNameNoTierNoTooltip)] [barony_scope.GetDeJureLiege.Custom('CZ_LandedNameNoTier_L')].\n\n"
 fund_inspiration.2060.desc.guild: "malého cechu ([donator.Custom('dummy_peasant_profession')|l]) [CZPrepZ(barony_scope.GetNameNoTierNoTooltip)] [barony_scope.Custom('CZ_LandedNameNoTierNoTooltip_G')] [CZPrepV(barony_scope.GetDeJureLiege.GetNameNoTierNoTooltip)] [barony_scope.GetDeJureLiege.Custom('CZ_LandedNameNoTier_L')].\n\n"
 fund_inspiration.2060.piety: "„[Select_CString(ROOT.Char.IsFemale,'Nejsvětější','Nejsvětější')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]!“"
 fund_inspiration.2060.saoshyant: "„Nebeský Saoshyant!“"
 fund_inspiration.2060.savior: "„Svatý spasiteli!“"
 fund_inspiration.2060.saint: "„[Select_CString(ROOT.Char.IsFemale,'Uctívaná světice','Uctívaný světče')]!“"
 fund_inspiration.2060.prestige: "„Ó, [Select_CString(ROOT.Char.IsFemale,'skvělá','skvělý')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]!“"
 fund_inspiration.2060.grandeur: "„Ó, [Select_CString(ROOT.Char.IsFemale,'nepřekonatelná','nepřekonatelný')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]!“"
 fund_inspiration.2060.desc_outro: "Moji přátelé a já jsme slyšeli, že se pro vás vytváří nádherné dílo, a chceme přispět na jeho tvorbu! Byla by to pro nás veliká čest, Vaše Veličenstvo – šetřili jsme celé měsíce!"
 fund_inspiration.2060.a: "To #EMP já#! jsem [Select_CString(ROOT.Char.IsFemale,'poctěna','poctěn')]."
 fund_inspiration.2060.b.religious: "Ne, prosím, [Select_CString(donator.IsFemale,'laskavá','laskavý')] [donator.Custom('NunMonk')], ponechte si to."
 fund_inspiration.2060.b.prestige: "Ne, odmítám! Ponechte si to, příteli!"
 fund_inspiration.2060.c: "To vše?"
 ep1_fund_inspiration_2070_accept_modifier: "Přijatý dar"
 ep1_fund_inspiration_2070_accept_modifier_desc: "Toto hrabství je rádo, že mohlo mít podíl na bohatých artefaktech svého panovníka."
 ep1_fund_inspiration_2070_refuse_modifier: "Odmítnutý dar"
 ep1_fund_inspiration_2070_refuse_modifier_desc: "Toto hrabství je rozčarované, že byly jeho dary odmítnuty, ale nyní má přebytek prostředků."
 ep1_fund_inspiration_2070_mock_modifier: "Zesměšněný dar"
 ep1_fund_inspiration_2070_mock_modifier_desc: "Toto hrabství je zklamané, že se jeho dary staly objektem posměchu ze strany panovníka."
 fund_inspiration.2070.t: "$fund_inspiration.title$ Chybný klenot"
 fund_inspiration.2070.desc: "[Select_CString(ROOT.Char.IsFemale,'Zaměstnána','Zaměstnán')] záležitostmi dvora jsem stále víc [Select_CString(ROOT.Char.IsFemale,'zanedbávala','zanedbával')] zprávy od [inspiration_owner.Custom('CZ_TitledFirstName_G')]."
 fund_inspiration.2070.desc.stalled: "Práce na mé zakázce se teď úplně zastavila a zdá se, že to není tak docela moje vina...\n\n"
 fund_inspiration.2070.desc.wasted: "Týdny práce na mé zakázce teď přišly vniveč a zdá se, že to není tak docela moje vina...\n\n"
 fund_inspiration.2070.desc.lunatic: "[Select_CString(ROOT.Char.IsFemale,'Doslechla','Doslechl')] jsem se o bludech a nevyzpytatelném chování [inspiration_owner.Custom('CZ_FirstNameNoTooltip_G')], o tom, jak neustále mění názor a začíná znovu od nuly, i o [Select_CString(inspiration_owner.IsFemale,'její','jeho')] podivném zacházení s nástrojem: [inspiration_owner.Custom('GetInspirationTypeTool')|l]."
 fund_inspiration.2070.desc.possessed: "Slyším o neustálých výkyvech nálad [inspiration_owner.Custom('CZ_FirstNameNoTooltip_G')]; ty nejhorší v záchvatu pochybností a hněvu zmaří veškerou [Select_CString(inspiration_owner.IsFemale,'její','jeho')] usilovnou práci."
 fund_inspiration.2070.desc.depressed: "[Select_CString(ROOT.Char.IsFemale,'Doslechla','Doslechl')] jsem se, že [inspiration_owner.GetFirstNameNoTooltip] tráví dny v posteli, [Select_CString(inspiration_owner.IsFemale,'pohlcená','pohlcený')] všudypřítomnou melancholií a [Select_CString(inspiration_owner.IsFemale,'neschopná','neschopný')] čelit dalšímu dni."
 fund_inspiration.2070.desc.drunkard: "[Select_CString(ROOT.Char.IsFemale,'Doslechla','Doslechl')] jsem se, že [inspiration_owner.GetFirstNameNoTooltip] utrácí mé prostředky za pití a předvádění se v krčmách [CZPrepV(ROOT.Char.GetCapitalLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(ROOT.Char.GetCapitalLocation,'L')]."
 fund_inspiration.2070.desc.hashishiyah: "Slyším o velkém množství hašiše, za který [inspiration_owner.GetFirstNameNoTooltip] utrácí mé prostředky, než se zavře ve tmě."
 fund_inspiration.2070.desc.rakish: "[Select_CString(ROOT.Char.IsFemale,'Doslechla','Doslechl')] jsem se, že [inspiration_owner.GetFirstNameNoTooltip] skoro nechodí do své dílny a prý tráví čas a mé prostředky v nevěstincích [CZPrepV(ROOT.Char.GetCapitalLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(ROOT.Char.GetCapitalLocation,'L')]."
 fund_inspiration.2070.desc.profligate: "[Select_CString(ROOT.Char.IsFemale,'Slyšela','Slyšel')] jsem o nutkavém utrácení [inspiration_owner.Custom('CZ_FirstNameNoTooltip_G')] na trhu, kde [Select_CString(inspiration_owner.IsFemale,'promrhala','promrhal')] mou podporu na lehkomyslné nápady, které nikam nevedly."
 fund_inspiration.2070.desc.improvident: "[Select_CString(ROOT.Char.IsFemale,'Doslechla','Doslechl')] jsem se o nutkavém rozdávání [inspiration_owner.Custom('CZ_FirstNameNoTooltip_G')] a o různých dobročinných účelech, na které [Select_CString(inspiration_owner.IsFemale,'utratila','utratil')] mou podporu, místo aby [Select_CString(inspiration_owner.IsFemale,'pracovala','pracoval')] na svém díle."
 fund_inspiration.2070.desc.irritable: "Slyším o špatné povaze [inspiration_owner.Custom('CZ_FirstNameNoTooltip_G')], která bez mého zásahu odradila každého, kdo by mohl napravit [Select_CString(inspiration_owner.IsFemale,'její','jeho')] chyby a nedorozumění."
 fund_inspiration.2070.desc.comfort_eater: "[Select_CString(ROOT.Char.IsFemale,'Doslechla','Doslechl')] jsem se o nekonečné chuti k jídlu [inspiration_owner.Custom('CZ_FirstNameNoTooltip_G')] a o tom, jak utrácí mé prostředky za koláče a sladkosti z trhu."
 fund_inspiration.2070.desc.reclusive: "[Select_CString(ROOT.Char.IsFemale,'Doslechla','Doslechl')] jsem se, že [inspiration_owner.GetFirstNameNoTooltip] od našeho posledního setkání skoro nikdo neviděl. [Select_CString(inspiration_owner.IsFemale,'Zavřela','Zavřel')] se ve své dílně a bez vedení se úplně [Select_CString(inspiration_owner.IsFemale,'odchýlila','odchýlil')] od dohodnutého plánu."
 fund_inspiration.2070.desc.wounded: "Slyším o otevřených ranách [inspiration_owner.Custom('CZ_FirstNameNoTooltip_G')], které [Select_CString(inspiration_owner.IsFemale,'ji','ho')] upoutaly na lůžko, kde se svíjí v bolestech, a doufám, že [ROOT.Char.GetFaith.DeathDeityName] bude mít trpělivost..."
 fund_inspiration.2070.desc.pregnant: "[Select_CString(ROOT.Char.IsFemale,'Doslechla','Doslechl')] jsem se o těhotenství [inspiration_owner.Custom('CZ_FirstNameNoTooltip_G')]; bolesti a omezená pohyblivost [Select_CString(inspiration_owner.IsFemale,'ji','ho')] zcela vyřadily z práce..."
 fund_inspiration.2070.desc.sick: "[Select_CString(ROOT.Char.IsFemale,'Slyšela','Slyšel')] jsem o vysilující nemoci [inspiration_owner.Custom('CZ_FirstNameNoTooltip_G')], která [Select_CString(inspiration_owner.IsFemale,'ji','ho')] často upoutá na lůžko a vůbec [Select_CString(inspiration_owner.IsFemale,'jí','mu')] nedovolí pracovat."
 fund_inspiration.2070.desc_outro: "\n\nNakonec si [Select_CString(inspiration_owner.IsFemale,'ji','ho')] dám předvolat."
 fund_inspiration.2070.a: "Postarejte se, aby se věci vrátily na správnou kolej."
 fund_inspiration.2070.b: "Vím, že děláte, co můžete, [inspiration_owner.GetFirstNameNoTooltip]."
 fund_inspiration.2070.c: "Doufám, že to bude mistrovské dílo, a brzy!"
 fund_inspiration.2070.d: "Okamžitě odsud zmizte, [Select_CString(inspiration_owner.IsFemale,'marnotratnice','marnotratníku')]!"
 fund_inspiration.2080.t: "$fund_inspiration.title$ Kreativní svoboda"
 fund_inspiration.2080.antiquarian: "„To je směšné!“ protestuje [rival.GetTitledFirstName]. „Jako [Select_CString(rival.IsFemale,'správkyně','správce')] osobní sbírky [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')] mám povinnost dohlížet na kvalitu vaší práce!“"
 fund_inspiration.2080.artificer: "„To je směšné!“ protestuje [rival.GetTitledFirstName]. „Jsem [Select_CString(rival.IsFemale,'důvěryhodná řemeslnice','důvěryhodný řemeslník')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')]! [Select_CString(rival.IsFemale,'Mohla','Mohl')] bych pomoci, kdybyste mi jen [Select_CString(inspiration_owner.IsFemale,'dovolila','dovolil')] vaši práci vidět!“"
 fund_inspiration.2080.desc: "\n\n„Uvidíte to, až to bude hotové!“ odsekne [inspiration_owner.GetTitledFirstName]. „Nechte [Select_CString(inspiration_owner.IsFemale,'ženu','muže')] pracovat! Tvořím přece dílo hodné královské rodiny!“"
 fund_inspiration.2080.a: "[antiquarian.GetFirstNameNoTooltip] #EMP zajistí#! jeho kvalitu, [inspiration_owner.GetFirstNameNoTooltip]."
 fund_inspiration.2080.b: "Drž se svých povinností, [antiquarian.GetFirstNameNoTooltip]."
 fund_inspiration.2080.success: "[antiquarian.GetFirstNameNoTooltip] zlepšuje práci [inspiration_owner.Custom('CZ_FirstNameNoTooltip_G')]"
 fund_inspiration.2080.failure: "[antiquarian.GetFirstNameNoTooltip] dusí [inspiration_owner.Custom('CZ_FirstNameNoTooltip_A')]"
 fund_inspiration.2080.c: "Je čas na nádech čerstvého vzduchu."
 fund_inspiration.2090.t: "$fund_inspiration.title$ Manželský zásah"
 fund_inspiration.2090.desc: "Vidím [Select_CString(event_spouse.IsFemale,'svou manželku','svého manžela')] [event_spouse.GetFirstName], jak dychtivě klábosí s [inspiration_owner.Custom('CZ_TitledFirstName_I')] a chrlí nápady a návrhy na [Select_CString(inspiration_owner.IsFemale,'její','jeho')] dílo. [Select_CString(inspiration_owner.IsFemale,'Řemeslnice','Řemeslník')] jen stěží skrývá pohrdání, [Select_CString(inspiration_owner.IsFemale,'zjevně rozhořčená','zjevně rozhořčený')] vměšováním [Select_CString(event_spouse.IsFemale,'mé manželky','mého manžela')].\n\n„...a když už na tom pracuješ,“ pokračuje [event_spouse.GetFirstNameNoTooltip], „mohlo by to klidně připomínat tu starou věc po mém pradědovi!“\n\nJako by v [inspiration_owner.Custom('CZ_FirstNameNoTooltip_L')] právě zemřel kus duše."
 fund_inspiration.2090.a: "Dobře poslouchejte, [inspiration_owner.GetFirstNameNoTooltip] – [Select_CString(event_spouse.IsFemale,'má manželka musí být vyslyšena','můj manžel musí být vyslyšen')]!"
 fund_inspiration.2090.b: "Pojď, drahoušku, svěřme to odborníkovi."
 fund_inspiration.2090.success: "[event_spouse.GetFirstNameNoTooltip] zlepšuje práci [inspiration_owner.Custom('CZ_FirstNameNoTooltip_G')]"
 fund_inspiration.2090.failure: "[event_spouse.GetFirstNameNoTooltip] dusí [inspiration_owner.Custom('CZ_FirstNameNoTooltip_A')]"
 fund_inspiration.2100.t: "$fund_inspiration.title$ Závistivý řemeslník"
 fund_inspiration.2100.desc: "[inspiration_owner.GetTitledFirstName] sedí a přes talíř zírá na [other_inspiration_owner.Custom('CZ_TitledFirstName_A')], [Select_CString(other_inspiration_owner.IsFemale,'svou sokyni','svého soka')] v boji o mou přízeň.\n\nAčkoli u své práce obvykle klidně přemítá, [inspiration_owner.GetFirstNameNoTooltip] mívá při večeři rychle zkaženou náladu.\n\nDnes večer to konečně nevydrží:"
 fund_inspiration.2100.desc.funds: "„Proč [other_inspiration_owner.GetFirstNameNoTooltip] dostává víc peněz než já? ‚[other_inspiration_owner.Custom('InspirationTypeDescriptionFuturePresent')|U]‘! No a co?“"
 fund_inspiration.2100.desc.rival: "„Nemůžu uvěřit, že vyprazdňuješ své truhly kvůli [Select_CString(other_inspiration_owner.IsFemale,'té','tomu')] [other_inspiration_owner.Custom('CZ_InsultNoun_D')], [other_inspiration_owner.Custom('CZ_FirstNameNoTooltip_D')]! U čističů žump bys [Select_CString(ROOT.Char.IsFemale,'pochodila','pochodil')] líp!“"
 fund_inspiration.2100.desc.fallback: "„[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] by ses té přítěže zbavit, [ROOT.Char.Custom('FormOfAddressForLiege')]; [other_inspiration_owner.GetFirstNameNoTooltip] ani neví, za který konec vzít [other_inspiration_owner.Custom('GetInspirationTypeTool')|l], natož aby se [Select_CString(other_inspiration_owner.IsFemale,'vyznala','vyznal')] v dílně.“"
 fund_inspiration.2100.a: "Tvoje práce je mi cenná, [inspiration_owner.GetFirstNameNoTooltip]."
 fund_inspiration.2100.b: "Navýším ti prostředky, jsi [Select_CString(inspiration_owner.IsFemale,'spokojená','spokojený')]?"
 fund_inspiration.2100.c: "No tak, co se děje?"
 fund_inspiration.2100.d: "Přestaň s tím bláznovstvím."
 fund_inspiration.2100.c.leave: "[inspiration_owner.GetFirstNameNoTooltip] opouští svou práci"
 fund_inspiration.2100.c.worse: "[inspiration_owner.GetFirstNameNoTooltip] ztrácí motivaci"
 fund_inspiration.2100.success: "Spor se podařilo urovnat"
 fund_inspiration.2100.failure: "Spor se ještě zhoršil"
 fund_inspiration.2110.t: "$fund_inspiration.title$ Spoluznalec"
 fund_inspiration.2110.desc: "[Select_CString(SCOPE.sC('generous_vassal').IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('generous_vassal'))], [generous_vassal.GetTitledFirstName], mě osloví: „[Select_CString(generous_vassal.IsFemale,'Ráda','Rád')] tě vidím, [generous_vassal.Custom2('RelationToMeShort', ROOT.Char)]! [Select_CString(generous_vassal.IsFemale,'Slyšela','Slyšel')] jsem, že podporuješ [inspiration_owner.Custom('CZ_FirstName_A')]. Prý [inspiration_owner.Custom('InspirationTypeDescriptionFuturePresent')], a to dílo má být hodné [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')]. Prosím, vezmi tohle a dej [Select_CString(inspiration_owner.IsFemale,'jí','mu')] to.“"
 fund_inspiration.2110.desc.part.2: "„[Select_CString(generous_vassal.IsFemale,'Nechtěla','Nechtěl')] bych propást příležitost přispět k vytvoření mistrovského díla!“\n\n"
 fund_inspiration.2110.desc.part.2.research: "„[Select_CString(generous_vassal.IsFemale,'Nechtěla','Nechtěl')] bych propást šanci podílet se na novém vědeckém objevu!“\n\n"
 fund_inspiration.2110.desc.generous: "[generous_vassal.GetFirstNameNoTooltip] má pověst štědrého člověka a zdá se, že [Select_CString(generous_vassal.IsFemale,'našla','našel')] pro své utrácení nové uplatnění..."
 fund_inspiration.2110.desc.dweeb: "[generous_vassal.GetFirstNameNoTooltip] má zájmy v mnoha oblastech, mezi nimi cenné artefakty a myslitele, kteří je vytvářejí..."
 fund_inspiration.2110.desc.dweeb.research: "[generous_vassal.GetFirstNameNoTooltip] má zájmy v mnoha oblastech, mezi nimi technologie a myslitele, kteří je jako první vymyslí..."
 fund_inspiration.2110.desc.friend: "[generous_vassal.GetFirstNameNoTooltip] se vřele usmívá a z ruky [Select_CString(generous_vassal.IsFemale,'jí','mu')] visí měšec s mincemi."
 fund_inspiration.2110.desc.rich: "[generous_vassal.GetFirstNameNoTooltip] musí mít víc peněz, než ví, co s nimi..."
 fund_inspiration.2110.a: "Jak velkorysé!"
 fund_inspiration.2110.b: "Ó, #EMP určitě#! se postarám, aby to [Select_CString(inspiration_owner.IsFemale,'dostala','dostal')]!"
 fund_inspiration.2110.b.flavor: "To by se mohlo hodit..."
 fund_inspiration.2110.c: "Ne, prosím, ponechte si to!"
 fund_inspiration.2120.t: "$fund_inspiration.title$ Pozdě do noci"
 fund_inspiration.2120.desc: "V dílně [inspiration_owner.Custom('CZ_FirstName_G')] plyne čas jako voda; popíjíme [ROOT.Char.Custom('RegionalAlcoholicDrink')] a nadšeně rozebíráme dílo, které pro mě vytváří. Zdá se mi to, nebo je tu cítit nevyslovené... napětí?\n\n"
 fund_inspiration.2120.desc.me: "Mysl mi bloudí; vnímám jemné křivky [Select_CString(inspiration_owner.IsFemale,'jejího','jeho')] těla, [Select_CString(inspiration_owner.IsFemale,'její','jeho')] usměvavé rty... Položím ruku na [Select_CString(inspiration_owner.IsFemale,'její','jeho')]. [inspiration_owner.Custom('GetInspirationTypeTool')|U] [Select_CString(inspiration_owner.IsFemale,'jí','mu')] vypadne z třesoucích se prstů, když se toužebně zadívám do těch krásných očí.\n\n"
 fund_inspiration.2120.desc.them: "Je už pozdě, když [inspiration_owner.GetFirstNameNoTooltip] odloží [inspiration_owner.Custom('GetInspirationTypeTool')|l], napije se z poháru a významně se na mě usměje. Že by...?\n\n"
 fund_inspiration.2120.desc.them_into_alot: "Vrhne se mi do náruče jako divá zvěř a [inspiration_owner.Custom('GetInspirationTypeStation')|l] odletí přes celou místnost."
 fund_inspiration.2120.desc.them_into: "I v [Select_CString(inspiration_owner.IsFemale,'ní','něm')] cítím stejnou zoufalou vášeň: vrhá se mi do horoucí náruče..."
 fund_inspiration.2120.desc.me_zealous_homosexuality: "To je špatné, při [ROOT.Char.GetFaith.HighGodName], nemohu podlehnout těmto hříšným pokušením..."
 fund_inspiration.2120.desc.me_zealous_adultery: "Ne, [ROOT.Char.GetFaith.ReligiousText] je jasný! Cizoložství je hřích! Je to pokušení [ROOT.Char.GetFaith.DevilName]!"
 fund_inspiration.2120.desc.me_unattracted: "Najednou se ke mně [inspiration_owner.GetFirstNameNoTooltip] přiblíží a obejme mě! Rychle [Select_CString(inspiration_owner.IsFemale,'ji','ho')] zarazím, možná až příliš prudce... [Select_CString(inspiration_owner.IsFemale,'Její','Jeho')] vřelost okamžitě vychladne a změní se ve zmatek a strach."
 fund_inspiration.2120.desc.me_chaste: "Vykročí ke mně a vtáhne mě do své teplé náruče. Tělo říká ano, ale srdce křičí ne..."
 fund_inspiration.2120.desc.me_into: "Nemohu popřít, že se ve mně něco probouzí. Srdce mi zrychlí a najednou [Select_CString(inspiration_owner.IsFemale,'ji','ho')] držím v náruči, zatímco mě objímá... co se to #EMP děje#!?!"
 fund_inspiration.2120.desc.me_into_alot: "O [Select_CString(inspiration_owner.IsFemale,'jejích','jeho')] úmyslech nemůže být pochyb! Sotva se ovládám, když odstrčím [inspiration_owner.Custom('GetInspirationTypeStation')|l] stranou."
 fund_inspiration.2120.a: "Pojď sem, miláčku."
 fund_inspiration.2120.e: "Ach... [inspiration_owner.GetFirstNameNoTooltip]..."
 fund_inspiration.2120.f.chaste: "To není pro mě..."
 fund_inspiration.2120.f: "Musím... odejít!"
 fund_inspiration.2120.h: "Rychle, ke dveřím!"
 fund_inspiration.2120.i: "Oh! Nejsem..."
 fund_inspiration.2120.j: "Ne! [ROOT.Char.GetFaith.ReligiousText] zakazuje tento svazek..."
 fund_inspiration.2120.k.me: "Ne! Nemohu... cizoložství je hřích!"
 fund_inspiration.2120.k.them: "Ne, nemohu [Select_CString(inspiration_owner.IsFemale,'ji','ho')] svádět k cizoložství..."
 fund_inspiration.2120.l: "Počkej... jak se #EMP opovažuješ#!?!"
 fund_inspiration.2120.m: "Pusť mě, zkažený hříšníku!"
 fund_inspiration.2120.leave_flavor: "Rychle odcházíš"
 fund_inspiration.2130.t: "$fund_inspiration.title$ Přelétavá pobídka"
 fund_inspiration.2130.desc: "Narazím na [inspiration_owner.Custom('CZ_TitledFirstName_A')], [Select_CString(inspiration_owner.IsFemale,'která','který')] vypadá velmi vážně, a doufám, že mi nenese špatné zprávy o skvělém díle, které mi má brzy předložit.\n\n„Ach, tady jste, [ROOT.Char.Custom('FormOfAddressForLiege')]... V práci jsem se [Select_CString(inspiration_owner.IsFemale,'zasekla','zasekl')] – nic vážného! Jen mi pod tlakem docházejí nápady!“ nervózně se zasměje.\n\n„Potřebuji jen trochu... inspirace! [Select_CString(ROOT.Char.IsFemale,'Všemocná','Všemocný')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')], [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')] byste nějaké... vzory, které bych [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] prozkoumat?“"
 fund_inspiration.2130.a.library: "Do knihovny!"
 fund_inspiration.2130.a.armory: "Do zbrojnice!"
 fund_inspiration.2130.a.hall: "Do velké síně!"
 fund_inspiration.2130.a.tt: "Kvalita nebo postup [Concept('inspiration','inspirace')|E] [inspiration_owner.Custom('CZ_FirstNameNoTooltip_G')] se může zlepšit"
 fund_inspiration.2130.a.flavor: "Určitě najdeme něco, co pomůže!"
 fund_inspiration.2130.b: "Vím, co potřebujete!"
 fund_inspiration.2130.b.great: "Múza [inspiration_owner.Custom('CZ_FirstNameNoTooltip_G')] sílí"
 fund_inspiration.2130.b.good: "Múza [inspiration_owner.Custom('CZ_FirstNameNoTooltip_G')] se vrací"
 fund_inspiration.2130.b.nothing: "Múza [inspiration_owner.Custom('CZ_FirstNameNoTooltip_G')] spí"
 fund_inspiration.2130.b.bad: "Múza [inspiration_owner.Custom('CZ_FirstNameNoTooltip_G')] prchá"
 fund_inspiration.2130.b.terrible: "Múza [inspiration_owner.Custom('CZ_FirstNameNoTooltip_G')] umírá"
 fund_inspiration.2130.b.flavor: "To bude zábava!"
 fund_inspiration.2130.c: "Ah, mám právě ten elixír."
 fund_inspiration.2130.c.dead: "[inspiration_owner.GetFirstNameNoTooltip] padne [Select_CString(inspiration_owner.IsFemale,'mrtvá','mrtvý')]"
 fund_inspiration.2130.c.flavor: "Kde je ta červená lahvička..."
 fund_inspiration.2130.d: "Skutečná inspirace přichází zevnitř."
 fund_inspiration.2131.t: "$fund_inspiration.title$ Pryč se starým"
 fund_inspiration.2131.desc_library_unused: "S hlubokým nádechem vstoupíme s [inspiration_owner.Custom('CZ_TitledFirstName_I')] do mé zaprášené knihovny – místnosti, kam mám jen málokdy důvod chodit.\n\n"
 fund_inspiration.2131.desc_library: "Vedu [inspiration_owner.Custom('CZ_TitledFirstName_A')] do své dobře udržované knihovny a ukazuji [Select_CString(inspiration_owner.IsFemale,'jí','mu')] některé pozoruhodné svazky a vystavené lektvary.\n\n"
 fund_inspiration.2131.desc_armory_unused: "Vyděšený voják uvede [inspiration_owner.Custom('CZ_TitledFirstName_A')] a mě do zaneřáděné zbrojnice – sem nikdy nechodím!\n\n"
 fund_inspiration.2131.desc_armory: "Vstoupíme s [inspiration_owner.Custom('CZ_TitledFirstName_I')] do mé rozsáhlé zbrojnice, kde ukazuji některé své oblíbené kusy a vyprávím jejich příběhy.\n\n"
 fund_inspiration.2131.desc_great_hall_low: "Když [inspiration_owner.Custom('CZ_TitledFirstName_D')] rychle ukazuji kuriozity, napadne mě, že má velká síň není tak velkolepá, jak by mohla být.\n\n"
 fund_inspiration.2131.desc_great_hall: "Provádím [inspiration_owner.Custom('CZ_TitledFirstName_A')] svou velkou síní a hrdě ukazuji její přepych a nejrůznější vystavené poklady."
 fund_inspiration.2131.desc_antiquarian: "[second.GetTitledFirstName] [Select_CString(second.IsFemale,'trvala','trval')] na tom, že půjde s námi, a sleduje vše z povzdálí; pokaždé, když s nějakým předmětem někdo špatně zachází nebo ho chybně určí, otřese se.\n\n"
 fund_inspiration.2131.artificer: "[second.GetTitledFirstName] se ochotně přidá, vždy [Select_CString(second.IsFemale,'zaujatá','zaujatý')] tvůrčími postupy svých kolegů.\n\n"
 fund_inspiration.2131.desc_equipped: "[inspiration_owner.GetFirstNameNoTooltip] se jako u vytržení zastaví a zkoumá můj [artifact_1.GetName]. „Ach, velmi pěkné, [ROOT.Char.Custom('FormOfAddressForLiege')]... [Select_CString(inspiration_owner.IsFemale,'Mohla','Mohl')] bych... použít ten materiál – [inspiration_owner.Custom('GetInspirationMaterialType')|l]?“"
 fund_inspiration.2131.desc_unequipped: "Ve skladišti se [inspiration_owner.GetFirstNameNoTooltip] náhle zastaví a pozorně si prohlíží můj [artifact_1.GetName]. „Ano... tenhle materiál – [inspiration_owner.Custom('GetInspirationMaterialType')|l] – by mohl stačit... Potřebujete... tohle ještě, [ROOT.Char.Custom('FormOfAddressForLiege')]?“"
 fund_inspiration.2131.desc_fallback: "Několikrát obejde místnost a pak se ke mně [Select_CString(inspiration_owner.IsFemale,'zklamaná','zklamaný')] vrátí. „[ROOT.Char.Custom('FormOfAddressForLiege')|U], nic tu mě nezaujalo... není tu ještě něco jiného?“"
 fund_inspiration.2131.a: "Ten [artifact_1.GetNameNoTooltip]? Velmi dobře..."
 fund_inspiration.2131.b: "Co třeba můj [artifact_2.GetNameNoTooltip]?"
 fund_inspiration.2131.c: "Určitě tu někde leží nějaké harampádí..."
 fund_inspiration.2131.c.good: "Najdeš kvalitní materiál"
 fund_inspiration.2131.c.nothing: "Nic nenajdeš"
 fund_inspiration.2131.c.bad: "Najdeš jen podřadný materiál"
 fund_inspiration.2131.d: "Jen se rozhlédněte."
 fund_inspiration.2131.d.great: "[inspiration_owner.GetNameNoTooltip] narazí na zlato"
 fund_inspiration.2131.d.good: "[inspiration_owner.GetNameNoTooltip] najde materiál"
 fund_inspiration.2131.d.nothing: "[inspiration_owner.GetNameNoTooltip] nic nenajde"
 fund_inspiration.2131.d.bad: "[inspiration_owner.GetNameNoTooltip] najde podřadný materiál"
 fund_inspiration.2131.d.terrible: "[inspiration_owner.GetNameNoTooltip] najde mizerný materiál"
 fund_inspiration.2131.e: "[second.GetFirstNameNoTooltip]! Máš nějaké nápady?"
 fund_inspiration.2131.f: "Jaká ztráta času!"
 fund_inspiration.3001.t: "$fund_inspiration.title$ Bezbožné psaní"
 fund_inspiration.3001.desc_opening: "[court_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vběhne do místnosti s hromadou papírů v ruce a v patách [Select_CString(court_chaplain.IsFemale,'jí','mu')] je [Select_CString(inspiration_owner.IsFemale,'zaskočená','zaskočený')] [inspiration_owner.GetTitledFirstName], [Select_CString(inspiration_owner.IsFemale,'která','který')] se [Select_CString(court_chaplain.IsFemale,'jí','mu')] snaží spisy vytrhnout z rukou.\n\n"
 fund_inspiration.3001.desc_witch: "[Select_CString(inspiration_owner.IsFemale,'Tahle žena','Tenhle muž')] píše o bytosti zvané [ROOT.Char.GetFaith.WitchGodName]. #EMP [ROOT.Char.GetFaith.WitchGodName]#!!"
 fund_inspiration.3001.desc_cannibal: "[Select_CString(inspiration_owner.IsFemale,'Tahle žena','Tenhle muž')] píše o #EMP pojídání lidského masa#!!"
 fund_inspiration.3001.desc_torturer: "[Select_CString(inspiration_owner.IsFemale,'Tahle žena','Tenhle muž')] píše o nevýslovných, sadistických činech!"
 fund_inspiration.3001.desc_lustful: "[Select_CString(inspiration_owner.IsFemale,'Tahle žena','Tenhle muž')] píše o nevýslovných, zvrhlých činech!"
 fund_inspiration.3001.desc_other: "[Select_CString(inspiration_owner.IsFemale,'Tahle žena','Tenhle muž')] píše o bezbožných věcech!"
 fund_inspiration.3001.desc_ending: "A s ilustracemi! Mohu jen předpokládat, že o tom nevíte, [ROOT.Char.Custom('FormOfAddressForLiege')].“\n\n[inspiration_owner.GetTitledFirstNameNoTooltip] se uchechtne a znovu se po papírech vrhne, ale můj [court_chaplain.Custom('CouncilPosition')] uhne.\n\n„Ale teď, když je ten odporný pisálek odhalen, jistě necháte knihu zasvětit naší víře, jak se sluší.“"
 fund_inspiration.3001.a: "Rozhodně; [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')] jsem tušení, že píše o takových věcech."
 fund_inspiration.3001.a_tt: "[inspiration_owner.GetShortUIName] bude psát o víře místo o tématu [inspiration_owner.Custom('ArtifactBookSubject')]"
 fund_inspiration.3001.b: "Víš, co by se slušelo? Nechat [Select_CString(inspiration_owner.IsFemale,'ji','ho')] na pokoji!"
 fund_inspiration.3001.c: "Ty ilustrace vypadají fádně... Vezmi toto zlato na koupi nového inkoustu."
 fund_inspiration.3011.t: "$fund_inspiration.title$ Válečná témata"
 fund_inspiration.3011.desc_opening_1: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] sedí [Select_CString(inspiration_owner.IsFemale,'obklopená','obklopený')] svitky a rukopisy a zuřivě listuje stránkami.\n\n"
 fund_inspiration.3011.desc_opening_2: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] sedí [Select_CString(inspiration_owner.IsFemale,'obklopená','obklopený')] svitky a rukopisy a drží se za hlavu.\n\n"
 fund_inspiration.3011.desc_opening_3: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně přistoupí s náručí plnou svitků a rukopisů.\n\n"
 fund_inspiration.3011.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Je tolik oblastí válčení, které si zaslouží pozornost. Strategie, složení jednotek, samotný boj... Ani nevím, kde začít!“"
 fund_inspiration.3011.a: "Chci, aby kniha byla poučná nebo užitečná pro armádu."
 fund_inspiration.3011.a.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] se ve svém psaní zaměří na témata jako strategie a sestavy jednotek"
 fund_inspiration.3011.b: "Možná něco narážejícího na ušlechtilejší stránky tohoto tématu."
 fund_inspiration.3011.b.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] se ve svém psaní zaměří na témata jako rytířství a statečnost"
 fund_inspiration.3011.d: "Po jakém tématu vaše múza touží?"
 fund_inspiration.3011.d.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] si svobodně zvolí téma knihy"
 fund_inspiration.3012.t: "$fund_inspiration.title$ Témata diplomacie"
 fund_inspiration.3012.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Je tolik oblastí diplomacie, které stojí za pozornost. Dvorní chování, vztahy, #EMP poezie#!... Ani nevím, kde začít!“"
 fund_inspiration.3012.a: "Možná něco, co se týká života na dvoře."
 fund_inspiration.3012.a.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] se ve svém psaní zaměří na témata jako aliance a výmluvnost"
 fund_inspiration.3012.b: "Chci, aby byla kniha zábavná!"
 fund_inspiration.3012.b.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] se ve svém psaní zaměří na témata jako dobrodružství a zábava"
 fund_inspiration.3013.t: "$fund_inspiration.title$ Odborná témata"
 fund_inspiration.3013.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Je tolik oblastí, které si zaslouží pozornost. Náboženství, vzdělání... Nemluvě o umění samotného psaní!“"
 fund_inspiration.3013.a: "Toto dílo by mělo sloužit naší víře!"
 fund_inspiration.3013.a.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] se ve svém psaní zaměří na témata jako teologie a modlitby"
 fund_inspiration.3013.b: "Chci, aby kniha byla vzdělávací, nebo aspoň zábavná!"
 fund_inspiration.3013.b.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] se ve svém psaní zaměří na témata jako dějiny a poezie"
 fund_inspiration.3014.t: "$fund_inspiration.title$ Témata správy"
 fund_inspiration.3014.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Je tolik oblastí správy, které si zaslouží pozornost. Zákony, obchod, #EMP peníze#!... Ani nevím, kde začít!“"
 fund_inspiration.3014.a: "Zaměřte se na věci spojené s vládou nad říší."
 fund_inspiration.3014.a.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] se ve svém psaní zaměří na témata jako právo a správa"
 fund_inspiration.3014.b: "Zajímá mě rozvoj!"
 fund_inspiration.3014.b.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] se ve svém psaní zaměří na témata jako stavby a zdanění"
 fund_inspiration.3015.t: "$fund_inspiration.title$ Témata intrik"
 fund_inspiration.3015.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Je tolik oblastí intrik, které stojí za pozornost. Intriky, svádění, manipulace... Ani nevím, kde začít!“"
 fund_inspiration.3015.a: "Chci být o krok napřed před #EMP všemi#!!"
 fund_inspiration.3015.a.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] se ve svém psaní zaměří na témata jako intriky a manipulace"
 fund_inspiration.3015.b_men: "Chci, aby muži padali k mým nohám!"
 fund_inspiration.3015.b_women: "Chci, aby ženy padaly k mým nohám!"
 fund_inspiration.3015.b_both: "Chci, aby po mně všichni toužili!"
 fund_inspiration.3015.b_none: "Chci ovládnout umění svádění."
 fund_inspiration.3015.b.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] se ve svém psaní zaměří na témata jako chtíč a umění svádění"
 fund_inspiration.3030.t: "$fund_inspiration.title$ Ochlazující nenávist"
 fund_inspiration.3030.desc_opening: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě [Select_CString(inspiration_owner.IsFemale,'pozvala','pozval')], abychom probrali téma knihy, kterou pro mě píše.\n\n"
 fund_inspiration.3030.desc: "„Nemohu si nevšimnout, že [prev_nemesis.Custom2('YourCharacterIntroduction', ROOT.Char)] už ve vás nevzbuzuje takovou zášť jako dřív. Chcete tuto knihu stále věnovat nenávisti, kterou k [Select_CString(prev_nemesis.IsFemale,'ní','němu')] cítíte?“"
 fund_inspiration.3030.desc_dead: "„Teď, když [prev_nemesis.Custom2('YourCharacterIntroduction', ROOT.Char)] už není mezi živými, chcete tuto knihu stále věnovat nenávisti, kterou jste k [Select_CString(prev_nemesis.IsFemale,'ní','němu')] [Select_CString(ROOT.Char.IsFemale,'cítila','cítil')]?“"
 fund_inspiration.3030.a: "Nenávist, kterou cítím, se ještě příliš neochladila."
 fund_inspiration.3030.a.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] pokračuje v psaní o tvé nenávisti k [prev_nemesis.Custom('CZ_TitledFirstName_D')]"
 fund_inspiration.3030.b: "[prev_nemesis.GetSheHe|U] nestojí za tu námahu."
 fund_inspiration.3031.t: "$fund_inspiration.title$ Uvadající láska"
 fund_inspiration.3031.desc: "„Nemohu si nevšimnout, že [prev_soulmate.Custom2('YourCharacterIntroduction', ROOT.Char)] už nepožívá vaší #EMP nejvyšší#! přízně, [ROOT.Char.Custom('FormOfAddressForLiege')]. Chcete tuto knihu stále věnovat lásce, kterou k [Select_CString(prev_soulmate.IsFemale,'ní','němu')] cítíte?“"
 fund_inspiration.3031.desc_dead: "„Bolest ze ztráty musí být stále čerstvá... [prev_soulmate.Custom2('YourCharacterIntroduction', ROOT.Char)|U] už není mezi živými. Chcete tuto knihu stále věnovat lásce, kterou jste k [Select_CString(prev_soulmate.IsFemale,'ní','němu')] [Select_CString(ROOT.Char.IsFemale,'cítila','cítil')]?“"
 fund_inspiration.3031.a: "Co je láska bez touhy a ztráty?"
 fund_inspiration.3031.a.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] pokračuje v psaní o lásce, kterou jsi [Select_CString(ROOT.Char.IsFemale,'sdílela','sdílel')] s [prev_soulmate.Custom('CZ_TitledFirstName_I')]"
 fund_inspiration.3031.b: "[prev_soulmate.GetSheHe|U] nestojí za tu námahu."
 fund_inspiration.4001.t: "$fund_inspiration.title$ Osnova a útko"
 fund_inspiration.4001.desc: "„[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi #EMP [Select_CString(inspiration_owner.IsFemale,'zničila','zničil')]#! můj nový oděv!“\n\n[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vtrhne do místnosti a v patách má [Select_CString(inspiration_owner.IsFemale,'tkadlenu','tkalce')]. Kus oděvu, který drží v rukou, je tak strašně roztrhaný, že ani nepoznám, čím původně byl.\n\n„Přeháníš! Jen jsem [Select_CString(inspiration_owner.IsFemale,'zkoumala','zkoumal')] vzor tkaniny, je to pro můj projekt důležité.“"
 fund_inspiration.4001.a: "Přeháníš to, zkoumej si klidně své vlastní oblečení, pokud musíš!"
 fund_inspiration.4001.b: "Když říká, že je to nutné, pak je to nutné."
 fund_inspiration.4010.t: "$fund_inspiration.title$ Kompozice v červené, modré a [ROOT.Char.GetTitleAsNameNoTooltip|U]"
 fund_inspiration.4010.desc: "Zajdu do dílny svého tkalce zkontrolovat, jak postupuje můj gobelín. Uvnitř je pár dvořanů. Všichni zkoumají stěny, ruce složené za zády. Vystavené tapisérie jsou podivné barevné plochy. Jedna má tady a tam neohrabané skvrny. Jedna je bílá s pár čtverci. Jedna má točící se zamotané čáry. Co to má být za umění?\n\n[artistic_courtier_1.GetTitledFirstNameNoTooltip] ukáže na část, která vypadá jako skvrna. „Nesvědčí tohle špinavě hnědé proti bílé opravdu o násilí vrozeném člověku?“\n\n[artistic_courtier_2.GetTitledFirstNameNoTooltip] přikývne. „Myslím, že to ukazuje, jak [inspiration_owner.GetTitledFirstNameNoTooltip] zuří proti svému dětství – vypadá to, že to má tvar [Select_CString(inspiration_owner.IsFemale,'její','jeho')] matky.“"
 fund_inspiration.4010.a: "Přikývněte a pochvalte umělce"
 fund_inspiration.4010.b: "„Odporné! Musím jít teď podívat na nějaké tradiční umění.“"
 fund_inspiration.4010.b.tt: "Tvoje investice je vrácena a dílo zrušeno"
 fund_inspiration.4010.c: "„Tohle by [Select_CString(child.IsFemale,'zvládla','zvládl')] i [child.GetTitledFirstNameNoTooltip]!“"
 fund_inspiration.5011.desc: "„Nastal čas, abych [Select_CString(inspiration_owner.IsFemale,'vyrazila','vyrazil')] na své dobrodružství, [ROOT.Char.Custom('FormOfAddressForLiege')].“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se ukloní, jak nejlépe to pod tíhou těžkých zavazadel jde.\n\n„Než odjedu, řekněte mi prosím, je něco konkrétního, po čem bych se [Select_CString(inspiration_owner.IsFemale,'měla','měl')] na cestě poohlédnout?“"
 fund_inspiration.5011.a: "Přineste mi něco z exotického zvířete, lebku nebo kůži."
 fund_inspiration.5011.b: "Chci drobnost z materiálu, který zde nelze najít."
 fund_inspiration.5011.c: "Gobelín nebo umělecké dílo, které ve mně vyvolá touhu být tam."
 fund_inspiration.5011.d: "Důvěřuji vašemu instinktu, že mi přinesete něco skvělého."
 fund_inspiration.5011.e: "Chci vlastnit něco skutečně jedinečného!"
 fund_inspiration.5021.t: "$fund_inspiration.title$ Změna směru"
 fund_inspiration.5021.desc: "Předvedou ke mně pocestného, který tvrdí, že slouží u [inspiration_owner.Custom('CZ_TitledFirstName_G')], a nese zprávu od dobrodruha.\n\n„Nebojte se, [ROOT.Char.Custom('FormOfAddressForLiege')], [inspiration_owner.GetTitledFirstNameNoTooltip] je v dobrém zdraví. Přináším zprávu o možnosti financovat ještě větší dobrodružství! Víte, [inspiration_owner.GetTitledFirstNameNoTooltip] někde [Select_CString(inspiration_owner.IsFemale,'zabloudila','zabloudil')] a nyní se nachází poblíž [adventuring_location.Custom('CZ_LandedNameNoTier_G')].“\n\nCestovní společník [inspiration_owner.Custom('CZ_FirstNameNoTooltip_G')] rozvine špinavou mapu, aby mi ukázal, kde skončili. „[inspiration_owner.GetSheHe|U] má dost prostředků, aby se dostal do [inspiration_owner.Custom('InspirationAdventureDestination')], jak bylo plánováno, ale navrhuje, že s dodatečným financováním může vypátrat místní pověru a přivést domů skvělý artefakt!“"
 fund_inspiration.5021.a: "To je absurdní! Nehodlám financovat jejich #EMP sobecký výlet#!!"
 fund_inspiration.5021.a.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] se vrací k tomu, co si původně [Select_CString(inspiration_owner.IsFemale,'stanovila','stanovil')]."
 fund_inspiration.5021.b: "Život je dobrodružství, prozkoumejte tu oblast kvůli artefaktům!"
 fund_inspiration.5021.b.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] prozkoumává [adventuring_location.GetNameNoTierNoTooltip]."
 fund_inspiration.6001.t: "Step a sedlo cvalem projíždějí mým srdcem,"
 fund_inspiration.6001.desc: "Jezdím už celé měsíce. Můj zadek se z toho nikdy nevzpamatuje! [Select_CString(inspiration_owner.IsFemale,'Přišla','Přišel')] jsem na chuť kvašenému kobylímu mléku a nocím pod širým nebem.\n\nPo tomto kurýrovi posílám vyřezávanou hlavici morin chuuru – ozdobnou koňskou hlavu, která zdobí vršek tohoto nástroje. Možná ji nějak využijete."
 fund_inspiration.6001.a: "Uložím si to!"
 fund_inspiration.6001.b: "Pošlete to dvornímu hudebníkovi."
 fund_inspiration.6002.t: "Moje výprava po Indii pokračuje!"
 fund_inspiration.6002.desc: "Drahokamy, které mi ukazují na všech dvorech, jež navštěvuji, mě už skoro oslepily. Přistihuji se, že toužím po prachu otevřené cesty.\n\nPo kurýrovi posílám obzvlášť nevkusný dar, který jsem [Select_CString(inspiration_owner.IsFemale,'dostala','dostal')] – ozdobu prstenu ve tvaru tygří hlavy s drahokamy místo očí. [Select_CString(ROOT.Char.IsFemale,'Viděla','Viděl')] jste někdy něco tak kýčovitého?"
 fund_inspiration.6002.a: "Mně se to líbí. Jeho škoda."
 fund_inspiration.6002.b: "Strašné! Rozložte to a prodejte drahokamy."
 fund_inspiration.6003.t: "Sním o poušti,"
 fund_inspiration.6003.desc: "[ROOT.Char.Custom('FormOfAddressForLiege')|U], má cesta Afrikou pokračuje a [Select_CString(inspiration_owner.IsFemale,'připojila','připojil')] jsem se ke karavaně velbloudů, která křižuje zemi.\n\nPosílám vám šperk, který mi věnoval jeden ze spolucestujících – nejjemnější náhrdelník posázený korálky z pštrosích vajec. Předpokládám, že jste pštrosa ještě [Select_CString(ROOT.Char.IsFemale,'neviděla','neviděl')]."
 fund_inspiration.6003.a: "Skvělý nález! [Select_CString(ROOT.Char.IsFemale,'Sama','Sám')] si ho vezmu na sebe."
 fund_inspiration.6003.b: "Dám to [event_spouse.Custom('CZ_TitledFirstNameNoTooltip_D')]."
 fund_inspiration.6004.t: "Ach, být poutníkem,"
 fund_inspiration.6004.desc: "Má cesta Blízkým východem obnášela hlavně souboje s nesčetnými pouličními prodavači na poutních cestách.\n\nAbych své pátrání příliš [Select_CString(inspiration_owner.IsFemale,'nezdržovala','nezdržoval')], často se podvolím a koupím od nich nějakou cetku. Po kurýrovi vám posílám tenhle kýč. Možná vás pobaví."
 fund_inspiration.6004.a: "K čemu je dobrodruh, který jde po vyšlapané cestě?"
 fund_inspiration.6004.b: "To jsou docela pěkné cetky..."
 fund_inspiration.6005.t: "Moje dobrodružství jsou promoklá,"
 fund_inspiration.6005.desc: "[ROOT.Char.Custom('FormOfAddressForLiege')|U], na svých cestách jsem zatím [Select_CString(inspiration_owner.IsFemale,'našla','našel')] jen pár ošuntělých relikvií, které posílám po tomto kurýrovi, a nejsem si [Select_CString(inspiration_owner.IsFemale,'jistá','jistý')], co dalšího ještě mohu objevit.\n\nEvropané jsou ta nejpáchnoucí stvoření, jaká jsem kdy [Select_CString(inspiration_owner.IsFemale,'potkala','potkal')]. Jako dítě jsem [Select_CString(inspiration_owner.IsFemale,'snila','snil')] o zelených, příjemných loukách, ale teď jsem [Select_CString(inspiration_owner.IsFemale,'přesvědčená','přesvědčený')], že polovina tohoto světa je z bláta. Jste-li [Select_CString(ROOT.Char.IsFemale,'laskavá panovnice','laskavý panovník')], povolejte mě zpět."
 fund_inspiration.6005.a: "Tohle není dovolená! Pokračujte v pátrání!"
 fund_inspiration.6005.b: "Chudáček. Myslím, že tyto odměny postačí."
 fund_inspiration.6005.b.tt: "Dovolíš [inspiration_owner.Custom('CZ_TitledFirstName_D')] vrátit se domů"
 fund_inspiration.6006.t: "Pozdravy z Anatolie,"
 fund_inspiration.6006.desc: "Mé cesty po Malé Asii ve mně zanechaly značnou chuť na jehněčí, jogurt a lilek, a poslal jsem s tímto kurýrem i několik receptů.\n\nJeden z mých hostitelů mi daroval zlatou sponu zdobenou mořským koníkem, kterou vám také posílám. Jsem [Select_CString(inspiration_owner.IsFemale,'přesvědčená','přesvědčený')], že mé cesty přinesou časem další zázraky."
 fund_inspiration.6006.a: "Rozkažte našim kuchařům okamžitě připravit tato jídla!"
 fund_inspiration.6006.b: "Zdá se, že si tu výpravu až příliš užívá..."
 fund_inspiration.6100.t: "$fund_inspiration.title$ Vzorový vládce"
 fund_inspiration.6100.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se rozradostněně snaží upoutat mou pozornost. „[ROOT.Char.Custom('FormOfAddressForLiege')|U], [Select_CString(inspiration_owner.IsFemale,'dokončila','dokončil')] jsem miniaturní prototyp truhly, kterou jste si [Select_CString(ROOT.Char.IsFemale,'objednala','objednal')], včetně funkčního zámku.“\n\nNatáhne dlaň a na ní spočívá maličká truhlička, zdobená zlatou linkou a s klíčkem malým jako zrníčko.\n\n„Uvnitř je drahokam, vyzkoušejte si ho.“ Když mi truhličku podává, klíček [Select_CString(inspiration_owner.IsFemale,'jí','mu')] vyklouzne z prstů a odletí. Ať [inspiration_owner.GetSheHe] škrábe, kde může, nikde není."
 fund_inspiration.6100.a: "Ukončete tuto frašku, rozbijte truhličku a vraťte můj kámen!"
 fund_inspiration.6100.b: "Je to stále půvabné, myslím, že si to nechám."
 fund_inspiration.6101.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] podá maličkou krabičku s nejjemnějšími, vlasově tenkými rytinami. „Prototyp vaší poslední zakázky. Nechci, aby to vyšlo na zmar. Mohli bychom tomu najít použití.“\n\n[antiquarian.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se oživí. „Můžeme do něj vložit relikvii naší doby a někam ji zakopat — vytvořit památku, kterou budou budoucí děti odhalovat!“"
 fund_inspiration.6101.a: "Uložím do něj svůj miniaturní portrét."
 fund_inspiration.6101.b: "Napíšu malou báseň a zapečetím ji uvnitř."
 fund_inspiration.6101.c: "Raději si to nechám pro sebe."
 fund_inspiration.6102.desc: "Chystám se jít spát, když mi chodidlem projede ostrá bolest.\n\nKdyž se podívám, zjistím, že mi v chodidle vězí miniaturní soška a ven z něj trčí jen její nožičky.\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] rozpačitě nakukuje ze dveří. „Omlouvám se, to je prototyp vaší poslední zakázky. [Select_CString(inspiration_owner.IsFemale,'Musela','Musel')] jsem ho upustit.“"
 fund_inspiration.6102.a: "„Vytrhněte to a odstraňte mi to z očí!“"
 fund_inspiration.6102.b: "„Měl by se na to podívat lékař.“"
 fund_inspiration.6102.c: "Vytrhněte to a schovejte si to do kapsy."
 fund_inspiration.6102.cure_toast: "Miniatura bezpečně vytažena"
 fund_inspiration.6102.failure_toast: "Tvrdohlavá miniatura"
 fund_inspiration.6102.failure_toast_desc: "Kus paže sošky zůstal v hlubinách tvého chodidla"
 fund_inspiration.6103.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se ukloní. „[Select_CString(inspiration_owner.IsFemale,'Ráda','Rád')] bych [Select_CString(inspiration_owner.IsFemale,'slyšela','slyšel')] váš názor na skříňku, kterou pro vás právě vyrábím, [ROOT.Char.Custom('FormOfAddressForLiege')].“\n\nZavede mě do své dílny, kde stojí jen zaprášená, ošuntělá skříň.\n\n„To ale není ono.“ Otevře oprýskanou skříň a uvnitř není nic než maličký model skříňky – ozdobný, posázený kameny a pozlacený, ale vysoký asi jako můj prst. „Co na to říkáte?“"
 fund_inspiration.6103.a: "Pro vaše dobro snad tohle bude jen prototyp."
 fund_inspiration.6103.b: "Ó, je dokonalé! Zbožňuji to!"
 fund_inspiration.6104.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi přinese malou krabičku a s úsměvem mi ji podává.\n\nKdyž krabičku otevřu, očekávám šperk, prsten nebo řezbu, ale ku mému překvapení je uvnitř miniaturní trůn, tak malý, že na něm může sedět jen myš.\n\n„Prototyp vašeho nového sedadla, [ROOT.Char.Custom('FormOfAddressForLiege')]. [Select_CString(inspiration_owner.IsFemale,'Myslela','Myslel')] jsem, že by vás to pobavilo.“"
 fund_inspiration.6104.a: "Jak půvabné! Nechám si to!"
 fund_inspiration.6104.b: "To je hezké, ale pokračujte v projektu."
 fund_inspiration.6104.c: "Jsem #EMP příliš#! [Select_CString(ROOT.Char.IsFemale,'dospělá','dospělý')] na hraní s hračkami."
 fund_inspiration.6105.desc: "Hrdě nesu krabičku s miniaturním nábytkem přes [ROOT.Char.Custom('FortifiedBuilding')], a přemýšlím, kde bych ho nejlépe [Select_CString(ROOT.Char.IsFemale,'vystavila','vystavil')], když narazím na [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\nKdyž uvidí, co je v krabici, utře si slzu. „[Select_CString(ROOT.Char.IsFemale,'Ženo','Muži')] vkusu, pojďte se mnou.“\n\nZavede mě do své dílny a vytáhne tajnou bednu. Uvnitř jsou desítky kousků miniaturní scénografie, figurek a terénu. „[Select_CString(inspiration_owner.IsFemale,'Vymyslela','Vymyslel')] jsem hru — fantazijní obléhací bitvu. Připojíte se ke mně?“"
 fund_inspiration.6105.a: "[Select_CString(ROOT.Char.IsFemale,'Myslela','Myslel')] jsem, že se mě nikdy nezeptáte!"
 fund_inspiration.6105.b: "Eh, možná jindy."
 fund_inspiration.6200.t: "$fund_inspiration.title$ Kompozice v červené, modré a [ROOT.Char.GetTitleAsNameNoTooltip|U]"
 fund_inspiration.6200.desc: "Zajdu do dílny svého tkalce zkontrolovat, jak postupuje můj gobelín. Uvnitř je pár dvořanů. Všichni zkoumají stěny, ruce složené za zády. Vystavené tapisérie jsou podivné barevné plochy. Jedna má tady a tam neohrabané skvrny. Jedna je bílá s pár čtverci. Jedna má točící se zamotané čáry. Co to má být za umění?\n\n[artistic_courtier_1.GetTitledFirstName] ukáže na část, která vypadá jako skvrna. „Nesvědčí tohle špinavě hnědé proti bílé opravdu o násilí vrozeném člověku?“\n\n[artistic_courtier_2.GetTitledFirstNameNoTooltip] přikývne. „Myslím, že to ukazuje, jak [ROOT.Char.GetTitledFirstNameNoTooltip] zuří proti svému dětství – vypadá to, že to má tvar [Select_CString(ROOT.Char.IsFemale,'její','jeho')] matky.“"
 fund_inspiration.6200.a: "Přikývněte a pochvalte umělce"
 fund_inspiration.6200.b: "„Odporné! Musím jít teď podívat na nějaké tradiční umění.“"
 fund_inspiration.6200.b.tt: "Tvoje investice je vrácena a dílo zrušeno"
 fund_inspiration.6200.c: "„Tohle by [Select_CString(child.IsFemale,'zvládla','zvládl')] i [child.GetTitledFirstNameNoTooltip]!“"
 fund_inspiration.6300.t: "$fund_inspiration.title$ Nešťastná sloka"
 fund_inspiration.6300.intro: "Narazím na [inspiration_owner.Custom('CZ_TitledFirstName_A')], [Select_CString(inspiration_owner.IsFemale,'která','který')] sedí u stolu a zírá z okna; před [Select_CString(inspiration_owner.IsFemale,'ní','ním')] leží spousta rozmazaných konceptů.\n\n"
 fund_inspiration.6300.no_relationship_desc: "„Představa, že by mě někdo miloval, je nemožná. Ani jednou jsem [Select_CString(inspiration_owner.IsFemale,'nešeptala','nešeptal')] slova lásky nikomu, kdo by mi je oplatil.“\n\n„Proto jsem pro vás nic [Select_CString(inspiration_owner.IsFemale,'nenapsala','nenapsal')] – jen počítám večery od chvíle, kdy jsem s někým [Select_CString(inspiration_owner.IsFemale,'spala','spal')], a zoufám si.“"
 fund_inspiration.6300.no_love_desc: "„Ačkoli mě obvykle nic nerozpálí víc než psané slovo, k mému údivu mě teď nenapadají vůbec žádné vášnivé city.“\n\n„Omlouvám se, [ROOT.Char.Custom('FormOfAddressForLiege')], nemohu psát o lásce, múza mě opustila.“"
 fund_inspiration.6300.homosexual_desc: "„Ach, [ROOT.Char.Custom('FormOfAddressForLiege')]. [Select_CString(inspiration_owner.IsFemale,'Strávila','Strávil')] jsem mnoho hodin snahou složit romantické dílo hodné vaší přízně, ale [Select_CString(inspiration_owner.IsFemale,'zjistila','zjistil')] jsem, že nad pergamenem jen pláču.“\n\n„Žádáte po mně nemožné. Má láska musí zůstat nevyslovena.“"
 fund_inspiration.6300.a: "Skvěle! Nasměrujte ten hořkosladký hněv!"
 fund_inspiration.6300.a.failure: "Přiměješ [inspiration_owner.Custom('CZ_ShortUIName_A')], aby [Select_CString(inspiration_owner.IsFemale,'pohrdala','pohrdal')] láskou."
 fund_inspiration.6300.a.success: "Přesvědčíš [inspiration_owner.Custom('CZ_ShortUIName_A')], aby [Select_CString(inspiration_owner.IsFemale,'psala','psal')] o lásce."
 fund_inspiration.6300.b: "No, mám půl hodiny navíc."
 fund_inspiration.6300.c: "Nemožné! Jak může svět nevidět kouzlo vaší výřečnosti?"
 fund_inspiration.6300.d: "Ale je to láska, která má být prožita."
 fund_inspiration.6300.e: "Pište svou pravdu, žehnám každé múze."
 fund_inspiration.6300.f: "Vymyslete něco! Všichni, kdo píší o lásce, jsou podvodníci."
 fund_inspiration.6301.t: "$fund_inspiration.title$ Můj drahý společníku,"
 fund_inspiration.6301.lover_desc: "V noci poté, co jste mi [Select_CString(ROOT.Char.IsFemale,'poručila','poručil')] psát od srdce, jsem [Select_CString(inspiration_owner.IsFemale,'zjistila','zjistil')], že dokážu psát jen o vás. Ať jsem za padoucha, je-li naše láska považována za hříšnou."
 fund_inspiration.6301.friend_desc: "Nikdy mi slova neplynula tak snadno jako poté, co jste mi [Select_CString(ROOT.Char.IsFemale,'poručila','poručil')] napsat příběh lásky, jak ji [Select_CString(inspiration_owner.IsFemale,'sama','sám')] prožívám."
 fund_inspiration.6301.female_desc: "\n\nZde je báseň o čarodějnici, která se zamiluje do královny, jež se ztratí v hájku u své chalupy."
 fund_inspiration.6301.male_desc: "\n\nZde je balada o princi, který každou noc pozoruje hvězdy se svou milovanou archivářkou na vrcholu knihovní věže a sní o tom, že se budou milovat na nebesích."
 fund_inspiration.6301.crime_desc: "Jaký krásný zločin."
 fund_inspiration.6301.a: "Budu si toho vážit, ale uchovám to v tajnosti."
 fund_inspiration.6301.b: "Ať si svět říká, co chce, uspořádám veřejné čtení!"
 fund_inspiration.6400.t: "$fund_inspiration.title$ Putování hospodami"
 fund_inspiration.6400.desc: "Při návštěvě krčmy [CZPrepV(ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip)] [ROOT.Char.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')] zahlédnu jednoho z hostů v centru pozornosti.\n\nJe ošlehanější než ostatní hosté a voní, jako by tam [Select_CString(inspiration_owner.IsFemale,'seděla','seděl')] celou věčnost. K mému zděšení rozpoznám svého dobrodruha, [inspiration_owner.GetTitledFirstName], [Select_CString(inspiration_owner.IsFemale,'která','který')] se po měsících financování zjevně ani [Select_CString(inspiration_owner.IsFemale,'nehnula','nehnul')] z domova!\n\n„Na další cestě přeplavu Rudé moře jedním lokem!“ A hned zhltne celý pohár červeného vína a v hostinci zavládne jásot."
 fund_inspiration.6400.a: "Zmizni odsud a vyraž na cestu!"
 fund_inspiration.6400.b: "[Select_CString(inspiration_owner.IsFemale,'Šarlatánko','Šarlatáne')]! Už ti nezaplatím ani jedno pití!"
 fund_inspiration.6400.a.success: "Přesvědčíš dobrodruha, aby se vzpamatoval"
 fund_inspiration.6400.a.success_continue: "Dobrodružství pokračuje!"
 fund_inspiration.6400.a.failure: "Dobrodruh uteče se zlatem!"
 fund_inspiration.6500.t: "$fund_inspiration.title$ Přinášení hudby do džungle"
 fund_inspiration.6500.introduction: "Dostanu zprávu od svého dobrodruha, psanou tak barvitě, že [Select_CString(inspiration_owner.IsFemale,'ji','ho')] mám přímo před očima."
 fund_inspiration.6500.desc: "\n\n'[Select_CString(inspiration_owner.IsFemale,'Byla','Byl')] jsem v džungli na nohou. Volání ptáků mi tluče v lebce a považuji to za děsivý žalozpěv. Několik místních mi řeklo, že to považují za nejpříjemnější hudbu. Zjevně nikdy neslyšeli díla [court_musician.GetTitledFirstNameNoTooltip].\n\n'[Select_CString(inspiration_owner.IsFemale,'Zkusila','Zkusil')] jsem zahrát jednu z [Select_CString(court_musician.IsFemale,'její','jeho')] melodií na jejich rákosovou píšťalu a místní mě vyhnali z města a pořezali mě otrávenou čepelí. I když jsem [Select_CString(inspiration_owner.IsFemale,'přežila','přežil')], pomyslel jsem si: „když zemřu tím, že přinesu komorní hudbu do džungle, tak ať.“'"
 fund_inspiration.6500.action: "\n\n‚Asi si dokážete představit, co jsem [Select_CString(inspiration_owner.IsFemale,'udělala','udělal')] dál...‘"
 fund_inspiration.6500.a: "[Select_CString(inspiration_owner.IsFemale,'Začala','Začal')] jste zpívat a [Select_CString(inspiration_owner.IsFemale,'získala','získal')] si jejich přízeň!"
 fund_inspiration.6500.b: "[Select_CString(inspiration_owner.IsFemale,'Uprchla','Uprchl')] jste do civilizovanějších krajů."
 fund_inspiration.6500.c: "Velká kočkovitá šelma vyskočila mezi vás a vaše útočníky!"
 fund_inspiration.6500.a.success: "Dobrodruh okouzlí obyvatele džungle"
 fund_inspiration.6500.a.failure: "Dobrodruh obtěžuje obyvatele džungle"
 fund_inspiration.6500.b.success: "Dobrodruh uteče."
 fund_inspiration.6500.b.failure: "Dobrodruh neuteče dost rychle"
 fund_inspiration.6500.c.tt: "Dobrodruh pomůže zahnat levharta"
 fund_inspiration.6500.c.tt_failure: "Dobrodruh je při pokusu o útěk zraněn"
 fund_inspiration.6501.t: "$fund_inspiration.title$ Cesta přes pevninu"
 fund_inspiration.6501.desc: "\n\n'Pluli jsme po řekách kolem klikatých kopců. Po období sucha nám místní řekli, že řeka, po které jsme se plavili, před naším člunem vysychá.\n\n'Místo abychom to vzdali nebo se vrátili, pokusili jsme se o nemožné. [Select_CString(inspiration_owner.IsFemale,'Přikázala','Přikázal')] jsem posádce postavit kladkový systém a začali jsme člun přesouvat po souši směrem k další řece. Plul po moři trávy a sedmikrásek.'"
 fund_inspiration.6501.a: "Doufám, že jste se vrátili a omezili ztráty."
 fund_inspiration.6501.b: "Loď cestu téměř přežila."
 fund_inspiration.6501.b.success: "Dobrodruh táhne loď nahoru po útesu"
 fund_inspiration.6501.b.failure: "Dobrodruh uvízl a opravuje rozbitou loď"
 fund_inspiration.6501.c: "Místní se slitovali a dali vám novou loď se slevou."
 fund_inspiration.6502.t: "$fund_inspiration.title$ Pálčivá žízeň"
 fund_inspiration.6502.desc: "\n\n'Nejsem na poušti, jsem v kraji snů. Rozdíl mezi probuzením a spánkem zmizel. Průvodce mi říká, že vidím přeludy toho, po čem nejvíc toužím. Ráj, bazén vody třpytící se jako diamanty, posetý poklady na březích.\n\n'Místo toho, [ROOT.Char.Custom('FormOfAddressForLiege')], vše, co tu vidím, jsi ty. Navždy o jednu písečnou dunu přede mnou. Láká mě, abych [Select_CString(inspiration_owner.IsFemale,'šla','šel')] dál. A láme mě vědomí, že každý krok k tomu přeludu mě od tebe vzdaluje.'"
 fund_inspiration.6502.a: "Ach, i mě svírá žízeň, a to nejsem na poušti."
 fund_inspiration.6502.b: "Možná zvážím tvoji pozornost, pokud přineseš velkou odměnu."
 fund_inspiration.6502.c: "Svedu to na horko a tato slova spálím."
 fund_inspiration.6503.t: "$fund_inspiration.title$ Pontské šepoty"
 fund_inspiration.6503.desc: "\n\n'[Select_CString(inspiration_owner.IsFemale,'Vstoupila','Vstoupil')] jsem do kurganu, starého pohřebního mohylového hrobu z doby Skythů. Stovky dávno zemřelých koní, vypreparované, uchované a přibité ke stěnám, aby stály vzpřímeně, každý ve své komůrce. Byl to chlév pro zatracení, ztracený v čase.\n\n'Vědom si své povinnosti hledat vědomosti pro naše království, [Select_CString(inspiration_owner.IsFemale,'uvažovala','uvažoval')] jsem o ukradení relikvie z hrobu, když můj průvodce nedával pozor, abych ji [Select_CString(inspiration_owner.IsFemale,'přinesla','přinesl')] tobě.'"
 fund_inspiration.6503.a: "[Select_CString(inspiration_owner.IsFemale,'Schovala','Schoval')] jste jednu z ozdob do kapsy."
 fund_inspiration.6503.b: "[Select_CString(inspiration_owner.IsFemale,'Přinesla','Přinesl')] jste jedno z koňských sedel ke studiu."
 fund_inspiration.6503.c: "[Select_CString(inspiration_owner.IsFemale,'Neměla','Neměl')] jste odvahu rušit mrtvé."
 fund_inspiration.6504.t: "$fund_inspiration.title$ [Select_CString(adventurer_lover.IsFemale,'Milenka','Milenec')] [inspiration_owner.Custom('CZ_FirstNameNoTooltip_G')]"
 fund_inspiration.6504.desc: "\n\n‚Ehm, [ROOT.Char.Custom('FormOfAddressForLiege')], na svých cestách jsem se [Select_CString(inspiration_owner.IsFemale,'zdržela','zdržel')] na statku, o který se [Select_CString(adventurer_lover.IsFemale,'starala','staral')] [adventurer_lover.GetTitledFirstName].‘"
 fund_inspiration.6504.pregnant: "\n\n‚Na statku jsem [Select_CString(inspiration_owner.IsFemale,'vykovala','vykoval')] pěkný artefakt! Konkrétně dítě! Možná je to nepříjemnost, ale v [Select_CString(adventurer_lover.IsFemale,'jejím','jeho')] stavu nemohu vzít [adventurer_lover.Custom('CZ_TitledFirstName_A')] na cesty. Má jen málo majetku a doufám, že bychom se o [Select_CString(adventurer_lover.IsFemale,'ni','něj')] mohli postarat na dvoře.‘"
 fund_inspiration.6504.female_lover: "\n\n‚Po tolika měsících o samotě na cestách mi rozbuší srdce jako bytost z pohádky. Nemohu si pomoci, myslím, že sem mě má výprava měla dovést.‘"
 fund_inspiration.6504.male_lover_homosexual: "\n\n‚Daleko od očí dvora jsem [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] noc co noc ležet v náručí muže.‘"
 fund_inspiration.6504.male_lover: "\n\n‚Jsem [Select_CString(inspiration_owner.IsFemale,'zamilovaná','zamilovaný')] a [Select_CString(inspiration_owner.IsFemale,'dala','dal')] bych týden u [Select_CString(adventurer_lover.IsFemale,'jejího','jeho')] boku za kteroukoli hostinu na dvoře.‘"
 fund_inspiration.6504.lover_ultimatum: "Nemohu ze statku odejít s vědomím, že [Select_CString(adventurer_lover.IsFemale,'ji','ho')] možná už nikdy nepolíbím. Buď přijde k tobě a připojí se k našemu dvoru, nebo má cesta končí tady.‘"
 fund_inspiration.6504.a: "Klidně zmiz, když si tak málo vážíš mé přízně."
 fund_inspiration.6504.a.tt: "[inspiration_owner.GetTitledFirstName] zůstane na statku."
 fund_inspiration.6504.b: "Povolím to, ale neobviňuj mě ze skandálu."
 fund_inspiration.6504.c: "Dítě si nezaslouží chudobu."
 fund_inspiration.6504.d: "SEDLÁCI? Na mém dvoře? NIKDY."
 fund_inspiration.6505.t: "$fund_inspiration.title$ Plážová kapitola"
 fund_inspiration.6505.desc: "\n\n‚Lapaje po dechu v pouštním horku jsem [Select_CString(inspiration_owner.IsFemale,'objevila','objevil')] průzračné vody, které mě přiměly svléknout se do naha. Průvodce se místo pohoršení tiše zasmál a začal na papír skicovat mé obrysy. Naši spolucestující mě z věrné služby ovívali palmovými listy.\n\n‚Strávili jsme mnoho šťastných hodin čvachtáním. V další vesnici jsem [Select_CString(inspiration_owner.IsFemale,'najala','najal')] tkadlenu, aby ten rajský okamžik zachytila, a po tomto poslu ti posílám památku.‘"
 fund_inspiration.6505.a: "Mé oči! Mé oči!"
 fund_inspiration.6505.a_blind: "[Select_CString(ROOT.Char.IsFemale,'Vypíchla','Vypíchl')] bych si oči, kdybych už [Select_CString(ROOT.Char.IsFemale,'nebyla slepá','nebyl slepý')]."
 fund_inspiration.6505.a_one_eyed: "Mé oko! Mé oko!"
 fund_inspiration.6505.b: "Pověsím to v ložnici!"
 fund_inspiration.6505.c: "Celý dvůr se o tomto exotickém rozptýlení musí dozvědět!"
 fund_inspiration.6505.d: "Ach, posvátný obraz pro náš lid!"
 fund_inspiration.6506.t: "$fund_inspiration.title$ Není to přehnaná bída"
 fund_inspiration.6506.introduction: "Přichází zpráva od mého dobrodruha. Je tak zapečená v blátě, že ji musím rozříznout nožem.\n\n"
 fund_inspiration.6506.desc: "'[ROOT.Char.Custom('FormOfAddressForLiege')|U], jsem v mokřadě a všechny roky výuky mě na to nepřipravily. Brodím se mokrou bahnitou hmotou dnem i nocí. Minulou noc jsem [Select_CString(inspiration_owner.IsFemale,'snila','snil')] o objetí milence a [Select_CString(inspiration_owner.IsFemale,'probudila','probudil')] jsem se a [Select_CString(inspiration_owner.IsFemale,'našla','našel')] místo jazyka mloka u mých rtů.\n\n'Zajímalo by mě, zda je malá šance, že bych [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] jet do mírně #EMP civilizovanější#! oblasti. Jako důkaz, jak nechutné toto místo je, poslal jsem vám spawn žáby, snesený v mém promočeném botě v zavařovací sklenici spolu se svou zprávou.'"
 fund_inspiration.6506.a: "To formuje charakter!"
 fund_inspiration.6506.b: "Pokud chceš jít do mírnějších krajů, můžeš."
 fund_inspiration.6507.t: "$fund_inspiration.title$ Ne, včely!"
 fund_inspiration.6507.introduction: "Dostanu zprávu od svého dobrodruha – řádky potřísněné krví."
 fund_inspiration.6507.desc: "\n\n'Louky a pastviny, jimiž se toulám, jsou nádherně posety zvěří. Když jsem [Select_CString(inspiration_owner.IsFemale,'sesedla','sesedl')] z koně a [Select_CString(inspiration_owner.IsFemale,'skláněla','skláněl')] se ke květině, padl na mě stín [grumpy_liege.Custom('CZ_TitledFirstName_G')], [Select_CString(grumpy_liege.IsFemale,'vazalky těchto zemí, která','vazala těchto zemí, který')] o tobě nemá valné mínění.\n\n'„Žádné mládě [ROOT.Char.Custom('CZ_TitledFirstNameNoTooltip_G')] se na mých loukách pást nebude.“ [Select_CString(grumpy_liege.IsFemale,'Sesedla','Sesedl')] a [Select_CString(grumpy_liege.IsFemale,'rozkázala','rozkázal')] strážím mě zatknout. Přivedli truhlu obsahující úl, který mi přitlačili na hlavu! Jsem [Select_CString(inspiration_owner.IsFemale,'celá','celý')] #EMP [Select_CString(inspiration_owner.IsFemale,'poštípaná','poštípaný')] včelami#!! V oku mi pořád zůstává žihadlo!'"
 fund_inspiration.6507.a: "Pošlu [Select_CString(grumpy_liege.IsFemale,'jí','mu')] pár výhrůžek!"
 fund_inspiration.6507.b: "Za to si vyžádám [Select_CString(grumpy_liege.IsFemale,'její','jeho')] hlavu!"
 fund_inspiration.6507.c: "Jizvy budou vypadat docela lichotivě!"
 fund_inspiration.6508.t: "$fund_inspiration.title$ Architekti přírody"
 fund_inspiration.6508.introduction: "Dostanu zprávu od svého dobrodruha, který pobýval v chladných krajích tajgy.\n\n"
 fund_inspiration.6508.desc: "‚[Select_CString(inspiration_owner.IsFemale,'Strávila','Strávil')] jsem nějaký čas v té nejlepší společnosti, jakou si cestovatel může přát – v kolonii bobrů! Po tomto poslu posílám knihu náčrtů staveb, kterými ve vodě chytají ryby! Ó, být obojživelným hlodavcem!‘\n\n"
 fund_inspiration.6508.architect_desc: "‚Jsem si [Select_CString(inspiration_owner.IsFemale,'jistá','jistý')], že alespoň [court_architect.GetTitledFirstName] by se od zvířete chytřejšího, než je [Select_CString(court_architect.IsFemale,'ona','on')], [Select_CString(court_architect.IsFemale,'mohla','mohl')] něco naučit.‘"
 fund_inspiration.6508.a: "Pečlivě to prozkoumám."
 fund_inspiration.6508.b: "Opravdu, [court_architect.GetTitledFirstNameNoTooltip] by se [Select_CString(court_architect.IsFemale,'mohla','mohl')] něco naučit."
 fund_inspiration.6508.b.tt: "Schopnosti [court_architect.Custom('CZ_TitledFirstName_G')] coby architekta mírně rostou"
 fund_inspiration.6508.c: "Jaká #EMP roztomilá#! zvířátka! [child.GetFirstName] by [Select_CString(child.IsFemale,'měla','měl')] mít tuto knihu!"
 fund_inspiration.6508.d: "Dobrá práce, pošlu peníze na prodloužení tvých cest."
 fund_inspiration.6509.t: "$fund_inspiration.title$ Šepoty o bestii"
 fund_inspiration.6509.intro_desc: "Dostanu zprávu od svého dobrodruha, který se plaví na voru po zaplavených pláních."
 fund_inspiration.6509.desc: "\n\n'[ROOT.Char.Custom('FormOfAddressForLiege')|U], byli jsme na cestách pronásledováni tvorem tak hrozným, že se sotva odvážím o něm psát.\n\n'Krokodýl dorůstá až padesáti kroků délky a je to příšera, která spolkla jednoho z našich mul. Je to štíhlé zvíře, se tělem ve tvaru šípu, s zobákem vpředu a chrastícími ocasními částmi vzadu. Hroty a boule ho pokrývající jsou jedovaté na dotek.'"
 fund_inspiration.6509.a: "Ohromíme návštěvníky tapisérií s tímto monstrem!"
 fund_inspiration.6509.b: "Ó, to je příliš strašné, aby to byla pravda!"
 fund_inspiration.6509.c: "Vím, co je krokodýl, hlupáčku!"
 fund_inspiration.6510.t: "$fund_inspiration.title$ Muži v punčochách"
 fund_inspiration.6510.intro_desc: "Dostanu zprávu od svého dobrodruha, který se plížil lesním podrostem."
 fund_inspiration.6510.desc: "\n\n‚Omlouvám se, [ROOT.Char.Custom('FormOfAddressForLiege')], ale v lese jsem [Select_CString(inspiration_owner.IsFemale,'narazila','narazil')] na bandu lapků, kteří okrádají lidi jako vy. Jako protiváha tvrdé ruky [enemy_liege.Custom('CZ_TitledFirstName_G')], [Select_CString(enemy_liege.IsFemale,'která','který')] tu vládne, přepadají a okrádají šlechtu. Mé srdce se k té pestré skupině přiklání a myslím, že se na dvůr nevrátím.\n\n‚Jejich punčochy navíc vypadají mnohem lépe než móda na vašem dvoře a sluší mi.‘"
 fund_inspiration.6510.a: "Možná bys mi [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] pomoci udělat víc pro chudé?"
 fund_inspiration.6510.b: "Pokud se nevrátíš, pošlu na tebe vraha!"
 fund_inspiration.6510.b.toast_outcome.positive: "[inspiration_owner.GetTitledFirstNameNoTooltip] je [Select_CString(inspiration_owner.IsFemale,'zastrašena','zastrašen')]"
 fund_inspiration.6510.b.toast_outcome.positive.continue: "Dobrodružství pokračuje"
 fund_inspiration.6510.b.toast_outcome.positive.flee: "Uprchne z tvého dvora."
 fund_inspiration.6510.b.toast_outcome.refusal: "[inspiration_owner.GetTitledFirstNameNoTooltip] se nenechá zastrašit"
 fund_inspiration.6510.c: "Užívej si svůj život bídy!"
 fund_inspiration.6511.t: "$fund_inspiration.title$ Poutník v moři sněhu"
 fund_inspiration.6511.intro_desc: "Dostanu zprávu od svého dobrodruha a už po prvních řádcích vím, že bude poslední."
 fund_inspiration.6511.old_age: "\n\n'Mé stáří mi přineslo mnoho divů za můj čas. Když jsem [Select_CString(inspiration_owner.IsFemale,'vystoupala','vystoupal')] na zasněžený vrchol hory, z níž nyní tyto řádky píšu, [Select_CString(inspiration_owner.IsFemale,'byla','byl')] jsem jediným živým tvorem nad mořem mlhy, [Select_CString(inspiration_owner.IsFemale,'věděla','věděl')] jsem, že už nikdy neuvidím takovou krásu po zbytek svých dnů.\n\n'Nebylo mým přáním vrátit se z hory, a nyní můžete předpokládat, že jsem jedním s ledem. Neplač, neboť jinak jsem jednat [Select_CString(inspiration_owner.IsFemale,'nemohla','nemohl')]. Má pouť do [inspiration_owner.GetFaith.PositiveAfterLife] je jistá jako ledovec.'"
 fund_inspiration.6511.poor_health: "\n\n'Jsem nyní ničemný, trhaný tvor, nemocný a zrádný svému tělu. Přesto v tomto stavu jsem [Select_CString(inspiration_owner.IsFemale,'nemyslela','nemyslel')], že bych [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] spatřit takový výjev — zasněžené království mraků a mlhy z vrcholu hory. Taková zvadlá květina si tuto krásu nezaslouží.\n\n'S vědomím, že můj čas může být na dosah, [Select_CString(inspiration_owner.IsFemale,'rozhodla','rozhodl')] jsem se vydat napospas ledu. Možná mě chlad uchová v nějakém pozůstatku mého já.'"
 fund_inspiration.6511.winter: "\n\n'[Select_CString(inspiration_owner.IsFemale,'Byla','Byl')] jsem na vrcholku hory v kruté době. Každá sněhová vločka na mé pohryzené tváři byla smíchem zimy, ten zlosyn. [Select_CString(inspiration_owner.IsFemale,'Viděla','Viděl')] jsem bitvy, ale žádné násilí tak vznešené jako tento souboj s krví v mém vlastním těle. Má dominující ruka ještě dobře píše tato slova, ale ta druhá už ne tak.\n\n'Věz, že jsem [Select_CString(inspiration_owner.IsFemale,'byla','byl')] opravdu [Select_CString(inspiration_owner.IsFemale,'šťastná','šťastný')], že svět vidím takto, a cítím, že ti, kteří zůstanou, jsou chudší než já.'"
 fund_inspiration.6511.a: "Větší romantik nebezpečí tu nikdy nebyl!"
 fund_inspiration.6512.t: "$fund_inspiration.title$ [ROOT.Char.GetTitleAsNameNoTooltip|U] z Hory"
 fund_inspiration.6512.intro_desc: "Dostanu dopis od svého dobrodruha a je pokrytý rezavým prachem z cesty přes pouštní hory."
 fund_inspiration.6512.desc: "\n\n‚[Select_CString(inspiration_owner.IsFemale,'Vystoupala','Vystoupal')] jsem na další horu a na těch tisících plochých náhorních plošin jsem [Select_CString(inspiration_owner.IsFemale,'nenašla','nenašel')] jedinou známku, že by po tomto kameni kdy kráčel jiný člověk. Dnes jsem se [Select_CString(inspiration_owner.IsFemale,'odvážila','odvážil')] na tu nejvyšší, jakou jsem kdy [Select_CString(inspiration_owner.IsFemale,'zdolala','zdolal')].\n\n‚Myslím, že ta skála si žádá hrdé jméno, které by uctilo tento čin, vykonaný pod záštitou nejvzácnějšího [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')] ve vesmíru.‘"
 fund_inspiration.6512.a: "Jsem si [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')], že místní jí už jméno dali."
 fund_inspiration.6512.b: "'Rocky' — hloupé jméno!"
 fund_inspiration.6512.c: "‚Meč boží‘"
 fund_inspiration.6512.d: "‚Rukavice osudu‘"
 fund_inspiration.6512.e: "Pojmenujme ji po [Select_CString(lover.IsFemale,'mé drahé','mém drahém')] [lover.Custom('CZ_FirstNameNoTooltip_L')]."
 fund_inspiration.6512.f: "Zub [ROOT.Char.Custom('CZ_FirstNameNoTooltip_G')]!"
 fund_inspiration.6512.g: "Hůl [ROOT.Char.Custom('CZ_FirstNameNoTooltip_G')]!"
 fund_inspiration.6512.h: "Zkáza [rival.Custom('CZ_FirstNameNoTooltip_G')]!"
 fund_inspiration.6512.i: "Zapomeň na to — přines mi nějaké kameny!"
 fund_inspiration.7001.t: "$fund_inspiration.title$ Jméno k zapamatování"
 fund_inspiration.7001.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně přistoupí se zamyšleným výrazem. „Je pro vás někdo výjimečný, [ROOT.Char.Custom('FormOfAddressForLiege')]?“\n\nZřejmě mi z tváře vyčte podrážděnost, protože pokračuje: „Myslím, je někdo, komu byste [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')] objednaný artefakt věnovat? Dílo se daří, ale smysluplný nápis by mu dodal osobnější ráz!“"
 fund_inspiration.7001.a: "[Select_CString(dedication_a.IsFemale,'Mé milované','Mému milovanému')] [dedication_a.Custom('CZ_FirstNameNoTooltip_D')]!"
 fund_inspiration.7001.a.same: "Tobě, má lásko!"
 fund_inspiration.7001.b: "Na památku [dedication_b.Custom('CZ_FirstName_G')]..."
 fund_inspiration.7001.c: "Pouze [ROOT.Char.GetFaith.HighGodNameAlternate] mě vede!"
 fund_inspiration.7001.d: "Není potřeba věnování."
 artifact_dedication_inscribed_a: "[newly_created_artifact.GetDesc]\n\nNa jeho boku je drobný, avšak elegantní nápis: „[Select_CString(dedication_a.IsFemale,'Mé milované','Mému milovanému')] [dedication_a.Custom('CZ_FirstName_D')]“."
 artifact_dedication_written_a: "[newly_created_artifact.GetDesc]\n\nNa první straně je drobný, ale elegantní nápis věnující dílo: „[Select_CString(dedication_a.IsFemale,'Mé milované','Mému milovanému')] [dedication_a.Custom('CZ_FirstName_D')]“."
 artifact_dedication_woven_a: "[newly_created_artifact.GetDesc]\n\nPod hlavním motivem je vpletený drobný, ale elegantní nápis věnující dílo: „[Select_CString(dedication_a.IsFemale,'Mé milované','Mému milovanému')] [dedication_a.Custom('CZ_FirstName_D')]“."
 artifact_dedication_inscribed_b: "[newly_created_artifact.GetDesc]\n\nNa jeho boku je drobný, avšak elegantní nápis: „Na věčnou památku [dedication_b.Custom('CZ_FirstName_G')]“."
 artifact_dedication_written_b: "[newly_created_artifact.GetDesc]\n\nNa první straně je drobný, ale elegantní nápis: „Na věčnou památku [dedication_b.Custom('CZ_FirstName_G')]“."
 artifact_dedication_woven_b: "[newly_created_artifact.GetDesc]\n\nPod hlavním motivem je vpletený drobný, ale elegantní nápis: „Na věčnou památku [dedication_b.Custom('CZ_FirstName_G')]“."
 artifact_dedication_inscribed_c: "[newly_created_artifact.GetDesc]\n\nNa jeho boku je drobný, ale elegantní nápis hrdě hlásající: „[owner.GetFaith.HighGodName] je mou silou“."
 artifact_dedication_written_c: "[newly_created_artifact.GetDesc]\n\nNa první straně je drobný, ale elegantní nápis hrdě hlásající: „[owner.GetFaith.HighGodName] je mou silou“."
 artifact_dedication_woven_c: "[newly_created_artifact.GetDesc]\n\nPod hlavním motivem je vpletený drobný, ale elegantní nápis hrdě hlásající: „[owner.GetFaith.HighGodName] je mou silou“."
 fund_inspiration.7002.c: "[Select_CString(dedication_d.IsFemale,'Mé milované','Mému milovanému')] [dedication_d.Custom('CZ_FirstName_D')]!"
 artifact_dedication_inscribed_d: "[newly_created_artifact.GetDesc]\n\nNa jeho boku je drobný, avšak elegantní nápis: „[Select_CString(dedication_d.IsFemale,'Mé milované','Mému milovanému')] [dedication_d.Custom('CZ_FirstName_D')]“"
 artifact_dedication_written_d: "[newly_created_artifact.GetDesc]\n\nNa první straně je drobný, ale elegantní nápis věnující dílo: „[Select_CString(dedication_d.IsFemale,'Mé milované','Mému milovanému')] [dedication_d.Custom('CZ_FirstName_D')]“."
 artifact_dedication_woven_d: "[newly_created_artifact.GetDesc]\n\nPod hlavním motivem je vpletený drobný, ale elegantní nápis věnující dílo: „[Select_CString(dedication_d.IsFemale,'Mé milované','Mému milovanému')] [dedication_d.Custom('CZ_FirstName_D')]“."
 fund_inspiration.7003.t: "$fund_inspiration.title$ Někdo, koho ohromit"
 fund_inspiration.7003.desc: "Poslední dobou mé pokusy někoho ohromit vycházejí naprázdno..."
 fund_inspiration.7003.desc_e: "Mé přátelství s [dedication_e.Custom('CZ_TitledFirstName_I')] je stále vratké."
 fund_inspiration.7003.desc_f: "[dedication_f.GetTitledFirstName|U] mě stále odmítá."
 fund_inspiration.7003.desc_end: "Je to zmatek.\n\nMám ale skvělý nápad. Požádám [inspiration_owner.Custom('CZ_TitledFirstName_A')], aby k mistrovskému dílu, které vytváří, [Select_CString(inspiration_owner.IsFemale,'přidala','přidal')] věnování! Obdarovaný bude mou štědrostí hluboce dojat a nezbude mu než mě mít raději!"
 fund_inspiration.7003.a: "Pro [dedication_e.Custom('CZ_FirstNameNoTooltip_A')]!"
 fund_inspiration.7003.b: "Pro [dedication_f.Custom('CZ_FirstNameNoTooltip_A')]!"
 fund_inspiration.7003.c: "Najdu jiné způsoby, jak imponovat tomu, koho chci."
 artifact_dedication_inscribed_e: "[newly_created_artifact.GetDesc]\n\nNa jeho boku je drobný, ale elegantní nápis věnující dílo: „[Select_CString(dedication_e.IsFemale,'Věrné přítelkyni','Věrnému příteli')] [dedication_e.Custom('CZ_FirstName_D')]“."
 artifact_dedication_written_e: "[newly_created_artifact.GetDesc]\n\nNa první straně je drobný, ale elegantní nápis věnující dílo: „[Select_CString(dedication_e.IsFemale,'Věrné přítelkyni','Věrnému příteli')] [dedication_e.Custom('CZ_FirstName_D')]“."
 artifact_dedication_woven_e: "[newly_created_artifact.GetDesc]\n\nPod hlavním motivem je vpletený drobný, ale elegantní nápis věnující dílo: „[Select_CString(dedication_e.IsFemale,'Věrné přítelkyni','Věrnému příteli')] [dedication_e.Custom('CZ_FirstName_D')]“."
 artifact_dedication_inscribed_f: "[newly_created_artifact.GetDesc]\n\nNa jeho boku je drobný, ale elegantní nápis věnující dílo: „[Select_CString(dedication_f.IsFemale,'Mé milované','Mému milovanému')] [dedication_f.Custom('CZ_FirstName_D')]“."
 artifact_dedication_written_f: "[newly_created_artifact.GetDesc]\n\nNa první straně je drobný, ale elegantní nápis věnující dílo: „[Select_CString(dedication_f.IsFemale,'Mé milované','Mému milovanému')] [dedication_f.Custom('CZ_FirstName_D')]“."
 artifact_dedication_woven_f: "[newly_created_artifact.GetDesc]\n\nPod hlavním motivem je vpletený drobný, ale elegantní nápis věnující dílo: „[Select_CString(dedication_f.IsFemale,'Mé milované','Mému milovanému')] [dedication_f.Custom('CZ_FirstName_D')]“."
 fund_inspiration.7004.t: "$fund_inspiration.title$ Vazal k zapamatování?"
 fund_inspiration.7004.desc: "[dedication_g1.GetTitledFirstName|U] a [dedication_g2.GetTitledFirstName] patří mezi nejsilnější vazaly mé říše. Nikdy nevím, jak je udržet spokojené, aby nezačali vyvolávat nepokoje. Možná lichocení je ta cesta?\n\nKaždý by byl potěšen, kdyby mu něco bylo vyrobeno na míru, že? A přesně mám to pravé před dokončením! [Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych dát vědět [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)], že věnuji [Select_CString(inspiration_owner.IsFemale,'její','jeho')] mistrovské dílo mým #EMP důvěryhodným#! vazalům a poradcům.\n\nNa druhou stranu, je to #EMP můj#! artefakt, tak možná bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] prostě...?"
 fund_inspiration.7004.a: "Ne! Pro [dedication_g1.Custom('CZ_FirstNameNoTooltip_A')] a [dedication_g2.Custom('CZ_FirstNameNoTooltip_A')]!"
 fund_inspiration.7004.b: "Koneckonců, proč ne? MNĚ!"
 fund_inspiration.7004.c: "Věnování je přece nadhodnocené."
 artifact_dedication_inscribed_g: "[newly_created_artifact.GetDesc]\n\nNa jeho boku je drobný, avšak elegantní nápis: „[owner.GetTitledFirstNameNoTooltip|U] [Select_CString(owner.IsFemale,'věnovala','věnoval')] toto svým důvěryhodným poradcům, [dedication_g1.GetTitledFirstName] a [dedication_g2.GetTitledFirstName]“."
 artifact_dedication_written_g: "[newly_created_artifact.GetDesc]\n\nNa první straně je drobný, ale elegantní text: „[owner.GetTitledFirstName|U] [Select_CString(owner.IsFemale,'věnovala','věnoval')] toto svým důvěryhodným poradcům, [dedication_g1.GetTitledFirstName] a [dedication_g2.GetTitledFirstName]“."
 artifact_dedication_woven_g: "[newly_created_artifact.GetDesc]\n\nPod hlavním motivem je vpletený drobný, ale elegantní nápis: „[owner.GetTitledFirstNameNoTooltip|U] [Select_CString(owner.IsFemale,'věnovala','věnoval')] toto svým důvěryhodným poradcům, [dedication_g1.GetTitledFirstName] a [dedication_g2.GetTitledFirstName]“."
 artifact_dedication_inscribed_h: "[newly_created_artifact.GetDesc]\n\nNa jeho boku je drobný, avšak elegantní nápis věnující předmět: „Věčná sláva [owner.Custom('CZ_TitledFirstNameNoTooltip_G')]“."
 artifact_dedication_written_h: "[newly_created_artifact.GetDesc]\n\nNa první straně je drobný, ale elegantní nápis věnující předmět: „Věčná sláva [owner.Custom('CZ_TitledFirstNameNoTooltip_G')]“."
 artifact_dedication_woven_h: "[newly_created_artifact.GetDesc]\n\nPod hlavním motivem je vpletený drobný, ale elegantní nápis věnující předmět: „Věčná sláva [owner.Custom('CZ_TitledFirstNameNoTooltip_G')]“."
 fund_inspiration.7010.t: "$fund_inspiration.title$ Motto pro věky"
 fund_inspiration.7010.desc: "Slyším, jak si [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] na druhém konci síně mumlá: „Potřebuji něco velkého, něco #EMP epického#!, aby mé dílo vyčnívalo nad netvůrčí masu, ale co, prostě CO?“\n\nKdyž se naše pohledy střetnou, rozzáří se [Select_CString(inspiration_owner.IsFemale,'jí','mu')] tvář širokým úsměvem a mává na mě. „[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Mám skvělý nápad! Co takhle přidat k vaší zakázce rodové heslo?“"
 fund_inspiration.7010.a: "Jistě, to zní skvěle!"
 fund_inspiration.7010.b: "To je pošetilé a zbytečné."
 artifact_motto_inscribed: "[newly_created_artifact.GetDesc]\n\nMotto rodu [owner.GetHouse.GetName], #EMP '[owner.GetHouse.GetMotto]'#!, je elegantně vyryto na jedné straně."
 artifact_motto_written: "[newly_created_artifact.GetDesc]\n\nMotto rodu [owner.GetHouse.GetName], #EMP '[owner.GetHouse.GetMotto]'#!, je napsáno vysoce dekorativním písmem na první straně."
 artifact_motto_woven: "[newly_created_artifact.GetDesc]\n\nMotto rodu [owner.GetHouse.GetName], #EMP '[owner.GetHouse.GetMotto]'#!, je elegantně vpleteno nad hlavním motivem."
 fund_inspiration.7100.t: "$fund_inspiration.title$ Tvůrčí směr"
 fund_inspiration.7100.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Práce na vašem vzácném artefaktu postupuje dobře!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] je dnes zjevně ve velmi dobré náladě.\n\n„Nic neslibuji, ale... kdybych [Select_CString(inspiration_owner.IsFemale,'dokázala','dokázal')] vytvořit opravdové mistrovské dílo, jakou myšlenkou byste [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')], abych se [Select_CString(inspiration_owner.IsFemale,'řídila','řídil')]?“"
 fund_inspiration.7100.a: "Aby způsoboval větší ztráty #EMP jim#!, méně #EMP nám#!."
 fund_inspiration.7100.a.tt: "Tvůj [Concept('artifact','artefakt')|E] může získat [Concept('modifier','modifikátor')|E] týkající se [Concept('casualties','ztrát')|E]"
 fund_inspiration.7100.b: "Aby vzbuzoval strach v lidech, které plením."
 fund_inspiration.7100.b.tt: "Tvůj [Concept('artifact','artefakt')|E] může získat [Concept('modifier','modifikátor')|E] týkající se [Concept('raiding','plenění')|E]"
 fund_inspiration.7100.c: "Aby povzbudil mé $knight_culture_player_plural_no_tooltip_lowercase$ k velikosti."
 fund_inspiration.7100.c.tt: "Tvůj [Concept('artifact','artefakt')|E] může získat [Concept('modifier','modifikátor')|E] týkající se [Concept('knight','rytířů')|E]"
 fund_inspiration.7100.d: "Aby lépe využíval výhody terénu."
 fund_inspiration.7100.d.tt: "Tvůj [Concept('artifact','artefakt')|E] může získat [Concept('modifier','modifikátor')|E] týkající se [Concept('terrain','terénu')|E]"
 fund_inspiration.7100.e: "Cokoliv."
 fund_inspiration.7100.e.tt: "[Concept('modifiers','Modifikátory')|E] výsledného [Concept('artifact','artefaktu')|E] budou náhodné"
 fund_inspiration.7110.a: "Aby každý vládce žárlil na mě!"
 fund_inspiration.7110.a.tt: "Tvůj [Concept('artifact','artefakt')|E] může získat [Concept('modifier','modifikátor')|E] [opinion_i][Concept('opinion','mínění')|E] [Concept('rulers','vládců')|E]"
 fund_inspiration.7110.b: "Aby přinesl slávu mé dynastii."
 fund_inspiration.7110.b.tt: "Tvůj [Concept('artifact','artefakt')|E] může získat [Concept('modifier','modifikátor')|E] [Concept('dynasty','dynastie')|E]"
 fund_inspiration.7110.c: "Aby budil respekt u mých podřízených."
 fund_inspiration.7110.c.tt: "Tvůj [Concept('artifact','artefakt')|E] může získat [Concept('modifier','modifikátor')|E] [dread_i][Concept('dread','hrůzy')|E] nebo [Concept('tyranny','tyranie')|E]"
 fund_inspiration.7110.d: "Aby ohromoval mé milence!"
 fund_inspiration.7110.d.tt: "Tvůj [Concept('artifact','artefakt')|E] může získat [Concept('modifier','modifikátor')|E] [Concept('attraction','přitažlivosti')|E]"
 fund_inspiration.7110.e: "Aby ohromoval mé vazaly!"
 fund_inspiration.7110.e.tt: "Tvůj [Concept('artifact','artefakt')|E] může získat [Concept('modifier','modifikátor')|E] [opinion_i][Concept('opinion','mínění')|E] [Concept('vassal','vazalů')|E]"
 fund_inspiration.7110.g: "Aby ohromoval celý můj dvůr."
 fund_inspiration.7110.g.tt: "Tvůj [Concept('artifact','artefakt')|E] může získat [Concept('modifier','modifikátor')|E] [opinion_i][Concept('opinion','mínění')|E] [Concept('courtiers','dvořanů')|E]"
 fund_inspiration.7120.a: "Aby legitimizoval mé panování."
 fund_inspiration.7120.a.tt: "Tvůj artefakt může získat modifikátor krátkého panování"
 fund_inspiration.8001.t: "$fund_inspiration.title$ Fascinace kovem"
 fund_inspiration.8001.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se sklání nad kádinkou s podivným žlutým práškem, [Select_CString(inspiration_owner.IsFemale,'obklopená','obklopený')] pergameny a vzorky jakési rudy.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Podívejte se, vidíte, jak tato síra mění barvu? To je známka transmutace. Může to vytvořit stříbro, nebo dokonce zlato! Nebo tady, podívejte, jak reaguje s rtutí? Nádhera... A tato ruda, je arzenového původu, což– ehum, omlouvám se, [ROOT.Char.Custom('FormOfAddressForLiege')]. Je toho prostě tolik k prozkoumání! Možná až příliš.“"
 fund_inspiration.8001.a: "Co to bylo s tím zlatem?"
 fund_inspiration.8001.a.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] zaměří svá studia na vytvoření zlata"
 fund_inspiration.8001.b: "Stříbro, říkáte?"
 fund_inspiration.8001.b.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] zaměří svá studia na vytvoření stříbra"
 fund_inspiration.8001.c: "Rtuť je skutečně fascinující."
 fund_inspiration.8001.c.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] zaměří svá studia na rtuť"
 fund_inspiration.8001.d: "[Select_CString(inspiration_owner.IsFemale,'Řekla','Řekl')] jste arzen?"
 fund_inspiration.8001.d.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] zaměří svá studia na arsen"
 fund_inspiration.8011.t: "$fund_inspiration.title$ Zlaté sny"
 fund_inspiration.8011.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě [Select_CString(inspiration_owner.IsFemale,'zavolala','zavolal')] do své laboratoře a nadšeně vypráví o průlomu ve svém výzkumu.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], jste tu! Výborně. Prosím, vypijte toto.“ [inspiration_owner.GetFirstNameNoTooltip] mě navede do místnosti k stolu zaplněnému pergameny a kádinkami. Je to jedna z těchto kádinek, obsahující zlatavou směs, kterou mě nutí vypít. „Teď, tohle je samozřejmě stále rozpracované, ale #EMP mělo by#! to mít opravdu pozoruhodný účinek!“\n\nPo hodinách čekání cítím jen pulzující bolest hlavy, nevolnost a závratě."
 fund_inspiration.8011.a: "Tato fraška tě aspoň naučila něčemu užitečnému."
 fund_inspiration.8011.b: "Hoďte toho šarlatána do žaláře!"
 fund_inspiration.8011.c: "Opovažuješ se mě otrávit?! Za to budeš [Select_CString(inspiration_owner.IsFemale,'oběšena','oběšen')]!"
 fund_inspiration.8012.t: "$fund_inspiration.title$ Církev a šarlatáni"
 fund_inspiration.8012.desc: "Nakláním se nad stolem, naslouchám svému alchymistovi [inspiration_owner.GetTitledFirstName], jak vysvětluje svůj poslední experiment, když [court_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)] vtrhne do místnosti.\n\n„Takže je to pravda, vy #EMP skutečně#! trávíte čas s tímto... tím #EMP pohanem#!!“ [court_chaplain.GetFirstNameNoTooltip] pohlédne na mísy a ilustrace rozložené před námi a [Select_CString(court_chaplain.IsFemale,'její','jeho')] pohled ještě víc ztvrdne.\n\n„Tohle musí přestat, [ROOT.Char.Custom('FormOfAddressForLiege')]. Tento šarlatán vás svádí z cesty!“"
 fund_inspiration.8012.a: "Cože? Jak jste [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')]?! Pryč z mého panství."
 fund_inspiration.8012.b: "Vede mě k osvícení!"
 fund_inspiration.8012.b.success: "Podaří se ti přesvědčit [court_chaplain.Custom('CZ_FirstNameNoTooltip_A')]"
 fund_inspiration.8012.b.failure: "[court_chaplain.GetFirstNameNoTooltip] není [Select_CString(court_chaplain.IsFemale,'přesvědčena','přesvědčen')]"
 fund_inspiration.8012.c: "To rozhodně ne."
 fund_inspiration.8013.t: "$fund_inspiration.title$ Alchymistický poklad"
 fund_inspiration.8013.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ můj alchymista [inspiration_owner.GetTitledFirstName] ke mně prakticky běží, [Select_CString(inspiration_owner.IsFemale,'nadšená','nadšený')] jako dítě.\n\n„Na trhu [CZPrepV(barony_market.GetNameNoTooltip)] [barony_market.Custom('CZ_LandedName_L')] jsem [Select_CString(inspiration_owner.IsFemale,'našla','našel')] tuto knihu. Je to kniha připisovaná bájnému alchymistovi Jabirovi ibn Hayyanovi – mistru samotnému! Aspoň podle obchodníka... Přesto si jen představte bohatství poznání, které v ní je!“"
 fund_inspiration.8013.a: "Děkuji, budu to studovat."
 fund_inspiration.8013.a_tt: "Knihu si ponecháš"
 fund_inspiration.8013.b: "Věřím, že s knihou dobře naložíte."
 fund_inspiration.8013.b_tt: "Knihu dáš [inspiration_owner.Custom('CZ_ShortUINameNoTooltip_D')]"
 fund_inspiration.8013.c: "To je úlovek! Určitě to přinese pěkný výdělek."
 fund_inspiration.8014.t: "$fund_inspiration.title$ [Select_CString(inspiration_owner.IsFemale,'Myslitelka','Myslitel')]"
 fund_inspiration.8014.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] zřejmě nikdy neprovádí žádné pokusy ani nevytváří nic pozoruhodného. Jen den co den sedí u okna a dívá se ven.\n\nKdyž chci vědět, co vlastně financuji, jen pokrčí rameny a ukáže z okna. „Rozjímám o povaze světa, [ROOT.Char.Custom('FormOfAddressForLiege')]. Je to velký svět, takže je toho hodně k uvažování!“"
 fund_inspiration.8014.a: "Neplatím tě, abys jen [Select_CString(inspiration_owner.IsFemale,'seděla','seděl')]!"
 fund_inspiration.8014.b: "Vezmi si čas."
 fund_inspiration.8014.c: "Nezahodím své zlato za tyto nesmysly!"
 fund_inspiration.8014.c.tt: "Prodáš veškeré zakoupené alchymistické vybavení"
 fund_inspiration.8015.t: "$fund_inspiration.title$ Ve smutku"
 fund_inspiration.8015.desc: "„Alchymisté mají moc nad veškerou hmotou, mohou tvořit zázraky, tak čím se život liší? Čím se liší [loved_one.GetFirstName]?!“\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] jen zavrtí hlavou, [Select_CString(inspiration_owner.IsFemale,'lhostejná','lhostejný')] k mému zármutku. Co je věda platná, když mi nemůže splnit toto jediné přání?\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], takový zázrak vykonat neumím. [Select_CString(inspiration_owner.IsFemale,'Zjistila','Zjistil')] jsem však, že otevřené ucho může být samo o sobě jistou formou kouzla, když smutek přichází. Prosím, posaďte se.“"
 fund_inspiration.8015.a: "Ale– já... máte pravdu... Děkuji."
 fund_inspiration.8015.b: "Ne. Přivedete [Select_CString(loved_one.IsFemale,'ji','ho')] ke mně zpátky!"
 fund_inspiration.8015.b.tt: "[inspiration_owner.GetShortUINameNoTooltip] se pokusí o nemožné"
 fund_inspiration.8016.desc: "Kroky mám lehké, když mířím do laboratoře [inspiration_owner.Custom('CZ_TitledFirstName_G')]. Ó [loved_one.GetFirstName], konečně tě zase uvidím! Nicméně když [inspiration_owner.GetTitledFirstNameNoTooltip] otevírá dveře, mé srdce klesá při pohledu na výraz [Select_CString(inspiration_owner.IsFemale,'její','jeho')] tváře. A proč mi nedovolí nahlédnout do místnosti?\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], [Select_CString(inspiration_owner.IsFemale,'zklamala','zklamal')] jsem vás. Prosím, ne–“\n\nProtáhnu se kolem [Select_CString(inspiration_owner.IsFemale,'ní','něj')] do laboratoře a to, co vidím... nemohu tomu porozumět. Šlachy, hromady masa, prášky a byliny, vše prosáklé krví a rozházené do kruhu na podlaze. A nahoře jediný pramen vlasů přesně té barvy, jakou [Select_CString(loved_one.IsFemale,'měla','měl')] na hlavě [loved_one.GetFirstNameNoTooltip]."
 fund_inspiration.8016.a: "Já... myslím, že mi bude špatně."
 fund_inspiration.8016.b: "Opovažujete se dělat si legraci z mého žalu? Stráže! Zatkněte [Select_CString(inspiration_owner.IsFemale,'ji','ho')]!"
 fund_inspiration.8017.t: "$fund_inspiration.title$ Studijní skupina"
 fund_inspiration.8017.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] a [court_tutor.Custom2('MyCharacterIntroduction', ROOT.Char)] se sklánějí nad stolem a porovnávají cosi, co vypadá jako rozdrcené kameny.\n\n„Vidíte,“ říká [inspiration_owner.GetFirstNameNoTooltip]. „Když ten prášek zahřejete, nejprve zčerná, ale #EMP pak#!– Ó dobrý den, [ROOT.Char.Custom('FormOfAddressForLiege')].“\n\n[court_tutor.GetFirstNameNoTooltip] vzhlédne k pozdravu a má tu slušnost vypadat trochu zahanbeně; [Select_CString(court_tutor.IsFemale,'měla','měl')] by přece připravovat zítřejší přednášky."
 fund_inspiration.8017.a: "Je dobře, že sdílíte znalosti."
 fund_inspiration.8017.b: "Hanba vám oběma, zpátky do práce!"
 fund_inspiration.9000.t: "$fund_inspiration.title$ Lupiči na cestě"
 fund_inspiration.9000.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], dobrodruh [adventurer.GetFirstName] posílá zprávu!“ vykřikne sluha a podává dopis.\n\n„Deset dní a deset nocí jsme se s mou družinou skrývali. [Select_CString(bandit.IsFemale,'Lupička','Lupič')] [bandit.GetFirstName] [Select_CString(bandit.IsFemale,'zablokovala','zablokoval')] cestu, kterou musíme projít – co radíte? Opatrnost? Nebo bychom je měli napadnout a spoléhat na [adventurer.GetFaith.HighGodName], že nás ochrání? Podepsáno, [adventurer.GetFirstName].“ čte pergamen.\n\nZdá se, že je dobrodruh v pěkné šlamastyce."
 fund_inspiration.9000.a: "Zůstaňte v úkrytu, nakonec odejdou."
 fund_inspiration.9000.b: "Bez odvahy není slávy! Nechte je zaplatit za to, že plýtvají mým časem."
 fund_inspiration.9000.c: "Toto zlato by mělo stačit jako úplatek, aby vám byl povolen průchod."
 artifact_bandit_skull: "Lebka [Select_CString(killed.IsFemale,'lupičky','lupiče')] [killed.GetTitledFirstName], [Select_CString(killed.IsFemale,'kterou','kterého')] zabil dobrodruh [creator.GetTitledFirstName] v divočině zvané [background_wilderness_scope.GetName]. Později připadla [owner.Custom('CZ_TitledFirstName_D')]. Má děsivý úsměv a prázdné, bezduché oční důlky."
 fund_inspiration.9000.b.critical_success: "[adventurer.GetFirstNameNoTooltip] statečně zabije [bandit.Custom('CZ_FirstNameNoTooltip_A')]"
 fund_inspiration.9000.b.boil_skull: "[adventurer.GetFirstNameNoTooltip] vyvaří a očistí lebku [bandit.Custom('CZ_FirstNameNoTooltip_G')] a pošle ti ji jako [Concept('court_artifact','dvorský artefakt')|E]"
 fund_inspiration.9000.b.success: "[adventurer.GetFirstNameNoTooltip] úspěšně zahání lupiče"
 fund_inspiration.9000.b.failure: "[adventurer.GetFirstNameNoTooltip] utrpí zranění od [bandit.Custom('CZ_FirstNameNoTooltip_G')]"
 fund_inspiration.9000.b.critical_failure: "[adventurer.GetFirstNameNoTooltip] padne rukou [bandit.Custom('CZ_FirstNameNoTooltip_G')]"
 fund_inspiration.9000.a.critical_success: "[adventurer.GetFirstNameNoTooltip] se v noci odplíží... a ukradne zlato [bandit.Custom('CZ_FirstNameNoTooltip_G')]"
 fund_inspiration.9000.a.success: "[adventurer.GetFirstNameNoTooltip] se v noci odplíží"
 fund_inspiration.9000.a.failure: "[adventurer.GetFirstNameNoTooltip] je [Select_CString(adventurer.IsFemale,'chycena','chycen')] při pokusu proplížit se kolem tábora"
 fund_inspiration.9100.t: "$fund_inspiration.title$ [adventurer.Custom('GetAnimalAdjective')|U] [adventurer.Custom('GetAnimalPlural')|U] [background_wilderness_scope.Custom('CZ_TerrainTypeProvince_In')]"
 fund_inspiration.9100.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], zpráva od vašeho dobrodruha, [adventurer.GetFirstName].“ říká sluha a podává mi svitek.\n\n„Mé pátrání mě zavedlo do [background_wilderness_scope.Custom('CZ_TerrainTypeProvince_G')] [background_wilderness_scope.GetName]. Je to kraj nechvalně proslulý tím, že se tu vyskytuje [adventurer.Custom('GetAnimalType')|l], ale mám dobrý důvod si myslet, že můj cíl je blízko! Očekávejte můj brzký návrat. Podepsáno, [adventurer.GetFirstNameNoTooltip]“ čte svitek.\n\n[Select_CString(adventurer.IsFemale,'Vybrala','Vybral')] si opravdu riskantní cestu..."
 fund_inspiration.9100.a: "Znalosti [adventurer.Custom('CZ_FirstNameNoTooltip_G')] by [Select_CString(adventurer.IsFemale,'ji','ho')] měly udržet v bezpečí..."
 fund_inspiration.9100.b: "Při [ROOT.Char.GetFaith.HighGodName], doufám, že s žádnou nebude muset bojovat!"
 fund_inspiration.9100.c: "[adventurer.GetFirstNameNoTooltip] je [Select_CString(adventurer.IsFemale,'opatrná','opatrný')], obejde to delší cestou."
 fund_inspiration.9100.a.success: "[adventurer.GetFirstNameNoTooltip] se úspěšně vyhne všem šelmám"
 fund_inspiration.9100.a.failure: "Na [adventurer.Custom('CZ_FirstNameNoTooltip_A')] zaútočí [adventurer.Custom('GetAnimalType')|l]!"
 fund_inspiration.9100.b.success: "[adventurer.GetFirstNameNoTooltip] zabije útočící šelmu ([adventurer.Custom('GetAnimalType')|l])"
 fund_inspiration.9100.b.failure: "Útočící šelma ([adventurer.Custom('GetAnimalType')|l]) [adventurer.Custom('CZ_FirstNameNoTooltip_A')] přemůže"
 fund_inspiration.9100.b.maimed: "Šelma ([adventurer.Custom('GetAnimalType')|l]) zmrzačí [adventurer.Custom('CZ_FirstName_A')]"
