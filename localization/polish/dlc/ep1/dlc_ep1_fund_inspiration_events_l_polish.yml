 fund_inspiration.1042.desc: "„Tady právě, můj [ROOT.Char.GetLadyLord]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ukáže na dva služebníky, kteří vyšli z [Select_CString(inspiration_owner.IsFemale,'její','jeho')] tkalcovny a nesou rolku látky. \n\n[inspiration_owner.GetSheHe|U] přikývne. Prapor se rozvine, zavěšený na dřevěném věšáku. Nemohu si pomoct a obdivuji jemné detaily a bezchybné linie.\n\n"
 fund_inspiration.0043.desc: "„Ano, můj [ROOT.Char.GetLadyLord], vytvořím pro vás mohutný prapor!“ [inspiration_owner.GetTitledFirstName] je skutečně nadšený, že pro mě pracuje. „Šlechtici [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] znají mou práci dobře, ale tohle je nová pocta!“\n\n„Věřte mi, nebude to pouhá kus látky, to bude nejkrálovštější závěs! Jen potřebuji vědět, jaký erb mi přikážete vyšít?“"
 fund_inspiration.0043.option_title: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip|U] erb."
 fund_inspiration.0043.option_house: "Znak rodu [ROOT.Char.GetHouse.GetNameNoTooltip]."
 fund_inspiration.0043.option_dynasty: "Emblém dynastie [ROOT.Char.GetDynasty.GetNameNoTooltip]."
 fund_inspiration.0043.option_dynasty_tt: "Kvalita dynastie praporu je vázána na [Concept('dynasty_prestige_level','úroveň věhlasu')|E]" # todo: CONCEPT CASE
 fund_inspiration.0044.t: "$commission_artifact_decision$: Nástěnný závěs"
 fund_inspiration.0044.desc: "Můj antikvárián, [antiquarian.GetTitledFirstName], přichází vyzvednout prostředky na mou zakázku. „Je na čase, abyste [Select_CString(ROOT.Char.IsFemale,'měla','měl')] nové pokrytí zdí!“ [antiquarian.GetSheHe|U] se na mě nesměle podívá. \n\n„Ahem, najdu zručného tkalce, můj [ROOT.Char.GetLadyLord]... co jste si přáli vyrobit?“ [antiquarian.GetSheHe|U] přetáčí měšec v [Select_CString(antiquarian.IsFemale,'její','jeho')] rukou bezmyšlenkovitě a čeká na mé rozhodnutí."
 fund_inspiration.0044.option_tapestry: "Kvalitní tapiserii do mé síně."
 fund_inspiration.0044.option_banner: "Potřebuji nový prapor."
 fund_inspiration.you_decide_tapestry_option_tt: "[antiquarian.GetTitledFirstName] najde tkalce, který vyrobí váš artefakt"
 fashion_industry_county_modifier: "Rozvíjející se módní průmysl"
 fashion_industry_county_modifier_desc: "Vladař tohoto území investoval do výroby a obchodu s módním oblečením."
