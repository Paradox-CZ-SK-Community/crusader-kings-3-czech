 fund_inspiration.0061.desc: "„Děkuji za financování tohoto mého projektu, můj [ROOT.Char.GetLadyLord].“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se snaží zachovat klid, ale vidím v [Select_CString(inspiration_owner.IsFemale,'jejích','jeho')] očích vzrušení.\n\n„Krabice, sochy, #EMP trůny#!... Je toho tolik, co mohu vyrobit! Možná máte nějaká přání?\" # todo: RETRANSLATED ENGLISH
 fund_inspiration.0061.chest: "Nádherná truhla na věci."
