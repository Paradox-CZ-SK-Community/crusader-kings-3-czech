 fund_inspiration.0071.desc: "„Děkuji za financování tohoto mého projektu, můj [ROOT.Char.GetLadyLord]!“\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se snaží zachovat klid, ale vidím v [Select_CString(inspiration_owner.IsFemale,'jejích','jeho')] očích nadšení, když [inspiration_owner.GetSheHe] pokračuje. „Mohu zpracovat kov do #EMP zázraků#!. Máte nějaká přání?\" # todo: RETRANSLATED ENGLISH
 fund_inspiration.0071.brooch: "Chci krásnou sponu!"
 fund_inspiration.0071.regalia: "Vyrobte regálie odpovídající mé pozici."
