 fund_inspiration.7004.t: "$fund_inspiration.title$ Vazal k zapamatování?"
 fund_inspiration.7004.desc: "[dedication_g1.GetTitledFirstName|U] a [dedication_g2.GetTitledFirstName] patří mezi nejsilnější vazaly mé říše. Nikdy nevím, jak je udržet spokojené, aby nezačali vyvolávat nepokoje. Možná lichocení je ta cesta?\n\nKdokoli by [Select_CString(ROOT.Char.IsFemale,'byla','byl')] potěšen, kdyby mu něco bylo vyrobeno na míru, že? A přesně mám to pravé před dokončením! [Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych dát vědět [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)], že věnuji [Select_CString(inspiration_owner.IsFemale,'její','jeho')] mistrovské dílo mým #EMP důvěryhodným#! vazalům a poradcům.\n\nNa druhou stranu, je to #EMP můj#! artefakt, tak možná bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] prostě...?"
 fund_inspiration.7004.a: "Ne! Pro [dedication_g1.GetFirstNameNoTooltip] a [dedication_g2.GetFirstNameNoTooltip]!"
 fund_inspiration.7004.b: "Koneckonců, proč ne? MNĚ!"
 fund_inspiration.7004.c: "Věnování je přece nadhodnocené."
 artifact_dedication_inscribed_g: "[newly_created_artifact.GetDesc]\n\nNa jeho boku je drobný, avšak elegantní nápis: „[owner.GetTitledFirstNameNoTooltip|U] věnoval toto svým důvěryhodným poradcům, [dedication_g1.GetTitledFirstName] a [dedication_g2.GetTitledFirstName]“."
 artifact_dedication_written_g: "[newly_created_artifact.GetDesc]\n\nNa první straně je drobný, ale elegantní text: „[owner.GetTitledFirstName|U] věnoval toto svým důvěryhodným poradcům, [dedication_g1.GetTitledFirstName] a [dedication_g2.GetTitledFirstName]“."
 artifact_dedication_woven_g: "[newly_created_artifact.GetDesc]\n\nPod hlavním motivem je vpletený drobný, ale elegantní nápis: „[owner.GetTitledFirstNameNoTooltip|U] věnoval toto svým důvěryhodným poradcům, [dedication_g1.GetTitledFirstName] a [dedication_g2.GetTitledFirstName]“."
 artifact_dedication_inscribed_h: "[newly_created_artifact.GetDesc]\n\nNa jeho boku je drobný, avšak elegantní nápis věnující předmět: „[owner.GetTitledFirstNamePossessive|U] Věčná sláva“."
 artifact_dedication_written_h: "[newly_created_artifact.GetDesc]\n\nNa první straně je drobný, ale elegantní nápis věnující předmět: „[owner.GetTitledFirstNamePossessive|U] Věčná sláva“."
 artifact_dedication_woven_h: "[newly_created_artifact.GetDesc]\n\nPod hlavním motivem je vpletený drobný, ale elegantní nápis věnující předmět: „[owner.GetTitledFirstNamePossessive|U] Věčná sláva“."
 fund_inspiration.7010.t: "$fund_inspiration.title$ Motto pro věky"
 fund_inspiration.7010.desc: "Slyším, jak [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] mumlá od druhého konce síně. „Potřebuji něco velkého, něco #EMP epického#! aby moje dílo vystoupilo nad netvůrčí masy, ale co, prostě CO?“\n\nKdyž [Select_CString(inspiration_owner.IsFemale,'její','jeho')] lesklé oči potkají mé, rozbije se do širokého úsměvu a mává ke mně. „Můj [ROOT.Char.GetLadyLord]! Co skvělý nápad! Co takhle přidat rodinné motto ke tvé zakázce?“"
 fund_inspiration.7010.a: "Jistě, to zní skvěle!"
 fund_inspiration.7010.b: "To je pošetilé a zbytečné."
 artifact_motto_inscribed: "[newly_created_artifact.GetDesc]\n\nMotto rodu [owner.GetHouse.GetName], #EMP '[owner.GetHouse.GetMotto]'#!, je elegantně vyryto na jedné straně."
 artifact_motto_written: "[newly_created_artifact.GetDesc]\n\nMotto rodu [owner.GetHouse.GetName], #EMP '[owner.GetHouse.GetMotto]'#!, je napsáno vysoce dekorativním písmem na první straně."
 artifact_motto_woven: "[newly_created_artifact.GetDesc]\n\nMotto rodu [owner.GetHouse.GetName], #EMP '[owner.GetHouse.GetMotto]'#!, je elegantně vpleteno nad hlavním motivem."
 fund_inspiration.7100.t: "$fund_inspiration.title$ Tvůrčí směr"
 fund_inspiration.7100.desc: "„Můj [ROOT.Char.GetLadyLord]! Práce na tvém vzácném artefaktu postupuje dobře!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] dnes vypadá ve velmi dobré náladě.\n\n„Nehřím sliby, ale... kdybych dokázal vytvořit opravdové mistrovské dílo, jakou myšlenku bys chtěl, abych sledoval?“"
 fund_inspiration.7100.a: "Aby způsoboval větší ztráty #EMP jim#!, méně #EMP nám#!."
 fund_inspiration.7100.a.tt: "Váš [Concept('artifact','artefakt')|E] může získat [Concept('casualties','ztráty')|E] [Concept('modifier','modifikátor')|E]." # todo: CONCEPT CASE
