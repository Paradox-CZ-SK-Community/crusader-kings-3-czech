 fund_inspiration.1042.desc: "„Tady, [ROOT.Char.Custom('FormOfAddressForLiege')]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ukáže na dva sluhy, kteří vyšli ze své tkalcovny a nesou role látky.\n\nKývne na ně a prapor se rozvine na dřevěném stojanu. Nemohu jinak než obdivovat jemné detaily a bezchybné linie.\n\n"
 fund_inspiration.0043.desc: "„Ano, [ROOT.Char.Custom('FormOfAddressForLiege')], vytvořím pro vás mohutný prapor!“ [inspiration_owner.GetTitledFirstName] je zjevně [Select_CString(inspiration_owner.IsFemale,'nadšená','nadšený')], že pro mě může pracovat. „Šlechta mou práci dobře zná, ale tohle je nová pocta!“\n\n„Věřte mi, nebude to pouhý kus látky, bude to ten nejkrálovštější závěs! Jen potřebuji vědět, jaký znak mám vyšít?“"
 fund_inspiration.0043.option_title: "Erb [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_G')]."
 fund_inspiration.0043.option_house: "Znak rodu [ROOT.Char.GetHouse.GetNameNoTooltip]."
 fund_inspiration.0043.option_dynasty: "Emblém dynastie [ROOT.Char.GetDynasty.GetNameNoTooltip]."
 fund_inspiration.0043.option_dynasty_tt: "Kvalita praporu dynastie závisí na [Concept('dynasty_prestige_level','úrovni věhlasu')|E]"
 fund_inspiration.0044.t: "$commission_artifact_decision$: Nástěnný závěs"
 fund_inspiration.0044.desc: "[Select_CString(antiquarian.IsFemale,'Má antikvářka','Můj antikvář')] [antiquarian.GetTitledFirstName] si přichází pro prostředky na mou zakázku. „Je načase, abyste [Select_CString(ROOT.Char.IsFemale,'měla','měl')] nové závěsy na zdi!“ Nesměle se na mě podívá.\n\n„Ehm, najdu zručného tkalce, [ROOT.Char.Custom('FormOfAddressForLiege')]... co byste si [Select_CString(ROOT.Char.IsFemale,'přála','přál')] nechat vyrobit?“ Bezmyšlenkovitě si v rukou pohrává s měšcem a čeká na mé rozhodnutí."
 fund_inspiration.0044.option_tapestry: "Kvalitní tapiserii do mé síně."
 fund_inspiration.0044.option_banner: "Potřebuji nový prapor."
