 fund_inspiration.0051.steppe_east: "Vydejte se na východní stepi!"
 fund_inspiration.0051.steppe_tarim: "Měli byste prozkoumat Tarimskou pánev!"
 fund_inspiration.0051.asia_minor: "Vydejte se na poloostrov Malé Asie!"
