 fund_inspiration.0021.desc: "„Nebudete litovat, že mě podporujete, můj [ROOT.Char.GetLadyLord]!“\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě ujišťuje, že [inspiration_owner.GetSheHe] vytvoří mistrovské dílo, a zároveň že si cení mého názoru. „Prosím, řekněte mi, jaký typ brnění si přejete?\" # todo: RETRANSLATED ENGLISH
 fund_inspiration.0021.mail: "Chci pružné kroužkové brnění."
 fund_inspiration.0021.mail.tt: "Není to příliš nápadné, ale spolehlivé"
 fund_inspiration.0021.plate: "Plátové brnění mě udrží v bezpečí!"
 fund_inspiration.0021.plate.tt: "Skvělá ochrana a vzhled, ale velmi těžkopádné a drahé"
 fund_inspiration.0021.scale: "Potřebuji spolehlivé šupinové brnění."
 fund_inspiration.0021.scale.tt: "Nabízí dobrou ochranu, ale je o něco méně pružné než některé alternativy"
 fund_inspiration.0021.lamellar: "Vyrobíte pevné lamelové brnění."
 fund_inspiration.0021.lamellar.tt: "Pružné brnění, které nabízí skvělou ochranu za rozumnou cenu"
 fund_inspiration.0021.laminar: "Vyrobte laminarové brnění."
 fund_inspiration.0021.laminar.tt: "Pevné a spolehlivé brnění"
 fund_inspiration.0021.brigandine: "Chci segmentované brnění."
 fund_inspiration.0021.brigandine.tt: "Velmi pružné a módní brnění"
 fund_inspiration.0022.t: "Inspirace pro brnění podpořena"
 fund_inspiration.0031.desc: "„Děkuji, že ve mne věříte, můj [ROOT.Char.GetLadyLord]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se [ROOT.Char.Custom2('QuirkAdverbPosOrNeg', inspiration_owner)] usměje, než nakloní [Select_CString(inspiration_owner.IsFemale,'její','jeho')] hlavu.\n\n„Nejsem si ale jistý, o čem psát. V poslední době mě zajímají témata související s [SCOPE.Custom('ArtifactBookSubject')], myslíte, že by to [Select_CString(ROOT.Char.IsFemale,'byla','byl')] dobrý námět knihy?“" # todo: RETRANSLATED ENGLISH
 fund_inspiration.0031.education: "Kniha bude o [ROOT.Char.Custom('education_focus')]."
 fund_inspiration.0031.lifestyle_reveler: "Napišme o radosti, o #EMP životě#!, o hostinách!"
 fund_inspiration.0031.lifestyle_blademaster: "Žádné téma není tak ostré jako to o čepelích!"
 fund_inspiration.0031.lifestyle_hunter: "Ať je to o detailech lovu a lovné zvěře!"
 fund_inspiration.0031.lifestyle_mystic: "Knihy prozkoumají můj nekonvenční přístup k životu!"
 fund_inspiration.0031.lifestyle_herbalist: "Kniha popíše bylinky a rostliny!"
 fund_inspiration.0031.lifestyle_physician: "Lidské tělo je téma, do kterého se vyplatí ponořit!"
 fund_inspiration.0031.lifestyle_cannibal: "Nic neprobudí můj #EMP hlad#! po objevování jako lidské tělo."
 fund_inspiration.0031.lifestyle_torturer: "Zdokumentujme mnohé způsoby, jak zlomit něčí mysl a tělo."
 fund_inspiration.0031.lifestyle_witch: "Dílo věnuji [ROOT.Char.GetFaith.WitchGodName]."
 fund_inspiration.0031.lifestyle_deviant: "Kniha by se měla zabývat #EMP potěšením#!!"
 fund_inspiration.0031.lifestyle_lunatic: "Kniha vysvětlí realitu. Jednu z nich."
 fund_inspiration.0031.focus: "Bude odrážet mé životní zaměření – napište o [ROOT.Char.Custom('LifestyleFocus')]!"
 fund_inspiration.0031.skill_option: "Napište o něčem, v čem jsem nadaný – "
 fund_inspiration.0031.skill_option_martial: "$fund_inspiration.0031.skill_option$válečnictví."
