 fund_inspiration.0071.incense_burner_sculpture: "Složitý kadidelný hořák."
 fund_inspiration.0072.t: "Inspirace kováře podpořena"
 fund_inspiration.0081.desc: "„Nebudete litovat, že jste mě podpořili, můj [ROOT.Char.GetLadyLord]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se mi uklání před [inspiration_owner.Custom('quirk_pos_pp')].\n\n„Teď bych potřeboval několik kádinek a síru. Mám mnoho k prozkoumání. Je nějaká konkrétní oblast, kterou byste chtěli, abych začal zkoumat?\" # todo: RETRANSLATED ENGLISH
 fund_inspiration.0081.elixirs: "Slyšel jsem pověsti o zázracích elixírů!"
 fund_inspiration.0081.metals: "Kovy mě vždy fascinovaly."
 fund_inspiration.0081.panacea: "Lék na všechny nemoci, panacea!"
