 fund_inspiration.0011.desc: "[inspiration_owner.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('inspiration_owner'))] a pak se hluboce ukloní. „Je pro mě čest i privilegium vykovat pro vás zbraň,“ pronese důstojně, ale v očích [Select_CString(inspiration_owner.IsFemale,'jí','mu')] se zableskne jiskra nadšení, která prozrazuje, že vážné vystupování je jen maska.\n\n„Řekněte mi, jaký způsob boje se zbraní preferujete? Přeji si vykovat něco, co by vám nejlépe vyhovovalo.“"
 fund_inspiration.0011.a: "Něco, co může současně řezat i bodat."
 fund_inspiration.0011.b: "Chci zbraň, která plně využije mou sílu!"
 fund_inspiration.0011.c: "Raději si udržuji nepřátele na dálku."
 fund_inspiration.0011.d: "Zapomeňte na kovárnu, chci střílet."
