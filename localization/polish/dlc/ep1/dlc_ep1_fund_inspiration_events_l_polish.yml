 fund_inspiration.0011.desc: "[inspiration_owner.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('inspiration_owner'))] a pak se hluboce ukloní. „Je pro mě čest i privilegium vykovat pro vás zbraň,“ [inspiration_owner.GetSheHe] pronese důstojným tónem, ale v [Select_CString(inspiration_owner.IsFemale,'jejích','jeho')] očích se zableskne jiskra nadšení, která prozrazuje [Select_CString(inspiration_owner.IsFemale,'její','jeho')] vážné vystupování.\n\n„Řekněte mi, jaký způsob boje se zbraní preferujete? Přeju si vykovat něco, co by vám nejlépe vyhovovalo.\" # todo: RETRANSLATED ENGLISH
