 fund_inspiration.0031.relationship_soulmate: "Má láska k [relationship_scope.GetTitledFirstName] je věcí legend!"
 fund_inspiration.0031.relationship_nemesis: "Má nenávist k [relationship_scope.GetTitledFirstName] by zaplnila mnoho svazků!"
 fund_inspiration.0031.dynasty: "Napište o slavné dynastii [ROOT.Char.GetDynasty.GetName]."
 fund_inspiration.0031.mystical_animal: "Vyprávím o mém lovu bílého [ROOT.Char.Custom('GetAnimalType')]."
 fund_inspiration.0031.pet_option_cat: "Prosím napište o mé milované kočce, [ROOT.Char.Custom('CatStoryName')]!"
 fund_inspiration.0031.pet_option_dog: "Prosím napište o mém milovaném psu, [ROOT.Char.Custom('DogStoryName')]!"
 fund_inspiration.0031.c: "Popište mé snahy sjednotit [united_title.GetName]!"
 fund_inspiration.0031.d: "Zřídil jsem [created_title.GetName], to je hodný námět!"
 fund_inspiration.0031.e: "Můj úspěch při obnovení [restored_title.GetName] by [Select_CString(restored_title.IsFemale,'měla','měl')] být zaznamenán!"
 fund_inspiration.0031.f: "Věřím vašemu úsudku."
 fund_inspiration.0032.t: "Inspirace pro knihu podpořena"
 fund_inspiration.0041.desc: "„Děkuji, že mi důvěřujete, můj [ROOT.Char.GetLadyLord]!“ [inspiration_owner.GetTitledFirstName] se usměje a pokračuje „Vaše důvěra není marná, moje dlouhá praxe s technikami přinesla opravdu nádherné koberce a závěsy.“\n\n„Pro vás bych ale doporučil tapisérii — dobře utkaná dokáže ovládnout pozornost místnosti a něco říci o jejím majiteli. Jediná otázka zní: co by tapisérie měla zobrazovat?“" # todo: RETRANSLATED ENGLISH
 fund_inspiration.0041.option_battle: "Pocta mému vítězství v bitvě u [ROOT.Var('epic_battle_location').Province.GetNameNoTooltip]."
 fund_inspiration.0041.option_abstract: "Dílo abstraktní umělecké krásy."
 fund_inspiration.0041.option_nature: "Něco, co ukáže nespoutanou krásu přírody."
 fund_inspiration.0041.option_history: "Něco, co ilustruje historii [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]."
 fund_inspiration.0041.option_life: "Zobrazení života v mém panství."
 fund_inspiration.0042.t: "Inspirace tkalce podpořena"
 fund_inspiration.0051.desc: "„Nebojte se, můj velký [ROOT.Char.GetTitleTierName],“ [inspiration_owner.GetTitledFirstName] se dramaticky uklání a [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('inspiration_owner'))].\n\n„Vydám se prozkoumat svět za vás, zatímco vy budete pokračovat v vládnutí nad svým panstvím. Co přinesu zpět, bude takové kvality, že ucítíte, jak se mé úspěchy #EMP prosakují#! skrze suvenýr z mého dobrodružství!“\n\nChvíli se [inspiration_owner.GetSheHe] odmlčí, než pokračuje. „A při té příležitosti, je nějaká oblast světa, která vás zajímá, můj [ROOT.Char.GetLadyLord]?\" # todo: RETRANSLATED ENGLISH
