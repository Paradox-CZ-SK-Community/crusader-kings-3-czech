 fund_inspiration.0012.t: "Inspirace pro zbraň podpořena"
 fund_inspiration.0021.desc: "„Nebudete litovat, že mě podporujete, [ROOT.Char.Custom('FormOfAddressForLiege')]!“\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě ujišťuje, že vytvoří mistrovské dílo, a zároveň že si cení mého názoru. „Prosím, řekněte mi, jaký typ zbroje si přejete?“"
 fund_inspiration.0021.mail: "Chci pružnou kroužkovou zbroj."
 fund_inspiration.0021.mail.tt: "Není příliš nápadná, ale je spolehlivá"
 fund_inspiration.0021.plate: "Plátová zbroj mě ochrání!"
 fund_inspiration.0021.plate.tt: "Skvělá ochrana i vzhled, ale velmi těžkopádná a drahá"
 fund_inspiration.0021.scale: "Potřebuji spolehlivou šupinovou zbroj."
 fund_inspiration.0021.scale.tt: "Nabízí dobrou ochranu, ale je o něco méně pružná než jiné typy"
 fund_inspiration.0021.lamellar: "Vyrobte pevnou lamelovou zbroj."
 fund_inspiration.0021.lamellar.tt: "Pružná zbroj, která nabízí skvělou ochranu za rozumnou cenu"
 fund_inspiration.0021.laminar: "Vyrobte laminární zbroj."
 fund_inspiration.0021.laminar.tt: "Pevná a spolehlivá zbroj"
 fund_inspiration.0021.brigandine: "Chci segmentovou zbroj."
 fund_inspiration.0021.brigandine.tt: "Velmi pružná a módní zbroj"
 fund_inspiration.0022.t: "Inspirace ke zbroji podpořena"
 fund_inspiration.0031.desc: "„Děkuji, že ve mne věříte, [ROOT.Char.Custom('FormOfAddressForLiege')]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se [ROOT.Char.Custom2('QuirkAdverbPosOrNeg', inspiration_owner)] usměje, a nakloní hlavu.\n\n„Nejsem si ale [Select_CString(inspiration_owner.IsFemale,'jistá','jistý')], o čem psát. V poslední době mě zajímají téma [SCOPE.Custom('ArtifactBookSubject')]. Myslíte, že by to byl dobrý námět pro knihu?“"
 fund_inspiration.0031.education: "Tématem knihy bude [ROOT.Char.Custom('education_focus')|l]."
 fund_inspiration.0031.lifestyle_reveler: "Napišme o radosti, o #EMP životě#!, o hostinách!"
 fund_inspiration.0031.lifestyle_blademaster: "Žádné téma není tak ostré jako to o čepelích!"
 fund_inspiration.0031.lifestyle_hunter: "Ať je to o detailech lovu a lovné zvěře!"
 fund_inspiration.0031.lifestyle_mystic: "Kniha prozkoumá můj nekonvenční přístup k životu!"
 fund_inspiration.0031.lifestyle_herbalist: "Kniha popíše bylinky a rostliny!"
 fund_inspiration.0031.lifestyle_physician: "Lidské tělo je téma, do kterého se vyplatí ponořit!"
 fund_inspiration.0031.lifestyle_cannibal: "Nic neprobudí můj #EMP hlad#! po objevování jako lidské tělo."
 fund_inspiration.0031.lifestyle_torturer: "Zdokumentujme mnohé způsoby, jak zlomit něčí mysl a tělo."
 fund_inspiration.0031.lifestyle_witch: "Dílo věnuji [ROOT.Char.GetFaith.WitchGodName]."
 fund_inspiration.0031.lifestyle_deviant: "Kniha by se měla zabývat #EMP potěšením#!!"
 fund_inspiration.0031.lifestyle_lunatic: "Kniha vysvětlí realitu. Jednu z nich."
 fund_inspiration.0031.focus: "Bude odrážet mé životní zaměření, kterým je [ROOT.Char.Custom('LifestyleFocus')]!"
 fund_inspiration.0031.skill_option: "Napište o oboru, ve kterém vynikám: "
 fund_inspiration.0031.skill_option_martial: "$fund_inspiration.0031.skill_option$válečnictví."
 fund_inspiration.0031.skill_option_diplomacy: "$fund_inspiration.0031.skill_option$diplomacie."
 fund_inspiration.0031.skill_option_stewardship: "$fund_inspiration.0031.skill_option$hospodářství."
 fund_inspiration.0031.skill_option_learning: "$fund_inspiration.0031.skill_option$učenost."
 fund_inspiration.0031.skill_option_intrigue: "$fund_inspiration.0031.skill_option$intriky."
 fund_inspiration.0031.relationship_soulmate: "Má láska k [relationship_scope.Custom('CZ_TitledFirstName_D')] je legendární!"
 fund_inspiration.0031.relationship_nemesis: "Má nenávist k [relationship_scope.Custom('CZ_TitledFirstName_D')] by zaplnila mnoho svazků!"
 fund_inspiration.0031.dynasty: "Napište o slavné dynastii [ROOT.Char.GetDynasty.GetName]."
 fund_inspiration.0031.mystical_animal: "Vyprávějte o mém lovu na bílé zvíře – [ROOT.Char.Custom('GetAnimalType')]!"
 fund_inspiration.0031.pet_option_cat: "Prosím napište o mé milované kočce, [ROOT.Char.Custom('CatStoryName')]!"
 fund_inspiration.0031.pet_option_dog: "Prosím napište o mém milovaném psu, [ROOT.Char.Custom('DogStoryName')]!"
 fund_inspiration.0031.c: "Popište mé snahy sjednotit [united_title.Custom('CZ_LandedName_A')]!"
 fund_inspiration.0031.d: "[Select_CString(ROOT.Char.IsFemale,'Zřídila','Zřídil')] jsem [created_title.Custom('CZ_LandedName_A')], to je hodný námět!"
 fund_inspiration.0031.e: "Můj úspěch při obnovení [restored_title.Custom('CZ_LandedName_G')] by měl být zaznamenán!"
 fund_inspiration.0031.f: "Věřím vašemu úsudku."
 fund_inspiration.0032.t: "Inspirace ke knize podpořena"
 fund_inspiration.0041.desc: "„Děkuji, že mi důvěřujete, [ROOT.Char.Custom('FormOfAddressForLiege')]!“ [inspiration_owner.GetTitledFirstName] se usměje a pokračuje: „Vaše důvěra není na místě nadarmo. Léta jsem [Select_CString(inspiration_owner.IsFemale,'zdokonalovala','zdokonaloval')] své techniky a [Select_CString(inspiration_owner.IsFemale,'utkala','utkal')] opravdu nádherné koberce a závěsy.“\n\n„Pro vás bych ale [Select_CString(inspiration_owner.IsFemale,'doporučila','doporučil')] tapisérii – dobře utkaná dokáže ovládnout pozornost místnosti a něco říci o jejím majiteli. Jediná otázka zní: co by tapisérie měla zobrazovat?“"
 fund_inspiration.0041.option_battle: "Pocta mému vítězství v bitvě u [CZProvNameNoTooltip(ROOT.Var('epic_battle_location').Province,'G')]."
 fund_inspiration.0041.option_abstract: "Dílo abstraktní umělecké krásy."
 fund_inspiration.0041.option_nature: "Něco, co ukáže nespoutanou krásu přírody."
 fund_inspiration.0041.option_history: "Něco, co ilustruje historii [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_G')]."
 fund_inspiration.0041.option_life: "Zobrazení života v mém panství."
 fund_inspiration.0042.t: "Tkalcovská inspirace podpořena"
 fund_inspiration.0051.desc: "„Nebojte se, [ROOT.Char.Custom('FormOfAddressForLiege')],“ [inspiration_owner.GetTitledFirstName] se dramaticky uklání a [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('inspiration_owner'))].\n\n„Vydám se prozkoumat svět za vás, zatímco vy budete dál vládnout svému panství. Co přinesu zpět, bude takové kvality, že ucítíte, jak suvenýrem z mé cesty #EMP prostupují#! mé úspěchy!“\n\nChvíli se odmlčí a pak pokračuje. „A při té příležitosti, je nějaká oblast světa, která vás zajímá, [ROOT.Char.Custom('FormOfAddressForLiege')]?“"
