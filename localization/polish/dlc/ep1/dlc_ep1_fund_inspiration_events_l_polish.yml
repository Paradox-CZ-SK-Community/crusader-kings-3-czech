 fund_inspiration.0052.t: "Inspirace pro dobrodružství podpořena"
 activity_adventure: "Dobrodružství"
 fund_inspiration.0061.desc: "„Děkuji za financování tohoto mého projektu, [ROOT.Char.Custom('FormOfAddressForLiege')].“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se snaží zachovat klid, ale vidím v [Select_CString(inspiration_owner.IsFemale,'jejích','jeho')] očích vzrušení.\n\n„Krabice, sochy, #EMP trůny#!... Je toho tolik, co mohu vyrobit! Možná máte nějaká přání?“"
 fund_inspiration.0061.chest: "Nádherná truhla na věci."
 fund_inspiration.0061.box: "Elegantní krabička na šperky či poklad."
 fund_inspiration.0061.sculpture: "Chci překrásnou sochu!"
 fund_inspiration.0061.cabinet: "Vyrobte skříňku, krásnou ale praktickou."
 fund_inspiration.0061.diwan: "Krásný a pohodlný diván."
 fund_inspiration.0061.table: "Chtěl bych ozdobný, ale pevný stůl!"
 fund_inspiration.0061.throne: "Vytvořte velkolepý trůn hodný mých síní!"
 fund_inspiration.0061.scientific_apparatus: "Možná přístroj pro učení a poznání?"
 fund_inspiration.0061.urn: "Dekorativní urna by doplnila mé síně."
 fund_inspiration.0061.icon: "Slavná ikona ozdobí mou zeď."
 fund_inspiration.0062.t: "Řemeslnická inspirace podpořena"
 fund_inspiration.0071.desc: "„Děkuji za financování tohoto mého projektu, [ROOT.Char.Custom('FormOfAddressForLiege')]!“\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se snaží zachovat klid, ale vidím v [Select_CString(inspiration_owner.IsFemale,'jejích','jeho')] očích nadšení, když pokračuje. „Z kovu dokážu vytvořit #EMP zázraky#!. Máte nějaká přání?“"
 fund_inspiration.0071.brooch: "Chci krásnou sponu!"
 fund_inspiration.0071.regalia: "Vyrobte regálie odpovídající mé pozici."
 fund_inspiration.0071.crown: "Královská koruna hodná spočinout na mé hlavě!"
 fund_inspiration.0071.goblet: "Vznešený kalich."
 fund_inspiration.0071.aquamanile: "Nádherné aquamanile pro rituální omývání."
 fund_inspiration.0071.incense_burner_sculpture: "Zdobenou kadidelnici."
 fund_inspiration.0072.t: "Kovotepecká inspirace podpořena"
 fund_inspiration.0081.desc: "„Nebudete litovat, že jste mě [Select_CString(ROOT.Char.IsFemale,'podpořila','podpořil')], [ROOT.Char.Custom('FormOfAddressForLiege')]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se mi ukloní, [inspiration_owner.Custom('quirk_pos_pp')].\n\n„Teď bych [Select_CString(inspiration_owner.IsFemale,'potřebovala','potřeboval')] několik kádinek a síru. Mám mnoho k prozkoumání. Je nějaká konkrétní oblast, kterou byste [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')], abych [Select_CString(inspiration_owner.IsFemale,'začala','začal')] zkoumat?“"
 fund_inspiration.0081.elixirs: "[Select_CString(ROOT.Char.IsFemale,'Slyšela','Slyšel')] jsem pověsti o zázračných elixírech!"
 fund_inspiration.0081.metals: "Kovy mě vždy fascinovaly."
 fund_inspiration.0081.panacea: "Lék na všechny nemoci, panacea!"
 fund_inspiration.0081.immortality: "Chci žít navěky."
 fund_inspiration.0081.you_decide_option_tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] bude studovat a vyrobí [Concept('artifact','artefakt')|E] podle tvých pokynů"
 fund_inspiration.0081.they_decide_option_tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] bude studovat a vyrobí [Concept('artifact','artefakt')|E] podle vlastního uvážení"
 fund_inspiration.0082.t: "Alchymistická inspirace podpořena"
 fund_inspiration.0091.desc: "[inspiration_owner.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('inspiration_owner'))] a pak se hluboce ukloní. „Samozřejmě vám mohu vyrobit luk, [ROOT.Char.Custom('FormOfAddressForLiege')],“ pronese, ale nadšení prozrazuje, jak úzkostlivě se snaží zachovat formálnost.\n\n„Jaký styl střelby ale preferujete? [Select_CString(inspiration_owner.IsFemale,'Ráda','Rád')] vyřežu něco, co vám bude nejlépe sedět.“"
 fund_inspiration.0091.a: "Dobrý starý prostý luk, nic víc."
 fund_inspiration.0091.b: "Vyřežte mi mohutný dlouhý luk."
 fund_inspiration.0091.c: "Lepidlo a šlachy drží nejlépe."
 fund_inspiration.0091.d: "Musíte mi obstarat pořádnou zbraň."
