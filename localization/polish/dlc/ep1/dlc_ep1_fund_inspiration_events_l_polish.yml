 fund_inspiration.1001.t: "Inspirace uskutečněna"
 fund_inspiration.1001.desc: "„Můj [ROOT.Char.GetLadyLord]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se ke mně přiblíží se širokým úsměvem. „Pilně jsem [Select_CString(ROOT.Char.IsFemale,'pracovala','pracoval')] mnoho dní i nocí a konečně je má práce hotova!“\n\n[inspiration_owner.GetSheHe|U] mi předkládá předmět zabalený v látce, a když odkrývám, co je ukryto, oči se mi rozšíří.\n\n" # todo: RETRANSLATED ENGLISH
 fund_inspiration.1001.a: "To je nádherné!"
 fund_inspiration.1001.b: "Nechť přípravy započnou."
 fund_inspiration.1001.b.coronation_ready: "Nyní můžete uspořádat [Concept('coronation','korunovace')|E]" # todo: CONCEPT CASE
 fund_inspiration.1071.coronation: "\n\nMoje koruna je hotová, nyní mohu uspořádat korunovaci a upevnit svou autoritu jako panovník."
 fund_inspiration.1011.desc: "„Můj [ROOT.Char.GetLadyLord]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně přichází se širokým úsměvem, potem stékajícím po čele a sazí umazanou tváří. „Pílil jsem u výhně mnoho dní i nocí, ale konečně je má práce hotova!“\n\n[inspiration_owner.GetSheHe|U] mi předkládá předmět zabalený v látce, a když odhaluji, co je uvnitř, oči se mi rozšíří.\n\n" # todo: RETRANSLATED ENGLISH
 fund_inspiration.1021.desc_opening_1: "„Můj [ROOT.Char.GetLadyLord]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mává na mě se širokým úsměvem a ukazuje na zakrytý stojan na zbroj. „Pílil jsem u výhně mnoho dní i nocí, ale konečně je má práce hotova!\" # todo: RETRANSLATED ENGLISH
 fund_inspiration.1021.desc_opening_2: "„Můj [ROOT.Char.GetLadyLord]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě mávnutím ruky přivolá ke krytému stojanu s brněním. [inspiration_owner.GetSheHe|U] se snaží udržet profesionální vystupování, ale vidím oheň v [Select_CString(inspiration_owner.IsFemale,'jejích','jeho')] očích, když mi [inspiration_owner.GetSheHe] říká, že [Select_CString(inspiration_owner.IsFemale,'její','jeho')] dílo je hotové." # todo: RETRANSLATED ENGLISH
 fund_inspiration.1021.desc: "\n\nS efektním gestem [inspiration_owner.GetSheHe] strhne krycí látku a oči se mi rozšíří.\n\n"
 fund_inspiration.1021.a: "Nádherné!"
 fund_inspiration.1031.desc_opening: "„My [ROOT.Char.GetLadyLord]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] smiles and gestures me over with ink-stained hands."
 fund_inspiration.1031.desc_crime: "„Téma knihy je poněkud kontroverzní, ale je to mistrovské dílo. Podívejte se!“\n\n"
 fund_inspiration.1031.desc_soulmate_died: "„Vaše milovaná [soulmate.GetTitledFirstName] možná zemřela, ale tato kniha je svědectvím lásky, kterou jste sdíleli.“\n\n"
 fund_inspiration.1031.desc_nemesis_died: "„[nemesis.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)|U] možná [Select_CString(ROOT.Char.IsFemale,'zemřela','zemřel')], ale tato kniha je svědectvím nenávisti, kterou jste k [nemesis.GetHerHim] cítili.“\n\n"
 fund_inspiration.1031.desc_cat_died: "„Vaše milovaná kočka možná zemřela, ale tato kniha by měla zajistit, že nikdo nezapomene na kočku jménem [inspiration_owner.Custom('CatStoryName')]!“\n\n"
 fund_inspiration.1031.desc_dog_died: "„Váš milovaný pes možná [Select_CString(ROOT.Char.IsFemale,'zemřela','zemřel')], ale tato kniha by měla zajistit, že nikdo nezapomene na psa jménem [inspiration_owner.Custom('DogStoryName')]!“\n\n"
 fund_inspiration.1031.desc_low_content_quality: "„Kniha je hotová. Doufám, že hotové dílo přehluší mé nedostatečné znalosti o tématu. Prosím, podívejte se!“\n\n"
 fund_inspiration.1031.desc: "„Má kniha– mé #EMP mistrovské dílo#! je hotovo! Pohleďte.“\n\n"
 fund_inspiration.1031.a: "Jsem ohromen!"
 fund_inspiration.1032.t: "Psané city"
 fund_inspiration.1032.desc: "„Můj [ROOT.Char.Custom('LoverPetName')], mám pro tebe překvapení!“\n\n[inspiration_sponsor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi předkládá krásnou knihu a když jí listuji, sotva věřím vlastním očím. [Select_CString(inspiration_sponsor.IsFemale,'Nechala','Nechal')] sepsat knihu o #EMP nás#!!\n\n„Vazba bledne tvou krásou a obsah se nemůže rovnat tvé společnosti, ale tyto stránky nesou podstatu mé lásky k tobě.“"
 fund_inspiration.1032.a: "Ó, můj [inspiration_sponsor.Custom('LoverPetName')]!"
 fund_inspiration.1033.desc: "„Mám pro tebe překvapení!“\n\n[inspiration_sponsor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi předkládá krásnou knihu, ale když jí listuji, sotva věřím vlastním očím. [Select_CString(inspiration_sponsor.IsFemale,'Nechala','Nechal')] sepsat knihu s jediným cílem — pomluvit #EMP mě#!!\n\n„Ačkoli žádná slova na tomto světě nemohou vyjádřit pohrdání, které k tobě cítím, a žádná ilustrace nemůže přesně zachytit pohromu, kterou je tvá tvář, přesto jsem to [Select_CString(ROOT.Char.IsFemale,'zkusila','zkusil')]. Celý svět to bude číst a vědět, jak podlý jsi.“"
 fund_inspiration.1033.a: "Ten [inspiration_sponsor.Custom('InsultNoun')]!"
 fund_inspiration.1033.a_proud: "Ale oni #EMP budou vědět#! o mně!"
 fund_inspiration.1041.desc: "„Tady, můj [ROOT.Char.GetLadyLord]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ukazuje na dveře své tkalcovny, kde měsíce pilně [Select_CString(ROOT.Char.IsFemale,'pracovala','pracoval')] na mé zakázce. Když vstoupím dovnitř, zasténám úžasem, když se zadívám na dílo visící přede mnou.\n\n" # todo: RETRANSLATED ENGLISH
 fund_inspiration.1051.desc: "„Můj [ROOT.Char.GetLadyLord]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] oznámí svůj příchod překvapivě hlasitým hlasem. [inspiration_owner.GetSheHe|U] pyšně drží balík pevně zabalený v látce.\n\n„Vrátím se z [inspiration_owner.Custom('InspirationAdventureDestination')] s artefaktem z mé cesty!“\n\nVezmu do rukou objemný balík a uvolním šňůry, než odlepím vrstvu za vrstvou tkaniny. Uvnitř" # todo: RETRANSLATED ENGLISH
 fund_inspiration.1051_throne.desc: "„Můj [ROOT.Char.GetLadyLord]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] oznámí svůj příchod překvapivě hlasitě. [inspiration_owner.GetSheHe|U] hrdě vede velkou procesí až k vašemu trůnu. Za [inspiration_owner.GetHerHim] se do síně veze vozík.\n\n„Vrátím se z [inspiration_owner.Custom('InspirationAdventureDestination')] s velkým symbolem královské ctnosti!“\n\nKdyž se vozík přibližuje, uvědomím si, že nese trůn." # todo: RETRANSLATED ENGLISH
 fund_inspiration.1051_ark_covenant.desc: "„Můj [ROOT.Char.GetLadyLord]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] oznámí svůj příchod překvapivě hlasitě. [inspiration_owner.GetSheHe|U] hrdě vede velké procesí až k vašemu trůnu. Za [inspiration_owner.GetHerHim] několik pomocníků nese něco, co vypadá jako obrovská bedna.\n\n„Vrátím se z [inspiration_owner.Custom('InspirationAdventureDestination')] s cenou z mé cesty!“\n\nPřistoupím k obřímu boxu, když jeden z pomocníků odlomí desky, které skrývají jeho poklad. Uvnitř" # todo: RETRANSLATED ENGLISH
 fund_inspiration.1051_cupboard.desc: "„Můj [ROOT.Char.GetLadyLord]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] oznámí svůj příchod překvapivě hlasitě. [inspiration_owner.GetSheHe|U] pyšně ukazuje na kus nábytku, který nesou dva pomocníci.\n\n„Vrátím se s artefaktem z mé cesty!“\n\nPřistoupím k artefaktu a prohlížím si, co mi můj [inspiration_owner.GetWomanMan] přivezl z [inspiration_owner.Custom('InspirationAdventureDestination')]." # todo: RETRANSLATED ENGLISH
 fund_inspiration.1051.desc.skull: "je lebka [newly_created_artifact.GetFeatureText( 'animal_skull_type' )]. Ptám se [inspiration_owner.GetFirstNameNoTooltip] na detaily a [inspiration_owner.GetSheHe] líčí příběh o tom, jak bylo to obrovské zvíře sraženo."
 fund_inspiration.1051.desc.goblet: "je to kalich. Ptám se [inspiration_owner.GetFirstNameNoTooltip], odkud to má, a [inspiration_owner.GetSheHe] mi vypráví o mrazivém dare, který [Select_CString(inspiration_owner.IsFemale,'měla','měl')] s cizincem, jež skončil tím, že protivník prohrál po vypití jedu."
 fund_inspiration.1051.desc.box: "je to krabice. Místní řemeslník ji daroval [inspiration_owner.GetFirstNameNoTooltip] poté, co [Select_CString(inspiration_owner.IsFemale,'zachránila','zachránil')] [dummy_gender.GetHerHim] před smečkou divokých zvířat. [inspiration_owner.GetSheHe|U] mi vypráví, jak [Select_CString(ROOT.Char.IsFemale,'vylákala','vylákal')] a [Select_CString(ROOT.Char.IsFemale,'přelstila','přelstil')] krvelačná zvířata, která padla k smrti."
 fund_inspiration.1051.desc.hide: "je kůže [newly_created_artifact.GetFeatureText( 'animal_hide_type' )]. [inspiration_owner.GetFirstNameNoTooltip] mi vypráví, jak [Select_CString(inspiration_owner.IsFemale,'porazila','porazil')] krvelačné zvíře, zatímco já obdivuji kůži toho, co muselo být majestátní zvíře."
 fund_inspiration.1051.desc.tapestry: "je to tapisérie. [inspiration_owner.GetFirstNameNoTooltip] se hrdě pyšní, když mi vypráví příběh o svém cestovním společníkovi, který [Select_CString(inspiration_owner.IsFemale,'byla','byl')] mistrným krejčím. Jejich společné dobrodružství inspirovalo vybrané motivy na této tapisérii."
 fund_inspiration.1051.desc.epic: "je to artefakt jako žádný, jaký jsem dosud viděl.\n\n[inspiration_owner.GetFirstNameNoTooltip] se pyšně usměje: „[epic.GetDesc]“"
 fund_inspiration.1051.desc.epic.ark: "je velká kamenná truhla, uvnitř leží několik kamenných desek\n\n[inspiration_owner.GetFirstNameNoTooltip] pyšně hlásí: „Toto je Arch a úmluvy! Obsahuje kamenné desky, které Izraelitům dal Mojžíš.“\n\n[inspiration_owner.GetFirstNameNoTooltip] pak předvádí dvoru vyprávění o svých dobrodružstvích v [inspiration_owner.Custom('InspirationAdventureDestination')]. Příběh, který zahrnuje protivníky poháněné temnými ideologiemi a návštěvy mnoha malebných míst."
 fund_inspiration.1051.desc.epic.throne: "\n\n[inspiration_owner.GetFirstNameNoTooltip] pyšně oznamuje: „[epic.GetDesc]“"
 fund_inspiration.1051.desc.epic.cupboard: "\n\nS velkým úsměvem [inspiration_owner.GetFirstNameNoTooltip] proklamuje: „[epic.GetDesc]“"
 fund_inspiration.1051.desc.regalia: "leží regálie hodné královského dvora.\n\n[inspiration_owner.GetFirstNameNoTooltip] se pyšně usměje a vysvětlí, jak si získal vděčnost místního vládce v [inspiration_owner.GetCurrentLocation.GetNameNoTooltip], v dlouhém příběhu, jehož vyvrcholením bylo, že tento vládce nabídl [newly_created_artifact.GetName] [inspiration_owner.GetFirstNamePossessiveNoTooltip] mistru."
 fund_inspiration.1051.desc.regalia_2: "leží regálie hodné královského dvora.\n\n[inspiration_owner.GetFirstNameNoTooltip] se pyšně usměje a vysvětlí, že se jedná o dar od dalekého vládce, který slyšel o velkoleposti vašeho dvora a chce vás zaujmout."
 fund_inspiration.1051.desc.armor: "leží souprava brnění.\n\n[inspiration_owner.GetFirstNameNoTooltip] vypráví dvoru příběh o tom, jak se dostal k tomuto neobvyklému souboru, který vám nyní nabízí."
 fund_inspiration.1051.desc.weapon: "leží [newly_created_artifact.GetName].\n\n[inspiration_owner.GetFirstNameNoTooltip] začíná znovu vyprávět příběh o tom, jak se tato zbraň dostala do [Select_CString(inspiration_owner.IsFemale,'její','jeho')] držení. Příběh s mnoha zvraty, některými méně pravděpodobnými než jiné."
 fund_inspiration.1051.desc.necklace: "leží náhrdelník.\n\n[inspiration_owner.GetFirstNameNoTooltip] se zdá být velmi potěšen, že vám může toto ocenění předat, ale nejeví ochotu rozvést, jak k němu přišel."
 fund_inspiration.1051.a: "To je nádherné!"
 fund_inspiration.1051.b: "Musí se o něj starat jen 'ti nejlepší'"
 fund_inspiration.1061.desc_floor_bound_artifact: "„Můj [ROOT.Char.GetLadyLord]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě přivolává k objektu přikrytému tkaninou s širokým úsměvem na [Select_CString(inspiration_owner.IsFemale,'její','jeho')] tváři. „Dřel jsem mnoho dní a nocí a konečně je má práce hotova!“\n\n[inspiration_owner.GetSheHe|U] strhne pokrývku a oči se mi rozšíří, když spatřím, co je skryto pod ní.\n\n"
 fund_inspiration.1061.desc: "„Sem, můj [ROOT.Char.GetLadyLord]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě přivolává s širokým úsměvem. „Dřel jsem mnoho dní a nocí a konečně je má práce hotova!“\n\n[inspiration_owner.GetSheHe|U] mi předkládá předmět zabalený v látce, a když zvednu plátno, oči se mi rozšíří.\n\n"
 fund_inspiration.1081.desc_opening: "„Můj [ROOT.Char.GetLadyLord]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě přivolává ke [Select_CString(inspiration_owner.IsFemale,'jejímu','jeho')] zaneřáděnému psacímu stolu s obrovským úsměvem na [Select_CString(inspiration_owner.IsFemale,'její','jeho')] tváři."
 fund_inspiration.1081.immortality_fail_desc_opening: "„Vím, že jsem říkal, že bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] najít způsob, jak prodloužit život donekonečna, ale bohužel se tomu tak nestalo."
 fund_inspiration.1081.immortality_fail_desc_young: "Nicméně se mi podařilo vyrobit elixír, který vás do jisté míry ochrání před stárnutím! Prosím, ochutnejte, nebo alespoň prohlédněte plody mé práce.„\n\n"
 fund_inspiration.1081.immortality_fail_desc_old: "Nicméně se mi podařilo vyrobit elixír, který vám vrátí část ztracené síly! Prosím, ochutnejte, nebo alespoň prohlédněte plody mé práce.„\n\n"
 fund_inspiration.1081.elixir_desc_desc_young: "„Mé experimenty přinesly ovoce. Hle, elixír, který do jisté míry zabraňuje stárnutí! Prosím, podívejte se, a možná i ochutnejte.“\n\n"
 fund_inspiration.1081.elixir_desc_desc_old: "„Mé experimenty přinesly ovoce. Hle, elixír, který vám navrátí část ztracené síly! Prosím, podívejte se, a možná i ochutnejte.“\n\n"
 fund_inspiration.1081.panacea_desc: "„Je to panacea založená na ustálené tradici theriaku, obsahující myrhu, šafrán, opium, hadí maso a řadu dalších ingrediencí. Po staletí se ukazuje jako velmi účinná a já ji ještě zdokonalil! Podívejte se.“\n\n"
 fund_inspiration.1081.metals_philosophers_stone_desc: "„Dokázal jsem to! Vytvořil jsem kámen mudrců! Toto je mé Magnum Opus, mé zlaté dědictví. Prosím, pohlédněte!“\n\n"
 fund_inspiration.1081.metals_mercury_desc: "„Ohřál jsem směs rtuti a síry v nádobě, což způsobilo její vypaření a zkondenzování v horní části lahve. Když jsem pak nádobu [Select_CString(ROOT.Char.IsFemale,'rozbila','rozbil')] a rozemlel vzniklou sloučeninu, vytvořil jsem vermilion, jasně červený a zářivý! Zde mám zapsané své poznatky.“\n\n"
 fund_inspiration.1081.metals_arsenic_desc: "„Ohřál jsem arsenovou rudu, která vytvořila bílý prášek rozpustný ve vodě. Jsem si jistý, že při požití je smrtelný, ale nezanechá žádnou stopu chuti ani vůně! Zde mám zapsané své poznatky.“\n\n"
 fund_inspiration.1081.metals_gold_desc: "„Vytvořil jsem zlato! Jak teoretizovaly velké mysli přede mnou, příčinou u olova byla nedostatečná vlhkost a teplo.“\n\nKdyž požádám o pozorování procesu, [inspiration_owner.GetSheHe] trvá na tom, že malý kousek zlata na stole mluví za sebe. „Ale samozřejmě jsem své poznatky zapsal, podívejte se.“\n\n"
 fund_inspiration.1081.metals_silver_desc: "„Vytvořil jsem stříbro! Jak teorie předchůdců říkají, stříbro vzniká zahříváním mědi a dalších běžných kovů, dokud nezbělejí.“\n\nKdyž požádám o pozorování procesu, [inspiration_owner.GetSheHe] trvá na tom, že malý kousek stříbra na stole mluví sám za sebe. „Ale samozřejmě jsem své poznatky zapsal, podívejte se.“\n\n"
 fund_inspiration.1081.metals_fallback_desc: "„Své poznatky o obyčejných kovech a přeměnách jsem shromáždil do této knihy. Tady, podívejte se.“\n\n"
 fund_inspiration.1081.a_elixirs: "Hned ochutnám!"
 fund_inspiration.1081.a: "Fascinující!"
 fund_inspiration.1091.desc: "„Můj [ROOT.Char.GetLadyLord]!“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně přistupuje s spokojeným úsměvem vyrytým na [Select_CString(inspiration_owner.IsFemale,'její','jeho')] tváři. „Dřel jsem u pracovního stolu mnoho dní i nocí, ale konečně je moje dílo hotové!“\n\n[inspiration_owner.GetSheHe|U] mi podává předmět zabalený v látce, a když odhalím, co se skrývá uvnitř, oči se mi rozšíří.\n\n"
 fund_inspiration.1091.a: "Skvělá práce! Opravdu výborné!"
 fund_inspiration.9001.t: "Inspirace skončila"
 fund_inspiration.9001.desc: "Katastrofa! [inspiration_owner.GetTitledFirstName], můj příjemce, [Select_CString(inspiration_owner.IsFemale,'zemřela','zemřel')]. [inspiration_owner.GetSheHe|U] [inspiration_owner.GetDeathReason] dříve, než [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] splnit [inspiration_owner.GetHerHis]– splnit #EMP můj#! sen!\n\n"
 fund_inspiration.9001.desc_weapon: "Teď nikdy nezjistím, jaké mistrovské dílo by [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] vykovat..."
 fund_inspiration.9001.desc_armor: "Teď už nikdy nezjistím, jaké mistrovské dílo by [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] vytvořit..."
 fund_inspiration.9001.desc_book: "Teď už nikdy nezjistím, jaké mistrovské dílo by [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] napsat..."
 fund_inspiration.9001.desc_weaver: "Teď už nikdy nezjistím, jaké mistrovské dílo by [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] uplést..."
 fund_inspiration.9001.desc_adventurer: "Teď už nikdy nezjistím, co by mi [Select_CString(inspiration_owner.IsFemale,'její','jeho')] dobrodružství mohlo přinést..."
 fund_inspiration.9001.desc_artisan: "Teď už nikdy nezjistím, jaké mistrovské dílo by [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] vytvořit..."
 fund_inspiration.9001.desc_smith: "Teď už nikdy nezjistím, jaké mistrovské dílo by [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] vykovat..."
 fund_inspiration.9001.desc_alchemy: "Teď už nikdy nezjistím, jaké zázraky by [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] vytvořit nebo objevit..."
 fund_inspiration.9001.desc_research: "Teď už nikdy nezjistím, jakých objevů by [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] být schopen(na)..."
 fund_inspiration.9001.a: "Jaká tragédie!"
 fund_inspiration.9001.a_tt: "Přestáváte financovat inspiraci [inspiration_owner.GetTitledFirstNamePossessive]"
 fund_inspiration.9002.desc: "Katastrofa! [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(ROOT.Char.IsFemale,'byla zajata','byl zajat')] a již nemůže pracovat na naplnění [Select_CString(inspiration_owner.IsFemale,'jejího','jeho')] snu o"
 fund_inspiration.9002.desc_weapon: "vykovat zbraň."
 fund_inspiration.9002.desc_armor: "vyrobit zbroj."
 fund_inspiration.9002.desc_book: "napsat knihu."
 fund_inspiration.9002.desc_weaver: "utkat mistrovské dílo."
 fund_inspiration.9002.desc_adventurer: "vypravit se na dobrodružství."
 fund_inspiration.9002.desc_artisan: "vytvořit něco velikého."
 fund_inspiration.9002.desc_smith: "vykovat mistrovské dílo."
 fund_inspiration.9002.desc_alchemy: "odhalit tajemství tohoto světa"
 fund_inspiration.9002.desc_research: "další vědecké inovace."
 fund_inspiration.9003.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] už není mým dvořanem, takže už nemohu podporovat [Select_CString(inspiration_owner.IsFemale,'její','jeho')] snahu o"
 fund_inspiration.9004.desc: "[inspiration_owner.GetTitledFirstName] se vrací na můj dvůr, nedlouho poté, co [inspiration_owner.GetTitledFirstName|U] odešel."
 fund_inspiration.9004.desc_adventurer_tired_of_europe: "\n\nKdyž se [inspiration_owner.GetSheHe] vrací do mého dvora, sklání se, aby [Select_CString(ROOT.Char.IsFemale,'políbila','políbil')] zem, a pak mou botu. „Můj [ROOT.Char.GetLadyLord], budu vám navždy [Select_CString(ROOT.Char.IsFemale,'zavázána','zavázán')], že mi dovolíte vrátit se do civilizace... pryč od té kalné a masité země zvané Evropa.“"
 fund_inspiration.9004.desc_adventurer_stuck_in_swamp: "K mému soudnímu sálu dorazí klopotající se hromada hlíny, listí a bláta. Cítím, že mi zvoní umíráček. Možná jsem málo [Select_CString(ROOT.Char.IsFemale,'modlila','modlil')]. Ale když moji služebníci přelijí hromadu vědrem vody, špína splaskne a odhalí [inspiration_owner.GetTitledFirstName], zpátky z bažiny. [inspiration_owner.GetSheHe|U] se okamžitě vrhá políbit mé chodidlo. „Už jsem to nevydržel, a jak jsem rád, že jsem zpátky ve civilizovaném světě.“\n\nTak"
 fund_inspiration.9004.a: "Seberte se."
 change_artifact_quality_effect_gain: "Artefakt [Concept('artifact','artefakt')|E] vytvořený díky [artifact_quality_scope.GetShortUINamePossessive|U] [inspiration.GetName] bude o #P vyšší kvality#!" # todo: CONCEPT CASE
 change_artifact_quality_effect_slight_gain: "Artefakt [Concept('artifact','artefakt')|E] vytvořený díky [artifact_quality_scope.GetShortUINamePossessive|U] [inspiration.GetName] by [Select_CString(inspiration.IsFemale,'mohla','mohl')] být o #P lehce vyšší kvality#!" # todo: CONCEPT CASE
 change_artifact_quality_effect_loss: "Artefakt [Concept('artifact','artefakt')|E] vytvořený díky [artifact_quality_scope.GetShortUINamePossessive|U] [inspiration.GetName] bude o #N nižší kvality#!" # todo: CONCEPT CASE
 change_artifact_quality_effect_slight_loss: "Artefakt [Concept('artifact','artefakt')|E] vytvořený díky [artifact_quality_scope.GetShortUINamePossessive|U] [inspiration.GetName] by [Select_CString(inspiration.IsFemale,'mohla','mohl')] být o #N mírně nižší kvality#!" # todo: CONCEPT CASE
 change_artifact_book_content_quality_effect_gain: "Obsah knihy [Concept('artifact','artefakt')|E] bude pravděpodobně o #P vyšší kvality#!" # todo: CONCEPT CASE
 change_artifact_book_content_quality_effect_loss: "Obsah knihy [Concept('artifact','artefakt')|E] bude pravděpodobně o #N nižší kvality#!" # todo: CONCEPT CASE
 fund_inspiration.9005.t: "Nedokončená záležitost"
 fund_inspiration.9005.desc_intro: "[inherited_insp_owner.GetTitledFirstName], můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('inherited_insp_owner'))], žádá o slovo uprostřed zmatku po nástupnictví. \n\n„Můj [ROOT.Char.GetLadyLord], před [Select_CString(old_ruler.IsFemale,'jejím','jeho')] úmrtím mě [old_ruler.GetTitledFirstNameRegnal] objednal; [Select_CString(old_ruler.IsFemale,'byla','byl')] jsem uprostřed [inherited_insp_owner.Custom('InspirationTypeDescription')] pro [old_ruler.GetHerHim].“ \n\n"
 fund_inspiration.9005.desc_multiple: "„I další řemeslníci také pracovali, a chceme vědět, zda budete sponzorovat naše úsilí.“"
 fund_inspiration.9005.desc_single: "„Práce už začala, a byla by škoda ji nedokončit...“„"
 fund_inspiration.9005.a: "Práce bude pokračovat!"
 fund_inspiration.9005.b: "Tyto pošetilé rozptýlení skončí."
 inherited_inspiration_continue_tt: "Budete sponzorovat zakázky [old_ruler.GetTitledFirstNamePossessiveRegnal]"
 inherited_inspiration_end_tt: "#X Veškeré investované zlato bude ztraceno#!"
 fund_inspiration.title: "Inspirace:"
 fund_inspiration.2001.t: "$fund_inspiration.title$ Žádost o prostředky"
 fund_inspiration.2001.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] trvá na tom, že prostředky, které jsem [inspiration_owner.GetHerHim] poskytl, nejsou dostatečné k vytvoření artefaktu hodného mého postavení.\n\n„Jen o něco více zlata a [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] bych vytvořit něco #EMP skutečně#! velkolepého!“"
 fund_inspiration.2001.a: "Cokoli potřebujete!"
 fund_inspiration.2001.b: "Vystačte si s tím, co máte."
 fund_inspiration.2002.t: "$fund_inspiration.title$ Žádost o... materiály"
 fund_inspiration.2002.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] má tu drzost mě svolat do [Select_CString(inspiration_owner.IsFemale,'její','jeho')] ubohé a smradlavé místnosti.\n\n„Můj [ROOT.Char.GetLadyLord], pokrok jde kupředu, ale kdybych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] ještě nějaké součástky... nějaké #EMP lidské#! materiály, [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] bych vytvořit něco #EMP opravdu ohromujícího#!. Potřebuji tu osobu živou, alespoň zpočátku.“\n\nKdyž [inspiration_owner.GetFirstName] dokončí [Select_CString(inspiration_owner.IsFemale,'její','jeho')] žádost, "
 fund_inspiration.2002.desc.fingernails: "můj pohled padne na krvavě obarvené nástroje a utržené nehty rozházené po [inspiration_owner.GetHerHis] stole."
 fund_inspiration.2002.desc.potions: "můj pohled bezmyšlenkovitě sklouzne k psacímu stolu a policím plným záhadných živočišných částí, barevných tekutin a nebezpečně vypadajících rostlin."
 fund_inspiration.2002.desc.blind: "Slyším slabé sténání a vzlyky někoho jiného v místnosti. Po sérii škytavých záchvatů následuje bolestivě znějící zvracení doprovázené silným kyselým zápachem zvratků."
 fund_inspiration.2002.a: "„Použij lidi v mých žalářích, jak uznáš za vhodné.“"
 fund_inspiration.2002.b: "„Tady, nějaké mince na unesení pár poddaných.“"
 fund_inspiration.2002.c: "„Hraniční pás není daleko. Jdi unést nějaké cizí poddané.“"
 fund_inspiration.2002.toast_outcome.negative: "Důkazy vedou k vám jako k příčině zmizení poddaných"
 fund_inspiration.2002.toast_outcome.positive: "Únos poddaných vám projde bez následků"
 fund_inspiration.2002.d: "Odmítněte žádost [inspiration_owner.GetTitledFirstNamePossessiveNoTooltip]."
 fund_inspiration.2003.t: "$fund_inspiration.title$ Přerušení"
 fund_inspiration.2003.desc: "„Pro #EMP [inspiration_owner.GetFaith.HighGodName]#!, [previous_inspired.GetWomanMan]! Nechte mě být!“\n\nPoklidnou atmosféru roztrhne křik [inspiration_owner.GetFirstName], když vtrhne na nádvoří. [previous_inspired.GetFirstName] rychle následuje, ale zastaví se, když mě spatří.\n\n„[ROOT.Char.Custom2('RelationToMeAddress', previous_inspired)|U], prosím, promluvte [inspiration_owner.GetFirstNameNoTooltip] do rozumu! Snažím se [inspiration_owner.GetHerHim] pomoci, protože mám zkušenosti, které by mohly zlepšit [Select_CString(inspiration_owner.IsFemale,'její','jeho')] práci!“"
 fund_inspiration.2003.a: "Přesvědčte [inspiration_owner.GetFirstNameNoTooltip], aby poslechl [previous_inspired.GetFirstNameNoTooltip]."
 fund_inspiration.2003.b: "„Pojď, alespoň [previous_inspired.GetHerHim] vyslechněte.“"
 fund_inspiration.2003.c: "Přikázat [previous_inspired.GetFirstNameNoTooltip], aby [Select_CString(previous_inspired.IsFemale,'nechala','nechal')] [inspiration_owner.GetFirstNameNoTooltip] na pokoji."
 fund_inspiration.2003.toast_outcome.positive: "[inspiration_owner.GetFirstNameNoTooltip] naslouchá [previous_inspired.GetFirstNameNoTooltip]"
 fund_inspiration.2003.toast_outcome.refusal: "[inspiration_owner.GetFirstNameNoTooltip] odmítá naslouchat"
 fund_inspiration.2003.toast_outcome.negative: "[previous_inspired.GetFirstNameNoTooltip] poskytuje špatnou zpětnou vazbu"
 fund_inspiration.2004.t: "$fund_inspiration.title$ Nejvyšší kvalita"
 fund_inspiration.2004.desc_metal: "„Můj [ROOT.Char.GetLadyLord], podívejte se na ten kov! Nikdy jsem neviděl takovou kvalitu.“"
 fund_inspiration.2004.desc_fabric: "„Můj [ROOT.Char.GetLadyLord], podívejte se na tu tkaninu! Vlákna, hloubka barvy... Nikdy jsem neviděl takovou kvalitu.“"
 fund_inspiration.2004.desc_thread: "„Můj [ROOT.Char.GetLadyLord], podívejte se na ten nit! Nikdy jsem neviděl takovou kvalitu.“"
 fund_inspriation.2004.desc_paint: "Můj [ROOT.Char.GetLadyLord], podívejte se na ten pigment! Nikdy jsem neviděl takovou kvalitu.„"
 fund_inspiration.2004.desc_wood: "„Můj [ROOT.Char.GetLadyLord], podívejte se na to dřevo! Letokruhy, hustota... Nikdy jsem neviděl takovou kvalitu!“"
 fund_inspiration.2004.desc_paper: "„Můj [ROOT.Char.GetLadyLord], podívejte se na ten papír! Nikdy jsem neviděl takovou kvalitu.“"
 fund_inspiration.2004.desc_ink: "„Můj [ROOT.Char.GetLadyLord], podívejte se na ten inkoust! Barvy, sytost... Nikdy jsem neviděl takovou kvalitu!“"
 fund_inspiration.2004.desc_alchemy_metal: "„Můj [ROOT.Char.GetLadyLord], podívejte se na to! Nikdy jsem neviděl tak čistou rudu.“"
 fund_inspiration.2004.desc_elixirs: "„Můj [ROOT.Char.GetLadyLord], podívejte se na ty baňky! Nikdy jsem neviděl tak čiré sklo.“"
 fund_inspiration.2004.desc_fallback: "„Můj [ROOT.Char.GetLadyLord], podívejte se na to! Nikdy jsem neviděl tak kvalitní materiály.“"
 fund_inspiration.2004.desc: "\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se odtrhne od našeho tržního průvodu a zaboří se k obchodníkovi prodávajícímu žádanou věc; nadšený z [Select_CString(inspiration_owner.IsFemale,'jejímu','jeho')] nálezu.\n\n„S tím by můj projekt dosáhl nových výšin. [Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')] bych vytvořit něco skutečně #EMP skvělého#!! Prosím, můj [ROOT.Char.GetTitleAsNameNoTooltip], udělte mi tento dar.“"
 fund_inspiration.2004.a: "Váš projekt stojí za investici!"
 fund_inspiration.2004.b: "Samozřejmě, ale určitě můžeme získat přiměřenou cenu?"
 fund_inspiration.2004.b.success: "Obchodník je přesvědčen, aby snížil ceny"
 fund_inspiration.2004.b.failure: "Obchodník není přesvědčen"
 fund_inspiration.2004.c: "Rozhodně. Stráže, zabavte to, co [inspiration_owner.GetFirstNameNoTooltip] potřebuje."
 fund_inspiration.2004.d: "Myslíte si, že mám peněz nazbyt?"
 fund_inspiration.2005.t: "$fund_inspiration.title$ Nová kovárna"
 fund_inspiration.2005.desc_opening: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se ke mně přiblíží se zamračením, spáleným obočím a nějakým ohnutým kovem.\n\n„Můj [ROOT.Char.GetLadyLord], nemyslím to jako urážku, ale tahle vaše výheň..."
 fund_inspiration.2005.desc_weapon: "Stačí říct, že pokud chcete, aby [inspiration_owner.Custom('ArtifactWeaponType')] byla alespoň trochu použitelná"
 fund_inspiration.2005.desc_armor: "Stačí říct, že pokud chcete, aby [inspiration_owner.Custom('ArtifactArmorTypeLowercase')] byla alespoň trochu použitelná"
 fund_inspiration.2005.desc_smith: "Řekněme, že pokud chcete, aby [inspiration_owner.Custom('InspirationSmithType')] byla alespoň trochu elegantní"
 fund_inspiration.2005.desc_ending: "budete muset investovat do nové.„"
 fund_inspiration.2005.a: "Samozřejmě, cokoli potřebujete."
 fund_inspiration.2005.b: "Je to naprosto dobrá kovárna!"
 fund_inspiration.2006.t: "$fund_inspiration.title$ Putující učenec"
 fund_inspiration.2006.desc: "Můj [inspiration_owner.Custom('GetInspirationOwnerType')] [inspiration_owner.GetTitledFirstName] přivádí přede mě [scholar_character.GetWomanMan], celý úsměvů a chval.\n\n„Toto je [scholar_character.GetTitledFirstName], respektovaný učenec v mých kruzích.“\n\n[scholar_character.GetWomanMan] se ukloní a vypadá najednou potěšeně i stydlivě. „Prosím, není třeba toho. Jsem tu, abych vám nabídl své služby, můj [ROOT.Char.GetLadyLord], pokud si přejete.“"
 fund_inspiration.2006.a: "Ano. Prosím, pomozte [inspiration_owner.GetFirstNameNoTooltip]."
 fund_inspiration.2006.b: "Jistě. Budeš mým osobním učitelem."
 fund_inspiration.2006.c: "Tady nenajdeš domov."
 fund_inspiration.2021.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] trvá na tom, že aby bylo brnění způsobilé pro [ROOT.Char.GetTitleAsNameNoTooltip] mého věhlasu, [inspiration_owner.GetSheHe] bude potřebovat více prostředků.\n\n„[inspiration_owner.Custom('ArtifactArmorTypeLowercase')|U] není levné na výrobu, samotný materiál... Teď není čas šetřit, můj [ROOT.Char.GetLadyLord]!“"
 fund_inspiration.2021.a: "Dostaneš peníze."
 fund_inspiration.2021.b: "Nedám ti více zlata."
 fund_inspiration.2030.t: "$fund_inspiration.title$ Přátelské slovo"
 fund_inspiration.2030.desc: "Můj přítel [friend.GetTitledFirstName] mě zastaví v síni s širokým úsměvem. \n\n„Ah, #EMP ty#! jsi [ROOT.Char.GetFirstNameNoTooltip]! Právě jsem mluvil s [inspiration_owner.GetTitledFirstName]! Slyšel jsem, že [inspiration_owner.Custom('InspirationTypeDescriptionFuturePresent')] pro tebe — nemohl jsem odolat návštěvě v [inspiration_owner.GetHerHis] [inspiration_owner.Custom('GetInspirationTypeRoom')]!“ \n\n„Probral jsem s [inspiration_owner.GetHerHim], jak uspokojit tvá očekávání; myslím, že se ti výsledky budou líbit!“"
 fund_inspiration.2030.a: "„Och! Díky, [friend.GetFirstNameNoTooltip]!“"
 fund_inspiration.2040.t: "$fund_inspiration.title$ Sabotáž"
 fund_inspiration.2040.desc: "[inspiration_owner.GetTitledFirstNamePossessive] vyčerpané výkřiky přeruší tichý okamžik: „Jak mám provádět [inspiration_owner.Custom('InspirationTypeDescription')], když se mi pořád ztrácí můj [inspiration_owner.Custom('GetInspirationTypeTool')]?!“ \n\n[inspiration_owner.GetSheHe|U] ke mně spěchá. „Můj [ROOT.Char.GetLadyLord], pokaždé, když udělám nějaký pokrok, něco se pokazí! Jsem si jistý, že někdo na dvoře zasahuje do mé práce!“ \n\nTento [inspiration_owner.Custom('GetInspirationOwnerType')] si posteskne a odkráčí zpět do [inspiration_owner.GetHerHis] [inspiration_owner.Custom('GetInspirationTypeRoom')]."
 fund_inspiration.2040.a: "Jaký amatér."
 fund_inspiration.2040.b: "Platím za kvalitu, ne za drama!"
 fund_inspiration.2040.c: "[Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')] by to být... ne... #EMP [rival.GetFirstNameNoTooltip]?#!"
 fund_inspiration.2040.c.tt: "Sabotér je zatčen"
 fund_inspiration.2040.c.flavor: "Čas nastražit past!"
 fund_inspiration.2040.c.success: "Chytíte sabotéra"
 fund_inspiration.2040.c.failure: "Sabotér vám unikne"
 ep1_fund_inspiration_2040_scheme_modifier: "Potají činy"
 ep1_fund_inspiration_2040_scheme_modifier_desc: "Tato postava je zdatná v nenápadných aktivitách."
 fund_inspiration.2041.desc: "Po večeři čekám u [inspiration_owner.GetTitledFirstNamePossessive] pokojů se skupinkou stráží, sledujíc průchod, jak [ROOT.Char.Custom('FortifiedBuilding')] potemní. \n\nPrávě když uvažuji o vzdání, třesoucí se světélko tančí po chodbě, následované zahalenou siluetou.\n\nTmavá postava otevře dveře do [inspiration_owner.Custom('GetInspirationTypeRoom')] a potají zkontroluje chodbu ještě jednou, [Select_CString(rival.IsFemale,'její','jeho')] tvář osvětlená blikajícím olejovým hořákem: [rival.GetTitledFirstName]!"
 fund_inspiration.2041.a: "„A-ha! Do žaláře!“"
 fund_inspiration.2041.b: "„Vyhoďte [rival.GetHerHim] z [ROOT.Char.Custom('FortifiedBuilding')]!“"
 fund_inspiration.2041.c: "Vyřídím to po svém..."
 fund_inspiration.2050.t: "$fund_inspiration.title$ Zvážený názor"
 fund_inspiration.2050.desc: "Můj [inspiration_owner.Custom('GetInspirationOwnerType')], [inspiration_owner.GetTitledFirstName], mě informuje o svém pokroku, monotónně vysvětluje limity [inspiration_owner.Custom('GetInspirationTypeTool')] a [inspiration_owner.Custom('GetInspirationTypeStation')], zatímco mě napadají odvážné nápady pro můj [inspiration_owner.Custom('GetInspirationTypeObject')]... \n\n[inspiration_owner.Custom('GetInspirationTypeVerb')|U] možná není #EMP moje#! osobní silná stránka, ale to neznamená, že nemohu mít slovo v tom, jak jsou moje peníze utraceny!"
 fund_inspiration.2050.a: "Mám pár návrhů..."
 fund_inspiration.2050.b: "Mé zázemí mi dává jedinečný vhled."
 fund_inspiration.2050.c: "Zvažoval jste #EMP tento#! úhel pohledu?"
 fund_inspiration.2050.d: "Nechte mě nahlédnout do vašich skic..."
 fund_inspiration.2050.e: "Ne, [inspiration_owner.GetFirstNameNoTooltip] ví, co dělá."
 fund_inspiration.2050.success: "Vaše nápady fungují dobře"
 fund_inspiration.2050.nothing: "Jste ignorováni"
 fund_inspiration.2050.failure: "Vaše nápady jsou špatné"
 fund_inspiration_half_refund_tt: "Polovina vaší investice bude vrácena:"
 fund_inspiration_quarter_refund_tt: "Čtvrtina vaší investice bude vrácena:"
 fund_inspiration.2060.t: "$fund_inspiration.title$ Poklad [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
 fund_inspiration.2060.desc.religious: "Má oddanost je příkladem pro všechny, od mocného krále po ubohého žebráka, a s tím přicházejí učedníci."
 fund_inspiration.2060.desc.fame: "Mé činy jsou po celém světě vyprávěny s úctou i závistí, od cizích dvorů ke vesnickým krčmám, a s tím přicházejí stoupenci."
 fund_inspiration.2060.desc.court: "Můj okázalý dvůr je po celém světě záviděn i oslavován, všichni touží jeho splendorem soupeřit a užívat si ho, a s tím přicházejí obdivovatelé."
 fund_inspiration.2060.desc: "\n\nDnes je [Select_CString(ROOT.Char.IsFemale,'přivedena','přiveden')] [donator.GetTitledFirstName] a představen jako zástupce "
 fund_inspiration.2060.desc.brotherhood: "malé [donator.GetFaith.GetAdjectiveNoTooltip] [donator.Custom('SisterBrother')]hood z [barony_scope.GetNameNoTierNoTooltip], v [barony_scope.GetDeJureLiege.GetNameNoTier].\n\n"
 fund_inspiration.2060.desc.abbey: "malé [barony_scope.GetAdjectiveNoTooltip] [donator.GetFaith.GetAdjectiveNoTooltip] [donator.GetFaith.HouseOfWorship] v [barony_scope.GetDeJureLiege.GetNameNoTier].\n\n"
 fund_inspiration.2060.desc.mercenary: "malý [donator.GetCulture.GetNameNoTooltip] žoldnéřský oddíl z [barony_scope.GetNameNoTierNoTooltip], v [barony_scope.GetDeJureLiege.GetNameNoTier].\n\n"
 fund_inspiration.2060.desc.guild: "malá [donator.Custom('dummy_peasant_profession')] cech z [barony_scope.GetNameNoTierNoTooltip], v [barony_scope.GetDeJureLiege.GetNameNoTier].\n\n"
 fund_inspiration.2060.piety: "„Nejsvětější [ROOT.Char.GetTitleAsNameNoTooltip]!“"
 fund_inspiration.2060.saoshyant: "„Nebeský Saoshyant!“"
 fund_inspiration.2060.savior: "„Svatý zachránce!“"
 fund_inspiration.2060.saint: "„Uctívaný svatý!“"
 fund_inspiration.2060.prestige: "„Ó, skvělý [ROOT.Char.GetTitleAsNameNoTooltip]!“"
 fund_inspiration.2060.grandeur: "„Ó, bezkonkurenční [ROOT.Char.GetTitleAsNameNoTooltip]!“"
 fund_inspiration.2060.desc_outro: "Moji přátelé a já slyšíme o nádherném [inspiration_owner.Custom('GetInspirationTypeObject')] vytvářeném pro vás, a chceme přispět vašemu [inspiration_owner.Custom('GetInspirationOwnerType')]! Bylo by to pro nás velikou ctí, vaše Veličenstvo — šetřili jsme měsíce!"
 fund_inspiration.2060.a: "#EMP Já# jsem poctěn."
 fund_inspiration.2060.b.religious: "Ne, prosím, laskavý [donator.Custom('NunMonk')], ponechte si to."
 fund_inspiration.2060.b.prestige: "Ne, odmítám! Ponechte si to, příteli!"
 fund_inspiration.2060.c: "To vše?"
 ep1_fund_inspiration_2070_accept_modifier: "Přijatý dar"
 ep1_fund_inspiration_2070_accept_modifier_desc: "Toto hrabství je rádo, že mohlo mít podíl na bohatých artefaktech svého panovníka."
 ep1_fund_inspiration_2070_refuse_modifier: "Odmítnutý dar"
 ep1_fund_inspiration_2070_refuse_modifier_desc: "Toto hrabství je rozčarované, že byly jeho dary odmítnuty, ale nyní má přebytek prostředků."
 ep1_fund_inspiration_2070_mock_modifier: "Posmíváný dar"
 ep1_fund_inspiration_2070_mock_modifier_desc: "Toto hrabství je zklamané, že se jeho dary staly objektem posměchu ze strany panovníka."
 fund_inspiration.2070.t: "$fund_inspiration.title$ Chybný klenot"
 fund_inspiration.2070.desc: "Rozptýlen záležitostmi dvora jsem stále více zanedbával zprávy o mém [inspiration_owner.Custom('GetInspirationOwnerType')], [inspiration_owner.GetTitledFirstName]."
 fund_inspiration.2070.desc.stalled: "Nyní práce na mém [inspiration_owner.Custom('GetInspirationTypeObject')] zcela ustrnula a zdá se, že nejsem úplně na vině... \n\n"
 fund_inspiration.2070.desc.wasted: "Nyní byly týdny práce na mém [inspiration_owner.Custom('GetInspirationTypeObject')] promarněny, a zdá se, že nejsem úplně na vině... \n\n"
 fund_inspiration.2070.desc.lunatic: "Bylo mi řečeno o [inspiration_owner.GetFirstNamePossessiveNoTooltip] bludech a rozkolísaném chování, neustálém měnění [Select_CString(inspiration_owner.IsFemale,'jejího','jeho')] názoru a začínání od nuly, a [Select_CString(inspiration_owner.IsFemale,'její','jeho')] podivné technice [inspiration_owner.Custom('GetInspirationTypeTool')]."
 fund_inspiration.2070.desc.possessed: "Slyším o [inspiration_owner.GetFirstNamePossessiveNoTooltip] neustálých výkyvech nálad, z nichž ty nejhorší ruší veškerou [Select_CString(inspiration_owner.IsFemale,'její','jeho')] usilovnou práci v záchvatu pochybností a hněvu."
 fund_inspiration.2070.desc.depressed: "Dověděl jsem se, že [inspiration_owner.GetFirstNameNoTooltip] tráví [Select_CString(inspiration_owner.IsFemale,'její','jeho')] dny v posteli, [Select_CString(inspiration_owner.IsFemale,'pohlcena','pohlcen')] všudypřítomnou melancholií, neschopen/á čelit dni."
 fund_inspiration.2070.desc.drunkard: "Dověděl jsem se, že [inspiration_owner.GetFirstNamePossessiveNoTooltip] utrácí mé prostředky za pití [ROOT.Char.Custom('RegionalAlcoholicDrink')] a předvádění se v krčmách v [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]."
 fund_inspiration.2070.desc.hashishiyah: "Slyším o velkých množstvích hašiše, za které [inspiration_owner.GetFirstNameNoTooltip] utrácí [Select_CString(inspiration_owner.IsFemale,'její','jeho')] prostředky, než se [inspiration_owner.GetHerselfHimself] uzavře do tmy."
 fund_inspiration.2070.desc.rakish: "Dověděl jsem se o [inspiration_owner.GetFirstNamePossessiveNoTooltip] stálé nepřítomnosti v [inspiration_owner.GetHerHis] [inspiration_owner.Custom('GetInspirationTypeRoom')], údajně tráví [Select_CString(inspiration_owner.IsFemale,'její','jeho')] čas a mé prostředky v nevěstincích v [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]."
 fund_inspiration.2070.desc.profligate: "Slyšel jsem o [inspiration_owner.GetFirstNamePossessiveNoTooltip] nutkavém utrácení na trhu, kde [inspiration_owner.GetSheHe] promrhala [Select_CString(inspiration_owner.IsFemale,'její','jeho')] patronát na lehkomyslné nápady, které nikam nevedly."
 fund_inspiration.2070.desc.improvident: "Dověděl jsem se o [inspiration_owner.GetFirstNamePossessiveNoTooltip] nutkavých darech a o různých příčinách, na které [Select_CString(inspiration_owner.IsFemale,'utratila','utratil')] můj patronát místo toho, aby [Select_CString(inspiration_owner.IsFemale,'pracovala','pracoval')] na [Select_CString(inspiration_owner.IsFemale,'jejím','jeho')] díle."
 fund_inspiration.2070.desc.irritable: "Slyším o [inspiration_owner.GetFirstNamePossessiveNoTooltip] špatné povaze, která bez mého přebití odradila každého, kdo by [Select_CString(inspiration_owner.IsFemale,'mohla','mohl')] napravit [Select_CString(inspiration_owner.IsFemale,'její','jeho')] chyby a nedorozumění."
 fund_inspiration.2070.desc.comfort_eater: "Dověděl jsem se o [inspiration_owner.GetFirstNamePossessiveNoTooltip] nekonečném apetitu a o [Select_CString(inspiration_owner.IsFemale,'její','jeho')] utrácení mých prostředků za koláče a sladkosti z trhu."
 fund_inspiration.2070.desc.reclusive: "Dověděl jsem se, že [inspiration_owner.GetFirstNameNoTooltip] [Select_CString(inspiration_owner.IsFemale,'byla','byl')] sotva [Select_CString(inspiration_owner.IsFemale,'spatřena','spatřen')] od našeho posledního setkání, [Select_CString(inspiration_owner.IsFemale,'uzavřena','uzavřen')] ve svém [inspiration_owner.Custom('GetInspirationTypeRoom')], kde se bez vedení zcela [Select_CString(inspiration_owner.IsFemale,'odchýlila','odchýlil')] od dohodnutého plánu."
 fund_inspiration.2070.desc.wounded: "Slyším o [inspiration_owner.GetFirstNamePossessiveNoTooltip] otevřených ranách, které drží [inspiration_owner.GetHerHim] upoutaného k lůžku, kroutícího se v bolestech, a nacházím se v tom doufání, že [ROOT.Char.GetFaith.DeathDeityName] bude s [inspiration_owner.GetHerHim] trpělivý..."
 fund_inspiration.2070.desc.pregnant: "Dověděl jsem se o [inspiration_owner.GetFirstNamePossessiveNoTooltip] těhotenství, jehož bolesti a omezená pohyblivost zanechaly [inspiration_owner.GetHerHim] neschopným pracovat..."
 fund_inspiration.2070.desc.sick: "Slyšel jsem o [inspiration_owner.GetFirstNamePossessiveNoTooltip] vyčerpávajícím onemocnění, které [inspiration_owner.GetHerHim] často upoutává na lůžko a v žádném rozpoložení k práci."
 fund_inspiration.2070.desc_outro: "\n\nKonečně požaduji, aby [Select_CString(ROOT.Char.IsFemale,'byla','byl')] [Select_CString(inspiration_owner.IsFemale,'přivedena','přiveden')] přede mnou."
 fund_inspiration.2070.a: "Postarejte se, aby se věci vrátily na správnou kolej."
 fund_inspiration.2070.b: "Vím, že děláte, co můžete, [inspiration_owner.GetFirstNameNoTooltip]."
 fund_inspiration.2070.c: "Doufám, že to bude mistrovské dílo, a brzy!"
 fund_inspiration.2070.d: "Opusťte toto [ROOT.Char.Custom('FortifiedBuilding')] okamžitě, marnotratníku."
 fund_inspiration.2080.t: "$fund_inspiration.title$ Kreativní svoboda"
 fund_inspiration.2080.antiquarian: "To je směšné!„ [rival.GetTitledFirstName] protestuje, ‚Jako opatrovník osobní sbírky [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] mám povinnost zajistit kvalitu vaší práce!"
 fund_inspiration.2080.artificer: "To je směšné!„ [rival.GetTitledFirstName] protestuje, ‚Jsem důvěryhodný řemeslník[rival.GetWomanMan] [ROOT.Char.GetTitleAsNameNoTooltip]! [Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')] bych pomoci, kdybyste mi jen dovolili vidět vaši práci!"
 fund_inspiration.2080.desc: "\n\n„Uvidíte to, až to bude hotové!“ odsekává [inspiration_owner.GetTitledFirstName]. „Měli byste nechat [inspiration_owner.GetWomanMan] vykonávat [Select_CString(inspiration_owner.IsFemale,'její','jeho')] práci, když [inspiration_owner.Custom('InspirationTypeDescriptionFuturePresent')] hodné královské rodiny!“"
 fund_inspiration.2080.a: "[antiquarian.GetFirstNameNoTooltip] #EMP zajistí#! jeho kvalitu, [inspiration_owner.GetFirstNameNoTooltip]."
 fund_inspiration.2080.b: "Drž se svých povinností, [antiquarian.GetFirstNameNoTooltip]."
 fund_inspiration.2080.success: "[antiquarian.GetFirstNameNoTooltip] zlepšuje [inspiration_owner.GetFirstNamePossessiveNoTooltip] práci"
 fund_inspiration.2080.failure: "[antiquarian.GetFirstNameNoTooltip] dusí [inspiration_owner.GetFirstNameNoTooltip]"
 fund_inspiration.2080.c: "Je čas na nádech čerstvého vzduchu."
 fund_inspiration.2090.t: "$fund_inspiration.title$ Dotek [event_spouse.GetWifeHusband|U]"
 fund_inspiration.2090.desc: "Vidím svého [event_spouse.GetWifeHusband], [event_spouse.GetFirstName], jak dychtivě klábosí s [inspiration_owner.GetTitledFirstName], vypisuje nápady a návrhy pro [inspiration_owner.GetHerHis] [inspiration_owner.Custom('GetInspirationTypeObject')]. Můj [inspiration_owner.Custom('GetInspirationOwnerType')] sotva skrývá [Select_CString(inspiration_owner.IsFemale,'její','jeho')] pohrdání, zjevně rozhořčen vměšováním mého manžela. \n\n„...a protože jsi [inspiration_owner.Custom('InspirationTypeDescription')],“ pokračuje [event_spouse.GetSheHe], „[Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] by to stejně dobře připomínat starý [inspiration_owner.Custom('GetInspirationTypeObject')] mého praděda!“ \n\nZdá se, že část duše [inspiration_owner.GetFirstNamePossessiveNoTooltip] umírá."
 fund_inspiration.2090.a: "Poslouchejte dobře, [inspiration_owner.GetFirstNameNoTooltip] — můj [event_spouse.GetWifeHusband] musí být vyslyšen!"
 fund_inspiration.2090.b: "Pojď, drahoušku, svěřme to odborníkovi."
 fund_inspiration.2090.success: "[event_spouse.GetFirstNameNoTooltip] vylepšuje [inspiration_owner.GetFirstNamePossessiveNoTooltip] práci"
 fund_inspiration.2090.failure: "[event_spouse.GetFirstNameNoTooltip] dusí [inspiration_owner.GetFirstNameNoTooltip]"
 fund_inspiration.2100.t: "$fund_inspiration.title$ Závistivý řemeslník"
 fund_inspiration.2100.desc: "[inspiration_owner.GetTitledFirstName], můj [inspiration_owner.Custom('GetInspirationOwnerType')], sedí a zírá přes svůj pokrm na [other_inspiration_owner.GetTitledFirstName], spolusoutěžícího o můj patronát. \n\nAčkoli obvykle klidně přemítá u svého [inspiration_owner.Custom('GetInspirationTypeStation')], [inspiration_owner.GetFirstNameNoTooltip] rychle zkazí náladu, když nastane čas večeře. \n\nDnes večer se [inspiration_owner.GetSheHe] konečně zlomí:"
 fund_inspiration.2100.desc.funds: "„Proč [other_inspiration_owner.GetFirstNameNoTooltip] dostává víc peněz než já? '[other_inspiration_owner.Custom('InspirationTypeDescriptionFuturePresent')|U]'! A co z toho?“"
 fund_inspiration.2100.desc.rival: "„Nemohu uvěřit, že vyčerpáváš své truhly pro toho [other_inspiration_owner.Custom('InsultNoun')], [other_inspiration_owner.GetFirstNameNoTooltip], dosáhl bys lepších výsledků u farmářů na gongy!“"
 fund_inspiration.2100.desc.fallback: "„[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bys se zbavit téhle mrtvé váhy, můj pane; [other_inspiration_owner.GetFirstNameNoTooltip] nezná správný konec [other_inspiration_owner.Custom('GetInspirationTypeTool')], natož jak se pohybovat v [other_inspiration_owner.Custom('GetInspirationTypeRoom')].“"
 fund_inspiration.2100.a: "Tvoje práce je mi cenná, [inspiration_owner.GetFirstNameNoTooltip]."
 fund_inspiration.2100.b: "Doplním tvé financování, jsi spokojen?"
 fund_inspiration.2100.c: "No tak, co se děje?"
 fund_inspiration.2100.d: "Přestaň s tím bláznovstvím."
 fund_inspiration.2100.c.leave: "[inspiration_owner.GetFirstNameNoTooltip] opouští [Select_CString(inspiration_owner.IsFemale,'její','jeho')] práci"
 fund_inspiration.2100.c.worse: "[inspiration_owner.GetFirstNameNoTooltip] ztrácí motivaci"
 fund_inspiration.2100.success: "Urovnali jste spory"
 fund_inspiration.2100.failure: "Zhoršili jste spor"
 fund_inspiration.2110.t: "$fund_inspiration.title$ Spoluznalec"
 fund_inspiration.2110.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('generous_vassal'))], [generous_vassal.GetTitledFirstName], mě oslovuje: „Dobře se potkáváme, [generous_vassal.Custom2('RelationToMeShort', ROOT.Char)]! Slyšel jsem o tvém patronátu [inspiration_owner.GetFirstName] toho [inspiration_owner.Custom('GetInspirationOwnerType')]. Říkají, že [inspiration_owner.GetSheHe] je [inspiration_owner.Custom('InspirationTypeDescription')] hodný [ROOT.Char.GetTitleAsNameNoTooltip].“ \n\nProsím, vezmi si toto a dej to [inspiration_owner.GetHerHim]."
 fund_inspiration.2110.desc.part.2: "Nechtěl bych propásnout příležitost přispět k vytvoření mistrovského díla!\n\n"
 fund_inspiration.2110.desc.part.2.research: "Nechtěl bych propásnout šanci zúčastnit se nového vědeckého objevu!\n\n"
 fund_inspiration.2110.desc.generous: "[generous_vassal.GetFirstNameNoTooltip] má pověst velkorysého a zdá se, že [Select_CString(generous_vassal.IsFemale,'našla','našel')] nové uplatnění pro [Select_CString(generous_vassal.IsFemale,'její','jeho')] utrácení..."
 fund_inspiration.2110.desc.dweeb: "[generous_vassal.GetFirstNameNoTooltip] má zájmy v mnoha oblastech, mezi nimi cenné artefakty a myslitele, kteří je vytvářejí..."
 fund_inspiration.2110.desc.dweeb.research: "[generous_vassal.GetFirstNameNoTooltip] má zájmy v mnoha oblastech, mezi nimi technologie a myslitele, kteří je jako první vymyslí..."
 fund_inspiration.2110.desc.friend: "[generous_vassal.GetFirstNameNoTooltip] se usmívá vřele, pytel mincí visí z [Select_CString(generous_vassal.IsFemale,'její','jeho')] ruky."
 fund_inspiration.2110.desc.rich: "Chudák [generous_vassal.GetFirstNameNoTooltip] musí mít více peněz, než [generous_vassal.GetSheHe] ví, co s nimi dělat..."
 fund_inspiration.2110.a: "Jak velkorysé!"
 fund_inspiration.2110.b: "Och, já #EMP zajistím#, že [inspiration_owner.GetSheHe] to dostane!"
 fund_inspiration.2110.b.flavor: "To by se mohlo hodit..."
 fund_inspiration.2110.c: "Ne, prosím, ponechte si to!"
 fund_inspiration.2120.t: "$fund_inspiration.title$ Pozdě do noci"
 fund_inspiration.2120.desc: "Čas mizí v [inspiration_owner.GetFirstNamePossessive] [inspiration_owner.Custom('GetInspirationTypeRoom')], pijeme [ROOT.Char.Custom('RegionalAlcoholicDrink')] a nadšeně rozebíráme [inspiration_owner.Custom('GetInspirationTypeObject')], které [inspiration_owner.GetSheHe] pro mě [inspiration_owner.Custom('GetInspirationTypeVerb')]. Zdá se mi to, nebo je tu nevyslovitelné... napětí? \n\n"
 fund_inspiration.2120.desc.me: "Mysl se mi toulá, vnímám jemné zvláštnosti těla [inspiration_owner.GetHerHis], [Select_CString(inspiration_owner.IsFemale,'její','jeho')] smějící se rty... Položím ruku na [inspiration_owner.GetHersHis]. [inspiration_owner.Custom('GetInspirationTypeTool')] spadne z [Select_CString(inspiration_owner.IsFemale,'jejích','jeho')] třesoucích se prstů, když se toužebně dívám do těch krásných očí. \n\n"
 fund_inspiration.2120.desc.them: "Hodina se protáhla, když můj [inspiration_owner.Custom('GetInspirationOwnerType')] odloží [inspiration_owner.GetHerHis] [inspiration_owner.Custom('GetInspirationTypeTool')], napije se ze svého poháru a usměje se na mě s náznakem. Je... [inspiration_owner.GetSheHe]... ? \n\n"
 fund_inspiration.2120.desc.them_into_alot: "[inspiration_owner.GetSheHe|U] skočí do mých paží jako zvíře a pošle [inspiration_owner.Custom('GetInspirationTypeStation')] přes místnost."
 fund_inspiration.2120.desc.them_into: "V [inspiration_owner.GetHerHim] nacházím stejnou zoufalou vášeň: [inspiration_owner.GetSheHe] se vrhá do mých teplých náručí..."
 fund_inspiration.2120.desc.me_zealous_homosexuality: "To je špatné, při [ROOT.Char.GetFaith.HighGodName], nemohu podlehnout těmto hříšným pokušením..."
 fund_inspiration.2120.desc.me_zealous_adultery: "Ne, [ROOT.Char.GetFaith.ReligiousText] je jasný! Cizoložství je hřích! Je to pokušení [ROOT.Char.GetFaith.DevilName]!"
 fund_inspiration.2120.desc.me_unattracted: "Najednou se [inspiration_owner.GetFirstNameNoTooltip] přiblíží a obejme mě! Moje paže rychle zastaví [inspiration_owner.GetHerHim], možná příliš silně... [inspiration_owner.GetHerHis|U] teplo okamžitě ochladne a ztvrdne do zmatení a strachu."
 fund_inspiration.2120.desc.me_chaste: "[inspiration_owner.GetSheHe|U] vykročí kupředu a vtáhne mě do [Select_CString(inspiration_owner.IsFemale,'její','jeho')] teplé náruče. Mé tělo říká ano, ale mé srdce křičí ne..."
 fund_inspiration.2120.desc.me_into: "Nemohu popřít, že se ve mně něco probouzí, srdce mi zrychlí a nacházím se, jak držím [inspiration_owner.GetHerHim] v náručí, zatímco [inspiration_owner.GetSheHe] mě na oplátku objímá... co se to #EMP děje#?!"
 fund_inspiration.2120.desc.me_into_alot: "Nemůže být pochyb o [Select_CString(inspiration_owner.IsFemale,'jejích','jeho')] úmyslech! Sotva sebe ovládám, když odhrnu [inspiration_owner.GetHerHis] [inspiration_owner.Custom('GetInspirationTypeStation')] stranou."
 fund_inspiration.2120.a: "Pojď sem, miláčku."
 fund_inspiration.2120.e: "Oh... [inspiration_owner.GetFirstNameNoTooltip]..."
 fund_inspiration.2120.f.chaste: "To není pro mě..."
 fund_inspiration.2120.f: "Musím... odejít!"
 fund_inspiration.2120.h: "Rychle, ke dveřím!"
 fund_inspiration.2120.i: "Oh! Nejsem..."
 fund_inspiration.2120.j: "Ne! [ROOT.Char.GetFaith.ReligiousText] zakazuje tento svazek..."
 fund_inspiration.2120.k.me: "Ne! Nemohu... cizoložství je hřích!"
 fund_inspiration.2120.k.them: "Ne, nemohu svádět [inspiration_owner.GetHerHim] k cizoložství..."
 fund_inspiration.2120.l: "Počkej... jak se #EMP opovažuješ#!?!"
 fund_inspiration.2120.m: "Pusť mě, zkažený hříšníku!"
 fund_inspiration.2120.leave_flavor: "Rychle odcházíte"
 fund_inspiration.2130.t: "$fund_inspiration.title$ Přelétavá pobídka"
 fund_inspiration.2130.desc: "Narazím na velmi vážně vyhlížejícího [inspiration_owner.GetTitledFirstName], mého [inspiration_owner.Custom('GetInspirationOwnerType')], doufaje, že mi nepřinese špatné zprávy o skvělém [inspiration_owner.Custom('GetInspirationTypeObject')], které by mi [Select_CString(inspiration_owner.IsFemale,'měla','měl')] brzy předložit. \n\n„Ach, tady jsi, můj pane... [Select_CString(ROOT.Char.IsFemale,'narazila','narazil')] jsem na zeď ve své práci — nic vážného! Mé nápady uvízly, jak tlak narůstá!“ nervózně se zasměje [inspiration_owner.GetSheHe|U]. \n\n„Potřebuji jen nějakou... inspiraci! Všemohoucí [ROOT.Char.GetTitleAsNameNoTooltip], nemohl byste mít nějaké... předchozí příklady, které bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] prozkoumat?“"
 fund_inspiration.2130.a.library: "Do knihovny!"
 fund_inspiration.2130.a.armory: "Do zbrojnice!"
 fund_inspiration.2130.a.hall: "Do velké síně!"
 fund_inspiration.2130.a.tt: "Kvalita nebo pokrok [inspiration_owner.GetFirstNamePossessiveNoTooltip] [Concept('inspiration','inspirace')|E] mohou být zlepšeny" # todo: CONCEPT CASE
 fund_inspiration.2130.a.flavor: "Určitě najdeme něco, co pomůže!"
 fund_inspiration.2130.b: "Vím, co potřebujete!"
 fund_inspiration.2130.b.great: "[inspiration_owner.GetFirstNamePossessiveNoTooltip] múza roste"
 fund_inspiration.2130.b.good: "[inspiration_owner.GetFirstNamePossessiveNoTooltip] múza se vrací"
 fund_inspiration.2130.b.nothing: "[inspiration_owner.GetFirstNamePossessiveNoTooltip] múza spí"
 fund_inspiration.2130.b.bad: "[inspiration_owner.GetFirstNamePossessiveNoTooltip] múza utíká"
 fund_inspiration.2130.b.terrible: "[inspiration_owner.GetFirstNamePossessiveNoTooltip] múza umírá"
 fund_inspiration.2130.b.flavor: "To bude zábava!"
 fund_inspiration.2130.c: "Ah, mám právě ten elixír."
 fund_inspiration.2130.c.dead: "[inspiration_owner.GetFirstNamePossessiveNoTooltip] padne mrtvý"
 fund_inspiration.2130.c.flavor: "Kde je ta červená lahvička..."
 fund_inspiration.2130.d: "Skutečná inspirace přichází zevnitř."
 fund_inspiration.2131.t: "$fund_inspiration.title$ Pryč se starým"
 fund_inspiration.2131.desc_library_unused: "S konečným nádechem se [inspiration_owner.GetTitledFirstName] a já rozhrneme do mé prašné knihovny — místnosti, kam málokdy mám důvod vstoupit.\n\n"
 fund_inspiration.2131.desc_library: "Vedu [inspiration_owner.GetTitledFirstName] do mé dobře udržované knihovny a ukazuji některé pozoruhodné svazky a vystavené lektvary.\n\n"
 fund_inspiration.2131.desc_armory_unused: "Vystrašený voják uvede [inspiration_owner.GetTitledFirstName] a mě do nepořádku mé zbrojnice — sem nikdy nesestupuji!\n\n"
 fund_inspiration.2131.desc_armory: "[inspiration_owner.GetTitledFirstName] a já jsme uvedeni do mé rozsáhlé zbrojnice, kde poukazuji na některé z mých oblíbených předmětů a narážím na jejich příběhy.\n\n"
 fund_inspiration.2131.desc_great_hall_low: "Když dám [inspiration_owner.GetTitledFirstName] rychlou prohlídku kuriozit, napadne mě, že má velká síň není tak velkolepá, jak by mohla být.\n\n"
 fund_inspiration.2131.desc_great_hall: "Provádím [inspiration_owner.GetTitledFirstName] po mé velké síni a hrdě ukazuji její luxus a různé vystavené bohatství."
 fund_inspiration.2131.desc_antiquarian: "[second.GetTitledFirstName] trval na tom, že přijde, a sleduje z dálky, kroutíce se pokaždé, když je předmět špatně manipulován nebo chybně identifikován.\n\n"
 fund_inspiration.2131.artificer: "[second.GetTitledFirstName] se šťastně připojuje, vždy zaujat tvůrčími procesy [Select_CString(second.IsFemale,'jejích','jeho')] vrstevníků.\n\n"
 fund_inspiration.2131.desc_equipped: "Ten [inspiration_owner.Custom('GetInspirationOwnerType')] se zastaví, jako u vytržení, a zkoumá můj [artifact_1.GetName]. „Ach, velmi pěkné, můj pane... Mohu... Mohu použít jeho [inspiration_owner.Custom('GetInspirationMaterialType')]?“"
 fund_inspiration.2131.desc_unequipped: "Právě v skladišti se [inspiration_owner.Custom('GetInspirationOwnerType')] náhle zastaví a pozorně prohlíží můj [artifact_1.GetName]. „Ano... [inspiration_owner.Custom('GetInspirationMaterialType')] by mělo stačit... Chcete... tohle stále, můj pane?“"
 fund_inspiration.2131.desc_fallback: "[inspiration_owner.GetSheHe|U] udělá pár kol po místnosti, než se ke mně vrátí [Select_CString(ROOT.Char.IsFemale,'zarmoucena','zarmoucen')]. „Můj pane, tady není nic, co by mě zaujalo... není tu ještě něco jiného?“"
 fund_inspiration.2131.a: "Ten [artifact_1.GetNameNoTooltip]? Velmi dobře..."
 fund_inspiration.2131.b: "Co třeba můj [artifact_2.GetNameNoTooltip]?"
 fund_inspiration.2131.c: "Určitě tu někde leží nějaké harampádí..."
 fund_inspiration.2131.c.good: "Najdete kvalitní [inspiration_owner.Custom('GetInspirationMaterialType')]"
 fund_inspiration.2131.c.nothing: "Nic nenajdete"
 fund_inspiration.2131.c.bad: "Najdete špatné [inspiration_owner.Custom('GetInspirationMaterialType')]"
 fund_inspiration.2131.d: "Jen se díváš."
 fund_inspiration.2131.d.great: "[inspiration_owner.GetNameNoTooltip] narazí na zlato"
 fund_inspiration.2131.d.good: "[inspiration_owner.GetNameNoTooltip] najde [inspiration_owner.Custom('GetInspirationMaterialType')]"
 fund_inspiration.2131.d.nothing: "[inspiration_owner.GetNameNoTooltip] nic nenajde"
 fund_inspiration.2131.d.bad: "[inspiration_owner.GetNameNoTooltip] najde špatné [inspiration_owner.Custom('GetInspirationMaterialType')]"
 fund_inspiration.2131.d.terrible: "[inspiration_owner.GetNameNoTooltip] najde hrozné [inspiration_owner.Custom('GetInspirationMaterialType')]"
 fund_inspiration.2131.e: "[second.GetFirstNameNoTooltip]! Máš nějaké nápady?"
 fund_inspiration.2131.f: "Jaká ztráta času!"
 fund_inspiration.3001.t: "$fund_inspiration.title$ Bezbožné psaní"
 fund_inspiration.3001.desc_opening: "[court_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vběhne do místnosti držíc hromadu papírů, následován zaskočeným [inspiration_owner.GetTitledFirstName], který se snaží vytrhnout ty spisy z rukou [court_chaplain.GetHerHis].\n\n"
 fund_inspiration.3001.desc_witch: "Tento [inspiration_owner.GetWomanMan] píše o [ROOT.Char.GetFaith.WitchGodName]. #EMP [ROOT.Char.GetFaith.WitchGodName]#!!"
 fund_inspiration.3001.desc_cannibal: "Tento [inspiration_owner.GetWomanMan] píše o #EMP pojídání lidského masa#!!"
 fund_inspiration.3001.desc_torturer: "Tento [inspiration_owner.GetWomanMan] píše o nevýslovných, sadistických činech!"
 fund_inspiration.3001.desc_lustful: "Tento [inspiration_owner.GetWomanMan] píše o nevýslovných, zvrhlých činech!"
 fund_inspiration.3001.desc_other: "Tento [inspiration_owner.GetWomanMan] píše o bezbožných věcech!"
 fund_inspiration.3001.desc_ending: "S ilustracemi! Mohu jen předpokládat, že o tom nevíte, můj [ROOT.Char.GetLadyLord].„\n\n[inspiration_owner.GetTitledFirstNameNoTooltip] se uchechtne a znovu se vrhne po papírech, ale můj [court_chaplain.Custom('CouncilPosition')] se vyhne.\n\n„Ale nyní, když je tento odporný psavec odhalen, jistě knihu zasvětíte [ROOT.Char.GetFaith.HighGodName], jak je správné.“"
 fund_inspiration.3001.a: "Absolutně; [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')] jsem tušení, že [inspiration_owner.GetSheHe] píše o takových věcech."
 fund_inspiration.3001.a_tt: "[inspiration_owner.GetShortUIName] bude psát o víře místo o [inspiration_owner.Custom('ArtifactBookSubject')]"
 fund_inspiration.3001.b: "Víš co by bylo správné? Nechat [inspiration_owner.GetHerHim] na pokoji!"
 fund_inspiration.3001.c: "Ty ilustrace vypadají fádně... Vezmi toto zlato na koupi nového inkoustu."
 fund_inspiration.3011.t: "$fund_inspiration.title$ Válečná témata"
 fund_inspiration.3011.desc_opening_1: "Najdu [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] obklopeného svitky a rukopisy, zuřivě listující stránky.\n\n"
 fund_inspiration.3011.desc_opening_2: "Najdu [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] obklopeného svitky a rukopisy, s hlavou v [Select_CString(inspiration_owner.IsFemale,'její','jeho')] rukou.\n\n"
 fund_inspiration.3011.desc_opening_3: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně přistoupí s [Select_CString(inspiration_owner.IsFemale,'jejími','jeho')] pažemi plnými svitků a rukopisů.\n\n"
 fund_inspiration.3011.desc: "„Můj [ROOT.Char.GetLadyLord]! Je tolik oblastí válčení, které si zaslouží pozornost. Strategie, složení jednotek, samotný boj... Ani nevím, kde začít!“"
 fund_inspiration.3011.a: "Chci, aby kniha byla poučná nebo užitečná pro armádu."
 fund_inspiration.3011.a.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] se ve [Select_CString(inspiration_owner.IsFemale,'její','jeho')] psaní zaměří na témata jako strategie a sestavy jednotek"
 fund_inspiration.3011.b: "Možná něco narážejícího na ušlechtilejší stránky tohoto tématu."
 fund_inspiration.3011.b.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] se ve [Select_CString(inspiration_owner.IsFemale,'její','jeho')] psaní zaměří na témata jako rytířství a statečnost"
 fund_inspiration.3011.d: "Po jakém tématu vaše múza touží?"
 fund_inspiration.3011.d.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] si svobodně zvolí téma knihy"
 fund_inspiration.3012.t: "$fund_inspiration.title$ Témata diplomacie"
 fund_inspiration.3012.desc: "„Můj [ROOT.Char.GetLadyLord]! Je tolik oblastí diplomacie, které stojí za pozornost. Dvorní chování, vztahy, #EMP poezie#!... Ani nevím, kde začít!“"
 fund_inspiration.3012.a: "Možná něco, co se týká života na dvoře."
 fund_inspiration.3012.a.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] se ve [Select_CString(inspiration_owner.IsFemale,'její','jeho')] psaní zaměří na témata jako aliance a výmluvnost"
 fund_inspiration.3012.b: "Chci, aby byla kniha zábavná!"
 fund_inspiration.3012.b.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] se ve [Select_CString(inspiration_owner.IsFemale,'její','jeho')] psaní zaměří na témata jako dobrodružství a zábava"
 fund_inspiration.3013.t: "$fund_inspiration.title$ Odborná témata"
 fund_inspiration.3013.desc: "„Můj [ROOT.Char.GetLadyLord]! Je tolik oblastí, které si zaslouží pozornost. Náboženství, vzdělání... Nemluvě o umění samotného psaní!“"
 fund_inspiration.3013.a: "Toto dílo by mělo sloužit [ROOT.Char.GetFaith.HighGodName]!"
 fund_inspiration.3013.a.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] se ve [Select_CString(inspiration_owner.IsFemale,'její','jeho')] psaní zaměří na témata jako teologie a modlitby"
 fund_inspiration.3013.b: "Chci, aby kniha byla vzdělávací, nebo aspoň zábavná!"
 fund_inspiration.3013.b.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] se ve [Select_CString(inspiration_owner.IsFemale,'její','jeho')] psaní zaměří na témata jako dějiny a poezie"
 fund_inspiration.3014.t: "$fund_inspiration.title$ Témata správy"
 fund_inspiration.3014.desc: "„Můj [ROOT.Char.GetLadyLord]! Je tolik oblastí správy, které si zaslouží pozornost. Zákony, obchod, #EMP peníze#!... Ani nevím, kde začít!“"
 fund_inspiration.3014.a: "Zaměřte se na věci spojené s vládou nad říší."
 fund_inspiration.3014.a.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] se ve [Select_CString(inspiration_owner.IsFemale,'její','jeho')] psaní zaměří na témata jako právo a správa"
 fund_inspiration.3014.b: "Zajímá mě rozvoj!"
 fund_inspiration.3014.b.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] se ve [Select_CString(inspiration_owner.IsFemale,'její','jeho')] psaní zaměří na témata jako stavby a zdanění"
 fund_inspiration.3015.t: "$fund_inspiration.title$ Témata intrik"
 fund_inspiration.3015.desc: "„Můj [ROOT.Char.GetLadyLord]! Je tolik oblastí intrik, které stojí za pozornost. Intriky, svádění, manipulace... Ani nevím, kde začít!“"
 fund_inspiration.3015.a: "Chci být o krok napřed před #EMP všemi#!!"
 fund_inspiration.3015.a.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] se ve [Select_CString(inspiration_owner.IsFemale,'její','jeho')] psaní zaměří na témata jako intriky a manipulace"
 fund_inspiration.3015.b_men: "Chci, aby muži padali k mým nohám!"
 fund_inspiration.3015.b_women: "Chci, aby ženy padaly k mým nohám!"
 fund_inspiration.3015.b_both: "Chci, aby po mně všichni toužili!"
 fund_inspiration.3015.b_none: "Chci ovládnout umění svádění."
 fund_inspiration.3015.b.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] se ve [Select_CString(inspiration_owner.IsFemale,'její','jeho')] psaní zaměří na témata jako chtíč a umění svádění"
 fund_inspiration.3030.t: "$fund_inspiration.title$ Ochlazující nenávist"
 fund_inspiration.3030.desc_opening: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě pozval k diskusi o tématu knihy, kterou pro mě [inspiration_owner.GetSheHe] píše.\n\n"
 fund_inspiration.3030.desc: "„Nemohu si nevšimnout, že animozita mezi vámi a [prev_nemesis.Custom2('YourCharacterIntroduction', ROOT.Char)] ochládá. Chcete tuto knihu stále věnovat nenávisti, kterou cítíte vůči [prev_nemesis.GetHerHim]?“"
 fund_inspiration.3030.desc_dead: "„Nyní, když [prev_nemesis.Custom2('YourCharacterIntroduction', ROOT.Char)] již není mezi živými, chcete tuto knihu stále věnovat nenávisti, kterou jste k [prev_nemesis.GetHerHim] cítili?“"
 fund_inspiration.3030.a: "Nenávist, kterou cítím, se ještě příliš neochladila."
 fund_inspiration.3030.a.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] pokračuje v psaní o vaší nenávisti k [prev_nemesis.GetTitledFirstName]"
 fund_inspiration.3030.b: "[prev_nemesis.GetSheHe|U] nestojí za tu námahu."
 fund_inspiration.3031.t: "$fund_inspiration.title$ Uvadající láska"
 fund_inspiration.3031.desc: "„Nemohu si nevšimnout, že [prev_soulmate.Custom2('YourCharacterIntroduction', ROOT.Char)] už není ve vašich #EMP nejvyšších# přízních, můj [ROOT.Char.GetLadyLord]. Chcete tuto knihu stále věnovat lásce, kterou cítíte k [prev_soulmate.GetHerHim]?“"
 fund_inspiration.3031.desc_dead: "„Bolest ztráty [prev_soulmate.Custom2('YourCharacterIntroduction', ROOT.Char)] musí být stále čerstvá... Chcete tuto knihu stále věnovat lásce, kterou jste k [prev_soulmate.GetHerHim] cítili?“"
 fund_inspiration.3031.a: "Co je láska bez touhy a ztráty?"
 fund_inspiration.3031.a.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] pokračuje v psaní o lásce, kterou jste sdíleli s [prev_soulmate.GetTitledFirstName]"
 fund_inspiration.3031.b: "[prev_soulmate.GetSheHe|U] nestojí za tu námahu."
 fund_inspiration.4001.t: "$fund_inspiration.title$ Osnova a útko"
 fund_inspiration.4001.desc: "„[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi #EMP zničil#! můj nový oděv!“\n\n[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vtrhne do místnosti v doprovodu tkalce. Kus oděvu, který [courtier.GetSheHe] drží v [Select_CString(courtier.IsFemale,'její','jeho')] rukou, je tak strašně roztrhaný, že nemohu poznat, čím původně [Select_CString(ROOT.Char.IsFemale,'byla','byl')].\n\n„Přeháníš! Jen jsem zkoumal vzor tkaniny, je to důležité pro můj projekt.“"
 fund_inspiration.4001.a: "Přeháníš to, zkoumej si klidně své vlastní oblečení, pokud musíš!"
 fund_inspiration.4001.b: "Když [inspiration_owner.GetSheHe] říká, že je to nutné, pak je to nutné."
 fund_inspiration.4010.t: "$fund_inspiration.title$ Kompozice v červené, modré a [ROOT.Char.GetTitleAsNameNoTooltip|U]"
 fund_inspiration.4010.desc: "Zajdu do dílny svého tkalce zkontrolovat, jak postupuje můj gobelín. Uvnitř je pár dvořanů. Všichni zkoumají stěny, ruce složené za zády. Předložené tapisérie jsou podivné barevné plochy. Jedna má tady a tam neohrabané skvrny. Jedna je bílá s pár čtverci. Jedna má točící se zamotané čáry. Co to má být za umění?\n\n[artistic_courtier_1.GetTitledFirstNameNoTooltip] ukáže na část, která vypadá jako skvrna. „Nesvědčí tohle špinavě hnědé proti bílé opravdu o násilí vrozeném člověku?“\n\n[artistic_courtier_2.GetTitledFirstNameNoTooltip] přikývne. „Myslím, že to ukazuje [inspiration_owner.GetTitledFirstNameNoTooltip] zuřícího proti [Select_CString(inspiration_owner.IsFemale,'její','jeho')] dětství - zdá se, že to má tvar [Select_CString(inspiration_owner.IsFemale,'její','jeho')] matky.“"
 fund_inspiration.4010.a: "Přikývněte a pochvalte umělce"
 fund_inspiration.4010.b: "„Odporné! Musím jít teď podívat na nějaké tradiční umění.“"
 fund_inspiration.4010.b.tt: "Vaše investice je vrácena a dílo zrušeno"
 fund_inspiration.4010.c: "„Tohle [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] udělat [child.GetTitledFirstNameNoTooltip]!“„"
 fund_inspiration.5011.desc: "„Nastal čas, abych vyrazil na své dobrodružství, můj [ROOT.Char.GetTitleTierName].“ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se ukloní, jak nejlépe může pod tíhou těžkých pytlů.\n\n„Před odjezdem mi prosím řekněte, chcete, abych během cesty něco konkrétního sledoval?“"
 fund_inspiration.5011.a: "Přineste mi něco z exotického zvířete, lebku nebo kůži."
 fund_inspiration.5011.b: "Chci drobnost z materiálu, který zde nelze najít."
 fund_inspiration.5011.c: "Gobelín nebo umělecké dílo, které ve mně vyvolá touhu být tam."
 fund_inspiration.5011.d: "Důvěřuji vašemu instinktu, že mi přinesete něco skvělého."
 fund_inspiration.5011.e: "Chci vlastnit něco skutečně jedinečného!"
 fund_inspiration.5021.t: "$fund_inspiration.title$ Změna směru"
 fund_inspiration.5021.desc: "Předveden je cestovatel, který tvrdí, že je zaměstnán u [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)], nese zprávu od dobrodruha.\n\n„Nebojte se, můj velký [ROOT.Char.GetLadyLord], [inspiration_owner.GetTitledFirstNameNoTooltip] je v dobrém zdraví. Přináším zprávu o možnosti financovat ještě větší dobrodružství! Víte, [inspiration_owner.GetTitledFirstNameNoTooltip] někde zabloudil a nyní se nachází poblíž [adventuring_location.GetNameNoTier].“\n\n[inspiration_owner.GetFirstNamePossessiveNoTooltip] cestovní společník rozvine špinavou mapu, aby mi ukázal, kde skončili. „[inspiration_owner.GetSheHe|U] má dost prostředků, aby se dostal do [inspiration_owner.Custom('InspirationAdventureDestination')], jak bylo plánováno, ale navrhuje, že s dodatečným financováním může vypátrat místní pověru a přivést domů skvělý artefakt!“"
 fund_inspiration.5021.a: "To je absurdní! Nehodlám financovat jejich #EMP sobecký výlet#!!"
 fund_inspiration.5021.a.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] se vrací k tomu, co si původně stanovil."
 fund_inspiration.5021.b: "Život je dobrodružství, prozkoumejte tu oblast kvůli artefaktům!"
 fund_inspiration.5021.b.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] prozkoumává [adventuring_location.GetNameNoTierNoTooltip]."
 fund_inspiration.6001.t: "Step a sedlo cvalem projíždějí mým srdcem,"
 fund_inspiration.6001.desc: "Jezdím měsíce v kuse. Mé pozadí se nikdy nezotaví! Získal jsem značnou chuť na kvašené kobylí mléko a noci pod širým nebem.\n\nS tímto kurýrem posílám vyřezávanou hlavičku Morin Khuur — ozdobnou koňskou hlavičku umístěnou na vrchu nástrojů. Možná ji nějak využijete."
 fund_inspiration.6001.a: "Uložím si to!"
 fund_inspiration.6001.b: "Pošlete to dvornímu hudebníkovi."
 fund_inspiration.6002.t: "Moje výprava po Indii pokračuje!"
 fund_inspiration.6002.desc: "Jsem téměř oslněn všemi drahokamy, které mi dvory, které navštěvuji, ukazují. Zjišťuji, že toužím po špíně otevřené cesty.\n\nPoslal jsem kurýra s obzvlášť nevkusným darem, který mi dali — ozdobou na prstenu ve tvaru tygří hlavy, s drahokamy místo očí. Viděli jste někdy něco tak kýčovitého?"
 fund_inspiration.6002.a: "Líbí se mi to, je jeho ztráta."
 fund_inspiration.6002.b: "Strašné! Rozložte to a prodejte drahokamy."
 fund_inspiration.6003.t: "Sním o poušti,"
 fund_inspiration.6003.desc: "Můj pane, má cesta do Afriky je v průběhu a připojil jsem se ke karavaně velbloudů, která přetíná zemi.\n\nPosílám vám šperk, který mi věnoval jeden z mých spolucestujících — nejjemnější náhrdelník pokrytý korálky z pštrosí skořápky. Předpokládám, že jste ještě neviděl pštrosa."
 fund_inspiration.6003.a: "Skvělý nález! Sám si ho obleču."
 fund_inspiration.6003.b: "Dám to [event_spouse.GetTitledFirstNameNoTooltip]."
 fund_inspiration.6004.t: "Ach, být poutníkem,"
 fund_inspiration.6004.desc: "Má cesta Středním východem obnášela hlavně boj s četnými pouličními prodejci na poutních cestách.\n\nČasto, abych příliš nezdržoval své pátrání, poddávám se a koupím jeden z jejich drobných cetek. Poslal jsem kurýra, který nese tenhle kýč vaším směrem. Možná vám poskytne nějaké pobavení."
 fund_inspiration.6004.a: "K čemu je dobrodruh, který jde po vyšlapané cestě?"
 fund_inspiration.6004.b: "To jsou docela pěkné cetky..."
 fund_inspiration.6005.t: "Moje dobrodružství jsou promoklá,"
 fund_inspiration.6005.desc: "Můj pane, v mých dobrodružstvích jsem zatím nalezl pár otřepaných relikvií, které jsem poslal s tímto kurýrem, ale nejsem si jistý, co ještě mohu objevit.\n\nEvropané jsou nejzapáchavější stvoření, která jsem potkal. Jako dítě jsem snil o zelených a příjemných loukách, ale jsem přesvědčen, že polovina tohoto světa je z bláta. Pokud jste vlídný panovník, pošlete zprávu, abyste mě svolal zpět."
 fund_inspiration.6005.a: "Tohle není dovolená! Pokračujte v pátrání!"
 fund_inspiration.6005.b: "Chudák, myslím, že tyto odměny postačí."
 fund_inspiration.6005.b.tt: "Umožníte [inspiration_owner.GetTitledFirstName] vrátit se domů"
 fund_inspiration.6006.t: "Pozdravy z Anatolie,"
 fund_inspiration.6006.desc: "Mé cesty po Malé Asii ve mně zanechaly značnou chuť na jehněčí, jogurt a lilek, a poslal jsem s tímto kurýrem i několik receptů.\n\nJeden z mých hostitelů mi daroval zlatou sponu zdobenou mořským koníkem, kterou vám také posílám. Jsem přesvědčen, že mé cesty přinesou časem další zázraky."
 fund_inspiration.6006.a: "Rozkažte našim kuchařům okamžitě připravit tato jídla!"
 fund_inspiration.6006.b: "[inspiration_owner.GetSheHe|U] se zdá mít na této výpravě příliš mnoho zábavy..."
 fund_inspiration.6100.t: "$fund_inspiration.title$ Vzorový vládce"
 fund_inspiration.6100.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se rozradostněně snaží upoutat mou pozornost. „Můj [ROOT.Char.GetLadyLord], dokončil jsem miniaturní prototyp truhly, kterou jste si objednal, včetně funkčního zámku.“\n\n[inspiration_owner.GetSheHe|U] natáhne dlaň a na ní spočívá maličká truhlička, zdobená zlatou linkou a s klíčkem malým jako zrníčko.\n\n„Uvnitř je drahokam, vyzkoušejte si ho.“ Když [inspiration_owner.GetSheHe] předává truhličku, klíč mezi [Select_CString(inspiration_owner.IsFemale,'její','jeho')] prsty vypadne a odletí. Ať [inspiration_owner.GetSheHe] škrábe, kde může, nikde není."
 fund_inspiration.6100.a: "Ukončete tuto frašku, rozbijte truhličku a vraťte můj kámen!"
 fund_inspiration.6100.b: "Je to stále půvabné, myslím, že si to nechám."
 fund_inspiration.6101.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] podá maličkou krabičku s nejjemnějšími, vlasově tenkými rytinami. „Prototyp vaší poslední zakázky. Nechci, aby to vyšlo na zmar. Mohli bychom tomu najít použití.“\n\n[antiquarian.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se oživí. „Můžeme do něj vložit relikvii naší doby a někam ji zakopat — vytvořit památku, kterou budou budoucí děti odhalovat!“"
 fund_inspiration.6101.a: "Uložím do něj miniaturní portrét sebe."
 fund_inspiration.6101.b: "Napíšu malou báseň a zapečetím ji uvnitř."
 fund_inspiration.6101.c: "Raději si to nechám pro sebe."
 fund_inspiration.6102.desc: "Chystám se jít spát, když mě propálí ostrá bolest v chodidle.\n\nPři prohlídce zjišťuji, že do tkáně mé podrážky je vtesaná miniaturní soška, se svými vlastními nožičkami vyčnívajícími ven.\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se ztrapněně dívá z nejbližších dveří. „Omlouvám se, to je prototyp vaší poslední zakázky. Musel jsem ho upustit.“"
 fund_inspiration.6102.a: "„Vytrhněte to a odstraňte mi to z očí!“"
 fund_inspiration.6102.b: "„[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] by se na to podívat lékař.“"
 fund_inspiration.6102.c: "Vytrhněte to a schovejte si to do kapsy."
 fund_inspiration.6102.cure_toast: "Miniatura bezpečně vytažena"
 fund_inspiration.6102.failure_toast: "Tvrdohlavá miniatura"
 fund_inspiration.6102.failure_toast_desc: "Kus paže se ztratil v hlubinách vašeho chodidla"
 fund_inspiration.6103.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se ukloní. „Rád bych obdržel kritiku skříňky, kterou právě pro vás vyrábím, můj [ROOT.Char.GetLadyLord].“\n\n[inspiration_owner.GetSheHe|U] mě vede do své dílny, kde s obavami stojí jen prašná, ošuntělá skříň.\n\n„To ale není ten kus.“ [inspiration_owner.GetSheHe|U] otevírá roztrhanou skříň a uvnitř není nic než maličký model skříňky — ozdobný, osázený kameny a pozlacený, ale vysoký asi jako můj prst. „Co o tom soudíte?“"
 fund_inspiration.6103.a: "Pro vaše dobro snad tohle bude jen prototyp."
 fund_inspiration.6103.b: "Ó, je dokonalé! Zbožňuji to!"
 fund_inspiration.6104.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi přinese malou krabičku a s úsměvem mi ji podává.\n\nKdyž dárky otevírám, očekávám šperk, prsten nebo řezbu, ale ku mému překvapení je uvnitř miniaturní trůn, tak malý, že na něm může sedět jen myš.\n\n„Prototyp vašeho nového sedadla, můj [ROOT.Char.GetLadyLord]. Myslel jsem, že by vás to pobavilo.“"
 fund_inspiration.6104.a: "Jak půvabné! Nechám si to!"
 fund_inspiration.6104.b: "To je hezké, ale pokračujte v projektu."
 fund_inspiration.6104.c: "Jsem #EMP příliš# dospělý na hraní si s hračkami."
 fund_inspiration.6105.desc: "Hrdě nesu krabičku s miniaturním nábytkem přes [ROOT.Char.Custom('FortifiedBuilding')], přemýšlejíc, kde bych je nejlépe vystavil, když narazím na [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\nKdyž [inspiration_owner.GetSheHe] uvidí obsah krabice, utře si slzu z [Select_CString(inspiration_owner.IsFemale,'její','jeho')] oka. „[ROOT.Char.GetWomanMan] vkusu, pojďte se mnou.“\n\n[inspiration_owner.GetSheHe|U] mě zavede do své dílny a vytáhne tajnou bednu. Uvnitř jsou desítky kousků miniaturní scénografie, figurek a terénu. „Vymyslel jsem hru — fantazijní obléhací bitvu. Připojíte se ke mně?“"
 fund_inspiration.6105.a: "Myslel jsem, že se mě nikdy nezeptáte!"
 fund_inspiration.6105.b: "Eh, možná jindy."
 fund_inspiration.6200.t: "$fund_inspiration.title$ Kompozice v červené, modré a [ROOT.Char.GetTitleAsNameNoTooltip|U]"
 fund_inspiration.6200.desc: "Zajdu do dílny svého tkalce zkontrolovat, jak postupuje můj gobelín. Uvnitř je pár dvořanů. Všichni zkoumají stěny, ruce složené za zády. Předložené tapisérie jsou podivné barevné plochy. Jedna má tady a tam neohrabané skvrny. Jedna je bílá s pár čtverci. Jedna má točící se zamotané čáry. Co to má být za umění?\n\n[artistic_courtier_1.GetTitledFirstName] ukáže na část, která vypadá jako skvrna. „Nesvědčí tohle špinavě hnědé proti bílé opravdu o násilí vrozeném člověku?“\n\n[artistic_courtier_2.GetTitledFirstNameNoTooltip] přikývne. „Myslím, že to ukazuje [ROOT.Char.GetTitledFirstNameNoTooltip] zuřícího proti [Select_CString(ROOT.Char.IsFemale,'její','jeho')] dětství - zdá se, že to má tvar [Select_CString(ROOT.Char.IsFemale,'její','jeho')] matky.“"
 fund_inspiration.6200.a: "Přikývněte a pochvalte umělce"
 fund_inspiration.6200.b: "„Odporné! Musím jít teď podívat na nějaké tradiční umění.“"
 fund_inspiration.6200.b.tt: "Vaše investice je vrácena a dílo zrušeno"
 fund_inspiration.6200.c: "„Tohle [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] udělat [child.GetTitledFirstNameNoTooltip]!“„"
 fund_inspiration.6300.t: "$fund_inspiration.title$ Nešťastná sloka"
 fund_inspiration.6300.intro: "Náhodou narazím na [inspiration_owner.GetTitledFirstName] u [Select_CString(inspiration_owner.IsFemale,'jejího','jeho')] stolu, zírajícího z okna s mnoha rozmazanými návrhy před [inspiration_owner.GetHerHim].\n\n"
 fund_inspiration.6300.no_relationship_desc: "„Představa, že by mě někdo miloval, je nemožná. Ani jednou jsem nešeptal slov citu někomu, kdo by mi to oplatil.“\n\n„Proto jsem pro vás nepsal — jen počítám večery od té doby, co jsem s někým spal, a zoufám si.“"
 fund_inspiration.6300.no_love_desc: "„Přestože mě obvykle nic nerozproudí více než psané slovo, zarážející je, že mě v současnosti vůbec nenapadají žádné chtivé pocity.“\n\n„Moje omluva, můj [ROOT.Char.GetLadyLord], nemohu psát o lásce, múza mě opustila.“"
 fund_inspiration.6300.homosexual_desc: "„Ach, můj [ROOT.Char.GetLadyLord]. Ač jsem strávil mnoho hodin snahou složit romantické dílo hodné vašeho mecenátu, zjistil jsem, že nedělám nic jiného než pláču nad pergamenem.“\n\n„Žádáte mě o nemožné. Má láska je taková, že musí zůstat nepsaná.“"
 fund_inspiration.6300.a: "Skvěle! Nasměrujte ten hořkosladký hněv!"
 fund_inspiration.6300.a.failure: "Přimějete [inspiration_owner.GetShortUIName], aby pohrdal láskou."
 fund_inspiration.6300.a.success: "Přesvědčíte [inspiration_owner.GetShortUIName], aby psal o lásce."
 fund_inspiration.6300.b: "No, mám půl hodiny navíc."
 fund_inspiration.6300.c: "Nemožné! Jak může svět nevidět kouzlo vaší výřečnosti?"
 fund_inspiration.6300.d: "Ale je to láska, která má být prožita."
 fund_inspiration.6300.e: "Pište svou pravdu, žehnám každé múze."
 fund_inspiration.6300.f: "Vymyslete něco! Všichni, kdo píší o lásce, jsou podvodníci."
 fund_inspiration.6301.t: "$fund_inspiration.title$ Můj drahý společníku,"
 fund_inspiration.6301.lover_desc: "V noci, kdy jste mi poručil psát od srdce, zjistil jsem, že umím psát pouze o vás. Nechte mě zahrát padoucha, pokud naše láska je považována za hříšnou."
 fund_inspiration.6301.friend_desc: "Nikdy jsem necítil, že by mi slova tak plynula jako poté, co jste mi poručil napsat příběh lásky, jak ji prožívám."
 fund_inspiration.6301.female_desc: "\n\nZde je báseň o čarodějnici, která se zamiluje do královny, jež se ztratí v hájku u své chalupy."
 fund_inspiration.6301.male_desc: "\n\nZde je balada o princi, který každou noc pozoruje hvězdy se svou milovanou archivářkou na vrcholu knihovní věže a sní o tom, že se budou milovat na nebesích."
 fund_inspiration.6301.crime_desc: "Jaký krásný zločin."
 fund_inspiration.6301.a: "Budu si toho vážit, ale uchovám to v tajnosti."
 fund_inspiration.6301.b: "Sakra na svět, zařídím veřejné čtení!"
 fund_inspiration.6400.t: "$fund_inspiration.title$ Putování hospodami"
 fund_inspiration.6400.desc: "Při návštěvě krčmy v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] zahlédnu jednoho z hostů v centru pozornosti.\n\n[inspiration_owner.GetSheHe|U] je ošlehanější než ostatní hosté a voní, jako by tam seděl věčnost. K mému zděšení rozpoznám svého dobrodruha, [inspiration_owner.GetTitledFirstName], který se zdá, že po měsících financování nedostal z rodné země!\n\n„Na další cestě přeplavu Rudé moře jedním lokem!“ [inspiration_owner.GetSheHe] hned zhltne celý pohár červeného vína a v hostinci zavládne jásot."
 fund_inspiration.6400.a: "Zmizni odsud a vyraž na cestu!"
 fund_inspiration.6400.b: "Šarlatán! Nezaplatím ti už žádné další pití!"
 fund_inspiration.6400.a.success: "Přesvědčíte dobrodruha, aby se [inspiration_owner.GetHerselfHimself] vzpamatoval"
 fund_inspiration.6400.a.success_continue: "Dobrodružství pokračuje!"
 fund_inspiration.6400.a.failure: "Dobrodruh uteče se zlatem!"
 fund_inspiration.6500.t: "$fund_inspiration.title$ Přinášení hudby do džungle"
 fund_inspiration.6500.introduction: "Dostanu poselství od mého dobrodruha, slovy tak vyzdobenými, že v mé mysli vidím [inspiration_owner.GetHerHim]."
 fund_inspiration.6500.desc: "\n\n'[Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] jsem v džungli na nohou. Volání ptáků mi tluče v lebce a považuji to za děsivý žalozpěv. Několik místních mi řeklo, že to považují za nejpříjemnější hudbu. Zjevně nikdy neslyšeli díla [court_musician.GetTitledFirstNameNoTooltip].\n\n'[Select_CString(ROOT.Char.IsFemale,'Zkusila','Zkusil')] jsem zahrát jednu z [Select_CString(court_musician.IsFemale,'její','jeho')] melodií na jejich rákosovou píšťalu a místní mě vyhnali z města a pořezali mě otrávenou čepelí. I když jsem přežil, pomyslel jsem si: „když zemřu tím, že přinesu komorní hudbu do džungle, tak ať.“'"
 fund_inspiration.6500.action: "\n\n'Můžete si pravděpodobně představit, co jsem udělal dál...'"
 fund_inspiration.6500.a: "Začal jste zpívat a získal jste jejich přízeň!"
 fund_inspiration.6500.b: "Uprchnul jste do civilizovanějších krajů."
 fund_inspiration.6500.c: "Velká kočkovitá šelma vyskočila mezi vás a vaše útočníky!"
 fund_inspiration.6500.a.success: "Dobrodruh okouzlí obyvatele džungle"
 fund_inspiration.6500.a.failure: "Dobrodruh obtěžuje obyvatele džungle"
 fund_inspiration.6500.b.success: "Dobrodruh uteče."
 fund_inspiration.6500.b.failure: "Dobrodruh neuteče dost rychle"
 fund_inspiration.6500.c.tt: "Dobrodruh pomůže zahnat levharta"
 fund_inspiration.6500.c.tt_failure: "Dobrodruh je [Select_CString(ROOT.Char.IsFemale,'zraněna','zraněn')] při pokusu o útěk"
 fund_inspiration.6501.t: "$fund_inspiration.title$ Cesta přes pevninu"
 fund_inspiration.6501.desc: "\n\n'Pluli jsme po řekách kolem klikatých kopců. Po období sucha nám místní řekli, že řeka, po které jsme se plavili, před naším člunem vysychá.\n\n'Místo abychom to vzdali nebo se vrátili, pokusili jsme se o nemožné. Přikázal jsem posádce postavit kladkový systém a začali jsme člun přesouvat po souši směrem k další řece. Plul po moři trávy a sedmikrásek.'"
 fund_inspiration.6501.a: "Doufám, že jste se vrátili a omezili ztráty."
 fund_inspiration.6501.b: "Loď to téměř přežila cestu."
 fund_inspiration.6501.b.success: "Dobrodruh táhne loď nahoru po útesu"
 fund_inspiration.6501.b.failure: "Dobrodruh uvízl a opravuje rozbitou loď"
 fund_inspiration.6501.c: "Místní se slitovali a dali vám novou loď se slevou."
 fund_inspiration.6502.t: "$fund_inspiration.title$ Pálčivá žízeň"
 fund_inspiration.6502.desc: "\n\n'Nejsem na poušti, jsem v kraji snů. Rozdíl mezi probuzením a spánkem zmizel. Můj průvodce mi říká, že halucinují to, co si nejvíce přeji. Ráj, bazén vody třpytící se jako diamanty, posetý poklady na březích.\n\n'Místo toho, můj [ROOT.Char.GetLadyLord], vše, co tu vidím, jsi ty. Navždy jeden pískový břeh předem. Zlákat mě, abych pokračoval. A lámá mě vědomí, že každý krok směrem k té oparu mě od tebe vzdalí.'"
 fund_inspiration.6502.a: "Ach, i mě svírá žízeň, a to nejsem na poušti."
 fund_inspiration.6502.b: "Možná zvážím tvoji pozornost, pokud přineseš velkou odměnu."
 fund_inspiration.6502.c: "Svedu to na horko a tato slova spálím."
 fund_inspiration.6503.t: "$fund_inspiration.title$ Pontské šepoty"
 fund_inspiration.6503.desc: "\n\n'Vstoupil jsem do kurganu, starého pohřebního mohylového hrobu z doby Skythů. Stovky dávno zemřelých koní, vypreparované, uchované a přibitřené ke stěnám, aby stály vzpřímeně, každý ve své komůrce. [Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] to chlév pro zatracení, ztracený v čase.\n\n'Vědom si své povinnosti hledat vědomosti pro naše království, uvažoval jsem o ukradení relikvie z hrobu, když můj průvodce nedával pozor, abych ji [Select_CString(ROOT.Char.IsFemale,'přinesla','přinesl')] tobě.'"
 fund_inspiration.6503.a: "[Select_CString(ROOT.Char.IsFemale,'Schovala','Schoval')] jste jednu z ozdob do kapsy."
 fund_inspiration.6503.b: "[Select_CString(ROOT.Char.IsFemale,'Přinesla','Přinesl')] jste jedno ze sedel koní, pro naše studium."
 fund_inspiration.6503.c: "[Select_CString(ROOT.Char.IsFemale,'Neměla','Neměl')] jste odvahu rušit mrtvé."
 fund_inspiration.6504.t: "$fund_inspiration.title$ [inspiration_owner.GetLadyLord|U] [inspiration_owner.GetFirstNamePossessiveNoTooltip] Milenec"
 fund_inspiration.6504.desc: "\n\n'Eh, můj [ROOT.Char.GetLadyLord], na svých cestách jsem se [Select_CString(ROOT.Char.IsFemale,'zdržela','zdržel')] na statku, o nějž se [Select_CString(ROOT.Char.IsFemale,'starala','staral')] [adventurer_lover.GetTitledFirstName].'"
 fund_inspiration.6504.pregnant: "\n\n'Na statku jsem [Select_CString(ROOT.Char.IsFemale,'vykovala','vykoval')] pěkný artefakt! Konkrétně dítě! I když to může být obtíž, nemohu vzít [adventurer_lover.GetTitledFirstName] na své cesty v [Select_CString(adventurer_lover.IsFemale,'jejího','jeho')] stavu. [adventurer_lover.GetSheHe|U] má málo majetku a doufám, že bychom se o [adventurer_lover.GetHerHim] mohli postarat na dvoře.'"
 fund_inspiration.6504.female_lover: "\n\n'Po tolika lunách sám na cestách mi [adventurer_lover.GetSheHe] rozbuší srdce jako fantastická bytost. Nemohu si pomoci, myslím, že toto je místo, kam mě má výprava vést.'"
 fund_inspiration.6504.male_lover_homosexual: "\n\n'Daleko od očí dvora jsem [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] ležet v náruči muže po noci za nocí.'"
 fund_inspiration.6504.male_lover: "\n\n'Jsem zamilován a dal bych týden hlídání [adventurer_lover.GetHerHim] před jakoukoliv hostinou na dvoře.'"
 fund_inspiration.6504.lover_ultimatum: "Nemohu odejít od tohoto statku s vědomím, že už možná nikdy nepolíbím [adventurer_lover.GetHerHim]. Buď [adventurer_lover.GetSheHe] přijde k tobě a připojí se k našemu dvoru, nebo zde má cesta končí.'"
 fund_inspiration.6504.a: "Zmizni, pokud urážíš mou patronaci."
 fund_inspiration.6504.a.tt: "[inspiration_owner.GetTitledFirstName] zůstane na statku."
 fund_inspiration.6504.b: "Povolím to, ale neobviňuj mě ze skandálu."
 fund_inspiration.6504.c: "Dítě si nezaslouží chudobu."
 fund_inspiration.6504.d: "SELŠTÍ? Na mém dvoře? NIKDY."
 fund_inspiration.6505.t: "$fund_inspiration.title$ Plážová kapitola"
 fund_inspiration.6505.desc: "\n\n'Ve vypětí dechu v pouštním horku jsem objevil čisté vody, jenž mě přiměly svléknout se úplně. Místo rozhořčení se průvodce tiše zasmál a začal mé obrysy skicovat na stránku. Naši spolucestovatelé mávali palmami, aby mě ochladili, v činu věrné služby.\n\n'Strávili jsme mnoho šťastných hodin šploucháním. V příští vesnici jsem najal tkadlenici, aby zachytila moment ráje, a posílám ti vzpomínku s tímto poslem.'"
 fund_inspiration.6505.a: "Mé oči! Mé oči!"
 fund_inspiration.6505.a_blind: "Vypíchl bych si oči, kdybych už nebyl slepý."
 fund_inspiration.6505.a_one_eyed: "Mé oko! Mé oko!"
 fund_inspiration.6505.b: "Pověsím to v ložnici!"
 fund_inspiration.6505.c: "Celý dvůr se o tomto exotickém rozptýlení musí dozvědět!"
 fund_inspiration.6505.d: "Ach, posvátný obraz pro náš lid!"
 fund_inspiration.6506.t: "$fund_inspiration.title$ Není to přehnaná bída"
 fund_inspiration.6506.introduction: "Přichází zpráva od mého dobrodruha. Je tak zapečená v blátě, že ji musím rozříznout nožem.\n\n"
 fund_inspiration.6506.desc: "'Můj [ROOT.Char.GetLadyLord], jsem v mokřadě a všechny roky výuky mě na to nepřipravily. Brodím se mokrou bahnitou hmotou dnem i nocí. Minulou noc jsem snil o objetí milence a probudil jsem se a [Select_CString(ROOT.Char.IsFemale,'našla','našel')] místo jazyka mloka u mých rtů.\n\n'Zajímalo by mě, zda je malá šance, že bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] jet do mírně #EMP civilizovanější#! oblasti. Jako důkaz, jak nechutné toto místo je, poslal jsem vám spawn žáby, snesený v mém promočeném botě v zavařovací sklenici spolu se svou zprávou.'"
 fund_inspiration.6506.a: "To formuje charakter!"
 fund_inspiration.6506.b: "Pokud chceš jít do mírnějších krajů, můžeš."
 fund_inspiration.6507.t: "$fund_inspiration.title$ Ne, včely!"
 fund_inspiration.6507.introduction: "Dostanu zprávu od mého dobrodruha — řádky popsané smíšené s kapkou krve."
 fund_inspiration.6507.desc: "\n\n'Louky a pastviny, jimiž se toulám, jsou nádherně posety zvěří. Když jsem [Select_CString(ROOT.Char.IsFemale,'sesedla','sesedl')] z koně, skláněl se k květu, vrhl se nade mě stín [grumpy_liege.GetTitledFirstName], vazala těchto zemí, a [grumpy_liege.GetWomanMan], který si o tobě nemyslí příliš dobře.\n\n'„Mládě [ROOT.Char.GetTitledFirstNameNoTooltip] nebude sát v mých lukách.“[Select_CString(grumpy_liege.IsFemale,'Sesedla','Sesedl')] a [Select_CString(grumpy_liege.IsFemale,'rozkázala','rozkázal')] strážím mě zatknout. Přivedli truhlu obsahující úl, který mi přitlačili na hlavu! [Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] jsem #EMP poštípaný včelami#!! V oku mi pořád zůstává žihadlo!''"
 fund_inspiration.6507.a: "Pošlu [grumpy_liege.GetHerHim] několik obvinění!"
 fund_inspiration.6507.b: "Za to si vyžádám [Select_CString(grumpy_liege.IsFemale,'její','jeho')] hlavu!"
 fund_inspiration.6507.c: "Jizvy budou vypadat docela lichotivě!"
 fund_inspiration.6508.t: "$fund_inspiration.title$ Architekti přírody"
 fund_inspiration.6508.introduction: "Dostanu zprávu od mého dobrodruha, který pobýval v chladných krajích tajgy.\n\n"
 fund_inspiration.6508.desc: "'Strávil jsem nějaký čas v nejlepší společnosti, jakou si cestovatel [inspiration_owner.GetWomanMan] může přát — kolonie bobrů! S tímto poslem posílám knihu náčrtů struktur, které používají k chytání ryb ve vodách! Ó, být polovodním hlodavcem!'\n\n"
 fund_inspiration.6508.architect_desc: "'Jsem si jist, že alespoň [court_architect.GetTitledFirstName] by se od zvířete chytřejšího než [court_architect.GetHerHim] [Select_CString(court_architect.IsFemale,'mohla','mohl')] něco naučit.'"
 fund_inspiration.6508.a: "Pečlivě to prozkoumám."
 fund_inspiration.6508.b: "Opravdu, [court_architect.GetTitledFirstNameNoTooltip] by se [Select_CString(court_architect.IsFemale,'mohla','mohl')] něco naučit."
 fund_inspiration.6508.b.tt: "[court_architect.GetTitledFirstNamePossessive] schopnost jako architekta mírně roste"
 fund_inspiration.6508.c: "Jaká #EMP roztomilá#! zvířátka! [child.GetFirstName] by [Select_CString(child.IsFemale,'měla','měl')] mít tuto knihu!"
 fund_inspiration.6508.d: "Dobrá práce, pošlu peníze na prodloužení tvých cest."
 fund_inspiration.6509.t: "$fund_inspiration.title$ Šepoty o bestii"
 fund_inspiration.6509.intro_desc: "Dostanu zprávu od mého dobrodruha, který pluje po záplavových pláních na voru."
 fund_inspiration.6509.desc: "\n\n'Můj [ROOT.Char.GetLadyLord], byli jsme na cestách pronásledováni tvorem tak hrozným, že se sotva odvážím o něm psát.\n\n'Krokodýl dorůstá až padesáti kroků délky a je to příšera, která spolkla jednoho z našich mul. Je to štíhlé zvíře, se tělem ve tvaru šípu, s zobákem vpředu a chrastícími ocasními částmi vzadu. Hroty a boule ho pokrývající jsou jedovaté na dotek.'"
 fund_inspiration.6509.a: "Ohromíme návštěvníky tapisérií s tímto monstrem!"
 fund_inspiration.6509.b: "Ó, to je příliš strašné, aby to byla pravda!"
 fund_inspiration.6509.c: "Vím, co je krokodýl, hlupáčku!"
 fund_inspiration.6510.t: "$fund_inspiration.title$ Muži v punčochách"
 fund_inspiration.6510.intro_desc: "Dostanu zprávu od mého dobrodruha, který se plížil lesním opadem."
 fund_inspiration.6510.desc: "\n\n'Omlouvám se, můj [ROOT.Char.GetLadyLord], ale v lese jsem [Select_CString(ROOT.Char.IsFemale,'narazila','narazil')] na bandu vigilante, která okrádá takové, jako jste vy. Protiváze autoritářské pěstě [enemy_liege.GetTitledFirstName], který tu vládne, okrádají šlechtu přepady. Mé srdce se sklání k této rozházené skupince a nemyslím si, že se vrátím na dvůr.\n\n'Jejich punčochy také vypadají mnohem lépe než móda na vašem dvoře a hodí se mi.'"
 fund_inspiration.6510.a: "Možná bys mi [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] pomoci dělat více pro chudé?"
 fund_inspiration.6510.b: "Pokud se nevrátíš, pošlu na tebe vraha!"
 fund_inspiration.6510.b.toast_outcome.positive: "[inspiration_owner.GetTitledFirstNameNoTooltip] je zastrašen"
 fund_inspiration.6510.b.toast_outcome.positive.continue: "Dobrodružství pokračuje"
 fund_inspiration.6510.b.toast_outcome.positive.flee: "[inspiration_owner.GetSheHe|U] uprchne z tvého dvora."
 fund_inspiration.6510.b.toast_outcome.refusal: "[inspiration_owner.GetTitledFirstNameNoTooltip] není ohromen"
 fund_inspiration.6510.c: "Užívej si svůj život bídy!"
 fund_inspiration.6511.t: "$fund_inspiration.title$ Poutník v moři sněhu"
 fund_inspiration.6511.intro_desc: "Dostanu zprávu od mého dobrodruha a po několika prvních řádcích vím, že to bude poslední."
 fund_inspiration.6511.old_age: "\n\n'Mé stáří mi přineslo mnoho divů za můj čas. Když jsem vystoupal na zasněžený vrchol hory, z níž nyní tyto řádky píšu, [Select_CString(ROOT.Char.IsFemale,'byla','byl')] jsem jediným živým tvorem nad mořem mlhy, věděl jsem, že už nikdy neuvidím takovou krásu po zbytek svých dnů.\n\n'Nebylo mým přáním vrátit se z hory, a nyní můžete předpokládat, že jsem jedním s ledem. Neplač, neboť jinak jsem jednat nemohl. Má pouť do [inspiration_owner.GetFaith.PositiveAfterLife] je jistá jako ledovec.'"
 fund_inspiration.6511.poor_health: "\n\n'Jsem nyní ničemný, trhaný tvor, nemocný a zrádný svému tělu. Přesto v tomto stavu jsem nemyslel, že bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] spatřit takový výjev — zasněžené království mraků a mlhy z vrcholu hory. Taková zvadlá květina si tuto krásu nezaslouží.\n\n'Vědom si, že můj čas může být na dosah, rozhodl jsem se nechat se ponechat ledu. Možná mě chlad uchová v nějakém pozůstatku mého já.'"
 fund_inspiration.6511.winter: "\n\n'[Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] jsem na vrcholku hory v kruté době. Každá sněhová vločka na mé pohryzené tváři byla smíchem zimy, ten zlosyn. Viděl jsem bitvy, ale žádné násilí tak vznešené jako tento souboj proti krve v mém vlastním těle. Má dominující ruka ještě dobře píše tato slova, ale ta druhá už ne tak.\n\n'Věz, že jsem [Select_CString(ROOT.Char.IsFemale,'byla','byl')] opravdu šťasten, že svět vidím takto, a cítím, že ti, kteří zůstanou, jsou chudší než já.'"
 fund_inspiration.6511.a: "Větší romantik nebezpečí tu nikdy nebyl!"
 fund_inspiration.6512.t: "$fund_inspiration.title$ [ROOT.Char.GetTitleAsNameNoTooltip|U] z Hory"
 fund_inspiration.6512.intro_desc: "Dostanu dopis od mého dobrodruha a je pokryt rezavým prachem z [Select_CString(inspiration_owner.IsFemale,'její','jeho')] cesty přes pouštní hory."
 fund_inspiration.6512.desc: "\n\n'Vystoupal jsem na další horu a na těchto tisících plochých náhorních deskách jsem nenašel známku, že by jiný [inspiration_owner.GetWomanMan] kdy šlapal po tomto kameni. Dnes jsem se odvážil na nejvyšší, jaký jsem kdy zdolal.\n\n'Myslím, že skála volá po hrdém jménu, aby uctila tento čin, dohlížený nejvzácnějším [ROOT.Char.GetTitleAsNameNoTooltip] v kosmu.'"
 fund_inspiration.6512.a: "Jsem si jistý, že místní mu už jméno dali."
 fund_inspiration.6512.b: "'Rocky' — hloupé jméno!"
 fund_inspiration.6512.c: "'[ROOT.Char.GetFaith.WarGodNamePossessive] Meč'"
 fund_inspiration.6512.d: "'[ROOT.Char.GetFaith.FateGodNamePossessive] Rukavice'"
 fund_inspiration.6512.e: "Po mé drahé, [lover.GetFirstNameNoTooltip]."
 fund_inspiration.6512.f: "[ROOT.Char.GetFirstNamePossessiveNoTooltip] Zub!"
 fund_inspiration.6512.g: "[ROOT.Char.GetFirstNamePossessiveNoTooltip] Hůl!"
 fund_inspiration.6512.h: "[rival.GetFirstNamePossessiveNoTooltip] Zkáza!"
 fund_inspiration.6512.i: "Zapomeň na to — přines mi nějaké kameny!"
 fund_inspiration.7001.t: "$fund_inspiration.title$ Jméno k zapamatování"
 fund_inspiration.7001.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně přistupuje s přemýšlivým výrazem. „Je pro tebe někdo zvláštní, můj [ROOT.Char.GetLadyLord]?“ \n\n[inspiration_owner.GetSheHe|U] musí číst mou podrážděnost z mého výrazu, protože [inspiration_owner.GetSheHe] pokračuje: „Myslím, je někdo, komu bys chtěl věnovat zakázaný artefakt? Vychází dobře, ale smysluplný nápis by mu dodal osobnější ráz!“"
 fund_inspiration.7001.a: "Mé milované [dedication_a.GetFirstNameNoTooltip]!"
 fund_inspiration.7001.b: "Na památku [dedication_b.GetFirstName]..."
 fund_inspiration.7001.c: "Pouze [ROOT.Char.GetFaith.HighGodNameAlternate] mě vede!"
 fund_inspiration.7001.d: "Není potřeba věnování."
