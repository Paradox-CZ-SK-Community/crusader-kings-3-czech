l_polish:
 game_concept_royal_court: "Královský dvůr"
 game_concept_royal_courts: "Královské dvory"
 game_concept_royal_court_desc: "Význační [Concept('rulers','vládci')|E] jsou dostatečně proslulí na to, aby si vydržovali královský dvůr, který jim zpřístupňuje rozmanité bonusy a příležitosti.\n\nKdyž se [Concept('ruler','vládcem')|E] s vládou typu [GetGovernment( 'feudal_government' ).GetName], [GetGovernment( 'clan_government' ).GetName] nebo [GetGovernment( 'tribal_government' ).GetName] stane [Concept('king','králem')|E] nebo [Concept('emperor','císařem')|E], získá přístup ke svému královskému dvoru.\n\nKaždý královský dvůr má [Concept('court_grandeur_level','úroveň velkoleposti dvora')|E], která poskytuje výhody podle toho, jak proslulý královský dvůr je a jaký má [Concept('court_type','typ dvora')|E].\n\nU tvého královského dvora se mohou objevit prosebníci, [Concept('vassals','vazalové')|E] a [Concept('courtiers','dvořané')|E], nebo můžeš [Concept('hold_court','uspořádat audienci')|E] a pozvat kohokoli z [Concept('realm','panství')|E], aby přednesl své stížnosti.\n\nKrálovský dvůr rovněž umožňuje vládci vystavovat [Concept('court_artifacts','dvorské artefakty')|E] a u královského dvora se mohou objevit [Concept('inspired','inspirovaní')|E] [Concept('guests','hosté')|E], kteří nabídnou vytvoření nových [Concept('artifacts','artefaktů')|E].\n\nKdyž zemřeš, tvůj [Concept('player_heir','hráčský dědic')|E] zdědí tvůj královský dvůr." # todo: CONCEPT CASE
 game_concept_court_grandeur_level: "Úroveň velkoleposti dvora"
 game_concept_court_grandeur_levels: "Úrovně velkoleposti dvora"
 game_concept_grandeur_level: "Úroveň velkoleposti"
 game_concept_grandeur_levels: "Úrovně velkoleposti"
 game_concept_court_grandeur_level_desc: "Úroveň velkoleposti [Concept('royal_court','královského dvora')|E] poskytuje bonusy jeho majiteli a odemyká se s rostoucí [Concept('court_grandeur_value','hodnotou velkoleposti dvora')|E].\n\nKromě účinků jednotlivých úrovní se od velkých [Concept('realms','panství')|E] očekává, že dosáhnou vyšších úrovní velkoleposti. To je známo jako [Concept('court_grandeur_expectations','očekávaná velkolepost dvora')|E]."
 game_concept_court_grandeur: "Velkolepost dvora"
 game_concept_grandeur: "Velkolepost"
 game_concept_court_grandeur_value: "Hodnota velkoleposti dvora"
 game_concept_court_grandeur_desc: "Hodnota velkoleposti dvora [Concept('royal_court','Královský dvůr')|E] ukazuje, jak proslulý dvůr je, a s jejím růstem odemyká novou [Concept('court_grandeur_levels','úroveň velkoleposti dvora')|E].\n\nHodnota se pohybuje od 0 do 100 a časem se ustálí na své základní hodnotě. Základní hodnota je ovlivněna věcmi, jako jsou [Concept('dynasty_perks','dynastické odkazy')|E], tím, kolik utrácíš za [Concept('court_amenities','dvorský komfort')|E], a tím, zda máš nějaké skvostné [Concept('court_artifacts','dvorské artefakty')|E].\n\nPři [Concept('succession','nástupnictví')|E] se část velkoleposti ztratí." # todo: CONCEPT CASE
 game_concept_court_amenities: "Dvorský komfort"
 game_concept_court_amenity: "Dvorský komfort"
 game_concept_amenities: "Komfort"
 game_concept_court_amenities_desc: "Dvorský komfort představuje stanovenou životní úroveň u [Concept('royal_court','královského dvora')|E].\n\nUrčuje ji [Concept('ruler','vládce')|E] [Concept('royal_court','královský dvůr')|E], přičemž každá kategorie (odívání, strava, ubytování a služebnictvo) má několik úrovní. Vyšší výdaje na komfort obvykle přinášejí vyšší [Concept('court_grandeur_value','hodnotu velkoleposti dvora')|E].\n\nVládcům s vládou typu [GetGovernment( 'tribal_government' ).GetName] je znemožněno volit vyšší úrovně komfortu." # todo: CONCEPT CASE
 game_concept_court_grandeur_expectations: "Očekávaná velkolepost dvora"
 game_concept_court_grandeur_expectation: "Očekávaná velkolepost dvora"
 game_concept_grandeur_expectations: "Očekávaná velkolepost"
 game_concept_court_grandeur_expectations_desc: "Očekává se od tebe, že budeš mít [Concept('court_grandeur_level','úroveň velkoleposti dvora')|E] dostatečně vysokou vzhledem ke své [Concept('realm_size','velikosti panství')|E].\n\nJak se tvé [Concept('realm','panstvím')|E] rozrůstá, tvoji poddaní i širý svět očekávají, že tvůj [Concept('royal_court','královský dvůr')|E] bude stejně velkolepý.\n\nPokud očekávání nesplníš, uplatní se různé postihy. Pokud je naopak překonáš, získáš různé bonusy.\n\nOčekávaná velkolepost vládců s vládou typu [GetGovernment( 'tribal_government' ).GetName] je vždy stejná jako jejich současná velkolepost." # todo: CONCEPT CASE
 game_concept_hold_court: "$activity_hold_court$"
 game_concept_holding_court: "Pořádání audience"
 game_concept_hold_court_desc: "[Concept('activity','Aktivita')|E], při níž se [Concept('vassals','vazaly')|E] a [Concept('courtiers','dvořané')|E] z [Concept('realm','panství')|E] shromáždí u [Concept('royal_court','královského dvora')|E], aby předložili prosby svému [Concept('liege','lennímu pánovi')|E] a přednesli své stížnosti.\n\nSituace, v nichž bude lenní pán vyzván k vynesení rozsudku, se mohou pohybovat od malicherných sporů a nedorozumění až po pohromy zasahující celé panství. Většina záležitostí bude mít řešení, které je prospěšné – když už ne pro zúčastněné strany, tak alespoň pro lenního pána." # todo: CONCEPT CASE
 game_concept_court_type: "Typ dvora"
 game_concept_court_types: "Typy dvora"
 game_concept_court_type_desc: "Jako součást svého [Concept('royal_court','královského dvora')|E] mohou mít [Concept('rulers','vládci')|E] určený $game_concept_court_type$.\n\nKaždý $game_concept_court_type$ poskytuje vládci a [Concept('court','dvoru')|E] vlastní soubor bonusů v závislosti na [Concept('court_grandeur_level','úroveň velkoleposti dvora')|E].\n\n[Concept('ethos','Étos')|E] [Concept('culture','Kultura')|E] vládce určuje, jaké typy dvora může mít.\n\nJednotlivé typy dvora jsou:\n$BULLET_WITH_TAB$[GetCourtType('court_diplomatic').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_warlike').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_administrative').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_intrigue').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_scholarly').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_tribal').GetName]" # todo: CONCEPT CASE
 game_concept_court_type_trait: "Rys typu dvora"
 game_concept_court_type_trait_desc: "Po [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] letech služby u [Concept('royal_court','královského dvora')|E] získá [Concept('courtier','dvořana')|E] [Concept('trait','rysu')|E], který odráží [Concept('court_type','typ dvora')|E] daného dvora.\n\nKvalita tohoto rysu je určena tím, jak dlouho [Concept('character','postava')|E] působí jako dvořan u dvora." # todo: CONCEPT CASE
 game_concept_court_language: "Dvorní jazyk"
 game_concept_court_languages: "Dvorní jazyky"
 game_concept_court_language_desc: "[Concept('court_language','Dvorní jazyk')|E] je úřední [Concept('language','jazyk')|E] [Concept('royal_court','královského dvora')|E], jímž mluví šlechta a který používá úřednictvo.\n\nZákladní hodnota [Concept('court_grandeur','velkoleposti dvora')|E] se zvyšuje za každé [Concept('county','hrabství')|E] v [Concept('realm','panství')|E], které sdílí tento jazyk, za každý královský dvůr, jenž mluví stejným dvorním jazykem, a pokud jde o rodný jazyk [Concept('ruler','vládce')|E]."
 game_concept_inspiration: "Inspirace"
 game_concept_inspirations: "Inspirace"
 game_concept_inspired: "Inspirovaný"
 game_concept_inspiration_desc: "[Concept('inspired','Inspirovaný')|E] [Concept('characters','Postavy')|E] jsou zruční řemeslníci s [Concept('project','projektem')|E], který by se mohl uskutečnit, pokud se staneš jejich [Concept('sponsor','mecenášem')|E].\n\nPomocí [Concept('decision','rozhodnutí')|E] Objednat artefakt můžeš takovou postavu najmout, aby vytvořila [Concept('artifact','artefakt')|E].[SelectLocalization( HasDlcFeature( 'royal_court' ), 'game_concept_inspiration_desc_DLC', '' )]\n\nJakmile je jejich projekt dokončen, mecenáš si ponechá výsledek, obvykle artefakt." # todo: CONCEPT CASE
 game_concept_inspiration_desc_DLC: "\n\nKromě toho se inspirované postavy pravidelně objevují u [Concept('royal_courts','královských dvorů')|E], zejména u těch s vysokou [Concept('court_grandeur_level','úrovní velkoleposti dvora')|E]."
 game_concept_sponsor: "Mecenáš"
 game_concept_sponsored: "Podporovaný"
 game_concept_sponsor_desc: "Mecenáš je [Concept('ruler','vládce')|E], který financuje [Concept('project','projekt')|E] [Concept('inspired','inspirované')|E] [Concept('character','postavy')|E]." # todo: CONCEPT CASE
 game_concept_artifact: "Artefakt"
 game_concept_artifacts: "Artefakty"
 game_concept_artifact_i: "@artifact_icon!"
 game_concept_artifact_desc: "[Concept('artifact','Artefakt')|E] je pozoruhodný předmět, který poskytuje bonusy [Concept('character','postavě')|E], jež ho používá.\n\n[SelectLocalization( HasDlcFeature( 'court_artifacts' ), 'game_concept_artifact_desc_DLC', 'game_concept_artifact_desc_NO_DLC' )]\n\nNěkteré artefakty jsou výjimečnější než jiné a mají vyšší [Concept('rarity','vzácnosti')|E].\n\nStejně jako u [Concept('titles','titulů')|E] mohou postavy získat [Concept('artifact_claims','nároky na artefakt')|E] a pokusit se daný artefakt získat pro sebe.\n\nArtefakty mají také [Concept('durability','trvanlivosti')|E]: když klesne na nulu, artefakt je zničen.\n\nArtefakty vždy zdědí [Concept('player_heir','hráčský dědic')|E] vlastníka. Pokud artefakt zdědí někdo, kdo není [Concept('close_family_member','členem blízké rodiny')|E], ztratí [Concept('durability','trvanlivost')|E], nebo může být dokonce zcela zničen." # todo: CONCEPT CASE
 game_concept_artifact_desc_NO_DLC: "Protože artefakty nosíš nebo máš u sebe, jsou známé také jako [Concept('inventory_artifacts','osobní artefakty')|E]."
 game_concept_artifact_desc_DLC: "Artefakty se dělí do dvou kategorií:\n$BULLET_WITH_TAB$[Concept('inventory_artifacts','Osobní artefakty')|E] nosí nebo má u sebe postava\n$BULLET_WITH_TAB$[Concept('court_artifacts','Dvorské artefakty')|E] se nacházejí u [Concept('royal_court','královského dvora')|E] [Concept('ruler','vládce')|E]"
 game_concept_court_artifact: "Dvorský artefakt"
 game_concept_court_artifacts: "Dvorské artefakty"
 game_concept_court_artifact_desc: "[Concept('court_artifact','Dvorský artefakt')|E] je [Concept('artifact','artefakt')|E] vystavený u [Concept('royal_court','královského dvora')|E] [Concept('ruler','vládce')|E], například tapisérie nebo krásně ilustrované knihy.\n\nDvorské artefakty jsou jedním z faktorů určujících [Concept('court_grandeur','velkoleposti dvora')|E] královského dvora.\n\nPočet artefaktů, které může postava mít, není nijak omezen, ale účinek mají pouze ty, které jsou vystaveny ve slotu svého typu.\n\nNové dvorské artefakty můžeš vytvořit prostřednictvím [Concept('inspired','inspirovaného')|E] [Concept('characters','postav')|E], rozhodnutí Objednat artefakt nebo zvolením [Concept('reforge','překováním')|E] [Concept('inventory_artifact','osobním artefaktem')|E]." # todo: CONCEPT CASE
 game_concept_inventory_artifact: "Osobní artefakt"
 game_concept_inventory_artifacts: "Osobní artefakty"
 game_concept_inventory_artifact_desc: "[Concept('inventory_artifacts','Osobní artefakty')|E] jsou [Concept('artifacts','artefakty')|E], které [Concept('character','postava')|E] nosí nebo má u sebe, například zbraň nebo korunu.\n\nPočet artefaktů, které může postava mít, není nijak omezen, ale účinek mají pouze ty, které jsou vybaveny ve slotu svého typu.\n\nNové osobní artefakty můžeš vytvořit prostřednictvím [Concept('inspired','inspirovaného')|E] [Concept('characters','postav')|E] nebo rozhodnutí Objednat artefakt." # todo: CONCEPT CASE
 game_concept_project: "Projekt"
 game_concept_project_desc: "[Concept('project','Projekt')|E] je záměr, do něhož se [Concept('inspired','inspirovanou')|E] [Concept('character','postavou')|E] pouští s pomocí [Concept('sponsor','mecenáše')|E], aby uskutečnila svou vizi, obvykle v podobě vytvoření [Concept('artifact','artefaktu')|E]." # todo: CONCEPT CASE
 game_concept_artifact_durability: "Trvanlivost artefaktu"
 game_concept_durability: "Trvanlivost"
 game_concept_artifact_durability_desc: "Každý [Concept('artifact','artefakt')|E] má trvanlivost. Jakmile je veškerá trvanlivost ztracena, artefakt je zničen.\n\nTrvanlivost se časem snižuje, ale lze ji ztratit také při určitých událostech, například během [Concept('sieges','obléhání')|E] nebo při [Concept('succession','nástupnictví')|E].\n\nTrvanlivost lze obnovit zvolením [Concept('reforge','překováním')|E] nebo [Concept('repair','opravy')|E] artefaktu." # todo: CONCEPT CASE
 game_concept_artifact_claim: "Nárok na artefakt"
 game_concept_artifact_claims: "Nároky na artefakt"
 game_concept_artifact_claim_desc: "Nárok na artefakt představuje něčí zákonné právo na [Concept('artifact','artefakt')|E].\n\nMít nárok na [Concept('artifact','artefakt')|E] znamená, že můžeš vůči tomuto artefaktu a jeho vlastníkovi podnikat různé kroky, pokud jej právě nevlastníš (například pomocí [Concept('scheme','intriky')|E] [GetScheme('steal_back_artifact').GetTypeName]).\n\nExistují [Concept('personal_artifact_claims','osobních nároků na artefakt')|E] pro [Concept('character','postavu')|E] a [Concept('house_artifact_claims','rodové nároky na artefakt')|E] pro [Concept('houses','rody')|E].\n\nNároky na artefakt jsou jednodušší než [Concept('title_claims','nároky na tituly')|E]; buď existují, nebo ne. Rovněž nepřecházejí dále než na první generaci." # todo: CONCEPT CASE
 game_concept_personal_artifact_claim: "Osobní nárok na artefakt"
 game_concept_personal_artifact_claims: "Osobní nároky na artefakt"
 game_concept_personal_artifact_claim_desc: "Osobní nárok na artefakt je [Concept('artifact_claim','nárok na artefakt')|E], který náleží osobně tobě, na rozdíl od [Concept('house_artifact_claim','rodového nároku na artefakt')|E].\n\nKdyž zemřeš, tvé děti získají nároky na všechny tvé artefakty.\n\nNárok na artefakt získáš také v případě, že je ukraden během [Concept('siege','obléhání')|E] nebo [Concept('raid','nájezdu')|E].\n\nNároky na artefakt se nikdy nedědí." # todo: CONCEPT CASE
 game_concept_house_artifact_claim: "Rodový nárok na artefakt"
 game_concept_house_artifact_claims: "Rodové nároky na artefakt"
 game_concept_house_artifact_claim_desc: "Pokud držíš [Concept('artifact','artefakt')|E] dostatečně dlouho, celý tvůj [Concept('house','rod')|E] na něj získá [Concept('artifact_claim','nárok na artefakt')|E] – $game_concept_house_artifact_claim$.\n\nPodle rodového nároku na artefakt můžeš jednat pouze tehdy, pokud artefakt nedrží člen tvého rodu.\n\nKdyž vznikne [Concept('cadet_branch','kadetská větev')|E], všechny existující rodové nároky na artefakty držené členy nového rodu se převedou na nový rod." # todo: CONCEPT CASE
 game_concept_court_position: "Dvorský úřad"
 game_concept_court_position_i: "@court_position_icon!"
 game_concept_court_positions: "Dvorské úřady"
 game_concept_court_position_desc: "Dvorské úřady jsou specializované role, které lze udělit [Concept('courtiers','dvořanům')|E] a [Concept('vassals','vazalům')|E], aby pomáhali svému [Concept('liege','lennímu pánovi')|E].\n\nVýhody, které získáš z dvorských úřadů, určuje držitelova [Concept('aptitude','způsobilost')|E] pro daný úřad.\n\nUdělování $game_concept_court_positions$ je zdarma, ale musíš platit měsíční plat ve [Concept('gold','zlatě')|E] a jejich odebrání stojí [Concept('prestige','prestiž')|E]." # todo: CONCEPT CASE
 game_concept_aptitude: "Způsobilost"
 game_concept_aptitude_desc: "Způsobilost [Concept('character','Postava')|E] určuje, jak účinně může zastávat různé role u [Concept('court','dvora')|E]. Mezi tyto role patří [Concept('court_positions','dvorské úřady')|E], [Concept('diarchs','spoluvládci')|E] a [Concept('tax_collectors','výběrčí daní')|E].\n\nZpůsobilost se měří v 5 úrovních od hrozné po vynikající. Úroveň $game_concept_aptitude$ dané postavy určuje bonusy, které [Concept('liege','lenní pán')|E] získá za její zaměstnání v roli u [Concept('court','dvora')|E].\n\nNapříklad postava s rysem [GetTrait('lifestyle_physician').GetName( GetNullCharacter )] bude přirozeně lépe vybavena ke službě jako $court_physician_court_position$." # todo: CONCEPT CASE
 game_concept_aptitude_i: "#P @aptitude:5:inherit_color!#!"
 game_concept_court_event: "Dvorská událost"
 game_concept_court_events: "Dvorské události"
 game_concept_court_event_desc: "Dvorská událost je událost týkající se členů tvého [Concept('court','dvora')|E], kterou lze zobrazit v [Concept('royal_court','královském dvoře')|E]." # todo: CONCEPT CASE
 game_concept_petition_liege: "Žádost"
 game_concept_petition_liege_desc: "Příležitost pro [Concept('vassals','vazaly')|E] požádat svého [Concept('liege','lenního pána')|E] o pomoc.\n\nVznést lze řadu různých záležitostí a je na [Concept('liege','lenního pána')|E], zda jim vyhoví." # todo: CONCEPT CASE
 game_concept_pay_homage: "Vzdát hold"
 game_concept_pay_homage_desc: "[Concept('activity','Aktivita')|E], při níž mohou [Concept('vassals','vazalové')|E] formálně projevit oddanost svému [Concept('liege','lennímu pánovi')|E].\n\nHold lze vzdát různými způsoby a může oběma stranám zlepšit [Concept('opinion','mínění')|E], udělit [Concept('prestige','prestiž')|E] a [Concept('dynasty_prestige','věhlas')|E]."
 repair_or_reforge_and_repair: "[SelectLocalization( HasDlcFeature( 'court_artifacts' ), 'repair_and_reforge', 'just_repair' )]"
 repair_and_reforge: "[Concept('reforge','Překování')|E] nebo [Concept('repair','oprava')|E]"
 just_repair: "[Concept('repair','Oprava')|E]"
 game_concept_reforge_artifact: "Překování artefaktu"
 game_concept_reforge: "Překování"
 game_concept_reforge_artifact_desc: "Některé [Concept('inventory_artifacts','osobní artefakty')|E] lze překovat, čímž se promění v [Concept('court_artifacts','dvorských artefaktech')|E].\n\nK překování [Concept('artifact','artefaktu')|E] musíš mít [GetCourtPositionType('antiquarian_court_position').GetName()] a zaplatit [Concept('gold','zlato')|E], starší artefakty je však levnější překovat.\n\nStejně jako při [Concept('repair','opravě')|E] [Concept('artifact','artefaktu')|E] se obnoví jeho [Concept('durability','trvanlivostí')|E].\n\nPřekovat lze pouze zbraně, zbroje, koruny a regálie a vždy se z nich stanou předměty na podstavci." # todo: CONCEPT CASE
 game_concept_repair_artifact: "Oprava artefaktu"
 game_concept_repair: "Oprava"
 game_concept_repair_artifact_desc: "Když má [Concept('artifact','artefakt')|E] nízkou [Concept('durability','trvanlivosti')|E], můžeš se rozhodnout jej opravit.\n\nZa opravu artefaktu musíš zaplatit [Concept('gold','zlato')|E].[SelectLocalization( HasDlcFeature( 'court_artifacts' ), 'game_concept_repair_artifact_desc_DLC', '' )]" # todo: CONCEPT CASE
 game_concept_repair_artifact_desc_DLC: "\n\nPřípadně můžeš zvolit [Concept('reforge','překování')|E] artefaktu."
