 weapon_inspiration: "Inspirace ke zbrani"
 weapon_inspiration_desc: "Postava s inspirací ke zbrani je [Concept('inspired','inspirována')|E] k vykování [Concept('artifact','artefaktu')|E] v podobě zbraně. Může jít o cokoli od meče po kopí a bude se nosit v ruce."
 armor_inspiration: "Inspirace ke zbroji"
 armor_inspiration_desc: "Postava s inspirací ke zbroji je [Concept('inspired','inspirována')|E] k vykování [Concept('artifact','artefaktu')|E] v podobě zbroje nebo štítu. Může jít o cokoli od kroužkové po lamelovou zbroj."
 book_inspiration: "Inspirace ke knize"
 book_inspiration_desc: "Postava s inspirací ke knize je [Concept('inspired','inspirována')|E] k napsání a vytvoření knižního [Concept('artifact','artefaktu')|E]. Témata se mohou značně lišit – stejně jako kvalita – ale výsledkem bude svazek hodný královského rodu."
 weaver_inspiration: "Tkalcovská inspirace"
 weaver_inspiration_desc: "Postava s tkalcovskou inspirací je [Concept('inspired','inspirována')|E] k utkání tapisériového [Concept('artifact','artefaktu')|E]. Vyobrazení a zachycené výjevy se mohou značně lišit – stejně jako kvalita – ale výsledkem bude tapisérie hodná výzdoby stěn tvého [Concept('royal_court','královského dvora')|E]."
 adventure_inspiration: "Dobrodružná inspirace"
 adventure_inspiration_desc: "Postava s dobrodružnou inspirací je [Concept('inspired','inspirována')|E] vydat se na velké dobrodružství a přinést ti zpět [artifact|E]. Artefakty získané z této inspirace se mohou značně lišit a může jít o cokoli od lebky mocného zvířete po ukradenou rodovou památku."
 artisan_inspiration: "Řemeslnická inspirace"
 artisan_inspiration_desc: "Postava s řemeslnickou inspirací je [Concept('inspired','inspirována')|E] využít své odborné znalosti konkrétní dovednosti k vytvoření [Concept('artifact','artefaktu')|E] mistrovského řemeslného zpracování. Dřevaři a krejčí jsou příklady řemeslnických specializací."
 smith_inspiration: "Kovotepecká inspirace"
 smith_inspiration_desc: "Postava s kovotepeckou inspirací je [Concept('inspired','inspirována')|E] vykovat něco okázalejšího a menšího než meč či zbroj. Jde o umělce, kteří vytvářejí koruny a poháry, lesklé a posázené drahokamy."
 alchemy_inspiration: "Alchymistická inspirace"
 alchemy_inspiration_desc: "Postava s alchymistickou inspirací je [Concept('inspired','inspirována')|E] zkoumat, čistit a vytvářet látky a kovy, vyrábět elixíry a nakonec zdokonalit lidské tělo i duši."
 research_inspiration: "Badatelská inspirace"
 research_inspiration_desc: "Postava s badatelskou inspirací je [Concept('inspired','inspirována')|E] objevovat nové poznání ve prospěch svého [Concept('sponsor','mecenáše')|E]. Pokud uspěje, zlepší učenost v rámci [Concept('dynasty','dynastie')|E] svého mecenáše, nebo dokonce objeví novou [Concept('innovation','inovaci')|E] pro svou kulturu."
 bow_inspiration: "Inspirace k luku"
 bow_inspiration_desc: "Postava s inspirací k luku je [Concept('inspired','inspirována')|E] k opatření luku tětivou jako [Concept('artifact','artefaktu')|E]. Může jít o cokoli od kompozitních luků po kuše a bude se nosit v ruce."
 weapon_inspiration_cost_tt: "Inspirace ke zbrani vycházejí z [Concept('martial','válečnictví')|E] a [Concept('prowess','udatnosti')|E]"
