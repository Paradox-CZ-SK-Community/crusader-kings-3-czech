 weapon_inspiration: "Inspirace ke zbrani"
 weapon_inspiration_desc: "Postava, která má Inspiraci ke zbrani, je [inspired|E] k vyrobení zbraňového [artifact|E]. Může to zahrnovat cokoli od mečů po kopí a bude to držet v ruce."
 armor_inspiration: "Inspirace ke zbroji"
 armor_inspiration_desc: "Postava s inspirací ke zbroji je [inspired|E] k vytvoření brnění nebo štítu [artifact|E]. Může to zahrnovat cokoli od kroužkové košile po lamelové brnění."
 book_inspiration: "Inspirace ke knize"
 book_inspiration_desc: "Postava s inspirací ke knize je [inspired|E] k napsání a vydání knižního [artifact|E]. Témata se mohou velmi lišit – stejně jako kvalita – ale výsledkem bude svazek hodný královské rodiny."
 weaver_inspiration: "Inspirace k tkaní"
 weaver_inspiration_desc: "Postava s inspirací k tkaní je [inspired|E] k vytvoření tapisérie [artifact|E]. Zobrazené motivy a scény se mohou velmi lišit – stejně jako kvalita – ale výsledkem bude tapisérie vhodná k ozdobení zdí vašeho [royal_court|E]."
 adventure_inspiration: "Inspirace k dobrodružství"
 adventure_inspiration_desc: "Postava s inspirací k dobrodružství je [inspired|E] vypravit se na velké dobrodružství a přivést zpět [artifact|E]. Artefakty získané touto inspirací se mohou značně lišit a mohou být cokoli od lebky mocného tvora až po ukradený rodový klenot."
 artisan_inspiration: "Řemeslná inspirace"
 artisan_inspiration_desc: "Postava s řemeslnou inspirací je [inspired|E] k tomu, aby uplatnila odborné znalosti v konkrétní dovednosti a vytvořila [artifact|E] vynikající řemeslné kvality. Truhláři a krejčí jsou příklady specializací řemeslníků."
 smith_inspiration: "Inspirace k kovotepectví"
 smith_inspiration_desc: "Postava s inspirací k kovotepectví je [inspired|E] k vytvoření něčeho honosnějšího a menšího než meč nebo brnění. Jsou to umělci, kteří vytvářejí koruny a poháry, lesklé a osázené drahokamy."
 alchemy_inspiration: "Inspirace k alchymii"
 alchemy_inspiration_desc: "Postava s alchymistickou inspirací je [inspired|E] k objevování, čištění a vytváření substancí a kovů, k výrobě elixírů a nakonec k dokonalosti lidského těla a duše."
 research_inspiration: "Research Inspiration"
 research_inspiration_desc: "Postava s inspirací k výzkumu je [inspired|E] k objevení nových poznatků ve prospěch svého [sponsor|E]. Pokud bude úspěšná, zlepší učenost v [dynasty|E] svého sponzora nebo dokonce objeví novou [innovation|E] pro jejich kulturu."
 bow_inspiration: "Inspirace k luku"
 bow_inspiration_desc: "Postava, která má Inspiraci k luku, je [inspired|E] napnout luk [artifact|E]. To může zahrnovat cokoli od reflexních luků po kuše a bude to nošeno v ruce."
