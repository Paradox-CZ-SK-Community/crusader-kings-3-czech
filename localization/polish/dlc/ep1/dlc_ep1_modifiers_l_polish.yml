l_polish:
 inspiration_invested_in_new_forge_modifier: "Nová kovárna"
 inspiration_invested_in_new_forge_modifier_desc: "Tato postava má zbrusu novou a vysoce efektivní kovárnu."
 inspiration_alchemy_condoned_by_church_modifier: "Církev schvaluje alchymii"
 inspiration_alchemy_condoned_by_church_modifier_desc: "Místní církev se rozhodla tolerovat fascinaci této postavy alchymickými experimenty."
 raised_in_secrecy_modifier: "Vychován v utajení"
 raised_in_secrecy_modifier_desc: "Tato postava byla od narození vychovávána v naprostém utajení a téměř úplné izolaci."
 legendary_party_aftermath_modifier: "Pozůstatky legendárního večírku"
 legendary_party_aftermath_modifier_desc: "Dvůr této postavy stále nese devastující následky ostudně vynikajícího, byť ničivého, večírku."
 mythic_party_aftermath_modifier: "Pozůstatky mýtického večírku"
 mythic_party_aftermath_modifier_desc: "Dvůr této postavy stále nese devastující následky večírku tak gloriózně ničivého, že přetrvává v místní paměti."
 world_shattering_party_aftermath_modifier: "Pozůstatky svět otřásajícího večírku"
 world_shattering_party_aftermath_modifier_desc: "Dvůr této postavy stále nese devastující následky večírku tak chaotického, že způsobil více škod než většina menších obléhání."
 lacking_diplomatic_munity_modifier: "Postrádá diplomatickou imunitu"
 lacking_diplomatic_munity_modifier_desc: "Všichni vědí, že diplomat, který navštíví tento dvůr, je o něco méně v bezpečí, než tradice diktuje."
 humbling_hall_modifier: "Ponížující síň"
 humbling_hall_modifier_desc: "Jedna místnost na tomto dvoře je proslulá událostí, která ponížila dva šlechtické diplomaty — příběhem potěšující spravedlnosti, který prostý lid vypráví jako poučnou báji."
 inscrutable_host_modifier: "Nečitelný hostitel"
 inscrutable_host_modifier_desc: "Tato postava je považována za toho, kdo věří, že pomsta se nejlépe podává vychladlá. Pravděpodobně."
 above_petty_differences_modifier: "Nad malichernými rozdíly"
 above_petty_differences_modifier_desc: "Tato postava se nestará o maličkosti a dává přednost hledání společného základu mezi lidmi před drobnými spory."
 what_did_i_just_drink_modifier: "Co jsem to právě pil?"
 what_did_i_just_drink_modifier_desc: "To bylo... já... hlava... Au."
 known_killjoy_modifier: "Známý kazisvět"
 known_killjoy_modifier_desc: "Zábava zakázána šlechtickým dekretem."
