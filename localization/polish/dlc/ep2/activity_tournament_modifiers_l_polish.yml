l_polish:
 speeches_and_games_modifier: "Proslovy a hry"
 speeches_and_games_modifier_desc: "Lenní pán tohoto hrabství dokázal díky svému charismatu a okázalému vystupování ovládnout neukázněné davy."
 feeble_presence_modifier: "Slabá autorita"
 feeble_presence_modifier_desc: "Lenní pán tohoto hrabství prokázal, že nedokáže udržet rozvášněný dav pod kontrolou."
 deft_cavalrymen_modifier: "Odvážní jezdci"
 deft_cavalrymen_modifier_desc: "Jezdci této postavy se prohánějí po bojišti plnou rychlostí a díky svému výcviku si počínají s obdivuhodnou obratností."
 daring_scout_modifier: "Odvážný průzkumník"
 daring_scout_modifier_desc: "Tuto postavu na cestách doprovází neohrožený jezdec, který se žene vpřed a prozkoumává cestu před ostatními."
 unwilling_tourneyer_modifier: "Neochotný účastník turnaje"
 unwilling_tourneyer_modifier_desc: "[Concept('contest_aptitude','Způsobilost v soutěži')|EU]: -10"
 generous_to_knights_modifier: "Štědrost vůči rytířům"
 generous_to_knights_modifier_desc: "[Concept('contest_aptitude','Způsobilost v soutěži')|EU]: +5"
 safeguards_knightly_honor_modifier: "Strážce rytířské cti"
 safeguards_knightly_honor_modifier_desc: "Úcta této postavy k zásadám, jimiž se řídí urození válečníci, se zdá být neotřesitelná."
 tournament_bracer_modifier: "Kvalitní nátepník"
 tournament_bracer_modifier_desc: "Tato postava si na turnaji pořídila lukostřelecký nátepník, aby zlepšila své střelecké dovednosti."
 tournament_two_bracers_modifier: "Dva nátepníky"
 tournament_two_bracers_modifier_desc: "Tato postava si z nepochopitelného důvodu pořídila lukostřelecký nátepník na každou ruku. Své rozhodnutí sice vehementně obhajuje, ale nejednomu přihlížejícímu tím poskytla důvod k pobavenému pochechtávání."
 tournament_poorly_announced_modifier: "Neschopní hlasatelé"
 tournament_poorly_announced_modifier_desc: "Tato postava investovala do služeb poněkud podřadných hlasatelů."
 tournament_well_proclaimed_modifier: "Vynikající hlasatel"
 tournament_well_proclaimed_modifier_desc: "Tato postava těží ze služeb dobře vyškoleného a zkušeného hlasatele."
 tournament_star_struck_modifier: "Oslnění slávou"
 tournament_star_struck_modifier_desc: "Tato postava je naprosto uchvácena leskem a okázalostí, které provázejí setkání se slavnou osobností."
 tournament_grounded_modifier: "Nohama na zemi"
 tournament_grounded_modifier_desc: "Tato postava netouží po slávě a lidé, kteří se honí za jejími vnějšími projevy, ji nechávají zcela chladnou."
 tournament_foreign_knight_modifier: "Podpora cizozemského rytíře"
 tournament_foreign_knight_modifier_desc: "Tato postava podpořila obdivuhodného cizozemského rytíře, čímž si získala úctu cizinců, ale zároveň vyvolala nevoli některých ostatních."
 tournament_farrier_mistake_modifier: "Kůň poraněný podkovářem"
 tournament_farrier_mistake_modifier_desc: "Nešikovnost podkovářského učně způsobila, že oblíbený kůň této postavy dočasně kulhá.\n\n#weak Způsobilost v soutěžích s vlastním koněm je mírně snížena.#!"
 tournament_performative_sensuousness_modifier: "Okázalá smyslnost"
 tournament_performative_sensuousness_modifier_desc: "Když se tato postava ocitne před publikem, má sklon pohybovat svým tělem poněkud... dráždivým způsobem."
 tournament_ambidextrous_modifier: "Obourukost"
 tournament_ambidextrous_modifier_desc: "Tato postava dokáže obratně zacházet s mečem v obou rukou, což jí při střetu čepelí poskytuje nečekanou výhodu."
 tournament_ambisinister_modifier: "Obě ruce levé"
 tournament_ambisinister_modifier_desc: "Tato postava proslula svou mimořádnou neobratností při zacházení s oběma rukama."
 tournament_fashionable_duelist_modifier: "Módní duelant"
 tournament_fashionable_duelist_modifier_desc: "Oděv, který si tato postava vybírá pro souboje, možná není zrovna nejvhodnější pro dosažení vítězství, ale rozhodně v něm vypadá skvěle."
 tournament_charm_resistant_modifier: "Odolnost vůči svádění"
 tournament_charm_resistant_modifier_desc: "Tato postava se zdá být do jisté míry odolná vůči milostným úskokům a svodům."
 tournament_child_friendly_modifier: "Přítel dětí"
 tournament_child_friendly_modifier_desc: "Tato postava má skutečný talent navazovat přátelské vztahy s dětmi."
 tournament_soaked_modifier: "Promočený od hlavy k patě"
 tournament_soaked_modifier_desc: "Jeden z rozjařených účastníků slavnosti polil tuto postavu nápojem, takže je nyní celá promočená a line se z ní podivný zápach."
 tournament_public_proselytiser_modifier: "Veřejný kazatel"
 tournament_public_proselytiser_modifier_desc: "Tato postava prokázala svou zbožnost tím, že během turnaje horlivě kázala shromážděnému davu."
 tournament_sports_enthusiast_modifier: "Nadšenec do soutěží"
 tournament_sports_enthusiast_modifier_desc: "Nadšení této postavy pro sportovní soutěže je patrné při každé příležitosti."
 tournament_low_blower_modifier: "Podpásové údery"
 tournament_low_blower_modifier_desc: "Tato postava si v soubojové aréně postupně získala pověst nečestného soupeře."
 tournament_roguish_duelist_modifier: "Drzý duelant"
 tournament_roguish_duelist_modifier_desc: "Šarm a drzost této postavy, které projevuje s mečem v ruce, přivádějí soupeře k zuřivosti a zároveň naprosto uchvacují diváky."
 tournament_ended_rightly_modifier: "Zasloužené ponížení"
 tournament_ended_rightly_modifier_desc: "Tato postava utrpěla v souboji pořádnou potupu, když ji soupeř zesměšnil tím, že po ní hodil odšroubovanou hlavici svého meče!"
 tournament_melee_protector_modifier: "Ochránce v hromadném boji"
 tournament_melee_protector_modifier_desc: "Záda této postavě kryje někdo, od koho by takovou pomoc rozhodně nečekala.\n\n#weak Tento modifikátor potrvá až do konce soutěže v hromadném boji.#!"
 tournament_house_unity_modifier: "Jednota rodu"
 tournament_house_unity_modifier_desc: "Tento rod prokázal svou bojovou zdatnost v hromadném střetu a získal si pozornost ostatních jako zářný příklad jednoty a vzájemné soudržnosti."
 tournament_reckoning_modifier: "Den zúčtování"
 tournament_reckoning_modifier_desc: "Tato postava jednou za svou chamtivost zaplatí. Neví kdy, ale je si jistá, že ten den přijde."
 tournament_loving_parent_modifier: "Milující rodič"
 tournament_loving_parent_modifier_desc: "Tato postava prokázala, že je milujícím rodičem, přinejmenším vůči svému dědici."
 tournament_annoyed_locals_modifier: "Rozmrzelí místní"
 tournament_annoyed_locals_modifier_desc: "Obyvatelé tohoto hrabství museli místo sledování turnajového klání poslouchat nekonečná kázání, což je značně rozladilo."
