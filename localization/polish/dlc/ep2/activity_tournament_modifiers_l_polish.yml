l_polish:
 speeches_and_games_modifier: "Proslovy a hry"
 speeches_and_games_modifier_desc: "Pán tohoto hrabství s velkolepostí a charismatem ovládl nezvladatelné davy."
 feeble_presence_modifier: "Slabá přítomnost"
 feeble_presence_modifier_desc: "Pán tohoto hrabství neprokázal žádnou schopnost ovládat dav."
 deft_cavalrymen_modifier: "Smělí jezdci"
 deft_cavalrymen_modifier_desc: "Jezdci této postavy uhánějí po bojišti na plný plyn s prokázanou obratností."
 daring_scout_modifier: "Odvážný průzkumník"
 daring_scout_modifier_desc: "Tato postava cestuje s neohroženým průzkumníkem, který zkoumá cestu před nimi."
 unwilling_tourneyer_modifier: "Neochotný turnajník"
 unwilling_tourneyer_modifier_desc: "[Concept('contest_aptitude','Způsobilost v soutěži')|E]: -10" # todo: CONCEPT CASE
 generous_to_knights_modifier: "Velkorysý k rytířům"
 generous_to_knights_modifier_desc: "[Concept('contest_aptitude','Způsobilost v soutěži')|E]: +5" # todo: CONCEPT CASE
 safeguards_knightly_honor_modifier: "Chrání rytířskou čest"
 safeguards_knightly_honor_modifier_desc: "Respekt této postavy k kodexům, které pojí šlechtické bojovníky, se zdá neotřesitelný."
 tournament_bracer_modifier: "Hezký chránič"
 tournament_bracer_modifier_desc: "Tato postava si na turnaji koupila chránič pro lučištníka, aby posílila své dovednosti."
 tournament_two_bracers_modifier: "Dvojité chrániče"
 tournament_two_bracers_modifier_desc: "Tato postava podivuhodně koupila chránič pro lučištníka na každé paži, což horlivě hájí, ale přimělo nejednoho diváka k tichému chichotání."
 tournament_poorly_announced_modifier: "Špatně ohlášené"
 tournament_poorly_announced_modifier_desc: "Tato postava investovala do poněkud podřadných heroldů."
 tournament_well_proclaimed_modifier: "Dobře ohlášené"
 tournament_well_proclaimed_modifier_desc: "Tato postava má prospěch z dobře vycvičeného a zkušeného herolda."
 tournament_star_struck_modifier: "Ohromen hvězdou"
 tournament_star_struck_modifier_desc: "Tuto postavu uchvátil veškerý lesk a okázalost spojená s viděním slavné osobnosti."
 tournament_grounded_modifier: "Střízlivý"
 tournament_grounded_modifier_desc: "Tato postava nemá zájem o slávu a nezajímá se o nikoho, kdo hledá její atributy."
 tournament_foreign_knight_modifier: "Podporoval cizího rytíře"
 tournament_foreign_knight_modifier_desc: "Tato postava podpořila impozantního cizího rytíře, čímž si získala respekt u cizinců, ale u jiných vyvolala určité znepokojení."
 tournament_farrier_mistake_modifier: "Kůň zraněný podkůvačem"
 tournament_farrier_mistake_modifier_desc: "Nemotornost učně dočasně ochromila oblíbeného koně této postavy.\n\n#weak Osobní dovednost v soutěži s koněm byla mírně snížena.#!"
 tournament_performative_sensuousness_modifier: "Performativní smyslnost"
 tournament_performative_sensuousness_modifier_desc: "Před publikem má tato postava tendenci pohybovat tělem poněkud... svůdně."
 tournament_ambidextrous_modifier: "Obouruký"
 tournament_ambidextrous_modifier_desc: "Schopnost této postavy ovládat čepel v obou rukách jí dává překvapivou výhodu v souboji."
 tournament_ambisinister_modifier: "Oboustranně nemotorný"
 tournament_ambisinister_modifier_desc: "Nemotornost této postavy se projevila výrazně."
 tournament_fashionable_duelist_modifier: "Stylový duelant"
 tournament_fashionable_duelist_modifier_desc: "Oblečení této postavy v duelu možná není nejvhodnější pro vítězství, ale rozhodně vypadá dobře."
 tournament_charm_resistant_modifier: "Odolný vůči okouzlení"
 tournament_charm_resistant_modifier_desc: "Tato postava se zdá být do jisté míry odolná vůči milostným nástrahám."
 tournament_child_friendly_modifier: "Přátelský k dětem"
 tournament_child_friendly_modifier_desc: "Tato postava má opravdový talent navazovat vztahy s dětmi."
 tournament_soaked_modifier: "Promoklý"
 tournament_soaked_modifier_desc: "Tato postava byla promočená poté, co jí nějaký veselík vylil pití na šaty, což zanechalo zvláštní pach."
 tournament_public_proselytiser_modifier: "Veřejný proselytizátor"
 tournament_public_proselytiser_modifier_desc: "Tato postava prokázala svou zbožnost tím, že na turnaji kázala davu."
 tournament_sports_enthusiast_modifier: "Sportovní nadšenec"
 tournament_sports_enthusiast_modifier_desc: "Nadšení této postavy pro sportovní události je vždy patrné."
 tournament_low_blower_modifier: "Úder pod pás"
 tournament_low_blower_modifier_desc: "Tato postava si vybudovala pověst pro nesportovní chování v soubojích."
 tournament_roguish_duelist_modifier: "Šibalský duelant"
 tournament_roguish_duelist_modifier_desc: "Šarm a drzost této postavy s mečem v ruce rozčiluje soupeře a zároveň okouzluje diváky."
 tournament_ended_rightly_modifier: "Skončilo správně"
 tournament_ended_rightly_modifier_desc: "Tato postava byla v duelu ponižena, když ji soupeř ztrapnil tím, že na ni hodil odšroubovanou hlavici meče!"
 tournament_melee_protector_modifier: "Ochránce v mele"
 tournament_melee_protector_modifier_desc: "Záda této postavy chrání překvapivá osoba.\n\n#weak Tento modifikátor potrvá až do konce soutěže v mele.#!"
 tournament_house_unity_modifier: "Jednota rodu"
 tournament_house_unity_modifier_desc: "Tento rod prokázal svou hodnotu v mele, čímž upoutal pozornost ostatních jako vzor jednotného postupu."
 tournament_reckoning_modifier: "Zúčtování"
 tournament_reckoning_modifier_desc: "Tato postava jednoho dne zaplatí za svou chamtivost. Neví kdy, jen že k tomu dojde."
 tournament_loving_parent_modifier: "Milující rodič"
 tournament_loving_parent_modifier_desc: "Tato postava se ukázala být milujícím rodičem; alespoň ke svému dědicovi."
 tournament_annoyed_locals_modifier: "Naštvaní místní"
 tournament_annoyed_locals_modifier_desc: "Davy v tomto hrabství musely trávit čas posloucháním kázání, když se snažily sledovat turnaj."
