l_polish:
 ep2_accolade_events.0100.t: "Umění lovce"
 ep2_accolade_events.0100.desc: "Bezhlavě pronásledovat divokou zvěř, zasypávat ji šípy nebo stále usilovněji pobízet koně k rychlejšímu cvalu?\n\n„Marnost!“ zasměje se [huntsmaster.GetName], [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')|l] z mé družiny s pověstí vynikajícího lovce.\n\nDivoká zvěř dokáže být prohnaná. Blížícího se lovce zavětří, před loveckou smečkou se rozprchne a zahnaná do kouta se neváhá zuřivě bránit. Kdo chce úspěšně skolit kořist, musí dokonale znát její zvyky i divočinu, v níž žije. A jakmile zazní lovecký roh, nesmí polevit.\n\nSotva se najde schopnější lovec než [huntsmaster.GetFirstNameNoTooltip]. Pod [Select_CString(huntsmaster.IsFemale,'jejím','jeho')] vedením "
 ep2_accolade_events.0100.desc.both: "já i [Select_CString(new_hunter_2.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', new_hunter_2)|l] [new_hunter_2.GetFirstName] postupně poznáváme zvyky tvorů, nad nimiž bdí [ROOT.Char.GetFaith.HighGodName], a učíme se, jak je přelstít."
 ep2_accolade_events.0100.desc.heir: "[Select_CString(new_hunter.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', new_hunter)|l] [new_hunter.GetFirstName] postupně poznává zvyky tvorů, nad nimiž bdí [ROOT.Char.GetFaith.HighGodName], a učí se, jak je přelstít."
 ep2_accolade_events.0100.desc.liege: "postupně poznávám zvyky tvorů, nad nimiž bdí [ROOT.Char.GetFaith.HighGodName], a učím se, jak je přelstít."
 ep2_accolade_events.0100.a: "Vzhůru na lov!"
 ep2_accolade_events.0200.t: "Ostrý jako čepel"
 ep2_accolade_events.0200.desc: "„Výborně!“ rozzáří se [acclaimed_blademaster.GetName]. #EMP „Znovu!“#!\n\nMeč naráží na meč, vůle se střetává s vůlí. Začínající šermíř myslí pouze na vítězství, zatímco ostřílený mistr [acclaimed_blademaster.GetFirstNameNoTooltip] se jen usmívá a s lehkostí odráží jeden úder za druhým.\n\n"
 ep2_accolade_events.0200.desc.both_not_martial: "Vyčerpaně přestanu útočit.\n\n„Meč vám padne do ruky, [ROOT.Char.Custom('FormOfAddressForLiege')|l],“ poznamená [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')|l]. „A [Select_CString(new_blademaster_2.IsFemale,'vaše','váš')] [ROOT.Char.Custom2('RelationToMeShort', new_blademaster_2)|l] [new_blademaster_2.GetFirstName] s ním také umí zacházet. Mohl bych... vás oba cvičit, pokud byste si to přáli.“\n\nZadívám se na jílec meče ve svých puchýři pokrytých prstech. Mám se snad vzepřít zvyklostem daným svým původem?"
 ep2_accolade_events.0200.desc.liege_not_martial: "Vyčerpaně přestanu útočit.\n\n„Meč vám padne do ruky, [ROOT.Char.Custom('FormOfAddressForLiege')|l],“ poznamená [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')|l]. „A [Select_CString(new_blademaster_2.IsFemale,'vaše','váš')] [ROOT.Char.Custom2('RelationToMeShort', new_blademaster_2)|l] [new_blademaster_2.GetFirstName] s ním také umí zacházet. Pokud si přejete, mohl bych vás cvičit stejně jako [new_blademaster_2.Custom('CZ_FirstName_A')].“\n\nZadívám se na jílec meče ve svých puchýři pokrytých prstech. Mám se snad vzepřít zvyklostem daným svým původem?"
 ep2_accolade_events.0200.desc.heir_not_martial: "Vyčerpaně přestanu útočit.\n\n„Meč vám padne do ruky, [ROOT.Char.Custom('FormOfAddressForLiege')|l],“ poznamená [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')|l]. „A [Select_CString(new_blademaster_2.IsFemale,'vaše','váš')] [ROOT.Char.Custom2('RelationToMeShort', new_blademaster_2)|l] [new_blademaster_2.GetFirstName] s ním také umí zacházet. Dokonce mě [Select_CString(new_blademaster_2.IsFemale,'požádala','požádal')], abych vás oba cvičil.“\n\n[Select_CString(new_blademaster_2.IsFemale,'Má dědička','Můj dědic')] [new_blademaster_2.GetFirstName] se chce vzepřít zvyklostem daným svým původem?"
 ep2_accolade_events.0200.desc.both: "Vyčerpaně přestanu útočit.\n\n„Meč vám padne do ruky, [ROOT.Char.Custom('FormOfAddressForLiege')|l],“ poznamená [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')|l]. „A [Select_CString(new_blademaster_2.IsFemale,'vaše','váš')] [ROOT.Char.Custom2('RelationToMeShort', new_blademaster_2)|l] [new_blademaster_2.GetFirstName] s ním také umí zacházet! V té vaší zuřivosti je skutečné umění. Talent, který stojí za to rozvíjet.“"
 ep2_accolade_events.0200.desc.heir: "[Select_CString(new_blademaster.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', new_blademaster)|l] [new_blademaster.GetFirstName] vyčerpaně ustává v útoku.\n\n„Meč [Select_CString(new_blademaster.IsFemale,'jí','mu')] padne do ruky, [ROOT.Char.Custom('FormOfAddressForLiege')|l],“ poznamená [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')|l]. „V té zuřivosti je skutečné umění. Talent, který stojí za to rozvíjet.“"
 ep2_accolade_events.0200.desc.liege: "Vyčerpaně přestanu útočit.\n\n„Meč vám padne do ruky, [ROOT.Char.Custom('FormOfAddressForLiege')|l],“ poznamená [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')|l]. „V té vaší zuřivosti je skutečné umění. Talent, který stojí za to rozvíjet.“"
 ep2_accolade_events.0200.a: "Ať se před námi nepřátelé třesou!"
 ep2_accolade_events.0200.b: "Zacházet s mečem potřebují umět jen ti, kteří smějí bojovat."
 ep2_accolade_events.0200.b.tt: "Vždyť [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|U] musí jít ostatním příkladem."
 defied_martial_custom_modifier: "Vzepření se válečnickým zvyklostem"
 defied_martial_custom_desc: "Tato postava se vzepřela společenským zvyklostem, když dovolila chopit se meče i těm, od nichž se bojové umění neočekává."
 ep2_accolade_events.0300.t: "Krédo miláčka davů"
 ep2_accolade_events.0300.desc: "Při ranním jídle mi dělá společnost [master_of_revels.GetFirstName], [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')|l] z mé družiny. Dozvídám se překvapivě zasvěcené postřehy o životě dvořanů, poslouchám neuvěřitelné a často naprosto absurdní historky a s úžasem sleduji, jak rychle mizí jídlo i pití ze stolu.\n\n„Plody života jsou všude kolem nás, [ROOT.Char.GetTitleTierName|l],“ zazní mezi sousty. „Visí na větvích, zralé a připravené ke sklizni. Ochutná je však jen ten, kdo se za nimi bez váhání vyšplhá.“\n\nO tom, jak si [master_of_revels.GetFirstNameNoTooltip] dokáže užívat plodů života, se vypráví po celém dvoře. Všude, kam zavítá, si bez nejmenší námahy získává přátele i obdivovatele. A vůbec se tím netrápí.\n\n"
 ep2_accolade_events.0300.desc.both: "Pro mě i pro [new_reveler_2.Custom('CZ_FirstName_A')], [Select_CString(new_reveler_2.IsFemale,'mou dědičku','mého dědice')], je to hlučná, ale nesmírně inspirativní podívaná."
 ep2_accolade_events.0300.desc.heir: "Pro [new_reveler_2.Custom('CZ_FirstName_A')], [Select_CString(new_reveler_2.IsFemale,'mou dědičku','mého dědice')], je to hlučná, ale nesmírně inspirativní podívaná."
 ep2_accolade_events.0300.desc.liege: "Musím uznat, že mě takový přístup k životu inspiruje."
 ep2_accolade_events.0300.a: "Na bujaré večery a sladké plody života!"
