l_polish:
 invite_to_activity_interaction: "Pozvat na aktivitu"
 invite_to_activity_accepted: "Pozvání přijato"
 invite_to_activity_accepted_desc: "[CZProDrop(recipient,'přijala','přijal')|U] tvé pozvání a brzy vyrazí na cestu."
 invite_to_activity_accepted_puppeteer: "Pozvání od [puppet_or_actor.Custom('CZ_ShortUIName_G')] přijato"
 invite_to_activity_accepted_desc_puppeteer: "[CZProDrop(recipient,'přijala','přijal')|U] pozvání od [puppet_or_actor.Custom('CZ_ShortUIName_G')] a brzy vyrazí na cestu."
 invite_to_activity_refused: "Pozvání odmítnuto"
 invite_to_activity_refused_desc: "[CZProDrop(recipient,'odmítla','odmítl')|U] tvé pozvání."
 invite_to_activity_refused_puppeteer: "Pozvání od [puppet_or_actor.Custom('CZ_ShortUIName_G')] odmítnuto"
 invite_to_activity_refused_desc_puppeteer: "[CZProDrop(recipient,'odmítla','odmítl')|U] pozvání od [puppet_or_actor.Custom('CZ_ShortUIName_G')]."
 invite_to_activity_interaction_desc: "Pozvi [recipient.Custom('CZ_TitledFirstNameNoTooltip_A')] na [Concept('activity','aktivitu')|E], kterou právě pořádáš."
 invite_to_activity_reply_item_key: "#T Pozvánka na aktivitu [CHARACTER.GetInvolvedActivity.GetNameNoTooltip]\n#!Odesílatel: [CHARACTER.GetUIName]"
 invite_to_activity_flavor: "[SCOPE.sC('actor').Custom2('GetInviteToActivityFlavor', SCOPE.sC('recipient'))][SCOPE.sC('actor').Custom2('GetTournamentPrizeFlavor', SCOPE.sC('recipient'))]"
 invite_to_activity_flavor_tournament: "Pořádám velkolepý turnaj [CZPrepV(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation,'L')]."
 invite_to_activity_flavor_wedding: "Srdečně vás zvu na"
 invite_to_activity_flavor_tour: "Tímto vás zvu, abyste se připojili k mému turné po [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_L')]. Naše cesta začne [CZPrepV(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation,'L')]."
 invite_to_activity_flavor_feast: "Srdečně vás zvu na hostinu. Přivítá vás [ROOT.Char.Custom('FortifiedBuilding')|l] [CZPrepV(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation,'L')]."
 invite_to_activity_flavor_hunt: "Srdečně vás zvu na mou honitbu v [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.Custom('GetTerrainLandPlural')|l], která se rozprostírá kolem [CZProvName(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation,'G')]."
 invite_to_activity_flavor_pilgrimage: "Tímto vás zvu, abyste se ke mně připojili na pouti do [CZProvName(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation,'G')]."
 invite_to_activity_flavor_playdate: "Přijďte prosím na mé setkání [CZPrepV(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation,'L')]. Užijeme si spoustu zábavy a poznáme další děti!"
 invite_to_activity_flavor_witch_ritual: "Nastal čas znovu složit poctu, kterou si [ROOT.Char.GetFaith.WitchGodName] zaslouží. Přijdete do [CZProvName(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation,'G')] a podělíte se s námi o nová zjevení?"
 invite_to_activity_flavor_gruesome_festival: "Tímto vás zvu do [CZProvName(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation,'G')] na velkolepou obětní slavnost. Kéž [ROOT.Char.GetFaith.PantheonTerm] přijme naši poctu."
 invite_to_activity_flavor_funeral: "Tímto vás zvu do [CZProvName(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation,'G')], kde se uskuteční [ROOT.Char.GetInvolvedActivity.GetShortName|l] na památku [ROOT.Char.GetInvolvedActivity.MakeScope().Var('body_to_bury').Char.Custom('CZ_TitledFirstName_G')]."
 invite_to_activity_flavor_ecumenical_council: "Tímto vás zvu na [ROOT.Char.GetInvolvedActivity.GetShortName|l] [CZPrepV(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation,'L')]. Budeme zde diskutovat o otázkách, jako jsou [ROOT.Char.GetInvolvedActivity.GetSelectedTenet1.GetName( ROOT.Char.GetRite )], [ROOT.Char.GetInvolvedActivity.GetSelectedTenet2.GetName( ROOT.Char.GetRite )] a [ROOT.Char.GetInvolvedActivity.GetSelectedDoctrine1.GetDescriptiveName( ROOT.Char.GetFaith )]."
 invite_to_activity_flavor_fallback: "Tímto vás srdečně zvu na aktivitu [ROOT.Char.GetInvolvedActivity.GetShortName]."
 invite_to_activity_flavor_examination: "Tímto vás zvu k účasti na zkoušce, kterou pořádám."
 invite_to_activity_flavor_examination_family: "Očekává se, že s sebou přivedete také členy své rodiny, aby se této zkoušky zúčastnili."
 invite_to_activity_flavor_festival: "Bylo by mi ctí, kdybyste přijali mé pozvání na slavnost."
 activity_location_any_game_tt: "Na vybraném místě se musí vyskytovat lovná zvěř"
 activity_location_owned_or_vassal_tt: "[Concept('county','Hrabství')|EU] musí patřit tobě nebo tvému [Concept('direct_vassal','přímému vazalovi')|E]"
 invite_to_activity_flavor_imperial_debate: "Tímto vás zvu na císařskou debatu [CZPrepV(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation,'L')]. [ROOT.Char.Custom('GetMyMovement')|U] si získá přízeň celého panství!"
 invite_to_activity_flavor_movement_debate_honorary_guest: "Tvé vedení hnutí [ROOT.Char.Custom('GetMyMovement')] je u konce! Vyzývám tě k debatě. Dokaž, že máš na to nás vést, jinak tuto odpovědnost s radostí převezmu!"
 invite_to_activity_flavor_movement_debate: "Tímto vás zvu na debatu hnutí [ROOT.Char.Custom('GetMyMovementShort')], která rozhodne o jeho budoucím vedení!"
 FINALIZE_DESTINATION_SELECTION: "Dokončit plánování aktivity [CZActivityText(ActivityType.GetNameNoTooltip,'G')]"
 START_DESTINATION_SELECTION: "Upravit plánování aktivity [CZActivityText(ActivityType.GetNameNoTooltip,'G')]"
 NUM_STOPS: "Zastávky ([GetDataModelSize( ActivityPlanner.AccessPlannedPhases )])"
 ESTIMATED_TRAVEL_TIME_NEXT_DESTINATION: "[TravelPlanData.GetNextDestination.GetEstimatedArrivalDate.GetTimeDiffFromNow] na cestu do [Title.Custom('CZ_LandedName_G')]"
 ESTIMATED_TRAVEL_TIME_TOTAL: "Celková doba cesty: [TravelPlanData.GetFinalDestination.GetEstimatedArrivalDate.GetTimeDiffFromNow]"
 tournament_invite_flavor_contestant: "$invite_to_activity_flavor_tournament$ Jako první přijde na řadu soutěž [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName]. Bude to skvělá příležitost předvést všem své dovednosti, za to ručím!\n"
 tournament_invite_flavor_standard: "$invite_to_activity_flavor_tournament$ Jako první přijde na řadu soutěž [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName]. Věřím, že nás čeká skutečně velkolepá podívaná.\n"
 tournament_invite_flavor_bad_prizes: "\nCeny budou bohužel jen drobné cetky, ale příležitost získat slávu bude o to větší!\n"
 tournament_invite_flavor_normal_prizes: "\nPředevším půjde o zdokonalování našich dovedností, avšak vítězové se mohou těšit i na hodnotné ceny.\n"
 tournament_invite_flavor_good_prizes: "\nPro vítěze jsou připraveny kvalitní ceny, pokud by vás snad samotná příležitost získat slávu dostatečně nelákala!\n"
 tournament_invite_flavor_very_good_prizes: "\n[Select_CString(ROOT.Char.IsFemale,'Postarala','Postaral')|U] jsem se, aby na vítěze čekaly skutečně znamenité ceny!\n"
 tournament_invite_flavor_splendid_prizes: "\nNa vítěze čekají pouze ty nejskvostnější ceny, skutečná umělecká díla z rukou nejlepších řemeslníků mého panství!\n"
 wedding_invite_flavor_betrothed: "Konečně nadešel čas oslavit naši velkolepou svatbu. Netrpělivě vás očekávám [CZPrepV(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation,'L')].\n"
 wedding_invite_flavor_host: "$invite_to_activity_flavor_wedding$ oslavu svatby, při níž si [ROOT.Char.GetInvolvedActivity.GetSpecialGuest('spouse_2').GetCharacter.GetFullName] a já řekneme své ano. Slavnost se uskuteční [CZPrepV(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation,'L')].\n"
 wedding_invite_flavor_standard: "$invite_to_activity_flavor_wedding$ oslavu svatby, při níž si [ROOT.Char.GetInvolvedActivity.GetSpecialGuest('spouse_1').GetCharacter.GetFullName] a [ROOT.Char.GetInvolvedActivity.GetSpecialGuest('spouse_2').GetCharacter.GetFullName] řeknou své ano. Slavnost se uskuteční [CZPrepV(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation,'L')].\n"
 feast_invite_flavor_honor: "$invite_to_activity_flavor_feast$ Bylo by mi ctí, kdybyste přijali roli čestného hosta a zaujali nejvýznamnější místo u slavnostního stolu.\n"
 feast_invite_flavor_standard: "$invite_to_activity_flavor_feast$ Společně si vychutnáme vše, co nám nabízí [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip].\n"
 hunt_invite_flavor_standard: "$invite_to_activity_flavor_hunt$ Společně si užijeme skutečně znamenitý lov!\n"
 hunt_invite_flavor_legendary: "$invite_to_activity_flavor_hunt$ Společně zaženeme do úzkých legendární kořist – [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetTitle.GetDeJureLiege.Custom('GetLegendaryColor')] [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetTitle.GetDeJureLiege.Custom('GetAnimalType')]!\n"
 hunt_invite_flavor_dangerous: "$invite_to_activity_flavor_hunt$ Společně skolíme nebezpečnou šelmu!\n"
 hunt_invite_flavor_falconry: "$invite_to_activity_flavor_hunt$ Společně vypustíme své dravce a jejich kořist nebude mít nejmenší šanci!\n"
 hunt_invite_flavor_nerge: "[Select_CString(ROOT.Char.IsFemale,'Pověřila','Pověřil')|U] jsem své nejlepší lovce, aby pro můj lov nerge shromáždili nejmohutnější zvířata široko daleko. Připojte se ke mně a staňte se součástí tohoto velkolepého lovu!"
 NOT_activity_invite_max_num_guests: "Na aktivitu nelze pozvat [CHARACTER.Custom('CZ_ShortUIName_A')], protože už je naplněna její kapacita!"
 REASON_NOT_A_WITCH: "Nepatříš mezi čarodějnice ani čaroděje"
