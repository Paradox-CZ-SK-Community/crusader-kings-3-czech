l_polish:
 reduce_stress_intent: "Rekreace"
 reduce_stress_intent_desc: "Chceš se zaměřit na snížení [Concept('stress','stres')|E] hledáním příležitostí, které mu uleví." # todo: CONCEPT CASE
 murder_attendee_intent: "Vražda"
 murder_attendee_intent_desc: "Soustředíš se na ukončení života svého cíle. To často vede k příležitostem k vraždě a ke speciálním možnostem."
 woo_attendee_intent: "Svádění"
 woo_attendee_intent_desc: "Máš v hlavě jen jedno: svést svůj cíl. To často vede ke zvláštním událostem a možnostem, jak toto přání uspokojit."
 impose_obedience_intent: "Vynutit poslušnost"
 impose_obedience_intent_desc: "Použití síly je to jediné, co máš na mysli. To často vede k příležitostem získat [Concept('obedience','poslušnost')|E] svého cíle." # todo: CONCEPT CASE
 befriend_attendee_intent: "Zpřátelit se"
 befriend_attendee_intent_desc: "Chceš získat přízeň svého cíle. To často vede k přátelským událostem a možnostem."
 lechery_intent: "Smilství"
 lechery_intent_desc: "Chystáš se uspokojovat své tělesné touhy a hledat sexuální styky s mnoha partnery. To často vede ke snížení [Concept('stress','stresu')|E] u postav s rysem [GetTrait('lustful').GetName( GetNullCharacter )]." # todo: CONCEPT CASE
 legitimacy_intent: "Prosazovat legitimitu"
 legitimacy_intent_desc: "Chceš využít toto shromáždění k podpoře své [Concept('legitimacy','legitimitu')|E]." # todo: CONCEPT CASE
 altruism_intent_header: "Altruismus:"
 altruism_intent: "Altruismus"
 altruism_intent_desc: "Snažíš se zlepšit životy ostatních hledáním příležitostí k altruistickým činům. To často vede ke zvýšení [Concept('county_opinion','lidovému mínění')|E] a [Concept('piety','zbožnost')|E]. Postavy s rysem [GetTrait('zealous').GetName( GetNullCharacter )|U], [GetTrait('generous').GetName( GetNullCharacter )] a [GetTrait('improvident').GetName( GetNullCharacter )] mohou ztratit [Concept('stress','stres')|E]." # todo: CONCEPT CASE
 justice_intent: "Spravedlnost"
 justice_intent_desc: "Snažíš se rozdávat spravedlnost i těm nejmenším zločincům ve svém panství. To často vede ke zvýšení [Concept('control','kontrole')|E] a postavy s rysem [GetTrait('just').GetName( GetNullCharacter )] mohou snížit [Concept('stress','stres')|E]." # todo: CONCEPT CASE
 recruit_knights_intent: "Najmout"
 recruit_knights_intent_desc: "Snažíš se zlepšit svůj dvůr novými a mocnými [Concept('knights','rytíři')|E]. To často přináší příležitosti k náboru." # todo: CONCEPT CASE
 intent_obedience_success_tt: "[THIS.Char.GetIntentTarget.GetShortUIName] se stal [Concept('obedient','poslušný')|E] vůči tobě, čímž jsi dokončil svůj [Concept('intent','záměr')|E]" # todo: CONCEPT CASE
 intent_obedience_fail_tt: "Nepodařilo se ti učinit z [THIS.Char.GetIntentTarget.GetShortUIName] [Concept('obedient','poslušného')|E], cíle tvého [Concept('intent','záměru')|E]" # todo: CONCEPT CASE
 intent_murder_success_tt: "[Select_CString(ROOT.Char.IsFemale,'Zabila','Zabil')] jsi [THIS.Char.GetIntentTarget.GetShortUIName], cíl tvého [Concept('intent','záměru')|E]" # todo: CONCEPT CASE
