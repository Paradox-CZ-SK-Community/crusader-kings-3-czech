l_polish:
 reduce_stress_intent: "Rekreace"
 reduce_stress_intent_desc: "Chceš se zaměřit na snížení [stress|E] hledáním příležitostí, které mu uleví."
 murder_attendee_intent: "Vražda"
 murder_attendee_intent_desc: "Soustředíš se na ukončení života svého cíle. To často vede k příležitostem k vraždě a ke speciálním možnostem."
 woo_attendee_intent: "Svádění"
 woo_attendee_intent_desc: "Máš v hlavě jen jedno: svést svůj cíl. To často vede ke zvláštním událostem a možnostem, jak toto přání uspokojit."
 impose_obedience_intent: "Vynutit poslušnost"
 impose_obedience_intent_desc: "Použití síly je to jediné, co máš na mysli. To často vede k příležitostem získat [obedience|E] svého cíle."
 befriend_attendee_intent: "Zpřátelit se"
 befriend_attendee_intent_desc: "Chceš získat přízeň svého cíle. To často vede k přátelským událostem a možnostem."
 lechery_intent: "Smilství"
 lechery_intent_desc: "Chystáš se uspokojovat své tělesné touhy a hledat sexuální styky s mnoha partnery. To často vede ke snížení [stress|E] u postav s rysem [GetTrait('lustful').GetName( GetNullCharacter )]."
 legitimacy_intent: "Prosazovat legitimitu"
 legitimacy_intent_desc: "Chceš využít toto shromáždění k podpoře své [legitimacy|E]."
 altruism_intent_header: "Altruismus:"
 altruism_intent: "Altruismus"
 altruism_intent_desc: "Snažíš se zlepšit životy ostatních hledáním příležitostí k altruistickým činům. To často vede ke zvýšení [county_opinion|E] a [piety|E]. Postavy s rysem [GetTrait('zealous').GetName( GetNullCharacter )|U], [GetTrait('generous').GetName( GetNullCharacter )] a [GetTrait('improvident').GetName( GetNullCharacter )] mohou ztratit [stress|E]."
 justice_intent: "Spravedlnost"
 justice_intent_desc: "Snažíš se rozdávat spravedlnost i těm nejmenším zločincům ve svém panství. To často vede ke zvýšení [control|E] a postavy s rysem [GetTrait('just').GetName( GetNullCharacter )] mohou snížit [stress|E]."
 recruit_knights_intent: "Najmout"
 recruit_knights_intent_desc: "Snažíš se zlepšit svůj dvůr novými a mocnými [knights|E]. To často přináší příležitosti k náboru."
