l_polish:
 reduce_stress_intent: "Odpočinek"
 reduce_stress_intent_desc: "Chceš se soustředit na zmírnění [Concept('stress','stresu')|E] a vyhledávat příležitosti, které ti pomohou se ho zbavit."
 murder_attendee_intent: "Vražda"
 murder_attendee_intent_desc: "Tvým cílem je připravit vybranou postavu o život. Tento záměr často přináší příležitosti k vraždě a zvláštní možnosti jednání."
 woo_attendee_intent: "Svádění"
 woo_attendee_intent_desc: "Máš v hlavě jedinou věc: svést vybranou postavu. Často se ti proto naskytnou zvláštní události a možnosti, které ti pomohou tohoto cíle dosáhnout."
 impose_obedience_intent: "Vynucení poslušnosti"
 impose_obedience_intent_desc: "Máš v úmyslu předvést svou sílu a moc. Často se ti tak naskytnou příležitosti vynutit si [Concept('obedience','poslušnost')|E] vybrané postavy."
 befriend_attendee_intent: "Spřátelení"
 befriend_attendee_intent_desc: "Chceš si získat přízeň vybrané postavy. Tento záměr často přináší přátelská setkání a zvláštní možnosti jednání."
 lechery_intent: "Prostopášnost"
 lechery_intent_desc: "Hodláš se oddat tělesným rozkoším a vyhledávat milostná dobrodružství s co největším počtem partnerů. Postavám s rysem [GetTrait('lustful').GetName( GetNullCharacter )] to často pomáhá zmírnit [Concept('stress','stres')|E]."
 legitimacy_intent: "Podpora legitimity"
 legitimacy_intent_desc: "Chceš tohoto setkání využít k posílení své [Concept('legitimacy','legitimity')|E]."
 altruism_intent_header: "Altruismus:"
 altruism_intent: "Altruismus"
 altruism_intent_desc: "Chceš zlepšovat životy ostatních a vyhledávat příležitosti k nezištným skutkům. Tento záměr často zvyšuje [Concept('county_opinion','lidové mínění')|E] a [Concept('piety','zbožnost')|E]. Postavy s rysy [GetTrait('zealous').GetName( GetNullCharacter )], [GetTrait('generous').GetName( GetNullCharacter )] a [GetTrait('improvident').GetName( GetNullCharacter )] mohou také snížit svůj [Concept('stress','stres')|E]."
 justice_intent: "Spravedlnost"
 justice_intent_desc: "Chceš ve svém panství prosazovat spravedlnost a trestat i ty nejdrobnější provinilce. Tento záměr často zvyšuje [Concept('control','kontrolu')|E] a postavám s rysem [GetTrait('just').GetName( GetNullCharacter )] může pomoci snížit [Concept('stress','stres')|E]."
 recruit_knights_intent: "Nábor"
 recruit_knights_intent_desc: "Chceš svůj dvůr posílit o nové, schopné [Concept('knights','rytíře')|E]. Tento záměr často přináší příležitosti k jejich náboru."
 intent_obedience_success_tt: "Podařilo se ti přimět [THIS.Char.GetIntentTarget.Custom('CZ_ShortUIName_A')] k [Concept('obedient','poslušnosti')|E], a tím i splnit svůj [Concept('intent','záměr')|E]"
 intent_obedience_fail_tt: "Nepodařilo se ti přimět [THIS.Char.GetIntentTarget.Custom('CZ_ShortUIName_A')] k [Concept('obedient','poslušnosti')|E], a tvůj [Concept('intent','záměr')|E] tak selhal"
 intent_murder_success_tt: "Podařilo se ti zabít [THIS.Char.GetIntentTarget.Custom('CZ_ShortUIName_A')], a tím i splnit svůj vražedný [Concept('intent','záměr')|E]"
 intent_murder_dead_tt: "[THIS.Char.GetIntentTarget.GetShortUIName|U], cíl tvého vražedného [Concept('intent','záměru')|E], [Select_CString(THIS.Char.GetIntentTarget.IsLocalPlayer,'už nežiješ','už nežije')]"
 intent_murder_fail_tt: "Nepodařilo se ti zabít [THIS.Char.GetIntentTarget.Custom('CZ_ShortUIName_A')], cíl tvého vražedného [Concept('intent','záměru')|E]"
 intent_woo_success_tt: "Podařilo se ti svést [THIS.Char.GetIntentTarget.Custom('CZ_ShortUIName_A')], a tím i splnit svůj [Concept('intent','záměr')|E]"
 intent_woo_potential_tt: "Podařilo se ti vzbudit zájem [THIS.Char.GetIntentTarget.Custom('CZ_ShortUIName_G')], tedy cíle tvého [Concept('intent','záměru')|E] svádění"
 intent_woo_fail_tt: "Nepodařilo se ti svést [THIS.Char.GetIntentTarget.Custom('CZ_ShortUIName_A')], a tvůj [Concept('intent','záměr')|E] tak selhal"
 intent_befriend_success_tt: "Podařilo se ti sblížit s [THIS.Char.GetIntentTarget.Custom('CZ_ShortUIName_I')], a tím i splnit svůj [Concept('intent','záměr')|E] spřátelení"
 intent_befriend_potential_tt: "[Select_CString(GetPlayer.IsFemale,'Strávila','Strávil')|U] jsi nějaký čas s [THIS.Char.GetIntentTarget.Custom('CZ_ShortUIName_I')], cílem svého [Concept('intent','záměru')|E] spřátelení"
 intent_befriend_fail_tt: "Nepodařilo se ti sblížit s [THIS.Char.GetIntentTarget.Custom('CZ_ShortUIName_I')], a tvůj [Concept('intent','záměr')|E] spřátelení tak selhal"
 activity_intent_complete_toast: "Záměr splněn"
