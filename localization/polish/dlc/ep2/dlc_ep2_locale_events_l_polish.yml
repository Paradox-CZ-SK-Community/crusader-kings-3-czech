l_polish:
 ep2_locale_events.1000.t: "$tournament_locale_tavern$: Ještě jedno kolo"
 ep2_locale_events.1000.independent: "Z kouta krčmy se od stolu [drinking_leader.Custom('CZ_TitledFirstName_G')] ozve mohutný výbuch smíchu."
 ep2_locale_events.1000.liege: "Z kouta se ozve mohutný výbuch smíchu. Sedí tam [drinking_leader.GetTitledFirstName], [drinking_leader.GetLiege.Custom2('RelationToMeShort', drinking_leader)] [drinking_leader.GetLiege.Custom('CZ_TitledFirstName_G')]."
 ep2_locale_events.1000.alcohol: "\n\nKolem stojí přátelé i noví známí, kteří se také chystají na soutěž [activity.GetCurrentPhase.GetPhase.GetName|l]. Vyprávějí si historky a k tomu se podává [host.Custom('RegionalAlcoholicDrink')|l].\n\nKdyž procházím kolem, napadá mě, že by neuškodilo tuhle sešlost trochu povzbudit..."
 ep2_locale_events.1000.a: "Hostinský, ještě jedno sem!"
 ep2_locale_events.1000.b: "Účet u stolu platím já!"
 ep2_locale_events.1000.c: "Myslím, že tihle už měli víc než dost."
 ep2_locale_events.1000.d: "Příjemný večer, [drinking_leader.Custom('CZ_FirstNameNoTooltip_V')]!"
 drinks_round_tt: "Každý piják"
 ep2_locale_events.1000.hangover_tt: "Nikdy víc..."
 ep2_locale_events.1002.t: "$tournament_locale_tavern$: Odvážíš se pít?"
 ep2_locale_events.1002.desc: "Místní hospoda je narvaná k prasknutí, jak už to při turnajích bývá. Mezi novými tvářemi sedí [Select_CString(local_drunk.IsFemale,'žena, která','muž, který')] sem zjevně patří odjakživa. Když si přisednu, zpraží mě podezíravým pohledem.\n\n„Co tady děláš #EMP ty#!?“ vyhrkne, sotva mi přinesou pití. Otočím se k [Select_CString(local_drunk.IsFemale,'ní','němu')]. Vratce se zvedá ze židle.\n\n„Promiň mou opovážlivost, #EMP [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]#!,“ dodá s rozmáchlou, posměšnou úklonou, „ale vsadím se, že bys [Select_CString(ROOT.Char.IsFemale,'nezvládla','nezvládl')] ani půlku, natožpak všechno!“"
 ep2_locale_events.1002.a: "No tak, nechme těch nepřátelských řečí. Můžu ti koupit pití?"
 ep2_locale_events.1002.b: "Vážně? #EMP Sem s korbely!#!"
 ep2_locale_events.1002.b.success: "Přepiješ [local_drunk.Custom('CZ_FirstNameNoTooltip_A')]"
 ep2_locale_events.1002.b.failure: "Probudíš se až za pár hodin. Máš mžitky před očima a hlava ti třeští"
 ep2_locale_events.1002.c: "Sednout a ani muk, ty beznadějná opilecká trosko."
 ep2_locale_events.1010.t: "$tournament_locale_tavern$: Chceš si zahrát?"
 ep2_locale_events.1010.desc: "Šero krčmy prozařuje praskající oheň a od stolů zní bujaré veselí. Proklouznu kolem dvou obzvlášť hlučných opilců a posadím se ke stolu, u kterého sedí jediná postava.\n\n„Pěkný večer, nemyslíš?“ [gambler.GetFirstName] pokyne směrem k rozjařenému davu. Zdvořile přikývnu. Sotva zase zvednu hlavu, už [gambler.GetFirstNameNoTooltip] vysype na stůl kostky a kalíšky.\n\n„Co si zahrát něco jednoduchého? To zvládne i hlupák! Oba hodíme pod kalíškem a ty budeš hádat, jestli ti padlo víc, nebo míň než mně.“ V očích se [Select_CString(gambler.IsFemale,'jí','mu')] zablýskne známý hráčský žár. „Na dvě vítězství.“"
 ep2_locale_events.1010.b: "Dej sem ty kostky!"
 ep2_locale_events.1010.c: "[Select_CString(ROOT.Char.IsFemale,'Nejsem žádná hazardérka','Nejsem žádný hazardér')]."
 ep2_locale_events.1011.t: "$tournament_locale_tavern$: První hod"
 ep2_locale_events.1011.opening: "Kostky chrastí a poskakují v kalíšcích, než je oba připlácneme na stůl. Opatrně nadzvednu svůj kalíšek směrem k sobě, aby pod něj nebylo vidět.\n\n#BOL [ROOT.Var('root_dice_1').GetValue|0]#!. Pozorně sleduji [gambler.Custom('CZ_FirstName_A')] a hledám sebemenší náznak."
 ep2_locale_events.1011.tell.good: "\n\nNezvedl se [gambler.Custom('CZ_FirstNameNoTooltip_D')] právě koutek úst? Hned je zase pryč, ale i nepatrné zaváhání může prozradit tu nejhlubší pravdu..."
 ep2_locale_events.1011.tell.bad: "\n\nPohled [gambler.Custom('CZ_FirstNameNoTooltip_G')] sklouzne dolů. Jednou, podruhé. Je to jen okamžik, ale i nepatrné zaváhání může prozradit tu nejhlubší pravdu..."
 ep2_locale_events.1011.average: "\n\nRuce [gambler.Custom('CZ_FirstNameNoTooltip_G')] se lehce zachvějí. Vítězoslavně otevírám ústa, jenže v [Select_CString(gambler.IsFemale,'jejích','jeho')] očích cosi zajiskří. Prozradilo [Select_CString(gambler.IsFemale,'ji','ho')] to zachvění? Nebo ten pohled? Dá se z toho vůbec něco vyčíst?"
 ep2_locale_events.1011.deceitful: "\n\nPohled [gambler.Custom('CZ_FirstNameNoTooltip_G')] se mi zavrtává do očí, v [Select_CString(gambler.IsFemale,'její','jeho')] tváři není ani stopa po nějakém citu. Uhnu pohledem a zkoumám řeč těla, ale to už bych stejně dobře [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] pozorovat sochu."
 ep2_locale_events.1011.a: "Můj hod je... vyšší!"
 ep2_locale_events.1011.b: "Můj hod je nižší."
 ep2_locale_events.1012.t: "$tournament_locale_tavern$: Druhé kolo"
 ep2_locale_events.1012.opening.win: "Odkryjeme kostky. Chvíli nám trvá, než si oba uvědomíme, že jsem [Select_CString(ROOT.Char.IsFemale,'vyhrála','vyhrál')]!\n\n„Ha! Dobrý odhad! První kolo je tvoje!“ Na rtech [gambler.Custom('CZ_FirstName_G')] se objeví úsměv, k očím ale nedosáhne. „Další kolo!“ Kostky opět zachrastí v kalíšcích."
 ep2_locale_events.1012.opening.lose: "Odkryjeme kostky. Chvíli nám trvá, než si oba uvědomíme, že jsem [Select_CString(ROOT.Char.IsFemale,'prohrála','prohrál')]. [gambler.GetFirstName] se pyšně usměje.\n\n„Smůla! Tentokrát tvůj odhad nevyšel. Další kolo!“ Kostky opět zachrastí v kalíšcích."
 ep2_locale_events.1012.opening.draw: "Odkryjeme kostky. Jakmile zvedneme kalíšky, stačí chvilka, abychom spočítali, že nám padlo stejně.\n\n„No dobře. Tak tedy remíza.“ Na tváři [gambler.Custom('CZ_FirstName_G')] se zračí zklamání. „Další kolo!“ Kostky opět zachrastí v kalíšcích."
 ep2_locale_events.1012.dice_reveal: "\n\nZvednu stranu kalíšku blíže k sobě. Jemné rytiny na kostkách odhalí číslo: #BOL [ROOT.Var('root_dice_2').GetValue|0]#!. Položím kalíšek zpět na stůl a zvednu zrak."
 ep2_locale_events.1012.tell.good: "\n\n[gambler.GetFirstName|U] bubnuje prsty po stole. Má to drobné zvednutí hlavy snad něco naznačovat? Rozhodně teď sedí vzpřímeněji než předtím..."
 ep2_locale_events.1012.tell.bad: "\n\nMírné zúžení očí, malé přesunutí váhy. [gambler.GetFirstName] něco skrývá. Možná ten hod není příliš vysoký..."
 ep2_locale_events.1012.average: "\n\nOči [gambler.Custom('CZ_FirstNameNoTooltip_G')] těkají po místnosti a pečlivě se vyhýbají těm mým. Při zvedání kalíšku se [Select_CString(gambler.IsFemale,'jí','mu')] trochu zachvěje ruka. Jenže netuším, jestli to vůbec něco znamená..."
 ep2_locale_events.1012.deceitful: "\n\n[gambler.Custom('CZ_FirstNamePossessiveNoTooltip_M')|U] postoj je sebejistý, skoro až vyzývavý. Vždyť ale ještě ani [Select_CString(gambler.IsFemale,'nezvedla','nezvedl')] kalíšek! Pohledem střelí dolů, prudce ho nakloní od sebe a zase položí na stůl. V [Select_CString(gambler.IsFemale,'jejím','jeho')] vystupování se přitom nezmění vůbec nic."
 ep2_locale_events.1012.a: "Myslím, že vyšší."
 ep2_locale_events.1012.b: "Rozhodně nižší."
 ep2_locale_events.1013.t: "$tournament_locale_tavern$: Rozhodující kolo"
 ep2_locale_events.1013.opening: "Ukážeme kostky zároveň, ale okamžitě je jasné, že bude třeba třetího kola. Chytíme kalíšky a kostky pro závěrečné kolo, kde vítěz bere vše."
 ep2_locale_events.1013.dice_reveal: "\n\nZvednu stranu kalíšku blíže k sobě. Jemné rytiny na kostkách odhalí číslo: #BOL [ROOT.Var('root_dice_3').GetValue|0]#!. Položím kalíšek zpět na stůl a zvednu zrak."
 ep2_locale_events.1013.tell.good: "\n\nVe třetím kole už [gambler.Custom('CZ_FirstName_A')] skoro dokážu přečíst. Když padne vysoké číslo, nepatrně se [Select_CString(gambler.IsFemale,'jí','mu')] rozšíří chřípí. Tím jsem si [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')]. Nebo to jenom předstírá?"
 ep2_locale_events.1013.tell.bad: "\n\n[gambler.GetFirstName|U] si roztržitě přejede rukou po hlavě. Nebo snad zoufale? Padlo tak nízké číslo? Když si všimne mého pohledu, nasadí statečný výraz. #EMP Mohla#! by to být i dvojitá lest..."
 ep2_locale_events.1013.average: "\n\n[gambler.GetFirstNameNoTooltip|U] se mi snaží hledět přímo do očí, ale pohled [Select_CString(gambler.IsFemale,'jí','mu')] uhýbá. Chvějící se ret #EMP něco#! prozrazuje. Jenže co?"
 ep2_locale_events.1013.deceitful: "\n\nNeochvějný klid [gambler.Custom('CZ_FirstName_G')] mě po celou dobu našeho souboje důvtipu nepřestává udivovat. A ani teď tomu není jinak. Ta tvář bez jediné stopy emocí je skoro děsivá. Budu to muset nechat náhodě."
 ep2_locale_events.1013.a: "Věřím svým kostkám. Vyšší!"
 ep2_locale_events.1013.b: "Můj hod je nižší."
 ep2_locale_events.1014.t: "$tournament_locale_tavern$: Dobře vsazeno"
 ep2_locale_events.1014.opening: "Kalíšky se zvedají naposledy. Malé publikum, které se kolem nás shromáždilo, se naklání, aby vidělo...\n\n"
 ep2_locale_events.1014.win: "jsem [Select_CString(ROOT.Char.IsFemale,'vítězka','vítěz')]! [gambler.GetFirstName] se tváří co nejstatečněji, ale rozmrzelost je na [Select_CString(gambler.IsFemale,'ní','něm')] jasně vidět. Posune vsazené měšce na mou stranu stolu a vztekle odkráčí. Jen taktak ještě zachovává slušnost.\n\nOpřu se v židli. Mám ohromnou radost, ale zároveň jsem úplně duševně [Select_CString(ROOT.Char.IsFemale,'vyčerpaná','vyčerpaný')]."
 ep2_locale_events.1014.lose: "jsem [Select_CString(ROOT.Char.IsFemale,'prohrála','prohrál')]! [gambler.GetFirstName] vítězoslavně zajásá a shrábne měšce, které jsme vsadili.\n\n„Příště víc štěstí!“ zahihňá se a s náručí plnou peněz odcupitá pryč.\n\nZklamaně se opřu v židli."
 ep2_locale_events.1014.draw: "máme... remízu? [gambler.GetFirstName] si rozpačitě promne hlavu. Každý si vezmeme zpátky měšce zlata, které na stole čekaly na vítěze.\n\n„Inu, cesty kostek jsou někdy nevyzpytatelné,“ poznamená [gambler.GetFirstNameNoTooltip] a pokrčí rameny. „Každopádně pěkná hra.“ Pak vstane a odejde."
 ep2_locale_events.1014.a: "Hostinský! Dneska já platím!"
 ep2_locale_events.1014.b: "Ach, chuť vítězství!"
 ep2_locale_events.1014.c: "Myslím, že si dám drink, abych utopil starosti."
 ep2_locale_events.1014.d: "Sakra!"
 ep2_locale_events.1014.e: "Nu, asi to tak je."
 ep2_locale_events.1014.f: "Po tomhle by se mi hodilo něco k pití!"
 ep2_locale_events.1050.t: "$tournament_locale_tavern$: [Select_CString(ROOT.Char.IsFemale,'Hazardérka','Hazardér')]?"
 ep2_locale_events.1050.desc: "Sotva vkročím do krčmy, už mě někdo oslovuje. [wealthy_gambler.GetFirstName] mě poplácá po rameni, odtáhne do odlehlého kouta a spiklenecky ztiší hlas.\n\n„Účastníš se turnajových klání, že?“ Ani nepočká na mé přikývnutí a pokračuje: „Víš, uzavírám takovou neobvyklou sázku. Jeden můj... obchodní společník si totiž myslí, že jsi trochu #EMP bábovka#!.“ Má protesty zarazí mávnutím ruky.\n\n„Samozřejmě hájím tvou čest, [ROOT.Char.Custom('FormOfAddressForLiege')|l]! Prý máš tolik odvahy, že na turnaji nastoupíš bez přilby! A kdyby se to snad dalo #EMP zaručit#!, no... jistě bych se [Select_CString(wealthy_gambler.IsFemale,'mohla','mohl')] postarat, aby se ti to vyplatilo...“"
 ep2_locale_events.1050.a: "Není to náhodou parta tvých spoluhazardníků tamhle?"
 ep2_locale_events.1050.a.tt: "Možná by se o téhle malé domluvě rádi dozvěděli. Ledaže by se našlo dost mincí na umlčení jazyka..."
 ep2_locale_events.1050.b: "#EMP Zbabělec?!#! Budu soutěžit i bez těch zatracených #EMP rukavic!#!"
 ep2_locale_events.1050.c: "Ty peníze by se mi hodily..."
 ep2_locale_events.1050.d: "Jak hanebná nabídka!"
 ep2_locale_events.1500.t: "$tournament_locale_religious_building$: Kéž mi [ROOT.Char.GetFaith.HighGodName] přeje"
 ep2_locale_events.1500.host_faith: "[tournament_priest.GetFirstName|U] ustoupí, abych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] dál. Nedaleko turnajového kolbiště stojí [ROOT.Char.GetFaith.HouseOfWorship|l] a já si tu dopřeji chvíli tichého rozjímání o samotě."
 ep2_locale_events.1500.other_faith: "Dopřeji si chvilku o samotě v provizorní svatyni zasvěcené mé [ROOT.Char.GetFaith.GetAdjectiveNoTooltip|l] víře. Nedaleko stojí [activity.GetCurrentPhase.GetCurrentLocation.GetFaith.HouseOfWorship|l] zdejších věřících. To vše [CZPrepV(activity.GetCurrentPhase.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(activity.GetCurrentPhase.GetLocation,'L')]. [tournament_priest.GetFirstName] se drží v uctivé vzdálenosti."
 ep2_locale_events.1500.desc: "\n\nNade mnou bdí [ROOT.Char.GetFaith.PantheonTerm] a já v rozjímání přemýšlím, co si vlastně v hloubi duše od těchto dnů veselí slibuji."
 ep2_locale_events.1500.a: "Kéž mi [ROOT.Char.GetFaith.WarGodName] přinese slávu."
 ep2_locale_events.1500.b: "Ztrpči život [bad_prayer_target.Custom('CZ_FirstNameNoTooltip_G')]! [ROOT.Char.Custom2('RelationToMeShort', bad_prayer_target)|U] si to zaslouží."
 ep2_locale_events.1500.c: "Dopřej štěstí [good_prayer_target.Custom('CZ_FirstNameNoTooltip_D')]. [ROOT.Char.Custom2('RelationToMeShort', good_prayer_target)|U] ať má tvou přízeň."
 ep2_locale_events.1500.d: "Potrestej [backup_prayer_target.Custom('CZ_FirstNameNoTooltip_A')]! [ROOT.Char.Custom2('RelationToMeShort', backup_prayer_target)|U] si to zaslouží!"
 ep2_locale_events.1500.e: "Veď ruku [backup_prayer_target.Custom('CZ_FirstNameNoTooltip_G')]. [ROOT.Char.Custom2('RelationToMeShort', backup_prayer_target)|U] ať se nemýlí."
 ep2_locale_events.1500.f: "Vítězství pro [wager_prayer_target.Custom('CZ_FirstNameNoTooltip_A')] i pro můj měšec!"
 ep2_locale_events.1500.g: "Pomoz mi nalézt vnitřní klid."
 ep2_locale_events.1501.t: "$tournament_locale_religious_building$: Zbožnost na odiv"
 ep2_locale_events.1501.desc: "Hledám radu a vnitřní klid. Mé kroky proto vedou tam, kde stojí [ROOT.Char.GetFaith.HouseOfWorship|l]. Štěstí mi ale přeje mnohem zajímavější objev: u dveří zasněně postává [seduce_target.GetFirstName].\n\nVěnuje mi letmý úsměv, myšlenkami je však zjevně jinde. Právě teď mám skvělou příležitost získat si [Select_CString(seduce_target.IsFemale,'ji','ho')] okázalým projevem zbožnosti!\n\nNebo... snad ne? Co by se [Select_CString(seduce_target.IsFemale,'jí','mu')] líbilo víc? Třeba má raději zdrženlivost?"
 ep2_locale_events.1501.a: "Prokážu svou oddanost bez pochyb!"
 ep2_locale_events.1501.a.tt: "Má náboženská horlivost nezná mezí, [Select_CString(seduce_target.IsFemale,'nejdražší','nejdražší příteli')] [seduce_target.Custom('CZ_FirstNameNoTooltip_V')]!"
 ep2_locale_events.1501.a.success: "Tvé vystoupení zapůsobí."
 ep2_locale_events.1501.a.failure: "[seduce_target.GetFirstNameNoTooltip|U] je tvým předvedením [Select_CString(seduce_target.IsFemale,'odrazena','odrazen')]"
 ep2_locale_events.1501.b: "Myslím, že [seduce_target.GetFirstNameNoTooltip] je trochu uvolněnější."
 ep2_locale_events.1501.b.tt: "Nenápadné protočení očí a vědoucí úsměšek při obřadu by měly [seduce_target.Custom('CZ_FirstNameNoTooltip_D')] říct vše."
 ep2_locale_events.1501.b.success: "[seduce_target.GetFirstName|U] se raduje z tvého cynismu"
 ep2_locale_events.1501.b.failure: "[seduce_target.GetFirstNameNoTooltip|U] je [Select_CString(seduce_target.IsFemale,'zděšena','zděšen')] tvým odpadlictvím"
 ep2_locale_events.1501.c: "Možná bych se [Select_CString(ROOT.Char.IsFemale,'měla','měl')] prostě zvednout a odejít."
 ep2_locale_events.1510.t: "$tournament_locale_religious_building$: Svatokrádežná veselice"
 ep2_locale_events.1510.desc: "Nad věřícími shromážděnými k dennímu obřadu se rozhostí ticho. Klid však náhle prolomí blížící se křik a halas.\n\nDveře se rozletí a dovnitř, kde stojí [ROOT.Char.GetFaith.HouseOfWorship|l], vpadne tucet rozesmátých hýřilů,"
 ep2_locale_events.1510.alcohol: "s korbelemi a sudy v rukou."
 ep2_locale_events.1510.hashish: "páchnoucí po hašiši."
 ep2_locale_events.1510.closing: "\n\n[instigator_scope.GetTitledFirstName|U], zjevně původce celého rozruchu, se připitoměle usmívá. „Co je to tady?! Kde máte muziku?“\n\n[tournament_priest.GetFirstName] jen stojí jako solný sloup. Nevěří vlastním očím."
 ep2_locale_events.1510.a: "To je svatokrádež! Stráž, zatkněte je!"
 ep2_locale_events.1510.b: "Veselice? Řekl tu někdo veselice?"
 ep2_locale_events.1510.c: "Vyžeňte to odporné stvoření! [instigator_scope.GetFaith.GetAdjectiveNoTooltip|U] víra sem nepatří, takový [instigator_scope.Custom('GetUnbelieverName')|l] také ne!"
 ep2_locale_events.1510.d: "Vypadněte, vy roztomilí rváči."
 ep2_locale_events.2001.t: "$tournament_locale_armorer$: Sláva nebo účinnost?"
 ep2_locale_events.2001.desc: "Položím na pult svou zbroj, [improve_armour.GetName], a [tournament_armorer.GetFirstName] po ní přejede rukou.\n\n„Tohle už má něco za sebou. Dlouho se ti o zbroj nikdo nepostaral, že?“ povzdechne si a pohlédne na rozdělané zakázky.\n\n„Moc času nemám. Snad by se dala vyleštit, nebo aspoň promazat a trochu udržovat. Co si přeješ?"
 ep2_locale_events.2001.a: "Vylešti to do zrcadlového lesku!"
 ep2_locale_events.2001.a.tt: "[improve_armour.GetName|U] získá modifikátor [Concept('prestige','prestiže')|E]"
 ep2_locale_events.2001.b: "Raději ji promaž a dej do pořádku."
 ep2_locale_events.2001.b.tt: "[improve_armour.GetName|U] získá modifikátor [Concept('prowess','udatnosti')|E]"
 ep2_locale_events.2001.c: "V současném stavu je v pořádku."
 ep2_locale_events.2002.t: "$tournament_locale_armorer$: Opotřebené řemeny"
 ep2_locale_events.2002.desc: "[tournament_armorer.GetFirstName|U] mi s úsměvem předloží zbroj, [armour.GetName]. Když ji zvednu proti světlu, celá se zaleskne.\n\nTeprve při placení si všimnu, že po boku [Select_CString(tournament_armorer.IsFemale,'spokojené řemeslnice','spokojeného řemeslníka')] stojí [Select_CString(apprentice.IsFemale,'mladá učednice','mladý učeň')]. Zatímco se mince přesouvají do měšce, nenápadně se ke mně přitočí.\n\n„Promiň, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')], ale...“ Ukáže na kožené řemeny zbroje. „Koželuhovi za ošetření kůže [Select_CString(tournament_armorer.IsFemale,'nezaplatila','nezaplatil')].“\n\nProhlédnu si je zblízka. Není pochyb. Kůže je roztřepená a obnošená, rozhodně ne nová. V pozadí cinká zbrojířský měšec, do kterého právě padají mé zlaťáky."
 ep2_locale_events.2002.a: "Tak mě oklamat nenecháš, [tournament_armorer.Custom('CZ_FirstNameNoTooltip_V')]."
 ep2_locale_events.2002.b: "[tournament_armorer.Custom('CZ_FirstNameNoTooltip_V')|U]! Co to má znamenat?"
 ep2_locale_events.2002.b.success: "[tournament_armorer.GetFirstNameNoTooltip|U] neochotně provede opravu"
 ep2_locale_events.2002.b.failure: "[tournament_armorer.GetFirstNameNoTooltip|U] se z toho vykroutí"
 ep2_locale_events.2002.c: "Zaplatím za kvalitní popruhy."
 ep2_locale_events.2002.d: "Na tohle nemám čas."
 ep2_locale_events.2010.t: "$tournament_locale_armorer$: Obranné dary"
 ep2_locale_events.2010.desc: "Zbrojířská dílna přetéká všemožnou výstrojí. Svrchní i spodní, lacinou i drahou a vším mezi tím.\n\nKdyž si prohlížím předměty, které mohou zachránit život, neustále přitom myslím na [befriend_target.Custom('CZ_FirstName_A')].\n\n#EMP Něco#! by tu [Select_CString(befriend_target.IsFemale,'ji','ho')] jistě potěšilo. Ale co?"
 ep2_locale_events.2010.a: "Užitečné brnění."
 ep2_locale_events.2010.a.tt: "#F Zaujmi [befriend_actor.Custom('CZ_FirstNameNoTooltip_A')] něčím, co ocení pro svou opatrnost.#!"
 ep2_locale_events.2010.b: "Tento ozdobný štít by se [Select_CString(befriend_actor.IsFemale,'jí','mu')] mohl líbit."
 ep2_locale_events.2010.b.tt: "#F Zaujmi [befriend_actor.Custom('CZ_FirstNameNoTooltip_A')] něčím, co polichotí [Select_CString(befriend_actor.IsFemale,'její','jeho')] pýše.#!"
 ep2_locale_events.2010.c: "Speciálně vyrobená turnajová přilba."
 ep2_locale_events.2010.c.tt: "#F Zaujmi [befriend_actor.Custom('CZ_FirstNameNoTooltip_A')] něčím, co osloví [Select_CString(befriend_actor.IsFemale,'její','jeho')] soutěživost.#!"
 ep2_locale_events.2010.d: "Najdu jiný způsob, jak na [Select_CString(befriend_target.IsFemale,'ni','něj')] zapůsobit."
 ep2_locale_events.2011.reply_armor: "Uvnitř leží zbroj typu [newly_created_artifact.GetType|l]. Kvalitní práce, i když trochu prostá.\n\n"
 ep2_locale_events.2011.reply_shield: "Uvnitř je čerstvě potažený štít, ozdobený rodovým erbem.\n\n"
 ep2_locale_events.2011.reply_tournament: "Uvnitř je speciálně vyrobená turnajová přilba, nabízející větší ochranu, než je praktické na bojišti.\n\n"
 ep2_locale_events.2011.opening: "U mého stanu se náhle objeví [befriend_actor.GetTitledFirstName] s velkým balíkem v náručí. „To je pro tebe, [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')],“ pronese s vřelým úsměvem. Dárek?\n\n"
 ep2_locale_events.2011.success_armor: "$ep2_locale_events.2011.reply_armor$Pěkná souprava, očividně bytelně zpracovaná, a navíc už teď docela dobře padne."
 ep2_locale_events.2011.armor: "$ep2_locale_events.2011.reply_armor$To je ale ošklivý slepenec. Copak by trocha vykládání stála tolik?"
 ep2_locale_events.2011.success_shield: "$ep2_locale_events.2011.reply_shield$Bytelný kus s krásně malovaným erbem, přestože má jen viset na stěně."
 ep2_locale_events.2011.shield: "$ep2_locale_events.2011.reply_shield$Štít. Na co bych #EMP já#! štít [Select_CString(ROOT.Char.IsFemale,'potřebovala','potřeboval')]?"
 ep2_locale_events.2011.success_tournament: "$ep2_locale_events.2011.reply_tournament$Je to šikovná věc, přizpůsobená potřebám soutěže spíše než boji."
 ep2_locale_events.2011.tournament: "$ep2_locale_events.2011.reply_tournament$Upřímně, kdo bere tyhle malé soutěže tak vážně, že musí podvádět tímto způsobem?"
 ep2_locale_events.2011.a: "Musím uznat, že ten dárek se povedl."
 ep2_locale_events.2011.b: "„Och... velmi... zajímavý předmět.“"
 ep2_locale_events.2012.opening: "[befriend_target.GetTitledFirstName|U] převezme těžký balík s úsměvem. Z nečekaného daru má zjevnou radost.\n\n"
 ep2_locale_events.2012.success_reply: "Při prohlížení dárku ze všech stran nedokáže skrýt vděčnost."
 ep2_locale_events.2012.reply: "Při jeho prohlížení už ale tak nadšeně nevypadá."
 ep2_locale_events.2012.success_armor: "\n\n„To je krásná výstroj! V tomhle bych se [Select_CString(befriend_target.IsFemale,'nebála','nebál')] žádné bitvy!“"
 ep2_locale_events.2012.armor: "„Och... brnění... aspoň se hodí.“"
 ep2_locale_events.2012.success_shield: "\n\n„Podívej na to! Hned to vystavím ve svém stanu!“"
 ep2_locale_events.2012.shield: "„Štít... velmi dobré... děkuji.“"
 ep2_locale_events.2012.success_tournament: "„Jak chytré provedení! Určitě to v soutěžích nosit budu!“"
 ep2_locale_events.2012.tournament: "„Aha, na soutěže, říkáš? No dobře...“"
 ep2_locale_events.2012.success: "\n\nSrdečně mi poděkuje. Myslím, že jsem [Select_CString(ROOT.Char.IsFemale,'vybrala','vybral')] správně!"
 ep2_locale_events.2012.failure: "\n\nStroze mi poděkuje. Možná jsem [Select_CString(ROOT.Char.IsFemale,'vybrala','vybral')] špatně..."
 ep2_locale_events.2012.a: "[Select_CString(ROOT.Char.IsFemale,'Věděla','Věděl')] jsem to!"
 ep2_locale_events.2012.b: "Alespoň [Select_CString(tournament_armorer.IsFemale,'zbrojířka byla spokojená','zbrojíř byl spokojený')]..."
 ep2_locale_events.2050.t: "$tournament_locale_armorer$: Zářivá zbroj"
 ep2_locale_events.2050.desc: "Když [tournament_armorer.GetFirstName] spatří mou zbroj, dá si ruce v bok a zhluboka si oddechne.\n\n„No, to bude pořádná práce. Ale s mým #EMP nevídaným#! nadáním to samozřejmě nebude trvat dlouho!“ Zazubí se na mě. Pohlédnu na zbroj. Mně připadá v pořádku. [tournament_armorer.GetFirstNameNoTooltip] si všimne mé nedůvěry a zavrtí hlavou.\n\n„Kdepak, potřebuje důkladně prohlédnout. Jinak bych to přece [Select_CString(tournament_armorer.IsFemale,'nenavrhovala','nenavrhoval')]!“"
 ep2_locale_events.2050.a: "Dobře, ukaž své umění."
 ep2_locale_events.2050.a.success: "Tvé brnění je vylepšeno"
 ep2_locale_events.2050.a.critsuccess: "Tvé brnění je výrazně vylepšeno"
 ep2_locale_events.2050.a.armour1: "[Concept('prowess','Udatnost')|EU] se zvýší o #color_green +1#!"
 ep2_locale_events.2050.a.durability1: "[Concept('durability','Trvanlivost')|EU] se zvýší o #color_green +5#!"
 ep2_locale_events.2050.a.armour1.tt: "[Concept('prowess','Udatnost')|EU] se zvýší o #color_dark_green +1#!"
 ep2_locale_events.2050.a.durability1.tt: "[Concept('durability','Trvanlivost')|EU] se zvýší o #color_dark_green +5#!"
 ep2_locale_events.2050.a.criticalsuccess: "Tvé brnění je znatelně vylepšeno"
 ep2_locale_events.2050.a.armour2: "[Concept('prowess','Udatnost')|EU] se zvýší o #color_green +2#!"
 ep2_locale_events.2050.a.durability2: "[Concept('durability','Trvanlivost')|EU] se zvýší o #color_green +10#!"
 ep2_locale_events.2050.a.prestige2: "Měsíční [Concept('prestige','prestiž')|E] se zvýší o #color_green +0.04%#!"
 ep2_locale_events.2050.a.armour2.tt: "[Concept('prowess','Udatnost')|EU] se zvýší o #color_dark_green +2#!"
 ep2_locale_events.2050.a.durability2.tt: "[Concept('durability','Trvanlivost')|EU] se zvýší o #color_dark_green +10#!"
 ep2_locale_events.2050.a.prestige2.tt: "Měsíční [Concept('prestige','prestiž')|E] se zvýší o #color_dark_green +0.04%#!"
 ep2_locale_events.2050.a.failure: "Oprava tvého brnění je zpackaná"
 ep2_locale_events.2050.a.durability3: "[Concept('durability','Trvanlivost')|EU] se sníží o #color_red -5#!"
 ep2_locale_events.2050.b: "Myslím, že to bude v pořádku."
 ep2_locale_events.2500.t: "$tournament_locale_tailor$: Chybný erb"
 ep2_locale_events.2500.desc: "Při prohlížení vystaveného zboží v krejčovské dílně zahlédnu mezi hromadami oděvů a drobností pečlivě zabalený balíček.\n\nNa požádání se ochotně otevře. Pod opatrně rozvázanými koženými řemínky se ukáže nádherně vyšívaný erb rodu #EMP [tailor_mixup.GetHouse.GetBaseName]#!."
 ep2_locale_events.2500.a.rival: "Ti psi z rodu [tailor_mixup.GetHouse.GetBaseNameNoTooltip]! Spal to, #EMP zaplatím#! ti!"
 ep2_locale_events.2500.a: "Udělej mi laskavost a spal to, ano?"
 ep2_locale_events.2500.b: "Poslyš, vezmu si to. Ale ani slovo."
 ep2_locale_events.2500.b.tt: "Tento modifikátor zvýší tvou [Concept('success_chance','šanci na úspěch')|E] [Concept('hostile_scheme','nepřátelských intrik')|E] proti rodu [tailor_mixup.GetHouse.GetName]"
 ep2_locale_events.2500.c: "Nádhera... Já ale chci erb rodu [ROOT.Char.GetHouse.GetNameNoTooltip]!"
 ep2_locale_events.2500.d: "Velmi pěkná práce..."
 ep2_locale_events.2501.t: "$tournament_locale_tailor$: Papežské roucho"
 ep2_locale_events.2501.desc: "V krejčovské dílně nabízejí látky od hrubého konopí po nejjemnější damašek, samet a hedvábí. Prohlížíme si je společně. Po mém boku stojí [random_knight.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', random_knight)|l], když mě zarazí podivně povědomý vzor.\n\nZvednu celé roucho proti světlu a vytřeštím oči. Je to dokonalá napodobenina papežského oděvu!\n\n„Máme i kardinálské, [ROOT.Char.Custom('FormOfAddressForLiege')|l]!“ Za námi postává [tournament_tailor.GetFirstName]. Oči [random_knight.Custom('CZ_FirstNameNoTooltip_G')] září pobavením a do žeber se mi zavrtává nedočkavý loket. Znovu se ozve hlas: \n\n„A k tomu patří i klobouk.“"
 ep2_locale_events.2501.a: "#EMP PRODÁNO!#!"
 ep2_locale_events.2501.a.tt: "Ty i tví [Concept('knights','rytíři')|E] si obléknete nová roucha..."
 ep2_locale_events.2501.b: "To je rouhání!"
 ep2_locale_events.2502.t: "$tournament_locale_tailor$: Bojové roucho"
 ep2_locale_events.2502.desc: "Mlčky zírám na [Select_CString(tournament_tailor.IsFemale,'neochvějnou krejčovou','neochvějného krejčího')] a pohledem prosím o zopakování té největší hlouposti, jakou jsem dnes [Select_CString(ROOT.Char.IsFemale,'slyšela','slyšel')].\n\n„Soubojový plášť. To o něm slyšíš poprvé?“ [tournament_tailor.GetFirstName] zavrtí hlavou, jako bych tu #EMP já#! [Select_CString(ROOT.Char.IsFemale,'byla za hlupačku','byl za hlupáka')]. „Usnadňuje pohyb, odvádí pot při boji a mezi koly tě udrží v teple a v pohotovosti. Všichni velcí bojovníci ho mají!“\n\nPo tomhle horlivém vychvalování se zase zadívám na plášť v rukou. Látka je očividně kvalitní a odolná, ale... #EMP soubojový plášť? Vážně?#!"
 ep2_locale_events.2502.a: "I když mi rozum říká něco jiného... beru."
 ep2_locale_events.2502.b: "Ty mě snad máš za hlupáka!"
 ep2_locale_events.2502.b.tt: "Jen by se to všude zachytávalo!"
 ep2_locale_events.2510.t: "$tournament_locale_tailor$: Vyšívané dary"
 ep2_locale_events.2510.desc: "Prohlížím si role vzácných látek a vzorníky visící u krejčovského stánku. Vybere si tu každý, od nejnáročnějšího po nejskromnějšího.\n\nPři pohledu na tu parádu přemýšlím, co by asi [Select_CString(befriend_target.IsFemale,'ocenila','ocenil')] [befriend_target.GetFirstName].\n\n#EMP Něco#! by se tu [Select_CString(befriend_target.IsFemale,'jí','mu')] určitě zalíbilo..."
 ep2_locale_events.2510.a: "Pěkný prapor."
 ep2_locale_events.2510.a.tt: "#F Zaujmi [befriend_target.Custom('CZ_FirstNameNoTooltip_A')] něčím, co polichotí [Select_CString(befriend_target.IsFemale,'její','jeho')] pýše.#!"
 ep2_locale_events.2510.b: "Není nic užitečnějšího než gambeson."
 ep2_locale_events.2510.b.tt: "#F Zaujmi [befriend_target.Custom('CZ_FirstNameNoTooltip_A')] něčím, co ocení pro svou bojovnost.#!"
 ep2_locale_events.2510.c: "Tyto rukavice z laní kůže jsou velmi jemné."
 ep2_locale_events.2510.c.tt: "#F Zaujmi [befriend_target.Custom('CZ_FirstNameNoTooltip_A')] něčím, co osloví [Select_CString(befriend_target.IsFemale,'její','jeho')] něžnou stránku.#!"
 ep2_locale_events.2510.d: "Možná jindy."
 ep2_locale_events.2511.reply_banner: "Uvnitř je složený prapor z jemné látky s tvým erbem.\n\n"
 ep2_locale_events.2511.reply_gambeson: "Uvnitř je prošívaný gambeson, odolná košile nošená pod kroužkovou zbrojí.\n\n"
 ep2_locale_events.2511.reply_glove: "Uvnitř je pár měkkých, jemně ušitých rukavic z laní kůže.\n\n"
 ep2_locale_events.2511.opening: "Jako zničehonic se objeví [befriend_actor.GetTitledFirstName] a s úsměvem mi slavnostně podá složený balíček. Dárek?\n\n"
 ep2_locale_events.2511.success_banner: "$ep2_locale_events.2511.reply_banner$Nemám mu co vytknout. Můj erb je vyšitý přesně a vkusně."
 ep2_locale_events.2511.banner: "$ep2_locale_events.2511.reply_banner$Můj nedostatek nadšení je zřejmý, k čemu to potřebuji?"
 ep2_locale_events.2511.success_gambeson: "$ep2_locale_events.2511.reply_gambeson$Při pečlivém prohlédnutí je to výtečný kousek; mnohovrstevný a zjevně odolný."
 ep2_locale_events.2511.gambeson: "$ep2_locale_events.2511.reply_gambeson$Tohle bych [Select_CString(ROOT.Char.IsFemale,'sehnala','sehnal')] u každého obyčejného tkalce. Co s tím?"
 ep2_locale_events.2511.success_glove: "$ep2_locale_events.2511.reply_glove$Jsou hebké jako samet a nějak mi téměř dokonale padnou."
 ep2_locale_events.2511.glove: "$ep2_locale_events.2511.reply_glove$Jak... jemné..."
 ep2_locale_events.2511.a: "Nemohu si pomoci a usměju se, to je dokonalé!"
 ep2_locale_events.2511.b: "„Já... děkuji...“"
 ep2_locale_events.2512.opening: "[befriend_target.GetTitledFirstName|U] s díky přijme můj balíček a začne jej rozbalovat. Snaží se o opatrnost, ale nedočkavost je silnější.\n\n"
 ep2_locale_events.2512.success_reply: "[Select_CString(befriend_target.IsFemale,'Její','Jeho')] oči se při jeho spatření okamžitě rozzáří. Dobré znamení."
 ep2_locale_events.2512.reply: "Nemohu odhadnout [Select_CString(befriend_target.IsFemale,'její','jeho')] reakci, zdá se, jako by se vůbec nezměnila."
 ep2_locale_events.2512.success_banner: "\n\n„To je skvělé! Tak šikovné vyšívání zvýrazňuje vzor!“"
 ep2_locale_events.2512.banner: "„Oh, prapor. Zavěsím ho... hned.“"
 ep2_locale_events.2512.success_gambeson: "\n\n„Co za skvělou práci, to by zastavilo téměř každý úder kromě toho nejsilnějšího.“"
 ep2_locale_events.2512.gambeson: "„Já... přidám to ke svým ostatním...“"
 ep2_locale_events.2512.success_glove: "„Proboha, ty jsou dokonalé! Jak jsi to [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')]?!“"
 ep2_locale_events.2512.glove: "„Ó, rukavice... velmi pěkné...“"
 ep2_locale_events.2512.success: "\n\nNež se rozejdeme, zahrne mě srdečnými díky."
 ep2_locale_events.2512.failure: "\n\nStroze mi poděkuje a odejde..."
 ep2_locale_events.2512.a: "To dopadlo dobře."
 ep2_locale_events.2512.b: "No nic..."
 ep2_locale_events.2560.t: "$tournament_locale_tailor$: Nový nákup"
 ep2_locale_events.2560.desc.intro: "Zastihnu [tailor.Custom('CZ_TitledFirstName_A')] při stříhání látky. Na několika stolech leží vystavená hotová práce: punčochy, pokrývky hlavy, kapuce i rukávy. Naproti tiše plápolá oheň v krbu.\n\n"
 ep2_locale_events.2560.desc.previous_artifact: "„Hledáš něco na ozdobu svého oděvu, [ROOT.Char.Custom('FormOfAddressForLiege')|l]? Vidím, že s sebou máš i nějaké artefakty z hlavního města... Dovolíš mi se podívat? Už dlouho mě zajímá práce mistrů z [capital_barony.Custom('CZ_LandedNameNoTooltip_G')].“"
 ep2_locale_events.2560.desc.new_artifact: "„Pozor!“ vyhrkne a málem upustí nástroj. „Skoro jsi [Select_CString(ROOT.Char.IsFemale,'zakopla','zakopl')] o to plátno, [ROOT.Char.Custom('FormOfAddressForLiege')|l],“ zamumlá omluvně a rychle začne sbírat oděvy. „Důvod tvé návštěvy ovšem nejspíš uhádnu.“ Zpod hromady sotva vykukuje [Select_CString(tailor.IsFemale,'její','jeho')] tvář."
 ep2_locale_events.2560.desc.new_artifact_2: "„Hledá [Select_CString(ROOT.Char.IsFemale,'má paní','můj pán')] něco konkrétního?“ [tailor.Custom('quirk_pos_standalone')|l]. Kolekce po [Select_CString(tailor.IsFemale,'jejím','jeho')] boku je opravdu působivější, než jsem [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')]."
 ep2_locale_events.2560.a: "„Vlastně by se mi hodilo přizdobit [previous_artifact.GetNameNoTooltip]...“"
 ep2_locale_events.2560.b: "„Je [purchasable_trinket.GetNameNoTooltip] na prodej?“"
 ep2_locale_events.2560.c: "„To za to mám #EMP platit#!?“"
 ep2_locale_events.2560.c.success: "Zastrašíš [tailor.Custom('CZ_ShortUIName_A')]"
 ep2_locale_events.2560.c.failure: "[tailor.GetShortUIName|U] se [Select_CString(tailor.IsFemale,'nedá zastrašit','nenechá zastrašit')]"
 ep2_locale_events.2560.d: "„Pár praporů povzbudí diváky, aby mi fandili!“"
 ep2_locale_events.2560.e: "„Tady, pokračuj v dobré práci.“"
 feather_trinket: "Zářivé pírko"
 feather_trinket.desc: "Bohatě zbarvené pírko, které prý patřilo pávu. Exotická ozdoba."
 chess_trinket: "Šachová figurka"
 chess_trinket.desc: "Krásná figurka vyřezaná z horského křišťálu. Kvůli abstraktnímu tvaru těžko říct, co vlastně představuje."
 ribbon_trinket: "Ozdobná stuha"
 ribbon_trinket.desc: "Pruh hedvábí, vyšívaný květinovými vzory. Skvělý dar."
 glass_orb_trinket: "Skleněná koule"
 glass_orb_trinket.desc: "Křišťálová koule. Nikdy nebude úplně průhledná."
 tapestry_trinket: "Tapiserie s ovcemi"
 tapestry_trinket.desc: "Tapiserie s výjevem z pastviny. Zvířata pijí z poklidného potoka."
 tournament_banners_modifier: "Turnajové prapory"
 tournament_banners_modifier_desc: "Tato postava nechala vyrobit prapory pro publikum."
 ep2_locale_events_artifact_decoration_desc: "[previous_artifact.GetDesc]\n\nPřibyla ozdobná stuha s květinovým vzorem."
 artifact_monthly_prestige_3_modifier: "Dekorativní stuha"
 ep2_locale_events.3001.t: "$tournament_locale_visitor_camp$: Ukradený okamžik"
 ep2_locale_events.3001.desc: "Konečně mám chvíli o samotě ve stanu s [lover.Custom('CZ_FirstName_I')], daleko od turnajového ruchu. Přepadne mě nesmírná únava. Klesnu na přikrytou slaměnou podestýlku a mysl mě bolí stejně jako tělo.\n\nSlyším, jak [lover.GetFirstNameNoTooltip] cosi šeptá strážnému. Něco o tom, ať nás nikdo neruší. Za chvíli už vedle sebe cítím teplo [Select_CString(lover.IsFemale,'jejího','jeho')] těla.\n\n„Vypadáš tak unaveně, lásko.“ V hlase slyším starost. „Před soutěžemi si musíš odpočinout. Zůstaneš tu se mnou chvíli, prosím?“"
 ep2_locale_events.3001.a: "#EMP Zas tak#! [Select_CString(ROOT.Char.IsFemale,'unavená','unavený')] nejsem..."
 ep2_locale_events.3001.b: "To bych [Select_CString(ROOT.Char.IsFemale,'ráda','rád')]."
 ep2_locale_events.3001.c: "Musím se připravit!"
 ep2_locale_events.3002.t: "$tournament_locale_visitor_camp$: Nestydatí válečníci"
 ep2_locale_events.3002.desc: "Co je to za zvuky? Chichotání... a sténání? #EMP Zní#! to, jako by vycházely z tamtoho stanu.\n\nZvědavost je silnější než já. Odhrnu vchodovou plachtu a naskytne se mi... vskutku zajímavý pohled.\n\n[lech1.GetTitledFirstName|U], [Select_CString(lech1.IsFemale,'přistižená','přistižený')] přímo #EMP in flagrante#!, zpanikaří a odstrčí od sebe milující protějšek. Ve zpoceném šeru leží i [lech2.GetTitledFirstName] a [lech3.GetTitledFirstName]. I ti se horečně vyprošťují z objetí svých nahých, svalnatých milenců."
 ep2_locale_events.3002.a: "Je tu místo i pro mě?"
 ep2_locale_events.3002.b: "Blázni! Měli byste trávit svůj čas #EMP přípravou#!!"
 ep2_locale_events.3002.c: "Nenechte mě vás rušit!"
 ep2_locale_events.3002.c.tt: "Nejlepší je je nechat být, že?"
 ep2_locale_events.3500.t: "$tournament_locale_farrier$: Malé píchnutí"
 ep2_locale_events.3500.desc: "Před zahájením soutěže [activity.GetCurrentPhase.GetPhase.GetName|l] přivedu koně nechat znovu okovat. Pozorně sleduji, jak učeň [tournament_farrier.Custom('CZ_FirstName_G')] ořezává kopyta mého drahocenného zvířete.\n\nZ toho mladíka nemám dobrý pocit. A skutečně, hned první hřebík je příliš dlouhý. Zvíře zuřivě vykopne, jen o vlásek mine [tournament_farrier.Custom('CZ_FirstNameNoTooltip_A')] a pak bolestivě kulhá po dílně.\n\n"
 ep2_locale_events.3500.war: "Učeň se rozběhne za koněm jménem #EMP [ROOT.Char.Custom('ContestHorseRaceName')]#!. Ten [ROOT.Char.Custom('HorseStoryMareStallion')|l] potřebuje novou podkovu. Hned."
 ep2_locale_events.3500.race: "Učeň se rozběhne za koněm jménem #EMP [ROOT.Char.Custom('ContestHorseRaceName')]#!. Nová podkova je pro zvíře, jako je tenhle [ROOT.Char.Custom('ContestHorseRaceGender')|l], nutná. Hned."
 ep2_locale_events.3500.other: "Učeň se za zvířetem rozběhne. [ROOT.Char.Custom('ContestHorseRaceHerHim')|U] teď musí nasadit novou podkovu. [ROOT.Char.Custom('ContestHorseRaceGender')|U] přece nemůže zůstat bez ní."
 ep2_locale_events.3500.a: "[ROOT.Char.Custom('ContestHorseRaceSheHe')|U] má cenu přes pět tvých ročních platů, hlupáku!"
 ep2_locale_events.3500.a.war_horse: "[ROOT.Char.Custom('HorseStorySheHe')|U] má cenu přes pět tvých ročních platů, hlupáku!"
 ep2_locale_events.3500.b: "Ten učeň už nikdy nebude pracovat v mém panství!"
 ep2_locale_events.3500.c: "Očekávám, že to bude zdarma!"
 ep2_locale_events.3500.d: "Příště buďte opatrnější."
 every_attending_contestant_tt: "Každý soutěžící"
 ep2_locale_events.4000.t: "$tournament_locale_bowyer$: Událost lukostrojce"
 ep2_locale_events.4000.desc: "Miluji pěkný šíp!"
 ep2_locale_events.4000.a: "Opeřit"
 ep2_locale_events.4000.b: "Neopeřit"
 ep2_locale_events.4001.t: "$tournament_locale_bowyer$: Ohnutý, ale ne..."
 ep2_locale_events.4001.desc: "„Připadá mi v pořádku!“ [tournament_bowyer.GetFirstName] zkouší luk, který má prohlédnout. Zatímco pokračuje v kontrole, prohrabuji se svazky šípů na vedlejším stole.\n\n„Přední hrana je ale nějak nakřivo.“ Oči se [Select_CString(tournament_bowyer.IsFemale,'jí','mu')] zúží. Pevně sevře ramena luku a ohýbá je stále víc. „Tady, vidíš? Tady je trochu zkroucený—“\n\n#EMP Křřřup!#! Luk praskne a [tournament_bowyer.GetFirstNameNoTooltip] zůstane stát s otevřenými ústy. Místností se rozléhají výmluvy, že kontrola byla nutná a luk by stejně praskl. Jenže bez luku jsem tu [Select_CString(ROOT.Char.IsFemale,'zůstala','zůstal')] já."
 ep2_locale_events.4001.a: "Raději mi dejte náhradu zadarmo!"
 ep2_locale_events.4001.a.success: "[tournament_bowyer.GetFirstNameNoTooltip|U] ti dá nový luk zdarma"
 ep2_locale_events.4001.a.failure: "[tournament_bowyer.GetFirstNameNoTooltip|U] odmítne náhradu"
 ep2_locale_events.4001.b: "Sakra. Máte nějaký na prodej?"
 ep2_locale_events.4001.c: "Ty [tournament_bowyer.Custom2('CZ_InsultNoun_V', ROOT.Char)]! Ty, ty... #EMP [tournament_bowyer.Custom2('CZ_InsultNoun_V', ROOT.Char)]#!!"
 ep2_locale_events.4010.t: "$tournament_locale_bowyer$: Balistické dary"
 ep2_locale_events.4010.desc: "Prohlížím si zboží u lukařského stánku. Obdivuji rozmanité luky, šípy a doplňky.\n\nPři pohledu na tolik užitečných předmětů si okamžitě vzpomenu na [befriend_target.Custom('CZ_FirstName_A')].\n\nTřeba by tu [Select_CString(befriend_target.IsFemale,'ji','ho')] něco potěšilo..."
 ep2_locale_events.4010.a: "Nový luk."
 ep2_locale_events.4010.a.tt: "#F Zaujmi [befriend_actor.Custom('CZ_FirstNameNoTooltip_A')] něčím praktickým.#!"
 ep2_locale_events.4010.b: "Dobrý toulec je přehlížená nutnost."
 ep2_locale_events.4010.b.tt: "#F Zaujmi [befriend_actor.Custom('CZ_FirstNameNoTooltip_A')] něčím, co osloví [Select_CString(befriend_actor.IsFemale,'její','jeho')] smysl pro pořádek.#!"
 ep2_locale_events.4010.c: "Tyto lovecké šípy jsou jedinečné."
 ep2_locale_events.4010.c.tt: "#F Zaujmi [befriend_actor.Custom('CZ_FirstNameNoTooltip_A')] něčím, co osloví [Select_CString(befriend_actor.IsFemale,'její','jeho')] činorodost.#!"
 ep2_locale_events.4010.d: "Nemyslím."
 ep2_locale_events.4011.reply_bow: "Uvnitř je nedotčený luk, doplněný sadou šípů.\n\n"
 ep2_locale_events.4011.reply_quiver: "Uvnitř je nezvykle řešený toulec, větší než obvykle.\n\n"
 ep2_locale_events.4011.reply_hunt: "Uvnitř je sada pečlivě zhotovených loveckých šípů.\n\n"
 ep2_locale_events.4011.opening: "Náhle se přede mnou objeví [befriend_actor.GetTitledFirstName] a v natažených rukou drží balíček podivného tvaru. Dárek?\n\n"
 ep2_locale_events.4011.success_bow: "$ep2_locale_events.4011.reply_bow$Toto je velmi zdařilé dílo, luk hodný šlechtice."
 ep2_locale_events.4011.bow: "$ep2_locale_events.4011.reply_bow$Je těžké skrýt své zklamání. Myslím... luk..."
 ep2_locale_events.4011.success_quiver: "$ep2_locale_events.4011.reply_quiver$Chvíli si ho prohlížím. Tak promyšlený a pohodlný toulec jsem ještě [Select_CString(ROOT.Char.IsFemale,'neviděla','neviděl')]!"
 ep2_locale_events.4011.quiver: "$ep2_locale_events.4011.reply_quiver$Na co tohle potřebuji? Opravdu..."
 ep2_locale_events.4011.success_hunt: "$ep2_locale_events.4011.reply_hunt$Jsou neobvykle robustní konstrukce a zjevně perfektní pro lov drobné zvěře."
 ep2_locale_events.4011.hunt: "$ep2_locale_events.4011.reply_hunt$Lovecké šípy? To jsi #EMP vážně#! [Select_CString(befriend_actor.IsFemale,'nemusela','nemusel')]..."
 ep2_locale_events.4011.a: "Nemohu skrýt úsměv, [Select_CString(befriend_actor.IsFemale,'vybrala','vybral')] dobře!"
 ep2_locale_events.4011.b: "„Jaký... pozorný dar...“"
 ep2_locale_events.4012.opening: "[befriend_target.GetTitledFirstName|U] dárek s radostí přijme a s dětským nadšením rozvazuje obal.\n\n"
 ep2_locale_events.4012.success_reply: "Jakmile dárek spatří, vytřeští oči. Mám z toho dobrý pocit."
 ep2_locale_events.4012.reply: "Při pohledu na dárek jako by [Select_CString(befriend_target.IsFemale,'jí','mu')] pokleslo srdce."
 ep2_locale_events.4012.success_bow: "\n\n„[newly_created_artifact.GetType|U], a tak mistrovsky vyřezávané dílo! Toho si budu vážit!“"
 ep2_locale_events.4012.bow: "„[newly_created_artifact.GetType|U]! Dobře. Dobře.“"
 ep2_locale_events.4012.success_quiver: "\n\n„To je tedy nádhera! Kde jsi to [Select_CString(ROOT.Char.IsFemale,'našla','našel')]?“"
 ep2_locale_events.4012.quiver: "„Pouzdro na šípy? Chápu.“"
 ep2_locale_events.4012.success_hunt: "„Něco takového už hledám celou věčnost!“"
 ep2_locale_events.4012.hunt: "„Na lov, říkáš? Jistě. Jistě.“"
 ep2_locale_events.4012.success: "\n\nS rukou na mém rameni mi děkuje. Myslím, že to byla trefa do černého!"
 ep2_locale_events.4012.failure: "\n\nLedabyle mi poděkuje a odejde. Na co jsem to jen [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')]..."
 ep2_locale_events.4012.a: "Dobře zacíleno."
 ep2_locale_events.4012.b: "K čemu to bylo..."
 ep2_locale_events.4050.t: "$tournament_locale_bowyer$: Chrániče"
 ep2_locale_events.4050.desc: "Mezi svazky šípů a hromádkami tětiv objevím úhledně složené kožené chrániče předloktí. Jsou mimořádně kvalitní. Jeden si navléknu a zpevněná kůže mi pevně obejme vnitřní stranu paže.\n\n„To jsou naše nejlepší chrániče, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Ani deset tisíc ran tětivou je neprodře!“ [tournament_bowyer.GetFirstName] zavětří obchod a hbitě se ke mně přitočí.\n\nZvědavě zkoumám kůži a potěžkám ji v ruce."
 ep2_locale_events.4050.a: "Možná bychom se mohli domluvit na ceně?"
 ep2_locale_events.4050.a.success: "Vyjednávání se podařilo"
 ep2_locale_events.4050.a.failure: "Při vyjednávání neuspěješ"
 ep2_locale_events.4050.a.critfailure: "[tournament_bowyer.GetFirstNameNoTooltip|U] se rozzlobí a odmítne ti je prodat"
 ep2_locale_events.4050.b: "Vezmu dva!"
 ep2_locale_events.4050.c: "Kolik to stojí?"
 ep2_locale_events.4050.d: "Mohu se bez toho obejít."
 ep2_locale_events.4500.t: "$tournament_locale_weaponsmith$: Úlomek ze starého meče"
 ep2_locale_events.4500.start: "Předávám "
 ep2_locale_events.4500.artifact: "[chipped_sword.GetName] "
 ep2_locale_events.4500.noartifact: "svou zbraň "
 ep2_locale_events.4500.end: "k přípravě na nadcházející zkoušky. Jakmile mi ale zmizí z rukou, už toho lituji. [tournament_weaponsmith.GetFirstName] se očividně topí v zakázkách, a tak ji předá na pohled vyplašenému učednictvu.\n\n[Select_CString(apprentice.IsFemale,'Mladá učednice','Mladý učeň')] se jí nadšeně chopí a ledabyle, až příliš ledabyle, jí švihne vzduchem. Zbraň narazí do kovadliny a v ostří zůstane hluboký zub!\n\nMůj bezděčný výkřik přiměje [Select_CString(tournament_weaponsmith.IsFemale,'zděšenou kovářku','zděšeného kováře')] k otočení. Jednou rukou chňapne po poškozené zbrani a druhou dá tomu stvoření pořádný pohlavek."
 ep2_locale_events.4500.a: "Opravte to! Opravte to hned!"
 ep2_locale_events.4500.a.tt: "Bude to stát peníze i spoustu hrubé práce, ale opravené to mít musím!"
 ep2_locale_events.4500.b: "Ach... máte nějaké na prodej?"
 ep2_locale_events.4500.c: "Jen mi to dej!"
 tournament_sword_name: "Turnajový meč"
 tournament_sword_description: "$artifact_sword_description$\n\nTato zbraň byla zakoupena na turnaji."
 tournament_sword.martiallifestyle: "$tournament_sword_description$ Odolná konstrukce ukazuje snahu o to, aby byla především smrtícím břitem."
 tournament_sword.controlledadv: "$tournament_sword_description$ Nápis na čepeli se zmiňuje o obraně panství."
 tournament_sword.foreignfaith: "$tournament_sword_description$ Zvláštní cizojazyčný nápis na čepeli zřejmě odkazuje na neznámé náboženství."
 ep2_locale_events.4501.t: "$tournament_locale_weaponsmith$: [Select_CString(ROOT.Char.IsFemale,'Ozbrojená a připravená','Ozbrojený a připravený')]"
 ep2_locale_events.4501.desc: "Sleduji, jak [tournament_weaponsmith.GetFirstName] ková novou zbraň. Náhle uslyším tiché, ale zřetelné #EMP cinknutí#! a po něm zamumlanou, podivně zadýchanou kletbu. Zahledím se do šera a konečně spatřím [spying_spouse.Custom('CZ_FirstName_A')]. Je to můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spying_spouse'))|l] a právě se krčí za stolkem!\n\nBrzy pochopím proč. Pohledem hltá šlachovité paže [tournament_weaponsmith.Custom('CZ_FirstNameNoTooltip_G')], po kterých mezi vystouplými svaly stékají potůčky potu. Tváře [spying_spouse.Custom('CZ_FirstNameNoTooltip_G')] rozhodně nehoří jen od horka...\n\nUdělám krok blíž. To stačí. [spying_spouse.GetFirstNameNoTooltip] sotva potlačí zalapání po dechu, když se naše oči setkají. Přistižení při činu."
 ep2_locale_events.4501.a: "Třeba bychom měli zjistit, zda je tento zájem sdílen všemi?"
 ep2_locale_events.4501.a.tt: "Ten úsměv v koutku kovářských úst už podle mě říká dost..."
 ep2_locale_events.4501.b: "No, jsou to #EMP velmi#! silné paže..."
 ep2_locale_events.4501.b.tt: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spying_spouse'))|U] má zjevně vytříbený vkus!"
 ep2_locale_events.4501.c: "Hej! Jdeme pryč!"
 ep2_locale_events.4501.d: "Vždyť se jenom dívá. Tím nikomu neublíží."
 ep2_locale_events.4505.t: "$tournament_locale_weaponsmith$: Slavný meč"
 ep2_locale_events.4505.desc: "Sotva vejdu do kovárny, oči [tournament_weaponsmith.Custom('CZ_FirstName_G')] se rozšíří. V náručí uctivě svírá hedvábnou přikrývku.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U].“ Hlas se [Select_CString(tournament_weaponsmith.IsFemale,'jí','mu')] trochu chvěje. „Tvá zručnost a udatnost s mečem v ruce jsou legendární. Já... tohle jsem pro tebe [Select_CString(tournament_weaponsmith.IsFemale,'vyrobila','vyrobil')].“\n\nStáhne přikrývku a odhalí nádherně zdobený meč. Jakmile ho uchopím, poznám prvotřídní kvalitu. Jako by byl prodloužením mé paže.\n\n„Je zhotovený přesně na tvou míru, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Bylo by mi nesmírnou ctí, kdybys jej [Select_CString(ROOT.Char.IsFemale,'přijala','přijal')] jako dar.“"
 ep2_locale_events.4505.a: "Čest je na mé straně, [tournament_weaponsmith.Custom('CZ_FirstNameNoTooltip_V')]."
 ep2_locale_events.4505.a.tt: "Dar?! Má cenu tisíce mečů. To si nechám líbit!"
 ep2_locale_events.4505.b: "Zbraň takovéto kvality si zaslouží náležitou odměnu."
 ep2_locale_events.4505.c: "Nechci vaše laciné čepele!"
 ep2_locale_events.4506.t: "$tournament_locale_weaponsmith$: Na jménu záleží"
 ep2_locale_events.4506.desc: "„Potřebuje jméno.“\n\nPrávě zkouším nový meč několika švihy. Nad poznámkou [tournament_weaponsmith.Custom('CZ_FirstName_G')] jen povytáhnu obočí.\n\n„Každá zbraň legendárního hrdiny má jméno. Tak se to přece dělá! Čepel mocného válečníka potřebuje mocné jméno, před kterým se nepřátelé roztřesou!“ naléhá [tournament_weaponsmith.GetFirstNameNoTooltip]."
 ep2_locale_events.4506.a: "Mám na mysli právě takové jméno."
 ep2_locale_events.4506.a.tt: "[rename_artifact.GetName|U] dostane nové jméno"
 ep2_locale_events.4506.b: "Meč je nástroj, nic víc."
 ep2_locale_events.4510.t: "$tournament_locale_weaponsmith$: Útočné dary"
 ep2_locale_events.4510.desc: "V kovárně se na každém kroku lesknou smrtící nástroje a mistrovsky zpracované předměty.\n\nPohledem přelétám zářící stojany a myšlenkami jsem u [befriend_target.Custom('CZ_FirstName_G')].\n\nJestli si [Select_CString(befriend_target.IsFemale,'ji','ho')] chci získat, musím najít něco, co ocení #EMP [Select_CString(befriend_target.IsFemale,'právě ona','právě on')]#!..."
 ep2_locale_events.4510.a: "Kvalitní poboční zbraň."
 ep2_locale_events.4510.a.tt: "#F Zaujmi [befriend_actor.Custom('CZ_FirstNameNoTooltip_A')] něčím, co ocení pro svou bojovnost.#!"
 ep2_locale_events.4510.b: "Něco pěkného na vystavení."
 ep2_locale_events.4510.b.tt: "#F Zaujmi [befriend_actor.Custom('CZ_FirstNameNoTooltip_A')] něčím, co osloví [Select_CString(befriend_actor.IsFemale,'její','jeho')] zálibu v hmotných věcech.#!"
 ep2_locale_events.4510.c: "Myslím, že [befriend_target.GetFirstNameNoTooltip] ocení #EMP dýku#!."
 ep2_locale_events.4510.c.tt: "#F Zaujmi [befriend_actor.Custom('CZ_FirstNameNoTooltip_A')] něčím, co osloví [Select_CString(befriend_actor.IsFemale,'její','jeho')] úskočnost.#!"
 ep2_locale_events.4510.d: "Najdu jiný způsob, jak na [Select_CString(befriend_target.IsFemale,'ni','něj')] zapůsobit."
 ep2_locale_events.4511.reply_weapon: "Uvnitř leží mistrovské dílo. [newly_created_artifact.GetType|U] se v měkkém světle tlumeně leskne.\n\n"
 ep2_locale_events.4511.reply_ornament: "Uvnitř je jemně zdobená zbraň, která se hodí spíš na zeď než na bojiště.\n\n"
 ep2_locale_events.4511.reply_dagger: "Uvnitř je malá, ale elegantní dýka s jasně se lesknoucím ostřím.\n\n"
 ep2_locale_events.4511.opening: "Jednoho rána mě znenadání zastaví [befriend_actor.GetTitledFirstName] a s očekávavým úsměvem mi podá zabalený předmět. Dárek?\n\n"
 ep2_locale_events.4511.success_weapon: "$ep2_locale_events.4511.reply_weapon$Nelze popřít mistrovské zpracování a zřejmou užitečnost té zbraně."
 ep2_locale_events.4511.weapon: "$ep2_locale_events.4511.reply_weapon$Srdce mi klesá, k čemu bych tuhle hnusnou věc [Select_CString(ROOT.Char.IsFemale,'potřebovala','potřeboval')]?"
 ep2_locale_events.4511.success_ornament: "$ep2_locale_events.4511.reply_ornament$Je to nádherně zpracovaná věc, s takovou pečlivostí o detaily, že je těžké od ní odtrhnout oči."
 ep2_locale_events.4511.ornament: "$ep2_locale_events.4511.reply_ornament$Ach, naprosto zbytečný předmět... aspoň ho asi můžu prodat."
 ep2_locale_events.4511.success_dagger: "$ep2_locale_events.4511.reply_dagger$Její štíhlý tvar přímo vybízí, abych ji [Select_CString(ROOT.Char.IsFemale,'sevřela','sevřel')] v pěsti a [Select_CString(ROOT.Char.IsFemale,'zarazila','zarazil')] hluboko do cíle."
 ep2_locale_events.4511.dagger: "$ep2_locale_events.4511.reply_dagger$Na co je to vůbec? To je nástroj zlodějů."
 ep2_locale_events.4511.a: "Ač se tomu bráním, tentokrát na mě [Select_CString(befriend_actor.IsFemale,'zapůsobila','zapůsobil')]..."
 ep2_locale_events.4511.b: "„D-děkuji. Moc hezké.“"
 ep2_locale_events.4512.opening: "[befriend_target.GetTitledFirstName|U] srdečně přijme můj pečlivě zabalený dárek. Potěžká jej v ruce a široce se usměje.\n\n"
 ep2_locale_events.4512.success_reply: "[Select_CString(befriend_target.IsFemale,'Její','Jeho')] úsměv se ještě rozšíří, když jsou obaly odhozeny."
 ep2_locale_events.4512.reply: "Po rozbalení se [Select_CString(befriend_target.IsFemale,'její','jeho')] nálada trochu změní. Je to zvědavost, nebo pohrdání?"
 ep2_locale_events.4512.success_weapon: "\n\n„Ach, [newly_created_artifact.GetType|l]. Mistrovská kovářská práce. Na tohle... je spolehnutí.“"
 ep2_locale_events.4512.weapon: "„Ach... [newly_created_artifact.GetType]. Přesně to, co potřebuji.“"
 ep2_locale_events.4512.success_ornament: "\n\n„To je ale krásný kus na vystavení! Hodil by se do sbírky každého šlechtice!“"
 ep2_locale_events.4512.ornament: "„Oh, výstavní kus? Velmi... pěkné.“"
 ep2_locale_events.4512.success_dagger: "„Ach, to je pěkné, moc pěkné... A to vyvážení.“"
 ep2_locale_events.4512.dagger: "„Dobré na sekání... zeleniny, předpokládám?“"
 ep2_locale_events.4512.success: "\n\nUpřímně mi poděkuje. Lépe to snad ani dopadnout nemohlo!"
 ep2_locale_events.4512.failure: "\n\nZdvořile mi poděkuje. Požadovaný účinek se asi nedostavil..."
 ep2_locale_events.4512.a: "Mám na to cit."
 ep2_locale_events.4512.b: "Jaká škoda..."
 ep2_locale_events.4520.t: "$tournament_locale_weaponsmith$: Vznešená krev"
 ep2_locale_events.4520.desc: "„Šlechtická krev!“ Hlas [tournament_weaponsmith.Custom('CZ_FirstName_G')] mě vyleká. Zamrkám do šera. Stojí tam s hladovým výrazem a mává lesklou dýkou.\n\n„Stačí jen malá #EMP kapka#! urozené krve na zakalení čepele! Bude to nejlepší meč, jaký kdy vznikl! Budou o mně zpívat písně!“ Přisune se blíž a v očích [Select_CString(tournament_weaponsmith.IsFemale,'jí','mu')] šíleně zablýskne.\n\n„Bude jen tvůj, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')], jenom tvůj. Jen ho musím vykovat já. Dovol mi to a obě naše jména se navždy zapíší do paměti lidstva!“\n\nPohlédnu na své předloktí."
 ep2_locale_events.4520.a: "Pro slávu. Pro věčnou slávu!"
 ep2_locale_events.4520.a.success: "Kování se podaří"
 ep2_locale_events.4520.a.failure: "Kování se nedaří"
 ep2_locale_events.4520.b: "Můžeme to zkusit, ale nejdříve si vezmu své masti..."
 ep2_locale_events.4520.c: "Jestli jsi si #EMP opravdu [Select_CString(tournament_weaponsmith.IsFemale,'jistá','jistý')]#!, že to vyjde..."
 ep2_locale_events.4520.d: "To je nesmysl."
 ep2_locale_events.4521.t: "$tournament_locale_weaponsmith$: Krvavá ocel"
 ep2_locale_events.4521.start: "Tisknu si k předloktí čistý hadřík, abych [Select_CString(ROOT.Char.IsFemale,'zastavila','zastavil')] krvácení, zatímco [tournament_weaponsmith.GetFirstName] nadšeně rozdmýchává oheň a buší kladivem. Než je náš krvavý záměr naplněn, hadřík je téměř promočený. Krev už ale teče pomaleji a rána se zatahuje.\n\nMeč je s úctou položen na stůl."
 ep2_locale_events.4521.success: "Je to zvláštně vypadající věc: zaschlá krev se z čepele dál odlupuje a odhaluje zlověstné vzory v oceli. Zkouším pružnost a čepel znepokojivě vrže.\n\n"
 ep2_locale_events.4521.failure: "Jedním slovem: ošklivé. Zaschlá krev pokrývá délku čepele a váha zbraně se zdá s každým okamžikem měnit. Křehká ocel je vrstvena do flekatých vírů.\n\n"
 ep2_locale_events.4521.ending: "„Je #EMP dokonalý#!!“ [tournament_weaponsmith.GetFirstNameNoTooltip] se mou nedůvěrou nenechá odradit. V úžasu drží čepel a ruce se [Select_CString(tournament_weaponsmith.IsFemale,'jí','mu')] chvějí."
 ep2_locale_events.4521.a: "Vezmu si to!"
 ep2_locale_events.4521.b: "Můžeš si ho nechat."
 ep2_locale_events.5020.t: "$tournament_locale_tourney_grounds$: Ohromit?"
 ep2_locale_events.5020.desc: "Na kolbišti vrcholí přípravy. Pážata pobíhají s kusy zbroje a připomínají přitom malé strašáky. „Počkej!“ volá jedno z nich a zvedá přilbu.\n\nZ tribun se ozve známý chichot. Zahlédnu [impressed_lover.Custom('CZ_TitledFirstName_A')] v kruhu [Select_CString(impressed_lover.IsFemale,'dalších žen, které','dalších mužů, kteří')] si zakrývají ústa kapesníky. Ani mi nezamává. Nemusí.\n\n„Jdeš trochu potrénovat?“ prohodí kolemjdoucí [impressed_rival.GetTitledFirstName] s povýšeně zvednutou bradou. „Budeš to potřebovat.“"
 ep2_locale_events.5020.a: "Postarám se, aby se na mě [impressed_lover.GetFirstNameNoTooltip] [Select_CString(impressed_lover.IsFemale,'dívala','díval')]."
 ep2_locale_events.5020.a.success: "Zapůsobíš na [impressed_lover.Custom('CZ_ShortUIName_A')]"
 ep2_locale_events.5020.a.failure: "[impressed_lover.GetShortUIName|U] [Select_CString(impressed_lover.IsFemale,'není ohromená','není ohromený')]"
 ep2_locale_events.5020.b: "Aha! Skvělá příležitost zastrašit tu dotěrnou osobu, [impressed_rival.Custom('CZ_FirstNameNoTooltip_A')]."
 ep2_locale_events.5020.b.success: "[impressed_rival.GetShortUIName|U] [Select_CString(impressed_rival.IsFemale,'je zastrašená','je zastrašený')]"
 ep2_locale_events.5020.b.failure: "[impressed_rival.GetShortUIName|U] [Select_CString(impressed_rival.IsFemale,'není ohromená','není ohromený')]"
 ep2_locale_events.5020.c: "Jediná osoba, kterou potřebuji ohromit, jsem já."
 tournament_ground_flexing: "Působivý výcvik"
 ep2_locale_events.5020.a.success.tt: "Tvůj vztah s [impressed_lover.Custom('CZ_ShortUIName_I')] má zvýšenou [Concept('fertility','plodnost')|E]"
 ep2_locale_events.1520.t: "Dva měsíce"
 ep2_locale_events.1520.desc: "„Předzvěst! Znamení!“ zaslechnu křik, když se blížím ke dveřím. Za nimi stojí [ROOT.Char.GetFaith.HouseOfWorship|l]. Vtom do mě málem vrazí [tournament_priest.GetTitledFirstName] a ukazuje na oblohu. Sleduji ten horečnatý pohled a spatřím to. Měsíc. Další měsíc.\n\n„Ve starých archivech jsem o tom [Select_CString(tournament_priest.IsFemale,'četla','četl')],“ pokračuje, „něco to předpovídá. Jenže co?“"
 ep2_locale_events.1520.a: "Znamení! Oznamuje mé vítězství!"
 ep2_locale_events.1520.b: "Měsíce jsou kulaté jako mince. Je to zjevně bohatství."
 ep2_locale_events.1520.c: "Dvě dokonale useknuté siluety..."
 ep2_locale_events.1520.d: "Už jsem to [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')]... v knize o hvězdách."
 ep2_locale_events.1520.e: "To nic neznamená."
 tournament_astronomy_modifier: "Astronom"
 tournament_astronomy_modifier_desc: "Tato postava studovala hvězdy a jejich pohyby"
 ep2_locale_events.1520.superstitious: "Začneš podléhat pověrám"
 ep2_locale_events.3010.t: "Špatné ovzduší"
 ep2_locale_events.3010.desc: "Sotva vejdu do tábora, udeří mě do nosu štiplavý zápach. Snažím se co nejdůstojněji zakrýt si nos a přitom nezvracet. Přistoupí ke mně [alerted_physician.GetFirstName] s kapesníkem přitisknutým k vlastnímu nosu.\n\n„Odejdi raději pryč, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Soutěžící stůňou, ten zkažený vzduch jim škodí,“ varuje mě."
 ep2_locale_events.3010.a: "Musí k tomu být vysvětlení. Najděte ho."
 ep2_locale_events.3010.a.success: "[alerted_physician.GetShortUIName|U] prozkoumá tábor"
 ep2_locale_events.3010.b: "Turnaj musel být proklet!"
 ep2_locale_events.3010.b.flavor: "Budu se držet dál od tábora..."
 ep2_locale_events.3010.c: "Nenechám se nachytat těmito pošetilostmi!"
 ep2_locale_events.3010.d: "Proč by mě to mělo zajímat?"
 tournament_not_cursed_modifier: "Čerstvý vzduch"
 tournament_not_cursed_modifier_desc: "Tato postava se vyhnula špatnému vzduchu, který otrávil turnaj"
 ep2_locale_events.3010.a.success.tt: "[alerted_physician.GetShortUIName|U] najde příčinu"
 ep2_locale_events.3010.a.failure: "[alerted_physician.GetShortUIName|U] neuspěje"
 ep2_locale_events.3011.t: "$ep2_locale_events.3010.t$: Miasma"
 ep2_locale_events.3011.desc: "[alerted_physician.GetFirstName|U] se ke mně vrací se spokojeným úsměvem. „[Select_CString(alerted_physician.IsFemale,'Našla jsem','Našel jsem')] příčinu, [ROOT.Char.Custom('FormOfAddressForLiege')|l],“ oznámí a snaží se potlačit smích.\n\n„Hosté nenašli místo pro své... výměšky, tak je začali házet do řeky. Zkažený vzduch přenáší nemoci, jak pravil už Hippokratés.“"
 ep2_locale_events.3011.a: "Musím je varovat!"
 ep2_locale_events.3011.b.contestant: "Nechám si to pro sebe."
 ep2_locale_events.3011.b.champion: "Varuji pouze [Select_CString(contest_champion.IsFemale,'svou šampionku','svého šampiona')], [contest_champion.Custom('CZ_FirstNameNoTooltip_A')]."
 ep2_locale_events.3011.b: "Proč bych jim to [Select_CString(ROOT.Char.IsFemale,'měla','měl')] říct?"
 ep2_locale_events.3510.t: "Dobře okováno"
 ep2_locale_events.3510.desc: "Žár výhně odrazuje většinu návštěvníků. Když otevřu dveře, [farrier.GetFirstName] zrovna zívá nad pracovním stolem. Zákazníků tu zřejmě mnoho nebylo. Rychle se narovná a hlasitě si odkašle.\n\n„Mohu posloužit? Nabízím ty nejlepší podkovy, připravené na turnaj,“ pronese a předvede mi skutečně působivou kolekci."
 ep2_locale_events.3510.a: "„Dejte mi jen to nejlepší!“"
 ep2_locale_events.3510.b: "„Opravdu bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] koupit nějaké pro své rytíře...“"
 ep2_locale_events.3510.c: "„Amulet štěstí!“"
 ep2_locale_events.3510.d: "„Jsem v pohodě, díky.“"
 ep2_locale_events.3510.a.prowess: "Tvá [Concept('prowess','udatnost')|E] se zvýší"
 ep2_locale_events.3510.a.martial: "Tvé [Concept('martial','válečnictví')|E] se zvýší"
 ep2_locale_events.3510.a.prestige: "Tvá nová výstroj budí obdiv"
 tournament_new_horseshoes_modifier: "Nové podkovy"
 good_luck_horseshoe_artifact: "Podkova"
 good_luck_horseshoe_artifact_desc: "Železná podkova, o které se říká, že odhání zlé duchy."
 ep2_locale_events.1530.t: "Do prachu se vrátíš"
 ep2_locale_events.1530.desc.intro: "Před západem slunce je nádvoří opuštěné. Za mnou stojí [ROOT.Char.GetFaith.HouseOfWorship|l], přede mnou hřbitov. V listí cosi zašustí a mezi náhrobky přeběhne malé zvíře. Některé nápisy už téměř zmizely, jiné jsou stále zřetelné.\n\nUdělám k nim krok"
 ep2_locale_events.1530.desc.young: " a připadají mi tak vzdálené. Téměř nemyslitelné."
 ep2_locale_events.1530.desc.middle: ". Až přijde můj čas, postarám se o lepší místo posledního odpočinku."
 ep2_locale_events.1530.desc.old: ", protože je pozdě. Protože bude už jen později. Protože takhle pozdě v mém životě ještě nikdy nebylo."
 ep2_locale_events.1530.a: "Zajímalo by mě, jestli najdu jednoho ze svých předků...."
 ep2_locale_events.1530.b.christian: "A do prachu se navrátím."
 ep2_locale_events.1530.b.fallback: "Brzy to budu já."
 ep2_locale_events.1530.c: "Prach k prachu! Jaký inspirující výjev!"
 ep2_locale_events.1530.d: "Hm... co kdyby...?"
 ep2_locale_events.1530.a.success: "Najdeš v kryptách jednoho ze svých předků"
 ep2_locale_events.1530.a.failure: "Nikdo, koho znáš, tu neleží"
 ep2_locale_events.4540.t: "Na čepeli"
 ep2_locale_events.4540.desc.intro: "„To se [Select_CString(weaponsmith.IsFemale,'jí','mu')] povedlo, vskutku znamenité dílo!“ zaslechnu pyšný hlas rytíře vycházejícího z dílny. Jeho třpytivá čepel odráží slunce jako křišťálové jezero.\n\nOtevřu dveře a přivítá mě šlehající plamen."
 ep2_locale_events.4540.desc.contestant: "„S tímhle chceš soutěžit?“ ozve se otázka. Kovářský prst ukáže na mou zbraň u pasu, [my_weapon.GetNameNoTooltip]."
 ep2_locale_events.4540.desc.fallback: "Přestože tentokrát nesoutěžím, nemělo by mi takové řemeslné nadání uniknout."
 ep2_locale_events.4540.desc.outro: "\n\n„Máš-li zlato, já mám ocel.“"
 ep2_locale_events.4540.a: "„Učiň ji smrtící.“"
 ep2_locale_events.4540.a.tt: "Ostré ostří vydrží jen po dobu turnaje"
 ep2_locale_events.4540.b.christian: "„Vryjte #EMP In Nomine Domini#! podél čepele.“"
 ep2_locale_events.4540.b.fallback: "„Vryjte modlitbu.“"
 ep2_locale_events.4540.c: "„Chci, aby na ní bylo napsáno [my_weapon.GetOwner.GetHouse.GetMotto].“"
 ep2_locale_events.4540.d: "„Nechám si své zlato.“"
 ep2_locale_events_artifact_sharp_desc: "[my_weapon.GetDesc]\n\nČepel byla před turnajem naostřena."
 ep2_locale_events_artifact_prayer_desc: "[my_weapon.GetDesc]\n\nNa čepel byla vyryta modlitba."
 ep2_locale_events_artifact_motto_desc: "[my_weapon.GetDesc]\n\nPodél čepele je vyryto heslo [my_weapon.GetOwner.GetHouse.GetMotto]."
 artifact_tournament_sharpened_blade_modifier: "Naostřená čepel"
 artifact_monthly_piety_7_modifier: "Nápis modlitby"
 artifact_monthly_prestige_7_modifier: "Nápis hesla"
 ep2_locale_events.1060.t: "Padouši a blázni"
 ep2_locale_events.1060.desc: "„Ha! Mizero!“ ozve se výkřik, když otevřu dveře. [Select_CString(tournament_gambler.IsFemale,'Spokojená žena','Spokojený muž')] s úsměvem shrabuje zlato ze stolu. „Pche!“ zabručí protistrana a praští do desky. [tournament_gambler.GetFirstName] vstane.\n\nNaše pohledy se setkají a následuje lehká úklona. „Nechce si [ROOT.Char.GetTitleAsNameNoTooltip|l] zahrát karty? Vyložím svou a ty vsadíš, jestli bude tvoje vyšší, nebo nižší. Vítěz bere všechno. Nic složitého.“\n\n„Pět,“ pronese a položí kartu."
 ep2_locale_events.1060.a: "„Moje karta je vyšší!“"
 ep2_locale_events.1060.b: "„Moje karta je nižší!“"
 ep2_locale_events.1060.c: "„Nechci se zapojit do hazardu.“"
 ep2_locale_events.1060.a.success: "Vyhraješ dvojnásobek"
 ep2_locale_events.1060.a.failure: "Přijdeš o své zlato"
 ep2_locale_events.4530.t: "$tournament_locale_weaponsmith$: Moudrost kladiva"
 ep2_locale_events.4530.desc: "Už z druhé strany cesty vidím jemné mihotání plamenů. Jejich teplo mě důvěrně obejme, ještě než otevřu dveře. Uvnitř se na pracovní ploše řadí hřebíky.\n\n„Mohu posloužit, [ROOT.Char.Custom('FormOfAddressForLiege')|l]?“ ozve se [tournament_weaponsmith.GetFirstName] s čelem umazaným od uhlí. Vzduch je tu o poznání těžší."
 ep2_locale_events.4530.a: "„[Select_CString(ROOT.Char.IsFemale,'Slyšela','Slyšel')] jsem, že kováři dokážou zlomit kouzla. Prosím, utiš mou duši.“"
 ep2_locale_events.4530.a.tt: "Začneš podléhat pověrám"
 ep2_locale_events.4530.b: "„Ukážeš mi nějaký mistrovský postup?“"
 ep2_locale_events.4530.b.success: "Tvé dovednosti se zlepší"
 ep2_locale_events.4530.b.crit_success: "Tvé dovednosti se výrazně zlepší"
 ep2_locale_events.4530.b.failure: "Utrpíš zranění"
 ep2_locale_events.4530.c: "„Dá se můj artefakt [improved_weapon.GetNameNoTooltip] vylepšit?“"
 ep2_locale_events.4530.c.tt: "Získá #positive_value +2#! k [Concept('prowess','udatnosti')|E]"
 ep2_locale_events.4530.d.success: "Léčba zabírá!"
 ep2_locale_events.4530.d.nothing: "Léčba je neúčinná"
 ep2_locale_events.4530.d: "„Mé tělo! Bolí to! Pomoz mi!“"
 improved_artifact_desc: "[improved_weapon.GetDesc]\n\nVylepšeno zručným zbrojířem těsně před důležitým turnajem."
 ep2_locale_events.4530.e: "„Jen jsem se [Select_CString(ROOT.Char.IsFemale,'rozhlížela','rozhlížel')].“"
 ep2_locale_events.5000.t: "Volání oceli"
 ep2_locale_events.5000.desc.intro: "Když se se svým dítětem, [my_child.Custom('CZ_FirstName_I')], vydám na kolbiště, narazíme na bojovníky, jak usilovně trénují na další soutěž. Jsou to [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')|l]. Zamávám [my_knight.Custom('CZ_TitledFirstName_D')]. Pod přilbou [Select_CString(my_knight.IsFemale,'ji','ho')] skoro nelze poznat.\n\n„Ach, jakou čest by to přineslo našemu rodu, kdyby...“ Zarazím se. Všimnu si totiž, že oči [my_child.Custom('CZ_FirstNameNoTooltip_G')] visí na mečích."
 ep2_locale_events.5000.desc.martial: " Vzhledem k [Select_CString(my_child.IsFemale,'jejímu','jeho')] zájmu o válečnictví to není překvapivé."
 ep2_locale_events.5000.desc.non_martial: " Dosud jsem si [Select_CString(ROOT.Char.IsFemale,'nevšimla','nevšiml')], že by [Select_CString(my_child.IsFemale,'ji','ho')] takové věci zajímaly."
 ep2_locale_events.5000.a: "„To je skvělý nápad!“"
 ep2_locale_events.5000.b: "„Dobrá. Bude tě tedy cvičit [my_knight.GetFirstNameNoTooltip].“"
 ep2_locale_events.5000.c: "„Myslíš, že můžeš takto zanedbávat své povinnosti?“"
 ep2_locale_events.5010.t: "$tournament_locale_tournament_grounds$: Téměř tam"
 ep2_locale_events.5010.desc.intro: "Vejdu na kolbiště a přidám se ke skupině"
 ep2_locale_events.5010.desc.prowess: " statných bojovníků. Jsou to [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')|l] a vyměňují si jízlivosti, zatímco jim sloužící zapínají zbroj."
 ep2_locale_events.5010.desc.mind: " soutěžících, kteří probírají osvědčené triky a okázale naznačují, jaké kousky teprve předvedou."
 ep2_locale_events.5010.desc.fallback: " soutěžících, kteří s uměřeným nadšením nacvičují svá vystoupení."
 ep2_locale_events.5010.desc.outro: "\n\nUž nás pozoruje pár diváků. Žvýkají pečené maso, plivou kosti a neomaleně se dožadují podívané.\n\nNěkteří z nás si stěžují, že je to ruší při tréninku. Jiní uprostřed halasu tvrdí, že právě nadešla chvíle ukázat, co v nás je."
 ep2_locale_events.5010.a: "Ukážu vám všem, jak se to dělá."
 ep2_locale_events.5010.a.success: "Tvůj trénink se vydaří"
 ep2_locale_events.5010.a.failure: "Tvůj trénink skončí ostudou"
 ep2_locale_events.5010.b.good: "Vzpomínám na minule. To byly krásné chvíle."
 ep2_locale_events.5010.b.bad: "Tentokrát. Tentokrát to udělám lépe."
 ep2_locale_events.5010.b.flavor: "V mysli se ti vynoří vzpomínka..."
 ep2_locale_events.5010.c: "„Co tak zíráte!?“"
 ep2_locale_events.5010.c.success: "Dav se zalekne"
 ep2_locale_events.5010.c.failure: "Dav se ti vysměje"
 ep2_locale_events.5010.d: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych teď odejít."
 ep2_locale_events.5030.t: "Nová posila"
 ep2_locale_events.5030.desc.intro: "Panoši se při leštění přileb a kroužkových košil smějí a žertují. Jeden zachrochtá jako prase a ostatní ho začnou napodobovat. Nedaleko postávají jejich [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')|l].\n\nMezi nimi zahlédnu [poached_councillor.Custom('CZ_TitledFirstName_A')], [Select_CString(poached_councillor.IsFemale,'rádkyni','rádce')] [councillor_employer.Custom('CZ_TitledFirstName_G')]. "
 ep2_locale_events.5030.desc.contestant: "[Select_CString(poached_councillor.IsFemale,'Její','Jeho')] dovednosti jsou vysoce chváleny a [Select_CString(poached_councillor.IsFemale,'její','jeho')] jméno zaznívá mezi možnými vítězi."
 ep2_locale_events.5030.desc.fallback: "[Select_CString(poached_councillor.IsFemale,'Její','Jeho')] činy nezůstaly bez povšimnutí a práce, kterou [Select_CString(poached_councillor.IsFemale,'vykonala','vykonal')] pro pánův dvůr, je více než působivá."
 ep2_locale_events.5030.desc.outro: "\n\n[Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')] bych [Select_CString(poached_councillor.IsFemale,'ji','ho')] přesvědčit, aby se [Select_CString(poached_councillor.IsFemale,'připojila','připojil')] k mé vlastní radě."
 ep2_locale_events.5030.a: "Zlato je největší pokušení."
 ep2_locale_events.5030.b: "„[Select_CString(poached_councillor.IsFemale,'Schopná žena','Schopný muž')] si zaslouží schopného lenního pána. Nebo vůbec žádného.“"
 ep2_locale_events.5030.b.success: "Zastrašíš [poached_councillor.Custom('CZ_ShortUIName_A')]"
 ep2_locale_events.5030.b.failure: "[poached_councillor.GetShortUIName|U] [Select_CString(poached_councillor.IsFemale,'je uražená','je uražený')] tvou nezdvořilostí"
 ep2_locale_events.5030.c: "„U mého dvora tě čeká váženější život.“"
 ep2_locale_events.5030.d: "„Vždyť jsme dobří přátelé, [Select_CString(poached_councillor.IsFemale,'má drahá','můj drahý')] [poached_councillor.Custom('CZ_FirstNameNoTooltip_V')]. Přidej se ke mně.“"
 ep2_locale_events.5030.e: "Nechci urazit [councillor_employer.Custom('CZ_TitledFirstNameNoTooltip_A')]."
 ep2_locale_events.5500.t: "Starý jako kámen"
 ep2_locale_events.5500.desc: "Návštěva [CZProvNameNoTooltip(ROOT.Char.GetCurrentLocation,'G')] je přesně to, co potřebuji k odpočinku před soutěží! Při procházce ulicemi sleduji místní děti, jak si hrají na bitvu. Místo zbraní mají klacky, pokřikují „Za čest mého rodu!“ a neustále řvou „#EMP Áááá#!“!\n\nZastavím se u jedné z nejvýraznějších budov, která hrdě stojí uprostřed náměstí. Když si ji ale prohlédnu zblízka, všimnu si starobylých nápisů..."
 ep2_locale_events.5500.a.rome: "Počkej... je to latina?"
 ep2_locale_events.5500.a.fallback: "Ha! [Select_CString(ROOT.Char.IsFemale,'Studovala','Studoval')] jsem tento starověký jazyk!"
 ep2_locale_events.5500.b: "Z tohoto kamene by doma byly skvělé zdi!"
 ep2_locale_events.5500.c: "Musíme se od nich dál učit."
 ancient_stone_artifact: "Starověká deska"
 ancient_stone_artifact_desc: "Cedule se starodávným nápisem. Zdá se, že byla znovu použita jako vesnická zeď."
 ep2_locale_events.5510.t: "$tournament_locale_settlement$: Zadní ulička"
 ep2_locale_events.5510.desc: "Místní [CZPrepV(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(ROOT.Char.GetCurrentLocation,'L')] se o turnaj zajímají stejně živě jako přítomná šlechta. Někteří si v přízemí domů zřídili provizorní krámky a všude se lákavě podává [ROOT.Char.Custom('GetLocalStreetFoodPlural')|l].\n\nNad veselím a hovorem ale z jedné uličky zaznívají poněkud... násilnější zvuky. Když přijdu blíž, uvidím obyčejnou selskou rvačku. Jeden z účastníků je ovšem o dost zdatnější než ostatní."
 ep2_locale_events.5510.a: "„Hej, ty! Ano, ty! Ode dneška jsi [Select_CString(village_thug.IsFemale,'mou rytířkou','mým rytířem')].“"
 ep2_locale_events.5510.a.success: "Přesvědčíš [village_thug.Custom('CZ_ShortUIName_A')]"
 ep2_locale_events.5510.a.failure: "[village_thug.GetShortUIName|U] se [Select_CString(village_thug.IsFemale,'netváří nadšeně','netváří pobaveně')]"
 ep2_locale_events.5510.b: "„To jsou působivé pohyby, nech mě si je prostudovat...“"
 ep2_locale_events.5510.c: "„Okamžitě přestaňte, vy barbaři!“"
 tournament_stopped_peasant_fight: "Klidné ulice"
 ep2_locale_events.5520.t: "$tournament_locale_settlement$: Tahání za nitky"
 ep2_locale_events.5520.desc: "V jednom z domů vznikla hlavní tkalcovská dílna. Schází se tu skupina [Select_CString(village_woman.IsFemale,'žen','mužů')] a zřetelně slyším živý rozhovor o probíhajícím turnaji.\n\nOpatrně se nakloním k oknu, abych [Select_CString(ROOT.Char.IsFemale,'zůstala nepovšimnutá','zůstal nepovšimnutý')].\n\n„...a co [gossip_knight.GetFirstName]? Ta [Select_CString(gossip_knight.IsFemale,'ženská','mužská')]! Neuvěříte, včera [Select_CString(gossip_knight.IsFemale,'ji','ho')] přistihli přímo při činu!“ ozve se hlas od zručně proplétaných nití."
 ep2_locale_events.5520.a: "[Select_CString(ROOT.Char.IsFemale,'Slyšela','Slyšel')] jsem to správně?"
 ep2_locale_events.5520.a.success: "Nevšimnou si tě"
 ep2_locale_events.5520.a.success.tt: "Odhalíš tajemství [gossip_knight.Custom('CZ_TitledFirstName_G')]"
 ep2_locale_events.5520.a.failure: "Přistihnou tě při poslouchání za oknem"
 ep2_locale_events.5520.b: "Jejich řemeslným znalostem bych se [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] přiučit..."
 ep2_locale_events.5520.c: "Kolik zlata si tím asi vydělají..."
 ep2_locale_events.5520.d: "Nic jsem [Select_CString(ROOT.Char.IsFemale,'neslyšela','neslyšel')]."
 tournament_supported_weavers: "Zájem o tkaní"
 tournament_supported_weavers_desc: "Tato postava strávila značné množství času učením se od vesnických tkalců"
 tournament_weaving_taxes_modifier: "Daně z tkalcovství"
 ep2_locale_events.5530.t: "Veselení"
 ep2_locale_events.5530.desc: "Hudba se nese až na pole za vesnicí. Vydám se za ní a dojdu na náměstí ověšené girlandami. Flétny, tamburíny, všelijaké nástroje a zpěvy!\n\nMuži a ženy tančí v kruzích po celém prostranství. Chvíli se drží za ruce, pak spustí píseň, pak se točí a točí a točí."
 ep2_locale_events.5530.a: "Moji poddaní budou nadšeni, když se přidám!"
 ep2_locale_events.5530.b: "Perfektní příležitost zapůsobit na přítomné."
 ep2_locale_events.5530.b.success: "Svým tancem vzbudíš obdiv"
 ep2_locale_events.5530.b.failure: "Působíš neohrabaně"
 ep2_locale_events.5530.c.flavor: "Bitva je jako tanec mečů!"
 ep2_locale_events.5530.c: "Tyto pohyby... mohou se hodit v nadcházející soutěži!"
 ep2_locale_events.5530.d: "Ta hudba je tak inspirující!"
 ep2_locale_events.5530.e: "Nesmím se odchýlit od tréninku."
 tournament_village_dance_modifier: "Vesnický tanec"
 ep2_locale_events.1070.t: "V dávných dobách"
 ep2_locale_events.1070.desc.intro: "Sedím v krčmě s hrstkou dvořanů. „Viděli jste toho udatného rytíře s něčím znamením přízně?“ zašeptá jeden z nich. Sleduji mihotání svíček a brzy se ztratím ve vlastních myšlenkách.\n\nPřede mnou je"
 ep2_locale_events.1070.desc.alcohol: "[ROOT.Char.Custom('RegionalAlcoholicDrink')]"
 ep2_locale_events.1070.desc.no_alcohol: "[ROOT.Char.Custom('RegionalDrink')]"
 ep2_locale_events.1070.desc.outro: " a já usrknu. S širokým úsměvem vzpomínám na chvíli, kdy [my_memory.GetDescription].\n\n„Chcete slyšet skutečný příběh?“ obrátím se ke svým společníkům."
 ep2_locale_events.1070.a: "Je to dokonalý okamžik pro povznášející konverzaci."
 ep2_locale_events.1070.b: "Musím se postarat, abych #EMP já#! [Select_CString(ROOT.Char.IsFemale,'vypadala','vypadal')] dobře."
 ep2_locale_events.1070.c: "Chci jen dál pít."
 ep2_locale_events.3020.t: "Milá slova"
 ep2_locale_events.3020.desc: "„Jestli [enemy_knight.GetFirstName] s ostatními soutěžícími nevytře podlahu, tak už nevím!“ zaslechnu při procházce táborem. Kolem kotlíku sedí a jedí návštěvníci. Je mezi nimi i [enemy_knight.GetTitledFirstNameNoTooltip], o kom je právě řeč.\n\n„Přeháníš, příteli,“ ozve se odpověď. [enemy_knight.Custom('quirk_pos_standalone')|U]. Naše pohledy se setkají a já nenápadně kývnu.\n\n„S dovolením,“ zamumlá [enemy_knight.GetFirstName] a vstane. „Přeje si [Select_CString(ROOT.Char.IsFemale,'má paní','můj pán')] něco probrat?“"
 ep2_locale_events.3020.a: "„Vítězství ti nepřinese žádné přátele.“"
 ep2_locale_events.3020.a.success: "[enemy_knight.GetShortUIName|U] tě vyslechne"
 ep2_locale_events.3020.a.failure: "Tvůj návrh [enemy_knight.Custom('CZ_ShortUIName_A')] urazí"
 ep2_locale_events.3020.b: "„Jsem [Select_CString(ROOT.Char.IsFemale,'tvá paní','tvůj pán')]. Přikazuji ti odstoupit.“"
 ep2_locale_events.3020.c: "Chci poctivý souboj."
