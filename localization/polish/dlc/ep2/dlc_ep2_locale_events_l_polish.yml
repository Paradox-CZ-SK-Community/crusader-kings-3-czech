 tournament_wicked_hangover_modifier: "Krutá kocovina"
 tournament_wicked_hangover_modifier_desc: "Tato postava se přepila v předvečer účasti v soutěži."
 tournament_tailor_fancy_crest_modifier: "Nádherný erb"
 tournament_tailor_fancy_crest_modifier_desc: "Tato postava vlastní nádherný rodový erb a nikdy se bez něj neukazuje."
 tournament_tailor_mixup_scheme_modifier: "Chybná identifikace"
 tournament_tailor_mixup_scheme_modifier_desc: "Tato postava vlastní erb jiného rodu, což jí poskytuje velkou příležitost k oklamání."
 tournament_armorer_shield_modifier: "Kvalitní štít"
 tournament_armorer_shield_modifier_desc: "Tato postava byla obdarována vysoce kvalitním dekorativním štítem, zakoupeným u turnajového kováře."
 tournament_armorer_tournament_modifier: "Turnajová přilba"
 tournament_armorer_tournament_modifier_desc: "Tato postava dostala kvalitní turnajovou přilbu zakoupenou u turnajového zbrojíře."
 tournament_tailor_banner_modifier: "Kvalitní prapor"
 tournament_tailor_banner_modifier_desc: "Tato postava obdržela krásný prapor, zakoupený u turnajového krejčího."
 tournament_tailor_gambeson_modifier: "Kvalitní gambeson"
 tournament_tailor_gambeson_modifier_desc: "Tato postava byla obdarována odolným gambesonem, zakoupeným u turnajového krejčího."
 tournament_tailor_glove_modifier: "Kvalitní rukavice"
 tournament_tailor_glove_modifier_desc: "Tato postava obdržela pár jemných rukavic, zakoupených u turnajového krejčího."
 tournament_weaponsmith_ornament_modifier: "Dekorativní čepel"
 tournament_weaponsmith_ornament_modifier_desc: "Tato postava byla obdarována vysoce kvalitní ozdobnou zbraní, zakoupenou u turnajového kováře."
 tournament_bowyer_quiver_modifier: "Kvalitní toulec"
 tournament_bowyer_quiver_modifier_desc: "Tato postava byla obdarována vysoce kvalitním toulcem, zakoupeným u turnajového lukostrojce."
 tournament_bowyer_hunt_modifier: "Kvalitní lovecké šípy s tupými hroty"
 tournament_bowyer_hunt_modifier_desc: "Tato postava obdržela vysoce kvalitní lovecké šípy, zakoupené u turnajového lukostrojce."
 tournament_kept_the_peace_modifier: "Zachování pořádku"
 tournament_kept_the_peace_modifier_desc: "Tato postava svou výmluvností uklidnila nebezpečně vyhrocený spor."
 tournament_man_of_the_people_modifier: "Přítel lidu"
 tournament_man_of_the_people_modifier_desc: "Tato postava ráda pobývá mezi prostými lidmi."
 tournament_snob_modifier: "Snob"
 tournament_snob_modifier_desc: "Tato postava odmítá trávit čas s lidmi nižšího společenského postavení."
 tournament_dice_player_modifier: "Hráč kostek"
 tournament_dice_player_modifier_desc: "Tato postava se zúčastnila riskantní hry v kostky v hostinci."
 tournament_lecherous_knight_modifier: "Žádostiví bojovníci"
 tournament_lecherous_knight_modifier_desc: "Tato postava zjistila, že její rytíři se zapojili do milostných aktivit s některými diskrétními profesionály a rozhodla se přidat."
 tournament_lecherous_knight_positive_modifier: "Žádostiví bojovníci"
 tournament_lecherous_knight_positive_modifier_desc: "Tato postava přistihla své rytíře při milostných hrátkách s diskrétními profesionály a přidala se k nim. [ROOT.Char.GetFaith.PriestNeuterPlural|U] to schvalují."
