 tournament_mocked_cowardice_log: "[CHARACTER.GetTitledFirstName|U] [Select_CString(CHARACTER.IsFemale,'zesměšnila','zesměšnil')] zbabělost [TARGET_CHARACTER.Custom('CZ_TitledFirstName_G')] při [Select_CString(TARGET_CHARACTER.IsFemale,'jejím','jeho')] odstoupení ze souboje"
 tournament_never_again_log_title: "Pohrdavý posměch"
 tournament_never_again_log: "[CHARACTER.GetTitledFirstName|U] po souboji pohrdavě [Select_CString(CHARACTER.IsFemale,'přikázala','přikázal')] [TARGET_CHARACTER.Custom('CZ_TitledFirstName_D')], aby se [Select_CString(CHARACTER.IsFemale,'jí','mu')] už nikdy [Select_CString(TARGET_CHARACTER.IsFemale,'nepostavila','nepostavil')]"
 tournament_sword_blamed_log_title: "Obviněn z nehody"
 tournament_sword_blamed_log: "[CHARACTER.Custom('CZ_TitledFirstName_D')] se podařilo svalit vinu na [TARGET_CHARACTER.Custom('CZ_TitledFirstName_A')], když meč zaletěl mezi diváky"
 tournament_duel_apology_log_title: "Nechtěná omluva"
