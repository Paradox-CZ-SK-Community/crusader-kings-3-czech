 tournament_berserker_log_title: "Berserkerská zuřivost"
 tournament_berserker_log: "V berserkerské zuřivosti [TARGET_CHARACTER.GetTitledFirstName] [Select_CString(TARGET_CHARACTER.IsFemale,'ukousla','ukousl')] nos [CHARACTER.Custom('CZ_TitledFirstName_D')]"
