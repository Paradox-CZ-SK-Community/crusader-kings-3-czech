l_polish:
 ep2_tournament_events.0001.t: "$tournament_versus_header$ Kulhající soupeř"
 ep2_tournament_events.0001.desc: "Otřu si prach z očí a zpevním postoj. Kolem mě se valí výskot a pokřikování davu. [versus_contestant.GetFirstName] stojí opodál. Na chvilku jsme se od sebe odpoutali, abychom nabrali dech.\n\nPovyk diváků trochu utichne, když kolem sebe začneme pomalu kroužit. Jediný chybný pohyb může souboj okamžitě ukončit. Oči [versus_contestant.Custom('CZ_FirstNameNoTooltip_G')] se téměř neznatelně přimhouří.\n\nPři kroužení si všimnu, že se při každém kroku pod [Select_CString(versus_contestant.IsFemale,'její','jeho')] pravou nohou zvedne obláček prachu. Skoro jako by [versus_contestant.GetFirstNameNoTooltip]... trochu [Select_CString(versus_contestant.IsFemale,'kulhala','kulhal')]?"
 ep2_tournament_events.0001.a: "Když teď uhnu doprava, zjistím to..."
 ep2_tournament_events.0001.b: "„Hah! Teď tě mám!“"
 ep2_tournament_events.0001.c: "[versus_contestant.GetFirstNameNoTooltip|U] jen blafuje. Budu bojovat po svém."
 ep2_tournament_events.0001.a.tt: "Tvůj pohyb odhalí, jestli soupeř blafuje"
 ep2_tournament_events.0001.b.tt.win: "[versus_contestant.Custom('CZ_FirstNamePossessiveNoTooltip_F')|U] noha je zraněná"
 ep2_tournament_events.0001.b.tt.lose: "[versus_contestant.GetFirstNameNoTooltip|U] [Select_CString(versus_contestant.IsFemale,'blafovala','blafoval')]"
 ep2_tournament_events.0002.t: "$tournament_versus_header$ Hraní pro dav"
 ep2_tournament_events.0002.desc: "#EMP Buch!#!\n\nMé tělo narazí do dřevěné stěny na okraji kolbiště. [versus_contestant.GetFirstName] mě do ní s vrčením [Select_CString(versus_contestant.IsFemale,'mrštila','mrštil')]. Vzápětí se [Select_CString(versus_contestant.IsFemale,'jí','mu')] tvář roztáhne do samolibého úsměvu a k mému úžasu se ke mně otočí zády.\n\nPozvedne ruce k řvoucímu davu, pak je pokrčí a napne svaly jako [Select_CString(versus_contestant.IsFemale,'kočovná siláčka','kočovný silák')]. Jásot ještě zesílí. Ta nestálá selská cháska [Select_CString(versus_contestant.IsFemale,'jí','mu')] to žere!"
 ep2_tournament_events.0002.a: "#EMP Takhle#! vypadá #EMP opravdová#! síla [Select_CString(ROOT.Char.IsFemale,'ženy','muže')]!"
 ep2_tournament_events.0002.b: "Postav se mi, [Select_CString(versus_contestant.IsFemale,'zbabělkyně','zbabělče')]!"
 ep2_tournament_events.0002.c: "Já [Select_CString(versus_contestant.IsFemale,'ji','ho')] naučím obracet se ke mně zády!"
 ep2_tournament_events.0002.a.tt: "Pochlub se davu!"
 ep2_tournament_events.0002.c.tt: "Zaútoč zezadu"
 ep2_tournament_events.0003.t: "$tournament_versus_header$ Kontroverzní milost"
 ep2_tournament_events.0003.desc: "Když [versus_contestant.GetFirstName] padne na záda do hlíny, kolem [Select_CString(versus_contestant.IsFemale,'jejího','jeho')] těla se zvedne prach. Tenhle boj vyhrávám a všichni to vědí.\n\nUprostřed ohlušujícího povyku se [versus_contestant.GetFirstName] vyškrábe na kolena a vztáhne obě ruce.\n\n„Dost! Už mám dost. Končím,“ zavolá."
 ep2_tournament_events.0003.desc.dread: "Podle třesu [Select_CString(versus_contestant.IsFemale,'jejího','jeho')] těla poznám, že za tou ztrátou bojovnosti nestojí jen má zručnost. [versus_contestant.GetFirstNameNoTooltip] ze mě má strach."
 ep2_tournament_events.0003.desc.wounded: "V obličeji [versus_contestant.Custom('CZ_FirstNameNoTooltip_G')] je jasně vepsaná bolest. Není to zbabělost, pokračovat v boji by ale bylo pošetilé."
 ep2_tournament_events.0003.desc.craven: "Zranění [versus_contestant.Custom('CZ_FirstNameNoTooltip_G')] jsou zjevná. Způsob, jakým se ale vyhýbá mému pohledu a při prosbách se třese, prozrazuje skutečný důvod kapitulace. Obyčejnou zbabělost."
 ep2_tournament_events.0003.a: "Jsi ostuda a ztělesněná zbabělost!"
 ep2_tournament_events.0003.b: "Rozumím. Vstaň prosím; tento souboj je u konce."
 ep2_tournament_events.0003.c: "Tvoje rány vypadají vážně. Najdeme ti lékaře."
 ep2_tournament_events.0003.d: "Nikdy mě už nevyzývej znovu!"
 ep2_tournament_events.0003.e: "Na svůj boj můžeš být [Select_CString(versus_contestant.IsFemale,'hrdá','hrdý')], [versus_contestant.Custom('CZ_FirstNameNoTooltip_V')]."
 ep2_tournament_events.0004.t: "$tournament_versus_header$ Smrt shora"
 ep2_tournament_events.0004.desc: "Má čepel se srazí s čepelí [versus_contestant.Custom('CZ_FirstName_G')]. Ocel zaskřípe a od zbraní odletí jiskry. Oba ustoupíme a kroužíme doleva.\n\n[versus_contestant.GetFirstNameNoTooltip|U] se po mně ožene. Meč mine mé tělo a hrotem se zaryje do země. Hbitě jako zmije přiskočím a vší silou do něj kopnu. Zbraň vyletí [Select_CString(versus_contestant.IsFemale,'jí','mu')] z ruky, několikrát se ve vzduchu převrátí a k hrůze nás obou dopadne mezi diváky!\n\nVzduch protne pronikavý výkřik. Rozběhneme se tam a spatříme [watching_crowd.Custom('CZ_FirstName_A')] na kolenou. Letící meč [Select_CString(watching_crowd.IsFemale,'ji','ho')] zasáhl přímo do paže."
 ep2_tournament_events.0004.a: "[versus_contestant.Custom('CZ_FirstNameNoTooltip_V')|U], jak jsi #EMP [Select_CString(versus_contestant.IsFemale,'mohla','mohl')]#!?"
 ep2_tournament_events.0004.b: "[watching_crowd.Custom('CZ_FirstNameNoTooltip_V')|U]! Jsi v pořádku?"
 ep2_tournament_events.0004.b.success: "[watching_crowd.GetFirstNameNoTooltip|U] přijme tvou omluvu"
 ep2_tournament_events.0004.b.failure: "[watching_crowd.GetFirstNameNoTooltip|U] ti neodpustí"
 ep2_tournament_events.0004.c: "Nu, není času nazbyt..."
 ep2_tournament_events.0004.c.tt: "Využij [Select_CString(versus_contestant.IsFemale,'její','jeho')] nepozornosti a udeř!"
 ep2_tournament_events.0005.t: "$tournament_versus_header$ Za každou cenu"
 ep2_tournament_events.0005.start: "Sekám znovu a znovu, buším do obrany [versus_contestant.Custom('CZ_FirstName_G')]. Prudkým strčením ramenem [Select_CString(versus_contestant.IsFemale,'ji','ho')] pošlu dozadu. Nohy se [Select_CString(versus_contestant.IsFemale,'jí','mu')] rozjedou a já spatřím skvělou příležitost. Čistě instinktivně švihnu nohou širokým obloukem a s těžkým #EMP žuchnutím#! zasáhnu rozkrok.\n\n"
 ep2_tournament_events.0005.eunuch: "Můj další těžký úder jen zazvoní o zbraň [versus_contestant.Custom('CZ_FirstNameNoTooltip_G')]. Donutí [Select_CString(versus_contestant.IsFemale,'ji','ho')] couvnout, ale mně poklesnou ramena. Vzpomenu si totiž na jeden důležitý detail...\n\n„Tam mě kopat nemusíš, [ROOT.Char.Custom('FormOfAddressForLiege')|l]!“ zavolá [versus_contestant.GetFirstNameNoTooltip] a zavrtí hlavou. „Aspoň od té doby, co se to stalo.“\n\n #EMP Jistě.#! [versus_contestant.GetFirstNameNoTooltip] je eunuch!"
 ep2_tournament_events.0005.pain: "[versus_contestant.GetFirstNameNoTooltip|U] vydá zvuk mezi zalapáním po dechu, zakašláním a zasténáním. Roztřesené prsty sotva udrží zbraň a oči se [Select_CString(versus_contestant.IsFemale,'jí','mu')] bolestí zkříží. Během chvilky se zlomí v pase a stěží se drží na nohou."
 ep2_tournament_events.0005.a: "Hah! Teď tě mám!"
 ep2_tournament_events.0005.b: "Ach! Promiň! To jsem [Select_CString(ROOT.Char.IsFemale,'nechtěla','nechtěl')]!"
 ep2_tournament_events.0005.c: "Ach. Ano. Na to jsem [Select_CString(ROOT.Char.IsFemale,'zapomněla','zapomněl')]."
 ep2_tournament_events.0006.t: "$tournament_versus_header$ Příležitost"
 ep2_tournament_events.0006.desc: "Kolbištěm zní skřípění oceli, jak s [versus_contestant.Custom('CZ_FirstName_I')] střídáme údery. Když ustoupí, jdu vpřed. Další zvonivý střet čepelí mi rozechvěje paži.\n\nNáhle se naskytne příležitost. [versus_contestant.GetFirstNameNoTooltip] uklouzne. Vrazím [Select_CString(versus_contestant.IsFemale,'jí','mu')] ramenem do hrudi a srazím [Select_CString(versus_contestant.IsFemale,'ji','ho')] k zemi.\n\n[versus_contestant.GetFirstNameNoTooltip|U] se jen pomalu vzpamatovává. Vybaví se mi šermířské příručky, nad kterými jsem [Select_CString(ROOT.Char.IsFemale,'trávila','trávil')] celé hodiny, i podivuhodné kousky, které doporučovaly při získání jasné převahy.\n\nTéměř bezmyšlenkovitě začnu odšroubovávat hlavici svého meče..."
 ep2_tournament_events.0006.a: "Konečně! Příležitost!"
 ep2_tournament_events.0006.a.tt: "Použij hlavici jako vrhací zbraň!"
 ep2_tournament_events.0006.a.toast: "Hozená hlavice tě zasáhne do obličeje!"
 ep2_tournament_events.0006.b: "Do boje, parchante!"
 ep2_tournament_events.0006.b.tt: "Nejlépe se do [Select_CString(versus_contestant.IsFemale,'ženy','muže')] kope, když leží..."
 ep2_tournament_events.0006.c: "Raději [Select_CString(versus_contestant.IsFemale,'ji','ho')] nechám vstát."
 ep2_tournament_events.0007.t: "$tournament_versus_header$ Kolik stojí..."
 ep2_tournament_events.0007.desc: "Máloco potěší tolik jako snadné vítězství v souboji. [versus_contestant.GetFirstName|U] klopýtavě couvá po nerovné zemi a sotva odráží mé údery. Další mohutný švih narazí do krytu a soupeřící ruka mi v zoufalství sevře paži. Zkřivím tvář do úsměvu.\n\n„Počkej. #EMP Počkej!#!“ syčí na mě [versus_contestant.GetFirstNameNoTooltip], zatímco zápasíme se zaklesnutými čepelemi. „Poslouchej mě. Já to vítězství potřebuji!“ Mé pokrčení ramen vyvolá ještě větší paniku.\n\n„Stůj! Jsem [Select_CString(versus_contestant.IsFemale,'bohatá žena','bohatý muž')]. Prosím, můžeš z toho taky něco mít. S-... sto mincí, když se vzdáš!“"
 ep2_tournament_events.0007.a: "Sto mincí, říkáš?"
 ep2_tournament_events.0007.b: "Vynechme zlato, přidejme ale povinnost..."
 ep2_tournament_events.0007.c: "Z tohohle se nevyplatíš, [versus_contestant.Custom('CZ_FirstNameNoTooltip_V')]."
 ep2_tournament_events.0010.t: "$tournament_versus_header$ Vypočítané sázky"
 ep2_tournament_events.0010.desc: "Čas se zpomalí, když se nade mnou obloukem mihne meč [versus_contestant.Custom('CZ_FirstName_G')] a čepel zazpívá vzduchem. Tohle není lehký úder. Jestli zůstanu stát, pořádně to odnesu.\n\nMělo by to být snadné. Tak zběsilý útok přece přímo vybízí k protiúderu. Jenže vzadu v hlavě mi hlodá pochybnost. Škleb [versus_contestant.Custom('CZ_FirstNameNoTooltip_G')] se dá vysvětlit námahou, ale jako bych v něm [Select_CString(ROOT.Char.IsFemale,'zahlédla','zahlédl')] i nepatrný záblesk uspokojení. A při nápřahu [Select_CString(versus_contestant.IsFemale,'její','jeho')] oči jako by střelily k mému boku. Není to celé jen finta?\n\nČepel se blíží. Musím jednat."
 ep2_tournament_events.0010.a: "Teď tě mám!"
 ep2_tournament_events.0010.a.success: "Tvůj protiúder zabírá"
 ep2_tournament_events.0010.a.failure: "[versus_contestant.GetFirstNameNoTooltip|U] [Select_CString(versus_contestant.IsFemale,'blafovala','blafoval')]"
 ep2_tournament_events.0010.b: "Raději se vykryji, než abych [Select_CString(ROOT.Char.IsFemale,'riskovala','riskoval')] protiútok."
 ep2_tournament_events.0010.b.success: "Tvůj blok uspěje"
 ep2_tournament_events.0010.c: "Lepší přežít a bojovat jindy."
 ep2_tournament_events.0010.c.tt: "Jednoduchý krok stranou sice ztrácí postavení, ale opatrnost je zde lepší než odvaha."
 ep2_tournament_events.0011.t: "$tournament_versus_header$ Pohotová volba"
 ep2_tournament_events.0011.desc: "Stane se to ve zlomku vteřiny. Při hromovém střetu čepelí sklouzne jílec zbraně [versus_contestant.Custom('CZ_FirstName_G')] kolem mého meče a udeří mě přes hřbet ruky. Zavrávorám zpět, abych [Select_CString(ROOT.Char.IsFemale,'získala','získal')] trochu prostoru. Volnou rukou si sevřu tu poraněnou, zatímco meč ochable visí přede mnou.\n\nPaží mi vystřeluje tepavá bolest. Opatrně zkusím zahýbat prsty. #EMP Zdá se#!, že ruka není vážně poraněná. Jestli vůbec. Jenže prohlížet ji při neustálém uhýbání před údery není snadné. [versus_contestant.GetFirstNameNoTooltip] vycítí převahu, zazubí se a další čepel mi těsně mine bok.\n\nUhýbat věčně nemohu. S tou rukou musím něco udělat. Tak či onak."
 ep2_tournament_events.0011.a: "„Hah! Myslíš, že trénuju jen s jednou rukou?!“"
 ep2_tournament_events.0011.a.tt: "Moje levá je stejně dobrá jako pravá!"
 ep2_tournament_events.0011.b: "Není na výběr nic jiného."
 ep2_tournament_events.0011.b.tt: "Uvidíme, zda se vyplatily hodiny cvičení s druhou rukou..."
 ep2_tournament_events.0011.b.success: "Tvůj plán vyjde"
 ep2_tournament_events.0011.b.failure: "[versus_contestant.GetFirstNameNoTooltip|U] se nedá vyvést z míry"
 ep2_tournament_events.0011.b.criticalfailure: "Zbraň ti úplně vypadne z ruky"
 ep2_tournament_events.0011.c: "Ať se stane cokoli, neustoupím!"
 ep2_tournament_events.0011.c.tt: "Přechod do obouručního postoje může zmírnit bolest, ale nepomůže moc, pokud je ruka opravdu poškozená..."
 ep2_tournament_events.0011.c.opinion: "Mínění všech přihlížejících o tobě se zvýší o #COLOR_GREEN 5#!"
 ep2_tournament_events.0011.c.success: "Bojuješ statečně dál"
 ep2_tournament_events.0011.c.failure: "Zraněná ruka tě zradí"
 ep2_tournament_events.0012.t: "$tournament_versus_header$ Převzetí pláště"
 ep2_tournament_events.0012.desc: "Když vykročím proti [versus_contestant.Custom('CZ_FirstName_D')], zastaví se a sklopí zbraň. V lehkém vánku kolem mě vlaje plášť.\n\n„V tomhle... chceš bojovat?“ zeptá se s obličejem plným zmatku a značné nedůvěry. „Já tě samozřejmě nesoudím. Jistě vypadáš velice #EMP módně.#!“\n\nTen náhlý úšklebek se mi vůbec nezamlouvá."
 ep2_tournament_events.0012.intrigue: "Pohlédnu za [Select_CString(versus_contestant.IsFemale,'ni','něj')] a spatřím v davu ženu, které další poryv větru cloumá šátkem. V hlavě se mi pomalu, ale jistě rodí plán..."
 ep2_tournament_events.0012.arrogant: "Vlastně se mi nezamlouvá ani trochu. Jak se opovažuje posmívat se mně a mému #EMP úchvatnému#! oděvu?!"
 ep2_tournament_events.0012.a: "Já ti ukážu, jak módně se dá #EMP bojovat!#!"
 ep2_tournament_events.0012.b: "#EMP Samozřejmě#! že v tom nebudu boj- hyjá!"
 ep2_tournament_events.0012.b.tt: "Uvidíme, jak se [Select_CString(versus_contestant.IsFemale,'jí','mu')] bude bojovat s pláštěm přes obličej!"
 ep2_tournament_events.0012.c: "Samozřejmě že ne. Okamžik, prosím."
 ep2_tournament_events.0012.c.tt: "Vážně, „soubojový plášť“? Na co jsem to #EMP [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')]#!?"
 ep2_tournament_events.0012.d: "Všichni velikáni bojují takhle, [versus_contestant.Custom2('CZ_InsultNoun_V', ROOT.Char)]!"
 ep2_tournament_events.0020.t: "$tournament_versus_header$ Bojové výroky"
 ep2_tournament_events.0020.desc: "Kolem nás povívá lehký vítr. [versus_contestant.GetFirstName] se blíží s připraveným mečem. Rozhlížím se po sebemenší výhodě, jak to dělá každý dobrý šermíř. Žádná nerovná zem, žádné nízké slunce do očí, žádná slabina v postoji. Připravím se na čestný boj.\n\nVýkřik z davu, jistě nějaký hlupák padající ze stoličky, přiměje [versus_contestant.Custom('CZ_FirstNameNoTooltip_A')] zaváhat. Znovu se na mě nervózně soustředí. O některých lidech se říká, že při boji nesnesou rozptylování. Patří k nim snad i [versus_contestant.GetFirstNameNoTooltip]?"
 ep2_tournament_events.0020.secret: "\n\nTéměř sama od sebe mi vytane na mysli drobná vzpomínka. Není to náhodou [Select_CString(versus_contestant.IsFemale,'ta, která','ten, který')]... ach ano. Přesně tak!"
 ep2_tournament_events.0020.a: "„Cože, [versus_contestant.Custom('CZ_FirstNameNoTooltip_V')]? Ty jsi #EMP [Select_CString(versus_contestant.IsFemale,'udělala','udělal')] co?!#!“"
 ep2_tournament_events.0020.a.tt: "Nahlas, aby to každý slyšel!"
 ep2_tournament_events.0020.b: "Vím, co jsi [Select_CString(versus_contestant.IsFemale,'udělala','udělal')], [versus_contestant.Custom('CZ_FirstNameNoTooltip_V')]!"
 ep2_tournament_events.0020.b.tt: "Zašeptat. Tajemství, které uslyší všichni, už nemá žádnou moc!"
 ep2_tournament_events.0020.c: "Mluvení bylo vždy mou silnou stránkou."
 ep2_tournament_events.0020.c.success: "Tvá slova [versus_contestant.Custom('CZ_FirstNameNoTooltip_A')] rozptýlí"
 ep2_tournament_events.0020.c.failure: "Tvá slova [versus_contestant.Custom('CZ_FirstNameNoTooltip_A')] nerozptýlí"
 ep2_tournament_events.0020.d: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych se soustředit na boj."
 ep2_tournament_events.0021.t: "$tournament_versus_header$ Jakákoli výhoda"
 ep2_tournament_events.0021.desc: "Meč [versus_contestant.Custom('CZ_FirstName_G')] mi sklouzne po čepeli a při mém ústupu odletí jiskry. Když narazím zády do hrazení, [versus_contestant.GetFirstNameNoTooltip] se ponuře usměje a obchází mě tak, aby mě u něj [Select_CString(versus_contestant.IsFemale,'uvěznila','uvěznil')]. Potřebuji nějakou výhodu. Jakoukoli.\n\nNáhle mi s lahodným pocitem úlevy vytane vzpomínka. Jak jsem [Select_CString(ROOT.Char.IsFemale,'mohla být tak hloupá','mohl být tak hloupý')]! Zapomenout zrovna tohle! Možná nastal čas to využít...\n\n„Už máš dost, [ROOT.Char.Custom('CZ_FirstName_V')]?“ zabručí a zamává zbraní. „Vypadáš, že už sotva stojíš.“"
 ep2_tournament_events.0021.a: "„Opravdu, mluvíš ještě víc než [family.GetFirstNameNoTooltip].“"
 ep2_tournament_events.0021.b: "„[versus_contestant.Custom2('CZ_InsultNoun_V', ROOT.Char)|U], víš, kdo byl se mnou v #EMP posteli#!? Tvůj [versus_contestant.Custom2('RelationToMeShort', SCOPE.sC('family') )|l]!“"
 ep2_tournament_events.0021.c: "Asi bude lepší [Select_CString(versus_contestant.IsFemale,'ji','ho')] nedráždit..."
 ep2_tournament_events.1001.t: "$tournament_contest_header$ Hořící budovy"
 ep2_tournament_events.1001.desc: "V krvavém rachotu hromadného boje se člověk stěží zorientuje. Masa soutěžících se valí a vlní jako neovladatelná lidská lavina. Běda tomu, kdo jí vstoupí do cesty! Nešťastnému sedlákovi ovšem stačí rychle uskočit stranou. Horší je to, napadá mě, když se obětí stane budova.\n\nBoj se přelil až do samotného sídla [activity.GetCurrentPhase.GetLocation.GetBaronyNameExplicitly]. Už teď vidím, jak soutěžící obou stran odtrhávají kusy fasád a používají je jako provizorní štíty, nebo dokonce střely. A z nedaleké dálky snad slyším i praskání plamenů..."
 ep2_tournament_events.1001.a: "Stůjte, k čertu! Příměří!"
 ep2_tournament_events.1001.b: "Když tu bojujou, budu bojovat taky."
 ep2_tournament_events.1001.c: "#EMP Dost!#! Příměří!"
 ep2_tournament_events.1001.c.success: "Hromadný boj prozatím ustane"
 ep2_tournament_events.1001.c.failure: "Nikdo neposlouchá"
 ep2_tournament_events.1001.d: "Možná je čas odejít."
 ep2_tournament_events.1002.t: "$tournament_contest_header$ Projekt obnovy"
 ep2_tournament_events.1002.desc: "Vyprostím se z vřavy hromadného boje a zamířím zpátky do tábora. Brzy si ale všimnu, že se ke mně rychle blíží někdo rozzuřený.\n\n„Co mi k tomu řekneš?!“ Můj nechápavý výraz zjevně prozradí zmatek a přísná tvář ještě potemní. „Má vesnice je v #EMP troskách!#!“\n\n[Select_CString(mayor.IsFemale,'Dobře oblečená žena','Dobře oblečený muž')], [mayor.GetFirstName], jak se podrážděně představí, spravuje nyní značně zbědované sídlo. Za celou pohromu zjevně viní mě.\n\n„Tak? Co s tím uděláš? Příští zimu přijdeme o #EMP všechno#!“"
 ep2_tournament_events.1002.a: "Možná ti pomohu s obnovou?"
 ep2_tournament_events.1002.b: "Ty máš ale drzost, [mayor.Custom('CZ_FirstNameNoTooltip_V')]."
 ep2_tournament_events.1002.b.tt: "Tato možnost je dostupná díky [Concept('dread','hrůze')|E], kterou budí tvá pověst"
 ep2_tournament_events.1002.c: "Dobře, dobře, zaplatím."
 ep2_tournament_events.1002.d: "Zmizni! Potřebuji odpočinek!"
 ep2_tournament_events.1003.t: "$tournament_contest_header$ Ztracená čepel"
 ep2_tournament_events.1003.desc: "Hromadný boj kolem mě vře. Narážejí do mě těla ze všech stran a já se snažím oplácet ránu ranou. Meče rvou zbroj, kopí zvoní o kovové puklice štítů.\n\nJedna zbraň mi náhle prosviští před očima přímo k hlavě. Jen taktak uhnu a roztočím svou zbraň, [tournament_weapon.GetName], do krytu. Šťastný únik.\n\nChci se znovu napřáhnout, jenže v ruce nic nemám! [tournament_weapon.GetType|U] mi vyletí ze sevření a spadne do prachu, kde do zbraně bojující bezděčně kopou sem a tam."
 ep2_tournament_events.1003.a: "Ach! Moje zbraň!"
 ep2_tournament_events.1003.a.tt.success: "Úspěšně ji získáš zpět"
 ep2_tournament_events.1003.a.tt.failure: "Zbraň někdo odkopne ještě dál"
 ep2_tournament_events.1003.b: "To bude muset počkat."
 ep2_tournament_events.1003.b.tt: "Sekundární zbraň bude muset zatím stačit."
 ep2_tournament_events.1004.t: "$tournament_contest_header$ [Select_CString(comely_stray.IsFemale,'Ztracená','Ztracený')] [comely_stray.Custom('GetLassLad')|l]"
 ep2_tournament_events.1004.desc: "Mezi zápasícími těly, rozbitými přilbami a vířícím prachem něco zahlédnu. Je to duch? Ta krása je snad nadpozemská.\n\nNe, žádný duch. V půvabné tváři má vepsané čiré zděšení a zoufale hledá cestu ven.\n\nSotva otevřu ústa, [comely_stray.GetFirstName] klopýtne a upadne. Nešťastně [Select_CString(comely_stray.IsFemale,'šlápla','šlápl')] na odhozené kopí a [Select_CString(comely_stray.IsFemale,'zvrtla','zvrtl')] si kotník. Smutné oči se [Select_CString(comely_stray.IsFemale,'jí','mu')] zalijí slzami a schoulí se před vířícími čepelemi."
 ep2_tournament_events.1004.a: "Drž se, [Select_CString(comely_stray.IsFemale,'má drahá','můj drahý')]!"
 ep2_tournament_events.1004.a.tt: "Na hromadný boj teď kašlu. Mám důležitější práci!"
 ep2_tournament_events.1004.c: "[rescuer_knight.Custom('CZ_FirstNameNoTooltip_V')|U]! Dostaň [Select_CString(comely_stray.IsFemale,'ji','ho')] do bezpečí!"
 ep2_tournament_events.1004.d: "Musí si poradit [Select_CString(comely_stray.IsFemale,'sama','sám')]."
 ep2_tournament_events.1004.d.escape.tt: "Unikne bez úhony"
 ep2_tournament_events.1004.d.injured.tt: "Utrpí zranění"
 ep2_tournament_events.1004.d.dead.tt: "Dojde nešťastného konce"
 ep2_tournament_events.1005.t: "$tournament_contest_header$ Jít po krku"
 ep2_tournament_events.1005.desc: "Kolem mě z vřavy vypadávají [Select_CString(ROOT.Char.IsFemale,'ženy','muži')], kterým z končetin proudí krev. Bojiště pokrývají rozštípnuté štíty, zlomená kopí a odhozené meče.\n\nVrhnou se na mě zbraně bezejmenného protivníka. Odrazím úder a náraz mi rozechvěje paži. Dalšímu uhnu, svým minu, #X vykročím vpřed#! k dalšímu výpadu a—\n\nProtiúder mi vletí přímo pod bradu. Kdybych [Select_CString(ROOT.Char.IsFemale,'zůstala','zůstal')] stát, minul by. Takhle ale dostanu zásah přímo do krku. Vypotácím se z vřavy, bezmocně si tisknu ruku k ráně a klesnu na kolena."
 ep2_tournament_events.1005.a: "...hurk!"
 ep2_tournament_events.1005.b: "Vzdáti se! Vzdáti se..."
 ep2_tournament_events.1005.success: "Nakonec jen povrchové zranění"
 ep2_tournament_events.1005.fail: "Ubohý konec"
 ep2_tournament_events.1005.resign: "#V Ty#! odstoupíš z turnaje"
 ep2_tournament_events.1006.t: "$tournament_header$ Zajetí"
 ep2_tournament_events.1006.start: "Dorážím mečem na [surrendering_knight.Custom('CZ_FirstName_A')]. Čepel se zakusuje do zbroje a odletují od ní jiskry. Pod tíhou úderů [Select_CString(surrendering_knight.IsFemale,'zatlačená','zatlačený')] dozadu a dolů nakonec odhodí zbraň a zvedne ruku na znamení, že se vzdává.\n\n"
 ep2_tournament_events.1006.normal: "Odvedu [surrendering_knight.Custom('CZ_FirstNameNoTooltip_A')] z boje ke svému panoši. Ten [Select_CString(surrendering_knight.IsFemale,'ji','ho')] pohlídá, zatímco se vrátím do vřavy. Od zajatců se obvykle očekává výkupné za svobodu. Za tuhle osobu bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] dostat slušnou částku!"
 ep2_tournament_events.1006.rival: "Přidržím zbraň u tváře [surrendering_knight.Custom('CZ_FirstNameNoTooltip_G')] a vychutnávám si strach i zlost v [Select_CString(surrendering_knight.IsFemale,'jejích','jeho')] očích. Za porážku se obvykle platí výkupné ve zlatě nebo výstroji, jenže..."
 ep2_tournament_events.1006.broke: "Zatímco vyčkávám, [surrendering_knight.GetFirstNameNoTooltip] si povzdechne.\n\n„Nebudu ti lhát. Na takové výkupné nemám. Tohle je všechno,“ pronese unaveně a podrží malý váček, ve kterém je zjevně jen pár mincí."
 ep2_tournament_events.1006.a: "Budeš litovat dne, kdy ses mi [Select_CString(surrendering_knight.IsFemale,'postavila','postavil')] do cesty!"
 ep2_tournament_events.1006.b: "Vezmu výkupné!"
 ep2_tournament_events.1006.c: "„[artifact.GetNameNoTooltip]“ eh? Vypadá docela pěkně."
 ep2_tournament_events.1006.d: "No, asi si to vezmu."
 ep2_tournament_events.1006.e: "Jdi na svobodu, [Select_CString(surrendering_knight.IsFemale,'urozená soupeřko','urozený soupeři')]!"
 ep2_tournament_events.1007.t: "$tournament_header$ Sladké útočiště"
 ep2_tournament_events.1007.desc: "Vyčerpáním se sotva držím na nohou, když doklopýtám do strohého pohodlí útočiště. Všude kolem jsou soutěžící obou stran v potrhaných, pokroucených zbrojích a s otupenými, zubatými meči. Panoši a sloužící horečně pečují o své svěřence.\n\nZahlédnu pár členů svého družstva, jak nabírají síly. Unaveně mě pozdraví a já se bolavě sesunu vedle nich. Ze stínu pozoruji podnikavého trhovce, který narychlo chystá jídlo a pití pro zchvácené bojovníky. [teammate_1.GetFirstName] a [teammate_2.GetFirstName] k němu nadějně hledí, zatímco [teammate_3.GetFirstName] nuceně vesele mumlá něco o proslovu."
 ep2_tournament_events.1007.a: "Přivolám prodejce."
 ep2_tournament_events.1007.a.tt.success: "Občerstvení ti všem obnoví síly"
 ep2_tournament_events.1007.a.tt.bigsuccess: "Jídlo a pití jsou skvělé!"
 ep2_tournament_events.1007.a.result: "Skóre tvého družstva se #positive_value zvýší#!"
 ep2_tournament_events.1007.a.bigresult: "Skóre tvého družstva se #positive_value výrazně zvýší#!"
 ep2_tournament_events.1007.b: "„Sejděte se sem, vy všichni.“"
 ep2_tournament_events.1007.b.tt: "Možná nějaká povzbuzující slova zvednou jejich morálku?"
 ep2_tournament_events.1007.b.tt.success: "Tvá slova jim vrátí sílu"
 ep2_tournament_events.1007.b.tt.failure: "Projev zřejmě nemá velký efekt"
 ep2_tournament_events.1007.b.result: "Skóre tvého družstva se #positive_value zvýší#!"
 ep2_tournament_events.1007.c: "Raději je nechám být."
 ep2_tournament_events.1011.t: "$tournament_contest_header$ Slavný protivník"
 ep2_tournament_events.1011.start: "Uprostřed krve a hromobití boje si všimnu postavy přibližující se na koni. Symboly visící na krku jejich koně odhalují identitu ještě dříve, než promluví: do arény vchází skutečně proslulý $knight_culture_player_no_tooltip_lowercase$.\n\n"
 ep2_tournament_events.1011.unequal: "„[ROOT.Char.Custom('CZ_TitledFirstNameNoTooltip_V')|U]!“ zahřmí [famous_knight.GetFirstName|U] a ostrým klusem zamíří ke mně. Hlas se jasně nese přes celé bojiště. S nacvičenou jistotou zatočí mečem, jako by [Select_CString(famous_knight.IsFemale,'tu byla doma','tu byl doma')].\n\n„Chci s tebou zkřížit čepele. Pojď, postav se mi a uvidíme, kdo z nás je silnější!“"
 ep2_tournament_events.1011.equal: "„Ach, [ROOT.Char.Custom('CZ_TitledFirstNameNoTooltip_V')|U]! To je skutečná čest!“ [famous_knight.GetFirstName|U] si sundá přilbu a pokračuje.\n\n„Konečně jsme se setkali. Dva největší bojovníci, jací kdy nesli označení $knight_culture_player_plural_no_tooltip_lowercase$. Dvě duše oddané cti, které se spolu účastnily krví skrápěné slávy bojiště, konečně tváří v tvář. Kolikrát jsem si ten osudový okamžik [Select_CString(famous_knight.IsFemale,'přehrávala','přehrával')] ve snech! Zbroj, jež ztělesňuje nevyslovenou vznešenost našeho druhovství—“"
 ep2_tournament_events.1011.a: "Uvidíme, jak ušlechtilé toto kamarádství je..."
 ep2_tournament_events.1011.a.tt: "Hodit [Select_CString(famous_knight.IsFemale,'jí','mu')] za řeči hroudu hlíny do obličeje je možná podlé, ale rozhodně účinné!"
 ep2_tournament_events.1011.a.success: "V boji zvítězíš"
 ep2_tournament_events.1011.a.failure: "Prohraješ souboj"
 ep2_tournament_events.1011.b: "„Pojď, [Select_CString(famous_knight.IsFemale,'vznešená soupeřko','vznešený soupeři')]! Změřme síly v boji.“"
 ep2_tournament_events.1011.c: "Možná je zde opatrnost lepší než statečnost..."
 ep2_tournament_events.1011.d.success: "Podaří se ti zmizet v bojové vřavě"
 ep2_tournament_events.1011.d.failure: "[famous_knight.GetFirstNameNoTooltip|U] tě dostihne"
 ep2_tournament_events.1012.t: "$tournament_contest_header$ Ze stromů"
 ep2_tournament_events.1012.desc: "Houževnaté křoví se chvěje a šustí, jak se jím prodírám. Tenhle hájek u cesty k odpočívadlu je jako stvořený k přepadení.\n\nNečekám dlouho. Po pěšině se vleče [caught_opponent.GetFirstName] a zjevně se těší na přestávku v boji. Sluneční skvrny se míhají po zbroji a šum listí maskuje mé plížení podrostem.\n\nNespouštím z [caught_opponent.Custom('CZ_FirstNameNoTooltip_G')] oči a nakonec se dostanu do dokonalé pozice. Už jen dva kroky od místa, kam za chvíli vstoupí."
 ep2_tournament_events.1012.a: "Jsem jen šustot větví."
 ep2_tournament_events.1012.b: "„[caught_opponent.Custom('CZ_FirstNameNoTooltip_V')|U]! Postav se mi v čestném souboji!“"
 ep2_tournament_events.1012.b.success: "Vyhraješ duel"
 ep2_tournament_events.1012.b.failure: "Prohraješ duel"
 ep2_tournament_events.1012.c: "Musím být [Select_CString(ROOT.Char.IsFemale,'rychlá','rychlý')]!"
 ep2_tournament_events.1012.c.success: "Přepadení se vydaří"
 ep2_tournament_events.1012.c.failure: "Přepadení se zcela nezdaří"
 ep2_tournament_events.1012.d: "Nebylo by správné takto zvítězit."
 ep2_tournament_events.1013.t: "$tournament_contest_header$ Vyšší pozice"
 ep2_tournament_events.1013.desc: "Po nájezdu na soupeře přitáhnu koni otěže a obrátím ho zpátky do vřavy. Jak se blížím, spatřím postavu sraženou ze sedla nečekanou ranou zezadu.\n\n[felled_participant.GetFirstName] se zjevně bez zranění horečně rozhlíží po svém koni. Ten už ale dávno zmizel, vyplašený hlukem.\n\nPřijedu ještě blíž a pozoruji tu nouzi. Z výšky svého válečného oře vidím jen tak malou, bezbrannou postavu. Nebylo by to čestné, řekl by divák. Jenže v téhle vřavě je cti pramálo..."
 ep2_tournament_events.1013.a: "„Potřebuješ pomoc, [felled_participant.Custom('CZ_FirstNameNoTooltip_V')]?“"
 ep2_tournament_events.1013.a.tt: "Kryj [Select_CString(felled_participant.IsFemale,'ji','ho')] před bojem, dokud sloužící nepřivede nového koně."
 ep2_tournament_events.1013.b: "Ať tak. #EMP Hyah!#!"
 ep2_tournament_events.1013.c: "Urovnáme to poctivě, pěšky."
 ep2_tournament_events.1013.c.success: "V souboji zvítězíš"
 ep2_tournament_events.1013.c.failure: "Prohraješ souboj"
 ep2_tournament_events.1013.d: "Takto nebojuji."
 ep2_tournament_events.1013.d.tt: "Obrať koně a vyhledej jiný, čestnější souboj."
 ep2_tournament_events.1015.t: "$tournament_contest_header$ Tajemný $knight_culture_player_no_tooltip$"
 ep2_tournament_events.1015.desc: "Kolem vřavou duní kopyta. Můj nájezd mě vynese ven z boje a já se širokým obloukem vrátím, abych [Select_CString(ROOT.Char.IsFemale,'získala','získal')] přehled.\n\nHned mě upoutá neznámý $knight_culture_player_no_tooltip_lowercase$, který se ohání s vervou, zuřivostí a nemalým umem. Srazí protivníka z koně a sesedne, aby boj dokončil. Nešťastnému soupeři zjevně nestačí síly. Brzy je vydán na milost a za svobodu platí tučné výkupné.\n\nTy znaky mi připadají povědomé, ale těžko je rozeznávám. Přiklušu blíž, sesednu a zavolám. Neznámá postava však odhodlaně kráčí dál hledat nové soupeře."
 ep2_tournament_events.1015.a: "Inu, [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] bych se přiživit na zbytcích."
 ep2_tournament_events.1015.a.tt: "To je dobrá příležitost porazit oslabené protivníky a vydělat si trochu peněz!"
 ep2_tournament_events.1015.b: "Musím zjistit, kdo to je!"
 ep2_tournament_events.1015.b.success: "Zastihneš cizince"
 ep2_tournament_events.1015.b.failure: "Ztratí se v davu"
 ep2_tournament_events.1015.b.success.tt: "Konfrontuješ tu postavu"
 ep2_tournament_events.1015.c: "Raději tu postavu nechám na pokoji."
 ep2_tournament_events.1016.t: "$tournament_contest_header$ Záhada vyřešena"
 ep2_tournament_events.1016.start: "Brzy je jasné, že mě tu nikdo nevítá. Tajemný $knight_culture_player_no_tooltip_lowercase$ po mně nervózně pokukuje přes rameno a kličkuje v bojové vřavě, aby se mě zbavil. Nenechám se ale odradit. Nakonec tu postavu dostihnu, chytím ji za paži a strhnu přilbu. Bezděčně zalapám po dechu.\n\n"
 ep2_tournament_events.1016.mulan: "„Doufám, že jsem si tvou důvěru [Select_CString(mysterious_knight.IsFemale,'zasloužila','zasloužil')],“ řekne [mysterious_knight.GetFirstName] a lehce skloní hlavu. „Děkuji ti za ni. Teď mi dovol ji oplatit.“ Pozvedne zbraň a čepel zachytí sluneční paprsek."
 ep2_tournament_events.1016.mulanunknown: "Je to #EMP [Select_CString(mysterious_knight.IsFemale,'žena','muž')]#!!\n\n„Prosím, snažně tě prosím, nikomu to neříkej.“ Sklopí oči a pak ke mně nadějně vzhlédne. „Chci jen dostat možnost prokázat, co ve mně je!"
 ep2_tournament_events.1016.relation: "Ze všech lidí právě [mysterious_knight.GetFirstName]! Vždyť je to [ROOT.Char.Custom2('RelationToMeShort', mysterious_knight)|l]! Při pohledu na má otevřená ústa se jen lehce usměje a pokyne zpátky k vířící vřavě.\n\n„Na otázky nemáme čas,“ zarazí mé námitky. „Musíme vyhrát bitvu!“"
 ep2_tournament_events.1016.a: "Dobře. Kryj mi záda!"
 ep2_tournament_events.1016.b: "Musíš mi ukázat své dovednosti!"
 ep2_tournament_events.1016.b.tt: "Pozorným sledováním se nepochybně něco přiučíš."
 ep2_tournament_events.1016.b.success: "Naučíš se mnoho"
 ep2_tournament_events.1016.b.failure: "Naučíš se trochu"
 ep2_tournament_events.1016.c: "Ne! Nemůžeš to #EMP dělat#!"
 ep2_tournament_events.1017.t: "$tournament_contest_header$ V pasti"
 ep2_tournament_events.1017.desc: "Tyčová zbraň mě strhne ze sedla. S hučením v hlavě se potácivě narovnám a útočníci se ke mně hned otočí.\n\n„Omlouvám se za tvrdé přistání,“ pronese [knight_1.GetFirstName], „ale nechceme nic riskovat.“ Jsou tři a všichni po zuby ozbrojení. Jejich záměr je jasný. Jsem cenná kořist a za mé výkupné se dá zbohatnout.\n\nKdyž se mi vyjasní v hlavě, rozeznám za jejich zády dvě blížící se postavy v barvách našeho družstva. Ti tři šklebící se bídáci o náhlém nebezpečí vůbec netuší. Záchranu mám na dosah. Pokud o ni ovšem stojím."
 ep2_tournament_events.1017.a: "Zůstaňte stát. #EMP Tihle tři jsou moji.#!"
 ep2_tournament_events.1017.a.success: "[Select_CString(ROOT.Char.IsFemale,'Sama','Sám')] porazíš všechny tři"
 ep2_tournament_events.1017.a.failure: "Jejich přesila je nad tvé síly"
 ep2_tournament_events.1017.b: "Teď! Zaútočte na ně!"
 ep2_tournament_events.1017.b.success: "Zaskočíš je"
 ep2_tournament_events.1017.b.failure: "Dokážou se stáhnout bojem"
 ep2_tournament_events.1018.t: "$tournament_contest_header$ Jednota rodu"
 ep2_tournament_events.1018.desc: "Ve vřavě zahlédnu člena našeho družstva v nesnázích. Bojuje pěšky proti dvěma nepřátelům. Další pohled odhalí zablácené a roztrhané barvy: prapor našeho vznešeného rodu [ROOT.Char.GetHouse.GetName].\n\nVrazím koněm do boje a jeden protivník odletí stranou. Druhého naše spojené čepele rychle vyřídí. [family.GetFirstName] se vděčně usměje a ukloní přede mnou i mým ořem.\n\n„Děkuji. Jinak by mě dostali.“ Pohlédne na naše potrhané, ale stále sytě zbarvené oděvy a poplácá erb nad srdcem. „[ROOT.Char.GetHouse.GetMotto].“"
 ep2_tournament_events.1018.a: "„[ROOT.Char.GetHouse.GetMotto]“, [family.Custom('CZ_FirstNameNoTooltip_V')]."
 ep2_tournament_events.1018.b: "Budu tě vždy chránit, dokud budu dýchat."
 ep2_tournament_events.1501.t: "$tournament_contest_header$ Ticho prosím!"
 ep2_tournament_events.1501.desc: "Dav poklidně šumí, když [competitor.GetFirstName] zaujme místo na čáře. Vítr ke mně donese pár slov a zjevně je zaslechne i [competitor.GetFirstNameNoTooltip]. Podrážděně se otočí k divákům.\n\n„Ticho! Mějte k soutěžícím aspoň trochu zatracené úcty!“ zavrčí nevraživě. Odpoví pár uchechtnutí. Na výstřel z luku zjevně potřebuje klid. Když ale zase hrozí davu pěstí, říkám si, jestli to přece jen trochu nepřehání."
 ep2_tournament_events.1501.secret: "\n\nVrátím se v myšlenkách k tomu, co jsem asi [Select_CString(ROOT.Char.IsFemale,'zaslechla','zaslechl')] v hovoru diváků. Znělo to přinejmenším dost #EMP pikantně#!..."
 ep2_tournament_events.1501.a: "„Ty tam. Co to bylo za řeči?“"
 ep2_tournament_events.1501.a.tt: "Tento dav už nebude moci držet jazyk za zuby, když ten pikantní drb byl slyšet nahlas a jasně!"
 ep2_tournament_events.1501.b: "Ach jo. Nějak mě začíná šimrat v krku."
 ep2_tournament_events.1501.b.tt: "#EMP Ehm!#! #EMP EHM!#!"
 ep2_tournament_events.1501.c: "Raději [Select_CString(competitor.IsFemale,'ji','ho')] nechám střílet."
 ep2_tournament_events.1502.t: "$tournament_contest_header$ Dynamika šípů"
 ep2_tournament_events.1502.desc: "Když nastoupím k výstřelu, prapory kolem mě zběsile vlají a zmítají se ve větru. Nasadím šíp na tětivu. Prach se víří a ostrý vítr mi vhání slzy do očí.\n\nPočkám, až poleví.\n\nČekám dál.\n\nMyslím, že jen tak nepřestane."
 ep2_tournament_events.1502.secret: "\n\nVrátím se v myšlenkách k tomu, co jsem asi [Select_CString(ROOT.Char.IsFemale,'zaslechla','zaslechl')] v hovoru diváků. Znělo to přinejmenším dost #EMP pikantně#!..."
 ep2_tournament_events.1502.a: "Ha! Trocha větru mě nezastaví!"
 ep2_tournament_events.1502.b: "„Vlastně ještě nejsem na řadě, že?“"
 ep2_tournament_events.1502.b.tt: "Když pokynu, aby místo mě [Select_CString(contestant.IsFemale,'nastoupila','nastoupil')] [contestant.GetFirstNameNoTooltip], třeba to projde..."
 ep2_tournament_events.1502.b.success: "Rozhodčí souhlasí"
 ep2_tournament_events.1502.b.failure: "Dostaneš pokyn pokračovat"
 ep2_tournament_events.1502.c: "Třeba když vystřelím #EMP napříč#! větru..."
 ep2_tournament_events.1502.c.success: "Zasáhneš terč"
 ep2_tournament_events.1502.c.failure: "Vítr se ukáže příliš silný"
 ep2_tournament_events.1503.t: "$tournament_contest_header$ Nuda u terčů"
 ep2_tournament_events.1503.desc: "#EMP Drnk!#!\n\nŠíp jednoho ze soutěžících vyletí z luku a zaryje se do terče. Ozve se nesmělý potlesk. Opírám se o luk a znuděně čekám, až přijdu na řadu.\n\n#EMP Drnk!#!\n\nDalší šíp zasáhne cíl. [contestant.GetFirstName] si jde pro luk. Musím si najít #EMP nějakou#! zábavu, jinak při tom čekání zešílím."
 ep2_tournament_events.1503.a: "...ta čára není nijak trvanlivá."
 ep2_tournament_events.1503.a.tt: "Všiml by si někdo, kdybych ji [Select_CString(ROOT.Char.IsFemale,'smazala','smazal')] a [Select_CString(ROOT.Char.IsFemale,'posunula','posunul')] naše stanoviště o pár kroků dozadu?"
 ep2_tournament_events.1503.a.success: "Uspěješ"
 ep2_tournament_events.1503.a.failure: "Přistihnou tě"
 ep2_tournament_events.1503.b: "Zajdu prohodit pár slov s davem."
 ep2_tournament_events.1503.b.flavor: "Kdo ví, jaké zvěsti by se daly zaslechnout?"
 ep2_tournament_events.1503.b.tt: "Odhalíš [Concept('secret','tajemství')|E] jiného soutěžícího"
 ep2_tournament_events.1503.b.success: "Odhalíš tajemství"
 ep2_tournament_events.1503.b.failure: "Zaženeš nudu povídáním"
 ep2_tournament_events.1503.c: "Asi to budu muset vydržet."
 ep2_tournament_events.2001.t: "$tournament_versus_header$ Špinavé triky"
 ep2_tournament_events.2001.desc: "S [versus_contestant.Custom('CZ_FirstName_I')] ležíme na zemi a přetlačujeme se ze všech sil. Sevření paže mě stáhne do nevýhodné pozice a náhle je [versus_contestant.GetFirstNameNoTooltip] nade mnou a pracuje na vítězném chvatu.\n\nPod našimi napjatými těly se sype prašná hlína. Při pokusu přitisknout mě k zemi se [Select_CString(versus_contestant.IsFemale,'její','jeho')] tvář otře o povrch. Volná ruka mi hledá nějakou oporu a bezděčně sevře hrst špíny. Obličej je tak blízko mé ruce. Tak blízko..."
 ep2_tournament_events.2001.a: "Hyah!"
 ep2_tournament_events.2001.b: "Takhle se nebojuje."
 ep2_tournament_events.2001.b.success: "Vybojuješ si cestu zpátky na nohy"
 ep2_tournament_events.2001.b.failure: "[versus_contestant.GetFirstNameNoTooltip|U] tě snadno udrží na zemi"
 ep2_tournament_events.2001.a.tt: "Hoď [Select_CString(versus_contestant.IsFemale,'jí','mu')] hlínu do tváře."
 ep2_tournament_events.2002.t: "$tournament_versus_header$ Citlivé místo"
 ep2_tournament_events.2002.desc: "[versus_contestant.GetFirstName|U] mě strhne k zemi a tvrdě na mě dopadne. Hned se začneme přetahovat o lepší pozici. Já se [Select_CString(versus_contestant.IsFemale,'ji','ho')] snažím shodit, zatímco protistrana využívá získané převahy.\n\n[versus_contestant.GetFirstNameNoTooltip|U] mi přišlápne jednu paži kolenem a chystá se zápas rozhodnout. Volnou rukou zoufale šátrám po čemkoli, co by mi pomohlo. Přes hlínu sotva vidím. Nahmatám vzduch, pak drsnou látku zápasnického oděvu a potom náhle... rýhu mezi hýžděmi?\n\nJestli hned něco neudělám, je po zápase. A tak se z mé pěsti pomalu narovná palec..."
 ep2_tournament_events.2002.a: "V lásce i zápase je všechno dovoleno..."
 ep2_tournament_events.2002.b: "Když už musím, prohraji čestně!"
 ep2_tournament_events.2002.b.tt: "Čas se probojovat ven!"
 ep2_tournament_events.2002.a.tt: "Každý blízký člen rodiny"
 ep2_tournament_events.2003.t: "$tournament_versus_header$ Vnější zásah"
 ep2_tournament_events.2003.desc: "„Hej! Hej, rozhodčí!“\n\nS nemalou úlevou poznám hlas [Select_CString(friend.IsFemale,'své přítelkyně','svého přítele')] [friend.Custom('CZ_FirstName_G')]. Požehnané vyrušení odvede rozhodčího k hrazení a [versus_contestant.GetFirstName] na zlomek okamžiku zaváhá. Dost dlouho, aby [Select_CString(versus_contestant.IsFemale,'ji','ho')] rána předloktím do tváře na chvíli omráčila.\n\nDavu se tyhle triky nezamlouvají a do zápasiště začnou létat různé předměty. Ovoce, zelenina, dokonce i malá stolička. Dopadne dost blízko, abych na ni [Select_CString(ROOT.Char.IsFemale,'dosáhla','dosáhl')]. Rozhodčí je otočený zády a [friend.GetFirstNameNoTooltip] ho dál zahrnuje výčitkami. V hlavě mi klíčí nápad..."
 ep2_tournament_events.2003.a: "„#EMP Au!#! Rozhodčí! [Select_CString(versus_contestant.IsFemale,'Udeřila mě tím','Udeřil mě tím')]!“"
 ep2_tournament_events.2003.b: "„Sem, [versus_contestant.Custom('CZ_FirstNameNoTooltip_V')]!“"
 ep2_tournament_events.2003.c: "Dost těchto nekalých nesmyslů."
 ep2_tournament_events.2003.a.tt: "Hoď stoličku do rukou [versus_contestant.Custom('CZ_FirstNameNoTooltip_G')] a chyť se za hlavu."
 ep2_tournament_events.2003.b.tt: "#EMP Křup!#!"
 ep2_tournament_events.2004.t: "$tournament_versus_header$ Souboj s mohutným soupeřem"
 ep2_tournament_events.2004.desc: "Znovu se pokusím obejmout rozměrné břicho [versus_contestant.Custom('CZ_FirstName_G')] zezadu. A stejně jako předtím se mi odpovědí stane jen smích a náraz do hrazení pod vahou toho mohutného těla. Teď ke mně [versus_contestant.GetFirstNameNoTooltip] pyšně kráčí, podbradky se třesou, špeky se vlní a dav radostně huláká.\n\nObří rozměry sice poskytují výhodu, ale celý ten objem rozhodně nemohou tvořit svaly. [versus_contestant.GetFirstNameNoTooltip] znovu krouží a zmenšuje mi prostor. Přece musí existovat způsob, jak toho využít?"
 ep2_tournament_events.2004.a: "Třeba když [Select_CString(versus_contestant.IsFemale,'ji','ho')] donutím trochu běhat..."
 ep2_tournament_events.2004.b: "Prostě [Select_CString(versus_contestant.IsFemale,'ji','ho')] zvednu a bude po všem!"
 ep2_tournament_events.2004.c: "Taky mám pořádný #EMP objem#!!"
 ep2_tournament_events.2004.d: "Mocná věž nemůže stát bez základů."
 ep2_tournament_events.2004.e: "Vyhýbáním se boji žádnou slávu nezískám!"
 ep2_tournament_events.2004.d.tt.success: "Úspěšně zaútočíš na nohy [versus_contestant.Custom('CZ_FirstNameNoTooltip_G')]"
 ep2_tournament_events.2004.d.tt.failure: "[versus_contestant.GetFirstName|U] tvým útokům snadno odolá"
 ep2_tournament_events.2005.t: "$tournament_versus_header$ Zápas s touhou"
 ep2_tournament_events.2005.desc: "Při zápasu s [versus_contestant.Custom('CZ_FirstName_I')] mi drobné uklouznutí poskytne příležitost. Rychlým chvatem [Select_CString(versus_contestant.IsFemale,'ji','ho')] shodím na zem, ale dopad je ladný a nakonec ležíme hruď na hruď. V boji o převahu z nás stéká pot. Obě těla jsou celá kluzká.\n\nVlastně #EMP velice#! kluzká. Když se vyprostíme z dalšího objetí, možná o poznání méně bojovného než to předchozí, všimnu si ruměnce ve tváři [versus_contestant.Custom('CZ_FirstNameNoTooltip_G')]. A mám podezření, že není jen z námahy."
 ep2_tournament_events.2005.a: "„Přesuneme se někam soukroměji?“"
 ep2_tournament_events.2005.b: "„Ten náš zápas se mi líbí, [versus_contestant.Custom('CZ_FirstNameNoTooltip_V')]. #EMP Moc#! líbí.“"
 ep2_tournament_events.2005.c: "Ha! [Select_CString(versus_contestant.IsFemale,'Přestala','Přestal')] se krýt!"
 ep2_tournament_events.2005.b.tt.success: "[versus_contestant.GetFirstNameNoTooltip|U] má o tvé návrhy zájem"
 ep2_tournament_events.2005.b.tt.failure: "[versus_contestant.GetFirstNameNoTooltip|U] [Select_CString(versus_contestant.IsFemale,'je polichocená','je polichocený')], ale zdvořile odmítne"
 ep2_tournament_events.2005.b.tt.criticalfailure: "Úplně špatně pochopíš řeč těla [versus_contestant.Custom('CZ_FirstNameNoTooltip_G')]"
 ep2_tournament_events.2006.t: "$tournament_versus_header$ Ukázka síly"
 ep2_tournament_events.2006.desc: "Naznačím pohyb doleva a vyrazím doprava, přímo po noze [versus_contestant.Custom('CZ_FirstName_G')]. Jenže protistrana je rychlejší. Popadne mě za pas a zvedne do vzduchu hlavou dolů. Břicho se mi tiskne na záda a nohama bezmocně mávám.\n\nV uších mi zní jásot davu. Snažím se vyprostit a marně mířím kolenem na hlavu [versus_contestant.Custom('CZ_FirstNameNoTooltip_G')]. Čím víc sebou zmítám, tím volnější je sevření. Ještě přidám. [versus_contestant.GetFirstNameNoTooltip] má ale mého kroucení zjevně dost a prostě... mě pustí.\n\nZemě se ke mně náhle rozletí. Poslední zděšená myšlenka mi připomene, že plnou sílu nárazu odnese hlava—\n\n#X Křřřup.#!"
 ep2_tournament_events.2006.a: "..."
 ep2_tournament_events.2007.t: "Zapojení publika"
 ep2_tournament_events.2007.desc: "Tlačím [versus_contestant.Custom('CZ_FirstName_A')] dolů a snažím se přitisknout [Select_CString(versus_contestant.IsFemale,'její','jeho')] ramena k zemi. Už k tomu nemám daleko, když se ozve jeden z rozhodčích. Až za okamžik mi dojde, že ten výrok byl v můj prospěch. Přiznali mi položení na lopatky!\n\nNejistě vstanu a přemítám, jestli mám jejich omyl přiznat. Dav ale náhle ještě zesílí. Otočím se a uvidím, jak [opponent_friend.GetFirstName] přeskočí hrazení a s divokými gesty se ke mně žene.\n\n„To je nespravedlnost! [Select_CString(versus_contestant.IsFemale,'Její','Jeho')] ramena se země ani #EMP zdaleka#! nedotkla!“ křičí a popadne rozhodčího za zápěstí."
 ep2_tournament_events.2007.a: "Stráže! Vyveďte toho výtržníka!"
 ep2_tournament_events.2007.b: "[Select_CString(versus_contestant.IsFemale,'Její','Jeho')] ramena #EMP rozhodně#! byla na zemi!"
 ep2_tournament_events.2007.b.tt.success: "Vyhraješ spor"
 ep2_tournament_events.2007.b.tt.failure: "Rozhodčí dají za pravdu [opponent_friend.Custom('CZ_FirstNameNoTooltip_D')]"
 ep2_tournament_events.2007.c: "Ne, máš pravdu. Na lopatkách nikdo neležel."
 ep2_tournament_events.2501.t: "Volby, volby..."
 ep2_tournament_events.2501.desc: "Prudká rána ramenem od [versus_contestant.Custom('CZ_FirstName_G')] mě zasáhne do žeber a srazí na zem. Protistrana ale nejde hned za mnou, a má proč. Má pěst proletí místem, kde by jinak měla hlavu. Oťukávání tímto zjevně skončilo.\n\nOpatrně kolem sebe kroužíme. [versus_contestant.GetFirstNameNoTooltip] má na rtech náznak lišáckého úsměvu. Je to ticho před bouří a chytrý zápasník takové chvíle využívá k promyšlení taktiky."
 ep2_tournament_events.2501.a: "Zaměřím se na chvaty kolem hlavy."
 ep2_tournament_events.2501.b: "Půjdu po trupu."
 ep2_tournament_events.2501.c: "Prostě [Select_CString(versus_contestant.IsFemale,'ji','ho')] dostanu na zem."
 ep2_tournament_events.2501.a.tt.criticalsuccess: "Srazíš protistranu k zemi"
 ep2_tournament_events.2501.a.tt.success: "Funguje to docela dobře"
 ep2_tournament_events.2501.a.tt.failure: "Tvoje taktika selže"
 ep2_tournament_events.2502.t: "Vykloubení"
 ep2_tournament_events.2502.desc: "Po krátkém sevření s [versus_contestant.Custom('CZ_FirstName_I')] se odpoutám a překvapivě [Select_CString(versus_contestant.IsFemale,'ji','ho')] popadnu za krk! Nepřipravený krk [versus_contestant.Custom('CZ_FirstNameNoTooltip_G')] při nárazu slyšitelně křupne. Ozve se panický výkřik.\n\nDav propukne v jásot. Jakmile ale povolím sevření, hlučné ovace rychle vystřídá zmatený šepot. Při doteku mé paže totiž nechutné #EMP lupnutí#! ohlásilo, že něco není v pořádku. Bolest vystřelující prstem potvrzuje nějaké vykloubení.\n\n[versus_contestant.GetFirstNameNoTooltip] se stále ještě vzpamatovává. Když zareaguji rychle, možná..."
 ep2_tournament_events.2502.a: "Dobrá, nezbývá než to zkusit."
 ep2_tournament_events.2502.b: "Když budu spoléhat na druhou ruku, možná to ještě zvládnu..."
 ep2_tournament_events.2502.c: "Jsem [Select_CString(ROOT.Char.IsFemale,'zraněna','zraněn')]! Musím se vzdát."
 ep2_tournament_events.2502.a.tt: "Zkusit prst vrátit na místo"
 ep2_tournament_events.2502.a.tt.success: "Tvoje improvizovaná péče zabere"
 ep2_tournament_events.2502.a.tt.failure: "Au! To vůbec nepomohlo!"
 ep2_tournament_events.2502.b.tt: "Bojovat dál!"
 ep2_tournament_events.2503.t: "Nejslabší mrknutí"
 ep2_tournament_events.2503.desc: "Paže se mi sevře kolem hlavy. Odpovím prudkým loktem do břicha [versus_contestant.Custom('CZ_FirstName_G')]. Vyklouznu ze sevření a pokusím se o vlastní chvat. Zaklesneme se do sebe, ruce propletené, dech těžký.\n\nPři přetahování zahlédnu na soupeřící tváři stín úsměvu. Čemu se to—\n\n#EMP Ááá!#! Mé #EMP OKO!#! Palec [versus_contestant.Custom('CZ_FirstNameNoTooltip_G')] se mi zarývá přímo do očního důlku. Teprve mocná rána do obličeje mě osvobodí. Vrávorám dozadu s rukama na poraněném oku. Rozmazaná postava se ke mně blíží."
 ep2_tournament_events.2503.a: "Tak se to hraje, co?!"
 ep2_tournament_events.2503.b: "Rozhodčí! #EMP Rozhodčí!#!"
 ep2_tournament_events.2503.c: "To ti neprojde!"
 ep2_tournament_events.2503.d: "Ty [versus_contestant.Custom2('InsultAdjective', ROOT.Char)|l] [versus_contestant.Custom2('CZ_InsultNoun_V', ROOT.Char)|l]! Pojď blíž, ať tě můžu praštit!"
 ep2_tournament_events.2503.a.tt: "Na oplátku [Select_CString(versus_contestant.IsFemale,'ji','ho')] píchneš do oka!"
 ep2_tournament_events.2503.b.tt.success: "[versus_contestant.GetFirstNameNoTooltip|U] [Select_CString(versus_contestant.IsFemale,'je diskvalifikována','je diskvalifikován')]"
 ep2_tournament_events.2503.b.tt.failure: "Zápas může pokračovat"
 ep2_tournament_events.2503.c.tt: "Pokračuješ v boji!"
 ep2_tournament_events.2504.t: "Nevhodné chování"
 ep2_tournament_events.2504.desc: "Otočím se proti [versus_contestant.Custom('CZ_FirstName_D')] a sevřu [Select_CString(versus_contestant.IsFemale,'ji','ho')] do kravaty. Přitlačím, jenže ten dotek jako by [Select_CString(versus_contestant.IsFemale,'jí','mu')] skoro působil #EMP potěšení#!. Hodím [Select_CString(versus_contestant.IsFemale,'ji','ho')] na zem. [versus_contestant.GetFirstNameNoTooltip] prostě ochabne a nechá se. V divokých očích se roztančí znepokojivý záblesk.\n\nRychle se skloním, abych zápas [Select_CString(ROOT.Char.IsFemale,'rozhodla','rozhodl')], ale náhle se všechno změní v rozmazaný vír pohybu. Rána mě odhodí stranou a skončím na zemi. Místo rozhodujícího chvatu si [versus_contestant.GetFirstNameNoTooltip] na mě sedne a začne mi pěstmi bušit do tváře! Zoufale udeřím přímo do [Select_CString(versus_contestant.IsFemale,'jejího','jeho')] spánku. Odpovědí jsou ústa zpěněná u koutků. Otevřou se, vyrazí vpřed a—\n\n#EMP „Ááááá! Můj nos!#!“"
 ep2_tournament_events.2504.a: "Okamžitě [Select_CString(versus_contestant.IsFemale,'ji','ho')] vyveďte ze zápasiště!"
 ep2_tournament_events.2504.b: "Přiveďte mého lékaře!"
 ep2_tournament_events.2504.c: "Někdo, najděte lékaře!"
 ep2_tournament_events.2504.a.tt: "[versus_contestant.GetFirstNameNoTooltip|U] [Select_CString(versus_contestant.IsFemale,'je okamžitě diskvalifikována','je okamžitě diskvalifikován')] a ty postoupíš v soutěži"
 ep2_tournament_events.2504.b.tt: "Zapomeň na soutěž, potřebuješ lékaře!"
 ep2_tournament_events.2504.b.tt.criticalsuccess: "[physician.GetFirstNameNoTooltip|U] dokáže zázraky"
 ep2_tournament_events.2504.b.tt.success: "[physician.GetFirstNameNoTooltip|U] ti zachrání nos"
 ep2_tournament_events.2504.b.tt.failure: "Ani péče [physician.Custom('CZ_FirstNameNoTooltip_G')] ti nos nezachrání"
 ep2_tournament_events.2504.c.tt: "Posílá se posel hledat nového $court_physician_court_position$"
 ep2_tournament_events.2505.t: "Dostat na frak"
 ep2_tournament_events.2505.desc: "Bolí mě paže. Svaly mi hoří.\n\nNejen krk, který musel snést tolik pevných chvatů. Nejen trup, rozměklý snad jako naklepané maso. Ne, #EMP samotné paže#! mám jako po zadupání koňským spřežením, které žene [ROOT.Char.GetFaith.DevilName]. Jedinou útěchu vidím při pohledu přes rozmazané oči a přerývaný dech. [versus_contestant.GetFirstName] na tom není o nic lépe.\n\nOba se při dalším přiblížení nejistě kymácíme a z ran nám volně stéká krev. Už na sebe skoro dosáhneme, když nás od sebe odtrhnou rozhodčí a starostlivě obklopí. Nabízejí nám... remízu?"
 ep2_tournament_events.2505.a: "Tak vyrovnaný souboj nemusí mít poraženého."
 ep2_tournament_events.2505.b: "Remíza?! Budete mě muset vytáhnout z tohoto ringu!"
 ep2_tournament_events.2505.b.tt.success: "Vyhráváš zápas"
 ep2_tournament_events.2505.b.tt.failure: "[versus_contestant.GetFirstNameNoTooltip|U] vyhraje zápas"
 ep2_tournament_events.2505.b.tt.doublefailure: "Oba omdlíte vyčerpáním"
 ep2_tournament_events.2505.b.tt.sadistic: "Všichni dvořané a hosté, kteří jsou [GetTrait('sadistic').GetName( GetNullCharacter )]"
 ep2_tournament_events.2505.b.tt.notsadistic: "Všichni dvořané a hosté, kteří nejsou [GetTrait('sadistic').GetName( GetNullCharacter )]"
 ep2_tournament_events.2506.t: "Nová perspektiva"
 ep2_tournament_events.2506.desc: "Vyhnout se chvatu, minout protiútok...\n\nSnažím se oplácet ránu ranou. Jen stěží ale odolávám zuřivým pokusům [versus_contestant.Custom('CZ_FirstName_G')] dostat mě do sevření. Jednomu uhnu, druhý odrazím, uskočím stranou. A pak mě popadne.\n\nPaže se mi stáhne kolem krku jako strašlivý had a druhá ruka mi tlačí hlavu opačným směrem. Jako by chtěla ukončit trápení zvířete. Nemohu dýchat. Oči mi snad vyskočí z důlků, v tvářích se hromadí krev a krk vrže jako křehká větev.\n\n#X Křup.#!\n\nSvět ztratí barvy. Tělo se mi zachvěje v křeči.\n\nLežím na břiše a hledím k obloze."
 ep2_tournament_events.2506.a: "#DIE2 ...urk!#!"
 ep2_tournament_events.2507.t: "Zmatené údery"
 ep2_tournament_events.2507.desc: "Nic neprobudí smysly tak jako pořádný zápas. Všechno je ostřejší, jasnější, zřetelnější. Zvuky, obrazy i vůně. Člověk se hned cítí nadlidsky! A možná by ztráta jednoho smyslu způsobila pravý opak...\n\nPohrdavě uhnu doleva před chvatem [versus_contestant.Custom('CZ_FirstName_G')]. Když ucukne zpět, zasadím [Select_CString(versus_contestant.IsFemale,'jí','mu')] mohutný úder oběma rukama po stranách hlavy.\n\n[versus_contestant.GetFirstNameNoTooltip|U] zařve bolestí a z uší se vyřinou pramínky krve. Zápas zjevně rychle spěje ke konci. Divoké, špatně mířené pokusy o sevření mi ale napovídají, že se [versus_contestant.GetFirstNameNoTooltip] buď pomstí, nebo při tom padne."
 ep2_tournament_events.2507.a: "...ještě jednou."
 ep2_tournament_events.2507.b: "Udělejme to rychle."
 ep2_tournament_events.2507.b.tt: "Vítězství je zaručeno, ale rychlý konec by byl milosrdný."
 ep2_tournament_events.2507.c: "„Myslím, že už máš dost, [versus_contestant.Custom('CZ_FirstNameNoTooltip_V')].“"
 ep2_tournament_events.2507.c.success: "Přesvědčíš [versus_contestant.Custom('CZ_FirstNameNoTooltip_A')], aby se [Select_CString(versus_contestant.IsFemale,'vzdala','vzdal')]"
 ep2_tournament_events.2507.c.failure: "[versus_contestant.GetFirstNameNoTooltip|U] pokračuje ve svém nešťastném útoku"
 ep2_tournament_events.3501.t: "Přitahování pozornosti"
 ep2_tournament_events.3501.desc: "Záblesk pohybu, zvonivé prasknutí a cvičný otočný terč se znovu divoce roztočí. Mladý $knight_culture_player_no_tooltip_lowercase$ projede bez úhony a [knight1.GetFirstName] vítězoslavně pozdraví. #EMP Mě#!, uvědomím si, když to předvádění zakončí krátká úklona ze sedla.\n\n#EMP Buch!#! Terč napadne další jezdec. S podobnou zručností bezpečně projede i s koněm kolem vířícího břevna. Ani [Select_CString(knight1.IsFemale,'ji','ho')] z prvního pokusu břevno nezasáhlo. [knight2.GetFirstName] zastaví hned vedle místa, kde stojí první $knight_culture_player_no_tooltip_lowercase$, a okázale zamává zbraní. Zase mým směrem. Obě hledí se zvednou a i z té dálky vidím vzájemné nevraživé pohledy."
 ep2_tournament_events.3501.a: "[knight1.GetFirstNameNoTooltip|U] má zjevně veliký um."
 ep2_tournament_events.3501.b: "[knight2.GetFirstNameNoTooltip|U] bude jistě nejlepší volba."
 ep2_tournament_events.3501.c: "Vítěz má moji přízeň!"
 ep2_tournament_events.knight_1_wins: "[knight1.GetFirstName|U] vítězí!"
 ep2_tournament_events.knight_2_wins: "[knight2.GetFirstName|U] vítězí!"
 ep2_tournament_events.3501.d: "Dost! To je dětinské chování."
 ep2_tournament_events.3502.t: "Konstrukční katastrofa"
 ep2_tournament_events.3502.desc: "Buch. Buch. Buch. Nepravidelné praskání tříštících se kopí podbarvuje rytmické dunění nárazů do otočného terče.\n\nBuch. Buch. #EMP Křach.#! Další jezdci zkoušejí štěstí, ale najednou je něco jinak. Nezněl ten poslední náraz divně—\n\n[competitor.GetFirstName] vyrazí proti terči a mohutnou ranou jej rozlomí v půli. Břevno odletí a převalí se po zemi. Celá konstrukce se nebezpečně zakymácí a s rachotem zřítí."
 ep2_tournament_events.3502.a: "Kdo za to může?! Najděte je a potrestejte!"
 ep2_tournament_events.3502.b: "Jak ostudně udržovaný turnaj."
 ep2_tournament_events.3502.c: "Uhradím opravu."
 ep2_tournament_events.3502.d: "To byla rána, [competitor.Custom('CZ_FirstNameNoTooltip_V')]!"
 ep2_tournament_events.3503.t: "$tournament_header$ Nešťastný $knight_culture_player_no_tooltip$"
 ep2_tournament_events.3503.desc: "Dav podivně hučí. Jako by půlka sténala a druhá... se skvěle bavila? Prohlédnu přes řady soutěžících a bezděčně si povzdechnu také. [hapless_knight.GetFirstName] dosud při každém nájezdu míjí terč o pořádný kus. Teď se chystá znovu.\n\nPři přiblížení [Select_CString(hapless_knight.IsFemale,'jí','mu')] úplně vypadne kopí z ruky. [hapless_knight.GetFirstNameNoTooltip] v panice vzhlédne právě včas, aby [Select_CString(hapless_knight.IsFemale,'dostala','dostal')] od otočného břevna #EMP pořádnou ránu#! do břicha! Ruce se vymrští a zachytí tyče, ale setrvačnost dělá své. Za pár vteřin se na konci břevna bezmocně houpe lidské tělo, uvězněné ve vzduchu."
 ep2_tournament_events.3503.a: "To je talent na šaška!"
 ep2_tournament_events.3503.a.tt.success: "[hapless_knight.GetFirstNameNoTooltip|U] přijme tvou nabídku služby"
 ep2_tournament_events.3503.a.tt.failure: "Tvůj návrh [hapless_knight.Custom('CZ_FirstNameNoTooltip_A')] rozladí"
 ep2_tournament_events.3503.b: "Vždyť dělá z celého sportu frašku! Vyloučit!"
 ep2_tournament_events.3503.b.tt.success: "[hapless_knight.GetFirstNameNoTooltip|U] [Select_CString(hapless_knight.IsFemale,'je vyloučena','je vyloučen')] ze soutěže za její znevážení"
 ep2_tournament_events.3503.b.tt.failure: "[hapless_knight.GetFirstNameNoTooltip|U] se úspěšně obhájí"
 ep2_tournament_events.3503.c: "Upřímně, mám [Select_CString(hapless_knight.IsFemale,'ji','ho')] docela [Select_CString(ROOT.Char.IsFemale,'ráda','rád')]."
 ep2_tournament_events.3503.d: "Ha! #EMP Ha!#!"
 ep2_tournament_events.3504.t: "Příliš pomalu"
 ep2_tournament_events.3504.desc: "Když jsem [Select_CString(ROOT.Char.IsFemale,'vyrůstala','vyrůstal')], starý učitel mě učil vydechnout naposledy těsně před nárazem kopí.\n\nJeden krok, druhý, třetí. Krok, lehký cval. Sklopit kopí, znovu zapřít, zamířit hrot. Nádech, výdech, zásah.\n\nPovedlo se! Kopí se tříští. Až příliš pozdě mi ale dojde, že kůň stále jen lehce cválá, místo aby pádil tryskem. Okamžitě mnou projede palčivá bolest. Palice na konci břevna mě #X praští#! do zad a vyhodí ze sedla.\n\nVisím ve vzduchu. Svět se zastavil. Ach, jak by se můj starý učitel mračil nad každou nedokonalostí...\n\nSvět se znovu pohne. Země mi letí vstříc a náhle všechno zčerná."
 ep2_tournament_events.3504.a: "..."
 ep2_tournament_events.4001.t: "$tournament_versus_header$ Hluboká rána"
 ep2_tournament_events.4001.desc: "K značce, zapřít kopí, opřít se v sedle, počkat na znamení, předklonit se, zamířit—\n\nPostup při klání už mám skoro mechanický. Když mnou ale projedou oba nárazy, paži mi zachvátí ostrá, palčivá bolest.\n\nZ hluboké rány na nadloktí proudí krev. Kopí [versus_contestant.Custom('CZ_FirstName_G')] mi podélně rozřízlo horní část paže.\n\nJe to vážné zranění. Za odstoupení by mě nikdo nenazval zbabělcem. Několik ustaraných sloužících na tom dokonce trvá."
 ep2_tournament_events.4001.a: "Vraťte mě na koně!"
 ep2_tournament_events.4001.a.tt: "Mínění všech [Concept('courtiers','dvořanů')|E] a [Concept('guests','hostů')|E] o tobě se zvýší o #COLOR_GREEN 10#!"
 ep2_tournament_events.4001.b: "Jsem z tvrdšího těsta než tohle."
 ep2_tournament_events.4001.c: "Opatrnost je lepší než odvaha."
 ep2_tournament_events.4002.t: "$tournament_versus_header$ Pád ze sedla"
 ep2_tournament_events.4002.desc: "Prásk! Dunivý střet dřeva o dřevo hlásí přesný zásah. Jeho síla je taková, že se [versus_contestant.GetFirstName] nebezpečně zakymácí a zřítí na zem. Na konci dráhy zastavím koně a pohlédnu dolů.\n\n[versus_contestant.GetFirstNameNoTooltip|U] se zvedne. Spíš než zranění to vypadá na vyražený dech, ale vedle na zemi leží štít rozlomený ve dví. Smutně ho sleduje, zatímco sluha sbírá kusy a přidává je k hromádce, ve které poznávám [Select_CString(versus_contestant.IsFemale,'její','jeho')] hlavní a zřejmě jediný další štít."
 ep2_tournament_events.4002.a: "Sluho! Přines pro [Select_CString(versus_contestant.IsFemale,'tu ženu','toho muže')] jeden z mých náhradních štítů!"
 ep2_tournament_events.4002.b: "Jsi [Select_CString(versus_contestant.IsFemale,'zraněná','zraněný')]? Pomůžeme ti na nohy!"
 ep2_tournament_events.4002.c: "Takové už je klání na kopí."
 ep2_tournament_events.4003.t: "$tournament_versus_header$ Mohutný kmen"
 ep2_tournament_events.4003.desc: "Klušu ke startovní značce, když mě něco přiměje zastavit a přimhouřit oči. Jestli mě zrak neklame, na druhém konci kolbiště se děje něco skutečně podivného.\n\nSloužící [versus_contestant.Custom('CZ_FirstName_G')] se snaží zvednout kopí do [Select_CString(versus_contestant.IsFemale,'jejích','jeho')] rukou. A není divu. Ta obří zbraň připomíná spíš vyvrácený strom než dřevěné kopí. Obrovský kmen, dlouhý jako dva muži.\n\nNevěřícně sleduji, jak ho [versus_contestant.GetFirstNameNoTooltip] samolibě potěžká a pro větší stabilitu opře o koňský krk. Dav hučí očekáváním i rozhořčením. Jedni chtějí nechat nájezd pokračovat, druzí protestují proti nespravedlnosti."
 ep2_tournament_events.4003.a: "Tohle přeci nemůže být dovoleno?!"
 ep2_tournament_events.4003.a.tt: "Kde je nejbližší rozhodčí?"
 ep2_tournament_events.4003.b: "No tak, opravdu chceš vyhrát zrovna tímhle způsobem?"
 ep2_tournament_events.4003.b.tt.win: "Podaří se ti [Select_CString(versus_contestant.IsFemale,'ji','ho')] přesvědčit"
 ep2_tournament_events.4003.b.tt.lose: "Nepodaří se ti [Select_CString(versus_contestant.IsFemale,'ji','ho')] přesvědčit"
 ep2_tournament_events.4003.c: "Ten přerostlý sazenec tě přede mnou nezachrání!"
 ep2_tournament_events.4003.c.tt.win: "Překonáš svoji nevýhodu"
 ep2_tournament_events.4003.c.tt.lose: "Kopí [versus_contestant.Custom('CZ_FirstNameNoTooltip_G')] se ukáže nad tvé síly"
 ep2_tournament_events.4004.t: "$tournament_versus_header$ Potíže"
 ep2_tournament_events.4004.desc: "Obvyklou nervozitu před kláním zaháním opakovanou kontrolou své výstroje. Náhle si ale všimnu někoho vedle sebe. [versus_contestant.GetFirstName] je kupodivu pěšky. S mečem opřeným o rameno se nakloní blíž a spiklenecky promluví.\n\n„[ROOT.Char.Custom('CZ_FirstName_V')]! Nechceš si se mnou protáhnout nohy?“ zahřmí. Nad mým nechápavým výrazem se rozesměje a ukáže na zem.\n\n„Co tohle kolo zkusit po svých, co? Malá změna, ať diváci vidí něco jiného?“"
 ep2_tournament_events.4004.a: "Nezáleží mi, jak tě porazím!"
 ep2_tournament_events.4004.a.success: "Porazíš [versus_contestant.Custom('CZ_FirstNameNoTooltip_A')] mečem"
 ep2_tournament_events.4004.a.failure: "Nepodaří se ti porazit [versus_contestant.Custom('CZ_FirstNameNoTooltip_A')]"
 ep2_tournament_events.4004.b: "Vrať se na koně, ty blázne."
 ep2_tournament_events.4004.c: "Pěšky ano. Ale #EMP s kopími#!."
 ep2_tournament_events.4005.t: "$tournament_versus_header$ [Select_CString(versus_contestant.IsFemale,'Čestná žena','Čestný muž')]?"
 ep2_tournament_events.4005.desc: "Předloktí [versus_contestant.Custom('CZ_FirstName_G')] bezmocně visí, když se snaží zaujmout postoj. Bolestivá grimasa přejde v potlačené zalapání po dechu při pokusu zvednout kopí. Poslední kolo si zjevně vybralo těžkou daň.\n\nS úžasem sleduji, jak sloužící zvednou kopí do polohy a připoutají je k nadloktí [versus_contestant.Custom('CZ_FirstNameNoTooltip_G')]. Touha prokázat čest zjevně velí pokračovat, přestože naděje na vítězství není žádná.\n\nNa oplátku pozdravím vlastním kopím. Dav nám oběma jásá."
 ep2_tournament_events.4005.a: "Bylo by neuctivé nedat do toho všechno."
 ep2_tournament_events.4005.a.tt: "Utkáš se s protistranou stejně jako s kýmkoli jiným."
 ep2_tournament_events.4005.b: "Prokázaná čest zasluhuje čest v rovné míře!"
 ep2_tournament_events.4005.b.tt: "Zvedneš kopí k nebi a projedeš kolem bez útoku."
 ep2_tournament_events.4005.c: "Perfektní příležitost!"
 ep2_tournament_events.4005.c.tt: "Přešvihneš kopí v dlouhé křivce, která zaručeně srazí soupeře ze sedla."
 ep2_tournament_events.4006.t: "$tournament_versus_header$ Milosrdenství"
 ep2_tournament_events.4006.desc: "Oba koně se dají do klusu. Mé kopí klesá do polohy, ale [versus_contestant.GetFirstName] stejný pohyb nedělá. [Select_CString(versus_contestant.IsFemale,'Její','Jeho')] kopí naopak míří stranou, daleko ode mě.\n\nZnalci klání na kopí tenhle průjezd bez útoku dobře znají. Záměrným odkloněním kopí během nájezdu soupeř žádá o opakování. Vyhovět takové prosbě je věcí vzájemné úcty.\n\nOvšem jen pokud člověk soupeřovo přání #EMP zahlédne#!..."
 ep2_tournament_events.4006.a: "Nebudu brát snadné výhry."
 ep2_tournament_events.4006.a.tt: "Vyhov přání [versus_contestant.Custom('CZ_FirstNameNoTooltip_G')] a projeď bez útoku."
 ep2_tournament_events.4006.b: "Ach, té žádosti jsem si asi [Select_CString(ROOT.Char.IsFemale,'nevšimla','nevšiml')]!"
 ep2_tournament_events.4006.b.tt: "Nenech své kopí uhnout."
 ep2_tournament_events.4007.t: "$tournament_versus_header$ Zkáza a stájník"
 ep2_tournament_events.4007.desc: "Po nájezdu kolem mě na koni projíždí [versus_contestant.GetFirstName] a upravuje zvířeti uzdu. Vedle se šourá [Select_CString(groom.IsFemale,'stájnice','stájník')] v překvapivě otrhaném oděvu. Látka se třepí ve švech.\n\n„Jak se jmenuješ, [Select_CString(groom.IsFemale,'dobrá ženo','dobrý muži')]?“ Polekaně ke mně vzhlédne, zatímco kůň i jeho jezdec pokračují dál.\n\n„[groom.GetFirstName], [ROOT.Char.Custom('FormOfAddressForLiege')|l].“ Při odpovědi nelze přehlédnout závistivý pohled, kterým přeměří svůj upravený protějšek pečující o mého koně."
 ep2_tournament_events.4007.a: "Co za bídné stvoření!"
 ep2_tournament_events.4007.b: "Co takhle nová práce?"
 ep2_tournament_events.4007.b.tt: "[versus_contestant.Custom('CZ_FirstNameNoTooltip_D')] se to nebude líbit..."
 ep2_tournament_events.4007.c: "Nechceš si vydělat nějakou tu minci?"
 ep2_tournament_events.4007.c.tt: "Přesvědči [Select_CString(groom.IsFemale,'ji','ho')], aby [Select_CString(groom.IsFemale,'plácla','plácl')] koně pořádně přes záď."
 ep2_tournament_events.4007.d: "Služ dobře svému pánovi, [groom.Custom('CZ_FirstNameNoTooltip_V')]."
 ep2_tournament_events.4008.t: "$tournament_versus_header$ Kdo jsi?"
 ep2_tournament_events.4008.desc: "Z tribun se valí hluk a můj kůň neklidně stříhá ušima. Konejšivě ho pohladím po hřívě. Dav je při tomhle kole mimořádně nepřátelský. Když k němu vzhlédnu, propukne ve zpěv.\n\n#EMP [ROOT.Char.Custom('GetNegativeChant')]#!\n\nNěkteří se už naklánějí přes hrazení. Se znepokojením sleduji řvoucí tváře v první řadě, potřísněné slinami a obrácené přímo ke mně."
 ep2_tournament_events.4008.a: "Budou se muset vyrovnat s mým vítězstvím!"
 ep2_tournament_events.4008.a.success: "Úspěšně odrazíš urážky davu"
 ep2_tournament_events.4008.a.failure: "Dav tě rozhodí"
 ep2_tournament_events.4008.a.criticalfailure: "Dostaneš menší zranění od davu, který na tebe hází předměty"
 ep2_tournament_events.4008.b: "Nejsem si [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')], zda by mi vítězství prospělo..."
 ep2_tournament_events.4008.b.tt: "Úmyslně prohrát soutěž."
 ep2_tournament_events.4009.t: "$tournament_versus_header$ Chudý paladin"
 ep2_tournament_events.4009.desc: "Křup! Dvě kopí se při zásahu prudce roztříští. Poddám se zpětnému rázu, jak mě to učili, a narovnám se, když kůň zpomalí do kroku. Sotva setřesu omámení z nárazu, přiměje mě rostoucí rozruch mezi diváky ohlédnout se.\n\n[versus_contestant.GetFirstName] je zjevně v nesnázích. Ne v tělesných, pokud mohu soudit. S nešťastným sluhou ale vede cosi mezi rozpravou a hádkou. Přijedu blíž a zaslechnu pár útržků.\n\n„Jak to myslíš, že už nemáme další? Ty jsi to jediné náhradní #EMP ztratil#!?!“"
 ep2_tournament_events.4009.desc.poor: "\n\nChvíli mi to trvá, ale pak si vzpomenu. Na zvěstech o současných finančních potížích [versus_contestant.Custom('CZ_FirstNameNoTooltip_G')] možná bylo víc pravdy, než jsem si [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')]..."
 ep2_tournament_events.4009.desc.lowborn: "\n\nPomalu mi dochází souvislosti. [versus_contestant.GetFirstNameNoTooltip] nemá urozený původ. Sehnat peníze je pro [Select_CString(versus_contestant.IsFemale,'ni','něj')] nejspíš mnohem těžší, než bych [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')]..."
 ep2_tournament_events.4009.a: "Ha, ha! S takovou bídou táhni z kolbiště, ty [versus_contestant.Custom2('CZ_InsultNoun_V', ROOT.Char)|l]!"
 ep2_tournament_events.4009.b: "„[versus_contestant.Custom('CZ_FirstNameNoTooltip_V')|U]! Mohu ti nabídnout kopí?“"
 ep2_tournament_events.4009.c: "No, soutěž musí pokračovat."
 ep2_tournament_events.4500.t: "$tournament_header$ Jezdci"
 ep2_tournament_events.4500.desc: "Můj kůň je samozřejmě připraven, ale zvíře samo o sobě nic neznamená bez schopného jezdce, který ho ovládne. V důsledku toho mám před sebou tři potenciální jezdce, kteří se všichni hlásí o čest být vybráni, aby mě zastupovali.\n\n"
 ep2_tournament_events.4500.knight: "Jako první se hlásí [jockey1.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('jockey1') )|l]. Díky zkušenostem s koňmi, které patří k [Select_CString(jockey1.IsFemale,'jejímu','jeho')] povolání, má slušné předpoklady."
 ep2_tournament_events.4500.guest: "Hned se přidává [jockey2.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('jockey2') )|l]. Snad se chce odvděčit za mou pohostinnost."
 ep2_tournament_events.4500.nobody: "\n\nPoslední osobu vůbec neznám. Je to bezvýznamné místní [Select_CString(jockey3.IsFemale,'děvče jménem','muž jménem')] [jockey3.GetFirstName]."
 ep2_tournament_events.4500.fallback: "Žádný ze tří nevypadá jako obzvlášť vynikající kandidát - všichni jsou mi úplně cizí a zjevně jen prostí lidé hledající šanci na slávu a bohatství - ale jsou to jediní dostupní."
 ep2_tournament_events.4500.a: "Ty se hodíš!"
 ep2_tournament_events.4500.b: "Možná ty?"
 ep2_tournament_events.4500.c: "Inu, trocha hazardu mi není cizí..."
 ep2_tournament_events.4500.knight.tt: "Zvolím [jockey1.Custom('CZ_FirstNameNoTooltip_A')]."
 ep2_tournament_events.4500.guest.tt: "[jockey2.GetFirstNameNoTooltip|U] se zdá jako dobrá volba."
 ep2_tournament_events.4500.nobody.tt: "Proč nevsadit na [jockey3.Custom('CZ_FirstNameNoTooltip_A')]?"
 ep2_tournament_events.5501.t: "$tournament_contest_header$ Ukradený okamžik"
 ep2_tournament_events.5501.desc: "Když [enemy.GetFirstName] zakončí přednes rozmáchlým gestem a úklonou, diváci propuknou v divoký jásot. Jediný, kdo nepíská a netleská, jsem shodou okolností já.\n\n#EMP Jak#! to [Select_CString(enemy.IsFemale,'mohla','mohl')] vědět? Bylo to naplánované? Nebo se o to nějak postaral [ROOT.Char.GetFaith.DevilName] a verše [enemy.Custom('CZ_FirstNameNoTooltip_G')] jsou s těmi mými téměř #EMP totožné#! úplnou náhodou?\n\nShromáždění diváci očekávavě ztichnou. Je řada na mně."
 ep2_tournament_events.5501.a: "Ukážu jim, že jde především o #EMP podání#!."
 ep2_tournament_events.5501.b: "Čas improvizovat!"
 ep2_tournament_events.5501.b.success: "Podaří se ti zaimprovizovat"
 ep2_tournament_events.5501.b.failure: "Tvůj pokus je katastrofa"
 ep2_tournament_events.5501.c: "To bylo plánované. Sudí!"
 ep2_tournament_events.5501.c.success: "#EMP Opravdu#! to byla lest [enemy.Custom('CZ_FirstNameNoTooltip_G')]"
 ep2_tournament_events.5501.c.failure: "Všichni tě považují za [Select_CString(ROOT.Char.IsFemale,'pomatenou hlupačku','pomateného hlupáka')]"
 ep2_tournament_events.5502.t: "$tournament_contest_header$ Všechno jen nedorozumění"
 ep2_tournament_events.5502.start: "Stačí jediný verš a začne šumění. [contestant.GetFirstName] na pódiu zcela #EMP nestydatě#! přednáší slova známé místní písničky! Jak přednes pokračuje, v davu sílí nespokojené mručení.\n\n"
 ep2_tournament_events.5502.culture: "Něco mi tu nesedí. [contestant.GetFirstNameNoTooltip] přece má [contestant.GetCulture.Custom('CZ_Adjective_yy')|l] původ, tuhle písničku by tedy znát [Select_CString(contestant.IsFemale,'neměla','neměl')]. Bezděčně se mi vybaví drobná vzpomínka. Dělník, který stavěl pódium, si předtím právě tuhle melodii pískal!"
 ep2_tournament_events.5502.friend: "Hned pochopím, co se stalo, i když dav dál spílá [Select_CString(contestant.IsFemale,'mé přítelkyni','mému příteli')] [contestant.Custom('CZ_FirstNameNoTooltip_D')]. Má přece [contestant.GetCulture.Custom('CZ_Adjective_yy')|l] původ. Melodii jistě jen někde [Select_CString(contestant.IsFemale,'zaslechla','zaslechl')] a netuší, jak je rozšířená!"
 ep2_tournament_events.5502.end: "\n\n[contestant.GetFirstNameNoTooltip|U] na pódiu zvolna ztratí řeč. Dav vybuchne v posměšky a na nešťastnou postavu začne pršet vybraná zelenina. Zbývá jí jen krýt se před střelami."
 ep2_tournament_events.5502.a: "Dost! To není [Select_CString(contestant.IsFemale,'její','jeho')] vina!"
 ep2_tournament_events.5502.c.success: "Podaří se ti přesvědčit dav"
 ep2_tournament_events.5502.c.failure: "Dav nedbá tvých proseb"
 ep2_tournament_events.5502.b: "Buuuu! #EMP Buuuu!#!"
 ep2_tournament_events.5502.c: "No, to je velmi nevhodné."
 ep2_tournament_events.5503.t: "$tournament_contest_header$ Tréma"
 ep2_tournament_events.5503.desc: "Trubky hrají! Dav jásá a křičí! Vystupuji na pódium pro recitaci, mávám. Nastane ticho, když zaujmu hrdinskou pózu, hrudník se vypne, paže rozpažím.\n\nOtevřu ústa. Je tam sucho. Velmi, velmi sucho. Snažím se mluvit, ale slova nepřicházejí. Stovky očí se upírají na mě.\n\nProč nemůžu mluvit?!"
 ep2_tournament_events.5503.rich: "Sílí šumění diváků a mé tápající ruce cosi sevřou. Něco velkého a koženého. Můj měšec s mincemi."
 ep2_tournament_events.5503.seducer: "Panika mě nutí třást se, dech se mi trhá v... #EMP povědomém#! rytmu. Připomínka... že vášeň mě dosud nikdy nezklamala..."
 ep2_tournament_events.5503.fallback: "Uzlík v mém žaludku, ještě před chvílí neznámý, se nechutně stáhne a mumlání davu sílí."
 ep2_tournament_events.5503.a: "Musí tu být něco, čím se prokousám..."
 ep2_tournament_events.5503.a.tt: "Naštěstí mám v paměti pár starých veršů!"
 ep2_tournament_events.5503.b: "Hle! Mince zadarmo!"
 ep2_tournament_events.5503.b.tt: "Až se po nich všichni vrhnou, rychle uteču!"
 ep2_tournament_events.5503.c: "Trocha #EMP fyzického předvedení#! by neuškodila."
 ep2_tournament_events.5503.c.tt: "Diváci to budou #EMP milovat#!"
 ep2_tournament_events.5503.d: "Podívejte! Tříhlavá opice!"
 ep2_tournament_events.5503.d.win: "Podaří se ti odvést pozornost diváků"
 ep2_tournament_events.5503.d.lose: "Dav není oklamán"
 ep2_tournament_events.5503.e: "„E-#EMP hm#!. Jak naši, ehm, předkové kdysi z-z-zpívali...“"
 ep2_tournament_events.5504.t: "$tournament_contest_header$ Vůle počasí"
 ep2_tournament_events.5504.desc: "#BOL Kra-buuum!#!\n\nOblohu protne blesk a vzápětí zaburácí hrom. Cestou k vyvýšenému pódiu vidím, že po příjemném počasí zbylo jen pochmurné šero. Sotva vystoupím na první schod, rozprší se.\n\nDiváci poněkud neochotně čekají a každou minutou víc promokají. Otevřu ústa a celé shromáždění přehluší další dunivý úder. Vzhlédnu k nebi.\n\nTohle tedy bude výzva."
 ep2_tournament_events.5504.a: "...a já #EMP miluji#! výzvy!"
 ep2_tournament_events.5504.a.success: "Počasí dodá tvým slovům patos"
 ep2_tournament_events.5504.a.failure: "Bouře tě přehluší"
 ep2_tournament_events.5504.b: "A co když nás zasáhne blesk?!"
 ep2_tournament_events.5505.t: "$tournament_contest_header$ Využití příležitosti"
 ep2_tournament_events.5505.desc: "Další verš, další nadšený ohlas. Náramně si to užívám a hlučný vděk davu mi zvedá náladu ještě výš.\n\nZatímco přijímám potlesk za obzvlášť duchaplný obrat, všimnu si [enemy.Custom('CZ_FirstName_G')], jak se zamračenou tváří nacvičuje vlastní verše. Další vlna ovací mé podezření potvrdí. Můj úspěch [Select_CString(enemy.IsFemale,'ji','ho')] zjevně vůbec netěší!\n\nInu, třeba si"
 ep2_tournament_events.5505.start.malevirgin: "ten smutný samotář, který nikdy nepoznal ženu,"
 ep2_tournament_events.5505.start.femalevirgin: "ta zavalitá samotářka, kterou nikdo nemiluje,"
 ep2_tournament_events.5505.start.old: "[Select_CString(enemy.IsFemale,'ta seschlá, vetchá stařena','ten seschlý, vetchý stařec')]"
 ep2_tournament_events.5505.start.fat: "ta ufňukaná, mastná hrouda"
 ep2_tournament_events.5505.start.soft: "ta usměvavá měkkota"
 ep2_tournament_events.5505.start.compassionate: "ta nešťastná duše"
 ep2_tournament_events.5505.start.fallback: "ten [enemy.Custom2('InsultAdjective', ROOT.Char)|l] [enemy.Custom2('InsultNoun', ROOT.Char)|l]"
 ep2_tournament_events.5505.end: " zaslouží verš ušitý #EMP přímo#! na míru!\n\n„Kdyby tu osobně byl [ROOT.Char.GetFaith.HighGodName], nejspíš by řekl...“"
 ep2_tournament_events.5505.maidenless: "...[enemy.GetFirstNameNoTooltip] je v lásce #EMP žalostná#! bída!"
 ep2_tournament_events.5505.old: "...ani kdyby zasáhl [ROOT.Char.GetFaith.HighGodNameSheHe], chátrání [enemy.Custom('CZ_FirstNameNoTooltip_G')] se nedá zastavit!"
 ep2_tournament_events.5505.torturer: "...z těla [enemy.Custom('CZ_FirstName_G')] je čas kůži rvát!"
 ep2_tournament_events.5505.fat: "...ani [ROOT.Char.GetFaith.HighGodNameSheHe] by [enemy.Custom('CZ_FirstNameNoTooltip_A')] nedokázal odtáhnout!"
 ep2_tournament_events.5505.idiot: "...[enemy.GetFirstNameNoTooltip] páchne!"
 ep2_tournament_events.5505.compassionate: "...kup [enemy.Custom('CZ_FirstNameNoTooltip_D')] pití a hned tě začne o placení přemlouvat!"
 ep2_tournament_events.5505.fallback: "...porazit [enemy.Custom('CZ_FirstNameNoTooltip_A')] v tomhle je dětská hra!"
 ep2_tournament_events.5505.getout: "...nevadí."
 ep2_tournament_events.5505.opinion.tt: "Každý blízký člen rodiny, který není sadistou:"
 ep2_tournament_events.6501.t: "$tournament_contest_header$ Sláva a bohatství"
 ep2_tournament_events.6501.desc: "Polem vane lehký vánek a další soutěžící střílí. Diváci jsou uctiví a tiší. Upřímně, až #EMP příliš#! tiší a uctiví. Mezi zdvořilým potleskem, když drnkne tětiva a šíp zasáhne terč, jako bych [Select_CString(ROOT.Char.IsFemale,'zaslechla','zaslechl')] zívnutí.\n\nNastoupím na řadu. Opět pár uhlazených, roztroušených pochval. Tohle shromáždění zrovna životem nekypí.\n\nPři nasazování šípu mě napadne nápad. Ne příliš rozumný, ale zato vzrušující.\n\nU tohohle ať zkusí zívat!"
 ep2_tournament_events.6501.a: "Na mě se bude vzpomínat po generace!"
 ep2_tournament_events.6501.a.tt.win: "Zasáhneš terč při balancování na jedné noze na sloupku plotu"
 ep2_tournament_events.6501.a.tt.lose: "Uklouzneš a spadneš"
 ep2_tournament_events.6501.b: "Dám jim důvod k jásotu!"
 ep2_tournament_events.6501.b.tt.win: "Zasáhneš terč se zavázanýma očima"
 ep2_tournament_events.6501.b.tt.lose: "Mineš"
 ep2_tournament_events.6501.c: "Po zvážení..."
 ep2_tournament_events.6502.t: "$tournament_contest_header$ Ruka a noha"
 ep2_tournament_events.6502.desc: "Klání na kopí je vždy podívaná pro oči i uši. Náraz kopí do štítu protíná dunění kopyt a čekající koně řehtají a odfrkují.\n\nPrávě naslouchám, když bojištěm zazní jiný zvuk. Krátké ostré vyjeknutí a po něm rostoucí rozruch. Pospíším si tam.\n\nKruh lidí obklopuje [versus_contestant.Custom('CZ_FirstName_A')]. Zjevně ještě před svým kolem [Select_CString(versus_contestant.IsFemale,'spadla','spadl')] z koně. Paže visí v dost děsivém úhlu. Snad je aspoň malé milosrdenství, že [versus_contestant.GetFirstNameNoTooltip] vypadá také pořádně [Select_CString(versus_contestant.IsFemale,'omámená','omámený')]."
 ep2_tournament_events.6502.a: "Tak, pomůžeme ti vstát!"
 ep2_tournament_events.6502.a.tt: "Ano, pomůžeme ti vstát. S #EMP tou#! rukou..."
 ep2_tournament_events.6502.b: "Přivolejte mého lékaře!"
 ep2_tournament_events.6502.b.tt.success: "[physician.GetFirstNameNoTooltip|U] si povede velmi dobře"
 ep2_tournament_events.6502.b.tt.failure: "[physician.GetFirstNameNoTooltip|U] mnoho nezmůže"
 ep2_tournament_events.6502.c: "Najdeme ti nějakou pomoc."
 ep2_tournament_events.6502.d: "Ta hloupá postava se měla držet pevněji."
 ep2_tournament_events.6503.t: "$tournament_contest_header$ Chybný výstřel"
 ep2_tournament_events.6503.desc: "Zkušeným okem sleduji, jak [competitor1.GetFirstName] začíná nájezd k terčům. První šíp letí přesně a zabodne se do cíle. Druhý už tolik ne. #EMP Ani zdaleka#!.\n\nVzduch protne pronikavý, příšerný výkřik. Druhý šíp totiž nejen minul terč, ale zalétl tak daleko stranou, že dopadl mezi čekající soutěžící. Přímo do [competitor2.Custom('CZ_FirstName_G')]!\n\nKolem [Select_CString(competitor2.IsFemale,'zasažené ženy','zasaženého muže')] se seběhne dav. Leží na zádech a tiskne si ránu, ze které se marně snaží zastavit krvácení. Šíp stále vězí půl dlaně hluboko v mase."
 ep2_tournament_events.6503.a: "Ustupte! Mám své masti."
 ep2_tournament_events.6503.b: "Přivolejte lékaře!"
 ep2_tournament_events.6503.c: "To mě vůbec nezajímá."
 friend_joust_endearment: "[CZProDrop(CHARACTER,'považovala','považoval')|U] [TARGET_CHARACTER.Custom('CZ_ShortUIName_A')] při klání na kopí za zábavnou společnost"
