l_polish:
 ep2_activities_legacy_track_name: "Aktivity"
 ep2_activities_legacy_track_desc: "Chceme-li skutečně poznat svět, musíme nejprve poznat ostatní lidi."
 ep2_activities_legacy_track: "[Concept('dynasty_perk','Dynastický odkaz')|EU] Aktivity"
 ep2_activities_legacy_1_name: "Po posvátné stezce"
 ep2_activities_legacy_1_pilgrimages_cheaper_effect: "Cena [CZActivity('activity_pilgrimage','G')|l] je o [EmptyScope.ScriptValue('ep2_activities_legacy_1_pilgrimages_discount_value')|0+%] nižší"
 ep2_activities_legacy_1_pilgrimages_add_learning_per_holy_site_effect: "Za každé nové [Concept('holy_site','svaté místo')|E] své [Concept('faith','víry')|E], které navštívíš, získáš [EmptyScope.ScriptValue('ep2_activities_legacy_1_pilgrimages_learning_add_value')|0+=] [Concept('learning','učenosti')|E]#WEAK , nejvýše však [EmptyScope.ScriptValue('ep2_activities_legacy_1_pilgrimages_learning_cap_value')|0+=]#!"
 ep2_activities_legacy_2_name: "Tradiční svatby dynastie [GetPlayer.GetDynasty.GetBaseNameNoTooltip]"
 ep2_activities_legacy_2_grand_weddings_cheaper_effect: "Cena [CZActivity('activity_wedding','G')|l] je o [EmptyScope.ScriptValue('ep2_activities_legacy_2_grand_weddings_discount_value')|0+%] nižší"
 ep2_activities_legacy_2_grand_weddings_acceptance_boost_effect: "Bonus k přijetí [CZActivity('activity_wedding','G')|l]: [EmptyScope.ScriptValue('ep2_activities_legacy_2_grand_weddings_acceptance_boost_value')|0+=]"
 ep2_activities_legacy_2_grand_weddings_increased_strong_hook_on_liege_event_effect: "Při [CZActivity('activity_wedding','L')|l] máš vyšší šanci získat dočasnou [Concept('strong_hook','silnou páku')|E] na [Concept('lieges','lenní pány')|E], kteří tě mají v oblibě"
 ep2_activities_legacy_3_name: "Poctít návštěvou"
 ep2_activities_legacy_3_tours_majesty_modifier_effect: "Po dokončení turné „$tour_type_majesty$“ získáš na [EmptyScope.ScriptValue('ep2_activities_legacy_3_tours_modifier_duration_value')] let modifikátor [GetModifier('ep2_activities_legacy_3_tours_majesty_modifier').GetNameWithTooltip]"
 ep2_activities_legacy_3_tours_intimidation_modifier_effect: "Po dokončení turné „$tour_type_intimidation$“ získáš na [EmptyScope.ScriptValue('ep2_activities_legacy_3_tours_modifier_duration_value')] let modifikátor [GetModifier('ep2_activities_legacy_3_tours_intimidation_modifier').GetNameWithTooltip]"
 ep2_activities_legacy_3_tours_taxation_modifier_effect: "Po dokončení turné „$tour_type_taxation$“ získáš na [EmptyScope.ScriptValue('ep2_activities_legacy_3_tours_modifier_duration_value')] let modifikátor [GetModifier('ep2_activities_legacy_3_tours_taxation_modifier').GetNameWithTooltip]"
 ep2_activities_legacy_3_tours_reset_modifier_timers_effect: "Po dokončení jakékoli [CZActivity('activity_tour','G')|l] se obnoví doba trvání všech již získaných výše uvedených modifikátorů"
 ep2_activities_legacy_4_name: "Rodinné recepty"
 ep2_activities_legacy_4_hunts_up_legendary_hunt_sightings_effect: "Výrazně vyšší pravděpodobnost výskytu zpráv o spatření legendárních zvířat"
 ep2_activities_legacy_5_name: "Pole zlatého sukna"
 ep2_activities_legacy_5_tournaments_invite_knights_boosts_effect: "[Concept('decision','Rozhodnutí')|EU] $invite_knights_decision$ je během [CZActivity('activity_tournament','G')|l] zdarma a přiláká [Concept('characters','postavy')|E] s vyšší [Concept('prowess','udatností')|E]"
 ep2_activities_legacy_5_house_heads_get_one_freebie_grand_activity_effect: "Každá z [Concept('house_heads','hlav rodů')|E] může svou první [Concept('grand_activity','velkolepou aktivitu')|E] uspořádat zdarma"
 ep2_activities_legacy_3_tours_majesty_modifier: "Projevovaná přízeň"
 ep2_activities_legacy_3_tours_majesty_modifier_desc: "Tato postava je známá svými poklidnými, ale působivými návštěvami vazalů, při nichž jim dává najevo svou panovnickou přízeň."
 ep2_activities_legacy_3_tours_intimidation_modifier: "Vzbuzování strachu"
 ep2_activities_legacy_3_tours_intimidation_modifier_desc: "Tato postava věří, že osobní přítomnost je nezbytná k udržení vlády založené na strachu."
 ep2_activities_legacy_3_tours_taxation_modifier: "Panské dávky"
 ep2_activities_legacy_3_tours_taxation_modifier_desc: "Tato postava považuje pečlivé vedení účtů a důsledný výběr daní za nejdůležitější povinnosti každého lenního pána."
