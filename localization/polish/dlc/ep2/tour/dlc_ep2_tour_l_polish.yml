 tour_stop_cultural_festival_log: "[CHARACTER.GetTitledFirstName] navštívil [TARGET_CHARACTER.GetTitledFirstName] na kulturní festival v [PROVINCE.GetName]"
 tour_base_cost: "Základní"
 activity_tour_guest_desc: "Vaši hosté vás budou doprovázet při návštěvách vašich [Concept('vassals','vazalů')|E] na cestě" # todo: CONCEPT CASE
 activity_tour_province_desc: "Navštivte [ROOT.Province.GetTitle.GetHolder.GetName] v [ROOT.Province.GetName]\nVáš [GetPlayer.Custom2('RelationToMe', ROOT.Province.GetTitle.GetHolder)]\n[Concept('opinion','Mínění')|E] o vás: [ROOT.Province.GetTitle.GetHolder.GetOpinionOf( GetPlayer )|+=]" # todo: CONCEPT CASE
 5_courtiers_or_more: "Musíte mít nejméně 5 [Concept('courtiers','dvořané')|E]" # todo: CONCEPT CASE
 more_than_5_courtiers: "Musíte mít více než 5 [Concept('courtiers','dvořané')|E]" # todo: CONCEPT CASE
 more_than_10_courtiers: "Musíte mít více než 10 [Concept('courtiers','dvořané')|E]" # todo: CONCEPT CASE
 3_vassals_or_more: "Musíte mít nejméně 3 [Concept('vassals','vazalové')|E]" # todo: CONCEPT CASE
 activity_tour_destination_selection: "Čím dál je vaše cílová destinace od předchozího [Concept('stop','zastávky')|E], tím více [Concept('gold','zlato')|E] utratíte na svou cestu. Plánujte moudře, abyste snížili náklady a navštívili co nejvíce [Concept('vassals','vazalové')|E]." # todo: CONCEPT CASE
 activity_window_character_visited_vassal: "Host a [Concept('vassal','vazal')|E] na vaší zastávce\n[Character.GetShortUINameNoTooltip|U]" # todo: CONCEPT CASE
