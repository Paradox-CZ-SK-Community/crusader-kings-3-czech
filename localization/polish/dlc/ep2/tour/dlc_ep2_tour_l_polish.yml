 tour_start_taxation_log_title: "$tour_start_majesty_log_title$"
 tour_start_taxation_log: "[CHARACTER.GetTitledFirstName] vypravil se z [CHARACTER.GetCapitalLocation.GetName] na daňovou [grand_tour|E]"
 tour_stop_tour_grounds_log_title: "Zastávka na cestě"
 tour_stop_tour_grounds_log: "[CHARACTER.GetTitledFirstName] navštívil [TARGET_CHARACTER.GetTitledFirstName], aby prohlédl panství [PROVINCE.GetName]"
 tour_stop_dinner_log_title: "$tour_stop_tour_grounds_log_title$"
