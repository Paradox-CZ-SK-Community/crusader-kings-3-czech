 more_than_10_courtiers: "Musíš mít více než 10 [Concept('courtiers','dvořanů')|E]"
 3_vassals_or_more: "Musíš mít alespoň 3 [Concept('vassals','vazaly')|E]"
 activity_tour_destination_selection: "Čím vzdálenější je cíl od předchozí [Concept('stop','zastávky')|E], tím více [Concept('gold','zlata')|E] za své turné utratíš. Plánuj cestu pečlivě, abys omezil náklady a navštívil co nejvíce [Concept('vassals','vazalů')|E]."
