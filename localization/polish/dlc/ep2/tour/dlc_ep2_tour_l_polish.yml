 tour_start_taxation_log: "[CHARACTER.GetTitledFirstName|U] [Select_CString(CHARACTER.IsFemale,'vyrazila','vyrazil')] [CZPrepZ(CHARACTER.GetCapitalLocation.GetNameNoTooltip)] [CZProvName(CHARACTER.GetCapitalLocation,'G')] na [Concept('grand_tour','velké turné')|E] zaměřené na výběr daní"
