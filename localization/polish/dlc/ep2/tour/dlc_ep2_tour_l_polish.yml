 tour_speed_normal: "Jízdní koně"
 tour_speed_good: "Sekretariát"
 tour_type_majesty: "Majestátní cesta"
 tour_type_majesty_desc: "$EFFECT_LIST_BULLET$ Některé události umožní obzvlášť majestátní činy\n$EFFECT_LIST_BULLET$ Jejich provedení přináší [prestige|E] a [vassal|E] [opinion|E] jak při odjezdu ze [stop|E], tak na konci vaší [GetActivityType('activity_tour').GetName]\n\n#weak Tato Velká cesta je příležitostí ukázat svým poddaným, že jsem spravedlivý, dobrotivý a majestátní pán.#!"
 tour_type_intimidation: "Cesta zastrašování"
 tour_type_intimidation_desc: "$EFFECT_LIST_BULLET$ Některé události umožní obzvlášť hrozné činy\n$EFFECT_LIST_BULLET$ Jejich provedení přináší [dread|E]\n$EFFECT_LIST_BULLET$ Když odjedete ze [stop|E], můžete se pokusit vyhnat [vassals|E] z nepřátelských [factions|E]\n\n#weak Tato Velká cesta je příležitostí dát svým poddaným najevo jejich místo a ukázat, jak opravdu děsivý mohu být.#!"
 tour_type_taxation: "Daňová cesta"
 tour_type_taxation_desc: "$EFFECT_LIST_BULLET$ Některé události umožní chamtivé činy\n$EFFECT_LIST_BULLET$ Jejich provedení přináší [gold|E] jak při odjezdu ze [stop|E], tak na konci vaší [GetActivityType('activity_tour').GetName]\n\n#weak Tato Velká cesta je příležitostí připomenout svým vazalům, že mi dluží daně a povinnosti, a vypátrat ve svém panství veškeré vyhýbání se daním.#!"
 tour_entourage: "Doprovod"
 tour_entourage_small: "Malý doprovod"
 tour_entourage_small_desc: "$EFFECT_LIST_BULLET$ Pět blízkých [courtiers|E] vás bude doprovázet na vaší [tour|E]\n\n#weak Moje cesta je příležitostí uniknout soudnímu životu a navštívit své vzdálené poddané. Nemusím mít při svých cestách za sebou žvanění soudního dvora.#!"
 tour_entourage_normal: "Skromný doprovod"
 tour_entourage_normal_desc: "$EFFECT_LIST_BULLET$ Deset blízkých [courtiers|E] vás doprovodí na vaší [tour|E]\n$EFFECT_LIST_BULLET$ $tour_increase_prestige$\n\n#weak Moje cesta není jen pro mě, ale také pro můj dvůr. Musím si vzít malý doprovod, aby si moji vazalové více zvykli na mé dvořany.#!"
 tour_entourage_grand: "Velký doprovod"
 tour_entourage_grand_desc: "$EFFECT_LIST_BULLET$ Všichni dostupní [courtier|E] vás doprovodí na vaší [tour|E]\n$EFFECT_LIST_BULLET$ $tour_increase_prestige$\n\n#weak Moje cesta je příležitostí ukázat, jak velkolepý a nádherný jsem, a jaký lepší způsob než vzít s sebou každého člena mého záviděníhodného dvora?#!"
 tour_luxuries: "Luxus"
 tour_luxuries_bad: "Žádný luxus"
 tour_luxuries_bad_desc: "$EFFECT_LIST_BULLET$ Žádné zvýšení úspěšnosti vaší [tour|E]\n\n#weak Nepřivezete žádné luxusní předměty z domova.#!"
 tour_luxuries_normal: "Základní luxusy"
 tour_luxuries_normal_desc: "$EFFECT_LIST_BULLET$ $tour_increase_success$\n\n#weak Přivezete pouze základní luxusní potraviny a vybavení.#!"
 tour_luxuries_good: "Extravagantní luxus"
 tour_luxuries_good_desc: "$EFFECT_LIST_BULLET$ $tour_increase_success$\n\n#weak Žádný výdaj není příliš velký pro vaši cestu — všechny druhy lahůdek a vymožeností budou přivezeny po celou dobu vaší cesty.#!"
 tour_furniture_normal: "Luxusní nábytek"
 tour_furniture_normal_desc: "$EFFECT_LIST_BULLET$ $tour_increase_success$\n$EFFECT_LIST_BULLET$ $tour_increase_prestige$\n\n#weak Skříně, židle a stoly budou přivezeny na vaši cestu.#!"
 tour_furniture_good: "Nadměrný nábytek"
 tour_furniture_good_desc: "$EFFECT_LIST_BULLET$ $tour_increase_success$\n$EFFECT_LIST_BULLET$ $tour_increase_prestige$\n\n#weak Prakticky každý artefakt a kus nábytku, který vlastníte, bude přivezen na tuto cestu, aby demonstroval vaše ohromné bohatství.#!"
 tour_increase_success: "Zvýší počáteční úspěšnost vaší [tour|E]"
