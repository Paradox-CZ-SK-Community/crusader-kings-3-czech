 tour_base_cost: "Základní náklady"
 activity_tour_guest_desc: "Hosté tě budou doprovázet při návštěvách tvých [Concept('vassals','vazalů')|E] během turné"
 activity_tour_province_desc: "Navštiv [ROOT.Province.GetTitle.GetHolder.Custom('CZ_Name_A')] [CZPrepV(ROOT.Province.GetNameNoTooltip)] [CZProvName(ROOT.Province,'L')]\nVztah k tobě: [GetPlayer.Custom2('RelationToMe', ROOT.Province.GetTitle.GetHolder)]\n[Concept('opinion','Mínění')|EU] o tobě: [ROOT.Province.GetTitle.GetHolder.GetOpinionOf( GetPlayer )|+=]"
 5_courtiers_or_more: "Musíš mít alespoň 5 [Concept('courtiers','dvořanů')|E]"
