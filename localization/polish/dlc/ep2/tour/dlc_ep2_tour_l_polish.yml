l_polish:
 activity_tour: "Velká cesta"
 activity_tour_desc: "Uspořádejte okázalé [Concept('tour','turné')|E] a navštivte své [Concept('vassals','vazaly')|E] a jejich území. Každý [Concept('stop','zastávka')|E] bude trvat #bold 2 měsíce#!" # todo: CONCEPT CASE
 activity_tour_selection_tooltip: "Cestujte po svém panství a navštivte své [Concept('vassals','vazaly')|E] při velkolepém [tour|E]\n\nPředpokládané odměny:\n$BULLET_WITH_TAB$[control_i] [Concept('county_control','Kontrola hrabství')|E]\n$BULLET_WITH_TAB$@domain_icon! [Concept('county_opinion','Lidové mínění')|E]\n$BULLET_WITH_TAB$[legitimacy_i] [Concept('legitimacy','Legitimita')|E] Zisk\n$BULLET_WITH_TAB$[stress_loss_i] [Concept('stress','Stres')|E] Snížení" # todo: CONCEPT CASE
 activity_tour_host_desc: "$BULLET_WITH_TAB$@control_icon![Concept('county_control','Kontrola hrabství')|E]\n$BULLET_WITH_TAB$@domain_icon![Concept('county_opinion','Lidové mínění')|E]\n$BULLET_WITH_TAB$[legitimacy_i] [Concept('legitimacy','Legitimita')|E] Zisk\n$BULLET_WITH_TAB$[stress_loss_i] [Concept('stress','Stres')|E] Snížení\n\n[Concept('tour_success','Úspěch turné')|E] Odměny:\n$BULLET_WITH_TAB$Level #V 1#!: [Concept('prestige_i','@prestige_icon!')|E][Concept('prestige','prestiž')|E]\n$BULLET_WITH_TAB$Level #V 2#!: [GetVassalStance( 'parochial' ).GetTextIcon][GetVassalStance( 'parochial' ).GetName] [Concept('vassal','vazal')|E] [Concept('opinion','mínění')|E]\n$BULLET_WITH_TAB$Level #V 3#!: Názor navštíveného [Concept('vassal','vazala')|E] [Concept('opinion','mínění')|E]\n$BULLET_WITH_TAB$Level #V 4#!: [GetModifier( 'itinerant_liege_modifier' ).GetNameWithTooltip|L] #weak ([Concept('character','postava')|E])#!\n$BULLET_WITH_TAB$Level #V 5#!: [GetModifier( 'mega_itinerant_liege_modifier' ).GetNameWithTooltip|L] #weak ([Concept('character','postava')|E])#!" # todo: CONCEPT CASE
 activity_tour_conclusion_characters_header: "Navštívení vazalové"
 itinerant_liege_modifier: "Putující pán"
 itinerant_liege_modifier_desc: "Tato postava uspořádala úspěšný [Concept('tour','turné')|E]." # todo: CONCEPT CASE
 mega_itinerant_liege_modifier: "Velkolepý pán"
 mega_itinerant_liege_modifier_desc: "Tato postava uspořádala velkolepý [Concept('tour','turné')|E]." # todo: CONCEPT CASE
 activity_window_character_stop_host: "Host zastávky\n[Character.GetShortUINameNoTooltip|U]"
 activity_tour_conclusion_desc: "Vaše [GetActivityType( 'activity_tour' ).GetName] skončila."
 tour_phase_tour_grounds: "Prohlídka panství"
 tour_phase_tour_grounds_desc: "[Concept('tour_the_grounds','Obhlédnout državy')|E] panství vašeho [Concept('vassal','vazala')|E], zvyšující [Concept('control','kontrola')|E]." # todo: CONCEPT CASE
 tour_phase_dinner: "Pořádaná hostina"
 tour_phase_dinner_desc: "Užijte si [Concept('hosted_dinner','pořádané hostině')|E], pořádanou vaším [Concept('vassal','vazalem')|E], čímž se zvýší [Concept('opinion','míněním')|E] vašeho [Concept('vassal','vazalem')|E]." # todo: CONCEPT CASE
 tour_phase_cultural_festival: "Kulturní festival"
 tour_phase_cultural_festival_desc: "Užijte si [Concept('cultural_festival','kulturní slavnosti')|E], poznejte místní kulturu a zvyšte [Concept('county_opinion','lidové mínění')|E] a [Concept('cultural_acceptance','kulturní přijetí')|E]." # todo: CONCEPT CASE
 tour_phase_journey_home: "Návrat domů"
 tour_phase_journey_home_desc: "Vraťte se do svého hlavního města a ukončete svou cestu."
 tour_phase_tour_grounds_cost_desc: "[Concept('tour_grounds','Obhlédnout državy')|E] v [province.GetBaronyNameExplicitly]" # todo: CONCEPT CASE
 tour_phase_dinner_cost_desc: "[Concept('hosted_dinner','Pořádaná hostina')|E] v [province.GetBaronyNameExplicitly]" # todo: CONCEPT CASE
 tour_phase_cultural_festival_cost_desc: "[Concept('cultural_festival','Kulturní slavnost')|E] v [province.GetBaronyNameExplicitly]" # todo: CONCEPT CASE
 tour_option_speed: "Kone"
 tour_speed_bad: "Oseli"
 tour_speed_normal: "Jízdní koně"
 tour_speed_good: "Sekretariát"
 tour_type_majesty: "Majestátní cesta"
 tour_type_majesty_desc: "$EFFECT_LIST_BULLET$ Některé události umožní obzvlášť majestátní činy\n$EFFECT_LIST_BULLET$ Jejich provedení přináší [Concept('prestige','prestiž')|E] a [Concept('vassal','vazal')|E] [Concept('opinion','mínění')|E] jak při odjezdu ze [Concept('stop','zastávky')|E], tak na konci vaší [GetActivityType('activity_tour').GetName]\n\n#weak Tato Velká cesta je příležitostí ukázat svým poddaným, že jsem spravedlivý, dobrotivý a majestátní pán.#!" # todo: CONCEPT CASE
 tour_type_intimidation: "Cesta zastrašování"
 tour_type_intimidation_desc: "$EFFECT_LIST_BULLET$ Některé události umožní obzvlášť hrozné činy\n$EFFECT_LIST_BULLET$ Jejich provedení přináší [Concept('dread','hrůza')|E]\n$EFFECT_LIST_BULLET$ Když odjedete ze [Concept('stop','zastávky')|E], můžete se pokusit vyhnat [Concept('vassals','vazalové')|E] z nepřátelských [Concept('factions','frakcí')|E]\n\n#weak Tato Velká cesta je příležitostí dát svým poddaným najevo jejich místo a ukázat, jak opravdu děsivý mohu být.#!" # todo: CONCEPT CASE
 tour_type_taxation: "Daňová cesta"
 tour_type_taxation_desc: "$EFFECT_LIST_BULLET$ Některé události umožní chamtivé činy\n$EFFECT_LIST_BULLET$ Jejich provedení přináší [Concept('gold','zlato')|E] jak při odjezdu ze [Concept('stop','zastávky')|E], tak na konci vaší [GetActivityType('activity_tour').GetName]\n\n#weak Tato Velká cesta je příležitostí připomenout svým vazalům, že mi dluží daně a povinnosti, a vypátrat ve svém panství veškeré vyhýbání se daním.#!" # todo: CONCEPT CASE
 tour_entourage: "Doprovod"
 tour_entourage_small: "Malý doprovod"
 tour_entourage_small_desc: "$EFFECT_LIST_BULLET$ Pět blízkých [Concept('courtiers','dvořanů')|E] vás bude doprovázet na vaší [tour|E]\n\n#weak Moje cesta je příležitostí uniknout soudnímu životu a navštívit své vzdálené poddané. Nemusím mít při svých cestách za sebou žvanění soudního dvora.#!" # todo: CONCEPT CASE
 tour_entourage_normal: "Skromný doprovod"
 tour_entourage_normal_desc: "$EFFECT_LIST_BULLET$ Deset blízkých [Concept('courtiers','dvořanů')|E] vás doprovodí na vaší [tour|E]\n$EFFECT_LIST_BULLET$ $tour_increase_prestige$\n\n#weak Moje cesta není jen pro mě, ale také pro můj dvůr. Musím si vzít malý doprovod, aby si moji vazalové více zvykli na mé dvořany.#!" # todo: CONCEPT CASE
 tour_entourage_grand: "Velký doprovod"
 tour_entourage_grand_desc: "$EFFECT_LIST_BULLET$ Všichni dostupní [Concept('courtier','dvořan')|E] vás doprovodí na vaší [tour|E]\n$EFFECT_LIST_BULLET$ $tour_increase_prestige$\n\n#weak Moje cesta je příležitostí ukázat, jak velkolepý a nádherný jsem, a jaký lepší způsob než vzít s sebou každého člena mého záviděníhodného dvora?#!" # todo: CONCEPT CASE
 tour_luxuries: "Luxus"
 tour_luxuries_bad: "Žádný luxus"
 tour_luxuries_bad_desc: "$EFFECT_LIST_BULLET$ Žádné zvýšení úspěšnosti vaší [tour|E]\n\n#weak Nepřivezete žádné luxusní předměty z domova.#!"
 tour_luxuries_normal: "Základní luxusy"
 tour_luxuries_normal_desc: "$EFFECT_LIST_BULLET$ $tour_increase_success$\n\n#weak Přivezete pouze základní luxusní potraviny a vybavení.#!"
 tour_luxuries_good: "Extravagantní luxus"
 tour_luxuries_good_desc: "$EFFECT_LIST_BULLET$ $tour_increase_success$\n\n#weak Žádný výdaj není příliš velký pro vaši cestu — všechny druhy lahůdek a vymožeností budou přivezeny po celou dobu vaší cesty.#!"
 tour_furniture_normal: "Luxusní nábytek"
 tour_furniture_normal_desc: "$EFFECT_LIST_BULLET$ $tour_increase_success$\n$EFFECT_LIST_BULLET$ $tour_increase_prestige$\n\n#weak Skříně, židle a stoly budou přivezeny na vaši cestu.#!"
 tour_furniture_good: "Nadměrný nábytek"
 tour_furniture_good_desc: "$EFFECT_LIST_BULLET$ $tour_increase_success$\n$EFFECT_LIST_BULLET$ $tour_increase_prestige$\n\n#weak Prakticky každý artefakt a kus nábytku, který vlastníte, bude přivezen na tuto cestu, aby demonstroval vaše ohromné bohatství.#!"
 tour_increase_success: "Zvýší počáteční úspěšnost vaší [tour|E]"
 tour_increase_prestige: "Zisk [Concept('prestige','prestiž')|E]" # todo: CONCEPT CASE
 tour_start_majesty_log_title: "Cesta začíná"
