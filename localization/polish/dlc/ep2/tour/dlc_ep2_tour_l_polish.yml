l_polish:
 activity_tour: "Velké turné"
 activity_tour_desc: "Uspořádej velkolepé [Concept('tour','turné')|E] a navštiv své [Concept('vassals','vazaly')|E] a jejich državy. Každá [Concept('stop','zastávka')|E] potrvá #bold 2 měsíce#!."
 activity_tour_selection_tooltip: "Vydej se na [Concept('grand_tour','velké turné')|E] napříč svým panstvím a navštiv své vazaly\n\nOčekávané odměny:\n$BULLET_WITH_TAB$[control_i] [Concept('county_control','Kontrola hrabství')|E]\n$BULLET_WITH_TAB$@domain_icon! [Concept('county_opinion','Lidové mínění')|E]\n$BULLET_WITH_TAB$[legitimacy_i] Zisk [Concept('legitimacy','legitimity')|E]\n$BULLET_WITH_TAB$[stress_loss_i] Snížení [Concept('stress','stresu')|E]"
 activity_tour_host_desc: "$BULLET_WITH_TAB$@control_icon![Concept('county_control','Kontrola hrabství')|E]\n$BULLET_WITH_TAB$@domain_icon![Concept('county_opinion','Lidové mínění')|E]\n$BULLET_WITH_TAB$[legitimacy_i] Zisk [Concept('legitimacy','legitimity')|E]\n$BULLET_WITH_TAB$[stress_loss_i] Snížení [Concept('stress','stresu')|E]\n\nOdměny podle [Concept('tour_success','úspěšnosti turné')|E]:\n$BULLET_WITH_TAB$Úroveň #V 1#!: [prestige_i|E][Concept('prestige','Prestiž')|E]\n$BULLET_WITH_TAB$Úroveň #V 2#!: [GetVassalStance( 'parochial' ).GetTextIcon] Mínění [Concept('vassal','vazala')|E] s postojem [GetVassalStance( 'parochial' ).GetName]\n$BULLET_WITH_TAB$Úroveň #V 3#!: [Concept('opinion','Mínění')|EU] navštíveného [Concept('vassal','vazala')|E]\n$BULLET_WITH_TAB$Úroveň #V 4#!: [GetModifier( 'itinerant_liege_modifier' ).GetNameWithTooltip|L] #weak ([Concept('character','postava')|E])#!\n$BULLET_WITH_TAB$Úroveň #V 5#!: [GetModifier( 'mega_itinerant_liege_modifier' ).GetNameWithTooltip|L] #weak ([Concept('character','postava')|E])#!"
 activity_tour_conclusion_characters_header: "Navštívení vazalové"
 itinerant_liege_modifier: "Putující panovník"
 itinerant_liege_modifier_desc: "Tato postava uspořádala úspěšné [Concept('tour','turné')|E]."
 mega_itinerant_liege_modifier: "Velkolepý panovník"
 mega_itinerant_liege_modifier_desc: "Tato postava uspořádala velkolepé [Concept('tour','turné')|E]."
 activity_window_character_stop_host: "Hostitel zastávky\n[Character.GetShortUINameNoTooltip|U]"
 activity_tour_conclusion_desc: "Tvé [GetActivityType( 'activity_tour' ).GetName|l] skončilo."
 tour_phase_tour_grounds: "Prohlídka držav"
 tour_phase_tour_grounds_desc: "Při [Concept('tour_the_grounds','obhlídce držav')|E] svého [Concept('vassal','vazala')|E] zvýšíš [Concept('control','kontrolu')|E]."
 tour_phase_dinner: "Pořádaná hostina"
 tour_phase_dinner_desc: "Vychutnej si [Concept('hosted_dinner','hostinu')|E] pořádanou tvým [Concept('vassal','vazalem')|E] a zlepši jeho [Concept('opinion','mínění')|E] o tobě."
 tour_phase_cultural_festival: "Kulturní slavnost"
 tour_phase_cultural_festival_desc: "Užij si [Concept('cultural_festival','kulturní slavnost')|E], poznej místní zvyky a zvyš [Concept('county_opinion','lidové mínění')|E] i [Concept('cultural_acceptance','kulturní přijetí')|E]."
 tour_phase_journey_home: "Návrat domů"
 tour_phase_journey_home_desc: "Vrať se do svého hlavního sídla a zakonči své turné."
 tour_phase_tour_grounds_cost_desc: "[Concept('tour_grounds','Obhlídka držav')|EU] – [province.GetBaronyNameExplicitly]"
 tour_phase_dinner_cost_desc: "[Concept('hosted_dinner','Pořádaná hostina')|EU] – [province.GetBaronyNameExplicitly]"
 tour_phase_cultural_festival_cost_desc: "[Concept('cultural_festival','Kulturní slavnost')|EU] – [province.GetBaronyNameExplicitly]"
 tour_option_speed: "Koně"
 tour_speed_bad: "Osli"
 tour_speed_normal: "Jízdní koně"
 tour_speed_good: "Secretariat"
 tour_type_majesty: "Majestátní turné"
 tour_type_majesty_desc: "$EFFECT_LIST_BULLET$ Některé události umožní obzvlášť majestátní činy\n$EFFECT_LIST_BULLET$ Za tyto činy získáš [Concept('prestige','prestiž')|E] a lepší [Concept('opinion','mínění')|E] [Concept('vassal','vazala')|E] jak při odjezdu ze [Concept('stop','zastávky')|E], tak po skončení [CZActivity('activity_tour','G')|l]\n\n#weak Toto velké turné je příležitostí ukázat poddaným, že má vláda je spravedlivá, laskavá a vznešená.#!"
 tour_type_intimidation: "Zastrašovací turné"
 tour_type_intimidation_desc: "$EFFECT_LIST_BULLET$ Některé události umožní obzvlášť kruté a děsivé činy\n$EFFECT_LIST_BULLET$ Za tyto činy získáš [Concept('dread','hrůzu')|E]\n$EFFECT_LIST_BULLET$ Při odjezdu ze [Concept('stop','zastávky')|E] se můžeš pokusit donutit [Concept('vassals','vazaly')|E] k vystoupení z nepřátelských [Concept('factions','frakcí')|E]\n\n#weak Toto velké turné je příležitostí ukázat poddaným, kam patří, a předvést jim, jakou hrůzu dokážu nahánět.#!"
 tour_type_taxation: "Daňové turné"
 tour_type_taxation_desc: "$EFFECT_LIST_BULLET$ Některé události umožní chamtivé jednání\n$EFFECT_LIST_BULLET$ Za tyto činy získáš [Concept('gold','zlato')|E] jak při odjezdu ze [Concept('stop','zastávky')|E], tak po skončení [CZActivity('activity_tour','G')|l]\n\n#weak Toto velké turné je příležitostí připomenout vazalům jejich daňové a jiné povinnosti vůči mně a odhalit všechny, kdo se v mém panství vyhýbají placení daní.#!"
 tour_entourage: "Doprovod"
 tour_entourage_small: "Malý doprovod"
 tour_entourage_small_desc: "$EFFECT_LIST_BULLET$ Pět blízkých [Concept('courtiers','dvořanů')|E] tě bude doprovázet na [Concept('tour','turné')|E]\n\n#weak Mé turné je příležitostí vzdálit se od dvorského života a poznat poddané v odlehlých koutech panství. Nepotřebuji, aby mě na každém kroku provázelo žvanění celého dvora.#!"
 tour_entourage_normal: "Skromný doprovod"
 tour_entourage_normal_desc: "$EFFECT_LIST_BULLET$ Deset blízkých [Concept('courtiers','dvořanů')|E] tě bude doprovázet na [Concept('tour','turné')|E]\n$EFFECT_LIST_BULLET$ $tour_increase_prestige$\n\n#weak Mé turné není určeno pouze mně, ale i mému dvoru. Vezmu s sebou menší doprovod, aby se mí vazalové mohli lépe seznámit s mými dvořany.#!"
 tour_entourage_grand: "Velkolepý doprovod"
 tour_entourage_grand_desc: "$EFFECT_LIST_BULLET$ Každý dostupný [Concept('courtier','dvořan')|E] tě bude doprovázet na [Concept('tour','turné')|E]\n$EFFECT_LIST_BULLET$ $tour_increase_prestige$\n\n#weak Mé turné je příležitostí předvést, jak vznešenou a nádhernou mám družinu. A co může lépe ukázat mou velikost než přítomnost všech členů mého obdivuhodného dvora?#!"
 tour_luxuries: "Přepych"
 tour_luxuries_bad: "Bez přepychu"
 tour_luxuries_bad_desc: "$EFFECT_LIST_BULLET$ Žádné zvýšení úspěšnosti tvého [Concept('tour','turné')|E]\n\n#weak Z domova si nepřivezeš žádné přepychové předměty.#!"
 tour_luxuries_normal: "Základní přepych"
 tour_luxuries_normal_desc: "$EFFECT_LIST_BULLET$ $tour_increase_success$\n\n#weak Vezmeš si s sebou jen nezbytný výběr vybraných pokrmů a pohodlného vybavení.#!"
 tour_luxuries_good: "Okázalý přepych"
 tour_luxuries_good_desc: "$EFFECT_LIST_BULLET$ $tour_increase_success$\n\n#weak Na tomto turné nebudeš hledět na výdaje. Po celou cestu tě bude provázet nepřeberné množství lahůdek a všemožného pohodlí.#!"
 tour_furniture_normal: "Přepychový nábytek"
 tour_furniture_normal_desc: "$EFFECT_LIST_BULLET$ $tour_increase_success$\n$EFFECT_LIST_BULLET$ $tour_increase_prestige$\n\n#weak Na turné si s sebou přivezeš skříně, židle i stoly.#!"
 tour_furniture_good: "Přehnaný přepych"
 tour_furniture_good_desc: "$EFFECT_LIST_BULLET$ $tour_increase_success$\n$EFFECT_LIST_BULLET$ $tour_increase_prestige$\n\n#weak Aby všichni spatřili tvé nesmírné bohatství, necháš na turné převézt téměř každý artefakt a kus nábytku, který vlastníš.#!"
 tour_increase_success: "Zvýšení počáteční úspěšnosti tvého [Concept('tour','turné')|E]"
 tour_increase_prestige: "Zisk [Concept('prestige','prestiže')|E]"
