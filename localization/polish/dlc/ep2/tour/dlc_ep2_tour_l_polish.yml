l_polish:
 activity_tour: "Velká cesta"
 activity_tour_desc: "Uspořádejte okázalé [tour|E] a navštivte své [vassals|E] a jejich území. Každý [stop|E] bude trvat #bold 2 měsíce#!"
 activity_tour_selection_tooltip: "Cestujte po svém panství a navštivte své [vassals|E] při velkolepém [tour|E]\n\nPředpokládané odměny:\n$BULLET_WITH_TAB$[control_i] [county_control|E]\n$BULLET_WITH_TAB$@domain_icon! [county_opinion|E]\n$BULLET_WITH_TAB$[legitimacy_i] [legitimacy|E] Zisk\n$BULLET_WITH_TAB$[stress_loss_i] [stress|E] Snížení"
 activity_tour_host_desc: "$BULLET_WITH_TAB$@control_icon![county_control|E]\n$BULLET_WITH_TAB$@domain_icon![county_opinion|E]\n$BULLET_WITH_TAB$[legitimacy_i] [legitimacy|E] Zisk\n$BULLET_WITH_TAB$[stress_loss_i] [stress|E] Snížení\n\n[tour_success|E] Odměny:\n$BULLET_WITH_TAB$Level #V 1#!: [prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$Level #V 2#!: [GetVassalStance( 'parochial' ).GetTextIcon][GetVassalStance( 'parochial' ).GetName] [vassal|E] [opinion|E]\n$BULLET_WITH_TAB$Level #V 3#!: Názor navštíveného [vassal|E] [opinion|E]\n$BULLET_WITH_TAB$Level #V 4#!: [GetModifier( 'itinerant_liege_modifier' ).GetNameWithTooltip|L] #weak ([character|E])#!\n$BULLET_WITH_TAB$Level #V 5#!: [GetModifier( 'mega_itinerant_liege_modifier' ).GetNameWithTooltip|L] #weak ([character|E])#!"
