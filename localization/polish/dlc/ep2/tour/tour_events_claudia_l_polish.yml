l_polish:
 tour_grounds_events.7000.t: "Co zůstává skryto..."
 tour_grounds_events.7000.desc: "[stop_host_scope.GetTitledFirstName|U] se zatím [Select_CString(stop_host_scope.IsFemale,'projevuje jako mimořádně pohostinná hostitelka','projevuje jako mimořádně pohostinný hostitel')]. S hrdostí mi ukazuje své pozemky a majetek, takže mě okamžitě zaskočí, když náhle začne koktat a zjevně se snaží odvést mou pozornost od zdánlivě obyčejných dveří, kolem kterých právě procházíme.\n\n„Ty přede mnou něco #EMP skrýváš#!, [stop_host_scope.GetFirstNameNoTooltip]?“\n\nVyužiji chvíle překvapeného ticha – je to stud, nebo snad #EMP pocit viny#!? – a otevřu dveře dokořán. To, co za nimi objevím, mě ohromí:"
 tour_grounds_events.7000.desc_artifacts: "poklady, klenoty, a dokonce i artefakt „[this_artifact.GetName]“, který patří [stop_host_scope.Custom('CZ_FirstNameNoTooltip_D')]!"
 tour_grounds_events.7000.desc_pantry: "tajnou spižírnu, až po strop napěchovanou exotickým kořením, nakládaným masem, medem a sudy se solí!"
 tour_grounds_events.7000.desc_cellar: "rozlehlý sklep, až po strop zaplněný drahými víny a likéry z dalekých krajů!"
 tour_grounds_events.7000.desc_gold: "několik hromad zlata a truhly přetékající mincemi!"
 tour_grounds_events.7000.desc_falcons: "voliéru plnou majestátních sokolů, o které je vzorně postaráno!"
 tour_grounds_events.7000.desc_dogs: "dveře vedou na nádvoří plné mimořádně zdravých a statných loveckých psů, jaké jsem už dlouho neviděl!"
 tour_grounds_events.7000.desc_horses: "dveře vedou na nádvoří plné mimořádně zdravých a statných koní, jaké jsem už dlouho neviděl!"
 tour_grounds_events.7000.desc_fallback: "skladiště potravin, zlatých mincí a nejrůznějšího cenného zboží!"
 tour_grounds_events.7000.a: "Je jen spravedlivé se o to podělit se [Select_CString(ROOT.Char.IsFemale,'svou','svým')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_I')]."
 tour_grounds_events.7000.a.tt: "Ze skrytých zásob bude vybrána daň"
 tour_grounds_events.7000.b: "Stráže! Zabavte #EMP všechno#!!"
 tour_grounds_events.7000.b.tt: "Skryté zásoby zabaveny"
 tour_grounds_events.7000.b.tt.2: "Tvůj lenní pán si přivlastní to nejlepší z tvých zásob!"
 tour_grounds_events.7000.c: "Á, další znalec dobrých věcí!"
 tour_grounds_events.7000.c.tt: "Skryté zásoby vzbudily obdiv"
 tour_grounds_events.7000.c.tt.2: "Díky společným zájmům se sblížíš se svým lenním pánem!"
 tour_grounds_events.7000.d: "Budu předstírat, že jsem nic [Select_CString(ROOT.Char.IsFemale,'neviděla','neviděl')]."
 tour_grounds_events.7000.d.tt: "Skryté zásoby ponechány bez povšimnutí"
 tour_grounds_events.7001.desc: "Myslím, že jsem pro [visiting_liege.Custom('CZ_TitledFirstName_A')] zatím [Select_CString(ROOT.Char.IsFemale,'byla mimořádně pozornou hostitelkou','byl mimořádně pozorným hostitelem')].\n\nZvlášť dobře probíhá prohlídka mého sídla. [ROOT.Char.Custom('ResidenceBuilding')|U] na mého hosta očividně dělá dojem – až do chvíle, kdy špatně odbočím a přivedu [Select_CString(visiting_liege.IsFemale,'svou nedočkavou lenní paní','svého nedočkavého lenního pána')] přímo k jediným dveřím, od nichž jsem [Select_CString(visiting_liege.IsFemale,'ji','ho')] [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')] držet co nejdál. Za nimi se totiž skrývá:"
 tour_grounds_events.7001.desc_artifacts: "tajná komnata, v níž uchovávám rodinné poklady!"
 tour_grounds_events.7001.desc_pantry: "skrytá spižírna, kde skladuji exotické koření, nakládané maso, med a sudy se solí!"
 tour_grounds_events.7001.desc_cellar: "tajný sklep, kde ukrývám drahá vína a likéry z dalekých krajů!"
 tour_grounds_events.7001.desc_gold: "skrytá pokladnice s hromadami zlata a truhlami přetékajícími mincemi!"
 tour_grounds_events.7001.desc_falcons: "tajná voliéra, kde chovám své nejcennější sokoly!"
 tour_grounds_events.7001.desc_dogs: "skryté nádvoří, kde chovám své nejcennější lovecké psy!"
 tour_grounds_events.7001.desc_horses: "skryté nádvoří, kde chovám své nejcennější koně!"
 tour_grounds_events.7001.desc_fallback: "má tajná zásoba potravin, zlatých mincí a nejrůznějšího cenného zboží!"
 tour_grounds_events.7001.desc_conclusion: "\n\nZačnu nervózně koktat a [visiting_liege.GetTitledFirstNameNoTooltip] je každým okamžikem zvědavější."
 tour_grounds_events.7001.a: "[Select_CString(visiting_liege.IsFemale,'Má paní','Můj pane')]! Pojďme raději #EMP tudy#!!"
 tour_grounds_events.7001.a.success: "Podaří se ti odvést lenního pána jinam"
 tour_grounds_events.7001.a.success.tt: "Tvé poklady jsou v bezpečí"
 tour_grounds_events.7001.a.failure: "Tvůj lenní pán vtrhne do místnosti"
 tour_grounds_events.7001.a.failure.tt: "Tvé skryté zásoby jsou odhaleny"
 tour_grounds_events.7001.b: "Snad by šlo zařídit, aby se [visiting_liege.GetTitledFirstName] [Select_CString(visiting_liege.IsFemale,'podívala','podíval')] jinam?"
 tour_grounds_events.7001.b.success: "Tvůj lenní pán přijme úplatek"
 tour_grounds_events.7001.b.success.tt: "Úplatek přijat"
 tour_grounds_events.7001.b.tt.2: " Tvůj hostitel [ROOT.Char.GetTitledFirstNameNoTooltip] ti zaplatil, abys přehlédl jednu podezřelou místnost."
 tour_grounds_events.7001.b.tt: "Úplatkem odvrácena pozornost"
 tour_grounds_events.7001.c: "Vždyť jsem tě tam chtěl #EMP právě#! zavést!"
 tour_grounds_events.7001_followup: "O tom, co se stane s tvými ukrytými zásobami, rozhodne [visiting_liege.GetTitledFirstName]. Možná ti dokonce vyměří dodatečnou daň!"
