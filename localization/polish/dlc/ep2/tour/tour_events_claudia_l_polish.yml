l_polish:
 tour_grounds_events.7000.t: "Co nevidíte..."
 tour_grounds_events.7000.desc: "[stop_host_scope.GetTitledFirstName|U] [Select_CString(stop_host_scope.IsFemale,'byla','byl')] zatím velmi pohostinný(á), s hrdostí mi [Select_CString(stop_host_scope.IsFemale,'ukazovala její','ukazoval jeho')] země a majetek, takže jsem okamžitě [Select_CString(stop_host_scope.IsFemale,'zaskočena','zaskočen')], když [stop_host_scope.GetSheHe] začne koktat a zjevně se snaží odvrátit mou pozornost od zdánlivě nevýrazných dveří, kolem kterých právě procházíme.\n\n„Škrýváš #EMP něco#! přede mnou, [stop_host_scope.GetFirstNameNoTooltip]?“\n\nVyužiji [Select_CString(stop_host_scope.IsFemale,'její','jeho')] chvíle ohromeného — hanebného? #EMP Vinen/Vinná#!? — ticha, abych dveře [Select_CString(ROOT.Char.IsFemale,'otevřela','otevřel')], a jsem [Select_CString(ROOT.Char.IsFemale,'překvapena','překvapen')], co najdu:"
 tour_grounds_events.7000.desc_artifacts: "poklady, šperky a dokonce i [stop_host_scope.GetFirstNamePossessiveNoTooltip] [this_artifact.GetName]!"
 tour_grounds_events.7000.desc_pantry: "skrytou spíž, naskládanou až ke stropu cizím kořením, kořeněným masem, medem a sudy se solí!"
 tour_grounds_events.7000.desc_cellar: "celý sklep, naskládaný až ke stropu drahými víny a likéry z dalekých krajů!"
 tour_grounds_events.7000.desc_gold: "několik hromad zlata a truhly přetékající mincemi!"
 tour_grounds_events.7000.desc_falcons: "voliéra s velkým počtem pyšných sokolů v dobře udržovaných klecích!"
 tour_grounds_events.7000.desc_dogs: "dveře vedou na dvůr plný nejzdravějších, nejmohutněji vypadajících loveckých psů, které jsem dlouho [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')]!"
 tour_grounds_events.7000.desc_horses: "dveře vedou na dvůr plný nejzdravějších, nejmohutněji vypadajících koní, které jsem dlouho [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')]!"
 tour_grounds_events.7000.desc_fallback: "zásoby potravin, zlatých mincí a obecného zboží!"
 tour_grounds_events.7000.a: "Bude fér sdílet to s tvým [ROOT.Char.GetTitleAsNameNoTooltip]."
 tour_grounds_events.7000.a.tt: "Tajná skrýš zdaněna"
 tour_grounds_events.7000.b: "Stráže! Zabavte #EMP všechno#!."
 tour_grounds_events.7000.b.tt: "Tajná zásoba zabavena"
 tour_grounds_events.7000.b.tt.2: "Váš pán odvádí to nejlepší z vaší skrýše!"
 tour_grounds_events.7000.c: "Spřízněný znalec!"
 tour_grounds_events.7000.c.tt: "Tajná zásoba oceněna"
 tour_grounds_events.7000.c.tt.2: "Sblížíte se se svým párem sdílením zájmů!"
 tour_grounds_events.7000.d: "Budu předstírat, že jsem to [Select_CString(ROOT.Char.IsFemale,'neviděla','neviděl')]."
 tour_grounds_events.7000.d.tt: "Tajná zásoba ignorována"
 tour_grounds_events.7001.desc: "Domnívám se, že jsem zatím [Select_CString(ROOT.Char.IsFemale,'byla','byl')] nesmírně pohostinným hostitelem vůči svému návštěvnému pánovi, [visiting_liege.GetTitledFirstName].\n\nNávštěva mého [ROOT.Char.Custom('ResidenceBuilding')], konkrétně, probíhala skvěle — až do chvíle, kdy udělám špatný obrat a postavím svého dychtivého [visiting_liege.GetLadyLord] přímo před jedinými dveřmi, které jsem se [Select_CString(ROOT.Char.IsFemale,'snažila','snažil')] držet [visiting_liege.GetHerHim] dál od:"
 tour_grounds_events.7001.desc_artifacts: "tajnou místnost, kde uchovávám rodinné poklady!"
 tour_grounds_events.7001.desc_pantry: "skrytou spíž, kde schovávám cizí koření, kořeněné maso, med a sudy se solí!"
 tour_grounds_events.7001.desc_cellar: "skrytý sklep, kde ukrývám drahá vína a likéry z dalekých krajů!"
 tour_grounds_events.7001.desc_gold: "skrytou pokladnici, kde schovávám hromady zlata a truhly přetékající mincemi!"
 tour_grounds_events.7001.desc_falcons: "skrytou voliéra, kde mám své nejcennější sokoly!"
 tour_grounds_events.7001.desc_dogs: "tajné nádvoří, kde chovám své nejcennější lovecké psy!"
 tour_grounds_events.7001.desc_horses: "tajné nádvoří, kde chovám své nejcennější koně!"
 tour_grounds_events.7001.desc_fallback: "moji tajnou skrýš potravin, zlatých mincí a obecně drahých věcí!"
 tour_grounds_events.7001.desc_conclusion: "\n\nKdyž začnu nervózně koktat, [visiting_liege.GetTitledFirstNameNoTooltip] je čím dál tím zvědavější."
 tour_grounds_events.7001.a: "Můj [visiting_liege.GetLadyLord]! Pojďme #EMP touto#! cestou!"
 tour_grounds_events.7001.a.success: "Přesměrovali jste svého pána jinam"
 tour_grounds_events.7001.a.success.tt: "Vaše bohatství je v bezpečí"
 tour_grounds_events.7001.a.failure: "Váš pán vtrhne do místnosti"
 tour_grounds_events.7001.a.failure.tt: "Vaše tajná skrýš je odhalena"
 tour_grounds_events.7001.b: "Jsem si [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')], že [visiting_liege.GetSheHe] lze přemluvit, aby se [Select_CString(ROOT.Char.IsFemale,'podívala','podíval')] jinam?"
 tour_grounds_events.7001.b.success: "Váš pán přijímá úplatek"
 tour_grounds_events.7001.b.success.tt: "Úplatek přijat"
 tour_grounds_events.7001.b.tt.2: " Váš host [ROOT.Char.GetTitledFirstNameNoTooltip] vám zaplatil, abyste se odvrátili od určité místnosti."
 tour_grounds_events.7001.b.tt: "Uplacen, abyste se podívali jinam"
 tour_grounds_events.7001.c: "PRÁVĚ jsem vás tam [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')] vzít!"
 tour_grounds_events.7001_followup: "Váš pán rozhodne, co udělá s vašimi ukrytými věcmi — možná vám zvýší daně!"
