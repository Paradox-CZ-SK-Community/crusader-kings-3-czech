 cultural_festival.3040.t: "Čepel v kameni"
 cultural_festival.3040.desc: "Při procházce slavnostně vyzdobenými ulicemi [CZProvNameNoTooltip(ROOT.Char.GetCurrentLocation,'G')] zaslechnu známý hlas.\n\n„Co mám s tímhle balvanem asi tak dělat, co? Chcete, abych si na něj [Select_CString(marshal.IsFemale,'sedla','sedl')]?“\n\n[marshal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ukazuje na obrovský kámen, který před [Select_CString(marshal.IsFemale,'ní','ním')] zanechal kameník.\n\n„Je to pro soutěž v síle,“ vysvětluje kameník a pokrčí rameny.\n\n„Jakou soutěž v síle? Vždyť tohle přece nejde zvednout!“ ohradí se [marshal.GetTitledFirstNameNoTooltip]."
 cultural_festival.3040.a: "„Nemáš ho přece #EMP zvedat#!, příteli.“"
 cultural_festival.3040.flavor: "Nikdo nedokáže vytáhnout čepel z kamene!"
 cultural_festival.3040.a.tt: "@warning_icon! #X O tento artefakt můžeš přijít#!"
 cultural_festival.3040.b: "„Prostě se toho zbavte.“"
 cultural_festival.3041.t: "$cultural_festival.3040.t$"
 cultural_festival.3041.desc: "Uprostřed [CZProvNameNoTooltip(ROOT.Char.GetCurrentLocation,'G')] stojí ohromný balvan, kolem kterého panuje až podezřele mnoho rozruchu. Když se přiblížím, okamžitě pochopím proč. V jeho povrchu je zaklíněná zbraň, jejíž lesklá čepel jako by byla napůl z oceli a napůl z kamene."
 cultural_festival.3041.a: "Ha! Ukážu jim, jakou mám sílu!"
 cultural_festival.3041.a.success: "Vytáhneš zbraň z kamene"
 cultural_festival.3041.a.success.vassal: "[CZProDrop(visiting_liege,'vytáhla','vytáhl')|U] zbraň z kamene"
 cultural_festival.3041.a.failure: "Zbraň se ani nepohnula"
 cultural_festival.3041.b: "Ze zdvořilosti bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] nechat [stop_host_scope.Custom('CZ_TitledFirstName_A')], aby si zbraň [Select_CString(stop_host_scope.IsFemale,'vzala','vzal')]."
 cultural_festival.3041.c: "#EMP ANO!#! Pojď ven!"
 cultural_festival.3042.t: "$cultural_festival.3040.t$: Zkouška síly"
 cultural_festival.3042.desc.intro: "Ach, tam je! Uprostřed města stojí obrovský balvan, ozdobený zlatým nápisem:\n\n„Kdo z tohoto kamene čepel vytáhne, právem se jejím vlastníkem stane.“\n\nOhlédnu se na [visiting_liege.Custom('CZ_TitledFirstName_A')], [Select_CString(visiting_liege.IsFemale,'která je','který je')] samozřejmě [Select_CString(visiting_liege.IsFemale,'hlavní kandidátkou','hlavním kandidátem')] na vítězství. Jenže... když se pokusí zatáhnout za jílec, zbraň se ani nepohne."
 cultural_festival.3042.desc.failed: "\n\n„Zatraceně,“ zaslechnu [visiting_liege.Custom('CZ_TitledFirstName_A')] zamumlat. Možná teď přišla řada na mě, abych se o to [Select_CString(ROOT.Char.IsFemale,'pokusila','pokusil')]?"
 cultural_festival.3042.desc.pretended: " „Ach, taková smůla,“ pronese [visiting_liege.GetTitledFirstNameNoTooltip] a kývne mým směrem. „Nechceš to zkusit, [Select_CString(ROOT.Char.IsFemale,'přítelkyně','příteli')]?“"
 cultural_festival.3042.a: "#EMP Já#! tu zbraň z kamene vytáhnu!"
 cultural_festival.3042.b: "Proč riskovat veřejné ponížení?"
 cultural_festival.3050.t: "Ukolébávající vystoupení"
 cultural_festival.3050.desc: "Na jeviště vystoupí skupinka místních obyvatel a pustí se do snad nejdelšího a nejnudnějšího kázání, jaké jsem kdy [Select_CString(ROOT.Char.IsFemale,'slyšela','slyšel')].\n\nSnažím se udržet oči otevřené, ale hromady sena na rohu ulice mi brzy začnou připadat až příliš pohodlné a lákavé..."
 cultural_festival.3050.a: "#EMP Musím#! zůstat vzhůru."
 cultural_festival.3050.b: "Jen si na chvilku odpočinu se zavřenýma očima..."
 cultural_festival.3050.b.tt: "Je možné, že si toho [stop_host_scope.GetShortUIName] všimne..."
 festival_enjoyed_local_performance: "Předstíraný zájem o slavnost"
 cultural_festival.3051.t: "Až podezřelé ticho..."
 cultural_festival.3051.desc: "Když na jeviště vystoupí skupinka místních obyvatel, s potěšením a úžasem naslouchám jejich proslovu. Kdybych jen [Select_CString(ROOT.Char.IsFemale,'věděla','věděl')], že v [CZProvNameNoTooltip(ROOT.Char.GetCurrentLocation,'L')] žijí tak vzdělaní lidé! Tolik odhodlání! Tak poutavý projev!\n\nOtočím se na [visiting_liege.Custom('CZ_TitledFirstName_A')], abych se [Select_CString(ROOT.Char.IsFemale,'podělila','podělil')] o svůj obdiv k jejich myšlenkám, ale zjistím, že má... zavřené oči? A není to snad dokonce #EMP chrápání#!, co slyším?"
 cultural_festival.3051.a: "Jak tohle může [Select_CString(visiting_liege.IsFemale,'ona','on')] považovat za nudné?!"
 cultural_festival.3051.a.toast: "[stop_host_scope.GetShortUIName|U] tě přistihne při spánku"
 cultural_festival.3051.b: "Možná tohle není pro každého..."
 cultural_festival.3060.t: "Smím prosit...?"
 cultural_festival.3060.desc.intro: "Zvuky fléten a bubnů záhy přilákají skupinu tančících hostů, kteří se vesele pohybují do rytmu hudby a hlasitě se smějí. Jeden pár se nenápadně vytratí do postranní uličky, děti poskakují v kruhu a osamělý stařec se s obtížemi pokouší rozhýbat boky.\n\n"
 cultural_festival.3060.desc.spouse: "Obrátím se na [Select_CString(my_spouse.IsFemale,'svou manželku','svého manžela')], [my_spouse.Custom('CZ_TitledFirstName_A')], a obdivuji ten něžný úsměv i nadšené tleskání do rytmu hudby."
 cultural_festival.3060.desc.vassal: "Mezi davem zahlédnu [stop_host_scope.Custom('CZ_TitledFirstName_A')] a po [Select_CString(stop_host_scope.IsFemale,'jejím','jeho')] boku jednu z nejkrásnějších osob, jaké jsem kdy [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')]. [Select_CString(vassal_spouse.IsFemale,'Tak krásnou ženu','Tak krásného muže')|U] člověk nepotkává každý den..."
 cultural_festival.3060.a: "„Smím prosit o tanec, [my_spouse.Custom('CZ_FirstNameNoTooltip_V')]?“"
 cultural_festival.3060.b: "Tanec s [Select_CString(vassal_spouse.IsFemale,'manželkou','manželem')] [stop_host_scope.Custom('CZ_TitledFirstNameNoTooltip_G')] jistě vzbudí rozruch..."
 cultural_festival.3060.b.success: "Svým tancem okouzlíš [vassal_spouse.Custom('CZ_ShortUIName_A')]"
 cultural_festival.3060.b.failure: "Tvůj tanec [vassal_spouse.Custom('CZ_ShortUIName_A')] neoslní"
 cultural_festival.3060.b.tt: "[stop_host_scope.GetShortUIName|U] z toho nemusí mít radost..."
 cultural_festival.3060.c: "[Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')|U] bych si také zatančit s místními."
 cultural_festival.3060.d: "Uf, #EMP tancování#!."
 festival_danced_with_local_modifier: "Účast na místním tanci"
 cultural_festival.3061.t: "Taneční partneři"
 cultural_festival.3061.desc: "Tleskám do rytmu hudby, ale když spatřím [visiting_liege.Custom('CZ_TitledFirstName_A')], jak se k nám blíží, ztichnu.\n\n„Chceš snad...?“ začnu, ale záhy mi dojde, že pozornost [Select_CString(visiting_liege.IsFemale,'mé lenní paní','mého lenního pána')] nepatří mně. Místo toho se obrátí na [Select_CString(vassal_spouse.IsFemale,'mou manželku','mého manžela')].\n\n„Prokážeš mi tu čest a zatančíš si se mnou?“"
 cultural_festival.3061.a: "Tohle je urážka mé cti!"
 cultural_festival.3061.a.toast: "Uražená čest"
 cultural_festival.3061.b: "A kdo by si [Select_CString(vassal_spouse.IsFemale,'ji','ho')] také nevybral!"
 festival_flattered_spouse_modifier: "Veřejné lichotky"
 festival_flattered_spouse_modifier_desc: "Tato postava na veřejnosti svůdně pochválila svého manželského partnera."
 cultural_festival.3070.t: "Svátek bláznů"
 cultural_festival.3070.desc: "Sotva zaslechnu vyzvánění zvonů, proletí mi hlavou nápad jako blesk. Svátek bláznů! Svět vzhůru nohama, kde hříšníci zastávají úlohu kněží a my všichni se celé dny oddáváme radovánkám a veselí!\n\nAch, ale koho vybrat? Titul „[ROOT.Char.GetFaith.BishopNeuter|l] bláznů“ přece nemůže dostat jen tak někdo... Co třeba [rival_jester.GetTitledFirstName]? Toho člověka jsem nikdy [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')] v lásce. Nebo snad [sinful_jester.GetTitledFirstName], [Select_CString(sinful_jester.IsFemale,'jejíž','jehož')] hříšné způsoby jsou všem dobře známé?"
 cultural_festival.3070.a: "[rival_jester.GetShortUINameNoTooltip|U] si tu poctu zaslouží."
 cultural_festival.3070.b: "Kdo jiný než [sinful_jester.GetShortUINameNoTooltip]?"
 cultural_festival.3070.c: "Anebo snad náš vzácný host, [visiting_liege.GetTitledFirstNameNoTooltip]...?"
 cultural_festival.3070.d: "Církev by něco takového nikdy neschválila."
 festival_feast_of_fools_county_modifier: "Svátek bláznů"
 festival_king_of_fools_modifier: "Biskup bláznů"
 festival_feast_of_fools_county_modifier_desc: "V tomto hrabství bylo dovoleno slavit Svátek bláznů, během něhož se zesměšňovaly církevní obřady."
 cultural_festival.3071.t: "$cultural_festival.3070.t$"
 cultural_festival.3071.desc.intro: "Radovánky! Veselí! Když vstoupím na hlavní náměstí [CZProvNameNoTooltip(ROOT.Char.GetCurrentLocation,'G')], spatřím skupinu lidí převlečených za kněze, kteří zpívají a tančí."
 cultural_festival.3071.desc_jester: "Uprostřed stojí figurína s připraveným kostýmem. Kdo by si jej oblékl, vypadal by napůl jako [ROOT.Char.GetFaith.BishopNeuter|l] a napůl jako šašek.\n\n[stop_host_scope.GetTitledFirstName|U] na pódiu nadšeně tleská a zlomyslně se směje.\n\n„A tady přichází [ROOT.Char.GetTitledFirstName] – [Select_CString(ROOT.Char.IsFemale,'naše','náš')] [SelectLocalization(ROOT.Char.IsFemale,'nick_monarch_of_fools','nick_monarch_of_fools_masc')]! Poslouchejte, přátelé! Hříšné způsoby tohoto člověka neznají mezí a nyní má dokonce moc vnucovat je i vám!“"
 cultural_festival.3071.desc_fallback: "Uprostřed davu trůní [final_jester.GetTitledFirstName], [Select_CString(final_jester.IsFemale,'oděná','oděný')] do podivného kostýmu, v němž vypadá napůl jako [ROOT.Char.GetFaith.BishopNeuter|l] a napůl jako šašek.\n\nObjeví se [stop_host_scope.GetTitledFirstName] a radostně zatleská.\n\n„Poslouchejte, přátelé! [final_jester.GetTitledFirstName|U] je nyní [Select_CString(final_jester.IsFemale,'naše','náš')] [SelectLocalization(final_jester.IsFemale,'nick_monarch_of_fools','nick_monarch_of_fools_masc')]! [Select_CString(final_jester.IsFemale,'Její','Jeho')|U] vůle je zákonem a [Select_CString(final_jester.IsFemale,'její','jeho')] hlas je hlasem samotného Pána! Jaké #EMP hříšné#! radovánky nám asi připraví?“"
 cultural_festival.3071.a: "„Už se nemohu dočkat, co přijde!“"
 cultural_festival.3071.b: "„Takové rouhačské veselí nemá v mém panství co dělat.“"
 cultural_festival.3071.c: "„Ha! #EMP Beru tě do služby!#!“"
 cultural_festival.3071.d: "„Jak se opovažujete dělat ze mě blázna?!“"
 cultural_festival.4000.t: "Zvláštní přízvuk"
 cultural_festival.4000.desc: "Náhle mě od mého doprovodu oddělí velký dav, který se tlačí vpřed, aby lépe viděl probíhající slavnost. Než se stačím vzpamatovat, ocitnu se mezi dvěma lidmi, kteří vedou vášnivý rozhovor.\n\nJenže vůbec nerozumím tomu, co říkají, a [local_character_scope.GetTitledFirstName] se najednou začne obracet přímo na mě. Snažím se tvářit, že mezi ně patřím, ale [local_translator_scope.GetTitledFirstName] si mě podezřívavě prohlíží koutkem oka.\n\nAsi bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] něco odpovědět. Jejich jazyk zní fascinujícím způsobem. Co kdybych se tu [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] alespoň několik slov?"
 cultural_festival.4000.a: "Nerozumím ani slovo, ale chci, aby mě [local_translator_scope.GetNameNoTooltip] ten jazyk [Select_CString(local_translator_scope.IsFemale,'naučila','naučil')]!"
 cultural_festival.4000.b: "Jen přikyvovat a usmívat se..."
 cultural_festival.4000.b.success: "Nikdo nepozná, že nerozumíš ani slovo"
 cultural_festival.4000.b.failure: "[local_translator_scope.GetNameNoTooltip|U] tě odhalí"
 cultural_festival.4000.c: "Vlastně... je to na mě příliš složité."
 cultural_festival.4100.t: "Urážlivá gesta"
 cultural_festival.4100.desc: "Nemohu uvěřit vlastním očím! [inconsiderate_character_scope.GetTitledFirstName|U] začne směrem k [offended_character_scope.Custom('CZ_TitledFirstName_D')] předvádět gesta, která jsou v [offended_character_scope.GetCulture.Custom('CZ_Adjective_ee')|l] kultuře považována za nesmírně urážlivá!\n\n[offended_character_scope.GetNameNoTooltip|U] propukne v křik a začne [inconsiderate_character_scope.Custom('CZ_TitledFirstName_A')] častovat těmi nejhrubšími nadávkami. Členové [Select_CString(offended_character_scope.IsFemale,'jejího','jeho')] doprovodu musí rozzuřenou postavu zadržovat, aby se na původce urážky nevrhla.\n\nZdá se, že se [offended_character_scope.GetTitledFirstNameNoTooltip] jen tak neuklidní. Budu muset zasáhnout, než se situace ještě zhorší."
 cultural_festival.4100.a: "Počkej, jde jen o nedorozumění."
 cultural_festival.4100.a.success: "Podaří se ti přesvědčit [offended_character_scope.Custom('CZ_NameNoTooltip_A')]"
 cultural_festival.4100.a.failure: "[offended_character_scope.GetNameNoTooltip|U] se nenechá přesvědčit"
 cultural_festival.4100.b: "Musím [inconsiderate_character_scope.Custom('CZ_NameNoTooltip_A')] veřejně pokárat!"
 cultural_festival.4100.c: "Možná bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] nabídnout odškodnění ve zlatě."
 cultural_festival.4200.t: "Příprava slavnostního průvodu"
 cultural_festival.4200.desc: "Od chvíle, kdy hosté dorazili do [CZProvName(ROOT.Char.GetCurrentLocation,'G')], měli spoustu příležitostí k zábavě i zajímavým podívaným. Pokud je však chci bavit i nadále, nesmím ani na okamžik polevit. A tak mě napadá připravit něco zvláštního pro [visiting_liege.Custom('CZ_TitledFirstName_A')] a [Select_CString(visiting_liege.IsFemale,'její','jeho')] doprovod. Slavnostní průvod, který naše vzácné hosty náležitě přivítá a zároveň představí naše panství v tom nejlepším světle.\n\nJenže jaký druh průvodu by se [visiting_liege.Custom('CZ_NameNoTooltip_D')] nejvíce líbil?"
 cultural_festival.4200.a: "Předvedu naši vojenskou sílu!"
 cultural_festival.4200.tt.liege_likes: "[Select_CString(visiting_liege.IsFemale,'Tvé lenní paní','Tvému lennímu pánovi')|U] se to nejspíš #P bude líbit#!"
 cultural_festival.4200.tt.liege_indifferent: "[Select_CString(visiting_liege.IsFemale,'Tvé lenní paní','Tvému lennímu pánovi')|U] to nejspíš nebude vadit"
 cultural_festival.4200.tt.liege_dislikes: "[Select_CString(visiting_liege.IsFemale,'Tvé lenní paní','Tvému lennímu pánovi')|U] se to nejspíš #X nebude vůbec líbit#!"
 cultural_festival.4200.b: "Ukažme, co dokáže náš lid."
 cultural_festival.4200.c: "[Select_CString(ROOT.Char.IsFemale,'Ráda','Rád')|U] bych [Select_CString(ROOT.Char.IsFemale,'připravila','připravil')] něco duchovního."
 cultural_festival.4201.t: "[stop_host_scope.Custom('GetParadeType')|U]"
 cultural_festival.4201.desc: "[stop_host_scope.Custom('GetParadeType')|U] si žádá pečlivou přípravu. Rozhodnu se proto pověřit [coordinator_scope.Custom('CZ_TitledFirstName_A')] organizací celého průvodu a poradit se o tom, jak nejlépe postupovat. Po chvíli přemýšlení mi předloží několik možností:\n\n"
 cultural_festival.4201.desc_military: "$cultural_festival.4201.desc$„Mohli bychom pozvat nejlepší rytíře z celého panství a uspořádat velkolepou ukázkovou bitvu. Nebo bychom mohli shromáždit odvedence a místní posádku [CZPrepZ(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetCurrentLocation,'G')] v plné zbroji, aby předvedli své bojové umění na hlavním náměstí.“"
 cultural_festival.4201.desc_civil: "$cultural_festival.4201.desc$„Mohli bychom pozvat nejlepší rolníky a řemeslníky z celého panství, aby předvedli své dovednosti. Anebo shromáždit místní obyvatele, nechat je ukázat jejich každodenní práci a věnovat celý průvod oslavě [CZProvName(ROOT.Char.GetCurrentLocation,'G')].“"
 cultural_festival.4201.desc_religious: "$cultural_festival.4201.desc$„Mohli bychom pozvat ty nejzbožnější věřící, jejichž vírou je [ROOT.Char.GetFaith.GetName], a také duchovní. [stop_host_scope.GetFaith.PriestNeuterPlural|U] by pak vedli společné modlitby. Anebo bychom mohli shromáždit místní obyvatele a uspořádat velkolepou bohoslužbu. Kéž [ROOT.Char.GetFaith.HighGodName] vyslyší jejich modlitby!“"
 cultural_festival.4201.desc_end: "\n\nVšechno to zní zajímavě, konečné rozhodnutí však bude na mně."
 cultural_festival.4201.a.military: "Přiveďte nejlepší rytíře a tu nejkvalitnější výzbroj z celého panství!"
 cultural_festival.4201.a.civil: "Přiveďte nejlepší řemeslníky z celého panství!"
 cultural_festival.4201.a.religious: "Ať se shromáždí naši nejzbožnější poddaní! [stop_host_scope.GetFaith.PriestNeuterPlural|U] z celého panství musí být také přítomni!"
 cultural_festival.4201.b: "Vystačíme si s tím, co máme po ruce."
 cultural_festival.4201.c: "Udělejme něco jednoduššího."
 cultural_festival.4202.t: "$cultural_festival.4201.t$"
 cultural_festival.4202.desc: "„[stop_host_scope.Custom('GetParadeType')|U] právě začíná!“ oznámí mi [coordinator_scope.GetTitledFirstName] a pozve mě, abych se [Select_CString(ROOT.Char.IsFemale,'připojila','připojil')] ke slavnosti. Ujišťuje mě, že [stop_host_scope.GetTitledFirstName] osobně [Select_CString(stop_host_scope.IsFemale,'dohlížela','dohlížel')] na přípravy, aby vznikla ta nejlepší podívaná, jakou může [cultural_festival_scope.GetName] nabídnout. Zatímco mluví,"
 cultural_festival.4202.desc_military_best: "$cultural_festival.4202.desc$ nejlepší rytíři z celého panství zahajují souboje. Neustále mění protivníky a pohybují se s takovou lehkostí, jako by tančili. Řinčení mečů narážejících do zbroje zní téměř jako hudba.\n\nJe radost to sledovat a musím [coordinator_scope.Custom('CZ_NameNoTooltip_D')] přiznat, že lepší přehlídku jsem ještě nikdy [Select_CString(ROOT.Char.IsFemale,'neviděla','neviděl')]!"
 cultural_festival.4202.desc_military_good: "$cultural_festival.4202.desc$ na hlavním náměstí [cultural_festival_scope.Custom('CZ_LandedNameNoTierNoTooltip_G')] začíná bojová ukázka oddílu plně vyzbrojených odvedenců.\n\nJe to vskutku působivá přehlídka bojových dovedností."
 cultural_festival.4202.desc_military_worst: "$cultural_festival.4202.desc$ několik vojáků začne cvičně šermovat. Zdá se, že to bude všechno, co dnes uvidím. Škoda, protože už teď se nudím k smrti. Raději bych [Select_CString(ROOT.Char.IsFemale,'sledovala','sledoval')] koně, jak se pase, než tímhle [Select_CString(ROOT.Char.IsFemale,'ztrácela','ztrácel')] další minutu.\n\nJak si jen [stop_host_scope.GetNameNoTooltip] [Select_CString(stop_host_scope.IsFemale,'mohla','mohl')] myslet, že je to dobrý nápad?"
 cultural_festival.4202.desc_civil_best: "$cultural_festival.4202.desc$ řemeslníci shromáždění z celého panství začínají předvádět své nejlepší výrobky.\n\nTak kvalitní řemeslnou práci jsem snad ještě nikdy [Select_CString(ROOT.Char.IsFemale,'neviděla','neviděl')]. Obyvatelé [visiting_liege.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_G')] jsou skutečně nesmírně nadaní."
 cultural_festival.4202.desc_civil_good: "$cultural_festival.4202.desc$ místní řemeslníci z [cultural_festival_scope.Custom('CZ_LandedNameNoTierNoTooltip_G')] začínají předvádět své nejlepší výrobky.\n\nTak kvalitní řemeslnou práci jsem snad ještě nikdy [Select_CString(ROOT.Char.IsFemale,'neviděla','neviděl')]. Překvapuje mě, že jsem se o zdejších dovednostech [Select_CString(ROOT.Char.IsFemale,'nedozvěděla','nedozvěděl')] už dříve. Obyvatelé [cultural_festival_scope.Custom('CZ_LandedNameNoTierNoTooltip_G')] jsou skutečně nadaní."
 cultural_festival.4202.desc_civil_worst: "$cultural_festival.4202.desc$ několik místních obyvatel začne předvádět jakési rukodělné výrobky.\n\nNic, co bych už dávno [Select_CString(ROOT.Char.IsFemale,'neviděla','neviděl')]. Musím přiznat, že jsem docela [Select_CString(ROOT.Char.IsFemale,'zklamaná','zklamaný')]."
 cultural_festival.4202.desc_religious_best: "$cultural_festival.4202.desc$ [stop_host_scope.GetFaith.PriestNeuterPlural|l] shromáždění na hlavním náměstí zahajují modlitby s nepřekonatelnou vroucností."
 cultural_festival.4202.desc_religious_good: "$cultural_festival.4202.desc$ se místní [stop_host_scope.GetFaith.DevoteeNeuterPlural|l] začínají modlit na hlavním náměstí. Z jejich úst zaznívá vroucí prosba: „Kéž [stop_host_scope.GetFaith.HighGodName] vyslyší naše modlitby!“"
 cultural_festival.4202.desc_religious_worst: "$cultural_festival.4202.desc$ skupina místních obyvatel začíná monotónním hlasem odříkávat modlitby. Stále dokola opakují: „Kéž nás [stop_host_scope.GetFaith.HighGodName] vyslyší!“\n\nJe to příšerně nudná podívaná."
 cultural_festival.4202.desc_religious_different_faith_good: "\n\nJejich vírou je [stop_host_scope.GetFaith.GetName], s čímž nejsem příliš [Select_CString(ROOT.Char.IsFemale,'obeznámená','obeznámený')]. Jejich zbožnost na mě však udělala velký dojem."
 cultural_festival.4202.desc_religious_same_faith_good: "\n\nJe příjemné vidět, že obyvatelé [cultural_festival_scope.Custom('CZ_LandedNameNoTierNoTooltip_G')] jsou tak oddaní naší víře."
 cultural_festival.4202.desc_religious_different_faith_bad: "\n\nJejich vírou je [stop_host_scope.GetFaith.GetName], s čímž nejsem příliš [Select_CString(ROOT.Char.IsFemale,'obeznámená','obeznámený')]. Jejich náboženské zanícení mě však upřímně děsí."
 cultural_festival.4202.desc_religious_same_faith_bad: "\n\nJe smutné vidět, že [stop_host_scope.GetNameNoTooltip] zřejmě není naší víře tak [Select_CString(stop_host_scope.IsFemale,'oddaná','oddaný')], jak jsem si [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')]."
 cultural_festival.4202.a.revelry: "To byla nejlepší přehlídka, jakou jsem kdy [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')]!"
 cultural_festival.4202.a: "Od [stop_host_scope.Custom('CZ_TitledFirstName_G')] bych se [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] něčemu přiučit."
 cultural_festival.4202.b: "Vlastně bych raději [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')], jak probíhá [stop_host_scope.Custom('GetLiegeParadeType')|l]."
 cultural_festival.4203.t: "$cultural_festival.4201.t$"
 cultural_festival.4203.desc: "Po skončení průvodu se setkám s [coordinator_scope.Custom('CZ_TitledFirstName_I')], abych se [Select_CString(ROOT.Char.IsFemale,'dozvěděla','dozvěděl')], jak se slavnost líbila [visiting_liege.Custom('CZ_TitledFirstName_D')].\n\n„[Select_CString(ROOT.Char.IsFemale,'Má paní','Můj pane')|U],"
 cultural_festival.4203.desc_success: "$cultural_festival.4203.desc$ s radostí vám oznamuji, že [visiting_liege.GetTitledFirstNameNoTooltip] [Select_CString(visiting_liege.IsFemale,'byla','byl')] s přehlídkou velice [Select_CString(visiting_liege.IsFemale,'spokojená','spokojený')]. Dokonce [Select_CString(visiting_liege.IsFemale,'projevila','projevil')] zájem o vzájemné sdílení zvyků mezi našimi panstvími, aby je [Select_CString(visiting_liege.IsFemale,'mohla','mohl')] přenést do svého hlavního města [visiting_liege.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_G')].“\n\nJe příjemné vědět, že naše úsilí někdo ocenil."
 cultural_festival.4203.desc_failure: "$cultural_festival.4203.desc$ obávám se, že [visiting_liege.GetTitledFirstNameNoTooltip] považuje naši přehlídku za nudnou. [Select_CString(visiting_liege.IsFemale,'Prohlásila','Prohlásil')|U], že by raději [Select_CString(visiting_liege.IsFemale,'sledovala','sledoval')] koně při pastvě nebo se [Select_CString(visiting_liege.IsFemale,'dívala','díval')], jak probíhá [stop_host_scope.Custom('GetLiegeParadeType')|l].“\n\nTaková nevděčnost!"
 cultural_festival.4203.a.success: "Jsem [Select_CString(ROOT.Char.IsFemale,'ráda','rád')], že jsme si to všichni užili."
 cultural_festival.4203.a.failure: "No, alespoň se pobavili moji poddaní."
 cultural_festival.4300.t: "Výměna darů"
 cultural_festival.4300.desc: "Návštěva [visiting_liege.Custom('CZ_TitledFirstName_G')] je pro mě velkou ctí. Na oplátku bych si s [Select_CString(visiting_liege.IsFemale,'ní','ním')] [Select_CString(ROOT.Char.IsFemale,'ráda','rád')] [Select_CString(ROOT.Char.IsFemale,'vyměnila','vyměnil')] dary a [Select_CString(ROOT.Char.IsFemale,'upevnila','upevnil')] tak naše vzájemné pouto. Uvažuji, že pro tuto příležitost nechám vyrobit něco zvláštního. [Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')|U] bych například objednat výrobu artefaktu [newly_created_artifact.GetName]. $cultural_festival.4302.desc_gold$"
 cultural_festival.4300.desc_existing_artifact: "\n\nNapadá mě také [existing_artifact.GetName]. Tenhle artefakt se mi tu už nějakou dobu povaluje a mohl by posloužit jako skvělý, osobnější dar."
 cultural_festival.4300.tt: "[visiting_liege.GetShortUIName|U] si [Select_CString(visiting_liege.IsLocalPlayer,'budeš muset','bude muset')] vybrat dar k výměně"
 cultural_festival.4300.a: "Věnuji svůj osobní artefakt [existing_artifact.GetNameNoTooltip]."
 cultural_festival.4300.b: "Nechám vyrobit artefakt [newly_created_artifact.GetNameNoTooltip] jako dar."
 cultural_festival.4300.c: "Stačí darovat zlato."
 cultural_festival.4300.d: "#EMP Ne#!."
 cultural_festival.4301.t: "$cultural_festival.4300.t$"
 cultural_festival.4301.desc: "Přistoupí ke mně [stop_host_scope.GetTitledFirstName] a přináší mi dar. Je to "
 cultural_festival.4301.desc_artifact: "[gifted_artifact.GetName].$cultural_festival.4301.desc_inbetween$\n\nOceňuji, že si [stop_host_scope.GetTitledFirstNameNoTooltip] [Select_CString(stop_host_scope.IsFemale,'dala','dal')] s výběrem daru práci. $cultural_festival.4301.desc_end$"
 cultural_festival.4301.desc_gold: "měšec zlatých mincí.$cultural_festival.4301.desc_inbetween$\n\nZlato si samozřejmě [Select_CString(ROOT.Char.IsFemale,'ráda','rád')] vezmu, ale zdá se, že [stop_host_scope.GetTitledFirstNameNoTooltip] vlastně [Select_CString(stop_host_scope.IsFemale,'nevěděla','nevěděl')], co mi darovat. $cultural_festival.4301.desc_end$"
 cultural_festival.4301.desc_inbetween: "\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], je mi ctí, že jste nás [Select_CString(ROOT.Char.IsFemale,'navštívila','navštívil')]. Přijměte, prosím, tento dar na památku naší kulturní slavnosti. Kéž nám tento den připomíná ještě mnoho let!“"
 cultural_festival.4301.desc_end: "Jenže [stop_host_scope.GetTitledFirstNameNoTooltip] na mě hledí s očekáváním. Že by [Select_CString(stop_host_scope.IsFemale,'čekala','čekal')] také nějaký dar na oplátku?"
 cultural_festival.4301.a: "Nádherný dar! Moc se mi líbí."
 cultural_festival.4301.a.tt: "Vybavíš se artefaktem [gifted_artifact.GetName]"
 cultural_festival.4301.b: "Bezcenná cetka. Možná bych ji [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] prodat za pár drobných?"
 cultural_festival.4301.c: "Zlato? Jak pozorné."
 cultural_festival.4301.tt: "Budeš si muset vybrat dar na oplátku"
 cultural_festival.4302.t: "$cultural_festival.4300.t$"
 cultural_festival.4302.desc: "Dar mě potěšil, ale teď musím také něco věnovat na oplátku. Raději si dobře rozmyslím, co vybrat, abych [Select_CString(ROOT.Char.IsFemale,'nevypadala jako hlupačka','nevypadal jako hlupák')]! [Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')|U] bych například někoho poslat pro artefakt [newly_created_artifact.GetName]."
 cultural_festival.4302.desc_existing_artifact: "$cultural_festival.4300.desc_existing_artifact$"
 cultural_festival.4302.desc_gifted_gold: "\n\nMožná bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] zvolit stejně jednoduché řešení jako [stop_host_scope.GetTitledFirstNameNoTooltip] a darovat [Select_CString(stop_host_scope.IsFemale,'jí','mu')] také zlato?"
 cultural_festival.4302.desc_gold: "\n\nOstatně, obyčejný měšec zlatých mincí je vždy bezpečná volba, ne?"
 cultural_festival.4302.a: "$cultural_festival.4300.a$"
 cultural_festival.4302.b: "$cultural_festival.4300.b$"
 cultural_festival.4302.c: "$cultural_festival.4300.c$"
 cultural_festival.4302.d: "$cultural_festival.4300.d$"
 cultural_festival.4303.t: "$cultural_festival.4301.t$"
 cultural_festival.4303.desc: "Když [visiting_liege.GetTitledFirstName] přijme můj dar, sáhne do své pokladnice.\n\n„Musím přiznat, že jsi mě [Select_CString(ROOT.Char.IsFemale,'překvapila','překvapil')]. Tvůj dar je pro mě velkou ctí a nemám toho mnoho na oplátku. Přijmi však, prosím, alespoň tuto drobnou pozornost na znamení mé vděčnosti.“\n\nPak mi podá "
 cultural_festival.4303.desc_artifact: "artefakt [gifted_artifact.GetName]. Oceňuji, že [visiting_liege.GetTitledFirstNameNoTooltip] [Select_CString(visiting_liege.IsFemale,'pocítila','pocítil')] potřebu mi něco oplatit. Něco takového jsem vůbec [Select_CString(ROOT.Char.IsFemale,'nečekala','nečekal')]."
 cultural_festival.4303.desc_gold: "měšec zlatých mincí. Možná [visiting_liege.GetTitledFirstNameNoTooltip] [Select_CString(visiting_liege.IsFemale,'nevěděla','nevěděl')], co mi vybrat? Anebo [Select_CString(visiting_liege.IsFemale,'byla','byl')] mým skvělým nápadem opravdu [Select_CString(visiting_liege.IsFemale,'zaskočena','zaskočen')]!"
 cultural_festival.4303.a: "$cultural_festival.4301.a$"
 cultural_festival.4303.b: "$cultural_festival.4301.b$"
 cultural_festival.4303.c: "$cultural_festival.4301.c$"
 cultural_festival.4310.t: "Milé vzpomínky"
 cultural_festival.4310.desc: "Trávím spoustu času ve společnosti [gift_receiver.Custom('CZ_TitledFirstName_G')], což mi připomíná naši společnou slavnost před mnoha lety. Matně si vybavuji, že [giving_gift_memory.GetDescription].\n\nZajímalo by mě, zda si ten dar [gift_receiver.GetTitledFirstNameNoTooltip] ještě uchovává. Možná bych se na to [Select_CString(ROOT.Char.IsFemale,'měla','měl')] zeptat?"
 cultural_festival.4310.a: "Zdvořile se zeptám."
 cultural_festival.4310.a.tt: "[gift_receiver.GetTitledFirstNameNoTooltip|U] rozhodne, co se stane dál"
 cultural_festival.4310.b: "Ne, #EMP takhle#! [Select_CString(ROOT.Char.IsFemale,'malicherná','malicherný')] přece nejsem."
 cultural_festival.4311.t: "$cultural_festival.4310.t$"
 cultural_festival.4311.desc: "[giving_gift_memory_owner.GetTitledFirstName|U] mě přivítá s otevřenou náručí.\n\n„To je ale nádherná slavnost! Připomíná mi jednu, kterou jsme spolu zažili před několika lety. Pamatuješ si ji? Myslím, že jsem ti tehdy [Select_CString(giving_gift_memory_owner.IsFemale,'věnovala','věnoval')] nějaký dar. Můžeš mi připomenout, co to vlastně bylo?“\n\n"
 cultural_festival.4311.desc.old_gift: "Vlastně ten dar stále mám. Je to [old_gift.GetName]. Trochu mě zaráží, proč se na něj [giving_gift_memory_owner.GetTitledFirstNameNoTooltip] tak vyptává. Snad ho nechce zpátky?"
 cultural_festival.4311.desc.decoy_gift: "Když o tom tak přemýšlím, mám také artefakt [decoy_gift.GetName], který už nepoužívám. Co kdybych [giving_gift_memory_owner.Custom('CZ_TitledFirstName_A')] [Select_CString(ROOT.Char.IsFemale,'přesvědčila','přesvědčil')], že právě tohle je ten dávný dar?"
 cultural_festival.4311.desc.lost_gift: "Ten dar už bohužel nejspíš nemám. Ani si nevzpomínám, jak jsem o něj [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')]. Ale [giving_gift_memory_owner.GetTitledFirstNameNoTooltip] se to přece nemusí dozvědět."
 cultural_festival.4311.desc.no_gift: "Možná bych [giving_gift_memory_owner.Custom('CZ_TitledFirstName_A')] [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] přesvědčit, že si mě [Select_CString(giving_gift_memory_owner.IsFemale,'spletla','spletl')] s někým jiným. Co když žádná výměna darů mezi námi nikdy neproběhla?"
 cultural_festival.4311.a: "„Samozřejmě, tady ho máš.“"
 cultural_festival.4311.a.success: "[giving_gift_memory_owner.GetTitledFirstNameNoTooltip|U] si chce dar jen znovu prohlédnout"
 cultural_festival.4311.a.failure: "[giving_gift_memory_owner.GetTitledFirstNameNoTooltip|U] očekává protislužbu"
 cultural_festival.4311.b: "„Ano, určitě to byl artefakt [decoy_gift.GetNameNoTooltip]!“"
 cultural_festival.4311.c: "[giving_gift_memory_owner.GetTitledFirstNameNoTooltip|U] mi nikdy nic [Select_CString(giving_gift_memory_owner.IsFemale,'nedarovala','nedaroval')]."
 cultural_festival.4311.b.success: "Přesvědčíš [giving_gift_memory_owner.Custom('CZ_TitledFirstNameNoTooltip_A')], že ti [Select_CString(giving_gift_memory_owner.IsFemale,'darovala','daroval')] artefakt [decoy_gift.GetNameNoTooltip]"
 cultural_festival.4311.b.failure: "[giving_gift_memory_owner.GetTitledFirstNameNoTooltip|U] si původní dar pamatuje"
 cultural_festival.4311.c.success: "Přesvědčíš [giving_gift_memory_owner.Custom('CZ_TitledFirstNameNoTooltip_A')], že ti nikdy nic [Select_CString(giving_gift_memory_owner.IsFemale,'nedarovala','nedaroval')]"
 cultural_festival.4311.c.failure: "[giving_gift_memory_owner.GetTitledFirstNameNoTooltip|U] ví, že ti nějaký dar [Select_CString(giving_gift_memory_owner.IsFemale,'věnovala','věnoval')]"
 cultural_festival.4311.d: "Musím přiznat, že jsem ten dar už dávno [Select_CString(ROOT.Char.IsFemale,'ztratila','ztratil')]."
 cultural_festival.4311.proper_gift_taost: "Předveden správný dar"
 cultural_festival.4311.no_gift_toast: "Pokus o oklamání [giving_gift_memory_owner.Custom('CZ_NameNoTooltip_G')]"
 cultural_festival.4311.liege_failed_toast: "Tvé vlastní činy jsou použity proti tobě"
 cultural_festival.4312.t: "$cultural_festival.4310.t$"
 cultural_festival.4312.desc: "Po mé otázce [gift_receiver.GetTitledFirstName] na chvíli zamyšleně ztichne.\n\n"
 cultural_festival.4312.desc.decoy_gift: "„Ach ano, pamatuji si to, jako by to bylo včera! Tvým darem byl artefakt [decoy_gift.GetName]. Dokonce ho stále mám u sebe. Chceš si ho na chvíli vzít do rukou?“\n\nMůj protějšek působí naprosto sebejistě a okamžitě přikáže svému doprovodu, aby dar přinesl."
 cultural_festival.4312.desc.decoy_gift_succeeded: "$cultural_festival.4312.desc.decoy_gift$ Jenže něco mi na tom nesedí. Zatím nedokážu říct co."
 cultural_festival.4312.desc.decoy_gift_failed: "$cultural_festival.4312.desc.decoy_gift$ To je ale nesmysl! Do očí mi lže. Moc dobře si pamatuji, co jsem [Select_CString(ROOT.Char.IsFemale,'darovala','daroval')]. Takhle mě neoklame."
 cultural_festival.4312.desc.no_gift: "„Obávám se, že nevím, o čem mluvíš, [giving_gift_memory_owner.Custom('CZ_NameNoTooltip_V')]. Možná sis mě s někým [Select_CString(giving_gift_memory_owner.IsFemale,'spletla','spletl')], protože mezi námi nikdy k žádné výměně darů nedošlo.“\n\n"
 cultural_festival.4312.desc.no_gift_succeeded: "$cultural_festival.4312.desc.no_gift$Takže jsem [gift_receiver.Custom('CZ_TitledFirstName_D')] nikdy nic [Select_CString(ROOT.Char.IsFemale,'nedarovala','nedaroval')]? Ještě před chvílí bych [Select_CString(ROOT.Char.IsFemale,'přísahala','přísahal')], že jsme si při minulé slavnosti dary vyměnili. [gift_receiver.GetTitledFirstNameNoTooltip|U] však působí naprosto [Select_CString(gift_receiver.IsFemale,'přesvědčená','přesvědčený')], že se nic takového nestalo. Možná se skutečně mýlím?"
 cultural_festival.4312.desc.no_gift_failed: "[gift_receiver.GetTitledFirstName|U] tvrdí, že ode mě nikdy žádný dar [Select_CString(gift_receiver.IsFemale,'nedostala','nedostal')]. To je ale nesmysl! A navíc očividná lež. Moc dobře si pamatuji, co jsem [Select_CString(ROOT.Char.IsFemale,'darovala','daroval')]. Takhle mě neoklame."
 cultural_festival.4312.desc.liege_lost_gift: "„S těžkým srdcem musím přiznat, že jsem ten dar už dávno [Select_CString(gift_receiver.IsFemale,'ztratila','ztratil')]. Prosím, odpusť mi.“\n\nZdá se, že jsem [gift_receiver.Custom('CZ_TitledFirstName_A')] [Select_CString(ROOT.Char.IsFemale,'uvedla','uvedl')] do nepříjemné situace. Bylo to už před mnoha lety a rozhodně [Select_CString(gift_receiver.IsFemale,'jí','mu')] nemám za zlé, že o dar [Select_CString(gift_receiver.IsFemale,'přišla','přišel')]. Vlastně ani nevím, co jsem od té otázky [Select_CString(ROOT.Char.IsFemale,'očekávala','očekával')]."
 cultural_festival.4312.desc.show_real_gift_flag: "„Ano, vzpomínám si! Byl to artefakt [old_gift.GetName]. Myslím, že ho stále mám u sebe, pokud se chceš podívat.“\n\n[gift_receiver.GetTitledFirstName|U] mi hrdě předvede artefakt [old_gift.GetNameNoTooltip]. Zdá se, že o něj bylo dobře postaráno."
 cultural_festival.4312.a: "To je od [gift_receiver.Custom('CZ_TitledFirstName_G')] opravdu milé. Velice si toho vážím."
 cultural_festival.4312.a.decoy_success: "Ach, tohle musí být ten dar, že?"
 cultural_festival.4312.b.decoy_success_holup: "Moment! Tohle přece není můj dar!"
 cultural_festival.4312.b.decoy_fail: "Ta drzost! Tohle není můj dar!"
 cultural_festival.4312.b.nogift_success_holup: "Nemožné! Jsem si [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')], že jsem [gift_receiver.Custom('CZ_TitledFirstName_D')] nějaký dar [Select_CString(ROOT.Char.IsFemale,'věnovala','věnoval')]!"
 cultural_festival.4312.b.nogift_fail: "Ta drzost! Vím přece, že jsem [gift_receiver.Custom('CZ_TitledFirstName_D')] něco [Select_CString(ROOT.Char.IsFemale,'darovala','daroval')]!"
 cultural_festival.4312.b.holup: "Chabá výmluva! Copak takhle se chová [ROOT.Char.Custom2('RelationToMe', gift_receiver )]?"
 cultural_festival.4312.c: "Možná bych to [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] použít proti [gift_receiver.Custom('CZ_TitledFirstName_D')]?"
 cultural_festival.4312.d: "Jaká škoda."
 cultural_festival.4312.d.nogift_success: "Hm, asi jsem si [Select_CString(ROOT.Char.IsFemale,'spletla','spletl')] osobu..."
