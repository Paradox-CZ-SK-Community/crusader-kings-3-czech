 cultural_festival.2090.t: "Do latě!"
 cultural_festival.2090.desc: "Když už sleduji snad padesáté nudné vystoupení, které mi tohle odporné místo zvané [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] nabízí, přistihnu se při přání, aby si všichni tanečníci zlámali každou kost v těle a konečně zmizeli.\n\nMoment... Vždyť #EMP já#! je mohu poslat pryč.\n\nOdkašlu si a promluvím: „Milovaní poddaní, donesly se ke mně velice znepokojivé zprávy, že se v těchto krajích dopouštíte krádeží a zrady.“"
 cultural_festival.2090.a: "„Byla by škoda, kdyby vás za tyto zločiny někdo potrestal...“"
 cultural_festival.2090.b: "„Nejsou to snad titíž rolníci, kteří se proti mně bouří? Zatkněte je!“"
 cultural_festival.2090.c: "„Nechte je být.“"
 festival_arrested_artists: "Uvěznění účinkující"
 festival_no_prisoners: "Bez uvězněných"
 festival_no_prisoners_desc: "Tato postava během kulturní slavnosti nenechala uvěznit místní účinkující."
 cultural_festival.2100.t: "Cechovní příspěvek"
 cultural_festival.2100.desc: "„Jen se na to podívej!“ zaslechnu při procházce ulicemi [CZProvNameNoTooltip(ROOT.Char.GetCurrentLocation,'G')]. [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('inspired_courtier'))|U] [inspired_courtier.GetFirstName] ukazuje na místní cechovní dílny. Říká se jim [guild_location.Custom('GetGuildType')|l] a nad jejich prací prý drží ochrannou ruku [guild_location.GetCounty.GetFaith.WealthGodName]. Na tváři [Select_CString(inspired_courtier.IsFemale,'mé společnice','mého společníka')] se okamžitě objeví blažený úsměv.\n\nPřed pracovním stolem klečí skupinka učňů. Mistr dohlíží na jejich práci ode dveří, paže založené na hrudi a bradu hrdě vztyčenou. „Na to budeš potřebovat trochu víc síly, synku.“\n\n[inspired_courtier.GetFirstName|U] k nim udělá krok, naprosto [Select_CString(inspired_courtier.IsFemale,'uchvácena','uchvácen')] tím, co vidí."
 cultural_festival.2100.a: "Tihle lidé si zaslouží naši podporu."
 cultural_festival.2100.b: "Měli bychom investovat i do obchodníků doma..."
 cultural_festival.2100.c: "„Jen běž, [inspired_courtier.Custom('CZ_FirstNameNoTooltip_V')], a podívej se k nim.“"
 cultural_festival.2100.c.success: "[inspired_courtier.GetShortUIName|U] objeví své povolání"
 cultural_festival.2100.c.failure: "[inspired_courtier.GetShortUIName|U] projeví zájem o řemeslo"
 discounted_guild_holding_build_cost_modifier: "Rozvoj městské zástavby"
 cultural_festival.2110.t: "Nečekaný účinkující"
 cultural_festival.2110.desc.intro: "Akrobaté v pestrobarevných kostýmech předvádějí jeden skok za druhým. Jeden z nich otevře ústa, aby chytil míček, který mu hodí druhý, a publikum propukne v nadšený jásot."
 cultural_festival.2110.desc.callous: "Jak málo stačí, aby se ta cháska pobavila."
 cultural_festival.2110.desc.outro: "\n\nZanedlouho se rozezní hudba. Tuhle píseň už jsem určitě někdy [Select_CString(ROOT.Char.IsFemale,'slyšela','slyšel')]. Možná. Většina jich stejně zní podobně. Dokonce i z vyvýšeného pódia slyším, jak se rolníci hlasitě přidávají ke zpěvu.\n\n„A tanči na polích...“ #EMP „Haf! Haf haf!“#! Do vystoupení se rozhodne zapojit nečekaný návštěvník a ukradne žonglérům míčky.\n\n#EMP „Chyťte toho psa!“#!"
 cultural_festival.2110.a: "Mohlo by se mi hodit vzít si ho domů..."
 cultural_festival.2110.b: "Dokonalý společník pro [my_heir.Custom('CZ_FirstNameNoTooltip_A')]!"
 cultural_festival.2110.c: "Ach... nedokážu odolat pokušení si ho pohladit!"
 cultural_festival.2110.d: "Ach, ta otravná potvora."
 cultural_festival.2110.e: "Musím zůstat na svém místě."
 cultural_festival_2110_d_tt: "Kopneš do psa"
 cultural_festival_2110_d_opinion_tt: "Každá přítomná postava, která není bezcitná ani sadistická"
 available_because_intent_tt: "#EMP #low Tato možnost je dostupná díky tvému [Concept('intent','záměru')|E] „[THIS.Char.GetInvolvedActivityIntent.GetName|V]“#!#!"
 cultural_festival.3000.t: "Velkolepé představení"
 cultural_festival.3000.desc: "Návštěva [visiting_liege.Custom('CZ_TitledFirstName_G')] mi nabízí jedinečnou příležitost. Tohoto osudového setkání bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] využít k získání přízně [Select_CString(visiting_liege.IsFemale,'své lenní paní','svého lenního pána')]. S trochou štěstí by pak bylo mnohem snazší dosáhnout všeho, po čem toužím...\n\nCo kdybych [Select_CString(ROOT.Char.IsFemale,'nechala','nechal')] uspořádat divadelní představení oslavující [Select_CString(visiting_liege.IsFemale,'její','jeho')] velkolepé činy?"
 cultural_festival.3000.a: "Dokonalá příležitost získat přízeň lenního pána!"
 cultural_festival.3000.a.tt: "Tvůj lenní pán ocení zdařilé ztvárnění své osoby..."
 cultural_festival.3000.b: "Za něco takového zlato utrácet nebudu."
 cultural_festival.3001.t: "Velkolepé představení: Poklona?"
 cultural_festival.3001.desc: "Přímo uprostřed náměstí už stojí jeviště připravené na představení. Ze sloupů visí slavnostní věnce a herci dokončují poslední úpravy scénáře.\n\n„Vždyť [visiting_liege.GetTitledFirstNameNoTooltip] přece nemá [Select_CString(visiting_liege.IsFemale,'ráda','rád')] jablka, ty hlupáku!“ zaslechnu dramatika, jak peskuje představitele hlavní role.\n\nPočkám, až skončí zkouška, a už se chystám odejít, když ke mně rychle přistoupí [liege_actor.GetTitledFirstName].\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ Sepne ruce v téměř prosebném gestu. „Poradíš mi, jak bych [Select_CString(liege_actor.IsFemale,'měla','měl')] ztvárnit [visiting_liege.Custom('CZ_TitledFirstName_A')]?“"
 cultural_festival.3001.compassionate: "„[visiting_liege.GetShortUIName|U] [Select_CString(visiting_liege.IsLocalPlayer,'máš','má')] tak laskavé srdce! To musí být vidět.“"
 cultural_festival.3001.bold: "„[visiting_liege.GetShortUIName|U] [Select_CString(visiting_liege.IsLocalPlayer,'jednáš','jedná')] vždy tak statečně!“"
 cultural_festival.3001.honorable: "„Pro [visiting_liege.Custom('CZ_ShortUIName_A')] je čest nade vše!“"
 cultural_festival.3001.greed: "„[visiting_liege.GetShortUIName|U] [Select_CString(visiting_liege.IsLocalPlayer,'neznáš','nezná')] v ctižádosti žádné meze!“"
 cultural_festival.3001.rational: "„[visiting_liege.GetShortUIName|U] [Select_CString(visiting_liege.IsLocalPlayer,'zachováváš','zachovává')] za všech okolností klid!“"
 cultural_festival.3001.zealous: "„[visiting_liege.GetShortUIName|U] [Select_CString(visiting_liege.IsLocalPlayer,'jsi','je')] přímo vzorem zbožnosti!“"
 cultural_festival.3001.energetic: "„[visiting_liege.GetShortUIName|U] [Select_CString(visiting_liege.IsLocalPlayer,'neváháš','neváhá')] ani na okamžik, když je třeba jednat!“"
 cultural_festival.3001.forgiving: "„[visiting_liege.GetShortUIName|U] [Select_CString(visiting_liege.IsLocalPlayer,'dokážeš','dokáže')] odpouštět jako málokdo!“"
 cultural_festival.3001.beautiful: "„Při pohledu na [visiting_liege.Custom('CZ_ShortUIName_A')] člověk málem omdlí krásou!“"
 cultural_festival.3001.strong: "„[visiting_liege.GetShortUIName|U] [Select_CString(visiting_liege.IsLocalPlayer,'máš','má')] sílu, jaké není rovno!“"
 cultural_festival.3001.extroverted: "„Ukaž, jak [visiting_liege.Custom('CZ_ShortUIName_A')] všichni milují a obdivují!“"
 cultural_festival.3001.dominant: "„[visiting_liege.GetShortUIName|U] [Select_CString(visiting_liege.IsLocalPlayer,'vzbuzuješ','vzbuzuje')] respekt už pouhou svou přítomností!“"
 cultural_festival.3001.negative: "„Vlastně... možná by se nejlépe hodil šaškovský kostým...“"
 cultural_festival.3001.tt: "#F To, jak [visiting_liege.GetTitledFirstName] přijme své divadelní ztvárnění, závisí na tom, nakolik odpovídá skutečné povaze této postavy.#!"
 cultural_festival.3001.negative.flavor: "Mému lennímu pánovi se to líbit nebude, ale #EMP já#! se pobavím."
 dressed_liege_like_buffon_modifier: "Všechno jenom žert"
 dressed_liege_like_buffon_modifier_desc: "Tato postava se rozhodla ztvárnit svého lenního pána v divadelním představení jako šaška."
 cultural_festival.3002.t: "Velkolepé představení"
 cultural_festival.3002.desc.intro: "Uprostřed náměstí se hrdě tyčí dřevěné jeviště. Ze sloupů visí slavnostní věnce a herci se schovávají po jeho stranách, kde se chichotají a rozmlouvají mezi sebou. Jakmile však dorazí [stop_host_scope.GetTitledFirstName], všichni ztichnou. [Select_CString(stop_host_scope.IsFemale,'Má hostitelka','Můj hostitel')|U] se pyšně vypíná, až málem praskne pýchou.\n\n„Dovoluji si oznámit, že představení na počest [Select_CString(ROOT.Char.IsFemale,'naší nejváženější hostky','našeho nejváženějšího hosta')], [ROOT.Char.Custom('CZ_TitledFirstNameNoTooltip_G')], právě začíná! Přejeme příjemnou zábavu!“\n\nPříběh se odvíjí dál a dál. Vypráví o ulicích [ROOT.Char.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] a o mých velkých činech."
 cultural_festival.3002.desc.good: "Jak příjemné je slyšet tolik chvály na svou osobu!"
 cultural_festival.3002.desc.neutral: "Nic zvlášť zajímavého se nedozvídám."
 cultural_festival.3002.desc.bad: "Nemohu uvěřit, že si opravdu myslí, že bych se takhle [Select_CString(ROOT.Char.IsFemale,'chovala','choval')]."
 cultural_festival.3002.desc.buffoon: "A teď přicházím na scénu já... v kostýmu #EMP šaška#!?!"
 cultural_festival.3002.a: "„Lepší poklonu mi snad ještě nikdo nesložil!“"
 cultural_festival.3002.a.toast: "Nejkrásnější poklona"
 cultural_festival.3002.b: "No... asi to mohlo dopadnout hůř."
 cultural_festival.3002.b.toast: "Zábavné představení"
 cultural_festival.3002.c: "Jak mě mohli vykreslit tak #EMP nesprávně#!?"
 cultural_festival.3002.c.toast: "Urážlivé představení"
 cultural_festival.3002.d.toast: "Nejhorší představení"
 cultural_festival.3002.d: "Co si to #EMP dovolujete#!?!"
 cultural_festival.3002.e: "Nemohu [stop_host_scope.Custom('CZ_ShortUIName_D')] říct, co si o tom doopravdy myslím."
 cultural_festival.3002.e.toast: "[visiting_liege.GetTitledFirstName|U] [Select_CString(visiting_liege.IsFemale,'vypadala','vypadal')] s představením [Select_CString(visiting_liege.IsFemale,'spokojená','spokojený')]"
 festival_good_play: "Zdařilé představení"
 festival_neutral_play: "Průměrné představení"
 festival_bad_play: "Nepovedené představení"
 cultural_festival.3010.t: "Zázračná fontána"
 cultural_festival.3010.desc: "Procházím se hradními zahradami a zastavím se u fontány, abych chvíli [Select_CString(ROOT.Char.IsFemale,'pozorovala','pozoroval')] proudy vody stékající po mramorových kamenech. Upravenou zahradou se plíží kočka. Protáhne hřbet a pak zase zmizí.\n\nDotknu se reliéfu na stříbrné trubici, který zobrazuje erb mého rodu. Kdyby tak... Ach! [visiting_liege.Custom('CZ_TitledFirstName_A')|U] bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] ohromit, kdyby z fontány místo vody vytékalo něco jiného..."
 cultural_festival.3010.a: "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U], samozřejmě!"
 cultural_festival.3010.b: "Nějaká lahodná ovocná šťáva by byla jednodušší."
 cultural_festival.3010.c: "Nemá cenu s tím ztrácet čas."
 alcohol_fountain_modifier: "Zázračná fontána"
 alcohol_fountain_modifier_desc: "Tato postava se rozhodla nechat z fontány místo vody proudit alkohol."
 juice_fountain_modifier: "$alcohol_fountain_modifier$"
 juice_fountain_modifier_desc: "Tato postava se rozhodla nechat z fontány místo vody proudit ovocnou šťávu."
 cultural_festival.3011.t: "Zázračná fontána"
 cultural_festival.3011.desc.intro: "Následuji [stop_host_scope.Custom('CZ_TitledFirstName_A')], [Select_CString(stop_host_scope.IsFemale,'která mě provádí','který mě provádí')] po slavnosti.\n\n„A teď,“ oznámí při vstupu do hradních zahrad, „něco, co tě jistě příjemně překvapí.“\n\nPřekvapeně pozvednu obočí. Před námi stojí nádherná fontána z bílého kamene se stříbrnou trubicí, ze které vydatným proudem místo vody vytéká..."
 cultural_festival.3011.desc.alcohol: "#EMP [stop_host_scope.Custom('RegionalAlcoholicDrink')]?!#!"
 cultural_festival.3011.desc.juice: "#EMP šťáva?!#!"
 cultural_festival.3011.desc.outro: "\n\nKolem fontány se shromažďují lidé, smějí se a házejí mince do její nádrže."
 cultural_festival.3011.a: "Napijme se všichni společně!"
 cultural_festival.3011.b: "Byla by škoda si něco nepřát!"
 festival_wishing_well_modifier: "Fontána přání"
 drank_together_modifier: "Společné popíjení u fontány"
 cultural_festival.3020.t: "Připomínka věrnosti"
 cultural_festival.3020.desc: "Oblohu nad [CZProvNameNoTooltip(ROOT.Char.GetCurrentLocation,'I')] zakrývají mraky a úzkými uličkami se začínají plížit šedé cáry večerní mlhy. Na vrcholku kopce se téměř vzdorovitě tyčí sídlo [stop_host_scope.Custom('CZ_TitledFirstName_G')]. Možná by neuškodilo připomenout, komu vlastně slouží.\n\nJsem [ROOT.Char.GetTitleAsNameNoTooltip|l] z božského práva. Koruna na mé hlavě září jako měsíc mezi ostatními hvězdami. Ať už záříš sebejasněji, #EMP já#! tě vždy zastíním."
 cultural_festival.3020.a: "[stop_host_scope.GetFirstNameNoTooltip|U] mi znovu složí lenní hold."
 cultural_festival.3020.a.tt: "Bude to pro tebe výhodné, ale tvému vazalovi se to nemusí líbit..."
 cultural_festival.3020.b: "Raději si užijme slavnost!"
 festival_no_homage_modifier: "Skromný lenní pán"
 festival_no_homage_modifier_desc: "Tato postava se rozhodla nepořádat okázalý obřad lenního holdu a místo toho si užít slavnost."
 cultural_festival.3021.t: "Připomínka věrnosti: Lenní hold"
 cultural_festival.3021.desc: "Každá svíce v místnosti plápolá, jako by se zoufale snažila zahnat okolní temnotu. Škvírami v kamenném ostění oken občas pronikne studený průvan. Přede mnou klečí [stop_host_scope.GetTitledFirstName]. Natáhnu ruce a sevřu ty [Select_CString(stop_host_scope.IsFemale,'její','jeho')] ve svých.\n\n„[Select_CString(stop_host_scope.IsFemale,'Má přítelkyně','Můj příteli')|U],“ začnu a zesílím stisk, „vložením svých rukou do mých stvrzuješ pouto našich srdcí. Velmi si vážím tvé věrnosti, a proto od tebe žádám...“"
 cultural_festival.3021.a: "„Zlato.“"
 cultural_festival.3021.b: "„Vojáky.“"
 cultural_festival.3021.a.tt: "Tím se #Bold nezablokuje#! vazalská smlouva."
 cultural_festival.3021.c: "„Věrnost.“"
 cultural_festival.3021.c.flavor: "...výměnou za mou vlastní."
 cultural_festival.3021.d: "„Přátelství.“"
 cultural_festival.3022.t: "Připomínka věrnosti: Složení holdu"
 cultural_festival.3022.desc.intro: "Je slavnostní večer, když mě [visiting_liege.GetTitledFirstName] povolá do mého vlastního trůnního sálu. Mému doprovodu již [Select_CString(visiting_liege.IsFemale,'rozeslala','rozeslal')] oznámení o „obnovení obřadu lenního holdu“.\n\nNež vstoupím do sálu, zhluboka se nadechnu. A tam [visiting_liege.GetTitledFirstNameNoTooltip] sedí na #EMP mém#! trůnu. Lenní pán zůstává lenním pánem. A postará se, abych na to nikdy [Select_CString(ROOT.Char.IsFemale,'nezapomněla','nezapomněl')].\n\nPokleknu před [visiting_liege.Custom('CZ_TitledFirstName_I')] a [Select_CString(visiting_liege.IsFemale,'ona','on')] vezme mé ruce do svých.\n\n„[Select_CString(ROOT.Char.IsFemale,'Má přítelkyně','Můj příteli')|U],“ pronese, „vložením svých rukou do mých stvrzuješ pouto našich srdcí. Velmi si vážím tvé věrnosti, a proto od tebe žádám "
 cultural_festival.3022.desc.friends: "přátelství.“"
 cultural_festival.3022.desc.hook: "věrnost.“"
 cultural_festival.3022.desc.levies: "vojáky.“"
 cultural_festival.3022.desc.money: "zlato.“"
 cultural_festival.3022.a: "„Můžeš si ho vzít.“"
 cultural_festival.3022.b: "„Můžeš si je vzít.“"
 cultural_festival.3022.annoyed: "Vazalské povinnosti"
 cultural_festival.3022.d: "„A já ti to ochotně nabídnu!“"
 cultural_festival.3022.d.friends: "Pevné pouto"
 cultural_festival.3022.money: "[visiting_liege.GetShortUIName|U] [Select_CString(visiting_liege.IsLocalPlayer,'zvyšuješ','zvyšuje')] daně podle tvé vazalské smlouvy"
 cultural_festival.3022.levies: "[visiting_liege.GetShortUIName|U] [Select_CString(visiting_liege.IsLocalPlayer,'zvyšuješ','zvyšuje')] odvody podle tvé vazalské smlouvy"
 cultural_festival.3022.hook: "[visiting_liege.GetShortUIName|U] [Select_CString(visiting_liege.IsLocalPlayer,'získáváš','získává')] na tebe páku věrnosti"
 cultural_festival.3030.t: "Pro toho nejkrásnějšího!"
 cultural_festival.3030.desc: "Procházím se ulicemi [CZProvNameNoTooltip(ROOT.Char.GetCurrentLocation,'G')] a přemýšlím, čím bych ještě [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] kulturní slavnost obohatit, když ke mně ostýchavě přistoupí [Select_CString(local_farmer.IsFemale,'místní rolnice','místní rolník')]. Za sebou vede hospodářské zvíře, které se náhle zastaví a začne žvýkat cosi na zemi. Je to [ROOT.Char.Custom('RegionalFarmAnimal')|l].\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ pronese [Select_CString(local_farmer.IsFemale,'ona','on')] s rostoucím nadšením, „[Select_CString(ROOT.Char.IsFemale,'nechtěla','nechtěl')] byste rozhodovat v naší soutěži krásy? Můj malý Silák určitě vyhraje!“\n\nKrátce si prohlédnu [Select_CString(local_farmer.IsFemale,'její','jeho')] zvíře, které se teď zaměstnává okusováním jakéhosi listí. Co kdybych ale... [Select_CString(ROOT.Char.IsFemale,'svěřila','svěřil')] rozhodování [visiting_liege.Custom('CZ_TitledFirstName_D')] místo sebe?"
 cultural_festival.3030.a: "„Pusťme se do příprav!“"
 cultural_festival.3030.b: "Tohle by se [visiting_liege.Custom('CZ_FirstNameNoTooltip_D')] určitě nelíbilo."
 farm_contest_modifier: "Pořadatel soutěže krásy hospodářských zvířat"
 cultural_festival.3031.t: "Pro toho nejkrásnějšího...?"
 cultural_festival.3031.desc: "Jeviště [CZPrepV(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(ROOT.Char.GetCurrentLocation,'L')] je vyzdobené senem, květinami a... poněkud neobvyklými hosty. Uprostřed stojí tři [stop_host_scope.Custom('RegionalFarmAnimalPlural')|l], každý exemplář v doprovodu svého hrdého majitele. [stop_host_scope.GetTitledFirstName|U] na mě mává z opačného konce pódia.\n\n„Ach, tady máme našeho rozhodčího!“\n\nRozhlédnu se, abych [Select_CString(ROOT.Char.IsFemale,'zjistila','zjistil')], zda ta slova skutečně patřila mně. O omylu však nemůže být pochyb. Vydám se k [stop_host_scope.Custom('CZ_TitledFirstName_D')], zatímco pokračuje:\n\n„Vítej na našem každoročním zvířecím jarmarku, kde korunujeme to nejkrásnější hospodářské zvíře!“\n\nBěhem těch slov si všimnu, jak nenápadně ukazuje na soutěžícího vlevo."
 cultural_festival.3031.a: "„Ten vlevo, samozřejmě!“"
 cultural_festival.3031.b: "„To pohledné zvíře má nějak povědomou krásu...“"
 cultural_festival.3031.c: "„[stop_host_scope.GetCulture.Custom('CZ_AdjectiveNoTooltip_aa')|U] kultura se může pochlubit těmi nejkrásnějšími hospodářskými zvířaty!“"
 cultural_festival.3031.d: "„Tímhle se opravdu nehodlám zabývat.“"
 cultural_festival.3031.e: "„Nejlepší [stop_host_scope.Custom('RegionalFarmAnimal')|l]? Já přesně vím, kdo to je...“"
 cultural_festival.3031.e.tt: "Za vítěze vyhlásíš [Select_CString(farm_animal_rival.IsFemale,'svou sokyni','svého soka')] [farm_animal_rival.Custom('CZ_ShortUIName_A')]"
