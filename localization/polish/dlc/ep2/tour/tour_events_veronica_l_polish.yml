l_polish:
 tour_travel.3120.t: "Návštěva hostince U hraběcího erbu"
 tour_travel.3120.desc.intro: "Všechny hostince po cestě jsou stejně předražené. Našeho doprovodu si nelze nevšimnout, a ne že bychom se zrovna snažili být nenápadní. Jakmile vstoupíme dovnitř, všichni rázem zmlknou.\n\nJen [Select_CString(vassal_inn.IsFemale,'jedna','jeden')] [vassal_inn.GetWomanMan|l] se k nám odváží přistoupit a dychtivě se připojit k našemu stolu. Zanedlouho se rozpovídá a přitom [vassal_inn.Custom('quirk_pos_standalone')|l]. A zdá se, že jen tak nepřestane: „A právě tehdy, když [vassal_memory.GetDescription]...“\n\n"
 tour_travel.3120.desc.artifact: "„Ach, podívej se na tohle!“ zvolá [vassal_inn.GetFirstNameNoTooltip] a na stůl položí artefakt [vassal_artifact.GetName]. „Teď už je tvůj!“"
 tour_travel.3120.desc.fallback: "Pořád lepší než trapné ticho."
 tour_travel.3120.a: "„Tvoje společnost je mi příjemná, [vassal_inn.Custom('CZ_FirstNameNoTooltip_V')]. Nechceš se ke mně přidat?“"
 tour_travel.3120.a.success: "Podaří se ti přesvědčit [vassal_inn.Custom('CZ_ShortUIName_A')]"
 tour_travel.3120.a.failure: "[vassal_inn.GetShortUIName|U] [Select_CString(vassal_inn.IsLocalPlayer,'jsi','je')] [Select_CString(vassal_inn.IsFemale,'polichocena','polichocen')], ale [Select_CString(vassal_inn.IsLocalPlayer,'nenecháš','nenechá')] se přesvědčit"
 tour_travel.3120.b: "„Povídej dál!“"
 tour_travel.3120.c: "„Jaký nádherný dárek!“"
 tour_travel.3130.t: "Stinné stránky rozvoje"
 tour_travel.3130.desc.intro: "„Hej, vy tam!“ zaslechnu vzdálený výkřik. Otočím se a spatřím [Select_CString(complaining_peasant.IsFemale,'rolnici','rolníka')] s pluhem v rukou. Sotva popadá dech a na okamžik se musí zastavit.\n\n„Omlouvám se, [ROOT.Char.Custom('FormOfAddressForLiege')|l], ale jen málokdy mám příležitost s vámi promluvit. Chápu, že musíte své panství rozvíjet, ale "
 tour_travel.3130.desc.no_farms: "ty panovnické budovy, které jste tu [Select_CString(ROOT.Char.IsFemale,'nechala','nechal')] postavit, nás připravily o práci.“"
 tour_travel.3130.desc.no_jobs: "ty mlýny, které jste tu [Select_CString(ROOT.Char.IsFemale,'nechala','nechal')] postavit, nám zabraly část půdy.“"
 tour_travel.3130.desc.outro: "\n\nPři těch slovech ještě pevněji sevře násadu svého pluhu."
 tour_travel.3130.a: "„Tíží mě to u srdce. Přijmi toto zlato.“"
 tour_travel.3130.b: "„Pojď pracovat na mých pozemcích. Vrátím ti, oč jsi [Select_CString(complaining_peasant.IsFemale,'přišla','přišel')].“"
 tour_travel.3130.c: "„Zájmy panství mají vždy přednost.“"
 peasant_influx_modifier: "Příliv rolníků"
 peasant_influx_modifier_desc: "Skupina rolníků získala zdejší pozemky jako náhradu za škody způsobené výstavbou nových budov."
 tour_travel.3140.t: "Za hradbami"
 tour_travel.3140.desc: "Hluk zaslechnu ještě dřív, než spatřím samotnou budovu. Z útrob skromného dřevěného stavení se ozývají hlasy, smích a hudba. Když se přiblížíme, zamává na nás [brothel_worker.GetWomanMan|l], [Select_CString(brothel_worker.IsFemale,'která','který')] právě něco ukusuje. Je to [ROOT.GetCharacter.Custom('GetSmallFoodIndef')|l].\n\n„Ale, vítejte,“ pronese a přitom [brothel_worker.Custom('quirk_pos_standalone')|l]. „Chtěli byste u nás zůstat přes noc? Nebo jen na pár hodin? Třeba jen na chviličku?“\n\nO tom, co se mi nabízí, nemůže být pochyb."
 tour_travel.3140.a: "„To bych si #EMP [Select_CString(ROOT.Char.IsFemale,'velice ráda dopřála','velice rád dopřál')]#!.“"
 tour_travel.3140.b: "„Pokušení nepodlehnu.“"
 brothel_stop_modifier: "Obnovené síly"
 brothel_stop_modifier_desc: "Tato postava se během svých cest zastavila v několika nevěstincích."
 cultural_festival.2000.t: "Kulturní slavnost [CZPrepV(activity.GetCurrentPhase.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(activity.GetCurrentPhase.GetLocation,'L')]"
 cultural_festival.2000.desc.intro: "Ulice [CZProvName(ROOT.Char.GetCurrentLocation,'G')] jsou na počest mého příjezdu bohatě vyzdobené. Na místě už mě svědomitě očekává [stop_host_scope.GetTitledFirstName], [Select_CString(stop_host_scope.IsFemale,'má vazalka','můj vazal')].\n\n"
 cultural_festival.2000.desc.first_time_lovers: "Nemohu se dočkat své první návštěvy těchto krajů! Tolikrát mi [stop_host_scope.GetFirstNameNoTooltip] v posteli [Select_CString(stop_host_scope.IsFemale,'vyprávěla','vyprávěl')] o jejich nádherné krajině a překrásném nebi. Konečně to všechno spatřím na vlastní oči. A především chci "
 cultural_festival.2000.desc.first_time_rivals: "Ach, kolikrát už jsem [Select_CString(ROOT.Char.IsFemale,'snívala','sníval')] o tom, jak zpustoším tyhle zpustlé državy! Kolikrát jsem si [Select_CString(ROOT.Char.IsFemale,'přála','přál')] navštívit pevnost, kterou se [stop_host_scope.GetFirstNameNoTooltip] tolik [Select_CString(stop_host_scope.IsFemale,'vychloubala','vychloubal')], jen abych [Select_CString(ROOT.Char.IsFemale,'zjistila','zjistil')], že je ještě horší než moje vlastní.\n\nUž se nemohu dočkat, až spatřím tu #EMP páchnoucí díru#!. Naštěstí jsem tu také proto, abych "
 cultural_festival.2000.desc.first_time_neutral: "Nemohu říci, že by mě nezajímaly zdejší zvyky a to, co mi [stop_host_scope.GetFirstNameNoTooltip] může nabídnout. A na oplátku chci "
 cultural_festival.2000.desc.first_time_good: "Ach, jak toužím užít si všechny ty velkolepé slavnosti a radovánky, které mi [stop_host_scope.GetFirstNameNoTooltip] jistě [Select_CString(stop_host_scope.IsFemale,'připravila','připravil')]! A také chci "
 cultural_festival.2000.desc.first_time_bad: "Tak jsme konečně tady. Čeká mě nudná, přinejlepším průměrná slavnost, kterou [Select_CString(stop_host_scope.IsFemale,'měla ta trouba','měl ten trouba')] [stop_host_scope.GetFirstNameNoTooltip] tu drzost připravit. Naštěstí jsem tu také proto, abych "
 cultural_festival.2000.desc.again_lovers: "Nemohu se dočkat, až se do těchto krajů vrátím! Jak [Select_CString(ROOT.Char.IsFemale,'ráda','rád')] vzpomínám na zdejší zvyky a tradice, které jsem si při poslední návštěvě tolik [Select_CString(ROOT.Char.IsFemale,'užívala','užíval')]. A jak dlouho už toužím znovu spatřit [Select_CString(stop_host_scope.IsFemale,'svou drahou','svého drahého')] [stop_host_scope.Custom('CZ_FirstNameNoTooltip_A')]!\n\nA samozřejmě také chci "
 cultural_festival.2000.desc.again_rivals: "Ach, znovu vstoupit do [CZProvNameNoTooltip(ROOT.Char.GetCurrentLocation,'G')] je utrpení, jemuž se snad nevyrovná ani [ROOT.Char.GetFaith.NegativeAfterLife|l]. Naštěstí jsem tu zase proto, abych "
 cultural_festival.2000.desc.again_good: "Ach! Jaká radost sem znovu zavítat! Nemohu se dočkat, jaká úžasná vystoupení a lahodné pokrmy mi tentokrát [stop_host_scope.GetFirstNameNoTooltip] [Select_CString(stop_host_scope.IsFemale,'připravila','připravil')]. A také chci "
 cultural_festival.2000.desc.again_neutral: "Minule to nebylo zase tak hrozné, takže doufám, že i tentokrát bude návštěva alespoň snesitelná. Trocha zábavy daleko od dvorských intrik mi určitě přijde vhod. A samozřejmě také chci "
 cultural_festival.2000.desc.again_bad: "#EMP Ach#!, být tady #EMP zase#! je snad jedním z nejhorších trestů, jaké mi osud mohl přichystat. Snášet nesnesitelně nudnou společnost [stop_host_scope.Custom('CZ_FirstNameNoTooltip_G')] bude patrně mou největší zkouškou. Naštěstí jsem tu také proto, abych "
 cultural_festival.2000.desc.majesty: "ukázat zdejším lidem veškerou svou velkolepost."
 cultural_festival.2000.desc.intimidation: "ukázat [stop_host_scope.Custom('CZ_TitledFirstName_D')], jak má správně vládnout [ROOT.Char.GetTitleAsNameNoTooltip|l]."
 cultural_festival.2000.desc.again_intimidation: "připomenout jim svou poslední návštěvu. Postarám se, aby i tato byla stejně #EMP nezapomenutelná#!."
 cultural_festival.2000.desc.taxation: "ulehčit jejich měšcům od tíhy přebytečného zlata."
 cultural_festival.2000.a: "„Tak začněme!“"
 cultural_festival_begins_tt: "Zahájíš kulturní slavnost"
 cultural_festival.2001.t: "Nešťastný začátek"
 cultural_festival.2001.desc.intro: "Hudbu na hlavním pódiu záhy doprovodí tanečníci. Jejich pohyby jsou tak ladné, že jako by byli součástí samotné scény. Paže vzlétají do vzduchu a připomínají větve stromů, které se právě probouzejí k životu.\n\nZ publika se ozve překvapené zalapání po dechu, když [Select_CString(injured_artist.IsFemale,'jedna z tanečnic','jeden z tanečníků')] začne šplhat po dřevěné stěně jeviště.\n\n„A teď,“ pronese, „se pomstím za — #EMP áááÁÁÁÁÁ!#!“\n\n"
 cultural_festival.2001.desc.child: "Jakmile dopadne na zem, sklouzne [Select_CString(injured_artist.IsFemale,'jí','mu')] z hlavy kápě a odhalí tvář [injured_artist.GetName]. Je to [injured_artist.Custom('GetDaughterSon')|l] [stop_host_scope.Custom('CZ_TitledFirstName_G')]!"
 cultural_festival.2001.desc.normal: "V okamžiku, kdy účinkující dopadne na zem, dav úplně ztichne a všichni jasně zaslechnou hlasité #EMP křupnutí#!."
 cultural_festival.2001.a: "No... to muselo bolet."
 cultural_festival.2001.b: "„Okamžitě přiveďte lékaře!“"
 cultural_festival.2001.c: "„Za tuhle neschopnost tě nechám zbičovat!“"
 festival_helped_injured_artist_modifier: "Pomoc zraněnému účinkujícímu"
 festival_whipped_injured_artist_modifier: "Zbičování zraněného účinkujícího"
 cultural_festival.2002.t: "Dobrý začátek"
 cultural_festival.2002.desc.intro: "Místní rolníci si postavili stánky se zeleninou a tu a tam, i když jen vzácně, se objeví také [stop_host_scope.Custom('RegionalEdibleMeat')|l]. Pokračuji v procházce za doprovodu početné skupiny dvořanů, když mezi lidmi zahlédnu známou tvář. [injured_artist.GetTitledFirstName|U] na mě upřeně hledí.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ konečně ke mně přistoupí. Mé stráže na znamení ustoupí a dovolí [Select_CString(injured_artist.IsFemale,'jí','mu')] pokračovat. „[Select_CString(ROOT.Char.IsFemale,'Pomohla','Pomohl')|U] jste mi v nouzi, když jsem se při vystoupení [Select_CString(injured_artist.IsFemale,'zranila','zranil')]. Teď je řada na mně, abych se vám [Select_CString(injured_artist.IsFemale,'odvděčila','odvděčil')] tím, co mám."
 cultural_festival.2002.desc.secret: "Znám tajemství [secret_target.Custom('CZ_TitledFirstName_G')].“"
 cultural_festival.2002.desc.hunting: "Zdejší kraj znám jako své boty.“"
 cultural_festival.2002.desc.savings: "A tohle je všechno, co mám.“"
 cultural_festival.2002.a: "„To je spravedlivá odměna.“"
 cultural_festival.2002.b: "„[Select_CString(ROOT.Char.IsFemale,'Udělala','Udělal')|U] jsem jen to, co bylo třeba. Nic víc.“"
 terrain_knowledge_modifier: "Znalost terénu"
 cultural_festival.2010.t: "[ROOT.Char.Custom('GetMonarchofBeautyGoodBad')|U]"
 cultural_festival.2010.desc_bad: "Zdá se, že všichni obyvatelé [CZProvNameNoTooltip(activity.GetCurrentPhase.GetLocation,'G')] vedou ten nejzábavnější rozhovor svého života. Chichotají se, pochechtávají a občas do sebe dokonce šťouchají lokty, když už je toho na ně příliš. Tu a tam zaslechnu něco o „ponurosti“.\n\nKdyž přistoupím k hlavnímu pódiu, spatřím [stop_host_scope.Custom('CZ_TitledFirstName_A')], jak s potutelným úsměvem drží květinovou korunu.\n\n„Tady je!“ zvolá a ukáže na mě. „[Select_CString(ROOT.Char.IsFemale,'Naše','Náš')|U] [ROOT.Char.Custom('GetMonarchofBeautyGoodBad')|l]!“"
 cultural_festival.2010.desc_good: "Ulice [CZProvNameNoTooltip(activity.GetCurrentPhase.GetLocation,'G')] zdobí prapory a všudypřítomné květiny. Jsou mezi nimi také [stop_host_scope.GetCurrentLocation.Custom('get_region_flower_type_plural')|l]. Celá vesnice radostně oslavuje můj příjezd a téměř bych [Select_CString(ROOT.Char.IsFemale,'přísahala','přísahal')], že ze mě nikdo nespouští oči.\n\nKdyž přistoupím k hlavnímu pódiu, spatřím [stop_host_scope.Custom('CZ_TitledFirstName_A')], jak s úsměvem drží květinovou korunu.\n\n„Tady je!“ zvolá. „[Select_CString(ROOT.Char.IsFemale,'Naše','Náš')|U] [ROOT.Char.Custom('GetMonarchofBeautyGoodBad')|l]!“"
 cultural_festival.2010.a: "„Jaké milé překvapení!“"
 cultural_festival.2010.b: "Raději nebudu dělat scénu. Odejdu."
 cultural_festival.2010.c: "„Jak #EMP se opovažuješ#!!“"
 cultural_festival.2010.c.success: "Zvítězíš v souboji"
 cultural_festival.2010.c.failure: "[stop_host_scope.GetShortUIName|U] zvítězí v souboji"
 monarch_of_beauty_bad_male: "Král ponurosti a křivd"
 monarch_of_beauty_bad: "Královna ponurosti a křivd"
 monarch_of_beauty_good_male: "Král krásy a vznešenosti"
 monarch_of_beauty_good: "Královna krásy a vznešenosti"
 king_of_beauty_modifier: "Obdiv tělesné krásy"
 king_of_ugly_modifier: "Přehnaná reakce panovníka"
 cultural_festival.2020.t: "Čas oslav"
 cultural_festival.2020.desc.intro: "Ulice ověšené tapiseriemi! Ach, ta vůně! Právě se podává [stop_host_scope.Custom('RegionalEdibleMeat')|l]! Jak jen [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] v tomto ročním období září!\n\n"
 cultural_festival.2020.desc.christmas: "Zvoní zvony a místní se připravují na mši. Vzrušeně rozmlouvají o narození Krista.\n\n„Říkám vám, že tam byl osel!“ „A stalo se to u řeky, zrovna jako tady!“ „Až se mi narodí dítě, doufám, že dostane stejně tolik zlata!“\n\nBrzy nato začíná krátké divadelní představení, v němž se narodí Pán."
 cultural_festival.2020.desc.midsommar: "Uprostřed vesnice vztyčili májku a místní obyvatelé v bílých šatech se připravují k tanci kolem ní. Na jednom ze stolů leží květinový věnec, který zdobí [stop_host_scope.GetCurrentLocation.Custom('get_region_flower_type_plural')|l]. Mladá dívka se na mě usměje a pak se připojí k tanečnímu kruhu. Na nebi po celou noc září to nejjasnější světlo."
 cultural_festival.2020.desc.summer_solstice: "Uprostřed města zapálili velikou hranici na oslavu vítězství nejjasnějších hvězd, které vystupují na nebesa. Lidé se veselí, popíjejí a všude teče [stop_host_scope.Custom('RegionalDrink')|l]. Jeden z místních začne zpívat a ostatní se k němu přidávají:\n\n„Léto přišlo, ať hlasitě zpívá [ROOT.Char.Custom('GetRandomMigratoryBird')|l]! Osivo klíčí a louka kvete, ať zpívá [ROOT.Char.Custom('GetRandomMigratoryBird')|l]!“"
 cultural_festival.2020.desc.eid: "Po modlitbách se místní obyvatelé vzájemně navštěvují a oslavují konec půstu. Na podnosech se podávají ryby a místní zelenina, mezi níž nechybí [stop_host_scope.Custom('get_region_root_vegetable_plural')|l]. K pití se nabízí [stop_host_scope.Custom('RegionalDrink')|l] a oslavy pokračují až do západu slunce."
 cultural_festival.2020.desc.harvest: "Po dlouhých týdnech práce konečně nastal poslední den sklizně. Místní obyvatelé se rozdělují do skupin a soutěží, kdo sklidí poslední zbývající část pole.\n\n„Jen se podívejte!“ chlubí se jeden z rolníků a rozmáchne se kosou. Přitom však neposeče o nic víc než ostatní.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], pojďte slavit s námi!“ zve mě [stop_host_scope.GetTitledFirstName] a ukazuje na skupinu lidí, kteří vesele tančí na oslavu sklizně."
 cultural_festival.2020.desc.generic: "To je ale zpěvu, pokřikování a veselí!\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], pojďte slavit s námi!“ vyzve mě s přívětivým úsměvem [stop_host_scope.GetTitledFirstName].\n\nNa náměstí se shromáždili místní obyvatelé a tančí za doprovodu hudby. Vzduchem se přitom line pronikavá vůně nejrůznějších pochoutek. Podává se [stop_host_scope.Custom('RegionalDrink')|l] a [stop_host_scope.Custom('GetLocalStreetFood')|l]."
 cultural_festival.2020.a: "Jak nádherná slavnost!"
 cultural_festival.2020.b.drink: "#EMP Připijme si! Ať teče [stop_host_scope.Custom('RegionalAlcoholicDrink')|l]!#!"
 cultural_festival.2020.b.no_drink: "Čas se napít a najíst! [stop_host_scope.Custom('RegionalDrink')|U] i [stop_host_scope.Custom('RegionalEdibleMeat')|l] už čekají!"
 cultural_acceptance_embraced_festival: "Přijetí kulturní slavnosti"
 enjoyed_culture_modifier: "Účast na kulturní slavnosti"
 enjoyed_culture_modifier_desc: "Tato postava se zúčastnila místní slavnosti."
 festival_tis_the_season: "Pij a zapomeň!"
 festival_tis_the_season_desc: "Tato postava strávila místní slavnost popíjením alkoholu."
 cultural_festival.2030.t: "Zdanění kulturní slavnosti"
 cultural_festival.2030.desc: "Když se obyvatelé [CZProvNameNoTooltip(activity.GetCurrentPhase.GetLocation,'G')] začnou shromažďovat kolem dřevěného pódia, napadne mě jedna věc. Tolik lidí se tu sešlo, aby si užili tak nákladně připravené představení... #EMP zadarmo#!. To je ale plýtvání!\n\nKdybych se [Select_CString(ROOT.Char.IsFemale,'postavila','postavil')] ke vchodu, určitě bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] požadovat drobný poplatek za vstup. Koneckonců se to všechno pořádá #EMP na mou#! počest."
 cultural_festival.2030.a: "Tohle mi přece dluží."
 cultural_festival.2030.b: "Raději udělám dobrý dojem a nebudu do toho zasahovat."
 cultural_festival.2030.c: "Víš, cesta sem byla #EMP nesmírně#! drahá..."
 no_taxation_modifier: "Slavnost bez daní"
 festival_taxation_modifier: "Zdanění slavnosti"
 cultural_festival.2040.t: "Nekulturní slavnost...?"
 cultural_festival.2040.desc: "Nevím, co jsem vlastně [Select_CString(ROOT.Char.IsFemale,'očekávala','očekával')], když jsem [stop_host_scope.Custom('CZ_TitledFirstName_A')] [Select_CString(ROOT.Char.IsFemale,'požádala','požádal')], aby [Select_CString(stop_host_scope.IsFemale,'uspořádala','uspořádal')] kulturní slavnost představující zvyky svého lidu, ale... rozhodně to nebylo #EMP tohle#!.\n\nOdvrátím zrak od nesourodého tance mizerně vycvičených účinkujících a pokusím se najít útěchu alespoň v připraveném jídle. Jenže... #EMP fuj#!. Podávají se [stop_host_scope.Custom('RegionalEdibleMeat')|l] a [stop_host_scope.Custom('get_region_root_vegetable_plural')|l]. Maso je sotva propečené a zelenina spálená na uhel! Má takhle snad vypadat [cultural_festival_scope.Custom('CZ_AdjectiveNoTooltip_aa')|l] kultura?"
 cultural_festival.2040.a: "Tohle... tohle je #EMP příšerné#!. Sežeň si pomoc a dej to do pořádku."
 cultural_festival.2040.b: "Zase tak hrozné to není."
 cultural_festival.2040.c: "Ha! Ukážu jim, jak tančíme my, [ROOT.Char.GetCulture.Custom('CZ_Adjective_sti')|l] lidé!"
 cultural_festival.2040.c.success: "Tvá kultura na všechny udělá dojem"
 cultural_festival.2040.c.failure: "Všichni považují tvé chování za necitlivé"
 no_culture_modifier: "Pohrdání místní kulturou"
 helped_culture_modifier: "Pomoc s rozvojem kultury"
 appreciated_culture_modifier: "Ocenění místní kultury"
 cultural_acceptance_insulted_festival: "Pohrdání kulturní slavností"
 cultural_festival.2050.t: "Pohoršlivé pohyby"
 cultural_festival.2050.desc_intro: "„A nyní si na počest [ROOT.Char.Custom('CZ_TitledFirstNameNoTooltip_G')] společně vychutnáme místní tanec!“ oznámí [stop_host_scope.GetTitledFirstName]. Nadšeně se usadím po [Select_CString(stop_host_scope.IsFemale,'její','jeho')] pravici, kde mě čeká čerstvé ovoce a [stop_host_scope.Custom('RegionalDrink')|l].\n\n"
 cultural_festival.2050.desc_lustful: "Na vyvýšené pódium záhy vystoupí tanečníci a můj pohled okamžitě sklouzne k jejich odhaleným nohám, lesknoucím se olejem. Stejně tak se lesknou jejich nahé hrudi, které neponechávají fantazii #EMP vůbec nic#!. Neklidně se zavrtím na sedadle. Co je tohle za nádhernou oslavu lidského těla?"
 cultural_festival.2050.desc_fallback: "Na vyvýšené pódium záhy vystoupí tanečníci, všichni oblečení... no, říkat tomu #EMP oblečení#! by bylo dost přehnané. Jejich odhalené nohy se lesknou aromatickými oleji a jejich... jejich #EMP hrudi#! jsou obnažené natolik, že od nich sotva dokážu odtrhnout oči."
 cultural_festival.2050.desc_outro: "\n\n[stop_host_scope.GetTitledFirstNameNoTooltip|U] na mě pohlédne. „Líbí se ti to, [Select_CString(ROOT.Char.IsFemale,'přítelkyně','příteli')]?“"
 cultural_festival.2050.a: "Co #EMP je#! tohle za zvrhlost?"
 cultural_festival.2050.b: "Já... no, je to jejich kultura, ne?"
 cultural_festival.2050.c: "Kde se tohle skrývalo celý můj život?"
 cultural_festival.2060.t: "Artefakt z hlavního města"
 cultural_festival.2060.desc: "Navzdory veškerému úsilí, které bylo zjevně vynaloženo na přípravu slavnosti, si v [CZProvNameNoTooltip(activity.GetCurrentPhase.GetLocation,'L')] stále všímám několika opuštěných domů a nuzných staveb.\n\nKdyž se blížím k hlavnímu náměstí, spatřím [stop_host_scope.Custom('CZ_TitledFirstName_A')] [Select_CString(stop_host_scope.IsFemale,'obklopenou','obklopeného')] hloučkem dětí, které se dychtivě vyptávají na můj doprovod. Jakmile mě zahlédnou, okamžitě se schovají.\n\n„[Select_CString(ROOT.Char.IsFemale,'Přivezla','Přivezl')|U] jsem něco z hlavního města, kdyby se někdo chtěl podívat...“ prohlásím a ukážu [stop_host_scope.Custom('CZ_FirstNameNoTooltip_D')] artefakt [sophisticated_artifact.GetNameNoTooltip], který jsem si [Select_CString(ROOT.Char.IsFemale,'přivezla','přivezl')] s sebou.\n\n„Nádhera!“ zvolá [stop_host_scope.GetTitledFirstNameNoTooltip] a děti se znovu seběhnou, aby si artefakt prohlédly."
 cultural_festival.2060.a: "„Vlastně si ho můžeš nechat.“"
 cultural_festival.2060.b: "„Opatrně s těma rukama.“"
 cultural_festival.2060.c: "„Zaplatím tvým řemeslníkům, aby ti takový také vyrobili!“"
 cultural_festival.2070.t: "Hra náhody"
 cultural_festival.2070.desc: "Sotva otevřu dveře hostince, udeří mě do nosu neuvěřitelně silný zápach. U zadního stolu vesele zpívá skupina [Select_CString(retired_mercenary.IsFemale,'vysloužilých žoldnéřek','vysloužilých žoldnéřů')].\n\n„Ha! [Select_CString(retired_mercenary.IsFemale,'Říkala','Říkal')|U] jsem, že vyhraju!“ vykřikne jedna z postav a obratně protočí mezi prsty několik hracích kostek. Pak zvedne hlavu a zadívá se přímo na mě.\n\n„Nechceš také zkusit štěstí, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]?“\n\n„Opatrně, [ROOT.Char.Custom('FormOfAddressForLiege')|l],“ varuje mě [stop_host_scope.GetTitledFirstName]. „To jsou vysloužilí žoldnéři, kterým se v mých krajích natolik zalíbilo, že tu zůstali.“"
 cultural_festival.2070.a: "„Možná byste tu mohli zůstat... a dohlížet na pořádek.“"
 cultural_festival.2070.b: "„No tak, ještě #EMP jednou#! do války. Když vyhraju.“"
 cultural_festival.2070.b.success: "Vyhraješ hru"
 cultural_festival.2070.b.failure: "Prohraješ hru"
 cultural_festival.2070.c: "„Mám vlastní kostky. Pojďme to trochu okořenit!“"
 cultural_festival.2070.c.failure: "Odhalí tvé podvádění"
 cultural_festival.2070.d: "„Ále, raději si připijme na staré dobré časy.“"
 festival_hired_mercenaries: "Najmutí vysloužilí žoldnéři"
 festival_hired_mercenaries_desc: "Tato postava najala skupinu vysloužilých žoldnéřů, aby dohlíželi na pořádek."
 festival_luck_mercenaries: "Ještě jedna válka"
 festival_luck_mercenaries_desc: "Tato postava přesvědčila několik vysloužilých žoldnéřů, aby jí pomohli ve válce."
 festival_drank_with_mercenaries: "Popíjení se žoldnéři"
 cultural_festival.2080.t: "Zázračná nabídka"
 cultural_festival.2080.desc: "Při procházce slavností si všimnu postavy zahalené do pláště s kápí, která nabízí k prodeji malé lahvičky naplněné jakousi záhadnou tekutinou.\n\n„Pojďte blíž a kupte si mé léčivé přípravky, [ROOT.Char.Custom('FormOfAddressForLiege')|l]! Dělají zázraky a dokážou uvést tělesné šťávy do rovnováhy i [Select_CString(ROOT.Char.IsFemale,'té nejslabší ženě','tomu nejslabšímu muži')].“\n\nProhlédnu si vystavené lahvičky. Jedna z nich září sytě rumělkovou červení, jako by obsahovala ten nejjemnější cinabarit. Druhá má jasně zelenou barvu, jako kdyby někdo ponořil měděné plíšky do čerstvého vína."
 cultural_festival.2080.a: "„Vezmu si tu červenou lahvičku!“"
 cultural_festival.2080.b: "„Ach, ten zelený lék vypadá mnohem zdravěji!“"
 cultural_festival.2080.c: "„Kvůli tomuhle nebudu riskovat své zdraví.“"
 cultural_festival.2080.tt: "Může to mít nepředvídatelné následky"
