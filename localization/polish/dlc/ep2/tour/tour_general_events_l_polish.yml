l_polish:
 tour_general.1003.t: "$activity_tour$: Zvěrský návrh"
 tour_general.1003.desc_purge_cats: "Při prohlídce držav [Select_CString(visiting_liege.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_liege'))] [visiting_liege.GetTitledFirstName] právě [Select_CString(visiting_liege.IsFemale,'prohlásila','prohlásil')], jak hluboce se [Select_CString(visiting_liege.IsFemale,'jí','mu')] hnusí kočky a jim podobná havěť."
 tour_general.1003.desc_purge_dogs: "Při prohlídce držav [Select_CString(visiting_liege.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_liege'))] [visiting_liege.GetTitledFirstName] právě [Select_CString(visiting_liege.IsFemale,'prohlásila','prohlásil')], jak se [Select_CString(visiting_liege.IsFemale,'jí','mu')] protiví ti obyčejní, hloupí čoklové a ostatní psi."
 tour_general.1003.desc_pet_cat_outro: "Když se vracíme do mého sídla, přikráčí ke mně moje kočka [ROOT.Char.Custom('CatStoryName')] a začne hlasitě příst, přesně jako pokaždé, když se vrátím domů.\n\nJemně ji hladím po hebkých ouškách a vouscích, když v zádech ucítím spalující pohled [visiting_liege.Custom('CZ_TitledFirstNameNoTooltip_G')]. Náhle mi dochází, co by znamenalo vyhubit #EMP všechny#! kočky, a sevře se mi žaludek.\n\n„Stačil by mi #EMP i#! tenhle odporný tvor,“ pronese [visiting_liege.GetTitleAsNameNoTooltip|l] tiše, s odpudivě sladkým podtónem."
 tour_general.1003.desc_pet_dog_outro: "Když se vracíme do mého sídla, přiběhne ke mně můj pes [ROOT.Char.Custom('DogStoryName')]. S laskavým pohledem v očích mě na uvítanou něžně šťouchne čenichem.\n\nZatímco [ROOT.Char.Custom('DogStoryName')] láskyplně drbu za ušima, ostrý pohled [visiting_liege.Custom('CZ_TitledFirstNameNoTooltip_G')] těká mezi mnou a mým psem. Na okamžik ztuhnu, když mi dojde, co by znamenalo vyhubit #EMP všechny#! psy.\n\n„Stačil by mi #EMP i#! tenhle odporný tvor,“ pronese [visiting_liege.GetTitledFirstNameNoTooltip] tiše, s odpudivě sladkým podtónem."
 tour_general.1003.desc_default_outro: "\n\nPo návratu do mých komnat si dáme něco k pití a já přemítám nad nepříjemnou situací, v níž jsem se [Select_CString(ROOT.Char.IsFemale,'ocitla','ocitl')]. Cítím na sobě upřený pohled [visiting_liege.Custom('CZ_TitledFirstNameNoTooltip_G')], který očekává mou odpověď na svůj návrh vyhubit tato zvířata."
 tour_general.1003.a_cat: "Ach, [ROOT.Char.Custom('CatStoryName')]..."
 tour_general.1003.a_dog: "Vždycky jsi byl můj miláček, [ROOT.Char.Custom('DogStoryName')]..."
 tour_general.1003.a_cat.flavor: "Oběť kočky [ROOT.Char.Custom('CatStoryName')] zachrání ostatní kočky."
 tour_general.1003.a_dog.flavor: "Oběť psa [ROOT.Char.Custom('DogStoryName')] zachrání ostatní psy."
 tour_general.1003.b: "Vyhubme toulavé [visiting_liege.Custom('HateCatsDogs')|l]."
 tour_general.1003.c: "S tím nechci mít nic společného."
 tour_general.2000.t: "$activity_tour$: Rozvázaný jazyk"
 tour_general.2000.desc_intro: "Oheň praská a jiskry létají do noci, zatímco oslavy na počest [visiting_liege.Custom('CZ_TitledFirstName_G')] pokračují až do časných ranních hodin. Potloukám se mezi hosty, nezávazně rozmlouvám a připíjím si s členy [Select_CString(visiting_liege.IsFemale,'jejího','jeho')] doprovodu.\n\nV odlehlejším koutě slavnosti zahlédnu někoho z doprovodu [visiting_liege.Custom('CZ_TitledFirstName_G')]. Je to [visiting_liege.Custom2('RelationToMeShort', SCOPE.sC('2000_secret_holder'))] [2000_secret_holder.GetTitledFirstName], zjevně [Select_CString(2000_secret_holder.IsFemale,'opilá','opilý')] pod obraz a s nepřítomným pohledem natahující ruku po dalším poháru.\n\nKdyž se přiblížím, zaslechnu tiché mumlání: "
 tour_general.2000.desc_liege: "„Ach, [visiting_liege.GetTitledFirstNameNoTooltip], proč jen máš takovou slabost pro...“"
 tour_general.2000.desc_self: "„[2000_secret_holder.GetFirstNameNoTooltip], vzpamatuj se! Přestaň se tolik trápit kvůli...“"
 tour_general.2000.desc_outro: " Jakmile si však [2000_secret_holder.GetTitledFirstName] všimne mé přítomnosti, okamžitě zmlkne."
 tour_general.2000.a: "Ach, také mám své trápení, víš..."
 tour_general.2000.a_liege: "Ale #EMP já#! bych to přece nikomu neprozradil..."
 tour_general.2000.a_spill_beans.t: "Tajemství odhaleno"
 tour_general.2000.a_spill_beans.desc: "Úspěšně vylákáš tajemství od [2000_secret_holder.Custom('CZ_ShortUIName_G')]"
 tour_general.2000.a_liege_beans.tt: "Dozvíš se tajemství o [visiting_liege.Custom('CZ_ShortUIName_L')]"
 tour_general.2000.a_self_beans.tt: "Dozvíš se tajemství o [2000_secret_holder.Custom('CZ_ShortUIName_L')]"
 tour_general.2000.a_unsuccessful.t: "Záminka k vydírání"
 tour_general.2000.a_unsuccessful.desc: "[2000_secret_holder.GetShortUIName|U] vůči tobě pojme podezření"
 tour_general.2000.b: "Raději odsud zmizím."
 tour_general.2001.t: "$activity_tour$: Nepříjemná situace"
 tour_general.2001.desc_hashish: "Při prohlídce vozů doprovázejících mého lenního pána narazím na [2001_precarious_entourage_character.Custom('CZ_TitledFirstName_A')]. Něco je očividně v nepořádku. Pohled neustále těká ze strany na stranu, ruce se nervózně přehrabují v měšci a celé to působí nanejvýš podezřele.\n\nNakloním se blíž a všimnu si zarudlých očí. [2001_precarious_entourage_character.GetTitledFirstName|U] ke mně vzhlédne a rozpačitě se usměje.\n\n„[ROOT.Char.Custom('CZ_TitledFirstNameNoTooltip_V')], omlouvám se za svůj žalostný stav. Zdá se, že se mi někam zatoulal jistý... lék. Nevíš náhodou něco o #EMP té bylině#!?“"
 tour_general.2001.desc_privy: "Cestou [CZPrepV(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(ROOT.Char.GetCurrentLocation,'L')] na setkání s návštěvou, kterou je [Select_CString(visiting_liege.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_liege'))] [visiting_liege.GetTitledFirstName], náhle zaslechnu tlumený výkřik. Zastavím se, zaposlouchám a vydám se za hlasem.\n\nDovede mě až k latríně v jedné z úzkých uliček. Zevnitř se ozývá zoufalé volání o pomoc.\n\n„Jsem [2001_precarious_entourage_character.GetTitledFirstName] a zdá se, že jsem tu poněkud... [Select_CString(2001_precarious_entourage_character.IsFemale,'uvízla','uvízl')],“ přizná hlas."
 tour_general.2001.desc_outro: "\n\n„Kdybys mi [Select_CString(ROOT.Char.IsFemale,'byla','byl')] tak laskavě ochotný pomoci, mohl bych se s tebou podělit o cenné informace z našeho dvora...“ [2001_precarious_entourage_character.GetTitledFirstName] naléhavě prosí."
 tour_general.2001.a: "Vydrž, dostanu tě ven."
 tour_general.2001.a_hashish: "Uvidím, co se dá dělat."
 tour_general.4004.a_discreet.t: "Úspěšná záchrana"
 tour_general.4004.a_discreet.desc: "Obratně pomůžeš [2001_precarious_entourage_character.Custom('CZ_ShortUIName_D')] dostat se z latríny"
 tour_general.4004.a_stained.t: "Potřísněný oděv"
 tour_general.4004.a_stained.desc: "Při pokusu si ušpiníš své oblíbené roucho"
 tour_general.2001.a_success.t: "Zvýšená úspěšnost intriky"
 tour_general.2001.a_success.desc: "[2001_precarious_entourage_character.GetShortUIName|U] se s tebou podělí o zajímavé informace týkající se [2001_scheme_target.Custom('CZ_ShortUIName_G')]"
 tour_general.2001.a_secrecy.t: "Lepší utajení intriky"
 tour_general.2001.a_secrecy.desc: "[2001_precarious_entourage_character.GetShortUIName|U] ti prozradí informace o tajných cestách"
 tour_general.2001.b: "Trocha hašiše by teď nebyla k zahození."
 tour_general.2001.b_super_success.t: "Výrazně zvýšená úspěšnost intriky"
 tour_general.2001.b_super_success.desc: "[2001_precarious_entourage_character.GetShortUIName|U] ti prozradí nesmírně cenné informace týkající se [2001_scheme_target.Custom('CZ_ShortUIName_G')]"
 tour_general.2001.b_super_secrecy.t: "Výrazně lepší utajení intriky"
 tour_general.2001.b_super_secrecy.desc: "[2001_precarious_entourage_character.GetShortUIName|U] ti prozradí informace o tajných chodbách"
 tour_general.2001.b_spaceout.t: "Zcela mimo"
 tour_general.2001.b_spaceout.desc: "Ty i [2001_precarious_entourage_character.GetShortUIName] úplně ztratíte pojem o okolním světě"
 tour_general.2001.c: "Já... ne. Tohle je nedůstojné."
 tour_general.3003.t_cat: "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip|U]: Svět patří kočkám"
 tour_general.3003.t_dog: "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip|U]: Svět patří psům"
 tour_general.3003.desc_love_cats: "Při procházce ulicemi [CZProvName(ROOT.Char.GetCurrentLocation,'G')] mě za doprovodu [stop_host_scope.Custom('CZ_TitledFirstName_G')] náhle vyruší toulavý čokl. Když se rozhlédnu dál po ulici, spatřím celou smečku těch vzteklých psisek, jak pobíhají kolem a tropí nesnesitelný rámus.\n\nZnechuceně ohrnu ret. Ti #EMP tvorové#!. Nemají ani špetku přirozeného kočičího půvabu. Očichávají si vlastní i cizí zadky, olizují... #EMP Fuj!#! ... Zjevně jde o podřadné bytosti. A tady jsou navíc nesnesitelnou obtíží.\n\nNe. Tomuto místu by bez těchto škůdců bylo mnohem lépe."
 tour_general.3003.desc_love_dogs: "Při procházce ulicemi [CZProvName(ROOT.Char.GetCurrentLocation,'G')], kdy mě ochotně doprovází [stop_host_scope.GetTitledFirstName], mi náhle něco přistane na hlavě. #EMP Něco ostrého!#!\n\nOkamžitě po tom sáhnu a zjistím, že jde o rozzuřenou, odpornou kočku, která na mě syčí a zatíná mi drápy do obličeje. Instinktivně o několik kroků ustoupím a tu bestii bez okolků shodím na zem.\n\nTi proradní, nespolehliví... #EMP zlomyslní#! tvorové! Zvednu hlavu a na konci ulice spatřím celé hejno koček. Všechny na mě hledí těma svýma zlýma očima. Takhle to dál nejde."
 tour_general.3003.a: "Musíme tohle město očistit od té odporné havěti! [ROOT.Char.Custom('HateCatsDogs')|U] musí pryč!"
 tour_general.3003.a_host_decides.tt: "[stop_host_scope.GetShortUIName|U] [Select_CString(stop_host_scope.IsLocalPlayer,'rozhodneš','rozhodne')], co se stane dál"
 tour_general.3003.a_potential_outcome_agree: "[stop_host_scope.GetShortUIName|U] ti pomůže vyhubit místní zvířata ([ROOT.Char.Custom('HateCatsDogs')|l])"
 tour_general.3003.a_potential_outcome_offer_up_pet: "[stop_host_scope.GetShortUIName|U] ti nabídne vlastního domácího mazlíčka ([ROOT.Char.Custom('HateCatDog')|l])"
 tour_general.3003.a_potential_outcome_disagree: "[stop_host_scope.GetShortUIName|U] ti #EMP odmítne#! pomoci s hubením místních zvířat ([ROOT.Char.Custom('HateCatsDogs')|l])"
 tour_general.3003.b: "Když o tom tak přemýšlím, raději se věnujme něčemu jinému."
 tour_general.3003.b_cynical: "Ne, nadělalo by to příliš mnoho nepořádku."
 tour_general.3003.fanatic_subjects_approve.tt: "Tento čin schvalují tví poddaní, jejichž oblíbeným zvířetem je [visiting_liege.Custom('GetCatDog')|l]"
 tour_general.3003.compassionate_subjects_disapprove.tt: "Tví soucitní poddaní tento čin odsuzují"
 tour_general.3004.t: "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip|U]: Nutné zlo"
 tour_general.3004.desc_intro_sacrifice: "Je dokonáno. Zvíře, které dosud žilo v sídle [stop_host_scope.Custom('CZ_TitledFirstName_G')], bylo odstraněno a jeho tělo nyní visí jako výstraha na šibenici [CZPrepV(stop_host_scope.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip)] [stop_host_scope.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')]."
 tour_general.3004.desc_intro: "Je dokonáno. Mrtvá těla zvířat jsou navršena u šibenice [CZPrepV(stop_host_scope.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip)] [stop_host_scope.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')] a na několika menších hranicích už hoří oheň, který má ty odporné tvory navždy odstranit."
 tour_general.3004.desc_vassal_sacrifice: "\n\nOceňuji, že [stop_host_scope.GetTitledFirstName] konečně [Select_CString(stop_host_scope.IsFemale,'dostala','dostal')] rozum a [Select_CString(stop_host_scope.IsFemale,'vydala','vydal')] mi toho špinavého tvora. Asi bych se [Select_CString(ROOT.Char.IsFemale,'měla','měl')] jít umýt. Kdo ví, jaké choroby ta potvora přenášela."
 tour_general.3004.desc_vassal_help: "\n\nOceňuji, že [stop_host_scope.GetTitledFirstName] [Select_CString(stop_host_scope.IsFemale,'přispěchala','přispěchal')] na pomoc a bez váhání se [Select_CString(stop_host_scope.IsFemale,'pustila','pustil')] do shánění těch odporných zvířat. Teď mohu klidně spát s vědomím, že je mé panství zase o něco bezpečnější."
 tour_general.3004.desc_no_help: "\n\nZbabělost! [stop_host_scope.GetTitledFirstName|U] mi vůbec [Select_CString(stop_host_scope.IsFemale,'nepomohla','nepomohl')]. Pohrdavě si odfrknu při pomyšlení na neposlušnost [ROOT.Char.Custom2('CZ_RelationToMeShort_G', SCOPE.sC('stop_host_scope'))] [stop_host_scope.Custom('CZ_TitledFirstName_G')]. Alespoň teď vím, na čí straně stojí."
 tour_general.3004.desc_outro: "\n\nCestou do lázně připravené v mém sídle zahlédnu u šibenice zatoulané zvíře. [ROOT.Char.Custom('GetCatDog')|U] zvědavě pozoruje celé to divadlo. Usměji se na to [ROOT.Char.Custom('GetFelineCanine')|l] stvoření a přikývnu.\n\n„Už je všechno v pořádku, miláčku.“"
 tour_general.3004.a: "Je vykonáno."
 tour_general.4000.t: "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip|U]: Potupný průvod"
 tour_general.4000.desc: "Hlavní ulice [CZProvName(ROOT.Char.GetCurrentLocation,'G')] je přeplněná [stop_host_scope.GetCulture.Custom('CZ_AdjectiveNoTooltip_yymi')|l] obyvateli, kteří touží alespoň na okamžik zahlédnout [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_A')].\n\n[ROOT.Char.GetInvolvedActivity.GetNameNoTooltip|U] má však svůj účel. Ohlédnu se za sebe na vězně ze svého doprovodu, kteří stojí seřazeni v průvodu, spoutaní řetězy. Tito měšťané si mě musí vážit a pochopit, co čeká každého, kdo se odváží překročit vymezené hranice.\n\nNedaleko mě stojí [parade_master.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('parade_master'))|l], s mečem v ruce a vyčkávavě na mě hledí. Stačí jediné znamení a potupný průvod vězňů může vyrazit ulicí."
 tour_general.4000.a: "Veďte je ulicemi, ať je všichni vidí!"
 tour_general.4000.a_parade.t: "Potupný průvod"
 tour_general.4000.a_parade.desc: "Necháš vězně projít ulicemi před zraky obyvatel"
 tour_general.4000.a_egged.t: "Zasypání vejci"
 tour_general.4000.a_egged.desc: "Dav po tobě začne házet vejce"
 tour_general.4000.b: "#EMP Vláčejte#! je ulicemi."
 tour_general.4000.b.flavor: "Ta zločinecká sebranka si nic lepšího nezaslouží!"
 tour_general.4000.c: "Možná bychom mohli podniknout něco jiného..."
 tour_general.4001.t: "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip|U]: Skrytá tajemství"
 tour_general.4001.desc: "Při návštěvě držav [stop_host_scope.Custom('CZ_TitledFirstName_G')] [CZPrepV(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetCurrentLocation,'L')] se mi jakýmsi zázrakem podaří ztratit z dohledu zbytek svého doprovodu. Ocitám se tak zcela [Select_CString(ROOT.Char.IsFemale,'sama','sám')] v soukromých komnatách svého [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('stop_host_scope'))|l].\n\nTohle by mohla být ideální příležitost poznat [stop_host_scope.Custom('CZ_TitledFirstName_A')] o něco #EMP důvěrněji#!. Co kdybych se tu trochu porozhlédl? Třeba objevím nějaké... neobvyklé... předměty nebo něco, co by přede mnou [stop_host_scope.GetTitledFirstNameNoTooltip] rozhodně [Select_CString(stop_host_scope.IsFemale,'chtěla','chtěl')] zatajit."
 tour_general.4001.a: "V ložnici se jistě skrývá něco podezřelého."
 tour_general.4001.a.tt: "Prohledáš ložnici"
 tour_general.4001.b: "Radní síň je jako stvořená pro nekalé dohody."
 tour_general.4001.b.tt: "Prohledáš zasedací síň rady"
 tour_general.4001.c: "Kdo ví, jaké neřesti skrývá [stop_host_scope.GetFaith.HouseOfWorship|l]."
 tour_general.4001.c.tt: "[stop_host_scope.GetFaith.HouseOfWorship|U] se stane cílem tvé prohlídky"
 tour_general.4001.d: "Kdo ví, jaké zvrhlosti se mohou ukrývat v kuchyni."
 tour_general.4001.d.tt: "Prohledáš kuchyni"
 tour_general.4001.e: "Mám na práci důležitější věci."
 tour_general.4001.outcome_a_desc: "Najdeš něco podezřelého"
 tour_general.4001.outcome_a: "Odhalíš tajemství [stop_host_scope.Custom('CZ_ShortUIName_G')]"
 tour_general.4001.outcome_b_desc: "Nic nenajdeš"
 tour_general.4001.outcome_c_desc: "Přistihnou tě přímo při činu"
 tour_general.4002.t: "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip|U]: Odhalené tajemství"
 tour_general.4002.desc_bedchamber: "Soukromé komnaty [stop_host_scope.Custom('CZ_TitledFirstName_G')] jsou překvapivě čisté a uklizené. Postel dokonce až podezřele dokonale. Chvíli se rozhlížím a pátrám po čemkoli, co by tu mohlo být na svém místě trochu nepatřičné.\n\n"
 tour_general.4002.desc_council_chamber: "Nenápadně vklouznu do radní síně [stop_host_scope.Custom('CZ_TitledFirstName_G')]. Oči i uši mám na stopkách, abych včas [Select_CString(ROOT.Char.IsFemale,'odhalila','odhalil')] jakýkoli náznak toho, že by mě někdo mohl přistihnout. Místnost vypadá jako docela obyčejná radní síň. Procházím kolem polic, prohlížím jejich obsah a pročítám dokumenty roztroušené po stolech.\n\n"
 tour_general.4002.desc_shrine: "[stop_host_scope.GetFaith.HouseOfWorship|U] mě přivítá zlověstným tichem, zatímco procházím chodbami a pátrám po jakékoli užitečné informaci. Všechny místnosti vypadají naprosto obyčejně. Zahnu za další roh a nepřestávám naslouchat, zda se někdo neblíží.\n\n"
 tour_general.4002.desc_kitchen: "Než vstoupím do kuchyně, pečlivě se ujistím, že je prázdná. Rychle se rozhlédnu, abych se [Select_CString(ROOT.Char.IsFemale,'zorientovala','zorientoval')]. Možná by se nějaká tajemství mohla ukrývat ve sklepě.\n\n"
 tour_general.4002.desc_deviant: "Náhle si všimnu úzké škvíry ve zdi. Opatrně do ní sáhnu a vytáhnu několik kreseb zachycujících... #EMP nebesa, slituj se#!... nejrůznější zvrhlíky při provozování velice zvláštních praktik.\n\nKe kresbám jsou připojeny i jakési předměty, kterých bych se raději ani nedotýkal."
 tour_general.4002.desc_homosexual: "Přistoupím k posteli a rukou zajedu pod okraj vycpané matrace. Nahmatám tam... dopisy, které napsal [stop_host_scope.GetTitledFirstNameNoTooltip]? Z jejich obsahu je zřejmé, že [Select_CString(stop_host_scope.IsFemale,'vyznává','vyznává')] lásku [Select_CString(stop_host_scope.IsFemale,'jiné ženě','jinému muži')]?!\n\nNo vida, kdo by to byl řekl."
 tour_general.4002.desc_murder_attempt: "Zaujme mě toaletní stolek s nádherným zrcadlem zasazeným do dokonale opracovaného dřeva. Nakloním se, abych se podíval za zrcadlo, a objevím váček plný... čehosi.\n\nOtevřu ho a naleznu podrobné informace o nedávném #EMP pokusu o vraždu#!. Váček okamžitě vrátím na místo."
 tour_general.4002.desc_cannibal: "S tichým zavrzáním otevřu dveře a nahlédnu do spoře osvětlené místnosti. Vejdu dovnitř a všimnu si... lidské lebky? Opřené o pult u protější stěny? Je to vůbec... Náhle mě udeří do nosu odporný zápach. Zvedá se mi žaludek a pak zahlédnu ruku.\n\nRuku oddělenou od těla. #EMP Lidské maso#!?"
 tour_general.4002.desc_lover: "Trochu klopýtnu a ve snaze udržet rovnováhu se opřu o zeď. Přitom nechtěně zatáhnu za nástěnnou lampu. K mému překvapení se hladce sklopí dolů a odhalí otvor ve zdi.\n\nVýklenek je až po okraj nacpaný... milostnými dopisy [stop_host_scope.Custom('CZ_TitledFirstName_G')]? Určenými #EMP tajné lásce#!?"
 tour_general.4002.desc_murder: "Pohledem přejíždím po okenním parapetu, když si všimnu části zdiva, která trochu vyčnívá. Přistoupím blíž a vytáhnu odtud zakrvácenou dýku společně s dopisy, které [stop_host_scope.GetTitledFirstNameNoTooltip] adresuje možným spolupachatelům již spáchané #EMP vraždy#!.\n\nSpěšně všechno vrátím do úkrytu."
 tour_general.4002.desc_non_believer: "Pohlédnu ke svatostánku na konci místnosti. Zpod závěsu visícího ze stolu něco vyčnívá... Zatáhnu za látku a objevím sbírku poznámek, v nichž [stop_host_scope.GetTitledFirstNameNoTooltip] otevřeně pochybuje o tom, zda [stop_host_scope.GetFaith.HighGodName] vůbec existuje.\n\nO několik kroků ustoupím. [stop_host_scope.GetTitledFirstNameNoTooltip] – #EMP nevěřící#!?"
 tour_general.4002.desc_incest: "Opatrně se přiblížím k pootevřeným dveřím sklepa a nakloním se, abych [Select_CString(ROOT.Char.IsFemale,'nahlédla','nahlédl')] dovnitř. Oči se mi úžasem rozšíří a okamžitě o několik kroků ustoupím. Snažím se nevydat ani hlásku a pochopit, co jsem právě [Select_CString(ROOT.Char.IsFemale,'spatřila','spatřil')].\n\n[stop_host_scope.GetTitledFirstNameNoTooltip]? Při tělesných radovánkách s... s... #EMP blízkým příbuzným#!?"
 tour_general.4002.desc_witch: "Jeden z praporců visících na zdi je poněkud nakřivo... Dotknu se ho a z jeho úkrytu vypadne malý, ale nádherně zdobený černý grimoár. S tlumeným žuchnutím dopadne na podlahu.\n\n[stop_host_scope.Custom('MagicPracticeTerm')|U]?"
 tour_general.4002.desc_embezzler: "Přejedu rukou po hraně stolu a na spodní straně desky nahmatám něco neobvyklého. Zatáhnu za to a vytáhnu... daňové záznamy?\n\nNe, tohle jsou dokumenty podrobně popisující, jak se zlato převádí z #EMP cizích#! pokladnic do pokladnice [stop_host_scope.Custom('CZ_TitledFirstName_G')]. Zpronevěra!"
 tour_general.4002.a: "Tohle se bude náramně hodit..."
 tour_general.4002.a_deviant: "Další milovník zakázaných radovánek!"
 tour_general.4002.a_homosexual_female: "Spřízněná milovnice žen!"
 tour_general.4002.a_homosexual_male: "Spřízněný milovník mužů!"
 tour_general.4002.a_homosexual: "Další veselá duše!"
 tour_general.4002.a_cannibal: "Další labužník!"
 tour_general.4002.a_non_believer: "Spřízněná duše hledající pravdu!"
 tour_general.4002.a_incest: "Další milovník lásky bez hranic!"
 tour_general.4002.a_witch: "Další [stop_host_scope.Custom('SisterBrother')|l]!"
 tour_general.4003.t: "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip|U]: Není tu nic k vidění"
 tour_general.4003.desc_faux_bedchamber: "Když nahlédnu do ložnice, přistoupí ke mně [Select_CString(servant_gender.IsFemale,'služebná, která právě uklízí','sluha, který právě uklízí')]. Významně mi pokyne, abych se naklonil blíž.\n\n„[Select_CString(ROOT.Char.IsFemale,'Má paní','Můj pane')], prozradil vám už někdo tajemství #EMP dokonale#! složených prostěradel?“ zeptá se s očekáváním v očích.\n\nTiše si povzdechnu, omluvím se a opustím místnost."
 tour_general.4003.desc_faux_council_chamber: "Radní síň je téměř úplně prázdná. Především v ní není jediná alespoň trochu zajímavá informace nebo tajemství, které bych mohl odhalit.\n\nKdyž se otočím k odchodu, poleká mě hlas za zády.\n\n„[Select_CString(ROOT.Char.IsFemale,'Má paní','Můj pane')], dovolte mi prozradit vám tajemství, jak udržet stůl bez jediného smítka prachu...“\n\nPředstírám, že nic neslyším, a spěšně místnost opustím."
 tour_general.4003.desc_faux_shrine: "[stop_host_scope.GetFaith.HouseOfWorship|U] mě vítá dlouhými chodbami, v nichž pečlivě pátrám po čemkoli podezřelém. Mé úsilí však nepřináší vůbec nic.\n\nPři prohledávání narazím na služebnictvo, které mi za každou cenu chce vyzradit tajemství... leštění cínového nádobí.\n\nZdvořile odmítnu."
 tour_general.4003.desc_faux_kitchen: "V kuchyni panuje nepořádek, jako by tu služebnictvo ještě před chvílí připravovalo další pokrm. Zamířím ke sklepu a opatrně nahlédnu dovnitř.\n\nSpatřím [Select_CString(servant_gender.IsFemale,'služebnou, která','sluhu, který')] právě rovná do úhledných hromádek [stop_host_scope.Custom('get_region_root_vegetable_plural')|l]. [Select_CString(servant_gender.IsFemale,'Služebná','Sluha')] ke mně zvědavě vzhlédne a otevře ústa.\n\n„[Select_CString(ROOT.Char.IsFemale,'Má paní','Můj pane')], víte, jaké tajemství skrývají [stop_host_scope.Custom('get_region_root_vegetable_plural')|l]?“\n\nVěnuji tomu člověku nedůvěřivý pohled, otočím se a odejdu z kuchyně."
 tour_general.4003.a: "To byla ztráta času."
 tour_general.4004.t: "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip|U]: Přistižen při činu!"
 tour_general.4004.desc_bedchamber_caught: "Sotva vstoupím do ložnice a začnu se rozhlížet, rozletí se dveře na opačné straně místnosti. Ve dveřích stojí [stop_host_scope.GetTitledFirstName]. [stop_host_scope.GetSheHe|U] na mě hledí s očima rozšířenýma překvapením.\n\nPak se [Select_CString(stop_host_scope.IsFemale,'jí','mu')] oči podezřívavě přimhouří. Zachvátí mě lehká panika, ale snažím se zachovat klid."
 tour_general.4004.desc_council_chamber_caught: "Sotva vstoupím do radní síně, zaslechnu rychle se blížící kroky. Zalije mě studený pot a horečně se snažím dostat na opačnou stranu místnosti, abych se [Select_CString(ROOT.Char.IsFemale,'ukryla','ukryl')]. Jenže je příliš pozdě.\n\nPohled [stop_host_scope.Custom('CZ_TitledFirstName_G')] se upře přímo na mě. „Tady tě máme, [Select_CString(ROOT.Char.IsFemale,'má','můj')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]!“ ozve se. [Select_CString(stop_host_scope.IsFemale,'Její','Jeho')] oči se přimhouří, zatímco mě podezřívavě pozoruje a zkoumá mou zoufalou snahu tvářit se nenuceně."
 tour_general.4004.desc_shrine_caught: "Místní [stop_host_scope.GetFaith.HouseOfWorship|l] na mě působí poklidně. Procházím chodbami, ale když zahnu za další roh, málem #EMP vrazím#! přímo do [stop_host_scope.Custom('CZ_TitledFirstName_G')]. Srdce se mi téměř zastaví.\n\n[stop_host_scope.GetTitledFirstNameNoTooltip|U] se překvapeně otočí. Jakmile však pozná, kdo do [Select_CString(stop_host_scope.IsFemale,'ní','něj')] málem narazil, podezřívavě přimhouří oči.\n\n„Už nějakou dobu tě hledám, [Select_CString(ROOT.Char.IsFemale,'má','můj')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')].“"
 tour_general.4004.desc_kitchen_caught: "Kuchyně je ponořená do přítmí a vzduch je plný prachu. Opatrně procházím prostornou místností a nakloním se nad několik poznámek s recepty. Vtom za sebou zaslechnu zavrzání. Prudce se otočím a spatřím [stop_host_scope.Custom('CZ_TitledFirstName_A')], jak vychází ze sklepa.\n\n[stop_host_scope.GetSheHe|U] na mě hledí, očividně stejně [Select_CString(stop_host_scope.IsFemale,'překvapená','překvapený')] jako já. Pak se [Select_CString(stop_host_scope.IsFemale,'jí','mu')] oči přimhouří.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]...?“"
 tour_general.4004.desc_outro: "\n\n„... Copak tu vlastně provádíš?“ zeptá se [stop_host_scope.GetTitledFirstNameNoTooltip] podezíravým tónem."
 tour_general.4004.a: "Ehm... Já... [Select_CString(ROOT.Char.IsFemale,'Hledala','Hledal')] jsem tě!"
 tour_general.4004.a_diplomacy: "Ach, #EMP tady#! jsi!"
 tour_general.4004.a_diplomacy_convinced.t: "Přesvědčivý výstup"
 tour_general.4004.a_diplomacy_convinced.desc: "Podaří se ti přesvědčit [stop_host_scope.Custom('CZ_ShortUIName_A')]"
 tour_general.4004.a_diplomacy_nonconvinced.t: "Nepřesvědčivý výstup"
 tour_general.4004.a_diplomacy_nonconvinced.desc: "Nepodaří se ti přesvědčit [stop_host_scope.Custom('CZ_ShortUIName_A')]"
 tour_general.4004.a_diplomacy_snooping.t: "Slídící lenní pán"
 tour_general.4004.a_diplomacy_snooping.desc: "Přistihneš svého lenního pána při slídění po tvých državách"
 tour_general.4004.b: "Čekám tu přece #EMP na tebe#!..."
 tour_general.4006.t: "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip|U]: Opilecké intriky"
 tour_general.4006.desc: "Po celém dni, kdy mě [stop_host_scope.GetTitledFirstName] neúnavně provádí po [CZProvName(ROOT.Char.GetCurrentLocation,'L')], si konečně zasloužím večer bez [Select_CString(stop_host_scope.IsFemale,'ní','něj')]. Můj doprovod se proto uchýlí do místního hostince, kde si můžeme trochu odpočinout.\n\nPřejíždím pohledem po pestré společnosti opilců, když mě zaujme jedna obzvlášť zarudlá tvář. Patří někomu ze služebnictva [stop_host_scope.Custom('CZ_TitledFirstName_G')].\n\nNakloním se blíž a zaslechnu opilecké blábolení:\n\n„[stop_host_scope.GetTitleTierName|U]? O tom bych ti mohl vyprávět všelicos! A rozhodně ne málo...“"
 tour_general.4006.a: "Jen pokračuj..."
 tour_general.4006.a_success.t: "Zvýšená úspěšnost intriky"
 tour_general.4006.a_success.desc: "[servant_character.GetShortUIName|U] se s tebou podělí o zajímavé informace týkající se [4006_scheme_target.Custom('CZ_ShortUIName_G')]"
 tour_general.4006.a_secrecy.t: "Lepší utajení intriky"
 tour_general.4006.a_secrecy.desc: "[servant_character.GetShortUIName|U] ti prozradí informace o tajných cestách"
 tour_general.4006.b: "Ať někdo donese [Select_CString(servant_character.IsFemale,'téhle ženě','tomuhle muži')] další pití."
 tour_general.4006.b_super_success.t: "Výrazně zvýšená úspěšnost intriky"
 tour_general.4006.b_super_success.desc: "[servant_character.GetShortUIName|U] ti prozradí nesmírně cenné informace týkající se [4006_scheme_target.Custom('CZ_ShortUIName_G')]"
 tour_general.4006.b_super_secrecy.t: "Výrazně lepší utajení intriky"
 tour_general.4006.b_super_secrecy.desc: "[servant_character.GetShortUIName|U] ti prozradí informace o tajných chodbách"
 tour_general.4006.b_passout.t: "Opilecké bezvědomí"
 tour_general.4006.b_passout.desc: "[servant_character.GetShortUIName|U] vypije příliš mnoho alkoholu a upadne do bezvědomí"
 tour_general.4006.b_passout_tt: "Nezískáš žádné informace"
 tour_general.4007.t: "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip|U]: Podezřelé počínání"
 tour_general.4007.desc: "Právě vycházím z hostince, který mi [stop_host_scope.GetTitledFirstName] [Select_CString(stop_host_scope.IsFemale,'doporučila','doporučil')], a ocitám se v temné, opuštěné uličce. Z hlubin tmy se náhle ozve podivný zvuk.\n\nZvědavost mi nedá a tiše se vydám za jeho původem. V šeru zahlédnu jakousi postavu... [4007_secret_holder.GetTitledFirstName]? Co tu [4007_secret_holder.GetSheHe] v tak pozdní hodinu pohledává?\n\nMarně se snažím nepozorovaně zjistit, co se tu vlastně děje. Jedno je však jisté. [4007_secret_holder.GetTitledFirstNameNoTooltip|U] tu rozhodně neprovádí nic dobrého."
 tour_general.4007.a: "Kdybych se jen [Select_CString(ROOT.Char.IsFemale,'dokázala','dokázal')] připlížit o něco blíž..."
 tour_general.4007.a_secret.t: "Tajemství odhaleno"
 tour_general.4007.a_secret.desc: "Nenápadně se přiblížíš a zjistíš, co [4007_secret_holder.GetShortUIName] potají provádí"
 tour_general.4007.a_secret.tt: "Odhalíš tajemství [4007_secret_holder.Custom('CZ_ShortUIName_G')]"
 tour_general.4007.a_detected.t: "Odhalen při špehování"
 tour_general.4007.a_detected.desc: "[4007_secret_holder.GetShortUIName|U] tě přistihne při špehování"
 tour_general.4007.b: "Raději ne."
