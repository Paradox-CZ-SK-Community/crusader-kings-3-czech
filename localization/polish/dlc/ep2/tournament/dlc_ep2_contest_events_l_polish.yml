 contest_events.0805.a.winner: "[Select_CString(ROOT.Char.IsFemale,'Vyhrála','Vyhrál')|U] jsem! Váš [ROOT.Char.GetTitleAsNameNoTooltip|l] [Select_CString(ROOT.Char.IsFemale,'vyhrála','vyhrál')]!"
 contest_events.0805.a.marriage: "Vlastně dostaneš jen [contest_prize.Custom('CZ_ArtifactType_A')|l]."
