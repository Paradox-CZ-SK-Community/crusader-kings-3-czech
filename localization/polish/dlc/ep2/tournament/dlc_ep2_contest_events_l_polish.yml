l_polish:
 contest_events_opening_prize_desc: "„Vítěz získá [newly_created_artifact.Custom('CZ_ArtifactType_A')|l], dar od [Select_CString(host.IsFemale,'naší štědré hostitelky','našeho štědrého hostitele')], [host.Custom('CZ_TitledFirstName_G')]!“"
 contest_events_marriage_prize_desc: "„Vítěz získá ruku [marriage_prize.Custom('CZ_TitledFirstName_G')], jak rozhoduje [Select_CString(host.IsFemale,'naše štědrá hostitelka','náš štědrý hostitel')], [host.GetName]!“"
 contest_events_opening_intent_contestant: "[intent_scope.GetName|U] se také účastní soutěže."
 contest_events_opening_intent_contestant_team: "Všímám si, že [intent_scope.GetName] [Select_CString(intent_scope.IsFemale,'byla zařazena','byl zařazen')] do mého týmu..."
 contest_events_opening_intent_contestant_opposing: "Všímám si, že [intent_scope.GetName] [Select_CString(intent_scope.IsFemale,'byla zařazena','byl zařazen')] do soupeřova týmu..."
 contest_events_opening_intent_spectator: "\n\n[intent_scope.GetName|U] se soutěže neúčastní."
 contest_events_opening_intent_contestant_horse_race: "[intent_scope.GetName|U] také [Select_CString(intent_scope.IsFemale,'přihlásila','přihlásil')] svého koně. Je to [intent_scope.Custom('ContestHorseRaceGender')|l] jménem #EMP [intent_scope.Custom('GetContestHorseRaceName')]#!."
 contest_events_closing_win_winner: "\n\n[Select_CString(ROOT.Char.IsFemale,'Prokázala','Prokázal')|U] jsem své kvality nade vši pochybnost!"
 contest_events_closing_win_contestant: "\n\nMusím se více snažit, pokud chci v tomto turnaji zvítězit!"
 tournament_events_murder_sabotage_contest_tt: "V nadcházející soutěži bude snazší „náhodou“ zabít [murder_target.Custom('CZ_FirstName_A')]"
 contest_events_closing_marriage_valid_host_only: "\n\nPodivnou hříčkou osudu a díky nepopiratelnému umu jsem jedinou vhodnou volbou pro sňatek. [host.Custom('GetBrideGroom')|U] budu já..."
 contest_events_closing_marriage_valid: "Je na mně, zda dodržím slovo..."
 contest_events_closing_marriage_wedding_host: "\n\n„V souladu s vlastním rozhodnutím si vítěz soutěže, [host.GetTitledFirstNameNoTooltip], [Select_CString(host.IsFemale,'vzala','vzal')] za manželku či manžela [marriage_prize.Custom('CZ_FirstName_A')]. Je to [host.Custom2('RelationToMeShort', marriage_prize)|l]!“"
 contest_events_closing_marriage_wedding: "\n\n„Jak bylo slíbeno, [host.GetTitledFirstNameNoTooltip] [Select_CString(host.IsFemale,'dala','dal')] [marriage_winner.Custom('CZ_FirstNameNoTooltip_D')] ruku [marriage_prize.Custom('CZ_FirstName_G')]. Je to [host.Custom2('RelationToMeShort', marriage_prize)|l]!“"
 contest_events_closing_marriage_betrothal_host: "\n\n„V souladu s vlastním rozhodnutím se vítěz soutěže, [host.GetTitledFirstNameNoTooltip], [Select_CString(host.IsFemale,'zasnoubila','zasnoubil')] s [marriage_prize.Custom('CZ_FirstName_I')]. Je to [host.Custom2('RelationToMeShort', marriage_prize)|l]!“"
 contest_events_closing_marriage_betrothal: "\n\n„Jak bylo slíbeno, [host.GetTitledFirstNameNoTooltip] [Select_CString(host.IsFemale,'nabídla','nabídl')] [marriage_winner.Custom('CZ_FirstNameNoTooltip_D')] zasnoubení s [marriage_prize.Custom('CZ_FirstName_I')]. Je to [host.Custom2('RelationToMe', marriage_prize)|l]!“"
 contest_events_closing_marriage_reneged_winner: "\n\n„[host.GetTitledFirstNameNoTooltip|U] [Select_CString(host.IsFemale,'hanebně odmítla','hanebně odmítl')] dodržet slib a darovat jako cenu ruku [marriage_prize.Custom('CZ_FirstName_G')]. Je to [host.Custom2('RelationToMe', marriage_prize)|l]! To lze chápat jedině jako urážku vítězů!“"
 contest_events_closing_marriage_invalid_slots: "$contest_events_closing_marriage_invalid$ Koneckonců, [Select_CString(contest_winner.IsFemale,'žádná žena','žádný muž')] nepotřebuje neomezený počet partnerů."
 contest_events_closing_marriage_invalid_family: "$contest_events_closing_marriage_invalid$ Nebylo by vhodné, aby si [Select_CString(marriage_prize.IsFemale,'žena','muž')] [Select_CString(marriage_prize.IsFemale,'vzala','vzal')] vlastní příbuzenstvo. Vždyť jde o vztah [marriage_prize.Custom2('RelationToMeShort', contest_winner)|l]."
 contest_events_closing_marriage_invalid: "\n\nZdá se, že osud nepřeje slíbenému sňatku s [marriage_prize.Custom('CZ_FirstName_I')]. Je to [host.Custom2('RelationToMeShort', marriage_prize)|l] [host.Custom('CZ_TitledFirstName_G')]."
 contest_events_closing_marriage_host_refused: "\n\nJedinou vhodnou volbou pro sňatek [Select_CString(host.IsFemale,'byla sama','byl sám')] [host.GetTitledFirstName], ale [Select_CString(host.IsFemale,'rozhodla','rozhodl')] se sňatek neuzavřít. [host.Custom2('RelationToMeShort', marriage_prize)|U] [Select_CString(host.IsFemale,'její','jeho')] chotí nebude."
 contest_events_closing_marriage_host: "Podivnou hříčkou osudu a díky nepopiratelnému umu se ocitám mezi vítězi způsobilými ke sňatku..."
 contest_events_closing_marriage_three: "[bachelor_1.GetFullName|U], [bachelor_2.GetFullName] a [bachelor_3.GetFullName] touží po sňatku a všichni si právem odnášejí vítězství."
 contest_events_closing_marriage_two: "[bachelor_1.GetFullName|U] a [bachelor_2.GetFullName] přicházejí v úvahu jako možné protějšky. Právem si odnášejí vítězství."
 contest_events_closing_marriage_one: "Zdá se, že jedinou vhodnou volbou pro sňatek je [bachelor_1.GetFullName]."
 contest_events_closing_marriage_none: "Žádný z vítězů však stejně nesplňuje podmínky pro sňatek..."
 every_tournament_attendee_tt: "Každý návštěvník turnaje"
 contest_events.0500.t: "[activity.GetCurrentPhase.GetPhase.GetName|U]: Soutěž začíná"
 contest_events.0500.horse_race: "Nejlepší koně z [host.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')], v barvách svých majitelů, jsou předváděni kolem závodiště [activity.Custom('ContestHorseRaceTrack')|l], zatímco herold oznamuje začátek soutěže. Jezdci se shlukují a čekají na svá zvířata. Někteří se protahují, jiní si měří soupeře pohledem.\n\n"
 contest_events.0500.contestant_horse: "Můj nejrychlejší kůň, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!, neunikl pozornosti chovatelů a sázkařů.\n\n"
 contest_events.0500.closing: "Dobrému závodu se nic nevyrovná."
 mysterious_stranger_horse_race: "Zdá se, že [mysterious_stranger.Custom('ContestHorseRaceGender')|l] jménem #EMP [mysterious_stranger.Custom('GetContestHorseRaceName')]#!, patřící [mysterious_stranger.Custom('CZ_FullName_D')], přitahuje pozornost mnohých. Málokdo by v takovém koni hledal vážného soupeře.\n\n"
 contest_events.0500.a.contestant: "Bude to pořádný závod."
 contest_events.0500.a: "Jaká podívaná."
 contest_events.0500.b: "Musím vsadit..."
 contest_events.0500.c: "Můj kůň #EMP bude#! přihlášen!"
 contest_events.0500.d: "Kůň [rival_contestant.Custom('CZ_TitledFirstNameNoTooltip_G')] #EMP nepoběží#!."
 contest_events.0500.e: "Musí existovat způsob, jak dostat mého koně do toho závodu..."
 contest_events_place_wager_tt: "Vsaď [gold_i][Concept('gold','zlato')|E] na vítěze [Concept('contest','soutěže')|E] [activity.GetCurrentPhase.GetPhase.GetName|l]"
 contest_events.0505.t: "Vítěz soutěže"
 contest_events.0505.t.horse_race: "$tournament_phase_horse_race$: $contest_events.0505.t$"
 contest_events.0505.horse_race: "[Select_CString(contest_winner.IsLocalPlayer,Concatenate(contest_winner.Custom('CZ_ShortUINamePossessiveNoFormat'),' kůň'),Concatenate('kůň ',contest_winner.Custom('CZ_ShortUINamePossessiveNoFormat')))|U], #EMP [contest_winner.Custom('GetContestHorseRaceName')|U]#!, protíná cílovou čáru a dav propuká v jásot. V těsném závěsu dobíhá [Select_CString(second_place.IsLocalPlayer,Concatenate(second_place.Custom('CZ_ShortUINamePossessiveNoFormat'),' kůň'),Concatenate('kůň ',second_place.Custom('CZ_ShortUINamePossessiveNoFormat')))], #EMP [second_place.Custom('GetContestHorseRaceName')|U]#!, a [Select_CString(third_place.IsLocalPlayer,Concatenate(third_place.Custom('CZ_ShortUINamePossessiveNoFormat'),' kůň'),Concatenate('kůň ',third_place.Custom('CZ_ShortUINamePossessiveNoFormat')))], #EMP [third_place.Custom('GetContestHorseRaceName')|U]#!!\n\n"
 contest_events.0505.first_horse: "Ano, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')|U]#!! To je krása! [ROOT.Char.Custom('ContestHorseRaceGender')|U] k pohledání!"
 contest_events.0505.first_maydan: "Ano, můj #EMP Sabiq#!! To je krása! [ROOT.Char.Custom('ContestHorseRaceGender')|U] k pohledání!!"
 contest_events.0505.second_horse: "Tak blízko, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!..."
 contest_events.0505.second_maydan: "Tak blízko, můj #EMP Mutabarriz#!, tak blízko..."
 contest_events.0505.third_horse: "Třetí místo... Dobrá práce, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!, z těch nejlepších míst na tebe zbylo to nejhorší..."
 contest_events.0505.third_maydan: "#EMP Mujalli#!... Věř mi, [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] bych být spokojenější..."
 contest_events.0505.contestant_horse: "#EMP [ROOT.Char.Custom('GetContestHorseRaceName')|U]#! se ani nedostane na stupně vítězů. Příště se musím lépe připravit!"
 contest_events.0505.spectator: "Vzrušující zážitek!"
 contest_events.0505.a.winner: "Já, váš [ROOT.Char.GetTitleAsNameNoTooltip|l], jsem [Select_CString(ROOT.Char.IsFemale,'zvítězila','zvítězil')]!"
 contest_events.0505.a.marriage: "Myslím, že taková cena ujde."
 contest_events.0505.a: "Dobrá práce, [contest_winner.Custom('CZ_TitledFirstNameNoTooltip_V')]."
 contest_events.0505.b: "[ROOT.Char.GetIntentTarget.Custom('CZ_TitledFirstNameNoTooltip_V')|U], [Select_CString(ROOT.Char.IsFemale,'vyhrála','vyhrál')] jsem pro tebe!"
 contest_events.0505.c.winner: "Zdá se, že se vezmeme, [marriage_prize.Custom('CZ_FirstNameNoTooltip_V')]."
 contest_events.0505.c: "Dobrá práce, ruka [marriage_prize.Custom('CZ_TitledFirstNameNoTooltip_G')] je tvá."
 contest_events.0505.d.winner: "[Select_CString(ROOT.Char.IsFemale,'Vyhrála','Vyhrál')|U] jsem! Já jsem #EMP doopravdy#! [Select_CString(ROOT.Char.IsFemale,'vyhrála','vyhrál')]!"
 contest_events.0505.d.second: "Tak blízko..."
 contest_events.0505.d.loser: "Snad příště..."
 contest_events.0505.d: "Štěstěna musí stát na [Select_CString(contest_winner.IsFemale,'její','jeho')] straně."
 contest_events.0510.t: "$tournament_contest_header$ Poslední kolo"
 contest_events.0510.desc: "Koně dál s dusotem krouží po trati a zbývající jezdci škubají otěžemi, aby je pobídli k ještě větší rychlosti. Ten závod byl už teď plný zvratů, pomyslím si a vzpomínám, jak"
 contest_events.0510.flavor_1: "můj jezdec spadl ze sedla, ale vzpamatoval se a zase naskočil do sedla.\n\n"
 contest_events.0510.flavor_2: "jsem bez zábran [Select_CString(ROOT.Char.IsFemale,'povzbuzovala','povzbuzoval')] svého jezdce.\n\n"
 contest_events.0510.flavor_3: "dva jezdci a jejich koně se srazili.\n\n"
 contest_events.0510.flavor_4: "se dav málem pustil do výtržností.\n\n"
 contest_events.0510.flavor_5: "můj jezdec se prohnal vnitřkem tratě a získal obrovskou výhodu.\n\n"
 contest_events.0510.flavor_6: "hromadný pád koní naráz vyřadil tři jezdce.\n\n"
 contest_events.0510.flavor_7: "do mého koně vrazilo soupeřovo zvíře.\n\n"
 contest_events.0510.flavor_8: "všichni diváci byli okouzleni krásným žokejem.\n\n"
 contest_events.0510.flavor_9: "na trať vběhl nahý prostý člověk.\n\n"
 contest_events.0510.flavor_fallback: "Zbývá už jen jedno kolo! Nakláním se přes okraj ochozu a křičím na svého jezdce, když peloton projíždí."
 contest_events.0510.a: "„Připlatím ti, když vyhraješ!“"
 contest_events.0510.b: "„Udeř je! Do obličeje!“"
 contest_events.0510.c: "„Chyť jejich otěže!“"
 contest_events.0510.d: "„Jeď! #EMP Rychleji!#!“"
 contest_events.0530.t: "$tournament_contest_header$ Každý kůň má svou trať"
 contest_events.0530.pivotal_success: "Taktika mého jezdce zabrala! Můj kůň vyráží vpřed a vybíhá z poslední zatáčky na cílovou rovinku. Už jen pár okamžiků...\n\n"
 contest_events.0530.pivotal_neutral: "Těžko říct, zda moje rada něco změnila. Všichni koně vybíhají z poslední zatáčky na cílovou rovinku v jednom chumlu.\n\n"
 contest_events.0530.pivotal_failure: "Můj pokřik jezdce překvapí a vyvede z rovnováhy. Zavrávorá a málem spadne. Můj kůň trochu ztrácí, když vybíhá z poslední zatáčky na cílovou rovinku. Tohle bude těsné...\n\n"
 contest_events.0530.ptv_close: "Téměř nelze odhadnout, kdo zvítězí. Běží bok po boku!"
 contest_events.0530.ptv_top: "Můj kůň se trhá od pronásledující skupiny! Pokud udrží náskok před soupeři, vyhrajeme!"
 contest_events.0530.ptv_top_spectator: "[pivotal_contestant.Custom('CZ_FirstNamePossessive_M')|U] kůň se trhá od ostatních! Teď už to stačí jen dotáhnout do cíle!"
 contest_events.0530.ptv_bottom: "Můj kůň je beznadějně poslední a já cítím, jak mi vítězství proklouzává mezi prsty. Potřebujeme něco, #EMP cokoli#!..."
 contest_events.0530.ptv_bottom_spectator: "[pivotal_contestant.Custom('CZ_FirstNamePossessive_M')|U] kůň vypadá téměř poraženě. [Select_CString(pivotal_contestant.IsFemale,'Jeho majitelka','Jeho majitel')|U] potřebuje něco, #EMP cokoli#!..."
 contest_events.0530.ptv_top_half: "Můj kůň se drží v přední skupině, ale je to těsné. K vítězství stačí ještě trochu zabrat!"
 contest_events.0530.ptv_top_half_spectator: "[pivotal_contestant.Custom('CZ_FirstNamePossessive_M')|U] kůň je v první polovině pole, ale je to těsné. Sláva je stále na dosah."
 contest_events.0530.ptv_bottom_half: "Můj kůň nemá ve druhé skupině kudy proběhnout, ale vítězství ještě není ztracené. Pokud můj jezdec najde trochu místa, možná ještě dokážeme vyrazit za vítězstvím..."
 contest_events.0530.ptv_bottom_half_spectator: "[pivotal_contestant.Custom('CZ_FirstNamePossessive_M')|U] kůň uvízl vzadu, ale ještě není konec. Jediný manévr by mohl všechno změnit..."
 contest_events.0530.ptv_fallback: "Závod se nezadržitelně blíží ke konci. Koně snad natahují krky, aby dosáhli cílové čáry."
 contest_events.0530.spectator: "\n\nZe cválajících koní stříká pot, když vybíhají z poslední zatáčky. Jezdci je pobízejí ochraptělými hlasy a dav huláká a křičí."
 contest_events.0530.final: "\n\nŘev davu sílí. Jezdci jako jeden muž pobízejí své oře. Cílová čára se blíží."
 contest_events.0530.a: "Ještě zabrat!"
 contest_events.0530.b: "Už jen kousek!"
 contest_events.0520.t: "Válečný kůň"
 contest_events.0520.desc: "Dostih se blíží a už několik dní mi vrtá hlavou, že místo svého dostihového koně, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!, přihlásím svého válečného oře, #EMP [ROOT.Char.Custom('WarhorseStoryName')]#!.\n\nV sedle sice nebudu [Select_CString(ROOT.Char.IsFemale,'sedět sama','sedět sám')], ale o bojovného ducha nebude nouze..."
 contest_events.0520.a: "#EMP [ROOT.Char.Custom('WarhorseStoryName')|U]#! mě nezklame."
 contest_events.0520.b: "Ne, válečný oř patří na bojiště."
 contest_horse_race_enter_war_horse_tt: "Přihlaš svého válečného koně do dostihu"
 contest_events.0600.t: "[activity.GetCurrentPhase.GetPhase.GetName|U]: Soutěž začíná"
 contest_events.0600.melee: "Oba týmy stojí zřetelně oddělené proti sobě. Při přípravě výstroje na sebe pokřikují a šeptem si sdělují plány. V pozadí se připravují koně, váleční oři řehtají a odfrkují. Dnes nás čeká pořádná řež.\n\n"
 contest_events.0600.contestant: "Můj tým tu bandu chvástalů pod vedením [other_team_captain.Custom('CZ_TitledFirstName_G')] určitě porazí!\n\n"
 contest_events.0600.champion_self: "[Select_CString(contest_champion.IsFemale,'Má šampionka','Můj šampion')|U], [contest_champion.GetFirstName], a já ukážeme [other_team_captain.Custom('CZ_TitledFirstName_D')], zač je toho loket!\n\n"
 contest_events.0600.champion: "[Select_CString(contest_champion.IsFemale,'Má šampionka','Můj šampion')|U], [contest_champion.GetFirstName], ukáže [other_team_captain.Custom('CZ_TitledFirstName_D')], zač je toho loket!\n\n"
 contest_events.0600.neither_qualify: "Ani mně, ani [Select_CString(contest_champion.IsFemale,'mé šampionce','mému šampionovi')], [contest_champion.Custom('CZ_FirstName_D')], se nepodařilo kvalifikovat."
 contest_events.0600.champion_qualify: "[Select_CString(contest_champion.IsFemale,'Má šampionka','Můj šampion')|U], [contest_champion.GetFirstName], se tentokrát [Select_CString(contest_champion.IsFemale,'nekvalifikovala','nekvalifikoval')]."
 contest_events.0600.self_qualify: "Přistupuji k rozhodčím, abych si [Select_CString(ROOT.Char.IsFemale,'potvrdila','potvrdil')] své místo, ale odmítají mě: tentokrát jsem se [Select_CString(ROOT.Char.IsFemale,'nekvalifikovala','nekvalifikoval')]."
 contest_events.0600.closing: "To bude zajímavé."
 contest_events.0600.a: "Na kolbiště!"
 contest_events.0600.a.contestant: "Sláva bude naše!"
 contest_events.0600.captains_tt: "Díky [Concept('rank','hodnosti')|E] a zkušenostem přebírají velení týmů tyto osoby: [my_team_captain.GetShortUIName] a [other_team_captain.GetShortUIName]"
 contest_events.0600.team_tt: "Jsi v týmu [my_team_captain.Custom('CZ_ShortUIName_G')]"
 contest_events.0605.t.melee: "$tournament_phase_melee$: $contest_events.0605.t$"
 contest_events.0605.t: "Vítězové soutěže"
 contest_events.0605.desc: "Zní trubky, dav bouří a soutěžící se začínají shromažďovat. Soutěž skončila a jeden tým se chystá užít si svou chvíli slávy. Vystupuje herold a jeho hlas se rozléhá po celém kolbišti.\n\n„Po mnoha zkouškách, několika útrapách a především po opravdu urputném zápolení známe vítěze: tým [contest_winner.Custom('CZ_TitledFirstName_G')] porazil tým [second_place.Custom('CZ_TitledFirstName_G')]!“\n\n"
 contest_events.0605.desc.winner: "Dobrá práce, všichni! Je čas slavit!"
 contest_events.0605.desc.loser: "Tentokrát jsem [Select_CString(ROOT.Char.IsFemale,'nedovedla','nedovedl')] svůj tým k vítězství..."
 contest_events.0605.desc.team_winner: "Dobrá hra! Vítězství chutná nejsladčeji!"
 contest_events.0605.desc.team_loser: "No nic... příště zkrátka musíme víc trénovat..."
 contest_events.0605.desc.spectator: "Vzrušující sport i z pohledu diváka!"
 contest_events.0605.a.host_winner: "[ROOT.Char.GetTitleAsNameNoTooltip|U] je [Select_CString(ROOT.Char.IsFemale,'neporazitelná','neporazitelný')]!"
 contest_events.0605.a.host_loser: "Ani [ROOT.Char.GetTitleAsNameNoTooltip|l] nemůže vyhrát pokaždé..."
 contest_events.0605.a.winner: "Dokázali jsme to. Vyhráli jsme!"
 contest_events.0605.a.loser: "Příště vás dostaneme!"
 contest_events.0605.a: "To je ale chaotický sport."
 contest_events.0610.t: "$tournament_contest_header$ Do víru boje"
 contest_events.0610.desc: "Stíny se prodlužují a boj stále zuří. Vřava však slábne, jak z ní odkulhávají další soutěžící. Obracím koně a vzpomínám na to, co se dosud událo. Třeba jak"
 contest_events.0610.flavor_1: "jsem [Select_CString(ROOT.Char.IsFemale,'ztratila','ztratil')] nervy a [Select_CString(ROOT.Char.IsFemale,'zmlátila','zmlátil')] jiného soutěžícího do krve.\n\n"
 contest_events.0610.flavor_2: "starostu místního sídla rozzuřilo, že se rvačka přenesla do jeho ulic.\n\n"
 contest_events.0610.flavor_3: "mi vyrazili zbraň z ruky a já se po ní musím sápat.\n\n"
 contest_events.0610.flavor_4: "do bitevní vřavy zabloudila okouzlující ztracená duše.\n\n"
 contest_events.0610.flavor_5: "jsem [Select_CString(ROOT.Char.IsFemale,'získala','získal')] nárok na pořádné výkupné!\n\n"
 contest_events.0610.flavor_6: "jsem si [Select_CString(ROOT.Char.IsFemale,'potřebovala','potřeboval')] odpočinout a na chvíli se [Select_CString(ROOT.Char.IsFemale,'uchýlila','uchýlil')] do úkrytu.\n\n"
 contest_events.0610.flavor_7: "jsem [Select_CString(ROOT.Char.IsFemale,'čelila','čelil')] slavnému válečníkovi a [Select_CString(ROOT.Char.IsFemale,'přežila','přežil')] to.\n\n"
 contest_events.0610.flavor_8: "jsem se [Select_CString(ROOT.Char.IsFemale,'ukryla','ukryl')] mezi stromy a [Select_CString(ROOT.Char.IsFemale,'nastražila','nastražil')] léčku na nic netušící kolemjdoucí.\n\n"
 contest_events.0610.flavor_9: "jsem [Select_CString(ROOT.Char.IsFemale,'cválala','cválal')] bitevní vřavou a [Select_CString(ROOT.Char.IsFemale,'sledovala','sledoval')], jak ostatní padají ze sedel.\n\n"
 contest_events.0610.flavor_10: "jsem [Select_CString(ROOT.Char.IsFemale,'objevila','objevil')] tajemného rytíře, který si s mimořádným umem razil cestu bojem.\n\n"
 contest_events.0610.flavor_11: "mě tři soupeřící rytíři zahnali do kouta.\n\n"
 contest_events.0610.flavor_12: "jsem [Select_CString(ROOT.Char.IsFemale,'zachránila','zachránil')] člena rodu z nebezpečné situace.\n\n"
 contest_events.0610.flavor_fallback: "Je zřejmé, že se vše schyluje k rozhodujícímu střetu. Unavené šiky se opět formují. Právě teď mám šanci vtisknout této soutěži vlastní pečeť."
 contest_events.0610.a: "Vybojuji vítězství jako pravý voják!"
 contest_events.0610.b: "„Za mnou! K vítězství!“"
 contest_events.0610.c: "Možná, pokud je sem vylákáme..."
 contest_events.0610.d: "Možná bychom to měli prostě přečkat?"
 contest_events.0610.d.tt: "Kostky jsou vrženy, už do toho nebudu zasahovat."
 contest_events.0620.t: "$tournament_contest_header$ Závěrečné údery"
 contest_events.0620.pivotal_success: "Ten manévr zasadil soupeři drtivou ránu! Boj se obrací ve prospěch mého týmu. Zatímco přemáháme nepřátelské křídlo, několik jezdců proráží a uhání k soupeřovu táboru. Nezbývá než doufat, že tam dorazí dřív, než se totéž stane nám.\n\n"
 contest_events.0620.pivotal_neutral: "Těžko říct, nakolik můj poslední tah něco změnil. Rozhodně jsme kvůli němu neztratili půdu pod nohama, ale zuřivý boj zůstává stejně nerozhodný jako předtím.\n\n"
 contest_events.0620.pivotal_failure: "Ze všech mých strategií tahle rozhodně nepatřila k nejlepším. Naši situaci bych sice [Select_CString(ROOT.Char.IsFemale,'neoznačila','neoznačil')] za naprostou katastrofu, ale soupeř proráží náš střed a uhání k nechráněnému táboru. To by našim nadějím mohlo odzvonit.\n\n"
 contest_events.0620.ptv_close: "Je téměř nemožné určit, která strana má blíž k vítězství. Pořád je všechno otevřené."
 contest_events.0620.ptv_close_spectator: "Oba týmy jsou téměř vyrovnané! O vítězství rozhodne vlásek."
 contest_events.0620.ptv_top: "Můj tým je zjevně v lepší kondici! Vítězství je tak blízko, že ho cítím na jazyku!"
 contest_events.0620.ptv_top_spectator: "[pivotal_contestant.Custom('CZ_FirstNamePossessive_M')|U] tým má jasnou převahu! Teď už to stačí jen dotáhnout do konce!"
 contest_events.0620.ptv_bottom: "Můj tým prohrává, a to jasně. Cítím, jak se vítězství pomalu, ale jistě vzdaluje. Odtud by cesta k vítězství vyžadovala ohromné úsilí..."
 contest_events.0620.ptv_bottom_spectator: "[pivotal_contestant.Custom('CZ_FirstNamePossessive_M')|U] tým je zbitý a téměř poražený. K vítězství by teď bylo potřeba ohromné úsilí..."
 contest_events.0620.ptv_top_half: "Můj tým vyhrává, ale je to těsné. Musíme jen vydržet!"
 contest_events.0620.ptv_top_half_spectator: "[pivotal_contestant.Custom('CZ_FirstNamePossessive_M')|U] tým získává mírný náskok, ale je to těsné. Sláva je stále na dosah."
 contest_events.0620.ptv_bottom_half: "Prohráváme, ale vítězství ještě není ztracené. Ještě naposledy zabrat!"
 contest_events.0620.ptv_bottom_half_spectator: "[pivotal_contestant.Custom('CZ_FirstNamePossessive_M')|U] tým prohrává, ale ještě není konec. Jediný manévr by mohl všechno změnit..."
 contest_events.0620.ptv_fallback: "Boj zuří dál a rozhodnutí je stále blíž."
 contest_events.0620.spectator: "\n\nVzduchem se dál rozléhá rytmické řinčení kovu o kov. Diváci roztroušení po vzdálených okrajích bojiště povzbuzují své favority, zatímco čím dál více soutěžících padá do zajetí a musí platit výkupné."
 contest_events.0620.final: "\n\nVidím, jak na kolbiště vstupují heroldi, aby ohlásili konec soutěže. Závěr se blíží."
 contest_events.0620.a: "Ještě zabrat!"
 contest_events.0620.b: "Už jen chvilku!"
 contest_events.0700.t: "[activity.GetCurrentPhase.GetPhase.GetName|U]: Soutěž začíná"
 contest_events.0700.archery: "Pestrý zástup soutěžících postává u terčů, porovnává luky a vyměňuje si historky o svých nejlepších zásazích. Vrzání luků a drnčení tětiv se nese do dálky a protíná všeobecný ruch. Nehybným vzduchem se line vůně pryskyřice.\n\n"
 contest_events.0700.recital: "Soutěžící postávají kolem hlavního stanu, rozezpívávají se a opakují si sloky, zatímco dav zaplňuje amfiteátr.\n\n"
 contest_events.0700.contestant: "Zbystřím, když mi vánek přinese zvuk vlastního jména. To může být dobré znamení, ale i špatné..."
 contest_events.0700.champion: "Možná mi [Select_CString(contest_champion.IsFemale,'má šampionka','můj šampion')], [contest_champion.GetName], udělá čest.\n\n"
 contest_events.0700.closing: "Ať vyhraje nejlepší!"
 contest_events.0700.a: "Zajímá mě, kdo vyhraje!"
 contest_events.0700.a.contestant: "Je čas ukázat světu své umění."
 contest_events.0700.b: "Musím vsadit..."
 contest_events.0700.c: "Své vlastní soutěže se #EMP zúčastním#!."
 contest_events.0700.d: "[rival_contestant.GetTitledFirstNameNoTooltip|U] se soutěže nemůže účastnit."
 contest_events.0700.e: "Kdybych tak [Select_CString(ROOT.Char.IsFemale,'našla','našel')] někoho, s kým si promluvit..."
 mysterious_stranger_archery: "Zdá se, že od chvíle, kdy si [Select_CString(mysterious_stranger.IsFemale,'neznámá žena','neznámý muž')] z lidu jménem [mysterious_stranger.GetFirstName] [Select_CString(mysterious_stranger.IsFemale,'vyzkoušela','vyzkoušel')] střelbu na terče, se [CZPrepV(activity.GetCurrentPhase.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(activity.GetCurrentPhase.GetLocation,'L')] o ničem jiném nemluví.\n\n"
 mysterious_stranger_recital: "[Select_CString(mysterious_stranger.IsFemale,'Nově příchozí žena','Nově příchozí muž')|U] jménem [mysterious_stranger.GetFirstName], dosud neznámá tvář mezi básníky a bardy z [host.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')], letos budí velkou pozornost.\n\n"
 contest_events.0705.t.recital: "$tournament_phase_recital$: $contest_events.0505.t$"
 contest_events.0705.t.archery: "$tournament_phase_archery$: $contest_events.0505.t$"
 contest_events.0705.desc: "Zní trubky, dav bouří a soutěžící se začínají shromažďovat. Soutěž skončila a někdo se chystá užít si svou chvíli slávy. Vystupuje herold a jeho hlas se rozléhá po celém kolbišti.\n\n„Po mnoha zkouškách, několika útrapách a především po opravdu urputném zápolení známe nejlepší trojici. Na třetím místě se umisťuje [Select_CString(third_place.IsFemale,'odvážná','odvážný')] [third_place.GetTitledFirstName]. Těsně na druhém místě končí [second_place.GetTitledFirstName]! A tím nám samozřejmě zbývá vítěz soutěže, [contest_winner.GetTitledFirstName]!“\n\n"
 contest_events.0705.first: "[Select_CString(ROOT.Char.IsFemale,'Věděla','Věděl')|U] jsem, že dokážu vyhrát!"
 contest_events.0705.second: "Druhé místo, asi si nemohu stěžovat."
 contest_events.0705.third: "Ach, ze všech vítězů mám k vítězství nejdál..."
 contest_events.0705.contestant: "Ukážu jim to... příště."
 contest_events.0705.spectator: "Velmi zábavná ukázka dovedností!"
 contest_events.0705.first_champion: "Nikdo nedokáže porazit [contest_champion.Custom('CZ_TitledFirstName_A')]!"
 contest_events.0705.second_champion: "[contest_champion.GetTitledFirstName|U] mi [Select_CString(contest_champion.IsFemale,'udělala','udělal')] čest."
 contest_events.0705.third_champion: "Vítězství to není, ale [contest_champion.GetTitledFirstName] k němu [Select_CString(contest_champion.IsFemale,'měla','měl')] aspoň blízko..."
 contest_events.0705.contestant_champion: "[Select_CString(contest_champion.IsFemale,'Má šampionka','Můj šampion')|U], [contest_champion.GetTitledFirstName], se [Select_CString(contest_champion.IsFemale,'nedokázala','nedokázal')] umístit mezi nejlepší trojicí..."
 contest_events.0705.spectator_champion: "[Select_CString(contest_champion.IsFemale,'Má šampionka','Můj šampion')|U], [contest_champion.GetTitledFirstName], se soutěže [Select_CString(contest_champion.IsFemale,'nezúčastnila','nezúčastnil')]."
 contest_events.0705.a.winner: "Ano! Váš [ROOT.Char.GetTitleAsNameNoTooltip|l] vítězí!"
 contest_events.0705.a.marriage: "[Select_CString(ROOT.Char.IsFemale,'Rozmyslela','Rozmyslel')|U] jsem si to, dostaneš jen cenu."
 contest_events.0705.a: "Dobrá práce, [contest_winner.Custom('CZ_TitledFirstNameNoTooltip_V')]."
 contest_events.0705.b: "Všechno jsem to [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')] pro [ROOT.Char.GetIntentTarget.Custom('CZ_TitledFirstNameNoTooltip_A')]!"
 contest_events.0705.c.winner: "Zdá se, že se vezmeme, [marriage_prize.Custom('CZ_FirstNameNoTooltip_V')]."
 contest_events.0705.c: "Dobrá práce, ruka [marriage_prize.Custom('CZ_TitledFirstNameNoTooltip_G')] je tvá."
 contest_events.0705.d.winner: "[Select_CString(ROOT.Char.IsFemale,'Vyhrála','Vyhrál')|U] jsem! Já jsem #EMP doopravdy#! [Select_CString(ROOT.Char.IsFemale,'vyhrála','vyhrál')]!"
 contest_events.0705.d.second: "Tak blízko..."
 contest_events.0705.d.loser: "Snad příště..."
 contest_events.0705.d: "[Select_CString(contest_winner.IsFemale,'Vyhrála ta nejlepší žena','Vyhrál ten nejlepší muž')|U]."
 contest_events.0710.t: "$tournament_contest_header$ Přesná muška"
 contest_events.0710.desc: "Soumrak se pomalu, ale jistě snáší na pokračující soutěž a drnčení tětiv udává úsečný rytmus. Opírám se o luk a přemítám nad dosavadním průběhem soutěže. Třeba jak"
 contest_events.0710.flavor_1: "kdosi ze soupeřů udělal scénu kvůli hluku během svého kola.\n\n"
 contest_events.0710.flavor_2: "diváka nešťastnou náhodou zasáhl šíp.\n\n"
 contest_events.0710.flavor_3: "jsem [Select_CString(ROOT.Char.IsFemale,'vyslala','vyslal')] šíp přímo do středu terče.\n\n"
 contest_events.0710.flavor_4: "jsem [Select_CString(ROOT.Char.IsFemale,'vyslala','vyslal')] šíp, který se stočil a dopadl před terčem.\n\n"
 contest_events.0710.flavor_5: "na akci dorazil tajemný cizinec, což vyvolalo spoustu zvěstí.\n\n"
 contest_events.0710.flavor_6: "vítr zesílil a donutil mě improvizovat.\n\n"
 contest_events.0710.flavor_7: "jsem se uprostřed soutěže [Select_CString(ROOT.Char.IsFemale,'začala','začal')] nudit a [Select_CString(ROOT.Char.IsFemale,'váhala','váhal')], zda nevyvést nějakou neplechu.\n\n"
 contest_events.0710.flavor_8: "[Select_CString(ROOT.Char.IsFemale,'rozhodla','rozhodl')|U] jsem se, že soutěž potřebuje trochu oživit.\n\n"
 contest_events.0710.flavor_9: "se šíp odchýlil od dráhy k terči a zasáhl jiného soutěžícího.\n\n"
 contest_events.0710.flavor_fallback: "Soutěž se chýlí ke konci a šípy dál létají do terčů i vedle nich. Pokud chci ještě nějak ovlivnit výsledek, musím jednat teď."
 contest_events.0710.a: "S lukem jsem jedno tělo!"
 contest_events.0710.b: "„Opatřit si“ lepší šíp by mi poskytlo výhodu..."
 contest_events.0710.c: "Při tomhle větru by měla stačit tahle dráha letu."
 contest_events.0710.d: "Poslední výstřel asi provedu jako obvykle."
 contest_events.0711.t: "$tournament_contest_header$ Moudrému stačí slovo"
 contest_events.0711.desc: "Na kolbiště padá noc, ale pokračující soutěž osvětlují pochodně. Tiše si mumlám a procvičuji rty na další kolo. Přitom vzpomínám, co se dosud událo. Třeba jak"
 contest_events.0711.flavor_1: "kdosi ze soupeřů přednesl verše podezřele podobné mým těsně předtím, než jsem [Select_CString(ROOT.Char.IsFemale,'vystoupila','vystoupil')] na pódium.\n\n"
 contest_events.0711.flavor_2: "kdosi ze soupeřů okopíroval známé verše.\n\n"
 contest_events.0711.flavor_3: "jsem se [Select_CString(ROOT.Char.IsFemale,'musela','musel')] vypořádat se záchvatem trémy.\n\n"
 contest_events.0711.flavor_4: "se spustil liják a promočil soutěžící i diváky.\n\n"
 contest_events.0711.flavor_5: "jsem [Select_CString(ROOT.Char.IsFemale,'spatřila','spatřil')] příležitost urazit soupeře veršem.\n\n"
 contest_events.0711.flavor_6: "kdosi ze soupeřů pošpinil mou čest a já [Select_CString(ROOT.Char.IsFemale,'musela','musel')] odpovědět stejnou mincí.\n\n"
 contest_events.0711.flavor_7: "mé verše sklidily takový úspěch, že jsem [Select_CString(ROOT.Char.IsFemale,'musela','musel')] hned přidat další.\n\n"
 contest_events.0711.flavor_8: "mé verše dopadly tak bídně, že jsem je [Select_CString(ROOT.Char.IsFemale,'musela','musel')] hned napravit dalšími.\n\n"
 contest_events.0711.flavor_fallback: "Kráčím vpřed a stoupám po schodech na pódium. Je čas na poslední verše."
 contest_events.0711.a: "Písnička o vydělávání peněz a dobrém životě."
 contest_events.0711.b: "Potěším dav příběhem o válce a vítězství!"
 contest_events.0711.c: "Obrátím se k vyšší moci."
 contest_events.0711.d: "Raději zůstanu u něčeho jednoduchého a osvědčeného."
 contest_events.0720.t: "$tournament_contest_header$ Napjatá tětiva"
 contest_events.0720.pivotal_success: "Vykročím, nasadím šíp, zamířím, napnu tětivu a pustím. Šíp zasviští vzduchem a hluboko se zabodne do terče. Dav propukne v jásot. O tomhle nemůže být sporu, takový zásah mi výrazně pomůže!\n\n"
 contest_events.0720.pivotal_neutral: "Šíp letí přesně, ale k mé zlosti ne tak přesně, jak bych si [Select_CString(ROOT.Char.IsFemale,'přála','přál')]. Zabodne se do terče, ovšem jen u okraje. Neuškodí mi to, ale velkou slávu mi to nejspíš také nepřinese.\n\n"
 contest_events.0720.pivotal_failure: "Když přitahuji tětivu k bradě, ucítím v paži nepatrný záchvěv. V panice ji pustím, ale už je pozdě. Šíp letí divoce, kymácí se ve vzduchu a nakonec zasviští těsně kolem terče! Dav zklamaně zasténá a já složím hlavu do dlaní.\n\n"
 contest_events.0720.ptv_close: "Téměř nelze určit, kdo vede. Rozhodně patřím mezi nejlepší, ale všichni jsme na tom skoro stejně!"
 contest_events.0720.ptv_close_spectator: "Na čele je to neuvěřitelně těsné. Nejlepší soutěžící jsou vyrovnaní!"
 contest_events.0720.ptv_top: "Vedu! Vítězství je tak blízko!"
 contest_events.0720.ptv_top_spectator: "[pivotal_contestant.GetFirstName|U] jasně vede! Pokud si zachová pevné nervy, má vítězství téměř jisté!"
 contest_events.0720.ptv_bottom: "Za vedoucími beznadějně zaostávám. K vítězství by teď byl potřeba ohromný obrat štěstěny..."
 contest_events.0720.ptv_bottom_spectator: "[pivotal_contestant.GetFirstName|U] vypadá téměř poraženě. K vítězství by teď byl potřeba ohromný obrat štěstěny..."
 contest_events.0720.ptv_top_half: "Jsem v horní polovině pořadí, ale nevedu. S trochou štěstí se to ještě může proměnit ve vítězství..."
 contest_events.0720.ptv_top_half_spectator: "[pivotal_contestant.GetFirstName|U] se posouvá kupředu, ale zatím nevede. Sláva je stále na dosah."
 contest_events.0720.ptv_bottom_half: "Vězím v dolní polovině pořadí, ale výhra ještě není zcela mimo dosah..."
 contest_events.0720.ptv_bottom_half_spectator: "[pivotal_contestant.GetFirstName|U] vězí v dolní polovině pořadí, ale výhra ještě není zcela mimo dosah..."
 contest_events.0720.ptv_fallback: "Vzduchem létají další šípy. Zoufalí soutěžící střílejí téměř tak rychle, jak jen smějí."
 contest_events.0720.spectator: "\n\nZazní kletba, když tětiva šlehne o předloktí. Okolím se rozlehne prásknutí, možná praskla tětiva, možná byla jen hlučná. Dav už má svůj rytmus: napjaté ticho, když soutěžící nastoupí, a bouřlivý jásot, když vypustí šíp."
 contest_events.0720.final: "\n\nKaždému soutěžícímu zbývá už jen několik šípů. Konec je na dosah."
 contest_events.0720.a: "Poslední šíp na tětivu..."
 contest_events.0720.b: "Poslední šíp na tětivu!"
 contest_events.0721.t: "$tournament_contest_header$ Umění verše"
 contest_events.0721.pivotal_success: "Dokončuji poslední verše, ale dav ani nečeká na konec. Jásot přehlušuje má slova a při odchodu z pódia mi kolem nohou dopadají květiny.\n\n"
 contest_events.0721.pivotal_neutral: "Mé poslední verše sklidí jásot a potlesk. Při odchodu z pódia se však nemohu zbavit nepříjemného pocitu, že jsem [Select_CString(ROOT.Char.IsFemale,'nepředvedla','nepředvedl')] vše, co ve mně je.\n\n"
 contest_events.0721.pivotal_failure: "Zakončím verše zdviženou pěstí a zvučným, sebejistým přednesem. Dav však nabídne jen zdvořilý potlesk prokládaný několika zakašláními. Z pódia odcházím se svěšenými rameny. Mé naděje pohasínají...\n\n"
 contest_events.0721.ptv_fallback: "Další a další soutěžící čekají v řadě na pódium a nervózně přešlapují z nohy na nohu."
 contest_events.0721.spectator: "\n\nTeď už stačí jediné nevhodné slovo a dav zoufale zasténá, zatímco trefný přednes vyvolává bouřlivý potlesk. Diváci dupou a jásají, když soutěžící přistupují k pódiu. Horečná atmosféra je v plném proudu."
 contest_events.0721.final: "Zbývá jen pár soutěžících a ještě méně času. Vše se rozhodne právě teď."
 contest_events.0721.a: "Ještě jeden verš..."
 contest_events.0721.b: "Ještě jeden verš!"
 contest_events.0800.t: "[activity.GetCurrentPhase.GetPhase.GetName|U]: Soutěž začíná"
 contest_events.0800.joust: "Soutěžící na koních objíždějí kolbiště a jejich sluhové vysoko nesou erby, zatímco herold ohlašuje začátek soutěže. Panoši v barvách svých pánů pobíhají sem a tam s výstrojí a zásobami pro nadcházející souboje.\n\n"
 contest_events.0800.wrestling: "Soutěžící bez košil stojí kolem písčitého zápasiště a rozcvičují se, zatímco herold ohlašuje začátek soutěže. Někteří si třou tělo hlínou, jiní dávají přednost oleji. Všichni hledají sebemenší výhodu pro nadcházející zápasy.\n\n"
 contest_events.0800.duel: "Soutěžící pochodují na kolbiště a zaujímají místa kolem čtvercového zápasiště, zatímco herold ohlašuje začátek soutěže. V pozadí se kontroluje ohrada, třese se s ní a cloumá, aby nepovolila, kdyby do ní někdo ze soutěžících narazil.\n\n"
 contest_events.0800.board_game: "Soutěžící usedají k hracím stolům, natřásají si polštáře a žádají o občerstvení, zatímco herold ohlašuje začátek soutěže. Na kozových stolech jsou rozložené hry s figurkami vyleštěnými do zrcadlového lesku.\n\n"
 contest_events.0800.desc: "Různá výška a síla jásotu v davu nenechává nikoho na pochybách, kdo jsou favorité."
 contest_events.0800.vs: "\n\nV prvním zápase se utkám s [ROOT.Char.Custom2('CZ_RelationToMeShort_I', versus_contestant)|l], [versus_contestant.Custom('CZ_Name_I')]."
 contest_events.0800.champion_self: "[Select_CString(contest_champion.IsFemale,'Má šampionka','Můj šampion')|U], [contest_champion.GetFirstName], a já ukážeme těm buranům, zač je toho loket!\n\n"
 contest_events.0800.a.contestant: "Jsem [Select_CString(ROOT.Char.IsFemale,'připravená','připravený')]!"
 contest_events.0800.a.champion: "Do toho, [contest_champion.Custom('CZ_TitledFirstNameNoTooltip_V')]! Ukaž, proč jsi [Select_CString(contest_champion.IsFemale,'šampionka','šampion')]!"
 contest_events.0800.a: "Ať vyhraje ten nejlepší!"
 contest_events.0800.b: "Musím uzavřít sázku..."
 contest_events.0800.c: "To by nešlo, aby [ROOT.Char.GetTitleAsNameNoTooltip|l] [Select_CString(ROOT.Char.IsFemale,'nesoutěžila','nesoutěžil')]..."
 contest_events.0800.d: "[rival_contestant.GetTitledFirstNameNoTooltip|U]?! Na #EMP mých#! hrách tedy ne!"
 contest_events.0800.e: "Možná by se seznam účastníků dal změnit..."
 contest_events.0800.e.flavor: "Ty, sloužící! Mám pro tebe choulostivý úkol..."
 contest_events.0800.f: "[versus_contestant.GetFirstNameNoTooltip|U] se samozřejmě svému lennímu pánovi vzdá..."
 contest_events.0800.f.flavor: "Tak to má být."
 mysterious_stranger_joust: "„[mysterious_stranger.GetFirstName|U] z [attending_barony.Custom('CZ_LandedNameNoTierNoTooltip_G')]“ je [mysterious_stranger.Custom('KnightCultureNoTooltipLowercase')|l] [mysterious_stranger.GetCulture.Custom('CZ_Adjective_eeho')|l] původu s mimořádným umem. Účast této dosud neznámé tváře vyvolala pořádný rozruch."
 mysterious_stranger_wrestling: "[Select_CString(mysterious_stranger.IsFemale,'Dorazila nová účastnice','Dorazil nový účastník')|U] jménem [mysterious_stranger.GetFirstName], doma už proslulá osobnost, která si chce vydobýt jméno i zde."
 mysterious_stranger_duel: "$mysterious_stranger_joust$"
 mysterious_stranger_board_game: "Letos se na doporučení místního pána [Select_CString(mysterious_stranger.IsFemale,'přihlásila žena','přihlásil muž')] jménem [mysterious_stranger.GetFirstName]. O [Select_CString(mysterious_stranger.IsFemale,'jejím','jeho')] herním stylu se kromě pověstí mnoho neví."
