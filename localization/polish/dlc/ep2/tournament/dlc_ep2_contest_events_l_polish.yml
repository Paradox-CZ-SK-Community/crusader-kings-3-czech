 contest_events.0805.desc: "Zní trubky, dav bouří a soutěžící se začínají shromažďovat. Soutěž skončila a někdo se chystá užít si svou chvíli slávy. Vystupuje herold a jeho hlas se rozléhá po celém kolbišti.\n\n„Po mnoha zkouškách, několika útrapách a především po opravdu urputném zápolení [contest_winner.GetTitledFirstName] ve finále [Select_CString(contest_winner.IsFemale,'porazila','porazil')] [second_place.Custom('CZ_TitledFirstName_A')]! Naším vítězem je [contest_winner.GetFirstNameNoTooltip]!“\n\n"
 contest_events.0805.first: "V celém [host.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')] se vskutku nenajde nikdo, kdo by se vyrovnal mému umění!"
 contest_events.0805.second: "[Select_CString(ROOT.Char.IsFemale,'Nevyhrála','Nevyhrál')|U] jsem, ale [Select_CString(ROOT.Char.IsFemale,'byla','byl')] jsem hodně blízko..."
 contest_events.0805.contestant: "„Příště se budu muset víc snažit!“ říkám si, zatímco sleduji, jak vítězovi zvedají ruku."
 contest_events.0805.spectator: "Velmi zábavné představení!"
 contest_events.0805.first_champion: "\n\n[Select_CString(contest_champion.IsFemale,'Má šampionka','Můj šampion')|U] #EMP doopravdy#! [Select_CString(contest_champion.IsFemale,'vyhrála','vyhrál')]?! Musím [Select_CString(contest_champion.IsFemale,'ji','ho')] odměnit!"
 contest_events.0805.second_champion: "\n\nI když [Select_CString(contest_champion.IsFemale,'má šampionka','můj šampion')] [Select_CString(contest_champion.IsFemale,'nevyhrála','nevyhrál')], pořád jsem na [Select_CString(contest_champion.IsFemale,'ni','něj')] [Select_CString(ROOT.Char.IsFemale,'hrdá','hrdý')]."
 contest_events.0805.contestant_champion: "\n\n[Select_CString(contest_champion.IsFemale,'Má šampionka','Můj šampion')|U], [contest_champion.GetFirstName], svému označení příliš cti [Select_CString(contest_champion.IsFemale,'neudělala','neudělal')]..."
