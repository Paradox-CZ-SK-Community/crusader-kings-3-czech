 contest_events.0810.a.house: "Dobrý výkon rodu [contest_winner.GetHouse.GetBaseNameNoTooltip]!"
 contest_events.0810.a.house_won: "Vítězství pro celý rod [contest_winner.GetHouse.GetBaseNameNoTooltip]!"
 contest_events.0810.a.house_lost: "Není to dobrý den pro rod [contest_loser.GetHouse.GetBaseNameNoTooltip]..."
 contest_events.0810.a: "Skvělá soutěž!"
 contest_events.0810.b: "Chyťte [Select_CString(contest_winner.IsFemale,'tu zločinkyni','toho zločince')]!"
 contest_events.0810.c: "Nešťastná tragédie..."
 contest_events.0820.t: "[activity.GetCurrentPhase.GetPhase.GetName|U]: [activity.Custom('GetVersusRound')|l]"
 contest_events.0820.qualify: "Kvalifikace v soutěži [activity.GetCurrentPhase.GetPhase.GetName|l] skončila a podle dosavadního pořadí je jasné, kdo postoupí do čtvrtfinále.\n\n"
 contest_events.0820.semi: "Čtvrtfinále soutěže [activity.GetCurrentPhase.GetPhase.GetName|l] skončilo!\n\nHerold hřímá: „[contest_summary_1.GetNameRegnal|U], [contest_summary_2.GetNameRegnal], [contest_summary_3.GetNameRegnal] a [contest_summary_4.GetNameRegnal] postupují do semifinále!“\n\n"
 contest_events.0820.final: "Semifinále soutěže [activity.GetCurrentPhase.GetPhase.GetName|l] skončilo!\n\nHerold hřímá: „[contest_summary_1.GetNameRegnal|U] a [contest_summary_2.GetNameRegnal] postupují do finále!“\n\n"
 contest_events.0820.open: "Souboje v soutěži [activity.GetCurrentPhase.GetPhase.GetName|l] konečně začínají naplno.\n\nO tom, kdo z těchto zdatných soutěžících se zahalí do slávy, teď rozhodne jedině [ROOT.Char.GetFaith.HighGodName]!\n\n"
 contest_events.0820.contestant: "Na přípravy už není čas. Kéž mi [ROOT.Char.GetFaith.WarGodName] pomůže, ukážu soupeři, zač je toho loket!\n\n"
 contest_events.0820.vs_resigned: "V dalším zápase mě čeká [ROOT.Char.Custom2('RelationToMeShort', versus_contestant)|l], [versus_contestant.GetTitledFirstName], ale [Select_CString(versus_contestant.IsFemale,'vzdala se','vzdal se')]!\n\n"
 contest_events.0820.vs_disqualified: "V dalším zápase mě čeká [ROOT.Char.Custom2('RelationToMeShort', versus_contestant)|l], [versus_contestant.GetTitledFirstName], ale [Select_CString(versus_contestant.IsFemale,'byla diskvalifikována','byl diskvalifikován')]!\n\n"
 contest_events.0820.vs: "V dalším zápase se utkám s [ROOT.Char.Custom2('CZ_RelationToMeShort_I', versus_contestant)|l], [versus_contestant.Custom('CZ_TitledFirstName_I')].\n\n"
 contest_events.0820.vs_final: "[Select_CString(ROOT.Char.IsFemale,'Postoupila','Postoupil')|U] jsem do finálového zápasu! Mezi mnou a vítězstvím stojí už jen [versus_contestant.GetTitledFirstName].\n\n"
 contest_events.0820.intent_match: "Mezitím se [intent_scope.GetTitledFirstName] utká s [intent_match.Custom('CZ_TitledFirstName_I')].\n\n"
 contest_events.0820.woo_vow: "Nenápadně přejíždím očima tribuny a hledám [woo_target.Custom('CZ_TitledFirstName_A')]. Brzy si všimnu [Select_CString(woo_target.IsFemale,'jejího','jeho')] smutného pohledu. Zřejmě vůbec nepochybuje, že budu soutěžit..."
 contest_events.0820.a: "Dokážu to!"
 contest_events.0820.b: "Vlastně... vzdávám se..."
 contest_events.0820.c.resigned: "[Select_CString(versus_contestant.IsFemale,'Vzdala se','Vzdal se')|U]? [Select_CString(ROOT.Char.IsFemale,'Vyhrála','Vyhrál')|U] jsem!"
 contest_events.0820.c.disqualified: "Proto se mají dodržovat pravidla."
 contest_events.0820.d: "Zajímavé kolo..."
 contest_events.0820.d.contestant: "Jsem [Select_CString(ROOT.Char.IsFemale,'připravená','připravený')]!"
 contest_events.0820.d.loser: "Příště vyhraju..."
 contest_events.0825.t: "$activity_tournament$: Odstoupení ze soutěže [activity.GetCurrentPhase.GetPhase.GetName|l]"
 contest_events.0825.desc: "Ať už kvůli strachu z nebezpečí, nebo z jiného důvodu, [resign_target.GetTitledFirstName] se v soutěži [activity.GetCurrentPhase.GetPhase.GetName|l] [Select_CString(resign_target.IsFemale,'vzdala','vzdal')] [Select_CString(versus_contestant.IsFemale,'své soupeřce','svému soupeři')], [versus_contestant.Custom('CZ_TitledFirstName_D')].\n\n"
 contest_events.0825.safe: "Ať už kvůli strachu ze ztrapnění, nebo z jiného důvodu, [resign_target.GetTitledFirstName] se v soutěži [activity.GetCurrentPhase.GetPhase.GetName|l] [Select_CString(resign_target.IsFemale,'vzdala','vzdal')] [Select_CString(versus_contestant.IsFemale,'své soupeřce','svému soupeři')], [versus_contestant.Custom('CZ_TitledFirstName_D')].\n\n"
 contest_events.0825.qualify: "[versus_contestant.GetFirstNameNoTooltip|U] postupuje automaticky do semifinále."
 contest_events.0825.semi: "[versus_contestant.GetFirstNameNoTooltip|U] postupuje automaticky do finále."
 contest_events.0825.final: "[versus_contestant.GetFirstNameNoTooltip|U] automaticky vyhrává soutěž!"
 contest_events.0825.a: "Opravdu?"
 contest_events.0825.b: "[Select_CString(resign_target.IsFemale,'Ona udělala','On udělal')|U] #EMP CO?!#!"
 contest_events.0826.t: "$activity_tournament$: Diskvalifikace ze soutěže [activity.GetCurrentPhase.GetPhase.GetName|l]"
 contest_events.0826.desc: "Ve výbuchu hněvu [host.GetTitledFirstName] [Select_CString(host.IsFemale,'diskvalifikovala','diskvalifikoval')] [disqualify_target.Custom('CZ_TitledFirstName_A')] ze soutěže [activity.GetCurrentPhase.GetPhase.GetName|l] a [Select_CString(host.IsFemale,'otevřela','otevřel')] tak cestu k postupu pro [versus_contestant.Custom('CZ_TitledFirstName_A')].\n\n"
 contest_events.0826.a: "To je jistě překvapení."
 contest_events.0826.b: "[Select_CString(disqualify_target.IsFemale,'Ona udělala','On udělal')|U] #EMP CO?!#!"
 contest_events.0860.t: "$tournament_contest_header$ Plným tryskem"
 contest_events.0860.desc: "Prapory se třepotají a práskají ve větru. Když přitáhnu koni otěže, dav na okamžik zatají dech. Zvedám kopí a v hlavě se mi přehrávají dosavadní události soutěže. Třeba jak"
 contest_events.0860.flavor_1: "jsem [Select_CString(ROOT.Char.IsFemale,'bojovala','bojoval')] dál i přes zranění po prudkém zásahu do boku.\n\n"
 contest_events.0860.flavor_2: "soupeře úder čistě smetl z koně.\n\n"
 contest_events.0860.flavor_3: "[Select_CString(versus_contestant.IsFemale,'se má soupeřka pokusila','se můj soupeř pokusil')] použít kopí obřích rozměrů.\n\n"
 contest_events.0860.flavor_4: "[Select_CString(versus_contestant.IsFemale,'ke mně soupeřka přišla','ke mně soupeř přišel')] s žádostí o souboj pěšmo.\n\n"
 contest_events.0860.flavor_5: "[Select_CString(versus_contestant.IsFemale,'se má urozená soupeřka pokusila','se můj urozený soupeř pokusil')] nastoupit navzdory vážné ráně.\n\n"
 contest_events.0860.flavor_6: "[Select_CString(versus_contestant.IsFemale,'soupeřka požádala','soupeř požádal')] o milosrdný průjezd.\n\n"
 contest_events.0860.flavor_7: "jsem si [Select_CString(ROOT.Char.IsFemale,'povídala','povídal')] se soupeřovým rozcuchaným štolbou.\n\n"
 contest_events.0860.flavor_8: "na mě dav pokřikoval při přípravě na střet.\n\n"
 contest_events.0860.flavor_9: "jsem [Select_CString(ROOT.Char.IsFemale,'půjčila','půjčil')] soupeři kopí, když mu žádné nezbylo.\n\n"
 contest_events.0860.flavor_10: "jiný soutěžící spadl z koně a utrpěl hrůzné zranění.\n\n"
 contest_events.0860.flavor_fallback: "Můj soupeř se staví na opačný konec kolbiště. Je to tady."
 contest_events.0860.a: "Možná kdybych soupeře [Select_CString(ROOT.Char.IsFemale,'trefila','trefil')] do hlavy..."
 contest_events.0860.b: "Naznačím úder vysoko, udeřím nízko."
 contest_events.0860.c: "Myslím, že v minulém průjezdu se soupeř něčím prozradil..."
 contest_events.0860.d: "Žádné triky. Prostě zamířím na štít."
 contest_events.0861.t: "$tournament_contest_header$ Přitisknutí k zemi"
 contest_events.0861.desc: "Dav lační po krvi, když vrávorám vpřed vstříc dalšímu střetu se soupeřem. Rukávem si setřu pramínek krve z čela a přemýšlím, jak"
 contest_events.0861.flavor_1: "jsem se [Select_CString(ROOT.Char.IsFemale,'pokusila','pokusil')] odhalit soupeřovy slabiny.\n\n"
 contest_events.0861.flavor_2: "[Select_CString(versus_contestant.IsFemale,'má soupeřka na chvíli přestala bojovat, aby se předvedla','můj soupeř na chvíli přestal bojovat, aby se předvedl')] davu.\n\n"
 contest_events.0861.flavor_3: "jsem soupeři [Select_CString(ROOT.Char.IsFemale,'hodila','hodil')] do očí hlínu.\n\n"
 contest_events.0861.flavor_4: "jsem [Select_CString(ROOT.Char.IsFemale,'sáhla','sáhl')] po špinavých tricích, abych [Select_CString(ROOT.Char.IsFemale,'uspěla','uspěl')].\n\n"
 contest_events.0861.flavor_5: "mi kdosi z davu nečekaně pomohl.\n\n"
 contest_events.0861.flavor_6: "mi mohutný soupeř dal svou vahou pořádně zabrat.\n\n"
 contest_events.0861.flavor_7: "jsme se se soupeřem ocitli v poněkud milostné poloze.\n\n"
 contest_events.0861.flavor_8: "mě soupeřův přítel obvinil z podvádění.\n\n"
 contest_events.0861.flavor_9: "jsem si soupeře [Select_CString(ROOT.Char.IsFemale,'rozebrala','rozebral')], abych si [Select_CString(ROOT.Char.IsFemale,'zajistila','zajistil')] úspěch.\n\n"
 contest_events.0861.flavor_10: "mi prst vyskočil z kloubu.\n\n"
 contest_events.0861.flavor_11: "mě soupeř šťouchl do oka.\n\n"
 contest_events.0861.flavor_12: "mě soupeř s pěnou u úst kousl do nosu.\n\n"
 contest_events.0861.flavor_13: "jsem soupeře [Select_CString(ROOT.Char.IsFemale,'plácla','plácl')] dlaněmi přes uši a [Select_CString(ROOT.Char.IsFemale,'protrhla','protrhl')] mu bubínky.\n\n"
 contest_events.0861.flavor_fallback: "se mám pustit do dalšího tahu.\n\n"
 contest_events.0861.a: "Ta játra vypadají zranitelně..."
 contest_events.0861.b: "„Pojď! Zaklesněme se do sebe jako bojovníci!“"
 contest_events.0861.c: "Naznačím úder nízko, udeřím vysoko."
 contest_events.0861.d: "Jednoduše a bez rizika."
 contest_events.0862.t: "$tournament_contest_header$ Protiúder"
 contest_events.0862.desc: "Dvě čepele se o sebe smýkají po celé délce a vzduchem zazní pronikavé skřípění kovu. Jiskry se třpytí a padají na zem. Hledám výhodu a vzpomínám, jak"
 contest_events.0862.flavor_3: "soupeřův meč vylétl mezi diváky.\n\n"
 contest_events.0862.flavor_4: "jsem soupeře instinktivně [Select_CString(ROOT.Char.IsFemale,'kopla','kopl')] do rozkroku.\n\n"
 contest_events.0862.flavor_5: "jsem [Select_CString(ROOT.Char.IsFemale,'získala','získal')] obrovskou výhodu a [Select_CString(ROOT.Char.IsFemale,'rozhodovala','rozhodoval')] se, jak ji nejlépe využít.\n\n"
 contest_events.0862.flavor_6: "[Select_CString(versus_contestant.IsFemale,'se mě soupeřka pokusila','se mě soupeř pokusil')] podplatit.\n\n"
 contest_events.0862.flavor_7: "jsem proti útočnému soupeři [Select_CString(ROOT.Char.IsFemale,'musela','musel')] volit mezi protiútokem a krytem.\n\n"
 contest_events.0862.flavor_8: "jsem [Select_CString(ROOT.Char.IsFemale,'spatřila','spatřil')] příležitost využít během souboje druhou ruku.\n\n"
 contest_events.0862.flavor_9: "jsem [Select_CString(ROOT.Char.IsFemale,'bojovala','bojoval')] v šermířském plášti.\n\n"
 contest_events.0862.flavor_10: "jsem [Select_CString(ROOT.Char.IsFemale,'zvažovala','zvažoval')], že soupeře rozptýlím slovy.\n\n"
 contest_events.0862.flavor_11: "jsem [Select_CString(ROOT.Char.IsFemale,'využila','využil')] své #EMP intimní zkušenosti#! s členem soupeřovy rodiny.\n\n"
 contest_events.0862.flavor_fallback: "Znovu proti sobě postupujeme. [Select_CString(And(ROOT.Char.IsFemale,versus_contestant.IsFemale),'Obě jsme zbité a unavené','Oba jsme zbití a unavení')|U] a vítěz může být jen jeden.\n\n"
 contest_events.0862.a: "Musím si vzpomenout na výcvik."
 contest_events.0862.b: "„Co je? Snad nemáš #EMP strach?#!“"
 contest_events.0862.c: "Rozhodnout může ještě jeden poslední blaf..."
 contest_events.0862.d: "„Tak pojď. Bojujme.“"
 contest_events.0863.t: "$tournament_contest_header$ Šach"
 contest_events.0863.desc: "Klid narušuje tiché klapání přesouvaných figurek. Hra už dospěla hluboko do koncovky a výsledek visí na vlásku. Přemítám o tom, co se dosud stalo. Třeba jak"
 contest_events.0863.flavor_1: "jsem se [Select_CString(ROOT.Char.IsFemale,'pokusila','pokusil')] soupeře rozhodit psychologickými hrami.\n\n"
 contest_events.0863.flavor_2: "[Select_CString(versus_contestant.IsFemale,'soupeřka s ohlušujícím rachotem převrhla','soupeř s ohlušujícím rachotem převrhl')] celý stůl.\n\n"
 contest_events.0863.flavor_3: "jsem [Select_CString(ROOT.Char.IsFemale,'spatřila','spatřil')] příležitost k riskantnímu, ale slibnému tahu.\n\n"
 contest_events.0863.flavor_4: "jsem [Select_CString(ROOT.Char.IsFemale,'spatřila','spatřil')] a [Select_CString(ROOT.Char.IsFemale,'zvažovala','zvažoval')] příležitost k podvodu.\n\n"
 contest_events.0863.flavor_5: "jsem soupeře [Select_CString(ROOT.Char.IsFemale,'vyděsila','vyděsil')] natolik, že [Select_CString(versus_contestant.IsFemale,'začala','začal')] dělat špatné tahy.\n\n"
 contest_events.0863.flavor_6: "[Select_CString(versus_contestant.IsFemale,'mě soupeřka vyzvala, ať respektuji její','mě soupeř vyzval, ať respektuji jeho')] výklad pravidel.\n\n"
 contest_events.0863.flavor_fallback: "Figurky se přesouvají tiše a spěšně. Ani jednomu z nás nezbývá mnoho času vybojovat vítězství.\n\n"
 contest_events.0863.a: "Možná mohu využít své znalosti válečnictví?"
 contest_events.0863.b: "„To sebevědomí z tebe přímo čiší...“"
 contest_events.0863.c: "Možná čas na odvážný tah?"
 contest_events.0863.d: "Hrát na jistotu je správný tah."
 contest_events.0870.t: "$tournament_contest_header$ Přímý zásah"
 contest_events.0870.pivotal_success: "Nejdřív prásknutí nárazu. O zlomek vteřiny později mi paží projede prudký otřes. A pak se náhle ozve další zvuk: jásot davu. Mé kopí tvrdě zasáhne a roztříští se o soupeřův štít. A co víc, soupeřův úder zcela minul!\n\n"
 contest_events.0870.pivotal_neutral: "Výjezd se nám sice povedl, ale moje paže zakolísá a klesne, takže kopí mine soupeřův štít. Jedinou útěchou je, že soupeř míří stejně vysoko, jako já nízko. Zklamaný hukot davu hřmí jako bouře.\n\n"
 contest_events.0870.pivotal_failure: "Sleduji, jak se hrot mého kopí blíží, blíží a... #EMP míjí#! soupeřův štít. O okamžik později mě náraz vrhne v sedle dozadu. O můj štít se tříští kopí a řev davu mi v uších zní jako kletba.\n\n"
 contest_events.0870.ptv_close: "Je čas na poslední průjezd. Právě ten o všem rozhodne."
 contest_events.0870.ptv_top: "Vedu, ale zbývá ještě jeden střet. Stačí mi v posledním průjezdu remizovat..."
 contest_events.0870.ptv_top_spectator: "[pivotal_contestant.GetFirstName|U] vede, ale zbývá ještě poslední průjezd..."
 contest_events.0870.ptv_bottom: "Výrazně prohrávám a k tomu mám tělo samou modřinu. Jedinou skutečnou nadějí je zasáhnout soupeře tak tvrdě, že nebude moci pokračovat. To by ale chtělo zázrak..."
 contest_events.0870.ptv_bottom_spectator: "[pivotal_contestant.GetFirstName|U] vypadá téměř poraženě. Pokud nedojde k dramatickému obratu, výsledek je zřejmě jasný."
 contest_events.0870.ptv_top_half: "Vedu, ale stále je čeho se obávat. Jediný úder může rozhodnout v můj i soupeřův prospěch."
 contest_events.0870.ptv_top_half_spectator: "[pivotal_contestant.GetFirstName|U] vede, ale je to těsné. Sláva je stále na dosah."
 contest_events.0870.ptv_bottom_half: "Bodově zaostávám, ale pořád to můžu zvrátit. Ještě jeden průjezd, ještě jedna příležitost ke slávě..."
 contest_events.0870.ptv_bottom_half_spectator: "[pivotal_contestant.GetFirstName|U] prohrává, ale ještě není konec. Jediný čin může vše obrátit v [Select_CString(pivotal_contestant.IsFemale,'její','jeho')] prospěch..."
 contest_events.0870.ptv_fallback: "Blíží se poslední průjezd kola a oba koně přecházejí do cvalu."
 contest_events.0870.spectator: "\n\nZávěrečná kola klání jsou bouřlivá: diváci pokřikují a křičí, lékaři ošetřují zraněné a žár natěsnaného davu žene atmosféru do horečných výšin."
 contest_events.0870.final: "\n\nKopyta koní hřmí. Kopí klesají. Dav řve."
 contest_events.0870.winner_start: "Naposledy se stavíme na výchozí místa. Když se můj kůň s dusotem řítí k [versus_contestant.Custom('CZ_FirstName_D')], mám z tohohle střetu dobrý pocit."
 contest_events.0870.loser_start: "Znovu se stavíme na výchozí místa, ale při rozjezdu něco nesedí. Snad rytmus koně, snad to, jak na mně sedí zbroj."
 contest_events.0870.winner_break: "Mé kopí přesně zasáhne [Select_CString(versus_contestant.IsFemale,'její','jeho')] štít a s ohlušujícím prásknutím se rozletí v záplavě třísek. [Select_CString(versus_contestant.IsFemale,'Její','Jeho')|U] vlastní kopí přitom proletí kolem mě. To jsou všechny body, které potřebuji!"
 contest_events.0870.winner_unhorse: "Mé kopí zasáhne [Select_CString(versus_contestant.IsFemale,'ji','ho')] naplno do hrudi a v dešti třísek smete k zemi, zatímco můj kůň cválá dál."
 contest_events.0870.loser_break: "Mé kopí na poslední chvíli uhne z cíle. Cítím, jak [Select_CString(versus_contestant.IsFemale,'její','jeho')] kopí přesně zasahuje a škube mým štítem. Pak se s ohlušujícím prásknutím rozletí třísky."
 contest_events.0870.loser_unhorse: "Když se k sobě přiblížíme, nedokážu udržet kopí na cíli a vidím, jak [Select_CString(versus_contestant.IsFemale,'její','jeho')] hrot míjí můj štít a míří přímo do mé hrudi. Ležím na zemi v omámení a slyším [Select_CString(versus_contestant.IsFemale,'ji','ho')] vítězoslavně odjíždět."
 contest_events.0870.a: "Čeká mě poslední střet kola."
 contest_events.0870.b: "Poslední střet tohoto kola!"
 contest_events.0871.t: "$tournament_contest_header$ Kdo s koho"
 contest_events.0871.pivotal_success: "Ruka na rameno, obratné podražení a mohutné trhnutí. Dopadneme na zem. Slyšet je jen namáhavý dech a vzdálenější řev davu. Vyškrábu se na soupeře a ze všech sil se snažím využít převahu.\n\n"
 contest_events.0871.pivotal_neutral: "Vzduch plní náš přerývaný dech, zatímco se navzájem snažíme dostat na zem. Nakonec rozhodne noha zaháknutá za druhou a skácíme se. Po chvilce omráčení zjišťujeme, že ležíme na bocích, a okamžitě začínáme usilovat o převahu.\n\n"
 contest_events.0871.pivotal_failure: "Pokusím se soupeře hodit na zem, ale vzápětí letím vzduchem já. Tvrdě dopadnu, se zasténáním mi unikne vzduch z plic a okamžitě se musím bránit. Napínám všechny síly, abych [Select_CString(ROOT.Char.IsFemale,'neskončila','neskončil')] pod soupeřem.\n\n"
 contest_events.0871.ptv_close: "Zápas je velmi těsný. Jedna chyba kohokoliv z nás může okamžitě rozhodnout."
 contest_events.0871.ptv_close_spectator: "Zápas je tak napínavý! Jedna chyba kteréhokoli soutěžícího může okamžitě rozhodnout."
 contest_events.0871.ptv_top: "Vedu! K vítězství už stačí jen vydržet!"
 contest_events.0871.ptv_top_spectator: "[pivotal_contestant.GetFirstName|U] vede! Vítězství je určitě blízko!"
 contest_events.0871.ptv_bottom: "Prohrávám, a to dost výrazně. Cesta k vítězství je úzká, ale stále existuje..."
 contest_events.0871.ptv_bottom_spectator: "[pivotal_contestant.GetFirstName|U] prohrává, a to dost výrazně. K vítězství by teď byl potřeba zázrak..."
 contest_events.0871.ptv_top_half: "Vedu, ale vítězství zdaleka není jisté. Stačí ještě trochu snahy..."
 contest_events.0871.ptv_top_half_spectator: "[pivotal_contestant.GetFirstName|U] vede, ale vítězství zdaleka není jisté."
 contest_events.0871.ptv_bottom_half: "Prohrávám, ale porážka není nevyhnutelná. Stále to mohu otočit!"
 contest_events.0871.ptv_bottom_half_spectator: "[pivotal_contestant.GetFirstName|U] prohrává, ale porážka zdaleka není jistá."
 contest_events.0871.ptv_fallback: "Řine se ze mě pot. Končetiny se nám proplétají a hledáme výhodnější úchop."
 contest_events.0871.spectator: "\n\nDvě těla se rozplétají, znovu se střetávají a opět oddělují. Těžký dech soutěžících přehlušuje řev přihlížejícího davu. Znovu se zaklesnou, prach víří a ulpívá na zpocené kůži."
 contest_events.0871.final: "Prach víří a dav vzrušeně huláká. Zápas se rozhodne teď."
 contest_events.0871.winner_start: "O chvíli později se mi podaří zaskočit [versus_contestant.Custom('CZ_FirstName_A')]."
 contest_events.0871.loser_start: "O chvíli později mě [versus_contestant.GetFirstName] náhle zaskočí!"
 contest_events.0871.winner_pin: "Zaútočím a pevně [Select_CString(versus_contestant.IsFemale,'ji','ho')] přitisknu k zemi. Držím [Select_CString(versus_contestant.IsFemale,'ji','ho')] na místě, zatímco se marně snaží vyprostit."
 contest_events.0871.winner_throw: "Nepromarním příležitost. Popadnu [Select_CString(versus_contestant.IsFemale,'ji','ho')] kolem pasu a vší silou vrhnu k okraji, kde se rozplácne mimo zápasiště."
 contest_events.0871.loser_pin: "Když se snažím znovu vzpamatovat, soupeř mě srazí na zem a sevře jako do svěráku. Marně zápasím a nedokážu se vyprostit."
 contest_events.0871.loser_throw: "Zatímco marně hledám oporu, soupeř mnou prudce mrští a pošle mě ze zápasiště do hlíny."
 contest_events.0871.winner_end: "Rozhodčí oznámí konec. [Select_CString(ROOT.Char.IsFemale,'Vyhrála','Vyhrál')|U] jsem!"
 contest_events.0871.loser_end: "Rozhodčí oznámí konec. [Select_CString(ROOT.Char.IsFemale,'Prohrála','Prohrál')|U] jsem..."
 contest_events.0871.a: "Vítězství!"
 contest_events.0871.a.loser: "Zatraceně..."
 contest_events.0871.b: "Ještě jeden pád a je to!"
 contest_events.0872.t: "$tournament_contest_header$ Ocel proti oceli"
 contest_events.0872.pivotal_success: "Ozve se zvučná rána, když se moje zbraň odrazí od přilby a soupeř zavrávorá dozadu. Rychle navážu: naznačený sek vlevo a drtivý úder vpravo. Postupuji, soupeř zoufale couvá a můj meč odráží jen o vlásek.\n\n"
 contest_events.0872.pivotal_neutral: "Můj sek shora srazí soupeř stranou a já uhnu odvetnému úderu. Zbraně se znovu střetávají, kryjí a bodají za jásotu a úleků davu. Ani jeden z nás nedokáže najít skulinu.\n\n"
 contest_events.0872.pivotal_failure: "Můj unavený výpad mine a soupeř se pohrdavě ani neobtěžuje uhnout. Vzápětí se ocitám v obraně a odrážím úder za úderem, aniž bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] jediný vrátit. Zoufale couvám, kličkuji a uhýbám, jen abych se [Select_CString(ROOT.Char.IsFemale,'udržela','udržel')] v boji.\n\n"
 contest_events.0872.ptv_close: "Souboj je stále velmi vyrovnaný! Vítězem může být kdokoli z nás."
 contest_events.0872.ptv_close_spectator: "Souboj je stále velmi vyrovnaný! Vítězem může být kterýkoli ze soutěžících."
 contest_events.0872.ptv_top: "V tomto boji mám slušný náskok. Stačí se udržet ještě několik okamžiků..."
 contest_events.0872.ptv_top_spectator: "[pivotal_contestant.GetFirstName|U] vede! K vítězství už jistě zbývá jen pár okamžiků..."
 contest_events.0872.ptv_bottom: "Prohrávám, a to výrazně. Musím rychle něco udělat!"
 contest_events.0872.ptv_bottom_spectator: "[pivotal_contestant.GetFirstName|U] prohrává, a to výrazně. Musí rychle něco udělat!"
 contest_events.0872.ptv_top_half: "Vedu, ale v souboji musím svou převahu využít hned, jinak toho budu litovat."
 contest_events.0872.ptv_top_half_spectator: "[pivotal_contestant.GetFirstName|U] vede, ale při souboji se to může kdykoli změnit..."
 contest_events.0872.ptv_bottom_half: "Prohrávám tento souboj. Možná ne o moc, ale musím brzy něco udělat..."
 contest_events.0872.ptv_bottom_half_spectator: "[pivotal_contestant.GetFirstName|U] prohrává. Možná ne o moc, ale musí rychle něco udělat."
 contest_events.0872.ptv_fallback: "Meče se znovu střetnou, ocel zvoní o ocel."
 contest_events.0872.spectator: "\n\nZnovu se vrhají proti sobě a v denním světle létají jasné jiskry. Z davu se ozývá lapání po dechu stejně často jako údery čepelí."
 contest_events.0872.final: "Sténání, řinčení, výkřiky davu. Drsný doprovod závěru tohoto souboje."
 contest_events.0872.winner_start: "Cítím vítězství a spěchám jej ukořistit dřív, než se [versus_contestant.GetFirstName] vzpamatuje."
 contest_events.0872.loser_start: "[versus_contestant.GetFirstName|U] náhle změní taktiku a já cítím, že konec je blízko."
 contest_events.0872.winner_yield: "Pod záplavou mých úderů soupeř slábne a sotva se stačí krýt, až nakonec ustoupí a vzdá se."
 contest_events.0872.winner_disarm: "Posledním úderem rychlé série zachytím silnou část [Select_CString(versus_contestant.IsFemale,'její','jeho')] čepele, vyrazím zbraň ze sevření a pošlu ji vířit do hlíny."
 contest_events.0872.loser_yield: "Sotva se stačím bránit [Select_CString(versus_contestant.IsFemale,'jejím','jeho')] přesným úderům a síly mi rychle ubývají. Zvednu paži a vzdám se, abych [Select_CString(ROOT.Char.IsFemale,'neprodlužovala','neprodlužoval')] nevyhnutelné."
 contest_events.0872.loser_disarm: "Ze všech sil se snažím krýt [Select_CString(versus_contestant.IsFemale,'její','jeho')] prudké údery, ale poslední nešikovně zachytí můj meč, vytrhne mi ho z ruky a srazí do hlíny."
 contest_events.0872.a: "Ještě jeden úder..."
 contest_events.0872.b: "Ještě jeden úder!"
 contest_events.0873.t: "$tournament_contest_header$ Koncovka"
 contest_events.0873.pivotal_success: "Neovládnu se a na okamžik se mi na tváři objeví úsměv, když soupeř padne přesně do mé pasti. O několik tahů později proměním získanou příležitost ve výhodu.\n\n"
 contest_events.0873.pivotal_neutral: "Soupeř mou past ignoruje, ale já si také všimnu té nastražené na mě a vyhnu se jí. Několik dalších napjatých tahů nepřinese výsledek ani jednomu z nás. Blížíme se ke konci a hra zůstává nerozhodná.\n\n"
 contest_events.0873.pivotal_failure: "Jakmile pustím figurku, vím, že jsem [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')] chybu. Soupeřova důmyslná past sklapne. Po několika dalších tazích je jasné, že mě má chyba uvrhla do nevýhody a do postavení, o které jsem vůbec [Select_CString(ROOT.Char.IsFemale,'nestála','nestál')].\n\n"
 contest_events.0873.ptv_close: "Jak tahle hra skončí, si může každý jen domýšlet. K vítězství chybí tak málo a chyby stojí tolik."
 contest_events.0873.ptv_top: "Vedu se slušným náskokem. Pokud svou výhodu dokážu důrazně využít, vítězství je jistě na obzoru!"
 contest_events.0873.ptv_top_spectator: "[pivotal_contestant.GetFirstName|U] vede se slušným náskokem. Pokud svou výhodu dokáže důrazně využít, vítězství je jistě na obzoru!"
 contest_events.0873.ptv_bottom: "Prohrávám a moje postavení se zhoršuje téměř každým tahem. K vítězství by teď byl potřeba skoro zázrak..."
 contest_events.0873.ptv_bottom_spectator: "[pivotal_contestant.GetFirstName|U] prohrává a [Select_CString(pivotal_contestant.IsFemale,'její','jeho')] postavení se zhoršuje téměř každým tahem. K vítězství by teď byl potřeba skoro zázrak..."
 contest_events.0873.ptv_top_half: "Vedu, ale ještě to není jisté. Jakákoliv chyba by mohla být osudná."
 contest_events.0873.ptv_top_half_spectator: "[pivotal_contestant.GetFirstName|U] vede, ale ještě není nic jisté. Každá chyba se může draze vymstít."
 contest_events.0873.ptv_bottom_half: "Prohrávám, ale moje postavení ještě není beznadějné. Kdybych jen [Select_CString(ROOT.Char.IsFemale,'našla','našel')] skulinu..."
 contest_events.0873.ptv_bottom_half_spectator: "[pivotal_contestant.GetFirstName|U] prohrává, ale postavení ještě není beznadějné. Kdyby jen [Select_CString(pivotal_contestant.IsFemale,'našla','našel')] skulinu..."
 contest_events.0873.ptv_fallback: "Postavení na desce je čím dál spletitější, a přesto v něčem jednodušší, jak se uzavírají možné cesty a strategie."
 contest_events.0873.spectator: "\n\nČela se svrašťují, jak hra neúprosně pokračuje. Přihlížející zachovávají napjaté ticho, aby nerušili, nebo ještě hůř, neprozradili tah, který by mohl pomoci jejich favoritovi."
 contest_events.0873.final: "Další tiché klapnutí, další duševní vypětí. Koncovka je v plném proudu."
 contest_events.0873.winner_start: "Brzy je jasné, že [versus_contestant.GetFirstName] už nemá cestu zpět."
 contest_events.0873.loser_start: "O chvíli později mi konečně dojde, jak nebezpečné je mé postavení. [versus_contestant.GetFirstName|U] mě od začátku [Select_CString(versus_contestant.IsFemale,'lákala','lákal')] do pasti!"
 contest_events.0873.winner_surprise: "[Select_CString(versus_contestant.IsFemale,'Padla','Padl')|U] přímo do mé pasti a mého pečlivě připraveného závěru si [Select_CString(versus_contestant.IsFemale,'nevšimla','nevšiml')]. Nenuceným gestem položím na desku svůj poslední tah."
 contest_events.0873.winner_grind: "Pomalu [Select_CString(versus_contestant.IsFemale,'ji','ho')] udolávám a neodvratně směřuji k vítězství, zatímco [Select_CString(versus_contestant.IsFemale,'její','jeho')] postavení slábne, zvolna, ale nenávratně."
 contest_events.0873.loser_surprise: "Půl hry mě [Select_CString(versus_contestant.IsFemale,'lákala','lákal')] do pasti a [Select_CString(versus_contestant.IsFemale,'vyčkávala','vyčkával')], zatímco já [Select_CString(ROOT.Char.IsFemale,'chybovala','chyboval')]. Teď už není úniku."
 contest_events.0873.loser_grind: "Každý můj tah je zřejmě kompromis. Kousek po kousku ustupuji před [Select_CString(versus_contestant.IsFemale,'její','jeho')] lepší hrou. Mé postavení se až příliš brzy stává neudržitelným."
 contest_events.0873.a: "Zbylo jen pár tahů..."
 contest_events.0873.b: "Zbylo jen pár tahů!"
 contest_events.1100.t: "$activity_tournament$: Příležitost v chaosu"
 contest_events.1100.desc: "Proplétám se chaotickou vřavou, která pohlcuje [CZProvNameNoTooltip(activity.GetCurrentPhase.GetLocation,'A')], uhýbám přátelům i nepřátelům a konečně spatřím [murder_actor.Custom2('CZ_RelationToMeShort_A', murder_target)|l], [murder_target.Custom('CZ_TitledFirstName_A')]. A [Select_CString(murder_target.IsFemale,'ještě je ke mně otočená','ještě je ke mně otočený')] zády!\n\nBlížím se bez povšimnutí, protože veškerou [Select_CString(murder_target.IsFemale,'její','jeho')] pozornost zaměstnává jiný protivník. V tomhle řevu a vířícím chaosu si mě nikdo nevšímá...\n\nTeď tě mám, [murder_target.Custom2('CZ_InsultNoun_V', ROOT.Char)|l]!"
 contest_events.1100.a: "Tomuhle uhni!"
 contest_events.1100.b: "Tohle není čestné..."
 contest_events.1101.t: "$contest_events.1100.t$"
 contest_events.1101.desc: "Vrhnu se k [Select_CString(murder_target.IsFemale,'ní','němu')], rychle překonám vzdálenost a zbraň nad hlavou se mihne. Je to [murder_actor.Custom('signature_weapon')|l], se kterou udeřím vší silou!"
 contest_events.1101.miss: "\n\nPrávě v tu chvíli [murder_target.Custom2('InsultAdjective', ROOT.Char)|l] [Select_CString(murder_target.IsFemale,'sokyně','sok')] uhne před výpadem svého druhého soka a moje zbraň, [murder_actor.Custom('signature_weapon')|l], udeří do hlíny.\n\nRychle se vzpamatuji, zatímco [murder_target.GetTitledFirstName] zavyje: „[Select_CString(murder_actor.IsFemale,'Ty ubohá parchantko!','Ty ubohý parchante!')]“ [Select_CString(murder_target.IsFemale,'Její','Jeho')|U] zamračená tvář mizí ve vřavě, když se stáhneme do obrany."
 contest_events.1101.wound: "\n\nPrávě když můj úder zasáhne [Select_CString(murder_target.IsFemale,'její','jeho')] přilbu, se soupeř trochu pohne a má zbraň, [murder_actor.Custom('signature_weapon')|l], sjede šikmo stranou.\n\n[murder_target.GetTitledFirstName|U] se s bolestným výkřikem otáčí ke mně a oči se [Select_CString(murder_target.IsFemale,'jí','mu')] rozšiřují poznáním.\n\nZaslechnu zasténání „[murder_actor.Custom2('CZ_InsultNoun_V', SCOPE.sC('murder_target'))|U]!“, pak se zhroutí a bouře boje nás oddělí."
 contest_events.1101.kill: "\n\nMůj úder přesně zasáhne [Select_CString(murder_target.IsFemale,'její','jeho')] přilbu, která zazvoní jako zvon. [murder_target.Custom2('InsultNoun', ROOT.Char)|U] se svalí do hlíny jako pytel brambor.\n\n[Select_CString(murder_target.IsFemale,'Její','Jeho')|U] protivník mi zavrčí poděkování, ale vzápětí se mu po tváři rozlije znepokojení. Než nás rozbouřený dav oddělí, zahlédnu oči [murder_target.Custom('CZ_TitledFirstName_G')]. Nejeví ani náznak poznání."
 contest_events.1101.a: "„Dávej si pozor na záda, [murder_target.Custom2('CZ_InsultNoun_V', ROOT.Char)|l]!“"
 contest_events.1101.b: "„[murder_target.Custom2('CZ_InsultNoun_V', ROOT.Char)|U], ty máš ale štěstí!“"
 contest_events.1101.c: "„[murder_target.Custom2('CZ_InsultNoun_V', ROOT.Char)|U]!“"
 contest_events.1102.t: "$contest_events.1100.t$"
 contest_events.1102.desc: "Uprostřed přátel i nepřátel se ze všech sil snažím zachovat chladnou hlavu v bitevní vřavě, která se valí přes [CZProvNameNoTooltip(activity.GetCurrentPhase.GetLocation,'A')]. Odrážím údery odhodlaného protivníka."
 contest_events.1102.miss: "\n\nKdyž uhnu jednomu takovému výpadu, zezadu zasviští [murder_actor.Custom('signature_weapon')|l] a mine mě o vlásek. Ustoupím od obou protivníků a poznávám, komu zbraň patří. Nikomu jinému než [murder_actor.Custom('CZ_TitledFirstName_D')]! [Select_CString(murder_actor.IsFemale,'Její','Jeho')|U] zamračená tvář už mizí v davu!"
 contest_events.1102.wound: "\n\nNáhle mě zaskočí neobratný, ale odhodlaný úder zezadu. Sjede po mé přilbě a já zavrávorám.\n\nS bolestným výkřikem se otočím a spatřím [murder_actor.Custom('CZ_TitledFirstName_A')], jak mizí v chaosu davu. Zjevně [Select_CString(murder_actor.IsFemale,'rozmrzelá','rozmrzelý')], že mi [Select_CString(murder_actor.IsFemale,'neublížila','neublížil')] víc. Pak se zhroutím."
 contest_events.1102.kill: "\n\nVzápětí mi otupí smysly a v uších zazvoní. Země mi pomalu letí vstříc, když se hroutím a padám na drsný povrch. Zahlédnu [Select_CString(murder_actor.IsFemale,'její','jeho')] tvář, ale nedokážu si nic spojit. Pak svět pohltí tma."
 contest_events.1102.a: "Ty ubohý parchante!"
 contest_events.1102.b: "[ROOT.Char.Custom2('CZ_InsultNoun_V', ROOT.Char)|U]!"
 contest_events.1102.c: "#weak *bublání*#!"
 contest_events.1110.t: "Šance udeřit"
 contest_events.1110.desc: "Trpělivě jsem [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')] na příležitost skolit [murder_target.Custom('CZ_TitledFirstName_A')] a teď možná přichází má chvíle.\n\nSoutěž [activity.GetCurrentPhase.GetPhase.GetName|l] poskytne výbornou zástěrku pro drobnou nehodu..."
 contest_events.1110.a: "Uhni #EMP tomuhle#!!"
 contest_events.1110.b: "To už je moc!"
 contest_events.1131.t: "$tournament_contest_header$ Souboj na život a na smrt"
 contest_events.1131.team: "Ačkoli [ROOT.Char.Custom2('RelationToMeShort', portrait_scope)|l], [portrait_scope.GetTitledFirstName], [portrait_scope.Custom2('InsultNoun', ROOT.Char)|l], [Select_CString(portrait_scope.IsFemale,'byla zařazena','byl zařazen')] do mého týmu, si navzájem rozumíme beze slov, když se uchýlím do uličky popadnout dech a zůstanu s [Select_CString(portrait_scope.IsFemale,'ní','ním')] o samotě."
 contest_events.1131.enemy: "Běžím přes [CZProvNameNoTooltip(activity.GetCurrentPhase.GetLocation,'A')] a dělám průzkum před svým týmem. Zahnu za roh a ocitnu se tváří v tvář s [ROOT.Char.Custom2('CZ_RelationToMeShort_I', portrait_scope)|l], [portrait_scope.Custom('CZ_TitledFirstName_I')], na průzkumu za soupeřův tým."
 contest_events.1131.desc: "\n\nV [Select_CString(portrait_scope.IsFemale,'jejím','jeho')] výrazu vidím stejné odhodlání, stejnou nenávist, jakou musí vidět v mém...\n\nZ toho vede jediná cesta ven."
 contest_events.1131.win: "Přemůžeš [portrait_scope.Custom('CZ_FirstNameNoTooltip_A')]"
 contest_events.1131.lose: "[portrait_scope.GetFirstNameNoTooltip|U] tě přemůže"
 contest_events.1131.a: "#EMP Zemři!#!"
 contest_events.1131.b: "Arghghgh!"
 contest_events.1131.b.flavor: "#EMP PRYČ ODSUUUUD!#!"
 contest_events.1133.t: "$contest_events.1131.t$"
 contest_events.1133.fled_both: "Otočím se a běžím, co mi nohy stačí, a křikem přivolávám svůj tým.\n\nTeprve na konci ulice se ohlédnu a v dálce spatřím [portrait_scope.Custom('CZ_FirstName_A')], [Select_CString(portrait_scope.IsFemale,'stejně zahanbenou','stejně zahanbeného')] jako já.\n\nJá nic nepovím, když [Select_CString(portrait_scope.IsFemale,'ona','on')] také ne..."
 contest_events.1133.chase_team: "Než stihnu zareagovat, [portrait_scope.GetFirstName] se rozběhne pryč a pronikavě volá naše spoluhráče o pomoc."
 contest_events.1133.chase_enemy: "Než stihnu zareagovat, [portrait_scope.GetFirstName] se rozběhne pryč a pronikavě volá své spoluhráče o pomoc."
 contest_events.1133.fled_team: "Vyrazím k východu, běžím přímo k ostatním členům týmu a hledám bezpečí za jejich štíty."
 contest_events.1133.fled_enemy: "Vyrazím k východu, sprintuji k ostatním členům svého týmu a křičím o pomoc."
 contest_events.1133.fled: "\n\nNa konci ulice se ohlédnu a vidím, že to [portrait_scope.GetFirstName] [Select_CString(portrait_scope.IsFemale,'vzdala','vzdal')]. Lapá po dechu a probodává mě pohledem."
 contest_events.1133.chase: "\n\nJe rychlejší, než vypadá. Když to s těžkým oddechováním vzdám, je už na konci ulice..."
 contest_events.1133.fight: "Jako bychom si četli myšlenky, společně vyrazíme do útoku. [portrait_scope.Custom('CZ_FirstNamePossessive_M')|U] meč i můj zuřivě zasahují a odrážejí rány."
 contest_events.1133.nothing: "\n\nPříchod ostatních boj rychle ukončí. Zbývá nám jen zlostně na sebe hledět přes uličku."
 contest_events.1133.wound_self_fled: "\n\nTěsně než se dostanu mimo dosah, mě škrábne. Naštěstí víc nestihne..."
 contest_events.1133.wound_self: "\n\n[portrait_scope.Custom2('InsultNoun', ROOT.Char)|U] získá převahu a nečekaně mě zraní, než dorazí ostatní."
 contest_events.1133.wound_enemy_fled: "\n\nStihnu [Select_CString(portrait_scope.IsFemale,'ji','ho')] jen škrábnout, než se dostane z dosahu a odkulhá ke svým druhům. [Select_CString(portrait_scope.IsFemale,'Zbabělkyně','Zbabělec')|U]..."
 contest_events.1133.wound_enemy: "\n\nV záplavě jisker spatřím příležitost a hluboce [Select_CString(portrait_scope.IsFemale,'ji','ho')] škrábnu, než se vzpamatuje. Než však můžeme pokračovat, dorazí ostatní..."
 contest_events.1133.kill_fled: "\n\nPři útěku [portrait_scope.Custom2('InsultAdjective', ROOT.Char)|l] protivník nešikovně uklouzne a padne na zem. Je po všem dřív, než stačí doznít [Select_CString(portrait_scope.IsFemale,'její','jeho')] výkřik prosící o milost..."
 contest_events.1133.kill: "\n\nNáš zběsilý střet se rozzuří jako uragán, ve víru řinčící oceli a žhavých jisker. Náhle při kroku získám výhodu vyvýšeného místa a je nám jasné, že je konec. Stejně rychle, jako to začalo."
 contest_events.1133.a.both_fled: "Ehm."
 contest_events.1133.a.wound: "Ty máš ale štěstí! Ještě tě dostanu!"
 contest_events.1133.a.kill: "Je konec."
 contest_events.1133.a: "To bylo těsné..."
 contest_events.1520.t: "$tournament_contest_header$ Tragédie u terčů"
 contest_events.1520.opening: "Přistoupím k čáře, vytáhnu ze sudu šíp a opatrně napnu luk. Po dříku hledím na vzdálený terč.\n\nPrávě ve chvíli, kdy se rozhodnu a povolím sevření, zpoza terče náhle vystoupí postava!"
 contest_events.1520.skilled: "Šíp letí přesně, přímo na ni!\n\n"
 contest_events.1520.unskilled: "Šíp letí mimo, terč určitě nezasáhne, ale míří přímo na tu postavu!\n\n"
 contest_events.1520.desc: "Diváci zalapají po dechu. Po zdánlivé věčnosti se postava se slabým zasténáním zhroutí. Sluha brzy potvrdí nejhorší: ten člověk je mrtvý. Za #EMP tenhle#! šíp žádné body nebudou..."
 contest_events.1520.a: "O rodinu se postarám."
 contest_events.1520.b: "Nenechme si tím zkazit zábavu."
 contest_events.1520.c: "Myslím, že pro dnešek mám lukostřelby dost..."
 contest_events.1521.t: "$contest_events.1520.t$"
 contest_events.1521.desc: "[contestant.GetTitledFirstName|U] přistoupí k čáře, vytáhne ze sudu šíp a opatrně napne luk. S jedním okem přimhouřeným hledá správný směr k terči.\n\nPrávě když vypustí šíp, zpoza terče náhle vystoupí silueta!\n\n"
 contest_events.1521.resigned: "\n\n[contestant.GetFirstNameNoTooltip|U] z úcty k nešťastné oběti dobrovolně odstupuje z lukostřelecké soutěže."
 contest_events.1521.dismissed: "\n\n[contestant.GetFirstNameNoTooltip|U] nehodu rychle odbude a netrpělivě čeká na další výstřel."
 contest_events.1521.compensated: "\n\n[contestant.GetFirstNameNoTooltip|U] [Select_CString(contestant.IsFemale,'vyplatila','vyplatil')] rodině zesnulého malý příspěvek z vlastní kapsy."
 contest_events.1521.a: "Tragické."
 contest_events.1530.t: "$tournament_contest_header$ Hřebík na hlavičku"
 contest_events.1530.desc: "Několikrát napnu tětivu, abych se [Select_CString(ROOT.Char.IsFemale,'rozhýbala','rozhýbal')], a zhluboka se nadechnu.\n\nSoustředím všechny síly, napnu luk vzhůru a pomalu ho spouštím do roviny s terčem. Jakmile šíp opustí mé prsty, instinktivně cítím, že tohle je dobrý výstřel.\n\nZa okamžik to potvrdí uspokojivé cinknutí: [Select_CString(ROOT.Char.IsFemale,'trefila','trefil')] jsem hřebík v terči přímo na hlavičku!"
 contest_events.1530.a: "Ano!"
 contest_events.1531.t: "$contest_events.1530.t$"
 contest_events.1531.desc: "[contestant.GetTitledFirstName|U] několikrát napne tětivu, rozhýbe se a zhluboka se nadechne.\n\nS naprostým soustředěním zvedne napnutý luk a pomalu ho spouští do roviny s terčem. Jakmile šíp opustí [Select_CString(contestant.IsFemale,'její','jeho')] prsty, je jasné, že tohle je dobrý výstřel.\n\nZa okamžik to potvrdí uspokojivé cinknutí: hřebík v terči dostal zásah přímo na hlavičku!"
 contest_events.1531.a: "Štěstíčko..."
 contest_events.1540.t: "$tournament_contest_header$ Špatný den"
 contest_events.1540.desc: "Sebevědomě uchopím šíp, zaujmu místo před terčem a nasávám atmosféru. Dav ztichne, zatímco doladím postoj a nasadím šíp.\n\nPrvní střela mine o vlásek a zaboří se do hliněného valu. Druhá zasviští daleko nad terčem. Třetí kvůli špatnému vypuštění dopadne pár kroků ode mě.\n\n"
 contest_events.1540.unskilled: "Dav se chichotá, když se vracím, a já nedokážu skrýt své rozladění. Potřebuji víc cviku..."
 contest_events.1540.sabotage: "Vůbec tomu nerozumím! Při tréninku se do terče trefím. Ledaže... Podezíravě si prohlížím luk..."
 contest_events.1540.a: "Tak to prostě je."
 contest_events.1541.t: "$contest_events.1540.t$"
 contest_events.1541.desc: "[contestant.GetTitledFirstName|U] sebevědomě uchopí šíp a zaujme místo před terčem. Dav ztichne, zatímco si doladí postoj a nasadí šíp.\n\nPrvní střela mine o vlásek a zaboří se do hliněného valu. Druhá zasviští daleko nad terčem. Třetí kvůli špatnému vypuštění dopadne pár kroků od [Select_CString(contestant.IsFemale,'ní','něj')].\n\n"
 contest_events.1541.unskilled: "Dav se chichotá, když se vrací a marně skrývá rozmrzelost. Chce to víc cviku!"
 contest_events.1541.sabotage: "[contestant.GetTitledFirstNameNoTooltip|U] je zjevně [Select_CString(contestant.IsFemale,'bezradná','bezradný')]. „Vůbec tomu nerozumím! Tak [Select_CString(contestant.IsFemale,'špatná','špatný')] přece nejsem!“ zakňourá a podezíravě si prohlíží luk."
 contest_events.1541.a: "Stává se."
 contest_events.1550.t: "$tournament_contest_header$ [contestant.GetFirstNameNoTooltip|U] Hood"
 contest_events.1550.desc: "Dav ztichne, když [contestant.GetTitledFirstName] nasadí první šíp. Všichni napjatě sledují, zda je [Select_CString(contestant.IsFemale,'tato žena skutečně tak dobrá','tento muž skutečně tak dobrý')], jak naznačují pověsti kolující po turnaji.\n\n"
 contest_events.1550.good: "Ani ty nejdivočejší pověsti nemohou dostát [Select_CString(contestant.IsFemale,'jejímu','jeho')] výkonu. Jako při tanci posílá jeden šíp za druhým bez námahy do středu terče, štípe vlastní dříky a přivádí dav do vytržení."
 contest_events.1550.normal: "Navzdory všem řečem jde o zcela průměrnou lukostřelbu. Není co vytknout, ale [Select_CString(contestant.IsFemale,'její','jeho')] skóre není nic, čím se chlubit. Vyrovnají se mu i někteří z nejméně zkušených soutěžících."
 contest_events.1550.bad: "Po otřesné přehlídce chybných výstřelů a přehmatů jsou diváci pořádně zklamaní. Člověk by klidně pochyboval, jestli [Select_CString(contestant.IsFemale,'tato žena vůbec někdy držela','tento muž vůbec někdy držel')] luk v ruce, natož z něj [Select_CString(contestant.IsFemale,'střílela','střílel')]."
 contest_events.1550.a: "Bravo!"
 contest_events.1550.a.good: "Ohromující."
 contest_events.1550.a.bad: "Zklamání."
 contest_events.1550.b: "Musím se s [Select_CString(contestant.IsFemale,'ní','ním')] setkat!"
 contest_events.1550.b.tt: "Pokusíš se promluvit s [contestant.Custom('CZ_FirstName_I')]"
 contest_events.1550.c: "Hmpf."
 contest_events.1550.d: "Někdo nás pěkně vodil za nos."
 contest_events.1553.t: "$contest_events.1550.t$"
 contest_events.1553.desc: "Když moji sluhové přivedou [contestant.Custom('CZ_FirstName_A')], [marshal.GetTitledFirstName] náhle vybuchne: „Hej! Tebe znám! Chyťte [Select_CString(contestant.IsFemale,'ji','ho')]!“\n\n„[Select_CString(contestant.IsFemale,'Tahle žena je vůdkyní','Tenhle muž je vůdcem')|U] místní loupežnické bandy, [ROOT.Char.Custom('FormOfAddressForLiege')|l]!“ rozohní se [marshal.GetFirstName]. „Ukrývají se [CZTerrainIn(activity.GetCurrentPhase.GetLocation)|l], kradou dobytek a okrádají nevinné pocestné.“\n\n„Lži!“ odsekne [Select_CString(contestant.IsFemale,'lučištnice','lučištník')] vzdorně. „Vracíme kořist boháčů právoplatným vlastníkům: lidu!“"
 contest_events.1553.a: "Zavřete [Select_CString(contestant.IsFemale,'ji','ho')]!"
 contest_events.1553.b: "Veřejná poprava to vyřeší."
 contest_events.1553.c: "Uděluji ti milost, [contestant.Custom('CZ_FirstNameNoTooltip_V')]. Nepromarni ji."
 contest_events.1553.d: "Zaplať za své zločiny službou pro mě."
 contest_events.1554.t: "$contest_events.1550.t$"
 contest_events.1554.desc: "Sluhové, které jsem [Select_CString(ROOT.Char.IsFemale,'poslala','poslal')] pro [contestant.Custom('CZ_FirstName_A')], se vracejí zmatení.\n\nZdá se, že [Select_CString(contestant.IsFemale,'lučištnice spěšně opustila','lučištník spěšně opustil')] turnajiště hned po vystřílení posledního šípu. Od té doby po [Select_CString(contestant.IsFemale,'ní','něm')] není ani stopy..."
 contest_events.1554.a: "Co to..."
 contest_events.3000.t: "$tournament_contest_header$ Hromadná srážka"
 contest_events.3000.desc: "Jezdec [contestant_1.Custom('CZ_FirstName_G')] se žene po trati.\n\nNa poslední chvíli neobratně vybočí a smýkne se v hlíně. Jezdci koní [contestant_2.Custom('CZ_FirstName_G')] a [contestant_3.Custom('CZ_FirstName_G')] už nemají čas zastavit!\n\nVzduch naplní společný úlek davu ještě dřív, než se všichni tři koně i s jezdci srazí.\n\n"
 contest_events.3000.a: "Au."
 contest_events.3000.b: "„[contestant_1.Custom('CZ_FirstNameNoTooltip_V')|U]! Jak jsi to [Select_CString(contestant_1.IsFemale,'mohla','mohl')] dopustit?!“"
 contest_events.3010.t: "$tournament_contest_header$ Nešikovný žokej"
 contest_events.3010.desc: "Pozorovat jezdce [enemy_competitor.Custom('CZ_Name_G')] v sedle je jako sledovat balvan valící se přes náves. Jezdí jako naprostý šílenec a můj vlastní jezdec, [jockey.GetFirstName], se bohužel stává obětí jeho surové a nemotorné jízdy.\n\nZa bolestného zařehtání a ošklivého zapraskání narazí můj kůň do ohrady trati. Jsem si [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')], že [jockey.Custom('CZ_FirstNamePossessiveNoTooltip_F')] noha je zraněná."
 contest_events.3010.a: "„Tohle očividně porušuje pravidla!“"
 contest_events.3010.a.success: "Přesvědčíš rozhodčího, aby penalizoval žokeje"
 contest_events.3010.a.failure: "Nepodaří se ti přesvědčit rozhodčího"
 contest_events.3010.b: "Přimhouřím oko."
 contest_events.3020.t: "$tournament_contest_header$ Vlídný žokej"
 contest_events.3020.desc: "Prostí lidé přihlížející dostihu nijak netají, komu fandí. Na jezdce [enemy_competitor.Custom('CZ_Name_G')] hledí s láskou i obdivem. Při dusotu koní omdlévají a jásají, když [enemy_competitor.GetFirstNameNoTooltip] před davem svého jezdce vychvaluje. [Select_CString(enemy_competitor.IsFemale,'Sama majitelka','Sám majitel')|U] sleduje závod samolibě, s vědomím, že [Select_CString(enemy_competitor.IsFemale,'její','jeho')] jezdec má bezvýhradnou podporu davu.\n\nNapadá mě, zda bych s trochou povzbuzení [Select_CString(ROOT.Char.IsFemale,'nedokázala','nedokázal')] obrátit pozornost davu na #EMP svého#! jezdce, [jockey.Custom('CZ_FirstName_A')]."
 contest_events.3020.a: "„Pohleďte! Můj udatný jezdec!“"
 contest_events.3020.a.success: "Přesměruješ pozornost davu na svého jezdce"
 contest_events.3020.a.failure: "Dav není ohromen"
 contest_events.3020.b: "„Ty si umíš vybrat, [enemy_competitor.Custom('CZ_FirstNameNoTooltip_V')].“"
 contest_events.3020.c: "Po závodě si s [Select_CString(enemy_competitor.IsFemale,'ní','ním')] pořádně užiji v posteli."
 contest_events.3030.t: "$tournament_contest_header$ Jak [Select_CString(naked_peasant.IsFemale,'ji','ho')] [ROOT.Char.GetFaith.CreatorName] tvoří"
 contest_events.3030.desc: "Koně se chystají k závodu a celý dav jásá a skanduje jméno svého favorita. Pak ale všichni naráz zalapají po dechu a ztichnou. Na trať vběhne [Select_CString(naked_peasant.IsFemale,'nahá žena','nahý muž')] a od hlavy k patě předvádí vše, čím [Select_CString(naked_peasant.IsFemale,'ji','ho')] [ROOT.Char.GetFaith.CreatorName] obdarovává.\n\nDav na tuto impulzivní bytost okamžitě začne bučet a házet po [Select_CString(naked_peasant.IsFemale,'ní','něm')] všechno, co mu přijde pod ruku."
 contest_events.3030.a: "Odporné! Stráže!"
 contest_events.3030.b: "Ha! To je podívaná!"
 contest_events.3030.c: "Přidám se k [Select_CString(naked_peasant.IsFemale,'ní','němu')]! Tohle vypadá zábavně!"
 contest_events.3030.d: "Nahota není hřích!"
 contest_events.3030.a.success: "Přesvědčíš dav"
 contest_events.3030.a.failure: "Dav zůstává lhostejný"
 contest_events.3030.e: "Ať [Select_CString(naked_peasant.IsFemale,'ji','ho')] rozdupou koně."
 contest_events.0840.t: "Souboj v soutěži [activity.GetCurrentPhase.GetPhase.GetName|l]"
 contest_events.0840.desc: "[versus_contestant.GetTitledFirstName|U] a já bojujeme!"
 contest_events.0840.a: "Udatnost"
 contest_events.0840.b: "Pletichářství"
 contest_events.0840.c: "Učenost"
 contest_events.0841.t: "Souboj v soutěži [activity.GetCurrentPhase.GetPhase.GetName|l]: [activity.Custom('GetVersusRound')|l]"
 contest_events.0841.desc: "Když s [versus_contestant.Custom('CZ_TitledFirstName_I')] dokončíme poslední souboj, tajím dech, zatímco se počítají body...\n\n"
 contest_events.0841.winner: "[Select_CString(ROOT.Char.IsFemale,'Porazila','Porazil')|U] jsem [versus_contestant.Custom('CZ_TitledFirstName_A')]!"
 contest_events.0841.loser: "Rozhodčí brzy oznámí, že mě [versus_contestant.GetTitledFirstNameNoTooltip] [Select_CString(versus_contestant.IsFemale,'porazila','porazil')]!"
 contest_events.0841.qualify_win: "\n\nPostupuji do semifinále soutěže [activity.GetCurrentPhase.GetPhase.GetName|l]!"
 contest_events.0841.qualify: "\n\n[Select_CString(contest_winner.IsFemale,'Ona','On')|U] postupuje do semifinále soutěže [activity.GetCurrentPhase.GetPhase.GetName|l]!"
 contest_events.0841.semi_win: "\n\nPostupuji do finále soutěže [activity.GetCurrentPhase.GetPhase.GetName|l]!"
 contest_events.0841.semi: "\n\n[Select_CString(contest_winner.IsFemale,'Ona','On')|U] postupuje do finále soutěže [activity.GetCurrentPhase.GetPhase.GetName|l]!"
 contest_events.0841.final_win: "\n\n[Select_CString(ROOT.Char.IsFemale,'Vyhrála','Vyhrál')|U] jsem soutěž [activity.GetCurrentPhase.GetPhase.GetName|l]!"
 contest_events.0841.final: "\n\n[Select_CString(contest_winner.IsFemale,'Ona vyhrála','On vyhrál')|U] soutěž [activity.GetCurrentPhase.GetPhase.GetName|l]!"
 contest_events.0841.a: "Pěkný boj."
 contest_events.0841.b: "Sakra..."
 contest_events.0841.c: "[Select_CString(contest_winner.IsFemale,'Podváděla','Podváděl')|U]! Diskvalifikovat!"
 contest_events.0850.t: "$contest_events.0840.t$"
 contest_events.0850.desc: "$contest_events.0840.t$"
 contest_events.0850.a: "$contest_events.0840.t$"
 contest_events.0852.t: "$contest_events.0840.t$"
 contest_events.0852.desc: "No teda, kdo vyhrál?"
 contest_events.0852.a: "Dobře"
 contest_events.0853.t: "$contest_events.0852.t$"
 contest_events.0853.desc: "$contest_events.0852.desc$"
 contest_events.0853.a: "$contest_events.0852.a$"
 contest_events.0910.t: "$tournament_contest_header$ Bez zábran"
 contest_events.0910.melee: "Krev mi vře při pohledu na rytíře, kteří buší do soupeřů, zatímco každou mou příležitost ke slávě zmaří spoluhráč nebo ukvapený ústup.\n\nKonečně mi [wrathful_victim.GetTitledFirstName] padne do bláta k nohám. Příliš odvážný úder [Select_CString(wrathful_victim.IsFemale,'ji','ho')] vyvedl z rovnováhy a meč leží mimo dosah.\n\n„Málem jsi mě [Select_CString(wrathful_victim.IsFemale,'trefila','trefil')] do hlavy!“ zavrčím a probodnu [Select_CString(wrathful_victim.IsFemale,'ji','ho')] pohledem. [Select_CString(wrathful_victim.IsFemale,'Ta hlupačka je mi vydána','Ten hlupák je mi vydán')|U] na milost."
 contest_events.0910.wrestling: "S [wrathful_victim.Custom('CZ_TitledFirstName_I')] kolem sebe kroužíme snad celou věčnost a pečeme se pod poledním sluncem.\n\nPokaždé, když zaútočím, se mi na poslední chvíli vysmekne ze sevření. Dochází mi trpělivost.\n\nPrávě když se na tu svini chystám vrhnout, [wrathful_victim.GetFirstNameNoTooltip] klopýtne a zcela se odkryje útoku."
 contest_events.0910.duel: "$contest_events.0910.melee$"
 contest_events.0910.a: "Já ti dám za vyučenou, ty ubohé malé...!"
 contest_events.0910.b: "Vstávej, skrčku!"
 contest_events.0911.t: "$contest_events.0910.t$"
 contest_events.0911.wrathful: "Podlehnu hněvu a neúprosně buším do [wrathful_victim.Custom('CZ_FirstName_G')], zatímco se snaží přestát mé rány.\n\n"
 contest_events.0911.melee: "Soutěž [activity.GetCurrentPhase.GetPhase.GetName|l] náhle ustane. Všichni přítomní zírají, jak [wrathful_contestant.GetFirstName] s řevem srazí [wrathful_victim.Custom('CZ_FirstName_A')] k zemi a zuřivě do [Select_CString(wrathful_victim.IsFemale,'ní','něj')] buší.\n\n"
 contest_events.0911.wrestling: "Krátce po začátku zápasu v soutěži [activity.GetCurrentPhase.GetPhase.GetName|l] [wrathful_contestant.GetTitledFirstName] ztratí s [wrathful_victim.Custom('CZ_TitledFirstName_I')] trpělivost. Přestane se zcela ovládat a srazí [Select_CString(wrathful_victim.IsFemale,'ji','ho')] k zemi.\n\n"
 contest_events.0911.duel: "$contest_events.0911.melee$"
 contest_events.0911.dead: "Teprve když mě odtrhnou a rudá mlha před očima se rozplyne, uvědomím si, že jsem [Select_CString(ROOT.Char.IsFemale,'zašla','zašel')] příliš daleko..."
 contest_events.0911.wound: "Když mě od [Select_CString(wrathful_victim.IsFemale,'ní','něj')] odtrhnou, je jasné, že prožívá obrovskou bolest."
 contest_events.0911.angry_host: "To je nepřijatelné!"
 contest_events.0911.host: "To je nešťastné."
 contest_events.0911.a.dead: "Nešťastná tragédie..."
 contest_events.0911.a.wound: "Na to jen tak nezapomeneš!"
 contest_events.0911.a: "Tak to chodí u silných."
 contest_events.0911.c.dead: "Spravedlivá reakce..."
 contest_events.0911.c: "No teda..."
 contest_events.0912.dead: "Když [wrathful_contestant.Custom('CZ_FirstNameNoTooltip_A')] konečně odtrhnou, je už pozdě. [wrathful_victim.GetFirstNameNoTooltip|U] [Select_CString(wrathful_victim.IsFemale,'je mrtvá','je mrtvý')]..."
 contest_events.0912.wound: "Když [wrathful_contestant.Custom('CZ_FirstNameNoTooltip_A')] odtrhnou od [Select_CString(wrathful_victim.IsFemale,'ní','něj')], je jasné, že [wrathful_victim.GetFirstNameNoTooltip] prožívá obrovskou bolest."
 contest_events.0912.b: "Takové výstřelky jsou nepřijatelné."
 contest_savagely_pummeled_log_title: "Surové zbití"
 contest_savagely_pummeled_log: "[CHARACTER.GetTitledFirstName|U] surově [Select_CString(CHARACTER.IsFemale,'zmlátila','zmlátil')] [TARGET_CHARACTER.Custom('CZ_TitledFirstName_A')]"
 contest_savagely_pummeled_death_log_title: "$contest_savagely_pummeled_log_title$"
 contest_savagely_pummeled_death_log: "[CHARACTER.GetTitledFirstName|U] surově [Select_CString(CHARACTER.IsFemale,'ubila','ubil')] [TARGET_CHARACTER.Custom('CZ_TitledFirstName_A')] k smrti"
 contest_events.4500.t: "$tournament_contest_header$ Tragický pád"
 contest_events.4500.desc: "Skoro skáču radostí, když vidím svého dostihového koně #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! držet krok v čelní skupině.\n\nKdyž se blíží ke konci dalšího kola, srdce se mi sevře. Moje zvíře, [ROOT.Char.Custom('ContestHorseRaceGender')|l], i s jezdcem náhle padá a mizí v prachu!\n\nOstatní projedou a jen těsně se vyhnou neštěstí. #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! se pak snaží postavit. Je jasné, že dál pokračovat nemůže..."
 contest_events.4500.unskilled: "Není to sice nejlepší kůň, ale tahle ostuda pošpiní mou pověst chovatele dostihových koní..."
 contest_events.4500.sabotage: "Vůbec tomu nerozumím! #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! patří k nejlepším koním široko daleko! Ledaže... Podezíravě se zadívám na tribuny..."
 contest_events.4500.a: "Zatraceně."
 contest_horse_race_crashed_out_log_title: "Pád při dostihu"
 contest_horse_race_crashed_out_log: "Kůň [CHARACTER.Custom('CZ_TitledFirstName_G')], [CHARACTER.Custom('GetContestHorseRaceName')], upadl a odstoupil z dostihu"
 contest_events.4501.t: "$contest_events.1540.t$"
 contest_events.4501.desc: "[contestant.GetTitledFirstName|U] skáče radostí při pohledu na svého dostihového koně #EMP [contestant.Custom('GetContestHorseRaceName')]#!, který drží krok v čelní skupině.\n\nKdyž se blíží ke konci dalšího kola, [contestant.Custom('ContestHorseRaceGender')|l] i s jezdcem náhle padá a mizí v prachu! [contestant.GetFirstNameNoTooltip|U] [Select_CString(contestant.IsFemale,'je zdrcená','je zdrcený')].\n\nOstatní projedou a jen těsně se vyhnou neštěstí. #EMP [contestant.Custom('GetContestHorseRaceName')]#! se pak snaží postavit. Je jasné, že dál pokračovat nemůže...\n\n"
 contest_events.4501.unskilled: "Pochybuji, že v dohledné době ještě někdo vsadí na některého z koní [contestant.Custom('CZ_TitledFirstNameNoTooltip_G')]..."
 contest_events.4501.sabotage: "[contestant.GetTitledFirstNameNoTooltip|U] [Select_CString(contestant.IsFemale,'je zjevně bezradná','je zjevně bezradný')]. „Vůbec tomu nerozumím! #EMP [contestant.Custom('GetContestHorseRaceName')]#! patří k nejlepším koním široko daleko!“ zakvílí a podezíravě si prohlíží tribuny."
 contest_events.4501.a: "Stává se."
 contest_events.4600.t: "$tournament_contest_header$ Nadšené povzbuzování"
 contest_events.4600.desc: "Sleduji koně dunící kolem tribun a nasávám pach zvířeného prachu, řev davu a hluboký dusot mnoha kopyt.\n\n"
 contest_events.4600.wager_entrant: "I když jsem [Select_CString(ROOT.Char.IsFemale,'přihlásila','přihlásil')] vlastní zvíře, [ROOT.Char.Custom('ContestHorseRaceGender')|l] jménem [ROOT.Char.Custom('GetContestHorseRaceName')], sleduji koně [wager_owner.Custom('CZ_TitledFirstName_G')], #EMP [wager_owner.Custom('GetContestHorseRaceName')]#!, i s žokejem. Myslím na peníze, které můžu vyhrát..."
 contest_events.4600.wager: "Pozorně sleduji koně [wager_owner.Custom('CZ_TitledFirstName_G')]. Je to [wager_owner.Custom('ContestHorseRaceGender')|l] jménem #EMP [wager_owner.Custom('GetContestHorseRaceName')]#! a spolu s jezdcem ve mně živí sny o penězích, které můžu vyhrát..."
 contest_events.4600.entrant: "Moje zvíře, [ROOT.Char.Custom('ContestHorseRaceGender')|l] jménem #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!, drží s přibývajícími koly krok a jeho jezdec si s ostatními vede dobře."
 contest_events.4600.a: "Běž! Běž, ty stará kobylo!"
 contest_events.4600.b: "No tak, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!!"
 contest_events.4600.b.wager: "No tak, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!"
 contest_events.4600.c: "Klid..."
 contest_events.5000.t: "Rozpustilý recitál"
 contest_events.5000.desc: "[enemy.GetFirstName|U] na mě při výstupu na pódium vrhne samolibý úšklebek a brzy zjistím proč. Už první verš mě hrubě uráží a další nejsou jiné!\n\nV uších mi zní jásot a posměch davu. Nezbývá než odpovědět vlastní básní namířenou proti cti [enemy.Custom('CZ_FirstNameNoTooltip_G')]! Úvodní verš je naprosto zásadní.\n\n„#POE [enemy.GetFirstNameNoTooltip|U] veršům vládne zkrátka! Jenže...#!"
 contest_events.5000.shagged_your_mum: "#POE ...mně lůžko hřála [Select_CString(enemy.IsFemale,'její','jeho')] matka!“#!"
 contest_events.5000.shagged_your_dad: "#POE ...mně lůžko vyhřál [Select_CString(enemy.IsFemale,'její','jeho')] taťka!“#!"
 contest_events.5000.licentious: "#POE ...k milencům má vždy otevřená vrátka!“#!"
 contest_events.5000.stupid: "#POE ...[Select_CString(enemy.IsFemale,'její','jeho')] mysl je až žalostně krátká!“#!"
 contest_events.5000.ugly: "#POE ...[Select_CString(enemy.IsFemale,'její','jeho')] tvář je samá brázda, samá vráska!“#!"
 contest_events.5000.success: "Tvůj verš si získá dav"
 contest_events.5000.failure: "Tvůj verš nezabere"
 contest_events.5010.t: "Ztraceno v překladu"
 contest_events.5010.desc: "[enemy.GetFirstName|U] mě upřeně pozoruje, pořád se svitkem a brkem v ruce. Zhluboka se nadechne a začne chrlit naprosté nesmysly, kterým nemám naději porozumět.\n\nAť už říká cokoli, zjevně [Select_CString(enemy.IsFemale,'jí','mu')] na tom velmi záleží. Dál mě probodává pohledem, zatímco pár lidí ze ztichlého davu zalapá po dechu a šeptá. Nepochybně překládají verše přátelům."
 contest_events.5010.a: "Odpovím urážkou!"
 contest_events.5010.b: "Musím se pokusit porozumět."
 contest_events.5020.t: "Ctnostný verš"
 contest_events.5020.desc: "Dav huláká a jásá, když dokončuji své nejnovější vystoupení, báseň namířenou proti cti [enemy.Custom('CZ_FirstName_G')]. Všem má ukázat, oč větší je můj důvtip! Nikdo nepochybuje, kdo jasně vítězí, ale v naprosté euforii mě přepadne touha přednést obdivujícímu davu ještě jednu báseň."
 contest_events.5020.a: "Ještě jeden verš nemůže uškodit!"
 contest_events.5020.b: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] bych se uklonit a odejít."
 contest_events.5030.t: "Chabý limerik"
 contest_events.5030.desc: "Vítězoslavně si povzdechnu a dokončím poslední verš svého vystoupení. Připravuji se na hromový potlesk publika, ale turnajiště mlčí. Slyšet je jen vítr hvízdající v korunách stromů.\n\nTohle je katastrofa. Možná ji ale napraví nová báseň, složená a přednesená rovnou na místě."
 contest_events.5030.a: "„Mám ještě jednu!“"
 contest_events.5030.b: "Přiznám porážku."
 contest_events.5500.t: "$tournament_contest_header$ Zlomyslné rozptýlení"
 contest_events.5500.desc: "Ticho je ohlušující. [versus_contestant.GetTitledFirstName|U] už snad celou věčnost zvažuje další tah a pod svraštělým obočím upírá oči na desku hry [activity.Custom('ContestBoardGameType')|l].\n\n[Select_CString(versus_contestant.IsFemale,'Tahle žena','Tenhle muž')|U] chce očividně vyhrát.\n\nJakmile mě napadne [Select_CString(versus_contestant.IsFemale,'ji','ho')] rozptýlit, těžko tu myšlenku zaženu..."
 contest_events.5500.a: "Nějak mě šimrá v krku..."
 contest_events.5500.b: "Kéž bych se [Select_CString(ROOT.Char.IsFemale,'zbavila','zbavil')] toho zatraceného kašle..."
 contest_events.5500.success: "[versus_contestant.GetFirstNameNoTooltip|U] se obtížně soustředí"
 contest_events.5500.mixed: "Trochu to přeženeš"
 contest_events.5500.failure: "Málem se udusíš"
 contest_events.5500.nothing: "[versus_contestant.GetFirstNameNoTooltip|U] si toho nevšímá"
 contest_events.5500.c: "Ach, jak ta melodie toho trubadúra zněla?"
 contest_events.5500.d: "Laciné triky jsou pod mou úroveň."
 contest_events.5510.t: "$tournament_contest_header$ Záchvat vzteku u stolu"
 contest_events.5510.desc: "Stůl se s ohlušujícím #EMP prásknutím#! převrátí a figurky hry [activity.Custom('ContestBoardGameType')|l] vyletí do vzduchu.\n\nNálada [versus_contestant.Custom('CZ_FirstName_G')] se prudce změnila už před několika tahy, když [Select_CString(versus_contestant.IsFemale,'pochopila','pochopil')], že jednoduchá chyba prakticky rozhodla hru v můj prospěch.\n\n„Ano, ano, [Select_CString(ROOT.Char.IsFemale,'vyhrála','vyhrál')] jsi, [ROOT.Char.Custom('CZ_TitledFirstName_V')]!“ zakňourá. „#EMP Už máš radost?!#!“"
 contest_events.5510.a: "Posbírej je! Ještě musím provést poslední tah!"
 contest_events.5510.b: "Takové nesportovní chování je nepřijatelné!"
 contest_events.5510.c: "Pojď, vraťme se o pár tahů zpět."
 contest_events.5510.d: "Víš, [Select_CString(versus_contestant.IsFemale,'mohla ses','mohl ses')] prostě vzdát..."
 contest_events.5520.t: "Gambit [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')|l]"
 contest_events.5520.desc: "Zatímco [versus_contestant.GetFirstName] zvažuje další tah, tiše hledím na desku hry [activity.Custom('ContestBoardGameType')|l]. A náhle to spatřím.\n\nV roztržitém spřádání strategií jsem [Select_CString(ROOT.Char.IsFemale,'přehlédla','přehlédl')] příležitost, která by mi dala jasnou výhodu. Pokud s ní ovšem soupeř nepočítá.\n\nDávám si pozor, abych na sobě [Select_CString(ROOT.Char.IsFemale,'nedala','nedal')] nic znát a [Select_CString(ROOT.Char.IsFemale,'nepřitáhla','nepřitáhl')] pozornost. V očích [versus_contestant.Custom('CZ_FirstName_G')] hledám náznak vědomí či klamu nastražené pasti..."
 contest_events.5520.a: "$tournament_contest_header$ Pomalu, zlehka..."
 contest_events.5520.a.success: "Manévr přinese skvělý úspěch"
 contest_events.5520.a.failure: "Manévr se obrátí proti tobě"
 contest_events.5520.b: "Poslyš, víš, jak odkryté máš postavení?"
 contest_events.5520.c: "Je to lest. Moje současná strategie je dobrá."
 contest_events.5530.t: "Rychlé prsty"
 contest_events.5530.desc: "Hra [activity.Custom('ContestBoardGameType')|l] jde zdánlivě dokonale. Uvažuji tři, čtyři, možná i pět tahů před soupeřem, když [versus_contestant.GetFirstName] náhle provede tah, po kterém se má důmyslná strategie rozplyne jako sněhová vločka v plameni svíčky.\n\n[Select_CString(ROOT.Char.IsFemale,'Vyčerpala','Vyčerpal')|U] jsem všechny možnosti. Pokud neudělám něco troufalého, zápas určitě prohraji!"
 contest_events.5530.a: "Jedné figurky navíc by si nikdo nevšiml..."
 contest_events.5530.a.success: "Podvodem si zajistíš vítězství"
 contest_events.5530.a.failure: "Tvůj podvod vyjde najevo"
 contest_events.5530.b: "„Vlastně existuje jedno málo známé pravidlo...“"
 contest_events.5530.c: "Nebudu podvádět!"
 contest_events.5540.t: "$tournament_contest_header$ Svaly místo rozumu"
 contest_events.5540.desc: "Zdá se, že se má velkolepá strategie hroutí a [versus_contestant.GetFirstName] rychle získává převahu. Kdyby šlo o válku, [Select_CString(ROOT.Char.IsFemale,'zvažovala','zvažoval')] bych milosrdnou kapitulaci. V nitru mi vře hněv a pěsti svírám tak pevně, že by mohly začít krvácet.\n\nKdyž sáhne po figurce, [Select_CString(versus_contestant.IsFemale,'její','jeho')] samolibý pohled se střetne s mým a tvář vystřídá výraz šoku a hrůzy.\n\nMožná mohu tuhle chvíli využít a zastrašit [Select_CString(versus_contestant.IsFemale,'ji','ho')] natolik, že si další tah rozmyslí."
 contest_events.5540.a: "„Dotkni se té figurky a zlámu ti prsty.“"
 contest_events.5540.a.success: "Soupeř ti zápas úmyslně přenechá"
 contest_events.5540.a.failure: "Soupeře to nerozhodí"
 contest_events.5540.b: "Nesnížím se k tomu."
 contest_events.5550.t: "$tournament_contest_header$ [versus_contestant.GetCulture.Custom('CZ_AdjectiveNoTooltip_ee')|U] pravidla!"
 contest_events.5550.desc: "Zkušeným okem sleduji hru [activity.Custom('ContestBoardGameType')|l], zatímco se soupeř chystá k dalšímu tahu. K mému zděšení [versus_contestant.GetFirstName] zvedne figurku a... přímo přede mnou poruší pravidla!\n\n„Co je to za podvod?“ ohradím se.\n\n„Ach, odpusť.“ Soupeř samolibě položí ruce na stůl. „[Select_CString(versus_contestant.IsFemale,'Měla','Měl')|U] jsem za to, že hrajeme podle [versus_contestant.GetCulture.Custom('CZ_Adjective_yych')|l] pravidel.“"
 contest_events.5550.a: "Rozhodčí!"
 contest_events.5550.a.success: "Rozhodčí uplatní [ROOT.Char.GetCulture.Custom('CZ_Adjective_ee')|l] pravidla"
 contest_events.5550.a.failure: "Rozhodčí uplatní [versus_contestant.GetCulture.Custom('CZ_Adjective_ee')|l] pravidla"
 contest_events.5550.b: "„Prosím, nauč mě ta [versus_contestant.GetCulture.Custom('CZ_AdjectiveNoTooltip_ee')|l] pravidla.“"
 contest_events.5550.c: "Možná rozhodčího přikloní na mou stranu pár mincí."
 cultural_acceptance_board_game: "Přijetí při turnajové stolní hře"
 contest_events.5560.t: "$tournament_contest_header$ Loutkář"
 contest_events.5560.desc: "Hra proti [versus_contestant.Custom('CZ_Name_D')] se vyvíjí velmi špatně. Hraje na úrovni, kterou bych [Select_CString(ROOT.Char.IsFemale,'nepokládala','nepokládal')] za možnou.\n\nVšímám si, že [Select_CString(versus_contestant.IsFemale,'její','jeho')] oči neustále těkají do davu a zřejmě sledují postavu stojící téměř přímo za mnou! Ta nenápadně gestikuluje a pohybuje rty. Nepochybně dává [versus_contestant.Custom('CZ_FirstNameNoTooltip_D')] pokyny."
 contest_events.5560.a: "„Rozhodčí! [versus_contestant.GetFirstNameNoTooltip|U] podvádí!“"
 contest_events.5560.a.success: "Rozhodčí ti uvěří"
 contest_events.5560.a.failure: "Rozhodčí ti neuvěří"
 contest_events.5560.b: "Mé tahy musí být nepředvídatelné."
 contest_events.5560.b.success: "Zmateš [versus_contestant.Custom('CZ_FirstNameNoTooltip_A')]"
 contest_events.5560.b.failure: "[versus_contestant.GetFirstNameNoTooltip|U] tě přemůže"
 contest_events.5560.c: "Prostě se budu soustředit na hru."
 contest_events.5560.c.success: "Přehraješ [versus_contestant.Custom('CZ_FirstNameNoTooltip_A')]"
 contest_events.5570.t: "$tournament_contest_header$ Důmyslný manévr"
 contest_events.5570.desc: "Upřeně se soustředím na šachovnici a celé publikum také mlčky čeká. Náhle se ozve ostré řinčení kovu a všichni se otočí k nešikovnému panošovi, který právě shodil na zem hromadu zbraní a zbroje.\n\nNa desku se nikdo nedívá. Teď mám příležitost zvrátit hru přesunutím figurek!"
 contest_events.5570.a: "Přesunu pár figurek."
 contest_events.5570.a.success: "Nikdo si tě nevšimne"
 contest_events.5570.a.failure: "Přistihnou tě při podvádění"
 contest_events.5570.b: "Zpanikařím a sním figurku!"
 contest_events.5570.c: "Nepošpiním svou čest podváděním."
 contestant_score_increase_massive_tt: "[THIS.Char.Custom('CZ_ShortUIName_D')|U] se skóre #positive_value zvýší #EMP nesmírně#!#!"
 contestant_score_increase_major_tt: "[THIS.Char.Custom('CZ_ShortUIName_D')|U] se skóre #positive_value výrazně zvýší#!"
 contestant_score_increase_medium_tt: "[THIS.Char.Custom('CZ_ShortUIName_D')|U] se skóre #positive_value mírně zvýší#!"
 contestant_score_increase_minor_tt: "[THIS.Char.Custom('CZ_ShortUIName_D')|U] se skóre #positive_value trochu zvýší#!"
 contestant_score_increase_miniscule_tt: "[THIS.Char.Custom('CZ_ShortUIName_D')|U] se skóre #positive_value nepatrně zvýší#!"
 contestant_score_decrease_massive_tt: "[THIS.Char.Custom('CZ_ShortUIName_D')|U] se skóre #negative_value sníží #EMP nesmírně#!#!"
 contestant_score_decrease_major_tt: "[THIS.Char.Custom('CZ_ShortUIName_D')|U] se skóre #negative_value výrazně sníží#!"
 contestant_score_decrease_medium_tt: "[THIS.Char.Custom('CZ_ShortUIName_D')|U] se skóre #negative_value mírně sníží#!"
 contestant_score_decrease_minor_tt: "[THIS.Char.Custom('CZ_ShortUIName_D')|U] se skóre #negative_value trochu sníží#!"
 contestant_score_decrease_miniscule_tt: "[THIS.Char.Custom('CZ_ShortUIName_D')|U] se skóre #negative_value nepatrně sníží#!"
 contest_events_murder_intent_miss: "Tvůj úder [Select_CString(murder_target.IsFemale,'ji','ho')] zcela mine"
