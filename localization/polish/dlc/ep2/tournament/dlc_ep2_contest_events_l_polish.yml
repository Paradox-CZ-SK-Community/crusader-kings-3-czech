 contest_events.0810.murder_success: "Mé pečlivě připravené plány pro [contest_loser.Custom('CZ_FirstNameNoTooltip_A')] vyšly přesně podle záměru. [contest_loser.Custom2('InsultNoun', ROOT.Char)|U] už mi pokoj kazit nebude!"
 contest_events.0810.murder_fail_lose: "Má důmyslná sabotáž nepřinesla zamýšlený výsledek, [contest_loser.GetFirstNameNoTooltip] stále žije. Alespoň však [contest_winner.Custom2('InsultNoun', ROOT.Char)|l] [Select_CString(contest_winner.IsFemale,'nevyhrála','nevyhrál')]..."
 contest_events.0810.murder_fail_win: "Má sabotáž nejenže [Select_CString(contest_winner.IsFemale,'ji','ho')] nezabila, ale [contest_winner.GetFirstNameNoTooltip], [contest_winner.Custom2('InsultNoun', ROOT.Char)|l], dokonce [Select_CString(contest_winner.IsFemale,'dokázala','dokázal')] ten zatracený souboj vyhrát!"
