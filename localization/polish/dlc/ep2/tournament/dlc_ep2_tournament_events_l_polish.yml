 tournament_events.6051.t: "$tournament_events.6050.t$"
 tournament_events.6051.foot: "[Select_CString(ROOT.Char.IsFemale,'Pokusila','Pokusil')|U] jsem se před pokračováním soutěže [activity.GetCurrentPhase.GetPhase.GetName|l] poškodit zbroj [sabotage_target.Custom('CZ_TitledFirstName_G')]. [Select_CString(ROOT.Char.IsFemale,'Oslabila','Oslabil')|U] jsem kožené úvazy držící její části v naději, že se prodřou."
 tournament_events.6051.archery: "[Select_CString(ROOT.Char.IsFemale,'Pokusila','Pokusil')|U] jsem se před pokračováním soutěže [activity.GetCurrentPhase.GetPhase.GetName|l] poškodit luk [sabotage_target.Custom('CZ_TitledFirstName_G')]. [Select_CString(ROOT.Char.IsFemale,'Nenápadně jsem upravila','Nenápadně jsem upravil')|U] tah tětivy, abych [Select_CString(sabotage_target.IsFemale,'ji','ho')] [Select_CString(ROOT.Char.IsFemale,'rozhodila','rozhodil')]."
 tournament_events.6051.pugilism: "[Select_CString(ROOT.Char.IsFemale,'Pokusila','Pokusil')|U] jsem se před pokračováním soutěže [activity.GetCurrentPhase.GetPhase.GetName|l] poškodit ovínky [sabotage_target.Custom('CZ_TitledFirstName_G')]. [Select_CString(ROOT.Char.IsFemale,'Potřela','Potřel')|U] jsem je dráždivou mastí, abych [Select_CString(sabotage_target.IsFemale,'ji','ho')] [Select_CString(ROOT.Char.IsFemale,'rozhodila','rozhodil')]."
 tournament_events.6051.horse: "[Select_CString(ROOT.Char.IsFemale,'Pokusila','Pokusil')|U] jsem se před pokračováním soutěže [activity.GetCurrentPhase.GetPhase.GetName|l] otrávit koně [sabotage_target.Custom('CZ_TitledFirstName_G')]. Zatímco panoši spali, [Select_CString(ROOT.Char.IsFemale,'vyměnila','vyměnil')] jsem krmení ve stáji za závadné dávky."
 tournament_events.6051.horse_race: "[Select_CString(ROOT.Char.IsFemale,'Pokusila','Pokusil')|U] jsem se před začátkem soutěže [activity.GetCurrentPhase.GetPhase.GetName|l] otrávit dostihového koně [sabotage_target.Custom('CZ_TitledFirstName_G')], #EMP [sabotage_target.Custom('GetContestHorseRaceName')]#!. Zatímco panoši spali, [Select_CString(ROOT.Char.IsFemale,'vyměnila','vyměnil')] jsem krmení ve stáji za závadné dávky."
 tournament_events.6051.falconry: "[Select_CString(ROOT.Char.IsFemale,'Pokusila','Pokusil')|U] jsem se před začátkem soutěže [activity.GetCurrentPhase.GetPhase.GetName|l] otrávit ptáka [sabotage_target.Custom('CZ_TitledFirstName_G')]. Zatímco panoši spali, [Select_CString(ROOT.Char.IsFemale,'otrávila','otrávil')] jsem mu krmení."
 tournament_events.6051.success: "\n\nMá trpělivost se konečně vyplatila. [Select_CString(ROOT.Char.IsFemale,'Provedla','Provedl')|U] jsem výměnu bez vzbuzení podezření a [Select_CString(ROOT.Char.IsFemale,'vytratila','vytratil')] se do noci. Ráno s úlevou zjišťuji, že o mých úkladech nepadlo ani slovo."
 tournament_events.6051.detected: "\n\nPrávě když jsem se [Select_CString(ROOT.Char.IsFemale,'chystala','chystal')] odejít a pečlivá práce byla téměř hotová, [Select_CString(ROOT.Char.IsFemale,'otočila','otočil')] jsem se a [Select_CString(ROOT.Char.IsFemale,'spatřila','spatřil')] sluhu [sabotage_target.Custom('CZ_FirstNameNoTooltip_G')] s pusou dokořán. Než jsem [Select_CString(ROOT.Char.IsFemale,'stačila','stačil')] zareagovat, rozběhl se za [Select_CString(sabotage_target.IsFemale,'svou paní','svým pánem')]!"
 tournament_events.6051.failure: "\n\nBěda, [Select_CString(sabotage_target.IsFemale,'její','jeho')] bystrost a moje smůla způsobily, že mé pokusy jen vzbudily podezření z podvodu mezi soutěžícími. Ti jsou teď ostražitější než kdy předtím."
 tournament_events.6051.disqualified: "\n\nNetrvá dlouho a jsem [Select_CString(ROOT.Char.IsFemale,'diskvalifikována','diskvalifikován')]..."
 tournament_events.6051.forgiven: "\n\nNaštěstí mi bylo dovoleno pokračovat v účasti..."
 tournament_events.6051.a: "Všechno je fér."
 tournament_events.6051.a.disqualified: "Proboha..."
 tournament_events.6051.a.detected: "Jaká smůla..."
 tournament_events.6051.a.failure: "Ach jo..."
 tournament_events.6052.t: "$tournament_events.6050.t$"
 tournament_events.6052.host: "Moji sluhové tvrdí, že přistihli [sabotage_actor.Custom('CZ_TitledFirstName_A')], [Select_CString(sabotage_actor.IsFemale,'jednu ze soutěžících','jednoho ze soutěžících')] v nadcházející soutěži [activity.GetCurrentPhase.GetPhase.GetName|l], při pokusu o sabotáž proti mně!\n\n"
 tournament_events.6052.guest: "[sabotage_target.GetTitledFirstName|U], [Select_CString(sabotage_target.IsFemale,'jedna ze soutěžících','jeden ze soutěžících')] v nadcházející soutěži [activity.GetCurrentPhase.GetPhase.GetName|l], [Select_CString(sabotage_target.IsFemale,'obvinila','obvinil')] [sabotage_actor.Custom('CZ_TitledFirstName_A')] z podvodu ještě před dnem konání!\n\n"
 tournament_events.6052.foot: "„[Select_CString(sabotage_actor.IsFemale,'Manipulovala','Manipuloval')|U] s [Select_CString(sabotage_target.IsLocalPlayer,'tvou zbrojí',Concatenate('zbrojí ',sabotage_target.Custom('CZ_ShortUINamePossessiveNoTooltipNoFormat')))] a [Select_CString(sabotage_actor.IsFemale,'oslabovala','oslaboval')] kožené úvazy držící její části. [Select_CString(sabotage_actor.IsFemale,'Doufala','Doufal')|U], že se uprostřed zápasu prodřou!“"
 tournament_events.6052.archery: "„[Select_CString(sabotage_actor.IsFemale,'Manipulovala','Manipuloval')|U] s [Select_CString(sabotage_target.IsLocalPlayer,'tvým lukem',Concatenate('lukem ',sabotage_target.Custom('CZ_ShortUINamePossessiveNoTooltipNoFormat')))] a nenápadně [Select_CString(sabotage_actor.IsFemale,'měnila','měnil')] tah tětivy.“"
 tournament_events.6052.pugilism: "„[Select_CString(sabotage_actor.IsFemale,'Manipulovala','Manipuloval')|U] s [Select_CString(sabotage_target.IsLocalPlayer,'tvými ovínky',Concatenate('ovínky ',sabotage_target.Custom('CZ_ShortUINamePossessiveNoTooltipNoFormat')))] a [Select_CString(sabotage_actor.IsFemale,'potírala','potíral')] je dráždivou mastí.“"
 tournament_events.6052.horse: "„[Select_CString(sabotage_actor.IsFemale,'Pokoušela','Pokoušel')|U] se otrávit [Select_CString(sabotage_target.IsLocalPlayer,'tvého koně',Concatenate('koně ',sabotage_target.Custom('CZ_ShortUINamePossessiveNoTooltipNoFormat')))]. Zatímco panoši spali, [Select_CString(sabotage_actor.IsFemale,'vyměnila','vyměnil')] krmení ve stáji za závadné dávky.“"
 tournament_events.6052.horse_race: "„[Select_CString(sabotage_actor.IsFemale,'Pokoušela','Pokoušel')|U] se otrávit [Select_CString(sabotage_target.IsLocalPlayer,'tvého dostihového koně',Concatenate('dostihového koně ',sabotage_target.Custom('CZ_ShortUINamePossessiveNoTooltipNoFormat')))], #EMP [sabotage_target.Custom('GetContestHorseRaceName')]#!. Zatímco panoši spali, [Select_CString(sabotage_actor.IsFemale,'vyměnila','vyměnil')] krmení ve stáji za závadné dávky.“"
 tournament_events.6052.a: "Podvody nebudou tolerovány."
 tournament_events.6052.a.host: "Podvody znamenají diskvalifikaci!"
 tournament_events.6052.b: "Koneckonců, bylo to neškodné."
 tournament_events.6053.t: "$tournament_events.6050.t$"
 tournament_events.6053.desc: "Ještě než soutěž [activity.GetCurrentPhase.GetPhase.GetName|l] vůbec začala, někoho přistihli při sabotáži!"
 tournament_events.6053.foot: "„[sabotage_actor.GetTitledFirstName|U] [Select_CString(sabotage_actor.IsFemale,'manipulovala','manipuloval')] se zbrojí [sabotage_target.Custom('CZ_TitledFirstName_G')] a [Select_CString(sabotage_actor.IsFemale,'oslabovala','oslaboval')] kožené úvazy držící její části. [Select_CString(sabotage_actor.IsFemale,'Doufala','Doufal')|U], že se uprostřed zápasu prodřou!“"
 tournament_events.6053.archery: "„[sabotage_actor.GetTitledFirstName|U] [Select_CString(sabotage_actor.IsFemale,'manipulovala','manipuloval')] s lukem [sabotage_target.Custom('CZ_TitledFirstName_G')] a nenápadně [Select_CString(sabotage_actor.IsFemale,'měnila','měnil')] tah tětivy, aby mě [Select_CString(sabotage_actor.IsFemale,'rozhodila','rozhodil')].“"
 tournament_events.6053.pugilism: "„[sabotage_actor.GetTitledFirstName|U] [Select_CString(sabotage_actor.IsFemale,'manipulovala','manipuloval')] s ovínky [sabotage_target.Custom('CZ_TitledFirstName_G')] a [Select_CString(sabotage_actor.IsFemale,'potírala','potíral')] je dráždivou mastí, aby mě [Select_CString(sabotage_actor.IsFemale,'rozhodila','rozhodil')].“"
 tournament_events.6053.horse: "„[sabotage_actor.GetTitledFirstName|U] se [Select_CString(sabotage_actor.IsFemale,'pokoušela','pokoušel')] otrávit koně [sabotage_target.Custom('CZ_TitledFirstName_G')]. Zatímco panoši spali, [Select_CString(sabotage_actor.IsFemale,'vyměnila','vyměnil')] krmení ve stáji za závadné dávky.“"
 tournament_events.6053.horse_race: "„[sabotage_actor.GetTitledFirstName|U] se [Select_CString(sabotage_actor.IsFemale,'pokoušela','pokoušel')] otrávit dostihového koně [sabotage_target.Custom('CZ_TitledFirstName_G')], #EMP [sabotage_target.Custom('GetContestHorseRaceName')]#!. Zatímco panoši spali, [Select_CString(sabotage_actor.IsFemale,'vyměnila','vyměnil')] krmení ve stáji za závadné dávky.“"
 tournament_events.6053.disqualified_target: "\n\n[host.GetTitledFirstName|U] toho ubohého podvraťáka po právu [Select_CString(host.IsFemale,'diskvalifikovala','diskvalifikoval')]. To si dovolí!"
 tournament_events.6053.disqualified: "\n\n[host.GetTitledFirstName|U] [Select_CString(sabotage_actor.IsFemale,'ji','ho')] pochopitelně [Select_CString(host.IsFemale,'diskvalifikovala','diskvalifikoval')] ze soutěže, k velké radosti [Select_CString(sabotage_actor.IsFemale,'její','jeho')] zamýšlené oběti."
 tournament_events.6053.forgiven_target: "\n\n[host.GetTitledFirstName|U] tomu ubohému podvraťákovi [Select_CString(host.IsFemale,'nehorázně odpustila','nehorázně odpustil')]. Pořád bude smět soutěžit! Taková drzost!"
 tournament_events.6053.forgiven: "\n\n[host.GetTitledFirstName|U] proti [Select_CString(sabotage_actor.IsFemale,'ní','němu')] kupodivu nic [Select_CString(host.IsFemale,'nepodnikla','nepodnikl')] a celou věc [Select_CString(host.IsFemale,'zametla','zametl')] pod koberec."
 tournament_events.6053.a: "Nestoudnost!"
 tournament_events.6500.t: "$tournament_header$ Co děláme pro lásku"
 tournament_events.6500.desc: "Mé pokusy získat pozornost [woo_target.Custom('CZ_TitledFirstName_G')] nezůstaly bez povšimnutí, ale [Select_CString(woo_target.IsFemale,'její','jeho')] srdce se mi ještě neotevřelo.\n\n„Nejsem [Select_CString(woo_target.IsFemale,'nějaká naivní dívka','nějaký naivní chlapec')], kořist pro šlechtice, který mě uloví a odhodí. Ukaž mi svou náklonnost, dokaž mi ji a pak si promluvíme...“\n\n„Ukázat?“ zeptám se. „...jak to mám udělat?“\n\nOdpověď [woo_target.Custom('CZ_FirstNameNoTooltip_G')] přijde okamžitě: „Prohraj soutěž.“"
 tournament_events.6500.a: "Jak říkáš, [Select_CString(woo_target.IsFemale,'drahá','drahý')] [woo_target.Custom('CZ_FirstNameNoTooltip_V')]."
 tournament_events.6500.b: "V porážce není čest!"
 tournament_events.6510.t: "Lákavost triumfu"
 tournament_events.6510.opening: "Přestávky v turnajovém veselí mi dávají dost času zosnovat náhodné setkání s [woo_target.Custom('CZ_FirstName_I')]."
 tournament_events.6510.married: "Snadno se mi podařilo zařídit, aby [Select_CString(woo_target.IsFemale,'její','jeho')] [Select_CString(woo_target.GetPrimarySpouse.IsFemale,'manželka','manžel')], [woo_target.GetPrimarySpouse.GetTitledFirstName], [Select_CString(woo_target.GetPrimarySpouse.IsFemale,'byla','byl')] někde jinde."
 tournament_events.6510.currentspouse: "Příležitost dokázat oddanost [Select_CString(woo_target.IsFemale,'své ženě','svému muži')]!"
 tournament_events.6510.desc: "\n\n„Blahopřeji k vítězství v soutěži [ROOT.Char.Custom('GetRandomWonContest')|l], [ROOT.Char.Custom('CZ_TitledFirstName_V')],“ pronese zdvořile. „Byla to pořádná podívaná.“\n\nV [Select_CString(woo_target.IsFemale,'jejích','jeho')] očích je opravdová jiskra, tím jsem si [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')]."
 tournament_events.6510.a: "Všechno jsem to [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')] pro #EMP tebe#!, [Select_CString(woo_target.IsFemale,'má paní','můj pane')]."
 tournament_events.6510.a.tt: "#F Zapůsob na citlivou stránku [woo_target.Custom('CZ_FirstNameNoTooltip_G')].#!"
 tournament_events.6510.b: "Ach, to? To vážně nic nebylo."
 tournament_events.6510.b.tt: "#F Zapůsob na ješitnou stránku [woo_target.Custom('CZ_FirstNameNoTooltip_G')].#!"
 tournament_events.6510.c: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] jsem štěstí: moji soupeři bojovali dobře."
 tournament_events.6510.c.tt: "#F Zapůsob na skromnou stránku [woo_target.Custom('CZ_FirstNameNoTooltip_G')].#!"
 tournament_events.6510.d: "[ROOT.Char.GetFaith.HighGodName|U] slyší mé modlitby a projevuje mi přízeň."
 tournament_events.6510.d.tt: "#F Zapůsob na zbožnou stránku [woo_target.Custom('CZ_FirstNameNoTooltip_G')].#!"
 tournament_events.6511.reply_dedicate: "Nestoudně odpoví, že to všechno [Select_CString(woo_actor.IsFemale,'udělala','udělal')] pro mě!\n\n"
 tournament_events.6511.reply_dismiss: "Nenuceně odpoví, že o takové maličkosti bych se ani [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')] zmiňovat.\n\n"
 tournament_events.6511.reply_praise: "Rychle odpoví, že [Select_CString(woo_actor.IsFemale,'měla','měl')] jen štěstí. [Select_CString(woo_actor.IsFemale,'Její','Jeho')|U] soupeři nejsou o nic slabší než [Select_CString(woo_actor.IsFemale,'ona','on')].\n\n"
 tournament_events.6511.reply_god: "Upřímně odpoví, že je [Select_CString(woo_actor.IsFemale,'vděčná','vděčný')] za to, jak nad [Select_CString(woo_actor.IsFemale,'ní','ním')] drží ochrannou ruku [woo_actor.GetFaith.HighGodName].\n\n"
 tournament_events.6511.opening: "V pavilonu potkám [woo_actor.Custom('CZ_TitledFirstName_A')] a blahopřeji [Select_CString(woo_actor.IsFemale,'jí','mu')] k vítězství v soutěži [ROOT.Char.Custom('GetRandomWonContest')|l].\n\n"
 tournament_events.6511.dedicate: "$tournament_events.6511.reply_dedicate$Nemohu si pomoci a začnu se červenat nad tímto drzým flirtováním..."
 tournament_events.6511.dismiss: "$tournament_events.6511.reply_dismiss$[Select_CString(woo_actor.IsFemale,'To je ale troufalá žena','To je ale troufalý muž')|U]..."
 tournament_events.6511.praise: "$tournament_events.6511.reply_praise$Taková pokora..."
 tournament_events.6511.god: "$tournament_events.6511.reply_god$[Select_CString(woo_actor.IsFemale,'Opravdová žena víry','Opravdový muž víry')|U]."
 tournament_events.6511.fallback: "Jen se na mě významně usměje a já stěží odtrhnu oči."
 tournament_events.6511.a: "Nemohu popřít, že má jisté kouzlo..."
 tournament_events.6512.dedicate: "$tournament_events.6511.reply_dedicate$Nemohu si pomoci a v duchu se stydím..."
 tournament_events.6512.dismiss: "$tournament_events.6511.reply_dismiss$Jaká arogance..."
 tournament_events.6512.praise: "$tournament_events.6511.praise$Nauč se přijímat kompliment!"
 tournament_events.6512.god: "$tournament_events.6511.god$Co to je za nudu..."
 tournament_events.6512.fallback: "Jen se na mě významně usměje a já se cítím #EMP hluboce#! [Select_CString(ROOT.Char.IsFemale,'nesvá','nesvůj')]."
 tournament_events.6512.a: "[Select_CString(woo_actor.IsFemale,'To je ale směšná žena','To je ale směšný muž')|U]."
 tournament_events.6513.reply: "[woo_target.GetTitledFirstName|U] mou odpověď zřejmě [Select_CString(woo_target.IsFemale,'přijala','přijal')] vřele"
 tournament_events.6513.dedicate: "$tournament_events.6513.reply$, červená se a ostýchavě se směje."
 tournament_events.6513.dismiss: "$tournament_events.6513.reply$, zdánlivě mě nyní prověřuje novýma očima."
 tournament_events.6513.praise: "$tournament_events.6513.reply$, a říká, že to určitě nebylo jen štěstí."
 tournament_events.6513.god: "$tournament_events.6513.reply$, a odpoví, že tak si to jistě přeje [woo_target.GetFaith.HighGodName]."
 tournament_events.6513.fallback: "$tournament_events.6513.reply$, a dlouze a hluboce mi hledí do očí."
 tournament_events.6513.desc: "\n\nPři loučení je v každé zdvořilosti cítit napětí. [Select_CString(ROOT.Char.IsFemale,'Věděla','Věděl')|U] jsem, že najdu správná slova a získám [Select_CString(woo_target.IsFemale,'ji','ho')] na svou stranu!"
 tournament_events.6513.a: "Myslím, že [Select_CString(woo_target.IsFemale,'ji','ho')] mám na háčku..."
 tournament_events.6514.reply: "Zdá se, že má odpověď na [woo_target.Custom('CZ_TitledFirstName_A')] nezapůsobila"
 tournament_events.6514.dedicate: "$tournament_events.6514.reply$, protože při poděkování uhýbá očima a rychle odchází."
 tournament_events.6514.dismiss: "$tournament_events.6514.reply$, protože jen odmítavě protočí oči."
 tournament_events.6514.praise: "$tournament_events.6514.reply$, protože po mých slovech zklamaně ztrácí zájem."
 tournament_events.6514.god: "$tournament_events.6514.reply$, protože se [Select_CString(woo_target.IsFemale,'jí','mu')] pohled zamlží a zřejmě poslouchá jen napůl."
 tournament_events.6514.fallback: "$tournament_events.6513.reply$, protože mou společnost nemůže opustit dost rychle."
 tournament_events.6514.desc: "\n\nPo [Select_CString(woo_target.IsFemale,'jejím','jeho')] rozloučení zůstávám [Select_CString(ROOT.Char.IsFemale,'sama','sám')] a připadám si jako [Select_CString(ROOT.Char.IsFemale,'hlupačka','hlupák')]. Takový naprostý přešlap..."
 tournament_events.6514.a: "Co jsem to jen [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')]...?"
 tournament_events.6900.t: "$tournament_header$ Místní kopiník"
 tournament_events.6900.desc: "Rozhlížím se po nižší šlechtě shromážděné [CZPrepV(activity.GetCurrentPhase.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(activity.GetCurrentPhase.GetLocation,'L')] a spatřím právě [Select_CString(local_lancer.IsFemale,'takovou ženu, jakou potřebuji','takového muže, jakého potřebuji')].\n\n"
 tournament_events.6900.new: "[local_lancer.GetFullName|U] je [Select_CString(local_lancer.IsFemale,'místní zkušená jezdkyně','místní zkušený jezdec')], v okolí [Select_CString(local_lancer.IsFemale,'známá','známý')] svou statečností navzdory nízkému postavení. [ROOT.Char.Custom('MountedWarriorTerm')|U] ze zapomenuté provinční větve."
 tournament_events.6900.pool: "[local_lancer.GetFullName|U] je [Select_CString(local_lancer.IsFemale,'potulná zkušená jezdkyně','potulný zkušený jezdec')]. Cestuje od dvora ke dvoru a hledá [Select_CString(ROOT.Char.IsFemale,'paní, které','pána, kterému')] by [Select_CString(local_lancer.IsFemale,'mohla','mohl')] sloužit. Takovým [Select_CString(local_lancer.IsFemale,'ženám','mužům')] se obvykle nedůvěřuje, ale [Select_CString(local_lancer.IsFemale,'její','jeho')] nadání je okamžitě zřejmé."
 tournament_events.6900.closing: "\n\nKdyž přistoupím, abych se [Select_CString(ROOT.Char.IsFemale,'představila','představil')], vedle [Select_CString(local_lancer.IsFemale,'ní','něj')] se objeví [bidder.GetTitledFirstName]. Očividně máme stejný nápad..."
 tournament_events.6900.a: "Spolehni se, zaplatím lépe."
 tournament_events.6900.a.success: "[local_lancer.GetFirstNameNoTooltip|U] se řídí penězi"
 tournament_events.6900.a.failure: "[local_lancer.GetFirstNameNoTooltip|U] dává přednost [bidder.Custom('CZ_FirstNameNoTooltip_D')]"
 tournament_events.6900.b: "[local_lancer.Custom('CZ_FirstNameNoTooltip_V')|U], budeš sedět v mém velkolepém pavilonu!"
 tournament_events.6900.b.success: "[local_lancer.GetFirstNameNoTooltip|U] touží po světských požitcích"
 tournament_events.6900.c: "No tak, opravdu bys [Select_CString(local_lancer.IsFemale,'raději sloužila','raději sloužil')] jen #EMP [bidder.Custom('CZ_TitleAsNameNoTooltip_D')|l]#!?"
 tournament_events.6900.c.success: "[local_lancer.GetFirstNameNoTooltip|U] má ctižádostivou povahu"
 tournament_events.6900.d: "Ustup, [bidder.Custom('CZ_FirstNameNoTooltip_V')]. [ROOT.Char.GetTitleAsNameNoTooltip|U] má u tebe přednost."
 tournament_events.6900.e: "O takové služby smlouvat nebudu. [ROOT.Char.Custom('MountedWarriorTerm')|U] si jistě poradí."
 tournament_events.7000.t: "$tournament_header$ [Select_CString(mulan.IsFemale,'Buď ženou','Buď mužem')|U]!"
 tournament_events.7000.desc: "[ROOT.GetCharacter.Custom('KnightCulturePluralNoTooltipLowercase')|U] procházejí kolem a já je pozdravím. Jedna postava, zaostávající za ostatními, mě zarazí. Otočím se na patě a zavolám za ní.\n\nMá na sobě beztvarou, špatně padnoucí zbroj a pod přilbou jí svítí vytřeštěné, vyděšené oči. #EMP Něco#! tu nehraje. Přistoupím a strhnu přilbu dřív, než stihne zareagovat.\n\nPřede mnou stojí [Select_CString(mulan.IsFemale,'žena','muž')] a kradmo se rozhlíží, jestli si toho někdo všiml! Tváří se jako [ROOT.GetCharacter.Custom('KnightCultureNoTooltipLowercase')|l]. Dokonce chce #EMP soutěžit#! jako [ROOT.GetCharacter.Custom('KnightCultureNoTooltipLowercase')|l]!"
 tournament_events.7000.a: "Uchovám tvé tajemství."
 tournament_events.7000.a.tt: "Připojí se k aktivitě „[activity.GetShortName]“"
 tournament_events.7000.b: "[Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')|U] bych využít služby někoho, jako jsi ty."
 tournament_events.7000.b.tt: "Bude u tebe sloužit jako [mulan.Custom('KnightCulture')|l]"
 tournament_events.7000.c: "Stráže! #EMP Stráže!#! V našem turnaji je #EMP [Select_CString(mulan.IsFemale,'žena','muž')]#!!"
