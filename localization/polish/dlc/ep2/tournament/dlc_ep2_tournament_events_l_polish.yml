 tournament_events.6012.t: "$tournament_events.6010.t$"
 tournament_events.6012.poison: "Užívám si s několika účastníky hovor o nadcházejících soutěžích, když se mi najednou obrátí útroby a sevře dech.\n\n"
 tournament_events.6012.thug: "Odcházím do svého stanu po večeru stráveném u hovoru o favoritech s ostatními diváky, když zpozoruji postavu za sebou.\n\n"
 tournament_events.6012.death: "Bohové, co je to za oheň v mém nitru! „P-pomoc!“ vyprsknu, zatímco na mě známí zírají s přihlouplými výrazy."
 tournament_events.6012.ill: "Zhroutím se, svírám si břicho a kolem se shlukují ustaraní přihlížející. „Pomoc, p-přiveďte lékaře!“ podaří se mi vypravit."
 tournament_events.6012.slain: "Než se vůbec stihnu otočit, jako by mě kůň kopl na zem. Zahalená postava mě přitiskne k zemi a žene mi dýku k srdci!"
 tournament_events.6012.caught: "Ustoupím stranou právě ve chvíli, kdy se na mě muž vrhne. Vyvedu ho z rovnováhy a přitisknu k zemi. Z bláta trčí lesklá dýka."
 tournament_events.6012.escape: "Blíží se těžké kroky zahalené postavy. Jakmile je u mě, prudce se otočím, srazím ji k zemi a prchám do spleti stanů."
 tournament_events.6012.a.death: "#EMP *dušení*#! P- #weak pomoc...!#!"
 tournament_events.6012.a.ill: "P-potřebuji si l-lehnout."
 tournament_events.6012.a.poison: "T-to pití je hřích!"
 tournament_events.6012.a.slain: "#weak Kdo...?!#!"
 tournament_events.6012.a.caught: "#EMP Kdo tě poslal?!#!"
 tournament_events.6012.a: "Budu v pořádku..."
 tournament_events.6013.t: "$tournament_events.6010.t$"
 tournament_events.6013.death: "Přispěchám za [Select_CString(murder_target.IsFemale,'ní','ním')] co nejtišeji, popadnu [Select_CString(murder_target.IsFemale,'ji','ho')] za hlavu a přejedu čepelí přes krk.\n\nChrčí a kope, zatímco prchám do labyrintu stanů."
 tournament_events.6013.fallback: "Přispěchám za [Select_CString(murder_target.IsFemale,'ní','ním')] co nejtišeji, ale [murder_target.GetFirstName] mě zaslechne a otočí se. S vytřeštěnýma očima hledí na mou lesklou dýku.\n\nVyrazí s novou energií, vyrazí mi dech a zmizí v labyrintu stanů."
 tournament_events.6013.a.death: "To by mělo stačit!"
 tournament_events.6013.a: "Neeee!"
 tournament_events.6014.t: "$tournament_events.6010.t$"
 tournament_events.6014.desc: "Vracím se do stanu a slabě si držím bok, když se ke mně zezadu přiřítí [Select_CString(murder_actor.IsFemale,'žena','muž')]!"
 tournament_events.6014.death: "Než stihnu zareagovat, strhne mi hlavu dozadu a přitiskne dýku ke krku!"
 tournament_events.6014.fallback: "Otočím se, se zasténáním [Select_CString(murder_actor.IsFemale,'ji','ho')] srazím na zem a střemhlav prchám do labyrintu stanů."
 tournament_events.6014.a.death: "Co- #EMP N-!#! *zachroptění*"
 tournament_events.6014.a: "To [Select_CString(murder_actor.IsFemale,'byla','byl')]... ne... #EMP [murder_actor.GetFirstNameNoTooltip]#!!"
 tournament_events.6050.t: "$tournament_contest_header$ Sabotáž"
 tournament_events.6050.desc: "[Select_CString(ROOT.Char.IsFemale,'Přísahala','Přísahal')|U] jsem si, že na tomhle turnaji vyhraji soutěž. Nemohu se proto ubránit úvahám o méně... #EMP „čestném“#! způsobu, jak získat cenu v soutěži [activity.GetCurrentPhase.GetPhase.GetName|l].\n\nJsem si [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')], že soupeři by udělali totéž, kdyby je to napadlo. Kdo ví, možná už to udělali?"
 tournament_events.6050.a: "[sabotage_target_1.GetFirstNameNoTooltip|U] představuje hrozbu."
 tournament_events.6050.a.horse_race: "Hrozbu představuje kůň [sabotage_target_1.Custom('CZ_FirstNameNoTooltip_G')], #EMP [sabotage_target_1.Custom('GetContestHorseRaceName')]#!."
 tournament_events.6050.b: "Nesnesu, aby [sabotage_target_2.GetFirstNameNoTooltip] [Select_CString(sabotage_target_2.IsFemale,'vyhrála','vyhrál')]."
 tournament_events.6050.b.horse_race: "Nesnesu, aby [sabotage_target_2.GetFirstNameNoTooltip] [Select_CString(sabotage_target_2.IsFemale,'vyhrála','vyhrál')] díky koni #EMP [sabotage_target_2.Custom('GetContestHorseRaceName')]#!."
 tournament_events.6050.c: "[sabotage_target_3.GetFirstNameNoTooltip|U] musí přestat ohrožovat mé šance."
 tournament_events.6050.c.horse_race: "Kůň [sabotage_target_3.Custom('CZ_FirstNameNoTooltip_G')], #EMP [sabotage_target_3.Custom('GetContestHorseRaceName')]#!, musí přestat ohrožovat mé šance."
 tournament_events.6050.d: "Tímto způsobem se nevyhrává..."
 tournament_events.6050.success: "Tvá sabotáž uspěje"
 tournament_events.6050.detected: "Tvá sabotáž bude odhalena"
 tournament_events.6050.failure: "Tvá sabotáž neuspěje"
