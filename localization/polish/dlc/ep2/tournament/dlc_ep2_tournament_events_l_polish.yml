l_polish:
 tournament_events.0050.t: "Příjezd na turnaj"
 tournament_events.0050.desc: "[Select_CString(ROOT.Char.IsFemale,'Dorazila','Dorazil')|U] jsem na místo konání turnaje, sem [CZPrepV(activity.GetCurrentPhase.GetLocation.GetNameNoTooltip)] [CZProvName(activity.GetCurrentPhase.GetLocation,'L')]!\n\nPřestože ještě nedorazili všichni veselící se hosté, pestrým okolím proudí zástupy lidí. Všichni se těší na nadcházející ukázky dovedností a udatnosti.\n\n"
 tournament_events.0050.murder: "Já mám ovšem velkolepější ambice než pouhou zábavu. Pokud správně rozehraji karty, [starting_intent.GetFirstName] se závěrečného obřadu nedožije..."
 tournament_events.0050.seduce: "Mým prvním úkolem bude samozřejmě získat srdce [starting_intent.Custom('CZ_FirstName_G')]!"
 tournament_events.0050.befriend: "Kde jinde navázat pevné přátelství s [starting_intent.Custom('CZ_FirstName_I')] než právě tady!"
 tournament_events.0050.win: "Není času nazbyt, musím se začít připravovat! Musím zvítězit, ať to stojí cokoli!"
 tournament_events.0050.recruit: "Už vidím spoustu vhodných kandidátů. Byli by z nich skvělí [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')|l]!"
 tournament_events.0050.relax: "Málokde se dá tak dobře zbavit stresu a užít si zábavu jako na turnaji. A já toho hodlám plně využít!"
 tournament_events.0050.a: "Nemohu se dočkat, až to začne!"
 tournament_events.0100.t: "$tournament_header$ Zahájení"
 tournament_events.0100.desc: "Turnaj je konečně tady!\n\n"
 tournament_events.0100.host: "Mnozí se sjeli na moje pozemky [CZPrepV(activity.GetCurrentPhase.GetLocation.GetNameNoTooltip)] [CZProvName(activity.GetCurrentPhase.GetLocation,'L')], dychtiví prokázat svou hodnotu nebo si prostě užít podívanou."
 tournament_events.0100.contestant: "Stejně jako mnozí další, kteří se sjeli [CZPrepV(activity.GetCurrentPhase.GetLocation.GetNameNoTooltip)] [CZProvName(activity.GetCurrentPhase.GetLocation,'L')] a dychtivě vyhlížejí nadcházející soutěže, se věnuji seznamování a přípravě výstroje."
 tournament_events.0100.spectator: "Mnozí se sjeli na pozemky [host.Custom('CZ_TitledFirstName_G')] [CZPrepV(activity.GetCurrentPhase.GetLocation.GetNameNoTooltip)] [CZProvName(activity.GetCurrentPhase.GetLocation,'L')], aby soutěžili nebo se stejně jako já pobavili."
 tournament_events.0100.closing: "\n\nSlunce stoupá výš a stíny se zkracují. Pokud se mám zúčastnit soutěže [activity.GetCurrentPhase.GetPhase.GetName|l], musím si zajistit kvalifikaci. Brzy začne."
 tournament_events.0100.a: "Není času nazbyt!"
 tournament_events.0150.t: "$tournament_header$ Závěr"
 tournament_events.0150.desc: "Nad posledním dnem turnaje zapadá slunce a shromážděné davy se začínají rozcházet. Přemítám o výsledcích:\n\n"
 tournament_events.0150.melee: "Tým [melee_winner.Custom('CZ_TitledFirstName_G')] zvítězil v hromadném boji.\n"
 tournament_events.0150.melee_self: "Můj tým zvítězil v hromadném boji.\n"
 tournament_events.0150.archery: "[archery_winner.GetTitledFirstName|U] [Select_CString(archery_winner.IsFemale,'měla','měl')] ze všech nejlepší mušku v lukostřelbě.\n"
 tournament_events.0150.archery_self: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] jsem ze všech nejlepší mušku v lukostřelbě.\n"
 tournament_events.0150.recital: "Mistrovství verše vyneslo [recital_winner.Custom('CZ_TitledFirstName_D')] zasloužené vítězství v recitálu.\n"
 tournament_events.0150.recital_self: "Mé mistrovství ve verších mi vyneslo zasloužené vítězství v recitálu.\n"
 tournament_events.0150.joust: "[joust_winner.GetTitledFirstName|U] [Select_CString(joust_winner.IsFemale,'zlomila','zlomil')] nespočet kopí a [Select_CString(joust_winner.IsFemale,'prokázala','prokázal')] své kvality v klání.\n"
 tournament_events.0150.joust_self: "[Select_CString(ROOT.Char.IsFemale,'Zlomila','Zlomil')|U] jsem nespočet kopí a [Select_CString(ROOT.Char.IsFemale,'prokázala','prokázal')] své kvality v klání.\n"
 tournament_events.0150.wrestling: "[wrestling_winner.GetTitledFirstName|U] [Select_CString(wrestling_winner.IsFemale,'byla nezdolnou soupeřkou a získala','byl nezdolným soupeřem a získal')] první místo v zápase.\n"
 tournament_events.0150.wrestling_self: "[Select_CString(ROOT.Char.IsFemale,'Byla jsem nezdolnou soupeřkou a získala','Byl jsem nezdolným soupeřem a získal')|U] první místo v zápase.\n"
 tournament_events.0150.duel: "Převaha v šermu přinesla [duel_winner.Custom('CZ_TitledFirstName_D')] cenu v souboji.\n"
 tournament_events.0150.duel_self: "Díky své převaze v šermu si odnáším cenu v souboji.\n"
 tournament_events.0150.board_game: "Bystrá mysl přinesla [board_game_winner.Custom('CZ_TitledFirstName_D')] převahu nad všemi soupeři a vítězství ve stolních hrách.\n"
 tournament_events.0150.board_game_self: "Díky bystré mysli jsem [Select_CString(ROOT.Char.IsFemale,'přelstila','přelstil')] všechny soupeře a [Select_CString(ROOT.Char.IsFemale,'vyhrála','vyhrál')] stolní hry.\n"
 tournament_events.0150.horse_race: "Kůň [horse_race_winner.Custom('CZ_TitledFirstName_G')] doběhl v dostihu první.\n"
 tournament_events.0150.horse_race_self: "Můj kůň doběhl v dostihu první.\n"
 tournament_events.0150.murdersuccess: "\n[finishing_intent.GetFirstName|U] [Select_CString(finishing_intent.IsFemale,'došla','došel')] zaslouženého konce.\n"
 tournament_events.0150.murderfailure: "\n[finishing_intent.GetFirstName|U] tentokrát [Select_CString(finishing_intent.IsFemale,'unikla','unikl')] z mých spárů.\n"
 tournament_events.0150.seducesuccess: "\nMé tělesné svody u [finishing_intent.Custom('CZ_FirstName_G')] slavily úspěch.\n"
 tournament_events.0150.seducefailure: "\n[finishing_intent.GetFirstName|U] [Select_CString(finishing_intent.IsFemale,'odolala','odolal')] mým tělesným svodům.\n"
 tournament_events.0150.befriendsuccess: "\nS [finishing_intent.Custom('CZ_FirstName_I')] jsme se dobře [Select_CString(And(ROOT.Char.IsFemale,finishing_intent.IsFemale),'spřátelily','spřátelili')]!\n"
 tournament_events.0150.befriendfailure: "\nS [finishing_intent.Custom('CZ_FirstName_I')] jsme zatím pevné přátelství [Select_CString(And(ROOT.Char.IsFemale,finishing_intent.IsFemale),'nenavázaly','nenavázali')].\n"
 tournament_events.0150.winsuccess: "\n[Select_CString(ROOT.Char.IsFemale,'Dosáhla','Dosáhl')|U] jsem svého cíle a [Select_CString(ROOT.Char.IsFemale,'vyhrála','vyhrál')] soutěž!\n"
 tournament_events.0150.winfailure: "\nNepodařilo se mi vyhrát žádnou soutěž.\n"
 tournament_events.0150.knightsuccess: "\n[Select_CString(ROOT.Char.IsFemale,'Posílila','Posílil')|U] jsem své rytířské řady! Označení [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')|l] nyní nosí více lidí.\n"
 tournament_events.0150.knightfailure: "\n[Select_CString(ROOT.Char.IsFemale,'Nenašla','Nenašel')|U] jsem žádné vhodné kandidáty do svých rytířských řad. Noví [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')|l] se nepřidali.\n"
 tournament_events.0150.end: "\nTěším se na příští!"
 tournament_events.0150.a: "To byla skvělá událost!"
 tournament_events.0150.b: "Možná bych jako [Select_CString(ROOT.Char.IsFemale,'hostitelka měla','hostitel měl')] pronést pár slov..."
 tournament_events.0150.c: "[tournament_champion.GetFirstNameNoTooltip|U] si za vítězství zaslouží zvláštní odměnu!"
 tournament_events.0150.b.success: "Tvá slova ti přinesou trochu uznání"
 tournament_events.0150.b.failure: "Nikoho to příliš nezajímá"
 tournament_events.0150.legendseeddrop: "\nUž potřetí jsem [Select_CString(ROOT.Char.IsFemale,'vyhrála','vyhrál')] soutěž. Pověsti o mých činech se už šíří daleko a široko.\n"
 tournament_events.0160.t: "$tournament_header$ Kořist"
 tournament_events.0160.desc: "Soutěže jsou konečně u konce a na slíbenou cenu, ruku [marriage_prize.Custom('CZ_TitledFirstName_G')] pro zasloužilého vítěze, soutěžící nezapomněli. Nezapomíná na ni ani [ROOT.Char.Custom2('RelationToMeShort', marriage_prize)|l]...\n\n"
 tournament_events.0160.a: "Zdá se, že jsem tě [Select_CString(ROOT.Char.IsFemale,'vyhrála sama','vyhrál sám')], [ROOT.Char.Custom2('CZ_RelationToMeShort_V', marriage_prize)|l]!"
 tournament_events.0160.b: "Blahopřeji, [bachelor_1.Custom('CZ_FirstNameNoTooltip_V')]!"
 tournament_events.0160.c: "[bachelor_2.GetFirstNameNoTooltip|U] bude pro svatbu výborná volba, [bachelor_2.Custom('CZ_FirstNameNoTooltip_V')]! [bachelor_2.Custom('GetBrideGroom')|U] jak se patří!"
 tournament_events.0160.d: "Opatruj [Select_CString(marriage_prize.IsFemale,'ji','ho')], [bachelor_3.Custom('CZ_FirstNameNoTooltip_V')]!"
 tournament_events.0160.e: "Já... [Select_CString(ROOT.Char.IsFemale,'rozmyslela','rozmyslel')] jsem si to."
 tournament_events.0160.f: "[Select_CString(ROOT.Char.IsFemale,'Neměla','Neměl')|U] jsem na mysli sebe..."
 tournament_events.0160.g: "No nic..."
 tournament_events.0161.desc: "Soutěže jsou konečně u konce a na cenu slíbenou [host.Custom('CZ_TitledFirstName_I')], ruku [marriage_prize.Custom('CZ_TitledFirstName_G')] pro zasloužilého vítěze, soutěžící nezapomněli. Nezapomíná na ni ani [host.Custom2('RelationToMeShort', marriage_prize)|l] [Select_CString(host.IsFemale,'její','jeho')]...\n\n"
 tournament_events.0161.a: "Pojď, miláčku!"
 tournament_events.0161.b: "Skandální."
 tournament_events.0161.c: "No nic..."
 tournament_events.0701.t: "$tournament_contest_header$ Nehoda"
 tournament_events.0701.desc: "[ROOT.Char.Custom2('RelationToMeShort', accident_victim)|U], [accident_victim.GetName], [Select_CString(accident_victim.IsFemale,'zahynula','zahynul')] při nešťastné nehodě s palcátem během soutěže [activity.GetCurrentPhase.GetPhase.GetName|l]!"
 tournament_events.0701.a: "Tragické..."
 tournament_accident_death_msg_title: "Úmrtí následkem nehody"
 tournament_events.0800.t: "$tournament_contest_header$ Odstoupení"
 tournament_events.0800.wounded: "Obávám se, že mám příliš vážná zranění, než abych v turnaji [Select_CString(ROOT.Char.IsFemale,'pokračovala','pokračoval')]. V tomto stavu bych dobrý výkon [Select_CString(ROOT.Char.IsFemale,'nepodala','nepodal')] a další zranění raději pokoušet nebudu..."
 tournament_events.0800.disease: "Obávám se, že je má nemoc příliš vážná, než abych v turnaji [Select_CString(ROOT.Char.IsFemale,'pokračovala','pokračoval')]. V tomto stavu bych dobrý výkon [Select_CString(ROOT.Char.IsFemale,'nepodala','nepodal')] a lékařův hněv raději pokoušet nebudu..."
 tournament_events.0800.health: "Obávám se, že mi nerovnováha tělesných šťáv nedovolí v turnaji pokračovat. V tomto stavu bych dobrý výkon [Select_CString(ROOT.Char.IsFemale,'nepodala','nepodal')] a lékařův hněv raději pokoušet nebudu..."
 tournament_events.0800.a: "Nemohu pokračovat."
 tournament_events.0800.b: "Ne, dokážu to!"
 tournament_events.0801.t: "$tournament_events.0800.t$"
 tournament_events.0801.desc: "[contest_withdrawal.GetTitledFirstName|U] [Select_CString(contest_withdrawal.IsFemale,'oficiálně odstoupila','oficiálně odstoupil')] ze soutěží."
 tournament_events.0801.wounded: "Zdá se, že [Select_CString(contest_withdrawal.IsFemale,'její','jeho')] zranění jsou příliš vážná, než aby se vyplatilo riskovat pokračování."
 tournament_events.0801.disease: "Zdá se, že [Select_CString(contest_withdrawal.IsFemale,'její','jeho')] nemoc je už příliš vážná, než aby [Select_CString(contest_withdrawal.IsFemale,'mohla','mohl')] pokračovat."
 tournament_events.0801.health: "Zdá se, že [Select_CString(contest_withdrawal.IsFemale,'její','jeho')] tělesné šťávy jsou příliš nevyvážené, než aby [Select_CString(contest_withdrawal.IsFemale,'mohla','mohl')] pokračovat."
 tournament_events.0801.a: "Škoda."
 tournament_events.1000.t: "$tournament_contest_header$ Vsaď si"
 tournament_events.1000.desc: "V šeru hostince hledím na sázkového pořadatele a zvažuji záplavu kurzů, které vykřikuje nad hlavami hemžících se sázkařů.\n\n"
 tournament_events.1000.horse_race: "„Favoritem je kůň [wager_top_contestant.Custom('CZ_TitledFirstName_G')]! [wager_top_contestant.Custom('ContestHorseRaceGender')|U] jménem #EMP [wager_top_contestant.Custom('GetContestHorseRaceName')]#!! Čtyři ku jedné na #EMP [wager_top_contestant.Custom('GetContestHorseRaceName')]#!!“"
 tournament_events.1000.fallback: "„Favoritem soutěže [activity.GetCurrentPhase.GetPhase.GetName|l] je [wager_top_contestant.GetTitledFirstName]! Čtyři ku jedné na [wager_top_contestant.Custom('CZ_NameNoTooltip_A')]!“"
 tournament_events.1000.a: "Pche, vsadím si na sebe!"
 tournament_events.1000.a.horse: "Můj nejlepší kůň, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!, může vyhrát."
 tournament_events.1000.a.best_horse: "Ano, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! vyhraje!"
 tournament_events.1000.b: "[wager_top_contestant.GetFirstNameNoTooltip|U] je sázka na jistotu."
 tournament_events.1000.b.horse: "#EMP [wager_top_contestant.Custom('GetContestHorseRaceName')|U]#! je opravdu sázka na jistotu."
 tournament_events.1000.c: "Na druhou stranu [wager_second_contestant.GetFirstNameNoTooltip] příliš nezaostává."
 tournament_events.1000.c.horse: "Na druhou stranu kůň [wager_second_contestant.Custom('CZ_FirstNameNoTooltip_G')], „[wager_second_contestant.Custom('GetContestHorseRaceName')]“, příliš nezaostává."
 tournament_events.1000.d: "[Select_CString(wager_champion_contestant.IsFemale,'Má šampionka','Můj šampion')|U], [wager_champion_contestant.GetFirstNameNoTooltip], zvítězí!"
 tournament_events.1000.e: "Hm, [wager_underdog_contestant.GetFirstNameNoTooltip] patří k podceňovaným outsiderům."
 tournament_events.1000.e.horse: "Kůň [wager_underdog_contestant.Custom('CZ_FirstNameNoTooltip_G')], #EMP [wager_underdog_contestant.Custom('GetContestHorseRaceName')]#!, patří k podceňovaným outsiderům."
 tournament_events.1000.f: "Kolik můžu získat sázkou na [ROOT.Char.Custom2('CZ_RelationToMeShort_A', wager_flavor_contestant)|l], [wager_flavor_contestant.Custom('CZ_FirstNameNoTooltip_A')]?"
 tournament_events.1000.f.horse: "Kolik můžu získat sázkou na koně #EMP [wager_flavor_contestant.Custom('GetContestHorseRaceName')]#!, jehož vlastní [ROOT.Char.Custom2('RelationToMeShort', wager_flavor_contestant)|l]?"
 tournament_events.1000.g: "Mám dobrý pocit ze sázky na „[mysterious_stranger.GetFirstNameNoTooltip] z [attending_barony.Custom('CZ_LandedNameNoTierNoTooltip_G')]“."
 tournament_events.1000.g.horse: "Mám dobrý pocit z koně [mysterious_stranger.Custom('CZ_FirstNameNoTooltip_G')], #EMP [mysterious_stranger.Custom('GetContestHorseRaceName')]#!."
 tournament_events.1000.h: "Ne, to je špatný nápad..."
 tournament_events.1000.bet_debug_tt: "#D Hodnota cílového skóre sázek#!: [SCOPE.ScriptValue('tournament_wager_target_score_value')|V]\n#D Hodnota nejvyššího skóre sázek#!: [SCOPE.ScriptValue('tournament_wager_top_score_value')|V]\n#D Hodnota nejnižšího skóre sázek#!: [SCOPE.ScriptValue('tournament_wager_bottom_score_value')|V]\n#D Hodnota rozdílu (nejvyšší - nejnižší) skóre sázek:#! [SCOPE.ScriptValue('tournament_wager_top_minus_bottom_score_value')|V]\n#D Hodnota rozdílu (cíl - nejnižší) skóre sázek#!: [SCOPE.ScriptValue('tournament_wager_target_minus_bottom_value')|V]\n#D Procentní hodnota kurzů sázek#!: [SCOPE.ScriptValue('tournament_wager_odds_percent_value')|V]\n#D Hodnota výplaty sázek#!: [SCOPE.ScriptValue('tournament_wager_payout_value')|V]"
 tournament_events.1000.winnings_tt: "Pokud [wager_target.GetShortUIName] [Select_CString(wager_target.IsLocalPlayer,'zvítězíš','zvítězí')|l]:\nZískáš @gold_icon! #positive_value [SCOPE.ScriptValue('tournament_wager_payout_value')|0]#!"
 tournament_events.1000.horse_winnings_tt: "Pokud vyhraje [Select_CString(wager_target.IsLocalPlayer,'tvůj kůň',Concatenate('kůň ',wager_target.Custom('CZ_ShortUIName_G')))], [wager_target.Custom('GetContestHorseRaceName')|V]:\nZískáš @gold_icon! #positive_value [SCOPE.ScriptValue('tournament_wager_payout_value')|0]#!"
 tournament_events.1100.t: "Pas d'armes"
 tournament_events.1100.desc: "Z neklidu při čekání na soutěže, nebo prostě z touhy předvést svůj um, [ROOT.Char.Custom2('RelationToMeShort', pas_darmes_instigator)|l], [pas_darmes_instigator.GetFullName], [Select_CString(pas_darmes_instigator.IsFemale,'vyhlásila','vyhlásil')] na okraji [CZProvName(activity.GetCurrentPhase.GetLocation,'G')] „pas d'armes“.\n\n„#EMP Každý zdatný [pas_darmes_instigator.Custom('MountedWarriorTerm')|l], který chce projít, se mi musí postavit, nebo upadnout v hanbu!#!“\n\nPrý si nechává ostrohy všech poražených. Každá dáma, která chce projít bez doprovodu, musí zanechat památku, již pak někdo jejím jménem získá zpět."
 tournament_events.1100.a: "#EMP Tohle#! je [ROOT.Char.Custom('MountedWarriorTerm')|l], jak se patří!"
 tournament_events.1100.b: "To je zábava!"
 tournament_events.1100.c: "Musím tu [Select_CString(pas_darmes_instigator.IsFemale,'ženu','muže')] vidět!"
 tournament_events.1100.d: "Toto pošetilé chování je zakázáno."
 pas_darmes_token_claim_tt: "Každý [Concept('spouse','choť')|E], rodič a [Concept('child','dítě')|E] [pas_darmes_victim.Custom('CZ_Name_G')]"
 tournament_events.1101.t: "$tournament_events.1100.t$"
 tournament_events.1101.desc: "Cizí [pas_darmes_instigator.Custom('MountedWarriorTerm')|l], nepochybně [Select_CString(pas_darmes_instigator.IsFemale,'přilákaná','přilákaný')] na můj turnaj příslibem slávy a množstvím soupeřů, [Select_CString(pas_darmes_instigator.IsFemale,'vyhlásila','vyhlásil')] poblíž [CZProvName(activity.GetCurrentPhase.GetLocation,'G')] „pas d'armes“.\n\nŘíká si „[pas_darmes_instigator.GetFullName]“ a tvrdí, že pochází z dalekých [exotic_origin.GetDeJureLiege.Custom('CZ_AdjectiveNoTooltip_yych')|l] krajů. Každý [ROOT.Char.Custom('MountedWarriorTerm')|l], který chce projít kolem [Select_CString(pas_darmes_instigator.IsFemale,'jejího','jeho')] tábora, s [Select_CString(pas_darmes_instigator.IsFemale,'ní','ním')] musí lámat kopí. Jinak přijde o čest.\n\nTaková potupa od cizího dobrodruha jistě rozhněvá [ROOT.Char.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_ou')|l] šlechtu."
 tournament_events.1101.a: "Dobře, naši bojovníci musí být stále v pozoru."
 tournament_events.1101.b: "Myslím, že ne, vyžeňte toho toulavce."
 tournament_events.1101.c: "To je pravý $knight_culture_player_no_tooltip_lowercase$! Jaká inspirace!"
 tournament_events.1102.t: "$tournament_events.1100.t$"
 tournament_events.1102.desc: "V touze prokázat své kvality [ROOT.Char.Custom2('RelationToMeShort', pas_darmes_instigator)|l], [pas_darmes_instigator.GetFullName], [Select_CString(pas_darmes_instigator.IsFemale,'vyhlásila','vyhlásil')] „pas d'armes“ a [Select_CString(pas_darmes_instigator.IsFemale,'zablokovala','zablokoval')] hlavní cestu do [CZProvName(activity.GetCurrentPhase.GetLocation,'G')].\n\nSpolečnost [Select_CString(pas_darmes_instigator.IsFemale,'jí','mu')] dělá [ROOT.Char.Custom2('RelationToMeShort', pas_darmes_2)|l], [pas_darmes_2.GetFullName], a skupina nižších [pas_darmes_instigator.GetLiege.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_yych')|l] šlechticů, kteří si chtějí něco dokázat.\n\nPrý přísahali, že své poslání nebudou považovat za splněné, dokud nezlomí tři sta kopí."
 tournament_events.1102.a: "Ať mají štěstí."
 tournament_events.1102.a.tt: "Pas d'armes [CZPrepV(activity.GetCurrentPhase.GetLocation.GetNameNoTooltip)] [CZProvName(activity.GetCurrentPhase.GetLocation,'L')] bude pokračovat"
 tournament_events.1102.b: "V #EMP mém#! panství ne. [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|U] si takovou podívanou odpustí."
 tournament_pas_darmes_forbidden_tt: "Pas d'armes [CZPrepV(activity.GetCurrentPhase.GetLocation.GetNameNoTooltip)] [CZProvName(activity.GetCurrentPhase.GetLocation,'L')] skončí"
 tournament_events.1120.t: "Těžce vybojované"
 tournament_events.1120.desc: "[pas_darmes_instigator.GetTitledFirstName|U], [pas_darmes_instigator.Custom('MountedWarriorTerm')|l], který okázale hájí svůj průchod výzvami všem příchozím, [Select_CString(pas_darmes_instigator.IsFemale,'podstoupila','podstoupil')] o jeden souboj příliš mnoho.\n\nPrý [Select_CString(pas_darmes_instigator.IsFemale,'jí','mu')] [pas_darmes_victim.GetTitledFirstName] [Select_CString(pas_darmes_victim.IsFemale,'způsobila','způsobil')] strašlivé zranění a znovu [Select_CString(pas_darmes_victim.IsFemale,'uvolnila','uvolnil')] šlechtě cestu k volnému průchodu."
 tournament_events.1120.a: "Taková jsou rizika rytířského života."
 tournament_events.1120.a.dead: "Čestný způsob, jak zemřít."
 tournament_events.1130.opening: "[pas_darmes_victim.Custom2('AppropriateGreeting', ROOT.Char)|U]"
 tournament_events.1130.desc: "Když jsem se svými sluhy [Select_CString(pas_darmes_victim.IsFemale,'cestovala','cestoval')] do [CZProvName(activity.GetCurrentPhase.GetLocation,'G')], [pas_darmes_instigator.GetFullName] naši společnost [Select_CString(pas_darmes_instigator.IsFemale,'zastavila','zastavil')] a [Select_CString(pas_darmes_instigator.IsFemale,'nestoudně žádala','nestoudně žádal')] osobní památku...\n\n[Select_CString(pas_darmes_victim.IsFemale,'Neměla','Neměl')|U] jsem na vybranou a ten zatracený předmět jsem [Select_CString(pas_darmes_instigator.IsFemale,'jí','mu')] [Select_CString(pas_darmes_victim.IsFemale,'dala','dal')]. Prý jestli ho chci zpátky, musím za [Select_CString(pas_darmes_instigator.IsFemale,'ní','ním')] poslat vyzyvatele."
 tournament_events.1130.a: "S tím se musí něco udělat."
 tournament_events.1140.t: "Pýcha [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')|l]"
 tournament_events.1140.desc: "Na projížďce si užívám čerstvý vzduch a obdivuji ruch [CZProvName(activity.GetCurrentPhase.GetLocation,'G')]. Vtom spatřím [Select_CString(pas_darmes_instigator.IsFemale,'tu vychvalovanou bojovnici','toho vychvalovaného bojovníka')], „[pas_darmes_instigator.GetFullName]“, při obraně tábora „pas d'armes“.\n\n"
 tournament_events.1140.skilled: "Po cestě odkulhává jakýsi bezvýznamný vyzyvatel a [pas_darmes_instigator.Custom('MountedWarriorTerm')|l] se spokojeně vrací na své místo. Obdivuje ostrohy, které právě [Select_CString(pas_darmes_instigator.IsFemale,'získala','získal')].\n\n"
 tournament_events.1140.unskilled: "Kolem mě projde nesmírně spokojený [pas_darmes_instigator.Custom('MountedWarriorTerm')|l] a uctivě se ukloní. [pas_darmes_instigator.GetFirstNameNoTooltip|U] to pozoruje ze svého místa a porážka [Select_CString(pas_darmes_instigator.IsFemale,'ji','ho')] očividně bolí.\n\n"
 tournament_events.1140.wounded: "[Select_CString(pas_darmes_instigator.IsFemale,'Potlučená a samá modřina','Potlučený a samá modřina')|U] se při mém příchodu šklebí bolestí. „Pokaždé vyhrát nemůžeš,“ zasměje se a vzhlédne ke mně přimhouřenýma očima."
 tournament_events.1140.fallback: "Jakmile mě spatří, vyskočí v touze po dalším souboji, ale rychle pochopí, kdo jsem. [pas_darmes_instigator.GetFirstNameNoTooltip|U] ke mně s úsměvem vzhlédne a ukloní se: „[Select_CString(ROOT.Char.IsFemale,'Buďte vítána','Buďte vítán')|U], [ROOT.Char.Custom('FormOfAddressForLiege')|l] z [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')].“"
 tournament_events.1140.a: "Ukážu ti, jak bojuje #EMP [ROOT.Char.GetTitleAsNameNoTooltip|l]#!."
 tournament_events.1140.a.wounded: "Ani tentokrát nevyhraješ."
 tournament_events.1140.a.success: "Porazíš [pas_darmes_instigator.Custom('CZ_NameNoTooltip_A')]"
 tournament_events.1140.a.failure: "[pas_darmes_instigator.GetNameNoTooltip|U] tě přemůže"
 tournament_events.1140.b: "V boji toho umíš hodně. [Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')|U] bych tě potřebovat."
 tournament_events.1140.b.success: "Přesvědčíš [pas_darmes_instigator.Custom('CZ_NameNoTooltip_A')]"
 tournament_events.1140.b.failure: "[pas_darmes_instigator.GetNameNoTooltip|U] odmítne tvou nabídku"
 tournament_events.1140.c: "Myslím, že to stačí."
 tournament_events.1140.d: "Tak dál!"
 tournament_events.1141.t: "$tournament_events.1140.t$"
 tournament_events.1141.desc: "Při našem nasedání a zaujímání míst se shlukne dav diváků. [pas_darmes_instigator.GetFirstName|U] bez zaváhání vyrazí se sklopeným kopím v záplavě prachu a dunících kopyt!\n\nUháním vpřed a veškerou pozornost soustředím na pohupující se hrot kopí mířící vstříc soupeři."
 tournament_events.1141.win: "\n\nMé kopí se s ohlušujícím prasknutím roztříští o [Select_CString(pas_darmes_instigator.IsFemale,'její','jeho')] štít. [Select_CString(pas_darmes_instigator.IsFemale,'Ona','On')|U] se zakloní v sedle, zatímco kolem proletím."
 tournament_events.1141.lose: "\n\nCítím, jak se [Select_CString(pas_darmes_instigator.IsFemale,'její','jeho')] kopí s ohlušujícím prasknutím tříští o můj štít. Náraz mě zakloní v sedle a soupeř proletí kolem."
 tournament_events.1141.kill_me: "\n\nTvář mám náhle horkou a mokrou. Snažím se promluvit, ale sotva udržím oči otevřené. Do zorného pole vpluje ustaraná tvář [pas_darmes_instigator.Custom('CZ_FirstNameNoTooltip_G')] a svět pohltí tma..."
 tournament_events.1141.beat_me: "\n\nVytáhne mě na nohy a smete mi ze zbroje třísky. „[Select_CString(ROOT.Char.IsFemale,'Bojovala','Bojoval')|U] jsi dobře, ale [Select_CString(ROOT.Char.IsFemale,'prohrála','prohrál')] jsi.“ Zazubí se a podá mi ruku."
 tournament_events.1141.kill_them: "\n\nNa konci dráhy s úsměvem obrátím koně a hledám [pas_darmes_instigator.Custom('CZ_FirstNameNoTooltip_A')]. Spatřím [Select_CString(pas_darmes_instigator.IsFemale,'její','jeho')] zhroucené tělo tváří v prachu. Kůň šťouchá čenichem do [Select_CString(pas_darmes_instigator.IsFemale,'její','jeho')] nohy."
 tournament_events.1141.beat_them: "\n\nRychle se vrátím, pomůžu [Select_CString(pas_darmes_instigator.IsFemale,'jí','mu')] na nohy a hledám zranění. „Budu v pořádku,“ zavrčí. „Tady jsou mé ostrohy.“"
 tournament_events.1141.a: "To je jen škrábanec..."
 tournament_events.1141.a.death: "#weak *zachroptění*#!"
 tournament_events.1141.b: "[Select_CString(ROOT.Char.IsFemale,'Říkala','Říkal')|U] jsem, že ti to ukážu!"
 tournament_events.1141.b.death: "[pas_darmes_instigator.Custom('CZ_FirstNameNoTooltip_V')|U]? #EMP [pas_darmes_instigator.Custom('CZ_FirstNameNoTooltip_V')]?!#!"
 tournament_events.1150.t: "$tournament_header$ Obnova cti"
 tournament_events.1150.desc: "[pas_darmes_instigator.GetTitledFirstName|U] sedí u cesty a brousí čepel, když se blížím k [Select_CString(pas_darmes_instigator.IsFemale,'jejímu','jeho')] skromnému táboru.\n\n„Ach, už jsem si [Select_CString(pas_darmes_instigator.IsFemale,'říkala','říkal')], kdy se ukážeš, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')].“ Ušklíbne se a vytáhne od opasku kus oděvu. „Předpokládám, že si ho jdeš vybojovat zpátky?“\n\n"
 tournament_events.1150.skilled: "Válečnou pověst [Select_CString(pas_darmes_instigator.IsFemale,'téhle ženy','tohohle muže')] dobře znám. Vlastní ješitnost [Select_CString(pas_darmes_instigator.IsFemale,'ji','ho')] ale přivede k pádu."
 tournament_events.1150.unskilled: "O [Select_CString(pas_darmes_instigator.IsFemale,'téhle ženě','tomhle muži')] se ví, že má víc chvástání než umu. Přesto bych [Select_CString(pas_darmes_instigator.IsFemale,'ji','ho')] [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')] podceňovat."
 tournament_events.1150.wounded: "V každém případě [Select_CString(pas_darmes_instigator.IsFemale,'její','jeho')] zranění by mi jistě poskytla výhodu..."
 tournament_events.1150.fallback: "Má čest je v sázce a může za to pouhý [ROOT.Char.Custom('MountedWarriorTerm')|l]..."
 tournament_events.1150.a: "Pojď, utkejme se."
 tournament_events.1150.a.wounded: "Přidám ti další ránu, abys [Select_CString(pas_darmes_instigator.IsFemale,'měla','měl')] památku na #EMP mě#!."
 tournament_events.1150.a.success: "Porazíš [pas_darmes_instigator.Custom('CZ_TitledFirstNameNoTooltip_A')]"
 tournament_events.1150.a.failure: "[pas_darmes_instigator.GetTitledFirstNameNoTooltip|U] tě přemůže"
 tournament_events.1150.b: "Nech si ten cár látky. [pas_darmes_instigator.Custom('MountedWarriorTerm')|U] má jistě na víc."
 tournament_events.1200.t: "Náboženské pokárání"
 tournament_events.1200.desc: "Zatímco se šlechta i lid nadšeně chystají na soutěže a zábavu, [angry_clergy.GetTitledFirstName] dává jasně najevo nesouhlas. [angry_clergy.GetFaith.AltPriestTermPlural|U] to prý vidí stejně.\n\n„Tenhle turnaj je nástrojem hříchu. Dobří [angry_clergy.GetFaith.GetAdherentNamePluralNoTooltip|l] budou umírat v honbě za pýchou a prolévat si navzájem krev kvůli cetkám. Jejich cílem není [angry_clergy.GetFaith.PositiveAfterLife], nýbrž sláva.“\n\n„Tyhle sklony by se měly zkrotit, aby trpěl [angry_clergy.GetFaith.HighGodNamePossessive] nepřítel, ne rozdmýchávat a utápět v marnivé slávě.“"
 tournament_events.1200.a: "Nemohou bránit [CZAdherentPl_A(ROOT.Char.GetFaith)|l] bez nějakého cvičení!"
 tournament_events.1200.a.success: "[angry_clergy.GetTitledFirstNameNoTooltip|U] [Select_CString(angry_clergy.IsFemale,'je přesvědčena','je přesvědčen')]"
 tournament_events.1200.a.failure: "Názor [angry_clergy.Custom('CZ_TitledFirstNameNoTooltip_G')] nezměníš"
 tournament_events.1200.b: "Z mé lóže poznáš přednosti soutěžení."
 tournament_events.1200.b.success: "[angry_clergy.GetTitledFirstNameNoTooltip|U] se nechá získat na tvou stranu"
 tournament_events.1200.b.failure: "[angry_clergy.GetTitledFirstNameNoTooltip|U] projeví opovržení"
 tournament_events.1200.c: "Dobrá poznámka, nebudu soutěžit."
 tournament_events.1200.d: "Ale nech toho, ať se baví. [angry_clergy.GetFaith.PriestNeuter|U] jim tu zábavu snad nemusí kazit."
 tournament_events.1230.t: "Od hadrů ke kroužkové zbroji"
 tournament_events.1230.desc: "Obcházím turnajiště, nasávám atmosféru a rozebírám techniky trénujících soutěžících. Přitom mi padne do oka [Select_CString(battle_peasant.IsFemale,'jistá žena','jistý muž')].\n\nKaždý [Select_CString(battle_peasant.IsFemale,'její','jeho')] pohyb oplývá ladností, účelností a jistotou. Se slaměným panákem i cvičným soupeřem si poradí stejně rychle.\n\nKdyž na [Select_CString(battle_peasant.IsFemale,'ni','něj')] zavolám, aby [Select_CString(battle_peasant.IsFemale,'prozradila','prozradil')] svůj šlechtický rod, vytřeští oči a pak sklopí zrak. „[Select_CString(ROOT.Char.IsFemale,'M-má paní','M-můj pane')|U]! Jsem jen [Select_CString(battle_peasant.IsFemale,'venkovanka','venkovan')], nic víc,“ vykoktá s hlubokou úklonou."
 tournament_events.1230.a: "Ne, budeš mým šampionem!"
 tournament_events.1230.b: "Tvá hvězda právě vyšla. [battle_peasant.Custom('MountedWarriorTerm')|U] z tebe bude!"
 tournament_events.1230.b.tt: "Získá u tebe postavení označované jako [battle_peasant.Custom('KnightCulture')|l]"
 tournament_events.1230.c: "Musím tě vidět soutěžit! Budu tě sponzorovat."
 tournament_events.1230.c.tt: "Připojí se k tvé aktivitě „[activity.GetShortName]“"
 tournament_events.1230.d: "Ach, #EMP člověk z lidu?!#! Jaká škoda..."
 tournament_events.1230.d.tt: "[battle_peasant.GetName|U] zmizí"
 tournament_events.1240.t: "$tournament_header$ Vítězovi"
 tournament_events.1240.desc: "Zvažuji ceny, které mohu nabídnout vítězi soutěže [activity.GetCurrentPhase.GetPhase.GetName|l], a napadne mě ruka [prize_child_1.Custom('CZ_FirstName_G')]. Je to [ROOT.Char.Custom2('RelationToMe', prize_child_1)|l] a dosud žije bez manželského svazku.\n\nJenže... co kdyby vyhrál někdo z lidu..."
 tournament_events.1240.a: "[Select_CString(ROOT.Char.IsFemale,'Rozhodla','Rozhodl')|U] jsem se. [prize_child_1.GetFirstNameNoTooltip|U] si vezme vítěze."
 tournament_events.1240.b: "[prize_child_2.GetFirstNameNoTooltip|U] se hodí lépe."
 tournament_events.1240.c: "[Select_CString(prize_child_3.IsFemale,'Měla by to být','Měl by to být')|U] [prize_child_3.GetFirstNameNoTooltip]."
 tournament_events.1240.d: "Takto to neděláme."
 tournament_events.1240.betrothal_tt: "Pokud budou splněny podmínky, vítěz se zasnoubí s [marriage_prize.Custom('CZ_TitledFirstName_I')]"
 tournament_events.1240.marry_tt: "Pokud budou splněny podmínky, vítěz si vezme [marriage_prize.Custom('CZ_TitledFirstName_A')]"
 tournament_events.1250.t: "$tournament_header$ Dar přízně"
 tournament_events.1250.desc: "Je zvykem povzbudit milovanou osobu darem přízně, drobnou památkou, kterou si vezme do turnaje všem na oči.\n\nOtázkou zůstává, kdo ze soutěžících si mou náklonnost zaslouží nejvíc..."
 tournament_events.1250.a: "Daruji ho [favor_recipient_1.Custom('CZ_FirstNameNoTooltip_D')]."
 tournament_events.1250.b: "[favor_recipient_2.GetFirstNameNoTooltip|U] si ho zaslouží."
 tournament_events.1250.c: "Dostane ho [favor_recipient_3.GetFirstNameNoTooltip]."
 tournament_events.1250.d: "Není nikdo, kdo by si moji přízeň zasloužil..."
 tournament_events.1250.favor_tt: "[favor_recipient.GetUIName|U] [Select_CString(favor_recipient.IsLocalPlayer,'dostáváš','dostává')|l] tvůj dar přízně"
 tournament_favor_accepted_title: "Dar přízně přijat"
 tournament_favor_rejected_title: "Dar přízně odmítnut"
 tournament_favor_accepted_desc: "Přijímá tvůj dar přízně"
 tournament_favor_rejected_desc: "Odmítá tvůj dar přízně"
 tournament_events.1251.t: "$tournament_events.1250.t$"
 tournament_events.1251.discrete: "Ve chvíli relativního klidu, stranou od hlavního turnajiště, je při mně pouze [favor_giver.GetTitledFirstName], [favor_recipient.Custom2('RelationToMe', favor_giver)|l]. [Select_CString(favor_giver.IsFemale,'Jejímu','Jeho')|U] rošťáckému pohledu se těžko odolává.\n\n"
 tournament_events.1251.open: "Stojím na turnajišti a sleduji cvičení a přípravy, když za sebou zaslechnu něžný hlas. „[ROOT.Char.Custom('CZ_TitledFirstName_V')|U]!“ Spěchá ke mně [favor_giver.GetTitledFirstName] a v ruce svírá kus oděvu. Je to [favor_recipient.Custom2('RelationToMe', favor_giver)|l].\n\n"
 tournament_events.1251.many: "Kéž mi [favor_recipient.GetFaith.HouseholdGodName] pomůže, už ztrácím přehled, kolik darů přízně jsem [Select_CString(favor_recipient.IsFemale,'dostala','dostal')]. Kdyby o sobě ti dárci jen věděli..."
 tournament_events.1251.two: "Už druhý nabídnutý dar přízně! Co si se všemi těmi cáry látky počnu?"
 tournament_events.1251.one: "S úsměvem mi uváže památku na paži: „Vezmi si ji do soutěže, přinese ti štěstí!“"
 tournament_events.1251.favor_tt: "Každý nasazený dar přízně mírně #positive_value zvyšuje#! šanci na vítězství v [Concept('contests','soutěžích')|E]"
 tournament_events.1251.a.spouse: "Děkuji, drahoušku."
 tournament_events.1251.a.consort: "Ach, jak dojemné."
 tournament_events.1251.a.lover: "To je moc, má lásko."
 tournament_events.1251.a: "Budu ho nosit hrdě, [Select_CString(favor_giver.IsFemale,'má paní','můj pane')]."
 tournament_events.1251.b: "Sundej mi to."
 tournament_events_equip_favor_tt: "Nasadí si tvůj dar přízně"
 tournament_events_destroy_favor_tt: "[THIS.Char.GetShortUIName|U] [Select_CString(THIS.Char.IsLocalPlayer,'zahodíš','zahodí')|l] tvůj dar přízně"
 tournament_events.1252.t: "Povědomý dar přízně"
 tournament_events.1252.desc: "Od chvíle, kdy jsem včera [Select_CString(ROOT.Char.IsFemale,'zahlédla','zahlédl')] na paži [favor_recipient.Custom('CZ_TitledFirstName_G')] dar od obdivovatele, si lámu hlavu, proč je mi tak povědomý...\n\nKdyž mě dnes ráno [Select_CString(favor_giver.IsFemale,'pozdravila','pozdravil')] [ROOT.Char.Custom2('RelationToMe', favor_giver)|l], [favor_giver.GetTitledFirstName], náhle mi to došlo. Myslím, že patří [Select_CString(favor_giver.IsFemale,'jí','jemu')]!"
 tournament_events.1252.a: "Musím to vědět!"
 tournament_events.1252.a.tt: "Zeptáš se [favor_giver.Custom('CZ_FirstNameNoTooltip_G')] přímo na ten dar přízně"
 tournament_events.1252.b: "Ne... to je směšné..."
 tournament_events.1253.t: "$tournament_events.1252.t$"
 tournament_events.1253.desc: "[favor_investigator.GetTitledFirstName|U] vtrhne do mých komnat. [Select_CString(favor_investigator.IsFemale,'Její','Jeho')|U] těkavý pohled přelétne místnost a nakonec se zastaví na mně.\n\n„Řekni mi pravdu, patří ten dar přízně na paži [favor_recipient.Custom('CZ_TitledFirstName_G')] tobě?“"
 tournament_events.1253.a: "#weak ...ano.#!"
 tournament_events.1253.b: "Cože? Neblázni!"
 tournament_events.1254.t: "$tournament_events.1252.t$"
 tournament_events.1254.desc: "[favor_giver.GetFirstName|U] se při mém přívalu otázek [Select_CString(favor_giver.IsFemale,'odvrátila','odvrátil')] a chabě se [Select_CString(favor_giver.IsFemale,'opřela','opřel')] o stůl.\n\nNakonec se [Select_CString(favor_giver.IsFemale,'ona','on')] pomalu otočí a opatrně prolomí ticho: „Je to pravda. [favor_recipient.GetTitledFirstName|U] nosí můj dar přízně...“"
 tournament_events.1254.a: "J-je to pravda?"
 tournament_events.1254.b: "#EMP TO JE?!#!"
 tournament_events.1255.t: "$tournament_events.1252.t$"
 tournament_events.1255.desc: "[favor_giver.GetTitledFirstName|U] popírá jakýkoli vztah s [favor_recipient.Custom('CZ_TitledFirstName_I')] a obvinění [Select_CString(favor_giver.IsFemale,'ji','ho')] očividně rozčiluje. „Vždyť tu [Select_CString(favor_recipient.IsFemale,'ženu','muže')] skoro neznám!“\n\nAť říká cokoli, semínka pochybností už jsou zaseta..."
 tournament_events.1255.a: "Co víc mohu udělat?"
 tournament_events.1255.a.tt: "„Jen čas ukáže...“"
 tournament_events.1260.t: "Udržení míru"
 tournament_events.1260.desc: "Když se na jednom místě shromáždí bezpočet pánů a bojovníků, není divu, že se pořád někdo hádá. [ROOT.Char.Custom('MountedWarriorTermPlural')|U] znovu otevírají staré spory a ješitnost podněcuje třenice.\n\n"
 tournament_events.1260.rival: "„Poslyš, [duelist_2.Custom2('CZ_InsultNoun_V', SCOPE.sC('duelist_1'))|l], ty kluzká zmije!“ zavrčí [duelist_1.GetFirstName], zatímco [duelist_2.GetTitledFirstName] výhružně přejíždí prsty po rukojeti. Po ruce je [duelist_2.Custom('SignatureWeaponNameOrType')], připravená zbraň. Nikdo neví, co to vyvolalo.\n\nObvykle tyhle malicherné projevy chvástavosti skončí nanejvýš monoklem, ale děsivá hádka mezi [duelist_1.Custom('CZ_TitledFirstName_I')] a [duelist_2.Custom('CZ_TitledFirstName_I')] hrozí pokazit celou událost."
 tournament_events.1260.fallback: "„Poslyš, [duelist_2.Custom2('CZ_InsultNoun_V', SCOPE.sC('duelist_1'))|l], ty kluzká zmije!“ zavrčí [duelist_1.GetFirstName], zatímco [duelist_2.GetFirstNameNoTooltip] výhružně přejíždí prsty po rukojeti meče.\n\nObvykle tyhle malicherné projevy chvástavosti skončí nanejvýš monoklem, ale tahle děsivá hádka hrozí pokazit celou událost. Nikdo nedokáže říct, co ji vyvolalo."
 tournament_events.1260.a: "To stačí! Tohle není banditský tábor!"
 tournament_events.1260.b: "Přestaňte, nedělejte ostudu svému hostiteli."
 tournament_events.1260.c: "Ven! Odstraňte tyto rváče!"
 tournament_events.1260.d: "Sraž [Select_CString(second_duelist.IsFemale,'ji','ho')], [preferred_duelist.Custom('CZ_FirstNameNoTooltip_V')]!"
 tournament_events.1260.duel_toast: "[duel_winner.GetTitledFirstName|U] [Select_CString(duel_winner.IsFemale,'vyhrála','vyhrál')] souboj"
 tournament_events.1260.peace_toast: "Soupeři ustoupí"
 tournament_events.1260.duel_tt: "Souboj se uskuteční a zranění utrpí [duelist_1.GetFirstName] nebo [duelist_2.GetFirstName]"
 tournament_events.1270.t: "$tournament_header$ Sportovní chování"
 tournament_events.1270.winner: "Ve velkém pavilonu spatřím [congratulate_winner.Custom('CZ_TitledFirstName_A')] v obklopení obdivovatelů. Nepochybně se chlubí vítězstvím v soutěži [congratulate_winner.Custom('GetRandomWonContest')|l] i cenou, kterou [Select_CString(congratulate_winner.IsFemale,'získala','získal')]."
 tournament_events.1270.matcher: "Ve velkém pavilonu spatřím [congratulate_winner.Custom('CZ_TitledFirstName_A')]. Nepochybně se chlubí tím, jak mě [Select_CString(congratulate_winner.IsFemale,'porazila','porazil')] v našem zápase."
 tournament_events.1270.desc: "\n\nSlušnost velí, abych [Select_CString(congratulate_winner.IsFemale,'ji','ho')] při míjení [Select_CString(ROOT.Char.IsFemale,'pozdravila','pozdravil')]. Příležitost veřejně se vyjádřit před shromážděnými hosty..."
 tournament_events.1270.a: "Třikrát sláva šampionovi!"
 tournament_events.1270.b: "Blahopřeji, [congratulate_winner.Custom('CZ_FirstNameNoTooltip_V')]. Zaslouženě!"
 tournament_events.1270.c: "Ach, [congratulate_winner.Custom('CZ_FirstNameNoTooltip_V')], štěstěna má vskutku nevyzpytatelné cesty..."
 tournament_events.1270.d: "Zrovna jsem si [Select_CString(ROOT.Char.IsFemale,'vzpomněla','vzpomněl')], že musím být jinde."
 tournament_events.1270.nickname_toast: "Přezdívka se ujala"
 tournament_events.1280.t: "$tournament_header$ Laxní standardy"
 tournament_events.1280.desc: "Zástupy prostých lidí i šlechticů proudí k soutěžišti a snaží se získat dobrý výhled na soutěž [activity.GetCurrentPhase.GetPhase.GetName|l].\n\nVzrušený ruch protne příšerné zasténání. Tribuna přetížená diváky se s #EMP rachotem#! zřítí! Zástup křičících obětí zmizí z dohledu.\n\nZatímco létají obvinění, [ROOT.Char.Custom2('RelationToMeShort', intercessor)|l], [intercessor.GetName], důrazně odmítá trest pro stavitele: „Za tím stojí [intercessor.GetFaith.HighGodName], nic jiného!“"
 tournament_events.1280.a: "Popravte ty takzvané „#EMP stavitele#!“!"
 tournament_events.1280.b: "Musíme se postarat o pozůstalé."
 tournament_events.1280.c: "Někdy katastrofě nelze předejít..."
 tournament_events.1290.t: "Nezvladatelní darebáci"
 tournament_events.1290.desc: "Brzy ráno mě vzbudil poplach. Teď sleduji, jak zoufalí měšťané nosí vědra vody k hořícím budovám. [fire_holding.GetBaronyNameExplicitly|U] je v plamenech a [fire_holder.GetTitledFirstName] mi hněvivě vysvětluje proč.\n\n„Panoši, opilí a rozjaření soutěžemi, po hádce zapálili kupecký stánek. Pilo se [ROOT.Char.Custom('RegionalAlcoholicDrink')|l]...“ syčí. „Obnova potrvá měsíce!“\n\nTakhle se na můj turnaj vzpomínat nemá..."
 tournament_events.1290.a: "Panoši musí zaplatit za své pobavení."
 tournament_events.1290.b: "Uhradím opravy."
 tournament_events.1290.c: "Obávám se, že takové věci se zkrátka stávají..."
 tournament_events.1300.t: "$tournament_header$ Pod [Select_CString(old_knight.IsFemale,'jejími','jeho')] křídly"
 tournament_events.1300.desc: "„Ne, ještě ne. Posuň nohu trochu dozadu, udrž rovnováhu a veď úder #EMP skrz#! cíl a... ano! Výborně! Dobrá práce!“ zazní pochvala: „[young_knight.Custom('GetLassLad')|U] jak se patří!“\n\nPřede mnou [old_knight.GetFirstName], [Select_CString(old_knight.IsFemale,'ostřílená veteránka','ostřílený veterán')], cvičí [young_knight.Custom('CZ_FirstName_A')]. Zjevně se předávají zkušenosti z generace na generaci, jak se na označení [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')|l] sluší. [old_knight.GetFirstNameNoTooltip|U] si při mém příchodu všimne, že jsem tu.\n\n„Dobré ráno, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]! Pomáhám tu [young_knight.Custom('CZ_FirstNameNoTooltip_D')] vylepšit postoje. Už teď máš [Select_CString(young_knight.IsFemale,'talentovanou mladou bojovnici','talentovaného mladého bojovníka')]!“ [young_knight.GetFirstNameNoTooltip|U] se marně snaží skrýt rozpačitý, ale potěšený úsměv nad pochvalou od svého mentora."
 tournament_events.1300.a: "Skvělé! Pokračujte!"
 tournament_events.1300.b: "Možná bych se toho [Select_CString(ROOT.Char.IsFemale,'měla','měl')] ujmout #EMP já#!."
 tournament_events.1300.b.success: "[young_knight.GetFirstNameNoTooltip|U]: $game_concept_trait_level_track_xp$ #color_white +10#! (rys „[GetTrait('tourney_participant').GetName( GetNullCharacter )]“, $game_concept_trait_level_track$: náhodná)"
 tournament_events.1300.b.failure: "[young_knight.GetFirstNameNoTooltip|U]: $game_concept_trait_level_track_xp$ #color_white -5#! (rys „[GetTrait('tourney_participant').GetName( GetNullCharacter )]“, $game_concept_trait_level_track$: náhodná)"
 tournament_events.1300.c: "[Select_CString(old_knight.IsFemale,'Naučila','Naučil')|U] bys to i mě?"
 tournament_events.1310.t: "Slavný host"
 tournament_events.1310.desc: "Vzduch protne slavnostní fanfára. Kolem mě kluše herold na koni a rozvíjí pergamen.\n\n„Slyšte, slyšte! V tento překrásný den nás svou přítomností poctí opravdová hvězda. [Select_CString(famous_knight.IsFemale,'Porazila','Porazil')|U] všechny vyzyvatele od Irska až po Čínu! Je mi ctí a výsadou představit vám nejzručnější, nejskvělejší, světovou jedničku: [famous_knight.Custom('CZ_TitledFirstName_A')]!“\n\nKolem herolda prosviští postava a smykem zastaví koně. Sluneční paprsek [Select_CString(famous_knight.IsFemale,'ji','ho')] ozáří jako svatozář a řev shromážděného davu téměř rozechvěje zem."
 tournament_events.1310.a: "Jaká radost, že jsi tu, [famous_knight.Custom('CZ_FirstNameNoTooltip_V')]!"
 tournament_events.1310.b: "Možná by mě [Select_CString(famous_knight.IsFemale,'mohla','mohl')] něco naučit?"
 tournament_events.1310.b.critsuccess: "[famous_knight.GetFirstNameNoTooltip|U] tě naučí několik technik"
 tournament_events.1310.b.success: "Získáš pár tipů"
 tournament_events.1310.b.failure: "Učení [famous_knight.Custom('CZ_FirstNameNoTooltip_G')] neporozumíš"
 tournament_events.1310.c: "Prosím? Kdo to je?"
 tournament_events.1311.t: "Zmatek"
 tournament_events.1311.desc: "„Pozor, všichni přítomní!“ Hlas herolda protne davy proudící turnajištěm a nejeden člověk se otočí za zvukem.\n\n„Budiž známo, že na kolbiště právě přichází... přichází...“ Herold se lehce zadrhne a hledá v davu jméno, které očividně zapomněl.\n\n„Je to... má dobrá paní, totiž můj dobrý #EMP pán#!, totiž...“ Ruce se mu křečovitě svírají a povolují. Zapomněl jméno představované osoby a panika je na něm jasně vidět. Má přece ohlašovat označení [forgotten_knight.Custom('KnightCultureNoTooltipLowercase')|l]! [forgotten_knight.GetTitledFirstName|U], onen [forgotten_knight.Custom('KnightCultureNoTooltipLowercase')|l], už se k roztřesenému hlasateli blíží s tváří jako bouřkový mrak."
 tournament_events.1311.a: "[forgotten_knight.Custom('CZ_FirstNameNoTooltip_V')|U]! Mohu ti nabídnout jiného herolda?"
 tournament_events.1311.b: "Ten posel bude nejspíš potřebovat nové zaměstnání..."
 tournament_events.1311.b.tt: "Všichni účastníci s rysem [GetTrait('compassionate').GetName( GetNullCharacter )] získají vůči tobě #color_green +25#! mínění"
 tournament_events.1311.c: "Ha! Zapomněli [Select_CString(forgotten_knight.IsFemale,'její','jeho')] #EMP jméno!#!"
 tournament_events.1312.t: "Zahraniční šmrnc"
 tournament_events.1312.desc: "Při chůzi kolem hloučku mě zaujme obdivné ó a á, následované potleskem. Zvědavost mě vtáhne doprostřed.\n\nStojí tam [Select_CString(foreign_knight.IsFemale,'žena','muž')] s mečem napůl vytaženým z pochvy a ukazuje ohromeným lidem nezvyklý jílec. Očividně není odsud, [Select_CString(foreign_knight.IsFemale,'její','jeho')] přízvuk je zpěvavý a cizí. Jakmile mě spatří, uctivě skloní hlavu a znovu se obrátí k davu.\n\n„Co kdybych vám teď [Select_CString(foreign_knight.IsFemale,'ukázala','ukázal')] šermířský trik z mé země?“ Dav opět bouřlivě zajásá."
 tournament_events.1312.a: "Jak by se ti líbil nový lenní pán?"
 tournament_events.1312.a.success: "[foreign_knight.GetFirstNameNoTooltip|U] souhlasí, že se přidá"
 tournament_events.1312.a.failure: "[foreign_knight.GetFirstNameNoTooltip|U] tě odmítne"
 tournament_events.1312.b: "Jak fascinující postava!"
 tournament_events.1312.c: "Je prostě z ciziny. No a co?"
 tournament_events.1320.t: "Červená mince"
 tournament_events.1320.desc: "Vracím se z latríny a proplétám se mezi dvěma stany, když mi zezadu někdo pevně zakryje ústa dlaní.\n\n„Až tě nechám promluvit, budeš zticha. Dokážeš to?“ Můj tlumený souhlas hlas uspokojí. Otočím se na patě a spatřím cizí postavu v nezvyklém oděvu. Vzápětí mi do dlaně vtiskne drobný předmět.\n\n„Potřebuji to uschovat. Je to pro mě nesmírně důležité. Vrátím se pro to. Jestli ne...“ Po ústech cizí postavy přeběhne podivně unavený úsměv. „...považuj to za můj dar.“\n\nSklopím zrak. V dlani mi leží zlatá, a přece podivně #EMP rudá#! mince. Matně se leskne a na dotek trochu hřeje."
 tournament_events.1320.a: "Uschovám to pro tebe."
 tournament_events.1320.b: "O tohle nestojím!"
 tournament_events.1321.t: "Půjčená mince"
 tournament_events.1321.desc: "Mezi soutěžemi se občerstvuji a přes okraj poháru vidím přicházet zahalenou, podivně povědomou postavu.\n\n„Myslím, že máš něco mého.“ Vstoupí do světla, jako by na jeho záři nebyla zvyklá. „Tu minci, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Stále ji máš, že?“\n\nVytáhnu ji z kapsy a kov se zaleskne na slunci. Vypadá ještě ruději než předtím, sytým granátovým odstínem. Postava se pod kapucí usměje.\n\n„Z celého srdce děkuji. Prosím, za tvou námahu.“ Jednu ruku natáhne pro minci, v druhé nabízí měšec obtěžkaný zlatem."
 tournament_events.1321.a: "Přijď na můj dvůr. Mohu využít tvé schopnosti."
 tournament_events.1321.b: "Bylo mi potěšením obchodovat, příteli."
 tournament_events.1321.c: "Hmm. Myslím, že ne."
 tournament_events.1321.c.tt: "To vypadá riskantně..."
 tournament_events.1322.t: "Stojí to za riziko?"
 tournament_events.1322.desc: "Prudký vztek ve tváři [Select_CString(unusual_stranger.IsFemale,'cizinky','cizince')] mě zaskočí a mé stráže vykročí vpřed s tasenými zbraněmi. Rty se pohrdavě zkřiví a kapuce sklouzne dolů.\n\n„Vidíš mou tvář,“ řekne. „Povím ti i své jméno. Teď si nejvíc přeji, abys v noci [Select_CString(ROOT.Char.IsFemale,'ležela','ležel')] vzhůru a [Select_CString(ROOT.Char.IsFemale,'přemýšlela','přemýšlel')], jak se ti [unusual_stranger.GetFirstName] spravedlivě pomstí. Možná to potrvá roky, ale já nezapomínám. A teď doufám, že nezapomeneš ani ty.“\n\n„Pamatuj: #EMP přijde zúčtování.#!“ Znovu si nasadí kapuci, přitáhne plášť k tělu a rozplyne se v davu."
 tournament_events.1322.a: "Já... jsem si [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')], že to bude v pořádku."
 tournament_events.1330.t: "Další generace"
 tournament_events.1330.desc: "„Hodně štěstí, [ROOT.Char.Custom('FormOfAddressForLiege')|l]!“ Na výkřik z davu odpovím vděčným mávnutím. „A hodně štěstí i tobě, [heir.Custom('CZ_FirstName_V')]!“\n\n„Co tím mysleli?“ zeptám se [heir.Custom('CZ_FirstNameNoTooltip_G')], [Select_CString(heir.IsFemale,'kráčející','kráčejícího')] vedle mě. „Proč by ti přáli štěstí?“ [Select_CString(heir.IsFemale,'Její','Jeho')|U] nervózní pohled mi rychle odpoví.\n\n„Já... já chci soutěžit!“ trvá na svém. „Ty se účastníš, proč já nemůžu?“ Prudce se zastavím. [heir.GetFirstNameNoTooltip|U] vedle mě nejistě zabrzdí a [Select_CString(heir.IsFemale,'její','jeho')] troufalost pod mou reakcí poněkud uvadá."
 tournament_events.1330.a: "Musíš to pochopit. Záleží mi na tobě příliš, než abych tě [Select_CString(ROOT.Char.IsFemale,'vystavila','vystavil')] riziku."
 tournament_events.1330.b: "Jaké štěstí mít [Select_CString(heir.IsFemale,'takovou dceru','takového syna')]!"
 tournament_events.1330.c: "Zakazuji to! Okamžitě se odhlás!"
 tournament_events.1330.d: "...neříkej to [Select_CString(spouse.IsFemale,'své matce','svému otci')]."
 tournament_events.1331.t: "Pro rodinu?"
 tournament_events.1331.desc: "„[ROOT.Char.Custom('CZ_FirstName_V')|U]! Právě s [Select_CString(ROOT.Char.IsFemale,'takovou ženou','takovým mužem')] jsem se [Select_CString(dynast.IsFemale,'chtěla','chtěl')] setkat!“ Spěchá ke mně [dynast.GetFirstName]. „Musíme si promluvit. [Select_CString(dynast.IsFemale,'Slyšela','Slyšel')|U] jsem, že jsi [Select_CString(ROOT.Char.IsFemale,'přihlášená','přihlášený')] do nadcházející soutěže, a no...“\n\nMůj netečný pohled jen utvrdí [dynast.Custom('CZ_FirstNameNoTooltip_A')] v postoji. Napřímí se do plné výše.\n\n„Musíš odstoupit. Jsem hlava dynastie [dynast.GetDynastyName] a žádám to! Pro dobro našeho rodu!“ Zatímco mě kárá, ohlédnu se k vyvěšeným barvám soutěžících. Nechybí mezi nimi, jak jinak, ani [Select_CString(dynast.IsFemale,'její','jeho')]."
 tournament_events.1331.a: "Zastrašování na mě nezabere, [dynast.Custom('CZ_FirstNameNoTooltip_V')]."
 tournament_events.1331.b: "Samozřejmě. Cokoli pro #EMP „rodinu“#!."
 tournament_events.1331.c: "Nechceš svá slova přehodnotit, [dynast.Custom('CZ_FirstNameNoTooltip_V')]?"
 tournament_events.1331.d: "Nenechám se nutit k tomu, co prospívá jen tobě!"
 tournament_events.1331.e: "Odstoupím, pokud to bude nutné."
 tournament_events.1332.t: "Dávání a braní"
 tournament_events.1332.desc: "Vidím, jak ke mně kráčí [powerful_vassal.GetFirstName], a na okamžik zděšeně zavřu oči. Když je znovu otevřu, stojí přímo přede mnou. Nucený úsměv jen chabě zakrývá zlostný pohled.\n\n„[ROOT.Char.Custom('CZ_FirstName_V')|U], [ROOT.Char.Custom('FormOfAddressForLiege')|l], jak #EMP úžasné#! je vidět tě tady soutěžit!“ Popadne mě za paži a odvede trochu stranou od davu k důvěrnému hovoru. „Poslyš, potřebuji laskavost.“ Když protočím oči, [Select_CString(powerful_vassal.IsFemale,'její','jeho')] přetvářka málem praskne.\n\n„Chci se v téhle soutěži dobře umístit. A jako [Select_CString(powerful_vassal.IsFemale,'jedna','jeden')] z tvých nejmocnějších a #EMP nejvěrnějších#! vazalů se ptám, zda mohu počítat s tvou pomocí.“"
 tournament_events.1332.a: "Ty jsi ale [Select_CString(powerful_vassal.IsFemale,'věrná','věrný')], viď?"
 tournament_events.1332.b: "Nejvěrnější, říkáš?"
 tournament_events.1332.c: "Moje kapsy jsou v poslední době trochu prázdné..."
 tournament_events.1332.d: "Pro tebe, [powerful_vassal.Custom('CZ_FirstNameNoTooltip_V')]? Cokoli."
 tournament_events.1332.e: "Budeš si muset poradit [Select_CString(powerful_vassal.IsFemale,'sama','sám')]."
 tournament_events.1400.t: "$tournament_header$ Malé příběhy"
 tournament_events.1400.desc: "Být v davu při sportovní události je skutečná radost. Ta atmosféra, zvuky a podívaná. Jenže občas má tolik nevýhod jako výhod.\n\nJedna se právě objevila: vězím za mohutnou postavou [tall_person.Custom('CZ_FirstName_G')]. Nakláním se na jednu i druhou stranu, ale [Select_CString(tall_person.IsFemale,'její','jeho')] rozměry výhled téměř dokonale zakrývají.\n\nHlasitě si povzdechnu a podupávám nohou. [tall_person.GetFirstNameNoTooltip|U] se ani nehne. Ozve se jásot nad něčím velkolepým a vzrušujícím. Začíná mi vřít žluč."
 tournament_events.1400.a: "Jestli chceš koukat, donutím tě #EMP klečet#!!"
 tournament_events.1400.a.fight: "Boj alespoň jedním či druhým způsobem problém vyřeší..."
 tournament_events.1400.b: "Promiň, můžeš prosím #EMP uhnout#!?"
 tournament_events.1400.b.success: "[tall_person.GetFirstNameNoTooltip|U] neochotně ustoupí"
 tournament_events.1400.b.failure: "[tall_person.GetFirstNameNoTooltip|U] odmítne"
 tournament_events.1400.c: "Nechceš bojovat v mých službách?"
 tournament_events.1400.c.success: "[tall_person.GetFirstNameNoTooltip|U] se k tobě přidá"
 tournament_events.1400.c.failure: "[tall_person.GetFirstNameNoTooltip|U] odmítne"
 tournament_events.1400.d: "To nevadí."
 tournament_events.1401.t: "$tournament_header$ Velké historky"
 tournament_events.1401.desc: "To je ale den! Místo přímo v čele davu mi dává jedinečný výhled. Všechno je skvělé, dokud neucítím lehké zatažení za oděv. Sklopím zrak a uvidím mnohem menší postavu, která se snaží protáhnout kolem.\n\nJakmile si [smol_person.GetFirstName] všimne mého pohledu, napřímí se a začne prosit.\n\n„Ty jsi prostě... tak #EMP [Select_CString(ROOT.Char.IsFemale,'velká','velký')]#!!“ Ukazuje na rozdíl mezi našimi postavami. „Vůbec nic nevidím! Prosím, můžu se postavit před tebe?“"
 tournament_events.1401.a: "Ha ha! Ne."
 tournament_events.1401.a.success: "Podaří se ti [Select_CString(smol_person.IsFemale,'ji','ho')] zablokovat"
 tournament_events.1401.a.failure: "[smol_person.GetFirstNameNoTooltip|U] se protáhne kolem"
 tournament_events.1401.b: "Dobrá, pojď přede mě."
 tournament_events.1402.t: "$tournament_header$ Vylité občerstvení"
 tournament_events.1402.desc: "Soutěž přede mnou vrcholí a účastníci jsou vyrovnaní. Svírám dřevěné zábradlí a spolu s davem nadšeně křičím. Výkřik se však změní v přiškrcené zaječení, když mi cosi steče po páteři. Nějaká tekutina... podivně horká #EMP i#! studená zároveň?\n\nOtočím se na patě a přede mnou stojí [drinking_spectator.GetFirstName]. V poháru šplouchají zbytky neznámého nápoje, který mi teď stéká po zádech.\n\n„Tak dávej pozor, kam jdeš!“ zablábolí a obviňujícím gestem na mě ukáže pohárem. „[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] bys být opatrnější!“"
 tournament_events.1402.a: "Koupím nám oběma další?"
 tournament_events.1402.b: "Stráže! Odveďte [drinking_spectator.Custom2('CZ_InsultAdjective_A', ROOT.Char)|l] [drinking_spectator.Custom2('CZ_InsultNoun_A', ROOT.Char)|l] z mého dohledu!"
 tournament_events.1402.c: "Máš pravdu. Moje chyba!"
 tournament_events.1403.t: "$tournament_header$ Zdeptaný dav"
 tournament_events.1403.desc: "Dav se naklání vpřed, zatímco se soutěžící chystá, ale atmosféru náhle protne pronikavý hlas. Na kolbiště [Select_CString(realm_priest.IsFemale,'vtrhla','vtrhl')] [realm_priest.GetFirstName].\n\n„Jak #EMP můžete#! sledovat tuhle zahálčivou, časem plýtvající #EMP špínu#!!“ hřímá, otáčí se od jednoho člověka k druhému a při kárání [Select_CString(realm_priest.IsFemale,'jí','mu')] od úst létají sliny. „Měli byste tu trávit méně času a věnovat se raději uctívání!“\n\nMoře lidí na okamžik zaváhá. V těch slovech je zrnko pravdy. Pak se ale ozve několik odvážných a rozzlobených hlasů. Na [realm_priest.Custom('CZ_FirstNameNoTooltip_A')] se zuřivě valí vlna veřejného mínění, ale neustoupí a dál burácí své kázání."
 tournament_events.1403.a: "[realm_priest.GetFirstNameNoTooltip|U] má pravdu, vy neznabozi!"
 tournament_events.1403.b: "Buu! #EMP Buuuu!#!"
 tournament_events.1403.c: "Možná to nechám vyšumět."
 tournament_events.1404.t: "$tournament_header$ Potenciální nápadníci"
 tournament_events.1404.desc: "Usadím se poblíž čela davu s [ROOT.Char.Custom2('CZ_RelationToMeShort_I', gossip_friend)|l], [gossip_friend.Custom('CZ_FirstName_I')], a soutěžící před námi klušou přes kolbiště. [gossip_friend.GetFirstNameNoTooltip|U] do mě několikrát šťouchne a nepříliš nenápadným kývnutím ukáže na dva z nich.\n\n„Co říkáš na ty dva?“ zeptá se a potlačí nadšené zachichotání. „Kdo by byl #EMP tvá#! volba?“ Z přehnaného pohybu [Select_CString(gossip_friend.IsFemale,'jejího','jeho')] obočí je jasné, že se neptá, kdo podle mě vyhraje.\n\n„Podívej, jdou blíž! Řekni něco! Ať tě slyší!“"
 tournament_events.1404.a: "„Ani jeden se nemůže srovnávat s #EMP tvou#! krásou.“"
 tournament_events.1404.b: "„Ha! Na bitevním poli lásky bys [Select_CString(gossip_friend.IsFemale,'obstála','obstál')] lépe než [Select_CString(And(knight_1.IsFemale,knight_2.IsFemale),'obě','oba')]!“"
 tournament_events.1404.c: "„#BOL Ó, to je nádherný exemplář [knight_1.GetFirstNameNoTooltip]?!#!“"
 tournament_events.1404.d: "„#BOL Páni, jen se #EMP podívej#! na [knight_2.Custom('CZ_FirstNameNoTooltip_A')]!#!“"
 tournament_events.1404.e: "„#EMP Pst, pst!#! #DIE1 To #EMP stačí#!, [gossip_friend.Custom('CZ_FirstNameNoTooltip_V')]!#!“"
 tournament_events.1405.t: "$tournament_header$ Když má [flirty_onlooker.Custom('GetLassLad')|l] štěstí"
 tournament_events.1405.desc: "Pohledem přejíždím dav. Všeobecný ruch mě obtéká, všichni diváci si povídají nebo povzbuzují soutěžící. Všichni kromě jedné osoby.\n\n[flirty_onlooker.GetFirstName|U] se dívá přímo na mě. Naše pohledy se setkají, ale okamžitě uhne a začne očima těkat všude možně, jen ne ke mně. Normálně bych [Select_CString(ROOT.Char.IsFemale,'byla podezíravá','byl podezíravý')]. Skousnutý ret a kradmé pohledy, kterými ověřuje, zda se stále dívám, ale tentokrát vyprávějí jiný příběh."
 tournament_events.1405.a: "Užitečná informace do budoucna!"
 tournament_events.1405.b: "Ale, ale, ale..."
 tournament_events.1405.b.tt: "Opětuj [flirty_onlooker.Custom('CZ_FirstNameNoTooltip_D')] úsměv a mrknutí."
 tournament_events.1405.c: "Jsem tu kvůli podívané, ne flirtování!"
 tournament_events.1406.t: "$tournament_header$ Nové zážitky"
 tournament_events.1406.desc: "Prodíráme se davem a hlavička [root_child.Custom('CZ_FirstName_G')] se neustále otáčí za všemi obrazy a zvuky. Nadšením se doslova chvěje, tahá mě za ruku a ukazuje na spěchající soutěžící.\n\nJemně [Select_CString(root_child.IsFemale,'ji','ho')] usměrňuji, ale dál se vytrhává. Tolik nových zážitků prostě nedokáže vstřebat."
 tournament_events.1406.a: "„Soustřeď se na své učení, dítě.“"
 tournament_events.1406.b: "„No tak, vylez mi na ramena!“"
 tournament_events.1406.c: "„Já se taky těším, [root_child.Custom('CZ_FirstNameNoTooltip_V')]!“"
 tournament_events.1407.t: "$tournament_header$ Obhajoba cti"
 tournament_events.1407.desc: "Tamhle! [ROOT.Char.Custom2('RelationToMeShort', competing_family)|U], [competing_family.GetFirstName], soutěží v téhle disciplíně a konečně se mi [Select_CString(competing_family.IsFemale,'ji','ho')] podařilo najít v zástupu. Sotva otevřu ústa k povzbuzení, uslyším jiný hlas.\n\n„Hej, [competing_family.Custom('CZ_FirstNameNoTooltip_V')]! Rovnou to zabal a ušetři nám všem trápení!“\n\nRozhlédnu se mezi pochechtávajícími diváky a spatřím [shouting_fan.Custom('CZ_FirstName_A')], jak chystá další salvu urážek."
 tournament_events.1407.a: "Co jsi to právě [Select_CString(shouting_fan.IsFemale,'řekla','řekl')]?!"
 tournament_events.1407.a.success: "Vyhraješ rvačku"
 tournament_events.1407.a.failure: "Prohraješ rvačku"
 tournament_events.1407.b: "Do toho, [competing_family.Custom('CZ_FirstNameNoTooltip_V')]! Vítězství je na dosah!"
 tournament_events.1407.b.success: "Podaří se ti přehlušit [shouting_fan.Custom('CZ_FirstNameNoTooltip_A')]"
 tournament_events.1407.b.failure: "Nepodaří se ti přehlušit [shouting_fan.Custom('CZ_FirstNameNoTooltip_A')]"
 tournament_events.1407.c: "Snad to [competing_family.GetFirstNameNoTooltip] nebere osobně..."
 tournament_events.1408.t: "$tournament_header$ Uhašení žízně"
 tournament_events.1408.desc: "Slunce praží a já sleduji soutěž ze svého místa v čele davu. Dnes je vážně příliš teplo. Nebo mám na sobě jen moc vrstev?\n\nPřemítám nad tím, když spatřím podnikavého mladého kupce se soudkem nějakého nápoje na rameni. Očividně ho za peníze nabízí kolemjdoucím. Okamžitě mi vyschne v ústech. Kdybych se k němu tak [Select_CString(ROOT.Char.IsFemale,'dostala','dostal')] bez ztráty místa...\n\nZoufale se rozhlížím po řešení, ale vidím jen [drinking_fan.Custom('CZ_FirstName_A')], jak se s nápojem pevně v ruce loudá zpátky na své místo v davu."
 tournament_events.1408.a: "„Můžu to od tebe koupit?“"
 tournament_events.1408.a.tt: "To bude chtít trochu přesvědčování..."
 tournament_events.1408.b: "Možná když si pospíším..."
 tournament_events.1408.b.success: "Odběhneš si pro nápoj a snadno se vrátíš"
 tournament_events.1408.b.failure: "Koupíš si nápoj, ale přijdeš o místo"
 tournament_events.1408.b.criticalfailure: "Přijdeš o místo a prodavač mezitím odejde"
 tournament_events.1408.c: "Tak to budu muset vydržet."
 tournament_events.1409.t: "$tournament_header$ Někdo, komu fandit"
 tournament_events.1409.desc: "Ustoupím stranou, abych někoho [Select_CString(ROOT.Char.IsFemale,'pustila','pustil')], a ten kdosi hned spustí.\n\n„Ach, [ROOT.Char.Custom('CZ_TitledFirstName_V')]! Tebe bych tu [Select_CString(friendly_fan.IsFemale,'nečekala','nečekal')]!“ Otevřu ústa k odpovědi, ale [friendly_fan.GetFirstName] je rychlejší. „Máš nějakého favorita? Někoho, kdo si podle tebe odnese vítězství? Já mám dobrý pocit ze sázky na [fan_favourite.Custom('CZ_FirstName_A')]!“\n\nChvíli zvažuji možnosti. Možná bude nejlepší prostě souhlasit?"
 tournament_events.1409.a: "„Samozřejmě! Musí to být [fan_favourite.GetFirstNameNoTooltip]!“"
 tournament_events.1409.b: "„Samozřejmě to bude [other_favourite.GetFirstNameNoTooltip], [friendly_fan.Custom2('CZ_InsultNoun_V', ROOT.Char)|l]!“"
 tournament_events.1409.c: "Možná když se jen usměju a přikývnu..."
 tournament_events.1410.t: "$tournament_header$ Nespokojení fanoušci"
 tournament_events.1410.desc: "Přes řev davu jasně slyším zárodek rvačky. Natáhnu krk a za sebou rozeznám dvě postavy, které se drží za oděv. O co přesně se hádají, není jasné, ale kolem nich už stojí kroužek hlučných přihlížejících.\n\n„Ty [fan_2.Custom2('InsultAdjective', SCOPE.sC('fan_1'))|l] [fan_2.Custom2('CZ_InsultNoun_V', SCOPE.sC('fan_1'))|l]!“ vyplivne [fan_1.GetFirstName] a s kletbou se napřímí do plné výše. [fan_2.GetFirstName|U] odpoví stejnou mincí.\n\n„Jsi hulvát a [fan_1.Custom2('InsultNoun', SCOPE.sC('fan_2'))|l]! Vytrhnu ti střeva!“ Ti dva se zjevně chystají do sebe pustit."
 tournament_events.1410.a: "„To stačí!“"
 tournament_events.1410.a.tt: "Pokusit se mezi ně vstoupit může být nebezpečné, ale #EMP něco#! udělat musím..."
 tournament_events.1410.a.success: "Podaří se ti rvačku ukončit"
 tournament_events.1410.a.failure: "Při následné rvačce utrpíš zranění"
 tournament_events.1410.b: "„No tak! To není čas ani místo pro rvačku!“"
 tournament_events.1410.b.success: "Tvá uklidňující slova zaberou"
 tournament_events.1410.b.failure: "Dvojice pokračuje v rvačce"
 tournament_events.1410.c: "Jo! Prašti [Select_CString(fan_1.IsFemale,'ji','ho')]!"
 tournament_events.1410.c.fan1: "[fan_1.GetFirstNameNoTooltip|U] vyhraje rvačku"
 tournament_events.1410.c.fan2: "[fan_2.GetFirstNameNoTooltip|U] vyhraje rvačku"
 tournament_events.6000.t: "$tournament_header$ Všemi prostředky"
 tournament_events.6000.desc: "Turnaj je ideální místo, kde sebe i svět zbavit [murder_target.Custom2('CZ_InsultNoun_G', ROOT.Char)|l], [murder_target.Custom('CZ_TitledFirstName_G')]. Za každým rohem číhá skryté nebezpečí a časté nehody rozptylují podezření.\n\n"
 tournament_events.6000.again: "[murder_target.GetTitledFirstName|U] stále žije...\n\n"
 tournament_events.6000.deferred: "[Select_CString(ROOT.Char.IsFemale,'Vyčkávala','Vyčkával')|U] jsem s chvályhodnou trpělivostí... na dokonalou příležitost udeřit na [murder_target.Custom('CZ_TitledFirstName_A')]..."
 tournament_events.6000.foot: "Blíží se soutěž [activity.GetCurrentPhase.GetPhase.GetName|l] a otrávená čepel ve správných rukou by [Select_CString(murder_target.IsFemale,'ji','ho')] mohla okamžitě zahubit...\n\n"
 tournament_events.6000.joust: "Kopí pro soutěž [activity.GetCurrentPhase.GetPhase.GetName|l] mají z bezpečnostních důvodů tupé hroty. Pečlivě připravená výměna za jejich smrtelnější příbuzné by ale mohla projít bez povšimnutí...\n\n"
 tournament_events.6000.self_match: "Bylo by až příliš snadné upravit vlastní výstroj, obejít turnajová bezpečnostní opatření a před zraky davu skoncovat s [murder_target.Custom('CZ_FirstNameNoTooltip_I')]..."
 tournament_events.6000.patsy_match: "Stačí upravit výstroj [murder_match.Custom('CZ_FirstName_G')] před zápasem s [murder_target.Custom('CZ_FirstNameNoTooltip_I')] a modlit se, aby nám hvězdy přály..."
 tournament_events.6000.injuries: "Možná zranění"
 tournament_events.6000.a: "Zajímavá příležitost."
 tournament_events.6000.b: "Ano, vina padne na [murder_match.Custom('CZ_FirstNameNoTooltip_A')]."
 tournament_events.6000.c: "Zlikviduji toho blázna!"
 tournament_events.6000.d: "Ještě ne..."
 tournament_events.6000.e: "Je to příliš riskantní..."
 tournament_events.6000.success: "Tvá sabotáž uspěje"
 tournament_events.6000.failure: "Tvá sabotáž nic nezmění"
 tournament_events.6000.success_tt: "[murder_match.GetFirstNameNoTooltip|U] zabije [murder_target.Custom('CZ_FirstNameNoTooltip_A')]"
 tournament_events.6000.blame: "Veškerá obvinění padnou na [murder_match.Custom('CZ_ShortUIName_A')]"
 tournament_events.6000.imprisonment_tt: "Protože [murder_target.GetFirstNameNoTooltip] turnaj pořádá, hrozí [murder_match.Custom('CZ_FirstNameNoTooltip_D')] uvěznění"
 tournament_events.6001.t: "$tournament_events.6050.t$"
 tournament_events.6001.foot: "Potřu čepel prudkým jedem a přemítám o slibech alchymisty, který mi tu páchnoucí směs prodal. Pak ji opatrně zasunu do pochvy."
 tournament_events.6001.horse: "Za soumraku vyměním kopí ve zbrojnici. Leží tam ve tmě a čekají na ranní troubení."
 tournament_events.6001.success_patsy: "\n\nPo chvíli napětí, kdy mi srdce buší jako o závod, jsem pryč! S trochou štěstí si [murder_match.GetFirstName] ničeho nevšimne, dokud nebude pozdě..."
 tournament_events.6001.success: "\n\nMá zákeřně upravená výstroj je na soutěž [activity.GetCurrentPhase.GetPhase.GetName|l] připravena. Stačí ji jen správně použít..."
 tournament_events.6001.failure: "\n\nBohužel, když se následujícího rána vrátím, je jasné, že si mé práce všiml bystrý sluha. Pokusy přinesly jen podezření z podvodu a panoši jsou ostražitější než kdy dřív."
 tournament_events.6001.closing: "\n\nTvá chvíle přijde dřív, než si myslíš, [murder_target.Custom('CZ_FirstName_V')]..."
 tournament_events.6001.a: "A nemohu se dočkat..."
 tournament_events.6001.b: "Fuj..."
 tournament_events.6010.t: "$tournament_header$ Zabít soka"
 tournament_events.6010.desc: "Na konci dne spatřím [Select_CString(murder_target.IsFemale,'svou sokyni','svého soka')], [murder_target.Custom('CZ_Name_A')], jak si v pohodě užívá společnost. Tahle soutěž poskytuje dokonalou příležitost, aby [Select_CString(murder_target.IsFemale,'ji','ho')] potkala #EMP nehoda#!...\n\nV tak uvolněném prostředí by nemělo být těžké přisypat [Select_CString(murder_target.IsFemale,'jí','mu')] něco do poháru."
 tournament_events.6010.a: "Vím o lékárníkovi poblíž."
 tournament_events.6010.a.flavor: "[murder_target.GetFirstNameNoTooltip|U] okusí jiný druh jedu!"
 tournament_events.6010.a.success: "[Select_CString(murder_target.IsFemale,'Tvá sokyně','Tvůj sok')|U] vypije svůj poslední nápoj"
 tournament_events.6010.a.ill: "Tělesné šťávy [Select_CString(murder_target.IsFemale,'tvé sokyně','tvého soka')] se rozbouří"
 tournament_events.6010.a.failure: "[Select_CString(murder_target.IsFemale,'Tvá sokyně','Tvůj sok')|U] zřejmě nejeví žádné účinky"
 tournament_events.6010.b: "Kde jsou ti zoufalci, které jsem předtím [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')]?"
 tournament_events.6010.b.flavor: "Není nic užitečnějšího než zoufalec..."
 tournament_events.6010.b.success: "[Select_CString(murder_target.IsFemale,'Tvá sokyně bude zabita','Tvůj sok bude zabit')|U]"
 tournament_events.6010.b.caught: "[Select_CString(murder_target.IsFemale,'Tvá sokyně','Tvůj sok')|U] přemůže násilníka"
 tournament_events.6010.b.failure: "[Select_CString(murder_target.IsFemale,'Tvá sokyně','Tvůj sok')|U] násilníkovi unikne"
 tournament_events.6010.c: "Tohle nebude fungovat..."
 tournament_events.6011.t: "$tournament_events.6010.t$"
 tournament_events.6011.poison: "Spěchám zpátky od prodavače lektvarů, který mou historku o krysách ve stájích přijal až příliš ochotně.\n\nZatímco zaneprázdněný hostinský dolévá poháry, je až děsivě snadné nepozorovaně vlít směs do poháru [murder_target.Custom('CZ_FirstName_G')].\n\n"
 tournament_events.6011.thug: "Násilník vezme mé peníze, s hrubou odevzdaností přijme podmínky a potvrdí mé nenápadné kývnutí směrem k [murder_target.Custom('CZ_TitledFirstName_D')].\n\n"
 tournament_events.6011.death: "Ještě znepokojivější je snad to, jak rychle se po napití zhroutí, svíjí v bolestech a přiškrceně volá o pomoc."
 tournament_events.6011.ill: "Zatajím dech, když přiloží pohár ke rtům, a na okamžik se raduji z úspěchu. Ten ale nepřijde. [murder_target.Custom2('InsultNoun', ROOT.Char)|U] má jen horečku a nejspíš přežije."
 tournament_events.6011.second_chance: "K mé zlosti jed tu [Select_CString(murder_target.IsFemale,'ženu','muže')] zřejmě jen omámí. Když ale vyjdu za [Select_CString(murder_target.IsFemale,'ní','ním')] ven, zjišťuji, že jsme sami v odlehlém koutě turnajiště.\n\nTohle může být poslední příležitost dosáhnout cíle..."
 tournament_events.6011.ache: "Účinek přijde rychle. Sleduji hosty shlukující se kolem [Select_CString(murder_target.IsFemale,'sténající oběti','sténajícího nešťastníka')], [murder_target.Custom2('CZ_InsultNoun_G', ROOT.Char)|l], ale brzy je jasné, že lahvička neměla slíbenou sílu.\n\nNanejvýš [Select_CString(murder_target.IsFemale,'ji','ho')] čeká špatná noc na latríně... "
 tournament_events.6011.slain: "Při čekání na zprávy nemohu skoro spát, ale v srdci už cítím úlevu, že mám od [Select_CString(murder_target.IsFemale,'sokyně','soka')] pokoj.\n\nZa úsvitu se [CZPrepV(activity.GetCurrentPhase.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(activity.GetCurrentPhase.GetLocation,'L')] nemluví o ničem jiném než o hrůzném útoku na [murder_target.Custom('CZ_FirstNameNoTooltip_A')]. Hlídač [Select_CString(murder_target.IsFemale,'ji','ho')] našel na ulici s vyhřezlými vnitřnostmi a zakrvácenou dýkou po boku."
 tournament_events.6011.caught: "Při čekání na zprávy nemohu skoro spát. Neurčitý strach mě hlodá až do rána.\n\nZa úsvitu zaklepou sluhové a sdělí mi, že [murder_target.GetFirstNameNoTooltip] tvrdí, že v noci [Select_CString(murder_target.IsFemale,'přemohla','přemohl')] násilníka, který se [Select_CString(murder_target.IsFemale,'ji','ho')] pokusil zavraždit. Prý jsem za tím [Select_CString(ROOT.Char.IsFemale,'stála','stál')] já."
 tournament_events.6011.escape: "Při čekání na zprávy nemohu skoro spát. Jsem si [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')], že se něco pokazilo.\n\nSrdce mi nelhalo. [murder_target.GetFirstNameNoTooltip|U] stále žije a zpráva o útoku zahaleného cizince na [Select_CString(murder_target.IsFemale,'její','jeho')] život se roznesla [CZPrepV(activity.GetCurrentPhase.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(activity.GetCurrentPhase.GetLocation,'L')]."
 tournament_events.6011.a.death: "To bylo skoro #EMP příliš#! snadné..."
 tournament_events.6011.a.ill: "Ještě je naděje..."
 tournament_events.6011.a.slain: "To byla nechutná práce."
 tournament_events.6011.a.caught: "Zatracení tuláci."
 tournament_events.6011.a: "Jaká zatracená smůla."
 tournament_events.6011.b: "Musím jednat nyní."
