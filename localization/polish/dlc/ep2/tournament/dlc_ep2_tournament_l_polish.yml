l_polish:
 train_for_tournament_decision_name: "Trénovat na turnaj"
 train_for_tournament_decision_desc: "Volání oceli nesmí zůstat bez odpovědi. Navléknu si zbroj, vezmu zbraň a vyrazím na cvičiště a trochu si procvičím tělo."
 train_for_tournament_decision_tooltip: "Procvič svou [Concept('prowess','udatnost')|E] před nadcházejícím [CZActivity('activity_tournament','I')]"
 train_tournament_decision.tt: "Ty i tvoji $knight_culture_player_plural$ si zdokonalíte své dovednosti. Pokud se výcvik vydaří, zvýší se tvá [Concept('prowess','udatnost')|E] pro bojové disciplíny nadcházejícího [CZActivity('activity_tournament','G')]."
 train_for_tournament_decision_confirm: "Zahájit výcvik"
 grand_tournament_active: "Musí se konat [GetActivityType('activity_tournament').GetName], kterého se můžeš zúčastnit"
 ep2_decision_events.0001.t: "Turnajový výcvik"
 ep2_decision_events.0001.desc: "„A teď se otoč doprava!“ vykřikne [marshal.GetTitledFirstName] a zasadí mé zbrani tak silný úder, že musím o několik kroků ustoupit.\n\n„Na turnaji s tebou nikdo nebude zacházet v rukavičkách, [ROOT.Char.Custom('FormOfAddressForLiege')|l],“ pronese a otře si pot z čela.\n\n„Jestli chceš zvítězit, nesmíš si dovolit prohrát. Ani proti mně. Ani jednou.“"
 ep2_decision_events.0001.a: "„#EMP Arrrghhh!#!“"
 ep2_decision_events.0001.a.crit_success: "Výcvik probíhá #EMP skvěle#!"
 ep2_decision_events.0001.a.success: "Výcvik probíhá působivě"
 ep2_decision_events.0001.a.failure: "Výcvik je úspěšný"
 ep2_decision_events.0001.a.crit_failure: "Při výcviku se zraníš"
 ep2_decision_events.0001.a.knight_fail: "Výcvik je neúspěšný"
 ep2_decision_events.0001.b: "Naše kultura nabízí víc než jen výcvik."
 ep2_decision_events.0001.b.tt: "$tradition_tournament_discount_desc$"
 tournament_training_decision_modifier: "Dobře vycvičený"
 tournament_training_decision_modifier_desc: "Tato postava se připravovala na nadcházející [CZActivity('activity_tournament','A')] a začne s vyšší hodnotou [Concept('progress_to_victory','postupu k vítězství')|E]."
 tradition_tournament_discount_desc: "Přechod na [Concept('culture_tradition','kulturní tradici')|E] $tradition_chivalry_name$ bude stát o 2000 [Concept('prestige','prestiže')|E] méně"
 activity_tournament: "Velký turnaj"
 activity_tournament_plural: "Velké turnaje"
 activity_tournament_desc: "Uspořádej velkolepou sérii bojových nebo kulturních [Concept('contests','soutěží')|E], které přilákají soupeře z blízka i daleka. V turnajových kláních pak změří své síly v boji o [Concept('prizes','ceny')|E] a [Concept('prestige','prestiž')|E]."
 activity_tournament_host_desc: "$BULLET_WITH_TAB$[prestige_i|E] [Concept('prestige','Prestiž')|EU]\n$BULLET_WITH_TAB$[legitimacy_i] [Concept('legitimacy','Legitimita')|EU]\n$BULLET_WITH_TAB$[stress_loss_i] [Concept('stress_loss','Úbytek stresu')|EU]\n$BULLET_WITH_TAB$[GetTrait('tourney_participant').GetName( GetNullCharacter )] [Concept('trait_level_track_xp','Zkušenosti rysu')|EU]\n$BULLET_WITH_TAB$[Concept('acclaimed_knights','Uznávaní rytíři')|EU] získávají [Concept('glory','slávu')|E]"
 activity_tournament_selection_tooltip: "Pozvi své poddané a sousedy na velkolepou podívanou plnou soutěží. Zúčastnit se mohou také tvoji $knight_culture_player_plural$.\n\nOčekávané odměny:\n$BULLET_WITH_TAB$[prestige_i] [Concept('prestige','Prestiž')|EU]\n$BULLET_WITH_TAB$[legitimacy_i] Zisk [Concept('legitimacy','legitimity')|E]\n$BULLET_WITH_TAB$[stress_loss_i] Úbytek [Concept('stress','stresu')|E]"
 tournament_contest: "Soutěž"
 progress_to_victory: "$game_concept_progress_to_victory$"
 progress_to_victory_desc: "$game_concept_progress_to_victory_desc$"
 activity_tournament_destination_selection: ""
 activity_tournament_guest_help_text: "Všichni [Concept('guests','hosté')|E] budou mít možnost pokusit se kvalifikovat do [Concept('contest','soutěže')|E], pokud splňují podmínky účasti, a následně soutěžit na [CZActivity('activity_tournament','L')].\n\nHosté, kteří podmínky nesplňují, mohou navštěvovat [Concept('locales','stanoviště')|E], získávat jedinečné odměny a sledovat průběh jednotlivých soutěží."
 tournament_province_jousting_lists_desc: "#color_green + Jezdecká kolbiště#!"
 tournament_province_gathering_halls_desc: "#color_green + Shromažďovací síně#!"
 tournament_province_war_camps_desc: "#color_green + Válečné tábory#!"
 tournament_province_military_camps_desc: "#color_green + Vojenské tábory#!"
 tournament_province_archery_grounds_desc: "#color_green + Lukostřelnice#!"
 tournament_province_smithies_desc: "#color_green + Kovárna#!"
 tournament_province_royal_armories_desc: "#color_green + Královské zbrojnice#!"
 tournament_hall_of_heroes_desc: "#color_green + Síň hrdinů#!"
 tournament_barracks_desc: "#color_green + Kasárna#!"
 tournament_regimental_grounds_desc: "#color_green + Plukovní cvičiště#!"
 tournament_phase_melee: "Boj zblízka"
 tournament_phase_melee_desc: "Ukázková bitva mezi dvěma týmy, v níž bojovníci na koních i pěšky soupeří o ovládnutí bojiště a snaží se zajmout protivníky, za které by mohli požadovat výkupné.\n\n$tournament_contest_format_team$"
 tournament_phase_archery: "Lukostřelba"
 tournament_phase_archery_desc: "Lukostřelecká soutěž, v níž každý účastník vystřelí na terč stanovený počet šípů a snaží se získat co nejvíce bodů.\n\n$tournament_contest_formaty_turn$"
 tournament_phase_recital: "Recitál"
 tournament_phase_recital_desc: "Básnická soutěž, v níž každý účastník veřejně přednese báseň napsanou pro tuto příležitost. Jeho výkon se následně porovnává s výkony ostatních soutěžících.\n\n$tournament_contest_formaty_turn$"
 tournament_phase_joust: "Jízda s kopím"
 tournament_phase_joust_desc: "Jezdecké klání, v němž proti sobě soutěžící vyrážejí s dřevci a snaží se srazit protivníka z koně nebo získat více bodů než soupeř. Vítězem se stává poslední zbývající jezdec.\n\n$tournament_contest_format_versus$\nPočet [Concept('contest_rounds','kol soutěže')|e]: 3"
 tournament_phase_duel: "Souboj"
 tournament_phase_duel_desc: "Série ozbrojených soubojů pěších bojovníků, kteří se snaží odzbrojit protivníka nebo získat více bodů než soupeř. Vítězem se stává poslední zbývající bojovník.\n\n$tournament_contest_format_versus$\nPočet [Concept('contest_rounds','kol soutěže')|e]: 3"
 tournament_phase_wrestling: "Zápas"
 tournament_phase_wrestling_desc: "Soutěž síly a důvtipu, v níž se účastníci snaží povalit protivníka na zem nebo jej vytlačit ze zápasiště. Vítězem se stává poslední zbývající zápasník.\n\n$tournament_contest_format_versus$\nPočet [Concept('contest_rounds','kol soutěže')|e]: 3"
 tournament_phase_board_game: "Desková hra"
 tournament_phase_board_game_desc: "Soutěž důvtipu, v níž účastníci postupně poměřují své schopnosti v sérii deskových her. Celkovým vítězem se stává poslední zbývající hráč.\n\n$tournament_contest_format_versus$\nPočet [Concept('contest_rounds','kol soutěže')|e]: 3"
 tournament_phase_horse_race: "Dostihy"
 tournament_phase_horse_race_desc: "Divácká podívaná, v níž páni a dámy přihlašují své koně do vzájemných závodů. Vítězem se stává kůň, který jako první překročí cílovou čáru.\n\n$tournament_contest_format_race$"
 tournament_phase_ceremony: "Ceremonie"
 tournament_phase_ceremony_desc: "Slavnostní zakončení turnaje a závěrečné oslavy!"
 tournament_option_accommodations: "Ubytování"
 tournament_accommodations_bad: "Chatrné stany"
 tournament_accommodations_bad_desc: "$EFFECT_LIST_BULLET$ Některé negativní události nastávají častěji\n\n#weak Co je důležitější? Dovednosti, které předvádíš, nebo místo, kde je předvádíš?#!"
 tournament_accommodations_normal: "Jednoduché pavilony"
 tournament_accommodations_normal_desc: "$EFFECT_LIST_BULLET$ Pravděpodobnost jednotlivých událostí zůstává beze změny\n\n#weak Klíčem k dobrému souboji je především vydatný noční odpočinek.#!"
 tournament_accommodations_good: "Luxusní tábořiště"
 tournament_accommodations_good_desc: "$EFFECT_LIST_BULLET$ Některé negativní události nastávají #EMP méně#! často\n\n#weak Turnaje by měly být něčím víc než pouhými sportovními událostmi. Měly by představovat nezapomenutelný sportovní #underline zážitek#!.#!"
 tournament_option_prizes: "Ceny"
 tournament_prizes_bad: "Jednoduché ceny"
 tournament_prizes_bad_desc: "$EFFECT_LIST_BULLET$ [Concept('artifacts','Artefakty')|EU] udělované jako ceny budou mít běžnou [Concept('rarity','vzácnost')|E]\n\n#weak Jsme tu přece kvůli lásce ke sportu. Nabízené cetky jsou jen záminkou.#!"
 tournament_prizes_normal: "Slušné ceny"
 tournament_prizes_normal_desc: "$EFFECT_LIST_BULLET$ [Concept('artifacts','Artefakty')|EU] udělované jako ceny budou mít běžnou nebo mistrovskou [Concept('rarity','vzácnost')|E]\n\n#weak Ačkoli tu nejsme kvůli cenám, možnost zaplatit z výhry cestu domů je docela praktická.#!"
 tournament_prizes_good: "Kvalitní ceny"
 tournament_prizes_good_desc: "$EFFECT_LIST_BULLET$ [Concept('artifacts','Artefakty')|EU] udělované jako ceny budou mít mistrovskou nebo proslulou [Concept('rarity','vzácnost')|E]\n\n#weak Jaký smysl má soutěž, když není o co hrát?#!"
 tournament_prizes_very_good: "Hodnotné ceny"
 tournament_prizes_very_good_desc: "$EFFECT_LIST_BULLET$ [Concept('artifacts','Artefakty')|EU] udělované jako ceny budou mít mistrovskou, proslulou nebo slavnou [Concept('rarity','vzácnost')|E]\n\n#weak Cena není jen nějaká cetka, kterou vítěz dostane do rukou. Je to příslib slávy, který přitahuje ty nejstatečnější a nejodvážnější soutěžící.#!"
 tournament_prizes_splendid: "Skvostné ceny"
 tournament_prizes_splendid_desc: "$EFFECT_LIST_BULLET$ [Concept('artifacts','Artefakty')|EU] udělované jako ceny budou mít proslulou nebo slavnou [Concept('rarity','vzácnost')|E]\n\n#weak Ty nejlepší ceny jsou tak velkolepé, že svou nádherou zastíní i samotné vítěze.#!"
 win_contest_intent: "Triumf"
 win_contest_intent_desc: "Zvítěz ve všech soutěžích na [CZActivity('activity_tournament','L')], ať to stojí cokoli. Tento záměr často přináší vyšší odměny v podobě [Concept('progress_to_victory','postupu k vítězství')|E] a zpřístupňuje zvláštní možnosti a události."
 special_guest_champion: "Šampion"
 special_guest_champion_for_host: "$special_guest_champion$"
 special_guest_champion_desc: "Na [CZActivity('activity_tournament','L')] lze jmenovat zástupce s rolí „$special_guest_champion$“, který tě bude zastupovat, ať už se turnaje osobně účastníš, nebo ne. Největší užitek z něj zpravidla mají postavy, jejichž pohlaví podle místních zvyklostí není považováno za bojové. O všechny odměny, které šampion získá v [Concept('contest','soutěži')|E], se podělí s osobou, která jej jmenovala."
