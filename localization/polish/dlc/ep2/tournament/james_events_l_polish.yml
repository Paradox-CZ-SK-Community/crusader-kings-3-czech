l_polish:
 tournament_events.8000.t: "Znamení přízně"
 tournament_events.8000.desc.intro: "Když se chystám k nadcházejícímu klání, zahlédnu [favor_giver_1.GetName], jak na mě mává a nabízí mi [favor_giver_1.Custom('GetRandomFavor')|l] na znamení své přízně."
 tournament_events.8000.desc.mid.two: "\n\nNež stačím cokoli říct, přistoupí ke mně [favor_giver_2.GetName] a chce mi vnutit [favor_giver_2.Custom('GetRandomFavor')|l]. A co víc, naléhá, abych [Select_CString(ROOT.Char.IsFemale,'přijala','přijal')] raději [Select_CString(favor_giver_2.IsFemale,'její','jeho')] přízeň!"
 tournament_events.8000.desc.mid: "Upřímně mě těší, že jsem si [Select_CString(ROOT.Char.IsFemale,'získala','získal')] [Select_CString(favor_giver_1.IsFemale,'její','jeho')] podporu a náklonnost. Jenže přijmout takový dar by znamenalo víc než pouhé poděkování. Podle pravidel dvorské lásky bych tím [Select_CString(ROOT.Char.IsFemale,'dala','dal')] najevo, že také stojím o [favor_giver_1.Custom('CZ_Name_A')]."
 tournament_events.8000.desc.outro.homo: "\n\nJenže [Select_CString(favor_giver_1.IsFemale,'ona','on')] vůbec netuší, že [Select_CString(favor_giver_1.IsFemale,'ženy','muži')] mi zkrátka hlavu nemotají..."
 tournament_events.8000.desc.outro: "\n\n[Select_CString(favor_giver_1.IsFemale,'Její','Jeho')|U] zájem o mě se zdá být upřímný. A co může být rytířštějšího než vybojovat vítězství na počest [Select_CString(favor_giver_1.IsFemale,'urozené dámy','urozeného pána')]?"
 tournament_events.8000.a: "S radostí přijmu tvou přízeň, [favor_giver_1.Custom('CZ_TitledFirstNameNoTooltip_V')]."
 tournament_events.8000.b: "Takovou poctu nelze odmítnout, [favor_giver_2.Custom('CZ_TitledFirstNameNoTooltip_V')]!"
 tournament_events.8000.c: "Na dvoření není čas. Čeká mě klání."
 handkerchief: "kapesníček"
