l_polish:
 tournament_events.8000.t: "Pěkná laskavost"
 tournament_events.8000.desc.intro: "Když se připravuji na nadcházející zápas, zahlédnu [favor_giver_1.GetName], jak mi mává [favor_giver_1.Custom('GetRandomFavor')] a nabízí mi [favor_giver_1.GetHerHis] přízeň."
 tournament_events.8000.desc.mid.two: "\n\nNež stačím zareagovat, objeví se [favor_giver_2.GetName], podá mi [favor_giver_2.Custom('GetRandomFavor')] a trvá na tom, abych přijal/a [favor_giver_2.GetHerHis] přízeň místo toho!"
 tournament_events.8000.desc.mid: "Cítím se šťastný/á, že jsem získal/a [favor_giver_1.GetHerHis] podporu a náklonnost, a přijetí této přízně by naznačovalo můj zájem o [favor_giver_1.GetHerHim] v oblasti dvoření a rytířství."
 tournament_events.8000.desc.outro.homo: "\n\n[favor_giver_1.GetSheHe] netuší, že [favor_giver_1.GetWomenMen] mě sotva zaujmou..."
 tournament_events.8000.desc.outro: "\n\n[favor_giver_1.GetHerHis|U] zájem o mě se zdá upřímný, a nic nemůže být galantnější než vyhrát zápas pro vznešeného [favor_giver_1.GetLadyLord]."
 tournament_events.8000.a: "Vezmu si to, [favor_giver_1.GetTitledFirstNameNoTooltip]."
 tournament_events.8000.b: "[favor_giver_2.GetTitledFirstNameNoTooltip], jak štědré!"
 tournament_events.8000.c: "Musím se soustředit na zápas."
