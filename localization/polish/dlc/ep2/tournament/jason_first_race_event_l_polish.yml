l_polish:
 jason_first_race_event.1.t: "Změť kopyt"
 jason_first_race_event.1.desc: "V plném cvalu jezdec [opponent.Custom('CZ_TitledFirstName_G')] strhne svého koně #EMP [opponent.Custom('GetContestHorseRaceName')]#! přímo do mého koně, na kterém sedí [jockey.GetFirstName] – nebo snad do nich naopak vjel můj kůň #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!? Ať už je pravda jakákoli, celá ta nešťastná změť těl se bokem řítí do zábran.\n\nJeště před okamžikem se po dráze hnalo celé stádo zpocených koní. Teď se dva z nich odrážejí stranou od ostatních a jejich jezdci se zoufale snaží znovu získat kontrolu.\n\nZbytek závodního pole uhání dál, zatímco oba potácející se koně zaostávají o celou koňskou délku."
 jason_first_race_event.1.desc.suspicious: "Z hloučku svých družiníků [opponent.GetTitledFirstNameNoTooltip] vykřikne v předstíraném „šoku“... Ani trochu přesvědčivě."
 jason_first_race_event.1.desc.sympathetic: "Z hloučku svých družiníků se ozve zděšený výkřik [opponent.Custom('CZ_TitledFirstName_G')]."
 jason_first_race_event.1.a: "Podraz! Někdo mě podvedl!"
 jason_first_race_event.1.a.tt: "Takový zákeřný útok je důvodem k diskvalifikaci!"
 jason_first_race_event.1.a.tt.win: "Kůň [opponent.Custom('CZ_FirstNameNoTooltip_G')] je kvůli údajné „nečisté hře“ vyřazen ze závodu"
 jason_first_race_event.1.a.tt.lose: "Působíš jen malicherně... nikdo tě neposlouchá"
 jason_first_race_event.1.b: "Jen [opponent.GetFirstNameNoTooltip] ví, jak mi teď je."
 jason_first_race_event.1.b.tt: "Vyjádříš upřímnou soustrast se smůlou svého soupeře."
 jason_first_race_event.1.c: "„Povol otěže, [jockey.Custom('CZ_FirstNameNoTooltip_V')]!“"
 jason_first_race_event.1.c.tt: "Zavoláš na [Select_CString(jockey.IsFemale,'svou jezdkyni','svého jezdce')], abys [Select_CString(jockey.IsFemale,'ji','ho')] [Select_CString(GetPlayer.IsFemale,'povzbudila','povzbudil')] k pokračování v závodě!"
 jason_first_race_event.1.c.tt.win: "[jockey.GetFirstNameNoTooltip|U] znovu získá kontrolu nad svým koněm"
 jason_first_race_event.1.c.tt.lose: "[jockey.GetFirstNameNoTooltip|U] tě neslyší"
 jason_first_race_event.1.d: "Sbohem, vítězství?"
 jason_first_race_event.1.d.tt: "Jen doufám, že je [jockey.GetFirstNameNoTooltip] v pořádku..."
 contest_horse_race_collision_log_title: "Srážka dostihových koní"
 contest_horse_race_collision_log: "Během dostihu se srazili koně dvou účastníků: [CHARACTER.GetShortUIName] a [TARGET_CHARACTER.GetShortUIName]"
