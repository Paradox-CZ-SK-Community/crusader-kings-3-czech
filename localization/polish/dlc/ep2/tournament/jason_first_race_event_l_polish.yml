l_polish:
 jason_first_race_event.1.t: "Změtí nohou"
 jason_first_race_event.1.desc: "Při plném trysku [opponent.GetTitledFirstNamePossessive] jezdec vrazil #EMP [opponent.Custom('GetContestHorseRaceName')]#! do mého koně a jeho jezdce [jockey.GetFirstName] — nebo snad to byl #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!, kdo do nich zabočil? Každopádně se celá ta nešťastná hromada srazila bokem do bariér.\n\nKde dříve stála celá smečka honičských koní, třpytících se potem, nyní dva vyletí z masy ven, jejich jezdci zápasí, aby je ubrzdili.\n\nDružina závodníků uhání dál, ti dva kolébající se koně jsou nyní o délku pozadu."
 jason_first_race_event.1.desc.suspicious: "Z řad [Select_CString(opponent.IsFemale,'její','jeho')] družiny [opponent.GetTitledFirstNameNoTooltip] vykřikne v „šoku“... nepřesvědčivě."
 jason_first_race_event.1.desc.sympathetic: "Z řad [Select_CString(opponent.IsFemale,'její','jeho')] družiny [opponent.GetTitledFirstNameNoTooltip] vykřikne v hrůze."
 jason_first_race_event.1.a: "Podfuk! Podvedli mě!"
 jason_first_race_event.1.a.tt: "Tento podfuk stačí k jejich diskvalifikaci!"
 jason_first_race_event.1.a.tt.win: "[opponent.GetFirstNamePossessiveNoTooltip] „podvod“ způsobí, že jejich kůň je vyřazen ze závodu"
 jason_first_race_event.1.a.tt.lose: "Zníš zjevně malicherně... nikdo ti nevěnuje pozornost"
 jason_first_race_event.1.b: "[opponent.GetFirstNameNoTooltip] sám sdílí tuto chvíli neštěstí."
 jason_first_race_event.1.b.tt: "Vyjádříte upřímné soustrast svému nešťastnému soupeři."
 jason_first_race_event.1.c: "„Povol otěže, [jockey.GetFirstNameNoTooltip]!“„"
 jason_first_race_event.1.c.tt: "Zavolejte na svého jezdce, aby pokračoval dál!"
 jason_first_race_event.1.c.tt.win: "[jockey.GetFirstNameNoTooltip] uklidní [Select_CString(jockey.IsFemale,'její','jeho')] koně"
 jason_first_race_event.1.c.tt.lose: "[jockey.GetFirstNameNoTooltip] tě neslyší"
 jason_first_race_event.1.d: "Sbohem, vítězství?"
 jason_first_race_event.1.d.tt: "Jen doufám, že [jockey.GetFirstNameNoTooltip] je v pořádku..."
 contest_horse_race_collision_log_title: "Srážka závodníků"
 contest_horse_race_collision_log: "Vstupy do závodu [CHARACTER.GetShortUINamePossessive|U] a [TARGET_CHARACTER.GetShortUINamePossessive] se do sebe zakroutily"
