l_polish:
 jason_locale_events.100.t: "[Select_CString(unreliable_knight.IsFemale,'Ta, která','Ten, kdo')|U] se vyhýbá boji"
 jason_locale_events.100.desc: "Poslední dobou se můj $knight_culture_player_no_tooltip_lowercase$ [unreliable_knight.GetTitledFirstName] podezřele často vytrácí. Neuniklo mi ani to, kolik služebníků už bylo odehnáno ode dveří [Select_CString(unreliable_knight.IsFemale,'jejího','jeho')] příbytku. Když mě nakonec [Select_CString(unreliable_knight.IsFemale,'sama požádá','sám požádá')] o návštěvu, vstoupím dovnitř.\n\n"
 jason_locale_events.100.desc.mess: "Podlahu pokrývají skvrny od rozlitého pití. Všude se povalují okousané zbytky jídel, všelijaké podivné tretky a převrácený nábytek.\n\n"
 jason_locale_events.100.desc.self_harm: "V ponurém přítmí leží na podlaze roztrhané šaty, rozbité předměty, "
 jason_locale_events.100.desc.smug: "[unreliable_knight.GetTitledFirstNameNoTooltip|U] mě uvítá sotva znatelnou úklonou. V rukou si přitom stále dokola obrací svůj dokonale vyleštěný meč.\n\n"
 jason_locale_events.100.desc.insanity: "peří, výkaly a krev.\n\nU nohou [unreliable_knight.Custom('CZ_TitledFirstNameNoTooltip_G')] leží useknutá lidská ruka. Komu patřila? To netuším. Přede mnou se však divoce mává oběma rukama a z úst se řine zmatený příval slov:\n\n„Další ruce! Objeví se další ruce! Vy jste přece [ROOT.Char.GetTitleTierName|l], to musíte vidět! Pokaždé, když se účastním soutěží, objeví se další zakrvácené ruce!“"
 jason_locale_events.100.desc.drunk: "[unreliable_knight.GetFirstNameNoTooltip|U], $knight_culture_player_no_tooltip_lowercase$ v mých službách, je [Select_CString(unreliable_knight.IsFemale,'opilá','opilý')] pod obraz. Přesto do sebe dál lije víno a při každém doušku se bolestně zašklebí, jako by se za sebe hluboce [Select_CString(unreliable_knight.IsFemale,'styděla','styděl')]. Tímhle tempem z [Select_CString(unreliable_knight.IsFemale,'ní','něj')] do rána zbude jen ubohá troska.\n\n„To musím, musím... #EMP *škyt*#! ...jezdit, bojovat nebo co se to vlastně po mně chce?“"
 jason_locale_events.100.desc.hash: "[unreliable_knight.GetFirstNameNoTooltip|U], $knight_culture_player_no_tooltip_lowercase$ v mých službách, je zcela [Select_CString(unreliable_knight.IsFemale,'omámená','omámený')]. Z dechu táhne hašiš, kůže se leskne potem a [unreliable_knight.Custom('EyeEyes')|l] má přimhouřené. Mezi přihlouplým chichotáním a slinami stékajícími po bradě ze sebe nakonec vysouká otázku:\n\n„Ehm... [Select_CString(unreliable_knight.IsFemale,'neměla','neměl')] bych náhodou... někdy brzy něco dělat?“"
 jason_locale_events.100.desc.depressed: "krev [unreliable_knight.Custom('CZ_TitledFirstNameNoTooltip_G')].\n\nPo tvářích [unreliable_knight.Custom('CZ_TitledFirstNameNoTooltip_G')] stékají slzy, které se mísí s krví a rudnou.\n\n„Já tam nemůžu,“ vzlyká můj $knight_culture_player_no_tooltip_lowercase$. „Nedokážu jim čelit. Už zase ne... Ne teď! Prosím, vždyť jste [ROOT.Char.GetTitleTierName|l], #EMP prosím#!... ušetřete mě toho turnajového zápolení!“"
 jason_locale_events.100.desc.demand: "„Celý svět přece ví, že jsem [Select_CString(unreliable_knight.IsFemale,'znamenitá bojovnice, hodná těch nejvyšších poct','znamenitý bojovník, hodný těch nejvyšších poct')] a sloužím jako $knight_culture_player_no_tooltip_lowercase$!“ zavrčí [unreliable_knight.GetTitledFirstNameNoTooltip]. „A dokud mi [Select_CString(ROOT.Char.IsFemale,'má lenní paní','můj lenní pán')] nezajistí urozený doprovod a štědré dary, musím účast v soutěžích #EMP odmítnout#!.“\n\n„Kdybych [Select_CString(unreliable_knight.IsFemale,'měla','měl')] nastoupit v takové bídě, [Select_CString(unreliable_knight.IsFemale,'zostudila','zostudil')] bych sebe i vás!“"
 jason_locale_events.100.a: "Zapomínáš snad, komu jsi [Select_CString(unreliable_knight.IsFemale,'zavázána','zavázán')] službou?"
 jason_locale_events.100.a.tt: "Možná tento $knight_culture_player_no_tooltip_lowercase$ nepodá nejlepší výkon, ale tvé autoritě se #EMP podřídí#!."
 jason_locale_events.100.b: "Jen soutěž! Dostaneš, oč si řekneš!"
 jason_locale_events.100.b.tt: "Přísahám, že o své nejlepší $knight_culture_player_plural_no_tooltip_lowercase$ se postarám, jak se sluší a patří!"
 jason_locale_events.100.c.mad: "Tvá přísaha už neplatí, [Select_CString(unreliable_knight.IsFemale,'šílenkyně','šílenče')]! Táhni!"
 jason_locale_events.100.c.drunk: "Svou přísahu jsi [Select_CString(unreliable_knight.IsFemale,'propila','propil')]! Kliď se mi z očí!"
 jason_locale_events.100.c.hash: "Tvá přísaha je zrušena! Pryč s tebou, ty hloupá hlavo!"
 jason_locale_events.100.c.depressed: "Za svého $knight_culture_player_no_tooltip_lowercase$ tě už nepovažuji."
 jason_locale_events.100.c.demanding: "Dost bylo tvého chvástání! Tvá přísaha neplatí! Zmiz!"
 jason_locale_events.100.c.tt: "Propustíš tohoto nehodného $knight_culture_player_no_tooltip_lowercase$ ze svých služeb!"
 jason_locale_events.100.c.forbid_knight: "[unreliable_knight.GetShortUIName|U] [Select_CString(unreliable_knight.IsLocalPlayer,'už nesmíš','už nesmí')] nadále sloužit jako tvůj $knight_culture_player_no_tooltip_lowercase$"
 jason_locale_events.100.d: "Možná by sis [Select_CString(unreliable_knight.IsFemale,'měla','měl')] raději... odpočinout."
 jason_locale_events.100.d.not_competing: "[unreliable_knight.GetShortUIName|U] se [Select_CString(unreliable_knight.IsLocalPlayer,'nebudeš','nebude')] účastnit soutěží ani pomáhat v týmových kláních"
 knight_not_participating_log_title: "Odstoupení družiníka"
 knight_not_participating_log: "Z turnaje [Select_CString(TARGET_CHARACTER.IsFemale,'odstoupila','odstoupil')] [TARGET_CHARACTER.GetTitledFirstName], [Select_CString(TARGET_CHARACTER.IsFemale,'bojovnice','bojovník')] [CHARACTER.Custom('CZ_TitledFirstName_G')]. O důvodech se šíří nejrůznější zvěsti."
 knight_dismissed_log_title: "Propuštění družiníka"
 knight_dismissed_log: "Po záhadném incidentu [CHARACTER.GetTitledFirstName|U] [Select_CString(CHARACTER.IsFemale,'propustila','propustil')] ze svých služeb [Select_CString(TARGET_CHARACTER.IsFemale,'proslulou soutěžící','proslulého soutěžícího')] [TARGET_CHARACTER.Custom('CZ_TitledFirstName_A')]."
 jason_locale_events.210.t.camel_cavalry: "Vládci pouště"
 jason_locale_events.210.t.elephant_cavalry: "Zrození mahútů"
 jason_locale_events.210.t.horse_archer: "Výstřel na rozloučenou"
 jason_locale_events.210.t.heavy_cavalry: "Jako hrom"
 jason_locale_events.210.t.crossbowmen: "Zkřížený luk"
 jason_locale_events.210.t.heavy_infantry: "Ani o píď"
 jason_locale_events.210.desc: "$knight_culture_player_plural_no_tooltip$ předvádějí své válečnické umění, jejich přátelští soupeři se naparují a tlumočníci se při překládání sotva ubrání smíchu.\n\n„Vy [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l] máte nepochybně své přednosti,“ uznává [foreign_lord.GetName]. "
 jason_locale_events.210.desc.teen: "$knight_culture_player_plural_no_tooltip$ předvádějí své válečnické umění, jejich přátelští soupeři se naparují a tlumočníci se při překládání sotva ubrání smíchu.\n\n„Vy [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l]... no, nejste zase tak špatní,“ zakňourá [foreign_lord.GetName]. "
 jason_locale_events.210.desc.camel_cavalry: "„Jenže zkrotit velblouda? Na to nikdo z vás nemá dost odvahy! A ty vaše prasečí zadky by v našich sedlech stejně dlouho nevydržely!“\n\nOpodál podkoní pevně svírají otěže velbloudů. [foreign_lord.GetTitleTierName|U] to očividně myslí vážně. Ačkoli [foreign_lord.GetCulture.GetCollectiveNounNoTooltip|l] na hřbetech těchto zvířat vládnou pouštím a vyprahlým krajům a už pouhou svou přítomností děsí koně... Ten velbloudí zápach je vskutku odporný."
 jason_locale_events.210.desc.elephant_cavalry: "„Ale najde se mezi vámi jediný [ROOT.Char.GetCulture.Custom('CZ_AdjectiveNoTooltip_yy')|l] válečník, který by se odvážil vyrazit do bitvy na sloním hřbetě? Který by dokázal zacházet s kopím a lukem, zatímco mu pod nohama zuřivě troubí ten obrovský chobot?“\n\nNedaleko se lesknou pozlacené sloní kly. Vysoko na zvířecím hřbetě se pohupuje bojová věž a její dřevěná konstrukce při každém pohybu skřípe. [foreign_lord.GetTitleTierName|U] přede mě staví výzvu stejně ohromnou a nevyzpytatelnou jako samotné zvíře."
 jason_locale_events.210.desc.horse_archer: "„Ale dokáže se někdo z vás v plném cvalu otočit v sedle a vystřelit šíp přes ocas vlastního koně? Dokážete vypustit tětivu přesně mezi dvěma údery kopyt? Tohle zvládne i nejmladší dítě [foreign_lord.GetCulture.Custom('CZ_AdjectiveNoTooltip_eeho')|l] původu!“\n\nPozoruji své [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l], jak napínají tětivy rohovinových luků a poplácávají stepní koníky. Sami jsme znamenití jezdci... ale můžeme se opravdu měřit s lidem, který se snad už rodí v sedle?"
 jason_locale_events.210.desc.heavy_cavalry: "„Ale kdo z vás se někdy vrhl přímo do nepřátelských řad, aniž by dbal na hroty jejich zbraní? Kdo z vás pocítil, jak pod kopyty válečného oře padají nepřátelé a kopí proráží jejich obranu? Vyzkoušejte mého koně! Uvidíme, zda dokážete shodit ze sedla alespoň toho nejhoršího [foreign_lord.GetCulture.Custom('CZ_AdjectiveNoTooltip_eeho')|l] jezdce!“\n\nMůj lid nepoužívá výstroj potřebnou k útoku s těžkým kopím. Takový způsob boje nám není vlastní. Jenže mám si snad nechat takové chvástání líbit...?"
 jason_locale_events.210.desc.crossbowmen: "„Ale viděli jste vůbec někdy #EMP něco takového#!? Dokázali byste to natáhnout a zamířit?“\n\n[foreign_lord.GetTitleTierName|U] mi podává zbraň, kterou jsem už vlastně kdysi [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')]... ovšem jen zdálky. Mohutný luk je připevněn napříč k pažbě s drážkou pro šipku. [foreign_lord.GetCulture.GetCollectiveNounNoTooltip|U] s touto podivuhodnou zbraní dokážou prorazit zbroj. Jakoukoli zbroj."
 jason_locale_events.210.desc.heavy_infantry: "„Vy se umíte mrštně prohánět sem a tam! Ale dokázali byste pevně stát proti jedinému z mých válečníků, obtěžkanému naší těžkou výzbrojí? Ustát jeho nápor, dokud se o vás sám neroztříští?“\n\nMoji [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] se s námahou soukají do mohutné [foreign_lord.GetCulture.Custom('CZ_AdjectiveNoTooltip_ee')|l] zbroje a pozvedají [foreign_lord.GetCulture.Custom('CZ_AdjectiveNoTooltip_ee')|l] zbraně. Nad jejich tíhou jen nevěřícně kroutí hlavami. Vydržet souboj v takovém nezvyklém odění, zpocený od hlavy až k patě... To by chtělo pořádnou dávku houževnatosti."
 jason_locale_events.210.a: "Tak to zkusím!"
 jason_locale_events.210.b: "[root_culture_knight.GetTitledFirstNameNoTooltip|U] je živoucím ztělesněním [ROOT.Char.GetCulture.Custom('CZ_AdjectiveNoTooltip_eeho')|l] válečnického umění."
 jason_locale_events.210.b.same_heritage: "[root_culture_knight.GetTitledFirstName|U] je živým důkazem toho, jaké válečnické umění přináší [ROOT.Char.GetCulture.GetHeritage.GetNameNoTooltip|l] dědictví."
 jason_locale_events.210.a.win: "[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|U] na tebe mohou být právem hrdí"
 jason_locale_events.210.a.lose: "Tvá neobratnost a choulostivost vyvolávají salvy posměchu"
 jason_locale_events.210.b.tt: "[Select_CString(root_culture_knight.IsFemale,'Ona','On')|U] se nezalekne žádné výzvy, byť by byla sebevíc nezvyklá!"
 jason_locale_events.210.b.win: "[root_culture_knight.GetFirstNameNoTooltip|U] se svým uměním vyrovná [foreign_lord.GetCulture.Custom('CZ_AdjectiveNoTooltip_yym')|l] mistrům"
 jason_locale_events.210.b.lose: "Pokusy [root_culture_knight.Custom('CZ_FirstNameNoTooltip_G')] jsou... poněkud žalostné"
 jason_locale_events.210.c: "Nemohl by nás něco naučit některý z vašich bojovníků? Třeba [foreign_lord.Custom('KnightCultureNoTooltip')|l]?"
 jason_locale_events.210.c.tt: "Zkušenosti cizích bojovníků by mohly prospět mým [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] i ozbrojencům."
 jason_locale_events.210.d.camel_cavalry: "My [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l] žádné takové nemotorné bestie nepotřebujeme!"
 jason_locale_events.210.d.tt.camel_cavalry: "Přísahám, že vy [foreign_lord.GetCulture.GetCollectiveNounNoTooltip|l] byste raději vychutnávali velbloudí sliny, než se postavili našim statečným vojákům!"
 jason_locale_events.210.d.elephant_cavalry: "My [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l] nepotřebujeme stát výš než ostatní!"
 jason_locale_events.210.d.tt.elephant_cavalry: "Ti [foreign_lord.GetCulture.GetCollectiveNounNoTooltip|l] mohou být každou chvíli rozdupáni vlastními obřími bestiemi! #EMP Zato my máme slávu na dosah!#!"
 jason_locale_events.210.d.horse_archer: "My [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l] se nepřátelům stavíme čelem!"
 jason_locale_events.210.d.tt.horse_archer: "Ať si ti nečestní [foreign_lord.GetCulture.GetCollectiveNounNoTooltip|l] krouží na koních, jak se jim zlíbí! Jejich manželky a manželé musí na ty oře ukrutně žárlit..."
 jason_locale_events.210.d.heavy_cavalry: "My [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l] umíme udeřit dost tvrdě i bez toho!"
 jason_locale_events.210.d.tt.heavy_cavalry: "Nepotřebujeme do sebe bezhlavě narážet jako nějaká tupá zvířata!"
 jason_locale_events.210.d.crossbowmen: "My [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l] žádné takové mašinky nepotřebujeme!"
 jason_locale_events.210.d.tt.crossbowmen: "[foreign_lord.GetCulture.GetCollectiveNounNoTooltip|U] jako zbabělci zabíjejí ty nejušlechtilejší válečníky z bezpečné dálky. My se k takové podlosti nikdy nesnížíme!"
 jason_locale_events.210.d.heavy_infantry: "My [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l] se dokážeme ubránit i bez té hromady železa!"
 jason_locale_events.210.d.tt.heavy_infantry: "Nač nám zbroj, když máme své umění? [foreign_lord.GetCulture.GetCollectiveNounNoTooltip|U] jsou těžkopádní jako balvany. A právě tak je také pošleme pod zem!"
 cultural_acceptance_knightly_camaraderie: "Výměna válečnických zkušeností"
 cultural_acceptance_knightly_rivalry: "Nevraživost mezi turnajovými bojovníky"
 tournament_open_minded_warrior_modifier: "Válečník otevřený novým způsobům"
 tournament_open_minded_warrior_modifier_desc: "Tato postava projevuje živý zájem o válečnické umění a bojové zvyklosti jiných národů."
 tournament_knight_humiliated_modifier: "Ponížený šampion"
 tournament_knight_humiliated_modifier_desc: "Cizí vyzyvatelé zostudili proslulého rytíře této postavy. Její bojovníci jsou nyní terčem posměchu."
 tournament_loyalty_martial_traditions_modifier: "Věrnost válečnickým tradicím"
 tournament_loyalty_martial_traditions_modifier_desc: "Tato postava vášnivě hájí nadřazenost válečnických tradic svého lidu."
 jason_locale_events.200.t: "Věrnost mezi říhnutími"
 jason_locale_events.200.desc: "„Každičký doušek mé cti,“ blábolí [drunk_knight.GetFullName] a přitom se polévá vínem, „patří vám!“\n\nSloužící se [Select_CString(drunk_knight.IsFemale,'ji','ho')] marně snaží zadržet, zatímco přátelé přispěchají s nejrůznějšími omluvami. [drunk_knight.GetFirstNameNoTooltip|U], $knight_culture_player_no_tooltip_lowercase$ v podroušeném stavu, je však všechny odstrčí.\n\n„Ruce pryč! K čertu s vámi se všemi! [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], vysvoboďte mě od [Select_CString(drunk_knight_liege.IsFemale,'té mé mizerné paní','toho mého mizerného pána')]! Nabízím vám svou věrnost! Přijmete mě?“\n\nSmích mi uvázne v hrdle. [drunk_knight.GetFirstNameNoTooltip|U] má totiž jako $knight_culture_player_no_tooltip_lowercase$ skutečně slavné jméno a vysoké pocty [Select_CString(drunk_knight_liege.IsFemale,'od své lenní paní','od svého lenního pána')], [drunk_knight_liege.Custom('CZ_TitledFirstName_G')]."
 jason_locale_events.200.desc.caution: "Takové vínem podnícené bláznovství... Mohlo by mi vynést znamenitého bojovníka, ale také pomstychtivého nepřítele."
 jason_locale_events.200.desc.party: "Jistě, [drunk_knight_liege.GetTitleTierName|l] ztrátu takového bojovníka jen tak nepřekousne... Ale něco mi říká, že se schyluje k #EMP historické#! pijatyce!"
 jason_locale_events.200.a: "Tak se předveď, $knight_culture_player_no_tooltip_lowercase$! #EMP Pij!#!"
 jason_locale_events.200.a.tt: "Pod obraz [Select_CString(drunk_knight.IsFemale,'opilá','opilý')] [drunk_knight.GetFirstNameNoTooltip] se pokusí prokázat znamenitost [Select_CString(drunk_knight_liege.IsFemale,'své dosavadní lenní paní','svého dosavadního lenního pána')]... Jakým způsobem? To ví snad jen víno."
 jason_locale_events.200.a.tt.join: "[drunk_knight.GetFirstNameNoTooltip|U] se stane tvým $knight_culture_player_no_tooltip_lowercase$, k velké nelibosti [drunk_knight_liege.Custom('CZ_ShortUIName_G')]"
 jason_locale_events.200.a.tt.recruit: "„Volá vás [ROOT.Char.GetTitleTierName|l], $knight_culture_player_plural_no_tooltip_lowercase$! Vyslyšíte to volání?“"
 jason_locale_events.200.a.tt.recruit_desc: "Další opilí $knight_culture_player_plural_no_tooltip_lowercase$ ti přísahají věrnost"
 jason_locale_events.200.a.tt.join_three: "[drunk_knight.GetShortUIName|U] se stane tvým $knight_culture_player_no_tooltip_lowercase$"
 jason_locale_events.200.a.tt.recruit_lieges: "Lenní páni tvých nových dvořanů zuří, obzvláště [drunk_knight_liege.GetShortUIName]"
 jason_locale_events.200.a.tt.recruit_specific: "[extra_knight.GetFirstNameNoTooltip|U] a [extra_knight_2.GetFirstNameNoTooltip] ti přísahají věrnost"
 jason_locale_events.200.a.tt.song: "„Slyšte všichni! Zapěji vám o slavných činech [ROOT.Char.Custom('CZ_TitledFirstNameNoTooltip_G')]!“"
 jason_locale_events.200.a.tt.song_specific: "[drunk_knight.Custom('CZ_FirstNamePossessiveNoTooltip_M')|U] nadšený, byť poněkud falešný zpěv ohlašuje přísahu věrnosti, kterou ti skládá"
 jason_locale_events.200.a.tt.beatings: "„Chcete vidět, jak umím bojovat? Tak se dívejte!“"
 jason_locale_events.200.a.tt.beatings_specific: "[drunk_knight.GetFirstNameNoTooltip|U] prokáže své schopnosti tím, že surově zmlátí několik protivníků"
 jason_locale_events.200.a.tt.marry: "„Teprve sňatek zpečetí naše pouto!“"
 jason_locale_events.200.a.tt.marry_desc: "Někdo z tvého [Concept('house','rodu')|E] nebo [Concept('close_family','blízké rodiny')|E] uzavře sňatek s [drunk_knight.Custom('CZ_UIName_I')]"
 jason_locale_events.200.a.tt.marry_specific: "[ROOT.Char.Custom2('RelationToMeShort', surprise_spouse)|U] [surprise_spouse.GetFirstNameNoTooltip] uzavře sňatek s [drunk_knight.Custom('CZ_FirstNameNoTooltip_I')]"
 jason_locale_events.200.a.tt.death: "„S vámi budu pít číši za číší, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|l]! Až do poslední kapky!“"
 jason_locale_events.200.a.tt.death_specific: "[drunk_knight.Custom('CZ_FirstNamePossessiveNoTooltip_M')|U] pověstný pijácký talent [Select_CString(drunk_knight.IsFemale,'ji','ho')] nakonec zradí"
 jason_locale_events.200.b: "Kéž tvá věrnost nikdy nezakolísá... jako ty právě teď!"
 jason_locale_events.200.b.tt: "Necháš slavnostně složit přísahu věrnosti, kterou už ráno nebude možné vzít zpět."
 jason_locale_events.200.c: "Uhni mi z cesty, [Select_CString(drunk_knight.IsFemale,'hlupačko','hlupáku')]. [Select_CString(drunk_knight_liege.IsFemale,'Tvá lenní paní','Tvůj lenní pán')|U] se to dozví."
 jason_locale_events.200.c.tt: "Co mi tak ten opilý zrádce asi udělá? Pozvrací mě? V tomhle stavu sotva dokáže stát na nohou, natož bojovat."
 jason_locale_events.200.c.unchallenged: "$knight_culture_player_no_tooltip_lowercase$ ustoupí"
 jason_locale_events.200.c.attacked: "[drunk_knight.GetFirstNameNoTooltip|U] ti #bold vrazí facku#!"
 jason_locale_events.200.c.duel.tt: "Tasíte zbraně!"
 jason_locale_events.200.c.slap.tt: "Tvé stráže zasáhnou, ale příliš pozdě!"
 jason_locale_events.200.c.won_brawl.tt: "Díky střízlivější hlavě zvítězíš!"
 jason_locale_events.200.c.lost_brawl.tt: "Potupně tě přemůže opilec"
 jason_locale_events.200.d: "Tiše. Vzpomeň si na svou čest, [drunk_knight.Custom('CZ_FirstNameNoTooltip_V')]."
 jason_locale_events.200.d.tt: "Přísahy věrnosti složené s rozvahou mají větší váhu než opilecké řeči."
 tournament_wound_non_root_combatants_effect: "Někteří bojovníci jiných pánů utrpí zranění"
 poached_drunk_knight_log_title: "Změna věrnosti"
 poached_drunk_knight_log: "[CHARACTER.GetTitledFirstName|U] [Select_CString(CHARACTER.IsFemale,'využila','využil')] opileckých přísah [TARGET_CHARACTER.Custom('CZ_TitledFirstName_G')] a [Select_CString(CHARACTER.IsFemale,'přetáhla','přetáhl')] [Select_CString(TARGET_CHARACTER.IsFemale,'ji','ho')] do svých služeb od [Select_CString(TARGET_CHARACTER.IsFemale,'jejího','jeho')] dosavadního lenního pána"
 drunk_knight_dies_log_title: "Osudná pijatyka"
 drunk_knight_dies_log: "[TARGET_CHARACTER.GetTitledFirstName|U] se během divoké pijatyky s [CHARACTER.Custom('CZ_TitledFirstName_I')] [Select_CString(TARGET_CHARACTER.IsFemale,'upila','upil')] k smrti"
 drunk_knight_marries_log_title: "Sliby jedné noci"
 drunk_knight_marries_log: "Po bujaré pijatyce si [TARGET_CHARACTER.GetTitledFirstName] [Select_CString(TARGET_CHARACTER.IsFemale,'odnesla','odnesl')] nejen [Select_CString(CHARACTER.IsFemale,'novou lenní paní','nového lenního pána')], ale také sňatek do rodiny [CHARACTER.Custom('CZ_TitledFirstName_G')]"
 drunk_knight_beats_log_title: "Postrach krčmy"
 drunk_knight_beats_log: "[TARGET_CHARACTER.GetTitledFirstName|U] v opilosti surově [Select_CString(TARGET_CHARACTER.IsFemale,'zbila','zbil')] několik proslulých bojovníků, aby si [Select_CString(TARGET_CHARACTER.IsFemale,'vydobyla','vydobyl')] místo mezi $knight_culture_player_plural_no_tooltip_lowercase$ [CHARACTER.Custom('CZ_TitledFirstName_G')]"
 drunk_oaths_log_title: "Nábor rudolících"
 drunk_oaths_log: "[CHARACTER.GetTitledFirstName|U] [Select_CString(CHARACTER.IsFemale,'přiměla','přiměl')] skupinu opilých $knight_culture_player_plural_no_tooltip_lowercase$, mezi nimiž [Select_CString(TARGET_CHARACTER.IsFemale,'vynikala','vynikal')] [TARGET_CHARACTER.GetTitledFirstName], aby opustili své lenní pány a přísahali [Select_CString(CHARACTER.IsFemale,'jí','mu')] věrnost"
 jason_locale_events.0220.t: "Kde se rodí vítězství"
 jason_locale_events.0220.desc: "Moji $knight_culture_player_plural_no_tooltip_lowercase$ se shromáždili k dnešnímu výcviku. Jejich sluhové se pod tíhou výstroje sotva drží na nohou. Před nastoupenými bojovníky stojím já a [senior_knight.GetTitledFirstName].\n\n„$knight_culture_player_plural_no_tooltip$! Co nevíte, na to se bez ostychu ptejte. Kdo se chce něčemu naučit, nesmí se stydět požádat o radu,“ nabádá je [senior_knight.GetFirstNameNoTooltip]. „Společně hájíme čest [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')]! Připravme se tak, aby se o našich činech ještě dlouho vyprávělo!“\n\nPoté se ke mně otočí. [senior_knight.Custom('EyeEyes')|U] [Select_CString(senior_knight.IsFemale,'jí září','mu září')] nedočkavostí.\n\n„Jen rozkaž.“"
 jason_locale_events.0220.a: "Pozorujte soupeře. Naučte se využít každé jejich slabiny."
 jason_locale_events.0220.a.tt: "Tví $knight_culture_player_plural_no_tooltip_lowercase$ přijeli vítězit v soutěžích. Na ničem jiném nezáleží."
 jason_locale_events.0220.b: "Dovednosti? Pche! Hlavně ať nás všichni vidí."
 jason_locale_events.0220.c: "Do sedel! Meče tasit!"
 jason_locale_events.0220.c.tt: "Procvičíme sílu i postřeh, v sedle i při boji pěšky."
 jason_locale_events.0220.d: "$knight_culture_player_plural_no_tooltip$! Ukažte, jak bystrý máte zrak i úsudek!"
 jason_locale_events.0220.d.tt: "Cvičit mysl a smysly je stejně důležité jako prolévat pot na cvičišti."
 jason_locale_events.0220.e: "Poraz je všechny, [senior_knight.Custom('CZ_FirstNameNoTooltip_V')]. #EMP Hned teď!#!"
 jason_locale_events.0220.e.tt: "Ať mají všichni na co zírat! #EMP Braň se!#!"
