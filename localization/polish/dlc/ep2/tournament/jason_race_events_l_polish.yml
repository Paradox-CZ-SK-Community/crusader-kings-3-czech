l_polish:
 jason_race_events.1.t: "Vůle davu"
 jason_race_events.1.desc: "Z nekonečného moře diváků sledujících dostih se ozývá křik prostých lidí. Potulní válečníci pokřikují urážky a oplzlé narážky. My šlechtici se mezi nimi nervózně pochechtáváme a po očku hledíme na své stráže."
 jason_race_events.1.desc.guest_local_anger: "\n\n„[host.GetTitledFirstName|U]!“ řve dav spolu s urážkami jako „#EMP [host.Custom('GetCrime')|U]!#!“ Nejhlasitěji běsní místní obyvatelé. [host.GetFirstNameNoTooltip|U] se [CZPrepV(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)|l] [CZProvName(ROOT.Char.GetCurrentLocation,'L')] ocitá mezi lidmi, kteří [Select_CString(host.IsFemale,'ji','ho')] nenávidí.\n\nKdyž se rozhlédnu po davu, spatřím kameny, nože i válečné zbraně."
 jason_race_events.1.desc.host_local_anger: "\n\n„[ROOT.Char.GetTitledFirstName|U]!“ řve dav spolu s urážkami jako „#EMP [ROOT.Char.Custom('GetCrime')|U]!#!“ Nejhlasitěji běsní místní obyvatelé. [CZPrepV(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)|U] [CZProvName(ROOT.Char.GetCurrentLocation,'L')] jsem [Select_CString(ROOT.Char.IsFemale,'obklopena','obklopen')] lidmi, kteří mě nenávidí.\n\nKdyž se rozhlédnu po davu, spatřím kameny, nože i válečné zbraně."
 jason_race_events.1.desc.rowdy_fans: "\n\nVzrušení z dostihů vždy přitahuje nejhorší lůzu z celého panství, a to v ohromných počtech. Přísliby bujarého veselí a hazardních her v ní navíc probouzejí ty nejdivočejší vášně.\n\nNěkdy však přijdou neblahé dny, kdy obvyklé radovánky nestačí. Tehdy dokáže dav uspokojit jedině krev."
 jason_race_events.1.desc.end: "\n\nSchyluje se k nepokojům."
 jason_race_events.1.a: "Jen já dokážu dav uklidnit."
 jason_race_events.1.a.tt: "Správně zvolenými slovy si získám jejich pozornost a obrátím ji zpět k dostihu."
 jason_race_events.1.a.tt.win: "Svým projevem uklidníš dav"
 jason_race_events.1.a.tt.race: "Soutěž pokračuje bez přerušení"
 jason_race_events.1.a.tt.lose: "Nepodaří se ti zabránit nepokojům"
 jason_race_events.1.b: "Vytlučte z nich odvahu, $knights$!"
 jason_race_events.1.b.tt: "Až si otřeme krev z očí, můžeme pokračovat v dostihu!"
 jason_race_events.1.c: "Možná by dav potřeboval trochu popostrčit..."
 jason_race_events.1.c.tt: "Jen do toho, mí $knights$ – rozpoutejte pořádné krveprolití!"
 jason_race_events.1.c.tt.win: "Tví $knights$ potlačí nepokoje"
 jason_race_events.1.c.tt.lose: "Tví ozbrojenci rozpoutají strašlivé nepokoje"
 jason_race_events.1.c.tt.lose_knights: "Někteří z tvých $knight_culture_player_plural$ získají rys [GetTrait('wounded_1').GetName( GetNullCharacter )|l]"
 jason_race_events.1.d: "Musím odsud zmizet, a to #EMP okamžitě#!."
 jason_race_events.1.d.tt: "Kdo ví? Třeba nakonec všechno dobře dopadne."
 jason_race_events.1.d.tt.win: "Nepokoje se podaří dostat pod kontrolu"
 jason_race_events.1.d.tt.lose: "Davové násilí se rozšíří po celém kraji"
 jason_race_events.1.d.tt.leave: "Ty a tvůj doprovod se stáhnete do bezpečí."
 contest_wound_attendees_effect: "Mnoho návštěvníků [CZActivity('activity_tournament','G')|l] získá rys [GetTrait('wounded_1').GetName( GetNullCharacter )|l]"
 contest_wound_non_root_attendees_effect: "Mnoho dalších návštěvníků [CZActivity('activity_tournament','G')|l] získá rys [GetTrait('wounded_1').GetName( GetNullCharacter )|l]"
 jason_race_events.2.t: "Zatáčka v plné rychlosti"
 jason_race_events.2.desc: "Koně hřmí po závodní dráze a jejich uhánějící těla mizí v oblacích prachu. Nad dusotem kopyt a burácením davu není slyšet klení ani pokřikování jezdců.\n\nPřesto si všímáš, že [jockey.GetFirstName] se plně soustředí na rychle se blížící zatáčku. Zatímco ostatní zpomalují, aby prudký oblouk bezpečně projeli, [Select_CString(jockey.IsFemale,'tvá jezdkyně','tvůj jezdec')] pobídne koně k ještě větší rychlosti.\n\nJen o vlásek se [jockey.GetFirstNameNoTooltip] a #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! protáhnou mezi soupeři před sebou. Neuvěřitelný manévr! Celému davu se naráz zatají dech."
 jason_race_events.2.a: "Takové umění patří na bojiště!"
 jason_race_events.2.a.tt: "Moji jezdci by se měli naučit jezdit se stejnou odvahou."
 jason_race_events.2.b: "Moje družina by potřebovala nového zvěda..."
 jason_race_events.2.b.tt: "[Select_CString(jockey.IsFemale,'Takto odvážná jezdkyně by měla','Takto odvážný jezdec by měl')|U] při každé cestě vyjíždět před naší družinou."
 jason_race_events.2.c: "O tomhle okamžiku se bude vyprávět ještě tisíckrát!"
 jason_race_events.2.c.tt: "Ať zvítězím, nebo prohraji, závodníci nikoho jiného nezanechají takový dojem jako ti moji."
