l_polish:
 travel_walking_modifier: "Pěší cesta"
 travel_walking_modifier_desc: "Nemáš k dispozici žádné jízdní zvíře, a tak musíš do cíle dojít po svých."
 travel_guide_modifier: "Místní průvodce"
 travel_guide_modifier_desc: "Najal sis místního průvodce, který ti pomáhá najít správnou cestu."
 temporary_travel_character_limit_tt: "a ihned po skončení [Concept('travel','cesty')|E] se opět vrátí mezi [Concept('wanderer','pocestné')|E]"
 experienced_captains_option: "Najmout zkušené kapitány"
 experienced_captains_option_desc: "Necháš povolat zkušené námořní kapitány, kteří se připojí k tvému doprovodu. Díky jejich znalostem se výrazně sníží nebezpečí při plavbě po mořích a oceánech."
 captain_recruited.t: "Kapitán najat"
 captain_recruited.tt: "K tvému doprovodu se připojí námořník s rysem [GetTrait('forder').GetName( GetNullCharacter )] $temporary_travel_character_limit_tt$"
 hire_experienced_mercenaries_option: "Najmout žoldnéřskou stráž"
 hire_experienced_mercenaries_option_desc: "Najmeš ostřílené žoldnéře, kteří se připojí k tvému doprovodu jako osobní stráž. Jejich přítomnost zvýší celkovou bezpečnost i rychlost cestování."
 mercenary_leader.t: "Velitel žoldnéřů najat"
 mercenary_leader_recruited.tt: "K tvému doprovodu se připojí velitel [Concept('mercenary','žoldnéřů')|E] $temporary_travel_character_limit_tt$"
 available_mercenary.tt: "V dosahu se nachází dostupný, dosud nenajatý [Concept('mercenary','žoldnéř')|E]"
 hire_jungle_expert_option: "Najmout stopaře džungle"
 hire_jungle_expert_option_desc: "Necháš povolat zkušené znalce džungle, kteří se připojí k tvému doprovodu. Jejich schopnosti výrazně sníží nebezpečí při cestování hustou džunglí."
 jungle_stalker_recruited.t: "Stopař džungle najat"
 jungle_stalker_recruited.tt: "K tvému doprovodu se připojí průvodce s rysem [GetTrait('jungle_stalker').GetName( GetNullCharacter )] $temporary_travel_character_limit_tt$"
 hire_mountaineer_option: "Najmout horala"
 hire_mountaineer_option_desc: "Necháš povolat zkušené znalce horského terénu, kteří se připojí k tvému doprovodu. Díky jejich zkušenostem se výrazně sníží nebezpečí při překonávání vysokých hor."
 mountaineer_recruited.t: "Horal najat"
 mountaineer_recruited.tt: "K tvému doprovodu se připojí průvodce s rysem [GetTrait('rough_terrain_expert').GetName( GetNullCharacter )] $temporary_travel_character_limit_tt$"
 hire_forder_option: "Najmout znalce brodů"
 hire_forder_option_desc: "Necháš povolat zkušené znalce mokřadů, kteří se připojí k tvému doprovodu. Jejich znalosti výrazně sníží nebezpečí při cestování mokřady a záplavovými rovinami."
 forder_recruited.t: "Znalec brodů najat"
 forder_recruited.tt: "K tvému doprovodu se připojí průvodce s rysem [GetTrait('forder').GetName( GetNullCharacter )] $temporary_travel_character_limit_tt$"
 wetlands_danger_reduction.tt: "[Concept('travel_danger','Nebezpečí')|EU] při [Concept('travel','cestování')|E] provinciemi s mokřady nebo záplavovými rovinami: @travel_danger_icon!#P -25#!"
 hire_rough_terrain_expert_option: "Najmout lesního průvodce"
 hire_rough_terrain_expert_option_desc: "Necháš povolat zkušené znalce lesů, kteří se připojí k tvému doprovodu. Díky jejich znalostem se výrazně sníží nebezpečí při cestování zalesněnou krajinou."
 rough_terrain_expert_recruited.t: "Lesní průvodce najat"
 rough_terrain_expert_recruited.tt: "K tvému doprovodu se připojí průvodce s rysem [GetTrait('forest_fighter').GetName( GetNullCharacter )] $temporary_travel_character_limit_tt$"
 hire_desert_warrior_option: "Najmout pouštního válečníka"
 hire_desert_warrior_option_desc: "Necháš povolat zkušené znalce pouští, kteří se připojí k tvému doprovodu. Jejich zkušenosti výrazně sníží nebezpečí při putování vyprahlými a nehostinnými kraji."
 desert_warrior_recruited.t: "Pouštní válečník najat"
 desert_warrior_recruited.tt: "K tvému doprovodu se připojí průvodce s rysem [GetTrait('desert_warrior').GetName( GetNullCharacter )] $temporary_travel_character_limit_tt$"
 court_physician_option: "Přibrat lékařské vybavení"
 court_physician_option_suffix: " #weak (pouze proti morům)#!"
 court_physician_option_desc: "Na cestu si přibalíš dostatečné zásoby lékařského vybavení, které pomohou snížit [Concept('travel_danger','nebezpečí')|E] plynoucí z [Concept('epidemics','morových nákaz')|E]."
 court_physician_option_tt: "Musíš mít ve svých službách [GetCourtPositionType('court_physician_court_position').GetName], který se může cesty zúčastnit"
 cultural_ambassador_option: "Najmout kulturního vyslance"
 cultural_ambassador_option_desc: "Najmeš kulturního vyslance, který tě bude doprovázet na cestách a šířit povědomí o tvé kultuře ve všech baronstvích, jimiž projdeš."
 cultural_ambassador_recruited.t: "Kulturní vyslanec najat"
 cultural_ambassador_recruited.tt: "K tvému doprovodu se připojí kulturní vyslanec s vysokou [Concept('diplomacy','diplomacií')|E] $temporary_travel_character_limit_tt$"
 fancy_mounts_option: "Prvotřídní jízdní zvířata"
 fancy_mounts_option_desc: "Tví zkušení stájníci opatří tvému doprovodu ta nejlepší jízdní zvířata, jaká lze v celém panství sehnat."
 military_recruits_option: "Cvičit rytíře"
 military_recruits_option_desc: "Vezmeš na cestu své nejméně zdatné rytíře, aby se zdokonalili a získali cenné zkušenosti při překonávání nástrah, které na ně čekají."
 military_recruits_option.t: "Rytíř se připojil k doprovodu"
 military_recruits_option.desc: "Protože jsi zvolil možnost cesty $military_recruits_option$, připojili se k tvému doprovodu tví nejméně zdatní rytíři."
 travel_events.0060.notification.a: "Rytíř se zdokonalil: [selected_knight.GetShortUIName]"
 travel_events.0060.notification_desc: "Dovednosti [selected_knight.Custom('CZ_ShortUIName_G')] se zlepšily díky zkušenostem získaným během putování ve tvém doprovodu.#"
 travel_events.0060.notification.b: "Rytíř se #EMP výrazně zdokonalil#!"
 travel_events.0060.notification.c: "Rytíř se zdokonalil"
 travel_events.0060.notification.d: "Rytíř získal slávu"
 superior_armaments_option: "Prvotřídní výzbroj"
 superior_armaments_option_desc: "Tví nejlepší kováři vybaví tvůj doprovod výtečnou výzbrojí a veškerým potřebným vybavením pro nadcházející cestu."
 anxious_option: "Pospíšit si"
 anxious_option_desc: "Svět je temné a nebezpečné místo. Čím dříve cesta skončí, tím lépe."
 circumspect_option: "Obezřetnost"
 circumspect_option_desc: "Nikdy nedopusť, aby ostatní věděli, jaký bude tvůj příští krok."
 purchase_rough_terrain_gear_option: "Nakoupit výbavu pro náročný terén"
 purchase_rough_terrain_gear_option_desc: "Překonávat hory a bažiny může být pořádná výzva... ovšem jen pro nepřipravené! Nakoupíš horolezecké háky, další lana a veškerou výstroj potřebnou ke zdolání i těch nejzrádnějších stezek."
 purchase_desert_gear_option: "Nakoupit výbavu do vyprahlých krajů"
 purchase_desert_gear_option_desc: "Nakoupíš závoje, které ochrání tváře před všudypřítomným pískem, a odolné velbloudy, kteří tvému doprovodu usnadní putování pouští."
 purchase_forest_gear_option: "Nakoupit výbavu do divočiny"
 purchase_forest_gear_option_desc: "Les neuznává žádného pána. Ty si ho však podmaníš dlouhými noži, pilami, sekerami a #EMP pořádnou zásobou#! maziva na kola vozů!"
 adventurers_encourage_relationships_option: "Podporovat navazování vztahů"
 adventurers_encourage_relationships_option_desc: "Opravdová a trvalá pouta nelze vynutit. Rodí se ze společně překonaných útrap. Cesta bývá krutou paní, ale každá překonaná překážka může dát vzniknout novému přátelství či lásce."
 adventurers_encourage_relationships_option.tt: "Tví [Concept('followers','družiníci')|E] mohou během [Concept('travel','cestování')|E] mezi [Concept('baronies','baronstvími')|E] navazovat [Concept('friendships','přátelství')|E], stát se [Concept('lovers','milenci')|E] nebo [Concept('marry','uzavírat sňatky')|E]. Vztahy mohou vznikat jak mezi družiníky samotnými, tak s [Concept('wanderers','pocestnými')|E], které cestou potkají. Za každý takto navázaný vztah získáš [prestige_i][Concept('prestige','prestiž')|E].\n#weak (Tvé [Concept('children','děti')|E], [Concept('spouses','choti')|E] ani další osoby, na kterých ti záleží, nebudou tímto způsobem [Concept('marry','uzavírat sňatky')|E] ani získávat [Concept('lovers','milence')|E]. Žádný z tvých [Concept('followers','družiníků')|E] také kvůli této možnosti nezíská rys [GetTrait('adulterer').GetName( GetNullCharacter )].)#!"
 ep3_travel_option_events.0002.title: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_to_marry'))|U] [courtier_to_marry.GetFirstName] [Select_CString(courtier_to_marry.IsFemale,'uzavřela','uzavřel')] sňatek s [marriage_material.Custom('CZ_FirstName_I')]"
 ep3_travel_option_events.0003.title: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_to_befriend'))|U] [courtier_to_befriend.GetFirstName] [Select_CString(courtier_to_befriend.IsFemale,'navázala','navázal')] přátelství s [friend_target.Custom('CZ_FirstName_I')]"
 ep3_travel_option_events.0004.title: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_to_love'))|U] [courtier_to_love.GetFirstName] a [pls_love_me.GetFirstName] spolu tvoří milenecký pár"
 adventurers_search_for_secrets_option: "Pátrat po tajemstvích"
 adventurers_search_for_secrets_option_desc: "Pověsti a klepy jsou jako mapa k pokladnici plné tajemství. Jen dostatečně mazaný člověk však dokáže sledovat jejich stopu až ke křížku, který označuje poklad!"
 adventurers_search_for_secrets_option.tt: "Při průjezdu [Concept('barony','baronstvím')|E] můžeš odhalit [Concept('secret','tajemství')|E] některého z místních obyvatel.\n#weak (Pravděpodobnost v % odpovídá tvé hodnotě [intrigue_i])#!"
 adventurers_search_for_secrets_option.title: "Možnost „[GetTravelOption('adventurers_search_for_secrets_option').GetName]“ přinesla úspěch!"
 adventurers_proselytize_zealously_option: "Obracet místní na víru"
 adventurers_proselytize_zealously_option_desc: "V odlehlých končinách světa žijí lidé, kteří dosud neslyšeli o pravé víře. Je naší svatou povinností tuto nevědomost napravit."
 adventurers_proselytize_zealously_option.tt: "Při průjezdu [Concept('barony','baronstvím')|E] můžeš obrátit některého z místních [Concept('wanderer','pocestných')|E] na svou [Concept('faith','víru')|E] a získat [piety_i][Concept('piety','zbožnost')|E].\n#weak (Pravděpodobnost v % odpovídá tvé hodnotě [learning_i])#!"
 adventurers_proselytize_zealously_option.title: "[wanderer_to_convert.GetShortUIName|U] přijímá vyznání [ROOT.Char.GetFaith.GetName]!"
 adventurers_proselytize_zealously_option.tt.perk_or_tenet: "Máš [Concept('perk','talent')|E] [GetPerk('zealous_proselytizer_perk').GetName(GetPlayer)] nebo je $tenet_mendicant_preachers_name$ tvou [Concept('personal_tenet','osobní zásadou')|E]"
 adventurers_gather_inspiration_option: "Hledat inspiraci"
 adventurers_gather_inspiration_option_desc: "Na cestách lze najít inspiraci na každém kroku. Nádherné krajiny, velkolepé památky i setkání s neobyčejnými lidmi... To všechno probouzí představivost a podněcuje mysl!"
 adventurers_gather_inspiration_option.tt: "Při průjezdu [Concept('barony','baronstvím')|E] může náhodný [Concept('follower','družiník')|E] získat [Concept('inspired','inspiraci')|E].\n#weak (Pravděpodobnost v % odpovídá jedné šestině tvé hodnoty [stewardship_i])#!"
 adventurers_gather_inspiration_option.title: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('inspired_follower'))|U] [inspired_follower.GetFirstName] [Select_CString(inspired_follower.IsFemale,'získala','získal')] inspiraci!"
 adventurers_gather_inspiration_option.effect: "[inspired_follower.GetUIName|U] [Select_CString(inspired_follower.IsFemale,'získala','získal')] novou inspiraci: [inspired_follower.GetCurrentInspiration.GetName|l] – [inspired_follower.Custom('InspirationTypeDescriptionFuturePresent')|l].\n\n[inspired_follower.Custom('InspiredPersonQuality')|U]"
 adventurers_make_local_deals_option: "Výnosné, ale riskantní obchody"
 adventurers_make_local_deals_option_desc: "Vždycky se najde nějaký #EMP výhodný obchod#!. Když tě lidé znají, snáze ti důvěřují a ochotněji s tebou smlouvají. Má to však i svou stinnou stránku. Lupiči totiž #EMP přesně#! vědí, na koho si počíhat..."
 adventurers_make_local_deals_option.tt: "Při průjezdu [Concept('barony','baronstvím')|E] získáš [gold_i][Concept('gold','zlato')|E] v hodnotě #V 25%#! [Concept('loot','kořisti')|E] místní državy.\n#weak (Z každé državy lze takto získat zlato pouze jednou)#!"
 adventurers_scout_for_talent_option: "Vyhledávat schopné lidi"
 adventurers_scout_for_talent_option_desc: "Na cestách potkáš nejrůznější světaznalé lidi, kteří už mají leccos za sebou. A mezi nimi se jistě najdou i tací, kteří právě hledají nové uplatnění!"
 adventurers_scout_for_talent_option.tt: "Zpřístupní události umožňující najímat [Concept('wanderers','pocestné')|E] za [gold_i][Concept('gold','zlato')|E], pokud máš volná místa pro [Concept('officers','důstojníky')|E]"
 excellent.aptitude_tt: "[Concept('aptitude','Způsobilost')|EU] [local_character.Custom('CZ_UIName_G')] je $aptitude_excellent$"
 good.aptitude_tt: "[Concept('aptitude','Způsobilost')|EU] [local_character.Custom('CZ_UIName_G')] je $aptitude_good$"
 average.aptitude_tt: "[Concept('aptitude','Způsobilost')|EU] [local_character.Custom('CZ_UIName_G')] je $aptitude_average$"
 poor.aptitude_tt: "[Concept('aptitude','Způsobilost')|EU] [local_character.Custom('CZ_UIName_G')] je $aptitude_poor$"
 terrible.aptitude_tt: "[Concept('aptitude','Způsobilost')|EU] [local_character.Custom('CZ_UIName_G')] je $aptitude_terrible$"
 ep3_travel_option_events.0001.t: "$adventurers_scout_for_talent_option$: Ochotný následovník"
 ep3_travel_option_events.0001.intro: "Při průchodu [location.GetTitle.Custom('CZ_LandedNameNoTier_I')] narazím na [Select_CString(local_character.IsFemale,'ženu','muže')]. Když se přiblížím, [local_character.GetSheHe|l] je [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', SCOPE.sC('local_character'))|l] a [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('local_character'))|l].\n\n"
 ep3_travel_option_events.0001.court_physician_court_position: "„Kéž vás provází [local_character.GetFaith.HighGodName]! Jmenuji se [local_character.GetFullName] a působím jako místní léčitel a bylinkář [CZPrepV(location.GetNameNoTooltip)] [CZProvNameNoTooltip(location,'L')]. Lidé za mnou chodí se všemožnými neduhy. Léčím zlomeniny, vyrážky a čas od času dokonce pomáhám dětem na svět. Zdraví, léčitelství a tajemství tělesných šťáv mě nesmírně zajímají. Rád bych poznal svět a naučil se něco nového.“\n\n"
 ep3_travel_option_events.0001.bodyguard_court_position: "„Nazdárek! Říkají mi [local_character.GetFullName]. Umím lidem pořádně natlouct. A že mi to jde! Jen včera večer jsem při hospodské rvačce poslal správce stájí k zemi jedinou ranou. Ani nevěděl, odkud to přišlo!“\n\n"
 ep3_travel_option_events.0001.travel_leader_court_position: "„Hola, pocestný! Nezabloudil jste snad? Jmenuji se [local_character.GetFullName] a zdejší kraj znám jako své boty. Každý den vodím ovce [location.Custom('CZ_GetTerrainTypePlural_In')|l], ale mé srdce už dávno touží po vzdálených krajích. Hledat nové stezky, provázet lidi neznámými končinami... To je můj sen.“\n\n"
 ep3_travel_option_events.0001.second_camp_officer: "„Buďte zdráv! Jmenuji se [local_character.GetFullName]. Už léta mám na starosti nakládání vozů na tržišti [CZPrepV(location.GetNameNoTooltip)] [CZProvNameNoTooltip(location,'L')]. V místních mlýnech pod mým dohledem pracovaly desítky čeledínů. Inu, co všechno už jsem vlastně nedělal...“\n\n"
 ep3_travel_option_events.0001.quartermaster_camp_officer: "„O zdejší sklady se starám s nejvyšší pečlivostí. Vedle zásob vedu také knihy a seznamy, takže mi neunikne jediné jablko, cibule ani zrnko obilí [CZPrepV(location.GetNameNoTooltip)] [CZProvNameNoTooltip(location,'L')]. Jenže život na jednom místě mě už začíná k smrti nudit.“\n\n"
 ep3_travel_option_events.0001.armorer_camp_officer: "„Pracuji ve zdejších kovárnách. Opravuji kroužkovou zbroj i plátové brnění pro posádku [CZPrepV(location.GetNameNoTooltip)] [CZProvNameNoTooltip(location,'L')]. Práce je tu pořád dost, to ano... Jenže už dlouho slyším volání dálek. Svět je přece mnohem větší než tahle kovárna.“\n\n"
 ep3_travel_option_events.0001.chief_forager_camp_officer: "„Jmenuji se [local_character.GetFullName]. Celé dny se toulám [location.Custom('CZ_GetTerrainTypePlural_In')|l] a pátrám po všem, co nám příroda nabízí. Mezi [location.Custom('GetProvinceFoliageDesc')|l] a [location.Custom('GetProvinceGroundDesc')|l] nacházím všelijaké poklady: [local_character.Custom('RegionalRootVegetablePlural')|l], vejce ptáků, jako je [local_character.Custom('GetRandomRegionalWildDaytimeBird')|l], a spoustu dalších dobrot. Své úlovky pak nosím na tržiště [CZPrepV(location.GetNameNoTooltip)] [CZProvNameNoTooltip(location,'L')], kde je prodávám pocestným a tulákům.“\n\n"
 ep3_travel_option_events.0001.master_thief_camp_officer: "„Na měšec si tady dávejte dobrý pozor. Kapsářů je v těchto končinách víc než dost. Samozřejmě, někoho takového, jako jste vy, bych nikdy neokradl... Kdepak! Mám dost rozumu na to, abych si hledal bohatství někde daleko odsud. Mnohem větší bohatství.“\n\n"
 ep3_travel_option_events.0001.head_porter_camp_officer: "„Zdravím vás! Jmenuji se [local_character.GetFullName] a živím se jako nosič. Rád říkám, že na vlastních zádech utáhnu celé [location.GetNameNoTooltip]! Ha ha! Balím, nakládám a převážím všechno, na co si vzpomenete. Hrnčířské zboží, potraviny, zbraně... Stačí říct!“\n\n"
 ep3_travel_option_events.0001.head_groom_camp_officer: "„Kéž vás provází [local_character.GetFaith.HighGodName]! Jmenuji se [local_character.GetFullName] a starám se o stáje [CZVPrep(location.GetNameNoTooltip)] [CZProvNameNoTooltip(location,'L')]. Mám na starosti desítky zvířat, pomáhám na svět hříbatům a opravuji stará sedla i všelijakou jezdeckou výstroj. Se zvířaty si rozumím lépe než s většinou lidí.“\n\n"
 ep3_travel_option_events.0001.huntperson_camp_officer: "„Buďte zdráv! Jmenuji se [local_character.GetFullName] a živím se [Select_CString(local_character.IsFemale,'jako lovkyně','jako lovec')]. Zvěř pronásleduji [location.Custom('CZ_GetTerrainTypePlural_In')|l] v okolí [CZProvNameNoTooltip(location,'G')]. Zdejší krajina, [location.Custom('TerrainTypeProvince')|l], je plná života. Ať už jde o [local_character.Custom('GetRegionalDeerType')|l], [local_character.Custom('GetRandomRegionalSmallGame')|l] nebo [local_character.Custom('GetRandomRegionalWildDaytimeBird')|l], všechno je to pro mě vítaná kořist.“\n\n"
 ep3_travel_option_events.0001.kennelperson_camp_officer: "„Zdravím! Jmenuji se [local_character.GetFullName] a vedu psinec [CZPrepV(location.GetNameNoTooltip)] [CZProvNameNoTooltip(location,'L')]. Psi jsou nejlepší přátelé člověka, to vám povídám! Moji milí, [local_character.Custom('ComplimentAdjective')|l] chlupáči... Starám se o ně, cvičím je a připravuji na lov. Věrnější společníky na celém světě nenajdete!“\n\n"
 ep3_travel_option_events.0001.chief_engineer_camp_officer: "„Celé měsíce jsem v dílnách [CZPrepV(location.GetNameNoTooltip)] [CZProvNameNoTooltip(location,'L')] pracoval na stavbě katapultů. Ve dne v noci! Tahání klád, napínání pružin, zatloukání čepů a usazování ozubených kol... Už toho mám dost. Teď mě to táhne na cesty.“\n\n"
 ep3_travel_option_events.0001.witness_camp_officer: "„Ach, hned je vidět, jak významná jste osoba! A ten váš tábor! To je nádhera! Víte, [location.GetNameNoTooltip] bývalo docela pěkné místo, ale dnes? Ani pomyslet! Chci odtud pryč. Zato vy... Vy jste přece [ROOT.Char.Custom('ComplimentAdjective')|l], [ROOT.Char.Custom('RomanticComplimentAdjective')|l], zkrátka opravdový [ROOT.Char.Custom('RomanticComplimentNoun')|l]!“\n\n"
 ep3_travel_option_events.0001.person_haggler_camp_officer: "„Jmenuji se [local_character.GetFullName] a pracuji [Select_CString(local_character.IsFemale,'jako žalářnice','jako žalářník')]. Ve věznicích [CZPrepV(location.GetNameNoTooltip)] [CZProvNameNoTooltip(location,'L')] mám na starosti vězně a také vyjednávám o jejich vykoupení. Jakmile někdo zaplatí výkupné, musím zajistit, aby byl vězeň nakrmený, umytý, oblečený a bezpečně dopravený tam, kam patří.“\n\n"
 ep3_travel_option_events.0001.camp_cook_camp_officer: "„Zdravím vás, [ROOT.Char.Custom('RomanticComplimentNoun')|l]! Nemáte hlad? Víte, živím se vařením v místním hostinci. Ani byste nevěřili, jaké dobroty dokážu vykouzlit z obyčejných surovin, jako jsou [local_character.Custom('RegionalRootVegetablePlural')|l] nebo [local_character.Custom('GetRandomRegionalSmallGame')|l]! Ale co bych dal za možnost vyzkoušet něco opravdu cizokrajného...“\n\n"
 ep3_travel_option_events.0001.master_bard_camp_officer: "„Buďte pozdraveni! Před vámi stojí [local_character.Custom('ComplimentAdjective')|l] [local_character.GetFullName]! Hraji a zpívám v místních hostincích, ale má duše už dávno touží po širém světě! Musím pryč z těchto končin. Chci, aby mou hudbu slyšeli lidé v každém koutě světa!“\n\n"
 ep3_travel_option_events.0001.stooge_camp_officer: "„Už mě nebaví, jak se mnou všichni zacházejí jako se psem! Nikdo si mě neváží! Jen někdo vysloví jméno [local_character.GetFullName], a hned se všichni řehtají! Hlupáci! [local_character.Custom2('InsultNoun', ROOT.Char)|U]! A [ROOT.Char.Custom2('InsultNoun', ROOT.Char)|l] k tomu! #EMP Áááh! Já se snad vzteky zblázním! Musím odtud pryč!#!“\n\n"
 ep3_travel_option_events.0001.master_of_arms_camp_officer: "„Pozor! Jmenuji se [local_character.GetFullName] a velím strážím posádky [CZPrepV(location.GetNameNoTooltip)] [CZProvNameNoTooltip(location,'L')]. Z mladých holobrádků dělám pořádné vojáky a dohlížím na střídání hlídek. Beze mě by tu nikdo nevěděl, co má dělat!“\n\n"
 ep3_travel_option_events.0001.light_cavalry_captain_camp_officer: "„Kéž vás provází [local_character.GetFaith.HighGodName]! Jmenuji se [local_character.GetFullName]. Sloužím jako průzkumník, posel a jízdní zvěd. Mé srdce však patří divočině, daleko od špíny a ruchu měst a vesnic.“\n\n"
 ep3_travel_option_events.0001.camelry_captain_camp_officer: "„Velbloudi jsou celý můj život! Nesčetněkrát mě nesli do bitvy a nikdo nikdy nedokázal zastavit „Dobyvačné velbloudy“ [local_character.Custom('CZ_FullName_G')]! Zase toužím poznávat svět, zase toužím dobývat!“\n\n"
 ep3_travel_option_events.0001.elephantry_captain_camp_officer: "„Zdravím vás, jmenuji se [local_character.GetFullName]. Starám se o mohutná zvířata, kterým říkáme sloni. Krmím je, čistím a pečuji o ně. A věřte mi, nic není tak smrtonosné jako útok některého z těchto obrů s mohutnými kly.“\n\n"
 ep3_travel_option_events.0001.heavy_cavalry_captain_camp_officer: "„Jmenuji se [local_character.GetFullName] a sloužím jako [local_character.Custom('KnightCultureNoTooltipLowercase')|l] v posádce [CZPrepV(location.GetNameNoTooltip)] [CZProvNameNoTooltip(location,'L')]. V těžké zbroji, na koni chráněném pláty a s kopím v ruce jsem se už nesčetněkrát vrhl proti nepřátelům našeho panství.“\n\n"
 ep3_travel_option_events.0001.horse_archer_captain_camp_officer: "„Jmenuji se [local_character.GetFullName] a v sedle trávím život už od nejútlejšího dětství. [local_character.GetFaith.HighGodName|U] mi [Select_CString(local_character.IsFemale,'nadělila','nadělil')] obratnost, výdrž a vytrvalost. Dejte mi luk a koně, a nic víc nepotřebuji.“\n\n"
 ep3_travel_option_events.0001.archer_captain_camp_officer: "„Zdravím vás! Jmenuji se [local_character.GetFullName] a sloužím na hlásce. Z vrcholu své věže pozoruji [location.Custom('CZ_GetTerrainTypePlural_A')|l] v okolí [CZProvNameNoTooltip(location,'G')]. Kdykoli se přiblíží lapkové, promluví za mě můj luk. Jenže takový život mě už omrzel. Chci se dostat dál, než kdy doletěl některý z mých šípů!“\n\n"
 ep3_travel_option_events.0001.heavy_infantry_captain_camp_officer: "„Buďte zdráv, jmenuji se [local_character.GetFullName]. V posádce [CZPrepV(location.GetNameNoTooltip)] [CZProvNameNoTooltip(location,'L')] sloužím už pěkných pár let. Nosím těžkou zbroj a štít, jak se na pořádného pěšáka sluší. Jenže poslední šíp mě minul jen o vlásek. A tehdy mě napadlo, že život přece musí nabízet něco víc.“\n\n"
 ep3_travel_option_events.0001.light_infantry_captain_camp_officer: "„Jmenuji se [local_character.GetFullName] a sloužím mezi ozbrojenci posádky [CZPrepV(location.GetNameNoTooltip)] [CZProvNameNoTooltip(location,'L')]. Přepadnout, ustoupit, vrhnout oštěp, popadnout puklíř a dýku... a pak zasadit smrtící ránu! Sloužím tu už dost dlouho. Svět má přece mnohem víc co nabídnout.“\n\n"
 ep3_travel_option_events.0001.pike_captain_camp_officer: "„Už léta sloužím s kopím v ruce v posádce [CZPrepV(location.GetNameNoTooltip)] [CZProvNameNoTooltip(location,'L')]. Vím dobře, co je v boji potřeba. Pevně zapřít nohy, postavit se nepříteli čelem a s ocelovou vůlí vyčkat na jeho útok.“\n\n"
 ep3_travel_option_events.0001.master_of_spoils_camp_officer: "„Zdravím, jmenuji se [local_character.GetFullName]. Už mě nebaví přepadat pocestné o samotě. K čemu je všechno to zlato, když se o něj nemáte s kým podělit? A vy se svou bandou vypadáte zatraceně drsně...“\n\n"
 ep3_travel_option_events.0001.fallback: "„Zdravím, jmenuji se [local_character.GetFullName]. Už mě nebaví toulat se těmito končinami bez společnosti. Vyzkoušel jsem kdejakou příležitostnou práci, ale nikde se nechci usadit natrvalo. Svět je příliš veliký, než aby člověk zůstával na jednom místě.“\n\n"
 ep3_travel_option_events.0001.excellent: "„Ve svém řemesle nemám konkurenci,“ prohlásí [local_character.GetFirstNameNoTooltip] s neochvějnou jistotou. „Se mnou po boku vás nikdo nepřemůže.“"
 ep3_travel_option_events.0001.good: "„Mé schopnosti by vám mohly přijít vhod,“ pokračuje [local_character.GetFirstNameNoTooltip]. „Můžeme si promluvit o odměně?“"
 ep3_travel_option_events.0001.average: "„Ke svému táboru mě klidně přiberte,“ pokračuje [local_character.GetFirstNameNoTooltip]. „Stačí mi pár mincí a tohle místo bez váhání opustím.“"
 ep3_travel_option_events.0001.poor: "„Možná nejsem zrovna mistr svého řemesla, ale odhodlání mi nechybí,“ přiznává [local_character.GetFirstNameNoTooltip]. „Za pár zlaťáků se k vaší družině ochotně přidám.“"
 ep3_travel_option_events.0001.terrible: "„Smilujte se nade mnou, vždyť jsem úplně k ničemu!“ žadoní [local_character.GetFirstNameNoTooltip]. „Za jedinou minci udělám cokoli! Klidně vám s #EMP úsměvem#! vyčistím i latríny!“"
 ep3_travel_option_events.0001.a: "S radostí ti zaplatím, když se přidáš k mé družině!"
 ep3_travel_option_events.0001.provisions: "Mohu ti nabídnout jen jídlo a oblečení."
 ep3_travel_option_events.0001.b: "Táhni mi z očí, ty [local_character.Custom2('InsultNoun', ROOT.Char')|l]! Jsi mi k ničemu."
 estate_mounts_option: "Skvostní koně"
 estate_mounts_option_desc: "Celý svůj doprovod vybavíš těmi nejskvostnějšími koňmi, jaké lze za peníze pořídit. A co víc, všichni pocházejí přímo z tvých vlastních stájí!"
 hire_allied_mercenaries_option: "Soukromá armáda"
 hire_allied_mercenaries_option_desc: "Smíšený oddíl méně významných rytířů a místních žoldnéřů zajistí, že tvá cesta proběhne rychle a bezpečně, aniž by tě to stálo celé jmění."
 appeasement_option: "Usmiřování"
 appeasement_option_desc: "Někdy je třeba nasadit vlídnou tvář a skrýt tyranii za panovnický šarm. Trocha laskavosti a okázalé blahosklonnosti dokáže utišit nejednoho nespokojeného vazala či poddaného."
 leisurely_option: "Poklidné putování"
 leisurely_option_desc: "Během svých cest si dopřeješ čas na návštěvy malých městeček a vesnic. Poznáš jejich obyvatele, vyslechneš jejich příběhy a navážeš s nimi přátelské vztahy."
 leisurely_option_tt: "Za každou navštívenou [Concept('holding','državu')|E] získáš [Concept('prestige_experience','proslulost')|E]"
 leisurely_option_effect: "$leisurely_option$"
 tutor_child_option: "Výchovná cesta"
 tutor_child_option_desc: "Vezmeš svého dědice na cestu po panství, aby na vlastní oči poznal život svých budoucích poddaných a pochopil, co všechno obnáší vláda."
 tutor_child_option_tt: "Děti, které tě doprovázejí při návštěvách [Concept('holdings','držav')|E] ve tvé [Concept('domain','doméně')|E], si mohou zlepšit své dovednosti"
 child_brought_along.tt: "Tvůj [Concept('heir','dědic')|E] se připojí k tvému doprovodu."
 child_brought_along_specific.tt: "Tvůj dědic [tutored_heir.GetName] se připojí k tvému doprovodu."
 heir_can_join_tt: "[heir_for_tooltip.GetName|U] se může připojit k tvému doprovodu"
 no_heir_tt: "Máš k dispozici [Concept('heir','dědice')|E], který se může připojit k tvému doprovodu"
 travel_logs_title: "$travel_logs_perk_name$"
