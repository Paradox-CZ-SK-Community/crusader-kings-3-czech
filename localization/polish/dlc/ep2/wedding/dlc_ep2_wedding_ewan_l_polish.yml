l_polish:
 ep2_wedding_ewan_0041_attraction_modifier: "Středem pozornosti"
 ep2_wedding_ewan_0041_attraction_modifier_desc: "O přednostech této postavy se mluví na každém kroku. Zdá se, že ji mají všichni plná ústa."
 ep2_wedding_ewan_0051_snooty_modifier: "Povýšenost"
 ep2_wedding_ewan_0051_snooty_modifier_desc: "Tato postava nemá nejmenší trpělivost s bezvýznamnými příživníky, patolízaly ani hlupáky, kteří si hrají na něco víc, než ve skutečnosti jsou."
 ep2_wedding_ewan_0051_approachable_modifier: "Přívětivost"
 ep2_wedding_ewan_0051_approachable_modifier_desc: "Tato postava je proslulá svým taktem a vlídným vystupováním. Na rozhovor si vždy najde čas, i kdyby šlo o to nejnudnější téma pod sluncem."
 ep2_wedding_ewan.0000.desc.hate.fallback: "„Pche, tobě stačí ke štěstí opravdu málo,“ ohrne nos [char_2.GetFirstNameNoTooltip]. „Od podobných slavností čekám přece jen něco víc.“"
 ep2_wedding_ewan.0000.desc.boilerplate.char_intro: "Nedaleko mého místa si [char_1.GetTitledFirstName] a [char_2.GetTitledFirstName] vyměňují své dojmy"
 ep2_wedding_ewan.0000.flavour.hobnob.char_1: "Většinu večera trávíš v družném hovoru s [char_1.Custom('CZ_TitledFirstName_I')]. Během rozhovoru přijde řeč i na vzdělání: [char_1.Custom('GetEducationTrait')|l]"
 ep2_wedding_ewan.0000.flavour.hobnob.char_2: "Většinu večera trávíš v družném hovoru s [char_2.Custom('CZ_TitledFirstName_I')]. Během rozhovoru přijde řeč i na vzdělání: [char_2.Custom('GetEducationTrait')|l]"
 ep2_wedding_ewan.0001.t: "To je tedy podívaná!"
 ep2_wedding_ewan.0001.desc.intro.bad: "Přestože dnešní slavnost nepatří k těm nejvelkolepějším, večerní zábava rozhodně není k zahození. Herci, akrobaté, kejklíři a další umělci se střídají před hosty a snaží se je pobavit. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ z celé podívané.\n\n"
 ep2_wedding_ewan.0001.desc.t1.love.diligent: "„Bravo! Bravo! Přesně tak akorát, aby se člověk pobavil, ale nezabředl do #EMP přílišné#! rozpustilosti!“ zvolá nadšeně [char_1.GetFirstNameNoTooltip]."
 ep2_wedding_ewan.0001.desc.t1.love.shy: "„Je příjemné, když se kolem něco děje, ale člověk přitom ještě slyší vlastní slovo,“ poznamená téměř šeptem [char_1.GetFirstNameNoTooltip]."
 ep2_wedding_ewan.0001.desc.t1.love.humble: "„Právě tolik účinkujících, aby se slavnost nezvrhla v pouhou frašku,“ spokojeně pokývá hlavou [char_1.GetFirstNameNoTooltip]."
 ep2_wedding_ewan.0001.desc.t1.love.content: "$ep2_wedding_ewan.0001.desc.t1.love.humble$"
 ep2_wedding_ewan.0001.desc.t1.love.honest: "„Ještěže tu těch komediantů není víc,“ ušklíbne se [char_1.GetFirstNameNoTooltip]. „S takovými lidmi bývá obvykle jen samé trápení.“"
 ep2_wedding_ewan.0001.desc.t1.love.just: "$ep2_wedding_ewan.0001.desc.t1.love.honest$"
 ep2_wedding_ewan.0001.desc.t1.love.craven: "„Příliš odvážná vystoupení mě vždycky trochu znervózňují,“ nervózně se zasměje [char_1.GetFirstNameNoTooltip]."
 ep2_wedding_ewan.0001.desc.t1.love.paranoid: "„Kejklíři jsou nevyzpytatelní lidé,“ zamyšleně pokývá hlavou [char_1.GetFirstNameNoTooltip]. „Tohle bohatě stačí. Když se jich sejde příliš mnoho, člověk nikdy neví, co se může stát.“"
 ep2_wedding_ewan.0001.desc.intro.normal: "Večerní slavnost ožívá pestrou společností hudebníků, akrobatů a herců, kteří svými vystoupeními baví hosty po celém sále. Kam se člověk podívá, všude se něco děje. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ z celé podívané.\n\n"
 ep2_wedding_ewan.0001.desc.t2.love.content: "„Ach, přesně takovou dávku veselí jsem si [Select_CString(char_1.IsFemale,'představovala','představoval')],“ zasměje se [char_1.GetFirstNameNoTooltip]."
 ep2_wedding_ewan.0001.desc.t2.love.compassionate: "$ep2_wedding_ewan.0001.desc.t2.love.content$"
 ep2_wedding_ewan.0001.desc.t2.love.generous: "„Je radost vidět tak pestrý program,“ protáhne spokojeně [char_1.GetFirstNameNoTooltip]. „Jinde bývají hostitelé na podobné věci až směšně skoupí.“"
 ep2_wedding_ewan.0001.desc.t2.love.calm: "„Najít správnou míru mezi zábavou a poklidným hovorem není snadné,“ zamyslí se [char_1.GetFirstNameNoTooltip]. „Je příjemné, že tu panuje veselí, aniž by všude vládl #EMP přílišný#! shon.“"
 ep2_wedding_ewan.0001.desc.t2.love.patient: "$ep2_wedding_ewan.0001.desc.t2.love.calm$"
 ep2_wedding_ewan.0001.desc.t2.love.fickle: "„Nikdy vlastně nevím, co přesně od takových vystoupení očekávám,“ zasměje se [char_1.GetFirstNameNoTooltip]. „Ale musím uznat, že tohle mi vyhovuje.“"
 ep2_wedding_ewan.0001.desc.t2.love.cynical: "„Účinkujících je právě tak akorát. Ani o jednoho víc,“ suše poznamená [char_1.GetFirstNameNoTooltip]. „Nemůžu vystát ty, kteří se za každou cenu snaží strhnout pozornost na sebe.“"
 ep2_wedding_ewan.0001.desc.intro.good: "Slavnostní síň přímo překypuje životem. Všude se prohánějí skupiny herců, hudebníci tančí při vlastní hře a cizokrajní kejklíři předvádějí jeden neuvěřitelný kousek za druhým. Hosté nadšeně tleskají a veselí nebere konce. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ z celé podívané.\n\n"
 ep2_wedding_ewan.0001.desc.t3.love.lazy: "„Udělej salto!“ zahuláká [char_1.GetFirstNameNoTooltip] na jednoho z poskakujících akrobatů. „[char_1.GetFaith.HealthGodName|U] mi buď svědkem, že #EMP miluju#! pořádnou oslavu!“"
 ep2_wedding_ewan.0001.desc.t3.love.gregarious: "$ep2_wedding_ewan.0001.desc.t3.love.lazy$"
 ep2_wedding_ewan.0001.desc.t3.love.arrogant: "„Tak #EMP takhle#! se to má dělat!“ rozchechtá se [char_1.GetFirstNameNoTooltip]. „Žádná obyčejná slavnost! Tohle je velkolepé, ba přímo #EMP nádherné#!!“"
 ep2_wedding_ewan.0001.desc.t3.love.ambitious: "$ep2_wedding_ewan.0001.desc.t3.love.arrogant$"
 ep2_wedding_ewan.0001.desc.t3.love.deceitful: "„Kejklířů a herců si velice vážím,“ zamyslí se [char_1.GetFirstNameNoTooltip]. „Udělat ze lži výnosné řemeslo, to už vyžaduje skutečné nadání.“"
 ep2_wedding_ewan.0001.desc.t3.love.arbitrary: "$ep2_wedding_ewan.0001.desc.t3.love.deceitful$"
 ep2_wedding_ewan.0001.desc.t3.love.brave: "„No tak! Přece dokážeš hrát i ve vzduchu! Nebuď srab!“ směje se [char_1.GetFirstNameNoTooltip] a pokřikuje na jednoho z hudebníků. „Bez trochy #EMP nebezpečí#! by to přece nebyla žádná zábava!“"
 ep2_wedding_ewan.0001.desc.t3.love.trusting: "„Jen se podívej, jaké nevídané kousky tihle cizinci předvádějí!“ rozesměje se [char_1.GetFirstNameNoTooltip]. „Skoro mám chuť pozvat některé z nich k sobě domů.“"
 ep2_wedding_ewan.0001.desc.midtro: "\n\n"
 ep2_wedding_ewan.0001.desc.t1.hate.lazy: "„Hm, [Select_CString(char_2.IsFemale,'doufala','doufal')] jsem v něco trochu... okázalejšího,“ zakňourá [char_2.GetFirstNameNoTooltip]."
 ep2_wedding_ewan.0001.desc.t1.hate.gregarious: "$ep2_wedding_ewan.0001.desc.t1.hate.lazy$"
 ep2_wedding_ewan.0001.desc.t1.hate.arrogant: "„Pche! Není to vyloženě špatné, ale od pořádné slavnosti jsem [Select_CString(char_2.IsFemale,'čekala','čekal')] mnohem větší podívanou,“ zabručí [char_2.GetFirstNameNoTooltip]."
 ep2_wedding_ewan.0001.desc.t1.hate.ambitious: "$ep2_wedding_ewan.0001.desc.t1.hate.arrogant$"
 ep2_wedding_ewan.0001.desc.t1.hate.deceitful: "„Upřímně řečeno, [Select_CString(char_2.IsFemale,'čekala','čekal')] jsem trochu víc,“ postěžuje si [char_2.GetFirstNameNoTooltip]. „Tihle lidé mě nesmírně fascinují.“"
 ep2_wedding_ewan.0001.desc.t1.hate.arbitrary: "$ep2_wedding_ewan.0001.desc.t1.hate.deceitful$"
 ep2_wedding_ewan.0001.desc.t1.hate.brave: "„Měli jich najmout mnohem víc,“ nespokojeně prohodí [char_2.GetFirstNameNoTooltip]. „Vždyť s takovou hrstkou účinkujících se nedá předvést nic opravdu odvážného!“"
 ep2_wedding_ewan.0001.desc.t1.hate.trusting: "„[Select_CString(char_2.IsFemale,'Čekala','Čekal')|U] jsem přece jen pestřejší zábavu,“ povzdechne si [char_2.GetFirstNameNoTooltip]. „Vždyť podobných potulných umělců se v každém městě najde habaděj!“"
 ep2_wedding_ewan.0001.desc.t2.hate.ambitious: "„Ujde to, řekněme,“ odsekne [char_2.GetFirstNameNoTooltip]. „Já ovšem dávám přednost skutečně oslnivé nádheře před takovými polovičatými pokusy o velkolepost.“"
 ep2_wedding_ewan.0001.desc.t2.hate.arrogant: "$ep2_wedding_ewan.0001.desc.t2.hate.ambitious$"
 ep2_wedding_ewan.0001.desc.t2.hate.greedy: "„Pche! Je jich příliš mnoho na to, aby člověk mohl obdivovat hostitelovu šetrnost, a přitom příliš málo na to, aby si pořádně užil rozhazování cizích peněz!“ stěžuje si [char_2.GetFirstNameNoTooltip]."
 ep2_wedding_ewan.0001.desc.t2.hate.wrathful: "„Upřímně jsem [Select_CString(char_2.IsFemale,'čekala','čekal')], že tu bude mnohem živěji,“ ohrne nos [char_2.GetFirstNameNoTooltip]."
 ep2_wedding_ewan.0001.desc.t2.hate.impatient: "$ep2_wedding_ewan.0001.desc.t2.hate.wrathful$"
 ep2_wedding_ewan.0001.desc.t2.hate.stubborn: "„Pokud vím, tato slavnost má být oslavou svatebního obřadu,“ podotkne [char_2.GetFirstNameNoTooltip]. „Tak významná událost si zaslouží něco opravdu velkolepého, ne takové polovičaté představení.“"
 ep2_wedding_ewan.0001.desc.t2.hate.zealous: "$ep2_wedding_ewan.0001.desc.t2.hate.stubborn$"
 ep2_wedding_ewan.0001.desc.t3.hate.diligent: "„Mně už to připadá trochu přehnané,“ postěžuje si [char_2.GetFirstNameNoTooltip]. „Tolik povyku a... naprosto zbytečné rozpustilosti...“"
 ep2_wedding_ewan.0001.desc.t3.hate.shy: "„Sotva slyším vlastní myšlenky,“ zašeptá [char_2.GetFirstNameNoTooltip]. „Je toho všude tolik... Až se mi z toho točí hlava...“"
 ep2_wedding_ewan.0001.desc.t3.hate.humble: "„Pěkné to je, o tom žádná, ale všechen ten přepych je trochu přehnaný,“ odfrkne si [char_2.GetFirstNameNoTooltip]. „[Select_CString(char_2.IsFemale,'Uvítala','Uvítal')|U] bych alespoň trochu klidu na rozhovor.“"
 ep2_wedding_ewan.0001.desc.t3.hate.content: "$ep2_wedding_ewan.0001.desc.t3.hate.humble$"
 ep2_wedding_ewan.0001.desc.t3.hate.honest: "„#EMP Herci!#!“ zasténá [char_2.GetFirstNameNoTooltip]. „Všichni do jednoho profesionální lháři! Na tak významné slavnosti by se bez tolika z nich docela dobře obešli.“"
 ep2_wedding_ewan.0001.desc.t3.hate.just: "$ep2_wedding_ewan.0001.desc.t3.hate.honest$"
 ep2_wedding_ewan.0001.desc.t3.hate.craven: "„Pozor!“ vyjekne [char_2.GetFirstNameNoTooltip] a na poslední chvíli uhne před letícím žonglérským míčkem. „Zatracení nezodpovědní kejklíři! Člověk se tu nemůže ani v klidu najíst...“"
 ep2_wedding_ewan.0001.desc.t3.hate.paranoid: "„Příliš mnoho cizích tváří! A všude ty jejich podivné nástroje!“ zakleje [char_2.GetFirstNameNoTooltip]. „Jen se podívej tamhle! Opravdu polyká neškodný divadelní meč, nebo je to nájemný vrah čekající na příležitost?“"
 ep2_wedding_ewan.0001.a: "„[char_1.GetFirstNameNoTooltip|U] má rozhodně pravdu.“"
 ep2_wedding_ewan.0001.a.host: "„[char_1.GetFirstNameNoTooltip|U], to mě těší, že se ti naše slavnost tak líbí!“"
 ep2_wedding_ewan.0001.b: "„Musím dát za pravdu [char_2.Custom('CZ_FirstNameNoTooltip_D')].“"
 ep2_wedding_ewan.0001.b.host: "„Při jejich najímání jsem si to [Select_CString(ROOT.Char.IsFemale,'představovala','představoval')] trochu jinak, [char_2.GetFirstNameNoTooltip].“"
 ep2_wedding_ewan.0001.c: "Můj výhružný pohled se upírá na [intent_target.Custom('CZ_FirstNameNoTooltip_A')]..."
 ep2_wedding_ewan.0001.c.tt: "Svým pohledem znervózníš [intent_target.Custom('CZ_FirstNameNoTooltip_A')]"
 ep2_wedding_ewan.0001.d: "Raději se budu věnovat samotnému představení."
 ep2_wedding_ewan.0011.t: "Pokrm hodný..."
 ep2_wedding_ewan.0011.desc.intro.bad: "Podle běžných měřítek by se dnešní hostina dala označit za skutečný kulinářský zážitek. Na stolech se střídají rozmanité chutě, vůně i důmyslně upravené pokrmy. Jenže při tak výjimečné příležitosti by člověk mohl očekávat ještě něco navíc. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ z připravených lahůdek.\n\n"
 ep2_wedding_ewan.0011.desc.t1.love.temperate: "„Kéž [char_1.GetFaith.HealthGodName] dosvědčí, že zdejší kuchyně je #EMP znamenitá#!!“ nadšeně zvolá [char_1.GetFirstNameNoTooltip]. „Pestrá přesně tak, jak se sluší, a přitom bez zbytečného přejídání!“"
 ep2_wedding_ewan.0011.desc.t1.love.humble: "„Čas od času si člověk musí dopřát nějaký ten požitek,“ zamyslí se [char_1.GetFirstNameNoTooltip]. „A právě takovou hostinu mám nejraději.“"
 ep2_wedding_ewan.0011.desc.t1.love.content: "$ep2_wedding_ewan.0011.desc.t1.love.humble$"
 ep2_wedding_ewan.0011.desc.t1.love.impatient: "„Konečně pořádné jídlo, a ještě k tomu v pravý čas!“ zvolá [char_1.GetFirstNameNoTooltip]. „Výborně! Nemůžu vystát hostiny, při kterých člověku předloží tisíc drobných chodů a pořád se nenají.“"
 ep2_wedding_ewan.0011.desc.t1.love.paranoid: "„Hmm, přesně tak akorát,“ poznamená [char_1.GetFirstNameNoTooltip] a podezíravě si prohlíží pořádný kus masa. „Čím víc zbytečných ozdob a příkras, tím snáze se v jídle ukryje jed.“"
 ep2_wedding_ewan.0011.desc.t1.love.stubborn: "„Ještě jednu porci téhož!“ zasměje se [char_1.GetFirstNameNoTooltip]. „Já dobře vím, co mi chutná, a přesně to mi tu podávají!“"
 ep2_wedding_ewan.0011.desc.intro.normal: "Svatební kuchaři si dnes dali opravdu záležet. Stoly se prohýbají pod tíhou cizokrajných pochoutek, důmyslně zdobených pokrmů a jídel, jejichž syté barvy překonávají snad jen jejich omamné vůně. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ z bohatě prostřených stolů.\n\n"
 ep2_wedding_ewan.0011.desc.t2.love.content: "„Ach, to je nádhera,“ spokojeně pokývá hlavou [char_1.GetFirstNameNoTooltip]. „Dokonalé spojení lahodné chuti a krásného provedení.“"
 ep2_wedding_ewan.0011.desc.t2.love.compassionate: "$ep2_wedding_ewan.0011.desc.t2.love.content$"
 ep2_wedding_ewan.0011.desc.t2.love.generous: "„#EMP Lahůdka#!!“ rozesměje se [char_1.GetFirstNameNoTooltip] a vhodí si do úst cosi nafialovělého. „Je radost vidět, že se na takovou příležitost nešetřilo!“"
 ep2_wedding_ewan.0011.desc.t2.love.calm: "„Povedená hostina, [Select_CString(char_1.IsFemale,'řekla','řekl')] bych,“ pobaveně poznamená [char_1.GetFirstNameNoTooltip]. „Někdo si dal opravdu záležet, aby si hosté odnesli krásný zážitek, ale přitom nezapomněl na to podstatné.“"
 ep2_wedding_ewan.0011.desc.t2.love.patient: "$ep2_wedding_ewan.0011.desc.t2.love.calm$"
 ep2_wedding_ewan.0011.desc.t2.love.cynical: "„Přípravě téhle hostiny věnovali právě tolik úsilí, kolik bylo třeba,“ suše poznamená [char_1.GetFirstNameNoTooltip]. „Dost na to, aby člověk ocenil jejich péči, ale ne tolik, aby se zbytečně plýtvalo.“"
 ep2_wedding_ewan.0011.desc.intro.good: "Zrak, chuť, hmat, čich, ba dokonce i sluch! Sotva se najde smysl, který by dnešní velkolepá hostina nedokázala potěšit. Stoly překypují nádherně upravenými pokrmy, jejichž příprava připomíná spíše umělecké dílo než obyčejné vaření. Nádhera a hojnost se tu snoubí v jedinou opulentní podívanou. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ z tohoto kulinářského divadla.\n\n"
 ep2_wedding_ewan.0011.desc.t3.love.gluttonous: "„Ještě! #EMP JEŠTĚ!#!“ zahřmí [char_1.GetFirstNameNoTooltip] a místo dalších slov se s neskrývaným potěšením pustí do další porce."
 ep2_wedding_ewan.0011.desc.t3.love.arrogant: "„#EMP Mmmmm!#!“ blaženě zasténá [char_1.GetFirstNameNoTooltip]. „Tak #EMP takhle#! má vypadat pořádná hostina!“"
 ep2_wedding_ewan.0011.desc.t3.love.ambitious: "$ep2_wedding_ewan.0011.desc.t3.love.arrogant$"
 ep2_wedding_ewan.0011.desc.t3.love.patient: "„Další chod?“ rozzáří se [char_1.GetFirstNameNoTooltip]. „Vždyť ty dobroty snad nikdy neskončí! Kéž [char_1.GetFaith.HealthGodName] dopřeje takovou hostinu každému!“"
 ep2_wedding_ewan.0011.desc.t3.love.trusting: "„Nikdy jsem [Select_CString(char_1.IsFemale,'nechápala','nechápal')], proč jsou někteří lidé na hostinách tak nervózní,“ zasměje se [char_1.GetFirstNameNoTooltip]. „Čeho by se člověk mohl bát uprostřed takových nádherných lahůdek?“"
 ep2_wedding_ewan.0011.desc.t3.love.fickle: "„Ach, ještě trochu tamtoho! #EMP A taky#! támhleto!“ nadšeně zvolá [char_1.GetFirstNameNoTooltip]. „Miluji hostiny, na kterých si člověk nemusí vybírat jen pár dobrot!“"
 ep2_wedding_ewan.0011.desc.midtro: "\n\n"
 ep2_wedding_ewan.0011.desc.t1.hate.gluttonous: "„Já jen...“ ohrne nos [char_2.GetFirstNameNoTooltip]. „Není to #EMP tak docela#! to, co jsem [Select_CString(char_2.IsFemale,'očekávala','očekával')]. Nic víc.“"
 ep2_wedding_ewan.0011.desc.t1.hate.arrogant: "„Pche! Pořádná hostina by měla přivést celé panství téměř na mizinu!“ odfrkne si [char_2.GetFirstNameNoTooltip]. „Jinak jaký má vůbec smysl?“"
 ep2_wedding_ewan.0011.desc.t1.hate.ambitious: "$ep2_wedding_ewan.0011.desc.t1.hate.arrogant$"
 ep2_wedding_ewan.0011.desc.t1.hate.patient: "„Nechápu, proč s těmi chody tak spěchají,“ postěžuje si [char_2.GetFirstNameNoTooltip]. „Všichni se sem sjížděli celou věčnost, a teď máme jídlo zhltat, jako bychom někam pospíchali?“"
 ep2_wedding_ewan.0011.desc.t1.hate.trusting: "„Ten výběr je poněkud chudý,“ zakňourá [char_2.GetFirstNameNoTooltip]. „Copak by někomu uškodilo, kdyby připravili více různých jídel?“"
 ep2_wedding_ewan.0011.desc.t1.hate.fickle: "$ep2_wedding_ewan.0011.desc.t1.hate.trusting$"
 ep2_wedding_ewan.0011.desc.t2.hate.ambitious: "„Průměrnost,“ pohrdavě odfrkne [char_2.GetFirstNameNoTooltip], „je neklamným znamením nedostatku ctižádosti.“"
 ep2_wedding_ewan.0011.desc.t2.hate.arrogant: "$ep2_wedding_ewan.0011.desc.t2.hate.ambitious$"
 ep2_wedding_ewan.0011.desc.t2.hate.greedy: "„Jídlo je dobré, o tom žádná,“ uzná [char_2.GetFirstNameNoTooltip]. „Jen nechápu, proč do něj někdo vloží tolik peněz, když už se ani nepokusí připravit něco #EMP skutečně výjimečného#!.“"
 ep2_wedding_ewan.0011.desc.t2.hate.wrathful: "„Dobré to je,“ odsekne [char_2.GetFirstNameNoTooltip], „ale mně to nestačí. Já mám raději hostiny, kde to pořádně žije!“"
 ep2_wedding_ewan.0011.desc.t2.hate.impatient: "$ep2_wedding_ewan.0011.desc.t2.hate.wrathful$"
 ep2_wedding_ewan.0011.desc.t2.hate.zealous: "„Neříkám, že se nebavím,“ postěžuje si [char_2.GetFirstNameNoTooltip]. „Jen si myslím, že mohli udělat ještě o něco víc, aby tahle hostina byla #EMP skutečně nejlepší#!.“"
 ep2_wedding_ewan.0011.desc.t3.hate.temperate: "„Nepřipadá ti to všechno trochu...“ ohrne nos [char_2.GetFirstNameNoTooltip], „#EMP přehnaně opulentní#!? Podle mě by se u jídla měla cenit především chuť, ne okázalá nádhera.“"
 ep2_wedding_ewan.0011.desc.t3.hate.humble: "„Panečku, tady je ale shon,“ postěžuje si [char_2.GetFirstNameNoTooltip]. „Sotva stihnu ochutnat jeden pokrm, už přinášejí další. Trochu pomalejší tempo by vůbec neuškodilo.“"
 ep2_wedding_ewan.0011.desc.t3.hate.content: "$ep2_wedding_ewan.0011.desc.t3.hate.humble$"
 ep2_wedding_ewan.0011.desc.t3.hate.impatient: "„Pche!“ slabě zakleje [char_2.GetFirstNameNoTooltip]. „Nemůžu vystát tyhle nekonečné hostiny. Pořád další chod, další chod a další... Kdy už to konečně skončí?“"
 ep2_wedding_ewan.0011.desc.t3.hate.paranoid: "„Taková hostina je jako temný les,“ zachmuří se [char_2.GetFirstNameNoTooltip]. „Na první pohled může působit bezpečně, ale kdo ví, kolik nebezpečí se skrývá ve stínech?“"
 ep2_wedding_ewan.0011.desc.t3.hate.stubborn: "„Ruce pryč!“ vyštěkne [char_2.GetFirstNameNoTooltip] na sloužícího. „Dojím, až se mi bude chtít! Zatraceně, to je pořád nějaký další chod...“"
 ep2_wedding_ewan.0011.a: "„Myslím, že s tebou souhlasím, [char_1.Custom('CZ_FirstNameNoTooltip_V')].“"
 ep2_wedding_ewan.0011.a.host: "„Hlavní chody jsem [Select_CString(ROOT.Char.IsFemale,'vybírala','vybíral')] osobně, [char_1.Custom('CZ_FirstNameNoTooltip_V')].“"
 ep2_wedding_ewan.0011.b: "„[char_2.GetFirstNameNoTooltip|U] má podle mě pravdu.“"
 ep2_wedding_ewan.0011.b.host: "„Ano, [char_2.Custom('CZ_FirstNameNoTooltip_V')], ani já jsem si to [Select_CString(ROOT.Char.IsFemale,'nepředstavovala','nepředstavoval')] takhle.“"
 ep2_wedding_ewan.0011.c: "[intent_target.GetFirstNameNoTooltip|U] sedí tak blízko dveří, kterými sloužící nosí jídlo..."
 ep2_wedding_ewan.0011.c.tt.success: "Nastavíš nohu sloužícímu, který zakopne a polije [intent_target.Custom('CZ_FirstNameNoTooltip_A')] polévkou"
 ep2_wedding_ewan.0011.c.tt.failure: "Sloužící se tvé nastavené noze vyhne"
 ep2_wedding_ewan.0011.d: "Nepřítomně přikyvuji, aniž bych [Select_CString(ROOT.Char.IsFemale,'poslouchala','poslouchal')]."
 ep2_wedding_ewan.0021.t: "Třpyt a nádhera"
 ep2_wedding_ewan.0021.desc.intro.bad: "Svatební síň je vyzdobena s nepochybným vkusem. Stěny zdobí půvabné malby, všude voní vzácné květiny a jednotlivé ozdoby spolu vytvářejí příjemně slavnostní celek. Pravda, nejdražší skvosty světa tu člověk nenajde, ale výzdoba má své kouzlo. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ z výzdoby.\n\n"
 ep2_wedding_ewan.0021.desc.t1.love.content: "„Ach, #EMP nádhera#!!“ spokojeně se zasměje [char_1.GetFirstNameNoTooltip]. „Právě tolik ozdob, aby bylo poznat, že jde o výjimečný den, ale ne tolik, aby zastínily samotné novomanžele.“"
 ep2_wedding_ewan.0021.desc.t1.love.lazy: "„Víš,“ zamyslí se [char_1.GetFirstNameNoTooltip], „tohle je #EMP přesně#! tolik práce, kolik bych si s výzdobou [Select_CString(char_1.IsFemale,'dala sama','dal sám')]. Nemám jedinou výhradu!“"
 ep2_wedding_ewan.0021.desc.t1.love.humble: "$ep2_wedding_ewan.0021.desc.t1.love.content$"
 ep2_wedding_ewan.0021.desc.t1.love.forgiving: "„Možná to není ta nejvelkolepější výzdoba, jakou si lze představit,“ uznale pokývá hlavou [char_1.GetFirstNameNoTooltip]. „Ale je vidět, že si s ní někdo dal práci a vložil do ní kus srdce.“"
 ep2_wedding_ewan.0021.desc.t1.love.compassionate: "$ep2_wedding_ewan.0021.desc.t1.love.forgiving$"
 ep2_wedding_ewan.0021.desc.t1.love.arbitrary: "„Říkejte si, co chcete,“ protáhne [char_1.GetFirstNameNoTooltip], „mně se to líbí. Někdo si s tím dal práci a vy jen ohrnujete nos!“"
 ep2_wedding_ewan.0021.desc.t1.love.greedy: "$ep2_wedding_ewan.0021.desc.t1.love.lazy$"
 ep2_wedding_ewan.0021.desc.intro.normal: "Svatební síň hýří barvami a vůněmi. Ze stěn splývají nádherné látky, mezi nimi se skví květinové girlandy a pečlivě rozmístěné ozdoby potěší oko na každém kroku. Chybí snad jen ty nejvzácnější tkaniny a nejdražší květy, jaké lze sehnat. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ z výzdoby.\n\n"
 ep2_wedding_ewan.0021.desc.t2.love.content: "„Vůbec nechápu, jak se to někomu nemůže líbit!“ zasměje se [char_1.GetFirstNameNoTooltip]. „Jen se rozhlédni, kolik úsilí do toho museli vložit!“"
 ep2_wedding_ewan.0021.desc.t2.love.compassionate: "$ep2_wedding_ewan.0021.desc.t2.love.content$"
 ep2_wedding_ewan.0021.desc.t2.love.generous: "„Tady se tedy na penězích nešetřilo,“ uznale poznamená [char_1.GetFirstNameNoTooltip]. „Vidíš tamtu tapisérii? Ta sem musela putovat přes půl kontinentu!“"
 ep2_wedding_ewan.0021.desc.t2.love.calm: "„[char_1.GetFaith.WealthGodName|U] mi budiž svědkem, tohle je #EMP naprosto#! dokonalé,“ nadšeně prohlásí [char_1.GetFirstNameNoTooltip]. „Právě tolik nádhery, aby potěšila oko, ale nepůsobila přehnaně.“"
 ep2_wedding_ewan.0021.desc.t2.love.patient: "$ep2_wedding_ewan.0021.desc.t2.love.calm$"
 ep2_wedding_ewan.0021.desc.t2.love.fickle: "„Možná ta výzdoba nemá žádný jednotný styl,“ zamyslí se [char_1.GetFirstNameNoTooltip], „ale právě #EMP to#! se mi na ní líbí. Taková slavnost si přece žádá trochu rozmanitosti!“"
 ep2_wedding_ewan.0021.desc.t2.love.cynical: "„Dost přepychu, aby byli všichni spokojení, ale zase ne tolik, aby se zbytečně plýtvalo,“ uznale poznamená [char_1.GetFirstNameNoTooltip]. „Někdo to má opravdu dobře promyšlené.“"
 ep2_wedding_ewan.0021.desc.intro.good: "Svatební síň se proměnila v hotovou pokladnici krásy. Nádherné sochy stojí mezi cizokrajnými tapisériemi, nevídaná květinová aranžmá překvapují barvami i vůněmi a každý kout zdobí další mistrovské dílo. Kamkoli se člověk podívá, všude na něj čeká nová nádhera. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ z výzdoby.\n\n"
 ep2_wedding_ewan.0021.desc.t3.love.ambitious: "„Tak #EMP tohle#! jsem [Select_CString(char_1.IsFemale,'chtěla','chtěl')] vidět!“ zahřmí [char_1.GetFirstNameNoTooltip]. „Konečně místo, které je hodné skutečně #EMP velkolepé#! svatby!“"
 ep2_wedding_ewan.0021.desc.t3.love.diligent: "$ep2_wedding_ewan.0021.desc.t3.love.ambitious$"
 ep2_wedding_ewan.0021.desc.t3.love.arrogant: "$ep2_wedding_ewan.0021.desc.t3.love.ambitious$"
 ep2_wedding_ewan.0021.desc.t3.love.honest: "„To mě těší, že si s tím někdo dal pořádnou práci!“ zasměje se [char_1.GetFirstNameNoTooltip]. „Nemůžu vystát hostitele, kteří tak důležitou událost odbudou jen napůl.“"
 ep2_wedding_ewan.0021.desc.t3.love.just: "$ep2_wedding_ewan.0021.desc.t3.love.honest$"
 ep2_wedding_ewan.0021.desc.t3.love.greedy: "„Tady se tedy měšce rozhodně nešetřily, co?“ rozesměje se [char_1.GetFirstNameNoTooltip]. „Inu, já se takovou štědrou pohostinností nechám [Select_CString(char_1.IsFemale,'ráda','rád')] rozmazlovat!“"
 ep2_wedding_ewan.0021.desc.t3.love.generous: "$ep2_wedding_ewan.0021.desc.t3.love.greedy$"
 ep2_wedding_ewan.0021.desc.midtro: "\n\n"
 ep2_wedding_ewan.0021.desc.t1.hate.ambitious: "„Upřímně řečeno, já dávám přednost poněkud...“ [char_2.GetFirstNameNoTooltip|U] chvíli hledá dostatečně zdvořilý výraz, „#EMP bohatší#! výzdobě.“"
 ep2_wedding_ewan.0021.desc.t1.hate.diligent: "$ep2_wedding_ewan.0021.desc.t1.hate.ambitious$"
 ep2_wedding_ewan.0021.desc.t1.hate.arrogant: "$ep2_wedding_ewan.0021.desc.t1.hate.ambitious$"
 ep2_wedding_ewan.0021.desc.t1.hate.honest: "„Mám pocit, že nám slibovali mnohem větší nádheru,“ postěžuje si [char_2.GetFirstNameNoTooltip]. „Proč vůbec zvát tolik hostů, když si člověk nemůže dovolit výzdobu, která za něco stojí?“"
 ep2_wedding_ewan.0021.desc.t1.hate.generous: "$ep2_wedding_ewan.0021.desc.t1.hate.honest$"
 ep2_wedding_ewan.0021.desc.t1.hate.just: "„[Select_CString(char_2.IsFemale,'Řekla','Řekl')|U] bych, že výzdoba je na poměrně slušné úrovni,“ uzná neochotně [char_2.GetFirstNameNoTooltip]. „Jen jsem zkrátka [Select_CString(char_2.IsFemale,'očekávala','očekával')] trochu víc.“"
 ep2_wedding_ewan.0021.desc.t2.hate.ambitious: "„Pche,“ nespokojeně odfrkne [char_2.GetFirstNameNoTooltip]. „Tolik promarněných možností! Už teď je tu spousta krásných věcí. Proč tedy nezajít #EMP ještě dál#!?“"
 ep2_wedding_ewan.0021.desc.t2.hate.arrogant: "$ep2_wedding_ewan.0021.desc.t2.hate.ambitious$"
 ep2_wedding_ewan.0021.desc.t2.hate.greedy: "„Utratili příliš mnoho na to, aby si zasloužili obdiv za šetrnost,“ odfrkne si [char_2.GetFirstNameNoTooltip], „ale zase příliš málo, aby si člověk mohl vychutnat pořádnou nádheru. Jsem [Select_CString(char_2.IsFemale,'zklamaná','zklamaný')].“"
 ep2_wedding_ewan.0021.desc.t2.hate.wrathful: "„Líbí se mi to, o tom žádná,“ zabručí [char_2.GetFirstNameNoTooltip]. „Ale líbilo by se mi to ještě mnohem víc, kdyby všeho bylo trochu víc!“"
 ep2_wedding_ewan.0021.desc.t2.hate.impatient: "$ep2_wedding_ewan.0021.desc.t2.hate.wrathful$"
 ep2_wedding_ewan.0021.desc.t2.hate.stubborn: "„Svatební obřady jsou důležitá věc a tahle slavnost k nim neodmyslitelně patří,“ odfrkne si [char_2.GetFirstNameNoTooltip]. „Všechno mělo být větší, krásnější a velkolepější. Zkrátka ve všech ohledech!“"
 ep2_wedding_ewan.0021.desc.t2.hate.zealous: "$ep2_wedding_ewan.0021.desc.t2.hate.stubborn$"
 ep2_wedding_ewan.0021.desc.t3.hate.content: "„Popravdě mě všechna ta nádhera už trochu unavuje,“ zasténá [char_2.GetFirstNameNoTooltip]. „Člověk tu ani nepozná, co je židle a co nějaká ozdobná socha!“"
 ep2_wedding_ewan.0021.desc.t3.hate.lazy: "$ep2_wedding_ewan.0021.desc.t3.hate.content$"
 ep2_wedding_ewan.0021.desc.t3.hate.humble: "$ep2_wedding_ewan.0021.desc.t3.hate.content$"
 ep2_wedding_ewan.0021.desc.t3.hate.compassionate: "„Hmm, nejsem si [Select_CString(char_2.IsFemale,'jistá','jistý')],“ zamyslí se [char_2.GetFirstNameNoTooltip]. „Nepřipadá ti, že všechna ta okázalá nádhera trochu odvádí pozornost od samotného svatebního obřadu?“"
 ep2_wedding_ewan.0021.desc.t3.hate.arbitrary: "„Vážně je to tak úžasné?“ zakňourá [char_2.GetFirstNameNoTooltip]. „Kolik vůbec mohou všechny tyhle cetky stát?“"
 ep2_wedding_ewan.0021.a: "„Pche! Raději dám na optimističtější slova [char_1.Custom('CZ_FirstNameNoTooltip_G')].“"
 ep2_wedding_ewan.0021.a.host: "„Spoustu těch ozdob jsem [Select_CString(ROOT.Char.IsFemale,'vybírala','vybíral')] osobně, [char_1.Custom('CZ_FirstNameNoTooltip_V')].“"
 ep2_wedding_ewan.0021.b: "„Obávám se, že máš pravdu, [char_2.Custom('CZ_FirstNameNoTooltip_V')].“"
 ep2_wedding_ewan.0021.b.host: "„[char_2.GetFirstNameNoTooltip|U] má pravdu. Takhle jsem si to rozhodně [Select_CString(ROOT.Char.IsFemale,'nepředstavovala','nepředstavoval')].“"
 ep2_wedding_ewan.0021.c: "Zdá se, že [intent_target.GetFirstNameNoTooltip] tu sedí tak nějak osaměle..."
 ep2_wedding_ewan.0021.d: "Raději se do toho nebudu plést."
 ep2_wedding_ewan.0031.t: "Večer plný setkání"
 ep2_wedding_ewan.0031.desc.intro: "Na podobných slavnostech je vždy tolik lidí, s nimiž stojí za to prohodit pár slov! Nové tváře čekají na seznámení, staré známosti na obnovení a všude kolem panuje čilý ruch a veselí.\n\nUž od svého místa zahlédnu "
 ep2_wedding_ewan.0031.desc.char_1.conversationalist_neighbour: "[Select_CString(char_1.IsFemale,'svou sousední vládkyni','svého sousedního vládce')]"
 ep2_wedding_ewan.0031.desc.char_1.conversationalist_covassal: "[Select_CString(char_1.IsFemale,'svou spoluvazalku','svého spoluvazala')]"
 ep2_wedding_ewan.0031.desc.char_1.conversationalist_vassal: "[Select_CString(char_1.IsFemale,'svou vazalku','svého vazala')]"
 ep2_wedding_ewan.0031.desc.char_1.conversationalist_liege: "[Select_CString(char_1.IsFemale,'svou přímou lenní paní','svého přímého lenního pána')]"
 ep2_wedding_ewan.0031.desc.char_1.conversationalist_other_ruler: "[Select_CString(char_1.IsFemale,'cizí panovnici','cizího panovníka')]"
 ep2_wedding_ewan.0031.desc.char_1.conversationalist_backup: "[Select_CString(char_1.IsFemale,'jednu významnou dámu','jednoho významného pána')]"
 ep2_wedding_ewan.0031.desc.midro: " [char_1.Custom('CZ_TitledFirstName_A')], [Select_CString(char_1.IsFemale,'která se tváří, že by uvítala lepší společnost','který se tváří, že by uvítal lepší společnost')], a "
 ep2_wedding_ewan.0031.desc.char_2.conversationalist_neighbour: "[Select_CString(char_2.IsFemale,'svou sousední vládkyni','svého sousedního vládce')]"
 ep2_wedding_ewan.0031.desc.char_2.conversationalist_covassal: "[Select_CString(char_2.IsFemale,'svou spoluvazalku','svého spoluvazala')]"
 ep2_wedding_ewan.0031.desc.char_2.conversationalist_vassal: "[Select_CString(char_2.IsFemale,'svou vazalku','svého vazala')]"
 ep2_wedding_ewan.0031.desc.char_2.conversationalist_liege: "[Select_CString(char_2.IsFemale,'svou přímou lenní paní','svého přímého lenního pána')]"
 ep2_wedding_ewan.0031.desc.char_2.conversationalist_other_ruler: "[Select_CString(char_2.IsFemale,'cizí panovnici','cizího panovníka')]"
 ep2_wedding_ewan.0031.desc.char_2.conversationalist_backup: "[Select_CString(char_2.IsFemale,'jednu významnou dámu','jednoho významného pána')]"
 ep2_wedding_ewan.0031.desc.outro: " [char_2.Custom('CZ_TitledFirstName_A')], [Select_CString(char_2.IsFemale,'která září dobrou náladou','který září dobrou náladou')].\n\nObě tyto známosti by jistě stálo za to trochu prohloubit. A kdy jindy se pustit do společenského dobrodružství než #EMP právě teď#!?"
 ep2_wedding_ewan.0031.a: "„[conversationalist_neighbour.Custom('CZ_FirstNameNoTooltip_V')|U], jak [Select_CString(ROOT.Char.IsFemale,'ráda','rád')] tě zase vidím!“"
 ep2_wedding_ewan.0031.b: "„Ach, [conversationalist_covassal.Custom('CZ_FirstNameNoTooltip_V')|U], jsem [Select_CString(ROOT.Char.IsFemale,'ráda','rád')], že jsi [Select_CString(conversationalist_covassal.IsFemale,'dorazila','dorazil')]...“"
 ep2_wedding_ewan.0031.c: "„Vždycky tě [Select_CString(ROOT.Char.IsFemale,'ráda','rád')] vidím, [conversationalist_vassal.Custom('CZ_FirstNameNoTooltip_V')].“"
 ep2_wedding_ewan.0031.d: "„[Select_CString(conversationalist_liege.IsFemale,'Paní','Pane')|U] [conversationalist_liege.Custom('CZ_FirstNameNoTooltip_V')], jaká čest, že jste nás [Select_CString(conversationalist_liege.IsFemale,'poctila','poctil')] svou přítomností!“"
 ep2_wedding_ewan.0031.e: "„[conversationalist_other_ruler.Custom('CZ_FirstNameNoTooltip_V')|U], tebe bych tu opravdu [Select_CString(ROOT.Char.IsFemale,'nečekala','nečekal')].“"
 ep2_wedding_ewan.0031.f: "„[conversationalist_backup.Custom('CZ_FirstNameNoTooltip_V')|U], jak se ti daří?“"
 ep2_wedding_ewan.0031.g: "Vždyť je tu slavnost! Proč se omezovat na jediný rozhovor?"
 ep2_wedding_ewan.0031.h: "Hmm, raději bych si [Select_CString(ROOT.Char.IsFemale,'popovídala','popovídal')] s někým jiným."
 ep2_wedding_ewan.0041.t: "Proslov! Proslov!"
 ep2_wedding_ewan.0041.desc.intro: "Ke každé svatební hostině neodmyslitelně patří také upřímně řečeno #EMP nekonečná#! záplava slavnostních proslovů. Některé jsou dlouhé, jiné krátké, jedny vycházejí ze srdce, zatímco další jsou plné přetvářky. Jeden řečník střídá druhého a sotva se na stůl dostane nový chod, už se zase někdo zvedá s pohárem v ruce.\n\nKdyž se blíží má chvíle, začínám přemýšlet. Mám vzdát hold šťastným novomanželům, nebo "
 ep2_wedding_ewan.0041.desc.murder: "se raději trochu škodolibě kochat pohledem na [intent_target.Custom('CZ_FirstNameNoTooltip_A')], svou budoucí oběť?"
 ep2_wedding_ewan.0041.desc.seduce: "využít příležitosti a pokusit se okouzlit [intent_target.Custom('CZ_FirstNameNoTooltip_A')]?"
 ep2_wedding_ewan.0041.desc.diplomacy: "předvést své řečnické umění a strhnout na sebe pozornost všech přítomných?"
 ep2_wedding_ewan.0041.desc.matchmaking: "věnovat pár laskavých slov [intent_target.Custom('CZ_FirstNameNoTooltip_D')]?"
 ep2_wedding_ewan.0041.desc.mischief: "trochu rozvířit poklidné vody svatebního veselí?"
 ep2_wedding_ewan.0041.desc.recreation: "se prostě soustředit na oslavu a užít si všeobecného veselí?"
 ep2_wedding_ewan.0041.desc.outro: "\n\nKoneckonců, v té nekonečné záplavě slov snadno zapadne i pořádně peprný dvojsmysl. Většina hostů si ničeho ani nevšimne..."
 ep2_wedding_ewan.0041.a: "Vzdát hold šťastným novomanželům, jak se sluší."
 ep2_wedding_ewan.0041.b: "Vychválit dnešní slavnost až do nebes."
 ep2_wedding_ewan.0041.c: "Propašovat do proslovu skrytou výhrůžku určenou [intent_target.Custom('CZ_FirstNameNoTooltip_D')]."
 ep2_wedding_ewan.0041.d: "Nenápadně směřovat svá slova k [intent_target.Custom('CZ_FirstNameNoTooltip_D')]."
 ep2_wedding_ewan.0041.d.tt.success: "[intent_target.GetFirstNameNoTooltip|U] tvé náznaky pochopí a ocení"
 ep2_wedding_ewan.0041.d.tt.failure: "[intent_target.GetFirstNameNoTooltip|U] se cítí nesmírně trapně"
 ep2_wedding_ewan.0041.e: "Oslnit všechny svým řečnickým uměním."
 ep2_wedding_ewan.0041.e.tt.success: "Vynikající proslov"
 ep2_wedding_ewan.0041.e.tt.failure: "Ucházející proslov"
 ep2_wedding_ewan.0041.f: "Vyzdvihnout přednosti [intent_target.Custom('CZ_FirstNameNoTooltip_G')]."
 ep2_wedding_ewan.0041.g: "Naznačit pár pohoršlivých zvěstí, na kterých možná něco je."
 ep2_wedding_ewan.0041.g.tt.success: "Počkat... Je to snad pravda?"
 ep2_wedding_ewan.0041.g.tt.failure: "Tak průhledné a nestydaté výmysly!"
 ep2_wedding_ewan.0041.h: "Rozpačitě se posadit a neříct ani slovo."
 ep2_wedding_ewan.0041.i: "Pronést pár milých, ale zcela obřadných slov."
 ep2_wedding_ewan.0051.t: "A ještě jedna věc..."
 ep2_wedding_ewan.0051.desc.intro: "Na každé hostině se jeden takový najde. Na #EMP každé jediné#!. Nějaký nevychovaný, bezvýznamný žvanil, který si člověka zažene do kouta a pak prostě #EMP nezavře pusu#!.\n\nTentokrát padnu do spárů [dolt.Custom('CZ_FirstName_D')]. A moje utrpení teprve začíná. "
 ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch: "S vytrvalostí hodnou lepší věci mě přesvědčuje, abych ze svých „jistě ohromných prostředků, které jako [ROOT.Char.GetTitleAsNameNoTooltip] a [Select_CString(ROOT.Char.IsFemale,'urozená dáma','urozený pán')] nepochybně mám“, [Select_CString(ROOT.Char.IsFemale,'podpořila','podpořil')] [Select_CString(dolt.IsFemale,'její','jeho')]"
 ep2_wedding_ewan.0051.desc.drunkard: "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ koupi údajně #EMP půvabně#! venkovské hospody."
 ep2_wedding_ewan.0051.desc.hashishiyah: "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ plán na pořízení podniku s hašišovými koláčky, který má prý zcela nezaslouženě špatnou pověst."
 ep2_wedding_ewan.0051.desc.rakish: "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ koupi nevěstince, jehož osazenstvo má tvořit ta nejkrásnější děvčata a nejpohlednější mladíci ze všech koutů světa."
 ep2_wedding_ewan.0051.desc.reclusive: "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ plán na vybudování odlehlého sídla, kde by i ti nejproslulejší šlechtici mohli nalézt naprostý klid a samotu."
 ep2_wedding_ewan.0051.desc.flagellant: "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ plán na zřízení jakéhosi... #EMP pole#! plného kůlů k bičování, kde by se desítky kajícníků mohly společně očišťovat skrze bolest."
 ep2_wedding_ewan.0051.desc.profligate: "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ naprosto nesrozumitelný podnikatelský záměr. Já... já vlastně vůbec nechápu, na co ty peníze mají být."
 ep2_wedding_ewan.0051.desc.journaller: "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ založení skriptoria, v němž by se alespoň zpočátku opisovala a šířila především #EMP vlastní#! díla."
 ep2_wedding_ewan.0051.desc.athletic: "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ nápad na zřízení zcela nového druhu veřejného cvičiště, kde by si každý mohl rozvíjet tělesnou zdatnost nejrůznějšími způsoby."
 ep2_wedding_ewan.0051.desc.diligent: "Řeč se neustále točí kolem práce. Každodenní povinnosti, drobné úkoly, všední starosti... Nic jiného snad ani neexistuje! A co hůř, vůbec si nepřipouští, že by někoho mohl tenhle jednotvárný a bezútěšný život k smrti nudit."
 ep2_wedding_ewan.0051.desc.patient: "Nedá se odbýt. [Select_CString(ROOT.Char.IsFemale,'Zkusila','Zkusil')|U] jsem snad každé téma, které mě napadlo. [Select_CString(ROOT.Char.IsFemale,'Pokoušela','Pokoušel')|U] jsem se rozhovor ukončit, zatáhnout do něj někoho dalšího, dokonce se nenápadně vytratit. Marně. S neúprosnou vytrvalostí mě pronásleduje dál."
 ep2_wedding_ewan.0051.desc.impatient: "Nevydrží u jediného tématu ani okamžik. Sotva se mi podaří zapojit do rozhovoru, už se mluví o něčem úplně jiném. Jedna myšlenka střídá druhou, aniž by spolu měly sebemenší souvislost. Nekonečný proud nesourodých úvah, který nikdy neustává."
 ep2_wedding_ewan.0051.desc.arrogant: "Veškerá pozornost se musí točit kolem jediné osoby. A tou rozhodně nejsem já. Rozhovor překypuje pokrytectvím, nedomyšlenými názory a čirou hloupostí. Přesto tu přede mnou sedí někdo, kdo je skálopevně přesvědčen o vlastní společenské genialitě."
 ep2_wedding_ewan.0051.desc.arbitrary: "Nerozumím z toho vůbec ničemu. Vlastní slova zjevně dávají smysl #EMP jedině [Select_CString(dolt.IsFemale,'jí','jemu')]#!, zatímco mně připadají jako náhodně poskládané věty bez jakékoli souvislosti. Už půl hodiny se marně snažím přijít na to, jakou úlohu v tomhle rozhovoru vlastně mám."
 ep2_wedding_ewan.0051.desc.zealous: "Pořád dokola se rozebírá osobní vztah k víře. A pak zase. A znovu. A #EMP znovu#!. Dozvídám se, jak bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] otevřít své srdce pravému světlu, které přináší [dolt.GetFaith.random_GoodGodNames], a proč je to naprosto nezbytné. Za celou tu dobu však nepadla jediná otázka na #EMP mé#! vlastní přesvědčení."
 ep2_wedding_ewan.0051.desc.fickle: "Jeden podnikatelský plán střídá druhý, ale u žádného se nevydrží dost dlouho na to, aby vůbec začal dávat smysl. Jen nekonečná přehlídka napůl upečených nápadů, které se na mě valí jako slovní průjem a pomalu ve mně ubíjejí všechnu chuť k životu."
 ep2_wedding_ewan.0051.desc.vengeful: "Všechny myšlenky se upínají k jediné věci: strašlivé pomstě nějakému ubohému, bezejmennému soupeři, který se měl údajně dopustit neodpustitelné urážky. Proč bych se [Select_CString(ROOT.Char.IsFemale,'měla','měl')] podílet na tomhle šíleném spiknutí, je mi naprostou záhadou."
 ep2_wedding_ewan.0051.desc.poet: "Především mám před sebou jednu z nejhorších pohrom, jaké mohou člověka potkat: [Select_CString(dolt.IsFemale,'mizernou básnířku','mizerného básníka')] s nedobrovolným posluchačem. Verše, které na mně právě zkouší, vlastně ani nejsou básněmi. Jsou to jen zoufale kostrbatá dvojverší, která se sotva rýmují a nemají ani špetku rytmu."
 ep2_wedding_ewan.0051.desc.outro: "\n\nJá snad začnu křičet."
 ep2_wedding_ewan.0051.a: "Nenápadně se z rozhovoru vytratit."
 ep2_wedding_ewan.0051.a.tt.success: "Podaří se ti uniknout"
 ep2_wedding_ewan.0051.a.tt.failure: "Tohle #EMP nikdy#! neskončí"
 ep2_wedding_ewan.0051.b: "„U všech duší, které čeká [ROOT.Char.GetFaith.random_NegativeAfterLife], přestaneš už konečně žvanit?!“"
 ep2_wedding_ewan.0051.b.custom.every_wrathful_guest: "Každý host s rysem [GetTrait('wrathful').GetName( reference )]"
 ep2_wedding_ewan.0051.c: "„Tak. Už. Mlč.“"
 ep2_wedding_ewan.0051.d: "Okamžitě usnout."
 ep2_wedding_ewan.0051.d.custom.every_lazy_guest: "Každý host s rysem [GetTrait('lazy').GetName( reference )]"
 ep2_wedding_ewan.0051.e: "„Říkáš tedy, že chceš koupit #EMP hospodu#!...“"
 ep2_wedding_ewan.0051.f: "„Takže #EMP obchod s koláčky#!, říkáš...“"
 ep2_wedding_ewan.0051.g: "„#EMP Nevěstinec#!, povídáš...“"
 ep2_wedding_ewan.0051.h: "„#EMP Soukromé útočiště#!, říkáš...“"
 ep2_wedding_ewan.0051.i: "„Celé #EMP pole#! kůlů k bičování, říkáš...“"
 ep2_wedding_ewan.0051.i.tt.deviant: "Tato možnost je dostupná díky tvému [Concept('secret','tajemství')|E]: [secret.GetName]"
 ep2_wedding_ewan.0051.j: "„A tvrdíš, že na tom nemůžeme prodělat? Vůbec?“"
 ep2_wedding_ewan.0051.k: "„#EMP Skriptorium#!, povídáš...“"
 ep2_wedding_ewan.0051.l: "„Takže #EMP veřejné cvičiště#!... Zajímavé.“"
 ep2_wedding_ewan.0051.business_venture.tt: "Než se tvá podnikatelská investice zúročí, pravděpodobně uplyne mnoho let"
 ep2_wedding_ewan.0051.m: "„To je... nesmírně zajímavé...“"
 ep2_wedding_ewan.0051.m.tt.success: "Dokážeš vzbudit dojem opravdového zaujetí"
 ep2_wedding_ewan.0051.m.tt.failure: "Působíš zdvořile, ale nijak zvlášť nadšeně"
 ep2_wedding_ewan.0051.n: "Zatnout zuby a nějak to přetrpět."
 ep2_wedding_ewan.0051.n.tt: "Vyslechneš každé. Jediné. Slovo."
 ep2_wedding_ewan.0052.t: "Staré účty: V černých číslech"
 ep2_wedding_ewan.0052.desc.intro: "Před mnoha lety jsem [Select_CString(ROOT.Char.IsFemale,'souhlasila','souhlasil')], že vložím peníze do podnikatelského záměru, s nímž za mnou [Select_CString(dolt.IsFemale,'přišla','přišel')] [dolt.GetFirstNameNoTooltip]. Popravdě jsem už na celou tu záležitost téměř [Select_CString(ROOT.Char.IsFemale,'zapomněla','zapomněl')] – "
 ep2_wedding_ewan.0052.desc.dolt_availability.dead: "zvlášť když [dolt.GetFirstNameNoTooltip] už dávno není mezi živými."
 ep2_wedding_ewan.0052.desc.dolt_availability.imprisoned: "tím spíš, že [dolt.GetFirstNameNoTooltip] teď sotva může spravovat jakýkoli podnik."
 ep2_wedding_ewan.0052.desc.dolt_availability.free: "vždyť [dolt.GetFirstNameNoTooltip] se od chvíle, kdy jsem [Select_CString(ROOT.Char.IsFemale,'poskytla','poskytl')] počáteční vklad, už téměř [Select_CString(dolt.IsFemale,'neozvala','neozval')]."
 ep2_wedding_ewan.0052.desc.midtro: "\n\nNavzdory všem očekáváním však dnes ráno dorazil dopis se zprávou o nečekaném úspěchu našeho společného podniku. "
 ep2_wedding_ewan.0052.desc.drunkard: "Z malé venkovské hospůdky vyrostl prosperující hostinec, kam se lidé sjíždějí ze širokého okolí."
 ep2_wedding_ewan.0052.desc.hashishiyah: "Z původně nevýznamného hašišového doupěte se stal kvetoucí ráj lenošení a sladkého zapomnění."
 ep2_wedding_ewan.0052.desc.rakish: "Z nenápadného nevěstince vyrostl vyhlášený dům rozkoše, jehož pokojíky se jen hemží milovníky tělesných potěšení."
 ep2_wedding_ewan.0052.desc.reclusive: "Odlehlé sídlo si mezitím paradoxně vydobylo tichou proslulost. Dokonce i ti nejvýznamnější šlechtici v něm dokážou na čas zmizet před zraky světa."
 ep2_wedding_ewan.0052.desc.flagellant: "Z pole plného kůlů k bičování se stalo rozsáhlé panství zasvěcené očistné a povznášející bolesti. A co je ještě podivnější, těší se překvapivě široké oblibě."
 ep2_wedding_ewan.0052.desc.profligate: "Ani tenhle dopis mi #EMP stále#! nedokáže vysvětlit, v čem náš podnik vlastně #EMP spočívá#!. Podstatné ovšem je, že zřejmě vynáší peníze."
 ep2_wedding_ewan.0052.desc.journaller: "Skriptorium se rozrostlo natolik, že dnes pravidelně přijímá zakázky od bohatých mecenášů."
 ep2_wedding_ewan.0052.desc.athletic: "Veřejné cvičiště si získalo mimořádnou oblibu mezi nižší šlechtou, potulnými rytíři i zámožnými... #EMP pocestnými#!. Všichni tu mohou cvičit a poměřovat své síly, aniž by potřebovali vlastní panství."
 ep2_wedding_ewan.0052.desc.outro: "\n\nNaše investované stříbro tedy přineslo zdravý výnos. [dolt.GetFirstNameNoTooltip|U] poctivě [Select_CString(dolt.IsFemale,'vyplatila','vyplatil')] můj podíl ze zisku."
 ep2_wedding_ewan.0052.desc.outro.dolt_unavailable: "\n\nNaše investované stříbro tedy přineslo zdravý výnos. Správce, který na celý podnik dohlíží, mi poctivě vyplatil můj podíl ze zisku."
 ep2_wedding_ewan.0052.a: "Myslím, že si teď vezmu zpět #EMP celou#! svou investici."
 ep2_wedding_ewan.0052.b: "Samozřejmě. Vždyť jsem obchodní génius."
 ep2_wedding_ewan.0052.c: "Takové příjemné překvapení jsem opravdu [Select_CString(ROOT.Char.IsFemale,'nečekala','nečekal')]!"
 ep2_wedding_ewan.0053.t: "Staré účty: V červených číslech"
 ep2_wedding_ewan.0053.desc.intro: "$ep2_wedding_ewan.0052.desc.intro$"
 ep2_wedding_ewan.0053.desc.dolt_availability.dead: "$ep2_wedding_ewan.0052.desc.dolt_availability.dead$"
 ep2_wedding_ewan.0053.desc.dolt_availability.imprisoned: "$ep2_wedding_ewan.0052.desc.dolt_availability.imprisoned$"
 ep2_wedding_ewan.0053.desc.dolt_availability.free: "$ep2_wedding_ewan.0052.desc.dolt_availability.free$"
 ep2_wedding_ewan.0053.desc.midtro: "\n\nDnes ráno mi však k mému překvapení dorazil anonymní dopis. Dozvídám se z něj, že náš společný podnik definitivně zanikl při tragickém požáru. "
 ep2_wedding_ewan.0053.desc.drunkard: "Zdá se, že pověst hospody se stále zhoršovala, až v ní zůstala jen ta nejpochybnější společnost. Nakonec někomu z místních došla trpělivost a rozhodl se vzít spravedlnost do vlastních rukou."
 ep2_wedding_ewan.0053.desc.hashishiyah: "Hašišové doupě nedokázalo přilákat nové zákazníky. Nakonec lehlo popelem, když někdo převrhl olejovou lampu a dobrých několik minut si toho vůbec nikdo nevšiml."
 ep2_wedding_ewan.0053.desc.rakish: "Nevěstinci se zpočátku vedlo docela dobře, dokud jeho osazenstvo nepostihla nová, děsivě nakažlivá pohlavní choroba. Oheň byl nakonec jediným prostředkem, jak celé místo očistit."
 ep2_wedding_ewan.0053.desc.reclusive: "Odlehlé sídlo nevzbudilo téměř žádný zájem a jeho přesná poloha nakonec upadla v zapomnění. Ironií osudu byly jeho trosky znovu objeveny teprve tehdy, když je náhodou podpálila skupina lapků, která se tam usadila."
 ep2_wedding_ewan.0053.desc.flagellant: "Předpokládaný zájem o duchovní očištění skrze bolest se nikdy nedostavil. Z pole plného kůlů k bičování se tak nakonec stala jen zásobárna levného palivového dříví. Inu, když člověk potřebuje hříšníky, jako by se po nich zem slehla."
 ep2_wedding_ewan.0053.desc.profligate: "Co přesně shořelo, kde se to nacházelo a jak se to vlastně stalo, zůstává stejně záhadné jako původní podnikatelský plán. Jisté je pouze to, že po celém podniku nezbylo nic než kouř, popel a spousta nezodpovězených otázek."
 ep2_wedding_ewan.0053.desc.journaller: "Přes nabízenou štědrou odměnu se nepodařilo najít dostatek vzdělaných a zručných opisovačů ochotných probírat se sebranými deníky [dolt.Custom('CZ_FirstNameNoTooltip_G')]. Skriptorium tak vlastně nikdy pořádně nevzniklo."
 ep2_wedding_ewan.0053.desc.athletic: "Zdá se, že lidé toužící po zlepšení tělesné zdatnosti se také velice rádi pouštějí do soubojů s ostatními cvičenci. Po sérii střetů, které skončily vraždami, vypukly na cvičišti nepokoje. Rozvášněný dav nakonec celou budovu srovnal se zemí."
 ep2_wedding_ewan.0053.desc.outro: "\n\nMělo mi být jasné, že svěřit peníze [Select_CString(dolt.IsFemale,'takové zatracené hlupačce','takovému zatracenému hlupákovi')], jako je [dolt.GetFirstNameNoTooltip], nemůže dopadnout dobře."
 ep2_wedding_ewan.0053.a.alive: "Grrr! Chci toho pitomce vidět v okovech!"
 ep2_wedding_ewan.0053.a.dead: "Škoda, že už je po smrti. Tak [Select_CString(ROOT.Char.IsFemale,'ráda','rád')] bych [Select_CString(dolt.IsFemale,'ji','ho')] vlastnoručně [Select_CString(ROOT.Char.IsFemale,'uškrtila','uškrtil')]!"
 ep2_wedding_ewan.0053.b: "Vlastně jsem něco takového [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] očekávat."
 ep2_wedding_ewan.0061.t: "„[oldling.Custom2('CZ_RelationToMeShort_V', relative)|U], mé zlato!“"
 ep2_wedding_ewan.0061.desc.intro: "Navzdory všemu svatebnímu veselí se na tváři [relative.Custom('CZ_TitledFirstName_G')] náhle objeví výraz naprosté, ničím nezastírané hrůzy. Příčinou je [relative.Custom2('RelationToMeShort', oldling)|l], [oldling.GetTitledFirstName], [Select_CString(oldling.IsFemale,'která se právě s roztřesenýma rukama zvedá','který se právě s roztřesenýma rukama zvedá')] ze svého místa, pohár pevně sevřený v ruce.\n\n"
 ep2_wedding_ewan.0061.desc.arrogant: "[oldling.GetFirstNameNoTooltip|U] je [Select_CString(oldling.IsFemale,'proslulá chvástalka','proslulý chvastoun')], a tak nepřekvapí, když spustí nekonečný proslov o své nezastupitelné úloze při výchově dnešní [Select_CString(relative.IsFemale,'nevěsty','ženicha')]. Nechybějí trapné historky z dětství, nemístné žerty ani příležitosti připomenout všem, jak nesmírně důležitou roli v tom všem [oldling.GetFirstNameNoTooltip] [Select_CString(oldling.IsFemale,'sehrála','sehrál')]."
 ep2_wedding_ewan.0061.desc.honest: "Za normálních okolností by si každý [oldling.Custom('CZ_FirstNameNoTooltip_G')] proslulou upřímnost pochvaloval. Tentokrát se však tato ctnost ukáže jako poněkud nešťastná. Dobrosrdečná stará [Select_CString(oldling.IsFemale,'paní','osoba')] se s nostalgickým úsměvem pouští do vyprávění těch nejtrapnějších historek z dětství [Select_CString(relative.IsFemale,'dnešní nevěsty','dnešního ženicha')]."
 ep2_wedding_ewan.0061.desc.deceitful: "[oldling.GetFirstNameNoTooltip|U] [Select_CString(oldling.IsFemale,'vždycky ráda trochu přeháněla','vždycky rád trochu přeháněl')], ale dnešní vyprávění o dětství [relative.Custom('CZ_FirstNameNoTooltip_G')] je i na [Select_CString(oldling.IsFemale,'její','jeho')] poměry #EMP skandálně#! vzdálené pravdě. Zvláště historka s oslem se mi zdá naprosto zbytečná. Ostatně pochybuji, že se vůbec něco takového stalo."
 ep2_wedding_ewan.0061.desc.gregarious: "V mládí [oldling.GetFirstNameNoTooltip] [Select_CString(oldling.IsFemale,'nevynechala','nevynechal')] snad jedinou oslavu. Dnešní proslov je proto téměř bezednou studnicí vzájemně propletených, nekonečně odbočujících historek. Jen ty nejtrapnější z nich mají vůbec nějakou souvislost s dnešní [Select_CString(relative.IsFemale,'nevěstou','ženichem')]."
 ep2_wedding_ewan.0061.desc.ambitious: "[oldling.GetFirstNameNoTooltip|U] [Select_CString(oldling.IsFemale,'byla vždy známá','byl vždy známý')] svou ctižádostí a neúnavnou snahou prosadit se. A tak si ani dnes nenechá ujít příležitost připsat si značnou část zásluh za výchovu dnešní [Select_CString(relative.IsFemale,'nevěsty','ženicha')]. Podle všeho právě díky [Select_CString(oldling.IsFemale,'jejímu','jeho')] vedení dokázalo ono nešikovné, uhrovité dítě vyrůst v tak znamenitou osobnost."
 ep2_wedding_ewan.0061.desc.diplomat: "[oldling.GetFirstNameNoTooltip|U] [Select_CString(oldling.IsFemale,'proslula','proslul')] svým vytříbeným řečnickým uměním, a tak zjevně nedokáže odolat příležitosti převyprávět celý život [Select_CString(relative.IsFemale,'dnešní nevěsty','dnešního ženicha')]. Zvláštní pozornost věnuje nesčetným životním lekcím, které se [relative.Custom('CZ_FirstNameNoTooltip_D')] [Select_CString(oldling.IsFemale,'pokoušela','pokoušel')] vštípit. Podle vlastních slov ovšem většinou marně."
 ep2_wedding_ewan.0061.desc.poet: "Pro všechny přítomné nastává osud snad horší než smrt. [oldling.GetFirstNameNoTooltip|U] totiž [Select_CString(oldling.IsFemale,'sama sepsala','sám sepsal')] dlouhou, nesmírně kostrbatou báseň věnovanou těm nejroztomileji trapným okamžikům z dětství dnešní [Select_CString(relative.IsFemale,'nevěsty','ženicha')]. A teď se ji chystá přednést celou."
 ep2_wedding_ewan.0061.desc.sadistic: "Ve výrazu [oldling.Custom('CZ_FirstNameNoTooltip_G')] se zračí snad jen čirá zlomyslnost. [oldling.GetFirstNameNoTooltip|U] se totiž s patrným potěšením pouští do #EMP bolestně#! podrobného vyprávění o dětství dnešní [Select_CString(relative.IsFemale,'nevěsty','ženicha')]. Osobních historek je bezpočet a žádná není ani trochu milosrdná."
 ep2_wedding_ewan.0061.desc.drunkard: "[oldling.GetFirstNameNoTooltip|U] se potácí na místě a s jazykem ztěžklým vínem začíná vyprávět své poněkud mlhavé vzpomínky na dětství dnešní [Select_CString(relative.IsFemale,'nevěsty','ženicha')]. Při napodobování jednotlivých postav se snad až příliš rozvášní, ale proslovu to rozhodně dodává na živosti."
 ep2_wedding_ewan.0061.desc.hashishiyah: "[oldling.GetFirstNameNoTooltip|U] na okamžik zůstane rozpačitě stát. Začervenalé oči několikrát zamrkají a zdá se, že se úplně vytratila vzpomínka na důvod, proč bylo vůbec potřeba vstávat. Pak ale cosi zapadne na své místo a začne vyprávění o dětství dnešní [Select_CString(relative.IsFemale,'nevěsty','ženicha')]. Nejméně polovinu proslovu tvoří nezadržitelné chichotání."
 ep2_wedding_ewan.0061.desc.skill.diplomacy: "[oldling.GetFirstNameNoTooltip|U] [Select_CString(oldling.IsFemale,'vždycky uměla','vždycky uměl')] zacházet se slovy a na tuto příležitost se očividně dlouho [Select_CString(oldling.IsFemale,'těšila','těšil')]. Proslov se záhy promění v důmyslnou metaforu celého života dnešní [Select_CString(relative.IsFemale,'nevěsty','ženicha')]. Jenže za všemi těmi květnatými obraty se skrývá poněkud blahosklonný, a místy dokonce urážlivý tón."
 ep2_wedding_ewan.0061.desc.skill.learning: "[oldling.GetFirstNameNoTooltip|U] je mimořádně [Select_CString(oldling.IsFemale,'vzdělaná','vzdělaný')], což se na proslovu rozhodně nezapře. Jeden učený literární odkaz střídá druhý, mezi nimi se vrší složité filozofické žerty a jen občas přijde řeč na nějakou obzvlášť trapnou historku z dětství dnešní [Select_CString(relative.IsFemale,'nevěsty','ženicha')]."
 ep2_wedding_ewan.0061.desc.old: "Na svůj věk už [oldling.GetFirstNameNoTooltip] není zrovna nejčilejší, ale to [Select_CString(oldling.IsFemale,'jí','mu')] nijak nebrání v dlouhém, rozvláčném proslovu. Střídají se v něm ty nejrozpačitější vzpomínky na dětství [Select_CString(relative.IsFemale,'dnešní nevěsty','dnešního ženicha')] a nekonečné nářky nad tím, jak bývalo za starých časů všechno #EMP mnohem lepší#!."
 ep2_wedding_ewan.0061.desc.very_old: "[oldling.GetFirstNameNoTooltip|U] je už skutečně [Select_CString(oldling.IsFemale,'velmi stará','velmi starý')]. Za ta dlouhá léta se nastřádala přímo #EMP armáda#! historek o dnešní [Select_CString(relative.IsFemale,'nevěstě','ženichovi')]. A právě teď se všechny vydávají do útoku. Vyprávění nemá žádnou souvislou nit, jen nekonečný proud vzpomínek z dětství a rodinných vtípků, kterým většina hostů vůbec nerozumí."
 ep2_wedding_ewan.0061.desc.outro: "\n\n[relative.GetFirstNameNoTooltip|U] se tváří, jako by se nejraději [Select_CString(relative.IsFemale,'propadla','propadl')] do země."
 ep2_wedding_ewan.0061.a: "„Děkuji ti, [oldling.Custom('CZ_FirstNameNoTooltip_V')], za ten #EMP nádherný#! proslov...“"
 ep2_wedding_ewan.0061.b: "Začít zdvořile tleskat a přimět tak [oldling.Custom('CZ_FirstNameNoTooltip_A')] skončit."
 ep2_wedding_ewan.0061.b.tt.success: "Podaří se ti přimět [oldling.Custom('CZ_FirstNameNoTooltip_A')] k usednutí"
 ep2_wedding_ewan.0061.b.tt.failure: "[oldling.GetFirstNameNoTooltip|U] pokračuje bez nejmenšího zaváhání"
 ep2_wedding_ewan.0061.c: "Usmívat se a nějak to přetrpět."
 ep2_wedding_ewan.0061.d: "Nadšeně povzbuzovat a dožadovat se dalších historek."
 ep2_wedding_ewan.0061.d.tt.crit_success: "[oldling.GetFirstNameNoTooltip|U] se pouští do #EMP pořádně dlouhého#! příběhu"
 ep2_wedding_ewan.0061.d.tt.success: "[oldling.GetFirstNameNoTooltip|U] získává novou chuť do vyprávění"
 ep2_wedding_ewan.0061.e: "Pobídnout [oldling.Custom('CZ_FirstNameNoTooltip_A')], aby [Select_CString(oldling.IsFemale,'pokračovala','pokračoval')]."
 ep2_wedding_ewan.0061.e.tt.crit_success: "$ep2_wedding_ewan.0061.d.tt.crit_success$"
 ep2_wedding_ewan.0061.e.tt.success: "$ep2_wedding_ewan.0061.d.tt.success$"
 ep2_wedding_ewan.0061.e.tt.failure: "[oldling.GetFirstNameNoTooltip|U] ještě několik minut pokračuje ve svém blábolení"
