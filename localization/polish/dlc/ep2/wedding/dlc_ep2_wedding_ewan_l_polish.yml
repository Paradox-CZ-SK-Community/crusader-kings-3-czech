 ep2_wedding_ewan.0071.t: "Přísaha ve slavnostní chvíli"
 ep2_wedding_ewan.0071.desc: "„[ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')|U],“ zamyslí se [liege.GetTitledFirstName], [Select_CString(liege.IsFemale,'má lenní paní','můj lenní pán')]. „Vždycky jsem tě [Select_CString(liege.IsFemale,'měla','měl')] docela v oblibě. Ze všech sil se snažíš získat si mou přízeň a tvůj věhlas se rozprostírá napříč [liege.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_I')] jako koruna košatého stromu, pod jehož větvemi nacházejí lidé stín.“\n\nPřikyvuji a předpokládám, že slavnostní veselí už [Select_CString(liege.IsFemale,'mou lenní paní poněkud rozjařilo','mého lenního pána poněkud rozjařilo')]. Proslov totiž pokračuje dál a dál.\n\n„Mám pro tebe návrh. Tobě záleží na mé přízni a mně zase prospívá, když je mé jméno spojováno s tvým. Co kdybys mezi svými obdivovateli [Select_CString(ROOT.Char.IsFemale,'šířila','šířil')] dobré slovo o mně? Na oplátku dám veřejně najevo, že se těšíš mé zvláštní přízni.“"
 ep2_wedding_ewan.0071.a: "To mi připadá jako více než spravedlivá dohoda!"
 ep2_wedding_ewan.0071.b: "Děkuji za nabídku, ale musím odmítnout."
