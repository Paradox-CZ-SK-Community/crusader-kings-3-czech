 activity_wedding_guest_desc: "$BULLET_WITH_TAB$Zisk [Concept('prestige_i','@prestige_icon!')|E][Concept('prestige','prestiž')|E]\n$BULLET_WITH_TAB$Hostitel a snoubenci [Concept('opinion','mínění')|E]\n$BULLET_WITH_TAB$Může ztratit [stress_loss_i][Concept('stress','stres')|E]\n$BULLET_WITH_TAB$Může získat [GetModifier( 'wedding_of_the_century_modifier' ).GetNameWithTooltip|L]\n$BULLET_WITH_TAB$Může získat [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )] [Concept('trait_level_track_xp','zkušenosti rysu')|E]" # todo: CONCEPT CASE
 activity_wedding_guest_help_text: "\nHosté se účastní oslav a jsou připraveni být ohromeni velkolepostí události a snoubenci i hostitelem!\nSvatby jsou společenské a politické události, plné příležitostí k pohoštění i navazování důležitých kontaktů s hosty."
 wedding_phase_ceremony: "Svatební obřad"
 wedding_phase_ceremony_desc: "Všechny rituály a přípravy, které vedou k výměně slibů, jež manželství stvrzují."
 wedding_phase_banquet: "Svatební hostina"
 wedding_phase_banquet_desc: "Hostina k oslavě nového svazku: jídlo, pití a zábava v hojnosti."
 wedding_phase_wnight: "Svatební noc"
 wedding_phase_wnight_desc: "Zatímco snoubenci dovršují manželství, ostatní hosté si užívají doznívající oslavy."
 wedding_type_normal: "Velkolepá svatba"
 wedding_type_normal_desc: "\n#weak Svatba má být velkolepou oslavou spojení dvou snoubenců, ale také dvou rodin.#!\n\n@warning_icon! #X Slibovaná [GetActivityType('activity_wedding').GetName] musí být uspořádána dříve, než slib vyprší, jinak utrpíte postihy#!"
 wedding_type_bloody: "Krvavá svatba"
 wedding_type_bloody_desc: "Zabijete druhou rodinu.\n#weak Neorganizujete svatbu, plánujete pohřeb.#!\n\n@warning_icon! #X Nebudete moci pořádat Krvavou [GetActivityType('activity_wedding').GetName] po dobu 15 let#!\n@warning_icon! #X Zacílení na vašeho [Concept('liege','lenního pána')|E] nebo [Concept('head_of_faith','hlava víry')|E] povede k větším postihům#!\n\n@alert_icon! #alert_trial Postavy s [GetTrait('just').GetName( GetNullCharacter )], [GetTrait('compassionate').GetName( GetNullCharacter )] a [GetTrait('calm').GetName( GetNullCharacter )] rysy získají [Concept('stress','stres')|E]#!" # todo: CONCEPT CASE
