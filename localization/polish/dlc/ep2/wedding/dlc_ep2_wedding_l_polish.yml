 every_cruel_vassal: "Každý krutý vazal"
 wedding_every_other_vassal: "Každý další vazal"
 activity_wedding_guest_desc: "$BULLET_WITH_TAB$[prestige_i|E][Concept('prestige','Prestiž')|EU]\n$BULLET_WITH_TAB$[Concept('opinion','Mínění')|EU] hostitele a novomanželů\n$BULLET_WITH_TAB$Možnost snížit [stress_loss_i][Concept('stress','stres')|E]\n$BULLET_WITH_TAB$Možnost získat [GetModifier( 'wedding_of_the_century_modifier' ).GetNameWithTooltip|L]\n$BULLET_WITH_TAB$Možnost získat [Concept('trait_level_track_xp','zkušenosti rysu')|E] [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )]"
 activity_wedding_guest_help_text: "\nSvatební hosté se účastní slavnosti a očekávají, že je ohromí její nádhera i velkolepost a že na ně novomanželé s hostitelem udělají patřičný dojem!\nSvatby jsou významnými společenskými a politickými událostmi, při nichž se nabízí spousta příležitostí k rozhovorům, navazování známostí i vytváření cenných vztahů s ostatními hosty."
 wedding_phase_ceremony: "Svatební obřad"
 wedding_phase_ceremony_desc: "Veškeré rituály a přípravy, které vyvrcholí výměnou manželských slibů a oficiálním uzavřením sňatku."
 wedding_phase_banquet: "Svatební hostina"
 wedding_phase_banquet_desc: "Hostina na oslavu nového manželského svazku. Jídla, pití a nejrůznější zábavy tu bude více než dost."
 wedding_phase_wnight: "Svatební noc"
 wedding_phase_wnight_desc: "Zatímco novomanželé naplňují své manželství, zbývající hosté si užívají poslední chvíle doznívající slavnosti."
 wedding_type_normal: "Velkolepá svatba"
 wedding_type_normal_desc: "\n#weak Svatba má být velkolepou oslavou spojení nejen dvou manželů, ale také dvou rodin.#!\n\n@warning_icon! #X Přislíbenou aktivitu [GetActivityType('activity_wedding').GetName] musíš uspořádat před vypršením slibu, jinak tě čekají postihy#!"
 wedding_type_bloody: "Krvavá svatba"
 wedding_type_bloody_desc: "Zavraždíš členy druhé rodiny.\n#weak Neplánuješ svatbu, ale pohřeb.#!\n\n@warning_icon! #X Po dobu 15 let nebudeš moci uspořádat další krvavou aktivitu [GetActivityType('activity_wedding').GetName]#!\n@warning_icon! #X Pokud bude tvým cílem [Concept('liege','lenní pán')|E] nebo [Concept('head_of_faith','hlava víry')|E], postihy budou vyšší#!\n\n@alert_icon! #alert_trial Postavy s rysy [GetTrait('just').GetName( GetNullCharacter )], [GetTrait('compassionate').GetName( GetNullCharacter )] a [GetTrait('calm').GetName( GetNullCharacter )] získají [Concept('stress','stres')|E]#!"
 wedding_option_entertainment: "Zábava"
 wedding_entertainment_bad: "Dvorní zábava"
 wedding_entertainment_bad_desc: "$EFFECT_LIST_BULLET$ Nižší zisk [Concept('prestige','prestiže')|E]\n\n#weak O zábavu na svatbě se postarají běžní dvorští umělci, jako jsou šašci a kejklíři, kteří u dvora vystupují každý den.#!"
 wedding_entertainment_normal: "Akrobaté a hudebníci"
 wedding_entertainment_normal_desc: "$wedding_normal_option_desc$\n$EFFECT_LIST_BULLET$ Průměrný zisk [Concept('prestige','prestiže')|E]\n\n#weak Osvědčení umělci, kteří nesmějí chybět u žádného váženého dvora.#!"
 wedding_entertainment_good: "Trubadúři a cizokrajní tvorové"
 wedding_entertainment_good_desc: "$EFFECT_LIST_BULLET$ [Concept('trait_level_track_xp','Zkušenosti rysu')|EU] [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )]\n$wedding_good_option_desc$\n$EFFECT_LIST_BULLET$ Vyšší zisk [Concept('prestige','prestiže')|E]\n\n#weak Jen ti nejlepší umělci a nejvzácnější tvorové z dalekých krajů!#!"
 wedding_option_food: "Jídlo a pití"
 wedding_food_bad: "Skromná hostina"
 wedding_food_bad_desc: "$EFFECT_LIST_BULLET$ Nižší zisk [Concept('opinion','mínění')|E] u všech účastníků\n\n#weak Hostina, která splní očekávání, ale v paměti hostů po ní mnoho nezůstane.#!"
 wedding_food_normal: "Štědrá hostina"
 wedding_food_normal_desc: "$wedding_normal_option_desc$\n$EFFECT_LIST_BULLET$ Průměrný zisk [Concept('opinion','mínění')|E] u všech účastníků\n\n#weak Bohatá hostina, při níž si každý z hostů přijde na své.#!"
 wedding_food_good: "Opulentní hody"
 wedding_food_good_desc: "$EFFECT_LIST_BULLET$ Bonus k úbytku [Concept('stress','stresu')|E]\n$EFFECT_LIST_BULLET$ Vyšší bonusy ke [Concept('health','zdraví')|E]\n$wedding_good_option_desc$\n$EFFECT_LIST_BULLET$ Vyšší zisk [Concept('opinion','mínění')|E] u všech účastníků\n\n#weak Stoly budou pod tíhou všech těch lahůdek doslova praskat!#!"
 wedding_option_decoration: "Místo konání svatby"
 wedding_decoration_bad: "Luční kvítí"
 wedding_decoration_bad_desc: "$EFFECT_LIST_BULLET$ Zisk [Concept('trait_level_track_xp','zkušeností rysu')|E] [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ Nižší zisk [Concept('opinion','mínění')|E] u tvých [Concept('vassals','vazalů')|E] s postojem [GetVassalStance( 'courtly' ).GetName]\n\n#weak Půvabná výzdoba z čerstvě natrhaných květin a skromný počet kuchařů a sloužících.#!"
 wedding_decoration_normal: "Girlandy a pochodně"
 wedding_decoration_normal_desc: "$wedding_normal_option_desc$\n$EFFECT_LIST_BULLET$ Průměrný zisk [Concept('opinion','mínění')|E] u tvých [Concept('vassals','vazalů')|E] s postojem [GetVassalStance( 'courtly' ).GetName]\n$EFFECT_LIST_BULLET$ Získáš [GetModifier( 'gwedding_gracious_host_modifier' ).GetNameWithTooltip|L]\n\n#weak Tradiční výzdoba a dostatek služebnictva, aby žádný pohár nezůstal prázdný.#!"
 wedding_decoration_good: "Stříbro a zlato"
 wedding_decoration_good_desc: "$EFFECT_LIST_BULLET$ Vyšší zisk [Concept('opinion','mínění')|E] u tvých [Concept('vassals','vazalů')|E] s postojem [GetVassalStance( 'courtly' ).GetName]\n$EFFECT_LIST_BULLET$ [Concept('dynasty_prestige','Věhlas')|EU] a [Concept('prestige','prestiž')|E]\n$wedding_good_option_desc$\n$EFFECT_LIST_BULLET$ Získáš [GetModifier( 'gwedding_magnificent_host_modifier' ).GetNameWithTooltip|L]\n\n#weak Okázalá přehlídka zdánlivě nevyčerpatelného bohatství a tolik služebnictva, že každý host může mít vlastního číšníka!#!"
 wedding_good_option_desc: "$EFFECT_LIST_BULLET$ [Concept('vassals','Vazalům')|EU] s postoji [GetVassalStance( 'glory_hound' ).GetName] a [GetVassalStance( 'courtly' ).GetName] se výrazněji zvýší [Concept('opinion','mínění')|E] o tobě"
 wedding_normal_option_desc: "$EFFECT_LIST_BULLET$ [Concept('vassals','Vazalům')|EU] s postoji [GetVassalStance( 'parochial' ).GetName] a [GetVassalStance( 'zealot' ).GetName] se výrazněji zvýší [Concept('opinion','mínění')|E] o tobě"
 diplomatic_intent: "Diplomacie"
 diplomatic_intent_desc: "Uzavři spojenectví s vybranou postavou, nebo ji svým vystupováním ohrom natolik, že se podvolí tvé vůli."
 matchmaking_intent: "Dohazování"
 matchmaking_intent_desc: "Najdi vybrané postavě vhodného partnera a sjednej zasnoubení."
 banquet_mischief_intent: "Neplechy"
 banquet_mischief_intent_desc: "Rozpoutej trochu zmatku a dosáhni většího úbytku [Concept('stress','stresu')|E]. Počítej však i s možnými #EMP nepříjemnými#! následky."
