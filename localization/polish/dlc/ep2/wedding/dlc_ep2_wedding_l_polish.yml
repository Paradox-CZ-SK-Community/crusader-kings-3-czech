l_polish:
 activity_wedding: "Velkolepá svatba"
 activity_wedding_selection_tooltip: "Uspořádej aktivitu [GetActivityType('activity_wedding').GetName] – velkolepou oslavu spojení dvou lidí v manželství.\n\nOčekávané odměny:\n$BULLET_WITH_TAB$[prestige_i] [Concept('prestige','Prestiž')|EU]\n$BULLET_WITH_TAB$[opinion_i] [Concept('opinion','Mínění')|EU]\n$BULLET_WITH_TAB$[stress_loss_i] Úbytek [Concept('stress','stresu')|E]"
 activity_wedding_desc: "Velkolepá oslava spojení dvou lidí v manželský svazek.\n\nNejde však jen o samotný svatební obřad. Je to také veřejná přehlídka vlivu a společenská událost, na níž se schází šlechta, aby se věnovala umění diplomacie, svádění a vraždění – nebo si jednoduše připila s přáteli!"
 activity_wedding_host_desc: "$BULLET_WITH_TAB$Vybraní [Concept('spouses','choti')|E] budou [Concept('married','sezdáni')|E]\n$BULLET_WITH_TAB$[prestige_i|E] [Concept('prestige','Prestiž')|EU]\n$BULLET_WITH_TAB$[legitimacy_i] [Concept('legitimacy','Legitimita')|EU]\n$BULLET_WITH_TAB$[Concept('opinion','Mínění')|EU] hostů\n$BULLET_WITH_TAB$[GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName] [Concept('vassals','vazalové')|E]: [Concept('opinion','mínění')|E]\n$BULLET_WITH_TAB$Možnost získat [Concept('trait_level_track_xp','zkušenosti rysu')|E] [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$Možnost snížit [stress_loss_i][Concept('stress','stres')|E]\n$BULLET_WITH_TAB$Možnost získat [GetModifier( 'gwedding_magnificent_host_modifier' ).GetNameWithTooltip|L]\n$BULLET_WITH_TAB$Možnost získat [GetModifier( 'gwedding_gracious_host_modifier' ).GetNameWithTooltip|L]"
 wedding_need_to_promise: "Nejdříve musíš [Concept('grand_wedding_promised','přislíbit')|E] uspořádání aktivity [GetActivityType( 'activity_wedding' ).GetName]!"
 ep2_wedding_promise_invalid_toast: "[spouse_1.GetShortUINameNoTooltip|U] a [spouse_2.GetShortUINameNoTooltip] již nemohou uzavřít sňatek. Jejich [Concept('betrothal','zasnoubení')|E] s [Concept('grand_wedding_promised','příslibem velkolepé svatby')|E] se ruší."
 ep2_wedding_promise_lapsed_toast: "[spouse_1.GetShortUINameNoTooltip|U] a [spouse_2.GetShortUINameNoTooltip] se nemohou zúčastnit aktivity [GetActivityType( 'activity_wedding' ).GetName]. Jejich [Concept('betrothal','zasnoubení')|E] s [Concept('grand_wedding_promised','příslibem velkolepé svatby')|E] pozbývá platnosti."
 wedding_need_to_be_valid: "Obě zasnoubené postavy musí být dospělé a připravené uzavřít sňatek"
 activity_wedding_conclusion_characters_header: "Novomanželé"
 spouse_1: "Choť"
 spouse_2: "$spouse_1$"
 spouse_1_for_host: "$spouse_1$"
 spouse_2_for_host: "$spouse_2$"
 spouse_1_desc: "Aktivita [GetActivityType( 'activity_wedding' ).GetName] oslavuje spojení dvou [Concept('spouses','chotí')|E] v manželství. Novomanželé jsou ústřední součástí celé slavnosti, kterou lze uspořádat pouze tehdy, pokud byla dvojici již při [Concept('betrothal','zasnoubení')|E] [Concept('grand_wedding_promised','přislíbena')|E] velkolepá svatba.\n\nOba snoubenci vždy přijmou pozvání na vlastní svatbu a po skončení slavnosti získají zvláštní odměny.\n"
 spouse_2_desc: "$spouse_1_desc$"
 spouse_1_desc_for_host: "$spouse_1_desc$"
 spouse_2_desc_for_host: "$spouse_2_desc$"
 activity_window_character_spouse_1: "[Character.Custom('GetBrideGroom')|U]\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_spouse_2: "[Character.Custom('GetBrideGroom')|U]\n[Character.GetShortUINameNoTooltip|U]"
