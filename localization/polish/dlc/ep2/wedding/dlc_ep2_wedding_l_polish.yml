 spouse_1_desc: "[GetActivityType( 'activity_wedding' ).GetName] oslavuje svazek dvou [spouses|E]. Jsou základní součástí této události, kterou nelze uspořádat, pokud není [GetActivityType( 'activity_wedding' ).GetNameNoTooltip] při [Concept('betrothal','zasnoubení')|E] [Concept('grand_wedding_promised','přislíbena')|E] páru.\n\nManželé vždy přijmou pozvání na svou svatbu a na konci této události získají specifické odměny.\n" # todo: CONCEPT CASE
