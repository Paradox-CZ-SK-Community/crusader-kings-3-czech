l_polish:
 activity_wedding: "Velkolepá svatba"
 activity_wedding_selection_tooltip: "Uspořádejte [GetActivityType('activity_wedding').GetName], velkolepé oslavení spojení páru\n\nOčekávané odměny:\n$BULLET_WITH_TAB$[prestige_i] [Concept('prestige','Prestiž')|E]\n$BULLET_WITH_TAB$[opinion_i] [Concept('opinion','Mínění')|E]\n$BULLET_WITH_TAB$[stress_loss_i] [Concept('stress','Stres')|E] ztráta" # todo: CONCEPT CASE
 activity_wedding_desc: "Velkolepé oslavení spojení páru.\n\nNicméně to není jen svatební obřad; je to veřejná demonstrace vlivu a společenská událost, kde se šlechta schází, aby cvičila umění diplomacie, svádění a vraždy — nebo aby si s přáteli připila!"
 activity_wedding_host_desc: "$BULLET_WITH_TAB$Vybraní [Concept('spouses','choti')|E] se [Concept('married','sezdán')|E]\n$BULLET_WITH_TAB$[Concept('prestige_i','@prestige_icon!')|E] [Concept('prestige','Prestiž')|E]\n$BULLET_WITH_TAB$[legitimacy_i] [Concept('legitimacy','Legitimita')|E]\n$BULLET_WITH_TAB$Názor hostů [Concept('opinion','mínění')|E]\n$BULLET_WITH_TAB$[GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName] [Concept('vassals','Vazalové')|E] [Concept('opinion','Mínění')|E]\n$BULLET_WITH_TAB$Může získat [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )] [Concept('trait_level_track_xp','zkušenosti rysu')|E]\n$BULLET_WITH_TAB$Může ztratit [stress_loss_i][Concept('stress','stres')|E]\n$BULLET_WITH_TAB$Může získat [GetModifier( 'gwedding_magnificent_host_modifier' ).GetNameWithTooltip|L]\n$BULLET_WITH_TAB$Může získat [GetModifier( 'gwedding_gracious_host_modifier' ).GetNameWithTooltip|L]" # todo: CONCEPT CASE
 wedding_need_to_promise: "Musíte mít [Concept('grand_wedding_promised','přislíbena')|E] [GetActivityType( 'activity_wedding' ).GetName] abyste ji mohli uspořádat!" # todo: CONCEPT CASE
