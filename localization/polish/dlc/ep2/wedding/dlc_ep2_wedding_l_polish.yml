 wedding_decoration_good: "Stříbro a zlato"
 wedding_decoration_good_desc: "$EFFECT_LIST_BULLET$ Zvýšený nárůst [Concept('opinion','mínění')|E] u vašich [GetVassalStance( 'courtly' ).GetName] [Concept('vassals','vazalů')|E]\n$EFFECT_LIST_BULLET$ Zisk [Concept('dynasty_prestige','věhlas')|E] a [Concept('prestige','prestiž')|E]\n$wedding_good_option_desc$\n$EFFECT_LIST_BULLET$ Získání [GetModifier( 'gwedding_magnificent_host_modifier' ).GetNameWithTooltip|L]\n\n#weak Neomalená ukázka bezbřehého bohatství a dost služebníků, aby měl každý host svého osobního číšníka.#!" # todo: CONCEPT CASE
