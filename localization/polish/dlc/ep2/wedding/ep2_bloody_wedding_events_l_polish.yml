l_polish:
 ep2_wedding.0101.t: "Dokud nás smrt..."
 ep2_wedding.0101.desc.intro: "Všichni hosté se shromáždili na nádvoří. Je krásný, slunečný den. Pohlédnu na [Select_CString(dummy_gender.IsFemale,'své ženy','své muže')] – stráž, kterou jsem všem přítomným [Select_CString(ROOT.Char.IsFemale,'jako laskavá hostitelka slíbila','jako laskavý hostitel slíbil')]. Je vyzbrojená #EMP až po zuby#!. Už brzy se mé pečlivé přípravy zúročí.\n\nSpatřím, jak [spouse_2.GetTitledFirstName] přichází se svým doprovodem"
 ep2_wedding.0101.desc.spouse: ". Manželství potrvá pouhý jediný den."
 ep2_wedding.0101.desc.bad: ". Tak odpornou přítomnost je třeba jednou provždy odstranit."
 ep2_wedding.0101.desc.good: "... Je mi to líto, [Select_CString(spouse_2.IsFemale,'má drahá','můj drahý')]."
 ep2_wedding.0101.a: "Všichni příslušníci rodu [spouse_2.GetHouse.GetNameNoTooltip] musí být vyhlazeni."
 ep2_wedding.0101.a_lowborn: "Celá ta rodina musí být vyhlazena."
 ep2_wedding.0101.b: "Připravím o život pouze [spouse_2.Custom('CZ_FirstNameNoTooltip_A')]."
 ep2_wedding.0101.c: "Svatební noc... Dokonalá příležitost."
 ep2_wedding.0101.d: "Tohle nedokážu. Ne tady. Ne teď."
 ep2_wedding.0101.a.tt: "Svatba začíná... a vstoupí do dějin"
 ep2_wedding.0101.c.tt: "Důvěrnější způsob řešení"
 ep2_wedding.0101.d.tt: "Svatba začíná a nikomu se nic nestane"
 ep2_wedding.0200.desc.murder: "$ep2_wedding.0200.desc.murder_intro$„Jsem vám za vaši laskavost nesmírně [Select_CString(spouse_2.IsFemale,'vděčná','vděčný')], [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Opravdu mě hřeje u srdce.“"
 ep2_wedding.0200.desc.murder_intro: "Zatímco hosté vstupují do slavnostní síně, trochu se opozdím a zapředu rozhovor s několika přítomnými o [ROOT.Char.Custom('my_subject_of_interest')|l]. „[Select_CString(ROOT.Char.IsFemale,'Jak štědrá hostitelka!','Jak štědrý hostitel!')|U]“ zaslechnu, když se omluvím a zamířím k čestnému stolu. Mé stráže jsou #EMP všude#!. Připravené. Když usednu na své místo, střetne se můj pohled s [spouse_2.Custom('CZ_TitledFirstName_I')]:\n\n"
 ep2_wedding.0200.desc.murder_spouse: "$ep2_wedding.0200.desc.murder_intro$„Brzy zůstaneme jen #EMP my [Select_CString(And(ROOT.Char.IsFemale,spouse_2.IsFemale),'dvě','dva')]#!, [Select_CString(spouse_2.IsFemale,'má drahá','můj drahý')],“ pronesu a pozvednu pohár."
 ep2_wedding.0200.a.murder: "#EMP Jen si pochutnejte!#!"
 ep2_wedding.0202.t.spouse: "...nerozdělí"
 ep2_wedding.0202.t: "...je nerozdělí"
 ep2_wedding.0202.desc.outro: "\n\nZatímco se zakousnu do sladké pochoutky jménem [ROOT.Char.Custom('GetExpensiveDessert')|l], nenápadně dám znamení sluhům. Do síně vcházejí [Select_CString(dummy_gender.IsFemale,'mé ženy převlečené za žoldnéřky','moji muži převlečení za žoldnéře')]. Dveře se uzamknou a hudba se znovu rozezní. Krveprolití může začít."
 ep2_wedding.0202.desc.intro: "Hosté jsou zabráni do tolika rozhovorů, že je téměř nemožné všechny sledovat. [spouse_2.GetTitledFirstName|U] stojí uprostřed hloučku horlivých dvořanů, kteří se navzájem zahrnují lichotkami. Zda je toto rozptýlení pouhou náhodou, nebo dílem osudu, nedokážu říct.\n\n"
 ep2_wedding.0202.desc.compassionate: "Jaká škoda, že to muselo dojít až sem. Nedokážu se na to dívat."
 ep2_wedding.0202.desc.paranoid: "Konečně proti mně mí nepřátelé přestanou kout pikle. Jejich ústa navždy umlknou."
 ep2_wedding.0202.desc.zealous: "Kéž jejich duše naleznou vykoupení, až je pohltí [ROOT.Char.GetFaith.NegativeAfterLife]."
 ep2_wedding.0202.desc.sadistic: "Už se nemohu dočkat, až se kamenná dlažba pod jejich nohama zbarví krví."
 ep2_wedding.0202.desc.craven: "Otřu si pot z čela. #EMP Ehm.#! Hlavu dolů, [ROOT.Char.GetFirstNameNoTooltip]. Hlavně ať nic netuší."
 ep2_wedding.0202.desc.arrogant: "Opřu se pohodlně do křesla a snažím se potlačit úsměv. O tomhle se bude mluvit ještě celá staletí."
 ep2_wedding.0202.desc.lazy: "Ještěže to nemusím udělat osobně. Vraždění mi připadá jako příšerně namáhavá práce."
 ep2_wedding.0202.desc.just: "Já tomu říkám spravedlnost."
 ep2_wedding.0202.desc.cannibal: "Stejně už mi pořádně vyhládlo..."
 ep2_wedding.0202.desc.wrathful: "Ať se jejich hlavy kutálejí po sálech, které tolikrát poskvrnili svými pomluvami!"
 ep2_wedding.0202.desc.fallback: "Bezděčně si začnu pohvizdovat do rytmu."
 ep2_wedding.0202.a: "Rod [spouse_2.GetHouse.GetNameNoTooltip] dnes končí."
 ep2_wedding.0202.a.lowborn: "Vaše rodina dnes končí."
 ep2_wedding.0203.t.spouse: "$ep2_wedding.0202.t.spouse$"
 ep2_wedding.0203.t: "$ep2_wedding.0202.t$"
 ep2_wedding.0203.desc.intro: "Hostina se pomalu chýlí ke konci. Rozhovory utichají a hosté se postupně rozdělují na ty, kteří jsou příliš opilí, a ty, kteří jsou příliš unavení. Ti, jimž zbývá ještě dost střízlivosti – nebo právě naopak opilosti –, se nyní shlukují kolem [spouse_2.Custom('CZ_TitledFirstName_G')]. Naposledy se pokoušejí získat přízeň nového manželského páru.\n\n"
 ep2_wedding.0203.desc.compassionate: "Jen doufám, že to bude rychlé. A bezbolestné."
 ep2_wedding.0203.desc.paranoid: "Teď pozná, zač je toho loket! Teď už to určitě pochopí! A s [Select_CString(spouse_2.IsFemale,'ní','ním')] #EMP všichni#! ostatní!"
 ep2_wedding.0203.desc.zealous: "Jedině tak lze svět zbavit tak zkažené duše."
 ep2_wedding.0203.desc.sadistic: "Přejedu jazykem po ostří nože. Ach, kéž bych to [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] udělat vlastníma rukama..."
 ep2_wedding.0203.desc.cannibal: "Pozorně si prohlížím kůži [spouse_2.Custom('CZ_TitledFirstName_G')]... To bude lahůdka."
 ep2_wedding.0203.desc.craven: "Nemůžu... Nedokážu se dívat. Co když to bude ještě horší, než jsem si [Select_CString(ROOT.Char.IsFemale,'představovala','představoval')]?"
 ep2_wedding.0203.desc.arrogant: "Pohodlně se opřu do křesla a upiji [ROOT.Char.Custom('RegionalDrink')|l]."
 ep2_wedding.0203.desc.just: "Je to nezbytné."
 ep2_wedding.0203.desc.wrathful: "#EMP Pryč s [Select_CString(spouse_2.IsFemale,'její','jeho')] hlavou! Ať už padne!#!"
 ep2_wedding.0203.desc.fallback: ""
 ep2_wedding.0203.desc.outro: "[Select_CString(my_agent.IsFemale,'Jedna z dvořanek','Jeden z dvořanů')|U] se rozesměje o něco hlasitěji, než by se slušelo. O poznání hlasitěji. Vzápětí vytáhne dýku a srdce [spouse_2.Custom('CZ_FirstNameNoTooltip_G')] náhle utichne. A spolu s ním utichnou i všichni hosté.\n\n„Chopte se [Select_CString(my_agent.IsFemale,'jí','ho')]!“ vykřiknu, přestože moc dobře vím, že hned příštího dne bude zase na svobodě."
 ep2_wedding.0203.a: "Jaká tragédie!"
 ep2_wedding.0300.desc.murder_spouse: "Hostina se chýlí ke konci, svíce postupně dohořívají a hosté se odebírají do svých komnat. Když nadejde čas na naši svatební noc, znovu se ozve volání: „Ať si novomanželé pořádně užijí!“\n\nJá už se #EMP opravdu#! nemohu dočkat."
 ep2_wedding.3060.t: "Noc jako stvořená pro smrt"
 ep2_wedding.3060.desc: "Čeká na nás lože přepychově vystlané drahými látkami. Ve světle svící zahlédnu tvář [spouse_2.Custom('CZ_TitledFirstName_G')] a na okamžik zadržím dech. „Pojď si ke mně lehnout, má lásko,“ zazní něžná výzva, zatímco si má drahá polovička svléká košili.\n\nMěsíc září téměř jako denní slunce. Jemně přejedu prsty po hrdle své lásky a pak je políbím. Má ruka spočívá na tom křehkém místě... Stačí jen pevněji sevřít a bude po všem."
 ep2_wedding.3060.a: "„Pojď blíž, má nejdražší...“"
 ep2_wedding.3060.a.success: "Uškrtíš [spouse_2.Custom('CZ_ShortUIName_A')]"
 ep2_wedding.3060.a.failure: "[spouse_2.GetShortUIName|U] [Select_CString(spouse_2.IsLocalPlayer,'unikneš','unikne')] tvému sevření"
 ep2_wedding.3060.b: "Znám byliny, které [Select_CString(spouse_2.IsFemale,'ji','ho')] umlčí mnohem spolehlivěji."
 ep2_wedding.3060.b.success: "Úspěšně otrávíš [spouse_2.Custom('CZ_ShortUIName_A')]"
 ep2_wedding.3060.b.failure: "[spouse_2.GetShortUIName|U] [Select_CString(spouse_2.IsLocalPlayer,'odhalíš','odhalí')] tvé úmysly"
 ep2_wedding.3060.c: "Stačí jediný rychlý pohyb. Pod polštářem mám ukrytou dýku."
 ep2_wedding.3060.c.flavor: "Dovol, abych ti [Select_CString(ROOT.Char.IsFemale,'nakrájela','nakrájel')] trochu ovoce, má lásko!"
 ep2_wedding.3060.c.success: "Podřízneš hrdlo [spouse_2.Custom('CZ_ShortUIName_G')]"
 ep2_wedding.3060.c.failure: "[spouse_2.GetShortUIName|U] [Select_CString(spouse_2.IsLocalPlayer,'pojmeš','pojme')] podezření"
 ep2_wedding.3060.d: "Ne. Tohle nedokážu."
 ep2_wedding.0301.t: "Hořká pachuť"
 ep2_wedding.0301.desc.family: "Po celé síni leží bezvládná těla. Sloužící připravují provizorní márnice a šeptem se dohadují, kdo mohl stát za tím strašlivým krveprolitím. „Slyšel jsem, že měli spoustu nepřátel.“ „A já zase slyšel, že neměli žádné.“"
 ep2_wedding.0301.desc.agent: "Stráže už vraha odvedly, ale zděšení z tváří hostů dosud nezmizelo. Přispěchal dokonce i lékař, snad aby alespoň vzbudil zdání, že lze ještě něco vykonat. Každému je však jasné, že na dýku zabodnutou přímo do srdce žádný lék neexistuje."
 ep2_wedding.0301.desc.wedding_night: "Jen v nočním úboru běžím chodbami směrem k velké síni. Těsně před dveřmi se na okamžik zastavím a nasadím svůj nejzdrcenější výraz. #EMP „Pomoc! Pomoc!“#! vykřiknu. „Vrah pronikl do našich komnat a zavraždil [spouse_2.Custom('CZ_TitledFirstName_A')]!“"
 ep2_wedding.0301.non_spouse: "\n\nSíní se rozléhá zoufalý pláč [spouse_1.Custom('CZ_TitledFirstName_G')]. Ruce pozůstalé osoby pevně svírají ruce [spouse_2.Custom('CZ_FirstNameNoTooltip_G')] a odmítají je pustit."
 ep2_wedding.0301.spouse: "\n\n„Ach, má lásko, jak krutě si s námi osud zahrál!“ naříkám a pevně svírám chladnou ruku své zesnulé polovičky. „Najdu toho, kdo ti to udělal, a #EMP postarám se o jeho konec#!.“"
 ep2_wedding.0301.spouse_wnight: "\n\nVšude zavládne ticho. Mé stráže se rozběhnou směrem k ložnici a já si zabořím tvář do dlaní."
 ep2_wedding.0301.a: "Krutý, ach, jak krutý osud."
 ep2_wedding.0302.t: "Nastává čas smutku"
 ep2_wedding.0302.desc.family: "Můj příjemný rozhovor s několika hosty o [ROOT.Char.Custom('my_subject_of_interest')|l] náhle přeruší hudba. Ohlédnu se za účinkujícími, ale můj pohled se nečekaně střetne s očima někoho jiného. Skupina ozbrojených žoldnéřů právě míří k [spouse_2.Custom('CZ_TitledFirstName_D')] a celé [Select_CString(spouse_2.IsFemale,'její','jeho')] rodině.\n\nZ pochev vyletí meče. #EMP „Ne! Ne, prosím! NEEE!“#!\n\nTěla dopadají na podlahu s tupými, chrčivými zvuky."
 ep2_wedding.0302.desc.agent: "Můj příjemný rozhovor s několika hosty o [ROOT.Char.Custom('my_subject_of_interest')|l] náhle přeruší pronikavý výkřik. #EMP „Ne!“#! Prudce se otočím a spatřím [spouse_2.Custom('CZ_TitledFirstName_A')] s dýkou zabodnutou přímo do srdce.\n\nStráže se okamžitě vrhnou na vraha. „Chopte se ho! Okamžitě ho zadržte!“ zaslechnu křičet [host.GetTitledFirstName].\n\n"
 ep2_wedding.0302.desc.wedding_night: "Dveře velké síně se náhle rozletí a uprostřed vchodu stojí [spouse_1.GetTitledFirstName], [Select_CString(spouse_1.IsFemale,'celá zadýchaná','celý zadýchaný')], s rukama pevně sevřenýma kolem dveřních křídel. „Pomoc... pomoc!“ vykřikne. „Vrah pronikl do našich komnat a zavraždil [spouse_2.Custom('CZ_TitledFirstName_A')]!“\n\nCelá síň rázem ztichne."
 ep2_wedding.0302.spouse: "Spěšně přistoupím k [spouse_2.Custom('CZ_FirstNameNoTooltip_D')] a vezmu [Select_CString(spouse_2.IsFemale,'ji','ho')] za ruku. Je stále teplá. „Ne... má lásko... přece ne tak brzy...“"
 ep2_wedding.0302.good: "[Select_CString(spouse_2.IsFemale,'Má milovaná','Můj milovaný')|U] [spouse_2.Custom('CZ_FirstNameNoTooltip_V')]... Takhle přece neměl náš příběh skončit."
 ep2_wedding.0302.bad: "Nemělo by se říkat, že si [spouse_2.GetFirstNameNoTooltip] takový osud [Select_CString(spouse_2.IsFemale,'zasloužila','zasloužil')], ale..."
 ep2_wedding.0302.sadistic: "Nemohu odtrhnout oči od té krve... Tak dokonale odvedená práce."
 ep2_wedding.0302.indifferent: "O [spouse_2.Custom('CZ_FirstNameNoTooltip_L')] toho příliš nevím, ale takový osud si nezaslouží nikdo."
 ep2_wedding.0302.a: "Jaká tragédie."
 ep2_wedding.0955.t: "Rudý úsvit"
 ep2_wedding_departure_intro: "Slavnostní síň se od včerejška změnila k nepoznání. Sloužící už sklidili ze stolů, hudba utichla a většina hostů dávno odjela."
 ep2_wedding.0955.desc.intro: "$ep2_wedding_departure_intro$\n\nKdyž se chystám rozloučit s posledními zbývajícími hosty, "
 ep2_wedding.0955.desc.failed: "zahlédnu usměvavou tvář [spouse_2.Custom('CZ_TitledFirstName_G')], [Select_CString(spouse_2.IsFemale,'která právě vesele rozmlouvá','který právě vesele rozmlouvá')] se svým doprovodem.\n\nVím, že mě [spouse_2.GetFirstNameNoTooltip] podezírá, a rozhodně k tomu má důvod. Tohle manželství bude všechno, jen ne nudné."
 ep2_wedding.0955.desc.murder: "na okamžik se v myšlenkách vrátím k [spouse_2.Custom('CZ_TitledFirstName_D')]. Už není mezi živými."
 ep2_wedding.0955.good: "Nemuselo to skončit takhle."
 ep2_wedding.0955.bad: "Konečně už se nebudu muset dívat na [spouse_2.Custom2('CZ_InsultAdjective_A', ROOT.Char)|l] [spouse_2.Custom('CZ_TitledFirstName_A')]."  # wip: urážka/chvála v nepodporovanom páde alebo pri inom podstatnom mene
 ep2_wedding.0955.sadistic: "Kéž bych tak [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] všem prozradit, že jsem to [Select_CString(ROOT.Char.IsFemale,'byla #EMP já#!','byl #EMP já#!')]..."
 ep2_wedding.0955.compassionate: "Mohu jen doufat, že mi [ROOT.Char.GetFaith.HighGodName] odpustí."
 ep2_wedding.0955.indifferent: "Co se stalo, stalo se."
 ep2_wedding.0955.a: "Konečně se mi ulevilo."
 ep2_wedding.0955.a.failure: "Příště... příště to vyjde."
 ep2_wedding.0956.t: "Rozloučení"
 ep2_wedding.0956.desc: "$ep2_wedding_departure_intro$\n\nPřistoupí ke mně [host.GetTitledFirstName] a v [Select_CString(host.IsFemale,'jejím','jeho')] hlase stále zaznívá hluboký smutek. „Srdce mi svírá žal nad ztrátou [spouse_2.Custom('CZ_TitledFirstName_G')]. Omlouvám se, že se tato slavnost proměnila v tak strašlivou událost.“"
 ep2_wedding.0956.a: "Ještěže jsem to [Select_CString(ROOT.Char.IsFemale,'nepřežila','nepřežil')] jen o vlásek já..."
 ep2_wedding.0956.a.good: "Ne... To přece nemůže být pravda."
 ep2_wedding.0204.t: "Krev a ocel"
 ep2_wedding.0204.desc.intro: "Můj veselý rozhovor náhle skončí, když "
 ep2_wedding.0204.desc.family.non_spouse: "spatřím skupinu žoldnéřů, kteří pochodují přímo k nám. #EMP Ššš!#! Z pochev vyletí meče a jejich zlověstné úšklebky předznamenávají naši tragédii.\n\n„Rozluč se se svou rodinou, [spouse_2.Custom('CZ_TitledFirstName_V')].“"
 ep2_wedding.0204.desc.family: "$ep2_wedding.0204.desc.family.non_spouse$ Po těchto slovech mi jeden z nich přiloží čepel k hrdlu."
 ep2_wedding.0204.desc.solo: "se kdosi z dvořanů rozesměje až příliš hlasitě. Až příliš podivně. Ohlédnu se a spatřím [mercenary_1.Custom('CZ_FirstNameNoTooltip_A')], jak mi tiskne dýku na hruď. „Přeji ti jen to nejlepší.“"
 ep2_wedding.0204.a: "Ne! #EMP Přestaňte!#!"
 ep2_wedding.0204.a.tt.success: "Přežiješ"
 ep2_wedding.0204.a.tt.failure: "Zemřeš"
 ep2_wedding.0204.a.tt.success.host: "[murder_victim.GetShortUIName|U] [Select_CString(murder_victim.IsLocalPlayer,'zemřeš','zemře')]"
 ep2_wedding.0204.a.tt.failure.host: "[murder_victim.GetShortUIName|U] [Select_CString(murder_victim.IsLocalPlayer,'přežiješ','přežije')]"
 ep2_wedding.0204.a.spouse_2_murder.tt: "[spouse_2.GetShortUIName|U] [Select_CString(spouse_2.IsLocalPlayer,'zemřeš','zemře')]"
 ep2_wedding.0957.opening: "[Select_CString(ROOT.Char.IsFemale,'Té','Tomu')|U] [ROOT.Char.Custom2('CZ_InsultAdjective_D', SCOPE.sC('avenging_family'))|l] [ROOT.Char.Custom('CZ_TitledFirstName_D')]"
 ep2_wedding.0957.desc.parent: "[Select_CString(avenging_family.IsFemale,'Svěřila','Svěřil')|U] jsem ti do péče své dítě, a ty jsi [Select_CString(spouse_2.IsFemale,'ji','ho')] [Select_CString(ROOT.Char.IsFemale,'nedokázala','nedokázal')] ochránit.$ep2_wedding.0957.desc_ending$"
 ep2_wedding.0957.desc: "Život [avenging_family.Custom2('CZ_RelationToMeShort_G', SCOPE.sC('spouse_2'))|l] byl svěřen do tvých rukou. A takhle [Select_CString(spouse_2.IsFemale,'ji','ho')] chráníš?$ep2_wedding.0957.desc_ending$"
 ep2_wedding.0957.desc_ending: "\n\nOči mi zalévají slzy nad [Select_CString(spouse_2.IsFemale,'její','jeho')] ztrátou, ale v srdci cítím jen nenávist.\n\nPomstím se. Tak či onak."
 ep2_wedding.0957.a: "Zkrátka další manželství, které skončilo tragédií."
 ep2_wedding.0957.a.tt: "Každý blízký příbuzný [spouse_2.Custom('CZ_ShortUIName_G')]"
 host_bloody_wedding_family_kill_title: "Krvavá svatba"
 host_bloody_wedding_family_kill: "$host_bloody_wedding_family_kill_title$"
 host_bloody_wedding_solo_kill_title: "$host_bloody_wedding_family_kill_title$"
 host_bloody_wedding_solo_kill: "$host_bloody_wedding_family_kill_title$"
 host_bloody_wedding_excommunication_title: "Exkomunikace"
 host_bloody_wedding_excommunication: "Na [CHARACTER.Custom('CZ_ShortUIName_A')] byla uvalena exkomunikace"
