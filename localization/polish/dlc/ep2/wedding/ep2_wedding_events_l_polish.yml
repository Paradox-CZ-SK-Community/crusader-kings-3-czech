 ep2_wedding.1310.t: "Nemohu se odtrhnout"
 ep2_wedding.1310.desc_spouse: "Vím, že bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] trávit čas se [Select_CString(other_spouse.IsFemale,'svou novou manželkou','svým novým manželem')] [other_spouse.Custom('CZ_FirstName_I')] a [Select_CString(other_spouse.IsFemale,'její','jeho')] rodinou. Od [Select_CString(friend.IsFemale,'své přítelkyně','svého přítele')] [friend.Custom('CZ_TitledFirstName_G')] se ale prostě nedokážu odtrhnout! [other_guest.GetTitledFirstName] po mně začíná zlostně pokukovat, $ep2_wedding.1310.howlingwithlaughter$"
 ep2_wedding.1310.desc_host: "Jako [Select_CString(ROOT.Char.IsFemale,'hostitelka','hostitel')] svatby vím, že bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] trávit čas s novomanželi a jejich rodinami. Od [Select_CString(friend.IsFemale,'své přítelkyně','svého přítele')] [friend.Custom('CZ_TitledFirstName_G')] se ale prostě nedokážu odtrhnout! [other_guest.GetTitledFirstName] po mně začíná zlostně pokukovat, $ep2_wedding.1310.howlingwithlaughter$"
 ep2_wedding.1310.desc_guest: "Vím, že bych se [Select_CString(ROOT.Char.IsFemale,'měla','měl')] bavit s ostatními hosty. Od [Select_CString(friend.IsFemale,'své přítelkyně','svého přítele')] [friend.Custom('CZ_TitledFirstName_G')] se ale prostě nedokážu odtrhnout! [other_guest.GetTitledFirstName] se snaží upoutat mou pozornost, $ep2_wedding.1310.howlingwithlaughter$"
 ep2_wedding.1310.howlingwithlaughter: "ale pokaždé, když se zkusím omluvit, [friend.GetFirstNameNoTooltip] mě znovu rozesměje k slzám."
 ep2_wedding.1310.a: "Jaká radost mít tu [friend.Custom('CZ_FirstNameNoTooltip_A')] se mnou!"
 ep2_wedding.1310.b: "[other_guest.Custom('CZ_FirstNameNoTooltip_V')|U], pojď k nám!"
 ep2_wedding.1310.c: "Pojďme vyklouznout, abychom si mohli pořádně promluvit!"
 ep2_wedding.1310.d: "Musíš mě omluvit, [Select_CString(friend.IsFemale,'přítelkyně','příteli')]."
