 ep2_wedding.1070.t: "Exotické představení"
 ep2_wedding.1070.desc_host: "Spokojeně se rozhlédnu. Na hostině panuje uvolněná nálada, hosté si příjemně povídají a užívají hudby i zábavy. Blaženě netuší, že to nejlepší překvapení na ně teprve čeká. Pokynu sloužícím, aby pokračovali."
 ep2_wedding.1070.desc_guest: "Na svatební hostině se výborně bavím. [host.GetTitledFirstName] na zábavě opravdu [Select_CString(host.IsFemale,'nešetřila','nešetřil')]! Hrají nám ti nejlepší hudebníci, herci a žongléři předvádějí své umění a trubadúři přednášejí vytříbené verše. Docela mě proto překvapí, když [host.GetFirstNameNoTooltip] pokyne, aby přinesli ještě něco dalšího."
 ep2_wedding.1070.desc_mid: "\n\nČtveřice sluhů se zakrátko vrátí s klecí. Uvnitř se tyčí majestátní [host.Custom('GetAnimalTypeCaptive')|l]. Tak nádherný exemplář jsem ještě [Select_CString(ROOT.Char.IsFemale,'neviděla','neviděl')]."
 ep2_wedding.1070.desc_good: "Šelma je trochu neklidná, ale mříže jsou pevné a všichni si show užívají z bezpečné vzdálenosti."
 ep2_wedding.1070.desc_bad: "Zvíře je neklidné. Se zlou předtuchou sleduji, jak klec při každém jeho pohybu vrže a sténá. Pak s děsivým #EMP prasknutím#! povolí jedna z hlavních mříží a rozpoutá se peklo."
 ep2_wedding.1070.desc_bad_target: "\n\n[1070_target.GetTitledFirstName|U] se rychle ocitne v obklíčení."
 ep2_wedding.1070.a: "To bylo skutečně velmi pěkné představení."
