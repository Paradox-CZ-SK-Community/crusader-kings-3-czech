 ep2_wedding.1320.c: "„Jakou cenu pro tebe má odpuštění?“"
 ep2_wedding.1310.c.hook: "[rival.GetFirstNameNoTooltip|U] nabízí, že ti to napraví"
 ep2_wedding.1310.c.apology: "[rival.GetFirstNameNoTooltip|U] ti nabízí omluvu"
 ep2_wedding.1310.c.refusal: "[rival.GetFirstNameNoTooltip|U] odmítá se ponížit."
 wedding_hooked_rival_log_title: "Urovnaný rival"
 wedding_hooked_rival_log: "[CHARACTER.GetUIName|U] a [TARGET_CHARACTER.GetUIName] vyjednali konec svého sporu."
 wedding_apology_rival_log_title: "Rival se omlouvá"
 wedding_apology_rival_log: "[CHARACTER.GetUIName|U] a [TARGET_CHARACTER.GetUIName] vyjednali konec svého sporu."
 wedding_refusal_rival_log_title: "Hašteřiví rivalové"
 wedding_refusal_rival_log: "[TARGET_CHARACTER.GetUIName|U] se [Select_CString(TARGET_CHARACTER.IsFemale,'pokusila','pokusil')] usmířit s [CHARACTER.Custom('CZ_UIName_I')], ale skončilo to hádkou jako vždycky."
 ep2_wedding.1320.d: "Ignoruji [rival.Custom('CZ_ShortUIName_A')], dokud neodejde."
 ep2_wedding.1060.t: "Ten prokletý stůl"
 ep2_wedding.1060.desc: "S těžkým povzdechem opustím veselí a zavřu dveře svatební komnaty. Den byl dlouhý, ale sňatek se přece musí #EMP dovršit#!, ne?\n\nVšímám si, že [spouse_2.GetTitledFirstName] je s postupujícím večerem stále neklidnější. Nepřikládám tomu ale velkou váhu. Kdo na své svatbě není trochu nervózní? Když však sáhnu po jeho spodním prádle, překvapí mě, oč méně je #EMP vzrušený#!, než jsem [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')].\n\nMálem vyskočí z kůže. „To ta místnost! Postel! Nebo ten noční stolek! Možná tapiserie? Má mužnost je prokletá!!“"
 ep2_wedding.1060.a: "#EMP DOBŘE#!."
 ep2_wedding.1060.a.tt: "Postaráš se, aby [spouse_2.GetFirstNameNoTooltip] už [Select_CString(spouse_2.IsFemale,'neměla','neměl')] žádné výmluvy"
 ep2_wedding.1060.b: "Rozumím. Neboj se."
 ep2_wedding.1061.desc: "Už hodinu do mé svatební komnaty přichází a zase odchází služebnictvo. Horečně odnáší všechen nábytek i výzdobu. Zbyl jen holý stůl, osamělý uprostřed pokoje.\n\nSedím na něm stejně [Select_CString(ROOT.Char.IsFemale,'nahá','nahý')], jako je ten stůl holý, a čekám na svého novomanžela, [spouse_2.Custom('CZ_TitledFirstName_A')]. Se škodolibým úsměvem myslím na to, že teď už mu výmluvy dojdou."
 ep2_wedding.1061.desc_1: "\n\nKdyž vstoupí do pokoje, překvapení v jeho tváři rychle vystřídá vzrušení."
 ep2_wedding.1061.desc_2: "\n\n[spouse_2.GetFirstNameNoTooltip|U] vejde do pokoje pozdě, se sklopenýma očima, a už se zase ošívá. Způsob, jakým se úmyslně vyhýbá mému tázavému pohledu, mi řekne všechno, co potřebuji vědět."
 ep2_wedding.1061.a: "To je lepší!"
 ep2_wedding.1061.b: "#EMP PRYČ! Jsi odpornější než červ!#!"
 ep2_wedding.1061.c: "Nech to být. Není kam spěchat."
 THEY_ARE_ACCUSED_IMPOTENCY: "[Select_CString(ROOT.Char.IsFemale,'Označila','Označil')] jsi [secondary_recipient.Custom('CZ_ShortUIName_A')] za [Select_CString(secondary_recipient.IsFemale,'impotentní','impotentního')]"
 ep2_wedding.1065.desc: "Konečně necháme jásající dav za dveřmi. S [spouse_2.Custom('CZ_TitledFirstName_I')] jsme ve svatební komnatě sami. Byl to dlouhý den, ale sňatek se přece musí #EMP dovršit#!, ne?\n\nNaneštěstí [spouse_2.GetFirstNameNoTooltip] brzy zjistí, že #EMP některé mé části#! nejsou tak horlivé jako ostatní. Přemlouvání, uplácení ani vyhrožování na tom zřejmě nic nezmění.\n\n„Já se snažím!“ vykřiknu. Tohle je #EMP tak trapné#!!"
 ep2_wedding.1065.a: "#EMP Prokletí mě postihlo!!#!"
 ep2_wedding.1065.a.tt: "[spouse_2.Custom('CZ_ShortUIName_D')] se rty zkřiví do sarkastického úsměšku. Neřekne však nic a odejde z pokoje"
 ep2_wedding.1065.b: "Jen jsem nervózní..."
 ep2_wedding.1065.b1: "[spouse_2.GetFirstNameNoTooltip|U] [Select_CString(spouse_2.IsFemale,'je trpělivá','je trpělivý')]"
 ep2_wedding.1065.b2: "[spouse_2.GetFirstNameNoTooltip|U] [Select_CString(spouse_2.IsFemale,'veřejně odsoudila','veřejně odsoudil')] tvé potíže"
 ep2_wedding.1066.desc: "[spouse_2.GetTitledFirstName|U] se za pár minut vrátí do naší svatební komnaty. Za [Select_CString(spouse_2.IsFemale,'ní','ním')] přichází několik zmatených sloužících a hned začne odnášet všechen nábytek i výzdobu. Na každou mou otázku odpovídá zatvrzelé mlčení. Když konečně odejdou, zbude jen holý stůl. A na něm #EMP stejně [Select_CString(spouse_2.IsFemale,'nahá','nahý')]#! [spouse_2.GetFirstNameNoTooltip].\n\n„Už nevidím žádné #EMP prokleté#! předměty. Co ty na to?“ zeptá se s vyzývavým úsměvem."
 ep2_wedding.1066.desc_1: "\n\nVšechny myšlenky mi zmizí."
 ep2_wedding.1066.desc_2: "\n\n„#EMP Aha.#!“ Začnu koktat a zdržovat. „Víš... To není— Chci říct—“ Jenže [Select_CString(spouse_2.IsFemale,'její','jeho')] ledový výraz mě zarazí na místě."
 ep2_wedding.1066.a: "Vše dobře, co dobře končí!"
 ep2_wedding.1066.b: "Nedělám to #EMP naschvál#!, přísahám!"
 ep2_wedding.1066.b_1: "[spouse_2.GetFirstNameNoTooltip|U] [Select_CString(spouse_2.IsFemale,'je uražená','je uražený')]."
 ep2_wedding.1066.b_2: "[spouse_2.GetFirstNameNoTooltip|U] má trpělivost a pochopení."
 ep2_wedding.1110.t: "Ještě jeden pohár"
 ep2_wedding.1110.desc_intro: "Poté, co novomanželé odejdou do svých soukromých komnat, oslavy se táhnou dlouho do noci, jen pomalu ztrácejí na intenzitě a bujnosti. Jeden za druhým většina hostů buď odchází, usne, nebo se stáhne, aby si sama užila večerních požitků."
 ep2_wedding.1110.desc: "\n\n#EMP Většina#! hostů. [1110_drunk.GetTitledFirstName] ale ne. Hlasitě se dožaduje jednoho poháru za druhým, směje se ze všech nejhlasitěji a zarputile odmítá snahy služebnictva odvést [Select_CString(1110_drunk.IsFemale,'ji','ho')] někam do klidu."
 ep2_wedding.1110.desc_host: "\n\nOpravdu bych s [Select_CString(1110_drunk.IsFemale,'ní','ním')] [Select_CString(ROOT.Char.IsFemale,'měla','měl')] něco udělat..."
 ep2_wedding.1110.a: "Někteří lidé prostě nemají stud."
 wedding_goblet_refusal_log_title: "Zůstal příliš dlouho"
 wedding_goblet_refusal_log: "[CHARACTER.GetUIName|U] se [Select_CString(CHARACTER.IsFemale,'zesměšnila','zesměšnil')] opilstvím a odmítáním odejít"
 ep2_wedding.1110.b: "To stačí!"
 ep2_wedding.1110.b.tt: "Tvé stráže [Select_CString(1110_drunk.IsFemale,'ji','ho')] doprovodí ke dveřím"
 wedding_goblet_eject_log_title: "Vyhozen"
 wedding_goblet_eject_log: "[CHARACTER.GetUIName|U] [Select_CString(CHARACTER.IsFemale,'vyhodila','vyhodil')] [TARGET_CHARACTER.Custom('CZ_UIName_A')] ze svatební hostiny za opilství a výtržnosti"
 ep2_wedding.1110.c: "Když je nemůžeš porazit, přidej se k nim!"
 wedding_goblet_fool_log_title: "Naprosté zahanbení"
 wedding_goblet_fool_log: "[CHARACTER.GetUIName|U] a [TARGET_CHARACTER.GetUIName] se ztrapnili tím, že byli opilí a výtržní"
 ep2_wedding.1111.desc: "#EMP Většina#! hostů, ale ne já!\n\n„Přineste mi další pohár! A ještě jeden!“ zavolám na kteréhokoliv služebníka, kterého uvidím."
 ep2_wedding.1111.desc_host: "Koneckonců to všechno platím já. Nezasloužím si to?"
 ep2_wedding.1111.desc_conclusion: "\n\nOd svého stolu mě však probodává odsuzující pohled [1111_other.Custom('CZ_TitledFirstName_G')]. „Nemáš toho pití pro dnešek dost?“ zeptá se chladně."
 ep2_wedding.1111.a: "Promiň, trochu se uklidním..."
 wedding_goblet_reprimand_log_title: "Napomenutí"
 wedding_goblet_reprimand_log: "[CHARACTER.GetUIName|U] [Select_CString(CHARACTER.IsFemale,'byla pokárána','byl pokárán')] za opilství a výtržnosti při svatební hostině"
 ep2_wedding.1111.b: "Přestaň brblat a přidej se ke mně!"
 ep2_wedding.1111.b.1: "[1111_other.GetFirstNameNoTooltip|U] se k tobě přidá"
 ep2_wedding.1111.b.1.tt: "[1111_other.GetFirstNameNoTooltip|U] se k tobě [Select_CString(1111_other.IsFemale,'přidala','přidal')]"
 ep2_wedding.1111.b.2: "[1111_other.GetFirstNameNoTooltip|U] tě nechá vyhodit"
 ep2_wedding.1111.b.2.tt: "[1111_other.GetFirstNameNoTooltip|U] tě [Select_CString(1111_other.IsFemale,'vyhodila','vyhodil')]"
 ep2_wedding.1111.b.3: "[1111_other.GetFirstNameNoTooltip|U] ti mlčky vyjadřuje nesouhlas"
 ep2_wedding.1111.b.3.tt: "[1111_other.GetFirstNameNoTooltip|U] ti vyjadřuje nesouhlas"
 ep2_wedding.1300.t: "Proč já?"
 ep2_wedding.1300.desc_intro: "Za svatební noci se probudím ve studené posteli. U okna stojí [spouse_2.GetTitledFirstName]. Na pažích má v nočním vzduchu husí kůži.\n\n"
 ep2_wedding.1300.desc_appearance: "„Jsem [Select_CString(spouse_2.IsFemale,'ohavná','ohavný')]. Všichni to říkají, i když jen potichu."
 ep2_wedding.1300.desc_dark_past: "„Ty věci, které jsem [Select_CString(spouse_2.IsFemale,'udělala','udělal')]... Nikdo mi je nedovolí zapomenout."
 ep2_wedding.1300.desc_voice: "„Já...“ Odmlčí se a hledá slova. „Sotva mohu promluvit, aby se mi všichni za dlaněmi nesmáli."
 ep2_wedding.1300.desc_lowborn: "„Jsem neurozená nula. Ke dvoru nepatřím. Mám pocit, že se mi všichni smějí."
 ep2_wedding.1300.desc_outro: " Proč by si [ROOT.Char.GetTitleAsNameNoTooltip|l] [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')] vzít někoho jako já?“"
 ep2_wedding.1300.followup.tt: "[spouse_2.GetShortUIName|U] zareaguje podle své povahy. Může [Select_CString(spouse_2.IsFemale,'být uklidněná, nebo uražená','být uklidněný, nebo uražený')]"
 ep2_wedding.1300.followup.a: "Nejistota [spouse_2.Custom('CZ_ShortUINameNoTooltip_G')] se rozptýlí"
 ep2_wedding.1300.followup.b: "[spouse_2.GetShortUINameNoTooltip|U] přijímá praktický smysl vašeho manželství"
 ep2_wedding.1300.followup.c: "[spouse_2.GetShortUINameNoTooltip|U] se cítí [Select_CString(spouse_2.IsFemale,'nepochopená','nepochopený')]"
 ep2_wedding.1300.virtue: "[Select_CString(ROOT.Char.IsFemale,'Vybrala','Vybral')] jsem si tě pro tvou ctnostnou povahu."
 ep2_wedding.1300.virtue.tt: "Tato možnost je dostupná, protože [spouse_2.GetShortUIName] [Select_CString(spouse_2.IsFemale,'je ctnostná žena','je ctnostný muž')]"
 ep2_wedding.1300.rule_together: "Potřebuji někoho jako jsi ty, aby vládl po mém boku."
 ep2_wedding.1300.rule_together.tt: "Tato možnost je dostupná, protože [spouse_2.GetShortUIName] má vladařské nadání"
 ep2_wedding.1300.practical: "Toto manželství je praktické pro oba."
 ep2_wedding.1300.stop_whining: "Přestaň fňukat. Díky mně jsi [spouse_2.GetTitleAsNameNoTooltip|l]."
 ep2_wedding.1300.understanding: "Vím, jaké to je připadat si bezcenně."
 ep2_wedding.1300.beauty: "Mým protějškem je [Select_CString(spouse_2.IsFemale,'nejkrásnější žena','nejkrásnější muž')] na světě."
 ep2_wedding.1300.beauty.tt: "Tato možnost je dostupná, protože [spouse_2.GetShortUIName] [Select_CString(spouse_2.IsFemale,'je proslulá','je proslulý')] svou krásou"
 ep2_wedding.1300.fertility: "[Select_CString(ROOT.Char.IsFemale,'Vybrala','Vybral')] jsem si tě, abys mi [Select_CString(spouse_2.IsFemale,'dala','dal')] mnoho silných dědiců."
 ep2_wedding.1300.fertility.tt: "Tato možnost je dostupná, protože [spouse_2.GetShortUIName] má předpoklady k tomu, aby [Select_CString(spouse_2.IsFemale,'byla matkou mnoha dětí','byl otcem mnoha dětí')]"
 ep2_wedding.1301.t: "$ep2_wedding.1300.t$"
 ep2_wedding.1301.desc_intro: "Nepokojné myšlenky mě vytáhnou z mé svatební postele."
 ep2_wedding.1301.desc_appearance: "Jsem [Select_CString(ROOT.Char.IsFemale,'ohavná','ohavný')]. Proč by si [spouse_1.GetTitleAsNameNoTooltip|l] [Select_CString(spouse_1.IsFemale,'chtěla','chtěl')] vzít někoho jako já?"
 ep2_wedding.1301.desc_dark_past: "Proč by si [spouse_1.GetTitleAsNameNoTooltip|l] [Select_CString(spouse_1.IsFemale,'chtěla','chtěl')] vzít někoho jako já? Po tom všem, co jsem [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')]?"
 ep2_wedding.1301.desc_voice: "Proč by si [spouse_1.GetTitleAsNameNoTooltip|l] [Select_CString(spouse_1.IsFemale,'chtěla','chtěl')] vzít někoho jako já, když sotva promluvím, aby se mi všichni nesmáli?"
 ep2_wedding.1301.desc_lowborn: "Proč by si [spouse_1.GetTitleAsNameNoTooltip|l] [Select_CString(spouse_1.IsFemale,'chtěla','chtěl')] vzít neurozenou nulu, jako jsem já?"
 ep2_wedding.1301.desc_midtro: "\n\nMůj neklid probudí [spouse_1.Custom('CZ_TitledFirstName_A')]. Než se naději, ptám se [Select_CString(spouse_1.IsFemale,'jí','ho')], proč si ze všech lidí [Select_CString(spouse_1.IsFemale,'vybrala','vybral')] právě mě. "
 ep2_wedding.1301.desc_virtue: "Prý si mě [Select_CString(spouse_1.IsFemale,'vybrala','vybral')] pro mou ctnostnou povahu."
 ep2_wedding.1301.desc_rule_together: "Prý si mě [Select_CString(spouse_1.IsFemale,'vybrala','vybral')], abych [Select_CString(spouse_1.IsFemale,'jí','mu')] [Select_CString(ROOT.Char.IsFemale,'pomohla','pomohl')] vládnout."
 ep2_wedding.1301.desc_practical: "Prý si mě [Select_CString(spouse_1.IsFemale,'vybrala','vybral')] z čistě praktických důvodů."
 ep2_wedding.1301.desc_stop_whining: "Řekne mi, ať přestanu fňukat a jsem za ten sňatek [Select_CString(ROOT.Char.IsFemale,'vděčná','vděčný')]."
 ep2_wedding.1301.desc_understanding: "Prý také dobře ví, jaké je to cítit se bezcenně."
 ep2_wedding.1301.desc_beauty: "Prý si mě [Select_CString(spouse_1.IsFemale,'vybrala','vybral')] pro mou krásu."
 ep2_wedding.1301.desc_fertility: "Prý si mě [Select_CString(spouse_1.IsFemale,'vybrala','vybral')], abych [Select_CString(spouse_1.IsFemale,'jí','mu')] [Select_CString(ROOT.Char.IsFemale,'dala','dal')] silné dědice."
 ep2_wedding.1301.desc_outro: " Co si mám o tom myslet?"
 ep2_wedding.1301.love: "Chci si zasloužit [Select_CString(spouse_1.IsFemale,'její','jeho')] lásku."
 ep2_wedding.1301.trust: "Chci [Select_CString(spouse_1.IsFemale,'jí','mu')] věřit."
 ep2_wedding.1301.silly: "Má pravdu. Chovám se hloupě."
 ep2_wedding.1301.misunderstood: "[Select_CString(ROOT.Char.IsFemale,'Věděla','Věděl')] jsem, že to nepochopí."
 ep2_wedding.1301.outcome.love: "[spouse_2.GetShortUIName|U] se usměje, když rozptýlíš [Select_CString(spouse_2.IsFemale,'její','jeho')] nejistotu."
 ep2_wedding.1301.outcome.trust: "[spouse_2.GetShortUIName|U] cítí, že ti může věřit."
 ep2_wedding.1301.outcome.silly: "[spouse_2.GetShortUIName|U] uzná, že tohle manželství dává smysl."
 ep2_wedding.1301.outcome.misunderstood: "[spouse_2.GetShortUIName|U] má pocit, že [Select_CString(spouse_2.IsFemale,'ji','ho')] neposloucháš."
 wedding_whyme_love_log_title: "Sbližování"
 wedding_whyme_love_log: "[CHARACTER.GetUIName|U] [Select_CString(CHARACTER.IsFemale,'vyslechla','vyslechl')] nejistoty [TARGET_CHARACTER.Custom('CZ_UIName_G')] a [Select_CString(CHARACTER.IsFemale,'dala','dal')] [Select_CString(TARGET_CHARACTER.IsFemale,'jí','mu')] pocítit lásku"
 wedding_whyme_trust_log_title: "$wedding_whyme_love_log_title$"
 wedding_whyme_trust_log: "[CHARACTER.GetUIName|U] [Select_CString(CHARACTER.IsFemale,'vyslechla','vyslechl')] nejistoty [TARGET_CHARACTER.Custom('CZ_UIName_G')] a [Select_CString(CHARACTER.IsFemale,'dala','dal')] [Select_CString(TARGET_CHARACTER.IsFemale,'jí','mu')] pocítit úctu"
 wedding_whyme_silly_log_title: "Praktické manželství"
 wedding_whyme_silly_log: "[CHARACTER.GetUIName|U] [Select_CString(CHARACTER.IsFemale,'vyslechla','vyslechl')] nejistoty [TARGET_CHARACTER.Custom('CZ_UIName_G')] a [Select_CString(CHARACTER.IsFemale,'vyvolala','vyvolal')] v [Select_CString(TARGET_CHARACTER.IsFemale,'ní','něm')] pocit pošetilosti"
 wedding_whyme_misunderstood_log_title: "Nedorozumění"
 wedding_whyme_misunderstood_log: "[CHARACTER.GetUIName|U] [Select_CString(CHARACTER.IsFemale,'vyslechla','vyslechl')] nejistoty [TARGET_CHARACTER.Custom('CZ_UIName_G')] a [Select_CString(CHARACTER.IsFemale,'vyvolala','vyvolal')] v [Select_CString(TARGET_CHARACTER.IsFemale,'ní','něm')] pocit malosti"
 ep2_wedding.3000.t: "Plaché začátky"
 ep2_wedding.3000.desc: "#EMP Ach jo#!. Tak tedy začínáme. Asi. Co mám vlastně teď dělat? Má [Select_CString(my_spouse.IsFemale,'ráda','rád')]... mazlení? Nebo jen polibky? Když se na mě podívá přímo, odvrátím tvář. Aspoň vidím, že si také nervózně mne ruce.\n\n„Ehm...“ pokusím se promluvit a odkašlu si. Prostěradlo ještě nemá jediný záhyb. „Dnes večer ti to moc sluší.“\n\n„D-děkuji... Tvoje... tvoje vlasy se mi taky líbí.“\n\nZatraceně. Takhle to zjevně nepůjde."
 ep2_wedding.3000.a: "„Nechceš se projít?“"
 ep2_wedding.3000.a.success: "[my_spouse.Custom('CZ_FirstNameNoTooltip_D')] připadá procházka milá"
 ep2_wedding.3000.a.failure: "[my_spouse.Custom('CZ_FirstNameNoTooltip_D')] připadá procházka nudná"
 ep2_wedding.3000.b: "„Baví tě... číst?“"
 ep2_wedding.3000.b.success: "S [my_spouse.Custom('CZ_FirstNameNoTooltip_I')] si krásně popovídáte"
 ep2_wedding.3000.b.failure: "[my_spouse.Custom('CZ_FirstNameNoTooltip_D')] připadá rozhovor nudný"
 ep2_wedding.3000.c: "„#EMP Zííív#!, jsem #EMP tak#! [Select_CString(ROOT.Char.IsFemale,'ospalá','ospalý')].“"
 ep2_wedding.3000.tt: "[my_spouse.Custom('CZ_FirstNameNoTooltip_D')] se to může, ale nemusí líbit podle [Select_CString(my_spouse.IsFemale,'jejích','jeho')] rysů...\n"
 ep2_wedding_3000_log_a_title: "Romantická procházka"
 ep2_wedding_3000_log_a: "[CHARACTER.GetUIName|U] [Select_CString(CHARACTER.IsFemale,'vzala','vzal')] [TARGET_CHARACTER.Custom('CZ_UIName_A')] o svatební noci na romantickou procházku"
 ep2_wedding_3000_log_b_title: "Romantický rozhovor"
 ep2_wedding_3000_log_b: "[CHARACTER.GetUIName|U] a [TARGET_CHARACTER.GetUIName] si užili půvabný rozhovor během své svatební noci"
 wnight_common_things_opinion: "Společné zájmy"
 wnight_common_things_opinion_desc: "Tito jedinci sdíleli své společné zájmy během svatební noci"
 wnight_nothing_in_common_opinion: "Nic společného"
 wnight_nothing_in_common_opinion_desc: "Tito jedinci strávili nudnou svatební noc bez společných zájmů"
 ep2_wedding.3010.t: "Vyznání"
 ep2_wedding.3010.desc.intro: "[my_spouse.GetTitledFirstName|U] celou noc nečinně hledí z okna. Kdykoli se pokusím přijít blíž, zazní melancholický povzdech. Neustále si sahá do vlasů a vyhýbá se mému pohledu.\n\nSvíčky téměř dohořely. Když vstanu, abych je [Select_CString(ROOT.Char.IsFemale,'obnovila','obnovil')], [my_spouse.GetFirstName] začne tiše plakat. „[ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')], já... musím se ti s něčím svěřit."
 ep2_wedding.3010.desc.murder: "Ta krev... byla všude...“"
 ep2_wedding.3010.desc.murder_attempt: "Jednou jsem se [Select_CString(my_spouse.IsFemale,'pokusila','pokusil')]... Bylo to hrozné.“"
 ep2_wedding.3010.desc.cannibal: "Nemohu si pomoci, ta chuť...“"
 ep2_wedding.3010.desc.deviant: "Vím, že se ti to hnusí. Tobě i všem ostatním...“"
 ep2_wedding.3010.desc.witch: "Znám ty správné byliny i ta správná slova...“"
 ep2_wedding.3010.desc.non_believer: "Já... nedokážu tomu věřit.“"
 ep2_wedding.3010.desc.fallback: "Vím, že to není správné, ale...“"
 ep2_wedding.3010.a: "„Neboj se, lásko, ochráním tě.“"
 ep2_wedding.3010.b: "„Přestaň. Nechci slyšet zbytek.“"
 ep2_wedding.3010.c: "„Vlastně... i já se musím s něčím přiznat.“"
 wedding_confession_log_title: "Společné vyznání"
 wedding_confession_log: "[TARGET_CHARACTER.GetUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'svěřila','svěřil')] své tajemství [CHARACTER.Custom('CZ_UIName_D')] během svatební noci"
 wedding_confession_joint_log_title: "$wedding_confession_log_title$"
 wedding_confession_joint_log: "[CHARACTER.GetUIName|U] a [TARGET_CHARACTER.GetUIName] si během své svatební noci vzájemně vyznali svá tajemství."
 wnight_clear_conscience_modifier: "Čisté svědomí"
 wnight_clear_conscience_modifier_desc: "Tato postava zvolila poklidnou svatební noc a neobjevila tajemství svého partnera."
 ep2_wedding.3020.t: "Nezájem"
 ep2_wedding.3020.desc: "[my_spouse.GetTitledFirstName|U] se celý den usmívá, oslavuje obřad a v příjemných rozhovorech dává najevo svou ctnost. Hovory snad nemají konce. Když už nějakou dobu pobýváme v naší nově společné ložnici, přepadne mě touha naklonit se a políbit [Select_CString(my_spouse.IsFemale,'ji','ho')]...\n\nJenže je to docela jiné, než jsem [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')]. Rty jsou suché, pohyby bez zájmu. Odtáhnu se a tázavě [Select_CString(my_spouse.IsFemale,'jí','mu')] pohlédnu do očí.\n\n„Já...“ Zhluboka se nadechne. „Mám trochu jiné... záliby.“ "
 ep2_wedding.3020.a: "Jen... nechci to slyšet."
 ep2_wedding.3020.b: "Rozumím."
 ep2_wedding.3020.c: "#EMP Ha!#! Nebudeš tomu věřit, ale..."
 wnight_confider_modifier: "Důvěrníci"
 wnight_confider_modifier_desc: "Tato postava vidí ve svém manželském protějšku spolehlivého důvěrníka"
 ep2_wedding.3030.t: "Noc, na kterou se nezapomíná"
 ep2_wedding.3030.desc: "Oheň v krbu slábne a já mlčky hledím do plamenů. To světlo, to teplo. [my_spouse.GetTitledFirstName] něco hledá v dřevěné truhle. Odtrhnu oči od ohně a zadívám se na [Select_CString(my_spouse.IsFemale,'ni','něj')].\n\n„[ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')],“ promluví a podá mi malý balíček zabalený v hedvábí, „tohle pro tebe schovávám od chvíle, kdy jsem se o našem zasnoubení [Select_CString(my_spouse.IsFemale,'dozvěděla','dozvěděl')]. Teď ti to nabízím jako důkaz své lásky.“"
 ep2_wedding.3030.a: "„#EMP Ty#! jsi můj největší dar.“"
 ep2_wedding.3030.a.tt: "Získáš bonus k [Concept('schemes','intrikám')|E] typu [GetScheme('courting').GetTypeName|l] vůči [my_spouse.Custom('CZ_ShortUIName_D')]"
 ep2_wedding.3030.b: "„I já mám něco pro tebe...“"
 ep2_wedding.3030.b.tt: "Získáš bonus k [Concept('schemes','intrikám')|E] typu [GetScheme('seduce').GetTypeName|l] vůči [my_spouse.Custom('CZ_ShortUIName_D')]"
 ep2_wedding.3030.c: "„Vlastně... mám pro tebe taky něco.“"
 ep2_wedding.3030.d: "„#EMP Ha!#! Takhle mě nepřichytíš!“"
 love_memento_desc: "[love_memento.GetDesc]\n\n[CZProDrop(my_spouse,'darovala','daroval')|U] tento artefakt [ROOT.Char.Custom('CZ_FirstName_D')] o svatební noci jako důkaz své náklonnosti."
 lock_of_hair: "Pramínek vlasů"
 lock_of_hair.desc: "Pramínek vlasů svázaný hedvábnou stužkou. Má přesně takový odstín vlasů, jakým se pyšní [my_spouse.GetShortUIName]."
 house_ribbon: "Rodová vyšívaná stuha"
 house_ribbon.desc: "Pečlivě vyšívaná stuha s rodovým heslem [itsa_me_scope.Custom('CZ_TitledFirstName_G')]."
 initials_necklace: "Náhrdelník s iniciálami"
 initials_necklace.desc: "Bronzové písmeno zdobené černými skleněnými kamínky ve zlatých krapnách. Nese iniciály [itsa_me_scope.Custom('CZ_TitledFirstName_G')]."
 marriage_prayer_brooch: "Brož s modlitbou za manželství"
 marriage_prayer_brooch.desc: "Kruhová plochá brož, rytá modlitbou za manželství, smaltovaná."
 wooden_phallus: "Dřevěný falus"
 wooden_phallus.desc: "Dřevěný symbol plodnosti, zobrazující mužský pohlavní úd."
 ep2_wedding.3030.artifact_tt: "Staneš se vlastníkem [love_memento.GetName]"
 ep2_wedding.3040.t: "Plamenná noc"
 ep2_wedding.3040.desc: "Ach, jak hebkou kůži má [my_spouse.GetTitledFirstName], jak nádherně voní [Select_CString(my_spouse.IsFemale,'její','jeho')] vlasy! Svatební noc probíhá přesně podle mých představ a brzy se cele oddáme tělesnému hříchu.\n\nVe vášni nevnímáme svíčky, které pokoj sotva osvětlují. Jednu nechtěně skopnu nohou. „Nepřestávej, lásko!“\n\nJenže [ROOT.Char.GetFaith.HighGodName] má s námi jiné plány. Slamník rychle zachvátí oheň."
 ep2_wedding.3040.a: "Musím zachránit [my_spouse.Custom('CZ_FirstNameNoTooltip_A')]!"
 ep2_wedding.3040.a.success: "Zachráníš [my_spouse.Custom('CZ_FirstNameNoTooltip_A')] z plamenů!"
 ep2_wedding.3040.a.failure: "Zraníš se při pokusu zachránit [my_spouse.Custom('CZ_FirstNameNoTooltip_A')]"
 ep2_wedding.3040.b: "Musím zachránit #EMP sebe#!!"
 ep2_wedding.3040.b.success: "[my_spouse.GetFirstNameNoTooltip|U] unikne z plamenů"
 ep2_wedding.3040.b.failure: "[my_spouse.GetFirstNameNoTooltip|U] se popálí"
 ep2_wedding.3040.c: "Tohle je moje chvíle zazářit!"
 ep2_wedding.3040.c.success: "Předvedeš svou sílu záchranou [my_spouse.Custom('CZ_FirstNameNoTooltip_G')]"
 ep2_wedding.3040.d: "Skvělá příležitost zbavit se [my_spouse.Custom('CZ_ShortUINameNoTooltip_G')]..."
 ep2_wedding.3040.d.flavor: "Do ohně s tebou, #EMP [Select_CString(my_spouse.IsFemale,'má drahá manželko','můj drahý manželi')]#!!"
 ep2_wedding.3040.d.success: "[my_spouse.GetFirstNameNoTooltip|U] přežije tvůj pokus o vraždu"
 ep2_wedding.3040.d.failure: "[my_spouse.GetFirstNameNoTooltip|U] zemře"
 ep2_wedding.3050.t: "To, co visí nad hlavou"
 ep2_wedding.3050.desc: "Večer už dávno minul a po odchodu novomanželů za... soukromými záležitostmi se hosté začínají rozcházet. Přes místnost sleduji [intent_victim.Custom('CZ_TitledFirstName_A')] a dávám pozor, abych [Select_CString(ROOT.Char.IsFemale,'neodešla','neodešel')] dřív než #EMP [Select_CString(intent_victim.IsFemale,'ona','on')]#!.\n\nJeden cizí rytíř odejde na modlitby a zůstaneme jen my dva.\n\n„Inu, už bych taky [Select_CString(intent_victim.IsFemale,'měla','měl')] jít,“ pronese [intent_victim.GetFirstNameNoTooltip] a zvedne se ze židle.\n\nNad [Select_CString(intent_victim.IsFemale,'její','jeho')] hlavou visí stříbrná lampa jako ohnivý jazyk."
 ep2_wedding.3050.a: "Teď je ten okamžik!"
 ep2_wedding.3050.a.success: "Zabiješ [intent_victim.Custom('CZ_FirstNameNoTooltip_A')]"
 ep2_wedding.3050.a.failure: "[intent_victim.GetFirstNameNoTooltip|U] přežije"
 ep2_wedding.3050.b: "Šňůra té lampy vypadá dnes večer extrémně křehce..."
 ep2_wedding.3050.b.success: "Lampa zabije [intent_victim.Custom('CZ_FirstNameNoTooltip_A')]"
 ep2_wedding.3050.b.failure: "[intent_victim.GetFirstNameNoTooltip|U] pojme podezření ohledně nehody"
 ep2_wedding.3050.c: "Když [Select_CString(intent_victim.IsFemale,'ji','ho')] budu sledovat, zjistím, kde spí..."
 ep2_wedding.3050.c.tt: "„Získáš výrazný bonus k [Concept('schemes','intrikám')|E] typu [GetScheme('murder').GetTypeName|l] zaměřeným na tuto postavu“"
 ep2_wedding.3200.t: "Ceremoniální závazky"
 ep2_wedding.3200.both: "Když hostina vrcholí, s [my_spouse.Custom('CZ_FirstNameNoTooltip_I')] si vyměníme zahanbené pohledy. Naše pocity z blížícího se obřadu ukládání na lože jsou zjevně stejné...\n\nPrůvod nás vede ke komnatám. Přes hulákání a bubnování nadějně prohodím: „[Select_CString(my_spouse.IsFemale,'Manželko','Manželi')], my to přece #EMP nemusíme#! dělat, víš?“"
 ep2_wedding.3200.self: "Jak hostina vrcholí, při pomyšlení na obřad ukládání na lože ve mně roste úzkost. [my_spouse.GetFirstName] ale zjevně žádné mé obavy nesdílí.\n\nKdyž nás průvod vede ke komnatám, otočí se ke mně se smíchem a přes hulákání a bubny zavolá: „Vypadáš jako duch, [Select_CString(ROOT.Char.IsFemale,'manželko','manželi')]! Uklidni se!“"
 ep2_wedding.3200.other: "Jak hostina vrcholí, je na [shy_spouse.Custom('CZ_FirstName_L')] čím dál patrnější strach z blížícího se obřadu ukládání na lože.\n\nKdyž se průvod vydá ke komnatám, [Select_CString(shy_spouse.IsFemale,'má nová manželka','můj nový manžel')] se ke mně otočí a přes hulákání a bubnování prosí: „Prosím, nemohli bychom se bez toho obejít...?“"
 ep2_wedding.3200.closing: "\n\nDveře se rychle blíží, výkřiky slavnosti nabírají na intenzitě; obřad se chystá začít."
 ep2_wedding.3200.a: "Buďme v pokoji sami!"
 ep2_wedding.3200.a.flavor: "Rychle, zabarikádujte dveře!"
 ep2_wedding.3200.b: "Předpokládám, že se to ode mě očekává..."
 ep2_wedding.3200.c: "Prosím, miláčku, nemůžeme je zavřít ven?"
 ep2_wedding.3200.c.success: "[my_spouse.GetFirstNameNoTooltip|U] [Select_CString(my_spouse.IsFemale,'je přesvědčena','je přesvědčen')]"
 ep2_wedding.3200.c.failure: "[my_spouse.GetFirstNameNoTooltip|U] odmítne"
 ep2_wedding.3200.d: "Pojď, miláčku, bude to v pořádku."
 ep2_wedding.3200.d.success: "[my_spouse.GetFirstNameNoTooltip|U] ustoupí"
 ep2_wedding.3200.d.failure: "[my_spouse.GetFirstNameNoTooltip|U] [Select_CString(my_spouse.IsFemale,'je rozrušená','je rozrušený')]"
 ep2_wedding.3200.e: "Neblázni, je to tradice!"
 ep2_wedding_witnesses_tt: "[bedding_witness_1.GetTitledFirstName] a ostatní svědci"
 wedding_barred_bedding_log_title: "Ukládání na lože za zavřenými dveřmi"
 wedding_barred_bedding_log: "[CZProDrop(CHARACTER,'uzamkla','uzamkl')|U] dveře před svědky obřadu ukládání na lože, který se týkal [Select_CString(CHARACTER.IsFemale,'jí','jeho')] a [TARGET_CHARACTER.Custom('CZ_ShortUIName_G')]"
 wedding_barred_doors_modifier: "Ukládání na lože za zavřenými dveřmi"
 wedding_barred_doors_modifier_desc: "Tato postava si o svatební noci zajistila soukromí tím, že před přihlížejícími zamkla dveře."
 wedding_barred_bedding_doors_opinion: "Zavřené dveře při ukládání na lože"
 wedding_forced_bedding_ceremony_opinion: "Vynucený obřad ukládání na lože"
 wedding_caved_to_bedding_opinion: "Podvolení obřadu ukládání na lože"
 ep2_wedding.3300.t: "Uložení do postele"
 ep2_wedding.3300.opening: "Hlučná svatební společnost vede mě i [my_spouse.Custom('CZ_FirstName_A')] do komnat. Ozvěna výkřiků a smíchu ohlašuje obřad ukládání na lože.\n\n"
 ep2_wedding.3300.blessing: "[officiant.GetCouncilTitleFirstName|U] požehná našemu manželskému loži"
 ep2_wedding.3300.decorate: "[officiant.GetCouncilTitleFirstName|U] ozdobí naše lože květinami a věnci"
 ep2_wedding.3300.flowers: "Hosté nás posadí na naši postel posypanou věnci a květinami"
 ep2_wedding.3300.wine: ", pak nás uloží pod přikrývky, nalije poháry silného kořeněného vína a pobídne nás k pití."
 ep2_wedding.3300.anointing: ", pak nás uloží pod přikrývky a pomaže nás podle [officiant.GetFaith.Custom('CZ_AdjectiveNoTooltip_eeho')|l] zvyku."
 ep2_wedding.3300.lover: "Šťastně se na sebe díváme, zatímco se družina začíná rozcházet, konečně sami!\n\n"
 ep2_wedding.3300.friend: "Když společnost odchází, uchopíme se za ruce. Lepší pár snad ani nemůže být.\n\n"
 ep2_wedding.3300.hatred: "[Select_CString(my_spouse.IsFemale,'Má nová manželka','Můj nový manžel')] se při odchodu společnosti otočí a zašklebí odporem.\n\n"
 ep2_wedding.3300.unfriendly: "[Select_CString(my_spouse.IsFemale,'Má nová manželka','Můj nový manžel')] při odchodu společnosti nevypadá právě nadšeně.\n\n"
 ep2_wedding.3300.friendly: "Otočíme se na sebe, oba napjatí očekáváním, a družina odchází.\n\n"
 ep2_wedding.3300.polite: "Při odchodu společnosti se otočím k [my_spouse.Custom('CZ_FirstNameNoTooltip_D')]. „Tak tedy... [Select_CString(my_spouse.IsFemale,'manželko','manželi')]...!“\n\n"
 ep2_wedding.3300.jester_self: "Než se zavřou dveře, můj šašek [jester.GetFirstName] předvede oplzlou pantomimu. Vrčí a štěká jako pes."
 ep2_wedding.3300.jester: "Než se zavřou dveře, šašek [my_spouse.Custom('CZ_FirstNameNoTooltip_G')], [jester.GetFirstName], předvede oplzlou pantomimu. Vrčí a štěká jako pes."
 ep2_wedding.3300.other_friend_self: "Než se zavřou dveře, [friend.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friend'))|l], se usměje: „Hodně štěstí!“"
 ep2_wedding.3300.other_friend: "Než se zavřou dveře, [friend.GetTitledFirstName], pro [my_spouse.Custom('CZ_FirstNameNoTooltip_A')] [my_spouse.Custom2('RelationToMeShort', SCOPE.sC('friend'))|l], se usměje: „Hodně štěstí!“"
 ep2_wedding.3300.other_spouse_self: "Než se zavřou dveře, [other_spouse.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other_spouse'))|l], po nás vrhne poslední zraněný pohled."
 ep2_wedding.3300.other_spouse: "Než se zavřou dveře, [other_spouse.GetFirstName], pro [my_spouse.Custom('CZ_FirstNameNoTooltip_A')] [my_spouse.Custom2('RelationToMeShort', SCOPE.sC('other_spouse'))|l], po nás vrhne poslední zraněný pohled."
 ep2_wedding.3300.family: "Než se zavřou dveře, [family.GetFirstName], pro [my_spouse.Custom('CZ_FirstNameNoTooltip_A')] [my_spouse.Custom2('RelationToMeShort', SCOPE.sC('family'))|l], vykřikne: „#EMP Tak se mi líbíš, [Select_CString(my_spouse.IsFemale,'děvče','chlapče')]!#!“"
 ep2_wedding.3300.family_self: "Než se zavřou dveře, [family.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('family'))|l], vykřikne: „#EMP Tak se mi líbíš, [Select_CString(ROOT.Char.IsFemale,'děvče','chlapče')]!#!“"
 ep2_wedding.3300.fallback: "Dveře se zabouchnou za posledními svědky, hlučná slavnost pokračuje chodbou, ač rodiny bezpochyby naslouchají."
 ep2_wedding.3300.a: "Pojď sem, [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')] jsem na to celou noc!"
 ep2_wedding.3300.a.success: "[Select_CString(my_spouse.IsFemale,'Tvá manželka je polichocená','Tvůj manžel je polichocený')]"
 ep2_wedding.3300.a.failure: "[my_spouse.GetFirstNameNoTooltip|U] [Select_CString(my_spouse.IsFemale,'je znechucená','je znechucený')]"
 ep2_wedding.3300.b: "Oh — #EMP *ZÍV*#! — najednou mě přepadá spánek..."
 ep2_wedding.3300.b.success: "Urazíš [Select_CString(my_spouse.IsFemale,'svou manželku','svého manžela')]"
 ep2_wedding.3300.b.failure: "[my_spouse.Custom('CZ_FirstNameNoTooltip_D')] se uleví"
 ep2_wedding.3300.c: "Myslím, že na to budu potřebovat další víno!"
 ep2_wedding.3300.c.success: "[Select_CString(my_spouse.IsFemale,'Tvá manželka','Tvůj manžel')] souhlasí"
 ep2_wedding.3300.c.failure: "[my_spouse.GetFirstNameNoTooltip|U] [Select_CString(my_spouse.IsFemale,'je uražená','je uražený')]"
 ep2_wedding.3300.d: "Pro mou dynastii to udělám..."
 ep2_wedding.3300.d.success: "Navzdory počátečním obavám si to oba užijete"
 ep2_wedding.3300.d.failure: "S [my_spouse.Custom('CZ_FirstNameNoTooltip_I')] jen splníte svou povinnost"
 ep2_wedding.3400.t: "Setkání rodů"
 ep2_wedding.3400.opening: "Novomanželé se uklidili na večer, ohniště jsou zapálená, džbány naplněné a hudci přichystáni na veselí dlouho do noci.\n\n"
 ep2_wedding.3400.drink_self: "O několik hodin později sedím nad pohárem a zamlženým pohledem sleduji, jak se chová [other_family_relative.GetTitledFirstName], pro [Select_CString(other_family_spouse.IsFemale,'nevěstu','ženicha')] [other_family_spouse.Custom2('RelationToMeShort', other_family_relative)|l],"
 ep2_wedding.3400.hashish_self: "O několik hodin později přes kouř zamlženým pohledem sleduji, jak se chová [other_family_relative.GetTitledFirstName], pro [Select_CString(other_family_spouse.IsFemale,'nevěstu','ženicha')] [other_family_spouse.Custom2('RelationToMeShort', other_family_relative)|l],"
 ep2_wedding.3400.fallback_self: "O několik hodin později ospale zamrkám a sleduji, jak se chová [other_family_relative.GetTitledFirstName], pro [Select_CString(other_family_spouse.IsFemale,'nevěstu','ženicha')] [other_family_spouse.Custom2('RelationToMeShort', other_family_relative)|l],"
 ep2_wedding.3400.drink: "[Select_CString(other_family_relative.IsFemale,'která se','který se')] právě smíchem málem udusí při pití. Podává se totiž [host.Custom('RegionalAlcoholicDrink')|l].\n\n"
 ep2_wedding.3400.hashish: "[Select_CString(other_family_relative.IsFemale,'která se','který se')] právě nekontrolovatelně rozkašle smíchem.\n\n"
 ep2_wedding.3400.fallback: "[Select_CString(other_family_relative.IsFemale,'která','který')] sytě a spokojeně zívá.\n\n"
 ep2_wedding.3400.drink_family: "Pak zazní opilé blábolení: „Přiznávám! Vztah našich rodin je skv- #EMP *ŠKYT*#! skvělý! Tvůj [ROOT.Char.Custom2('RelationToMeShort', my_family_spouse)|l] a můj [other_family_relative.Custom2('RelationToMeShort', other_family_spouse)|l] jsou dobrá partie! Ať js- #EMP *ŠKYT*#! jsou šťastní!“"
 ep2_wedding.3400.drink_house: "Pak zazní opilé blábolení: „Ví- #EMP *ŠKYT*#! Víš, vámi z rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip] jsem si [Select_CString(other_family_relative.IsFemale,'nebyla jistá','nebyl jistý')], a- #EMP *ŠKYT*#! ale ty ujdeš!“"
 ep2_wedding.3400.family: "Nakonec zazní: „Přiznávám! Tvůj [ROOT.Char.Custom2('RelationToMeShort', my_family_spouse)|l] a můj [other_family_relative.Custom2('RelationToMeShort', other_family_spouse)|l] jsou dobrá partie! Ať jsou šťastní!“"
 ep2_wedding.3400.house: "Nakonec zazní: „Víš, vámi z rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip] jsem si [Select_CString(other_family_relative.IsFemale,'nebyla jistá','nebyl jistý')], ale ty ujdeš!“"
 ep2_wedding.3400.a: "To mi připomíná, potřebuji tvůj názor!"
 ep2_wedding.3400.tt: "Podnětný rozhovor"
 ep2_wedding.3400.b: "Ach! Mám v rodině někoho, koho bys [Select_CString(other_family_relative.IsFemale,'nadchla','nadchl')]! Je to [ROOT.Char.Custom2('RelationToMeShort', my_family_suitor)|l]."
 ep2_wedding.3400.b.tt: "Okamžitá alchymie"
 ep2_wedding.3400.b.success: "Padli si do oka"
 ep2_wedding.3400.b.failure: "Jsou jen zdvořilí"
 ep2_wedding.3400.c.drink: "Více piva! Ještě!"
 ep2_wedding.3400.c.hashish: "Více hašiše! Ještě!"
 ep2_wedding.3400.d: "Musíme zůstat ve spojení, teď jsme rodina!"
 ep2_wedding.3400.e: "Řekni mi, jsou [Select_CString(other_family_relative.IsFemale,'všechny ženy','všichni muži')] z rodu [other_family_relative.GetHouse.GetBaseNameNoTooltip] tak [Select_CString(other_family_relative.IsFemale,'krásné','krásní')]?"
 ep2_wedding.3400.e.success: "[other_family_relative.GetFirstNameNoTooltip|U] roztaje"
 ep2_wedding.3400.e.failure: "[other_family_relative.GetFirstNameNoTooltip|U] ucukne"
 ep2_wedding.3410.t: "Nová konkurence"
 ep2_wedding.3410.opening: "Za novomanželi se zabouchnou dveře a chodbami se nese tlumený smích a výskot. Znovu klesnu na židli v hodovní síni. Nedokážu přestat myslet na [jealousy_focus.Custom('CZ_FirstName_A')] a [jealousy_usurper.Custom('CZ_FirstName_A')]...\n\n"
 ep2_wedding.3410.double: "Oba mi jsou drazí, ale obáti se, co by mohlo ráno změnit v jejich náklonnosti ke mně, zatímco jsou teď pohlceni slavnostní vášní."
 ep2_wedding.3410.lover: "Má láska, můj [ROOT.Char.Custom2('RelationToMeShort', jealousy_focus)|l], si užívá cizího doteku. Vím, že má povinnosti, ale ostny zabodávající se mi do srdce tím nebolí o nic méně."
 ep2_wedding.3410.primary: "Vím, že pro [jealousy_focus.Custom('CZ_FirstName_A')] jsem stále [Select_CString(ROOT.Char.IsFemale,'první a hlavní manželkou','prvním a hlavním manželem')]. Bojím se ale, co přinese, když okusí kouzlo [Select_CString(jealousy_usurper.IsFemale,'nové ženy','nového muže')]."
 ep2_wedding.3410.secondary: "[Select_CString(jealousy_usurper.IsFemale,'Další manželka','Další manžel')] do sbírky [jealousy_focus.Custom('CZ_FirstName_G')]. Další konkurence v boji o [Select_CString(jealousy_focus.IsFemale,'její','jeho')] čas a náklonnost."
 ep2_wedding.3410.double_opinion: "\n\nA co já? Prokletý bolestný trojúhelník..."
 ep2_wedding.3410.positive_opinion: "\n\nNezapomene na mě... že ne...?"
 ep2_wedding.3410.negative_opinion: "\n\nA co mě to zajímá?! Proč mě ten [jealousy_focus.Custom2('InsultNoun', ROOT.Char)] tak štve..."
 ep2_wedding.3410.indifferent_opinion: "\n\nMusím dbát na své postavení, dříve než to udělá za mě tento [jealousy_usurper.Custom2('InsultNoun', ROOT.Char)]."
 ep2_wedding.3410.a: "Dám jim vědět, jak se cítím #EMP já#!!"
 ep2_wedding.3410.a.flavor: "Ty dveře mě nezastaví!"
 ep2_wedding.3410.b: "[jealousy_focus.GetFirstNameNoTooltip|U] je #EMP [Select_CString(jealousy_focus.IsFemale,'moje','můj')]!#!"
 ep2_wedding.3410.b.tt: "Intrika obdrží [GetModifier('wedding_consorts_envy_modifier').GetNameWithTooltip]"
 ep2_wedding.3410.c: "Mé srdce je zlomené..."
 ep2_wedding.3410.d: "Méně pozornosti od [jealousy_focus.Custom('CZ_FirstNameNoTooltip_G')] může mít i výhody."
 every_usurper_close_family_tt: "Blízcí členové rodiny [Select_CString(jealousy_usurper.IsFemale,'nevěsty','ženicha')]"
 revealed_lover_wedding_night_opinion: "Tajný cizoložník"
 wedding_consorts_envy_modifier: "Žárlivost choti"
 ruined_wedding_night_opinion: "Zničená svatební noc"
 wedding_old_news_modifier: "Staré zprávy"
 wedding_old_news_modifier_desc: "Tato postava přivítala nový vztah svého partnera, hledající úlevu."
 ep2_wedding.3420.t: "Do noci"
 ep2_wedding.3420.opening: "Novomanželé odešli, rodiny je odeslaly do ložnice, aby dokonali svůj sňatek. My ostatní se vracíme do sálu slavit a bavit se.\n\n"
 ep2_wedding.3420.eat: "Můj pohled se okamžitě stočí k hostinským stolům; sladké vůně zbylého jídla jsou skoro neodolatelné.\n\n"
 ep2_wedding.3420.drink: "Mnozí hosté právě zahajují další fázi slavnosti, povzbuzují hudce a začínají další kolo tance.\n\n"
 ep2_wedding.3420.lech: "Po všech těch řečech o slibech a ukládání na lože mi mysl hned uteče k nevyslovitelným skutkům, kterým se šťastný pár právě jistě oddává.\n\n"
 ep2_wedding.3420.steal: "Celý večer nás obklopuje přepych. [host.Custom('FortifiedBuilding')|U] oplývá tolika věcmi, že mi nedá nepřemýšlet, které by jejich majitelé nepostrádali.\n\n"
 ep2_wedding.3420.flee: "Celý den v zajetí cizích tváří, zatímco se obřad a pak hostina nekonečně vlečou. Jaká úleva mít konečně volnost.\n\n"
 ep2_wedding.3420.charity: "Po celý den cítím vinu nad honosností oslav, zatímco chudí sedláci a služebníci jen za zdmi bojují.\n\n"
 ep2_wedding.3420.social: "Dnes už poznávám tolik nových tváří, a přesto chci potkat další hosty, než tahle společenská příležitost nevyhnutelně skončí.\n\n"
 ep2_wedding.3420.posture: "Když se rozhlížím po rozmanitých hostech v jejich zdobení a pompě, cítím nutkání udělat kolečko a dát o sobě všem vědět.\n\n"
 ep2_wedding.3420.blab: "V obklopení tolika lidí se ze všech sil snažím neprozradit, co vím o nekalostech [blab_guest.Custom('CZ_TitledFirstName_G')]. Nevím ale, jak dlouho ještě vydržím!\n\n"
 ep2_wedding.3420.blab_self: "[Select_CString(ROOT.Char.IsFemale,'Obklopena','Obklopen')] tolika lidmi se snažím nést břemeno svých tajemství, aniž bych něco [Select_CString(ROOT.Char.IsFemale,'prozradila','prozradil')], ale nevím, jak dlouho to vydržím!\n\n"
 ep2_wedding.3420.scheme: "Díti se na hemžící se hosty, opilé a nafouklé po dni veselí, a přemýšlím, jaké lahůdky z jejich překroucených jazyků dnes vypadly.\n\n"
 ep2_wedding.3420.help: "Pohlédnu na společnost a hřeje mě radostná příležitost. Z úsměvů a svornosti čerpám sílu. Ale kdo je ta shrbená postava?\n\n"
 ep2_wedding.3420.pray: "Obřady jsou za námi a sliby vysloveny. Šťastný pár mě naplňuje nadějí i obavami. Kolik zkoušek partnerství a rodičovství je ještě čeká.\n\n"
 ep2_wedding.3420.closing: "Zbytek večera je můj, užiji si ho, jak chci..."
 ep2_wedding.3420.a: "Doufám, že v kuchyni ještě zbylo něco k jídlu. [ROOT.Char.Custom('RegionalEdibleMeat')|U] by se hodilo!"
 ep2_wedding.3420.b: "Konečně se můžu #EMP opravdu#! uvolnit!"
 ep2_wedding.3420.c: "Tak, kam se poděl ten hbitý sluha?"
 ep2_wedding.3420.d: "Není lepší čas prohrabat komnaty..."
 ep2_wedding.3420.e: "Konečně se můžu dostat z tohoto zatraceného místa!"
 ep2_wedding.3420.f: "Dnes večer se musím postarat o chudáky [CZPrepV(ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip)] [ROOT.Char.GetCurrentLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')]."
 ep2_wedding.3420.g: "Chci si promluvit s [social_guest.Custom('CZ_FirstNameNoTooltip_I')]."
 ep2_wedding.3420.h: "Má přítomnost zde dnes nesmí být zastíněna."
 ep2_wedding.3420.i: "Tohle tajemství mě zabíjí, někdo to musí vědět!"
 ep2_wedding.3420.j: "Podívejme se, co dnes služebnictvo zaslechlo..."
 ep2_wedding.3420.j.tt: "Odhalíš něčí [Concept('secret','tajemství')|E]"
 ep2_wedding.3420.k.drink: "Vypadá to, že [help_guest.GetFirstNameNoTooltip] [Select_CString(help_guest.IsFemale,'vypila','vypil')] trochu moc..."
 ep2_wedding.3420.k.health: "[Select_CString(help_guest.IsFemale,'Nebohá','Nebohý')] [help_guest.GetFirstNameNoTooltip] by zřejmě [Select_CString(help_guest.IsFemale,'potřebovala','potřeboval')] pomoc..."
 ep2_wedding.3420.k.fallback: "[Select_CString(help_guest.IsFemale,'Nebohá','Nebohý')] [help_guest.GetFirstNameNoTooltip] zřejmě usíná..."
 ep2_wedding.3420.k.flavor: "#EMP Nahoru#! Jdeme! Tudy..."
 ep2_wedding.3420.l: "Teď tam, kde stojí [host.GetFaith.HouseOfWorship|l], bude klid."
 ep2_wedding.3420.l.flavor: "Kéž [ROOT.Char.GetFaith.HighGodName] požehná tomuto svazku a dopřeje mu štěstí."
 secret_discovered_toast: "Tajemství odhaleno"
 ep2_wedding.3500.t: "Dynastické pochyby"
 ep2_wedding.3500.intro: "Po dlouhém dni čekání a rozmlouvání nás zmáhá únava. Já, [ROOT.Char.Custom2('RelationToMeShort', my_family_relative_1)|l] a [ROOT.Char.Custom2('RelationToMeShort', my_family_relative_2)|l] se usadíme ke stolu a začneme probírat ten sňatek."
 ep2_wedding.3500.intro_plural: "Po dlouhém dni čekání a rozmlouvání nás zmáhá únava. Já a [ROOT.Char.Custom2('GetFamilyRelationPlural', my_family_relative_1)|l] se usadíme ke stolu a začneme probírat ten sňatek."
 ep2_wedding.3500.intro_connector: "\n\n[my_family_relative_1.GetFirstName|U] tiše promluví: „Víš,"
 ep2_wedding.3500.relation_shared: " mám o [Select_CString(my_family_spouse.IsFemale,'ni','něj')] strach. Je to přece náš [my_family_relative_1.Custom2('RelationToMeShort', my_family_spouse)|l]. Opravdu mám."
 ep2_wedding.3500.relation: " musím říct, že pořád pochybuji. Je to můj [my_family_relative_2.Custom2('RelationToMeShort', my_family_spouse)|l] a mám o [Select_CString(my_family_spouse.IsFemale,'ni','něj')] strach."
 ep2_wedding.3500.young: " [other_family_spouse.GetFirstName] je na [Select_CString(my_family_spouse.IsFemale,'ni','něj')] prostě #EMP příliš#! [Select_CString(other_family_spouse.IsFemale,'mladá','mladý')]. Tohle skončí slzami.“"
 ep2_wedding.3500.old: " [other_family_spouse.GetFirstName] je příliš [Select_CString(other_family_spouse.IsFemale,'stará','starý')]. Nemůže [Select_CString(my_family_spouse.IsFemale,'ji','ho')] přece udělat [Select_CString(my_family_spouse.IsFemale,'šťastnou','šťastným')]. Taková je pravda."
 ep2_wedding.3500.bold: " [other_family_spouse.GetFirstName] je [Select_CString(other_family_spouse.IsFemale,'svéhlavá','svéhlavý')], zatímco náš protějšek je pokorný. Bude [Select_CString(my_family_spouse.IsFemale,'ji','ho')] mít pod palcem.“"
 ep2_wedding.3500.shy: " [other_family_spouse.GetFirstName] je [Select_CString(other_family_spouse.IsFemale,'krotká','krotký')] jako beránek. Co může taková povaha nabídnout někomu takovému, jako je [Select_CString(my_family_spouse.IsFemale,'ona','on')], [Select_CString(my_family_spouse.IsFemale,'žena','muž')] úplně jiného ražení?“"
 ep2_wedding.3500.dishonorable: " [Select_CString(other_family_spouse.IsFemale,'Ta žena','Ten muž')] nemá čest. Celý den [Select_CString(other_family_spouse.IsFemale,'ji','ho')] sleduji. [my_family_spouse.Custom('CZ_FirstName_D')] přinese jen trápení.“"
 ep2_wedding.3500.dislike: " Tahle osoba, ten [other_family_spouse.Custom2('InsultAdjective', SCOPE.sC('my_family_relative_1'))|l] [other_family_spouse.GetWomanMan|l], je teď skvrnou na pověsti naší rodiny. Takový [other_family_spouse.Custom2('InsultNoun', SCOPE.sC('my_family_relative_1'))|l] nepřinese [my_family_spouse.Custom('CZ_FirstName_D')] nic dobrého!“"
 ep2_wedding.3500.health: " Je to neduživá přítěž. [my_family_spouse.Custom('CZ_FirstName_D')] neposkytne oporu v [Select_CString(my_family_spouse.IsFemale,'jejích','jeho')] zkouškách ani zájmech. Tohle není rozumné.“"
 ep2_wedding.3500.realms: " Ten svazek otevírá cestu intrikám. Jejich [other_family_spouse.GetHouse.GetHeadOfHouse.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_yy')|l] původ dává tušit, že chtějí zevnitř zničit [my_family_spouse.GetHouse.GetHeadOfHouse.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_A')] i rod [other_family_spouse.GetHouse.GetBaseNameNoTooltip].“"
 ep2_wedding.3500.lowborn: " [Select_CString(other_family_spouse.IsFemale,'Obyčejná žena','Obyčejný muž')] jako [Select_CString(other_family_spouse.IsFemale,'ona','on')] je pod důstojnost naší rodiny. [my_family_spouse.Custom('CZ_FirstName_D')] přinese jen ostudu.“"
 ep2_wedding.3500.beauty: " Jen se podívej, jak vypadá. Hrůza pomyslet, jak bude [my_family_spouse.GetFirstName] plnit svou povinnost. A jak teprve budou vypadat jejich děti...“"
 ep2_wedding.3500.renown: " Takový [other_family_spouse.Custom2('InsultNoun', SCOPE.sC('my_family_relative_1'))|l] z provinčního rodu [other_family_spouse.GetHouse.GetBaseNameNoTooltip] je pod důstojnost tak velikého rodu, jako je [my_family_spouse.GetHouse.GetBaseNameNoTooltip]. Už pouhé spojení pošpiní [my_family_spouse.Custom('CZ_FirstName_A')]...“"
 ep2_wedding.3500.criminal: " Je to zrůda. Celý večer se nemluví o ničem jiném! Jak jsme se mohli spojit s takovým stvořením, jako je ten [other_family_spouse.Custom2('InsultNoun', SCOPE.sC('my_family_relative_1'))|l]?! Doufám, že to [Select_CString(my_family_spouse.IsFemale,'nebohá','nebohý')] [my_family_spouse.GetFirstName] přečká...“"
 ep2_wedding.3500.fornicator: " [Select_CString(other_family_spouse.IsFemale,'Ta žena je známá prostopášnice','Ten muž je známý prostopášník')], [Select_CString(other_family_spouse.IsFemale,'poskvrněná','poskvrněný')] bezpočtem milenců. Jak můžeme připustit takové poškození jména [my_family_spouse.Custom('CZ_FirstName_G')]?! Jen pomysli na ty pomluvy, řeči a vtipy!“"
 ep2_wedding.3500.fallback: " Něco na [Select_CString(other_family_spouse.IsFemale,'ní','něm')] nesedí. Ten divný pohled... Jistě sis toho také [Select_CString(my_family_relative_1.IsFemale,'všimla','všiml')]? Doufám, že [my_family_spouse.GetFirstName] ano...“"
 ep2_wedding.3500.faith: " Jak se dá někomu takovému věřit? Vždyť je to [my_family_relative_1.Custom2('GetUnbelieverTerm', other_family_spouse)|l]! [my_family_spouse.GetFirstName] kvůli [Select_CString(other_family_spouse.IsFemale,'ní','němu')] zapomene, že nad námi bdí [my_family_relative_1.GetFaith.HighGodName].“"
 ep2_wedding.3500.agree: "\n\n„Asi máš pravdu, [my_family_relative_2.Custom2('CZ_RelationToMeShort_V', my_family_relative_1)|l],“ povzdechne si [my_family_relative_2.GetFirstName]. „Tohle spojení vypadá katastrofálně.“"
 ep2_wedding.3500.alliance: "\n\n„Snad chápeš, [my_family_relative_2.Custom2('CZ_RelationToMeShort_V', my_family_relative_1)|l],“ napomene [my_family_relative_2.GetFirstName], „že spojenectví s rodem [other_family_spouse.GetHouse.GetBaseNameNoTooltip] musí mít přednost před [Select_CString(my_family_spouse.IsFemale,'jejím','jeho')] štěstím.“"
 ep2_wedding.3500.compromise: "\n\n„Nech těch pochyb, [my_family_relative_2.Custom2('CZ_RelationToMeShort_V', my_family_relative_1)|l],“ odsekne [my_family_relative_2.GetFirstName]. „Politika vyžaduje kompromisy.“"
 ep2_wedding.3500.time: "\n\n„No tak, [my_family_relative_2.Custom2('CZ_RelationToMeShort_V', my_family_relative_1)|l],“ povzdechne si [my_family_relative_2.GetFirstName]. „Dej tomu čas! Než vyneseš takový soud, dopřej jim aspoň měsíc společného života.“"
 ep2_wedding.3500.a: "Obávám se, že jsi blízko pravdy, [ROOT.Char.Custom2('CZ_RelationToMeShort_V', my_family_relative_1)|l]..."
 ep2_wedding.3500.b: "Věř mi, je to dobrá partie."
 ep2_wedding.3500.d: "A co na tom? Nechte lásku bardům."
 ep2_wedding.3500.e: "Teď rozhodne [ROOT.Char.GetFaith.HighGodName]."
 ep2_wedding.4000.t: "Kdo je další?"
 ep2_wedding.4000.desc.intro: "Když novomanželé skládají sliby, pohlédnu na [matchmaked_scope.Custom('CZ_TitledFirstName_A')] a radostně tleskám. Snažím se [Select_CString(matchmaked_scope.IsFemale,'jí','mu')] najít vhodný protějšek. Tahle chvíle se přímo nabízí k připomenutí manželských radostí.\n\n„Nejsou rozkošní?“ zeptám se nevinně a pohledem hledám mezi hosty vhodnou partii."
 ep2_wedding.4000.desc.good_match: "Už jsem [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')] [matchmaked_scope.Custom('CZ_FirstNameNoTooltip_A')] rozmlouvat s [objective_scope.Custom('CZ_TitledFirstName_I')]. Slušelo jim to spolu..."
 ep2_wedding.4000.desc.no_match: "\n\nVím, že už [Select_CString(matchmaked_scope.IsFemale,'dříve mluvila','dříve mluvil')] s [objective_scope.Custom('CZ_TitledFirstName_I')], i když z toho nijak zvlášť [Select_CString(matchmaked_scope.IsFemale,'nadšená nebyla','nadšený nebyl')]."
 ep2_wedding.4000.a: "„Proč je nenapodobit s [objective_scope.Custom('CZ_ShortUINameNoTooltip_I')]?“"
 ep2_wedding.4000.a.success: "[matchmaked_scope.GetFirstNameNoTooltip|U] poslechne tvou radu"
 ep2_wedding.4000.a.failure: "[matchmaked_scope.GetFirstNameNoTooltip|U] odmítne poslouchat"
 ep2_wedding.4000.b: "„[objective_scope.GetShortUINameNoTooltip|U] vypadá tak osaměle...“"
 ep2_wedding.4000.b.success: "[matchmaked_scope.GetFirstNameNoTooltip|U] si promluví s [objective_scope.Custom('CZ_FirstNameNoTooltip_I')]"
 ep2_wedding.4000.c: "Nemyslím, že by tvořili dobrý pár."
 ep2_wedding_4000_log_success_title: "Skvělé spárování"
 ep2_wedding_4000_log_success: "[CHARACTER.GetFirstNameNoTooltip|U] [Select_CString(CHARACTER.IsFemale,'našla','našel')] pro [TARGET_CHARACTER.Custom('CZ_FirstNameNoTooltip_A')] vhodnou partii"
 ep2_wedding.2010.t: "Legendární host"
 ep2_wedding.2010.desc.intro: "Hostina mi začíná připadat trochu... nevýrazná. Žádné honosné hedvábí ani tapiserie, žádné ryzí zlato, žádné vzácné drahokamy. Pohlédnu z okna a noční obloha mě zvláštně inspiruje.\n\nTam venku žije bílá zvěř. Volně se toulá našimi lesy a skrývá se mezi stromy. Ulovit takové zvíře je legendární čin.\n\nMožná bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] prostě jedno naše zvíře natřít nabílo? Je to přece [ROOT.Char.Custom('GetAnimalType')|l]..."
 ep2_wedding.2010.desc_spouse: "\n\nJak jinak mohu uctít svou vlastní svatbu?"
 ep2_wedding.2010.a: "Musím pospíšit, řeknu služebnictvu, aby začali ihned."
 ep2_wedding.2010.a.tt: "Pomůže ti to #EMP získat věhlas#!, ale bystrý host může pojmout podezření..."
 ep2_wedding.2010.b: "Riziko je příliš velké."
 ep2_wedding.2010.impressed_list: "Každý přítomný host s družnou, veselou, pijáckou, statečnou, loveckou či galantní povahou"
 wbanquet_white_animal_opinion: "Legendární host"
 wbanquet_white_animal_opinion_desc: "Tato postava byla ohromena vstupem bílého zvířete během svatební hostiny"
 ep2_wedding.2011.t: "$ep2_wedding.2010.t$: Vzbuzení podezření"
 ep2_wedding.2011.desc: "Do sálu vstoupí [ROOT.Char.Custom('GetAnimalType')|l]. Bledá srst se v měsíčním světle jasně leskne, skoro fosforeskuje, září nepřirozeným jasem. Podvod je téměř dokonalý. Zázrak. Hosté stojí v úžasu a rychle se přiblíží. Dotknout se zvířete se ale neodváží, vždyť je posvátné.\n\nMezi lidmi však zahlédnu [doubting_guest.Custom('CZ_TitledFirstName_A')], jak protáčí oči. „Copak nevidíte, že je to jen barva? [ROOT.Char.GetTitledFirstNameNoTooltip] nás asi má všechny za hlupáky.“"
 ep2_wedding.2011.a: "Ach, už nemá smysl udržovat iluzi."
 ep2_wedding.2011.b: "„Jak se opovažuješ o mně pochybovat v den mé hostiny?“"
 ep2_wedding.2011.b.success: "[doubting_guest.GetFirstNameNoTooltip|U] ti neochotně uvěří"
 ep2_wedding.2011.b.failure: "[doubting_guest.GetFirstNameNoTooltip|U] ti nevěří ani slovo"
 ep2_wedding.2020.t: "Ne příliš dobře"
 ep2_wedding.2020.desc: "Po stolech kolují mísy těch nejvybranějších jídel. [host.Custom('GetExpensiveMeal')|U] i [host.Custom('GetExpensiveDessert')|l] plní místnost lahodnou vůní.\n\n[host.GetTitledFirstName] to s přípravami opravdu [Select_CString(host.IsFemale,'přehnala','přehnal')]. I studna na nádvoří je plná nápoje [host.Custom('GetExpensiveDrink')|l], který se nabírá stříbrným vědrem na stříbrném řetězu.\n\nKdyž se zvědavě přiblížím, spatřím [drunk_guest.Custom('CZ_TitledFirstName_A')] s pohárem v ruce, jak nebezpečně klopýtá kolem okraje."
 ep2_wedding.2020.a: "„Ještě si ublížíš... Pojď sem, [Select_CString(drunk_guest.IsFemale,'přítelkyně','příteli')].“"
 ep2_wedding.2020.a.success: "Přesvědčíš [drunk_guest.Custom('CZ_FirstNameNoTooltip_A')] k odchodu"
 ep2_wedding.2020.a.failure: "[drunk_guest.GetFirstNameNoTooltip|U] spadne do studny"
 ep2_wedding.2020.b: "Zůstanu tady tiše a budu se dívat."
 ep2_wedding.2020.b.success: "[drunk_guest.GetFirstNameNoTooltip|U] nespadne"
 ep2_wedding.2020.c: "„Tak!“"
 ep2_wedding.2020.c.success: "Podaří se ti shodit [drunk_guest.Custom('CZ_FirstNameNoTooltip_A')] do studny"
 ep2_wedding.2020.c.failure: "[drunk_guest.GetFirstNameNoTooltip|U] tvému strčení odolá"
 ep2_wedding.2020.c.death: "[drunk_guest.GetFirstNameNoTooltip|U] při pádu zemře"
 ep2_wedding.wedding_intent.success.tt: "Tvůj záměr [THIS.Char.GetInvolvedActivityIntent.GetName|l] uspěje"
 ep2_wedding.2000.t: "Přítel přítele"
 ep2_wedding.2000.desc.intro: "Z dálky pozoruji [diplo_target.Custom('CZ_TitledFirstName_A')]. Brzy mi dojde, že nemohu prostě přijít, začít mluvit o počasí, nejnovějších lékařských pojednáních či válce a doufat, že z toho vznikne spojenectví.\n\nNa druhé straně místnosti zahlédnu, jak [target_friend.Custom2('MyCharacterIntroduction', ROOT.Char)|l] spokojeně vyprazdňuje poháry. Podává se [ROOT.Char.Custom('RegionalAlcoholicDrink')|l]. Pro [diplo_target.Custom('CZ_FirstNameNoTooltip_A')] je to [SCOPE.sC('diplo_target').Custom2('RelationToMeShort', SCOPE.sC('target_friend'))|l], to je známo.\n\n„Řekni mi, co [diplo_target.Custom('CZ_FirstNameNoTooltip_A')] vlastně zajímá?“ zeptám se pozorně.\n\n"
 ep2_wedding.2000.desc.lustful: "„Ha! Pod pasem někoho, to ti řeknu!“"
 ep2_wedding.2000.desc.nerd: "„Jen... jen mluv o knihách a o tom, jak moc nesnášíš vycházet ven.“"
 ep2_wedding.2000.desc.valiant: "„Ach, [Select_CString(diplo_target.IsFemale,'nejstatečnější ze žen','nejstatečnější z mužů')], znalec války a jejího umění.“"
 ep2_wedding.2000.desc.social: "„Tady, samozřejmě! Okamžik oslavy, dobrého jídla, vynikajícího pití a té nejvznešenější společnosti.“"
 ep2_wedding.2000.desc.fishy: "„U dvora je jako doma! Umění stínů [Select_CString(diplo_target.IsFemale,'studovala','studoval')] opravdu důkladně.“"
 ep2_wedding.2000.a: "Skvělé! Využijme toho hned!"
 ep2_wedding.2000.a.tt: "Oslovíš [diplo_target.Custom('CZ_FirstNameNoTooltip_A')]"
 ep2_wedding.2000.b: "Jak poznám, že [Select_CString(target_friend.IsFemale,'jí','mu')] mohu věřit?"
 ep2_wedding.2000.b.success.tt: "Získáš bonus k [Concept('schemes','intrikám')|E] typu [GetScheme('befriend').GetTypeName|l] zaměřeným na [diplo_target.Custom('CZ_FirstNameNoTooltip_A')]"
 ep2_wedding.2000.b.success: "[target_friend.GetFirstNameNoTooltip|U] zřejmě mluví pravdu"
 ep2_wedding.2000.b.failure: "[target_friend.GetFirstNameNoTooltip|U] [Select_CString(target_friend.IsFemale,'je uražená','je uražený')] tvou nedůvěrou"
 ep2_wedding.2001.t: "$ep2_wedding.2000.t$"
 ep2_wedding.2001.desc: "S novými poznatky se obratně přiblížím k [diplo_target.Custom('CZ_TitledFirstName_D')]. U jiného stolu s bohatým ubrusem si užívá hostinu i společnost. „Můžeme prohodit pár slov, [diplo_target.Custom('CZ_TitleAsNameNoTooltip_V')|l]?“ zeptám se. „[Select_CString(ROOT.Char.IsFemale,'Nerada bych rušila','Nerad bych rušil')] vaše rokování.“\n\n[diplo_target.GetTitledFirstNameNoTooltip|U] pozvedne obočí. V očích se objeví zvědavost. „Ale jistě. Copak tě ke mně přivádí, [Select_CString(ROOT.Char.IsFemale,'vznešená','vznešený')] [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')]?“"
 ep2_wedding.2001.a: "„Chceš se vykrást a najít nějaké... vybrané hosty?“"
 ep2_wedding.2001.b: "„Nihil est miserum nisi cum putes, jak říká filozof.“"
 ep2_wedding.2001.b.flavor: "#EMP Nic není bídné, pokud to za bídné nepokládáš#!."
 ep2_wedding.2001.b.dull: "„Tak... už víš o... nějaké smlouvě?“"
 ep2_wedding.2001.c: "„Už víš o baronově tažení? To bylo obléhání!“"
 ep2_wedding.2001.d: "„Prosím, jez a pij se mnou a kéž tahle hostina trvá celé dny!“"
 ep2_wedding.2001.e: "„#EMP Psst#!, už víš o těch zvěstech o dvorním spiknutí?“"
 ep2_wedding.2000.after.alliance: "[diplo_target.GetShortUINameNoTooltip|U] tě považuje za [Select_CString(ROOT.Char.IsFemale,'mocnou spojenkyni','mocného spojence')]"
 ep2_wedding.2000.after.alliance.tt: "Uzavřeš spojenectví s [diplo_target.Custom('CZ_FirstNameNoTooltip_I')]"
 ep2_wedding.2000.after.subjugate: "[diplo_target.GetShortUINameNoTooltip|U] chce přijmout tvou lenní svrchovanost"
 ep2_wedding.2000.after.subjugate.tt: "[diplo_target.GetFirstNameNoTooltip|U] ti přísahá věrnost"
 ep2_wedding.2000.after.friends: "[diplo_target.GetShortUINameNoTooltip|U] tě považuje za spřízněnou duši"
 ep2_wedding.2000.after.insult: "[diplo_target.GetShortUINameNoTooltip|U] [Select_CString(diplo_target.IsFemale,'je uražená','je uražený')] představou, že by [Select_CString(diplo_target.IsFemale,'ji','ho')] něco takového vůbec mohlo zajímat"
 ep2_wedding.2000.after.insult.short: "[diplo_target.GetFirstNameNoTooltip|U] [Select_CString(diplo_target.IsFemale,'je uražená','je uražený')]"
 ep2_wedding.1330.t: "[Select_CString(spouse.IsFemale,'Má milenka, má manželka','Můj milenec, můj manžel')]"
 ep2_wedding.1330.desc: "Kolik svatebních hostů tušilo, že [spouse.GetTitledFirstName] už [Select_CString(spouse.IsFemale,'byla mou milenkou','byl mým milencem')]? Za zavřenými dveřmi nemusíme nic předstírat. Známý dotek, důvěrná znalost [Select_CString(spouse.IsFemale,'jejího','jeho')] těla... To všechno mi teď zůstane.\n\nHledím na svou lásku, nyní [Select_CString(spouse.IsFemale,'i svou manželku','i svého manžela')], a hlavou mi proběhne jediná myšlenka..."
 ep2_wedding.1330.a: "Miluji [Select_CString(spouse.IsFemale,'tu ženu','toho muže')] víc, než lze vyjádřit slovy."
 ep2_wedding.1330.b: "Nikoho jiného než [Select_CString(spouse.IsFemale,'ji','jeho')] už nikdy nebudu potřebovat."
 ep2_wedding.1330.c: "Polepším se a budu [Select_CString(ROOT.Char.IsFemale,'věrná','věrný')]!"
 ep2_wedding.1330.c.rakish.success: "Opravdu se snažíš změnit"
 ep2_wedding.1330.c.rakish.failure: "Tvé sliby jsou prázdné"
 ep2_wedding.1330.c.breakup: "[ROOT.Char.GetFirstNameNoTooltip|U] mě opouští z lásky ke [Select_CString(spouse.IsFemale,'své manželce','svému manželovi')]"
 ep2_wedding.1330.d: "Zajímalo by mě, jestli [Select_CString(spouse.IsFemale,'ji','ho')] láká... ta jedna věc?"
 ep2_wedding.1330.d.yuck: "[spouse.GetFirstNameNoTooltip|U] je [Select_CString(spouse.IsFemale,'znechucena','znechucen')] mou zvrhlostí"
 ep2_wedding.1330.d.yuck.tt: "$ep2_wedding.1330.d.yuck$"
 ep2_wedding.1330.d.yum: "[spouse.GetFirstNameNoTooltip|U] mé dobrodružné choutky zaujmou"
 ep2_wedding.1330.d.yum.tt: "$ep2_wedding.1330.d.yum$"
 ep2_wedding.1330.d.yeahmetoo: "[spouse.GetFirstNameNoTooltip|U] odhalí, že má vlastní dobrodružné chutě"
 ep2_wedding.1330.d.yeahmetoo.tt: "$ep2_wedding.1330.d.yeahmetoo$"
 ep2_wedding.1330.d.confession.tt: "[spouse.GetFirstNameNoTooltip|U] ti řekne, zda sdílí tvé sklony"
 ep2_wedding.1330.e: "Jak jsem to [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] udělat [soulmate.Custom('CZ_FirstNameNoTooltip_D')]?"
 ep2_wedding.1330.f: "Jsem opravdu [Select_CString(spouse.IsFemale,'její','jeho')] jedinou láskou?"
 ep2_wedding.1330.f.mindatease: "Ujišťování [spouse.Custom('CZ_ShortUIName_G')] mě uklidní"
 ep2_wedding.1330.f.mindatease.tt: "[spouse.GetFirstNameNoTooltip|U] ti uklidní mysl"
 ep2_wedding.1330.f.lingeringdoubts: "[spouse.GetFirstNameNoTooltip|U] tvrdí, že miluje jen mě, ale pochyby mě trápí"
 ep2_wedding.1330.f.lingeringdoubts.tt: "Pochybnosti tě nadále sužují"
 ep2_wedding.1330.f.confession: "[spouse.GetFirstNameNoTooltip|U] přizná své jiné lásky"
 ep2_wedding.1330.f.confession.desc: "Pravda vyjde najevo"
 ep2_wedding.1330.f.confession.tt: "[spouse.GetFirstNameNoTooltip|U] prozradí, zda má další milence"
 ep2_wedding.1330.g: "Konečně nemusíme skrývat naši lásku!"
 ep2_wedding.1340.t: "Soustrast k tvé svatbě"
 ep2_wedding.1340.desc.intro: "„Je mi tě líto...“ Jsem pro [cynic.Custom('CZ_TitledFirstName_A')] [cynic.Custom2('RelationToMe', SCOPE.sC('nervous_spouse'))|l], a tak mi začne vykládat o manželském životě: "
 ep2_wedding.1340.i_would_know: "„Mám s tím zkušenost,“ zabručí."
 ep2_wedding.1340.like_me_and: "„Jako já a [disliked_spouse.GetFirstName],“ zabručí."
 ep2_wedding.1340.cheating: "manželé podvádějící manželky, manželky podvádějící manžely, průvod lží a ponížení."
 ep2_wedding.1340.desc.dislikes_spouse: "plné hádek, nedůvěry a svárů, konec jakéhokoli klidu. $ep2_wedding.1340.like_me_and$"
 ep2_wedding.1340.desc.dislikes_spouse_lustful: "studená postel a [Select_CString(intended.IsFemale,'podezíravá manželka','podezíravý manžel')]. Okovy na tvých radostech. $ep2_wedding.1340.like_me_and$"
 ep2_wedding.1340.desc.divorced: "pomalý, bolestný pochod k okamžiku, kdy zjistíte, kdo koho odkopne. „Jako já a [divorced_spouse.GetFirstName],“ zabručí."
 ep2_wedding.1340.desc.cheated_on: "$ep2_wedding.1340.cheating$ $ep2_wedding.1340.i_would_know$"
 ep2_wedding.1340.desc.cheated_on_alt: "$ep2_wedding.1340.cheating$ „Jako já a [adulterous_spouse.GetFirstName],“ zabručí."
 ep2_wedding.1340.desc.outro: "\n\nTakhle bude vypadat i mé manželství s [intended.Custom('CZ_TitledFirstName_I')]?"
 ep2_wedding.1340.a: "[intended.GetFirstNameNoTooltip|U] je pro mě [Select_CString(intended.IsFemale,'dokonalá','dokonalý')]."
 ep2_wedding.1340.a.tt: "Hodíme se k sobě?"
 ep2_wedding.1340.a.success: "Jsi [Select_CString(ROOT.Char.IsFemale,'přesvědčena','přesvědčen')], že ti [intended.GetFirstNameNoTooltip] bude vyhovovat"
 ep2_wedding.1340.a.failure: "Obáváš se, že ti [intended.GetFirstNameNoTooltip] nebude vyhovovat"
 ep2_wedding.1340.b: "Neměj o mě starosti, budu mít své koníčky!"
 ep2_wedding.1340.b.tt: "Dokážou mi skutečně přinést štěstí?"
 ep2_wedding.1340.b.success: "Jsi [Select_CString(ROOT.Char.IsFemale,'přesvědčena','přesvědčen')], že tvůj životní styl zůstane stejný"
 ep2_wedding.1340.b.failure: "Obáváš se, že manželství změní tvůj životní styl"
 ep2_wedding.1340.c: "Neměj o mě starosti, budu mít své... #EMP koníčky.#!"
 ep2_wedding.1340.c.tt: "Podaří se mi před [Select_CString(intended.IsFemale,'ní','ním')] udržet svá tajemství?"
 ep2_wedding.1340.c.success: "Jsi [Select_CString(ROOT.Char.IsFemale,'přesvědčena','přesvědčen')], že tvá tajemství jsou v bezpečí"
 ep2_wedding.1340.c.failure: "Obáváš se, že [intended.GetFirstNameNoTooltip] pronikne do tvých tajemství"
 ep2_wedding.1340.d: "#EMP Prosím#!, vím vše o manželství!"
 ep2_wedding.1340.d.tt.never: "Koneckonců, já... eh..."
 ep2_wedding.1340.d.tt.once: "Koneckonců už mám jedno manželství za sebou..."
 ep2_wedding.1340.d.tt.more: "Koneckonců manželství už mám za sebou... Kolik vlastně?"
 ep2_wedding.1340.d.success: "Jsi [Select_CString(ROOT.Char.IsFemale,'přesvědčena','přesvědčen')], že toto manželství bude známé území"
 ep2_wedding.1340.d.failure: "Obáváš se, že tohle manželství přinese nečekané výzvy"
 ep2_wedding.1340.e: "Zmiz mi z očí, ty zatrpklá trosko."
 ep2_wedding.1340.f: "...bude to opravdu tak špatné?"
 ep2_wedding.1340.f.tt: "Nervozita před svatbou trvá jen do konce svatby"
 ep2_wedding.1340.success_title: "[Select_CString(ROOT.Char.IsFemale,'Sebevědomá nevěsta','Sebevědomý ženich')]"
 ep2_wedding.1340.failure_title: "Svatební nervozita"
 ep2_wedding.1350.t: "Bez slov"
 ep2_wedding.1350.desc.intro: "Z rachocení nábytku a hovoru hostů mi třeští hlava. Námaha na mně musí být vidět. [caring_relative.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('caring_relative'))|l], mě totiž vezme za paži a odvede do vedlejší místnosti.\n\nZvuky příprav utichnou. Mluvíme o maličkostech. O starých časech, o lidech, které jsme znali. O svatbě ani slovo. Pak nám slova dojdou a oba ztichneme."
 ep2_wedding.1350.a: "Vychutnám si společnou chvíli ticha."
 ep2_wedding.1350.b: "Řeknu [caring_relative.Custom('CZ_ShortUINameNoTooltip_D')], jak moc pro mě znamená, že tu je."
