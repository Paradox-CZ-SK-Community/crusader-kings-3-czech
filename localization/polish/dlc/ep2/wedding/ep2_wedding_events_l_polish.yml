 ep2_wedding.1000.t: "Umělecké neshody"
 ep2_wedding.1000.desc: "Jako by uspořádání svatby hodné postavení mé rodiny nebylo dost náročné, musím se ještě potýkat s příbuznými [spouse_2.Custom('CZ_FirstName_G')].\n\n[1000_relative.GetTitledFirstName], pro [Select_CString(spouse_2.IsFemale,'ni','něj')] [spouse_2.Custom2('RelationToMe', SCOPE.sC('1000_relative'))|l], [Select_CString(1000_relative.IsFemale,'dorazila','dorazil')] dnes za kuropění. Od té chvíle mě všude pronásleduje s nepřetržitými stížnostmi na to či ono. Za očima mi začíná bušit bolest hlavy, ale ten příval řečí neustává."
 ep2_wedding.1000.desc_servants: "\n\n„Opravdu na to máš dost služebnictva? Nečekáš snad, že budu [ROOT.Char.Custom('GetExpensiveMeal')|l] nosit #EMP já#!?! Traduje se, že na svatbě mého praděda bylo tolik sloužících, že by jejich klobouky zastínily slunce!“"
 ep2_wedding.1000.desc_dec: "\n\n„Co je to za barvu těch květin?! K pleti [spouse_2.Custom('CZ_FirstNameNoTooltip_G')] se budou hodit #EMP příšerně#! špatně! A proč tak #EMP nevkusně#! upravené stoly?! A o těch #EMP křiklavých#! látkách snad raději ani nezačínejme!“"
 ep2_wedding.1000.desc_dec_low: "\n\n„#EMP [Select_CString(1000_relative.IsFemale,'Věděla','Věděl')]#! jsem, že pro [spouse_2.Custom('CZ_FirstNameNoTooltip_A')] nejsi dobrá partie! Podívej na to místo. Ubohé květiny, holé stoly a nikde ani špetka zlata! Srdce mi #EMP krvácí#! nad bídným životem, který to nešťastné dítě čeká!“"
 ep2_wedding.1000.desc_entertainment: "\n\n„To jsou mimové? Kam ti sluhové nesou ty plameny? A proč ta dřevěná bedna #EMP vrčí#!?! Tohle bude katastrofa!“"
 ep2_wedding.1000.desc_fallback: "\n\n„Z těch květin bude [spouse_2.GetFirstNameNoTooltip] kýchat! A tahle vlna je moc hrubá! A co ty barvy? Vím, že [spouse_2.Custom('CZ_FirstNameNoTooltip_D')] se líbit nebudou!“"
 ep2_wedding.1000.a: "Jistě najdeme společnou řeč..."
