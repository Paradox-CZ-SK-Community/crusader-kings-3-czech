 ep2_wedding.1180.t: "Nevhodné spojení"
 ep2_wedding.1180.desc: "Když konečně staneme tváří v tvář, nervózní ošívání [other_spouse.Custom('CZ_TitledFirstName_G')] jasně prozradí neklid.\n\nOči se vyhýbají mým a grimasa v ústech mi řekne vše, co potřebuji vědět. Nemá mě [Select_CString(other_spouse.IsFemale,'ráda','rád')]."
 ep2_wedding.1180.a: "Tvé mínění nebylo požadováno."
 ep2_wedding.1180.b: "Já si tvou přízeň získám!"
 ep2_wedding.1180.c: "Je mi to jedno! Kde je jídlo?"
 ep2_wedding.1190.t: "Náboženské stížnosti"
 ep2_wedding.1190.desc: "Všichni jsou nadšení nádherou místa svatby. Všichni kromě [grumbler.Custom('CZ_TitledFirstName_G')].\n\nOd chvíle příchodu se [grumbler.GetFirstNameNoTooltip] plíží kolem a hledá záminku ke stížnostem. „To máte #EMP líčidla#!?!“ „Ty barevné závoje jsou #EMP hříšné#!!“ „Co je to za nemravné #EMP družení#!?“ „To je celá tahle věc jen přehlídkou přepychu a chtíče?“"
 ep2_wedding.1190.a: "Stydím se..."
 ep2_wedding.1190.b: "Stráže, doprovodte tohoto kazisvěta ke dveřím."
 ep2_wedding.1190.c: "Budu předstírat, že jsem nic [Select_CString(ROOT.Char.IsFemale,'neslyšela','neslyšel')]."
 ep2_wedding.1190.d: "Ano, a budu si to taky užívat!"
 every_zealous_attending_character: "Každá přítomná horlivá postava"
 wedding_religious_complaints_log: "[CHARACTER.GetUIName|U] [Select_CString(CHARACTER.IsFemale,'způsobila','způsobil')] scénu kvůli přepychu svatby a nemravnému družení hostů."
 wedding_religious_complaints_log_title: "$ep2_wedding.1190.t$"
 ep2_wedding.1200.t: "[Select_CString(ROOT.Char.IsFemale,'Mateřské','Otcovské')] srdce"
 ep2_wedding.1200.desc: "Konečně nadešel ten den. Na své dítě, [my_child.Custom('CZ_FirstName_A')], bych [Select_CString(ROOT.Char.IsFemale,'nemohla','nemohl')] být [Select_CString(ROOT.Char.IsFemale,'pyšnější matka','pyšnější otec')]. Tak [Select_CString(my_child.IsFemale,'krásná nevěsta','krásný ženich')]!\n\nOsoba vedle mě to naneštěstí pro sebe právě zjišťuje. „Podívej na [Select_CString(my_child.IsFemale,'ni','něj')]! Cožpak #EMP nezáří#!?“ „A tak dobrá partie!“ „Všechno je dokonalé!“"
 ep2_wedding.1200.desc_interest: "\n\nKdyž se konečně otočím, zjistím, že vedle mě nestojí nikdo jiný než [listener.GetTitledFirstName]! Té chvíle sblížení bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] využít..."
 ep2_wedding.1200.desc_generic: "\n\nPo mém boku se [listener.GetTitledFirstName] jen laskavě usmívá."
 ep2_wedding.1200.a: "Překypuji pýchou."
 ep2_wedding.1200.b: "Nezávidíš mi tak trochu #EMP i ty#!?"
 ep2_wedding.1200.c: "Láska je skutečně ve vzduchu..."
 ep2_wedding.1200.d: "Důležité svatby dělají důležité spojence!"
