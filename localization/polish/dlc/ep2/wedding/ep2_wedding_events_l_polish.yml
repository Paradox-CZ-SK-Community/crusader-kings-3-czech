 ep2_wedding.1090.t: "Sňatek uzavřen v...?"
 ep2_wedding.1090.desc: "Dav jásá a připíjí na novomanžele. Mně se však mezi hosty ztrácí [1090_target.GetFirstName], [ROOT.Char.Custom2('RelationToMe', 1090_target)|l]."
 ep2_wedding.1090.desc_already_matched: "\n\nPo důkladném pátrání [Select_CString(1090_target.IsFemale,'ji','ho')] konečně najdu v odlehlém koutě v hlubokém rozhovoru s [1090_match.Custom('CZ_TitledFirstName_I')]. Právě s tou osobou, se kterou se mi [Select_CString(1090_target.IsFemale,'ji','ho')] předtím chtělo dát dohromady! Asi bych [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')] zasahovat..."
 ep2_wedding.1090.desc_new_match: "\n\nPo důkladném pátrání [Select_CString(1090_target.IsFemale,'ji','ho')] konečně najdu sedět v koutě. Se zájmem, a troufám si říct i s touhou, hledí na [1090_match.Custom('CZ_TitledFirstName_A')]. Ta postava právě baví rozjařené hosty svými vtipy a příběhy."
 ep2_wedding.1090.a: "Jdi na [Select_CString(1090_match.IsFemale,'ni','něj')]."
 ep2_wedding.1090.b: "Pro tebe není [Select_CString(1090_match.IsFemale,'dobrá','dobrý')]."
