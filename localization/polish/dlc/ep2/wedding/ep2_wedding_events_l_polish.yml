 ep2_wedding.1080.t: "Vhodná partie"
 ep2_wedding.1080.desc: "Přípravy na svatbu jsou ještě v plném proudu, ale já už myslím na další cíl. [1080_target.GetFirstName], [ROOT.Char.Custom2('RelationToMe', 1080_target)|l], potřebuje vhodnou partii!\n\nNaštěstí už je na místě, to je dobrý začátek. Zatím jen rozpačitě postává. Teď najít někoho vhodného... Pozornost mi přitáhne skupinka rozprávějících hostů. [matchmaking_1.GetTitledFirstName] mezi nimi vyniká krásou a vystupováním. #EMP Dokonalé!#!"
 ep2_wedding.1080.desc_2: "\n\nUž už tam chci [1080_target.Custom('CZ_FirstNameNoTooltip_A')] poslat, když zahlédnu i [matchmaking_2.Custom('CZ_TitledFirstName_A')]. Nebyla by to snad ještě lepší partie?"
