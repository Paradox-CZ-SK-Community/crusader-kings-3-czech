 ep2_wedding.1310.d.tt: "Neboj se, [friend.GetFirstNameNoTooltip] to pochopí."
 ep2_wedding.1320.t: "Šance začít znovu?"
 ep2_wedding.1320.desc_intro: "Ta odporná osoba, [rival.GetTitledFirstName], na mě zírá přes stůl. Naše oči se setkají. Když vykročí ke mně, napnu se v očekávání hádky. Počkat... pláče?\n\n"
 ep2_wedding.1320.desc_host_vs_spouse: "„Proč jsi pro mě [Select_CString(ROOT.Char.IsFemale,'uspořádala','uspořádal')] tak nádhernou svatbu?"
 ep2_wedding.1320.desc_host_vs_guest: "„Proč jsi mě [Select_CString(ROOT.Char.IsFemale,'pozvala','pozval')] na tuhle nádhernou svatbu?"
 ep2_wedding.1320.desc_spouse_vs_guest: "„Proč mě někdo pozval na tvou svatbu?"
 ep2_wedding.1320.desc_guest_vs_host: "„Nikdy mě nenapadlo, že přijdeš."
 ep2_wedding.1320.desc_guest_vs_spouse: "$ep2_wedding.1320.desc_guest_vs_host$"
 ep2_wedding.1320.desc_spouse_vs_host: "„Muselo se ti zdát zvláštní, že pořádám tvou svatbu."
 ep2_wedding.1320.desc_guest_vs_guest: "„Vidím tě při tak šťastné příležitosti a musím přemýšlet."
 ep2_wedding.1320.desc_outro: " Po všem, co se mezi námi stalo...“ Oči se [Select_CString(rival.IsFemale,'jí','mu')] zalijí slzami. „Kéž bych to všechno [Select_CString(rival.IsFemale,'mohla','mohl')] vzít zpátky!“"
 ep2_wedding.1320.a: "Obejmu [rival.Custom('CZ_FirstNameNoTooltip_A')] a všechno odpustím!"
 ep2_wedding.1320.a.friendliness: "[rival.GetShortUINameNoTooltip|U] ocení tvé smířlivé gesto"
