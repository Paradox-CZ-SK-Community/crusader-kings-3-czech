l_polish:
 ep2_wedding.0001.t: "[GetActivityType('activity_wedding').GetNameNoTooltip|U]: Zasnoubení vypršelo"
 ep2_wedding.0001.desc: "Čas mi protékal mezi prsty. [Select_CString(ROOT.Char.IsFemale,'Myslela','Myslel')] jsem, že na pořádnou [CZActivity('activity_wedding','A')|l] mám ještě čas. Rozzuřený dopis od [spouse_2.Custom('CZ_TitledFirstName_G')] mi ale připomene, že [Select_CString(spouse_2.IsFemale,'její','jeho')] trpělivost i má lhůta právě vypršely."
 ep2_wedding.0001.desc_betrothed: "\n\nSvatbu [spouse_1.Custom('CZ_TitledFirstName_G')] a [spouse_2.Custom('CZ_FirstNameNoTooltip_G')] se mi nepodařilo uspořádat v dohodnuté době. Zasnoubení se proto nyní považuje za neplatné."
 ep2_wedding.0001.desc_self: "\n\nSvou svatbu s [spouse_2.Custom('CZ_FirstNameNoTooltip_I')] se mi nepodařilo uspořádat v dohodnuté době. Zasnoubení se proto nyní považuje za neplatné."
 ep2_wedding.0001.desc_conclusion: "\n\n[spouse_2.GetFirstNameNoTooltip|U] je pochopitelně [Select_CString(spouse_2.IsFemale,'zklamaná','zklamaný')] a připomíná mi, že to nezůstane bez následků..."
 ep2_wedding.0001.a: "Zřejmě nám to nebylo souzeno."
 ep2_wedding.0002.t: "[GetActivityType('activity_wedding').GetNameNoTooltip|U]: Předčasná smrt"
 ep2_wedding.0002.desc: "Dnes ráno ke mně dorazila tragická zpráva. [dead_spouse.GetTitledFirstName], [Select_CString(dead_spouse.IsFemale,'která měla','který měl')] uzavřít sňatek s [alive_spouse.Custom('CZ_TitledFirstName_I')] při [CZActivity('activity_wedding','L')|l], [Select_CString(dead_spouse.IsFemale,'zemřela','zemřel')]. Veškeré mé pečlivé plány tak přišly vniveč!\n\nJe čas hledat nový protějšek."
 ep2_wedding.0002.a: "Tragédie."
 ep2_wedding.0003.desc: "Na dopis, který svírám v roztřesených rukou, mě nemohlo nic připravit. [Select_CString(dead_spouse.IsFemale,'Má snoubenka','Můj snoubenec')], [dead_spouse.GetTitledFirstName], [Select_CString(dead_spouse.IsFemale,'náhle zemřela','náhle zemřel')]. Měli jsme se vzít při [CZActivity('activity_wedding','L')|l].\n\nŽádné oslavy mě nečekají. Všechno pečlivé plánování mé rodiny přišlo vniveč."
 ep2_wedding.0003.a: "Skutečná tragédie..."
 ep2_wedding.0100.t: "Začátek svatebního obřadu"
 ep2_wedding.0100.desc_host: "Je to úžasný pocit. Něco tak dlouho plánovat, utratit za to #EMP tolik peněz#! a pak se konečně dočkat. Je to #EMP tady#!!\n\nVšechno je připravené. Výzdoba zdobí sál, hosté si povídají a služebnictvo pobíhá s plnými mísami."
 ep2_wedding.0100.desc_host_outro: "Snoubenci, [spouse_1.GetTitledFirstName] a [spouse_2.GetTitledFirstName], jsou oba přítomní, září ve svém nejlepším oděvu.\n\nNa můj pokyn se všichni seřadí a obřad začne."
 ep2_wedding.0100.desc_host_spouse: "$ep2_wedding.0100.desc_host$ Přecházím sem a tam, vzrušením i nervozitou bez sebe. Vtom se objeví [Select_CString(my_spouse.IsFemale,'má nastávající','můj nastávající')], [my_spouse.GetTitledFirstName], a v nejkrásnějším oděvu jen září.\n\nMůžeme začít."
 ep2_wedding.0100.desc_spouse: "Konečně nadešel ten den. Má svatba s [my_spouse.Custom('CZ_TitledFirstName_I')]!\n\nDnešek i budoucnost, kterou přinese, mě naplňují nadšením i děsem. Přesto nemohu neobdivovat velkolepost události, kterou pro nás [Select_CString(host.IsFemale,'uspořádala štědrá hostitelka','uspořádal štědrý hostitel')] [host.GetTitledFirstName].\n\nKdyž na mě začne horečně gestikulovat, pochopím. Je čas začít."
 ep2_wedding.0100.desc_guest: "Nadšeně se rozhlížím.\n\nVšude hosté v družném hovoru, květiny na každém stole, služebnictvo s vrchovatými mísami. [host.GetTitledFirstName] s neskrývanou pýchou kontroluje poslední drobnosti. Snoubenci, [spouse_1.GetTitledFirstName] a [spouse_2.GetTitledFirstName], už stojí připravení, plní nervozity i očekávání.\n\nObřad každou chvíli začne!"
 ep2_wedding.0100.desc_root_pregnant: "Cestou ke svému protějšku si však nemohu nevšimnout odsuzujících pohledů. Každý host zírá přímo na mé zřetelně těhotné břicho. Inu..."
 ep2_wedding.0100.desc_spouse_pregnant: "Hned je však jasné, že pozornost všech, včetně mé, poutá nezaměnitelně těhotné břicho nevěsty... Tohle bude trapné."
 ep2_wedding.0100.a: "Nemohu se dočkat!"
 ep2_wedding.0101.desc: "Všechno mé plánování se konečně naplní.\n\nTeď ale ať začne obřad!"
 ep2_wedding.0150.t: "Svatební obřad"
 ep2_wedding.0150.desc: "Obřad konečně dosáhl svého vrcholu.\n\nTradiční rituály byly dokončeny a zbývá už jen finální slib, formální souhlas, pečeť manželství! Když oba, [spouse_1.GetTitledFirstName] a [spouse_2.GetTitledFirstName], řeknou „Ano“, dav začne jásat a všichni jsme svědky začátku jejich společného života."
 ep2_wedding.0150.a: "Vzrušující!"
 ep2_wedding.0151.desc_diplo: "Za všemi rituály a obřady jsou svatby především politickou záležitostí. Jak obřad vrcholí, myslím už na to, co bude dál. Vydrží spojenectví? Pomůže mi nový protějšek při správě zemí?\n\nPředtím ale musím odpovědět ještě na jednu otázku. Nastal čas vyslovit jasný souhlas se sňatkem.$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_religious: "Každý krok obřadu má význam. Platnost rituálu přece závisí na správném provedení všech jeho částí.\n\nPozorně sleduji každé gesto, každé slovo, každý pohyb. Svou #EMP svatbu#! člověk neprožívá každý den! Teď nastává nejdůležitější okamžik. Musím dát souhlas k našemu svazku.$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_party: "Když obřad konečně vyvrcholí a přijde na náš formální souhlas, sotva vnímám. Myšlenkami už jsem na blížící se oslavě. Hromady lahodného jídla, nekonečné proudy pití a tolik veselých tváří, se kterými se o to podělit. Nic lepšího si neumím představit! Teď ale vyřiďme ty formality.$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_seducer: "Všechny svatební obřady jsou stejné. Jen soutěž v hromadění prázdných slov a velkolepých slibů. Jako by se štěstí a uspokojení daly najít v jediném člověku!\n\nKdyž obřad dosáhne vrcholu a dojde na můj formální souhlas i sliby, pohrdavě si odfrknu. Ta otázka je stejně ironická jako zbytečná.$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_shy: "Je toho tolik. Výzdoba, hovořící hosté, jeden rituál a požehnání za druhým. A nade vším pronikavý pohled: [spouse_2.Custom('GetBrideGroom')|l] mě očima probodává a posuzuje každý můj pohyb.\n\nVšechno splývá do víru chaosu a nervozity. Až příliš brzy přichází chvíle našich slavnostních slibů.$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_arrogant: "Den sotva začal a už mám po krk nekonečného žvanění takzvaných duchovních autorit, gratulantů, podlézavců a zmatených sloužících. Není divu, že ve mně po většinu obřadu vře vztek.\n\nKdyž dojde na náš formální souhlas se sňatkem, trpělivost mi dochází. Odpověď ze mě podrážděně vyštěkne.$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_paranoid: "Z obřadu si sotva něco pamatuji. V každém stínu hledám nepřátele a v duchu si maluji děsivé obrazy budoucnosti.\n\nTeď je čas dát našemu svazku úřední pečeť souhlasem. Napadá mě však, zda si do domu nepřivádím přítele, nebo smrtelného nepřítele.$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_appearance: "Většinu obřadu už máme za sebou.\n\nStojíme tváří v tvář před formálním souhlasem se sňatkem. [spouse_2.Custom('GetBrideGroom')|U] hledí přímo na mě a já se znovu zachvěji. Snažím se z [Select_CString(spouse_2.IsFemale,'jejího','jeho')] výrazu vyčíst, jestli [Select_CString(spouse_2.IsFemale,'ji','ho')] mé znetvořené tělo odpuzuje a překazí naše štěstí. Pak přijde řada na má slova.$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc: "Obřad proběhl jako v mlze. Sotva si pamatuji všechny kroky, rituály a požehnání, kterými jsme prošli, a nyní nastal čas na naše přísahy, formální souhlas, skutečnou pečeť manželství.$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_end: "\n\nChci strávit zbytek života s [spouse_2.Custom('CZ_FirstName_I')]?"
 ep2_wedding.0151.desc.murder: "Nastal čas našich slibů. „Přísahám, že mým protějškem nebude nikdo jiný než ty,“ zamumlám. „Navždy,“ ujistím [Select_CString(spouse_2.IsFemale,'ji','ho')] a stisknu [Select_CString(spouse_2.IsFemale,'její','jeho')] ruku.\n\nNaštěstí bude zbytek našeho společného života #EMP neuvěřitelně#! krátký."
 ep2_wedding.0151.a: "Ano."
 ep2_wedding.0151.b: "Nechci!"
 ep2_wedding.0151.b.tt: "Budou následky..."
 ep2_wedding.0152.t: "Svatba zrušena"
 ep2_wedding.0152.desc: "Mé odmítnutí vyvolá překvapené zalapání po dechu. Pak zavládne nejisté ticho.\n\nVidím, jak se ve tváři [spouse_2.Custom('CZ_FirstName_G')] šok pomalu mění ve vztek. Za zády mi náhle vybuchne šuškání, ale je mi to jedno. Sňatek s [spouse_2.Custom('CZ_FirstNameNoTooltip_I')] prostě přijmout nedokážu!\n\nSnesu jakékoli následky."
 ep2_wedding.0152.a: "Ne znamená NE."
 ep2_wedding.0153.desc: "Davem se rozlehne hlasité zalapání po dechu, neboť [spouse_1.GetFirstName] odmítá uzavřít sňatek! [spouse_2.GetFirstName] vypadá stejně šokovaně jako my ostatní. Zvedne se vlna pomluv a rozpoutají se hádky, zatímco [spouse_1.GetFirstNameNoTooltip] spěchá pryč z tohoto prokletého místa."
 ep2_wedding.0153.a: "To je tedy pěkný zmatek..."
 ep2_wedding.0200.t: "Začíná svatební hostina"
 ep2_wedding.0200.desc_host: "S formální částí za námi je teď čas slavit!\n\nDám signál služebnictvu, aby přineslo jídlo a pití a usměrnilo hosty do sálu hostiny.\n\nAť začne svatební hostina!"
 ep2_wedding.0200.desc: "Formální část svatby — obřad — je konečně za námi.\n\nVšichni se usmívají v očekávání obrovského jídla, vzrušující zábavy a všeobecného veselí, které nás čekají.\n\nPojďme se pustit do jídla!"
 ep2_wedding.0200.desc_spouse_dislike: "Obřad proběhl bez chyby a [my_spouse.GetFirstName] je nyní [Select_CString(my_spouse.IsFemale,'mou příšernou manželkou','mým příšerným manželem')].\n\nCestou na hostinu kolem sebe vidím šťastné hosty, kteří se nemohou dočkat veselí. Kéž bych jejich radost [Select_CString(ROOT.Char.IsFemale,'sdílela','sdílel')]. Posadím se na určené místo a v duchu prosím: kéž mi [ROOT.Char.GetFaith.HighGodName] dodá sílu.\n\nA teď ať ta fraška začne!"
 ep2_wedding.0200.desc_spouse_like: "Když obřad skončí a přesouváme se na hostinu, potají se usmívám. Představuji si radosti, které přinese manželský život s [my_spouse.Custom('CZ_FirstName_I')].\n\nNe každý má takové štěstí, aby si vzal tak sympatického člověka!\n\nKéž se všichni podělí o mé štěstí. A teď s chutí do jídla!"
 ep2_wedding.0200.desc_spouse_party: "Od začátku obřadu jako by uplynula věčnost. Konečně mám ale volno a těším se na tu #EMP nejzajímavější#! část dne. Hostinu!\n\n...Samozřejmě mi z toho všeho [Select_CString(my_spouse.IsFemale,'vzešla i manželka','vzešel i manžel')], ale na to bude čas myslet, až mi hodování vykouzlí na tváři pořádný úsměv.\n\nTeď se slaví!"
 ep2_wedding.0200.desc_spouse_shy: "Obřad mi připadal stresující, ale na nervozitu, která přišla hned po něm, mě nemohlo připravit nic.\n\nČeká mě hostina a s ní nápor gratulantů, hluku a bavičů. Navíc mi začíná docházet, že jsem skutečně v manželství a můj život se zásadně změní.\n\nLehce roztřesenou rukou proto sáhnu po poháru a pozvednu jej na oslavu. Ať začne veselí."
 ep2_wedding.0200.desc_spouse_arrogant: "Když jsou všechny nudné formality za námi, přesouváme se do sálu hostiny.\n\nUž cítím, jak mi dochází trpělivost, když služebnictvo přináší jedno jídlo za druhým, #EMP bolestně pomalu#!, a [my_spouse.GetFirstName] se na mě s obavami dívá.\n\nNež budu mít víc času litovat celé té aféry, popadnu pohár a vykřiknu „Ať hostina začíná!“"
 ep2_wedding.0200.desc_spouse_fallback: "Formální obřad skončil. [my_spouse.GetFirstName] je [Select_CString(my_spouse.IsFemale,'mou zákonnou manželkou','mým zákonným manželem')]. Než si na tu myšlenku zvyknu, chvíli to potrvá. Jen tak přemítám, jaký teď bude můj život.\n\nÚvahy mi ale rychle přeruší svatební společnost, která se dává do pohybu směrem k hostině.\n\nNa budoucnost bude čas později. Teď slavme!"
 ep2_wedding.0200.a: "Dobrou chuť!"
 ep2_wedding.0300.t: "Začíná svatební noc"
 ep2_wedding.0300.desc: "Vidím, že všichni hosté jsou spokojení a docela unavení, ale den oslav ještě nekončí.\n\nRychle zařídím slavnostní průvod, který dovede novomanžele do jejich ložnice. Nechme novomanžele slavit #EMP soukromě#!. Pro nás, co zůstáváme, nalejme si další pití!"
 ep2_wedding.0300.desc_spouse: "Hostina pomalu utichá. Všichni jsou sytí a unavení, ale pro [other_spouse.Custom('CZ_FirstName_A')] a mě dnešek ještě neskončil.\n\nPrůvod hostů nás vede do ložnice. Platnost sňatku přece závisí na jeho dovršení!"
 ep2_wedding.0300.desc_guest: "Připadá mi, že už celé dny jen jím, piji, rozprávím, tančím a zpívám.\n\nOslavy brzy utichnou a novomanželé se odeberou do soukromých komnat dovršit sňatek. My ostatní si ale nalijme ještě jeden pohár a připijme na jejich štěstí!"
 ep2_wedding.0300.a: "Je čas!"
 every_attending_relative_of_spouse_2: "Každý přítomný příbuzný [spouse_2.Custom('CZ_UIName_G')]"
 ep2_wedding.0900.t: "Svatba neplatná"
 ep2_wedding.0900.desc: "Zpráva o náhlé smrti [dead_spouse.Custom('CZ_TitledFirstName_G')] zasáhne svatební společnost jako hrom z jasného nebe.\n\nZpěv utichne, úsměvy vystřídají slzy. Rozházené květiny leží na zemi, pošlapané truchlícím davem.\n\nJe skutečnou tragédií, když se den určený radosti promění v den smutku..."
 ep2_wedding.0900.a: "Opravdová tragédie..."
 ep2_wedding.9000.tt: "[previous_host.GetUIName|U] [Select_CString(previous_host.IsFemale,'obdržela','obdržel')] refundaci za zrušenou [CZActivity('activity_wedding','A')] ve výši [gold_i][THIS.Var('gwedding_gold_recoup_value').GetValue|V0]"
 ep2_wedding.0910.desc: "Zpráva o náhlé smrti [dead_spouse.Custom('CZ_TitledFirstName_G')] mě zasáhne do hloubi duše. Tak nečekaně a tragicky. Právě v den naší svatby.\n\nNejsme spolu svoji ani jediný den, a už jsi mi [Select_CString(dead_spouse.IsFemale,'byla vzata','byl vzat')]..."
 ep2_wedding.0910.a: "Nechte mě truchlit..."
 ep2_wedding.9015.tt: "[ROOT.Char.GetUIName|U] [Select_CString(ROOT.Char.IsFemale,'obdržela','obdržel')] refundaci za zrušenou [CZActivity('activity_wedding','A')] ve výši [gold_i][THIS.Var('gwedding_gold_recoup_value').GetValue|V0]"
 ep2_wedding.0915.desc: "[previous_host.Custom2('MyCharacterIntroduction', ROOT.Char)|U] v době svého skonu [Select_CString(previous_host.IsFemale,'pořádala','pořádal')] [CZActivity('activity_wedding','A')|l]. Lákavou událost, na kterou mě nikdo nepozval.\n\nTeď, když už není mezi námi, oslavy zachvátil zmatek a všichni zklamaně odešli domů."
 ep2_wedding.0915.a: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] jsem tam být."
 ep2_wedding.0920.desc: "Na svatbu s [free_spouse.Custom('CZ_TitledFirstName_I')] se opravdu těším. Zdá se ale, že [ROOT.Char.GetFaith.HouseholdGodName] měl se mnou, nebo s [free_spouse.Custom('CZ_FirstNameNoTooltip_I')], jiné plány.\n\nZasnoubení sice trvá, ale slib velké svatby je nyní neplatný."
 ep2_wedding.0920.a: "To je tak smutné..."
 ep2_wedding.0921.desc: "Zpráva o uvěznění [prisoner_spouse.Custom('CZ_TitledFirstName_G')] zastaví všechny oslavy. Zdá se, že [ROOT.Char.GetFaith.HouseholdGodName] měl pro [Select_CString(prisoner_spouse.IsFemale,'ni','něj')] jiné plány.\n\nZasnoubení sice trvá, ale slib velké svatby je nyní neplatný."
 ep2_wedding.0921.a: "Takové zklamání."
 ep2_wedding.0950.t: "Závěr"
 ep2_wedding.0950.desc: "Když #EMP konečně#! odejde poslední host, rozhlédnu se po opuštěném místě. Zbytky jídla, louže nápoje [ROOT.Char.Custom('RegionalDrink')|l] na podlaze, ve vzduchu stále doznívající smích. Cítím spokojenost.\n\nJaký úžasný den! S uspořádáním se mi to opravdu povedlo."
 ep2_grand_wedding_host_incentives_effect.tt: "Ostatní postavy budou pravděpodobněji přijímat manželské návrhy této postavy po následujících 20 let."
 ep2_wedding.0950.a: "Děkuji všem, že jste přišli!"
 ep2_wedding.0960.desc: "Slunce vychází do nového dne. Prvního dne mého společného života s [other_spouse.Custom('CZ_FirstName_I')].\n\nJe čas nechat oslavy a veselí za sebou, jakkoli příjemné byly, a vstoupit do nové každodennosti."
 ep2_wedding.0970.desc: "Hosté jeden po druhém odcházejí. Je čas vydat se na cestu i mně.\n\nSvatba byla skvělou příležitostí pobavit se se sobě rovnými a odpočinout si. Odcházím [Select_CString(ROOT.Char.IsFemale,'unavená a spokojená','unavený a spokojený')] a novomanželům přeji šťastný a zdárný společný život."
 ep2_wedding.0970.a: "Ještě jednou gratuluji!"
 ep2_wedding.0997.desc_intro: "Na [missing_spouse.Custom('CZ_FirstName_A')] čekáme už příliš dlouho. Teď je jasné, že se cestou [Select_CString(missing_spouse.IsFemale,'ztratila','ztratil')].\n\nBrzy se roznesou řeči. Podle klepů z nedalekého města se [Select_CString(missing_spouse.IsFemale,'naposledy objevila','naposledy objevil')] na pochybném tržišti při nákupu bylin. Jiní by však přísahali, že [Select_CString(missing_spouse.IsFemale,'ji','ho')] viděli nastupovat na loď do daleké země."
 ep2_wedding.0997.desc_spouse: "\n\nAť tak či onak, [missing_spouse.GetFirstNameNoTooltip] zjevně [Select_CString(missing_spouse.IsFemale,'utekla','utekl')]. Raději život na toulkách než manželství se mnou."
 ep2_wedding.0997.desc_generic: "\n\nAť tak či onak, [missing_spouse.GetFirstNameNoTooltip] zjevně [Select_CString(missing_spouse.IsFemale,'utekla','utekl')]. Raději život na toulkách než manželství s [other_spouse.Custom('CZ_FirstName_I')]."
 ep2_wedding.0998.desc: "Je vždy smutné, když se naděje provázející novou svatbu rozplynou a všechna práce vložená do velkolepé události přijde vniveč.\n\nTéhle svatbě zkrátka nebylo souzeno.\n\nSlužebnictvo se pustí do úklidu a hosté se ve zmatených, zklamaných skupinkách vydávají domů."
 ep2_wedding.0998.a: "Škoda."
 ep2_wedding.0999.t: "$ep2_wedding.0900.t$"
 ep2_wedding.0999.desc: "Nedávná zpráva přerušila oslavy a nechala všechny překvapené a zmatené.\n\nZřejmě stav a majetek hostitele neumožní pokračování svatby a bez silného hostitele, který by ji vedl, nám nezbývá než se s rozčarováním rozloučit a vrátit se domů."
 ep2_wedding.0999.a: "Jaká škoda..."
