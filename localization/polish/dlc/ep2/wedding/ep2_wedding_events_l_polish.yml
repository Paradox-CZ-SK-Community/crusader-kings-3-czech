 ep2_wedding.1040.t: "Blízká duše"
 ep2_wedding.1040.desc: "Po celé jídlo mě do sebe snadno vtahuje rozhovor s [new_friend.Custom('CZ_TitledFirstName_I')].\n\nMá zajímavé názory, vypráví ty nejlepší vtipy a tolik toho máme společného! Kdykoli přihodím nějakou příhodu, pozorně poslouchá a přesně ve správnou chvíli pronese tu správnou poznámku.\n\nKdo by řekl, že na téhle svatbě najdu tak příjemnou společnost?"
 ep2_wedding.1040.a: "Se [new_friend.Custom('CZ_FirstNameNoTooltip_I')] je mi opravdu dobře!"
 ep2_wedding.1040.b: "Ale není třeba se příliš přibližovat."
 wedding_kindred_log_title: "Blízká duše"
