 ep2_wedding.1020.t: "Můžeš to být právě ty?"
 ep2_wedding.1020.desc: "„Svatby jsou jen politika.“ Obrním se a čekám, až ke mně přistoupí [Select_CString(spouse_2.IsFemale,'má nastávající','můj nastávající')].\n\n„Jen politika,“ opakuji si. „Jak zlé to může být?“\n\nNic mě ale nepřipraví na první pohled na [spouse_2.Custom('CZ_FirstName_A')]. Žádný portrét ani popis by nedokázal vystihnout ten něžný výraz. Žádný básník ještě neopěvoval takovou krásu. Když se naše oči setkají, čas se zastaví a ostatní lidé jako by zmizeli.\n\nPak se na mě usměje a já vím. Všechno bude v pořádku."
 ep2_wedding.1020.a: "Můžeš být právě ty, na koho jsem [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')]?"
 wedding_first_sight_log_title: "Šíp lásky"
 wedding_first_sight_log: "[CHARACTER.GetUIName|U] a [TARGET_CHARACTER.GetUIName] se zamilovali na první pohled"
 ep2_wedding.1030.t: "[ROOT.Char.Custom('GoodBad')|U] příslib"
 ep2_wedding.1030.desc: "Hosté jsou shromážděni, obřad se chystá a všechno vypadá v pořádku, když se přede mnou stane něco neobvyklého.\n\n"
 ep2_wedding.1030.desc_good1: "Mezi hosty si to vykračuje zjevně zabloudilá divoká kachna. Odhodlaně se kolébá k [spouse_2.Custom('CZ_TitledFirstName_D')], aniž si jí kdokoli všimne. Když dorazí do cíle, vydá ohlušující #EMP KVÁÁÁK!!#!, otočí se a odejde. [spouse_2.GetFirstNameNoTooltip] zůstane stát v úžasu a dav se dobře baví."
 ep2_wedding.1030.desc_good2: "[spouse_2.GetTitledFirstName|U] při cestě ke [Select_CString(ROOT.Char.IsFemale,'své nastávající','svému nastávajícímu')] klopýtne, zamává rukama a málem upadne! Když přispěchá ustaraný sluha, jen se usměje a zvedne viníka. Podkovu!"
 ep2_wedding.1030.desc_good3: "Hejno ptáků na naší levé straně náhle vzlétne, když se objeví [spouse_2.GetTitledFirstName], a proletí přímo nad [Select_CString(spouse_2.IsFemale,'její','jeho')] hlavou k [Select_CString(spouse_2.IsFemale,'její','jeho')] pravici!"
 ep2_wedding.1030.desc_bad1: "Služebník, když míří do kuchyně, zakopne a vysype celou solničku na zem!"
 ep2_wedding.1030.desc_bad2: "Amulet pro štěstí, který [spouse_2.GetTitledFirstName] nosí na krku, se rozepne a spadne na zem. Spěchající sloužící ho bezmyšlenkovitě rozšlapou!"
 ep2_wedding.1030.desc_bad3: "Zdánlivě odnikud se vyrojí bouřková mračna a shluknou se přímo nad místem obřadu. Krásnou slunečnou oblohu rychle vystřídá hrozivá tma a na začínající slavnost padne zlověstný stín."
 ep2_wedding.1030.desc_outro: "\n\n[1030_chatter.GetTitledFirstName|U] celou scénu sleduje stejně jako já. Naše pohledy se setkají a zazní poznámka:"
 ep2_wedding.1030.desc_good: "„To bylo... překvapivé, že?“"
 ep2_wedding.1030.desc_bad: "„To bylo... opravdu špatné, že?“"
 ep2_wedding.1030.a: "Jaké příznivé znamení!"
 wedding_omen_good_log_title: "Příznivé znamení"
 wedding_omen_good_log: "[CHARACTER.GetUIName|U] [Select_CString(CHARACTER.IsFemale,'spatřila','spatřil')] příznivé znamení týkající se [TARGET_CHARACTER.Custom('CZ_UIName_G')]"
 ep2_wedding.1030.b: "To neznamená #EMP NIC#!."
 wedding_omen_bad_log_title: "Nepříznivé znamení"
 wedding_omen_bad_log: "[CHARACTER.GetUIName|U] [Select_CString(CHARACTER.IsFemale,'spatřila','spatřil')] nepříznivé znamení týkající se [TARGET_CHARACTER.Custom('CZ_UIName_G')]"
 ep2_wedding.1030.c: "Takové zlověstné znamení! Jsme ZATRACENI!"
 wedding_omen_dismissed_log_title: "Znamení odmítnuto"
 wedding_omen_dismissed_log: "[CHARACTER.GetUIName|U] [Select_CString(CHARACTER.IsFemale,'odmítla','odmítl')] nepříznivé znamení týkající se [TARGET_CHARACTER.Custom('CZ_UIName_G')]"
 ep2_wedding.1030.d: "Nádhera! Opravdová svatba dynastie [ROOT.Char.dynasty.GetName]!"
 ep2_wedding.1120.t: "Nová rodina"
 ep2_wedding.1120.desc: "Svatební obřady bývají dlouhé, nudné a většinou se při nich nic neděje. Dokud ovšem někde za mými zády nevznikne rozruch."
 ep2_wedding.1120.desc_child: "\n\nHned poznám známý, obzvlášť ukňouraný hlas [trouble_child.Custom('CZ_FirstName_G')], jak se prodírá davem. „[Select_CString(ROOT.Char.IsFemale,'Maminko','Tatínku')], tohle má být [Select_CString(other_parent.IsFemale,'má nová maminka','můj nový tatínek')] místo [other_parent.Custom('CZ_FirstName_G')]?“"
 ep2_wedding.1120.desc_adult: "\n\n„Musím něco říct!“ zahřmí z davu známý hlas [trouble_child.Custom('CZ_FirstName_G')]. „To je #EMP tohle#! opravdu nejlepší náhrada za [Select_CString(other_parent.IsFemale,'mou matku','mého otce')], [other_parent.Custom('CZ_TitledFirstName_A')]?!“"
 ep2_wedding.1120.desc_parent: "\n\nKoutkem oka spatřím, jak [other_parent.GetFirstNameNoTooltip] ztuhne překvapením."
 ep2_wedding.1120.a: "Přestaň s těmi nesmysly. #EMP Okamžitě.#!"
 ep2_wedding.1120.b: "Vím, miláčku, je to těžké pro nás všechny..."
 ep2_wedding.1120.c: "#EMP To, kdo je [Select_CString(other_parent.IsFemale,'tvá matka','tvůj otec')], mělo zůstat tajemstvím!#!"
 wedding_child_fuss_log: "[CHARACTER.GetUIName|U], dítě [TARGET_CHARACTER.Custom('CZ_UIName_G')], při svatebním obřadu způsobilo scénu."
 wedding_child_fuss_log_title: "$ep2_wedding.1120.t$"
 wedding_child_fuss_secret_log: "[CHARACTER.GetUIName|U], dítě [TARGET_CHARACTER.Custom('CZ_UIName_G')], při svatebním obřadu způsobilo scénu a vyzradilo tajemství svého narození."
 wedding_child_fuss_secret_log_title: "Tajemství odhaleno"
 ep2_wedding.1121.desc_child: "\n\nUprostřed stojí [trouble_child.GetTitledFirstName], [Select_CString(trouble_child.IsFemale,'dcera','syn')] [other_spouse.Custom('CZ_FirstName_G')], a popotahuje a kňourá. „[Select_CString(other_spouse.IsFemale,'Maminko','Tatínku')], proč nahrazuješ [Select_CString(other_parent.IsFemale,'mou maminku','mého tatínka')], [other_parent.Custom('CZ_FirstName_A')]?“"
 ep2_wedding.1121.desc_adult: "\n\n„Musím něco říct!“ zahřmí z davu [trouble_child.GetTitledFirstName], [Select_CString(trouble_child.IsFemale,'dcera','syn')] [other_spouse.Custom('CZ_FirstName_G')]. „To je #EMP tohle#! opravdu nejlepší náhrada za [Select_CString(other_parent.IsFemale,'mou matku','mého otce')], [other_parent.Custom('CZ_TitledFirstName_A')]?!“"
 ep2_wedding.1121.a: "Mlč, #EMP spratku#!."
 ep2_wedding.1121.b: "Budu lepším rodičem!"
 ep2_wedding.1122.desc_repentant: "V klidu si pochutnávám na pokrmu [ROOT.Char.Custom('GetExpensiveMeal')|l] a nemám jedinou starost. Vtom mě osloví viditelně zkroušená postava. [trouble_child.GetFirstName].\n\n„[Select_CString(ROOT.Char.IsFemale,'Matko','Otče')], chci se omluvit za tu scénu při obřadu. Nebylo to hodné mé výchovy ani postavení a hluboce toho lituji.“"
 ep2_wedding.1122.desc_unrepentant: "Snažím se pochutnat si na pokrmu [ROOT.Char.Custom('GetExpensiveMeal')|l]. Hrubá slova [trouble_child.Custom('CZ_FirstName_G')] a lehkovážné odhalení mého tajemství se mi však pořád vracejí na mysl.\n\nKdyž [Select_CString(trouble_child.IsFemale,'ji','ho')] konečně vyhledám, [trouble_child.GetFirstNameNoTooltip] nevypadá ani znepokojeně, ani kajícně. „Stojím si za svými slovy a nelituji #EMP ničeho#!. Byla to jen pravda,“ odvětí s úšklebkem."
 1122_child_pacified_log: "[CHARACTER.GetUIName|U] a [TARGET_CHARACTER.GetUIName|U] měli upřímný rozhovor, který urovnal vztahy."
 1122_child_pacified_log_title: "Rodinné setkání"
 1122_child_not_pacified_log: "[CHARACTER.GetUIName|U] a [TARGET_CHARACTER.GetUIName|U] nenašli žádnou společnou řeč."
 1122_child_not_pacified_log_title: "Rodinné neporozumění"
 ep2_wedding.1122.a: "Odpouštím ti."
 ep2_wedding.1122.b: "To bylo opravdu neomluvitelné."
 ep2_wedding.1122.c: "Musím respektovat tvé zklamání."
 ep2_wedding.1122.d: "To je pobuřující!"
 ep2_wedding.1130.t: "Tajné šepoty"
 ep2_wedding.1130.desc: "Obřad je v plném proudu. Nedokážu se ale soustředit na dění #EMP přede#! mnou, když #EMP za#! mnou neustává šuškání. Při troše soustředění zachytím útržky velikého drbání, kterého se účastní hosté i služebnictvo. #EMP„Už jste slyšeli—“ „Může to být pravda?“ „Ale co—“ „—to neví??“#!\n\n"
 ep2_wedding.1130.desc_continue: "Rozzlobeně se otočím, abych se [Select_CString(ROOT.Char.IsFemale,'zeptala','zeptal')], co se děje. Zachytím samolibý pohled [1130_knows.Custom('CZ_TitledFirstName_G')]. Právě tam je zřejmě střed všeho rozruchu. „Nemáš snad něco, o co se s námi chceš podělit, [ROOT.Char.Custom('FormOfAddressForLiege')|l]?"
 wedding_secret_revealed_log: "[CHARACTER.GetUIName|U] při obřadu [Select_CString(CHARACTER.IsFemale,'odhalila','odhalil')] tajemství [TARGET_CHARACTER.Custom('CZ_UIName_G')] a [Select_CString(CHARACTER.IsFemale,'způsobila','způsobil')] scénu."
 wedding_secret_revealed_log_title: "$wedding_child_fuss_secret_log_title$"
 wedding_secret_not_revealed_log: "[CHARACTER.GetUIName|U] se při obřadu [Select_CString(CHARACTER.IsFemale,'pokusila','pokusil')] prozradit tajemství [TARGET_CHARACTER.Custom('CZ_UIName_G')] a [Select_CString(CHARACTER.IsFemale,'byla vykázána','byl vykázán')]."
 wedding_secret_not_revealed_log_title: "Vykázání rušitele"
 ep2_wedding.1130.a: "Nepopřu důkazy."
 ep2_wedding.1130.b: "Stráže, pryč s tím #EMP [Select_CString(1130_knows.IsFemale,'pomlouvačským jazykem','pomlouvačem')]#!."
 ep2_wedding.1131.desc: "Uprostřed rozruchu stojí [1130_knows.GetTitledFirstName] a samolibě se usmívá. „To ti [other_spouse.GetFirstName] nikdy nic [Select_CString(other_spouse.IsFemale,'neřekla','neřekl')]? Vždyť to ví #EMP všichni#!!"
 ep2_wedding.1131.a: "Už žádná tajemství, [other_spouse.Custom('CZ_FirstNameNoTooltip_V')]."
 ep2_wedding.1131.b: "To je #EMP pobuřující#!!"
 ep2_wedding.1132.desc: "Obřad je v plném proudu, ale příliš jej nevnímám. Mysl se mi stále vrací k znepokojivé věci, kterou vím o [spouse_with_secret.Custom('CZ_TitledFirstName_L')]. Ví o ní vůbec [other_spouse.GetTitledFirstName]? [Select_CString(other_spouse.IsFemale,'Neměla','Neměl')] by?\n\nJen tak nadhodím pár obav sousedovi na sedadle. Než se naději, celé shromáždění šumí drby. [spouse_with_secret.GetFirstNameNoTooltip] i [other_spouse.GetFirstNameNoTooltip] zlostně hledí do středu všeho rozruchu. Na mě."
 ep2_wedding.1132.a: "[other_spouse.GetFirstNameNoTooltip|U] si zaslouží něco lepšího!"
 ep2_wedding.1132.b: "Jsou to jen #EMP hloupé#! řeči, viď, [spouse_with_secret.Custom('CZ_FirstNameNoTooltip_V')]?"
 ep2_wedding.1140.t: "Přešlap"
 ep2_wedding.1140.desc: "Užívám si obřad a mám radost z toho, co se mi povedlo uspořádat. Zatím šlo všechno dobře. Sotva mě to ale napadne, vím, že jsem to [Select_CString(ROOT.Char.IsFemale,'zakřikla','zakřikl')]."
 ep2_wedding.1140.desc_1: "\n\n[fumbling_spouse.GetTitledFirstName|U] cestou ke svému protějšku klopýtne a natáhne se přímo na obličej!"
 ep2_wedding.1140.desc_2: "\n\n[fumbling_spouse.GetTitledFirstName|U] se při slibech rozkoktá a příšerně zkomolí jméno svého protějšku!"
 ep2_wedding.1140.desc_3: "\n\n[fumbling_spouse.GetTitledFirstName|U] zmateně ztuhne. Zjevně úplně [Select_CString(fumbling_spouse.IsFemale,'zapomněla','zapomněl')], co má v obřadu následovat!"
 ep2_wedding.1140.desc_target: "\n\nCítím, jak mě z davu probodává pohled [intent_target.Custom('CZ_TitledFirstName_G')] a pobízí mě k zásahu."
 ep2_wedding.1140.desc_target_spouse: "\n\nPřes místnost se setkám s vyděšeným pohledem [intent_target.Custom('CZ_TitledFirstName_G')], který mě prosí, abych něco [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')]."
 ep2_wedding.1140.a: "Ještě to mohu zachránit..."
 ep2_wedding.1140.a.success: "Zachráníš situaci"
 ep2_wedding.1140.a.success.tt: "[Select_CString(ROOT.Char.IsFemale,'Zachránila','Zachránil')] jsi situaci"
 ep2_wedding.1140.a.success.tt2: "[intent_target.GetFirstNameNoTooltip|U] [Select_CString(intent_target.IsFemale,'je ohromena','je ohromen')] tím, jak hladce jsi situaci [Select_CString(ROOT.Char.IsFemale,'zachránila','zachránil')]."
 ep2_wedding.1140.a.failure: "Jen se ztrapníš"
 ep2_wedding.1140.a.failure.tt: "[Select_CString(ROOT.Char.IsFemale,'Ztrapnila','Ztrapnil')] ses"
 ep2_wedding.1140.b: "Pojďme pokračovat."
 ep2_wedding.1140.c: "To se stává!"
 recovered_from_misstep_log: "[CHARACTER.GetUIName|U] hladce [Select_CString(CHARACTER.IsFemale,'napravila','napravil')] přešlap [TARGET_CHARACTER.Custom('CZ_UIName_G')]."
 recovered_from_misstep_log_title: "$ep2_wedding.1140.t$"
 made_a_misstep_log: "[CHARACTER.GetUIName|U] [Select_CString(CHARACTER.IsFemale,'udělala','udělal')] přešlap během obřadu."
 made_a_misstep_log_title: "$ep2_wedding.1140.t$"
 ep2_wedding.1150.t: "Romantické průzkumy"
 ep2_wedding.1150.desc: "Svatební obřady bývají dlouhé a úmorné. Neustále proto očima pročesávám hosty a hledám cíl svých tužeb, [intent_target.Custom('CZ_TitledFirstName_A')]."
 ep2_wedding.1150.desc_1: "\n\nKonečně [Select_CString(intent_target.IsFemale,'ji','ho')] zahlédnu. Stojí kousek stranou od davu a s potěšeným úsměvem přivoní ke květinám ze svatební výzdoby."
 ep2_wedding.1150.desc_2: "\n\nKonečně [Select_CString(intent_target.IsFemale,'ji','ho')] zahlédnu. Napjatě sleduje služebnictvo, které pobíhá s plnými talíři a se sudy nápoje [host.Custom('RegionalDrink')|l]."
 ep2_wedding.1150.desc_3: "\n\nKonečně [Select_CString(intent_target.IsFemale,'ji','ho')] zahlédnu. S hrstkou hostů probírá, jak jsou svatby zbytečné."
 ep2_wedding.1150.desc_4: "\n\nKonečně [Select_CString(intent_target.IsFemale,'ji','ho')] zahlédnu. Právě káže ostatním hostům o posvátnosti manželství."
 ep2_wedding.1150.desc_fallback: "\n\nKonečně [Select_CString(intent_target.IsFemale,'ji','ho')] zahlédnu. Živě rozmlouvá s malou skupinkou hostů."
 ep2_wedding.1150.desc_conclusion: "Ideální příležitost [Select_CString(intent_target.IsFemale,'ji','ho')] oslovit."
 ep2_wedding.1150.a: "Tahle chvíle si žádá trochu #EMP poezie#!!"
 ep2_wedding.1150.b: "Víš, na co mě svatby přivádějí do #EMP nálady#!?"
 ep2_wedding.1150.c: "Pověz mi o tom víc?"
 seduction_good_impression_log: "[CHARACTER.GetUIName|U] se [Select_CString(CHARACTER.IsFemale,'zachovala','zachoval')] svůdně vůči [TARGET_CHARACTER.Custom('CZ_UIName_D')]."
 seduction_good_impression_log_title: "$ep2_wedding.1150.t$"
 ep2_wedding.1150.a.success: "[intent_target.GetFirstNameNoTooltip|U] má zájem"
 ep2_wedding.1150.a.success.tt: "[Select_CString(ROOT.Char.IsFemale,'Udělala','Udělal')] jsi dobrý dojem na [intent_target.Custom('CZ_FirstNameNoTooltip_A')]"
 ep2_wedding.1150.a.failure: "[intent_target.GetFirstNameNoTooltip|U] [Select_CString(intent_target.IsFemale,'je rozladěná','je rozladěný')]"
 ep2_wedding.1150.a.failure.tt: "[Select_CString(ROOT.Char.IsFemale,'Obtěžovala','Obtěžoval')] jsi [intent_target.Custom('CZ_FirstNameNoTooltip_A')]"
 ep2_wedding.1160.t: "Nevítaní hosté"
 ep2_wedding.1160.desc: "Šlechtické svatby jsou vždy velkou podívanou pro prostý lid, který se shlukuje v naději, že zahlédne svého vládce a okusí jeho bohatství.\n\nZejména si nemohu nevšimnout, že přípravy na velký banket pozorně sleduje skupina extrémně sešlých vesničanů..."
 ep2_wedding.1160.a: "Můžu je vpustit!"
 ep2_wedding.1160.a.tt: "To to oživí!"
 ep2_wedding.1160.b: "[Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')] bych jim propašovat nějaké jídlo!"
 ep2_wedding.1160.b.tt: "[host.GetFirstNameNoTooltip|U] si toho nikdy nevšimne!"
 ep2_wedding.1160.c: "To je pod mou úroveň."
 ep2_wedding.1161.desc: "Už chvíli pozoruji, jak kolem svatebního dění roste dav prostých lidí.\n\nNečekám ale, že malá skupinka z nich vtrhne do kuchyní! Hltají všechno, co jim přijde pod ruku. [ROOT.Char.Custom('RegionalDrink')|U] i [ROOT.Char.Custom('GetExpensiveMeal')|l] do nich mizí jako nic!\n\n#EMP Jak se dostali dovnitř?!#!"
 ep2_wedding.1161.a: "Vyžeňte je!"
 ep2_wedding.1161.b: "Nechte všechny podělit se o naše veselí!"
 ep2_wedding.1161.success: "Sedláci byli vyhnáni"
 ep2_wedding.1161.success.tt: "[Select_CString(ROOT.Char.IsFemale,'Obnovila','Obnovil')] jsi pořádek"
 ep2_wedding.1161.success.tt2: "[host.GetFirstName|U] [Select_CString(host.IsFemale,'vyhnala','vyhnal')] sedláky."
 ep2_wedding.1161.failure: "Nepodaří se ti zvládnout dav"
 ep2_wedding.1161.failure.tt: "Vtíraví hosté dál řádí"
 ep2_wedding.1161.failure.tt2: "[host.GetFirstName|U] [Select_CString(host.IsFemale,'nezvládla','nezvládl')] nezvané hosty."
 ep2_wedding.1161.b.tt: "[host.GetFirstName|U] [Select_CString(host.IsFemale,'nechala','nechal')] sedláky zůstat."
 wedding_peasant_invasion_managed_log: "[CHARACTER.GetUIName|U] úspěšně [Select_CString(CHARACTER.IsFemale,'vyřešila','vyřešil')] vtržení nevítaných prostých lidí."
 wedding_peasant_invasion_managed_log_title: "$ep2_wedding.1160.t$"
