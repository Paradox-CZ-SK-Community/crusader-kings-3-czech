 ep2_wedding.1010.t: "Velkolepé uvítání"
 ep2_wedding.1010.desc: "Ještě že jsem služebnictvu včas [Select_CString(ROOT.Char.IsFemale,'nařídila','nařídil')] ohlídat příjezd [1010_target.Custom('CZ_TitledFirstName_G')]. Uprostřed svatebních příprav by mi jinak [Select_CString(1010_target.IsFemale,'unikla','unikl')].\n\nKdyž se [1010_target.GetFirstNameNoTooltip] objeví, stojím hrdě uprostřed nádvoří v nejhonosnějším oděvu a s čestnou stráží kolem sebe."
 ep2_wedding.1010.diplo: "\n\n„S nesmírným potěšením tě vítám, [1010_target.Custom('CZ_TitledFirstNameNoTooltip_V')]! Věřím, že má pohostinnost ti bude příjemná a všechny divy mého panství na tebe zapůsobí!“"
 ep2_wedding.1010.seduce: "\n\n„[Select_CString(1010_target.IsFemale,'Má drahá','Můj drahý')] [1010_target.Custom('CZ_TitledFirstNameNoTooltip_V')]! Konečně jsi zde! Žádná oslava mi není milejší než ta, při níž se mohu těšit z tvé zářivé přítomnosti!“"
 ep2_wedding.1010.match: "\n\n„[1010_target.Custom('CZ_TitledFirstNameNoTooltip_V')], vítej! [1010_match.Custom('CZ_FirstName_V')], pojď také pozdravit! — #EMP Musíš na [Select_CString(1010_target.IsFemale,'ni','něj')] i na [Select_CString(1010_target.IsFemale,'její','jeho')] rodinu udělat dobrý dojem, jasné?!“ dodám rozzuřeným šeptem."
 ep2_wedding.1010.a: "Dovol mi ukázat ti zahrady!"
