 ep2_wedding.1100.t: "Rituální očista"
 ep2_wedding.1100.desc_bride: "Svatební den se blíží a příbuzní se na místě scházejí už několik dní. Nepřekvapí mě proto, když mě [guest_1.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', guest_1)|l], a [guest_2.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', guest_2)|l], odvedou do odlehlých lázní nedaleko [CZProvName(ROOT.Char.GetCurrentActivity.GetLocation,'G')].\n\n„Podle dávných tradic našeho lidu,“ začne [guest_1.GetFirstNameNoTooltip], „odložíš své staré šaty a #EMP kransen#!, panenský věneček.“\n\n„Důkladně tě omyjeme a zrodíš se znovu jako krásná nevěsta!“ slavnostně uzavře [guest_2.GetFirstNameNoTooltip]."
 ep2_wedding.1100.desc_relative: "Blíží se svatba [bride.Custom('CZ_TitledFirstName_G')]. Je to [ROOT.Char.Custom2('RelationToMe', bride)|l] a rodina se [CZPrepV(ROOT.Char.GetCurrentActivity.GetLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetCurrentActivity.GetLocation,'L')] schází už několik dní. Dnes nevěstu odvádíme do odlehlých lázní k tradiční očistě.\n\n„Dnes,“ začnu, „odložíš staré šaty a #EMP kransen#!, panenský věneček. Až budeš čistá a očištěná, povstaneš jako pravá nevěsta!“\n\nVedle mě hlasitě zajásá [guest_2.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', guest_2)|l]."
 ep2_wedding.1100.desc_extra_guest: "\n\n„Uděláme tě tak #EMP krásnou#!!“ rozplývá se [guest_3.GetTitledFirstName|U]."
 ep2_wedding.1100.a: "Tradice se musí dodržovat."
