 wedding_fealty_log_title: "Nový vazal"
 ep2_wedding.1220.t: "Jedovaté vztahy"
 ep2_wedding.1220.desc: "Příprav a rituálů svatebního obřadu je mnoho. V jedné z přestávek mezi nimi zaslechnu chichotání a posměšky od příbuzných [other_spouse.Custom('CZ_FirstName_G')].\n\nJakmile zjistí, že mě zaujali, [relative.GetTitledFirstName] promluví přímo ke mně:"
 ep2_wedding.1220.desc_marry_down: "„Neuvěřitelné, že naše rodina dovolila [other_spouse.Custom('CZ_FirstNameNoTooltip_D')] pošpinit se sňatkem s někým tak nízkého postavení!“"
 ep2_wedding.1220.desc_feud: "„Nemohu uvěřit, že jsme přistoupili na svazek s tím #EMP odporným#! rodem [ROOT.Char.GetHouse.GetName]!“"
 ep2_wedding.1220.desc_despicable: "„Je #EMP pobuřující#!, že [Select_CString(other_spouse.IsFemale,'nebohá','nebohý')] [other_spouse.GetFirstNameNoTooltip] musí uzavřít sňatek s tak odpornou osobou, jako jsi #EMP ty#!!“"
 ep2_wedding.1220.desc_miscreant: "„Jak jsme mohli nechat tak ohavné #EMP stvoření#! zkazit [Select_CString(other_spouse.IsFemale,'nebohou','nebohého')] [other_spouse.Custom('CZ_FirstNameNoTooltip_A')]?“"
 ep2_wedding.1220.desc_fallback: "„Opravdu škoda, že jsme pro [Select_CString(other_spouse.IsFemale,'nebohou','nebohého')] [other_spouse.Custom('CZ_FirstNameNoTooltip_A')] nenašli někoho #EMP lepšího#!, ale takový je život...“"
 ep2_wedding.1220.desc_target: "\n\nRozruch upoutal také pozornost [diplo_intent.Custom('CZ_TitledFirstName_G')]. Teď mě upřeně sleduje."
 ep2_wedding.1220.a: "Ano ano, samozřejmě..."
 ep2_wedding.1220.b: "Je to výzva?"
 ep2_wedding.1220.c: "Dokážu ti, že se #EMP mýlíš#!."
 ep2_wedding.1220.c.tt: "Dobré zvládnutí situace zapůsobí také na [diplo_target.Custom('CZ_FirstNameNoTooltip_A')]"
 ep2_wedding.1220.c.success: "Uděláš dobrý dojem na [relative.Custom('CZ_FirstNameNoTooltip_A')]"
 ep2_wedding.1220.c.success.tt: "[relative.GetFirstNameNoTooltip|U] tě má o něco raději!"
 ep2_wedding.1220.c.failure: "Nepodaří se ti vyvrátit předsudky [relative.Custom('CZ_FirstNameNoTooltip_G')]"
 ep2_wedding.1220.c.failure.tt: "[relative.GetFirstNameNoTooltip|U] tě stále nemá [Select_CString(relative.IsFemale,'ráda','rád')]!"
 ep2_wedding.1220.d: "Och, mohu být mnohem #EMP horší#!!"
 wedding_proved_wrong_log: "[CHARACTER.GetUIName|U] [Select_CString(CHARACTER.IsFemale,'přesvědčila','přesvědčil')] [TARGET_CHARACTER.Custom('CZ_ShortUIName_A')] o svých dobrých vlastnostech a [Select_CString(CHARACTER.IsFemale,'vyvrátila','vyvrátil')] tak předsudky, které [TARGET_CHARACTER.GetShortUIName] vůči [Select_CString(CHARACTER.IsFemale,'ní','němu')] [Select_CString(TARGET_CHARACTER.IsFemale,'chovala','choval')]."
