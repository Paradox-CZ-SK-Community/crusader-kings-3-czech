 wedding_peasant_invasion_not_managed_log_title: "$ep2_wedding.1160.t$"
 wedding_peasant_invasion_stay_log: "[CHARACTER.GetUIName|U] [Select_CString(CHARACTER.IsFemale,'dovolila','dovolil')] skupině nezvaných prostých lidí účastnit se oslav."
 wedding_peasant_invasion_stay_log_title: "$ep2_wedding.1160.t$"
 ep2_wedding.1170.t: "Průvod"
 ep2_wedding.1170.desc: "[rich_spouse.GetTitledFirstName|U] [Select_CString(rich_spouse.IsFemale,'přijela jako nevěsta','přijel jako ženich')] za obrovské slávy. Celý průvod koní v bohatých čabrakách shazoval stříbrné podkovy, které si prostý lid mohl sbírat. Bubny, lyry, dudy, mimové a šašci!\n\nPrůvod se už rozešel, ale stále přitahuje početný dav a odvádí jeho pozornost od probíhajícího obřadu."
 ep2_wedding.1170.desc_relax: "\n\nKéž bych si [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] užít všechno najednou! Místo toho přepínám mezi žonglérským vystoupením, hlazením koní a představením polykání ohně."
 ep2_wedding.1170.desc_mischief: "\n\nTolik možností! Co vypustit koně? Nebo ukrást buben a polekat ostatní hosty... "
 ep2_wedding.1170.desc_murder: "\n\nZahlédnu [murderee.Custom('CZ_TitledFirstName_A')]. Hudební vystoupení [Select_CString(murderee.IsFemale,'ji','ho')] úplně uchvátilo a okolí vůbec nevnímá..."
 ep2_wedding.1170.a: "Taky chci být u toho!"
 ep2_wedding.1170.a.tt: "Schováš si pár podkov, když se nikdo nedívá."
 ep2_wedding.1170.b: "Příjemné, ale trochu přehnané."
 ep2_wedding.1170.b.tt: "Znovu se soustředíš na obřad."
 ep2_wedding.1170.c: "#EMP Tak vzrušující!#!"
 ep2_wedding.1170.d: "Co kdybych tomu šaškovi [Select_CString(ROOT.Char.IsFemale,'podrazila','podrazil')] nohy?"
 ep2_wedding.1170.e: "[murderee.GetFirstNameNoTooltip|U] nedává pozor..."
