 ep2_wedding.1050.t: "Ohnivý tanec"
 ep2_wedding.1050.desc: "Všichni mají dobrou náladu. Vlevo ode mě děti jako zhypnotizované sledují žongléry, vpravo básníci přednášejí nová díla okouzlenému publiku.\n\nCelá hostina ale utichne, když doprostřed vstoupí tanečníci s pochodněmi a cestou k sobě zvou hosty. V šeru časného večera je to úchvatný pohled. Pochodně osvětlují usměvavé tváře proti tmavnoucí obloze a jejich stíny splétají složité obrazce.\n\nVšechno vypadá nádherně, dokud [1050_victim.GetTitledFirstName] nezakopne, nevyrazí sousedovi pochodeň z ruky a nezapálí si vlastní oděv..."
