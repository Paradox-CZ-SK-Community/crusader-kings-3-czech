 wedding_lingering_doubts_modifier: "Přetrvávající pochybnosti"
 wedding_lingering_doubts_modifier_desc: "Drahá polovička této postavy sice popřela, že by měla další milence, ale pochybnosti přesto přetrvávají..."
 wedding_mind_at_ease_modifier: "Klidná mysl"
 wedding_mind_at_ease_modifier_desc: "Tato postava je přesvědčena, že její drahá polovička miluje jen ji a nikoho jiného."
 wedding_insecure_marriage_modifier: "Manželská nejistota"
 wedding_insecure_marriage_modifier_desc: "Tuto postavu sužují hluboké pochybnosti a nejistota ohledně vlastního manželství."
 wedding_practical_marriage_modifier: "Sňatek z rozumu"
 wedding_practical_marriage_modifier_desc: "Tato postava uzavřela manželství z praktických důvodů. Její manželský svazek je tedy #EMP opravdu#! ryze praktickou záležitostí."
 wedding_soothed_insecurity_modifier: "Rozptýlené pochybnosti"
 wedding_soothed_insecurity_modifier_desc: "Drahá polovička tuto postavu ujistila o pevnosti jejich manželského svazku a pomohla jí překonat nejistotu."
 wedding_lavish_food_modifier: "Přepychové pohoštění"
 wedding_lavish_food_modifier_desc: "Tato postava uspořádala svatbu s mimořádně bohatým a přepychovým pohoštěním."
 wedding_lavish_food_royal_modifier: "$wedding_lavish_food_modifier$"
 wedding_lavish_food_royal_modifier_desc: "$wedding_lavish_food_modifier_desc$"
 ep2_wedding_shared_values_modifier: "Sdílené manželské hodnoty"
 ep2_wedding_shared_values_modifier_desc: "Vědomí, že drahá polovička schvaluje její způsoby jednání, umožňuje této postavě naplno rozvinout svůj potenciál."
 ep2_wedding_authoritarian_modifier: "Autoritativní vystupování"
 ep2_wedding_autoritharian_modifier_desc: "Tato postava se nebojí rázně připomenout ostatním, kde je jejich místo."
 ep2_wedding_family_focus_modifier: "Rodina na prvním místě"
 ep2_wedding_family_focus_modifier_desc: "Tato postava se soustředí na budování lepších vztahů mezi nejbližšími členy své rodiny."
 wedding_clean_slate_modifier: "Čistý štít"
 wedding_clean_slate_modifier_desc: "Poté, co tato postava odhalila jedno ze svých tajemství, působí mnohem důvěryhodněji."
 wedding_web_of_secrets_modifier: "Pavučina tajemství"
 wedding_web_of_secrets_modifier_desc: "Tato postava rázně zabránila odhalení svého tajemství, čímž kolem sebe vytvořila auru záhadnosti."
 wedding_trust_compromised_modifier: "Narušená důvěra"
 wedding_trust_compromised_modifier_desc: "Poté, co tato postava zjistila, že před ní její nová drahá polovička skrývala tajemství, se stala ostražitější a nedůvěřivější."
 gwedding_hosted_murder_wedding_modifier: "Nedůvěryhodný hostitel"
 gwedding_hosted_murder_wedding_modifier_desc: "Tato postava nedokázala ochránit jednoho z novomanželů během svatby, kterou pořádala."
 wedding_peasants_connections_county_modifier: "Přízeň prostého lidu"
 wedding_peasants_connections_county_modifier_desc: "Lid si oblíbil vládce tohoto hrabství, protože umožnil několika prostým lidem zúčastnit se velkolepé svatby."
 wedding_enforced_security_modifier: "Zajištěná bezpečnost"
 wedding_enforced_security_modifier_desc: "Tato postava úspěšně zajistila pořádek a bezpečnost na velkolepé svatbě, kterou zaplavili nezvaní hosté."
 wedding_peasants_overrun_modifier: "Nápor prostého lidu"
 wedding_peasants_overrun_modifier_desc: "Tato postava nedokázala zajistit bezpečnost na velkolepé svatbě, kterou zaplavili nezvaní hosté."
 wedding_parade_mayhem_modifier: "Zmatek při svatebním průvodu"
 wedding_parade_mayhem_modifier_desc: "Tato postava si náramně užila rozpoutávání zmatku a neplechy během svatebního průvodu."
 wedding_political_mentality_modifier: "Politický sňatek"
 wedding_political_mentality_modifier_desc: "Myšlenky této postavy se upínají především k politickému dění, nikoli k vlastnímu manželství."
 wedding_confident_groom: "Sebevědomý ženich"
 wedding_confident_groom_desc: "Tato postava je připravena čelit všemu, co jí svatební den přichystá. Bohužel jí toto sebevědomí vydrží nejdéle do jeho konce."
 wedding_confident_bride: "Sebevědomá nevěsta"
 wedding_confident_bride_desc: "$wedding_confident_groom_desc$"
 wedding_jitters: "Předsvatební nervozita"
 wedding_jitters_desc: "Tato postava se děsí každého dalšího kroku směrem k oltáři. Naštěstí nervozita s koncem svatebního dne pomine."
 ruler_married_here_county_modifier: "Velkolepá svatba panovníka"
 ruler_married_here_county_modifier_desc: "Vládce tohoto hrabství zde uzavřel sňatek během velkolepé slavnosti, která nadchla místní obyvatele."
 wedding_thinking_outside_box_modifier: "Nekonvenční myšlení"
 wedding_thinking_outside_box_modifier_desc: "Tato postava je nezávislého ducha a nenechává se svazovat starými tradicemi."
 wedding_severe_host_modifier: "Přísný hostitel"
 wedding_severe_host_modifier_desc: "Tato postava má na společenských událostech jen velmi malou trpělivost s hloupostí a nevhodným chováním."
 wedding_social_drinker_modifier: "Společenský piják"
 wedding_social_drinker_modifier_desc: "Tato postava si ráda dopřeje pořádný doušek ve společnosti přátel během společenských událostí."
