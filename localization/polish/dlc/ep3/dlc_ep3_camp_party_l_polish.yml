l_polish:
 activity_camp_party: "Táborová veselice"
 activity_camp_party_desc: "Uspořádej ve svém táboře malou oslavu. Zaplatíš ji [gold_i][Concept('gold','zlatem')|E], ale její průběh ovlivní i tvé zásoby [provisions_i][Concept('provisions','proviantu')|E]. Pozváni budou všichni z tábora a podle tvé volby i místní vládci.\n\nTáborové veselice jsou příležitostí spřátelit se s družiníky, získat zvláštní [Concept('task_contracts','zakázky')|E] a zbavit se [Concept('stress','stresu')|E]."
 activity_camp_party_province_desc: "Vyber baronství"
 activity_camp_party_host_desc: "$BULLET_WITH_TAB$Může ztratit [stress_i][Concept('stress','stres')|E]\n$BULLET_WITH_TAB$Může získat [provisions_i][Concept('provisions','proviant')|E]\n$BULLET_WITH_TAB$Může získat body [Concept('skill','dovedností')|E]\n$BULLET_WITH_TAB$Může získat [Concept('task_contracts','zakázky')|E]\n$BULLET_WITH_TAB$Může získat [Concept('artifacts','artefakty')|E]\n$BULLET_WITH_TAB$Může naverbovat nové [Concept('followers','družiníky')|E]"
 activity_camp_party_success: "Veselí"
 activity_camp_party_success_desc: "\n\nJak bujará je zatím tvá [GetActivityType( 'activity_camp_party' ).GetName].\n\nČím větší veselí, tím lepší odměny z [Concept('activity','aktivity')|E] můžeš získat."
 activity_camp_party_cooldown: "Než uspořádáš další veselici, musíš počkat alespoň 3 měsíce!"
 activity_camp_party_selection_tooltip: "Uspořádej [CZActivity('activity_camp_party','A')] se svými [Concept('followers','družiníky')|E]\n\nOčekávané odměny:\n$BULLET_WITH_TAB$Úbytek [stress_i][Concept('stress','stresu')|E]\n$BULLET_WITH_TAB$[provisions_i][Concept('provisions','proviant')|E]\n$BULLET_WITH_TAB$Nové [Concept('task_contracts','zakázky')|E]"
 activity_camp_party_destination_selection: "[GetActivityType('activity_camp_party').GetName] se může konat pouze ve tvém táboře"
 activity_camp_party_guest_desc: "$BULLET_WITH_TAB$ Účastníkům může ubýt [Concept('stress','stresu')|E]"
 activity_camp_party_conclusion_desc: "[GetActivityType( 'activity_camp_party' ).GetName] skončila"
 camp_party_completed_log_entry_effect_title: "$activity_camp_party$ skončila"
