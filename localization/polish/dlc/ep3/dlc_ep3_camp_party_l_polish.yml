 camp_party_75_contracts_get: "Získáváš novou [Concept('task_contract','zakázku')|E]"
 activity_camp_party_guest_help_text: "Na takové bujaré oslavě se samozřejmě očekává účast všech z tábora.\n\nJako čestného hosta lze pozvat i místního vládce. Pozor ale: vládci určitých [Concept('ranks','hodností')|E] nejspíš usoudí, že je taková zábava pod jejich úroveň."
 activity_invite_rule_followers: "Družiníci"
