 activity_camp_party_special_type_bar_segment_tt_3: "#t Bujará#!\n#ts Skóre: [ActivityWindow.GetSpecialProgressValue|0V]/#V 100#!#!\n$EFFECT_LIST_BULLET$Všem účastníkům ubude [Concept('stress','stresu')|E]\n$EFFECT_LIST_BULLET$Získáš #positive_value velké#! množství [provisions_i][Concept('provisions','proviantu')|E]\n$EFFECT_LIST_BULLET$Na #value 1 #! rok lepší rekruti z rozhodnutí [GetDecisionWithKey('visit_local_settlement_decision').GetName]\n$EFFECT_LIST_BULLET$Získáš [Concept('lifestyle_experience','zkušenosti životního stylu')|E]\n$EFFECT_LIST_BULLET$Získáš #value 2#! nové [Concept('task_contracts','zakázky')|E]\n$EFFECT_LIST_BULLET$$activity_camp_party_reward_upgrade_building$"
