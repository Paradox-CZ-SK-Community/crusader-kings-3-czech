 activity_camp_party_special_type_bar_segment_tt_1: "#t Veselá#!\n#ts Skóre: [ActivityWindow.GetSpecialProgressValue|0V]/#V 50#!#!\n$EFFECT_LIST_BULLET$Všem účastníkům ubude [Concept('stress','stresu')|E]\n$EFFECT_LIST_BULLET$Získáš #positive_value malé#! množství [provisions_i][Concept('provisions','proviantu')|E]\n$EFFECT_LIST_BULLET$Na #value 1 #! rok lepší rekruti z rozhodnutí [GetDecisionWithKey('visit_local_settlement_decision').GetName]\n$EFFECT_LIST_BULLET$Získáš [Concept('lifestyle_experience','zkušenosti životního stylu')|E]"
