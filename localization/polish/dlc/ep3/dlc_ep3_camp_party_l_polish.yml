 ep3_camp_party.0001.t: "Můžeme začít"
 ep3_camp_party.0001.desc: "Konečně jsme všichni pohromadě, zásoby jsou připravené a uprostřed nás vesele praská oheň.\n\nŽivot na cestách bývá tvrdý. Oslava bude pro nás všechny příležitostí odpočinout si a aspoň na chvíli zapomenout na úmorný boj o přežití.\n\nAť veselice začne!"
 ep3_camp_party.0001.a: "Nemůžu se dočkat!"
 ep3_camp_party.0009.t: "Čas letí"
 ep3_camp_party.0009.desc: "Oheň dohasíná a tam, kde ještě nedávno šlehaly plameny, už jen matně žhnou uhlíky. I hodovníci se pomalu rozcházejí ke svým lůžkům.\n\nVšichni se skvěle bavili, ale nastal čas zábavu pro tentokrát ukončit."
 ep3_camp_party.0009.a: "A byla to vskutku skvělá veselice."
 ep3_camp_party.1000.t: "Vyprávění u ohně"
 ep3_camp_party.1000.desc: "„A pak! A pak!“ [storyteller.GetFirstName|U] divoce gestikuluje a spřádá příběh, který se táhne už pěknou chvíli. „Sesypal se jak pytel cihel! Trefilo ho to rovnou do hlavy!“\n\n[storyteller.GetFirstNameNoTooltip|U] se se spokojeným úsměvem vyhřívá v obdivu posluchačů. Byl to vskutku příběh plný odvahy a hrdinství.\n\nPosluchači jsou pořád celí žhaví a snaží se z [Select_CString(storyteller.IsFemale,'ní','něj')] vymámit další příběh."
 ep3_camp_party.1000.a: "Čím že jsi ho to vlastně [Select_CString(storyteller.IsFemale,'praštila','praštil')]?"
 ep3_camp_party.1000.a.tt: "S dostatkem starého dřeva a kovového šrotu bychom to možná dokázali vyrobit znovu..."
 ep3_camp_party.1000.b: "Já mám taky příběh!"
 ep3_camp_party.1000.b.success: "Tvůj příběh je ještě lepší"
 ep3_camp_party.1000.b.failure: "Tvůj příběh nijak zvlášť neuchvátí"
 ep3_camp_party.1000.b.tt: "[storyteller.GetFirstNameNoTooltip] se urazí, že se [Select_CString(storyteller.IsFemale,'ji','ho')] snažíš trumfnout"
 ep3_camp_party.1000.c: "Ano! Ještě!"
 ep3_camp_party.1000.c.success: "Další příběh je ještě lepší"
 ep3_camp_party.1000.c.failure: "Další příběh už tolik nezaujme"
 ep3_camp_party.1000.d: "Pěkný příběh."
 ep3_makeshift_mace: "Provizorní palcát"
 ep3_makeshift_mace_description: "Těžký improvizovaný palcát vyrobený přesně podle vyprávění. Je stejně nepopiratelně účinný jako hrubě zpracovaný a zkušenosti získané při jeho výrobě jistě v budoucnu pomohou ušetřit."
 ep3_camp_party.1005.t: "Kde se toulá?"
 ep3_camp_party.1005.desc: "„Ehm... [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]?“ přistoupí ke mně [attendee.GetFirstName] a ustaraně si mne ruce. „Nevím, kde je [wanderer.GetFirstName]. Už je to pěkně dlouho...“\n\nOpravdu #EMP je#! to už dlouho, co jsem [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')] [wanderer.Custom('CZ_FirstNameNoTooltip_A')] naposledy. Obloha se mezitím s blížícím se soumrakem zlověstně zatahuje.\n\nKam se jen [Select_CString(wanderer.IsFemale,'zatoulala','zatoulal')]?"
 ep3_camp_party.1005.a: "Přiložte do ohně, ať [Select_CString(wanderer.IsFemale,'ji','ho')] dovede domů."
 ep3_camp_party.1005.a.tt.positive: "#weak Kouř nepřiláká jen [Select_CString(wanderer.IsFemale,'zatoulanou','zatoulaného')] [wanderer.Custom('CZ_FirstNameNoTooltip_A')]...#!"
 ep3_camp_party.1005.b: "Vezmu pochodeň a půjdu hledat. Ale ne moc daleko."
 ep3_camp_party.1005.b.success: "Tvé stopařské schopnosti se okamžitě osvědčí"
 ep3_camp_party.1005.b.neutral: "[wanderer.GetFirstNameNoTooltip] se vrací spolu s několika bobulemi, které [Select_CString(wanderer.IsFemale,'našla','našel')]"
 ep3_camp_party.1005.b.failure: "Při hledání [wanderer.Custom('CZ_FirstNameNoTooltip_G')] tě napadne divoké zvíře"
 ep3_camp_party.1005.c: "Posadíme se a počkáme."
 ep3_camp_party.1005.c.success: "[wanderer.GetFirstNameNoTooltip] najde cestu zpět"
 ep3_camp_party.1005.c.failure: "[wanderer.GetFirstNameNoTooltip] se vrátí [Select_CString(wanderer.IsFemale,'zraněná','zraněný')]"
 ep3_camp_party.1005.c.critfailure: "[wanderer.GetFirstNameNoTooltip] se opravdu [Select_CString(wanderer.IsFemale,'ztratila','ztratil')]"
 ep3_camp_party.1006.t: "Nečekaní hosté"
 ep3_camp_party.1006.desc: "Sotva jsme [wanderer.Custom('CZ_FirstName_A')] usadili, šustění v křoví prozradí, že tu je ještě někdo další. Vyskočím na nohy, ale když se postava blížící se k nám vynoří ze tmy do světla, je jasné, že nemá zlé úmysly.\n\n„Prosím,“ začne [Select_CString(newcomer.IsFemale,'neznámá','neznámý')], „nechci dělat potíže. Jsem jen [Select_CString(newcomer.IsFemale,'potulná léčitelka','potulný léčitel')] a léčením si platím cestu.“\n\n„[Select_CString(newcomer.IsFemale,'Zahlédla','Zahlédl')] jsem stoupající kouř. [Select_CString(newcomer.IsFemale,'Byla bych vám vděčná, kdybych tu mohla','Byl bych vám vděčný, kdybych tu mohl')] chvíli zůstat a připojit se k vaší veselici. Tady, vezměte si něco k jídlu za to vyrušení.“"
 ep3_camp_party.1006.a: "„Nechceš u nás zůstat #EMP natrvalo#!?“"
 ep3_camp_party.1006.b: "„Pojď, posaď se! Nauč mě něco ze svého léčitelského umění!“"
 ep3_camp_party.1010.t: "Zkouška důvtipu"
 ep3_camp_party.1010.desc: "Šibalský úsměv [riddler.Custom('CZ_FirstName_G')] nad okrajem poháru nevěstí nic dobrého.\n\n„Tak pojď, [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')]. Uvidíme, jestli ti to po všech těch dnech na cestách ještě myslí!“ Rozmáchle pozvedne pohár. „Co třeba hádanku?“ A aniž by [Select_CString(riddler.IsFemale,'počkala','počkal')], až svolím, začne."
 ep3_camp_party.1010.desc_riddle_01: "\n\n#EMP „Vyrvali mě z matčina lůna,\nbili mě a pálili,\naž ze mě byl krvežíznivý zabiják."
 ep3_camp_party.1010.desc_riddle_02: "\n\n#EMP „Jednou jsem žlutý, jindy bílý,\nnapůl temný, napůl světlý.#!"
 ep3_camp_party.1010.desc_riddle_03: "\n\n#EMP „Mám čtyři nohy,\na přece nechodím.#!"
 ep3_camp_party.1010.desc_riddle_04: "\n\n#EMP „Mám jedno oko,\na přece nevidím.#!"
 ep3_camp_party.1010.desc_riddle_05: "\n\n#EMP „Mám klobouk, a hlavu ne,\nmám nohu, a přece nechodím.#!"
 ep3_camp_party.1010.desc_riddle_06: "\n\n#EMP „Chytit mě můžeš,\nale hodit mě nedokážeš.#!"
 ep3_camp_party.1010.desc_riddle_07: "\n\n#EMP „Chudí mě mají,\nboháči mě potřebují,\nkdo mě sní, zahyne.#!"
 ep3_camp_party.1010.desc_riddle_08: "\n\n#EMP „Snadno se do mě dostaneš,\nale těžko se ze mě vyhrabeš.#!"
 ep3_camp_party.1010.desc_outro: "\nCo jsem?“#!"
 ep3_camp_party.1010.a: "„To je snadné. Odpověď zní ‚[ROOT.Char.Custom('GetCampPartyRiddleAnswer')]‘.“"
 ep3_camp_party.1010.b: "Odpověď by mohla být..."
 ep3_camp_party.1010.b.success: "Uhodneš správně"
 ep3_camp_party.1010.b.success.title: "Správná odpověď byla ‚[ROOT.Char.Custom('GetCampPartyRiddleAnswer')]‘."
 ep3_camp_party.1010.b.failure: "Neuhodneš"
 ep3_camp_party.1010.c: "„Ach, [riddler.Custom('CZ_FirstNameNoTooltip_V')], tvé hádanky jsou na mě příliš záludné!“"
 ep3_camp_party.1010.c.tt: "Ať je pravda jakákoli, pro klid v táboře bude nejlepší předstírat, že jsou..."
 ep3_camp_party.1010.answer_riddle_01: "železo"
 ep3_camp_party.1010.answer_riddle_02: "měsíc"
 ep3_camp_party.1010.answer_riddle_03: "stůl"
 ep3_camp_party.1010.answer_riddle_04: "jehla"
 ep3_camp_party.1010.answer_riddle_05: "houba"
 ep3_camp_party.1010.answer_riddle_06: "nemoc"
 ep3_camp_party.1010.answer_riddle_07: "nic"
 ep3_camp_party.1010.answer_riddle_08: "malér"
 ep3_camp_party.1015.t: "Natáhněte tětivy!"
 ep3_camp_party.1015.desc: "Sotva vstanu, abych si [Select_CString(ROOT.Char.IsFemale,'došla','došel')] pro další občerstvení, vyskočí i [archer.GetFirstName].\n\n„Myslím, že by nám všem prospěla trocha #EMP přátelského soupeření!#!“ začne s lukem v ruce. „Co takhle malá lukostřelecká soutěž? Luk pro tebe mám tady, [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')]...“\n\nPití bude asi muset počkat."
 ep3_camp_party.1015.a: "„Ať je to zajímavější, ne? Přineste dvě jablka.“"
 ep3_camp_party.1015.a.tt: "[apple_holder.GetFirstNameNoTooltip] na ně poslouží jako ideální stojan."
 ep3_camp_party.1015.a.success: "Tvůj šíp zasáhne jablko"
 ep3_camp_party.1015.a.failure: "Mineš, kdežto šíp [archer.Custom('CZ_FirstNameNoTooltip_G')] zasáhne"
 ep3_camp_party.1015.a.critfailure: "[archer.GetFirstNameNoTooltip] mine, ale tvoje rána dopadne mnohem hůř..."
 ep3_camp_party.1015.b: "„Co kdybychom si o to zalovili? Kdo první něco uloví, vyhrává.“"
 ep3_camp_party.1015.b.success: "Uloviš první kořist"
 ep3_camp_party.1015.b.failure: "[archer.GetFirstNameNoTooltip] uloví první kořist"
 ep3_camp_party.1015.b.critfailure: "[archer.GetFirstNameNoTooltip] tě omylem trefí svým šípem"
 ep3_camp_party.1015.c: "„Tak dobře, vyber cíl!“"
 ep3_camp_party.1015.c.success: "Vyhráváš"
 ep3_camp_party.1015.c.failure: "Prohráváš"
 ep3_camp_party.1015.d: "„Nikdy bych si [Select_CString(ROOT.Char.IsFemale,'netroufla','netroufl')] soupeřit s někým tvého formátu!“"
 ep3_camp_party.1020.t: "Kdo je tam?"
 ep3_camp_party.1020.opening: "Naši oslavu náhle přeruší postava, která se k nám potácí od okraje tábora. Je [Select_CString(local.IsFemale,'zjevně hladová a unavená','zjevně hladový a unavený')] a představí se jako [local.GetFirstName].\n\n"
 ep3_camp_party.1020.witch: "[local.GetFirstNameNoTooltip] je [Select_CString(local.IsFemale,'plachá a zesláblá','plachý a zesláblý')], v očích má ale stále pronikavou jasnost. [Select_CString(local.IsFemale,'Její','Jeho')] ošuntělý oděv je ověšený neznámými amulety a symboly.\n\n"
 ep3_camp_party.1020.cannibal: "Na krku [Select_CString(local.IsFemale,'jí','mu')] visí podivný náhrdelník z kostí. Je zjevné, že má hlad, ale oči se [Select_CString(local.IsFemale,'jí','mu')] nedočkavě rozzářily až ve chvíli, kdy se [Select_CString(local.IsFemale,'ptala','ptal')], jaké... #EMP maso#! máme.\n\n"
 ep3_camp_party.1020.mangled: "[Select_CString(local.IsFemale,'Ta nešťastnice je zmrzačená','Ten nešťastník je zmrzačený')] téměř k nepoznání. Chybí [Select_CString(local.IsFemale,'jí','mu')] noha i ruka a obličej i zbytek těla má posetý jizvami. Při pohledu na rozsah těch zranění se mi stáhne žaludek.\n\n"
 ep3_camp_party.1020.mystic: "V očích [local.Custom('CZ_FirstNameNoTooltip_G')] se skrývá hluboká moudrost. Když prosebně sepne dlaně, vonné tyčinky na [Select_CString(local.IsFemale,'jejím','jeho')] opasku zachřestí.\n\n"
 ep3_camp_party.1020.siblings: "Než stihnu odpovědět, přidá se k nám druhá postava, shrbená a zjevně v bolestech. [local.GetFirstNameNoTooltip|U] k [Select_CString(local_sibling.IsFemale,'ní','němu')] okamžitě přiskočí a něžně, ale majetnicky [Select_CString(local_sibling.IsFemale,'ji','ho')] k sobě přitáhne.\n\n„Prosím.“ [local.GetFirstNameNoTooltip|U] se na mě prosebně dívá. „[local_sibling.GetFirstName|U] je [Select_CString(local_sibling.IsFemale,'moje','můj')] [local_sibling.Custom('SisterBrother')]. Potřebuje si odpočinout a napít se.“\n\nJejich pouto je zjevně blízké. #EMP Velmi#! blízké. Ale co jsou ty tmavě rudé skvrny na jejich oblečení...?"
 ep3_camp_party.1020.ending: "„Prosím jen o bezpečný nocleh a trochu jídla, [ROOT.Char.Custom('FormOfAddressForLiege')],“ říká [local.GetFirstNameNoTooltip]. „[Select_CString(local.IsFemale,'Byla bych vám za to velmi zavázaná','Byl bych vám za to velmi zavázaný')].“"
 ep3_camp_party.1020.a: "„Proč tu rovnou nezůstat?“"
 ep3_camp_party.1020.b: "Trochu jídla můžeme postrádat."
 ep3_camp_party.1020.c: "Těch pár skromných přídělů, co máme, si musíme nechat."
 ep3_camp_party.1021.t: "Odmítnutí"
 ep3_camp_party.1021.witch: "Jasné oči [local.Custom('CZ_FirstNameNoTooltip_G')] ztvrdnou hněvem a ponížením.\n\n„Toho budete litovat.“ Přejede nás všechny pohledem a pohrdavě zkřiví rty. „Jeden z nás už mezi vámi je. Ten se postará, abyste trpěli.“\n\nPo těch slovech zmizí v houstnoucí tmě."
 ep3_camp_party.1021.cannibal: "[local.GetFirstNameNoTooltip|U] se nad mou odpovědí ušklíbne.\n\n„Ani [Select_CString(local.IsFemale,'ženě','muži')] v nouzi nepomůžete, co? A to už mezi sebou jednoho takového, jako jsem já, máte. Jo, vidím to. Vidím, že víte, co ty kosti znamenají.“\n\nNaposledy pohrdavě zavrtí hlavou a odbelhá se do tmy, aniž by cokoli dalšího [Select_CString(local.IsFemale,'vysvětlila','vysvětlil')]."
 ep3_camp_party.1021.mangled: "[local.GetFirstNameNoTooltip] nevypadá rozzlobeně, spíš jen smutně.\n\n„Další zářez v dlouhém boji, který život vede proti mé existenci.“ Teskně se usměje a beze slova odejde.\n\nZatímco sleduji, jak pomalu odkulhává, cítím, jak se mi pohledy mých společníků zavrtávají do zátylku. Tohle rozhodnutí nebylo populární."
 ep3_camp_party.1021.mystic: "Odplata [local.Custom('CZ_FirstNameNoTooltip_G')] přišla rychle a téměř bez varování. Zkřivené rty, plivnutá urážka – a najednou se mi rozmaže zrak. [local.GetFirstName|U] mi [Select_CString(local.IsFemale,'vmetla','vmetl')] do tváře hrst zrnité směsi a stejně rychle [Select_CString(local.IsFemale,'zmizela','zmizel')] z tábora, zatímco ke mně přispěchali mí družiníci.\n\nZdá se, že žádné okamžité následky nemám, ale... žaludek mám trochu rozbouřený..."
 ep3_camp_party.1021.siblings: "Tvář [local.Custom('CZ_FirstName_G')] se náhle zkřiví do masky nenávisti. Je to poslední, co vidím, než mi kámen, který [Select_CString(local.IsFemale,'skrývala','skrýval')] v dlani, rozdrtí oční jamku.\n\nSkácím se k zemi a držím se za obličej. Jen matně vnímám, jak oba sourozenci prchají a jak se kolem mě sbíhají mí družiníci."
 ep3_camp_party.1021.callous: "Když domluvím, tvář [local.Custom('CZ_FirstName_G')] potemní, ale já se už odvracím. Pokynem dám ostatním najevo, ať vetřelce z tábora vyvedou.\n\nZatímco je odvlékají, nálada se mi zlepší."
 ep3_camp_party.1021.normal: "Ve tváři [local.Custom('CZ_FirstName_G')] se mísí smutek, hněv a beznaděj. Odchází však bez jakéhokoli nepřátelství.\n\nPotlačím rostoucí pocit viny a vracíme se k oslavě."
 ep3_camp_party.1021.a.face: "#EMP ARGHHHH!#!"
 ep3_camp_party.1021.a.ill: "Opravdu se necítím #DIE1 moc dobře...#!"
 ep3_camp_party.1021.a.sad: "No, muselo to být."
 ep3_camp_party.1021.b: "Skvěle. Zpátky k veselici!"
 ep3_camp_party.1025.t: "Vzpomínání"
 ep3_camp_party.1025.desc: "Veselí pokračuje, ale [friend.GetFirstName] je zjevně [Select_CString(friend.IsFemale,'zamyšlená','zamyšlený')].\n\n„Tohle mi opravdu připomíná dětství,“ rozhlíží se teskně kolem. „Tolik lumpáren a veselí. Hned bych si [Select_CString(friend.IsFemale,'vybavila','vybavil')] stovku takových nocí!“ Pak se podívá na mě.\n\n„A co ty? Máš nějaké historky z doby, kdy jsi [Select_CString(ROOT.Char.IsFemale,'byla','byl')] [ROOT.Char.Custom('GetLassLad')]?“"
 ep3_camp_party.1025.a: "Radši si poslechnu další tvoje!"
 ep3_camp_party.1025.b: "Samozřejmě!"
 ep3_camp_party.1025.b.success: "Tvé historky mají úspěch"
 ep3_camp_party.1025.b.failure: "Nenapadne tě žádná dobrá historka"
 ep3_camp_party.1025.c: "Ale jo. Hele, [Select_CString(friend.IsFemale,'slyšela','slyšel')] jsi, že..."
 ep3_camp_party.1025.c.tt: "Když budu [Select_CString(ROOT.Char.IsFemale,'nenápadná','nenápadný')], možná si změny tématu nevšimne..."
 ep3_camp_party.1030.t: "Narazit sud"
 ep3_camp_party.1030.desc: "Pohár mám prázdný, [Select_CString(ROOT.Char.IsFemale,'dopila','dopil')] jsem poslední kapky. Otočím se pro další, ale najdu jen hlouček lidí ve stejné situaci.\n\n„Došlo nám to.“ [reveler.GetFirstName|U] s lucernou v ruce prohrabává zásoby. „#EMP Mohli#! bychom narazit další sud, ale když ho nedopijeme, zvětrá...“"
 ep3_camp_party.1030.a: "Jeden? Narazte #EMP dva!#!"
 ep3_camp_party.1030.b: "Trochu si užijme, ne?"
 ep3_camp_party.1030.b.success: "Tvá bujarost sklidí uznání"
 ep3_camp_party.1030.c: "Kvůli jedné noci veselí nesmíme ztratit kontrolu."
 ep3_camp_party.1035.t: "Došlo dříví"
 ep3_camp_party.1035.desc: "Jsem tak [Select_CString(ROOT.Char.IsFemale,'zabraná','zabraný')] do hovoru, že si sotva všimnu, jak se setmělo. Teprve když nedokážu poznat, kdo se k nám právě přidal, pohlédnu na oheň.\n\nUhlíky jen matně žhnou, oheň skoro vyhasl. [treefeller.GetFirstName|U] nad mým rychlým rozhlížením po táboře zavrtí hlavou.\n\n„Spálili jsme poslední dříví. Musíme sehnat další.“ Vyskočí na nohy, popadne opodál ležící sekeru a tázavě na mě zvedne obočí."
 ep3_camp_party.1035.a: "„Počkej. Máme přece ty staré sudy a bedny...“"
 ep3_camp_party.1035.a.success: "Tvůj nápad se osvědčí"
 ep3_camp_party.1035.b: "„Dobře, dej to sem.“"
 ep3_camp_party.1035.b.success: "Kácení proběhne podle plánu"
 ep3_camp_party.1035.b.failure: "Nenajdeš žádný vhodný strom ke kácení"
 ep3_camp_party.1035.b.critfailure: "Strom padá nešikovně..."
 ep3_camp_party.1035.c: "„Na kácení není čas. Nalámeme chrastí z těch keřů.“"
 ep3_camp_party.1040.t: "Potulný obchodník"
 ep3_camp_party.1040.desc: "Rozruch! Zbystřím a otočím se. Pár mých družiníků se dohaduje s [Select_CString(merchant.IsFemale,'obchodnicí, která','obchodníkem, který')] stojí u vozu taženého koněm.\n\n„Jen to nejlepší zboží!“ hlásá se šibalským úsměvem. „Z dálky jsem [Select_CString(merchant.IsFemale,'viděla a slyšela','viděl a slyšel')] vaše veselí, a tak jsem si #EMP pochopitelně#! [Select_CString(merchant.IsFemale,'musela zajet, abych vám, dobří lidé, nabídla','musel zajet, abych vám, dobří lidé, nabídl')] příležitost něco si pořídit!“\n\nPřistoupím blíž a snažím se zaostřit přes mírně opilý opar. Rozhodně se to všechno leskne..."
 ep3_camp_party.1040.a: "Chci ten velký!"
 ep3_camp_party.1040.b: "Jedna z těch cetek by se hodila."
 ep3_camp_party.1040.c: "Táhni, ty kořistníku!"
 resplendent_armour_name: "Zářivá zbroj"
 resplendent_armour_desc: "Tato působivá zbroj se třpytí všude, kam dopadne světlo, a odráží je jemný filigrán vykládaný ve spletitých vzorech po celém povrchu. Kalené materiály poskytují vynikající ochranu před každým útočníkem."
 ep3_camp_party.2000.t: "Lepší vrabec v hrsti..."
 ep3_camp_party.2000.desc: "„... a #EMP proto#! [ROOT.Char.Custom('GetFirstFollowerTraitMonologue')],“ dokončí [Select_CString(first_follower.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMe', first_follower )], [first_follower.GetFirstName], a znovu si přihne ze svého korbele. [ROOT.Char.Custom('RegionalDrink')|U] [Select_CString(first_follower.IsFemale,'jí','mu')] dnes zjevně chutná.\n\nTéma [first_follower.Custom('CZ_FirstNameNoTooltip_G')] mě #EMP opravdu#! zajímá, ale zaváhám, když zaslechnu, jak [second_follower.GetFirstName] vykládá o tom, „... že [ROOT.Char.Custom('GetSecondFollowerTraitMonologue')].“\n\nTrochu ve stresu se snažím rozhodnout, ke kterému rozhovoru se přidat:"
 ep3_camp_party.2000.a: "„[first_follower.Custom('CZ_FirstNameNoTooltip_V')|U], co si myslíš o...“"
 ep3_camp_party.2000.b: "„To je zajímavý pohled, [second_follower.Custom('CZ_FirstNameNoTooltip_V')]!“"
 ep3_camp_party.2000.c: "„Noc je ještě mladá! Proberme dál #EMP obě#! témata!“"
 ep3_camp_party.2000.d: "„Pojďte! Raději se spolu najezme!“"
 ep3_camp_party.2000.d.tt: "[THIS.Char.GetDomicile.GetName] #bold nemá#! budovu [GetDomicileBuilding('mess_tent_03').GetName] na úrovni #V 3#! nebo vyšší"
 ep3_camp_party.2000.callous: "lidé jsou dnes tak #EMP přecitlivělí#!"
 ep3_camp_party.2000.sadistic: "fyzická bolest #EMP dokáže#! člověka vytvarovat k větší užitečnosti"
 ep3_camp_party.2000.zealous: "boží plán nás #EMP povede#!, jen když se mu podřídíme"
 ep3_camp_party.2000.craven: "svět je v poslední době tak #EMP nebezpečný#!"
 ep3_camp_party.2000.forgiving: "nastavit druhou tvář učí #EMP více#! než jedno náboženství"
 ep3_camp_party.2000.compassionate: "pomoc potřebným #EMP je#! odměnou sama o sobě"
 ep3_camp_party.2000.gregarious: "veselice jsou #EMP tak#! uvolňující a užívat si společnosti druhých je #EMP prospěšné#!"
 ep3_camp_party.2000.paranoid: "#EMP všechno#! spolu souvisí; třeba loňské sucho s tím, že sotva která slepice snese vejce každý den!"
 ep3_camp_party.2000.eccentric: "měsíc má dnes večer v nose pořádného holuba"
 ep3_camp_party.2000.brave: "překonat vlastní strach je v životě to #EMP nejdůležitější#!"
 ep3_camp_party.2000.just: "#EMP musíme#! dodržovat místní zákony a pravidla, ne jako nějací #EMP divoši#!"
 ep3_camp_party.2000.lazy: "kdo si pořádně odpočine, je na útrapy #EMP mnohem#! lépe připravený"
 ep3_camp_party.2000.arrogant: "lidi jsou dnes čím dál #EMP tupější#!"
 ep3_camp_party.2000.fickle: "je tak těžké se #EMP možná někdy třeba#! rozhodnout"
 ep3_camp_party.2000.diligent: "je #EMP uspokojivé#! mít všechnu práci hotovou a odevzdanou"
 ep3_camp_party.2000.lustful: "je prostě zdravé občas podlehnout #EMP pokušení#!"
 ep3_camp_party.2000.chaste: "jsme #EMP lepší#! než špinavá zvířata, protože svůj chtíč dokážeme kdykoli zkrotit"
 ep3_camp_party.2000.greedy: "za [ROOT.Char.Custom('RegionalRootVegetablePlural')] se teď platí #EMP hříšné#! peníze"
 ep3_camp_party.2000.generous: "je příjemné se s ostatními #EMP podělit#! o to málo, co člověk má"
 ep3_camp_party.2000.humble: "člověk by se #EMP neměl#! vydávat za někoho, kým není"
 ep3_camp_party.2000.temperate: "vyplatí se #EMP nechodit#! spát s plným břichem"
 ep3_camp_party.2000.gluttonous: "bychom si měli #EMP dopřát#! dobré a chutné jídlo, kdykoli je příležitost"
 ep3_camp_party.2000.wrathful: "lidé, kteří #EMP prostě nechtějí slyšet rozum#!, jsou obyčejní #EMP hlupáci#!"
 ep3_camp_party.2000.patient: "je příjemné jen chvíli #EMP posedět#! a pozorovat okolí"
 ep3_camp_party.2000.impatient: "tady to #EMP trvá zatraceně dlouho#!, než se člověk dočká pití"
 ep3_camp_party.2000.calm: "problémy se s chladnou hlavou #EMP řeší#! snáz"
 ep3_camp_party.2000.deceitful: "#EMP někteří#! si myslí, že [other_follower.GetFirstName] je spíš [other_follower.Custom('quirk_neg_adjective')], ale #EMP podle mě#! je prostě [other_follower.Custom('quirk_pos_adjective')]"
 ep3_camp_party.2000.honest: "do prvního chodu se vložilo obdivuhodné #EMP úsilí#!, ale #EMP nijak zvlášť#! dobrý nebyl"
 ep3_camp_party.2000.shy: "plachost je prostě známkou #EMP inteligence#!, #EMP ne#! méněcennosti"
 ep3_camp_party.2000.ambitious: "jen tvrdá práce tě v životě #EMP někam#! dostane"
 ep3_camp_party.2000.content: "veselice je zatím příjemná a není si na co stěžovat"
 ep3_camp_party.2000.arbitrary: "tajemstvím klidného života je #EMP spontánnost a intuice#!"
 ep3_camp_party.2000.trusting: "musíme věřit, že ostatním na bližních #EMP záleží#!"
 ep3_camp_party.2000.stubborn: "o všechno, co za něco stojí, se musí #EMP urputně#! bojovat"
 ep3_camp_party.2000.vengeful: "#EMP pomsta#! je jídlo, které se nejlépe podává studené"
 camp_party_listened_to_me_opinion: "Ochota mě vyslechnout"
 camp_party_reveled_opinion: "Společné veselí"
 ep3_camp_party.2100.t: "Povídání u ohně"
 apa_fireside_chat_shared_stories_martial_title: "Povídání u ohně o strategii"
 apa_fireside_chat_shared_stories_martial: "[first.GetShortUINameNoTooltip] [Select_CString(first.IsFemale,'naučila','naučil')] [second.Custom('CZ_ShortUINameNoTooltip_A')] cennou lekci o strategii"
 apa_fireside_chat_shared_stories_learning_title: "Povídání u ohně o knihách"
 apa_fireside_chat_shared_stories_learning: "[first.GetShortUINameNoTooltip] [Select_CString(first.IsFemale,'předčítala','předčítal')] [second.Custom('CZ_ShortUINameNoTooltip_D')] úryvky z díla #EMP [SCOPE.Custom('RandomInformativeTextName')|U]#!"
 apa_fireside_chat_shared_stories_diplomacy_title: "Povídání u ohně o diplomacii"
 apa_fireside_chat_shared_stories_diplomacy: "[first.GetShortUINameNoTooltip] [Select_CString(first.IsFemale,'zapojila','zapojil')] [second.Custom('CZ_ShortUINameNoTooltip_A')] do ostré, ale civilizované debaty"
 apa_fireside_chat_shared_stories_stewardship_title: "Povídání u ohně o správě"
 apa_fireside_chat_shared_stories_stewardship: "[first.GetShortUINameNoTooltip] [Select_CString(first.IsFemale,'vysvětlila','vysvětlil')] [second.Custom('CZ_ShortUINameNoTooltip_D')] složité detaily architektury"
 apa_fireside_chat_shared_stories_intrigue_title: "Povídání u ohně o intrikách"
