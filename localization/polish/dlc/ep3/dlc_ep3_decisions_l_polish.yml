 change_election_candidacy_status_decision_desc.embrace: "Po rozmyšlení jsem [Select_CString(ROOT.Char.IsFemale,'zjistila','zjistil')], že jsem možná... trochu #EMP příliš#! ukvapeně [Select_CString(ROOT.Char.IsFemale,'odmítla','odmítl')] možnost vyšší koruny. Pokud mě kolegové podpoří, kdo jsem, abych jim to [Select_CString(ROOT.Char.IsFemale,'odepřela','odepřel')]?"
