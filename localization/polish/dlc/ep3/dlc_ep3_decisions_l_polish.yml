 convert_to_administrative_celestial_desc: "#bold Nesplňuješ#! alespoň jednu z následujících podmínek:\n$EFFECT_LIST_BULLET$Držíš titul [GetTitleByKey('h_china').GetName]\n$EFFECT_LIST_BULLET$Jsi vazalem [GetTitleByKey('h_china').Custom('CZ_LandedNameNoTier_G')]\n$EFFECT_LIST_BULLET$[Concept('culture','kultura')|E] tvého [Concept('top_liege_possessive','nejvyššího lenního pána')|E] je [GetCultureByKey('han').GetName]\n$EFFECT_LIST_BULLET$[Concept('culture','kultura')|E] tvého [Concept('top_liege_possessive','nejvyššího lenního pána')|E] pochází z kultury [GetCultureByKey('han').GetName]"
 convert_to_administrative_meritocratic_desc: "#bold Nesplňuješ#! alespoň jednu z následujících podmínek:\n$EFFECT_LIST_BULLET$Tvé [Concept('realm','panství')|E] sousedí s [Concept('ruler','vládcem')|E], jehož [Concept('government','vláda')|E] používá [Concept('merit','zásluhy')|E]\n$EFFECT_LIST_BULLET$Tvé [Concept('capital','hlavní sídlo')|E] se nachází v oblasti [GetGeographicalRegion('world_asia').GetName], [GetGeographicalRegion('world_tibet').GetName], [GetGeographicalRegion('world_burma').GetName] nebo [GetGeographicalRegion('world_steppe_east').GetName]"
 convert_to_administrative_japanese_desc: "#bold Nesplňuješ#! alespoň jednu z následujících podmínek:\n$EFFECT_LIST_BULLET$[Concept('government','Vláda')|E] tvého [Concept('top_liege_possessive','nejvyššího lenního pána')|E] je [GetGovernment('japan_administrative_government').GetName] nebo [GetGovernment('japan_feudal_government').GetName]\n$EFFECT_LIST_BULLET$Tvá [Concept('government','vláda')|E] je [GetGovernment( 'japan_feudal_government' ).GetName]"
 dukes_become_governors: "Každý [Concept('vassal','vazal')|E] [Concept('title_tier','úrovně')|E] [Concept('duchy','vévodství')|E] se stane [Concept('governor','guvernérem')|E]"
 vassals_can_become_administrative: "\nKaždý [Concept('feudal','feudální')|E] nebo [Concept('clan','klanový')|E] [Concept('vassal','vazal')|E] v tvém [Concept('de_jure','de iure')|E] [Concept('realm','panství')|E], který vyznává tvou [Concept('faith','víru')|E], může změnit svou [Concept('government','vládu')|E] na [Concept('government_bureaucratic_type','byrokratickou')|E], pokud splní jednu z následujících podmínek:"
 powerful_vassals_become_administrative: "Je [Concept('powerful_vassal','mocným vazalem')|E]"
 vassals_become_administrative: "Má o tobě [Concept('opinion','mínění')|E] alespoň #P 25#!."
 vassals_who_may_switch_to_administrative: "Navíc každý vazal, který o tobě má kladné mínění, může s určitou šancí přejít na [Concept('government_bureaucratic_type','byrokratický')|E] typ [Concept('government','vlády')|E]."
 vassal_did_not_become_administrative: "Někteří [Concept('vassals','vazalové')|E] na byrokratickou správu nepřešli a později je bude nutné přesvědčit nebo donutit, aby přijali [Concept('government_bureaucratic_type','byrokratickou')|E] [Concept('government','vládu')|E]."
 governors_become_dukes: "Každý [Concept('governors','guvernér')|E] se stane [Concept('vassal','vazalem')|E] [Concept('title_tier','úrovně')|E] [Concept('duchy','vévodství')|E]"
 kings_become_feudal: "Každý [Concept('vassal','vazal')|E] [Concept('title_tier','úrovně')|E] [Concept('kingdom','království')|E] změní typ [Concept('government','vlády')|E] na [Concept('feudal','feudální')|E]"
 kings_become_clan: "Každý [Concept('vassal','vazal')|E] [Concept('title_tier','úrovně')|E] [Concept('kingdom','království')|E] změní typ [Concept('government','vlády')|E] na [Concept('clan','klanovou')|E]"
 estates_get_bought: "Každá [Concept('noble_families','šlechtická rodina')|E] se [Concept('estate','statkem')|E] obdrží určité množství [Concept('gold','zlata')|E][gold_i]"
 first_admin_emperor: "Zákonodárce"
 first_admin_emperor_desc: "Tato postava zavedla v této říši [Concept('government_bureaucratic_type','byrokratickou')|E] formu [Concept('government','vlády')|E]. I když teď vládnou pravidla a úřady, všichni si pamatují, kdo ten rámec vytvořil. Díky tomu se jí vládne mnohem snáz, než se bude vládnout jejím nástupcům"
 ep3_decisions_event.4060.t: "$major_decisions.0001.t$"
 ep3_decisions_event.4060.desc: "Přeorganizovat říši velikosti [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_G')] není malý úkol. To, co bylo kdysi sítí osobních loajalit, je nyní stát s guvernéry a úředníky.\n\n"
 ep3_decisions_event.4060.resistance.desc: "Některé části říše zůstávají touto reformou nedotčeny. [obstinate_vassal.GetName|U] nedůvěřuje mně i mým reformám. To nemůžeme dlouho tolerovat.\n\n"
 ep3_decisions_event.4060.state_faith.desc: "Některé části říše zůstávají reformou nedotčeny. [non_state_faith_vassal.GetName|U] nedůvěřuje samotné myšlence státní víry a odmítá mé reformy. To nelze dlouho tolerovat.\n\n"
 ep3_decisions_event.4060.de_jure.desc: "Některé části říše zůstávají reformou nedotčeny. [non_de_jure_vassal.GetPrimaryTitle.GetNameNoTooltip|U] je mimo nový stát, který jsme vybudovali. To nemůžeme dlouho tolerovat.\n\n"
 ep3_decisions_event.4060.outro.desc: "Jak se právní stát rozšíří po celé říši, není pochyb, že představy o rodině a vazalství ustoupí městské hrdosti a centralizaci."
 ep3_decisions_event.4060.a: "Zákon nyní vládne těmto zemím!"
 ep3_decisions_event.4065.opening: "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 ep3_decisions_event.4065.desc: "Říše je reorganizována, zásadou je zásluhovost. Už zde není místo pro dědičné držitele půdy.\nOčekávám, že se každý vazal přizpůsobí a připojí se k řadám mých guvernérů."
 ep3_decisions_event.4065.a: "Za [actor.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_I')]!"
 ep3_decisions_event.4065.b: "Nevzdám se svých práv."
 ep3_decisions_event.4065.c: "Zajímavé"
 convert_to_feudalism_from_administrative_decision: "Přijmout [ROOT.Char.Custom('GetTribalReformGovernment')|U] způsoby"
 convert_to_feudalism_from_administrative_decision_desc: "Méně byrokracie a více #EMP činění#! tohle říše potřebuje. Pokud má [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] rozkvést, musíme se přestat vázat na věci, které nás brzdí."
 convert_to_feudalism_from_administrative_decision_confirm: "Přijmout [ROOT.Char.Custom('GetTribalReformGovernment')|U] způsoby"
 convert_to_feudalism_from_administrative_decision_tooltip: "Změnit typ [Concept('government','vlády')|E]"
 you_have_governorship_rights_tt: "Tvůj [Concept('liege','lenní pán')|E] ti prostřednictvím [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('petition_liege_decision').GetName] udělil #high práva provinčního rodu#! ve tvé [GetPlayer.Custom('GetProvinceConcept')|l]"
 governorship_is_on_the_border_tt: "Tvá [GetPlayer.Custom('GetProvinceConcept')|l] hraničí s jiným [Concept('realm','panstvím')|E]"
 ep3_decisions_event.4070.t: "$major_decisions.0200.t$"
 ep3_decisions_event.4070.desc: "Někdy je lepší se vrátit k osvědčenému.\n\nZatímco administrativní přístup jen škodil [actor.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_D')], staré způsoby mají nepopiratelné výhody a tradiční strukturu, které nám pomohou dosáhnout nových výšin."
 ep3_decisions_event.4070.a: "Musíme se přizpůsobit měnícím se okolnostem."
 ep3_decisions_event.4075.opening: "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 ep3_decisions_event.4075.a: "$ep3_decisions_event.4065.a$"
 gather_provisions_decision: "Shromáždit zásoby"
 gather_provisions_decision_desc: "Stejně jako armáda, tábor postupuje podle žaludku. Pokud bude potřeba, lze divočinu [ROOT.Char.GetCurrentLocation.GetName] pročesat kvůli zásobám."
 gather_provisions_decision_tooltip: "Prohledat krajinu kvůli [Concept('provisions','proviantu')|E]"
 gather_provisions_decision_confirm: "Prosím, už zase ne kopřivová polévka..."
 gather_provisions_decision_effect_tt: "[Concept('provisions','Proviant')|E] můžeš hledat ty, tvůj [GetCourtPositionType('chief_forager_camp_officer').GetName()|l] nebo tvůj [GetCourtPositionType('huntperson_camp_officer').GetName()|l]"
 gather_provisions_decision_unlock_tt: "Vyžaduje [GetDomicileBuilding('mess_tent_01').GetName] [Concept('domicile_building','budovu domicilu')|E]"
 ep3_decisions_event.7000.t: "Požehnání [forage_province.GetNameNoTooltip]"
 ep3_decisions_event.7000.desc: "Když vyjdu z tábora, obhlížím okolní [forage_province.Custom('CZ_TerrainTypeProvince_A')], hledajíc známky zvěře nebo krmení.\n\n"
 ep3_decisions_event.7000.winter_forage: "[forage_province.GetName] může v mírných ročních obdobích nabídnout více, ale zimní krutý mráz ztvrdí [forage_province.Custom('GetProvinceGroundDesc')] a pokryje [forage_province.Custom('CZ_GetTerrainTypePlural_A')] námrazou. Tady mnoho nenajdeme..."
 ep3_decisions_event.7000.difficult_forage: "Prohledávání [forage_province.Custom('GetProvinceGroundDesc')] a [forage_province.Custom('CZ_GetTerrainTypePlural_G')] [CZPrepV(forage_province.GetNameNoTooltip)] [CZProvName(forage_province,'L')] nenabízí mnoho naděje: místo je zbaveno čehokoliv, co by nasytilo naše žaludky. Naším nejlepším nadějí je lov."
 ep3_decisions_event.7000.difficult_hunt: "Ačkoli v okolí [CZProvName(forage_province,'G')] je spousta hub, kořenů a bobulí, není to ráj pro lovce. Není tu ani zajíc k vidění."
 ep3_decisions_event.7000.good: "Měli jsme štěstí: klima [CZPrepV(forage_province.GetNameNoTooltip)] [CZProvName(forage_province,'L')] je mírné a bohaté. Kdekoli se podíváte, dary přírody se rozlévají po [forage_province.Custom('CZ_GetTerrainTypePlural_L')]. Zde se nám bude dařit."
 ep3_decisions_event.7000.fallback: "[forage_province.GetName] by se k nám měl chovat dobře. [forage_province.Custom('CZ_GetTerrainTypePlural_In')|U] je plno života a stačí jen věnovat správný čas a péči, abychom tu našli potravu."
 ep3_decisions_event.7000.a: "Mohu nám zajistit něco k jídlu."
 ep3_decisions_event.7000.a_foraging: "[SelectLocalization(ObjectsEqual(ROOT.Char.MakeScope.Var('has_golden_aplomb_perk').GetFlagName,'yes'),'ep3_decisions_event.7000.a_flavor_golden_aplomb','ep3_decisions_event.7000.a_flavor')]"
 ep3_decisions_event.7000.a_flavor: "#medium Získávání zásob je ovlivněno [Concept('terrain','terénem')|E] a [Concept('winter','tuhostí zimy')|E]\n#flavor Velmi účinné v:#!\n     $EFFECT_LIST_BULLET$Orná půda, Lesy, Pahorky, Roviny, Oázy, Záplavové pláně\n#flavor Částečně účinné v:#!\n    $EFFECT_LIST_BULLET$Suché oblasti, Hory, Džungle, Mokřady, Step\n#flavor Neúčinné v:#!\n    $EFFECT_LIST_BULLET$Pouště, Pustinné hory, Tajga#!"
 ep3_decisions_event.7000.a_flavor_golden_aplomb: "#medium Získávání zásob je ovlivněno [Concept('terrain','terénem')|E] a [Concept('winter','tuhostí zimy')|E]\n#flavor Velmi účinné v:#!\n     $EFFECT_LIST_BULLET$Orná půda, Lesy, Pahorky, Roviny, Oázy,\n     $EFFECT_LIST_BULLET$Záplavové pláně, Suché oblasti, Hory, Džungle, Mokřady, Step (díky [GetPerk('golden_aplomb_perk').GetName(GetPlayer)] [Concept('perk','talentu')|e])\n#flavor Neúčinné v:#!\n    $EFFECT_LIST_BULLET$Pouště, Pustinné hory, Tajga#!"
 ep3_decisions_event.7000.b_trapping: "[SelectLocalization(ObjectsEqual(ROOT.Char.MakeScope.Var('has_golden_aplomb_perk').GetFlagName,'yes'),'ep3_decisions_event.7000.a_flavor_golden_aplomb','ep3_decisions_event.7000.a_flavor')]"
 ep3_decisions_event.7000.b_flavor: "#medium Třepení (pastvení) je ovlivněno [Concept('terrain','terénem')|E]\n#flavor Velmi účinné v:#!\n     $EFFECT_LIST_BULLET$Džungle, Lesy, Pahorky, Roviny, Oázy, Suché oblasti\n#flavor Částečně účinné v:#!\n    $EFFECT_LIST_BULLET$Pouště, Pustinné hory, Hory, Tajga, Step\n#flavor Neúčinné v:#!\n    $EFFECT_LIST_BULLET$Orná půda, Záplavové pláně, Mokřady#!"
 ep3_decisions_event.7000.b_flavor_golden_aplomb: "#medium Třepení (pastvení) je ovlivněno [Concept('terrain','terénem')|E]\n#flavor Velmi účinné v:#!\n$EFFECT_LIST_BULLET$Džungle, Lesy, Pahorky, Roviny, Oázy, Suché oblasti, Pouště, Pustinné hory, Hory, Tajga, Step (díky [GetPerk('golden_aplomb_perk').GetName(GetPlayer)] [Concept('perk','talentu')|e])\n#flavor Neúčinné v:#!\n    $EFFECT_LIST_BULLET$Orná půda, Záplavové pláně, Mokřady#!"
