 adopt_state_faith: "Přijmout státní víru"
 adopt_state_faith_decision_desc: "Přijetí [Concept('state_faith','státní víry')|E] [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l] znamená zlom. Sladění mé duchovní cesty se směrem [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l] posílí mé postavení jako [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')] a bezpochyby mě pevněji spojí s poddanými."
