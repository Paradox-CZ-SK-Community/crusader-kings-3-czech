 artifact_wall_court_icon_large_description: "Impozantní ikona, malovaná v tradičním stylu pravoslavné církve, zobrazující vážnou náboženskou scénu: [owner.Custom('RandomIconTopic')]."
 artifact_wall_court_icon_small_name: "Malá ikona"
 artifact_wall_court_icon_small_description: "Malá, přesto působivá ikona, malovaná v tradičním stylu pravoslavné církve, zobrazující v živých barvách náboženskou scénu: [owner.Custom('RandomIconTopic')]"
 artifact_trinket_icon_name: "Přenosná ikona"
 artifact_trinket_icon_description: "Přenosná ikona, malovaná v obvyklém stylu pravoslavné církve, zobrazující tradiční náboženskou scénu: [owner.Custom('RandomIconTopic')]. Navzdory své drobné velikosti jsou výtvarné prvky precizní, barvy živé a výraz vážný."
 commission_icon_decision_effect: "Místní malíř je povolán, aby vytvořil ikonu [Concept('artifact','artefakt')|E]"
 ep3_decisions_event.5000.t: "Ikona dokončena"
 ep3_decisions_event.5000.desc: "[local_artisan.GetFirstName], [Select_CString(local_artisan.IsFemale,'malířka, které','malíř, kterému')] jsem [Select_CString(ROOT.Char.IsFemale,'svěřila','svěřil')] objednávku ikony, se [Select_CString(local_artisan.IsFemale,'vrátila','vrátil')] na dvůr, aby mi [Select_CString(local_artisan.IsFemale,'předložila','předložil')] plody své práce.\n\n„[ROOT.Char.GetFaith.HighGodName]-[Select_CString(ROOT.Char.IsFemale,'požehnaná','požehnaný')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')], skromně předkládám tuto svatou ikonu, kterou jsem [Select_CString(local_artisan.IsFemale,'namalovala','namaloval')] podle tradice a dovedností, jež mi dal [ROOT.Char.GetFaith.HighGodNameAlternate]. Kéž vás vždy inspiruje na cestě zbožnosti a spravedlnosti.“"
