 ep3_decisions_event.4040.t: "Obilné dávky"
 ep3_decisions_event.4040.desc: "Lid má důvod slavit, neboť starodávná a milovaná tradice obilných dávek se vrací do [ROOT.Char.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')]!\n\nOpět, díky #EMP mým #! snahám je hlavní město světa [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] zásobováno stálým přísunem levného obilí z Egypta, jako tomu bylo před staletími.\n\nA jak pravil starý básník, vše, co potřebujeme, abychom udrželi lid šťastný, je chléb a hry!"
 ep3_decisions_event.4040.a: "Dejme jim chleba!"
 reconfirm_grain_dole_decision: "Znovu potvrdit obilné dávky"
 reconfirm_grain_dole_decision_desc: "Po formálním znovuzavedení si obyvatelé [ROOT.Char.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] zvykli na výsady, které poskytují obilné dávky — pravidelné rozdělování bezplatného nebo regulovaného chleba. Je to mocný nástroj v rukou každého císaře pro zajištění produktivity lidu a vlastní popularity."
