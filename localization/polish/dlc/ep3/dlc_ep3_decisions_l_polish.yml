 ep3_decisions_event.6002.t: "Populární vůdce"
 ep3_decisions_event.6002.desc: "„Pro [ROOT.Char.GetCulture.GetCollectiveNoun]! Pro [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]! Pro #EMP [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip], arghhh#!!“\n\nNa okamžik se nadechnu, hruď se mi chvěje emocemi, hlas mi stále třese. [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|U], [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip], [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]. Nesmím zapomenout, za koho bojuji.\n\n„[loser.GetTitledFirstName] [Select_CString(loser.IsFemale,'padla','padl')], [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]!“ oznámí chlapec pokrytý špínou. „Vyhráli jsme!“"
