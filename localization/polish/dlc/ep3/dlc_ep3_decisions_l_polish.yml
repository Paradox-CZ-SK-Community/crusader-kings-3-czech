 defensive_fire_dromons_3_years_tooltip: "Pokud dokončíte [GetScheme('prepare_fire_dromons_scheme').GetTypeName] [Concept('scheme','intriku')|E], [GetTitleByKey('c_byzantion').GetNameNoTier] získá [GetModifier('defensive_fire_dromons_modifier').GetNameWithTooltip] na #high 30 let#!"
 defensive_fire_dromons_success_tooltip: "Po úspěchu [GetTitleByKey('c_byzantion').GetNameNoTier] získá [GetModifier('defensive_fire_dromons_modifier').GetNameWithTooltip] na #high 30 let#!"
