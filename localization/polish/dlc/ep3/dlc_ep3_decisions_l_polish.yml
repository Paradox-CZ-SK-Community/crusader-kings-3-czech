 ep3_decisions_event.3201.t: "Hromadné zatýkání: Prosba"
 ep3_decisions_event.3201.desc: "Přivedou přede mě [imprisoned_house_head.Custom('CZ_Name_A')] v okovech. Kdysi vlivná hlava rodu [imprisoned_house_head.GetHouse.GetName] přede mnou klečí a ve tváři se [Select_CString(imprisoned_house_head.IsFemale,'jí','mu')] mísí vzdor se zoufalstvím.\n\n„Vaše Veličenstvo,“ začne hlasem zlomeným hanbou, „snažně vás prosím, zbavte mě těchto okovů. Ctižádost zaslepuje, ale teď už vím, kde je mé pravé místo.“\n\n„Prokažte mi milost a přísahám, že budu [Select_CString(imprisoned_house_head.IsFemale,'vaší nejvěrnější poddanou','vaším nejvěrnějším poddaným')], [Select_CString(imprisoned_house_head.IsFemale,'zbavenou','zbaveným')] své někdejší pýchy.“"
