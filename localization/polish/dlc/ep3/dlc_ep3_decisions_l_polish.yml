 ep3_decisions_event.3001.t: "Řecko – obnoveno"
 ep3_decisions_event.3001.desc: "Zatímco můj sněm a někteří vybraní strategoi podávají zprávy o říši, [Select_CString(interlocutor.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', interlocutor)] [interlocutor.GetFirstName] promluví.\n\n„[Select_CString(interlocutor.IsFemale,'Byla bych nedbalá, kdybych nepoznamenala','Byl bych nedbalý, kdybych nepoznamenal')], [Select_CString(ROOT.Char.IsFemale,'má','můj')] [interlocutor.Custom2('RelationToMeShort', ROOT.Char)], že úsilí impéria obnovit řecké země do jejich historického postavení jako bašt civilizace bylo úspěšné.“\n\n„Strategoi se neúnavně snažili rozvíjet své země a tak zvýšit slávu [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')]!“"
 ep3_decisions_event.3001.not_admin_desc: "Když nejvěrnější poddaní podávají zprávy o říši, [Select_CString(interlocutor.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', interlocutor)] [interlocutor.GetFirstName] se ujme slova.\n\n„Bylo by ode mě nedbalé nezmínit, [Select_CString(ROOT.Char.IsFemale,'má','můj')] [interlocutor.Custom2('RelationToMeShort', ROOT.Char)], že naše snaha pozvednout zapomenuté řecké země na úroveň odpovídající naší slávě přinesla ovoce.“\n\n„Naši nejzdatnější služebníci neúnavně pracovali na rozvoji těchto zemí a na tom, aby byly užitečné pro [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_A')]!“\n\nUsměji se. Daleko od slávy a břemen minulosti se píše nová kapitola."
 ep3_decisions_event.3001.a: "Nechť je sláva našeho království známa!"
