 go_fishing_decision_unlock_tt: "Tvůj tábor musí být v pobřežním nebo říčním [Concept('barony','baronství')|E]"
 ep3_decisions_event.9001.t: "Na rybách"
 ep3_decisions_event.9001.desc: "Když jdu dolů k hladině vody, cítím vůni soli a ryb v nose. Několik lidí právě končí, takže mám celý břeh jen pro sebe. Takový den nepřichází každý den a měl bych ho co nejvíc využít."
 ep3_decisions_event.9001.friend: "\n\n[Select_CString(potential_friend.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', potential_friend)] [potential_friend.GetName] se dnes rozhodl připojit. Nabízí se příležitost se sblížit, nebo si mohu zvolit rybařit o samotě."
 ep3_decisions_event.9001.fishing: "\n\nČeká mě den odpočinku!"
 ep3_decisions_event.9001.ice_fishing: "Rozlehlá zmrzlá vodní plocha na nás čeká; vše, co musím udělat, je najít dobré místo a udělat malou díru."
 ep3_decisions_event.9001.a: "Vody mě volají a jen mě."
 ep3_decisions_event.9001.a.tt: "#weak Strávím chvíli sám a budu přemýšlet.#!"
 ep3_decisions_event.9001.b: "Příležitost strávit čas s [potential_friend.GetNameNoTooltip]!"
 ep3_decisions_event.9001.b.tt: "#weak Chvíle o samotě s [potential_friend.GetNameNoTooltip] může prohloubit náš vztah.#!"
 ep3_decisions_event.9001.c: "Není poblíž loď, kterou bychom si mohli pronajmout?"
 ep3_decisions_event.9001.c.tt: "#weak Loď na vodě má větší šanci chytit pěknou velkou rybu než rybaření z břehu.#!"
 ep3_decisions_event.9010.t: "Okamžik k zamyšlení"
 ep3_decisions_event.9010.desc: "Hluboce se nadechnu a vydechnu, zatímco nahodím linku do vody. Háček dopadne s tichým 'plop' a svět utichne. \n\nPohled se mi toulá podél pobřeží, mám chvíli o samotě, abych [Select_CString(ROOT.Char.IsFemale,'zpracovala','zpracoval')] myšlenky. Život dobrodruha není tak špatný, ale žádný život není bez stresu. Zavřu oči na okamžik, abych si [Select_CString(ROOT.Char.IsFemale,'odpočinula','odpočinul')], když mě náhle prudce probudí něco, co mi vytrhne rybářský prut z rukou."
 ep3_decisions_event.9010.a: "Chyť pevně a zatáhni!"
 ep3_decisions_event.9010.b: "Nechej prut sklouznout mezi prsty."
 ep3_decisions_event.9010.b.trait: "Mír ovládne tvou mysl"
 ep3_decisions_event.9010.b.nothing: "Prut odplouvá od tebe"
 ep3_decisions_event.9020.t: "Rybařská pouta"
 ep3_decisions_event.9020.desc: "Já a [potential_friend.GetNameNoTooltip] si v poslední době očividně rozumíme. Smějeme se stejným vtipům, trápíme se stejnými starostmi a pouto mezi námi se zdá být víc než jen vztah [ROOT.Char.GetTitleAsNameNoTooltip|U] a jejich [ROOT.Char.Custom2('RelationToMeShort', potential_friend)].\n\nKaždý z nás nahodí prut do vody a trpělivě čekáme na zásek, přitom mluvíme a smějeme se. \n\nTenhle výlet ukázal, že spolu skvěle fungujeme, a [Select_CString(ROOT.Char.IsFemale,'ráda bych','rád bych')] s nimi v budoucnu [Select_CString(ROOT.Char.IsFemale,'strávila','strávil')] víc času."
 ep3_decisions_event.9020.a: "Bavíš se tak dobře, že skoro zapomeneš, proč tu vlastně jsi."
 ep3_decisions_event.9020.b: "Na to zapomeň, na háčku je ryba!"
 ep3_decisions_event.9030.t: "Ne bez potíží"
 ep3_decisions_event.9030.desc: "Po chvíli veslování mizí z dohledu pobřeží [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]. Teprve teď si uvědomím, že jsem [Select_CString(ROOT.Char.IsFemale,'vzala','vzal')] návnadu jen na jeden pokus."
 ep3_decisions_event.9030.friend: "\n\nPodívám se na [potential_friend.GetNameNoTooltip] a přiznám se, ale zdají se být nevyvedeni z míry.\n\n„A co!“ vykřiknou. „Jsme tu, abychom si odpočinuli. Hoď svůj prut, uvidíme, co tam je!“"
 ep3_decisions_event.9030.a: "Ať to stojí za to!"
 ep3_decisions_event.9030.a.fish: "#weak Chytíš [ROOT.Char.Custom('GetRegionalFish')]! #!"
 ep3_decisions_event.9030.a.fishfriend: "#weak [potential_friend.GetNameNoTooltip] chytne [ROOT.Char.Custom('GetRegionalFish')]! #!"
 ep3_decisions_event.9030.a.nofish: "#weak Nic nekousne... #!"
 ep3_decisions_event.9030.b: "Chci, abys to [Select_CString(potential_friend.IsFemale,'zkusila','zkusil')], [potential_friend.GetNameNoTooltip]."
 butcher_animals_decision_name: "#warning Zoufalá opatření — porážka zvířat#!"
 butcher_animals_decision_desc: "Jsme tak, tak hladoví... přitom nás stále provází připravené maso, které spotřebovává to, co zůstalo z našich zásob, věrně nás pronásleduje k vlastní záhubě. V tak zoufalých dobách musíme zvážit #EMP všechny#! alternativy."
