 commission_icon_decision: "Objednat ikonu"
 commission_icon_decision_desc: "Rozjímaní a uctívání krásného umění nás přibližuje k Bohu a posiluje naši víru. Proto bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] nabídnout svou záštitu místnímu malíři, aby vytvořil novou svatou ikonu!"
 commission_icon_decision_tooltip: "Objednat náboženskou ikonu [Concept('artifact','artefakt')|E] od místního malíře"
 commission_icon_decision_confirm: "Povolat malíře"
 THEOTOKOS_GLOSS: "„Matka Boží“, Marie. V ikonografii tento výraz označuje scénu, již byzantské umění velmi oblíbené: Marii kojící nebo obecně držící malého Ježíše v náruči."
 PANTOKRATOR_GLOSS: "„Kristus Vševládný“ nebo „Vládce všeho“. Velmi častý v byzantské ikonografii, jde o zobrazení Ježíše, který v jedné ruce drží Nový zákon a druhou žehná pozorovatelům."
 hire_eunuch_decision: "Hledat $chief_eunuch_court_position$"
 hire_eunuch_decision_desc: "[GetCourtPositionType('chief_eunuch_court_position').GetDescription|U]"
 hire_eunuch_decision_tooltip: "Tvoji služebníci navrhnou několik vhodných kandidátů na pozici [GetCourtPositionType('chief_eunuch_court_position').GetName()|l]"
 ep3_decisions_event.5010.t: "Hodný [GetCourtPositionType('chief_eunuch_court_position').GetNameNoTooltip|U]"
 ep3_decisions_event.5010.desc: "Moji služebníci hledali daleko a široko hodného $chief_eunuch_court_position$, který by se připojil k mému dvoru.\n\nDva kandidáti mě zvláště zaujali: [mediocre_eunuch.GetFirstName] je urputně odhodlán se prosadit, ale [good_eunuch.GetFirstName] se zdá být zručnější."
 ep3_decisions_event.5010.a: "[mediocre_eunuch.GetFirstNameNoTooltip] má ten správný přístup!"
 ep3_decisions_event.5010.a.aptitude: "[mediocre_eunuch.GetUINamePossessive] [Concept('aptitude','způsobilost')|E] je [mediocre_eunuch.GetCourtPositionAptitude( GetCourtPositionType( 'chief_eunuch_court_position' ) )]"
 ep3_decisions_event.5010.b: "[good_eunuch.GetFirstNameNoTooltip] ve mně vzbuzuje větší důvěru."
 ep3_decisions_event.5010.b.aptitude: "[good_eunuch.GetUINamePossessive] [Concept('aptitude','způsobilost')|E] je [good_eunuch.GetCourtPositionAptitude( GetCourtPositionType( 'chief_eunuch_court_position' ) )]"
 embrace_heresy_decision: "Přijmout herezi"
 embrace_heresy_decision_desc: "Navzdory existenci oficiální víry schválené [ROOT.Char.GetTopLiege.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_I')] se v naší zemi množí kacířská přesvědčení. Kdybych některé z nich veřejně [Select_CString(ROOT.Char.IsFemale,'přijala','přijal')] a [Select_CString(ROOT.Char.IsFemale,'postavila','postavil')] se v jeho čele, [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] bych směrovat surový potenciál nekontrolované víry ke zvýšení své moci a prosazení své politické agendy."
 embrace_heresy_decision_tooltip: "Přijmout herezi a stát se jejím vůdcem"
 heresy_in_empire_or_bordering_tt: "Alespoň v 1 hrabství v [Concept('realm','panství')|E] tvého [Concept('top_liege','nejvyššího lenního pána')|E] nebo v sousedním cizím hrabství musí být přítomna [Concept('faith','víra')|E], kterou vyznávají alespoň 3 [Concept('counties','hrabství')|E], patří ke stejnému [Concept('religion','náboženství')|E] jako [Concept('state_faith','státní víra')|E] panství tvého nejvyššího lenního pána, ale je považována za [Concept('faith_hostile','nepřátelskou')|E]"
 ep3_decisions_event.5020.t: "Přijetí hereze"
 ep3_decisions_event.5020.desc: "Příležitost je jasná a musím ji jen chopit.\n\nVíra [heresy_1.GetAdjective|U] roste [CZPrepV(ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTooltip)] [ROOT.Char.GetTopLiege.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_L')] a potřebuje silného, vlivného vůdce, který ji bude reprezentovat na politické scéně. Samozřejmě vystavit se označení za kacíře je riziko, ale nevyužitý potenciál shromáždit pronásledovanou menšinu pod společnou vlajku je pokušením."
 ep3_decisions_event.5020.desc_more: "\n\nNáboženská scéna [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] je natolik roztříštěná, že se nemusím držet ani svého prvního výběru."
 ep3_decisions_event.5020.a: "[heresy_1.GetNameNoTooltip|U] je cesta."
 ep3_decisions_event.5020.b: "Možná se [heresy_2.GetNameNoTooltip] zdá slibnější?"
 ep3_decisions_event.5020.c: "[heresy_3.GetNameNoTooltip|U] má největší potenciál."
 ep3_decisions_event.5020.d: "Možná jsem příliš unáhlený..."
 embrace_heresy_tt: "Přijmete zvolenou kacířskou [Concept('faith','víru')|E]"
 leverage_position_tt: "Získáš výhody v podobě [Concept('hooks','pák')|E] a [Concept('influence','vlivu')|E] úměrně počtu ostatních [Concept('vassals','vazalů')|E] a [Concept('counties','hrabství')|E] v [Concept('realm','panství')|E] tvého [Concept('top_liege','nejvyššího lenního pána')|E], kteří vyznávají stejnou kacířskou [Concept('faith','víru')|E] jako ty"
 unlocks_demand_state_faith_decision: "Odemkne [GetDecisionWithKey('push_heresy_as_state_faith').GetName] [Concept('decision','rozhodnutí')|E]"
 has_embraced_heresy_tt: "[Select_CString(GetPlayer.IsFemale,'Přijala','Přijal')] jsi [Concept('faith','víru')|E] prostřednictvím [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('embrace_heresy_decision').GetName] a stále ji vyznáváš"
 push_heresy_as_state_faith: "Prosadit změnu státní víry"
 push_heresy_as_state_faith_desc: "Populární podpora víry, kterou vedu, roste po celém [ROOT.Char.GetTopLiege.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_L')]. Nyní je čas, aby [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip] [Select_CString(ROOT.Char.GetTopLiege.IsFemale,'uznala','uznal')] naši moc a [Select_CString(ROOT.Char.GetTopLiege.IsFemale,'přiznala','přiznal')], že [ROOT.Char.GetFaith.GetName] je jedinou správnou volbou jako oficiální víra [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]!"
 push_heresy_as_state_faith_tooltip: "Pokus se přimět svého lenního pána, aby z tvé víry učinil novou [Concept('state_faith','státní víru')|E]"
 try_to_push_faith_with_emperor_tt: "Tvůj lenní pán tvou žádost posoudí. Čím silnější je tvé politické a náboženské postavení, tím spíš ji přijme. Šanci na úspěch zvýšíš, když zvýšíš svůj [Concept('influence','vliv')|E] a počet ostatních [Concept('vassals','vazalů')|E] a [Concept('counties','hrabství')|E] v [Concept('realm','panství')|E] svého [Concept('top_liege','nejvyššího lenního pána')|E], které vyznávají stejnou [Concept('faith','víru')|E]."
