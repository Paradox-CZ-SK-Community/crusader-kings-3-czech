 go_fishing_decision: "Jít na ryby"
 go_fishing_decision_desc: "Každý si občas zaslouží pauzu. Věnuj chvíli a naházej návnadu u břehu [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], a nech starosti světa odplout po proudu. Kdo ví, možná z toho i něco bude."
