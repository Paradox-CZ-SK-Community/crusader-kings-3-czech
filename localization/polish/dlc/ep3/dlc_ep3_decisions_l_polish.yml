 swan_knight_title: "$knight_errant_decision$"
 swan_knight_desc: "A pak spatřili sněhobílé zvíře, které táhlo po vodě malou perleťově lesklou loďku, a v ní seděl vznešený $knight_culture_player_no_tooltip_lowercase$, jenž se zdál udávat její směr."
 legend_chapter_opening_swan_knight: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'putovala','putoval')] krajinou se svými věrnými následovníky, [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'bojovala','bojoval')] s rváči a [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'zachraňovala','zachraňoval')] potřebné."
 legend_chapter_motivation_swan_knight: "Jednoho rána, při vstupu do mlžného lesa, [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'uslyšela','uslyšel')] výkřik o pomoc, volání, kterému [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'nemohla','nemohl')] odolat."
 legend_chapter_famous_deed_swan_knight: "K půvabné panně hrozil zlý rytíř, ale [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ho [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'porazila','porazil')] v souboji jeden na jednoho, z louže krve povstal bílý [ROOT.Legend.GetProperty( 'friendly_animal' ).GetFlagName]."
 legend_chapter_conclusion_swan_knight: "Jí [Select_CString(ROOT.Legend.GetProtagonist.IsFemale,'řekla','řekl')]: 'Neptej se na mé jméno, neboť není v mých silách ho prozradit'."
 ep3_decisions_event.5002.t: "Ostuda rodiny"
 ep3_decisions_event.5002.desc: "„[Select_CString(my_rival.IsFemale,'Nečekala','Nečekal')] bych, že takovou potupu sneseš tak pokorně.“ Přímo u našeho tábora se zastaví kůň. V jezdci poznávám [Select_CString(my_rival.IsFemale,'svou #EMP drahou#!','svého #EMP drahého#!')] [ROOT.Char.Custom2('CZ_RelationToMeShort_A', SCOPE.sC('my_rival'))|l], [my_rival.Custom('CZ_TitledFirstName_A')].\n\n„Co to do tebe vjelo? Hraješ si na $knight_culture_player_plural_no_tooltip_lowercase$, jako bys [Select_CString(ROOT.Char.IsFemale,'žila','žil')] v pohádce pro děti,“ sesedne a odplivne si.\n\n„Kdy už dostaneš rozum? Pořiď si nějakou půdu, než budeš dál hanobit dobré jméno naší rodiny.“"
 ep3_decisions_event.5002.a: "„Možná je čas se usadit...“"
 ep3_decisions_event.5002.b: "„Nemám čas na nečestné [my_rival.GetWomenMen].“"
