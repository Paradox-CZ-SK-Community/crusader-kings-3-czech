 humiliate_the_stooge_decision: "Ponížit $stooge_camp_officer$"
 humiliate_the_stooge_decision_desc: "Ať už hnilá vejce, shnilá zelenina nebo zraňující slova, lidé vždy touží po nějakém veřejném ponížení."
 humiliate_the_stooge_decision_confirm: "Ha, #EMP ha!#!"
 humiliate_the_stooge_decision_tooltip: "Vyměňte trochu [Concept('prestige','prestiže')|E] za pěkný, bez [Concept('stress','stresu')|E] život"
 humiliate_the_stooge_decision_rewards: "Veřejně ponížíš svého šaška ($stooge_camp_officer$):\n$EFFECT_LIST_BULLET$Zbavíš se trochu [stress_i] [Concept('stress','stresu')|E]\n$EFFECT_LIST_BULLET$Získáš trochu [dread_i] [Concept('dread','hrůzy')|E]\n$EFFECT_LIST_BULLET$Získáš [Concept('modifier','modifikátor')|E] [GetModifier( 'stooge_humiliated_modifier' ).GetNameWithTooltip] na #high 2#! roky"
 stooge_humiliated_modifier: "Ponížil poskoka"
 stooge_humiliated_modifier_desc: "Ah. Je fajn, když se špatné věci dějí špatným lidem."
 humiliate_the_stooge_decision_tt: "Ponížíte [stooge.GetShortUIName]"
 humiliate_the_stooge_decision_2_tt: "[stooge.GetShortUIName] se zdá být naštvaný..."
 humiliate_the_stooge_decision_3_tt: "[stooge.GetShortUIName] kvílí"
 humiliate_the_stooge_decision_4_tt: "[stooge.GetShortUIName] utíká v slzách"
