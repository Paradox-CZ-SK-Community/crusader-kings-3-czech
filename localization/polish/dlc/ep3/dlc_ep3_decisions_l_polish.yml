 ep3_laamp_decision_event.1201.t: "Poslední štěkot [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_G')]"
 ep3_laamp_decision_event.1201.desc.intro: "Zabít zvíře, které člověk nechoval na maso, je hrozná věc. A nejvíc ze všeho psa, toho nejvěrnějšího druha, jakého kdy kdo může poznat.\n\n"
 ep3_laamp_decision_event.1201.desc.eaten.kennels.have_dog: "Psi vyjí jako démoni, když je odnášejí na porážku; vnímají pach krve, smrt a hromady těla svých druhů. O [ROOT.Char.Custom('DogStoryName')] se postarám sám — dlužím [ROOT.Char.Custom('DogStoryHerHim')] aspoň to."
 ep3_laamp_decision_event.1201.desc.eaten.kennels.no_dog: "Psi vyjí jako démoni, když jsou vedeni na porážku; vycítí krev, smrt a naskládaná těla svých druhů. Některé z nich jsem [Select_CString(ROOT.Char.IsFemale,'znala','znal')] jménem, i když se alespoň nemohu počítat za [ROOT.Char.Custom('MistressMaster')] žádného z nich."
 ep3_laamp_decision_event.1201.desc.eaten.one.have_dog: "Když mám po ruce jen svého drahého [ROOT.Char.Custom('DogStoryName')], je pouze jeden krk k proříznutí. Přesto [ROOT.Char.Custom('DogStorySheHe')] jakoby tuší, že něco není v pořádku, něco #EMP divného#! na mně."
 ep3_laamp_decision_event.1201.desc.eaten.one.no_dog: "S pouhým jedním psem v táboře to není velká porážka, ale zvíře jakoby stejně chápalo, že se blíží jeho zkáza."
 ep3_laamp_decision_event.1201.desc.eaten.some.have_dog: "S tak malým počtem dostupných psů není pochyb, že i můj vlastní [ROOT.Char.Custom('DogStoryName')] musí jít do porážky. První je poražen čistě, ale zbylí brzy vycítí zabití a začnou vytí a kňučet."
 ep3_laamp_decision_event.1201.desc.eaten.some.no_dog: "S tak malým počtem dostupných psů musíme být skutečně zoufalí po jídle. První je poražen čistě, ale ostatní brzy vycítí zabití a začnou vytí a kňučet."
 ep3_laamp_decision_event.1201.desc.eaten.many.have_dog: "Máme to štěstí, že máme k dispozici spoustu psů, včetně mého vlastního [ROOT.Char.Custom('DogStoryName')], přesto vypadají rozrušeně — jako by tušili, co je čeká. Poté, co je první odveden na smrt, začnou vyjí."
 ep3_laamp_decision_event.1201.desc.eaten.many.no_dog: "Máme to štěstí, že máme k dispozici spoustu psů, spoustu potenciálního jídla, které nás udrží, přesto vypadají rozrušeně — jako by tušili, co je čeká. Poté, co je první odveden na smrt, začnou vyjí."
 ep3_laamp_decision_event.1201.desc.outro: "\n\nMnozí z mých stoupenců se na mne dívají s odporem, ale jiní zdá se chápou, že to je nutnost.\n\nAspoň brzy bude ticho."
 ep3_laamp_decision_event.1201.tt.dog_lost: "Pes [THIS.Char.Custom('CZ_ShortUIName_G')], [THIS.Char.Custom('DogStoryName')], je poražen"
 ep3_laamp_decision_event.1201.tt.your_dog_lost: "Tvůj pes, [THIS.Char.Custom('DogStoryName')], je poražen"
 ep3_laamp_decision_event.1201.tt.followers_with_dogs: "Každý [Concept('follower','družiník')|E] s psem"
 ep3_laamp_decision_event.1201.a.own_dog: "Sbohem, hodní psi."
 ep3_laamp_decision_event.1201.a: "Vytí, to žalostné #EMP vytí#!..."
 ep3_laamp_decision_event.1201.b.own_dog: "Mohu si pořídit dalšího."
 ep3_laamp_decision_event.1201.b: "Maso je maso."
 ep3_laamp_decision_event.1202.t: "Tábor bez koček"
 ep3_laamp_decision_event.1202.desc.intro: "Není těžké zabít kočku, a rozhodně to není žádný sport.\n\n"
 ep3_laamp_decision_event.1202.desc.eaten.one.have_cat: "[Select_CString(ROOT.Char.IsFemale,'Nechtěla','Nechtěl')] jsem, aby to s [ROOT.Char.Custom('CatStoryName')] skončilo takhle, vážně, ale potřebujeme každý kousek a drobek jídla, který dokážeme sehnat.\n\nI když je to můj věrný, důvěřivý malý [ROOT.Char.Custom('CatStoryGirlBoy')]."
 ep3_laamp_decision_event.1202.desc.eaten.one.no_cat: "Zvlášť když je v celém táboře jen jedno kočkovité zvíře k nalezení, ale my #EMP potřebujeme#! jídlo, #EMP jakékoli#! jídlo."
 ep3_laamp_decision_event.1202.desc.eaten.some.have_cat: "Ani jich není tolik, abychom je chytli, a jakmile je shromáždíme, jsou ty chudinky z velké části bezbranné. V zajetí nemohou dělat nic jiného než syčet ze zlosti nebo zmateně příst."
 ep3_laamp_decision_event.1202.desc.eaten.some.no_cat: "$ep3_laamp_decision_event.1202.desc.eaten.some.have_cat$\n\nDokonce i [ROOT.Char.Custom('CatStoryName')]."
 ep3_laamp_decision_event.1202.desc.eaten.many.have_cat: "Člověk by si myslel, že nám většina z nich uteče, ale kdepak – i když by měl zvítězit pud sebezáchovy, většina koček z [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] svým pánům důvěřuje.\n\nDokonce i [ROOT.Char.Custom('CatStoryName')]."
 ep3_laamp_decision_event.1202.desc.eaten.many.no_cat: "Člověk by si myslel, že nám většina z nich uteče, ale kdepak – i když by měl zvítězit pud sebezáchovy, většina koček z [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] svým pánům důvěřuje.\n\nPošetilá chyba."
 ep3_laamp_decision_event.1202.desc.outro: "\n\nJakmile jsou zahnáni a umístěni do klecí, jsou snadno usmrceni, i když žádný z mých stoupenců se nezdá být zvlášť pyšný — ani na mě — za tento čin."
 ep3_laamp_decision_event.1202.tt.cat_lost: "Kočka [THIS.Char.Custom('CZ_ShortUIName_G')], [THIS.Char.Custom('CatStoryName')], je poražena"
 ep3_laamp_decision_event.1202.tt.your_cat_lost: "Tvá kočka, [THIS.Char.Custom('CatStoryName')], je poražena"
 ep3_laamp_decision_event.1201.tt.followers_with_cats: "Každý [Concept('follower','družiník')|E] s kočkou"
 ep3_laamp_decision_event.1202.a.own_cat: "Naše vznešené společenství je u konce, [ROOT.Char.Custom('CatStoryName')]."
 ep3_laamp_decision_event.1202.a: "Nemáme jinou volbu."
 ep3_laamp_decision_event.1202.b.own_cat: "Eh, to je jen kočka."
 ep3_laamp_decision_event.1202.b: "Jo, jo, rychle rychle. Heh."
 ep3_laamp_decision_event.1203.t: "Koňské maso pro hladové"
 ep3_laamp_decision_event.1203.desc.intro: "Koňské maso je libové a hojné, není cizí mnoha dietám — #EMP pokud#! si můžete dovolit jeho konzumaci.\n\nVzhledem k zoufalé situaci, v níž se nacházíme, si [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] sotva může dovolit, aby stádo nebylo prořezáno,"
 ep3_laamp_decision_event.1203.desc.eaten.both: "porážejíc nejen naše náhradní hřebce, ale i mého vlastního [ROOT.Char.Custom('WarhorseStoryName')]."
 ep3_laamp_decision_event.1203.desc.eaten.own_horse: "i kdyby jediným koněm, kterého můžeme obětovat, byl můj vlastní [ROOT.Char.Custom('WarhorseStoryName')]."
 ep3_laamp_decision_event.1203.desc.eaten.reserve_steeds: "masově porážejíc naše náhradní koně navzdory jejich zmatení a panice."
 ep3_laamp_decision_event.1203.desc.outro: "\n\nTento dar přichází na úkor části naší rychlosti, ale měl by nám koupit čas najít spolehlivější zdroj obživy.\n\nAspoň doufám."
 ep3_laamp_decision_event.1203.a.many_steeds: "I v smrti nás ponesou vpřed."
 ep3_laamp_decision_event.1203.a.single_steed: "I v smrti mě [ROOT.Char.Custom('HorseStorySheHe')] nese vpřed."
 ep3_laamp_decision_event.1203.b: "Upřímně, měli bychom je jíst #EMP častěji#!, tohle je vynikající."
 ep3_laamp_decision_event.1204.t: "Hřbitov slonů"
 ep3_laamp_decision_event.1204.desc: "Po prvních několika se stádo zdá pochopit, že něco není v pořádku.\n\nTeprve značným zaháněním se nám podaří je ovládnout a skutečně začít s porážkou — přirozeně se zaměřujeme na staré, nemocné, slabé a mladé.\n\nJeden po druhém dáváme naši rezervu slonů nejdřív pod meč, pak pod řeznický nůž.\n\nHrůzná, krvavá práce, ztížená jejich panickým, chraplavým řevem a troubeným terorem.\n\nAle je to buď oni, nebo my."
 ep3_laamp_decision_event.1204.a: "Jejich smrt je naše spása."
 ep3_laamp_decision_event.1204.b: "U [ROOT.Char.GetFaith.HealthGodName], to jsou ale #EMP steaky#!."
 ep3_laamp_decision_event.1205.t: "$ep3_laamp_decision_event.1204.t$: Důsledky"
 ep3_laamp_decision_event.1205.desc: "Uplynul rok od zoufalství naší cesty, které nás #EMP přinutilo#! sáhnout k... drastickým opatřením.\n\nI když mohou být moudrá stvoření, na slonu je mnoho masa, a když šlo o jejich životy proti těm našim, volba byla nakonec jednoduchá.\n\n[Select_CString(ROOT.Char.IsFemale,'Vzala','Vzal')] jsem řeznický nůž a sekeru na naše stádo, krájejíc staré i mladé s pochmurnou odhodlaností, [Select_CString(ROOT.Char.IsFemale,'věděla','věděl')] jsem, že jejich oběť je nutná.\n\nPřesto se zdá, že zbytek našich slonů — ti, které používají naši bojovníci — si tu masakru #EMP pamatují#!. Ta zvířata jsou problémová, odmítají naše rozkazy a dělat cokoli, co nesouvisí s vlastní záchranou nebo žraním.\n\nDokonce jsou ke mně #EMP frustrujícím způsobem#! nepřátelští, zdá se, že mě viní jako vůdce lidského stáda."
 ep3_laamp_decision_event.1205.a: "Sakra na tyhle vzpurné bestie!"
 ep3_laamp_decision_event.1205.a.tt: "Už nikdy nebudete schopni efektivně využívat slony"
 ep3_laamp_decision_event_1205_modifier: "Sloni nikdy nezapomínají"
 ep3_laamp_decision_event_1205_modifier_desc: "A ani neodpouštějí."
 ascendant_byz_reclaimant_ortho_modifier: "Vzestupný byzantský znovudobyvatel"
