 prepare_greek_fire_dromons_decision: "Připravit dromóny s řeckým ohněm"
 prepare_greek_fire_dromons_decision_desc: "Zapálení Bosporu zachránilo [GetTitleByKey('b_constantinople').GetNameNoTier] před zkázou již dříve a může to učinit znovu. Tento chráněný vodní prostor je jedním z mála míst, kde lze spolehlivě použít tekutý oheň, naši tajnou látku.\n\nNechť se vyrobí masivní ohnivé sifony a ozbrojí se posádková flotila."
 prepare_greek_fire_dromons_decision_tooltip: "Umožní [GetTitleByKey('b_constantinople').GetNameNoTier] ničit blízké [Concept('embarked','nalodené')|E] [Concept('armies','armády')|E] tou nejnepředvídatelnější a žárlivě střeženou zbraní."
