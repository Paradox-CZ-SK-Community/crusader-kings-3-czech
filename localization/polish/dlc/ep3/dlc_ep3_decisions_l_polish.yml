 reinstitute_grain_dole_decision: "Obnovit obilné dávky"
 reinstitute_grain_dole_decision_desc: "Po staletí občané Říma, a později Konstantinopole, užívali největší výhody života v hlavním městě světa: pravidelné rozdělování bezplatného nebo regulovaného cenami chleba. Tradice se ztratila spolu se sýpkou Říma — Egyptem — ale jakýkoli císař, který by ji znovu zavedl, by okamžitě zvýšil svou popularitu mezi lidmi."
