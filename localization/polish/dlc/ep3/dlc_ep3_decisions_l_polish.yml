 renounce_governorship_family_title_tt: "Nemáš žádný [Concept('estate','statek')|E], kam by ses [Select_CString(ROOT.Char.IsFemale,'uchýlila','uchýlil')]."
 ep3_renounced_governorship: "Ve stínech"
 ep3_renounced_governorship_desc: "Tato postava se rozhodla vzdát se guvernátorství a počkat na správný okamžik, kdy udeřit."
 ep3_renounced_governorship_merit: "Zpět do školy"
 ep3_renounced_governorship_merit_desc: "Tato postava se rozhodla vzdát svého úřadu a připravovat se na další [Concept('examination','zkoušku')|E]."
 renounced_governorship_japan: "Dvorská přítomnost"
 renounced_governorship_japan_desc: "Tato postava strávila nějaký čas jako správce na venkově a vrátila se do centra císařské politiky."
 ep3_renounced_estate: "Poklidná zima"
 ep3_renounced_estate_desc: "Tato postava se stáhla ze všech povinností, aby dožila zbytek svého života mimo veřejné dění."
 ep3_decisions_event.4090.t: "Krok zpět"
 ep3_decisions_event.4090.desc: "Za zdmi statku křičí děti při hrách, vozíky naráží na větší kameny, obchodník křičí své zboží.\n\n[Select_CString(ROOT.Char.IsFemale,'Sloužila','Sloužil')] jsem [liege.Custom('CZ_TitledFirstName_D')] dostatečně dlouho.\n\nTyto zdi si samy nepostaví — a dům potřebuje pevné základy nade vše."
 ep3_decisions_event.4090.a: "Budu čekat."
 ep3_decisions_event.4090.a_merit: "Budu studovat."
 change_imperial_aspirations_decision: "Změnit [GetPlayer.GetTopLiege.Custom('CZ_GetRoyalCourtRank_ee')] aspirace"
 change_imperial_aspirations_decision_desc: "Ne každý je vhodný, nebo dokonce chce, vyšplhat tak vysoko, aby seděl na trůnu. Proč riskovat, když jsem zcela [Select_CString(ROOT.Char.IsFemale,'spokojená','spokojený')] se svou současnou pozicí? Jiní mohou bojovat v tomto doupěti zmijí!"
 change_imperial_aspirations_decision_tooltip: "Zaujměte stanovisko, aby bylo známo, zda toužíte po trůnu nebo ne"
 change_imperial_aspirations_decision_confirm: "Ať jsou mé úmysly známy"
