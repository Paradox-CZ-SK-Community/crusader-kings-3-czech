 admin_confirmation_decision_desc: "Je obvyklé, že [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip] formálně potvrzuje jmenování guvernérů při ceremonii konané před [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] dvorem."
 admin_confirmation_decision_tooltip: "Zúčastněte se ceremonie [Concept('admin_confirmation','$admin_confirmation_decision|q$')|E] pořádané vaším [Concept('liege','lenním pánem')|E]"
 admin_confirmation_decision_effects: "Vydáš se na dvůr [THIS.Char.GetLiege.Custom('CZ_TitledFirstName_G')], aby ti [Select_CString(THIS.Char.GetLiege.IsFemale,'potvrdila','potvrdil')] [Concept('governorship','guvernérství')|E]"
 admin_confirmation_decision_confirm: "Vyrazit na ceremonii"
