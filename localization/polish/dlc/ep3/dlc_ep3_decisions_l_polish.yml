l_polish:
 estate_hire_agents_decisions: "Najmout agenty"
 estate_hire_agents_decisions_desc: "Když politické postavení a vliv nestačí k získání toho, co chci, musím prostě hledat #EMP jiné#! alternativy. Potřebuji však agenty, kteří to zvládnou efektivněji."
 estate_hire_agents_decisions_confirm: "Přiveďte mi tyto agenty!"
 estate_hire_agents_decisions_tooltip: "Vyhledat a naverbovat možné agenty, kteří lépe poslouží tvým [Concept('schemes','intrikám')|E]"
 estate_governor_patrols_decision: "Provádět hlídky v guvernorátu"
 estate_governor_patrols_decision_desc: "Abych [Select_CString(ROOT.Char.IsFemale,'udržela','udržel')] obyvatelstvo v mém guvernorátu v bezpečí, mohu zřídit pravidelné hlídky, které odrazí případné bandity. To může být také užitečné v bitvách, protože budeme mít vždy připravené jednotky, pokud by k tomu došlo."
 estate_governor_patrols_decision_confirm: "Zahajte hlídky hned!"
 estate_governor_patrols_decision_tooltip: "Zavést hlídky ve vašem [Concept('governorship','guvernérství')|E]"
 estate_bolster_security_decision: "Posílit bezpečnost panství"
 estate_bolster_security_decision_desc: "Nezblázním se snad do paranoie, že? Zdá se, že na mě všichni míří. Asi mi dají nůž do zad, nebo mi pošpiní reputaci. Zvýšení mého ochranného personálu mi jistě uklidní mysl. #EMP Správně?#!"
 estate_bolster_security_decision_confirm: "Najměme více stráží."
 estate_bolster_security_decision_tooltip: "Zlepšete svou osobní bezpečnost proti [Concept('schemes','intrikám')|E]"
 estate_granary_decision: "Ovlivnit trh se zrním"
 estate_granary_decision_desc: "Mé osobní sýpky obsahují značné množství obilí. V dobách nouze mohu pomalu prodávat obilí, po jednom pytli, za výrazně vyšší ceny. [Select_CString(ROOT.Char.IsFemale,'Musela','Musel')] bych zatáhnout za pár nití, abych [Select_CString(ROOT.Char.IsFemale,'manipulovala','manipuloval')] trhem ve svůj prospěch, ale hodně z toho vytěžím."
 estate_granary_decision_confirm: "Začněte prodávat obilí. #EMP Pomalu#!"
 estate_granary_decision_tooltip: "Prodejem obilí uloženého ve tvých sýpkách na dohlednou dobu zvýšíš svůj měsíční [Concept('income','příjem')|E] [Concept('gold_i','@gold_icon!')|E][Concept('gold','zlata')|E]"
 estate_unlock_granary_decision_factors_tt: "\nFaktory, které zvyšují účinek:"
 estate_unlock_granary_decision_no_factors_tt: "#weak Žádné další faktory#!"
 estate_unlock_granary_decision_grain_building_tt: "#weak Ve vašem [Concept('estate','statku')|E] je [GetDomicileBuilding('grain_field_01').GetName] [Concept('domicile_building','budova domicilu')|E] — zvyšuje se s každou úrovní#!"
 estate_unlock_granary_decision_rice_building_tt: "#weak Tvůj [Concept('estate','statek')|E] má [Concept('domicile_building','budovu sídla')|E] [GetDomicileBuilding('east_asian_estate_rice_field_01').GetName] – roste s každou úrovní#!"
 estate_unlock_granary_decision_capital_tt: "#weak Tvůj [Concept('estate','statek')|E] leží v [Concept('capital','hlavním sídle')|E]#!"
 estate_unlock_granary_decision_terrain_tt: "#weak Tvůj [Concept('estate','statek')|E] leží v [Concept('terrain','terénu')|E] typu [domicile_owner.GetDomicile.GetLocation.GetTerrain.GetName]#!"
 estate_unlock_granary_decision_control_tt: "#weak [domicile_owner.GetDomicile.GetLocation.GetCounty.GetName] trpí sníženou úrovní [Concept('county_control','kontroly hrabství')|E]#!"
 estate_unlock_granary_decision_development_1_tt: "#weak [domicile_owner.GetDomicile.GetLocation.GetCounty.GetName] má alespoň [EmptyScope.ScriptValue('estate_granary_development_bonus_1_value')|V0] [Concept('development','rozvoje')|E]#!"
 estate_unlock_granary_decision_development_2_tt: "#weak [domicile_owner.GetDomicile.GetLocation.GetCounty.GetName] má alespoň [EmptyScope.ScriptValue('estate_granary_development_bonus_2_value')|V0] [Concept('development','rozvoje')|E]#!"
 estate_unlock_granary_decision_epidemic_tt: "#weak [CZPrepV(domicile_owner.GetDomicile.GetLocation.GetNameNoTooltip)|U] [CZProvName(domicile_owner.GetDomicile.GetLocation,'L')] řádí [Concept('epidemic','epidemie')|E], a tak místní za tvé obilí zaplatí ještě víc#!"
 hold_triumph_decision: "Uspořádat triumf"
 hold_triumph_decision_desc: "Triumfy patří mezi nejstarší a nejuctívanější římské tradice. V dávných dobách vítězný generál přicházel do Říma za jásajícím davem a největšími poctami — na jeden den byl téměř roven bohu. Dnes budou lidé slavit mé největší úspěchy a prosperitu, kterou jsem jim [Select_CString(ROOT.Char.IsFemale,'přinesla','přinesl')]!$ep3_triumph_influence_cost_desc$"
 hold_triumph_decision_tooltip: "Uspořádej velkolepý průvod na oslavu svých úspěchů a pro posílení své pověsti"
 hold_triumph_decision_confirm: "Připravte mého koně!"
 ep3_triumph_influence_cost_desc: "\n\n@alert_icon! #alert_trial Pokud jsi za posledních 5 let [Select_CString(GetPlayer.IsFemale,'nevyhrála','nevyhrál')] žádnou [Concept('war','válku')|E], uspořádání triumfu stojí víc!#!"
 hold_triumph_decision_effects: "Během triumfu dostaneš několik příležitostí zanechat v poddaných trvalý dojem a získat [Concept('legitimacy','legitimitu')|E], [Concept('influence','vliv')|E], [Concept('prestige','prestiž')|E], [Concept('piety','zbožnost')|E] a další."
 ep3_decisions_event_triumph: "Triumf:"
 ep3_decisions_event.0001.t: "$ep3_decisions_event_triumph$ Impozantní procesí"
 ep3_decisions_event.0001.intro: "Sedím vysoko na svém koni, zářivý ve svém nejkrálovštějším oděvu, vedu majestátní průvod dvěma křídly jásajícího davu."
 ep3_decisions_event.0001.desc_const: "\n\nJako moji nejváženější předchůdci přede mnou vstupuji do posvátného města [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] od [Glossary( 'Golden Gate', 'GOLDEN_GATE_GLOSS' )], procházím centrem města mezi starobylými sochami a památníky dávných sláv a zastavuji se u [Glossary( 'Milion', 'MILION_GLOSS' )], kde začínají všechna měření v říši."
 GOLDEN_GATE_GLOSS: "Ta #bold Zlatá brána#! je součástí Teodosiovských hradeb obkružujících Konstantinopol a značí začátek hlavní ulice hlavního města, Mese."
 MILION_GLOSS: "Ten #bold milion#! označuje střed [GetTitleByKey('e_byzantium').GetBaseName] a je výchozím bodem, od kterého se měří všechny vzdálenosti k městům říše."
 ep3_decisions_event.0001.desc_other: "\n\nPo vstupu do [t_location.Custom('CZ_LandedNameNoTier_G')] hlavní bránou pokračujeme hlavní ulicí přímo do tepajícího srdce města."
 ep3_decisions_event.0001.desc: "Moji vojáci mě hrdě následují, sdílejí slávu vítězství nad [triumph_enemy_defeated.Custom('CZ_TitledFirstName_I')], zatímco občané bučí na zajatce a obdivují válečnou kořist."
 ep3_decisions_event.0001.desc_no_war: "Vojáci, služebnictvo nesoucí bohatství, a vysoké úřední osoby v oficiálních róbách mě hrdě následují, stojící jako živoucí důkaz moci a majestátu mé vlády."
 ep3_decisions_event.0001.desc_end: "\n\nAle kde by měl triumfální průvod skončit?"
 ep3_decisions_event.0001.a: "Hippodrom je nejlepší místo."
 ep3_decisions_event.0001.b: "K [ROOT.Char.Custom('TriumphReligiousLocation')]!"
 ep3_decisions_event.0001.a.flavor: "Chci na své poddané opravdu zapůsobit!"
 ep3_decisions_event.0001.a.tt: "Triumf bude pokračovat směrem k Hippodromu"
 ep3_decisions_event.0001.b.flavor: "Náboženství je základem mé moci."
 ep3_decisions_event.0001.b.tt: "Triumf bude pokračovat směrem k Hagii Sofii"
 ep3_decisions_event.0002.t: "$ep3_decisions_event_triumph$ Na Hippodromu"
 ep3_decisions_event.0002.desc_enemy: "Když triumfálně vjíždím na Hippodrom, přirozené místo, kde ustavená moc promlouvá k prostému lidu, chci sdělit jedinou věc: #EMP vítězství#!."
 ep3_decisions_event.0002.desc_no_war: "Hippodrom je jediné místo, kde lidé obvykle mohou mě spatřit, takže je důležité, aby viděli přesně to, co potřebuji: moc, bohatství a kontrolu."
 ep3_decisions_event.0002.desc_prisoner: "\n\nNekonečný průvod zajatců, svázaných a oděných do hadrů, jde za námi. Většina z nich jsou prostí vojáci, ale v čele řady stojí [valid_prisoner.GetTitledFirstName], jedoucí na oslu k pobavení davu."
 ep3_decisions_event.0002.desc_no_prisoner: "\n\nVe skutečnosti jsou za námi parádně předváděny bohatství, artefakty, válečná kořist a symboly království — více než dost na to, aby dav nadšeně zatleskal."
 ep3_decisions_event.0002.desc_artifact: "Mezi válečnou kořistí je středobodem artefakt „[sacked_artifact.GetName]“, vypleněný během obléhání."
 ep3_decisions_event.0002.desc_hostage: "V císařské lóži spatřím [enemy_hostage.Custom2('MyCharacterIntroduction', ROOT.Char)] s nepřátelským výrazem."
 ep3_decisions_event.0002.desc_conclusion: "\n\nMasy očekávají a vzduch hřmí vzrušením a kakofonií výkřiků. Dám lidem to, po čem touží."
 ep3_decisions_event.0002.a: "Veřejné potrestání zajatců!"
 ep3_decisions_event.0002.a.tt: "Udělám představení z toho, jak se s nimi rozhodnu vypořádat!"
 ep3_decisions_event.0002.b: "Rozdělení válečné kořisti lidem."
 ep3_decisions_event.0002.b.tt: "Každý rád cítí, že je součástí vítězství!"
 ep3_decisions_event.0002.c: "Jídlo a zlato budou rozdány obdivujícímu davu!"
 ep3_decisions_event.0002.c.tt: "Všichni přece milují věci zadarmo, že?"
 ep3_decisions_event.0002.d: "Ale samozřejmě můj projev!"
 ep3_decisions_event.0002.d.tt: "Musím pečlivě zvolit, jak se prezentovat před svými poddanými."
 ep3_decisions_event.0002.d.custom_tooltip: "Vyberete téma svého projevu"
 ep3_decisions_event.0002.e: "Spalte artefakt „[sacked_artifact.GetNameNoTooltip]“ a rozdělte kořist."
 ep3_decisions_event.0002.e.tt: "Každý by se měl cítit součástí vítězství a naprostého ponížení nepřítele!"
 ep3_decisions_event.0003.t: "$ep3_decisions_event_triumph$ V [ROOT.Char.Custom('TriumphReligiousLocationCapitalized')]"
 ep3_decisions_event.0003.desc: "„Lidé jsou křehké bytosti, a i ta největší vítězství blednou před velikostí, jakou má [ROOT.Char.GetFaith.HighGodName],“ pomyslím si zamyšleně, když vkročím dveřmi. Okamžitě mě zasáhne majestát a velkolepost budovy.\n\nLidé jistě ocení skromný a oddaný gest z mé strany jako doplněk k mému oslňujícímu vítězství nad [triumph_enemy_defeated.Custom('CZ_TitledFirstName_I')]."
 ep3_decisions_event.0003.desc_no_war: "Pýcha je nejhorší nepřítel mocných a velkých.\n\nAle ještě horší je #EMP působit na své poddané dojmem pýchy#! Koneckonců [ROOT.Char.GetTitleAsNameNoTooltip|U] je jen zástupcem, jejž na zemi má [ROOT.Char.GetFaith.HighGodName]. Moc, bohatství a majestát jsou jen odrazem slávy Božského dvora, proto je důležité dát najevo úctu k hierarchii."
 ep3_decisions_event.0003.desc_hostage: "To je také důvod, proč jsem účelně [Select_CString(ROOT.Char.IsFemale,'požádala','požádal')] [enemy_hostage.Custom2('MyCharacterIntroduction', ROOT.Char)], aby se ke mně zde [Select_CString(enemy_hostage.IsFemale,'připojila','připojil')]."
 ep3_decisions_event.0003.a: "Přijímám požehnání, jež dává [ROOT.Char.GetFaith.HighGodNameAlternate]."
 ep3_decisions_event.0003.b: "Mé vítězství posvětí [ROOT.Char.GetFaith.HighGodName]."
 ep3_decisions_event.0003.c: "Pokoj tobě i tvému lidu, [enemy_hostage.GetFirstNameNoTooltip]."
 ep3_decisions_event.0003.d: "Kořist věnuji chrámům, kde se uctívá [ROOT.Char.GetFaith.HighGodNameAlternate]."
 ep3_decisions_event.0003.c.tt: "Nábožensky podložený akt míru jistě přispěje ke zmírnění napětí s lidmi [triumph_enemy_defeated.GetTitledFirstNamePossessiveNoTooltip]."
 ep3_decisions_event.0003.d.tt_artifact: "Věnuji artefakt „[sacked_artifact.GetName]“ na oltář."
 ep3_decisions_event.0004.t: "$ep3_decisions_event_triumph$ Průvod zajatců"
 ep3_decisions_event.0004.desc: "Na Hippodrom vchází řada za řadou zajatců. Špinaví, vyhublí, s oholenými hlavami – skoro by je člověk litoval, kdyby to nebyli nenávidění nepřátelé, které jsme nedávno ponížili na bojišti.\n\n[valid_prisoner.GetTitledFirstName|U] je teď vede v potupě, stejně jako je [Select_CString(valid_prisoner.IsFemale,'vedla','vedl')] ve válce. Jenže v hadrech a obráceně na oslu nevypadá ani zdaleka tak hrozivě."
 ep3_decisions_event.0004.desc_hostage: "Výraz na tváři [enemy_hostage.Custom2('MyCharacterIntroduction', ROOT.Char)] se ještě více zatmívá."
 ep3_decisions_event.0004.a: "Budou oslepeni."
 ep3_decisions_event.0004.b: "Popravit je na veřejnosti."
 ep3_decisions_event.0004.c: "Císařské milosrdenství se jich smiluje: propusťte je na svobodu."
 ep3_decisions_event.0005.t: "$ep3_decisions_event_triumph$ Císařský projev"
 ep3_decisions_event.0005.desc_victory: "Když vystoupím do císařské lóže Hippodromu, přemýšlím o nejlepším způsobu, jak využít vítězství nad [triumph_enemy_defeated.Custom('CZ_TitledFirstName_I')]."
 ep3_decisions_event.0005.desc_no_war: "Davy jsou náladové a neuniká mi, že nemám žádné velké vítězství, které by omluvilo můj triumf nebo poskytlo důvěryhodnost, na které bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] postavit svůj projev. Přesto je potřebuji nějak ohromit, protože stabilita mé vlády závisí do značné míry na podpoře lidu."
 ep3_decisions_event.0005.desc_prisoner: "\n\nMožná bych měl upozornit na bohatou válečnou kořist a obnovené zabezpečení našich hranic, i když mnozí zajatci chycení během války, jako [valid_prisoner.GetTitledFirstName], parádující před davem, mluví sami za sebe. Možná bych se měl raději zaměřit na vnitřní politiku?"
 ep3_decisions_event.0005.desc_politics: "\n\nVálky jsou přeceňované, takže bych jejich pozornost [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] odvést někam jinam, například na vnitřní stabilitu nebo prosperitu."
 ep3_decisions_event.0005.desc_hostage: "Z koutku oka zahlédnu [enemy_hostage.Custom2('MyCharacterIntroduction', ROOT.Char)] sedícího nehybně a s kamenným výrazem."
 ep3_decisions_event.0005.a: "S vedením [ROOT.Char.GetFaith.WarGodName] přijdou mnohá vítězství!"
 ep3_decisions_event.0005.tt: "Lid tvého hlavního města si to zapamatuje a podle toho tě bude soudit!"
 ep3_decisions_event.0005.b: "Ať [ROOT.Char.GetFaith.HealthGodName] vždy vede říši k bezpečí!"
 ep3_decisions_event.0005.c: "Říše bude prosperovat, neboť ji chrání [ROOT.Char.GetFaith.HighGodName]!"
 ep3_decisions_event.0005.a.success: "Věří vašemu slibu a budou od vás očekávat vojenská vítězství"
 ep3_decisions_event.0005.a.failure: "Nejsou přesvědčeni vašimi medovými slovy"
 ep3_decisions_event.0005.b.success: "Věří vašemu slibu a budou očekávat vnitřní mír"
 ep3_decisions_event.0005.c.success: "Věří vašemu slibu a budou očekávat, že říše bude prosperovat"
 ep3_decisions_event.a.tt: "V hlavním městě propukne neklid, pokud nepřijde žádné vítězství"
 ep3_decisions_event.a.tt_no: "Stále je můžete ohromit vítězstvím ve válce"
 ep3_decisions_event.b.tt: "V hlavním městě propukne neklid, pokud vypuknou povstání"
 ep3_decisions_event.b.tt_no: "Stále je můžete ohromit tím, že nebudete čelit žádnému povstání"
 ep3_decisions_event.c.tt: "V hlavním městě propukne neklid, pokud se říši nebude dařit"
 ep3_decisions_event.c.tt_no: "Stále je můžete ohromit tím, že se říši bude dařit"
 ep3_decisions_event.success: "Dav vám věří"
 ep3_decisions_event.failure: "Dav není přesvědčen"
 cultural_acceptance_triumph_offensive: "Ofenzivní triumf"
 cultural_acceptance_triumph_peace: "Přísahnutá olivová ratolest"
 fervor_gain_triumph_of_god: "Náboženský triumf"
 ep3_decisions_event.0006.t: "$ep3_decisions_event_triumph$ Dodržení slibu"
 ep3_decisions_event.0006.desc: "Můj poslední triumf se konal před lety a sliby, které jsem tehdy [Select_CString(ROOT.Char.IsFemale,'pronesla','pronesl')], už dnes nejsou v popředí mé paměti. Obyvatelé [CZProvName(t_location,'G')] si to však nezapomněli, jak mi připomíná [talker.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n„Lidé šuškají, [Select_CString(ROOT.Char.IsFemale,'má','můj')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U].“"
 ep3_decisions_event.0006.desc_victory: "Vzpomínáte si, že jste jim [Select_CString(ROOT.Char.IsFemale,'slibovala','sliboval')] velká vojenská vítězství?“"
 ep3_decisions_event.0006.desc_stability: "Vzpomínáte si, že jste jim [Select_CString(ROOT.Char.IsFemale,'slibovala','sliboval')] stabilitu a mír v říši?“"
 ep3_decisions_event.0006.desc_prosperity: "Vzpomínáte si, že jste jim [Select_CString(ROOT.Char.IsFemale,'slibovala','sliboval')] prosperující a úspěšnou říši?“"
 ep3_decisions_event.0006.desc_yes: "\n\nVzpomínám si. A myslím, že dopadlo docela dobře!"
 ep3_decisions_event.0006.desc_no: "\n\nVzpomínám si. A vím, že jsem [Select_CString(ROOT.Char.IsFemale,'selhala','selhal')]. Ale [Select_CString(ROOT.Char.IsFemale,'potřebovala','potřeboval')] jsem jen víc času! Koneckonců své sliby vždy plním."
 ep3_decisions_event.0006.a: "Vždy plním své sliby."
 ep3_decisions_event.0006.b: "Až na okamžiky, kdy ne."
 ep3_decisions_event.0007.t: "$ep3_decisions_event_triumph$ Závěr"
 ep3_decisions_event.0007.desc: "A tímto jsou [Glossary('hoi polloi', 'HOI_POLLOI_GLOSS' )] opět uspokojeni. Má moc a legitimita mé vlády byly znovu potvrzeny.\n\n"
 ep3_decisions_event.0007.hippodrome: "Když se chystám opustit Hippodrom, jásot mých lidí zaplňuje vzduch a odráží se od starých kamenů, které byly svědky slávy minulých císařů. Cítím tíhu dějin na svých bedrech, oči Konstantinopole upřené na svého císaře.\n\nDnes, pod žárem zapadajícího slunce, můj triumf není jen oslava, ale svědectví o trvalém duchu a síle říše.\n\n„[Glossary( 'Aien aristeuein', 'TRIUMPH_HIPPODROME_CONC_GLOSS')],“ zašeptám."
 ep3_decisions_event.0007.hagia_sophia: "Uvnitř posvátných zdí Hagie Sofie jsem [Select_CString(ROOT.Char.IsFemale,'obklopena','obklopen')] vážnou vznešeností. Zpěvy mého lidu stoupají v harmonii, ozývají se v tomto rozlehlém posvátném prostoru. Zde, v božském objetí tohoto architektonického zázraku, cítím spojení s něčím větším než já.\n\nMůj triumf v tomto posvátném místě přesahuje pouhou zemskou moc — je to spojení víry a vůdcovství, symbol božského požehnání nad mou vládou.\n\nKdyž stojím pod majestátním dómem, nejsem jen [Select_CString(ROOT.Char.IsFemale,'císařovnou','císařem')] Konstantinopole, jsem i [Select_CString(ROOT.Char.IsFemale,'strážkyní','strážcem')] jejího duchovního srdce.\n\n„[Glossary( 'Hyper tes basileias soterias', 'TRIUMPH_HAGIA_SOPHIA_CONC_GLOSS')],“ zašeptám."
 TRIUMPH_HIPPODROME_CONC_GLOSS: "„#bold Aien aristeuein#!“ je starořecká fráze z Homérovy #EMP Iliady#! znamenající „Vždy vynikat.“"
 TRIUMPH_HAGIA_SOPHIA_CONC_GLOSS: "„#bold Hyper tes basileias soterias#!“ je běžné znění ve staré řečtině znamenající „Pro spásu říše.“"
 ep3_decisions_event.0007.a: "Ať žije sláva [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]."
 ep3_decisions_event.0007.a.tt: "Tvůj triumf končí"
 ep3_decisions_event.1000.t: "Můj [GetCourtPositionType('charioteer_court_position').GetNameNoTooltip|U]"
 ep3_decisions_event.1000.desc: "Moji služebníci přivedli výběr kandidátů k najmutí jako mého vozataje — toho, kdo bude mým zářivým zástupcem na Hippodromu.\n\n[mediocre_charioteer.GetFirstName|U] postrádá zkušenosti, ale [Select_CString(mediocre_charioteer.IsFemale,'mohla','mohl')] by být přesto dobrá volba. Na druhou stranu [good_charioteer.GetFirstName] je osvědčený soutěžící."
 ep3_decisions_event.1000.desc.stolen_charioteer: "\n\n#EMP [Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')] bych#! také učinit lákavou nabídku vozatajovi, [Select_CString(stolen_charioteer.IsFemale,'kterou zaměstnává','kterého zaměstnává')] [stolen_charioteer.GetEmployer.GetTitledFirstName] – [stolen_charioteer.Custom('CZ_FirstName_D')]. Možná by [Select_CString(stolen_charioteer.IsFemale,'uvítala','uvítal')] štědřejšího zaměstnavatele..."
 ep3_decisions_event.1000.a: "[mediocre_charioteer.GetFirstNameNoTooltip] si zaslouží mou důvěru... a mé peníze."
 ep3_decisions_event.1000.a.aptitude: "[mediocre_charioteer.GetUINamePossessive] [Concept('aptitude','způsobilost')|E] je [mediocre_charioteer.GetCourtPositionAptitude( GetCourtPositionType( 'charioteer_court_position' ) )]"
 ep3_decisions_event.1000.b: "[good_charioteer.GetFirstNameNoTooltip] má zkušenosti, které hledám!"
 ep3_decisions_event.1000.b.aptitude: "[good_charioteer.GetUINamePossessive] [Concept('aptitude','způsobilost')|E] je [good_charioteer.GetCourtPositionAptitude( GetCourtPositionType( 'charioteer_court_position' ) )]"
 ep3_decisions_event.1000.c: "Už nějakou dobu mám [stolen_charioteer.GetFirstNameNoTooltip] na očích."
 ep3_decisions_event.1000.c.aptitude: "[stolen_charioteer.GetUINamePossessive] [Concept('aptitude','způsobilost')|E] je [stolen_charioteer.GetCourtPositionAptitude( GetCourtPositionType( 'charioteer_court_position' ) )]"
 ep3_decisions_event.1000.d: "Po zamyšlení..."
 ep3_decisions_event.1010.t: "Můj [GetCourtPositionType('bookmaker_court_position').GetNameNoTooltip|U]"
 ep3_decisions_event.1010.desc: "Moji služebníci přivedli výběr kandidátů k najmutí jako mého sázkového ředitele — toho, kdo bude spravovat sázky a finance závodů ve Hippodromu.\n\n[mediocre_bookmaker.GetFirstName|U] postrádá zkušenosti, ale [Select_CString(mediocre_bookmaker.IsFemale,'mohla','mohl')] by být přesto dobrá volba. Na druhou stranu volba [good_bookmaker.GetFirstName] by byla nejprozíravější."
 ep3_decisions_event.1010.a: "[mediocre_bookmaker.GetFirstNameNoTooltip] si zaslouží mou důvěru... a mé peníze."
 ep3_decisions_event.1010.a.aptitude: "[mediocre_bookmaker.GetUINamePossessive] [Concept('aptitude','způsobilost')|E] je [mediocre_bookmaker.GetCourtPositionAptitude( GetCourtPositionType( 'bookmaker_court_position' ) )]"
 ep3_decisions_event.1010.b: "[good_bookmaker.GetFirstNameNoTooltip] má zkušenosti, které hledám!"
 ep3_decisions_event.1010.b.aptitude: "[good_bookmaker.GetUINamePossessive] [Concept('aptitude','způsobilost')|E] je [good_bookmaker.GetCourtPositionAptitude( GetCourtPositionType( 'bookmaker_court_position' ) )]"
