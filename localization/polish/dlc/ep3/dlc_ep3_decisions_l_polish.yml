 ep3_decisions_event.3100.t: "Nafta, pálené vápno... a drzost"
 ep3_decisions_event.3100.desc: "Jako [ROOT.Char.GetTitleAsName] musím být nepochybným pánem svých domácích vod. Je to právo, jež uděluje [ROOT.Char.GetFaith.HighGodName], a chráněné obléháním a útokem prostřednictvím využívání plamenů od [ROOT.Char.GetFaith.PositiveAfterLife], našeho ovládání tekutého ohně.\n\nPokud má být Konstantinopol ochráněna, naše doky musí pojmout víc než bezbranné obchodní lodě!\n\nKde jsou mé rychlé [Glossary( 'dromons', 'DROMONS_GLOSS' )]? Kde jsou šikovní řemeslníci jako [Glossary( 'Kallinikos of Heliopolis', 'KALLINIKOS_GLOSS' )], kteří vyrobí velké plamenné projektily, jež budou chrlit jiskry nad příďmi mých plavidel?"
 DROMONS_GLOSS: "Byzantské galeje, poháněné vesly i plachtami, vhodné pro válčení na Středomoří."
 KALLINIKOS_GLOSS: "Architekt 7. století #bold Kallinikos#! je považován za vynálezce správné podoby řeckého ohně."
 ep3_decisions_event.3100.a: "Dám Konstantinopol do práce."
 ep3_decisions_event.3100.b: "Latini ochotně postaví naše lodě."
 ep3_decisions_event.3100.c: "Postavit flotilu, která se sama spálí? Ne."
 retake_eastern_provinces_decision: "Obnovit theodosiánské hranice"
 retake_eastern_provinces_decision_desc: "Když císař [GetScriptedCharacterByHistoryID( '70534' ).GetFirstName] rozdělil Římskou říši na dvě administrativní poloviny, východní část připadla jeho nejstaršímu synovi, [GetScriptedCharacterByHistoryID( '70519' ).GetFirstName]. Jsme jeho přímí následníci. Hranice našeho [Glossary( 'Pars', 'PARS_ORIENTIS_GLOSS' )] se však od té doby značně stáhly; bude to velká sláva pro Basileuse znovu nastolit hranice, které [GetScriptedCharacterByHistoryID( '70534' ).GetFirstNameNoTooltip] původně zanechal."
 retake_eastern_provinces_decision_tooltip: "Obnovit původní hranice Východního Říma"
 retake_eastern_provinces_decision_confirm: "Oficiálně potvrdit nové hranice"
 eastern_kingdoms_held_or_vassals_tt: "Pokud budou vytvořeny následující tituly [Concept('kingdom','království')|E], musíte je držet vy, nebo jejich držitelé musí být vašimi [Concept('vassals','vazaly')|E]: \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_bulgaria').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_epirus').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_hellas').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_thessalonika').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_krete').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_cyprus').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_nikaea').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_anatolia').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_pontus').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_syria').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_jerusalem').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_egypt').GetName]"
 every_county_in_theodosian_region: "[GetTitleByKey('e_byzantium').GetName] se stává [Concept('de_jure','de iure')|E] vrchním pánem každého titulu [Concept('kingdom','království')|E] v [GetGeographicalRegion('custom_theodosian_ere').GetName]"
 ep3_decisions_event.4000.t: "Theodosiovy hranice"
 ep3_decisions_event.4000.desc: "Po staletí se Druhý Řím — naše slavné Byzantium — stahoval, ztrácel provincii za provincií, ale už ne dál!\n\nDnes je den k oslavě, neboť [Glossary( 'Pars Orientis', 'PARS_ORIENTIS_GLOSS' )] byl navrácen do své bývalé slávy a rozlohy. Stejně jako když [GetScriptedCharacterByHistoryID( '70534' ).GetFirstName] Veliký přidělil jej svému nejstaršímu, vláda Konstantinopole sahá od Moesie po Egypt a od Kyrenaiky po Sýrii.\n\nJednotná říše pro [Select_CString(ROOT.Char.IsFemale,'vítěznou','vítězného')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_A')]!"
 ep3_decisions_event.4000.a: "Slavný den pro všechny Římany!"
 PARS_ORIENTIS_GLOSS: "#bold Pars Orientis#! — „Východní část“ — je původní latinský název Východní římské říše. Název označuje pouze administrativní dělení, bez formálního či politického rozdělení."
 refound_pandidakterion_decision: "Znovu založit Pandidakterion"
 refound_pandidakterion_decision_desc: "Císař [GetScriptedCharacterByHistoryID( '70533' ).GetFirstName] založil [Glossary( 'Pandidakterion', 'PANDIDAKTERION_GLOSS' )] v roce 425 n.l., jedno z největších center vzdělanosti na světě. Uplynula staletí a časy se změnily. Pokud chceme, aby Pandidakterion pokračoval v čele lidského poznání, je třeba instituci zrenovovat a reorganizovat."
 refound_pandidakterion_decision_tooltip: "Rozšířit a reorganizovat starověkou univerzitu v Konstantinopoli"
 refound_pandidakterion_decision_confirm: "Pusťme se do toho"
 chancellor_domestic_affairs_opinion_pandidakterion_bonus_desc: "\n$TAB$$pandidakterion_university_modifier$: #P +[SCOPE.ScriptValue('chancellor_domestic_affairs_opinion_pandidakterion_bonus')|2]#!"
 task_organize_levies_pandidakterion_bonus_desc: "\n$TAB$$pandidakterion_university_modifier$: #P +[SCOPE.ScriptValue('marshal_organize_levies_pandidakterion_bonus')|1]%#!"
 task_organize_levies_maintenance_pandidakterion_bonus_desc: "\n$TAB$$pandidakterion_university_modifier$: #P -[SCOPE.ScriptValue('task_organize_levies_maintenance_pandidakterion_bonus')|1]%#!"
 PANDIDAKTERION_GLOSS: "#bold Pandidakterion#!, což znamená „místo pro všechna učení“, bylo založeno v roce 425 n.l. Theodosiem II. a mělo 31 kateder, z nichž polovina byla vyučována latinsky a polovina řecky. Bylo znovu založeno Konstantinem IX. v roce 1046 a přežilo až do osmanského dobytí v roce 1453."
 pandidakterion_tt: "Vlastníte [GetTitleByKey('c_byzantion').GetName]"
 ask_western_help_decision: "Požádat o podporu"
 ask_western_help_decision_desc: "Byzanc vždy stála jako nejvýchodnější bašta křesťanství, ale současná válka proti nepřátelům Pravé víry nás vysává ze sil a zdrojů. Ač naše vztahy s ostatními větvemi křesťanstva nejsou jednoduché, možná je čas spolknout pýchu a požádat naše bratry v Kristu o pomoc."
 ask_western_help_decision_tooltip: "Kontaktovat naše křesťanské bratry jiné víry a požádat je o podporu"
 ask_western_help_decision_confirm: "Odeslat dopis"
 ep3_decisions_event.4010.t: "[caller.Custom2('AppropriateGreeting', called )]"
 ep3_decisions_event.4010.desc: "[called.Custom('SisterBrother')|U] v Kristu, naše pozice jako východní bašty křesťanství je v ohrožení, protože současná válka proti nevěřícím zatížila naše zdroje.\n\nProsím, pomozte nám odrazit společného nepřítele."
 ep3_decisions_event.4010.a: "Pomůžeme vám — za správnou pobídku!"
 ep3_decisions_event.4010.b: "Musíme vás odkázat na autoritu [ROOT.Char.GetFaith.GetReligiousHeadTitle.Custom('CZ_LandedNameNoTooltip_G')]."
 ep3_decisions_event.4010.b.tt_2: "Pouze hlava víry může rozhodnout, jakou pomoc může křesťanství nabídnout svým zbloudilým bratrům."
 ep3_decisions_event.4010.b.tt: "[ROOT.Char.GetTitledFirstNameNoTooltip] žádá [Select_CString(ROOT.Char.IsFemale,'její','jeho')] hlavu víry"
 ep3_decisions_event.4010.c: "Litujeme, nemůžeme vám pomoci."
 ep3_decisions_event.4010.c.tt: "[called.GetTitledFirstNameNoTooltip|U] odmítl pomoci"
 ep3_decisions_event.4011.b: "Pokud se zavážete je podpořit, Armáda Kristova půjde s vámi!"
 ep3_decisions_event.4011.c: "Nemůžeme pomoci zbloudilým věřícím."
 ep3_decisions_event.4012.t: "[sponsor.Custom2('AppropriateGreeting', called )]"
 ep3_decisions_event.4012.desc: "[Select_CString(ROOT.Char.IsFemale,'Obdržela','Obdržel')] jsem žádost o pomoc od [caller.Custom('CZ_TitledFirstName_G')]. Přestože jsou v bludu ve svém vyznání, [Select_CString(caller.IsFemale,'její','jeho')] lidé jsou stále našimi bratry a sestrami v Kristu a dlouho sloužili jako východní bašta křesťanství.\n\nJe nějaký způsob, jak jim podat pomocnou ruku?"
 ep3_decisions_event.4012.a: "Pomůžeme, ale ne zadarmo."
 ep3_decisions_event.4012.a.tt: "[pope.GetTitledFirstNameNoTooltip] pošle pomoc"
 ep3_decisions_event.4012.b: "Pokud se zavážou podpořit, Armáda Kristova půjde s nimi!"
 ep3_decisions_event.4012.b.tt: "[pope.GetTitledFirstNameNoTooltip] by [Select_CString(pope.IsFemale,'mohla','mohl')] vyhlásit [pope.GetFaith.Custom('GHWName')]!"
 ep3_decisions_event.4013.t: "[called.Custom2('AppropriateGreeting', caller )]"
 ep3_decisions_event.4013.desc: "Slyšeli jsme prosbu našich bratří a sester v Kristu a chceme pomoci. Pokud přislíbíte svou podporu, armády křesťanstva se ve svaté válce ([pope.GetFaith.GHWName]) spojí na vaši obranu!"
 ep3_decisions_event.4013.a: "Přijímám vaši nabídku."
 ep3_decisions_event.4013.a.tt: "Zavazuješ se poslat @gold_icon![caller.MakeScope.ScriptValue('massive_gold_value')|V0] do válečné pokladny výpravy ([pope.GetFaith.GHWName])."
 ep3_decisions_event.4013.b: "Tohle není to, o co jsem [Select_CString(ROOT.Char.IsFemale,'žádala','žádal')]!"
 ep3_decisions_event.4013.b.tt: "[caller.GetTitledFirstNameNoTooltip|U] [Select_CString(caller.IsFemale,'ustoupila','ustoupil')]"
 ep3_decisions_event.4014.desc: "S vděčným srdcem přijímáme vaši nabídku pomoci a těšíme se na příchod podpůrných vojsk.\n\nPospěšte si, prosím."
 ep3_decisions_event.4014.a: "#EMP Deus Vult!#!"
 ep3_decisions_event.4014.a.tt: "[pope.GetTitledFirstNameNoTooltip] [Select_CString(pope.IsFemale,'vyhlásila','vyhlásil')] [pope.GetFaith.Custom('GHWName')]!"
 ep3_decisions_event.4015.desc: "Slyšeli jsme prosbu našich bratří a sester v Kristu a srdce nám krvácí nad vaším utrpením. Pomoc však není zadarmo.\n\nPokud byste mohli podpořit naše úsilí finanční kompenzací, zavázali bychom se poslat vám vojenskou pomoc."
 ep3_decisions_event.4015.a: "Nechť tak bude."
 ep3_decisions_event.4015.b: "[Select_CString(ROOT.Char.IsFemale,'Nežádala','Nežádal')] jsem žádné podmínky."
 ep3_decisions_event.4015.a.tt: "[caller.GetTitledFirstNameNoTooltip|U] [Select_CString(caller.IsFemale,'přijala','přijal')] tvou nabídku"
 called_for_help_fervor: "Křesťanští bratři v nouzi"
 ep3_religious_volunteers_army: "Náboženské dobrovolné jednotky"
 valid_primary_war_enemy_for_crusade: "Nepřátelský [Concept('war_leader','vůdce války')|E] není křesťan a buď drží titul [Concept('kingdom','království')|E] nebo je součástí [Concept('kingdom','království')|E]"
 ask_western_help_decision_effect_desc: "Pošlete žádost o vojenskou pomoc křesťanskému vůdci jiné víry. Ten může za vojsko požadovat zlato, nebo odmítnout. Pokud se zapojí [Concept('head_of_faith','hlava víry')|E], může se záležitost vyhrotit ve Velkou svatou válku!\n\nRozhodnutí má 20letou prodlevu."
 valid_realm_size_for_help: "[Concept('realm_size','Velikost tvého panství')|E] je menší než #N 84#! hrabství"
 recently_asked_for_help: "Toto rozhodnutí jsi už v posledních 20 letech [Select_CString(GetPlayer.IsFemale,'učinila','učinil')]!"
 there_is_someone_to_ask_for_help: "Je tu někdo, koho ještě můžete požádat o pomoc"
 evangelize_the_slavs_decision: "Evangelizovat pohany"
 evangelize_the_slavs_decision_desc: "Jako strážkyně jediné pravé víry má [GetTitleByKey('e_byzantium').GetName] povinnost šířit evangelium mezi pohany a přivítat je v lůně naší církve jako naše mladší bratry a sestry v Kristu. O to víc, že žijí hned za našimi hranicemi a ohrožují celistvost a bezpečnost říše."
 evangelize_the_slavs_decision_tooltip: "Poslat misionáře, aby obrátil sousední pohany"
 evangelize_the_slavs_decision_confirm: "Poslat misionáře"
 evangelize_the_slavs_decision_effect: "Pošleš misionáře, aby se pokusil obrátit sousedního vládce pohanské víry.\n$EFFECT_LIST_BULLET$Pokud misionář uspěje, vládce přijme tvou [Concept('faith','víru')|E] a stane se tvým [Concept('allies','spojencem')|E]. Získáš [Concept('legend_seed','zárodek legendy')|E].\n$EFFECT_LIST_BULLET$Účast na misijním díle je tak prestižní počin, že získáš [Concept('influence','vliv')|E] a [Concept('prestige','prestiž')|E], i když tvůj misionář selže."
 ep3_decisions_event.4020.t: "Evangelizace [pagan.GetCulture.GetCollectiveNounNoTooltip]"
 ep3_decisions_event.4020.desc: "Království nebes patří věřícím, ale náš soused, [pagan.GetTitledFirstName], je blaženě nevědomý a setrvává ve víře ve své pověry a falešné bohy.\n\nZachránit duši [Select_CString(pagan.IsFemale,'její','jeho')] a duše [Select_CString(pagan.IsFemale,'jejímu','jeho')] lidu je samo o sobě ušlechtilé poslání, ale jejich obrácení přináší i #EMP pozemské#! výhody — například snížení jejich nepřátelství vůči nám a začlenění do naší sféry vlivu.\n\nMůj vybraný misionář, [evangelizer.GetFirstName], je připraven vyrazit."
 ep3_decisions_event.4020.a: "Kéž vás vede [ROOT.Char.GetFaith.HighGodName]!"
 ep3_decisions_event.4020.a.tt: "[evangelizer.GetFirstNameNoTooltip] odjíždí do hlavního města [pagan.GetTitledFirstNamePossessiveNoTooltip]."
 ep3_decisions_event.4022.desc: "Vyslanci našich sousedů chodí tak často, že se mi všichni splétají v paměti. Avšak dnešní posel [CZPrepZ(GetTitleByKey('e_byzantium').GetNameNoTooltip)] [GetTitleByKey('e_byzantium').Custom('CZ_LandedName_G')] vyčnívá jako žádný jiný.\n\nZdá se být [Select_CString(evangelizer.IsFemale,'jakousi svatou ženou','jakýmsi svatým mužem')], a místo politických požadavků [Select_CString(evangelizer.IsFemale,'tato','tento')] [evangelizer.GetFirstName] káže o všemohoucím Bohu, uctívaném v chrámech ze zlata a stříbra, které vždy voní po kadidle."
 ep3_decisions_event.4022.a: "Prosím, povězte mi více."
 ep3_decisions_event.4022.a.tt: "Uzavřeš [Concept('alliance','spojenectví')|E] s pánem [evangelizer.Custom('CZ_TitledFirstNameNoTooltip_G')], [sender.Custom('CZ_TitledFirstName_I')]"
 ep3_decisions_event.4022.b: "Nové bohy nepotřebujeme."
 ep3_decisions_event.4022.c: "Směšné rouhání!"
 ep3_decisions_event.4022.c.tt: "Tohle jasně ukáže, že jejich kazatelé tu nejsou vítáni! Měli bychom ale počítat s odvetou..."
 ep3_decisions_event.4025.desc_new: "[Select_CString(sender.IsFemale,'Má předchůdkyně','Můj předchůdce')] [sender.GetFirstName] [Select_CString(sender.IsFemale,'investovala','investoval')] do evangelizace [pagan.GetCulture.GetCollectiveNounNoTooltip], ale bohužel pro [Select_CString(sender.IsFemale,'ni','něj')] to budu já, kdo sklidí plody [Select_CString(sender.IsFemale,'jejích','jeho')] snah. [Select_CString(sender.IsFemale,'Její','Jeho')] [Select_CString(evangelizer.IsFemale,'misionářka','misionář')] [evangelizer.GetFirstName] se právě [Select_CString(evangelizer.IsFemale,'vrátila','vrátil')]."
 ep3_decisions_event.4025.desc_old: "Před měsíci jsem [Select_CString(ROOT.Char.IsFemale,'poslala','poslal')] [Select_CString(evangelizer.IsFemale,'svou věrnou','svého věrného')] [evangelizer.Custom('CZ_FirstName_A')], aby [Select_CString(evangelizer.IsFemale,'přinesla','přinesl')] poznání Boha lidu kultury [pagan.GetCulture.GetNameNoTooltip]. S velkou radostí [Select_CString(evangelizer.IsFemale,'ji','ho')] dnes vítám zpět, protože na [Select_CString(evangelizer.IsFemale,'její','jeho')] zprávu netrpělivě čekám."
 ep3_decisions_event.4025.desc_success: "\n\n„Mám skvělé zprávy, [Select_CString(ROOT.Char.IsFemale,'paní má','pane můj')]! [pagan.GetTitledFirstName|U] s chutí [Select_CString(pagan.IsFemale,'vyslechla','vyslechl')] Dobrou zvěst a [Select_CString(pagan.IsFemale,'obrátila','obrátil')] se k [evangelizer.GetFaith.GetName], spolu s mnohými ze svého lidu.“"
 ep3_decisions_event.4025.desc_failure: "\n\n„Mám smutné zprávy, [Select_CString(ROOT.Char.IsFemale,'paní má','pane můj')]. Bohužel [pagan.GetTitledFirstName] [Select_CString(pagan.IsFemale,'byla vůči Slovu Božímu zcela lhostejná a poslala','byl vůči Slovu Božímu zcela lhostejný a poslal')] mě pryč s prázdnýma rukama.“"
 ep3_decisions_event.4025.a: "Výborně!"
 ep3_decisions_event.4025.b: "Je to jen dočasný neúspěch."
 ep3_decisions_event.4026.desc: "Neslýchané zprávy!\n\nPřišly zprávy ze země [pagan.GetCulture.GetCollectiveNounNoTooltip], podle nichž [Select_CString(evangelizer.IsFemale,'byla má misionářka','byl můj misionář')] [evangelizer.GetFirstName] [Select_CString(evangelizer.IsFemale,'zabita','zabit')] [Select_CString(pagan.IsFemale,'barbarkou','barbarem')] [pagan.Custom('CZ_TitledFirstName_I')], [Select_CString(pagan.IsFemale,'která nestačila pouze odmítnout pokusy o obrácení, ale dokonce znesvětila a zavraždila','který nestačil pouze odmítnout pokusy o obrácení, ale dokonce znesvětil a zavraždil')] [Select_CString(evangelizer.IsFemale,'tuto ženu Boží','tohoto muže Božího')]!"
 ep3_decisions_event.4026.a: "Neslýchané!"
 valid_neighboring_and_across_water_top_liege: "Jakýkoli sousední vrchní pán: $valid_for_conversion_tt$"
 valid_neighboring_and_across_water_realm_same_rank: "Jakýkoli sousední vládce stejného stupně jako vy: $valid_for_conversion_tt$"
 valid_for_conversion_tt: "\n$EFFECT_LIST_BULLET$Má [GetDoctrineType('unreformed_faith_doctrine').GetBaseName] [GetReligionFamily('rf_pagan').GetName] [Concept('faith','víry')|E]\n$EFFECT_LIST_BULLET$Není ve [Concept('war','válce')|E]\n$EFFECT_LIST_BULLET$Předtím násilně neodmítl pokus o konverzi"
 negotiated_alliance_delay_tt: "Aliance vstoupí v platnost, jakmile se [evangelizer.GetNameNoTooltip] vrátí k [Select_CString(evangelizer.IsFemale,'jejímu','jeho')] pánovi."
 ep3_decisions_event.4025.a.tt: "Vytvoříte [Concept('alliance','alianci')|E] s nově obráceným [pagan.GetTitledFirstName]."
 ep3_decisions_event.4023.t: ""
 ep3_decisions_event.4023.desc: ""
 ep3_decisions_event.4023.a: ""
 recreate_byzantine_empire_decision: "Obnovit Byzantskou říši"
 recreate_byzantine_empire_decision_desc: "Rozbití [GetTitleByKey('e_byzantium').GetName] bylo pro náš lid bezprecedentní tragédií, ale přesto jsme pokračovali. Koneckonců, dokud stojí alespoň jeden [Glossary( 'Romaios', 'ROMAIOS_GLOSS' )], stále stojí Řím.\n\nJednoho dne opět usedne na trůn Konstantinopole legitimní vládce a Říše povstane znovu."
 recreate_byzantine_empire_decision_tooltip: "Vytvořit [GetTitleByKey('e_byzantium').GetName] a znovu zavést jeho starodávné zvyky"
 recreate_byzantine_empire_decision_confirm: "Řím povstává!"
 ep3_decisions_event.4030.t: "Říše znovuzrozená"
 ep3_decisions_event.4030.desc: "Umíráním věřících, ohněm řečnictví, samotnou vůlí, kterou projevuje [ROOT.Char.GetFaith.HighGodName] — #EMP [GetTitleByKey('e_byzantium').GetName|U] žije znovu!#!\n\nDívám se přes Královnu měst, teplý vánek z Marmary si pohrává s mými korunovačními rouchy. Krásné písně se ozývají z velkého domu Svaté Moudrosti. Občané tančí v ulicích, vyjadřují vděčnost a radost.\n\nNaše dny hanby, kdy celý svět opovrhoval padlými [Glossary( 'Romaioi', 'ROMAIOS_GLOSS' )], musí být rozhodně u konce. Legitimní [ROOT.Char.GetTitleAsNameNoTooltip] opět sedí na trůnu [GetScriptedCharacterByHistoryID( '70523' ).GetFirstName].\n\n#EMP Já.#!"
 ep3_decisions_event.4030.a: "Sláva Říma bude dál růst!"
 ROMAIOS_GLOSS: "#bold Romaioi#! (jednotné #bold Romaios#!) je řecká přepis latinského jména #bold Romani#!, jak se Římané sami nazývali. Během středověku se Byzantinci považovali za Římany a nazývali svou říši #EMP Basileia ton Romaion#!, Říše Římanů."
 found_varangian_guard_decision: "Založit Varjažskou gardu"
 found_varangian_guard_decision_desc: "Po léta se v Konstantinopoli scházejí válečníci z nejvzdálenějších severních krajů, přitahovaní naším bohatstvím. Nabízejí své služby jako žoldnéři, v čemž vynikají, a nemají věrnost kromě mince a vlastní pýchy. Kdybychom dokázali jejich přítomnost organizovat kolem císaře, získali bychom neporazitelnou vojenskou sílu ve své osobní službě!"
 found_varangian_guard_decision_tooltip: "$found_varangian_guard_decision$"
 found_varangian_guard_decision_confirm: "Začít nábor"
