 restore_backwater_counties_decision_desc: "V průběhu staletí upadlo [ROOT.Char.GetPrimaryTitle.GetNameNoTier] do hanby a představuje hanebný stín své kdysi významné minulosti.\n\nAle pracovali jsme neúnavně na rozvoji našich předků zemi k jejím bývalým výšinám. Sláva [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] bude obnovena!"
