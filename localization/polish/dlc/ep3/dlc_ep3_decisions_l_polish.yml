 ep3_decisions_event.4080.t: "Salon založen"
 ep3_decisions_event.4080.desc.intro: "Je téměř hotovo. Přede mnou se staví trvalé místo, kde se básníci budou scházet, setkávat a vychovávat novou generaci.\n\n"
 ep3_decisions_event.4080.wallada: "Můj sen,"
 ep3_decisions_event.4080.heir: "Sen mého mentora,"
 ep3_decisions_event.4080.desc.outro: "prosperující a rušné centrum umění zde [CZPrepV(location.GetNameNoTooltip)] [CZProvName(location,'L')] konečně přichází na svět.\n\nKdyž poslední prkna podlahy zapadají na místo, vůně čerstvě natřeného zdiva se nese po nádvoří. Zhlaví diváků vybuchne potleskem, když do učeben uvádím místní sirotky, aby začali své lekce.\n\nVše, co si přeji, je, aby zde stály generace."
 ep3_decisions_event.4080.a: "Vyvrcholení mé práce i práce tolika jiných."
 mass_arrests_decision: "Nařídit hromadné zatýkání"
 mass_arrests_decision_desc: "Když se [Concept('powerful_family','mocná rodina')|E] stane trochu #EMP příliš mocnou#!, může být nutné uchýlit se k radikálnějším opatřením. Zajistit, aby proti mně mocný rod nemohl zasáhnout, je jemná práce, a existuje jen jeden spolehlivý způsob: #EMP naházet je všechny do okovů.#!"
