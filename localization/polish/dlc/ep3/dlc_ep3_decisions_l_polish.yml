 ep3_decisions_event.4050.t: "Vláda: upevněná"
 ep3_decisions_event.4050.desc.intro: "Klid [ROOT.Char.GetFaith.HouseOfWorship] byl narušen hordou dvořan, guvernérů a sedláků, kteří se tu shromáždili, aby oslavili... #EMP mě!#!\n\n"
 ep3_decisions_event.4050.desc.hate: "[head_of_faith.GetTitledFirstName] se na mě dívá s velkým pohrdáním — jediná věc, která brání tomu, aby z [Select_CString(head_of_faith.IsFemale,'jejích','jeho')] úst nevypluly hřmotné urážky, je základní zdvořilost."
 ep3_decisions_event.4050.desc.other: "[head_of_faith.GetTitledFirstName|U] mi s vlídným úsměvem pokyne a já k [Select_CString(head_of_faith.IsFemale,'ní','němu')] přistoupím. „[Select_CString(ROOT.Char.IsFemale,'Má nejdražší','Můj nejdražší')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ zdraví mě."
 ep3_decisions_event.4050.desc.outro: "\n\n„Dnes vzdáváme díky za to, že nad námi bdí [Select_CString(ROOT.Char.IsFemale,'tak laskavá ochránkyně','tak laskavý ochránce')], jak chce [ROOT.Char.GetFaith.HighGodName],“ pokračuje a obrací se k davu. „Kéž je [Select_CString(ROOT.Char.IsFemale,'její','jeho')] vláda dlouhá a požehnaná!“"
 ep3_decisions_event.4050.a: "Rád bych, aby byla #EMP dlouhá#!"
 ep3_decisions_event.4050.b: "Jsem horlivý zastánce prosperity."
 ep3_decisions_event.4050.c: "Jen si pamatuj, komu #EMP sloužíš#!."
