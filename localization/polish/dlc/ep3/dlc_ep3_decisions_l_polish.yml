 seasoned_visitor_decision_not_enough_poi_advanced: "[Select_CString(GetPlayer.IsFemale,'Navštívila','Navštívil')] jsi #color_white 42#! [Concept('points_of_interest','zajímavých míst')|E] #weak (aktuálně: [THIS.Var('poi_visited').GetValue|V0])#!"
 NOT_ARTIFACT_CREATOR: "Není tvůrcem tohoto artefaktu"
 ep3_laamp_decision_event.1100.t: "$seasoned_visitor_decision$"
 ep3_laamp_decision_event.1100.desc: "Jasné slunce vycházející nad zasněženými horskými štíty, perlivé stoky rozlehlých měst, chrámy ukrývající nejzbožnější i nejzapadlejší duše.\n\nDíla lidí napříč staletími, zázraky přírody stvořené rukou, již vede [ROOT.Char.GetFaith.HighGodName] Všemohoucí. [Select_CString(ROOT.Char.IsFemale,'Viděla','Viděl')] jsem to všechno.\n\n[Select_CString(ROOT.Char.IsFemale,'Mluvila','Mluvil')] jsem s vysokými i nízkými, [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')] jsem lidi žít mnoha způsoby. Taková pokladnice bystrých pozorování, mých bezchybných vzpomínek, by byla ceněným zázrakem pro každého s jiskrou zvědavosti... pokud se rozhodnu to sepsat."
 ep3_laamp_decision_event.1100.a: "Mé vzpomínky patří jen mně."
 ep3_laamp_decision_event.1100.a.flavor: "Mohu mluvit a mluvit, ale posluchač si zapamatuje jen slova, která očekává."
 ep3_laamp_decision_event.1100.a.desc: "Protože jsi [Select_CString(GetPlayer.IsFemale,'navštívila','navštívil')] [THIS.Var('poi_visited').GetValue] [Concept('points_of_interest','zajímavých míst')|E]:"
 ep3_laamp_decision_event.1100.b: "„[Select_CString(ROOT.Char.IsFemale,'Nepověděla','Nepověděl')] jsem ani polovinu toho, co jsem [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')]...“"
 ep3_laamp_decision_event.1100.b.flavor: "...protože vím, že by mi nebylo věřeno."
 ep3_laamp_decision_event.1100.b.desc: "#weak Tento artefakt bude poskytovat [Concept('lifestyle_experience','zkušenosti životního stylu')|E] #color_yellow budoucím držitelům#!; jeho kvalitu zvýší každý tucet navštívených [Concept('points_of_interest','zajímavých míst')|E].#!"
 ep3_laamp_decision_event.1100.c: "Mé pero zatím zůstane suché."
 ep3_laamp_decision_event.1100.c.desc: "Odkládáte rozhodnutí sepsat příběh svých cest."
 ep3_laamp_decision_event.1100.c.flavor: "Bez kamenů není oblouk."
 marco_polo_book_title: "$seasoned_visitor_decision$"
 marco_polo_book_desc: "[newly_created_artifact.Custom('ArtifactMarcoPoloIntro')]\n\n[newly_created_artifact.Custom('ArtifactMarcoPoloDesc')|U]\n\n[newly_created_artifact.Custom('ArtifactMarcoPoloEnd')|U]"
 zealous_missionary_prep_decision: "Cesta [CZAdherent_G(ROOT.Char.GetFaith)|l] — Vzestup"
 zealous_missionary_prep_decision_desc: "Pokračující existence ohavných kacířů a zmýlených pohanů je urážkou pro každého dobrého [CZAdherent_A(ROOT.Char.GetFaith)|l] a pohoršuje i samo božstvo – [ROOT.Char.GetFaith.HighGodName]!"
 zealous_missionary_prep_decision_tooltip: "Je čas kázajícího"
 zealous_missionary_prep_decision_holy_site: "Tvá současná [Concept('location','poloha')|E] musí být [Concept('holy_site','svatým místem')|E] víry [THIS.Char.GetFaith.GetName], které vyznává tuto víru a kterému vládne [Concept('top_liege','nejvyšší lenní pán')|E] stejné víry."
 zealous_missionary_prep_decision_holy_sites_visited_req: "[Select_CString(GetPlayer.IsFemale,'Dokončila','Dokončil')] jsi [Concept('pilgrimages','poutě')|E] alespoň do dvou různých [Concept('holy_sites','svatých míst')|E]"
 zealous_missionary_prep_decision_reward_desc: "Příští desetiletí půjdeš cestou zbožného misionáře [CZAdherentPl_G(THIS.Char.GetFaith)|l]:\n#weak Hrabství, která navštívíš, budeš moct obrátit na víru [THIS.Char.GetFaith.GetName], ať už pravdou svých slov, nebo silou svého meče.\n#bold Velké nebezpečí#! čeká ty, kdo na cestě selžou, neboť jen hodní obdrží odměnu, kterou dává [THIS.Char.GetFaith.HighGodName], v [THIS.Char.GetFaith.PositiveAfterLife|U].\n\n$EFFECT_LIST_BULLET$ @alert_icon! $ep3_laamp_decision_event.1103.difficulty.desc$\n$EFFECT_LIST_BULLET$ [learning_i] $ep3_laamp_decision_event.1103.a.desc$\n$EFFECT_LIST_BULLET$ [martial_i] $ep3_laamp_decision_event.1103.b.desc$"
 zealous_missionary_prep_decision_confirm: "[ROOT.Char.GetFaith.HighGodName] je veliký!"
 ep3_laamp_decision_event.1101.t: "$zealous_missionary_prep_decision$"
 ep3_laamp_decision_event.1101.desc: "Jen na málo místech na této Zemi lze svědčit o moci, kterou má [ROOT.Char.GetFaith.HighGodName] Všemohoucí, jako [CZPrepV(holy_site_location.GetNameNoTooltip)] [CZProvNameNoTooltip(holy_site_location,'L')]. Požehnaní jsou věřící, kteří sem přijdou, aby pocítili [ROOT.Char.GetFaith.HighGodHerHis|U] moc.\n\nPro většinu je toto posvátné místo koncem jejich cesty, nejvyšším vrcholem jejich života. Pro mě je to jen začátek mé cesty.\n\nA pro ty, kterým hodlám přivést [ROOT.Char.GetFaith.HighGodHerHis|U] světlo, je to jejich jediná šance na spásu."
 ep3_laamp_decision_event.1101.a: "Koupám se ve slávě, kterou vyzařuje [ROOT.Char.GetFaith.HighGodName]!"
 ep3_laamp_decision_event.1101.a.desc: "$zealous_missionary_prep_decision_reward_desc$\nK pokračování na své zbožné cestě musíte přejít do nevěřících zemí."
 zealous_missionary_start_decision: "Cesta [CZAdherent_G(ROOT.Char.GetFaith)|l] — Předehra"
 zealous_missionary_start_decision_desc: "Nelze očekávat, že [ROOT.Char.GetFaith.HighGodName|U] udělá všechnu práci. [ROOT.Char.GetFaith.HighGodNameSheHe|U] potřebuje věřící, aby vedli zbloudilé... ať chtějí nebo ne."
 zealous_missionary_start_decision_other_faith_location: "Tvá poloha musí vyznávat jinou [Concept('faith','víru')|E]"
 zealous_missionary_start_decision_tooltip: "Musím být jedním z pravých [CZAdherentPl_G(ROOT.Char.GetFaith)|l]"
 zealous_missionary_start_decision_reward_desc: "$zealous_missionary_prep_decision_reward_desc$"
 zealous_missionary_start_decision_confirm: "Buď rychlá, má duše, a odpověz na volání [ROOT.Char.GetFaith.HighGodHerHis|U]!"
 ep3_laamp_decision_event.1102.t: "$zealous_missionary_start_decision$"
 ep3_laamp_decision_event.1102.desc: "Posvátné svatyně [ROOT.Var('holy_site_ascension').Province.GetName] jsou daleko. Přesto stále cítím v sobě moc, kterou mi dává [ROOT.Char.GetFaith.HighGodName], silnější než kdy dřív.\n\nJe to můj osud, vždycky to tak bylo, konat dílo [ROOT.Char.GetFaith.HighGodHerHis|U], zaplnit ta území a duše zde žijících světlem [ROOT.Char.GetFaith.HighGodHerHis|U]. Spása je jim připravena a já jsem pokorným nástrojem [ROOT.Char.GetFaith.HighGodHerHis|U]."
 ep3_laamp_decision_event.1102.a: "A oni poznají, kdo je [ROOT.Char.GetFaith.HighGodName]!"
 ep3_laamp_decision_event.1102.a.desc: "$zealous_missionary_prep_decision_reward_desc$\n#weak Na šíření své [Concept('faith','víry')|E] během cestování budeš mít 10 let."
 ep3_laamp_decision_event.1102.b: "Ještě potřebuji čas na přípravu."
 ep3_laamp_decision_event.1102.b.desc: "Rozhodnutí odložíte na později"
 ep3_laamp_decision_event.1103.t: "Cesta [CZAdherent_G(ROOT.Char.GetFaith)|l] — Dosáhnutí"
 ep3_laamp_decision_event.1103.desc: "Nejdůležitější okamžik pro [current_location.GetCounty.Custom('CZ_LandedName_A')] nastal s mým příchodem, neboť dnes přináším světlo, jež dává [ROOT.Char.GetFaith.HighGodName], a [ROOT.Char.GetFaith.HighGodNameSheHe|U] vstoupí do jejich srdcí a zůstane tam po mnoho generací.\n\nMístní vyšší šlechtici, [current_location.GetCounty.GetTitle.GetHolder.GetName] a [Select_CString(current_location.GetCounty.GetTitle.GetHolder.IsFemale,'její','jeho')] pokřivená družina, jsou příliš tvrdohlaví, příliš zkažení falešnými rituály [current_location.GetCounty.GetFaith.GetName]. Ale duše chudých [current_location.GetCounty.GetCulture.GetCollectiveNoun] ke mně volají, touží po milosti [ROOT.Char.GetFaith.HighGodHerHis|U]. A tu ji dostanou!"
 ep3_laamp_decision_event.1103.desc.alternative: "Cesta zbožného [CZAdherent_G(ROOT.Char.GetFaith)|l] není jednoduchá, [Select_CString(ROOT.Char.IsFemale,'její','jeho')] útrapy jsou dlouhé a bez pozemské odměny. Jen naděje mě udrží vzpřímeným. Ten, kdo kráčí v čisté víře, odevzdává se do rukou, které mu nabízí [ROOT.Char.GetFaith.HighGodName], jako dítě do náruče své matky.\n\nKraji dál putuji, neboť dílo a sláva [ROOT.Char.GetFaith.HighGodHerHis|U] zůstávají nedokončené, neboť srdce [CZAdherentPl_G(current_location.GetCounty.GetFaith)|l] zde zůstávají plná lží a falešných pověr.\n\nAle ne na dlouho. Dnes pokračuje má zkouška a začíná ta jejich."
 ep3_laamp_decision_event.1103.difficulty.desc: "#weak Vyšší rozvoj hrabství ztěžuje konverzi."
 ep3_laamp_decision_event.1103.a.desc: "#weak Mluvení místním jazykem zvyšuje šanci na úspěch."
 ep3_laamp_decision_event.1103.a: "Vyslyš, co hlásá [ROOT.Char.GetFaith.HighGodName]!"
 ep3_laamp_decision_event.1103.a.alternative: "Pomodleme se za spásu [current_location.GetCounty.GetCulture.GetNameNoTooltip]."
 ep3_laamp_decision_event.1103.a.success: "Konverze úspěšná"
 ep3_laamp_decision_event.1103.a.failure: "Konverze selhala"
 ep3_laamp_decision_event.1103.b: "Zůstanou pouze věřící!"
 ep3_laamp_decision_event.1103.b.alternative: "Buď [ROOT.Char.GetFaith.HighGodNameSheHe|U], nebo můj meč vstoupí do vašich srdcí!"
 ep3_laamp_decision_event.1103.b.desc: "#weak Mít více vojáků a rytířů než místní posádka také zvyšuje šanci na úspěch."
 ep3_laamp_decision_event.1103.b.flavor: "Přeměnit lidi v mrtvoly je snazší než je převést na [CZAdherentPl_A(ROOT.Char.GetFaith)|l]."
 ep3_laamp_decision_event.1103.c: "Jaké špinavé místo."
 ep3_laamp_decision_event.1103.c.alternative: "Neplýtvejme časem na [current_location.GetCounty.Custom('CZ_LandedName_A')]"
 ep3_laamp_decision_event.1103.c.desc: "Nebudeš se pokoušet obrátit místní obyvatelstvo."
 ep3_laamp_decision_event.1103.c.flavor: "Kdyby [ROOT.Char.GetFaith.DevilName] stvořil [current_location.GetCounty.GetTitle.GetHolder.GetTopLiege.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_A')], jak někteří tvrdí, tady odpočíval sedmého dne."
 ep3_laamp_decision_event.1104.t: "Cesta [CZAdherent_G(ROOT.Char.GetFaith)|l] — Konec"
 ep3_laamp_decision_event.1104.desc: "Jsem [Select_CString(ROOT.Char.IsFemale,'požehnána','požehnán')]! Před deseti lety, [CZPrepV(ROOT.Var('holy_site_ascension').Province.GetNameNoTooltip)] [CZProvName(ROOT.Var('holy_site_ascension').Province,'L')], ke mně [Select_CString(EqualTo_string(ROOT.Char.GetFaith.HighGodHerHis,Localize('CHARACTER_HERHIS_HER')),'přišla','přišel')] [ROOT.Char.GetFaith.HighGodName], [Select_CString(EqualTo_string(ROOT.Char.GetFaith.HighGodHerHis,Localize('CHARACTER_HERHIS_HER')),'vstoupila','vstoupil')] do mého srdce a [Select_CString(EqualTo_string(ROOT.Char.GetFaith.HighGodHerHis,Localize('CHARACTER_HERHIS_HER')),'naplnila','naplnil')] ho věčnou radostí a krásou. A od té doby jsem [Select_CString(ROOT.Char.IsFemale,'putovala','putoval')] po Zemi [ROOT.Char.GetFaith.HighGodHerHis|U], [Select_CString(ROOT.Char.IsFemale,'kázala','kázal')] [ROOT.Char.GetFaith.HighGodHerHis|U] slovo.\n\nKam jsem [Select_CString(ROOT.Char.IsFemale,'vkročila','vkročil')], byla se mnou moc [ROOT.Char.GetFaith.HighGodHerHis|U], šířící se po krajích a srdcích lidí.\n\nA dnes končí má cesta misionáře, ve slávě, jakou dává [ROOT.Char.GetFaith.HighGodName], v poznání, že jsem [Select_CString(ROOT.Char.IsFemale,'splnila','splnil')] svou část velkého plánu [ROOT.Char.GetFaith.HighGodHerHis|U]."
 ep3_laamp_decision_event.1104.desc.failure: "[Select_CString(ROOT.Char.IsFemale,'Byla jsem požehnána','Byl jsem požehnán')]! Před deseti lety [CZPrepV(ROOT.Var('holy_site_ascension').Province.GetNameNoTooltip)] [CZProvName(ROOT.Var('holy_site_ascension').Province,'L')] ke mně [Select_CString(EqualTo_string(ROOT.Char.GetFaith.HighGodHerHis,Localize('CHARACTER_HERHIS_HER')),'přišla','přišel')] [ROOT.Char.GetFaith.HighGodName], [Select_CString(EqualTo_string(ROOT.Char.GetFaith.HighGodHerHis,Localize('CHARACTER_HERHIS_HER')),'vstoupila','vstoupil')] do mého srdce a [Select_CString(EqualTo_string(ROOT.Char.GetFaith.HighGodHerHis,Localize('CHARACTER_HERHIS_HER')),'naplnila','naplnil')] ho věčnou radostí a krásou. A jediné, co za to [Select_CString(EqualTo_string(ROOT.Char.GetFaith.HighGodHerHis,Localize('CHARACTER_HERHIS_HER')),'žádala','žádal')], bylo, abych [Select_CString(ROOT.Char.IsFemale,'šela','šel')] do světa a [Select_CString(ROOT.Char.IsFemale,'sdílela','sdílel')] to až do posledního dechu.\n\nA já jsem si to jako ubohá duše, které se [Select_CString(EqualTo_string(ROOT.Char.GetFaith.HighGodHerHis,Localize('CHARACTER_HERHIS_HER')),'Její','Jeho')] milost nikdy nedotkla, [Select_CString(ROOT.Char.IsFemale,'nechala','nechal')] pro sebe. [Select_CString(ROOT.Char.IsFemale,'Snažila','Snažil')] jsem se to sdílet dost usilovně? Byl to ten bídný [ROOT.Char.GetFaith.DevilName], kdo mě svedl z cesty? Skvrna na mé duši, skvrna selhání a bezbožnosti, tam zůstane navěky."
 ep3_laamp_decision_event.1104.a: "Odměna, kterou dává [ROOT.Char.GetFaith.HighGodName], na mě čeká v [ROOT.Char.GetFaith.PositiveAfterLife|U]."
 ep3_laamp_decision_event.1104.b: "[ROOT.Char.GetFaith.HighGodName], odpusť mi, neboť jsem [Select_CString(ROOT.Char.IsFemale,'selhala','selhal')]."
 become_conqueror_decision: "Staň se velkým dobyvatelem"
 become_conqueror_decision_desc: "Příliš dlouho můj meč přinášel bohatství jiným, nyní se Země utopí v oceánu krve pro #EMP mou#! slávu. Začne doba velikých utrpení, nevídaná od úsvitu času!"
 become_conqueror_decision_tooltip: "#WEAK Zpívám o válce a muži v boji#!"
 become_conqueror_decision_confirm: "Jsem trestem, který sesílá [ROOT.Char.GetFaith.HighGodName]!"
 become_conqueror_decision_reward: "Po získání panství získáte #V [GetTrait('conqueror').GetName( GetNullCharacter )]#! [Concept('trait','rys')|E]"
 become_conqueror_decision_troops: "Dostanete armádu ostřílených veteránů, skládající se z [GetMaA('accolade_maa_lancers').GetName] a [GetMaA('accolade_maa_vanguards').GetName]"
 become_conqueror_decision_legend_seed: "Získáš [Concept('legend_seed','zárodek legendy')|E] #EMP $legend_chronicle_conqueror_chronicle$#!"
 become_conqueror_decision_war_participation: "[Select_CString(GetPlayer.IsFemale,'Zúčastnila','Zúčastnil')] ses alespoň 20 válek"
 become_conqueror_decision_war_participation_kingdom: "[Select_CString(GetPlayer.IsFemale,'Zúčastnila','Zúčastnil')] ses alespoň 5 válek proti [Concept('kings','králům')|E] nebo [Concept('emperors','císařům')|E]"
 become_conqueror_decision_two_commander_traits: "Máš alespoň 2 [Concept('commander_traits','velitelské rysy')|E]"
 become_conqueror_decision_enough_troops: "Máš alespoň 4000 [Concept('soldiers','vojáků')|E]"
 become_conqueror_decision_enough_battle_kills: "[Select_CString(GetPlayer.IsFemale,'Zabila','Zabil')] jsi alespoň 12 [Concept('characters','postav')|E]"
 become_conqueror_decision_enough_war_contracts: "[Select_CString(GetPlayer.IsFemale,'Dokončila','Dokončil')] jsi alespoň 20 [Concept('task_contracts','zakázek')|E] typu $laamp_raid_contract_contract$ nebo $laamp_join_war_contract_contract$"
 become_conqueror_decision_enough_high_level_knights: "Máš alespoň 6 rytířů s [Concept('prowess','udatností')|E] 18 nebo vyšší"
 become_conqueror_decision_enough_mediocre_knights: "Máš alespoň 12 rytířů s [Concept('prowess','udatností')|E] 12 nebo vyšší"
 become_conqueror_decision_war: "Vyhlásíte válku proti [conq_war_target.Custom('CZ_LandedName_D')]"
 ep3_laamp_decision_event.1110.t: "$become_conqueror_decision$"
 ep3_laamp_decision_event.1110.desc.has_kill: "Stále si pamatuji smrt [first_kill.Custom('CZ_TitledFirstName_G')], prvního člověka, kterého si pamatuji, že zemřel na můj rozmar. [Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] jsem už tehdy chuť na to? Rozhořel se ten... #EMP hlad#! uvnitř mě, ta touha po více, právě v ten okamžik, nebo jen hořela natolik, aby byl konečně spatřen?\n\nMnoho jich od té doby přibylo k [Select_CString(first_kill.IsFemale,'ní','němu')]."
 ep3_laamp_decision_event.1110.desc.hasnt_kill: "To je opravdu zvláštní myšlenka. Nemám silnou vzpomínku na prvního člověka, který byl [Select_CString(ROOT.Char.IsFemale,'zabita','zabit')] na můj rozkaz, natož rukou mou. Člověk by si myslel, že by to u [Select_CString(ROOT.Char.IsFemale,'ženy','muže')] zůstalo, ale mě nikdy moc nezajímaly tváře nebo jména mrtvých.\n\nNemohu spočítat, kolik jsem jich [Select_CString(ROOT.Char.IsFemale,'poslala','poslal')] na hroby, natož přesně #EMP koho#!."
 ep3_laamp_decision_event.1110.desc.outro: "Pro většinu by taková řež byla dost — ale ne pro mě.\n\nNemohu si pomoci a usmívám se, když se dívám k obzoru. Ne pro ty, kteří zemřeli. Usmívám se pro ty, kteří teprve přijdou."
 ep3_laamp_decision_event.1110.desc: "Před lety jsem v bitvě [Select_CString(ROOT.Char.IsFemale,'zabila','zabil')] [first_kill.Custom('CZ_Name_A')]. Ta vzpomínka mě od té doby provází. Hruď rozťatá mou ranou, oči doširoka rozevřené v nevíře, krev kapající na zem, aby ji zúrodnila.\n\nOd té doby [Select_CString(first_kill.IsFemale,'ji','ho')] následovalo mnoho dalších. Většině by taková řež stačila. Ale mně ne.\n\nKdyž hledím k obzoru, nemůžu se ubránit úsměvu. Ne kvůli těm, kdo zemřeli. Usmívám se kvůli těm, kdo teprve zemřou."
 ep3_laamp_decision_event.1110.a: "Dobýt svět na koni je snadné..."
 ep3_laamp_decision_event.1110.a.flavor: "...ale sesednout a vládnout je těžké."
 ep3_laamp_decision_event.1110.a.desc: "$become_conqueror_decision_reward$"
 bandit_king_decision: "Naverbovat vyvržence"
 bandit_king_decision_desc: "Stanu se pánem synů a dcer stok. Armáda nejhanebnějších darebáků vázaných na mou věc a rozmary, aby pustošili slabé i silné."
 bandit_king_decision_reward: "#Bold Pokaždé#! kdy dokončíte [Concept('criminal_task_contract','zločinnou zakázku')|E], získáte jedinečné [Concept('men_at_arms','ozbrojence')|E].\n#weak Počet závisí na vašem postupu v [GetTrait('gallowsbait').GetName(GetNullCharacter)] [Concept('trait_level_track','cestě rysu')|E], od 100 do 1000 mužů."
 bandit_king_decision_tooltip: "Spočítej zbabělce, spočítej zkorumpované, kteří bojovali o přežití"
 bandit_king_decision_confirm: "Shromážděte se ke mně, bídáci země!"
 ep3_gallowsbait_army: "Špína šibenice"
 ep3_bandits_army: "Ubožáci a ztracenci"
 ep3_poachers_army: "Veselí muži"
 maa_bandits: "Bandité"
 maa_bandits_flavor: "#F Špína země, tito muži zřekli se zákonnosti ve prospěch zločinu."
 maa_poachers: "Pytláci"
 maa_poachers_flavor: "$maa_bandits_flavor$"
 maa_thieves: "Lupiči"
 maa_thieves_flavor: "$maa_bandits_flavor$"
 maa_marauders: "Pustošitelé"
 maa_marauders_flavor: "$maa_bandits_flavor$"
 bandit_king_maa_spawn_effect_desc: "Získáš malé vojsko složené z jednotek $maa_marauders$ a $maa_poachers$, nebo $maa_thieves$ a $maa_bandits$"
 bandit_king_modifier: "Dobrodinec banditů"
 bandit_king_modifier_desc: "Tato postava verbuje stoupence z nižší vrstvy společnosti při každé příležitosti.\n\n#Bold Pokaždé#! #weak kdy tato postava dokončí [Concept('task_contract','zakázku')|E] [Concept('intrigue','pletichářství')|E], získá jedinečné [Concept('men_at_arms','ozbrojence')|E].\nPočet závisí na postupu v [GetTrait('gallowsbait').GetName(GetNullCharacter)] [Concept('trait_level_track','cestě rysu')|E].#!"
 ep3_laamp_decision_event.1120.t: "$bandit_king_decision$"
 ep3_laamp_decision_event.1120.desc: "Když ti srdce probodne zrezivělý dýka, nezajímá tě rodokmen jejího nositele. Rytíři v lesklých zbrojích s drahými zbraněmi dovezenými přes celé Stvoření? Umírají stejně jako chudí oblečení v hadrech, držící naostřené větve utržené z nejbližšího stromu.\n\nPáni a paní s jejich vychloubačnými tituly si mohou ponechat své předražené žoldnéře — a obávat se zrady pokaždé, když kolem projde někdo s větší peněženkou.\n\nPoslyšte mě a shromážděte se, vy, kdo si nemohli vybrat svou cestu v životě, neboť násilí a krev vás poznamenaly od narození!"
 ep3_laamp_decision_event.1120.a: "$bandit_king_decision_confirm$"
 ep3_laamp_decision_event.1120.a.flavor: "Jen je musíme správně obléci, aby dnes večer nezmrzli. A možná vyměnit ty hole za pořádné kopí."
 start_city_construction_decision: "Založit sídlo"
 start_city_construction_decision_desc: "Během mých cest jsem [Select_CString(ROOT.Char.IsFemale,'nashromáždila','nashromáždil')] značné bohatství. Tyto úrodné, nedotčené pozemky vypadají jako dobré místo k investici a sklizni zisků v následujících letech."
 start_city_construction_decision_tooltip: "Udeř do země!"
 start_city_construction_decision_confirm: "Vezměte lopaty!"
 start_city_construction_decision_empty_holding: "Musíš být v [Concept('barony','baronství')|E], které nemá žádnou državu"
 start_city_construction_decision_more_rewards: "Splnění více volitelných požadavků nabídne další možnosti při zakládání města, včetně výstavby unikátních [Concept('buildings','budov')|E]\n\n#weak Po tomto budete moci založit více měst.\nPo dokončení budete mít šanci město si násilně přivlastnit.\n\nJinak bude město každý rok vyplácet dividendy. Výše závisí na součtu úrovní [Concept('building','budov')|E] v této [Concept('barony','baronství')|E] a na [Concept('development','rozvoji')|E] hrabství, od [gold_i]25 až do [gold_i]200. Tato částka bude po každém roce po dokončení stavby postupně klesat.#!"
 ep3_laamp_decision_event.1130.t: "Město [city_location.GetNameNoTooltip] — Začátek"
 ep3_laamp_decision_event.1130.desc: "Země pod mýma nohama je nedotčená lidskýma rukama. Zatím.\n\nAle už vidím, kde bude stát radnice. Kde obchodníci zváží své zboží a zaplatí daně pod bdělým okem stráží. Slyším zvony zvonící ve věži.\n\nZásoby jsou shromážděny, moji stoupenci netrpělivě čekají. Stačí mé slovo."
 ep3_laamp_decision_event.1130.a: "Začněme!"
 ep3_laamp_decision_event.1130.a.desc: "$start_city_construction_decision_more_rewards$"
 ep3_laamp_decision_event.1130.b: "[Select_CString(ROOT.Char.IsFemale,'Rozmyslela','Rozmyslel')] jsem si to, omlouvám se."
 ep3_laamp_decision_event.1130.b.desc: "Opouštíte výstavbu. Část utraceného zlata bude vrácena."
 ep3_laamp_decision_event.1131.t: "Město [city_location.GetNameNoTooltip] — Konec"
 ep3_laamp_decision_event.1131.desc: "Před lety jsem [Select_CString(ROOT.Char.IsFemale,'stála','stál')] zde, když to bylo jen místo uprostřed divočiny. Teď je to hrdé město. Jak úžasné! Ale zajímá mě, zda je [city_location.GetCounty.GetTitle.GetHolder.GetName] tím správným, kdo zajistí budoucnost mého nového sídla.\n\nO desetiletí později se budou vyprávět příběhy o tom, jak jsem [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')] do [CZProvNameNoTooltip(city_location,'G')], [Select_CString(ROOT.Char.IsFemale,'přinesla','přinesl')] jeho potenciál a..."
 ep3_laamp_decision_event.1131.a: "...[Select_CString(ROOT.Char.IsFemale,'dobyla','dobyl')] jsem ho!"
 ep3_laamp_decision_event.1131.b: "...[Select_CString(ROOT.Char.IsFemale,'odešla','odešel')] jsem, abych jinde dosáhl víc."
 ep3_laamp_decision_event.1131.b.desc: "Každý rok bude město vyplácet dividendy. Výše závisí na součtu úrovní [Concept('building','budov')|E] [CZPrepV(city_location.GetNameNoTooltip)] [CZProvName(city_location,'L')] a na [Concept('development','rozvoji')|E] [city_location.GetCounty.GetName]."
 ep3_laamp_decision_event.1133.t: "Město [city_location.GetName] — Síla vody"
 ep3_laamp_decision_event.1133.desc: "Nedaleko líně teče potok. S náležitými znalostmi, jako jsou ty mé, a pořádnou prací, jako je ta mých družiníků, ho můžeme odvést blíž k místu [city_location.GetName].\n\nPotom by stavba vodního mlýna měla být hračka. Může to být i větší mlýn, pokud zbydou prostředky."
 ep3_laamp_decision_event.1133.a: "Nádherné!"
 ep3_laamp_decision_event.1133.b: "Investuji do toho."
 ep3_laamp_decision_event.1133.c: "Nemohu si to dovolit."
 ep3_laamp_decision_event.1134.t: "Město [city_location.GetNameNoTooltip] — Osadníci"
 ep3_laamp_decision_event.1134.desc: "Stavba pokročila dobře, kostra města je už viditelná. Máme dost stavitelů na pokračování ve výstavbě budov, ale nemáme dost lidí, kteří by zaplnili každou budovu, každé řemeslo, které by bylo potřeba.\n\nNaštěstí mohu využít svou autoritu k přilákání více osadníků. Samozřejmě se skromnou zlatou a stříbrnou pobídkou."
 ep3_laamp_decision_event.1134.a: "Skvělé!"
 ep3_laamp_decision_event.1134.b: "Přinesu svou peněženku."
 ep3_laamp_decision_event.1134.c: "Možná ne."
 ep3_laamp_decision_event.1135.t: "Město [city_location.GetNameNoTooltip] — Odlesnění"
 ep3_laamp_decision_event.1135.desc: "Lidé, kteří tu budou žít, budou potřebovat pořádné zásobování potravinami. Půda původně vyměřená k obdělávání by měla na začátek stačit, ale další pole zajistí blahobyt na desítky let dopředu.\n\nNaskýtá se příležitost – lesy, které patří [city_location.GetCounty.GetTitle.GetHolder.Custom('CZ_Name_D')], sousedí s mými poli a čekají, až se z nich stane orná půda. [Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] jsem [Select_CString(ROOT.Char.IsFemale,'prozíravá','prozíravý')] a [Select_CString(ROOT.Char.IsFemale,'zajistila','zajistil')] si s [Select_CString(city_location.GetCounty.GetTitle.GetHolder.IsFemale,'ní','ním')] dobré vztahy, takže koupit pár lánů by neměl být problém. Pak už jen stačí stromy vypálit a vykopat pařezy a objeví se úrodná půda."
 ep3_laamp_decision_event.1135.a: "Vezměte pochodně!"
 ep3_laamp_decision_event.1135.b: "Shromážděte všechny, žádný strom nesmí zůstat!"
 ep3_laamp_decision_event.1135.c: "Po rozmyšlení ne."
 ep3_laamp_decision_event.1136.t: "Město [city_location.GetNameNoTooltip] — Obchodní spojení"
 ep3_laamp_decision_event.1136.desc: "Využívání toho, co venkov nabízí, ochutnávání nejlepších chutí dalekých zemí, produkce jedinečného zboží a služeb — to je přirozený cyklus každého prosperujícího města.\n\nMůžeme čekat a nechat obchodní vazby rozvinout se přirozeně v čase — nebo jednat předběžně a zajistit, aby první obchodní vůz projel městskou branou, když se položí poslední cihla do zdí.\n\nZnám pár obchodníků, kteří to mohou zařídit. Teď po mně žádají zlato — drobnost ve srovnání s bohatstvím, které sem brzy poteče!"
 ep3_laamp_decision_event.1136.a: "Úžasné!"
 ep3_laamp_decision_event.1136.b: "Máme dohodu."
 ep3_laamp_decision_event.1136.c: "Rozhodně ne."
 ep3_laamp_decision_event.1137.t: "Město [city_location.GetName] — Zbožné vazby"
 ep3_laamp_decision_event.1137.desc: "Město, které má přežít desetiletí, ba i staletí, potřebuje silné občany, kteří věří v toto město i v sebe. A pastýře, kteří je v chvílích slabosti povedou. [city_location.GetName|U] potřebuje víc zbožných [CZAdherentPl_G(ROOT.Char.GetFaith)|l].\n\nLidé mě vnímají jako [Select_CString(ROOT.Char.IsFemale,'zbožnou ženu','zbožného muže')] s nemalým jměním. Se správným množstvím zlata a modliteb od ochotných kazatelů tu budu mít své stádo i náboženský aparát, který ho pevně udrží v milosti, již uděluje [ROOT.Char.GetFaith.HighGodName]."
 ep3_laamp_decision_event.1137.a: "Budiž [ROOT.Char.GetFaith.HighGodName] požehnán!"
 ep3_laamp_decision_event.1137.b: "Přispěji na tento účel."
 ep3_laamp_decision_event.1137.c: "Bohužel ne."
 ep3_laamp_decision_event.1140.toast: "[city_location.GetName] vyplácí dividendu"
 renounce_governorship_decision: "Rezignovat na pozici guvernéra"
 renounce_ministership_decision: "Vzdat se ministerské funkce"
 renounce_governorship_decision_desc: "Ustupte do svého rodinného [Concept('estate','statku')|E] a soustřeďte bohatství a vliv stranou od povinností [Concept('governorship','guvernérství')|E].\n\nZahnívejte ve stínech, vraťte se jako hořící fénix."
 renounce_governorship_decision_desc_japan: "Vzdát se povinností [Concept('governorship','guvernérství')|E] a připojit se k císařskému dvoru za účelem hledání nových příležitostí.\n\nDovolím rivalům, aby si mysleli, že hniji ve stínech, zatímco se ve skutečnosti vrátím jako plamenný fénix, abych je [Select_CString(ROOT.Char.IsFemale,'srazila','srazil')] k zemi!"
 renounce_governorship_decision_desc_merit: "Stáhnout se na rodové [Concept('estate','statky')|E], abys [Select_CString(ROOT.Char.IsFemale,'získala','získal')] vědomosti a dovednosti potřebné k úspěšnému složení další úrovně [Concept('examinations','zkoušek')|E]."
