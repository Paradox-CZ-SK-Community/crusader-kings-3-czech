 ep3_decisions_event.6001.desc.spouse_diff_culture: "„I jako [spouse.GetCulture.GetName] vím, že tě tito lidé obdivují. Vidí v tobě svého hrdinu. Nezklam je.“"
 ep3_decisions_event.6001.desc.no_spouse: "[liege.GetCulture.GetName]? Vládce lidu [ROOT.Char.GetCulture.GetName]? Sama ta představa mě znechucuje. A vím, že nejsem [Select_CString(ROOT.Char.IsFemale,'jediná','jediný')].\n\n"
