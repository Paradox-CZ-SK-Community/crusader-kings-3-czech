 ep3_decisions_event.2001.opening: "Zdravím, slavný [ROOT.Char.GetTitleAsNameNoTooltip],"
 ep3_decisions_event.2001.desc: "[Select_CString(ROOT.Char.IsFemale,'Přijela','Přijel')] jsem do [confirmation_liege.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')], abych [Select_CString(ROOT.Char.IsFemale,'žádala','žádal')] o potvrzení svého setrvání v úřadu [confirmation_vassal.GetTitleAsNameNoTooltip] [confirmation_vassal.GetPrimaryTitle.Custom('CZ_LandedName_G')].\n\nSamozřejmě čekám na první možné setkání."
 ep3_decisions_event.2001.a: "Zorganizujte ceremonii okamžitě."
 ep3_decisions_event.2001.a.tt.court: "Přijímáte [confirmation_vassal.GetTitledFirstName] ve svém [Concept('royal_court','královském dvoře')|E]"
 ep3_decisions_event.2001.a.tt: "Přijímáte [confirmation_vassal.GetTitledFirstName]"
 ep3_decisions_event.2001.b: "Mám příliš mnoho práce, abych #EMP [Select_CString(confirmation_vassal.IsFemale,'ji','ho')]#! [Select_CString(ROOT.Char.IsFemale,'přijala','přijal')]."
 ep3_decisions_event.2001.b.tt: "Posíláte pryč [confirmation_vassal.GetTitledFirstName]"
 ep3_decisions_event.2002.opening: "[confirmation_liege.Custom2('AppropriateGreeting', ROOT.Char )]"
 ep3_decisions_event.2002.desc: "Obávám se, že jsem příliš zaneprázdněn, abych v tuto chvíli [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] konat potvrzovací ceremonii. Mnoho povinností soupeří o můj čas, jak jistě chápete.\n\nŠťastnou cestu zpět do [confirmation_vassal.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]."
 ep3_decisions_event.2002.a: "#EMP Cože?!#!"
 ep3_decisions_event.2010.t: "$admin_confirmation_event_header$ Služebník říše"
 ep3_decisions_event.2010.desc: "Mí palácní úředníci se valí do [ROOT.Char.Custom('GetThroneRoom')], kde nekonečná řada císařských jmenovaných čeká.\n\nNejpozoruhodnějším z nich je [confirmation_vassal.GetTitledFirstName] [confirmation_vassal.GetDynastyHouseName], [Select_CString(confirmation_vassal.IsFemale,'která sem přicestovala','který sem přicestoval')] [CZPrepZ(confirmation_vassal.GetCapitalLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(confirmation_vassal.GetCapitalLocation,'G')]. [Select_CString(confirmation_vassal.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', confirmation_vassal)] spravuje [confirmation_vassal.GetPrimaryTitle.Custom('CZ_LandedName_A')]:"
 ep3_decisions_event.2010.desc_theme_civilian: "rušné centrum výroby a obchodu,"
 ep3_decisions_event.2010.desc_theme_military: "oblast ovládaná hlučnými ubytovnami a cvičícími jednotkami,"
 ep3_decisions_event.2010.desc_theme_frontier: "drsná pohraniční oblast a jedna z velkých opor říše,"
 ep3_decisions_event.2010.desc_theme_imperial: "perla říše obdařená mnoha vzácnými privilegii,"
 ep3_decisions_event.2010.desc_theme_naval: "pobřežní oblast loděnic a přístavů,"
 ep3_decisions_event.2010.desc_theme_small: "malá enkláva menšího významu,"
 ep3_decisions_event.2010.desc_theme_big: "rozlehlá jurisdikce značného významu,"
 ep3_decisions_event.2010.desc_theme_balanced: "středně velká oblast s různorodou hodnotou pro říši,"
 ep3_decisions_event.2010.desc_cool_foreigners: "domov důvěryhodných, [confirmation_vassal.GetCapitalLocation.GetCounty.GetCulture.GetEthos.GetNameNoTooltip|l] [confirmation_vassal.GetCapitalLocation.GetCounty.GetCulture.GetCollectiveNoun]"
 ep3_decisions_event.2010.desc_weird_foreigners: "domov podivných, [confirmation_vassal.GetCapitalLocation.GetCounty.GetCulture.GetEthos.GetNameNoTooltip|l] [confirmation_vassal.GetCapitalLocation.GetCounty.GetCulture.GetCollectiveNoun]"
 ep3_decisions_event.2010.desc_same_culture: "domov provinčních [ROOT.Char.GetCulture.GetCollectiveNoun]"
 ep3_decisions_event.2010.desc_state_faith: "a stoupenci [ROOT.Char.GetPrimaryTitle.GetAdjective] [confirmation_vassal.GetCapitalLocation.GetCounty.GetFaith.GetName]"
 ep3_decisions_event.2010.desc_heretic_faith: "— špinaví [confirmation_vassal.GetCapitalLocation.GetCounty.GetFaith.GetAdjective] pohané!"
 ep3_decisions_event.2010.desc_accepted_faith: "— a [ROOT.Char.GetFaith.HouseOfWorshipPlural] jejich [confirmation_vassal.GetCapitalLocation.GetCounty.GetFaith.GetAdjective] víry."
 ep3_decisions_event.2010.desc_my_faith: "— a několik pěkných [ROOT.Char.GetFaith.HouseOfWorshipPlural] pravé [ROOT.Char.GetFaith.GetAdjective] víry."
 ep3_decisions_event.2010.desc_hate: "\n\nI když hledím jen na zátylek [confirmation_vassal.Custom('CZ_TitledFirstNameNoTooltip_G')], cítím [Select_CString(confirmation_vassal.IsFemale,'její','jeho')] spalující pohrdání. [Select_CString(confirmation_vassal.IsFemale,'Ta žena','Ten muž')] [second.Custom('quirk_neg_adverb')] mumlá přísahy... a přitom sní o tom, jak mě svým úředním žezlem utluče k smrti."
 ep3_decisions_event.2010.desc_love: "\n\n[second.Custom('quirk_pos_adverb')|U] podstupuje [confirmation_vassal.GetTitledFirstNameNoTooltip] obřady. Uchopí své úřední žezlo a [second.Custom('quirk_pos_pp')] přísahá věrnou službu."
 ep3_decisions_event.2010.desc_decrepit: "\n\n[Select_CString(confirmation_vassal.IsFemale,'Její','Jeho')] léta jako mlýnský kámen na [Select_CString(confirmation_vassal.IsFemale,'jejích','jeho')] shrbených zádech, [confirmation_vassal.GetTitledFirstNameNoTooltip] se složitě zvedá z poklony. [Select_CString(confirmation_vassal.IsFemale,'Ošuntělá stařena','Ošuntělý stařec')] má bohaté zkušenosti, z nichž může čerpat... a snad [Select_CString(confirmation_vassal.IsFemale,'jí','mu')] zbývá ještě pár dobrých let, aby je [Select_CString(confirmation_vassal.IsFemale,'uplatnila','uplatnil')]."
 ep3_decisions_event.2010.desc_young: "\n\nSotva čerstvěji vypadající mladík, [confirmation_vassal.GetTitledFirstNameNoTooltip] odříkává obřady s [Select_CString(confirmation_vassal.IsFemale,'jejím','jeho')] žezlem úřadu pevně sevřeným v měkkých rukou. U tohoto je ještě mnoho, co musí dokázat..."
 ep3_decisions_event.2010.desc_skilled: "\n\n[Select_CString(confirmation_vassal.IsFemale,'Žena, která přede mnou poníženě klečí, vládne','Muž, který přede mnou poníženě klečí, vládne')] [confirmation_vassal.Custom('ComplimentAdjective')] rukou. Ať zastává jakoukoli politiku a ať má v srdci cokoli: [confirmation_vassal.GetTitledFirstNameNoTooltip] je chloubou [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]."
 ep3_decisions_event.2010.desc_incompetent: "\n\nPodle všech zpráv teď potvrzuji v úřadu někoho, kdo spravuje špatně, [second.Custom('quirk_neg_adverb')]. Ale odmítnout [confirmation_vassal.Custom('CZ_TitledFirstNameNoTooltip_A')], zatímco přísahá dokonalou službu, kterou nedokáže poskytnout, by bylo k ničemu..."
 ep3_decisions_event.2010.desc_generic_outro: "\n\n[confirmation_vassal.GetTitledFirstNameNoTooltip|U] se hluboce ukloní, převezme symbolické žezlo moci a přísahá, že bude věrně sloužit svému [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_D')]."
 ep3_decisions_event.2010.a: "„Spravuj dobře, [confirmation_vassal.GetTitleAsNameNoTooltip].“"
 ep3_decisions_event.2011.desc: "V trůnním sále ([confirmation_liege.Custom('GetThroneRoom')|l]) hlavního paláce [confirmation_liege.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_G')] sedí v plné nádheře [confirmation_liege.GetTitledFirstNameRegnal] – pozemský místodržící, jehož dosadil[Select_CString(EqualTo_string(confirmation_liege.GetFaith.HighGodHerHis,Localize('CHARACTER_HERHIS_HER')),'a','')] [confirmation_liege.GetFaith.HighGodName].\n\n"
 ep3_decisions_event.2011.desc_child: "Čekat mezi ostatními vrchními úředníky, zatímco pupkatý mládenec na [Select_CString(confirmation_liege.IsFemale,'jejím','jeho')] trůně kňučí a vrtí se, je... poněkud zvláštní."
 ep3_decisions_event.2011.desc_heretic: "Ten pohan, který vládne [confirmation_liege.GetPrimaryTitle.GetTierAsName] [CZAdherentPl_G(confirmation_liege.GetCapitalLocation.GetCounty.GetFaith)|l]. I zde, mezi [confirmation_liege.GetFaith.PriestNeuterPlural] a preláty dvora, panuje napětí."
 ep3_decisions_event.2011.desc_war: "Když my úředníci klečíme a obřad začíná, vojenské důstojníky netrpělivě odfrknou. Jejich válka se zdá mít malý ohled na naše pocty."
 ep3_decisions_event.2011.desc_poorly_run: "A v chaosu. Palácová stvůrstva se chichotají, zatímco nás úředníky strkají do pozic, a málo rituálních úkonů se provádí."
 ep3_decisions_event.2011.desc_well_run: "Nekonečná řada úředníků čeká; všichni v úžasu, všichni dychtiví pokleknout před naším suverénem."
 ep3_decisions_event.2011.desc_gender: "[Select_CString(confirmation_liege.IsFemale,'Žena','Muž')] na trůnu. Ještě že je nám, přicházejícím úředníkům, zakázáno na panovníka pohlédnout!"
 ep3_decisions_event.2011.desc_typical_palace: "Jsem [Select_CString(ROOT.Char.IsFemale,'vedena','veden')], abych se [Select_CString(ROOT.Char.IsFemale,'připojila','připojil')] k řadě vrchních úředníků. S výkřiky všech, hudebníků a heroldů, naše velké obřady začínají."
 ep3_decisions_event.2011.desc_hate: "[confirmation_liege.GetTitleAsNameNoTooltip|U] ke mně promlouvá [second.Custom('quirk_neg_adverb')]; zahrnuje mou poníženě skloněnou hlavu pohrdáním, zatímco se nade mnou houpají mé insignie.\n\n"
 ep3_decisions_event.2011.desc_love: "Přesto hlas [confirmation_liege.Custom('CZ_TitleAsNameNoTooltip_G')] zní vřele a [second.Custom('quirk_pos_adjective')], když ke mně promlouvá a předává mi insignie.\n\n"
 ep3_decisions_event.2011.desc_meh: "[confirmation_liege.GetTitleAsNameNoTooltip] osloví jednotlivé jmenované postupně, udělujíc jim insignie a přijímajíc přísahy, až se dostane i ke mně.\n\n"
 ep3_decisions_event.2011.desc_theme_civilian: "„Mír [confirmation_liege.GetFaith.PositiveAfterLife] možná ještě přetrvá [CZPrepV(confirmation_vassal.GetPrimaryTitle.GetNameNoTierNoTooltip)] [confirmation_vassal.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_L')],“ říká [confirmation_liege.GetFirstName], „je to zahrada, o kterou je třeba pečovat s laskavostí.“"
 ep3_decisions_event.2011.desc_theme_military: "„Máš nabrousit meč [confirmation_vassal.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')],“ říká [confirmation_liege.GetFirstName], „a má být užíván pouze spravedlivými.“"
 ep3_decisions_event.2011.desc_theme_frontier: "„Spi málo,“ přikazuje, „a drž své pozice. [confirmation_vassal.GetPrimaryTitle.GetNameNoTier|U] je místem, kde všechno [confirmation_liege.GetPrimaryTitle.Custom('CZ_Adjective_ee')|l] žije, nebo umírá.“"
 ep3_decisions_event.2011.desc_theme_imperial: "„[CZPrepV(confirmation_vassal.GetPrimaryTitle.GetNameNoTierNoTooltip)|U] [confirmation_vassal.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_L')],“ říká, „budeš obrazem samotného [confirmation_liege.GetPrimaryTitle.GetTierAsNameNoTooltip|l]. Jen málokdo – snad kromě ničemů – si smí dovolit takovou volnost.“"
 ep3_decisions_event.2011.desc_theme_naval: "„V soli na březích [confirmation_vassal.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')],“ říká, „ucítíš krev tohoto [confirmation_liege.GetPrimaryTitle.GetTierAsNameNoTooltip|l] a uvidíš slzy jeho vdov.“"
 ep3_decisions_event.2011.desc_theme_small: "„Skromný úřad, [confirmation_vassal.GetPrimaryTitle.GetNameNoTier],“ říká, „ale důstojný.“"
 ep3_decisions_event.2011.desc_theme_big: "„Tak rozlehlé panství jako [confirmation_vassal.GetPrimaryTitle.GetNameNoTier],“ říká mezi formalitami, „je mocná šelma, kterou zkrotí jen ten správný pán...“"
 ep3_decisions_event.2011.desc_theme_balanced: "„Tvůj úřad ti uděluje [confirmation_liege.GetFaith.HighGodName] a tvůj [confirmation_liege.GetTitleAsNameNoTooltip|l],“ říká. „Pamatuj na to a spravuj [confirmation_vassal.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_A')] dobře.“"
 ep3_decisions_event.2011.desc_outro: "\n\nVyslovím všechny řádné odpovědi. A po hlubokém úklonu před svým panovníkem konečně uchopím žezlo provinční moci."
 ep3_decisions_event.2011.a: "Buď pozdraven, [confirmation_liege.GetTitleAsNameNoTooltip]."
 ep3_decisions_event.2080.t: "$admin_confirmation_event_header$ Zneplatněno"
 ep3_decisions_event.2080.desc.court: "Teď, když jsem [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')], cesta už není nutná..."
 ep3_decisions_event.2080.desc.imprisoned_me: "$ep3_decisions_event.2080_shared_intro$ [ROOT.Char.GetImprisonedBy.GetTitledFirstName] mě [Select_CString(ROOT.Char.GetImprisonedBy.IsFemale,'uvěznila','uvěznil')]."
 ep3_decisions_event.2080.desc.imprisoned: "$ep3_decisions_event.2080_shared_intro$ Byl jsem zajat [ROOT.Char.GetImprisonedBy.GetTitledFirstName]."
