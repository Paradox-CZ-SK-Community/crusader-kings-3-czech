 ep3_decisions_event.5001.t: "Rytíř $knight_culture_player_no_tooltip$ [ROOT.Char.CustomFixedRandom('GetKnightErrantAnimal')|U]"
 ep3_decisions_event.5001.desc.spouse: "„Nejušlechtilejší ze všech,“ ozve se hlas [Select_CString(adoring_fan.IsFemale,'mé drahé','mého drahého')] [adoring_fan.Custom('CZ_FirstNameNoTooltip_G')] a hned nato mi na rameno dopadne něžný polibek. „[Select_CString(adoring_fan.IsFemale,'Hledala','Hledal')] jsem tě všude.“\n\n„V táboře o tobě vyprávějí nesmyslné příběhy,“ nakloní se a šeptá,"
 ep3_decisions_event.5001.desc.intro: "„Nejušlechtilejší ze všech,“ vyleká mě hlas [adoring_fan.Custom('CZ_FirstNameNoTooltip_G')]. „[Select_CString(adoring_fan.IsFemale,'Hledala','Hledal')] jsem tě všude.“\n\n„V táboře o tobě vyprávějí nesmyslné příběhy,“ uchechtne se,"
 ep3_decisions_event.5001.desc: "„prý jsi kdysi [Select_CString(ROOT.Char.IsFemale,'přešla','přešel')] most z mečů, [Select_CString(ROOT.Char.IsFemale,'vstoupila','vstoupil')] do kouzelného lesa a [Select_CString(ROOT.Char.IsFemale,'zachránila','zachránil')] tam [Select_CString(dummy_opposite_gender.IsFemale,'krásnou pannu','krásného mladíka')]... a že ti zázračné zvíře ([ROOT.Char.CustomFixedRandom('GetKnightErrantAnimal')|l]) darovalo svou kouzelnou srst.“\n\nPokyne služebníkovi, aby přinesl brnění vykládané perlami.\n\n„Dar od všech, kterým jsi [Select_CString(ROOT.Char.IsFemale,'pomohla','pomohl')].“"
 ep3_decisions_event.5001.a: "„A přesto jsem ještě nepomohl dost.“"
 ep3_decisions_event.5001.b: "„Mohu nabídnout #EMP nesčetné#! druhy pomoci.“"
