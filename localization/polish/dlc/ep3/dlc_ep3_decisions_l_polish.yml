 ascendant_byz_reclaimant_modifier: "Vzestupný byzantský znovudobyvatel"
 ascendant_byz_reclaimant_modifier_desc: "Naděje těch, kdo chtějí vidět obnovenou Byzanci, spočívají na tomto rozhodném vládci."
 holds_byz_emp_tt: "Držíte [GetTitleByKey('e_byzantium').GetName]"
