 split_roman_empire_decision: "Rozdělit říši"
 split_roman_empire_decision_desc: "Existovalo mnoho důvodů, proč byla tak rozlehlá říše rozdělena v letech našich předků — a tyto důvody jsou relevantní i dnes. Moc musí být znovu rozdělena."
 split_roman_empire_decision_selection_tooltip: "[GetPlayer.GetPrimaryTitle.GetName] bude rozdělena na dvě části, čímž vznikne [Concept('eastern_roman_empire','východořímská říše')|E]"
 split_roman_empire_decision_confirm: "Ať se tak stane."
 form_eastern_roman_empire_tt: "#HIGH [new_holder.GetName]#!:\n$EFFECT_LIST_BULLET$Získává [Concept('eastern_roman_empire','východořímskou říši')|E]\n$EFFECT_LIST_BULLET$[GetTitleByKey( 'c_byzantion' ).GetBaseNameNoTier] se stane jejich novým [Concept('realm_capital','hlavním sídlem panství')|E]"
 ending_of_restore_rome_trials_tt: "Účinky původního obnovení Říma budou zrušeny:\n$EFFECT_LIST_BULLET$Všechny [Concept('peasant_factions','selské frakce')|E] ve tvém [Concept('realm','panství')|E] na tebe znovu mohou cílit\n$EFFECT_LIST_BULLET$Méně [Concept('wars','válek')|E] od ostatních královských [Concept('titles','titulů')|E]\n$EFFECT_LIST_BULLET$Nižší četnost [Concept('epidemic','epidemií')|E]\n$EFFECT_LIST_BULLET$Časová osa mongolské invaze se vrátí do normálu#!"
 seasoned_visitor_decision: "Cesty [ROOT.Char.Custom('CZ_FullNameNoTooltip_G')]"
 seasoned_visitor_decision_desc: "[Select_CString(ROOT.Char.IsFemale,'Cestovala','Cestoval')] jsem daleko a široko, [Select_CString(ROOT.Char.IsFemale,'navštívila','navštívil')] místa podivná a bizarní. Moudrost, kterou jsem [Select_CString(ROOT.Char.IsFemale,'nasbírala','nasbíral')], je nepřekonatelná, poklad pro každou zvědavou a učenou duši."
 seasoned_visitor_decision_tooltip: "Ohlédněte se za svými cestami"
 seasoned_visitor_decision_reward_desc: "Odemkneš nové [Concept('perks','talenty')|E] [Concept('lifestyle','životního stylu')|E] #EMP nebo#! vytvoříš knihu ([Concept('artifact','artefakt')|E]), která budoucím držitelům zvýší zisk [Concept('lifestyle_experience','zkušeností životního stylu')|E]\n#i Každých #V 12#! navštívených [Concept('points_of_interest','zajímavých míst')|E], až do #V 60#!, zvýší odměny#!"
