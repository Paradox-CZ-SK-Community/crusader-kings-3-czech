 ep3_decisions_event.3000.desc: "Vynikající práce při obnově zemí [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] do jejich dávné slávy! Jsem náležitě ohromen.\n\n[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|U] již nebude pošpinit pověst impéria."
