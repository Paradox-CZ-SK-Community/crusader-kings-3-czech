 consolidate_rule_decision_desc: "Požádej svou [Concept('head_of_faith','hlavu víry')|E], aby znovu potvrdila tvůj nárok na trůn. Koneckonců jsi [Select_CString(ROOT.Char.IsFemale,'její největší patronkou','jejím největším patronem')]."
