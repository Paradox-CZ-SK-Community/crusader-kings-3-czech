 expunge_latin_dominion_decision_desc: "Řezníci z Říma, démoni s latinským křížem, uchvátili císařskou korunu ohněm a krví. Teď se #EMP odváží#! nárokovat si trvalá práva nad našimi dávnými zeměmi.\n\nKrálovství po království — zbavme těchto sprostých pretendentů jejich práv! Vyžeňme je!"
