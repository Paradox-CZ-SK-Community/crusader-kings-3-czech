 ep3_decisions_event.6001.desc.intro: "Chladný vánek provází výhled z tábora. Okolní krajina – [county.Custom('TerrainTypeCountyScope')] – se zdá nekonečná. Zde patřím, zde patří můj lid. Zhluboka se nadechnu.\n\n"
