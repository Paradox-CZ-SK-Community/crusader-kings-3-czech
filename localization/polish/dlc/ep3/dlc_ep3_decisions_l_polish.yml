 ep3_decisions_event.5021.b: ""
 ep3_decisions_event.5021.c: ""
 ep3_decisions_event.5021.c.tt: "Státní víra nezměněna"
 embrace_heresy_decision_confirm: "Přijmout herezi"
 push_heresy_as_state_faith_confirm: "Vyvíjet tlak na [ROOT.Char.GetTopLiege.Custom('CZ_TitleAsNameNoTooltip_A')]"
 establish_silk_production_decision: "Zavést výrobu hedvábí"
 establish_silk_production_decision_desc.boilerplate: "Od té doby, co staří pašovali první bource morušového z nejvzdálenějších východních krajin do Konstantinopole, byla výroba a prodej hedvábí vždy císařským monopolem."
 establish_silk_production_decision_desc: "$establish_silk_production_decision_desc.boilerplate$\n\nByla by to nákladná záležitost, ale mohli bychom koupit císařskou výjimku, abychom si v našem rodovém statku mohli založit vlastní výrobu hedvábí."
 establish_silk_production_decision_desc.emperor: "$establish_silk_production_decision_desc.boilerplate$\n\nJako hlava císařské rodiny si mohu jediným mávnutím ruky udělit sobě i svým následovníkům privilegium její výroby."
 establish_silk_production_decision_tooltip: "Kupte císařské povolení k odemknutí budov výroby hedvábí ve vašem [Concept('estate','statku')|E]"
 establish_silk_production_decision_confirm: "Odeslat platbu"
 unlocked_estate_silk_buildings: "Odemkne [Concept('building','budovu')|E] [Concept('estate','statku')|E] [GetDomicileBuilding('silk_01').GetName]"
 unlocked_estate_silk_buildings_t: "[GetDomicileBuilding('silk_01').GetName] odemčeno"
 has_unlocked_estate_silk: "Musíš mít odemčeno [GetModifier('ep3_unlocked_silk').GetNameWithTooltip] prostřednictvím [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('establish_silk_production_decision').GetName], nebo tvá [Concept('culture','kultura')|E] musí mít [Concept('innovation','inovaci')|E] #V $innovation_sericulture$#!"
 commission_silk_regalia_decision: "Objednat hedvábné regálie"
 commission_silk_regalia_decision_desc: "Naše rodina je mezi několika málo císařsky autorizovanými producenty a prodejci nejjemnějšího byzantského hedvábí. Naše činnost nám přináší zlato a vliv — a ještě nějaké #EMP výhody#! — ale zřídka z nich těžíme přímo. Myslím, že si zasloužím něco #EMP extra pěkného#! jen pro sebe, alespoň tentokrát!"
 commission_silk_regalia_decision_tooltip: "Nechat vyrobit hedvábný [Concept('artifact','artefakt')|E] pro sebe"
 commission_silk_regalia_decision_confirm: "Povolat řemeslníka"
 commission_silk_regalia_decision_effect: "Řemeslník z tvého statku ti vyrobí hedvábné regálie ([Concept('artifact','artefakt')|E])"
 ep3_decisions_event.5030.t: "Hedvábné regálie dokončeny"
 ep3_decisions_event.5030.desc: "S elegantním gestem mi [local_artisan.GetFirstName], [Select_CString(local_artisan.IsFemale,'mistrová řemeslnice','mistr řemeslník')] v naší rodové hedvábnické dílně, předává sadu hedvábných rouch té nejvyšší kvality.\n\n„Vaše zakázka je hotová, [ROOT.Char.Custom('FormOfAddressForLiege')]. Doufám, že dostojí vašim nárokům.“\n\nHedvábí mi plyne mezi prsty jako voda a oči jen stěží stačí zachytit všechny drobné detaily výzdoby."
 ep3_decisions_event.5030.a: "Naprosto nádherné!"
 silk_regalia_name: "Jemné hedvábné regálie"
 silk_regalia_description: "Sada hedvábných rouch hodných císaře, vyrobená některými z nejlepších řemeslníků byzantského stylu v rodovém statku rodu [owner.GetHouse.GetName].\n\nBarvy jsou zářivé a zlatá nit je elegantně propletena celou látkou, aby zvýraznila složité vzory."
 foster_integration_decision: "Podpořit integraci"
 foster_integration_decision_desc: "Můj rodový statek se nachází v poněkud bouřlivé oblasti. To nemusí být nevýhoda, protože mohu pomoci mému vrchnímu pevněji přivést místní obyvatelstvo pod moc [ROOT.Char.GetTopLiege.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_G')], a zároveň podpořit své politické a finanční postavení."
 foster_integration_decision_tooltip: "Podpoř de iure a kulturní začlenění [Concept('county','hrabství')|E] svého [Concept('estate','statku')|E]"
 foster_integration_decision_confirm: "Začněme"
 improve_promote_culture_tt: "Tvůj lenní pán získá bonus k [Concept('councillor_task','úkolu rádce')|E] [Concept('promote_culture','šíření kultury')|E], pokud se zaměří na toto hrabství."
 improve_de_jure_integration_tt: "Tvůj lenní pán získá bonus k [Concept('councillor_task','úkolu rádce')|E] [Concept('integrate_title','začlenění titulu')|E], pokud se zaměří na toto hrabství."
 improve_promote_culture_modifier_tt: "[ROOT.Char.GetTitledFirstName] [Select_CString(ROOT.Char.IsFemale,'zahájila','zahájil')] podporu kulturního začlenění [CZPrepV(target_county.GetNameNoTooltip)] [target_county.Custom('CZ_LandedName_L')].\nBonus k [Concept('councillor_task','úkolu rádce')|E] [Concept('promote_culture','šíření kultury')|E] zaměřenému na toto hrabství."
 improve_de_jure_integration_modifier_tt: "[ROOT.Char.GetTitledFirstName] [Select_CString(ROOT.Char.IsFemale,'zahájila','zahájil')] podporu de iure začlenění [target_county.Custom('CZ_LandedName_G')].\nBonus k [Concept('councillor_task','úkolu rádce')|E] [Concept('integrate_title','začlenění titulu')|E] zaměřenému na toto hrabství."
 gather_faction_support_decision: "Shromáždit podporu frakce"
 gather_faction_support_decision_desc: "Můj rodový statek je centrem pořádku a moci, odkud se vliv rodu [ROOT.Char.GetHouse.GetName] šíří do všech stran. Mohu využít této příznivé pozice a shromáždit místní stoupence pro svou frakci."
 gather_faction_support_decision_tooltip: "Získej podporu pro [Concept('faction','frakci')|E], ke které ses [Select_CString(GetPlayer.IsFemale,'přidala','přidal')]"
 gather_faction_support_decision_confirm: "Shromáždit stoupence"
 gathered_support_for_faction_army: "Shromážděna místní podpora"
 gathered_support_for_faction_get_army_tt: "Pokud tato [Concept('faction','frakce')|E] do 5 let uplatní svůj [Concept('claim','nárok')|E] a vstoupí do války, získáte navíc armádu místních odvodů a $light_footmen$"
 belong_to_claimant_liberty_faction_tt: "Musíš být členem [Concept('claimant_faction','frakce nárokovatele')|E] nebo [Concept('liberty_faction','frakce za svobodu')|E]"
 separatist_uprising_decision: "Postavit se za kulturu [ROOT.Char.GetCulture.GetNameNoTooltip]"
 separatist_uprising_decision_desc: "Země patří těm, kdo v ní žijí. [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetDeJureLiege.GetDefinitiveNameNoTooltip|U] musí být vládnuta pravým [ROOT.Char.GetCulture.GetNameNoTooltip]."
 separatist_uprising_decision_tooltip: "Zajisti [Concept('duchy','vévodství')|E] pro svou [Concept('culture','kulturu')|E]"
 separatist_uprising_decision_war_tt: "Zahájíte [Concept('war','válku')|E] s modifikátorem [GetModifier('ep3_separatist_uprising').GetNameWithTooltip] na #V 15#! let a získáte [Concept('levies','odvedence')|E] a nějaké #high Vybrané věrné#! [Concept('men_at_arms','ozbrojence')|E], #high #EMP nebo#!#! nezačnete [Concept('war','válku')|E] okamžitě, ale ponecháte si [Concept('claim','nárok')|E]"
 separatist_uprising_decision_pacifist_option_common_tt: "Pokud splníte alespoň #V 3#!, získáte [Concept('duchy','vévodství')|E] #V mírovou cestou#!:\n$EFFECT_LIST_BULLET$Vysoce urozený [GetPlayer.GetCurrentLocation.GetCounty.GetCulture.GetName] [Concept('spouse','choť')|E]\n$EFFECT_LIST_BULLET$[GetPlayer.GetCurrentLocation.GetCounty.GetFaith.GetAdjective] [Concept('faith','víra')|E]\n$EFFECT_LIST_BULLET$[Concept('weak_hook','slabá páka')|E] @weak_hook_icon! na [GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetHolder.GetLiege.Custom('CZ_TitledFirstName_A')]"
 separatist_uprising_decision_pacifist_option_friend_lover_tt: "$separatist_uprising_decision_pacifist_option_common_tt$\n$EFFECT_LIST_BULLET$[Concept('friend','přítel')|E] nebo [Concept('lover','milenec')|E] [GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetHolder.GetTopLiege.Custom('CZ_TitledFirstName_G')]$separatist_uprising_decision_pacifist_option_ending_tt$"
 separatist_uprising_decision_pacifist_option_friend_tt: "$separatist_uprising_decision_pacifist_option_common_tt$\n$EFFECT_LIST_BULLET$[Concept('friend','přítel')|E] [GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetHolder.GetTopLiege.Custom('CZ_TitledFirstName_G')]$separatist_uprising_decision_pacifist_option_ending_tt$"
 separatist_uprising_decision_pacifist_option_ending_tt: "\n$EFFECT_LIST_BULLET$O 1 vyšší [Concept('prestige_level','úroveň slávy')|E] než [GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetHolder.GetTopLiege.GetTitledFirstName]"
 separatist_uprising_decision_confirm: "Na zbraně, [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]!"
 ep3_separatist_uprising: "Separatistické povstání"
 ep3_separatist_uprising_desc: "Tato postava vložila veškeré úsilí do získání území pro svou kulturu."
