l_polish:
 game_concept_administrative_government: "Administrativní vláda"
 game_concept_administrative_governments: "Administrativní vlády"
 game_concept_administrative: "Administrativní"
 game_concept_administrative_i: "@government_type_administrative!"
 game_concept_administrative_desc: "$game_concept_administrative$ je [Concept('government_bureaucratic_type','byrokratický typ')|E] [Concept('government_form','formy vlády')|E], která jmenuje [Concept('characters','postavy')|E] jako [Concept('governors','guvernéry')|E], aby jménem svého [Concept('liege','lenního pána')|E] spravovali země zvané [Concept('provinces','provincie')|E] a dohlíželi na ně.\n\n$game_concept_administrative$ postavy mají přístup k [Concept('influence','vlivu')|E] a některé mají také osobní [Concept('family_estate','rodové sídlo')|E].\n\n[Concept('legitimacy','Legitimitu')|E] mají pouze [Concept('independent','nezávislí')|E] [Concept('rulers','vládci')|E] $game_concept_administrative$ [Concept('realm','panství')|E], zatímco [Concept('vassals','vazalové')|E] nikoli.\n\n$admin_cannot_declare_internal_wars$"
 game_concept_imperial_bureaucracy: "Říšská byrokracie"
 game_concept_imperial_bureaucracy_desc: "$game_concept_imperial_bureaucracy$ představuje míru centralizace [Concept('realms','panství')|E] s [Concept('administrative','administrativní')|E] vládou a obecnou moc, kterou [Concept('ruler','vládce')|E] uplatňuje nad svými [Concept('vassals','vazaly')|E].\n\n$game_concept_imperial_bureaucracy$ může měnit pouze [Concept('top_liege','nejvyšší lenní pán')|E]. Administrativní $game_concept_vassals$ používají stejnou úroveň jako jejich $game_concept_liege$.\n\nExistují čtyři úrovně $game_concept_imperial_bureaucracy$:\n$EFFECT_LIST_BULLET$$imperial_bureaucracy_0$\n$EFFECT_LIST_BULLET$$imperial_bureaucracy_1$\n$EFFECT_LIST_BULLET$$imperial_bureaucracy_2$\n$EFFECT_LIST_BULLET$$imperial_bureaucracy_3$\n\nZvýšení $game_concept_imperial_bureaucracy$ stojí určité množství [Concept('prestige','prestiže')|E] podle [Concept('realm_size','velikosti panství')|E] a [Concept('learning_skill','učenosti')|E] vládce."
 game_concept_governor: "Guvernér"
 game_concept_governor_possessive: "Guvernérova"
 game_concept_governors: "Guvernéři"
 game_concept_governors_possessive: "Guvernérů"
 game_concept_governed: "Spravovaný"
 game_concept_strategos: "Strategos"
 game_concept_strategos_possessive: "Strategův"
 game_concept_strategoi: "Strategové"
 game_concept_strategoi_possessive: "Strategů"
 game_concept_governorship: "Guvernérství"
 game_concept_governorships: "Guvernérství"
 game_concept_governor_desc: "$game_concept_governor$ je hlavní vazal [Concept('liege','lenního pána')|E] s [Concept('government_bureaucratic_gov','byrokratickou vládou')|E]. Je svým lenním pánem jmenován, aby dohlížel na země v rámci [Concept('realm','panství')|E] a využíval při tom svou [Concept('governor_efficiency','guvernérskou účinnost')|E].\n\n[Concept('title','Titul')|E] $game_concept_governor$ i [Concept('counties','hrabství')|E], která zahrnuje, se označují jako [Concept('province','provincie')|E]. V provincii se mohou objevit [Concept('governance_issues','problémy se správou')|E], které musí $game_concept_governor$ vyřešit.\n\n$game_concept_governors$ mohou hromadit [Concept('influence','vliv')|E] a manipulovat [Concept('succession','nástupnictvím')|E] jiných $game_concept_governorships$."
 game_concept_candidate_score: "Skóre kandidáta"
 game_concept_candidate_scores: "Skóre kandidátů"
 game_concept_candidate_score_desc: "[Concept('characters','Postavy')|E] v [Concept('line_of_succession','linii následnictví')|E] pro [Concept('title','titul')|E] s [Concept('administrative_government','administrativní vládou')|E] mají $game_concept_candidate_score$.\n\nToto skóre určuje, kdo při [Concept('succession','nástupnictví')|E] obdrží titul či tituly, a lze je měnit různými prostředky, od [Concept('scheming','intrikaření')|E] až po utrácení [Concept('influence','vlivu')|E]."
 game_concept_influence: "Vliv"
 game_concept_influence_desc: "$game_concept_influence$ představuje politický dosah a autoritu [Concept('character_possessive','postavy')|E] v [Concept('realm','panství')|E], které má [Concept('administrative_government','administrativní vládu')|E].\n\n$game_concept_influence$ je nezbytný nástroj a lze jej získat mnoha způsoby, například tím, že se staneš [Concept('governor','guvernérem')|E], vylepšíš [Concept('estate','sídlo')|E] nebo uzavřeš spojenectví s [Concept('house_head','hlavou rodu')|E] [Concept('noble_family','šlechtické rodiny')|E].\n\nHlavním způsobem, jak $game_concept_influence$ utrácet a využívat, je získání [Concept('governorship','guvernérství')|E], ale jde také o cenný zdroj k tomu, aby ostatní postavy konaly podle tvé vůle.\n\nPokaždé, když postava získá $game_concept_influence$, postupuje také ke své další [Concept('influence_level','úrovni vlivu')|E]."
 game_concept_influence_i: "@influence_icon!"
 game_concept_influential: "Vlivný"
 game_concept_influence_level: "Úroveň vlivu"
 game_concept_influence_level_desc: "[Concept('influence_level','Úroveň vlivu')|E] [Concept('character_possessive','postavy')|E] měří její celkovou politickou moc a dosah.\n\nPokaždé, když postava získá [Concept('influence','vliv')|E], získá také postup k další $game_concept_influence_level$.\n\nÚrovně jsou:\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_5' ).GetNameWithTooltip|L]"
 game_concept_influence_levels: "Úrovně vlivu"
 game_concept_influence_level_impact: "Dopad úrovně vlivu"
 game_concept_influence_level_impact_desc: "$game_concept_influence_level_impact$ zvyšuje nebo snižuje [Concept('modifiers','modifikátory')|E] získané z tvé současné [Concept('influence_level','úrovně vlivu')|E]."
 game_concept_title_men_at_arms: "Tituloví ozbrojenci"
 game_concept_title_men_at_arms_desc: "$game_concept_title_men_at_arms$ jsou [Concept('men_at_arms','ozbrojenci')|E], kteří existují pro daný [Concept('title','titul')|E]. Namísto toho, aby osobně náleželi [Concept('ruler','vládci')|E], tyto oddíly vždy následují $game_concept_title$, k němuž patří. To znamená, že kdokoli vlastní daný $game_concept_title$, bude vlastnit a ovládat také příslušné oddíly.\n\n$game_concept_title_men_at_arms$ používají určité [Concept('government_forms','formy vlády')|E], například [Concept('administrative','administrativní')|E]."
 game_concept_domicile: "Domicil"
 game_concept_domiciles: "Domicily"
 game_concept_domicile_desc: "$game_concept_domicile$ je soukromý majetek určitých [Concept('characters','postav')|E], které mají konkrétní [Concept('government_form','formu vlády')|E], například [Concept('administrative','administrativní')|E] nebo [Concept('adventurer','dobrodružnou')|E].\n\n$game_concept_domicile$ slouží jako hlavní mocenská základna vlastníka namísto [Concept('holdings','držav')|E] a lze jej vylepšovat pomocí [Concept('domicile_buildings','budov domicilu')|E].\n\nKaždý $game_concept_domicile$ se nachází v určeném [Concept('barony','baronství')|E] a lze jej přesunout na nové místo. V závislosti na typu $game_concept_domicile$ mohou platit omezení.\n\nKaždý $game_concept_domicile$ má zvláštní bezzemský [Concept('title','titul')|E] a řídí se jeho [Concept('succession','nástupnictvím')|E]."
 game_concept_domicile_building: "Budova domicilu"
 game_concept_domicile_buildings: "Budovy domicilu"
 game_concept_domicile_building_desc: "Všechny [Concept('domiciles','domicily')|E] lze vylepšovat pomocí určitých $game_concept_domicile_buildings$, které vlastníkovi poskytují příjem, zdroje jako [Concept('prestige','prestiž')|E] a mnoho dalších výhod.\n\nDostupnost budov závisí na typu $game_concept_domicile$, protože každý typ má velmi odlišnou sadu budov.\n\nNěkteré $game_concept_domicile_buildings$ mohou mít [Concept('internal_upgrades','vnitřní vylepšení')|E]."
 game_concept_domicile_build_speed: "Doba výstavby [Concept('domicile_building','budovy domicilu')|E]"
 game_concept_domicile_travel_speed: "Rychlost přesunu [Concept('domicile','domicilu')|E]"
 game_concept_domicile_building_upgrade: "Vnitřní vylepšení"
 game_concept_domicile_building_upgrade_desc: "Některé $game_concept_domicile_buildings$ lze vylepšit pomocí $game_concept_internal_upgrades$.\n\nVylepšení, přestože se podobá jiným $game_concept_domicile_buildings$, lze postavit pouze v rámci konkrétní budovy. Každá budova s přístupem k vylepšením má vlastní jedinečnou sadu dostupných vylepšení."
 game_concept_domicile_building_slot: "Pozice $game_concept_domicile_building$"
 game_concept_domicile_building_slots: "Pozice $game_concept_domicile_building$"
 game_concept_domicile_building_slot_slot: "Pozice"
 game_concept_domicile_building_slot_slots: "Pozice"
 game_concept_domicile_building_slot_desc: "Každý [Concept('domicile','domicil')|E] má pro nové budovy pouze omezený počet možných $game_concept_domicile_building_slot_slots$.\n\nNové $game_concept_domicile_building_slot_slots$ lze odemknout vylepšením ústřední $game_concept_domicile_building$, například [GetDomicileBuilding('estate_main_01').GetName] [Concept('estate','sídla')|E] nebo [GetDomicileBuilding('camp_main_01').GetName] [Concept('camp','tábora')|E].\n\n#WEAK Uzamčené $game_concept_domicile_building_slot_slots$ se zobrazují v okně $game_concept_domicile$ — nad jejich rámec nelze získat žádné další $game_concept_domicile_building_slot_slots$.#!"
 game_concept_internal_upgrades: "Vnitřní vylepšení"
 game_concept_estate: "Sídlo"
 game_concept_estates: "Sídla"
 game_concept_family_estate: "Rodové sídlo"
 game_concept_family_estates: "Rodová sídla"
 game_concept_estate_desc: "$game_concept_estate$ je typ [Concept('domicile','domicilu')|E] držený [Concept('house_head','hlavou rodu')|E] významných [Concept('noble_families','šlechtických rodů')|E] v [Concept('administrative','administrativních')|E] [Concept('realms','panstvích')|E]. Představuje soukromé pozemkové državy nevázané na žádný konkrétní [Concept('landed','zeměpanský')|E] [Concept('title','titul')|E].\n\nLze zde stavět [Concept('estate_buildings','budovy sídla')|E], které rozšiřují rodinné bohatství a [Concept('influence','vliv')|E], a $game_concept_estate$ zdědí budoucí generace."
 game_concept_estate_building: "Budova sídla"
 game_concept_estate_buildings: "Budovy sídla"
 game_concept_estate_building_desc: "$game_concept_estate_buildings$ jsou jedinečná a trvalá vylepšení [Concept('noble_family_possessive','šlechtického rodu')|E] [Concept('estate','sídla')|E].\n\nKe stavbě je k dispozici široká škála staveb, které může vlastník sídla vybudovat, aby vytvářel soukromý příjem, rozšiřoval rodinný [Concept('influence','vliv')|E] a získal přístup k řadě [Concept('decisions','rozhodnutí')|E], [Concept('interactions','interakcí')|E] a dalším možnostem."
 game_concept_camp: "Tábor"
 game_concept_camps: "Tábory"
 game_concept_adventurer_camp: "Tábor dobrodruha"
 game_concept_adventurer_camps: "Tábory dobrodruhů"
 game_concept_camp_desc: "$game_concept_camps$ jsou přenosná směsice stanů, soumarských zvířat a lidí. Velikostí se liší od malého kruhu až po velká putující vojska.\n\nKaždá vláda typu [GetGovernment( 'landless_adventurer_government' ).GetName] má $game_concept_camp$ jako [Concept('domicile','domicil')|E], který se s ní pohybuje po mapě.\n\nLze zde budovat [Concept('camp_buildings','vylepšení tábora')|E], která $game_concept_adventurer$ poskytují mocné bonusy namísto vlastních [Concept('counties','hrabství')|E]. [Concept('followers','Družiníci')|E], jako jeho [Concept('family','rodina')|E] a [Concept('knights','rytíři')|E], cestují s $game_concept_camp$ a mohou být jmenováni [Concept('officers','důstojníky')|E].\n\n#WEAK Podobně jako [Concept('courts','dvory')|E] zahrnují $game_concept_camps$ i některé bezejmenné [Concept('characters','postavy')|E], které nejsou natolik důležité, aby byly zobrazeny — byť je jich méně.\n\nAni když právě [Concept('traveling','necestují')|E] mezi $game_concept_counties$, nejsou $game_concept_camps$ v [Concept('location','lokalitě')|E], kde se nacházejí, obvykle statické a každých několik nocí se přesunou.#!"
 game_concept_camp_building: "Vylepšení tábora"
 game_concept_camp_buildings: "Vylepšení tábora"
 game_concept_camp_building_desc: "$game_concept_camp_buildings$ jsou jedinečná vylepšení [Concept('camp','tábora')|E].\n\nZ hlediska mechanik jde o [Concept('domicile_buildings','budovy domicilu')|E] — mnohá však představují spíše společenské zvyklosti nebo prostě oblasti zaměření $game_concept_camp$, nikoli doslovné stavby.\n\nBonusy, které mohou poskytovat, zahrnují:\n$EFFECT_LIST_BULLET$Odemykání nových [Concept('officers','důstojníků')|E]\n$EFFECT_LIST_BULLET$Mocná posílení [Concept('skill','dovedností')|E] pro [Concept('followers','družiníky')|E]\n$EFFECT_LIST_BULLET$Posílení síly [Concept('men_at_arms','ozbrojenců')|E]\n$EFFECT_LIST_BULLET$Odemykání akcí, které [Concept('landed','zeměpanští')|E] [Concept('rulers','vládci')|E] považují za samozřejmé.\n\n#WEAK Když se [Concept('adventurer','dobrodruh')|E] stane [Concept('landed','zeměpánem')|E], jeho $game_concept_camp_buildings$ jsou zpeněžena a část hodnoty se vrátí jako [Concept('gold','zlato')|E].#!"
 game_concept_follower: "Družiník"
 game_concept_followers: "Družiníci"
 game_concept_following: "Družina"
 game_concept_follower_desc: "$game_concept_follower$ je [Concept('unlanded','bezzemská')|E] postava, která doprovází [Concept('adventurer','dobrodruha')|E].\n\nZ hlediska mechanik odpovídají [Concept('courtiers','dvořanům')|E], jsou však méně povinni projevovat úctu nebo se zdržovat poblíž, pokud svého vůdce nemají rádi.\n\nSpolečné [Concept('opinion','mínění')|E] $game_concept_followers$ dané postavy určuje její [Concept('camp_temperament','náladu tábora')|E].\n\n$game_concept_followers$ mohou:\n$BULLET_WITH_TAB$Sloužit jako [Concept('officers','důstojníci')|E]\n$BULLET_WITH_TAB$Sloužit v [Concept('armies','armádách')|E] jako [Concept('commanders','velitelé')|E] nebo [Concept('knights','rytíři')|E]\n$BULLET_WITH_TAB$Umožnit svému [Concept('adventurer','dobrodruhovi')|E] uplatnit jejich [Concept('claims','nároky')|E] ve [Concept('war','válce')|E]"
 game_concept_camp_temperament: "Nálada tábora"
 game_concept_camp_temperament_desc: "Na rozdíl od pevné hierarchie [Concept('court','dvora')|E] jsou $game_concept_camps$ převážně neformální místa, kde může reptání důležitých [Concept('characters','postav')|E] #EMP jiných#! než vedoucí [Concept('adventurer','dobrodruh')|E] znamenat velmi mnoho.\n\n#P $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_POSITIVE$#! $game_concept_camps$ poskytují svému $game_concept_adventurer$ kladné [Concept('character_modifiers','modifikátory postavy')|E]. Vyžadují, aby většinové [Concept('opinion','mínění')|E] všech pojmenovaných [Concept('characters','postav')|E] bylo [GetDefine('NDomicile', 'TEMPERAMENT_THRESHOLD_HIGH')|=P0] nebo vyšší.\n\n#N $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_NEGATIVE$#! $game_concept_camps$ uplatňují na svého $game_concept_adventurer$ záporné $game_concept_character_modifiers$. Vyžadují, aby většinové $game_concept_opinion$ všech pojmenovaných $game_concept_characters$ bylo [GetDefine('NDomicile', 'TEMPERAMENT_THRESHOLD_LOW')|=N0] nebo nižší.\n\n#V $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_NEUTRAL$#! $game_concept_camps$ jsou všechny případy, kdy rozsah $game_concept_opinions$ spadá mezi tyto dva krajní body. Neuplatňují žádné $game_concept_modifiers$.\n\n#WEAK Účinky $game_concept_camp_temperament$ se škálují podle [Concept('prestige_level','úrovně slávy')|E] $game_concept_adventurer_possessive. Čím slavnější $game_concept_adventurer$, tím výraznější mohou být možné výhody — i nevýhody — atmosféry v jeho $game_concept_camp$.#!"
 game_concept_adventurer: "Dobrodruh"
 game_concept_adventurers: "Dobrodruzi"
 game_concept_adventurer_possessive: "Dobrodruhův"
 game_concept_adventurers_possessive: "Dobrodruhů"
 game_concept_adventurer_i: "@government_type_adventurer!"
 game_concept_adventurer_desc: "$game_concept_adventurer$ je [Concept('character','postava')|E]-[Concept('unlanded','bezzemek')|E], která vede [Concept('camp','tábor')|E].\n\nNemá [Concept('vassals','vazaly')|E] ani nezískává příjem pasivně obvyklým způsobem — místo toho musí přijímat [Concept('task_contracts','zakázky')|E], aby si vydělala mince, nebo si vyžádat laskavosti od svého [Concept('contact_list','seznamu kontaktů')|E].\n\n$game_concept_adventurers$ se mohou volně toulat po mapě. Jejich hlavní starostí je zajistit, aby měli dostatek [Concept('provisions','zásob')|E] k přežití na cestách.\n\nNamísto [Concept('crown_authority','korunní autority')|E] si většina $game_concept_adventurers$ stanoví [Concept('camp_purpose','účel tábora')|E]. Ten ukazuje, jaký typ skupiny mají a proč drží pohromadě.\n\n#WEAK Sedmí synové hnaní vpřed bez dědictví, ctižádostiví kočovníci, umínění uprchlíci, zvídaví učenci, krutí žoldnéři i sesazení šlechtici — ti všichni naplňují řady těchto neúnavných pocestných.\n\nJejich jediným společným rysem je hlad po něčem víc než po tichém životě v zapomnění a vůle s tím něco udělat.#!"
 game_concept_officer: "Důstojník"
 game_concept_officers: "Důstojníci"
 game_concept_officer_desc: "$game_concept_officers$ jsou specializované role, které lze udělit [Concept('followers','družiníkům')|E], aby pomáhali svému [Concept('camp','táboru')|E].\n\nZ hlediska mechanik fungují velmi podobně jako [Concept('court_positions','dvorské úřady')|E]. Stejně jako u nich jsou výhody, které z $game_concept_officers$ získáš, určeny [Concept('aptitude','způsobilostí')|E] držitele pro daný úřad.\n\nNa rozdíl od $game_concept_court_positions$ je jmenování $game_concept_officers$ zdarma a nedostávají měsíční plat, jejich odvolání však stále stojí [Concept('prestige','prestiž')|E].#!\n\n#WEAK $game_concept_officers$ se odemykají prostřednictvím mnoha různých [Concept('camp_buildings','vylepšení tábora')|E].#!"
 game_concept_imperial_family: "Císařská rodina"
 game_concept_imperial_families: "Císařské rodiny"
 game_concept_imperial: "Císařský"
 game_concept_imperial_family_desc: "$game_concept_imperial_family$ je nejvýše postavený [Concept('house','rod')|E] v [Concept('administrative','administrativním')|E] [Concept('realm','panství')|E]."
 game_concept_noble_family: "Šlechtická rodina"
 game_concept_noble_families: "Šlechtické rodiny"
 game_concept_noble_family_possessive: "Šlechtické rodiny"
 game_concept_noble_family_desc: "$game_concept_noble_families$ jsou mocné [Concept('houses','rody')|E] v [Concept('administrative','administrativním')|E] [Concept('realm','panství')|E]. Vlastní [Concept('estate','sídlo')|E], které ovládá a spravuje [Concept('house_head','hlava rodu')|E], a vždy zůstávají nedílnou součástí panství, protože se budou snažit shromažďovat [Concept('influence','vliv')|E] a zajistit si [Concept('provinces','provincie')|E].\n\nVlivná $game_concept_noble_family$ se může stát [Concept('powerful_family','mocnou rodinou')|E] nebo [Concept('dominant_family','dominantní rodinou')|E]."
 game_concept_powerful_family: "Mocná rodina"
 game_concept_powerful_families: "Mocné rodiny"
 game_concept_powerful: "Mocný"
 game_concept_powerful_family_desc: "$game_concept_powerful_family$ představuje jeden z nejvlivnějších [Concept('houses','rodů')|E] a [Concept('noble_families','šlechtických rodin')|E] v [Concept('administrative','administrativním')|E] [Concept('realm','panství')|E].\n\nČlen $game_concept_powerful_family$ je lepší v [Concept('political_schemes','politických intrikách')|E] a má větší šanci dosáhnout toho, co chce, při [Concept('interacting','interakci')|E] s jinými [Concept('characters','postavami')|E].\n\nV daný okamžik může existovat pouze omezený počet $game_concept_powerful_families$ a za mocné jsou považovány nejlépe hodnocené $game_concept_noble_families$ podle svého [Concept('powerful_family_rating_short','hodnocení')|E]. Výjimkou je rod [Concept('top_liege','nejvyššího lenního pána')|E], který je vždy považován za mocný.\n\nRodina ovládající významnou část zemí panství se může stát [Concept('dominant_family','dominantní rodinou')|E]."
 game_concept_dominant_family: "Dominantní rodina"
 game_concept_dominant_families: "Dominantní rodiny"
 game_concept_dominant: "Dominantní"
 game_concept_dominant_family_desc: "$game_concept_dominant_family$ je [Concept('powerful_family','mocná rodina')|E], která rozšířila svou vládu široko daleko. Je považována za nejvlivnější [Concept('house','rod')|E] v rámci [Concept('realm','panství')|E].\n\nČlen $game_concept_dominant_family$ je ještě lepší v [Concept('political_schemes','politických intrikách')|E] a má ještě větší šanci dosáhnout toho, co chce, při [Concept('interacting','interakci')|E] s jinými [Concept('characters','postavami')|E].\n\n$game_concept_house$ musí ovládat alespoň [EmptyScope.ScriptValue('dominant_family_threshold_value')|V0%] panství, aby se stal dominantním."
 game_concept_house_attribute: "Atribut rodu"
 game_concept_house_attribute_desc: "V některých [Concept('governments','vládách')|E] mohou mít [Concept('houses','rody')|E] $game_concept_house_attribute$, který ovlivňuje členy rodu.\n\nJednotlivé atributy rodu jsou:\n$EFFECT_LIST_BULLET$[Concept('powerful_family_attribute','atribut mocné rodiny')|E]\n$EFFECT_LIST_BULLET$[Concept('house_aspiration','ambice rodu')|E]\n$EFFECT_LIST_BULLET$[Concept('mandala_aspect','aspekt mandaly')|E]"
 game_concept_powerful_family_attribute: "Atribut mocné rodiny"
 game_concept_family_attribute: "Atribut rodiny"
 game_concept_powerful_family_attribute_desc: "$game_concept_powerful_family_attribute$ je soubor bonusů spojených s [Concept('house','rodem')|E] uvnitř [Concept('administrative','administrativního')|E] [Concept('realm','panství')|E]. Atribut prospívá členům $game_concept_house$ i [Concept('liege','lennímu pánovi')|E].\n\nAtributy jsou aktivní pouze tehdy, dokud je $game_concept_house$ považován za [Concept('powerful_family','mocnou rodinu')|E], a $game_concept_family_attribute$ [Concept('dominant_family','dominantní rodiny')|E] neprospívá jejímu [Concept('liege','lennímu pánovi')|E].\n\n[Concept('house_head','Hlava rodu')|E] může atribut kdykoli volně nahradit."
 game_concept_powerful_family_rating: "Hodnocení mocné rodiny"
 game_concept_powerful_family_rating_short: "Hodnocení"
 game_concept_powerful_family_rating_mid: "Hodnocení rodiny"
 game_concept_powerful_family_rating_desc: "$game_concept_powerful_family_rating$ měří, jak vlivná je [Concept('powerful_family','mocná rodina')|E].\n\nAčkoli existuje mnoho způsobů, jak zvýšit $game_concept_powerful_family_rating_short$ rodiny, hlavním faktorem je počet držených [Concept('governorships','guvernérství')|E].\n\n[Concept('house','Rod')|E] musí mít $game_concept_powerful_family_rating_short$ alespoň [GetDefine('NHouse', 'POWERFUL_HOUSE_MINIMUM_POWER')|V0], aby byl považován za mocný."
 game_concept_admin_confirmation: "$admin_confirmation_decision$"
 game_concept_admin_confirmation_desc: "[Concept('governors','Guvernéři')|E] mohou být ve svém jmenování formálně a veřejně potvrzeni svým [Concept('liege','lenním pánem')|E]."
 game_concept_admin_confirmation: "$admin_confirmation_decision$"
 game_concept_admin_confirmation_desc: "[Concept('governors','Guvernéři')|E] mohou být ve svém jmenování formálně a veřejně potvrzeni svým [Concept('liege','lenním pánem')|E]."
 game_concept_ep3_become_landless_adventurer_decision: "Rozhodnutí $become_landless_adventurer_decision$"
 game_concept_ep3_become_landless_adventurer_decision_desc: "[Concept('decision','Rozhodnutí')|E] odemčené určitými [Concept('traditions','tradicemi')|E], které [Concept('ruler','vládci')|E] malého [Concept('realm','panství')|E] umožňuje dobrovolně odejít a stát se [Concept('adventurer','dobrodruhem')|E]"
 game_concept_ep3_purchase_land_interaction: "$purchase_land_interaction$"
 game_concept_ep3_purchase_land_interaction_desc: "[Concept('interaction','Interakce')|E], která [Concept('adventurer','dobrodruhovi')|E] umožňuje koupit půdu od [Concept('ruler','vládce')|E] a usadit se v jeho [Concept('realm','panství')|E]"
 game_concept_ep3_negotiate_settlement_interaction: "$negotiate_settlement_interaction$"
 game_concept_ep3_negotiate_settlement_interaction_desc: "[Concept('interaction','Interakce')|E], která [Concept('ruler','vládci')|E] umožňuje usadit nezkrotného [Concept('adventurer','dobrodruha')|E] ve svém [Concept('realm','panství')|E]"
 game_concept_ep3_laamp_adventurer_invasion_war: "$EP3_LAAMP_INVASION_CB_NAME$"
 game_concept_ep3_laamp_adventurer_invasion_war_desc: "[Concept('casus_belli','Casus belli')|E], který [Concept('adventurer','dobrodruhovi')|E] umožňuje vyhlásit [Concept('war','válku')|E] ve snaze vybojovat si nové [Concept('realm','panství')|E]"
 game_concept_contractor: "Zadavatel"
 game_concept_contractors: "Zadavatelé"
 game_concept_contractor_possessive: "Zadavatelův"
 game_concept_contractors_possessive: "Zadavatelů"
 game_concept_contractor_desc: "$game_concept_contractor$ je [Concept('character','postava')|E], která vypisuje $game_concept_task_contract$.\n\n$game_concept_task_contract$ se jí zpravidla bude týkat nejvíce a obvykle právě ona vyplácí [Concept('adventurer','dobrodruhovi')|E] odměnu.\n\n#N [Concept('criminal_task_contracts','Zločinné zakázky')|E] obecně #BOL nevypisuje#! jejich $game_concept_contractor$; místo toho se zaměřují na jeho využití — například na oklamání někoho, aby ti dal [Concept('gold','zlato')|E], protože dal najevo svou důvěřivost.#!"
 game_concept_contract_scheme: "Intrika zakázky"
 game_concept_contract_schemes: "Intriky zakázek"
 game_concept_contract_scheme_possessive: "Intriky zakázky"
 game_concept_contract_schemes_possessive: "Intrik zakázek"
 game_concept_contract_scheme_contract: "Zakázka"
 game_concept_contract_scheme_desc: "Mnoho $game_concept_task_contracts$ vyžaduje, aby [Concept('adventurers','dobrodruzi')|E] úspěšně dokončili [Concept('scheme','intriku')|E].\n\nTy mohou být škodlivé — například vražda [Concept('rival','soupeře')|E] [Concept('contractor','zadavatele')|E] — příjemné, jako prosté vyprávění příběhů pro pobavení jeho [Concept('court','dvora')|E] po několik měsíců, nebo neškodné, například opisování textů.\n\nPokud $game_concept_scheme$ z jakéhokoli důvodu selže nebo je opuštěna, selže i $game_concept_task_contract$."
 game_concept_contact_list: "Seznam patronů"
 game_concept_contact_list_contacts: "Patroni"
 game_concept_contact_list_contact: "Patron"
 game_concept_contact_list_desc: "[Concept('adventurers','Dobrodruzi')|E] jsou bez [Concept('land','země')|E], ale ne bez #EMP kontaktů#!.\n\n$game_concept_contact_list$ je seznam všech [Concept('characters','postav')|E], pro něž úspěšně splnili [Concept('task_contract','zakázku')|E], stejně jako dalších, které mají důvod je podporovat — [Concept('family','rodina')|E] s vysokým [Concept('opinion','míněním')|E] vůči nim, [Concept('friends','přátelé')|E], [Concept('lovers','milenci')|E] a podobně.\n\n$game_concept_contact_list_contacts$ lze využít k získání další podpory prostřednictvím [Concept('character_interaction','interakce postavy')|E] $contact_list_request_interaction|V$."
 game_concept_camp_purpose: "Účel tábora"
 game_concept_camp_purposes: "Účely tábora"
 game_concept_camp_purpose_purpose: "Účel"
 game_concept_camp_purpose_purposes: "Účely"
 game_concept_camp_purpose_desc: "$game_concept_camp_purposes$ jsou tím, co v nespoutané anarchii [Concept('camps','táborů')|E] nahrazuje zákon.\n\nPředstavují pouto, které motivuje $game_concept_camp$, aby držel pohromadě — ať už jde o učené sklony, žoldnéřské dovednosti nebo spalující touhu dosadit právoplatného vládce zpět na trůn.\n\nRůzné $game_concept_camp_purpose_purposes$ odemykají různá [Concept('camp_buildings','vylepšení tábora')|E] a tím i jedinečné [Concept('officers','důstojníky')|E], vedou k různým událostem či možnostem událostí a ovlivňují, které [Concept('task_contracts','zakázky')|E] se objeví.\n\n#WEAK $game_concept_camp_purpose$ také ovlivňuje titul $game_concept_adventurer_possessive a oděv jeho [Concept('followers','družiníků')|E].#!"
 game_concept_mercenary_task_contract: "Žoldnéřská zakázka"
 game_concept_mercenary_task_contracts: "Žoldnéřské zakázky"
 game_concept_mercenary_task_contract_possessive: "Žoldnéřské zakázky"
 game_concept_mercenary_task_contracts_possessive: "Žoldnéřských zakázek"
 game_concept_mercenary_task_contract_desc: "$game_concept_mercenary_task_contract$ zahrnuje pomoc [Concept('character','postavě')|E] buď v probíhající [Concept('war','válce')|E], nebo ve válce, kterou hodlá s tvou pomocí zahájit. Odměna se uděluje podle [Concept('war_contribution','válečného příspěvku')|E] i podle skutečného výsledku."
 game_concept_transport_task_contract: "Přepravní zakázka"
 game_concept_transport_task_contracts: "Přepravní zakázky"
 game_concept_transport_task_contract_possessive: "Přepravní zakázky"
 game_concept_transport_task_contracts_possessive: "Přepravních zakázek"
 game_concept_transport_task_contract_desc: "$game_concept_transport_task_contract$ obvykle zahrnuje přepravu zboží, například [Concept('artifacts','artefaktů')|E], nebo doprovod důležitých postav, jako jsou [Concept('wards','svěřenci')|E], na střední vzdálenosti."
 game_concept_treasure_map_task_contract: "Zakázka s mapou k pokladu"
 game_concept_treasure_map_task_contracts: "Zakázky s mapou k pokladu"
 game_concept_treasure_map_task_contract_possessive: "Zakázky s mapou k pokladu"
 game_concept_treasure_map_task_contracts_possessive: "Zakázek s mapou k pokladu"
 game_concept_treasure_map_task_contract_desc: "Doveď starého a sešlého dobrodruha k jeho poslednímu pokladu."
 game_concept_task_contracts_i: "@task_contract_icon!"
 game_concept_task_contract: "Zakázka"
 game_concept_task_contracts: "Zakázky"
 game_concept_task_contract_possessive: "Zakázky"
 game_concept_task_contracts_possessive: "Zakázek"
 game_concept_task_contract_desc: "$game_concept_task_contracts$ jsou hlavním způsobem, jak [Concept('adventurers','dobrodruzi')|E] získávají [Concept('gold','zlato')|E] nebo [Concept('prestige','prestiž')|E]. Mohou také udělovat [Concept('provisions','zásoby')|E], [Concept('piety','zbožnost')|E], a dokonce i [Concept('artifacts','artefakty')|E].\n\nKaždá z nich je úkol vypsaný místním [Concept('ruler','vládcem')|E] — obecně vyžaduje, aby $game_concept_adventurer$ provedl [Concept('scheme','intriku')|E], dokončil [Concept('travel','cestu')|E] nebo mu pomohl ve [Concept('war','válce')|E] — a lze ji přijmout za odměnu a za zařazení [Concept('contractor','zadavatele')|E] na [Concept('contact_list','seznam patronů')|E].\n\nDalší $game_concept_task_contracts$ se objevují při cestování na dlouhé vzdálenosti nebo do nových [Concept('kingdoms','království')|E].\n\nČím vyšší je [Concept('title_tier','úroveň titulu')|E] nebo $game_concept_ruler, který $game_concept_task_contract nabízí, tím vyšší je [Concept('task_contract_tier_tier','úroveň')|E] dané $game_concept_task_contract_possessive. Vyšší úrovně platí #EMP podstatně#! lépe.\n\n#alert_trial Dej si pozor na [Concept('criminal_task_contracts','zločinné zakázky')|E]: jejich odměny jsou často vynikající, ale svět má pro drobné zločiny jakéhosi bezzemského pobudy mnohem méně pochopení než pro [Concept('landed','zeměpanského')|E] [Concept('liege','lenního pána')|E].#!"
 game_concept_task_contract_tier_i: "@task_contract_tier_icon!"
 game_concept_task_contract_tier: "Úroveň $TASK_CONTRACT_CONTRACT$"
 game_concept_task_contract_tier_tier: "Úroveň"
 game_concept_task_contract_tier_desc: "$game_concept_task_contract_tier$ odráží [Concept('title_tier','úroveň titulu')|E] [Concept('contractor','zadavatele')|E].\n\n[Concept('barons','Baroni')|E] a [Concept('counts','hrabata')|E] mají jednu hvězdu, [Concept('dukes','vévodové')|E] dvě hvězdy a [Concept('kings','králové')|E] a [Concept('emperors','císaři')|E] tři hvězdy.\n\n$game_concept_contractors$ nenabídnou práci [Concept('adventurers','dobrodruhům')|E] s nedostatečnou [Concept('prestige_level','úrovní slávy')|E] pro jejich [Concept('rank','hodnost')|E]. Pokud jsi #EMP pouze#! [GetModifier( 'prestige_level_1' ).GetNameWithTooltip|L], pak o tobě [Concept('kings','králové')|E] a [Concept('emperors','císaři')|E] nebudou ani uvažovat.\n\nČím vyšší je $game_concept_task_contract_tier$, tím vyšší bude odměna — i když obtížnost úkolu bývá obecně také vyšší.\n\n#WEAK [Concept('personality','Osobnost')|E] ovlivňuje také odměnu: [GetTrait('greedy').GetName( GetNullCharacter )] [Concept('characters','postavy')|E] zaplatí méně než běžnou sazbu, zatímco [GetTrait('generous').GetName( GetNullCharacter )] nebo [GetTrait('profligate').GetName( GetNullCharacter )] $game_concept_characters$ zaplatí výrazně nad ní.#!"
 game_concept_governance_issue_i: "@task_contract_icon!"
 game_concept_governance_issue: "$TASK_CONTRACT_ISSUE$"
 game_concept_governance_issues: "$TASK_CONTRACT_ISSUE_PLURAL$"
 game_concept_governance_issue_possessive: "$TASK_CONTRACT_ISSUE_POSSESSIVE$"
 game_concept_governance_issues_possessive: "$TASK_CONTRACT_ISSUE_POSSESSIVE_PLURAL$"
 game_concept_governance_issue_desc: "$game_concept_governance_issue$ je úkol, který má vykonat [Concept('governor','guvernér')|E].\n\nZáležitost se v [Concept('province','provincii')|E] objevuje zhruba každých několik let a často se točí kolem problému, který musí $game_concept_governor$ vyřešit. Záležitosti však mohou představovat i příležitosti.\n\nÚspěšné vyřešení záležitostí obvykle uděluje [Concept('gold','zlato')|E], [Concept('influence','vliv')|E] a zkušenosti v [Concept('trait','rysu')|E] [GetTrait('governor').GetName(GetNullCharacter)]. Podle konkrétní záležitosti mohou být dostupné i další odměny.\n\nKaždý $game_concept_governance_issue$ má [Concept('governance_issue_tier_tier','úroveň')|E], která ovlivňuje poskytované odměny."
 game_concept_governance_issue_tier_i: "@task_contract_tier_icon!"
 game_concept_governance_issue_tier: "Úroveň $TASK_CONTRACT_ISSUE$"
 game_concept_governance_issue_tier_tier: "Úroveň"
 game_concept_governance_issue_tier_desc: "Každý [Concept('governance_issue','správní problém')|E] má $game_concept_governance_issue_tier$, která odráží celkové odměny za jeho úspěšné vyřešení. Vyřešení problému s vyšší úrovní obvykle přinese větší množství [Concept('gold','zlata')|E] nebo [Concept('influence','vlivu')|E] a také více zkušeností v [Concept('trait','rysu')|E] [GetTrait('governor').GetName(GetNullCharacter)]"
 game_concept_criminal_task_contract: "Zločinná zakázka"
 game_concept_criminal_task_contracts: "Zločinné zakázky"
 game_concept_criminal_task_contract_possessive: "Zločinné zakázky"
 game_concept_criminal_task_contracts_possessive: "Zločinných zakázek"
 game_concept_criminal_task_contract_desc: "$game_concept_criminal_task_contract$ obvykle zahrnuje pochybné zakázky, které mohou být výnosné, ale udělí ti @gallowsbait_icon![GetTrait('gallowsbait').GetName(GetNullCharacter)] [Concept('trait_level_track_xp','zkušenosti stupnice úrovně rysu')|E].\n\nZvyšování úrovně [Concept('trait','rysu')|E] $trait_gallowsbait$ způsobí, že tě většina světa bude více nenávidět a méně si tě vážit, a nakonec přiměje tvé [Concept('followers','družiníky')|E], kteří neschvalují tvé loupežnictví, aby dramaticky opustili tvé služby.\n\n#WEAK $trait_gallowsbait$ je silně negativní $game_concept_trait$, což znamená, že postava je drobný zločinec nejnižšího řádu — vražda u dvora má přece jen alespoň jakousi #EMP úroveň#!.\n\nLze jej očistit pomocí [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('wipe_slate_decision').GetName].#!"
 game_concept_justicar_task_contract: "Zakázka justiciára"
 game_concept_justicar_task_contracts: "Zakázky justiciára"
 game_concept_justicar_task_contract_possessive: "Zakázky justiciára"
 game_concept_justicar_task_contracts_possessive: "Zakázek justiciára"
 game_concept_justicar_task_contract_desc: "$game_concept_justicar_task_contract$ obvykle zahrnuje potírání zločinců, nastolování spravedlnosti a dodržování místního práva."
 game_concept_hireling_task_contract: "Námezdní zakázka"
 game_concept_hireling_task_contracts: "Námezdní zakázky"
 game_concept_hireling_task_contract_possessive: "Námezdní zakázky"
 game_concept_hireling_task_contracts_possessive: "Námezdních zakázek"
 game_concept_hireling_task_contract_desc: "$game_concept_hireling_task_contract$ obvykle zahrnuje práci najatých siláků, například ochranu vládců, kupců a posilování posádek."
 game_concept_diplomacy_task_contract: "Diplomatická zakázka"
 game_concept_diplomacy_task_contracts: "Diplomatické zakázky"
 game_concept_diplomacy_task_contract_possessive: "Diplomatické zakázky"
 game_concept_diplomacy_task_contracts_possessive: "Diplomatických zakázek"
 game_concept_diplomacy_task_contract_desc: "$game_concept_diplomacy_task_contract$ obvykle zahrnuje urovnávání místních sporů nebo vyjednávání výhodných dohod pomocí tvého důvtipu."
 game_concept_hunting_task_contract: "Lovecká zakázka"
 game_concept_hunting_task_contracts: "Lovecké zakázky"
 game_concept_hunting_task_contract_possessive: "Lovecké zakázky"
 game_concept_hunting_task_contracts_possessive: "Loveckých zakázek"
 game_concept_hunting_task_contract_desc: "$game_concept_hunting_task_contract$ obvykle zahrnuje pomoc místnímu vládci s vybíjením zvěře a posílením zásob."
 game_concept_stewardship_task_contract: "Správcovská zakázka"
 game_concept_stewardship_task_contracts: "Správcovské zakázky"
 game_concept_stewardship_task_contract_possessive: "Správcovské zakázky"
 game_concept_stewardship_task_contracts_possessive: "Správcovských zakázek"
 game_concept_stewardship_task_contract_desc: "$game_concept_stewardship_task_contract$ obvykle zahrnuje provedení soupisu obyvatelstva nebo dokonce výstavbu budov."
 game_concept_learning_task_contract: "Učenecká zakázka"
 game_concept_learning_task_contracts: "Učenecké zakázky"
 game_concept_learning_task_contract_possessive: "Učenecké zakázky"
 game_concept_learning_task_contracts_possessive: "Učeneckých zakázek"
 game_concept_learning_task_contract_desc: "$game_concept_learning_task_contract$ obvykle zahrnuje opisování textů nebo podporu činů solidarity."
