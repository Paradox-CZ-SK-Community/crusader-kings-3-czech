 game_concept_provincial_army: "Provinční armáda"
 game_concept_provincial_army_desc: "$game_concept_provincial_army$ je armáda naverbovaná a vydržovaná [Concept('governor','guvernérem')|E] v [Concept('realm','panství')|E] s [Concept('administrative','administrativní')|E] [Concept('government','vládou')|E].\n\nTvoří ji výhradně [Concept('title_men_at_arms','tituloví ozbrojenci')|E]. Účinnost [Concept('men_at_arms','ozbrojenců')|E] je ovlivněna [Concept('governor_efficiency','efektivitou guvernéra')|E] [Concept('governor','guvernéra')|E].\n\n[Concept('liege','Lenní pán')|E] může utratit [Concept('influence','vliv')|E], aby získal kontrolu nad armádami.\n\n[Concept('governors','Guvernéři')|E] si mohou za určitých okolností vypůjčit oddíly od sobě rovných, například pokud jsou [Concept('allies','spojenci')|E] nebo použijí [Concept('hook','páku')|E].\n\nVypůjčená armáda je vrácena, pokud [Concept('character','postava')|E], která si ji vypůjčila, zemře nebo ukončí všechny své probíhající [Concept('wars','války')|E]. Armády lze vrátit také ručně."
