 game_concept_reinforce_soldiers: "Ručně doplnit"
 game_concept_reinforcements: "Posily"
 game_concept_reinforce_soldiers_desc: "[Concept('adventurers','Dobrodruzi')|E] a [Concept('nomads','nomádi')|E] mohou verbovat [Concept('men_at_arms','ozbrojence')|E], ale ti se nedoplňují automaticky jako u [Concept('landed','zeměpanských')|E] [Concept('rulerpossessive','vládců')|E]. Místo toho je nutné lákat rekruty pomocí interakcí."
 game_concept_adventurer_siege_replenishment: "Doplnění po obléhání"
 game_concept_adventurer_siege_replenishment_desc: "Když [Concept('adventurer','dobrodruh')|E] úspěšně [Concept('sieges','oblehne')|E] [Concept('holding','državu')|E], část jeho [Concept('men_at_arms','ozbrojenců')|E] bude doplněna.\n\nVšechny [Concept('regiments','pluky')|E] ozbrojenců v [Concept('army','armádě')|E] budou doplněny o #V dvojnásobek#! hodnoty [Concept('loot','kořisti')|E] dané državy.\n\n#weak Toto navýšení tvoří noví rekruti, násilně odvedení místní a prostě zaplacení ti, kteří se během obléhání rozutekli.#!"
 game_concept_investment_cap: "Investiční kapacita"
 game_concept_investment_cap_desc: "Toto je maximum, které může postava investovat do vlastního nebo cizího [Concept('candidate_score','skóre kandidáta')|E] pro [Concept('governorship','guvernérství')|E].\n\nVěk, [Concept('powerful_family_rating_mid','hodnocení rodiny')|E], [Concept('influence_level','úroveň vlivu')|E] a [Concept('estate_buildings','budovy sídla')|E] jsou hlavní faktory, které tento limit určují. Děti mají k tomuto limitu malý škálující postih, zatímco limity dospělých s věkem rostou."
 game_concept_appointment_succession_law: "Zákon nástupnictví jmenováním"
 game_concept_appointment_succession_laws: "Zákony nástupnictví jmenováním"
 game_concept_appointment: "Jmenování"
 game_concept_appointments: "Jmenování"
 game_concept_appointment_succession: "Nástupnictví jmenováním"
 game_concept_appointment_succession_law_desc: "Podle $game_concept_appointment_succession_law$ zdědí [Concept('title','titul')|E] a s ním spojené [Concept('holdings','državy')|E] kandidát s nejvyšším [Concept('candidate_score','skóre kandidáta')|E].\n\nTypy jsou:\n$EFFECT_LIST_BULLET$[GetLaw('appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('acclamation_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('celestial_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('celestial_military_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('celestial_ministry_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('celestial_grand_marshal_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('meritocratic_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('meritocratic_military_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('japanese_appointment_succession_law').GetName]"
 game_concept_appointment_level: "Úroveň jmenování"
 game_concept_appointment_levels: "Úrovně jmenování"
 game_concept_appointment_level_desc: "$game_concept_appointment_level$ používají některé [Concept('appointment_succession_laws','zákony nástupnictví jmenováním')|E] jako požadavek, aby se [Concept('characters','postavy')|E] mohly stát způsobilými kandidáty.\n\nÚrovně vycházejí z úrovně určité měny a každý zákon může jako požadavek používat jinou měnu. [Concept('title','Titul')|E] vyšší úrovně bude obvykle vyžadovat vyšší úroveň.\n\n#weak Například: [GetLaw('celestial_appointment_succession_law').GetName] vyžaduje [Concept('merit','zásluhy')|E] - [Concept('duchy','vévodství')|E] vyžaduje [Concept('merit_level','úroveň zásluh')|E] [GetModifier( 'merit_level_3' ).GetNameWithTooltip|L] nebo vyšší, zatímco [Concept('kingdom','království')|E] vyžaduje [GetModifier( 'merit_level_5' ).GetNameWithTooltip|L] nebo vyšší.#!"
 game_concept_seize_peripheral_duchy: "Zabrat okrajové vévodství"
 game_concept_seize_peripheral_duchy_desc: "[Concept('casus_belli','Casus belli')|E] dostupný [Concept('rulers','vládcům')|E] sousedícím s [Concept('realm','panstvím')|E] spravovaným [Concept('government_bureaucratic_type','byrokratickým typem')|E] [Concept('government_form','formy vlády')|E].\n\nUmožňuje útočníkovi zabrat sousední [Concept('duchy','vévodství')|E], které leží mimo [Concept('de_jure','de iure')|E] hierarchii hlavního sídla obránce."
