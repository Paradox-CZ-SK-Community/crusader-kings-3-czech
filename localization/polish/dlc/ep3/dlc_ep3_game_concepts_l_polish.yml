 game_concept_intrigue_task_contract_desc: "$game_concept_intrigue_task_contract$ obvykle zahrnuje pomoc se záležitostmi od průzkumu až po útěky z vězení."
 game_concept_governor_efficiency: "Efektivita guvernéra"
 game_concept_governor_efficiency_i: "@governor_efficiency!"
 game_concept_governor_efficiency_desc: "$game_concept_governor_efficiency$ měří, jak dobře [Concept('governor','guvernér')|E] vykonává svou práci a jak dobře spravuje [Concept('holdings','državy')|E], které mu byly svěřeny.\n\nEfektivita ovlivňuje, kolik [Concept('taxes','daní')|E] a [Concept('levies','odvedenců')|E] daná $game_concept_holding$ poskytuje, a také účinnost [Concept('title_men_at_arms','titulových ozbrojenců')|E].\n\n$game_concept_governor_efficiency$ postavy je určena především jejími [Concept('skills','dovednostmi')|E] a [Concept('trait','rysem')|E] [GetTrait('governor').GetName( GetNullCharacter )]."
 game_concept_province_administration: "Správa provincie"
 game_concept_province_administration_desc: "Každá [Concept('province','provincie')|E] v [Concept('administrative','administrativním')|E] [Concept('realm','panství')|E] má $game_concept_province_administration$, kterou mohou [Concept('liege','lenní pán')|E] a [Concept('governor','guvernér')|E] nastavit, aby provincii specializovali.\n\nV každé provincii může být aktivní pouze jedna $game_concept_province_administration$."
