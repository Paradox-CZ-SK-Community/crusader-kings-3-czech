 game_concept_province: "Provincie"
 game_concept_province_desc: "$game_concept_province$ je [Concept('title','titul')|E] držený [Concept('governor','guvernérem')|E] uvnitř [Concept('realm','panství')|E] s [Concept('administrative_government','administrativní vládou')|E].\n\nProvincie má přidruženou [Concept('province_administration','správu provincie')|E], která výrazně ovlivňuje výhody, jež provincie poskytuje."
