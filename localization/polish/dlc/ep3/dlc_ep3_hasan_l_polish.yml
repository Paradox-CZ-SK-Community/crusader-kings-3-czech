l_polish:
 hasan_evangelize_the_faith: "Evangelizovat víru"
 hasan_evangelize_the_faith_desc: "Můj božský úkol je šířit slovo Alláha a jeho vyvoleného proroka."
 hasan_evangelize_the_faith_tooltip: "Pokusit se rozšířit svou [Concept('faith','víru')|E] v sousedním hrabství"
 hasan_evangelize_the_faith_confirm: "Vést kázání"
 hasan_agitate_the_populace: "Podněcovat místní obyvatelstvo"
 hasan_agitate_the_populace_desc: "Ne všichni v říši si uvědomují zlo svých vládců. Několik slov z posvátné knihy by je mělo nasměrovat správným směrem."
 hasan_agitate_the_populace_tooltip: "Pokusit se snížit [Concept('county_opinion','lidové mínění')|E] v sousedním hrabství."
 hasan_agitate_the_populace_confirm: "Uvidí pravdu"
 hasan_ignite_the_flames: "Zahájit revoluci"
 hasan_ignite_the_flames_desc: "Věřící jsou shromáždění a nastal čas ukončit zlo, jež vládne těmto zemím."
 hasan_ignite_the_flames_tooltip: "Vyhlásit [Concept('war','válku')|E] za účelem rozložení impéria"
 hasan_ignite_the_flames_confirm: "Nyní je náš čas"
 hasan_found_the_assassins: "Založit asasíny"
 hasan_found_the_assassins_desc: "Kacíři a rouhači sužují zemi a je zřejmé, že pouhá slova jim nestačí. Nastal čas přenést tento teologický konflikt do vojenské roviny; nepřátelé věřících pocítí čepel."
 hasan_found_the_assassins_tooltip: "Založ [Concept('military_holy_order','vojenský svatý řád')|E] na ochranu své [Concept('faith','víry')|E]"
 hasan_found_the_assassins_confirm: "Bismillah!"
 construct_assassin_castle_modifier: "Založení asasínů"
 construct_assassin_castle_modifier_desc: "Tato postava postavila dobře opevněný hrad pro nově vzniklé asasíny, kteří budou bojovat proti rouhačům a kacířům."
 hasan_expand_the_assassins: "Rozšířit asasíny"
 hasan_expand_the_assassins_desc: "Potřebujeme více panství, abychom rozšířili vliv asasínů. Odtud pak může přijít pád rouhačů."
 hasan_expand_the_assassins_tooltip: "Rozšiř svůj [Concept('military_holy_order','vojenský svatý řád')|E]"
 hasan_expand_the_assassins_confirm: "Nový domov"
 ULTIMATE_FOE: "Tvůj úhlavní nepřítel"
 story_hasan: "Legenda o Hasanovi Sabbahovi"
 story_hasan_desc: "Nejen armády — síla víry dokáže svrhnout říše a přepsat dějiny! Založíte Asasíny a zbavíte svůj lid seldžuckého jarma? Dokážete povstat a stát se Stařcem z Hory?"
 PROGRESS_TOWARDS_ASSASSIN_PATH: "Pokrok na cestě asasínů"
 hasan_sabbah.1000.t: "[CZAdjectiveSti(GetRiteByKey('ismaili').GetAdjectiveNoTooltip)|U] kazatelé"
 hasan_sabbah.1000.desc: "[amira.GetName|U], [Select_CString(amira.IsFemale,'věřící a stoupenkyně','věřící a stoupenec')] egyptského chalífy, v srdci [CZProvName(location,'G')] [Select_CString(amira.IsFemale,'hlásala','hlásal')] své neortodoxní pojetí islámu. O pravdě islámu a o tom, co hlásá [ROOT.Char.GetFaith.HighGodName], nepochybuji a nikdy předtím mě nenapadlo, že by tuto pravdu bylo možné najít jinde než ve víře [ROOT.Char.GetFaith.GetName]. Slova [amira.Custom('CZ_FirstNameNoTooltip_G')] mi ale znějí jinak.\n\nVětšinu zbytku dne strávím s [amira.Custom('CZ_FirstNameNoTooltip_I')] rozhovory o svatých knihách a hadísech a poprvé slyším pravdu v [GetRiteByKey('ismaili').GetAdjective|l] filozofii."
 hasan_sabbah.1000.a: "Podařilo se ti poranit a narušit mou víru."
 hasan_sabbah.1000.b: "Pravda nelze hledat mimo hranice islámu."
 hasan_sabbah.1010.t: "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip|U] Evangelizace"
 hasan_sabbah.1010.desc: "Lidé se sešli kolem mě v srdci [location.Custom('CZ_LandedNameNoTier_G')], jejich oči jsou matné v důsledku nedostatku světla, jež dává [ROOT.Char.GetFaith.HighGodName].\n\nMám naučené úryvky z [ROOT.Char.GetFaith.ReligiousText|U] a začínám mluvit..."
 hasan_sabbah.1010.a: "[ROOT.Char.GetFaith.HighGodName|U] je nejmilosrdnější a nejodpouštějící..."
 hasan_sabbah.1010.a.win: "Dav je přesvědčen"
 hasan_sabbah.1010.a.lose: "Dav není přesvědčen"
 hasan_sabbah.1020.t: "Božské povolání"
 hasan_sabbah.1020.desc: "Dnes mě přivítal posel od [ismaili_caliph.Custom('CZ_Name_G')] zdvořilým úklonem a poselstvím.\n\n„Chalífa slyšel o tvé velké práci zde a přeje si, abys dále [Select_CString(ROOT.Char.IsFemale,'studovala','studoval')] jako [ismaili_caliph.GetFaith.GetAdjective] misionář [CZPrepV(cairo.GetNameNoTierNoTooltip)] [cairo.Custom('CZ_LandedNameNoTier_L')].“"
 hasan_sabbah.1020.a: "[ROOT.Char.GetFaith.HighGodName|U] má tam pro mě plán."
 hasan_sabbah.1020.a.tt: "Přesuneš se do [cairo.GetProvince.GetBaronyNameExplicitly]"
 hasan_sabbah.1020.b: "Jsem nejvíce potřeba tam, kde právě jsem."
 hasan_sabbah.1022.t: "[GetRiteByKey('ismaili').GetAdjectiveNoTooltip|U] chalífát"
 hasan_sabbah.1022.desc: "Jsem tu teprve krátce, a už je mi jasné, že poměry v chalífátu jsou opravdu zlé. [nizar.GetFirstName|U], právoplatný a vyvolený nástupce [ismaili_caliph.Custom('CZ_Name_G')], byl vyřazen z nástupnické linie. Takovou budoucnost islámu prorok rozhodně nezamýšlel.\n\nLidské pletichy a lži zkazily záměr, který měl [ROOT.Char.GetFaith.HighGodName], a s tím je třeba něco udělat!"
 hasan_sabbah.1022.a: "Stojím po boku [nizar.GetFirstNameNoTooltip|U]!"
 hasan_sabbah.1022.b: "Musím setrvat."
 hasan_sabbah.1030.t: "Smrt chalífy"
 hasan_sabbah.1030.desc: "[ismaili_caliph.GetName|U] konečně spočinul v náruči, kterou nabízí [ROOT.Char.GetFaith.HighGodName], a je v pokoji, ale my, kteří jsme zůstali, se musíme vypořádat s břemenem [Select_CString(ismaili_caliph.IsFemale,'její','jeho')] nepřítomnosti. Politickými machinacemi a silami za hranicemi pochopení, "
 hasan_sabbah.1030.desc_caliph_heir: "$hasan_sabbah.1030.desc$ [new_ismaili_caliph.GetName] [Select_CString(new_ismaili_caliph.IsFemale,'nastoupila','nastoupil')] po [Select_CString(ismaili_caliph.IsFemale,'ní','něm')] $hasan_sabbah.1030.desc_outro$"
 hasan_sabbah.1030.desc_caliph_no_heir: "$hasan_sabbah.1030.desc$ chalífát nemá následníka $hasan_sabbah.1030.desc_outro$"
 hasan_sabbah.1030.desc_outro: ", a [GetRiteByKey('nizari').GetAdjective] nároky byly ignorovány.\n\nVím jistě, že [nizar.GetName] byl preferovaný kandidát, ale pokud vyslovím svou příslušnost, jistě si tím udělám nepřítele."
 hasan_sabbah.1030.a: "Nezahynu v nevíře!"
 hasan_sabbah.1030.b: "[new_ismaili_caliph.GetFirstNameNoTooltip|U] je právoplatným chalífou."
 hasan_sabbah.1030.c: "Podpořím jakéhokoli [CZAdjectiveDecline(GetRiteByKey('ismaili').GetAdjectiveNoTooltip,'ého')|l] kandidáta."
 hasan_sabbah.1031.t: "Nepřítel [ROOT.Char.GetFaith.GetNameNoTooltip|U]"
 hasan_sabbah.1031.desc: "Když dokončím kázání, přelétnu pohledem dav osvícených tváří, které na mě hledí. Myšlenkami se vracím k jejich pánovi, [seljuk_equivalent.Custom('CZ_FirstName_D')], který je odvedl z cesty, již ukazuje [ROOT.Char.GetFaith.HighGodName]. Zatímco si užívá rozmařilého života, [Select_CString(seljuk_equivalent.IsFemale,'její','jeho')] poddaní se plazí v prachu, odříznutí od pravdy Všemohoucího.\n\nUž to nedokážu snášet a toužím jen po tom, aby se [Select_CString(seljuk_equivalent.IsFemale,'její','jeho')] lid [Select_CString(seljuk_equivalent.IsFemale,'jí','ho')] zbavil a sjednotil se v [ROOT.Char.GetFaith.GetAdjective|l] filozofii!"
 hasan_sabbah.1031.a: "Musí zemřít!"
 hasan_sabbah.1031.b: "Cítím, že skutečný nepřítel je jinde..."
 hasan_sabbah.1040.t: "Strhující kázání"
 hasan_sabbah.1040.desc: "Otupělé nezaujaté oči davu bezvýrazně zírají mým směrem, zatímco držím svůj [ROOT.Char.GetFaith.ReligiousText|U] a připravuji se k řeči."
 hasan_sabbah.1040.a: "[ultimate_foe.GetFirstNameNoTooltip|U] je vtělením [ROOT.Char.GetFaith.DevilName|U]!"
 hasan_sabbah.1040.a.win: "$hasan_sabbah.1010.a.win$"
 hasan_sabbah.1040.a.lose: "$hasan_sabbah.1010.a.lose$"
 hasan_sabbah.1050.t: "Stařec z hory"
 hasan_sabbah.1050.desc: "Konečně bylo impérium [defender.Custom('CZ_Name_G')], [Select_CString(defender.IsFemale,'té','toho')] [defender.Custom2('CZ_InsultNoun_G', ROOT.Char)], posláno zpět do [ROOT.Char.GetFaith.NegativeAfterLife], kam patří. Na popelu říše ke mně mí stoupenci vzhlížejí s otázkou, jaká bude naše budoucnost a budoucnost víry [ROOT.Char.GetFaith.GetName].\n\nV chaosu, který po [defender.Custom('CZ_FirstNameNoTooltip_L')] zůstal, je [hasan_home.GetName] zralé k dobytí a mohlo by se stát základnou pro všechny naše budoucí podniky v regionu."
 hasan_sabbah.1050.a: "Tak začíná věk [hasan_home.Custom('CZ_LandedNameNoTierNoTooltip_G')|U]."
 hasan_sabbah.1050.b: "Pokračujeme v naší věčné bitvě."
 ep3_agitated_populace: "Rozrušené obyvatelstvo"
 ep3_agitated_populace_desc: "Charismatický kazatel nedávno vedl výbušné shromáždění, kde ostře kritizoval zlo vládnoucí třídy v tomto hrabství."
 ep3_religious_doubts: "Náboženské pochybnosti"
 ep3_religious_doubts_desc: "Charismatický misionář nedávno kázal své cizí náboženství v této provincii. Ačkoli neuspěl v obrácení většiny lidí, narušil víru prostých lidí v tradiční náboženství."
