l_polish:
 ep3_roman_restoration.0001.t: "Justiniánův sen"
 ep3_roman_restoration.0001.desc: "Teplý středomořský vzduch nese šeptání o impériu stojícím na prahu věčnosti.\n\nZde, v těchto proslulých zdech [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitly], volá ambice dávné éry. Justiniánův nesmrtelný sen — jeho neúnavné snažení o opětovné sjednocení roztříštěných pozůstatků Říma — mě přitahuje.\n\nJe to moje břemeno, nebo moje výsada vzkríšit tyto sny? Sešít roztržené domény pod jedním praporem, tak jak se kdysi snažil on?"
 ep3_roman_restoration.0001.a: "#EMP Ecce Romani!#!"
 ep3_roman_restoration.0001.a.tt: "Rozhodnutí [GetDecisionWithKey('restore_roman_empire_decision').GetName] [Concept('decision','rozhodnutí')|E] je nyní dostupné"
 ep3_roman_restoration.0100.t: "Justiniánův sen naplněn"
 ep3_roman_restoration.0100.desc: "Je to příznivý den, neboť dnes Římské impérium naplňuje svůj dávný potenciál.\n\nZe všech koutů impéria se ozývají výkřiky radosti a hrdosti: #EMP Ecce Romani! Hail Caesar!#!\n\nAvšak nyní musím řídit plachty tohoto rozsáhlého díla. Co uděláme s tímto Římem? Mezi mými mnoha předchůdci a nesčetnými podobami římské moci se výběr zužuje.\n\nBudeme pokračovat dál, věrni naší nedávné kultuře? Nebo plně přijmeme tradice našich předků?"
 ep3_roman_restoration.0100.a: "Nebudou žádná polovičatá řešení."
 ep3_roman_restoration.0100.b: "Ať je ve všem střídmost."
 ep3_roman_restoration.0100.c: "Můžeme se přizpůsobit, aniž ztratíme směr."
 ep3_roman_restoration.hard_mode: "@warning_icon! #XB;EMP Čekají tě tyto zkoušky:#! #indent_newline:4 #X \n$EFFECT_LIST_BULLET$Všechny [Concept('peasant_factions','selské frakce')|E] ve tvém [Concept('realm','panství')|E] se obrátí proti tobě\n$EFFECT_LIST_BULLET$Více [Concept('wars','válek')|E] ze strany ostatních královských [Concept('titles','titulů')|E]\n$EFFECT_LIST_BULLET$Rychlejší mongolský vpád#!#!"
 ep3_roman_restoration.end_hard_mode: "@alert_icon! #alert_bold Tyto zkoušky skončí, jakmile dobyjete celou mapu nebo přijmete [GetDecisionWithKey( 'split_roman_empire_decision' ).GetName] [Concept('decision','rozhodnutí')|E]"
 ep3_roman_restoration.invasion_cb: "Získáváte přístup k [Concept('pax_romana_invasion_casus_belli','casu belli Pax Romana')|E]"
 ep3_roman_restoration.household_gods_tenet: "[Concept('core_tenet','Zásada')|E] [GetTenetType('tenet_household_gods').GetBaseName] je odemčena pro [GetFaithByKey( 'hellenic_pagan' ).GetName]"
 ep3_roman_restoration.easy_mode: "#P;BOLD;EMP Hra bude pokračovat normálně#!"
 uses_custom_caesar_flavourization_tt: "Od nynějška budete známi jako #HIGH $custom_imperator_caesar_augustus$#!"
 may_choose_to_convert_hellenic_desc: "Může se rozhodnout konvertovat k víře [GetFaithByKey( 'hellenic_pagan' ).GetName]"
 ep3_roman_restoration.0101.intro: "Z císařského sídla [scoped_emperor.GetCapitalLocation.GetBaronyNameExplicitly] byla rukou [scoped_emperor.GetName] vydána deklarace. Vzdálené země, které kdysi patřily starověkým Římanům, jsou znovu sjednoceny [scoped_emperor.GetCulture.GetCollectiveNoun] s ambicemi stejně velikými jako u Caesarů z dávných dob.\n\n"
 ep3_roman_restoration.0101.hellenic: "Nebyly učiněny žádné polovičaté kroky. S oživením víry [scoped_emperor.GetFaith.GetName] jsou v honosných chrámech opět uctíváni staří bohové, znějí chorály, jež velebí bohy jako [scoped_emperor.GetFaith.HighGodName] a [scoped_emperor.GetFaith.KnowledgeGodName]. Tento návrat pohanských rituálů ostře kontrastuje s křesťanskou dominancí v Evropě a představuje odvážnou výzvu zavedeným náboženským řádům.\n\n"
 ep3_roman_restoration.0101.orthodox: "Korunovace, provázená mocnou podporou církve [scoped_emperor.GetFaith.GetName], byla slavnostním potvrzením božího práva a požehnal jí sám [scoped_emperor.GetFaith.GetReligiousHead.GetTitledFirstName]. Duchovní kořeny říše sahají hluboko a víra se v nich těsně proplétá s císařskými ambicemi.\n\n"
 ep3_roman_restoration.0101.fallback: "Ať už přijali netradiční vyznání, nebo se drží názorů svých předků, [scoped_emperor.GetTitleAsNameNoTooltip] [Select_CString(scoped_emperor.IsFemale,'ozdobila','ozdobil')] své vzestoupení jedinečnými obřady, které odrážejí jejich odlišné náboženské sklony a připravují půdu pro rozmanitou kulturní identitu v rámci impéria.\n\n"
 ep3_roman_restoration.0101.outro: "Nyní se nad světem stahuje stín mocné říše, slibující budoucnost, ve které bude zkoušena síla i odvaha jejích sousedů jako nikdy předtím."
 ep3_roman_restoration.0101.a: "[ROOT.Char.GetFaith.HighGodName] pomoz nám všem..."
 ep3_roman_restoration.0300.t: "Špatné vládnutí"
 ep3_roman_restoration.0300.desc: "„[Select_CString(ROOT.Char.IsFemale,'Má císařovno','Můj císaři')], nesu vážné zprávy. [Select_CString(inefficient_governor.IsFemale,'Přišla','Přišel')] jsem prosit o odpuštění za své pochybení. Některá opatření, která jsem [Select_CString(inefficient_governor.IsFemale,'zavedla','zavedl')], přinesla do [inefficient_governor.GetPrimaryTitle.Custom('CZ_LandedName_G')] neklid a zmatek,“ říká mi [inefficient_governor.GetTitledFirstName].\n\n„Trhy zejí prázdnotou, prostý lid si šeptá o vzpouře a místní šlechta zuří. Stabilita mého thematu visí na vlásku a v celé mé doméně prudce klesá přízeň lidu.“\n\n„Důvěra lidu ve vaši vládu teď kvůli [Select_CString(inefficient_governor.IsFemale,'jedné pomýlené','jednomu pomýlenému')] [inefficient_governor.Custom('CZ_TitleAsNameNoTooltip_D')] čelí nejtvrdší zkoušce...“"
 ep3_roman_restoration.0300.a: "To vyřeším osobně."
 ep3_roman_restoration.0300.a.success: "Obnovíte část oblíbenosti"
 ep3_roman_restoration.0300.a.failure: "Hrabství ztratí oblíbenost"
 ep3_roman_restoration.0300.b: "Jsi [Select_CString(inefficient_governor.IsFemale,'propuštěna','propuštěn')]."
 ep3_roman_restoration.0300.c: "Lev se nestará o názory ovcí."
 ep3_roman_restoration.0300.efficiency: "Stalo se to kvůli nízké [Concept('governor_efficiency','efektivitě guvernéra')|E] [inefficient_governor.Custom('CZ_Name_G')] #WEAK ([inefficient_governor.MakeScope.ScriptValue('governor_efficiency_presented')|0])#!"
 ep3_roman_restoration.0300.every_sub_realm_county: "Každé [Concept('county','hrabství')|E] držené [inefficient_governor.Custom('CZ_Name_I')]"
 ep3_story_cycle_restoring_rome_faction_discontent: "Obnova Říma: $VALUE|=+0$"
 ep3_restoring_rome_citizen_army_name: "Občanské vojsko"
 ep3_roman_restoration.0500.t: "Hraniční nájezdy"
 ep3_roman_restoration.0500.desc: "„[ROOT.Char.GetTitleAsNameNoTooltip|U], spěchám dnes před tebe, co mi nohy stačí,“ začíná můj [marshal.GetCouncilTitle|l] [marshal.GetFirstName]. „Naši zvědové hlásí, že vojska pod praporem [target_kingdom.Custom('CZ_LandedName_G')] pod rouškou noci překročila naše hranice.\n\nZa hlavní cíl si vybrali [target_county.Custom('CZ_LandedName_A')], plení naše země a ohrožují bezpečí našeho lidu. [target_kingdom.GetTitleAsNameNoTooltip|U] si zjevně myslí, že tak nesmírná a rozlehlá moc, jako jsme my, si takového provinění nevšimne.“"
 ep3_roman_restoration.0500.a: "Ať jen zkusí mé odhodlání. Uvidí, co najde."
 restore_rome_devastated_county_opinion_modifier: "Špatně spravované"
 restore_rome_lowered_county_opinion_modifier: "Otravné vládnutí"
 restore_rome_recuperated_county_opinion_modifier: "Uznáno císařem"
