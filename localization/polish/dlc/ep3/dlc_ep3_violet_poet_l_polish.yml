 ep3_story_cycle_violet_poet.0001.t: "Vhodný pro vysoké posty"
 ep3_story_cycle_violet_poet.0001.desc: "Po desetiletí jsem [Select_CString(ROOT.Char.IsFemale,'kráčela','kráčel')] ve stopách intelektuálů a [Select_CString(ROOT.Char.IsFemale,'čelila','čelil')] hněvu lidí. Má poezie neúprosně získávala na věhlasu, a přesto...\n\nNěco chybí. Teď, když se mi blíží podvečer života, není snad čas opustit [cordoba.GetName] a dopřát si širý rozhled po světě?\n\nDalší neoddělitelná část mě však stále táhne zůstat. Zde jsem si [Select_CString(ROOT.Char.IsFemale,'vybudovala','vybudoval')] život nejen pro sebe, ale i pro mnohé učně, kteří byli v průběhu let vychováváni.\n\nAť už kvůli učencům, kteří kráčejí jeho ulicemi, nebo známé patině jeho zdí, #EMP něco#! mě váže k tomuto městu, k mému domovu."
 ep3_story_cycle_violet_poet.0001.a: "Prozatím zůstanu v [cordoba.GetNameNoTooltip]."
 ep3_story_cycle_violet_poet.0001.a.tt: "Tohle je můj domov. Možná v jiném životě půjdu jinou cestou."
 ep3_story_cycle_violet_poet.0001.b: "Je čas odejít."
 ep3_story_cycle_violet_poet.0001.b.tt: "Pomyšlej na všechny příležitosti, které se teprve rozvinou!"
 ep3_story_cycle_violet_poet.0001.b.travel: "Začni svou cestu do [toledo.Custom('CZ_LandedName_G')]"
 artifact_double_moon_book: "Svazek dvojitého měsíce"
 artifact_double_moon_book_description: "Těžká, bohatě zdobená kniha plná poezie."
 artifact_double_moon_book_description_append: "$artifact_double_moon_book_description$ Stránky obsahují:\n"
 ep3_story_cycle_violet_poet.0002.t: "Budování odkazu"
 ep3_story_cycle_violet_poet.0002.desc: "Jedna věc mi už týdny vrtá v hlavě. Kdo bude pokračovat v mém odkazu? Kdo bude nadále mecenášem umění a vychovávat mládež v těchto způsobech?\n\nMám mnoho, co předat: [double_moon_book.GetName] je samozřejmě snadné, ale je toho mnohem víc. Poslední odkaz dynastie [ROOT.Char.GetHouse.GetName] je mnohem vážnější záležitost než i tenhle těžký svazek.\n\nAle to je vlastně jen blednoucí relikvie. Nejdůležitější je způsob života, životní síla každého básníka jako jsem já. Poezie, láska, ocenění světa, který kolem nás [Select_CString(EqualTo_string(ROOT.Char.GetFaith.HighGodHerHis,Localize('CHARACTER_HERHIS_HER')),'vytvořila','vytvořil')] [ROOT.Char.GetFaith.HighGodName]!\n\n#EMP To#! je něco, co musím najít. Někdo, kdo rozumí tomuto nehmotnému proudu světa."
 ep3_story_cycle_violet_poet.0002.a: "Bohužel takoví lidé jsou vzácní."
 ep3_story_cycle_violet_poet.0002.a.tt: "Přemýšlíš o tom..."
 ep3_story_cycle_violet_poet.0002.b: "Není třeba se tím zatím trápit."
 ep3_story_cycle_violet_poet.0002.b.flavor: "...i když bych se tomu [Select_CString(ROOT.Char.IsFemale,'měla','měl')] co nejdříve věnovat #EMP brzy#!."
 ep3_story_cycle_violet_poet.0002.b.tt: "@alert_icon! #alert_trial Pokud zemřeš dřív, než bude určen dědic, tvá dynastie může zaniknout!#!"
 ep3_story_cycle_violet_poet.0003.t: "Přemíra možností"
 ep3_story_cycle_violet_poet.0003.opening: "Jedním uchem naslouchám ostré básnické debatě linoucí se zvenčí. Koho mám vybrat?\n\n"
 ep3_story_cycle_violet_poet.0003.poet: "[heir1.GetFirstName], například. [Select_CString(heir1.IsFemale,'Její','Jeho')] cit pro metrum je tak instinktivní a působivý..."
 ep3_story_cycle_violet_poet.0003.diplomat: "[heir1.GetFirstName], například. [Select_CString(heir1.IsFemale,'Její','Jeho')] láska k poezii je tak zřejmá a vášnivá."
 ep3_story_cycle_violet_poet.0003.woman: "Nebo snad [heir2.GetFirstName]? Jako [Select_CString(heir2.IsFemale,'žena','muž')] by mým slovům, až odejdu, alespoň hluboce [Select_CString(heir2.IsFemale,'porozuměla','porozuměl')]."
 ep3_story_cycle_violet_poet.0003.young: "Nebo snad [heir2.GetFirstName]? Mladá duše je velice tvárná."
 ep3_story_cycle_violet_poet.0003.heir3: "\n\nZazní salva slov, ostrých a úsečných. Všimnu si, že [heir3.GetFirstName], nová tvář v salonu, dokončuje elegantní verš. Je [Select_CString(heir3.IsFemale,'mladá','mladý')],"
 ep3_story_cycle_violet_poet.0003.intelligent: "nesmírně inteligentní a "
 ep3_story_cycle_violet_poet.0003.beautiful: "výrazně krásná a"
 ep3_story_cycle_violet_poet.0003.ending: "a v próze tak [Select_CString(heir3.IsFemale,'nadaná','nadaný')]!\n\nSoudě podle hloučku obdivovatelů, který kolem sebe shromažďuje, je [Select_CString(heir3.IsFemale,'možná sama','možná sám')] tak trochu #EMP [Select_CString(heir3.IsFemale,'fialová','fialový')]#!..."
 ep3_story_cycle_violet_poet.0003.a: "[heir1.GetFirstNameNoTooltip] musí být mou volbou."
 ep3_story_cycle_violet_poet.0003.b: "[heir2.GetFirstNameNoTooltip] bude mým dědicem."
 ep3_story_cycle_violet_poet.0003.c: "Víte, je na tom něco s [heir3.Custom('CZ_FirstNameNoTooltip_I')]..."
 ep3_story_cycle_violet_poet.0004.t: "Vřelé vzpomínky"
 ep3_story_cycle_violet_poet.0004.desc: "Ach, [wallada.GetFirstName]! [Select_CString(wallada.IsFemale,'Má rádkyně, má přítelkyně, má inspirace','Můj rádce, můj přítel, má inspirace')]. Za jeden život [Select_CString(wallada.IsFemale,'jsi prožila','jsi prožil')] sto životů, a přesto se to zdá málo.\n\nRozbalím balíček, který mi [Select_CString(wallada.IsFemale,'zanechala','zanechal')], poslední z dlouhé řady [Select_CString(wallada.IsFemale,'jejích','jeho')] darů. Z obalu se vynoří [double_moon_book.GetName], [Select_CString(wallada.IsFemale,'její','jeho')] léta opečovávaná kniha poezie.\n\n[wallada.GetFirstNameNoTooltip|U] dlouho [Select_CString(wallada.IsFemale,'mluvila','mluvil')] o odkazu, který má žít dál, a teď chápu, že nést ho dál připadlo mně. Musím žít naplno, stejně jako [Select_CString(wallada.IsFemale,'ona','on')], a užít si každou radost, kterou život nabízí. A musím ji také zaznamenat ve verších, přímo na těchto stránkách."
 ep3_story_cycle_violet_poet.0004.a: "Udělám, co bude v mých silách."
 ep3_story_cycle_violet_poet.0010.title: "Muwashshah: báseň prodána"
 ep3_story_cycle_violet_poet.0011.title: "Muwashshah: báseň zachována"
 ep3_story_cycle_violet_poet.0011.message: "[double_moon_book.GetName] získává náhodný modifikátor"
 ep3_story_cycle_violet_poet.0012.title: "Muwashshah: báseň rozdána"
 ep3_story_cycle_violet_poet.1000.t: "Dary přírody"
 ep3_story_cycle_violet_poet.1000.desc: "Zdá se, že trochu času stráveného venku bylo to pravé. Vůně, zvuky a čerstvý vzduch dělají divy pro mou pohodu.\n\nNa té procházce mimo tábor narazím na krásný pramen v lese. Uklidňující šum potoka a listnaté stromy mě ukolébávají, až si uvědomím, že uběhly hodiny.\n\nCítím žaludek, který si stěžuje, a hlad roste. Na zpáteční cestě jsem [Select_CString(ROOT.Char.IsFemale,'minula','minul')] některé jedlé rostliny, ale je v tom jistá básnická stránka být [Select_CString(ROOT.Char.IsFemale,'sama a hladová','sám a hladový')]..."
 ep3_story_cycle_violet_poet.1000.a: "Těžkosti jsou skvělou inspirací!"
 ep3_story_cycle_violet_poet.1000.a.book: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Procházka mezi stromy'"
 ep3_story_cycle_violet_poet.1000.b: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych sesbírat zásoby."
 ep3_story_cycle_violet_poet.1005.t: "Skvělý učeň"
 ep3_story_cycle_violet_poet.1005.desc: "Procházejíc ulice [CZProvName(location,'G')], zastavím se před jedním z městských sirotčinců. Ucho mi píchne u známého zvuku recitujícího rýmu, linoucího se otevřenými dveřmi.\n\nPomalu vejdu a opřu se o zeď, poslouchám. Jeden z malých sirotků vede verbální souboj s druhým, s úctyhodnou horlivostí a dovedností pro někoho tak mladého.\n\nTohle dítě ovládá slova, jako by byla ostřím, rozřezávajíc infantilní bláboly soupeře.\n\nBravo, říkám, výborná práce!"
 ep3_story_cycle_violet_poet.1005.a: "„Ty, holčičko! Nechtěla bys místo, kde by ses učila?“"
 ep3_story_cycle_violet_poet.1005.a.tt: "Takový talent #EMP musím#! vzít pod svá křídla."
 ep3_story_cycle_violet_poet.1005.b: "To je ale příběh!"
 ep3_story_cycle_violet_poet.1005.b.book: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Sirotčí básník'"
 ep3_story_cycle_violet_poet.1005.c: "Možná můj tábor není vhodné místo pro děti."
 ep3_story_cycle_violet_poet.1005.c.tt: "Jejich talent je tak předčasně rozvinutý, že jej alespoň musím podpořit!"
 ep3_story_cycle_violet_poet.1010.t: "Romantika poezie"
 ep3_story_cycle_violet_poet.1010.desc: "Být [Select_CString(ROOT.Char.IsFemale,'přijata','přijat')] na dvoře [ruler.Custom('CZ_TitledFirstNameRegnal_G')] je velká čest. Moci [Select_CString(ruler.IsFemale,'jí','mu')] přednést některé ze svých starých básní je čest ještě větší.\n\nJenže když přede mnou stojí tak zářivá krása, jen těžko se soustředím na přednes. [ruler_spouse.GetFirstName|U], choť [ruler.Custom('CZ_FirstNameNoTooltip_G')], mě [Select_CString(ruler_spouse.IsFemale,'okouzlila','okouzlil')]: taková elegance, takový půvab! [Select_CString(ROOT.Char.IsFemale,'Zamilovala','Zamiloval')] jsem se do [Select_CString(ruler_spouse.IsFemale,'té ženy','toho muže')].\n\nMé vášně jsou hluboké. Chci milovat! Chci psát!"
 ep3_story_cycle_violet_poet.1010.a: "Možná bych [Select_CString(ruler_spouse.IsFemale,'jí','mu')] [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] nabídnout ‚soukromou hodinu poezie‘..."
 ep3_story_cycle_violet_poet.1010.a.success: "Je [Select_CString(ruler_spouse.IsFemale,'nadšená','nadšený')] z tvého 'rytmického vyjadřování'"
 ep3_story_cycle_violet_poet.1010.a.failure: "Zdvořile odmítne"
 ep3_story_cycle_violet_poet.1010.b: "Proč mě osud tak pokouší?"
 ep3_story_cycle_violet_poet.1010.b.book: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Zakázané ovoce'"
 ep3_story_cycle_violet_poet.1010.c: "Musím [Select_CString(ruler_spouse.IsFemale,'ji','ho')] mít!"
 ep3_story_cycle_violet_poet.1010.c.tt: "Zvyšuje [Concept('success_chance','šanci na úspěch')|E] tvé [GetScheme('courting').GetTypeName] [Concept('scheme','intriky')|E]"
 ep3_story_cycle_violet_poet.1015.t: "Zamilovaný následovník"
 ep3_story_cycle_violet_poet.1015.desc: "Šouravé kroky ohlásí, že mezi nás přichází [Select_CString(stranger.IsFemale,'cizinka','cizinec')], [Select_CString(stranger.IsFemale,'zemdlená a vyčerpaná','zemdlený a vyčerpaný')]. Usedne k našemu ohni, upije vody, kterou [Select_CString(stranger.IsFemale,'jí','mu')] nabídneme, a pak ke mně vzhlédne s oslnivým úsměvem.\n\n„Ty jsi [ROOT.Char.GetFirstNameNoTooltip], že? Celé dny tě hledám. Tvé básně mi změnily život tak, že to ani nedokážu prostými slovy popsat! Slovy, se kterými by sis ty #EMP rozhodně#! [Select_CString(ROOT.Char.IsFemale,'poradila','poradil')]!“\n\nŽe by mě někdo celé dny hledal jen proto, aby mi složil poklonu? Taková oddanost má v sobě cosi romanticky krásného."
 ep3_story_cycle_violet_poet.1015.a: "„Musím ti #EMP řádně#! poděkovat!“"
 ep3_story_cycle_violet_poet.1015.a.success: "Nadšeně souhlasí"
 ep3_story_cycle_violet_poet.1015.a.failure: "Znechuceně odejde"
 ep3_story_cycle_violet_poet.1015.b: "Takový světoběžník by se nám [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] hodit jako pomocník."
 ep3_story_cycle_violet_poet.1015.c: "Jaká milá slova!"
 ep3_story_cycle_violet_poet.1020.t: "Mlha, která všechno zastírá"
 ep3_story_cycle_violet_poet.1020.desc: "Jsem prokletý! Navzdory mým snahám byly poslední dny plné jen nepřetržité mlhy, která zastírá mou mysl.\n\nNa papír nepadají žádná slova, žádné romantické oddání, žádné ostré poznámky. Zdá se, že moje vlna inspirace konečně skončila.\n\nCo mám dělat? Jak se osvobodit od tohoto intelektuálního mučení!"
 ep3_story_cycle_violet_poet.1020.a: "Potřebuji někoho, kdo mě zásobí nápady."
 ep3_story_cycle_violet_poet.1020.a.tt: "Nemáš žádné [Concept('followers','družiníky')|E] s více než #high 20#! [Concept('diplomacy','diplomacie')|E]"
 ep3_story_cycle_violet_poet.1020.a.book: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Pomocné ruce'"
 ep3_story_cycle_violet_poet.1020.b: "Dokážu to překonat!"
 ep3_story_cycle_violet_poet.1020.b.success: "Zabralo"
 ep3_story_cycle_violet_poet.1020.b.failure: "Nezabralo"
 ep3_story_cycle_violet_poet.1020.c: "Možná je čas si odpočinout?"
 ep3_story_cycle_violet_poet.1020.c.success: "Najdeš místo klidu"
 ep3_story_cycle_violet_poet.1020.c.failure: "Tvoje mysl je stále zatemněná"
 ep3_story_cycle_violet_poet.1025.t: "Další generace"
 ep3_story_cycle_violet_poet.1025.desc: "Trávím mnoho času v mém salonu, ale velkou část zbývajícího času jsem na ulicích [CZProvName(location,'G')]. To mě často zavádí do sirotčinců, kde se starají o ty nešťastné děti, vysídlené válkou, hladem nebo prostě opuštěné.\n\nDnes vidím na hřišti mnoho nových tváří. Mé srdce, jako vždy, pláče pro tyto ubohé duše. Tolik z nich...\n\nMalý, tlumený hlas přeruší ticho. Malé [orphan.Custom('GirlBoy')] sedí v rohu a pohybuje rty u básně z roztrhaného pergamenu. Tak mladá, zjevně nepoučená, ale v těchto dětech by [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] být skutečný potenciál..."
 ep3_story_cycle_violet_poet.1025.a: "Nesmím nechat tento potenciál nevyužitý."
 ep3_story_cycle_violet_poet.1025.a.tt: "Musím je všechny adoptovat!"
 1025_every_orphan: "Všechny sirotky"
 ep3_story_cycle_violet_poet.1025.b: "Mohu si dovolit jen jednoho..."
 ep3_story_cycle_violet_poet.1025.b.tt: "Takže z toho musím udělat to nejlepší."
 ep3_story_cycle_violet_poet.1025.b.success: "Tvoje péče přináší ovoce"
 ep3_story_cycle_violet_poet.1025.c: "Místní vládce se o ně musí postarat."
 ep3_story_cycle_violet_poet.1025.c.tt: "Možná zabere [Select_CString(holder.IsFemale,'ji','ho')] zahanbit..."
 ep3_story_cycle_violet_poet.1025.c.success: "[holder.GetTitledFirstNameNoTooltip] přijímá břemeno"
 ep3_story_cycle_violet_poet.1025.c.failure: "[holder.GetTitledFirstNameNoTooltip] odmítá zaplatit"
 ep3_story_cycle_violet_poet.1030.t: "Vznešení a dobří"
 ep3_story_cycle_violet_poet.1030.desc: "Pozvání od urozeného dvora se neodmítá, a tak se ocitám v jednom z nejkrásnějších paláců [CZProvName(location,'G')]. Vítá mě [noblewoman.GetFirstName], [Select_CString(noblewoman.IsFemale,'celá rozrušená','celý rozrušený')].\n\n„Je to pro mě taková čest, že tě poznávám!“ vyhrkne. „Víš, potřebovala bych trochu doučování...“\n\nUkáže se, že [noblewoman.GetFirstNameNoTooltip] se snaží studovat poezii, ale s chabým úspěchem. S tak chabým, že by mi to mohlo dát do ruky jistou #EMP páku#!..."
 ep3_story_cycle_violet_poet.1030.a: "Vyučím tě."
 ep3_story_cycle_violet_poet.1030.b: "Bohužel na to nemám čas."
 ep3_story_cycle_violet_poet.1030.c: "Možná mohu nabídnout jiného učitele?"
 ep3_story_cycle_violet_poet.1030.c.tt: "Trochu mně, trochu [courtier_poet.GetFirstNameNoTooltip] za [Select_CString(courtier_poet.IsFemale,'její','jeho')] starosti..."
 ep3_story_cycle_violet_poet.2000.t: "Když padne tma"
 ep3_story_cycle_violet_poet.2000.desc: "Jak dny plynou, vzpomínám na vztahy své mládí. Jedno jméno se mi vrací do mysli; [zaydun.GetFirstName]. Ibn Zaydun, tak mu říkali, s jeho bystrým duchem a stříbrným jazykem.\n\nAch, ty dny posílání básní tam a zpět, cestování napříč krajinami jen kvůli jedné noci spolu. Dělá mě to [Select_CString(ROOT.Char.IsFemale,'nostalgickou','nostalgickým')]. Náš vztah možná nebyl dokonalý, ale vzpomínky na něj mám v srdci vřelé.\n\n[Select_CString(zaydun.IsFemale,'Ji','Jeho')] jsem [Select_CString(ROOT.Char.IsFemale,'neviděla','neviděl')] mnoho, mnoho let. [Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] jsem tak [Select_CString(ROOT.Char.IsFemale,'tvrdá','tvrdý')] při našem rozchodu, tak [Select_CString(ROOT.Char.IsFemale,'kousavá','kousavý')]. Lítost mě tíží."
 ep3_story_cycle_violet_poet.2000.a: "Možná bych [Select_CString(zaydun.IsFemale,'jí','mu')] [Select_CString(ROOT.Char.IsFemale,'měla','měl')] napsat dopis..."
 ep3_story_cycle_violet_poet.2000.a.tt: "Napsat poselství své dávné lásce"
 ep3_story_cycle_violet_poet.2000.a.book: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Okovy touhy'"
 ep3_story_cycle_violet_poet.2000.b: "Báseň na památku ztracené lásky. To uleví mé duši."
 ep3_story_cycle_violet_poet.2000.c: "Tyto časy jsou pryč. [Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych se pohnout dál."
 ep3_story_cycle_violet_poet.2001.t: "Ke měsíci na mé noční obloze,"
 ep3_story_cycle_violet_poet.2001.desc: "Dlouho jsem [Select_CString(zaydun.IsFemale,'očekávala','očekával')] i to nejmenší zmínění mého jména na tvých rtech.\n\nMé tělo zestárlo, ale mé srdce je stále takové jako v okamžiku, kdy jsi mě [Select_CString(ROOT.Char.IsFemale,'opustila','opustil')]; zmrzlé, rozbité, čeká na tvůj dotek, aby znovu zabušilo."
 ep3_story_cycle_violet_poet.2001.a: "Ó, můj drahý [zaydun.GetFirstNameNoTooltip]..."
 ep3_story_cycle_violet_poet.2001.a.flavor: "Musím [Select_CString(zaydun.IsFemale,'ji','ho')] znovu vidět."
 ep3_story_cycle_violet_poet.2001.a.tt: "Pozvi [zaydun.GetFirstNameNoTooltip] na návštěvu."
 ep3_story_cycle_violet_poet.2001.b: "To je... trochu moc."
 ep3_story_cycle_violet_poet.2005.t: "Znovu shledáni"
 ep3_story_cycle_violet_poet.2005.desc: "A najednou tam stojí, ve dveřích. Věk [Select_CString(zaydun.IsFemale,'ji','ho')] tolik změnil, a přece... vůbec. V tváři má víc vrásek, ale pořád je to ta tvář. Drží se o něco shrbeněji, ale pořád je to tělo, které mě kdysi tak pevně objímalo. Dokonce i způsob, jakým se pohybuje...\n\nA pohne se. Během okamžiku překoná vzdálenost mezi námi a já jsem znovu v [Select_CString(zaydun.IsFemale,'jejím','jeho')] náručí. Ten pocit je tak vzdálený, tak zapadlý prachem let a vybledlý světlem vzpomínek, a přece tak důvěrně známý.\n\nKdyž se od sebe neochotně odtrhneme, mám pocit, jako by se mi náhle vrátila část mě [Select_CString(ROOT.Char.IsFemale,'samé','samého')], o které jsem ani [Select_CString(ROOT.Char.IsFemale,'nevěděla','nevěděl')], že chybí, a staré rány se zacelily."
 ep3_story_cycle_violet_poet.2005.a: "„Nemohu uvěřit, že jsi to opravdu ty.“"
 ep3_story_cycle_violet_poet.2005.a.tt: "Nesmím si dovolit znovu se zamilovat..."
 ep3_story_cycle_violet_poet.2005.b: "No, jeho přítomnost sama o sobě zvyšuje prestiž mého salonu..."
 ep3_story_cycle_violet_poet.2010.t: "Společná práce"
 ep3_story_cycle_violet_poet.2010.desc: "Sedíme ve stínu, popíjíme čaj a smějeme se jako za starých časů. Vtip a důvtip [zaydun.Custom('CZ_FirstName_G')] jsou stále ostré jako břitva a léta neubrala nic z kouzla, kterým si mě kdysi [Select_CString(zaydun.IsFemale,'získala','získal')].\n\n„Co to tu máš?“ zeptá se a ukáže na [double_moon_book.GetName], která leží na stole vedle mě. Podám [Select_CString(zaydun.IsFemale,'jí','mu')] ji.\n\n„Krásné dílo. Píšeš stejně elegantně jako kdysi.“ [Select_CString(zaydun.IsFemale,'Její','Jeho')] potěšený úsměv mnou pořád trochu otřese. „[Select_CString(ROOT.Char.IsFemale,'Nechtěla','Nechtěl')] bys v příštích dnech napsat něco spolu? Pokud [Select_CString(zaydun.IsFemale,'taková stará žena','takový starý muž')] s tebou ještě udrží krok, samozřejmě.“"
 ep3_story_cycle_violet_poet.2010.a: "„Jsme už staří, [zaydun.GetFirstNameNoTooltip]. Ale s věkem přichází moudrost.“"
 ep3_story_cycle_violet_poet.2010.b: "„Pracuji sám/sama.“"
 ep3_story_cycle_violet_poet.2015.t: "Zase sbohem"
 ep3_story_cycle_violet_poet.2015.desc: "Posledních pár dní patřilo k nejšťastnějším v mém životě, ale všechno jednou končí. Zatímco se loučíme, služebník kolem nás odnáší další věci [zaydun.Custom('CZ_FirstName_G')]. Drží mé ruce ve svých.\n\n„Setkání s tebou vrátilo do mého života světlo.“ Odmlčí se – [Select_CString(zaydun.IsFemale,'nejslavnější mistryni','nejslavnějšímu mistru')] slova v celé Iberii najednou chybí slova. Místo toho sáhne do kapsy a vtiskne mi něco do dlaně.\n\n„Vezmi si to, prosím. Nic to není, jen drobnost, ale... když si ho občas navlékneš, udělá to mému srdci velkou radost. Až ho vyplníš svým prstem, vyplníš i prázdné místo v mém srdci, kde žije vzpomínka na tebe.“"
 ep3_story_cycle_violet_poet.2015.a: "„...zůstaň se mnou. Tady, [CZPrepV(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(ROOT.Char.GetCurrentLocation,'L')]. Ty #EMP musíš.#!“"
 ep3_story_cycle_violet_poet.2015.artifact: "[newly_created_artifact.GetDesc]\n\nJe to jednoduchý design, kromě jednoho detailu: na vnitřní straně je malý nápis, který zní „Pro mou lásku, poslední sen mé duše.“"
 ep3_story_cycle_violet_poet.2015.a.success: "Souhlasí, že zůstane"
 ep3_story_cycle_violet_poet.2015.a.failure: "Odmítne a odejde"
 ep3_story_cycle_violet_poet.2015.b: "Do té doby, má ztracená lásko."
 ep3_story_cycle_violet_poet.2015.b.tt: "...pokud se někdy znovu setkáme."
 ep3_story_cycle_violet_poet.2015.c: "Nemohu odpustit chyby minulosti."
 ep3_story_cycle_violet_poet.2015.c.tt: "Vina tě požírá"
 story_cycle_violet_poet: "Fialová básnířka"
 story_cycle_violet_poet_desc: "Jsi dcera chalífy z Córdoby a jedna z posledních Umajjovců. Procházíš bez závoje strohým světem a tříbíš mysl žen ze všech společenských vrstev."
