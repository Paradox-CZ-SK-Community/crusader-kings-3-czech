l_polish:
 chariot_race_ongoing_jp.0100.t: "Společné představení"
 chariot_race_ongoing_jp.0100.desc.intro: "Jak dav netrpělivě řve, mé oči jsou upřeny na [ROOT.Char.Custom2('RelationToMeShort', intent_target)], [intent_target.GetTitledFirstName],"
 chariot_race_ongoing_jp.0100.desc.courtier: "sedí v ubohém ochozu v dvorní sekci."
 chariot_race_ongoing_jp.0100.desc.count: "sedí ve skromném ochozu posetém [Select_CString(intent_target.IsFemale,'jejím','jeho')] služebnictvem."
 chariot_race_ongoing_jp.0100.desc.duke: "sedí uprostřed [Select_CString(intent_target.IsFemale,'její','jeho')] družiny v jednom z lepších ochozů."
 chariot_race_ongoing_jp.0100.desc.king: "obklopen [Select_CString(intent_target.IsFemale,'její','jeho')] družinou, která zabírá několik z nejlepších ochozů."
 chariot_race_ongoing_jp.0100.desc.important: "pohodlně [Select_CString(intent_target.IsFemale,'usazená','usazený')] ve velké lóži [ROOT.Char.GetTopLiege.Custom('CZ_TitleAsName_G')]."
 chariot_race_ongoing_jp.0100.desc.important_liege: "který sedí stranou v mé velké lóži."
 chariot_race_ongoing_jp.0100.desc.liege: "obklopen důvěrníky v [Select_CString(intent_target.IsFemale,'její','jeho')] velké lóži."
 chariot_race_ongoing_jp.0100.desc.target_personality.fan: "Sedí na samém okraji sedadla a dychtivě očekává začátek závodu."
 chariot_race_ongoing_jp.0100.desc.target_personality.wager: "Dříve jsem zaslechl, že [Select_CString(intent_target.IsFemale,'položila','položil')] tučnou sázku na [intent_target.MakeScope.Var('wager_target').Char.Custom('CZ_FirstName_A')] z [intent_target.Custom('GetChariotTeamColorPlural')] na [intent_target.Custom('GetWinPlaceShow')]."
 chariot_race_ongoing_jp.0100.desc.target_personality.bored: "Líně se ovívá a rozhlíží se po hipodromu, aniž by závod [Select_CString(intent_target.IsFemale,'ji','ho')] nějak zajímal."
 chariot_race_ongoing_jp.0100.desc.target_personality.fallback: "Baví se s diváky okolo o vyhlídkách svého vozataje."
 chariot_race_ongoing_jp.0100.desc: "\n\nJak kolem našich tribun projíždějí [Glossary( 'téthrippa', 'QUADRIGA_GLOSS')], [Select_CString(intent_target.IsFemale,'její','jeho')] hlava se otočí směrem ke mně, aby je sledovala."
 chariot_race_ongoing_jp.0100.b.fan: "„Uctěte své patrony! Zmávejte! Co to #EMP vy#! děláte?!“"
 chariot_race_ongoing_jp.0100.b.wager: "„No tak, #EMP [intent_target.MakeScope.Var('wager_target').Char.GetFirstNameNoTooltip]#!! [intent_target.Custom('GetChariotTeamColorPlural')|U]! [intent_target.Custom('GetChariotTeamColorPlural')|U]!“"
 chariot_race_ongoing_jp.0100.b.bored: "Načasované zívnutí a převalení očima."
 chariot_race_ongoing_jp.0100.b: "Pošlu [Select_CString(intent_target.IsFemale,'jí','mu')] vzkaz."
 chariot_race_ongoing_jp.0100.b.tt.success: "[intent_target.GetFirstNameNoTooltip] oceňuje tvůj styl"
 chariot_race_ongoing_jp.0100.b.tt.neutral: "[intent_target.GetFirstNameNoTooltip] vás ignoruje"
 chariot_race_ongoing_jp.0100.b.tt.failure: "[intent_target.GetFirstNameNoTooltip] vás odmítá"
 chariot_race_ongoing_jp.0100.d.best.tt: "[intent_target.GetTitledFirstName] už má jedno z nejlepších míst"
 chariot_race_ongoing_jp.0100.d.better.tt: "[intent_target.GetTitledFirstName] už má lepší místo než vy"
 chariot_race_ongoing_jp.0100.d: "Kývnu na [Select_CString(intent_target.IsFemale,'ni','něj')], ať přijde sem, tahle místa jsou lepší!"
 chariot_race_ongoing_jp.0100.d.host_flavor: "Kdo by odolal místu v Kathismě?"
 chariot_race_ongoing_jp.0100.d.tt.success: "[intent_target.GetFirstNameNoTooltip] je v sedmém nebi"
 chariot_race_ongoing_jp.0100.d.tt.partial_success: "[intent_target.GetFirstNameNoTooltip] je polichocen"
 chariot_race_ongoing_jp.0100.d.tt.failure: "[intent_target.GetFirstNameNoTooltip] je prostě vděčný"
 chariot_race_ongoing_jp.0100.d.tt.critical_failure: "[intent_target.GetFirstNameNoTooltip] vás ignoruje"
 chariot_race_ongoing_jp.0100.e: "Přikývnutí jako uznání by mělo stačit."
 chariot_race_ongoing_jp.0100.e.host: "Přikývnutí může hodně znamenat."
 chariot_race_ongoing_jp.0200.t: "Císařská směsice"
 chariot_race_ongoing_jp.0200.desc.intro: "Mezi ochozy se mísí množství císařských vazalů, úředníků a povalečů, všichni zdánlivě tu, aby si užili závod. Ve skutečnosti je toto jedno z nejlepších míst v říši na uzavírání dohod, rozšiřování vlivu a možná i na to, aby se někdo vyšplhal po mastném žebříku.\n\n[Select_CString(other.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', other)], [other.GetFirstName],"
 chariot_race_ongoing_jp.0200.desc.same_rank_ruler: " [other.GetTitleAsName] ve službách [other.GetTopLiege.Custom('CZ_TitleAsNameNoTooltip_G')] stejně jako já, $chariot_race_ongoing_jp.0200.desc.party_intro$ a to je příležitost probrat #EMP naléhavé záležitosti#!, které se týkají [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] i [other.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')]."
 chariot_race_ongoing_jp.0200.desc.same_rank_courtier: "další společenský lezec čekající na svou šanci, sedí poblíž — možná si budeme moci být navzájem užiteční..."
 chariot_race_ongoing_jp.0200.desc.higher_rank: "$chariot_race_ongoing_jp.0200.desc.landed_intro$ $chariot_race_ongoing_jp.0200.desc.party_intro$ a i když nepatří k velikánům říše, [other.GetPrimaryTitle.GetNameNoTier] by mohlo [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_D')] přinést #EMP něco#! užitečného..."
 chariot_race_ongoing_jp.0200.desc.lower_rank: "$chariot_race_ongoing_jp.0200.desc.landed_intro$ $chariot_race_ongoing_jp.0200.desc.party_intro$ a to je vzácná příležitost pohybovat se mezi mocnými – [other.GetPrimaryTitle.GetNameNoTier] má v říši #EMP mnohem#! větší vliv než [ROOT.Char.GetPrimaryTitle.GetNameNoTier]."
 chariot_race_ongoing_jp.0200.desc.lower_rank_courtier: "obyčejný společenský šplhoun čekající na svou šanci, sedí poblíž — i to nejponíženější stvoření může mít své využití..."
 chariot_race_ongoing_jp.0200.desc.landed_intro: "[other.GetTitleAsName] ve službách [other.GetTopLiege.Custom('CZ_TitleAsNameNoTooltip_G')],"
 chariot_race_ongoing_jp.0200.desc.party_intro: "si [Select_CString(other.IsFemale,'zabrala','zabral')] blízký ochoz pro [Select_CString(other.IsFemale,'její','jeho')] družinu,"
 chariot_race_ongoing_jp.0200.a: "Jsem si jistý, že se od sebe můžeme mnohému naučit."
 chariot_race_ongoing_jp.0200.b: "[Select_CString(ROOT.Char.IsFemale,'Nemohla','Nemohl')] bych si přát lepšího souseda!"
 chariot_race_ongoing_jp.0200.b.success: "[other.GetFirstNameNoTooltip] je [Select_CString(other.IsFemale,'okouzlena','okouzlen')]"
 chariot_race_ongoing_jp.0200.b.partial_success: "[other.GetFirstNameNoTooltip] je [Select_CString(other.IsFemale,'potěšena','potěšen')]"
 chariot_race_ongoing_jp.0200.b.failure: "[other.GetFirstNameNoTooltip] je [Select_CString(other.IsFemale,'zaskočena','zaskočen')]"
 chariot_race_ongoing_jp.0200.c: "Mám štěstí, že mám tak hezkého souseda."
 chariot_race_ongoing_jp.0200.c.success: "[other.GetFirstNameNoTooltip] je [Select_CString(other.IsFemale,'okouzlena','okouzlen')]"
 chariot_race_ongoing_jp.0200.c.partial_success: "[other.GetFirstNameNoTooltip] je [Select_CString(other.IsFemale,'potěšena','potěšen')]"
 chariot_race_ongoing_jp.0200.c.failure: "[other.GetFirstNameNoTooltip] je [Select_CString(other.IsFemale,'zaskočena','zaskočen')]"
 chariot_race_ongoing_jp.0200.d: "Kreditní linky jsou vždy vítány."
 chariot_race_ongoing_jp.0200.d.tt: "Tvá [Concept('rank','hodnost')|E] musí být jiná než hodnost [other.Custom('CZ_TitledFirstName_G')]"
 chariot_race_ongoing_jp.0200.e: "Dluh otevírá mnoho dveří, pokud je správně řízen."
 chariot_race_ongoing_jp.0200.f: "Skvělé místo pro obchod s tajemstvími."
 chariot_race_ongoing_jp.0200.f.available_tt: "Tato možnost je dostupná, protože znáš [Concept('secret','tajemství')|E] [given_secret.GetOwner.Custom('CZ_TitledFirstName_G')] ([given_secret.GetName])"
 chariot_race_ongoing_jp.0200.f.tt: "[other.GetTitledFirstName] vám může na oplátku odhalit [Concept('secret','tajemství')|E]"
 chariot_race_ongoing_jp.0200.f.success: "[other.GetTitledFirstName] vám prozradí tajemství"
 chariot_race_ongoing_jp.0200.f.failure: "[other.GetTitledFirstName] nic neodhalí"
 chariot_race_ongoing_jp.0200.g: "Má služba by [Select_CString(other.IsFemale,'jí','mu')] mohla otevřít dveře."
 chariot_race_ongoing_jp.0200.h: "Raději si jen vychutnám závod."
 chariot_race_ongoing_jp.0201.t: "Výběr společnosti"
 chariot_race_ongoing_jp.0201.desc.intro: "Zatímco davy přetékají ochozy a šlechta se plazí přes svá privilegovaná místa, zde v [Glossary( 'Kathisma', 'KATHISMA_GLOSS')] si můžeme naštěstí užít klid. Služebníci nesoucí veškeré občerstvení jsou připraveni plnit naše rozmary, zatímco jezdečtí vozatajové pod námi provozují své nebezpečné řemeslo.\n\n"
 chariot_race_ongoing_jp.0201.desc.emperor: "Mezi těmi, kdo se dnes přidali do mé lóže, je [Select_CString(other.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', other)], [other.GetTitledFirstName], zjevně se vyhřívající ve výhodném přístupu ke mně a v tom, co to znamená."
 chariot_race_ongoing_jp.0201.desc.other_emperor: "Mám štěstí, že mám vlastní místo v lóži [ROOT.Char.GetTopLiege.Custom('CZ_TitleAsNameNoTooltip_G')] – vytouženou příležitost získat přízeň [Select_CString(other.IsFemale,'mé','mého')] [ROOT.Char.Custom2('CZ_RelationToMeShort_G', other)|l]."
 chariot_race_ongoing_jp.0201.desc.other: "Mezi ostatními, jimž je dána vstupenka, je [Select_CString(other.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', other)], [other.GetTitledFirstName], který sedí poblíž a zjevně si užívá exkluzivity."
 chariot_race_ongoing_jp.0201.desc: "Možná by si [Select_CString(other.IsFemale,'přála','přál')] popovídat..."
 chariot_race_ongoing_jp.0201.a: "To jsou ti nejlepší lidé."
 chariot_race_ongoing_jp.0201.b: "Pojď, [other.GetFirstNameNoTooltip], posaď se vedle mě."
 chariot_race_ongoing_jp.0201.b.tt: "Tato možnost je dostupná, protože jsi [THIS.Char.GetTitleAsNameNoTooltip|V]"
 chariot_race_ongoing_jp.0201.c: "Skvělé místo pro obchod s tajemstvími."
 chariot_race_ongoing_jp.0201.d: "Myslím, že bychom měli mít lóži jen pro sebe."
 chariot_race_ongoing_jp.0201.e: "Povídat si místo vychutnávání tohoto výhledu by byla ostuda."
 chariot_race_ongoing_jp.0201.f: "To je ta nejlepší společnost!"
 chariot_race_ongoing_jp.0201.h: "Dnes záříš, [other.GetFirstNameNoTooltip]."
 chariot_race_ongoing_jp.0300.t: "Získání přístupu"
 chariot_race_ongoing_jp.0300.desc.intro: "Ačkoliv my, šlechta, máme nejlepší ochozy na hippodromu, nic se nevyrovná vyvýšeným sedadlům v [Glossary( 'Kathisma', 'KATHISMA_GLOSS')] a všemu, co to představuje.\n\nSpolu se svou blízkou rodinou občas [host.GetTitleAsNameNoTooltip] uděluje přístup těm, kteří si získají [Select_CString(host.IsFemale,'její','jeho')] přízeň, nebo těm, kdo ho/ji dokážou nějak přesvědčit..."
 chariot_race_ongoing_jp.0300.a: "Prostě se #EMP zeptám#!."
 chariot_race_ongoing_jp.0300.a.tt: "[THIS.Char.GetShortUIName|U] vstoupí do Kathismy"
 chariot_race_ongoing_jp.0300.a.success: "[host.GetFirstNameNoTooltip] vám uděluje přístup"
 chariot_race_ongoing_jp.0300.a.failure: "[host.GetFirstNameNoTooltip] odmítá"
 chariot_race_ongoing_jp.0300.b: "Dárek může otevřít mnoho dveří."
 chariot_race_ongoing_jp.0300.b.success: "[host.GetTitledFirstName] souhlasí"
 chariot_race_ongoing_jp.0300.b.failure: "[host.GetTitledFirstName] odmítá"
 chariot_race_ongoing_jp.0300.c: "Naštěstí mi #EMP dluží#! laskavost."
 chariot_race_ongoing_jp.0300.d: "Pch, nebudu se podbízet."
 chariot_race_ongoing_jp.0301.t: "Žádost o přístup"
 chariot_race_ongoing_jp.0301.desc.intro: "Ač šlechta má nejlepší ochozy, nic se nevyrovná vyvýšeným sedadlům v mé [Glossary( 'Kathisma', 'KATHISMA_GLOSS')] a všemu, co to představuje.\n\nKaždý z nich po takovém místě touží, a zdá se, že nikdo víc než [weasel.GetName],"
 chariot_race_ongoing_jp.0301.desc.ask: "[Select_CString(weasel.IsFemale,'která vložila','který vložil')] prosebný lístek do rukou palácové stráže..."
 chariot_race_ongoing_jp.0301.desc.gold: "\n\n[Select_CString(ROOT.Char.IsFemale,'Slyšela','Slyšel')] jsem ale, že je [Select_CString(weasel.IsFemale,'docela bohatá','docela bohatý')]."
 chariot_race_ongoing_jp.0301.desc.hook: "[Select_CString(weasel.IsFemale,'která','který')] si s obvyklou neomaleností vybírá dluh, který u [Select_CString(weasel.IsFemale,'ní','něj')] mám..."
 chariot_race_ongoing_jp.0301.a: "Dobře, pusťte [Select_CString(weasel.IsFemale,'ji','ho')] dovnitř."
 chariot_race_ongoing_jp.0301.b: "Taková privilegia stojí určité náklady..."
 chariot_race_ongoing_jp.0301.b.success: "[weasel.GetTitledFirstName] zaplatí"
 chariot_race_ongoing_jp.0301.b.failure: "[weasel.GetTitledFirstName] odmítá"
 chariot_race_ongoing_jp.0301.b.tt: "[weasel.GetTitledFirstName] si nemůže dovolit dar #weak (@gold_icon![THIS.Char.MakeScope.ScriptValue('minor_gold_value')|0])#!"
 chariot_race_ongoing_jp.0301.c: "Zdá se, že nemám moc na výběr..."
 chariot_race_ongoing_jp.0301.d: "Myslím, že ne."
 chariot_race_ongoing_jp.0400.t: "Další kolo"
 chariot_race_ongoing_jp.0400.intro: "Obsluha odhodí [ROOT.Char.Custom('GetChariotMiddlingLapCount')] delfíní značku, když [first_place_charioteer.GetFirstName] z [first_place_charioteer.Custom('GetChariotTeamColorPlural')]"
 chariot_race_ongoing_jp.0400.intro_flavor1: "proletí kolem třpytivých soch dávných vozatajů, krátce zvedne [Select_CString(first_place_charioteer.IsFemale,'její','jeho')] ruku s bičem v předčasném triumfu."
 chariot_race_ongoing_jp.0400.intro_flavor2: "řítí se kolem bariéry, sotva udrží rovnováhu, a přivádí zuřivé křičení davu na nové vrcholy."
 chariot_race_ongoing_jp.0400.intro_flavor3: "hná [Select_CString(first_place_charioteer.IsFemale,'její','jeho')] svoji skřípající smečku koní neúprosně dál, bič se leskne jako nástroj, jímž vládne [ROOT.Char.GetFaith.HighGodName]."
 chariot_race_ongoing_jp.0400.intro_flavor4: "projede kolem nich, pohlédne přes [Select_CString(first_place_charioteer.IsFemale,'její','jeho')] rameno pohledem, který je stejně výsměšný jako znepokojený."
 chariot_race_ongoing_jp.0400.intro_flavor5: "smýká se kolem zatáčky na smyku. Sekce, které se nedusí v obrovském mraku prachu, který [Select_CString(first_place_charioteer.IsFemale,'zvedla','zvedl')], bouří radostí."
 chariot_race_ongoing_jp.0400.second1: "\n\n[second_place_charioteer.GetFirstName|U] se [Select_CString(first_place_charioteer.IsFemale,'jí','mu')] drží těsně v patách,"
 chariot_race_ongoing_jp.0400.second2: "\n\nJen pár sáhů za nimi víří tentýž písek koně [second_place_charioteer.Custom('CZ_FirstName_G')],"
 chariot_race_ongoing_jp.0400.second3: "\n\n[second_place_charioteer.GetFirstName|U] zaostává jen lehce a možná se ještě přiblíží,"
 chariot_race_ongoing_jp.0400.second4: "\n\nTéměř přímo za [Select_CString(first_place_charioteer.IsFemale,'ní','ním')] se ženou rozdivočelí hřebci [second_place_charioteer.Custom('CZ_FirstName_G')],"
 chariot_race_ongoing_jp.0400.second5: "\n\n[second_place_charioteer.GetFirstName|U] je poněkud vzadu, ale rozhodně ne nenapravitelně,"
 chariot_race_ongoing_jp.0400.third1: "a v patách [Select_CString(second_place_charioteer.IsFemale,'jí','mu')] je [Select_CString(third_place_charioteer.IsFemale,'velmi odhodlaná','velmi odhodlaný')] [third_place_charioteer.GetFirstName]."
 chariot_race_ongoing_jp.0400.third2: "zatímco [third_place_charioteer.GetFirstName] se řítí za nimi, hledá příležitost."
 chariot_race_ongoing_jp.0400.third3: "zatímco [third_place_charioteer.GetFirstName] je těsně za nimi, koně zdánlivě na dosah."
 chariot_race_ongoing_jp.0400.third4: "zatímco [third_place_charioteer.GetFirstName] netrpělivě tlačí, hledá příležitost k předjetí."
 chariot_race_ongoing_jp.0400.third5: "zatímco [third_place_charioteer.GetFirstName] se pomalu přibližuje bokem, zoufale se snaží předjet."
 chariot_race_ongoing_jp.0400.winning_place: "\n\nÓ, [ROOT.Char.GetFaith.FateGodName]! Kéž by [wager_target.GetFirstNameNoTooltip] [Select_CString(wager_target.IsFemale,'mohla','mohl')] jen udržet své místo!"
 chariot_race_ongoing_jp.0400.losing_place: "\n\nÓ, [ROOT.Char.GetFaith.FateGodName]! Co to děláš na #EMP [wager_target.Custom('GetChariotRacePlacement')]#! místě, [wager_target.GetFirstNameNoTooltip]?!"
 chariot_race_ongoing_jp.0400.out: "\n\nMohu jen sklesle přemítat o své lítostivé sázce na [wager_target.Custom('CZ_FirstName_A')]..."
 chariot_race_ongoing_jp.0400.a: "#EMP Do toho [wager_target.GetFirstNameNoTooltip]#!!"
 chariot_race_ongoing_jp.0400.b: "Příště vsadím lépe, to je jisté..."
 chariot_race_ongoing_jp.0400.c: "To je závod!"
 chariot_race_ongoing_jp.0400.d: "#EMP Do toho! JEĎ, [Select_CString(wager_target.IsFemale,'HOLKO','CHLAPE')]!#!"
 chariot_race_ongoing_jp.0500.t: "Předvádění se"
 chariot_race_ongoing_jp.0500.intro: "Všechny oči sledují vůz [first_place_charioteer.Custom('CZ_FirstName_G')] a pevné vedení, které si [Select_CString(first_place_charioteer.IsFemale,'vybudovala','vybudoval')],"
 chariot_race_ongoing_jp.0500.first: "a [Select_CString(evil_knievel.IsFemale,'ona','on')] to dobře ví, neboť"
 chariot_race_ongoing_jp.0500.last: "když [evil_knievel.GetFirstName], daleko vzadu na posledním místě,"
 chariot_race_ongoing_jp.0500.high: "když [evil_knievel.GetFirstName], ne příliš vzadu,"
 chariot_race_ongoing_jp.0500.middle: "když [evil_knievel.GetFirstName], ztracen uprostřed,"
 chariot_race_ongoing_jp.0500.low: "když [evil_knievel.GetFirstName] [Select_CString(evil_knievel.IsFemale,'zaostala','zaostal')] mezi poraženými,"
 chariot_race_ongoing_jp.0500.trick_flavor1: "náhle vyskočí na příď svého vozu, řídí jednou rukou a druhou mává do hlediště!"
 chariot_race_ongoing_jp.0500.trick_flavor2: "poskakuje ve voze, a [Select_CString(evil_knievel.IsFemale,'otočena','otočen')] zády dopředu dál řídí a posílá do hlediště polibky!"
 chariot_race_ongoing_jp.0500.trick_flavor3: "vyrazí z [Select_CString(evil_knievel.IsFemale,'jejímu','jeho')] vozu na hřbet vedoucího koně, ruku zvedne v triumfu!"
 chariot_race_ongoing_jp.0500.trick_flavor4: "vyskakuje z [Select_CString(evil_knievel.IsFemale,'jejímu','jeho')] vozu na hřbet vedoucího koně, mává do ochozů!"
 chariot_race_ongoing_jp.0500.filler: "\n\nDavy řvou radostí"
 chariot_race_ongoing_jp.0500.overtake: "ale [overtaking_charioteer.GetFirstName] není tolik [Select_CString(overtaking_charioteer.IsFemale,'potěšena','potěšen')]: když spatří příležitost, rychle předjíždí na [overtaking_charioteer.Custom('GetChariotRacePlacement')] místo."
 chariot_race_ongoing_jp.0500.maintained: "když [evil_knievel.GetFirstNameNoTooltip] nějak udržuje své místo a odrazuje předjíždění, navzdory všemu!"
 chariot_race_ongoing_jp.0500.maintained_last: "zdá se, že chce aspoň #EMP trochu#! slávy, i kdyby [Select_CString(evil_knievel.IsFemale,'měla','měl')] dojet poslední."
 chariot_race_ongoing_jp.0500.dead: "Jásot dosahuje horečnaté intenzity, když [evil_knievel.GetFirstName] náhle ztratí rovnováhu! Řehotající chumel dřeva, koní a prachu se valí po písku a naráží do bariér..."
 chariot_race_ongoing_jp.0500.alive: "[evil_knievel.GetFirstName] elegantně se vrací do běžné pozice vozataje, usmívá se jako král, zatímco hippodrom omdlévá."
 chariot_race_ongoing_jp.0500.alive_overtaken: "[evil_knievel.GetFirstName] se rychle vrací na své místo a třese pěstí na toho, kdo [Select_CString(evil_knievel.IsFemale,'ji','ho')] předjel."
 chariot_race_ongoing_jp.0500.loss_dead: "\n\nZakryju si obličej dlaněmi... „Ty blázne, [evil_knievel.GetFirstNameNoTooltip]... !“"
 chariot_race_ongoing_jp.0500.loss: "\n\nS údivem hledím. „Ty #EMP hlupáku#!, [evil_knievel.GetFirstNameNoTooltip]!“"
 chariot_race_ongoing_jp.0500.gain: "\n\nCha! To [Select_CString(evil_knievel.IsFemale,'ji','ho')] naučí dělat ze sebe šaška."
 chariot_race_ongoing_jp.0500.a: "Taková bravura!"
 chariot_race_ongoing_jp.0500.b: "Ó, #EMP [ROOT.Char.GetFaith.HighGodName]#!!"
 chariot_race_ongoing_jp.0500.c: "Ha! Drž oči na cíli, [overtaking_charioteer.GetFirstNameNoTooltip]!"
 chariot_race_ongoing_jp.0500.d: "Ty zatracený #EMP blázne#!, [evil_knievel.GetFirstNameNoTooltip]!"
 chariot_race_ongoing_jp.0600.t: "Prázdné kapsy"
 chariot_race_ongoing_jp.0600.intro: "Sotva se sázkař [bookmaker.GetTitledFirstName] [Select_CString(bookmaker.IsFemale,'vzdálila','vzdálil')] s měšcem u pasu, v němž vesele cinkají mé těžce vydělané mince, slyším, jak [Select_CString(castigator.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('castigator'))|l] [castigator.GetTitledFirstName] nevěřícně ječí:\n\n„#EMP Ach...!#! Pro #EMP všechno na světě#!, [castigator.Custom2('RelationToMeShort', ROOT.Char)|l]!“"
 chariot_race_ongoing_jp.0600.kathisma: "Ticho se rozhostí v [Glossary( 'kathisma', 'KATHISMA_GLOSS')] když poháry padají a hlavy se otáčejí."
 chariot_race_ongoing_jp.0600.stands: "Ticho se rozhostí v okolních ochozech, když se všichni otočí a zírají na tuto scénu."
 chariot_race_ongoing_jp.0600.desc: "\n\n„To snad ne! Ty prosázíš #EMP všechny#! své peníze?“ pokračuje [castigator.Custom('quirk_neg_adverb')]. „Nic ti nezbude! A co #EMP nepředvídané výdaje?!#!“ Sázkař zmizí z dohledu, aby unikl pronikavému pohledu [castigator.Custom('CZ_FirstNameNoTooltip_G')]."
 chariot_race_ongoing_jp.0600.a: "Jdi pryč, [castigator.GetFirstNameNoTooltip]! Snažím se sledovat závod!"
 chariot_race_ongoing_jp.0600.b: "Myslím, že bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] snížit svou sázku..."
 halve_wager_effect_tt: "Tvá sázka se #M sníží na polovinu#!"
 chariot_race_ongoing_jp.0600.c: "Máš #EMP pravdu#! Rychle! Přiveď [bookmaker.GetFirstNameNoTooltip] zpět!"
 cancel_wager_effect_tt: "Tvá sázka se #N ruší#!"
