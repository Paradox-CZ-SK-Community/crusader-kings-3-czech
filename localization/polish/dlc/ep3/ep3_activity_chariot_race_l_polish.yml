 chariot_show_desc: "Cíl tvé sázky musí dojet #HIGH první#!, #HIGH druhý#! nebo #HIGH třetí#!"
 GLOSS_WIN: "Soutěžící vyhraje pouze tehdy, pokud skončí první."
 GLOSS_PLACE: "Soutěžící se umístí, pokud skončí na první nebo druhé příčce."
 GLOSS_SHOW: "Soutěžící se umístí, pokud skončí na první, druhé nebo třetí příčce."
 chariot_race.influence_from_employed_charioteer: "Protože zaměstnávám [my_charioteer.Custom('CZ_FirstName_A')] jako svého [GetCourtPositionType('charioteer_court_position').GetName], získám za výhru této sázky dodatečné @influence_icon![Concept('influence','vliv')|E]"
