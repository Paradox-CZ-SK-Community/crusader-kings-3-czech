 chariot_race.0120.t: "$chariot_race.0100.t$"
 chariot_race.0120.desc: "„Zajímavá vyhlídka skutečně...“ zamumlá [GetCourtPositionType('bookmaker_court_position').GetName()], „a jaký druh sázky si přejete vsadit na rychlého [ROOT.Var('wager_target').GetCharacter.GetFirstName]?“"
 chariot_race.0120.desc.team: "„Velmi moudré, velmi moudré...“ zamumlá [GetCourtPositionType('bookmaker_court_position').GetName()], „a jaký druh sázky chcete vsadit na vozy oděné do barev [ROOT.Char.Custom('GetChariotTeamColor')|l]?“"
 chariot_race.0120.a: "Samozřejmě očekávám vítězství!"
 chariot_race.0120.a.info: "#V [root_scope.MakeScope.Var('wager_target').Var('percent_chance_to_win').GetValue|1]%#! $chariot_chance_to_win$ #weak ([root_scope.MakeScope.Var('wager_target').Var('odds_win_a').GetValue]:[root_scope.MakeScope.Var('wager_target').Var('odds_win_b').GetValue] kurzy)#!\n$chariot_win_desc$\n$chariot_payout$ #P [root_scope.MakeScope.Var('wager_target').Var('win_payout').GetValue|1]x#!"
 chariot_race.0120.b: "První nebo druhé: umístění stačí."
 chariot_race.0120.b.tt: "Cíl tvé sázky musí dojet na prvním nebo druhém místě"
 chariot_race.0120.b.info: "#V [root_scope.MakeScope.Var('wager_target').Var('percent_chance_to_place').GetValue|1]%#! $chariot_chance_to_place$ #weak ([root_scope.MakeScope.Var('wager_target').Var('odds_place_a').GetValue]:[root_scope.MakeScope.Var('wager_target').Var('odds_place_b').GetValue] kurzy)#!\n$chariot_place_desc$\n$chariot_payout$ #P [root_scope.MakeScope.Var('wager_target').Var('place_payout').GetValue|1]x#!"
 chariot_race.0120.c: "Stačí se jen umístit."
 chariot_race.0120.c.tt: "Cíl tvé sázky musí dojet na prvním, druhém nebo třetím místě"
 chariot_race.0120.c.info: "#V [root_scope.MakeScope.Var('wager_target').Var('percent_chance_to_show').GetValue|1]%#! $chariot_chance_to_show$ #weak ([root_scope.MakeScope.Var('wager_target').Var('odds_show_a').GetValue]:[root_scope.MakeScope.Var('wager_target').Var('odds_show_b').GetValue] kurzy)#!\n$chariot_show_desc$\n$chariot_payout$ #P [root_scope.MakeScope.Var('wager_target').Var('show_payout').GetValue|1]x#!"
 chariot_race.0130.t: "$chariot_race.0100.t$"
 chariot_race.0130.desc: "Moje předpovědi jsou zaznamenány, svědectví o kvalitě mého úsudku... snad také o mé předvídavosti a znalostech sportu. Možná mi veškeré nedávné debaty o této záležitosti daly výhodu.\n\n„A konečně, urozený [ROOT.Char.GetTitleAsNameNoTooltip]: jakou částku si přejete vsadit?“"
 chariot_race.0130.a: "@gold_icon!200"
 chariot_race.0130.b: "@gold_icon!150"
 chariot_race.0130.c: "@gold_icon!100"
 chariot_race.0130.d: "@gold_icon!50"
 chariot_race.0200.t: "Dárce her"
 chariot_race.0200.intro_guest: "Je čas. Vedouc svou domácnost — a s noblesním gestem pobízejíc mého pozvaného společníka, [honorary_guest.GetTitledFirstName] — vystupuji do mramorového [Glossary( 'kathisma', 'KATHISMA_GLOSS')], našeho čestného místa nad chaosem Hippodromu.\n\n"
 chariot_race.0200.intro_no_guest: "Je čas. Vedouc svou domácnost, vystupuji do mramorového [Glossary( 'Kathisma', 'KATHISMA_GLOSS')], našeho čestného místa nad chaosem Hippodromu.\n\n"
 chariot_race.0200.desc: "Zatímco moře diváků čeká, zvažuji obsah svého úvodního projevu. Samozřejmě pronesu starobylé, působivé formality, ale také..."
 chariot_race.0200.a: "Vysoce oslavit svého ctěného hosta."
 chariot_race.0200.a.flavor: "Zářivý chvalozpěv na místo, které má [honorary_guest.GetFirstNameNoTooltip] v mé císařské přízni: ať lid skanduje [Select_CString(honorary_guest.IsFemale,'její','jeho')] jméno!"
 chariot_race.0200.b: "Klasická alegorie, protkána romantikou a vervou..."
 chariot_race.0200.b.flavor: "Smyslná alegorie pro [honorary_guest.Custom('CZ_FirstNameNoTooltip_A')]: ať všichni poznají mou náklonnost k [Select_CString(honorary_guest.IsFemale,'ní','němu')]!"
 chariot_race.0200.c: "Představím dědice stojícího po mém boku."
 chariot_race.0200.c.flavor: "Davy spatří [honorary_guest.Custom('CZ_TitledFirstNameNoTooltip_A')] vysoko nad sebou, uslyší vyhlásit [Select_CString(honorary_guest.IsFemale,'její','jeho')] cestu k purpuru a zamilují si [Select_CString(honorary_guest.IsFemale,'ji','ho')]."
 chariot_race.0200.d: "Slibuji řešení problémů lidu."
 chariot_race.0200.d.flavor: "Propustím darebáky? Snížím nenáviděné daně? Obnovím město? Perzekvuji opovrhované? Dav musí být nasycen..."
 combats_sow_discord_responses_tooltip: "@alert_icon! #alert_trial Zabrání nepřátelským účastníkům, aby poškodili tvou [Concept('county_control','kontrolu hrabství')|E]#!"
 chariot_race.0200.e: "Budu mluvit o svých císařských úspěších."
 chariot_race.0200.e.flavor: "Ať dav zpívá chvalozpěvy na svého [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_A')]! Ať #EMP pozná#!, že jsem [Select_CString(ROOT.Char.IsFemale,'hodena','hoden')] panovnických insignií!"
 chariot_race.0200.e.success: "Důstojný a působivý projev"
 chariot_race.0200.e.failure: "Dav syčí a bučí"
 chariot_race.0200.f: "Vyprávět příběh [promoted_legend.GetName]."
 chariot_race.0200.f.flavor: "Kdo by v myslích tisíců dokázal vzbudit větší důvěru než [Select_CString(ROOT.Char.IsFemale,'samotná vládkyně','samotný vládce')], [Select_CString(ROOT.Char.IsFemale,'kterou','kterého')] si vyvolil [ROOT.Char.GetFaith.HighGodName]?"
 chariot_race.0200.g: "Veřejně zostudit uchazeče o trůn."
 chariot_race.0200.g.flavor: "Jak snadno se dnešní nadšení může změnit v posměch, když i nejbědnější žebrák bude pohrdat [claimant.GetNameNoTooltip] jako císařským následníkem!"
 chariot_race.0200.g.success: "Naprosto ponížíš [claimant.Custom('CZ_TitledFirstNameNoTooltip_A')]"
 chariot_race.0200.g.failure: "Dav burácivě provolává jméno [claimant.Custom('CZ_TitledFirstNameNoTooltip_G')]"
 chariot_race.0200.h: "Chlubit se svou spravedlivou válkou!"
 chariot_race.0200.h.flavor: "Není vítězství proti [foe.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_D')] jisté, když tu mohu být a pořádat bezúčelné slavnosti? Radujme se z blížícího se prestiže vítězství!"
 chariot_race_war_support_attendees_tt: "Účastníci, kteří jsou [Concept('governor','guvernéry')|E] nebo [Concept('house_head','hlavami rodů')|E], vám darují [gold_i][Concept('gold','zlato')|E]"
 chariot_race.0200.i: "Mluv o své dobročinnosti... a o věrnosti, kterou požaduji na oplátku"
 chariot_race.0200.i.flavor: "Nepostrádala snad pokladna kvůli potěšení lidu? Aby úředníci mohli prospívat? Ti, kdo touží po dalších laskavostech, by se měli snažit zalíbit svému [ROOT.Char.GetTitleAsNameNoTooltip]..."
 imperial_candidate_support_tooltip: "Účastníci místo toho podpoří [Concept('candidate_score','skóre kandidáta')|E] [imperial_house_candidate.Custom('CZ_ShortUIName_G')] pro [root_scope.GetPrimaryTitle.Custom('CZ_LandedName_A')]"
 honorary_guest_support_tooltip: "Účastníci podpoří [Concept('candidate_score','skóre kandidáta')|E] [imperial_house_candidate.Custom('CZ_ShortUIName_G')] pro [root_scope.GetPrimaryTitle.Custom('CZ_LandedName_A')]"
 discredited_claimant_support_tooltip: "Účastníci dále zvýší [Concept('candidate_score','skóre kandidáta')|E] [claimant.Custom('CZ_ShortUIName_G')]"
 chariot_race.0201.t: "Projev [host.Custom('CZ_TitleAsNameNoTooltip_G')]"
 chariot_race.0201.kathisma: "Jásot tisíců sílí. Jsem unášen spolu se [Select_CString(SCOPE.sC('host').IsFemale,'svou','svým')] [ROOT.Char.Custom2('CZ_RelationToMeShort_I', SCOPE.sC('host'))], [host.GetTitledFirstName], když [Select_CString(host.IsFemale,'její','jeho')] doprovod stoupá po točitém schodišti k vyvýšenému [Glossary( 'kathisma', 'KATHISMA_GLOSS')] a začínají zahajovací ceremoniály závodů.\n\n"
 chariot_race.0201.intro: "Rozestavěni kolem monumentálního hippodromu v nekonečných řadách netrpělivé publikum čeká na své závodníky a na svého [host.GetTitleAsName]. Nakonec se v rozhlehlé císařské lóži objeví drobná, zlatem korunovaná postava. Zahajovací ceremoniál začíná.\n\n"
 chariot_race.0201.emperor_unfazed: "[host.GetTitleAsNameNoTooltip] nasává hromadné očekávání lidu a začíná hřmět svým projevem."
 chariot_race.0201.emperor_nervous: "[host.GetTitleAsNameNoTooltip], parapet skrývající jednu z [Select_CString(host.IsFemale,'její','jeho')] třesoucích se rukou, mluví k lidu."
 chariot_race.0201.emperor_distant: "S šeptem, který předává [Select_CString(host.IsFemale,'její','jeho')] vzdálené poselství, [host.GetTitledFirstNameNoTooltip] pronáší projev."
 chariot_race.0201.gain_influence: "Líčí činy císařské dobročinnosti a nádheru nadcházejících závodů. Jak velká je [Select_CString(host.IsFemale,'její','jeho')] štědrost! Jak bohatě jsou odměněni ti, kdo věří v [host.Custom('CZ_TitleAsNameNoTooltip_A')] a dobře [Select_CString(host.IsFemale,'jí','mu')] slouží!"
 chariot_race.0201.sway: "Rodí se chvalozpěv na [honorary_guest.Custom('CZ_Name_A')]. Spolu s čestným místem v císařské lóži tyto chvály vtahují [Select_CString(honorary_guest.IsFemale,'tu, která je pro','toho, kdo je pro')] [host.Custom('CZ_TitleAsNameNoTooltip_A')] [host.Custom2('RelationToMeShort', SCOPE.sC('honorary_guest'))|l], do záře palácové nádhery."
 chariot_race.0201.sway_self: "Vychvaluje mé ctnosti a dar mé společnosti. Tady v císařské lóži cítím, jak mě vtahuje záře palácové nádhery."
 chariot_race.0201.seduce: "Květnatými, překotnými metaforami a klasickými narážkami zřejmě vychvaluje buď nějakou milovanou bytost... nebo půvabné zosobnění [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l]?"
 chariot_race.0201.seduce_self: "Květnatými, překotnými, romantickými metaforami a klasickými narážkami zřejmě vychvaluje buď půvabné zosobnění [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l]... nebo #EMP mě?#!"
 chariot_race.0201.present_heir: "Zdá se, že této příležitosti využívá k tomu, aby lidu [Select_CString(host.IsFemale,'představila','představil')] dědice. Za jásotu davu [host.GetTitleAsNameNoTooltip|l] prohlásí [honorary_guest.Custom('CZ_Name_A')] za [Select_CString(honorary_guest.IsFemale,'hodnou','hodného')] purpurových insignií."
 chariot_race.0201.present_heir_self: "Zdá se, že této příležitosti využívá k tomu, aby lidu [Select_CString(host.IsFemale,'představila','představil')] dědice. Za jásotu davu [host.GetTitleAsNameNoTooltip|l] prohlásí, že #EMP já#! jsem [Select_CString(ROOT.Char.IsFemale,'nejhodnější kandidátkou','nejhodnějším kandidátem')] na purpurové insignie!"
 chariot_race.0201.appease_populace: "Vylévají se sliby: zrušit daně, propustit rváče a házet zlato tam, kam si dav přeje. [host.GetTitleAsNameNoTooltip|U] se ohýbá — úplně — vůli hemžícího se davu."
 chariot_race.0201.increase_legitimacy_success: "Je to mocný a důstojný příběh: o vznešeném životě a překonaných útrapách. [host.GetTitleAsNameNoTooltip|U] vyzývá dav, ať sám posoudí: nebyly [Select_CString(host.IsFemale,'jí','mu')] panovnické insignie souzeny od samého počátku?"
 chariot_race.0201.increase_legitimacy_fail: "Je to ubohý a prázdný příběh: chlouba [host.Custom('CZ_TitleAsNameNoTooltip_G')] zní falešně. Vyzývá dav k úsudku... a přitom vypadá spíš jako rozmazlené děcko navlečené do panovnických insignií."
 chariot_race.0201.spread_legend: "Umně vtkané do obvyklých frází jsou narážky na [promote_legend.GetName]. Starobylý obřad se stává k nerozeznání od imperiálního vyprávění."
 chariot_race.0201.discredit_claimant_self: "A jak rychle mají všichni mé jméno na rtech! Neboť [host.GetTitleAsNameNoTooltip|l], [Select_CString(host.IsFemale,'ta hlupačka','ten hlupák')], mé vyhlídky veřejně pomlouvá a přísahá, že ode [Select_CString(host.IsFemale,'ní','něj')] na trůn nikdy podporu nedostanu!"
 chariot_race.0201.discredit_claimant_success: "Před celým shromážděním odsoudí jméno [claimant.Custom('CZ_Name_G')], rozcupuje [Select_CString(claimant.IsFemale,'její','jeho')] vyhlídky a přísahá, že na trůnu nikdy nebude sedět!"
 chariot_race.0201.discredit_claimant_fail: "Před celým shromážděním pomlouvá jméno [claimant.Custom('CZ_Name_G')], brblá o [Select_CString(claimant.IsFemale,'jejích','jeho')] vyhlídkách a při pomyšlení, že by [Select_CString(claimant.IsFemale,'mohla','mohl')] usednout na trůn, zrudne v obličeji."
 chariot_race.0201.war_support: "Na dav doléhají [Select_CString(host.IsFemale,'její','jeho')] výzvy ke spravedlivé válce proti [foe.Custom('CZ_Name_D')] a sliby vítězství. Už samy tyto hry v čase války, hlásá, dokazují, že se žádného nepřítele nebojíme!"
 chariot_race.0201.angry_crowd: "\n\nDav není zrovna potěšen. Jejich bouřlivý potlesk se mísí s výkřiky požadavků, urážkami a vulgárními chorály."
 chariot_race.0201.happy_crowd: "\n\nMasy burácí své uznání, opojené vzduchem hippodromu, město sjednocené v chvále."
 chariot_race.0201.aa.discredit: "Trůn patří [host.GetHouse.GetNameNoTooltip]!"
 chariot_race.0201.aa.honorary_guest: "[honorary_guest.GetTitledFirstNameNoTooltip] získává na vlivu!"
 chariot_race.0201.ab: "[claimant.GetTitledFirstNameNoTooltip] bude vládnout!"
 chariot_race.0201.a: "Po projevech — připijme na Štěstěnu!"
 chariot_race.0201.a.flavor: "Co by byly tyto hry bez přípitků?"
 chariot_race.0201.b: "Jak nehodný projev..."
 chariot_race.0201.b.flavor: "Vsaďte myšlenku do myslí přítomných notabilit: pravý řečník nebo mistr politiky by skutečně ohromil!"
 chariot_race.0201.c: "Nechte agenty vyvolat protichant!"
 chariot_race.0201.c.flavor: "#EMP Přehlušte [host.GetTitleAsNameNoTooltip]! Nechte dav ponížit toho pompézního blázna a žádat jeho náhradu!#!"
 chariot_race.0201.d: "Přispěji na věc!"
 chariot_race.0201.d.flavor: "A tak získám svůj díl zásluh za naše současné vítězství."
 chariot_race.0201.e: "Musím [host.GetTitleAsNameNoTooltip] vřele poděkovat."
 chariot_race.0201.e.flavor: "Můj ušlechtilý [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('host'))] — kdo jiný by mohl nabídnout stejné laskavosti?"
 chariot_race.0201.f: "Chvalme našeho [host.GetTitleAsNameNoTooltip]!"
 counter_chanters_log_title: "Protichanty proti zahajovacímu projevu"
 counter_chanters_log: "Projev [host.Custom('CZ_ShortUIName_G')] se setkal s organizovaným politickým protestem a jekotem davu."
 chariot_race.0202.title: "Protichanty proti projevu"
 chariot_race.0202.desc: "Neukáznění diváci tvých vozatajských závodů byli poštváni proti tobě."
 counter_chants_strong_modifier_tooltip: "[imperial_capital.GetName] získalo [activity.MakeScope.Var( 'counter_chant_count' ).GetValue|N0] případů [GetModifier( 'strong_sow_discord_modifier' ).GetNameWithTooltip]"
 counter_chants_normal_modifier_tooltip: "[imperial_capital.GetName] získalo [activity.MakeScope.Var( 'counter_chant_count' ).GetValue|N0] případů [GetModifier( 'normal_sow_discord_modifier' ).GetNameWithTooltip]"
 counter_chants_weak_modifier_tooltip: "[imperial_capital.GetName] získalo [activity.MakeScope.Var( 'counter_chant_count' ).GetValue|N0] případů [GetModifier( 'weak_sow_discord_modifier' ).GetNameWithTooltip]"
 chariot_race.0250.t: "Ať závod začně!"
 chariot_race.0250.desc: "Zahaleni zlatými tóny poledního slunce vítají dav hromovým jásotem zápražce. [activity.MakeScope.Var('first_place').Char.GetFirstName|U], [activity.MakeScope.Var('second_place').Char.GetFirstName] a [activity.MakeScope.Var('third_place').Char.GetFirstName] jsou dnes favority. Stojí připraveni na startovní čáře s napnutými ohlávkami a očima planoucími odhodláním.\n\nKdyž zahrají císařské trumpety, zápražky vyrazí vpřed, kola víří prach ve víru rychlosti a dovednosti. Zemi pod námi otřásá hřmot kopyt a závod se rozvíjí s hmatatelnou energií."
 chariot_race.0250.a: "Ať hry začnou!"
 chariot_race.3000.t: "Štít [ROOT.Char.Custom('GetChariotTeamColorPlural')]"
 chariot_race.3000.intro: "Smečka zápražek je nablízko — tak blízko, že jediná by mohla divoce vychýlit všechny ostatní. Můj tým je první, kdo toho využije.\n\n"
 chariot_race.3000.backing_sacrifice: "Řidič, [charioteer_sacrifice.GetName], s mou mincí na hlavě, začne divoce zatáčet — vlevo, pak vpravo, pak zase vlevo. Ach, [ROOT.Char.GetFaith.HighGodName], jak je to mučivě pomalé! Ale hlavní balík je uvězněn za [Select_CString(charioteer_sacrifice.IsFemale,'její','jeho')] klikatou bariérou!\n\nMezitím [charioteer_leading.GetName], další z [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')], uhání vpřed bez překážek."
 chariot_race.3000.not_backing_but_employs_sacrifice: "Můj vozataj [charioteer_sacrifice.GetName] začne divoce kličkovat – doleva, doprava a zase doleva. Jak chytré, jak odvážné! Hlavní pole uvězní za svou klikatou hrází.\n\nMezitím další z týmu [charioteer_leading.Custom('GetChariotTeamColorPluralGlossed')], [charioteer_leading.GetName], si to bez překážek žene vpřed!"
 chariot_race.3000.not_backing_sacrifice: "Jeden z našich vozatajů, [charioteer_sacrifice.GetName], začne divoce kličkovat – doleva, doprava a zase doleva. Jak chytré, jak odvážné! Hlavní pole uvězní za svou klikatou hrází.\n\nMezitím můj vybraný vozataj [charioteer_leading.GetName] si to bez překážek žene vpřed!"
 chariot_race.3000.a: "Pošlete vymahače, aby se přidali k blížící se rvačce."
 chariot_race.3000.a.flavor: "Ostatní frakce jsou bouřlivé, vzbouřené kvůli tomuto drzému kousku: je čas rozhýbat i [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]!"
 chariot_race.3000.b: "Velké oběti pro [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]#EMP !#!"
 chariot_race.3000.b.flavor: "My všichni [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')] bychom se měli radovat z blížícího se vítězství!"
 chariot_race.3000.c: "Zdá se, že někteří prosperují... ale jiní ne."
 chariot_race.3000.c.flavor: "Chudáci, ošizení stoupenci [charioteer_sacrifice.GetFirstNameNoTooltip] si zaslouží pozornost!"
 chariot_race.3000.d: "„Ne! #EMP [charioteer_about_to_be_passed.GetFirstNameNoTooltip]!#!“"
 chariot_race.3010.t: "Odpočiň si, [first_place_charioteer.GetFirstNameNoTooltip]"
 chariot_race.3010.desc: "Na okamžik [Select_CString(first_place_charioteer.IsFemale,'měla','měl')] [first_place_charioteer.GetFirstName] křídla. [Select_CString(first_place_charioteer.IsFemale,'Vyrazila','Vyrazil')] před pole, [Select_CString(first_place_charioteer.IsFemale,'zajistila','zajistil')] si první místo a ostatním vozatajům [Select_CString(first_place_charioteer.IsFemale,'ujela','ujel')] o celé míle.\n\nNa okamžik [Select_CString(first_place_charioteer.IsFemale,'její','jeho')] slavný vůz rozzářil hipodrom... ale [first_place_charioteer.GetFirstNameNoTooltip] [Select_CString(first_place_charioteer.IsFemale,'nebyla','nebyl')] Hélios. [Select_CString(first_place_charioteer.IsFemale,'Vzlétla','Vzlétl')] příliš blízko k velikosti a náš vlastní [Glossary( 'Faethón', 'PHAETHON_GLOSS' )] padl. Prach dráhy teď kropí [Select_CString(first_place_charioteer.IsFemale,'její','jeho')] zkroucené tělo a dlouhý pruh krve – poslední svědectví [Select_CString(first_place_charioteer.IsFemale,'její','jeho')] ctižádosti."
 PHAETHON_GLOSS: "V řecké mytologii byl Phaethón zasažen bleskem Dia poté, co se pokusil řídit vůz svého otce Hélia přes oblohu."
 chariot_race.3010.a: "Proneste projev, který uklidní dav."
 chariot_race.3010.a.success: "Dav je uklidněn"
 chariot_race.3010.a.failure: "Dav nadále panikaří"
 chariot_race.3010.b: "Nechat na [Select_CString(first_place_charioteer.IsFemale,'její','jeho')] počest postavit sochu."
 chariot_race.3010.c: "„[first_place_charioteer.GetFirstNameNoTooltip|U] bude mít pohřeb odpovídající [Select_CString(first_place_charioteer.IsFemale,'jejím','jeho')] zásluhám.“"
 chariot_race.3010.a.success_title: "$chariot_race.3010.a.success$"
 chariot_race.3010.a.failure_title: "$chariot_race.3010.a.failure$"
 chariot_race.3020.t: "Vyhlídky mé sázky"
 chariot_race.3020.intro: "[Select_CString(ROOT.Char.IsFemale,'Vsadila','Vsadil')] jsem [ROOT.Var('wager_value').GetValue] zlatých na to, že [wager_target.GetFirstName] [ROOT.Char.Custom('GetWinPlaceShow')], a tak bedlivě sleduji [Select_CString(wager_target.IsFemale,'její','jeho')] výkon. Momentálně je na... #EMP;HIGH [wager_target.Custom('GetChariotRacePlacement')] místě!#!\n\n"
 chariot_race.3020.placement_first: "Už se těším, jak budu jásat nad blížícím se triumfem [wager_target.Custom('CZ_FirstNameNoTooltip_G')]! Výhra je na cestě!"
 chariot_race.3020.placement_good: "S očekáváním možné zápletky bedlivě sleduji, jak [wager_target.GetFirstNameNoTooltip] ze své výhodné pozice manévruje soutěží."
 chariot_race.3020.placement_bad: "Šance nejsou v náš prospěch..."
 chariot_race.3020.placement_last: "#EMP NAPROSTO POSLEDNÍ?!#! Mé srdce klesá, když [wager_target.GetFirstNameNoTooltip] čelí problémům na dráze, momentálně zaostává na posledním místě, a modlím se za nějaký nečekaný zvrat."
 chariot_race.3020.a: "Poštvat fanoušky [wager_target.Custom('CZ_FirstNameNoTooltip_G')] k násilí!"
 chariot_race.3020.a.flavor: "Násilí - #EMP v mém jménu!#!"
 chariot_race.3020.b: "Chvíle na rozdávání nápojů..."
 ep3_chariot_race_strong_appeasement_modifier: "Velkolepá štědrost"
 ep3_chariot_race_strong_appeasement_modifier_desc: "Během velkolepého závodu byly mezi lid hojně rozdělovány nápoje a štědré dary."
 ep3_chariot_race_weak_appeasement_modifier: "Úsilí o uklidnění"
 ep3_chariot_race_weak_appeasement_modifier_desc: "Byly učiněny pokusy získat si dav na závodech."
 chariot_race.3020.c: "Koho tipujete, že vyhraje, [special_guest.GetFirstNameNoTooltip]?"
 chariot_race.3020.d.placement_first: "No tak... ještě kousek!"
 chariot_race.3020.d.placement_good: "Drž se, [wager_target.GetFirstNameNoTooltip]!"
 chariot_race.3020.d.placement_bad: "Ještě je čas. Pořád má šanci."
 chariot_race.3020.d.placement_last: "Tohle je naposledy, co sázím na [wager_target.Custom('GetChariotTeamColorPluralGlossed')]..."
 chariot_race.3030.t: "[trailing_charioteer.GetShortUINameNoTooltip] předjíždí [leading_charioteer.GetShortUINameNoTooltip]!"
 chariot_race.3030.desc: "V překvapivém obratu událostí [trailing_charioteer.GetFirstName] [trailing_charioteer.Custom('GetVictoriousChariotMovement')], předstihuje [leading_charioteer.GetFirstName] a umisťuje se na [trailing_charioteer.Custom('GetChariotRacePlacement')] místo!\n\nDav zešílí!"
 chariot_race.3030.desc_teams: "Ti, kdo fandí [trailing_charioteer.Custom('GetChariotTeamColorPluralGlossed')], vykvačí barvy a vyvolají velký jásot... ti, co fandí [leading_charioteer.Custom('GetChariotTeamColorPluralGlossed')], však vzdychnou s rozhořčením."
 chariot_race.3030.a: "Připít na úspěch [trailing_charioteer.Custom('CZ_FirstNameNoTooltip_G')]."
 chariot_race.3030.b: "Když je nemůžeš porazit... získej je pro sebe."
 chariot_race.3030.c: "Škoda, [leading_charioteer.GetFirstNameNoTooltip]."
 chariot_race.3040.t: "Zrádné zamotání"
 chariot_race.3040.desc: "[charioteer_1.GetName|U] a [charioteer_2.GetName] spolu svádějí boj o pozici, jejich vozy se o sebe otírají a odrážejí. Před zatáčkou škubají otěžemi. Vozy se od sebe nemohou odpoutat!\n\nKolo vozu [charioteer_1.Custom('CZ_FirstName_G')] se roztříští na kusy. Vůz se divoce stočí a narazí do vozu [charioteer_2.Custom('CZ_FirstName_G')]. Z trosek se nese řičení koní a pach jejich krve. Ani jeden z vozatajů se zřejmě nehýbe."
 chariot_race.3040.a: "Tito stateční budou mít velkolepý pohřeb."
 chariot_race.3040.b: "Zastavte další kolo! Mohou být stále naživu!"
 chariot_race.3040.b.tt: "Přeživší budou vytaženi z trosky"
 chariot_race.3040.b.both_survive: "Oba řidiči přežijí"
 chariot_race.3040.b.chariot_two_survives: "[charioteer_2.GetFirstNameNoTooltip|U] přežije"
 chariot_race.3040.b.chariot_one_survives: "[charioteer_1.GetFirstNameNoTooltip|U] přežije"
 chariot_race.3040.b.no_survivors: "Žádný z řidičů nepřežije"
 chariot_race.3040.c: "Co to bylo za podívanou! TO JE opravdový závod!"
 chariot_race.3040.d: "Jaké hrůzy... budu za ně modlit."
 chariot_race.3050.t: "Nepravděpodobný triumf"
 chariot_race.3050.desc: "Vzduch praská napětím.\n\n[last_place_charioteer.GetFirstName|U], dříve opomíjený řidič, vzdoruje všem pravděpodobnostem, [last_place_charioteer.Custom('GetChariotComebackMovement')] v pravé [Glossary( 'aristeia', 'GLOSS_ARISTEIA')].\n\nV publiku se ozývají úžasem vykřikované pohlcené výdechy, když živé barvy [last_place_charioteer.Custom('GetChariotTeamColorPluralGlossed')] postupují vpřed. Dav, zpočátku zticha v nevěřícnu, vybuchne hromovým řevem!"
 chariot_race.3050.a: "#EMP [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')] vládnou nejvyšší!#!"
 chariot_race.3050.b: "Bude [Select_CString(last_place_charioteer.IsFemale,'moje','můj')]."
 chariot_race.2050.c: "Dobrá práce, [last_place_charioteer.GetFirstNameNoTooltip]!"
 GLOSS_ARISTEIA: "#EMP aristeia#! označuje božsky inspirovaný okamžik, kdy hrdina dokáže vykonat mimořádné a působivé činy."
 chariot_race.2050.d: "[ROOT.Char.GetFaith.HighGodName|U] má některé ze [ROOT.Char.GetFaith.HighGodHerHis] dětí více rád než jiné..."
 chariot_race.4000.t: "Setkání významných osob"
 chariot_race.4000.desc: "„Ach, podívej se! [activity.MakeScope.Var('first_place').Char.GetName] vede!“ přistoupí ke mně [target_governor.GetTitledFirstName] s úsměvem tak širokým jako zatáčky, které vybírá [last_place.GetFirstName].\n\n„[target_governor.Custom('GetGovernorChitChat')] Jak se máš, [Select_CString(ROOT.Char.IsFemale,'milá','milý')] [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')]?“\n\nTakový zdvořilý rozhovor mezi guvernéry by se dal stočit k užitečnějším tématům..."
 chariot_race.4000.a: "Takticky budu vychvalovat své ctnosti jako vládce."
 chariot_race.4000.a.critical_success: "[target_governor.GetFirstNameNoTooltip] se stane vaším zbožňujícím fanouškem"
 chariot_race.4000.a.critical_success_title: "$chariot_race.4000.a.critical_success$"
 chariot_race.4000.a.success: "Přesvědčíte [target_governor.GetFirstNameNoTooltip] o své hodnotě"
 chariot_race.4000.a.success_title: "$chariot_race.4000.a.success$"
 chariot_race.4000.a.failure: "Nepodaří se vám přesvědčit [target_governor.GetFirstNameNoTooltip] o své hodnotě"
 chariot_race.4000.a.failure_title: "$chariot_race.4000.a.failure$"
 chariot_race.4000.a.critical_failure: "[target_governor.GetFirstNameNoTooltip] se stane vaším rivalem"
 chariot_race.4000.a.critical_failure_title: "$chariot_race.4000.a.critical_failure$"
 change_appointment_investment_medium_gain: "Tvé [Concept('candidate_score','skóre kandidáta')|E] pro [target_title.Custom('CZ_LandedName_A')] se zvýší o [EmptyScope.ScriptValue('appointment_score_medium_value')|P0]"
 change_appointment_investment_minor_gain: "Tvé [Concept('candidate_score','skóre kandidáta')|E] pro [target_title.Custom('CZ_LandedName_A')] se zvýší o [EmptyScope.ScriptValue('appointment_score_minor_value')|P0]"
 change_appointment_investment_minor_loss: "Tvé [Concept('candidate_score','skóre kandidáta')|E] pro [target_title.Custom('CZ_LandedName_A')] se sníží o [EmptyScope.ScriptValue('appointment_score_minor_value')|N0]"
 change_appointment_investment_medium_loss: "Tvé [Concept('candidate_score','skóre kandidáta')|E] pro [target_title.Custom('CZ_LandedName_A')] se sníží o [EmptyScope.ScriptValue('appointment_score_medium_value')|N0]"
 chariot_race.4000.b: "Zajímalo by mě, jaké agenty tu má [target_governor.GetFirstNameNoTooltip]..."
 ep3_united_agents_tooltip: "[Concept('political_schemes','Politické intriky')|E] proti vašemu [Concept('liege','lennímu pánovi')|E]: #P +15%#! [Concept('success_chance','šance na úspěch')|E] na #high 10 let#!"
 united_political_agents_modifier: "Spojení agentů v hlavním městě"
 united_political_agents_modifier_desc: "Politickí agenti této postavy ve vysokém dvoře země pracují ruku v ruce s agenty jiné postavy."
 united_political_agents_modifier_tt: "#weak [Concept('political_schemes','Politické intriky')|E] proti [Concept('liege','lennímu pánovi')|E]: #P +15%#! [Concept('success_chance','šance na úspěch')|E]#!"
 chariot_race.4000.c: "Zajímá mě, jestli [target_governor.GetFirstNameNoTooltip] [Select_CString(target_governor.IsFemale,'slyšela','slyšel')] příběhy, které o mně kolují?"
 chariot_race.4000.c.success: "[target_governor.GetFirstNameNoTooltip] začne šířit tvou legendu"
 chariot_race.4000.c.failure: "[target_governor.GetFirstNameNoTooltip] o tvou legendu nemá zájem"
 chariot_race.4000.d: "Ah, příležitost rozšířit můj politický dosah!"
 chariot_race.4000.d.success: "Úspěšně manipulujete s [target_governor.Custom('CZ_TitledFirstName_I')]"
 chariot_race.4000.d.failure: "Nepodaří se vám manipulovat s [target_governor.Custom('CZ_TitledFirstName_I')]"
 chariot_race.4000.f: "Nikdy nepodceňujte hodnotu přátel na vysokých pozicích."
 chariot_race.4000.g: "Možná je čas [target_governor.GetFirstNameNoTooltip] ponížit..."
 chariot_race.4000.g.flavor: "Uvolníte urážku, která zlomí ambice [target_governor.GetFirstNameNoTooltip]"
 target_governor_change_appointment_investment_medium_loss: "[Concept('candidate_score','Skóre kandidáta')|E] [target_governor.Custom('CZ_TitledFirstName_G')] pro [target_title.Custom('CZ_LandedName_A')] klesne o [EmptyScope.ScriptValue('appointment_score_medium_value')|N0]"
 chariot_race.4010.t: "Pryč s [unpopular_official.Custom('CZ_TitledFirstNameNoTooltip_I')]!"
 chariot_race.4010.desc: "Z davu se zvedne řev, šíří se, opakuje a mění se v skandování. Nakloním se dopředu, abych [Select_CString(ROOT.Char.IsFemale,'zachytila','zachytil')] slova. [Glossary( 'hoi polloi', 'HOI_POLLOI_GLOSS')] dupou, ukazují a vykřikují jméno: #EMP „Pryč s [unpopular_official.Custom('CZ_TitledFirstName_I')]! Pryč s [unpopular_official.Custom('CZ_TitledFirstNameNoTooltip_I')]!“#!\n\n[Select_CString(ROOT.Char.IsFemale,'Slyšela','Slyšel')] jsem, že si [unpopular_official.GetTitledFirstNameNoTooltip] dělá jistou pověst, ale [Select_CString(ROOT.Char.IsFemale,'netušila','netušil')] jsem, že jsou lidé tak rozzlobení!"
 chariot_race.4010.a: "[unpopular_official.GetTitledFirstNameNoTooltip|U] bude zbaven [Select_CString(unpopular_official.IsFemale,'její','jeho')] pozice."
 chariot_race.4010.b: "Uklidněte dav. Pošlete služebníky, aby jim házeli ceny!"
 chariot_race.4010.b.tt.success: "Dav je nadšen"
 chariot_race.4010.b.tt.failure: "Chanty se jen zesilují"
 chariot_race.4010.c: "Nepřijatelné. Potřebuji schopnosti [unpopular_official.Custom('CZ_FirstNameNoTooltip_G')]."
 chariot_race.4010.d: "Přidejte se k chorálu! Pryč s [unpopular_official.Custom('CZ_TitledFirstNameNoTooltip_I')]!"
 chariot_race.4010.e: "Zahajte nový chorál! #EMP „[ROOT.Char.GetFaith.HighGodName] chraň [emperor_scope.GetTitledFirstNameNoTooltip]!“#!"
 chariot_race.4010.f: "Sedět v nepříjemném tichu."
 chariot_race.4020.t: "Půvab [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]"
 chariot_race.4020.desc: "„Přepychové [Glossary( 'thermy', 'THERMAE_GLOSS')], říkáte?“ zamyslí se [notable.GetName] a [Select_CString(notable.IsFemale,'její','jeho')] slova se napůl ztrácejí ve vřavě davu. „[Select_CString(notable.IsFemale,'Netušila','Netušil')] jsem, že [ROOT.Char.GetCapitalLocation.GetName] je místo tak vytříbené...“\n\nZatímco mluvím o svých plánech s [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_I')], do zasněného pohledu [notable.Custom('CZ_TitledFirstNameNoTooltip_G')] se vkrade zálibné snění.\n\n"
 THERMAE_GLOSS: "Římského původu lázeňský komplex, který sloužil nejen k očistě těla, ale také k ulehčení různých společenských interakcí."
 chariot_race.4020.desc_capital_estate: "„Po pravdě,“ řekne, „hlasy mých příbuzných zanikají ve vřavě a hádkách hlavního města a naše děti jsou vystaveny všem neřestem... možná by rodu [notable.GetHouse.GetName] dobře posloužil domov v [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_L')].“"
 chariot_race.4020.desc_provincial_estate: "„Po pravdě,“ řekne, „moje rodina až příliš často stoluje s venkovskými balíky a bezejmennými lidmi v sídle [current_estate.GetName]... a zdá se, že vaše ministerstvo by mohlo dobře využít úředníky z rodu [notable.GetHouse.GetName].“"
 chariot_race.4020.a: "V mém paláci budeš vždy vítán!"
 chariot_race.4020.a.flavor: "A [CZPrepV(ROOT.Char.GetCapitalLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(ROOT.Char.GetCapitalLocation,'L')] ať jsou všichni naši příbuzní pevně spojeni!"
 chariot_race.4020.a.success: "[notable.GetFirstNameNoTooltip] se stává cenným důvěrníkem"
 chariot_race.4020.a.failure: "[notable.GetFirstNameNoTooltip] si váží tvého vysokého mínění"
 chariot_race.4020.b: "Pojď, pojď! Čestné zaměstnání tě čeká!"
 noble_administrators_modifier: "Vznešení správci"
 noble_administrators_modifier_desc: "Vlivní šlechtici přišli do hlavního města této postavy a nyní obsazují důležité pozice v její byrokracii."
 5_percent_governor_efficiency_tooltip: "[Concept('governor_efficiency','Efektivita guvernéra')|E]: @governor_efficiency!#positive_value +5%#!"
 chariot_race.4020.c: "Zařídím ti pěkné venkovské sídlo."
 chariot_race.4020.c.flavor: "[notable.GetTitledFirstNameNoTooltip] nemusí tam bydlet na plný úvazek... ale on #EMP musí#! ctít takový projev štědrosti."
 chariot_race.4020.d: "Ale jsou to #EMP obchodníci#! z [current_estate.GetNameNoTooltip], které skutečně potřebujeme."
 chariot_race.4020.d.flavor: "A sídlo [notable.Custom('CZ_TitledFirstNameNoTooltip_G')] s nimi čile obchoduje..."
 mercantile_contacts_modifier: "Obchodní kontakty"
 mercantile_contacts_modifier_desc: "Vzdálená mocná rodina nasměrovala své místní obchodníky k bohatým obchodním příležitostem, které zde existují."
 chariot_race.4030.t: "Pohoštění hippodromu"
 chariot_race.4030.desc: "Konečně se mi podařilo dostat se k [seduce_interest.Custom('CZ_Name_D')]. Zdá se, že je ve zvláštní náladě.\n\n„[Select_CString(ROOT.Char.IsFemale,'Věřila','Věřil')] bys tomu, [Select_CString(ROOT.Char.IsFemale,'milá','milý')] [ROOT.Char.Custom('CZ_FirstName_V')],“ šeptá okouzlující [seduce_interest.GetFirstNameNoTooltip], „že nevěstky z hlavního města – jako [Select_CString(prostitute.IsFemale,'támhleta','támhleten')] – berou urozené pány a dámy pod tribuny... a...“\n\nHluboce se začervená.\n\n„Představ si tu drzost! Tam dole to musí být jako jiný svět: šeptané dohody v dusném horku, kde se ve tmě všichni znovu rodí jako cizinci...“"
 chariot_race.4030.desc_no_seduction: "Podívaná na vozy není jedinou zábavou dne – a ne všechno, co tu rozněcuje vášně urozených, se odehrává na dráze. Zatímco nálada houstne, nevěstky se proplétají davem a nabízejí své služby.\n\nNalíčená tvář – obzvlášť půvabná – se na mě lákavě usměje. Jak odvážné, že se [Select_CString(prostitute.IsFemale,'odvážila','odvážil')] až k těmto čestným místům! Ale i tady... [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] bych [Select_CString(prostitute.IsFemale,'ji','ho')] snadno vzít za ruku a následovat [Select_CString(prostitute.IsFemale,'její','jeho')] voňavé tělo do ústraní..."
 chariot_race.4030.a: "#EMP Nebo#! bych mohl nalákat někoho se zájmem..."
 chariot_race.4030.a.flavor: "...a jakmile si [john.GetTitledFirstNameNoTooltip] užije svou odpornou zábavu, zůstane mi špinavé tajemství!"
 chariot_race.4030.a.success: "Zavezeš [john.GetFirstNameNoTooltip] do stínu"
 chariot_race.4030.a.failure: "[john.GetFirstNameNoTooltip] tě veřejně pokárá"
 chariot_race.4030.b: "Půjdeme se na to podívat, [Select_CString(seduce_interest.IsFemale,'má paní','můj pane')]...?"
 chariot_race.4030.b.flavor: "#EMP Velmi#! [Select_CString(ROOT.Char.IsFemale,'ráda','rád')] bych [Select_CString(seduce_interest.IsFemale,'tuto rozmarnou ženu','tohoto rozmarného muže')] [Select_CString(ROOT.Char.IsFemale,'zavedla','zavedl')] někam do zakázaného ústraní!"
 chariot_race.4030.b.success: "[seduce_interest.GetFirstNameNoTooltip] se ti oddá"
 chariot_race.4030.b.failure: "[seduce_interest.GetFirstNameNoTooltip] je naprosto pohoršený"
 chariot_race.4030.c: "To zní... lákavě..."
 chariot_race.4030.c.flavor: "Říká se, že prostitutky [CZPrepZ(host.GetCapitalLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(host.GetCapitalLocation,'G')] jsou zručné jako žádné jiné [prostitute.GetWomenMen]..."
 chariot_race.4030.d: "Teď už jen budu sledovat závod."
 chariot_race.4031.t: "První v cíli"
 chariot_race.4031.desc: "Nekonečné zákruty, stále hlouběji dolů, nás dovedou do prázdného holubníku. Zatímco holubice vrkáním přivolávají mír, [besexed.GetTitledFirstName] a já se milujeme.\n\nKaždý sval napjatý, každou chvíli kradmo pohlížím ke dveřím a tisknu [Select_CString(besexed.IsFemale,'ji','ho')] k sobě, až konečně dosáhnu uspokojení. Z dálky tlumeně zaburácí dav.\n\n"
 chariot_race.4031.desc_seduced: "„Jak skandální,“ zavrní [besexed.GetFirstNameNoTooltip], vychutnávaje si naši nemravnou fantazii. „Smím doufat, že to znamená, že jsem teď ve vašich službách, [ROOT.Char.Custom('FormOfAddressForLiege')]?“"
 chariot_race.4031.desc_prostitute: "„Jste jako málokdo, [ROOT.Char.Custom('FormOfAddressForLiege')],“ zavrní [besexed.GetFirstNameNoTooltip] a kreslí mi prsty obrazce po holé kůži. „Smím doufat, že mě zase vyhledáte?“"
 chariot_race.4031.a: "Rozhodně tě nenechám odejít."
 chariot_race.4031.a.flavor: "Příště ale buďme pod peřinami!"
 chariot_race.4031.b: "Ty závody jsou opravdu velká událost!"
 chariot_race.4031.b.flavor: "...jedinečná příležitost bez trvalého významu, ano."
 chariot_race.4040.t: "[ROOT.Char.Custom('GetChariotTeamColorPlural')], sjednoceni!"
 chariot_race.4040.desc: "„#EMP [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]! [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')|U]! [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')|U]!“#! zní zdola chorál a sílí, zatímco zpocený prosťáček [common_fan.GetName] klesne na koleno přede mnou a [noble_fan.Custom('CZ_TitledFirstName_I')].\n\n„Vznešení páni,“ ozve se, „patříte k největším a nejvěrnějším příznivcům našich milovaných [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]! Nechtěli byste sejít mezi nás a připít si s pár statnými a věrnými krajany? Přísahám, že chlapce udržím od rvaček a házení kamením!“\n\n[noble_fan.GetFirstNameNoTooltip|U] a ostatní šlechtici jsou zřejmě v dobré náladě, ale i tak... při pomyšlení na lůzu se všichni ošívají."
 chariot_race.4040.a: "Hmm... ti věrní rvači se zdají užiteční..."
 chariot_race.4040.a.flavor: "Potají zajisti pomoc tohoto pochlebníka a [Select_CString(common_fan.IsFemale,'její','jeho')] násilné bandy."
 chariot_race.4040.discord_tt: "Účinky [Concept('intent','záměru')|E] #high $sow_discord_intent$#! jsou zlepšeny"
 chariot_race.4040.thugs_tt: "Tvůj #high $murder_attendee_intent$#! [Concept('intent','záměr')|E] má větší šanci na úspěch"
 chariot_race.4040.b: "[ROOT.Char.GetCapitalLocation.GetNameNoTooltip] je místem, kam skuteční [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')] patří!"
 chariot_race.4040.b.flavor: "Povzbuzujte členy deme, aby se přestěhovali do brzy vznikající bašty [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]."
 chariot_race.4040.b.success: "Deme skanduje tvé jméno"
 chariot_race.4040.b.failure: "Nepodaří se ti nikoho podnítit"
 chariot_race.4040.c: "Povedu mohutné shromáždění #EMP všech#! [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]!"
 chariot_race.4040.c.flavor: "A tím se stát středobodem jejich soudržnosti."
 chariot_race.4040.d: "Lépe se bavit jen s urozenými [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]..."
 chariot_race.4040.team_popularity_tt: "Tento @influence_icon![Concept('influence','vliv')|E] je založena na popularitě tvého týmu"
 chariot_race.4040.team_popularity_rally_tt: "Tento výsledek je ovlivněn popularitou tvého týmu"
 powerful_loyal_deme_modifier: "Mocné loajální deme"
 powerful_loyal_deme_modifier_desc: "Dominantní místní závodnická frakce je oddána svému vládcovi, veřejně prohlašovanému spolufanouškovi."
 sizable_loyal_deme_modifier: "Početná loajální deme"
 sizable_loyal_deme_modifier_desc: "Významná závodnická frakce je oddána svému vládci, veřejně prohlášenému spolufanouškovi."
 flourishing_local_deme_modifier: "Místní deme v rozkvětu"
 flourishing_local_deme_modifier_desc: "Horliví příznivci závodnické frakce se v tomto hrabství sdružují a oživují staré tradice občanského zapojení."
 chariot_race.4050.t: "Dolů..."
 chariot_race.4050.desc.non_abrahamic: "[Select_CString(victim.IsFemale,'Ta','Ten')] [victim.Custom2('InsultAdjective', ROOT.Char)] [victim.Custom2('InsultNoun', ROOT.Char)], [Select_CString(victim.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim'))|l], si zaslouží padnout... dolů, dolů..."
 chariot_race.4050.desc: "Jako padlý anděl, jak si [Select_CString(SCOPE.sC('victim').IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim'))] zaslouží spadnout... dolů,"
 chariot_race.4050.desc.kathisma: "dolů z vysokého říšského lóže, veškerá pýcha místa ztracena nad [Select_CString(victim.IsFemale,'jejím','jeho')] zlámaným tělem, když leží roztažené mezi křičícími prostými lidmi.\n\nNálada hippodromu je stále veselejší, stále více poblouzněná svým zápasem. S císařskými strážemi všude kolem není dokonalý moment k tomu, aby se na [victim.GetName] sáhlo, ale #EMP toto#! se zdá být stejně dobré jako kterékoliv jiné."
 chariot_race.4050.desc.track: "dolů na rozpálený písek, kde kola vozů rozdrtí [Select_CString(victim.IsFemale,'její','jeho')] kosti a okovaná kopyta zničí tu prokletou tvář.\n\nZatímco závod graduje, zaujme [victim.GetTitledFirstName] místo v přední řadě tribuny a vychutnává si dění dole, div se nepřeklání přes zábradlí."
 chariot_race.4050.desc.outro: "\n\nJak blízko je ten blázen k ohavné zkáze..."
 chariot_race.4050.desc.lackey: "Stačí, abych dal pokyn svému oddanému prostředníkovi [lackey.GetFirstName]."
 chariot_race.4050.a: "Je čas, aby [Select_CString(victim.IsFemale,'ji','ho')] mí agenti poslali dolů..."
 chariot_race.4050.a.flavor: "[victim.GetFirstNameNoTooltip] přidá do dnešního představení nádech smrti."
 chariot_race.4050.a.success: "[victim.GetFirstNameNoTooltip] utrpí záhadný pád"
 chariot_race.4050.a.failure: "Tvůj vrah je zadržen"
 chariot_race.4050.b: "#EMP Já#! hodím toho prasáka do [Select_CString(victim.IsFemale,'její','jeho')] ZÁHUBY!"
 chariot_race.4050.b.flavor: "Chytíš [victim.GetFirstNameNoTooltip] a #EMP velmi#! neobratně se pokusíš hodit [Select_CString(victim.IsFemale,'její','jeho')] odporné tělo přes zábradlí."
 chariot_race.4050.b.success: "Pošleš [victim.GetFirstNameNoTooltip] prudce dolů"
 chariot_race.4050.b.failure: "[victim.GetFirstNameNoTooltip] se ti brání"
 chariot_race.4050.might_die: "@death_icon! Můžeš být [Select_CString(ROOT.Char.IsFemale,'zabita','zabit')]"
 chariot_race.4050.might_be_imprisoned: "[host.GetShortUIName] tě může [Concept('imprison','uvěznit')|E]"
 chariot_race.4050.c: "Příliš, příliš veřejné."
 chariot_race.4051.t: "Dolů do bezedné záhuby"
 chariot_race.4051.kathisma_attempt: "Služebník je přikloněn k mému příkazu: přinucen k jisté záhubě s příslibem bohaté odměny. Vrah vstoupí do [Glossary( 'kathisma', 'KATHISMA_GLOSS')]#!, naložený občerstvením, a přiblíží se k [victim.Custom('CZ_TitledFirstName_D')].\n\n"
 chariot_race.4051.stands_attempt: "Pozorujíc z dálky, sotva rozeznávám tlustou hlavu mého svalnatého vraha, jak se plíží skrz přeplněné tribuny směrem k [victim.Custom('CZ_TitledFirstName_D')].\n\n"
 chariot_race.4051.self_attempt: "Ovládá mě neochvějná nenávist. Vrhnu se do útoku, popadnu [victim.Custom('CZ_TitledFirstName_A')] za šaty, smetu [Select_CString(victim.IsFemale,'její','jeho')] ohromený odpor a mrštím [Select_CString(victim.IsFemale,'jí','jím')] k osluněné propasti.\n\n"
 chariot_race.4051.agents_success: "Strhne se velký křik – [victim.GetFirstNameNoTooltip] je [Select_CString(victim.IsFemale,'přehozena','přehozen')] přes zábradlí a ve víru róby a hedvábí se řítí střemhlav dolů! [Select_CString(victim.IsFemale,'Její','Jeho')] tělo padá k zemi jako nějaký pestrý, sestřelený pták."
 chariot_race.4051.agents_fail_secret: "Ale běda – když se můj agent vrhne na svůj cíl, přiskočí na pomoc společníci [victim.Custom('CZ_FirstName_G')]! V následné potyčce je vrah, k mému štěstí, ubodán k smrti.\n\n[victim.GetNameNoTooltip|U] teď ví, že na těchto závodech není v bezpečí... ale netuší, koho podezírat."
 chariot_race.4051.agents_fail_snitch: "Ale běda – když se můj agent vrhne na svůj cíl, přiskočí na pomoc společníci [victim.Custom('CZ_FirstName_G')]! Mého vraha rychle přemohou. A ten neschopný hlupák po pár ubohých kopancích, dupancích a ranách do rozkroku #EMP vyzradí mé jméno!#!\n\nZačínám mít pocit, že na tomto hipodromu nejsem zrovna [Select_CString(ROOT.Char.IsFemale,'vítána','vítán')]..."
 chariot_race.4051.self_failed_survive_kathisma: "Má oběť ale jen tak nespadne. [victim.GetFirstNameNoTooltip|U] se pevně chytí mého pláště, tahá mě za vlasy a vtáhne mě do ošklivé rvačky. Císařští strážní mě rychle chytí.\n\nVysoko nad nesmírným davem mě spoutají do okovů."
 chariot_race.4051.self_failed_survive: "Má oběť ale jen tak nespadne. [victim.GetFirstNameNoTooltip|U] se pevně chytí mého pláště, tahá mě za vlasy a vtáhne mě do ošklivé rvačky. Přihlížející mě rychle chytí a odstrčí zpátky k mé stráži.\n\nNastane chvíle trapného napětí, než rozzuřeně odejdu."
 chariot_race.4051.self_failed_death: "Má oběť ale jen tak nespadne. A – proboha – mé nohy ztrácejí sílu! Zhroutím se do sedadla [victim.Custom('CZ_FirstNameNoTooltip_G')]. Z bodné rány na hrudi mi proudí krev.\n\n[victim.GetNameNoTooltip|U] stojí nade mnou s dýkou v ruce a zuřivě křičí. Ale [ROOT.Char.GetFaith.DeathDeityName] už mě volá..."
 chariot_race.4051.success_death_stands: "\n\nDiváci se shluknou u místa dopadu, jejich výkřiky se nesou: [victim.GetNameNoTooltip] je mrtev!"
 chariot_race.4051.success_death_track: "\n\nNačasování nemohlo být lepší. Vozy divoce uhýbají nové překážce, ale [Glossary( 'kvadriga', 'QUADRIGA_GLOSS')] přesto surově přejede zhroucené tělo [victim.Custom('CZ_FirstNameNoTooltip_G')]. Je okamžitě jasné: [victim.GetNameNoTooltip] je [Select_CString(victim.IsFemale,'mrtvá','mrtvý')]!"
 chariot_race.4051.success_infirm_stands: "\n\nDiváci se shluknou u místa dopadu, jejich vzdechy se nesou: [victim.GetNameNoTooltip] žije, byť jen sotva!"
 chariot_race.4051.success_infirm_track: "\n\nSluhové spěchají ke zhroucenému tělu [victim.Custom('CZ_FirstNameNoTooltip_G')], které leží v písku. Zpráva se šíří: [victim.GetNameNoTooltip] ještě žije, i když jen taktak!"
 chariot_race.4051.a_triumph: "Hodný triumf pro hippodrom!"
 chariot_race.4051.a: "Pošetilá sázka..."
 chariot_race.0400.t: "Ocenění pro vítěze"
 chariot_race.0400.desc_emperor: "Jako císař je mi velkou ctí předat starodávný palmový list [activity.MakeScope.Var('first_place').Char.GetName] na znamení [Select_CString(activity.MakeScope.Var('first_place').Char.IsFemale,'její','jeho')] vítězství. [activity.MakeScope.Var('second_place').Char.GetName] a [activity.MakeScope.Var('third_place').Char.GetName] obdrží své ocenění poté, každá cena je svědectvím jejich výjimečné zdatnosti v aréně."
 chariot_race.0400.desc_spectators: "Když je [activity.MakeScope.Var('first_place').Char.GetName] předán palmový list na připomínku [Select_CString(activity.MakeScope.Var('first_place').Char.IsFemale,'její','jeho')] vítězství, dav propuká v potlesk. [activity.MakeScope.Var('second_place').Char.GetName] a [activity.MakeScope.Var('third_place').Char.GetName] obdrží svá ocenění, každá cena je důkazem jejich výjimečné zdatnosti v aréně."
 chariot_race.0400.a: "Zasloužené vítězství."
 chariot_race.0500.t: "Konec her"
 chariot_race.0500.desc: "Když hippodrom doznívává s tlumenými ovacemi [Glossary( 'hoi polloi', 'HOI_POLLOI_GLOSS')], chvíli přemítám o oslňujících ukázkách dovedností a soutěživosti, které tvoří naši kulturu.\n\nPro vítěze, triumf a sláva; pro dav, ohnivá vášeň. Srdce impéria bije dál s nenapodobitelným zápalem."
 chariot_race.0500.a: "Až příště."
 chariot_race.0600.t: "Vítězství pro [activity.MakeScope.Var('first_place').Char.Custom('GetChariotTeamColorPlural')]!"
 chariot_race.0600.intro: "První tři zápražníci přejedou cílovou čáru! Ozývají se ovace pro [activity.MakeScope.Var('first_place').Char.GetName], [activity.MakeScope.Var('second_place').Char.GetName], a [activity.MakeScope.Var('third_place').Char.GetName]. Nádherná ukázka rychlosti a dovednosti značí závěr závodu. Burácející dav, pohlcený úžasem, přidává hromové ovace k tomuto představení.\n\n"
 chariot_race.0600.desc.won_team: "Moje sázka na [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')] se vyplatila!"
 chariot_race.0600.desc.won_individual: "Moje sázka na [ROOT.Var('wager_target').Char.Custom('CZ_FirstNameNoTooltip_A')] se vyplatila!"
 chariot_race.0600.desc.lost_team: "Moje sázka na [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')] byla špatně promyšlená..."
 chariot_race.0600.desc.lost_individual: "Moje sázka na [ROOT.Var('wager_target').Char.Custom('CZ_FirstNameNoTooltip_A')] byla špatně promyšlená..."
 chariot_race.0600.desc.dead: "Bohužel, [ROOT.Var('wager_target').Char.GetFirstName] [Select_CString(ROOT.Var('wager_target').Char.IsFemale,'nedožila','nedožil')] překročení cílové čáry."
 chariot_race.0600.desc.bookmaker: "\n\nMůj [GetCourtPositionType('bookmaker_court_position').GetName()] [bookmaker.GetFirstName] [Select_CString(bookmaker.IsFemale,'přinesla','přinesl')] slušný zisk ze sázek. Impérium je o [ROOT.Var('gold_gained_emperor').GetValue|V0] zlatých bohatší. [bookmaker.GetFirstNameNoTooltip|U] si samozřejmě [Select_CString(bookmaker.IsFemale,'vzala','vzal')] svůj obvyklý podíl deset procent."
 chariot_race.0600.desc.bookmaker.no_money: "\n\nMůj [GetCourtPositionType('bookmaker_court_position').GetName()], [bookmaker.GetFirstName], hlásí, že bylo nebývale mnoho úspěšných sázek... a následně jen mizivé zisky pro impérium."
 chariot_race.0600.a.individual: "„Skvělá jízda, [ROOT.Var('wager_target').Char.GetFirstNameNoTooltip]!“"
 chariot_race.0600.a.team: "„Dobrá práce, [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]#EMP !#!“"
 chariot_race.0600.a.lost: "Příště více štěstí..."
 chariot_race.0600.a.dead: "Hrozná tragédie..."
 chariot_race_betting_char_outcome_key_title: "Úspěšná sázka"
 chariot_race_betting_char_outcome_key: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'úspěšně vsadila','úspěšně vsadil')], že [CHARACTER.MakeScope.Var('wager_target').GetCharacter.GetShortUIName|U] by [CHARACTER.Custom('GetWinPlaceShow')]\n\n"
 chariot_race_betting_team_outcome_key_title: "$chariot_race_betting_char_outcome_key_title$"
 chariot_race_betting_team_outcome_key: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'úspěšně vsadila','úspěšně vsadil')], že alespoň jeden z [CHARACTER.Custom('GetChariotTeamColorPluralGlossed')] by [CHARACTER.Custom('GetWinPlaceShow')]\n\n"
 chariot_race_lost_bet_tt: "Prohrál jsi @gold_icon! #N [THIS.Var('wager_value').GetValue]#!"
 discredit_claimant_speech_success_log_title: "Císařské oslovení odsuzující uchazeče"
