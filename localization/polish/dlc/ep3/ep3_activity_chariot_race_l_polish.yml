l_polish:
 activity_chariot_race: "Závody vozatajů"
 activity_chariot_race_desc: "Jako [GetPlayer.GetTitleAsNameNoTooltip] mohu [Select_CString(GetPlayer.IsFemale,'jediná','jediný')] pořádat okázalé závody vozatajů, abych [Select_CString(GetPlayer.IsFemale,'pobavila','pobavil')] [Glossary( 'hoi polloi', 'HOI_POLLOI_GLOSS')] a [Select_CString(GetPlayer.IsFemale,'přilákala','přilákal')] osobnosti [GetPlayer.GetPrimaryTitle.GetTierAsNameNoTooltip|l] do hlavního města.\n\nPřes tato veřejná shromáždění lid poznává mě jako svého pána; v hukotu davu mohu doufat, že uslyším oslavné pokřiky."
 activity_chariot_race_destination_selection: "Závody vozatajů lze pořádat pouze ve vašem [Concept('capital','hlavním sídle')|E]."
 activity_chariot_race_host_desc: "$BULLET_WITH_TAB$ Můžeš získat @influence_icon![Concept('influence','vliv')|E]\n$BULLET_WITH_TAB$ Můžeš získat [GetLocalPlayerLegitimacyTextIcon][Concept('legitimacy','legitimitu')|E]\n$BULLET_WITH_TAB$ Můžeš získat @gold_icon![Concept('gold','zlato')|E]\n$BULLET_WITH_TAB$ Můžeš získat #N #EMP nebo ztratit#!#! [Concept('county_opinion','lidové mínění')|E]"
 activity_chariot_race_guest_desc: "\n#weak Účast se sice očekává od všech v říši, ale návštěva vozatajských závodů na hipodromu je i příležitostí setkat se s císařskou elitou a zvýšit svůj [Concept('influence','vliv')|E].\n\nVšichni hosté musí zaplatit malé vstupné [gold_i][EmptyScope.ScriptValue('chariot_race_entrance_fee')|0]."
 activity_chariot_race_conclusion_desc: "Událost [GetActivityType( 'activity_chariot_race' ).GetName] skončila."
 activity_chariot_race_selection_tooltip: "Pořádejte velkolepé závody vozatajů, abyste potěšili lid a upevnili svou pozici jako [GetPlayer.GetTitleAsNameNoTooltip]\n\nOčekávané odměny:\n$BULLET_WITH_TAB$@influence_icon![Concept('influence','Vliv')|E]\n$BULLET_WITH_TAB$@gold_icon![Concept('gold','zlato')|E]"
 HOI_POLLOI_GLOSS: "Doslovně znamená „mnozí“, tento starořecký termín odkazuje na nižší vrstvy byzantské společnosti"
 chariot_race_honorary_guest: "Čestný host"
 chariot_race_honorary_guest_traveling: "$chariot_race_honorary_guest$"
 activity_window_character_chariot_race_honorary_guest: "[Concept('honorary_guest','Čestný host')|E]\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_chariot_race_honorary_guest_traveling: "$activity_window_character_chariot_race_honorary_guest$"
 chariot_race_honorary_guest_concept: "[Concept('honorary_guest','Čestný host')|E]"
 chariot_race_honorary_guest_for_host: "$chariot_race_honorary_guest$"
 chariot_race_honorary_guest_regular: "$honorary_guest$"
 chariot_race_honorary_guest_regular_for_host: "$honorary_guest$"
 chariot_race_honorary_guest_desc: "$chariot_race_honorary_guest_desc_for_host$"
 chariot_race_honorary_guest_desc_for_host: "Hostitel může, pokud chce, pozvat postavu, aby se k němu připojila v [Glossary( 'kathisma', 'KATHISMA_GLOSS')]. To přináší mnoho příležitostí k interakci s touto postavou — k lepšímu i horšímu."
 chariot_race_honorary_guest_regular_desc: "$honorary_guest_desc$"
 chariot_race_honorary_guest_regular_desc_for_host: "$honorary_guest_desc$"
 activity_invite_rule_charioteers: "Vozatajové"
 activity_chariot_race_guest_help_text: "Účast se sice očekává od všech v říši, ale návštěva vozatajských závodů na hipodromu je i příležitostí setkat se s císařskou elitou a zvýšit svůj [Concept('influence','vliv')|E].\n\nVšichni hosté musí zaplatit malé vstupné [gold_i][EmptyScope.ScriptValue('chariot_race_entrance_fee')|0]."
 activity_chariot_race_predicted_cost: "Náklady na [CZActivityNoTooltip('activity_chariot_race','A')] jsou především ovlivněny [Concept('activity_options','možnostmi aktivity')|E], které vyberete."
 chariot_race_base_cost_desc: "[GetActivityType( 'activity_chariot_race' ).GetName] - základní náklady"
 activity_chariot_race_pay_entrance_fee: "Vstupné zaplaceno"
 chariot_race_gambling: "Sázení"
 chariot_race_gambling_desc: "Riskují své peněženky; přítomní spoléhají na naději i modlitby za své oblíbené družstvo."
 chariot_race_phase: "Závod"
 chariot_race_phase_desc: "Písek víří, bičíky praskají a Hippodrom burácí!"
 chariot_race_phase_ceremony: "Ceremonie"
 chariot_race_phase_ceremony_desc: "Náš slavný panovník vyhlašuje vítěze závodů."
 chariot_option_entertainment: "Představení"
 chariot_entertainment_bad: "Laciné zábavy"
 chariot_entertainment_bad_desc: "$EFFECT_LIST_BULLET$ Drobný nárůst [Concept('legitimacy','legitimity')|E]\n$EFFECT_LIST_BULLET$@alert_icon! #alert_trial Upraveno podle [Concept('county_opinion','lidového mínění')|E] v [Concept('capital','hlavním sídle')|E]#!\n\n#weak Po staletí závody upevňovaly pouto mezi vládcem a lidem, svědčily o velikosti a štědrosti. Pokud jsou obřady provedeny dobře, nemělo by být potřeba ničeho dalšího.#!"
 chariot_entertainment_normal: "Tradiční obřady"
 chariot_entertainment_normal_desc: "$EFFECT_LIST_BULLET$ Střední nárůst [Concept('legitimacy','legitimity')|E] a [Concept('county_opinion','lidového mínění')|E]\n$EFFECT_LIST_BULLET$@alert_icon! #alert_trial Upraveno podle [Concept('county_opinion','lidového mínění')|E] v [Concept('capital','hlavním sídle')|E]#!\n\n#weak Mezi závody se lidé baví při představeních mimů, akrobatů a vězňů v řetězech. Přijíždějící významné osobnosti budou hostěny formálními císařskými recepcemi.#!"
 chariot_entertainment_good: "Potěšení masám"
 chariot_entertainment_good_desc: "$EFFECT_LIST_BULLET$ Výrazný nárůst [Concept('legitimacy','legitimity')|E] a [Concept('county_opinion','lidového mínění')|E]\n$EFFECT_LIST_BULLET$@alert_icon! #alert_trial Upraveno podle [Concept('county_opinion','lidového mínění')|E] v [Concept('capital','hlavním sídle')|E]#!\n\n#weak Naši nejváženější hosté budou hojně obdarováni pávami, sobolími kožešinami, parfémy: vznešenými císařskými dary! A všelijací zabavovatelé zaplní Hippodrom, zatímco do ochozů budou létat chleby a mince.#!"
 chariot_race_host_rewards_title: "Odměny hostitele"
 chariot_race_reward_high_county_opinion_tt: "#weak Odměny zlepšeny vysokým [Concept('county_opinion','lidovým míněním')|E] v [Concept('capital','hlavním sídle')|E]"
 chariot_race_reward_low_county_opinion_tt: "#weak Odměny poškozeny nízkým [Concept('county_opinion','lidovým míněním')|E] v [Concept('capital','hlavním sídle')|E]"
 CHARIOTEER_APTITUDE_GUI_TOOLTIP: "[Concept('aptitude','Způsobilost')|E] [Character.Custom('CZ_FirstNameNoTooltip_G')] pro řízení vozu je [Character.GetCourtPositionAptitude( GetCourtPositionType( 'charioteer_court_position' ) )]"
 YOUR_CHARIOTEER_TOOLTIP: "Zaměstnáváte [Character.GetShortUIName] jako svého [GetCourtPositionType( 'charioteer_court_position' ).GetName]."
 YOUR_WAGER_TOOLTIP: "[GetPlayer.Custom('BuildChariotRaceWagerTooltip')]"
 every_losing_charioteer_xp_gain: "Všichni ostatní vozatajové získají #high 3#! [Concept('trait_level_track_xp','zkušenosti rysu')|E]"
 increase_influence_intent: "Zvýšit vliv"
 increase_influence_intent_desc: "Se [Concept('strategoi','stratégy')|E] a [Concept('noble_families','šlechtickými rodinami')|E] shromážděnými na Hippodromu se zaměříte na to, abyste se protlačili mezi nimi a získali [Concept('influence','vliv')|E]."
 sow_discord_intent: "Rozsévat nesvár"
 sow_discord_intent_desc: "Lepší příležitost podkopat [Concept('county_control','kontrolu hrabství')|E] a [Concept('county_opinion','lidové mínění')|E] v hlavním městě a pošpinit vládu [GetPlayer.GetTopLiege.Custom('CZ_TitleAsNameNoTooltip_G')] ve prospěch [Select_CString(GetPlayer.GetTopLiege.IsFemale,'jejích','jeho')] ctižádostivých nástupců neexistuje... nanejvýš účinná strategie proti neoblíbeným panovníkům."
 appease_populace_intent: "Uklidnit lid"
 appease_populace_intent_desc: "Chceš zvýšit svou [Concept('legitimacy','legitimitu')|E] a [Concept('county_opinion','lidové mínění')|E] ve svém [Concept('realm_capital','hlavním městě říše')|E] [GetPlayer.GetCapitalLocation.GetNameNoTooltip]. Tím vyvážíš účastníky, kteří z nepřátelství vůči tobě zvolí [Concept('intent','záměr')|E] $sow_discord_intent$."
 chariot_race.0001.t: "Město v očekávání"
 chariot_race.0001.desc: "Pod mým vysokým [Glossary( 'kathisma', 'KATHISMA_GLOSS')], jsou velké sochy Hippodromu vyleštěny, písek pečlivě očištěn a místa pro tisíce diváků připravena.\n\nUlice [ROOT.Char.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_G')] mezitím šílí očekáváním. Politické síly všech druhů vykřikují svá poselství, cestující začínají shánět ubytování... a dokonce i v paláci se vše točí kolem Prasinoi a Venetoi."
 chariot_race.0001.desc_spectator: "[host.GetCapitalLocation.GetTitle.GetNameNoTier] je plné hluku a očekávání: závody se blíží! Z hospod podél ulic se linou dohady o veřejném vystoupení [host.Custom('CZ_TitleAsName_G')]. Bude žádat sliby? Vyslyší starosti [Glossary( 'hoi polloi', 'HOI_POLLOI_GLOSS')]? A jaké odpovědi zazní – jaké výkřiky, jaké chorály?\n\nNálady v ulicích už vřou mezi těmi, které rozdmýchali císařští agenti, a těmi, které rozněcují jiné vášně. Nade vším však zuří jeden velký, vášnivý spor: který vozataj si na hipodromu vybojuje vítězství!"
 chariot_race.0001.a: "Ať se demes probudí!"
 KATHISMA_GLOSS: "Imperiální lóže Hippodromu. Spirálové schodiště spojovalo toto vyhlídkové místo s palácem, což Basileovi usnadňovalo vstup... a bezpečný odchod."
 DEMES_GLOSS: "Sportovní a politické organizace zaměřené na závody vozatajů. Dříve měly #EMP demes#! v občanském životě velký vliv, ale od té doby upadly a byly podrobeny císařské moci."
 QUADRIGA_GLOSS: "Čtyřspřežní vůz. Rychlé, nebezpečné a drahé, #EMP téthrippa#!, nebo #EMP quadrigae#!, byly od starověku oblíbenými vozidly králů, císařů a bohů."
 chariot_race.0100.t: "Otevření sázek"
 chariot_race.0100.desc: "#EMP Ding! Ding! Ding!#!\n\nZvonek [GetCourtPositionType('bookmaker_court_position').GetName()] oznamuje, že nyní lze stavit na časem prověřené týmy závodů.\n\n"
 chariot_race.0100.desc.emperor: "Jak se na můj nejvyšší úřad sluší, přivedou ke mně [GetCourtPositionType('bookmaker_court_position').GetNameNoTooltip|l], který se přede mnou pokorně skloní, zatímco zvažuji svou sázku. To rozhodnutí není maličkost: podpora určitého vozataje nebo týmu má důsledky finanční i dosti politické."
 chariot_race.0100.desc.others: "Sázky váženějších diváků jsou přijímány nějakým pobíhajícím úředníkem. Může být vyhráno či ztraceno mnoho mincí... a také společenské postavení mezi spolufandy a soupeři."
 chariot_race.0100.a: "Podpořím #charioteer_blue Venetoi#!#!."
 chariot_race.0100.b: "Podpořím #difficulty_easy Prasinoi#!."
 chariot_race.0100.c: "Podpořím #bold Leukoi#!."
 chariot_race.0100.d: "Podpořím #difficulty_hard Rhousioi#!."
 chariot_race.0100.e: "Nevsadit."
 chariot_race.0110.t: "Hrdinové okruhu"
 chariot_race.0110.desc: "[root_scope.Custom('GetChariotTeamColorPluralGlossed')] nasazují skvělou družinu zručných jezdců, jejichž jména jsou jistě mezi těmi, jež se chválí na trzích a jež děti vyslovují s úctou. Dokonce i císařský dvůr se nad nimi rozplývá!\n\nMohl bych #EMP vsadit#! na kterékoli z těchto celebrit, ale možná žádný jediný závodník není zdaleka největším favoritem..."
