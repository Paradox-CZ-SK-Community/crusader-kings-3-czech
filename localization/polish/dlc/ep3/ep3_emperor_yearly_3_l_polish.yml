l_polish:
 ep3_emperor_yearly.3000.t: "Právo plenění paláce"
 ep3_emperor_yearly.3000.desc: "Mými novými císařskými síněmi se potácejí obří, chlupatí Varjagové s náručí plnou zlata a šperků.\n\nPo smrti [dead_emperor.Custom('CZ_TitledFirstName_G')] se ti, kdo by [Select_CString(dead_emperor.IsFemale,'ji','ho')] bránili do posledního dechu, vrhli do pokladnic. Je to jejich tradiční právo a nikdo se neodváží těmto elitním cizincům bránit, aby si vzali třpytivé odměny.\n\nTo je cena, kterou platím za to, aby moji [GetMaA('varangian_guards').GetName], mí přísahou spoutaní psi, zůstali spokojeně na vodítku.\n\n"
 ep3_emperor_yearly.3000.desc_leader: "A tak pod vedením [varangian_leader.Custom('CZ_FullName_G')] sahají do pokladny [Select_CString(ROOT.Char.IsFemale,'panovnice, kterou','panovníka, kterého')] si [Select_CString(EqualTo_string(ROOT.Char.GetFaith.HighGodHerHis,Localize('CHARACTER_HERHIS_HER')),'vyvolila','vyvolil')] [ROOT.Char.GetFaith.HighGodName]."
 ep3_emperor_yearly.3000.desc_no_leader: "A tak Seveřané sahají do pokladny [Select_CString(ROOT.Char.IsFemale,'panovnice, kterou','panovníka, kterého')] si [Select_CString(EqualTo_string(ROOT.Char.GetFaith.HighGodHerHis,Localize('CHARACTER_HERHIS_HER')),'vyvolila','vyvolil')] [ROOT.Char.GetFaith.HighGodName]."
 ep3_emperor_yearly.3000.a: "„Zastav je, akoluthe! Vrať mi mé zlato!“"
 ep3_emperor_yearly.3000.a.flavor: "„[varangian_leader.GetFirstNameNoTooltip|U]! [Select_CString(varangian_leader.IsFemale,'Byla jsi jmenována velitelkou gardy, abys gardu kontrolovala','Byl jsi jmenován velitelem gardy, abys gardu kontroloval')]. #EMP Udělej to!#!“"
 ep3_emperor_yearly.3000.b: "Ať je to zvyk nebo ne, potrestám tyto hrubiány!"
 ep3_emperor_yearly.3000.b.flavor: "Nechají si svou odměnu — ale císařský palác musí zachovat důstojnost. Je třeba udělat příklad!"
 ep3_emperor_yearly.3000.c: "Věrnost má svou cenu."
 ep3_emperor_yearly.3000.c.flavor: "Varjagové se vzdávají pravidelných bohatých platů a cestují daleko, aby získali tuto velikou pozornost."
 akolouthos_aptitude_option_unlock: "Tato možnost je dostupná díky vysoké [Concept('aptitude','způsobilosti')|E] [GetCourtPositionType('akolouthos_court_position').GetName()]"
 disrespected_varangians_modifier: "Zneuctění Varjagů"
 disrespected_varangians_modifier_desc: "Zpochybnění práva Varjažské gardy na bonus vážně poškodilo jejich loajalitu a loajalitu podobných žoldnéřských oddílů."
 major_gold_to_varangians_tooltip: "Platíte [gold_i]#negative_value 75#! kvůli #high 3#! držitelům varjažského [Concept('court_position','dvorského úřadu')|E]"
 medium_gold_to_varangians_tooltip: "Platíte [gold_i]#negative_value 50#! kvůli #high 2#! držitelům varjažského [Concept('court_position','dvorského úřadu')|E]"
 minor_gold_to_varangians_tooltip: "Platíte [gold_i]#negative_value 25#! jednomu držiteli varjažského [Concept('court_position','dvorského úřadu')|E]"
 loyal_varangians_modifier: "Stateční Varjagové"
 loyal_varangians_modifier_desc: "Posíleni neochvějnými Varjagy, těžké pěší formace této postavy drží pevně a udeří tvrdě."
 attentive_varangians_modifier: "Svědomití Varjagové"
 attentive_varangians_modifier_desc: "Dobře odměněná za svou službu, Varjažská garda se vyhýbá rvačkám a veselí ve prospěch svědomité ochrany."
 eager_varangian_army: "Houf Varjagů"
 ep3_emperor_yearly.3011.t: "Náš tajný oheň"
 ep3_emperor_yearly.3011.intro: "[Select_CString(invader.IsFemale,'Tato','Tento')] [invader.GetTitleAsName] [CZPrepZ(invader.GetPrimaryTitle.GetNameNoTierNoTooltip)] [invader.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] by [Select_CString(invader.IsFemale,'měla','měl')] vědět lépe, než vplout do poklidného [army.GetLocation.GetNameNoTooltip] a postavit se městu, které si [Select_CString(EqualTo_string(ROOT.Char.GetFaith.HighGodHerHis,Localize('CHARACTER_HERHIS_HER')),'vybrala','vybral')] [ROOT.Char.GetFaith.HighGodName]."
 ep3_emperor_yearly.3011.liege_attacking: "vyplout"
 ep3_emperor_yearly.3011.commander_attacking: "vyslat flotilu [invading_commander.Custom('CZ_TitledFirstName_G')]"
 ep3_emperor_yearly.3011.no_commander: "odeslat flotilu bez velitele"
 ep3_emperor_yearly.3011.desc: "do poklidných vod [army.GetLocation.GetNameNoTooltip] – raději tam než pokoušet osud, který řídí [ROOT.Char.GetFaith.HighGodName].\n\n[Glossary( 'Dromóny', 'DROMONS_GLOSS' )] mé flotily s bronzovými sifony v dračích tlamách odrážejí od mol. Bude-li hladina klidná a kapitáni dobře sladí útok... moji nepřátelé shoří.\n\nPokud si však [ROOT.Char.GetFaith.HighGodName] za naše hříchy vyžádá daň, uhoří i mnoho obránců z [ROOT.Char.GetCapitalLocation.GetCounty.GetCulture.Custom('CZ_AdjectiveNoTooltip_eeho')] lidu – tekutý oheň je ztělesněný chaos!"
 ep3_emperor_yearly.3011.kyrie_eleison: "[Glossary( 'Kýrie, eléison', 'KYRIE_ELEISON_GLOSS' )]!"
 KYRIE_ELEISON_GLOSS: "#bold Kýrie, eléison#! — „Pane, smiluj se nade mnou!“ — je křesťanská modlitba s mnohostranným použitím. Zpívá se při korunovacích, při inauguracích papežů; byzantská vojska ji používají jako válečný pokřik."
 ep3_emperor_yearly.3011.a: "Zapalte #EMP přímo samotnou vodu#!"
 ep3_emperor_yearly.3011.a.success: "Útok spálí nepřítele na popel"
 ep3_emperor_yearly.3011.a.fail: "Bylo způsobeno značné množství škod"
 ep3_emperor_yearly.3011.a.critical_fail: "Tvé lodě zničí samy sebe"
 ep3_emperor_yearly.3011.b: "Flotilu riskovat nemohu."
 unable_to_use_fire_ships_tooltip: "@alert_icon! #alert_trial Tvé lodě s řeckým ohněm nebudou po dobu #high 30 dní#! k dispozici"
 ravaged_by_greek_fire_modifier: "Zdevastováno řeckým ohněm"
 ravaged_by_greek_fire_modifier_desc: "Přeživší vojáci tohoto vojska jsou strašně popálení a naprosto demoralizovaní."
 defenders_immolated_modifier: "Obránci upáleni"
 defenders_immolated_modifier_desc: "Zdejší přístav je bez flotily a hradby hlídají obvázaní, děsivě popálení přeživší."
 assaulted_by_greek_fire_modifier: "Napadeno řeckým ohněm"
 assaulted_by_greek_fire_modifier_desc: "Síly této postavy byly demoralizovány, rozprášeny a mnozí z nich byli zaživa spáleni při námořním útoku řeckým ohněm."
 ep3_emperor_yearly.3012.t: "Draci na Bosporu"
 ep3_emperor_yearly.3012.intro: "Moje [Glossary( 'dromons', 'DROMONS_GLOSS' )] tlačí dopředu, pádlují blízko, aby jejich hrůzostrašné zbraně olizovaly [invader.GetPrimaryTitle.GetAdjective] flotilu.\n\nHřmotné výbuchy duní nad [CZProvNameNoTooltip(army.GetLocation,'I')]! Velké ohnivé ocasy osvětlují bojiště dusící se kouřem, ohlušené pekelnými výkřiky.\n\n"
 ep3_emperor_yearly.3012.attack_success: "Lodě [invader.Custom('CZ_TitledFirstName_G')] vzplanou jako vysoké pohřební hranice. Kvílející, ohořelá těla z nich skáčou do moře a prosí o spásu, kterou má přinést [invader.GetFaith.HighGodName] – ale i ve vodě nacházejí mí nepřátelé jen spravedlivý oheň!\n\nZatímco moře plane, mé dromóny se vracejí s vítězstvím."
 ep3_emperor_yearly.3012.attack_fail: "Některá [invader.GetPrimaryTitle.GetAdjectiveNoTooltip] plavidla vzplanou, jejich zoufalé posádky ječí v agónii, ale jiná plavidla se rozutečou a vyhnou se útoku. Brzy se mé dromóny vracejí ke svým molům, páchnoucí dehtem a naphtou.\n\nNepřátelská síla, ač spálená a oslabena, má stále určitou sílu."
 ep3_emperor_yearly.3012.attack_crit_fail: "Ale ach — #EMP moje flotila hoří!#! Neboť když neukázněné vlny vrhají plameny mých sifonů na paluby #EMP vlastních#! dromónů, [invader.GetPrimaryTitle.GetAdjectiveNoTooltip] lodě zůstávají těsně mimo náš dosah.\n\nJen pár přátelských lodí přežije, aby kulhaly zpět do velkého přístavu Konstantinopole."
 ep3_emperor_yearly.3012.a_success: "Kdysi vetřelci — nyní #EMP popel!#!"
 ep3_emperor_yearly.3012.a_fail: "Dokonce i oheň [ROOT.Char.GetFaith.PositiveAfterLife] má své meze."
 ep3_emperor_yearly.3012.a_crit_fail: "Katastrofa!"
 two_knights_killed_tooltip: "@death_icon!#high 2#! [Concept('knights','rytíři')|E] jsou zabiti"
 three_knights_killed_tooltip: "#high 3#! [Concept('knights','rytíři')|E] jsou zraněni"
 two_knights_wounded_tooltip: "#high 2#! [Concept('knights','rytíři')|E] jsou zraněni"
