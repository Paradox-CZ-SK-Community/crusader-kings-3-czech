l_polish:
 ep3_eparch_event.0001.t: "$eparch_court_position$: Opevnění hlavního města"
 ep3_eparch_event.0001.desc_intro: "[emperor.GetPrimaryTitle.GetTierAsNameNoTooltip] vede válku. Je sužován [attacker.GetCulture.GetCollectiveNounNoTooltip] a [attacker.Custom('CZ_InsultAdjective_I')] [attacker.GetTitledFirstName].\n\n"
 ep3_eparch_event.0001.desc_winning_war: "[emperor.GetTitledFirstName] se zdá, že získává převahu, ale bylo by nerozumné prohlašovat vítězství, dokud válka skutečně neskončila."
 ep3_eparch_event.0001.desc_losing_war: "[emperor.GetTitledFirstName] bojuje těžký boj. Je pravděpodobné, že je jen otázkou času, než se válka rozšíří dál."
 ep3_eparch_event.0001.desc_undecided_war: "Je příliš brzy na to, říci, jaký bude výsledek, protože žádná ze stran zatím nezískala výraznou převahu."
 ep3_eparch_event.0001.desc_outro: "\n\n[capital.GetTitle.GetNameNoTier] je zatím v bezpečí. #EMP Prozatím#!. Bylo by však rozumné být dobře připraveni, pokud by válka dorazila až k našim branám..."
 ep3_eparch_event.0001.a: "Hlavní město #EMP musí#! být chráněno!"
 ep3_eparch_event.0001.b: "Mírná vylepšení by měla stačit."
 ep3_eparch_event.0001.c: "Jistě, [capital.GetTitle.GetNameNoTierNoTooltip] není v žádném #EMP skutečném#! nebezpečí?"
 ep3_eparch_event.0002.desc: "[Select_CString(eparch.IsFemale,'Má','Můj')] [emperor.Custom2('RelationToMeShort',eparch)] [eparch.GetTitledFirstName] [Select_CString(eparch.IsFemale,'podnikla','podnikl')] významná opatření, aby [Select_CString(eparch.IsFemale,'udržela','udržel')] hlavní město v bezpečí v těchto časech války.\n\n"
 ep3_eparch_event.0002.desc_at_home: "„Podívej se sem!“ říká [eparch.GetFirstNameNoTooltip], kráčejíc vpřed s dychtivými kroky. „Tyto hradby byly posíleny a značně vylepšeny. Tam vidíš také nové kasárny, připravené pro mnohem větší posádku.“\n\n„Troufám si říci, že [capital.GetTitle.GetNameNoTier] je připraveno na dlouhé obléhání, můj [emperor.GetLadyLord], pokud válka dorazí do našeho milovaného města.“"
 ep3_eparch_event.0002.desc_away: "Dopis v mé ruce popisuje několik částí hradeb, které byly výrazně opevněny a vylepšeny, a také přidělení dalších vojáků k posádce. Zdá se, že [capital.GetTitle.GetNameNoTier] je v dobrých rukou a dobře připraveno na možné obléhání."
 ep3_eparch_event.0002.a: "Taková pečlivost by měla být odměněna!"
 ep3_eparch_event.0002.b: "[eparch.GetSheHe|U] jen dělá [Select_CString(eparch.IsFemale,'její','jeho')] práci."
 ep3_eparch_event.0005.t: "$eparch_court_position$: Ztráta kontroly"
 ep3_eparch_event.0005.desc: "Naše kontrola nad [capital.GetTitle.Custom('CZ_LandedNameNoTier_I')] slábne...\n\nZločinci rychle využívají situace a pohybují se ulicemi bez překážek právě v tuto chvíli. Je #EMP mou#! odpovědností zajistit bezpečí města a každého občana v těchto hradbách."
 ep3_eparch_event.0005.a: "Zaplatíme pár dalším lidem, aby hlídkovali ulice."
 ep3_eparch_event.0005.b: "Možná bychom mohli poštvat zločince proti sobě navzájem?"
 ep3_eparch_event.0005.b_success_tt: "Úspěšně se ti podaří zmanipulovat zločince"
 ep3_eparch_event.0005.b_success: "Manipulace byla úspěšná"
 ep3_eparch_event.0005.b_failure_tt: "Nepodařilo se ti poštvat zločince proti sobě"
 ep3_eparch_event.0005.b_failure: "Manipulace selhala"
 ep3_eparch_event.0005.success_liege: "$eparch_court_position$ úspěšně zvýší [Concept('control','kontrolu')|E]"
 ep3_eparch_event.0005.failure_liege: "$eparch_court_position$ nezvýší [Concept('control','kontrolu')|E]"
 ep3_eparch_event.0005.c: "[marshal.GetCouncilTitleFirstNameNoTooltip] by mohl pomoci?"
 ep3_eparch_event.0005.d: "Není třeba přehánět. Situace není #EMP tak#! zoufalá."
 ep3_eparch_event.0010.t: "$eparch_court_position$: Město postihla nemoc"
 ep3_eparch_event.0010.desc: "[capital.GetTitle.Custom('CZ_LandedNameNoTier_A')] postihla nemoc!\n\n[capital_plague.GetName] se šíří po hlavním městě. Infikuje občany po celém městě, bez ohledu na postavení, slávu či dvorský status. Jako vždy nejvíce trpí ti, kteří nemají prostředky a zlato na lékaře.\n\n[ROOT.Char.GetTopLiege.GetTitledFirstName] ode mne očekává, že podniknu kroky a udělám, co mohu, abych [Select_CString(ROOT.Char.IsFemale,'zabránila','zabránil')] katastrofě."
 ep3_eparch_event.0010.a: "Jsou třeba drastická opatření. Uvalíme karanténu!"
 ep3_eparch_event.0010.b: "Prohledejte město a najděte lékaře, dejte je do práce."
 ep3_eparch_event.0010.c: "Můj lékař [physician.GetFirstNameNoTooltip] může pomoci!"
 ep3_eparch_event.0010.d: "Obávám se, že nemůžeme nic dělat..."
 ep3_eparch_event.0010.c_success_tt: "[physician.GetTitledFirstName] uspěje při zmírnění moru"
 ep3_eparch_event.0010.c_success: "[physician.GetTitledFirstName] [Select_CString(physician.IsFemale,'uspěla','uspěl')]"
 ep3_eparch_event.0010.c_failure_tt: "[physician.GetTitledFirstName] selže při zmírnění moru"
 ep3_eparch_event.0010.c_failure: "[physician.GetTitledFirstName] [Select_CString(physician.IsFemale,'selhala','selhal')]"
 ep3_eparch_event.0015.t: "$eparch_court_position$: Univerzita potřebuje učitele"
 ep3_eparch_event.0015.desc: "Univerzita [CZPrepV(capital.GetTitle.GetNameNoTierNoTooltip)] [capital.GetTitle.Custom('CZ_LandedNameNoTier_L')] poslala poselství vysvětlující svou potřebu více učitelů.\n\nPodrobně rozvádí, jak poskytování kvalitního vzdělání je nejvyšší prioritou, a bez dalšího personálu nebudou schopni splnit očekávání [emperor.GetTitledFirstNamePossessive]. Univerzita mne naléhavě žádá, abych rychle [Select_CString(ROOT.Char.IsFemale,'najala','najal')] vhodného kandidáta."
 ep3_eparch_event.0015.a: "Náhodou znám ideálního kandidáta!"
 ep3_eparch_event.0015.b: "Rod [powerful_house_head.GetHouse.GetBaseNameNoTooltip] je hoden této pozice."
 ep3_eparch_event.0015.c: "Určitě se najde učenec, kterého mohu najmout ve městě."
 ep3_eparch_event.0015.d: "Co kdybys [Select_CString(teacher_local_scholar.IsFemale,'pracovala','pracoval')] pro mne, [teacher_local_scholar.Custom('CZ_FirstNameNoTooltip_V')]?"
 ep3_eparch_event.0015.e: "Prozatím si budou muset vystačit."
 ep3_eparch_event.0015.b.msg.t: "Jmenován učitel"
 ep3_eparch_event.0015.b.msg.desc: "$eparch_court_position$ jmenoval [teacher_powerful_family.Custom('CZ_ShortUIName_A')] [Select_CString(teacher_powerful_family.IsFemale,'učitelkou','učitelem')] na univerzitě [CZPrepV(capital.GetTitle.GetNameNoTierNoTooltip)] [capital.GetTitle.Custom('CZ_LandedNameNoTier_L')]"
 teacher_moves_to_capital_tt: "[teacher_tt.GetShortUIName|U] se stěhuje do [capital.GetTitle.Custom('CZ_LandedNameNoTier_G')] jako učitel"
 ep3_eparch_event.0020.t: "$eparch_court_position$: Za vykonané služby"
 ep3_eparch_event.0020.desc_intro: "Když kráčím potemnělou chodbou, mé myšlenky přeruší hlas volající mé jméno. Otočím se a vidím [emperor.GetShortUIName], jak přichází se sluhou.\n\n„[eparch.GetFirstNameNoTooltip]! Výtečně jsi si vedl při dohledu nad [capital.GetTitle.Custom('CZ_LandedNameNoTier_I')]. Taková pečlivost by měla být odměněna a já s radostí vyhovím.“\n\n"
 ep3_eparch_event.0020.desc_gold: "[emperor.GetSheHe|U] kývne na sluhu, aby přistoupil. Sluha otevře víko malé truhlice a ukáže její obsah. Je plná mincí, drahých kamenů a dalších cenností!"
 ep3_eparch_event.0020.desc_artifact: "Sluha přistoupí blíž. Rychlým pohybem odhrne kus látky a odhalí pod ní artefakt."
 ep3_eparch_event.0020.desc_hook_removal: "[emperor.GetTitleAsNameNoTooltip] pokračuje: „[Select_CString(emperor.IsFemale,'Mluvila','Mluvil')] jsem s [peer_with_hook.Custom('CZ_ShortUIName_I')] a [Select_CString(emperor.IsFemale,'přesvědčila','přesvědčil')] [peer_with_hook.GetHerHim], aby se [Select_CString(peer_with_hook.IsFemale,'vzdala','vzdal')] každé laskavosti, kterou jsi [Select_CString(peer_with_hook.IsFemale,'jí','mu')] [Select_CString(ROOT.Char.IsFemale,'dlužila','dlužil')]. [peer_with_hook.GetSheHe|U] ti už nebude dělat problémy.“"
 ep3_eparch_event.0020.desc_emperor_hook: "„Pokud budeš něco potřebovat, a myslím tím #EMP cokoliv#!, neváhej mi to dát vědět. Udělám, co bude v mých silách, abych ti pomohl.“"
 ep3_eparch_event.0020.a: "Děkuji ti, můj [emperor.GetLadyLord]!"
 ep3_eparch_event.9000.t: "$eparch_court_position$: Zanedbání povinnosti"
 ep3_eparch_event.9000.desc: "Jako $eparch_court_position$ je povinností [eparch.GetTitledFirstNamePossessive] starat se o všechny potřeby [capital.GetTitle.GetNameNoTierPossessive], jako by město bylo [Select_CString(eparch.IsFemale,'jejím','jeho')] vlastním domem!\n\nPřesto [eparch.GetSheHe] vážně [Select_CString(eparch.IsFemale,'zanedbala','zanedbal')] tuto důležitou odpovědnost, [Select_CString(eparch.IsFemale,'zradila','zradil')] mou důvěru a [Select_CString(eparch.IsFemale,'promarnila','promarnil')] #EMP privilegium#!, které jsem [Select_CString(eparch.IsFemale,'jí','mu')] [Select_CString(ROOT.Char.IsFemale,'udělila','udělil')]! A kvůli čemu? Aby [Select_CString(eparch.IsFemale,'sledovala','sledoval')] vlastní zájem.\n\n[eparch.GetFirstNameNoTooltip] čeká na můj rozsudek..."
 ep3_eparch_event.9000.a: "Naprosto nepřijatelné! Jsi propuštěn! #EMP ven#!!"
 ep3_eparch_event.9000.b: "Považuj to za varování. Ale budeš mi #EMP dlužit#!!"
 ep3_eparch_event.9000.c: "Přehlédnu to. Prozatím."
 ep3_eparch_event.9001.intro: "Dorazím do trůnního sálu po předvolání od [emperor.Custom('CZ_TitledFirstName_G')] a rychle přistoupím k trůnu.\n\n"
 ep3_eparch_event.9001.desc_fired: "„[Select_CString(eparch.IsFemale,'Zklamala','Zklamal')] jsi mě, [eparch.Custom('CZ_FirstNameNoTooltip_V')]. [Select_CString(emperor.IsFemale,'Svěřila','Svěřil')] jsem ti [capital.GetTitle.Custom('CZ_LandedNameNoTier_A')], a ty jsi mi [Select_CString(eparch.IsFemale,'poděkovala','poděkoval')] tím, že jsi #EMP zcela#! [Select_CString(eparch.IsFemale,'ignorovala','ignoroval')] potřeby města! Tvé chování je nepřijatelné.“\n\n[emperor.GetTitleAsName] povstane: „Jsi [Select_CString(eparch.IsFemale,'zbavena','zbaven')] úřadu [GetCourtPositionType('eparch_court_position').GetNameNoTooltip()]. Považuj se za [Select_CString(eparch.IsFemale,'šťastnou','šťastného')], že nepodnikám další kroky.“"
 ep3_eparch_event.9001.desc_warned: "„[Select_CString(emperor.IsFemale,'Dozvěděla','Dozvěděl')] jsem se, že zanedbáváš své povinnosti, [eparch.Custom('CZ_FirstNameNoTooltip_V')].“ [emperor.GetFirstNameNoTooltip] zavrtí hlavou. „Považuj to za varování. [Select_CString(emperor.IsFemale,'Rozhodla','Rozhodl')] jsem se tě tentokrát ušetřit. #EMP Prozatím#!. Snad je jasné, že mi budeš dlužit.“\n\n[emperor.GetTitleAsNameNoTooltip] mne mávnutím ruky propustí."
 ep3_eparch_event.9001.desc_nothing: "Rychle je mi jasné, že něco není v pořádku. Ticho a napětí ve vzduchu mluví za vše.\n\n[emperor.GetSheHe|U] #EMP ví#!, že jsem [Select_CString(ROOT.Char.IsFemale,'zanedbávala','zanedbával')] své povinnosti jako správce [capital.GetTitle.GetNameNoTierPossessive], že ano? Čekám na svůj ortel.\n\nMinuty plynou a nic se neděje. [emperor.GetFirstNameNoTooltip] na mne krátce pohlédne a poté odejde. Zdá se, že [emperor.GetTitleAsName] se [Select_CString(emperor.IsFemale,'rozhodla','rozhodl')] přehlédnout mé provinění. Prozatím."
 ep3_eparch_event.9001.a: "Cože? #EMP Propuštěn?!#!"
 ep3_eparch_event.9001.b: "To mohlo skončit mnohem hůř..."
 ep3_eparch_event.9001.c: "Možná bych měl považovat za štěstí."
 eparch_hook_warning: "@alert_icon! #alert_trial [eparch.GetTitledFirstName] má na tebe páku – tato akce má další následky#!"
 eparch_neglecting_duty_warning_tt: "@alert_icon! #alert_trial Nepřetržité zanedbávání povinností může způsobit, že si toho [Concept('liege','lenní pán')|E] všimne a podnikne kroky#!"
 eparch_reward_msg_title: "Odměněn za povinnosti"
 duel_aptitude_challenge: "Zkouška [Concept('aptitude','způsobilosti')|E]"
