 latin_emp_simp_modifier: "Napodobitel Řeků"
 latin_emp_simp_modifier_desc: "Latinští rytíři tohoto panovníka projevují pohrdání; jejich vazalové oplakávají práva a svobody ztracené kvůli napodobě centralizované řecké vlády."
 ep3_frankokratia_events.0120.t: "Cesta císařů"
 ep3_frankokratia_events.0120.hippodrome: "Jsem pánem [ROOT.Char.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_G')], krásného a zničeného. [Glossary( 'Blachernae Palace', 'BLACHERNAE_PALACE_GLOSS')], Hagia Sophia, starý Hipodrom..."
 ep3_frankokratia_events.0120.estate: "Jsem pánem [ROOT.Char.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_G')] a mám výběr z jeho paláců. Mramorové předsíně, zlaté mozaiky, zdi střežené božskou prozřetelností..."
 ep3_frankokratia_events.0120.desc: "zatímco hledím ven, osvětluje mi to jeden z tvorů řecké byrokracie. Ale [eunuch.GetTitledFirstName], tento moudrý eunuch, nabírá odvahy.\n\n„Po staletí měli naši slavní basileové takovou moc! Dokážete si představit, [ROOT.Char.Custom('FormOfAddressForLiege')], že by celá říše čekala na vaše výnosy? A to i bez práva krve či válečné kořisti, kterou byste jí [Select_CString(ROOT.Char.IsFemale,'nabídla','nabídl')]?“\n\nTo je vskutku moc! Dokázali by moji latinští vazalové, mí utržení psi, přestat drancovat řecké úřady? Snesli by těsné řecké obojky...?"
 ep3_frankokratia_events.0120.a: "Existuje #EMP jedno#! nebo #EMP dvě#! řecké zvyky, které obdivuji..."
 ep3_frankokratia_events.0120.a.flavor: "#EMP ...jejich hrozné tresty!#! Jejich strach z císařské moci! Ať obřady Řeků naplní mé pokladnice!"
 ep3_frankokratia_events.0120.b: "Dovolím si důvěřovat Řekům a jejich způsobům..."
 ep3_frankokratia_events.0120.b.flavor: "Kéž mě to zahalí do dávné slávy!"
 ep3_frankokratia_events.0120.c: "My Latini jsme přišli. Vše, co je tady — je naše!"
 ep3_frankokratia_events.0120.c.flavor: "Budeme vládnout, uctívat a drancovat, jak se nám zlíbí!"
 emulating_byz_punishment_tt: "[GetTitleByKey('e_latin_empire').Custom('CZ_Adjective_sti')|U] císaři a jejich [Concept('vassals','vazalové')|E] mohou [Concept('prisoners','vězně')|E] kastrovat nebo oslepovat"
 latin_emp_enables_byz_punishment_t: "[latin_emp.GetTitleAsNameNoTooltip] schvaluje řecké mučení"
 latin_emp_enables_byz_punishment_desc: "Abychom zvládli zákeřné Řeky, musíme být ještě krutější než oni."
 ep3_frankokratia_events.0121.opening: "[ROOT.Char.GetTitledFirstNameRegnal], můj nový vazale,"
 ep3_frankokratia_events.0121.intro: "My, kdysi ozbrojení poutníci, shledáváme se ve svých nových lénech značně početně překonáni.\n\n"
 ep3_frankokratia_events.0121.desc_torture: "Ale mají tito zákeřní Řekové odvahu srovnatelnou s naší? Mají vůli, která by nám zabránila nárokovat všechna naše [latin_emp.GetPrimaryTitle.GetTierAsName]?\n\nMusíme je zlomit. Musíme být tak krutí jako oni."
 ep3_frankokratia_events.0121.desc: "Ale zde — takové obrovské bohatství k ukořistění! Nezeslábněte, jednejte! Učiňte vše, co je třeba, abyste v této zemi prospěli. Nedopusťte, aby vám v cestě stál kňourající řecký byrokrat ani bohatý sodomit!"
 ep3_frankokratia_events.0121.a: "[Select_CString(ROOT.Char.IsFemale,'Přišla','Přišel')] jsem pro odměnu! Nebudu se snadno vzdát!"
 ep3_frankokratia_events.0121.a.flavor: "Moji [ROOT.Char.GetLiege.Custom('KnightCulturePluralNoTooltip')|l] se vrhnou na celé [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_A')]!"
 ep3_frankokratia_events.0130.t: "Obrození [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip]"
 ep3_frankokratia_events.0130.desc: "Starobylé království! Polární hvězda, která vede všechny křesťanské duše! Pozlacená hromada stojící vysoko v samotném středu světa. Někdy jedno, jindy druhé, často hnízdo škodlivých zmijí: ať už bylo cokoli, a nyní opět je — [GetTitleByKey('e_byzantium').GetName] se vrátila.\n\nPro rozbitý [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip] lid to byla temná, pokořující doba. Avšak, jak popel latinské nadvlády chladne, nyní povstává světlo a naděje. Brzy, možná, se všichni shromáždí pod vládou [byz_emperor.GetTitledFirstNameRegnal]!\n\n"
 ep3_frankokratia_events.0130.latin_emp: "A přesto... pretendent, [latin_emperor.GetPrimaryTitle.GetAdjective] [latin_emperor.GetTitleAsName], stále odporuje. [CZPrepZ(latin_emperor.GetCapitalLocation.GetNameNoTooltip)|U] [CZProvName(latin_emperor.GetCapitalLocation,'G')] [Select_CString(latin_emperor.IsFemale,'její','jeho')] dvůr chrlí nadávky na tuto historickou korunovaci..."
 ep3_frankokratia_events.0130.unopposed: "Latinské rivaly a jejich ambice byly odhozeny do odpadu dějin. Tak začíná nové [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip] věk."
 ep3_frankokratia_events.0130.a: "Rozloučení s #EMP Frankokratia#!."
 msg_greek_anarchy_cb_loss.t: "Konec řecké anarchie"
 msg_greek_anarchy_cb_loss.desc: "Násilná nejistota, která začala pádem [GetTitleByKey('e_byzantium').Custom('CZ_LandedName_G')], ztrácí na významu."
 lose_greek_anarchy_cb_tt: "#high Obsazení císařského vévodství#! [Concept('casus_belli','casus belli')|E] už není k dispozici"
