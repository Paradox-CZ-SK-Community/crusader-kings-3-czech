 ep3_frankokratia_events.0060.t_latin_empire: "Frankokratia"
 ep3_frankokratia_events.0060.t: "Orel stále létá"
 ep3_frankokratia_events.0060.desc_latin_empire: "[GetTitleByKey('e_byzantium').GetName|U] již neexistuje. Jeho všemocný panovník, jenž kdysi nárokoval dědictví Říma, byl sesazen. Nádherné paláce a katedrály doutnají. Těla hnijí ve velkých hromadách. Na rozbitou říši padá chaos.\n\nMezi tímto popelem je vyhlášen [latin_emperor.GetPrimaryTitle.GetNameNoTier] — ve jménu Krista a [pope.Custom('CZ_TitledFirstName_G')].\n\nV zemích Řeků začíná nebezpečné, roztržité období."
 ep3_frankokratia_events.0060.desc_paid: "Nový panovník usedl u nepřekonatelných luxusů [claimant.GetCapitalLocation.GetTitle.GetNameNoTier], dosazen latinou a — prozatím — s odporem poslušný [claimant.GetHerHis] poddaným: [claimant.GetName].\n\nNacpán veškerým bohatstvím, které nový [claimant.GetTitleAsNameNoTooltip] mohl shromáždit, a v čele s [claimant.GetPrimaryTitle.GetAdjective] vojsky, křižáci konečně obrací pozornost jinam."
 ep3_frankokratia_events.0060.desc_leave_unpaid: "Nový panovník usedl u nepřekonatelných vymožeností [claimant.GetCapitalLocation.GetTitle.GetNameNoTier], dosazen latinou a — prozatím — s odporem poslušný [claimant.GetHerHis] poddaným: [claimant.GetName].\n\nS přesvědčením hodným [Select_CString(claimant.IsFemale,'jejích','jeho')] předků tento nový [claimant.GetTitleAsNameNoTooltip] #EMP odmítl#! požadavky křižáků. Honiči, kteří pro [claimant.GetHerHim] bojovali a vrčeli, byli posláni pryč hladoví.\n\nNový panovník vládne, ano... ale přesto je třeba se ptát, proč se putující křižáci vydali touto cestou, hledajíce spásu...?"
 ep3_frankokratia_events.0060.desc_loss: "#EMP „Chvála [defender.Custom('CZ_TitledFirstName_D')], přinášející vítězství! [defender.GetTitleAsNameNoTooltip]! [defender.GetTitleAsNameNoTooltip]!“#!\n\nTento refrén zní přes [defender.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_A')] — [Select_CString(defender.IsFemale,'jejich panovnice odrazila','jejich panovník odrazil')] latinské křižáky zpět do moře. Pro [claimant.GetNamePossessive] nárok na mocnou Byzanc se Boží přízeň ukázala poněkud omezenou.\n\nHluboké ponížení pro dobrodruhy, kteří se odvážili domýšlet si vůli Všemohoucího..."
 ep3_frankokratia_events.0060.a: "Skvělé shledání východních a západních křesťanů."
