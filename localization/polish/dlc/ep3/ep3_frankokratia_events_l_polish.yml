l_polish:
 ep3_frankokratia_events.0001.t: "Nespravedlivé vyvlastnění"
 ep3_frankokratia_events.0001.crusader_intro: "My, ozbrojení poutníci do zámoří, jsme pověřili [financier.GetPrimaryTitle.GetNameNoTier] stavbou našich lodí... velmi nákladné podnikání, věnované nejistému podniku."
 ep3_frankokratia_events.0001.non_crusader_intro: "Doputovaly zprávy o Křížové výpravě. Ti, kdo se zavázali, najali [financier.GetPrimaryTitle.GetNameNoTier] k výstavbě svých lodí... velmi nákladné podnikání, věnované nejistému podniku."
 ep3_frankokratia_events.0001.desc: "\n\n„Jaká hrozná ztráta!“ oplakává [byz_claimant.GetFirstName], [Select_CString(SCOPE.sC('byz_claimant').IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('byz_claimant'))]. „Nejodvážnější latinské rytíře, zchudlé — nucené trpět před pohany! Jak by nám [Glossary( 'Romaioi', 'ROMAIOS_GLOSS' )] mohli pomoci...“\n\nJako [byz_emperor.GetPrimaryTitle.GetAdjective] nápadník, [byz_claimant.GetFirstNameNoTooltip] ostře mluví o #EMP Romaioi#!. Možná... kdyby naši křižáci pochodovali ve [Select_CString(byz_claimant.IsFemale,'jejímu','jeho')] jménu, jejich věc by mohla být posílena řeckými vojáky a štědrými císařskými dary? Mohla by taková neortodoxní křížová výprava lépe sloužit misi Krista... a Jeho křesťanským bojovníkům?"
 ep3_frankokratia_events.0001.a: "Chytré počínání! Které papež jistě požehná."
 ep3_frankokratia_events.0001.a.flavor: "Tito spolukřesťané vzdorují autoritě Svatého otce! Bylo by tak špatné použít naše poutníky proti nim...?"
 ep3_frankokratia_events.0001.b: "Přiměji křižáky, aby osobně přísahali za tuto věc."
 ep3_frankokratia_events.0001.b.flavor: "Vůdci Božích armád si mohou udělat rozhodnutí sami. Vždyť oni, ne papež, budou první, kdo vstoupí na byzantskou půdu."
 ep3_frankokratia_events.0001.c: "Katastrofálně hloupý nápad."
 ep3_frankokratia_events.0001.c.flavor: "Těžko si lze představit větší bezbožné zrádectví!"
 abandon_crusade_tooltip: "@alert_icon! #alert_trial Když [Concept('great_holy_war','velká svatá válka')|E] začne, vy a další ochotní Útočníci budete z ní odstraněni#!"
 byz_claimant_crusade_tooltip: "@warning_icon! #X Vy budete vést #high $CRUSADING_CLAIM_CB_NAME$#! proti [byz_emperor.Custom('CZ_ShortUIName_D')], jménem [byz_claimant.GetShortUIName]#!"
 may_form_latin_empire_tooltip: "Možná budete moci vytvořit #high [GetTitleByKey('e_latin_empire').GetName|U]#!"
 crusaders_may_be_paid_tooltip: "Můžete být odměněni @gold_icon![Concept('gold','zlato')|E], @piety_icon![Concept('piety','zbožnost')|E] a [Concept('special_troops','vojsko z událostí')|E]"
 more_crusaders_will_join_tooltip: "#P Více útočníků [Concept('great_holy_war','velké svaté války')|E] se místo toho připojí k vaší [Concept('war','válce')|E]#!"
 fewer_crusaders_will_join_tooltip: "@warning_icon! #X Méně útočníků [Concept('great_holy_war','velké svaté války')|E] se místo toho připojí k vaší [Concept('war','válce')|E]#!"
 ep3_frankokratia_events.0001.a.crit_success: "[ghw_sponsor.GetTitledFirstNameNoTooltip] žehná vašemu chytrému plánu"
 ep3_frankokratia_events.0001.a.success: "[ghw_sponsor.GetTitledFirstNameNoTooltip] přijímá, aby [Select_CString(ghw_sponsor.IsFemale,'napravila','napravil')] rozkol"
 ep3_frankokratia_events.0001.a.failure: "[ghw_sponsor.GetTitledFirstNameNoTooltip] odsuzuje váš nebezpečný plán"
 set_byz_state_faith_to_catholic_tooltip: "[byz_claimant.GetShortUIName] změní státní [Concept('faith','víru')|E] [byz_emperor.GetPrimaryTitle.Custom('CZ_LandedName_G')] na [byz_claimant_champion.GetFaith.GetName]"
 eager_for_empire_modifier: "Dychtící po císařství"
 eager_for_empire_modifier_desc: "Tento uchazeč je posílen sny o byzantské císařské velkoleposti; posílen přesvědčením a úzce chráněn svými dobrodinci."
 prepared_for_daring_deeds_modifier: "Připraven na odvážné výpravy"
 prepared_for_daring_deeds_modifier_desc: "Tato postava vede velké a rizikové podnikání: slibuje bohatou odměnu, ale uspěje jen s pečlivým plánováním."
 ep3_frankokratia_events.0002.opening: "Nejodvážnější [ROOT.Char.Custom('GetDaughterSon')] Kristův,"
 ep3_frankokratia_events.0002.desc_condemns: "Opravdu bys — z ochrany Petrova potomka — [Select_CString(ROOT.Char.IsFemale,'vytrhla','vytrhl')] meč Gabriela? Opravdu bys, [Select_CString(ROOT.Char.IsFemale,'zbavena','zbaven')] rodičovské lásky a křesťanské zbožnosti, [Select_CString(ROOT.Char.IsFemale,'zabořila','zabořil')] to nejsvětější ostří do hrudi svých řeckých bratří?\n\nTo, co zvažuješ, je ohavnost. Žádný křesťan by neměl být raněn rukou poutníků."
 ep3_frankokratia_events.0002.desc_endorses: "S hříšnou pýchou prelátové Řeků pohrdají vyvoleným zástupcem Pána na Zemi. Proto tě v Jeho jménu pověřuji shromáždit Jeho vojsko za tebou, abys [Select_CString(ROOT.Char.IsFemale,'dosáhla','dosáhl')] vítězství a [Select_CString(ROOT.Char.IsFemale,'jmenovala','jmenoval')] nového a spravedlivého panovníka na východě.\n\nJestli Bůh dovolí, svými činy mohou věřící jednoho dne uplatnit nárok na všechna zámořská území."
 ep3_frankokratia_events.0002.desc_wasnt_asked: "Bůh trestá ty, kdo si, jako Lucifer, přivlastňují království a říše Jeho světla — přesto odměňuje vytrvalé. Co začalo mezi Jeho křižáky, nehodlám zrušit.\n\nAle budeš závislý na svatém odpuštění za prolévání křesťanské krve. Postupuj moudře a vznešeně ve službě Kristu, a můžeš ho obdržet; modli se, když stojíš před Řeky."
 ep3_frankokratia_events.0002.a: "Nuže... jdu do Byzance!"
 ep3_frankokratia_events.0002.b: "Kaju se, Svatý otče! #EMP Kaju se za svou pošetilost!#!"
 continue_frankokratia_crusade_tooltip: "Pokračujete v přesměrovávání křižáků směrem [CZPrepK(byz_emperor.GetPrimaryTitle.GetNameNoTierNoTooltip)] [byz_emperor.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_D')]"
 end_frankokratia_crusade_war_tooltip: "@alert_icon! #alert_trial Nebudete útočit na [byz_emperor.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_A')] ani přesměrovávat žádné křižáky#!"
 ep3_frankokratia_events.0003.opening: "Nepříteli [byz_emperor.GetTitleAsNameNoTooltip],"
 ep3_frankokratia_events.0003.desc: "Ti, kdo nesou kříž, mají k dispozici mnoho nově postavených [financier.GetPrimaryTitle.GetAdjective] lodí — ale nemohou spravedlivě nést jejich náklady. [Select_CString(financier.IsFemale,'Přesvědčila','Přesvědčil')] jsem naši radu, aby hledala úhradu jiným způsobem.\n\nZaručte nám odškodnění z císařské pokladnice nebo císařskými zeměmi. Pokud tak učiníte, naše lodě převezou vaše $knight_culture_player_plural_no_tooltip_lowercase$ přes moře. Naši odvážní mariňáci vylezou po hradbách nepřítele. Řekové brzy budou litovat svého pohrdání námi!"
 ep3_frankokratia_events.0003.a: "Náš závazek za váš — ať tak bude."
 will_give_byz_lands_tooltip: "Pokud [byz_emperor.GetShortUIName] nemá dostatek @gold_icon![Concept('gold','zlata')|E], [financier.GetShortUIName] získá [Concept('title','titul')|E] od [byz_emperor.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')]"
 financier_will_join_claim_war_tooltip: "[financier.GetShortUIName] se přidá k vašemu #high $CRUSADING_CLAIM_CB_NAME$#! proti [byz_emperor.Custom('CZ_ShortUIName_D')]"
 every_ally_will_gain_modifier_tooltip: "Vy a ostatní Útočníci v [Concept('war','válce')|E] získáte [GetModifier( 'grand_crusader_fleet_modifier' ).GetNameWithTooltip|L]"
 grand_crusader_fleet_modifier: "Velká křižácká flotila"
 grand_crusader_fleet_modifier_desc: "Velké množství nově postavených transportních lodí a válečných galér přepravuje armády této postavy na daleké pobřeží."
 ep3_frankokratia_events.0004.t: "Pýcha na Západě"
 ep3_frankokratia_events.0004.desc: "Naši špehové mezi Latiny přinášejí podivné zprávy... kdybych [Select_CString(ROOT.Char.IsFemale,'nebyla tak dobře obeznámena','nebyl tak dobře obeznámen')] se všemi ostatními formami [financier.GetPrimaryTitle.GetAdjective] lakomství, [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')] bych, že jsem [Select_CString(ROOT.Char.IsFemale,'obelstěna','obelstěn')]!\n\nZatímco [byz_claimant_champion.GetFaith.GetAdherentNamePlural] opět útočí na pohany, veliká masa jejich ozbrojených poutníků se místo toho zavázala přijet #EMP sem#!. Vedeni [byz_claimant_champion.Custom('CZ_Name_I')] a [financier.Custom('CZ_TitledFirstName_I')] prohlašují [byz_claimant.Custom('CZ_Name_A')], [Select_CString(byz_claimant.IsFemale,'tu ubohou žebračku','toho ubohého žebráka')], za právoplatného vládce [Glossary( 'Romaioi', 'ROMAIOS_GLOSS' )]!\n\nBrzy budou ti fanatikové umírat před mými hradbami za [Select_CString(byz_claimant.IsFemale,'její','jeho')] slabou věc! Jak by mohli uvažovat o takovém útoku na své křesťanské bratry?"
 ep3_frankokratia_events.0004.a: "Předpokládám... [byz_claimant.GetFirstNameNoTooltip] musí zemřít."
 ep3_frankokratia_events.0004.a.flavor: "Možná brutální vražda jim otevře oči? Jistě, zbaví Latiny jakéhokoli důvodu útočit na nás."
 ep3_frankokratia_events.0004.b: "[ROOT.Char.GetFaith.HighGodName] mě [Select_CString(EqualTo_string(ROOT.Char.GetFaith.HighGodHerHis,Localize('CHARACTER_HERHIS_HER')),'ustanovila','ustanovil')]. [ROOT.Char.GetFaith.HighGodName] mě ochrání."
 ep3_frankokratia_events.0004.b.flavor: "Mezitím se biskupové Říma čím dál více opájí vlastními lžemi... vážně svádějí své divoké stádo."
 abandon_crusade_emp_tooltip: "@alert_icon! #alert_trial Když začne [Concept('great_holy_war','velká svatá válka')|E] [CZAdherentPl_G(GetFaithByKey('catholic'))|l], zúčastnění Útočníci z ní budou odstraněni#!"
 franko_emp_crusade_tooltip: "@warning_icon! #X [byz_claimant_champion.GetShortUIName] povede #high $CRUSADING_CLAIM_CB_NAME$#! proti [byz_emperor.Custom('CZ_ShortUIName_D')], jménem [byz_claimant.GetShortUIName]#!"
 byz_empire__destroyed_tooltip: "@warning_icon! #X [GetTitleByKey('e_byzantium').GetName|U] může být dokonce zničeno#!"
 ep3_frankokratia_events.0005.opening: "Mé neposlušné dítě,"
 ep3_frankokratia_events.0005.desc: "Už nemůžeš doufat, že oblékneš nápadníka [claimant.GetName] do císařské purpury.\n\nSni už dál o řeckých požitcích. Přestaň žít v vzdoru a hledej pokání. Příčina, která tě kdysi vyhnala z Boží posvátné mise, skončila zaslouženě neceremoniálním koncem."
 ep3_frankokratia_events.0005.a: "[ROOT.Char.GetFaith.HighGodName] musí milovat tyrana Řeků..."
 frankokratia_story_ends_tooltip: "Útok [GetFaithByKey('catholic').GetAdjective] křižáků na [GetTitleByKey('e_byzantium').Custom('CZ_LandedName_A')|U] [Select_CString(ROOT.Char.IsFemale,'byla','byl')] zrušen"
 ep3_frankokratia_events.0020.t: "Proti zbloudilým"
 ep3_frankokratia_events.0020.desc: "Mezi Kristovými válečníky bují rozkol... neboť pohané jsou mocní, přeplutí Středozemí nás bude stát mnoho a [Select_CString(financier.IsFemale,'lodní stavitelka','lodní stavitel')] [financier.GetName] je [Select_CString(financier.IsFemale,'tvrdá a mazaná věřitelka','tvrdý a mazaný věřitel')].\n\n[redirecter.GetName] přináší zcela jiný návrh: s naší společnou horlivostí proč místo toho neustanovit [Select_CString(byz_claimant.IsFemale,'nápadnici','nápadníka')] [byz_claimant.Custom('CZ_Name_A')] na trůnu [byz_emperor.GetPrimaryTitle.Custom('CZ_LandedName_G')]? Nebylo by bohaté odměny, kterou bychom získali, dobrou oporou pro věřící?"
 ep3_frankokratia_events.0020.pope_condemns: "\n\n[pope.GetTitledFirstName] nesouhlasí, zakazuje toto podnikání a hrozí zatracením. Ochotní zůstávají neodraděni."
 ep3_frankokratia_events.0020.pope_endorses: "\n\nA přestože se [pope.GetSheHe] stále snaží vést Křížovou výpravu, [pope.GetTitledFirstName] [Select_CString(pope.IsFemale,'udělila','udělil')] tomuto podniku požehnání sv. Petra!"
 ep3_frankokratia_events.0020.pope_resents: "\n\n[pope.GetTitledFirstName] tento podnik přímo [Select_CString(pope.IsFemale,'neodsoudila','neodsoudil')], ale [Select_CString(pope.IsFemale,'její','jeho')] prelátové neschvalují takové rozštěpení Křížové výpravy..."
 ep3_frankokratia_events.0020.a: "Přidám se pouze jako #EMP vůdce#! tohoto odvážného podniku."
 ep3_frankokratia_events.0020.b: "Považuj mě za jednoho z ochotných!"
 ep3_frankokratia_events.0020.c: "Ten plán... nedává smysl."
 ep3_frankokratia_events.0020.c.flavor: "Je to naprosté rouhání! #EMP A oslabuje to naši svatou Křížovou výpravu!#!"
 join_byz_claimant_crusade_tooltip: "@warning_icon! #X Připojíte se k #high $CRUSADING_CLAIM_CB_NAME$#! proti [byz_emperor.Custom('CZ_ShortUIName_D')], jménem [byz_claimant.GetShortUIName]#!"
 may_gain_land_latin_empire_tooltip: "[Concept('titles','Tituly')|E] v #high [GetTitleByKey('e_latin_empire').GetName|U]#! mohou být rozděleny"
 ep3_frankokratia_events.0030.t: "Dědicové Konstantina"
 ep3_frankokratia_events.0030.desc: "[ghw_sponsor.GetTitledFirstName] volá, ale my neodpovíme. Ještě ne. Místo toho, pod vedením [byz_claimant_champion.GetTitledFirstNamePossessive], pochodujeme na [byz_emperor.GetPrimaryTitle.Custom('CZ_LandedName_A')].\n\nKde naši poutníci nastupují na [financier.GetPrimaryTitle.GetAdjective] lodě, nesčetné heraldické štíty visí na přídi i zádi, potažené kůží, aby odolaly moři. Mocní váleční koně jsou vedeni pod palubu. Jako v květu se velké plachty rozprostírají, aby zachytily slunce! Jinde kolony křižáků vycházejí pěšky za křížem, starodávné cesty je vedou na východ.\n\nPomstěme [Glossary( 'Trojans', 'TROJANS_FRANKOKRATIA_GLOSS')]! Ať se Řekové chvějí ve svých palácích! Ať se pokloní [byz_claimant.GetFullName], svému právoplatnému pánovi, a my, křižáci, jako jejich vysvoboditelé!"
 TROJANS_FRANKOKRATIA_GLOSS: "Prostřednictvím legendy o Aeneově útěku z Tróje si středověcí Latini přisuzovali původ od tohoto bájného města; pomsta za tyto údajnés předky byla uváděna jako motivace pro útok na řeckou Byzanc."
 ep3_frankokratia_events.0030.a: "#EMP Sláva Bohu na výsostech!#!"
 frankokratia_war_begins_tooltip: "[byz_claimant_champion.GetShortUIName|U] [Select_CString(byz_claimant_champion.IsFemale,'vyhlásila','vyhlásil')] #high [frankokratia_war.GetName]#!"
 frankokratia_war_join_tooltip: "[Select_CString(ROOT.Char.IsFemale,'Přidala','Přidal')] jste se jako Útočník"
 abandoned_crusade_general_tooltip: "@alert_icon! #alert_trial [byz_claimant_champion.GetShortUIName] a další Útočníci opustili [Concept('great_holy_war','velkou svatou válku')|E] [CZAdherentPl_G(GetFaithByKey('catholic'))|l]#!"
 ep3_frankokratia_events.0031.t: "Rozštěpená křížová výprava"
 ep3_frankokratia_events.0031.desc_byz: "Vzdor veškeré společné lásce ke Kristu — a pohrdajíc věcí [pope.GetTitledFirstName], jejich milovaného biskupa Říma — frakce latinských křižáků nyní ohrožuje naši Říši!\n\nAť nás nyní ochrání síla [Glossary( 'Herakleios', 'HERAKLEIOS_GLOSS' )]; ať useknuté hlavy [byz_claimant_champion.GetTitledFirstName], [financier.GetTitledFirstName] a pretendent [byz_claimant.GetName] brzy spočinou u [Glossary( 'Throne of Solomon', 'THRONE_OF_SOLOMON_GLOSS' )]!\n\n[ROOT.Char.GetFaith.WarGodName], chraň nás dobře před touto latinskou chamtivostí... tímto šílenstvím, které ohrožuje naši samotnou existenci."
 HERAKLEIOS_GLOSS: "Císař Herakleios ze 7. století #bold Herakleios#! čelil vojenským krizím po většinu své vlády, bojoval proti sásánovským Peršanům i Rášidúnskému chalífátu. Provedl zásadní reformy, které umožnily byzantské říši přežít."
 THRONE_OF_SOLOMON_GLOSS: "Domnělý trůn krále Šalomouna, nejmoudřejšího krále starověkého Izraele, je jedním ze šalomounských předmětů uchovávaných na císařském dvoře Byzance."
 ep3_frankokratia_events.0031.desc_catholic: "#EMP Katolická křížová výprava je zrazená!#!\n\nNevěrní, zmatení poutníci se sdružili za pretendentem [byz_claimant.GetName] a, tragédie za tragédií — plánují napadnout [byz_emperor.GetPrimaryTitle.GetNameNoTier], říši křesťanů! Odmítají pochod na [target_kingdom.Custom('CZ_LandedNameNoTier_A')]!\n\nApologeti pro pyšného [byz_claimant_champion.GetTitledFirstName], chamtivého [financier.GetTitledFirstName] a všechny ostatní tvrdí, že chtějí znovu sjednotit církev, zapůjčit řeckou sílu věci...\n\nAle jen Bůh ví, co z toho vzejde."
 ep3_frankokratia_events.0031.desc_target: "Bez světla [ROOT.Char.GetFaith.HighGodName], které by je vedlo, [pope.GetFaith.GetAdherentNamePlural] tápají ve tmě!\n\nVelký oddíl našich fanatických nepřátel se, místo aby pochodoval proti [defender.Custom('CZ_Name_D')], složil přísahu dobýt [byz_emperor.GetPrimaryTitle.GetName]! Jejich neshoda je matoucím ulehčením těm, kdo brání [target_kingdom.GetNameNoTier].\n\nJejich ďábelské malé mysli se zdají věřit, že budeme pokřtěni mečem, až [byz_claimant.GetName] usedne na císařský trůn... ale síly [pope.GetTitledFirstNamePossessive] budou do té doby jistě odraženy."
 ep3_frankokratia_events.0031.a: "To se... opravdu děje?"
 ep3_frankokratia_events.0041.t: "Veškeré bohatství říše"
 ep3_frankokratia_events.0041.intro_constantinople: "Za bouřlivého jásotu náš chráněnec [claimant.GetFirstName] vstupuje do mohutných bran [claimant.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_G')]. Pod velkými kopulemi a nebeskými [Glossary( 'seraphim', 'SERAPHIM_GLOSS')] Hagie Sophii je [claimant.GetSheHe] konečně uveden do úřadu jako [claimant.GetTitleAsNameNoTooltip]. Jak jasná je naše radost, jak naprosté naše úžas!\n\nKdyž jsem však chladně uveden do [Glossary( 'Blachernae Palace', 'BLACHERNAE_PALACE_GLOSS')]"
 ep3_frankokratia_events.0041.intro_generic: "Za bouřlivého jásotu náš chráněnec [claimant.GetFirstName] vstupuje do mohutných bran [claimant.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_G')]. Pod velkými kopulemi a nebeskými [Glossary( 'seraphim', 'SERAPHIM_GLOSS')] císařského chrámu je [claimant.GetSheHe] konečně uveden do úřadu jako [claimant.GetTitleAsNameNoTooltip]. Jak jasná je naše radost, jak naprosté naše úžas!\n\nKdyž jsem však chladně uveden do císařského paláce"
 ep3_frankokratia_events.0041.desc: "a podroben nekonečným ceremoniiám, přepadne mě poněkud jiný pocit...\n\n„Můj předchůdce,“ vysvětluje [claimant.GetTitledFirstNameNoTooltip], „si odnesl velkou část pokladnice, když [defender.GetSheHe] uprchl. ‚"
 ep3_frankokratia_events.0041.trying_to_pay: "Ač se snažíme, Říše může nabídnout vám křižákům pouze #EMP částečnou#! odměnu.„"
 ep3_frankokratia_events.0041.not_trying_to_pay: "Vy křižáci nemůžete dostat, co bylo slíbeno, nýbrž... můžeme vám zaplatit #EMP mnohem#! méně.„"
 SERAPHIM_GLOSS: "Řád nebeských bytostí přítomný v abrahámovských vírách; v křesťanství jsou #bold serafimové#! šestičetní a patří k nejvyššímu řádu andělů."
 BLACHERNAE_PALACE_GLOSS: "Postavený u Theodosianových zdí kolem roku 500 n. l., tento terasovitý palácový komplex [Select_CString(ROOT.Char.IsFemale,'byla','byl')] ve vrcholném středověku stále častěji používán jako hlavní císařské sídlo."
 ep3_frankokratia_events.0041.a: "Pak musíme #EMP vzít#! to, co nám dluží."
 ep3_frankokratia_events.0041.a.flavor: "Plundrování takového císařského města... bude nepřekonatelné."
 ep3_frankokratia_events.0041.b: "Rozpuštění našich rytířů bez zaplacení nebude snadné..."
 ep3_frankokratia_events.0041.b.flavor: "...ale při správné #EMP motivaci#! se pokusím ostatní poslat pryč bez krveprolití."
 ep3_frankokratia_events.0041.b_success: "Přesvědčíte Latiny, aby odešli"
 ep3_frankokratia_events.0041.b_failure: "Křižáci vyrabují [claimant.GetCapitalLocation.GetTitle.GetNameNoTier]"
 ep3_frankokratia.0041_effects_from_a_tooltip: "@warning_icon! #X Efekty první volby nastanou"
 ep3_frankokratia_events.0041.c: "Očekávali jsme více. Ale můžeme to přijmout."
 ep3_frankokratia_events.0041.c.flavor: "Křesťanství bylo tímto podnikem přece jen posíleno. Poněkud."
 byzantine_empire_destroyed_tooltip: "@warning_icon! #X [claimant.GetPrimaryTitle.GetNameNoTier] bude zničeno#!"
 byz_capital_building_destroyed_tooltip: "@warning_icon! #X #high 3#! [Concept('buildings','budovy')|E] budou degradovány nebo zničeny#!"
 frankokratia_leaders_gain_despoiler_trait: "Všichni zúčastnění křižáci a [GetTitleByKey('e_latin_empire').GetAdjective] [vládci|E] získají #high [GetTrait('despoiler_of_byzantium').GetName( GetNullCharacter )]#!"
 bent_before_crusaders_modifier: "Skloněn před křižáky"
 bent_before_crusaders_modifier_desc: "Místo toho, aby nesplnil nemožné sliby, tato postava uhradila dluhy vyrabováním vlastního panství."
 crippled_by_imperial_debt_modifier: "Ochromen císařskými opatřeními"
 crippled_by_imperial_debt_modifier_desc: "Místní vojska byla poslána pryč a státní správa vyprázdněna. Tržiště ztichla."
 greek_opinion: "Řecké [Concept('opinion','mínění')|E]"
 ep3_frankokratia_events.0042.t: "Křtěni ohněm"
 ep3_frankokratia_events.0042.desc: "Útočíme na [claimant.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_A')]! [financier.GetPrimaryTitle.GetAdjective] mariňáci jsou první, kdo vztyčí své svaté prapory na hradbách, zatímco naši $knight_culture_player_plural_no_tooltip_lowercase$ vtrhnou branami města a pobijí každého obránce. Řekové zapálí své vlastní domovy — ale ani tato velká zeď ohně nemůže zadržet Boží hněv!\n\nPo tři dny je město vypleněno a jeho obyvatelé jsou pobiti."
 ep3_frankokratia_events.0042.constantinople: "Zbožní volají po zdrženlivosti, přesto Hagia Sophia a posvátné starobylé svatyně jsou vandalizovány a vypleněny."
 ep3_frankokratia_events.0042.desc_outro: "\n\nNaši vůdci nyní nikomu z Řeků nedůvěřují, aby toto místo spravedlivě spravoval a podporoval Kristovu věc: musíme jmenovat vlastního císaře. Můj hlas, moje volba, promění křesťanstvo."
 ep3_frankokratia_events.0042.a: "Budu vládnout Latinům i Řekům!"
 ep3_frankokratia_events.0042.b: "[player_1.GetTitledFirstNameNoTooltip] je mezi křižáky respektován."
 ep3_frankokratia_events.0042.c: "Ať si tu čest nárokuje [player_2.GetTitledFirstNameNoTooltip]."
 ep3_frankokratia_events.0042.d: "Tolik dlužíme [financier.GetTitledFirstNameNoTooltip]."
 ep3_frankokratia_events.0042.e: "[Select_CString(SCOPE.sC('emp_beneficiary_3').IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('emp_beneficiary_3'))] [emp_beneficiary_3.GetNameNoTooltip] má císařskou milost!"
 ep3_frankokratia_events.0042.f: "[emp_beneficiary_2.GetNameNoTooltip]. Vládni moudře, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('emp_beneficiary_2'))]."
 ep3_frankokratia_events.0042.g: "[Select_CString(SCOPE.sC('emp_beneficiary').IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('emp_beneficiary'))] [emp_beneficiary.GetNameNoTooltip] si zaslouží trůn."
 old_titles_vassals_emp_beneficiary_tooltip: "@warning_icon! #X [emp_beneficiary.Custom('CZ_ShortUIName_D')] připadnou všechny vaše [Concept('titles','tituly')|E] a [Concept('vassals','vazalové')|E] mimo království [GetTitleByKey('e_latin_empire').GetNamePossessive]#!"
 old_titles_vassals_emp_beneficiary_2_kings_tooltip: "@warning_icon! #X [emp_beneficiary.Custom('CZ_ShortUIName_D')] připadnou všechny vaše [Concept('titles','tituly')|E] a [Concept('vassals','vazalové')|E] mimo [latin_kingdom_1.Custom('CZ_LandedNameNoTier_A')] a [latin_kingdom_2.Custom('CZ_LandedNameNoTier_A')]#!"
 old_titles_vassals_emp_beneficiary_1_king_tooltip: "@warning_icon! #X [emp_beneficiary.Custom('CZ_ShortUIName_D')] připadnou všechny vaše [Concept('titles','tituly')|E] a [Concept('vassals','vazalové')|E] mimo [latin_kingdom_1.Custom('CZ_LandedNameNoTier_A')]#!"
 old_titles_vassals_emp_beneficiary_no_king_tooltip: "@warning_icon! #X [emp_beneficiary.Custom('CZ_ShortUIName_D')] připadnou všechny vaše současné [Concept('titles','tituly')|E] a [Concept('vassals','vazalové')|E]#!"
 old_titles_vassals_lord_beneficiary_tooltip: "@warning_icon! #X [beneficiary.Custom('CZ_ShortUIName_D')] připadnou všechny vaše [Concept('titles','tituly')|E] a [Concept('vassals','vazalové')|E] mimo [latin_emperor.GetShortUINamePossessive] [Concept('de_jure','de iure')|E] [Concept('realm','panství')|E]#!"
 ep3_frankokratia_events.0044.t: "Purpura je naše"
 ep3_frankokratia_events.0044.desc: "Po našich válečných činech ve jménu [claimant.GetHerHis] [claimant.GetName] nyní odmítá to, co nám dluží, #EMP a Pánu!#! My křižáci to nemůžeme snést!\n\nV spravedlivém hněvu vtrhneme do [latin_byz_capital_barony.Custom('CZ_LandedNameNoTier_G')]. Zaletíme její ulice řeckou krví, zatímco jsou rabovány kostely a paláce. Jakou jinou možnost máme než tuto zkázu?\n\nDvojí tvář Řekové zde už nebudou vládnout, možná už nikdy."
 ep3_frankokratia_events.0044.desc_past_tense: "Po našich válečných činech ve jménu [Select_CString(claimant.IsFemale,'její','jeho')] jak zuřili křižáci, když [claimant.GetName] odmítl to, co nám dluží, #EMP a Pánu!#!\n\n[latin_byz_capital_barony.GetNameNoTier] bylo nutné vtrhnout. Její ulice bylo třeba zaplavit řeckou krví; její kostely a paláce bylo třeba vyrabovat. Jakou jinou možnost jsme měli než tuto zkázu?\n\nDvojí tvář Řeků tu už nevládne, možná už nikdy."
 ep3_frankokratia_events.0044.outro_emperor: "Latinský ponese posvátnou korunu a čest pojmenovat tohoto císaře připadá mně."
 ep3_frankokratia_events.0044.outro_lord: "[latin_emperor.GetName] [Select_CString(latin_emperor.IsFemale,'byla','byl')] korunován pánem Latinů i Řeků a my ostatní poutníci musíme mezi sebe rozdělit [Select_CString(latin_emperor.IsFemale,'její','jeho')] země."
 ep3_frankokratia_events.0044.a: "Zůstanu zde a vychutnám si řecké požitky!"
 ep3_frankokratia_events.0044.b: "[beneficiary_3.GetFirstNameNoTooltip], [Select_CString(SCOPE.sC('beneficiary_3').IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('beneficiary_3'))]: chraň toto království."
 ep3_frankokratia_events.0044.c: "[Select_CString(SCOPE.sC('beneficiary_2').IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('beneficiary_2'))] [beneficiary_2.GetFirstNameNoTooltip] je uchvácen těmito zeměmi."
 ep3_frankokratia_events.0044.d: "[beneficiary.GetFirstNameNoTooltip]. Vládni těmto cizincům dobře, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('beneficiary'))]."
 ep3_frankokratia_events.0045.t: "Neviděné slávy"
 ep3_frankokratia_events.0045.intro: "S dosaženým vítězstvím a dojednanými podmínkami odchodu my křižáci tiše hledíme na [claimant.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_A')],"
 ep3_frankokratia_events.0045.intro_constantinople: "perečku Bospora. Pod památkami dávných věků, mezi nejsvětějšími relikviemi, leží špinavé ulice a fóra, která zapáchají dobytkem."
 ep3_frankokratia_events.0045.intro_generic: "ubohou náhražku královny měst. Stín starého hlavního města, [GetTitleByKey('b_constantinople').GetNameNoTier], s jeho posvěcenými katedrálami a bohatými paláci."
 ep3_frankokratia_events.0045.desc: "\n\nMožná by nám staří Římané bohatě darovali. Jistě znali sílu udeřit na pohany. Tito Řekové jsou méně působiví. [claimant.GetName] posílá své vyslance pryč"
 ep3_frankokratia_events.0045.unpaid: "s prázdnýma rukama a bez pomoci.\n\nAč si stěžujeme, ač pohrdavě hledíme na poklady a cetky, naše podivná pouť končí."
 ep3_frankokratia_events.0045.paid_off: "Polovičně proplaceno; malé oddíly byly sraženy z [Select_CString(claimant.IsFemale,'jejích','jeho')] hradeb.\n\nTímto [Select_CString(claimant.IsFemale,'naše podivná poutnice poněkud odměnila','náš podivný poutník poněkud odměnil')] nás věřící. Aspoň více než zarmoucení a rozvrácení Řekové..."
 ep3_frankokratia_events.0045.a: "Není ještě pozdě podpořit křížovou výpravu!"
 ep3_frankokratia_events.0045.b: "Známá místa lákají."
 ep3_frankokratia_crusader_joining: "Křižácké přísliby nárokovateli"
 frankokratia_crusader_joining_tooltip: "[joiner.GetName] přesměruje své ozbrojené poutníky do Byzance, až bude čas správný.\n\n#high [num_frankokratia_leaders]#! [Concept('rulers','vládci')|E] se připojují k vašemu tažení."
