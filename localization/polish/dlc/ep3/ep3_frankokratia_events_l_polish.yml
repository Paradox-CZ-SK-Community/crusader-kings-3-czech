 ep3_frankokratia_events.0070.t: "Meč v zlaté pochvě"
 ep3_frankokratia_events.0070.intro: "[financier.GetName] se [Select_CString(financier.IsFemale,'zdržela','zdržel')] [CZPrepV(ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip)] [ROOT.Char.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_L')] a [Select_CString(financier.IsFemale,'starala','staral')] se o obnovené obchody mnoha místních kupců z [financier.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')]. Teď, s vlajkovou lodí naloženou kořistí, se loučí.\n\n"
 ep3_frankokratia_events.0070.rando_emp: "„Jaké dobrodružství!“ [financier.GetFirstNameNoTooltip|U] vykřikuje. „Kdo by si troufl tvrdit, že má odvahu srovnat se s námi, kteří jsme vzali toto velké impérium?“"
 ep3_frankokratia_events.0070.leader_emp: "„Shromáždili jsme tolik lidí pod křížem,“ [financier.GetFirstNameNoTooltip] vykřikuje. „A hleď, co ti to dalo! Velké impérium!“"
 ep3_frankokratia_events.0070.desc: "Ale... #EMP ponechání#! jí — postačí síla jednoho meče? Neměli bychom my Latini, svázáni svou horlivostí, spřátelit se s těmito novými řeckými zeměmi...?\n\n„[Select_CString(financier.IsFemale,'Žádala','Žádal')] bych jen, aby... moji [financier.GetPrimaryTitle.GetAdjectiveNoTooltip] obchodníci, se svými mnoha, #EMP hlubokými#! místními zájmy, měli zaručena zvláštní práva...“"
 negotiate_financier_alliance_effect_tooltip: "#high Vy#! a [financier.GetShortUIName] vstupujete do vzájemné [Concept('alliance','aliance')|E]"
 custom.every_realm_county: "Každé [Concept('county','hrabství')|E] ve vašem [Concept('realm','panství')|E]"
 ep3_frankokratia_events.0070.a: "Jen společně můžeme ovládat ty zatracené Řeky."
 ep3_frankokratia_events.0070.a.flavor: "Meč na řeckých krkách je stále můj, i když [financier.GetPrimaryTitle.GetAdjectiveNoTooltip] mince vládne jejich trhům."
 ep3_frankokratia_events.0070.b: "#EMP Lakomý pse!#! Řekové tě měli za co nenávidět!"
 ep3_frankokratia_events.0070.b.flavor: "Titulu [financier.GetTitleAsNameNoTooltip] lze odebrat, ale [Select_CString(financier.IsFemale,'její','jeho')] touha po zisku z mé nové říše sotva pohasne..."
 egregious_trading_rights_modifier: "Přehnaná práva zahraničního obchodu"
 egregious_trading_rights_modifier_desc: "Jako hladoví paraziti obchodníci zmocnění lichvářskými právy dusí místní trhy ve svůj prospěch."
 greek_spoils_imports_modifier: "Dovezené řecké kořisti"
 greek_spoils_imports_modifier_desc: "Tato země je zaplavena cizími poklady. Obchod těžko kdy prosperoval lépe."
 ep3_harassed_at_sea_modifier: "Obtěžování na moři"
 ep3_harassed_at_sea_modifier_desc: "Zkušení námořníci z nepřátelských říší odmítají sloužit armádám této postavy; navíc vyvolávají rvačky mezi námořníky a poškozují lodě v přístavu."
 custom.every_county_latin_kingdom: "Každé [Concept('county','hrabství')|E] tohoto [Concept('kingdom','království')|E]"
 ep3_frankokratia_events.0080.t: "Království pro Latiny"
 ep3_frankokratia_events.0080_non_greek: "Cézar, Konstantin, řada Řeků s dlouhými, těžkopádnými jmény... a nyní [ROOT.Char.GetFirstName]."
 ep3_frankokratia_events.0080_greek: "Země Řeků, kdysi všemi podrobené [GetTitleByKey('e_byzantium').GetName], zůstávají v pohybu. Kdo ze všech vládců pod [ROOT.Char.GetFaith.PositiveAfterLife] má na ně nárok?"
 ep3_frankokratia_events.0080.desc: "\n\nVláda nad Římany je nejvyšší ze všech pozemských poct a přináší úctu zástupů. Získat ji bylo nad pomyšlení našich latinských křižáků – vrtoch osudu, uskutečněný v ohavné krvi – ale teď je má vláda zcela skutečná. Slavný obraz [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')] je téměř bez poskvrny.\n\nKdysi jsme byli vetřelci. Místní naříkali a prchali před námi. Teď [CZPrepV(kingdom_1.GetNameNoTierNoTooltip)] [kingdom_1.Custom('CZ_LandedNameNoTier_L')] jásají v ulicích."
 ep3_frankokratia_events.0080.a: "Ať celé [kingdom_1.GetNameNoTierNoTooltip] pozná mé právo!"
 ep3_frankokratia_events.0080.b: "Ať se [kingdom_2.GetNameNoTierNoTooltip] ukloní!"
 ep3_frankokratia_events.0080.c: "Ať [kingdom_3.GetNameNoTierNoTooltip] navždy patří [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_D')]!"
 ep3_frankokratia_events.0080.d: "Ať lid [kingdom_4.Custom('CZ_LandedNameNoTierNoTooltip_G')] klečí."
 ep3_frankokratia_events.0080.e: "Ať [kingdom_5.GetNameNoTierNoTooltip] patří nám."
