 greek_anarchy_war_nomad_army_name: "[army_culture.GetNameNoTooltip] Válečná družina"
 greek_anarchy_troops_tt: "K vítěznému tažení se připojuje [Concept('army','armáda')|E] [Concept('special_troops','vojska z událostí')|E]!"
 greek_anarchy_development_loss_cb: "Každé zabrané [Concept('county','hrabství')|E] ztrácí #N [EmptyScope.ScriptValue('greek_anarchy_development_value')]#! [Concept('development_growth','růst rozvoje')|E]"
 ep3_frankokratia_events.0090.t: "Pamatuj, jsi [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip]!"
 ep3_frankokratia_events.0090.desc: "Provincie jako [kingdom_1.GetNameNoTier] prožily pochybnou dobu — a byly připraveny o vlídné panování [GetTitleByKey('e_byzantium').GetAdjective] suveréna — příliš dlouho.\n\nAle nyní — obyvatelé [kingdom_1.GetAdjectiveNoTooltip] se mohou radovat! Neklaní se frankským banditům! [kingdom_1.GetAdjectiveNoTooltip|U] pole, dlouho obdělávaná, neuvadnou pod kopyty válečných koní."
 ep3_frankokratia_events.0090_emp: "Pojďte, [Glossary('hoi polloi', 'HOI_POLLOI_GLOSS' )]: vyzdvihněte hrdě své ikony a radujte se z návratu božího řádu, který ustanovil [ROOT.Char.GetFaith.HighGodName]!\n\nTyto národy jsou znovu sjednoceny pod svým [ROOT.Char.Custom('CZ_TitleAsName_I')]; tak jako bohatství jejich země proudí do paláce, dostane se jim všech poct a nádhery, které kdysi znali jejich předkové."
 ep3_frankokratia_events.0090_non_emp: "A prostí lidé, jako ti z [kingdom_1.GetTierAsNameNoTooltip], mohou svobodně snít... o návratu svého pravého pána.\n\nJe čas, aby latinská nadvláda skončila."
 ep3_frankokratia_events.0090.a: "[CZPrepV(kingdom_1.GetNameNoTierNoTooltip)|U] [kingdom_1.Custom('CZ_LandedNameNoTierNoTooltip_L')] nechť jsou temné časy zapomenuty!"
 ep3_frankokratia_events.0090.b: "Vraťte se k #EMP Autokratorovi#!, [kingdom_2.GetNameNoTierNoTooltip]!"
 ep3_frankokratia_events.0090.c: "[kingdom_3.GetNameNoTierNoTooltip] znají purpuru!"
 ep3_frankokratia_events.0090.d: "Do císařského společenství: vrať se, [kingdom_4.GetNameNoTierNoTooltip]."
 ep3_frankokratia_events.0090.e: "Ať [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip] [kingdom_5.GetNameNoTierNoTooltip] znovu ožije!"
 msg_latin_de_jure_gain.t: "Latini si uplatňují de jure práva"
 msg_latin_de_jure_gain.desc: "[title_gainer.GetName] [Select_CString(title_gainer.IsFemale,'odtrhla','odtrhl')] [swapped_kingdom.Custom('CZ_LandedName_A')] od [GetTitleByKey('e_byzantium').Custom('CZ_LandedName_G')], čímž [Select_CString(title_gainer.IsFemale,'ustanovila','ustanovil')] svou [Concept('de_jure','de iure')|E] svrchovanost"
