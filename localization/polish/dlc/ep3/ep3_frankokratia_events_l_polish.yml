 frankokratia_byz_slaughter_varangian_tooltip: "Uprostřed krveprolití způsobeného zuřícími Latiny bylo #N [slaughtered_byzantines]#! šlechticů zavražděno.\n\nVarjagové vedení [varangian_victim.GetShortUIName] bránili císařskou rodinu až do hořkého konce."
 frankokratia_byz_slaughter_house_head_tooltip: "Uprostřed krveprolití způsobeného zuřícími Latiny bylo #N [slaughtered_byzantines]#! šlechticů zavražděno.\n\nVznešení [house_head_victim.GetWomenMen] jako [house_head_victim.GetShortUIName], stařešinové svých rodin, byli upáleni zaživa ve svých domovech."
 frankokratia_byz_slaughter_child_tooltip: "Uprostřed krveprolití způsobeného zuřícími Latiny bylo #N [slaughtered_byzantines]#! šlechticů zavražděno.\n\nDěti jako [child_victim.GetShortUIName] byly zbity k smrti."
 frankokratia_byz_slaughter_emp_tooltip: "Uprostřed krveprolití způsobeného zuřícími Latiny bylo #N [slaughtered_byzantines]#! šlechticů zavražděno.\n\nMezi mrtvými [Select_CString(ROOT.Char.IsFemale,'byla','byl')] nalezen [defender.GetName], kdysi vládce [GetTitleByKey('e_byzantium').Custom('CZ_LandedNameNoTier_G')]."
