 frankokratia_byz_slaughter_varangian_tooltip: "Uprostřed krveprolití způsobeného zuřícími Latiny bylo #N [slaughtered_byzantines]#! šlechticů zavražděno.\n\nVarjagové vedení [varangian_victim.GetShortUIName] bránili císařskou rodinu až do hořkého konce."
 frankokratia_byz_slaughter_house_head_tooltip: "Uprostřed krveprolití způsobeného zuřícími Latiny bylo #N [slaughtered_byzantines]#! šlechticů zavražděno.\n\nVznešení [house_head_victim.GetWomenMen] jako [house_head_victim.GetShortUIName], stařešinové svých rodin, byli upáleni zaživa ve svých domovech."
 frankokratia_byz_slaughter_child_tooltip: "Uprostřed krveprolití způsobeného zuřícími Latiny bylo #N [slaughtered_byzantines]#! šlechticů zavražděno.\n\nDěti jako [child_victim.GetShortUIName] byly zbity k smrti."
 frankokratia_byz_slaughter_emp_tooltip: "Uprostřed krveprolití způsobeného zuřícími Latiny bylo #N [slaughtered_byzantines]#! šlechticů zavražděno.\n\nMezi mrtvými [Select_CString(ROOT.Char.IsFemale,'byla','byl')] nalezen [defender.GetName], kdysi vládce [GetTitleByKey('e_byzantium').Custom('CZ_LandedNameNoTier_G')]."
 frankokratia_byz_slaughter_victim.t: "Zavražděn Latiny"
 frankokratia_byz_slaughter_victim_tooltip: "Váš [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim'))] [victim.GetShortUIName] [Select_CString(victim.IsFemale,'byla zabita','byl zabit')] během plenění [latin_capital_barony.GetNameNoTierPossessive]."
 ep3_frankokratia_events.0070.t: "Meč v zlaté pochvě"
 ep3_frankokratia_events.0070.intro: "[financier.GetName] [Select_CString(financier.IsFemale,'setrvala','setrval')] [CZPrepV(ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip)] [ROOT.Char.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_L')], opatrujíc obnovené záležitosti mnoha místních [financier.GetPrimaryTitle.GetAdjective] obchodníků. Nyní, [Select_CString(financier.IsFemale,'její','jeho')] vlajková loď naložená kořistí, [financier.GetSheHe] se loučí.\n\n"
 ep3_frankokratia_events.0070.rando_emp: "„Jaké dobrodružství!“ [financier.GetFirstNameNoTooltip] vykřikuje. „Kdo by si troufl tvrdit, že má odvahu srovnat se s námi, kteří jsme vzali toto velké impérium?“"
 ep3_frankokratia_events.0070.leader_emp: "„Shromáždili jsme tolik lidí pod křížem,“ [financier.GetFirstNameNoTooltip] vykřikuje. „A hleď, co ti to dalo! Velké impérium!“"
 ep3_frankokratia_events.0070.desc: "Ale... #EMP ponechání#! jí — postačí síla jednoho meče? Neměli bychom my Latini, svázáni svou horlivostí, spřátelit se s těmito novými řeckými zeměmi...?\n\n„[Select_CString(financier.IsFemale,'Žádala','Žádal')] bych jen, aby... moji [financier.GetPrimaryTitle.GetAdjectiveNoTooltip] obchodníci, se svými mnoha, #EMP hlubokými#! místními zájmy, měli zaručena zvláštní práva...“"
 negotiate_financier_alliance_effect_tooltip: "#high Vy#! a [financier.GetShortUIName] vstupujete do vzájemné [Concept('alliance','aliance')|E]"
 custom.every_realm_county: "Každé [Concept('county','hrabství')|E] ve vašem [Concept('realm','panství')|E]"
 ep3_frankokratia_events.0070.a: "Jen společně můžeme ovládat ty zatracené Řeky."
 ep3_frankokratia_events.0070.a.flavor: "Meč na řeckých krkách je stále můj, i když [financier.GetPrimaryTitle.GetAdjectiveNoTooltip] mince vládne jejich trhům."
 ep3_frankokratia_events.0070.b: "#EMP Lakomý psíče!#! Řekové tě měli za co nenávidět!"
 ep3_frankokratia_events.0070.b.flavor: "Titulu [financier.GetTitleAsNameNoTooltip] lze odebrat, ale [Select_CString(financier.IsFemale,'její','jeho')] touha po zisku z mé nové říše sotva pohasne..."
 egregious_trading_rights_modifier: "Přehnaná práva zahraničního obchodu"
 egregious_trading_rights_modifier_desc: "Jako hladoví paraziti obchodníci zmocnění lichvářskými právy dusí místní trhy ve svůj prospěch."
 greek_spoils_imports_modifier: "Dovezené řecké kořisti"
 greek_spoils_imports_modifier_desc: "Tato země je zaplavena cizími poklady. Obchod těžko kdy prosperoval lépe."
 ep3_harassed_at_sea_modifier: "Obtěžování na moři"
 ep3_harassed_at_sea_modifier_desc: "Zkušení námořníci z nepřátelských říší odmítají sloužit armádám této postavy; navíc vyvolávají rvačky mezi námořníky a poškozují lodě v přístavu."
 custom.every_county_latin_kingdom: "Každé [Concept('county','hrabství')|E] tohoto [Concept('kingdom','království')|E]"
 ep3_frankokratia_events.0080.t: "Království pro Latiny"
 ep3_frankokratia_events.0080_non_greek: "Cézar, Konstantin, řada Řeků s dlouhými, těžkopádnými jmény... a nyní [ROOT.Char.GetFirstName]."
 ep3_frankokratia_events.0080_greek: "Země Řeků, kdysi všemi podrobené [GetTitleByKey('e_byzantium').GetName], zůstávají v pohybu. Kdo ze všech vládců pod [ROOT.Char.GetFaith.PositiveAfterLife] má na ně nárok?"
 ep3_frankokratia_events.0080.desc: "\n\nSvrchovanost Římanů je nejvyšším z pozemských poct. S ní přichází úcta mnohých. Nárok na ni [Select_CString(ROOT.Char.IsFemale,'byla','byl')] mimo sny našich latinských křižáků — trik osudu, dosažený hroznou krví — ale nyní je mé imperium velmi skutečné. [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] slavný obraz je téměř bez poskvrny.\n\nKdysi jsme byli vetřelci. Místní pláčou, prchali před námi. Teď [CZPrepV(kingdom_1.GetNameNoTierNoTooltip)] [kingdom_1.Custom('CZ_LandedNameNoTier_L')] jásají na ulicích."
 ep3_frankokratia_events.0080.a: "Ať celé [kingdom_1.GetNameNoTierNoTooltip] pozná mé právo!"
 ep3_frankokratia_events.0080.b: "Ať se [kingdom_2.GetNameNoTierNoTooltip] ukloní!"
 ep3_frankokratia_events.0080.c: "Ať [kingdom_3.GetNameNoTierNoTooltip] navždy patří [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]!"
 ep3_frankokratia_events.0080.d: "Ať lid [kingdom_4.Custom('CZ_LandedNameNoTierNoTooltip_G')] klečí."
 ep3_frankokratia_events.0080.e: "Ať [kingdom_5.GetNameNoTierNoTooltip] patří nám."
 cultural_acceptance_latins_legitimized: "[GetTitleByKey('e_latin_empire').GetName] ustanovilo právoplatné panství"
 greek_anarchy_war_generic_army_name: "[defender.GetPrimaryTitle.GetAdjectiveNoTooltip] Dezertéři"
 greek_anarchy_war_generic_army_name_2: "Žoldnéřský oddíl"
 greek_anarchy_war_crusaders_army_name: "[army_culture.GetNameNoTooltip] Lupiči"
 greek_anarchy_war_greek_army_name: "[army_culture.GetNameNoTooltip] zbytek tagmat"
 greek_anarchy_war_neighbor_army_name: "[army_culture.GetNameNoTooltip] Paraziti"
 greek_anarchy_war_nomad_army_name: "[army_culture.GetNameNoTooltip] Válečná družina"
 greek_anarchy_troops_tt: "K vítěznému tažení se připojuje [Concept('army','armáda')|E] [Concept('special_troops','vojska z událostí')|E]!"
 greek_anarchy_development_loss_cb: "Každé zabrané [Concept('county','hrabství')|E] ztrácí #N [EmptyScope.ScriptValue('greek_anarchy_development_value')]#! [Concept('development_growth','růst rozvoje')|E]"
 ep3_frankokratia_events.0090.t: "Pamatuj, jsi [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip]!"
 ep3_frankokratia_events.0090.desc: "Provincie jako [kingdom_1.GetNameNoTier] prožily pochybnou dobu — a byly připraveny o vlídné panování [GetTitleByKey('e_byzantium').GetAdjective] suveréna — příliš dlouho.\n\nAle nyní — obyvatelé [kingdom_1.GetAdjectiveNoTooltip] se mohou radovat! Neklaní se frankským banditům! [kingdom_1.GetAdjectiveNoTooltip] pole, dlouho obdělávaná, neuvadnou pod kopyty válečných koní."
 ep3_frankokratia_events.0090_emp: "Pojďte, [Glossary('hoi polloi', 'HOI_POLLOI_GLOSS' )]: postavte své ikony vysoko s hrdostí a radujte se z návratu božského řádu [ROOT.Char.GetFaith.HighGodNamePossessive]!\n\nTyto národy se znovu sjednotily pod [ROOT.Char.Custom('CZ_TitleAsName_I')]; jak bohatství jejich země poteče do paláce, budou jim opět uděleny všechny pocty a nádhera, jaké znali jejich předci."
 ep3_frankokratia_events.0090_non_emp: "A prostí lidé, jako ti z [kingdom_1.GetTierAsNameNoTooltip], mohou svobodně snít... o návratu svého pravého pána.\n\nJe čas, aby latinská nadvláda skončila."
 ep3_frankokratia_events.0090.a: "[CZPrepV(kingdom_1.GetNameNoTierNoTooltip)|U] [kingdom_1.Custom('CZ_LandedNameNoTierNoTooltip_L')] nechť jsou temné časy zapomenuty!"
 ep3_frankokratia_events.0090.b: "Vraťte se k #EMP Autokratorovi#!, [kingdom_2.GetNameNoTierNoTooltip]!"
 ep3_frankokratia_events.0090.c: "[kingdom_3.GetNameNoTierNoTooltip] znají purpuru!"
 ep3_frankokratia_events.0090.d: "Do císařského společenství: vrať se, [kingdom_4.GetNameNoTierNoTooltip]."
 ep3_frankokratia_events.0090.e: "Ať [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip] [kingdom_5.GetNameNoTierNoTooltip] znovu ožije!"
 msg_latin_de_jure_gain.t: "Latini si uplatňují de jure práva"
 msg_latin_de_jure_gain.desc: "[title_gainer.GetName] [Select_CString(title_gainer.IsFemale,'odtrhla','odtrhl')] [swapped_kingdom.GetName] od [GetTitleByKey('e_byzantium').Custom('CZ_LandedName_G')], čímž [Select_CString(title_gainer.IsFemale,'ustanovila','ustanovil')] svou [Concept('de_jure','de iure')|E] svrchovanost"
 msg_byz_de_jure_gain.t: "[GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip] práva získána zpět"
 msg_byz_de_jure_gain.desc: "[title_gainer.GetName] [Select_CString(title_gainer.IsFemale,'získala','získal')] zpět [swapped_kingdom.GetName] z [Concept('de_jure','de iure')|E] držby [GetTitleByKey('e_latin_empire').Custom('CZ_LandedName_G')]"
 swap_latin_for_byz_titles_tt: "Všechny [Concept('de_jure','de iure')|E] [Concept('titles','tituly')|E] [GetTitleByKey('e_latin_empire').Custom('CZ_LandedName_G')] budou vráceny [GetTitleByKey('e_byzantium').Custom('CZ_LandedName_D')]"
 ep3_frankokratia_events.0100.t: "Frankokratia, rozbitá"
 ep3_frankokratia_events.0100.desc: "Pro potomka sv. Petra, pro sv. Marka, pro florin a dukát — bylo [GetTitleByKey('e_byzantium').GetName] zpustošeno.\n\nOd té doby, znovu a znovu, [GetTitleByKey('e_latin_empire').GetAdjective] páni vyjížděli se svými rytíři. Zpočátku všichni odění ve zlatu a plni účelu, ale v poslední době... [Select_CString(latin_emp.IsFemale,'jejich panovnice','jejich panovník')] [latin_emp.GetTitledFirstNameRegnal] [Select_CString(latin_emp.IsFemale,'měla','měl')] marné a chabé naděje. [Select_CString(latin_emp.IsFemale,'Její','Jeho')] věc znala jen pochmurné rezignace.\n\n[GetTitleByKey('e_latin_empire').GetName], odporný výtvor vstoupený do křesťanstva, nikdy neměl být."
 ep3_frankokratia_events.0100.byz_no_emp: "S jeho zničením — jak může kterýkoliv velký [Glossary( 'Romaios', 'ROMAIOS_GLOSS' )] setrvat v klidu? Mocný Basileus, #EMP náš#! Basileus, musí brzy projít [Glossary( 'Golden Gate', 'GOLDEN_GATE_GLOSS' )] v triumfu.\n\nNeboť [GetTitleByKey('e_latin_empire').GetAdjective] říše již není!"
 ep3_frankokratia_events.0100.cath: "Byli naši křižáci oklamáni zrádnou pýchou? Oslňovalo nás světlo řecké majestátnosti #EMP tak, že jsme oslepli?#! Dokonce i sám papež vyvýšil náš latinský stát mezi Řeky..."
 ep3_frankokratia_events.0100.emp: "Skutečným dědicem Konstantina je spíše [byz_emp.GetTitledFirstNameRegnal]... [byz_emp.GetSheHe], který může napravit tuto dobu těžkých škod a znovu vybudovat mocnou oporu Bosporu."
 ep3_frankokratia_events.0100.a_non_catholic: "Přišlo to z [ROOT.Char.GetFaith.NegativeAfterLife]. K [ROOT.Char.GetFaith.NegativeAfterLife] se to vrací."
 ep3_frankokratia_events.0100.a_catholic: "Marně jsme snili o tom, že dáme na Zemi slávu [ROOT.Char.GetFaith.HighGodName]..."
 custom.greek_anarchy_rulers: "Každý [Concept('ruler','vládce')|E] s [GetTitleByKey('e_latin_empire').Custom('CZ_Adjective_yymi')|l] nebo [GetTitleByKey('e_byzantium').Custom('CZ_Adjective_yymi')|l] zeměmi"
 gain_greek_anarchy_cb_tt: "Získává #high Obsazení císařského vévodství#! [Concept('casus_belli','casus belli')|E]"
 greek_anarchy_cb: "Obsazení císařského vévodství"
 greek_anarchy_cb_warning_tt: "#weak Casus Belli použitý k dobytí [GetTitleByKey('e_latin_empire').Custom('CZ_Adjective_yych')|l] nebo [GetTitleByKey('e_byzantium').Custom('CZ_Adjective_yych')|l] [Concept('duchies','vévodství')|E], který po vítězství poskytuje [Concept('army','armádu')|E] [Concept('special_troops','vojska z událostí')|E]#!"
