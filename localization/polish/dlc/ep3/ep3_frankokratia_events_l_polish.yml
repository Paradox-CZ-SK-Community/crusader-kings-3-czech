 ep3_frankokratia_events.0060.t_latin_empire: "Frankokratia"
 ep3_frankokratia_events.0060.t: "Orel stále létá"
 ep3_frankokratia_events.0060.desc_latin_empire: "[GetTitleByKey('e_byzantium').GetName|U] již neexistuje. Jeho všemocný panovník, jenž kdysi nárokoval dědictví Říma, byl sesazen. Nádherné paláce a katedrály doutnají. Těla hnijí ve velkých hromadách. Na rozbitou říši padá chaos.\n\nMezi tímto popelem je vyhlášen [latin_emperor.GetPrimaryTitle.GetNameNoTier] — ve jménu Krista a [pope.Custom('CZ_TitledFirstName_G')].\n\nV zemích Řeků začíná nebezpečné, roztržité období."
 ep3_frankokratia_events.0060.desc_paid: "Uprostřed nenapodobitelného přepychu [claimant.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_G')] sedí nový panovník, dosazený latinskými zbraněmi a – prozatím – s nevolí poslouchaný svými poddanými: [claimant.GetName].\n\nKřižáci, napěchovaní vším bohatstvím, které [Select_CString(claimant.IsFemale,'nová','nový')] [claimant.GetTitleAsNameNoTooltip|l] [Select_CString(claimant.IsFemale,'dokázala','dokázal')] sehnat, a v čele vojsk [claimant.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')], konečně upírají zrak jinam."
 ep3_frankokratia_events.0060.desc_leave_unpaid: "Uprostřed nenapodobitelného přepychu [claimant.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_G')] sedí nový panovník, dosazený latinskými zbraněmi a – prozatím – s nevolí poslouchaný svými poddanými: [claimant.GetName].\n\nS rozhodností hodnou svých předků [Select_CString(claimant.IsFemale,'nová','nový')] [claimant.GetTitleAsNameNoTooltip|l] požadavky křižáků #EMP [Select_CString(claimant.IsFemale,'odmítla','odmítl')]#!. Psi, kteří pro [Select_CString(claimant.IsFemale,'ni','něj')] bojovali a vrčeli, byli posláni pryč hladoví.\n\nVládne nový panovník, ano... ale člověk se přesto musí ptát, proč si bludní křižáci ve snaze o spásu zvolili právě tuto cestu...?"
 ep3_frankokratia_events.0060.desc_loss: "#EMP „Sláva [defender.Custom('CZ_TitledFirstName_D')], [Select_CString(defender.IsFemale,'přinášející','přinášejícímu')] vítězství! [defender.GetTitleAsNameNoTooltip|U]! [defender.GetTitleAsNameNoTooltip|U]!“#!\n\nTento chorál se nese celým [defender.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_I')] – [Select_CString(defender.IsFemale,'jejich panovnice zahnala','jejich panovník zahnal')] latinské křižáky zpět do moře. Zdá se, že k nároku [claimant.Custom('CZ_Name_G')] na mocnou Byzanc byl Bůh poněkud skoupý na přízeň.\n\nVelká ostuda pro dobrodruhy, kteří se opovážili domýšlet si vůli Všemohoucího..."
 ep3_frankokratia_events.0060.a: "Skvělé shledání východních a západních křesťanů."
