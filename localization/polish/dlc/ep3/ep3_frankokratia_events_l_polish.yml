 msg_byz_de_jure_gain.desc: "[title_gainer.GetName] [Select_CString(title_gainer.IsFemale,'získala','získal')] zpět [swapped_kingdom.Custom('CZ_LandedName_A')] z [Concept('de_jure','de iure')|E] držby [GetTitleByKey('e_latin_empire').Custom('CZ_LandedName_G')]"
 swap_latin_for_byz_titles_tt: "Všechny [Concept('de_jure','de iure')|E] [Concept('titles','tituly')|E] [GetTitleByKey('e_latin_empire').Custom('CZ_LandedName_G')] budou vráceny [GetTitleByKey('e_byzantium').Custom('CZ_LandedName_D')]"
 ep3_frankokratia_events.0100.t: "Frankokratia, rozbitá"
 ep3_frankokratia_events.0100.desc: "Pro potomka sv. Petra, pro sv. Marka, pro florin a dukát — bylo [GetTitleByKey('e_byzantium').GetName] zpustošeno.\n\nOd té doby, znovu a znovu, [GetTitleByKey('e_latin_empire').GetAdjective] páni vyjížděli se svými rytíři. Zpočátku všichni odění ve zlatu a plni účelu, ale v poslední době... [Select_CString(latin_emp.IsFemale,'jejich panovnice','jejich panovník')] [latin_emp.GetTitledFirstNameRegnal] [Select_CString(latin_emp.IsFemale,'měla','měl')] marné a chabé naděje. [Select_CString(latin_emp.IsFemale,'Její','Jeho')] věc znala jen pochmurné rezignace.\n\n[GetTitleByKey('e_latin_empire').GetName|U], odporný výtvor vstoupený do křesťanstva, nikdy neměl být."
 ep3_frankokratia_events.0100.byz_no_emp: "S jeho zničením — jak může kterýkoliv velký [Glossary( 'Romaios', 'ROMAIOS_GLOSS' )] setrvat v klidu? Mocný Basileus, #EMP náš#! Basileus, musí brzy projít [Glossary( 'Golden Gate', 'GOLDEN_GATE_GLOSS' )] v triumfu.\n\nNeboť [GetTitleByKey('e_latin_empire').GetAdjective] říše již není!"
 ep3_frankokratia_events.0100.cath: "Byli naši křižáci oklamáni zrádnou pýchou? Oslňovalo nás světlo řecké majestátnosti #EMP tak, že jsme oslepli?#! Dokonce i sám papež vyvýšil náš latinský stát mezi Řeky..."
 ep3_frankokratia_events.0100.emp: "Skutečným dědicem Konstantina je spíše [byz_emp.GetTitledFirstNameRegnal]... [Select_CString(byz_emp.IsFemale,'ta, která','ten, kdo')] snad dokáže napravit tento věk těžkých křivd a znovu vztyčit mocnou hráz Bosporu."
 ep3_frankokratia_events.0100.a_non_catholic: "Přišlo to z [ROOT.Char.GetFaith.NegativeAfterLife]. K [ROOT.Char.GetFaith.NegativeAfterLife] se to vrací."
 ep3_frankokratia_events.0100.a_catholic: "Marně jsme snili o tom, že na Zemi zjednáme slávu, jakou si zaslouží [ROOT.Char.GetFaith.HighGodName]..."
 custom.greek_anarchy_rulers: "Každý [Concept('ruler','vládce')|E] s [GetTitleByKey('e_latin_empire').Custom('CZ_Adjective_yymi')|l] nebo [GetTitleByKey('e_byzantium').Custom('CZ_Adjective_yymi')|l] zeměmi"
