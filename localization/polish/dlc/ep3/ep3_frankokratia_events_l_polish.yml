 ep3_frankokratia_events.0110.t: "[GetTitleByKey('e_byzantium').GetNameNoTooltip] — obsazeno!"
 ep3_frankokratia_events.0110.desc: "Válka proti Frankům je prohrána.\n\nZ hlavního města prosakují zprávy o vyjednaném míru; mluví se o nově dosazeném [emperor.Custom('CZ_TitledFirstNameRegnal_L')] — šílenství v posvátné purpurové — kterého předvádějí gangy zapáchajících Latinských rytířů v kroužkové zbroji. Slyším také o [financier.Custom('CZ_TitleAsName_L')] [CZPrepZ(financier.GetPrimaryTitle.GetNameNoTierNoTooltip)] [financier.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')]: [Glossary( 'Augoustos', 'AUGOUSTOS_GLOSS')] z hadů, syčící urážky na naše císařské ministry a nařizující další tribut.\n\nKřižácká armáda je stále mimo hradby hlavního města. Co je dokáže donutit odejít? Něco jiného než naše úplné zničení...?"
 ep3_frankokratia_events.0110.a: "Budu chránit naše císařské způsoby, ať přijde cokoli."
 ep3_frankokratia_events.0110.b: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych hledat ochranu u [daddy.Custom('CZ_TitledFirstNameNoTooltip_G')]."
 ep3_frankokratia_events.0110.c: "[daddy_2.GetTitledFirstNameNoTooltip] má sílu to přečkat..."
 ep3_frankokratia_events.0110.d: "Brzy, možná... budu stát sám, nezpoután."
