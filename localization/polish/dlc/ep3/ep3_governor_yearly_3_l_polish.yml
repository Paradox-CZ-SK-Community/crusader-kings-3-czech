l_polish:
 ep3_governor_yearly.3001.t: "Stavitel, Kupec, Pozemkový pán"
 ep3_governor_yearly.3001.desc_christian: "Kdo si zaslouží odměnu, tomu Bůh dává blahobyt. Lenochova země zarůstá, ale můj statek [CZPrepV(root_domicile_province.GetTitle.GetNameNoTierNoTooltip)] [root_domicile_province.GetTitle.Custom('CZ_LandedNameNoTier_L')] — země, jejíž plody putují do mé spíže, nájmy vyplácené na mé jméno — se nyní táhne až k obzoru."
 ep3_governor_yearly.3001.desc_other: "Jak ta země kvete! Jak se sklady hemží! Kolem mého statku [CZPrepV(root_domicile_province.GetTitle.GetNameNoTierNoTooltip)] [root_domicile_province.GetTitle.Custom('CZ_LandedNameNoTier_L')] jsem [Select_CString(ROOT.Char.IsFemale,'vydala','vydal')] značné prostředky do místní produkce a nyní, naštěstí, mnoho pilných rodin platí nájem mně."
 ep3_governor_yearly.3001.desc_mid: "\n\nMístní [governor.GetTitleAsName|l] zatím vládne trní a zmatku. Obyvatelé [target_theme.Custom('CZ_LandedNameNoTier_G')]"
 ep3_governor_yearly.3001.desc_greek: "[Glossary( 'choritai', 'CHORITAI_GLOSS' )]"
 ep3_governor_yearly.3001.desc_non_greek: "drobnými držiteli půdy"
 ep3_governor_yearly.3001.desc: "sotva vědí, jestli je [Select_CString(governor.IsFemale,'její','jeho')] zákony chrání před výkupem! Daňoví poplatníci [governor.Custom('CZ_TitledFirstNameNoTooltip_G')] by se #EMP tak#! snadno mohli stát mými nájemci...\n\n"
 ep3_governor_yearly.3001.desc_garden: "Mé nově ohraničené zahrady — jsou to teprve začátky?"
 ep3_governor_yearly.3001.desc_garden_leisure: "Mé nově rozšířené zahrady, bohaté na krásné [root_domicile_province.Custom('get_region_flower_type_plural')] — jsou to teprve začátky?"
 ep3_governor_yearly.3001.desc_garden_fruit: "Mé nově rozšířené zahrady, provoněné dozrávajícím ovocem — jsou to teprve začátky?"
 ep3_governor_yearly.3001.desc_grazing_land: "Moje chytře vyjednaná práva na nové pastviny — jsou to teprve začátky?"
 ep3_governor_yearly.3001.desc_horse_pasture: "Mé nově podepsané právo na bohaté koňské pastviny — jsou to teprve začátky?"
 ep3_governor_yearly.3001.desc_camel_pasture: "Mé řehotající, páchnoucí, #EMP výnosné#! stáda hrubých velbloudů — jsou to teprve začátky?"
 ep3_governor_yearly.3001.desc_grain_field: "Moje nově obdělávaná obilná pole — jsou to teprve začátky?"
 ep3_governor_yearly.3001.desc_vineyard: "Nepřetržité řady listnatých opor mých nových vinic — jsou to teprve začátky?"
 ep3_governor_yearly.3001.desc_olive: "Mé nově koupené olivové háje, jejich drahé, zmlazené stromy — jsou to teprve začátky?"
 ep3_governor_yearly.3001.desc_silk: "Mé nové morušové háje produkující hedvábí — jsou to teprve začátky?"
 ep3_governor_yearly.3001.desc_tea: "Mé rozrůstající se řady zelených čajových keřů — jsou to jen začátek?"
 CHORITAI_GLOSS: "#bold Choritai#! je starořecký termín pro ty, kteří patří k vesnické komunitě, k #EMP chorion#!."
 ep3_governor_yearly.3001.a_success: "„Já? Nejmocnější pozemkový pán v okolí?“"
 ep3_governor_yearly.3001.a_failure: "Rychle se topíte ve skandálu"
 ep3_governor_yearly.3001.a_govs_low: "Tato možnost je dostupná díky velmi nízké [Concept('governor_efficiency','efektivitě guvernéra')|E] [governor.Custom('CZ_ShortUIName_G')]"
 ep3_governor_yearly.3001.c_gov_gain: "[Concept('governor_efficiency','Efektivita guvernéra')|E] [governor.Custom('CZ_ShortUIName_G')] se zvýší o #P 5#!"
 ep3_governor_yearly.3001.a: "Bez potíží bych [Select_CString(ROOT.Char.IsFemale,'vykoupila','vykoupil')] polovinu [target_theme.GetTierAsNameNoTooltip]!"
 ep3_governor_yearly.3001.a.flavor: "Tato neschopná správa si mých nových statků nevšimne dříve než při placení daní!"
 ep3_governor_yearly.3001.b: "Lépe, abych trochu [Select_CString(ROOT.Char.IsFemale,'prosperovala','prosperoval')] já, než [Select_CString(governor.IsFemale,'nějaká bláznivá','nějaký blázen')] [governor.GetTitleAsNameNoTooltip]."
 ep3_governor_yearly.3001.b.flavor: "Mám mince k utracení — proč nepořídit více výnosné půdy?"
 ep3_governor_yearly.3001.b_gov_response: "@warning_icon! #X [governor.GetShortUIName] vás může potrestat!#!"
 ep3_governor_yearly.3001.c: "Místo toho... mohu [governor.GetTitleAsNameNoTooltip] nabídnout svou pomoc."
 ep3_governor_yearly.3001.c.flavor: "Mé varování by mohla pomoci ztížit situaci ostatním pozemkovým pánům... a ukázat mou užitečnost."
 ep3_governor_yearly.3001.c_gain_influence: "Získáš #P 75#! #high vlivu#!"
 ep3_governor_yearly.3001.minor_influence_loss: "Utratíte #N 75#! #high Vliv#!"
 ep3_governor_yearly.3001.b_miniscule_influence_loss: "Utratíte #N 35#! #high Vliv#!"
 vast_tracts_of_land_modifier: "Rozsáhlé drobné usedlosti"
 vast_tracts_of_land_modifier_desc: "Tento dům vybírá nájmy a dohlíží na záležitosti mnoha řemeslných dílen a drobných usedlostí."
 productive_lands_modifier: "Mnoho drobných usedlostí"
 productive_lands_modifier_desc: "Hranice majetku této rodiny se rozšířily nátlakem a chytrými nákupy."
 ep3_governor_yearly.3002.t: "Z daňových poplatníků na nájemníky"
 ep3_governor_yearly.3002.desc: "„Podívejte – podívejte, tady v soupisech!“ vyjede [tax_farmer.GetName].\n\n„Další vesnice, od které jsem od koupě své smlouvy vaším jménem [Select_CString(tax_farmer.IsFemale,'vybírala','vybíral')] daně! A teď – výběrčí posílají za [landlord.Custom('CZ_Name_I')], [Select_CString(landlord.IsFemale,'svou novou paní','svým novým pánem')]! A [Select_CString(landlord.IsFemale,'ta','ten')] platí jen pár drobných.“\n\n„[Select_CString(landlord.IsFemale,'Ta','Ten')]"
 ep3_governor_yearly.3002_insult_greek: "[Glossary( 'metrokoites', 'METROKOITES_GLOSS' )]"
 METROKOITES_GLOSS: "#bold Metrokoites#! je řecké pejorativní označení popisující „toho, kdo spí se svou vlastní matkou.“"
 ep3_governor_yearly.3002_insult_armenian: "[Glossary( 'eshi dzag', 'ESHI_DZAG_GLOSS' )]"
 ESHI_DZAG_GLOSS: "#bold Eshi dzag#! je arménská urážka znamenající „syn osla.“"
 ep3_governor_yearly.3002_insult_generic: "[landlord.Custom2('InsultNoun', SCOPE.sC('tax_farmer'))]"
 ep3_governor_yearly.3002.desc_mid: "[Select_CString(landlord.IsFemale,'lhala','lhal')] těm venkovanům o jejich ochraně: vykupuje"
 ep3_governor_yearly.3002_half_duchy: "tak, #EMP tolik#!"
 ep3_governor_yearly.3002_some_of_duchy: "mnoho"
 ep3_governor_yearly.3002.desc_outro: "místních pastvin. Pomysli, ó [ROOT.Char.GetTitleAsNameNoTooltip]... na ztracené daně, ztracené oddíly...„"
 ep3_governor_yearly.3002.a: "Ten malý statkář si chce zahrávat se #EMP mnou#!...?"
 ep3_governor_yearly.3002.a.flavor: "„Půda #EMP ukradená#! od chudých #EMP nevinných#!? Krutost, zastrašování?“ Ano, myslím, že to slyším u svědků..."
 ep3_governor_yearly.3002.b: "„Přinutit je svolat! Přinutit je platit!“"
 ep3_governor_yearly.3002.b.flavor: "Běžní hlupáci budou sloužit pod hrozbou meče! Teď platí dvojnásob mnoha pánům."
 ep3_governor_yearly.3002.c: "Je mou povinností to odsoudit!"
 ep3_governor_yearly.3002.c.flavor: "Udělat ze závisti skandál dokazuje, že jsem aktivní, kompetentní správce [target_theme.Custom('CZ_LandedNameNoTierNoTooltip_G')]! Něco takového..."
 ep3_governor_yearly.3002.d: "„Pošlete [landlord.GetDynastyHouseNameNoTooltip]... moje blahopřání.“"
 ep3_governor_yearly.3002.d.flavor: "Přinejmenším někdo v tomto [target_theme.GetTierAsNameNoTooltip] bude spokojen..."
 ep3_governor_yearly.3002.a_medium_influence_loss: " Utratíte #N 150#! #high Vliv#!"
 ep3_governor_yearly.3002.b_miniscule_influence_gain: " Získáš #P 35#! #high vlivu#!"
 ep3_governor_yearly.3002.b_minor_influence_loss_landlord: "[landlord.GetShortUIName] utratí #N 75#! #high Vliv#!"
 ep3_governor_yearly.3000_major_governance_loss: "Tvá [Concept('governor_efficiency','efektivita guvernéra')|E] se na #high 10 let#! sníží o #N 15#!"
 ep3_governor_yearly.3000_governance_loss: "Tvá [Concept('governor_efficiency','efektivita guvernéra')|E] se na #high 10 let#! sníží o #N 10#!"
 ep3_governor_yearly.3000_miniscule_governance_loss: "Tvá [Concept('governor_efficiency','efektivita guvernéra')|E] se na #high 10 let#! sníží o #N 5#!"
 some_smallholds_modifier: "Skromný počet drobných usedlostí"
 some_smallholds_modifier_desc: "Navzdory razantnímu zásahu si tito pozemkoví páni stále vybírají nájmy od několika nadprávních nájemníků."
 taxed_and_pressganged_tenants_modifier: "Zdanění a donucení nájemníků do služby"
 taxed_and_pressganged_tenants_modifier_desc: "Místní drobní vlastníci, kteří prodali své pozemky, jsou dvakrát okradeni a, ačkoli je to nezákonné, jsou naverbováni do vojenské služby."
 ep3_governor_yearly.3003.t: "[landlord.GetNameNoTooltip],"
 ep3_governor_yearly.3003.desc_accused_of_crime: "S hrůzou slyším, že terorizujete nevinné drobné hospodáře! Mí #EMP četní#! svědkové tvrdí, že jste mimo jiné [Select_CString(landlord.IsFemale,'posílala','posílal')] děti plivat na vdovy? [Select_CString(landlord.IsFemale,'Kradla','Kradl')] psy? [Select_CString(landlord.IsFemale,'Lila','Lil')] vodu do komínů? A to všechno jen proto, abyste [Select_CString(landlord.IsFemale,'mohla','mohl')] skoupit pár zarostlých pastvin!\n\nVaše porušování zákona bylo bohužel zaznamenáno a zveřejněno... Obávám se, že o tom ještě uslyšíte."
 ep3_governor_yearly.3003.desc_force_used: "Promluvte se svými novými nájemníky. Řekněte jim, že jejich pozemkové daně stále dluží, jejich služba ve válce je stále povinná. Když přijdou moji vojáci, nestůjte jim v cestě.\n\nZákon prohlašuje, že nyní vlastníte půdu. Lidé jsou však #EMP moji#!."
 ep3_governor_yearly.3003.desc_scandal: "Můžete si myslet, že jsem [Select_CString(governor.IsFemale,'neschopná','neschopný')] a že mi na blahu [target_theme.Custom('CZ_LandedNameNoTier_G')] sotva záleží, ale jste to #EMP vy#!, kdo pošlapává tradici, jen aby si z ní tolik [Select_CString(landlord.IsFemale,'přivlastnila','přivlastnil')] – hanba vám!\n\nZjistíte, že vaše hrabivost se stala oblíbeným námětem rozhovorů [CZPrepV(governor.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip)] [governor.GetCapitalLocation.GetCounty.GetTitle.Custom('CZ_LandedNameNoTier_L')]. A bohužel zcela zaslouženě."
 ep3_governor_yearly.3003.desc_backs_down: "Blahopřeji vám k novým akvizicím! Krásné vesnice s rozumnými lidmi – vlastníte pěkný kraj!\n\nAno, někteří možná brblají o starých zákonech, které vás měly omezit, a lomí rukama nad budoucností [root_domicile_province.GetTitle.Custom('CZ_LandedNameNoTier_G')]... ale vaše moudrá a pevná ruka je k držení žezla ta nejlepší!"
 ep3_governor_yearly.3003.a_accused_of_crime: "Falešné obvinění! A přece — #EMP přišli pro mé pozemky?!?#!"
 ep3_governor_yearly.3003.a_force_used: "To rozzuří mé nájemníky! Zchudnete je!"
 ep3_governor_yearly.3003.a_scandal: "Může poškodit mou pověst... ale ne mé statky!"
 ep3_governor_yearly.3003.a_backs_down: "[governor.GetTitleAsNameNoTooltip] couvá! Všechno je bezpečně mé."
 ep3_governor_yearly.3010.t: "Přesto [emperor.GetTitleAsNameNoTooltip] bojuje"
 ep3_governor_yearly.3010.desc: "Vojska [emperor.Custom('CZ_TitledFirstName_G')] už léta"
 ep3_governor_yearly.3010.desc_attacker: "vedou válku ([war.Custom('WarCasusBelliShort')|l]) proti [foe.Custom('CZ_Name_D')].\n\nV provinciích se vypráví o úporných obléháních a nejistých bitvách, které skončily zmatkem a krví... debatujeme o snech o dobývání cizích zemí, za nimiž se žene náš [emperor.GetTitleAsNameNoTooltip|l]."
 ep3_governor_yearly.3010.desc_defender: "se brání tažení [foe.Custom('CZ_Name_G')] ([war.Custom('WarCasusBelliShort')|l]).\n\nV provinciích se vypráví o úporných obléháních a nejistých bitvách, které skončily zmatkem a krví... šeptáme o náporu nepřítele a strachujeme se o podrobené i mrtvé."
 ep3_governor_yearly.3010.desc_mid: "Víra lidu se chvěje."
 ep3_governor_yearly.3010.desc_winning: "\n\nAno, podle všech zpráv se boj daří... ale u všech svatých, jak pomalu [emperor.GetTitleAsNameNoTooltip] postupuje!"
 ep3_governor_yearly.3010.desc_losing: "\n\n[ROOT.Char.GetFaith.HighGodName|U] [Select_CString(emperor.IsFemale,'naší vládkyni','našemu vládci')] nepřeje. Podle všech zpráv [Select_CString(emperor.IsFemale,'její','jeho')] vojska spějí k porážce."
 ep3_governor_yearly.3010.desc_middling: "\n\nPřízeň, kterou by nám mohl prokázat [ROOT.Char.GetFaith.HighGodName], stále nepřichází: konec bojů není v dohledu."
 ep3_governor_yearly.3010.a: "Vyrazím na frontu, věrný voják, jaký jsem!"
 ep3_governor_yearly.3010.a.flavor: "A neměl by věrný, štědrý voják očekávat teplo uznání od [Select_CString(ROOT.Char.IsFemale,'jejího','jeho')] velitele...?"
 ep3_governor_yearly.3010.a.success: "[emperor.GetTitleAsNameNoTooltip|U] přijímá tvou pomoc"
 ep3_governor_yearly.3010.a.fail: "[emperor.GetTitleAsNameNoTooltip] nemá zájem"
 ep3_governor_yearly.3010.b: "Silný #EMP vládce#! mohl by toto ukončit."
 ep3_governor_yearly.3010.b.flavor: "Nemělo by království hledat pána, který se nepotácí a nezklame?"
 ep3_governor_yearly.3010.c: "Provincie jsou myšlenkám [emperor.Custom('CZ_TitleAsNameNoTooltip_G')] tak vzdálené..."
 ep3_governor_yearly.3010.c.flavor: "...a tak náchylné k mým machinacím."
 ep3_governor_yearly.3010.d: "Zbožný dar, modlitba na [Select_CString(emperor.IsFemale,'její','jeho')] počest."
 ep3_exploited_weak_master_modifier: "Vykořisťovaný bojující suzérén"
 ep3_exploited_weak_master_modifier_desc: "Zatímco jejich vrchnost byla ponořena ve válce, tento správce přesměroval fondy a přeuspořádal místní správu ve svůj prospěch."
 msg_claimed_weak_emperors_title.t: "[ROOT.Char.GetTitleAsNameNoTooltip] zpochybňuje vládu"
 msg_claimed_weak_emperors_title.flavor: "Lůza odsuzuje tvou vleklou válku a provolává rozhodnější postavu."
 msg_claimed_weak_emperors_title.t.2: "Člen frakce odsuzuje válku"
 msg_claimed_weak_emperors_title.flavor.2: "Tvá vleklá válka proti [foe.Custom('CZ_Name_D')] dodává tvým odpůrcům věrohodnosti."
 decried_weakness_score_desc: "Odsouzená císařská slabost"
 governor_challenges_weakness_candidate_score: "[Concept('candidate_score','Skóre kandidáta')|E] [ROOT.Char.Custom('CZ_ShortUIName_G')] pro [emperor.GetPrimaryTitle.Custom('CZ_LandedName_A')] se zvýší o #P 20#!"
 ep3_governor_yearly.3011.opening: "Můj suzeréne, nejváženější [emperor.GetTitleAsName],"
 ep3_governor_yearly.3011.desc: "Naše vojska už dlouho válčí s [foe.Custom('CZ_Name_I')], a přesto nemáme žádný triumf, který bychom mohli ohlásit.\n\nKdybych vaší věci [Select_CString(ROOT.Char.IsFemale,'propůjčila','propůjčil')] svou osobní stráž a vlastní peníze – byla by taková věrná služba náležitě oceněna?"
 ep3_governor_yearly.3011.a: "Cokoli, jen aby byli moji nepřátelé konečně poraženi!"
 ep3_governor_yearly.3011.b: "[governor.GetTitledFirstNameNoTooltip] sotva stojí za to mít jako spojence..."
 ep3_governor_yearly.3012.opening: "Ó statečný ministře [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')],"
 ep3_governor_yearly.3012.desc_fail: "Absurdní podmínky tvé nabídky stranou - tvá vojenská síla není tak naléhavě potřeba.\n\nMůžeš stále snít o připojení k tvému [emperor.GetTitleAsName] uprostřed hukotu války, ale když tě provází jen ambice, lépe si vychutnat sladkou hudbu tvého poklidného útočiště."
 ep3_governor_yearly.3012.desc_success: "Přijímám tvou nabídku. Očekáváme čerstvou sílu tvých vojáků na unaveném bojišti.\n\nPro tvou odvahu, štědrost ducha a vytrvalost, jen málo pozemských odměn se tomu rovná."
 ep3_governor_yearly.3012.kyrie_eleison: "[Glossary( 'Kýrie, eléison!', 'KYRIE_ELEISON_GLOSS' )]"
 ep3_emperor_yearly.3011.a_to_war: "Skvělý [emperor.GetPrimaryTitle.GetAdjectiveNoTooltip] důstojník se přidává do boje!"
 ep3_emperor_yearly.3011.a_no_war: "[Select_CString(ROOT.Char.IsFemale,'Chtěla','Chtěl')] jsem #EMP jen#! sloužit [Select_CString(emperor.IsFemale,'naší','našemu')] [emperor.Custom('CZ_TitleAsNameNoTooltip_D')]..."
 ep3_governor_yearly.3020.t: "Tohle že [Select_CString(EqualTo_string(ROOT.Char.GetFaith.HighGodHerHis,Localize('CHARACTER_HERHIS_HER')),'ustanovila','ustanovil')] [ROOT.Char.GetFaith.HighGodName]?"
 ep3_governor_yearly.3020.desc: "[target_trait.GetNameNoTooltip( GetNullCharacter )|l] [emperor.GetTitleAsName], který nad námi vládne, je často předmětem potichých rozhovorů."
 ep3_governor_yearly.3020.desc_physical: "\n\nMůže naše říše zůstat celá, když je její vtělení samo zohyzděné? Bude se zničená podoba [emperor.Custom('CZ_TitledFirstNameNoTooltip_G')] razit na nové mince? A – strach i pomyslet – budou snad vyvolení vládci, které ustanovuje [ROOT.Char.GetFaith.HighGodNameAlternate], od nynějška zmrzačení ubožáci?\n\nNe, [Select_CString(emperor.IsFemale,'tato','tento')] [target_trait.GetNameNoTooltip( GetNullCharacter )|l] [emperor.GetTitleAsName|l] si purpur sotva zaslouží..."
 ep3_governor_yearly.3020.desc_crime: "\n\nJsme vskutku nejpožehnanější z říší, když nám vládne [Select_CString(emperor.IsFemale,'ohavná zločinkyně – hříšnice, která','ohavný zločinec – hříšník, který')] pohrdá přikázáními, jež dal [ROOT.Char.GetFaith.HighGodNameAlternate]? Kolik dalších našich zákonů ještě sepíšou poskvrněné ruce?\n\n[Select_CString(emperor.IsFemale,'Naše','Náš')] [target_trait.GetNameNoTooltip( GetNullCharacter )|l] [Select_CString(emperor.IsFemale,'paní','pán')] na vysokém trůnu – #EMP naprostá potupa!#! [Select_CString(emperor.IsFemale,'Méně urozená žena by byla','Méně urozený muž by byl')] už dávno [Select_CString(emperor.IsFemale,'popravena','popraven')]..."
 ep3_governor_yearly.3020.a: "Vzpoura nejlépe roste ve tmě..."
 ep3_governor_yearly.3020.a.flavor: "A všechny šepoty o císařské nehodě by měly směřovat zpět ke mně."
 ep3_governor_yearly.3020.a.success: "Pomluvy naslouchají tvému jedovatému výpadu"
 ep3_governor_yearly.3020.a.fail: "Tvůj jed nikoho nezajímá"
 ep3_governor_yearly.3020.b: "Musím napsat dopis odsuzující!"
 ep3_governor_yearly.3020.flavor: "Toto znamení nepřízně, kterou dává najevo [ROOT.Char.GetFaith.HighGodNameAlternate], je pohromou nejen pro [emperor.Custom('CZ_TitleAsNameNoTooltip_A')], ale pro celou říši!"
 ep3_governor_yearly.3020.c: "Pilná práce mě od toho odvrátí."
 governor_insulted_imperial_trait_candidate_score: "[Concept('candidate_score','Skóre kandidáta')|E] [ROOT.Char.Custom('CZ_ShortUIName_G')] pro [emperor.GetPrimaryTitle.Custom('CZ_LandedName_A')] se zvýší o [EmptyScope.ScriptValue('appointment_score_minor_value')|P0]"
 insulted_trait_score_desc: "Odsouzený nehodný [Concept('trait','rys')|E] [Concept('liege','lenního pána')|E]"
 msg_unflattering_imperial_trait_gossip.t: "Skandální pomluvy"
 msg_unflattering_imperial_trait_gossip.flavor: "Šíří se nebezpečné řeči: tví ministři nesnášejí, že mají [target_trait.GetName( GetNullCharacter )|l] [emperor.GetTitleAsNameNoTooltip|l]."
 ep3_governor_yearly.3021.opening: "Můj [emperor.GetTitleAsNameNoTooltip],"
 ep3_governor_yearly.3021.desc_physical: "Dobře víte, že nás, [minister.GetCulture.GetCollectiveNoun|l], jímá hrůza, když na trůnu dokonalého vládce, kterého ustanovil [minister.GetFaith.HighGodName], sedí zohyzděné tělo.\n\nMusím vás naléhavě požádat, [Select_CString(emperor.IsFemale,'naše','náš')] [target_trait.GetNameNoTooltip( GetNullCharacter )|l] [emperor.Custom('CZ_TitleAsNameNoTooltip_V')], abyste [Select_CString(emperor.IsFemale,'prosila','prosil')] o ochranu, kterou dává [minister.GetFaith.HighGodNameAlternate]! Jen božím milosrdenstvím můžeme přečkat tyto nepřirozené časy."
 ep3_governor_yearly.3021.desc_crime: "Pro vaši hříšnou povahu se obávám o vaši vládu. [target_trait.GetNameNoTooltip( GetNullCharacter )|U] [emperor.GetTitleAsNameNoTooltip|l] – naléhám na vás, abyste před celou říší [Select_CString(emperor.IsFemale,'hledala','hledal')] rozhřešení, jež uděluje [minister.GetFaith.HighGodNameAlternate].\n\nJak dlouho může duše snášet hnilobu hříchu? A jak dlouho my mocní vydržíme pohromu vašich prohřešků?"
 ep3_governor_yearly.3021.a: "Ač nedokonalý, přísahám, že budu usilovat pro svůj lid."
 ep3_governor_yearly.3021.b: "Bezostyšnost!"
 ep3_governor_yearly.3021.bad_trait: "@warning_icon! #X Toto se stalo kvůli vašemu [target_trait.GetName( GetNullCharacter )] [Concept('trait','rysu')|E]#!"
 ep3_governor_yearly.3021.a.flavor: "Asi na čas mi zbožní mohou odpustit a nechají to vymizet z myslí..."
 emperor_repented_for_flaws_modifier: "Pokání za císařské vady"
 emperor_repented_for_flaws_modifier_desc: "Ač tato postava není plně hodna vysokého úřadu, veřejně usilovala o smíření a odpuštění."
 ep3_governor_yearly.3021.blocker: "Tuto událost nedostanete nejméně #high 10 let#!"
 ep3_governor_yearly.3030.t: "Poklidné časy"
 ep3_governor_yearly.3030.desc_christian: "„Blahoslavení, kdo šíří pokoj!“ napsal svatý Matouš, a tím jistě předal Pánovu pravdu.\n\n[emperor.GetPrimaryTitle.GetDefinitiveName|U] a mé [ROOT.Char.GetPrimaryTitle.GetNameNoTier] už léta žijí v Kristově pokoji."
 ep3_governor_yearly.3030.desc_generic: "[emperor.GetPrimaryTitle.GetDefinitiveName|U] a mé [ROOT.Char.GetPrimaryTitle.GetNameNoTier] už léta žijí v míru.\n\n"
 ep3_governor_yearly.3030.desc: "Dobytek na polích tloustne. Mladíci, které netíží vojenské povinnosti, se vyhřívají v trávě. V našich spokojených městech kupci volně obchodují a úředníci se starají o obecné blaho.\n\nŽe by má vláda a vláda [emperor.Custom('CZ_TitledFirstName_G')] nepoznaly žádné velké, slavné činy? Jen tuhle... spokojenost?"
 ep3_governor_yearly.3030.a: "Poklidná idyla nás udělala #EMP měkkými#!"
 ep3_governor_yearly.3030.a.flavor: "Vyrazit za hranice se zbraní v ruce — to probudí mé vojsko!"
 ep3_governor_yearly.3030.b: "Neplánuji válku, ale prosperitu."
 custom.every_sub_realm_county: "Každé [Concept('county','hrabství')|E] ve vašem [Concept('realm','panství')|E]"
 ep3_peaceful_administrator_modifier: "Mírumilovný správce"
 ep3_peaceful_administrator_modifier_desc: "Tato postava opakovaně vydává zákony ve prospěch pacifistické prosperity."
 ep3_governor_yearly.3030.c: "Tento pohodlný život je nejlepší vychutnat s rodinou."
