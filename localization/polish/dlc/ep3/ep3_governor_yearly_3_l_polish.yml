 unlocked_via_event: "Odemčeno událostí"
 ep3_governor_yearly.3040.t_greek: "[emperor.GetTitleAsNameNoTooltip] Autokrator!"
 ep3_governor_yearly.3040.t: "Nejdokonalější [emperor.GetTitleAsNameNoTooltip]"
 ep3_governor_yearly.3040.desc: "Začínám si jen s námahou vybavovat – bylo [emperor.GetPrimaryTitle.GetName] opravdu jen temnotou a chaosem, než se žezla [Select_CString(emperor.IsFemale,'chopila vznešená','chopil vznešený')] [emperor.GetTitledFirstName]?\n\nSnila snad smetánka o něčem jiném než o společnosti rodu [emperor.GetHouse.GetName]? Provolávali naši vojáci jméno nějakého ošklivého, komolícího cizince? A naši magnáti – ráčili by líbat nohy, které nejsou z dokonalého těla [emperor.Custom('CZ_TitleAsNameNoTooltip_G')], které vyvolil [ROOT.Char.GetFaith.HighGodName]?\n\nVlastně si to pamatovat nemusím. Takto zpochybňovat neomylnou legitimitu mého panovníka by bylo marné."
 ep3_governor_yearly.3040.a: "Musím propojit svou rodinu s [Select_CString(emperor.IsFemale,'jejím','jeho')] urozeným pokrevním tokem!"
 ep3_governor_yearly.3040.a.flavor: "Taková úcta k předkům nás oba posílí."
 ep3_governor_yearly.3040.b: "Mocný [emperor.GetTitleAsNameNoTooltip] možná mou pomoc nepotřebuje..."
 ep3_governor_yearly.3040.b.flavor: "...ale uchazeči rodu [emperor.GetHouse.GetNameNoTooltip] jsou mnohem nejistější."
 ep3_governor_yearly.3040.c: "#EMP Já#! musím být tak velmi neochvějný."
 ep3_governor_yearly.3040.c.flavor: "Nespoléhej na sílu mého pána, ale na pevné vojsko a místní zápal!"
 ep3_governor_yearly.3040.d: "Nováčci se dožadují boje v [Select_CString(emperor.IsFemale,'jejím','jeho')] jménu!"
 ep3_governor_yearly.3040.d.flavor: "A já je rád naverbuji."
 custom.every_house_member_emperor: "Každý člen [Concept('house','rodu')|E] [emperor.GetHouse.GetName]"
 independent_administrator_modifier: "Nezávislý správce"
 independent_administrator_modifier_desc: "Každý úředník sloužící této postavě má odpovídat výhradně jí a odolávat vnějším vlivům."
 sycophant_boosts_credibility_candidate_score: "[Concept('candidate_score','Skóre kandidáta')|E] [candidate.Custom('CZ_ShortUIName_G')] pro [emperor.GetPrimaryTitle.Custom('CZ_LandedName_A')] se zvýší o [EmptyScope.ScriptValue('appointment_score_minor_value')|P0]"
 boosted_by_sycophant_score_desc: "Podpořeno obdivovateli [Concept('house','rodu')|E]"
 ep3_governor_yearly_3040_marriage_tooltip: "[Concept('houses','Rody')|E] [root_scope.GetHouse.GetName] a [emperor.GetHouse.GetName] mají zvýšené přijetí [Concept('marriage','sňatků')|E] na #high 30 let#!"
 msg_governor_compliments_legitimacy.t: "[root_scope.GetTitleAsNameNoTooltip] obdivuje legitimitu"
 ep3_neglecting_house_head_duties_modifier: "Opomíjení ministerských povinností"
 ep3_neglecting_house_head_duties_modifier_desc: "Neuspokojuje ani příbuzné, ani pána; tato postava tráví plodné hodiny mezi intrikány a společenskými nastupujícími."
 ep3_governor_yearly_3050_neglect_duties_tooltip: "Na #high 10 let#! ztratíš #N -5%#! [Concept('governor_efficiency','efektivity guvernéra')|E]"
 ep3_governor_yearly_3050_factions_emp_tooltip: "Ostatní [Concept('vassals','vazalové')|E] mají větší pravděpodobnost připojit se k [Concept('factions','frakcím')|E], které zahrnují [root_scope.Custom('CZ_ShortUIName_A')]"
 msg_governor_challenging_illegitimacy.t: "Neloajální [root_scope.GetTitleAsNameNoTooltip] získává podporu"
 msg_governor_challenging_illegitimacy.desc: "[root_scope.GetName] a [Select_CString(root_scope.IsFemale,'její','jeho')] stoupenci odsuzují tvou chabou [Concept('legitimacy','legitimitu')|E]."
 msg_governor_supports_rule.t: "[root_scope.GetTitleAsNameNoTooltip] hájí tvůj mandát"
 msg_governor_supports_rule.desc: "[root_scope.GetName|V] tě veřejně hájí proti těm, kteří mluví o tvé nelegitimnosti."
 ep3_governor_yearly.3050.t: "Jeden z menších démonů [ROOT.Char.GetFaith.NegativeAfterLife|U]"
 ep3_governor_yearly.3050.desc_strange_intro: "O [emperor.Custom('CZ_FullNameNoTooltip_L')], [Select_CString(emperor.IsFemale,'naší','našem')] [emperor.Custom('CZ_TitleAsNameNoTooltip_L')] s nepřirozenou myslí a neobvyklými činy, se šíří podivné zvěsti."
 ep3_governor_yearly.3050.desc: "Šíří se zvláštní zvěsti o [emperor.FullNameNoTooltip], našem [emperor.GetTitleAsNameNoTooltip], který balancuje na pokraji [Select_CString(emperor.IsFemale,'jejímu','jeho')] trůnu."
 ep3_governor_yearly.3050.mess: "\n\nPřišel prodavač léčiv a vyprávěl o... bezbožných zakázkách, které dostal z paláce. Oči humra, dětské nehty, lektvary z mandragory a smoly – to všechno si prý [emperor.GetTitleAsNameNoTooltip|l] cpe do svých blábolících úst! To stvoření se potuluje po paláci nahé, pomazané svými podivnými mastmi, a proklíná jméno, jež nese [emperor.GetFaith.HighGodName]!"
 ep3_governor_yearly.3050.shiftless: "\n\nTi služebníci, kteří utekli z [Select_CString(emperor.IsFemale,'jejích','jeho')] služeb, popisují tartarské rozvaliny, páchnoucí starým parfémem... [emperor.GetTitleAsNameNoTooltip|U] leží dlouhé hodiny ve tmě, žadoní pod mumlajícím, štíhlonohým #EMP stvořením#!. Když [Select_CString(emperor.IsFemale,'její','jeho')] ministři volají, [emperor.GetFirstNameNoTooltip] sotva zavrtí... ale když ďábel pohněme svými těžkými rty, [emperor.GetTitleAsNameNoTooltip] vykřikne o úlevu, o víno a koláče."
 ep3_governor_yearly.3050.coward: "\n\n[Select_CString(emperor.IsFemale,'Její','Jeho')] vlastní příbuzní šeptají tento rodinný příběh. V jejich vlasti byla posvátná žena znásilněna a když přišla její zralost, nevyklubalo se z ní dítě, ale... #EMP hromada červů.#! Jeden z těchto smradlavých červů byl sežrán potkanem, potkan rackem a rack [emperor.Custom('CZ_FirstNameNoTooltip_I')] [Select_CString(emperor.IsFemale,'samotnou','samotným')]. Teď se [emperor.GetTitleAsNameNoTooltip] třese a pláče — i při pískání plcha!"
 ep3_governor_yearly.3050.cruel: "\n\nJedna dáma z [Select_CString(emperor.IsFemale,'jejího','jeho')] dvora přísahá, že [Select_CString(emperor.IsFemale,'ji','ho')] v noci viděla v zahradách... #EMP pít krev toulavé kočky!#! Pod roztrhanou kožešinou, která zdobila korunu, se krutá tvář [emperor.Custom('CZ_FirstNameNoTooltip_G')] šklebila a plivala krev. Pak [Select_CString(emperor.IsFemale,'uprchla','uprchl')] – přes zahradní zeď [Select_CString(emperor.IsFemale,'ji','ho')] přenesly dva přízraky s netopýřími křídly!"
 ep3_governor_yearly.3050.generic_bad: "\n\nPodkoní a služky si šeptají, že [emperor.GetFirstNameNoTooltip] se ve skutečnosti #EMP [Select_CString(emperor.IsFemale,'zrodila','zrodil')] z řiti, kterou má [ROOT.Char.GetFaith.DevilName]#!. [emperor.GetTitleAsNameNoTooltip|U] že pochází z [ROOT.Char.GetFaith.NegativeAfterLife]! Ten páchnoucí podvodník prý vylezl z prokletých jam, vplížil se do palácových ložnic a tam vklouzl do kůže našeho právoplatného [emperor.Custom('CZ_TitleAsNameNoTooltip_G')]!"
 ep3_governor_yearly.3050.outro: "\n\nZe dvora [emperor.Custom('CZ_FirstNameNoTooltip_G')] neustále prosakují takové odporné zprávy."
 ep3_governor_yearly.3050.a: "#EMP DÉMON!#!"
 ep3_governor_yearly.3050.b: "Proč odpovídat tomuto ničemovi.. a ne mně?"
 ep3_governor_yearly.3050.c: "#EMP Mlč!#! To je absurdní pomluva [Select_CString(emperor.IsFemale,'mé','mého')] [emperor.Custom('CZ_TitleAsNameNoTooltip_G')]!"
 ep3_governor_yearly.3050.c.flavor: "Nechť je známo: považuji ty, kdo šíří tyto podivné lži, za naprosto opovrženíhodné!"
 ep3_governor_yearly.3050.d: "Zkáza povinnosti je ziskem politika."
 ep3_governor_yearly.3060.t: "Velkolepá aklamace"
 ep3_governor_yearly.3060.t_regent: "Okázalé potvrzení"
 ep3_governor_yearly.3060.intro_regent: "Palácová politika se pohybuje pomalu — většinou. [previous_holder.GetTitledFirstNameRegnal|U] už není správcem [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip|l]."
 ep3_governor_yearly.3060.intro_usurper: "Koruna byla stržena z čela našeho panovníka — [previous_holder.GetTitledFirstNameRegnal] již nad [emperor.GetPrimaryTitle.GetTierAsName] nevládne."
 ep3_governor_yearly.3060.intro_deceased: "[Select_CString(previous_holder.IsFemale,'Strážkyně','Strážce')] [emperor.GetPrimaryTitle.GetTierAsName], [Select_CString(previous_holder.IsFemale,'naše pastýřka a panovnice','náš pastýř a panovník')], [Select_CString(previous_holder.IsFemale,'opustila','opustil')] tento smrtelný svět. [previous_holder.GetTitledFirstNameRegnal|U] je [Select_CString(previous_holder.IsFemale,'mrtva','mrtev')]."
 ep3_governor_yearly.3060.desc_regent: "\n\nHluboko v síních císařského paláce [CZPrepV(emperor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip)] [emperor.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_L')] jsou před shromážděnými hodnostáři potvrzeny pravomoci [Select_CString(emperor.IsFemale,'nové','nového')] [emperor.Custom('CZ_TitleAsNameNoTooltip_G')]."
 ep3_governor_yearly.3060.desc_afield: "\n\nTábořící [CZPrepV(emp_location.GetNameNoTooltip)] [CZProvName(emp_location,'L')], mezi jasnými prapory, je nový [emperor.GetTitleAsNameNoTooltip] pozvednut na velkém lesklém štítu."
 ep3_governor_yearly.3060.desc_temple: "\n\nV hlavním chrámu ([emperor.GetFaith.HouseOfWorship|l]) [CZPrepV(emperor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip)] [emperor.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_L')] je mezi hodnostáři a preláty poprvé [Select_CString(emperor.IsFemale,'provolána nová','provolán nový')] [emperor.GetTitleAsNameNoTooltip|l]."
 ep3_governor_yearly.3060.desc_byzantine: "\n\n#EMP „Ať žije [emperor.GetFirstNameRegnal]!“#! volají shromáždění. #EMP „S milostí Krista, věrný [emperor.GetTitleAsNameNoTooltip] a #EMP [Glossary( 'Autokrator', 'AUTOKRATOR_GLOSS')]#! Římanů; [emperor.GetHouse.GetName], navěky [Glossary( 'Augoustos', 'AUGOUSTOS_GLOSS')]!“#!"
 ep3_governor_yearly.3060.desc_byzantine_femme: "\n\n#EMP „Ať žije [emperor.GetFirstNameRegnal]!“#! volají shromáždění. #EMP „S milostí Krista, věrná [emperor.GetTitleAsNameNoTooltip] a #EMP [Glossary( 'Autokrator', 'AUTOKRATOR_GLOSS')]#! Římanů; [emperor.GetHouse.GetName], navěky [Glossary( 'Augousta', 'AUGOUSTUS_GLOSS')]!“#!"
 AUGOUSTOS_GLOSS: "Čestný titul znamenající „vážený“ nebo „majestátní“, udělovaný nástupcům prvního římského císaře. Ve 7. století měl řecký titul Basileus větší význam v císařské hierarchii."
 AUTOKRATOR_GLOSS: "Klasický řecký titul označující toho, kdo rozkazuje bez nadřízených, obnovený v období střední Byzance pro použití u vysokých císařů."
 ep3_governor_yearly.3060.desc_regent_acclaim: "\n\nPestrobarevná razítka a pečlivé podpisy rychle pokrývají úřední dokumenty. #EMP „Jak chce [emperor.GetFaith.HighGodName] a [ceremonial_liege.Custom('CZ_TitledFirstName_G')], [Select_CString(ceremonial_liege.IsFemale,'matky','otce')] [CZPrepZ(emperor.GetPrimaryTitle.GetNameNoTierNoTooltip)] [emperor.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')]; [ceremonial_liege.GetHouse.GetName], nej-[ceremonial_liege.Custom('FormalComplimentAdjective')]!#!“"
 ep3_governor_yearly.3060.desc_generic: "\n\n#EMP „Ať žije [emperor.GetFirstName]!“#! volají shromáždění. #EMP „Jak chce [emperor.GetFaith.HighGodName], mocný [emperor.GetTitleAsNameNoTooltip] a [Select_CString(emperor.IsFemale,'matka','otec')] [CZPrepZ(emperor.GetPrimaryTitle.GetNameNoTierNoTooltip)] [emperor.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')]; [emperor.GetHouse.GetName], nej-[emperor.Custom('FormalComplimentAdjective')]!#!“"
 ep3_governor_yearly.3060.desc_regent_legit: "\n\n[Select_CString(ceremonial_liege.IsFemale,'Její','Jeho')] poddaní se modlí: #EMP „Kéž [emperor.GetTitledFirstName] bdí nad vaší vládou, navždy zachová panování Vašeho Veličenstva a mír a pořádek v [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip|l]!“#!"
 ep3_governor_yearly.3060.desc_high_legit: "\n\n[Select_CString(emperor.IsFemale,'Její','Jeho')] poddaní se modlí: #EMP „[ROOT.Char.GetFaith.random_GoodGodNames], zachovej panování Vašeho Veličenstva navždy, nyní i vždycky! Na věky věků!“#!"
 ep3_governor_yearly.3060.desc_medium_legit: "\n\nTřpytivé mince létají nad slavnostním průvodem! Magistráti se sklánějí před [emperor.Custom('CZ_TitledFirstNameNoTooltip_I')]... zastrašeni, byť ještě ne loajální."
 ep3_governor_yearly.3060.desc_low_legit: "\n\nZatímco se konají podlézavé obřady, říší se šíří šepot... jakým právem vládne [Select_CString(emperor.IsFemale,'tato','tento')] [emperor.Custom2('InsultAdjective', ROOT.Char)] [emperor.GetTitleAsNameNoTooltip|l]?"
 ep3_governor_yearly.3060.a: "Teď bude [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')] [emperor.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))|l] [Select_CString(ROOT.Char.IsFemale,'odměněna','odměněn')]!"
 ep3_governor_yearly.3060.b: "Musím tento režim odsoudit!"
 ep3_governor_yearly.3060.b.flavor: "A připravit se, že v stínech udělám víc než jen odsuzovat..."
 ep3_governor_yearly.3060.c: "Veřejně podporuji nového [emperor.GetTitleAsNameNoTooltip]."
 ep3_governor_yearly.3060.c.flavor_high_legit: "Kdo by mohl jednat jinak?"
 ep3_governor_yearly.3060.c.flavor_low_legit: "I když mi to přinese jen posměch."
 ep3_governor_yearly.3060.c.flavor_regent: "Kdo jsem já, abych [Select_CString(ROOT.Char.IsFemale,'zpochybňovala','zpochybňoval')] vůli [ceremonial_liege.Custom('CZ_TitleAsNameNoTooltip_G')]?"
 ep3_governor_yearly.3060.c.flavor_med_legit: "Taková věrnost se očekává."
 ep3_governor_yearly.3060.d: "O svém novém pánovi mám jen málo názoru."
 ep3_governor_yearly.3060.d.regent: "Mám jen málo názorů na nového regenta."
 admin_coronation_still_req_tt: "[emperor.GetShortUIName] nyní má [emperor.GetPrimaryTitle.Custom('CZ_LandedName_A')], ale ponechává si [GetLaw('uncrowned').GetName] [law_i][Concept('law','zákon')|E], dokud neproběhne [Concept('coronation','korunovace')|E]"
 ep3_head_of_opposition_modifier: "Ohnisko opozice"
 ep3_head_of_opposition_modifier_desc: "Kritici mocného panovníka se sdružují kolem této postavy; je známým vůdcem pro nespokojené."
 ep3_succession_low_legitimacy_tooltip: "#low Účinky ovlivnila nízká [Concept('legitimacy','legitimita')|E] [emperor.Custom('CZ_TitleAsName_G')]#!"
 ep3_succession_high_legitimacy_tooltip: "#low Účinky ovlivnila vysoká [Concept('legitimacy','legitimita')|E] [emperor.Custom('CZ_TitleAsName_G')]#!"
 ep3_governor_yearly.3070.t: "Zkušený řečník"
 ep3_governor_yearly.3070.intro: "Jeden z dvořanů mého lenního pána [liege.Custom('CZ_TitledFirstName_G')] je známý tím, že zkouší, co vydrží cesty [liege.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')]. [root_capital.GetTerrain.GetNameNoTooltip|U] kolem mého"
 ep3_governor_yearly.3070.landed: "hlavního města jsou docela odlehlé... ale nicméně bezohledný [racer.GetName] nyní"
 ep3_governor_yearly.3070.unlanded: "rodinné sídlo je docela odlehlé... ale nicméně bezohledný [racer.GetName] nyní"
 ep3_governor_yearly.3070.chariot: "řítí se [Select_CString(racer.IsFemale,'jejím','jeho')] nápadným vozem po [root_capital.GetName]."
 ep3_governor_yearly.3070.horse: "žene svého koně přes [root_capital.GetName]."
 ep3_governor_yearly.3070.desc: "\n\n„Ty bydlíš až #EMP tady?!?#!“ ušklíbne se [racer.GetFirstNameNoTooltip]. „Není divu, že si [liege.GetTitleAsNameNoTooltip|l] nemůže vzpomenout na tvé jméno... spíš je div, že nějaké slovo nebo cestovatel [CZPrepZ(liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip)] [liege.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_G')] vůbec tu cestu přežije!“"
 ep3_governor_yearly.3070.a: "Jsou tu šance! Nikam se nechystáme."
 ep3_governor_yearly.3070.b: "Zabalte se, příbuzní: stěhujeme se do hlavního města."
 ep3_governor_yearly.3070.c: "„Vidíš můj problém... teď mi pomoz.“"
 ep3_governor_yearly.3070.c.flavor: "Tento dvorní tvor musí mít vlivné vazby — vazby, které by mě mohly spojit s lepším místem."
 ep3_governor_yearly.3070.d: "Cesta je těžká? Postarám se o cesty."
 ep3_governor_yearly.3070.d.success: "Výstavba cest podporuje spojení s hlavním městem"
 ep3_governor_yearly.3070.d.fail: "Stavitelé cest čelí tisíci překážkám"
 ep3_governor_yearly.3070.e: "Zbožňuji tyto malebné odlehlé kraje."
 domicile_move_to_province.tt: "Přesunete svůj [Concept('domicile','domicil')|E] do [liege.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_G')]"
 cultural_acceptance_gain_content_governor: "[Concept('governors','Guvernéři')|E] spravující spokojeně"
 contented_governing_countrymen_modifier: "Spokojení vládnoucí krajané"
 contented_governing_countrymen_modifier_desc: "Oficiálně zastupovat své lidi je povinnost, kterou tato postava vychutnává."
 contented_governing_countrymen_modifier_tooltip: "#weak [Concept('governor_efficiency','Efektivita guvernéra')|E] při správě [Concept('provinces','provincií')|E] stejné [Concept('culture','kultury')|E]: @governor_efficiency!#P +10%#!#!"
 contented_distant_governor: "Spokojen s izolací"
 diverging_culture_discount_tooltip: "Náklady na [Concept('diverge','odštěpení')|E] [Concept('culture','kultury')|E]: #P -33%#!"
 ep3_governor_ignored_isolation_tooltip: "Na #high 5 let#! jsi [Select_CString(GetPlayer.IsFemale,'ztratila','ztratil')] #N -5%#! [Concept('governor_efficiency','efektivity guvernéra')|E]"
 ep3_governor_ignored_isolation_removal_tooltip: "Tvá [Concept('governor_efficiency','efektivita guvernéra')|E] se #P obnoví#!"
 ep3_face_of_empire_modifier: "Ruka správy"
 ep3_face_of_empire_modifier_desc: "Díky síle oddanosti této postavy se říše rozšiřuje za hranice svého poslušného jádra."
 ep3_anxious_for_new_assignment_tooltip: "Na #high 5 let#! ztratíš #N -5%#! [Concept('governor_efficiency','efektivity guvernéra')|E]"
 ep3_anxious_for_new_assignment_desc: "#weak [Concept('governor_efficiency','Efektivita guvernéra')|E]: #N -5%#!#!"
 ep3_governor_yearly.3080.t: "Okouzlen [CZTerrain(root_capital,'I')|l]"
 ep3_governor_yearly.3080.t_sea: "Okouzlen mořem"
 ep3_governor_yearly.3080.intro: "Mnoho dní cesty dělí [root_capital.GetName], mé velitelství, od [liege.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_G')]."
 ep3_governor_yearly.3080.desc_faction: "Přesto, moje hlášení o shromažďování [rebel_faction.GetName] by mělo dávno dorazit k [liege.Custom('CZ_TitledFirstName_D')]!\n\n„Všechny armády hlavního města a ani jeden volný voják...“ obává se [captain.GetName], můj důstojník. „Ani jeden voják neprojde kolem rebelů živý...“\n\nNa mém vzdáleném stanovišti doutnají ohně neklidu. A bez nových vojsk mohou hořet jen jasněji."
 ep3_governor_yearly.3080.desc: "Dlouho jsem [Select_CString(ROOT.Char.IsFemale,'očekávala','očekával')] příchod luxusního zboží, platů, potřebných k udržení loajality [ROOT.Char.GetPrimaryTitle.GetAdjective]. Ale od [liege.Custom('CZ_TitledFirstName_G')] nic nepřichází.\n\n„Ztracené někde,“ odhaduje můj důstojník, [captain.GetName]. „Ukradeno lupičům? Uvízlo v nějakém drsném místě? Možná bylo zboží prodáno domorodcům?“\n\nAť už je tomu jakkoli... těžko budu vládnout [liege.GetPrimaryTitle.GetAdjective] velkosti jako [Select_CString(ROOT.Char.IsFemale,'nějaká zbídačená vyvrhelka','nějaký zbídačený vyvrhel')] v daleké zemi."
 ep3_governor_yearly.3080.a: "Musíme pomalu vybudovat soběstačnost."
 ep3_governor_yearly.3080.b: "[ROOT.Char.GetFaith.HighGodName], vysvoboď mě z tohoto #EMP prokletého#! jmenování!"
 ep3_governor_yearly.3080.c: "Pojď, [captain.GetFirstNameNoTooltip]: vyřešíme to sami."
 ep3_governor_yearly.3080.c.success: "Rebelové jsou potlačeni"
 ep3_governor_yearly.3080.c.fail: "Vztahy zůstávají... napjaté"
 ep3_governor_yearly.3080.c.crit_fail: "Tvé vojsko padne do léčky a je zdecimováno"
 ep3_governor_yearly.3080.d: "Pojď, [captain.GetFirstNameNoTooltip]: získáme zpět, co bylo ztraceno."
 ep3_governor_yearly.3080.d.success: "Zásoby jsou rychle zajištěny"
 ep3_governor_yearly.3080.d.fail: "Nic nenalezeno"
 ep3_governor_yearly.3080.d.crit_fail: "Pronásledování, katastrofy... a stále nic"
 ep3_governor_yearly.3080.e: "Jsem si jistý, že všechno bude #EMP v pořádku.#!"
 ep3_anxious_for_new_assignment_modifier: "Touha po novém pověření"
 ep3_anxious_for_new_assignment_modifier_desc: "Silná touha po slávě, vlivu — čemukoli, jen ne po špinavé správě — definuje tohoto úředníka.\n[Concept('governor_efficiency','Efektivita guvernéra')|E]: @governor_efficiency!#N -5%#!"
 ep3_invested_in_power_center_modifier: "Výnosné investice"
 ep3_invested_in_power_center_modifier_desc: "Tato rodina se obklopuje vzkvétajícími majetky."
 ep3_cosmopolitan_domicile_modifier: "Kosmopolitní sídlo"
 ep3_cosmopolitan_domicile_modifier_desc: "Sídlo této rodiny je centrem politického a finančního vlivu."
 custom.every_realm_vassal_local_estate: "Každý [Concept('vassal','vazal')|E], jehož [Concept('domicile','domicil')|E] se nachází ve vašem [Concept('domain','doméně')|E]"
 custom.every_vassal_same_domicile_location: "Každý další [Concept('vassal','vazal')|E], jehož [Concept('domicile','domicil')|E] je na stejném místě jako tvůj"
 ep3_governor_yearly.3090.t: "Srdce [liege.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')]"
 ep3_governor_yearly.3090.desc: "[Select_CString(ROOT.Char.IsFemale,'Viděla','Viděl')] jsem vojáky táhnout mrzutě k hranicím. [Select_CString(ROOT.Char.IsFemale,'Slyšela','Slyšel')] jsem úředníky, kteří se obávají svých vzdálených vyslání, stěžovat si na hrubé cizí písně a nevkusné, mdlé večeře...\n\nV [root_capital.GetName] není nic z toho mojí starostí. Záležitosti [liege.GetPrimaryTitle.GetTierAsName] samotného procházejí mým "
 ep3_governor_yearly.3090.landed: "[ROOT.Char.GetPrimaryTitle.GetTierAsName] – obchodujeme se zbožím hodným králů, udržujeme styky v paláci [liege.Custom('CZ_TitleAsName_G')] a v politice říše máme velkou váhu.\n\nJak dobré je sloužit v samém srdci tohoto velkého a prosperujícího celku."
 ep3_governor_yearly.3090.unlanded: "dveře sídla — vstupujeme, samozřejmě, jen s vytříbenou zdvořilostí. Tímto nejsou mí příbuzní nikdy daleko od záležitostí říše.\n\nJaké je to dobré žít v srdci toho velkého, prosperujícího celku."
 ep3_governor_yearly.3090.a: "Mohl bych zprostředkovat přístup do síní moci..."
 ep3_governor_yearly.3090.a.flavor: "...ale ti méně propojení mi budou muset zaplatit vysokou cenu."
 ep3_governor_yearly.3090.b: "Bylo by rozumné rozšířit naše místní investice."
 ep3_governor_yearly.3090.c: "Mám chuť na hostinu!"
 ep3_governor_yearly.3090.c.flavor: "Samozřejmě s místními hosty politického významu!"
 ep3_ignoring_realm_decline_modifier: "Ignorování potíží říše"
 ep3_ignoring_realm_decline_modifier_desc: "V reakci na špatné řízení říše... se tato postava emocionálně distancuje."
 ep3_ignoring_realm_decline_tooltip: "#weak [Concept('governor_efficiency','Efektivita guvernéra')|E]: #N -5%#!#!"
 ep3_ignoring_realm_decline_years_tooltip: "Na #high 10 let#! ztratíš #N -5%#! [Concept('governor_efficiency','efektivity guvernéra')|E]"
 ep3_following_governorship_example_tooltip: "Každý další [Concept('vassal','vazal')|E] [liege.Custom('CZ_ShortUIName_G')] získá #high 10#! [Concept('trait_level_track_xp','zkušenosti rysu')|E] v [GetTrait('governor').GetName( root_scope )] [Concept('trait','ryse')|E]"
 ep3_governor_yearly.3100.t: "Náš [liege.GetPrimaryTitle.GetTierAsNameNoTooltip], Pandemonium"
 ep3_governor_yearly.3100.intro_liege: "„Nařizuje #EMP co#!?“ vyprsknu. #EMP „Co mi to náš lenní pán přikazuje?!?“#!"
 ep3_governor_yearly.3100.intro_governors: "„Ti k ničemu úředníci odmítají #EMP co?#!“ vykoktám. #EMP „Co neudělají pro našeho pána?!?“#!"
 ep3_governor_yearly.3100.desc: "\n\n[messenger.GetFirstName|U], posel, koktá: „[liege.Custom('FormalComplimentAdjective')] a vytrvalý [liege.GetTitledFirstNameRegnal], s ohledem na zdraví svého [liege.GetPrimaryTitle.GetTierAsName], nařizuje, aby všichni dělníci, všichni sluhové byli zdaněni—“\n\nUž nemohu dál poslouchat."
 ep3_governor_yearly.3100.desc_liege_debt: "[Select_CString(liege.IsFemale,'Ta','Ten')] [liege.Custom('InsultNoun')] a [Select_CString(liege.IsFemale,'její','jeho')] okázale ozdobení, kašmírem odění kumpáni už vyždímali [liege.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_A')] ze všech bohatství! S jejich novými plány budou jedině hladovět a ničit..."
 ep3_governor_yearly.3100.desc_liege_skill: "[liege.Custom('quirk_neg_adverb')|U] se [Select_CString(liege.IsFemale,'ta','ten')] [liege.Custom2('InsultNoun', ROOT.Char)] obrací na nás ministry a žádá to, co [Select_CString(liege.IsFemale,'sama','sám')] nedokáže zajistit – výnosy rozumné vlády!\n\n[liege.GetPrimaryTitle.GetNameNoTierNoTooltip|U] je bez naděje..."
 ep3_governor_yearly.3100.desc_governors: "Takové základní, #EMP základní#! přání! Musí [liege.GetTitleAsNameNoTooltip] prosit své úředníky, aby dělali #EMP cokoli?#! Cokoli, jen ne pošlapat plody říše?\n\n[liege.GetPrimaryTitle.GetNameNoTier|U] je zamořen hlupáky..."
 ep3_governor_yearly.3100.a: "Zdá se, že musím učit vládnutí."
 ep3_governor_yearly.3100.b: "Můj pán musí napravit toto zlé řízení!"
 ep3_governor_yearly.3100.b.success: "Tvůj dopis působí nesmírně přesvědčivě"
 ep3_governor_yearly.3100.b.fail: "[liege.GetTitleAsNameNoTooltip] je uražen"
 ep3_governor_yearly.3100.c: "Z nepořádku plyne zisk."
 ep3_governor_yearly.3100.c.flavor: "V těchto zkorumpovaných časech, kdo si všimne trochu více korupce?"
 ep3_governor_yearly.3100.d: "Nemohu napravit tento bídný stav věcí..."
 ep3_governor_yearly.3100.d.flavor: "Těžko je snesu i jen pomyslet na ně..."
 msg_governor_upset_about_skill.t: "[root_scope.GetTitleAsNameNoTooltip] odsuzuje správu"
 msg_governor_upset_about_skill.desc: "Tvůj [Concept('vassal','vazal')|E] je nespokojený s tvými slabými [Concept('skills','dovednostmi')|E]."
 msg_governor_upset_about_governance.t: "[root_scope.GetTitleAsNameNoTooltip] odsuzuje režim"
 msg_governor_upset_about_governance.desc: "Tvůj [Concept('vassal','vazal')|E] je nespokojený s tvými slabými [Concept('skills','dovednostmi')|E] nebo [Concept('governor_efficiency','efektivitou guvernéra')|E]."
 msg_governor_upset_about_insolvency.t: "[root_scope.GetTitleAsNameNoTooltip] kritizuje insolventnost"
 msg_governor_upset_about_insolvency.desc: "Tvého [Concept('vassal','vazala')|E] postihl tvůj dluh ve [Concept('gold','zlatě')|E]."
 msg_governor_upset_about_bad_govs.t: "[root_scope.GetTitleAsNameNoTooltip] pohrdá neschopnými ministry"
 msg_governor_upset_about_bad_govs.desc: "Tvůj [Concept('vassal','vazal')|E] si stěžuje na nízkou [Concept('governor_efficiency','efektivitu guvernérů')|E] mezi svými kolegy."
