l_polish:
 ep3_governor_yearly.8010.opening: "[governor.Custom2('AppropriateGreeting', ROOT.Char)]"
 ep3_governor_yearly.8010.desc: "Velmi [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitledFirstNameNoTooltip], vidím příležitost posílit zájmy [ROOT.Char.GetHouse.GetBaseName] stejně jako zájmy mého rodu [governor.GetHouse.GetBaseName].\n\nVýměnou za"
 ep3_governor_yearly.8010.hook: "slib, na který se v budoucnu mohu obrátit,"
 ep3_governor_yearly.8010.candidacy: "podpora mého jmenování na úkor [their_title.Custom('CZ_LandedNameNoTier_G')],"
 ep3_governor_yearly.8010.candidacy_heir: "podporu jmenování [Select_CString(their_title_receiver.IsFemale,'mé','mého')] [governor.Custom2('CZ_RelationToMeShort_G', SCOPE.sC('their_title_receiver'))|l] [their_title_receiver.Custom('CZ_FirstName_G')] do čela [their_title.Custom('CZ_LandedNameNoTier_G')],"
 ep3_governor_yearly.8010.influence: "tvé dobré slovo u císařského dvora"
 ep3_governor_yearly.8010.gold: "hmotné znamení dobré vůle"
 ep3_governor_yearly.8010.end: "Byl bych ochoten učinit vlastní oběť."
 ep3_governor_yearly.8010.a: "Služba za službu."
 ep3_governor_yearly.8010.b: "Dobrá nabídka, kdyby byla obrácena."
 ep3_governor_yearly.8010.b.success: "Přijímá tvůj návrh"
 ep3_governor_yearly.8010.b.failure: "Nemá zájem"
 ep3_governor_yearly.8010.c: "To nepotřebuji."
 ep3_governor_yearly.8020.t: "Provincionální vliv"
 ep3_governor_yearly.8020.desc: "Mezi množstvím drobných statků, vesnic a měst mého [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] působí rodové sídlo rodu [estate_owner.GetHouse.GetBaseName] tak trochu jako výjimka.\n\nFormálně soukromý majetek [estate_owner.Custom('CZ_TitledFirstName_G')] se těší mé ochraně, neboť jsem [ROOT.Char.GetTitleAsNameNoTooltip|l] [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')]. A [Select_CString(estate_owner.IsFemale,'její','jeho')] povýšená lhostejnost k mé štědrosti se může rychle změnit ve vděčnost, když se obratně naznačí, že by o ni [Select_CString(estate_owner.IsFemale,'mohla','mohl')] přijít..."
 ep3_governor_yearly.8020.a: "Udržování silnic v bezpečí je #EMP tak#! drahé v dnešní době."
 ep3_governor_yearly.8020.success: "Pochopí, kam míříš"
 ep3_governor_yearly.8020.b: "Velké úsilí, které vynakládám, by mělo být odměněno."
 ep3_governor_yearly.8020.c: "Moje štědrost v této záležitosti by si zasloužila větší pozornost."
 ep3_governor_yearly.8020.d: "Nemohl bych poškodit tak nádherné panství."
 ep3_governor_yearly_8020_failure_tt: "Pokud odmítnou:"
 ep3_governor_yearly.8020.failure: "Odmítne tvůj požadavek"
 ep3_governor_yearly.8020.reason: "Přijetí částečně závisí na povaze [estate_owner.Custom('CZ_FirstName_G')]"
 ep3_governor_yearly.8030.t: "Nezamýšlená laskavost"
 ep3_governor_yearly.8030.desc: "Má rodina a já jsme dlouho — byť poněkud sporně — přesvědčovali stížnostné místní a úředníky, že rozvoj panství [ROOT.Char.GetHouse.GetBaseName] v [estate.GetLocation.GetBaronyNameExplicitlyNoTooltip] prospívá všem obyvatelům [estate.GetLocation.GetTitle.GetDeJureLiege.Custom('CZ_LandedNameNoTier_G')], pokud už ne celému [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]!\n\nJakým podivným šťastným zásahem osudu to nevím — ale je to skutečně pravda!"
 ep3_governor_yearly.8030.martial: "Přítomnost mých stráží odrazila obvyklé bandity; jejich nepřítomnost je velkým přínosem pro širší okolí."
 ep3_governor_yearly.8030.agriculture: "Zemědělské zlepšení mých pozemků inspirovalo malé držitele, jejichž úsilí je velkým přínosem pro širší okolí."
 ep3_governor_yearly.8030.commerce: "Obchodní příležitosti přilákaly mnoho kupců, jejichž přítomnost je velkým přínosem pro širší okolí."
 ep3_governor_yearly.8030.fallback: "Rozšíření panství přilákalo různé řemeslníky, jejichž přítomnost je velkým přínosem pro širší okolí."
 ep3_governor_yearly.8030.a: "Vypadá to jako #EMP zisk#!, který lze inkasovat."
 ep3_governor_yearly.8030.b: "Místní rozvoj by měl být podporován."
 ep3_governor_yearly.8030.c: "Jednou příznivá náhoda."
 ep3_governor_yearly.8040.t: "Dynastická rozptýlení"
 ep3_governor_yearly.8040.desc: "[Select_CString(complainant.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', complainant)|l] [complainant.GetFirstName], [complainant.GetTitleAsNameNoTooltip|l] [complainant.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')], [Select_CString(complainant.IsFemale,'přijela','přijel')] do sídla [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] s ‚naléhavou‘ záležitostí.\n\n„[complainant.Custom2('RelationToMeShort', ROOT.Char)|U], vím, že se musíš starat o vlastní záležitosti stejně jako o [ROOT.Char.GetPrimaryTitle.GetNameNoTier], ale obávám se, že sídlo rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip] odvádí od [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] příliš tvé pozornosti – i peněz...“\n\n„Se správou provincie je práce dost i bez toho, aby tě rozptylovalo tvé sídlo.“"
 ep3_governor_yearly.8040.a: "Předpokládám, že mé [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] by si zasloužilo více pozornosti."
 ep3_governor_yearly.8040.b: "Ó prosím, [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] se prakticky řídí samo!"
 ep3_governor_yearly.8040.c: "Možná by #EMP vy#! měl napravit nedostatky, [complainant.GetTitleAsNameNoTooltip]."
 ep3_governor_yearly.8040.d: "Naznačujete #EMP, že#! spravování obojího přesahuje mé schopnosti?"
 ep3_governor_yearly.8040.d.success: "Dokážete to zvládnout"
 ep3_governor_yearly.8040.d.failure: "Jsi [Select_CString(ROOT.Char.IsFemale,'příliš neschopná','příliš neschopný')] na to, abys [Select_CString(ROOT.Char.IsFemale,'zvládla','zvládl')] obojí"
 ep3_governor_yearly.8050.t: "Nepřítel u bran"
 ep3_governor_yearly.8050.desc: "Od nejposlednějšího úředníka až po samotného [war_liege.GetTopLiege.Custom('CZ_TitleAsNameNoTooltip_A')] se celé [war_liege.GetPrimaryTitle.GetTierAsNameNoTooltip|l] napíná, aby ubránilo [target_title.Custom('CZ_LandedNameNoTier_A')] před [war_attacker.GetPrimaryTitle.Custom('CZ_LandedName_I')]. Pro mě jako pro [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_A')] [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] je ta hrozba až příliš skutečná –"
 ep3_governor_yearly.8050.kingdom: "velká část obrany regionu padá na mě."
 ep3_governor_yearly.8050.neighbour: "pokud nebudou zastaveni, mohou vetřelci zatlačit až do [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.Custom('CZ_LandedNameNoTier_G')]."
 ep3_governor_yearly.8050.end: "\n\nPlním svou roli, obsazuji posádky, opravují opevnění, verbuji vojáky, ale stále lze udělat více. Jakákoli pomoc by byla značně oceněna v [war_liege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]..."
 ep3_governor_yearly.8050.a: "Císařova vojska potřebují všechny muže, které dokážeme sesbírat!"
 ep3_governor_yearly.8050.b: "Obrana [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] má mezery..."
 ep3_governor_yearly.8050.c: "...a je #EMP odsouzená#! bez dalších zdrojů."
 ep3_governor_yearly.8050.d: "Všechno je pod kontrolou."
 ep3_governor_yearly.8060.t: "Lákavé pokladnice"
 ep3_governor_yearly.8060.desc: "Jako [ROOT.Char.GetTitleAsNameNoTooltip|l] [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] mám byrokratický aparát [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] plně k dispozici – včetně nenápadné pokladnice v srdci sídla [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip].\n\nDrobní úředníci tam chodí ve dne v noci, vyměňují císařské zlato za stvrzenky a odvážejí ho na žold posádkám, na opravy budov, na chleba pro chudé... a kdovíco ještě.\n\nJako #EMP [ROOT.Char.GetTitleAsNameNoTooltip|l]#! mám přece #EMP své#! potřeby a potřeby [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] jedny a tytéž... nebo ne?"
 ep3_governor_yearly.8060.a: "Nikdo si nevšimne nějakých dalších požadavků."
 ep3_governor_yearly.8060.b: "Špatné čísla, zaokrouhlovací chyby, to se stává..."
 ep3_governor_yearly.8060.c: "A tak se o potřeby [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] musím podělit #EMP já#!."
 ep3_governor_yearly.8060.d: "Úředníci vědí, co dělají."
 ep3_governor_yearly.8060.a.success: "Zmizení zůstane bez povšimnutí"
 ep3_governor_yearly.8060.a.failure: "Někdo postrádá minci"
 ep3_governor_yearly.8060.a.failure_tt: "@warning_icon! #N Bude zpochybněno, kde se nachází [Concept('gold','zlato')|E]#!"
 ep3_governor_yearly.8060.embezzle_tt: "Pokladna vykradena"
 ep3_governor_yearly.8060.efficiency_tt: "Na 10 let: Efektivita [Concept('governor','guvernéra')|E]: #N -5%#!"
 ep3_otherwise_tt: "Jinak:"
 ep3_governor_yearly.8062.desc: "Už když [Select_CString(complainant.IsFemale,'mě poprvé požádala','mě poprvé požádal')] o schůzku kvůli #EMP účtům#!, [Select_CString(ROOT.Char.IsFemale,'věděla','věděl')] jsem, že je zle. [Select_CString(ROOT.Char.IsFemale,'Snažila','Snažil')] jsem se [Select_CString(complainant.IsFemale,'ji','ho')] odbýt, ale nakonec jsem [Select_CString(ROOT.Char.IsFemale,'svolila','svolil')] ke schůzce se [Select_CString(complainant.IsFemale,'svou','svým')] [ROOT.Char.Custom2('CZ_RelationToMeShort_I', complainant)|l] [complainant.Custom('CZ_FirstName_I')].\n\nProjde se mnou všechno: chybějící zlato, chybné zápisy, ztracené stvrzenky... Nakonec uzavře: „Prostě to nechápu, jediné vysvětlení je zlodějský úředník!“\n\nChvíli se rozhlíží po mých síních, pak se na mě zvláštně podívá a, ve snaze skrýt šok, jen naznačí rty: „Leda že by...“"
 ep3_governor_yearly.8062.a: "To vše se dá vysvětlit."
 ep3_governor_yearly.8062.a.success: "Přijme výmluvu"
 ep3_governor_yearly.8062.a.failure: "Odhalí tvou zkaženost"
 ep3_governor_yearly.8062.b: "Není třeba o tom ani slovo."
 ep3_governor_yearly.8062.b.success: "Pochopí narážku"
 ep3_governor_yearly.8062.b.failure: "$ep3_governor_yearly.8062.a.failure$"
 ep3_governor_yearly.8062.c: "Podívejte, vezměte si svůj díl a mlčte."
 ep3_governor_yearly.8062.c.success: "Vezme úplatek"
 ep3_governor_yearly.8062.c.failure: "$ep3_governor_yearly.8062.a.failure$"
 ep3_governor_yearly.8062.d: "Jednoduchá chyba, zlato bude vráceno..."
 ep3_governor_yearly.8070.t: "Práce guvernéra"
 ep3_governor_yearly.8070.desc: "Pocty, prestiž, moc. To vše může přinést úřad [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')], ale #EMP něco#! to stojí...\n\nHory [ROOT.Char.Custom('GetWritingMaterial')|l] se kroutí a čekají na mou pečeť nebo aspoň letmý pohled, zatímco nekonečné zástupy úředníků soupeří o to, kdo mi bude dřív plnit uši otupujícími podrobnostmi.\n\nNikdo mi neřekl, že toho bude #EMP tolik#! – a navíc práce, která by se nakonec stejně udělala sama."
 ep3_governor_yearly.8070.a: "Mohu to vše vyřídit, jen se musím soustředit."
 ep3_governor_yearly.8070.b: "Najmutá pomoc by ulehčila břemeno."
 ep3_governor_yearly.8070.c: "Tohle je práce pro úředníky, ne pro #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#!!"
 ep3_governor_yearly.8080.t: "Zlovolný úředník"
 ep3_governor_yearly.8080.desc: "V sídle [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitly] se v poslední době množí obvinění z korupce a mnoho lidí přišlo s konkrétními stížnostmi na [Select_CString(magistrate.IsFemale,'jednu','jednoho')] z hlavních soudců – [Select_CString(magistrate.IsFemale,'ženu','muže')] jménem [magistrate.GetFirstName].\n\n[Select_CString(magistrate.IsFemale,'Byla předvedena','Byl předveden')] přede mě, aby se z obvinění [Select_CString(magistrate.IsFemale,'zodpověděla','zodpověděl')]: mimo jiné z toho, že za i ty nejzákladnější úkony žádá nehorázné úplatky.\n\n„Po pravdě, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]...“ zachrčí, „to je všechno jen nedorozumění!“"
 ep3_governor_yearly.8080.a: "Vrátíte tyto úplatky a budete zbaven úřadu."
 ep3_governor_yearly.8080.b: "Taková zvířata jako vy potřebují #EMP skutečný#! odstrašující prostředek."
 ep3_governor_yearly.8080.c: "Může to být přehlédnuto, pokud budou platby... přerozděleny."
 ep3_governor_yearly.8080.d: "Uhradíte svůj dluh mou službou... #EMP [magistrate.GetFirstNameNoTooltip]#!."
 ep3_governor_yearly.8090.t: "Zlomyslná politika"
 ep3_governor_yearly.8090.desc: "Neúnavný mlýn císařských jmenování a odvolávání mě možná na čas postavil do čela [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] [ROOT.Char.GetPrimaryTitle.GetName], ale není tajemstvím, že [old_holder.GetTitledFirstName] touží, aby se vrátilo do rukou rodu [old_holder.GetHouse.GetBaseName].\n\nGuvernéři samozřejmě na své dřívější úřady nemají nárok – aspoň ne podle zákona – ale pletichy, které [old_holder.GetFirstNameNoTooltip] spřádá v sídle [ROOT.Char.GetTopLiege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], mi stále přidělávají starosti..."
 ep3_governor_yearly.8090.a: "Vymyslet problémy, které po sobě zanechal rod [old_holder.GetHouse.GetBaseNameNoTooltip]."
 ep3_governor_yearly.8090.a.success: "Rod [old_holder.GetHouse.GetBaseNameNoTooltip] ztratí tvář"
 ep3_governor_yearly.8090.a.failure: "Tvé lži nikdo nebere vážně"
 ep3_governor_yearly.8090.b: "Možná se s [Select_CString(old_holder.IsFemale,'ní','ním')] dá rozumně domluvit."
 ep3_governor_yearly.8090.c: "Nějaké odškodné by [Select_CString(old_holder.IsFemale,'ji','ho')] mohlo umlčet."
 ep3_governor_yearly.8090.d: "Pche, ať si [Select_CString(old_holder.IsFemale,'ta ženská','ten chlap')] dělá, co chce!"
 ep3_governor_yearly.8100.t: "Sousedův [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]"
 ep3_governor_yearly.8100.desc: "V dnešní poště ze sídla [ROOT.Char.GetTopLiege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] jsem se k svému pobouření [Select_CString(ROOT.Char.IsFemale,'dočetla','dočetl')], že [governor.GetFirstName], [governor.GetTitleAsNameNoTooltip|l] sousedního [governor.GetPrimaryTitle.GetTierAsNameNoTooltip|l] [governor.GetPrimaryTitle.GetName], otevřeně vychvaluje, jak by se pro #EMP můj#! úřad [Select_CString(governor.IsFemale,'hodila','hodil')] [Select_CString(SCOPE.sC('neighboring_promoted_char').IsFemale,'její','jeho')] [governor.Custom2('RelationToMeShort',SCOPE.sC('neighboring_promoted_char'))|l]!\n\nZdá se, že [Select_CString(governor.IsFemale,'ta','ten')] [governor.Custom2('InsultNoun', ROOT.Char)] dychtí po mé provincii a celé dny v sídle [governor.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] kuje pikle, jak mě vystrnadit z mého sídla ([ROOT.Char.Custom('FortifiedBuilding')|l])..."
 ep3_governor_yearly.8100.a: "#EMP Ach#! Dva si toho mohou zahrát!"
 ep3_governor_yearly.8100.b: "Toto drzé spiknutí musí být odsouzeno."
 ep3_governor_yearly.8100.c: "Cože? Ten blázen by nedokázal spravovat ani klášter."
 ep3_governor_yearly.8100.d: "Takové malicherné pletichy jsou pod důstojnost [governor.Custom('CZ_TitleAsNameNoTooltip_G')]."
 ep3_governor_yearly.8110.t: "Svářliví vrstevníci"
 ep3_governor_yearly.8110.desc: "V poslední době obíhají zvěsti o rostoucím nespokojení mezi mými sousedními guvernéry, [governor_1.GetTitledFirstName] a [governor_2.GetTitledFirstName], kteří teď otevřeně kritizují schopnosti a chování toho druhého.\n\nTo by mohla být příležitost prosadit své zájmy, zatímco rody [governor_1.GetHouse.GetBaseName] a [governor_2.GetHouse.GetBaseName] jsou rozptýlené..."
 ep3_governor_yearly.8110.a: "Nějaké falešné fámy by to snadno vyostřily."
 ep3_governor_yearly.8110.a.success: "Fámy se ujmou"
 ep3_governor_yearly.8110.a.failure: "Tvé lži někdo vystopuje"
 ep3_governor_yearly.8110.a.failure_tt: "[governor_1.GetFirstName] a [governor_2.GetFirstName] ztratí #N 25#! [Concept('opinion','mínění')|E] vůči vám"
 ep3_governor_yearly.8110.b: "[governor_1.GetFirstNameNoTooltip] má zjevně pravdu."
 ep3_governor_yearly.8110.c: "Odmítám věřit slovu proti [governor_2.Custom('CZ_FirstNameNoTooltip_D')]."
 ep3_governor_yearly.8110.d: "Výzva k jednotě zvýrazní jejich pošetilost."
 ep3_governor_yearly.8110.d.tt: "[governor_1.GetFirstName] a [governor_2.GetFirstName] ztratí #N 15#! [Concept('opinion','mínění')|E] vůči vám"
 ep3_governor_yearly.8120.t: "Tak chce [ROOT.Char.GetFaith.HighGodName]"
 ep3_governor_yearly.8120.desc: "Dnes mě zastihla hrozná zpráva o strašlivé pohromě v mém [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]:"
 ep3_governor_yearly.8120.earthquake: "malé, ale silné zemětřesení srovnalo se zemí řadu odlehlých osad v [disaster_county.Custom('CZ_LandedNameNoTier_L')],"
 ep3_governor_yearly.8120.storm: "zuřivá bouře srovnala se zemí řadu odlehlých osad v [disaster_county.Custom('CZ_LandedNameNoTier_L')],"
 ep3_governor_yearly.8120.ending: "pohřbívající domovy, veřejné budovy a životy...\n\nRychle si připomínám, že jako [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] jsem konečně odpovědný za tyto lidi a místa."
 ep3_governor_yearly.8120.a: "Osobně dohlédnu na pomoc lidem."
 ep3_governor_yearly.8120.a.success: "Tvé úsilí se vyplatí"
 ep3_governor_yearly.8120.a.failure: "Snaha končí katastrofou"
 ep3_governor_yearly.8120.b: "Oběti budou podpořeny."
 ep3_governor_yearly.8120.c: "Jakkoli to bolí, musíme přijmout vůli, kterou projevil [ROOT.Char.GetFaith.HighGodName]."
 ep3_governor_yearly.8130.t: "Chamtivost a příležitost"
 ep3_governor_yearly.8130.desc: "Jako [Select_CString(ROOT.Char.IsFemale,'jmenovaná','jmenovaný')] [ROOT.Char.GetTitleAsNameNoTooltip|l] [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] jsem nástrojem [ROOT.Char.GetTopLiege.Custom('CZ_TitleAsNameNoTooltip_G')] s plnou mocí nad úřady, poddanými a samozřejmě i #EMP daněmi#! svého [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l].\n\nKdyž tak přemýšlím o financích provincie, napadá mě, že by bylo zcela v mé pravomoci zavést novou drobnou dávku – samozřejmě jen pro dobro [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip|l]..."
 ep3_governor_yearly.8130.a: "Bohužel, #EMP nějaké#! dodatečné příspěvky #EMP jsou#! na místě..."
 ep3_governor_yearly.8130.b: "Stačí drobný výběr."
 ep3_governor_yearly.8130.c: "Chudým v [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')] by se pomoc hodila."
 ep3_governor_yearly.8130.d: "[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] není moje soukromá pokladna!"
 ep3_governor_yearly.8140.t: "Prověrka domu [estate_owner.GetHouse.GetBaseNameNoTooltip]"
 ep3_governor_yearly.8140.desc: "Přivedli ke mně rolníka [CZPrepZ(estate_county.GetNameNoTierNoTooltip)] [estate_county.Custom('CZ_LandedNameNoTier_G')], který přednáší dlouhý výčet stížností své obce na nedaleké sídlo rodu [estate_owner.GetHouse.GetBaseName] ([estate.GetLocation.GetBaronyNameExplicitly]).\n\n„Ať tě [peasant.GetFaith.HighGodName] žehná, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]. Páni z místního sídla nám rabují půdu, nepouštějí nás na obecní pastviny a vymáhají daně – a to všechno pod hrozbou násilí!“"
 ep3_governor_yearly.8140.a: "Skandální, to bude napraveno!"
 ep3_governor_yearly.8140.b: "Zprostředkuji dohodu pro obě strany."
 ep3_governor_yearly.8140.c: "[estate_owner.GetTitledFirstNameNoTooltip] může dělat, co se mu zlíbí, rolníku."
 ep3_governor_yearly.8140.d: "Škoda, ale nemohu nic dělat."
 ep3_governor_yearly.8150.t: "Narůstající neklid"
 ep3_governor_yearly.8150.desc: "Nespokojenost pohlcuje [rebel_county.GetNameNoTier] a lidé jsou stále více neklidní. [Select_CString(ROOT.Char.IsFemale,'Ztratila','Ztratil')] bych mnoho tváře, kdyby byla má [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] ohrožena povstáním...\n\n[Select_CString(SCOPE.sC('marshal').IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('marshal'))], [marshal.GetFirstName], unaveně čte nahlas hlášení o zbraních ukradených z obecních armerií, zadržovaných daních a útocích na nepoškozené hlídky.\n\n„Něco #EMP musí#! být s těmito"
 ep3_governor_yearly.8150.culture: "[targeting_faction.MakeScope.Var('faction_culture').Culture.GetName] výtržníků!„"
 ep3_governor_yearly.8150.faith: "[targeting_faction.MakeScope.Var('faction_faith').Faith.GetName] fanatiků!„"
 ep3_governor_yearly.8150.peasant: "zatracených rolníků, [ROOT.Char.GetTitleAsNameNoTooltip]!„"
 ep3_governor_yearly_8150.end: "zavrčí."
 ep3_governor_yearly.8150.a: "Stačí zneškodnit hlavu hada, [marshal.GetFirstNameNoTooltip]."
 ep3_governor_yearly.8150.a.success: " Rychle utichnou"
 ep3_governor_yearly.8150.a.failure: " Tvé úplatky je jen rozzlobí"
 ep3_governor_yearly.8150.b: "Symbolické ústupky nebo dva a půjdou domů."
 ep3_governor_yearly.8150.c: "Ano, musí být dán příklad."
 ep3_governor_yearly.8150.d: "Ti rváči se brzy začnou nudit."
 ep3_governor_yearly.8150.d.tt: "Obdrží #V 2#! [Concept('regiments','pluky')|E] [Concept('skirmisher','harcovníků')|E] při vyhlášení [Concept('war','válce')|E]"
 ep3_governor_yearly.8150.county_tt: "Každé [Concept('county','hrabství')|E] [Concept('faction','frakce')|E] [targeting_faction.GetName] a [Concept('counties','hrabství')|E], která se mohou přidat ([SCOPE.ScriptValue('ep3_governor_yearly_8150_total_count_value')|V0])"
 ep3_governor_yearly_8150_troop_name: "Vzpouření rolníků"
 cultural_acceptance_ep3_governor_yearly_8150_crackdown: " [Concept('governor','Guvernér')|E] potlačil místní povstalce"
 ep3_governor_yearly.8160.t: "Rovný přístup"
 ep3_governor_yearly.8160.desc: "[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U] je zemí mnoha lidů a mnoha vyznání. Jako [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetPrimaryTitle.GetAdjective] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] jsem odpovědný za cizince a heretiky, stejně jako za [ROOT.Char.GetTopLiege.GetCulture.GetCollectiveNounNoTooltip].\n\n[Select_CString(SCOPE.sC('councillor').IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))], [councillor.GetFirstName], nemá zábrany prohlašovat: „byrokracie je doménou"
 ep3_governor_yearly.8160.culture_end: "[ROOT.Char.GetTopLiege.GetCulture.GetCollectiveNounNoTooltip] — a jakékoli volání po větším zapojení [minority_county.GetCountyData.GetCulture.GetCollectiveNounNoTooltip] musí být uhašeno!„"
 ep3_governor_yearly.8160.faith_end: "[ROOT.Char.GetTopLiege.GetCulture.GetCollectiveNounNoTooltip] — a jakékoli volání po větším zapojení [CZAdherentPl_G(minority_county.GetCountyData.GetFaith)|l] [councillor.Custom2('GetUnbelieverTerm', administrator)] musí být uhašeno!„"
 ep3_governor_yearly.8160.a: "Větší síť chytí více ryb."
 ep3_governor_yearly.8160.b: "Máte pravdu, musí znát své místo."
 ep3_governor_yearly.8160.culture_county_tt: "Každé [Concept('county','hrabství')|E] s kulturou [minority_county.GetCountyData.GetCulture.GetName]"
 ep3_governor_yearly.8160.faith_county_tt: "Každé [Concept('county','hrabství')|E] s [CZFaithAdjDecline(minority_county.GetCountyData.GetFaith,'ou')|l] vírou"
 ep3_governor_yearly.8160.culture_councillor: "[ROOT.Char.GetTopLiege.GetCulture.GetCollectiveNounNoTooltip] — a [councillor.GetCulture.GetCollectiveNounNoTooltip] samozřejmě —"
 ep3_governor_yearly.8160.culture_self: "[ROOT.Char.GetTopLiege.GetCulture.GetCollectiveNounNoTooltip] — no a samozřejmě i [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] —"
 ep3_governor_yearly.8160.culture: "[ROOT.Char.GetTopLiege.GetCulture.GetCollectiveNounNoTooltip],"
 ep3_governor_yearly.8160.faith: "dobří [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip],"
 ep3_governor_yearly.8160.d: "Nevidím důvod cokoli měnit."
 ep3_governor_yearly.8160.courtier_tt: "Najmete [minority_county.GetCountyData.GetCulture.GetName] [minority_county.GetCountyData.GetFaith.GetAdjective] správce"
 cultural_acceptance_promoted_bureaucrats: " [Concept('governor','Guvernér')|E] povýšil cizí úředníky"
 ep3_governor_yearly.8170.t.sea: "[raider.GetPrimaryTitle.GetAdjectiveNoTooltip] nájezdy"
 ep3_governor_yearly.8170.t.land: "[raider.GetPrimaryTitle.GetAdjectiveNoTooltip] nájezdy"
 ep3_governor_yearly.8170.desc: "Odrážet nájezdy"
 ep3_governor_yearly.8170.sea: "po moři — zejména obávaných [raider.GetPrimaryTitle.GetAdjective] lupičů —"
 ep3_governor_yearly.8170.land: "mimo hranice — zejména od sousedního [raider.GetPrimaryTitle.GetAdjective] [raider.GetPrimaryTitle.GetTierAsNameNoTooltip] —"
 ep3_governor_yearly.8170.ending: "je zásadní pro obranu [ROOT.Char.GetPrimaryTitle.GetAdjective] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] a širší bezpečnost [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n[marshal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] nedávno [Select_CString(marshal.IsFemale,'přezkoumala','přezkoumal')] naše obranná opatření a [Select_CString(marshal.IsFemale,'strávila','strávil')] celé odpoledne navrhováním zlepšení z ohromného seznamu. Mezi nejdůležitější patří výstražný systém, aby vesnice měly čas na evakuaci."
 ep3_governor_yearly.8170.a: "Okamžitě zaveďte tento 'varovný systém'!"
 ep3_governor_yearly.8170.b: "Mám lepší nápad."
 ep3_governor_yearly.8170.b.success: "Tvé nápady jsou nesmírně účinné"
 ep3_governor_yearly.8170.b.failure: "Zásadně to nechápete"
 ep3_governor_yearly.8170.c: "Možná se s tímto lupičem dá rozumně jednat."
 ep3_governor_yearly.8170.c.success: "[raider.GetTitledFirstNameNoTooltip] je okouzlen"
 ep3_governor_yearly.8170.c.failure: "Tvé poselství nikdo nebere na vědomí"
 ep3_governor_yearly.8170.d: "Nájezdy jsou prostě součástí života na hranicích."
 ep3_governor_yearly.8170.modifier_tt: "Každé [Concept('county','hrabství')|E] ohrožené [raider.Custom('CZ_TitledFirstName_I')] ([THIS.Char.MakeScope.Var('threatened_counties_count').GetValue|V0])"
 ep3_governor_yearly.8170.opinion_tt: "Každý [Concept('vassal','vazal')|E] ohrožený [raider.Custom('CZ_TitledFirstName_I')] ([THIS.Char.MakeScope.Var('threatened_counties_count').GetValue|V0])"
