 ep3_interactions_events.0620.opening: "Horlivý [actor.GetFirstName],"
 ep3_interactions_events.0620.desc_byz: "V Jeho církvi Pán postavil apoštoly, učitele, divotvůrce, ty obdařené vládnutím... a v rozmanitosti jazyků.\n\nTito naši svatí hlasatelé promluví ve prospěch [actor.GetHouse.GetName]."
 ep3_interactions_events.0620.desc: "Existují způsoby, jak pohnout horami jinak než světskou silou, a prostředky k moci přesahující světskou hrubost.\n\nPro věčné spasení hleďte k [recipient.GetFaith.HighGodName]. Pro své vysvobození na zemi se může vaše rodina spolehnout na podporu našich [recipient.GetFaith.GetAdjective] duchovních."
 ep3_hof_ask_for_influence_interaction_desc: "Požádejte [recipient.GetShortUIName] o politickou pomoc; utrácením [Concept('piety','zbožností')|E] získáte [Concept('influence','vliv')|E] pro sebe a vaši [Concept('house','rod')|E]" # todo: CONCEPT CASE
 ep3_interactions_events.0620.a: "Společně, pro spravedlivou věc!"
 ep3_interactions_events.0620.b: "#EMP [recipient.GetFaith.PriestNeuterPlural|U]!#! Neexistují lepší politici."
 ep3_interactions_events.0620.c: "Zdá se, že mé modlitby budou vyslyšeny."
 ep3_interactions_events.0621.opening: "Ó škodlivé dítě,"
 ep3_interactions_events.0621.desc: "Chcete žádat ty, jejichž mysl má být věnována spáse, jejichž prací je pastýřství a vyučování, aby se vměšovali do světských záležitostí za vás?\n\nHanebná drzost!"
 ep3_interactions_events.0621.a: "Bah! Jakoby vaše zbožné ruce byly čisté!"
 depose_governor_lose_titles_tt: "@warning_icon! #X Ztratíte [recipient.GetPrimaryTitle.GetName] a všechny ostatní pozemské [Concept('titles','tituly')|E]#!" # todo: CONCEPT CASE
 ep3_interactions_events.0630.opening: "Můj [recipient.GetTitleAsName] z [recipient.GetPrimaryTitle.GetNameNoTier],"
 ep3_interactions_events.0630.desc_family: "Nařídil jsem vaše odvolání z úřadu. Pro nás sciony rodu [actor.GetHouse.GetName] už není výhodné, abyste spravoval [recipient.GetPrimaryTitle.GetNameNoTooltip].\n\nProsím, pomyslete na svou povinnost vůči rodině a složte svou úřední hůl bez rozhořčení. Vaše rodina vás očekává v [actor.GetCapitalLocation.GetTitle.GetNameNoTier]."
 ep3_interactions_events.0630.desc_spite: "Podle zákonů našeho velkého [actor.GetPrimaryTitle.GetTierAsName] je vláda udělena mou vůlí a může být odebrána podle mého potěšení.\n\nMusíte — s nejvyšší rychlostí — odstoupit z úřadu [recipient.GetPrimaryTitle.GetNameNoTooltip]. Vzdejte veškerou moc. Zapomeňte, kým jste [Select_CString(ROOT.Char.IsFemale,'byla','byl')].\n\nVáš moudrý a milostivý [actor.GetTitleAsName] to rozkazuje."
 ep3_interactions_events.0630.desc_guilt: "Se slzami v očích vám nařizuji rezignaci z vašeho postu. Službu [actor.GetPrimaryTitle.GetTierAsName] jste vykonával dobře a pilně, ale z centrál [recipient.GetPrimaryTitle.GetTierAsNameNoTooltip] to už nebude možné.\n\nVěřte, že je to vůle [recipient.GetFaith.HighGodName], stejně jako je to rozkaz vašeho [actor.GetTitleAsName]."
 ep3_interactions_events.0630.desc: "Se souhlasem celého paláce tímto ukončuji vaše působení jako [recipient.GetTitleAsNameNoTooltip]. Všechny tituly, které držíte, spolu s příjmy a poctami úřadu, musí být odevzdány.\n\nZa veškeré služby v zájmu [recipient.GetPrimaryTitle.GetTierAsNameNoTooltip] a [actor.GetPrimaryTitle.GetTierAsName] jsou vděčni jak vaši lidé, tak panovník."
 ep3_interactions_events.0630.a: "#EMP Jsem okraden! Jsem ponížen!#!"
 ep3_interactions_events.0630.b: "Jednou jmenován, a nyní odvolán."
 ep3_interactions_events.0630.c: "Ve [actor.GetPrimaryTitle.GetTierAsNameNoTooltip] se kolo osudu točí stále..."
 support_candidacy_cap_reached_tt: "Dosáhli jste svého [Concept('investment_cap','investiční kapacity')|E] ([actor.MakeScope.ScriptValue('appointment_investment_cap')|0V]) pro kandidaturu [secondary_recipient.GetShortUINamePossessive] na tento [Concept('title','titul')|E] ([target.GetNameNoTier|V])" # todo: CONCEPT CASE
 force_step_down_interaction: "Vynutit rezignaci"
 force_step_down_desc: "Využijte [Concept('influence','vliv')|E], [Concept('hook','páka')|E] nebo [Concept('secret','tajemství')|E], abyste donutili [TARGET_CHARACTER.GetShortUIName] odstoupit z [TARGET_CHARACTER.GetHerHis] [Concept('governorship','guvernérství')|E]." # todo: CONCEPT CASE
 FORCE_STEP_DOWN_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName] odstoupí z [TARGET_CHARACTER.GetHerHis] [Concept('governorship','guvernérství')|E] a bude [Select_CString(TARGET_CHARACTER.IsFemale,'nahrazena','nahrazen')]." # todo: CONCEPT CASE
 FORCE_STEP_DOWN_PROPOSAL: "Je na čase, abyste [Select_CString(ROOT.Char.IsFemale,'odstoupila','odstoupil')] z úřadu [target.GetBaseName]. Jste zcela neschopný této funkce a postarám se, aby už tam nevládl."
 loses_target_title_tt: "Odstupuje ze správy #HIGH [target.GetBaseNameNoTier]#!"
 attempted_force_step_down_opinion: "Chce, abych [Select_CString(ROOT.Char.IsFemale,'odstoupila','odstoupil')]"
 force_step_down_interaction_extra_icon: "$hook_extra_icon$"
 scheme_critical_moments.1162.t: "$scheme_critical_moments.1132.t$"
 scheme_critical_moments.1162.desc: "Vyvrcholení měsíců pečlivého intrikování se naplnilo, když [target.GetTitledFirstName] [Select_CString(target.IsFemale,'vzdala její','vzdal jeho')] post guvernéra [highest_title.GetName].\n\nDůmyslně šířené pomluvy a vhodně nastražené důkazy pošpinily [Select_CString(target.IsFemale,'její','jeho')] pověst nenapravitelně, a [target.GetSheHe] nezbyla jiná volba než okamžitě odstoupit."
 scheme_critical_moments.1162.desc_discovered: "\n\nVšem je jasné, že jedině já měl moc a vliv to zařídit, ale [target.GetSheHe] sotva stojí v pozici něco s touto znalostí udělat."
 scheme_critical_moments.1162.desc_secret: "\n\nSamozřejmě, takový mocný tlak nemohl přijít od nikoho jiného než ode mě, a přesto [target.GetTitledFirstNameNoTooltip] nemá nic, čím by své podezření prokázal."
 scheme_critical_moments.1162.a: "Je hotovo."
 scheme_critical_moments.1162.tt: "[target.GetShortUIName] [Select_CString(target.IsFemale,'odstoupila','odstoupil')] z guvernérského postu [highest_title.GetName] a uvolnil místo [new_governor.GetShortUIName]"
 scheme_critical_moments.1163.t: "$scheme_critical_moments.1133.t$"
 scheme_critical_moments.1163.desc: "Navzdory mým snahám zasít pochyby pečlivě rozmístěnými pomluvami a sfalšovanými důkazy, [target.GetTitledFirstNamePossessive] charisma a věrní stoupenci jej/jí ochránili před jakoukoli nadcházející bouří."
 scheme_critical_moments.1163.desc_discovered: "\n\nKromě toho si ostře [Select_CString(target.IsFemale,'uvědomila','uvědomil')], že celé spiknutí vyšlo ode mě."
 scheme_critical_moments.1163.desc_secret: "\n\n[target.GetSheHe|U] stále stojí, s nepoškozenou pověstí, zdánlivě nevědomý intrikám, které se ho/jí snažily podkopat."
 scheme_critical_moments.1163.tt: "[scheme.GetName] odhaleno"
 scheme_critical_moments.1163.tt.desc: "[scheme.GetOwner.GetShortUIName] se [Select_CString(scheme.GetOwner.IsFemale,'pokusila','pokusil')] vás přinutit odstoupit, ale [Select_CString(scheme.GetOwner.IsFemale,'neuspěla','neuspěl')]!"
 scheme_critical_moments.1163.a: "Musí být jiná cesta."
 scheme_critical_moments.1164.t: "Donucen k odstoupení"
 scheme_critical_moments.1164.desc: "Šeptanda podezření, naznačující různé druhy prohřešků, korupce a dokonce zrady mé osoby, se v průběhu měsíců šířila dvorem a vrhala stíny na mou pověst guvernéra.\n\nBolí mě to přiznat, ale uspěli. Ve světle drtivých, kompromitujících důkazů, které proti mně vypluly — navzdory své sotva skryté nepravdivosti — jsem nucen odstoupit ze své veřejné role."
 scheme_critical_moments.1164.desc_discovered: "\n\nVím, že nikdo jiný než [owner.GetTitledFirstName] nestojí za mým pádem. Není to možná dnes, ale přísahám, že jednou se pomstím."
 scheme_critical_moments.1164.desc_secret: "\n\nNe mnoho lidí by mohlo vyvinout takový vliv na veřejné mínění, takže mám podezření na původce mého pádu, ale nemám důkazy, které by moje tvrzení podpořily."
 scheme_critical_moments.1164.a: "Vrátím se."
