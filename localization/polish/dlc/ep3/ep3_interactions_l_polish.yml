 ep3_interactions_events.0101.t: "Žádost patrona: Pronajmout [recipient.Custom('KnightCultureNoTooltip')]"
 ep3_interactions_events.0101.desc: "„S ohledem na to, koho mohu propustit...“ říká [recipient.GetName]. „Vybral jsem několik mých nejnestřídmějších [recipient.Custom('KnightCulturePluralNoTooltip')|l]. Představte se!“\n\n"
 ep3_interactions_events.0101.desc_knight_1_trait: "„Jsem proslulý [cool_trait_1.GetName(knight_to_rent_1)]!“ chlubí se [knight_to_rent_1.GetName].\n\n"
 ep3_interactions_events.0101.desc_knight_1: "„To by mělo mluvit samo za sebe!“ [knight_to_rent_1.GetName] napíná své [Select_CString(knight_to_rent_1.IsFemale,'její','jeho')] svaly.\n\n"
 ep3_interactions_events.0101.desc_knight_2_trait: "„Vyberte mě a budu vaším voleným [cool_trait_2.GetName(knight_to_rent_2)]!“ volá [knight_to_rent_2.GetName].\n\n"
 ep3_interactions_events.0101.desc_knight_2: "„[Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] bych vaším nejlepším [ROOT.Char.Custom('KnightCultureNoTooltip')|l]!“ tvrdí [knight_to_rent_2.GetName], s nadšením.\n\n"
 ep3_interactions_events.0101.desc_knight_3_trait: "„Jsem znám jako skvělý [cool_trait_3.GetName(knight_to_rent_3)],“ prohlašuje sebevědomě [knight_to_rent_3.GetName]."
 ep3_interactions_events.0101.desc_knight_3: "„Jsem vynikající rváč.“ chlubí se sebevědomě [knight_to_rent_3.GetName]."
 ep3_interactions_events.0101.a: "Líbí se mi sebevědomí [knight_to_rent_1.GetNameNoTooltip]!"
 ep3_interactions_events.0101.b: "Budu sdílet velká vítězství s [knight_to_rent_2.GetNameNoTooltip]!"
