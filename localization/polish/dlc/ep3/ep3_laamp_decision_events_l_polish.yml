 lapidary_turquoise: "Broušený tyrkys"
 lapidary_turquoise.desc: "Poměrně velký kabošon z tyrkysu, kterému se připisují povzbuzující vlastnosti."
 lapidary_tigerseye: "Broušené tygří oko"
 lapidary_tigerseye.desc: "Poměrně velký kabošon z tygřího oka, kterému se připisují povzbuzující vlastnosti."
 lapidary_jasper: "Broušený jaspis"
 lapidary_jasper.desc: "Velký kabošon z jaspisu, kterému se připisují příznivé zdravotní účinky."
 lapidary_garnet: "Broušený granát"
 lapidary_garnet.desc: "Velký kabošon z granátu, kterému se připisují příznivé zdravotní účinky."
 lapidary_sapphire: "Broušený safír"
 lapidary_sapphire.desc: "Jedinečný, nádherný safír, kterému se připisuje ochrana nositele."
 lapidary_ruby: "Broušený rubín"
 lapidary_ruby.desc: "Jedinečný, nádherný rubín, kterému se připisuje ochrana nositele."
 scented_herb_pouch: "Voňavý pytlík bylin"
 scented_herb_pouch.desc: "Malý pytlíček bylin obsahující směs aromatických rostlin, kterým se připisuje odpuzování infekcí."
 pomander: "Voňavá kulička"
 pomander.desc: "Malá vonná kulička, nošená v ozdobném pytlíku. Vůně údajně odpuzuje infekce."
 ep3_laamp_decision_event.1043.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: [visiting_location.GetCounty.GetFaith.HouseOfWorship|U]"
 ep3_laamp_decision_event.1043.desc_returned_01: "Když se vracíme do svatostánku ([visiting_location.GetCounty.GetFaith.HouseOfWorship|l]), kázání právě skončilo. [laamp_clergy_character.Custom('SisterBrother')|U] [laamp_clergy_character.GetFirstName] obchází s koštětem, jemně uklízí a připravuje posvátnou půdu pro návštěvníky, kteří sem přicházejí k modlitbě a rozjímání.\n\nKdyž se přiblížím, vzhlédne a na rtech [Select_CString(laamp_clergy_character.IsFemale,'jí','mu')] pohrává jemný úsměv: „Vítejte zpět v hřejivém objetí, které nabízí [visiting_location.GetCounty.GetFaith.HighGodName]. Co kdybyste tu chvíli [Select_CString(ROOT.Char.IsFemale,'pobyla','pobyl')] a [Select_CString(ROOT.Char.IsFemale,'pokochala','pokochal')] se okolím?“"
 ep3_laamp_decision_event.1043.desc_returned_02: "Když znovu vcházím do svatostánku ([visiting_location.GetCounty.GetFaith.HouseOfWorship|l]), [laamp_clergy_character.Custom('SisterBrother')|l] [laamp_clergy_character.GetFirstName] sedí na jedné z lavic před kazatelnou, zřejmě [Select_CString(laamp_clergy_character.IsFemale,'pohroužená','pohroužený')] do rozjímání.\n\nKdyž se blížím, otočí ke mně hlavu a pohlédne přes rameno: „Tolik shonu. Dopřejte unaveným nohám chvíli odpočinku, mé dítě. Jak vám mohu posloužit?“"
 ep3_laamp_decision_event.1043.desc_reused_clergy: "Když vcházím branami [visiting_location.GetCounty.GetFaith.HouseOfWorship], místní duchovní právě dokončili své denní povinnosti.\n\nNahlédnu po hlavní uličce a nečekaně poznám [Select_CString(laamp_clergy_character.IsFemale,'sestru','bratra')] [laamp_clergy_character.Custom('CZ_FirstName_A')], [Select_CString(laamp_clergy_character.IsFemale,'která','který')] mi na oplátku vrhne nevysvětlitelný pohled a přichází ke mně: „Mé zbloudilé dítě. [visiting_location.GetCounty.GetFaith.HighGodName] tě bezpečně [Select_CString(EqualTo_string(visiting_location.GetCounty.GetFaith.HighGodHerHis,Localize('CHARACTER_HERHIS_HER')),'přivedla','přivedl')] zpět na náš práh!“"
 ep3_laamp_decision_event.1043.desc: "Když procházím branami [visiting_location.GetCounty.GetFaith.HouseOfWorship], jsem [Select_CString(ROOT.Char.IsFemale,'ohromena','ohromen')] prací, která musela být vložena do nádherných staveb a posvátného vybavení.\n\n[GetTrait('devoted').GetNameNoTooltip( laamp_clergy_character )|U], [Select_CString(laamp_clergy_character.IsFemale,'která','který')] o místo pečuje, si mne všimne a klidně přistoupí: „Zdravím, mé dítě. Jsem [laamp_clergy_character.Custom('SisterBrother')] [laamp_clergy_character.GetFirstName]. Jak vám mohu pomoci?“"
 ep3_laamp_decision_event.1043.desc_outro: "\n\nPodívám se nenápadně na košík s mincemi na dobročinné dary o kus dál po uličce."
 ep3_laamp_decision_event.1043.desc_outro_thief: "\n\nZa mnou [visiting_partner.GetFirstName] hází pochybný pohled na košík plný darů o kus dál po uličce."
 ep3_laamp_decision_event.1043.desc_return_outro_thief: "\n\n[visiting_partner.GetFirstName|U] dál toužebně nakukuje přes lavice směrem ke košíku s mincemi."
 ep3_laamp_decision_event.1043.desc_return_outro: "\n\nKošík s dary se značně zvětšil."
 ep3_laamp_decision_event.1043.a: "„Chci přispět darem!“"
 ep3_laamp_decision_event.1043.a.flavor_unzealous: "No, #EMP asi#!..."
 ep3_laamp_decision_event.1043.b: "„Možná by [visiting_location.GetCounty.GetFaith.HighGodName] [Select_CString(EqualTo_string(visiting_location.GetCounty.GetFaith.HighGodHerHis,Localize('CHARACTER_HERHIS_HER')),'mohla','mohl')] požehnat naší věci?“"
 ep3_laamp_decision_event.1043.c: "Jasně #EMP já#! potřebuji tyto dary."
 ep3_laamp_decision_event.1043.c_guarded: "Ještě jeden dar, do #EMP mého#! pytlíku."
 ep3_laamp_decision_event.1043.c_master_thief: "„Pst, [visiting_partner.Custom('CZ_FirstNameNoTooltip_V')], hlídej!“"
 ep3_laamp_decision_event.1043.c.flavor: "Udělej rozptýlení, ukradni trochu mincí. Jednoduché."
 ep3_laamp_decision_event.1043.c.flavor_guarded: "Hm. Z nějakého důvodu se zde stráže pohybují mnohem častěji..."
 ep3_laamp_decision_event.1043.c.thievery_success.t: "Úspěšná krádež"
 ep3_laamp_decision_event.1043.c.thievery_success.desc: "Úspěšně ukradnete dary"
 ep3_laamp_decision_event.1043.c.thievery_failure.t: "[Select_CString(ROOT.Char.IsFemale,'Vyhoštěna','Vyhoštěn')]!"
 ep3_laamp_decision_event.1043.c.thievery_failure.desc: "Máš zákaz vstupu do svatostánku ([visiting_location.GetCounty.GetFaith.HouseOfWorship|l])"
 ep3_laamp_decision_event.1043.c.thievery_critical_failure.t: "Stráže svolány"
 ep3_laamp_decision_event.1043.c.thievery_critical_failure.desc: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 ep3_laamp_decision_event.1043.d: "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1044.desc_epiphany: "Když předávám dar, [laamp_clergy_character.GetFirstName] šokem vytřeští oči: „Vy... vy vypadáte úplně jako [Select_CString(EqualTo_string(visiting_location.GetCounty.GetFaith.HighGodHerHis,Localize('CHARACTER_HERHIS_HER')),'Ona','On')]... jako [Select_CString(EqualTo_string(visiting_location.GetCounty.GetFaith.HighGodHerHis,Localize('CHARACTER_HERHIS_HER')),'Ona','On')]... přísahám...“ Chvíli na mě zírá a naprázdno otvírá ústa jako ryba na suchu.\n\nPak si uvědomí, co dělá, vzpamatuje se a odkašle si: „Bylo by mi ctí zasvětit vaší věci #EMP svůj#! život.“"
 ep3_laamp_decision_event.1044.desc: "Úsměv [laamp_clergy_character.Custom('CZ_FirstName_G')] se rozšíří, nakloní se ke mně a položí mi ruku na rameno: „To je od vás nanejvýš šlechetné, mé dítě. Chápu, že dobrodruh jako vy nepřichází k penězům vždy snadno.“\n\nMoudře pokývá hlavou, ruka [Select_CString(laamp_clergy_character.IsFemale,'jí','mu')] klesne k boku a spočine na mě pohledem."
 ep3_laamp_decision_event.1044.a: "„Snad by [visiting_location.GetCounty.GetFaith.HighGodName] [Select_CString(EqualTo_string(visiting_location.GetCounty.GetFaith.HighGodHerHis,Localize('CHARACTER_HERHIS_HER')),'mohla','mohl')] požehnat naší cestě?“"
 ep3_laamp_decision_event.1044.a_epiphany: "„Zajímá mě jen milost, kterou dává [visiting_location.GetCounty.GetFaith.HighGodName].“"
 ep3_laamp_decision_event.1044.b: "„Mohli bychom #EMP použít#! další schopnou osobu.“"
 ep3_laamp_decision_event.1044.c: "„Nestarám se o nic jiného než o svého bližního.“"
 ep3_laamp_decision_event.1044.c_epiphany: "...v tuto chvíli nenabíráme."
 ep3_laamp_decision_event.1045.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: zahrada"
 ep3_laamp_decision_event.1045.desc_returned_01: "Zahrada je stále tichá a někteří návštěvníci vedou tlumené rozhovory na posezeních, zatímco jiní jsou ponořeni do tichého rozjímání a pozorují přírodu.\n\nPoslouchám šum a vánek; vítr ve stromech a najednou se cítím klidněji."
 ep3_laamp_decision_event.1045.desc_returned_02: "Tentokrát zahlédnu drobný ptáček v jednom ze stromů [visiting_location.Custom('GetRandomRegionalWood')], na pokraji pokusu roztáhnout křídla poprvé.\n\nHladce sklouzne přes okraj hnízda, ale křídla se nějak zamotají a na několik okamžiků ptáček volně padá vzduchem, dokud... vítr jej jemně nezachytí a neodnese do bezpečí. Pocit úlevy se mi rozlije po hrudi."
 ep3_laamp_decision_event.1045.desc: "Zahrada je ohraničena živými ploty a stromy jsou rozmístěny po mírných pahorcích, kde lze mezi listím spatřit občasného ptáčka nebo veverku.\n\nCítím tu silnou přítomnost, pohlcenou touto krásou. Co kdyby [Select_CString(ROOT.Char.IsFemale,'byla','byl')] během všech mých zkoušek a strastí [visiting_location.GetCounty.GetFaith.HighGodName] se mnou po celou dobu... ?"
 ep3_laamp_decision_event.1045.desc_outro_return_partner: "\n\nO kousek dál [visiting_partner.GetFirstName] znovu zkoumá jedlé rostliny v okolí."
 ep3_laamp_decision_event.1045.desc_outro_return_gardener: "\n\nA dál po cestě spatřím ještě více divokých chutných plodů, rozprostřených v odpoledním slunci."
 ep3_laamp_decision_event.1045.desc_outro_partner: "\n\nZa mnou slyším [visiting_partner.GetFirstName] mumlat pokaždé, když na naší procházce narazíme na další obtížně rozpoznatelnou jedlou rostlinu."
 ep3_laamp_decision_event.1045.desc_outro_gardener: "\n\nZ koutku oka si všimnu chutně vypadajících divokých plodů a bylin, které přispívají k bujnosti zahrady."
 ep3_laamp_decision_event.1045.a: "Cítím klid."
 ep3_laamp_decision_event.1045.a_convert: "Možná [visiting_location.GetCounty.GetFaith.GetNameNoTooltip] nakonec není tak špatná věc."
 ep3_laamp_decision_event.1045.a.cooldown.tt: "Nedávno jsi v této zahradě [Select_CString(GetPlayer.IsFemale,'rozjímala','rozjímal')] – vrať se [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1045_contemplated_garden_recently') )]"
 ep3_laamp_decision_event.1045.b: "Byla by škoda tyto pochoutky nevyužít."
 ep3_laamp_decision_event.1045.b_partner: "„[visiting_partner.Custom('CZ_FirstNameNoTooltip_V')|U], co kdybychom si něco nasbírali?“"
 ep3_laamp_decision_event.1045.b_flavor: "Je čas sklízet!"
 ep3_laamp_decision_event.1045.b.cooldown.tt: "Nedávno jsi v této zahradě [Select_CString(GetPlayer.IsFemale,'sklízela','sklízel')] – vrať se [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1045_has_harvested_recently') )]"
 ep3_laamp_decision_event.1045.c: "„...tolik skrytých zákoutí a škvír, #EMP [visiting_partner.GetFirstNameNoTooltip]#!...“"
 ep3_laamp_decision_event.1045.c.flavor: "Skutečně božské."
 ep3_laamp_decision_event.1045.c.cooldown.tt: "Nedávno sis v této zahradě [Select_CString(GetPlayer.IsFemale,'odpočinula','odpočinul')] – vrať se [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1045_garden_unwinded_recently') )]"
 ep3_laamp_decision_event.1045.d: "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1047.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: lékař"
 ep3_laamp_decision_event.1047.desc_returned_01: "Dveře do pracovny [laamp_physician_recruit.Custom('CZ_FirstName_G')] jsou lehce pootevřené a škvírou vidím, jak [laamp_physician_recruit.GetFirstNameNoTooltip] děsivě ostrými a štíhlými nůžkami stříhá vlasy klientovi, který sedí jako přikovaný.\n\nZaklepu na dveře a vstoupím, čímž na sebe upoutám lékařovu pozornost: „Velmi nenápadné. Co jste [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')]?“"
 ep3_laamp_decision_event.1047.desc_returned_02: "[laamp_physician_recruit.GetFirstName] stojí u dveří své pracovny a prohlíží rameno [Select_CString(ROOT.Char.IsFemale,'jakési ženy, která','jakéhosi muže, který')] zjevně trpí bolestí.\n\nPak návštěvu zakončí, poradí, jak kloub co nejlépe vyléčit, a otočí se ke mně: „Jste zpátky. Chcete tentokrát něco?“"
 ep3_laamp_decision_event.1047.desc_returned_03: "Když opatrně stoupám po schodech do pracovny [laamp_physician_recruit.Custom('CZ_FirstName_G')], nahlédnu otevřenými dveřmi dovnitř.\n\n[laamp_physician_recruit.GetFirstNameNoTooltip|U] je zřejmě [Select_CString(laamp_physician_recruit.IsFemale,'zabraná','zabraný')] do jakéhosi tělesného cvičení a pořádně se u toho potí – opakovaně dřepuje, vstává a začíná znovu.\n\nPo určitém počtu opakování přestane, otře si čelo a lokne si z lahve opodál. Pak na mě upře teď už bystrý jako břitva pohled: „Vy ale nedáte pokoj, co?“"
 ep3_laamp_decision_event.1047_desc_intro: "Následuji [laamp_physician_recruit.Custom('CZ_FirstName_A')] zužující se uličkou, nahoru po schodech až do [Select_CString(laamp_physician_recruit.IsFemale,'její','jeho')] pracovny. Místnost je od podlahy až ke stropu nacpaná policemi se spisy a tisky o tělesných šťávách, zdraví a duchovnu.\n\nPosadí se na jedinou židli za stolem, nepřítomně hladí malý talisman a teprve pak si všimne mé přítomnosti: "
 ep3_laamp_decision_event.1047.desc_reused_physician: "$ep3_laamp_decision_event.1047_desc_intro$„Och. [Select_CString(ROOT.Char.IsFemale,'Neviděla','Neviděl')] jsem vás už někde dřív? Co chcete?“\n\nOpatrně zvážím svá slova, než odpovím:"
 ep3_laamp_decision_event.1047.desc: "$ep3_laamp_decision_event.1047_desc_intro$„Aha. Vy. Chcete něco?“\n\n„[Select_CString(ROOT.Char.IsFemale,'Viděla','Viděl')] jsem, jak jste [Select_CString(laamp_physician_recruit.IsFemale,'poučovala','poučoval')] ty méně šťastné,“ odpovím a před pokračováním zaváhám:"
 ep3_laamp_decision_event.1047.a: "„[Select_CString(laamp_physician_recruit.IsFemale,'Nechtěla','Nechtěl')] bys pracovat pro mě?“"
 ep3_laamp_decision_event.1047.b: "„Pomoz mi posílit ducha mých následovníků!“"
 ep3_laamp_decision_event.1047.c: "„Musíš #EMP použít#! své schopnosti, aby ses [Select_CString(laamp_physician_recruit.IsFemale,'udržela ostražitá','udržel ostražitý')]. Přidej se k mému táboru.“"
 ep3_laamp_decision_event.1047.c.success: "[laamp_physician_recruit.GetShortUIName] souhlasí s vaším hodnocením"
 ep3_laamp_decision_event.1047.c.failure: "Nepodaří se vám přilákat [laamp_physician_recruit.GetShortUIName]"
 ep3_laamp_decision_event.1047.c.failure.tt: "[laamp_physician_recruit.GetShortUIName] vás začne ignorovat"
 ep3_laamp_decision_event.1047.d: "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1050.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: hrad"
 ep3_laamp_decision_event.1050.desc_returned_01: "Znovu vstupuji branami do [visiting_location.GetHolding.GetType.GetName|l] a při tom si prohlížím vzor a barvy praporu znázorňujícího erb rodu [visiting_location.GetTitle.GetHolder.GetHouse.GetName]."
 ep3_laamp_decision_event.1050.desc_returned_02: "Když se vracíme z hlavního náměstí [visiting_location.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')], vánek jemně rozvlní pestrý prapor rodu [visiting_location.GetTitle.GetHolder.GetHouse.GetNameNoTooltip] nahoře na hradbách."
 ep3_laamp_decision_event.1050.desc_returned_from_training: "Když procházím branami [visiting_location.GetHolding.GetType.GetName|l] zpět z cvičiště, stráže na svých stanovištích mi tentokrát sotva věnují druhý pohled."
 ep3_laamp_decision_event.1050.desc_returned_from_garrison: "Když vycházím z kasáren stráží, mžourám při náhlém záplavě světla a zhluboka vdechuji čerstvý vzduch."
 ep3_laamp_decision_event.1050.desc_returned_from_reinforcers: "Ještě přemítám o demoralizovaných bojovnících a pomalu kráčím zpět na nádvoří [visiting_location.GetHolding.GetType.GetName|l], kde se mnoho nezměnilo."
 ep3_laamp_decision_event.1050.desc_returned_from_bodyguard: "Nechávám [laamp_bodyguard_recruit.GetFirstName], aby dál [Select_CString(laamp_bodyguard_recruit.IsFemale,'vybila','vybil')] své frustrace na zvířecích mršinách, a úspěšně se proplížím úzkými uličkami zpět na pozemky [visiting_location.GetHolding.GetType.GetName|l]."
 ep3_laamp_decision_event.1050.desc: "Nádvoří [visiting_location.GetBaronyNameExplicitlyNoTooltip] [visiting_location.GetHolding.GetType.GetName|l] jsou, jak se očekává, zařízená pro vojenské účely: se sudy šípů, zbylými kopí, pěknými stájemi a podobně."
 ep3_laamp_decision_event.1050.mid_maa: "\n\nCvičiště je hned u bran, posádka má několik stráží, které se povalují, a po ulici zahlédnu shluk otrhaných a demoralizovaných bojovníků [visiting_location.GetCounty.GetCulture.GetNameNoTooltip]."
 ep3_laamp_decision_event.1050.mid_no_maa: "\n\nCvičiště je těsně za branami a několik strážných posádky se povaluje u vchodu, buď napůl spí, nebo leští zbraně."
 ep3_laamp_decision_event.1050.desc_outro_bodyguard: "\n\nNa druhé straně nádvoří [Select_CString(laamp_bodyguard_recruit.IsFemale,'jakási žena','jakýsi muž')] řve na pár dalších: „...a NEBYLA TO MOJE VINA!“ Hádka nabírá na síle a bedlivě situaci sleduji."
 ep3_laamp_decision_event.1050.desc_outro_partner: "\n\n[visiting_partner.GetFirstName|U] rozjímajíc se rozhlíží a zamyslí se nad silným praporem znázorňujícím erb rodu [visiting_location.GetTitle.GetHolder.GetHouse.GetName], který se jemně vlní ve větru."
 ep3_laamp_decision_event.1050.desc_outro: "\n\nZakruším rty a rozvážně se rozhlédnu po organizovaném chaosu skládajícím se z [visiting_location.GetTitle.GetHolder.Custom('KnightCulturePluralNoTooltipLowercase')], stráží, ozbrojenců a vojáků."
 ep3_laamp_decision_event.1050.desc_outro_return_partner_finished: "$ep3_laamp_decision_event.1040.desc_outro_return_partner_finished$"
 ep3_laamp_decision_event.1050.desc_outro_return_finished: "\n\nPo důkladném prozkoumání všech zákoutí místa [visiting_location.GetBaronyNameExplicitlyNoTooltip] ([visiting_location.GetHolding.GetType.GetName|l]) mám své pochůzky vyřízené a s tímto místem jsem [Select_CString(ROOT.Char.IsFemale,'hotová','hotový')].\n\nRozhlížím se po nejrychlejší cestě zpět na hlavní náměstí [visiting_location.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')]."
 ep3_laamp_decision_event.1050.desc_outro_bodyguard_return: "\n\nRozzuření [laamp_bodyguard_recruit.GetWomenMen] stále řádí na okraji nádvoří, situaci nyní opatrně sleduje blízká hlídka, aby se zabránilo krvavé eskalaci."
 ep3_laamp_decision_event.1050.desc_outro_return_partner_01: "\n\nCítím mírné štuchnutí, když mě [visiting_partner.GetFirstName] štípe a pošeptá o nešťastných rysech jednoho z hlídek na okraji náměstí připomínajících [visiting_partner.Custom('GetGenderAlliteratingAnimal')].\n\nZnechuceně se zamračím na [visiting_partner.Custom('CZ_FirstNameNoTooltip_A')], zatímco přemýšlím o dalším cíli."
 ep3_laamp_decision_event.1050.desc_outro_return_partner_02: "\n\n[visiting_partner.GetFirstName|U] zvědavě pozoruje toulavého pouličního prodejce, který jemně mává zahnutou čepelí vzduchem, aby demonstroval nadřazenost zahnutí.\n\nMůj pohled se toulá po náměstí, přemýšlím, kam se vydat dál."
 ep3_laamp_decision_event.1050.desc_outro_return_partner_03: "\n\nPodívám se doleva, kde [visiting_partner.GetFirstName] potlačuje zívnutí. Když povytáhnu obočí, omluvně se zatváří, a můj pohled se vrátí na nádvoří, zatímco přemýšlím, co dál."
 ep3_laamp_decision_event.1050.desc_outro_return_01: "\n\nV rohu náměstí skupinka dětí s dřevěnými meči napodobuje to, co vypadá jako výcvik [visiting_location.GetTitle.GetHolder.Custom('KnightCulturePluralNoTooltipLowercase')], s mrazivou přesností.\n\nPečlivě je sleduji, zatímco zvažuji další cíl."
 ep3_laamp_decision_event.1050.desc_outro_return_02: "\n\nBranou právě vyjíždí jízdní průvod, který podle všeho patří [Select_CString(ROOT.Char.IsFemale,'místní šlechtičně','místnímu šlechtici')]. Pozoruji tu podívanou a uvažuji, kam se vydat dál."
 ep3_laamp_decision_event.1050.desc_outro_return_03: "\n\nU vchodů na nádvoří a [visiting_location.GetHolding.GetType.GetName|l] se objevují stráže, střídající ty staré právě včas na jejich směnu. Neformálně sleduji výměnu, zatímco přemýšlím, co dál."
 ep3_laamp_decision_event.1050.a: "Navštivme místní cvičiště."
 ep3_laamp_decision_event.1050.a_second: "Bylo by dobré ještě jednou navštívit cvičiště."
 ep3_laamp_decision_event.1050.a.tt: "Jít na cvičiště"
 ep3_laamp_decision_event.1050.a.cooldown.tt: "Cvičiště je zaneprázdněno plánovaným tréninkem"
 recruited_maa.tt: "[laamp_disgruntled_moa.GetShortUIName] se právě stěhuje do tvého tábora"
 ep3_laamp_decision_event.1050.b: "Měli bychom v posádce hledat nějaké schopné lidi."
 ep3_laamp_decision_event.1050.b_second: "Posádka je pořád zajímavá."
 ep3_laamp_decision_event.1050.b.tt: "Jít do posádky"
 ep3_laamp_decision_event.1050.b.cooldown.tt: "Kvůli vetřelcům jsou dveře posádky po zbytek této návštěvy zavřené"
 ep3_laamp_decision_event.1050.c: "Možná by ti otrhaní [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip] vojáci mohli být k užitku?"
 ep3_laamp_decision_event.1050.c_second: "Demoralizovaní [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip] by stále mohli být užiteční."
 ep3_laamp_decision_event.1050.c.tt: "Jít k demoralizovaným vojákům"
 ep3_laamp_decision_event.1050.c.cooldown.tt: "Tví noví [Concept('soldiers','vojáci')|E] ([Concept('men_at_arms','ozbrojenci')|E]) se právě stěhují do tvého tábora"
 ep3_laamp_decision_event.1050.c.cooldown_province.tt: "V posledních 90 dnech jsi v místě [visiting_location.GetBaronyNameExplicitly] [Select_CString(GetPlayer.IsFemale,'posílila','posílil')] [Concept('men_at_arms','ozbrojence')|E]"
 ep3_laamp_decision_event.1050.d: "Zajímalo by mě, o čem se hádají?"
 ep3_laamp_decision_event.1050.d_second: "Popovídejme si znovu s bývalým tělesným strážcem."
 ep3_laamp_decision_event.1050.d.tt: "Přistupte k hádajícím se [laamp_bodyguard_recruit.GetWomenMen]"
 ep3_laamp_decision_event.1050.d.tt_second: "Promluvte si s [laamp_bodyguard_recruit.Custom('CZ_ShortUIName_I')]"
 ep3_laamp_decision_event.1050.e: "$ep3_laamp_decision_event.1010.e$"
 ep3_laamp_decision_event.1050.e_second: "$ep3_laamp_decision_event.1040.e_second$"
 ep3_laamp_decision_event.1051.return.tt: "Vrátíte se na pozemky [visiting_location.GetHolding.GetType.GetName|l]"
 ep3_laamp_decision_event.1051.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: cvičiště"
 ep3_laamp_decision_event.1051.desc_returned_01: "Zpátky na cvičišti se mistr zbraní [laamp_disgruntled_moa.GetFirstName] motá kolem, skládá výstroj a potichu si pro sebe brblá o tom, jak to tu chodí.\n\nDává si pozor, aby [Select_CString(laamp_disgruntled_moa.IsFemale,'nevypadala','nevypadal')] #EMP až příliš#! otevřeně nespokojeně, ale když k [Select_CString(laamp_disgruntled_moa.IsFemale,'ní','němu')] znovu přistupuji, vrhne na mě mrzutý pohled."
 ep3_laamp_decision_event.1051.desc_returned_02: "Na cvičišti stojí mistr zbraní [laamp_disgruntled_moa.GetFirstName] v pozoru, zatímco nadřízený důstojník kontroluje výcvikovou výstroj.\n\nJakmile nadřízený odejde do [visiting_location.GetHolding.GetType.GetName|l], [laamp_disgruntled_moa.GetFirstNameNoTooltip] povolí postoj, znovu se nahrbí a jako by se o pár palců [Select_CString(laamp_disgruntled_moa.IsFemale,'scvrkla','scvrkl')]. Vrhne na mě zdrcující pohled."
 ep3_laamp_decision_event.1051.desc: "„...a já ti povídám, že to tu jde z kopce už #EMP věky#!,“ odfrkne si místní mistr zbraní [laamp_disgruntled_moa.GetFirstName] a pokračuje: „To věčný koukání přes rameno, zpochybňování mých...“ Když přicházím na cvičiště, zmlkne.\n\nInstinktivně si prohlížím spoustu výstroje a cvičných překážek a ze všech sil se snažím přehlížet vzdorovitý pohled [laamp_disgruntled_moa.Custom('CZ_FirstNameNoTooltip_G')]."
 ep3_laamp_decision_event.1051.desc_outro_martial_partner: "\n\nPo mé pravici [visiting_partner.GetFirstName] zvedne jeden z tréninkových mečů a začne s ním obratně mávat, očekávaně se na mě dívá."
 ep3_laamp_decision_event.1051.desc_outro_return_martial_partner: "\n\nU stojanu s tupými meči stojí se zkříženýma rukama [visiting_partner.GetFirstName]. Podívá se na zbraně, pak zpátky na mě a šibalsky se usměje."
 ep3_laamp_decision_event.1051.a: "Pojďme na trénink!"
 ep3_laamp_decision_event.1051.a_athletic.desc: "Tvůj sparing [Select_CString(ROOT.Char.IsFemale,'byla','byl')] velmi efektivní"
 ep3_laamp_decision_event.1051.a.desc: "Zacvičíte si sparring"
 ep3_laamp_decision_event.1051.b: "„[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bys se přidat k našemu táboru. Dost svobody.“"
 ep3_laamp_decision_event.1051.c: "„Na tebe, [visiting_partner.GetFirstNameNoTooltip]!“"
 ep3_laamp_decision_event.1051.c_joshing.t: "Žertování"
 ep3_laamp_decision_event.1051.c_joshing.desc: "Sparring [Select_CString(ROOT.Char.IsFemale,'byla','byl')] neefektivní"
 ep3_laamp_decision_event.1051.c_wounded.t: "$playdate_training_injury_log_title$"
 ep3_laamp_decision_event.1051.c_wounded.desc: "$martial_authority.8000_injury$"
 ep3_laamp_decision_event.1051.d: "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1053.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: posádka"
 ep3_laamp_decision_event.1053.desc_returned_01: "Když se vracím do posádky, [laamp_plain_guard.GetFirstName] si něžně ošetřuje svůj oteklý ret.\n\nU improvizovaného stolu vyrobeného ze sudu se právě dokončuje partie karet a [laamp_talented_guard.GetFirstName] zamručí na znamení uznání svých výher.\n\nDvojice mě přeměří, když se přibližuji ke skupině stráží."
 ep3_laamp_decision_event.1053.desc_returned_02: "Zpátky ve stinné strážnici si [laamp_plain_guard.GetFirstName] krátce zdřímne, zatímco [laamp_talented_guard.GetFirstName] přepočítává mince. Když si mě starší strážný všimne, šťouchne do [laamp_plain_guard.Custom('CZ_FirstNameNoTooltip_G')].\n\nMéně zkušený strážný sebou trhne, posadí se a snaží se vymnout si z očí zbytky spánku.\n\nOba se na mě tázavě podívají."
 ep3_laamp_decision_event.1053.desc: "Uvnitř dusné posádky si stráže vytvořily zápasiště, aby si procvičovaly dovednosti. Dva z nich jej právě používají, píchají do sebe a dav přihlížejících je povzbuzuje.\n\nChvíli sleduji jejich trénink a je jasné, že [laamp_talented_guard.GetFirstName], první stráž, je podstatně zkušenější než [laamp_plain_guard.GetFirstName], druhý stráž.\n\nKdyž končí, opatrně přistoupím k ringu a jejich pozornost se přesune na mě:"
 ep3_laamp_decision_event.1053.a: "„[laamp_plain_guard.GetFirstNameNoTooltip|U], nechceš pro mě pracovat?“"
 ep3_laamp_decision_event.1053.b: "„Mohli bychom využít někoho s tvými dovednostmi, [laamp_talented_guard.GetFirstNameNoTooltip].“"
 ep3_laamp_decision_event.1053.c: "„Někdo na partii kostek?“"
 ep3_laamp_decision_event.1053.c.plain_wins: "[laamp_plain_guard.GetShortUIName] vyhrává kolo"
 ep3_laamp_decision_event.1053.c.talented_wins: "[laamp_talented_guard.GetShortUIName] vyhrává kolo"
 ep3_laamp_decision_event.1053.c.you_win: "Vyhráváš kolo"
 ep3_laamp_decision_event.1053.d: "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1055.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: posily"
 ep3_laamp_decision_event.1055.desc_maxed_out_returned: "Když se vracím do stanového tábora, skupinky vojáků na mě dál zírají, ale rozestupují se a nechávají mě projít.\n\nŠeptají si, že jsem se [Select_CString(ROOT.Char.IsFemale,'podílela','podílel')] na skolení bájného tvora ([ROOT.Char.Custom('RegionalMythicalCreatureLower')]), a další ještě fantastičtější historky.\n\nRty se mi zvlní v tenký úsměv, když stanu znovu před velitelem. Hlavu má lehce skloněnou, úzkostlivě se vyhýbá mému pohledu a čeká, až promluvím."
 ep3_laamp_decision_event.1055.desc_returned_01: "Když se vracím do stanového tábora, zahlédnu hrstku vojáků, kteří napájejí koně. Podle plášťů patří k jedné z nepolapitelnějších jezdeckých jednotek.\n\nVydám se klikatou cestou mezi stany zpátky k [Select_CString(laamp_maa_reinforcer.IsFemale,'impozantní ženě','impozantnímu muži')] z dřívějška, [Select_CString(laamp_maa_reinforcer.IsFemale,'která','který')] se ani nesnaží skrývat nespokojenost.\n\nPodívá se na mě unavenýma očima a čeká, až promluvím."
 ep3_laamp_decision_event.1055.desc_returned_02: "Zpátky ve stanovém táboře mi vojáci sotva věnují pozornost, když je míjím a pronikám hlouběji do tábora.\n\nNakonec najdu [Select_CString(laamp_maa_reinforcer.IsFemale,'tu ženu','toho muže')] z dřívějška. Jediné, co prozradí překvapení, že mě vidí tak brzy znovu, je nepatrné cuknutí obočí.\n\nPohled se [Select_CString(laamp_maa_reinforcer.IsFemale,'jí','mu')] zatoulá do dálky a čeká, až promluvím."
 ep3_laamp_decision_event.1055.desc_maxed_out: "Scházím ke stanovému táboru na okraji [visiting_location.GetBaronyNameExplicitlyNoTooltip] a cítím na sobě jejich pohledy.\n\nZbití a zdeptaní vojáci si za mými zády šeptají, zatímco kráčím k jednomu z velitelů té chátry.\n\nOči se [Select_CString(laamp_maa_reinforcer.IsFemale,'jí','mu')] mírně rozšíří a čeká, až promluvím."
 ep3_laamp_decision_event.1055.desc: "Stanový tábor na okraji [visiting_location.GetBaronyNameExplicitlyNoTooltip] je až po okraj plný vojáků a bojovníků, velkých i malých, nejrůznějších kultur, ale hlavně kultury [visiting_location.GetCounty.GetCulture.GetNameNoTooltip].\n\nPostávají ve skupinkách, většina se mračí a rozhlíží, jako by hledala cestu ze své bídy.\n\nJdu dál, až najdu [Select_CString(laamp_maa_reinforcer.IsFemale,'impozantní ženu, která právě dořvala','impozantního muže, který právě dořval')] na pár zjizvených bojovníků, a teď si mě podezíravě měří."
 ep3_laamp_decision_event.1055.a: "„Jeď se mnou — vážený [ROOT.Char.GetTitledFirstNameNoTooltip]!“"
 ep3_laamp_decision_event.1055.a.flavor: "Prestižní? Dělám jen to, co je třeba."
 ep3_laamp_decision_event.1055.a.cooldown.tt: "Nedávno jsi [Select_CString(GetPlayer.IsFemale,'využila','využil')] svou [Concept('prestige_level','úroveň slávy')|E] – další vojáci bažící po slávě se shromáždí [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1055_reinforced_with_prestige_recently') )]"
 ep3_laamp_decision_event.1055.prestige_level: "Kvůli vašemu [Concept('prestige_level','úrovni slávy')|E]:"
 ep3_laamp_decision_event.1055.prestige_full.tt: "$ep3_laamp_decision_event.1055.prestige_level$$ep3_laamp_decision_event.1055.full.tt$"
 ep3_laamp_decision_event.1055.prestige_partial_80.tt: "$ep3_laamp_decision_event.1055.prestige_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.positive_partial.tt$ (#V 80#!%)#!"
 ep3_laamp_decision_event.1055.prestige_partial_60.tt: "$ep3_laamp_decision_event.1055.prestige_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.positive_partial.tt$ (#V 60#!%)#!"
 ep3_laamp_decision_event.1055.prestige_partial_40.tt: "$ep3_laamp_decision_event.1055.prestige_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.alert_partial.tt$ (#V 40#!%)#!"
 ep3_laamp_decision_event.1055.prestige_partial_20.tt: "$ep3_laamp_decision_event.1055.prestige_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.alert_partial.tt$ (#V 20#!%)#!"
 ep3_laamp_decision_event.1055.b: "„Přidej se ke mně, ve službě [ROOT.Char.GetFaith.GetNameNoTooltip]!“"
 ep3_laamp_decision_event.1055.b.flavor: "Pouze [ROOT.Char.GetFaith.HighGodName] posoudí mou zbožnost."
 ep3_laamp_decision_event.1055.b.cooldown.tt: "Nedávno jsi [Select_CString(GetPlayer.IsFemale,'využila','využil')] svou [Concept('piety_level','úroveň zbožnosti')|E] – další zapálení vojáci se shromáždí [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1055_reinforced_with_piety_recently') )]"
 ep3_laamp_decision_event.1055.piety_level: "Kvůli vašemu [Concept('piety_level','úrovni oddanosti')|E]:"
 ep3_laamp_decision_event.1055.piety_full.tt: "$ep3_laamp_decision_event.1055.piety_level$$ep3_laamp_decision_event.1055.full.tt$"
 ep3_laamp_decision_event.1055.piety_partial_80.tt: "$ep3_laamp_decision_event.1055.piety_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.positive_partial.tt$ (#V 80#!%)#!"
 ep3_laamp_decision_event.1055.piety_partial_60.tt: "$ep3_laamp_decision_event.1055.piety_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.positive_partial.tt$ (#V 60#!%)#!"
 ep3_laamp_decision_event.1055.piety_partial_40.tt: "$ep3_laamp_decision_event.1055.piety_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.alert_partial.tt$ (#V 40#!%)#!"
 ep3_laamp_decision_event.1055.piety_partial_20.tt: "$ep3_laamp_decision_event.1055.piety_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.alert_partial.tt$ (#V 20#!%)#!"
 ep3_laamp_decision_event.1055.c: "„Možná bychom si mohli vyměnit pár věcí?“"
 ep3_laamp_decision_event.1055.c.tt: "Náhodný [Concept('regiment','pluk')|E] [Concept('men_at_arms','ozbrojenců')|E]: \n#P #EMP $BULLET_WITH_TAB$Je plně doplněn!#!#!"
 ep3_laamp_decision_event.1055.d: "„Tohle je tvá šance bojovat za #EMP spravedlnost!#!“"
 ep3_laamp_decision_event.1055.d.flavor: "Společně pro lepší svět."
 ep3_laamp_decision_event.1055.d.tt: "Vzhledem k tvým [Concept('trait_level_track_xp','zkušenostem rysu')|E] [GetTrait('knight_errant').GetName( GetNullCharacter )]:$refill_maa_regiments_fully_reinforced_tt$"
 ep3_laamp_decision_event.1055.e: "$ep3_laamp_decision_event.1021.d$"
