 laamp_treasure_map_contract_desc_title: "Poklad na celý život"
 laamp_treasure_map_contract_desc: "Důchodce a hledač pokladů [TaskContract.GetEmployer.GetName] potřebuje pomoc s nalezením posledního těžko uchopitelného pokladu. Tato smlouva zůstane platná, dokud budete vlastnit mapu pokladu."
 laamp_treasure_map_contract_request: "Tato [Concept('task_contract','zakázka')|E] vyžaduje, abyste [Concept('travel','docestovali')|E] na místo pokladu pomocí rozhodnutí [GetDecisionWithKey('treasure_map_contract_decision').GetName] [Concept('decision','rozhodnutí')|E]"
 overflowing_provisions_to_gold.tt: "#EMP Protože by vás to dostalo nad kapacitu [Concept('provisions','proviantu')|E], budou dodatečné @provisions_icon![provisions_overflow_value|V0] prodány na místním trhu za @gold_icon![provisions_transformed_to_gold_value|V0]#!"
 treasure_map: "Mapa pokladu"
 treasure_map_desc: "Ošuntělá mapa, údajně vedoucí k dávným bohatstvím v [newly_created_map.MakeScope.Var('artifact_treasure_location').GetProvince.GetBaronyNameExplicitlyNoTooltip]. Získána od hlásného v [newly_created_map.MakeScope.Var('picked_up_in_location').GetProvince.GetBaronyNameExplicitlyNoTooltip]."
 artifact_is_related_to_contract_tt: "Tento [Concept('artifact','artefakt')|E] souvisí s [Concept('task_contract','zakázkou')|E] a nelze jej zničit"
 gallowsbait_thief_blocked_from_contract.tt: "Jsi v [Concept('trait','rysu')|E] [GetTrait('gallowsbait').GetName( GetNullCharacter )] ([GetTrait( 'gallowsbait' ).GetTraitTrackByKey( 'thief' ).GetName]) [Select_CString(GetPlayer.IsFemale,'zabředla','zabředl')] příliš hluboko, než aby ti někdo svěřil tuto [Concept('task_contract','zakázku')|E]"
 ep3_laamp_decision_event.1030.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: [ROOT.Char.Custom('GetTavernDwelling')|U]"
 ep3_laamp_decision_event.1030.desc_returned_01: "Znovu vstupuji do taverny a zjišťuji, že se toho mnoho nezměnilo — cestovatelé a tuláci odpočívají, zatímco se jim dostává péče."
 ep3_laamp_decision_event.1030.desc_nomad_returned_01: "Znovu vstupuji do obydlí, znovu mě zasáhne pohostinnost a přátelská atmosféra a dovolím si uvolněné povzdechnutí."
 ep3_laamp_decision_event.1030.desc_returned_02: "Zpět v [ROOT.Char.Custom('GetTavernDwelling')] právě pár [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] vyhazovačů ukončilo hádku, která přerostla v rvačku."
 ep3_laamp_decision_event.1030.desc_returned_from_story: "Podrobnosti příběhu, který [Select_CString(laamp_storyteller.IsFemale,'vyprávěla','vyprávěl')] [laamp_storyteller.GetFirstName], mi ještě doznívají v hlavě, když se vracím do mnohem hlučnější společenské místnosti."
 ep3_laamp_decision_event.1030.desc_nomad_returned_from_story: "Podrobnosti příběhu, který [Select_CString(laamp_storyteller.IsFemale,'vyprávěla','vyprávěl')] [laamp_storyteller.GetFirstName], mi ještě doznívají v hlavě, když se vracím do obydlí."
 ep3_laamp_decision_event.1030.desc_returned_from_recruit: "Když se vracím od verbířů, zachytím lákavou vůni [visiting_location.GetCounty.GetTitle.GetHolder.Custom('GetLocalStreetFoodPlural')] připravovaných v kuchyni."
 ep3_laamp_decision_event.1030.desc_nomad_returned_from_recruit: "Když se vracím od verbířů, téměř zakopnu o dvojici veselých, kteří si právě dělají legraci z třetího, uzavřenějšího muže kvůli jeho podobě s [ROOT.Char.Custom('RegionalMythicalCreatureLower')]."
 ep3_laamp_decision_event.1030.desc_returned_from_unwinding_spouse: "Opouštím příjemnou společnost [laamp_spouse_material.Custom('CZ_FirstName_G')], upravím si oblečení a vracím se z jedné ze zadních místností s novou chutí do života."
 ep3_laamp_decision_event.1030.desc_nomad_returned_from_unwinding_spouse: "Opouštím příjemný stan [laamp_spouse_material.Custom('CZ_FirstName_G')], upravím si oblečení a s novou chutí do života se vplížím zpátky do obydlí."
 ep3_laamp_decision_event.1030.desc_returned_from_spouse: "Když opouštím [Select_CString(laamp_spouse_material.IsFemale,'její','jeho')] společnost, [laamp_spouse_material.GetFirstName] opět pokračuje v hovoru s několika přátelskými [ROOT.Char.Custom('GetTaverngoersTribespeople')] zatímco pochodím zpět do středu [ROOT.Char.Custom('GetRoomTent')]."
 ep3_laamp_decision_event.1030.desc_returned_from_hood_noble_fail: "Když se mi nepodaří situaci urovnat, místní vyhazovači vyhodí [laamp_hooded_figure.GetFirstName] a [Select_CString(laamp_hooded_figure.IsFemale,'její','jeho')] rvačku z [ROOT.Char.Custom('GetTavernDwelling')]. Opatrně se vracím do středu [ROOT.Char.Custom('GetRoomTent')]."
 ep3_laamp_decision_event.1030.desc_returned_from_hood_noble: "Napětí je stále vysoké, když [laamp_hooded_figure.GetFirstName] nechávám v [Select_CString(laamp_hooded_figure.IsFemale,'její','jeho')] potíži a vracím se do středu [ROOT.Char.Custom('GetRoomTent')]."
 ep3_laamp_decision_event.1030.desc_returned_from_hood: "Kloužu zpět z sklepa, zatímco se mi oči znovu přizpůsobují vyšší jasnosti společenského sálu."
 ep3_laamp_decision_event.1030.desc_nomad_returned_from_hood: "Kloužu zpět z jiného stanu, zatímco se mi oči znovu přizpůsobují šeru v obydlí."
 ep3_laamp_decision_event.1030.desc: "Taverna, kde se shromažďují cestovatelé a místní [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip], pulzuje aktivitou."
 ep3_laamp_decision_event.1030.desc_nomad: "Jsem pozván do jednoho z stanů. Překvapivě se tam vejde mnoho lidí — cestovatelé a [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip], všichni se mísí do jednoho bezvadného #EMP bzučení#! lidského hluku."
 ep3_laamp_decision_event.1030.desc_mid_storyteller_intro: "\n\nU ohně dál v místnosti sedí vypravěč. Přední část obtěžuje skupina špinavých přátel servírku kvůli dalším [visiting_location.GetCounty.GetTitle.GetHolder.Custom('RegionalDrink')], a v rohu u pultu"
 ep3_laamp_decision_event.1030.desc_nomad_mid_storyteller_intro: "\n\nVenku u ohně sedí vypravěč. Přední část tvoří shluk hlasitých tribes[visiting_location.GetCounty.GetTitle.GetHolder.GetWomenMen], kteří vzpomínají na svou poslední výpravu, a v rohu u pultu"
 ep3_laamp_decision_event.1030.desc_mid_reused_spouse: "$ep3_laamp_decision_event.1030.desc_mid_storyteller_intro$ Všimnu si [laamp_spouse_material.Custom('RandomPositiveShallowAdjective')] [laamp_spouse_material.GetFirstName], [Select_CString(laamp_spouse_material.IsFemale,'která','který')] sedí a zjevně se nudí."
 ep3_laamp_decision_event.1030.desc_mid_spouse: "$ep3_laamp_decision_event.1030.desc_mid_storyteller_intro$ [laamp_spouse_material.Custom('RandomPositiveShallowAdjectiveWithArticle')] [laamp_spouse_material.Custom('RaunchyComplimentNoun')] sedí a zdá se, že se nudí."
 ep3_laamp_decision_event.1030.desc_nomad_mid_spouse: "$ep3_laamp_decision_event.1030.desc_nomad_mid_storyteller_intro$ [laamp_spouse_material.Custom('RandomPositiveShallowAdjectiveWithArticle')] [laamp_spouse_material.Custom('RaunchyComplimentNoun')] sedí a zdá se, že se nudí."
 ep3_laamp_decision_event.1030.desc_mid_return_reused_spouse: "\n\nU pultu stále sedí [laamp_spouse_material.GetFirstName], táhnouc prstem po okraji [Select_CString(laamp_spouse_material.IsFemale,'její','jeho')] šálku."
 ep3_laamp_decision_event.1030.desc_mid_return_spouse: "\n\nU pultu je stále připravená [laamp_spouse_material.Custom('RandomPositiveShallowAdjective')] [laamp_spouse_material.Custom('RaunchyComplimentNoun')], která popíjí [Select_CString(laamp_spouse_material.IsFemale,'její','jeho')] šálek."
 ep3_laamp_decision_event.1030.desc_mid: "\n\nU ohně dál v místnosti sedí vypravěč a vpředu skupina zanedbaných přátel obtěžuje servírku kvůli dalšímu [visiting_location.GetCounty.GetTitle.GetHolder.Custom('RegionalDrink')]."
 ep3_laamp_decision_event.1030.desc_nomad_mid: "\n\nVenku u ohně sedí vypravěč. Přední část tvoří shluk hlasitých tribes[visiting_location.GetCounty.GetTitle.GetHolder.GetWomenMen], kteří vzpomínají na svou poslední výpravu."
 ep3_laamp_decision_event.1030.desc_outro_hooded: "\n\nU vchodu spatřím nenápadnou zahalenou postavu. Zjevně člověka, [Select_CString(ROOT.Char.IsFemale,'která','který')] si cení svého soukromí."
 ep3_laamp_decision_event.1030.desc_outro_partner: "\n\n[visiting_partner.GetFirstName|U] se dívá na to pestrobarevné shromáždění jednotlivců s jiskrou zvědavosti v [Select_CString(visiting_partner.IsFemale,'jejímu','jeho')] oku."
 ep3_laamp_decision_event.1030.desc_outro: "\n\n[Select_CString(ROOT.Char.IsFemale,'Udělala','Udělal')] jsem pár kroků do jasného a teplého [ROOT.Char.Custom('GetRoomTent')], přemýšlejíc, co udělat jako první."
 ep3_laamp_decision_event.1030.desc_outro_return_partner_finished: "\n\n[visiting_partner.GetFirstName|U], [Select_CString(visiting_partner.IsFemale,'která','který')] už začíná vypadat trochu unaveně, pohlédne na nedaleký stůl: „Jestli tu zůstaneme ještě dlouho, mohli bychom alespoň něco sníst, [visiting_partner.Custom2('RelationToMe', ROOT.Char)]?“"
 ep3_laamp_decision_event.1030.desc_outro_return_finished: "\n\nKdyž se rozhlédnu po [ROOT.Char.Custom('GetRoomTent')], zdá se, že je teď mnohem prázdněji; uvědomuji si, že už nemám co dělat."
 ep3_laamp_decision_event.1030.desc_outro_hooded_return_intro: "\n\nVedle vchodu stále sedí nenápadná zahalená postava,"
 ep3_laamp_decision_event.1030.desc_outro_hooded_noble_return: "$ep3_laamp_decision_event.1030.desc_outro_hooded_return_intro$ a právě polkne další pohár."
 ep3_laamp_decision_event.1030.desc_outro_hooded_return: "$ep3_laamp_decision_event.1030.desc_outro_hooded_return_intro$ hraje si s malým dýkou."
 ep3_laamp_decision_event.1030.desc_outro_return_partner_01: "\n\nV rohu [ROOT.Char.Custom('GetTavernDwelling')] [visiting_partner.GetFirstName] sleduje skupinku místních, kteří házejí ostré předměty na rozbitý sud, s morbidním zaujetím.\n\nPohlédnu na jejich hru a zvažuji, co udělat dál."
 ep3_laamp_decision_event.1030.desc_outro_return_partner_02: "\n\nPo mé pravici se [visiting_partner.GetFirstName] uznale culí, když jeden sedlák dovypráví hrubý vtip o několika tělesných tekutinách. Překvapeně se na [Select_CString(visiting_partner.IsFemale,'ni','něj')] podívám a zvažuji, co dál."
 ep3_laamp_decision_event.1030.desc_outro_return_partner_03: "\n\nDále vpředu se [visiting_partner.GetFirstName] pustí do malého tančícího skoku, když [ROOT.Char.Custom('GetTavernDwelling')] trubadúr dokončí místní lidovou píseň. Pohodově sleduji tanec, zatímco přemýšlím, co dál na programu."
 ep3_laamp_decision_event.1030.desc_outro_return_01: "\n\nNálada je veselá a někteří [ROOT.Char.Custom('GetTavernDwelling')]-návštěvníci začali skandovat [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] melodii. Uprostřed toho hluku zvažuji svůj další krok."
 ep3_laamp_decision_event.1030.desc_outro_return_02: "\n\nVzadu v [ROOT.Char.Custom('GetRoomTent')|l] se [Select_CString(ROOT.Char.IsFemale,'urozená dáma','urozený pán')] zrovna vemlouvá do přízně jednomu prostému člověku ([ROOT.Char.Custom('GetRandomWomanMan')|l]). Oči mi spočinou na [Select_CString(ROOT.Char.IsFemale,'jejím','jeho')] erbu, zatímco zvažuji, co dál."
 ep3_laamp_decision_event.1030.desc_outro_return_03: "\n\nU stolu u vchodu hraje pár místních exotickou deskovou hru pomocí hrubých kamenů černé a bílé. Pohodově sleduji jejich tahy a opatrně vážím své možnosti."
 ep3_laamp_decision_event.1030.a: "[Select_CString(ROOT.Char.IsFemale,'Neodmítla','Neodmítl')] bych poslechnout si pár příběhů."
 ep3_laamp_decision_event.1030.a_second: "Ještě mě napadlo něco k tomu příběhu."
 ep3_laamp_decision_event.1030.a.tt: "Posadit se u ohně"
 ep3_laamp_decision_event.1030.a.cooldown.tt: "Vypravěč už pro toto setkání žádné další příběhy nemá"
 ep3_laamp_decision_event.1030.b: "Podívejme se, kdo by [Select_CString(ROOT.Char.IsFemale,'byla','byl')] k verbování."
 ep3_laamp_decision_event.1030.b_second: "Možná bychom někoho měli verbovat, nakonec."
 ep3_laamp_decision_event.1030.b.tt: "Informovat se u nezaměstnaných [THIS.Char.Custom('GetTaverngoersTribespeople')]"
 ep3_laamp_decision_event.1030.b.cooldown.tt: "Při této návštěvě už jsi [Select_CString(GetPlayer.IsFemale,'naverbovala','naverboval')] [Concept('follower','družiníka')|E]"
 ep3_laamp_decision_event.1030.c: "No teda. Kdo je #EMP ten#!?"
 ep3_laamp_decision_event.1030.c_second: "K [laamp_spouse_material.Custom('CZ_FirstNameNoTooltip_D')]. #EMP Teď#!."
 ep3_laamp_decision_event.1030.c.tt: "Přistoupit k [laamp_spouse_material.Custom('RaunchyComplimentNoun')] u pultu"
 ep3_laamp_decision_event.1030.c.tt_second: "Pokračovat v hovoru s [laamp_spouse_material.Custom('CZ_ShortUIName_I')]"
 ep3_laamp_decision_event.1030.c.cooldown.tt: "Nedávno jsi [Select_CString(GetPlayer.IsFemale,'naverbovala','naverboval')] možného [Concept('spouse','chotě')|E] jako [Concept('follower','družiníka')|E] – vrať se [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1035_has_spoused_recently') )]"
 ep3_laamp_decision_event.1030.c.success.cooldown.tt: "Při této návštěvě už jsi [Select_CString(GetPlayer.IsFemale,'naverbovala','naverboval')] možného [Concept('spouse','chotě')|E]"
 ep3_laamp_decision_event.1030.c.failure.cooldown.tt: "Při této návštěvě ses už [Select_CString(GetPlayer.IsFemale,'pokusila','pokusil')] naverbovat možného [Concept('spouse','chotě')|E]"
 ep3_laamp_decision_event.1030.d: "Co za zajímavou zahalenou postavu..."
 ep3_laamp_decision_event.1030.d_second: "Další rozhovor s [laamp_hooded_figure.Custom('CZ_FirstNameNoTooltip_I')] neuškodí."
 ep3_laamp_decision_event.1030.d_third: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych se vrátit k [laamp_hooded_figure.Custom('CZ_FirstNameNoTooltip_D')]."
 ep3_laamp_decision_event.1030.d.tt: "Přistoupit k zahalené postavě"
 ep3_laamp_decision_event.1030.d.tt_second: "Vrátit se k [laamp_hooded_figure.Custom('CZ_ShortUIName_D')]"
 ep3_laamp_decision_event.1030.e: "$ep3_laamp_decision_event.1010.e$"
 ep3_laamp_decision_event.1030.e_second: "Jsme hotovi."
 ep3_laamp_decision_event.1031.return.tt: "Vrátíte se k vchodu [THIS.Char.Custom('GetTavernDwelling')]"
 ep3_laamp_decision_event.1031.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Vypravěč"
 ep3_laamp_decision_event.1031.desc_01: "#EMP „...a touhou zbavit se neustálého kladívkování [Select_CString(ROOT.Char.IsFemale,'byla','byl')] Zeusova hlava rozříznuta na dvě a z ní vyšla Athéna, nejmoudřejší z bohů.“#!"
 ep3_laamp_decision_event.1031.desc_02: "#EMP „...a pak se Horus a Set stali smrtelnými nepřáteli, soupeřícími o prázdný trůn.“#!"
 ep3_laamp_decision_event.1031.desc_03: "#EMP „...a od toho dne je Ruha vyobcována ze Světa světla a vyhnána do Světa temnot.“#!"
 ep3_laamp_decision_event.1031.desc_04: "#EMP „...a pak velký Leviathan zničil svět potřetí, umírajíc přitom. Z jejího těla však vyrostla nová země, rostliny a zvířata.“#!"
 ep3_laamp_decision_event.1031.desc_05: "#EMP „...a pak se stal atuou lesů, Tangaroa zdědil moře, Rūaumoko třesoucí se zemi a Tāwhirimatea rozvernému větru.“#!"
 ep3_laamp_decision_event.1031.desc_06: "#EMP „...a pak spadlo vejce; jeho části vytvořily vesmír — žloutek se stal teplým sluncem a bílek krásným měsícem.“#!"
 ep3_laamp_decision_event.1031.desc_07: "#EMP „...a pak Kuutar svolila zlato vlákno do nádherného roucha; širokého jako noční obloha a dlouhého jako věčnost.“#!"
 ep3_laamp_decision_event.1031.desc_08: "#EMP „...a když si uvědomila, že to byl její vlastní bratr, Kullervo, kdo ji sváděl, spadla ze skály a do života za ní.“#!"
 ep3_laamp_decision_event.1031.desc_09: "#EMP „...a pak Finn, ve své zuřivosti, zatvrdl do kamene. Jeho sny o zkáze nebyly nikdy naplněny a tak katedrála stále stojí, až do dnešního dne.“#!"
 ep3_laamp_decision_event.1031.desc_10: "#EMP „...a navzdory Kaangsovu varování lidé udělali oheň v narůstajícím tmách a zvířata uprchla do kopců.“#!"
 ep3_laamp_decision_event.1031.desc_11: "#EMP „...a pak byla uhnětená hlína pokryta kůží, naplněna krví a Tore ho pojmenoval Baatsi.“#!"
 ep3_laamp_decision_event.1031.desc_12: "#EMP „...a pak tábor žen vyšel vítězně nad táborem mužů, což jim umožnilo znovu se #EMP zaplést#! mezi sebou.“#!"
 ep3_laamp_decision_event.1031.desc_13: "#EMP „...a oni ji nazvali Teryel, první lvice.“#!"
 ep3_laamp_decision_event.1031.desc_14: "#EMP „...a Soma byla dána bohům, ale čtyři kapky byly rozlity na samotnou zemi, a z těchto kapek vzešla svatá města.“#!"
 ep3_laamp_decision_event.1031.desc_15: "#EMP „...a jedním velkým hltáním Culebre polkl svou krávu, kopyta i vše.“#!"
 ep3_laamp_decision_event.1031.desc_16: "#EMP „...a pak Toranos přijal oběť; krev tekoucí po jeho trupu ho posílila, čímž stvořila nový pramen.“#!"
 ep3_laamp_decision_event.1031.desc_17: "#EMP „...a pak Tjelvar přišel na ostrov, přinesl oheň, díky němuž ostrov přestal každé večer klesat pod vlny.“#!"
 ep3_laamp_decision_event.1031.desc_18: "#EMP „...a pak přišly deště do Afriky, za velkého zpěvu, tance a radosti.“#!"
 ep3_laamp_decision_event.1031.desc_19: "#EMP „...a když se ráno vrátil na pláž, král zjistil, že drahokamy obklopily matku pokladu z vlastní vůle.“#!"
 ep3_laamp_decision_event.1031.desc_outro: "\n\n„Ale ten příběh je na jindy.“ Vypravěč mi věnuje tajemný úsměv, opře se v [Select_CString(laamp_storyteller.IsFemale,'jejím','jeho')] místě u krbu a napije se dalšího doušku [laamp_storyteller.Custom('RegionalDrink')]."
 ep3_laamp_decision_event.1031.a: "Ten příběh [Select_CString(ROOT.Char.IsFemale,'měla','měl')] pár dobrých bodů."
 ep3_laamp_decision_event.1031.a_zealous: "...Myslím, že [Select_CString(ROOT.Char.IsFemale,'měla','měl')] jeden nebo dva relevantní body."
 ep3_laamp_decision_event.1031.a_eccentric: "Vidíte, teď to dává úplný smysl!"
 ep3_laamp_decision_event.1031.a_success.t: "Dovednosti skrze morálku"
 ep3_laamp_decision_event.1031.a_success.desc: "Naučíte se něco z poučení příběhu"
 ep3_laamp_decision_event.1031.a_semi_success.t: "Příležitost k růstu"
 ep3_laamp_decision_event.1031.a_semi_success.desc: "Části příběhu se hodí na tvou situaci"
 ep3_laamp_decision_event.1031.a_failure.t: "Pěkný příběh"
 ep3_laamp_decision_event.1031.a_failure.desc: "Aspoň to [Select_CString(ROOT.Char.IsFemale,'byla','byl')] napínavý příběh"
 ep3_laamp_decision_event.1031.a.cooldown.tt: "Nedávno jsi [Select_CString(GetPlayer.IsFemale,'rozjímala','rozjímal')] nad příběhem – vrať se [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1031_has_storied_recently') )]"
 ep3_laamp_decision_event.1031.b: "„[laamp_storyteller.GetFirstNameNoTooltip|U], jak umíš tak dobře vyprávět příběhy?“"
 ep3_laamp_decision_event.1031.b_reveler: "Tenhle znám!"
 ep3_laamp_decision_event.1031.b.cooldown.tt: "Nedávno ses [Select_CString(GetPlayer.IsFemale,'bavila','bavil')] u příběhu – vrať se [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1031_has_reveled_recently') )]"
 ep3_laamp_decision_event.1031.c: "„To [Select_CString(ROOT.Char.IsFemale,'byla','byl')] skvělý příběh, příteli!“"
 ep3_laamp_decision_event.1031.c_zealous: "Bah. Takový kacířský nesmysl."
 ep3_laamp_decision_event.1031.c.cooldown.tt: "Nedávno sis [Select_CString(GetPlayer.IsFemale,'užila','užil')] příběh – vrať se [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1031_has_relaxed_recently') )]"
 ep3_laamp_decision_event.1031.d: "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1033.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Nováčci"
 ep3_laamp_decision_event.1033.desc_returned_01: "Když se vracím k potenciálním rekrutům, [laamp_first_recruit.GetFirstName], [laamp_second_recruit.GetFirstName] a [laamp_third_recruit.GetFirstName] se podezíravě dívají jeden na druhého.$ep3_laamp_decision_event.1033.desc_returned_outro_01$"
 ep3_laamp_decision_event.1033.desc_returned_jane_01: "Když se vracím k potenciálním rekrutům, [laamp_first_recruit.GetFirstName] a [laamp_second_recruit.GetFirstName] vedou tichou konverzaci."
 ep3_laamp_decision_event.1033.desc_returned_outro_01: "\n\nKdyž si mě všimnou, společně ožijí a očekávavě na mě zírají."
 ep3_laamp_decision_event.1033.desc_returned_02: "Zpátky u rekrutů, trio složené z [laamp_first_recruit.Custom('CZ_FirstName_G')], [laamp_second_recruit.Custom('CZ_FirstName_G')] a [laamp_third_recruit.Custom('CZ_FirstName_G')] se zdá, že právě urovnalo hádku.$ep3_laamp_decision_event.1033.desc_returned_outro_02$"
 ep3_laamp_decision_event.1033.desc_returned_jane_02: "Zpátky u rekrutů právě dvojice [laamp_first_recruit.GetFirstName] a [laamp_second_recruit.GetFirstName] dohráli hru kostkami s pochybnými výsledky."
 ep3_laamp_decision_event.1033.desc_returned_outro_02: "\n\nNapětí ve vzduchu se, jak se přibližuji, mírně posune a promění v opatrné očekávání."
 ep3_laamp_decision_event.1033.desc: "Když přistupuji ke skupině nezaměstnaných [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip], zvednu hlas a oslovím je přímo: „Hledám zručné, spolehlivé lidi, kteří by se připojili k mému táboru! Kdo z vás je na to připraven?“"
 ep3_laamp_decision_event.1033.desc_mid_two: "\n\nZainteresované osoby se představí jako [laamp_first_recruit.GetFirstName] — [laamp_first_recruit.Custom('PersonalityGetNegativeTraitDesc')] a [laamp_second_recruit.GetFirstName] — [laamp_second_recruit.Custom('PersonalityGetNegativeTraitDesc')]."
 ep3_laamp_decision_event.1033.desc_mid_three: "\n\nZainteresované osoby se představí jako [laamp_first_recruit.GetFirstName] — [laamp_first_recruit.Custom('PersonalityGetNegativeTraitDesc')|U], [laamp_second_recruit.GetFirstName] — [laamp_second_recruit.Custom('PersonalityGetNegativeTraitDesc')|U] a [laamp_third_recruit.GetFirstName] — [laamp_third_recruit.Custom('PersonalityGetNegativeTraitDesc')|U]."
 ep3_laamp_decision_event.1033.desc_outro: "\n\nOčima přejíždím po kandidátech, snažím se rozhodnout, kterého najmout."
 ep3_laamp_decision_event.1033.desc_partner_outro: "\n\n[visiting_partner.GetFirstName|U] zamumlá a pozoruje uchazeče, zatímco zvažuji, koho najmout."
 ep3_laamp_decision_event.1033.desc_jane_outro: "\n\nSotva dokončím představování, okamžitě ke mně rázně přistoupí [Select_CString(laamp_generic_jane.IsFemale,'jakási žena','jakýsi muž')]: „Jmenuji se [laamp_generic_jane.GetFirstName]. Ze svých vlastních důvodů bych se [Select_CString(laamp_generic_jane.IsFemale,'ráda přidala','rád přidal')] k tvému táboru.“"
 ep3_laamp_decision_event.1033.desc_returned_jane_outro: "\n\n[laamp_generic_jane.GetFirstNameNoTooltip|U] stále stojí v rohu a vrací mi pohled, zatímco si prohlížíme kandidáty."
 ep3_laamp_decision_event.1033.a: "„Co kdybys pro mě [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')] pracovat, [laamp_first_recruit.GetFirstNameNoTooltip]?“"
 ep3_laamp_decision_event.1033.b: "[laamp_second_recruit.GetFirstNameNoTooltip] vypadá jako vhodný kandidát."
 ep3_laamp_decision_event.1033.c: "Vidím potenciál jen v [laamp_third_recruit.Custom('CZ_FirstNameNoTooltip_L')]."
 ep3_laamp_decision_event.1033.d: "„...[laamp_generic_jane.GetFirstNameNoTooltip], že? Přidej se ke mně.“"
 ep3_laamp_decision_event.1033.d.cooldown.tt: "Nedávno jsi [Select_CString(GetPlayer.IsFemale,'přijala','přijal')] [Concept('follower','družiníka')|E] zadarmo – vrať se [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1033_generic_jane_cooldown') )]"
 ep3_laamp_decision_event.1033.e: "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1035.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Potenciální protějšek"
 ep3_laamp_decision_event.1035.desc_returned_01: "Vracím se ke stolu [laamp_spouse_material.Custom('CZ_FirstName_G')] a krev mi okamžitě začne bušit v uších.\n\nKlid. Hlavně klid. #EMP Nějak začni hovor.#!\n\n[laamp_spouse_material.GetFirstNameNoTooltip|U] si zrovna povídá s [Select_CString(laamp_spouse_material.IsFemale,'mužem','ženou')] u vedlejšího stolu, a když se přiblížím, přimhouří v očekávání oči:"
 ep3_laamp_decision_event.1035.desc_returned_02: "Když se vrátím k [Select_CString(laamp_spouse_material.IsFemale,'jejímu','jeho')] stolu, [laamp_spouse_material.GetFirstName] [Select_CString(laamp_spouse_material.IsFemale,'právě dostala','právě dostal')] kouřící jídlo, jehož vůně mi rozkručí žaludek.\n\nNespouští oči z jídla ([visiting_location.GetCounty.GetTitle.GetHolder.Custom('GetLocalStreetFood')|l]) a suše poznamená: „Tentokrát něco opravdu #EMP chceš#!?“\n\nTen jízlivý pozdrav mě zarazí a pečlivě zvažuji odpověď:"
 ep3_laamp_decision_event.1035.desc_reused_spouse: "Vykračuji si k [laamp_spouse_material.Custom('CZ_FirstName_D')], [Select_CString(laamp_spouse_material.IsFemale,'která jako vždy září','který jako vždy září')] a vzhlédne, když se blížím.\n\nChvíli zřejmě nemůže přijít na to, odkud mě zná – pak se [Select_CString(laamp_spouse_material.IsFemale,'jí','mu')] oči s poznáním přimhouří.\n\n#EMP Nic osobního#!, říkám si a s lehkým úsměvem ignoruji tíseň na hrudi:"
 ep3_laamp_decision_event.1035.desc: "Pozorně sleduji [laamp_spouse_material.Custom('RaunchyComplimentNoun')], [Select_CString(laamp_spouse_material.IsFemale,'která','který')] si sedá ke stolu poblíž. Majitel [ROOT.Char.Custom('GetTavernDwelling')] [Select_CString(laamp_spouse_material.IsFemale,'ji','ho')] přece oslovil jménem [laamp_spouse_material.GetFirstName], ne?\n\n[Select_CString(laamp_spouse_material.IsFemale,'Ona','On')] vypadá zmateně, když k [Select_CString(laamp_spouse_material.IsFemale,'ní','němu')] přistupuji, možná proto, že můj vnitřní zmatek je jasně čitelný ve tváři. Proč by mi to mělo vadit? #EMP Jsem [ROOT.Char.GetNameNoTooltip], sakra!#!\n\nNeustále si připomínám své nedávné úspěchy, abych [Select_CString(ROOT.Char.IsFemale,'zůstala klidná','zůstal klidný')]. Většinou se mi to nedaří."
 ep3_laamp_decision_event.1035.a: "„Co kdybych ti [Select_CString(ROOT.Char.IsFemale,'koupila','koupil')] další hrnek [laamp_spouse_material.Custom('RegionalDrink')]?“"
 ep3_laamp_decision_event.1035.b_first: "„Kromě #EMP kradení srdcí#!, co dalšího děláš?“"
 ep3_laamp_decision_event.1035.b_second: "„Máš nějaké jméno? Nebo ti můžu říkat #EMP moje#!?“"
 ep3_laamp_decision_event.1035.b_third: "„Máš mapu? Právě jsem se v tvých očích #EMP [Select_CString(ROOT.Char.IsFemale,'ztratila','ztratil')]#!.“"
 ep3_laamp_decision_event.1035.b_fourth: "„Chytáš ryby? Protože mě máš #EMP na háčku#!.“"
 ep3_laamp_decision_event.1035.b_fifth: "„Když mi půjčíš polibek, #EMP slibuju#! že ho hned vrátím.“"
 ep3_laamp_decision_event.1035.b_fallback: "„Co dělá [laamp_spouse_material.Custom('GirlBoy')] jako ty v takovém místě?“"
 ep3_laamp_decision_event.1035.b.success: "[laamp_spouse_material.GetShortUIName] je [Select_CString(laamp_spouse_material.IsFemale,'okouzlena','okouzlen')] tvými návrhy"
 ep3_laamp_decision_event.1035.b.failure: "Nepodařilo se ti zaujmout [laamp_spouse_material.GetShortUIName]"
 ep3_laamp_decision_event.1035.b.failure.tt: "[laamp_spouse_material.GetShortUIName] začne tě ignorovat"
 ep3_laamp_decision_event.1035.b.cooldown.tt: "Nedávno ses [Select_CString(GetPlayer.IsFemale,'pokusila','pokusil')] okouzlit možného [Concept('spouse','chotě')|E] – zkus to znovu [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1035_spouse_duelled_recently') )]"
 ep3_laamp_decision_event.1035.c: "„...proč to nepřesunout někam #EMP pohodlnějšímu#!...“"
 ep3_laamp_decision_event.1035.c.cooldown.tt: "Nedávno sis [Select_CString(GetPlayer.IsFemale,'odpočinula','odpočinul')] v hospodě ([ROOT.Char.Custom('GetTavernDwelling')|l]) – vrať se [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1035_spouse_unwinded_recently') )]"
 ep3_laamp_decision_event.1035.d: "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1037.t_noble: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: [laamp_hooded_figure.GetFirstNameNoTooltip] je v nesnázích!"
 ep3_laamp_decision_event.1037.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: [Select_CString(laamp_hooded_figure.IsFemale,'Hledaná','Hledaný')]"
 ep3_laamp_decision_event.1037.desc_noble_returned_01: "Vrátím se k [laamp_hooded_figure.Custom('CZ_FirstName_D')], [Select_CString(laamp_hooded_figure.IsFemale,'která','který')] je stále ve zuřícím sporu s místním výtržníkem.\n\nJejich pohledy jsou sevřeny, patová situace je úplná a jen ji narušuje, že místní výtržník občas nakoukne ke dveřím, jako by na něco — nebo na #EMP někoho#! — čekal.\n\nCítím, jak mi po zádech stéká kapka potu."
 ep3_laamp_decision_event.1037.desc_noble_returned_02: "Zpátky u stolu [laamp_hooded_figure.Custom('CZ_FirstName_G')] je napětí pořád stejné a místní rváč kultury [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] stále čeká na zaplacení.\n\n[laamp_hooded_figure.GetTitleAsNameNoTooltip|U] #EMP odmítá#! vyhovět a občasný kolemjdoucí zpomalí, jen aby zase zrychlil, když mu dojde, co se schyluje.\n\nMůj pohled neklidně těká od jednoho k druhému."
 ep3_laamp_decision_event.1037.desc_returned_01_intro: "Ve sklepě [laamp_hooded_figure.GetFirstName] zaujatě sleduje mapu. Prkno na podlaze vrzne"
 ep3_laamp_decision_event.1037.desc_nomad_returned_01_intro: "V jiném stanu [laamp_hooded_figure.GetFirstName] zaujatě sleduje mapu. Náhodou narážím do [laamp_hooded_figure.Custom('GetSmallHidingObject')]"
 ep3_laamp_decision_event.1037.desc_returned_01_outro: "a prudce otočí hlavu ke mně.\n\n„Jsi zpátky,“ poznamená a opatrně zavře mapu, na níž je nedaleké sídlo [1037_neighboring_holding.GetBaronyNameExplicitly]. „[Select_CString(ROOT.Char.IsFemale,'Chtěla','Chtěl')] jsi něco?“\n\nVstane, zkříží ruce a ledabyle přenese váhu na jednu nohu."
 ep3_laamp_decision_event.1037.desc_returned_01: "$ep3_laamp_decision_event.1037.desc_returned_01_intro$ $ep3_laamp_decision_event.1037.desc_returned_01_outro$"
 ep3_laamp_decision_event.1037.desc_nomad_returned_01: "$ep3_laamp_decision_event.1037.desc_nomad_returned_01_intro$ $ep3_laamp_decision_event.1037.desc_returned_01_outro$"
 ep3_laamp_decision_event.1037.desc_returned_02: "Nakouknu do sklepa dříve, než znovu sestoupím po schodech. $ep3_laamp_decision_event.1037.desc_returned_02_outro$"
 ep3_laamp_decision_event.1037.desc_nomad_returned_02: "Zvednu chlopeň stanu a nakouknu dovnitř, než vstoupím: $ep3_laamp_decision_event.1037.desc_returned_02_outro$"
 ep3_laamp_decision_event.1037.desc_returned_02_outro: "Nahlédnu do sklepa a znovu sestoupím po schodech. [laamp_hooded_figure.GetFirstName|U], [Select_CString(laamp_hooded_figure.IsFemale,'ta darebnice','ten darebák')], sedí [Select_CString(laamp_hooded_figure.IsFemale,'opřená','opřený')] v křesle a upřeně zírá na [ROOT.Char.Custom('GetCeilingCanopy')|l].\n\nLíně vyhazuje do vzduchu minci kultury [visiting_location.GetCounty.GetCulture.GetNameNoTooltip], otočí ji a jistou rukou chytí.\n\nOdkašlu si a [laamp_hooded_figure.GetFirstNameNoTooltip] zavře oči, schová minci, sepne ruce za hlavou a zabručí: „No?“"
 ep3_laamp_decision_event.1037.desc_returned_03: "Když se vracím do sklepa, dveře jsou zavřené. Opatrně je otevřu a sejdu po schodech.\n\nO kus dál [laamp_hooded_figure.GetFirstName] vytírá z podlahy něco, co vypadá jako... #EMP krev#!? Snad #EMP zvířecí#! krev...\n\nZapraská klouby, odloží vědro a obrátí pozornost ke mně: „Jseš ale [Select_CString(ROOT.Char.IsFemale,'vytrvalá','vytrvalej')], co?“"
 ep3_laamp_decision_event.1037.desc_nomad_returned_03: "Stojím před stanem [Select_CString(laamp_hooded_figure.IsFemale,'darebnice','darebáka')] [laamp_hooded_figure.Custom('CZ_FirstName_G')] a zevnitř slyším něco jako svíjení. Pak to náhle ustane.\n\nOpatrně strčím hlavu do stanu a v šeru [Select_CString(laamp_hooded_figure.IsFemale,'ji','ho')] zahlédnu, jak otírá nůž od jakési tmavé tekutiny. Krev...?\n\nLhostejně se ke mně otočí: „Jen #EMP krysa#!. Zato #EMP ty#! jsi ale [Select_CString(ROOT.Char.IsFemale,'vytrvalá ženská','vytrvalej chlápek')], co?“"
 ep3_laamp_decision_event.1037.desc_intro: "Zahalená postava nenápadně proklouzne hostincem a sejde po schodech do sklepa. Opatrně se rozhlédnu a následuji [Select_CString(laamp_hooded_figure.IsFemale,'ji','ho')] dolů.\n\nDole se posadí na židli za stolem a nechá kápi sklouznout"
 ep3_laamp_decision_event.1037.desc_nomad_intro: "Zahalená postava nenápadně proklouzne obydlím a vyjde druhou stranou. Opatrně se rozhlédnu a následuji [Select_CString(laamp_hooded_figure.IsFemale,'ji','ho')] ven do vedlejšího stanu.\n\nUvnitř se posadí na židli za stolem a nechá kápi sklouznout"
 ep3_laamp_decision_event.1037.desc_reused_thief_outro: "\n\nPoznávám [laamp_hooded_figure.Custom('CZ_FirstName_A')], [Select_CString(laamp_hooded_figure.IsFemale,'která','který')] nadšeně udeří pěstí do stolu: „No to mě podrž! Že tě #EMP ještě#! uvidím, to jsem teda [Select_CString(laamp_hooded_figure.IsFemale,'nečekala','nečekal')] – aspoň ne v tomhle životě. Co pro tebe můžu udělat?“"
 ep3_laamp_decision_event.1037.desc_reused_thief: "$ep3_laamp_decision_event.1037.desc_intro$.$ep3_laamp_decision_event.1037.desc_reused_thief_outro$"
 ep3_laamp_decision_event.1037.desc_nomad_reused_thief: "$ep3_laamp_decision_event.1037.desc_nomad_intro$.$ep3_laamp_decision_event.1037.desc_reused_thief_outro$"
 ep3_laamp_decision_event.1037.desc_noble: "...a pak je tu #EMP poplatek za sezení#!,„ poznamená [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] výtržník s ironickým úsměvem, zatímco gestikuluje směrem ke křeslu zakuklené postavy. ‚To je jistě další zlatý příspěvek.‘\n\n[Select_CString(laamp_hooded_figure.IsFemale,'Zakuklená žena','Zakuklený muž')] okamžitě vstane a když [Select_CString(laamp_hooded_figure.IsFemale,'jí','mu')] sklouzne kapuce, poznám, že se jedná o nikoho jiného než [laamp_hooded_figure.Custom('CZ_Name_A')]: „To je hrubost!“ vykřikne [laamp_hooded_figure.GetTitleAsNameNoTooltip], zjevně [Select_CString(laamp_hooded_figure.IsFemale,'rozrušená','rozrušený')].\n\n„Nenuť mě, abych se dotázal u svých #EMP obchodních partnerů#!“ vyhrožuje výtržník a situace houstne."
 ep3_laamp_decision_event.1037.desc: "$ep3_laamp_decision_event.1037.desc_intro$$ep3_laamp_decision_event.1037.desc_outro$"
 ep3_laamp_decision_event.1037.desc_nomad: "$ep3_laamp_decision_event.1037.desc_nomad_intro$$ep3_laamp_decision_event.1037.desc_outro$"
 ep3_laamp_decision_event.1037.desc_outro: ": „Předpokládám, že mě znáš podle pověsti? #EMP ‚[Select_CString(laamp_hooded_figure.IsFemale,'Ta','Ten')] [laamp_hooded_figure.Custom2('CriminalAdjective', ROOT.Char)] a [laamp_hooded_figure.Custom2('CriminalCrierInsult', ROOT.Char)] [Select_CString(laamp_hooded_figure.IsFemale,'zločinkyně','zločinec')] [laamp_hooded_figure.GetFirstNameNoTooltip]!‘#!“\n\n„...Lidi jsem #EMP [Select_CString(laamp_hooded_figure.IsFemale,'naklepala','naklepal')]#! i za menší urážky. Tak co chceš?“ [laamp_hooded_figure.GetFirstNameNoTooltip|U] se na mě upřeně zadívá a tázavě povytáhne obočí."
 ep3_laamp_decision_event.1037.a: "„Uhradím [Select_CString(laamp_hooded_figure.IsFemale,'její','jeho')] útratu.“"
 ep3_laamp_decision_event.1037.a.flavor: "Jsem si jistý, že se to bude hodit."
 ep3_laamp_decision_event.1037.b_diplomacy: "„Přece bys vydělal více na #EMP vracejícím se#! zákazníkovi?“"
 ep3_laamp_decision_event.1037.b_stewardship: "„To není, bohužel, ten #EMP současný#! poplatek za sezení.“"
 ep3_laamp_decision_event.1037.b_intrigue: "„[Select_CString(laamp_hooded_figure.IsFemale,'Její','Jeho')] tělesní strážci jsou #EMP právě#! venku, víš...“"
 ep3_laamp_decision_event.1037.b_learning: "„Přece jsme lepší než tohle, ne?“"
 ep3_laamp_decision_event.1037.b_martial: "„Chceš to vyřídit se #EMP mnou#! místo toho?“"
 ep3_laamp_decision_event.1037.b.flavor: "Co nejhoršího by se mohlo stát?"
 ep3_laamp_decision_event.1037.b.success: "Podařilo se ti přimět výtržníka, aby nechal [laamp_hooded_figure.Custom('CZ_ShortUIName_A')] na pokoji"
 ep3_laamp_decision_event.1037.b.success.t: "[Select_CString(laamp_hooded_figure.IsFemale,'Šlechtična zachráněna','Šlechtic zachráněn')]"
 ep3_laamp_decision_event.1037.b.failure: "Nepodařilo se ti přesvědčit výtržníka"
 ep3_laamp_decision_event.1037.b.failure.t: "Nepřesvědčivý"
 ep3_laamp_decision_event.1037.c: "„Tento #EMP [laamp_hooded_figure.GetTitleAsNameNoTooltip]#! je už zadaný, ty [ROOT.Char.Custom('CZ_InsultNoun_V')]!“"
 ep3_laamp_decision_event.1037.c.flavor: "[Select_CString(ROOT.Char.IsFemale,'Zažila','Zažil')] jsem horší."
 ep3_laamp_decision_event.1037.d: "„Hodila by se mi osoba s tvými schopnostmi, [laamp_hooded_figure.GetFirstNameNoTooltip].“"
 ep3_laamp_decision_event.1037.d_thief_position: "„Víš, mám volné místo $master_thief_camp_officer$ právě pro tebe.“"
 ep3_laamp_decision_event.1037.e: "„Profesionál tvého kalibru by se v mém táboře #EMP rozvíjel#!“"
 ep3_laamp_decision_event.1037.e.success: "[laamp_hooded_figure.GetShortUIName] je touto myšlenkou [Select_CString(laamp_hooded_figure.IsFemale,'zaujata','zaujat')]"
 ep3_laamp_decision_event.1037.e.failure: "Nepodařilo se ti nalákat [laamp_hooded_figure.GetShortUIName]"
 ep3_laamp_decision_event.1037.e.failure.tt: "[laamp_hooded_figure.GetShortUIName] začne tě ignorovat"
 ep3_laamp_decision_event.1037.f: "„[Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')] bys mě naučit tomu řemeslu?“"
 ep3_laamp_decision_event.1037.g: "„Ty a já spolu bychom toto království #EMP ovládli#!, [laamp_hooded_figure.GetFirstNameNoTooltip].“"
 ep3_laamp_decision_event.1037.h: "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1040.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: prostranství [visiting_location.GetCounty.GetFaith.HouseOfWorship|U]"
 ep3_laamp_decision_event.1040.desc_returned_01: "Zpátky na prostranství [visiting_location.GetCounty.GetFaith.HouseOfWorship] je všechno jako dřív. Jak slunce pomalu putuje po obloze, sousední budovy střídavě vrhají stín na otevřené náměstí."
 ep3_laamp_decision_event.1040.desc_returned_02: "Intenzivní vůně kadidla se neúprosně vtírá do mých nosních dírek, když se znovu procházím sluncem na prostranství [visiting_location.GetCounty.GetFaith.HouseOfWorship]."
 ep3_laamp_decision_event.1040.desc_returned_from_healer: "Mžourám, když vystupuji z šera léčitelovy boudy a nacházím cestu zpět na náměstí [visiting_location.GetCounty.GetFaith.HouseOfWorship]."
 ep3_laamp_decision_event.1040.desc_returned_from_church: "Když znovu procházím branami svatostánku ([visiting_location.GetCounty.GetFaith.HouseOfWorship|l]), provází mě idylický klid, a tak se ocitám zpátky na náměstí před ním."
 ep3_laamp_decision_event.1040.desc_returned_from_garden: "Vrátím se ze tichého zahradního koutku lehčí na duši a rozhlížím se po rušném náměstí [visiting_location.GetCounty.GetFaith.HouseOfWorship]."
 ep3_laamp_decision_event.1040.desc_returned_from_physician: "Klikatými uličkami se vracím od pracovny [laamp_physician_recruit.Custom('CZ_FirstNameNoTooltip_G')] a ocitám se zpátky na prostranství před svatostánkem ([visiting_location.GetCounty.GetFaith.HouseOfWorship|l])."
 ep3_laamp_decision_event.1040.desc: "Na náměstí [visiting_location.GetCounty.GetFaith.HouseOfWorship] panuje jakési klidné ticho, přestože je zde spousta obchodu, [visiting_location.GetCounty.GetFaith.PriestNeuterPlural] a pomocníků.\n\nUprostřed se vypíná honosný [visiting_location.GetCounty.GetFaith.HouseOfWorship] a po stranách vidím nápisy s odvážnými sliby uzdravení i přístavek se zahrádkou pro tiché rozjímání o tom, co učí [visiting_location.GetCounty.GetFaith.HighGodName]."
 ep3_laamp_decision_event.1040.desc_outro_physician_sickly_minor: "\n\nNa okraji náměstí káže oddanec o lepším tělesném zdraví; a jak bylo domluveno předem, mé nemocné [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1040_sickly_minor'))] [1040_sickly_minor.GetFirstName] bylo doprovázeno a čeká na mě u léčitelovy boudy."
 ep3_laamp_decision_event.1040.desc_outro_physician: "\n\nNa okraji náměstí [Select_CString(laamp_physician_recruit.IsFemale,'jakási zbožná žena','jakýsi zbožný muž')] káže, že lepší tělesné zdraví prospěje i zdraví duchovnímu. Navzdory občasnému pokřikování davu si stojí za svým."
 ep3_laamp_decision_event.1040.desc_outro_sickly_minor: "\n\nJak bylo domluveno s jedním z pomocníků u tábora, mé nemocné [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1040_sickly_minor'))] [1040_sickly_minor.GetFirstName] bylo doprovázeno a čeká na mě u léčitelovy boudy."
 ep3_laamp_decision_event.1040.desc_outro_partner: "\n\n[visiting_partner.GetFirstName|U] přikývne s uznáním a rozhlíží se po rušném náměstí, již si prohlížejíc podivné stánky a zajímavosti."
 ep3_laamp_decision_event.1040.desc_outro: "\n\nCítím se spokojeně, dívám se po náměstí a několikrát zhluboka vydechnu, když přemýšlím o dalším cíli."
 ep3_laamp_decision_event.1040.desc_outro_return_partner_finished: "\n\n[visiting_partner.GetFirstName|U], [Select_CString(visiting_partner.IsFemale,'která','který')] začíná vypadat trochu unaveně, říká: „Nejsem zvyklý si stěžovat, ale... už jsme tady přece hotovi, [visiting_partner.Custom2('RelationToMe', ROOT.Char)]?“"
 ep3_laamp_decision_event.1040.desc_outro_return_finished: "\n\nPo strávení značného času zde na náměstí [visiting_location.GetCounty.GetFaith.HouseOfWorship] jsem spokojený(á) s dnešními jednáními a hledám nejrychlejší cestu zpět na hlavní náměstí."
 ep3_laamp_decision_event.1040.desc_outro_physician_return: "\n\nKázající oddanec dál hlásá [Select_CString(laamp_physician_recruit.IsFemale,'její','jeho')] učení o zdraví, ale zdá se, že přednáška se chýlí ke konci."
 ep3_laamp_decision_event.1040.desc_outro_sickly_minor_return: "\n\nZ nějakého důvodu je teď na náměstí spousta dětí. Byly tu celou dobu? Hrají si a pošťuchují se, pořád vymýšlejí nové způsoby, jak dělat staré věci, často k překvapení a nelibosti těch, kdo na ně dohlížejí.\n\nMyšlenkami se stále vracím ke zdraví [1040_sickly_minor.Custom('CZ_FirstName_G')], zatímco se rozhlížím po náměstí, kam dál."
 ep3_laamp_decision_event.1040.desc_outro_return_partner_01: "\n\nNa levé straně [visiting_partner.GetFirstName] zvědavě zkoumá stánek pokrytý nejmenšími lahvičkami — údajně naplněnými kapkami jedu z [ROOT.Char.Custom('VenomousCreature')].\n\nJen ta představa mi běhá mráz po zádech, zatímco se snažím rozhodnout, kam jít dál."
 ep3_laamp_decision_event.1040.desc_outro_return_partner_02: "\n\n[visiting_partner.GetFirstName|U] do mě šťouchne a ukazuje na stráže, které z prostranství vyvádějí [Select_CString(ROOT.Char.IsFemale,'otrhanou ženu','otrhaného muže')] vykřikující o konci světa.\n\nMimoděk povytáhnu obočí a sleduji ten rozruch, zatímco zvažuji, co dál."
 ep3_laamp_decision_event.1040.desc_outro_return_partner_03: "\n\n[visiting_partner.GetFirstName|U] mi při přechodu náměstím podá kousek najídla.\n\nRozvážně žvýkám usušené příděly a přemýšlím, jaký bude další tah."
 ep3_laamp_decision_event.1040.desc_outro_return_01: "\n\nV zastíněném rohu náměstí se šarlatán snaží [Select_CString(ROOT.Char.IsFemale,'jakousi urozenou dámu','jakéhosi urozeného pána')] přesvědčit o léčivých účincích červeného písku.\n\nLedabyle sleduji jejich handrkování a přemýšlím o dalším kroku."
 ep3_laamp_decision_event.1040.desc_outro_return_02: "\n\nU nedalekého stánku s obsidiánovými zrcadly se [visiting_location.GetCounty.GetFaith.PriestNeuter|l] snaží skrýt vzrušení nad tím, že si konečně může prohlédnout [Select_CString(ROOT.Char.IsFemale,'sama','sám')] sebe.\n\nTrochu pobaveně se rozhoduji, kam dál."
 ep3_laamp_decision_event.1040.desc_outro_return_03: "\n\nU malé rotundy šarlatán nosící opis [ROOT.Char.Custom('RandomReligiousTextName')] čte nahlas z textu pro skromné posluchače.\n\nPovrchně naslouchám a rozhlížím se po náměstí, přemýšlejíc, co udělat dál."
 ep3_laamp_decision_event.1040.a: "Léčitelé by mi jistě prospěli."
 ep3_laamp_decision_event.1040.a_sickly_minor: "Měli bychom zamířit k léčitelově boudě!"
 ep3_laamp_decision_event.1040.a_second: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych se vrátit k léčiteli."
 ep3_laamp_decision_event.1040.a_second_sickly_minor: "[1040_sickly_minor.GetFirstNameNoTooltip] stále čeká u léčitelovy boudy."
 ep3_laamp_decision_event.1040.a.tt: "Jít k léčitelově boudě"
 ep3_laamp_decision_event.1040.a.cooldown.tt: "Léčitel je na pochůzkách po zbytek této návštěvy"
 ep3_laamp_decision_event.1040.b: "To [visiting_location.GetCounty.GetFaith.HouseOfWorship] vypadá zajímavě."
 ep3_laamp_decision_event.1040.b_second: "Vraťme se do [visiting_location.GetCounty.GetFaith.HouseOfWorship]."
 ep3_laamp_decision_event.1040.b.tt: "Vstoupit do [visiting_location.GetCounty.GetFaith.HouseOfWorship]"
 ep3_laamp_decision_event.1040.b.cooldown.tt: "[visiting_location.GetCounty.GetFaith.HouseOfWorship] je po zbytek této návštěvy obsazeno obřadem"
 caught_stealing.tt: "Nedávno tě přistihli při krádeži na svatém místě – máš zákaz vstupu do [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1040_caught_stealing') )]"
 ep3_laamp_decision_event.1040.c: "Procházka zahradou neuškodí."
 ep3_laamp_decision_event.1040.c_second: "Musím se znovu projít zahradou."
 ep3_laamp_decision_event.1040.c.tt: "Navštívit přilehlou zahradu"
 ep3_laamp_decision_event.1040.c.cooldown.tt: "Zahrada je po zbytek této návštěvy plná lidí"
 ep3_laamp_decision_event.1040.d: "Možná má kazatel pravdu?"
 ep3_laamp_decision_event.1040.d_second: "Další rozhovor s [laamp_physician_recruit.Custom('CZ_FirstNameNoTooltip_I')] neuškodí."
 ep3_laamp_decision_event.1040.d.tt: "Promluvit si s lékařem [laamp_physician_recruit.GetShortUIName]"
 ep3_laamp_decision_event.1040.e: "$ep3_laamp_decision_event.1010.e$"
 ep3_laamp_decision_event.1040.e_second: "Tady už jsme hotovi."
 ep3_laamp_decision_event.1041.return.tt: "Vrátíte se na pozemky [visiting_location.GetCounty.GetFaith.HouseOfWorship]"
 ep3_laamp_decision_event.1041.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: léčitel"
 ep3_laamp_decision_event.1041.desc_returned_sickly_minor: "[1040_sickly_minor.GetFirstName] odpočívá na měkkém lůžku u kamen v rohu léčitelovy chýše a čeká na můj návrat. Instinktivně se skloním, abych [Select_CString(ROOT.Char.IsFemale,'zkontrolovala','zkontroloval')], jak dýchá, a pohladím [Select_CString(1040_sickly_minor.IsFemale,'ji','ho')] po vlasech.\n\n[laamp_healer_character.GetFirstName|U] odloží psací náčiní ([ROOT.Char.Custom('WritingInstrument')|l]) a vážně se na mě podívá: „Tak jak jsme se rozhodli?“"
 ep3_laamp_decision_event.1041.desc_returned_physician_partner: "Když vejdeme do léčitelovy chýše, [laamp_healer_character.GetFirstName] se zrovna zaobírá nějakými bylinami, ale když scházíme po schodech, vzhlédne: „Á, tak jste si to [Select_CString(ROOT.Char.IsFemale,'rozmyslela','rozmyslel')]?“\n\nPo mé levici [visiting_partner.GetFirstNameNoTooltip] přešlapuje z nohy na nohu a pořád touží zkusit si zákrok, který jsme předtím viděli [laamp_healer_character.Custom('CZ_FirstNameNoTooltip_A')] provádět."
 ep3_laamp_decision_event.1041.desc_returned_01: "Když sejdu po schodech do léčitelovy chýše, [laamp_healer_character.GetFirstName] se zrovna stará o jiného pacienta. Pohlédne na mě a pokyne pacientovi, ať se posadí na lůžko hlouběji v místnosti.\n\nPak zatáhne provizorní závěs z obnošeného prostěradla, aby měl pacient i my trochu soukromí.\n\n„Vidím, že jste se [Select_CString(ROOT.Char.IsFemale,'vrátila','vrátil')],“ poznamená věcně. „Potřebujete s něčím pomoct?“"
 ep3_laamp_decision_event.1041.desc_returned_02: "Když znovu sestoupím do šeré léčitelovy chýše, [laamp_healer_character.GetFirstName] sedí hlouběji v místnosti a listuje jakýmsi ošoupaným deníkem. Z dálky to není dobře vidět, ale zdá se, že obsahuje nákresy lidského těla.\n\nOpatrně deník zavře, uklidí ho, pak se na mě podívá a klidně pronese: „Á, tak jste zpátky. Nakonec jste přece jen [Select_CString(ROOT.Char.IsFemale,'našla','našel')] nějaký neduh?“"
 ep3_laamp_decision_event.1041.desc_sickly_minor: "[Select_CString(1040_sickly_minor.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1040_sickly_minor'))|l] [1040_sickly_minor.GetFirstName], [Select_CString(1040_sickly_minor.IsFemale,'která je nemocná','který je nemocný')], se mnou přichází do léčitelovy chýše. Když [Select_CString(1040_sickly_minor.IsFemale,'ji','ho')] nesu dolů po schodech, ztěžka kašle.\n\n[Select_CString(laamp_healer_character.IsFemale,'Léčitelka','Léčitel')] [laamp_healer_character.GetFirstName] vstane z dřevěné stoličky a vážně se na mě podívá: „Budete potřebovat mé služby?“"
 ep3_laamp_decision_event.1041.desc_physician_partner: "Když vejdeme do léčitelovy chýše, [laamp_healer_character.GetFirstName] právě provádí očistný zákrok na [Select_CString(ROOT.Char.IsFemale,'jakési starší ženě','jakémsi starším muži')]. [visiting_partner.GetFirstName|U] [laamp_healer_character.Custom('CZ_FirstNameNoTooltip_A')] dychtivě pozoruje a v očích [Select_CString(visiting_partner.IsFemale,'jí','mu')] svítí nadšení: „#EMP Tohle#! bych si docela [Select_CString(visiting_partner.IsFemale,'ráda','rád')] [Select_CString(visiting_partner.IsFemale,'zkusila','zkusil')]...“\n\n[laamp_healer_character.GetFirstNameNoTooltip|U] zvedne hlavu, když zaslechne naše hlasy: „[Select_CString(laamp_healer_character.IsFemale,'Nevšimla','Nevšiml')] jsem si vás! Trápí vás něco?“"
 ep3_laamp_decision_event.1041_intro: "Světlo je tlumenější a v léčitelově chatrči je zřetelný #EMP pach#!. Ne #EMP nepříjemný#!, ale pronikavý.\n\n[laamp_healer_character.GetFirstName|U] stojí u vysokého stolu a připravuje nějaký odvar."
 ep3_laamp_decision_event.1041.desc_reused_healer: "$ep3_laamp_decision_event.1041_intro$ Vzhlédne a lehce povytáhne obočí: „Vidím, že jste se [Select_CString(ROOT.Char.IsFemale,'vrátila','vrátil')] v jednom kuse! Jak vám tentokrát mohu pomoci?“"
 ep3_laamp_decision_event.1041.desc: "$ep3_laamp_decision_event.1041_intro$ Když se přiblížím, vzhlédne: „Dobrý den. Jak jsou na tom vaše šťávy? Nepotřebujete trochu pročistit?“"
 ep3_laamp_decision_event.1041.desc_outro_return_horn: "\n\nO něco dále v místnosti odpočívá nádherný artefakt „[1041_health_artifact.GetName]“ spolu s ostatními léčivými předměty."
 ep3_laamp_decision_event.1041.desc_outro_return_artifact: "\n\nO něco dále v místnosti [1041_health_artifact.GetName] stále přitahuje mou pozornost."
 ep3_laamp_decision_event.1041.desc_outro_horn: "\n\nZ okraje zorného pole spatřím několik léčivých cetek, z nichž mne upoutá nádherný roh."
 ep3_laamp_decision_event.1041.desc_outro_artifact: "\n\nO něco dál v místnosti, na polici plné léčivých cetek, spatřím zajímavý artefakt „[1041_health_artifact.GetName]“, který si žádá mou pozornost."
 ep3_laamp_decision_event.1041.a: "Možná by mi prospělo vyrovnání humorů."
 ep3_laamp_decision_event.1041.a_ill: "„Já... opravdu bych [Select_CString(ROOT.Char.IsFemale,'potřebovala','potřeboval')] nějaké ošetření, ano.“"
 ep3_laamp_decision_event.1041.b: "„Zajímá mě ten artefakt ‚[1041_health_artifact.GetNameNoTooltip]‘.“"
 ep3_laamp_decision_event.1041.c: "„[Select_CString(ROOT.Char.IsFemale,'Provedla','Provedl')] bys ten zákrok #EMP ty#!, [visiting_partner.Custom('CZ_FirstNameNoTooltip_V')]?“"
 ep3_laamp_decision_event.1041.c.flavor: "Co je nejhorší, co se může stát!"
 ep3_laamp_decision_event.1041.d: "„[1040_sickly_minor.GetFirstNameNoTooltip|U], [Select_CString(1040_sickly_minor.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('1040_sickly_minor'))|l], potřebuje léčbu!“"
 ep3_laamp_decision_event.1041.d.partner: "„[visiting_partner.GetFirstNameNoTooltip|U], [Select_CString(visiting_partner.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_partner'))|l], potřebuje léčbu!“"
 ep3_laamp_decision_event.1041.treatment_success.t: "Úspěch"
 ep3_laamp_decision_event.1041.treatment_failure.t: "Neúspěšné"
 ep3_laamp_decision_event.1041.treatment_failure.desc: "Ošetření je neúspěšné"
 ep3_laamp_decision_event.1041.e: "$ep3_laamp_decision_event.1021.d$"
