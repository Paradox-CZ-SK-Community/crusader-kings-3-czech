 ep3_laamp_decision_event.1055.alert_partial.tt: "#alert_trial \n$BULLET_WITH_TAB$Regimenty budou částečně doplněny!"
 ep3_laamp_decision_event.1057.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: tělesná stráž"
 ep3_laamp_decision_event.1057.desc_returned_01: "Když se vrátím do uličky, kde jsem [Select_CString(ROOT.Char.IsFemale,'nechala','nechal')] [Select_CString(laamp_bodyguard_recruit.IsFemale,'bývalou tělesnou strážkyni','bývalého tělesného strážce')] [laamp_bodyguard_recruit.Custom('CZ_FirstName_A')], zrovna si nenuceně povídá se svým zaměstnavatelem, místním řezníkem.\n\nKdyž se přiblížím, kamarádský hovor ukončí a řezník [Select_CString(laamp_bodyguard_recruit.IsFemale,'ji','ho')] přátelsky poplácá, než zajde dovnitř.\n\n[laamp_bodyguard_recruit.GetFirstNameNoTooltip|U] se ke mně otočí, teď už s jiskřičkou vlídnosti v očích: „Á. Jste zpátky. [Select_CString(ROOT.Char.IsFemale,'Chtěla','Chtěl')] jste něco?“"
 ep3_laamp_decision_event.1057.desc_returned_02: "[Select_CString(laamp_bodyguard_recruit.IsFemale,'Bývalá tělesná strážkyně','Bývalý tělesný strážce')] [laamp_bodyguard_recruit.GetFirstName] vzhlédne, když se vracím do uličky, kde se věnuje svému novému řemeslu.\n\nNůž tančí vzduchem, jak porcuje další zvířecí zdechlinu na úhledné filety, a já před tou intenzitou bezděčně o krok ustoupím.\n\nUpře na mě mrtvý pohled a hlasem zbaveným citu se zeptá: „...ano?“"
 ep3_laamp_decision_event.1057.desc_returned_03: "Zpátky v uličce sedí [laamp_bodyguard_recruit.GetFirstName] na prázdném voze a ošetřuje si ránu na kotníku prstu, nejspíš z potyčky s někým, komu vadí [Select_CString(laamp_bodyguard_recruit.IsFemale,'její','jeho')] pověst.\n\nS grimasou vezme mou přítomnost na vědomí: „Á, vidíte mě vždycky jen v mých nejslavnějších chvílích, co?“ Opře se a povzdechne si. „Něco jste [Select_CString(ROOT.Char.IsFemale,'zapomněla','zapomněl')]?“"
 ep3_laamp_decision_event.1057.desc_reused_bodyguard: "[Select_CString(laamp_bodyguard_recruit.IsFemale,'Tu křičící ženu','Toho křičícího muže')] matně poznávám, a když obviňující dav odejde, následuji [laamp_bodyguard_recruit.Custom('CZ_FirstName_A')] do uličky.$ep3_laamp_decision_event.1057.desc_mid$\n\n[Select_CString(laamp_bodyguard_recruit.IsFemale,'Zneuctěná strážkyně','Zneuctěný strážce')] přimhouří oči, když se přibližuji: „Počkej, [Select_CString(laamp_bodyguard_recruit.IsFemale,'neviděla','neviděl')] jsem tě už někde...?“ Zašklebí se. „To je jedno. Co chceš?“"
 ep3_laamp_decision_event.1057.desc: "Z křiku zachytím jméno [laamp_bodyguard_recruit.GetFirstName], a když obviňující [laamp_bodyguard_recruit.GetWomenMen] odcházejí, následuji [laamp_bodyguard_recruit.Custom('CZ_FirstNameNoTooltip_A')] do uličky.$ep3_laamp_decision_event.1057.desc_mid$\n\n[Select_CString(laamp_bodyguard_recruit.IsFemale,'Zneuctěná tělesná strážkyně','Zneuctěný tělesný strážce')] mi při přiblížení věnuje opovržlivý pohled a říká: „Co chceš? [Select_CString(laamp_bodyguard_recruit.IsFemale,'Nedokázala','Nedokázal')] jsem udržet ani ten zatracený #EMP květ#! naživu...“"
 ep3_laamp_decision_event.1057.desc_mid: "\n\nHned začne z ošuntělého vozu vykládat zvířecí zdechliny a mumlá si pro sebe: „...#EMP jeden#! šlechtic ti umře na hlídce a... jak jsem #EMP já#! [Select_CString(laamp_bodyguard_recruit.IsFemale,'měla','měl')] vědět, že to pití ([laamp_bodyguard_recruit.Custom('RegionalDrink')|l]) bylo...“ Frustrovaně udeří pěstí do vozu."
 ep3_laamp_decision_event.1057.a: "$ep3_laamp_decision_event.1047.a$"
 ep3_laamp_decision_event.1057.b: "„Vidíš tyhle svaly? Vlastně bych to [Select_CString(laamp_bodyguard_recruit.IsFemale,'byla','byl')] #EMP já#!, kdo by chránil #EMP tebe#!.“"
 ep3_laamp_decision_event.1057.c: "„Přidej se ke mně a obnovíme tvou reputaci!“"
 ep3_laamp_decision_event.1057.c.success: "[laamp_bodyguard_recruit.GetShortUIName] je přesvědčen"
 ep3_laamp_decision_event.1057.c.failure: "Nepodařilo se ti přemluvit [laamp_bodyguard_recruit.GetShortUIName]"
 ep3_laamp_decision_event.1057.c.failure.tt: "[laamp_bodyguard_recruit.GetShortUIName] tě začne ignorovat"
 ep3_laamp_decision_event.1057.d: "„To je tvoje šance na #EMP vykoupení.#!“"
 ep3_laamp_decision_event.1057.e: "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1060.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: řemeslnická čtvrť"
 ep3_laamp_decision_event.1060.desc_returned_01: "Slunce je vysoko nad řemeslnickou čtvrtí, když se vracím mezi množství zvuků, pohledů a pachů."
 ep3_laamp_decision_event.1060.desc_returned_02: "Mráček zjemňuje světlo nad řemeslnickou čtvrtí a vracím se k útočnému zápachu, když si uvědomím, že jsem se cestou zpět [Select_CString(ROOT.Char.IsFemale,'přiblížila','přiblížil')] příliš blízko ke koželužně."
 ep3_laamp_decision_event.1060.desc_returned_from_weaponsmith: "Když se vracím od zbrojíře, různorodí řemeslníci a jejich pomocníci stále v plném proudu překládají náklad tam a zpět."
 ep3_laamp_decision_event.1060.desc_returned_from_armorer: "Pot z kovárny mi pomalu stéká po zádech a při návratu do řemeslnické čtvrti mě potěší chladivý vánek."
 ep3_laamp_decision_event.1060.desc_returned_from_jeweler: "Zažmouřím oči proti ohromujícímu jasu náměstí, když vyjdu z klenotnictví na náměstí řemeslnické čtvrti."
 ep3_laamp_decision_event.1060.desc_returned_from_quartermaster: "Vzduch v řemeslnické čtvrti je výrazně méně dusný, když vycházím z zakalené hospody, kde [laamp_quartermaster_recruit.GetFirstName] topí své smutky."
 ep3_laamp_decision_event.1060.desc: "V řemeslnické čtvrti [visiting_location.GetBaronyNameExplicitly] jsou zastoupeny všechny důležité profese — zbrojíř [laamp_weaponsmith_craftsman.GetFirstName] u cvičiště, zbrojíř [laamp_armorer_craftsman.GetFirstName] ve svém kovářství a [laamp_jeweler_craftsman.GetFirstName], klenotník, kousek dál."
 ep3_laamp_decision_event.1060.desc_outro_quartermaster: "\n\nMotá se tu také [Select_CString(laamp_quartermaster_recruit.IsFemale,'otrhaná, rezignovaná žena','otrhaný, rezignovaný muž')]. Podívá se na mě a dotčeně zavrčí: „Kdysi jsem [Select_CString(laamp_quartermaster_recruit.IsFemale,'byla','byl')] #EMP někdo!#! Jsem [laamp_quartermaster_recruit.GetFirstName], #EMP [Select_CString(laamp_quartermaster_recruit.IsFemale,'proviantní důstojnice','proviantní důstojník')] [visiting_location.GetTitle.GetHolder.GetTopLiege.Custom('CZ_TitleAsNameNoTooltip_G')]!#!“ Pak se uklidní a zjevně se ponoří do myšlenek."
 ep3_laamp_decision_event.1060.desc_outro_partner: "\n\n[visiting_partner.GetFirstName|U] jde za mnou, líně se prochází ulicí a komentuje vystavené zboží. Když se zastavím a rozmýšlím, kam dál, podívá se na mě."
 ep3_laamp_decision_event.1060.desc_outro: "\n\nNa chvíli se zastavím a vnímám děti hrající si mezi surovinami. Jejich rodiče je jemně zahánějí pryč, zatímco já se rozhodnu, kam dál."
 ep3_laamp_decision_event.1060.desc_outro_return_partner_finished: "$ep3_laamp_decision_event.1040.desc_outro_return_partner_finished$"
 ep3_laamp_decision_event.1060.desc_outro_return_finished: "\n\nS unavenýma nohama a kručícím žaludkem [Select_CString(ROOT.Char.IsFemale,'byla','byl')] den v řemeslnické čtvrti plodný. Rozhlížím se po nejrychlejší cestě zpět na hlavní náměstí."
 ep3_laamp_decision_event.1060.desc_outro_quartermaster_return: "\n\nZatímco přemýšlím o dalším cíli, pozoruji [Select_CString(laamp_quartermaster_recruit.IsFemale,'bývalou vojenskou maršálku','bývalého vojenského maršála')] [laamp_quartermaster_recruit.Custom('CZ_FirstName_A')], [Select_CString(laamp_quartermaster_recruit.IsFemale,'která','který')] stále bezcílně bloumá po náměstí."
 ep3_laamp_decision_event.1060.desc_outro_return_partner_01: "\n\n[visiting_partner.GetFirstName|U] větří, rychle kličkuje náměstím mezi kolemjdoucími a snaží se se mnou udržet krok.\n\nDožene mě, když se na okamžik zastavím a rozvažuji, co dál."
 ep3_laamp_decision_event.1060.desc_outro_return_partner_02: "\n\nPo mé levici [visiting_partner.GetFirstName] zvědavě zkoumá trhový stánek pokrytý kůžemi [ROOT.Char.Custom('RegionalFerociousAnimal')] všech tvarů, velikostí a barev.\n\nPřibitá hlava jednoho takového tvora se na mě ušklíbne, když hledím dolů po ulici a snažím se rozhodnout, kam se vydat dál."
 ep3_laamp_decision_event.1060.desc_outro_return_partner_03: "\n\n[visiting_partner.GetFirstName|U] nenuceně přechází po náměstí sem a tam a prohlíží si stánky. Nepřítomně [Select_CString(visiting_partner.IsFemale,'ji','ho')] sleduji a přemýšlím, co dál."
 ep3_laamp_decision_event.1060.desc_outro_return_01: "\n\nBezmyšlenkovitě se rozhlížím po náměstí s prázdným výrazem, zatímco přemýšlím, kam se vydat dál."
 ep3_laamp_decision_event.1060.desc_outro_return_02: "\n\nNěkteré děti si hrají s velkým [ROOT.Char.Custom('get_region_dog_type')], krmí ho zbytky a střídají se při jízdě na jeho svalnatém hřbetu.\n\nLehce pozoruji jejich hru, zatímco zvažuji další krok."
 ep3_laamp_decision_event.1060.desc_outro_return_03: "\n\nSkupina dětí našla velký kus rudy a kopou s ním sem a tam po ulici, následují nějaká svá nejasná pravidla.\n\nS fascinací je pozoruji, zatímco pečlivě zvažuji další plán."
 ep3_laamp_decision_event.1060.a: "Zbraně se teď nejvíce hodí."
 ep3_laamp_decision_event.1060.a_second: "Ty zbraně vypadaly zajímavě."
 ep3_laamp_decision_event.1060.a.tt: "Přejít ke stánku zbrojíře"
 ep3_laamp_decision_event.1060.a.cooldown.tt: "Při této návštěvě už jsi [Select_CString(GetPlayer.IsFemale,'koupila','koupil')] zbraň ([Concept('artifact','artefakt')|E])"
 ep3_laamp_decision_event.1060.b: "Mé brnění potřebuje vylepšení."
 ep3_laamp_decision_event.1060.b_second: "Zbrojíř [Select_CString(ROOT.Char.IsFemale,'měla','měl')] několik vhodných kousků."
 ep3_laamp_decision_event.1060.b.tt: "Jít do zbrojířovy kovárny"
 ep3_laamp_decision_event.1060.b.cooldown.tt: "Při této návštěvě už jsi [Select_CString(GetPlayer.IsFemale,'koupila','koupil')] zbroj ([Concept('artifact','artefakt')|E])"
 recruited_armorer.tt: "[laamp_armorer_craftsman.GetShortUIName] se právě stěhuje do tvého tábora"
 ep3_laamp_decision_event.1060.c: "Mám zájem o doplňky."
 ep3_laamp_decision_event.1060.c_second: "Musím se znovu podívat do klenotnictví."
 ep3_laamp_decision_event.1060.c.tt: "Přejít do klenotnického obydlí"
 ep3_laamp_decision_event.1060.c.cooldown.tt: "Při této návštěvě už jsi [Select_CString(GetPlayer.IsFemale,'koupila','koupil')] šperk ([Concept('artifact','artefakt')|E])"
 ep3_laamp_decision_event.1060.d: "Pojďme si promluvit s #EMP panem#! [laamp_quartermaster_recruit.GetFirstNameNoTooltip]."
 ep3_laamp_decision_event.1060.d_second: "Měli bychom znovu navštívit zásobovače [laamp_quartermaster_recruit.GetFirstNameNoTooltip]."
 ep3_laamp_decision_event.1060.d.tt: "Přistoupit k [laamp_quartermaster_recruit.Custom('CZ_ShortUIName_D')]"
 ep3_laamp_decision_event.1060.e: "$ep3_laamp_decision_event.1010.e$"
 ep3_laamp_decision_event.1060.e_second: "$ep3_laamp_decision_event.1040.e_second$"
 ep3_laamp_decision_event.1061.return.tt: "Vrátíte se do řemeslnické čtvrti"
 ep3_laamp_decision_event.1061.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: zbrojíř"
 ep3_laamp_decision_event.1061.desc_returned_01: "Zpátky na cvičišti stojí [Select_CString(laamp_weaponsmith_craftsman.IsFemale,'zbrojířka','zbrojíř')] [laamp_weaponsmith_craftsman.GetFirstName] pořád u svého stánku a měkkým hadříkem jemně leští jednu ze zbraní.\n\nPřitom si pobrukuje, ale jakmile přijdu, hned přestane. „Tak sis nakonec přece [Select_CString(ROOT.Char.IsFemale,'našla','našel')] něco k probodnutí?“ prohodí bez špetky vlídnosti."
 ep3_laamp_decision_event.1061.desc_returned_02: "Když se vracím ke [Select_CString(laamp_weaponsmith_craftsman.IsFemale,'zbrojířce','zbrojíři')], [laamp_weaponsmith_craftsman.GetFirstName] si zrovna [Select_CString(laamp_weaponsmith_craftsman.IsFemale,'vytáhla','vytáhl')] z brašny u pasu něco k snědku a s chutí to uždibuje po malých kouscích.\n\nKdyž si mě všimne, pečlivě si opráší drobky z pláště, vstane a věnuje mi nevyzpytatelný pohled: „[Select_CString(ROOT.Char.IsFemale,'Rozmyslela','Rozmyslel')] sis to?“"
 ep3_laamp_decision_event.1061.desc_intro: "Zbrojíř [laamp_weaponsmith_craftsman.GetFirstName], v lehkém hovoru s několika poblíž stojícími služebníky, stojí u provizorního stánku u cvičiště."
 ep3_laamp_decision_event.1061.desc_reused_weaponsmith: "$ep3_laamp_decision_event.1061.desc_intro$\n\nVrhne na mě poznávací pohled, povytáhne obočí a udělá ke mně pár kroků: „Ale, ale, stálýho zákazníka člověk nevidí každej den!“\n\n„Prosím, prohlídni si, co nabízím,“ řekne a pokusí se o úsměv."
 ep3_laamp_decision_event.1061.desc: "$ep3_laamp_decision_event.1061.desc_intro$\n\nVrhne na mě pohled, rychle ukončí rozhovor, obrátí se ke mně a ukáže na vystavené zbraně: „Tohle sou kusy, co mám na prodej.“\n\n„Kalený v tom nejžhavějším ohni,“ dodá s pýchou v hlase."
 ep3_laamp_decision_event.1061.a: "„Musím říct, [1061_first_weapon.GetNameNoTooltip] vypadá jako dobrá volba.“"
 ep3_laamp_decision_event.1061.b: "„Moc by se mi líbil [1061_second_weapon.GetNameNoTooltip].“"
 ep3_laamp_decision_event.1061.c: "„[1061_third_weapon.GetNameNoTooltip|U] je #EMP můj#! druh zbraně.“"
 ep3_laamp_decision_event.1061.d: "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1063.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: zbrojíř"
 ep3_laamp_decision_event.1063.desc_returned_01: "[laamp_armorer_craftsman.GetFirstName] si dává pauzu od jednotvárného tlučení. Chodí po dílně a zjevně něco hledá: „Kleště,“ zabručí, „nikdy nejsou tam, kde je necháš.“\n\nPak [laamp_armorer_craftsman.GetFirstNameNoTooltip] obrátí pozornost ke mně a kývne k vystaveným kusům zbroje: „Tak co?“"
 ep3_laamp_decision_event.1063.desc_returned_02: "Pec je tentokrát trochu méně rozpálená, protože [laamp_armorer_craftsman.GetFirstName] opravuje jiný kus kovu a jemně prohýbá ocel do žádoucí podoby.\n\nAbych [Select_CString(laamp_armorer_craftsman.IsFemale,'její','jeho')] postup [Select_CString(ROOT.Char.IsFemale,'nerušila','nerušil')], přistoupím blíž a pokračuji v prohlížení kusů brnění na pracovním stole.\n\n„Potřebuješ tedy nějakou ochranu, jak vidím?“ poznamená [laamp_armorer_craftsman.GetFirstNameNoTooltip] s pobaveným tónem."
 ep3_laamp_decision_event.1063.desc_reused_armorer: "Kovárna [laamp_armorer_craftsman.Custom('CZ_FirstName_G')] je přesně taková, jak si ji pamatuji. Pohled mi okamžitě padne na ponk na druhém konci místnosti, kde má kusy zbroje na prodej.\n\nKdyž vzhlédne od krunýře, na kterém pracuje, a pozná mě, v očích [Select_CString(laamp_armorer_craftsman.IsFemale,'jí','mu')] se objeví pobavení: „Stálej zákazník! [Select_CString(ROOT.Char.IsFemale,'Našela','Našel')] sis něco?“"
 ep3_laamp_decision_event.1063.desc: "V kovárně [Select_CString(laamp_armorer_craftsman.IsFemale,'zbrojířky','zbrojíře')] [laamp_armorer_craftsman.Custom('CZ_FirstName_G')] pec naplno žhne a vzduch je tak hustý, že se špatně dýchá.\n\nVěnuje mi krátký pohled, zasadí poslední úder kladivem do dokonale hladké přilby s kroužkovým závěsem, pak přistoupí a otře si ruce.\n\n„Co mám na prodej, uvidíš tamhle na polici,“ řekne [laamp_armorer_craftsman.GetFirstNameNoTooltip] a ukáže na pevný ponk na druhém konci místnosti."
 ep3_laamp_decision_event.1063.a: "[1063_first_armor.GetNameNoTooltip] má pěkný lesk."
 ep3_laamp_decision_event.1063.b: "Zpracování [1063_second_armor.GetNameNoTooltip] je vynikající."
 ep3_laamp_decision_event.1063.c: "Dávalo by smysl pořídit [1063_third_armor.GetNameNoTooltip]."
 ep3_laamp_decision_event.1063.d: "„Takový talent! [Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] by ses k nám přidat.“"
 ep3_laamp_decision_event.1063.e: "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1065.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: klenotník"
 ep3_laamp_decision_event.1065.desc_returned_01: "V klenotnické dílně se [laamp_jeweler_craftsman.GetFirstName] sklání nad broží posázenou drahokamy ve tvaru nádherného květu ([visiting_location.Custom('get_region_flower_type')]). Když se zaposlouchám, slyším [Select_CString(laamp_jeweler_craftsman.IsFemale,'její','jeho')] vášnivý šepot: „Ano, můj drahocenný kvítku...“\n\nRychle udělám krok, aby zavrzalo prkno v podlaze, a teprve tehdy si mě všimne.\n\n[laamp_jeweler_craftsman.GetFirstNameNoTooltip|U] sebou trhne, rychle se vzpamatuje a zvolá: „Ty zase! Panečku – [Select_CString(ROOT.Char.IsFemale,'rozmyslela','rozmyslel')] sis to?“"
 ep3_laamp_decision_event.1065.desc_returned_02: "Když se vrátím, [laamp_jeweler_craftsman.GetFirstName], držící [ROOT.Char.Custom('WritingInstrument')], právě kontroluje police s šperky a zároveň si dělá inventuru do roztrhaného deníku.\n\nVěnuje mi krátký pohled a řekne: „Zase jsi tady? [Select_CString(ROOT.Char.IsFemale,'Která','Který')] bys [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')]?“ a jde si prohlédnout zbytek polic."
 ep3_laamp_decision_event.1065.desc_reused_jeweler: "[Select_CString(laamp_jeweler_craftsman.IsFemale,'Klenotnice','Klenotník')] [laamp_jeweler_craftsman.GetFirstName] právě upevňuje ozdobu ze dřeva ([visiting_location.Custom('GetRandomRegionalWood')|l]) na malé sošce, když vstoupím do šeré dílny.\n\nVzhlédne, změří si mě a uznale zabručí: „Stálý zákazník. Jak #EMP vzácné!#!“\n\nSe soškou stále v ruce ukáže [laamp_jeweler_craftsman.GetFirstNameNoTooltip] na vystavené předměty: „Co by tě zajímalo tentokrát?“"
 ep3_laamp_decision_event.1065.desc: "V šeru klenotnické dílny se [laamp_jeweler_craftsman.GetFirstName] sklání nad vysokým pultem a nesmírně jemně usazuje drobounkou ozdobu na předmět „[1065_first_accessory.GetName]“.\n\nChvíli [Select_CString(laamp_jeweler_craftsman.IsFemale,'její','jeho')] jemnou práci uhranutě sleduji, než si odkašlu.\n\nVšimne si mě, narovná se a zamyšleně se zeptá: „Sháníš brož? Prsten? Nebo snad náhrdelník?“ a přitom drží jeden z malých artefaktů."
 ep3_laamp_decision_event.1065.a: "„[Select_CString(ROOT.Char.IsFemale,'Neodmítlabych','Neodmítlbych')] ten [1065_first_accessory.GetNameNoTooltip].“"
 ep3_laamp_decision_event.1065.b: "„[1065_second_accessory.GetNameNoTooltip|U] — tohle je #EMP něco pro mě#!“"
 ep3_laamp_decision_event.1065.c: "„[Select_CString(ROOT.Char.IsFemale,'Chtělabych','Chtělbych')] koupit [1065_third_accessory.GetNameNoTooltip].“"
 ep3_laamp_decision_event.1065.d: "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1067.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: zásobovač"
 ep3_laamp_decision_event.1067.desc_returned_01: "[laamp_quartermaster_recruit.GetFirstName] stále sedí v tmavém koutě krčmy a upíjí ze svého poháru ([laamp_quartermaster_recruit.Custom('RegionalDrink')|l]), jako by to byla vstupenka ke spáse.\n\nSotva vzhlédne, když se šerem opatrně prodírám blíž. „Zase ty?“ zamumlá a odvrátí se."
 ep3_laamp_decision_event.1067.desc_returned_02: "[laamp_quartermaster_recruit.GetFirstName] se zrovna hlasitě hádá s jiným hostem krčmy – [Select_CString(ROOT.Char.IsFemale,'vysokou snědou ženou, která','vysokým snědým mužem, který')] zřejmě chce, aby [laamp_quartermaster_recruit.GetFirstNameNoTooltip] #EMP „už konečně [Select_CString(laamp_quartermaster_recruit.IsFemale,'přestala','přestal')] fňukat!“#!\n\nNež se to vyhrotí, [laamp_quartermaster_recruit.GetFirstNameNoTooltip] si mě všimne a s odfrknutím se z hádky vyvlékne.\n\n„Jsi zpátky,“ prohlásí s překvapivě střízlivým výrazem. „Co že jsi to [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')]?“"
 ep3_laamp_decision_event.1067.desc_returned_03: "Když se vracím do krčmy, [laamp_quartermaster_recruit.GetFirstName] tupě zírá do prázdna. Chvíli to trvá, pak zamrká a pomalu zavrtí hlavou.\n\nObsluha před [Select_CString(laamp_quartermaster_recruit.IsFemale,'ni','něj')] postaví další pohár ([laamp_quartermaster_recruit.Custom('RegionalDrink')|l]) a [laamp_quartermaster_recruit.GetFirstNameNoTooltip] se s těžkým povzdechem opře a zakryje si oči dlaní.\n\nOpatrně přistoupím k [Select_CString(laamp_quartermaster_recruit.IsFemale,'bývalé proviantní důstojnici','bývalému proviantnímu důstojníkovi')] a odkašlu si:"
 ep3_laamp_decision_event.1067.desc_reused_quartermaster: "Zatímco se snažím vybavit si, kde jsem [laamp_quartermaster_recruit.Custom('CZ_FirstName_A')] už [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')], bez potíží [Select_CString(laamp_quartermaster_recruit.IsFemale,'ji','ho')] sleduji do jedné z nedalekých zakouřených krčem.\n\nUvnitř si dojde k pultu pro pití, pak se otočí a věnuje mi překvapivě ostrý pohled: „Nedělej, že jsme se ještě nepotkali.“\n\nJedním rázem vyprázdní pohár ([laamp_quartermaster_recruit.Custom('RegionalDrink')|l]) a povytáhne zpocené obočí: „[Select_CString(ROOT.Char.IsFemale,'Chtěla','Chtěl')] jsi něco?“"
 ep3_laamp_decision_event.1067.desc: "Následuji [laamp_quartermaster_recruit.Custom('CZ_FirstName_A')] do nedaleké krčmy. Světlo potemní a smysly mi zahltí pach zkyslého pití.\n\n[laamp_quartermaster_recruit.GetFirstNameNoTooltip|U] se posadí k pultu a objedná si pití. „Kdysi jsem [Select_CString(laamp_quartermaster_recruit.IsFemale,'byla','byl')] někdo...,“ opakuje si jako mantru a ošoupaným nehtem oškrabává pohár.\n\nPřistoupím k [Select_CString(laamp_quartermaster_recruit.IsFemale,'zneuctěné proviantní důstojnici','zneuctěnému proviantnímu důstojníkovi')] a než promluvím, zhluboka se nadechnu:"
 ep3_laamp_decision_event.1067.a: "$ep3_laamp_decision_event.1047.a$"
 ep3_laamp_decision_event.1067.b: "„Mám docela značný počet následovníků, které bys [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] zorganizovat!“"
 not_enough_followers.tt: "Máš méně než #V [EmptyScope.ScriptValue('many_followers_value')|0]#! [Concept('followers','družiníků')|E]"
 ep3_laamp_decision_event.1067.c: "„Vsadím se, že bys v mém táboře [Select_CString(ROOT.Char.IsFemale,'nevydržela','nevydržel')] ani #EMP den#!“"
