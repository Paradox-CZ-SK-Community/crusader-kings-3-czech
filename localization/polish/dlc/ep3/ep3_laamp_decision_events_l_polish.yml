 ep3_laamp_decision_event.1000.i: "Mám tady hotovo. Jdeme zpět do tábora."
 ep3_laamp_decision_event.1000.i_home: "Čas vyrazit domů."
 ep3_laamp_decision_event.1000.i_home_partner: "Pojďme domů, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('visiting_partner'))]."
 ep3_laamp_decision_event.1000.i.tt: "Opustit [visiting_location.GetBaronyNameExplicitlyNoTooltip]"
 ep3_laamp_decision_event.1001.desc_intro_return_finished: "Tato část [ROOT.Char.Custom('GetMainsquareCommons')] se nějak ochladila a lidé se buď vrátili do svých obydlí, nebo se přemístili do jiných částí [ROOT.Char.Custom('SettlementCity')|l]."
 ep3_laamp_decision_event.1001.desc_intro_returned_from_supplies: "Když se vracíme od kupce se zásobami, prohání se po [ROOT.Char.Custom('GetMainsquareCommons')|l] [visiting_location.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] odpolední vánek."
 ep3_laamp_decision_event.1001.desc_intro_returned_from_assaulting_supplies: "Stráže se mnou manipulovaly dost drsně, naštěstí nic nerozbili, když mě přivezli zpět na [ROOT.Char.Custom('GetMainsquareCommons')]."
 ep3_laamp_decision_event.1001.desc_intro_returned_from_artifacts: "Když se vracíme od prodejců artefaktů, i další lidé se vracejí z různých částí [ROOT.Char.Custom('SettlementCity')|l] a příliv návštěvníků na [ROOT.Char.Custom('GetMainsquareCommons')] je značný."
 ep3_laamp_decision_event.1001.desc_intro_returned_from_contract: "Pomalu se vracím od [ROOT.Char.Custom('GetTowncrierElder')], chvíli pozoruji oblohu a pak zjistím, že jsem zpět na [ROOT.Char.Custom('GetMainsquareCommons')]."
 ep3_laamp_decision_event.1001.desc_intro_returned_generic_01: "Zpátky v této části [ROOT.Char.Custom('GetMainsquareCommons')] je znatelně méně lidí. Několik dětí hladí osla, který se klidně pase uprostřed cesty směrem k [ROOT.Char.Custom('GetTowncrierElder')] nástěnce."
 ep3_laamp_decision_event.1001.desc_intro_returned_generic_02: "Vrátíme se do druhé poloviny [ROOT.Char.Custom('GetMainsquareCommons')], kde se několik různých psů honí a rvou o — dost velkou — kost."
 ep3_laamp_decision_event.1001.desc: "Odsouvám se od vstupu do [ROOT.Char.Custom('SettlementCity')|l] a kráčím úzkou cestičkou kolem [ROOT.Char.Custom('GetCrookedhousesDelapidatedtents')] do přilehlého otevřeného prostranství.\n\nPřede mnou je cesta k zásobovacím obchodníkům a prodavačům artefaktů, a odtud také spatřím, co vypadá jako"
 ep3_laamp_decision_event.1001.desc_intro: "$ep3_laamp_decision_event.1001.desc$ městský hlásatel v dálce."
 ep3_laamp_decision_event.1001.desc_intro_nomads: "$ep3_laamp_decision_event.1001.desc$ starší kmene, pobíhající v dálce."
 ep3_laamp_decision_event.1001.desc_outro_return_partner_finished: "$ep3_laamp_decision_event.1040.desc_outro_return_partner_finished$"
 ep3_laamp_decision_event.1001.desc_outro_return_finished: "\n\nRozhlédnu se a uvědomím si, že tu už nemám nic dalšího, čemu bych se [Select_CString(ROOT.Char.IsFemale,'měla','měl')] věnovat."
 ep3_laamp_decision_event.1001.desc_outro_partner: "\n\n[visiting_partner.GetFirstName|U] zaostává, ale brzy mě dohoní, zatímco přemýšlím, kam zamíříme dál."
 ep3_laamp_decision_event.1001.a: "Zásoby jsou tudy."
 ep3_laamp_decision_event.1001.a_second: "Podívejme se znovu na ty zásoby..."
 ep3_laamp_decision_event.1001.a.tt: "Jít ke stánkům se zásobami"
 full_on_supplies.tt: "Už máte #V max#! množství [Concept('provisions','proviantu')|E]"
 already_received_supplies.tt: "Při této návštěvě už jsi od [laamp_supply_merchant.Custom('CZ_ShortUIName_G')] [Select_CString(GetPlayer.IsFemale,'dostala','dostal')] [Concept('provisions','proviant')|E]"
 already_bought_supplies.tt: "Při této návštěvě už jsi [Select_CString(GetPlayer.IsFemale,'koupila','koupil')] [Concept('provisions','proviant')|E]"
 guards_were_summoned.tt: "[laamp_supply_merchant.GetShortUIName] si vás už nechce znovu vidět"
 ep3_laamp_decision_event.1001.b: "Třeba bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] prodat nějaké artefakty."
 ep3_laamp_decision_event.1001.b_second: "Vlastně by bylo lepší vrátit se k prodavačům artefaktů."
 ep3_laamp_decision_event.1001.b.tt: "Jít ke stánkům s artefakty"
 already_sold_artifact.tt: "Při této návštěvě už jsi [Select_CString(GetPlayer.IsFemale,'prodala','prodal')] [Concept('artifact','artefakt')|E]"
 ep3_laamp_decision_event.1001.c: "Zdá se, že [ROOT.Char.Custom('GetTowncrierElder')] by nám [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] něco nabídnout."
 ep3_laamp_decision_event.1001.c_second: "Je na čase znovu navštívit [ROOT.Char.Custom('GetTowncrierElder')]."
 ep3_laamp_decision_event.1001.c.tt: "Vyhledat zakázku"
 no_contracts.tt: "Momentálně nejsou k dispozici žádné [Concept('task_contracts','zakázky')|E] — zkuste to znovu [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1025_has_contracted_recently') )]"
 already_spawned_contracts.tt: "Nedávno jsi [Select_CString(GetPlayer.IsFemale,'získala','získal')] [Concept('task_contracts','zakázky')|E] – zkus to znovu [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1025_has_contracted_recently') )]"
 ep3_laamp_decision_event.1001.d: "$ep3_laamp_decision_event.1010.e$"
 ep3_laamp_decision_event.1010.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Zásoby!"
 ep3_laamp_decision_event.1010.desc_posh_stalls: "Stánky v potravinové čtvrti [visiting_location.GetBaronyNameExplicitly] doslova přetékají zbožím, což srazilo ceny. Najdu stánek kupce [laamp_supply_merchant.Custom('CZ_FirstName_G')], který nabízí skvělý poměr kvality a ceny.\n\nKdyž si všimne mého zájmu,"
 ep3_laamp_decision_event.1010.desc: "Od [ROOT.Char.Custom('RegionalRootVegetablePlural')] po látky; od palivového dříví po šicí nit — obchodník se zásobami [laamp_supply_merchant.GetFirstName] má vše. Stánek je narvaný k prasknutí čímkoli, co by člověk mohl potřebovat na noc v divočině.\n\nPřiblížím se trochu, abych [Select_CString(ROOT.Char.IsFemale,'upoutala','upoutal')] [Select_CString(laamp_supply_merchant.IsFemale,'její','jeho')] pozornost, a"
 ep3_laamp_decision_event.1010.desc_returned: "Stánek je stále plný zboží. Z okraje pultu se právě skutálí [ROOT.Char.Custom('RegionalRootVegetable')] a [Select_CString(laamp_supply_merchant.IsFemale,'obchodnice','obchodník')] se zásobami [laamp_supply_merchant.GetFirstName] se pro to sehne.\n\nNeznatelně zvednu obočí směrem k [Select_CString(laamp_supply_merchant.IsFemale,'ní','němu')], abych [Select_CString(ROOT.Char.IsFemale,'naznačila','naznačil')] svůj návrat, a"
 ep3_laamp_decision_event.1010.desc_reused_merchant_reaction_01: "si mě příjemně [Select_CString(laamp_supply_merchant.IsFemale,'překvapená','překvapený')] změří od hlavy k patě:"
 ep3_laamp_decision_event.1010.desc_reused_merchant_reaction_02: "vypadá při pohledu na mě opravdu trochu [Select_CString(laamp_supply_merchant.IsFemale,'zaskočená','zaskočený')]:"
 ep3_laamp_decision_event.1010.desc_reused_merchant_intro: "„Vrací se zákazník!“"
 ep3_laamp_decision_event.1010.desc_reused_merchant_01: "To je potěcha pro oči!"
 ep3_laamp_decision_event.1010.desc_reused_merchant_02: "Nemohl ses toho nabažit, co?"
 ep3_laamp_decision_event.1010.desc_reused_merchant_03: "Nemůžu tomu uvěřit!"
 ep3_laamp_decision_event.1010.desc_reused_merchant_outro_01: "„Co si dáš?“"
 ep3_laamp_decision_event.1010.desc_reused_merchant_outro_02: "„Co to bude?“"
 ep3_laamp_decision_event.1010.desc_trait_gregarious_new: "se rozzáří a věnuje mi přátelský úsměv:"
 ep3_laamp_decision_event.1010.desc_trait_gregarious_return: "mi věnuje další přátelský úsměv:"
 ep3_laamp_decision_event.1010.desc_trait_callous_new: "se na mě sotva podívá, když mě oslovuje:"
 ep3_laamp_decision_event.1010.desc_trait_callous_return: "mou přítomnost stále sotva bere na vědomí:"
 ep3_laamp_decision_event.1010.desc_trait_greedy_new: "[Select_CString(laamp_supply_merchant.IsFemale,'její','jeho')] tvář se při pohledu na mě promění v potěšený úsměv:"
 ep3_laamp_decision_event.1010.desc_trait_greedy_return: "v očích [Select_CString(laamp_supply_merchant.IsFemale,'jí','mu')] zablýskne, když si mě měří od hlavy k patě:"
 ep3_laamp_decision_event.1010.desc_trait_shy_new: "se na mě začne dívat s takovou intenzitou, která vůbec neladí s [Select_CString(laamp_supply_merchant.IsFemale,'jejím','jeho')] jemným hlasem:"
 ep3_laamp_decision_event.1010.desc_trait_shy_return: "chvíli pečlivě zvažuje můj návrat a pak tiše řekne:"
 ep3_laamp_decision_event.1010.desc_trait_eccentric_new: "mi věnuje nepřítomný pohled, zjevně [Select_CString(laamp_supply_merchant.IsFemale,'zaujatá','zaujatý')] něčím jiným:"
 ep3_laamp_decision_event.1010.desc_trait_eccentric_return: "se na mě podívá, zřejmě aniž by si [Select_CString(laamp_supply_merchant.IsFemale,'uvědomovala','uvědomoval')], že jsme se viděli před chvílí:"
 ep3_laamp_decision_event.1010.desc_generic_new_01: "mi kývne na pozdrav:"
 ep3_laamp_decision_event.1010.desc_generic_new_02: "mi věnuje vědoucí pohled:"
 ep3_laamp_decision_event.1010.desc_generic_returned_01: "pobaveně povytáhne obočí:"
 ep3_laamp_decision_event.1010.desc_generic_returned_02: "zvedne hlavu a osloví mě:"
 ep3_laamp_decision_event.1010.desc_outro_new_01: "„Zaujalo tě něco?“"
 ep3_laamp_decision_event.1010.desc_outro_new_02: "„Vidíš něco, co bys [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')]?“"
 ep3_laamp_decision_event.1010.desc_outro_new_03: "„Co potřebuješ?“"
 ep3_laamp_decision_event.1010.desc_outro_special_new_04: "„Venku je drsno, že? Co ti mám dát?“"
 ep3_laamp_decision_event.1010.desc_outro_returned_01: "„Zásoby přeci vypadají dobře?“"
 ep3_laamp_decision_event.1010.desc_outro_returned_02: "„[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] jsem tušení, že se vrátíš.“"
 ep3_laamp_decision_event.1010.desc_outro_returned_03: "„To nejlepší v celém [visiting_location.GetTitle.GetHolder.GetLiege.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')].“"
 ep3_laamp_decision_event.1010.desc_outro_sneaky_partner: "\n\n[visiting_partner.GetFirstName|U] práskne prsty a podívá se na mě, nenápadně přikývne směrem k zásobám a zamumlá: „[Select_CString(visiting_partner.IsFemale,'Mohla','Mohl')] bys udělat rozptýlení...?“"
 ep3_laamp_decision_event.1010.desc_outro_sneaky_partner_returned: "\n\n[visiting_partner.GetFirstName|U] dál sleduje vystavené zboží a hledí na mě pro jakýkoli signál k opatření zásob pro '#EMP free#!'."
 ep3_laamp_decision_event.1010.a_diplomacy: "„Náhodou nemáš nějaké zásoby navíc, příteli... ?“"
 ep3_laamp_decision_event.1010.a_diplomacy.success: "Podařilo se vám okouzlit [laamp_supply_merchant.GetShortUIName]"
 ep3_laamp_decision_event.1010.a_diplomacy.failure: "[laamp_supply_merchant.GetShortUIName] vycítí tvé zoufalství"
 ep3_laamp_decision_event.1010.a_diplomacy.critical_failure: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 ep3_laamp_decision_event.1010.a_stewardship: "„[Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')] bych to pro tebe přemístit, za malou provizi.“"
 ep3_laamp_decision_event.1010.a_stewardship.success: "Podařilo se vám přesvědčit [laamp_supply_merchant.GetShortUIName]"
 ep3_laamp_decision_event.1010.a_stewardship.failure: "[laamp_supply_merchant.GetShortUIName] se tvou logikou nenechá oklamat"
 ep3_laamp_decision_event.1010.a_stewardship.critical_failure: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 ep3_laamp_decision_event.1010.a_intrigue: "„Není to tamhle [visiting_location.GetCounty.GetTitle.GetHolder.GetTopLiege.GetTitleAsNameNoTooltip]?!“"
 ep3_laamp_decision_event.1010.a_intrigue.success: "Podařilo se vám ukrást spoustu zásob"
 ep3_laamp_decision_event.1010.a_intrigue.failure: "Zaškobrtneš a vzbudíš podezření [laamp_supply_merchant.Custom('CZ_ShortUIName_G')]"
 ep3_laamp_decision_event.1010.a_intrigue.critical_failure: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 ep3_laamp_decision_event.1010.a_learning: "„Myslím, že ty potraviny začínají být zkažené...“"
 ep3_laamp_decision_event.1010.a_learning.success: "[laamp_supply_merchant.GetShortUIName] souhlasí, že se vzdá prošlých zásob"
 ep3_laamp_decision_event.1010.a_learning.failure: "$ep3_laamp_decision_event.1010.a_stewardship.failure$"
 ep3_laamp_decision_event.1010.a_learning.critical_failure: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 ep3_laamp_decision_event.1010.a_martial: "„Můžu vzít zásoby. Nebo celý stánek. Volba je na tobě.“"
 ep3_laamp_decision_event.1010.a_martial.success: "Podařilo se vám zastrašit [laamp_supply_merchant.GetShortUIName]"
 ep3_laamp_decision_event.1010.a_martial.failure: "[laamp_supply_merchant.GetShortUIName] prokoukne tvé plané výhrůžky"
 ep3_laamp_decision_event.1010.a_martial.critical_failure: "Přivolá se stráž"
 ep3_laamp_decision_event.1010.a_prowess.success: "$ep3_laamp_decision_event.1010.a_martial.success$"
 ep3_laamp_decision_event.1010.a_prowess.failure: "$ep3_laamp_decision_event.1010.a_martial.failure$"
 ep3_laamp_decision_event.1010.a_prowess.critical_failure: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 ep3_laamp_decision_event.1010.a.failure.tt: "Cena [Concept('provision','proviantu')|E] je #N zvýšena#! po dobu #V [EmptyScope.ScriptValue('visit_settlement_minimum_cooldown_months')|0] měsíců#!"
 ep3_laamp_decision_event.1010.a.cooldown.tt: "Nedávno ses [Select_CString(GetPlayer.IsFemale,'pokusila','pokusil')] získat [Concept('provisions','proviant')|E] zadarmo – zkus to znovu [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1010_has_convinced_recently') )]"
 ep3_laamp_decision_event.1010.b: "„Koupím si něco odsud i odtud.“"
 ep3_laamp_decision_event.1010.c_callous: "„[Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')] bych ti vyměnit tohoto mladého učně výměnou za zásoby.“"
 ep3_laamp_decision_event.1010.c: "„...možná bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] vyměnit mladého učně?“"
 ep3_laamp_decision_event.1010.c.flavor: "Odpusť mi, prosím..."
 ep3_laamp_decision_event.1010.c.flavor_callous: "Aspoň o jedno méně k najedení."
 ep3_laamp_decision_event.1010.d: "„Jé! Jak jsem nešikovný!“"
 ep3_laamp_decision_event.1010.d.flavor: "[visiting_partner.GetFirstNameNoTooltip], #EMP jdi!#!"
 ep3_laamp_decision_event.1010.d.success: "[visiting_partner.GetShortUIName] úspěšně ukradne spoustu zásob"
 ep3_laamp_decision_event.1010.d.failure: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 ep3_laamp_decision_event.1010.d.cooldown.tt: "Nedávno ses [Select_CString(GetPlayer.IsFemale,'pokusila','pokusil')] ukrást [Concept('provisions','proviant')|E] – zkus to znovu [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1010_has_stolen_recently') )]"
 ep3_laamp_decision_event.1010.e: "Pojďme zpět."
 ep3_laamp_decision_event.1020.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Bez otázek"
 ep3_laamp_decision_event.1020.desc_intro_reused_peddler: "Ruchem kolem stánků s artefakty pronikne hlas: „Stálých zákazníků si vždycky vážím!“ zvolá [laamp_artifact_peddler.GetFirstName] a přistoupí blíž, aby si [Select_CString(laamp_artifact_peddler.IsFemale,'prohlédla','prohlédl')], co nesu."
 ep3_laamp_decision_event.1020.desc_intro_posh_stalls: "Obchodní čtvrť [visiting_location.GetBaronyNameExplicitly] je plná prodejců vzácných i exotických artefaktů a nemám problém najít vyhlášeného obchodníka s artefakty [laamp_artifact_peddler.GetFirstName]."
 ep3_laamp_decision_event.1020.desc_intro_new_01: "Hledám někoho, kdo by odebral pár předmětů z mých rukou; [Select_CString(laamp_artifact_peddler.IsFemale,'obchodnice','obchodník')] s artefakty [laamp_artifact_peddler.GetFirstName] vyjde, aby se [Select_CString(laamp_artifact_peddler.IsFemale,'podívala','podíval')] na můj inventář."
 ep3_laamp_decision_event.1020.desc_intro_new_02: "Ulička plná stánků; mé rameno náhodou narazí do někoho zezadu. Když se [Select_CString(laamp_artifact_peddler.IsFemale,'obchodnice','obchodník')] s artefakty [laamp_artifact_peddler.GetFirstName] otočí, aby mě [Select_CString(laamp_artifact_peddler.IsFemale,'konfrontovala','konfrontoval')], všimne si mého inventáře a nakloní se pro bližší prohlídku."
 ep3_laamp_decision_event.1020.desc_intro_returned_01: "Když se vracím ke stánkům s artefakty, [laamp_artifact_peddler.GetFirstName] si mě zvědavě prohlíží: „Moje nabídka pořád platí.“\n\nPak se otočí ke svému stánku a začne přerovnávat zboží."
 ep3_laamp_decision_event.1020.desc_intro_returned_02: "Při návratu ke stánkům s artefakty mi znovu padne do oka stánek [laamp_artifact_peddler.Custom('CZ_FirstName_G')], který vyniká hojností a kvalitou nabídky.\n\nVšimne si mě, na okamžik se zarazí a pak řekne: „Tak co, plácneme si?“"
 ep3_laamp_decision_event.1020.desc_intro_intermediate_returned_01: "Zatímco ještě zvažuji možnosti, [laamp_artifact_peddler.GetFirstName] mi věnuje znuděný pohled a jednotvárně utrousí: „Moje nabídka pořád platí.“\n\nPak se nenuceně otočí ke svému stánku a začne přerovnávat zboží."
 ep3_laamp_decision_event.1020.desc_intro_intermediate_returned_02: "Když trochu zaváhám, [laamp_artifact_peddler.GetFirstName] je mou nerozhodností zjevně [Select_CString(laamp_artifact_peddler.IsFemale,'trochu dotčená','trochu dotčený')].\n\nPokrčí rameny: „Vezmi si tolik času, kolik potřebuješ, no,“ a odšourá se obsloužit jiného zákazníka."
 ep3_laamp_decision_event.1020.desc_one_artifact_new_01: "\n\nZkušenýma rukama si prohlédne povrch mého artefaktu „[1020_first_artifact_to_sell.GetName]“, pak přikývne a něco si pro sebe zamumlá."
 ep3_laamp_decision_event.1020.desc_one_artifact_new_02: "\n\nJemně poklepe na povrch artefaktu „[1020_first_artifact_to_sell.GetName]“ a pak nakloní hlavu, jako by něčemu [Select_CString(laamp_artifact_peddler.IsFemale,'naslouchala','naslouchal')]. Nakonec přikývne."
 ep3_laamp_decision_event.1020.desc_two_artifacts_new_01: "\n\nPřejede prsty po artefaktu „[1020_first_artifact_to_sell.GetName]“ a když si všimne artefaktu „[1020_second_artifact_to_sell.GetName]“, v očích [Select_CString(laamp_artifact_peddler.IsFemale,'jí','mu')] blýskne zájem."
 ep3_laamp_decision_event.1020.desc_two_artifacts_new_02: "\n\nZačne ohmatávat artefakt „[1020_first_artifact_to_sell.GetName]“ a pečlivě zvažuje jeho druh ([1020_first_artifact_to_sell.Custom('ArtifactType')|l]), pak opatrně prohlédne artefakt „[1020_second_artifact_to_sell.GetName]“ a zdá se, že je s něčím [Select_CString(laamp_artifact_peddler.IsFemale,'spokojená','spokojený')]."
 ep3_laamp_decision_event.1020.desc_three_artifacts_new_01: "\n\nProhlíží, otáčí a obrací; zkoumá každý detail – ať už povrch artefaktu „[1020_first_artifact_to_sell.GetName]“, materiály artefaktu „[1020_second_artifact_to_sell.GetName]“, nebo zdobení artefaktu „[1020_third_artifact_to_sell.GetName]“."
 ep3_laamp_decision_event.1020.desc_three_artifacts_new_02: "\n\nNež se naděju, důkladně prohlédne artefakty „[1020_first_artifact_to_sell.GetName]“ a „[1020_second_artifact_to_sell.GetName]“. Pak [Select_CString(laamp_artifact_peddler.IsFemale,'jí','mu')] ruce rychle přejíždějí po povrchu artefaktu „[1020_third_artifact_to_sell.GetName]“ a hledají vady."
 ep3_laamp_decision_event.1020.desc_outraged_partner_new: "\n\nNajednou mi do ucha zazní rozhořčený hlas [Select_CString(visiting_partner.IsFemale,'mé','mého')] [ROOT.Char.Custom2('CZ_RelationToMeShort_G', SCOPE.sC('visiting_partner'))|l] [visiting_partner.Custom('CZ_FirstName_G')]: „Vždyť tě odírají! #EMP Já#! ti seženu lepší nabídku!“"
 ep3_laamp_decision_event.1020.desc_outraged_partner_returned: "\n\nKoutkem oka si všimnu, že [visiting_partner.GetFirstName] pořád zuří nad mizernými nabídkami [laamp_artifact_peddler.Custom('CZ_FirstNameNoTooltip_G')]."
 ep3_laamp_decision_event.1020.a: "[Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] bych ochoten vzdát se..."
