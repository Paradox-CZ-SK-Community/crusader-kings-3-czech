 ep3_laamp_decision_event.1021.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Čas se rozloučit"
 ep3_laamp_decision_event.1021.t_success: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Moje!"
 ep3_laamp_decision_event.1021.t_failure: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Smrt [Select_CString(ROOT.Char.IsFemale,'obchodnice','obchodníka')]"
 ep3_laamp_decision_event.1021.desc_moment_of_purchase_01: "[laamp_artifact_peddler.GetFirstName] se na mě očekávajícím pohledem dívá, zjevně [Select_CString(laamp_artifact_peddler.IsFemale,'potěšena','potěšen')] mou volbou: „S kterým předmětem byste se chtěli rozloučit?“"
 ep3_laamp_decision_event.1021.desc_moment_of_purchase_02: "[laamp_artifact_peddler.GetFirstName] mi dá povzbuzující přikývnutí: „Mám mince. Jaké zboží byste mi [Select_CString(ROOT.Char.IsFemale,'prodala','prodal')]?“"
 ep3_laamp_decision_event.1021.desc_success: "[laamp_artifact_peddler.GetFirstName] se na mě zadívá přemítavým pohledem: „...opravdu? Nuže. Za tak cenné zboží bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] uvolnit ještě jednu minci nebo dvě.“"
 ep3_laamp_decision_event.1021.desc_failure: "[laamp_artifact_peddler.GetFirstName] se odfrkne a [Select_CString(laamp_artifact_peddler.IsFemale,'její','jeho')] ústa se změní v pohrdlivý úšklebek: „Nebuďte směšní. Moje nabídka zůstává stejná.“"
 ep3_laamp_decision_event.1021.a: "„Artefakt „[1020_first_artifact_to_sell.GetNameNoTooltip]“ mi nikdy nijak nepomohl.“"
 ep3_laamp_decision_event.1021.b: "„Lépe využiju zlato. Vezměte artefakt ‚[1020_second_artifact_to_sell.GetNameNoTooltip]‘.“"
 ep3_laamp_decision_event.1021.c: "„Můžete mít můj artefakt ‚[1020_third_artifact_to_sell.GetNameNoTooltip]‘.“"
 ep3_laamp_decision_event.1021.d: "Po krátkém rozmyšlení..."
 ep3_laamp_decision_event.1021.eagle: "Možná by vás zaujal [ROOT.Char.Custom('EagleStoryName')]?"
 ep3_laamp_decision_event.1025.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: ten [ROOT.Char.Custom('GetTowncrierElderCapitalized')|U]"
 ep3_laamp_decision_event.1025.desc_returned_01: "Když se vrátíme ke hlásateli, kočka, nyní stočená do klubíčka, spí na blízkém stole a nevěnuje pozornost tlachání hlásatele.\n\nVšimnu si, že se mu občas při snění pohybují vousy, a přiblížím se, abych [Select_CString(ROOT.Char.IsFemale,'zvážila','zvážil')] zveřejněné vyhlášky:"
 ep3_laamp_decision_event.1025.desc_returned_02: "Když se vracím ke hlásateli, kočka leží natáhlá pod stolem a sleduje mě polozavřeným modrým okem.\n\nNaladím se na její tiché předení a pak se hned vrátím k výpisům, které hlásatel oznamuje:"
 ep3_laamp_decision_event.1025.desc_reused_crier: "Městský vyvolávač mě pozná, a když se přiblížím, ožije a začne bez ustání švitořit o zakázkách, které vyvěsili místní šlechtici.\n\nPořád ho doprovází přátelská stará kočka s bíle a hnědošedě strakatou srstí, která si mě měří přimhouřenýma modrýma očima, zatímco pozorně poslouchám předčítané nabídky:"
 ep3_laamp_decision_event.1025.desc_tribal_returned_01: "Když se vrátíme ke stařešinovi, olizuje nádherný vůl jemně ruku [laamp_town_crier.Custom('CZ_FirstName_G')], který mu dál podává pamlsky.\n\nSe spokojeným úsměvem mi ochotně znovu vyjmenuje dostupné úkoly, které by pomohly místním:"
 ep3_laamp_decision_event.1025.desc_tribal_returned_02: "Když se vracím ke stařešinovi, odchází právě [Select_CString(ROOT.Char.IsFemale,'důležitě vyhlížející učená žena','důležitě vyhlížející učený muž')].\n\nZvědavě se za ním ohlédnu a pak se obrátím na stařešinu [laamp_town_crier.Custom('CZ_FirstName_A')], abych si [Select_CString(ROOT.Char.IsFemale,'připomněla','připomněl')] dostupné úkoly:"
 ep3_laamp_decision_event.1025.desc_tribal_reused_crier: "[Select_CString(laamp_town_crier.IsFemale,'Stařešinka','Stařešina')], [Select_CString(laamp_town_crier.IsFemale,'kterou','kterého')] poznávám jako [laamp_town_crier.GetFirstName], mi s uznalým úsměvem kyne, když se vracím na [Select_CString(laamp_town_crier.IsFemale,'její','jeho')] stanoviště.\n\nPo přátelském klábosení mi poví, co je nového a jaké úkoly je potřeba vyřídit:"
 ep3_laamp_decision_event.1025.desc: "Když se přiblížím, městský vyvolávač ožije a začne bez ustání švitořit o zakázkách, které vyvěsili místní šlechtici.\n\nDoprovází ho přátelská stará kočka s bíle a hnědošedě strakatou srstí, která si mě měří nejčistšíma modrýma očima, zatímco pozorně poslouchám předčítané nabídky:"
 ep3_laamp_decision_event.1025.desc_tribal: "Stařešina [laamp_town_crier.GetFirstName] se na mě přátelsky podívá, když se přiblížím.\n\nZatímco se pečlivě stará o vůz tažený volem, sdělí mi, jaké místní potíže a úkoly je třeba v nejbližším okolí řešit:"
 ep3_laamp_decision_event.1025.desc_legendary_returned_01: "Zpátky u vyvolávače: [Select_CString(laamp_town_crier.IsFemale,'shromáždila','shromáždil')] kolem sebe hlouček lidí, kteří obdivně žasnou, zatímco líčí hrůzné okolnosti, kvůli nimž jakýsi vzdálený šlechtic hledá pomoc.\n\nPozvednu obočí a připomenu si běžné zakázky, o kterých byla řeč dříve:"
 ep3_laamp_decision_event.1025.desc_legendary_returned_02: "Když se vracím k vyvolávači, zrovna zahlcuje další skupinku zevlujících kolemjdoucích stále přehnanějšími podrobnostmi o vzdáleném šlechtici.\n\nPotichu si pobrukuji a přemýšlím o dříve zmíněných zakázkách:"
 ep3_laamp_decision_event.1025.desc_tribal_legendary_returned_01: "Zpátky u stařešiny ten domorodec z dřívějška hlasitě klevetí s ostatními členy kmene a rozebírá všechny nelichotivé podrobnosti o vzdáleném šlechtici a jeho tísni.\n\nStařešina [laamp_town_crier.GetFirstName] po něm z boku vrhne nesouhlasný pohled, když k [Select_CString(laamp_town_crier.IsFemale,'ní','němu')] přistupuji, abych se [Select_CString(ROOT.Char.IsFemale,'zeptala','zeptal')], jaké místní úkoly je třeba vyřídit:"
 ep3_laamp_decision_event.1025.desc_tribal_legendary_returned_02: "Když se vracím ke stařešinovi, zřejmě právě [Select_CString(laamp_town_crier.IsFemale,'pokárala','pokáral')] druhého domorodce, který teď uraženě sedí na nedalekém voze.\n\nDomorodec pookřeje, když se dá do řeči s někým dalším, zatímco já přistupuji [Select_CString(laamp_town_crier.IsFemale,'ke stařešince','ke stařešinovi')] [laamp_town_crier.Custom('CZ_FirstName_D')], [Select_CString(laamp_town_crier.IsFemale,'která je tak laskavá','který je tak laskavý')] a připomene mi dostupné úkoly:"
 ep3_laamp_decision_event.1025.desc_legendary_reused_crier: "Poznávám hlásatele, [laamp_town_crier.GetFirstName], [Select_CString(laamp_town_crier.IsFemale,'která','který')] je $ep3_laamp_decision_event.1025.desc_legendary_body$"
 ep3_laamp_decision_event.1025.desc_legendary: "Hlásatel, [laamp_town_crier.GetFirstName], je $ep3_laamp_decision_event.1025.desc_legendary_body$"
 ep3_laamp_decision_event.1025.desc_legendary_body: "klábosí s dalším člověkem kultury [visiting_location.GetCounty.GetCulture.GetNameNoTooltip], když přicházím k [Select_CString(laamp_town_crier.IsFemale,'jejímu','jeho')] stanovišti – šeptají si o tom, že jakýsi vzdálený šlechtic se ocitl ve zvláštní nesnázi a nabízí #EMP velkolepé#! odměny.\n\nZatímco o tom přemýšlím, náhle si vzpomene na své povinnosti, ožije a hned ohlašuje celému okolí právě dostupné zakázky:"
 ep3_laamp_decision_event.1025.desc_tribal_legendary_reused_crier: "Když se přiblížím, stařešina [laamp_town_crier.GetFirstName], [Select_CString(laamp_town_crier.IsFemale,'zabraná','zabraný')] do hovoru s dalším domorodcem, na mě vrhne poznávací pohled. $ep3_laamp_decision_event.1025.desc_tribal_legendary_body$"
 ep3_laamp_decision_event.1025.desc_tribal_legendary: "Když přicházím, [Select_CString(laamp_town_crier.IsFemale,'jedna z vesnických stařešinek','jeden z vesnických stařešinů')], [laamp_town_crier.GetFirstName], právě s jiným domorodcem něco probírá. $ep3_laamp_decision_event.1025.desc_tribal_legendary_body$"
 ep3_laamp_decision_event.1025.desc_tribal_legendary_body: "\n\nTen druhý začne gestikulovat a já zaslechnu něco o tom, že #EMP jakýsi vzdálený šlechtic naléhavě potřebuje pomoc v důležité věci#! a slibuje za ni slávu a bohatství.\n\nDokončí rozhovor a já se obrátím na [laamp_town_crier.Custom('CZ_FirstNameNoTooltip_A')], [Select_CString(laamp_town_crier.IsFemale,'která','který')] mi poví o místních úkolech, které je třeba vyřídit:"
 ep3_laamp_decision_event.1025.desc_nothing: "[ROOT.Char.Custom('GetTowncrierElder')] sedí shrbený na [Select_CString(laamp_town_crier.IsFemale,'její','jeho')] židli, napůl usnutý. Zřejmě v oblasti momentálně nejsou žádné dostupné smlouvy."
 ep3_laamp_decision_event.1025.desc_treasure_map: "#EMP Hledají se dobrodruzi na lov pokladu!#!"
 ep3_laamp_decision_event.1025.desc_transport_contracts: "#EMP Hledají se zkušení cestovatelé na doprovodné zakázky!#!"
 ep3_laamp_decision_event.1025.desc_criminal_contracts: "#EMP Potřebujeme diskrétní odborníky na lukrativní zakázky!#!"
 ep3_laamp_decision_event.1025.desc_justicar_contracts: "#EMP Potřební jsou zbožní strážci, kteří pomohou udržet pořádek!#!"
 ep3_laamp_decision_event.1025.desc_hireling_contracts: "#EMP Potřebujeme silné muže na maršálské povinnosti!#!"
 ep3_laamp_decision_event.1025.desc_diplomacy_contracts: "#EMP Hledají se výřeční vyjednávači pro diplomatické záležitosti!#!"
 ep3_laamp_decision_event.1025.desc_hunting_contracts: "#EMP Zkušení lovci vyžadováni pro lovecké úkoly!#!"
 ep3_laamp_decision_event.1025.desc_stewardship_contracts: "#EMP Oceňovaní správcové potřeba pro organizační úkoly!#!"
 ep3_laamp_decision_event.1025.desc_learning_contracts: "#EMP Učenliví správci potřební pro vědeckou práci!#!"
 ep3_laamp_decision_event.1025.desc_intrigue_contracts: "#EMP Hledají se zkušení spolupracovníci pro řešení delikátních záležitostí!#!"
