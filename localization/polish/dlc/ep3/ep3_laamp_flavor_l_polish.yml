l_polish:
 ep3_laamp_flavor.0001.t1: "Žrouti mršin"
 ep3_laamp_flavor.0001.t2: "Jíst vránu"
 ep3_laamp_flavor.0001.desc1: "Supové krouží nad námi, zatímco pálící slunce bije na mé prázdné břicho. Prohrabuji se zbylými příděly; máme už jen suchary a i ty rychle docházejí. Brzy budeme muset doplnit zásoby, jinak nás čeká hladovění.\n\n[Select_CString(ROOT.Char.IsFemale,'Upozornila','Upozornil')] jsem na náš zoufalý stav ostatní. Žádná z možností rozhodně nezní lákavě. Napínaje [Select_CString(vulture_shooter.IsFemale,'její','jeho')] lukovou paži, [vulture_shooter.GetFirstName] se nabídne, že sestřelí pár mrchožroutů, aby [Select_CString(vulture_shooter.IsFemale,'doplnila','doplnil')] naše skromné zásoby."
 ep3_laamp_flavor.0001.desc2: "Rackové krouží nad hlavou, a houpání lodě jen zvýrazňuje bolest v mém prázdném žaludku. Prohrabuji se zbylými příděly; máme už jen suchary a i ty rychle docházejí. Brzy budeme muset doplnit zásoby, jinak nás čeká hladovění.\n\n[Select_CString(ROOT.Char.IsFemale,'Upozornila','Upozornil')] jsem na náš zoufalý stav ostatní. Žádná z možností rozhodně nezní lákavě. Napínaje [Select_CString(vulture_shooter.IsFemale,'její','jeho')] lukovou paži, [vulture_shooter.GetFirstName] se nabídne, že sestřelí pár mrchožroutů, aby [Select_CString(vulture_shooter.IsFemale,'doplnila','doplnil')] naše skromné zásoby."
 ep3_laamp_flavor.0001.desc: "Vrany krouží nade mnou, zatímco mě bolí žaludek hladem. Prohrabuji se zbylými příděly; máme už jen suchary a i ty rychle docházejí. Brzy budeme muset doplnit zásoby, jinak nás čeká hladovění.\n\n[Select_CString(ROOT.Char.IsFemale,'Upozornila','Upozornil')] jsem na náš zoufalý stav ostatní. Žádná z možností rozhodně nezní lákavě. Napínaje [Select_CString(vulture_shooter.IsFemale,'její','jeho')] lukovou paži, [vulture_shooter.GetFirstName] se nabídne, že sestřelí pár mrchožroutů, aby [Select_CString(vulture_shooter.IsFemale,'doplnila','doplnil')] naše skromné zásoby."
 ep3_laamp_flavor.0001.a: "Vynikající návrh."
 ep3_laamp_flavor.0001.a.cannibal: "Jedl jsem i horší."
 ep3_laamp_flavor.0001.b: "Chutnaly by naprosto #EMP odporně#!!"
 ep3_laamp_flavor.0001.c: "Pojídání mršin je známo, že způsobuje nemoc."
 ep3_laamp_flavor.0001.d: "Sázím se, že sestřelím víc ptáků než [vulture_shooter.GetFirstNameNoTooltip]."
 ep3_laamp_flavor.0001.a.sick: "Pojídání mršin"
 ep3_laamp_flavor.0001.a.fine: "Pojídání mršin"
 agreed_to_shoot_vultures: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] si sblížili při zapáchajícím jídle."
 agreed_to_shoot_vultures_corresponding: "[TARGET_CHARACTER.GetShortUIName] a [CHARACTER.GetShortUIName|U] si sblížili při zapáchajícím jídle."
 no_vulture_eating: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] se pohádali kvůli možnosti pojídat mršiny."
 no_vulture_eating_corresponding: "[TARGET_CHARACTER.GetShortUIName] a [CHARACTER.GetShortUIName|U] se pohádali kvůli možnosti pojídat mršiny."
 ep3_laamp_flavor.0001.sick: "Maso mrchožroutů mi nesvědčí"
 ep3_laamp_flavor.0001.notsick: "Stěží jedlé, ale snesitelné"
 ep3_laamp_flavor.0020.t: "Zloděj!"
 ep3_laamp_flavor.0020.intro: "[Select_CString(ROOT.Char.IsFemale,'Spěchala','Spěchal')] jsem na náměstí, jakmile jsem [Select_CString(ROOT.Char.IsFemale,'slyšela','slyšel')] zprávu; [thieving_follower.GetFirstName] [Select_CString(thieving_follower.IsFemale,'byla přistižena','byl přistižen')] při krádeži na tržišti. Na tribuně stojí nikdo jiný než [town_leader.GetTitledFirstName], [Select_CString(town_leader.IsFemale,'která','který')] se na mě dívá pohledem, co by [Select_CString(town_leader.IsFemale,'zabila','zabil')]. [thieving_follower.GetFirstNameNoTooltip|U] mě naopak ze své nezáviděníhodné pozice v kládě vítá mnohem radostněji.\n\n„Trest za krádež [CZPrepV(town_location.GetNameNoTooltip)] [CZProvName(town_location,'L')] je,“ vysvětluje [town_leader.GetTitledFirstName],"
 ep3_laamp_flavor.0020.desc1: "„obvykle přísný výprask, pokud nelze zaplatit obvyklou pokutu. Nicméně, jako známý člen gangu zločineckých tuláků nejsem nakloněn být tak shovívavý.“"
 ep3_laamp_flavor.0020.desc: "„obvykle přísný výprask. Nicméně jsem ochoten tento trest prominout, pokud bude zaplacena odpovídající pokuta.“"
 ep3_laamp_flavor.0020.a: "Zaplatím pokutu za [thieving_follower.Custom('CZ_FirstNameNoTooltip_A')]."
 ep3_laamp_flavor.0020.b: "[thieving_follower.GetFirstNameNoTooltip] musí přijmout trest."
 ep3_laamp_flavor.0020.c: "Prosím vás, [town_leader.GetTitledFirstNameNoTooltip]. Propusťte [thieving_follower.GetFirstNameNoTooltip]!"
 ep3_laamp_flavor.0020.d: "Žádáme soud bojem!"
 thievery_rivalry_opinion: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] si kvůli drobné krádeži začali pěstovat zášť."
 ep3_laamp_flavor.0020.d.tt.success: "Vítězíme v boji a [thieving_follower.GetFirstName] je zproštěn viny"
 ep3_laamp_flavor.0020.d.tt.fail: "Souboj je ztracen a [thieving_follower.GetFirstName] musí zaplatit cenu"
 thievery_helper_opinion: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] si sblížili, když [CHARACTER.GetShortUIName] pomohl [TARGET_CHARACTER.GetShortUIName] uniknout následkům [Select_CString(TARGET_CHARACTER.IsFemale,'jejích','jeho')] činů."
 thievery_helper_opinion_corresponding: "[TARGET_CHARACTER.GetShortUIName] a [CHARACTER.GetShortUIName|U] si sblížili, když [CHARACTER.GetShortUIName] pomohl [TARGET_CHARACTER.GetShortUIName] uniknout následkům [Select_CString(TARGET_CHARACTER.IsFemale,'jejích','jeho')] činů."
 ep3_laamp_flavor.0030.t: "Sladké sny"
 ep3_laamp_flavor.0030.desc: "Stoly banketu sahají daleko! Můj vysoký trůn září rubíny a safíry! Hosté ze čtyř koutů světa slaví mých dvacet let požehnané vlády.\n\n„Ještě jeden pohár sladké ambrosie, slavný císaři?“ ptá se vrchní komorník [dream_friend.GetFirstName], podávaje nádherný pohár. Dychtivě z něj ochutnám.\n\n„Tancuj pro mě, hlupáku!“ zařvu na zahanbeného a pokořeného [dream_rival.GetFirstName]. Takový osud potká ty, kdo se mi postaví. Zavřu na chvíli oči.\n\nKdyž je znovu otevřu, nacházím se v příliš známé slaměné posteli. Vzdychnu. Jen sen."
 ep3_laamp_flavor.0030.a: "Proměním svůj sen ve skutečnost."
 ep3_laamp_flavor.0030.b: "Byl to příjemný sen, dokud trval."
 ep3_laamp_flavor.0030.c: "Jsem rád, že jsem od toho života osvobozen."
 dream_ambitious: "Královské ambice"
 dream_envious: "Touha po územích"
 dream_content: "Svoboda od odpovědnosti"
 ep3_laamp_flavor.0040.t: "Ztracený mladý pán"
 ep3_laamp_flavor.0040.desc: "Při průzkumu [CZTerrain(location_scope,'G')|l] [CZPrepV(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetCurrentLocation,'L')] zahlédnu u cesty postavu, která napájí koně. Když se přiblížíme, poznám, že je to [runaway_child.GetFullName], [runaway_child.Custom('GetDaughterSon')] [local_ruler.Custom('CZ_TitledFirstName_G')]. V očích má strach a zmatek a [Select_CString(runaway_child.IsFemale,'její','jeho')] krásné šaty jsou roztrhané a špinavé.\n\nPo krátkém, napjatém rozhovoru se dozvím, že [runaway_child.GetFirstNameNoTooltip] [Select_CString(runaway_child.IsFemale,'utekla','utekl')] z domova po nějaké rodinné hádce, jejíž podrobnosti se mi nedaří pochopit. Netrvalo dlouho a v divočině [Select_CString(runaway_child.IsFemale,'se beznadějně ztratila','se beznadějně ztratil')]. Se slzami v očích se [runaway_child.GetFirstNameNoTooltip] ptá, jestli může jet s námi, nebo jestli [Select_CString(runaway_child.IsFemale,'ji','ho')] aspoň doprovodíme zpátky k [Select_CString(local_ruler.IsFemale,'matce','otci')]."
 ep3_laamp_flavor.0040.a: "Pojď s námi, odvezeme tě domů."
 ep3_laamp_flavor.0040.b: "Vítej v naší veselé družině."
 ep3_laamp_flavor.0040.c: "Nemůžu se dočkat, až napíšu výkupní dopis."
 stole_my_child_opinion: "Ukradl mi dítě"
 returned_my_child_opinion: "Dítě bezpečně vráceno"
 ep3_laamp_flavor.0050.t: "Nekromant"
 ep3_laamp_flavor.0050.desc: "Nedokážu usnout, a noční procházka po [CZTerrain(location_scope,'L')|l] přivádí mou mysl k bloudění, když uslyším... #EMP zaklínání#!?\n\nNásleduji zvuk až k jeho zdroji a nacházím kruh pochodní osvětlující podivnou a znepokojivou scénu.\n\nMuž v rouchu, oči upřené do grimoáru, vyvolává jména démonů, které chce svázat do své vůle. Před ním je rituální kruh nakreslený křídou, složitý, elegantní a naprosto šílený — tento muž je zjevně [Glossary('necromancer', 'NECROMANCER_GLOSS' )]!\n\nV šoku zakopnu a upadnu, čímž hlasitě oznamuji svou přítomnost."
 ep3_laamp_flavor.0050.a: "Okamžitě přestaňte s tímto ohavným čarodějnictvím!"
 ep3_laamp_flavor.0050.b: "Zajímavé! Co mě můžete naučit o démonologii?"
 ep3_laamp_flavor.0050.c: "[Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')] bys zasvětit [Select_CString(player_heir_scope.IsFemale,'mou dceru','mého syna')] [player_heir_scope.Custom('CZ_FirstNameNoTooltip_A')] do temných umění?"
 ep3_laamp_flavor.0050.d: "Děsivé! Musím utéct!"
 learned_in_demonology: "Znalost démonologie"
 ep3_laamp_flavor.0050.d.tt.success: "Ohavný nekromant je vyhnán"
 ep3_laamp_flavor.0050.d.tt.fail: "Nekromant vás přemůže a donutí k ústupu"
 NECROMANCER_GLOSS: "Navzdory názvu historická nekromancie pokrývala směs abrahámské ezoteriky, obecně zahrnující odvolávání se na duchy, které byla církví považovány za #EMP nečisté#!, ať už šlo o démony, mrtvé nebo více neuchopitelné biblické postavy."
 ep3_laamp_flavor.0060.t: "Zbytečná zátěž"
 ep3_laamp_flavor.0060.desc: "„Dost už toho věčného fňukání! Ani já jsem několik dní [Select_CString(follower.IsFemale,'nejedla','nejedl')], a nemám ten přepych, aby mě vozili jako prince!“ [follower.GetFirstName|U] udeří pěstmi do železných mříží klece, ve které vezeme [prisoner.Custom('CZ_FirstName_A')].\n\n„Hladovíme a ta krysa jen ujídá z našich přídělů. Měli bychom [Select_CString(prisoner.IsFemale,'ji','ho')] pověsit a mít to z krku.“ [follower.GetFirstNameNoTooltip|U] ukáže na uschlý strom kousek před námi."
 ep3_laamp_flavor.0060.a: "[prisoner.GetFirstNameNoTooltip] žil dost dlouho."
 ep3_laamp_flavor.0060.b: "Nemusíte jít domů, ale tady zůstat nemůžete."
 ep3_laamp_flavor.0060.c: "Ten vězeň je pro mě cenný, nechte [Select_CString(prisoner.IsFemale,'ji','ho')] být."
 burdensome_prisoner_modifier: "Zbytečná zátěž"
 ep3_camp_temperament.0001.t: "Nakrmit přítele"
 ep3_camp_temperament.0001.desc: "„Možná ti nedokážeme sehnat to nejlepší maso,“ vyleká mě hlas [potential_friend.Custom('CZ_FirstName_G')], který se široce usmívá, „ale tuláci si vybírat nemůžou.“\n\nZvedne pohár a ukáže na ostatní mé družiníky, kteří sedí kolem slabě plápolajícího ohně. Vedle nich leží otevřené pytle s čerstvým ovocem.\n\n„Nemysli si, že nevidíme, co pro nás děláš,“ pokračuje tišeji. „Každý z nás musí přiložit ruku k dílu.“"
 ep3_camp_temperament.0001.a: "„Pojďme všichni jíst společně!“"
 ep3_camp_temperament.0001.b: "„Určitě je někdo otrávil!“"
 ep3_camp_temperament.0001.c: "Mohu je prodat za pár zlatých..."
 ep3_camp_temperament.0001.d: "„#EMP Ty#!, příteli, jsi opravdový poklad.“"
 ep3_camp_temperament.0001.e: "„Děkuji za tvé úsilí.“"
 ep3_camp_temperament.0010.t: "Na každém rohu"
 ep3_camp_temperament.0010.desc.intro: "Déšť zahnal většinu mých družiníků pod jeden a tentýž strom ([ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')|l]) a uprostřed hloučku vášnivě hřímá [enemy.GetTitledFirstNameNoTooltip]. Snažím se, aby mě nebylo vidět.\n\n„[Select_CString(ROOT.Char.IsFemale,'Ta','Ten')] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('enemy'))], [Select_CString(ROOT.Char.IsFemale,'ta naprosto neschopná hlupačka','ten naprosto neschopný hlupák')]! Copak nevidíte, že nedokáže spravovat ani vlastní tábor? Jak můžeme čekat, že zvládne spravovat něco většího než louži?“\n\n"
 ep3_camp_temperament.0010.desc.spouse: "Těžko tomu uvěřit. Má vlastní choť."
 ep3_camp_temperament.0010.desc.child: "Těžko tomu uvěřit. Mé vlastní dítě."
 ep3_camp_temperament.0010.desc.friend: "Těžko tomu uvěřit. Můj nejbližší přítel."
 ep3_camp_temperament.0010.a: "Ne... ne ty."
 ep3_camp_temperament.0010.a.flavor: "#EMP I ty, [enemy.GetFirstNameNoTooltip]?#!"
 ep3_camp_temperament.0010.b: "Teď pracuješ pro mě."
 ep3_camp_temperament.0010.c: "Za to zaplatíš."
 ep3_camp_temperament.0010.d: "Trocha jídla je může přesvědčit."
 ep3_camp_temperament.0010.e: "Nemusí mě mít rádi."
 ep3_camp_temperament_0010_tt: "Získáš #positive_value střední#! bonus k intrikám typu [GetScheme('murder').GetTypeName] a [GetScheme('sway').GetTypeName] namířeným proti [enemy.Custom('CZ_Name_D')]"
 ep3_heartbreak_modifier: "Známý nepřítel"
 ep3_heartbreak_modifier_desc: "Tato postava byla očerněna ve svém táboře blízkým členem rodiny."
 SCHEME_ET_TU_BRUTE: "[Select_CString(GetPlayer.IsFemale,'Zjistila','Zjistil')] jsi, co [target.GetShortUINameNoTooltip] chystá: $VALUE|+0=$"
 bribed_opinion: "Uplacený"
 ep3_determined_modifier: "Poháněný záští"
 ep3_determined_modifier_desc: "Tato postava je odhodlaná očistit své jméno za každou cenu."
 ep3_camp_temperament.0020.t: "Pověsti"
 ep3_camp_temperament.0020.desc: "Plachta mého stanu se rozhrne a přede mnou stojí [secret_giver.GetTitledFirstName]. S lehkou úklonou začne: „Promiňte, že ruším, [ROOT.Char.Custom('FormOfAddressForLiege')], ale nesu zprávu, která by vás mohla zajímat.“\n\n„[Select_CString(secret_giver.IsFemale,'Odpočívala','Odpočíval')] jsem v hostinci [ROOT.Char.Custom('GetPubName')] a [Select_CString(secret_giver.IsFemale,'popíjela','popíjel')] s partou, z níž se vyklubali služebníci [secret_owner.Custom('CZ_TitledFirstName_G')].“\n\n„O [Select_CString(secret_owner.IsFemale,'své paní','svém pánovi')] mluvili docela otevřeně. ‚A co [Select_CString(secret_owner.IsFemale,'ona','on')]?‘ [Select_CString(secret_giver.IsFemale,'zeptala','zeptal')] jsem se a ve váš prospěch se mi podařilo zjistit [Select_CString(secret_owner.IsFemale,'její','jeho')] tajemství.“"
 ep3_camp_temperament.0020.a: "„Tajemství by udělalo skvělý příběh...“"
 ep3_camp_temperament.0020.b: "„[Select_CString(secret_giver.IsFemale,'Odvedla','Odvedl')] jsi skvělou práci.“"
 ep3_camp_temperament.0020.c: "„Co jsi [Select_CString(secret_giver.IsFemale,'dělala','dělal')] v té hospodě...?“"
 ep3_camp_temperament.0020.d: "„Řekni mi to hned!“"
 ep3_camp_temperament.0020.e: "To ať mezi sebou vyřeší [secret_owner.GetTitledFirstNameNoTooltip] a [ROOT.Char.GetFaith.HighGodName]."
 ep3_camp_temperament_0020_d_tt: "Dozvíš se [Concept('secret','tajemství')|E] [secret_owner.Custom('CZ_ShortUIName_G')]"
 ep3_inspired_by_life: "Inspirováno životem"
 ep3_inspired_by_life_desc: "Tato postava používá svá známá tajemství k psaní poutavých příběhů."
 ep3_camp_temperament.0030.t: "Vzpoura!"
 ep3_camp_temperament.0030.desc.intro: "„Ach, [ROOT.Char.Custom('CZ_TitledFirstName_V')], jaká čest, že vás dnes večer mohu mít ve své společnosti,“ pozdraví mě [cocky_follower.GetTitledFirstName], když se blížím k ohni. Je [Select_CString(cocky_follower.IsFemale,'jediná','jediný')], kdo u něj ještě pije. „Prosím,“ ukáže na kmen naproti sobě a počká, až se posadím:\n\n„Nevypadá to zrovna dobře, že? Celý tábor je na vás naštvaný... a možná k tomu má důvod,"
 ep3_camp_temperament.0030.desc.no_food: "když jídla ubývá... nikdy nevíš.„"
 ep3_camp_temperament.0030.desc.other: "nemyslíš?"
 ep3_camp_temperament.0030.desc.outro: "\n\n„Byla by škoda, kdyby někdo... nevyužil příležitosti.“"
 ep3_camp_temperament.0030.a: "„Vlastně to byla... ehm... vina [bus_follower.Custom('CZ_ShortUINameNoTooltip_G')]!“"
 ep3_camp_temperament.0030.b: "„Ukážu vám to!“"
 ep3_camp_temperament.0030.b.success: "Vyhrajete boj"
 ep3_camp_temperament.0030.b.failure: "Prohrajete boj"
 ep3_camp_temperament.0030.c: "„Co jsi to právě řekl?“"
 ep3_camp_temperament.0030.d: "„Klidně můžete všichni odejít.“"
 ep3_camp_temperament.0030.e: "„Rozdělte toto zlato mezi své lidi.“"
 ep3_poopy_pants: "Neúspěšná vzpoura"
 ep3_poopy_pants_desc: "Tato postava byla veřejně ponížena, když se pokusila vyvolat vzpouru proti svému vůdci."
 benevolent_to_mutiniers_opinion: "Shovívavý k vzbouřencům"
 ep3_camp_temperament.0040.t: "Oddaný následovník"
 ep3_camp_temperament.0040.desc: "„Moment, [Select_CString(ROOT.Char.IsFemale,'má','můj')] [ROOT.Char.GetTitleAsNameNoTooltip],“ zastaví mě [follower.GetTitledFirstName], když procházím táborem. Ještě těžce oddychuje, když na mě promluví, [follower.Custom('quirk_pos_pp')]:\n\n„Nemysli si, že tvé úsilí nikdo nevidí. Lidé tě obdivují, děti si na tebe hrají a celý tábor tě má za [Select_CString(ROOT.Char.IsFemale,'největší ženu','největšího muže')] pod sluncem!“\n\n„Chci ti pomáhat, tak jako ty pomáháš nám. Vím o tvém... současném úsilí a myslím, že bych ti [Select_CString(follower.IsFemale,'byla','byl')] užitečnou posilou.“"
 ep3_camp_temperament.0040.a: "„Máš pravdu! Jsem skvělý!“"
 ep3_camp_temperament.0040.b: "„Dokončím tu práci #EMP sám.#!“"
 ep3_camp_temperament.0040.c: "„Jaká skvělá ukázka loajality!“"
 ep3_camp_temperament.0040.d: "„Buď mým hostem.“"
 ep3_camp_temperament.0040.d.tt: "[follower.GetShortUIName|U] zaplní nový $game_concept_success_chance_max_i$ slot pro [Concept('agent','spolčence')|E] typu [GetAgentSlotType( 'agent_devotee' ).GetName] v [my_scheme.GetName] [Concept('scheme','intrice')|E] proti [my_scheme.GetTargetCharacter.Custom('CZ_TitledFirstName_D')]"
 ep3_camp_temperament.0040.e: "„Postarej se, aby #EMP všichni#! věděli, jak skvělý jsem.“"
