l_polish:
 ep3_laamps.8000.t: "Pravda"
 ep3_laamps.8000.desc: "Od chvíle, kdy jsem [Select_CString(ROOT.Char.IsFemale,'vítězně vstoupila','vítězně vstoupil')] zpět do [claimed_land.Custom('CZ_LandedName_G')], se zpráva o mém příchodu mezi prostým lidem rychle roznesla. Každé město, kterým projíždím, se ke mně chová, jako bych těmto zemím stále [Select_CString(ROOT.Char.IsFemale,'vládla','vládl')], a zahrnuje mě dary a chválou.\n\nLidé spílají zlovůli [claim_holder.Custom('CZ_Name_G')] a zpívají písně o dni, kdy [Select_CString(claim_holder.IsFemale,'ji','ho')] svrhnu a vrátím těmto zemím spravedlnost a slušnost.\n\n"
 ep3_laamps.8000.desc.outro.sinner: "Zajímá mě, zda si vůbec skutečně pamatují, [Select_CString(ROOT.Char.IsFemale,'jaká jsem byla','jaký jsem byl')]..."
 ep3_laamps.8000.desc.outro: "Samozřejmě, jen potvrzují správnost mého nároku, ale jejich povzbuzování by mohlo přimět [claim_holder.GetNameNoTooltip], aby mě [Select_CString(claim_holder.IsFemale,'považovala','považoval')] za hrozbu."
 ep3_laamps.8000.a: "Jsem tu, abych si [Select_CString(ROOT.Char.IsFemale,'vzala','vzal')] zpět, co mi patří!"
 ep3_laamps.8000.b: "Jejich podpora mi pomůže na cestách."
 ep3_laamps.8010.t: "Věrný společník"
 ep3_laamps.8010.desc: "Nejnovější vrh z odchovny je mi představen. Čerstvě odstavená od matky lezou kolem a štěkají na svět, který je před nimi tak čerstvý a nový. Jedno robustní a silně vyhlížející štěně ignoruje okolí a lezou přímo ke mně, oči dokořán a ocas bezstarostně bičující jeho sourozence, jak mě pozoruje s úžasem a obdivem."
 ep3_laamps.8010.a: "Pojď sem."
 ep3_laamps.8020.t: "Cesta života"
 ep3_laamps.8020.desc: "Když se ukládám ke spánku, zaslechnu u svých stráží povyk. Sotva věřím vlastním očím: příčinou rozruchu je [wouldbe_companion.GetName], [Select_CString(wouldbe_companion.IsFemale,'členka','člen')] dvora [holder.Custom('CZ_FirstName_G')], [Select_CString(wouldbe_companion.IsFemale,'která','který')] se hádá s mou tělesnou stráží.\n\nVolá na mě z druhého konce tábora.\n\n„Prosím, vyslechni mě, [Select_CString(ROOT.Char.IsFemale,'paní','pane')]! Život u dvora je taková nuda, už tam nevydržím ani den! Chci se k tobě přidat na nekonečné cestě, která tě čeká, jestli mě vezmeš.“"
 ep3_laamps.8020.a: "„Pojď se mnou.“"
 ep3_laamps.8020.a.2: "„Vezmu tě s sebou, ale budeš se muset snažit udělat dojem.“"
 ep3_laamps.8020.b: "„Běž domů za svým pánem.“"
 ep3_laamps.8030.t: "Vzácná rudná příležitost"
 ep3_laamps.8030.desc: "[armorer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně v táboře přistoupí a leští přitom můj artefakt „[artifact.GetName]“.\n\n„[Select_CString(ROOT.Char.IsFemale,'Paní','Pane')], [location.GetName] oplývá ložisky kvalitních kovů, lepších, než jaké jsem kdy [Select_CString(armorer.IsFemale,'viděla','viděl')]. S vaším svolením bych [Select_CString(armorer.IsFemale,'ráda vylepšila','rád vylepšil')] váš artefakt „[artifact.GetNameNoTooltip]“ těmito vzácnými materiály.“"
 ep3_laamps.8030.a: "„Skvělý nápad!“"
 ep3_laamps.8030.a.win: "Tvůj artefakt se vylepší"
 ep3_laamps.8030.a.lose: "[armorer.GetFirstNameNoTooltip] pochybí"
 ep3_laamps.8030.b: "„Jen oprav mé vybavení.“"
 ep3_laamps.8030.c: "„Tyto nerosty by se měly prodat!“"
 ep3_laamps.8040.t: "Nechte spící psy spát"
 ep3_laamps.8040.desc: "Pronikavý výkřik mě vytrhne ze spánku do černé noci. Vydám se za zdrojem hluku a najdu [frightened_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)], jak se krčí před svým stanem.\n\n„[ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')]! Nechoď dovnitř, v mé posteli je vlk!“\n\nRozhrnu plachtu stanu a najdu tam vlčici s břichem plným mláďat. Cení na mě zuby a vrčí, nepochybně ze strachu, co bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] udělat jejím nenarozeným mláďatům."
 ep3_laamps.8040.a: "Zabiju to zvíře."
 ep3_laamps.8040.a.win: "Zabiješ vlka"
 ep3_laamps.8040.a.lose: "Jsi napaden"
 ep3_laamps.8040.b: "Štěňata by byla vynikající mazlíčci."
 ep3_laamps.8040.c: "Vypadá to jako začátek našeho nového chovu!"
 ep3_laamps.8040.d: "Budeme potřebovat nový stan."
 ep3_laamps.8050.t: "Bez přátel či ochrany"
 ep3_laamps.8050.desc.intro: "Při procházce u tábora ([ROOT.Char.Custom('GetRandomCampBuilding')|l]) mě vyruší [Select_CString(minority.IsFemale,'nervózní cizinka, která','nervózní cizinec, který')] se představí jako [minority.GetName] a je [CZPrepV(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetCurrentLocation,'L')] zjevně stejně cizí jako já.\n\n„[Select_CString(ROOT.Char.IsFemale,'Paní','Pane')],"
 ep3_laamps.8050.desc.mid.samefaith: "vy i já víme, že [minority.GetFaith.GetAdherentNamePlural|l] tu nejsou vítáni. Jistě jste se i vy [Select_CString(ROOT.Char.IsFemale,'setkala','setkal')] s předsudky, jimž v těchto krajích čelí ti, které vede [minority.GetFaith.HighGodName]."
 ep3_laamps.8050.desc.mid.alsohated: "vy i já oba víme, že tyto kraje nemají pochopení pro ty, kdo uctívají jinak než páni a dámy."
 ep3_laamps.8050.desc.mid.fallback: "v těchto krajích se necítím dobře a... [Select_CString(minority.IsFemale,'doufala','doufal')] jsem, že [Select_CString(ROOT.Char.IsFemale,'tak světaznalá žena','tak světaznalý muž')], jako jste vy, by [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] přijmout [Select_CString(minority.IsFemale,'bezdomovkyni','bezdomovce')], [Select_CString(minority.IsFemale,'která','který')] vyznává víru [minority.GetFaith.GetName]?“"
 ep3_laamps.8050.desc.outro: "\n\nNa okamžik se odmlčí a obrní se proti zjevně očekávanému odmítnutí.\n\n„Pochopím, jestli už se musíte starat o příliš mnoho lidí, ale jestli mě přijmete, budu vám věrně sloužit po všechny své dny.“"
 ep3_laamps.8050.a: "Samozřejmě!"
 ep3_laamps.8050.b: "Pomoz [Select_CString(minority.IsFemale,'jí','mu')] najít domov jinde."
 ep3_laamps.8050.c: "Zmiz, tuláku."
 ep3_laamps.8060.t: "Ani kapka"
 ep3_laamps.8060.desc: "Vyhřívám se na pouštním slunci a užívám si chvilku klidu v tom hektickém životě, který jsem si [Select_CString(ROOT.Char.IsFemale,'zvolila','zvolil')]. Pak se ozve praskot dřeva, výkřik a šplouchnutí vody a srdce se mi sevře.\n\nU promočených třísek, které zbyly z našeho sudu na vodu, stojí [idiot.Custom2('MyCharacterIntroduction', ROOT.Char)]. Zřejmě [Select_CString(idiot.IsFemale,'ho při vykládání upustila','ho při vykládání upustil')] na ostré kameny a poslední zbytky naší vody teď vsakují hluboko do písku."
 ep3_laamps.8060.a: "Musíme okamžitě najít další!"
 ep3_laamps.8060.a.win: "Narazíš na pramen"
 ep3_laamps.8060.a.lose: "Nic nenajdeš"
 ep3_laamps.8060.b: "No, je čas začít recyklovat..."
 ep3_laamps.8060.c: "„[idiot.GetFirstNameNoTooltip|U]! Ty to dáš do pořádku!“"
 ep3_laamps.8060.c.win: "[idiot.GetFirstNameNoTooltip|U] najde trochu vody"
 ep3_laamps.8060.c.lose: "[idiot.GetFirstNameNoTooltip|U] selže"
 ep3_laamps.8060.d: "Je čas přepadnout nějaké místní karavany."
 ep3_laamps.8060.d.lose: "Jsi přistižen!"
 ep3_laamps.8060.e: "Budeme muset přežít bez nich."
 ep3_laamps.8070.t: "Cizí plody"
 ep3_laamps.8070.desc: "Při svých toulkách mimo tábor narazím na mýtinu v lese posetou všemi druhy barevných bobulí na keřích. Jsou jiné než jaké jsem kdy [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')], vypadají tak lákavě a chutně a trvalo by mým následovníkům méně než hodinu je všechny nasbírat.\n\nMohly by to být tolik potřebný dar od [ROOT.Char.GetFaith.CreatorName|U], nebo lest od [ROOT.Char.GetFaith.TricksterGodName|U], která nás má prověřit?"
 ep3_laamps.8070.a: "Zajímalo by mě, co by na to řekl [forager.GetFirstNameNoTooltip]."
 ep3_laamps.8070.b: "Ach! Poznávám tyto plody!"
 ep3_laamps.8070.c: "Život je dobrodružství, i pro žaludek."
 ep3_laamps.8070.c.win: "Plody byly vynikající"
 ep3_laamps.8070.c.lose: "[Select_CString(ROOT.Char.IsFemale,'Snědla','Snědl')] jsi jed"
 ep3_laamps.8070.d: "Měli bychom přežít i bez nich."
 ep3_laamps.8080.t: "Podivný námořník"
 ep3_laamps.8080.desc.intro_sea: "[Select_CString(ROOT.Char.IsFemale,'Zakotvena','Zakotven')] na noc jsem [Select_CString(ROOT.Char.IsFemale,'zamířila','zamířil')] do místní krčmy, kde si brzy vyměňuji příběhy s podivným starým námořníkem jménem [sailor.GetFirstNameNicknamed].\n\n"
 ep3_laamps.8080.desc.intro: "Večer trávím v místní krčmě, vyprávím si příběhy s hovorným starým námořníkem, [sailor.GetFirstNameNicknamed].\n\n"
 ep3_laamps.8080.desc.outro: "„Vyprávíš jako [Select_CString(ROOT.Char.IsFemale,'nějaký chlap','nějaká ženská')], [ROOT.Char.Custom('FormOfAddressForLiege')]!“ zasměje se [sailor.GetFirstNameNoTooltip] a skočí mi do další historky. „Podívej se na mě – [sailor.Custom('GetInjuredBodyPart')|l]! Jednou měla moje loď díru a já [Select_CString(sailor.IsFemale,'neměla','neměl')] nic jiného, čím ji ucpat, než tohle!“\n\n„To byly slavné časy, [ROOT.Char.Custom('FormOfAddressForLiege')], to tedy ano...“ zasní se. „A tak [Select_CString(sailor.IsFemale,'ráda','rád')] bych je zase [Select_CString(sailor.IsFemale,'zažila','zažil')]...“"
 ep3_laamps.8080.a: "„Ahhha! Jsi génius!“"
 ep3_laamps.8080.b: "„V táboře bychom potřebovali starého námořníka.“"
 ep3_laamps.8080.c: "„Ty myslíš, že #EMP tohle#! byla dobrá historka?“"
 ep3_laamps.8080.c.win: "Tvé příběhy imponují"
 ep3_laamps.8080.c.lose: "Tvé příběhy nezaujmou"
 ep3_laamps.8080.d: "„Drž se ode mě.“"
 ep3_laamps.8090.t: "Vzdálené břehy"
 ep3_laamps.8090.desc.intro: "Procházím tržiště tohoto podivného kraje. Prodavači lákají v cizím jazyce a ztrácím se v moři neznámých vůní, ale divně se mi to všechno zdá jako domov.\n\n"
 ep3_laamps.8090.desc.world_europe: "Kde jinde bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] mít tu čest cítit čerstvou levanduli, nebo sledovat západ slunce nad troskami starého Říma, nebo poslouchat radostný sbor kostela, nebo v zimě být [Select_CString(ROOT.Char.IsFemale,'zahřáta','zahřát')] u krbu přátelského cizince? Nikde jinde než v Evropě."
 ep3_laamps.8090.desc.world_middle_east: "Vidět pouštní oblohu plnou hvězd, přejet přes písky uvnitř karavan s velbloudy, být svědkem velkoleposti nejstarších civilizací v Káhiře, Bagdádu, Persepolisu. Která země by se mohla považovat za srdce lidstva, jestli ne zde?"
 ep3_laamps.8090.desc.world_india: "Kde jinde bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] ochutnat jemnou rovnováhu aromatických koření a zapít to lahodným mango lassi? Poslouchat něžné melodie hráče na bansuri, nebo sledovat nádherné lotosy rozkvétající podél Gangy? Jen v Indii."
 ep3_laamps.8090.desc.world_africa: "Slyším sladké melodie bubnů odrážející se trhem, psi kňučící ve volné přírodě a cítím, jak začínám patřit. Mé nohy spočívají na cizím písku, podivní ptáci krouží na obloze a konečně se cítím spokojený(á)."
 ep3_laamps.8090.desc.world_steppe: "Kde jinde může být člověk svobodný než na nekonečně se rozprostírající stepi, kde nad ním není nic než velké modré nebe, které stvořil [ROOT.Char.GetFaith.CreatorName]? Skoro mám pocit, že bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] celý život běžet a jezdit, cítit vítr ve tváři a trávu pod nohama a navždy se hnát za obzorem."
 ep3_laamps.8090.desc.world_tibet: "V dálce slyším vzácný zvuk lidí zpívajících hrdelním zpěvem a cítím touhu připojit se k jejich sboru. Nekonečná kaskáda krásy Himálají se rozprostírá před námi a cítím nutkání objevit každý skrytý výklenek a tajné útočiště, které se v nich skrývá."
 ep3_laamps.8090.desc.world_burma: "Stoupající horko všemu dodává opaleskující lesk páva, muži a ženy hemží pod vysokými pagodami. Vůně čajových lístků prostupuje ulice a mísí se se svěže opracovaným teakem v ohromující směsi. Slunce je vysoko nad údolím vyhloubeným mohutnou řekou Irrawaddy a sto kultur, které v něm žijí, mě vítá jako dávno ztracenou [ROOT.Char.Custom('SisterBrother')]."
 ep3_laamps.8090.desc.world_asia_china: "Tyčící se hory poskytují stín rýžovým políčkům pod nimi. Chladný, vlhký vzduch se lepí na mou tvář, zatímco odháním komára. V horských údolích jsem [Select_CString(ROOT.Char.IsFemale,'nalezla','nalezl')] skutečné bohatství a mám pocit, že jsem [Select_CString(ROOT.Char.IsFemale,'našla','našel')] osobní ráj na zemi."
 ep3_laamps.8090.desc.world_asia_japan: "Zvuk vln narážejících na břeh mi plní uši a při hlubokém nádechu mě naplní slaný mořský vzduch až do plic. Klid prostupuje celé mé tělo a naplňuje mě touhou po životě. Chci nedělat nic jiného než zůstat v této zemi, byť jen na okamžik — vychutnat si to vše."
 ep3_laamps.8090.desc.world_asia_korea: "Jako páteř světa vidím dlouhé horské hřebeny, jak se rozprostírají až k obzoru, jejich vrcholky pokryté sněhem. Lidé zde jsou laskaví a štědří a dělají vše proto, abych se [Select_CString(ROOT.Char.IsFemale,'cítila vítána','cítil vítán')]."
 ep3_laamps.8090.desc.world_asia_southeast: "Těžké listy mě chrání před pálícím sluncem, zatímco si vychutnávám nádherné výhledy přede mnou. Vidím vážku usednout na leknín a nemohu si pomoct, než se zamyslím nad vlastní cestou. Jsem tou vážkou, toto místo je opravdu jedinečné a kouzelné a zcela jsem se do něj [Select_CString(ROOT.Char.IsFemale,'zamilovala','zamiloval')]."
 ep3_laamps.8090.desc.outro: "\n\nČlověk prochází [county.Custom('CZ_LandedNameNoTierNoTooltip_I')], ale je to pořád [ROOT.Char.GetFirstNameNicknamed]?"
 ep3_laamps.8090.a: "Copak člověk nemůže patřit ke kultuře [ROOT.Char.GetCulture.GetNameNoTooltip] #EMP i#! ke kultuře [county.GetCountyData.GetCulture.GetNameNoTooltip]?"
 ep3_laamps.8090.b: "Ať se ze mě stane kdokoli, bude to někdo úžasný!"
 ep3_laamps.8090.c: "Možná by všichni [ROOT.Char.GetCulture.GetNameNoTooltip] měli tady najít domov."
 every_child_in_camp: "Všechny tvé [Concept('children','děti')|E] v táboře"
 every_relative_in_camp_your_culture: "Každý člen [Concept('close_family','blízké rodiny')|E] v táboře, který patří k tvé [Concept('culture','kultuře')|E]"
 every_camp_member: "Všichni v táboře"
 cultural_acceptance_distant_hero: "Přijat velkým hrdinou"
 laamp_prepping_for_invasion: "Lidový hrdina"
 laamp_prepping_for_invasion_desc: "Rolníci začali tohoto jedince považovat za lidového hrdinu, který je zachrání před vysokými daněmi a tyranií."
 laamps_8090_preparing_invasion: "Příprava invaze"
 laamps_8090_preparing_invasion_desc: "Tento jedinec se připravuje vpadnout do cizích zemí a vytvořit tam nový domov pro svůj lid."
 laamp_familiar_lands: "Známé kraje"
 laamp_familiar_lands_desc: "Tento jedinec si užívá lidovou podporu rolníků v zemích, kterými cestuje."
 friend_trip_of_a_lifetime: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'vzala','vzal')] [TARGET_CHARACTER.GetShortUIName] na dobrodružství života"
 friend_trip_of_a_lifetime_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'vzala','vzal')] [CHARACTER.GetShortUIName] na dobrodružství života"
 friend_returned_my_companion: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'odmítla','odmítl')] příležitost vzít si jednoho z dvořanů [TARGET_CHARACTER.Custom('CZ_ShortUIName_G')]"
 friend_returned_my_companion_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'odmítla','odmítl')] příležitost vzít si jednoho z dvořanů [CHARACTER.Custom('CZ_ShortUIName_G')]"
 friend_gave_them_a_dog: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'darovala','daroval')] [TARGET_CHARACTER.GetShortUIName] silného a věrného psa"
 friend_gave_them_a_dog_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'darovala','daroval')] [CHARACTER.GetShortUIName] silného a věrného psa"
 friend_eccentric: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] se sblížili díky společným výstřednostem"
 artifact_durable_materials_02: "Odolné materiály"
 cultural_acceptance_fled_persecution: "Dobrodruh [Select_CString(ROOT.Char.IsFemale,'pomohla','pomohl')] některým menšinám uniknout pronásledování"
 friend_treasured_more_than_food: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'nabídla','nabídl')] [CHARACTER.GetShortUIName] zásoby v době potřeby."
 friend_treasured_more_than_food_corresponding: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'nabídla','nabídl')] [TARGET_CHARACTER.GetShortUIName] zásoby v době potřeby."
 laamp_legitimist_support_contract: "Legitimistická podpora"
 laamp_legitimist_support_contract_contract: "$laamp_legitimist_support_contract$"
 laamp_legitimist_support_contract_desc_title: "Právoplatnému dědici,"
 laamp_legitimist_support_contract_desc: "Zvěst o vašem oprávněném nároku se roznesla široko daleko a vytvořila příležitost pro projednání naší podpory."
 laamp_legitimist_support_contract_request: "Tímto jste [Select_CString(ROOT.Char.IsFemale,'pozvána','pozván')] dorazit před nás. Projednáme, jak vám můžeme pomoci ve vaší spravedlivé snaze. Jsme si jisti, že se domluvíme na ohromné podpoře, kterou vám poskytneme. A na skromné platbě, kterou od vás v budoucnu vybereme."
 ep3_laamps.8101.t: "$laamp_legitimist_support_contract$ — Příliš mnoho nároků"
 ep3_laamps.8101.desc: "„Vítejte, ach, vítejte. Jsme tak rádi, že jste [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')],“ říká [petitioned_ruler.GetName], když mě tajně uvedou před [Select_CString(petitioned_ruler.IsFemale,'ni','něj')].\n\n„Máme toho hodně k probrání. Nejprve si ale ujasněme, kam namíříte své úsilí. Zdá se, že máte nároky na několik různých titulů, a přestože bychom rádi viděli, jak je nakonec všechny získáte, začít se musí s jasným cílem, aby se vaše úsilí nerozmělnilo honbou za dvěma zajíci najednou.\n\nPrý je [title_2.GetName] v tuto roční dobu docela pěkné, ale volba je opravdu na vás. Který to tedy bude, hm?“"
 ep3_laamps.8101.a: "[title_1.GetName]"
 ep3_laamps.8101.a.desc: "Tuto volbu nelze později změnit. Další vyjednávání s jinými příznivci se také bude týkat tohoto titulu."
 ep3_laamps.8101.b: "[title_2.GetName]"
 ep3_laamps.8101.c: "[title_3.GetName]"
 ep3_laamps.8101.d: "[title_4.GetName]"
 ep3_laamps.8102.t: "$laamp_legitimist_support_contract$ — Předehra"
 ep3_laamps.8102.desc: "„Můžeme vám nabídnout zlato a naše nejlepší bojovníky výměnou za, řekněme, polovinu ročního příjmu [claimed_title.Custom('CZ_LandedName_G')].“ [petitioned_ruler.GetName|U] zjevně nechce ztrácet čas.\n\n„Už se nemůžeme dočkat, až uvidíme hlavu [claimed_title.GetHolder.Custom('CZ_Name_G')] na kopí. Ach, a až si nevyhnutelně řeknete o víc, nenudte nás prosím příliš, naše shovívavost má své meze.“\n\n#italic Na vyjednání podrobností dohody budeš mít [ROOT.Var('legitimist_turns').GetValue] tahů."
 ep3_laamps.8102.a: "„Nejdůležitější je, Vaše Milosti...“"
 ep3_laamps.8102.a.desc: "Začnete vyjednávání, aniž byste [Select_CString(ROOT.Char.IsFemale,'požadovala','požadoval')] více"
 ep3_laamps.8102.b: "Oslň [Select_CString(petitioned_ruler.IsFemale,'ji','ho')] svým důvtipem."
 ep3_laamps.8102.b.desc: "Začnete vyjednávání s vyšší úrovní podpory"
 ep3_laamps.8102.c: "Zmať [Select_CString(petitioned_ruler.IsFemale,'ji','ho')] blábolením."
 ep3_laamps.8102.c.desc: "Získáš více tahů na vyjednávání s [petitioned_ruler.Custom('CZ_Name_I')]"
 ep3_laamps.8102.d: "Mezi přáteli se čas nikdy nepromrhá!"
 ep3_laamps.8102.d.desc: "$ep3_laamps.8102.c.desc$"
 ep3_laamps.8102.e: "„Nechme nejdřív urovnat starý dluh.“"
 ep3_laamps.8102.e.desc: "$ep3_laamps.8102.b.desc$"
 ep3_laamps.8102.b.success: "Přesvědčíte [petitioned_ruler.GetShortUIName]"
 ep3_laamps.8102.b.failure: "Přijdeš o jeden tah vyjednávání"
 ep3_laamps.8103.t: "$laamp_legitimist_support_contract$ — Debata"
 ep3_laamps.8103.intro_1: "[petitioned_ruler.GetName] se v židli pohne, [Select_CString(petitioned_ruler.IsFemale,'její','jeho')] pohled vás propírá.\n\n"
 ep3_laamps.8103.intro_2: "Ve vzduchu visí napětí, v sázce je hodně. Z držení těla [petitioned_ruler.Custom('CZ_Name_G')] je ti jasné, jak moc [Select_CString(petitioned_ruler.IsFemale,'jí','mu')] na té věci záleží.\n\n"
 ep3_laamps.8103.intro_3: "Svíce byly vyměněny, poháry znovu naplněny. Služebníci [petitioned_ruler.Custom('CZ_Name_G')] beze slova odešli, neboť teď budou mluvit jejich páni.\n\n"
 ep3_laamps.8103.no_more_turns_flavor: "„Namluvili jsme se dost,“ řekne přísně. „Toto je naše poslední nabídka. Svou moudrost můžete prokázat tím, že ji přijmete.“"
 ep3_laamps.8103.mid_1: "„Vidíme to jako základ pro jasnou budoucnost, věříme, že máte kapacitu dodat a nezklamat. A v takovém úsudku se nemýlíme.“"
 ep3_laamps.8103.mid_2: "„Ano, ano, to by mohlo fungovat. Dá-li [petitioned_ruler.GetFaith.HighGodName], vyjde to! Jak to, že jste za námi [Select_CString(ROOT.Char.IsFemale,'nepřišla','nepřišel')] dřív? Jestli chcete uspět, musíte zapracovat na načasování.“"
 ep3_laamps.8103.mid_3: "„Ha! Rádi bychom viděli výraz na tváři [claimed_title.GetHolder.Custom('CZ_Name_G')], až dojdete do [capital_barony.Custom('CZ_LandedNameNoTier_G')] s našimi vojsky. Prosím, nechte někoho zapsat každý detail.“"
 ep3_laamp.8103.turns_left: "\n\n#italic Zbývá ti #color_yellow [ROOT.Var('legitimist_turns').GetValue] #!tahů vyjednávání"
 ep3_laamps.8103.support_6: "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] [Select_CString(petitioned_ruler.IsFemale,'slíbila','slíbil')] #EMP #color_yellow Ohromnou #!podporu - #color_yellow 1800 zlata a 3000 elitních vojáků.#!"
 ep3_laamps.8103.support_5: "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] [Select_CString(petitioned_ruler.IsFemale,'slíbila','slíbil')] #EMP #color_yellow Silnou #!podporu - #color_yellow 1500 zlata a 2500 elitních vojáků.#!"
 ep3_laamps.8103.support_4: "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] [Select_CString(petitioned_ruler.IsFemale,'slíbila','slíbil')] #EMP #color_yellow Významnou #!podporu - #color_yellow 1200 zlata a 2000 elitních vojáků.#!"
 ep3_laamps.8103.support_3: "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] [Select_CString(petitioned_ruler.IsFemale,'slíbila','slíbil')] #EMP #color_yellow Podstatnou #!podporu - #color_yellow 900 zlata a 1500 elitních vojáků.#!"
 ep3_laamps.8103.support_2: "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] [Select_CString(petitioned_ruler.IsFemale,'slíbila','slíbil')] #EMP #color_yellow Prostou #!podporu - #color_yellow 600 zlata a 1000 elitních vojáků.#!"
 ep3_laamps.8103.support_1: "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] [Select_CString(petitioned_ruler.IsFemale,'slíbila','slíbil')] #EMP #color_yellow Základní #!podporu - #color_yellow 300 zlata a 500 elitních vojáků.#!"
 ep3_laamps.8103.obligations: "\n#italic Po získání [claimed_title.Custom('CZ_LandedName_G')] budeš muset #color_yellow [ROOT.Var('legitimist_obligations').GetValue] #!krát, vždy jednou za dva roky, zaplatit #color_yellow polovinu svého ročního příjmu.#!"
 ep3_laamps.8103.one_obligations: "\n#italic Po získání [claimed_title.Custom('CZ_LandedName_G')] budeš muset zaplatit #color_yellow polovinu svého ročního příjmu.#!"
 ep3_laamps.8103.a: "Přesto, potřebujeme víc."
 ep3_laamps.8103.a.desc: "Nyní dostaneš větší podporu výměnou za další platbu později."
 ep3_laamps.8103.b: "Sláva má větší hodnotu než zlato!"
 ep3_laamps.8103.b.desc: "Přesvědčíš [petitioned_ruler.Custom('CZ_NameNoTooltip_A')], aby [Select_CString(petitioned_ruler.IsFemale,'poskytla','poskytl')] větší podporu, aniž bys [Select_CString(GetPlayer.IsFemale,'musela','musel')] platit víc"
 ep3_laamps.8103.b.success: "$ep3_laamps.8102.b.success$"
 ep3_laamps.8103.b.failure: "$ep3_laamps.8102.b.failure$"
 ep3_laamps.8103.c: "Nemohu vysát své království do sucha!"
 ep3_laamps.8103.c.desc: "Pokusíte se přesvědčit [petitioned_ruler.Custom('CZ_NameNoTooltip_A')], aby [Select_CString(petitioned_ruler.IsFemale,'snížila','snížil')] počet plateb o jednu."
 ep3_laamps.8103.c.success: "$ep3_laamps.8102.b.success$"
 ep3_laamps.8103.c.failure: "$ep3_laamps.8102.b.failure$"
 ep3_laamps.8103.d: "Je to... přijatelné."
 ep3_laamps.8103.d.desc: "@warning_icon! #color_red Tato možnost ukončí vyjednávání#!"
 ep3_laamps.8105.t: "$laamp_legitimist_support_contract$ — Závěr"
 ep3_laamps.8105.desc: "Dva vládci zabraní do vášnivého vyjednávání, jeden s korunou na skráních, zatímco mé jsou stále holé. Je to únava, co cítím, ta náhlá tíha na hlavě, nebo je koruna [claimed_title.Custom('CZ_LandedName_G')] už tak blízko?\n\nMůj škleb mě musel prozradit, protože se [petitioned_ruler.GetName] vědoucně usměje. „Bude z vás [Select_CString(ROOT.Char.IsFemale,'skvělá vládkyně','skvělý vládce')], a brzy – nejpozději do čtyř let. Naše vojska a zlato se o to postarají. A nebojte se, připomeneme vám, kdybyste náhodou... [Select_CString(ROOT.Char.IsFemale,'zapomněla','zapomněl')] na svůj díl naší dohody.“\n\nZvedne pohár k poslednímu přípitku, jímž dohodu zpečetí."
 ep3_laamps.8105.a: "Trpělivost je klíčová ve vojenských záležitostech."
 ep3_laamps.8105.a.desc: "Požádáte o více času na přípravu války."
 ep3_laamps.8105.a.success: "Máš 8 let na uplatnění nároku na [claimed_title.Custom('CZ_LandedName_A')]"
 ep3_laamps.8105.a.failure: "Máš 4 roky na uplatnění nároku na [claimed_title.Custom('CZ_LandedName_A')]"
 ep3_laamps.8105.b: "Na budoucnost [claimed_title.Custom('CZ_LandedName_G')]!"
 ep3_laamps.8105.b.desc: "Souhlasíte s podmínkami. $ep3_laamps.8105.a.failure$"
 ep3_laamps.8105.c: "Tohle byla ztráta času."
 ep3_laamps.8105.c.desc: "@warning_icon! #color_red Přerušíte vyjednávání.#! [petitioned_ruler.GetName] vás nepodpoří a bude o vás mít jistě horší mínění."
 ep3_laamps.8105.invalidations_reasons: "@warning_icon! #color_red Pokud získáte jiný titul než [claimed_title.GetName] nebo změníte účel tábora, dohoda bude zrušena.#!\nDědic [petitioned_ruler.GetPrimaryTitle.Custom('CZ_LandedName_G')] zdědí závazky. #weak Mohou existovat cesty, jak se z placení vykroutit..."
 ep3_laamps.8106.t: "$laamp_legitimist_support_contract$ — Nastal čas"
 ep3_laamps.8106.desc: "Před lety mi [petitioned_ruler.GetName] [Select_CString(petitioned_ruler.IsFemale,'poskytla','poskytl')] vynikající vojáky a zlato, aby mi [Select_CString(petitioned_ruler.IsFemale,'pomohla','pomohl')] získat zpět, co mi právem náleží.\n\nTrůn [claimed_title.Custom('CZ_LandedName_G')] — obsazený odporným uzurpátorem [claimed_title.GetHolder.Custom('CZ_ShortUIName_I')]!\n\n[petitioned_ruler.GetShortUIName|U] očekává, že zaútočím brzy, a s každým dnem roste jeho netrpělivost. Jsou naše síly připraveny? [Select_CString(ROOT.Char.IsFemale,'Zajistila','Zajistil')] jsem dost podpory? Pláčí lidé [CZPrepV(claimed_title.GetNameNoTooltip)] [claimed_title.Custom('CZ_LandedName_L')] dostatečně pro můj triumfální návrat?"
 ep3_laamps.8106.a: "[claimed_title.GetHolder.GetShortUIName] pozná chlad oceli!"
 ep3_laamps.8106.a.desc: "Budeme muset jednat, pokud chceme žít v jiném světě."
 ep3_laamps.8106.b: "Čas ještě není správný."
 ep3_laamps.8106.b.success: "$ep3_laamps.8102.b.success$"
 ep3_laamps.8106.b.failure: "Tvé závazky se zvýšily"
 ep3_laamps.8106.b.desc: "Budeš mít o 2 roky více času na uplatnění nároku na [claimed_title.Custom('CZ_LandedName_A')]"
 ep3_laamps.8106.c: "Vidím svůj osud jinde."
 ep3_laamps.8106.c.desc: "@warning_icon! Porušíš dohodu. [petitioned_ruler.GetName|U] bude #EMP nesmírně [Select_CString(petitioned_ruler.IsFemale,'nespokojená','nespokojený')]#!"
 ep3_laamps.8107.t: "Náš nehodný [ROOT.Char.GetFirstName],"
 ep3_laamps.8107.desc: "Slova nedokážou vyjádřit, jak jsme zklamáni tebou. #EMP Ty červíku#! Měli jsme před sebou tak světlou budoucnost a ty jsi se [Select_CString(ROOT.Char.IsFemale,'rozhodla','rozhodl')] vše zahořeknout.\nPovažujeme se hluboce pobouřeni a tebe za larvu. Prosím, buď tak taktní a zmizni z tohoto světa tiše a uboze."
 ep3_laamps.8107.a: "Osud [Select_CString(ROOT.Char.IsFemale,'měla','měl')] jiné plány."
 ep3_laamps.8107.a.desc: "Nepodařilo se ti prosadit nárok na [claimed_title.Custom('CZ_LandedName_A')]"
 ep3_laamps.8108.t: "$laamp_legitimist_support_contract$ — Cena"
 ep3_laamps.8108.desc: "Jaký to byl radostný vítězný příchod do [claimed_title.Custom('CZ_LandedName_G')]! Po tak dlouhé době strávené na nehostinných cestách, vždy hostem v cizích krajích, bez domova, bez mého oprávněného nároku, má sladká [claimed_title.GetTierAsNameNoTooltip]. Konečně je vše správně, tak jak mělo být od začátku. Jsem [Select_CString(ROOT.Char.IsFemale,'mocná','mocný')] [ROOT.Char.GetTitleAsNameNoTooltip].\n\nJe tu však trn v té kytici. [petitioned_ruler.GetName|U], [Select_CString(petitioned_ruler.IsFemale,'která','který')] mi nesmírně [Select_CString(petitioned_ruler.IsFemale,'pomohla','pomohl')] to dosáhnout, požaduje, abych [Select_CString(ROOT.Char.IsFemale,'zaplatila','zaplatil')], co jsme si tehdy domluvili. Vždyť ctihodný [ROOT.Char.GetHouse.GetNameNoTooltip] přece platí své dluhy, ne?"
 ep3_laamps.8108.a: "[Glossary( 'Pacta Sunt Servanda', 'PACTA_SUNT_SERVANTA_GLOSS' )]"
 PACTA_SUNT_SERVANTA_GLOSS: "Latinsky „Dohody musí být dodrženy“"
 ep3_laamps.8108.payments_left: "#color_yellow [petitioned_ruler.MakeScope.Var('legitimist_obligations_left').GetValue] Plateb #!left"
 ep3_laamps.8108.no_payments_left: "Toto je poslední platba pro [petitioned_ruler.GetName]."
 ep3_laamps.8108.b: "Zaplatím, ale ne hned."
 ep3_laamps.8108.b.desc: "Platbu odkládáte na příští rok. Stále však budete muset později uhradit dohodnutou částku."
 ep3_laamps.8108.b.success: "Sestavíte přesvědčivý argument"
 ep3_laamps.8108.b.failure: "Tvůj argument vyzní jako chabá výmluva"
 ep3_laamps.8108.c: "[petitioned_ruler.GetShortUINameNoTooltip], ty naprostý hlupáku!"
 ep3_laamps.8108.c.desc: "@warning_icon! [petitioned_ruler.Custom('CZ_Name_D')|U] nezaplatíš ani zlámanou grešli. [Select_CString(petitioned_ruler.IsFemale,'Měla','Měl')] být chytřejší."
 ep3_laamps.8108.legitimist_too_poor: "#italic Kvůli vašemu skromnému [Concept('income','příjmu')|E] vracíte pokaždé pouze přesnou částku: #color_yellow 300 #! [gold_i]"
 ep3_laamps.8109.t: "Pro [ROOT.Char.GetNameNoTooltip]"
 ep3_laamps.8109.desc: "Naše srdce plní takový smutek, že náš drahý [previous_ruler.GetName] už nesedí na trůnu – kéž [petitioned_ruler.GetFaith.HighGodName] žehná [Select_CString(previous_ruler.IsFemale,'její','jeho')] duši. Bohužel zůstává nevyřízená platba za naši pomoc s tím, aby na ten trůn [Select_CString(previous_ruler.IsFemale,'usedla','usedl')]. Doufáme, že vás s podrobnostmi seznámili. A že jste [Select_CString(ROOT.Char.IsFemale,'natolik čestná, abyste dodržela','natolik čestný, abyste dodržel')] svůj díl."
 ep3_laamps.8109.a: "$ep3_laamps.8108.a$"
 ep3_laamps.8109.a.desc: "Za rok bude [petitioned_ruler.GetShortUIName] očekávat platbu ve výši poloviny ročního příjmu tvé říše"
 ep3_laamps.8110.t: "$laamp_legitimist_support_contract$ — Neočekávaný závěr"
 ep3_laamps.8110.desc_intro: "Před dávnou dobou byla uzavřena dohoda – [petitioned_ruler.GetName] [Select_CString(petitioned_ruler.IsFemale,'poskytla','poskytl')] na znovuzískání [claimed_title.Custom('CZ_LandedName_G')] předem vojáky a zlato výměnou za značnou část příjmů mé říše.\n\n[Select_CString(petitioned_ruler.IsFemale,'Nemohla','Nemohl')] ale předvídat, že "
 ep3_laamps.8110.desc_war: "se mnou se zaplete do smrtelné války"
 ep3_laamps.8110.desc_imprisoned: "[Select_CString(ROOT.Char.IsFemale,'byla vržena','byl vržen')] do mých kobek"
 ep3_laamps.8110.desc_killer_root: "[Select_CString(ROOT.Char.IsFemale,'byla zabita','byl zabit')] mou rukou"
 ep3_laamps.8110.desc_dead: "[Select_CString(ROOT.Char.IsFemale,'odešla','odešel')] z tohoto světa"
 ep3_laamps.8110.desc_unlanded: "[Select_CString(ROOT.Char.IsFemale,'ztratila','ztratil')] svou čest a titul"
 ep3_laamps.8110.desc_outro: "než [Select_CString(ROOT.Char.IsFemale,'byla','byl')] dluh plně splacen. Zdá se, že nikdo jiný dost významný v [Select_CString(petitioned_ruler.IsFemale,'její','jeho')] říši nebyl obeznámen s detaily dohody. Je nyní zřejmé — nikdo nepřijde vybírat.\n\nPodivný obrat událostí, skoro jako by někdo mazaně řídil proudy osudu."
 ep3_laamps.8110.a: "Jak úžasné!"
 ep3_laamps.8111.t: "Nadcházející legitimistická platba"
 ep3_laamps.8111.desc: "Do #color_yellow šesti #! měsíců musíš [petitioned_ruler.Custom('CZ_ShortUINameNoTooltip_D')] zaplatit [TopScope.GetValue('incoming_payment_value')] [gold_i]!"
 request_laamp_legitimist_support: "Požádat o legitimistickou podporu"
 request_laamp_legitimist_support_interaction_desc: "Požádej o pozvání k jednání o rozsahu a podmínkách podpory tvého legitimistického nároku"
 ep3_legitimist_army: "Legitimistická armáda"
 laamp_legitimist_support_contract_success: "Po přijetí této [Concept('task_contract','zakázky')|E] a cestě do [CZProvName(recipient.GetCurrentLocation,'G')] budete schopni vyjednat až #color_yellow 1800 zlatých#! a #color_yellow 3000 elitních vojáků#! výměnou za značné následné platby."
 laamp_legitimist_support_contract_failure: "Vyjednávání selže. Budeš muset hledat pomoc jinde."
 request_laamp_legitimist_support_already_supporting: "Tato postava již podporuje legitimistu"
 request_laamp_legitimist_have_claim_on_target: "Máš [Concept('claim','nárok')|E] na [Concept('realm','panství')|E] této postavy"
 YOU_HAVE_HOOK_REASON: "Máš páku na [recipient.Custom('CZ_ShortUIName_A')]: $VALUE|=+0$"
 ep3_laamps.8200.t: "Nová tvář v táboře"
 ep3_laamps.8200.desc_1: "Zatímco se snažím rozvrhnout, jak zvládneme další přesun, [Select_CString(new_person.IsFemale,'jakási obrovitá kolemjdoucí','jakýsi obrovitý kolemjdoucí')] bez námahy zvedne jeden z našich vozů. Jeden z mých družiníků ke mně přiběhne a prosí:\n\n„[ROOT.Char.Custom('MistressMaster')|U], [Select_CString(new_person.IsFemale,'zvedla','zvedl')] celý vůz nad hlavu! Může u nás zůstat? Ani nepotřebuje zbraň, nepřátele může prostě popadnout a odhodit!“\n\n[Select_CString(new_person.IsFemale,'Taková žena','Takový muž')] by se [Select_CString(new_person.IsFemale,'mohla','mohl')] hodit, třeba i k nošení mých zavazadel. Spotřebuje ale hodně proviantu."
 ep3_laamps.8200.desc_2: "Jeden jediný smích protrhne temnotu noci. Pak další, a vidím, jak se moji přísní stoupenci proměnili v roj se smíchem dětí. Co způsobuje tento rozruch?\n\n„Ach, [ROOT.Char.Custom('CZ_TitledFirstNameNoTooltip_V')], konečně se setkáváme! Dovolte mi představit se, jsem [new_person.GetName], [Select_CString(new_person.IsFemale,'šašková mimořádná','šašek mimořádný')]. Jednou jsem [Select_CString(new_person.IsFemale,'vystupovala','vystupoval')] pro [Select_CString(location_top_liege.IsFemale,'velkou','velkého')] [location_top_liege.Custom('CZ_Name_A')], ale nyní se nabízím vám a vašemu smyslu pro humor!“"
 ep3_laamps.8200.desc_3: "Už nějaký čas pobýváme [CZTerrainIn(location)] [location_county.Custom('CZ_LandedNameNoTier_G')] mezi lidmi kultury [location.GetCulture.GetName]. Místní často chodí do našeho tábora obchodovat, nebo se jen tak poflakovat. Nedávno jsem si [Select_CString(ROOT.Char.IsFemale,'všimla','všiml')] [Select_CString(new_person.IsFemale,'ženy, která','muže, který')] se tu zdržuje déle než ostatní.\n\n„Tady [CZPrepV(location_county.GetNameNoTierNoTooltip)] [location_county.Custom('CZ_LandedNameNoTier_L')] se střídají hubená a tučná léta. A myslím, že hubená léta se vracejí. Nechci zemřít tam, kde jsem se [Select_CString(new_person.IsFemale,'narodila','narodil')], nechci tu zůstat ani o chvíli déle. Pokorně prosím, dovolte mi přidat se k vaší družině, [ROOT.Char.Custom('FormOfAddressForLiege')].“"
 ep3_laamps.8200.a: "Vítej, [new_person.GetFirstNameNoTooltip]!"
 ep3_laamps.8200.b: "Prosím, jdi pryč."
 ep3_laamps.8200.c: "Odejděte a rozšiřte zprávu: Držte se dál!"
 ep3_laamps.8200.c.tt: "Postavy se po následujících 20 let nebudou náhodně pokoušet přidat k vašemu táboru."
