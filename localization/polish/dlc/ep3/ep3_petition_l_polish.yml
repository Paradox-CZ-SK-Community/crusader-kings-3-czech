 petition_liege.0101.t.governorship: "$petition_liege_header$ Jmenování guvernéra"
 petition_liege.0101.t.house_governorship_rights: "$petition_liege_header$ Rodová práva k guvernérství"
 petition_liege.0101.desc.council_seat_family: "prosím, [Select_CString(petition_liege.IsFemale,'má paní','můj pane')], dovolte [Select_CString(petition_char.IsFemale,'mé','mému')] [petition_char.Custom2('CZ_RelationToMeShort_D', petition_char)|l] zasednout ve vaší radě.“\n\n„[Select_CString(petition_char.IsFemale,'Její','Jeho')] schopnosti jsou přehlíženy, zatímco na nejvyšších místech se naslouchá horším. [Select_CString(petition_char.IsFemale,'Ráda by','Rád by')] s vámi [Select_CString(petition_char.IsFemale,'sdílela','sdílel')] břímě vlády jako [petition_char.Custom('GetCouncilPositionRequest')].“"
 petition_liege.0101.desc.court_position: "prosím, [Select_CString(petition_liege.IsFemale,'má paní','můj pane')], přijměte mé služby u svého dvora.“\n\n„Mé schopnosti přicházejí vniveč, místo aby sloužily vašim zájmům.“"
 petition_liege.0101.desc.court_position_family: "prosím, [Select_CString(petition_liege.IsFemale,'má paní','můj pane')], přijměte [petition_char.Custom('CZ_Name_A')] ke svému dvoru.“\n\n„Je to velký talent, ale ve vašich službách by [Select_CString(petition_char.IsFemale,'se jí','se mu')] dařilo lépe než v mých.“"
 petition_liege.0101.desc.governorship: "prosím, [Select_CString(petition_liege.IsFemale,'má paní','můj pane')], udělíte mi guvernérství?“\n\n„Toužím sloužit říši a upřímně řečeno, mé schopnosti přicházejí vniveč. S vlastní provincií bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] sloužit vašim zájmům.“"
 petition_liege.0101.desc.governorship_family: "prosím, [Select_CString(petition_liege.IsFemale,'má paní','můj pane')], udělíte [petition_char.Custom('CZ_Name_D')] guvernérství?“\n\n„Touží sloužit říši a upřímně řečeno je škoda, aby [Select_CString(petition_char.IsFemale,'posluhovala','posluhoval')] jen mně. [Select_CString(petition_char.IsFemale,'Měla','Měl')] by mít vlastní provincii, aby [Select_CString(petition_char.IsFemale,'mohla','mohl')] sloužit vašim zájmům.“"
 petition_liege.0101.desc.house_governorship_rights: "prosím, [Select_CString(petition_liege.IsFemale,'má paní','můj pane')], udělíte rodu [petition_vassal.GetHouse.GetBaseName] právo i nadále spravovat [petition_vassal.GetPrimaryTitle.GetAdjective] [petition_vassal.GetPrimaryTitle.GetTierAsNameNoTooltip|l]?“\n\n„Má rodina tu oblast jako vaši věrní poddaní dobře spravovala a přeje si jen pokračovat.“"
