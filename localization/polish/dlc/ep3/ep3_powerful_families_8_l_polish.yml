l_polish:
 ep3_powerful_families.8000.t: "Ve vysokých kruzích"
 ep3_powerful_families.8000.desc: "Dnes otevírám dopis od [influential_family_member.Custom2('MyCharacterIntroduction', ROOT.Char)]. [Select_CString(influential_family_member.IsFemale,'Její','Jeho')] nízký charakter a úskočná povaha se v něm ukazují v plné nahotě: navrhuje, abychom [Select_CString(influential_family_member.IsFemale,'jejího','jeho')] postavení využili k tomu, abychom se dostali k listinám, které má v držení [liege.GetTitleAsNameNoTooltip], a upravili je.\n\nJmenování [influential_family_member.Custom('CZ_NameNoTooltip_G')] ke dvoru [liege.Custom('CZ_Name_G')] bylo dosud pro zájmy rodiny neocenitelné. [Select_CString(influential_family_member.IsFemale,'Její','Jeho')] návrh by nás sice mohl posunout ještě dál, ale také by mohl [Select_CString(influential_family_member.IsFemale,'její','jeho')] postavení nadobro ohrozit..."
 ep3_powerful_families.8000.a: "Výborná příležitost!"
 ep3_powerful_families.8000.a.win: "[influential_family_member.GetFirstNameNoTooltip] uspěje"
 ep3_powerful_families.8000.a.lose: "[influential_family_member.GetFirstNameNoTooltip] je přistižen"
 ep3_powerful_families.8000.b: "Prohledej archiv a najdi tajemství!"
 ep3_powerful_families.8000.b.tt: "[influential_family_member.GetFirstNameNoTooltip] možná odhalí tajemství [liege.Custom('CZ_NameNoTooltip_G')]"
 ep3_powerful_families.8000.b.win.secret: "[influential_family_member.GetFirstNameNoTooltip] odhalí tajemství"
 ep3_powerful_families.8000.b.win.no_secret: "[influential_family_member.GetFirstNameNoTooltip] nenajde žádná tajemství"
 ep3_powerful_families.8000.c: "Zůstaň věrným služebníkem."
 ep3_powerful_families.8010.t: "[liege.GetTitleAsNameNoTooltip|U] v nesnázích"
 ep3_powerful_families.8010.desc: "[war.GetName|U] zuří a po řadě neúspěšných bitev a obléhání se [liege.GetName] ocitl v defenzivě. Po celém [liege.GetPrimaryTitle.Custom('CZ_LandedName_L')] vlivné rody a dvořané mumlají a intrikují, aby prosadili své vlastní zájmy v momentě slabosti [liege.GetTitleAsNameNoTooltip|U], a možná nyní přišla i naše chvíle udělat totéž.\n\nPokud [liege.GetTitleAsNameNoTooltip|U] pomůžeme, můžeme si získat [Select_CString(liege.IsFemale,'její','jeho')] přízeň a ovinout náš vliv kolem trůnu jako mocná réva..."
 ep3_powerful_families.8010.a: "Nějaká finanční pomoc získá [Select_CString(liege.IsFemale,'její','jeho')] důvěru."
 ep3_powerful_families.8010.b: "Měli bychom přímo vyslat naše jednotky do války!"
 ep3_powerful_families.8010.c: "Musíme využít tento okamžik slabosti."
 ep3_powerful_families.8010.a.win: "Tvůj vliv roste"
 ep3_powerful_families.8010.a.lose: "[liege.GetTitleAsNameNoTooltip|U] se stává podezřívavým"
 ep3_powerful_families.8010.d: "Teď není ten správný čas."
 ep3_powerful_families.8011.t: "[generous_family.Custom2('AppropriateGreetingPositive', liege )]"
 ep3_powerful_families.8011.desc: "Tvé statečné boje ve válce [war.GetName] neunikly pozornosti mé rodiny. Vezmi si svůj díl našeho bohatství, ať nám všem pomůže k vítězství!"
 ep3_powerful_families.8011.a: "Jak štědré."
 ep3_powerful_families.8012.t: "Rodina, která válčí společně"
 ep3_powerful_families.8012.desc: "Není tajemstvím, že válka [war.GetName] se nevyvíjí tak dobře, jak jsme zpočátku čekali, a rozhádané rody už kují pikle, jak zaplnit rostoucí mocenské vakuum v říši. [generous_family.GetName|U] to však chce udělat způsobem, který je pro mě nejvýhodnější.\n\nV dopise mi nabízí, že do války pošle svá vojska, ovšem jen výměnou za značné množství čestných titulů a pravomocí."
 ep3_powerful_families.8012.a: "Velmi dobře."
 ep3_powerful_families.8012.a.toast: "[liege.GetFirstName] přijímá tvou nabídku"
 ep3_powerful_families.8012.b: "Nenechám se využít!"
 ep3_powerful_families.8012.b.toast: "[liege.GetFirstName] odmítá tvou nabídku"
 ep3_powerful_families.8020.t: "V zárodku"
 ep3_powerful_families.8020.desc: "Po celém království se moc nového rodu zdá zakořeňovat. Jako plevel rozšířili svůj vliv do všech koutů naší společnosti a sotva uplyne den, aby člověk neslyšel jméno „[new_family.GetHouse.GetBaseName].“\n\nNelze popřít, že tento rod vykvetl v jeden z největších v říši, a moje rodina se nyní obrací na mě pro rady, jak bychom měli k této nové moci přistoupit."
 ep3_powerful_families.8020.a: "Musíme je potlačit."
 ep3_powerful_families.8020.a.win: "Zatím potlačíte jejich vliv"
 ep3_powerful_families.8020.a.lose: "Tvé snahy jsou marné"
 ep3_powerful_families.8020.b: "Musíme jim dát najevo, že jsme přátelé."
 ep3_powerful_families.8020.b.win: "[new_family.GetFirstName] je ohromen"
 ep3_powerful_families.8020.b.lose: "[new_family.GetFirstName] není ohromen"
 ep3_powerful_families.8020.c: "Jednoduše se jim vyhněte."
 ep3_powerful_families.8030.t: "Rody, které intrikují společně..."
 ep3_powerful_families.8030.desc: "[faction.GetName|U] je stále v zárodku, ale samozřejmě má podporu mé velké rodiny. Některé rody však zatím nevidí spravedlnost naší věci a dosud odmítly příležitost připojit se k nám.\n\nPři psaní dopisů koordinujících další kroky frakce si nemohu odpustit přemítání, proč [friendly_family.Custom2('MyCharacterIntroduction', ROOT.Char)] dosud [Select_CString(friendly_family.IsFemale,'nevyslovila','nevyslovil')] podporu naší věci."
 ep3_powerful_families.8030.a: "Musím [Select_CString(friendly_family.IsFemale,'ji','ho')] okamžitě kontaktovat!"
 ep3_powerful_families.8030.a.win: "Přesvědčíš [Select_CString(friendly_family.IsFemale,'ji','ho')]"
 ep3_powerful_families.8030.a.lose: "Nedostanete odpověď"
 ep3_powerful_families.8030.b: "K tomu přátelé nejsou."
 ep3_powerful_families.8040.t: "Srdečně"
 ep3_powerful_families.8040.desc: "Odkdy je [location.GetName] ve vlastnictví rodu [other_family.GetHouse.GetName], [Select_CString(ROOT.Char.IsFemale,'začala','začal')] jsem se cítit jako host na vlastním sídle. Samozřejmě mi patří pozemky uvnitř panství, ale všechno za branami patří [other_family.Custom('CZ_Name_D')].\n\nKdyž se vydávám na ranní procházku po pozemcích, nemohu si pomoci a přemýšlím, zda by nebylo politicky výhodné mít po svém boku [other_family.Custom('CZ_FirstNameNoTooltip_A')]..."
 ep3_powerful_families.8040.a: "Musíme [Select_CString(other_family.IsFemale,'ji','ho')] okamžitě pozvat!"
 ep3_powerful_families.8040.a.win: "Návštěva proběhla dobře"
 ep3_powerful_families.8040.a.lose: "Návštěva byla katastrofa"
 ep3_powerful_families.8040.b: "Musíme usilovat o to, aby tyto pozemky byly naše."
 ep3_powerful_families.8040.b.win: "Tvůj vliv se šíří"
 ep3_powerful_families.8040.b.lose: "Tvé pikle jsou odhaleny"
 ep3_powerful_families.8040.c: "Musím prostě držet nízký profil."
 ep3_powerful_families.8060.t: "Zákeřná vila"
 ep3_powerful_families.8060.desc: "Procházím se v klidu po [location.Custom('CZ_LandedNameNoTier_L')] se svou obvyklou družinou důvěrníků a ochránců a obdivuji nádherné stavby. Jsem opojen radostí z pozemků, jimiž vládnu, ale pak mi náladu zkalí, když spatřím groteskní držbu rodu [other_family.GetHouse.GetName].\n\nJejich statky jsou jako rozeseté bradavice na mém jinak dokonalém panství a cítím, jak mi prudce buší krev při pomyšlení, že bych měl dál snášet jejich přítomnost."
 ep3_powerful_families.8060.a: "Udeřte na jejich finance."
 ep3_powerful_families.8060.a.win: "Připravíš je o jejich bohatství"
 ep3_powerful_families.8060.a.lose: "Přistihnou tě"
 ep3_powerful_families.8060.b: "Podplaťte jejich služebníky."
 ep3_powerful_families.8060.c: "Musím zatím snášet jejich přítomnost."
 ep3_powerful_families.8070.t: "Pošetilost"
 ep3_powerful_families.8070.desc: "Mí strážní mi hodí k nohám [Select_CString(child.IsFemale,'třesoucí se','třesoucího se')] [child.Custom('CZ_Name_A')]. Ve tváři má vepsanou hanbu a ani si nedokážu představit, co [Select_CString(child.IsFemale,'provedla','provedl')].\n\n„[Select_CString(child.IsFemale,'Tuhle','Tohohle')] [child.Custom2('CZ_InsultNoun_A', ROOT.Char)] jsme našli, jak se má jako doma na panství rodu [other_family.GetHouse.GetName]. Nemusíte hádat, komu je doopravdy [Select_CString(child.IsFemale,'věrná','věrný')].“\n\nPředstava, že se má vlastní krev paktuje s mými nepřáteli, je odporná, ale možná se [Select_CString(child.IsFemale,'její','jeho')] známosti dají využít."
 ep3_powerful_families.8070.a: "„Pokračuj tam a řekni mi všechno.“"
 ep3_powerful_families.8070.a.win: "[child.GetFirstNameNoTooltip|U] se stane tvým informátorem"
 ep3_powerful_families.8070.a.lose: "[child.GetFirstNameNoTooltip|U] je přistižen"
 ep3_powerful_families.8070.b: "„Snaž se ukončit toto naše pošetilé soupeření.“"
 ep3_powerful_families.8070.b.crit_win: "[child.GetFirstNameNoTooltip|U] ukončí soupeření"
 ep3_powerful_families.8070.b.win: "[child.GetFirstNameNoTooltip|U] udělá pokrok"
 ep3_powerful_families.8070.b.lose: "[child.GetFirstNameNoTooltip|U] selže"
 ep3_powerful_families.8070.c: "„Zmizni mi z očí.“"
 ep3_powerful_families.8080.t: "Koktavé ticho"
 ep3_powerful_families.8080.desc: "Cinknutí o pohár obrátí veškerou pozornost k [other_family.Custom('CZ_Name_D')], [Select_CString(other_family.IsFemale,'která vstává, aby pronesla','který vstává, aby pronesl')] řeč. Začne dobře, ale drobné zaváhání se brzy změní v dlouhé, trapné ticho.\n\nPodívá se na mě se strachem a zoufalstvím ve tváři a mlčky mě prosí, abych [Select_CString(other_family.IsFemale,'jí','mu')] [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')] na pomoc."
 ep3_powerful_families.8080.a: "Perfektní příležitost ponížit rod [other_family.GetHouse.GetNameNoTooltip]!"
 ep3_powerful_families.8080.b: "Pomohu."
 ep3_powerful_families.8090.t: "Civilní surovost"
 ep3_powerful_families.8090.desc: "Dnes večer jsem [Select_CString(ROOT.Char.IsFemale,'vklíněná','vklíněný')] mezi [liege.Custom('CZ_Name_A')] a [Select_CString(other_family.IsFemale,'tu','toho')] [other_family.Custom2('CZ_InsultAdjective_A', ROOT.Char)] [other_family.Custom('CZ_Name_A')]. Musím poslouchat, jak ten podlézavec donekonečna žvaní o oddanosti a talentu rodu [other_family.GetHouse.GetName].\n\nOdpornější než slova, která [Select_CString(other_family.IsFemale,'jí','mu')] proudí z úst, jsou jen kousky jídla, které s nimi létají. Musím [Select_CString(other_family.IsFemale,'tu','toho')] [other_family.Custom2('CZ_InsultNoun_A', ROOT.Char)] nějak umlčet, už jen kvůli své bolavé hlavě."
 ep3_powerful_families.8090.a: "„A co rod [ROOT.Char.GetHouse.GetNameNoTooltip], můj pane?“"
 ep3_powerful_families.8090.a.win: "[liege.GetFirstNameNoTooltip|U] je ohromen"
 ep3_powerful_families.8090.a.lose: "[liege.GetFirstNameNoTooltip|U] se nudí"
 ep3_powerful_families.8090.b: "Večer stejně jednou skončí."
 ep3_powerful_families.8100.t: "Dvorní služby"
 ep3_powerful_families.8100.desc: "Tento večer mám to štěstí, že se ocitnu v rozhovoru s [liege.GetName]. Si [Select_CString(liege.IsFemale,'postěžovala','postěžoval')], že tráví mnoho večerů bez poslechu něžné poezie.\n\n[Select_CString(ROOT.Char.IsFemale,'Vzpomněla','Vzpomněl')] jsem si, že [cp_fam.GetName|U] [Select_CString(cp_fam.IsFemale,'věnovala','věnoval')] mnoho dní procházení zahradami a procvičování v jazyce [cp_fam.GetCulture.GetLanguage.GetNameNoTooltip]. Tento koníček by mohl být využit k rozšíření našeho vlivu na [liege.GetPrimaryTitle.GetAdjective] dvoře..."
 ep3_powerful_families.8100.a: "„[cp_fam.GetFirstNameNoTooltip|U] je skvělý básník, můj pane!“"
 ep3_powerful_families.8100.a.win: "[cp_fam.GetFirstNameNoTooltip|U] je jmenován"
 ep3_powerful_families.8100.a.lose: "[cp_fam.GetFirstNameNoTooltip|U] je odmítnut"
 ep3_powerful_families.8100.b: "„Jsem rád, že i vy oceňujete jemné věci.“"
