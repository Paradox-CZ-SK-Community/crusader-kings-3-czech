 dispute_border_desc_general: "$dispute_border$ je [Concept('hostile_scheme','nepřátelská intrika')|E], jejímž cílem je převést území mezi [Concept('governorships','guvernérstvími')|E]. Je založena na [Concept('diplomacy','diplomacii')|E] a postavení [Concept('house','rodu')|E], a může rekrutovat [Concept('agents','spolčence')|E].\n\nÚspěšný $dispute_border$ způsobí, že sousední [Concept('county','hrabství')|E] bude převedeno od [Concept('scheme_target','cíle intriky')|E]."
