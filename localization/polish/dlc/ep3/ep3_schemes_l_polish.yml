 TARGET_DOMICILE_JAPAN_BARRACKS_DESC: "[target.GetDomicile.GetName] [GetDomicileBuilding('japanese_barracks_01').GetName] Úroveň: $VALUE|+=0$"
 scheme_critical_moments.8066.t: "[scheme.GetNameNoTooltip]: Úspěch"
 scheme_critical_moments.8066.desc: "„S poznatky, které jsi [Select_CString(ROOT.Char.IsFemale,'nasbírala','nasbíral')], jsem [Select_CString(hegemon.IsFemale,'spokojená','spokojený')]. [Select_CString(ROOT.Char.IsFemale,'Odhalila','Odhalil')] jsi kolik? [secrets_found_value]? To není maličkost...“ [hegemon.GetName|U] se na trůnu nakloní dopředu.\n\n„Nic menšího jsem od [Select_CString(ROOT.Char.IsFemale,'své','svého')] [ROOT.Char.Custom('CouncilPosition')|l] [Select_CString(hegemon.IsFemale,'nečekala','nečekal')]. Věřím, že v dobré práci #EMP budeš#! pokračovat!“ Pokyne služebnictvu, které přinese štědrou odměnu."
 scheme_critical_moments.8066.a: "„Jsem tu, abych [Select_CString(ROOT.Char.IsFemale,'sloužila','sloužil')] [hegemon.Custom('CZ_TitleAsNameNoTooltip_D')].“"
 scheme_critical_moments.8066.b: "„Předám vaši laskavost svým zaměstnancům.“"
 scheme_critical_moments.8067.t: "[scheme.GetNameNoTooltip]: Neúspěch"
 scheme_critical_moments.8067.desc: "„[Select_CString(hegemon.IsFemale,'Čekala','Čekal')] jsem na tvé hlášení, ale nic nepřišlo. [Select_CString(hegemon.IsFemale,'Bála','Bál')] jsem se... že jsi snad [Select_CString(ROOT.Char.IsFemale,'zapomněla','zapomněl')] na své povinnosti?“ peskuje mě [hegemon.GetName].\n\n„Mé agenty jsem [Select_CString(ROOT.Char.IsFemale,'měla','měl')] na každém rohu [CZPrepV(target.GetCapitalLocation.GetNameNoTooltip)] [CZProvName(target.GetCapitalLocation,'L')], ale marně,“ vysvětluji. „Buď jsou dvořané [target.Custom('CZ_TitledFirstName_G')] věrní, nebo tam prostě není nic, co by stálo za drby.“\n\n„Ubohá výmluva... [Select_CString(hegemon.IsFemale,'Myslela','Myslel')] jsem, že zvládneš víc. Aspoň nějakou hezčí lež. Když už ti jde o místo!“ Zavrtí hlavou a pokyne mi, abych [Select_CString(ROOT.Char.IsFemale,'odešla','odešel')]."
 scheme_critical_moments.8067.a: "Tentokrát jsem [Select_CString(ROOT.Char.IsFemale,'vyváznula','vyváznul')]."
