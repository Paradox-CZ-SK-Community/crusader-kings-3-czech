 foster_legitimacy_scheme: "Posílit legitimitu"
 foster_legitimacy_scheme_desc: "Pokusím se zvýšit [Concept('legitimacy','legitimitu')|E] svého [Concept('liege','lenního pána')|E] a jeho [Concept('opinion','mínění')|E] o mně"
 foster_legitimacy_scheme_desc_general: "[Concept('scheme','Intrika')|E] $foster_legitimacy_scheme$ je [Concept('personal_scheme','osobní intrika')|E], kterou se snažíš zvýšit [Concept('legitimacy','legitimitu')|E] svého [Concept('liege','lenního pána')|E] a jeho [Concept('opinion','mínění')|E] o tobě; při [Concept('success_chance','šanci na úspěch')|E] nad #high 75%#! můžeš navíc získat [Concept('hook','páku')|E] na něj.\nTato intrika stojí hlavně na tvé [Concept('diplomacy','diplomacii')|E].\n\n[Concept('success_chance','Šanci na úspěch')|E] ovlivňuje mnoho věcí, ale hlavně tvá [Concept('diplomacy_skill','diplomatická dovednost')|E], [Concept('diplomacy_skill','diplomatická dovednost')|E] tvého [Concept('liege','lenního pána')|E] a [Concept('county_opinion','lidové mínění')|E] v [Concept('capital','hlavním sídle')|E] tvého [Concept('liege','lenního pána')|E]."
