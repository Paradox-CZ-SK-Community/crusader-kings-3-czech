 damage_legitimacy_scheme_desc_general: "[Concept('scheme','Intrika')|E] $damage_legitimacy_scheme$ je [Concept('hostile_scheme','nepřátelská intrika')|E], kterou se snažíš snížit [Concept('legitimacy','legitimitu')|E] svého [Concept('liege','lenního pána')|E], čímž zvyšuješ nestabilitu v říši.\nTato intrika stojí hlavně na tvém [Concept('intrigue','pletichářství')|E].\n\n[Concept('success_chance','Šanci na úspěch')|E] ovlivňuje mnoho věcí, ale hlavně tvá [Concept('intrigue_skill','pletichářská dovednost')|E], [Concept('intrigue_skill','pletichářská dovednost')|E] tvého [Concept('liege','lenního pána')|E] a [Concept('county_opinion','lidové mínění')|E] v [Concept('capital','hlavním sídle')|E] tvého [Concept('liege','lenního pána')|E]."
