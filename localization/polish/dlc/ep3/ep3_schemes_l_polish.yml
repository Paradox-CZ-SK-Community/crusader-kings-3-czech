 depose_desc_general: "V intrice Sesazení kuješ spiknutí, jehož cílem je svrhnout císaře a nahradit ho vhodnějším kandidátem: #EMP sebou.#!"
 depose_desc: "Zosnuji řadu tahů, které podkopou autoritu a legitimitu [SCHEME.GetTargetCharacter.Custom('CZ_ShortUIName_G')], abych [Select_CString(SCHEME.GetTargetCharacter.IsFemale,'ji','ho')] [Select_CString(ROOT.Char.IsFemale,'svrhla','svrhl')] z trůnu naší říše."
 DEPOSE_SUCCESS_DESC: "S bezpříkladnou lstivostí jsi [Select_CString(GetPlayer.IsFemale,'svrhla','svrhl')] [SCHEME.GetTargetCharacter.Custom('CZ_ShortUIName_A')] z trůnu a [Select_CString(GetPlayer.IsFemale,'změnila','změnil')] běh dějin. Říše stojí na prahu nového úsvitu a dychtivě čeká na svého dalšího vládce."
