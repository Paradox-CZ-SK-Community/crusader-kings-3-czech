 ingratiate_family_desc: "Ani ten nejsilnější rod nemůže stát osamoceně - rod [SCHEME.GetTargetTitle.GetHolder.GetHouse.GetBaseName] může být užitečným spojencem nebo pěšákem..."
 ingratiate_family_desc_general: "$ingratiate_family$ je [Concept('political_scheme','politická intrika')|E], jejímž cílem je získat přízeň [Concept('house','rodu')|E]. Závisí na [Concept('diplomacy','diplomacii')|E] a postavení [Concept('house','rodu')|E].\n\nÚspěšné $ingratiate_family$ udělí [Concept('opinion','mínění')|E], [Concept('friendship','přátelství')|E] a [Concept('influence','vliv')|E]."
 ingratiate_family_invalidated_title: "@scheme_icon! $ingratiate_family$ Plán končí"
 ingratiate_family_invalidated_dead: "[target.GetShortUIName|U] [Select_CString(target.IsFemale,'zemřela','zemřel')]."
 ingratiate_family_invalidated_war: "Jsi ve válce s [target.Custom('CZ_ShortUIName_I')]"
 scheme_critical_moments.8052.t: "[scheme.GetNameNoTooltip]: Úspěch"
 scheme_critical_moments.8052.desc: "Po týdnech, kdy moji poslové obléhali panství [target.GetHouse.GetBaseName] lichotivými poselstvími vychvalujícími jejich velké ctnosti a původ,\n\ndnes jsem [Select_CString(ROOT.Char.IsFemale,'roztrhla','roztrhl')] dlouho očekávanou odpověď; její přetékající lichotky a úcta potvrzují, že [target.GetTitledFirstName] konečně [Select_CString(target.IsFemale,'pochopila','pochopil')] náznak.\n\n#EMP „Vždy jsem [Select_CString(target.IsFemale,'počítala','počítal')] [owner.GetHouse.GetBaseName] mezi největší rody [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] a jsem hrdý, že vás mohu považovat za přátele.“#!"
 scheme_critical_moments.8052.a: "Přesně tak."
 scheme_critical_moments.8053.t: "[scheme.GetNameNoTooltip]: Selhání"
 scheme_critical_moments.8053.desc: "Mí poslové už týdny poctivě doručují má medová slova do sídla rodu [target.GetHouse.GetBaseName], ale očekávaná odpověď stále nepřichází.\n\nKonečně mi předloží list s pečetí [target.Custom('CZ_TitledFirstName_G')], ovšem bez vstřícných slov, na která jsem [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')].\n\n#EMP „[Select_CString(owner.IsFemale,'Milá','Milý')] [owner.Custom('CZ_FirstNameNoTooltip_V')], nikdo nepopírá moc a slávu rodu [owner.GetHouse.GetBaseName], ale nejsme vaši poslušní psíci.“#!"
 scheme_critical_moments.8053.a: "Odvážná odpověď."
 scheme_critical_moments.8054.t: "Rod získal přízeň"
 scheme_critical_moments.8054.desc: "Po týdnech se na mém stole hromadily dopisy od [owner.Custom('CZ_TitledFirstName_G')], každý lichotící rodu [target.GetHouse.GetBaseName] a nenápadně získávající naše přátelství s [Select_CString(owner.IsFemale,'její','jeho')] rodinou.\n\n"
 scheme_critical_moments.8054.success: "Je zřejmé, že se snaží získat naši podporu, a výhody spojenectví s tak mocným rodem, jako je rod [owner.GetHouse.GetBaseName], se těžko popírají."
 scheme_critical_moments.8054.failure: "Tyto podivné, urážlivé dopisy v nás jen vzbuzují pochybnosti o [Select_CString(owner.IsFemale,'jejích','jeho')] pohnutkách a znovu potvrzují hrdou nezávislost naší rodiny."
 scheme_critical_moments.8054.a.success: "Jsme otevřeni jednání..."
 scheme_critical_moments.8054.a: "Nejsme poslušní psi rodu [owner.GetHouse.GetBaseNameNoTooltip]!"
