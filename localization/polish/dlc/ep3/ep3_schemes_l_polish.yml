 scheme_critical_moments.4011.t: "$damage_legitimacy_scheme$: Úspěch!"
 scheme_critical_moments.4011.desc: "Podívám se na dopis, který právě položil jeden z mých služebníků. Pergamen je bohatý, dokonce provoněný. Dopis z hlavního města, bezpochyby.\n\n„[target.GetTitleAsNameNoTooltip], [Select_CString(ROOT.Char.IsFemale,'vaše paní','váš pán')], prožívá velice nepříjemnou situaci...“\n\nÚsměv mi přejede po tváři. Nemusím číst dál. [Select_CString(target.IsFemale,'Její','Jeho')] legitimita byla poškozena — dokonalá příležitost k útoku."
 scheme_critical_moments.4011.a: "Přineste inkoust."
 scheme_critical_moments.4011.tt: "Legitimita poškozena!"
 damage_legitimacy_scheme_toast_desc: "[Select_CString(owner.IsFemale,'Tvá','Tvůj')] [target.Custom2('RelationToMeShort', SCOPE.sC('owner'))|l] [owner.GetShortUINameNoTooltip] [Select_CString(owner.IsFemale,'poškodila','poškodil')] tvou [Concept('legitimacy','legitimitu')|E]"
 scheme_critical_moments.4012.t: "$damage_legitimacy_scheme$: Neúspěch"
 scheme_critical_moments.4012.desc.intro: "Byly chvíle — ne mnoho — kdy jsem byl rád, že se něco pokazilo. Toto není jedna z nich.\n\n[target.GetTitledFirstName|U] pravděpodobně právě sedí vysoko a pyšně na [Select_CString(target.IsFemale,'jejímu','jeho')] trůnu v této chvíli, "
 scheme_critical_moments.4012.desc.byzantium: "možná požádá nějakou kurtizánu, aby [Select_CString(target.IsFemale,'ji','ho')] pobavila."
 scheme_critical_moments.4012.desc.other: "pravděpodobně žongléři poskakují kolem, možná nějaký zahraniční hudebník přivezený speciálně pro tuto příležitost."
 scheme_critical_moments.4012.desc.outro: "„Ať žije [target.GetTitleAsNameNoTooltip]!“ se nese ulicemi.\n\n„Trpělivost, [ROOT.Char.GetTitleAsNameNoTooltip], trpělivost,“ si říkám.\n\nLov nahrává těm, kdo umějí čekat."
 scheme_critical_moments.4012.a: "Trpělivost."
