 scheme_critical_moments.8022.t: "[scheme.GetNameNoTooltip]: Úspěch"
 scheme_critical_moments.8022.desc: "Debaty [CZPrepV(owner.GetTopLiege.GetCapitalLocation.GetNameNoTooltip)] [CZProvName(owner.GetTopLiege.GetCapitalLocation,'L')] byly dlouhé a únavné, ale byrokrati nevyhnutelně podlehli moudrosti mých návrhů. Území [destroyed_title.Custom('CZ_LandedNameNoTier_G')] nyní patří novému [target_title.GetTierAsNameNoTooltip] [target_title.GetNameNoTier], a #EMP já jsem#! jeho [owner.GetTitleAsNameNoTooltip].\n\nVelká změna je blízko — pro mou administraci; pro [owner.GetTopLiege.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_A')]; pro postavení rodu [owner.GetHouse.GetBaseName]!"
 scheme_critical_moments.8022.a: "[owner.GetTitleAsNameNoTooltip]... to zní dobře."
 scheme_critical_moments.8023.t: "[scheme.GetNameNoTooltip]: Neúspěch"
 scheme_critical_moments.8023.desc: "Moje pečlivě orchestrální představení [CZPrepV(owner.GetTopLiege.GetCapitalLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(owner.GetTopLiege.GetCapitalLocation,'L')] — měsíce pečlivého plánování a jemné diplomacie — vyšly naprázdno.\n\nByrokrati odmítli uznat moudrost mých návrhů. Zjednodušení správy regionu pod širokopůsobícím [target_title.GetAdjective] úřadem bylo odmítnuto jako „nepotřebné“ a „nepraktické“..."
 scheme_critical_moments.8023.a: "Prokletí písaři."
 scheme_critical_moments.8023.tt.failed: "[scheme.GetOwner.GetShortUIName] se [Select_CString(scheme.GetOwner.IsFemale,'pokusila','pokusil')] založit despotát, ale [Select_CString(scheme.GetOwner.IsFemale,'neuspěla','neuspěl')]!"
 scheme_critical_moments.8024.t: "Despotát založen: [target_title.GetNameNoTierNoTooltip]"
 scheme_critical_moments.8024.desc: "Týdny se šuškalo o bouřlivých debatách v zákoutích [owner.GetTopLiege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], a konečně bylo vydáno oznámení: [owner.GetFirstName] má být jmenován [owner.GetTitleAsNameNoTooltip], vládnouc nad rozsáhlým územím [target_title.Custom('CZ_LandedNameNoTier_G')]."
 scheme_critical_moments.8024.liege: "\n\nZda úředníci souhlasili z oprávněných správních důvodů, nebo prostě pod tlakem ustoupili, se nikdy nedozvím – [Select_CString(ROOT.Char.IsFemale,'nemohla','nemohl')] jsem to nijak ovlivnit.\n\nMůžeme jen doufat, že tato změna prospěje celému [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_D')], a ne jen [owner.Custom('CZ_TitledFirstName_D')]..."
 scheme_critical_moments.8024.vassalised: "\n\nAť úředníci souhlasili z oprávněných správních důvodů, nebo prostě pod tlakem ustoupili, jsem teď [Select_CString(owner.IsFemale,'její','jeho')] [Select_CString(ROOT.Char.IsFemale,'podřízenou','podřízeným')]!"
 scheme_critical_moments.8024.other: "\n\nAť už byrokrati souhlasili z legitimních administrativních důvodů, nebo se prostě zalekli pod tlakem, nikdy se to nedozvíme..."
 scheme_critical_moments.8024.fallback: "\n\nTento krok rodu [ROOT.Char.GetHouse.GetBaseName] výrazně posune rovnováhu moci v [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]..."
 scheme_critical_moments.8024.a: "Zajímavé..."
