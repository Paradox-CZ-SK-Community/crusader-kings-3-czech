 scheme_critical_moments.8042.t: "[scheme.GetNameNoTooltip]: Úspěch"
 scheme_critical_moments.8042.desc: "[Select_CString(target.IsFemale,'Má','Můj')] [owner.Custom2('RelationToMeShort', target)], [target.GetTitledFirstName], se zdá, že mé rady týkající se administrativních záležitostí plně [Select_CString(target.IsFemale,'ocenila','ocenil')].\n\nByla to téměř radost trávit hodiny debatami o účtech a drobnostech [target.GetPrimaryTitle.GetAdjective] byrokracie s [Select_CString(target.IsFemale,'ní','ním')].\n\nDovoluji si tvrdit, že jsem se i já během toho něco [Select_CString(ROOT.Char.IsFemale,'přiučila','přiučil')]!"
 scheme_critical_moments.8042.a: "To dopadlo dobře!"
 scheme_critical_moments.8043.t: "[scheme.GetNameNoTooltip]: Selhání"
 scheme_critical_moments.8043.desc: "Přestože [Select_CString(target.IsFemale,'má','můj')] [owner.Custom2('RelationToMeShort', target)|l] [target.GetTitledFirstName] zprvu mou nabídku rad [Select_CString(target.IsFemale,'přijala','přijal')] vstřícně, pochopení [Select_CString(target.IsFemale,'neprojevila','neprojevil')] ani trochu.\n\nTýdny důkladných rozhovorů, studia správních záznamů [target.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] a rozdávání rad na [Select_CString(target.IsFemale,'ni','něj')] téměř nezapůsobily.\n\n[target.GetFirstNameNoTooltip|U] téměř každé zrnko moudrosti, které jsem [Select_CString(target.IsFemale,'jí','mu')] [Select_CString(ROOT.Char.IsFemale,'nabídla','nabídl')], buď [Select_CString(target.IsFemale,'přešla, nepochopila, nebo mu odporovala','přešel, nepochopil, nebo mu odporoval')]..."
 scheme_critical_moments.8043.a: "Jaká ztráta času..."
 scheme_critical_moments.8043.tt.failed: "[scheme.GetOwner.GetShortUIName] se [Select_CString(scheme.GetOwner.IsFemale,'pokusila','pokusil')] zpochybnit tvé hranice, ale [Select_CString(scheme.GetOwner.IsFemale,'neuspěla','neuspěl')]!"
 scheme_critical_moments.8044.t: "Mentorství v řízení"
 scheme_critical_moments.8044.desc: "Už týdny mě [Select_CString(owner.IsFemale,'má','můj')] [target.Custom2('RelationToMeShort', owner)|l] [owner.GetTitledFirstName] nečekaně navštěvuje a zasypává dopisy. Chrlí proud nevyžádaných rad, které se všechny týkají správného vedení [target.GetPrimaryTitle.GetTierAsNameNoTooltip|l]...\n\n"
 scheme_critical_moments.8044.success: "Má počáteční skepsi brzy vystřídalo překvapení a respekt. [Select_CString(owner.IsFemale,'Její','Jeho')] slova byla pramenem moudrosti, o které jsem nikdy [Select_CString(ROOT.Char.IsFemale,'neuvažovala','neuvažoval')], a mnoho z toho se nyní ukázalo při mém vedení [target.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')]!"
 scheme_critical_moments.8044.failure: "Má skepsi se brzy potvrdila, neboť mezi [Select_CString(owner.IsFemale,'jejími','jeho')] toulavými anekdotami a zmatenými mantrami bylo bohužel jen málo moudrosti — byť se mohly zdát výstižné..."
 scheme_critical_moments.8044.a.success: "Dobrá rada je vítanou vzácností!"
 scheme_critical_moments.8044.a: "Taktní – a definitivní – poděkování by [Select_CString(owner.IsFemale,'ji','ho')] mělo umlčet."
 scheme_critical_moments.8045.opening: "[recipient.Custom2('AppropriateGreetingPositive', actor)]"
 scheme_critical_moments.8045.desc: "Jsem vám nesmírně [Select_CString(ROOT.Char.IsFemale,'vděčná','vděčný')] za nabídku radit mi se správou [recipient.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')]!"
 scheme_critical_moments.8045.fallback: "Jsem vám nesmírně [Select_CString(ROOT.Char.IsFemale,'vděčná','vděčný')] za nabídku radit mi se záludnostmi správy!"
 scheme_critical_moments.8045.rump: "\n\nVelmi se těším, až uslyším vaše názory."
 scheme_critical_moments.8045.a: "Bude mi potěšením."
 scheme_critical_moments.8046.opening: "[recipient.Custom2('AppropriateGreeting', actor)]"
 scheme_critical_moments.8046.desc: "Vaše nabídka radit mi se správou [recipient.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] mi sice lichotila,"
 scheme_critical_moments.8046.fallback: "Vaše nabídka radit mi se záludnostmi správy mi sice lichotila,"
 scheme_critical_moments.8046.rump: "Myslím, že tomu sám dost rozumím."
 scheme_critical_moments.8046.a: "Hm."
