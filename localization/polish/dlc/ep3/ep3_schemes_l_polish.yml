 damage_legitimacy_scheme_desc_general: "$damage_legitimacy_scheme$ [Concept('scheme','Intrika')|E] je [Concept('hostile_scheme','nepřátelská intrika')|E], kde se snažíte snížit [Concept('legitimacy','legitimita')|E] vašeho [Concept('liege','lenního pána')|E], což zvyšuje nestabilitu v říši.\nTento plán se primárně spoléhá na vaše [Concept('intrigue','pletichářství')|E].\n\n[Concept('success_chance','Šance na úspěch')|E] ovlivňuje mnoho faktorů, ale hlavně vaše [Concept('intrigue_skill','pletichářská dovednost')|E], [Concept('liege','lenní pán')|E] vlastní [Concept('intrigue_skill','pletichářskou dovednost')|E] a [Concept('county_opinion','lidové mínění')|E] [Concept('capital','hlavní sídlo')|E] vašeho [Concept('liege','lenního pána')|E]." # todo: CONCEPT CASE
