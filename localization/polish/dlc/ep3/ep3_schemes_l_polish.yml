 scheme_critical_moments.8012.t: "[scheme.GetNameNoTooltip]: Úspěch"
 scheme_critical_moments.8012.desc: "Bylo to náročné, ale můj vliv na dvoře byl úměrný úkolu.\n\nMoje argumenty, a úplatky a nevyřčené přízně, byly pro úředníky a [owner.GetTopLiege.GetTitleAsNameNoTooltip] příliš. [target.GetTitledFirstName|U] nebude potěšen, ale co na tom teď záleží?\n\nJe hotovo; mám spravovat [target_title.Custom('CZ_LandedNameNoTier_A')] vedle [ROOT.Char.GetPrimaryTitle.GetAdjective] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], a jeho území mají být okamžitě podřízena mé autoritě."
 scheme_critical_moments.8012.a: "[target_title.GetNameNoTierNoTooltip] je #EMP moje#!."
 scheme_critical_moments.8013.t: "[scheme.GetNameNoTooltip]: Neúspěch"
 scheme_critical_moments.8013.desc: "Přes všechny mé pečlivě rozmístěné prosby, laskavosti a lichocení, moje protesty nakonec narazily na hluché uši...\n\n[owner.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip|U] byrokrati a rozmarný [owner.GetTopLiege.GetTitleAsNameNoTooltip] pouze potvrdili oddělení území [owner.GetPrimaryTitle.GetAdjective] a [target.GetPrimaryTitle.GetAdjective]..."
 scheme_critical_moments.8013.a: "Zatracení eunuchové."
 scheme_critical_moments.8013.tt.failed: "[scheme.GetOwner.GetShortUIName] se [Select_CString(scheme.GetOwner.IsFemale,'pokusila','pokusil')] pohltit tvé guvernérství, ale [Select_CString(scheme.GetOwner.IsFemale,'neuspěla','neuspěl')]!"
 scheme_critical_moments.8014.t: "Guvernorát podřízen: [target_title.GetNameNoTierNoTooltip]"
 scheme_critical_moments.8014.desc: "Za vznešenými dveřmi císařských paláců dál spřádá své sítě [owner.GetTitledFirstName]. Dnes potvrdil to nejhorší strohý list se šarlatovou pečetí [owner.GetTopLiege.Custom('CZ_TitleAsName_G')].\n\nÚzemí [target_title.Custom('CZ_LandedNameNoTier_G')] mají být okamžitě podřízena [owner.Custom('CZ_TitledFirstName_D')] – fakticky se stávají rozšířením [owner.GetPrimaryTitle.GetTierAsNameNoTooltip|l] [owner.GetPrimaryTitle.GetName] – ..."
 scheme_critical_moments.8014.a: "Tato rána se brzy nezahojí."
 scheme_critical_moments.8015.t: "Guvernorát podřízen: [target_title.GetNameNoTierNoTooltip]"
 scheme_critical_moments.8015.desc: "Po týdnech politického nátlaku a manévrování u dvora se [owner.Custom('CZ_TitledFirstName_D')] podařilo získat správu nad územími [target_title.Custom('CZ_LandedNameNoTier_G')], která se tak fakticky stávají rozšířením [Select_CString(owner.IsFemale,'jejího','jeho')] [owner.GetPrimaryTitle.GetTierAsNameNoTooltip|l] [owner.GetPrimaryTitle.GetName]."
 scheme_critical_moments.8015.liege: "\n\nKola byrokracie [owner.GetTopLiege.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] se točí bez ustání a jejich setrvačnost je téměř nezastavitelná – dokonce i pro [owner.GetTopLiege.Custom('CZ_TitleAsNameNoTooltip_A')].\n\nJen doufám, že [owner.GetTitledFirstName] bude své síly věnovat službě [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l], a ne sobě..."
 scheme_critical_moments.8015.vassal: "\n\nKola [owner.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] byrokracie se točí neustále a jejich hybnost je téměř neporazitelná — dokonce i pro [owner.GetTopLiege.Custom('CZ_TitleAsNameNoTooltip_A')]."
 scheme_critical_moments.8015.same_house: "\n\nMůžeme jen doufat, že tento krok nakonec prospěje celému rodu [ROOT.Char.GetHouse.GetName]..."
 scheme_critical_moments.8015.target_house: "\n\nTento skandál je těžkým úderem pro postavení rodu [ROOT.Char.GetHouse.GetBaseName]..."
 scheme_critical_moments.8015.fallback: "\n\nTento #EMP puč#! jistě povede rod [ROOT.Char.GetHouse.GetBaseName] na nové výšiny..."
 scheme_critical_moments.8015.a: "Zajímavé."
