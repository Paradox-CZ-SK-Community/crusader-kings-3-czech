 scheme_critical_moments.8002.t: "[scheme.GetNameNoTooltip]: Úspěch"
 scheme_critical_moments.8002.desc: "Po mnoha tahanicích, debatách a nátlaku konečně přinesla má pečlivě zasetá semínka ovoce. Zdlouhavý tanec mezi úředníky [owner.GetTopLiege.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')], vrtkavým [owner.GetTopLiege.Custom('CZ_TitleAsNameNoTooltip_I')] a zástupci [target_title.Custom('CZ_LandedNameNoTier_G')] nakonec rozhodl, že [target_title.GetTierAsNameNoTooltip|l] bude od nynějška podléhat správě [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')].\n\nUbohé pokusy [target.Custom('CZ_TitledFirstName_G')] udržet se v mých zemích a vzdorovat mému širokému vlivu u dvora byly naprosto marné."
 scheme_critical_moments.8002.a: "[target_title.GetNameNoTierNoTooltip] je #EMP moje#!."
 scheme_critical_moments.8003.t: "[scheme.GetNameNoTooltip]: Neúspěch"
 scheme_critical_moments.8003.desc: "Přes všechny mé pečlivě rozmístěné prosby, laskavosti a lichocení, moje protesty nakonec narazily na hluché uši...\n\n[owner.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip|U] byrokrati a rozmarný [owner.GetTopLiege.GetTitleAsNameNoTooltip] pouze potvrdili stávající hranice [owner.GetPrimaryTitle.GetAdjective] a [target.GetPrimaryTitle.GetAdjective] [target.GetPrimaryTitle.GetTierAsNameNoTooltip]..."
 scheme_critical_moments.8003.a: "Pah, na tom nesejde."
