 ingratiate_family: "Získat přízeň rodu"
 ingratiate_family_action: "Získat přízeň"
 ingratiate_family_desc: "Ani ten nejsilnější rod nemůže stát osamoceně - rod [SCHEME.GetTargetTitle.GetHolder.GetHouse.GetBaseName] může být užitečným spojencem nebo pěšákem..."
 ingratiate_family_desc_general: "$ingratiate_family$ je [Concept('personal_scheme','osobní intrika')|E], jehož cílem je získat přízeň [Concept('house','rod')|E]. Závisí na [Concept('diplomacy','diplomacii')|E] a postavení [Concept('house','rod')|E].\n\nÚspěšné $ingratiate_family$ udělí [Concept('opinion','mínění')|E], [Concept('friendship','přátelství')|E] a [Concept('influence','vliv')|E]." # todo: CONCEPT CASE
