 raid_estate_desc_general: "$raid_estate$ je [Concept('hostile_scheme','nepřátelská intrika')|E], jehož cílem je přepadnout [Concept('estate','statek')|E] jiného [Concept('house','rodu')|E]. Je založen na [Concept('intrigue','pletichářství')|E], [Concept('domicile','domicil')|E] a postavení [Concept('house','rod')|E], a může rekrutovat [Concept('agents','spolčenci')|E].\n\nÚspěšný $raid_estate$ může vést ke krádeži cílového [Concept('gold','zlata')|E], poškození jejich [Concept('estate','statek')|E] a dokonce k smrti členů jejich [Concept('house','rod')|E]." # todo: CONCEPT CASE
