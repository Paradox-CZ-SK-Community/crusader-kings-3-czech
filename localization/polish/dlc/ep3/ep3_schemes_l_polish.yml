 teach_governor_action: "Učit"
 teach_governor_desc: "Pokus zlepšit dovednosti jiné postavy jako [Concept('governor','guvernér')|E]"
 teach_governor_desc_general: "$teach_governor$ je [Concept('political_scheme','politická intrika')|E] zaměřená na zlepšení [Concept('governor_efficiency','efektivity guvernéra')|E] jiného [Concept('governor','guvernéra')|E]. Závisí na [Concept('stewardship','správcovství')|E] a může získat [Concept('agents','spolčence')|E].\n\nÚspěšný $teach_governor$ způsobí, že [Concept('scheme_target','cíl intriky')|E] získá [GetTrait('governor').GetName( GetNullCharacter )] [Concept('trait_level_track_xp','zkušenosti rysu')|E] a [Concept('opinion','mínění')|E]."
 TEACH_GOVERNOR_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U] získá [Concept('trait_level_track_xp','zkušenosti rysu')|E] [GetTrait('governor').GetName( GetNullCharacter )] a lepší [Concept('opinion','mínění')|E] a ty získáš [Concept('hook','páku')|E], pokud nepatří k tvému [Concept('house','rodu')|E]"
