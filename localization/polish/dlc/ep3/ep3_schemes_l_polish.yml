 scheme_critical_moments.4011.t: "$damage_legitimacy_scheme$: Úspěch!"
 scheme_critical_moments.4011.desc: "Podívám se na dopis, který právě položil jeden z mých služebníků. Pergamen je bohatý, dokonce provoněný. Dopis z hlavního města, bezpochyby.\n\n„[target.GetTitleAsNameNoTooltip], [Select_CString(ROOT.Char.IsFemale,'její','jeho')] pán, prožívá velice nepříjemnou situaci...“\n\nÚsměv mi přejede po tváři. Nemusím číst dál. [Select_CString(target.IsFemale,'její','jeho')] legitimita byla poškozena — dokonalá příležitost k útoku."
 scheme_critical_moments.4011.a: "Přineste inkoust."
 scheme_critical_moments.4011.tt: "Legitimita poškozena!"
 damage_legitimacy_scheme_toast_desc: "Váš [target.Custom2('RelationToMeShort', SCOPE.sC('owner'))], [owner.GetShortUINameNoTooltip|U], poškodil vaši [Concept('legitimacy','legitimitu')|E]" # todo: CONCEPT CASE
 scheme_critical_moments.4012.t: "$damage_legitimacy_scheme$: Neúspěch"
 scheme_critical_moments.4012.desc.intro: "Byly chvíle — ne mnoho — kdy jsem byl rád, že se něco pokazilo. Toto není jedna z nich.\n\n[target.GetTitledFirstName] pravděpodobně právě sedí vysoko a pysně na [Select_CString(target.IsFemale,'jejímu','jeho')] trůnu v této chvíli, "
 scheme_critical_moments.4012.desc.byzantium: "možná žádá nějakou kurtizánu, aby [target.GetHerHim] pobavila."
 scheme_critical_moments.4012.desc.other: "pravděpodobně žongléři poskakují kolem, možná nějaký zahraniční hudebník přivezený speciálně pro tuto příležitost."
 scheme_critical_moments.4012.desc.outro: "„Ať žije [target.GetTitleAsNameNoTooltip]!“ se nese ulicemi.\n\n„Trpělivost, [ROOT.Char.GetTitleAsNameNoTooltip], trpělivost,“ si říkám.\n\nLov nahrává těm, kdo umějí čekat."
 scheme_critical_moments.4012.a: "Trpělivost."
