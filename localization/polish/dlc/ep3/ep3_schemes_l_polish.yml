 scheme_critical_moments.1172.t: "$scheme_critical_moments.1132.t$"
 scheme_critical_moments.1172.desc: "V uplynulých měsících jsem [Select_CString(ROOT.Char.IsFemale,'nepromarnila','nepromarnil')] jedinou příležitost, abych [target.Custom('CZ_TitledFirstName_A')] na veřejnosti [Select_CString(ROOT.Char.IsFemale,'zesměšnila','zesměšnil')]. Lstí jsem [Select_CString(target.IsFemale,'ji','ho')] [Select_CString(ROOT.Char.IsFemale,'přiměla','přiměl')] k přehmatům u dvora, [Select_CString(ROOT.Char.IsFemale,'předčila','předčil')] jsem [Select_CString(target.IsFemale,'ji','ho')] ve znalosti klasiků a [Select_CString(ROOT.Char.IsFemale,'svedla','svedl')] [Select_CString(target.IsFemale,'ji','ho')] k podpoře neudržitelných finančních opatření, jen abych pak [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] přispěchat a [Select_CString(target.IsFemale,'ji','ho')] opravit.\n\nPo velmi úspěšné náboženské debatě, ve které jsem obratně [Select_CString(ROOT.Char.IsFemale,'vzbudila','vzbudil')] dojem, že [target.GetFirstNameNoTooltip] šíří kacířské názory, mohu být s výsledky [Select_CString(ROOT.Char.IsFemale,'spokojená','spokojený')]."
 scheme_critical_moments.1172.a: "[target.GetFirstNameNoTooltip] [Select_CString(target.IsFemale,'poznala','poznal')] své místo."
 scheme_critical_moments.1173.t: "$scheme_critical_moments.1133.t$"
 scheme_critical_moments.1173.desc: "Neúspěch. Ať už kolikrát jsem [Select_CString(ROOT.Char.IsFemale,'zkoušela','zkoušel')], [target.GetTitledFirstName] je mi stále krok předem.\n\n[Select_CString(target.IsFemale,'Její','Jeho')] znalost literatury je vynikající, [Select_CString(target.IsFemale,'její','jeho')] chápání politických otázek hluboké, [Select_CString(target.IsFemale,'její','jeho')] zvládnutí nejobtížnějších aspektů naší víry neochvějné. Nebo alespoň jsou mnohem pevnější než to moje."
 scheme_critical_moments.1173.a: "[target.GetFirstNameNoTooltip] je tvrdý oříšek."
 challenge_status_invalidated_title: "@scheme_icon! Zpochybnění postavení končí"
 scheme_critical_moments.1174.t: "Postavení zpochybněno"
 scheme_critical_moments.1174.desc: "Stydím se přiznat, že při mých posledních veřejných vystoupeních mě [owner.GetTitledFirstName] při každém střetu [Select_CString(owner.IsFemale,'napálila','napálil')] a [Select_CString(owner.IsFemale,'ponížila','ponížil')].\n\nNevím, jak se to pořád děje, ale kdykoli se s [Select_CString(owner.IsFemale,'ní','ním')] pustím do debaty, jako bych [Select_CString(ROOT.Char.IsFemale,'zapomněla','zapomněl')] veškerou dvorskou etiketu, citáty se mi pletou a [Select_CString(owner.IsFemale,'ona','on')] ze mě v lepším případě udělá hlupáka a v horším pošetilého sympatizanta kacířů.\n\nMusím na chvíli ustoupit a důkladně zvažovat každé své slovo."
 scheme_critical_moments.1174.a: "Nemohu tomu uvěřit..."
