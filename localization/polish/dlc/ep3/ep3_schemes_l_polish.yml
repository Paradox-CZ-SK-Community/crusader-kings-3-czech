 scheme_critical_moments.8061.t: "[scheme.GetNameNoTooltip]: Úspěch"
 scheme_critical_moments.8061.desc: "Hluboko v zaprášených skladech moji inženýři uskladňují úplně poslední sudy tekutého ohně. Mezitím [Glossary( 'Boukoleon Palace', 'BOUKOLEON_PALACE_GLOSS')] hostí děsivé cvičení: pod kolosální sochou lva a vola vedoucích válku hrdá válečná loď vyvrhuje proudy tekutého ohně.\n\nA jak dlouho tančí ty vražedné plameny! Moji nepřátelé by byli moudří, kdyby se vyhnuli klidným vodám mezi Evropou a Anatólií..."
 scheme_critical_moments.8061.a: "Draci hlídají Marmaru."
 BOUKOLEON_PALACE_GLOSS: "Na březích #EMP Propontis#! (Marmarské moře) je toto konstantinopolské sídlo z 5. století známé svým soukromým přístavem a ponurými žaláři."
 scheme_critical_moments.8062.t: "[scheme.GetNameNoTooltip]: Neúspěch"
 scheme_critical_moments.8062.desc: "Pekelný oheň! Pekelný oheň!\n\nNekontrolovatelný žár pohltil další loď vybavenou sifony. Když se její křičící posádka opéká zaživa, nutí mě to myslet na všechny ty chaotické směsi, netěsné sifony a mrtvé námořníky zapletené do tohoto podniku...\n\nJak byla taková zlá látka #EMP vůbec#! kdy ovládána? Jak?!?!"
 scheme_critical_moments.8062.a: "Asi se to nikdy nedozvím..."
 TARGET_DOMICILE_MAIN_JAPAN_DESC: "[target.GetDomicile.GetName] [GetDomicileBuilding('japanese_manor_main_01').GetName] Úroveň: $VALUE|+=0$" # todo: NEW TRANSLATION
 TARGET_DOMICILE_JAPANESE_WATCH_HOUSE_DESC: "[target.GetDomicile.GetName] [GetDomicileBuilding('japanese_watch_house_01').GetName] Úroveň: $VALUE|+=0$" # todo: NEW TRANSLATION
 TARGET_DOMICILE_JAPAN_BARRACKS_DESC: "[target.GetDomicile.GetName] [GetDomicileBuilding('japanese_barracks_01').GetName] Úroveň: $VALUE|+=0$" # todo: NEW TRANSLATION
 scheme_critical_moments.8066.t: "Cenzor — Najít tajemství: Úspěch" # todo: NEW TRANSLATION
 scheme_critical_moments.8066.desc: "„Jsem spokojen s poznatky, které jsi získal. Našel jsi, co? [secrets_found_value]? To není malý výkon...“ [hegemon.GetName] se nakloní dopředu na [Select_CString(hegemon.IsFemale,'jejímu','jeho')] trůnu.\n\n„Nečekal jsem nic menšího od mého cenzora. Věřím, že #EMP will#! budeš pokračovat v dobré práci!“ [hegemon.GetSheHe|U] přikývne směrem ke služebnictvu, které vytáhne štědrý dar." # todo: NEW TRANSLATION
 scheme_critical_moments.8066.a: "„Jsem tu, abych sloužil [hegemon.GetTitleAsNameNoTooltip].“" # todo: NEW TRANSLATION
 scheme_critical_moments.8066.b: "„Předám vaši laskavost svým zaměstnancům.“" # todo: NEW TRANSLATION
 scheme_critical_moments.8067.t: "Cenzor — Najít tajemství: Neúspěch" # todo: NEW TRANSLATION
 scheme_critical_moments.8067.desc: "„Čekal jsem na tvou zprávu, ale nic nepřišlo. Měl jsem obavy... snad jsi zapomněl na svou povinnost?“ [hegemon.GetName] mě pohrdá.\n\n„Poslal jsem své agenty na každý roh v [target.GetCapitalLocation.GetName], bez úspěchu,“ vysvětluji. „Buď jsou [target.GetTitledFirstNamePossessive] dvořané věrní, nebo tu prostě není nic hodného drbů.“\n\n„Triviální výmluva... Myslel jsem, že zvládneš víc. Aspoň nějakou lepší lež. Vzhledem k tomu, že tvá pozice visí na vlásku!“ [hegemon.GetSheHe|U] zavrtí [Select_CString(hegemon.IsFemale,'její','jeho')] hlavou a dává mi pokyn, abych byl propuštěn." # todo: NEW TRANSLATION
 scheme_critical_moments.8067.a: "Tentokrát jsem vyváznul." # todo: NEW TRANSLATION
