 foster_legitimacy_scheme_desc_general: "$foster_legitimacy_scheme$ [Concept('scheme','Intrika')|E] je [Concept('personal_scheme','osobní intrika')|E], kde se snažíte zvýšit [Concept('legitimacy','legitimita')|E] vašeho [Concept('liege','lenního pána')|E] a jeho [Concept('opinion','mínění')|E] o vás, s možností získat [Concept('hook','páka')|E] na něj, pokud bude [Concept('success_chance','šance na úspěch')|E] nad #high 75%#.\nTento plán primárně spoléhá na vaši [Concept('diplomacy','diplomacii')|E].\n\n[Concept('success_chance','Šance na úspěch')|E] ovlivňuje mnoho faktorů, ale hlavně vaše [Concept('diplomacy_skill','diplomatická dovednost')|E], [Concept('liege','lenní pán')|E] vlastní [Concept('diplomacy_skill','diplomatickou dovednost')|E] a [Concept('county_opinion','lidové mínění')|E] [Concept('capital','hlavní sídlo')|E] vašeho [Concept('liege','lenního pána')|E]." # todo: CONCEPT CASE
