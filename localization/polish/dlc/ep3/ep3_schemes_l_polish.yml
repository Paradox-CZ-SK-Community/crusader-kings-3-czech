 subsume_province_desc_general: "$subsume_province$ je [Concept('political_scheme','politická intrika')|E], jejímž cílem je začlenit jedno [Concept('governorship','guvernérství')|E] do druhého. Je založena na [Concept('diplomacy','diplomacii')|E] a postavení [Concept('house','rodu')|E], a může rekrutovat [Concept('agents','spolčence')|E].\n\nÚspěšný $subsume_province$ povede k převedení všech sousedních [Concept('counties','hrabství')|E] [Concept('de_jure','de iure')|E] [Concept('governorship','guvernérství')|E] od [Concept('scheme_target','cíle intriky')|E]."
