 scheme_critical_moments.1182.t: "$scheme_critical_moments.1132.t$"
 scheme_critical_moments.1182.desc: "Úspěch! Jméno rodu [ROOT.Char.GetHouse.GetName] nyní nese větší váhu [CZPrepV(ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTooltip)] [ROOT.Char.GetTopLiege.GetPrimaryTitle.Custom('CZ_LandedName_L')] — alespoň pro mě.\n\nÚplatky, laskavosti, dary, umisťování správných lidí na správná místa: žádný nástroj nezůstal nevyužit. Moje zásoby vlivu se prohlubují spolu s mými politickými schopnostmi."
 scheme_critical_moments.1182.a: "To je teprve začátek."
 scheme_critical_moments.1183.t: "$scheme_critical_moments.1133.t$"
 scheme_critical_moments.1183.desc: "Lidé mě prostě neocení.\n\nÚplatky, laskavosti, dary, zastrašování — #EMP nic#! nezabralo na zvýšení mého vlivu!\n\nAsi budu muset obrátit pozornost jinam..."
 scheme_critical_moments.1183.a: "Jedny dveře se zavřely..."
