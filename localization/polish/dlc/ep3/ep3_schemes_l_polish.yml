 dispute_border_desc_general: "$dispute_border$ je [Concept('hostile_scheme','nepřátelská intrika')|E], jehož cílem je převést území mezi [Concept('governorships','guvernérstvím')|E]. Je založen na [Concept('diplomacy','diplomacii')|E] a postavení [Concept('house','rod')|E], a může rekrutovat [Concept('agents','spolčenci')|E].\n\nÚspěšný $dispute_border$ způsobí, že sousední [Concept('county','hrabství')|E] bude převeden od [Concept('scheme_target','cíle intriky')|E]." # todo: CONCEPT CASE
