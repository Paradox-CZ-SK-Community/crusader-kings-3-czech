 raid_estate_desc_general: "$raid_estate$ je [Concept('political_scheme','politická intrika')|E], jejímž cílem je přepadnout [Concept('estate','statek')|E] jiného [Concept('house','rodu')|E]. Je založena na [Concept('intrigue','pletichářství')|E], [Concept('domicile','domicil')|E] a postavení [Concept('house','rodu')|E], a může rekrutovat [Concept('agents','spolčence')|E].\n\nÚspěšný $raid_estate$ může vést ke krádeži cílového [Concept('gold','zlata')|E], poškození jejich [Concept('estate','statku')|E] a dokonce k smrti členů jejich [Concept('house','rodu')|E]."
