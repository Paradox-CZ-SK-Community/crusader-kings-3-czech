 scheme_critical_moments.1142.t: "$scheme_critical_moments.1132.t$"
 scheme_critical_moments.1142.desc_self: "Veškeré úsilí vložené do mé kampaně sebeprezentace se vyplatilo.\n\nMé postavení mezi vrstevníky se zlepšilo, noví stoupenci se hrnou ke mým kandidaturám a můj cíl je blíž než kdy dříve!"
 scheme_critical_moments.1142.desc_other: "Tolik času a prostředků vložených do podpory kandidatur [target.Custom('CZ_TitledFirstName_G')] přineslo jisté ovoce.\n\n[Select_CString(target.IsFemale,'Její','Jeho')] postavení mezi rovnými se zlepšilo, noví příznivci jsou teď přesvědčeni o [Select_CString(target.IsFemale,'jejích','jeho')] kvalitách a [Select_CString(target.IsFemale,'její','jeho')] jmenování je o krok blíž!"
 scheme_critical_moments.1142.a: "Vynikající výsledky."
 scheme_critical_moments.1142.tt: "Kandidatura podpořena!"
 promote_toast_scheme_desc: "[Select_CString(owner.IsFemale,'Tvá','Tvůj')] [target.Custom2('RelationToMeShort', SCOPE.sC('owner'))|l] [owner.GetShortUINameNoTooltip] [Select_CString(owner.IsFemale,'podpořila','podpořil')] tvou kandidaturu"
 scheme_critical_moments.1143.t: "$scheme_critical_moments.1133.t$"
 scheme_critical_moments.1143.desc_self: "Veškeré síly a zdroje vložené do mé kampaně sebeprezentace prostě nestačily. Nikdo nebyl přesvědčen o mé hodnotě ani nenalákaný mými sliby — ani úplatky — takže mé postavení zůstává nezměněno.\n\nBudu muset vymyslet něco jiného, jak prosadit svou kandidaturu."
 scheme_critical_moments.1143.desc_other: "Navzdory mému nejlepšímu úsilí nebylo možné učinit z [target.Custom('CZ_TitledFirstName_G')] přijatelnějšího kandidáta...\n\nAsi budu muset vymyslet něco jiného, abych [Select_CString(ROOT.Char.IsFemale,'zajistila','zajistil')] [Select_CString(target.IsFemale,'jí','mu')] dobré místo."
 scheme_critical_moments.1143.a: "Promarněná příležitost."
