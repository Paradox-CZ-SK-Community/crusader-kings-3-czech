 scheme_critical_moments.8032.t: "[scheme.GetNameNoTooltip]: Úspěch"
 scheme_critical_moments.8032.desc: "Úsvit konečně přináší zprávy ze sídla rodu [target.GetHouse.GetBaseName] ([target_domicile.GetLocation.GetBaronyNameExplicitlyNoTooltip]) a potvrzení našeho úspěchu!\n\nTi [target.Custom2('InsultNounPlural', ROOT.Char)] byli zaskočeni úplně nepřipravení"
 scheme_critical_moments.8032.kill: "a [Select_CString(flavor_victim.IsFemale,'mrtvá','mrtvý')] [target.Custom2('RelationToMeShort', flavor_victim)|l] [target.Custom('CZ_FirstNameNoTooltip_G')], [flavor_victim.GetTitledFirstName], tam teď leží – přeživší budou s tímto selháním muset žít..."
 scheme_critical_moments.8032.maim: "a [target.Custom2('RelationToMeShort', flavor_victim)|l] [target.Custom('CZ_FirstNameNoTooltip_G')], [flavor_victim.GetTitledFirstName], si jizvy po tomto selhání ponese po zbytek svých dnů..."
 scheme_critical_moments.8032.imprison: "a nepochybně teď hledají [Select_CString(flavor_victim.IsFemale,'svou','svého')] [target.Custom2('CZ_RelationToMeShort_A', flavor_victim)|l] [flavor_victim.Custom('CZ_TitledFirstName_A')], [Select_CString(flavor_victim.IsFemale,'která','který')] teď strádá v okovech!"
 scheme_critical_moments.8032.fallback: "a byli sraženi k zemi, na očích všech [owner.GetTopLiege.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_G')]!"
 scheme_critical_moments.8032.permission: "\n\nMáme podporu [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip], a ti hlupáci nemají kam se obrátit..."
 scheme_critical_moments.8032.emperor: "\n\nJsem [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip], a nemohou mi nic udělat..."
 scheme_critical_moments.8032.crime: "\n\nBohužel je zřejmé, že naše účast v této záležitosti nezůstala bez povšimnutí, a [target.GetTitledFirstName] zajistí, že všichni [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] uslyší o této „[owner.GetHouse.GetBaseName] zradě.“"
 scheme_critical_moments.8032.secret: "\n\nA navíc se zdá, že netuší, kdo za útokem stojí. Bohužel tak zatím nemůžeme vítězství rodu [owner.GetHouse.GetBaseName] veřejně otřít [target.Custom('CZ_TitledFirstName_D')] o nos."
 scheme_critical_moments.8032.a: "Pche, ať si kňučí."
 scheme_critical_moments.8032.a.secret: "Je na místě oslava!"
 scheme_critical_moments.8033.t: "[scheme.GetNameNoTooltip]: Selhání"
 scheme_critical_moments.8033.desc: "Úsvit konečně přináší zprávy ze sídla rodu [target.GetHouse.GetBaseName] ([target_domicile.GetLocation.GetBaronyNameExplicitlyNoTooltip]), i když ne takové, jaké bychom si přáli...\n\nTi [target.Custom2('InsultNounPlural', ROOT.Char)] byli na útok nějak připraveni a naše vetřelce zastavili dřív, než stačili napáchat jakoukoli škodu."
 scheme_critical_moments.8033.captured: "\n\nZdá se, že [Select_CString(SCOPE.sC('captured').IsFemale,'má','můj')] [owner.Custom2('RelationToMeShort', SCOPE.sC('captured'))], [captured.GetTitledFirstName], byl zajat při útěku, a jakákoli naděje na skrytí zapojení [owner.GetHouse.GetBaseName] byla zmařena..."
 scheme_critical_moments.8033.discovered: "\n\nZdá se však, že nějak pochopili, že za útokem stojí [owner.GetHouse.GetBaseName], a budou volat po nápravě..."
 scheme_critical_moments.8033.fallback: "\n\nAspoň můžeme spát klidně, neboť se zdá, že o našem zapojení do tohoto plánu nevědí..."
 scheme_critical_moments.8033.secret: "\n\nNavzdory tomuto nezdaru se zdá, že můžeme klidně spát s vědomím, že dosud nepodezřívají rod [owner.GetHouse.GetBaseName]."
 scheme_critical_moments.8033.a: "Všechny ty přípravy... a to na #EMP nic#!!"
 scheme_critical_moments.8034.t.known: "Panství vyloupeno: Útok rodu [owner.GetHouse.GetBaseNameNoTooltip]"
 scheme_critical_moments.8034.t: "Panství vyloupeno: Neznámí útočníci"
 scheme_critical_moments.8034.desc: "Ráno ke mně dorazily panické zvěsti o nájezdu na rodové panství v [target_domicile.GetLocation.GetBaronyNameExplicitlyNoTooltip],"
 scheme_critical_moments.8034.success: "a srdce mi ztuhne, když se hrnou zprávy o zkáze a nehoráznostech."
 scheme_critical_moments.8034.failure: "a uleví se mi, když je potvrzeno, že útok byl zmařen."
 scheme_critical_moments.8034.kill: "\n\nŘíkají mi, že [Select_CString(SCOPE.sC('flavor_victim').IsFemale,'má','můj')] [target.Custom2('RelationToMeShort', SCOPE.sC('flavor_victim'))], [flavor_victim.GetTitledFirstName], leží mrtvý, povražděný jako zvíře nějakou bestií..."
 scheme_critical_moments.8034.maim: "\n\nŘíkají mi, že [Select_CString(flavor_victim.IsFemale,'moje','můj')] [target.Custom2('RelationToMeShort', SCOPE.sC('flavor_victim'))], [flavor_victim.GetTitledFirstName], byl strašně [Select_CString(flavor_victim.IsFemale,'zmrzačena','zmrzačen')] a sotva [Select_CString(flavor_victim.IsFemale,'přežila','přežil')] to utrpení..."
 scheme_critical_moments.8034.imprison: "Říkají mi, že [Select_CString(flavor_victim.IsFemale,'moje','můj')] [target.Custom2('RelationToMeShort', SCOPE.sC('flavor_victim'))], [flavor_victim.GetTitledFirstName], [Select_CString(flavor_victim.IsFemale,'byla uvězněna, připoutaná','byl uvězněn, připoután')] jako pes..."
 scheme_critical_moments.8034.captured: "\n\nNaši strážní dokázali zajmout jednoho z infiltrátorů, a přítomnost [captured.GetTitledFirstName], [owner.Custom2('RelationToMeShort', captured)] of [owner.GetTitledFirstName], potvrzuje, že rod [owner.GetHouse.GetBaseName] za tím stál."
 scheme_critical_moments.8034.discovered: "\n\nPo události se všichni shodují, že to byl jasně čin rodu [owner.GetHouse.GetBaseName]..."
 scheme_critical_moments.8034.fallback: "\n\nPři probírání místa strážní nenašli žádné stopy, kdo za tím mohl být..."
 scheme_critical_moments.8034.permission: "\n\nReakce [owner.GetTopLiege.Custom('CZ_TitleAsNameNoTooltip_G')] má k dokonalosti daleko – co když v tom má prsty?..."
 scheme_critical_moments.8034.emperor: "\n\nTakové zvěrstvo, a z rukou samotného [owner.GetTopLiege.Custom('CZ_TitleAsNameNoTooltip_G')]... co máme dělat?!"
 scheme_critical_moments.8034.crime: "\n\nTento drzý útok jen podtrhuje zvrácenost toho hnusného klanu a nutnost zbavit [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] jejich přítomnosti!"
 scheme_critical_moments.8034.a.discovered: "Ti [owner.GetHouse.GetBaseNameNoTooltip] psi za to zaplatí!"
 scheme_critical_moments.8034.a: "Jak se to mohlo stát...?"
 scheme_critical_moments.8035.t: "[scheme.GetNameNoTooltip]: Konečné přípravy"
 scheme_critical_moments.8035.desc: "Po dlouhých týdnech pečlivého plánování je rod [owner.GetHouse.GetBaseName] připraven zaútočit. Naši lidé jsou na místech, sídlo [target.Custom('CZ_TitledFirstName_G')] ([target_domicile.GetLocation.GetBaronyNameExplicitlyNoTooltip]) je prozkoumané a podrobnosti přepadu dohodnuté.\n\nZbývá jediná otázka: jak naložit s rodem [target.GetHouse.GetBaseName] po našem nevyhnutelném vítězství?"
 scheme_critical_moments.8035.permission: "\n\nS podporou [owner.GetTopLiege.Custom('CZ_TitleAsName_G')] není třeba se nijak zdržovat..."
 scheme_critical_moments.8035.crime: "\n\nPokud bude moje účast odhalena, [owner.GetTopLiege.GetTitleAsName] to jistě uslyší..."
 scheme_critical_moments.8035.emperor: "\n\nJe čas ukázat [owner.GetPrimaryTitle.GetTierAsNameNoTooltip], co se stane těm, kteří se mi postaví..."
 scheme_critical_moments.8035.a: "Zabijte všechny [target.GetHouse.GetBaseNameNoTooltip] psy, které najdete."
 scheme_critical_moments.8035.a.tt: "Pokud bude [Concept('scheme','intrika')|E] úspěšná, setkaní členové rodu [target.GetHouse.GetBaseName] budou zabiti"
 scheme_critical_moments.8035.tt: "[Concept('scheme','Intrika')|E] skončí"
 scheme_critical_moments.8035.b: "Nechte je žít — s něčím, co jim nás připomene."
 scheme_critical_moments.8035.b.tt: "Pokud bude [Concept('scheme','intrika')|E] úspěšná, setkaní členové rodu [target.GetHouse.GetBaseName] získají [GetTrait('blind').GetName( GetNullCharacter )], [GetTrait('disfigured').GetName( GetNullCharacter )] nebo [GetTrait('eunuch_1').GetName( GetNullCharacter )] [Concept('trait','rys')|E]"
 scheme_critical_moments.8035.c: "Přiveďte mi všechny zajatce."
 scheme_critical_moments.8035.c.tt: "Pokud bude [Concept('scheme','intrika')|E] úspěšná, setkaní členové rodu [target.GetHouse.GetBaseName] budou vámi [Concept('imprisoned','uvězněni')|E]"
 scheme_critical_moments.8035.c.warning: "@warning_icon! #X Tvá účast rozhodně nezůstane [Concept('secret','tajemstvím')|E]#!"
 scheme_critical_moments.8035.d: "Ušetřete je, nechceme jejich krev."
