 scheme_critical_moments.4001.t: "$foster_legitimacy_scheme$: Úspěch!"
 scheme_critical_moments.4001.desc.intro: "Se spokojeným výrazem přikládám ke rtům číši ([ROOT.Char.Custom('RegionalAlcoholicDrink')|l]). [Select_CString(ROOT.Char.IsFemale,'Ochránila','Ochránil')] jsem legitimitu [target.Custom('CZ_TitleAsNameNoTooltip_G')]... i [Select_CString(target.IsFemale,'její','jeho')] názor na mě.\n\n"
 scheme_critical_moments.4001.desc.byzantium: "Mozaiky se lesknou v prvním ranním světle a vstávám ze svého místa:"
 scheme_critical_moments.4001.desc.other: "Když si všimnu [ROOT.Char.Custom('GetRandomInteriorDetail')] , vstávám ze svého místa:"
 scheme_critical_moments.4001.desc.outro: "\n\n„Na [target.Custom('CZ_TitledFirstName_A')]! A na [Select_CString(target.IsFemale,'její','jeho')] oprávněný nárok na trůn!“"
 scheme_critical_moments.4001.a: "Vždy potěšení, [Select_CString(target.IsFemale,'má paní','můj pane')]."
 scheme_critical_moments.4001.tt: "Legitimita posílena!"
 foster_legitimacy_scheme_toast_desc: "[Select_CString(owner.IsFemale,'Tvá','Tvůj')] [target.Custom2('RelationToMeShort', SCOPE.sC('owner'))|l] [owner.GetShortUINameNoTooltip] [Select_CString(owner.IsFemale,'posílila','posílil')] tvou [Concept('legitimacy','legitimitu')|E]"
 scheme_critical_moments.4002.t: "$foster_legitimacy_scheme$: Neúspěch"
 scheme_critical_moments.4002.desc: "Zklamání. S povzdechem odhodím dopis, který právě dorazil z hlavního města: „[target.GetTitleAsNameNoTooltip|U] vám vřele děkuje za vaše úsilí.“\n\nDíky jsou stejně dobré jako nic. A díky od [target.Custom('CZ_TitleAsNameNoTooltip_G')] jsou jako kopanec do holeně.\n\n„[Select_CString(ROOT.Char.IsFemale,'Zklamala','Zklamal')] jsi mě,“ [Select_CString(target.IsFemale,'mohla','mohl')] mi rovnou říct. Bez obalu."
 scheme_critical_moments.4002.a: "No, [Select_CString(ROOT.Char.IsFemale,'musela','musel')] jsem to zkusit."
