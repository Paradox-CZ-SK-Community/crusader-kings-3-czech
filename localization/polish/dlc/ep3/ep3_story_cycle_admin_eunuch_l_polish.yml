l_polish:
 admin_eunuch_header: "Vznešený eunuch:"
 admin_eunuch_upgrade_modifier_tt: "#weak [Concept('modifiers','Modifikátory')|E] jsou povýšeny#!"
 admin_eunuch_downgrade_modifier_tt: "#weak [Concept('modifiers','Modifikátory')|E] jsou sníženy#!"
 admin_eunuch_flavor_tt: "#weak Vliv [eunuch.Custom('CZ_FirstNameNoTooltip_G')] může přinést velké výhody, ale za jakou cenu?#!"
 admin_eunuch_rivalry_tt: "[THIS.Char.GetShortUIName] se blíží k vytvoření rivality s [eunuch.Custom('CZ_ShortUIName_I')]"
 ep3_story_cycle_admin_eunuch.1001.t: "$admin_eunuch_header$ [eunuch.GetFullNameNoTooltip]"
 ep3_story_cycle_admin_eunuch.1001.intro_byz: "Po staletí [Glossary( 'eunoukhoi', 'EUNOUKOS_GLOSS' )] sloužili v [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] byrokracii a palácích jako poradci a důvěrníci, hráli důležité role v politických soubojích své doby."
 ep3_story_cycle_admin_eunuch.1001.intro: "Říše vždy potřebuje správce a důvěryhodné služebníky, aby zajistila hladké fungování vlády a bezpečí paláce, a eunuchové patří mezi nejcennější v [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 ep3_story_cycle_admin_eunuch.1001.desc: "\n\n[eunuch.GetFirstName|U] rychle postoupil v hierarchii, a [Select_CString(eunuch.IsFemale,'její','jeho')] talent, poctivost a diskrétnost ve všech věcech nacházejí neobyčejné uznání v celém palácovém sboru."
 ep3_story_cycle_admin_eunuch.1001.arrivals: "\n\nPochází z prosté rodiny ze země [origin.GetDeJureLiege.GetName] a jeho příbuzní za ním nedávno přijeli do sídla [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]..."
 ep3_story_cycle_admin_eunuch.1001.a: "Mám pro něj přesně tu pravou práci."
 ep3_story_cycle_admin_eunuch.1001.b: "Na koho si dát pozor..."
 EUNOUKOS_GLOSS: "Eunuchové, doslova „strážci ložnic“ podle jejich běžné role jako komorníků, byli vykastrovaní mužští služebníci. Pocházeli z různých společenských vrstev, často byli vysoce vzdělaní a důvěryhodní, protože postrádali tělesné rozptýlení či otcovské zájmy; rychle se stali mocnými aktéry v byzantské politice."
 ep3_story_cycle_admin_eunuch.2010.t: "$admin_eunuch_header$ Důvěryhodné ruce"
 ep3_story_cycle_admin_eunuch.2010.desc: "Můj eunuch [eunuch.GetTitledFirstName] ke mně na dvoře přistoupí a tlumeně promluví, zatímco očima těká po sále.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ švitoří, „je mi jasné, že vládní záležitosti by mohly běžet mnohem hladčeji než... teď.“\n\n„Jasný a spořádaný postup by byl pro říši velkou úlevou. Nechte to na mně.“"
 ep3_story_cycle_admin_eunuch.2010.a: "Ano, vyřiď to, [eunuch.GetFirstNameNoTooltip]."
 ep3_story_cycle_admin_eunuch.2010.b: "Současné uspořádání jsou dostačující."
 ep3_story_cycle_admin_eunuch.2015.t: "$admin_eunuch_header$ Rozdělit břemeno"
 ep3_story_cycle_admin_eunuch.2015.desc: "Můj eunuch [eunuch.GetTitledFirstName] mi v poslední době velmi pomáhá a nese mnohá nepříjemná břemena mé říše.\n\nZatímco se prokousáváme hromadami listin a s každým otiskem císařské pečeti mizí palácové zásoby vosku, tiše navrhne: „[ROOT.Char.Custom('FormOfAddressForLiege')|U], "
 ep3_story_cycle_admin_eunuch.2015.war: "válka vám ubírá čas i pozornost,"
 ep3_story_cycle_admin_eunuch.2015.hunter: "nemáte čas na své oblíbené lovy,"
 ep3_story_cycle_admin_eunuch.2015.fallback: "státní povinnosti vás tolik vyčerpávají,"
 ep3_story_cycle_admin_eunuch.2015.outro: "a pro mě by nebyl problém vás zbavit těchto únavných povinností...„"
 ep3_story_cycle_admin_eunuch.2015.a: "Jsi mi velkou pomocí, [eunuch.Custom('CZ_FirstNameNoTooltip_V')]."
 ep3_story_cycle_admin_eunuch.2015.b: "S tím si poradím."
 ep3_story_cycle_admin_eunuch.2021.t: "$admin_eunuch_header$ Vysoký úřad"
 ep3_story_cycle_admin_eunuch.2021.desc: "Můj eunuch [eunuch.GetTitledFirstName] domluvil soukromou schůzku a k mému překvapení nepřišel sám. „Ach, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]!“ zacvrliká. „Znáte [Select_CString(governor.IsFemale,'mou','mého')] [governor.Custom('ComplimentAdjective')] [eunuch.Custom2('CZ_RelationToMeShort_A', SCOPE.sC('governor'))|l] [governor.Custom('CZ_TitledFirstName_A')]?“\n\nS nacvičenou přesností se [governor.GetFirstNameNoTooltip] přede mnou předvede v tom nejlepším světle.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], [governor.GetFirstNameNoTooltip] by [Select_CString(governor.IsFemale,'byla #EMP vynikající#! kandidátkou','byl #EMP vynikajícím#! kandidátem')] na guvernéra [title.GetTierAsNameNoTooltip|l] [title.GetName] – rozhodně lepším než ta druhá možnost...“"
 ep3_story_cycle_admin_eunuch.2021.a.grant: "Dobrá, [title.GetNameNoTierNoTooltip] připadne [governor.Custom('CZ_FirstNameNoTooltip_D')]."
 ep3_story_cycle_admin_eunuch.2021.a: "Dobře, [governor.GetFirstNameNoTooltip] bude zařazen na krátký seznam."
 ep3_story_cycle_admin_eunuch.2021.b: "Tvůj [eunuch.Custom2('RelationToMeShort', SCOPE.sC('governor'))|l] by měl jít řádnou cestou..."
 ep3_story_cycle_admin_eunuch.2023.desc: "Z paláce s lítostí sleduji, jak přicházejí vniveč vaše schopnosti a jak se guvernéry [emperor.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] stávají horší lidé.\n\nKvůli [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip|l], když už ne kvůli sobě, musí [emperor.GetTitleAsNameNoTooltip] vaše schopnosti uznat. S trochou prostředků bych se postaral, aby se to [emperor.GetTitleAsNameNoTooltip] [Select_CString(emperor.IsFemale,'dozvěděla','dozvěděl')]..."
 ep3_story_cycle_admin_eunuch.2023.a: "Učiň to, eunuchu!"
 ep3_story_cycle_admin_eunuch.2023.a.tt: "[eunuch.GetFirstName] se pokusí přesvědčit [emperor.Custom('CZ_TitledFirstName_A')], aby vám [Select_CString(emperor.IsFemale,'udělila','udělil')] [Concept('governorship','guvernérství')|E]"
 ep3_story_cycle_admin_eunuch.toast: "Vznešený eunuch"
 ep3_story_cycle_admin_eunuch.2023.b: "Na to nemám čas."
 ep3_story_cycle_admin_eunuch.2023.b.toast: "Návrh odmítnut"
 ep3_story_cycle_admin_eunuch.2024.t: "$admin_eunuch_header$ Šlechtický úřad"
 ep3_story_cycle_admin_eunuch.2024.desc: "Můj eunuch [eunuch.GetTitledFirstName] vklouzne do místnosti a pokorně si to namíří k mému křeslu.\n\n„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]!“ vypískne radostně. „Jsem tak rád, že vás zastihuji! Zrovna jsem přemýšlel o situaci v [title.Custom('CZ_LandedNameNoTier_L')]: [title.GetTierAsNameNoTooltip|l] by opravdu potřebovalo silné a spolehlivé vedení.“\n\n„A shodou okolností asi vím o [Select_CString(governor.IsFemale,'té pravé osobě','tom pravém člověku')]. Podle mého skromného názoru by [governor.GetTitledFirstName] [Select_CString(governor.IsFemale,'byla #EMP vynikající#! – a věrnou – guvernérkou','byl #EMP vynikajícím#! – a věrným – guvernérem')], Vaše Veličenstvo.“"
 ep3_story_cycle_admin_eunuch.2031.t: "$admin_eunuch_header$ [Select_CString(new_patriarch.IsFemale,'Svatá Matka','Svatý Otec')]"
 ep3_story_cycle_admin_eunuch.2031.intro: "Jsem zvědavý, když si můj eunuch, [eunuch.GetTitledFirstName], žádá schůzku v"
 ep3_story_cycle_admin_eunuch.2031.intro_byz: "Hagii Sofii"
 ep3_story_cycle_admin_eunuch.2031.intro_fallback: "v [ROOT.Char.GetFaith.HouseOfWorship]"
 ep3_story_cycle_admin_eunuch.2031.desc: "a o to víc, když ho najdu s jeho [eunuch.Custom2('CZ_RelationToMeShort_I', SCOPE.sC('new_patriarch'))|l] [new_patriarch.Custom('CZ_FirstName_I')], který se zjevně snaží o jakousi podivnou napodobeninu [ROOT.Char.GetFaith.GetAdjectiveNoTooltip|l] zbožnosti.\n\n[eunuch.GetFirstNameNoTooltip|U] mluví dobře – tak dobře, že si téměř neuvědomím, jak závažné jsou jeho přesvědčivé argumenty.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ prozpěvuje s podivným výrazem ve tváři, „tak to tedy jistě chce [ROOT.Char.GetFaith.HighGodNameAlternate], aby se [new_patriarch.GetFirstNameNoTooltip] [Select_CString(new_patriarch.IsFemale,'stala','stal')] novou hlavou ([old_patriarch.GetTitleAsName]) [CZAdherentPl_G(ROOT.Char.GetFaith)|l]!“"
 ep3_story_cycle_admin_eunuch.2031.a: "Tvůj [eunuch.Custom2('RelationToMeShort', SCOPE.sC('new_patriarch'))|l] #EMP bude#! [old_patriarch.GetTitleAsNameNoTooltip|l]!"
 ep3_story_cycle_admin_eunuch.2031.b: "No tak, to je #EMP divoký#! návrh..."
 ep3_story_cycle_admin_eunuch.2040.t: "$admin_eunuch_header$ Místo u stolu"
 ep3_story_cycle_admin_eunuch.2040.desc: "Můj eunuch [eunuch.GetTitledFirstName] mě zastihne nad listinami. „Ach, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]!“ zapiští a jemně zavře dveře. „Máte chvilku?“\n\n„Bolí mě, když vidím, jak práci vaší rady brzdí její... hrobníci.“ Zvednu obočí.\n\nOdkašle si. „Rád bych převzal část povinností a lépe dohlížel na vaše zájmy i na zájmy [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l].“"
 ep3_story_cycle_admin_eunuch.2040.a: "Výborně, [eunuch.GetFirstNameNoTooltip], začni okamžitě."
 ep3_story_cycle_admin_eunuch.2040.b: "Nechci, aby tě to odvádělo od tvých ostatních povinností."
 ep3_story_cycle_admin_eunuch.2040.a.toast: "Jmenování do rady"
 ep3_story_cycle_admin_eunuch.2041.t: "$admin_eunuch_header$ Další hlas"
 ep3_story_cycle_admin_eunuch.2041.desc: "Můj eunuch [eunuch.GetTitledFirstName] strčí hlavu do dveří radní síně, rozzáří se, když mě zahlédne, a vběhne dovnitř i s jedním ze svých příbuzných.\n\n„[Select_CString(ROOT.Char.IsFemale,'Má','Můj')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]!“ zachvěje se. „Když jsem přemýšlel o... poněkud nedostatečných schopnostech vašich rádců, najednou mi to došlo! [Select_CString(councillor.IsFemale,'Má','Můj')] [eunuch.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|l] [councillor.GetFirstName] by [Select_CString(councillor.IsFemale,'mohla','mohl')] být pro Vaši Milost velkým přínosem!“"
 ep3_story_cycle_admin_eunuch.2041.a: "Dobře, jak říkáš, [eunuch.GetFirstNameNoTooltip]."
 ep3_story_cycle_admin_eunuch.2041.b: "Zamyslím se nad tím..."
 ep3_story_cycle_admin_eunuch.2043.desc: "Jako palácový eunuch vidím mnoho špatného vládnutí a je mi jasné, že patříte k nejcennějším, a přitom nejvíc přehlíženým poddaným [emperor.Custom('CZ_TitleAsName_G')].\n\nS vaší podporou bych mohl hlasitěji prosazovat přednosti vašich rad – pro dobro [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip|l]."
 ep3_story_cycle_admin_eunuch.2043.a: "Klidně, [eunuch.GetFirstNameNoTooltip]!"
 ep3_story_cycle_admin_eunuch.2043.a.tt: "[eunuch.GetFirstName] se pokusí přesvědčit [emperor.Custom('CZ_TitledFirstName_A')], aby z vás [Select_CString(emperor.IsFemale,'udělala','udělal')] [Concept('councillor','rádce')|E]"
 ep3_story_cycle_admin_eunuch.2043.b: "Nemám zájem."
 ep3_story_cycle_admin_eunuch.2043.b.toast: "Návrh odmítnut"
 ep3_story_cycle_admin_eunuch.2044.t: "$admin_eunuch_header$ Mocná rada"
 ep3_story_cycle_admin_eunuch.2044.desc: "Můj eunuch [eunuch.GetTitledFirstName] si pronikavě odkašle, když se chystáme probírat státní záležitosti.\n\n„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ začne opatrně a váží slova, „vaše vláda je – #EMP pochopitelně#! – výkonná, ale člověk se nemůže ubránit dojmu, že unikly jisté... příležitosti.“\n\n„Jsou tu dobří, #EMP schopní#! lidé, kteří jsou při obsazování nejvyšších úřadů přehlíženi. Lidé jako [councillor.GetTitledFirstName], například! [Select_CString(councillor.IsFemale,'Byla','Byl')] by pro Vaši Milost velkým přínosem!“"
 ep3_story_cycle_admin_eunuch.2050.t: "$admin_eunuch_header$ Bohatá iniciativa"
 ep3_story_cycle_admin_eunuch.2050.desc: "Můj eunuch [eunuch.GetTitledFirstName] ke mně přistoupí se samolibým úsměvem na rtech a štěbetá: „[ROOT.Char.Custom('FormOfAddressForLiege')|U], mám pro vás ten nejlahodnější návrh!“\n\n"
 ep3_story_cycle_admin_eunuch.2050.debase: "„[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|U] by vždy mohla použít více mincí, a já mám spočítáno. S malou úpravou naší mincovní strategie bychom mohli ušetřit spoustu peněz!“"
 ep3_story_cycle_admin_eunuch.2050.raise_taxes: "„[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|U] by vždy mohla použít více prostředků, a v tom duchu jsem přišel s návrhem na #EMP mírné#! zvýšení daní!“"
 ep3_story_cycle_admin_eunuch.2050.candidacy: "„Naslouchal jsem mnoha hlasům po celém [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] a vidím skvělou příležitost podpořit kandidaturu [Select_CString(boon_target.IsFemale,'vaší','vašeho')] [ROOT.Char.Custom2('CZ_RelationToMeShort_G', SCOPE.sC('boon_target'))|l] [boon_target.Custom('CZ_FirstName_G')] na [boon_title.GetTierAsNameNoTooltip|l] [boon_title.GetName]!“"
 ep3_story_cycle_admin_eunuch.2050.fabricate_hook: "„Zprávy se rychle šíří v [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], stejně jako pomluvy! Mám přesně ten páku, kterou potřebujete, aby [boon_victim.GetTitledFirstName] [Select_CString(boon_victim.IsFemale,'poznala','poznal')] své místo!“"
 ep3_story_cycle_admin_eunuch.2050.imprison_rebel: "„Všichni víme, jakým problémem se [boon_victim.GetTitledFirstName] [Select_CString(boon_victim.IsFemale,'stala','stal')]; já náhodou mám právě to řešení!“"
 ep3_story_cycle_admin_eunuch.2050.influence: "„Mám mnoho zdrojů i mluvčích; ti jen potřebují trochu nasměrování. Člověk nikdy nemůže mít příliš mnoho zastánců, to vždy říkám.“"
 ep3_story_cycle_admin_eunuch.2050.outro: "\n\n„Tak mám vydat rozkaz, slavný [ROOT.Char.GetTitleAsNameNoTooltip]?“"
 ep3_story_cycle_admin_eunuch.2050.a: "Vynikající, skvělá iniciativa!"
 ep3_story_cycle_admin_eunuch.2050.b: "Není to nutné, [eunuch.GetFirstNameNoTooltip]."
 ep3_story_cycle_admin_eunuch.2051.t: "$admin_eunuch_header$ Malí ptáčci"
 ep3_story_cycle_admin_eunuch.2051.desc: "Můj eunuch, [eunuch.GetTitledFirstName], zařídil soukromé setkání mezi námi a [Select_CString(SCOPE.sC('secret_owner').IsFemale,'mou','mým')] [ROOT.Char.Custom2('CZ_RelationToMeShort_I', SCOPE.sC('secret_owner'))], [secret_owner.GetTitledFirstName], [Select_CString(secret_owner.IsFemale,'která podle výrazu tváře nevěděla','který podle výrazu tváře nevěděl')], co si má myslet.\n\nTen chrochtající kastrát vnesl do [Select_CString(secret_owner.IsFemale,'ubohé ženy','ubohého muže')] strach z hněvu, jímž trestá [ROOT.Char.GetFaith.HighGodName], a lstivě naznačoval, že objevil jakési temné tajemství [Select_CString(SCOPE.sC('secret_owner').IsFemale,'mé','mého')] [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('secret_owner'))].\n\nNakonec se domýšlivý [eunuch.Custom('InsultNoun')] obrátí ke mně s nemocným úsměvem: „No, [ROOT.Char.Custom('FormOfAddressForLiege')], chcete vědět, co #EMP já#! vím?“"
 ep3_story_cycle_admin_eunuch.2051.a: "Řekni mi všechno, [eunuch.GetFirstNameNoTooltip]!"
 ep3_story_cycle_admin_eunuch.2051.a.tt: "Zjistíš jedno z [Concept('secrets','tajemství')|E] [secret_owner.Custom('CZ_TitledFirstName_G')]"
 ep3_story_cycle_admin_eunuch.2051.b: "Myslím, že bych raději [Select_CString(ROOT.Char.IsFemale,'nechtěla','nechtěl')] vědět..."
 ep3_story_cycle_admin_eunuch.2052.t: "$admin_eunuch_header$ Něco se děje"
 ep3_story_cycle_admin_eunuch.2052.desc: "Můj eunuch [eunuch.GetTitledFirstName] domluvil soukromou schůzku mezi námi a [Select_CString(scheme_owner.IsFemale,'mou','mým')] [ROOT.Char.Custom2('CZ_RelationToMeShort_I', SCOPE.sC('scheme_owner'))|l] [scheme_owner.Custom('CZ_FirstName_I')], [Select_CString(scheme_owner.IsFemale,'kterou','kterého')] slova [eunuch.Custom('CZ_FirstNameNoTooltip_G')] podle výrazu ve tváři hluboce znepokojila.\n\nTen chichotající se kastrát nahání [Select_CString(scheme_owner.IsFemale,'té ubohé ženě','tomu ubohému muži')] boží bázeň a obratně se dostává k jakýmsi temným piklům, které prý odhalil a které [Select_CString(scheme_owner.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scheme_owner'))|l] chystá.\n\nNakonec se ke mně [Select_CString(eunuch.IsFemale,'ta','ten')] samolibý [eunuch.Custom2('InsultNoun', ROOT.Char)] s úsměvem otočí: „Nuže, [ROOT.Char.Custom('FormOfAddressForLiege')], chcete vědět, co [Select_CString(scheme_owner.IsFemale,'vaše','váš')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scheme_owner'))|l] chystá?“"
 ep3_story_cycle_admin_eunuch.2052.a: "Řekni mi všechno, [eunuch.GetFirstNameNoTooltip]!"
 ep3_story_cycle_admin_eunuch.2052.a.tt: "Odhalíš jednu z [Concept('hostile_schemes','nepřátelských intrik')|E] [scheme_owner.Custom('CZ_TitledFirstName_G')]"
 ep3_story_cycle_admin_eunuch.2052.b: "Myslím, že bych raději [Select_CString(ROOT.Char.IsFemale,'nechtěla','nechtěl')] vědět..."
 ep3_story_cycle_admin_eunuch.2060.t: "$admin_eunuch_header$ Další povinnosti"
 ep3_story_cycle_admin_eunuch.2060.desc: "Můj eunuch, [eunuch.GetTitledFirstName], přisedne ke mně s malým zakašláním, zatímco čekám na audienci, a začne: „Ah, [Select_CString(ROOT.Char.IsFemale,'má','můj')] [eunuch.Custom2('RelationToMeShort', ROOT.Char)], chtěl jsem se vás na něco zeptat.“\n\n„I když si velmi vážím svého místa ve vašem dvoře, myslím, že bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] být nápomocný ještě více. Ve skutečnosti mám v mysli nějakou roli...“"
 ep3_story_cycle_admin_eunuch.2060.a: "Ano, ano, je to tvoje, [eunuch.GetFirstNameNoTooltip]."
 ep3_story_cycle_admin_eunuch.2060.b: "Ne, mám jiné nápady..."
 ep3_story_cycle_admin_eunuch.2061.t: "$admin_eunuch_header$ Povýšení rodiny"
 ep3_story_cycle_admin_eunuch.2061.desc: "Můj eunuch [eunuch.GetTitledFirstName] ke mně přistoupí a v patách mu jde [Select_CString(positioner.IsFemale,'nenápadně vyhlížející žena','nenápadně vyhlížející muž')]. „Tady jste, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]!“ usměje se. „Přivádím vám [Select_CString(positioner.IsFemale,'svou talentovanou','svého talentovaného')] [eunuch.Custom2('CZ_RelationToMeShort_A', SCOPE.sC('positioner'))|l] [positioner.Custom('CZ_TitledFirstName_A')]!“\n\nS nacvičenou přesností se [positioner.GetFirstNameNoTooltip] přede mnou předvede v tom nejlepším světle.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], [positioner.GetFirstNameNoTooltip] by [Select_CString(positioner.IsFemale,'byla #EMP vynikající#! kandidátkou','byl #EMP vynikajícím#! kandidátem')] na místo u vašeho dvora – kdekoli jinde [Select_CString(positioner.IsFemale,'její','jeho')] talent přichází vniveč...“"
 ep3_story_cycle_admin_eunuch.2061.a: "[positioner.GetFirstNameNoTooltip] je výborný návrh!"
 ep3_story_cycle_admin_eunuch.2061.b: "Nejsem přesvědčen..."
 ep3_story_cycle_admin_eunuch.2070.t: "$admin_eunuch_header$ Sociální vzestup"
 ep3_story_cycle_admin_eunuch.2070.desc: "Můj eunuch [eunuch.GetTitledFirstName] se přede mnou objeví i s jedním členem své rodiny. „[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U]!“ zasměje se. „Mám pro vás ten nejrozkošnější návrh!“\n\n„[Select_CString(eunuch_marry.IsFemale,'Má','Můj')] [eunuch.Custom2('RelationToMeShort', SCOPE.sC('eunuch_marry'))|l] [eunuch_marry.GetTitledFirstName] by [Select_CString(eunuch_marry.IsFemale,'byla #EMP nanejvýš#! vhodnou nevěstou','byl #EMP nanejvýš#! vhodným ženichem')] pro [Select_CString(emperor_marry.IsFemale,'vaši','vašeho')] [ROOT.Char.Custom2('CZ_RelationToMeShort_A', SCOPE.sC('emperor_marry'))|l] [emperor_marry.Custom('CZ_TitledFirstName_A')], jistě souhlasíte!“\n\nS až příliš nacvičenou přesností se [eunuch_marry.GetFirstNameNoTooltip] přede mnou hrdě představí."
 ep3_story_cycle_admin_eunuch.2070.a: "[eunuch_marry.GetFirstNameNoTooltip] je vhodný partner pro [emperor_marry.Custom('CZ_FirstNameNoTooltip_A')]!"
 ep3_story_cycle_admin_eunuch.2070.b: "Nemyslím si..."
 ep3_story_cycle_admin_eunuch.3000.t: "$admin_eunuch_header$ Chráněnec"
 ep3_story_cycle_admin_eunuch.3000.desc: "V poslední době se hodně mluví o zvláštní pozornosti, kterou můj eunuch [eunuch.GetTitledFirstName] věnuje [Select_CString(protege.IsFemale,'své','svému')] [eunuch.Custom2('CZ_RelationToMeShort_D', SCOPE.sC('protege'))|l] [protege.Custom('CZ_FirstName_D')].\n\nKleštěnec se k [Select_CString(protege.IsFemale,'ní','němu')] chová skoro jako k [Select_CString(protege.IsFemale,'dceři','synovi')], [Select_CString(protege.IsFemale,'kterou','kterého')] sám nikdy mít nemohl..."
 ep3_story_cycle_admin_eunuch.3000.a: "Zajímavé."
 ep3_story_cycle_admin_eunuch.3001.t: "$admin_eunuch_header$ Student"
 ep3_story_cycle_admin_eunuch.3001.desc: "Zdá se, že můj eunuch [eunuch.GetTitledFirstName] vzal pod svá křídla dalšího kleštěnce a zasvěcuje ho do tajů [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip|l] správy.\n\n[student.GetFirstName|U] je s ním často vídán; ti dva se skloní nad čísly a probírají hospodářství [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] – nebo to aspoň předpokládáme..."
 ep3_story_cycle_admin_eunuch.3001.a: "Asi další užitečný eunuch."
 ep3_story_cycle_admin_eunuch.3010.t: "$admin_eunuch_header$ Rival"
 ep3_story_cycle_admin_eunuch.3010.desc: "Způsoby sekretariátu eunuchů jsou pro obyčejné smrtelníky záhadou, ale je zřejmé, že rychlý vzestup [eunuch.GetFirstName] a jeho dosah vzbudily i tam nepřátele.\n\n[rival.GetFirstName|U], jiný kastrát, projevil zřetelně své nepřátelství a zdá se, že se snaží navzájem si škodit."
 ep3_story_cycle_admin_eunuch.3010.a: "Jsem si jistý, že si své spory vyřeší..."
 ep3_story_cycle_admin_eunuch.4000.t: "$admin_eunuch_header$ Obvinění"
 ep3_story_cycle_admin_eunuch.4000.desc: "Cestou do ložnice narazím na [Select_CString(eunuch.IsFemale,'vyděšenou','vyděšeného')] [eunuch.Custom('CZ_FirstName_A')], který zalapá po dechu: „[ROOT.Char.Custom('FormOfAddressForLiege')|U], tak rád, že jsem vás našel! Ach, to jsou ty nejtíživější zprávy!“\n\nPřistoupí blíž a šeptá mi do ucha: „Jde o [Select_CString(spouse.IsFemale,'vaši','vašeho')] [spouse.Custom('WifeHusband')|l], [Select_CString(ROOT.Char.IsFemale,'má','můj')] [eunuch.Custom2('RelationToMeShort', ROOT.Char)|l]! Zdá se, že si... něco [Select_CString(spouse.IsFemale,'začala','začal')]! Mimo manželství! Dělá dvouhřbetou šelmu! S někým u dvora!“\n\nZírám na něj a hledám slova."
 ep3_story_cycle_admin_eunuch.4000.a: "Vysvětli se okamžitě!"
 ep3_story_cycle_admin_eunuch.4000.success: "Zjistíte pravdu"
 ep3_story_cycle_admin_eunuch.4000.success.tt: "Může být odhaleno [Concept('secret','tajemství')|E] nebo [Concept('scheme','intrika')|E]"
 ep3_story_cycle_admin_eunuch.4000.failure: "Zjistíte pouze pochyby"
 ep3_story_cycle_admin_eunuch.4010.failure.tt: "Nic nenajdeš"
 ep3_story_cycle_admin_eunuch.4000.b: "Ach ano, to vím."
 ep3_story_cycle_admin_eunuch.4000.b.reason: "Tato možnost je dostupná, protože už o [Concept('secret','tajemství')|E] víš"
 ep3_story_cycle_admin_eunuch.4000.c: "[Select_CString(spouse.IsFemale,'Ta mizerná','Ten mizerný')] [spouse.Custom2('InsultNounSexual', ROOT.Char)]! Okamžitě [Select_CString(spouse.IsFemale,'ji','ho')] zavřete!"
 ep3_story_cycle_admin_eunuch.4000.innocent: "Neexistuje žádný důkaz o poměru"
 ep3_story_cycle_admin_eunuch.4010.t: "$admin_eunuch_header$ Nediskrétnosti"
 ep3_story_cycle_admin_eunuch.4010.desc: "Pověsti nabraly na síle v poslední době, a čím více je rozvažuju, tím více jim začínám věřit...\n\nMůj [spouse.Custom('WifeHusband')], a [seducer.GetFirstName]! Jak vám to [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] [spouse.GetTitledFirstName] udělat...? Přečetl jsem si fakta znovu a znovu a nejsem o krok blíže k pravdě.\n\nMám podezření, že v tom má prsty ten darebákův [seducer.Custom2('RelationToMeShort', SCOPE.sC('eunuch'))], [eunuch.GetFirstName], ale jak to mohu zjistit jistě?"
 ep3_story_cycle_admin_eunuch.4010.a: "Uvidíme, jak hluboko toto spiknutí sahá..."
 ep3_story_cycle_admin_eunuch.4010.c: "Zavřete je všechny tři okamžitě!"
 ep3_story_cycle_admin_eunuch.4010.d: "Možná by to nebylo #EMP tak#! špatné?"
 ep3_story_cycle_admin_eunuch.5000.t: "$admin_eunuch_header$ Získávání nepřátel"
 ep3_story_cycle_admin_eunuch.5000.desc: "[Select_CString(whinger.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('whinger'))|l] [whinger.GetTitledFirstName] vtrhne rozhořčeně do mé pracovny a rozhlíží se kolem. Nakonec přistoupí a oddechne si: „Dobře, ten #EMP odporný#! tvor tu není!“\n\nChvíli přemýšlím, koho asi myslí, ale není to třeba. „[whinger.Custom2('RelationToMeShort', ROOT.Char)|U]! S tím eunuchem [eunuch.Custom('CZ_FirstName_I')] #EMP musíš#! něco udělat! Má prsty ve všem a uši v každém koutě. Říkám ti, že nemá nic dobrého za lubem!“"
 ep3_story_cycle_admin_eunuch.5000.a: "Ach, nebuď [Select_CString(whinger.IsFemale,'směšná','směšný')]! Je to věrný služebník."
 ep3_story_cycle_admin_eunuch.5000.b: "Možná máš pravdu..."
 ep3_story_cycle_admin_eunuch.5010.t: "$admin_eunuch_header$ Odpor"
 ep3_story_cycle_admin_eunuch.5010.desc: "„Nevidíš, jak tento pavouk plete své sítě proti tobě, [rival.Custom2('RelationToMeShort', ROOT.Char)]?“ přeruší [rival.GetFirstName] výrazně zaskočeného [eunuch.GetFirstName], který se na mě podívá.\n\nNeshody mezi [Select_CString(SCOPE.sC('rival').IsFemale,'mou','mým')] [ROOT.Char.Custom2('CZ_RelationToMeShort_I', SCOPE.sC('rival'))] a [eunuch.GetFirstNameNoTooltip] se v poslední době zhoršují a hrozí, že se stanou hlavním rozptýlením na dvoře.\n\n[eunuch.GetFirstNameNoTooltip|U] se před odpovědí sebere: „To je urážlivé obvinění, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]! Starám se jen o nejlepší zájmy [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]!“"
 ep3_story_cycle_admin_eunuch.5010.a: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rival'))|U], důvěřuji [eunuch.GetFirstNameNoTooltip] a vy byste měli také."
 ep3_story_cycle_admin_eunuch.5010.b: "Ano, eunuch překračuje své pravomoci."
 ep3_story_cycle_admin_eunuch.5020.t: "$admin_eunuch_header$ Cesta nejmenšího odporu"
 ep3_story_cycle_admin_eunuch.5020.desc: "Dovídám se, že [Select_CString(SCOPE.sC('puppet').IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('puppet'))], [puppet.GetTitledFirstName], tráví stále více času v družnosti s eunuchem, [eunuch.GetFirstName], a dvojice je často viděna spolu, svěřeně a zaujatě.\n\nDokonce se říká, že [puppet.GetFirstNameNoTooltip] dostává určitý druh výuky, jako by ho [eunuch.GetFirstNameNoTooltip] [Select_CString(eunuch.IsFemale,'připravovala','připravoval')] na místo v sekretariátu eunuchů!"
 ep3_story_cycle_admin_eunuch.5020.a: "Nepravděpodobné duo."
 ep3_story_cycle_admin_eunuch.6000.t: "$admin_eunuch_header$ Velmi [emperor.GetPrimaryTitle.GetAdjectiveNoTooltip] převrat"
 ep3_story_cycle_admin_eunuch.6000.desc: "Když přecházím po královské síni, spatřím [eunuch.GetFirstName] kráčet cílevědomě vpřed, v doprovodu družiny eunuchů. „[ROOT.Char.GetTitleAsNameNoTooltip|U]!“ vykřikne. „Musím s vámi mluvit!“"
 ep3_story_cycle_admin_eunuch.6000.body: "\n\nEunuch si ztěžka povzdechne: „Je mi líto, že to došlo až sem, Vaše Veličenstvo. Je to #EMP nanejvýš#! politováníhodné. Mám vám vyřídit, že vaše vláda je dále neudržitelná.“\n\n"
 ep3_story_cycle_admin_eunuch.6000.family: "„Bylo rozhodnuto: předáte žezlo [Select_CString(coupist.IsFemale,'své','svému')] [ROOT.Char.Custom2('CZ_RelationToMeShort_D', coupist)], [coupist.GetTitledFirstName], pro dobro říše!“"
 ep3_story_cycle_admin_eunuch.6000.co_caesar: "„Bylo rozhodnuto: předáte žezlo [Select_CString(coupist.IsFemale,'své','svému')] [ROOT.Char.Custom2('CZ_RelationToMeShort_D', coupist)], [coupist.GetTitledFirstName], pro dobro říše!“"
 ep3_story_cycle_admin_eunuch.6000.eunuch_family: "„Bylo rozhodnuto: předáte žezlo [Select_CString(coupist.IsFemale,'mé','mému')] [eunuch.Custom2('CZ_RelationToMeShort_D', coupist)], [coupist.GetTitledFirstName], pro dobro [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')]!“"
 ep3_story_cycle_admin_eunuch.6000.regent: "„Bylo rozhodnuto: předáte žezlo svému regentovi, [coupist.GetTitledFirstName], pro dobro říše!“"
 ep3_story_cycle_admin_eunuch.6000.fallback: "„Bylo rozhodnuto: předáte žezlo [coupist.GetTitledFirstName], pro dobro říše!“"
 ep3_story_cycle_admin_eunuch.6000.a: "To je #EMP ZRADA#! Stráže! Zajměte je!"
 ep3_story_cycle_admin_eunuch.6000.a.success: "Puč je zmařen"
 ep3_story_cycle_admin_eunuch.6000.a.failure: "Puč uspěl"
 ep3_story_cycle_admin_eunuch.6000.c: "Odejdi nyní, a možná ti nechám hlavu."
 ep3_story_cycle_admin_eunuch.6000.d: "Velmi dobře... Udělám, co žádáte."
 ep3_story_cycle_admin_eunuch.8000.t: "$admin_eunuch_header$ Držení se moci"
 ep3_story_cycle_admin_eunuch.8000.intro: "Eunuch, [eunuch.GetTitledFirstName], zaujímal významné místo v mém"
 ep3_story_cycle_admin_eunuch.8000.intro_byz: "Ten [Glossary( 'eunoukhos', 'EUNOUKOS_GLOSS' )], [eunuch.GetTitledFirstName], zaujímal významné místo v mém"
 ep3_story_cycle_admin_eunuch.8000.intro_family: "[ROOT.Char.Custom2('RelationToMeShort', previous_story_owner)],"
 ep3_story_cycle_admin_eunuch.8000.intro_enemy: "nepřítel,"
 ep3_story_cycle_admin_eunuch.8000.intro_fallback: "předchůdce,"
 ep3_story_cycle_admin_eunuch.8000.desc: "správy [previous_story_owner.Custom('CZ_TitledFirstName_G')] – a v paláci má stále jistý vliv...\n\nNeztrácel čas a snaží se získat mou přízeň; po celém dvoře okázale projevuje podlézavou úctu. Možná by se mohl hodit."
 ep3_story_cycle_admin_eunuch.8000.a: "[eunuch.GetFirstNameNoTooltip] musí pryč."
 ep3_story_cycle_admin_eunuch.8000.b: "Je čas, aby [student.GetFirstNameNoTooltip] převzal."
 ep3_story_cycle_admin_eunuch.8000.c: "[rival.GetFirstNameNoTooltip] je spolehlivější."
 ep3_story_cycle_admin_eunuch.8000.d: "Nechci narušit rovnováhu sil."
 ep3_story_cycle_admin_eunuch.8010.t: "$admin_eunuch_header$ Život ve službě"
 ep3_story_cycle_admin_eunuch.8010.desc: "Cenný služebník [admin_title.Custom('CZ_LandedName_G')] bohužel leží mrtvý, [eunuch.GetFirstName], jeden z nejvlivnějších eunuchů nedávné doby, [Select_CString(eunuch.IsFemale,'byla','byl')] [eunuch.GetDeathReasonHideKiller]...\n\nKéž [ROOT.Char.GetFaith.HighGodName] neotálí a poskytne [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] dalšího služebníka [Select_CString(eunuch.IsFemale,'její','jeho')] postavení a dovedností."
 ep3_story_cycle_admin_eunuch.8010.d: "Věci se jistě změní..."
 ep3_story_cycle_admin_eunuch.8020.t: "$admin_eunuch_header$ Zámek a klíč"
 ep3_story_cycle_admin_eunuch.8020.desc: "Vlivný dvorní eunuch [eunuch.GetFirstName], kdysi cenný služebník [admin_title.Custom('CZ_LandedName_G')], nyní strádá v okovech [background_dungeon_scope.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')].\n\nMožná by se mi dal vrátit do služby, pokud by to stálo za námahu..."
 ep3_story_cycle_admin_eunuch.8020.d: "Ztráta pro [ROOT.Char.GetTopLiege.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_A')]."
 ep3_story_cycle_admin_eunuch.8020.a: "[eunuch.GetFirstNameNoTooltip] je příliš užitečný na to, aby [Select_CString(eunuch.IsFemale,'byla','byl')] zavřen..."
 ep3_story_cycle_admin_eunuch.8030.t: "$admin_eunuch_header$ Nedostupný"
 ep3_story_cycle_admin_eunuch.8030.desc: "Vlivný dvorní eunuch [eunuch.GetFirstName], kdysi cenný služebník [admin_title.Custom('CZ_LandedName_G')], nyní slouží [eunuch.GetLiege.Custom('CZ_Name_D')].\n\nMožná by se dal zlákat zpět do mých služeb, pokud by to stálo za námahu..."
 ep3_story_cycle_admin_eunuch.8030.a: "Ten eunuch je #EMP můj#!."
 ep3_story_cycle_admin_eunuch.8030.b: "[student.GetFirstNameNoTooltip] se u něj [Select_CString(student.IsFemale,'učila','učil')] a může v jeho práci pokračovat."
 ep3_story_cycle_admin_eunuch.8030.c: "[Select_CString(eunuch.IsFemale,'Její','Jeho')] starý rival [rival.GetFirstNameNoTooltip] může převzít, co zbylo."
 ep3_story_cycle_admin_eunuch.8030.d: "Bohužel, tento utekl..."
 ep3_story_cycle_admin_eunuch.8040.t: "$admin_eunuch_header$ Větší věci"
 ep3_story_cycle_admin_eunuch.8040.desc: "Kdysi cenný služebník [admin_title.GetAdjective] dvora, vlivný eunuch [eunuch.GetFirstName], se posunul k větším věcem.\n\n"
 ep3_story_cycle_admin_eunuch.8040.ruler: "Zdá se, že má ztráta je ziskem [eunuch.GetPrimaryTitle.Custom('CZ_LandedName_G')]..."
 ep3_story_cycle_admin_eunuch.8040.noble_family: "Zdá se, že má ztráta je ziskem panství [eunuch.GetHouse.GetBaseName]..."
 ep3_story_cycle_admin_eunuch.8040.laamp: "Zdá se, že hledá dobrodružnější život..."
 ep3_story_cycle_admin_eunuch.8040.d: "Škoda."
