l_polish:
 cid_loyalty_counter_positive: "Toto #positive_value prokáže#! [Concept('cid_loyalty','Rodrigovu věrnost')|E] vůči [liege.Custom('CZ_TitleAsNameNoTooltip_D')]"
 cid_loyalty_counter_very_positive: "Toto #positive_value výrazně prokáže#! [Concept('cid_loyalty','Rodrigovu věrnost')|E] vůči [liege.Custom('CZ_TitleAsNameNoTooltip_D')]"
 cid_loyalty_counter_negative: "Toto #negative_value zpochybní#! [Concept('cid_loyalty','Rodrigovu věrnost')|E] vůči [liege.Custom('CZ_TitleAsNameNoTooltip_D')]"
 cid_loyalty_counter_very_negative: "Toto #negative_value výrazně zpochybní#! [Concept('cid_loyalty','Rodrigovu věrnost')|E] vůči [liege.Custom('CZ_TitleAsNameNoTooltip_D')]"
 game_concept_cid_loyalty: "Rodrigova věrnost"
 game_concept_cid_loyalty_desc: "Tím, že zůstane #V věrný#! svému lennímu pánovi i ve vyhnanství, si El Cid může znovu získat jeho přízeň a obnovit své výhodné postavení.\n\nTím, že se stane #V neloajálním#!, může El Cid získat zvláštní možnosti, jak se pozvednout na nezávislého vládce."
 cid.0001.t: "Na rozkaz [liege.GetTitleAsNameNoTooltip]"
 cid.0001.desc.intro: "Vložím nohu do třmenu, poplácám koně po krku a naposledy pohlédnu na místo, kterému budu vždycky říkat domov.\n\nVyhnanství. Slova [liege.Custom('CZ_TitledFirstName_G')] nenechávala prostor pro pochybnosti.\n\n"
 cid.0001.desc.alfonso: "Tak věrně jsem sloužil jeho bratru, že bych následoval i jeho."
 cid.0001.desc.garcia_ordonez: "Jednou jsem jej porazil v bitvě, na kterou nemohl zapomenout."
 cid.0001.desc.liege_hate: "Upadl jsem v nemilost [liege.Custom('CZ_TitleAsNameNoTooltip_G')]. K čemu je dobrý vazal, když ho jeho pán nemiluje?"
 cid.0001.desc.courtier: "Nepřátelé na dvoře otrávili [Select_CString(liege.IsFemale,'její','jeho')] mysl. Nepřátelé, kteří mi vždycky chtěli ublížit, neboť [liege.GetTitleAsNameNoTooltip|l] mě [Select_CString(liege.IsFemale,'milovala','miloval')] příliš."
 cid.0001.desc.outro: "\n\nVpravo nad námi letí havran — zlý předzvěst."
 cid.0001.a: "Budu ti vždy věrný, můj [liege.GetTitleAsNameNoTooltip]."
 cid.0001.a.flavor: "#EMP A tak šel věrný šampion do vyhnanství.#!"
 cid.0001.b: "Ať tak bude. Ti, kdo mě milují, půjdou za mnou."
 cid.0001.b.flavor: "#EMP Tehdy můj Cid poznal, že nezbyla žádná naděje na milost [liege.Custom('CZ_TitleAsNameNoTooltip_G')] [liege.Custom('CZ_FirstNameNoTooltip_G')].#!"
 story_el_cid_tt: "#EMP Píseň o El Cidovi#! začíná"
 cid_exile_title: "Vyhnanství:"
 cid.1000.t: "$cid_exile_title$ Zavřené dveře"
 cid.1000.desc: "Temná je noc a chladno. Posílám jednoho ze svých mužů zaklepat na nejbližší dveře, hledaje laskavého hostitele.\n\nOdpověď nepřichází hned. Slyším mumlání a kroky, až se postava konečně objeví ve vchodu.\n\n„Je to rozkaz [liege.GetTitleAsNameNoTooltip]; nemáme odvahu tě přivítat, ó můj pane! Pečetí [Select_CString(liege.IsFemale,'její','jeho')] královského pečeti přišlo [Select_CString(liege.IsFemale,'její','jeho')] psaní, které zakazuje lidu [CZProvNameNoTooltip(ROOT.Char.GetCurrentLocation,'G')] otvírat dveře nebo tě ukrývat.“\n\n[liege.GetTitledFirstName|U] neotálí."
 cid.1000.a: "Nebudeme tyto chudé lidi tlačit."
 cid.1000.a.flavor: "#EMP Naše zboží, naše domovy, i naše oči — o to jde.#!"
 cid.1000.b: "„Otevři dveře, nebo budou vyraženy!“"
 cid.1000.b.flavor: "#EMP Malý z toho bude tvůj užitek, ačkoli kvůli tobě potkáme zkázu.#!"
 cid_opened_doors_modifier: "Otevřené dveře"
 cid_opened_doors_modifier_desc: "Tato postava nechala vyrazit dveře selské chudiny, aby zajistila úkryt pro své následovníky."
 cid.1010.t: "$cid_exile_title$ Žádné zlato ani stříbro"
 cid.1010.desc: "Vyhnanci sotva dělají spolehlivé pány. Není záruka, že budu schopen platit svým následovníkům, nebo je vůbec nakrmit. Kdo by riskoval bezpečí své rodiny pro zhanobeného muže?\n\nRozhovory v táboře jsou otevřené, jak jen mohou být.\n\nZvednu hlavu a vidím, jak ke mně kráčí [friend.GetTitledFirstName] s chlebem a vínem vlastní výroby:\n\n„Campeadoru, narozený ve šťastnou hodinu, musíme vyrazit, neboť zaplatím za tyto muže a vydobudu si hněv [liege.Custom('CZ_TitledFirstName_G')], protože jsem ti [Select_CString(friend.IsFemale,'sloužila','sloužil')].“"
 cid.1010.a: "„[cook.GetFirstNameNoTooltip|U], uvař #EMP cokoli#!, co najdeš.“"
 cid.1010.b: "„Děkuji ti, můj nejdražší příteli.“"
 cid.1010.b.flavor: "#EMP Pokud budu žít, odplatím ti dvojnásob.#!"
 cid.1010.c: "„Nemohu riskovat hněv [liege.Custom('CZ_TitleAsNameNoTooltip_G')].“"
 cid_1010_no_invite_var_desc: "[Select_CString(GetPlayer.IsFemale,'Vyhostila','Vyhostil')] jsi [Select_CString(recipient.IsFemale,'ji','ho')]: $VALUE|=+0$"
 cid.1020.t: "$cid_exile_title$ Sbohem, miláčku"
 cid.1020.desc.intro: "[spouse.GetFirstName] se vrhne na schody před oltářem a vroucně se modlí, aby mě [spouse.GetFaith.HighGodName] [Select_CString(EqualTo_string(spouse.GetFaith.HighGodHerHis,Localize('CHARACTER_HERHIS_HER')),'ochránila','ochránil')] před zlem.\n\nPřitisknu [Select_CString(spouse.IsFemale,'ji','ho')] k srdci a [Select_CString(spouse.IsFemale,'ona','on')] mi, [Select_CString(spouse.IsFemale,'zdrcená','zdrcený')] žalem, líbá ruku.\n\n„Jen [ROOT.Char.GetFaith.HighGodName] ví, jestli se ještě setkáme,“ říkám. „Tady budeš v bezpečí. Nemohu tě vystavit tomu, co nás čeká"
 cid.0001.desc.children: "mě. Děti... buďte hodné."
 cid.0001.desc.no_children: "mě."
 cid.1020.a: "„[my_priest.GetFirstNameNoTooltip|U], snad by ses za nás nemohl přimluvit?“"
 cid.1020.b: "„Ať je čekání krátké.“"
 cid.1020.b.flavor: "#EMP Jako když je nehet vytržen z masa.#!"
 cid.1020.c: "„Nemohu tě opustit.“"
 cid.1020.c.flavor: ""
 cid_family_good_modifier: "Jako nehet a maso"
 cid_family_good_modifier_desc: "Tato postava odmítla opustit svou rodinu a neposlechla rozkazy svého pána."
 cid.1030.t: "$cid_exile_title$ Ze lásky k [liege.Custom('CZ_TitleAsNameNoTooltip_D')]"
 cid.1030.desc: "Zlato. Stříbro. Drahokamy. Má truhla se konečně plní.\n\nZlaté prsteny, náhrdelníky a korouhve. Ani [liege.GetTitledFirstName] by se za takovou podívanou [Select_CString(liege.IsFemale,'nemusela','nemusel')] stydět.\n\nAle tohle všechno není jen moje. [Select_CString(liege.IsFemale,'Je to stále má lenní paní','Je to stále můj lenní pán')], a tak by [Select_CString(liege.IsFemale,'jí','mu')] měl patřit i díl mého jmění."
 cid.1030.a: "[artifact.GetName] bude pěkným darem."
 cid.1030.b: "Zlato nikdy nezklame."
 cid.1030.c: "Pche! Tohle jsem #EMP vyhrál#!"
 cid.1040.t: "$cid_exile_title$ [ROOT.Char.GetFaith.HighGodName], smiluj se"
 cid.1040.desc: "Některá srdce zatvrdnou a trvá dlouho, než si znovu vzpomenou, co je to něha.\n\nAť dělám, co dělám, srdce [liege.Custom('CZ_TitledFirstName_G')] je mi nedostupné.\n\n„[ROOT.Char.GetFaith.HighGodName],“ začnu a pokleknu před oltářem. Mí muži mě zvědavě obklopí. „Kéž tvá dobrota obměkčí srdce [liege.Custom('CZ_TitledFirstNameNoTooltip_G')] a připomene [Select_CString(liege.IsFemale,'jí','mu')], že mě [Select_CString(liege.IsFemale,'měla ráda','měl rád')].“"
 cid.1040.a: "Náš tábor bude příkladem oddanosti."
 cid.1040.b: "Prosím, [ROOT.Char.GetFaith.HighGodName], doveď [Select_CString(liege.IsFemale,'ji','ho')] zpátky ke světlu."
 cid.1040.c: "Ať [Select_CString(liege.IsFemale,'ji','ho')] pohltí [ROOT.Char.GetFaith.NegativeAfterLife]!"
 cid_own_prayer: "Smiluj se nade mnou"
 cid_own_prayer_desc: "Tato postava se rozhodla zaměřit své modlitby na sebe sama."
 cid_1040_a_tt: "Tato možnost je dostupná díky vašemu $baggage_train_shrine_domicile_building$"
 cid_restoration_title: "Obnova:"
 cid.2000.t: "$cid_restoration_title$ Od lokte dolů"
 cid.2000.desc.intro: "Bitva duní kolem mě. Stín ptáků letících nad armádami houstne.\n\nNení těžké spatřit"
 cid.2000.desc.loser: "[loser.GetTitledFirstName] s erbem na náprsníku. „Do toho,“ pobídnu koně a vyrazím proti [Select_CString(loser.IsFemale,'ní','němu')]. Jediný souboj může všechno ukončit.\n\nPřilbou i kroužkovou košilí až k opasku rozetnu nepřítele vedví."
 cid.2000.desc.fallback: "nepřítele, s jeho erby na náprsním brnění. „Pojď,“ poklepávám na svého koně a vyrážím proti němu. Jeden souboj to může ukončit.\n\nAž k opasku, skrz přilbu a kroužkovou zbroj, rozseknu nepřítele na dvě části."
 cid.2000.desc.outro: "Od lokte dolů kape krev."
 cid.2000.a: "Tento meč! Jaká krása!"
 cid.2000.a.flavor: "#EMP Byla to bitva, byl to den, kdy on ten velký meč získal.#!"
 cid.2000.b: "Pošli posla k [liege.Custom('CZ_ShortUIName_D')]. Tahle kořist patří [Select_CString(liege.IsFemale,'jí','jemu')]."
 cid.2000.b.flavor: "#EMP Chci tě poslat k [liege.Custom('CZ_TitledFirstNameNoTooltip_D')], mému přirozenému pánovi, se sta koňmi z této kořisti, abys [Select_CString(liege.IsFemale,'jí','mu')] políbil ruku za mě.#!"
 cid_2000_liege_tt: "Získává [Concept('artifact','artefakt')|E] „[newly_created_artifact.GetNameNoTooltip]“"
 cid.2001.t: "$cid_restoration_title$ Od statečného mistra"
 cid.2001.desc.intro: "Meč v ruce, krok za krokem, pěšky bojuji o půdu. Déšť zesiluje. Je velmi zima.\n\n"
 cid.2001.desc.loser: "[loser.GetTitledFirstName] kráčí ke mně. „[ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')|U],“ pozdraví mě a já se ukloním. „Na zdvořilosti není čas.“\n\nZnovu a znovu se naše meče střetávají ve vzduchu, až [Select_CString(loser.IsFemale,'jí','mu')] useknu ruku."
 cid.2001.desc.fallback: "Nepřítel pochoduje ke mně. „[ROOT.Char.GetFirstNameNoTooltip|U],“ zdraví mě a já se ukláním zpět. „Není mnoho času na zdvořilosti.“\n\nZase a znovu se naše meče setkávají ve vzduchu, až useknu jeho ruku."
 cid.2001.desc.outro: "Hlasitý výkřik. Meč padá na zem, tančí v bledém lesku."
 cid.2001.desc.outro.tizona: "\n\nHodený společník mé Tizony."
 cid.2001.a: "Před námi je ještě mnoho bitev!"
 cid.2001.a.tt: "Stáváš se vlastníkem artefaktu „[newly_created_artifact.GetName]“"
 cid.2001.a.flavor: "#EMP Nuže, víš, že jsem je vyhrál rytířskou ctí.#!"
 cid.2001.b: "Dar hodný [liege.GetTitleAsNameNoTooltip]."
 cid.2010.t: "$cid_restoration_title$ Příznivá nabídka"
 cid.2010.desc: "S prvním ranním světlem vstoupí do mého stanu herold [liege.Custom('CZ_TitledFirstName_G')].\n\n„Slyšte, všichni přítomní, hrabata i páni!“ ohlásí. „[Select_CString(liege.IsFemale,'Má paní','Můj pán')] [liege.GetTitledFirstNameNoTooltip] má žádost na [ROOT.Char.Custom('CZ_TitledFirstNameNoTooltip_A')]. Kéž [liege.GetFaith.HighGodName] dá, aby to bylo ku prospěchu: žádá ruku [Select_CString(child.IsFemale,'tvé dcery','tvého syna')] [child.Custom('CZ_FirstNameNoTooltip_G')] pro [proposed_spouse.Custom('CZ_TitledFirstName_A')].“\n\nPo tváři mi steče slza. Je to první krok k usmíření?"
 cid.2010.a: "„S velikou radostí přijímám tu poctu!“"
 cid.2010.a.flavor: "#EMP Ve tvých náručích nechávám [Select_CString(child.IsFemale,'svou dceru, zářivou','svého syna, zářivého')] jako slunce.#!"
 cid.2010.b: "„Děkuji, ale [Select_CString(child.IsFemale,'manžela','manželku')] [Select_CString(child.IsFemale,'jí','mu')] najdu [Select_CString(ROOT.Char.IsFemale,'sama','sám')].“"
 cid_refused_betrothal: "Odmítnutý pán"
 cid_refused_betrothal_desc: "Tato postava odmítla nabídku svého pána na zasnoubení svého dítěte a rozhodla se najít partnera sama."
 cid.2020.t: "$cid_restoration_title$ Čestný muž"
 cid.2020.desc: "K mému velkému překvapení mě ve stanu navštíví nový host: [liege.GetTitledFirstName] v doprovodu královské stráže a s úsměvem na tváři.\n\n„Příteli!“ zvolá. „Tys mi vždycky [Select_CString(ROOT.Char.IsFemale,'zůstala věrná','zůstal věrný')], i když jsem tě k své lítosti [Select_CString(liege.IsFemale,'zapudila','zapudil')]. Zde ti odpouštím a od tohoto dne ti v celém svém [liege.GetPrimaryTitle.GetTierAsNameNoTooltip|l] projevuji svou přízeň.“\n\n„[Select_CString(liege.IsFemale,'Má paní','Můj pane')]! [Select_CString(ROOT.Char.IsFemale,'Byla jsem vyhnána a zbavena cti a vše, co mám, jsem získala','Byl jsem vyhnán a zbaven cti a vše, co mám, jsem získal')] tvrdou prací. Kéž vám [ROOT.Char.GetFaith.HighGodName] žehná za vaši milost!“"
 cid.2020.a: "Stálo to za to."
 cid.2020.a.flavor: "#EMP Můj Cid i všichni jeho muži se radovali, když jeho prapor spočinul na vrcholu hradu.#!"
 cid.2020.b: "Nemohu opustit svůj tábor."
 cid.2020.b.flavor: "#EMP Ten z Vivaru se obrátil k mužům a přikázal jim shromáždit kořist, kterou získali.#!"
 cid_2020_b_tt: "Pokračuješ jako [Concept('adventurer','dobrodruh')|E]"
 cid.2020.c: "Je čas se rozejít."
 cid_treason_title: "Zrada:"
 cid.4000.opening: "Nestálému [ROOT.Char.GetFirstNameNoTooltip],"
 cid.4000.desc: "Tvůj nedostatek oddanosti mě udivuje. Pokud bylo tvým záměrem zůstat mi věrný, selhal jsi; pokud jsi zamýšlel projevit nespokojenost — také jsi selhal.\n\nZapomeňme na tato neštěstí."
 cid.4000.a: "Učiňme to."
 cid.4010.t: "$cid_restoration_title$ Mio Cid"
 cid.4010.desc: "Ostré zaklepání na dveře ohlásí příchod [herald.Custom('CZ_TitledFirstName_G')].\n\n„Proboha, [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')], [Select_CString(ROOT.Char.IsFemale,'musela','musel')] jsi to všechno tak komplikovat?“\n\n„[Select_CString(ROOT.Char.IsFemale,'Nezačala','Nezačal')] jsem s tím já,“ odpovím co nejpřísněji. „Kdyby [liege.GetTitleAsNameNoTooltip|l] [Select_CString(liege.IsFemale,'chtěla','chtěl')], abych [Select_CString(ROOT.Char.IsFemale,'zůstala věrná','zůstal věrný')], [Select_CString(liege.IsFemale,'neměla','neměl')] mě vyhánět.“\n\n„Žádnou věrnost [Select_CString(liege.IsFemale,'jí','mu')] už nedlužím, protože už [Select_CString(liege.IsFemale,'není mou právoplatnou paní','není mým právoplatným pánem')]. Klidně [Select_CString(liege.IsFemale,'jí','mu')] to vyřiď.“"
 cid.4010.a: "„Získal jsem svá vlastní území.“"
 cid.4010.a.flavor: "#EMP Devět měsíců ho obléhal, a když přišel desátý, museli se vzdát.#!"
 cid.4010.b: "„Cesta mě volá.“"
 cid.4010.b.flavor: "#EMP A zde máte příběh mého Cida Campeadora.#!"
 cid.4010.c: "„Stále budu respektovat [Select_CString(liege.IsFemale,'její','jeho')] právoplatnou vládu.“"
 cid.4010.c.flavor: "#EMP Pro lásku k [liege.Custom('CZ_TitledFirstNameNoTooltip_D')], který mě vyhnal.#!"
 cid.5000.opening: "[sender.Custom2('AppropriateGreeting', ROOT.Char)],"
 cid.5000.desc: "Slovo pro tebe, [Select_CString(ROOT.Char.IsFemale,'má dobrá paní','můj dobrý pane')]: tvůj právoplatný pán, [ROOT.Char.MakeScope.Var('cid_liege').GetCharacter.GetTitledFirstName], [Select_CString(ROOT.Char.MakeScope.Var('cid_liege').GetCharacter.IsFemale,'zemřela','zemřel')].\n\nZáležitosti, které jsi měl s [Select_CString(ROOT.Char.MakeScope.Var('cid_liege').GetCharacter.IsFemale,'ní','ním')], pro mě nemají žádný význam."
 cid.5000.a: "Myslím, tím je to rozhodnuto."
 story_el_cid: "[Concept( 'story_content_el_cid', 'Píseň o Cidovi' )|E]"
 story_el_cid_desc: "Po válce s Alfonsem VI. tě tvůj přítel a lenní pán Sancho II. Kastilský nespravedlivě vyhostil. Nyní se vydáváš vstříc své legendě. Půjdeš si vlastní cestou, nebo zůstaneš věrný?"
 CID_LIEGE: "Tvůj neformální lenní pán"
 EL_CID_CUSTOM_STRING_KEY: "Během svých cest budeš mít možnost prokázat svou [Concept( 'cid_loyalty', 'věrnost' )|E] vůči [Story.MakeScope.Var('cid_liege').Char.Custom('CZ_ShortUIName_D')], [Select_CString(Story.MakeScope.Var('cid_liege').Char.IsFemale,'která','který')] ti nakonec může nabídnout pozemky jako [Concept('vassal','vazal')|E].\n\nMůžeš si také vydobýt vlastní cestu zapojením se do [Concept('wars','válek')|E] v [GetGeographicalRegion('world_europe_west_iberia').GetName]. To tě může odměnit tvými historickými meči a může ti to nabídnout alternativní možnost získat území."
 EL_LOYALTY_COUNTER_TOOLTIP: "Aktuální hodnota [Concept( 'cid_loyalty', 'věrnosti' )|E]: [Story.MakeScope.Var('cid_loyalty_counter').GetValue|V0]"
 cid_loyalty_counter_label: "[Concept( 'cid_loyalty', 'Věrnost' )|E]"
 CID_LOYALTY_MIN_LABEL: "#difficulty_hard Neloajální#!"
 CID_LOYALTY_MAX_LABEL: "#difficulty_easy Loajální#!"
