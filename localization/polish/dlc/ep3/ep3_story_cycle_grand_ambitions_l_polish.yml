l_polish:
 grand_ambitions_header: "Velké ambice"
 grand_ambitions.0001.t: "$grand_ambitions_header$"
 grand_ambitions.0001.desc: "Jako hlava jedné z nejmocnějších rodin [CZPrepV(ROOT.Char.GetLiege.GetPrimaryTitle.GetNameNoTierNoTooltip)] [ROOT.Char.GetLiege.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_L')] sahá můj vliv daleko a široko, mé pokladny jsou hluboké a má ambice — bezbřehá.\n\n[target_char.GetTitledFirstName|U] není hoden trůnu, pouhý nit v [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l] velkolepém tapisérii. Podpořen vážením domu [ROOT.Char.GetHouse.GetName] jsem dobře vybaven obnovit slávu našeho velkého impéria.\n\nMé činy budou formovat nejen budoucnost mého rodu, ale ozvou se i v análech dějin."
 grand_ambitions.0001.a: "Ať osud [target_char.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] kovem znovu vykovaný!"
 grand_ambitions.0001.a.flavor: "Shromáždím celé impérium k mé věci, neboť [target_char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] vyžaduje vládce ctnosti a síly!"
 grand_ambitions.0001.b: "Tichá intrika svrhne [target_char.GetTitleAsNameNoTooltip], nikoli válka."
 grand_ambitions.0001.b.flavor: "[target_char.GetTitleAsNameNoTooltip] padne nikoli mečem, ale tisíci šepoty zrádcovství."
 grand_ambitions.0001.b.toast: "Zahájena intrika Sesazení"
 grand_ambitions.0001.c: "Není ten správný čas..."
 grand_ambitions_start_depose_scheme_tt: "Zahajuje [GetScheme('depose').GetTypeName] [Concept('scheme','intriku')|E] proti [THIS.Char.GetTopLiege.Custom('CZ_ShortUIName_D')] s [GetModifier('scheme_grand_ambitions_modifier').GetNameWithTooltip]"
 grand_ambitions.0100.powerful_family_joins_faction: "[powerful_family_head.GetTitledFirstName] přísahá, že se připojí k tvé [Concept('claimant_faction','frakci pretendenta')|E]"
 grand_ambitions.0100.t: "$grand_ambitions_header$: Odvážný návrh"
 grand_ambitions.0100.intro: "Klid mé pracovny přeruší [Select_CString(interlocutor.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMe', interlocutor )|l] [interlocutor.GetFirstName] s čerstvým listem. „Nabídka zpoza hranic [ROOT.Char.GetTopLiege.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')],“ oznámí.\n\n"
 grand_ambitions.0100.claim: "Pečeť dopisu nese znamení domu [foreign_ruler.GetDynastyHouseName]. Slova uvnitř předkládají odvážnou nabídku: aliance proti [target_char.Custom('CZ_TitleAsName_D')], podmíněná postoupením [foreign_claim.Custom('CZ_LandedName_G')]. Žádost svým drzým charakterem odpovídá pouze potenciálu, který nabízí.\n\n"
 grand_ambitions.0100.conclusion: "Tato nabídka je dvousečná čepel: jedna prořízne mou cestu k vítězství, druhá zraní [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip|l] stejně hluboko."
 grand_ambitions.0100.a: "[ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip|l] musí činit oběti."
 grand_ambitions.0100.a.claim: "Souhlasíte postoupit [foreign_ruler.Custom('CZ_TitledFirstName_D')] [foreign_claim.Custom('CZ_LandedName_A')] při svém nástupu na trůn"
 grand_ambitions.0100.a.faction_tooltip: "V budoucí [Concept('civil_war','občanské válce')|E] proti [THIS.Char.GetTopLiege.Custom('CZ_TitledFirstName_D')] budeš moci povolat [foreign_ruler.Custom('CZ_TitledFirstName_A')] jako spojence"
 grand_ambitions.0100.b: "Kompromis – co třeba [compromise_county.Custom('CZ_LandedNameNoTooltip_A')]?"
 grand_ambitions.0100.b.success: "[foreign_ruler.GetTitledFirstName] přijímá tvůj protinávrh"
 grand_ambitions.0100.b.success.tt: "Slibujete udělit [compromise_county.Custom('CZ_LandedName_A')] [foreign_ruler.Custom('CZ_Name_D')] při svém nástupu na trůn"
 grand_ambitions.0100.b.failure: "[foreign_ruler.GetTitledFirstName] odmítá tvůj protinávrh"
 grand_ambitions.0100.c: "Neprodám kosti svého [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip|l]!"
 grand_ambitions.0110.t: "$grand_ambitions_header$: Volání k zbraním"
 grand_ambitions.0110.desc: "[Select_CString(interlocutor.IsFemale,'Má','Můj')] [ROOT.Char.Custom2( 'RelationToMe', interlocutor )|l] [interlocutor.GetFirstName] hlásí: „K naší věci se přidávají bohatí mecenáši a vojáci, kteří už mají dost vlády [target_char.Custom('CZ_TitleAsNameNoTooltip_G')], se k nám chystají přidat.“\n\nTento příval podpory, od pokladen spojenců až po srdce nejstatečnějších bojovníků [target_char.Custom('CZ_TitleAsNameNoTooltip_G')], znamená zlom. Naše řady porostou a naše prostředky se rozmnoží. Tento okamžik nejen dokazuje spravedlnost mé věci, ale je i jasným znamením: čas války se blíží."
 grand_ambitions.0110.a: "Nasadíme ty vojáky do práce."
 grand_ambitions.0110.b: "S tímto přílivem zlata můžeme dotovat nábor."
 grand_ambitions.0110.c: "Nedovolím, aby se k mé věci přidal první lůzr!"
 grand_ambitions.0120.t: "$grand_ambitions_header$: Pevné základy"
 grand_ambitions.0120.desc: "Zatímco se mým panstvím nese šepot vzpoury, krutá skutečnost blížícího se střetu s císařem vrhá na naše přípravy stín. Rozhodující bude skutečná síla obrany a zásob našeho sídla ([estate.GetName]).\n\n[Select_CString(interlocutor.IsFemale,'Má','Můj')] [ROOT.Char.Custom2( 'RelationToMe', interlocutor )|l] [interlocutor.GetFirstName] mi předloží plány, jak upevnit základy mé moci. „Teď je čas sídlo opevnit,“ naléhá a ukazuje na místa navržená ke stavbě."
 grand_ambitions.0120.a: "Moji [maa_flavor.GetNameNoTooltip|l] potřebují pořádné místo k shromáždění."
 grand_ambitions.0120.b: "Pastviny zajistí dobře vykrmené koně pro [maa_flavor.GetNameNoTooltip|l]."
 grand_ambitions.0120.c: "Strážní věž určitě zlepší mé [maa_flavor.GetNameNoTooltip|l]."
 grand_ambitions.0120.d: "Najměte všechny dělníky, které najdete — je mnoho práce!"
 grand_ambitions.0130.t: "$grand_ambitions_header$: Šepoty ve větru"
 grand_ambitions.0130.desc.intro: "[Select_CString(interlocutor.IsFemale,'Má','Můj')] [ROOT.Char.Custom2( 'RelationToMe', interlocutor )] [interlocutor.GetFirstName] přichází s návrhem, jak dále rozšířit můj plán proti [target_char.Custom('CZ_TitledFirstName_D')].\n\n"
 grand_ambitions.0130.desc.legitimacy.6: "„Lid svého [target_char.Custom('CZ_TitleAsNameNoTooltip_A')] miluje,“ začne, „ale láska je křehká a podezíravá. S dostatkem úsilí se dá proměnit ve strach ze zrady a odtud v nenávist.“"
 grand_ambitions.0130.desc.legitimacy.5: "„Lid svého [target_char.Custom('CZ_TitleAsNameNoTooltip_A')] oslavuje,“ začne, „ale kolik z nich by za [Select_CString(target_char.IsFemale,'ni','něj')] nastavilo krk? Správná slova do správných uší a pár grošů navíc na ceně chleba dovedou dav vždycky k šílenství.“"
 grand_ambitions.0130.desc.legitimacy.4: "„Lid pevně věří v [target_char.Custom('CZ_TitleAsNameNoTooltip_A')],“ začne, „nebo si to aspoň myslí. Dav je vrtkavý. S dostatkem úsilí se jeho věrnost dá koupit, byť jen na jednu noc.“"
 grand_ambitions.0130.desc.legitimacy.3: "„Víra lidu v [target_char.Custom('CZ_TitleAsNameNoTooltip_A')] není neotřesitelná,“ začne. „Nebylo by potřeba #EMP tolik#!, abychom [Select_CString(target_char.IsFemale,'ji','ho')] podkopali a dav [Select_CString(target_char.IsFemale,'ji','ho')] stáhl do moře nenávisti.“"
 grand_ambitions.0130.desc.legitimacy.2: "„Víra lidu v [target_char.Custom('CZ_TitleAsNameNoTooltip_A')] slábne,“ začne. „Stačí jediný závan a z jisker nespokojenosti se rozhoří plamen.“"
 grand_ambitions.0130.desc.legitimacy.1: "„Lid nemá ve [Select_CString(target_char.IsFemale,'falešnou','falešného')] [target_char.Custom('CZ_TitleAsNameNoTooltip_A')] ani špetku víry,“ začne. „Jeho zuřivost je mocná, ale nemá směr. Stačí ji jen nepatrně nasměrovat.“"
 grand_ambitions.0130.desc.outro: "\n\n„Názor [target_char.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] může svrhnout [target_char.GetTitleAsNameNoTooltip] stejně lehce, jako ho učiní. A už se to stalo...“"
 grand_ambitions.0130.a: "Povoláme si pár služeb."
 grand_ambitions.0130.b: "Ať naše šepoty naberou křídla!"
 grand_ambitions.0130.b.success: "Tvé šeptandy dostanou křídla"
 grand_ambitions.0130.b.failure: "Tvým šeptandám se nepodaří pošpinit pověst [target_char.Custom('CZ_TitleAsName_G')]"
 grand_ambitions.0130.b.crit_failure: "Tvé šeptandy prozradí tvé úmysly [target_char.Custom('CZ_TitleAsName_D')]"
 grand_ambitions.0130.c: "Zlato často povolí jazyky obyčejných lidí..."
 grand_ambitions.0130.d: "Nebudu se uchylovat k #EMP pomluvám#!. Nejsme děti."
 grand_ambitions.0131.opening: "[interlocutor.Custom2( 'AppropriateGreeting', ROOT.Char )]"
 grand_ambitions.0131.desc: "Zdá se, že [CZPrepV(target_char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip)] [target_char.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')] se šíří skandální pomluvy o vás."
 grand_ambitions.0131.desc_secret: "\n\nZjistili jsme, že tyto pomluvy šíří [schemer.GetTitledFirstName], [Select_CString(schemer.IsFemale,'která','který')] usiluje o tvůj trůn pro sebe."
 grand_ambitions.0131.conclusion: "\n\nPokud by tomu nebylo zabráněno, mohl by to být osudný problém..."
 grand_ambitions.0131.a: "Nejsem bez vlastních intrik."
 grand_ambitions.0131.b: "Pomlouvači nejsou mimo můj dosah."
 grand_ambitions.0131.c: "Nebudu se s takovou hloupostí trápit."
 grand_ambitions.0131.d: "Ať je [Select_CString(schemer.IsFemale,'ta','ten')] [schemer.Custom2('InsultAdjective', ROOT.Char)] [schemer.Custom2('InsultNoun', ROOT.Char)] [Select_CString(schemer.IsFemale,'prokleta','proklet')]..."
 grand_ambitions.0140.t: "$grand_ambitions_header$: Spoluvládce [target_gov.GetTitleAsNameNoTooltip]"
 grand_ambitions.0140.desc: "„Řekl jsem, abyste mě nerušili!“ vykřiknu, když se dveře do mé pracovny otevřou. Pod dveřním prahem však stojí nečekaný host: [target_gov.GetFirstName], [target_gov.GetTitleAsNameNoTooltip] [target_gov.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')].\n\n„Omlouvám se za rušení, [ROOT.Char.GetFirstNameNoTooltip], ale [Select_CString(target_gov.IsFemale,'přišla','přišel')] jsem vám nabídnout svou podporu.“"
 grand_ambitions.0140.faction: "Přeji si připojit se k vašemu úsilí o sesazení [target_char.Custom('CZ_TitleAsName_G')].“"
 grand_ambitions.0140.no_faction: "Vím, že si zde [CZPrepV(ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip)] [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')] stahujete moc k sobě, připravujete se sesadit [target_char.GetTitleAsName].„"
 grand_ambitions.0140.a: "Čím více, tím lépe."
 grand_ambitions.0140.b: "Tvou pomoc nepotřebuji."
 grand_ambitions.0150.t: "$grand_ambitions_header$: Další agent"
 grand_ambitions.0150.desc: "[Select_CString(interlocutor.IsFemale,'Má','Můj')] [ROOT.Char.Custom2( 'RelationToMe', interlocutor )|l] [interlocutor.GetFirstName] předstoupí a ve tváři se [Select_CString(interlocutor.IsFemale,'jí','mu')] zračí vážnost našeho podniku. „Plány na sesazení [target_char.Custom('CZ_TitledFirstName_G')] pokračují podle plánu,“ pronese vážně. Každé slovo je zatížené tíhou našeho spiknutí.\n\n„Bez dostatku spojenců na správných místech ale můžeme snadno neuspět. Další agent by nám pomohl zajistit úspěch."
 grand_ambitions.0150.a: "Zručný infiltrátor jistě urychlí náš plán."
 grand_ambitions.0150.b: "Přesuňme kapelu loutek, aby zajistila naši záhadu."
 grand_ambitions.0150.c: "Někdo, kdo bude u dvoru chválit mé ctnosti, by byl moudrý."
 grand_ambitions.0151.t: "$grand_ambitions_header$: Mistr šepotů"
 grand_ambitions.0151.desc: "V šeru podvečera ke mně přistoupí [Select_CString(interlocutor.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMe', interlocutor )|l] [interlocutor.GetFirstName] se šibalským zábleskem v oku.\n\n„Naskytla se jedinečná příležitost,“ zašeptá tak tiše, aby to neslyšely ani zdi. „[GetCourtPositionType( 'chief_eunuch_court_position' ).GetNameNoTooltip|U] u dvora [target.Custom('CZ_TitleAsNameNoTooltip_G')], ten stín, který se tiše pohybuje chodbami moci, by se dal získat pro naši věc. Jeho vliv nemá obdoby a jeho tajemství jsou nesčetná.“\n\n„Mohl by být základním kamenem našeho velkého plánu na přetvoření [ROOT.Char.GetTopLiege.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')].“"
 grand_ambitions.0151.a: "Nechme [Select_CString(eunuch.IsFemale,'její','jeho')] šepoty vést naši věc."
 grand_ambitions.0151.b: "[Select_CString(eunuch.IsFemale,'Její','Jeho')] schopnosti jsou příliš cenné, než abychom je jen vypůjčili."
 ga_0151_b_eunuch_aptitude: "[Concept('aptitude','Způsobilost')|E] [eunuch.Custom('CZ_ShortUIName_G')] pro funkci [GetCourtPositionType( 'chief_eunuch_court_position' ).GetName] je [eunuch.GetCourtPositionAptitude( GetCourtPositionType( 'chief_eunuch_court_position' ) )]"
 grand_ambitions.0151.c: "Existují i jiné způsoby, jak utkat náš plán."
 grand_ambitions.0155.t: "$grand_ambitions_header$: Vytáhnout na ně pomoc"
 grand_ambitions.0155.desc: "[Select_CString(interlocutor.IsFemale,'Má','Můj')] [ROOT.Char.Custom2( 'RelationToMe', interlocutor )] [interlocutor.GetFirstName] přistupuje, [Select_CString(interlocutor.IsFemale,'její','jeho')] tvář skrytá v zamyšlení.\n\n„Náš plán sesadit [target_char.Custom('CZ_TitleAsNameNoTooltip_A')] vyžaduje nového zasvěcence; někoho, kdo obsadí místo [agent_slot.GetName]. [Select_CString(interlocutor.IsFemale,'Identifikovala','Identifikoval')] jsem tři potenciální aktivy, které by mohly převážit misky vah ve náš prospěch,“ říká.\n\nOdstoupí do stínů chodby a nechává před vámi jména, každé tiché slib moci nebo nebezpečí."
 grand_ambitions.0155.a: "[agent_choice_1.GetFirstNameNoTooltip] by jistě pomohl našim snahám."
 grand_ambitions.0155.b: "Možná by byl nejlepší [agent_choice_2.GetFirstNameNoTooltip]."
 grand_ambitions.0155.c: "[agent_choice_3.GetFirstNameNoTooltip] na druhou stranu..."
 grand_ambitions.0155.d: "Žádný z nich není vhodný."
 grand_ambitions.0160.t: "$grand_ambitions_header$: Nitky intrik"
 grand_ambitions.0160.desc: "[Select_CString(interlocutor.IsFemale,'Má','Můj')] [ROOT.Char.Custom2( 'RelationToMe', interlocutor )] [interlocutor.GetFirstName] přistupuje s novinkami o našem plánu sesadit [target_char.GetTitledFirstName]. „Základy naší velké ambice jsou položeny,“ začíná, jeho hlas pevný a jistý.\n\n„Máme spojence vysoko i nízko, každý připraven sehrát svou roli v našem velkém plánu. Komu vložíme svou důvěru?“"
 grand_ambitions.0160.a: "Palácoví úředníci budou klíčoví spojenci."
 grand_ambitions.0160.b: "Obchodníci roznesou naše slova rychle a bezpečně."
 grand_ambitions.0160.c: "Císařští písaři zajistí, že nebudeme prozrazeni."
 grand_ambitions.0170.t: "$grand_ambitions_header$: Mocná aliance"
 grand_ambitions.0170.desc: "[Select_CString(interlocutor.IsFemale,'Má','Můj')] [ROOT.Char.Custom2( 'RelationToMe', interlocutor )|l] [interlocutor.GetFirstName] ke mně přistoupí s tichou naléhavostí.\n\n„Nabídka,“ začne, „od hlavy jednoho z nejvznešenějších rodů [ROOT.Char.GetTopLiege.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')]. Doslechli se o našich záměrech a vidí příležitost ke vzájemnému prospěchu.“ Rozvine svitek a v slabém světle se zlověstně zaleskne pečeť rodu [powerful_house.GetName].\n\n„Jejich podpora by mohla převážit misky vah v náš prospěch. Takové spojenectví ale něco stojí – odměnu, která podle nich odpovídá riziku.“"
 grand_ambitions.0170.a: "Zaplatíme jejich cenu — cokoliv bude třeba."
 grand_ambitions.0170.b: "Svážeme je k nám slibem budoucí odměny."
 grand_ambitions.0170.c: "Spojme naše rody svazkem sňatku."
 grand_ambitions.0170.d: "Má ambice nebude připoutána dluhy."
 grand_ambitions.0180.t: "$grand_ambitions_header$: Vlastní korunovace"
 grand_ambitions.0180.intro_hagia_sofia: "Zde pod rozlehlou, ohromující zlatou kopulí Hagia Sofie,"
 grand_ambitions.0180.desc: "Stojím před [hof.Custom('CZ_TitleAsName_I')], duchovním vůdcem svého lidu. Vzduch je těžký vůní kadidla a tíhou staletí.\n\nZískat [Select_CString(hof.IsFemale,'její','jeho')] přízeň by mému nároku na [target_title.Custom('CZ_LandedName_A')] dodalo nejen legitimitu, ale mohlo by to získat srdce věřících po celé říši. Musí mě korunovat.\n\n[hof.GetTitleAsNameNoTooltip|U] však není jen duchovní postava; dobře ví o světských pletichách, které se odehrávají v [ROOT.Char.GetTopLiege.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_L')]."
 grand_ambitions.0180.a: "„Bylo to božsky předurčeno.“"
 grand_ambitions.0180.a.flavor: "[ROOT.Char.GetFaith.HighGodName] to tak chce a tak to bude."
 grand_ambitions.0180.b: "„Vaše Svatosti, dovolte mi sloužit, jak žádá [ROOT.Char.GetFaith.HighGodName].“"
 grand_ambitions.0180.d.flavor: "#EMP Klekni před mou vůlí, [hof.GetFirstName]!#!"
 grand_ambitions.0180.b.success: "[hof.GetTitledFirstNameNoTooltip] souhlasí, že vás korunuje"
 grand_ambitions.0180.b.success.tt: "Pokud úspěšně sesadíte [target_char.GetTitledFirstName], získáte #P [EmptyScope.ScriptValue('major_legitimacy_gain')]#! [Concept('legitimacy','legitimity')|E]"
 grand_ambitions.0180.b.failure: "[hof.GetTitledFirstNameNoTooltip] odmítá vás korunovat"
 grand_ambitions.0180.c: "I [hof.GetTitleAsNameNoTooltip] může být přesvědčen materiálními prostředky..."
 grand_ambitions.0180.d: "Dokonce i [hof.GetPrimaryTitle.GetNameNoTierNoTooltip] není imunní vůči mému vlivu."
 grand_ambitions.0180.e: "„Ty #EMP budeš#! mě korunovat jako [target.GetTitleAsNameNoTooltip], [hof.GetFirstNameNoTooltip]!“"
 grand_ambitions.0180.f: "Možná se vrátím později."
 grand_ambitions.0190.t: "Měj přátele blízko..."
 grand_ambitions.0190.desc: "„...ale nepřátele ještě blíž,“ dokončí [Select_CString(interlocutor.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', interlocutor)|l] a vylíčí nedávno odhalené pikle, jimiž si [secret_owner.GetTitledFirstName] chce [ROOT.Char.GetPrimaryTitle.GetName] přivlastnit.\n\nTa #EMP drzost#! [Select_CString(secret_owner.IsFemale,'té ženy','toho muže')]! Tohle nemůžu nechat bez odezvy!"
 grand_ambitions.0190.a: "Možná by [Select_CString(secret_owner.IsFemale,'jí','mu')] stačilo místo u stolu..."
 grand_ambitions.0190.a.tt: "Nabízíte pozici [Concept('co_emperor','spolucísaře')|E] [secret_owner.Custom('CZ_ShortUIName_D')]"
 co_emperor_accepts: "#HIGH Přijímá#!"
 co_emperor_rejects: "#HIGH Odmítá#!"
 grand_ambitions.0190.a.tt.1: "[emperor.GetShortUIName|U] vstupuje do [Concept('duumvirate','duumvirátu')|E] s [secret_owner.Custom('CZ_ShortUIName_I')] jako [Concept('co_emperor','spolucísař')|E]"
 grand_ambitions.0190.a.tt.2: "Ukončí [Select_CString(secret_owner.IsFemale,'její','jeho')] spiknutí"
 grand_ambitions.0190.b: "Ať shnije v žaláři!"
 every_family_member_of_secret_owner: "Každý člen rodu [secret_owner.GetTitledFirstName]"
 grand_ambitions.0190.c: "Vše plynou svůj běh v pravý čas."
 grand_ambitions.0191.t: "$grand_ambitions_header$: Osudová nabídka"
 grand_ambitions.0191.desc: "„#EMP [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]!#!“\n\n[interlocutor.GetTitledFirstName|U], [Select_CString(interlocutor.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', interlocutor )|l], vtrhne do mé pracovny a lapá po dechu. „Naskytla se osudová příležitost!“ vyhrkne udýchaně. „[emperor.GetTitledFirstNameRegnal|U] se [Select_CString(emperor.IsFemale,'dozvěděla','dozvěděl')] o vašich plánech zmocnit se trůnu!“\n\n„Ale [Select_CString(emperor.IsFemale,'poslala','poslal')] nabídku: #EMP spoluvládu#!. Přeje si, abyste [Select_CString(ROOT.Char.IsFemale,'zanechala','zanechal')] pletich a [Select_CString(ROOT.Char.IsFemale,'usedla','usedl')] po [Select_CString(emperor.IsFemale,'jejím','jeho')] boku, abyste spolu vládli našemu velkému [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip|l] ze slavného sídla [emperor.GetCapitalLocation.GetBaronyNameExplicitly].“"
 grand_ambitions.0191.a: "#EMP Láka mě to...#!"
 grand_ambitions.0191.a.tt.1: "Stáváš se [Concept('co_emperor',Select_CString(GetPlayer.IsFemale,'spolucísařovnou','spolucísařem'))|E] [emperor.Custom('CZ_ShortUIName_G')]"
 grand_ambitions.0191.a.tt.2: "Ukončíte svá spiknutí"
 grand_ambitions.0191.b: "Nikdy nesdílím moc s tím [emperor.Custom( 'CZ_InsultNoun_I' )]!"
 grand_ambitions.0200.t: "$grand_ambitions_header$: Osudná noc"
 grand_ambitions.0200.opening: "Dnes se samy základy [target.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] chvějí pod váhou domu [ROOT.Char.GetHouse.GetName]. Tichá revoluce sesadila [target.GetTitleAsNameNoTooltip], což značí úsvit nové éry.\n\n"
 grand_ambitions.0200.eunuch: "[GetAgentSlotType( 'agent_eunuch' ).GetName], pán palácových tajemství, sehrál svou roli dokonale. Jeho šepoty zasely semena nesváru, jeho tiché přikývnutí v potemnělých chodbách připravilo krev naší triumf.\n\n"
 grand_ambitions.0200.powerful_family: "Samozřejmě by můj nástup nebyl možný bez podpory rodu [story.MakeScope.Var('powerful_family').House.GetName], "
 grand_ambitions.0200.powerful_family.currency: "který je zjevně za svou cenu roven zlatu."
 grand_ambitions.0200.powerful_family.hook: "ač nerad vzpomínám na dluh, který jim dlužím."
 grand_ambitions.0200.powerful_family.marriage: "s nímž jsem nyní spojen manželstvím."
 grand_ambitions.0200.powerful_family.fallback: "ač nerad to přiznávám."
 grand_ambitions.0200.desc: "Malé akty vzpoury — každé otevřené dveře, každá mylně vedená zpráva — upletly tkaninu našeho triumfu a prokázaly, že síla impéria může být ovládnuta i nejskromnějšími rukami."
 grand_ambitions.0200.conclusion: "\n\nStojíme na prahu nové éry. Zítra impérium nevstane do unaveného starého odkazu, ale do slibu mé vlády.\n\n„Ty, [target.GetFirstName], jsi jen mizející ozvěnou #EMP mého#! impéria!“"
 grand_ambitions.0200.a: "[target.GetPrimaryTitle.GetNameNoTooltip] vzlétne na křídlech rodu [ROOT.Char.GetHouse.GetNameNoTooltip]!"
 grand_ambitions.0201.t: "$grand_ambitions_header$: Cesta k moci"
 grand_ambitions.0201.desc: "„Boží prozřetelnost, jež řídí osudy říší, vyvolila nového panovníka,“ rozléhá se trůnním sálem hlas [ROOT.Char.GetFaith.GetReligiousHead.Custom('CZ_TitledFirstName_G')] se slavnostní vážností, jakou si okamžik žádá.\n\nNaše pohledy se setkají v tichém uznání dohody, která nás k tomuto okamžiku přivedla. „S požehnáním, jež dává [ROOT.Char.GetFaith.HighGodName], tě korunuji: [ROOT.Char.GetName].“\n\nKdyž mi na čelo dosedne tíha koruny, cítím, jak mi na ramena padá plášť staletí. Má cesta k moci možná nebyla obvyklá, ale dovedla mě sem, k tomuto slavnému okamžiku.\n\n"
 grand_ambitions.0201.conc_greek: "„[Glossary( 'Kýrie, eléison', 'KYRIE_ELEISON_GLOSS' )]!“ zvolám sebejistě."
 grand_ambitions.0201.a: "[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitly] čeká."
 grand_ambitions.0202.t: "$grand_ambitions_header$: Osud padlého"
 grand_ambitions.0202.desc: "Před mnou čeká [Select_CString(old_emp.IsFemale,'sesazená','sesazený')] [ROOT.Char.GetTitleAsNameNoTooltip|l] [old_emp.GetFirstNameNoTooltip], aby [Select_CString(old_emp.IsFemale,'poznala','poznal')] svůj osud pod stínem hořícího srdce [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l].\n\nJak se rozhodnu [Select_CString(old_emp.IsFemale,'s ženou','s mužem')] přede mnou naložit, není pouhou záležitostí osobní pomsty či velkorysosti; je to první kámen ve stavbě mého odkazu.\n\nBude to pomsta a kruh násilí, nebo milosrdenství a naděje? Oči dvora, lidu i samotné historie jsou upřeny na mě."
 grand_ambitions.0202.a: "Jdi v pokoji, [old_emp.GetFirstNameNoTooltip]."
 grand_ambitions.0202.a.flavor: "Ať zmizí v noci, daleko od popela své vlády."
 grand_ambitions.0202.b: "Ať nese jizvy svého pádu."
 grand_ambitions.0202.b.flavor: "Přesto bude žít. Najdeme v tom rovnováhu mezi spravedlností a milosrdenstvím a varování všem, jak vysokou cenu má pýcha."
 grand_ambitions.0202.c: "Poznamenejte [Select_CString(old_emp.IsFemale,'ji','ho')] a vyžeňte [Select_CString(old_emp.IsFemale,'ji','ho')] za hradby!"
 grand_ambitions.0202.c.flavor: "Jak [Select_CString(old_emp.IsFemale,'jejím','jeho')] bloudí krajem, tak i [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitly] opustí svou minulost a vydá se hledat novou cestu."
 grand_ambitions.0202.d: "Ještě s tebou neskončím."
 grand_ambitions.0202.d.tt: "[old_emp.GetFirstName] zůstává [Concept('imprisoned','ve vězení')|E] v tvém žaláři"
 grand_ambitions.0250.t: "$grand_ambitions_header$: Konec cesty"
 grand_ambitions.0250.desc: "Místo očekávaného uvítání mě před městskými branami vyhledá [Select_CString(interlocutor.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMe', interlocutor )|l] [interlocutor.GetFirstName].\n\n„Balancovali jsme na ostří nože a zdá se, že jsme spadli na špatnou stranu,“ říká vážně.\n\nHlavní město se svými vysokými stavbami a hlubokými stíny se našimi snahami nijak nezměnilo. [target.GetTitleAsNameNoTooltip|U] zůstává na trůnu a možná ani netuší, jak blízko byl vítr změn k tomu, aby se prohnal sídlem [target.GetCapitalLocation.GetBaronyNameExplicitly]."
 grand_ambitions.0250.a: "Cesta k moci se ztemňuje..."
 grand_ambitions.0300.t: "$grand_ambitions_header$: Sklízet, co jsi zasel"
 grand_ambitions.0300.desc: "[foreign_ruler.GetTitledFirstName|U] stojí přede mnou, [Select_CString(ROOT.Char.IsFemale,'nově korunovanou','nově korunovaným')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_I')] [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')]. A částečně je to i díky [Select_CString(foreign_ruler.IsFemale,'její','jeho')] podpoře...\n\nA tak si [Select_CString(foreign_ruler.IsFemale,'přišla','přišel')] vybrat, co [Select_CString(foreign_ruler.IsFemale,'jí','mu')] bylo slíbeno: [demand.GetName]."
 grand_ambitions.0300.a: "Držím, co slíbím. [demand.GetNameNoTierNoTooltip|U] je tvé."
 grand_ambitions.0300.b: "Mám něco mnohem většího, co nabídnout..."
 grand_ambitions.0300.b.success: "[foreign_ruler.GetTitledFirstName|U] je přesvědčen"
 grand_ambitions.0300.b.failure: "[foreign_ruler.GetTitledFirstName|U] není přesvědčen"
 grand_ambitions.0300.c: "Tvoje naivita je kouzelná."
 grand_ambitions_ally_joins_war: "Spojenec vstupuje do války: [joiner.GetTitledFirstName]"
 grand_ambitions.0500.opening: "[interlocutor.Custom2('AppropriateGreeting', ROOT.Char)]"
 grand_ambitions.0500.dead: "Mám tu čest oznámit, že [story.MakeScope.Var('target_char').Char.GetTitledFirstName] je mrtvý. Měli bychom pokračovat v plánech svrhnout [ROOT.Char.GetTopLiege.GetTitledFirstName]?"
 grand_ambitions.0500.wrong_title: "Mám tu čest oznámit, že [previous_story_target.GetTitledFirstName] už nezastává [story.Var('target_title').GetName]. Měli bychom pokračovat v plánech svrhnout [ROOT.Char.GetTopLiege.GetTitledFirstName]?"
 grand_ambitions.0500.a: "Nebudu odpočívat, dokud #EMP nebudu [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip]!#!"
 grand_ambitions.0500.b: "Ukončete přípravy. Radujme se!"
 grand_ambitions.0500.b.tt: "Upouštíte od snahy [Concept('depose','sesadit')|E] [THIS.Char.GetTopLiege.Custom('CZ_TitleAsName_A')]"
 ep3_grand_ambitions_cheaper_maa_modifier: "Najímání zklamaných vojáků"
 ep3_grand_ambitions_local_labor_modifier: "Místní pracovní síla"
 ep3_grand_ambitions_rioting_county_modifier: "Císařské pověsti"
 ep3_grand_ambitions_hushed_rumors: "Šeptané pověsti"
 scheme_grand_ambitions_modifier: "Velké ambice"
 scheme_grand_ambitions_modifier_desc: "Tato postava má oči upřené na velmi velký cíl."
 scheme_grand_ambitions_bribed_functionaries_modifier: "Uplacení úředníci"
 scheme_grand_ambitions_bribed_functionaries_modifier_desc: "Úředníci v císařském paláci, zklamaní současnou vládou, diskrétně vytvářejí spojenectví, připravují půdu pro bezproblémové předání moci."
 scheme_grand_ambitions_bribed_merchants_modifier: "Uplacení obchodníci"
 scheme_grand_ambitions_bribed_merchants_modifier_desc: "Obchodníci a námořníci, loajální k věci, přenášejí zprávy napříč impériem, zajišťují rychlou a bezpečnou komunikaci."
 scheme_grand_ambitions_bribed_scribes_modifier: "Uplacení písaři"
 scheme_grand_ambitions_bribed_scribes_modifier_desc: "Císařští písaři, kteří mají na starosti tajemství [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l], nenápadně upravují komunikace a tím zahalují průběh intriky před bdělýma očima."
 scheme_grand_ambitions_embezzling_modifier: "Zpronevěra"
 scheme_grand_ambitions_powerful_family_modifier: "Aliance s mocnou rodinou"
 scheme_grand_ambitions_powerful_family_modifier_desc: "Aliance s jiným mocným rodem v říši posunula tuto intriku na rychlou cestu k úspěchu."
