l_polish:
 ep3_travel_events.8000.t: "Patřit někam"
 ep3_travel_events.8000.desc.intro: "Od té osudové schůzky [CZPrepV(location.GetNameNoTooltip)] [CZProvName(location,'L')] jsou moje drahá [ROOT.Char.Custom2('RelationToMeShort', romantic_child)] [romantic_child.GetName] a [prospective_prince.GetName] naprosto neoddělitelná. [prince_parent.GetTitleAsNamePossessiveNoTooltip|U] [prospective_prince.Custom('GetDaughterSon')] je úplně opojený zamilovaností. Okouzlující svádění k vidění, ale musíme pokračovat dál a brzy budou odděleni.\n\n„Ach, [Select_CString(ROOT.Char.IsFemale,'matko','otče')],"
 ep3_travel_events.8000.desc.mid2.bold_child: "Mám už dost cestování. Chci tu zůstat s [prospective_prince.GetNameNoTooltip]!„"
 ep3_travel_events.8000.desc.mid2.timid_child: "Mám pocit, že už nikdy nepotkám [Select_CString(prospective_prince.IsFemale,'jinou ženu, jako je ona','jiného muže, jako je on')]. Myslíš, že bychom se jednou mohli usadit a zapustit vlastní kořeny?“"
 ep3_travel_events.8000.outro.dislikes_child: "\n\nTo může být má jediná příležitost zbavit se toho parazita jednou provždy."
 ep3_travel_events.8000.outro: "\n\nVidím, jak se [Select_CString(romantic_child.IsFemale,'jí','mu')] ve tváři zračí úzkost, a nemohu se ubránit otázce, zda [Select_CString(romantic_child.IsFemale,'její','jeho')] místo je ještě opravdu se mnou."
 ep3_travel_events.8000.a: "„Tvé místo je u [prospective_prince.Custom('CZ_FirstNameNoTooltip_G')], ne u pitomého starého [ROOT.Char.Custom('CZ_InsultNoun_G')] jako já.“"
 ep3_travel_events.8000.b: "„[prospective_prince.GetFirstNameNoTooltip|U] se prostě může přidat k nám!“"
 ep3_travel_events.8000.c: "„Tak pojď, [romantic_child.GetFirstNameNoTooltip].“"
 ep3_travel_events.8001.t: "Vlastní kořeny"
 ep3_travel_events.8001.desc: "[prospective_prince.Custom2('MyCharacterIntroduction', ROOT.Char )|U] se vrací z procházky ruku v ruce s [Select_CString(romantic_child.IsFemale,'neznámou mladou ženou','neznámým mladým mužem')]. Ta bytost je zjevně zanedbaná a unavená z cesty a [Select_CString(romantic_child.IsFemale,'její','jeho')] skromný oděv je samé bláto.\n\n„[Select_CString(ROOT.Char.IsFemale,'Matko','Otče')]! Tohle je [romantic_child.GetFirstName], [romantic_child.Custom('GetDaughterSon')] slavného dobrodruha [laamp.GetName]. A také [Select_CString(romantic_child.IsFemale,'žena','muž')], do [Select_CString(romantic_child.IsFemale,'které','kterého')] jsem se [Select_CString(prospective_prince.IsFemale,'zamilovala','zamiloval')]. Jestli nám dáš požehnání, vezmeme se!“"
 ep3_travel_events.8001.a: "„Máš moje požehnání.“"
 ep3_travel_events.8001.b: "„Rozhodně ne!“"
 ep3_travel_events.8002.t: "V jiné době"
 ep3_travel_events.8002.desc: "Právě když máme sbalené poslední zásoby a chystáme se znovu vydat na nekonečnou cestu, zastaví mě zoufalé volání [Select_CString(romantic_child.IsFemale,'mé dcery','mého syna')]. Když ke mně konečně doběhne, pevně mě obejme. Zdá se, že [prince_parent.GetName] tomuto svazku [Select_CString(prince_parent.IsFemale,'nepožehnala','nepožehnal')], a tak se [romantic_child.GetName] vrací, aby se ke mně na cestách znovu [Select_CString(romantic_child.IsFemale,'přidala','přidal')]."
 ep3_travel_events.8002.a: "„No tak, no tak.“"
 ep3_travel_events.8010.t: "Nebude chybět"
 ep3_travel_events.8010.desc: "Když pokračujeme přes [CZProvName(location,'A')], upoutá mé oko bohatě vyzdobená hrobka uprostřed sítí obyčejných hrobů. Hrobka vypadá, že je prasklá, a hned v jejím ústí zahlédnu záři nějakého neznámého pokladu.\n\nNikdo kromě naší družiny se nezdá být poblíž, a jistě ten, kdo kdysi vlastnil obsah této hrobky, by mi nekladl za vinu, kdybych si [Select_CString(ROOT.Char.IsFemale,'vzala','vzal')] to, co by jinak zůstalo nevyužité?"
 ep3_travel_events.8010.a: "Určitě si toho nikdo nevšimne."
 ep3_travel_events.8010.a.win: "Beze zbytku ukradnete několik hrobových předmětů"
 ep3_travel_events.8010.a.lose: "Tvou družinu přistihnou"
 ep3_travel_events.8010.b: "Nebudu hanobit mrtvé!"
 soulmate_laamp_adventure: "[CHARACTER.GetShortUIName|U] se na dobrodružství náhodně [Select_CString(CHARACTER.IsFemale,'setkala','setkal')] s [TARGET_CHARACTER.Custom('CZ_ShortUIName_I')] a hluboce se do něj/ní [Select_CString(TARGET_CHARACTER.IsFemale,'zamilovala','zamiloval')]."
 soulmate_laamp_adventure_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] se na dobrodružství náhodně [Select_CString(TARGET_CHARACTER.IsFemale,'setkala','setkal')] s [CHARACTER.Custom('CZ_ShortUIName_I')] a hluboce se do něj/ní [Select_CString(CHARACTER.IsFemale,'zamilovala','zamiloval')]."
 friend_let_me_go: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'dovolila','dovolil')] [CHARACTER.GetShortUIName] odejít a hledat romanci."
 friend_let_me_go_corresponding: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'dovolila','dovolil')] [TARGET_CHARACTER.GetShortUIName] odejít a hledat romanci."
 rival_laamp_stole_my_child: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'přemluvila','přemluvil')] dítě [CHARACTER.Custom('CZ_ShortUIName_G')], aby opustilo dvůr a stalo se dobrodruhem."
 rival_laamp_stole_my_child_corresponding: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'přemluvila','přemluvil')] dítě [TARGET_CHARACTER.Custom('CZ_ShortUIName_G')], aby opustilo dvůr a stalo se dobrodruhem."
 graverobber_opinion: "Lupič hrobů"
 laamp_claimant_opinion: "Nárok na můj titul"
