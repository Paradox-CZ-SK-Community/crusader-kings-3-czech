 ACHIEVEMENT_DESC_canute_the_greater_achievement: "Jako nereformovaný [Concept('tribal','kmenový')|E] vládce přijmi [Concept('decision','rozhodnutí')|E] $secure_high_kingdom_north_sea_decision$"
 ACHIEVEMENT_DESC_king_of_all_the_isles_achievement: "Začni a zůstaň postavou, která je „$north_germanic_group|l$“ a zároveň je „$norse_pagan_adherent|l$“, [Concept('completely_control','zcela ovládej')|E] celý [Concept('region','region')|E] [GetGeographicalRegion('dlc_fp1_achievement_king_of_all_the_isles').GetName], aniž by tvá [Concept('realm_size','velikost panství')|E] #EMP kdykoli#! přesáhla 80"
 ACHIEVEMENT_DESC_faster_than_the_fox_achievement: "Začni a zůstaň postavou, která je „$north_germanic_group|l$“ a zároveň je „$norse_pagan_adherent|l$“ a před rokem 1047 [Concept('completely_control','zcela ovládej')|E] [Concept('kingdom','království')|E] $k_sicily$. $rd_character_blocked_from_achievement$"
