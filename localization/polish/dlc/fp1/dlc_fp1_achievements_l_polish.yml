 ACHIEVEMENT_DESC_vladimirs_second_choice_achievement: "Začni jako postava, která je „$north_germanic_group|l$“ a zároveň je „$norse_pagan_adherent|l$“, přestup na libovolnou islámskou [Concept('faith','víru')|E] a obrať celý [Concept('region','region')|E] [GetGeographicalRegion('dlc_fp1_achievement_vladimirs_second_choice').GetName] na libovolnou islámskou [Concept('faith','víru')|E]"
