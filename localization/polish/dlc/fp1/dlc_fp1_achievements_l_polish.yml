 ACHIEVEMENT_DESC_first_of_the_crusader_kings_achievement: "Začněte jako $north_germanic_group$ jakéhokoli druhu a zúčastněte se okamžitě jako útočník v první katolické křížové výpravě"
 ACHIEVEMENT_DESC_vladimirs_second_choice_achievement: "Začněte jako $north_germanic_group$ $norse_pagan_adherent$ jakéhokoli druhu, přijměte kteroukoliv islámskou [Concept('faith','víru')|E] a obraťte celou [GetGeographicalRegion('dlc_fp1_achievement_vladimirs_second_choice').GetName] [Concept('region','region')|E] na jakoukoli islámskou víru" # todo: CONCEPT CASE
