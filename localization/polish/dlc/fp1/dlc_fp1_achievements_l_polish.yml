 ACHIEVEMENT_DESC_far_from_home_achievement: "Začněte a zůstaňte jako $north_germanic_group$ $norse_pagan_adherent$ jakéhokoli druhu, mějte své [Concept('realm_capital','hlavní sídlo panství')|E] v kterékoli z [GetGeographicalRegion('dlc_fp1_achievement_far_from_home').GetName] [Concept('region','regionu')|E]. $rd_character_blocked_from_achievement$" # todo: CONCEPT CASE
 ACHIEVEMENT_DESC_miklagardariki_achievement: "Začněte a zůstaňte jako $north_germanic_group$ $norse_pagan_adherent$ jakéhokoli druhu, [Concept('completely_control','zcela ovládat')|E] [Concept('kingdom','království')|E] $k_thessalonika$ a vlastněte jakékoli [Concept('empire','říše')|E] bez toho, abyste vlastnili $e_byzantium$. $rd_character_blocked_from_achievement$" # todo: CONCEPT CASE
 ACHIEVEMENT_DESC_canute_the_greater_achievement: "Jako [Concept('tribal','kmenový')|E] bez reformy, přijměte $secure_high_kingdom_north_sea_decision$ [Concept('decision','rozhodnutí')|E]" # todo: CONCEPT CASE
 ACHIEVEMENT_DESC_king_of_all_the_isles_achievement: "Začněte a zůstaňte jako $north_germanic_group$ $norse_pagan_adherent$ jakéhokoli druhu, [Concept('completely_control','zcela ovládat')|E] vše v [GetGeographicalRegion('dlc_fp1_achievement_king_of_all_the_isles').GetName] [Concept('region','regionu')|E], aniž by #EMP ever#! měl více než 80 [Concept('realm_size','velikost panství')|E]" # todo: CONCEPT CASE
 ACHIEVEMENT_DESC_faster_than_the_fox_achievement: "Začněte a zůstaňte jako $north_germanic_group$ $norse_pagan_adherent$ jakéhokoli druhu, [Concept('completely_control','zcela ovládat')|E] [Concept('kingdom','království')|E] $k_sicily$ před rokem 1047. $rd_character_blocked_from_achievement$" # todo: CONCEPT CASE
 ACHIEVEMENT_DESC_volva_achievement: "Začněte a zůstaňte jako $north_germanic_group$ $norse_pagan_adherent$ jakéhokoli druhu, přijměte $found_witch_coven_decision$ [Concept('decision','rozhodnutí')|E]" # todo: CONCEPT CASE
