 unlocks_authority_cooldown_breaking: "[Concept('characters','Postavy')|E] mohou za vysokou cenu [Concept('prestige','prestiže')|E] obejít čekací doby [Concept('crown_authority','korunní autority')|E] a [Concept('tribal_authority','kmenové autority')|E]"
