 innovation_varangian_adventurers_desc: "Co dlužíme těmto zemím, v nichž žijeme? Nic! Srdcem království jsou jeho lidé, a nezasloužíme si nejlepší půdu, největší poklady, nejhonosnější paláce? Získat je tak jednoduché jako #EMP taking#! je!"
 unlock_varangian_adventurer_cb: "Odemyká [Concept('varangian_adventure','varjažská výprava')|E] [Concept('casus_belli','casus belli')|E] během [Concept('tribal','kmenového')|E] [Concept('era','éry')|E]" # todo: CONCEPT CASE
 innovation_all_things: "Vše-sněm"
 innovation_all_things_desc: "Mezi našimi lidmi panuje silná tradice veřejných shromáždění všech svobodných a plnoprávných dospělých, kde kdokoliv může vznést své stížnosti panovníkovi. Samozřejmě pro ty, kdo v očích prostého lidu mají váhu, může být moc v ovlivňování davu..."
 unlocks_authority_cooldown_breaking: "[Concept('characters','Postavy')|E] mohou ukončit čekací doby u [Concept('crown_authority','korunní autority')|E] a [Concept('tribal_authority','kmenová autorita')|E] za vysokou cenu [Concept('prestige','prestiž')|E]" # todo: CONCEPT CASE
