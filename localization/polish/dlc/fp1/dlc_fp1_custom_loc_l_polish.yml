 SteleCommemoratesAncestors_Witch: "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] byl [second.MakeScope.Var('stele_container').Char.GetWomanMan] podivných sil. $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_CrusaderMonarch: "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] bojoval proti nevěřícím po celý svůj život. $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Chakravarti: "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] byl osou uprostřed světa. $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_GreatestOfKhans: "$SteleCommemoratesAncestors_Intro$. Celý svět se třásl před [Select_CString(second.MakeScope.Var('stele_container').Char.IsFemale,'její','jeho')] kroky a vůlí. $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Paragon: "$SteleCommemoratesAncestors_Intro$. Možná už nikdy neuvidíme dalšího [second.MakeScope.Var('stele_container').Char.GetWomanMan] tak zbožného. $SteleCommemoratesCarver$."
 SteleCommemoratesConquest_Intro: "Postaveno pro [second.MakeScope.Var('stele_commissioner').Char.GetTitledFirstNameNicknamed] na památku [Select_CString(second.MakeScope.Var('stele_commissioner').Char.IsFemale,'její','jeho')] vítězství nad [second.MakeScope.Var('stele_container').Char.GetTitledFirstNameNicknamed]"
 SteleCommemoratesConquest_Bloody: "$SteleCommemoratesConquest_Intro$. Válka patřila k nejkrvavějším v dějinách. $SteleCommemoratesCarver$."
 SteleCommemoratesConquest_Glorious: "$SteleCommemoratesConquest_Intro$. Dobytí bylo slavné. $SteleCommemoratesCarver$."
 SteleCommemoratesConquest_HardFought: "$SteleCommemoratesConquest_Intro$. Válka byla těžce vybojovaná, náročnější než jiné. $SteleCommemoratesCarver$."
 SteleCommemoratesConquest_EmbarrassinglyEasy: "$SteleCommemoratesConquest_Intro$. Boje byly ostudně snadné. $SteleCommemoratesCarver$."
 SteleCommemoratesConquest_OftForgotten: "$SteleCommemoratesConquest_Intro$. Tato válka, navzdory své důležitosti, je často zapomínána. $SteleCommemoratesCarver$."
 SteleCommemoratesPromotion_Intro: "Postaveno pro [second.MakeScope.Var('stele_commissioner').Char.GetTitledFirstNameNicknamed] na památku [Select_CString(second.MakeScope.Var('stele_commissioner').Char.IsFemale,'jejímu','jeho')] nástupu na trůn [second.MakeScope.Var('stele_container').Title.GetNameNoTier]"
 SteleCommemoratesPromotion_Predestined: "$SteleCommemoratesPromotion_Intro$. Mnozí to považují za předurčené. $SteleCommemoratesCarver$."
 SteleCommemoratesPromotion_TrulyWorthy: "$SteleCommemoratesPromotion_Intro$. Jen [second.MakeScope.Var('stele_commissioner').Char.GetSheHe] byla skutečně hodna vládnout. $SteleCommemoratesCarver$."
 SteleCommemoratesPromotion_Magnificent: "$SteleCommemoratesPromotion_Intro$. Ať [Select_CString(second.MakeScope.Var('stele_commissioner').Char.IsFemale,'její','jeho')] velkolepá vláda trvá sto let. $SteleCommemoratesCarver$."
 SteleCommemoratesPromotion_AweInspiring: "$SteleCommemoratesPromotion_Intro$. Obřad vzbuzoval úžas u všech. $SteleCommemoratesCarver$."
 SteleCommemoratesPromotion_Majestic: "$SteleCommemoratesPromotion_Intro$. Málokterý vládce se může rovnat [Select_CString(second.MakeScope.Var('stele_commissioner').Char.IsFemale,'její','jeho')] velkoleposti. $SteleCommemoratesCarver$."
