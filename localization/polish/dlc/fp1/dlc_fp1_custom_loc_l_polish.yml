 SteleCommemoratesAncestors_Shieldmaiden: "$SteleCommemoratesAncestors_Intro$. Mnozí, kdo [Select_CString(second.MakeScope.Var('stele_container').Char.IsFemale,'ji','ho')] podcenili, odešli ze světa dříve než [Select_CString(second.MakeScope.Var('stele_container').Char.IsFemale,'ona','on')]. $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Varangian: "$SteleCommemoratesAncestors_Intro$. [Select_CString(second.MakeScope.Var('stele_container').Char.IsFemale,'Byla oblíbenkyní','Byl oblíbencem')] krále, jehož kultura byla $greek|l$. $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Poet: "$SteleCommemoratesAncestors_Intro$. Se slovy [Select_CString(second.MakeScope.Var('stele_container').Char.IsFemale,'vládla','vládl')] stejně obratně jako jiní mečem. $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Kinslayer: "$SteleCommemoratesAncestors_Intro$. Přes všechny ostatní činy [Select_CString(second.MakeScope.Var('stele_container').Char.IsFemale,'ji','ho')] stále musíme nazývat vrahem vlastní krve. $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Deviant: "$SteleCommemoratesAncestors_Intro$. [Select_CString(second.MakeScope.Var('stele_container').Char.IsFemale,'Její','Jeho')] choutky byly... pestré. $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Cannibal: "$SteleCommemoratesAncestors_Intro$. Na svém dvoře [Select_CString(second.MakeScope.Var('stele_container').Char.IsFemale,'vítala','vítal')] všemožné exotické cizince. $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Incestuous: "$SteleCommemoratesAncestors_Intro$. [Select_CString(second.MakeScope.Var('stele_container').Char.IsFemale,'Proslula','Proslul')] svou oddaností rodině. $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Murderer: "$SteleCommemoratesAncestors_Intro$. Na cestě za svými cíli se [Select_CString(second.MakeScope.Var('stele_container').Char.IsFemale,'nenechala','nenechal')] ničím zastavit. $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Viking: "$SteleCommemoratesAncestors_Intro$. [Select_CString(second.MakeScope.Var('stele_container').Char.IsFemale,'Její','Jeho')] jméno nahánělo hrůzu každému rolníkovi, který je kdy zaslechl. $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Reincarnation: "$SteleCommemoratesAncestors_Intro$. Nebyl to [Select_CString(second.MakeScope.Var('stele_container').Char.IsFemale,'její','jeho')] první život na tomto světě a nebude ani poslední. $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Adventurer: "$SteleCommemoratesAncestors_Intro$. [Select_CString(second.MakeScope.Var('stele_container').Char.IsFemale,'Putovala','Putoval')] dál a rychleji než kdokoli jiný. $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Heresiarch: "$SteleCommemoratesAncestors_Intro$. [Select_CString(second.MakeScope.Var('stele_container').Char.IsFemale,'Její','Jeho')] víra planula oslnivým žárem. $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_PeasantLeader: "$SteleCommemoratesAncestors_Intro$. [Select_CString(second.MakeScope.Var('stele_container').Char.IsFemale,'Vzešla','Vzešel')] z těch nejskromnějších poměrů. $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Witch: "$SteleCommemoratesAncestors_Intro$. [Select_CString(second.MakeScope.Var('stele_container').Char.IsFemale,'Byla ženou','Byl mužem')] podivuhodných schopností. $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_CrusaderMonarch: "$SteleCommemoratesAncestors_Intro$. Celý život [Select_CString(second.MakeScope.Var('stele_container').Char.IsFemale,'bojovala','bojoval')] proti nevěřícím. $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Chakravarti: "$SteleCommemoratesAncestors_Intro$. [Select_CString(second.MakeScope.Var('stele_container').Char.IsFemale,'Byla osou','Byl osou')] ve středu světa. $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_GreatestOfKhans: "$SteleCommemoratesAncestors_Intro$. Celý svět se třásl před [Select_CString(second.MakeScope.Var('stele_container').Char.IsFemale,'jejími','jeho')] kroky a skláněl se před [Select_CString(second.MakeScope.Var('stele_container').Char.IsFemale,'její','jeho')] vůlí. $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Paragon: "$SteleCommemoratesAncestors_Intro$. Možná už nikdy nespatříme nikoho s tak hlubokou zbožností. $SteleCommemoratesCarver$."
 SteleCommemoratesConquest_Intro: "Vztyčena pro [second.MakeScope.Var('stele_commissioner').Char.GetTitledFirstNameNicknamed] na památku vítězství nad [second.MakeScope.Var('stele_container').Char.GetTitledFirstNameNicknamed]"
 SteleCommemoratesConquest_Bloody: "$SteleCommemoratesConquest_Intro$. Tato válka patřila k nejkrvavějším v dějinách. $SteleCommemoratesCarver$."
 SteleCommemoratesConquest_Glorious: "$SteleCommemoratesConquest_Intro$. Bylo to slavné vítězství. $SteleCommemoratesCarver$."
 SteleCommemoratesConquest_HardFought: "$SteleCommemoratesConquest_Intro$. Žádná jiná válka nebyla vybojována s takovým úsilím. $SteleCommemoratesCarver$."
 SteleCommemoratesConquest_EmbarrassinglyEasy: "$SteleCommemoratesConquest_Intro$. Boj byl až trapně snadný. $SteleCommemoratesCarver$."
 SteleCommemoratesConquest_OftForgotten: "$SteleCommemoratesConquest_Intro$. Přes svůj význam bývá tato válka často zapomínána. $SteleCommemoratesCarver$."
 SteleCommemoratesPromotion_Intro: "Vztyčena pro [second.MakeScope.Var('stele_commissioner').Char.GetTitledFirstNameNicknamed] na památku nástupu na trůn [second.MakeScope.Var('stele_container').Title.GetNameNoTier]"
 SteleCommemoratesPromotion_Predestined: "$SteleCommemoratesPromotion_Intro$. Mnozí to považují za předurčené. $SteleCommemoratesCarver$."
 SteleCommemoratesPromotion_TrulyWorthy: "$SteleCommemoratesPromotion_Intro$. Pouze [Select_CString(second.MakeScope.Var('stele_commissioner').Char.IsFemale,'ona byla skutečně hodna vlády','on byl skutečně hoden vlády')]. $SteleCommemoratesCarver$."
 SteleCommemoratesPromotion_Magnificent: "$SteleCommemoratesPromotion_Intro$. Ať [Select_CString(second.MakeScope.Var('stele_commissioner').Char.IsFemale,'její','jeho')] velkolepá vláda trvá celé století. $SteleCommemoratesCarver$."
 SteleCommemoratesPromotion_AweInspiring: "$SteleCommemoratesPromotion_Intro$. Obřad naplnil všechny úžasem. $SteleCommemoratesCarver$."
 SteleCommemoratesPromotion_Majestic: "$SteleCommemoratesPromotion_Intro$. Jen málo vládců se může měřit s [Select_CString(second.MakeScope.Var('stele_commissioner').Char.IsFemale,'její','jeho')] velkolepostí. $SteleCommemoratesCarver$."
