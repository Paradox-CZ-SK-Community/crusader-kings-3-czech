l_polish:
 secure_high_kingdom_north_sea_decision: "Upevnit Severskou říši"
 secure_high_kingdom_north_sea_decision_desc: "Království $k_england$, $k_denmark$ a $k_norway$ k sobě přirozeně patří. Jsou bohatá, mocná a propojená obchodem i šlechtickou krví. Kdyby jen někdo dokázal překonat jejich vzájemnou řevnivost a natrvalo je spojit..."
 secure_high_kingdom_north_sea_decision_tooltip: "Spoj $k_england$, $k_denmark$ a $k_norway$ do jediného [Concept('de_jure','de iure')|E] [Concept('realm','panství')|E]"
 secure_high_kingdom_north_sea_decision_confirm: "Nade všemi jeden velekrál!"
 secure_high_kingdom_north_sea_decision_solve_danelaw: "$k_danelaw$ má stále [Concept('de_jure','de iure')|E] [Concept('counties','hrabství')|E] a nejprve je nutné ukončit rozdělení $k_england$."
 secure_high_kingdom_north_sea_scripted_effect.daneland_reabsorbed.tt: "Všechna [Concept('completely_controlled','zcela ovládaná')|E] [Concept('duchies','vévodství')|E] v $k_daneland$ budou de iure [Concept('de_jure_drift_drifted','posunuta')|E] zpět do $k_england$"
 secure_high_kingdom_north_sea_scripted_effect: "Získáš [Concept('strong_hook','silnou páku')|E] #weak (Věrnost)#! na [Concept('powerful_vassals','mocné vazaly')|E]"
 secure_high_kingdom_north_sea_custom_powerful_vassals: "Každý [Concept('powerful_vassal','mocný vazal')|E]"
 secure_high_kingdom_denmark_held_years: "[temp_scope.GetName] máš v držení #V 10#! let #weak (aktuálně [SCOPE.ScriptValue('north_sea_held_value')|0V])#!"
 secure_high_kingdom_neustria: "Získáš [Concept('title','titul')|E] #V Království Neustrie#!"
 secure_high_kingdom_custom_every_coastal: "Každá pobřežní [Concept('province','provincie')|e]"
 north_sea_kingdom_coastal_modifier: "Pax Nordica"
 found_capital_of_the_rus_decision: "Založit hlavní město Rusi"
 found_capital_of_the_rus_decision_desc: "Podnikaví Seveřané proudí ze Skandinávie po bohatých řekách skrze země divokých Slovanů na východ. Nesčetná sídla a menší panství, slovanská i severská, soupeří o moc, ale jen #EMP jedno#! může skutečně ztělesnit sjednocení obou národů..."
 found_capital_of_the_rus_decision_tooltip: "Učiň své hlavní město pravým domovem všech Rusů"
 found_capital_of_the_rus_decision_confirm: "Velkolepé hlavní město navěky!"
 found_capital_of_the_rus_decision_before_last_date: "Je 1. 1. 1100 nebo dříve"
 elevate_mann_and_the_isles_decision: "Povýšit Království Mannu a Ostrovů"
 elevate_mann_and_the_isles_decision_desc: "$c_isle_of_man$ má jedinečnou polohu pro útočiště severských nájezdníků, odkud se snadno dostanou nejen na Britské ostrovy, ale i do celé západní Evropy.\n\nStačí jen někdo, kdo všem správným vikingům ukáže cestu, využije jeho potenciál a vydláždí ostrov zlatem a železem!"
 elevate_mann_and_the_isles_decision_tooltip: "Získej pověst nejproslulejšího pirátského vládce všech dob"
 elevate_mann_and_the_isles_decision_confirm: "Za nechvalnou slávou a nesmrtelností!"
 hold_gruesome_festival_decision_blot_name: "Uspořádat velký blót"
 hold_gruesome_festival_decision_fallback_name: "Uspořádat velkou oběť"
 hold_gruesome_festival_decision_desc.gf_humsac_practitioner: "Je nejvyšší čas, aby se celé [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] shromáždilo k velké oběti pro [ROOT.Char.GetFaith.PantheonTerm]. Tyto rituály nejen stmelují věřící, ale také potvrzují mé postavení [ROOT.Char.GetTitleAsNameNoTooltip] celé země."
 hold_gruesome_festival_decision_desc.non_gf_practioner: "Mezi mými poddanými jsou tací, kdo provozují velkolepé obětní obřady, za nimiž stojí jejich [GetPlayer.GetTitleAsNameNoTooltip]. Když svolím alespoň k omezené podobě takového rituálu, nepochybně si získám jejich přízeň. Přijetí jejich poněkud... barbarských zvyků by mi však mohlo vynést opovržení těch, kdo jejich způsob života odmítají."
 hold_gruesome_festival_decision_tt: "Uspořádáš velký [Select_CString( Character.IsLocalPlayer, GetPlayer.Custom('GruesomeFestivalName') , '$gruesomefestivalname_festival|q$' )], jehož součástí bude:\n#indent_newline:0 $EFFECT_LIST_BULLET$ Určení rozsahu obřadu\n#indent_newline:0 $EFFECT_LIST_BULLET$ Výběr toho, co obětovat, včetně možnosti určit jednoho ze svých [Concept('prisoners','vězňů')|E] jako [Concept('designate_chief_sacrifice_chief_sacrifice','hlavní oběť')|E]\n#indent_newline:0 $EFFECT_LIST_BULLET$ Zisk nebo ztráta [Concept('county_opinion','lidového mínění')|E] a [Concept('opinion','mínění')|E] [Concept('character','postav')|E] v závislosti na [Concept('core_tenets','zásadách')|E] [Concept('faith','víry')|E] tvých poddaných"
 hold_gruesome_festival_decision_tt.piety_gain: "#indent_newline:0 Získáš [Concept('piety','zbožnost')|E] jako [GetPlayer.GetFaith.GetAdherentName]"
 hold_gruesome_festival_decision_tt.piety_lose: "#indent_newline:0 #EMP Ztratíš#! [Concept('piety','zbožnost')|E] jako [GetPlayer.GetFaith.GetAdherentName]"
 hold_gruesome_festival_decision_tooltip: "Pozveš své poddané k účasti na posvátném a nákladném rituálu"
 hold_gruesome_festival_decision_confirm: "Ve smrti přichází znovuzrození."
 raise_stele_decision_name: "Vztyčit runový kámen"
 raise_stele_decision_desc: "[GetPlayer.GetCulture.GetNameNoTooltip] kultura má ve zvyku vztyčovat vytesané památníky na připomínku významných událostí. Smrt někoho blízkého, urovnání sporu, získání půdy a podobně. Možná by mi takový kámen mohl být k užitku..."
 raise_stele_decision_tt.effects_list: "Jedno z tvých [Concept('counties','hrabství')|E] získá jeden z následujících [Concept('modifiers','modifikátorů')|E]:\n#indent_newline:0 $EFFECT_LIST_BULLET$ [GetModifier('fp1_stele_ancestors_strong').GetNameWithTooltip]\n#indent_newline:0 $EFFECT_LIST_BULLET$ [GetModifier('fp1_stele_conquest_strong').GetNameWithTooltip]\n#indent_newline:0 $EFFECT_LIST_BULLET$ [GetModifier('fp1_stele_promotion_strong').GetNameWithTooltip]"
 raise_stele_decision_tt.variable_strength: "Všechny modifikátory jsou silnější při vztyčení runového kamene v [Concept('cultures','kulturách')|E], které runové kameny používají"
 raise_stele_decision_tooltip: "Zaplať za vytesání runového kamene v jednom ze svých [Concept('counties','hrabství')|E]"
 raise_stele_decision_confirm: "Ale co na něj vytesat?"
 fp1_raise_runestone_vassals: "$EFFECT_LIST_BULLET$Všichni [Concept('direct_vassals','přímí vazalové')|E], kteří také používají runové kameny"
 raise_stele_decision_ancestor: "Nedávno zemřel někdo z tvých předků"
 raise_stele_decision_victory: "Máš za sebou nedávné dobytí území"
 raise_stele_decision_rank: "Tvoje hodnost se nedávno zvýšila"
 forge_the_jomsvikings_decision: "Založit jómské vikingy"
 forge_the_jomsvikings_decision_desc: "Staré tradice vymírají. Den co den lákají vyznavači abrahámovských náboženství náš prostý lid sliby věčného života pro všechny, naši dobrodruzi a osadníci přijímají cizí bohy všude, kde zakotví, a dokonce i reformátoři ve Skandinávii z nás chtějí udělat lid podobnější národům Kříže a Půlměsíce.\n\nDost. Všichni věrní [GetPlayer.GetFaith.GetAdherentNamePluralNoTooltip] se musí semknout a bránit změnám a rouhání!"
 forge_the_jomsvikings_decision.tt.is_in_correct_region: "Nachází se v [Concept('region','regionu')|E] [GetGeographicalRegion('dlc_fp1_region_non_scandinavian_southern_baltic').GetName]"
 forge_the_jomsvikings_decision.tt.empty_castle_or_city: "Musí mít alespoň jednu prázdnou državu typu [Concept('castle','hrad')|E] nebo [Concept('city','město')|E] mimo [Concept('county_capital','hlavní sídlo hrabství')|E]"
 forge_the_jomsvikings_decision_tooltip: "Založ skupinu zbožných vikingů, kteří budou bránit staré tradice"
 forge_the_jomsvikings_decision_confirm: "Valhalla jen pro ty, kdo si ji zaslouží!"
 fp1_valid_norse_faith_for_jomsvikings_trigger_tt: "[THIS.Char.GetFaith.GetName] náleží k [GetReligionByKey('germanic_religion').GetAdjective] [Concept('religion','náboženství')|E] a zůstává bez reformy"
