l_polish:
 game_concept_designate_chief_sacrifice: "Určení hlavní oběti"
 game_concept_designate_chief_sacrifice_article: "Určit hlavní oběť"
 game_concept_designate_chief_sacrifice_chief_sacrifice: "Hlavní oběť"
 game_concept_designate_chief_sacrifice_desc: "Při pořádání velkolepé obětní slavnosti mohou [Concept('characters','postavy')|E] určit jednoho ze svých [Concept('prisoners','vězňů')|E] jako hlavní oběť. Tento [Concept('prisoner','vězeň')|E] je zabit jako první a obětující postavě může přinést více [Concept('piety','zbožnosti')|E].\n\nVhodnějšími oběťmi jsou:\n$EFFECT_LIST_BULLET$Bezzemské [Concept('characters','postavy')|E], jejichž [Concept('faith','víra')|E] je buď [Concept('faith_hostile','nepřátelská')|L], nebo [Concept('faith_evil','zavrženíhodná')|L]\n$EFFECT_LIST_BULLET$[Concept('landed','Zeměpanské')|E] [Concept('characters','postavy')|E] alespoň [Concept('count','hraběcí')|E] [Concept('rank','hodnosti')|E]\n$EFFECT_LIST_BULLET$[Concept('heads_of_faith','Hlavy víry')|E] – ačkoli to může mít následky"
 game_concept_varangian_adventure: "Varjažská výprava"
 game_concept_varangian_adventures: "Varjažské výpravy"
 game_concept_varangian_adventuring: "Výprava"
 game_concept_varangian_adventure_adventure: "Výprava"
 game_concept_varangian_adventure_desc: "Jde o zvláštní typ [Concept('war','války')|E], v němž má útočník v úmyslu přesunout celé své [Concept('realm','panství')|E] do [Concept('war_target','válečného cíle')|E].\n\nPokud zvítězí, okamžitě připojí příslušná [Concept('counties','hrabství')|E] a přesune tam své [Concept('capital','hlavní sídlo')|E]. Jeho staří vazalové získají nezávislost a jeho stará [Concept('counties','hrabství')|E] budou předána ctižádostivým místním vojevůdcům. $game_concept_varangian_adventures$ jsou #EMP POUZE#! dostupné [Concept('duke','vévodům')|E] a [Concept('rulers','vládcům')|E] [Concept('count','hraběcí')|E] [Concept('title_tier','úrovně')|E], přičemž s každou úspěšnou [Concept('varangian_adventure_adventure','výpravou')|E] jsou postupně dražší.\n\nTento [Concept('casus_belli','casus belli')|E] #EMP NENÍ NIKDY#! dostupný po [Concept('era','éře')|E] $culture_era_tribal$ a nelze jej použít proti jiným [Concept('cultures','kulturám')|E], které mohou podnikat [Concept('varangian_adventure_adventure','výpravu')|E], ani proti sousedním [Concept('rulers','vládcům')|E].\n\n$north_germanic_group_collective_noun$ při zahájení své první [Concept('varangian_adventure','varjažské výpravy')|E] obdrží až [EmptyScope.ScriptValue('varangian_adventurers_standard_levy_cap_value')|0] bonusových [Concept('special_troops','vojsk z událostí')|E], přičemž jejich počet roste za každé hrabství stejné [Concept('faith','víry')|E] a stejné [Concept('culture','kultury')|E], které plně ovládají v oblasti [GetGeographicalRegion('dlc_fp1_region_core_mainland_scandinavia').GetName]."
 game_concept_trial_by_combat: "Soudní souboj"
 game_concept_trials_by_combat: "Soudní souboje"
 game_concept_trial_by_combat_trial: "Soud"
 game_concept_trial_by_combat_combat: "Souboj"
 game_concept_trial_by_combat_desc: "V některých [Concept('cultures','kulturách')|E] jsou záležitosti, které nelze vyřešit slovy ani válkou, důvodem k [Concept('trial_by_combat','soudnímu souboji')|E]. Pokud je přijat, dvě [Concept('characters','postavy')|E] se utkají v [Concept('single_combat_duel','duelu')|E] o předem zvolený výsledek. Pokud obviněná strana zvítězí, prokáže svou nevinu.\n\nObecné požadavky pro takový [Concept('trial_by_combat_trial','soud')|E] jsou:\n$EFFECT_LIST_BULLET$Oba musíte být platné kultury.\n$EFFECT_LIST_BULLET$Musíš vůči ní mít [Concept('imprisonment_reason','důvod k uvěznění')|E], který tím bude spotřebován.\n$EFFECT_LIST_BULLET$Nesmí být tvým [Concept('liege','lenním pánem')|E], [Concept('vassal','vazalem')|E] ani [Concept('guest','hostem')|E] či [Concept('courtier','dvořanem')|E] tebe nebo některého z tvých [Concept('vassals','vazalů')|E].\n\n[Concept('characters','Postavy')|E], které samy nejsou způsobilé bojovat, mohou být přesto vyzvány, pokud jsou [Concept('rulers','vládci')|E]; místo sebe pak jmenují [Concept('knight','rytíře')|E], aby bojoval jejich jménem.\n\n[Concept('trial_by_combat_combat','Souboj')|E] lze zvolit jako boj na [Concept('character_death_death','smrt')|E] pouze tehdy, pokud je poškozená strana [Concept('tribal','kmenová')|E] a obě [Concept('characters','postavy')|E] bojují osobně v [Concept('single_combat_duel','duelu')|E]; pokud obviněná strana musí jmenovat šampiona, který bude bojovat jejím jménem, pak [Concept('character_death_death','smrt')|E] není možností."
