l_polish:
 game_concept_designate_chief_sacrifice: "Určení hlavní oběti"
 game_concept_designate_chief_sacrifice_article: "Určit hlavní oběť"
 game_concept_designate_chief_sacrifice_chief_sacrifice: "Hlavní oběť"
 game_concept_designate_chief_sacrifice_desc: "Při pořádání velkého obětního festivalu mohou [Concept('characters','postavy')|E] určit jednoho ze svých [Concept('prisoners','vězňů')|E] jako hlavní oběť. Tento $game_concept_prisoner|l$ je usmrcen jako první a obětující postava díky tomu může získat více [Concept('piety','zbožnosti')|E].\n\nPřednostními oběťmi jsou:\n$EFFECT_LIST_BULLET$ $game_concept_characters$, které nevlastní půdu a jejichž [Concept('faith','víra')|E] je buď [Concept('faith_hostile','nepřátelská')|L], nebo [Concept('faith_evil','zavrženíhodná')|L]\n$EFFECT_LIST_BULLET$ $game_concept_characters$ s [Concept('landed','postavením zeměpána')|E] alespoň [Concept('count','hraběcí')|E] [Concept('rank','hodnosti')|E]\n$EFFECT_LIST_BULLET$ [Concept('heads_of_faith','Hlavy víry')|E] (to však může mít následky)"
 game_concept_varangian_adventure: "Varjažská výprava"
 game_concept_varangian_adventures: "Varjažské výpravy"
 game_concept_varangian_adventuring: "Výprava"
 game_concept_varangian_adventure_adventure: "Výprava"
 game_concept_varangian_adventure_desc: "Jedná se o zvláštní druh [Concept('war','války')|E], v níž útočník hodlá přesunout celé své [Concept('realm','panství')|E] na území [Concept('war_target','válečného cíle')|E].\n\nPokud zvítězí, okamžitě anektuje příslušná [Concept('counties','hrabství')|E] a přesune tam své [Concept('capital','hlavní sídlo')|E]. Jeho dosavadní vazalové získají nezávislost a jeho dosavadní $game_concept_counties|l$ připadnou nově povstalým místním válečným pánům. $game_concept_varangian_adventures$ jsou #EMP POUZE#! pro [Concept('rulers','vládce')|E] na [Concept('title_tier','úrovni')|E] „$game_concept_count|l$“ či „[Concept('duke','vévoda')|E]“ a každá úspěšná $game_concept_varangian_adventure$ zvyšuje cenu té následující.\n\nTento [Concept('casus_belli','casus belli')|E] není #EMP NIKDY#! dostupný po $culture_era_tribal$ [Concept('era','éře')|E] a nelze jej použít proti jiným [Concept('cultures','kulturám')|E], které mají rovněž možnost „$game_concept_varangian_adventure_adventure|l$“, ani proti sousedním $game_concept_rulers|l$.\n\nPři první výpravě typu „$game_concept_varangian_adventure|l$“ získají $north_germanic_group_collective_noun$ až [EmptyScope.ScriptValue('varangian_adventurers_standard_levy_cap_value')|0] bonusových [Concept('special_troops','vojáků z událostí')|E]. Jejich počet se zvyšuje za každé zcela ovládané hrabství se stejnou [Concept('faith','vírou')|E] a [Concept('culture','kulturou')|E] v [GetGeographicalRegion('dlc_fp1_region_core_mainland_scandinavia').GetName]."
 game_concept_trial_by_combat: "Soudní souboj"
 game_concept_trials_by_combat: "Soudní souboje"
 game_concept_trial_by_combat_trial: "Soud"
 game_concept_trial_by_combat_combat: "Souboj"
 game_concept_trial_by_combat_desc: "V některých [Concept('cultures','kulturách')|E] může u sporů, které nelze vyřešit slovy ani válkou, místo toho přijít na řadu $game_concept_trial_by_combat|l$. Pokud je výzva přijata, obě [Concept('characters','postavy')|E] se utkají v [Concept('single_combat_duel','souboji jeden na jednoho')|E] za předem stanovených podmínek. Pokud provinilá strana zvítězí, prokáže svou nevinu.\n\nObecné podmínky pro řízení označené jako $game_concept_trial_by_combat_trial|l$ jsou:\n$EFFECT_LIST_BULLET$Oba musíte náležet k platné kultuře.\n$EFFECT_LIST_BULLET$Musíš proti druhé postavě mít [Concept('imprisonment_reason','důvod k uvěznění')|E], který tím bude spotřebován.\n$EFFECT_LIST_BULLET$Druhá postava nesmí být tvým [Concept('liege','lenním pánem')|E] ani [Concept('vassal','vazalem')|E]. Zároveň nesmí být [Concept('guest','hostem')|E] či [Concept('courtier','dvořanem')|E] u tebe ani u postavy označené jako jeden z tvých $game_concept_vassals|l$.\n\n$game_concept_characters$, které nejsou schopné samy bojovat, lze přesto vyzvat, pokud jsou [Concept('rulers','vládci')|E]; místo sebe pak mohou do boje vyslat [Concept('knight','rytíře')|E].\n\nVariantu „$game_concept_trial_by_combat_combat|l$“ lze vést na [Concept('character_death_death','smrt')|E] pouze tehdy, pokud je poškozená strana [Concept('tribal','kmenová')|E] a oba účastníci osobně bojují v režimu „$game_concept_single_combat_duel|l$“. Pokud provinilá strana musí místo sebe vyslat šampiona, možnost „$game_concept_character_death_death|l$“ není k dispozici."
