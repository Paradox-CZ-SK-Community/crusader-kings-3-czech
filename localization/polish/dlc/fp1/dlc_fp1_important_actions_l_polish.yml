l_polish:
 action_can_challenge_to_single_combat: "Lze vyzvat vzdáleného zločince"
 action_can_challenge_to_single_combat_label: "Můžeš vyzvat [recipient.GetShortUINameNoTooltip] na $game_concept_trial_by_combat|l$"
 action_can_challenge_to_single_combat_combined_label: "[recipient.GetShortUINameNoTooltip]"
 action_can_challenge_to_single_combat_desc: "[recipient.GetUIName] se vůči tobě [Select_CString(recipient.IsFemale,'dopustila','dopustil')] [Concept('crimes','zločinů')|E] ([recipient.GetImprisonmentReasons( actor.Self )]), avšak [Concept('imprisoned','uvěznění')|E] nepřipadá v úvahu, takže [Select_CString(recipient.IsFemale,'ji','ho')] můžeš vyzvat k [Concept('trial_by_combat','soudnímu souboji')|E].$action_can_challenge_to_single_combat_HELP$"
 action_can_challenge_to_single_combat_click: "#I Kliknutím [Select_CString(recipient.IsFemale,'ji','ho')] vyzveš#!"
 action_can_challenge_to_single_combat_combined_group_label: "Lze vyzvat zločince na $game_concept_trial_by_combat|l$"
 action_can_challenge_to_single_combat_combined_group_name: "Lze vyzvat zločince na $game_concept_trial_by_combat|l$"
 action_can_challenge_to_single_combat_combined_group_description: "Jiné [Concept('characters','postavy')|E] se vůči tobě dopustily [Concept('crimes','zločinů')|E] ([recipient.GetImprisonmentReasons( actor.Self )]), avšak jejich [Concept('imprisoned','uvěznění')|E] nepřipadá v úvahu, takže je můžeš vyzvat k [Concept('trials_by_combat','soudním soubojům')|E].$action_can_challenge_to_single_combat_HELP$"
 action_can_challenge_to_single_combat_combined_unimportant: "@warning_icon! #X Žádný ze zločinců pro tebe není důležitý#!"
 action_can_challenge_to_single_combat_unimportant: "@warning_icon! #X [recipient.GetShortUINameNoTooltip] pro tebe není [Select_CString(recipient.IsFemale,'důležitá','důležitý')]#!"
 action_can_challenge_to_single_combat_HELP: "\n\n#help Jako [Concept('ruler','vládnoucí postava')|E] nemusíš vyzývat každého [Concept('criminal','zločince')|E] a může být výhodnější počkat na příležitost jej [Concept('imprison','uvěznit')|E]. Dávej si pozor při vyzývání $game_concept_characters|l$ s vysokou [Concept('prowess','udatností')|E], protože všechny [Concept('trials_by_combat','soudní souboje')|E] se odehrávají jako [Concept('single_combat_fight_plural','souboje jeden na jednoho')|E].#!"
 action_can_make_shieldmaiden: "Lze jmenovat štítonošku či štítonoše"
 action_can_make_shieldmaiden_label: "Můžeš určit, že [recipient.GetShortUINameNoTooltip] bude [recipient.Custom('ShieldPersonFemaleMale')|l]"
 action_can_make_shieldmaiden_combined_label: "[recipient.GetShortUINameNoTooltip]"
 action_can_make_shieldmaiden_desc: "[recipient.GetUIName] vyniká v [Concept('prowess','udatnosti')|E], jedné z [Concept('skill','dovedností')|E], a [Select_CString(recipient.IsFemale,'souhlasila','souhlasil')] by s tím, že bude [recipient.Custom('ShieldPersonFemaleMale')|l].$action_can_make_shieldmaiden_HELP$"
 action_can_make_shieldmaiden_click: "#I Kliknutím určíš, že [recipient.GetShortUINameNoTooltip] bude [recipient.Custom('ShieldPersonFemaleMale')|l]#!"
 action_can_make_shieldmaiden_combined_group_label: "Lze jmenovat: [recipient.Custom('ShieldPersonsFemaleMale')|U]"
 action_can_make_shieldmaiden_combined_group_name: "Lze jmenovat: [recipient.Custom('ShieldPersonsFemaleMale')|U]"
 action_can_make_shieldmaiden_combined_group_description: "Několik členů [Concept('close_family','blízké rodiny')|E] vyniká v [Concept('prowess','udatnosti')|E], jedné z [Concept('skill','dovedností')|E], a souhlasilo by s tím, že budou [recipient.Custom('ShieldPersonsFemaleMale')|l].$action_can_make_shieldmaiden_HELP$"
 action_can_make_shieldmaiden_HELP: "\n\n#help Je velmi výhodné mít alespoň jednu postavu, která je [recipient.Custom('ShieldPersonFemaleMale')|l]. Taková postava si bude průběžně zlepšovat své dovednosti a může tě dokonce zachránit před [Concept('scheme','intrikou')|E] typu [GetScheme('murder').GetTypeName].\n\nNení však rozumné určit, že každý člen [Concept('close_family','blízké rodiny')|E] bude [recipient.Custom('ShieldPersonFemaleMale')|l], ledaže máš [Concept('prestige','prestiže')|E] na rozdávání.#!"
