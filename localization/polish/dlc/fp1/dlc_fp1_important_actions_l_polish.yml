l_polish:
 action_can_challenge_to_single_combat: "Lze vyzvat vzdáleného zločince"
 action_can_challenge_to_single_combat_label: "Můžete vyzvat [recipient.GetShortUINameNoTooltip] na soudní souboj" # todo: CONCEPT CASE
 action_can_challenge_to_single_combat_combined_label: "[recipient.GetShortUINameNoTooltip]"
 action_can_challenge_to_single_combat_desc: "[recipient.GetUIName] se [Select_CString(recipient.IsFemale,'dopustila','dopustil')] vůči vám [Concept('crimes','zločinům')|E] ([recipient.GetImprisonmentReasons( actor.Self )]), ale nelze ho/jí [Concept('imprisoned','uvězněnému')|E], což vám umožňuje vyzvat [recipient.GetHerHim] na [Concept('trial_by_combat','soudní souboj')|E].$action_can_challenge_to_single_combat_HELP$" # todo: CONCEPT CASE
 action_can_challenge_to_single_combat_click: "#I Klikněte pro vyzvání [recipient.GetHerHim]#!"
 action_can_challenge_to_single_combat_combined_group_label: "Lze vyzvat zločince na soudní souboj" # todo: CONCEPT CASE
 action_can_challenge_to_single_combat_combined_group_name: "Lze vyzvat zločince na soudní souboj" # todo: CONCEPT CASE
 action_can_challenge_to_single_combat_combined_group_description: "Jiní [Concept('characters','postavy')|E] se vůči vám dopustili [Concept('crimes','zločiny')|E] ([recipient.GetImprisonmentReasons( actor.Self )]), ale nelze je [Concept('imprisoned','uvězněný')|E], což vám umožňuje vyzvat je na [Concept('trials_by_combat','soudní souboje')|E].$action_can_challenge_to_single_combat_HELP$" # todo: CONCEPT CASE
 action_can_challenge_to_single_combat_combined_unimportant: "@warning_icon! #X Žádný z těchto zločinců pro vás není [Select_CString(ROOT.Char.IsFemale,'důležitá','důležitý')]#!"
 action_can_challenge_to_single_combat_unimportant: "@warning_icon! #X Pro vás není [Select_CString(recipient.IsFemale,'důležitá','důležitý')]#!"
 action_can_challenge_to_single_combat_HELP: "\n\n#help Jako [Concept('ruler','vládce')|E] nemusíte vyzývat každého [Concept('criminal','zločinného')|E], a může být výhodné počkat, dokud nebudete mít příležitost je [Concept('imprison','uvěznit')|E]. Buďte opatrní při vyzývání postavách s vysokým [Concept('prowess','udatností')|E], protože všechny [Concept('trials_by_combat','soudní souboje')|E] se bojují jako [Concept('single_combat_fight_plural','souboje')|E].#!" # todo: CONCEPT CASE
 action_can_make_shieldmaiden: "Lze jmenovat štítmaidenku"
 action_can_make_shieldmaiden_label: "Můžete udělat z [recipient.GetShortUINameNoTooltip] [recipient.Custom('ShieldPersonFemaleMale')|U]"
 action_can_make_shieldmaiden_combined_label: "[recipient.GetShortUINameNoTooltip]"
 action_can_make_shieldmaiden_desc: "[recipient.GetUIName] má vysokou [Concept('prowess','udatnosti')|E] [Concept('skill','dovednosti')|E] a [Select_CString(recipient.IsFemale,'přijala','přijal')] by stát se [recipient.Custom('ShieldPersonFemaleMale')|U].$action_can_make_shieldmaiden_HELP$" # todo: CONCEPT CASE
 action_can_make_shieldmaiden_click: "#I Klikněte pro jmenování [recipient.Custom('ShieldPersonFemaleMale')|U]#!"
 action_can_make_shieldmaiden_combined_group_label: "Lze jmenovat [recipient.Custom('ShieldPersonsFemaleMale')|U]"
 action_can_make_shieldmaiden_combined_group_name: "Lze jmenovat [recipient.Custom('ShieldPersonsFemaleMale')|U]"
 action_can_make_shieldmaiden_combined_group_description: "Několik členů [Concept('close_family','blízké rodiny')|E] má vysokou [Concept('prowess','udatnosti')|E] [Concept('skill','dovednosti')|E] a byli by ochotni stát se [recipient.Custom('ShieldPersonsFemaleMale')|U].$action_can_make_shieldmaiden_HELP$" # todo: CONCEPT CASE
 action_can_make_shieldmaiden_HELP: "\n\n#help Mít alespoň jednoho [recipient.Custom('ShieldPersonFemaleMale')|U] může být velmi prospěšné. Budou neustále zlepšovat své dovednosti a mohou vás dokonce zachránit před [GetScheme('murder').GetTypeName] [Concept('scheme','intrikou')|E].\n\nNeměli byste však udělat z každého člena [Concept('close_family','blízkou rodinu')|E] [recipient.Custom('ShieldPersonFemaleMale')|U], pokud nemáte více [Concept('prestige','prestiž')|E], než byste věděli, co s nimi dělat.#!" # todo: CONCEPT CASE
