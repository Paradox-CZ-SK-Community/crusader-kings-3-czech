l_polish:
 fp1_jomsvikings.0001.t: "Pomocná ruka z [leader.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 fp1_jomsvikings.0001.desc.intro: "V pevnosti [leader.GetCapitalLocation.GetTitle.GetNameNoTier] sídlí [leader.GetPrimaryTitle.GetNameNoTier], válečnický řád oddaný ochraně starých tradic [leader.GetFaith.GetName] před změnami, zneuctěním a cizími vírami.\n\nZa mou zbožnost a ctnost mi [leader.GetTitledFirstName] [Select_CString(leader.IsFemale,'poslala','poslal')] na výběr dvě posily: [retainer_a.GetFirstName],"
 fp1_jomsvikings.0001.desc.zealous: "s vypleněním stovky kostelů na kontě,"
 fp1_jomsvikings.0001.desc.wrathful: "s medvědem roztrženým vedví na kontě,"
 fp1_jomsvikings.0001.desc.impatient: "s rychlostí větší než blesk,"
 fp1_jomsvikings.0001.desc.arrogant: "s vyhlídkou jednou stanout v čele [leader.GetPrimaryTitle.GetNameNoTierNoTooltip],"
 fp1_jomsvikings.0001.desc.brave: "po vítězství nad trollem v pěstním souboji,"
 fp1_jomsvikings.0001.desc.ambitious: "s touhou zemřít nejslavnější smrtí všech dob,"
 fp1_jomsvikings.0001.desc.diligent: "bez jediné přestávky v tréninku,"
 fp1_jomsvikings.0001.desc.gregarious: "se samotnými bohy mezi přáteli,"
 fp1_jomsvikings.0001.desc.stubborn: "po rozebrání celé hory kámen po kameni,"
 fp1_jomsvikings.0001.desc.fickle: "s vrtkavou myslí, která přelstila i [leader.GetFaith.DevilNamePossessive] důvtip,"
 fp1_jomsvikings.0001.desc.vengeful: "bez jediné křivdy ponechané bez pomsty,"
 fp1_jomsvikings.0001.desc.viking: "s desítkou zabitých rolníků za každý den na výpravě,"
 fp1_jomsvikings.0001.desc.connector: "nebo [retainer_b.GetFirstName],"
 fp1_jomsvikings.0001.desc.outro: "a k tomu i pochvalu od [leader.GetTitledFirstName] za mou oddanost.\n\nJedna z těchto posil zůstane a druhá se vrátí k [leader.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 fp1_jomsvikings.0001.a: "[retainer_a.GetFirstNameNoTooltip] působí jako [Select_CString(retainer_a.IsFemale,'hrozivá stratégyně','hrozivý stratég')]!"
 fp1_jomsvikings.0001.b: "[retainer_b.GetFirstNameNoTooltip] je vskutku [Select_CString(retainer_b.IsFemale,'impozantní válečnice','impozantní válečník')]..."
 fp1_jomsvikings.0001.c: "Válečníků už mám dost, díky."
 fp1_jomsvikings.0011.t.reformed_norse: "Hněv starých tradic"
 fp1_jomsvikings.0011.t.reformed_other: "Hněv starých bohů"
 fp1_jomsvikings.0011.t.fallback: "Piráti z [leader.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 fp1_jomsvikings.0011.desc.intro: "Pohroma! Bleskový nájezd, který [leader.GetTitledFirstName] z [leader.GetPrimaryTitle.GetNameNoTier] podniká na [target_county.GetNameNoTier], hrozí, že polovinu hrabství obrátí v popel!\n\n"
 fp1_jomsvikings.0011.desc.ideological_reformist: "Tito prokletí piráti označují [ROOT.Char.GetFaith.GetName] za odporné znetvoření víry našich předků, hromadně vraždí naše [ROOT.Char.GetFaith.PriestNeuterPlural], vypalují naše [ROOT.Char.GetFaith.HouseOfWorshipPlural] a vyřvávají: „[leader.GetFaith.HighGodName] stojí při nás!“"
 fp1_jomsvikings.0011.desc.ideological_other: "Tito piráti, fanatičtí [leader.GetFaith.GetAdherentNamePlural], považují [ROOT.Char.GetFaith.GetReligion.GetName] za hrozbu svému způsobu života. Nájezdníci se nespokojují s kořistí - vraždí [ROOT.Char.GetFaith.PriestNeuterPlural], vypalují [ROOT.Char.GetFaith.HouseOfWorshipPlural] a s krvavou zuřivostí vyřvávají cosi o svých falešných bozích."
 fp1_jomsvikings.0011.desc.economic: "Ačkoli proti mně nechovají žádnou zvláštní zášť kvůli víře, stále jsou závislí na kořisti a nájezdech a mé země představují lákavý cíl. Možná... možná by mé poddané ještě mohl zachránit pořádný gafol?"
 fp1_jomsvikings.0011.desc.outro: "\n\nNa svolání armády není čas. Mohu udeřit s tím, co mám právě po ruce, nebo zatnout zuby a počkat, až odtáhnou."
 fp1_jomsvikings.0011.a: "Všichni, kdo jsou po ruce, do zbraně!"
 fp1_jomsvikings.0011.a.tt_success: "Piráti jsou odříznuti a zničeni"
 fp1_jomsvikings.0011.a.tt_failure: "[leader.GetTitledFirstNameNoTooltip] při ústupu rozpoutá zkázu"
 fp1_jomsvikings.0011.b.benefactor: "[Select_CString(benefactor.IsFemale,'Nemohla by nám','Nemohl by nám')] [benefactor.GetTitledFirstNameNoTooltip] prostě poslat nové [ROOT.Char.GetFaith.PriestNeuterPlural]?"
 fp1_jomsvikings.0011.b.fallback: "Je to politováníhodné, ale náhradní [ROOT.Char.GetFaith.PriestNeuterPlural] můžeme přivést odjinud..."
 fp1_jomsvikings.0011.c: "Shromážděte gafol; z dlouhodobého hlediska je to levnější."
 fp1_jomsvikings.0011.c.tt: "[leader.GetTitledFirstName] se bez dalších potíží stáhne"
 fp1_jomsvikings.0011.d: "Jak je tohle něco jiného než místní problém?"
 fp1_jomsvikings.0011.d.tt: "Necháš [target_county.GetNameNoTier] napospas plamenům"
 fp1_jomsvikings.0021.t: "Vyjednávání s piráty"
 fp1_jomsvikings.0021.desc: "S jistou nedůvěrou přijímám delegaci neukázněných hrdlořezů z [leader.GetPrimaryTitle.GetNameNoTier], která mi předává dopis od [leader.GetTitledFirstName].\n\nTito náboženští fundamentalisté, nelítostní nájezdníci a plenitelé na moři i na souši, patří k nejneblaze proslulejším a nejsmrtonosnějším pirátům světa.\n\nJsem [ROOT.Char.GetFaith.GetAdherentName] a příběhy o jejich zbožnosti a udatnosti ve mně vždy vzbuzovaly směs úžasu a strachu. Teď se zdá, že mi jejich [leader.GetTitleAsNameNoTooltip] nabízí velení nad touto sebrankou dobrovolníků, pokud je využiji k nájezdům a plenění ve jménu [ROOT.Char.GetFaith.PantheonTerm]."
 fp1_jomsvikings.0021.a: "Piráti, kteří poslouchají rozkazy? Zajímavé..."
 fp1_jomsvikings.0021.a.tt: "[Concept('army','Armáda')|E] bude zahrnovat mimořádně odolné $jomsviking_pirates$ [Concept('men_at_arms','ozbrojence')|E]"
 fp1_jomsvikings.0021.b: "Raději jen námořníky s dobrou pověstí."
 fp1_jomsvikings.0021.b.tt: "[Concept('army','Armáda')|E] bude zahrnovat najímatelné $bondi$ [Concept('men_at_arms','ozbrojence')|E]"
 fp1_jomsvikings.0021.c: "Své vojáky mám raději trochu... ukázněnější."
 fp1_jomsvikings.0041.t: "Hanba bohům"
 fp1_jomsvikings.0041.desc: "„#EMP [ROOT.Char.GetFirstNameNoTooltip]#!!“ vyje [leader.GetTitledFirstName], když mi [Select_CString(leader.IsFemale,'napůl svlečená','napůl svlečený')] vtrhne do trůnního sálu.\n\n„Tvé hříšné způsoby a nestoudná nečest jsou hanbou pro všechny [leader.GetFaith.GetAdherentNamePlural] a [leader.GetPrimaryTitle.GetNameNoTier] už to dál trpět nebudou! Žádné výmluvy, žádné triky. Holmgang, #EMP tady#! a #EMP teď#!!“\n\nMoji zmatení strážci svírají zbraně a jsou připraveni na vetřelce každým okamžikem zaútočit.\n\nAť udělám cokoli, zpráva o mém vyjednávání se nepochybně rozletí do celého světa."
 fp1_jomsvikings.0041.a: "S úsměvem tě pošlu do Valhöll!"
 fp1_jomsvikings.0041.a.tt: "Okamžitě se pustíš do [Concept('single_combat_fight','souboje')|E]"
 fp1_jomsvikings.0041.a.tt_success: "Vyhraješ souboj"
 fp1_jomsvikings.0041.a.tt_failure: "[leader.GetTitledFirstName] vyhraje souboj"
 fp1_jomsvikings.0041.b: "[Select_CString(leader.IsFemale,'Byla jsi hloupá','Byl jsi hloupý')], že jsi [Select_CString(leader.IsFemale,'přišla','přišel')] bez doprovodu. Stráže!"
 fp1_jomsvikings.0041.b.tt_success: "[leader.GetTitledFirstName] [Select_CString(leader.IsFemale,'je spoutána a odvlečena','je spoután a odvlečen')] do žaláře"
 fp1_jomsvikings.0041.b.tt_failure: "[leader.GetTitledFirstName] podnikne odvážný útěk"
 fp1_jomsvikings.0041.c: "Víš, že jsi jen [Select_CString(leader.IsFemale,'nafoukaná pirátka','nafoukaný pirát')], že? Tak zmiz."
 fp1_jomsvikings.0042.trigger_failure: "[leader.GetTitledFirstNameNoTooltip]: souboj byl zrušen"
 fp1_jomsvikings.0044.t: "$fp1_jomsvikings.0041.t$: Zadostiučinění"
 fp1_jomsvikings.0044.desc: "[leader.GetTitledFirstName] leží bezvládně u mých nohou a trůnní sál se ponoří do hrobového ticha. Není slyšet ani šepot, dokonce ani dech, kromě mého vlastního přerývaného lapání po vzduchu.\n\nMlčky se znovu oblékám.\n\nJednomu po druhém pohlédnu do očí každému, kdo tu ještě zůstal."
 fp1_jomsvikings.0044.a: "Chce to zkusit ještě #EMP někdo#!?"
 fp1_jomsvikings.0044.b: "Spravedlnost mé vlády byla opět prokázána!"
 fp1_jomsvikings.0044.c: "To jen dokazuje, jak nehodná je víra [leader.GetFaith.GetNameNoTooltip]..."
 fp1_jomsvikings.1001.t: "Soumrak starých tradic"
 fp1_jomsvikings.1001.desc.intro: "Jejich poslední pevnost padla a [title.GetNameNoTier] byli zcela zničeni.\n\n"
 fp1_jomsvikings.1001.desc.reformed_asatru_exists: "Přes veškerou snahu zadržet příliv změn nakonec jejich víru postihl rozkol, stejně jako předtím křesťanství a islám.\n\nAť už zvítězí reformátoři, nebo věrní podlehnou cizím vírám, "
 fp1_jomsvikings.1001.desc.fallback: "Nakonec jich zkrátka nebylo dost, aby zadrželi příliv cizích vír, a "
 fp1_jomsvikings.1001.desc.outro: "zdá se nyní nevyhnutelné, že [leader.GetFaith.GetName] skončí na smetišti dějin."
 fp1_jomsvikings.1001.holy_order_destroyed: "[title.GetNameNoTier] byli zničeni."
 fp1_jomsvikings.1001.a: "Bohové nás opustili!"
 fp1_jomsvikings.1001.a.tt: "Jómští vikingové už nebudou odměňovat zbožné"
 fp1_jomsvikings.1001.b: "Aspoň je od nich pokoj!"
 fp1_jomsvikings.1001.b.tt: "Jómští vikingové už nebudou plenit nevěřící"
 fp1_jomsvikings.1001.c: "Jómští... kdo?"
 fp1_jomsvikings.1001.c.tt: "$fp1_jomsvikings.1001.b.tt$"
