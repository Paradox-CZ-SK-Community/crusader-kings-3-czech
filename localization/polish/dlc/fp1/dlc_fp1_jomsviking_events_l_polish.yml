l_polish:
 fp1_jomsvikings.0001.t: "Pomocná ruka od [leader.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 fp1_jomsvikings.0001.desc.intro: "Ubytovaní ve své pevnosti [leader.GetCapitalLocation.GetTitle.GetNameNoTier], [leader.GetPrimaryTitle.GetNameNoTier] jsou válečný řád zasvěcený ochraně Starých zvyků víry [leader.GetFaith.GetName] před změnou, hanbou a cizími vírami.\n\nZa mou zbožnost a ctnost mi [leader.GetTitledFirstName] poslal výběr dvou družiníků: [retainer_a.GetFirstName],"
 fp1_jomsvikings.0001.desc.zealous: "který vyplenil sto kostelů,"
 fp1_jomsvikings.0001.desc.wrathful: "který jednou roztrhl medvěda napůl,"
 fp1_jomsvikings.0001.desc.impatient: "který je rychlejší než blesk,"
 fp1_jomsvikings.0001.desc.arrogant: "který by byl další [leader.GetTitleAsNameNoTooltip],"
 fp1_jomsvikings.0001.desc.brave: "který porazil trolla v pěstním souboji,"
 fp1_jomsvikings.0001.desc.ambitious: "který si přeje zemřít nejslavnějším možným způsobem,"
 fp1_jomsvikings.0001.desc.diligent: "který nikdy nepřestává trénovat,"
 fp1_jomsvikings.0001.desc.gregarious: "který se spřátelil se samotnými bohy,"
 fp1_jomsvikings.0001.desc.stubborn: "který rozebral horu kámen po kameni,"
 fp1_jomsvikings.0001.desc.fickle: "jehož rozmarná mysl oklamala [leader.GetFaith.DevilName] [leader.GetFaith.DevilHerselfHimself],"
 fp1_jomsvikings.0001.desc.vengeful: "který nikdy nenechal křivdu nepotrestanou,"
 fp1_jomsvikings.0001.desc.viking: "který na výpravách zabije každý den deset rolníků,"
 fp1_jomsvikings.0001.desc.connector: "nebo [retainer_b.GetFirstName],"
 fp1_jomsvikings.0001.desc.outro: "a také [leader.GetHerHis] pochvaly za mou oddanost.\n\nJeden zůstane a druhý se vrátí do [leader.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 fp1_jomsvikings.0001.a: "[retainer_a.GetFirstNameNoTooltip] se zdá být vynikajícím stratégem!"
 fp1_jomsvikings.0001.b: "[retainer_b.GetFirstNameNoTooltip] je opravdu impozantní válečník..."
 fp1_jomsvikings.0001.c: "Už mám víc než dost válečníků, díky."
 fp1_jomsvikings.0011.t.reformed_norse: "Hněv starých zvyků"
 fp1_jomsvikings.0011.t.reformed_other: "Hněv starých bohů"
 fp1_jomsvikings.0011.t.fallback: "[leader.GetPrimaryTitle.GetNameNoTierNoTooltip] piráti"
 fp1_jomsvikings.0011.desc.intro: "Katastrófa! Bleskový nájezd [leader.GetTitledFirstName] z [leader.GetPrimaryTitle.GetNameNoTier] na [target_county.GetNameNoTier] hrozí, že zapálí polovinu hrabství!\n\n"
 fp1_jomsvikings.0011.desc.ideological_reformist: "Prohlašujíce [ROOT.Char.GetFaith.GetName] za ohavné pokřivení víry našich předků, ti prokletí piráti masově vraždí naše [ROOT.Char.GetFaith.PriestNeuterPlural], pálí naše [ROOT.Char.GetFaith.HouseOfWorshipPlural] a tvrdí, že to vše dělají ve jménu [leader.GetFaith.HighGodName]!"
 fp1_jomsvikings.0011.desc.ideological_other: "Jako fundamentalističtí [leader.GetFaith.GetAdherentNamePlural] považují tito piráti [ROOT.Char.GetFaith.GetReligion.GetName] za hrozbu jejich způsobu života. Kromě drancování plen masakrují [ROOT.Char.GetFaith.PriestNeuterPlural], pálí [ROOT.Char.GetFaith.HouseOfWorshipPlural] a křičí o svých falešných bozích."
 fp1_jomsvikings.0011.desc.economic: "Ač [leader.GetPrimaryTitle.GetNameNoTierNoTooltip] nemají zvláštní zášť vůči vyznavači [ROOT.Char.GetFaith.GetAdherentName] jako jsem já, stále závisí na plenění a nájezdech, aby přežili, a mé země jsou lákavým cílem. Možná... možná by placení vysokého gafolu ještě mohlo ušetřit mé poddané?"
 fp1_jomsvikings.0011.desc.outro: "\n\nNení čas shánět armádu. Můžu udeřit s tím, co mám po ruce, nebo zatnu zuby a vyčkám, až odejdou."
 fp1_jomsvikings.0011.a: "Sežeňte kohokoli máme, k zbraním!"
 fp1_jomsvikings.0011.a.tt_success: "Piráti byli odříznuti a zničeni"
 fp1_jomsvikings.0011.a.tt_failure: "[leader.GetTitledFirstNameNoTooltip] páchá spoušť, zatímco [leader.GetSheHe] prchá"
 fp1_jomsvikings.0011.b.benefactor: "Možná by nám [benefactor.GetTitledFirstNameNoTooltip] mohl prostě poslat nové [ROOT.Char.GetFaith.PriestNeuterPlural]?"
 fp1_jomsvikings.0011.b.fallback: "Je to politováníhodné, ale mohli bychom dovézt náhradní [ROOT.Char.GetFaith.PriestNeuterPlural]..."
 fp1_jomsvikings.0011.c: "Vyberte gafol; dlouhodobě je to levnější."
 fp1_jomsvikings.0011.c.tt: "[leader.GetTitledFirstName] se stáhne bez incidentů"
 fp1_jomsvikings.0011.d: "Jak je tohle něco jiného než místní problém?"
 fp1_jomsvikings.0011.d.tt: "Necháte [target_county.GetNameNoTier] hořet"
 fp1_jomsvikings.0021.t: "Vyjednávání s piráty"
 fp1_jomsvikings.0021.desc: "S jistou nedůvěrou přijímám delegaci nepořádných banditů z [leader.GetPrimaryTitle.GetNameNoTier], která předkládá dopis od [leader.GetTitledFirstName].\n\nDivocí nájezdníci a lupiči na moři i na souši, tito náboženští fundamentalisté patří mezi nejznámější a nejnebezpečnější piráty na světě.\n\nJako každý dobrý [ROOT.Char.GetFaith.GetAdherentName] jsem s úžasem i strachem poslouchal příběhy o jejich zbožnosti a síle. Teď se zdá, že jejich [leader.GetTitleAsNameNoTooltip] mi nabízí velení této skupině dobrovolníků, pokud je využiju k plenění a drancování pro [ROOT.Char.GetFaith.PantheonTerm]."
 fp1_jomsvikings.0021.a: "Piráti, kteří přijímají rozkazy? Zajímavé..."
 fp1_jomsvikings.0021.a.tt: "[army|E] bude obsahovat speciální, těžko zabitelné $jomsviking_pirates$ [men_at_arms|E]"
 fp1_jomsvikings.0021.b: "Jen důvěryhodní námořníci, myslím."
 fp1_jomsvikings.0021.b.tt: "[army|E] bude obsahovat $bondi$ [men_at_arms|E], které lze naverbovat"
 fp1_jomsvikings.0021.c: "Preferuji, aby byli moji vojáci trochu více... disciplinovaní."
 fp1_jomsvikings.0041.t: "Hanba bohům"
 fp1_jomsvikings.0041.desc: "„#EMP [ROOT.Char.GetFirstNameNoTooltip]#!!“ huláká [leader.GetTitledFirstName] jako [leader.GetSheHe] vtrhne do mého trůnního sálu, napůl oděn.\n\n„Tvé hříšné způsoby a zjevné pošpinění cti jsou hanbou pro [leader.GetFaith.GetAdherentNamePlural] všude, a [leader.GetPrimaryTitle.GetNameNoTier] to už nebude tolerovat! Žádné výmluvy, žádné triky, dáme si holmgang, #EMP tady#! a #EMP teď#!!“\n\nZmatení, moji strážní svírají zbraně, připraveni okamžitě zasáhnout proti vetřelci.\n\nAť už udělám cokoli, zpráva o mých skutcích se bezpochyby rozšíří po světě."
 fp1_jomsvikings.0041.a: "Pošlu tě s úsměvem do Valhöll!"
 fp1_jomsvikings.0041.a.tt: "Okamžitě vstupujete do [single_combat_fight|E]"
 fp1_jomsvikings.0041.a.tt_success: "Vyhrajete souboj"
 fp1_jomsvikings.0041.a.tt_failure: "[leader.GetTitledFirstName] vyhraje souboj"
 fp1_jomsvikings.0041.b: "[Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] jsi blázen, že jsi přišel sám. Stráže!"
 fp1_jomsvikings.0041.b.tt_success: "[leader.GetTitledFirstName] je spoután a odveden do žaláře"
 fp1_jomsvikings.0041.b.tt_failure: "[leader.GetTitledFirstName] provedl odvážný útěk"
 fp1_jomsvikings.0041.c: "Víš, že jsi jen namyšlený pirát, že? Jdi pryč."
 fp1_jomsvikings.0042.trigger_failure: "Váš souboj s [leader.GetTitledFirstNameNoTooltip] byl zrušen"
 fp1_jomsvikings.0044.t: "$fp1_jomsvikings.0041.t$: Očista"
 fp1_jomsvikings.0044.desc: "S [leader.GetTitledFirstName] bezvládně u mých nohou se trůnní sál stává smrtelně tichým. Není slyšet ani šepot, žádné dýchání kromě mých trhaných nádechů.\n\nTiše si znovu obléknu oděv.\n\nJeden po druhém se zadívám do očí každému, kdo tu ještě zůstává."
 fp1_jomsvikings.0044.a: "Někdo #EMP další#! chce zkusit?"
 fp1_jomsvikings.0044.b: "Spravedlnost mé vlády se znovu prokázala!"
 fp1_jomsvikings.0044.c: "To jen ukazuje, jak nehodná je víra [leader.GetFaith.GetNameNoTooltip]..."
 fp1_jomsvikings.1001.t: "Ústup starých zvyků"
 fp1_jomsvikings.1001.desc.intro: "S pádem jejich poslední pevnosti byli [title.GetNameNoTier] zcela vyhlazeni.\n\n"
 fp1_jomsvikings.1001.desc.reformed_asatru_exists: "Navzdory jejich nejlepším snahám vzdorovat přílivu změn, do jejich víry zasáhlo schizma, stejně jako dříve křesťanství a islám.\n\nAť už reformisté zvítězí, nebo věrní podlehnou cizím vírám, "
 fp1_jomsvikings.1001.desc.fallback: "Nakonec prostě nestačili zastavit příliv cizích vír, a"
 fp1_jomsvikings.1001.desc.outro: "zdá se nyní nevyhnutelné, že [leader.GetFaith.GetName] je odsouzena k smetišti dějin."
 fp1_jomsvikings.1001.holy_order_destroyed: "[title.GetNameNoTier] byli zničeni."
 fp1_jomsvikings.1001.a: "Bohové nás opustili!"
 fp1_jomsvikings.1001.a.tt: "Jomsvikingové už nebudou rozdávat dary zbožným"
 fp1_jomsvikings.1001.b: "Konečně pryč s tím harampádím!"
 fp1_jomsvikings.1001.b.tt: "Jomsvikingové už nebudou vyplundávat nevěřící"
 fp1_jomsvikings.1001.c: "Jomsvikingové — kdo?"
 fp1_jomsvikings.1001.c.tt: "$fp1_jomsvikings.1001.b.tt$"
