l_polish:
 fp1_major_decisions.0001.t: "Vele[founder.Custom('GetQueenKing')|l] severu"
 fp1_major_decisions.0001.desc: "Už dlouho toužím sjednotit velká království Severního moře pod jedinou, trvalou korunou. Roky jsem [Select_CString(founder.IsFemale,'dřela','dřel')] a postupně získával uznání napříč všemi svými panstvími. Dnes se můj sen konečně stává skutečností.\n\nOd klíčových vazalů jsem si [Select_CString(founder.IsFemale,'vynutila','vynutil')] pečlivě formulované přísahy neochvějné věrnosti a Sasové, Norové i Dánové uznali můj nový úřad. Jako vele[founder.Custom('GetQueenKing')|l] nyní nesporně vládnu celému Severnímu moři.\n\nMožná budou moji potomci dál vládnout všem těm královstvím jako jedinému celku. Možná ne. Na tom už naštěstí nezáleží.\n\nKdokoli bude nosit nižší koruny, #EMP všichni#! uznají, kdo stojí nade všemi: [founder.GetTitleAsNameNoTooltip] rodu [founder.GetHouse.GetBaseNameNoTooltip]!"
 fp1_major_decisions.0001.a: "Mocná říše, která přetrvá!"
 fp1_major_decisions.0002.t: "$fp1_major_decisions.0001.t$"
 fp1_major_decisions.0002.desc: "[founder.Custom('GetQueenKing')|U] [founder.GetFirstName], [Select_CString(founder.IsFemale,'má lenní paní','můj lenní pán')], už mnoho let dává jasně najevo, že si přeje, aby se [Select_CString(founder.IsFemale,'její panství nerozpadlo ani po její smrti','jeho panství nerozpadlo ani po jeho smrti')].\n\nNaše království sice spojují pouta příbuzenství i dávných střetů, ale jejich vzájemná vzdálenost a odlišnost dlouho činily tento cíl nedosažitelným.\n\nDnes se všechny pochybnosti ukázaly jako liché. [founder.GetFirstNameNoTooltip] [Select_CString(founder.IsFemale,'předložila','předložil')] všem vazalům panství léta pečlivě sepisované přísahy vzájemné věrnosti.\n\nZrodilo se $title_high_kingdom$ - $e_north_sea$!"
 fp1_major_decisions.0002.a: "Ať žije [founder.GetTitleAsNameNoTooltip]!"
 fp1_major_decisions.0002.b: "[Select_CString(founder.IsFemale,'Falešná','Falešný')] [founder.Custom('GetQueenKing')], a to hned čtyřikrát."
 fp1_major_decisions.0003.t: "$fp1_major_decisions.0001.t$"
 fp1_major_decisions.0003.desc: "Už dlouho [founder.GetFirstName], [founder.Custom('GetQueenKing')] tří království - $k_norway$, $k_england$ a $k_denmark$ - otevřeně usiluje o to, [Select_CString(founder.IsFemale,'aby se její panství po její smrti nerozpadlo','aby se jeho panství po jeho smrti nerozpadlo')].\n\nDnes, po dlouhých letech vlády a napjatých jednání, se [founder.GetFirstNameNoTooltip] konečně [Select_CString(founder.IsFemale,'dočkala','dočkal')] splnění svého přání.\n\nVazalové všech tří království se shodli, že bez ohledu na to, kdo usedne na jednotlivé trůny, všichni uznají, že [founder.GetTitleAsNameNoTooltip] stojí nade všemi."
 fp1_major_decisions.0003.a: "Panství pro nás všechny - [ROOT.GetCharacter.GetFaith.GetNameNoTooltip] nás spojuje!"
 fp1_major_decisions.0003.b: "Ať nás [ROOT.GetCharacter.GetFaith.HighGodName] ochrání, až [founder.GetFirstNameNoTooltip] propadne hněvu!"
 fp1_major_decisions.0003.c: "[founder.GetFirstNameNoTooltip] není nic než [Select_CString(founder.IsFemale,'nafoukaná barbarka','nafoukaný barbar')]!"
 fp1_major_decisions.0011.t: "Hlavní město všech Rusů"
 fp1_major_decisions.0011.desc: "Od $river_volga$ po $river_dnieper$ a ještě dál brázdí Varjagové řeky a stezky napříč územím, které obývají $east_slavic_group_collective_noun$. Pleníme, dobýváme a mísíme se s místními. Kde se nám zachce, zakládáme nová sídla nebo se jich zmocňujeme silou.\n\nAž dodnes spolu tato menší centra soupeřila o dobrodruhy a válečné pány ve snaze získat skutečnou převahu nad ostatními částmi Rusi.\n\nTomu je konec! Mé mocné činy a obávaná pověst přilákají Seveřany i Slovany a [founder.GetPrimaryTitle.GetNameNoTier] získá hlavní město hodné své velikosti!"
 fp1_major_decisions.0011.a: "$c_kiev$ bude skvělé hlavní město!"
 fp1_major_decisions.0011.b: "[new_rus_capital.GetNameNoTierNoTooltip] je skutečným zdrojem naší velikosti!"
 fp1_major_decisions.0012.t: "$fp1_major_decisions.0011.t$"
 fp1_major_decisions.0012.desc: "[Select_CString(founder.IsFemale,'Má lenní paní','Můj lenní pán')], [founder.GetTitledFirstName], využívá sílu svého jména a pověsti k vybudování velkolepého hlavního města. [new_rus_capital.GetNameNoTier] se tak začíná měnit v centrum, které má jednoho dne spojovat všechny země Rusi."
 fp1_major_decisions.0012.a: "Hlavní město, jaké se sluší!"
 fp1_major_decisions.0012.b: "Pche, jen další doupě spodiny a ničemů."
 fp1_major_decisions.0013.t: "$fp1_major_decisions.0011.t$"
 fp1_major_decisions.0013.desc: "[founder.GetTitledFirstName], [Select_CString(founder.IsFemale,'barbarská válečnice','barbarský válečník')], využívá sílu svého jména a pověsti a [Select_CString(founder.IsFemale,'vyzvala','vyzval')] všechny potulné Varjagy a krvelačné Slovany, aby [Select_CString(founder.IsFemale,'jí','mu')] přísahali věrnost.\n\nUž teď se pod [Select_CString(founder.IsFemale,'jejím','jeho')] praporem shromažďují dobrodruzi, piráti, nájezdníci i zloději a počet obyvatel [new_rus_capital.GetNameNoTier] prudce roste."
 fp1_major_decisions.0013.a: "[new_rus_capital.GetNameNoTierNoTooltip] zní... docela bohatě..."
 fp1_major_decisions.0013.b: "Pořád jsou to jen zaostalí cizinci."
 fp1_major_decisions.0013.c: "A jak přesně se mě tohle týká?"
 fp1_major_decisions.0021.t: "Království pirátů"
 fp1_major_decisions.0021.desc: "Roky jsem [Select_CString(founder.IsFemale,'brázdila vodní cesty světa, plenila, drancovala a pálila','brázdil vodní cesty světa, plenil, drancoval a pálil')]. [Select_CString(founder.IsFemale,'Nakradla','Nakradl')] jsem více zlata, než většina králů kdy spatří, a mé jméno proklínají od Irského moře až po Kataj.\n\nBezpochyby jsem [Select_CString(founder.IsFemale,'nejnechvalněji proslulá žena','nejnechvalněji proslulý muž')] na světě, Pohroma moří, a veškerou kořist i svou pověst jsem [Select_CString(founder.IsFemale,'vložila','vložil')] do rozsáhlého osidlování a opevňování $c_isle_of_man$.\n\nLidé po celém světě mě proklínají jako [Select_CString(founder.IsFemale,'nejhorší pirátku','nejhoršího piráta')], o jaké kdy slyšeli.\n\nAle #EMP slyšeli#! o mně."
 fp1_major_decisions.0021.a: "Jsem [founder.GetLadyLord|U] krve a zlata!"
 fp1_major_decisions.0021.b: "Konečně se můj sen splnil..."
 fp1_major_decisions.0022.t: "$fp1_major_decisions.0021.t$"
 fp1_major_decisions.0022.desc: "Už léta je veřejným tajemstvím, že [founder.GetFirstName] odmítá přijmout jakoukoli korunu kromě jediné: [founder.GetPrimaryTitle.GetNameNoTier].\n\nTouha po ní trvá tak dlouho, až se zdá, že [founder.GetTitledFirstNameNoTooltip] [Select_CString(founder.IsFemale,'zasvětila','zasvětil')] celý svůj život upevnění moci a autority svého ostrovního domova.\n\nPo nesčetných nájezdech, válkách a všeobecném krveprolití [founder.GetFirstNameNoTooltip] konečně [Select_CString(founder.IsFemale,'uspěla','uspěl')].\n\nKaždý drahokam v nové koruně prý pochází z jiného nájezdu. Někteří u dvora dokonce šeptají, že v ní stále zbývají prázdná lůžka, která může [founder.GetTitledFirstNameNoTooltip] ještě zaplnit."
 fp1_major_decisions.0022.a: "Jen si představte, kolik zlata vyděláme!"
 fp1_major_decisions.0022.b: "A #EMP [founder.GetTitleAsNameNoTooltip]#!? [founder.GetFirstNameNoTooltip] je [Select_CString(founder.IsFemale,'horší než loupeživá baronka','horší než loupeživý baron')]!"
 fp1_major_decisions.0023.t: "$fp1_major_decisions.0021.t$"
 fp1_major_decisions.0023.desc: "I ten nejubožejší sedlák na Britských ostrovech už slyšel o postrachu jménem [founder.GetFirstName], Pohromě moří, i o celoživotním úsilí získat uznání pro vysněné panství plenících pirátů.\n\nJe to legenda, která nahání strach pánům i prostým nevolníkům, ale v poslední době se hranice mezi mýtem a historií zřejmě začala stírat.\n\nDnes #EMP [founder.GetTitleAsNameNoTooltip]#! [founder.GetFirstNameNoTooltip] [Select_CString(founder.IsFemale,'oznámila','oznámil')], že životní dílo je završeno.\n\nBritánie má při svých březích nové království a je to děsivá podívaná."
 fp1_major_decisions.0023.a: "Nás snad #EMP plenit#! nebude, že ne?"
 fp1_major_decisions.0023.b: "Nic víc než [founder.GetTitleAsNameNoTooltip] zlodějů!"
 fp1_major_decisions.0031.t: "Založení jómských vikingů"
 fp1_major_decisions.0031.desc: "Díky své moci a prestiži jsem [Select_CString(founder.IsFemale,'shromáždila','shromáždil')] skupinu těch nejzuřivějších fanatiků v celé Skandinávii, jejichž vírou je [founder.GetFaith.GetName], a [Select_CString(founder.IsFemale,'zocelila','zocelil')] je ve válečnický řád. V jeho čele stojí [leader.Custom('SisterBrother')] [leader.GetFirstNameNoTooltip]!\n\nPřes moře, v zemích Slovanů a Baltů, budou tito $d_jomsvikings$ vzkvétat. Nájezdy a střety s místními je zocelí a přilákají k nim jen ty, kdo si zaslouží se k nim přidat.\n\nZa čest nabídnou válečníky a kořist, zatímco zbabělce, konvertity a reformátory potrestají.\n\nOde dneška až do Ragnaröku [founder.GetFaith.GetNameNoTooltip] přetrvá."
 fp1_major_decisions.0031.a.cynical: "Dokud budou bojovat mé války..."
 fp1_major_decisions.0031.a.fallback: "Staré tradice jsou nejlepší!"
 fp1_major_decisions.0032.t: "$fp1_major_decisions.0031.t$"
 fp1_major_decisions.0032.desc: "Ve snaze zastavit příliv konvertitů k abrahámovským vírám a znepokojivé reformní myšlenky některých cyničtějších jarlů [founder.Custom2('MyCharacterIntroduction',ROOT.Char)] [Select_CString(founder.IsFemale,'shromáždila','shromáždil')] skupinu fanatiků, jejichž vírou je [founder.GetFaith.GetName], do formálního válečnického řádu odhodlaného bránit staré tradice. V jeho čele stojí [leader.Custom('SisterBrother')] [leader.GetFirstNameNoTooltip].\n\nZ mohutné pevnosti $b_jomsberg$ hodlají tito bojovníci brázdit Baltské moře, odměňovat zbožnost a trestat nečestnost a zbabělost."
 fp1_major_decisions.0032.a: "Sláva a krev! [founder.GetFaith.HighGodName] s námi!"
 fp1_major_decisions.0032.b: "Takže jsou to piráti?"
 fp1_major_decisions.0033.t: "$fp1_major_decisions.0031.t$"
 fp1_major_decisions.0033.desc.autofounded: "[founder.GetTitledFirstName], [Select_CString(founder.IsFemale,'podnikavá severská dobrodružka','podnikavý severský dobrodruh')], [Select_CString(founder.IsFemale,'zahájila','zahájil')] krutou invazi proti [victim.GetTitledFirstName] a při překvapivém útoku [Select_CString(founder.IsFemale,'vyrvala','vyrval')] území [coup_target.GetNameNoTier] z moci [victim.GetTitledFirstName].\n\nNeobvyklé je, že invaze má zjevně náboženský motiv: [founder.GetFirstNameNoTooltip] [Select_CString(founder.IsFemale,'spojila','spojil')] síly s [leader.GetFirstNameNoTooltip], [Select_CString(leader.IsFemale,'fanatičkou přesvědčenou, že','fanatikem přesvědčeným, že')] [founder.GetFaith.GetName] je jediná pravá víra. Společně založili válečnický řád, který nazývají $d_jomsvikings$. [leader.Custom('SisterBrother')|U] [leader.GetFirstNameNoTooltip] stojí v jeho čele."
 fp1_major_decisions.0033.desc.decision_founded: "Po letech tažení [founder.GetTitledFirstName], [Select_CString(founder.IsFemale,'fanatička přesvědčená, že','fanatik přesvědčený, že')] [founder.GetFaith.GetName] je jediná pravá víra, konečně [Select_CString(founder.IsFemale,'shromáždila','shromáždil')] dost následovníků, aby [Select_CString(founder.IsFemale,'proměnila','proměnil')] svůj sen ve skutečnost: v nově vybudované pevnosti $b_jomsberg$ [Select_CString(founder.IsFemale,'založila','založil')] nový válečnický řád na obranu své víry a [leader.Custom('SisterBrother')|l] [leader.GetFirstNameNoTooltip] stojí v jeho čele.\n\nZrodili se $d_jomsvikings$."
 fp1_major_decisions.0033.desc.outro: "\n\nŘád tvrdí, že bude prosazovat staré tradice a zasazovat rány vyznavačům abrahámovských náboženství, reformátorům i soupeřícím pohanům a zanechávat za sebou krvavou stopu po celém Baltském moři."
 fp1_major_decisions.0033.a: "Všichni poznají [founder.GetFaith.HighGodNamePossessive] hněv!"
 fp1_founder_founded_the_jomsviking_tt: "Byl založen [Concept('holy_order','svatý řád')|E] pro [Concept('faith','víru')|E], kterou vyznává [founder.GetTitledFirstNameNoTooltip]\n$EFFECT_LIST_BULLET$[founder.GetFirstNameNoTooltip] [Select_CString(founder.IsFemale,'se stala','se stal')] [Concept('holy_order_patron','patronem svatého řádu')|E]"
 fp1_major_decisions.0033.b.competition: "Hm, konkurence, říkáš?"
 fp1_major_decisions.0033.b.heathens: "#EMP Ach jo...#! Zase další pohanští nájezdníci?"
 fp1_major_decisions.1001.t: "[ROOT.Char.GetTitleAsNameNoTooltip] Severního moře"
 fp1_major_decisions.1001.desc.dumb: "Žiji si vskutku pohádkově. Jako [ROOT.Char.GetTitleAsNameNoTooltip] jsem všeobecně [Select_CString(ROOT.Char.IsFemale,'považována','považován')] za moudrou, laskavou a #EMP nesmírně mocnou#! osobu, jako by celý svět tvrdil: „[ROOT.Char.GetFaith.HighGodName] tě má ze všech nejraději.“\n\nVšichni mí dvořané se mnou samozřejmě souhlasí a často mi to připomínají, zejména [sycophant.Custom2('MyCharacterIntroduction',ROOT.Char)].\n\nVždyť [sycophant.GetFirstNameNoTooltip] dokonce tvrdí, že samotný příliv poslouchá mé rozkazy a obrátil by se zpět, kdybych mu to jen pošeptal..."
 fp1_major_decisions.1001.desc.smart: "Jako [ROOT.Char.GetTitleAsNameNoTooltip] jsem doslova #EMP obklopen#! lidmi, kteří se mohou přetrhnout, aby mi připomínali, jak jsem [Select_CString(ROOT.Char.IsFemale,'úžasná a mocná','úžasný a mocný')].\n\nObvykle to přecházím mávnutím ruky. Od zoufalců v přítomnosti někoho mého postavení se takové patolízalství prostě očekává.\n\nDnes však dosáhlo #EMP nesnesitelných#! rozměrů. [sycophant.Custom2('MyCharacterIntroduction',ROOT.Char)] mě při snídani dokonce [Select_CString(sycophant.IsFemale,'přerušila','přerušil')], aby mi [Select_CString(sycophant.IsFemale,'sdělila','sdělil')], že podle [Select_CString(sycophant.IsFemale,'ní','něj')] by se samotný příliv obrátil zpět už při pouhém náznaku mého rozkazu.\n\nPřes očividnou a žaludek obracející nepravdivost toho tvrzení mi to vnuklo jistý nápad..."
 fp1_major_decisions.1001.a: "Na pláž!"
 fp1_major_decisions.1001.a.tt: "Ty i celý tvůj dvůr se vydáte k moři..."
 fp1_major_decisions.1001.b: "I medová slova jsou pořád jen slova."
 fp1_major_decisions.1002.t: "$fp1_major_decisions.1001.t$"
 fp1_major_decisions.1002.desc.dumb: "Celé odpoledne sedíme na pobřeží a můj dvůr se třese zimou v ostrém severním větru.\n\nMinutu za minutou, hodinu za hodinou prohlašuji směrem k oceánu: „Dál ani krok! Jsem tvůj [ROOT.Char.GetTitleAsNameNoTooltip] a nenechám se smáčet někým, jako jsi ty!“\n\nVzpurná voda se však přibližuje stále víc, až mi začne omývat chodidla. Mí následovníci vypadají rozpačitě a nikdo se mi nechce podívat do očí. Patrně se #EMP stydí#!, že musejí být svědky tak naprostého projevu #EMP slabosti#! svého vládce."
 fp1_major_decisions.1002.desc.smart: "Protože dnes nemám nic lepšího na práci, donutím #EMP celý#! svůj dvůr strávit odpoledne u moře a sledovat mě, jak sedím na trůnu v korunovačním rouchu a křičím na moře, aby přestalo postupovat do vnitrozemí.\n\nVoda samozřejmě neposlechne.\n\nPo pěti minutách mí následovníci pochopí, oč mi jde.\n\nPo pěti hodinách, když mi vlny konečně začnou omývat chodidla, pochopí i mé odhodlání.\n\nJsem [ROOT.Char.GetTitleAsNameNoTooltip] a ze mě si nikdo blázna dělat nebude."
 fp1_major_decisions.1002.a: "Jsem jen [Select_CString(ROOT.Char.IsFemale,'smrtelná žena','smrtelný muž')] a znám své meze. Měli byste je znát i vy."
 fp1_major_decisions.1002.b: "Vidíte, jak #EMP nicotná#! je moc králů a královen vedle té, kterou má [ROOT.Char.GetFaith.HighGodName]!"
 fp1_major_decisions.1002.c: "#EMP PRCHEJTE!#! Moře a [ROOT.Char.GetFaith.DevilName] spojili své síly!"
 fp1_major_decisions.1002.d: "Drzé spratkovské moře! Podejte mi bič!"
 fp1_major_decisions.1002.d.tt: "Bičuješ vodu, dokud se nepodrobí"
 fp1_major_decisions.1002.e: "Možná se musím naučit ovládat ještě něco jiného než jen své panství..."
 fp1_major_decisions.1011.t: "Král pro $k_norway$"
 fp1_major_decisions.1011.desc.intro: "Před mnoha lety jsem [Select_CString(ROOT.Char.IsFemale,'přísahala','přísahal')], že si nikdy neostříhám vlasy, dokud nezískám vznešený titul krále $k_norway$."
 fp1_major_decisions.1011.desc.gyda: "Z lásky k [gyda.GetTitledFirstName],"
 fp1_major_decisions.1011.desc.oath: "Pro slávu svého rodu a odkaz svých dětí"
 fp1_major_decisions.1011.desc.outro: "bych [Select_CString(ROOT.Char.IsFemale,'dobyla','dobył')] třeba sto království.\n\nTeď je úkol splněn a už mě nic nenutí dál nosit vlasy tak dlouhé a rozcuchané.\n\nZbývá jediná otázka: co se svou hřívou udělám?"
 fp1_major_decisions.1011.a: "Má přísaha je splněna!"
 fp1_major_decisions.1011.b: "[gyda.GetFirstNameNoTooltip] a já můžeme být konečně spolu!"
 fp1_major_decisions.1011.c: "Vlasy zůstanou. Jsou připomínkou všech bojů, kterými jsem prošel."
 fp1_major_decisions.1011.c.tt: "Nadále budeš znám jako $nick_tanglehair$"
 fp1_major_decisions.1012.t: "[king_of_norway.GetTitledFirstNameNoTooltip] získal $k_norway$ jako první"
