l_polish:
 high_king_of_the_seas_fp1_modifier: "Velekrál moří"
 high_king_of_the_seas_fp1_modifier_desc: "Tato postava je nezpochybnitelným vládcem Severního moře, svrchovaným thalassokratem."
 high_queen_of_the_seas_fp1_modifier: "Velekrálovna moří"
 high_queen_of_the_seas_fp1_modifier_desc: "$high_king_of_the_seas_fp1_modifier_desc$"
 defiant_high_king_conversion_boost_modifier: "Vzpurný velekrál"
 defiant_high_king_conversion_boost_modifier_desc: "Tato postava uctívá staré bohy a udělá cokoli, aby dokázala, že by je měli uctívat i ostatní.\n\nVýrazně rychlejší [Concept('convert_county','$task_conversion$')|E] proti [Concept('organized','organizovaným')|E] [Concept('faiths','vírám')|E]"
 defiant_high_queen_conversion_boost_modifier: "Vzpurná velekrálovna"
 defiant_high_queen_conversion_boost_modifier_desc: "$defiant_high_king_conversion_boost_modifier_desc$"
 scandinavian_adventurer_fp1_modifier: "Vikinský vyhnanec"
 scandinavian_adventurer_fp1_modifier_desc: "Tato postava uprchla ze Skandinávie s armádou darebáků a dobrodruhů a hledá místo, kde by si vydobyla vlastní panství."
 nithing_fp1_modifier: "Nithing"
 nithing_fp1_modifier_desc: "$north_germanic_group_collective_noun$ tuto postavu považují za nikoho, za mrtvou a horší než otroka."
 stingy_host_fp1_modifier: "Skoupý hostitel"
 stingy_host_fp1_modifier_desc: "Tato postava je známá tím, že u svého dvora odmítá nabídnout byť jen teplé jídlo lidem, které nepovažuje za důležité."
 generous_host_fp1_modifier: "Štědrý hostitel"
 generous_host_fp1_modifier_desc: "Tato postava je známá tím, že poutníky a pocestné přijímá s úctou, zdvořilostí a teplým jídlem."
 phantom_island_trivia_fp1_modifier: "Záhady Atlantiku"
 phantom_island_trivia_fp1_modifier_desc: "Tato postava zná mnoho zajímavých příběhů o tajemných ostrovech Atlantiku."
 phantom_island_critique_fp1_modifier: "Kritické myšlení"
 phantom_island_critique_fp1_modifier_desc: "Tato postava je známá svou nedůvěrou k přehnaným báchorkám, které vyprávějí někteří námořníci."
 exotic_foreign_lord_fp1_modifier: "Exotický cizozemský vládce"
 exotic_foreign_lord_fp1_modifier_desc: "V islámském světě je tato postava známá jako vládce podivného a fascinujícího pohanského panství."
 horrifying_foreign_lord_fp1_modifier: "Děsivý cizozemský vládce"
 horrifying_foreign_lord_fp1_modifier_desc: "Po celém islámském světě kolují příběhy o děsivých pohanských obětech, které se v panství této postavy staly běžnou součástí života."
 draugr_healthy_hiking_fp1_modifier: "Zdravé túry"
 draugr_healthy_hiking_fp1_modifier_desc: "Tato postava strávila nesmírné množství času bezvýsledným putováním divočinou svého panství při lovu příšer."
 ultimate_blasphemer_modifier: "Největší rouhač"
 ultimate_blasphemer_modifier_desc: "Tato postava obětovala vlastní [Concept('head_of_faith','hlavu víry')|E] božstvům jiné [Concept('faithpossessive','víry')|E]. Nikdo ji už nepovažuje za skutečného člena společenství věřících."
 embraced_local_traditions_modifier: "Přijaté místní tradice"
 embraced_local_traditions_modifier_desc: "Tato původně skandinávská postava přijala kulturu a víru své nové domoviny, přesto však stále může vztyčovat #V runové kameny#!."
 settled_norse_dynasty_modifier: "Usazená dynastie"
 settled_norse_dynasty_modifier_desc: "Tato skandinávská dynastie se usadila v cizích zemích.\n#weak Dokud tento modifikátor trvá, skandinávští dobrodruzi nebudou cílit na vládce této dynastie.#!"
 fp1_focusing_on_rule_modifier: "Soustředění na vládu"
 fp1_focusing_on_rule_modifier_desc: "Tato postava se soustředí výhradně na vládu, a to na úkor ostatních potřeb svého života."
 fp1_ignoring_annoyances_modifier: "Přehlížení malicherností"
 fp1_ignoring_annoyances_modifier_desc: "Tato postava nemá čas na otravné malichernosti a dětinské rozmary."
 fp1_avoiding_the_snow_modifier: "Vyhýbání se sněhu"
 fp1_avoiding_the_snow_modifier_desc: "Tato postava dostala vyhubováno za to, že tráví příliš mnoho času venku v zimě."
 fp1_daydreaming_about_diplomacy_modifier: "Snění o státnických záležitostech"
 fp1_daydreaming_about_diplomacy_modifier_desc: "Tato postava strávila značnou dobu tím, že si v duchu plánovala budoucí diplomatickou politiku."
 fp1_daydreaming_about_martial_modifier: "Snění o strategii"
 fp1_daydreaming_about_martial_modifier_desc: "Tato postava strávila značnou dobu tím, že si v duchu plánovala budoucí války."
 fp1_daydreaming_about_stewardship_modifier: "Snění o zlatě"
 fp1_daydreaming_about_stewardship_modifier_desc: "Tato postava strávila značnou dobu tím, že si v duchu plánovala, jak v budoucnu vybrat více daní."
 fp1_daydreaming_about_intrigue_modifier: "Snění o intrikách"
 fp1_daydreaming_about_intrigue_modifier_desc: "Tato postava strávila značnou dobu tím, že v duchu zvažovala, kdo je další na řadě."
 fp1_daydreaming_about_learning_modifier: "Snění o knihách"
 fp1_daydreaming_about_learning_modifier_desc: "Tato postava strávila značnou dobu vzpomínáním na své oblíbené svazky."
 fp1_excellent_longships_modifier: "Vynikající langskipy"
 fp1_excellent_longships_modifier_desc: "Langskipy této postavy prořezávají vlny jako čepel tělo mnicha."
 fp1_rotting_longships_modifier: "Tlející langskipy"
 fp1_rotting_longships_modifier_desc: "Langskipy této postavy se sotva drží na vodě."
 fp1_flagship_leviathan_modifier: "Mořský leviatan"
 fp1_flagship_leviathan_modifier_desc: "Osobní langskip této postavy je #EMP obrovský#! a pojme absurdní množství kořisti."
 fp1_flagship_monster_modifier: "Langskip nestvůr"
 fp1_flagship_monster_modifier_desc: "Osobní langskip této postavy zdobí řezby šelem, nestvůr, výjevů z mýtů a utrpení. Mnohé z postav nápadně připomínají její vazaly a nepřátele."
 fp1_flagship_dragon_modifier: "Dračí langskip"
 fp1_flagship_dragon_modifier_desc: "Osobní langskip této postavy je jako vystřižený ze ság a jeho nezaměnitelnou podobu znají po celém světě."
 fp1_cursed_by_nithing_pole_modifier: "Prokletí nithingovým kůlem"
 fp1_cursed_by_nithing_pole_modifier_desc: "Tuto postavu postihla smrtící kletba nithingového kůlu. #EMP Ví#!, že se blíží její zkáza, jen neví kdy, a strach ji #EMP sžírá zaživa#!."
 fp1_bathing_health_modifier: "Důsledná hygiena"
 fp1_bathing_health_modifier_desc: "Tato postava svědomitě dodržuje koupací návyky, před jídlem si myje ruce a pro hosty má vždy připravený horký ručník."
 fp1_bathing_attraction_modifier: "Bezchybný zevnějšek"
 fp1_bathing_attraction_modifier_desc: "Tato postava je vždy dokonale upravená: zuby oškrábané, vlasy učesané, uši vyčištěné, tělo umyté a po vších ani stopy."
 fp1_yearly_0071_troll_victory_bear_modifier: "Přemožitel medvěda"
 fp1_yearly_0071_troll_victory_bear_modifier_desc: "O této postavě se traduje, že zabila buď trolla, nebo největšího medvěda na světě."
 fp1_yearly_0071_troll_victory_wolf_modifier: "Přemožitel vlka"
 fp1_yearly_0071_troll_victory_wolf_modifier_desc: "Tato postava zabila vlka tak rychlého, že jej prostý lid považoval za trolla."
 fp1_yearly_0071_troll_victory_wolverine_modifier: "Přemožitel rosomáka"
 fp1_yearly_0071_troll_victory_wolverine_modifier_desc: "Tato postava zabila rosomáka tak zuřivého, že jej prostý lid považoval za trolla, a učinila tak divočinu bezpečnější."
 fp1_yearly_0071_troll_victory_lynx_modifier: "Přemožitel rysa"
 fp1_yearly_0071_troll_victory_lynx_modifier_desc: "Tato postava zabila rysa tak tichého, že jej prostý lid považoval za trolla."
 fp1_yearly_0071_troll_victory_moose_modifier: "Přemožitel losa"
 fp1_yearly_0071_troll_victory_moose_modifier_desc: "Tato postava zabila losa tak zuřivého, že jej prostý lid považoval za trolla."
 fp1_yearly_0551_absent_lord_modifier: "Nepřítomný vládce"
 fp1_yearly_0551_absent_lord_modifier_desc: "Z nějakého důvodu se tato postava téměř nikdy nezdržuje na vlastním dvoře. Zvlášť v době večeře."
 fp1_abased_before_highgod_modifier: "Kde spočívá pravá moc"
 fp1_abased_before_highgod_modifier_desc: "Tato postava odmítá nasadit korunu a trvá na tom, že #EMP skutečná#! moc náleží pouze božství."
 harald_tanglehairs_vow_modifier: "Přísaha zacuchaných vlasů"
 harald_tanglehairs_vow_modifier_desc: "Tato postava složila celoživotní přísahu: dokud se nestane prvním králem Norska, vlasy si ani neostříhá, ani neučeše."
 harald_tanglehairs_reminder_modifier: "Splněná přísaha zacuchaných vlasů"
 harald_tanglehairs_reminder_modifier_desc: "Tato postava úspěšně splnila celoživotní přísahu, že si neostříhá ani neučeše vlasy, dokud se nestane králem Norska. Nyní je nechává tak i nadále jako připomínku své cesty."
 harald_tanglehairs_vow_broken_modifier: "Porušená přísaha zacuchaných vlasů"
 harald_tanglehairs_vow_broken_modifier_desc: "Tato postava svou celoživotní přísahu nesplnila: protože se nestala prvním králem Norska, už si nikdy nesmí ostříhat ani učesat vlasy."
 fp1_0511_carries_stinking_trophy_modifier: "Páchnoucí trofej"
 fp1_0511_carries_stinking_trophy_modifier_desc: "Tuto postavu všude doprovází hnijící trofej obalená larvami. Někteří tvrdí, že její zápach je cítit na celé míle."
 fp1_reprieve_from_sa_modifier: "Oddech od skandinávských dobrodruhů"
 fp1_reprieve_from_sa_modifier_desc: "Této postavě se nějakým způsobem podařilo získat trochu klidu od neúnavných vikinských hord.\n$EFFECT_LIST_BULLET$ Bezzemští skandinávští dobrodruzi na ni nezaútočí"
 shieldmaiden_level_martial_1_fp1_modifier: "Zkušenost ve velení"
 shieldmaiden_level_martial_1_fp1_modifier_desc: "Tato postava pracovala na svých velitelských schopnostech usilovněji než většina ostatních."
 shieldmaiden_level_martial_2_fp1_modifier: "Ostřílenost ve velení"
 shieldmaiden_level_martial_2_fp1_modifier_desc: "$shieldmaiden_level_martial_1_fp1_modifier_desc$"
 shieldmaiden_level_martial_3_fp1_modifier: "Zocelenost ve velení"
 shieldmaiden_level_martial_3_fp1_modifier_desc: "$shieldmaiden_level_martial_1_fp1_modifier_desc$"
 shieldmaiden_level_prowess_1_fp1_modifier: "Zkušenost v boji"
 shieldmaiden_level_prowess_1_fp1_modifier_desc: "Zdá se, že tato postava nikdy nepřestává cvičit s čepelí."
 shieldmaiden_level_prowess_2_fp1_modifier: "Proslulost v boji"
 shieldmaiden_level_prowess_2_fp1_modifier_desc: "$shieldmaiden_level_prowess_1_fp1_modifier_desc$"
 shieldmaiden_level_prowess_3_fp1_modifier: "Legenda boje"
 shieldmaiden_level_prowess_3_fp1_modifier_desc: "$shieldmaiden_level_prowess_1_fp1_modifier_desc$"
 shieldmaiden_level_intrigue_1_fp1_modifier: "Lstivé podrazy"
 shieldmaiden_level_intrigue_1_fp1_modifier_desc: "Tato postava neustále hledá příležitosti, jak využít slabin svých nepřátel."
 shieldmaiden_level_intrigue_2_fp1_modifier: "Pověstné podrazy"
 shieldmaiden_level_intrigue_2_fp1_modifier_desc: "$shieldmaiden_level_intrigue_1_fp1_modifier_desc$"
 shieldmaiden_level_intrigue_3_fp1_modifier: "Nechvalně proslulé podrazy"
 shieldmaiden_level_intrigue_3_fp1_modifier_desc: "$shieldmaiden_level_intrigue_1_fp1_modifier_desc$"
 nithing_exiled_fp1_modifier: "Vyhnaný místní nithing"
 nithing_exiled_fp1_modifier_desc: "Místní komunity mohou klidně spát s vědomím, že jeden ničema byl po zásluze potrestán."
 nithing_harboured_fp1_modifier: "Ukrývaný místní nithing"
 nithing_harboured_fp1_modifier_desc: "Místní komunity opovrhují svým lenním pánem za to, že poskytuje ochranu známému ničemovi."
 nithing_in_limbo_fp1_modifier: "Stavovské napětí"
 nithing_in_limbo_fp1_modifier_desc: "Některé skupiny u dvora se pravidelně dostávají do sporů s místními komunitami."
 draugr_remedies_succeeded_fp1_modifier: "Draugr zahnán"
 draugr_remedies_succeeded_fp1_modifier_desc: "Ať už po dobrém, nebo po zlém, oživlá mrtvola, která toto hrabství nepochybně sužovala, už nepředstavuje hrozbu."
 draugr_remedies_failed_fp1_modifier: "Draugr sužuje místní"
 draugr_remedies_failed_fp1_modifier_desc: "Navzdory veškerému úsilí živých toto hrabství sužují pohromy, kletby a neštěstí."
 draugr_monstrous_wolfpack_fp1_modifier: "Vytí v noci"
 draugr_monstrous_wolfpack_fp1_modifier_desc: "Divočinou tohoto hrabství se toulá nezvykle hladová a agresivní vlčí smečka, která trhá dobytek i osamělé pocestné."
 draugr_monstrous_bear_fp1_modifier: "Nebezpečná divočina"
 draugr_monstrous_bear_fp1_modifier_desc: "Obrovský medvěd v tomto hrabství útočí bez varování. Někdy odnese jedinou krávu, jindy povraždí celou rodinu."
 draugr_nithing_fp1_modifier: "Přízračný psanec"
 draugr_nithing_fp1_modifier_desc: "Někdo v něm vidí chodící mrtvolu, jiný jen tichého zloděje, ale všichni se shodují, že místní sužuje kleptomanský přízrak."
 draugr_nothing_found_fp1_modifier: "Pověrčiví rolníci"
 draugr_nothing_found_fp1_modifier_desc: "Navzdory veškeré snaze lenního pána dokázat opak místní prostý lid trvá na tom, že jej pronásledují mrtví, kteří vstali z hrobu."
 capital_of_rus_opinion_modifier: "Rozrůstající se hlavní město"
 capital_of_rus_opinion_modifier_desc: "Neustálý příliv zboží, obchodníků a otroků do tohoto hrabství přinesl jeho obyvatelům nebývalou spokojenost."
 capital_of_rus_misc_benefits_modifier: "Varjažské hlavní město"
 capital_of_rus_misc_benefits_modifier_desc: "Toto sídlo je #EMP tím#! hlavním centrem oblasti pro Slovany i Seveřany a těží z přítomnosti nesčetných skupin dobrodruhů, dobyvatelů a pirátů."
 held_grand_sacrifice_fp1_modifier: "Účast na velké oběti"
 held_grand_sacrifice_fp1_modifier_desc: "Rolníci tohoto hrabství mohou klidně spát s vědomím, že bohové přejí těm, kdo jim vzdávají náležitou úctu."
 commoners_grand_sacrifice_fp1_modifier: "Účast na velké lidové oběti"
 commoners_grand_sacrifice_fp1_modifier_desc: "Rolníci v tomto hrabství dodnes vyprávějí, jak se při poslední velkolepé hostině na počest bohů volně mísili se šlechtou."
 held_human_sacrifice_fp1_modifier: "Zděšení z lidské oběti"
 held_human_sacrifice_fp1_modifier_desc: "Rolníci se bouří proti tomu, že jim vládne někdo, kdo praktikuje rituální zabíjení lidí."
 trade_instead_of_raid_fp1_modifier: "Obchodní vazby s nájezdníky"
 trade_instead_of_raid_fp1_modifier_desc: "Toto hrabství výrazně zbohatlo díky obchodu s potenciálními nájezdníky namísto boje proti nim. Nejbohatší místní nosí exotické oděvy a cetky ukořistěné v dalekých zemích."
 fp1_stele_ancestors_strong: "Runový kámen předků"
 fp1_stele_ancestors_strong_custom_desc: "[ROOT.Char.Custom2_Title('SteleCommemoratesAncestors', SCOPE.sTitle('stele_location'))]"
 fp1_stele_ancestors_weak: "$fp1_stele_ancestors_strong$"
 fp1_stele_conquest_strong: "Dobyvatelský runový kámen"
 fp1_stele_conquest_strong_custom_desc: "[ROOT.Char.Custom2_Title('SteleCommemoratesConquest', SCOPE.sTitle('stele_location'))]"
 fp1_stele_conquest_weak: "$fp1_stele_conquest_strong$"
 fp1_stele_promotion_strong: "Runový kámen vlivu"
 fp1_stele_promotion_strong_custom_desc: "[ROOT.Char.Custom2_Title('SteleCommemoratesPromotion', SCOPE.sTitle('stele_location'))]"
 fp1_stele_promotion_weak: "$fp1_stele_promotion_strong$"
 fp1_yearly_0591_levy_modifier: "Podpora na thingu"
 fp1_yearly_0591_levy_modifier_desc: "Malicherné spory na místním thingu nedávno tomuto hrabství vynesly pásy pohraniční půdy, na nichž začaly vyrůstat nové vesnice."
 fp1_yearly_0591_building_modifier: "Vítězství na thingu"
 fp1_yearly_0591_building_modifier_desc: "Politický vliv získaný na místním thingu umožnil tomuto hrabství nárokovat několik menších pohraničních území a uvolnil tak dostatek prostoru pro rozšiřování stávajících sídel."
 fp1_yearly_0591_spurned_modifier: "Pocit odstrčení"
 fp1_yearly_0591_spurned_modifier_desc: "Místní v tomto hrabství #EMP dobře vědí#!, že jejich lenní pán dává přednost sousednímu hrabství."
 fp1_yearly_0591_otherwise_occupied_modifier: "Jiné starosti"
 fp1_yearly_0591_otherwise_occupied_modifier_desc: "Toto hrabství je příliš zaměstnané bojem se sousedními rivaly, než aby podněcovalo nepokoje proti svému lennímu pánovi."
 fp1_yearly_0071_troll_attacks_modifier: "Útoky trolla"
 fp1_yearly_0071_troll_attacks_modifier_desc: "V divočině tohoto hrabství je... #EMP něco#!, co místní děsí, a dokonce zabíjí."
 fp1_mann_pirate_capital_modifier: "Ukradené město"
 fp1_mann_pirate_capital_modifier_desc: "Místní hlavní město si svou přezdívku vysloužilo krví, strachem a dřinou. Dřina je domácího původu, krev a strach se však dovážejí ze zahraničí. Pravidelně."
 fp1_trade_events_foreign_architects_modifier: "Cizozemští architekti"
 fp1_trade_events_foreign_architects_modifier_desc: "Cizozemští architekti přinášejí ze zahraničí nejnovější styly a stavební postupy."
 fp1_trade_events_foreign_architects_no_growth_modifier: "Cizozemská pomoc"
 fp1_trade_events_foreign_architects_no_growth_modifier_desc: "Cizozemští architekti přinášejí ze zahraničí nejnovější styly, ale se zdejšími vyspělými stavbami už mnoho zlepšit nedokážou."
 fp1_trade_events_raid_consultants_modifier: "Ostřílení nájezdníci ve službách"
 fp1_trade_events_raid_consultants_modifier_desc: "Skupiny ostřílených nájezdníků dostaly štědře zaplaceno, aby toto hrabství chránily před sobě podobnými."
 fp1_legacy_of_piracy_modifier: "Dědictví pirátství"
 fp1_legacy_of_piracy_modifier_desc: "Tato dynastie odvozuje svůj nedávný původ od největšího piráta a nájezdníka své doby. Moře, sůl a kouř jim kolují v krvi a ulpívají na rtech.\n\nMůže [Concept('raid','podnikat nájezdy')|E] bez ohledu na typ [Concept('government','vlády')|E]\nUmožňuje: $game_concept_raid$ v zámoří a plavbu po velkých řekách"
 gruesome_festivals_designated_sacrifice_fp1_modifier: "Čeká na obětování"
 gruesome_festivals_designated_sacrifice_fp1_modifier_desc: "Tato postava byla určena jako [Concept('designate_chief_sacrifice_chief_sacrifice','hlavní oběť')|E]."
 fp1_jomsvikings_caused_faith_crisis_modifier: "Krize víry"
 fp1_jomsvikings_caused_faith_crisis_modifier_desc: "Střet s vůdcem svatého řádu přiměl tuto postavu pochybovat o vlastní víře."
