l_polish:
 high_king_of_the_seas_fp1_modifier: "Vysoký král moří"
 high_king_of_the_seas_fp1_modifier_desc: "Tato postava je nepopiratelným vládcem Severního moře, vrcholným vládcem moří."
 high_queen_of_the_seas_fp1_modifier: "Vysoká královna moří"
 high_queen_of_the_seas_fp1_modifier_desc: "$high_king_of_the_seas_fp1_modifier_desc$"
 defiant_high_king_conversion_boost_modifier: "Vzpourný Vysoký král"
 defiant_high_king_conversion_boost_modifier_desc: "Tato postava uctívá Staré bohy a půjde do krajností, aby ukázala, že by to měli dělat i ostatní.\n\nVýrazné zvýšení rychlosti [Concept('convert_county','$task_conversion$')|E] proti [Concept('organized','organizované')|E] [Concept('faiths','vírům')|E]" # todo: CONCEPT CASE
 defiant_high_queen_conversion_boost_modifier: "Vzpourná Vysoká královna"
 defiant_high_queen_conversion_boost_modifier_desc: "$defiant_high_king_conversion_boost_modifier_desc$"
 scandinavian_adventurer_fp1_modifier: "Vikingský vyhnanec"
 scandinavian_adventurer_fp1_modifier_desc: "Tato postava uprchla ze Skandinávie s armádou výtržníků a dobrodruhů, aby si jinde vybudovala vlastní říši."
 nithing_fp1_modifier: "Nithing"
 nithing_fp1_modifier_desc: "Tato postava je pro $north_germanic_group_collective_noun$ nic, považována za mrtvou, níže než i otrok."
 stingy_host_fp1_modifier: "Skoupý hostitel"
 stingy_host_fp1_modifier_desc: "Tato postava je známá tím, že odmítne i nevýznamným lidem teplé jídlo na svém dvoře."
 generous_host_fp1_modifier: "Štědrý hostitel"
 generous_host_fp1_modifier_desc: "Tato postava je známá tím, že toulavce vítá s respektem, zdvořilostí a teplým jídlem."
 phantom_island_trivia_fp1_modifier: "Tajemství Atlantiku"
 phantom_island_trivia_fp1_modifier_desc: "Tato postava si pamatuje mnoho zajímavých příběhů o tajemných ostrovech Atlantského oceánu."
 phantom_island_critique_fp1_modifier: "Kritický myslitel"
 phantom_island_critique_fp1_modifier_desc: "Tato postava je proslulá svým skepticizmem vůči vyprávěním některých námořníků."
 exotic_foreign_lord_fp1_modifier: "Exotický cizí pán"
 exotic_foreign_lord_fp1_modifier_desc: "Tato postava je v islámském světě známá jako pán podivného a fascinujícího pohanského panství."
 horrifying_foreign_lord_fp1_modifier: "Děsivý cizí pán"
 horrifying_foreign_lord_fp1_modifier_desc: "V islámském světě kolují příběhy o děsivých pohanských obětech, které sužují panství této postavy."
 draugr_healthy_hiking_fp1_modifier: "Zdravé toulání"
 draugr_healthy_hiking_fp1_modifier_desc: "Tato postava strávila obrovské množství času marnými toulkami divočinou svého panství, hledajíc příšery."
 ultimate_blasphemer_modifier: "Největší rouhač"
 ultimate_blasphemer_modifier_desc: "Tato postava obětovala svého vlastního [Concept('head_of_faith','hlavy víry')|E] jiným [Concept('faithpossessive','vírem')|E] božstvům. Nikdo ji nepovažuje za věrného člena věřících." # todo: CONCEPT CASE
 embraced_local_traditions_modifier: "Přijal místní tradice"
 embraced_local_traditions_modifier_desc: "Tato kdysi skandinávská postava přijala kulturu a víru své nové vlasti, i když stále může vztyčovat #V runové kameny#!."
 settled_norse_dynasty_modifier: "Usazená dynastie"
 settled_norse_dynasty_modifier_desc: "Tato skandinávská dynastie se usadila v cizích krajích.\n#weak Po dobu trvání tohoto modifikátoru nebudou vládcové této dynastie cílem skandinávských dobrodruhů.#!"
 fp1_focusing_on_rule_modifier: "Zaměřený na vládu"
 fp1_focusing_on_rule_modifier_desc: "Tato postava se soustředí na vládnutí, a pouze na vládnutí, na úkor jiných povinností v životě."
 fp1_ignoring_annoyances_modifier: "Ignorování nepříjemností"
 fp1_ignoring_annoyances_modifier_desc: "Tato postava nemá čas na nepříjemnosti a drobné projevy dětinské fantazie."
 fp1_avoiding_the_snow_modifier: "Vyhýbání se sněhu"
 fp1_avoiding_the_snow_modifier_desc: "Tato postava byla pokárána za to, že tráví příliš mnoho času venku v chladu."
 fp1_daydreaming_about_diplomacy_modifier: "Snění o státních záležitostech"
 fp1_daydreaming_about_diplomacy_modifier_desc: "Tato postava strávila značný čas plánováním diplomatické politiky v mysli."
 fp1_daydreaming_about_martial_modifier: "Snění o strategii"
 fp1_daydreaming_about_martial_modifier_desc: "Tato postava strávila hodně času mentálně plánujíc budoucí války."
 fp1_daydreaming_about_stewardship_modifier: "Snění o zlatě"
 fp1_daydreaming_about_stewardship_modifier_desc: "Tato postava strávila značný čas plánováním, jak vybrat budoucí daně."
 fp1_daydreaming_about_intrigue_modifier: "Snění o spiknutích"
 fp1_daydreaming_about_intrigue_modifier_desc: "Tato postava strávila hodně času přemýšlením, kdo bude další na seznamu."
 fp1_daydreaming_about_learning_modifier: "Snění o knihách"
 fp1_daydreaming_about_learning_modifier_desc: "Tato postava strávila mnoho času vzpomínáním na své oblíbené svazky."
 fp1_excellent_longships_modifier: "Výborné dlouhé lodě"
 fp1_excellent_longships_modifier_desc: "Flotila této postavy rozřezává vlny jako čepel skrz mnicha."
 fp1_rotting_longships_modifier: "Shnivé dlouhé lodě"
 fp1_rotting_longships_modifier_desc: "Flotila této postavy je sotva námořně způsobilá."
 fp1_flagship_leviathan_modifier: "Vlajková loď Leviatana"
 fp1_flagship_leviathan_modifier_desc: "Osobní dlouhá loď této postavy je #EMP obrovská#!, schopná pojmout směšné množství kořisti."
 fp1_flagship_monster_modifier: "Monstrózní vlajková loď"
 fp1_flagship_monster_modifier_desc: "Osobní dlouhá loď této postavy je zdobena řezbami zvířat, monster, mýtů a utrpení. Mnohé figury připomínají jejich vazaly a nepřátele."
 fp1_flagship_dragon_modifier: "Drakovitá vlajková loď"
 fp1_flagship_dragon_modifier_desc: "Osobní dlouhá loď této postavy je hrdinou ság, její výrazný vzhled je znám po celém světě."
 fp1_cursed_by_nithing_pole_modifier: "Prokletý nithingovým kůlem"
 fp1_cursed_by_nithing_pole_modifier_desc: "Tato postava byla smrtelně prokleta nithingovým kůlem. #EMP Ví#!, že její zkáza přichází, jen ne kdy, a strach ji #EMP živě#! požírá."
 fp1_bathing_health_modifier: "Důkladné koupání"
 fp1_bathing_health_modifier_desc: "Tato postava dodržuje přísný režim koupání, myje si ruce před jídlem a má pro hosty vždy horký ručník."
 fp1_bathing_attraction_modifier: "Bezvadná prezentace"
 fp1_bathing_attraction_modifier_desc: "Tato postava je vždy bezvadně upravená: zuby vydrhnuté, vlasy pročesané, uši vyčištěné, kůže omytá, a ani náznak vší."
 fp1_yearly_0071_troll_victory_bear_modifier: "Zabijec medvědů"
 fp1_yearly_0071_troll_victory_bear_modifier_desc: "Tato postava je pověstná tím, že zabila buď trolla, nebo největšího medvěda světa."
 fp1_yearly_0071_troll_victory_wolf_modifier: "Zabijec vlků"
 fp1_yearly_0071_troll_victory_wolf_modifier_desc: "Tato postava zabila vlka tak rychlého, že prostý lid věřil, že to byl troll."
 fp1_yearly_0071_troll_victory_wolverine_modifier: "Zabijec rosomáků"
 fp1_yearly_0071_troll_victory_wolverine_modifier_desc: "Tato postava zabila rosomáka tak zuřivého, že prostý lid ho považoval za trolla, a udržela divočinu v bezpečí."
 fp1_yearly_0071_troll_victory_lynx_modifier: "Zabijec rysů"
 fp1_yearly_0071_troll_victory_lynx_modifier_desc: "Tato postava zabila rysa tak tichého, že lidé věřili, že to byl troll."
 fp1_yearly_0071_troll_victory_moose_modifier: "Zabijec losů"
 fp1_yearly_0071_troll_victory_moose_modifier_desc: "Tato postava zabila losa tak rozzuřeného, že prostý lid ho považoval za trolla."
 fp1_yearly_0551_absent_lord_modifier: "Nepřítomný panovník"
 fp1_yearly_0551_absent_lord_modifier_desc: "Tato postava se z nějakého důvodu nikdy nezdá být na svém vlastním dvoře. Zejména v době večeře."
 fp1_abased_before_highgod_modifier: "Kde spočívá pravá moc"
 fp1_abased_before_highgod_modifier_desc: "Tato postava odmítá nasadit korunu a trvá na tom, že #EMP pravá#! moc spočívá pouze v božském."
 harald_tanglehairs_vow_modifier: "Přísaha zacuchaných vlasů"
 harald_tanglehairs_vow_modifier_desc: "Tato postava složila celoživotní přísahu: nebude si stříhat ani česat vlasy, dokud se nestane prvním králem Norska."
 harald_tanglehairs_reminder_modifier: "Splněná přísaha zacuchaných vlasů"
 harald_tanglehairs_reminder_modifier_desc: "Tato postava úspěšně dokončila celoživotní přísahu: nestříhat ani nečesat si vlasy, dokud se nestane králem Norska. Nyní v ní pokračuje jako připomínku své cesty."
 harald_tanglehairs_vow_broken_modifier: "Zlomená přísaha zacuchaných vlasů"
 harald_tanglehairs_vow_broken_modifier_desc: "Tato postava nedokázala dokončit celoživotní přísahu: protože se nestala prvním králem Norska, nesmí si nikdy stříhat ani česat vlasy."
 fp1_0511_carries_stinking_trophy_modifier: "Zapáchající trofej"
 fp1_0511_carries_stinking_trophy_modifier_desc: "Tuto postavu všude doprovází hnijící, larvami pokrytá trofej doslova všude, kam jde. Někteří tvrdí, že miasma sahá míle daleko."
 fp1_reprieve_from_sa_modifier: "Úleva od skandinávských dobrodruhů"
 fp1_reprieve_from_sa_modifier_desc: "Tato postava si nějak získala úlevu od neúnavných vikingských hord.\n$EFFECT_LIST_BULLET$ Nebude napadena bezúzemními skandinávskými dobrodruhy"
 shieldmaiden_level_martial_1_fp1_modifier: "Zkušený velitel"
 shieldmaiden_level_martial_1_fp1_modifier_desc: "Tato postava pracovala tvrději než mnozí, aby zlepšila své velení nad vojáky."
 shieldmaiden_level_martial_2_fp1_modifier: "Veteránský velitel"
 shieldmaiden_level_martial_2_fp1_modifier_desc: "$shieldmaiden_level_martial_1_fp1_modifier_desc$"
 shieldmaiden_level_martial_3_fp1_modifier: "Otrlý velitel"
 shieldmaiden_level_martial_3_fp1_modifier_desc: "$shieldmaiden_level_martial_1_fp1_modifier_desc$"
 shieldmaiden_level_prowess_1_fp1_modifier: "Zkušený bojovník"
 shieldmaiden_level_prowess_1_fp1_modifier_desc: "Tato postava se zdá nikdy nepřestat cvičit se zbraní."
 shieldmaiden_level_prowess_2_fp1_modifier: "Proslulý bojovník"
 shieldmaiden_level_prowess_2_fp1_modifier_desc: "$shieldmaiden_level_prowess_1_fp1_modifier_desc$"
 shieldmaiden_level_prowess_3_fp1_modifier: "Legendární bojovník"
 shieldmaiden_level_prowess_3_fp1_modifier_desc: "$shieldmaiden_level_prowess_1_fp1_modifier_desc$"
 shieldmaiden_level_intrigue_1_fp1_modifier: "Prohnaný zrádce"
 shieldmaiden_level_intrigue_1_fp1_modifier_desc: "Tato postava neustále hledá příležitosti, jak využít své nepřátele."
 shieldmaiden_level_intrigue_2_fp1_modifier: "Proslulý zrádce"
 shieldmaiden_level_intrigue_2_fp1_modifier_desc: "$shieldmaiden_level_intrigue_1_fp1_modifier_desc$"
 shieldmaiden_level_intrigue_3_fp1_modifier: "Nechvalně proslulý zrádce"
 shieldmaiden_level_intrigue_3_fp1_modifier_desc: "$shieldmaiden_level_intrigue_1_fp1_modifier_desc$"
 nithing_exiled_fp1_modifier: "Vyhnaný místní nithing"
 nithing_exiled_fp1_modifier_desc: "Místní komunity klidně spí s vědomím, že darebák byl spravedlivě potrestán."
 nithing_harboured_fp1_modifier: "Ubytovaný místní nithing"
 nithing_harboured_fp1_modifier_desc: "Místní komunity nenávidí, že jejich panovník podporuje známého darebáka."
 nithing_in_limbo_fp1_modifier: "Třídní napětí"
 nithing_in_limbo_fp1_modifier_desc: "Určité prvky dvora se pravidelně střetávají s místními komunitami."
 draugr_remedies_succeeded_fp1_modifier: "Draugr zahnáni"
 draugr_remedies_succeeded_fp1_modifier_desc: "Tím či oním způsobem byl vzkříšený mrtvý, který nepochybně strašil v tomto hrabství, vypořádán."
 draugr_remedies_failed_fp1_modifier: "Draugr sužuje místní"
 draugr_remedies_failed_fp1_modifier_desc: "Navzdory nejlepším snahám živých je toto hrabství zasaženo morem, kletbami a neštěstím."
 draugr_monstrous_wolfpack_fp1_modifier: "Vytí v noci"
 draugr_monstrous_wolfpack_fp1_modifier_desc: "Abnormálně hladová a agresivní vlčí smečka prohání divočinu tohoto hrabství, trhá dobytek a osamělé toulavce."
 draugr_monstrous_bear_fp1_modifier: "Nebezpečná divočina"
 draugr_monstrous_bear_fp1_modifier_desc: "Obrovský medvěd udeří náhodně v tomto hrabství, někdy si odnese jen krávu, jindy povraždí celé rodiny."
 draugr_nithing_fp1_modifier: "Duchový psanec"
 draugr_nithing_fp1_modifier_desc: "Někteří ho nazývají chodícím mrtvým, jiní jen tichým zlodějem, ale všichni souhlasí, že kleptomanský duch obtěžuje místní."
 draugr_nothing_found_fp1_modifier: "Pověrčiví sedláci"
 draugr_nothing_found_fp1_modifier_desc: "Navzdory nejlepším snahám jejich pána to dokázat jinak, místní prostý lid trvá na tom, že je pronásledují vzkříšení mrtví."
 capital_of_rus_opinion_modifier: "Rostoucí hlavní město"
 capital_of_rus_opinion_modifier_desc: "Stálý příliv zboží, kupců a otroků do tohoto hrabství zanechal jeho obyvatele naprosto spokojené."
 capital_of_rus_misc_benefits_modifier: "Varyágské hlavní město"
 capital_of_rus_misc_benefits_modifier_desc: "Toto sídlo je #EMP tím#! regionálním centrem pro Slované i Normany a těší se značným výhodám díky tomu, že je domovem nesčetných skupin dobrodruhů, dobyvatelů a pirátů."
 held_grand_sacrifice_fp1_modifier: "Zúčastnil se Velké oběti"
 held_grand_sacrifice_fp1_modifier_desc: "Sedláci v tomto hrabství klidně spí s vědomím, že bohové se usmívají na ty, kdo přinášejí oběť."
 commoners_grand_sacrifice_fp1_modifier: "Zúčastnil se lidové Velké oběti"
 commoners_grand_sacrifice_fp1_modifier_desc: "Sedláci v tomto hrabství stále vyprávějí, jak se na posledním velikém slavnostním hodování ve jméno bohů volně mísili s šlechtou."
 held_human_sacrifice_fp1_modifier: "Hrůza z lidských obětí"
 held_human_sacrifice_fp1_modifier_desc: "Sedláci jsou rozhořčeni tím, že jim vládne osoba, která provádí rituální vraždy jiných lidí."
 trade_instead_of_raid_fp1_modifier: "Spojení nájezdníků a obchodníků"
 trade_instead_of_raid_fp1_modifier_desc: "Toto hrabství těžce profitovalo z obchodování s potenciálními nájezdníky místo boje s nimi; nejbohatší místní nosí exotické šaty a uloupené ozdoby ze zahraničních zemí."
 fp1_stele_ancestors_strong: "Runový kámen předků"
 fp1_stele_ancestors_strong_custom_desc: "[ROOT.Char.Custom2_Title('SteleCommemoratesAncestors', SCOPE.sTitle('stele_location'))]"
 fp1_stele_ancestors_weak: "$fp1_stele_ancestors_strong$"
 fp1_stele_conquest_strong: "Runový kámen dobytí"
 fp1_stele_conquest_strong_custom_desc: "[ROOT.Char.Custom2_Title('SteleCommemoratesConquest', SCOPE.sTitle('stele_location'))]"
 fp1_stele_conquest_weak: "$fp1_stele_conquest_strong$"
 fp1_stele_promotion_strong: "Runový kámen vlivu"
 fp1_stele_promotion_strong_custom_desc: "[ROOT.Char.Custom2_Title('SteleCommemoratesPromotion', SCOPE.sTitle('stele_location'))]"
 fp1_stele_promotion_weak: "$fp1_stele_promotion_strong$"
 fp1_yearly_0591_levy_modifier: "Podpořeno na tingu"
 fp1_yearly_0591_levy_modifier_desc: "Drobné drama na místním tingovém shromáždění nedávno získalo tomuto hrabství kusy pohraniční půdy, což způsobilo vznik nových vesnic."
 fp1_yearly_0591_building_modifier: "Očistěn na tingu"
 fp1_yearly_0591_building_modifier_desc: "Politický kapitál na místním tingovém shromáždění umožnil tomuto hrabství připojit několik menších pohraničních území, což dává dostatek prostoru pro rozšíření existujících osad."
 fp1_yearly_0591_spurned_modifier: "Cítí se pohrdlý"
 fp1_yearly_0591_spurned_modifier_desc: "Místní v tomto hrabství vědí #EMP fakt#!, že jejich pán dává přednost konkurenčnímu hrabství před jejich vlastním."
 fp1_yearly_0591_otherwise_occupied_modifier: "Jinak zaměstnaný"
 fp1_yearly_0591_otherwise_occupied_modifier_desc: "Toto hrabství je příliš zaneprázdněno boji s rivaly vedle, než aby podněcovalo neklid proti svému pánovi."
 fp1_yearly_0071_troll_attacks_modifier: "Trollí útoky"
 fp1_yearly_0071_troll_attacks_modifier_desc: "V divočině tohoto hrabství je... #EMP něco#!, co děsí a dokonce zabíjí místní."
 fp1_mann_pirate_capital_modifier: "Ukradené město"
 fp1_mann_pirate_capital_modifier_desc: "Místní hlavní město získalo své jméno krví, strachem a prací. Práce je domácí, ale krev a strach jsou přiváženy ze zahraničí. Pravidelně."
 fp1_trade_events_foreign_architects_modifier: "Zahraniční architekti"
 fp1_trade_events_foreign_architects_modifier_desc: "Zahraniční architekti přinášejí nejnovější styly a stavební techniky ze zahraničí."
 fp1_trade_events_foreign_architects_no_growth_modifier: "Zahraniční pomoc"
 fp1_trade_events_foreign_architects_no_growth_modifier_desc: "Zahraniční architekti přinášejí nejnovější styly ze zahraničí, i když toho mnoho nezmůžou pro zlepšení sofistikovaných místních staveb."
 fp1_trade_events_raid_consultants_modifier: "Veteránští nájezdníci v sídle"
 fp1_trade_events_raid_consultants_modifier_desc: "Skupiny veteránských nájezdníků byly zaplaceny nadsazeně, aby chránily toto hrabství před jinými svého druhu."
 fp1_legacy_of_piracy_modifier: "Odkaz pirátství"
 fp1_legacy_of_piracy_modifier_desc: "Tato dynastie sleduje nedávný původ od největšího piráta a nájezdníka věku; moře, sůl a kouř jsou stále v jejich krvi a na jejich rtech.\n\nMůže [Concept('raid','nájezd')|E], bez ohledu na typ [Concept('government','vláda')|E]\nMůže $game_concept_raid$ v zámoří a plout v hlavních řekách" # todo: CONCEPT CASE
 gruesome_festivals_designated_sacrifice_fp1_modifier: "Brzy bude obětován"
 gruesome_festivals_designated_sacrifice_fp1_modifier_desc: "Tato postava je určená jako [Concept('designate_chief_sacrifice_chief_sacrifice','hlavní oběť')|E]." # todo: CONCEPT CASE
 fp1_jomsvikings_caused_faith_crisis_modifier: "Krize víry"
 fp1_jomsvikings_caused_faith_crisis_modifier_desc: "Rozepře s vůdcem svaté řádu způsobila, že tato postava začala pochybovat o svých vírách."
