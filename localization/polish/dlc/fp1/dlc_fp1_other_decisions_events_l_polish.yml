l_polish:
 fp1_other_decisions.0001.t: "Velká slavnost: [blotter.Custom('GruesomeFestivalName')|U]"
 fp1_other_decisions.0001.desc: "Ačkoli se během roku při mnoha příležitostech konají menší obřady označované jako „[blotter.Custom('GruesomeFestivalNamePlural')]“, jednou za deset let se [blotter.GetPrimaryTitle.GetNameNoTierNoTooltip] stává dějištěm velké slavnosti. [gf_faith.GetAdherentNamePlural] se tu scházejí k velkolepé oslavě a především k velké #EMP oběti#!.\n\nKrev při obřadu teče proudem a ze všech stran zaznívá: „[gf_faith.PantheonTerm]!“ Maso z obětí však připadne věřícím. Tak bohatá hostina obvykle vyústí v nezapomenutelnou slavnost.\n\nTaková událost je samozřejmě drahá a rozhodně není nutné zvát #EMP všechny#! [gf_faith.GetAdherentNamePluralNoTooltip]..."
 fp1_other_decisions.0001.a.capital: "Možná postačí dvůr a [capital_county.GetNameNoTierNoTooltip] se svými obyvateli?"
 fp1_other_decisions.0001.a.other: "[fallback_location.GetNameNoTierNoTooltip] nás může hostit. Místní se víry drží dost pevně."
 fp1_other_decisions.0001.b: "Ať přijdou [blotter.Custom('WomenMenPeople_GenderPreference')] z celého mého panství - svobodný lid bez výjimky!"
 fp1_other_decisions.0001.c: "Ať je to [blotter.Custom('LadyLordNoble_GenderPreference')], nebo prostý člověk, pozvání platí pro všechny!"
 fp1_other_decisions.0001.d: "Když o tom tak přemýšlím, je to příliš drahé..."
 fp1_other_decisions.0001.prep_start.tt: "Přípravy na obřad „[blotter.Custom('GruesomeFestivalName')]“ začínají..."
 fp1_other_decisions.0001.prep_continue.tt: "Přípravy na obřad „[blotter.Custom('GruesomeFestivalName')]“ pokračují..."
 fp1_other_decisions.0002.t: "$fp1_other_decisions.0001.t$"
 fp1_other_decisions.0002.desc.intro: "Obřad „[blotter.Custom('GruesomeFestivalName')]“ může být velkolepý i skromný.\n\nTradičně zahrnuje lidské i zvířecí oběti. Několik vězňů přijde o život, možná mezi nimi bude i někdo, koho si osobně vyberu. Jejich životy budou položeny na oltář a při obřadu zazní: „[gf_faith.PantheonTerm]!“\n\nAčkoli to víra [gf_faith.GetNameNoTooltip] vyžaduje,"
 fp1_other_decisions.0002.desc.vassals_dislike_humsac: "některým mým vazalům připadá taková představa barbarská,"
 fp1_other_decisions.0002.desc.counties_dislike_humsac: "některým prostým lidem v mém panství připadá taková představa odporná,"
 fp1_other_decisions.0002.desc.courtiers_dislike_humsac: "někteří lidé u dvora jsou už samotnou představou znechuceni,"
 fp1_other_decisions.0002.desc.fallback: "ve skutečnosti nejde o bezpodmínečnou nutnost,"
 fp1_other_decisions.0002.desc.outro: "a pokud se chci vyhnout sporům, může obřad proběhnout pouze se zvířecími oběťmi."
 fp1_other_decisions.0002.a: "Pořádná řádka zvířecích obětí postačí."
 fp1_other_decisions.0002.animals_only.regular.opinion: "[gf_faith.GetAdherentNamePlural] zvířecí oběť ocení méně: zisk [Concept('opinion','mínění')|E] a [Concept('county_opinion','lidového mínění')|E] bude nižší než při lidské oběti"
 fp1_other_decisions.0002.animals_only.appeased_humsac_haters: "Poddaní, kteří neschvalují lidské oběti, nepřijdou o [Concept('opinion','mínění')|E] ani [Concept('county_opinion','lidové mínění')|E]"
 fp1_other_decisions.0002.animals_only.regular.piety: "#positive_value [THIS.Var('piety_gain_standard_animal').GetValue|0]#! [piety_i] získáš $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.animals_only.regular.piety.loss: "#negative_value [THIS.Var('piety_gain_standard_animal').GetValue|0]#! [piety_i] ztratíš $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.b: "Ať je to [blotter.Custom('WomanManPerson_GenderPreference')], pro každého zvíře nebo pták!"
 fp1_other_decisions.0002.animals_only.magnificent.opinion: "[gf_faith.GetAdherentNamePlural] tuto oběť ocení stejně jako lidskou: zisk [Concept('opinion','mínění')|E] a [Concept('county_opinion','lidového mínění')|E] bude srovnatelný"
 fp1_other_decisions.0002.animals_only.magnificent.piety: "#positive_value [THIS.Var('piety_gain_magnificent_animal').GetValue|0]#! [piety_i] získáš $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.animals_only.magnificent.piety.loss: "#negative_value [THIS.Var('piety_gain_magnificent_animal').GetValue|0]#! [piety_i] ztratíš $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.c: "Na tradici záleží. Až poteče lidská krev, zazní: „[gf_faith.PantheonTerm|U]!“"
 fp1_other_decisions.0002.human_sacrifice.regular.opinion: "[gf_faith.GetAdherentNamePlural] tuto oběť ocení stejně jako velkolepou zvířecí oběť: zisk [Concept('opinion','mínění')|E] a [Concept('county_opinion','lidového mínění')|E] bude srovnatelný"
 fp1_other_decisions.0002.animals_only.offended_humsac_haters: "Poddaní, kteří neschvalují lidské oběti, přijdou o značné [Concept('opinion','mínění')|E] a [Concept('county_opinion','lidové mínění')|E]"
 fp1_other_decisions.0002.human_sacrifice.regular.piety: "#positive_value [THIS.Var('piety_gain_standard_human').GetValue|0]#! [piety_i] získáš $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.human_sacrifice.regular.piety.loss: "#negative_value [THIS.Var('piety_gain_standard_human').GetValue|0]#! [piety_i] ztratíš $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.human_sacrifice.optional_victim_picker: "Volitelně můžeš [Concept('designate_chief_sacrifice_article','určit hlavní oběť')|E] z řad svých [Concept('prisoners','vězňů')|E]"
 fp1_other_decisions.0002.human_sacrifice.become_cannibal: "Během obřadu „[blotter.Custom('GruesomeFestivalName')]“ získáš rys [GetTrait('cannibal').GetName( GetNullCharacter )]"
 fp1_other_decisions.0002.d: "Jen ty nejlepší oběti postačí: ať je to [blotter.Custom('WomanManPerson_GenderPreference')], nebo zvíře..."
 fp1_other_decisions.0002.human_sacrifice.magnificent.opinion: "[gf_faith.GetAdherentNamePlural] tuto oběť ocení nejvýše: zisk [Concept('opinion','mínění')|E] a [Concept('county_opinion','lidového mínění')|E] bude maximální"
 fp1_other_decisions.0002.human_sacrifice.magnificent.piety: "#positive_value [THIS.Var('piety_gain_magnificent_human').GetValue|0]#! [piety_i] získáš $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.human_sacrifice.magnificent.piety.loss: "#negative_value [THIS.Var('piety_gain_magnificent_human').GetValue|0]#! [piety_i] ztratíš $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.blot_invalidation.tt: "Obřad „[blotter.Custom('GruesomeFestivalName')]“ je nutné zrušit"
 fp1_other_decisions.0002.blot_invalidation.costs_recouped.tt: "Vrátí se ti většina [Concept('gold','zlata')|E] a veškerá [Concept('prestige','prestiž')|E]"
 fp1_other_decisions.0002.piety_gain.rump: "během obřadu „[blotter.Custom('GruesomeFestivalName')]“"
 fp1_other_decisions.0003.t: "$fp1_other_decisions.0001.t$"
 fp1_other_decisions.0003.desc.intro.small: "Shromáždění je sice malé, ale při obřadu „[blotter.Custom('GruesomeFestivalName')]“ panuje nadšená nálada. Rozjaření [gf_faith.GetAdherentNamePlural] se tlačí jeden přes druhého a pokřikují, když"
 fp1_other_decisions.0003.desc.intro.medium: "[gf_faith.HouseOfWorship] praská ve švech pod náporem rozjařených a jásajících [gf_faith.GetAdherentNamePlural], kteří burácejí, když"
 fp1_other_decisions.0003.desc.intro.large: "Hostů při obřadu „[blotter.Custom('GruesomeFestivalName')]“ je tolik, že zaplnili celé okolí [gf_faith.HouseOfWorship]. Ohlušující řev davu sílí, když"
 fp1_other_decisions.0003.desc.animals.regular: "k oltáři míří úctyhodný průvod obětních zvířat.\n\n"
 fp1_other_decisions.0003.desc.animals.magnificent: "k oltáři míří mohutný zástup obětních zvířat.\n\n"
 fp1_other_decisions.0003.desc.humans.regular.sans_chief: "k oltáři kráčí skupina vyděšených vězňů a za nimi ženou zvířata.\n\n"
 fp1_other_decisions.0003.desc.humans.magnificent.sans_chief: "k oltáři míří hrozivě vyhlížející vězni spolu s nádherným dobytkem.\n\n"
 fp1_other_decisions.0003.desc.humans.regular.plus_chief: "[sacrifice.GetFirstName] je [Select_CString(sacrifice.IsFemale,'vlečena','vlečen')] k oltáři jako první z několika vězňů, za nimiž následují další zvířata.\n\n"
 fp1_other_decisions.0003.desc.humans.magnificent.plus_chief: "[sacrifice.GetFirstName] je [Select_CString(sacrifice.IsFemale,'vlečena','vlečen')] k oltáři jako první v dlouhém zástupu lidí a zvířat, který se táhne daleko za dveře.\n\n"
 fp1_other_decisions.0003.desc.sacrifice.named.norse_cannibals: "[sacrifice.GetFirstNameNoTooltip] se marně zmítá, zatímco [Select_CString(sacrifice.IsFemale,'ji','ho')] škrtí k smrti a poté zbavují krve. $fp1_other_decisions.0003.desc.sacrifice.norse_cannibal_excarnation$. $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$."
 fp1_other_decisions.0003.desc.sacrifice.named.cannibals: "[sacrifice.GetFirstNameNoTooltip] je nejprve násilím [Select_CString(sacrifice.IsFemale,'omráčena','omráčen')], $fp1_other_decisions.0003.desc.sacrifice.generic_cannibal_slaughter$."
 fp1_other_decisions.0003.desc.sacrifice.named.norse: "[sacrifice.GetFirstNameNoTooltip] $fp1_other_decisions.0003.desc.sacrifice.norse_throttling$. $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$."
 fp1_other_decisions.0003.desc.sacrifice.named.fallback: "[sacrifice.GetFirstNameNoTooltip] bojuje obdivuhodně až do chvíle, kdy [Select_CString(sacrifice.IsFemale,'jí','mu')] proříznou hrdlo.\n\n$fp1_other_decisions.0003.desc.sacrifice.generic_human_disemboweling$?"
 fp1_other_decisions.0003.desc.sacrifice.unnamed.norse_cannibals: "První oběť se marně brání, ale škrcení rychle skončí. $fp1_other_decisions.0003.desc.sacrifice.norse_cannibal_excarnation$. $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$."
 fp1_other_decisions.0003.desc.sacrifice.unnamed.cannibals: "Jako první přichází na řadu [blotter.Custom('SacrificeTerm')]. Oběť odvlečou k oltáři a násilím omráčí, $fp1_other_decisions.0003.desc.sacrifice.generic_cannibal_slaughter$."
 fp1_other_decisions.0003.desc.sacrifice.unnamed.norse: "Jako první přichází na řadu [blotter.Custom('SacrificeTerm')], který $fp1_other_decisions.0003.desc.sacrifice.norse_throttling$. $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$."
 fp1_other_decisions.0003.desc.sacrifice.unnamed.fallback: "Jako první lidská oběť přichází na řadu [blotter.Custom('SacrificeTerm')]. Zápas končí až proříznutím hrdla.\n\n$fp1_other_decisions.0003.desc.sacrifice.generic_human_disemboweling$?"
 fp1_other_decisions.0003.desc.sacrifice.animal.norse: "Jeden po druhém přicházejí na řadu [blotter.Custom('GruesomeFestivalAnimalPreference')]. Následuje škrcení a vypuštění krve. Maso putuje do ohně a poté na hostinu. $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$."
 fp1_other_decisions.0003.desc.sacrifice.animal.fallback: "Jeden po druhém přicházejí na řadu [blotter.Custom('GruesomeFestivalAnimalPreference')]. Následuje rychlé podříznutí hrdel a těla přebírají kuchaři a hladový dav."
 fp1_other_decisions.0003.desc.outro.faithful: "\n\nVskutku podívaná hodná těch, které uctíváme: [gf_faith.PantheonTerm]."
 fp1_other_decisions.0003.desc.outro.political: "\n\nVíru sice nesdílím, ale když jsou poddaní spokojení, [blotter.GetTitleAsNameNoTooltip] má o starost méně."
 fp1_other_decisions.0003.happy_characters_list: "Každá pozvaná [Concept('character','postava')|E] ([gf_faith.GetName])"
 fp1_other_decisions.0003.happy_titles_list: "Každé pozvané [Concept('county','hrabství')|E] ([gf_faith.GetName])"
 fp1_other_decisions.0003.unhappy_characters_list: "Každá [Concept('character','postava')|E] v [Concept('realm','panství')|E], která nepraktikuje lidské oběti"
 fp1_other_decisions.0003.unhappy_titles_list: "Každé [Concept('county','hrabství')|E] v [Concept('realm','panství')|E], kde se nepraktikují lidské oběti"
 fp1_other_decisions.0003.attendee_became_cannibal: "Účast na kanibalské hostině: [blotter.GetTitledFirstNamePossessiveNoTooltip]"
 fp1_other_decisions.0003.a: "Za bohy! [gf_faith.HighGodName]! [gf_faith.FertilityGodName]! [gf_faith.WealthGodName]!"
 fp1_other_decisions.0003.b: "Skvělá příležitost udělat dojem na šlechtu."
 fp1_other_decisions.0003.b.nobility_list: "Každý pozvaný šlechtic ([gf_faith.GetName]) alespoň [Concept('count','hraběcí')|E] [Concept('rank','hodnosti')|E]"
 fp1_other_decisions.0003.b.clergy_list: "Každý pozvaný duchovní ([gf_faith.GetName]) alespoň [Concept('count','hraběcí')|E] [Concept('rank','hodnosti')|E] a tvůj [GetPlayer.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]"
 fp1_other_decisions.0003.c: "Je čas vmísit se mezi prostý lid!"
 fp1_other_decisions.0003.d: "Odcházím dřív. Už jsem toho [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')] #EMP dost#!."
 fp1_other_decisions.0003.e: "[gf_faith.HighGodName]! Vyslovuji to správně?"
 fp1_other_decisions.0003.f: "[gf_faith.GetAdherentNamePluralNoTooltip] - jejich víra je rozhodně lákavá..."
 fp1_other_decisions.0004.t: "$fp1_other_decisions.0001.t$"
 fp1_other_decisions.0004.desc: "V mých zemích žijí lidé, kteří věří ve velkolepé obětní jatky pro své smyšlené bohy. Má vlastní osvícená víra, [blotter.GetFaith.GetName], žádné takové krveprolití neschvaluje. Mnoho slavností označovaných jako „[blotter.Custom('GruesomeFestivalNamePlural')]“ však má jednu zvláštní podmínku: [blotter.GetTitleAsNameNoTooltip] se jich musí osobně účastnit.\n\nNemusím přijmout jejich víru, abych respektoval jejich zvyky, ale kdybych pro ně [Select_CString(ROOT.Char.IsFemale,'uspořádala','uspořádal')] velkou slavnost „[blotter.Custom('GruesomeFestivalName')]“, nepochybně bych si [Select_CString(ROOT.Char.IsFemale,'získala','získal')] mnoho přátel mezi méně osvícenými poddanými, rolníky i šlechtou."
 fp1_other_decisions.0004.a: "Možná je na místě trochu smířlivosti... [option_1.GetAdherentNamePlural]."
 fp1_other_decisions.0004.b: "Takže od nich mohu skutečně získat #EMP podporu#!? [option_2.GetAdherentNamePlural]..."
 fp1_other_decisions.0004.c: "[option_3.GetAdjective] slavnosti mají jisté kouzlo."
 fp1_other_decisions.0004.d: "Tohle by byla přinejlepším #EMP naprostá#! hereze!"
 fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl: "Veškerá krev se shromáždí do mísy. [gf_faith.HouseOfWorship] se pak zevnitř i zvenčí pokryje krví, kterou [gf_faith.PriestNeuterPlural] nabírají z mísy"
 fp1_other_decisions.0003.desc.sacrifice.norse_cannibal_excarnation: "Jedlé maso se odřeže na hostinu, zbytky putují na strom oběšenců a pak přichází na řadu další [blotter.Custom('SacrificeTerm')]"
 fp1_other_decisions.0003.desc.sacrifice.norse_throttling: "se zuřivě zmítá, zatímco [gf_faith.PriestNeuterPlural] z [Select_CString(sacrifice.IsFemale,'ní','něj')] pomalu škrtí život. Světlo života zůstává až do porážky prvního zvířete tam, kde je nejlépe vidět: [sacrifice.Custom('EyeEyes')]. Lidské mrtvoly putují na strom oběšenců, zvířata do ohně"
 fp1_other_decisions.0003.desc.sacrifice.generic_cannibal_slaughter: "aby tělo povolilo. Strach by maso zkazil. Poté se na něj vrhnou [gf_faith.PriestNeuterPlural] a vyřezávají šťavnaté kusy masa do kotlů, zatímco na řadu přichází další [blotter.Custom('SacrificeTerm')] - stále s křikem"
 fp1_other_decisions.0003.desc.sacrifice.generic_human_disemboweling: "[Select_CString(sacrifice.IsFemale,'Její','Jeho')] spoluvězni s hrůzou sledují, jak je mrtvola vykuchána, a vědí, že na ně brzy přijde řada. Možná závidějí zvířatům jejich čistší smrt - po zabití putují rovnou do ohně"
 fp1_other_decisions.0011.t: "$fp1_other_decisions.0001.t$"
 fp1_other_decisions.0011.desc.intro: "[blotter.Custom('GruesomeFestivalNamePlural')|U] jsou důležitou součástí víry [gf_faith.GetName] a [blotter.Custom2('MyCharacterIntroduction', ROOT.Char)] právě pořádá jedno takové shromáždění.\n\nMá jít o velkolepou událost pro všechny [gf_faith.GetAdherentNamePluralNoTooltip] napříč celým panstvím: [blotter.GetPrimaryTitle.GetNameNoTier]. Pozvána je šlechta i prostý lid."
 fp1_other_decisions.0011.desc.cannibal_blot: "Stejně jako při mnoha zvláštních rituálech by někdo v mém postavení měl povinně okusit lidské maso."
 fp1_other_decisions.0011.desc.fallback: "Jídlo, zábavu a vše ostatní navíc v plné výši zaplatí [blotter.GetTitledFirstNameNoTooltip]."
 fp1_other_decisions.0011.desc.outro: "\n\nI kdybych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] jiné povinnosti, sluší se alespoň poslat vyslance, který mou nepřítomnost vysvětlí. Pokud bych však [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')] dát jasně najevo pohrdání, stačí neodpovědět vůbec. [blotter.GetTitleAsNameNoTooltip] by si toho jistě [Select_CString(blotter.IsFemale,'všimla','všiml')]..."
 fp1_other_decisions.0011.a: "Na jeden den si čas najdu. Sluší se to."
 fp1_other_decisions.0011.b: "K čertu s [blotter.GetFirstNameNoTooltip] i s koněm, na kterém přijel posel."
 fp1_other_decisions.0011.b.tt: "[blotter.GetFirstNameNoTooltip] si tvé nepřítomnosti možná časem všimne"
 fp1_other_decisions.0011.c: "Posvátné maso! Už se nemohu dočkat, až ho poprvé ochutnám..."
 fp1_other_decisions.0011.d: "Půjdu, ale lidské maso jíst nebudu."
 fp1_other_decisions.0011.e: "[gf_faith.NegativeAfterLife]? Ani za nic, na #EMP tohle#! nejdu!"
 fp1_other_decisions.0011.e.tt: ""
 fp1_other_decisions.0012.t: "$fp1_other_decisions.0001.t$: Chybějící tváře"
 fp1_other_decisions.0012.desc.intro: "Není neobvyklé, že se ani velkého obřadu „[blotter.Custom('GruesomeFestivalName')]“ nezúčastní někteří významní poddaní. Slušnost však velí poslat vhodného vyslance, který jejich nepřítomnost vysvětlí a zastoupí je.\n\n"
 fp1_other_decisions.0012.desc.multiple_decliners: "Do očí bije nepřítomnost těchto lidí: [decliner_1.GetTitledFirstName] a několik dalších;"
 fp1_other_decisions.0012.desc.single_decliner: "Do očí bije nepřítomnost: [decliner_1.GetTitledFirstName];"
 fp1_other_decisions.0012.desc.outro: " předem navíc nepřišla žádná zpráva. Je to jasná urážka mé autority, i když ne zrovna porušení zákona."
 fp1_other_decisions.0012.a: "[decliner_1.GetTitledFirstNameNoTooltip]! K čertu!"
 fp1_other_decisions.0012.a.decliner_toast.t: "[blotter.GetTitledFirstNameNoTooltip] si [Select_CString(blotter.IsFemale,'všimla','všiml')] tvé nepřítomnosti během obřadu „[blotter.Custom('GruesomeFestivalName')]“"
 fp1_other_decisions.0012.b: "K čertu se všemi!"
 fp1_other_decisions.0012.b.all_decliners_list: "[Concept('vassals','Všichni vazalové')|E], kteří odmítli účast"
 fp1_other_decisions.0012.c.singular: "Pche, tím tratí [decliner_1.GetTitledFirstNameNoTooltip]."
 fp1_other_decisions.0012.c.plural: "Pche, jejich škoda."
 fp1_other_decisions.0021.t: "Nejvyšší rouhání"
 fp1_other_decisions.0021.desc: "Z [sacrificer.GetPrimaryTitle.GetNameNoTierNoTooltip] přicházejí děsivé zprávy! Zdá se, že odporný nevěřící [sacrificer.Custom('GetUnbelieverName')], [sacrificer.GetShortUIName], [Select_CString(sacrificer.IsFemale,'obětovala','obětoval')] vznešenou osobu [sacrificed_hof.GetTitledFirstName] své ohavné víře.\n\n"
 fp1_other_decisions.0021.desc.allows_holy_wars: "V žilách horlivých [sacrificed_hof.GetFaith.GetAdherentNamePlural] po celém světě už vře spravedlivý hněv!\n\nTato urážka nesmí zůstat nepotrestána. V každé krčmě, pevnosti i paláci, kde má slovo válečného božstva svou váhu, zaznívá jedno jméno: [sacrificed_hof.GetFaith.WarGodName]. A všude se mluví o svaté válce."
 fp1_other_decisions.0021.desc.disallows_holy_wars: "Ani v této těžké chvíli nesmíme zapomenout, co učí [sacrificed_hof.GetFaith.HighGodName], a prolévat krev bez smyslu. Nic už [sacrificed_hof.GetTitledFirstNameNoTooltip] nevrátí a [Select_CString(sacrificed_hof.IsFemale,'jistě by si přála','jistě by si přál')], abychom truchlili důstojně a v míru."
 fp1_other_decisions.0021.a.zealous: "Co je to za rouhání?!"
 fp1_other_decisions.0021.a.cynical: "Když nic jiného, je to urážka našeho lidu!"
 fp1_other_decisions.0021.a.fallback: "Jak strašné!"
 fp1_other_decisions.0021.cheaper_holy_wars.tt: "Náklady na [Concept('holy_wars','svaté války')|E] proti [sacrificer.GetShortUIName] jsou nyní výrazně nižší"
 fp1_other_decisions.0021.easier_holy_wars.tt: "[Concept('holy_wars','Svaté války')|E] proti [sacrificer.GetShortUIName] nyní vyžadují nižší [Concept('piety_levels','úroveň oddanosti')|E] než obvykle"
 fp1_other_decisions.0021.ghw_target_preference.tt: "Je pravděpodobnější, že cílem [Concept('great_holy_wars','velkých svatých válek')|E] bude [sacrificer.GetShortUIName]"
 fp1_other_decisions.0022.t: "$fp1_other_decisions.0021.t$"
 fp1_other_decisions.0022.desc: "Zdá se, že [unlucky_guest.GetFaith.GetAdherentNamePlural] po celém světě nenesou právě dobře, že jsem [Select_CString(ROOT.Char.IsFemale,'obětovala','obětoval')] jejich falešného „[unlucky_guest.GetTitleAsNameNoTooltip]“.\n\n"
 fp1_other_decisions.0022.desc.disallows_holy_wars: "Věrni své pacifistické víře se však spokojí se shromážděními a tichými modlitbami. Místo krvavé pomsty jen volají: „[unlucky_guest.GetFaith.HighGodName]!“"
 fp1_other_decisions.0022.desc.allows_holy_wars: "Věrni své válečnické víře mnozí z nich volají po mé hlavě a kážou svaté války, dokud mé panství nebude vymazáno z povrchu zemského."
 fp1_other_decisions.0022.a.pacifists: "Ha! Třeba se ozve [unlucky_guest.GetFaith.HighGodName] a srazí mě?"
 fp1_other_decisions.0022.a.craven: "Tohle... možná byla chyba."
 fp1_other_decisions.0022.a.fallback: "Pche, jen ať přijdou!"
 fp1_other_decisions.0023.t: "$fp1_other_decisions.0021.t$"
 fp1_other_decisions.0023.desc.intro: "[unlucky_guest.GetFaith.GetAdherentNamePlural] po celém světě jsou v šoku. Odporní [gf_faith.GetAdherentNamePlural] [Select_CString(unlucky_guest.IsFemale,'obětovali naši milovanou','obětovali našeho milovaného')] [unlucky_guest.GetShortUIName]. A co hůř, výslovný rozkaz k tomu [Select_CString(blotter.IsFemale,'vydala','vydal')] [blotter.GetShortUIName], někdo z našich vlastních řad.\n\n"
 fp1_other_decisions.0023.desc.has_excommunication: "[blotter.GetShortUIName] [Select_CString(blotter.IsFemale,'byla okamžitě exkomunikována','byl okamžitě exkomunikován')] a rouhačské činy byly veřejně odsouzeny. Zpráva se šíří mezi věřícími: [unlucky_guest.GetFaith.GetAdherentNamePluralNoTooltip]."
 fp1_other_decisions.0023.desc.does_not_have_excommunication: "[unlucky_guest.GetFaith.GetAdherentNamePluralNoTooltip] žádají, aby [blotter.GetShortUIName] [Select_CString(blotter.IsFemale,'byla vyobcována','byl vyobcován')] z víry. Jméno [blotter.GetShortUIName] budiž prokleto."
 fp1_other_decisions.0023.desc.outro: "Ať [unlucky_guest.GetFaith.NegativeAfterLife] pohltí [blotter.GetShortUIName]!"
 fp1_other_decisions.0023.a: "Tohle je neodpustitelné!"
 fp1_other_decisions.0023.b: "Tohle má být [blotter.GetWomanMan|l]?! Co je vůbec zač?!"
 fp1_other_decisions.0024.t: "$fp1_other_decisions.0021.t$"
 fp1_other_decisions.0024.desc.intro: "Co mě to posedlo? Snad [unlucky_guest.GetFaith.DevilName] zasadil do mé mysli nějaké své sémě, když jsem si [Select_CString(ROOT.Char.IsFemale,'dovolila','dovolil')] #EMP veřejně#! schválit obětování [unlucky_guest.GetShortUIName] cizím modlám? O mém rouhání teď u večeře klevetí každý pravověrný [unlucky_guest.GetFaith.GetAdherentName] na světě!\n\n"
 fp1_other_decisions.0024.desc.has_excommunication: "Ani není třeba, aby dorazila listina o exkomunikaci. [unlucky_guest.GetFaith.PriestNeuterPlural] už mé hříchy odmítají vyslechnout."
 fp1_other_decisions.0024.desc.does_not_have_excommunication: "Dokonce i ti nejméně zbožní [unlucky_guest.GetFaith.PriestNeuterPlural] se mi odmítají podívat do očí."
 fp1_other_decisions.0024.desc.outro: "[unlucky_guest.GetFaith.GetReligion.GetName] mě už považuje za ztracenou a zatracenou duši."
 fp1_other_decisions.0024.a: "#EMP Co jsem to [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')]?!#!"
 fp1_other_decisions.0024.b: "[unlucky_guest.GetShortUIName] [Select_CString(unlucky_guest.IsFemale,'byla jen obyčejná smrtelnice','byl jen obyčejný smrtelník')], ne samotné božstvo!"
 fp1_other_decisions.0024.c: "Byli to mí poddaní, ne já!"
 fp1_other_decisions.0063.t: "$game_concept_designate_chief_sacrifice_chief_sacrifice$ zemřela dříve, než [ROOT.Char.Custom('GruesomeFestivalName')|U] začal"
 fp1_other_decisions.0063.desc: "[designated_sacrifice.GetTitledFirstNameNoTooltip] [Select_CString(designated_sacrifice.IsFemale,'zemřela dříve, než mohla být obětována','zemřel dříve, než mohl být obětován')]."
 fp1_other_decisions.0101.t.root_title: "Kameny napříč věky"
 fp1_other_decisions.0101.t: "$fp1_other_decisions.0101.t.root_title$: Námět"
 fp1_other_decisions.0101.desc: "Každý runový kámen vypráví o významné události ze života toho, kdo jej nechal vztyčit. Od nejprostšího rolníka až po [ROOT.Char.GetTitleAsNameNoTooltip], jako jsem já, kámen uchová vše.\n\nO čem má tento monument vyprávět?"
 fp1_other_decisions.0101.a: "O [ancestor.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort',ancestor)], [Select_CString(ancestor.IsFemale,'která','který')] už není mezi námi."
 fp1_other_decisions.0101.a.tt: "Runový kámen bude vyprávět o zesnulém členu tvé rodiny..."
 fp1_other_decisions.0101.b: "Možná o mém poraženém nepříteli [foe.GetTitledFirstNameNoTooltip]?"
 fp1_other_decisions.0101.b.tt: "Runový kámen bude vyprávět o tvých vítězstvích při dobývání..."
 fp1_other_decisions.0101.c: "O tom, jak jsem [Select_CString(ROOT.Char.IsFemale,'usedla','usedl')] na trůn [new_title.GetNameNoTierNoTooltip]!"
 fp1_other_decisions.0101.c.tt: "Runový kámen bude vyprávět o tom, jak ses dostal k moci..."
 fp1_other_decisions.0101.d: "Za obří pomalovaný balvan mám zaplatit #EMP KOLIK#!?"
 fp1_other_decisions.0111.t: "$fp1_other_decisions.0101.t.root_title$: Umístění"
 fp1_other_decisions.0111.desc.intro: "Když už vím, co má můj runový kámen připomínat, zbývá rozhodnout, kam jej postavit.\n\n"
 fp1_other_decisions.0111.desc.ancestor: "Památníky věnované rodině, jako je ten pro [ancestor.GetFirstName], podporují úctu a věrnost. Nejlépe poslouží tam, kde si mě příliš neváží a kde mohu dát na odiv svou oddanost rodině i vyšším mocnostem."
 fp1_other_decisions.0111.desc.conquest: "Památníky vítězství, jako je můj triumf nad [foe.GetTitledFirstName], jsou trvalou připomínkou slavného konce války. Nejlépe poslouží v oblastech, jejichž obyvatelé potřebují trochu povzbudit ke spolupráci."
 fp1_other_decisions.0111.desc.promotion: "Památníky vzestupu k moci, jako je mé povýšení na [ROOT.Char.GetTitleAsNameNoTooltip] [new_title.GetNameNoTierNoTooltip], povzbuzují lid k tomu, aby svému vládci věrně sloužil v dobrém i zlém. Nejlépe se hodí do městských oblastí, kde mohou inspirovat více mladých lidí, aby nastoupili do odvodů."
 fp1_other_decisions.0111.desc.outro: "\n\nSamozřejmě mě hned napadá několik vhodných míst..."
 fp1_other_decisions.0111.a: "[location_a.GetNameNoTierNoTooltip|U] by bylo dobré místo."
 fp1_other_decisions.0111.b: "[location_b.GetNameNoTierNoTooltip|U] nevypadá špatně."
 fp1_other_decisions.0111.c: "[location_c.GetNameNoTierNoTooltip|U] je skvělá volba!"
 fp1_other_decisions.1000.t: "Obětován!"
 fp1_other_decisions.1000.desc: "Stojím před skandujícím davem a všechny oči se upírají na mě. Vpředu stojí [blotter.GetFirstName] s úsměvem na tváři, připravený ukončit můj život.\n\n„Mocný [blotter.GetFaith.HighGodName]! Přijmi tuto oběť!“ zazní z úst [blotter.GetFirstNameNoTooltip].\n\nTohle je můj konec.\n\nPřichází tma.\n\nJe po všem."
 fp1_other_decisions.1000.a: "[ROOT.Char.GetFaith.NegativeAfterLife] si tě počká - a já také!"
