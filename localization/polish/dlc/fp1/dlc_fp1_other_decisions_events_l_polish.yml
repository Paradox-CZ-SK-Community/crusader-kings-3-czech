l_polish:
 fp1_other_decisions.0001.t: "Velkolepý [blotter.Custom('GruesomeFestivalName')|U]"
 fp1_other_decisions.0001.desc: "Ačkoliv menší [blotter.Custom('GruesomeFestivalNamePlural')] se konají při mnoha příležitostech během roku, jednou za deset let se [gf_faith.GetAdherentNamePlural] z [blotter.GetPrimaryTitle.GetNameNoTierNoTooltip] shromáždí na velkou oslavu a, co je důležitější, na velkou #EMP oběť#!.\n\nAčkoli je pro [gf_faith.PantheonTerm] prolito hojně krve, maso obětí jde věřícím. Taková bohatá hostina obvykle dělá zázračnou slavnost.\n\nSamozřejmě, taková záležitost je nákladná, a rozhodně to není #EMP pro všechny#! [gf_faith.GetAdherentNamePluralNoTooltip] není nutné zvát..."
 fp1_other_decisions.0001.a.capital: "Možná jen obyvatelé [capital_county.GetNameNoTierNoTooltip] a dvůr?"
 fp1_other_decisions.0001.a.other: "Lidé z [fallback_location.GetNameNoTierNoTooltip] si víru udržují natolik, aby nás mohli hostit."
 fp1_other_decisions.0001.b: "Ať přijdou všichni svobodní[blotter.Custom('WomenMenPeople_GenderPreference')] mého panství!"
 fp1_other_decisions.0001.c: "Každý [blotter.Custom('LadyLordNoble_GenderPreference')|U] a prostý člověk v [blotter.GetPrimaryTitle.GetTierAsNameNoTooltip] je pozván!"
 fp1_other_decisions.0001.d: "Po rozmyšlení — to je příliš drahé..."
 fp1_other_decisions.0001.prep_start.tt: "Přípravy na [blotter.Custom('GruesomeFestivalName')] začínají..."
 fp1_other_decisions.0001.prep_continue.tt: "Přípravy na [blotter.Custom('GruesomeFestivalName')] pokračují..."
 fp1_other_decisions.0002.t: "$fp1_other_decisions.0001.t$"
 fp1_other_decisions.0002.desc.intro: "[blotter.Custom('GruesomeFestivalName')] může být jak velkolepou, tak skromnou záležitostí.\n\nPodle tradice zahrnují také jak lidské, tak zvířecí oběti. Několik vězňů bude nabídnuto [gf_faith.PantheonTerm], možná dokonce včetně zvláštní volby z mých vlastních zdrojů — jejich životy věnované na počest [gf_faith.PantheonTerm].\n\nAčkoli víra [gf_faith.GetNameNoTooltip] toto vyžaduje,"
 fp1_other_decisions.0002.desc.vassals_dislike_humsac: "existují mezi mými vazaly tací, kteří považují myšlenku za barbarskou,"
 fp1_other_decisions.0002.desc.counties_dislike_humsac: "existují prostí lidé v mém království, kteří považují tu představu za odpornou,"
 fp1_other_decisions.0002.desc.courtiers_dislike_humsac: "někteří na dvoře jsou odporně jimi samotnými znechuceni,"
 fp1_other_decisions.0002.desc.fallback: "není to vlastně přísný požadavek,"
 fp1_other_decisions.0002.desc.outro: "a obřad může pokračovat pouze se zvířecími oběťmi, pokud chci vyhnout kontroverzím."
 fp1_other_decisions.0002.a: "Dostatečná řada zvířecích obětí bude stačit."
 fp1_other_decisions.0002.animals_only.regular.opinion: "[opinion|E] a [county_opinion|E] zisk u [gf_faith.GetAdherentNamePlural] bude menší než u lidské oběti"
 fp1_other_decisions.0002.animals_only.appeased_humsac_haters: "Subjekty, které neschvalují lidské oběti, neztratí [opinion|E] ani [county_opinion|E]"
 fp1_other_decisions.0002.animals_only.regular.piety: "#positive_value [THIS.Var('piety_gain_standard_animal').GetValue|0]#! [piety_i] bude získáno $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.animals_only.regular.piety.loss: "#negative_value [THIS.Var('piety_gain_standard_animal').GetValue|0]#! [piety_i] bude ztraceno $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.b: "Přiveďte zvíře nebo drůbež pro každého [blotter.Custom('WomanManPerson_GenderPreference')]!"
 fp1_other_decisions.0002.animals_only.magnificent.opinion: "[opinion|E] a [county_opinion|E] zisk u [gf_faith.GetAdherentNamePlural] budou srovnatelné s lidskou obětí"
 fp1_other_decisions.0002.animals_only.magnificent.piety: "#positive_value [THIS.Var('piety_gain_magnificent_animal').GetValue|0]#! [piety_i] bude získáno $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.animals_only.magnificent.piety.loss: "#negative_value [THIS.Var('piety_gain_magnificent_animal').GetValue|0]#! [piety_i] bude ztraceno $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.c: "Tradice má váhu. [gf_faith.PantheonTerm|U] ochutná lidskou krev."
 fp1_other_decisions.0002.human_sacrifice.regular.opinion: "[opinion|E] a [county_opinion|E] zisk u [gf_faith.GetAdherentNamePlural] budou na úrovni vůči velkolepým zvířecím obětem"
 fp1_other_decisions.0002.animals_only.offended_humsac_haters: "Subjekty, které neschvalují lidské oběti, ztratí značné [opinion|E] & [county_opinion|E]"
 fp1_other_decisions.0002.human_sacrifice.regular.piety: "#positive_value [THIS.Var('piety_gain_standard_human').GetValue|0]#! [piety_i] bude získáno $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.human_sacrifice.regular.piety.loss: "#negative_value [THIS.Var('piety_gain_standard_human').GetValue|0]#! [piety_i] bude ztraceno $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.human_sacrifice.optional_victim_picker: "Volitelně můžete [designate_chief_sacrifice_article|E] z řad svých [prisoners|E]"
 fp1_other_decisions.0002.human_sacrifice.become_cannibal: "Stanete se [GetTrait('cannibal').GetName( GetNullCharacter )] na [blotter.Custom('GruesomeFestivalName')]"
 fp1_other_decisions.0002.d: "Pouze ty nejlepší oběti budou stačit: [blotter.Custom('WomanManPerson_GenderPreference')] i zvířata..."
 fp1_other_decisions.0002.human_sacrifice.magnificent.opinion: "[opinion|E] a [county_opinion|E] zisk u [gf_faith.GetAdherentNamePlural] budou co nejvyšší"
 fp1_other_decisions.0002.human_sacrifice.magnificent.piety: "#positive_value [THIS.Var('piety_gain_magnificent_human').GetValue|0]#! [piety_i] bude získáno $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.human_sacrifice.magnificent.piety.loss: "#negative_value [THIS.Var('piety_gain_magnificent_human').GetValue|0]#! [piety_i] bude ztraceno $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.blot_invalidation.tt: "[blotter.Custom('GruesomeFestivalName')|U] Nuceno zrušit"
 fp1_other_decisions.0002.blot_invalidation.costs_recouped.tt: "Většina mých [gold|E] a veškeré mé [prestige|E] byla získána zpět"
 fp1_other_decisions.0002.piety_gain.rump: "na [blotter.Custom('GruesomeFestivalName')]"
 fp1_other_decisions.0003.t: "$fp1_other_decisions.0001.t$"
 fp1_other_decisions.0003.desc.intro.small: "I když je shromáždění malé, atmosféra na [blotter.Custom('GruesomeFestivalName')] je nadšená, se veselými [gf_faith.GetAdherentNamePlural] tlačícími se a povzbuzujícími, zatímco"
 fp1_other_decisions.0003.desc.intro.medium: "[gf_faith.HouseOfWorship] je naplněn až po okraj veselými, povzbuzujícími [gf_faith.GetAdherentNamePlural], všichni řvou, když"
 fp1_other_decisions.0003.desc.intro.large: "Hosté na [blotter.Custom('GruesomeFestivalName')] jsou natolik početní, že pokrývají okolí [gf_faith.HouseOfWorship] a zvedají kakofonický řev, když"
 fp1_other_decisions.0003.desc.animals.regular: "slušný průvod obětních zvířat je doveden k oltáři.\n\n"
 fp1_other_decisions.0003.desc.animals.magnificent: "mohutná kolona obětních zvířat je hnána k oltáři.\n\n"
 fp1_other_decisions.0003.desc.humans.regular.sans_chief: "skupina vyděšených vězňů je vedena směrem k oltáři, za nimi táhnou zvířata.\n\n"
 fp1_other_decisions.0003.desc.humans.magnificent.sans_chief: "družina děsivě vypadajících vězňů a impozantního dobytka je přivedena k oltáři.\n\n"
 fp1_other_decisions.0003.desc.humans.regular.plus_chief: "[sacrifice.GetFirstName] je přitažen k oltáři, první z několika vězňů a dalších zvířat.\n\n"
 fp1_other_decisions.0003.desc.humans.magnificent.plus_chief: "[sacrifice.GetFirstName] je vtažen k oltáři, úplně první v dlouhé řadě mužů a zvířat táhnoucí se daleko z dveří.\n\n"
 fp1_other_decisions.0003.desc.sacrifice.named.norse_cannibals: "[sacrifice.GetSheHe|U] se marně vzpírá, když je [Select_CString(sacrifice.IsFemale,'udušena','udušen')] k smrti a poté vykrven. $fp1_other_decisions.0003.desc.sacrifice.norse_cannibal_excarnation$. $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$."
 fp1_other_decisions.0003.desc.sacrifice.named.cannibals: "Je nejprve násilně [Select_CString(sacrifice.IsFemale,'omráčena','omráčen')], $fp1_other_decisions.0003.desc.sacrifice.generic_cannibal_slaughter$."
 fp1_other_decisions.0003.desc.sacrifice.named.norse: "[sacrifice.GetSheHe|U] $fp1_other_decisions.0003.desc.sacrifice.norse_throttling$. $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$."
 fp1_other_decisions.0003.desc.sacrifice.named.fallback: "[sacrifice.GetSheHe|U] se statečně brání až do chvíle, kdy má být [Select_CString(sacrifice.IsFemale,'její','jeho')] hrdlo proříznuto.\n\n$fp1_other_decisions.0003.desc.sacrifice.generic_human_disemboweling$?"
 fp1_other_decisions.0003.desc.sacrifice.unnamed.norse_cannibals: "První oběť se marně vzpírá a [Select_CString(sacrifice.IsFemale,'její','jeho')] udušení je rychlé. $fp1_other_decisions.0003.desc.sacrifice.norse_cannibal_excarnation$. $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$."
 fp1_other_decisions.0003.desc.sacrifice.unnamed.cannibals: "První [blotter.Custom('SacrificeTerm')] je přitažena k oltáři a násilně omráčena, $fp1_other_decisions.0003.desc.sacrifice.generic_cannibal_slaughter$."
 fp1_other_decisions.0003.desc.sacrifice.unnamed.norse: "První [blotter.Custom('SacrificeTerm')] $fp1_other_decisions.0003.desc.sacrifice.norse_throttling$. $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$."
 fp1_other_decisions.0003.desc.sacrifice.unnamed.fallback: "První lidská [blotter.Custom('SacrificeTerm')] se stále brání, dokud jí není vyříznuto hrdlo.\n\n$fp1_other_decisions.0003.desc.sacrifice.generic_human_disemboweling$?"
 fp1_other_decisions.0003.desc.sacrifice.animal.norse: "Jedno po druhém jsou přiváděni [blotter.Custom('GruesomeFestivalAnimalPreference')], udušeni k smrti a vykrveni. Maso jde do ohně, pak na hostinu. $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$."
 fp1_other_decisions.0003.desc.sacrifice.animal.fallback: "Jedno po druhém jsou přiváděni [blotter.Custom('GruesomeFestivalAnimalPreference')], jejich hrdla jsou rychle proříznuta a těla jsou předána kuchařům a žravému davu."
 fp1_other_decisions.0003.desc.outro.faithful: "\n\nOpravdu, podívaná hodná [gf_faith.PantheonTerm]."
 fp1_other_decisions.0003.desc.outro.political: "\n\nMožná nesdílím víru, ale šťastní poddaní dělají šťastného [blotter.GetTitleAsNameNoTooltip]."
 fp1_other_decisions.0003.happy_characters_list: "Každý pozvaný [gf_faith.GetName] [character|E]"
 fp1_other_decisions.0003.happy_titles_list: "Každý pozvaný [gf_faith.GetName] [county|E]"
 fp1_other_decisions.0003.unhappy_characters_list: "Každý [realm|E] [character|E], který nepraktikuje lidské oběti"
 fp1_other_decisions.0003.unhappy_titles_list: "Každý [realm|E] [county|E], který nepraktikuje lidské oběti"
 fp1_other_decisions.0003.attendee_became_cannibal: "Zúčastnili jste se [blotter.GetTitledFirstNamePossessiveNoTooltip] kanibalské hostiny"
 fp1_other_decisions.0003.a: "Na [gf_faith.HighGodName]! Na [gf_faith.FertilityGodName]! Na [gf_faith.WealthGodName]!"
 fp1_other_decisions.0003.b: "Zdá se to být vynikající příležitostí zapůsobit na šlechtu."
 fp1_other_decisions.0003.b.nobility_list: "Každý pozvaný [gf_faith.GetName] šlechtic alespoň [count|E]-[rank|E]"
 fp1_other_decisions.0003.b.clergy_list: "Každý pozvaný [gf_faith.GetName] duchovní alespoň [count|E]-[rank|E] a váš [GetPlayer.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]"
 fp1_other_decisions.0003.c: "Čas pobýt mezi prostými lidmi!"
 fp1_other_decisions.0003.d: "Odejdu dříve; už jsem toho #EMP dost#!."
 fp1_other_decisions.0003.e: "Na [gf_faith.HighGodName]! Říkám to správně?"
 fp1_other_decisions.0003.f: "Tito [gf_faith.GetAdherentNamePluralNoTooltip] mají jistě lákavou víru..."
 fp1_other_decisions.0004.t: "$fp1_other_decisions.0001.t$"
 fp1_other_decisions.0004.desc: "Někteří v mých zemích věří v pořádání velkých obětních jatí pro své fiktivní bohy. Má vlastní osvícená [blotter.GetFaith.GetAdjective] víra žádnou takovou jatku neuznává, a přesto má zvláštní vlastnost mnoho takových [blotter.Custom('GruesomeFestivalNamePlural')], že závisejí na aktivní účasti [blotter.GetTitleAsNameNoTooltip].\n\nNemusím konvertovat k jejich přesvědčení, abych spravoval jejich zvyky, ale nepochybně by mi to přineslo mnoho přátel mezi mými méně osvícenými poddanými, rolníky i šlechtou, pokud bych souhlasil hostit velkou [blotter.Custom('GruesomeFestivalName')] pro jejich víru."
 fp1_other_decisions.0004.a: "Usmíření [option_1.GetAdherentNamePlural] by se mohlo vyplatit..."
 fp1_other_decisions.0004.b: "Takže [option_2.GetAdherentNamePlural] by mě vlastně #EMP podpořili#?"
 fp1_other_decisions.0004.c: "[option_3.GetAdjective] festivaly mají jisté kouzlo."
 fp1_other_decisions.0004.d: "To by bylo, v nejlepším případě, #EMP naprosté#! kacířství!"
 fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl: "Veškerá krev se sbírá do mísy a [gf_faith.PriestNeuterPlural] ji používají k pomalování zdí [gf_faith.HouseOfWorship], uvnitř i navenek"
 fp1_other_decisions.0003.desc.sacrifice.norse_cannibal_excarnation: "Jedlé maso se odřezává pro hostinu, zatímco zbytky jsou pověšeny na strom venku a další [blotter.Custom('SacrificeTerm')] je vtažen ven"
 fp1_other_decisions.0003.desc.sacrifice.norse_throttling: "se divoce zmítá, zatímco [gf_faith.PriestNeuterPlural] dusí [Select_CString(sacrifice.IsFemale,'její','jeho')] život, světlo v [sacrifice.GetHerHis] [sacrifice.Custom('EyeEyes')] vydrží až do porážky prvního zvířete. Lidské mrtvoly na visící strom, zvířata do kuchyňských ohňů"
 fp1_other_decisions.0003.desc.sacrifice.generic_cannibal_slaughter: "[Select_CString(ROOT.Char.IsFemale,'omráčena','omráčen')], aby tělo povolilo. Strach by zkazil maso. Poté se spustí [gf_faith.PriestNeuterPlural], odřezávají šťavnaté maso pro vařicí kotle, zatímco další [blotter.Custom('SacrificeTerm')] je přiveden, stále řvoucí"
 fp1_other_decisions.0003.desc.sacrifice.generic_human_disemboweling: "[Select_CString(sacrifice.IsFemale,'Její','Jeho')] spoluvězni sledují v hrůze, jak je tělo rozpitváno, vědouce, že přijde jejich řada. Možná závidí čistší smrt zvířat, která jdou po smrti přímo na kuchyňské ohně"
 fp1_other_decisions.0011.t: "$fp1_other_decisions.0001.t$"
 fp1_other_decisions.0011.desc.intro: "[blotter.Custom('GruesomeFestivalNamePlural')|U] jsou základní součástí víry [gf_faith.GetName] a [blotter.Custom2('MyCharacterIntroduction', ROOT.Char)] pořádá jedno takové shromáždění.\n\nMá to být velkolepá záležitost, které se zúčastní všichni [gf_faith.GetAdherentNamePluralNoTooltip] z [blotter.GetPrimaryTitle.GetNameNoTier], šlechta i prostý lid."
 fp1_other_decisions.0011.desc.cannibal_blot: "Jako u mnoha zvláštních rituálů by byla rituální konzumace lidského masa pro někoho mého postavení povinná."
 fp1_other_decisions.0011.desc.fallback: "Jídlo, zábava a podobné věci budou zcela hrazeny [blotter.GetTitledFirstNameNoTooltip]."
 fp1_other_decisions.0011.desc.outro: "\n\nI když budu zaneprázdněn, je zvykem poslat vyslance, který vysvětlí mou zaneprázdněnost. Pokud bych však [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')] urazit svého [blotter.GetTitleAsNameNoTooltip], [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] bych neodeslat žádnou odpověď..."
 fp1_other_decisions.0011.a: "Je slušné si udělat čas na jeden den."
 fp1_other_decisions.0011.b: "Sakra na [blotter.GetFirstNameNoTooltip] a toho koně, na kterém přijel posel."
 fp1_other_decisions.0011.b.tt: "[blotter.GetFirstNameNoTooltip] si může vaší nepřítomnost časem všimnout"
 fp1_other_decisions.0011.c: "Posvátné maso! Nemohu se dočkat první ochutnávky..."
 fp1_other_decisions.0011.d: "Půjdu, ale nebudu jíst lidské maso."
 fp1_other_decisions.0011.e: "Není žádná šance v [gf_faith.NegativeAfterLife], že bych to #EMP [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')]#!"
 fp1_other_decisions.0011.e.tt: ""
 fp1_other_decisions.0012.t: "$fp1_other_decisions.0001.t$: Chybějící tváře"
 fp1_other_decisions.0012.desc.intro: "Není neobvyklé, že důležití poddaní zmeškají i velký [blotter.Custom('GruesomeFestivalName')], ale vhodný vyslanec, který vysvětlí proč a zúčastní se místo nich, je považován za zdvořilé.\n\n"
 fp1_other_decisions.0012.desc.multiple_decliners: "[decliner_1.GetTitledFirstName] a několik dalších byli"
 fp1_other_decisions.0012.desc.single_decliner: "[decliner_1.GetTitledFirstName] chyběl"
 fp1_other_decisions.0012.desc.outro: "zřetelně nepřítomní a neposlali žádnou zprávu předem. To je jasná urážka mé autority, i když ne zcela nezákonná."
 fp1_other_decisions.0012.a: "Zatraceně [decliner_1.GetTitledFirstNameNoTooltip]!"
 fp1_other_decisions.0012.a.decliner_toast.t: "[blotter.GetTitledFirstNameNoTooltip] si všiml vaší nepřítomnosti na [blotter.Custom('GruesomeFestivalName')]"
 fp1_other_decisions.0012.b: "Do háje s nimi všemi!"
 fp1_other_decisions.0012.b.all_decliners_list: "Všichni odmítající [vassals|E]"
 fp1_other_decisions.0012.c.singular: "No, jeho/její ztráta."
 fp1_other_decisions.0012.c.plural: "No, jejich ztráta."
 fp1_other_decisions.0021.t: "Největší rouhání"
 fp1_other_decisions.0021.desc: "Děsivé zprávy z [sacrificer.GetPrimaryTitle.GetNameNoTierNoTooltip]! Zdá se, že ohavný [sacrificer.Custom('GetUnbelieverName')], [sacrificer.GetShortUIName], obětoval urozeného [sacrificed_hof.GetTitledFirstName] své odporné víře.\n\n"
 fp1_other_decisions.0021.desc.allows_holy_wars: "Žíly zbožných [sacrificed_hof.GetFaith.GetAdherentNamePlural] všude už plápolají spravedlivým hněvem!\n\nTato urážka nemůže zůstat nepotrestána a každá krčma, tvrz a palác, kde slova [sacrificed_hof.GetFaith.WarGodName] platí, je plný řečí o svaté válce."
 fp1_other_decisions.0021.desc.disallows_holy_wars: "I v této těžké době musíme pamatovat na cesty [sacrificed_hof.GetFaith.HighGodName] a nevylévat zbytečně krev. Nic nevrátí [sacrificed_hof.GetTitledFirstNameNoTooltip] zpět, a by [Select_CString(sacrificed_hof.IsFemale,'chtěla','chtěl')], abychom truchlili zbožně a pokojně."
 fp1_other_decisions.0021.a.zealous: "Jaké je to rouhání?!"
 fp1_other_decisions.0021.a.cynical: "Jestli nic jiného, je to urážka našeho lidu!"
 fp1_other_decisions.0021.a.fallback: "Jak hrozné!"
 fp1_other_decisions.0021.cheaper_holy_wars.tt: "[holy_wars|E] proti [sacrificer.GetShortUIName] jsou nyní výrazně levnější"
 fp1_other_decisions.0021.easier_holy_wars.tt: "[holy_wars|E] proti [sacrificer.GetShortUIName] vyžadují méně [piety_levels|E] než obvykle"
 fp1_other_decisions.0021.ghw_target_preference.tt: "[great_holy_wars|E] budou pravděpodobněji namířeny proti [sacrificer.GetShortUIName]"
 fp1_other_decisions.0022.t: "$fp1_other_decisions.0021.t$"
 fp1_other_decisions.0022.desc: "Zdá se, že [unlucky_guest.GetFaith.GetAdherentNamePlural] světa nepřijali mou oběť jejich falešného [unlucky_guest.GetTitleAsNameNoTooltip] příliš dobře.\n\n"
 fp1_other_decisions.0022.desc.disallows_holy_wars: "Věrni své pacifistické víře se však zdají být spokojeni s tím, že se shromáždí a nabízejí tichá modlitby svému [unlucky_guest.GetFaith.HighGodName], místo aby hledali krvavou pomstu."
 fp1_other_decisions.0022.desc.allows_holy_wars: "Věrni své válečné víře mezi nimi mnozí volají po mé hlavě a hlásají svaté války, dokud nebude mé království setřeno z tváře země."
 fp1_other_decisions.0022.a.pacifists: "Ha, možná mě [unlucky_guest.GetFaith.HighGodName] zasáhne?"
 fp1_other_decisions.0022.a.craven: "Tohle... mohla to být chyba."
 fp1_other_decisions.0022.a.fallback: "Pche, ať přijdou!"
 fp1_other_decisions.0023.t: "$fp1_other_decisions.0021.t$"
 fp1_other_decisions.0023.desc.intro: "[unlucky_guest.GetFaith.GetAdherentNamePlural] všude jsou v šoku. Naše milované [unlucky_guest.GetShortUIName] bylo obětováno odporným [gf_faith.GetAdherentNamePlural], a co je horší, na #EMP přímý rozkaz#! jednoho z našich.\n\n"
 fp1_other_decisions.0023.desc.has_excommunication: "[blotter.GetShortUIName] [Select_CString(blotter.IsFemale,'byla','byl')] okamžitě exkomunikován a jeho/její rouhavé činy byly veřejně odsouzeny všemi dobrými [unlucky_guest.GetFaith.GetAdherentNamePluralNoTooltip]."
 fp1_other_decisions.0023.desc.does_not_have_excommunication: "Všichni zbožní [unlucky_guest.GetFaith.GetAdherentNamePluralNoTooltip] volají po tom, aby [blotter.GetShortUIName], proklet budiž [Select_CString(blotter.IsFemale,'její','jeho')] jméno, [Select_CString(blotter.IsFemale,'byla','byl')] vyvržen z víry."
 fp1_other_decisions.0023.desc.outro: "Ať [unlucky_guest.GetFaith.NegativeAfterLife] samo pohltí [blotter.GetHerHim]!"
 fp1_other_decisions.0023.a: "To je neodpustitelné!"
 fp1_other_decisions.0023.b: "Jaký to je za [blotter.GetWomanMan] #EMP jsou#! oni?!"
 fp1_other_decisions.0024.t: "$fp1_other_decisions.0021.t$"
 fp1_other_decisions.0024.desc.intro: "Co mě posedlo? Jaký služebník [unlucky_guest.GetFaith.DevilName] vzal kořeny v mé mysli, že jsem veřejně #EMP [Select_CString(ROOT.Char.IsFemale,'schvalovala','schvaloval')]#! oběť [unlucky_guest.GetShortUIName] cizím modlám? Moje rouhání je hlavním předmětem večeřních klepů všech zbožných [unlucky_guest.GetFaith.GetAdherentName] po celém světě!\n\n"
 fp1_other_decisions.0024.desc.has_excommunication: "Není zapotřebí žádného listu o exkomunikaci, aby [unlucky_guest.GetFaith.PriestNeuterPlural] odmítli slyšet mé hříchy."
 fp1_other_decisions.0024.desc.does_not_have_excommunication: "Ani nejméně nábožní [unlucky_guest.GetFaith.PriestNeuterPlural] se se mnou nechtějí setkat očima."
 fp1_other_decisions.0024.desc.outro: "Jsem ztracen a odsouzen, pokud jde o [unlucky_guest.GetFaith.GetReligion.GetName]."
 fp1_other_decisions.0024.a: "#EMP Co jsem to [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')]?!#!"
 fp1_other_decisions.0024.b: "[Select_CString(unlucky_guest.IsFemale,'Byla','Byl')] jen [unlucky_guest.GetWomanMan], ne božstvo!"
 fp1_other_decisions.0024.c: "Byli to moji poddaní, ne já!"
 fp1_other_decisions.0063.t: "$game_concept_designate_chief_sacrifice_chief_sacrifice$ [Select_CString(ROOT.Char.IsFemale,'zemřela','zemřel')] před [ROOT.Char.Custom('GruesomeFestivalName')|U]"
 fp1_other_decisions.0063.desc: "[designated_sacrifice.GetTitledFirstNameNoTooltip] [Select_CString(designated_sacrifice.IsFemale,'zemřela','zemřel')] dříve, než [Select_CString(designated_sacrifice.IsFemale,'mohla','mohl')] být [Select_CString(designated_sacrifice.IsFemale,'obětována','obětován')]."
 fp1_other_decisions.0101.t.root_title: "Skály skrz věky"
 fp1_other_decisions.0101.t: "$fp1_other_decisions.0101.t.root_title$: Předmět"
 fp1_other_decisions.0101.desc: "Každý runový kámen nese zprávu o nějaké významné události v životě toho, kdo jej nechal vztyčit. Od nejmenšího rolníka po [ROOT.Char.GetTitleAsNameNoTooltip] jako jsem já, kámen vše zaznamená.\n\nO čem ať tento pomník hovoří?"
 fp1_other_decisions.0101.a: "Mému zesnulému [ROOT.Char.Custom2('RelationToMeShort',ancestor)], [ancestor.GetFirstNameNoTooltip]."
 fp1_other_decisions.0101.a.tt: "Runový kámen bude vyprávět o tvé zemřelé rodině..."
 fp1_other_decisions.0101.b: "Možná o mém poraženém nepříteli, [foe.GetTitledFirstNameNoTooltip]?"
 fp1_other_decisions.0101.b.tt: "Runový kámen bude vyprávět o tvých vítězstvích v dobytí..."
 fp1_other_decisions.0101.c: "O mém nástupu na trůn [new_title.GetNameNoTierNoTooltip]!"
 fp1_other_decisions.0101.c.tt: "Runový kámen bude vyprávět o tom, jak jsi přišel k vládě..."
 fp1_other_decisions.0101.d: "Chceš po mně, abych zaplatil #EMP KOLIK#! za obrovský malovaný balvan?"
 fp1_other_decisions.0111.t: "$fp1_other_decisions.0101.t.root_title$: Umístění"
 fp1_other_decisions.0111.desc.intro: "Teď, když jsem se rozhodl, co dát na svůj runový kámen, zůstává otázka: kam jej umístit?\n\n"
 fp1_other_decisions.0111.desc.ancestor: "Pamětní kameny rodině, jako je [ancestor.GetFirstName], podporují respekt a věrnost. Nejlépe se hodí na místa, která na mne málo myslí, kde mohu předvést své oddání a službu vyšším mocnostem."
 fp1_other_decisions.0111.desc.conquest: "Pamětní kameny vítězství, jako mé vítězství nad [foe.GetTitledFirstName], jsou trvalou připomínkou slavného konce války. Nejlépe se umísťují do oblastí, které potřebují povzbuzení ke spolupráci."
 fp1_other_decisions.0111.desc.promotion: "Pomníky povýšení, jako můj vzestup na [ROOT.Char.GetTitleAsNameNoTooltip] [new_title.GetNameNoTierNoTooltip], povzbuzují lidi, aby sloužili svému vládci v dobrém i zlém. Nejlépe se umísťují ve městech, kde může více mládeže být inspirováno vstoupit do odvodu."
 fp1_other_decisions.0111.desc.outro: "\n\nSamozřejmě mě napadá jedna či dvě místa..."
 fp1_other_decisions.0111.a: "[location_a.GetNameNoTierNoTooltip|U] by bylo dobré místo."
 fp1_other_decisions.0111.b: "[location_b.GetNameNoTierNoTooltip|U] se zdá být dostatečně dobré?"
 fp1_other_decisions.0111.c: "[location_c.GetNameNoTierNoTooltip|U] je výborná volba!"
 fp1_other_decisions.1000.t: "Obětováno!"
 fp1_other_decisions.1000.desc: "Stojím tváří v tvář skandujícímu davu, všechny oči upřené na mě. [blotter.GetFirstName] stojí v čele se šklebem na [Select_CString(blotter.IsFemale,'její','jeho')] tváři, napjatě čeká, až mi ukončí život.\n\n„Mocný [blotter.GetFaith.HighGodName]! Přijmi tuto oběť!“ [blotter.GetSheHe] křičí.\n\nTo je pro mě konec.\n\nPadá tma.\n\nJe po všem."
 fp1_other_decisions.1000.a: "Uvidíme se v [ROOT.Char.GetFaith.NegativeAfterLife]!"
