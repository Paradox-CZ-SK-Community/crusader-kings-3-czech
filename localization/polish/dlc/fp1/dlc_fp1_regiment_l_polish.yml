l_polish:
 bondi: "Bondí"
 vigmen: "Vigmen"
 varangian_veterans: "Varjažští veteráni"
 jomsviking_pirates: "Jomsvikingští piráti"
 bondi_flavor: "#F Bondí jsou součástí vrstvy svobodných držitelů půdy, často zruční námořníci, kteří používají dlouhé lodě k obchodování nebo k vikingským výpravám. Bojují s kopími a štíty.#!"
 vigmen_flavor: "#F Bojovníci v první linii vytvářejí neproniknutelnou zeď štítů, která chrání lučištníky vzadu. Tato taktika odrazuje lehké střelce a zároveň umožňuje plynulý postup.#!"
 varangian_veterans_flavor: "#F Průzkumníci, dobrodruzi, bojovníci a žoldnéři ze všech koutů dalekých nordických kolonií. Někteří z nich dokonce sloužili ve Varjažské gardě.#!"
 jomsviking_pirates_flavor: "#F Jomsvikingové, jedni z nejproslulejších nájezdníků, kteří kdy řádili na Baltu, vynikají v rozsévání chaosu v bitvě, prodlužují ji a následně využívají vzniklého zmatku ve svůj prospěch.#!"
