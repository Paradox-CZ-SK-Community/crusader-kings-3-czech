l_polish:
 bondi: "Bondí"
 vigmen: "Vigmen"
 varangian_veterans: "Varjažští veteráni"
 jomsviking_pirates: "Jómští piráti"
 bondi_flavor: "#F Bondí patří k vrstvě svobodných držitelů půdy a často jsou zdatnými námořníky. Na langskipech obchodují i vyrážejí na vikinské výpravy a v boji používají kopí a štíty.#!"
 vigmen_flavor: "#F Bojovníci v první linii vytvářejí neproniknutelnou hradbu štítů, která chrání lučištníky za nimi. Tato taktika drží lehké oddíly na uzdě a zároveň umožňuje vytrvalý postup.#!"
 varangian_veterans_flavor: "#F Průzkumníci, dobrodruzi, válečníci a žoldnéři ze vzdálených severských osad. Někteří dokonce sloužili ve Varjažské gardě.#!"
 jomsviking_pirates_flavor: "#F Jómští vikingové patří k nejobávanějším nájezdníkům, kteří kdy brázdili Balt. V boji mistrně rozsévají chaos, protahují střet a naplno využívají zmatku, který po něm zůstává.#!"
