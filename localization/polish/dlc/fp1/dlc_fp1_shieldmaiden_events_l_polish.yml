l_polish:
 fp1_shieldmaiden.0001.t: "Budoucí [shieldmaiden.Custom('ShieldPersonFemaleMale')]"
 fp1_shieldmaiden.0001.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('shieldmaiden'))|U] [shieldmaiden.GetTitledFirstName] přede mnou předstupuje se slovy: „[ROOT.Char.Custom('FormOfAddressForLiege')|U], žádám o možnost dokázat, co ve mně je.“ Trochu se zavrtím na trůnu a se zájmem poslouchám, zatímco celý dvůr kolem nás napíná uši.\n\n„Přestože se vyrovnám kterémukoli z tvých $knight_culture_player_plural_no_tooltip_lowercase$, nesmím zaujmout místo ve tvé štítové hradbě ani velet tvým vojskům. Chci vyzvat [challenged_knight.GetTitledFirstName] na souboj a dokázat svou cenu v boji.“"
 fp1_shieldmaiden.0001.a: "Dobrá, můžeš se utkat s [challenged_knight.GetTitledFirstNameNoTooltip]."
 fp1_shieldmaiden.0001.a.tt_success: "[challenged_knight.GetFirstNameNoTooltip] vítězí"
 fp1_shieldmaiden.0001.a.tt_failure: "[shieldmaiden.GetFirstNameNoTooltip] vítězí"
 fp1_shieldmaiden.0001.b: "[challenged_knight.GetFirstNameNoTooltip]? Kdepak, budeš bojovat se #EMP mnou#!!"
 fp1_shieldmaiden.0001.b.tt_success: "Porazíš [shieldmaiden.GetFirstNameNoTooltip]"
 fp1_shieldmaiden.0001.b.tt_failure: "[shieldmaiden.GetFirstNameNoTooltip] tě srazí zpět"
 fp1_shieldmaiden.0001.c: "Už jen požádat o to chtělo dost odvahy."
 fp1_accepted_shieldmaiden_without_question: "Každý [Concept('courtier','dvořan')|E] a [Concept('vassal','vazal')|E], který si myslí, že [Select_CString(shieldmaiden.IsFemale,'ženy','muži')] neumějí bojovat"
 fp1_shieldmaiden.0001.d: "[shieldmaiden.Custom('ShieldPersonFemaleMale')|U]? K smíchu!"
 fp1_shieldmaiden.0011.t: "[shieldmaiden.Custom('ShieldPersonFemaleMale')|U] brání v útěku"
 fp1_shieldmaiden.0011.desc: "Vypáčit zámek cely je snazší, než [Select_CString(ROOT.Char.IsFemale,'jsem čekala','jsem čekal')]. Proklouznout kolem jednoho strážného za druhým už je těžší, ale zvládnu to a jako stín se plížím pryč z vězení.\n\nSvobodu už téměř #EMP cítím#! na jazyku, když mi ji někdo vyrve z rukou. Za rohem se ze tmy vynoří [shieldmaiden.GetTitledFirstName], [shieldmaiden.Custom('ShieldPersonFemaleMale')|L]. Patří k družině, které velí [imprisoner.GetFirstNameNoTooltip].\n\n[Select_CString(shieldmaiden.IsFemale,'Její','Jeho')] palice mi letí přímo do obličeje dřív, než ji vůbec stačím zaregistrovat."
 fp1_shieldmaiden.0011.a: "Počkej, ne, ne— ÁÁÁ!"
 fp1_shieldmaiden.0012.t: "$fp1_shieldmaiden.0011.t$"
 fp1_shieldmaiden.0012.desc: "[prisoner.GetTitledFirstName] [Select_CString(prisoner.IsFemale,'byla dnes nad ránem vrácena','byl dnes nad ránem vrácen')] do cely poté, co se [Select_CString(prisoner.IsFemale,'jí','mu')] v noci málem podařilo uprchnout.\n\nZdá se, že [Select_CString(prisoner.IsFemale,'proklouzla','proklouzl')] kolem většiny stráží, než útěk při neklidné noční procházce [Select_CString(shieldmaiden.IsFemale,'zpozorovala','zpozoroval')] [shieldmaiden.GetTitledFirstName].\n\n[shieldmaiden.Custom('ShieldPersonFemaleMale')|U] [shieldmaiden.GetFirstNameNoTooltip] pak [prisoner.GetFirstNameNoTooltip] [Select_CString(shieldmaiden.IsFemale,'zmlátila','zmlátil')] do krve a nakonec [Select_CString(shieldmaiden.IsFemale,'odvlekla','odvlekl')] zpět ke strážím."
 fp1_shieldmaiden.0012.a: "Výborná práce, [shieldmaiden.GetFirstNameNoTooltip]."
 fp1_shieldmaiden.0012.b: "Proč jsi [prisoner.GetFirstNameNoTooltip] [Select_CString(shieldmaiden.IsFemale,'zmlátila','zmlátil')] až tak?!"
 fp1_shieldmaiden.0021.t: "$murder_save_header$ [shieldmaiden.Custom('ShieldPersonFemaleMale')]"
 fp1_shieldmaiden.0021.desc.assassin: "Mému vrahovi se nepodařilo zabít [target.GetTitledFirstName]! Těsně před vraždou prý [Select_CString(shieldmaiden.IsFemale,'zasáhla','zasáhl')] [shieldmaiden.GetTitledFirstName], [Select_CString(shieldmaiden.IsFemale,'objevila se','objevil se')] doslova několik vteřin před činem a mého najatého zabijáka [Select_CString(shieldmaiden.IsFemale,'zlikvidovala','zlikvidoval')]."
 fp1_shieldmaiden.0021.desc.thugs: "Hrdlořezové, které jsem [Select_CString(ROOT.Char.IsFemale,'najala','najal')] k zabití [target.GetTitledFirstName], selhali! Přes všechnu svou brutalitu je [shieldmaiden.GetTitledFirstName], [shieldmaiden.Custom('ShieldPersonFemaleMale')], [Select_CString(shieldmaiden.IsFemale,'dokázala','dokázal')] zadržet dost dlouho na to, aby dorazily stráže a zbývající bandity zlikvidovaly."
 fp1_shieldmaiden.0021.desc.mob: "Dav, který jsem [Select_CString(ROOT.Char.IsFemale,'poštvala','poštval')] proti [target.GetTitledFirstName], sice dokázal svou oběť strhnout z koně, ale než mohl dílo dokončit, [Select_CString(shieldmaiden.IsFemale,'zasáhla','zasáhl')] [shieldmaiden.GetTitledFirstName], [shieldmaiden.Custom('ShieldPersonFemaleMale')]. [Select_CString(shieldmaiden.IsFemale,'Bez milosti pobila','Bez milosti pobil')] všechny rolníky na dosah [target.GetFirstNameNoTooltip] a ostatní [Select_CString(shieldmaiden.IsFemale,'zahnala','zahnal')] na útěk."
 fp1_shieldmaiden.0021.desc.lured_into_forest: "[Select_CString(ROOT.Char.IsFemale,'Myslela','Myslel')] jsem, že můj plán ztratit [target.GetTitledFirstName] v lese vyšel dokonale, když se setmělo a [target.Custom('GirlBoy')] stále [Select_CString(target.IsFemale,'nebyla','nebyl')] nikde k nalezení.\n\nBohužel právě když jsem se [Select_CString(ROOT.Char.IsFemale,'chystala','chystal')] spát, dorazila zpráva, že [shieldmaiden.GetTitledFirstName] [Select_CString(shieldmaiden.IsFemale,'vyšla','vyšel')] z lesa a [target.GetFirstNameNoTooltip] [Select_CString(target.IsFemale,'byla','byl')] s [Select_CString(shieldmaiden.IsFemale,'ní','ním')]. [shieldmaiden.GetFirstNameNoTooltip] se zjevně [Select_CString(shieldmaiden.IsFemale,'vydala','vydal')] po stopách, které [target.GetFirstNameNoTooltip] [Select_CString(target.IsFemale,'zanechala','zanechal')], a [Select_CString(shieldmaiden.IsFemale,'našla','našel')] [Select_CString(target.IsFemale,'ji','ho')] dřív než hladová zvěř."
 fp1_shieldmaiden.0021.desc.child_pushed: "[target.Custom('GirlBoy')|U], [Select_CString(target.IsFemale,'která','který')] jednou bude [target.GetTitleAsNameNoTooltip], [Select_CString(target.IsFemale,'byla dost pošetilá','byl dost pošetilý')], aby [Select_CString(target.IsFemale,'padla','padl')] do mé pasti! [target.GetFirstName] podle plánu [Select_CString(target.IsFemale,'vyšplhala','vyšplhal')] až k okraji balkonu a můj spolčenec [Select_CString(target.IsFemale,'ji','ho')] shodil dolů...\n\n...Jenže pád, který měl být smrtelný, smrtí neskončil. Těsně nad zemí [Select_CString(shieldmaiden.IsFemale,'zasáhla','zasáhl')] [shieldmaiden.GetTitledFirstName] a [Select_CString(target.IsFemale,'ji','ho')] [Select_CString(shieldmaiden.IsFemale,'zachytila','zachytil')]. [target.GetFirstNameNoTooltip] [Select_CString(target.IsFemale,'přežila','přežil')] další den a na stejný trik už nejspíš podruhé neskočí."
 fp1_shieldmaiden.0021.shieldmaiden_dies: "\n\nAlespoň [shieldmaiden.GetFirstNameNoTooltip] už mi potíže dělat nebude, protože na následky svých zranění [Select_CString(shieldmaiden.IsFemale,'zemřela','zemřel')]."
 fp1_shieldmaiden.0021.a: "Je konec..."
 fp1_shieldmaiden.0021.b: "...Není konec, dokud to neřeknu já!"
 fp1_shieldmaiden.0022.t: "$murder_save_header$ [shieldmaiden.Custom('ShieldPersonFemaleMale')]"
 fp1_shieldmaiden.0022.desc.assassin: "[Select_CString(ROOT.Char.IsFemale,'Málem jsem dnes zemřela','Málem jsem dnes zemřel')]! Kdyby si [shieldmaiden.GetFirstName] [Select_CString(shieldmaiden.IsFemale,'nevšimla','nevšiml')], že něco není v pořádku, a [Select_CString(shieldmaiden.IsFemale,'nevydala se','nevydal se')] za mnou až do mých komnat, už bych [Select_CString(ROOT.Char.IsFemale,'byla mrtvá','byl mrtvý')].\n\nO vrahovi jsem se poprvé [Select_CString(ROOT.Char.IsFemale,'dozvěděla','dozvěděl')], když se [shieldmaiden.GetFirstNameNoTooltip] [Select_CString(shieldmaiden.IsFemale,'vrhla','vrhl')] na někoho těsně za mnou a [Select_CString(shieldmaiden.IsFemale,'srazila','srazil')] ho k zemi. Pak už všechno splynulo v jednu změť nožů a pěstí, dokud útočník nezůstal ležet mrtvý."
 fp1_shieldmaiden.0022.desc.assassin.shieldmaiden_dies: "\n\nBohužel [shieldmaiden.GetFirstNameNoTooltip] [Select_CString(shieldmaiden.IsFemale,'zaplatila','zaplatil')] nejvyšší cenu. Vrah je sice mrtvý, ale zranění [shieldmaiden.GetFirstNameNoTooltip] se ukázala jako smrtelná."
 fp1_shieldmaiden.0022.desc.thugs: "Cestuji se svou družinou, když se z hájku ozve výkřik: „Útok! Na [ROOT.Char.GetTitleTierName]!“ Léčka!\n\nNejsou to obyčejní bandité, kterým jde o mé zlato, ale hrdlořezové, kteří chtějí můj život! [shieldmaiden.Custom('ShieldPersonFemaleMale')|U] [shieldmaiden.GetFirstNameNoTooltip] se mi vrhá na pomoc a vlastním tělem se staví mezi mě a krvelačné bandity.\n\n[shieldmaiden.GetFirstNameNoTooltip|U] ustupuje za zuřivého boje, zatímco se na nás nepřátelé sbíhají s napřaženými čepelemi. Brzy se však vzpamatují i ostatní stráže a zbývající útočníky pobijí."
 fp1_shieldmaiden.0022.desc.thugs.shieldmaiden_dies: "Teprve když boj utichne, [shieldmaiden.GetFirstNameNoTooltip] se zhroutí k zemi a já spatřím hluboká zranění. [Select_CString(shieldmaiden.IsFemale,'Skutečně mě chránila','Skutečně mě chránil')] až do úplného konce..."
 fp1_shieldmaiden.0022.desc.mob: "Projíždím ulicemi [home_province.GetName], když se na mou družinu vrhne dav křičících rolníků. Než vůbec pochopím, co se děje, strhnou mě z koně a začnou mě bít!\n\n[shieldmaiden.Custom('ShieldPersonFemaleMale')|U] [shieldmaiden.GetFirstName] se mi vrhá na pomoc. [Select_CString(shieldmaiden.IsFemale,'Její','Jeho')] [shieldmaiden.Custom('signature_weapon')] se míhá ve vzduchu a [shieldmaiden.GetFirstNameNoTooltip] nemilosrdně [shieldmaiden.Custom('SignatureWeaponWoundVerb1PresentParticiple')] rolníky, kteří mě bili. Možná ne právě důstojně mě tak chrání před dalšími ranami, zatímco mizím pod hromadou jejich těl."
 fp1_shieldmaiden.0022.desc.mob.shieldmaiden_lives: "\n\nKdyž zvuky boje utichnou, [shieldmaiden.GetFirstNameNoTooltip] ze mě odvalí těla a pomůže mi na nohy. Kromě nás je teď ulice prázdná; všichni spiklenci jsou mrtví nebo uprchli."
 fp1_shieldmaiden.0022.desc.mob.shieldmaiden_dies: "\n\nKdyž se konečně vyhrabu z hromady mrtvol, ulice je liduprázdná až na těla padlých. Mezi nimi leží i [shieldmaiden.GetFirstNameNoTooltip]."
 fp1_shieldmaiden.0022.desc.lured_into_forest: "[Select_CString(ROOT.Char.IsFemale,'Hrála','Hrál')] jsem si s několika dvořany v lese na schovávanou, když mi dojde, že už je podezřele dlouho neslyším, jak mě někdo hledá. Příliš dlouho.\n\nVolám, ale nikdo neodpovídá. Nechali mě tu... Pokouším se najít cestu domů, ale vůbec nevím, kterým směrem se vydat, a rychle se stmívá.\n\nBrzy slyším, jak se mezi stromy pohybují šelmy, ale než se ke mně dostanou, objeví se [shieldmaiden.Custom('ShieldPersonFemaleMale')] [shieldmaiden.GetFirstName], [Select_CString(shieldmaiden.IsFemale,'zadýchaná a mávající','zadýchaný a mávající')] hořící pochodní. Oheň šelmy zřejmě odrazuje a drží se dál, zatímco [shieldmaiden.GetFirstNameNoTooltip] mezi nádechy pronese: „Dostanu... tě domů... [ROOT.Char.Custom('FormOfAddressForLiege')]...“"
 fp1_shieldmaiden.0022.desc.child_pushed: "\n\n#EMP ŽUCH#!\n\n[Select_CString(ROOT.Char.IsFemale,'Spadla jsem','Spadl jsem')] přímo do náruče [shieldmaiden.GetFirstNameNoTooltip], mého [shieldmaiden.Custom('ShieldPersonFemaleMale')]. „Pošetilé dítě! Kdybych tě [Select_CString(shieldmaiden.IsFemale,'nezachytila','nezachytil')] včas... ale nic. Odvedu tě někam do bezpečí.“"
 fp1_shieldmaiden.0022.owner_discovered: "\n\nZa tímto útokem může stát jediný člověk: [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 fp1_shieldmaiden.0022.a: "Kdo by chtěl #EMP mou#! smrt?"
 fp1_shieldmaiden.0022.b: "[owner.GetFirstNameNoTooltip] za tohle zaplatí!"
 fp1_shieldmaiden.0032.t: "[shieldmaiden.Custom('ShieldPersonFemaleMale')|U] získává zkušenosti"
 fp1_shieldmaiden.0032.desc.root: "Mezi válkami je důležité neztratit cvik.\n\nPrávě proto jsem na cvičišti, kde ve třetí cvičné bitvě dne své vojáky bez milosti tluču, zápasím s nimi a peskuji je.\n\nKdyž je svolám ke čtvrtému kolu, ozve se sbor sténání. Jen ať si stěžují. Musím trénovat."
 fp1_shieldmaiden.0032.desc.courtier: "Sledovat [shieldmaiden.GetTitledFirstName] při výcviku je vždy zážitek. Bojuje s takovou zuřivostí a vervou, že je snadné zapomenout, že jde jen o cvičný střet.\n\nPo cvičišti se válí rozbité vybavení a potlučení vojáci. Když boj na chvíli ustane, z vyčerpaných protivníků [shieldmaiden.GetFirstNameNoTooltip] se ozve sbor úlevného sténání.\n\nPřestávka je však téměř okamžitě u konce a [shieldmaiden.GetFirstNameNoTooltip] se znovu vrhá do boje."
 fp1_shieldmaiden.0032.a.root: "Má štítová hradba je nezlomná!"
 fp1_shieldmaiden.0032.a.courtier: "Jen se podívejte, jak [shieldmaiden.GetFirstNameNoTooltip] velí té štítové hradbě!"
 fp1_shieldmaiden.0032.b.root: "Mé údery mají sílu válečného božstva: [shieldmaiden.GetFaith.WarGodName]!"
 fp1_shieldmaiden.0032.b.courtier: "Jen se podívejte, jak [shieldmaiden.GetFirstNameNoTooltip] máchá čepelí!"
 fp1_shieldmaiden.0032.c.root: "Vidím každou slabinu svých nepřátel!"
 fp1_shieldmaiden.0032.c.courtier: "[shieldmaiden.GetFirstNameNoTooltip|U] vždycky najde skulinu v obraně!"
