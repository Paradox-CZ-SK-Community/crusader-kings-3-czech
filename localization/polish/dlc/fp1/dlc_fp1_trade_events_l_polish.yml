l_polish:
 TRUCE_TRADE_DEAL: "\nPříměří uzavřeno výměnou za ukončení nájezdů"
 fp1_trade_events.0000.t: "Nájezd, nebo obchod"
 fp1_trade_events.0002.t: "$fp1_trade_events.0000.t$?"
 fp1_trade_events.0002.desc: "Když se se svými vojsky připravuji vyplenit země [county.GetNameNoTierNoTooltip], vracejí se první průzkumníci se zprávami.\n\nMístní města jsou podle všeho bohatá, ale mnohá jsou silně opevněná. Než se dostaneme k těm nejlákavějším cílům, mohly by nás zaskočit armády prahnoucí po pomstě.\n\nJeště není vše ztraceno. Umění dobrého nájezdu spočívá především ve využití příležitosti a možná bychom místo tasení čepelí mohli vyjednat obchod a tribut."
 fp1_trade_events.0002.a: "Možná bude místní [county.GetHolder.GetTitleAsNameNoTooltip] ochoten jednat?"
 fp1_trade_events.0002.a.accepted: "Pokud bude tvá nabídka přijata"
 fp1_trade_events.0002.a.rejected: "Pokud bude tvá nabídka odmítnuta"
 fp1_trade_events.0002.a.tt: "Pokračuješ v nájezdu na [county.GetNameNoTierNoTooltip]"
 fp1_trade_events.0002.b: "Příměří s [county.GetHolder.GetTopLiege.GetTitleAsNameNoTooltip], který zde vládne, by mohlo být k nezaplacení..."
 fp1_trade_events.0002.c: "Ano, obchodem bychom nejspíš #EMP mohli#! vydělat. Stejně to vypleňte."
 fp1_trade_events.0002.c.tt: "$fp1_trade_events.0002.a.tt$"
 fp1_trade_events.0002.d: "Co je to za zbabělého #EMP feudála#!, který vydělává bez nájezdů?"
 fp1_trade_events.0002.d.tt: "Vypleníš [county.GetNameNoTierNoTooltip] a po zbytek života odmítáš byť jen uvažovat o obchodu namísto nájezdů"
 fp1_trade_events.0003.t: "$fp1_trade_events.0000.t$?"
 fp1_trade_events.0003.desc: "Do [county.GetNameNoTierNoTooltip] vtrhla neukázněná horda banditů, pirátů a dalších po zuby ozbrojených darebáků vedená [raider.GetFirstName]!\n\nZpočátku se mí průzkumníci domnívali, že přišli plenit, ale vyslanec jejich [raider.GetTitleAsNameNoTooltip] tvrdí, že by místo toho rádi obchodovali. Jejich vojsko veze spoustu staré i nové kořisti, takže by místní dostali příležitost nakoupit exotické zboží z celého světa.\n\nSkrytý význam nabídky je zřejmý. Přistoupíme na obchod za podmínek výhodných pro ně a odejdou v míru. Odmítneme-li, vezmou si, co budou chtít."
 fp1_trade_events.0003.a: "Nečekaná nabídka, ale více než vítaná."
 fp1_trade_events.0003.a.tt_success: "Tvá nabídka byla přijata!"
 fp1_trade_events.0003.b: "#EMP Obchodovat#!? S těmito lupiči?!"
 fp1_trade_events.0003.b.tt_failure: "Tvá nabídka byla odmítnuta!"
 fp1_trade_events.0011.t: "$fp1_trade_events.0000.t$: Výhodná dohoda"
 fp1_trade_events.0011.desc.subsequent_renewal: "Po celá desetiletí"
 fp1_trade_events.0011.desc.first_renewal: "Po mnoho let"
 fp1_trade_events.0011.desc.outro: " mám dohodu s [recipient.GetTitledFirstName]. V zemích [recipient.GetFirstNameNoTooltip] nechávají mí nájezdníci zbraně za opaskem a místní poddaní kupují exotické zboží, které ukořistíme v méně diplomatických panstvích.\n\nPlatnost naší dohody se však chýlí ke konci a mnozí z mé družiny se svých pohodlných obchodních kontaktů vzdávají jen neradi.\n\nMožná by [recipient.GetFirstNameNoTooltip] [Select_CString(recipient.IsFemale,'souhlasila','souhlasil')] s jejím prodloužením?"
 fp1_trade_events.0011.a: "Velkolepá nabídka!"
 fp1_trade_events.0011.a.accepted: "Tvá nabídka byla přijata"
 fp1_trade_events.0011.a.rejected: "Tvá nabídka byla odmítnuta"
 fp1_trade_events.0011.b: "Tahle dohoda už dosloužila..."
 fp1_trade_events.0011.b.tt: "Dohoda tiše vyprší"
 fp1_trade_events.0012.t: "$fp1_trade_events.0011.t$"
 fp1_trade_events.0012.desc.subsequent_renewal: "$fp1_trade_events.0011.desc.subsequent_renewal$"
 fp1_trade_events.0012.desc.first_renewal: "$fp1_trade_events.0011.desc.first_renewal$"
 fp1_trade_events.0012.desc.outro: " pevně platí má dohoda s [raider.GetTitledFirstName]: v mých zemích drží [raider.GetFirstNameNoTooltip] své psy na uzdě a mí obchodníci kupují kořist nakradenou jinde.\n\nProtože se blíží konec platnosti dohody, [raider.GetFirstNameNoTooltip] se [Select_CString(raider.IsFemale,'ozvala','ozval')] s návrhem na její prodloužení.\n\nNěkolik zámožnějších bojovníků z družiny [raider.GetFirstNameNoTooltip] mi navíc v soukromí nabídlo vybrané dary, pokud jim dál umožním tak volný přístup na naše trhy. A #EMP je#! příjemné nemuset se strachovat, že rozezlení [raider.GetPrimaryTitle.GetAdjectiveNoTooltip] nájezdníci vyplení kraj..."
 fp1_trade_events.0012.a: "Nanejvýš přijatelná nabídka!"
 fp1_trade_events.0012.a.tt_success: "$fp1_trade_events.0011.a.accepted$"
 fp1_trade_events.0012.b: "S [raider.GetFirstNameNoTooltip] jsem [Select_CString(ROOT.Char.IsFemale,'skončila','skončil')]."
 fp1_trade_events.0012.b.tt: "$fp1_trade_events.0011.b.tt$"
 fp1_trade_events.0012.b.tt_failure: "$fp1_trade_events.0011.a.rejected$"
 fp1_trade_events.0021.t: "$fp1_trade_events.0000.t$: Návštěvníci z daleka"
 fp1_trade_events.0021.desc: "Má obchodní dohoda s [partner.GetTitledFirstName] zajišťuje, že do zemí [partner.GetFirstNameNoTooltip] pravidelně proudí mí obchodníci a drobná šlechta, aby tam prodávali kořist a dováželi cizokrajné luxusní zboží.\n\nMnohem vzácnější jsou výpravy opačným směrem, z [partner.GetPrimaryTitle.GetNameNoTier] do [ROOT.Char.GetPrimaryTitle.GetNameNoTier]. V [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] bývá jejich příjezd malou událostí sám o sobě. Tolik vzdálených cizinců s nespoutanýma rukama se tu nevidí často.\n\nVůdcům jedné takové výpravy se podařilo získat audienci a požádat mě o patronát: výmluvný [priest.GetFaith.PriestNeuter] a bystrý kupec."
 fp1_trade_events.0021.a: "Někdo by mi mohl počítat mince..."
 fp1_trade_events.0021.b: "Vítej v mých službách, [priest.GetFirstNameNoTooltip]!"
 fp1_trade_events.0021.c: "A kdo je tam vzadu s tebou?"
 fp1_trade_events.0021.d: "Jen pokračujte dál, cizinci. Dohodu mám s [partner.GetFirstNameNoTooltip]."
 fp1_trade_events.0031.t: "$fp1_trade_events.0021.t$"
 fp1_trade_events.0031.desc: "Nájezdníci, kterým velí [raider.GetTitledFirstNameNoTooltip], jsou děsivá cháska. Často jsem [Select_CString(ROOT.Char.IsFemale,'ráda','rád')], že se navzájem považujeme spíš za obezřetné přátele než za úhlavní nepřátele.\n\nMezi ty #EMP nejkrutější#! postrachy v jejich řadách patří [warrior.GetFirstName], [Select_CString(warrior.IsFemale,'nájezdnice','nájezdník')] s nemalou pověstí.\n\nKdyž [warrior.GetFirstNameNoTooltip] [Select_CString(warrior.IsFemale,'požádala','požádal')] o audienci, napůl jsem [Select_CString(ROOT.Char.IsFemale,'očekávala','očekával')] pokus o vraždu. O to #EMP příjemnějším#! překvapením je, že mi tato [Select_CString(warrior.IsFemale,'ambiciózní mladá válečnice chce nabídnout své služby','ambiciózní mladý válečník chce nabídnout své služby')]."
 fp1_trade_events.0031.a: "[Select_CString(warrior.IsFemale,'Bojovnice','Bojovníci')] z [raider.GetPrimaryTitle.GetNameNoTierNoTooltip] jsou legendární!"
 fp1_trade_events.0031.b: "Zmiz, bandito."
 fp1_trade_events.0041.t: "$fp1_trade_events.0000.t$: Nepřátelé s výhodami"
 fp1_trade_events.0041.desc: "Má dohoda s [partner.GetTitledFirstName] je výhodná pro obě strany, přesto občas přemýšlím, zda využíváme její plný potenciál. Mým zemím by prospěly zkušené ruce zedníků a tesařů od [partner.GetFirstNameNoTooltip]. A zatímco mé nájezdy [partner.GetFirstNameNoTooltip] neohrožují, mnozí jiní takové štěstí nemají.\n\nKdybychom společně přispěli na cesty našich služebníků, mohli bychom vyřešit oba problémy najednou: [partner.GetFirstNameNoTooltip] mi na čas pošle zkušené řemeslníky a já na oplátku vyšlu zkušené nájezdníky a dychtivé osadníky jako poradce, aby pomohli chránit tamní země."
 fp1_trade_events.0041.foreign_architects_growth.tt: "Nedostatečně rozvinutá [Concept('counties','hrabství')|E] ve tvé [Concept('domain','doméně')|E]"
 fp1_trade_events.0041.foreign_architects_no_growth.tt: "[Concept('counties','Hrabství')|E] ve tvé [Concept('domain','doméně')|E] s alespoň 15 body [Concept('development','rozvoje')|E]"
 fp1_trade_events.0041.partner_gets_raid_aid.tt: "Na jedno ze zranitelných [Concept('duchies','vévodství')|E] postavy [partner.GetFirstNameNoTooltip] bude obtížnější [Concept('raid','podnikat nájezdy')|E]"
 fp1_trade_events.0041.raider_gets_civic_aid.tt: "[raider.GetFirstNameNoTooltip]: [Concept('domain','doména')|E] získá růst [Concept('development','rozvoje')|E] a slevy na výstavbu"
 fp1_trade_events.0041.partner.benefiting_counties.tt: "[Concept('counties','Hrabství')|E] v uvedeném [Concept('duchy','vévodství')|E]"
 fp1_trade_events.0041.a.advanced: "[partner.GetCulture.GetNameNoTooltip] kultura má osobitý styl. Mohli by mi v něm postavit palác?"
 fp1_trade_events.0041.a.fallback: "Vzdělané ruce jsou vždy vítány..."
 fp1_trade_events.0041.a.offer_accepted: "$fp1_trade_events.0011.a.accepted$"
 fp1_trade_events.0041.a.offer_rejected: "$fp1_trade_events.0011.a.rejected$"
 fp1_trade_events.0041.b: "Nechme to neformální."
 fp1_trade_events.0051.t: "$fp1_trade_events.0041.t$"
 fp1_trade_events.0051.desc: "[raider.GetTitledFirstName] se mnou čas od času obchoduje a nyní mi [Select_CString(raider.IsFemale,'poslala','poslal')] zprávu se zajímavou nabídkou. Mé země jsou sice v bezpečí před nájezdníky [raider.GetFirstNameNoTooltip], totéž však neplatí o mnoha jiných darebácích a tulácích. Země [raider.GetFirstNameNoTooltip] jsou zase chudé a málo rozvinuté.\n\nPokud bychom se oba podělili o cestovní náklady svých služebníků, [raider.GetFirstNameNoTooltip] navrhuje jakýsi výměnný program: zkušení válečníci a osadníci z tamních zemí pomohou chránit jednu z mých zranitelných hranic před méně diplomatickými zloději a zkušení zedníci a tesaři z mého panství na oplátku nějaký čas poslouží v doméně [raider.GetFirstNameNoTooltip]."
 fp1_trade_events.0051.offer_accepted: "$fp1_trade_events.0011.a.accepted$"
 fp1_trade_events.0051.offer_rejected: "$fp1_trade_events.0011.a.rejected$"
 fp1_trade_events.0051.a: "[option_1.GetNameNoTierNoTooltip] by mohlo využít pár odborníků..."
 fp1_trade_events.0051.b: "[option_2.GetNameNoTierNoTooltip] by pro ně mohlo být dobrým místem."
 fp1_trade_events.0051.c: "Raději bych [Select_CString(ROOT.Char.IsFemale,'posílila','posílil')] [option_3.GetNameNoTierNoTooltip]."
 fp1_trade_events.0051.d: "To je nehorázný návrh!"
 fp1_trade_events.1131.t: "Severská hrozba"
 fp1_trade_events.1131.desc: "Nesourodá horda pirátů, bezzemků, zoufalých mladších potomků a všemožných dalších ničemů se přidala k [attacker.GetFirstName] a chystá se zaútočit na mé državy.\n\nJejich vojsko je sice úctyhodně početné, ale postrádá disciplínu i věrnost. Každý narychlo sehnaný žoldnéř především přemýšlí, co z války získá pro sebe.\n\nNa rozdíl od běžného nepřítele by možná šlo vyjednávat přímo s útočníky. Snad by se dala uzavřít nějaká dohoda..."
 fp1_trade_events.1131.a: "Nikdy! Zpátky do své zmrzlé pustiny, špíno!"
 fp1_trade_events.1131.b: "Chtějí-li půdu, proč jim ji nedat?"
 fp1_trade_events.1131.c: "Podle mých zkušeností dávají vojáci přednost zlatu před slávou..."
 fp1_trade_events.1131.c.tt: "Zaplatíš přímo vojsku [attacker.GetFirstNameNoTooltip] gafol, aby se rozešlo"
 fp1_trade_events.1131.d: "Vyženeme ty vetřelce jako vždycky."
 fp1_trade_events.1131.d.tt: "Se Seveřany se utkáš postaru"
 fp1_trade_events.1171.t: "$fp1_trade_events.0000.t$: Svatá pomocná ruka"
 fp1_trade_events.1171.desc: "Ačkoli můj vztah s [partner.GetTitledFirstName] začal za #EMP neobvyklých#! okolností, postupem času jen sílil.\n\nA zřejmě ještě víc, než jsem si [Select_CString(ROOT.Char.IsFemale,'dokázala','dokázal')] představit. V posledním dopise totiž [partner.GetFirstNameNoTooltip] vyjadřuje upřímnou starost o osud mé duše.\n\nAby mě [partner.GetFirstNameNoTooltip] [Select_CString(partner.IsFemale,'přesvědčila','přesvědčil')] ke konverzi na [partner.GetFaith.GetName], nabízí mi za choť [Select_CString(prospective_spouse.IsFemale,'svou dceru','svého syna')], velkolepý obřad na uvítanou do nové víry #EMP a#! štědré věno."
 fp1_trade_events.1171.a: "[partner.GetFirstNameNoTooltip] má #EMP opravdu#! přesvědčivé argumenty..."
 fp1_trade_events.1171.b: "To je gesto! Na věčné přátelství!"
 fp1_trade_events.1171.b.tt: "Všechny výše uvedené účinky a navíc..."
 fp1_trade_events.1171.c.cynical: "Pche, čekám lepší úplatek než tohle."
 fp1_trade_events.1171.c.fallback: "Žádný úplatek mě nepřiměje opustit mou víru: [raider.GetFaith.GetNameNoTooltip]."
