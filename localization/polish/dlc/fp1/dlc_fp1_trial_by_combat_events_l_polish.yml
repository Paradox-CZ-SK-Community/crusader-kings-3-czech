l_polish:
 fp1_tbc.0000.t: "Soudní souboj"
 fp1_tbc.0001.t: "$fp1_tbc.0000.t$: [duel_location.GetBaseNameNoTierNoTooltip]"
 fp1_tbc.0001.desc.intro: "Na určené místo poblíž [duel_location.GetBaseNameNoTier] dorazím s dostatečným předstihem a zjišťuji, že [champion.GetTitledFirstName] už na mě čeká spolu s malou skupinou svědků."
 fp1_tbc.0001.desc.recipient_fighting: "\n\nAť už je [champion.GetFirstNameNoTooltip] [Select_CString(champion.IsFemale,'jakákoli','jakýkoli')], na boj je [Select_CString(champion.IsFemale,'připravená','připravený')] a ochotně se mi postaví tváří v tvář."
 fp1_tbc.0001.desc.recipient_has_champion: "[recipient.GetTitledFirstName] není [Select_CString(recipient.IsFemale,'schopná','schopen')] bojovat osobně, a tak [champion.GetFirstNameNoTooltip] [Select_CString(champion.IsFemale,'souhlasila','souhlasil')], že [Select_CString(recipient.IsFemale,'ji','ho')] v souboji zastoupí."
 fp1_tbc.0001.desc.outro: "\n\nFormality netrvají dlouho. Všichni víme, proč jsme tady, a čas na řeči už dávno minul. Dostáváme zbraně a naše družiny ustupují do bezpečné vzdálenosti, odkud budou přihlížet."
 fp1_tbc.0001.trigger_failure.actor: "Můj [Concept('trial_by_combat_trial','soud')|E] proti [recipient.GetFirstNameNoTooltip] už není platný"
 fp1_tbc.0001.trigger_failure.recipient: "Můj [Concept('trial_by_combat_trial','soud')|E] proti [actor.GetFirstNameNoTooltip] už není platný"
 fp1_tbc.0001.a: "Ať zvítězí ten lepší."
 fp1_tbc.0001.a.tt: "[Concept('trial_by_combat','Soudní souboj')|E] začíná!"
 fp1_tbc.0021.trigger_failure.actor: "$fp1_tbc.0001.trigger_failure.actor$"
 fp1_tbc.0021.trigger_failure.recipient: "$fp1_tbc.0001.trigger_failure.recipient$"
 fp1_tbc.0031.opening: "[recipient.Custom2('AppropriateGreeting',actor)]"
 fp1_tbc.0031.desc: "Bojovat s #EMP tebou#!? Možná by ses [Select_CString(actor.IsFemale,'měla','měl')] raději dát na dráhu šaška. Ani za nic na světě - co když mě pak čeká [recipient.GetFaith.NegativeAfterLife]?\n\nKlidně posílej další písemné žerty do [recipient.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 fp1_tbc.0031.a: "Ten [recipient.Custom2('InsultAdjective', SCOPE.sC('actor'))] [recipient.Custom2('InsultNoun', SCOPE.sC('actor'))]!"
 fp1_tbc.0041.t: "$fp1_tbc.0000.t$: Vítězství!"
 fp1_tbc.0041.desc.intro: "Po návratu do [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] si konečně mohu odpočinout a vychutnat vítězství. Můj [actor.Custom('signature_weapon')] mi spočívá na klíně.\n\n"
 fp1_tbc.0041.desc.opponent_died: "Krev [champion.GetTitledFirstName] stále ulpívá v čerstvých rýhách a zásecích na [actor.Custom('SignatureWeaponEndType')] mé zbraně a připomíná mi poslední okamžiky [recipient.GetFirstNameNoTooltip]."
 fp1_tbc.0041.desc.opponent_lives.recipient_fighting: "Příjemná bolest, která mi pulzuje tělem, mi připomíná jednotlivé okamžiky souboje - drobná vítězství i tvrdě vybojované porážky, které nakonec vedly k prohře [recipient.GetTitledFirstName]."
 fp1_tbc.0041.desc.opponent_lives.recipient_has_champion: "V ideálním světě bych vítěznou ránu [Select_CString(actor.IsFemale,'zasadila','zasadil')] přímo [Select_CString(recipient.IsFemale,'jí','jemu')]. Bohužel to nevyšlo, a tak mi musí stačit, že jsem [champion.GetTitledFirstName] [Select_CString(actor.IsFemale,'zmlátila','zmlátil')] na kaši."
 fp1_tbc.0041.desc.reward.gold: "\n\nO mou holeň se opírá pytel stříbra a jeho příjemná tíha je důkazem, že spravedlnosti bylo učiněno zadost. Než jsme odjeli domů, [Select_CString(actor.IsFemale,'nechala','nechal')] jsem každou minci jednu po druhé spočítat před zraky #EMP všech#!."
 fp1_tbc.0041.desc.reward.weak_hook: "\n\nTrvalo přes hodinu, než byla před shromážděnými svědky odříkána poslední přísaha. Jednoho dne se těchto přísah dovolám a vyberu si svou odměnu do posledního haléře."
 fp1_tbc.0041.desc.reward.humiliation: "\n\nDlouhá a úmorná omluva, ponížení, a to všechno před hloučkem najatých básníků... prostě #EMP nádhera#!. Může trvat celé roky, než se [recipient.GetFirstNameNoTooltip] z tohoto pokoření vzpamatuje."
 fp1_tbc.0041.desc.outro: "\n\nVčera jsme náš spor svěřili vyšší moci: [actor.GetFaith.PantheonTerm]. Rozhodnutí bylo moudré."
 fp1_tbc.0041.a: "Spravedlnosti bylo učiněno zadost."
 fp1_tbc.0051.t: "$fp1_tbc.0000.t$: Porážka!"
 fp1_tbc.0051.desc.intro: "Jak tohle mohlo dopadnout takhle? [Select_CString(actor.IsFemale,'Obrátila','Obrátil')] jsem se k vyšší moci - [actor.GetFaith.PantheonTerm] - a [Select_CString(actor.IsFemale,'žádala','žádal')] #EMP spravedlnost#!, a odměnou mi je utrpení a ponížení. Celou cestu zpět do [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] jsem [Select_CString(actor.IsFemale,'nepromluvila','nepromluvil')] ani slovo.\n\n"
 fp1_tbc.0051.desc.opponent_lives.recipient_fighting: "Nechápu, jak mě [recipient.GetTitledFirstName] [Select_CString(recipient.IsFemale,'mohla','mohl')] porazit. #EMP Právo#! bylo na mé straně. [Select_CString(actor.IsFemale,'Měla','Měl')] jsem #EMP vyhrát#!, vždyť právě o tom $game_concept_trial_by_combat$ je."
 fp1_tbc.0051.desc.opponent_lives.recipient_has_champion: "Ve spravedlivém boji bych [recipient.GetFirstNameNoTooltip] #EMP samozřejmě#! [Select_CString(actor.IsFemale,'porazila','porazil')]! K čertu s [champion.GetTitledFirstName] i s těmito svazujícími tradicemi!"
 fp1_tbc.0051.desc.outro: "\n\nTeď celý svět považuje náš spor za vyřešený a spravedlnost za vykonanou."
 fp1_tbc.0051.a: "Pche, žádná spravedlnost se nekonala."
 fp1_tbc.0101.t: "$fp1_tbc.0000.t$: Výběr šampiona"
 fp1_tbc.0101.desc: "[Select_CString(recipient.IsFemale,'Souhlasila jsem','Souhlasil jsem')] s žádostí [actor.GetTitledFirstName] o $game_concept_trial_by_combat$, ale nebylo by vhodné, abych se s [actor.GetFirstNameNoTooltip] [Select_CString(recipient.IsFemale,'utkala','utkal')] osobně.\n\nTradice velí vybrat šampiona, který bude bojovat za mě. Ale koho?"
 fp1_tbc.0101.bout_moves_forward: "Souboj pokračuje..."
 fp1_tbc.0101.a: "[knight_best.GetTitledFirstNameNoTooltip] patří k nejlepším z mých $knight_culture_player_plural_no_tooltip_lowercase$!"
 fp1_tbc.0101.a.tt: "[knight_best.GetTitledFirstName] bude bojovat za tebe"
 fp1_tbc.0101.b: "[knight_alternative.GetTitledFirstNameNoTooltip] je také dobrá volba..."
 fp1_tbc.0101.b.tt: "[knight_alternative.GetTitledFirstName] bude bojovat za tebe"
 fp1_tbc.0101.c: "Říká se, že [knight_exotic.GetTitledFirstNameNoTooltip] se v boji opravdu vyzná?"
 fp1_tbc.0101.c.tt: "[knight_exotic.GetTitledFirstName] bude bojovat za tebe"
 fp1_tbc.0101.d: "Oddanost [knight_opinion.GetTitledFirstNameNoTooltip] mě ochrání."
 fp1_tbc.0101.d.tt: "[knight_opinion.GetTitledFirstName] bude bojovat za tebe"
 fp1_ep1_tbc.0101.e: "Zastoupí mě můj již určený $champion_court_position$, [knight_alternative.GetTitledFirstNameNoTooltip]."
 fp1_ep1_tbc.0101.e.tt: "[knight_alternative.GetTitledFirstName] bude bojovat za tebe"
 fp1_tbc.0111.t: "$fp1_tbc.0000.t$: Vítězství!"
 fp1_tbc.0111.desc.intro: "Včera mi byla přízeň jasně nakloněna: [recipient.GetFaith.PantheonTerm|U]!"
 fp1_tbc.0111.desc.opponent_died.recipient_fighting: "\n\nKdyž zavřu oči, stále cítím adrenalin proudící tělem a svaly mi cukají ozvěnou boje, jako by zamrzly přesně v okamžiku, kdy skončil život [actor.GetTitledFirstName] a mé vítězství bylo jisté."
 fp1_tbc.0111.desc.opponent_lives.recipient_fighting: "\n\nNejenže jsem [Select_CString(recipient.IsFemale,'mohla','mohl')] [actor.GetFirstName] za tu drzost zmlátit do krve, ale zároveň jsem nade vši pochybnost [Select_CString(recipient.IsFemale,'dokázala','dokázal')], že všechna ta pomlouvačná obvinění byla naprosto bezdůvodná."
 fp1_tbc.0111.desc.opponent_lives.recipient_has_champion: "\n\nSledovat, jak [champion.GetFirstName] mlátí [actor.GetFirstName] hlava nehlava, bylo o to sladší, že vítězství [champion.GetFirstNameNoTooltip] mě zbavilo veškeré viny."
 fp1_tbc.0111.desc.outro: "\n\nSnad si příští hlupák rozmyslí, než vyzve [recipient.GetTitledFirstNameNicknamedNoTooltip] na souboj!"
 fp1_tbc.0111.a: "$fp1_tbc.0041.a$"
 fp1_tbc.0121.t: "$fp1_tbc.0000.t$: Porážka!"
 fp1_tbc.0121.desc.intro: "Včera jsem se přízně [Select_CString(recipient.IsFemale,'nedočkala','nedočkal')]: [recipient.GetFaith.PantheonTerm|U]."
 fp1_tbc.0121.desc.champion_lives.recipient_fighting: "Bolesti a řezné rány po celém těle jsou toho důkazem, každá z nich je darem od [actor.GetFirstNameNoTooltip] a zbraně [actor.Custom('signature_weapon')]. Mám štěstí, že jsem vůbec [Select_CString(recipient.IsFemale,'přežila','přežil')]."
 fp1_tbc.0121.desc.champion_lives.recipient_has_champion: "Když jsem [Select_CString(recipient.IsFemale,'vybrala','vybral')] [champion.GetTitledFirstName], [Select_CString(recipient.IsFemale,'byla jsem si jistá','byl jsem si jistý')], že [champion.GetFirstNameNoTooltip] [actor.GetTitledFirstName] rozdrtí. Nakonec může být [champion.GetFirstNameNoTooltip] [Select_CString(champion.IsFemale,'ráda','rád')], že vůbec [Select_CString(champion.IsFemale,'přežila','přežil')]."
 fp1_tbc.0121.desc.reward.gold: "\n\nKdyž si [actor.GetFirstNameNoTooltip] [Select_CString(actor.IsFemale,'převzala','převzal')] stříbro, [Select_CString(actor.IsFemale,'trvala','trval')] na tom, že se zastaví a spočítá ho minci po minci. [Select_CString(actor.IsFemale,'Donutila','Donutil')] nás přihlížet a očividně si [Select_CString(actor.IsFemale,'vychutnávala','vychutnával')] rozpaky mé družiny."
 fp1_tbc.0121.desc.reward.weak_hook: "\n\nZdálo se, že uběhla celá hodina, než byly před shromážděnými svědky složeny a stvrzeny poslední přísahy dluhu. Jednoho dne se [actor.GetFirstNameNoTooltip] vrátí, aby dluh [Select_CString(actor.IsFemale,'vybrala','vybral')]."
 fp1_tbc.0121.desc.reward.humiliation: "\n\nČíst rozvláčnou „omluvu“ od [actor.GetFirstNameNoTooltip] trvalo věčnost. Celou dobu jsem [Select_CString(recipient.IsFemale,'skřípala','skřípal')] zuby a slova ze sebe sotva [Select_CString(recipient.IsFemale,'dostávala','dostával')]. Najatí básníci [actor.GetFirstNameNoTooltip] se v pozadí jen pochechtávali a vrývali si každý můj výraz do paměti."
 fp1_tbc.0121.desc.outro: "\n\nVítězství připadlo hlupákovi a žebrákovi."
 fp1_tbc.0121.a: "$fp1_tbc.0051.a$"
