l_polish:
 fp1_berserk_roar_evtopt: "#BER RAAAAARGH!#!"
 fp1_yearly.0001.t: "Uprchlý otrok"
 fp1_yearly.0001.desc: "Otroci jsou běžnou součástí života v [ROOT.Char.GetCulture.GetNameNoTooltip] kultuře. Podřadní lidé, ať už zajatí v cizině, nebo narození do otroctví, obdělávají naše pole a pečují o naše krby.\n\nAlespoň teoreticky.\n\nVčera v noci [Select_CString(dummy_gender.IsFemale,'se jedna taková otrokyně rozhodla, že už toho má dost, a uprchla s náručí cenných šperků','se jeden takový otrok rozhodl, že už toho má dost, a uprchl s náručí cenných šperků')]! A co hůř, [scapegoat.Custom2('MyCharacterIntroduction',ROOT.Char)] #EMP [Select_CString(scapegoat.IsFemale,'viděla','viděl')]#!, jak se ztrácí ve tmě, ale nikomu o tom [Select_CString(scapegoat.IsFemale,'neřekla','neřekl')] až do rána."
 fp1_yearly.0001.gold_stays_lost.tt: "Své stříbro už neuvidíš"
 fp1_yearly.0001.a: "Pošlete popis do každé vesnice!"
 fp1_yearly.0001.a.tt_success: "[Select_CString(dummy_gender.IsFemale,'Otrokyně je vypátrána a zajata','Otrok je vypátrán a zajat')]"
 fp1_yearly.0001.a.tt_failure: "[Select_CString(dummy_gender.IsFemale,'Otrokyně unikne i s tvým stříbrem','Otrok unikne i s tvým stříbrem')]"
 fp1_yearly.0001.b: "Podejte mi plášť. Vydám se po stopě osobně."
 fp1_yearly.0001.b.tt_success: "[Select_CString(dummy_gender.IsFemale,'Dostihneš otrokyni dřív, než se dostane daleko','Dostihneš otroka dřív, než se dostane daleko')]"
 fp1_yearly.0001.b.tt_failure: "$fp1_yearly.0001.a.tt_failure$"
 fp1_yearly.0001.c: "[scapegoat.GetFirstNameNoTooltip], tohle je tvoje vina, takže zaplatíš!"
 fp1_yearly.0001.d: "Odpouštím ti, [scapegoat.GetFirstNameNoTooltip]. Takové věci se stávají."
 fp1_yearly.0011.t: "Požadavek prohlásit [offensive_courtier.GetFirstNameNoTooltip] nithingem"
 fp1_yearly.0011.desc: "Celý den se mým sálem táhne zástup významných obyvatel [capital_barony.GetNameNoTier], každý s vlastní stížností na tutéž osobu. Tou osobou je [ROOT.Char.Custom2('RelationToMeShort',SCOPE.sC('offensive_courtier'))], [offensive_courtier.GetTitledFirstName].\n\nNěkteří si stěžují na chování, jiní zpochybňují čest, ale všichni se shodují na jediném: [offensive_courtier.GetTitledFirstName] je ostudou dvora.\n\nNeumytý dav nežádá nic menšího než prohlásit [offensive_courtier.GetTitledFirstName] nithingem a vyhnat ode dvora."
 fp1_yearly.0011.desc.priest: "[priest.Custom2('MyCharacterIntroduction',ROOT.Char)|U] trvá na tom, že chování [offensive_courtier.GetTitledFirstName] je #EMP ve skutečnosti#! docela zbožné, ale rozzuření měšťané tvrdí, že [priest.GetFirstNameNoTooltip] zkrátka nemusí snášet následky takové „ctnosti“."
 fp1_yearly.0011.a: "Mají pravdu. [offensive_courtier.GetTitledFirstName] [Select_CString(offensive_courtier.IsFemale,'musí být vyděděna a vyhnána','musí být vyděděn a vyhnán')]!"
 fp1_yearly.0011.b: "Mají pravdu. [offensive_courtier.GetTitledFirstName] [Select_CString(offensive_courtier.IsFemale,'musí být vyhnána','musí být vyhnán')]!"
 fp1_yearly.0011.c: "Sedláci! [offensive_courtier.GetFirstNameNoTooltip] je bez viny."
 fp1_yearly.0011.d: "Tohle může [ROOT.Char.GetTitleAsNameNoTooltip] nechat být..."
 fp1_yearly.0021.t: "Otázka života a smrti"
 fp1_yearly.0021.desc.intro: "Nedávná hádka mezi mými $knight_culture_player_plural_no_tooltip_lowercase$, [first_knight.GetTitledFirstName] a [second_knight.GetTitledFirstName], se pořádně vyhrotila. Podle všeho"
 fp1_yearly.0021.desc.doggo: "[first_knight.GetFirstNameNoTooltip] při společném lovu na [ROOT.Char.Custom('GetAnimalType')] nešťastnou náhodou [Select_CString(first_knight.IsFemale,'probodla','probodl')] [second_knight.GetFirstNamePossessiveNoTooltip] psa a [second_knight.GetFirstNameNoTooltip] se odmítá spokojit s tím, že [first_knight.GetFirstNameNoTooltip] prostě zaplatí za nového."
 fp1_yearly.0021.desc.spit_of_land: "[first_knight.GetFirstNameNoTooltip] [Select_CString(first_knight.IsFemale,'koupila','koupil')] odlehlý kus půdy, na který si činí nárok [second_knight.GetFirstNameNoTooltip]. Pozemek by byl úplně bezcenný, nebýt toho, že na něm údajně roste nejlepší zelí v celém [capital_barony.GetNameNoTierNoTooltip]."
 fp1_yearly.0021.desc.unrepeatable_insult: "hádka se strhla kvůli naprosté maličkosti a brzy začaly létat urážky. [first_knight.GetFirstNameNoTooltip] pak [Select_CString(first_knight.IsFemale,'řekla','řekl')] něco nevyslovitelného, co spojovalo [second_knight.GetFirstNameNoTooltip], kozu a pořádný roh na pití."
 fp1_yearly.0021.desc.escalating_prank_war: "začalo to nevinnou soutěží, kdo koho trumfne stále divočejším žertem, až se z legrace postupně stal čirý vztek."
 fp1_yearly.0021.desc.religious_differences: "jde o prosté náboženské rozdíly: [first_knight.GetFirstNameNoTooltip] vyznává [first_knight.GetFaith.GetName], zatímco [second_knight.GetFirstNameNoTooltip] [second_knight.GetFaith.GetName], a kvůli samotné povaze víry si jdou po krku."
 fp1_yearly.0021.desc.stolen_pig: "hlavním předmětem sporu je obrovské výstavní prase. [second_knight.GetFirstNameNoTooltip] tvrdí, že ho [first_knight.GetFirstNameNoTooltip] [Select_CString(first_knight.IsFemale,'ukradla','ukradl')]. [first_knight.GetFirstNameNoTooltip] tvrdí přesný opak. Upřímně, přes všechen ten řev není vůbec jasné, jak to bylo."
 fp1_yearly.0021.desc.defiled_longboat.woman: "[unfortunate_knight.GetFirstNamePossessiveNoTooltip] dlouhý člun skýtal nečekaný výjev: [defiling_knight.GetFirstNameNoTooltip] [Select_CString(defiling_knight.IsFemale,'si #EMP užívala#!','si #EMP užíval#!')] s figurou na přídi. Nátěr i její někdejší hrozivá aura tím vzaly za své."
 fp1_yearly.0021.desc.defiled_longboat: "[defiling_knight.GetFirstNameNoTooltip] [Select_CString(defiling_knight.IsFemale,'provedla','provedl')] cosi #EMP nevýslovného#! na každém sedadle [unfortunate_knight.GetFirstNamePossessiveNoTooltip] dlouhého člunu, až celé plavidlo #EMP páchlo#!."
 fp1_yearly.0021.desc.board_game: "partie hnefataflu skončila hádkou o přesné znění pravidel. Během několika minut letěla deska stranou a vzduchem už létaly pěsti."
 fp1_yearly.0021.desc.outro: "\n\nTeď už z obou stran zazněla otevřená výzva k holmgang. Souboj bude jistě dramatický, ale služba v mé družině je zavazuje požádat mě o svolení, než se do sebe pustí."
 fp1_yearly.0021.a: "Ať se tedy bijí, když chtějí."
 fp1_yearly.0021.a.tt_success: "[first_knight.GetFirstNameNoTooltip] vyhrává holmgang"
 fp1_yearly.0021.a.tt_failure: "[second_knight.GetFirstNameNoTooltip] vyhrává holmgang"
 fp1_yearly.0021.b: "Dětinské! Zakazuji to!"
 fp1_yearly.0021.b.tt_success: "Tvůj rozkaz vzbudí zděšenou poslušnost"
 fp1_yearly.0021.b.tt_failure: "Neochotně souhlasí, ale vysmívají se ti"
 fp1_yearly.0021.c: "Jistě, a dokonce si vsadím na [first_knight.GetFirstNameNoTooltip]."
 fp1_yearly.0021.c.tt_success: "$fp1_yearly.0021.a.tt_success$"
 fp1_yearly.0021.c.tt_failure: "$fp1_yearly.0021.a.tt_failure$"
 fp1_yearly.0021.d: "Klidně, ale já si vsadím na [second_knight.GetFirstNameNoTooltip]."
 fp1_yearly.0021.d.tt_failure: "$fp1_yearly.0021.a.tt_success$"
 fp1_yearly.0021.d.tt_success: "$fp1_yearly.0021.a.tt_failure$"
 fp1_yearly.0031.t: "Báchorky u stolu"
 fp1_yearly.0031.desc.intro: "Ve společnosti [lying_warrior.GetFirstName] se tenhle večer táhne a táhne. [lying_warrior.GetFirstNameNoTooltip] se na noc zastavil v [capital_barony.GetBaseNameNoTierNoTooltip] a za nocleh platí vyprávěním o svých skutcích, které už trvá #EMP celé hodiny#!.\n\n"
 fp1_yearly.0031.desc.sunk_longboat: "„... takže jsem uprostřed Severního moře a dlouhý člun se potápí pod tíhou veškeré té zatracené kořisti. No, s sebou jsem ji vzít nemohl, tak jsem [Select_CString(lying_warrior.IsFemale,'skočila do vody a doplavala','skočil do vody a doplaval')] až do Norska!“"
 fp1_yearly.0031.desc.wrestled_whale: "„... bylo mi jasné, že buď opustím posádku, nebo se s tou velrybou utkám sám. [Select_CString(lying_warrior.IsFemale,'Popadla jsem nůž, vrhla se','Popadl jsem nůž, vrhl se')] do moře a vlastníma rukama dovlekla tu bestii až na břeh!“"
 fp1_yearly.0031.desc.charged_city_fruit_knife: "„... uvnitř deset tisíc nepřátel, všichni se šavlemi, a já jen s malým nožíkem na ovoce. A #EMP [Select_CString(lying_warrior.IsFemale,'dokázala jsem to','dokázal jsem to')]#!, díky svému věrnému nožíku!“"
 fp1_yearly.0031.desc.charged_city: "„... [Select_CString(lying_warrior.IsFemale,'vrhla jsem se','vrhl jsem se')] přímo k městským hradbám, vyšplhala se po nich bez lana a prosekal se až do královského paláce. Královu korunu jsem pak nechal roztavit, abych měl na nové boty.“"
 fp1_yearly.0031.desc.kept_iceland_afloat: "„... a kdyby se ti dva obři do toho holmgang #EMP opravdu#! pustili, Island by se určitě zase potopil do moře. Ještě štěstí, že se mi podařilo je uklidnit.“"
 fp1_yearly.0031.desc.wooed_heir: "„... a [invented_heir.Custom('GetDaughterSon')] [disparaged_king.GetTitledFirstNameNoTooltip]? Tak #EMP to#! bylo to nejlepší, co jsem kdy zažil. [disparaged_king.GetTitledFirstNameNoTooltip] mě pak už zrovna v lásce neměl, takže jsem od dvora rychle [Select_CString(lying_warrior.IsFemale,'zmizela','zmizel')], to vám povídám!“"
 fp1_yearly.0031.desc.hunted_troll: "„... no jasně, tahle nejnovější rána je od samotného trolla. Velký jako dům, tichý jako myš a drápy jako parchantští zplozenci samotného ďábla – [lying_warrior.GetFaith.DevilName]. Ale když do něčeho bodáte dost dlouho, nakonec to chcípne.“"
 fp1_yearly.0031.desc.outro: "\n\nPříběh střídá příběh a sága pokračuje, přičemž každá další historka je delší a neuvěřitelnější než ta předchozí."
 fp1_yearly.0031.a: "Ty prostě #EMP musíš#! zůstat u dvora, [lying_warrior.GetFirstNameNoTooltip]!"
 fp1_yearly.0031.b: "To zní... dost přitažené za vlasy."
 fp1_yearly.0031.b.tt_success: "[Select_CString(lying_warrior.IsFemale,'Lži [lying_warrior.GetFirstNameNoTooltip] jsou odhaleny','Lži [lying_warrior.GetFirstNameNoTooltip] jsou odhaleny')]"
 fp1_yearly.0031.b.tt_failure: "[lying_warrior.GetFirstNameNoTooltip] tě v debatě dokonale obehraje"
 fp1_yearly.0031.c: "Na příští zastávce nezapomeň pochválit naši pohostinnost!"
 fp1_yearly.0041.t: "Průzkumníci z jihu"
 fp1_yearly.0041.desc: "[explorer.GetFirstName], [Select_CString(explorer.IsFemale,'průzkumnice, učenka a vyslankyně','průzkumník, učenec a vyslanec')] [sponsoring_liege.GetTitledFirstName] z [sponsoring_liege.GetPrimaryTitle.GetName], v poslední době procestoval mé země. O učenost ani zbožnost u [explorer.GetFirstNameNoTooltip] není nouze; vede si podrobný deník ze svých cest a nepravidelně posílá dopisy domů se zprávami o životě na tomto konci světa.\n\nNyní je [explorer.GetFirstNameNoTooltip] v [capital_barony.GetNameNoTierNoTooltip] a žádá o svolení zůstat několik dní, pozorovat naše místní zvyky a rozmlouvat s nejmoudřejšími z našich starších.\n\nŽádost je sice podána dokonale formálně, ale její tón doslova #EMP odkapává#! povýšeností."
 fp1_yearly.0041.a: "Možná by stálo za to ukázat [explorer.GetFirstNameNoTooltip] některý z našich menších obřadů?"
 fp1_yearly.0041.a.tt_success: "Tvůj obřad udělá na [explorer.GetFirstNameNoTooltip] dojem"
 fp1_yearly.0041.a.tt_failure: "Tvé pohanské zvyky [explorer.GetFirstNameNoTooltip] znechutí"
 fp1_yearly.0041.b: "Pověz mi víc... Co je zač [explorer.GetFaith.HighGodName]?"
 fp1_yearly.0041.c: "Na #EMP mém#! dvoře není místo pro nafoukané cizince."
 fp1_yearly.0051.t: "Neklidný mrtvý"
 fp1_yearly.0051.desc: "Když před časem [draugr.GetTitledFirstName] [Select_CString(draugr.IsFemale,'zemřela','zemřel')], prostému lidu v [capital_county.GetNameNoTier] to rozhodně neušlo. Ať už [Select_CString(draugr.IsFemale,'byla jakákoli','byl jakýkoli')], mezi místními sedláky se [draugr.GetFirstNameNoTooltip] velké oblibě netěšil. Dnes už je běžné svádět každé neštěstí v kraji na [Select_CString(draugr.IsFemale,'její chodící mrtvolu','jeho chodící mrtvolu')].\n\nUž snad ani neuplyne týden, aby si každý sedlák, lesník i kydáč hnoje v dosahu plivnutí od hlavního města nestěžoval na draugra, za kterého považují [draugr.GetFirstNameNoTooltip].\n\n#EMP Něco#! se s tím musí udělat."
 fp1_yearly.0051.a: "Do té mohyly se podívám osobně."
 fp1_yearly.0051.a.tt: "Rozhodneš se vše prozkoumat na vlastní kůži..."
 fp1_yearly.0051.b: "Prostě vykopejte tělo a spalte ho."
 fp1_yearly.0051.b.body_destroyed: "Sedláci jásají"
 fp1_yearly.0051.b.list: "[draugr.GetFirstNameNoTooltip] – rodina a přátelé"
 fp1_yearly.0051.c: "Možná to vyřeší ochranná kouzla?"
 fp1_yearly.0051.c.tt_success: "Tvé lektvary a kouzla sedláky uklidní"
 fp1_yearly.0051.c.tt_failure: "Tvé rituály nestačí"
 fp1_yearly.0061.t: "$fp1_yearly.0051.t$: Vlci"
 fp1_yearly.0061.desc: "S družinou sotva dorazíme k mohyle [draugr.GetFirstNameNoTooltip], když se zevnitř ozve první zavrčení.\n\nTemným vchodem se protáhne největší vlk, jakého jsem kdy viděl, a zbytek smečky jako by se vynořil přímo ze země. Musí jich být nejméně tucet, každý velký jako člověk, a už se na nás ze všech stran ženou plnou rychlostí.\n\nSedláci se v draugrovi mýlili, ale v té kletbě ne!"
 fp1_yearly.0061.a: "Vojáci! Ke mně!"
 fp1_yearly.0061.a.tt_success: "Shromáždíš družinu a vlky pobiješ!"
 fp1_yearly.0061.a.tt_failure: "Jen o vlásek unikneš smrti"
 fp1_yearly.0061.b: "UTÍKEJ!"
 fp1_yearly.0062.t: "$fp1_yearly.0051.t$: Medvěd"
 fp1_yearly.0062.desc: "Mohyla [draugr.GetFirstNameNoTooltip] je chladná a ponurá. Žádnou chodící mrtvolu sice nevidíme, ale některé stěny brázdí dlouhé hluboké škrábance a podlahu pokrývají kosti dobytka.\n\nNáhlé zašustění v koutě upoutá můj pohled. To, co jsem považoval za hromadu listí, se začne zvedat a odhalí největšího medvěda, jakého jsem kdy viděl, dobrých devět či deset loktů vysokého. Ospale na nás zamrká a působí skoro přátelsky.\n\nPak zařve."
 fp1_yearly.0062.a: "Udělám z tebe koberec!"
 fp1_yearly.0062.a.tt_success: "Srazíš netvora k zemi"
 fp1_yearly.0062.a.tt_failure: "Družina tě odtáhne od jisté smrti"
 fp1_yearly.0062.b: "$fp1_yearly.0061.b$"
 fp1_yearly.0063.t: "$fp1_yearly.0051.t$: Nithing"
 fp1_yearly.0063.desc: "V mohyle [draugr.GetFirstNameNoTooltip] není žádná nestvůra, žádná pohřební výbava, dokonce ani mrtvola. Po krátkém prohledání okolí najdeme [draugr.GetFirstNameNoTooltip] o kus dál v příkopu, [Select_CString(draugr.IsFemale,'převrácenou a ledabyle zakrytou','převráceného a ledabyle zakrytého')] listím.\n\nSamotný hrob byl místo toho přeměněn na nuzné obydlí, které si nějaký ničemný psanec přivlastnil přímo z chladných rukou mrtvých.\n\nZatímco s družinou probírám, co dál, z dálky se ozve veselé hvízdání a stále se přibližuje. Ten darebák je na cestě!"
 fp1_yearly.0063.a: "Všichni zticha! Ke stěnám!"
 fp1_yearly.0063.a.tt_success: "Past sklapne"
 fp1_yearly.0063.a.tt_failure: "[draugr_nithing.GetFirstNameNoTooltip] si všimne, že něco nehraje, a uteče"
 fp1_yearly.0063.a.tt_failure.draugr_nithing_escapes: "[draugr_nithing.GetFirstNameNoTooltip] se potuluje divočinou a dál působí potíže"
 fp1_yearly.0063.b: "Taková zatracená ztráta času!"
 fp1_yearly.0064.t: "$fp1_yearly.0051.t$: Sirotek"
 fp1_yearly.0064.desc: "Sedláci sice přísahali, že chodící mrtvola [draugr.GetFirstNameNoTooltip] jim krade jídlo, uhranuje dobytek a v noci škrábe na okna, ale když dorazím k mohyle, najdu tam úplně jiného tvora.\n\nUprostřed hnízda z ukradených kožešin a napůl snědeného jídla sedí osiřelé dítě a s očima dokořán na mě hledí v čiré hrůze."
 fp1_yearly.0064.a: "Běž, dítě. Tady zůstat nemůžeš."
 fp1_yearly.0064.a.tt: "[draugr_orphan.GetFirstNameNoTooltip] se vydá sám do divočiny..."
 fp1_yearly.0064.b: "Dítě nedítě, tenhle zloděj patří do žaláře!"
 fp1_yearly.0064.c: "Pojď ke dvoru, [Select_CString(draugr_orphan.IsFemale,'děvče','chlapče')]. Hrob není místem pro živé."
 fp1_yearly.0064.d: "Přece... přece si každé dítě zaslouží [Select_CString(ROOT.Char.IsFemale,'matku','otce')]?"
 fp1_yearly.0065.t: "$fp1_yearly.0051.t$: Nakonec přece jen klid"
 fp1_yearly.0065.desc: "Mohyla [draugr.GetFirstNameNoTooltip] vypadá téměř stejně jako v den pohřbu. A stejně je tomu u každého dalšího hrobu, který mě sedláci přimějí prohledat.\n\nNic nenajdu ani v žádné údajně prokleté jeskyni, háji obývaném trolly či doupěti obrů. Po několika týdnech začínám pochybovat, nakolik jsme si vlastně jistí, že takové nestvůry vůbec #EMP existují#!.\n\nAlespoň mi ten pohyb prospívá."
 fp1_yearly.0065.a: "Možná to byl jen vítr?"
 fp1_yearly.0065.a.locals_grumble: "Sedláci jsou nespokojení"
 fp1_yearly.0071.t: "V hlubinách světa"
 fp1_yearly.0071.desc.intro: "Sedláci z [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] jsou pověrčivá cháska a pravidelně za mnou chodí s historkami o čarodějích, obrech a bozích v přestrojení.\n\nObvykle podobná tvrzení odbývám jako prostoduché divadélko, tentokrát však přinášejí důkaz:"
 fp1_yearly.0071.desc.troll_type.bear: "mladého selského chlapce s hlavou rozdrcenou na kaši a naříkající rodiče, kteří jeho smrt viděli na vlastní oči."
 fp1_yearly.0071.desc.troll_type.wolf: "mrtvolu proslulého lovce s rozervanou hrudí a vyžraným měkkým masem kolem srdce."
 fp1_yearly.0071.desc.troll_type.wolverine: "změť kostí a cárů masa, o níž tvrdí, že ještě nedávno byla postarší pradlenou."
 fp1_yearly.0071.desc.troll_type.lynx: "tucet zmasakrovaných prasat, každé rozervané až příliš pečlivě na neohrabanou divokou šelmu, ale nepochybně drápy, nikoli nožem."
 fp1_yearly.0071.desc.troll_type.moose: "krví potřísněnou mrtvolu ovce, očividně rozervanou, ale nesežranou ani neožvýkanou, hrubě rozsápanou něčím, co nezanechalo žádné drápy, jaké bych znal."
 fp1_yearly.0071.desc.outro.loveli_lakes: "\n\nSotva si tu spoušť chvíli prohlížím, [loveli_lakes.GetTitledFirstName] vystoupí vpřed.\n\n„Tohle není troll, [ROOT.Char.GetFirstNameNoTooltip], tohle má na svědomí divoký møøse! Tu bestii dobře znám, včetně jejího odporného kousnutí, a rád bych jí vyřezal svou značku do mršiny.“"
 fp1_yearly.0071.desc.outro.fallback: "\n\nMístní trvají na tom, že to nemůže být nic jiného než dílo trolla, a požadují, abych pročesal okolní lesy a tu stvůru zabil."
 fp1_yearly.0071.a: "Tu bestii zabiju osobně!"
 fp1_yearly.0071.a.tt: "Vyrážíš se skupinou válečníků"
 fp1_yearly.0071.b: "[marshal.GetTitledFirstNameNoTooltip], postarej se o to."
 fp1_yearly.0071.b.tt_success: "[Select_CString(marshal.IsFemale,'Tvá maršálka se svými vojáky nestvůru vypátrá','Tvůj maršál se svými vojáky nestvůru vypátrá')]"
 fp1_yearly.0071.b.tt_failure: "Bestie [marshal.GetFirstNameNoTooltip] unikne"
 fp1_yearly.0071.c: "To zní jako medvěd. Vyřiďte si ho sami, zbabělci."
 fp1_yearly.0081.hunt_invalidated: "Hon na trolla z [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] končí"
 fp1_yearly.0081.hunt_invalidated.tt: "Nepředvídané okolnosti si vyžádají tvou pozornost"
 fp1_yearly.0081.desc.prelude: "Les tiše ševelí, zatímco se prodíráme vpřed a stíny svírají mou malou družinu v těsném objetí. Rád bych věřil, že je to jen vítr, ale říká se, že osamělí trollové zpívají právě jako on...\n\nNedaleko této mýtiny zmizelo několik lidí, takže by to mohlo být doupě té bestie. Alespoň to tvrdí místní.\n\n"
 fp1_yearly.0081.desc.finisher: "Není to troll, ale naše kořist přesto!"
 fp1_yearly.0081.t: "$fp1_yearly.0071.t$: Smrt jako hora"
 fp1_yearly.0081.desc: "$fp1_yearly.0081.desc.prelude$Hájem otřese ohlušující zavrčení a cosi, co jsem považoval za balvan, se zvedne a odhalí medvěda skutečně #EMP obludných#! rozměrů.\n\n$fp1_yearly.0081.desc.finisher$"
 fp1_yearly.0081.a: "Smrt si tě vezmi, nestvůro!"
 fp1_yearly.0081.a.tt_success: "Medvěda zabiješ"
 fp1_yearly.0081.a.tt_failure: "Medvěd tě roztrhne vedví"
 fp1_yearly.0081.b: "#BER RAAAAARGH!#!"
 fp1_yearly.0081.b.tt: "V berserkerském běsnění roztrhneš bestii vedví"
 fp1_yearly.0081.c: "Vzhůru, #EMP vzhůru#! a na ně, Vlci z [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]!"
 fp1_yearly.0081.c.tt_success: "Strhneš své vojáky k útoku a ti medvěda zabijí"
 fp1_yearly.0081.c.tt_failure: "Bestie tě zraní a unikne"
 fp1_yearly.0081.c.tt_failure.tt: "Utrpíš #warning TRVALÉ#! těžké zranění"
 fp1_yearly.0081.d: "#EMP UTÍKEEEEEJ!#!"
 fp1_yearly.0082.t: "$fp1_yearly.0071.t$: Rychlá smrt"
 fp1_yearly.0082.desc: "$fp1_yearly.0081.desc.prelude$Za námi se ozve krev tuhnoucí zavrčení, dusot tlap a vzápětí někdo na konci družiny vykřikne. Otočím se právě včas, abych uskočil obrovskému vlkovi, jehož srst je stářím protkaná stříbrem a krví potřísněná rudě, když se kolem mě mihne. $fp1_yearly.0081.desc.finisher$"
 fp1_yearly.0082.a: "$fp1_yearly.0081.a$"
 fp1_yearly.0082.a.tt_success: "Vlka zabiješ"
 fp1_yearly.0082.a.tt_failure: "Vlk ti vyrve hrdlo"
 fp1_yearly.0082.b: "$fp1_yearly.0081.b$"
 fp1_yearly.0082.b.tt: "$fp1_yearly.0081.b.tt$"
 fp1_yearly.0082.c: "Semknout! Utvořte kruh!"
 fp1_yearly.0082.c.tt_success: "Vlka obklíčíš, zaženeš do úzkých a zabiješ"
 fp1_yearly.0082.c.tt_failure: "$fp1_yearly.0081.c.tt_failure$"
 fp1_yearly.0082.c.tt_failure.tt: "$fp1_yearly.0081.c.tt_failure.tt$"
 fp1_yearly.0082.d: "$fp1_yearly.0081.d$"
 fp1_yearly.0083.t: "$fp1_yearly.0071.t$: Vzteklá smrt"
 fp1_yearly.0083.desc: "$fp1_yearly.0081.desc.prelude$Bestii spatříme poprvé ve chvíli, kdy vojákovi po mé levici trhá hrdlo: svižná koule srsti a zubů sotva větší než pes, ale rychlejší než seknutí mečem. Běsnící rosomák! $fp1_yearly.0081.desc.finisher$"
 fp1_yearly.0083.a: "$fp1_yearly.0081.a$"
 fp1_yearly.0083.a.tt_success: "Rosomáka zabiješ"
 fp1_yearly.0083.a.tt_failure: "Rosomák ti rozpáře břicho"
 fp1_yearly.0083.b: "$fp1_yearly.0081.b$"
 fp1_yearly.0083.b.tt: "$fp1_yearly.0081.b.tt$"
 fp1_yearly.0083.c: "Nedaleko je lovecký zámeček, stáhneme se tam pro pomoc!"
 fp1_yearly.0083.c.tt_success: "Vylákáš ho k zámečku a přesilou ho zdoláte"
 fp1_yearly.0083.c.tt_failure: "$fp1_yearly.0081.c.tt_failure$"
 fp1_yearly.0083.c.tt_failure.tt: "$fp1_yearly.0081.c.tt_failure.tt$"
 fp1_yearly.0083.d: "$fp1_yearly.0081.d$"
 fp1_yearly.0084.t: "$fp1_yearly.0071.t$: Tichá smrt"
 fp1_yearly.0084.desc: "$fp1_yearly.0081.desc.prelude$Ztuhnu. Nějakým zázrakem si nás ještě nevšiml, ale na druhé straně mýtiny #EMP sotva#! rozeznávám přikrčeného rysa. Jediný další neopatrný krok mohl být můj poslední. $fp1_yearly.0081.desc.finisher$"
 fp1_yearly.0084.a: "$fp1_yearly.0081.a$"
 fp1_yearly.0084.a.tt_success: "Rysa zabiješ"
 fp1_yearly.0084.a.tt_failure: "Rys ti zlomí vaz"
 fp1_yearly.0084.b: "$fp1_yearly.0081.b$"
 fp1_yearly.0084.b.tt: "$fp1_yearly.0081.b.tt$"
 fp1_yearly.0084.c: "Tiše! Vy dva ho obejděte, my ho naženeme k vám..."
 fp1_yearly.0084.c.tt_success: "Rysa přelstíš a ulovíš"
 fp1_yearly.0084.c.tt_failure: "$fp1_yearly.0081.c.tt_failure$"
 fp1_yearly.0084.c.tt_failure.tt: "$fp1_yearly.0081.c.tt_failure.tt$"
 fp1_yearly.0084.d: "$fp1_yearly.0081.d$"
 fp1_yearly.0085.t: "$fp1_yearly.0071.t$: Běsnící smrt"
 fp1_yearly.0085.desc.loveli_lakes: "S [loveli_lakes.GetTitledFirstName] v čele nám cesta k lesnímu doupěti vzteklé bestie netrvá dlouho.\n\nKéž bychom měli to štěstí a zastihli ji ve spánku. Nemáme. Jakmile vstoupíme na mýtinu, obrovská zdivočelá obluda se vztyčí, snad dvakrát vyšší než [ROOT.Char.GetWomanMan] běžného vzrůstu.\n\nDýchá přerývaně, oči se jí šíleně koulí a rozštěpená kopyta buší do země.\n\nPak vyrazí proti nám."
 fp1_yearly.0085.desc.fallback: "$fp1_yearly.0081.desc.prelude$Ticho roztrhne ohlušující #EMP rána#!, když na scénu vtrhne obrovský vzteklý los, snad dvakrát vyšší než [ROOT.Char.GetWomanMan] běžného vzrůstu, s nozdrami plnými pěny a zuřivosti. $fp1_yearly.0081.desc.finisher$"
 fp1_yearly.0085.a: "$fp1_yearly.0081.a$"
 fp1_yearly.0085.a.tt_success: "Losa skolíš mečem"
 fp1_yearly.0085.a.tt_failure: "Los ti rozdrtí kosti na kaši"
 fp1_yearly.0085.b: "$fp1_yearly.0081.b$"
 fp1_yearly.0085.b.tt: "$fp1_yearly.0081.b.tt$"
 fp1_yearly.0085.c: "Slabé místo u kořene krku! Jen kopí a luky!"
 fp1_yearly.0085.c.tt_success: "Losa skolíte, aniž by vás ušlapal"
 fp1_yearly.0085.c.tt_failure: "$fp1_yearly.0081.c.tt_failure$"
 fp1_yearly.0085.c.tt_failure.tt: "$fp1_yearly.0081.c.tt_failure.tt$"
 fp1_yearly.0085.d: "$fp1_yearly.0081.d$"
 fp1_yearly.0091.t: "Plavidlo hodné titulu „[ROOT.Char.GetTitleAsNameNoTooltip]“"
 fp1_yearly.0091.desc: "[ROOT.Char.GetTitleAsNamePossessiveNoTooltip] dlouhá loď o svém majiteli prozradí mnohé. Ukazuje jeho bohatství, úspěchy i to, jakým dojmem chce působit na zbytek světa.\n\nPohlédnu na svou současnou loď a usoudím, že jí něco... schází. Jako by chtělo mé myšlence dodat důraz, s prásknutím povolí kus lanoví a celé plavidlo zlověstně zapraská, když se zatížení přenese jinam.\n\nObjednat novou loď je snadné, ale stačí mi pouhá náhrada? Nezasloužím si snad plavidlo, které celému světu řekne něco o #EMP mně#!?"
 fp1_yearly.0091.a: "Mořský leviatan, který unese všechnu mou kořist!"
 fp1_yearly.0091.b: "Langskip nestvůr, který vyděsí mé vazaly!"
 fp1_yearly.0091.c: "Dračí langskip, který bude řvát mé jméno!"
 fp1_yearly.0091.d: "Drahé plavidlo nepotřebuji."
 fp1_yearly.0101.t: "Hra hádanek"
 fp1_yearly.0101.desc: "V [ROOT.Char.GetCulture.GetNameNoTooltip] kultuře patří hádanky k oblíbeným kratochvílím. Dva či více hráčů si navzájem předkládají stále těžší hádanky, často ve verších a prodchnuté alegoriemi či mýty.\n\nJednoho obzvlášť dlouhého a líného dne mě [riddler.Custom2('MyCharacterIntroduction',ROOT.Char)] vyzve ke hře, zatímco přihlíží snad polovina dvora."
 fp1_yearly.0101.a: "Chceš zkoušet #EMP mou#! výřečnost? To bude zábava!"
 fp1_yearly.0101.a.tt_success: "Hru vyhraješ"
 fp1_yearly.0101.a.tt_failure: "[riddler.GetFirstNameNoTooltip] tě porazí"
 fp1_yearly.0101.a.every_courtier_and_guest: "Každý [Concept('courtier','dvořan')|E] a [Concept('guest','host')|E]"
 fp1_yearly.0101.b: "Myslím, že jsem o hádankách pár knih četl..."
 fp1_yearly.0101.c: "Začneme: kdo nemá mozek a půjde do žaláře?"
 fp1_yearly.0101.c.tt: "Lidé si možná zapamatují, jak přehnaně jsi zareagoval..."
 fp1_yearly.0101.c.tt_nickname: "Tví dvořané si za tvými zády šeptají..."
 fp1_yearly.0101.d: "Díky, ale jsem [ROOT.Char.GetTitleAsNameNoTooltip] a mám práci."
 fp1_yearly.0111.t: "Prokletí"
 fp1_yearly.0111.desc.intro: "[accursed.GetTitledFirstName] mlčky přihlíží, zatímco obcházím totem z koňské kůže vztyčený naproti [Select_CString(accursed.IsFemale,'jejím komnatám','jeho komnatám')] a prohlížím si ho ze všech stran. [Select_CString(accursed.IsFemale,'Má pravdu','Má pravdu')], je to bezpochyby nithingový kůl, #EMP mocná#! kletba, která ohrožuje samotný život [accursed.GetFirstNameNoTooltip].\n\nRuny vyryté do jeho násady"
 fp1_yearly.0111.desc.skill.intrigue_high: "jsou #color_blue_gray složité a zdobné a slibují pokřivenou, bolestivou smrt#!."
 fp1_yearly.0111.desc.skill.learning_high: "jsou #color_blue_gray hluboké a potřísněné krví, očividně dílo učeného čaroděje#!."
 fp1_yearly.0111.desc.skill.intrigue_low: "jsou #color_blue_gray kruté, ale nesoustředěné, jako by se krvavé myšlenky toho ničemy bezcílně toulaly#!."
 fp1_yearly.0111.desc.skill.learning_low: "jsou #color_blue_gray neumělé a nasáklé krví, jasná známka práce nezkušeného čaroděje#!."
 fp1_yearly.0111.desc.skill.fallback: "jsou #color_blue_gray nerozluštitelné#!."
 fp1_yearly.0111.desc.first_connector: "Samotný text kletby"
 fp1_yearly.0111.desc.trait_1.lazy_or_arbitrary: "#color_blue_gray působí nerozhodně a ledabyle#!,"
 fp1_yearly.0111.desc.trait_1.wrathful_or_impatient: "#color_blue_gray překypuje neklidným hněvem#!,"
 fp1_yearly.0111.desc.trait_1.calm_or_patient: "je #color_blue_gray téměř děsivě klidný a zákeřný#!,"
 fp1_yearly.0111.desc.trait_1.sadistic_or_arrogant: "#color_blue_gray svědčí o obrovském egu nebo děsivé představivosti#!,"
 fp1_yearly.0111.desc.trait_1.callous_or_ambitious: "#color_blue_gray prozrazuje naprostou lhostejnost k ostatním lidem#!,"
 fp1_yearly.0111.desc.trait_1.deceitful_or_craven: "#color_blue_gray se znovu a znovu kroutí a stáčí sám do sebe#!,"
 fp1_yearly.0111.desc.trait_1.brave_or_trusting: "je #color_blue_gray smělý a rázný, pevně přesvědčený o své spravedlnosti#!,"
 fp1_yearly.0111.desc.trait_1.paranoid_or_vengeful: "#color_blue_gray působí prodchnutý zcela osobní nenávistí#!,"
 fp1_yearly.0111.desc.trait_1.fallback: "je #color_blue_gray nahodilou změtí#!,"
 fp1_yearly.0111.desc.second_connector: "a jeho závěr"
 fp1_yearly.0111.desc.trait_2.lazy_or_arbitrary: "je #color_blue_gray poněkud nevysvětleným zklamáním#!."
 fp1_yearly.0111.desc.trait_2.wrathful_or_impatient: "#color_blue_gray vyznívá jako narychlo načmáraný výbuch vzteku#!."
 fp1_yearly.0111.desc.trait_2.calm_or_patient: "#color_blue_gray působí děsivě nevyhnutelně#!."
 fp1_yearly.0111.desc.trait_2.sadistic_or_arrogant: "je #color_blue_gray dílem děsivého génia#!."
 fp1_yearly.0111.desc.trait_2.callous_or_ambitious: "#color_blue_gray vyznívá brutálně a nelítostně definitivně#!."
 fp1_yearly.0111.desc.trait_2.deceitful_or_craven: "#color_blue_gray čiší pokřivenou zbabělostí#!."
 fp1_yearly.0111.desc.trait_2.brave_or_trusting: "#color_blue_gray s neochvějnou jistotou předpovídá zkázu [accursed.GetFirstNameNoTooltip]#!."
 fp1_yearly.0111.desc.trait_2.paranoid_or_vengeful: "#color_blue_gray viní ze zkázy samotnou osobu [accursed.GetFirstNameNoTooltip]#!."
 fp1_yearly.0111.desc.trait_2.fallback: "je #color_blue_gray zklamáním#!."
 fp1_yearly.0111.desc.outro: "\n\nNemáme žádné svědky a kromě samotného proklínacího kůlu ani žádné #color_blue_gray důkazy#!."
 fp1_yearly.0111.tt.correct_guess: "Pokud je tvůj odhad správný"
 fp1_yearly.0111.tt.wrong_guess: "Pokud je tvůj odhad chybný"
 fp1_yearly.0111.tt.correct_accusation: "Najdeš dostatek důkazů o vině [culprit.GetFirstNameNoTooltip]"
 fp1_yearly.0111.tt.correct_accusation.tt: "[accursed.GetTitledFirstName] [Select_CString(accursed.IsFemale,'je osvobozena od kletby a navždy ti zůstane vděčná','je osvobozen od kletby a navždy ti zůstane vděčný')]"
 fp1_yearly.0111.tt.false_accusation: "Tvé obvinění se ukáže jako nepodložené"
 fp1_yearly.0111.tt.false_accusation.tt: "[accursed.GetTitledFirstName] [Select_CString(accursed.IsFemale,'je přesvědčena, že ji brzy čeká bolestivý konec','je přesvědčen, že ho brzy čeká bolestivý konec')]"
 fp1_yearly.0111.a: "Za tímhle bude [suspect_a.GetTitledFirstNameNoTooltip]!"
 fp1_yearly.0111.b: "Možná... [suspect_b.GetTitledFirstNameNoTooltip]..."
 fp1_yearly.0111.c: "Nejspíš za tím stojí [suspect_c.GetTitledFirstNameNoTooltip]."
 fp1_yearly.0111.d: "[accursed.GetFirstNameNoTooltip], copak nevidíš, že je to všechno jen v tvé hlavě?"
 fp1_yearly.0111.d.tt_success: "Podaří se ti [accursed.GetFirstName] uklidnit"
 fp1_yearly.0111.d.tt_failure: "[accursed.GetFirstNameNoTooltip] se psychicky zhroutí"
 fp1_yearly.0111.e: "Neboj se, znám protikouzlo!"
 fp1_yearly.0501.t: "Na projížďce po moři"
 fp1_yearly.0501.desc: "V dobách míru mám mnoho důvodů brázdit vody poblíž [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]: ukázat svou moc, odradit piráty, nebo si prostě jen zarybařit a užít mořský vánek.\n\nPrávě při jedné takové bezvýznamné plavbě zahlédnu v dálce místní loď, která se zoufale zmítá na vodě.\n\nI odsud je zřejmé, že při nájezdu utrpěla škody. Posádka ji sotva drží nad hladinou a vylévá vodu stříbrnými poháry a keramickými mísami. Ten pohled by byl směšný, kdyby situace nebyla tak vážná."
 fp1_yearly.0501.a: "Zastavte, zkusíme jim pomoct!"
 fp1_yearly.0501.a.tt_success: "Zachráníš posádku"
 fp1_yearly.0501.a.tt_failure: "Loď se potopí i s celou posádkou"
 fp1_yearly.0501.b: "Když pobijeme přeživší, kořist si můžeme nechat..."
 fp1_yearly.0501.b.tt_success: "Loď snadno přepadneš"
 fp1_yearly.0501.b.tt_failure: "Přeživší uniknou na břeh"
 fp1_yearly.0501.c: "Prostě poplujeme dál."
 fp1_yearly.0511.t: "Pach úspěchu"
 fp1_yearly.0511.desc: "#EMP Ten smrad je naprosto nesnesitelný#!.\n\nUž je to celý měsíc, co [stinker.GetFirstName] při lovu [Select_CString(stinker.IsFemale,'skolila','skolil')] toho proklatého [ROOT.Char.Custom('GetAnimalType')], a #EMP pořád#! s sebou vláčí jeho hlavu prolezlou červy.\n\nV [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] už toho mají všichni plné zuby, ale [stinker.GetFirstNameNoTooltip] se té zatracené věci odmítá zbavit.\n\nZdá se, že zbytku dvora konečně došla trpělivost a donutili [stinker.GetFirstNameNoTooltip] přijít za mnou, abych rozhodl."
 fp1_yearly.0511.a: "Je to moc pěkné, [stinker.GetFirstNameNoTooltip]. Opravdu, opravdu moc pěkné."
 fp1_yearly.0511.b: "Ať [ROOT.Char.GetFaith.HighGodName], [ROOT.Char.GetFaith.HealthGodName] i [ROOT.Char.GetFaith.HouseholdGodName] stojí při mně, už se toho #EMP zbav#!!"
 fp1_yearly.0511.c: "$fp1_berserk_roar_evtopt$"
 fp1_yearly.0511.d: "Co kdybychom ti zítra večer opatřili #EMP novou#! trofej?"
 fp1_yearly.0511.e: "Ano, [stinker.GetFirstNameNoTooltip], páchne to. A teď prosím odejdi."
 fp1_yearly.0521.t: "Krev na sněhu"
 fp1_yearly.0521.desc: "Přiletí to odnikud a zasáhne mě přímo do spánku. Ani jsem nezahlédl, co po mně letí, natož abych se pokusil uhnout, a na okamžik se oslepeně zapotácím.\n\nZa zády se mi ozve pronikavé zahihňání a já se prudce otočím.\n\n[child.GetFirstName] se vynoří ze svého úkrytu a v malé zákeřné ručce už svírá další sněhovou kouli."
 fp1_yearly.0521.a: "Dobrá rána! Pojď sem, ty malý rošťáku!"
 fp1_yearly.0521.a.tt: "S [child.GetFirstNameNoTooltip] po sobě házíte sněhové koule, dokud vám nepromrznou konečky prstů"
 fp1_yearly.0521.b: "#EMP Ach! Ne! Dostal jsi mě!#!"
 fp1_yearly.0521.b.tt: "Necháš [child.GetFirstNameNoTooltip], aby tě koulovalo, co hrdlo ráčí"
 fp1_yearly.0521.c: "Ty si troufáš na #EMP mě#! ve #EMP sněhové válce#!?"
 fp1_yearly.0521.c.tt: "Dítě nedítě, tohle je bitva a ty ji hodláš vyhrát!"
 fp1_yearly.0521.c.tt_success: "Dítě úspěšně porazíš"
 fp1_yearly.0521.c.tt_failure: "[child.GetFirstNameNoTooltip] tě naprosto rozdrtí"
 fp1_yearly.0521.d: "Tomuhle říkáš přepad? #EMP Skutečná#! strategie vyžaduje #EMP lest#!!"
 fp1_yearly.0521.d.tt: "Sněhovou bitvu bez námahy vyhraješ"
 fp1_yearly.0521.e: "$fp1_berserk_roar_evtopt$"
 fp1_yearly.0521.e.tt: "Sněhová koule v tobě probudí berserkerský běs"
 fp1_yearly.0521.f: "Mám práci, [child.GetFirstNameNoTooltip]. Běž otravovat někoho jiného."
 fp1_yearly.0531.t: "Dynastie [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] na ledě"
 fp1_yearly.0531.desc: "„[ROOT.Char.Custom('GetMaPa')|U]!“ vykřikne [child.GetFirstName] a sotva dorazíme k rybníku, už mě tahá za rukáv. „Nemá to cenu, vůbec mi to nejde. Neumím bruslit, ten led mě nenávidí.“\n\nLetmý pohled napoví, že [child.GetFirstNameNoTooltip] možná nepřehání: podle množství rozbitého ledu, které za sebou mé dítě zanechalo, to tu vypadá, jako by tudy prošla armáda."
 fp1_yearly.0531.a: "Je to snadné! Pojď, vysvětlím ti to..."
 fp1_yearly.0531.a.tt_success: "[child.GetFirstNameNoTooltip] získá jistotu a rovnováhu"
 fp1_yearly.0531.a.tt_failure: "Jen [child.GetFirstNameNoTooltip] ještě víc rozladíš"
 fp1_yearly.0531.b: "Nemáme snad služebnictvo, které můžeš otravovat?"
 fp1_yearly.0531.c: "Běž si hrát dovnitř, nebo nastydneš."
 fp1_yearly.0541.t: "Bestie z [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 fp1_yearly.0541.desc: "„[ROOT.Char.GetTitleAsNameNoTooltip]!“ odfrkne si [courtier.GetTitledFirstName], když ke mně rázně přikráčí a za ucho vleče mé dítě [child.GetFirstName].\n\n„Tohle zatracené dítě číhá za rohy převlečené do kůže [ROOT.Char.Custom('GetAnimalType')], pak na lidi s řevem vyskakuje a děsí je málem k smrti!“"
 fp1_yearly.0541.a: "Tohle je, upřímně řečeno, zatraceně legrační."
 fp1_yearly.0541.b: "[child.GetFirstNameNoTooltip], za tohle přijde trest."
 fp1_yearly.0541.c: "Ty obtěžuješ #EMP mé#! dítě? Do vyhnanství s tebou!"
 fp1_yearly.0541.d: "Je mi to opravdu, #EMP hluboce#! jedno."
 fp1_yearly.0551.t: "Podezřelá rybina"
 fp1_yearly.0551.desc: "Začalo to jako občasná pochoutka. Neobvyklý zvyk, jistě, ale jsem přece z [ROOT.Char.GetCulture.GetNameNoTooltip] kultury a kdo z nás někdy nesnědl nějakého podezřelého sledě?\n\nBěhem posledních několika týdnů se však záliba [antisocialite.GetTitledFirstName] ve zcela #EMP shnilých#! rybách změnila ze snesitelné výstřednosti ve všudypřítomný zápach.\n\nDnes ráno, když jsem zjistil, co [antisocialite.GetFirstNameNoTooltip] [Select_CString(antisocialite.IsFemale,'provedla','provedl')] s latrínou, mi došla trpělivost. Našel jsem [antisocialite.GetFirstNameNoTooltip] v síni, s tváří nasáklou páchnoucím lákem a půlkou rybího oka líně klouzající po bradě."
 fp1_yearly.0551.a: "Posaď se, [antisocialite.GetFirstNameNoTooltip]. Musíme si promluvit."
 fp1_yearly.0551.a.tt_success: "Výmluvně vysvětlíš svůj postoj"
 fp1_yearly.0551.a.tt_failure: "[antisocialite.GetFirstNameNoTooltip] se cítí hluboce uraženě"
 fp1_yearly.0551.b: "Možná bych si mohl prostě přestěhovat komnaty?"
 fp1_yearly.0551.b.tt: "[antisocialite.GetFirstNameNoTooltip] bude dál zamořovat okolí zápachem"
 fp1_yearly.0551.b_alt: "Nemáš... nemáš toho ještě trochu?"
 fp1_yearly.0551.b_alt.tt: "Společně s [antisocialite.GetFirstNameNoTooltip] zamoříte okolí zápachem"
 fp1_yearly.0551.c: "Víš co? Žalář. #EMP Hned#!."
 fp1_yearly.0551.d: "Jaká škoda, zdá se, že mě nutně potřebují #EMP hodně#! daleko odsud!"
 fp1_yearly.0561.t: "Má paže proti tvé"
 fp1_yearly.0561.desc: "„Co ty na to, [ROOT.Char.GetFirstNameNoTooltip]?“ říhne [knight.Custom2('MyCharacterIntroduction', ROOT.Char)] mezi doušky z korbelu a hrdě napne svaly.\n\n„Myslíš, že mě porazíš v páce? Tak pojď, kdo první vyhraje třikrát.“\n\nLžíce mi zůstane viset na půli cesty k ústům, ale hospoda propukne v hlučný jásot a pokřikování. Méně významní členové mého doprovodu se už nemohou dočkat souboje."
 fp1_yearly.0561.a: "Ty vyzýváš mě?"
 fp1_yearly.0561.a.tt_success: "Porazíš [knight.GetFirstNameNoTooltip]"
 fp1_yearly.0561.a.tt_failure: "[knight.GetFirstNameNoTooltip] vyhraje"
 fp1_yearly.0561.b: "#EMP *křupnutí kloubů*#!"
 fp1_yearly.0561.b.tt: "Snadno vyhraješ třikrát po sobě"
 fp1_yearly.0561.c: "Jistě, znám pár triků..."
 fp1_yearly.0561.c.tt_success: "Podvodem si zajistíš dramatické vítězství"
 fp1_yearly.0561.c.tt_failure: "[knight.GetFirstNameNoTooltip] odhalí tvůj podvod"
 fp1_yearly.0561.d: "[knight.GetFirstNameNoTooltip], jím. Běž otravovat někoho jiného."
 fp1_yearly.0571.t: "Drobný vandalismus"
 fp1_yearly.0571.desc: "„[ROOT.Char.GetTitledFirstNameNoTooltip]!“ vykřikne [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)]. Za zády [courtier.GetFirstNameNoTooltip] se mé dítě [child.GetFirstName] vzpouzí, zatímco se na sebe oba tak mračí, že mi sotva věnují pohled.\n\n„Tohle dítě bylo přistiženo, jak ničí tvůj runový kámen v [vandal_site.GetNameNoTier], maluje drakům genitálie a místo slov vyrývá sprosťárny.“"
 fp1_yearly.0571.a: "Nech [Select_CString(child.IsFemale,'dívku','chlapce')] se mnou. Promluvím si s [child.GetFirstNameNoTooltip]."
 fp1_yearly.0571.tt_success: "[child.GetFirstNameNoTooltip] pochopí, že [Select_CString(child.IsFemale,'udělala chybu','udělal chybu')]"
 fp1_yearly.0571.tt_failure: "[child.GetFirstNameNoTooltip] nechápe, v čem je problém"
 fp1_yearly.0571.b: "Opravu zaplatíš ze #EMP svých#! věcí, [child.GetFirstNameNoTooltip]!"
 fp1_yearly.0571.b.tt: "Runový kámen je opraven"
 fp1_yearly.0571.b.2: "To nic, opravu zaplatím."
 fp1_yearly.0571.c: "Je to jen dítě, [courtier.GetFirstNameNoTooltip], uklidni se."
 fp1_yearly.0581.t: "Až vyrostu"
 fp1_yearly.0581.desc.intro: "Náhlou ostrou bolest zezadu do holeně doprovodí za mými zády krev tuhnoucí výkřik. Prudce se otočím, připravený se bránit, a přede mnou stojí drobná postavička [child.GetFirstName] s pořádnou dřevěnou holí coby kyjem."
 fp1_yearly.0581.desc.victim: "Za [child.GetFirstNameNoTooltip] se pobaveně uculuje [victim.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 fp1_yearly.0581.desc.outro: "\n\n„Boj se mě! Strašlivý Viking [child.GetFirstNameNoTooltip] si přišel pro tvé zlato a mnichy!“ křičí mé dítě a doprovodí slova ranou do mého kolena. Plechová přilba sklouzne [child.GetFirstNameNoTooltip] přes oči, takže vidím jen bezzubý úsměv obrácený ke mně.\n\n„[ROOT.Char.Custom('GetMaPa')|U], až vyrostu, můžu být [child.Custom('ShieldPersonFemaleMale')]?“"
 fp1_yearly.0581.a: "Mé dítě, jednou se před tebou bude třást celý #EMP svět#!."
 fp1_yearly.0581.a.tt: "[child.GetFirstNameNoTooltip] má výrazně vyšší šanci stát se [GetTrait('shieldmaiden').GetName(child.Self)]"
 fp1_yearly.0581.b: "Vznešený cíl! Tak pojď, ničemo!"
 fp1_yearly.0581.b.tt: "$fp1_yearly.0581.a.tt$"
 fp1_yearly.0581.c: "Možná, pokud se osvědčíš proti [victim.GetFirstNameNoTooltip]..."
 fp1_yearly.0581.d: "Přestaň mě obtěžovat pošetilými sny."
 fp1_yearly.0581.e: "Ha! To se teprve uvidí, drobku."
 fp1_yearly.0591.t: "Hlasitá hádka na tingu"
 fp1_yearly.0591.desc: "Tingy jsou nezbytnou povinností každého řádného [ROOT.Char.GetTitleAsNameNoTooltip]. Scházejí se na nich všichni svobodní lidé z okolí, aby projednávali místní záležitosti, obchodovali a přetahovali se o to či ono privilegium.\n\nJak se u tak velkých shromáždění dá čekat, nálada se snadno vyhrotí, a tento ting není výjimkou.\n\nPřes všechen ten křik se jen stěží orientuji v podrobnostech, ale zdá se, že lidé z [county_a.GetNameNoTier]"
 fp1_yearly.0591.desc.border_dispute: "se hádají o vesnici na hranici s [county_b.GetNameNoTier], přičemž obě strany si nárokují tamní půdu."
 fp1_yearly.0591.desc.stolen_flocks: "obviňují významného velmože z [county_b.GetNameNoTier] z krádeže jejich stád."
 fp1_yearly.0591.desc.kidnapped_child: "křičí na své protějšky z [county_b.GetNameNoTier] kvůli údajnému únosu dítěte."
 fp1_yearly.0591.desc.drunken_arson: "protestují, že nemají nic společného se sérií žhářských útoků opilců v [county_b.GetNameNoTier]."
 fp1_yearly.0591.desc.lost_dog: "tvrdí, že závistiví výtržníci z [county_b.GetNameNoTier] ukradli jejich vesnického psa, místní chloubu."
 fp1_yearly.0591.desc.disrupted_wedding: "požadují náhradu za svatbu, kterou opilí hosté z [county_b.GetNameNoTier] proměnili v naprostý chaos."
 fp1_yearly.0591.desc.suspicious_will: "trvají na platnosti závěti, která jim odkazuje rozsáhlé pozemky v [county_b.GetNameNoTier]."
 fp1_yearly.0591.desc.sheltered_criminal: "poskytli útočiště zločinci z [county_b.GetNameNoTier]."
 fp1_yearly.0591.desc.bad_luck: "naříkají, že je očarovali a prokleli čarodějové z [county_b.GetNameNoTier]."
 fp1_yearly.0591.desc.fly_tipping: "se odmítají vzdát zvyku vyvážet odpad z města na hranici s [county_b.GetNameNoTier]."
 fp1_yearly.0591.a: "Lidé z [county_a.GetNameNoTierNoTooltip] jsou v právu."
 fp1_yearly.0591.b: "Podporuji [county_b.GetNameNoTierNoTooltip]!"
 fp1_yearly.0591.c: "Copak si dobří lidé z [county_a.GetNameNoTierNoTooltip] nechají tohle od #EMP [county_b.GetNameNoTierNoTooltip]#! líbit?"
 fp1_yearly.0591.d: "Nakonec je to všechny přestane bavit."
 fp1_yearly.0601.t: "Nejtěžší část vládnutí"
 fp1_yearly.0601.desc: "Tingy mohou být ze své podstaty často #EMP nesmírně#! nudné.\n\nKdyž se nikdo nerozčílí a nic dramatického se nestane, je to jen nekonečný zástup prostých svobodných lidí, kteří v dešti probírají malicherné záležitosti. Jenže jako [ROOT.Char.GetTitleAsNameNoTooltip] tu musím být.\n\nS každou vteřinou stárnu.\n\nSleduji, jak se lidé z [county.GetNameNoTier] umluví k smrti.\n\nA přeji si válku, která by mě zachránila z tohoto pozemského pekla."
 fp1_yearly.0601.a: "Musím. Zůstat. Vzhůru."
 fp1_yearly.0601.a.tt_success: "Přemůžeš únavu a zachováš důstojnost"
 fp1_yearly.0601.a.tt_failure: "Sesuneš se přímo ze stoličky"
 fp1_yearly.0601.b: "Za tu dobu bych mohl dělat tolik užitečných věcí..."
 fp1_yearly.0601.c: "$fp1_yearly.0601.b$"
 fp1_yearly.0601.d: "$fp1_yearly.0601.b$"
 fp1_yearly.0601.e: "$fp1_yearly.0601.b$"
 fp1_yearly.0601.f: "$fp1_yearly.0601.b$"
 fp1_yearly.0601.g: "Tohle nemá smysl. Jdu si zdřímnout."
 fp1_yearly.0601.g.nickname: "Tvé počínání ti vyslouží nové přízvisko"
 fp1_yearly.0611.t: "Jít příkladem"
 fp1_yearly.0611.desc: "„[ROOT.Char.Custom('GetMaPa')|U]!“ zaječí [child_b.GetFirstNameNoTooltip] a s pláčem ke mně přiběhne, zatímco za sebou táhne provinile se tvářící [child_a.GetFirstNameNoTooltip]. Tvář mého dítěte hyzdí obrovská rána, sice mělká, ale stále z ní vytéká krev. „[child_a.GetFirstNameNoTooltip] mě [Select_CString(child_a.IsFemale,'sekla','sekl')] #EMP opravdovým#! mečem! [Select_CString(child_a.IsFemale,'Říkala','Říkal')], že bude bojovníkem jako ty!“\n\n[child_a.GetFirstNameNoTooltip] se mi nedokáže podívat do očí.\n\n„Byla to nehoda. Jen jsme si hráli...“"
 fp1_yearly.0611.a: "Poslouchej, #EMP válka#! není žádná #EMP hra#!!"
 fp1_yearly.0611.a.tt_success: "[child_a.GetFirstNameNoTooltip] pochopí poučení a omluví se"
 fp1_yearly.0611.a.tt_failure: "Tvá domluva v [child_a.GetFirstNameNoTooltip] vyvolá jen zatrpklost"
 fp1_yearly.0611.b: "Ha! Celý já, [child_a.GetFirstNameNoTooltip]!"
 fp1_yearly.0611.c: "Dobrá, [child_b.GetFirstNameNoTooltip], ukážu ti, jak se bránit tyranům."
 fp1_yearly.0611.d: "Děti, běžte s tím za chůvou."
 fp1_yearly.0621.t: "Nablýskaná nová hračka"
 fp1_yearly.0621.desc: "Právě vykládáme z lodí poslední čerstvě ukořistěné poklady, když dorazí mé dítě [child.GetFirstName], samý úsměv a otázka na naše dobrodružství. Kolik lidí jsem zabil? Kdy bude moct vyrazit na nájezd se mnou? Viděl jsem nějaké mořské draky?\n\nZáplava otázek ustane teprve ve chvíli, kdy [child.GetFirstNameNoTooltip] zahlédne obrovský stříbrný pohár položený na největší truhle s pokladem, z jehož stěny se stále odlupuje zaschlá krev někdejšího majitele.\n\n„[ROOT.Char.Custom('GetMaPa')|U], ten je nádherný! Můžu... můžu ho mít?“"
 fp1_yearly.0621.a: "Samozřejmě, vezmi si ho!"
 fp1_yearly.0621.b: "Teď ne. Až budeš starší, můžeš si vlastní kořist zasloužit."
 fp1_yearly.0621.c: "Mazej pryč! Tohle je pro dospělé!"
 fp1_yearly.0631.t: "Cynické sklony"
 fp1_yearly.0631.desc: "Po návratu z úspěšného nájezdu každý správný příslušník [ROOT.Char.GetCulture.GetNameNoTooltip] kultury ví, že je třeba obětovat část kořisti [ROOT.Char.GetFaith.PantheonTerm].\n\nKaždý kromě [cynic.GetTitledFirstName].\n\nZatímco si ostatní rozdělujeme kořist, chlubíme se nejlepšími úlovky a dohadujeme se, co obětujeme jako poděkování za štěstí a příznivý vítr, všimnu si, že [cynic.GetFirstNameNoTooltip] mlčí.\n\nKdyž se na to zeptám, [cynic.GetFirstNameNoTooltip] to dokonce přizná: „Při našem nájezdu jsem neviděl žádný zásah [cynic.GetFaith.PantheonTerm], [ROOT.Char.GetTitleAsNameNoTooltip]. Jen své vlastní ruce a vlastní práci. Můj podíl patří mně.“"
 fp1_yearly.0631.a: "[cynic.GetFirstNameNoTooltip], to už hraničí s rouháním!"
 fp1_yearly.0631.a.tt_success: "Podaří se ti [cynic.GetFirstNameNoTooltip] zahanbit"
 fp1_yearly.0631.a.tt_failure: "[cynic.GetFirstNameNoTooltip] z tebe udělá hlupáka"
 fp1_yearly.0631.b: "Hmm, dobrý nápad. Každá trocha se počítá..."
 fp1_yearly.0631.c: "Eh, není to moje věc."
 fp1_yearly.0641.t: "Hodné oceánu"
 fp1_yearly.0641.desc: "Dlouhé lodě jsou v mnoha ohledech srdcem moci každého [ROOT.Char.GetTitleAsNameNoTooltip]. Co jsme bez přístupu k moři než vlci zavření v kleci, neschopní lovit či toulat se krajem?\n\nPři poslední prohlídce uskladněných lodí proto s nemalým zděšením zjišťuji, že mnohé začínají trouchnivět a rozpadat se. Jejich pečlivě klinkované trupy hrozí, že se po návratu na vodu rozpadnou."
 fp1_yearly.0641.a: "Jejich oprava přece nemůže stát tolik..."
 fp1_yearly.0641.a.tt: "Lodě jsou bez potíží opraveny"
 fp1_yearly.0641.b: "Nemá náhodou [neighbour.GetTitledFirstNameNoTooltip] docela novou flotilu?"
 fp1_yearly.0641.b.tt_success: "Úspěšně ukradneš nejlepší lodě [neighbour.GetFirstNameNoTooltip]"
 fp1_yearly.0641.b.tt_failure: "Přistihnou tě a musíš uprchnout"
 fp1_yearly.0641.c: "Z dlouhodobého hlediska se vyplatí zaplatit za to nejlepší."
 fp1_yearly.0641.d: "Pche, ať shnijí. Co se může stát?"
 fp1_yearly.0651.t: "Leviatan"
 fp1_yearly.0651.desc: "Silný [ROOT.Char.GetTitleAsNameNoTooltip] by měl trávit čas na moři, cítit slaný vzduch ve tváři a pod nohama mít pořádnou loď. Dnes jsem proto se svou osobní lodí a malou doprovodnou eskadrou vyrazil na cvičení, výcvik i trochu zábavy.\n\nKrátká plavba je osvěžující změnou oproti životu u [ROOT.Char.Custom('GetCourt')], když tu ho spatříme: v dálce vystříkne sloup vody a vzápětí se z vln vynoří ostrůvek temného masa barvy vína.\n\nNejvětší tvor ze všech mořských hlubin.\n\n#EMP Velryba#!."
 fp1_yearly.0651.a: "Přineste harpuny!"
 fp1_yearly.0651.a.tt_success: "Velrybu zabiješ a odtáhneš na břeh"
 fp1_yearly.0651.a.tt_failure: "Bestie ti unikne"
 fp1_yearly.0651.b: "Ať se o ni postarají ostatní, mně přineste mršinu."
 fp1_yearly.0651.c: "To je ale #EMP velkolepá#! kořist!"
 fp1_yearly.0651.c.tt: "Postavíš se #EMP skutečnému#! leviatanovi z hlubin"
 fp1_yearly.0651.c.tt_success: "$fp1_yearly.0651.a.tt_success$"
 fp1_yearly.0651.c.tt_failure: "$fp1_yearly.0651.a.tt_failure$"
 fp1_yearly.0651.d: "Tvor tak děsivě majestátní si zaslouží žít."
 fp1_yearly.0651.d.tt: "Velryba odpluje na svobodu"
 fp1_yearly.0661.t: "Neobvyklá výzva"
 fp1_yearly.0661.desc: "„Jen říkám, [ROOT.Char.GetTitledFirstNameNoTooltip], že lyžování je zábava i bez lovu. Nemělo by být tak zvláštní lyžovat prostě pro radost a ne jen proto, že je to užitečné,“ hučí do mě při večeři [knight.GetTitledFirstName].\n\nPřipadá mi, jako by tenhle rozhovor trval celý můj život. [knight.GetFirstNameNoTooltip] je tím úplně [Select_CString(knight.IsFemale,'posedlá','posedlý')].\n\n„Měli bychom to zkusit teď, dokud je sníh hluboký a čerstvý! Nedaleko odsud je prudký kopec. Vsadím se, že budu dole dřív než ty, a oba si to skvěle užijeme!“"
 fp1_yearly.0661.a: "Jak neobvyklé! Přijímám."
 fp1_yearly.0661.a.tt_success: "Je to těsné, ale vyhraješ!"
 fp1_yearly.0661.a.tt_failure: "[knight.GetFirstNameNoTooltip] prosviští do cíle jako první"
 fp1_yearly.0661.a.2: "Venku ve sněhu? Přijímám."
 fp1_yearly.0661.a.2.tt: "Snadno prosvištíš k vítězství"
 fp1_yearly.0661.b: "Hmm, možná bych si mohl opatřit malou #EMP výhodu#!..."
 fp1_yearly.0661.b.tt_success: "Dosáhneš #EMP snadného#! vítězství"
 fp1_yearly.0661.b.tt_failure: "Přistihnou tě při poškozování lyží [knight.GetFirstNameNoTooltip]"
 fp1_yearly.0661.c: "#EMP Závodní#! lyžování? Bez lovu? To zní nudně."
 fp1_yearly.0671.t: "Kluzký svah"
 fp1_yearly.0671.desc: "„[ROOT.Char.Custom('GetMaPa')|U]!“ zakřičí mi [child.GetFirstNameNoTooltip] přímo do ucha. Neochotně otevřu oči, jedno po druhém. Inu, i takhle se dá probudit.\n\nMalé dítě vedle mé postele se doslova chvěje nadšením a svírá palčáky a drahý dřevěný podnos.\n\n„Venku sněží a já chci jít #EMP sáňkovat#!! Půjdeš se mnou?“"
 fp1_yearly.0671.a: "Ha, jen počkej, vytáhnu ven stůl!"
 fp1_yearly.0671.b: "Pojď, vezmeme si od kuchařů tác!"
 fp1_yearly.0671.c: "Běž se zeptat [sibling.Custom('SisterBrother')]."
 fp1_yearly.0671.d: "Běž pryč, [Select_CString(ROOT.Char.IsFemale,'matka','otec')] odpočívá."
 fp1_yearly.0681.t: "Proč nemůžu jet taky?"
 fp1_yearly.0681.desc: "Se svými $knight_culture_player_plural_no_tooltip_lowercase$ si užívám příjemný večer v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. Vyprávíme si o dávných bitvách a minulých nájezdech, smějeme se, chlubíme a vůbec se pořádně noříme do pohárů. Zkrátka povedený večer.\n\nRozmazaným zrakem zahlédnu u dveří pracovny postávat jakýsi stín a zavolám vetřelce dovnitř. V celé místnosti okamžitě vyletí ruce k jílcům.\n\nMísto vraha se však objeví mé dítě [child.GetFirstName], s odhodlaným výrazem a drobnými [child.Custom('HandHands')] sevřenými v [child.Custom('Fist_ArticleBlank')][child.Custom('FistFists')].\n\n„[ROOT.Char.Custom('GetMaPa')|U], já chci taky jezdit na nájezdy! Není fér, že mě necháváte doma jen proto, že jsem ještě [Select_CString(child.IsFemale,'malá','malý')]!“"
 fp1_yearly.0681.a: "Nechávám tě tu hlídat [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], ano?"
 fp1_yearly.0681.b: "#EMP Ha!#! Skutečný válečník z tebe nikdy nebude, dítě."
 fp1_yearly.0681.b.haughty_knights: "Každý povýšený [Concept('knight','rytíř')|E]"
 fp1_yearly.0681.c: "Promluvíme si o tom, až budeš starší."
 fp1_yearly.0691.t: "Pokus o pokání"
 fp1_yearly.0691.desc: "Je už pozdní hodina, když ke mně přistoupí [knight.GetTitledFirstName] s napěchovanou brašnou přes rameno.\n\n„[ROOT.Char.GetTitledFirstNameNoTooltip], mrzí mě, že ti to musím říct, ale ve tvých službách už nemohu pokračovat.\n\nOd nájezdu na [county.GetNameNoTier] mě sžírá vina za to, co jsem [Select_CString(knight.IsFemale,'spáchala','spáchal')], a mí otroci vyznávající [knight.GetFaith.GetName] mi říkají, že mou duši může zachránit jedině to, když přijmu [knight.GetFaith.HighGodName] do svého srdce.\n\nS těžkým srdcem proto musím opustit tvůj hříšný dvůr i všechny ty hrůzy, které v tvých službách páchám.“"
 fp1_yearly.0691.a: "Snad ti ještě dokážu tu cizí víru rozmluvit?"
 fp1_yearly.0691.a.tt_success: "Přivedeš [knight.GetFirstNameNoTooltip] zpět ke světlu"
 fp1_yearly.0691.a.tt_failure: "[knight.GetFirstNameNoTooltip] odmítá naslouchat rozumu"
 fp1_yearly.0691.b: "[knight.GetFaith.GetReligion.GetNameNoTooltip]? [Select_CString(knight.IsFemale,'Zešílela jsi','Zešílel jsi')]. Stráže!"
 fp1_yearly.0691.b.same_faith_courtiers_and_guests: "[Concept('courtiers','Dvořané')|E] a [Concept('guests','hosté')|E] stejné [Concept('faith','víry')|E]"
 fp1_yearly.0691.c: "Můžeš odejít, jestli chceš."
 fp1_yearly.1001.t: "Cizinec u dvora"
 fp1_yearly.1001.desc.intro: "Během posledních několika dní jsem si u dvora několikrát všiml tajemného tuláka jménem [stranger.GetFirstName]. Jeho tvář si nevybavuji a nepamatuji si ani, že by někdo oznamoval jeho příchod.\n\n"
 fp1_yearly.1001.desc.behaviour_1.sneaks: "[stranger.GetFirstNameNoTooltip] se tu všude potají plíží,"
 fp1_yearly.1001.desc.behaviour_1.leaves_early: "[stranger.GetFirstNameNoTooltip] vždy odchází od večeře předčasně,"
 fp1_yearly.1001.desc.behaviour_1.earnest: "[stranger.GetFirstNameNoTooltip] tráví celé hodiny vážnými rozhovory s dvořany,"
 fp1_yearly.1001.desc.behaviour_1.confident: "[stranger.GetFirstNameNoTooltip] se #EMP všude#! pohybuje s naprostou samozřejmostí,"
 fp1_yearly.1001.desc.behaviour_1.talkative: "[stranger.GetFirstNameNoTooltip] tráví celé hodiny hovorem s kýmkoli, kdo je po ruce,"
 fp1_yearly.1001.desc.behaviour_1.eats_their_fill: "[stranger.GetFirstNameNoTooltip] při večeři nikdy nenechá ani sousto,"
 fp1_yearly.1001.desc.behaviour_2.sneaks: "a dlouho do noci se potají plíží po dvoře."
 fp1_yearly.1001.desc.behaviour_2.leaves_early: "a u večeře nikdy nezůstává déle, než je nezbytně nutné."
 fp1_yearly.1001.desc.behaviour_2.earnest: "a tráví celé hodiny vážnými rozhovory s mými dvořany."
 fp1_yearly.1001.desc.behaviour_2.confident: "a #EMP všude#! se pohybuje s naprostou samozřejmostí."
 fp1_yearly.1001.desc.behaviour_2.talkative: "a celé hodiny rozmlouvá s každým, kdo mu zkříží cestu."
 fp1_yearly.1001.desc.behaviour_2.eats_their_fill: "a při večeři nikdy nenechá ani sousto."
 fp1_yearly.1001.desc.outro: "Možná na [stranger.GetFirstNameNoTooltip] není nic zvláštního, ale něco na té osobě mě znervózňuje.\n\nKolik potíží může jeden tulák způsobit za den nebo dva?"
 fp1_yearly.1001.probably_harmless.tt: "Toto bude mít jen nepatrné následky"
 fp1_yearly.1001.guest_of_honour.tt: "Toto bude mít #EMP dramatické#! následky"
 fp1_yearly.1001.mysterious_stranger_disappears.tt: "Tajemný cizinec zmizí..."
 fp1_yearly.1001.a: "[stranger.GetFirstNameNoTooltip] nejspíš není nebezpečný."
 fp1_yearly.1001.b: "Tulák? [stranger.GetFirstNameNoTooltip] je můj čestný host!"
 fp1_yearly.1001.c: "Stráže! Vyhoďte toho žebráka!"
 fp1_yearly.1011.t: "$fp1_yearly.1001.t$: Goði"
 fp1_yearly.1011.desc.critical_preamble: "Čím lépe s [stranger.GetNameNoTooltip] zacházíme, tím podivněji se chová, ale jeho výstřednosti nikdy nepůsobí vyloženě nebezpečně. Už jsem se rozhodl nechat to být, když se jedné noci [stranger.GetNameNoTooltip] bez varování objeví v mých soukromých komnatách.\n\n"
 fp1_yearly.1011.desc.critical_epilogue: "\n\nA právě tak [stranger.GetNameNoTooltip] zmizí. Instinktivně vím, že až přijde ráno, nenajdeme po [stranger.GetFirstNameNoTooltip] ani stopu."
 fp1_yearly.1011.desc.standard_preamble: "[stranger.GetNameNoTooltip] se dál plíží po dvoře, ale kromě toho, že ostatním přinejhorším nahání nepříjemný pocit, zdánlivě nic nedělá. Až do noci, kdy se po setmění objeví v mých soukromých komnatách.\n\n"
 fp1_yearly.1011.desc.standard_epilogue: "\n\nStejně rychle, jako se [stranger.GetFirstNameNoTooltip] objeví, zase splyne se stíny. Pátrací skupiny nenajdou vůbec nic, ani jedinou stopu, a mně zbudou jen otázky."
 fp1_yearly.1011.desc.separate_religion.critical: "$fp1_yearly.1011.desc.critical_preamble$„Nevěřící!“ zaječí ten nevděčník. „Myslíš si, že si mou víru koupíš dobrými způsoby u stolu a polštáři z husího peří?! Jsem pravý [stranger.GetFaith.GetAdherentNameNoTooltip] a Staré bohy nikdy neopustím! Místo toho povím každému [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetFaith.PriestNeuterPlural], že jsi poskytl útočiště pohanovi!“$fp1_yearly.1011.desc.critical_epilogue$"
 fp1_yearly.1011.desc.separate_religion.standard: "$fp1_yearly.1011.desc.standard_preamble$„Kdybych byl méně čestný, zabil bych tě tady a teď za tvou rouhačskou víru. Naštěstí pro tebe má má čest větší cenu než tvůj život, a tak jsem se spokojil s tím, že jsem u tvého dvora šířil slovo [stranger.GetFaith.HighGodName].“$fp1_yearly.1011.desc.standard_epilogue$"
 fp1_yearly.1011.desc.same_religion.critical: "$fp1_yearly.1011.desc.critical_preamble$„Bohy uctíváš špatně, [ROOT.Char.GetFirstNameNoTooltip], ale čest jim vzdáváš dobře. Tvá víra sice uráží Ásy, ale Oběšence jsi potěšil. Já, Grímnir, dám [stranger.GetFaith.PriestNeuterPlural] této země vědět.“$fp1_yearly.1011.desc.critical_epilogue$"
 fp1_yearly.1011.desc.same_religion.standard: "$fp1_yearly.1011.desc.standard_preamble$„Bohy uctíváš špatně a pravé božství nepoznáš ani ve vlastním dvoře, přestože Grímnir chodí jeho chodbami a sedává u tvého stolu. Lituji tě, [Select_CString(ROOT.Char.IsFemale,'ubožačko','ubožáku')], protože mé síně ve Valhalle #EMP nikdy#! nespatříš!“$fp1_yearly.1011.desc.standard_epilogue$"
 fp1_yearly.1011.desc.same_faith.critical: "$fp1_yearly.1011.desc.critical_preamble$„Tvá pohostinnost si zaslouží chválu, [ROOT.Char.GetFirstNameNoTooltip], a vidím, že jsi buď [Select_CString(ROOT.Char.IsFemale,'prozíravá, zbožná, nebo obojí','prozíravý, zbožný, nebo obojí')]. Ať tak či onak, moudří [stranger.GetFaith.PriestNeuterPlural] této země se dozvědí, že jsi hostil Grímnira a dobře zacházel s Pánem Ásů.“$fp1_yearly.1011.desc.critical_epilogue$"
 fp1_yearly.1011.desc.same_faith.standard: "$fp1_yearly.1011.desc.standard_preamble$„Pozorovaly tě prastaré oči, [ROOT.Char.GetFirstNameNoTooltip], a [Select_CString(ROOT.Char.IsFemale,'shledaly tě nehodnou','shledaly tě nehodným')],“ vykřikne [stranger.GetFirstNameNoTooltip] a všude kolem létají sliny. „Grímnir bloudí tvým dvorem a ty nic neděláš, nic nevidíš? [stranger.GetFaith.PriestNeuterPlural] této země se dozvědí, že tě navštívili Ásové a že bohové čekají, zda se polepšíš!“$fp1_yearly.1011.desc.standard_epilogue$"
 fp1_yearly.1011.a: "To přece #EMP opravdu#! nemohl být Otec veškerenstva?"
 fp1_yearly.1011.b: "Parchant!"
 fp1_yearly.1011.possible_converts_specific_list: "Alespoň jeden [Concept('courtier','dvořan')|E]"
 fp1_yearly.1012.t: "$fp1_yearly.1001.t$: [stranger.GetFaith.GetAdjectiveNoTooltip] misionář"
 fp1_yearly.1012.desc.preamble: "[stranger.GetNameNoTooltip] se ukáže být živým a vzdělaným hostem a večer co večer tráví dlouhými debatami se zbytkem dvora.\n\nDnes večer mě [stranger.GetFirstNameNoTooltip] navštíví se širokým úsměvem ve tváři.\n\n"
 fp1_yearly.1012.desc.same_faith_epilogue: "\n\n[stranger.GetFirstNameNoTooltip] se nejistě odmlčí. „Pokud si přeješ, bylo by mi ctí zůstat u tvého dvora natrvalo.“"
 fp1_yearly.1012.desc.different_faith.critical: "$fp1_yearly.1012.desc.preamble$„[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Už dlouho se mnou nikdo nezacházel tak dobře a děkuji ti za pohostinnost. Obávám se však, že se ti musím k něčemu přiznat: jsem [stranger.GetFaith.GetAdherentNameNoTooltip], sloužím [stranger.GetFaith.HighGodName] a tvé poddané jsem seznamoval s učením své víry.“"
 fp1_yearly.1012.desc.different_faith.standard: "$fp1_yearly.1012.desc.preamble$„[ROOT.Char.GetTitleAsNameNoTooltip], vím, že už teď mě nechováš ve zvláštní oblibě, ale obávám se, že se musím k něčemu přiznat. Po celou dobu pobytu u tvého dvora jsem s tvými poddanými rozmlouval o díle [stranger.GetFaith.HighGodName] a každého, kdo byl ochoten naslouchat, jsem vzdělával ve víře [stranger.GetFaith.GetName].“"
 fp1_yearly.1012.desc.same_faith.critical: "$fp1_yearly.1012.desc.preamble$„Velkomyslný [ROOT.Char.GetTitleAsNameNoTooltip]! Chci ti poděkovat za to, jak dobře jsi se mnou po celou dobu zacházel. Jako oddaný [Select_CString(stranger.IsFemale,stranger.GetFaith.DevoteeFemale,stranger.GetFaith.DevoteeMale)] a zároveň [stranger.GetFaith.GetAdherentNameNoTooltip] jsem vlivným teologům po celém panství rozeslal dopisy opěvující tvou zbožnost.“$fp1_yearly.1012.desc.same_faith_epilogue$"
 fp1_yearly.1012.desc.same_faith.standard: "$fp1_yearly.1012.desc.preamble$„[ROOT.Char.Custom('FormOfAddressForLiege')|U], nebyl jsem k tobě zcela upřímný. Vypadám sice jako žebrák, ale ve skutečnosti jsem [Select_CString(stranger.IsFemale,stranger.GetFaith.DevoteeFemale,stranger.GetFaith.DevoteeMale)] a svůj čas u dvora jsem trávil výukou a přednáškami o díle [stranger.GetFaith.HealthGodName]. Přestože jsi mě v tom možná nepodporoval, děkuji ti za pohostinnost.“$fp1_yearly.1012.desc.same_faith_epilogue$"
 fp1_yearly.1012.a: "Pověz mi víc o... [stranger.GetFaith.GetNameNoTooltip]..."
 fp1_yearly.1012.a.recoup_lost_piety.tt: "Veškerá [Concept('piety','zbožnost')|E] vynaložená na hostění misionáře se ti vrátí"
 fp1_yearly.1012.b: "Ty jsi #EMP co#!? Odejdi. Hned."
 fp1_yearly.1012.c: "Ty [stranger.Custom2('InsultAdjective', ROOT.Char)] [stranger.Custom2('InsultNoun', ROOT.Char)]! #EMP STRÁŽE!#! Do řetězů s [Select_CString(stranger.Char.IsFemale,'ní','ním')]!"
 fp1_yearly.1012.d: "Přijímám tvé služby."
 fp1_yearly.1012.e: "Rádců a teologů už mám dost, díky."
 fp1_yearly.1012.possible_converts_specific_list: "$fp1_yearly.1011.possible_converts_specific_list$"
 fp1_yearly.1013.t: "$fp1_yearly.1001.t$: Nithing"
 fp1_yearly.1013.desc.critical: "#EMP Katastrofa!#!\n\n[stranger.GetNameNoTooltip] se mi za pohostinnost [Select_CString(stranger.IsFemale,'odvděčila','odvděčil')] tím, že mě v noci [Select_CString(stranger.IsFemale,'okradla','okradl')]. [Select_CString(stranger.IsFemale,'Sebrala','Sebral')] každý kus lesklého kovu i exotické látky, který [Select_CString(stranger.IsFemale,'našla','našel')], a nakonec [Select_CString(stranger.IsFemale,'uprchla','uprchl')] na mém nejlepším koni!"
 fp1_yearly.1013.desc.standard: "[stranger.GetNameNoTooltip] v noci [Select_CString(stranger.IsFemale,'uprchla','uprchl')] a [Select_CString(stranger.IsFemale,'odnesla','odnesl')] s sebou všechny cennosti, na které [Select_CString(stranger.IsFemale,'dokázala','dokázal')] položit své špinavé pracky."
 fp1_yearly.1013.desc.outro: "\n\nZdá se, že tajemný cizinec byl ve skutečnosti nithing na útěku: [Select_CString(stranger.IsFemale,'odsouzená','odsouzený')] za zločin považovaný za tak ohavný, že je nyní bez přísah i beze cti a vlastní rodina [stranger.GetFirstNameNoTooltip] považuje z hlediska práva za mrtvou osobu. Taková urážka bolí."
 fp1_yearly.1013.desc.outro.sodomite: "\n\nZdá se, že tajemný cizinec byl ve skutečnosti nithing na útěku: [Select_CString(stranger.IsFemale,'vyobcovaná','vyobcovaný')] ze společnosti, [stranger.GetFirstNameNoTooltip] putuje od dvora ke dvoru a hledá bezpečné útočiště.\n\nKdyž se mí dvořané ukázali stejně konzervativní jako předchozí hostitelé, [stranger.GetFirstNameNoTooltip] raději [Select_CString(stranger.IsFemale,'uprchla','uprchl')], než aby [Select_CString(stranger.IsFemale,'zůstala','zůstal')] a trpěl."
 fp1_yearly.1013.a: "K čertu!"
 fp1_yearly.1013.a.sodomite: "Žít takový život..."
 fp1_yearly.1013.b: "Nebudu mít klid, dokud toho nithinga nenajdou!"
 fp1_yearly.1014.t: "$fp1_yearly.1001.t$: Válečník"
 fp1_yearly.1014.desc.critical: "[stranger.GetNameNoTooltip] působí příjemně překvapeně, že s [stranger.GetFirstNameNoTooltip] zacházím jako s čestným hostem, a na konci dne mě vyhledá o samotě.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], nebyl jsem k tobě zcela upřímný. Možná působím chatrně, ale ve skutečnosti jsem [Select_CString(stranger.IsFemale,'proslulá obávaná válečnice','proslulý obávaný válečník')]! Hledám lenního pána hodného svých služeb a podle tvého jednání soudím, že bys jím mohl být právě ty.“"
 fp1_yearly.1014.desc.standard: "[stranger.GetNameNoTooltip] se ještě nějakou dobu zdržuje u dvora a nakonec si nějakým způsobem vymůže soukromou audienci.\n\n„Mocný [ROOT.Char.GetTitleAsNameNoTooltip], rád bych ti nabídl svůj meč. Jsem [Select_CString(stranger.IsFemale,'potulná válečnice, která už dlouho hledá dobrého lenního pána','potulný válečník, který už dlouho hledá dobrého lenního pána')], a pobyt u tvého dvora mě přesvědčil, že bys jím mohl být právě ty.“"
 fp1_yearly.1014.desc.outro: "\n\nObvyklý způsob, jak získávat $knight_culture_player_plural_no_tooltip_lowercase$, to rozhodně není, ale přiznávám, že mě #EMP těší#!, že jsem v této zkoušce obstál."
 fp1_yearly.1014.a: "Skvělé! Tvůj žold se rozhodně vyplatí!"
 fp1_yearly.1014.b: "Schopných válečníků mám dost i bez těch, kteří zkoušejí mou trpělivost."
 fp1_yearly.1015.t: "$fp1_yearly.1001.t$: Tulák"
 fp1_yearly.1015.desc.critical: "[stranger.GetFirstNameNoTooltip] je z toho zacházení [Select_CString(stranger.IsFemale,'zmatená, ohromená a nadšená','zmatený, ohromený a nadšený')]. Zdá se, že být považován za příslušníka nižší šlechty je pro [stranger.GetFirstNameNoTooltip] naprosto nová zkušenost, a trvá docela dlouho, než [stranger.GetFirstNameNoTooltip] pochopí, co se vlastně děje."
 fp1_yearly.1015.desc.standard: "[stranger.GetFirstNameNoTooltip] zůstává vcelku neškodný a během krátkého pobytu v mé domácnosti podle očekávání tropí jen drobné neplechy. Teprve když zaslechnu [stranger.GetFirstNameNoTooltip] při tlumeném rozhovoru, všechno mi dojde."
 fp1_yearly.1015.desc.outro: "\n\nUkazuje se, že [stranger.GetFirstNameNoTooltip] #EMP opravdu#! není nic víc než potulný tulák, který se nějak prosmýkl za hradby!\n\nZatímco přemýšlím, co s tím, [stranger.GetFirstNameNoTooltip] ke mně přijde s čapkou v ruce a prosí, abych [stranger.GetFirstNameNoTooltip] dovolil zůstat natrvalo."
 fp1_yearly.1015.a: "Samozřejmě můžeš zůstat."
 fp1_yearly.1015.b: "Cože?! To je drzost, ven!"
 fp1_yearly.1062.t: "Život hodný vzpomínky: [ship_funeral_candidate.GetFirstNameNoTooltip]"
 fp1_yearly.1062.desc: "[ship_funeral_candidate.Custom2('MyCharacterIntroduction',mourner)|U] nedávno [Select_CString(ship_funeral_candidate.IsFemale,'zemřela','zemřel')] a [Select_CString(ship_funeral_candidate.IsFemale,'její blízcí nyní truchlí nad ztrátou výjimečné ženy','jeho blízcí nyní truchlí nad ztrátou výjimečného muže')].\n\nJako někdo z nejbližších zesnulého bych se [Select_CString(mourner.IsFemale,'mohla','mohl')] ujmout uspořádání důstojného pohřbu.\n\nMezi správnými [ship_funeral_candidate.GetFaith.GetAdherentNamePluralNoTooltip] je zvykem pohřbívat naše nejvznešenější s lodí, aby je doprovodila na onen svět, tam, kde na ně čeká [ship_funeral_candidate.GetFaith.PositiveAfterLife]. A [ship_funeral_candidate.GetFirstNameNoTooltip] si takovou poctu jistě zaslouží?"
 fp1_yearly.1062.a: "Postačí malá symbolická kamenná loď."
 fp1_yearly.1062.a.tt: "Začínají přípravy pohřbu..."
 fp1_yearly.1062.b: "Velká kamenná loď, ať ji spatří i [ship_funeral_candidate.GetFaith.WarGodName]!"
 fp1_yearly.1062.c: "Zdobená skutečná loď. [ship_funeral_candidate.GetFirstNameNoTooltip] si zaslouží to nejlepší."
 fp1_yearly.1062.d: "Tohle všechno je #EMP nehorázně#! drahé..."
 fp1_yearly.1063.t: "$fp1_yearly.1062.t$"
 fp1_yearly.1063.desc.intro: "Stojím před malým zástupem truchlících, pohledem postupně přejedu všechny plačící pozůstalé a začnu svou řeč.\n\n„[ship_funeral_candidate.GetFirstNameNoTooltip]"
 fp1_yearly.1063.desc.achievements.title.duchy: "[Select_CString(ship_funeral_candidate.IsFemale,'skvělá','skvělý')] [ship_funeral_candidate.GetTitleAsNameNoTooltip],"
 fp1_yearly.1063.desc.achievements.title.kingdom: "[Select_CString(ship_funeral_candidate.IsFemale,'oslnivá','oslnivý')] [ship_funeral_candidate.GetTitleAsNameNoTooltip],"
 fp1_yearly.1063.desc.achievements.title.empire: "[Select_CString(ship_funeral_candidate.IsFemale,'velkolepá','velkolepý')] [ship_funeral_candidate.GetTitleAsNameNoTooltip],"
 fp1_yearly.1063.desc.achievements.prestige.high: "[Select_CString(ship_funeral_candidate.IsFemale,'proslulá žena','proslulý muž')],"
 fp1_yearly.1063.desc.achievements.prestige.very_high: "[Select_CString(ship_funeral_candidate.IsFemale,'vznešená žena','vznešený muž')],"
 fp1_yearly.1063.desc.achievements.prestige.max: "skutečná legenda,"
 fp1_yearly.1063.desc.achievements.piety.high: "[Select_CString(ship_funeral_candidate.IsFemale,'oddaná služebnice víry, jejímž nejvyšším božstvem je','oddaný služebník víry, jehož nejvyšším božstvem je')] [ship_funeral_candidate.GetFaith.HighGodName],"
 fp1_yearly.1063.desc.achievements.piety.very_high: "bezkonkurenční vzor ctností, které hlásá [ship_funeral_candidate.GetFaith.GetNameNoTooltip],"
 fp1_yearly.1063.desc.achievements.piety.max: "skutečná ikona víry, kterou představuje [ship_funeral_candidate.GetFaith.GetNameNoTooltip],"
 fp1_yearly.1063.desc.achievements.lifestyles.partying: "studnice veselí a smíchu,"
 fp1_yearly.1063.desc.achievements.lifestyles.duelling: "[Select_CString(ship_funeral_candidate.IsFemale,'skutečně smrtící duelantka','skutečně smrtící duelant')],"
 fp1_yearly.1063.desc.achievements.lifestyles.hunting: "[Select_CString(ship_funeral_candidate.IsFemale,'nejlepší střelkyně','nejlepší střelec')] v [hunting_lands.GetNameNoTierNoTooltip],"
 fp1_yearly.1063.desc.achievements.lifestyles.magickerationing: "[Select_CString(ship_funeral_candidate.IsFemale,'znalkyně','znalec')] mystických umění,"
 fp1_yearly.1063.desc.achievements.single.intro: "[Select_CString(ship_funeral_candidate.IsFemale,'měla jedinou skutečnou vášeň. Snad právě proto platilo, že byla','měl jedinou skutečnou vášeň. Snad právě proto platilo, že byl')]"
 fp1_yearly.1063.desc.achievements.single.outro: "a v tom [Select_CString(ship_funeral_candidate.IsFemale,'ji','ho')] možná už nikdy nikdo nepřekoná.“"
 fp1_yearly.1063.desc.achievements.double.intro: "[Select_CString(ship_funeral_candidate.IsFemale,'byla osobností vzácného talentu a širokých zájmů. Byla','byl osobností vzácného talentu a širokých zájmů. Byl')]"
 fp1_yearly.1063.desc.achievements.double.connector: "a také"
 fp1_yearly.1063.desc.achievements.double.outro: "a přesto nic nezaplní prázdnotu, kterou po sobě [Select_CString(ship_funeral_candidate.IsFemale,'zanechala','zanechal')].“"
 fp1_yearly.1063.desc.achievements.triple.intro: "[Select_CString(ship_funeral_candidate.IsFemale,'byla tolika věcmi. Byla','byl tolika věcmi. Byl')] "
 fp1_yearly.1063.desc.achievements.triple.connector: "$fp1_yearly.1063.desc.achievements.double.connector$"
 fp1_yearly.1063.desc.achievements.triple.outro: "ale pro mě [Select_CString(ship_funeral_candidate.IsFemale,'byla','byl')] především [ship_funeral_candidate.Custom2('RelationToMe', mourner)]. Nikoho jako [ship_funeral_candidate.GetFirstNameNoTooltip] už nikdy neuvidíme.“"
 fp1_yearly.1063.desc.ship_stone_small: "\n\nMohyla za mnou už ukrývá malou napodobeninu lodi, jejíž obrys tvoří těžké náhrobní kameny a vnitřek vyplňují valouny, vše zasypané mohutnou vrstvou hlíny."
 fp1_yearly.1063.desc.ship_stone_grand: "\n\nVelká mohyla za mnou už ukrývá obrovskou napodobeninu lodi, jejíž obrys tvoří runové kameny a vnitřek vyplňují valouny. Každý z velkých kamenů vypráví příběh ze života zesnulého."
 fp1_yearly.1063.desc.ship_wood_ornate: "\n\nMohyla za mnou už ukrývá loď postavenou přímo pro tento pohřeb z exotického dřeva rukama našich nejlepších loďařů. Po mořích smrtelníků nikdy nepopluje, ale snad bude mít posvátný význam. [ship_funeral_candidate.GetFaith.PantheonTerm]! Kéž tato loď přinese zesnulému požehnání."
 fp1_yearly.1063.desc.outro: "\n\nDružiníci přinesou poslední pohřební dary. Nakonec na márách spočine i [ship_funeral_candidate.GetFirstNameNoTooltip]."
 fp1_yearly.1063.trigger_failure.tt: "Okolnosti zmařily veřejný pohřeb, který [ship_funeral_candidate.GetFirstNameNoTooltip] [Select_CString(ship_funeral_candidate.IsFemale,'měla','měl')] mít"
 fp1_yearly.1063.a: "Uzavřete mohylu."
 fp1_yearly.1071.t: "[Select_CString(ROOT.Char.IsFemale,'Čistá jako ze škatulky','Čistý jako ze škatulky')]"
 fp1_yearly.1071.desc: "Lidé [ROOT.Char.GetCulture.GetNameNoTooltip] kultury jsou proslulí úzkostlivou čistotou.\n\nJednou z velkých radostí života je poslouchat i naše nejzarytější nepřátele, jak se skřípěním zubů přiznávají, že žádný muž nemá lépe učesané vousy, nikdo nemá častěji myté vlasy ani tvář tak dokonale zbavenou nečistot jako správný příslušník [ROOT.Char.GetCulture.GetNameNoTooltip] kultury.\n\nDnes je den koupele, ale mám pocit, že by mi změna zaběhnutého pořádku mohla prospět. Koneckonců, když jsou všichni z [ROOT.Char.GetCulture.GetNameNoTooltip] kultury tak upravení, neměl by právě [ROOT.Char.GetTitleAsNameNoTooltip] být #EMP [Select_CString(ROOT.Char.IsFemale,'nejlépe upravená','nejlépe upravený')]#!?"
 fp1_yearly.1071.a: "Hygiena je klíčem k dlouhému životu!"
 fp1_yearly.1071.b: "Asi bych o sebe mohl pečovat o trochu víc..."
 fp1_yearly.1071.c: "Obvyklá péče bohatě stačí."
 fp1_yearly.1081.t: "Průzkumník ze západu"
 fp1_yearly.1081.desc.intro: "Celý večer mi zabral [Select_CString(norse_explorer.IsFemale,'letitá průzkumnice','letitý průzkumník')] [norse_explorer.GetFirstName], [Select_CString(norse_explorer.IsFemale,'odhodlaná vyprávět','odhodlaný vyprávět')] mi exotické příběhy o svých výpravách a dobrodružstvích v Atlantském oceánu.\n\nNavzdory věku má [norse_explorer.GetFirstNameNoTooltip] stále bystrý pohled, když mi vypráví o"
 fp1_yearly.1081.desc.greenland: "zemi chudých a strádajících $norse_collective_noun$, kteří žijí ve sněhu téměř na samém vrcholu světa. Země je tak promrzlá a chladná, že musí dovážet veškeré dřevo a živí se téměř výhradně masem a rybami."
 fp1_yearly.1081.desc.vinland: "zemi ležící stejně daleko na západ jako Kitaj na východ, kde hrozny a pšenice rostou tak bujně, jako by se samy zasévaly, a zdejší víno nemá obdoby. Každý místní je obávaný válečník, který nestrpí žádné vetřelce."
 fp1_yearly.1081.desc.antilia: "ostrově osídleném vyhnanci z [antilia_culture.GetNameNoTooltip] kultury. Jsou to bohatí a zámožní $christianity_religion_adherent_plural$, kteří žijí v dobře opevněných hradech a pocházejí z uprchlíků, kteří opustili Ibérii během maurské invaze."
 fp1_yearly.1081.desc.fortunate_isles.hellenist: "poslední přežívající výspě $hellenic_pagan$, maličkém ostrově na západě obývaném $greek_collective_noun$, kteří mají blíž ke starověkému $b_athens$ než k dnešnímu $b_constantinople$. Místní tráví celé dny debatami o filozofii a připíjením na slávu Olympanů!"
 fp1_yearly.1081.desc.fortunate_isles.other: "útočišti posledních několika pohanských $hellenic_pagan_adherent_plural$, kteří hrubě napodobují své dávné předky z $b_athens$ a $b_thebes$. Místní tráví dny zahálkou, debatami o podivné filozofii a provozováním své primitivní víry."
 fp1_yearly.1081.desc.st_brendans_island: "ostrově ukrytém za podivnými mlhami, kde jako by čas plynul pomaleji než ve vnějším světě. O dalších tajemstvích ostrova [norse_explorer.GetFirstNameNoTooltip] zarytě mlčí, ačkoli se [Select_CString(norse_explorer.IsFemale,'jí','mu')] občas oči zalijí slzami."
 fp1_yearly.1081.desc.isle_of_the_blessed.christian: "ostrově plném zbožných $breton_collective_noun$, kteří se modlí a vedou životy tichého rozjímání. Jejich víra je tak silná, že jsou všichni imunní vůči zbraním smrtelníků a dokonale je chrání [norse_explorer.GetFaith.HighGodName]."
 fp1_yearly.1081.desc.isle_of_the_blessed.other: "ostrově plném zbožných $breton_collective_noun$ a bohatém na zlaté poklady. Jejich víra byla tak silná, že ostrovem zněly nádherně zpívané hymny ještě poté, co je posádka [norse_explorer.GetFirstNameNoTooltip] pobila."
 fp1_yearly.1081.desc.ard_majhulah: "podivné zemi zmiňované pouze ve starých islámských textech, která byla po dlouhá léta považována za ztracenou. Každý z místních má takové hromady zlata a stříbra, že z nich vyrábějí párátka a vetkávají je do svých šatů."
 fp1_yearly.1081.desc.the_sticky_sea: "ponurém moři uprostřed Atlantiku, lepkavé a páchnoucí změti vod, kde se hadi a chaluhy spikly, aby stahovaly námořníky na smrt. Jen ty nejsilnější posádky mají vůbec šanci se vyprostit."
 fp1_yearly.1081.desc.purple_islands: "souostroví daleko na jihu, plném zářivých květin, z nichž mnohé mají exotické odstíny purpuru, ale naprosto bez jediné stopy lidského života. Tajuplná krása toho místa svádí i ostřílené námořníky, aby si lehli a v pokoji se světem zemřeli."
 fp1_yearly.1081.desc.hy_brasil: "ostrově, který je po většinu času neviditelný a skrytý za neproniknutelnými mlhami, jež ustoupí pouze na jediný den každých sedm let. Ani tehdy, když mlhy dovolí plavbu, se však žádnému námořníkovi nepodařilo přistát."
 fp1_yearly.1081.desc.thule: "rozlehlé zemi daleko, daleko na severu, kde se rozpadá samotná podstata světa. Lidé tam dýchají vodu i zemi stejně snadno jako vzduch, obludné velryby plavou půdou i oblohou a všechny rozdíly mezi věcmi ztrácejí význam."
 fp1_yearly.1081.desc.great_ireland.abrahamic: "zemi daleko na západě, kde obyvatelé nosí jen bílou, svírají krutá kopí a zuřivě bojují mezi sebou i proti těm nejvznešenějším návštěvníkům. Místní uctívají prastará pohanská božstva, na která správně smýšlející [norse_explorer.GetFaith.GetAdherentNamePluralNoTooltip] už dávno zapomněli."
 fp1_yearly.1081.desc.great_ireland.other: "zemi daleko na západě, kde obyvatelé nosí jen bílou, svírají krutá kopí a bojují s nelidskou silou a zuřivostí. Jejich udatnost je tak legendární, že žádný válečník z této země dosud nepadl cizím ostřím."
 fp1_yearly.1081.desc.sunset_empire: "říši na opačné straně nejširšího místa Atlantiku, zemi krve, lebek a lačných dobyvatelů číhajících těsně za západním obzorem. Její krutí vládci čekají na samotný Ragnarök, kdy hodlají vyrvat tlukoucí srdce všem dobrým [norse_explorer.GetFaith.GetAdherentNamePluralNoTooltip]."
 fp1_yearly.1081.desc.outro: "\n\nPřestože se připozdívá, [norse_explorer.GetFirstNameNoTooltip] bude zjevně ochotně pokračovat, pokud budu chtít."
 fp1_yearly.1081.a: "Fascinující. Prosím, ještě jednou od začátku!"
 fp1_yearly.1081.b: "To snad #EMP nemyslíš#! vážně, [Select_CString(norse_explorer.IsFemale,'stařenko','staříku')]."
 fp1_yearly.1081.c: "Příběhy o vzdálených zemích vždycky uklidňují..."
 fp1_yearly.1081.c.sunset_empire: "Možná bychom měli zakázat lodím plout na západ..."
