l_polish:
 fp1_berserk_roar_evtopt: "#BER RAAAAARGH!#!"
 fp1_yearly.0001.t: "Uprchlý otrok"
 fp1_yearly.0001.desc: "Otroci jsou součástí života v [ROOT.Char.GetCulture.GetNameNoTooltip] kultuře. Nižší lidé, zajatí ze zahraničí nebo narození z otroků, pracují na našich polích a pečují o naše domácnosti.\n\nTeoreticky.\n\nVčera v noci se jeden takový otrok rozhodl, že [dummy_gender.GetSheHe] má dost, a utekl, odnesl hrst cenných šperků s [dummy_gender.GetHerHim]! Co je horší, [scapegoat.Custom2('MyCharacterIntroduction',ROOT.Char)] #EMP saw#! otroka, jak se řítí do tmy, a nenapadlo [scapegoat.GetFirstNameNoTooltip] říct to někomu až do rána."
 fp1_yearly.0001.gold_stays_lost.tt: "Vaše stříbro zůstává ztracené"
 fp1_yearly.0001.a: "Pošli popis do všech vesnic!"
 fp1_yearly.0001.a.tt_success: "Otrok je spatřen a zajat"
 fp1_yearly.0001.a.tt_failure: "Otrok uniká s vaším stříbrem"
 fp1_yearly.0001.b: "Přineste mi plášť, toho [dummy_gender.GetHerHim] dopadnu osobně."
 fp1_yearly.0001.b.tt_success: "Chytíte otroka dřív, než se dostane daleko"
 fp1_yearly.0001.b.tt_failure: "$fp1_yearly.0001.a.tt_failure$"
 fp1_yearly.0001.c: "[scapegoat.GetFirstNameNoTooltip], tohle je tvoje vina, tak zaplatíš!"
 fp1_yearly.0001.d: "Jsi odpuštěn, [scapegoat.GetFirstNameNoTooltip]. Stává se to."
 fp1_yearly.0011.t: "Volání po tom, aby byl [offensive_courtier.GetFirstNameNoTooltip] prohlášen nithingem"
 fp1_yearly.0011.desc: "Průvod významných místních z [capital_barony.GetNameNoTier] dnes prošel mou síní, každý s jedinečnou křivdou vůči mému [ROOT.Char.Custom2('RelationToMeShort',SCOPE.sC('offensive_courtier'))], [offensive_courtier.GetTitledFirstName].\n\nNěkteří si stěžují na [offensive_courtier.GetHerHis] chování, jiní na [offensive_courtier.GetHerHis] čest, ale všichni se shodují na jedné věci: [offensive_courtier.GetSheHe] je ostudou dvora.\n\nNeumyté masy požadují nic menšího než prohlášení nithinga a vyhnání [offensive_courtier.GetHerHim]."
 fp1_yearly.0011.desc.priest: "[priest.Custom2('MyCharacterIntroduction',ROOT.Char)|U] trvá na tom, že chování [offensive_courtier.GetHerHis] je #EMP vlastně#! docela pobožné, ale vrčící měšťané tvrdí, že [priest.GetFirstNameNoTooltip] prostě nemusí čelit následkům takové „ctnosti“."
 fp1_yearly.0011.a: "Mají pravdu, [offensive_courtier.GetSheHe] musí být zbaven práv a vyhnán!"
 fp1_yearly.0011.b: "Mají pravdu, [offensive_courtier.GetSheHe] musí být vyhnán!"
 fp1_yearly.0011.c: "Pěšáci! [offensive_courtier.GetFirstNameNoTooltip] je bez viny."
 fp1_yearly.0011.d: "Tohle není záležitost pro [ROOT.Char.GetTitleAsNameNoTooltip]..."
 fp1_yearly.0021.t: "Záležitost života a smrti"
 fp1_yearly.0021.desc.intro: "Nedávný spor mezi dvěma z mých $knight_culture_player_plural_no_tooltip_lowercase$, [first_knight.GetTitledFirstName] a [second_knight.GetTitledFirstName], se prudce vyostřil. Zjevně,"
 fp1_yearly.0021.desc.doggo: "[first_knight.GetFirstNameNoTooltip] omylem propíchl psa [second_knight.GetFirstNamePossessiveNoTooltip] při lovu [ROOT.Char.Custom('GetAnimalType')], a [second_knight.GetFirstNameNoTooltip] odmítá, aby [first_knight.GetFirstNameNoTooltip] prostě zaplatil za nového."
 fp1_yearly.0021.desc.spit_of_land: "[first_knight.GetFirstNameNoTooltip] koupil odlehlý kousek půdy, o který [second_knight.GetFirstNameNoTooltip] tvrdí, že patří [second_knight.GetHerHim]. Ten pozemek by byl k ničemu, nebylo by-li na něm údajně nejlepší zelí v celém [capital_barony.GetNameNoTierNoTooltip]."
 fp1_yearly.0021.desc.unrepeatable_insult: "začali si nadávat kvůli ničemu, a [first_knight.GetFirstNameNoTooltip] řekl něco neopakovatelného o [second_knight.GetFirstNameNoTooltip], koze a dobrém číši."
 fp1_yearly.0021.desc.escalating_prank_war: "začalo to jako nevinná soutěž o převahu, kdy si navzájem hráli stále divočejší žerty, a zábava se postupně proměnila v čistý hněv."
 fp1_yearly.0021.desc.religious_differences: "jde o prostý rozdíl ve víře, s [first_knight.GetFaith.GetAdherentName] a [second_knight.GetFaith.GetAdherentName] vzájemně proti sobě kvůli povaze božského."
 fp1_yearly.0021.desc.stolen_pig: "hlavním předmětem sporu je kolosální výstavní prase, které [first_knight.GetFirstNameNoTooltip] ukradl [second_knight.GetFirstNameNoTooltip]. Nebo naopak — upřímně, kvůli tomu křiku je to docela nejasné."
 fp1_yearly.0021.desc.defiled_longboat.woman: "[unfortunate_knight.GetFirstNameNoTooltip] přistihl [defiling_knight.GetFirstNameNoTooltip] #EMP užívajícího si#! [defiling_knight.GetHerselfHimself] s přídi [unfortunate_knight.GetFirstNamePossessiveNoTooltip] dlouhé lodi, zcela poničiv obě laky i kdysi děsivou auru."
 fp1_yearly.0021.desc.defiled_longboat: "[defiling_knight.GetFirstNameNoTooltip] #EMP užíval#! [defiling_knight.GetHerselfHimself] nemluvněným způsobem na každém sedadle [unfortunate_knight.GetFirstNamePossessiveNoTooltip] dlouhé lodi, nechávaje celé plavidlo #EMP páchnoucí#!."
 fp1_yearly.0021.desc.board_game: "hráli hru hnefatafl a dostali se do hádky ohledně přesných pravidel. Za pár minut byla deska odhozena a začaly létat pěsti."
 fp1_yearly.0021.desc.outro: "\n\nNyní se oba $knight_culture_player_plural_no_tooltip_lowercase$ veřejně vyzvali k holmgang. Souboj bude jistě dramatický, ale jako přísahající členové mé domácnosti potřebují mé svolení, aby v něm mohli pokračovat."
 fp1_yearly.0021.a: "Ať se kvůli tomu poperou, když chtějí."
 fp1_yearly.0021.a.tt_success: "[first_knight.GetFirstNameNoTooltip] vyhrává holmgang"
 fp1_yearly.0021.a.tt_failure: "[second_knight.GetFirstNameNoTooltip] vyhrává holmgang"
 fp1_yearly.0021.b: "Dětinské! Zakazuji to!"
 fp1_yearly.0021.b.tt_success: "Váš rozkaz vzbuzuje vyděšenou poslušnost"
 fp1_yearly.0021.b.tt_failure: "Vaši $knight_culture_player_plural_no_tooltip_lowercase$ souhlasí neochotně, ale posmívají se vám"
 fp1_yearly.0021.c: "Jistě, a ještě vsadím na [first_knight.GetFirstNameNoTooltip]."
 fp1_yearly.0021.c.tt_success: "$fp1_yearly.0021.a.tt_success$"
 fp1_yearly.0021.c.tt_failure: "$fp1_yearly.0021.a.tt_failure$"
 fp1_yearly.0021.d: "Samozřejmě, ale já budu sázet na [second_knight.GetFirstNameNoTooltip]."
 fp1_yearly.0021.d.tt_failure: "$fp1_yearly.0021.a.tt_success$"
 fp1_yearly.0021.d.tt_success: "$fp1_yearly.0021.a.tt_failure$"
 fp1_yearly.0031.t: "Přehnané historky u stolu"
 fp1_yearly.0031.desc.intro: "Byl to dlouhý, dlouhý večer ve společnosti [lying_warrior.GetFirstName]. Tulák se zastavil v [capital_barony.GetBaseNameNoTierNoTooltip] na noc a zaplatil za svůj pobyt vyprávěním příběhů o svých činech, které trvaly #EMP hodiny#!.\n\n"
 fp1_yearly.0031.desc.sunk_longboat: "„... takže tam jsem byl, uprostřed Severního moře, dlouhá loď se potápěla kvůli přílišnému krvavému plenění. No, nemohl jsem si to vzít s sebou, tak jsem skočil do vody a doplaval do Norska!“„"
 fp1_yearly.0031.desc.wrestled_whale: "„... věděl jsem, že buď musím opustit svou posádku, nebo sám zápasit s velrybou. Popadl jsem nůž, skočil do moře a sám přitáhl behem zápasu toho tvora na břeh!“„"
 fp1_yearly.0031.desc.charged_city_fruit_knife: "„... deset tisíc nepřátel tam bylo, ozbrojených šamšíry, a já byl ozbrojen jen malým nožíkem na loupání ovoce. #EMP Dokázal jsem to#!, díky svému věrnému nožíku na ovoce!“„"
 fp1_yearly.0031.desc.charged_city: "„... vrhl jsem se až ke městským hradebám, vylezl dovnitř a prodral se do královského paláce. Roztavil jsem královu korunu, abych zaplatil nové boty.“"
 fp1_yearly.0031.desc.kept_iceland_afloat: "„... a kdyby se ti dva obři skutečně #EMP do toho pustili#, Island by jistě znovu klesl do moře. Naštěstí jsem je od toho odradil, vážně.“"
 fp1_yearly.0031.desc.wooed_heir: "„... [disparaged_king.GetTitledFirstNamePossessive] [invented_heir.Custom('GetDaughterSon')], tohle #EMP teda#! bylo to nejlepší, co jsem kdy měl. [disparaged_king.GetTitledFirstNameNoTooltip] už potom moc mým fanouškem nebyl a já se rychle vytratil z [disparaged_king.GetHerHis] dvora, to vám řeknu!“„"
 fp1_yearly.0031.desc.hunted_troll: "„... samozřejmě, tato nejnovější rána je od samotného trolla. Velký jako dům, tichý jako myš, drápy jako bastardní potomstvo [lying_warrior.GetFaith.DevilName]. Přesto, když do něčeho dlouho a pořádně pícháš, umře to.“"
 fp1_yearly.0031.desc.outro: "\n\nPříběh za příběhem, sága pokračuje, každá anekdota delší a větší než ta předchozí."
 fp1_yearly.0031.a: "Ty prostě #EMP musíš#! zůstat na dvoře, [lying_warrior.GetFirstNameNoTooltip]!"
 fp1_yearly.0031.b: "To zní... neuvěřitelně."
 fp1_yearly.0031.b.tt_success: "[lying_warrior.GetFirstNamePossessiveNoTooltip] lži jsou odhaleny"
 fp1_yearly.0031.b.tt_failure: "[lying_warrior.GetFirstNameNoTooltip] tě slovně obehrává"
 fp1_yearly.0031.c: "Proslav naše pohostinnost na své další zastávce!"
 fp1_yearly.0041.t: "Průzkumníci z jihu"
 fp1_yearly.0041.desc: "[explorer.GetFirstName], průzkumník, učenec a posel od [sponsoring_liege.GetTitledFirstName] z [sponsoring_liege.GetPrimaryTitle.GetName], v poslední době projíždí mé kraje. Učený a zbožný [explorer.GetFaith.GetAdherentNameNoTooltip], [explorer.GetSheHe] vede podrobný deník svých zážitků a posílá nepravidelné dopisy zpět do své vlasti, aby referoval o životě na tomto okraji světa.\n\n[explorer.GetFirstNameNoTooltip] nyní dorazil do [capital_barony.GetNameNoTierNoTooltip] a žádá o povolení zastavit se na pár dní, aby pozoroval naše místní zvyky a pohovořil s našimi nejmoudřejšími starci.\n\nNavzdory formálnímu způsobu žádosti tón [explorer.GetFirstNamePossessiveNoTooltip] prakticky #EMP kape#! opovržením."
 fp1_yearly.0041.a: "Možná by [explorer.GetSheHe] mohl pozorovat některý z našich menších obřadů?"
 fp1_yearly.0041.a.tt_success: "Váš obřad imponuje [explorer.GetFirstNameNoTooltip]"
 fp1_yearly.0041.a.tt_failure: "Vaše pohanské zvyky [explorer.GetFirstNameNoTooltip] odpuzují"
 fp1_yearly.0041.b: "Pověz mi víc o tom... [explorer.GetFaith.HighGodName]?"
 fp1_yearly.0041.c: "Na #EMP mém#! dvoře nemáme místo pro nafoukané cizince."
 fp1_yearly.0051.t: "Nepokojní mrtví"
 fp1_yearly.0051.desc: "Smrt [draugr.GetTitledFirstNamePossessive] před nějakým časem nezůstala bez povšimnutí lidu [capital_county.GetNameNoTier]. Ať už [draugr.GetSheHe] byla jakákoli, [draugr.GetFirstNameNoTooltip] nebyl oblíbený u místního sedláckého lidu, a stalo se běžným, že každé zlo v zemi je obviňováno z chodícího těla [draugr.Custom('WomanManPossessive')].\n\nUž snad ani neuplyne týden, aby každý farmář, lesník a shrabovač hnoje v okolí hlavního města neplival na [draugr.GetFirstNamePossessiveNoTooltip] draugra.\n\n#EMP Něco#! musí být uděláno."
 fp1_yearly.0051.a: "Osobně navštívím hrobku [draugr.GetHerHis]."
 fp1_yearly.0051.a.tt: "Rozhodnete se vyšetřit to na vlastní oči..."
 fp1_yearly.0051.b: "Prostě vykopněte tělo a spalte ho."
 fp1_yearly.0051.b.body_destroyed: "Sedláci jásají"
 fp1_yearly.0051.b.list: "Rodina a přátelé [draugr.GetFirstNameNoTooltip]"
 fp1_yearly.0051.c: "Možná to vyřešíme ochranými kouzly?"
 fp1_yearly.0051.c.tt_success: "Vaše lektvary a rituály uklidní sedláky"
 fp1_yearly.0051.c.tt_failure: "Vaše rituály jsou nedostatečné"
 fp1_yearly.0061.t: "$fp1_yearly.0051.t$: Vlci"
 fp1_yearly.0061.desc: "Má družina a já sotva dorazili k hrobce [draugr.GetFirstNamePossessiveNoTooltip], když se zevnitř ozval první záchvat vrčení.\n\nKdyž se největší vlk, jakého jsem kdy viděl, protáhne tmavým vchodem, zbytek smečky jako by vyskočil ze země. Musí jich být tucet nebo víc, každý velký jako člověk, a už teď běží ze všech stran naplno.\n\nSedláci se pletli ohledně draugra, ale ne ohledně kletby!"
 fp1_yearly.0061.a: "Vojsko! Ke mně!"
 fp1_yearly.0061.a.tt_success: "Svoláte své muže a pobijete vlky!"
 fp1_yearly.0061.a.tt_failure: "Sotva uniknete se živou kůží"
 fp1_yearly.0061.b: "Utečte!"
 fp1_yearly.0062.t: "$fp1_yearly.0051.t$: Medvěd"
 fp1_yearly.0062.desc: "Hrobka [draugr.GetFirstNamePossessiveNoTooltip] je studená a ponurá. Ačkoli ani má družina ani já nevidíme žádné chodící tělo, na některých zdech jsou dlouhé, hluboké škrábance a na podlaze leží kosti dobytka.\n\nNáhlé šustění v rohu upoutá mou pozornost a to, co jsem bral za hromadu listí, se zvedá, odhalujíc největšího medvěda, kterého jsem kdy viděl, snad devět nebo deset loktů vysokého. Ospale na nás mrkne, působí téměř přátelsky.\n\nPak zařve."
 fp1_yearly.0062.a: "Udělám z tebe koberec!"
 fp1_yearly.0062.a.tt_success: "Srazíte tu bestii"
 fp1_yearly.0062.a.tt_failure: "Váš oddíl vás strhne od jisté smrti"
 fp1_yearly.0062.b: "$fp1_yearly.0061.b$"
 fp1_yearly.0063.t: "$fp1_yearly.0051.t$: Nithing"
 fp1_yearly.0063.desc: "Hrobka [draugr.GetFirstNamePossessiveNoTooltip] neobsahuje žádnou příšeru, žádné hrobové předměty ani dokonce mrtvolu. Krátké prohledání oblasti najde [draugr.GetFirstNameNoTooltip] převráceného v příkopu a hrubě přikrytého větvemi kousek dál.\n\nMísto toho se hrob zdá být přeměněn na primitivní obydlí, které nějaký darebák vzal z chladných rukou mrtvých.\n\nKdyž s družinou diskutujeme, co dělat, v dálce zaslechneme veselý pískot, který se blíží. Zloděj přichází!"
 fp1_yearly.0063.a: "Ticho! Přitiskněte se ke zdi!"
 fp1_yearly.0063.a.tt_success: "Past vychází"
 fp1_yearly.0063.a.tt_failure: "[draugr_nithing.GetFirstNameNoTooltip] si něco všimne a uteče"
 fp1_yearly.0063.a.tt_failure.draugr_nithing_escapes: "[draugr_nithing.GetFirstNameNoTooltip] se toulá divočinou a dál způsobuje potíže"
 fp1_yearly.0063.b: "Jaká ztráta mého prokletého času!"
 fp1_yearly.0064.t: "$fp1_yearly.0051.t$: Sirotek"
 fp1_yearly.0064.desc: "Sedláci možná trvali na tom, že chodící trup [draugr.GetFirstNamePossessiveNoTooltip] krade jejich jídlo, hexuje jejich dobytek a škrábe okna v noci, ale když dorazím k [draugr.GetHerHis] hrobce, najdu něco úplně jiného.\n\nUprostřed hnízda ukradených kožichů a nedojedeného jídla sedí osiřelé dítě, hledí na mě s očima širokými hrůzou."
 fp1_yearly.0064.a: "Jdi pryč, dítě. Tady zůstat nemůžeš."
 fp1_yearly.0064.a.tt: "[draugr_orphan.GetFirstNameNoTooltip] se vytrácí do divočiny..."
 fp1_yearly.0064.b: "Dítě nebo ne, do žaláře s tím zlodějem!"
 fp1_yearly.0064.c: "Pojď na dvůr, [Select_CString(draugr_orphan.IsFemale,'girl','boy')]: hrob není místo pro živé."
 fp1_yearly.0064.d: "Přeci... každé dítě si zaslouží [ROOT.Char.GetMotherFather]?"
 fp1_yearly.0065.t: "$fp1_yearly.0051.t$: Nakonec ticho"
 fp1_yearly.0065.desc: "Hrobka [draugr.GetFirstNamePossessiveNoTooltip] je taková, jaká byla, když ho pohřbili. Stejně tak každá jiná hrobka, kterou mě lidé nechali prohlédnout.\n\nNenašel jsem nic v žádné údajně prokleté jeskyni, trollím háji nebo obrovské skrýši: po několika týdnech začínám pochybovat, jak moc jsme si jistí, že takové příšery vůbec #EMP existují#!?\n\nAlespoň mi to prospělo."
 fp1_yearly.0065.a: "Možná to byl vítr?"
 fp1_yearly.0065.a.locals_grumble: "Sedláci jsou nespokojeni"
 fp1_yearly.0071.t: "Ve hlubokých místech světa"
 fp1_yearly.0071.desc.intro: "Sedláci z [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] jsou pověrčiví, často za mnou přicházejí se stížnostmi na kouzelníky, obrů a bohy v přestrojení.\n\nObvykle takové tvrzení ignoruji jako holé lidové představení, ale tentokrát přinášejí důkazy:"
 fp1_yearly.0071.desc.troll_type.bear: "malého sedláckého chlapce, jeho hlavu rozmačkanou na prach a kaši, a kvílející rodiče, kteří byli svědky jeho smrti."
 fp1_yearly.0071.desc.troll_type.wolf: "mrtvolu slavného lovce, hrudník roztrhaný na kusy, měkké srdcové maso snědené."
 fp1_yearly.0071.desc.troll_type.wolverine: "hromadu kostí a roztrhaných kousků masa, které podle nich nedávno patřily staré pračce."
 fp1_yearly.0071.desc.troll_type.lynx: "desetiny prasat zabitých, každé roztrhané příliš pečlivě pro neohrabané divoké zvíře, ale neomylně výsledkem drápů spíše než nože."
 fp1_yearly.0071.desc.troll_type.moose: "krvavé torzo ovce, jasně roztrhané, ale nesnídané, ba ani neohryzané, hrubě roztrhané drápy, jaké jsem nikdy neviděl."
 fp1_yearly.0071.desc.outro.loveli_lakes: "\n\nJen jsem se chystal prohlédnout ten zmatek, když krok vpřed učinil [loveli_lakes.GetTitledFirstName].\n\n„Tohle není troll, [ROOT.Char.GetFirstNameNoTooltip], tohle je dílo divokého møøse! Znám tu bestii dobře, včetně jejího hnusného kousnutí, a vyryl bych svůj znak do jejího těla.“"
 fp1_yearly.0071.desc.outro.fallback: "\n\nMístní trvají na tom, že je to nic menšího než dílo trolla, a požadují, abych prohledal blízké lesy a zlikvidoval tu příšeru."
 fp1_yearly.0071.a: "Sám tu bestii zabiju!"
 fp1_yearly.0071.a.tt: "Vyrazíte s bandou bojovníků"
 fp1_yearly.0071.b: "[marshal.GetTitledFirstNameNoTooltip], postarej se o to."
 fp1_yearly.0071.b.tt_success: "Váš maršál a jeho oddíly bestii dopadnou"
 fp1_yearly.0071.b.tt_failure: "Bestie unikne [marshal.GetFirstNameNoTooltip]"
 fp1_yearly.0071.c: "Zní to jako medvěd. Vyřiďte to sami, zbabělci."
 fp1_yearly.0081.hunt_invalidated: "Lov na trolla z [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] ustává"
 fp1_yearly.0081.hunt_invalidated.tt: "Nepředvídané okolnosti odvádějí vaši pozornost"
 fp1_yearly.0081.desc.prelude: "Lesy tiše šeptají, když kráčíme dál, objímají mou malou družinu stínem. Myslím si, že je to jen vítr, ale někteří říkají, že trollové zpívají jako vítr, když jsou sami...\n\nNěkolik zmizení se stalo u této mýtiny, což z ní dělá pravděpodobné ležení bestie. Aspoň to tvrdí místní.\n\n"
 fp1_yearly.0081.desc.finisher: "Není to troll, ale stále je to náš úlovek!"
 fp1_yearly.0081.t: "$fp1_yearly.0071.t$: Obří smrt"
 fp1_yearly.0081.desc: "$fp1_yearly.0081.desc.prelude$Pokřikující hrůzné zavrčení se rozezní v háji a něco, co jsem bral za balvan, se postaví do výšky a odhalí se jako skutečně #EMP obří#! medvěd.\n\n$fp1_yearly.0081.desc.finisher$"
 fp1_yearly.0081.a: "Ať tě smrt vezme, příšero!"
 fp1_yearly.0081.a.tt_success: "Zabijete medvěda"
 fp1_yearly.0081.a.tt_failure: "Medvěd vás roztrhá napůl"
 fp1_yearly.0081.b: "#BER RAAAAARGH!#!"
 fp1_yearly.0081.b.tt: "Roztrháte bestii napůl v berserkové zuřivosti"
 fp1_yearly.0081.c: "Nahoru, #EMP vzhůru#! a do toho, vy vlci z [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]!"
 fp1_yearly.0081.c.tt_success: "Inspirováte své vojáky k zabití medvěda"
 fp1_yearly.0081.c.tt_failure: "Bestie vás zraní a uteče"
 fp1_yearly.0081.c.tt_failure.tt: "Utrpíte #warning TRVALÉ#! vážné zranění"
 fp1_yearly.0081.d: "#EMP UTÍKEJTE!#!"
 fp1_yearly.0082.t: "$fp1_yearly.0071.t$: Rychlá smrt"
 fp1_yearly.0082.desc: "$fp1_yearly.0081.desc.prelude$Za námi se ozve děsivý pokřik, zvuk tlumených kroků, a pak někdo vzadu vykřikne. Otočím se právě včas, abych uhnul před obrovským vlkem, srst posetá stříbrem stáří a krvavá, když přeběhne. $fp1_yearly.0081.desc.finisher$"
 fp1_yearly.0082.a: "$fp1_yearly.0081.a$"
 fp1_yearly.0082.a.tt_success: "Zabijete vlka"
 fp1_yearly.0082.a.tt_failure: "Vlk vám roztrhá hrdlo"
 fp1_yearly.0082.b: "$fp1_yearly.0081.b$"
 fp1_yearly.0082.b.tt: "$fp1_yearly.0081.b.tt$"
 fp1_yearly.0082.c: "Svolat! Utvořte kruh!"
 fp1_yearly.0082.c.tt_success: "Chytíte vlka do pasti, zatlačíte ho a zabijete"
 fp1_yearly.0082.c.tt_failure: "$fp1_yearly.0081.c.tt_failure$"
 fp1_yearly.0082.c.tt_failure.tt: "$fp1_yearly.0081.c.tt_failure.tt$"
 fp1_yearly.0082.d: "$fp1_yearly.0081.d$"
 fp1_yearly.0083.t: "$fp1_yearly.0071.t$: Zběsilá smrt"
 fp1_yearly.0083.desc: "$fp1_yearly.0081.desc.prelude$První věc, co spatříme, je, jak přede mnou vojákovi trhá hrdlo: rychlá koule srsti a zubů sotva větší než pes, ale rychlejší než padající meč. Zuřivý rosomák! $fp1_yearly.0081.desc.finisher$"
 fp1_yearly.0083.a: "$fp1_yearly.0081.a$"
 fp1_yearly.0083.a.tt_success: "Zlikvidujete rosomáka"
 fp1_yearly.0083.a.tt_failure: "Rosomák vám roztrhá vnitřnosti"
 fp1_yearly.0083.b: "$fp1_yearly.0081.b$"
 fp1_yearly.0083.b.tt: "$fp1_yearly.0081.b.tt$"
 fp1_yearly.0083.c: "Blízko je lovecká chatrč, ustupte pro pomoc!"
 fp1_yearly.0083.c.tt_success: "Přilákáte ho ke chatrči a přemůžete ho počtem"
 fp1_yearly.0083.c.tt_failure: "$fp1_yearly.0081.c.tt_failure$"
 fp1_yearly.0083.c.tt_failure.tt: "$fp1_yearly.0081.c.tt_failure.tt$"
 fp1_yearly.0083.d: "$fp1_yearly.0081.d$"
 fp1_yearly.0084.t: "$fp1_yearly.0071.t$: Tichá smrt"
 fp1_yearly.0084.desc: "$fp1_yearly.0081.desc.prelude$Ztuhnu. Nějak nás nezaslechl, ale mohu sotva rozeznat přikrčenou postavu rysa na druhé straně mýtiny. Ještě jeden neopatrný krok a byl by to můj poslední. $fp1_yearly.0081.desc.finisher$"
 fp1_yearly.0084.a: "$fp1_yearly.0081.a$"
 fp1_yearly.0084.a.tt_success: "Zabijete rysa"
 fp1_yearly.0084.a.tt_failure: "Rys vám zlomek krk"
 fp1_yearly.0084.b: "$fp1_yearly.0081.b$"
 fp1_yearly.0084.b.tt: "$fp1_yearly.0081.b.tt$"
 fp1_yearly.0084.c: "Ticho! Vy dva, obkličte ho, vyhneme ho k vám..."
 fp1_yearly.0084.c.tt_success: "Přelstíte a přeženete rysa"
 fp1_yearly.0084.c.tt_failure: "$fp1_yearly.0081.c.tt_failure$"
 fp1_yearly.0084.c.tt_failure.tt: "$fp1_yearly.0081.c.tt_failure.tt$"
 fp1_yearly.0084.d: "$fp1_yearly.0081.d$"
 fp1_yearly.0085.t: "$fp1_yearly.0071.t$: Zuřící smrt"
 fp1_yearly.0085.desc.loveli_lakes: "S [loveli_lakes.GetTitledFirstName] v čele to není daleko do lesa, kde bestie sídlí.\n\nKéž bychom měli štěstí ji chytit spící, ale to se nestane, a titánská, zběsilá příšera se postaví, dvakrát vyšší než [ROOT.Char.GetWomanMan].\n\nDech má nepravidelný, oči se převalí s násilným šílenstvím, kopyta dupou.\n\nPak se rozběhne."
 fp1_yearly.0085.desc.fallback: "$fp1_yearly.0081.desc.prelude$ Ticho Prask a v mýtině vybuchne obrovitý, zběsilý los, dvakrát vyšší než [ROOT.Char.GetWomanMan], s pěnícími nozdrami. $fp1_yearly.0081.desc.finisher$"
 fp1_yearly.0085.a: "$fp1_yearly.0081.a$"
 fp1_yearly.0085.a.tt_success: "Probodnete losa"
 fp1_yearly.0085.a.tt_failure: "Los vás rozdrtí na kousky"
 fp1_yearly.0085.b: "$fp1_yearly.0081.b$"
 fp1_yearly.0085.b.tt: "$fp1_yearly.0081.b.tt$"
 fp1_yearly.0085.c: "Slabé místo u zátylku! Pouze kopí a luky!"
 fp1_yearly.0085.c.tt_success: "Usmrtíte losa, aniž by vás přejel"
 fp1_yearly.0085.c.tt_failure: "$fp1_yearly.0081.c.tt_failure$"
 fp1_yearly.0085.c.tt_failure.tt: "$fp1_yearly.0081.c.tt_failure.tt$"
 fp1_yearly.0085.d: "$fp1_yearly.0081.d$"
 fp1_yearly.0091.t: "Plavidlo hodné [ROOT.Char.GetTitleAsNameNoTooltip]"
 fp1_yearly.0091.desc: "Dlouhá loď [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] hodně vypovídá o [ROOT.Char.GetHerHim]. Říká, jak bohatý [ROOT.Char.GetSheHe] je, jak úspěšný, jaký obraz chce [ROOT.Char.GetSheHe] vysílat do světa.\n\nKoukám na své současné plavidlo a shledávám ho... nedostatečným. Aby mi to zdůraznilo, ulomí se kus ráhna s prasknutím a celé plavidlo zlověstně vrže, jak se přenastavuje napětí.\n\nObjednat novou loď je jednoduché, ale stačí prostá náhrada? Nezasloužím si plavidlo, které světu řekne něco o #EMP mně#!?"
 fp1_yearly.0091.a: "Leviatan, aby nesl mé kořisti!"
 fp1_yearly.0091.b: "Monstrum, aby zastrašilo mé vazaly!"
 fp1_yearly.0091.c: "Drak, nechť vyřve mé jméno!"
 fp1_yearly.0091.d: "Nemám potřebu nákladné lodi."
 fp1_yearly.0101.t: "Hra hádanek"
 fp1_yearly.0101.desc: "Hádanky jsou oblíbenou zábavou mezi [ROOT.Char.GetCulture.GetNameNoTooltip]. Dva nebo více hráčů si vyměňují stále těžší problémy, často rýmované a plné alegorií či mýtů.\n\nJednoho zvlášť dlouhého, líného dne mě [riddler.Custom2('MyCharacterIntroduction',ROOT.Char)] vyzval ke hře, za přítomnosti, která musela zahrnovat polovinu dvora."
 fp1_yearly.0101.a: "Zkoušíš #EMP mé#! řečnické umění? To bude zábava!"
 fp1_yearly.0101.a.tt_success: "Vyhráváte hru"
 fp1_yearly.0101.a.tt_failure: "[riddler.GetFirstNameNoTooltip] vás porazí"
 fp1_yearly.0101.a.every_courtier_and_guest: "Každý [courtier|E] a [guest|E]"
 fp1_yearly.0101.b: "Myslím, že jsem přečetl pár knih o hádankách..."
 fp1_yearly.0101.c: "Nejprve: kdo nemá mozek a jde do žaláře?"
 fp1_yearly.0101.c.tt: "Lidé si možná zapamatují tvou přehnanou reakci..."
 fp1_yearly.0101.c.tt_nickname: "Vaši dvořané šeptají za vašimi zády..."
 fp1_yearly.0101.d: "Díky, ale jsem [ROOT.Char.GetTitleAsNameNoTooltip], a mám co dělat."
 fp1_yearly.0111.t: "Prokletý"
 fp1_yearly.0111.desc.intro: "[accursed.GetTitledFirstName] mlčí, zatímco obcházím totem z koňské kůže stojící proti [accursed.GetHerHis] komnatám, prohlížím ho ze všech stran. [accursed.GetSheHe|U] má pravdu, je to rozhodně nithing pole, #EMP mocná#! kletba, která ohrožuje samotný život [accursed.GetHerHis].\n\nRuny vyryté do jeho násady"
 fp1_yearly.0111.desc.skill.intrigue_high: "jsou #color_blue_gray složité a květnaté, slibují zvrácený, bolestivý konec#!."
 fp1_yearly.0111.desc.skill.learning_high: "jsou #color_blue_gray hluboké a potřísněné krví, očividně vytvořené učeným kouzelníkem#!."
 fp1_yearly.0111.desc.skill.intrigue_low: "jsou #color_blue_gray kruté, ale klikaté, jako by krvavé myšlenky ničemy bloudily#!."
 fp1_yearly.0111.desc.skill.learning_low: "jsou #color_blue_gray ve špatném stavu a nasáklé krví, znamení amatérského kouzelníka#!."
 fp1_yearly.0111.desc.skill.fallback: "jsou #color_blue_gray nerozluštitelné#!."
 fp1_yearly.0111.desc.first_connector: "Samotný text kletby"
 fp1_yearly.0111.desc.trait_1.lazy_or_arbitrary: "naznačuje #color_blue_gray nerozhodnost a lenost#!,"
 fp1_yearly.0111.desc.trait_1.wrathful_or_impatient: "je #color_blue_gray vroucí neklidným hněvem#!,"
 fp1_yearly.0111.desc.trait_1.calm_or_patient: "je #color_blue_gray téměř děsivě klidný a záludný#!,"
 fp1_yearly.0111.desc.trait_1.sadistic_or_arrogant: "naznačuje #color_blue_gray veliké ego nebo děsivou představivost#!,"
 fp1_yearly.0111.desc.trait_1.callous_or_ambitious: "naznačuje #color_blue_gray totální lhostejnost k jiným lidem#!,"
 fp1_yearly.0111.desc.trait_1.deceitful_or_craven: "se #color_blue_gray opakovaně zamotává a vrací sám do sebe#!,"
 fp1_yearly.0111.desc.trait_1.brave_or_trusting: "je #color_blue_gray odvážný a nápadný, přesvědčený o své spravedlnosti#!,"
 fp1_yearly.0111.desc.trait_1.paranoid_or_vengeful: "je #color_blue_gray naplněný zcela osobní nenávistí#!,"
 fp1_yearly.0111.desc.trait_1.fallback: "je #color_blue_gray náhodný zmatek#!,"
 fp1_yearly.0111.desc.second_connector: "končící na tónu"
 fp1_yearly.0111.desc.trait_2.lazy_or_arbitrary: "který je #color_blue_gray poněkud špatně vysvětleným zklamáním#!."
 fp1_yearly.0111.desc.trait_2.wrathful_or_impatient: "z #color_blue_gray zběsile načmáraného hněvu#!."
 fp1_yearly.0111.desc.trait_2.calm_or_patient: "z #color_blue_gray děsivé nevyhnutelnosti#!."
 fp1_yearly.0111.desc.trait_2.sadistic_or_arrogant: "z #color_blue_gray děsivého génia#!."
 fp1_yearly.0111.desc.trait_2.callous_or_ambitious: "z #color_blue_gray brutální, lhostejné konečnosti#!."
 fp1_yearly.0111.desc.trait_2.deceitful_or_craven: "z #color_blue_gray zvrácené zbabělosti#!."
 fp1_yearly.0111.desc.trait_2.brave_or_trusting: "z #color_blue_gray přímé jistoty v [accursed.GetFirstNamePossessiveNoTooltip] zkázu#!."
 fp1_yearly.0111.desc.trait_2.paranoid_or_vengeful: "který #color_blue_gray obviňuje [accursed.GetFirstNameNoTooltip] z [accursed.GetHerHis] zkázy#!."
 fp1_yearly.0111.desc.trait_2.fallback: "z #color_blue_gray antiklimaxu#!."
 fp1_yearly.0111.desc.outro: "\n\nNemáme žádné svědky ani žádné #color_blue_gray důkazy#! kromě samotného kletbového kůlu."
 fp1_yearly.0111.tt.correct_guess: "Pokud je vaše domněnka správná"
 fp1_yearly.0111.tt.wrong_guess: "Pokud se mýlíte"
 fp1_yearly.0111.tt.correct_accusation: "Najdete dostatek důkazů o vině [culprit.GetFirstNamePossessiveNoTooltip]"
 fp1_yearly.0111.tt.correct_accusation.tt: "[accursed.GetTitledFirstName] je zbaven kletby a navždy vděčný"
 fp1_yearly.0111.tt.false_accusation: "Vaše obvinění se ukážou jako bezdůvodná"
 fp1_yearly.0111.tt.false_accusation.tt: "[accursed.GetTitledFirstName] je [Select_CString(accursed.IsFemale,'přesvědčena','přesvědčen')], že [accursed.GetHerHis] konec brzy přijde bolestivě"
 fp1_yearly.0111.a: "To zavání [suspect_a.GetTitledFirstNameNoTooltip]!"
 fp1_yearly.0111.b: "Možná... [suspect_b.GetTitledFirstNameNoTooltip]..."
 fp1_yearly.0111.c: "Zdá se, že [suspect_c.GetTitledFirstNameNoTooltip]."
 fp1_yearly.0111.d: "[accursed.GetFirstNameNoTooltip], nevidíš, že je to všechno jen v tvé hlavě?"
 fp1_yearly.0111.d.tt_success: "Uklidníte [accursed.GetFirstName]"
 fp1_yearly.0111.d.tt_failure: "[accursed.GetSheHe|U] prodělá psychický zlom"
 fp1_yearly.0111.e: "Nebojte se, mám protikouzlo!"
 fp1_yearly.0501.t: "Na plavbě"
 fp1_yearly.0501.desc: "Existuje mnoho důvodů, proč plout po vodách poblíž [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] v době míru: ukázat sílu, odradit piráty, nebo prostě chytat ryby či si užít mořský vánek.\n\nJsme na takové malicherné plavbě, když v dálce zahlédnu místní loď, jak zápasí o přežití.\n\nI odsud je jasné, že utrpěla škody při nájezdu; posádka ji sotva udržuje na hladině, vylévají vodu stříbrnými poháry a keramickými mísami. Pohled by byl komický, kdyby nebyl tak vážný."
 fp1_yearly.0501.a: "Zastavte a pokuste se jim pomoci!"
 fp1_yearly.0501.a.tt_success: "Zachráníte posádku"
 fp1_yearly.0501.a.tt_failure: "Loď se potopí se všemi na palubě"
 fp1_yearly.0501.b: "Můžeme si nechat kořist, když zabijeme přeživší..."
 fp1_yearly.0501.b.tt_success: "Snadno dobýváte loď"
 fp1_yearly.0501.b.tt_failure: "Přeživší se proplíží na břeh"
 fp1_yearly.0501.c: "Jen projedeme kolem."
 fp1_yearly.0511.t: "Smrad úspěchu"
 fp1_yearly.0511.desc: "#EMP Ten smrad je naprosto nesnesitelný#!.\n\nUž je tomu přes měsíc, co [stinker.GetFirstName] skolil toho zatraceného [ROOT.Char.Custom('GetAnimalType')] při lovu, a [stinker.GetSheHe] #EMP pořád#! nosí jeho hlavu napěchovanou larvami s sebou.\n\nVšichni v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] jsou z toho unavení, ale [stinker.GetSheHe] odmítá toho prokletého tvoru zahodit.\n\nZbytek dvora to očividně už nemohl snést a donutil [stinker.GetHerHim], aby přišel za mnou pro rozsudek."
 fp1_yearly.0511.a: "Je to moc hezké, [stinker.GetFirstNameNoTooltip]. Opravdu, velmi moc hezké."
 fp1_yearly.0511.b: "Za [ROOT.Char.GetFaith.HighGodName], [ROOT.Char.GetFaith.HealthGodName] a [ROOT.Char.GetFaith.HouseholdGodName] taky — #EMP zbavte se toho#!"
 fp1_yearly.0511.c: "$fp1_berserk_roar_evtopt$"
 fp1_yearly.0511.d: "Co kdybychom ti zítra večer pořídili #EMP nový#! trofej?"
 fp1_yearly.0511.e: "Ano, [stinker.GetFirstNameNoTooltip], je to odporné. Teď prosím odejdi."
 fp1_yearly.0521.t: "Krev na sněhu"
 fp1_yearly.0521.desc: "Najednou to přijde odnikud a trefí mě přímo do spánku. Ani jsem neviděl, jak projektil letí, natož abych se mu pokusil vyhnout, a na okamžik se zakolébám, oslněn.\n\nOstré chichotání zazní za mnou a prudce se ohlédnu.\n\n[child.GetFirstName] vyskočí ze svého úkrytu, v zlomyslné malé ručce už drží další sněhovou kouli."
 fp1_yearly.0521.a: "Paráda! Pojď sem, ty malý rošťáku!"
 fp1_yearly.0521.a.tt: "Vy a [child.GetFirstNameNoTooltip] házíte sněhové koule, až vám zmrznou konečky prstů"
 fp1_yearly.0521.b: "#EMP Ó! Ne! Trafili jste mě!#!"
 fp1_yearly.0521.b.tt: "Necháte [child.GetFirstNameNoTooltip], aby vás házel sněhovými koulemi do sytosti"
 fp1_yearly.0521.c: "Myslíš, že se můžeš postavit #EMP mně#! ve #EMP sněhové válce#!?"
 fp1_yearly.0521.c.tt: "Nezáleží, že je to dítě, toto je bitva a vy hodláte zvítězit!"
 fp1_yearly.0521.c.tt_success: "Úspěšně porazíte dítě"
 fp1_yearly.0521.c.tt_failure: "[child.GetFirstNameNoTooltip] vás porazí"
 fp1_yearly.0521.d: "Nazýváš to přepadením? #EMP Skutečná#! strategie vyžaduje #EMP důmysl#!!"
 fp1_yearly.0521.d.tt: "Snadno vyhrajete sněhovou bitvu"
 fp1_yearly.0521.e: "$fp1_berserk_roar_evtopt$"
 fp1_yearly.0521.e.tt: "Sněhová koule zapálí vaši besnou zuřivost"
 fp1_yearly.0521.f: "Teď nemám čas, [child.GetFirstNameNoTooltip]. Jdi obtěžovat někoho jiného."
 fp1_yearly.0531.t: "Rodina [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] na ledu"
 fp1_yearly.0531.desc: "„[ROOT.Char.Custom('GetMaPa')|U]!“, vykřikne [child.GetFirstName], táhnouc mě za rukáv téměř hned, jak vkročíme na rybník. „To nemá cenu, jsem k ničemu. Neumím bruslit, led mě nenávidí.“\n\nRychlý pohled naznačuje, že by mohl mít pravdu: místo vypadá, jako by tudy prošla armáda, vzhledem k množství rozbitého ledu, které moje [child.Custom('GetDaughterSon')] zanechalo za sebou."
 fp1_yearly.0531.a: "To je snadné! Tady, nech mě ti to vysvětlit..."
 fp1_yearly.0531.a.tt_success: "[child.GetFirstNameNoTooltip] získává sebevědomí a rovnováhu"
 fp1_yearly.0531.a.tt_failure: "Ještě více frustrujete [child.GetHerHim]"
 fp1_yearly.0531.b: "Nejsou tu sluhové, které bys mohl otravovat?"
 fp1_yearly.0531.c: "Běž si hrát dovnitř, nastydneš."
 fp1_yearly.0541.t: "Bestie z [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 fp1_yearly.0541.desc: "„Můj [ROOT.Char.GetTitleAsNameNoTooltip],“ zadýchá se [courtier.GetTitledFirstName], když ke mně přistoupí a táhne mého [child.Custom('GetDaughterSon')] [child.GetFirstName] za ucho.\n\n„To prokleté dítě číhá u rohů, obléká si kůži [ROOT.Char.Custom('GetAnimalType')] jako kostým a pak vyskočí s výkřikem a vyděsí lidi k smrti!“"
 fp1_yearly.0541.a: "To je, upřímně, prostě zatraceně legrační."
 fp1_yearly.0541.b: "[child.GetFirstNameNoTooltip], budeš potrestán."
 fp1_yearly.0541.c: "Šikanuješ #EMP mé#! [child.Custom('GetDaughterSon')]? Jsi vyloučen!"
 fp1_yearly.0541.d: "Opravdu mi je #EMP hluboce#! jedno."
 fp1_yearly.0551.t: "Podezřelá záležitost s rybami"
 fp1_yearly.0551.desc: "Začalo to jako občasné zpestření. Neobvyklý zvyk, ale jsem dobrý [ROOT.Char.GetCulture.GetNameNoTooltip][ROOT.Char.GetWomanMan] a který [ROOT.Char.GetCulture.GetNameNoTooltip][ROOT.Char.GetWomanMan] by si v mládí nedal špatnou sledě?\n\nZa poslední týdny se však [antisocialite.GetTitledFirstNamePossessive] záliba v naprosto #EMP shnilých#! rybách změnila z snesitelné zvláštnosti v pronikavou všudypřítomnost.\n\nDnes ráno, když jsem objevil, co [antisocialite.GetSheHe] udělal s latrínou, rozhodl jsem se, že už toho bylo dost. Našel jsem [antisocialite.GetHerHim] v síni, s tváří promočenou smrdutou slanou vodou, s půlkou rybího oka líně stékajícího po [antisocialite.GetHerHis] bradě."
 fp1_yearly.0551.a: "Sedni, [antisocialite.GetFirstNameNoTooltip]. Musíme si promluvit."
 fp1_yearly.0551.a.tt_success: "Přesvědčivě prosadíte svůj názor"
 fp1_yearly.0551.a.tt_failure: "[antisocialite.GetFirstNameNoTooltip] je neskutečně [Select_CString(antisocialite.IsFemale,'uražená','uražený')]"
 fp1_yearly.0551.b: "Možná bych prostě mohl přestěhovat své komnaty?"
 fp1_yearly.0551.b.tt: "[antisocialite.GetFirstNameNoTooltip] bude dál zapáchat celé místo"
 fp1_yearly.0551.b_alt: "Máš... máš toho ještě víc?"
 fp1_yearly.0551.b_alt.tt: "Vy a [antisocialite.GetFirstNameNoTooltip] společně zasmradíte místo"
 fp1_yearly.0551.c: "Víš co? Do žaláře. #EMP Hned teď#!"
 fp1_yearly.0551.d: "Jaká škoda, zdá se, že moje pozornost je #EMP jinde, daleko pryč#!."
 fp1_yearly.0561.t: "Paže proti paži"
 fp1_yearly.0561.desc: "„Co říkáš, [ROOT.Char.GetFirstNameNoTooltip]?“ řízne [knight.Custom2('MyCharacterIntroduction', ROOT.Char)] mezi doušky ze své korbele. Ten [knight.Custom('GetYoungMiddleAgedOld')] [knight.GetWomanMan] hrdě předvádí svaly.\n\n„Myslíš, že mě porazíš v zápase na paže? Tak pojď, do tří.“\n\nMoje lžíce se zastaví na cestě k ústům a krčma vybuchne drzými výkřiky a jásotem, nižší členové mého doprovodu jsou dychtiví být u toho."
 fp1_yearly.0561.a: "Vyzýváš mě?"
 fp1_yearly.0561.a.tt_success: "Porazíte [knight.GetFirstNameNoTooltip]"
 fp1_yearly.0561.a.tt_failure: "[knight.GetFirstNameNoTooltip] vyhraje."
 fp1_yearly.0561.b: "#EMP *prasknutí kloubů*#!"
 fp1_yearly.0561.b.tt: "Snadno vyhrajete tři zápasy v řadě"
 fp1_yearly.0561.c: "Jistě, znám pár triků..."
 fp1_yearly.0561.c.tt_success: "Podfukem dosáhnete dramatického vítězství"
 fp1_yearly.0561.c.tt_failure: "[knight.GetFirstNameNoTooltip] odhalí váš podvod."
 fp1_yearly.0561.d: "[knight.GetFirstNameNoTooltip], právě jím. Jdi otravovat někoho jiného."
 fp1_yearly.0571.t: "Drobný vandalismus"
 fp1_yearly.0571.desc: "„[ROOT.Char.GetTitledFirstNameNoTooltip]!“, křičí [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)]. Za [courtier.GetHerHim] ten [courtier.GetWomanMan] táhne mého [child.Custom('GetDaughterSon')] [child.GetFirstName], oba tak zaujatí škleběním jeden na druhého, že se sotva dívají na mě.\n\n„Tohle dítě bylo přistiženo při poškozování tvého runového kamene v [vandal_site.GetNameNoTier], malovalo pohlavní orgány na wyrmy a rýpalo sprostoty místo nápisů.“"
 fp1_yearly.0571.a: "Nech [child.Custom('GirlBoy')] u mě, promluvím si s [child.GetHerHim]."
 fp1_yearly.0571.tt_success: "[child.GetFirstNameNoTooltip] pochopí svou chybu."
 fp1_yearly.0571.tt_failure: "[child.GetFirstNameNoTooltip] nechápe, kde je problém"
 fp1_yearly.0571.b: "Pokutu na opravy zaplatíš ze #EMP svých#! věcí, [child.GetFirstNameNoTooltip]!"
 fp1_yearly.0571.b.tt: "Runový kámen je opraven"
 fp1_yearly.0571.b.2: "Dobře, zaplatím to."
 fp1_yearly.0571.c: "[child.GetSheHe|U] je jen dítě, [courtier.GetFirstNameNoTooltip], uklidni se."
 fp1_yearly.0581.t: "Až vyrostu"
 fp1_yearly.0581.desc.intro: "Ostrá bolest vzadu na lýtku je doprovázena příšerným výkřikem zpoza mě. Otočím se, připraven bránit se, a stojím proti maličkému tělu [child.GetFirstName], které drží těžký dřevěný klacek jako zbraň."
 fp1_yearly.0581.desc.victim: "Za [child.GetHerHim] se šklebí [victim.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 fp1_yearly.0581.desc.outro: "\n\n„Boj se mě! Hrozný Viking [child.GetFirstNameNoTooltip] přišel pro tvé zlato a tvé mnichy!“, křičí můj [child.Custom('GetDaughterSon')], a uštědří mi ránu do kolena. [child.GetHerHis|U] plechová přilba sklouzne přes oči, takže vidím jen škleb s vykousnutým zubem, který se na mě dívá.\n\n„[ROOT.Char.Custom('GetMaPa')|U], můžu být, až vyrostu, [child.Custom('ShieldPersonFemaleMale')]?“"
 fp1_yearly.0581.a: "Mé dítě, ty způsobíš, že se svět sám #EMP zachvěje#!."
 fp1_yearly.0581.a.tt: "[child.GetFirstNameNoTooltip] má výrazně vyšší pravděpodobnost stát se [GetTrait('shieldmaiden').GetName(child.Self)]"
 fp1_yearly.0581.b: "Ušlechtilý cíl! Pusť se do toho, darebáku!"
 fp1_yearly.0581.b.tt: "$fp1_yearly.0581.a.tt$"
 fp1_yearly.0581.c: "Možná, pokud se prokážeš proti [victim.GetFirstNameNoTooltip]..."
 fp1_yearly.0581.d: "Přestaň mě obtěžovat hloupými sny."
 fp1_yearly.0581.e: "Ha! Uvidíme, maličký."
 fp1_yearly.0591.t: "Vyhrocené hlasy na tingovém setkání"
 fp1_yearly.0591.desc: "Tingová setkání jsou nezbytná povinnost pro každého slušného [ROOT.Char.GetTitleAsNameNoTooltip], kdy se sem sjíždějí všichni svobodní [dummy_gender.GetWomenMen] z oblasti, aby projednali místní záležitosti, trhy a rvli se o jedny či druhé výsady.\n\nJak je u tak velkých shromáždění očekáváno, často se věci vyhrocují a tento ting není výjimkou.\n\nSnažím se mezi vším křikem zachytit detaily, ale zdá se, že [dummy_gender.GetWomenMen] z [county_a.GetNameNoTier]"
 fp1_yearly.0591.desc.border_dispute: "hádají se o vesnici na hranici s [county_b.GetNameNoTier], obě skupiny si nárokují tu půdu."
 fp1_yearly.0591.desc.stolen_flocks: "obviňují významného magnáta z [county_b.GetNameNoTier], že jim ukradl stáda."
 fp1_yearly.0591.desc.kidnapped_child: "křičí na své protějšky z [county_b.GetNameNoTier], že údajně unesli dítě."
 fp1_yearly.0591.desc.drunken_arson: "popírají svou vinu v sérii opilých požárů v [county_b.GetNameNoTier]."
 fp1_yearly.0591.desc.lost_dog: "tvrdí, že vesnického ikonického psa ukradli žárliví výrostci z [county_b.GetNameNoTier]."
 fp1_yearly.0591.desc.disrupted_wedding: "žádají odškodnění za svatbu, kterou zkazili opilí hosté z [county_b.GetNameNoTier]."
 fp1_yearly.0591.desc.suspicious_will: "trvají na platnosti závěti, která jim zanechává velké pásy půdy v [county_b.GetNameNoTier]."
 fp1_yearly.0591.desc.sheltered_criminal: "dali útočiště zločinci z [county_b.GetNameNoTier]."
 fp1_yearly.0591.desc.bad_luck: "křičí, že byli očarováni a prokleti kouzelníky z [county_b.GetNameNoTier]."
 fp1_yearly.0591.desc.fly_tipping: "tvrdohlavě popírají, že odhodili odpadky města na hranici s [county_b.GetNameNoTier]."
 fp1_yearly.0591.a: "Lidé z [county_a.GetNameNoTierNoTooltip] mají pravdu."
 fp1_yearly.0591.b: "[county_b.GetNameNoTierNoTooltip] má mou podporu!"
 fp1_yearly.0591.c: "Vezmou slušní [county_a.GetNameNoTierNoTooltip][dummy_gender.GetWomenMen] toto od #EMP [county_b.GetNameNoTierNoTooltip]#!?"
 fp1_yearly.0591.d: "Nakonec se všichni unaví."
 fp1_yearly.0601.t: "Nejtěžší část panování"
 fp1_yearly.0601.desc: "Podstatou tingů je, že mohou být #EMP extrémně#! nudné.\n\nJestli se výbušnosti neprojeví a nikdo se moc nerozčílí, je to jen dlouhý seznam nízko postavených svobodných [dummy_gender.GetWomenMen], kteří probírají drobné záležitosti a stojí v dešti. Přesto, jako [ROOT.Char.GetTitleAsNameNoTooltip], musím být přítomen.\n\nS každou sekundou stárnu.\n\nSleduju, jak se [dummy_gender.GetWomenMen] z [county.GetNameNoTier] dokážou do smrti přehánět v debatách.\n\nPřeju si válku, která mě zachrání z tohoto živoucího pekla."
 fp1_yearly.0601.a: "Musím. Zůstat. Vzhůru."
 fp1_yearly.0601.a.tt_success: "Překonáte to a zůstanete klidní"
 fp1_yearly.0601.a.tt_failure: "Svalíte se ze stoličky"
 fp1_yearly.0601.b: "Mohl bych teď dělat něco užitečného..."
 fp1_yearly.0601.c: "$fp1_yearly.0601.b$"
 fp1_yearly.0601.d: "$fp1_yearly.0601.b$"
 fp1_yearly.0601.e: "$fp1_yearly.0601.b$"
 fp1_yearly.0601.f: "$fp1_yearly.0601.b$"
 fp1_yearly.0601.g: "Tohle nemá smysl, půjdu si zdřímnout."
 fp1_yearly.0601.g.nickname: "Vaše činy vám vynesou novou přezdívku"
 fp1_yearly.0611.t: "Vést příkladem"
 fp1_yearly.0611.desc: "„[ROOT.Char.Custom('GetMaPa')|U]!“, vykřikne [child_b.GetFirstNameNoTooltip], rozběhne se ke mně plakat, s provinile vypadajícím [child_a.GetFirstNameNoTooltip] u sebe. Velká tržná rána zdobí tvář mého [child_b.Custom('GetDaughterSon')], mělká, ale stále krvácející. „Mě [Select_CString(child_a.IsFemale,'praštila','praštil')] #EMP opravdovým#! mečem! Říká, že bude bojovník jako ty!“\n\n[child_a.GetFirstNameNoTooltip] se nemůže podívat mi do očí.\n\n„Byla to nehoda. Jen jsme si hráli...“"
 fp1_yearly.0611.a: "Poslouchej, #EMP válka#! není #EMP hra#!!"
 fp1_yearly.0611.a.tt_success: "[child_a.GetFirstNameNoTooltip] chápe a omluví se"
 fp1_yearly.0611.a.tt_failure: "Tvá slova vyvolají jen hořkost"
 fp1_yearly.0611.b: "Ha! Jsi jako tvůj starý [ROOT.Char.Custom('GetMaPa')], [child_a.GetFirstNameNoTooltip]!"
 fp1_yearly.0611.c: "Dobře, [child_b.GetFirstNameNoTooltip], naučím tě, jak se bránit šikanátorům."
 fp1_yearly.0611.d: "Děti, jděte za svou chůvou."
 fp1_yearly.0621.t: "Lesklá nová hračka"
 fp1_yearly.0621.desc: "Právě vykládáme poslední čerstvou kořist z lodí, když přijde můj [child.Custom('GetDaughterSon')] [child.GetFirstName], celý široký úsměv a žádosti o vyprávění. Kolik [dummy_gender.GetWomenMen] jsem [Select_CString(ROOT.Char.IsFemale,'zabila','zabil')]? Kdy budu moci jít na nájezd? Viděl jsem mořské draky?\n\nDřívější otázky neutichají, dokud [child.Custom('GirlBoy')] nespatří obrovský stříbrný kalich položený na největší truhle, jehož zaschlá krev bývalého majitele se stále jemně olupuje po boku.\n\n„[ROOT.Char.Custom('GetMaPa')|U], to je nádherné! Mohu... mohu si ho vzít?“"
 fp1_yearly.0621.a: "Samozřejmě, můžeš si ho vzít!"
 fp1_yearly.0621.b: "Teď ne: možná až budeš starší, si vyděláš svůj vlastní."
 fp1_yearly.0621.c: "Jdi pryč! To je pro dospělé!"
 fp1_yearly.0631.t: "Cynické sklony"
 fp1_yearly.0631.desc: "Po návratu z úspěšného nájezdu každý dobrý [ROOT.Char.GetCulture.GetNameNoTooltip][cynic.GetWomanMan] ví, že má obětovat kousek svého zisku [ROOT.Char.GetFaith.PantheonTerm].\n\nKaždý dobrý [ROOT.Char.GetCulture.GetNameNoTooltip], až na [cynic.GetTitledFirstName].\n\nKdyž si ostatní dělíme kořist, chlubíme se svými nejlepšími kusy a probíráme, co dáme na znamení vděčnosti za štěstí a příznivé větry, všimnu si, že [cynic.GetSheHe] zůstává zticha.\n\nKdyž na [cynic.GetWomanMan] zatlačím, [cynic.GetSheHe] to dokonce přizná: „V našem nájezdu jsem neviděl ruku [cynic.GetFaith.PantheonTerm], můj [ROOT.Char.GetTitleAsNameNoTooltip], jen své vlastní ruce, co odvádějí svou práci. Můj podíl je pro mě.“"
 fp1_yearly.0631.a: "[cynic.GetFirstNameNoTooltip], to je skoro rouhání!"
 fp1_yearly.0631.a.tt_success: "Podaří se vám [cynic.GetHerHim] zahanbit"
 fp1_yearly.0631.a.tt_failure: "[cynic.GetFirstNameNoTooltip] vás zesměšní"
 fp1_yearly.0631.b: "Hmm, dobrý nápad. Každá drobnost pomůže..."
 fp1_yearly.0631.c: "Eh, to není moje věc."
 fp1_yearly.0641.t: "Hoden oceánu"
 fp1_yearly.0641.desc: "Dlouhé lodě jsou v mnohém srdcem moci [ROOT.Char.GetTitleAsNameNoTooltip]. Bez přístupu k moři jsme nic než uvěznění vlci, neschopní lovit či se toulat.\n\nS nemalým znepokojením tedy zjišťuji při poslední prohlídce našich uskladněných lodí, že mnohé začínají hnít a chátrat, jejich pečlivě spojené trupy se mohou při návratu do vody rozpadnout."
 fp1_yearly.0641.a: "Nemůže to stát tolik, opravit je..."
 fp1_yearly.0641.a.tt: "Lodě jsou bez problémů opraveny"
 fp1_yearly.0641.b: "Nemá [neighbour.GetTitledFirstNameNoTooltip] docela novou flotilu?"
 fp1_yearly.0641.b.tt_success: "Úspěšně ukořistíte nejlepší lodě [neighbour.GetFirstNamePossessiveNoTooltip]"
 fp1_yearly.0641.b.tt_failure: "Jste přistiženi a musíte uprchnout"
 fp1_yearly.0641.c: "V dlouhodobém horizontu se vyplatí zaplatit teď za to nejlepší."
 fp1_yearly.0641.d: "Bah, nech je hnít. Co na tom?"
 fp1_yearly.0651.t: "Leviatan"
 fp1_yearly.0651.desc: "Je vhodné, aby silný [ROOT.Char.GetTitleAsNameNoTooltip] trávil čas na moři, s mořským vzduchem v tváři [ROOT.Char.GetHerHis] a pěknou lodí pod nohama [ROOT.Char.GetHerHis]. Dnes jsou moje osobní plavidlo a malé doprovodné loďstvo na cvičení, tréninku a potěšení.\n\nKrátká plavba byla vzrušující změnou od života na [ROOT.Char.Custom('GetCourt')], když to zahlédneme: vzdálený pruh vody, poté malý ostrov vínově zbarveného masa vyplouvající z vln.\n\nNejvětší tvor všech hlubin.\n\n#EMP Velryba#!."
 fp1_yearly.0651.a: "Na harpuny!"
 fp1_yearly.0651.a.tt_success: "Zabijete velrybu a vytáhnete ji na břeh"
 fp1_yearly.0651.a.tt_failure: "Tvor vám unikne"
 fp1_yearly.0651.b: "Nechte to na ostatních, přineste mi jen mrtvé tělo."
 fp1_yearly.0651.c: "Co za #EMP velkolepá#! kořist!"
 fp1_yearly.0651.c.tt: "Čelíte #EMP pravému#! leviatanu hlubin"
 fp1_yearly.0651.c.tt_success: "$fp1_yearly.0651.a.tt_success$"
 fp1_yearly.0651.c.tt_failure: "$fp1_yearly.0651.a.tt_failure$"
 fp1_yearly.0651.d: "Tvor hrozivé majestátnosti, nechte ho být."
 fp1_yearly.0651.d.tt: "Velryba odplave pryč"
 fp1_yearly.0661.t: "Nová výzva"
 fp1_yearly.0661.desc: "„Jen říkám, [ROOT.Char.GetTitledFirstNameNoTooltip], že lyžování je zábavné i bez lovu. Nemělo by být tak neobvyklé lyžovat pro radost, ne jen z užitku,“ přetahuje se [knight.GetTitledFirstName] u večeře.\n\nMám pocit, že jsem v tomto rozhovoru po celý život. Ten [knight.Custom('WomanManPossessive')] posedlý.\n\n„Měli bychom to zkusit teď, dokud je sníh hluboký a čerstvý! Není daleko prudký kopec. Vsadím se, že dolů dojedu dřív než ty a oba si to užijeme!“"
 fp1_yearly.0661.a: "Jak neobvyklé! Přijímám."
 fp1_yearly.0661.a.tt_success: "Je to těsné, ale vyhráváte!"
 fp1_yearly.0661.a.tt_failure: "[knight.GetFirstNameNoTooltip] sklouzne k vítězství"
 fp1_yearly.0661.a.2: "Venku ve sněhu? Přijímám."
 fp1_yearly.0661.a.2.tt: "Snadno zvítězíte."
 fp1_yearly.0661.b: "Hmmm, možná bych mohl použít malou #EMP výhodu#!..."
 fp1_yearly.0661.b.tt_success: "Získáte #EMP snadné#! vítězství" # todo: RETRANSLATED ENGLISH
 fp1_yearly.0661.b.tt_failure: "Jste přistiženi při poškozování [knight.GetFirstNamePossessiveNoTooltip] lyží"
 fp1_yearly.0661.c: "#EMP Competitive#! skiing? With no hunting? Sounds boring."
 fp1_yearly.0671.t: "Kluzký svah"
 fp1_yearly.0671.desc: "„[ROOT.Char.Custom('GetMaPa')|U]!“ vykřikuje [child.GetFirstNameNoTooltip] přímo do mého ucha. Oči se mi neochotně otevírají, jedna po druhé. To je jeden způsob, jak se probudit, myslím.\n\nMalé dítě vedle mé postele přímo vibruje vzrušením, svírá palčáky a drahý dřevěný tác.\n\n„Venku sněží a chci se jít #EMP sáňkovat#!! Vezmeš mě?“"
 fp1_yearly.0671.a: "Ha, jen mi dovol vytáhnout stůl!"
 fp1_yearly.0671.b: "Pojď, vezmeme tác od kuchařů!"
 fp1_yearly.0671.c: "Jdi se zeptat svého [sibling.Custom('SisterBrother')]."
 fp1_yearly.0671.d: "Jdi pryč, [ROOT.Char.GetMotherFather] odpočívá."
 fp1_yearly.0681.t: "Proč nemůžu jít?"
 fp1_yearly.0681.desc: "Moji $knight_culture_player_plural_no_tooltip_lowercase$ a já si užíváme příjemný večer v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], vyprávíme příběhy o starých bitvách a minulých nájezdech, smějeme se, chlubíme se a celkově se silně opíjíme. Skvělý večer, slovy.\n\nZamlženě zahlédnu stín u dveří mé pracovny a zavolám vetřelce dovnitř. Ruce po celé místnosti letí ke zbraním.\n\nMísto vraha vyjde moje [child.Custom('GetDaughterSon')] [child.GetFirstName], s rozhodným výrazem, [child.Custom('HandHands')] sevřené do malých [child.Custom('Fist_ArticleBlank')][child.Custom('FistFists')].\n\n„[ROOT.Char.Custom('GetMaPa')|U], i já chci jít na nájezd! Není fér, že mě necháváte pozadu jen proto, že jsem dítě!“"
 fp1_yearly.0681.a: "Nechávám tě střežit [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], dobře?"
 fp1_yearly.0681.b: "#EMP Ha!#! Nikdy nebudeš #EMP opravdovým#! válečníkem, dítě."
 fp1_yearly.0681.b.haughty_knights: "Každý povýšený [knight|E]"
 fp1_yearly.0681.c: "Probereme to, až budeš starší."
 fp1_yearly.0691.t: "Pokus o odčinění"
 fp1_yearly.0691.desc: "Je pozdě, když ke mně přistoupí [knight.GetTitledFirstName], s naplněným batohem přes záda.\n\n„[ROOT.Char.GetTitledFirstNameNoTooltip], omlouvám se, že ti to musím říct, ale nemohu dál sloužit.\n\n„Od nájezdu na [county.GetNameNoTier] mě pohltila vina za mé činy, a moji [knight.GetFaith.GetAdherentName] otroci mi říkají, že jen přijetím [knight.GetFaith.HighGodName] do mého srdce může být má duše spasena.\n\n„S těžkým srdcem musím opustit tvůj hříšný dvůr a ty hrozné věci, které dělám ve tvé službě.“"
 fp1_yearly.0691.a: "Určitě tě z toho cizího náboženství dokážu vyvést?"
 fp1_yearly.0691.a.tt_success: "Přivedete [knight.GetFirstNameNoTooltip] zpět ke světlu"
 fp1_yearly.0691.a.tt_failure: "[knight.GetSheHe|U] odmítá přijmout rozum"
 fp1_yearly.0691.b: "[knight.GetFaith.GetReligion.GetNameNoTooltip]? Šílíš! Stráže!"
 fp1_yearly.0691.b.same_faith_courtiers_and_guests: "Stejní-[faith|E] [courtiers|E] a [guests|E]"
 fp1_yearly.0691.c: "Můžeš odejít, pokud chceš."
 fp1_yearly.1001.t: "Cizinec na dvoře"
 fp1_yearly.1001.desc.intro: "Párkrát v posledních dnech jsem na dvoře zaznamenal záhadného tuláka, [stranger.GetFirstName]. Nepamatuji si [stranger.GetHerHis] tvář ani oznámení o [stranger.GetHerHis] příchodu.\n\n"
 fp1_yearly.1001.desc.behaviour_1.sneaks: "[stranger.GetSheHe|U] se po dvoře plíží,"
 fp1_yearly.1001.desc.behaviour_1.leaves_early: "[stranger.GetSheHe|U] vždy odchází od večeře brzy,"
 fp1_yearly.1001.desc.behaviour_1.earnest: "[stranger.GetSheHe|U] tráví hodiny vážnými rozhovory s dvořany,"
 fp1_yearly.1001.desc.behaviour_1.confident: "[stranger.GetSheHe|U] se pohybuje sebevědomě #EMP všude#!,"
 fp1_yearly.1001.desc.behaviour_1.talkative: "[stranger.GetSheHe|U] tráví hodiny povídáním si s kýmkoli,"
 fp1_yearly.1001.desc.behaviour_1.eats_their_fill: "[stranger.GetSheHe|U] nikdy nenechá u večeře žádný kousek nepozřený,"
 fp1_yearly.1001.desc.behaviour_2.sneaks: "a plíží se až do noci."
 fp1_yearly.1001.desc.behaviour_2.leaves_early: "a u večeře nikdy nezůstane déle, než musí."
 fp1_yearly.1001.desc.behaviour_2.earnest: "a tráví hodiny vážnými rozhovory s mými dvořany."
 fp1_yearly.1001.desc.behaviour_2.confident: "a sebevědomě chodí #EMP všude#!."
 fp1_yearly.1001.desc.behaviour_2.talkative: "a tráví hodiny povídáním si s kýmkoli, kdo náhodou přejde [stranger.GetHerHis] cestu."
 fp1_yearly.1001.desc.behaviour_2.eats_their_fill: "a nikdy u večeře nenechá žádný kousek nepozřený."
 fp1_yearly.1001.desc.outro: "Možná [stranger.GetSheHe] není nic víc, ale něco na [stranger.GetHerHim] mi dává pocit neklidu.\n\nJaké neplechy může jeden tulák spáchat za den či dva?"
 fp1_yearly.1001.probably_harmless.tt: "To bude mít minimální následky"
 fp1_yearly.1001.guest_of_honour.tt: "To bude mít #EMP dramatické#! následky"
 fp1_yearly.1001.mysterious_stranger_disappears.tt: "Tajemný cizinec zmizí..."
 fp1_yearly.1001.a: "[stranger.GetSheHe|U] je pravděpodobně neškodný."
 fp1_yearly.1001.b: "Tulák? Udělám z [stranger.GetHerHim] čestného hosta!"
 fp1_yearly.1001.c: "Stráže! Vyhoďte toho žebráka!"
 fp1_yearly.1011.t: "$fp1_yearly.1001.t$: Goði"
 fp1_yearly.1011.desc.critical_preamble: "[stranger.GetNamePossessiveNoTooltip] podivnost roste úměrně s [stranger.GetHerHis] dobrým zacházením, ale [stranger.GetHerHis] výstřednosti se nikdy nestaly znepokojivými. Když jsem se rozhodl to tak nechat, jsem v šoku, když se [stranger.GetNameNoTooltip] jedné noci, bez varování, objeví v mých soukromých komnatách.\n\n"
 fp1_yearly.1011.desc.critical_epilogue: "\n\nA stejně tak [stranger.GetNameNoTooltip] zmizí a instinktivně vím, že ráno se nenajde po [stranger.GetHerHim] žádná stopa."
 fp1_yearly.1011.desc.standard_preamble: "[stranger.GetNameNoTooltip] pokračuje v plížení se po dvoře, ale [stranger.GetSheHe] se zdá dělat jen málo, v nejhorším případě lidi jen rozpačití. To platí až do té noci, kdy se [stranger.GetSheHe] po setmění objeví v mých soukromých komnatách.\n\n"
 fp1_yearly.1011.desc.standard_epilogue: "\n\nJak rychle [stranger.GetSheHe] přišel, tak rychle se [stranger.GetFirstNameNoTooltip] rozplyne ve stínu. Hledací výpravy nic nenajdou, ani stopu, a zůstávám jen s otázkami."
 fp1_yearly.1011.desc.separate_religion.critical: "$fp1_yearly.1011.desc.critical_preamble$„Nevěřící!“ řve nevděčník. „Myslíš, že si koupíš mou víru dobrými stolovacími způsoby a péřovými polštáři?! Jsem pravý [stranger.GetFaith.GetAdherentNameNoTooltip] a nikdy neopustím Staré bohy! Místo toho povím každému z vašich [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetFaith.PriestNeuterPlural], že jsi poskytl útočiště pohanovi!“$fp1_yearly.1011.desc.critical_epilogue$"
 fp1_yearly.1011.desc.separate_religion.standard: "$fp1_yearly.1011.desc.standard_preamble$„Kdybych byl horší [stranger.GetWomanMan], [Select_CString(ROOT.Char.IsFemale,'zabila','zabil')] bych tě tu a hned za tvou rouhavou víru. Naštěstí pro tebe má čest stojí víc než tvůj život a spokojil jsem se s šířením slova [stranger.GetFaith.HighGodName] na tvém dvoře.“$fp1_yearly.1011.desc.standard_epilogue$"
 fp1_yearly.1011.desc.same_religion.critical: "$fp1_yearly.1011.desc.critical_preamble$„Bohy uctíváš špatně, [ROOT.Char.GetFirstNameNoTooltip], ale ctíš je dobře. Přestože tvá víra uráží Aesiry, potěšil jsi Oběšeného, a já, Grímnir, dám vědět [stranger.GetFaith.PriestNeuterPlural] země.“$fp1_yearly.1011.desc.critical_epilogue$"
 fp1_yearly.1011.desc.same_religion.standard: "$fp1_yearly.1011.desc.standard_preamble$„Bohy uctíváš špatně a nedokážeš spatřit pravou božskost ve svém dvoře, i když Grímnir se plíží po tvých chodbách a sedí u tvého stolu. Lituji tě, [ROOT.Char.GetWomanMan]lingu, neboť #EMP nikdy#! neuvidíš mé síně Valhally!“$fp1_yearly.1011.desc.standard_epilogue$"
 fp1_yearly.1011.desc.same_faith.critical: "$fp1_yearly.1011.desc.critical_preamble$„Tvoje pohostinnost je chvályhodná, [ROOT.Char.GetFirstNameNoTooltip], a vidím, že jsi buď mazaný, zbožný, nebo obojí. Každopádně moudří [stranger.GetFaith.PriestNeuterPlural] země budou vědět, že jsi hostil Grímnira a dobře se postaral o Pána Aesirů.“$fp1_yearly.1011.desc.critical_epilogue$"
 fp1_yearly.1011.desc.same_faith.standard: "$fp1_yearly.1011.desc.standard_preamble$„Byl jsi sledován staršími očima, [ROOT.Char.GetFirstNameNoTooltip], a shledán jsi nedostatečným,“ křičí [stranger.GetFirstNameNoTooltip], sliny létají všude. „Grímnir bloudí tvým dvorem a ty nic neděláš, nic nevidíš? [stranger.GetFaith.PriestNeuterPlural] země budou vědět, že tě navštívili Aesi a že bohové tě sledují, aby ses zlepšil!“$fp1_yearly.1011.desc.standard_epilogue$"
 fp1_yearly.1011.a: "To přece nemohl #EMP opravdu#! být Otec všech?"
 fp1_yearly.1011.b: "Podrazák!"
 fp1_yearly.1011.possible_converts_specific_list: "Alespoň jeden [courtier|E]"
 fp1_yearly.1012.t: "$fp1_yearly.1001.t$: [stranger.GetFaith.GetAdjectiveNoTooltip] misionář"
 fp1_yearly.1012.desc.preamble: "[stranger.GetNameNoTooltip] se ukáže být živým a vzdělaným hostem, tráví večer co večer zapojen do dlouhých diskuzí se zbytkem dvora.\n\nDnes večer mě [stranger.GetSheHe] navštíví, s širokým úsměvem vytesaným na [stranger.GetHerHis] tváři.\n\n"
 fp1_yearly.1012.desc.same_faith_epilogue: "\n\n[stranger.GetFirstNameNoTooltip] se zastaví, nejistý. „Pokud si přejete, byl bych poctěn zůstat natrvalo na vašem dvoře?“"
 fp1_yearly.1012.desc.different_faith.critical: "$fp1_yearly.1012.desc.preamble$„Můj [ROOT.Char.GetLadyLord]! Už je to nějaký čas, co jsem byl takto dobře ošetřen, děkuji za vaši pohostinnost. Obávám se však, že vám musím něco přiznat: jsem [stranger.GetFaith.GetAdherentNameNoTooltip], služebník [stranger.GetFaith.HighGodName], a vyučoval jsem vaše poddané v učení [stranger.GetFaith.HighGodHerHis].“"
 fp1_yearly.1012.desc.different_faith.standard: "$fp1_yearly.1012.desc.preamble$„Můj [ROOT.Char.GetTitleAsNameNoTooltip], vím, že mě už nevidíte obzvlášť příznivě, ale obávám se, že k vám přicházím s přiznáním. Během mého pobytu na vašem dvoře jsem rozebíral díla [stranger.GetFaith.HighGodName] s vašimi poddanými a vzdělával každého, kdo byl ochoten naslouchat [stranger.GetFaith.GetAdjectiveNoTooltip] víře.“"
 fp1_yearly.1012.desc.same_faith.critical: "$fp1_yearly.1012.desc.preamble$„Šlechetný [ROOT.Char.GetTitleAsNameNoTooltip]! Chci vám poděkovat, že jste se ke mně tak dobře choval během mého pobytu zde. Jako zbožný [Select_CString(stranger.IsFemale,stranger.GetFaith.DevoteeFemale,stranger.GetFaith.DevoteeMale)] a spolupříslušník [stranger.GetFaith.GetAdherentNameNoTooltip] jsem napsal dopisy vlivným teologům v celém království na chválu vaší zbožnosti.“$fp1_yearly.1012.desc.same_faith_epilogue$"
 fp1_yearly.1012.desc.same_faith.standard: "$fp1_yearly.1012.desc.preamble$„Můj [ROOT.Char.GetLadyLord], nebyl jsem k vám zcela upřímný. Ač vypadám jako žebrák, ve skutečnosti jsem [Select_CString(stranger.IsFemale,stranger.GetFaith.DevoteeFemale,stranger.GetFaith.DevoteeMale)], a strávil jsem čas na dvoře vzděláváním a přednáškami o dílech [stranger.GetFaith.HealthGodName]. Ačkoli byste to možná nepovzbudil, děkuji za projevenou pohostinnost.“$fp1_yearly.1012.desc.same_faith_epilogue$"
 fp1_yearly.1012.a: "Pověz mi o tom více... [stranger.GetFaith.GetNameNoTooltip]..."
 fp1_yearly.1012.a.recoup_lost_piety.tt: "Veškerá [piety|E] utracená za hostění misionáře je navrácena"
 fp1_yearly.1012.b: "Co to #EMP jako#!? Pryč. Hned."
 fp1_yearly.1012.c: "Ty [stranger.Custom('InsultAdjective')] [stranger.Custom('InsultNoun')]! #EMP STRÁŽE!#! Zatkněte [stranger.GetHerHim]!"
 fp1_yearly.1012.d: "Přijímám tvou službu."
 fp1_yearly.1012.e: "Mám dost poradců a teologů, děkuji."
 fp1_yearly.1012.possible_converts_specific_list: "$fp1_yearly.1011.possible_converts_specific_list$"
 fp1_yearly.1013.t: "$fp1_yearly.1001.t$: Nithing"
 fp1_yearly.1013.desc.critical: "#EMP Disaster!#!\n\n[stranger.GetNameNoTooltip] odměnil mou pohostinnost tím, že mě v noci okradl, nacpal do kapes každý kousek lesklého kovu nebo exotické látky, který [stranger.GetSheHe] mohl najít, a pak odjel na mém nejlepším koni!"
 fp1_yearly.1013.desc.standard: "[stranger.GetNameNoTooltip] utekl v noci a odnesl s sebou všechny cennosti, které [stranger.GetSheHe] dokázal získat svýma špinavýma malými rukama."
 fp1_yearly.1013.desc.outro: "\n\nZdá se, že tajemný cizinec byl ve skutečnosti nithing na útěku: odsouzený za zločin považovaný za tak ohavný, že je nyní bez přísahy, bez cti a rodinou považován za právně mrtvého. Tato urážka hluboce zasahuje."
 fp1_yearly.1013.desc.outro.sodomite: "\n\nZdá se, že tajemný cizinec byl ve skutečnosti nithing na útěku: vyhnaný ze společenství, [stranger.GetSheHe] putuje od dvora k dvoru hledaje útočiště.\n\nKdyž se ukázalo, že moji dvořané jsou stejně konzervativní jako u předchozího hostitele, [stranger.GetSheHe] utekl spíše než by zůstal a trpěl."
 fp1_yearly.1013.a: "Prokletí!"
 fp1_yearly.1013.a.sodomite: "Žít takový život..."
 fp1_yearly.1013.b: "Neodpočinu, dokud ten nithing nebude nalezen!"
 fp1_yearly.1014.t: "$fp1_yearly.1001.t$: Bojovník"
 fp1_yearly.1014.desc.critical: "[stranger.GetNameNoTooltip] se zdá příjemně překvapen tím, že je považován za čestného hosta, a na konci dne se ke mně soukromě přiblíží.\n\n„Můj [ROOT.Char.GetLadyLord], nebyl jsem k vám zcela upřímný. Ač se možná zdám křehký, ve skutečnosti jsem válečník hrozivé pověsti! Hledal jsem pána hodného mých služeb a vaše chování mě vede k přesvědčení, že byste to mohl být vy.“"
 fp1_yearly.1014.desc.standard: "[stranger.GetNameNoTooltip] na dvoře chvíli zůstává a nakonec se mu podaří nějakým způsobem vyprosit si soukromé přijetí se mnou.\n\n„Velký [ROOT.Char.GetTitleAsNameNoTooltip], chci vám nabídnout svůj meč. Jsem potulný válečník, který už nějakou dobu hledá dobrého pána, a pobyt na vašem dvoře mě vede k domněnce, že byste to mohl být vy.“"
 fp1_yearly.1014.desc.outro: "\n\nNení to sice obvyklý způsob získávání $knight_culture_player_plural_no_tooltip_lowercase$, ale je to #EMP lichotivé#!, že [stranger.GetHerHis] výzvu [stranger.GetSheHe] překonal."
 fp1_yearly.1014.a: "Úžasné! Budeš stát svou odměnu!"
 fp1_yearly.1014.b: "Mám dost schopných válečníků, kteří mi nezkoušejí trpělivost."
 fp1_yearly.1015.t: "$fp1_yearly.1001.t$: Tulák"
 fp1_yearly.1015.desc.critical: "[stranger.GetFirstNameNoTooltip] je zmatený, ohromen a nadšený z toho zacházení, které [stranger.GetSheHe] dostává. Být považován za menší šlechtu se zdá být pro [stranger.GetHerHim] zcela novým zážitkem a trvá to docela dlouho, než mu to dojde."
 fp1_yearly.1015.desc.standard: "[stranger.GetFirstNameNoTooltip] zůstává celkem neškodný a předvídatelně během svého krátkého pobytu v mém domě způsobuje menší škody. Není to, dokud nepřistihnu [stranger.GetHerHim], jak vede tlumený rozhovor, že si něco uvědomím."
 fp1_yearly.1015.desc.outro: "\n\nZdá se, že [stranger.GetSheHe] vlastně #EMP je#! jen toulavý tulák, který se proklouzl za hradby!\n\nKdyž přemýšlím, co dělat, [stranger.GetFirstNameNoTooltip] přistoupí ke mně, čepici v rukou, a prosí, aby mu bylo dovoleno zůstat natrvalo."
 fp1_yearly.1015.a: "Samozřejmě můžeš zůstat."
 fp1_yearly.1015.b: "Cože?! To je nepřijatelné, vypadni!"
 fp1_yearly.1062.t: "Život, na který nezapomeneme: [ship_funeral_candidate.GetFirstNameNoTooltip]"
 fp1_yearly.1062.desc: "Nedávná smrt [ship_funeral_candidate.Custom2('MyCharacterIntroduction',mourner)] zanechala [ship_funeral_candidate.GetHerHis] blízké v truchlení nad ztrátou velkého [ship_funeral_candidate.GetWomanMan].\n\nJako jeden z těch nejbližších zesnulému bych mohl přijmout roli uspořádání vhodného pohřbu.\n\nJe tradicí mezi poctivými [ship_funeral_candidate.GetFaith.GetAdherentNamePluralNoTooltip], že pohřbíváme naše nejšlechtější s lodí, aby je lépe dopravila do [ship_funeral_candidate.GetFaith.PositiveAfterLife], a jistě si [ship_funeral_candidate.GetFirstNameNoTooltip] zaslouží toto vysoké vyznamenání?"
 fp1_yearly.1062.a: "Malá symbolická kamenná loď postačí."
 fp1_yearly.1062.a.tt: "Přípravy na pohřeb začínají..."
 fp1_yearly.1062.b: "Velkolepá kamenná loď, aby zapůsobila na [ship_funeral_candidate.GetFaith.WarGodName]!"
 fp1_yearly.1062.c: "Okázalá plachetnice; [ship_funeral_candidate.GetFirstNameNoTooltip] si zaslouží to nejlepší."
 fp1_yearly.1062.d: "Tohle je všechno #EMP neskutečně#! drahé..."
 fp1_yearly.1063.t: "$fp1_yearly.1062.t$"
 fp1_yearly.1063.desc.intro: "Stojím před malou skupinou truchlících, zrak přelétá po každém plačícím a začínám svou řeč.\n\n„[ship_funeral_candidate.GetFirstNameNoTooltip]"
 fp1_yearly.1063.desc.achievements.title.duchy: "vynikající [ship_funeral_candidate.GetTitleAsNameNoTooltip],"
 fp1_yearly.1063.desc.achievements.title.kingdom: "nádherný [ship_funeral_candidate.GetTitleAsNameNoTooltip],"
 fp1_yearly.1063.desc.achievements.title.empire: "velkolepý [ship_funeral_candidate.GetTitleAsNameNoTooltip],"
 fp1_yearly.1063.desc.achievements.prestige.high: "významný [ship_funeral_candidate.GetWomanMan],"
 fp1_yearly.1063.desc.achievements.prestige.very_high: "vznešený [ship_funeral_candidate.GetWomanMan],"
 fp1_yearly.1063.desc.achievements.prestige.max: "pravá legenda mezi [ship_funeral_candidate.GetWomanMan],"
 fp1_yearly.1063.desc.achievements.piety.high: "oddáný služebník [ship_funeral_candidate.GetFaith.HighGodName],"
 fp1_yearly.1063.desc.achievements.piety.very_high: "bezkonkurenční vzor ctnosti [ship_funeral_candidate.GetFaith.GetNameNoTooltip],"
 fp1_yearly.1063.desc.achievements.piety.max: "pravá ikona víry [ship_funeral_candidate.GetFaith.GetNameNoTooltip],"
 fp1_yearly.1063.desc.achievements.lifestyles.partying: "pramen radosti a smíchu,"
 fp1_yearly.1063.desc.achievements.lifestyles.duelling: "skutečně smrtící duelant,"
 fp1_yearly.1063.desc.achievements.lifestyles.hunting: "nejlepší střelec v celém [hunting_lands.GetNameNoTierNoTooltip],"
 fp1_yearly.1063.desc.achievements.lifestyles.magickerationing: "odborník v mystických uměních,"
 fp1_yearly.1063.desc.achievements.single.intro: "měl výjimečnou vůli. Možná proto byl [ship_funeral_candidate.GetSheHe] považován"
 fp1_yearly.1063.desc.achievements.single.outro: "za čin, v němž [ship_funeral_candidate.GetSheHe] možná nikdy nebude překonán.„"
 fp1_yearly.1063.desc.achievements.double.intro: "byl osobou vzácného talentu a rozmanitých zájmů. Obě"
 fp1_yearly.1063.desc.achievements.double.connector: "a"
 fp1_yearly.1063.desc.achievements.double.outro: "nic nemůže zaplnit díru, kterou [ship_funeral_candidate.GetHerHis] ztráta zanechala v našich životech.„"
 fp1_yearly.1063.desc.achievements.triple.intro: "byl tolika věcmi. [ship_funeral_candidate.GetSheHe|U] byl "
 fp1_yearly.1063.desc.achievements.triple.connector: "$fp1_yearly.1063.desc.achievements.double.connector$"
 fp1_yearly.1063.desc.achievements.triple.outro: "ale pro mě, především, byl [ship_funeral_candidate.GetSheHe] mým [ship_funeral_candidate.Custom2('RelationToMe', mourner)]. Už nikoho takového jako [ship_funeral_candidate.GetHerHis] neuvidíme.„"
 fp1_yearly.1063.desc.ship_stone_small: "\n\nMohyla za mnou už obsahuje malou podobu lodi, vytesanou do těžkých kamenů a vyplněnou oblázky, již pohřbenou pod silnou vrstvou země."
 fp1_yearly.1063.desc.ship_stone_grand: "\n\nVelká mohylová hrobka za mnou již obsahuje kolosální podobu lodi, vyznačenou runovými kameny a vyplněnou oblázky, přičemž každý velký kámen vypráví příběhy ze zesnulého života."
 fp1_yearly.1063.desc.ship_wood_ornate: "\n\nMohyla za mnou již obsahuje speciálně postavenou loď, vyrobenou z exotických dřev a našich nejlepších lodníků. Nikdy nebude plout po smrtelných oceánech, ale může potěšit [ship_funeral_candidate.GetFaith.PantheonTerm] a přinést požehnání zesnulému."
 fp1_yearly.1063.desc.outro: "\n\nSlužebníci přinesou poslední pohřební poklady a nakonec je [ship_funeral_candidate.GetFirstNamePossessiveNoTooltip] tělo položeno na rakev."
 fp1_yearly.1063.trigger_failure.tt: "Okolnosti přerušily veřejný pohřeb [ship_funeral_candidate.GetFirstNamePossessiveNoTooltip]"
 fp1_yearly.1063.a: "Zavřete mohylu."
 fp1_yearly.1071.t: "Jiskrně čistý"
 fp1_yearly.1071.desc: "Lidé [ROOT.Char.GetCulture.GetNameNoTooltip] jsou proslulí svou pečlivou čistotou.\n\nJedním z největších potěšení života je slyšet i naše nejtvrdší nepřátele hořce přiznat, že žádný muž nemá lépe pročesaný vous, žádné [ROOT.Char.Custom('WomanManPossessive')] vlasy nejsou pravidelněji mýdlovány, žádná tvář [ROOT.Char.GetWomanMan] není tak dokonale očištěná od nedokonalostí jako u dobrého [ROOT.Char.GetCulture.GetNameNoTooltip][ROOT.Char.GetWomanMan].\n\nDnes je den koupání, ale mám pocit, že změna rutiny by mi prospěla. Koneckonců, pokud jsou všichni [ROOT.Char.GetCulture.GetNameNoTooltip] dobře upravení, nebylo by vhodné, aby [ROOT.Char.GetTitleAsNameNoTooltip] byl #EMP nejlépe#! upraven?"
 fp1_yearly.1071.a: "Hygiena je klíčem k dlouhému životu!"
 fp1_yearly.1071.b: "Myslím, že bych mohl věnovat trochu více péče..."
 fp1_yearly.1071.c: "Stačí jen obvyklé."
 fp1_yearly.1081.t: "Průzkumník ze Západu"
 fp1_yearly.1081.desc.intro: "Můj večer byl zaujmut postarším průzkumníkem, [norse_explorer.GetFirstName], který mi chce vyprávět exotické příběhy svých výprav a dobrodružství v Atlantském oceánu.\n\nNavzdory [norse_explorer.GetHerHis] věku zůstávají [norse_explorer.GetFirstNamePossessiveNoTooltip] oči ostré, když mi vypráví o"
 fp1_yearly.1081.desc.greenland: "zemi chudých, zápasících $norse_collective_noun$, kteří žijí ve sněhu blízko vrcholu světa. Země je tak zmrzlá a studená, že musejí dovážet veškeré dřevo a jedí téměř výhradně maso a ryby."
 fp1_yearly.1081.desc.vinland: "zemi tak daleko na západě, jako je Cathay na východě, kde réva a pšenice rostou tak bujně, že se zdá, že se samy zasejí, a vínové ročníky jsou bezkonkurenční. Každý místní je hrozivý válečník, netolerující žádné vniknutí."
 fp1_yearly.1081.desc.antilia: "ostrov osídlený [antilia_culture.GetNameNoTooltip] exulanty. Bohatí, zámožní $christianity_religion_adherent_plural$, žijící v dobře opevněných hradech, pocházejí z uprchlíků, kteří unikli z Ibérie během Moorish invaze."
 fp1_yearly.1081.desc.fortunate_isles.hellenist: "poslední přežívající enkláva $hellenic_pagan$, malý ostrov na západě obývaný $greek_collective_noun$, kteří mají více společného se starým $b_athens$ než s moderním $b_constantinople$. Místní tráví celý den diskuzemi o filozofii a přípitky na slávu Olympanů!"
 fp1_yearly.1081.desc.fortunate_isles.other: "útočiště posledních několika pohanských $hellenic_pagan_adherent_plural$, kteří napodobují své vzdálené předky v $b_athens$ a $b_thebes$. Místní tráví dny lenošením, probírají podivné filozofie a praktikují svou hrubou víru."
 fp1_yearly.1081.desc.st_brendans_island: "ostrov skrytý za podivnými mlhami, kde se zdá, že čas plyne uvnitř pomaleji než venku. O dalším tajemství ostrova zůstává [norse_explorer.GetFirstNameNoTooltip] skoupý na slovo, a přesto se mu někdy v očích mhouří slzy."
 fp1_yearly.1081.desc.isle_of_the_blessed.christian: "ostrov plný zbožných $breton_collective_noun$, modlících se a žijících životy tiché kontemplace. Jejich víra je tak silná, že je každý chráněn před smrtelnými zbraněmi, zcela chráněni [norse_explorer.GetFaith.HighGodName]."
 fp1_yearly.1081.desc.isle_of_the_blessed.other: "ostrov naplněný zbožnými $breton_collective_noun$, bohatý na zlaté poklady. Víra byla tak silná, že ostrov byl naplněn krásně zpívanými hymnami i poté, co [norse_explorer.GetFirstNamePossessiveNoTooltip]crew je postavil k meči."
 fp1_yearly.1081.desc.ard_majhulah: "podivná země, zmiňovaná pouze ve starých islámských textech, desítky let považovaná za ztracenou. Místní mají hromady zlata a stříbra tak velké, že je používají k výrobě párátek a tkaní oblečení."
 fp1_yearly.1081.desc.the_sticky_sea: "smutné moře v Atlantiku, lepivý, páchnoucí zmatek vod, kde hadi a mořské řasy spiknou, aby strhli námořníky ke smrti. Pouze ti nejsilnější posádky mají šanci se osvobodit."
 fp1_yearly.1081.desc.purple_islands: "skupina ostrovů daleko na jihu, plná zářivých květin, mnohé z nich v odstínech exotické purpurové, zcela bez známek lidského života. Podivuhodná krása místa svádí i otřelé námořníky, aby si lehli a zemřeli, spokojeni se světem."
 fp1_yearly.1081.desc.hy_brasil: "ostrov, který je většinu času neviditelný, zahalený v neproniknutelných mlhách kromě jednoho dne každých sedm let. I v ten jediný den, kdy mlhy dovolí plavbu, se žádnému námořníkovi nepodařilo úspěšně vylodit."
 fp1_yearly.1081.desc.thule: "rozlehlá země na dalekém severu, kde se veškerá hmota rozpadá. Lidé dýchají vodu a zemi stejně lehce jako vzduch, obrovské velryby plavou zemí i nebem a všechny rozdíly se stávají akademickými."
 fp1_yearly.1081.desc.great_ireland.abrahamic: "země daleko na západ, kde obyvatelé nosí pouze bílé, nosí krutá kopí a bojují zuřivě mezi sebou i proti nejvznešenějším návštěvníkům. Místní uctívají starodávná pohanská božstva, dávno zapomenutá rozumně smýšlejícími [norse_explorer.GetFaith.GetAdherentNamePluralNoTooltip]."
 fp1_yearly.1081.desc.great_ireland.other: "země daleko na západ, kde obyvatelé nosí pouze bílé, nesou krutá kopí a bojují nelidskou silou a zuřivostí. Jejich zdatnost je tak legendární, že žádný válečník z této země nikdy nepadl pod cizím ostřím."
 fp1_yearly.1081.desc.sunset_empire: "říše na druhé straně nejširší části Atlantského oceánu, země krve, lebek a hladových dobyvatelů, číhajících těsně pod západním obzorem. Její krutí pánové čekají na samotný Ragnarok, kdy hodlají vyrvat bijící srdce všem dobrým [norse_explorer.GetFaith.GetAdherentNamePluralNoTooltip]."
 fp1_yearly.1081.desc.outro: "\n\nAč se hodina nachýlila, [norse_explorer.GetFirstNameNoTooltip] se zdá být více než ochotný pokračovat, pokud si to přeji."
 fp1_yearly.1081.a: "Fascinující. Prosím, znovu, od začátku!"
 fp1_yearly.1081.b: "To mi #EMP snad#! neříkáš pravdu, starý [norse_explorer.GetWomanMan]."
 fp1_yearly.1081.c: "Příběhy o dalekých krajích jsou vždy uklidňující..."
 fp1_yearly.1081.c.sunset_empire: "Možná bychom měli zastavit lodě plující na západ..."
