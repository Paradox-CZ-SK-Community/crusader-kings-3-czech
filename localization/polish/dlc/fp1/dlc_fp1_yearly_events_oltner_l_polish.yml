l_polish:
 fp1_yearly.2000.t: "Touha po dobrodružství"
 fp1_yearly.2000.desc: "„Odcházím, [parent.GetMotherFather]. S [lover_of_child.GetFirstNameNoTooltip] se #EMP milujeme#!!“\n\nObrátím [ROOT.Char.Custom('EyeEyes')] v sloup. Co zase vyvádí [child_to_leave.Custom('GetDaughterSon')] [child_to_leave.GetFirstNameNoTooltip]?\n\n„S [lover_of_child.GetFirstNameNoTooltip] vyrazíme za dobrodružstvím! Svět je obrovský a čeká v něm sláva! Chci do celého světa křičet #EMP ‚[child_to_leave.GetHouse.GetMotto]‘#!, dokud si nezapamatuje mé jméno!“\n\nJe očividné, že můj #EMP milovaný potomek#!, [child_to_leave.Custom('GetDaughterSon')] [child_to_leave.GetFirstNameNoTooltip], to myslí vážně. Budu s tím muset něco udělat."
 fp1_yearly.2000.a: "„Pojď sem, [child_to_leave.Custom('GetDaughterSon')]. Myslím, že nastal čas na trochu #EMP tvrdé lásky#!.“"
 fp1_yearly.2000.b: "„Poslouchej, #EMP slávu#! můžeš získat i doma.“"
 fp1_yearly.2000.c: "„Možná by ti #EMP tohle#! pomohlo zapomenout na odchod?“"
 fp1_yearly.2000.d: "„Vrátíš se, však uvidíš...“"
 fp1_yearly.2000.d.tt: "#weak „...vzpomeneš si, že patříš ke mně.“#!"
 fp1_yearly.2000.a.tt: "#V Vyzvi#! [child_to_leave.GetFirstName] na duel a přiměj [Select_CString(child_to_leave.IsFemale,'ji, aby zůstala','ho, aby zůstal')]!\n#weak Tento duel NENÍ na život a na smrt.#!\nPokud zvítězíš, získáš [prestige_i] [Concept('prestige','prestiž')|E]\n\nTvá [Concept('prowess','udatnost')|E]: [prowess_i]#V [parent.GetProwess]#!\n[child_to_leave.GetFirstNameNoTooltip] - [Concept('prowess','udatnost')|E]: [prowess_i]#V [child_to_leave.GetProwess]#!"
 fp1_yearly.2000.c.tt: "[child_to_leave.GetFirstName] zůstane na tvém [Concept('court','dvoře')|E]"
 fp1_yearly.2000.b.tt: "Zůstane na tvém [Concept('court','dvoře')|E]"
 lust_for_adventure: "Touha po dobrodružství"
 lust_for_adventure_desc: "Tato postava touží po dobrodružství a cestování. Je nepravděpodobné, že se vrátí ke dvoru svých rodičů."
 mellowed_spirit: "Zkrocený duch"
 mellowed_spirit_desc: "Rodič tuto postavu přesvědčil, že dobrodružství není nic pro ni a její místo je doma."
 fp1_yearly.2003.t: "Touha po dobrodružství: Tvrdá láska"
 fp1_yearly.2003.desc: "„Vzdávám se! Vzdávám se, [parent.GetMotherFather]! Už dost!“ vykřikne [child_to_leave.Custom('GetDaughterSon')] [child_to_leave.GetFirstNameNoTooltip].\n\n„Zůstanu tady u dvora. [lover_of_child.GetFirstNameNoTooltip] pro mě není důležitější než vlastní život!“ prohlásí [child_to_leave.GetFirstNameNoTooltip], zatímco [lover_of_child.GetFirstNameNoTooltip] se tváří nesouhlasně.\n\nKonečně se zdá, že [child_to_leave.GetFirstNameNoTooltip] dostává rozum!"
 fp1_yearly.2003.a: "„[parent.GetMotherFather|U] ví nejlíp, [child_to_leave.Custom('GirlBoy')].“"
 fp1_yearly.2003.b: "„A taky se rozejdi s tím [lover_of_child.GetFirstNameNoTooltip]!“"
 fp1_yearly.2000.trigger_failure: "Můj duel proti [child_to_leave.GetFirstNameNoTooltip] už není platný"
 fp1_yearly.2004.t: "Touha po dobrodružství: Řádná nakládačka"
 fp1_yearly.2004.desc: "Po boji končím na zemi [Select_CString(ROOT.Char.IsFemale,'zesláblá','zesláblý')], zatímco se ke mně s připravenou zbraní blíží [child_to_leave.GetFirstNameNoTooltip].\n\n„Už jsem ti to [Select_CString(child_to_leave.IsFemale,'říkala','říkal')], [parent.GetMotherFather]. #EMP Odcházím#!. A za všechny ty potíže si vezmu z pokladnice jeden měšec. Jistě to chápeš.“\n\nNezbývá mi než sledovat, jak [child_to_leave.Custom('GetDaughterSon')] odchází s [lover_of_child.GetFirstNameNoTooltip] po boku a s #EMP mým zlatem#! v ruce."
 fp1_yearly.2004.a: "Drzé dítě..."
 fp1_yearly.2000.b.success: "[child_to_leave.GetFirstNameNoTooltip] se vzdává svých nadějí a snů"
 fp1_yearly.2000.b.failure: "[child_to_leave.GetFirstNameNoTooltip] tvé argumenty nepřesvědčily"
 fp1_yearly.2100.t: "Srdečná rivalita"
 fp1_yearly.2100.desc: "„Ty [lover_2.Custom2('InsultAdjective', SCOPE.sC('lover_1'))] [lover_2.Custom2('InsultNounSexual', SCOPE.sC('lover_1'))]! Ty [lover_2.Custom2('InsultAdjective', SCOPE.sC('lover_1'))] [lover_2.Custom2('InsultNoun', SCOPE.sC('lover_1'))]! [lover_2.Custom2('InsultSentence', SCOPE.sC('lover_1'))|U], ty [lover_2.Custom2('InsultNounSexual', SCOPE.sC('lover_1'))]!“ řve [lover_1.GetFirstName] z plných plic.\n\nZdá se, že se tví milenci pustili jeden do druhého.\n\n„Z toho tvého [lover_1.Custom2('PointOfRidicule', SCOPE.sC('lover_2'))] se [lover_quarrel_target.GetFirstNameNoTooltip] zvedá žaludek, ty [lover_1.Custom2('InsultNounSexual', SCOPE.sC('lover_2'))]! [lover_quarrel_target.GetFirstNameNoTooltip] by nikdy [Select_CString(lover_quarrel_target.IsFemale,'nemohla','nemohl')] milovat někoho takového, jako jsi ty, [lover_1.Custom2('InsultAdjective', SCOPE.sC('lover_2'))] [lover_1.Custom2('InsultNounSexual', SCOPE.sC('lover_2'))]! [Select_CString(lover_quarrel_target.IsFemale,'#EMP Bude jen moje!#!','#EMP Bude jen můj!#!')]“ křičí [lover_2.GetFirstName] a tasí [lover_2.Custom('SignatureWeaponArticle')] [lover_2.Custom('signature_weapon')] od pasu...\n\nTohle skončí krví."
 fp1_yearly.2100.a: "To je ale #EMP vzrušující!#! Ano! Bojujte o mou lásku!"
 fp1_yearly.2100.b: "Tohle je #EMP šílenství!#! Prosím vás, okamžitě přestaňte!"
 fp1_yearly.2100.c: "[Select_CString(ROOT.Char.IsFemale,'Zastavím vás sama!','Zastavím vás sám!')]"
 fp1_yearly.2100.a.tt: "[lover_1.GetFirstName] a [lover_2.GetFirstName] se utkají v #V duelu#! na život a na smrt."
 fp1_yearly.2100.b.tt: "[lover_1.GetFirstName] a [lover_2.GetFirstName] vychladnou."
 fp1_yearly.2101.t: "Srdečná rivalita: Zlomené srdce"
 fp1_yearly.2101.desc: "„Teď jsi jen [Select_CString(lover_quarrel_target.IsFemale,'moje','můj')], [lover_quarrel_target.Custom('RomanticComplimentAdjective')] [lover_quarrel_target.GetFirstNameNoTooltip]! Ten [lover_2.Custom2('InsultNounSexual', SCOPE.sC('winning_lover'))] [losing_lover.GetFirstName] už se mezi nás nikdy nepostaví!“ šeptá [winning_lover.GetFirstName] sladkým hlasem a pokládá svůj [winning_lover.Custom('signature_weapon')] na zem.\n\n„Pojď, [lover_quarrel_target.Custom('RomanticComplimentAdjective')] [lover_quarrel_target.Custom('RomanticComplimentNoun')]. Tahle fraška mě vyčerpala. Co kdybychom se odebrali do tvé [ROOT.Char.Custom('GetChamber')]?“ navrhne [winning_lover.GetFirstNameNoTooltip] svůdným tónem."
 fp1_yearly.2101.a: "Ach, můj [winning_lover.Custom('RomanticComplimentNoun')]! [lover_quarrel_target.GetWomanMan|U] jako já se jen tak okouzlit nenechá, ale ty to umíš!"
 fp1_yearly.2101.b: "[losing_lover.GetFirstNameNoTooltip], ne! #EMP Za tohle zaplatíš, [winning_lover.GetFirstNameNoTooltip]!#!"
 fp1_yearly.2101.c: "Dovádění v posteli? Proč ne."
 fp1_yearly.2101.d: "Prostě... mě teď nech o samotě."
 fp1_yearly.2100.b.success: "Tvá láskyplná slova oba uklidní"
 fp1_yearly.2100.b.failure: "Tvá slova přijdou vniveč"
 fp1_yearly.2100.c.success: "Roztrhneš soupeře od sebe"
 fp1_yearly.2100.c.failure: "Nestihneš zasáhnout včas"
 fp1_yearly.2100.c.tt: "Zabráníš [lover_1.GetFirstName] a [lover_2.GetFirstName] v boji."
 fp1_yearly.2200.t: "Nudící se berserk"
 fp1_yearly.2200.desc: "„Hleďte! Jsem [new_berserker.GetFirstNameNoTooltip], [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('new_berserker'))|U]! Korbele piva! [new_berserker.Custom('AttractionWomanManMultiple')|U]! [new_berserker.Custom('FavoriteTreatDemand')|U]! Nebo poznáte můj hněv!“ křičí [new_berserker.GetWomanMan] na shromážděný dav.\n\nTahle hora svalů se očividně nudí a hledá záminku k potížím. Možná by se ten vztek dal lépe využít v mých řadách?\n\n„Copak se mi nikdo neodváží postavit? Zbabělci! Co bych [Select_CString(new_berserker.IsFemale,'dala','dal')] za pořádnou rvačku...“"
 fp1_yearly.2200.a: "O mé odvaze nebudeš pochybovat, ty [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('new_berserker'))] [new_berserker.Custom2('InsultNoun', ROOT.Char)]!"
 fp1_yearly.2200.b: "[new_berserker.Custom('FavoriteTreatDemand')|U]! Dostaneš toho, co hrdlo ráčí - pokud se přidáš ke mně."
 fp1_yearly.2200.c: "Brzy vyrážíme na nájezd. Přidej se jako [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')]."
 fp1_yearly.2200.d: "[new_berserker.GetWomanMan|U] se utrhl ze řetězu! Stráže, zastavte [Select_CString(new_berserker.IsFemale,'ji','ho')]!"
 fp1_yearly.2200.a.tt: "#V Vyzvi#! [new_berserker.GetFirstName] na duel a přiměj [Select_CString(new_berserker.IsFemale,'ji, aby bojovala','ho, aby bojoval')] ve tvých službách jako [potential_employer.Custom('KnightCultureNoTooltipLowercase')]!\n#weak Tento duel NENÍ na život a na smrt.#!\nI když prohraješ, možná [new_berserker.GetFirstNameNoTooltip] přece jen vychladne...\n\nTvá [Concept('prowess','udatnost')|E]: [prowess_i]#V [potential_employer.GetProwess]#!\n[new_berserker.GetFirstNameNoTooltip] - [Concept('prowess','udatnost')|E]: [prowess_i]#V [new_berserker.GetProwess]#!"
 fp1_yearly.2200.c.success: "[new_berserker.GetFirstNameNoTooltip] souhlasí, že se přidá k tvým řadám"
 fp1_yearly.2200.c.failure: "[new_berserker.GetFirstNameNoTooltip] začne řádit po tvém dvoře"
 fp1_yearly.2200.fail.tt: "Ve svém běsnění [new_berserker.GetFirstNameNoTooltip] zraní [potential_victim.GetFirstName]!"
 hurt_someone_close_to_me_crime: "Ublížení někomu blízkému"
 fp1_yearly.2200.d.success: "Stráže zabijí [new_berserker.GetFirstNameNoTooltip]"
 fp1_yearly.2200.trigger_failure: "Můj duel proti [new_berserker.GetFirstNameNoTooltip] už není platný"
 fp1_yearly.2203.t: "Nudící se berserk: Ukojený hněv"
 fp1_yearly.2203.desc: "„Jsi silnější, než vypadáš!“ vyprskne [new_berserker.GetFirstNameNoTooltip].\n\n[new_berserker.GetWomanMan|U] leží na zemi v krvi a vztek je ukojen... alespoň prozatím.\n\n„[Select_CString(new_berserker.IsFemale,'Ráda bych bojovala','Rád bych bojoval')] po tvém boku. Společně nás #EMP nic nezastaví!#!“ vykřikne."
 fp1_yearly.2203.a: "„Mrzí mě to, ale tvá cesta končí tady.“"
 fp1_yearly.2203.b: "„Bude mi ctí bojovat po tvém boku!“"
 fp1_yearly.2203.c: "„[Select_CString(new_berserker.IsFemale,'Napáchala','Napáchal')] jsi dost škody. Odejdi.“"
 fp1_yearly.2204.t: "Nudící se berserk: Něžné srdce"
 fp1_yearly.2204.desc: "„Mrzí mě to,“ řekne [new_berserker.GetFirstNameNoTooltip] dojatě. „Když mám hlad, snadno se rozzuřím.“\n\n[new_berserker.GetWomanMan|U] ke mně napřáhne ruku a pomůže mi vstát. Vztek už zřejmě pominul... alespoň prozatím.\n\n„Náš boj se mi líbil. [Select_CString(new_berserker.IsFemale,'Ráda se k tobě přidám','Rád se k tobě přidám')].“"
 fp1_yearly.2204.a: "„A já tě s radostí přijmu!“"
 fp1_yearly.2204.b: "„Prosím, prostě odejdi...“"
 grizzled_veterans: "Ostřílení veteráni"
 glory_seekers: "Hledači slávy"
 fp1_yearly.2300.t: "Hledači slávy"
 fp1_yearly.2300.desc: "Hostince v [tavern_location.GetNameNoTier] v poslední době zaplavili bojovníci toužící po slávě.\n\nMezi nimi je skupina starých, bitvami zocelených veteránů - huskarlů, kteří hledají někoho, kdo bude jejich [recruiting_character.Custom('MistressMaster')].\n\nJe tu také celý zástup nadšených mladých mužů, kteří nepřestávají mluvit o hledání slávy na cizích březích.\n\nMožná by stálo za to některé z nich najmout?"
 fp1_yearly.2300.a: "Přijmu huskarly do své družiny."
 fp1_yearly.2300.b: "Mladí muži nemají zkušenosti - ale je jich spousta!"
 fp1_yearly.2300.c: "Je čas zdvojnásobit cenu piva!"
 fp1_yearly.2300.d: "Přidejte se ke mně, stateční bojovníci! Dovedu vás k vítězství!"
 huscarls_tt: "#F Huskarli jsou houževnatí bojovníci první linie, kteří dokážou slabším jednotkám způsobit těžké ztráty#!"
 bondi_tt: "#F Bondí jsou odolní a vynikají v boji na pláních a polích cizích zemí#!"
 fp1_yearly.2400.t: "Přípravy na lov"
 fp1_yearly.2400.desc: "Divočina mě volá. Od posledního lovu uplynulo příliš mnoho času. Tam venku, v [ROOT.Char.Custom('TerrainType')] v [hunting_province.GetName], je spousta [ROOT.Char.Custom('GetAnimalAdjective')] [ROOT.Char.Custom('GetAnimalPlural')]. Něco z té zvěře by se dnes večer pěkně vyjímalo na mém stole!\n\nNěco mi ale chybí. Jsou mé lovecké oštěpy příliš staré a tupé? Nebo mi schází společník?\n\nMusím se dobře připravit."
 fp1_yearly.2400.a: "Potřebuji nového loveckého psa!"
 fp1_yearly.2400.eagle: "Lovecký orel by mi dobře posloužil!"
 fp1_yearly.2400.b: "Nově vykované oštěpy a šípy opeřené havraním peřím."
 fp1_yearly.2400.c: "To, co mám, stačí. Potřebuji jen čas na přípravu."
 fp1_yearly.2400.free_hunt: "Tvůj příští [GetActivityType('activity_hunt').GetName] tě nebude stát žádné [Concept('gold','zlato')|E]"
 brand_new_hunting_tools: "Zbrusu nové lovecké vybavení"
 brand_new_hunting_tools_desc: "Tato postava utratila značné množství zlata za nové lovecké vybavení."
 fp1_yearly.2500.t: "Prostopášný runový kámen"
 fp1_yearly.2500.desc: "Po docela dlouhé cestě přes [runestone_location.Custom('TerrainTypeCountyScope')] v [runestone_location.GetNameNoTier] dorazím k runovému kameni své rodiny. Jenže místo není prázdné: je tu i [deviant_guest.GetTitledFirstName], [Select_CString(deviant_guest.IsFemale,'která pobývá','který pobývá')] u mého dvora - jak se sem vůbec [Select_CString(deviant_guest.IsFemale,'dostala','dostal')]?!\n\n„Není to tak, jak to vypadá, [ROOT.Char.GetTitleTierName]!“ tvrdí [deviant_guest.GetFirstNameNoTooltip].\n\nTo, že je [Select_CString(deviant_guest.IsFemale,'napůl nahá','napůl nahý')] a právě se s vervou otírá o #EMP runový kámen mé rodiny#!, mi napovídá, že je to ve skutečnosti přesně tak, jak to vypadá."
 fp1_yearly.2600.t: "Zuřivost Seveřanů"
 fp1_yearly.2600.desc: "„[ROOT.GetCharacter.GetFirstNameNoTooltip], [Select_CString(ROOT.GetCharacter.IsFemale,'jsi skvělá válečnice','jsi skvělý válečník')], ale mají z tebe nepřátelé #EMP opravdu#! strach?“ ptá se [berserker_teacher.GetFirstName].\n\nDobře znám nelidskou zuřivost, do níž se [berserker_teacher.GetFirstNameNoTooltip] dokáže na bojišti uvést, i pohled na nespočet nepřátel prchajících před tím řevem. Sledovat berserkergang [berserker_teacher.GetFirstNameNoTooltip] je jako spatřit [ROOT.GetCharacter.GetFaith.HighGodNamePossessive] hněv.\n\n„Pojď ke mně před oheň. Probudíme tvou zuřivost.“ [berserker_teacher.GetFirstNameNoTooltip] mě pobídne."
 fp1_yearly.2600.a: "Jen si dojdu pro medvědí kožešinu!"
 fp1_yearly.2600.b: "Ne, raději mám vše plně pod kontrolou."
 fp1_yearly.2600.a.tt: "Pokusíš se získat rys [GetTrait('berserker').GetName( GetNullCharacter )]\n#weak Může to mít svá rizika...#!"
 fp1_yearly.2600.b.tt: "Vzdáš se příležitosti získat rys [GetTrait('berserker').GetName( GetNullCharacter )]"
 fp1_yearly.2601.desc: "Sedíme u ohně a pronášíme slova naplněná velikou mocí - zatínám zuby a zavírám oči. Tělem mi probíhá mráz, něco se ve mně probouzí... něco mě objímá.\n\nZ běsnění se probírám, "
 fp1_yearly.2601.success_no_one_harmed: "[berserker_teacher.GetFirstName] po mém boku.\n\n„To byla opravdu působivá zuřivost! Ty klády neměly šanci!“ usměje se [berserker_teacher.GetFirstNameNoTooltip].\n\nTakže mé běsnění trvalo celou noc! Alespoň nám na několik týdnů nebude chybět dříví..."
 fp1_yearly.2601.success_harm_close_one: "[berserker_teacher.GetFirstName] mě svírá za ramena.\n\n„Vzpamatuj se! [harmed_victim.GetFirstName] není proti tobě!“ křičí [berserker_teacher.GetFirstNameNoTooltip].\n\n[ROOT.GetCharacter.GetFaith.HighGodName]! [Select_CString(ROOT.GetCharacter.IsFemale,'Co jsem to udělala?!','Co jsem to udělal?!')]"
 fp1_yearly.2601.success_kill_berserker: "vedle mě leží zohavené tělo [berserker_teacher.GetFirstNamePossessive]. Dívám se na své sevřené pěsti, v obou svírám zakrvácené sekery...\n\n[ROOT.GetCharacter.GetFaith.HighGodName]! [Select_CString(ROOT.GetCharacter.IsFemale,'Co jsem to udělala?!','Co jsem to udělal?!')]"
 fp1_yearly.2601.success_kill_everyone: "všude kolem mě je krev. Všichni jsou mrtví. #EMP Všichni jsou mrtví.#!\n\n[Select_CString(ROOT.GetCharacter.IsFemale,'#EMP Co jsem to udělala?!#!','#EMP Co jsem to udělal?!#!')]"
 fp1_yearly.2601.fail_fall_asleep: "cítím se svěže jako novorozeně! [berserker_teacher.GetFirstName] na mě hledí nespokojeně.\n\n„Tak co, příjemný spánek? A přitom se zdálo, že v tobě něco je...“ pronese [berserker_teacher.GetFirstNameNoTooltip] a vrtí hlavou.\n\nTakže mé běsnění bylo jen snem!"
 fp1_yearly.2601.a: "Už aby byla další bitva!"
 fp1_yearly.2601.b: "Za tímhle musí stát [ROOT.Char.GetFaith.TricksterGodName]..."
 fp1_yearly.2601.c: "No ne! Alespoň se cítím skvěle!"
