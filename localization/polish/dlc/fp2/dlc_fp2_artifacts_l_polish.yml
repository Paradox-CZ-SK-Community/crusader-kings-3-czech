l_polish:
 fp2_chalice_dona_urraca: "Kalich doñi Urraky"
 fp2_chalice_dona_urraca_desc: "Rituální kalich vyřezaný z nejtemnějšího onyxu a posázený drahokamy a zlatou filigránovou mřížkou. Vznikl na objednávku [owner.GetTitledFirstName] na počest církve."
 fp2_santiago_aquamanile: "(Bývalé) $fp2_santiago_bells$"
 fp2_santiago_aquamanile_desc: "[reforger.GetTitledFirstName|U] nechal roztavený kov z $fp2_santiago_bells$ překovat v tyto džbány. Ačkoli se dnes používají k rituálnímu omývání rukou, už jejich samotná existence potvrzuje nadřazenost islámu nad křesťanstvím."
 fp2_santiago_aquamanile_melted_desc: "Někdejší $fp2_santiago_bells$ byly #EMP opět#! roztaveny, naposledy zásluhou [reforger.GetTitledFirstName], a patří tak k nejspornějším džbánům na vodu, jaké existují. Jejich současná podoba hlásá nadřazenost islámu v Ibérii."
 fp2_santiago_aquamanile_melted_tally_desc: "$fp2_santiago_aquamanile_melted_desc$\n\nTento opakovaně přetavovaný kov změnil majitele [ROOT.Var('artefact_santiago_bells').GetValue]-krát."
 fp2_santiago_bells: "Zvony ze Santiaga"
 fp2_santiago_bells_desc: "Proslulé zvony ze Santiaga de Compostela jsou působivou, prostou a především #EMP hlasitou#! připomínkou neochvějné duchovní autority svatého Jakuba."
 fp2_santiago_bells_melted_desc: "Proslulé zvony ze Santiaga de Compostela byly získány zpět z rukou nevěřících, roztaveny a [reforger.GetTitledFirstName] je [Select_CString(reforger.IsFemale,'navrátila','navrátil')] do podoby blízké té původní. Jejich hlas nyní přináší útěchu celému křesťanstvu."
 fp2_santiago_bells_melted_tally_desc: "$fp2_santiago_bells_melted_desc$\n\nTento opakovaně přetavovaný kov změnil majitele [ROOT.Var('artefact_santiago_bells').GetValue]-krát."
 fp2_armillary_sphere: "Armilární sféra"
 fp2_armillary_sphere_desc: "Důmyslný astrologický přístroj, jehož zpracování je [SCOPE.Custom('ArtifactQuality')]. Kruhy jsou vyřezány z materiálu [newly_created_artifact.GetFeatureText( 'generic_material_wood' )] a zdobí je intarzie z materiálu [newly_created_artifact.GetFeatureText( 'decoration_material_inlay' )]. V úžasných detailech znázorňují spletité dráhy nebeské klenby."
 fp2_2p_chess_board: "Šťastná šachovnice"
 fp2_2p_chess_board_desc: "[bg_victor.GetTitledFirstName] [Select_CString(bg_victor.IsFemale,'zvítězila','zvítězil')] v památné partii a [bg_loser.GetTitledFirstName] [Select_CString(bg_loser.IsFemale,'utrpěla','utrpěl')] drtivou porážku. Právě tehdy tato pomůcka ke kratochvíli poprvé prokázala své pověstné štěstí."
 fp2_4p_chess_board: "Šachovnice pro čtyři hráče"
 fp2_4p_chess_board_desc: "Po šachové partii, v níž [bg_victor.GetTitledFirstName] [Select_CString(bg_victor.IsFemale,'zvítězila','zvítězil')] a [bg_loser.GetTitledFirstName] [Select_CString(bg_loser.IsFemale,'prohrála','prohrál')], bylo prvním nápadem oslavit toto herní mistrovství vytvořením vylepšené varianty tak specifické, že ji nakonec nikdo nikdy nechtěl hrát."
 fp2_votive_crowns: "Vizigótská votivní koruna"
 fp2_votive_crowns_desc: "Tato koruna byla určena k zavěšení nad kostelním oltářem či kolem něj, případně na soše. Obětovat Bohu votivní korunu znamená vyjádřit podřízenost autoritě vyšší, než jakou může mít kterýkoli pozemský panovník."
 fp2_andalusian_aquamanile: "Rituální akvamanile"
 fp2_andalusian_aquamanile_desc: "Nádherná konvice z materiálu [newly_created_artifact.GetFeatureText( 'goblet_material' )], zdobená pozlacenou intarzií z materiálu [newly_created_artifact.GetFeatureText( 'decoration_material_inlay' )], určená k uchovávání vody pro rituální omývání rukou."
