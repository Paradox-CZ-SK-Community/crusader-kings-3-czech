l_polish:
 rice_fields_modifier: "Rýžová pole"
 rice_fields_modifier_desc: "Rolníci v tomto [Concept('county','hrabství')|E] pěstují výživnou rýži, která jim plní žaludky a dává vzniknout novým pokrmům."
 fp2_flavor.0001.t: "Úroda nových nápadů"
 fp2_flavor.0001.desc: "[rice_propagator.GetTitledFirstNamePossessive] hlavní město skutečně vzkvétá. Rolníci v [rice_propagator_capital.GetNameNoTier] mají plná břicha a jsou spokojení – a #EMP výkonní!#!\n\nMuslimové do svých zemí přinesli novou plodinu – rýži. Snadno se pěstuje a lidé se z ní dobře najedí. Že by právě v tom spočívala část jejich úspěchu? Výkonnější rolnictvo by se hodilo i mně...\n\nCo takhle založit rýžová pole i v mém hlavním městě? Jenže jak začít?"
 fp2_flavor.0001.a: "Zlato rozváže [rice_propagator.GetFirstNamePossessiveNoTooltip] jazyk."
 fp2_flavor.0001.b: "Přátelství přece něco znamená. O tajemství se se mnou jistě [Select_CString(rice_propagator.IsFemale,'ráda podělí','rád podělí')]."
 fp2_flavor.0001.c: "To tajemství bude moje... pošlu špeha."
 fp2_flavor.0001.d: "Zapomeň na to. S muslimy jednat nebudu."
 fp2_flavor.0001.b.success: "[rice_propagator.GetFirstNameNoTooltip] se nechá přesvědčit"
 fp2_flavor.0001.b.failure: "[rice_propagator.GetFirstNameNoTooltip] bere tvé naléhání jako urážku"
 fp2_flavor.0001.c.success: "Tvůj špeh ukradne tajemství"
 fp2_flavor.0001.c.failure: "[rice_propagator.GetFirstNameNoTooltip] zuří"
