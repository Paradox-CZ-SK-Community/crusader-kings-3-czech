 fp2_struggle.2050.t_muslim_one: "$fp2_struggle.2050.title_main_ichi$ $fp2_struggle.2050.t_about_muslim$"
 fp2_struggle.2050.t_muslim_two: "$fp2_struggle.2050.title_main_ni$ $fp2_struggle.2050.t_about_muslim$"
 fp2_struggle.2050.t_muslim_three: "$fp2_struggle.2050.title_main_san$ $fp2_struggle.2050.t_about_muslim$"
 fp2_struggle.2050.t_muslim_four: "$fp2_struggle.2050.title_main_shi$ $fp2_struggle.2050.t_about_muslim$"
 fp2_struggle.2050.desc_court: "Po mém dvoře se jako jiskry před požárem šíří šeptanda. Zdá se, že všichni kolem mě věří, že [fp2_2050_el_cid.GetFullName] jednal za mými zády.\n\nMluví se o zpronevěřeném tributu, válkách vedených bez svolení a dalších činech, kvůli nimž můj dvůr začíná zpochybňovat mou autoritu. O bezúhonnosti [fp2_2050_el_cid.GetFirstName] nepochybuji, ale mohu si dovolit držet u dvora muže, kolem něhož se rojí takové zvěsti? Teď už je nezastavím a pokud brzy nezasáhnu, budu vypadat slabě."
 fp2_struggle.2050.desc_knights: "Když procházím svým [ROOT.GetCharacter.Custom('FortifiedBuilding')], všimnu si, že [ROOT.GetCharacter.Custom('KnightCulturePluralNoTooltipLowercase')] jsou všichni skleslí. Přítomnost [fp2_2050_el_cid.GetFullNameNicknamed] inspiruje obyčejné vojáky k velkým činům, ale [ROOT.GetCharacter.Custom('KnightCulturePluralNoTooltipLowercase')] urozeného původu v jeho záři blednou.\n\n[fp2_2050_el_cid.GetFirstNameNicknamed] je nadaný velitel a válečník hodný legend, takže o jeho přínosu pro mé vojsko není pochyb. Jestliže však síla jediného muže oslabuje všechny ostatní... mohu si opravdu dovolit ponechat takový vliv mezi svými [ROOT.GetCharacter.Custom('KnightCulturePluralNoTooltipLowercase')]?"
 fp2_struggle.2050.desc_nobles: "V poslední době za mnou přicházejí šlechtici z celého panství a zahrnují mě obavami, klepy i otevřeně nepřátelskými poznámkami o [fp2_2050_el_cid.GetFirstNameNicknamed]. Je zřejmé, že se šlechtě nelíbí přízeň, kterou [fp2_2050_el_cid.GetFirstName] požívá, a chce tohoto povýšence vypudit dřív, než jeho příkladu začnou následovat další lidé prostého původu. [fp2_2050_el_cid.GetFirstName] sice kdysi sám patřil ke šlechtě, nyní je však [ROOT.GetCharacter.Custom('KnightCultureNoTooltipLowercase')], který se vypracoval vlastními silami, a mnozí jej proto považují za hrozbu pro společenský řád panství.\n\nRozhodnutí je na mně, ale pokud [fp2_2050_el_cid.GetFirstName] zůstane, mé postavení mezi šlechtou tím utrpí."
 fp2_struggle.2050.desc_faith: "Kamkoli přijdu, v očích svých [ROOT.Char.Custom('DefaultPriestTitlePlural')] vidím nedostatek úcty. Šíří se nepodložené zvěsti, že mě touha po půdě a zlatě svedla natolik, že už nedbám na to, co káže [ROOT.GetCharacter.GetFaith.HighGodName], a raději stojím po boku bezvěrců a žoldnéřů, jako je [fp2_2050_el_cid.GetFirstNameNicknamed], kterým je lhostejné, za koho bojují.\n\nJejich pošetilé mysli zastírají romantické představy o rytířském válčení, v němž svou víru hájí pouze zbožní. Ve skutečnosti však náš způsob života chrání právě lidé jako on. Přesto, pokud si chci zachovat přízeň duchovenstva, možná nastal čas uvažovat o vyhnání [fp2_2050_el_cid.GetFirstName]."
 fp2_struggle.2050.a: "[ROOT.Char.Custom2('RelationToMe', fp2_2050_el_cid)|U] si mou důvěru zaslouží a zůstane!"
 fp2_struggle.2050.a.serve_tooltip: "[fp2_2050_el_cid.GetFirstNameNicknamedNoTooltip] ti nadále slouží."
 fp2_struggle.2050.a.notif.t: "[fp2_2050_el_cid.GetNicknameNoTooltip|U] zůstává"
 fp2_struggle.2050.b: "[fp2_2050_el_cid.GetFirstNameNoTooltip] mi bude dál sloužit, ať si říká kdo chce co chce!"
 fp2_struggle.2050.c: "Možná je načase nechat ho odejít..."
 fp2_struggle.2050.c.notif: "[fp2_2050_el_cid.GetFirstNameNicknamedNoTooltip] si bude hledat místo jinde..."
 fp2_struggle.2051.t: "[fp2_2050_el_cid.GetFirstNameNicknamedNoTooltip]"
 fp2_struggle.2051.desc: "K mému dvoru dorazil proslulý rytíř [fp2_2050_el_cid.GetFullName], známý také jako „[fp2_2050_el_cid.GetNicknameNoTooltip|U]“, a hledá pána, kterému by mohl sloužit. Je bezpochyby nadaným velitelem a válečníkem hodným legend.\n\n[fp2_2050_el_cid.GetFirstNameNoTooltip] nemá problém sloužit komukoli, kdo jej přivítá s otevřenou náručí. Nabízí se mi příležitost získat rytíře, který by mohl vlastními silami zvrátit průběh bitvy."
 fp2_struggle.2051.a: "Ach, vítej! U mého dvora získáš vysoké postavení."
 fp2_struggle.2051.b: "Muž tvého nadání je v mém panství vždy vítán."
 fp2_struggle.2051.c: "Hledej službu jinde, [fp2_2050_el_cid.GetFirstNameNoTooltip]."
 fp2_struggle.2004.t: "Mocnější loďstvo"
 fp2_struggle.2004.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('2004_scoped_steward'))|U] [2004_scoped_steward.GetFirstName] mi oznamuje, že [Select_CString(2004_scoped_steward.IsFemale,'její','jeho')] kronikáři se vrátili z cest, během nichž zkoumali námořní technologie za vzdálenými moři. [2004_scoped_steward.GetFirstName] tvrdí, že s dostatečným financováním bychom mohli navrhnout nový typ lodi, který by předčil plavidla našich sousedů a přinesl [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] éru námořní nadvlády.\n\n[2004_scoped_marshal.GetCouncilTitleFirstName] by však ono zlato mnohem raději utratil[Select_CString(2004_scoped_marshal.IsFemale,'a','')] za něco jiného než obchodní lodě."
 fp2_struggle.2004.a: "Považuj svůj podnik za financovaný."
 fp2_struggle.2004.a.a.desc: "Do služby jsou zavedeny nové konstrukce lodí"
 fp2_struggle.2004.a.b.desc: "Lodní stavitelé v [fp2_2004_dockyards.GetNameNoTierNoTooltip] získají věhlas jako mistři svého řemesla"
 fp2_struggle.2004.b: "Ty peníze najdou lepší využití jinde."
 fp2_struggle.2004.b.desc: "Odmítneš úsilí [2004_scoped_steward.GetFirstNameNoTooltip] a peníze si ponecháš"
 fp2_struggle.2004.c: "Nechci nový typ lodi. Chci loď z ryzího stříbra!"
 fp2_struggle.2004.c.desc: "Vsadíš své jmění na šanci získat mimořádný věhlas a shromáždíš nejlepší řemeslníky, aby postavili nemožné – loď z ryzího stříbra."
 fp2_struggle.2005.t: "Loďstvo, které předběhlo dobu"
 fp2_struggle.2005.t.alt: "[fp2_2004_dockyards.GetNameNoTier]: mistři lodního řemesla"
 fp2_struggle.2005.desc: "Nové lodě mají následující konstrukci:"
 fp2_struggle.2005.desc.intro: "„[Select_CString(ROOT.Char.IsFemale,'Má paní','Můj pane')], konečně jsou naše lodě připraveny vyplout!“ oznamuje [2005_scoped_steward.GetFirstName]. „Věřím, že s jejich konstrukcí budete nanejvýš [Select_CString(ROOT.Char.IsFemale,'spokojena','spokojen')].“\n\n"
 fp2_struggle.2005.desc.cirt.notif: "Nová konstrukce slaví mimořádný úspěch! V [fp2_2004_dockyards.GetNameNoTier] dokonce vznikly nové loděnice určené výhradně ke stavbě těchto převratných plavidel.\n\n"
 fp2_struggle.2005.desc.cirt.a.notif: "Bohužel od zahájení stavby přešel [fp2_2004_dockyards.GetName] do rukou [fp2_2004_dockyards.GetHolder.GetName]. Návrhy lodí se nám podařilo zachránit, ale loděnice teď patří jim.\n\n"
 fp2_struggle.2005.desc.newdesigner.notif: "Původní návrhář [2004_scoped_steward.GetFirstName] už s námi není, ale [2005_scoped_steward.GetFirstNameNicknamed] [Select_CString(2005_scoped_steward.IsFemale,'dokázala','dokázal')] převzít vedení a projekt dokončit i bez [Select_CString(2004_scoped_steward.IsFemale,'ní','něj')].\n\n"
 fp2_struggle.2005.desc.bottom.generic: "Spodek lodi tvoří"
 fp2_struggle.2005.desc.bottom.a: "$fp2_struggle.2005.desc.bottom.generic$ plochý kýl, který zajišťuje stabilní plavbu v klidných vodách. "
 fp2_struggle.2005.desc.bottom.b: "$fp2_struggle.2005.desc.bottom.generic$ vodotěsná přepážka navržená tak, aby při poškození zabránila potopení. "
 fp2_struggle.2005.desc.bottom.c: "$fp2_struggle.2005.desc.bottom.generic$ ostrý a hluboký kýl, který dokáže nesmírnou rychlostí rozrážet vlny! "
 fp2_struggle.2005.desc.bottom.d: "$fp2_struggle.2005.desc.bottom.generic$ žebra s klinkerovou obšívkou, díky nimž je trup zároveň pevnější i lehčí. "
 fp2_struggle.2005.desc.unique.init: "Nad ním se nachází nejpozoruhodnější prvek lodi —"
 fp2_struggle.2005.desc.unique.a: "$fp2_struggle.2005.desc.unique.init$ mohutný dvojitý výložník zajišťující bezkonkurenční stabilitu. "
 fp2_struggle.2005.desc.unique.b: "$fp2_struggle.2005.desc.unique.init$ vyvýšené dřevěné bašty na obou koncích trupu, z nichž mohou lučištníci zasypávat nepřítele šípy. "
 fp2_struggle.2005.desc.unique.c: "$fp2_struggle.2005.desc.unique.init$ impozantní nástavba na palubě připomínající hrad. "
 fp2_struggle.2005.desc.unique.d: "$fp2_struggle.2005.desc.unique.init$ dřevěná střecha pokrytá hroty, která má odradit nepřítele od nalodění. "
 fp2_struggle.2005.desc.unique.e: "$fp2_struggle.2005.desc.unique.init$ beran na přídi určený k prorážení nepřátelských lodí při přímém střetu. "
 fp2_struggle.2005.desc.sails.init: "Nakonec loď pohání"
 fp2_struggle.2005.desc.sails.a: "$fp2_struggle.2005.desc.sails.init$ velké soustavy čtvercových plachet nad sebou, které naplno využívají mořský vítr."
 fp2_struggle.2005.desc.sails.b: "$fp2_struggle.2005.desc.sails.init$ mohutné překrývající se lugrové plachty hodné těch největších plavidel."
 fp2_struggle.2005.desc.sails.c: "$fp2_struggle.2005.desc.sails.init$ složité předozadní oplachtění umožňující mimořádnou obratnost."
 fp2_struggle.2005.desc.sails.d: "$fp2_struggle.2005.desc.sails.init$ mnoho dlouhých řad vesel, díky nimž je plavidlo stejně neochvějné jako vůle těch, kdo je pohánějí."
 fp2_struggle.2005.desc.outro: "\n\n„Působivé, nemyslíte?“ ptá se [2005_scoped_steward.GetFirstNameNicknamed]."
 fp2_struggle.2005.desc.outro.crit: "\n\n„Tohle nám zaručeně přinese éru námořní nadvlády!“ hrdě prohlašuje [2005_scoped_steward.GetFirstNameNicknamed]."
 fp2_struggle.2005.a: "[Select_CString(2005_scoped_steward.IsFemale,'Odvedla','Odvedl')] jsi dobrou práci."
 fp2_struggle.2005.a.a: "Škoda těch loděnic, ale lodě nám alespoň zůstaly."
 fp2_struggle.2005.desc.alt.a: "Potopené stříbro"
 fp2_struggle.2005.desc.alt.a.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('2005_scoped_steward'))|U] [2005_scoped_steward.GetFirstName] ke mně opatrně přichází, protože dobře ví, jak těžce ponesu zprávu o výsledku našeho pokusu přimět stříbro plavat.\n\n„Přes veškeré naše úsilí je stavět loď z kovu čiré šílenství. Jakmile byla dokončena, vyplula z přístavu a vzápětí se potopila do mořské propasti. Značná část naší pokladnice teď leží mimo dosah pod nelítostnými vlnami. Je mi to líto, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')].“\n\n"
 fp2_struggle.2005.desc.alt.b: "Stříbrná plavidla"
 fp2_struggle.2005.desc.alt.b.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('2005_scoped_steward'))|U] [2005_scoped_steward.GetFirstName] od začátku věděl[Select_CString(2005_scoped_steward.IsFemale,'a','')], že má jít jen o okázalou podívanou, která nám přinese věhlas. Lodě z kovu přece nikdy nebudou plavat, ať technika pokročí sebevíc.\n\nProto se [2005_scoped_steward.GetFirstName] místo vážného pokusu o nemožné spokojil[Select_CString(2005_scoped_steward.IsFemale,'a','')] s tím, že dřevěné plavidlo pokryl[Select_CString(2005_scoped_steward.IsFemale,'a','')] tenkou vrstvou stříbra a oklamal[Select_CString(2005_scoped_steward.IsFemale,'a','')] přihlížející. O mně a mé nové „kovové lodi“ teď mluví celé město a závidí nám celý svět!\n\n"
 fp2_struggle.2006.t: "Hranice víry"
 fp2_struggle.2006.desc: "[fp2_2006_vassal_in_crisis.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fp2_2006_vassal_in_crisis'))]) za mnou přichází v soukromí a v očích se zračí hluboké pochybnosti.\n\n[fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip] mi vysvětluje, že víra začala ochabovat během služby na hranici s územím, kde převládá [fp2_2006_foreign_faith.GetNameNoTooltip], a kvůli bratříčkování s nepřítelem. Je zřejmé, že nejde o pouhé řeči. Stačila by sebemenší chyba a [fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip] by mohl[Select_CString(fp2_2006_vassal_in_crisis.IsFemale,'a','')] zavrhnout [ROOT.Char.GetFaith.HighGodNamePossessive] učení.\n\nPřesto se nabízí příležitost posílit nejen naši náboženskou horlivost, ale i náš vzájemný vztah."
 fp2_struggle.2006.a: "„Zavolejte někdo kněze!“"
 fp2_struggle.2006.a.a: "[fp2_2006_vassal_in_crisis.GetTitledFirstNameNoTooltip] stále pochybuje"
 fp2_struggle.2006.a.b: "[2006_scoped_chaplain.GetTitledFirstNameNoTooltip] svou přítomností [fp2_2006_vassal_in_crisis.GetTitledFirstNameNoTooltip] znepokojí"
 fp2_struggle.2006.a.c: "[2006_scoped_chaplain.GetCouncilTitleFirstNameNoTooltip] rozptýlí pochybnosti, které trápí [fp2_2006_vassal_in_crisis.GetTitledFirstNameNoTooltip]"
 fp2_struggle.2006.a.desc: "Situaci má vyřešit [2006_scoped_chaplain.GetCouncilTitleFirstNameNoTooltip]. [fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip] se bude cítit zrazeně, protože jsi o těchto trápeních řekl někomu dalšímu."
 fp2_struggle.2006.b: "Znovu v tobě zažehnu náboženské zanícení."
 fp2_struggle.2006.b.a.desc: "[fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip] tvůj pokus přijme s nelibostí"
 fp2_struggle.2006.b.b.desc: "Díky tobě [fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip] znovu získá jistotu ve své víře"
 fp2_struggle.2006.c: "„Vyber si jakoukoli víru, jen když budeš #emphasis sloužit#! #BER mně#!.“"
 fp2_struggle.2006.c.desc: "O své víře smí [fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip] rozhodnout podle vlastního uvážení."
 fp2_struggle.2006.c.notif.t: "Svoboda mezi přáteli"
 fp2_struggle.2006.d: "Pohrozím obviněním z kacířství."
 fp2_struggle.2006.d.notif.t: "Pochybnosti zahnané strachem"
 fp2_struggle.2006.e: "„Zapomeň na otázky víry, #emphasis přijmi čarodějnictví!#!“"
 fp2_struggle.2006.e.alreadywitch: "[fp2_2006_vassal_in_crisis.GetFirstName] už [Select_CString(fp2_2006_vassal_in_crisis.IsFemale,'byla čarodějnice','byl čaroděj')]! Vůbec nešlo o krizi víry. Jen [Select_CString(fp2_2006_vassal_in_crisis.IsFemale,'potřebovala','potřeboval')] přítele, který by [Select_CString(fp2_2006_vassal_in_crisis.IsFemale,'jí','mu')] rozuměl."
 fp2_struggle.2006.generic.notif.a.t: "Vazal přijímá [fp2_2006_foreign_faith.GetNameNoTooltip]"
 fp2_struggle.2006.generic.notif.b.t: "Vazal zůstává věrný"
 fp2_struggle.2006.e.notif.t: "Čarodějnické spříznění"
 fp2_struggle.2006.e.tacticalwitchfaithchange: "Novou vírou se stane [fp2_2006_foreign_faith.GetName], čímž se vyhne pronásledování"
 fp2_flavor.3001.t: "Když umírám"
 fp2_flavor.3001.desc: "Vítr je čím dál chladnější a dny temnější, kratší a tišší. Trůn vypadá stejně jako v den mého nástupu. Trůn bude vždy vypadat stejně. Ale já ne.\n\nJe čas připravit se na nevyhnutelné. Než odejdu, nechám si zhotovit epitaf, abych mohl[Select_CString(ROOT.Char.IsFemale,'a','')] spočinout v pokoji."
 fp2_flavor.3001.a: "Posvátná [SCOPE.Custom('IberiaSacredLanguage')] je naše volba."
 fp2_flavor.3001.b: "Tím ale nemluvíme všichni. [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip|U] je jazyk mého lidu."
 fp2_flavor.3001.c: "Nebudu mezi nimi dělat rozdíly. [SCOPE.Custom('IberiaSacredLanguage')] i [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] dostanou své místo."
 fp2_flavor.3001.d: "Nežijeme tu sami."
 IberiaSacredLanguage_hebrew: "hebrejština"
 IberiaRomanceLanguage_castilian: "kastilština"
 IberiaRomanceLanguage_sephardi: "sefardština"
 IberiaRomanceLanguage_mozarabic: "mozarabština"
 fp2_epitaph_modifier: "Vícejazyčný epitaf"
 fp2_flavor.3011.t: "Nečekaný krok"
 fp2_flavor.3011.desc: "[ROOT.Char.Custom('GetChamber')|U] – tam se [Select_CString(fp2_flavor_3011_best_friend.IsFemale,'má nejlepší přítelkyně','můj nejlepší přítel')] [fp2_flavor_3011_best_friend.GetFirstName] před vstupem nemusí ohlašovat. Ach, ten radostný úsměv mě nikdy nepřestane těšit. Ale... dnes je něco jinak. Vlasy jsou dokonale upravené a oděv stejně okázalý jako elegantní.\n\n„[ROOT.Char.GetFirstNameNoTooltip], [Select_CString(ROOT.Char.IsFemale,'má nejdražší přítelkyně','můj nejdražší příteli')]! [ROOT.Char.Custom('ResidenceBuilding')|U]... a ty tu úplně [Select_CString(ROOT.Char.IsFemale,'sama','sám')]! Nic mi nedělá větší radost než tvoje drahocenná společnost, a [Select_CString(fp2_flavor_3011_best_friend.IsFemale,'kdybych mohla – ach, kdybych jen mohla! – strávila bych','kdybych mohl – ach, kdybych jen mohl! – strávil bych')] s tebou všechny dny i noci právě tady. A to místo? [ROOT.Char.Custom('GetRoom')|U]!“"
 fp2_flavor.3011.a: "A je tu jen jedna postel."
 fp2_flavor.3011.b: "Najdu ti ubytování, které tě bude hodno!"
 fp2_flavor.3011.c_spouse: "[Select_CString(ROOT.Char.IsFemale,'Jsem vdaná!','Jsem ženatý!')]"
 fp2_flavor.3011.c: "[Select_CString(ROOT.Char.IsFemale,'Jsem sama přesně tak, jak chci.','Jsem sám přesně tak, jak chci.')]"
 fp2_flavor.3021.t: "Nevkusný večer"
 fp2_flavor.3021.desc: "Když mě dnes večer [Select_CString(fp2_flavor_3021_best_friend.IsFemale,'pozvala má drahá přítelkyně','pozval můj drahý přítel')] [fp2_flavor_3021_best_friend.GetFirstName], ani ve snu by mě nenapadlo, že mokrá kůže pojídaná v jeskyni může znít lákavěji.\n\nOtočím hlavu právě ve chvíli, kdy jeden z hostů odhalí své hnisající rány. „Tuhle jsem si udělal, když jsem sral!“\n\n„To je ale příjemný večer, viď?“ [fp2_flavor_3021_best_friend.GetFirstNameNoTooltip] ke mně přistoupí s pohárem v ruce. S ruměncem ve tváři se stále usmívá a ani mizerná atmosféra, mizerná konverzace a mizerné jídlo ten úsměv nedokážou pokazit."
 fp2_flavor.3021.a: "Příjemnější už být nemůže!"
 fp2_flavor.3021.b: "A-ano, [fp2_flavor_3021_best_friend.GetFirstNameNoTooltip]... já – totiž, t-tenhle večer je..."
 fp2_flavor.3021.c: "[fp2_flavor_3021_best_friend.GetFirstNameNoTooltip] by [Select_CString(fp2_flavor_3021_best_friend.IsFemale,'měla','měl')] znát pravdu."
 fp2_flavor.3021.d: "Bohužel je čas odejít."
 fp2_flavor.3021.b.success_tt: "[fp2_flavor_3021_best_friend.GetFirstNameNoTooltip] pochopí, co ti vadí"
 fp2_flavor.3021.b.success: "Rozhovor dopadl dobře"
 fp2_flavor.3021.b.fail: "Trapný rozhovor"
 fp2_james.0001.t: "Prosperující [fp2_james_0001_jewish_trader.GetFaith.GetAdherentNameNoTooltip] v [fp2_james_0001_thriving_community.GetNameNoTierNoTooltip]"
 fp2_james.0001.desc: "Rozšiřování obchodních přístavů v [fp2_james_0001_thriving_community.GetNameNoTier] proměnilo toto místo v prosperující centrum židovského života z celé Iberie!\n\nČlen významné obchodnické rodiny z [fp2_james_0001_jewish_trader.GetCulture.GetName] kultury sem přivádí stále více svých souvěrců.\n\nBrzy se toto místo stane samotným srdcem rozsáhlé židovské obchodní sítě napříč Iberií."
 fp2_james.0001.a: "Kdo není [ROOT.Char.GetFaith.GetReligion.GetAdjective], není tu vítán!"
 fp2_james.0001.b: "Možná by [fp2_james_0001_jewish_trader.GetFirstNameNoTooltip] [Select_CString(fp2_james_0001_jewish_trader.IsFemale,'měla vládnout','měl vládnout')] [fp2_james_0001_thriving_community.GetNameNoTooltip]!"
 fp2_james.0001.c: "To je ale skvělý rozvoj!"
 fp2_thriving_jewish_community_modifier: "Prosperující židovská komunita"
 fp2_thriving_jewish_community_modifier_desc: "Toto hrabství zažívá hospodářský rozkvět díky zámožným židovským rodinám, které zde budují obchodní sítě."
 fp2_jewish_community_denied_modifier: "Pronásledování místních"
 fp2_jewish_community_denied_modifier_desc: "Společenský a hospodářský rozvoj této oblasti podkopávají zákony diskriminující náboženské menšiny."
 fp2_conversos_persecution_modifier: "Pronásledování konversů"
 fp2_conversos_persecution_modifier_desc: "Navzdory přijetí křesťanství jsou bývalí Židé a jejich potomci nadále pronásledováni."
 fp2_james.0002.t: "Předstíraná konverze"
 fp2_james.0002.desc: "Skupina lidí označovaných jako „[fp2_james_0002_conversos_character.GetFaith.GetAdherentName]“ dostala od svých někdejších [fp2_james_0002_jewish_faith.PriestNeuterPlural] radu, aby navenek přijala pravou víru. Ve skutečnosti však dál tajně praktikují [fp2_james_0002_jewish_faith.GetName]!\n\nPokud je to pravda, mohlo by to zmařit veškeré snahy obrátit židovské komunity v Iberii na křesťanství.\n\nJeden z jejich vůdců, [fp2_james_0002_conversos_character.GetName], je podezřelý z šíření židovského učení."
 fp2_james.0002.a: "Je mi to jedno."
 fp2_james.0002.a.tt: "Necháš [fp2_james_0002_conversos_character.GetNameNoTooltip] jednat podle vlastní vůle"
 fp2_james.0002.b: "Tohle si žádá výslech."
 fp2_james.0002.c: "Ať je to pravda, nebo ne, v mém žaláři shnije!"
 fp2_james.0003.t: "[fp2_james_003_jewish_refugee_leader.GetFaith.GetAdherentNameNoTooltip] uprchlíci"
 fp2_james.0003.desc: "[fp2_james_003_jewish_refugee_leader.GetName] uprchl[Select_CString(fp2_james_003_jewish_refugee_leader.IsFemale,'a','')] z [fp2_james_003_intolerant_ruler.GetPrimaryTitle.GetNameNoTier] a doprovází jej početný zástup. Všichni jsou [fp2_james_003_jewish_refugee_leader.GetFaith.GetAdherentNamePluralNoTooltip].\n\n[fp2_james_003_jewish_refugee_leader.GetFirstNameNoTooltip] mě prosí o domov pro svůj lid a výměnou za ochranu před pronásledováním [Select_CString(fp2_james_003_jewish_refugee_leader.IsFemale,'je ochotna přísahat','je ochoten přísahat')] věrnost [fp2_james_003_jewish_refugee_leader.GetPrimaryTitle.GetAdjective] koruně."
 fp2_james.0003.a: "[fp2_james_0003_province_to_convert.GetNameNoTooltip] by pár osadníků prospělo."
 fp2_james.0003.b: "[fp2_james_003_jewish_refugee_leader.GetFirstNameNoTooltip] bude muset hledat jinde."
 fp2_james.0002.b.succesful_interrogation: "Výslech je úspěšný"
 fp2_james.0002.b.failed_interrogation: "Výslech končí pohromou"
 fp2_james_0002.b.failed_interrogation.tt: "Každé křesťanské a židovské hrabství ve tvém panství"
 fp2_james.0002.a.offended_conversos: "Konversové jsou uraženi"
 fp2_james.0002.a.jewish_communities_thrive: "Židovské komunity vzkvétají!"
 fp2_james.0002.a.nothing_happened_toast: "Konversové jsou skuteční křesťané"
 cultural_acceptance_gain_conversos_tolerance: "Tolerance vůči konversům"
 cultural_acceptance_loss_conversos_tolerance: "Nesnášenlivost vůči konversům"
 fp2_james.0004.t: "[fp2_james_0004_place_of_murder.GetAdjectiveNoTooltip] masakr"
 fp2_james.0004.desc: "[fp2_james_0004_place_of_murder.GetName] je neklidné místo, kde se mísí nejrůznější víry i způsoby vlády. Každá komunita má vlastní vůdce, a tak zde vznikla spletitá síť mocenských vztahů, která už nemůže pokračovat. Kdyby všichni přijali [ROOT.Char.GetFaith.HighGodNamePossessive] učení tak, jak se sluší, a podléhali jedinému vůdci, můj vliv by vzrostl.\n\n[fp2_james_0004_murder_baron.GetName] se nabízí, že převezme vládu. Při hostině, kterou uspořádá, mají být všichni místní náboženští vůdci povražděni jako dobytek."
 fp2_james.0004.a: "Už se nemohu dočkat jejich křiku."
 fp2_james.0004.b: "Nejsem přece #EMP úplné#! monstrum."
 fp2_james.0005.t: "Otázka směru"
 fp2_james.0005.desc.intro: "[fp2_james_angry_priest.GetName] dnes přichází s rozhořčeným tvrzením, že [ROOT.Char.GetFaith.HouseOfWorship] je špatně. Přesněji je tahle nedávno přestavěná stavba otočena špatným směrem!"
 fp2_james.0005.desc.christian: "\n\nKdyž ještě sloužila jako mešita, směřoval na východ k Mekce pouze mihráb. Nyní je však z budovy řádný kostel a očekává se, že bude na východ orientována celá."
 fp2_james.0005.desc.muslim: "\n\nBudova bývala kostelem, a proto je orientována na východ. To znemožňuje vybudovat mihráb, který by věřícím ukazoval směr ke svatému městu!"
 fp2_james.005.desc.outro: "\n\n[fp2_james_angry_priest.GetNameNoTooltip] namítá, že za těchto podmínek je prakticky nemožné řádně vést bohoslužbu, a žádá o peníze na rozebrání a pootočení celé stavby správným směrem."
 fp2_james.0005.a: "Pro víru cokoli!"
 fp2_james.0005.b: "Marníš můj čas."
 fp2_toledo_nights_modifier: "Místní vládci povražděni"
 fp2_toledo_nights_modifier_desc: "Místní náboženští představitelé tohoto hrabství byli nedávno povražděni."
 fp2_toledo_nights_fallout_modifier: "Duchovenstvo povražděno"
 fp2_toledo_nights_fallout_modifier_desc: "V nedalekém městě byli nedávno povražděni náboženští představitelé, což vyvolalo následky napříč celým panstvím."
 fp2_correctly_facing_church: "Správně orientovaný chrám"
 fp2_correctly_facing_church_desc: "Místo bohoslužeb v tomto hrabství bylo cihlu po cihle pootočeno, aby bylo správně orientováno."
 fp2_yearly.4001.t: "Šestá hodina"
 fp2_yearly.4001.desc: "[ROOT.Char.GetTitleAsNameNoTooltip|U] – to člověka opravdu vyčerpá! Musím dřít celý den a často i značnou část noci, abych měl[Select_CString(ROOT.Char.IsFemale,'a','')] všechno pod kontrolou. Rolníci to mají v tomto ohledu požehnané. Netíží je taková odpovědnost, která člověka vysává a připravuje o všechnu energii!\n\nMožná by mi krátké zdřímnutí prospělo? Po obědě si trochu odpočinu a pak se s novými silami pustím do zbytku dne!"
 fp2_yearly.4001.a: "Ne! Čeká mě práce!"
 fp2_yearly.4001.b: "Mmm, #EMP nádhera.#!"
 fp2_yearly.4002.t: "Život v harmonii"
 fp2_yearly.4002.desc: "Nesouhlasné zamračení mého [realm_priest.GetCouncilTitle] je jasně patrné z [realm_priest.GetTitledFirstNamePossessive] tváře a předem mě připravuje na další nesmysly o tom, co si žádá [ROOT.Char.GetFaith.HighGodName].\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ začne [realm_priest.GetFirstNameNoTooltip], „přímo ve vašem panství se děje něco nanejvýš závažného. Hrabství [interfaith_province.GetCounty.GetName] je plné lidí, kteří nevyznávají pravou víru! A jako by to samo nestačilo, žijí bok po boku s těmi, kteří ji vyznávají! A navíc, navíc, navíc spolu dokonce #EMP smilní#! a-“\n\nZavřu oči a nekonečné drmolení pokračuje. Ani nechci pomyslet, jak dlouho to ještě potrvá, pokud s tím něco neudělám..."
 fp2_yearly.4002.a: "Nech je žít v pokoji, [realm_priest.GetFirstNameNoTooltip]."
 fp2_yearly.4002.b: "Máš pravdu. Tohle nemůže pokračovat."
 fp2_yearly.4003.t: "O Camiño de Santiago"
 fp2_yearly.4003.desc: "Svaté město Santiago de Compostela přitahuje věřící jako magnet a poutníci sem proudí z blízkých i vzdálených zemí. Cesta vedoucí od úpatí Pyrenejí je proto hojně využívaná. A kde se najdou lidé dostatečně zámožní, aby mohli putovat ke svatému místu, tam se samozřejmě najdou i tací, kteří chtějí vydělat na jejich důvěře ve Všemohoucího.\n\nTeprve pátá zpráva během pěti dnů o násilném přepadení poutníků bandity na úseku cesty vedoucím mým územím přiměje mého [steward.GetCouncilTitle] [steward.GetFirstName], aby se mnou konečně probral, co s tím udělat."
 fp2_yearly.4003.a: "Obrátím se na svaté válečníky z [ho_province.GetProvince.GetCounty.GetNameNoTooltip]!"
 fp2_yearly.4003.b: "Zaplatím stráže, které budou hlídkovat na části cesty."
 fp2_yearly.4003.c: "[ROOT.Char.GetFaith.HighGodName] pomáhá těm, kdo si pomohou sami..."
 fp2_yearly.4003.tt: "Místní [Concept('holy_order','svatý řád')|E] bude hlídkovat na cestě ve svém hrabství."
 fp2_yearly.4004.t: "Potulný mistr"
 fp2_yearly.4004.desc: "Když procházím svou dvorní síní, upoutá mou pozornost potyčka na jejím vzdáleném konci. Do síně vstoupil statný [mozarab_wanderer.GetWomanMan] a mí strážní proti vetřelci právě pozvedají zbraně, jen aby jim o okamžik později s řinčením vypadly z rukou. Neznámá postava mi mečem okázale zasalutuje.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ začne poté, co mávnutím ruky odvolám další stráže, „nemám komu sloužit a soudě podle zdejší ochrany by se vám moje pomoc docela hodila.“\n\nKříž zavěšený kolem krku mi napovídá, koho mám před sebou: [mozarab_wanderer.GetFaith.GetAdherentName]."
 fp2_yearly.4004.a: "[mozarab_wanderer.GetWomanMan|U] s takovým nadáním? Rozhodně!"
 fp2_yearly.4004.b: "Mí $knight_culture_player_no_tooltip_lowercase$s mají být [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]."
 fp2_yearly.4004.c: "[Select_CString(mozarab_wanderer.IsFemale,'Pryč odsud, pohanko!','Pryč odsud, pohane!')]"
 fp2_yearly.4004.tt: "[mozarab_wanderer.GetName] odmítne konvertovat a vrátí se k potulnému životu"
 fp2_yearly.4004.b.succ: "[mozarab_wanderer.GetName] se přidá k tvému dvoru"
 fp2_yearly.4004.b.fail: "[mozarab_wanderer.GetName] odmítne konvertovat a vrátí se k potulnému životu"
 fp2_yearly.4004.c.tt: "[mozarab_wanderer.GetName] se vrátí k potulnému životu"
 fp2_yearly.4005.t: "Zakládání enkláv"
 fp2_yearly.4005.desc.christian: "[mozarab_merchant.GetFaith.GetAdherentNamePlural] zaujímají v iberské společnosti jedinečné postavení. "
 fp2_yearly.4005.desc.muslim: "[mozarab_merchant.GetFaith.GetReligion.GetAdjectiveNoTooltip|U] poddaní zaujímají v iberské společnosti jedinečné postavení. "
 fp2_yearly.4005.desc: "Je proto neobvyklé, když o audienci požádá [Select_CString(mozarab_merchant.IsFemale,'jedna z jejich místních obchodnic','jeden z jejich místních obchodníků')].\n\n„My, [mozarab_merchant.GetFaith.GetAdherentNamePlural], se při každodenním životě potýkáme s jistými... dodatečnými obtížemi.“ [mozarab_merchant.GetFirstNameNoTooltip] mluví klidně a bez zášti, ale ze slov je zřetelně cítit pevné odhodlání.\n\n„Chceme jen malou část měst v [mozarab_quarter.GetName], kterou bychom mohli nazývat svou a kde bychom mohli žít mezi svými. Přicházím vás tedy požádat, [ROOT.Char.Custom('FormOfAddressForLiege')], zda byste nám ji velkoryse [Select_CString(ROOT.Char.IsFemale,'neudělila','neudělil')].“"
 fp2_yearly.4005.a: "V mých městech jste vítáni."
 fp2_yearly.4005.b: "Nedovolím vám zamořit má města!"
 fp2_yearly.4006.t: "[ROOT.Char.GetFaith.HighGodNamePossessive] architekt"
 fp2_yearly.4006.desc: "Chce to pořádnou kuráž, aby mě někdo zastavil právě ve chvíli, kdy po každodenní modlitbě opouštím [ROOT.Char.GetFaith.HouseOfWorship], ale [mozarab_priest.GetWomanMan] se k tomu skutečně odhodlá. Kříž zavěšený kolem krku sleduji s jistou nedůvěrou, když se návštěvník pustí do řeči.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], žádám jen o chvilku vašeho času. Chci pouze, aby se mé stádo mohlo modlit v [mozarab_priest.GetFaith.HouseOfWorship] tak, jak se sluší na všechny dobré následovníky [mozarab_priest.GetFaith.HighGodName]!“ Nervózní duchovní se odmlčí a prosebně se na mě zadívá.\n\nKdybych [mozarab_priest.GetFaith.GetAdherentNamePlural] dovolil[Select_CString(ROOT.Char.IsFemale,'a','')] stavět vlastní svatostánky, jejich obracení na mou víru by bylo obtížnější. Trocha shovívavosti by však možná prospěla soudržnosti mého panství."
 fp2_yearly.4006.a: "Máš můj souhlas. Postavte si své [mozarab_priest.GetFaith.HouseOfWorshipPlural]."
 fp2_yearly.4006.b: "Ty boudy pro jinověrce na mé půdě #EMP nikdy#! stát nebudou!"
 fp2_yearly.4007.t: "Kdo hledá, lasturu najde"
 fp2_yearly.4007.desc: "Vracíme se z modliteb a po mém boku kráčí můj [realm_priest.GetCouncilTitle] [realm_priest.GetFirstName], když na zemi zahlédnu bílý záblesk. Sehnu se a ze země vytáhnu tvrdý, kulatý předmět barvy kosti: lasturu hřebenatky.\n\nTakové lastury jsou znamením poutníků, kteří po této cestě míří do Santiaga, a každý, kdo nějakou vlastní – zvlášť pokud na sobě nese znak Santiaga – tím dokládá, že náročnou pouť dokončil.\n\nChamtivě obracím lasturu v ruce a cítím, jak mi nesouhlasný pohled [realm_priest.GetFirstNameNoTooltip] propaluje týl."
 fp2_yearly.4007.a: "Nechám si ji a ty budeš držet jazyk za zuby."
 fp2_yearly.4007.b: "Dobře. #EMP Dobře!#! Nechám tu zatracenou lasturu být."
 fp2_yearly.4007.c: "...komu myslíš, že budou věřit, [realm_priest.GetFirstNameNoTooltip]?"
 fp2_yearly.4007.c.tt.flavour: "Když si tu lasturu nechám, kdo dokáže, že #EMP není#! pravá?"
 fp2_yearly.4007.c.tt.success: "Přesvědčivou lasturu si ponecháš"
 fp2_yearly.4007.c.tt.fail: "[realm_priest.GetFirstNameNoTooltip] snadno odhalí lasturu jako padělek"
 fp2_yearly.4008.t: "Příběhy u ohně"
 fp2_yearly.4008.desc.intro: "Oheň praská a vrhá na stěny čelediště dlouhé stíny. Vrásčitá stařena poutá vyprávěním pozornost okouzlených dětí.\n\n"
 fp2_yearly.4008.desc.basque.a: "„...Aatxe je jeskynní duch, který se nejčastěji zjevuje v podobě rudého býka. Chrání lidi před zlými silami a napadá zloděje.“"
 fp2_yearly.4008.desc.basque.b: "„...Gaueko je duch noci. Nedovoluje lidem pracovat venku po setmění a jakýkoli projev noční opovážlivosti – třeba chlubení, že se člověk nebojí tmy – přivolá jeho hněv.“"
 fp2_yearly.4008.desc.galician.a: "„...Ojáncanu jsou krvelační, chlupatí obři s dvojnásobkem zubů oproti obyčejnému člověku. Mají však jednu osudovou slabinu: jediný bílý vlas, jehož vytržení je okamžitě zabije.“"
 fp2_yearly.4008.desc.galician.b: "„...Estadea jsou neklidní mrtví, kteří o půlnoci obcházejí vesnice. Vlečou se za živou duší uvrženou do transu, která je musí vést až do úsvitu. Pokud se jí nepodaří předat přízračný průvod jinému nešťastníkovi, během několika týdnů chřadne a zemře.“"
 fp2_yearly.4008.desc.castilian.a: "„...Ďáblovi koně se objevují, když lidé zapalují ohně, aby očistili své duše. Mají hřívy černé jako noc, křídla vážek a zpěněné tlamy a z popela vyrážejí s ohlušujícím výbuchem. Každý z nich je duší hříšníka s vlastním příběhem.“"
 fp2_yearly.4008.desc.castilian.b: "„...Ventolines jsou vzdušní duchové, kteří pomáhají námořníkům. Vypadají jako andělé, mají oči barvy mořské pěny a křídla připomínající tříštící se vlny a sídlí v karmínových oblacích západu slunce. Když dobrého námořníka zastihne bezvětří, Ventolines naplní jeho plachty větrem a pomohou mu zpět ke břehu.“"
 fp2_yearly.4008.desc.catalan.a: "„...Cocollona je říční příšera. Původně to byla bezvěrecká jeptiška, kterou za její hříchy uvěznili. Žalářníci ji pouštěli ven pouze k řece Onyar. Časem jí narostly šupiny a nyní číhá pod mosty na nic netušící kořist.“"
 fp2_yearly.4008.desc.catalan.b: "„...slavný Dip je pekelný pes a Ďáblův vyslanec. Tato vlku podobná nestvůra pije krev a v noci se toulá po polích, kde zabíjí krávy i nešťastné lidi. Kulhá na jednu nohu a jeho rudě zářící oči jsou poslední věcí, kterou mnozí opilci potácející se domů spatří.“"
 fp2_yearly.4008.desc.aragonese.a: "„...Omes Hail jsou obři spjatí se samotnými horami. Když se tito duchové zviditelní, promění se v mohutné horské masivy, které nás chrání před nepřáteli. Rozzuřeni svým údělem křičí a sesílají balvany, které se řítí po svazích do vesnic pod nimi.“"
 fp2_yearly.4008.desc.aragonese.b: "„...mírumilovný a laskavý Basajaun je obrovský muž s vousy sahajícími až k nohám. Je dvakrát vyšší než obyčejný člověk a prochází lesy s kmenem stromu jako holí. Hlubokým hvízdnutím varuje pastýře před blížícími se bouřemi či dokonce smečkami vlků.“"
 fp2_yearly.4008.desc.spain.a: "„...Cuélebre je nepředstavitelně obrovský had. Je prakticky nesmrtelný, ale také líný a jen málokdy opouští svůj úkryt hluboko v jeskyni. Říká se, že střeží poklady přesahující lidskou představivost a jeho sliny dokážou léčit nemoci.“"
 fp2_yearly.4008.desc.spain.b: "„...Mouros jsou prastaré bytosti nesmírné moci, které zde žijí od počátku světa. Jsou to znamenití kováři, ale na povrchu je lze spatřit jen zřídka. Jejich dívky jsou překrásné očarované měňavkyně, které střeží průchody do podzemí.“"
 fp2_yearly.4008.desc.spain.c: "„...Anjana jsou dobré a laskavé víly, které pečují o lesy. Mají černé zorničky a průsvitná křídla, pomáhají zraněným zvířatům i ztraceným lidem a našlapují tak lehce, že pod nimi nepraskne ani větvička. Kdo najde jeden z jejich pestrobarevných růžových lístků, může být šťastný až do smrti.“"
 fp2_yearly.4008.desc.ending: "\n\nOheň zaprská a pohasne, zatímco stařena dokončí příběh a začne děti pobízet, aby se chystaly do postele."
 fp2_yearly.4008.a: "To byl ale pěkný starý příběh!"
 fp2_yearly.4008.b: "Ha! Nesmyslné strašidelné povídačky!"
 fp2_yearly.4008.c: "Umíš pěkně vyprávět, stařenko!"
 fp2_yearly.4009.t: "Bílý pán"
 fp2_yearly.4009.desc: "Dnešek je výjimečný. Za zatáčkou konečně spatřím svůj cíl: strom Malato z legendy o Jaun Zuria. Příběh mladého válečníka, který zahnal celé vojsko, zná nazpaměť každé dítě z [root_culture.GetName] kultury.\n\nPřejedu rukou po sukovitém kmeni a prsty se zastaví na štěrbině široké asi jako prst. Podle legendy sem následovníci Bílého pána zarazili meč na znamení svého odhodlání následovat jej kamkoli."
 fp2_yearly.4009.a: "I já porazím nepřátele našeho lidu!"
 fp2_yearly.4009.b: "Jsem víc než jen součást [root_culture.GetNameNoTooltip] kultury."
 fp2_yearly.4009.c: "Malá památka na dnešní den by se hodila."
 fp2_yearly.4010.t: "Kamenní kanci"
 fp2_yearly.4010.desc: "Měla to být jen obyčejná cesta do [verraco_county.GetName], ale narazím na něco vzácného a neobvyklého.\n\nUprostřed otevřené krajiny přede mnou stojí obrovské kamenné bestie v podobě kanců. Podle zvětralého povrchu musí být skutečně prastaré. Jestli jsou opravdu tak staré, co mohlo tyto lidi přimět vynaložit tolik úsilí na vytvoření takových monolitických vepřů?"
 fp2_yearly.4010.a: "Možná to byly hrobky... světců?"
 fp2_yearly.4010.a.success: "Lidé tvé teorii uvěří"
 fp2_yearly.4010.a.fail: "Lidé poukážou na to, že tvá teorie nemá žádný reálný základ"
 fp2_yearly.4010.b: "Nemají žádný účel. Rozeberte je."
 fp2_yearly.4010.c: "To jsou rouhačské modly! Strhněte je!"
 fp2_yearly.4010.d: "Kanci nekanci, s tímhle už je konec. Nudí mě to."
