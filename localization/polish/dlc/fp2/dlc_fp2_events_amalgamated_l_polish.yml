 ironsoul_name: "Železná duše"
 mistletoe_name: "Jmelí"
 moormurder_name: "Sekáč Maurů"
 usurperblade_name: "Uzurpátorova čepel"
 awesome_toledo_sword_name: "Meč od [great_swordsmith.GetTitledFirstNameNoTooltip]"
 awesome_toledo_sword_desc: "Tento meč je vrcholným dílem [great_swordsmith.GetName] z [toledo_county.GetNameNoTierNoTooltip], vykovaným tajnými postupy, jejichž tajemství si [Select_CString(great_swordsmith.IsFemale,'odnesla','odnesl')] do hrobu. Říká se, že [great_swordsmith.GetName] [Select_CString(great_swordsmith.IsFemale,'byla geniální, ale arogantní kovářka a že do čepele vložila','byl geniální, ale arogantní kovář a že do čepele vložil')] část své duše. A skutečně se zdá, že svému nositeli propůjčuje železnou vůli."
 fp2_struggle.1012.t: "Mistrovské dílo"
 fp2_struggle.1012.desc: "„Je hotovo,“ pronese [great_swordsmith.GetName].\n\n„Tohle je meč, který jsem vám [Select_CString(ROOT.Char.IsFemale,'slíbila','slíbil')], jedno z mých nejlepších děl. Čepel je vykována z té nejdokonalejší slitiny, jakou si lze představit, takové, jaká může vzniknout jedině v Iberii. Opravdu má, jak se říká, #italic železnou duši#!. Čepel hodná [Select_CString(ROOT.Char.IsFemale,'urozené dámy','velkého pána')], jako jste vy.“"
 fp2_struggle.1012.a: "Je... nádherný. Můžeš odejít v pokoji."
 fp2_struggle.1012.b: "Velkolepé. Opravdu tě nepřesvědčím, abys zůstal v mých službách?"
 fp2_struggle.1012.swordsmith_leaves: "Po dokončení svého díla [great_swordsmith.GetName] odchází převzít vedení kovářského cechu, jak [Select_CString(ROOT.Char.IsFemale,'jsi slíbila','jsi slíbil')]."
 fp2_struggle.1012_swordsmith_stays: "[great_swordsmith.GetName] zůstává u tvého dvora"
 toledo_sword_name: "Toledský meč"
 toledo_sword_desc: "Tato čepel je mistrovským dílem z toledské oceli, mimořádně pevná a odolná. Drobný nápis u záštity praví, že ji [Select_CString(great_swordsmith.IsFemale,'ukovala','ukoval')] #italic velký kovář#! [great_swordsmith.GetName]. Místem jejího vzniku je [blacksmith_county.GetNameNoTierNoTooltip]."
 fp2_struggle.1050.t: "Sny o zkáze"
 fp2_struggle.1050.desc_opening: "[visionary_spouse.GetTitledFirstName] za mnou přichází uprostřed temné noci, [Select_CString(visionary_spouse.IsFemale,'rozpálená horečkou a bledá','rozpálený horečkou a bledý')]. „Zdají se mi sny,“ říká [visionary_spouse.GetFirstNameNoTooltip], „ve kterých stojím na poli smrti."
 fp2_struggle.1050.desc_christian: "Naše města byla srovnána se zemí, věže kostelů strženy a naši lidé rozdrceni v bahně vlastní krve."
 fp2_struggle.1050.desc_islamic: "Naše knihovny hořely, minarety se zřítily a naši bratři a sestry byli přibiti na kříže a ponecháni mrchožravým ptákům."
 fp2_struggle.1050.desc_rampaging_barbarian_heathen: "Naše domy hořely, runové kameny byly strženy a naši válečníci pobiti bez cti a slávy."
 fp2_struggle.1050.desc_non_barbarian_heathen: "Naše města byla srovnána se zemí, chrámy vypáleny a naši lidé povražděni nebo odvlečeni vstříc neznámému osudu."
 fp2_struggle.1050.desc_islamic_heritage: "Vidím naprostou zkázu všeho, co jsme vybudovali od chvíle, kdy naši předkové přišli do této země.“\n\n"
 fp2_struggle.1050.desc_christian_bling_reference_drop: "Relikvie našich světců byly vrženy do běsnících plamenů.“\n\n"
 fp2_struggle.1050.desc_middle_neutral_version: "Vše, co jsme vybudovali, bylo zničeno a zemi ovládla smrt a beznaděj.“\n\n"
 fp2_struggle.1050.desc_love_and_warmth_ending: "„Prosím, lásko, pomoz mi. Tolik se bojím, že jsou mé sny pravdivé a že se to všechno opravdu stane. Obejmi mě... je mi taková zima.“"
 fp2_struggle.1050.desc_no_love_and_warmth_ending: "„[Select_CString(ROOT.Char.IsFemale,'Drahá ženo','Drahý muži')], prosím, vyslechni mě. Tohle není obyčejná nemoc. Bojím se, že jsou mé sny pravdivé a že se to všechno může stát. Prosím, nedovol tomu. Musíš zachránit Iberii.“"
 fp2_struggle.1050.a: "Jsi snad čarodějnice?"
 fp2_struggle.1050.b: "Vzpamatuj se. [ROOT.GetCharacter.GetFaith.HighGodName] jen zkouší tvou víru."
 fp2_struggle.1050.c: "Pojď, pověz mi o svých viděních víc."
 fp2_struggle.1050.d: "Nech mě být. Plánuji další výboj."
 fp2_struggle.1050.spouse_imprisoned: "Uvězníš [visionary_spouse.GetTitledFirstNameNoTooltip] pro podezření z čarodějnictví"
 fp2_struggle.1050.condition_might_improve: "[visionary_spouse.GetTitledFirstNameNoTooltip]: zdravotní stav se může zlepšit"
 fp2_struggle.1050.condition_might_get_worse: "[visionary_spouse.GetTitledFirstNameNoTooltip]: zdravotní stav se může zhoršit"
 fp2_struggle.1050.condition_might_get_very_worse: "[visionary_spouse.GetTitledFirstNameNoTooltip]: zdravotní stav se může výrazně zhoršit"
 comforting_spouse_visionary_toast.success: "Podařilo se ti [visionary_spouse.GetTitledFirstName] utěšit"
 comforting_spouse_visionary.failure: "Nepodařilo se ti [visionary_spouse.GetTitledFirstName] utěšit"
 fp2_yearly.8004.t: "[translation_capital.GetNameNoTierNoTooltip]: škola překladatelů"
 fp2_yearly.8004.desc_opening: "Duch usmíření vládnoucí Iberii přilákal do knihoven mého panství učence z celého kraje. Možná bych mohl jejich úsilí nasměrovat k něčemu užitečnému...\n\n"
 fp2_yearly.8004.desc_chaplain: "Můj [translation_enthusiast.GetCouncilTitle] [translation_enthusiast.GetTitledFirstName] má nápad. „Měli bychom sestavit tým překladatelů,“ říká [translation_enthusiast.GetFirstNameNoTooltip], „a já bych jej mohl vést. Prohledejme celou zemi a najděme schopné překladatele, klidně i pohany, a nechme je pracovat pod vaší záštitou. [translation_capital.GetNameNoTierNoTooltip] se může stát majákem vzdělanosti, pokud jej budete financovat!“"
 fp2_yearly.8004.desc_wanderer: "[Select_CString(translation_enthusiast.IsFemale,'Učená poutnice','Učený poutník')] [translation_enthusiast.GetTitledFirstName] přichází se zajímavou nabídkou. „[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ říká [translation_enthusiast.GetFirstNameNoTooltip], „ovládám tucet jazyků a mohu vám pomoci sestavit tým překladatelů. Prohledejme celou zemi, najděme schopné překladatele a nechme je pracovat pod vaší záštitou. [translation_capital.GetNameNoTierNoTooltip] by se mohlo stát velkým majákem vzdělanosti.“"
 fp2_yearly.8004.a: "Při hledání těch nejlepších #italic nebudu#! šetřit."
 fp2_yearly.8004.b: "Když jsi tak schopný, #italic všechny#! překlady zvládneš sám."
 fp2_yearly.8004.c: "S knihovnami je tolik starostí..."
 recruiting_brilliance_toast.success: "Podařilo se ti najít vynikající překladatele"
 recruiting_mediocrity_toast.failure: "Najal jsi jen průměrné překladatele"
 fp2_yearly.8005.t: "Pod pinií"
 fp2_yearly.8005.desc_opening: "V spalujícím poledním žáru sedí ve stínu rozložité pinie a hrají na loutny a flétny."
 fp2_yearly.8005.desc_iberian: "Zpívají galicijsko-portugalsky a katalánsky o životě, ztrátě a hořkosladké lásce."
 fp2_yearly.8005.desc_arabic: "Zpívají arabsky o kráse, slávě a lásce ztracené a znovu nalezené."
 fp2_yearly.8005.desc_language_neutral: "Zpívají mnoha jazyky, a přesto mé srdce rozumí každému slovu."
 fp2_yearly.8005.desc_middle_part: "Slyším je až na svém balkóně a jejich hudba se dotýká mé duše.\n\nNevím však, kdo ti hudebníci jsou. Když opustím své vznešené síně a vydám se ke stromu, jsou pryč."
 fp2_yearly.8005.desc_post_troubadours: "Měl jsem za to, že takovým nadáním a důvtipem oplývají jen okcitánští trubadúři, ale možná jsem se mýlil...\n\nCo si mám počít s těmi zatracenými #italic city#!?"
 fp2_yearly.8005.desc_pre_troubadours: "\n\nJe snad jejich domovem [ROOT.Char.GetFaith.PositiveAfterLife|U]? Nebo mě jimi pokouší [ROOT.Char.GetFaith.DevilName]? Snad ne... ale co si mám počít s těmi zatracenými #italic city#!?"
 fp2_yearly.8005.a: "Láska k [courtly_lover.GetFirstNameNoTooltip] naplňuje mé srdce písní."
 fp2_yearly.8005.b: "Taková nádhera..."
 fp2_yearly.8005.c: "Měl bych podporovat více hudebníků!"
 fp2_yearly.8005.d: "Dost! Ten zatracený strom nechám pokácet."
 fp2_yearly.8002.t: "Stravovací dilema"
 fp2_yearly.8002.desc: "[beached_whale_province.GetName]: dvě děti tu na pláži sbíraly škeble, když narazily na mršinu kolosálních rozměrů. Místní tvrdí, že maso tohoto mrtvého mořského tvora se ještě nezačalo kazit a je #italic velice#! chutné. Během zasedání rady si mě však můj [preoccupied_ulama.GetCouncilTitle] [preoccupied_ulama.GetFirstName] ustaraně odvede stranou.\n\n„Smíme my, [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip], vůbec jíst velrybí maso?“ přemítá [preoccupied_ulama.GetFirstNameNoTooltip]. „V této věci si netroufám vynést rozhodnutí. Měli bychom počkat na vyjádření některého z opravdu uznávaných učenců. Do té doby bys ale měl lidem pojídání masa této bestie zakázat... pro jistotu.“"
 fp2_yearly.8002.a: "Ne. #italic Já#! mohu rozhodnout, že je přípustné."
 fp2_yearly.8002.b: "Dejte mi kus toho masa! #italic Musím#! ho ochutnat."
 fp2_yearly.8002.c: "Dobrá, počkáme na rozhodnutí."
 fp2_yearly.8002.d: "#italic Nesmí#! se jíst. Osobně tam zajdu a spálím ho."
 exploding_whale_toast: "Mršina záhadně vybuchla!"
 exploding_whale.tt: "Mršina vybuchne!"
 healthy_whale_toast: "Chutnalo to výborně"
 unhealthy_whale_toast: "Něco není v pořádku..."
 fp2_yearly.8003.t: "Vzletná představa"
 fp2_yearly.8003.desc: "Vyhledá mě proslulý [Select_CString(flying_polymath.IsFemale,'vynálezkyně','vynálezce')] [flying_polymath.GetFirstName] s velmi podivnou žádostí a párem křídel ze dřeva a hedvábí.\n\n„Lidé odjakživa toužili vznést se k nebesům,“ říká [flying_polymath.GetFirstNameNoTooltip], „a mé výpočty dokazují, že to dokážeme! Dovolte mi skočit z nejvyšší věže vašeho [ROOT.Char.Custom('ResidenceBuilding')], [ROOT.Char.Custom('FormOfAddressForLiege')], a pak vám budu věrně sloužit.“\n\nBohužel se o tom dozvěděl[Select_CString(enthusiastic_child.IsFemale,'a','')] i [enthusiastic_child.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('enthusiastic_child'))], a teď mě úpěnlivě prosí, ať se může podívat, jak se starý učenec pokusí vzlétnout."
 fp2_yearly.8003.a: "Dobrá, dovolím to."
 fp2_yearly.8003.b: "Půjč mi ta křídla – #italic já#! chci létat."
 fp2_yearly.8003.c: "Ne, tohle je šílenství."
 flight_attempt_toast.success: "Vznesl ses jako orel"
 flight_attempt_toast.failure: "Zřítil ses k zemi"
 fp2_yearly.8003_child_reaction: "Těžko říct, jak [enthusiastic_child.GetFirstNameNoTooltip] na takovou podívanou zareaguje."
 polymath_flight_attempt_toast.success: "[flying_polymath.GetFirstNameNoTooltip] [Select_CString(flying_polymath.IsFemale,'vzlétnula','vzlétnul')]!"
 polymath_flight_attempt_toast.failure: "[flying_polymath.GetFirstNameNoTooltip] se při pádu [Select_CString(flying_polymath.IsFemale,'zabila','zabil')]."
 fp2_yearly.8001.t: "Svolání kortesů"
 fp2_yearly.8001.desc: "Můj [commoner_enthusiast.GetCouncilTitle] [commoner_enthusiast.GetTitledFirstName] už dlouho přemýšlí nad našimi financemi a nyní navrhuje svolat #italic kortesy#!, nový druh sněmu, v němž se volení zástupci svobodných měst podílejí na jednání královské rady.\n\n„Výměnou za tuto výsadu,“ pokračuje [commoner_enthusiast.GetFirstNameNoTooltip], „bychom mohli města zdanit ještě více. Pokud zlato opravdu nutně potřebujeme, [ROOT.Char.Custom('FormOfAddressForLiege')], mohli bychom na naše jednání pustit dokonce i některé z těch méně ubohých rolníků. To však není zrovna moudré – šlechtu by to jistě rozlítilo.“"
 fp2_yearly.8001.a: "Pozvěte zástupce měst."
 fp2_yearly.8001.b: "Pozvěte všechny! A myslím tím #italic úplně všechny#!."
 fp2_yearly.8001.c: "Ne. Šlechta ví nejlépe, jak tomu bylo odjakživa."
 fp2_flavor.8001_vassal_opinion: "Vazalům, kteří si úzkostlivě střeží své výsady, se to nebude líbit"
 fp2_yearly.8000.t: "Pálení vinic"
 fp2_yearly.8000.desc_muslim_opening: "Dobré iberské víno si věřící, kteří se zde usadili, vychutnávají už po dlouhou dobu. Nyní však [vinoclast_caliph.GetTitleTierName] [vinoclast_caliph.GetFirstName] rozhodl[Select_CString(vinoclast_caliph.IsFemale,'a','')], že tomu bude konec.\n\n[hof_emissary.GetTitledFirstName] předstupuje přede mě s prohlášením: „Víno je bezpochyby #italic harám#! a jeho výrobu ani pití už nelze dále tolerovat. Proto musíš vinice v [vineyard_county.GetName] vydat plamenům."
 fp2_yearly.8000.desc_jewish_opening: "Dobré iberské víno si naši předkové, kteří se zde usadili, vychutnávali už po dlouhou dobu. Nyní však [vinoclast_caliph.GetTitleTierName] [vinoclast_caliph.GetFirstName] rozhodl[Select_CString(vinoclast_caliph.IsFemale,'a','')], že tomu bude konec.\n\n[hof_emissary.GetTitledFirstName] předstupuje přede mě s prohlášením: „Víno rozhodně není košer a jeho výrobu ani pití už nelze dále tolerovat. Proto musíš vinice v [vineyard_county.GetName] vydat plamenům."
 fp2_yearly.8000.desc_jerez: "Ovšem [jerez_vineyards.GetNameNoTier] se pyšní největšími vinicemi v celé Iberii, a proto dobře chápeme, jak velkou oběť po tobě žádáme. Nezůstane zapomenuta. Přesto musí vinice shořet!“"
 fp2_yearly.8000.desc_not_jerez: "Dobře chápeme, jakou bolest to může způsobit tvým vinařům, ale pomysli na všechnu půdu, kterou uvolníš pro lepší a bohulibější účely! Vinice musí být zničeny.“"
 fp2_yearly.8000.a: "Ničit dobré víno? Copak se [vinoclast_caliph.GetTitleTierName] pomátl[Select_CString(vinoclast_caliph.IsFemale,'a','')]?"
 fp2_yearly.8000.b: "Spálím je na popel!"
 fp2_yearly.8000.c: "Ne, vinaře musím ochránit."
 fp2_struggle.1020.t: "Smrt [Select_CString(minority_councillor.IsFemale,'radní','radního')]"
 fp2_struggle.1020_desc_opening: "Taková pohroma! Napětí v [unrest_capital.GetNameNoTierNoTooltip] už nějakou dobu vře a nyní rozzuřený dav [unrest_capital.GetCountyData.GetFaith.GetAdherentNamePluralNoTooltip] označil mého rádce [minority_councillor.GetTitledFirstName] za příčinu své nespokojenosti kvůli víře [minority_councillor.GetFaith.GetName], kterou vyznává."
 fp2_struggle.1020_desc_beaten_by_mob: "[minority_councillor.GetNameNoTooltip] [Select_CString(minority_councillor.IsFemale,'mířila','mířil')] do mého [ROOT.Char.Custom('ResidenceBuilding')], když [Select_CString(minority_councillor.IsFemale,'ji','ho')] obklopil dav a surově [Select_CString(minority_councillor.IsFemale,'ji','ho')] ubil k smrti.\n\n"
 fp2_struggle.1020_desc_burned_by_mob: "Pod rouškou noci se vetřeli do mého [ROOT.Char.Custom('ResidenceBuilding')], [Select_CString(minority_councillor.IsFemale,'svázali ji','svázali ho')] u tkalcovského stavu a pak jej zapálili.\n\n"
 fp2_struggle.1020_desc_hanged_and_disemboweled_by_mob: "Cestou na zasedání rady [Select_CString(minority_councillor.IsFemale,'ji','ho')] přepadli, pověsili na bránu mého [ROOT.Char.Custom('ResidenceBuilding')] a rozpárali [Select_CString(minority_councillor.IsFemale,'jí','mu')] břicho, takže vnitřnosti dopadly na vlhkou zem pod [Select_CString(minority_councillor.IsFemale,'ní','ním')].\n\n"
 fp2_struggle.1020_desc_crucified_by_mob: "[minority_councillor.GetNameNoTooltip] [Select_CString(minority_councillor.IsFemale,'byla','byl')] právě na návštěvě u známého v [unrest_capital.GetNameNoTierNoTooltip], když [Select_CString(minority_councillor.IsFemale,'ji','ho')] rozzuřený dav popadl a přibil na dřevěný kříž, kde [Select_CString(minority_councillor.IsFemale,'brzy zemřela','brzy zemřel')].\n\n"
 fp2_struggle.1020_desc_defenestrated_by_mob: "Dav se vybičoval k bezbožnému šílenství, vtrhl do mého [ROOT.Char.Custom('ResidenceBuilding')] a [Select_CString(minority_councillor.IsFemale,'vyhodil ji','vyhodil ho')] z okna vstříc smrti.\n\n"
 fp2_struggle.1020_desc_molten_silver_by_mob: "Dav se vybičoval k bezbožnému šílenství a vtrhl do komnat, které v mém [ROOT.Char.Custom('ResidenceBuilding')] [Select_CString(minority_councillor.IsFemale,'obývala','obýval')] [minority_councillor.GetTitledFirstNameNoTooltip]. Tam roztavil [Select_CString(minority_councillor.IsFemale,'její','jeho')] vzácné šperky a tekutý kov [Select_CString(minority_councillor.IsFemale,'jí','mu')] nalil do hrdla.\n\n"
 fp2_struggle.1020_desc_torn_to_pieces_by_mob: "[minority_councillor.GetNameNoTooltip] se [Select_CString(minority_councillor.IsFemale,'vracela','vracel')] z lázní do mého [ROOT.Char.Custom('ResidenceBuilding')], když se na [Select_CString(minority_councillor.IsFemale,'ni','něj')] vrhl rozzuřený dav. Nenávist jim dodala zběsilou sílu a holýma rukama [Select_CString(minority_councillor.IsFemale,'ji','ho')] roztrhali na kusy.\n\n"
 fp2_struggle.1020_desc_councillor_had_family: "[minority_councillor.GetTitledFirstNameNoTooltip] po sobě [Select_CString(minority_councillor.IsFemale,'zanechala','zanechal')] rodinu, která mi dává za vinu, co se stalo. [councillor_executor.Custom2('HerHisCharacterIntroduction', minority_councillor)|U] nyní stojí přede mnou a žádá, abych se omluvil za tento strašlivý čin proti rodu [minority_councillor.GetDynastyName]."
 fp2_struggle.1020_desc_councillor_had_no_family_faith: "Místní [minority_councillor.GetFaith.GetAdherentNamePluralNoTooltip] zřejmě dávají za to, co se stalo, vinu #italic mně#!. [councillor_executor.GetTitledFirstName], [Select_CString(councillor_executor.IsFemale,'představitelka','představitel')] jejich komunity, přichází žádat, abych tamní strádající [minority_councillor.GetFaith.GetAdherentNamePluralNoTooltip] za tento zločin odškodnil."
 fp2_struggle.1020.a: "Požádat rod [minority_councillor.GetDynastyNameNoTooltip] o odpuštění."
 fp2_struggle.1020.b: "Napravit křivdu vůči místní komunitě."
 fp2_struggle.1020.c: "Dopadnout pachatele."
 fp2_struggle.1020.d: "Nasadit vojáky a obnovit pořádek v [unrest_capital.GetNameNoTierNoTooltip]."
 fp2_yearly.8006.t: "Sakálibští osadníci"
 fp2_yearly.8006.desc: "Několik stovek světlých #italic sakálibů#!, zotročených mužů a žen z dalekých končin východní Evropy, uprchlo z panství [former_master.GetTitledFirstName]. [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('former_master'))|U] možná vypráví cokoli o jejich neocenitelné službě v armádách a harému, oni však překonali mnohá nebezpečí, aby v mé zemi nalezli svobodu.\n\n„Všichni máme jizvy,“ říká mi [Select_CString(saqaliba_leader.IsFemale,'jejich vůdkyně','jejich vůdce')] [saqaliba_leader.GetFirstName], „na těle nebo hluboko uvnitř. Jsme však silní a odhodlaní. Toužíme po vlastní půdě, kde bychom mohli mluvit jazykem svých předků. Pokud nám dovolíte usadit se v [saqaliba_barony.GetName], budeme tvrdě pracovat, aby toto místo vzkvétalo.“"
 fp2_yearly.8006.a: "Možná z tebe udělám i [Select_CString(saqaliba_leader.IsFemale,'starostku','starostu')]..."
 fp2_yearly.8006.b: "Ty můžeš zůstat, ale tvoji druhové musí jinam."
 fp2_yearly.8006.c: "Pošlu tě zpět k tvému pánovi."
 furious_rival_8006.desc: "Tvůj rival [former_master.GetTitledFirstNameNoTooltip] může získat [Concept('claim','nárok')|E] na [saqaliba_county.GetName]"
 fp2_yearly.8006.flavor.b.tt: "[saqaliba_leader.GetFirstNameNoTooltip] neochotně zůstává u tvého dvora a své druhy nechává hledat vlastní cestu."
 fp2_yearly.8006.flavor.c.tt: "Sakálibové jsou násilím vráceni k [former_master.GetTitledFirstNameNoTooltip]."
 fp2_struggle.3001.t: "Cena války"
 fp2_struggle.3001.desc: "[struggle_3001_steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vstupuje do místnosti s vážnou tváří. „[Select_CString(ROOT.Char.IsFemale,'Má paní','Můj pane')],“ ozve se [struggle_3001_steward.GetFirstNameNoTooltip], „naše pokladnice je téměř prázdná. V těchto časech je to nebezpečné.“ Víc už není třeba říkat. Mlčky odpovím zachmuřeným pohledem. „[ROOT.Char.Custom('FormOfAddressForLiege')]...“ zazní znovu, když odcházím."
 fp2_struggle.3001.desc_no_war_intro: "\n\nZbyla mi jen tato koruna. Tato koruna a povinnost dobře jí sloužit. K čemu je ale koruna, když nemám prostředky, abych si ji udržel?"
 fp2_struggle.3001.desc_war_intro: "\n\nZbyla mi jen tato koruna. Tato koruna a povinnost dobře jí sloužit. K čemu je ale koruna, o kterou stejně přijdu, pokud budu poražen?"
 fp2_struggle.3001.desc_outro: "Natáhnu ruku a dotknu se chladného kovu – zlata.\n\nZnám pár nepoctivých obchodníků, které by mohl zajímat..."
 fp2_struggle.3001.a: "Udělám, co musím."
 fp2_struggle.3001.a_flavour: "Přijdeš o svou korunu."
 fp2_struggle.3001.b: "Ale ta druhá koruna..."
 fp2_struggle.3001.c: "Počkat! Nejsem jediný, kdo má v této domácnosti korunu."
 fp2_struggle.3001.c_flavour: "Koruna tvého manželského protějšku bude prodána."
 fp2_struggle.3001.d: "Tuhle korunu mi sundají jedině z mrtvé hlavy!"
 struggle_3001_spouse_crown_modifier: "Prodaná koruna"
 fp2_struggle.3011.t: "Dámy v nesnázích"
 fp2_struggle.3011.desc: "„[Select_CString(ROOT.Char.IsFemale,'Má paní','Můj pane')]! Stalo se něco nemyslitelného!“ [struggle_3011_marshal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vpadne dovnitř a chvíli jen lapá po dechu, čelo zbrocené potem. „Dámy z [struggle_3011_county_town.GetNameNoTier] se chopily zbraní a samy brání město.“"
 fp2_struggle.3011.desc_men: "„[Select_CString(ROOT.Char.IsFemale,'Má paní','Můj pane')]! Stalo se něco nemyslitelného!“ [struggle_3011_marshal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vpadne dovnitř a chvíli jen lapá po dechu, čelo zbrocené potem. „Muži z [struggle_3011_county_town.GetNameNoTierNoTooltip] se chopili zbraní a sami brání město.“"
 fp2_struggle.3011.desc_outro: "\n\nVzápětí do místnosti vtrhne [bishop.GetTitledFirstName]. „To je proti přirozenosti, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]! Když je necháme bojovat, zanedlouho si začnou nárokovat i půdu – a kdo se pak bude starat o děti?“\n\n„Meč jako meč,“ odvětí bez váhání [struggle_3011_marshal.GetFirstNameNoTooltip]. „Jistě se mnou souhlasíte, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]?“"
 fp2_struggle.3011.a: "Kéž by všichni mí poddaní tak ochotně bránili naši zem!"
 fp2_struggle.3011.b: "Ženy mají v náručí držet jedině děti."
 fp2_struggle.3011.b_men: "Muži mají v náručí držet jedině děti."
 fp2_struggle.3011.c: "Čarodějnice! #EMP Čarodějnice!#!"
 fp2_struggle.3011.d: "Ach, ty ubohé dámy! Zachráním je před tímto zlem!"
 fp2_order_of_the_hachet_modifier: "Žádné dámy v nesnázích"
 fp2_order_of_the_hachet_modifier_desc: "Muži i ženy tohoto hrabství je budou bránit rovným dílem."
 fp2_punished_order_of_the_hachet_modifier: "Dámy přinucené k nesnázím"
 fp2_punished_order_of_the_hachet_modifier_desc: "V těchto hrabstvích čekají na ty, kdo brání svou zem bez svolení lenního pána, tvrdší tresty než na samotné útočníky."
 fp2_struggle.3021.t: "Hněv nebes"
 fp2_struggle.3021.desc: "Když navštívím kasárna, [struggle_3021_knight.Custom2('MyCharacterIntroduction', ROOT.Char)|U] má tvář zkřivenou strachem. [struggle_3021_courtier.GetTitledFirstName] se snaží pomoci a při mém příchodu tázavě pozvedne obočí.\n\n„Povíš alespoň [Select_CString(ROOT.Char.IsFemale,'své paní','svému pánovi')], co se stalo?“\n\n[struggle_3021_knight.GetFirstNameNoTooltip] okamžitě zvedne hlavu. „M-má [Select_CString(ROOT.Char.IsFemale,'paní','pane')]... to, co jsem viděl[Select_CString(struggle_3021_knight.IsFemale,'a','')], nebylo určeno lidským očím. Z hradeb vrhali postavy kameny z černého prachu. Ty kameny vzplály a při dopadu mezi nepřátele zahřměly. Jednoho muže roztrhly vedví, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]!“\n\n[struggle_3021_courtier.GetFirstNameNoTooltip] zaujatě přikývne. „Možná... kdybychom i my dokázali získat takovou moc...“"
 fp2_struggle.3021.a: "Tohle rozhodně stojí za prozkoumání."
 fp2_struggle.3021.b: "Kdo ví, jaká nebezpečí by to mohlo přinést."
 fp2_struggle.3021.c: "Černý prach, říkáš... nové a ohnivé koření."
 fp2_struggle.3021.d: "To je [ROOT.Char.GetFaith.HighGodNamePossessive] trest!"
 fp2_struggle.3021.e: "Hrom do toho!"
 bad_struggle_3021_courtier_desc: "[struggle_3021_courtier.GetTitledFirstName] při výzkumu umírá"
 good_struggle_3021_courtier_desc: "[struggle_3021_courtier.GetTitledFirstName] ve výzkumu uspěje"
 bad_stone_research_title: "Úder hromu"
 good_stone_research_title: "Výzkum uspěl!"
 fp2_lightning_stones_modifier: "Hromové kameny"
 stone_poisoning_discovered: "Vymstilo se to"
 stone_poisoning_worked: "Ohnivé koření"
 stone_poisoning_worked_desc: "Záhadný černý prach byl úspěšně prozkoumán."
 fp2_lightning_stones_poison_modifier: "Otrava černým prachem"
 fp2_struggle.2000.t: "Nepořádek na trhu"
 fp2_struggle.2000.desc: "Při obhlídce tržiště narazím na [fp2_2000_market_inspector.GetFullName], [Select_CString(fp2_2000_market_inspector.IsFemale,'která se jako muhtasib marně snaží','který se jako muhtasib marně snaží')] přimět kramáře, aby dodržovali tržní pravidla. „Zboží všude bez ladu a skladu, olej vedle dveří mešity, nestažení králíci a sýr v mísách! Při Alláhovi, okamžitě mě všichni poslouchejte!“\n\n[fp2_2000_market_inspector.GetFirstNameNoTooltip] by přitom [Select_CString(fp2_2000_market_inspector.IsFemale,'měla','měl')] provinilce na trhu trestat, třeba i násilím, je-li to nutné. Obchodníci zaslepení chamtivostí však muhtasibovy příkazy jednoduše ignorují.\n\nJak mohu pomoci?"
 fp2_struggle.2000.a: "Zasáhnu a pohrozím přivoláním kádího."
 fp2_struggle.2000.a.desc: "Muhtasib napravuje pochybení zbloudilých obchodníků,\nkádí je trestá podle svého rozsudku"
 fp2_struggle.2000.a.a: "Obchodníci tě poslechnou, ale přesvědčeni nejsou"
 fp2_struggle.2000.a.a.notif: "Eskalace byrokracie"
 fp2_struggle.2000.a.b: "Vyřešíš situaci smírnou cestou"
 fp2_struggle.2000.a.b.notif: "Přijatelný kompromis"
 fp2_struggle.2000.b: "Všem jim pořádně vyčiním!"
 fp2_struggle.2000.b.desc: "Osobně se ujmeš tělesného potrestání obchodníků"
 fp2_struggle.2000.b.notif: "Projev píle"
 fp2_struggle.2000.b.notif.desc: "Obchodníci, otřeseni tím, že byl muhtasib zostuzen, rychle vyklidili tržiště."
 fp2_struggle.2000.d: "Proč by pravidla měla překážet obchodu?"
 fp2_struggle.2000.d.desc: "Obchod bez svazujících zvyklostí zvýší obchodní ruch, ale trh se bude postupně rozvracet"
 fp2_struggle.2000.e: "Takovou neposlušnost trpět nebudu! Stráže!"
 fp2_struggle.2000.f: "Když už jsme u toho, proč rovnou nepostavit nevěstinec?"
 fp2_struggle.2000.f.desc: "Povzbudíš obchodníky k dalšímu porušování pravidel hisby a pokusíš se tak zmírnit napětí"
 fp2_struggle.2000.f.notif: "Shovívavost k cizím obchodníkům"
 fp2_struggle.2000.f.notif.desc: "Od chvíle, kdy muhtasib přestal pravidla vymáhat, přestupků na trhu jen přibylo"
 fp2_struggle.2001.t: "Zapomenutá vesnice"
 fp2_struggle.2001.desc: "Během obhlídky areálu, kde stojí [ROOT.GetCharacter.Custom('FortifiedBuilding')], ke mně přistoupí vesnický stařešina.\n\n„[Select_CString(ROOT.Char.IsFemale,'Vznešená paní','Vznešený pane')], smilujte se nad námi a zachraňte naši vesnici před tyranií! [fp2_2001_desperate_county.GetHolder.GetName] nás už příliš dlouho zanedbává. Lid touží po novém vládci. Touží po vás, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')].“"
 fp2_struggle.2001.desc.extra.a: "Hrabství [fp2_2001_desperate_county.GetName] patří tvému spojenci [fp2_2001_desperate_county.GetHolder.GetName]. Poskytnout povstalcům vojenskou podporu by bylo aktem agrese.\n\n"
 fp2_struggle.2001.desc.extra.b: "[fp2_2001_desperate_county.GetHolder.GetName] drží [fp2_2001_desperate_county.GetName] a má s tebou platné příměří. Pomoc rolníkům by tuto dohodu porušila."
 fp2_struggle.2001.a: "Máš mé slovo. [fp2_2001_desperate_county.GetNameNoTierNoTooltip] získá svobodu!"
 fp2_struggle.2001.a.desc: "[fp2_2001_desperate_county.GetNameNoTier] musí být do #bold pěti let#! v tvých rukou"
 fp2_struggle.2001.a.a.desc: "[2001_scoped_chaplain.GetTitledFirstName] bude [Select_CString(2001_scoped_chaplain.IsFemale,'velmi zklamaná','velmi zklamaný')], pokud selžeš"
 fp2_struggle.2001.a.notif: "Získán oprávněný nárok"
 fp2_struggle.2001.b: "Jste ochotni kvůli tomu opustit svou víru?"
 fp2_struggle.2001.b.desc: "[fp2_2001_desperate_county.GetNameNoTier] musí být do #bold deseti let#! v tvých rukou"
 fp2_struggle.2001.b.notif: "[fp2_2001_desperate_county.GetNameNoTierNoTooltip] přijímá [ROOT.Char.GetFaith.GetNameNoTooltip]"
 fp2_struggle.2001.b.notif.desc: "[fp2_2001_desperate_county.GetNameNoTier]: ať už dobrovolně, nebo z nouze, zdejší vesnice přijala [ROOT.Char.GetFaith.GetName]"
 fp2_struggle.2001.c: "[fp2_2001_desperate_county.GetHolder.GetFirstNameNoTooltip] bude cílem vašich kopí! Tak mi dokažte své odhodlání."
 fp2_struggle.2001.d: "[Select_CString(ROOT.Char.IsFemale,'Možná můžete začít tím, že své nové paní zaplatíte tribut','Možná můžete začít tím, že svému novému pánovi zaplatíte tribut')]..."
 fp2_struggle.2001.d.notif: "Zoufalí vesničané platí za osvobození"
 fp2_struggle.2001.d.notif.desc: "Rolníci z [fp2_2001_desperate_county.GetName] dali dohromady poslední cennosti, které jim zbyly, aby zaplatili tribut za své osvobození"
 fp2_struggle.2001.e: "Je mi líto, ale váš lid si bude muset pomoci sám."
 fp2_struggle.2001.e.desc: "Ponecháš rolníky jejich osudu pod vládou [fp2_2001_desperate_county.GetHolder.GetName]"
 fp2_struggle.2001.f: "[fp2_2001_desperate_county.GetHolder.GetName] má mou podporu a o vaší zradě se dozví!"
 fp2_every_major_vassal_notifier: "Každý mocný vazal"
 fp2_every_major_same_faith_vassal_notifier: "Každý mocný [dyloc_powerful_vassal_faith.GetAdjective] vazal"
 fp2_every_major_different_faith_vassal_notifier: "Každý mocný vazal jiné víry než [dyloc_powerful_vassal_faith.GetName]"
 fp2_every_major_same_culture_vassal_notifier: "Každý mocný vazal [dyloc_powerful_vassal_culture.GetNameNoTooltip] kultury"
 fp2_one_independent_ruler_of_each_culture_notifier: "Jeden [Concept('independent_ruler','nezávislý vládce')|E] z každé [Concept('culture','kultury')|E], který je zapojen do tohoto [Concept('struggle','sváru')|E]"
 fp2_struggle.2002.t.a: "Osvobozená vesnice"
 fp2_struggle.2002.t.b: "Nesplněné závazky"
 fp2_struggle.2003.t: "Hejno zbloudilých ptáků"
 fp2_struggle.2003.desc: "Do [fp2_2003_county_town.GetName] dorazila skupina několika zraněných a rozčarovaných žoldnéřů. Místní prý zaslechli řeči o tom, že se „usadí, až vyplení nějaký snadný cíl“, a začínají mít obavy.\n\nNapětí stoupá a pokud nezasáhnu, nejspíš dojde ke konfliktu."
 fp2_struggle.2003.a: "Naléhavě je požádám, aby odešli."
 fp2_struggle.2003.a.a.notif: "Lapkové prosby ignorují"
 fp2_struggle.2003.a.b.notif: "Pokojné řešení"
 fp2_struggle.2003.b: "Nabídnu jim místo v městské posádce."
 fp2_struggle.2003.b.desc: "Posádce by se zkušení vojáci hodili a nakrmit zraněnou šelmu je nejrychlejší způsob, jak si ji ochočit"
 fp2_struggle.2003.c: "Vyžeňte je z města!"
 fp2_struggle.2003.c.desc: "Zorganizuješ preventivní úder a místní posádka překvapivým útokem vytlačí výtržníky z města\n"
 fp2_struggle.2003.c.a: "Žoldnéři vojáky povraždí"
 fp2_struggle.2003.c.b: "Vojáci žoldnéře zpacifikují"
 fp2_struggle.2003.c.b.notif: "Hrozba žoldnéřů potlačena"
 fp2_struggle.2003.d: "„Z vás budou skvělí sedláci!“"
 fp2_struggle.2003.d.desc: "Nabídneš místním, že od nich koupíš půdu a vybavení a předáš je žoldnéřům"
 fp2_struggle.2003.e: "Ať si s nimi poradí místní."
 fp2_struggle.2003.e.desc: "Napětí je už tak dost vysoké a další provokace by jen zvýšila riziko"
 fp2_struggle.2003.e.notif.a: "Žoldnéři plení kraj"
 fp2_struggle.2003.e.notif.b: "Provokace rolníků končí tragédií"
 fp2_struggle.2003.e.notif.b.desc: "Místní požadovali, aby žoldnéři odešli, ale těm stačila právě tato záminka k útoku."
 fp2_struggle.2003.e.notif.c: "Žoldnéři se usazují"
 fp2_struggle.2003.e.notif.c.desc: "Žoldnéři si [fp2_2003_county_town.GetName] oblíbili."
 fp2_struggle.2007.t: "Hrad hodný Iberie"
 fp2_struggle.2007.desc.main: "nabízejí skvělou příležitost k rozvoji,“ prohlašuje můj [fp2_2007_scoped_steward.GetCouncilTitleFirstName]. „S vaším financováním bychom mohli zabezpečit [fp2_2007_free_real_estate.GetCounty.GetTitle.GetNameNoTier] před nepřáteli, kteří jen čekají na svou příležitost, a to za #emphasis výrazně#! nižší cenu. [2007_vassal_sponsor.GetTitledFirstName] žádá, aby zde vznikl [ROOT.Char.Custom('FortifiedBuilding')] ve [fp2_2007_foreign_faith.GetAdjective] stylu, a nabízí část vlastních peněz, aby vás získal na svou stranu. Ostatní vazalové však požadují, abyste se drželi místních [ROOT.Char.GetFaith.GetAdjective] architektů. Ať zvolíte kohokoli, bude to jedinečná příležitost posílit celé panství.“ Zbývá jediná otázka: #EMP kdo#! tuto jedinečnou příležitost dostane..."
 fp2_struggle.2007.desc.a: "Vaše země $fp2_struggle.2007.desc.main$"
 fp2_struggle.2007.desc.b: "Území, kterému vládne [fp2_2007_castle_holder.GetTitledFirstName], $fp2_struggle.2007.desc.main$"
 fp2_struggle.2007.a: "Najmu [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] architekta."
 fp2_struggle.2007.a.castile: "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]? [fp2_2007_foreign_faith.GetAdjectiveNoTooltip]? Já chci architekta z [fp2_2007_allegedprotocastilean.GetNameNoTooltip] kultury!"
 fp2_struggle.2007.a.notif: "V [fp2_2007_free_real_estate.GetName] začne stavba hradu."
 fp2_struggle.2007.a.major_vassal_flavor: "Mínění mocných vazalů stejné víry se nezmění, protože právě takový výsledek očekávají."
 fp2_struggle.2007.a.castile.favor: "Proti architektovi z [fp2_2007_allegedprotocastilean.GetNameNoTooltip] kultury nikdo nic nenamítne, protože její stavitelé jsou proslulí svou zručností"
 fp2_struggle.2007.b: "Najmu [fp2_2007_foreign_faith.GetAdjectiveNoTooltip] architekta."
 fp2_struggle.2007.b.flavor: "Bez ohledu na víru bude toto rozhodnutí vnímáno jako jasné gesto."
 fp2_struggle.2007.c: "Hrad navrhnu sám. Jak těžké to může být?"
 fp2_struggle.2007.c.flavor: "Navrhnout hrad bez utracení celého jmění je nesmírně obtížný úkol."
 fp2_struggle.2007.c.roco: "$royal_architect_court_position$ se tohoto úkolu ujme."
 fp2_struggle.2007.c.notif.a.t: "Prohnilé základy, rozpadající se stavba"
 fp2_struggle.2007.c.notif.a.desc: "Tvé plány hradu pronásleduje jeden nezdar za druhým"
 fp2_struggle.2007.c.notif.b.desc: "Návrh se podařil"
 fp2_struggle.2007.d: "#EMP Nebudu#! financovat žádný hrad, zvlášť když nebude můj!"
 fp2_struggle.2007.d.alt: "Tyto země žádný hrad nepotřebují. Nechme je být."
 fp2_struggle.2008.t: "[fps_2008_misdeed_actor.GetCouncilTitle]: Nekalosti"
 fp2_struggle.2008.desc: "Večer sedí [fps_2008_misdeed_actor.GetCouncilTitleFirstName] v přítmí radní síně. Pozornost se upírá k nenápadným výkazům výdajů a brk pilně klouže po pergamenu. Vedle však leží hliněné formy s královskou pečetí, které by byly potřeba jedině k podvodu na panství. Že si někdo v takovém postavení vůbec troufne jednat tak hanebně, a ještě tam, kde vše vidí [ROOT.Char.GetFaith.HighGodName]!\n\nHanebně... ale obratně. Kdybych na to nepřišel právě teď, o celé machinaci by se nikdo nikdy nedozvěděl."
 fp2_struggle.2008.a: "Viděl jsem dost. Do žaláře s tebou!"
 fp2_struggle.2008.b.a: "Nauč mě padělat listiny a já ti prokážu milost."
 fp2_struggle.2008.b.flavor: "Zameteš důkazy pod koberec výměnou za znalosti umění klamu."
 fp2_struggle.2008.c: "Ty peníze jsou přece určeny mně... že ano?"
 fp2_struggle.2008.c.flavor: "Zameteš důkazy o provinění pod koberec a sám se zapojíš do korupce."
 fp2_struggle.2008.d: "Veřejně tě zostudím na náměstí."
 fp2_struggle.2008.d.flavor: "Odhalíš lidu nekalosti této postavy, aby ji mohl sám soudit, navzdory přání vazalů a rádců celou záležitost ututlat."
 fp2_struggle.2009.t: "Lov na zloděje z legend"
 fp2_struggle.2009.desc: "„Vybral sis špatný hrad, hlupáku!“ křičí [fp2_2009_marshal.GetCouncilTitleFirstName] a s mečem v ruce hrozí vyděšenému vetřelci.\n\nPod dalším nátlakem [Select_CString(fp2_2009_garduna_young_thief.IsFemale,'mladá zlodějka','mladý zloděj')] přizná, že patří k rozsáhlé zločinecké organizaci, jejímž původním domovem je [fp2_2009_involved_ruler.GetPrimaryTitle.GetName] a které velí obávaný [Select_CString(fp2_2009_garduna_guild_master.IsFemale,'vůdkyně','vůdce')] [fp2_2009_garduna_guild_master.GetFullNameNicknamed]. „Takže se mi přímo pod nosem snažíte založit nový cech zlodějů, co?“ ptám se. [fp2_2009_garduna_young_thief.GetFirstNameNoTooltip] jen přikývne. Výměnou za svůj život je ochota prozradit víc očividná."
 fp2_struggle.2009.a: "V tomhle panství není místo pro #EMP [Select_CString(ROOT.Char.IsFemale,'dvě královny','dva krále')]#!."
 fp2_struggle.2009.a.flavor: "Propustíš zloděje výměnou za úkryt vůdce cechu a poté se vydáš na výpravu, abys jej porazil a získal titul „Postrach zlodějů“."
 fp2_struggle.2009.b: "Prozraď mi, kde se skrývají tví komplicové, a možná přežiješ."
 fp2_struggle.2009.b.blues: "Za zradu svých přátel získá [Concept('trait','rys')|E] #TUT_KW [GetTrait('depressed_1').GetName(GetNullCharacter)]#!"
 fp2_struggle.2009.c: "Ten váš cech zlodějů zní... #emphasis zdanitelně.#!"
 fp2_struggle.2009.d: "Pracuj pro mě. Ať [fp2_2009_involved_ruler.GetPrimaryTitle.GetNameNoTooltip] pozná chaos."
 fp2_struggle.2009.d.flavor.st: "Zaplatíš zlodějskému cechu, aby opustil tvé země"
 fp2_struggle.2009.e: "[fp2_2009_involved_ruler.GetTitledFirstNameNoTooltip] dostane darem tvou useknutou hlavu."
 fp2_struggle.2009.e.a: "Zlodějský cech se může pomstít a destabilizovat náhodné hrabství"
 fp2_struggle.2010.t: "Lov na kunu skalní"
 fp2_struggle.2010.desc: "Po cestě, jejímž cílem je [fp2_2009_involved_capital_county.GetNameNoTierNoTooltip], vstoupím do opuštěného kostela. [fp2_2009_garduna_guild_master.GetNameNoTooltip] už na mě čeká.\n\n„[ROOT.Char.GetFirstNameNoTooltip], předpokládám? [ROOT.Char.Custom('signature_weapon')|U] mi napovídá, že jste nepřišel vyjednávat. Zloději však mají blíž k obchodníkům než k vojákům. Když mi zaplatíte, můžeme oba odejít spokojeni. Pak už pro mě [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] nebude představovat žádný obchodní zájem.“"
 fp2_struggle.2010.b: "Připrav se přijít o hlavu, hade!"
 fp2_struggle.2010.c: "Výpalné zní lépe než boj..."
 fp2_struggle.2011.desc: "Když je [fp2_2009_garduna_guild_master.GetFirstName] [Select_CString(fp2_2009_garduna_guild_master.IsFemale,'poražena','poražen')], cech zlodějů i jeho činnost utrpí zdrcující ránu."
 fp2_struggle.2011.a: "Je skvělé být [Select_CString(ROOT.Char.IsFemale,'královnou','králem')] #DIE2 zlodějů#!"
 fp2_struggle.2012.t: "Hlášení z místních zdrojů:"
 fp2_struggle.2012.desc: "[fp2_2009_involved_capital_county.GetNameNoTierNoTooltip] sužuje banda nelítostných zlodějů. Je zřejmé, že někdo tyto zločince úmyslně financuje, aby škodili našim zájmům. Prozatím by bylo moudré pověřit maršála zabezpečením oblasti."
 fp2_struggle.2012.a: "Ať je za tím kdokoli, hraje pěkně špinavě!"
 fp2_struggle.2012.t.alt: "[fp2_2012_sender.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 fp2_struggle.2012.desc.alt: "Spolu s tímto dopisem najdete useknutou hlavu [Select_CString(fp2_2009_garduna_young_thief.IsFemale,'jedné ze zlodějek','jednoho ze zlodějů')], kteří řádili v obou našich panstvích. [Select_CString(fp2_2012_sender.IsFemale,'Nechala jsem ji popravit','Nechal jsem ho popravit')] a [fp2_2009_involved_capital_county.GetNameNoTier] má posádku, které jsem sdělil[Select_CString(fp2_2012_sender.IsFemale,'a','')] místo, kde se skrývají komplicové popraveného zloděje."
 fp2_struggle.2012.a.alt: "[fp2_2009_has_gifted_head.GetFirstNameNoTooltip] mi [Select_CString(fp2_2009_has_gifted_head.IsFemale,'přinesla','přinesl')] rozkošný dárek!"
 fp2_struggle.2013.t: "Tajemství výměnou za svobodu"
 fp2_struggle.2013.desc: "[fp2_2013_prisoner_with_a_secret.GetFullNameRegnal] je mi vydán[Select_CString(fp2_2013_prisoner_with_a_secret.IsFemale,'a','')] na milost a dobře si to uvědomuje. Přichází proto zoufalá nabídka... „Pokud mě propustíte, prozradím vám tajemství, které skrývá [fp2_2013_secret_owner.GetFullNameRegnal].“"
 fp2_struggle.2013.a: "Prozraď mi tajemství a budeš [Select_CString(fp2_2013_prisoner_with_a_secret.IsFemale,'svobodná žena','svobodný muž')]."
 fp2_struggle.2013.a.a: "Zjistíš, jaké tajemství skrývá #TUT_KW [fp2_2013_secret_owner.GetFirstName]#!"
 fp2_struggle.2013.b: "Proč smlouvat, když tě můžu jednoduše mučit?"
 fp2_struggle.2013.b.b: "[fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip] odolává mučení"
 fp2_struggle.2013.c: "Ty proradná zmije! [fp2_2013_secret_owner.GetFirstNameNoTooltip] se o tom dozví!"
 fp2_struggle.2013.c.desc: "Tajemství nezjistíš. Zradu má na svědomí [fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip] a o trestu za ni rozhodne [fp2_2013_secret_owner.GetFirstNameNoTooltip]."
 fp2_struggle.2013.c.a: "O osudu postavy [fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip] rozhodne [fp2_2013_secret_owner.GetFirstName]"
 fp2_struggle.2013.d: "Nic neslibuji. Řekni mi to a možná o tom později popřemýšlím..."
 fp2_struggle.2014.t: "[Select_CString(ROOT.Char.IsFemale,'Vznešená','Vznešený')] [ROOT.Char.GetNameNoTooltip]:"
 fp2_struggle.2014.desc.start: "Díky vám je [fp2_2013_prisoner_with_a_secret.GetNameNoTooltip] opět u mě. "
 fp2_struggle.2014.desc.light: "Nevěřím však, že se stalo něco, co by zasluhovalo trest. [fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip] proto odchází bez úhony.$fp2_struggle.2014.desc.end$"
 fp2_struggle.2014.desc.heavy.start: "[Select_CString(fp2_2013_prisoner_with_a_secret.IsFemale,'Podle všeho se [fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip] pokusila prodat má tajemství, aby si zachránila vlastní kůži.','Podle všeho se [fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip] pokusil prodat má tajemství, aby si zachránil vlastní kůži.')]"
 fp2_struggle.2014.desc.heavy.outcome.prison: "$fp2_struggle.2014.desc.heavy.start$ Postarám se o to, že [fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip] už nikdy neuvidí denní světlo. A má tajemství také ne. $fp2_struggle.2014.desc.end$"
 fp2_struggle.2014.desc.heavy.outcome.death: "$fp2_struggle.2014.desc.heavy.start$ Místo toho dostal můj mučitel rozkaz stáhnout z té svině kůži do posledního cáru! $fp2_struggle.2014.desc.end$"
 fp2_struggle.2014.desc.end: "\n\nByla to pro mě velká pomoc a nezapomenu na ni. Děkuji."
 fp2_struggle.2014.b: "Škoda, že [fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip] [Select_CString(fp2_2013_prisoner_with_a_secret.IsFemale,'unikla popravě','unikl popravě')], ale alespoň mi to přineslo přízeň."
 fp2_struggle.2015.t: "Vzkaz na zádech"
 fp2_struggle.2015.desc: "Když procházím svým dvorem, všimnu si neznámé tváře, která míří přímo ke mně. „[ROOT.Char.Custom('ComplimentAdjective')|U] – jiné slovo pro vás ani nenacházím. Jmenuji se [fp2_struggle_2015_peasant_to_murder.GetFirstName]. [fp2_struggle_2015_murder_requester_vassal.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)|U] – právě u tohoto dvora jsem dříve působil[Select_CString(fp2_struggle_2015_peasant_to_murder.IsFemale,'a','')]. Mám se vám představit a vstoupit k vašemu dvoru. Mám pro vás také doporučující dopis, který smíte číst pouze vy.“ Poté mi [fp2_struggle_2015_peasant_to_murder.GetFirstNameNoTooltip] podá zapečetěný dopis.\n\nPo rozlomení pečeti v něm stojí jen: „#EMP [Select_CString(ROOT.Char.IsFemale,'Drahá','Drahý')] [ROOT.Char.GetFirstName], prosím, zavraždi doručitele tohoto dopisu#!. – [fp2_struggle_2015_murder_requester_vassal.GetFirstNameNoTooltip]“"
 fp2_struggle.2015.a: "„Vítej! Pojď, dej si [ROOT.Char.Custom('GetExpensiveDrink_Singular')]... #DIE2 (s trochou jedu)#!.“"
 fp2_struggle.2015.a.a: "Pokus o otravu zpackáš"
 fp2_struggle.2015.a.murder_scheme: "[fp2_struggle_2015_murder_requester_vassal.GetTitledFirstName] se bude nadále pokoušet zavraždit [fp2_struggle_2015_peasant_to_murder.GetFirstName]"
 fp2_struggle.2015.a.b: "Jed zabral!"
 fp2_struggle.2015.b: "Dopis ignoruji. [fp2_struggle_2015_peasant_to_murder.GetFirstNameNoTooltip] může zůstat u mého dvora."
 fp2_struggle.2015.c: "„Jdou po tobě. Uteč, dokud můžeš.“"
 fp2_struggle.2015.c.a: "[fp2_struggle_2015_peasant_to_murder.GetFirstNameNoTooltip]: útěk „záhadně selhal“"
 fp2_struggle.2015.c.b: "[fp2_struggle_2015_murder_requester_vassal.GetFirstNameNoTooltip] uvěří, že [fp2_struggle_2015_peasant_to_murder.GetFirstNameNoTooltip] je po smrti"
 fp2_struggle.2016.t: "[Select_CString(ROOT.Char.IsFemale,'Hloupá','Hloupý')] [ROOT.Char.GetFirstNameNoTooltip],"
 fp2_struggle.2016.desc: "Vím, že jsi na mou žádost [Select_CString(ROOT.Char.IsFemale,'zavraždila','zavraždil')] [Select_CString(fp2_struggle_2015_peasant_to_murder.IsFemale,'mou nejmilejší vyslankyni','mého nejmilejšího vyslance')] [fp2_struggle_2015_peasant_to_murder.GetFirstNameNoTooltip]. Ale neboj se. Jako [Select_CString(fp2_struggle_2015_murder_requester_vassal.IsFemale,'tvá věrná vazalka','tvůj věrný vazal')] uchovám toto tajemství mezi námi. Dokud si budeme navzájem pomáhat, jak se na dobré přátele sluší."
 fp2_struggle.2016.a: "To je podraz! [fp2_struggle_2015_murder_requester_vassal.Custom2('InsultNoun', ROOT.Char)|U]!"
 fp2_struggle.2018.t: "Šachy mezi přáteli"
 fp2_struggle.2018.t.outcome.a: "Rodící se přátelství"
 fp2_struggle.2018.t.outcome.b: "Příjemná společnost"
 fp2_struggle.2018.t.outcome.c: "Nepříjemné posezení"
 fp2_struggle.2018.desc.desc_combat_clarification: "V duchu se naše meče srážely v zuřivé bitvě strategického důvtipu a čirého odhodlání.\n\nVe skutečnosti jsme jen posouvali figurky po šachovnici, ale soustředění bylo tak intenzivní, že místnost i deska zmizely kdesi v éteru a zůstalo jen bojiště stvořené naší představivostí. Tah za tahem jsme se přibližovali k vítězství a urputně bojovali o každého pěšce...\n\n"
 fp2_struggle.2018.desc.desc_intro: "Minuty se mění v hodiny a soumrak ohlašuje konec našeho společného času. [fp2_2017_gamervassal.GetFirstNameNoTooltip] poznamená... "
 fp2_struggle.2018.desc.good_intro_match: "„Ach, skvělá partie!"
 fp2_struggle.2018.desc.bad_intro_match: "„Uf, to byla partie... Chce to víc tréninku. Tvé tahy byly jednoduché a předvídatelné a proti někomu, kdo se neumí bránit, není žádná radost hrát. "
 fp2_struggle.2018.desc.fought_hard: "$fp2_struggle.2018.desc.good_intro_match$ To byl boj zuby nehty, to respektuji. "
 fp2_struggle.2018.desc.was_creative: "$fp2_struggle.2018.desc.good_intro_match$ To hroší zahájení na královském křídle mě opravdu zaskočilo. Tak odvážný tah! "
 fp2_struggle.2018.desc.match_end_win: "A ještě k tomu vítězství. Zasloužené! "
 fp2_struggle.2018.desc.match_end_loss: "Nakonec jsem ale přece jen vyhrál[Select_CString(fp2_2017_gamervassal.IsFemale,'a','')]. "
 fp2_struggle.2018.desc.match_end_loss_noticed: "Nakonec se mi přece jen podařilo vyhrát, ale mám pocit, že to byl celou dobu tvůj záměr. "
 fp2_struggle.2018.desc.social_pre_intro: "Čas trávíme pitím a hovorem o všem možném, od prostých záležitostí okolních vesnic až po výsledky soubojů, v nichž proti sobě stojí [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]. "
 fp2_struggle.2018.desc.social_pre_intro_crit: "Rozhovor [fp2_2017_gamervassal.GetFirstName] naprosto pohltil a každé téma vyvolává další zanícenou debatu."
 fp2_struggle.2018.desc.social_pre_intro_good: "[fp2_2017_gamervassal.GetFirstName] si rozhovor i pohostinnost očividně užívá.\n\n"
 fp2_struggle.2018.desc.social_pre_intro_bad: "[fp2_2017_gamervassal.GetFirstName] se po celou dobu nudí a myšlenkami bloudí kdovíkde...\n\n"
 fp2_struggle.2018.desc.social_intro: "„Myslím, že už mám pití dost. "
 fp2_struggle.2018.desc.social_good: "[ROOT.Char.Custom('GetExpensiveDrink_Singular')|U] byl výborný, děkuji. "
 fp2_struggle.2018.desc.outcome_0: "To byla skvělá zábava! Musím tě navštěvovat častěji!“"
 fp2_struggle.2018.desc.outcome_1: "Byla to zábava. Třeba se někdy zastavím znovu.“"
 fp2_struggle.2018.desc.outcome_2: "Musím už jít. [SCOPE.sC('fp2_2017_gamervassal').Custom2('RelationToMe', SCOPE.sC('fp2_2017_questgiver'))|U] mě nejspíš postrádá. Sbohem, [ROOT.Char.GetFirstNameNoTooltip].“"
 fp2_struggle.2018.a: "Úspěch! [fp2_2017_gamervassal.GetFirstNameNoTooltip] je teď na mé straně!"
 fp2_struggle.2018.b: "Nestali jsme se zrovna přáteli, ale dobře jsme se bavili!"
 fp2_struggle.2018.c: "Uf, to nedopadlo dobře..."
 fp2_struggle.2020.t: "Açò és or, xata!"
 fp2_struggle.2020.desc: "[fp2_2020_valencia.GetName] leží na mé cestě a jedna selka mi nabídne osvěžující hrnek mléka, sladšího než cokoli, co jsem kdy ochutnal[Select_CString(ROOT.Char.IsFemale,'a','')]. „Co je to za úžasný nápoj?“ ptám se. „Mléko ze zemních mandlí,“ odpoví.\n\nTomuto nápoji by za horkého letního dne neodolal nikdo, žádné dítě by se při pohledu na plný hrnek neubránilo úsměvu a žádný obyvatel Valencie by nezapřel, že na něj má chuť. #EMP Tohle není mléko, to je zlato!#!"
 fp2_struggle.2020.a: "„Odteď bude [fp2_2020_valencia.GetNameNoTooltip] pěstovat výhradně zemní mandle!“"
 fp2_struggle.2020.a.desc: "Přinutíš rolníky pěstovat výhradně zemní mandle a vyrábět z nich luxusní zboží pro své hlavní město."
 fp2_struggle.2020.b: "„Dej mi všechny sudy. Tohle bude středobodem mé příští hostiny!“"
 fp2_struggle.2020.c: "„Pokušení tohoto nápoje nepodlehnu. Pryč!“"
 fp2_struggle.2020.c.desc: "S těžkým srdcem se vzdáš horchaty. Tvé odolání velkému pokušení ti vynese věhlas."
 fp2_struggle.2020.d: "Financovat další výsadbu zemních mandlí na polích."
 fp2_struggle.2021.t: "Návrat [Select_CString(fp2_2009_garduna_guild_master.IsFemale,'královny','krále')] zlodějů"
 fp2_struggle.2021.desc: "„Zdravím tě, [ROOT.Char.GetFirstName]. Vsadím se, že jsi [Select_CString(ROOT.Char.IsFemale,'nečekala','nečekal')], že mě ještě někdy uvidíš. "
 fp2_struggle.2021.desc.alt.cutout: "Zvlášť poté, co jsi před lety zničil[Select_CString(ROOT.Char.IsFemale,'a','')] mou organizaci. Jenže něco rozbít je stejně snadné jako to znovu poskládat a já už nemám chuť hrát si s tebou na kočku a myš. Zaruč mi bezpečný průchod do [fp2_2021_old_napoly.GetNameNoTier] a už mě nikdy neuvidíš. Cech obnovím daleko od tebe i tvého bohatství.“"
 fp2_struggle.2021.desc.alt.paidoff: "Zvlášť když jsme se dohodli, že ti už nebudeme působit potíže. Jenže můj měšec je zase nepříjemně lehký. Této zemi se možná zločin daří, ale pro jeho organizování se nehodí. Chci přesunout své lidi i sebe do [fp2_2021_old_napoly.GetNameNoTier]. Zaruč nám bezpečný průchod a už si s námi nebudeš muset dělat starosti.“"
 fp2_struggle.2021.desc.alt.work: "Minule se mi ale s tebou docela dobře spolupracovalo a spolehlivých [Select_CString(ROOT.Char.IsFemale,'žen','mužů')] mám zoufale málo. Teď bych chtěl[Select_CString(fp2_2009_garduna_guild_master.IsFemale,'a','')] skončit, dokud jsem ještě ve výhodě. Zaručíš mi bezpečný průchod do [fp2_2021_old_napoly.GetNameNoTier]?“"
 fp2_struggle.2021.desc.alt.behead: "Nepřišel[Select_CString(fp2_2009_garduna_guild_master.IsFemale,'a','')] jsem pomstít [fp2_2009_garduna_young_thief.GetFirstName], ale odejít do výslužby. Jedna useknutá hlava mi bohatě stačila a moc dobře vím, že příště by mohla přijít řada na tu mou. Zaruč mi bezpečný průchod do [fp2_2021_old_napoly.GetNameNoTier] a už mě nikdy neuvidíš. Není důvod, aby naše setkání skončilo krveprolitím.“"
 fp2_struggle.2021.desc.outro: "pronáší [fp2_2009_garduna_guild_master.GetFullNameNicknamed] a nervózně přitom svírá v jedné ruce měšec mincí a v druhé ukrytou zbraň."
 fp2_struggle.2021.a: "„Dobrá, pomohu ti odejít do Itálie.“"
 fp2_struggle.2021.a.alt: "„Co takhle místo toho prostě odejít do výslužby v Itálii?“"
 fp2_struggle.2021.a.a: "[fp2_2009_garduna_guild_master.GetFirstName] odjede do [fp2_2021_old_napoly.GetName] a zmizí"
 fp2_struggle.2021.b: "„Co kdybys místo toho [Select_CString(fp2_2009_garduna_guild_master.IsFemale,'vstoupila','vstoupil')] do mých služeb?“"
 fp2_struggle.2021.c: "„Co takhle vyměnit zločin za špionáž?“"
 fp2_struggle.2021.c.flavor: "Nabídneš [fp2_2009_garduna_guild_master.GetFirstNameNoTooltip] dost peněz na provoz špionážní sítě, která pro tebe bude pátrat po tajemstvích."
 fp2_struggle.2021.c.a: "Špionážní síť vypátrá a oznámí až dvě tajemství jiných vládců zapojených do sváru"
 fp2_struggle.2021.c.spynet.a: "Špionážní síť odhalila tajemství:"
 fp2_struggle.2021.c.spynet.b: "Špionážní síť žádná tajemství nenašla"
 fp2_struggle.2021.c.spynet.b.desc: "Špionážní síť vedená [fp2_2009_garduna_guild_master.GetFirstName] nenalezla žádná významná tajemství, ale tvůj špehmistr díky celé zkušenosti mnohé poznal..."
 fp2_struggle.2021.d: "„Ne, tentokrát mi neunikneš! Připrav se!“"
 fp2_struggle.2021.d.alt: "Máš pravdu, tvoje hlava #EMP bude#! další! #BER Chcípni!#!"
 fp2_struggle.2021.d.a: "Likvidace starých nepřátel"
 fp2_struggle.2021.d.b: "@warning_icon! Vstoupíš do smrtícího souboje s [dueltarget.GetFirstName]"
 fp2_struggle.2023.t: "Král za barda"
 fp2_struggle.2023.desc: "Pobývám ve stanu v táboře na hranici s [fp2_2023_foreign_king.GetPrimaryTitle.GetName] a mám za úkol zjistit, jaké napětí panuje mezi našimi panstvími. Náhle do stanu vstoupí [Select_CString(fp2_2023_enemy_knight.IsFemale,'nepřátelská rytířka','nepřátelský rytíř')] a dožaduje se setkání s „novým velitelem“. Instinktivně vykročím vpřed.\n\n„Takže ty jsi nový velitel? Dobrá, vyber si soutěž. Kdo prohraje, dnes večer platí pití celému druhému táboru!“ pronese [fp2_2023_enemy_knight.GetFirstName], [Select_CString(fp2_2023_enemy_knight.IsFemale,'velitelka','velitel')] cizího tábora, aniž tuší, že jsem [ROOT.Char.GetFirstNameRegnal], nikoli [Select_CString(ROOT.Char.IsFemale,'nějaká obyčejná velitelka','nějaký obyčejný velitel')]."
 fp2_struggle.2023.a.desc: "Prozradíš vojákům, kdo skutečně jsi, ukončíš jejich veselici a za bratříčkování s nepřítelem ve službě jim nařídíš za trest dělat dřepy."
 fp2_struggle.2023.a.a: "„Ty [Select_CString(fp2_2023_enemy_knight.IsFemale,'hlupačko','hlupáku')], já jsem [ROOT.GetCharacter.GetFullNameNoTooltip]!“"
 fp2_struggle.2023.b: "„Každý složíme co nejjízlivější báseň o pánovi toho druhého!“"
 fp2_struggle.2023.b.desc: "Každý z vás sepíše hanlivou báseň o vládci druhé strany a pak ji nahlas přednese rozjařenému davu."
 fp2_struggle.2023.b.a: "Zesměšníš [fp2_2023_foreign_king.GetFirstNameRegnal]"
 fp2_struggle.2023.b.b: "Tvá poezie se stane terčem posměchu"
 fp2_struggle.2023.c: "„Rozhodneme to přátelským soubojem. Do střehu!“"
 fp2_struggle.2023.c.desc: "Utkaš se s [fp2_2023_enemy_knight.GetFirstNameNoTooltip] v nekrvavém souboji, který rozhodne, kdo pak zaplatí pití."
 fp2_struggle.2023.c.exptooltip: "Ze souboje můžeš získat další zkušenosti pro [Concept('martial_lifestyle','válečnický životní styl')|E]."
 fp2_struggle.2023.c.a: "[Select_CString(fp2_2023_enemy_knight.IsFemale,'Nepřátelská velitelka poražena','Nepřátelský velitel poražen')]"
 fp2_struggle.2023.c.b: "Vítězí [fp2_2023_enemy_knight.GetNameNoTooltip]"
 fp2_struggle.2023.d: "„Proč čekat na hospodu? Soutěžme v pití piva!“"
 action_considered_haram_warning: "@warning_icon! #italic Tato akce je považována za#! #X harám#!#italic !#!"
 fp2_struggle.2023.d.a: "Opiješ se do bezvědomí"
 fp2_struggle.2023.d.b: "Sud na posezení"
 fp2_struggle.2025.t: "Když úspěch bolí"
 fp2_struggle.2025.desc: "V teplé záři slunce se rozprostírá kus země se zanedbanými poli a rozpadajícími se staveními. Vítr mezi zchátralými kameny šeptá nářek osamění. Je to jen jedna z mnoha podobných vesnic v [fp2_2025_razed_land.GetNameNoTier]. Lidé, kteří uprchli před válkou, se nevrátili ani poté, co boje utichly a nad krajem zavlála vlajka [ROOT.Char.GetPrimaryTitle.GetName].\n\n„Nádhera, že?“ ozve se [fp2_2025_marshal.GetFirstName]. „Volná půda, jako stvořená k obnově. Přímo tady bychom mohli postavit památník našeho úspěchu.“"
 fp2_struggle.2025.a: "Naši noví poddaní potřebují čas truchlit, ne znovu bojovat..."
 fp2_struggle.2025.b: "Skvělý nápad! Právě zde bude stát ten nejvelkolepější památník!"
 fp2_struggle.2025.c: "Obnovíme toto město do někdejší podoby."
 fp2_struggle.2025.d: "Zřídím zde dočasné základny, které budou střežit mé nově získané země."
 fp2_struggle.2050.title_main_ichi: "Neklid:"
 fp2_struggle.2050.title_main_ni: "Dvorní zvěsti:"
 fp2_struggle.2050.title_main_san: "Nepřátelské šeptání:"
 fp2_struggle.2050.title_main_shi: "Obavy:"
 fp2_struggle.2050.t_about_generic: "El Cid"
 fp2_struggle.2050.t_about_muslim: "El Sidi"
