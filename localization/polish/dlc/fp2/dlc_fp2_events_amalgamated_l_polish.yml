 fp2_struggle.0501.t: "$iberian_struggle$"
 fp2_struggle.0501.desc: "Iberský poloostrov svírá chaos, konflikt zrozený z jeho pohnuté minulosti. Cizinci lační po zdejší zemi a velké muslimské i křesťanské mocnosti se snaží získat její obyvatele na svou stranu. O jejím osudu však nakonec rozhodnou ti, kdo na této půdě žijí a umírají.\n\n"
 fp2_struggle.0501.desc.involved: "Svou představu o budoucnosti vlasti si nenechám vzít. Ať [ROOT.Char.GetFaith.HighGodName] stojí při mně, rod [ROOT.Char.GetHouse.GetNameNoTooltip] tuto bouři přečká a má vůle se naplní.\n\n"
 fp2_struggle.0501.desc.interloper: "Nastal čas chopit se situace i vlastního osudu. Všechny figurky už stojí na šachovnici. Vím, kudy vede cesta vpřed, a rod [ROOT.Char.GetHouse.GetNameNoTooltip] už nikdo nezastaví.\n\n"
 fp2_struggle.0501.desc.mottocall: "[ROOT.Char.GetHouse.GetMotto]!"
 fp2_struggle.0501.a: "Chopit se osudu!"
 fp2_struggle.0900.t: "$struggle_iberia_ending_hostility_decision$"
 fp2_struggle.0900.opening.basque: "Naše [ROOT.Char.GetCulture.GetNameNoTooltip] kultura po staletí odolávala vpádům Vizigótů, Galů, Maurů... ale síla každého z nich časem ochabla. Dnes je osud Iberie znovu v #EMP našich#! rukou."
 fp2_struggle.0900.opening.andalusian: "Dějiny našeho lidu jsou stejně spletité jako jeho rozmanitost a stejně plné svárů jako síly. O budoucnosti Iberie budou znovu rozhodovat dědicové Umajjovců."
 fp2_struggle.0900.opening.iberian: "Iberské národy příliš dlouho trpěly pod rukama maurských nájezdníků. Dnes obnovíme naději, kterou právoplatní dědicové Říma ztratili před staletími."
 fp2_struggle.0900.opening: "Chaos, který Iberii sužoval v uplynulých staletích, zanechal stopu v srdcích všech jejích obyvatel. Dnes začíná nová kapitola dějin tohoto poloostrova..."
 fp2_struggle.0900.desc: "\n\nV Iberii už nezůstalo žádné jiné panství, které by mohlo skutečně zpochybnit [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] nadvládu nebo zastavit kněze a osadníky, kteří do zdejších vesnic přinášejí slovo [ROOT.Char.GetFaith.HighGodName] a [ROOT.Char.GetCulture.GetName] civilizaci.\n\nZbývá už jen vyhlásit naše vítězství a rozhodnout, jak budeme této zemi vládnout."
 fp2_struggle.0900.a: "[ROOT.Char.GetFaith.HighGodNameAlternate] bude vládnout této zemi!"
 fp2_struggle.0900.b: "Osídlení tohoto poloostrova bude naší prioritou."
 fp2_struggle.0900.c: "Ať [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] vládnou Iberii – [ROOT.Char.GetFaith.HighGodName] to tak chce!"
 fp2_struggle.0910.opening.involved: "Ačkoli přichází z jiného panství, možná je konečně nablízku vysvobození z nejistoty, která tento kraj svírala po celá staletí..."
 fp2_struggle.0910.opening: "K našemu dvoru dorazily zprávy o nedávném vývoji na Iberském poloostrově, který snad přinese konec konfliktům sužujícím tento kraj."
 fp2_struggle.0910.desc: "\n\n[struggle_ender.GetName], [Select_CString(struggle_ender.IsFemale,'která nyní ovládá','který nyní ovládá')] většinu poloostrova, se [Select_CString(struggle_ender.IsFemale,'prohlásila za konečnou vítězku','prohlásil za konečného vítěze')] bojů, jež před dávnými časy rozpoutala maurská invaze.\n\n"
 fp2_struggle.0910.closing.faith: "[Select_CString(struggle_ender.IsFemale,'Prohlásila','Prohlásil')], že v Iberii bude vládnout [struggle_ender.GetFaith.GetName] a že, dá-li [struggle_ender.GetFaith.HighGodName], budou všichni kacíři a nevěřící vyhnáni ze zemí pod [Select_CString(struggle_ender.IsFemale,'její','jeho')] vládou."
 fp2_struggle.0910.closing.culture: "[Select_CString(struggle_ender.IsFemale,'Prohlásila','Prohlásil')], že Iberii právem ovládá [struggle_ender.GetCulture.GetName] kultura a že všichni cizí vetřelci i podrobené národy musí tuto skutečnost přijmout."
 fp2_struggle.0910.closing.combined: "[Select_CString(struggle_ender.IsFemale,'Prohlásila','Prohlásil')], že Iberie a [struggle_ender.GetPrimaryTitle.GetNameNoTier] jsou nyní jedno a totéž. [struggle_ender.GetFaith.GetName] a [struggle_ender.GetCulture.GetName] kultura zde mají vládnout – tak káže [struggle_ender.GetFaith.HighGodName]..."
 fp2_struggle.0910.a: "Ještě není konec."
 fp2_struggle.0910.b: "Velmi zajímavé."
 fp2_struggle.0901.t: "$struggle_iberia_ending_compromise_decision$"
 fp2_struggle.0901.desc: "\n\nJe nyní jasné, že pokud vše půjde dál stejnou cestou, tento koloběh krveprolití nikdy neskončí. Tento poloostrov se sjednotit nedá.\n\n[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] nám musí stačit a ostatní iberská knížata ponecháme jejich vlastnímu osudu – alespoň prozatím..."
 fp2_struggle.0901.a: "Tak je to nejlepší."
 fp2_struggle.0901.tt: "[THIS.Char.GetPrimaryTitle.GetDeJureLiege.GetNameNoTier]: nyní [Concept('de_jure','de iure')|E] [Concept('empire','říše')|E]"
 fp2_struggle.0911.desc: "\n\n[struggle_ender.GetTitledFirstName] se [Select_CString(struggle_ender.IsFemale,'oficiálně vzdala','oficiálně vzdal')] všech úmyslů sjednotit poloostrov pod jedinou korunou a [Select_CString(struggle_ender.IsFemale,'prohlásila','prohlásil')] každého, kdo by si na takový titul činil nárok, za nelegitimního.\n\nRozdílná panství utvářená staletími invazí a reconquisty už zakořenila příliš hluboko na to, aby mohla být sjednocena."
 fp2_struggle.0911.a: "Na sen o Hispánii nezapomeneme..."
 fp2_struggle.0902.t: "$struggle_iberia_ending_conciliation_decision$"
 fp2_struggle.0902.desc: "\n\nSlavnostní záruka ochrany, kterou nyní mohu prosadit pouze já, zajistí, že rozmanité národy tohoto kraje budou moci svobodně žít a vyznávat svou víru.\n\nDá-li [ROOT.Char.GetFaith.HighGodName], války minulosti zůstanou minulostí a ostatní iberská knížata poznají výhody pokojného soužití."
 fp2_struggle.0902.a: "Vyšlete heroldy."
 fp2_struggle.0912.desc: "\n\n[struggle_ender.GetPrimaryTitle.GetAdjectiveNoTooltip] heroldi vyhlásili záruky svobodného pohybu a vyznání pro všechny a jejich dodržování zaručuje [struggle_ender.GetTitledFirstName]. Prostý lid zprávu přijal s všeobecným nadšením.\n\nMnozí už dlouho touží po konci krveprolití v Iberii. Snad #EMP tento#! mír opravdu vydrží."
 fp2_struggle.0912.a: "To je vskutku překvapení."
 fp2_yearly.1001.t: "Vylepšené šachy"
 fp2_yearly.1001.desc: "Po další vítězné partii šachu proti sobě samému mě napadá, že by můj mimořádný intelekt mohl tuto hru přece jen trochu vylepšit.\n\nAle jaká změna by dávala největší smysl?"
 fp2_yearly.1001.a: "Král je očividně příliš slabý."
 fp2_yearly.1001.b: "Střelec by měl být silnější."
 fp2_yearly.1001.c: "Proč nemůžu mučit pěšce?"
 fp2_yearly.1002.t: "Choulostivá pozice"
 fp2_yearly.1002.desc: "Pozdě v noci zaslechnu z jedné místnosti na konci chodby podivné zvuky. Nakouknu dovnitř a naskytne se mi zvláštní pohled. Je tam [ROOT.Char.Custom2('RelationToMeShort', deviant_courtier)] – [Select_CString(deviant_courtier.IsFemale,'nahá, spoutaná a bitá','nahý, spoutaný a bitý')] dřevěnou holí sluhou, který má na sobě nějaké mé staré šaty. A aby toho nebylo málo, [deviant_courtier.GetFirstNameNoTooltip] si to očividně náramně užívá.\n\nMezi ranami se ozývá: „Ano! Potrestej mě, [ROOT.GetCharacter.GetNameNoTooltip]! [Select_CString(deviant_courtier.IsFemale,'Byla jsem zlobivá','Byl jsem zlobivý')] [ROOT.Char.Custom2('RelationToMeShort', deviant_courtier)]!“"
 fp2_yearly.1002.b: "Tady cítím příležitost k vydírání."
 fp2_yearly.1002.c: "To vypadá zábavně!"
 fp2_yearly.1002.a: "Raději půjdu."
 fp2_yearly.1003.t: "Souboj s... obry?"
 fp2_yearly.1003.desc: "Rozruch na nádvoří upoutá mou pozornost. Uprostřed všeho je [injured_knight.Custom2('MyCharacterIntroduction', ROOT.Char)] a několik rolníků [Select_CString(injured_knight.IsFemale,'ji','ho')] nese dovnitř. [Select_CString(injured_knight.IsFemale,'Je očividně těžce zraněná','Je očividně těžce zraněný')].\n\nKdyž se dožaduji vysvětlení, rolníci mi povědí, že [Select_CString(injured_knight.IsFemale,'ji','ho')] našli v poli, kde prý jen o vlásek [Select_CString(injured_knight.IsFemale,'odrazila','odrazil')] útok obra.\n\nKdyž příběh skončí, panoš si mě odvede stranou. „Pravda je taková, že se [injured_knight.GetFirstNameNoTooltip] [Select_CString(injured_knight.IsFemale,'pokusila','pokusil')] utkat v klání s větrným mlýnem a [Select_CString(injured_knight.IsFemale,'prohrála','prohrál')], [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]. Ale tihle vesničané tomu příběhu očividně věří.“"
 fp2_yearly.1003.a: "Sláva statečnému rytíři! Pořídím [Select_CString(injured_knight.IsFemale,'jí','mu')] nového oře."
 fp2_yearly.1003.b: "U svého dvora žádné báchorky trpět nebudu."
 fp2_yearly.1004.t: "Sokol Kurajšovců"
 fp2_yearly.1004.desc: "Čtu si o životě [hawk_of_quraysh.GetName], známého také jako „Sokol Kurajšovců“.\n\nJeho osud je neuvěřitelně inspirativní. Od útěku před [abbasid_dynasty.GetName] až po založení dynastie [hawk_dynasty.GetName] v Iberii – nemohu se ubránit pocitu, že bych si z jeho života měl vzít příklad."
 fp2_yearly.1004.a: "I já mohu své muže inspirovat jako on u Carmony."
 fp2_yearly.1004.b: "Jeho diplomatické jednání s Jemenci je legendární."
 fp2_yearly.1004.c: "Jsme příbuzní!"
 nick_the_hawk_of_quraysh: "Sokol Kurajšovců"
 fp2_hawk_of_quraysh_martial_modifier: "Vojenská inspirace"
 fp2_hawk_of_quraysh_martial_modifier_desc: "Tato postava se ve vojenství inspirovala Sokolem Kurajšovců."
 fp2_hawk_of_quraysh_diplomacy_modifier: "Diplomatická inspirace"
 fp2_hawk_of_quraysh_diplomacy_modifier_desc: "Tato postava se v diplomacii inspirovala Sokolem Kurajšovců."
 fp2_yearly.1005.t: "Ztracený Viking"
 fp2_yearly.1005.desc: "Přede mě dovlečou [Select_CString(hidden_viking.IsFemale,'statnou ženu','statného muže')], [Select_CString(hidden_viking.IsFemale,'která se vzpouzí a křičí','který se vzpouzí a křičí')]. Na první pohled jde o [Select_CString(hidden_viking.IsFemale,'vikingskou nájezdnici','vikingského nájezdníka')] – jednoho z těch, kteří v našem panství po celá desetiletí rozsévali zkázu.\n\n„Prosím, slitujte se. Jmenuji se [hidden_viking.GetName] a už celé roky žiji v [viking_county.GetNameNoTooltip]. [Select_CString(hidden_viking.IsFemale,'Zůstala jsem tu, protože jsem byla zraněná','Zůstal jsem tu, protože jsem byl zraněný')]. Vesničané mě zachránili. Teď jsou mou rodinou.“\n\n[hidden_viking.GetFirstNameNoTooltip] padá na kolena a prosí o život. Několik rolníků celý příběh potvrzuje."
 fp2_yearly.1005.a: "Svým neobyčejným příběhem můžeš bavit můj dvůr."
 fp2_yearly.1005.b: "Jeden dobrý skutek nesmaže všechno zlé – zemřeš."
 fp2_yearly.1005.c: "Dokud sloužíš vesnici, můžeš žít."
 fp2_yearly.1006.t: "Vikingský sýr?"
 fp2_yearly.1006.desc: "Zastavím se u stánku u cesty, kde prodávají prosté jídlo. Obchodník [cheese_trader.GetName] mi nabízí jedno zboží za druhým, než se sehne pod pult a vytáhne vyřezávanou dřevěnou krabičku.\n\n„Pro vás, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')], ten nejlepší sýr v celém panství.“ [cheese_trader.GetFirstNameNoTooltip] mi vtiskne malý bochníček do ruky, nakloní se blíž a spiklenecky zašeptá: „Vyrobili ho tady v Iberii Vikingové, kteří se živí sýrařstvím.“\n\nJakkoli ta historka zní bizarně, sýr je skutečně vynikající."
 fp2_yearly.1006.a: "Sýr si vezmu, ale té směšné historce nevěřím."
 fp2_yearly.1006.b: "Musím ty „sýrové Vikingy“ najít..."
 fp2.1006.b.tt: "Vyšleš své spolčence pátrat po „sýrových Vikinzích“"
 fp2_yearly.1006.c: "To je ale snůška nesmyslů."
 fp2_yearly.1007.t: "$fp2_yearly.1006.t$"
 fp2_yearly.1007.desc: "Přede mě přivedou [Select_CString(fake_cheese_viking.IsFemale,'vyzáblou ženu','vyzáblého muže')]. Ten žalostný zjev přede mnou však sotva vypadá jako někdo, kdo umí vyrábět sýr – natož jako Viking.\n\n„Moc se omlouvám, ale ve skutečnosti [Select_CString(fake_cheese_viking.IsFemale,'nejsem žádná Vikinka','nejsem žádný Viking')]. Je to jen lež, aby se sýr lépe prodával,“ vykoktá ze sebe [fake_cheese_viking.GetFirstNameNoTooltip]."
 fp2_yearly.1007.a: "No nic, alespoň je záhada vyřešena."
 fp2_yearly.1007.b: "Chci polovinu tvého zisku. A polovinu sýra."
 fp2_respected_clergy_chess: "Úcta k duchovenstvu v šachu"
 fp2_respected_clergy_chess_desc: "Pravidla šachu byla změněna ve prospěch duchovenstva."
 fp2_cheese_artifact: "Vyzrálý sýr"
 fp2_cheese_artifact_desc: "Navzdory pověstem tento sýr nevyrobili Vikingové. Je však mimořádně dobrý."
 fp2_yearly.1008.t: "Čas sníst sýr"
 fp2_yearly.1008.desc: "Nastal čas. Hluboko v mých zásobách celé věky odpočíval jeden z nejúžasnějších sýrů známého světa. Pomalu zrál a jeho síla rostla.\n\nA teď ho konečně sním."
 fp2_yearly.1008.a: "[ROOT.Char.GetFaith.HealthGodName|U]! Tak tomu říkám sýr."
 fp2_yearly.1008.b: "Vlastně... ještě ho nechám zrát."
 stoke_tension_toast.success: "Tvá kampaň nenávisti uspěla."
 stoke_tension_toast.failure: "Tvá účast vyšla najevo."
 delegated_stoke_tension_toast.success: "[tension_councillor.GetTitledFirstName] [Select_CString(tension_councillor.IsFemale,'rozšířila','rozšířil')] nenávist."
 ease_tension_toast.success: "Podařilo se ti napětí zmírnit."
 ease_tension_toast.failure: "Tvé úsilí selhalo."
 bad_intrigue.tt: "Tato možnost je dostupná kvůli tvé nízké dovednosti Intrik."
 fp2_struggle.1000.t: "Přilévání oleje do ohně"
 fp2_struggle.1000.desc: "V [tension_county.GetName] došlo ke střetům mezi [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] a obyvateli vyznávajícími [tension_county.GetCountyData.GetFaith.GetName]. „Využijme této příležitosti,“ navrhuje [tension_councillor.GetCouncilTitle] [tension_councillor.GetFirstName]. „Mezi [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] výtržníky můžeme najmout násilníky. A pokud budou ve svém domovském hrabství pokračovat ve svém #italic výcviku#!, tím lépe! Mohli bychom je v tom dokonce #italic podpořit#!...“\n\nMám nechat [tension_county.GetNameNoTierNoTooltip] hořet jen proto, abych tyhle násilné fanatiky získal do svých služeb?"
 fp2_struggle.1000.a: "Trochu té nenávisti rozdmýcháme... nenápadně."
 fp2_struggle.1000.b: "Věřím, že se o to postaráš."
 fp2_struggle.1000.c: "Ne, pokusím se napětí zmírnit."
 fp2_struggle.1000.d: "Když tohle šílenství nedokážu zastavit, snad to zvládnou [minority_courtier.GetFaith.GetAdherentNameNoTooltip|l] a vládce z jejich řad."
 not_my_problem_toast: "Matky, které zůstaly na děti samy, budou i se svými dětmi ve tvém panství ještě dlouhá léta hladovět."
 fp2_struggle.1001.t: "Válečné vdovy"
 fp2_struggle.1001.desc: "[expectant_courtier.GetTitledFirstName] čeká dítě a přichází se mnou probrat osud dalších matek, které s námi sdílejí [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'camp', 'lands')] – těch, jež po nedávných válkách a neštěstích zůstaly na péči o své děti samy. „Mohli bychom, [ROOT.Char.Custom('FormOfAddressForLiege')], zřídit zvláštní fond a vyplácet z něj kojícím matkám, které nemají jiný způsob obživy. Výchova dětí je koneckonců stejně namáhavá a chvályhodná práce jako každá jiná.“"
 fp2_struggle.1001.a: "Dobrý nápad! Takový fond založím."
 fp2_struggle.1001.b: "Mou podporu dostanou pouze vdovy."
 fp2_struggle.1001.b.tt: "Tvá víra neschvaluje ženy, které mají děti mimo manželství."
 fp2_struggle.1001.c: "Ať přijdou ke mně! [ROOT.Char.Custom('GetCourt')|U] má jídla dost!"
 fp2_struggle.1001.c.tt: "Pozveš všechny chudé matky, které zůstaly na děti samy, aby pobývaly u tebe."
 fp2_struggle.1001.d: "Jistě přispějí mí laskaví vazalové."
 fp2_struggle.1001.e: "Jsem tvůj [ROOT.Char.GetTitleTierName], ne kojná!"
 fp2_struggle.1001.specialdescpositive: "Vazalové, kteří rádi zaplatí, si o tobě zlepší #color_light_blue mínění#! o #positive_value 10#!"
 fp2_struggle.1001.specialdescnegative: "Vazalové, kteří zaplatit nechtějí, si o tobě zhorší #color_light_blue mínění#! o #negative_value 10#!"
 reading_avicenna_toast.success: "Podařilo se ti přečíst obsáhlé pojednání o lékařství."
 reading_avicenna_toast.failure: "Možná ti něco uniklo..."
 reading_hippocrates_toast.success: "Podařilo se ti přečíst všechna Galénova díla."
 reading_hippocrates_toast.failure: "Proč je ta řečtina tak těžká?"
 rolling_in_filth_toast: "Tvůj dvůr ohrožuje zdraví."
 fp2_struggle.1002.t: "Pokrok [xenophilic_culture.GetNameNoTooltip|l] kultury"
 fp2_struggle.1002.desc_early_golden_age: "[xenophilic_culture.GetNameNoTooltip] učenci v poslední době dosáhli velkého pokroku v lékařství. Všestranně vzdělaný učenec [great_physician.GetFirstName] však hledá nové místo poté, co [Select_CString(great_physician.IsFemale,'byla vypovězena','byl vypovězen')] z dvora [neighboring_ruler.GetTitledFirstName] ([ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler'))]) kvůli #italic básni a jednomu omylu#!.\n\n"
 fp2_struggle.1002.desc_late_golden_age: "[xenophilic_culture.GetNameNoTooltip] učenci se studiu lékařství věnují už po dlouhá léta. Nyní se všestranně vzdělaný učenec [great_physician.GetFirstName] uchází o místo u mého dvora poté, co [Select_CString(great_physician.IsFemale,'byla vypovězena','byl vypovězen')] z dvora [neighboring_ruler.GetTitledFirstName] ([ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler'))]) za prohřešek, o němž se nemluví.\n\n"
 fp2_struggle.1002.desc_post_golden_age_christian: "Ačkoli jsou Averroes i Albucasis už dávno po smrti, lékaři [xenophilic_culture.GetNameNoTooltip] kultury stále nemají ve znalostech sobě rovné. Všestranně vzdělaný učenec [great_physician.GetFirstName] nyní hledá nové místo poté, co [Select_CString(great_physician.IsFemale,'byla vypovězena','byl vypovězen')] z dvora [neighboring_ruler.GetTitledFirstName] ([ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler'))]) za prohřešek, o němž se nemluví.\n\n"
 fp2_struggle.1002.desc_post_golden_age_unchristian: "Ačkoli jsou Ibn Rušd i az-Zahráví už dávno po smrti, lékaři [xenophilic_culture.GetNameNoTooltip] kultury stále nemají ve znalostech sobě rovné. Všestranně vzdělaný učenec [great_physician.GetFirstName] nyní hledá nové místo poté, co [Select_CString(great_physician.IsFemale,'byla vypovězena','byl vypovězen')] z dvora [neighboring_ruler.GetTitledFirstName] ([ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler'))]) za prohřešek, o němž se nemluví.\n\n"
 fp2_struggle.1002.desc_albucasis: "„Mé schopnosti jsou skromné,“ říká [great_physician.GetFirstName], „ale kdysi jsem [Select_CString(great_physician.IsFemale,'zachránila','zachránil')] život otrokyni, která si podřízla hrdlo, a zůstalo jí po tom jen lehké ochraptění. A také bych vás [Select_CString(ROOT.Char.IsFemale,'požádala','požádal')] o několik změn ve vašich hygienických návycích...“\n\n"
 fp2_struggle.1002.desc_avenzoar: "„Lékařství se věnuji celý život,“ říká [great_physician.GetFirstName], „a [Select_CString(great_physician.IsFemale,'napsala jsem','napsal jsem')] jsem i knihu o zásadách zdravého života. Jsem však zapřisáhlým nepřítelem pověr a falešných léčiv, která nabízejí čarodějnice a astrologové, a proto vás žádám, abyste takové praktiky zakázali...“\n\n"
 fp2_struggle.1002.desc_tufail: "„Studuji nebesa, lidskou mysl i neduhy těla,“ říká [great_physician.GetFirstName]. „Jsem však také [Select_CString(great_physician.IsFemale,'zastánkyní','zastáncem')] přínosu studia lidského těla #italic post mortem#!... Mohli byste mi poskytnout příležitosti k takovému bádání?“\n\n"
 fp2_struggle.1002.desc_no_historical_physician_early: "„Mnohé jsem [Select_CString(great_physician.IsFemale,'se naučila','se naučil')],“ říká [great_physician.GetFirstName], „z děl starověkých učenců. Jejich poznání jsem však [Select_CString(great_physician.IsFemale,'vysvobodila','vysvobodil')] ze záplavy zbytečných slov a dokážu je využít ve váš prospěch.“\n\n"
 fp2_struggle.1002.desc_no_historical_physician_late: "„Mnohé jsem [Select_CString(great_physician.IsFemale,'se naučila','se naučil')],“ říká [great_physician.GetFirstName], „z děl az-Zahrávího a Ibn Síny. Jejich postupy jsem však ještě [Select_CString(great_physician.IsFemale,'zdokonalila','zdokonalil')]. Dokážu odstraňovat šedý zákal i vředy a léčit choroby, které byly dosud považovány za nevyléčitelné.“\n\n"
 fp2_struggle.1002.desc_has_physician_and_is_christian: "Můj současný [Select_CString(scoped_physician.IsFemale,'dvorní lékařka','dvorní lékař')] [scoped_physician.GetTitledFirstName] mě naléhavě žádá, abych [Select_CString(scoped_physician.IsFemale,'ji','ho')] nenahrazoval [Select_CString(great_physician.IsFemale,'touto pohankou','tímto pohanem')]."
 fp2_struggle.1002.desc_has_physician_but_not_christian: "Můj současný [Select_CString(scoped_physician.IsFemale,'dvorní lékařka','dvorní lékař')] [scoped_physician.GetTitledFirstName] mě naléhavě žádá, abych [Select_CString(scoped_physician.IsFemale,'ji','ho')] nenahrazoval [Select_CString(great_physician.IsFemale,'touto podivínkou','tímto podivínem')]."
 fp2_struggle.1002.desc_has_no_physician_but_is_christian: "Někteří dvořané mě nabádají, ať se s [Select_CString(great_physician.IsFemale,'touto pohankou','tímto pohanem')] raději nezaplétám."
 fp2_struggle.1002.desc_has_no_physician: "Mám [great_physician.GetFirstName] nabídnout místo u svého dvora?"
 fp2_struggle.1002.a: "Někdo takový by se u mého dvora hodil..."
 fp2_struggle.1002.b: "Koupím si knihy a medicínu nastuduji bez cizí pomoci."
 fp2_struggle.1002.b.tt: "Pokusíš se získat lékařské znalosti z významných děl."
 fp2_struggle.1002.c: "K čemu tě potřebuji? Řecky umím číst."
 fp2_struggle.1002.c.tt: "Koupíš Galénova díla a pokusíš se je přečíst."
 fp2_struggle.1002.d: "Pošlu tě zpátky k [neighboring_ruler.GetTitledFirstNameNoTooltip]... v okovech."
 fp2_struggle.1002.e: "Mé zdraví je v pořádku, díky."
 fp2_struggle.1002.f: "Zmiz. Nové poznání může pocházet jedině od Boha."
 fp2_struggle.1002.physicianleaves: "[great_physician.GetFirstName] hledá místo jinde"
 fp2_struggle.1001.physician_imprisoned: "[great_physician.GetFirstName] končí z jistých důvodů ve vězení u [neighboring_ruler.GetName]"
 fp2_struggle.1010.t: "Železná duše"
 fp2_struggle.1010.desc: "[great_swordsmith.GetName] dorazí k mému dvoru a tvrdí, že je [Select_CString(great_swordsmith.IsFemale,'mistryní kovářského řemesla, která procestovala','mistrem kovářského řemesla, který procestoval')] širý svět.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ říká [great_swordsmith.GetFirstName], „má rodina vyrábí meče v [toledo_holding.GetNameNoTierNoTooltip] od nepaměti a kdysi kovala #italic falcaty#! pro kartáginská vojska. Žádná slitina není tak pevná jako ta iberská a já ji dokážu dovést k dokonalosti. Dokážu vyrábět nejlepší zbraně na světě, ale na oplátku mi musíte svěřit vedení kovářského cechu v [blacksmith_county.GetNameNoTierNoTooltip]. Pak konečně všichni uvidí, že jsem [Select_CString(great_swordsmith.IsFemale,'byla lepší','byl lepší')] než oni!“"
 fp2_struggle.1010.a: "Ne. Budeš s cechem spolupracovat ku prospěchu nás všech."
 fp2_struggle.1010.b: "Ať už skrýváš jakékoli vědomosti, dostanu je z tebe..."
 fp2_struggle.1010.c: "Dostaneš ho, pokud budeš kovat meče pro má vojska."
 fp2_struggle.1010.d: "Ukovej mi nejlepší čepel v Iberii a cech bude tvůj."
 fp2_struggle.1010.e: "Kvůli tvé ješitnosti si cech proti sobě nepoštvu."
 fp2_struggle.1010.smithgoesaway: "[great_swordsmith.GetNameNoTooltip] odchází převzít vedení kovářského cechu."
 fp2_struggle.1010.paranoid_rivals: "Vyzbrojování tvých vojáků může znepokojit některé sousední vládce."
 fp2_struggle.1010.smithmakesweapon: "[great_swordsmith.GetNameNoTooltip] zůstává u tvého dvora, dokud nedokončí objednaný meč."
 fp2_struggle.1010.swordsmith_imprisoned: "Uvězníš a mučíš [great_swordsmith.GetNameNoTooltip], abys odhalil tajemství kovářského řemesla"
 fp2_struggle.1010.compassionate_courtiers: "Ne všichni tví dvořané s tím budou souhlasit"
 toledo_compromise_flavor: "Vynutíš kompromis mezi [great_swordsmith.GetNameNoTooltip] a cechem."
 fp2_struggle.1010.swordsmith_leaves: "[great_swordsmith.GetNameNoTooltip] odchází k jinému dvoru."
 fp2_struggle.1011.t: "Čepel z [blacksmith_county.GetNameNoTierNoTooltip]"
 fp2_struggle.1011.desc: "„Je hotovo,“ pronese [great_swordsmith.GetName], ale působí podivně vyčerpaně.\n\n„Snad mě při kování vedli duchové mých předků, neboť je to nejlepší čepel, jakou jsem kdy [Select_CString(great_swordsmith.IsFemale,'vytvořila','vytvořil')]. Už nikdy nic podobného nezhotovím a nikdo jiný v této zemi také ne, protože tajemství její výroby si vezmu do hrobu. Teď odejdu a ujmu se cechu, který jste mi [Select_CString(ROOT.Char.IsFemale,'slíbila','slíbil')], ačkoli to vítězství mi náhle připadá podivně prázdné. Ale na tom nesejde. Meči, který jsem pro vás [Select_CString(great_swordsmith.IsFemale,'ukovala','ukoval')], musíte dát jméno.“"
 fp2_struggle.1011.a: "#italic Martiello#!, kladivo."
 fp2_struggle.1011.b: "#italic Tiniebra#!, temnota."
 fp2_struggle.1011.c: "#italic Vermejo#!, rudý."
 fp2_struggle.1011.d: "#italic Jargonça#!, jako modrý drahokam."
 fp2_struggle.1011.e: "#italic Suhajl#!, vznešený."
 fp2_struggle.1011.f: "#italic al-Battár#!, sekáč."
 fp2_struggle.1011.g: "#italic Kadíb#!, s pevnou rukojetí."
 fp2_struggle.1011.h: "#italic Zumurrud#!, jako oslnivý smaragd."
 fp2_struggle.1011.i: "#italic Ortzi#!, jako hrom."
 fp2_struggle.1011.j: "#italic Gaueko#!, noční duch."
 fp2_struggle.1011.k: "#italic Gorri#!, rudý."
 fp2_struggle.1011.l: "#italic Aiztoto#!, nožík."
 fp2_struggle.1011.m: "#italic Escremire#!, šermíř."
 fp2_struggle.1011.n: "#italic Folha#!, list."
 fp2_struggle.1011.o: "#italic Proeza#!, udatnost."
 fp2_struggle.1011.p: "#italic Trebalhar#!, trýznitel."
 fp2_struggle.1011.q: "#italic Sófax#!, jako slavný hrdina dávných časů."
 fp2_struggle.1011.r: "#italic Tumellalt#!, bílý."
 fp2_struggle.1011.s: "#italic Ayugu#!, jho."
 fp2_struggle.1011.u: "Samozřejmě #italic Železná duše#!."
 fp2_struggle.1011.v: "#italic Jmelí#! se mi docela líbí..."
 fp2_struggle.1011.w: "#italic Sekáč Maurů#!, co jiného?"
 fp2_struggle.1011.x: "#italic Uzurpátorova čepel#! se vzhledem k tomu, co jsme provedli cechům, docela hodí..."
 fp2_struggle.1011.swordsmith_leaves: "Po dokončení svého díla [great_swordsmith.GetName] opouští tvůj dvůr"
