l_polish:
 game_concept_struggle: "Svár"
 game_concept_struggle_struggles: "Sváry"
 game_concept_struggle_struggles_possessive: "Sváru"
 game_concept_struggle_desc: "Sváry jsou dlouhodobé konflikty zasahující rozsáhlé [Concept('struggle_region_regions','oblasti sváru')|E] s mnoha [Concept('faiths','vírami')|E] a [Concept('cultures','kulturami')|E]. V rámci sváru mohou platit zvláštní pravidla a [Concept('modifiers','modifikátory')|E], které se postupem času mění. Jelikož sváry trvají desítky až stovky let, nejsou všechny [Concept('characters','postavy')|E] v daném sváru neustále ve [Concept('war','válce')|E] se všemi ostatními.\n\nKaždý svár se skládá z několika [Concept('struggle_phase_phases','fází')|E]. Když postavy v [Concept('struggle_region','oblasti sváru')|E] jednají, například vyhlašují války nebo [Concept('marrying','uzavírají sňatky')|E], mohou aktivovat [Concept('struggle_catalyst_catalysts','katalyzátory')|E], které svár posouvají mezi jednotlivými fázemi.\n\nPodle toho, nakolik je ostatní účastníci považují za součást sváru, mohou být postavy s [Concept('land','pozemky')|E] v dané oblasti považovány za [Concept('struggle_involved','zapojené')|E], [Concept('struggle_interloper_interlopers','vetřelce')|E] nebo [Concept('struggle_uninvolved','nezapojené')|E]."
 game_concept_iberian_struggle: "Iberský svár"
 game_concept_iberian_struggle_desc: "Iberský svár zachycuje staletí rozpolcených vztahů na Pyrenejském poloostrově. Ačkoli má svůj původ v umajjovském dobytí Ibérie v 8. století, [Concept('struggle','svár')|E] přechází mezi [Concept('struggle_phase_phases','fázemi')|E] násilí živeného nenávistí, obezřetných příměří a pragmatické spolupráce. V takové situaci je jen málo spojenectví trvalých a [Concept('rulers','vládci')|E] by se neměli spoléhat pouze na společnou [Concept('faith','víru')|E] či [Concept('culture','kulturu')|E]."
 game_concept_struggle_phase: "Fáze sváru"
 game_concept_struggle_phase_phase: "Fáze"
 game_concept_struggle_phase_phases: "Fáze"
 game_concept_struggle_phase_desc: "Fáze představuje obecnou náladu společnou [Concept('struggle_involved','zapojeným')|E] [Concept('characters','postavám')|E] a [Concept('counties','hrabstvím')|E] v rámci [Concept('struggle_region','oblasti sváru')|E]. Zachycuje krátkodobé společenské trendy a zvyklosti, které dočasně určují směřování [Concept('struggle','sváru')|E].\n\n#weak Příklad: v jedné fázi mohou obyvatelé oblasti sváru považovat náboženskou toleranci za prvořadou, i když s tím zbytek jejich víry nesouhlasí.#!"
 game_concept_struggle_catalyst: "Katalyzátor sváru"
 game_concept_struggle_catalyst_catalyst: "Katalyzátor"
 game_concept_struggle_catalyst_catalysts: "Katalyzátory"
 game_concept_struggle_catalyst_desc: "[Concept('struggle_struggles','Sváry')|E] přecházejí mezi [Concept('struggle_phase_phases','fázemi')|E], když dojde k určitým významným činům, které posouvají smýšlení obyvatel [Concept('struggle_region','oblasti sváru')|E] určitým směrem. Seznam činů důležitých v jednotlivých fázích najdeš v okně sváru.\n\n#weak Příklad: [Concept('struggle_phase_iberia_opportunity','Fáze příležitosti')|E] [Concept('iberian_struggle','Iberského sváru')|E] může přejít buď do [Concept('struggle_phase_iberia_hostility','Fáze nepřátelství')|E], nebo do [Concept('struggle_phase_iberia_conciliation','Fáze usmíření')|E]. Vražda významné [Concept('character','postavy')|E] může přispět k první možnosti, zatímco uzavření [Concept('marriage','sňatku')|E] a [Concept('alliance','aliance')|E] s někým jiné [Concept('faith','víry')|E] může přispět k druhé.#!"
 game_concept_struggle_involved: "Zapojený"
 game_concept_struggle_involved_desc: "Pokud se [Concept('character','postava')|E] nebo [Concept('county','hrabství')|E] počítá mezi zapojené, znamená to, že ji obyvatelé určité [Concept('struggle_region','oblasti sváru')|E] považují za přirozenou a nedílnou součást [Concept('struggle','sváru')|E]. Takové postavy a hrabství plně využívají proměnlivých výhod [Concept('struggle_phase_phases','fází')|E] a patří mezi hlavní zdroje [Concept('struggle_catalyst_catalysts','katalyzátorů')|E].\n\nZa zapojené se považují ty [Concept('cultures','kultury')|E] a [Concept('faiths','víry')|E], které mají nebo v minulosti měly v oblasti sváru významné zastoupení.\n\n#weak Aby se postava počítala mezi zapojené, musí být zapojena jak její kultura, tak její víra #EMP a#! její [Concept('capital','hlavní sídlo')|E] se musí nacházet v [Concept('struggle_region','oblasti sváru')|E].#!"
 game_concept_struggle_interloper: "Vetřelec"
 game_concept_struggle_interloper_interlopers: "Vetřelci"
 game_concept_struggle_interloper_desc: "Pokud je [Concept('character','postava')|E] zapletena do určitého [Concept('struggle','sváru')|E], ale dosud není považována za plně [Concept('struggle_involved','zapojenou')|E], je vetřelcem.\n\nVetřelci mají svá [Concept('capital','hlavní sídla')|E] v [Concept('struggle_region','oblasti sváru')|E], ale nemají zároveň zapojenou [Concept('faith','víru')|E] i zapojenou [Concept('culture','kulturu')|E].\n\nPlně zapojené postavy je považují za vlezlé a obtížné cizince, kteří nechápou, kde nejsou vítáni. [Concept('rulers','Vládci')|E] považovaní za vetřelce proto zpravidla trpí postihy v [Concept('counties','hrabstvích')|E], která drží uvnitř oblasti sváru."
 game_concept_struggle_uninvolved: "Nezapojený"
 game_concept_struggle_uninvolved_desc: "Aby byla [Concept('character','postava')|E] v určitém [Concept('struggle','sváru')|E] považována za [Concept('struggle_uninvolved','nezapojenou')|E], stačí, aby měla své [Concept('capital','hlavní sídlo')|E] mimo [Concept('struggle_region','oblast sváru')|E].\n\nTaková postava je považována za cizince, který nejenže nemá vážný zájem na probíhajících [Concept('struggle_phase_phases','fázích')|E], ale #EMP ani by mít neměl#!, protože místním poměrům zjevně nemůže rozumět.\n\nJednou z mála věcí, na nichž se lidé uvnitř sváru shodnou, je, že nezapojené postavy nemají v #EMP jejich#! zemích co pohledávat. [Concept('rulers','Vládci')|E] považovaní za nezapojené proto zpravidla trpí tvrdými postihy ve všech [Concept('counties','hrabstvích')|E], která drží uvnitř oblasti sváru."
 game_concept_struggle_large_conquest: "Velké dobytí ve sváru"
 game_concept_struggle_large_conquest_desc: "Některé katalyzátory sváru zahrnují úspěšné dokončení významné [Concept('war','války')|E] útočníkem.\n\nPočítají se následující [Concept('casus_bellis','casus belli')|E]:\n$EFFECT_LIST_BULLET$ $duchy_conquest_cb$ \n$EFFECT_LIST_BULLET$ $individual_duchy_de_jure_cb$ \n$EFFECT_LIST_BULLET$ $imperial_reconquest_cb$ \n$EFFECT_LIST_BULLET$ $invasion_war$ \n$EFFECT_LIST_BULLET$ $clan_invasion_war$ \n$EFFECT_LIST_BULLET$ $mongol_invasion_war$ \n$EFFECT_LIST_BULLET$ $major_religious_war$ \n$EFFECT_LIST_BULLET$ [Concept('great_holy_war_directed','Směrované')|E] i [Concept('great_holy_war_undirected','nesměrované')|E] velké svaté války \n$EFFECT_LIST_BULLET$ $tribal_subjugation_cb$"
 game_concept_struggle_region: "Oblast sváru"
 game_concept_struggle_region_region: "Oblast"
 game_concept_struggle_region_regions: "Oblasti"
 game_concept_struggle_region_desc: "Každý [Concept('struggle','svár')|E] je spojen s určitým [Concept('region','regionem')|E] na mapě. Poloha [Concept('character','postavy')|E] v tomto regionu, stejně jako její [Concept('culture','kultura')|E] a [Concept('faith','víra')|E], určuje, zda se počítá mezi [Concept('struggle_involved','zapojené')|E], [Concept('struggle_interloper','vetřelce')|E], či [Concept('struggle_uninvolved','nezapojené')|E].\n\nNa [Concept('counties','hrabství')|E] v oblasti sváru se zpravidla vztahují různé [Concept('county_modifiers','modifikátory hrabství')|E] podle aktuální [Concept('struggle_phase_phase','fáze')]."
 game_concept_struggle_conquest: "Střet ve sváru"
 game_concept_struggle_conquest_conquest: "Střet"
 game_concept_struggle_conquest_conquests: "Střety"
 game_concept_struggle_conquest_desc: "Pro [Concept('rulers','vládce')|E] zapojené do [Concept('struggle','sváru')|E] nejsou neobvyklé pohraniční spory a drobné rozepře, jejichž podoba se mění podle aktuální [Concept('struggle_phase','fáze sváru')|E]. Dostatek místních záminek umožňuje vládcům podnikat menší zábory půdy a své cíle dobývat či vazalizovat.\n\nProtože střety ve sváru závisejí na podmínkách daného sváru, jejich cena v [Concept('prestige','prestiži')|E] se mění podle aktuální fáze sváru."
 game_concept_struggle_phase_iberia_opportunity: "Fáze příležitosti"
 game_concept_struggle_phase_iberia_opportunity_desc: "Po dlouhém období relativně pokojného soužití během [Concept('struggle_phase_iberia_conciliation','Fáze usmíření')|E] začíná převládat samolibost. Sedláci i šlechta si zvykli, že věci prostě #EMP fungují#!, a prozíravější [Concept('characters','postavy')|E] tak mohou využít jejich naivity.\n\nNové křivdy nakonec buď vyhrotí situaci do [Concept('struggle_phase_iberia_hostility','Fáze nepřátelství')|E], nebo obratná politika dovede poloostrov k neklidné rovnováze prostřednictvím [Concept('struggle_phase_iberia_conciliation','Fáze usmíření')|E]."
 game_concept_struggle_phase_iberia_hostility: "Fáze nepřátelství"
 game_concept_struggle_phase_iberia_hostility_desc: "V této fázi rostou napětí i nevraživost. Opakované projevy zášti a stupňující se nedorozumění během [Concept('struggle_phase_iberia_opportunity','Fáze příležitosti')|E] vedly k sílící nenávisti vůči [Concept('characters','postavám')|E] odlišných [Concept('cultures','kultur')|E], [Concept('faiths','věr')|E], nebo #EMP ještě hůř#! obojího.\n\nTakové krveprolití však nemůže trvat věčně. Dříve či později chladnější hlavy nebo pouhé vyčerpání přivedou poloostrov do [Concept('struggle_phase_iberia_compromise','Fáze kompromisu')|E]."
 game_concept_struggle_phase_iberia_compromise: "Fáze kompromisu"
 game_concept_struggle_phase_iberia_compromise_desc: "Ať už z únavy ze svárů [Concept('struggle_phase_iberia_hostility','Fáze nepřátelství')|E], nebo díky obratnému vývoji během [Concept('struggle_phase_iberia_conciliation','Fáze usmíření')|E], představuje Fáze kompromisu rostoucí ochotu obyvatel Ibérie vycházet si navzájem vstříc. Rozdíly ustupují do pozadí a někdejší nepřátele spojují společné dějiny a dědictví.\n\nPoloostrov stojí na rozcestí: pokud se konflikty znovu rozhoří, čeká jej [Concept('struggle_phase_iberia_opportunity','Fáze příležitosti')|E]."
 game_concept_struggle_phase_iberia_conciliation: "Fáze usmíření"
 game_concept_struggle_phase_iberia_conciliation_desc: "Tato fáze je výsledkem významného [Concept('struggle_phase_iberia_compromise','kompromisu')|E]. Vztahy mezi obyvateli Ibérie se během ní stávají natolik srdečnými, že cizinci jen stěží chápou jejich vzájemnou shovívavost. Zvláště běžné jsou [Concept('marriages','sňatky')|E] mezi vyznavači různých [Concept('faiths','věr')|E].\n\nAni to však nemůže trvat věčně a zneužívání důvěry nakonec přivede [Concept('iberian_struggle','Iberský svár')|E] zpět do [Concept('struggle_phase_iberia_compromise','Fáze kompromisu')|E]."
 game_concept_struggle_involved_faith: "Zapojená víra"
 game_concept_struggle_involved_faiths: "Zapojené víry"
 game_concept_struggle_involved_faith_desc: "Některé [Concept('faiths','víry')|E] jsou do [Concept('struggle','sváru')|E] [Concept('struggle_involved','zapojené')|E] již od jeho počátku. Jiné se mohou zapojit v důsledku měnících se okolností."
 game_concept_struggle_involved_culture: "Zapojená kultura"
 game_concept_struggle_involved_cultures: "Zapojené kultury"
 game_concept_struggle_involved_culture_desc: "Některé [Concept('cultures','kultury')|E] jsou do [Concept('struggle','sváru')|E] [Concept('struggle_involved','zapojené')|E] již od jeho počátku. Jiné se mohou zapojit v důsledku měnících se okolností."
 game_concept_dissolution_faction: "Frakce za rozpad"
 game_concept_dissolution_factions: "Frakce za rozpad"
 game_concept_faction_dissolution: "Rozpad"
 game_concept_dissolution_faction_dissolved: "Rozpadlá"
 game_concept_dissolution_faction_desc: "[Concept('dissolution_faction','Frakce za rozpad')|E] usiluje o zničení [Concept('realm','panství')|E] svého [Concept('liege','lenního pána')|E]. Pokud uspěje, všichni [Concept('vassals','vazalové')|E] v panství se stanou [Concept('independent','nezávislými')|E] a jejich lenní pán přijde o svůj [Concept('primary_title','hlavní titul')|E]."
 game_concept_improve_city_province_decision: "Rozhodnutí $improve_city_province_decision_name$"
 game_concept_improve_city_province_decision_desc: "[Concept('decision','Rozhodnutí')|E], které ti umožňuje zvýšit počet dostupných [Concept('buildings','budov')|E] v [Concept('city_holding','městské državě')|E]."
 game_concept_border_raid: "Pohraniční nájezd"
 game_concept_border_raids: "Pohraniční nájezdy"
 game_concept_border_raiding: "Podnikání pohraničních nájezdů"
 game_concept_border_raid_desc: "Jedná se o zvláštní typ [Concept('war','války')|E] dostupný mezi [Concept('struggle_involved','zapojenými')|E] [Concept('rulers','vládci')|E] Iberského [Concept('struggle','sváru')|E], při němž se útočník snaží [Concept('siege','obléhat')|E] konkrétní nepřátelské [Concept('county','hrabství')|E] sousedící s jeho [Concept('realm','panstvím')|E].\n\n[Concept('war_leader','Vůdce války')|E] získá [Concept('gold','zlato')|E] za dobytí [Concept('war_target','válečného cíle')|E], který přijde o [Concept('development','rozvoj')|E] a [Concept('control','kontrolu')|E]. Zničeny mohou být také [Concept('buildings','budovy')|E], což přinese další [Concept('gold','zlato')|E]; pravděpodobnost jejich zničení roste s [Concept('development','rozvojem')|E] a velikostí [Concept('army','armády')|E] při [Concept('siege','obléhání')|E].\n\nÚtočník po [Concept('occupying','obsazení')|E] [Concept('war_target','válečného cíle')|E] rychle získává [Concept('war_score','válečné skóre')|E]."
 game_concept_bargain_fealty: "Vyjednat lenní věrnost"
 game_concept_bargained_fealty: "Vyjednaná lenní věrnost"
 game_concept_bargain_fealty_desc: "Tato zvláštní [Concept('interaction','interakce')|E] je dostupná [Concept('struggle_involved','zapojeným')|E] [Concept('rulers','vládcům')|E], kteří vedou obrannou [Concept('war','válku')|E].\n\n[Concept('war_leader','Vůdce války')|E] požádá sousedního [Concept('ruler','vládce')|E] vyšší [Concept('rank','hodnosti')|E], aby se zapojil do války, a na oplátku se stane jeho [Concept('vassal','vazalem')|E]."
 game_concept_contract_assistance: "Vojenská pomoc"
 game_concept_contract_assisting: "Poskytování vojenské pomoci"
 game_concept_contract_assistance_desc: "Jedná se o zvláštní typ [Concept('interaction','interakce')|E] dostupný [Concept('struggle_involved','zapojeným')|E] [Concept('rulers','vládcům')|E] Iberského [Concept('struggle','sváru')|E], který jim umožňuje zapojit se do [Concept('wars','válek')|E] jiných [Concept('struggle_involved','zapojených')|E] [Concept('rulers','vládců')|E] výměnou za [Concept('gold','zlato')|E].\n\nOdměna je vyplacena po skončení [Concept('war','války')|E] bez ohledu na její výsledek, pokud poskytovatel pomoci dosáhl [Concept('war_contribution','válečného příspěvku')|E] alespoň 100."
 game_concept_iberian_reclamation: "Iberské znovudobytí"
 game_concept_iberian_reclaiming: "Iberské znovudobývání"
 game_concept_iberian_reclamations: "Iberská znovudobytí"
 game_concept_iberian_reclamation_desc: "Jedná se o zvláštní typ [Concept('war','války')|E] dostupný [Concept('struggle_involved','zapojeným')|E] [Concept('rulers','vládcům')|E] [Concept('iberian_struggle','Iberského sváru')|E].\n\nÚtočník se snaží dobýt [Concept('duchy','vévodství')|E], které obsahuje alespoň jedno [Concept('struggle_involved','zapojené')|E] [Concept('county','hrabství')|E] držené [Concept('ruler','vládcem')|E] považovaným za [Concept('struggle_interloper','vetřelce')|E] nebo za [Concept('struggle_uninvolved','nezapojeného')|E], případně takového vládce [Concept('vassalize','vazalizovat')|E], pokud nevlastní žádnou půdu mimo toto vévodství."
 game_concept_enforce_truce: "Vynutit příměří"
 game_concept_enforced_truce: "Vynucené příměří"
 game_concept_enforce_truce_desc: "Jedná se o zvláštní typ [Concept('interaction','interakce')|E] dostupný [Concept('struggle_involved','zapojeným')|E] [Concept('rulers','vládcům')|E], který ukončí [Concept('war','válku')|E] [Concept('white_peace','bílým mírem')|E] a nastolí [Concept('truces','příměří')|E].\n\nLze jej použít pouze k ukončení válek mezi jinými [Concept('struggle_involved','zapojenými')|E] [Concept('rulers','vládci')|E] nižší [Concept('rank','hodnosti')|E], v nichž je alespoň jedna strana [Concept('independent','nezávislá')|E] nebo součástí stejného [Concept('realm','panství')|E]."
 game_concept_incite_revolts_interaction: "Podnítit vzpouru"
 game_concept_incite_revolts_interaction_desc: "Umožňuje investovat [gold_i][Concept('gold','zlato')|E] do podpory [Concept('peasant_faction','selské frakce')|E] v jiném [Concept('realm','panství')|E], pokud se v něm nacházejí [Concept('counties','hrabství')|E] se záporným [Concept('county_opinion','lidovým míněním')|E]."
 game_concept_secure_iberian_foothold_decision: "$secure_iberian_foothold_decision_title$"
 game_concept_secure_iberian_foothold_decision_desc: "[Concept('decision','Rozhodnutí')|E], které umožňuje [Concept('ruler','vládci')|E], jenž není [Concept('struggle_involved','zapojený')|E], ukončit [Concept('iberian_struggle','Iberský svár')|E]."
 game_concept_golden_age_jewish_science_in_iberia_decision: "$golden_age_jewish_science_in_iberia_decision$"
 game_concept_golden_age_jewish_science_in_iberia_decision_desc: "[Concept('decision','Rozhodnutí')|E], kterým podpoříš místní židovské učence a budeš těžit z jejich práce."
 game_concept_build_holy_pilgrim_roads_decision: "$build_holy_pilgrim_roads_decision$"
 game_concept_build_holy_pilgrim_roads_decision_desc: "[Concept('decision','Rozhodnutí')|E], kterým vybuduješ cesty a usnadníš poutníkům život."
 game_concept_purchase_truce_interaction: "$purchase_truce_interaction$"
 game_concept_purchase_truce_interaction_desc: "[Concept('interaction','Interakce')|E], která umožňuje preventivně koupit [Concept('truces','příměří')|E] výměnou za [gold_i][Concept('gold','zlato')|E]."
