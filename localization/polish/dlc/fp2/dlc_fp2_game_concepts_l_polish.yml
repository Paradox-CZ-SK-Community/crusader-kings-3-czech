l_polish:
 game_concept_struggle: "Svár"
 game_concept_struggle_struggles: "Sváry"
 game_concept_struggle_struggles_possessive: "Sváru"
 game_concept_struggle_desc: "$game_concept_struggle_struggles$ jsou dlouhodobé konflikty zahrnující rozsáhlé [Concept('struggle_region_regions','oblasti sváru')|E] s mnoha [Concept('faiths','vírami')|E] a [Concept('cultures','kulturami')|E]. Uvnitř hranic [Concept('struggle','sváru')|E] mohou začít platit zvláštní pravidla a [Concept('modifiers','modifikátory')|E], které se časem mění. Jelikož trvají desítky až stovky let, ne všechny [Concept('characters','postavy')|E] ve [Concept('struggle','sváru')|E] jsou po celou dobu navzájem ve [Concept('war','válce')|E].\n\nKaždý [Concept('struggle','svár')|E] se skládá z několika [Concept('struggle_phase_phases','fází')|E]. Když $game_concept_characters$ v [Concept('struggle_region','oblasti sváru')|E] jednají – například vyhlásí $game_concept_war$ nebo uzavřou [Concept('marrying','sňatek')|E] – mohou aktivovat [Concept('struggle_catalyst_catalysts','katalyzátory')|E], které je posouvají mezi jednotlivými $game_concept_struggle_phase_phases$.\n\nPodle toho, do jaké míry je ostatní účastníci vnímají jako součást [Concept('struggle','sváru')|E], mohou být $game_concept_characters$ s [Concept('land','půdou')|E] v oblasti považovány za [Concept('struggle_involved','zapojené')|E], [Concept('struggle_interloper_interlopers','vetřelce')|E] nebo [Concept('struggle_uninvolved','nezapojené')|E]."
 game_concept_iberian_struggle: "Iberský svár"
 game_concept_iberian_struggle_desc: "$game_concept_iberian_struggle$ zachycuje staletí roztříštěných vztahů na Pyrenejském poloostrově. Ačkoli se zrodil z umajjovského dobytí Ibérie v 8. století, [Concept('struggle','svár')|E] přechází mezi [Concept('struggle_phase_phases','fázemi')|E] nenávistí živeného násilí, opatrných příměří a pragmatické spolupráce. V takové situaci existuje jen málo trvalých spojenců a [Concept('rulers','vládci')|E] by si měli dávat pozor, aby nespoléhali čistě na sdílenou [Concept('faith','víru')|E] nebo [Concept('culture','kulturu')|E]."
 game_concept_struggle_phase: "Fáze sváru"
 game_concept_struggle_phase_phase: "Fáze"
 game_concept_struggle_phase_phases: "Fáze"
 game_concept_struggle_phase_desc: "$game_concept_struggle_phase_phase$ je obecná nálada společná [Concept('struggle_involved','zapojeným')|E] [Concept('characters','postavám')|E] a [Concept('counties','hrabstvím')|E] v rámci [Concept('struggle_region','oblasti sváru')|E]. Představuje krátkodobé společenské trendy a mravy, které dočasně ovládají diskusi v rámci [Concept('struggle','sváru')|E].\n\n#weak Příklad: v jedné $game_concept_struggle_phase_phase$ se lidé v $game_concept_struggle_region_region mohou domnívat, že náboženská tolerance je prvořadá, i když zbytek jejich víry nesouhlasí.#!"
 game_concept_struggle_catalyst: "Katalyzátor sváru"
 game_concept_struggle_catalyst_catalyst: "Katalyzátor"
 game_concept_struggle_catalyst_catalysts: "Katalyzátory"
 game_concept_struggle_catalyst_desc: "[Concept('struggle_struggles','Sváry')|E] přecházejí mezi [Concept('struggle_phase_phases','fázemi')|E], když jsou podniknuty určité významné kroky, které posilují konsenzus v jejich [Concept('struggle_region','oblasti sváru')|E] směrem ke konkrétní náladě. Seznam toho, které kroky jsou důležité v které $game_concept_struggle_phase_phase$, najdeš v okně [Concept('struggle','sváru')|E].\n\n#weak Příklad: [Concept('struggle_phase_iberia_opportunity','příležitost')|E] [Concept('iberian_struggle','iberského sváru')|E] může přejít buď do [Concept('struggle_phase_iberia_hostility','nepřátelství')|E], nebo do [Concept('struggle_phase_iberia_conciliation','usmíření')|E]. Vražda významné [Concept('character','postavy')|E] může přispět k první možnosti, zatímco uzavření [Concept('marriage','sňatkového')|E] [Concept('alliance','spojenectví')|E] s někým jiné [Concept('faith','víry')|E] by směřovalo k druhé."
 game_concept_struggle_involved: "Zapojený"
 game_concept_struggle_involved_desc: "Když je [Concept('character','postava')|E] nebo [Concept('county','hrabství')|E] $game_concept_struggle_involved$, znamená to, že je lidmi určité [Concept('struggle_region','oblasti sváru')|E] považována za přirozenou a nedílnou součást [Concept('struggle','sváru')|E]. Plně těží z proměnlivých výhod [Concept('struggle_phase_phases','fází')|E] a patří mezi hlavní spouštěče [Concept('struggle_catalyst_catalysts','katalyzátorů')|E].\n\n[Concept('cultures','Kultury')|E] a [Concept('faiths','víry')|E] považované za $game_concept_struggle_involved$ jsou ty, které mají nebo měly v $game_concept_struggle_region_region významné zastoupení.\n\n#weak Aby byla $game_concept_character$ $game_concept_struggle_involved$, musí být její $game_concept_culture$ i $game_concept_faith$ $game_concept_struggle_involved$ #EMP a#! zároveň musí mít své [Concept('capital','hlavní sídlo')|E] v $game_concept_struggle_region$.#!"
 game_concept_struggle_interloper: "Vetřelec"
 game_concept_struggle_interloper_interlopers: "Vetřelci"
 game_concept_struggle_interloper_desc: "Když je [Concept('character','postava')|E] zapletena do konkrétního [Concept('struggle','sváru')|E], ale ještě není považována za plně [Concept('struggle_involved','zapojenou')|E], je $game_concept_struggle_interloper$.\n\n$game_concept_struggle_interloper_interlopers$ mají svá [Concept('capital','hlavní sídla')|E] v [Concept('struggle_region','oblasti sváru')|E], ale nemají zároveň $game_concept_struggle_involved$ [Concept('faith','víru')|E] i $game_concept_struggle_involved$ [Concept('culture','kulturu')|E].\n\nPlně $game_concept_struggle_involved$ $game_concept_characters$ je vnímají jako vlezlé, obtížné cizáky, kteří nechápou, kde nejsou vítáni. $game_concept_struggle_interloper$ [Concept('rulers','vládci')|E] proto obvykle trpí určitými postihy v [Concept('counties','hrabstvích')|E], která drží uvnitř $game_concept_struggle_region$."
 game_concept_struggle_uninvolved: "Nezapojený"
 game_concept_struggle_uninvolved_desc: "Aby byla [Concept('character','postava')|E] v konkrétním [Concept('struggle','sváru')|E] považována za $game_concept_struggle_uninvolved$, stačí, aby měla své [Concept('capital','hlavní sídlo')|E] mimo [Concept('struggle_region','oblast sváru')|E].\n\nTo znamená, že je považována za cizince – někoho, kdo nejenže nemá vážný podíl na probíhajících [Concept('struggle_phase_phases','fázích')|E], ale kdo jej ani #EMP nemá mít#!, protože zjevně nemůže chápat místní nuance.\n\nJelikož jednou z mála věcí, na nichž se lidé uvnitř [Concept('struggle','sváru')|E] dokážou shodnout, je to, že $game_concept_struggle_uninvolved$ $game_concept_characters$ nemají v #EMP jejich#! zemích co pohledávat, $game_concept_struggle_uninvolved$ [Concept('rulers','vládci')|E] obvykle trpí tvrdými postihy ve všech [Concept('counties','hrabstvích')|E], která drží v rámci $game_concept_struggle_region$."
 game_concept_struggle_large_conquest: "Velké dobytí ve sváru"
 game_concept_struggle_large_conquest_desc: "Některé $game_concept_struggle_catalyst_catalysts$ zahrnují úspěšné dokončení velké [Concept('war','války')|E] útočníkem.\n\nPočítají se do toho následující [Concept('casus_bellis','casus belli')|E]:\n$EFFECT_LIST_BULLET$ $duchy_conquest_cb$ \n$EFFECT_LIST_BULLET$ $individual_duchy_de_jure_cb$ \n$EFFECT_LIST_BULLET$ $imperial_reconquest_cb$ \n$EFFECT_LIST_BULLET$ $invasion_war$ \n$EFFECT_LIST_BULLET$ $clan_invasion_war$ \n$EFFECT_LIST_BULLET$ $mongol_invasion_war$ \n$EFFECT_LIST_BULLET$ $major_religious_war$ $game_concept_war$ \n$EFFECT_LIST_BULLET$ [Concept('great_holy_war_directed','řízené velké svaté války')|E] i [Concept('great_holy_war_undirected','neřízené velké svaté války')|E] $game_concept_great_holy_wars$ \n$EFFECT_LIST_BULLET$ $tribal_subjugation_cb$"
 game_concept_struggle_region: "Oblast sváru"
 game_concept_struggle_region_region: "Oblast"
 game_concept_struggle_region_regions: "Oblasti"
 game_concept_struggle_region_desc: "Každý [Concept('struggle','svár')|E] je svázán s [Concept('region','oblastí')|E] na mapě. Poloha [Concept('character_possessive','postavy')|E] v tomto $game_concept_region$ spolu s její [Concept('culture','kulturou')|E] a [Concept('faith','vírou')|E] určuje, zda je klasifikována jako [Concept('struggle_involved','zapojená')|E], [Concept('struggle_interloper','vetřelec')|E] nebo [Concept('struggle_uninvolved','nezapojená')|E].\n\n[Concept('counties','Hrabství')|E] v rámci $game_concept_struggle_region$ obecně podléhají různým [Concept('county_modifiers','modifikátorům hrabství')|E] podle aktuální [Concept('struggle_phase_phase','fáze')|E]."
 game_concept_struggle_conquest: "Střet ve sváru"
 game_concept_struggle_conquest_conquest: "Střet"
 game_concept_struggle_conquest_conquests: "Střety"
 game_concept_struggle_conquest_desc: "Není neobvyklé, že se [Concept('rulers','vládci')|E] zapojení do [Concept('struggle','sváru')|E] dostanou do pohraničních sporů a drobných půtek, které se mění podle povahy aktuální [Concept('struggle_phase','fáze sváru')|E]. Snadná dostupnost úzce vymezených místních sporů umožňuje $game_concept_rulers$ podnikat menší zábory půdy, dobývat své cíle nebo je učinit vazaly.\n\nProtože $game_concept_struggle_conquest_conquests$ závisejí na prostředí svého [Concept('struggle','sváru')|E], jejich cena v [Concept('prestige','prestiži')|E] se odvíjí od aktuální $game_concept_struggle_phase$."
 game_concept_struggle_phase_iberia_opportunity: "Fáze příležitosti"
 game_concept_struggle_phase_iberia_opportunity_desc: "Po dlouhém období poměrně pokojného soužití během [Concept('struggle_phase_iberia_conciliation','fáze usmíření')|E] se začíná usazovat samolibost. Rolníci i šlechta si zvykli, že věci prostě #EMP fungují#!, což prohnanějším [Concept('characters','postavám')|E] umožňuje využít jejich naivity.\n\nČerstvé křivdy nakonec buď způsobí eskalaci do [Concept('struggle_phase_iberia_hostility','fáze nepřátelství')|E], nebo obratné politikaření dosáhne neklidné rovnováhy prostřednictvím [Concept('struggle_phase_iberia_conciliation','fáze usmíření')|E]."
 game_concept_struggle_phase_iberia_hostility: "Fáze nepřátelství"
 game_concept_struggle_phase_iberia_hostility_desc: "V této $game_concept_struggle_phase_phase$ vzplanou napětí a vášně. Opakované činy zloby a vyhrocená nedorozumění během [Concept('struggle_phase_iberia_opportunity','fáze příležitosti')|E] vedly k rostoucí nenávisti vůči [Concept('characters','postavám')|E] odlišných [Concept('cultures','kultur')|E], [Concept('faiths','věr')|E], nebo #EMP hůře#!: obojího.\n\nTakové krveprolití však nemůže trvat věčně. Nakonec buď chladnější hlavy, nebo prosté vyčerpání přivedou poloostrov do [Concept('struggle_phase_iberia_compromise','fáze kompromisu')|E]."
 game_concept_struggle_phase_iberia_compromise: "Fáze kompromisu"
 game_concept_struggle_phase_iberia_compromise_desc: "Ať už kvůli únavě ze svárů [Concept('struggle_phase_iberia_hostility','fáze nepřátelství')|E], nebo díky obratné eskalaci během [Concept('struggle_phase_iberia_conciliation','fáze usmíření')|E], $game_concept_struggle_phase_iberia_compromise představuje rostoucí narovnání mezi národy Ibérie. Rozdíly ustupují stranou a společné dějiny i dědictví spojují někdejší nepřátele.\n\nPoloostrov stojí na rozcestí: pokud se konflikty znovu objeví, čeká jej [Concept('struggle_phase_iberia_opportunity','fáze příležitosti')|E]."
 game_concept_struggle_phase_iberia_conciliation: "Fáze usmíření"
 game_concept_struggle_phase_iberia_conciliation_desc: "Jako výsledek významné [Concept('struggle_phase_iberia_compromise','fáze kompromisu')|E] během této $game_concept_struggle_phase_phase$ vzrostou vztahy mezi národy Ibérie natolik srdečně, že cizinci jen těžko chápou jejich shovívavost. Obzvlášť běžné jsou [Concept('marriages','sňatky')|E] mezi lidmi různých [Concept('faith','věr')|E].\n\nNemůže to však trvat věčně a zneužívání důvěry nakonec přivede [Concept('iberian_struggle','iberský svár')|E] zpět k [Concept('struggle_phase_iberia_compromise','fázi kompromisu')|E]."
 game_concept_struggle_involved_faith: "Zapojená víra"
 game_concept_struggle_involved_faiths: "Zapojené víry"
 game_concept_struggle_involved_faith_desc: "Některé [Concept('faiths','víry')|E] začínají ve [Concept('struggle','sváru')|E] již [Concept('struggle_involved','zapojené')|E]. Jiné se mohou zapojit vlivem měnících se okolností."
 game_concept_struggle_involved_culture: "Zapojená kultura"
 game_concept_struggle_involved_cultures: "Zapojené kultury"
 game_concept_struggle_involved_culture_desc: "Některé [Concept('cultures','kultury')|E] začínají ve [Concept('struggle','sváru')|E] již [Concept('struggle_involved','zapojené')|E]. Jiné se mohou zapojit vlivem měnících se okolností."
 game_concept_dissolution_faction: "Frakce za rozpad"
 game_concept_dissolution_factions: "Frakce za rozpad"
 game_concept_faction_dissolution: "Rozpad"
 game_concept_dissolution_faction_dissolved: "Rozpadlá"
 game_concept_dissolution_faction_desc: "[Concept('dissolution_faction','Frakce za rozpad')|E] usiluje o zničení [Concept('realm','panství')|E] svého [Concept('liege','lenního pána')|E]. Pokud uspěje, všichni vazalové v panství se stanou [Concept('independent','nezávislými')|E] a jejich lenní pán ztratí svůj [Concept('primary_title','hlavní titul')|E]."
 game_concept_improve_city_province_decision: "Rozhodnutí $improve_city_province_decision_name$"
 game_concept_improve_city_province_decision_desc: "[Concept('decision','Rozhodnutí')|E], které ti umožňuje zvýšit počet [Concept('buildings','budov')|E] dostupných v [Concept('city_holding','městské državě')|E]."
 game_concept_border_raid: "Pohraniční nájezd"
 game_concept_border_raids: "Pohraniční nájezdy"
 game_concept_border_raiding: "Podnikání pohraničních nájezdů"
 game_concept_border_raid_desc: "Jde o zvláštní typ [Concept('war','války')|E] dostupný mezi [Concept('struggle_involved','zapojenými')|E] [Concept('rulers','vládci')|E] iberského [Concept('struggle','sváru')|E], v němž se útočník snaží [Concept('siege','obléhat')|E] konkrétní nepřátelské [Concept('county','hrabství')|E] sousedící s jeho [Concept('realm','panstvím')|E].\n\n[Concept('war_leader','Vůdce války')|E] získá [Concept('gold','zlato')|E] za dobytí [Concept('war_target','cíle války')|E], který ztratí [Concept('development','rozvoj')|E] a [Concept('control','kontrolu')|E]. Mohou být zničeny také [Concept('buildings','budovy')|E], což přinese další [Concept('gold','zlato')|E]; tato šance roste s [Concept('development','rozvojem')|E] a velikostí obléhací [Concept('army','armády')|E].\n\n[Concept('war_score','Válečné skóre')|E] bude útočník rychle získávat při [Concept('occupying','okupaci')|E] [Concept('war_target','cíle války')|E]."
 game_concept_bargain_fealty: "Vyjednat lenní věrnost"
 game_concept_bargained_fealty: "Vyjednaná lenní věrnost"
 game_concept_bargain_fealty_desc: "Tato zvláštní [Concept('interaction','interakce')|E] je dostupná [Concept('struggle_involved','zapojeným')|E] [Concept('rulers','vládcům')|E], kteří jsou v obranné [Concept('war','válce')|E].\n\n[Concept('war_leader','Vůdce války')|E] požádá sousedního [Concept('ruler','vládce')|E] vyšší [Concept('rank','hodnosti')|E], aby se připojil k jeho válce výměnou za to, že se stane jeho [Concept('vassal','vazalem')|E]."
 game_concept_contract_assistance: "Vojenská pomoc"
 game_concept_contract_assisting: "Poskytování vojenské pomoci"
 game_concept_contract_assistance_desc: "Jde o zvláštní typ [Concept('interaction','interakce')|E] dostupný [Concept('struggle_involved','zapojeným')|E] [Concept('rulers','vládcům')|E] iberského [Concept('struggle','sváru')|E], který jim umožňuje připojit se k [Concept('wars','válkám')|E] jiných [Concept('struggle_involved','zapojených')|E] [Concept('rulerpossessive','vládců')|E] výměnou za [Concept('gold','zlato')|E].\n\nPlatba se provede po skončení [Concept('war','války')|E], bez ohledu na výsledek, pokud najatý pomocník dosáhl [Concept('war_contribution','válečného příspěvku')|E] alespoň 100."
 game_concept_iberian_reclamation: "Iberské znovudobytí"
 game_concept_iberian_reclaiming: "Iberské znovudobývání"
 game_concept_iberian_reclamations: "Iberská znovudobytí"
 game_concept_iberian_reclamation_desc: "Jde o zvláštní typ [Concept('war','války')|E] dostupný [Concept('struggle_involved','zapojeným')|E] [Concept('rulers','vládcům')|E] [Concept('iberian_struggle','iberského sváru')|E].\n\nÚtočník se snaží dobýt [Concept('duchy','vévodství')|E], které obsahuje jakákoli [Concept('struggle_involved','zapojená')|E] [Concept('counties','hrabství')|E] držená [Concept('struggle_interloper','vetřelcem')|E] nebo [Concept('struggle_uninvolved','nezapojeným')|E] [Concept('ruler','vládcem')|E], případně jej [Concept('vassalize','vazalizovat')|E], pokud nedrží žádnou zemi mimo toto vévodství."
 game_concept_enforce_truce: "Vynutit příměří"
 game_concept_enforced_truce: "Vynucené příměří"
 game_concept_enforce_truce_desc: "Jde o zvláštní typ [Concept('interaction','interakce')|E] dostupný [Concept('struggle_involved','zapojeným')|E] [Concept('rulers','vládcům')|E], který ukončí [Concept('war','válku')|E] [Concept('white_peace','bílým mírem')|E] a ustanoví [Concept('truces','příměří')|E].\n\nLze jej použít pouze k ukončení válek mezi jinými [Concept('struggle_involved','zapojenými')|E] [Concept('rulers','vládci')|E] nižší [Concept('rank','hodnosti')|E], v nichž je alespoň jedna strana [Concept('independent','nezávislá')|E] nebo součástí téhož [Concept('realm','panství')|E]."
 game_concept_incite_revolts_interaction: "Podnítit vzpouru"
 game_concept_incite_revolts_interaction_desc: "Umožňuje investovat [gold_i][Concept('gold','zlato')|E], aby byla podnícena [Concept('peasant_faction','rolnická frakce')|E] v jiném [Concept('realm','panství')|E], pokud má [Concept('counties','hrabství')|E] se záporným [Concept('county_opinion','míněním hrabství')|E]."
 game_concept_secure_iberian_foothold_decision: "$secure_iberian_foothold_decision_title$"
 game_concept_secure_iberian_foothold_decision_desc: "[Concept('decision','Rozhodnutí')|E], které umožňuje [Concept('ruler','vládci')|E] mimo [Concept('struggle_involved','zapojené')|E] ukončit [Concept('iberian_struggle','iberský svár')|E]."
 game_concept_golden_age_jewish_science_in_iberia_decision: "$golden_age_jewish_science_in_iberia_decision$"
 game_concept_golden_age_jewish_science_in_iberia_decision_desc: "[Concept('decision','Rozhodnutí')|E], v němž podporuješ místní židovské učence a sklízíš výhody."
 game_concept_build_holy_pilgrim_roads_decision: "$build_holy_pilgrim_roads_decision$"
 game_concept_build_holy_pilgrim_roads_decision_desc: "[Concept('decision','Rozhodnutí')|E], v němž stavíš cesty, aby poutníkům usnadnily život."
