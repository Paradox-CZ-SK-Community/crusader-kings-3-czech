l_polish:
 action_can_offer_assistance: "Můžeš nabídnout vojenskou pomoc"
 action_can_offer_assistance_label: "Můžeš nabídnout účast ve válce postavy [recipient.GetShortUINameNoTooltip] výměnou za zlato"
 action_can_offer_assistance_combined_label: "[recipient.GetShortUINameNoTooltip]"
 action_can_offer_assistance_desc: "[recipient.GetUIName] je [Concept('struggle_involved','zapojený')|E] [Concept('ruler','vládce')|E], který vede [Concept('war','válku')|E] proti jinému [Concept('realm','panství')|E], takže mu můžeš nabídnout [Concept('contract_assistance','vojenskou pomoc')|E].$action_can_offer_assistance_HELP$"
 action_can_offer_assistance_click: "#I Kliknutím nabídneš pomoc postavě [recipient.GetShortUINameNoTooltip]#!"
 action_can_offer_assistance_combined_group_label: "Můžeš se zapojit do válek za zlato"
 action_can_offer_assistance_combined_group_name: "Můžeš se zapojit do války postavy [recipient.GetShortUINameNoTooltip] za zlato"
 action_can_offer_assistance_combined_group_description: "Jiní [Concept('struggle_involved','zapojení')|E] [Concept('rulers','vládci')|E] vedou [Concept('wars','války')|E], takže jim můžeš nabídnout pomoc výměnou za [Concept('gold','zlato')|E]"
 action_can_offer_assistance_combined_unimportant: "$action_can_offer_assistance_unimportant$"
 action_can_offer_assistance_unimportant: "@warning_icon! #X Již vedeš [Concept('war','válku')|E]#!"
 action_can_offer_assistance_HELP: "\n\n#help Jako [Concept('ruler','vládce')|E] můžeš být také napaden, takže může být výhodné počkat, dokud nebude tvá situace dostatečně bezpečná na zapojení do další [Concept('war','války')|E].#!"
 action_can_bargain_fealty: "@liege_icon!Můžeš nabídnout vazalství výměnou za pomoc"
 action_can_bargain_fealty_label: "@liege_icon!Můžeš nabídnout své služby postavě [recipient.GetShortUINameNoTooltip] výměnou za ochranu"
 action_can_bargain_fealty_combined_label: "[recipient.GetShortUINameNoTooltip]"
 action_can_bargain_fealty_desc: "[recipient.GetUIName] je nedalekým [Concept('struggle_interloper',Select_CString(recipient.IsFemale,'vetřelkyní','vetřelcem'))|E] a [Concept('ruler',Select_CString(recipient.IsFemale,'vládkyní','vládcem'))|E] vyšší [Concept('title_tier','úrovně')|E], takže můžeš nabídnout své služby výměnou za zapojení do své [Concept('war','války')|E].$action_can_bargain_fealty_HELP$"
 action_can_bargain_fealty_click: "#I Kliknutím vyjednáš s postavou [recipient.GetShortUINameNoTooltip]#!"
 action_can_bargain_fealty_combined_group_label: "Vyjednej lenní věrnost s cizincem"
 action_can_bargain_fealty_combined_group_name: "Můžeš nabídnout své služby postavě [recipient.GetShortUINameNoTooltip]"
 action_can_bargain_fealty_combined_group_description: "Nedalecí [Concept('rulers','vládci')|E], kteří nejsou [Concept('struggle_involved','zapojeni')|E], se mohou připojit k tvé [Concept('war','válce')|E] výměnou za to, že se jeden z nich stane tvým [Concept('liege','lenním pánem')|E].$action_can_bargain_fealty_HELP$"
 action_can_bargain_fealty_combined_unimportant: ""
 action_can_bargain_fealty_unimportant: "@warning_icon! #X [recipient.GetShortUINameNoTooltip] pro tebe není důležitou postavou#!"
 action_can_bargain_fealty_HELP: "\n\n#help Přestaneš být [Concept('independent_ruler','nezávislým vládcem')|E]. Zvaž, zda by prohra ve tvé [Concept('war','válce')|E] byla horší než získání [Concept('liege','lenního pána')|E].#!"
