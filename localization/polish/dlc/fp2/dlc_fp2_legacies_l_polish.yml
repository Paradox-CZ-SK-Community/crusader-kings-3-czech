 LEGACY_DYNASTY_NO_SALARY_FREE_FIRING_COURT_POSITION_FROM_DYNASTY: "[Concept('house','Rod')|E] členové nebudou potřebovat plat při jmenování do [Concept('court_position','dvorského úřadu')|E] a mohou být propuštěni bez ztráty [prestige_i] [Concept('prestige','prestiž')|E]" # todo: RETRANSLATED ENGLISH # todo: CONCEPT CASE
 LEGACY_DYNASTY_BETTER_SPOUSE_FROM_HOUSE_MEMBERS: "[Concept('skills','Dovednosti')|E] from [Concept('spouse','choť')|E] [Concept('councillor_tasks','úkoly rádce')|E]: #p +10%#! za každého [Concept('councillor','rádce')|E] z vašeho [Concept('house','rodu')|E]" # todo: CONCEPT CASE
 LEGACY_DYNASTY_MORE_PRESTIGE_FROM_WAR_SUPPORT_HOUSE_MEMBERS: "Získejte více [prestige_i] [Concept('prestige','prestiž')|E] při přispívání k válce člena [Concept('house','rod')|E]\nOdemkne #V $call_house_member_to_war_interaction$#! pro všechny členy [Concept('house','rod')|E]" # todo: CONCEPT CASE
