l_polish:
 fp2_lyonese_monk.0000.t.revealed: "Podivné učení:"
 fp2_lyonese_monk.0000.t.council: "Koncil:"
 fp2_lyonese_monk_cancel_chain_effect.tt: "Při pokusu o zatčení přijde [acolyte.GetFirstName] o život"
 fp2_lyonese_monk.0000.tt.continues_to_teach: "[acolyte.GetFirstName] pokračuje ve svém učení"
 fp2_lyonese_monk.0000.tt.teachings_fade: "Učení, které šíří [acolyte.GetFirstName], postupně upadne v zapomnění"
 fp2_lyonese_monk.0000.tt.is_humbled: "#EMP [acolyte.GetFirstName] je [Select_CString(acolyte.IsFemale,'pokořena','pokořen')]#!"
 fp2_lyonese_monk.0000.tt.is_paused: "#EMP [acolyte.GetFirstName] se nad tím zamyslí#!"
 fp2_lyonese_monk.0000.tt.is_emboldened: "#EMP [acolyte.GetFirstName] získá odvahu#!"
 fp2_lyonese_monk.0000.tt.favour_elipandics: "Debatu vyhraje [GetFaithDoctrine('special_doctrine_adoptionist_school_elipandic_doctrine').GetBaseName]"
 fp2_lyonese_monk.0000.tt.favour_felicians: "Debatu vyhraje [GetFaithDoctrine('special_doctrine_adoptionist_school_felicitous_doctrine').GetBaseName]"
 fp2_lyonese_monk.0000.tt.favour_radicals: "Debatu vyhraje [GetFaithDoctrine('special_doctrine_adoptionist_school_radical_doctrine').GetBaseName]"
 fp2_lyonese_monk.0001.t: "Bouřlivá noc"
 fp2_lyonese_monk.0001.desc: "Vítr bičuje kamenné zdi [acolyte_host.GetCapitalLocation.GetTitle.GetNameNoTier] a celou noc kvílí jako smečka pekelných psů, jako by se mě zuřivě snažil vyrvat z bezpečí mého sídla.\n\nVábí mě teplo ložnice, daleko od těchto chladných chodeb, ale... nebyly to dveře do síně? Prudce se otočím za nečekaným zvukem a spatřím promoklou a zbědovanou [Select_CString(acolyte.IsFemale,'svatou ženu, která','svatého muže, který')] se potácivě dostává do sucha.\n\n„Má-“ [acolyte.GetFirstNameNoTooltip] se rozkašle a vychrchlá chuchvalec mokrého hlenu. „[Select_CString(acolyte_host.IsFemale,'Má paní','Můj pane')], prosím! Vichřice je strašlivá a já jsem na cestě už mnoho měsíců. Prosím vás o lůžko do úsvitu, než bouře pomine.“"
 fp2_lyonese_monk.0001.a: "Samozřejmě, zůstaň, jak dlouho budeš chtít!"
 fp2_lyonese_monk.0001.b: "Můžeš zůstat #EMP jednu#! noc."
 fp2_lyonese_monk.0001.c: "V [acolyte_host.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] žebráky nechci. #EMP Ven#!."
 fp2_lyonese_monk.0011.t: "[dead_owner.GetFirstNameNoTooltip]: starý přítel"
 fp2_lyonese_monk.0011.desc: "„[Select_CString(acolyte_host.IsFemale,'Má paní','Můj pane')], mohu vás na okamžik zdržet?“ ptá se duchovní přede mnou. „Jmenuji se [acolyte.GetFullNameNoTooltip] a pokorně jsem [Select_CString(acolyte.IsFemale,'sloužila','sloužil')] vašemu předchůdci.“\n\n„Vím, že stále truchlíte, ale váš předchůdce a já jsme měli jistou dohodu. Musím se tedy zeptat – dovolíte mi zůstat u vašeho dvora a dál učit vaše dvořany o cestách [acolyte.GetFaith.HighGodName]?“"
 fp2_lyonese_monk.0011.a: "Nu, asi ano..."
 fp2_lyonese_monk.0011.b: "Sbal si věci, tuláku."
 fp2_lyonese_monk.0021.t: "Konec a hotovo"
 fp2_lyonese_monk.0021.desc.intro: "Bez [acolyte.GetFullNameNoTooltip], [Select_CString(acolyte.IsFemale,'která','který')] by [Select_CString(acolyte.IsFemale,'putovala','putoval')] mým panstvím, obliba tohoto učení rychle upadá. Kde není kazatel, není ani kázání.\n\n"
 fp2_lyonese_monk.0021.desc.dead: "Po smrti [acolyte.GetFirstNameNoTooltip] nastane ticho a pochybuji, že si na celou věc za deset či sto let vůbec někdo vzpomene."
 fp2_lyonese_monk.0021.desc.imprisoned: "Ačkoli [acolyte.GetFirstNameNoTooltip] pouze chřadne ve vězení, lidská paměť je krátká a nad tímto rozsudkem visí zdrcující pocit konečnosti."
 fp2_lyonese_monk.0021.desc.gone: "Kam přesně [acolyte.GetFirstNameNoTooltip] #EMP [Select_CString(acolyte.IsFemale,'odešla','odešel')]#!, zůstává nezodpovězenou otázkou, ale pochybuji, že odpověď většinu lidí ještě vůbec zajímá."
 fp2_lyonese_monk.0021.a: "[acolyte.GetFirstNameNoTooltip] zase [Select_CString(acolyte.IsFemale,'nemohla','nemohl')] být tak [Select_CString(acolyte.IsFemale,'důležitá','důležitý')]..."
 fp2_lyonese_monk.0021.b: "S [acolyte.GetFirstNameNoTooltip] bylo očividně víc potíží než užitku..."
 fp2_lyonese_monk.0021.c: "To všechno bylo k ničemu?"
 fp2_lyonese_monk.0031.t: "Otřesená víra"
 fp2_lyonese_monk.0031.desc.acolyte_host: "Přijetí světla [acolyte_host.GetFaith.GetName] pro mě nebylo lehkým rozhodnutím a mnozí se proti tomuto projevu mé zbožnosti ostře ohradili.\n\nOd [acolyte.GetFirstName] jsem [Select_CString(acolyte_host.IsFemale,'čekala','čekal')] ještě ostřejší kritiku, ale místo toho [acolyte.GetFirstNameNoTooltip] prostě... [Select_CString(acolyte.IsFemale,'zmizela','zmizel')]. Jeden den tu, druhý pryč.\n\nNa žádná poslední slova si nevzpomínám, jen na smutně zachmuřenou tvář."
 fp2_lyonese_monk.0031.desc.acolyte: "Ze všech lidí, kteří mohli změnit víru, bych nikdy [Select_CString(acolyte_host.IsFemale,'nečekala','nečekal')], že právě [Select_CString(acolyte.IsFemale,'taková horlivka jako','takový horlivec jako')] #EMP [acolyte.GetFirstName]#! zavrhne svou dosavadní víru. Jenže žijeme v podivné době a přesně to se stalo.\n\nPravidelná kázání jsou pryč a nahradilo je zcela obyčejnější náboženské zanícení."
 fp2_lyonese_monk.0031.a: "[acolyte.GetFirstNameNoTooltip] mi nechybí. [acolyte_host.GetFaith.HighGodName] je se mnou!"
 fp2_lyonese_monk.0031.b: "[acolyte.GetFirstNameNoTooltip] očividně [Select_CString(acolyte.IsFemale,'neměla','neměl')] tak pevné přesvědčení."
 fp2_lyonese_monk.0041.t: "Máme větší problémy"
 fp2_lyonese_monk.0041.desc.pope_hope_is_nope: "Stalo se nemyslitelné – římský stolec byl zcela zničen. Skála, na níž naše církev stojí doslova i obrazně, se rozpadla a nikdo teď nemá čas na malicherné spory o podrobnosti dogmatu.\n\nBez pevného duchovního vedení jsou duše všech Kristových věrných v neustálém ohrožení. Co jiného proti tomu vůbec může být důležité?"
 fp2_lyonese_monk.0041.desc.schism: "Nedávné otřesy mezi námi a papežstvím vyhloubily propast – a za těchto okolností nemáme čas přít se o malicherné podrobnosti dogmatu. Proč bychom se měli zabývat jejich výklady, jejich problémy a jejich zmatenými nesmysly, když už neuznáváme jejich duchovní autoritu?\n\nKdo v tom vidí něco jiného než požehnání, mezi společenstvím věřících jistě není vítán."
 fp2_lyonese_monk.0041.a.pope_hope_is_nope: "Kdo nás povede bez Kristova náměstka?"
 fp2_lyonese_monk.0041.a.backup: "Teď budeme mít úplně #EMP nové#! spory!"
 fp2_lyonese_monk.0051.t: "Záhada"
 fp2_lyonese_monk.0051.desc: "Od mého uvěznění mám s okolním světem jen pramalý kontakt. Dostanou se ke mně jen šeptané vzkazy a občas nějaký zmačkaný lístek, a i ty přicházejí jen zřídka.\n\nPoslední taková zpráva říkala, že [acolyte.GetFirstName] prakticky beze stopy [Select_CString(acolyte.IsFemale,'zmizela','zmizel')]. Není jasné, zda jednoho dne prostě [Select_CString(acolyte.IsFemale,'odešla','odešel')], nebo zda za tím stojí něco zlověstnějšího, ale tak či onak je [acolyte.GetFirstNameNoTooltip] pryč."
 fp2_lyonese_monk.0051.a: "Co se asi [acolyte.GetFirstNameNoTooltip] stalo?"
 fp2_lyonese_monk.0201.t: "Jen pár přátel"
 fp2_lyonese_monk.0201.desc: "Od svého příchodu se [acolyte.GetFirstName] [Select_CString(acolyte.IsFemale,'stala','stal')] u dvora téměř neodmyslitelnou součástí života. Přinejmenším v teologických otázkách má podivuhodné charisma a neustále rozmlouvá v zákoutích pevnosti tu s nějakým dvořanem, tu s některým $knight_culture_player_no_tooltip$.\n\nProto mě příliš nepřekvapí, když [acolyte.GetFirstNameNoTooltip] požádá o místnost pro každotýdenní studijní setkání věnované textu [acolyte.GetFaith.random_ReligiousText].\n\n„Prosím vás, [acolyte_host.GetTitleAsNameNoTooltip]. Moc by to pro mě znamenalo a s vašimi poddanými bych se [Select_CString(acolyte.IsFemale,'mohla','mohl')] podělit o tolik poznání – o cestách, které nám ukazuje [acolyte.GetFaith.HighGodName], i o božské vůli. Potřebuji jen vaše svolení a malý prostor, kde bychom se mohli scházet.“"
 fp2_lyonese_monk.0201.a: "Asi tím nic nezkazím..."
 fp2_lyonese_monk.0201.a.tt: "[acolyte.GetFirstNameNoTooltip] začne každou neděli pořádat studijní setkání"
 fp2_lyonese_monk.0201.b: "Skupina #EMP spiklenců#!? To tedy ne!"
 fp2_lyonese_monk.0201.c: "Myslím, že jsi tu už dost dlouho, [acolyte.GetFirstNameNoTooltip]."
 fp2_lyonese_monk.0211.t: "[baron.Custom2('AppropriateGreetingPositive', acolyte_host)]"
 fp2_lyonese_monk.0211.desc: "S radostí vám musím oznámit, že se s okamžitou platností vzdávám vlády v [baron_holding.GetNameNoTier].\n\nMá víra mě volá do služby, již ode mě žádá [acolyte.GetFaith.HighGodName], a zbytek svých dnů hodlám zcela zasvětit této službě."
 fp2_lyonese_monk.0211.a: "To se #EMP smí#!?"
 fp2_lyonese_monk.0221.t: "Křečovitý úsměv"
 fp2_lyonese_monk.0221.desc: "Co je to za #EMP nesnesitelně#! veselé hvízdání, které ke mně doléhá zrovna po #EMP dlouhém#! zasedání rady? Sotva stačím tu myšlenku dokončit, když se za rohem objeví [courtier.Custom2('MyCharacterIntroduction' , acolyte_host)] a vrazí přímo do mě, až málem skončím na zemi.\n\n„Ach, [acolyte_host.GetFirstName], promiňte!“ zachichotá se [courtier.GetFirstNameNoTooltip]. „Jenže... dnes je #EMP tak#! nádherný den, nemyslíte? Člověk tu může doslova vdechovat krásu světa, který stvořil [courtier.GetFaith.HighGodName]!“\n\n[courtier.GetFirstNameNoTooltip] mi s úsměvem od ucha k uchu podá ruku."
 fp2_lyonese_monk.0221.a: "[Select_CString(acolyte_host.IsFemale,'Jsem ráda, že se ti daří','Jsem rád, že se ti daří')], [courtier.GetFirstNameNoTooltip]!"
 fp2_lyonese_monk.0221.b: "Nemám z toho dobrý pocit..."
 fp2_lyonese_monk.0231.t: "Vypískané kázání"
 fp2_lyonese_monk.0231.desc: "U dvora se povídá, že poslední kázání, se kterým [irate_theocrat.Custom2('MyCharacterIntroduction' , acolyte_host)] [Select_CString(irate_theocrat.IsFemale,'vystoupila','vystoupil')] před obyvateli [acolyte_host.GetCapitalLocation.GetTitle.GetNameNoTier], dopadlo #EMP špatně#!.\n\nPrý už po několika minutách začali farníci házet cibule, zanedlouho přešli k tuřínům a nakonec přiletěla tak velká hlávka zelí, že po zásahu do obličeje [irate_theocrat.GetFirstNameNoTooltip] [Select_CString(irate_theocrat.IsFemale,'skončila','skončil')] na zemi.\n\nOd té doby je [irate_theocrat.GetFirstNameNoTooltip] k neutěšení a nedokáže nikomu pořádně vysvětlit, co takový náhlý hněv vyvolalo."
 fp2_lyonese_monk.0231.a: "Lidé musí církvi prokazovat víc #EMP úcty#!."
 fp2_lyonese_monk.0231.b: "[irate_theocrat.GetFirstNameNoTooltip] musí očividně zapracovat na svých kázáních."
 fp2_lyonese_monk.0241.t: "Za všechno může [acolyte.GetFirstNameNoTooltip]"
 fp2_lyonese_monk.0241.desc: "S mohutným řevem vtrhne [irate_theocrat.Custom2('MyCharacterIntroduction' , acolyte_host)] do mých komnat a vleče [acolyte.GetFirstName] za rukáv roucha.\n\n„[acolyte_host.GetTitleAsNameNoTooltip|U]! Za všechno může tahle kreatura! Neuctiví sedláci, ti #EMP šťastní#! dvořané, ten podivný příval mnichů a jeptišek! Každý týden jim cpe do hlavy lži a kacířství, a ještě k tomu #EMP pod vaší pečetí#!!“\n\n„[Select_CString(acolyte_host.IsFemale,'Má paní','Můj pane')],“ vloží se do toho [acolyte.GetFirstNameNoTooltip], „věrně sloužím Kristu i [acolyte_host.GetFaith.GetReligiousHead.GetTitledFirstName]. #EMP Prosím#!, nenechte se zviklat ufňukanou nejistotou téhle #EMP pomatené duše#!, kterou jen rozčiluje, že nároky na místní duchovní v poslední době stouply.“"
 fp2_lyonese_monk.0241.a: "Dobrá – sbal si věci, [acolyte.GetFirstNameNoTooltip]."
 fp2_lyonese_monk.0241.b: "[Select_CString(acolyte.IsFemale,'STRÁŽE! Chopte se té kacířské mrchy!','STRÁŽE! Chopte se toho kacířského parchanta!')]"
 fp2_lyonese_monk.0241.c: "Myslím, že potíže tu působíš #EMP ty#!, [irate_theocrat.GetFirstNameNoTooltip]."
 fp2_lyonese_monk.0241.c.tt: "[acolyte.GetFirstNameNoTooltip] bude dál učit tvé dvořany"
 fp2_lyonese_monk.0401.t: "[pope.Custom2('AppropriateGreetingPositive', acolyte_host)]"
 fp2_lyonese_monk.0401.desc: "Nedávno jsem obdržel znepokojivé zprávy o bludném učení šířeném u tvého dvora.\n\nVím, že jsi [pope.GetFaith.GetAdherentName], a proto věřím, že tento list postačí k tomu, abys [Select_CString(acolyte_host.IsFemale,'učinila','učinil')] správnou věc a [Select_CString(acolyte_host.IsFemale,'vykázala','vykázal')] #EMP [acolyte.GetFirstName]#! – pro duchovní blaho nás všech."
 fp2_lyonese_monk.0401.a: "Svatý stolec mě k tomu zavazuje."
 fp2_lyonese_monk.0401.b: "Na [papal_capital.GetNameNoTierPossessiveNoTooltip] názor jsem se neptal."
 fp2_lyonese_monk.0411.t: "$fp2_lyonese_monk.0000.t.revealed$ Místo pro výuku"
 fp2_lyonese_monk.0411.desc: "„[Select_CString(acolyte_host.IsFemale,'Má paní','Můj pane')], mohu vás na okamžik zdržet?“ prosí [acolyte.GetFirstName] a vystoupí ze stínu výklenku právě ve chvíli, kdy opouštím kapli své pevnosti. Chvíli váhám a pak souhlasně přikývnu.\n\n„Jsem vám upřímně a nesmírně [Select_CString(acolyte.IsFemale,'vděčná','vděčný')] za podporu a záštitu nad mým posláním učit vaše poddané o Slovu [acolyte.GetFaith.HighGodName], ale jedna malá místnost a několik hodin týdně už začínají být příliš svazující.“\n\n„Byli byste ve své nezměrné moudrosti a štědrosti ochotni svěřit mi vládu nad [acolyte_fief.GetNameNoTier]? Z výnosů tohoto léna bych [Select_CString(acolyte.IsFemale,'mohla','mohl')] zachraňovat nikoli desítky, ale tisíce duší!“"
 fp2_lyonese_monk.0411.a: "Asi... asi bych to [Select_CString(acolyte_host.IsFemale,'mohla','mohl')] dovolit..."
 fp2_lyonese_monk.0411.b: "Nebuď [Select_CString(acolyte.IsFemale,'směšná','směšný')]!"
 fp2_lyonese_monk.0411.b.tt: "[acolyte.GetFirstNamePossessiveNoTooltip] sny jsou naprosto zničeny"
 fp2_lyonese_monk.0421.t: "$fp2_lyonese_monk.0000.t.revealed$ Vášně planou"
 fp2_lyonese_monk.0421.desc: "Jediná klidná večeře. Jediná. Klidná. Večeře. Kterého pitomce ze služebnictva napadlo posadit [irate_theocrat.Custom2('MyCharacterIntroduction' , acolyte_host)] vedle [acolyte.GetFirstName]?\n\n„#EMP Cože#! jsi to právě [Select_CString(acolyte.IsFemale,'řekla','řekl')]?“ zaječí [irate_theocrat.GetFirstNameNoTooltip] a prudce vyskočí, až se ovoce a pečivo rozletí na všechny strany. „[irate_theocrat.GetFaith.HighGodName] má věčného a soupodstatného Syna – a ty ho hanobíš, [Select_CString(acolyte.IsFemale,'ženo','muži')]!“ V místnosti zavládne hrobové ticho a všechny pohledy se upřou na hádající se duchovní.\n\n„Nikoho nehanobím. Jen nedokážeš ocenit jemné nuance mé christologie, a za to tě vlastně ani nemohu vinit. Alespoň ne vzhledem k tvým...“ [acolyte.GetFirstNameNoTooltip] se na okamžik odmlčí. „...nedostatkům.“"
 fp2_lyonese_monk.0421.a: "[irate_theocrat.GetFirstNameNoTooltip], trochu důstojnosti!"
 fp2_lyonese_monk.0421.b: "[acolyte.GetFirstNameNoTooltip], autoritu [irate_theocrat.GetFirstNameNoTooltip] #EMP budeš#! respektovat!"
 fp2_lyonese_monk.0421.c: "Nemáte toho společného víc než toho, co vás rozděluje?"
 fp2_lyonese_monk.0431.t: "[pope.Custom2('AppropriateGreetingPositive', acolyte_host)]"
 fp2_lyonese_monk.0431.desc.pope.different: "Možná se můj předchůdce"
 fp2_lyonese_monk.0431.desc.pope.same: "Možná jsem se"
 fp2_lyonese_monk.0431.desc.outro: " v prvním zaslaném listu nevyjádřil dost jasně. [acolyte.GetFullNameNoTooltip] čelí obvinění, že znovu vytahuje #EMP schizmatické#! nauky, které měly zůstat pohřbené spolu se svými odpornými zastánci v [pope.GetFaith.NegativeAfterLife2]. Okamžitě mi [acolyte.GetFirstNameNoTooltip] vydej k soudu, #EMP okamžitě#!, jinak se vystavuješ církevnímu pokárání."
 fp2_lyonese_monk.0431.a: "Dráždit stolec svatého Petra není moudré..."
 fp2_lyonese_monk.0431.b: "Možná existuje nějaká střední cesta."
 fp2_lyonese_monk.0431.b.tt.success: "[pope.GetTitledFirstNameNoTooltip] se poněkud uklidní"
 fp2_lyonese_monk.0431.b.tt.failure: "Tvé neobratné argumenty papeže rozzuří"
 fp2_lyonese_monk.0431.c: "Sakra, já jsem [acolyte_host.GetTitleAsNameNoTooltip]!"
 fp2_lyonese_monk.0441.t: "$fp2_lyonese_monk.0000.t.revealed$ [council_1_venue.GetNameNoTierNoTooltip] hostí koncil"
 fp2_lyonese_monk.0441.desc: "[council_1_venue.GetNameNoTier] doslova #EMP praská ve švech#! pod náporem duchovních a učenců, kteří přijeli sledovat veřejnou disputaci mezi [acolyte.GetFullNameNoTooltip] a [irate_theocrat.Custom2('MyCharacterIntroduction' , acolyte_host)]. Oba jsou odhodláni odhalit chyby, které spatřují v učení toho druhého.\n\nPrvních několik dnů se [irate_theocrat.GetFirstNameNoTooltip] vůbec nedaří. Přes veškerou snahu dokázat, že [acolyte.GetFirstNamePossessiveNoTooltip] teologie je chybná a klade přílišný důraz na lidskou stránku Ježíšovy osoby, nevěnuje regionální shromáždění [acolyte.GetFaith.PriestNeuterPlural] těmto argumentům téměř žádnou pozornost.\n\n[acolyte.GetFirstNameNoTooltip] naopak vystupuje s takovou jistotou, že mě [Select_CString(acolyte.IsFemale,'pozvala','pozval')] dohlížet na závěrečné řeči, čímž by čistě duchovní událost získala i světské posvěcení."
 fp2_lyonese_monk.0441.a: "Nu, když si mě vyžádali..."
 fp2_lyonese_monk.0441.b: "Teologické otázky nejsou mou starostí."
 fp2_lyonese_monk.0441.c: "[Select_CString(acolyte_host.IsFemale,'Nechala','Nechal')] jsem to zajít příliš daleko!"
 fp2_lyonese_monk.0601.t: "[pope.Custom2('AppropriateGreetingNegative', acolyte_host)]"
 fp2_lyonese_monk.0601.desc: "Jako pes se vrací ke svým zvratkům, tak se hlupáci stále vracejí ke kacířství jménem [GetFaithByKey('adoptionist').GetName]. Ve jménu veškeré milosti Ježíše a svatého Petra ti #EMP přikazuji#! vydat mi [acolyte.GetFullNameNoTooltip] k potrestání. Kaj se nyní a nekonečná láska církve ti odpustí, ale pokud budeš v této heterodoxii pokračovat, trest nemine ani tebe, ani [acolyte.GetFirstNameNoTooltip]."
 fp2_lyonese_monk.0601.a: "Mohu jen prosit, ať mi [acolyte_host.GetFaith.HighGodName] odpustí."
 fp2_lyonese_monk.0601.b: "[acolyte_host.GetFaith.HighGodName] stojí za mým #EMP jmenováním#!!"
 fp2_lyonese_monk.0611.t: "$fp2_lyonese_monk.0000.t.revealed$ Vysoké napětí"
 fp2_lyonese_monk.0611.desc: "„Kacíři! Lháři! Prznitelé!“\n\n„Pohané! Hlupáci! Modláři!“\n\nZ hradeb pevnosti v [rioting_county.GetNameNoTier] hledím na dva soupeřící davy měšťanů a rolníků, které po sobě plivají jedovaté nadávky. Studenti a následovníci [acolyte.GetFirstName] stojí proti zástupu jejich odpůrců.\n\nMezi oběma skupinami stojí tenká řada mých družiníků a zatím je drží od sebe, ale napětí už téměř dosáhlo bodu varu."
 fp2_lyonese_monk.0611.a: "Tohle dokážu uklidnit."
 fp2_lyonese_monk.0611.b: "Prosím, poddaní, uklidněte se!"
 fp2_lyonese_monk.0611.b.tt.success: "Situaci uklidníš"
 fp2_lyonese_monk.0611.b.tt.failure: "Násilí přesto propukne"
 fp2_lyonese_monk.0611.c: "Přineste mi meč. Tyhle #EMP vzbouřence#! rozeženeme."
 fp2_lyonese_monk.0611.c.tt: "Postavíš se na stranu heterodoxních horlivců"
 fp2_lyonese_monk.0611.d: "Kacíři? Na #EMP mém#! území?"
 fp2_lyonese_monk.0611.d.tt: "Postavíš se na stranu ortodoxních horlivců"
 fp2_lyonese_monk.0611.e: "Zavřete brány."
 fp2_lyonese_monk.0621.t: "$fp2_lyonese_monk.0000.t.revealed$ Formální stížnost"
 fp2_lyonese_monk.0621.desc: "„[Select_CString(acolyte_host.IsFemale,'Má paní','Můj pane')],“ naléhá [zealous_vassal.GetTitledFirstName], „nejsem snad [Select_CString(zealous_vassal.IsFemale,'vaše přísežná vazalka','váš přísežný vazal')]? [Select_CString(zealous_vassal.IsFemale,'Nebyla','Nebyl')] jsem vždy věrnou oporou vaší vlády? Prosím vás, nenásledujte [Select_CString(acolyte.IsFemale,'tuto... tuto #EMP kacířku#!','tohoto... tohoto #EMP hereziarchu#!')] po cestě, po níž já jít nemohu!“\n\n„Neposlouchejte [zealous_vassal.GetFirstNameNoTooltip], [acolyte_host.GetTitleAsNameNoTooltip],“ šeptá mi zezadu [acolyte.GetFirstName]. „Každý ví, že je to jen další figurka v rukou [papal_capital.GetNameNoTier], která se vám snaží tajně otrávit mysl.“\n\n„Zavři zobák, nebo ti vyříznu jazyk, hade!“ zavrčí [zealous_vassal.GetFirstNameNoTooltip]."
 fp2_lyonese_monk.0621.a: "[pope.GetTitledFirstNameNoTooltip] mě nepřesvědčil. Proč si myslíš, že to dokážeš ty?"
 fp2_lyonese_monk.0621.a.tt.success: "Zpochybníš argumenty, které předkládá [zealous_vassal.GetFirstNameNoTooltip]"
 fp2_lyonese_monk.0621.a.tt.failure: "[zealous_vassal.GetFirstNameNoTooltip] se jen ještě víc rozzuří"
 fp2_lyonese_monk.0621.b: "Vazal? Jsi jen věčný potížista!"
 fp2_lyonese_monk.0621.c: "[zealous_vassal.GetTitledFirstNameNoTooltip] má pravdu. Tohle zašlo příliš daleko."
 fp2_lyonese_monk.0631.t: "[neighbouring_ruler.Custom2('AppropriateGreetingNegative', acolyte_host)]"
 fp2_lyonese_monk.0631.desc: "Z dobroty svého srdce ti píši, abych tě [Select_CString(neighbouring_ruler.IsFemale,'informovala','informoval')], že [pope.GetTitledFirstName] mi nedávno udělil listinu potvrzující úplné a #EMP právoplatné#! vlastnictví [acolyte_host.GetPrimaryTitle.GetNameNoTier].\n\nAž přijedu své nové državy zkontrolovat, věřím, že mi je bez zbytečného povyku předáš."
 fp2_lyonese_monk.0631.a: "To je nehoráznost!"
 fp2_lyonese_monk.0641.t: "$fp2_lyonese_monk.0000.t.revealed$ Pouhý člověk"
 fp2_lyonese_monk.0641.desc: "Nepřátelé jsou ze všech stran. Neloajální vazalové, rozzuřený papež, rolníci jdoucí si navzájem po krku... Skoro mám pocit, že se [acolyte_host.GetPrimaryTitle.GetNameNoTier] kolem mě začíná rozpadat, trhané na kusy teologickými malichernostmi a přízemními boji o moc. Sklesle se sesunu nad stůl.\n\n„[acolyte_host.GetTitleAsNameNoTooltip|U],“ zamumlá [acolyte.GetFullNameNoTooltip] stojící za mou židlí. Ani jsem [Select_CString(acolyte_host.IsFemale,'neslyšela','neslyšel')], že někdo vstoupil. „Zdá se, že přes veškerou naši snahu odmítají [pope.GetTitledFirstName] a jeho kumpáni ustoupit byť jen v jediném bodě svého chybného dogmatu.“\n\n„Napadá mě však... zdá se, že se #EMP bojí#! pravd, které můžeme odhalit, když zpochybníme jejich výklad kánonu. Jestli nás takoví hlupáci a modláři chtějí zatratit jako [GetFaithByKey('adoptionist').GetAdherentNamePlural], je to vůbec skutečné zatracení? Možná se nám skrze jejich výkřiky #EMP zjevuje#! pravda, kterou přináší [acolyte.GetFaith.HighGodName]?“"
 fp2_lyonese_monk.0641.a: "Ano... #EMP ano#!, proč ne? Když nás z toho tak #EMP urputně#! obviňují."
 fp2_lyonese_monk.0641.a.tt.hidden_convert.character: "Síť skrytých věřících, kterou [Select_CString(acolyte.IsFemale,'vybudovala','vybudoval')] [acolyte.GetFirstNameNoTooltip]"
 fp2_lyonese_monk.0641.a.tt: "Bude svolán církevní koncil"
 fp2_lyonese_monk.0641.b: "Hade! Tohle jsi [Select_CString(acolyte.IsFemale,'plánovala','plánoval')] celou dobu!"
 fp2_lyonese_monk.0801.t.first: "Koncil v [council_2_venue.GetNameNoTierNoTooltip]"
 fp2_lyonese_monk.0801.t.second: "Druhý koncil v [council_2_venue.GetNameNoTierNoTooltip]"
 fp2_lyonese_monk.0801.desc.intro: "Rodící se víra si žádá debatu, a tak [acolyte.GetFirstName] [Select_CString(acolyte.IsFemale,'svolala','svolal')] koncil vlivných duchovních, kteří mají pochopení pro naši věc. Dominují mu tři tábory, které v mých síních soupeří o vliv, zatímco se připravujeme projednat nauku našeho hnutí.\n\n[GetFaithDoctrine('special_doctrine_adoptionist_school_elipandic_doctrine').GetBaseName] prosazuje nuancovaný, avšak neústupný výklad, který se snaží smířit s mnoha tradičními body trojiční nauky. [GetFaithDoctrine('special_doctrine_adoptionist_school_felicitous_doctrine').GetBaseName] zastává přísnější postoj, ale soustředí se na praktické přežití víry v nepřátelském světě. Menšinový [GetFaithDoctrine('special_doctrine_adoptionist_school_radical_doctrine').GetBaseName] překypuje sotva skrývaným hněvem a tradiční ortodoxii považuje za pouhé pohanství v chatrném převleku.\n\nPodle [acolyte.GetFirstNameNoTooltip] ukázal pobyt u mého dvora hodnotu"
 fp2_lyonese_monk.0801.desc.elipandic: "debaty a pevnosti, a proto se přiklání k [GetFaithDoctrine('special_doctrine_adoptionist_school_elipandic_doctrine').GetBaseName]."
 fp2_lyonese_monk.0801.desc.felicitous: "pokory a praktičnosti, a proto se přiklání k [GetFaithDoctrine('special_doctrine_adoptionist_school_felicitous_doctrine').GetBaseName]."
 fp2_lyonese_monk.0801.desc.radical: "ohně a zuřivosti, a proto se přiklání k [GetFaithDoctrine('special_doctrine_adoptionist_school_radical_doctrine').GetBaseName]."
 fp2_lyonese_monk.0801.tt.invalidation_warning: "#WEAK Pokud budu [Concept('imprisoned',Select_CString(acolyte_host.IsFemale,'uvězněna','uvězněn'))|E] a nebudu moci koncil dokončit, převládnou názory [acolyte.GetFirstNameNoTooltip]#!"
 fp2_lyonese_monk.0801.a: "Samozřejmě povedu hlavní část diskuse."
 fp2_lyonese_monk.0801.a.tt: "Pomocí střetů v [Concept('learning','učenosti')|E] budeš prosazovat své argumenty"
 fp2_lyonese_monk.0801.b: "Můj vliv bude spíš cítit než vidět..."
 fp2_lyonese_monk.0801.b.tt: "Za každou rozhodnou volbu utratíš [piety_i]#N [EmptyScope.ScriptValue('fp2_lyonese_monk_conclave_cost_value')|0]#! [Concept('piety','zbožnosti')|E] #WEAK ale bez dostatku $game_concept_piety$ tuto možnost použít nemůžeš#!"
 fp2_lyonese_monk.0801.c: "Tohle je záležitost výhradně duchovenstva."
 fp2_lyonese_monk.0801.c.tt: "O výsledku koncilu se rozhodne bez tvého přispění"
 fp2_lyonese_monk.0811.t: "$fp2_lyonese_monk.0000.t.council$ Otec a Syn"
 fp2_lyonese_monk.0811.desc: "Nejzřejmější otázkou na pořadu jednání je soupodstatnost, tedy jak mohl Ježíš zároveň prožít smysluplný lidský život plný utrpení a přitom existovat jako věčná božská osoba.\n\n[GetFaithDoctrine('special_doctrine_adoptionist_school_elipandic_doctrine').GetBaseName] tvrdí, že se tyto dvě skutečnosti navzájem nevylučují, zatímco [GetFaithDoctrine('special_doctrine_adoptionist_school_felicitous_doctrine').GetBaseName] požaduje jejich jasné rozlišení, které nepopírá božství Božího Syna, pouze je ještě výrazněji podřizuje Otci.\n\nČlenové [GetFaithDoctrine('special_doctrine_adoptionist_school_radical_doctrine').GetBaseName] házejí ovocem a ječí, že celá otázka není ničím než nesmyslným divadlem."
 fp2_lyonese_monk.0811.a: "Ta otázka má své nuance..."
 fp2_lyonese_monk.0811.a.tt.success: "[acolyte_host.GetFaith.PriestNeuterPlural|U] jsou přesvědčeni"
 fp2_lyonese_monk.0811.a.tt.failure: "Duchovenstvo tě vypíská"
 fp2_lyonese_monk.0811.b: "Když si mě vyvolí [acolyte.GetFaith.HighGodName], není to žádná hanba."
 fp2_lyonese_monk.0811.b.tt.success: "[acolyte_host.GetFaith.PriestNeuterPlural|U] jsou přesvědčeni"
 fp2_lyonese_monk.0811.b.tt.failure: "Duchovenstvo tě vypíská"
 fp2_lyonese_monk.0811.c: "Být #EMP jednou#! člověkem vylučuje být #EMP věčně#! Bohem!"
 fp2_lyonese_monk.0811.c.tt.success: "[acolyte_host.GetFaith.PriestNeuterPlural|U] jsou přesvědčeni"
 fp2_lyonese_monk.0811.c.tt.failure: "Duchovenstvo tě vypíská"
 fp2_lyonese_monk.0811.d: "Na tuto otázku nemám názor."
 fp2_lyonese_monk.0821.t: "$fp2_lyonese_monk.0000.t.council$ Pragmatismus proti zásadám"
 fp2_lyonese_monk.0821.desc: "Diskuse koncilu se obrátila k otázce, jak žít a praktikovat víru ve světě, který na [acolyte_host.GetFaith.GetName] pohlíží jako na učení natolik zjednodušující, až je považuje za nejhorší kacířství.\n\n[GetFaithDoctrine('special_doctrine_adoptionist_school_felicitous_doctrine').GetBaseName] především trvá na tom, že vnitřní pravda má přednost před vnější lží. Připomíná přitom mnoho, #EMP opravdu mnoho#! falešných odvolání svého vzoru Felixe z Urgellu a dlouhý život, který mu zajistila.\n\nJejich kolegové z [GetFaithDoctrine('special_doctrine_adoptionist_school_elipandic_doctrine').GetBaseName] to odsuzují jako rouhavou zbabělost a tvrdí, že respekt lze získat jedině diskusí a debatou. [GetFaithDoctrine('special_doctrine_adoptionist_school_radical_doctrine').GetBaseName] zase bouřlivě prohlašuje, že věřící může ochránit #EMP pouze#! světská moc."
 fp2_lyonese_monk.0821.a: "Dohoda se zbytkem křesťanstva je nezbytná."
 fp2_lyonese_monk.0821.a.tt.success: "[acolyte_host.GetFaith.PriestNeuterPlural|U] jsou přesvědčeni"
 fp2_lyonese_monk.0821.a.tt.failure: "Duchovenstvo tě vypíská"
 fp2_lyonese_monk.0821.b: "Pragmatismus je sám o sobě zásadový."
 fp2_lyonese_monk.0821.b.tt.success: "[acolyte_host.GetFaith.PriestNeuterPlural|U] jsou přesvědčeni"
 fp2_lyonese_monk.0821.b.tt.failure: "Duchovenstvo tě vypíská"
 fp2_lyonese_monk.0821.c: "Skrytá víra je víra bez zápalu!"
 fp2_lyonese_monk.0821.c.tt.success: "[acolyte_host.GetFaith.PriestNeuterPlural|U] jsou přesvědčeni"
 fp2_lyonese_monk.0821.c.tt.failure: "Duchovenstvo tě vypíská"
 fp2_lyonese_monk.0821.d: "To záleží na okolnostech..."
 fp2_lyonese_monk.0831.t: "$fp2_lyonese_monk.0000.t.council$ Jediný Bůh"
 fp2_lyonese_monk.0831.desc: "Koncil spěje k bouřlivému závěru. [council_2_venue.GetNameNoTier] se otřásá drobnými potyčkami i vášnivými hádkami, zatímco všechny tři církevní tábory bojují za své přesvědčení doslova i obrazně.\n\nJádrem této #EMP živé#! debaty je prostá otázka samotných základů víry.\n\n[GetFaithDoctrine('special_doctrine_adoptionist_school_radical_doctrine').GetBaseName] trvá na tom, co považuje za čistý monoteismus. [GetFaithDoctrine('special_doctrine_adoptionist_school_felicitous_doctrine').GetBaseName] klade velký důraz na Boha Otce, ale není tak otevřeně kritická, jak požadují radikálové. [GetFaithDoctrine('special_doctrine_adoptionist_school_elipandic_doctrine').GetBaseName] si naopak zachovává mnoho zjevně trojičních myšlenek, které jsou ostatním proti srsti."
 fp2_lyonese_monk.0831.a: "Otec, Syn a Duch svatý jsou stále jedinou bytostí."
 fp2_lyonese_monk.0831.a.tt.success: "[acolyte_host.GetFaith.PriestNeuterPlural|U] jsou přesvědčeni"
 fp2_lyonese_monk.0831.a.tt.failure: "Duchovenstvo tě vypíská"
 fp2_lyonese_monk.0831.b: "Oddělení Otce a Syna neumenšuje ani jednoho."
 fp2_lyonese_monk.0831.b.tt.success: "[acolyte_host.GetFaith.PriestNeuterPlural|U] jsou přesvědčeni"
 fp2_lyonese_monk.0831.b.tt.failure: "Duchovenstvo tě vypíská"
 fp2_lyonese_monk.0831.c: "Prvenství Otce je neměnné."
 fp2_lyonese_monk.0831.c.tt.success: "[acolyte_host.GetFaith.PriestNeuterPlural|U] jsou přesvědčeni"
 fp2_lyonese_monk.0831.c.tt.failure: "Duchovenstvo tě vypíská"
 fp2_lyonese_monk.0831.d: "To jsme se kvůli dogmatu rozštěpili tak rychle?"
 fp2_lyonese_monk.0841.t: "$fp2_lyonese_monk.0000.t.council$ Od samého okraje"
 fp2_lyonese_monk.0841.desc.intro: "Dnešním dnem se rodí #EMP nová#! víra – [acolyte_host.GetFaith.GetName]! "
 fp2_lyonese_monk.0841.desc.pluralist: "Přijali jsme nutnost dopřát ve svých zemích prostor i ostatním,"
 fp2_lyonese_monk.0841.desc.righteous: "Rozhodli jsme se pevně trvat na tom, jak budeme ve svých zemích jednat s ostatními,"
 fp2_lyonese_monk.0841.desc.fundamentalist: "Rozhodli jsme se obracet ty, kdo dosud nebyli spaseni, ve svých zemích na pravou víru,"
 fp2_lyonese_monk.0841.desc.sanctioned_false_conversions: " a když se ocitneme v opačné situaci, nevidíme problém v pragmatickém přístupu."
 fp2_lyonese_monk.0841.desc.religious_law: " a přesto zůstáváme odhodláni řešit své teologické spory otevřeně."
 fp2_lyonese_monk.0841.desc.pursuit_of_power: " a nevidíme důvod, proč se nesnažit své země za každou cenu #EMP rozšířit#!."
 fp2_lyonese_monk.0841.desc.felicitous: "\n\nPo urputné debatě nakonec zvítězily výmluvné jazyky [GetFaithDoctrine('special_doctrine_adoptionist_school_felicitous_doctrine').GetBaseName]."
 fp2_lyonese_monk.0841.desc.elipandic: "\n\nDíky věcné a neústupné debatě nakonec zvítězily chladné hlavy [GetFaithDoctrine('special_doctrine_adoptionist_school_elipandic_doctrine').GetBaseName]."
 fp2_lyonese_monk.0841.desc.radical: "\n\nZe všech těch nesmyslných debat si jasnou vizi zachovali jedině horlivci z [GetFaithDoctrine('special_doctrine_adoptionist_school_radical_doctrine').GetBaseName], a právě k nim teď vzhlížíme jako ke svým vůdcům."
 fp2_lyonese_monk.0841.desc.outro: "\n\nUž nejsme pouhým snem osamělého potulného duchovního. Nyní jsme živým a životaschopným společenstvím, které jistě brzy přijme celé křesťanstvo."
 fp2_lyonese_monk.0841.a: "Ať nám říkají kacíři. Jen chápeme nuance, které jim unikají."
 fp2_lyonese_monk.0841.b: "Naše slova jsou rozumná a naše činy také."
 fp2_lyonese_monk.0841.c: "Pohleďte, jak se odhaluje mnohobožství těchto falešných křesťanů!"
 fp2_lyonese_monk.0841.d: "Jen doufám, že jsme se rozhodli správně."
