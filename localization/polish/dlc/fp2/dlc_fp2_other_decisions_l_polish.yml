 found_kingdom_toledo_decision_title: "Založit Toledské království"
 found_kingdom_toledo_decision_desc: "Od pádu Vizigótského království do rukou Maurů ztratilo Toledo svůj někdejší význam. Jako hlavní sídlo nového panství vyznávajícího [ROOT.Char.GetFaith.GetName] se opět stane sídlem králů."
