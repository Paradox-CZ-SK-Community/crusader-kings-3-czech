 improve_city_province_decision: "$improve_city_province_decision_name$"
 improve_city_province_decision_name: "Rozšířit města"
 improve_city_province_decision_desc: "Zaplať za výstavbu okázalých nových čtvrtí ve svých městech"
 improve_city_province_decision_confirm: "Zahájit rozšiřování"
 improve_city_province_decision_tooltip: "Investuj peníze a získej nové sloty pro [Concept('building','budovy')|E] ve svých [Concept('cities','městech')|E]"
 improve_city_province_decision_decision_no_effect: "Žádné [Concept('city','město')|E] nesplňuje podmínky"
 improve_city_province_decision_at_least_one_city_tt: "Alespoň jedno město má méně než 5 slotů pro budovy"
 fp2_secure_mediterranean.t: "Ovládnout Středomoří"
 fp2_secure_mediterranean.desc: "Klíčové ostrovy napříč Středomořím jsou v našich rukou a slouží jako strážní věže nad mořem. Nastal čas prohlásit, že jeho vody patří nám."
 fp2_secure_mediterranean.tip: "Prohlaš Středomoří za své"
 secure_iberian_foothold_decision_title: "Předmostí v Ibérii"
 secure_iberian_foothold_decision_desc: "Oslabené a rozhádané státy Ibérie otevřely poloostrov cizincům. Kdyby se někdo dokázal prohlásit novým [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] vůdcem regionu, nebo zkrátka slavným dobyvatelem, mohl by mnoho získat."
 secure_iberian_foothold_decision_tooltip: "Začleň část Ibérie"
 secure_iberian_foothold_decision_confirm: "Ať rozhodne síla."
 fp2_struggle_uninvolved_or_external_tt: "Tvé [Concept('capital','hlavní sídlo')|E] leží mimo [Concept('region','region')|E] [GetGeographicalRegion('world_europe_west_iberia').GetName]"
 fp2_struggle_secure_iberian_foothold_empire_tt: "Držíš [Concept('title','titul')|E] [Concept('empire','říše')|E], který není [GetTitleByKey('e_spain').GetNameNoTier]"
 fp2_struggle_phase_hostility_or_opportunity_tt: "Iberský [Concept('struggle_phase','svár')|E] se nachází ve [Concept('struggle_phase_iberia_hostility','Fázi nepřátelství')|E] nebo [Concept('struggle_phase_iberia_opportunity','Fázi příležitosti')|E] (Aktuálně: [GetStruggle('iberian_struggle').GetCurrentPhase.GetName])"
 fp2_struggle_secure_iberian_foothold_kingdom_iberian_tt: "[Concept('hold','Držíš')|E] a [Concept('completely_control','zcela ovládáš')|E] [Concept('de_jure','de iure')|E] [Concept('kingdom','království')|E] v rámci říše [GetTitleByKey('e_spain').GetNameNoTier]"
 fp2_struggle_secure_iberian_foothold_kingdom_faith_tt: "Alespoň #Z [SCOPE.ScriptValue('fp2_struggle_secure_iberian_foothold_faith_target_percent_value')|0]%#! [Concept('de_jure','de iure')|E] [Concept('counties','hrabství')|E] tohoto [Concept('titlepossessive','titulu')|E] vyznává [THIS.Char.GetFaith.GetName]"
 fp2_struggle_secure_iberian_foothold_kingdom_border_tt: "Tento [Concept('title','titul')|E] sousedí s drženým [Concept('de_jure','de iure')|E] [Concept('kingdom','královstvím')|E] v [Concept('empire','říši')|E], kterou [Concept('hold','držíš')|E] a není to [GetTitleByKey('e_spain').GetNameNoTier]"
 fp2_struggle_secure_iberian_foothold_kingdom_held_tt: "Tento [Concept('title','titul')|E] držíš alespoň [SCOPE.ScriptValue('fp2_struggle_secure_iberian_foothold_years_value')|0Z] let"
 fp2_struggle_secure_iberian_foothold_religion_tt: "[Concept('hold','Držíš')|E] alespoň #Z [SCOPE.ScriptValue('fp2_struggle_secure_iberian_foothold_religion_target_percent_value')|0]%#! [Concept('counties','hrabství')|E] [THIS.Char.GetFaith.GetReligion.GetAdjective] [Concept('faith','víry')|E] v [Concept('region','regionu')|E] [GetGeographicalRegion('world_europe_west_iberia').GetName] (Aktuálně: [SCOPE.ScriptValue('fp2_struggle_secure_iberian_foothold_religion_percent_value')|1]%)\n"
 fp2_struggle_secure_iberian_foothold_outsider_tt: "[Concept('hold','Držíš')|E] alespoň #Z [SCOPE.ScriptValue('fp2_struggle_secure_iberian_foothold_outsider_target_percent_value')|0]%#! [Concept('counties','hrabství')|E] v [Concept('region','regionu')|E] [GetGeographicalRegion('world_europe_west_iberia').GetName] (Aktuálně: [SCOPE.ScriptValue('fp2_struggle_secure_iberian_foothold_outsider_percent_value')|0]%)\n"
 fp2_struggle_secure_iberian_foothold_empire_held_effect_tt: "Každé [Concept('de_jure','de iure')|E] [Concept('kingdom','království')|E] říše [GetTitleByKey('e_spain').GetNameNoTier], které splňuje níže uvedené podmínky, se stane [Concept('de_jure','de iure')|E] součástí [THIS.Char.GetPrimaryTitle.GetNameNoTier]"
 fp2_struggle_secure_iberian_foothold_empire_dejure_effect_tt: "Každé [Concept('de_jure','de iure')|E] [Concept('kingdom','království')|E] říše [GetTitleByKey('e_spain').GetNameNoTier], které splňuje níže uvedené podmínky, se stane [Concept('de_jure','de iure')|E] součástí [Concept('empire','říše')|E] [THIS.Char.GetPrimaryTitle.GetDeJureLiege.GetNameNoTier]"
 fp2_struggle_secure_iberian_foothold_ends_the_struggle_tt: "[Concept('iberian_struggle','Iberský svár')|E] končí"
 iberian_footholder_transfer_tt: "[THIS] [THIS.Title.GetName] [THIS.GetName]"
 fp2_other_decisions.1000.t: "$secure_iberian_foothold_decision_title$: Upevnění moci ([iberian_footholder.GetPrimaryTitle.GetAdjectiveNoTooltip])"
 fp2_other_decisions.1000.involved_religion: "Války mezi rozhádanými iberskými knížectvími téměř srazily [ROOT.Char.GetFaith.GetReligion.GetAdjective] panství regionu na kolena.\n\nBez našeho zásahu by byl [ROOT.Char.GetFaith.HighGodNamePossessive] lid nakonec vytlačen z poloostrova rozpínavými nevěřícími.\n\n"
 fp2_other_decisions.1000.desc: "Rozdělené víry a národy Ibérie nám poskytly jedinečnou příležitost. Jsou příliš zaměstnány vzájemnými boji, než aby se dokázaly postavit [ROOT.Char.GetFaith.GetReligion.GetAdjective] invazi na poloostrov."
 fp2_other_decisions.1000.involved_faith: "Na západě žijí [ROOT.Char.GetFaith.GetAdherentNamePlural]. Jsme jejich právoplatnými obránci a [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] jim nyní poskytuje bezpečí."
 fp2_other_decisions.1000.uninvolved_faith: "Bylo na nás, abychom sem přinesli světlo pravé víry: [ROOT.Char.GetFaith.GetName]. [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] nyní zahrnuje i tyto země, které budou znovu prosperovat v míru."
 fp2_other_decisions.1000.closing: "\n\nČasem pochopí, že éra jejich falešných bohů skončila, a zaradují se nad spásou regionu. [ROOT.Char.GetFaith.HighGodName] i [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] se stanou jejími symboly."
 fp2_other_decisions.1000.a: "Ibérie potřebovala novou krev."
 fp2_other_decisions.1001.involved_religion: "Po staletích válek mezi iberskými křesťany a Maury nyní našeho sváru využili rozpínaví [iberian_footholder.GetPrimaryTitle.GetAdjective] vetřelci.\n\n"
 fp2_other_decisions.1001.desc: "Kvůli rozptýlení, závisti a nedbalosti jsme my Iberové dovolili [iberian_footholder.GetPrimaryTitle.GetAdjective] vetřelcům využít rozdělení naší vlasti a vpadnout do historických království poloostrova."
 fp2_other_decisions.1001.involved_faith: "[iberian_footholder.GetTitledFirstName] [Select_CString(iberian_footholder.IsFemale,'se prohlásila','se prohlásil')] za legitimní [Select_CString(iberian_footholder.IsFemale,'vůdkyni','vůdce')] poloostrova vyznávajícího [iberian_footholder.GetFaith.GetAdjectiveNoTooltip] víru a svými vítězstvími dokládá oprávněnost tohoto nároku na úkor slábnoucích [iberian_footholder.GetFaith.GetReligion.GetAdjective] panství Ibérie."
 fp2_other_decisions.1001.same_uninvolved_faith: "Tvrdí, že naše neúspěchy byly [ROOT.Char.GetFaith.HighGodNamePossessive] trestem za odklon od pravé cesty [iberian_footholder.GetFaith.GetName] a že [iberian_footholder.GetTitledFirstName] [Select_CString(iberian_footholder.IsFemale,'je právoplatnou vůdkyní','je právoplatným vůdcem')] [ROOT.Char.GetFaith.GetReligion.GetAdjective] Ibérie..."
 fp2_other_decisions.1001.uninvolved_faith: "Svá vítězství používá [iberian_footholder.GetTitledFirstName] jako důkaz, že [iberian_footholder.GetFaith.GetAdjective] víra je pravou [iberian_footholder.GetFaith.GetReligion.GetAdjective] cestou. Má sjednotit celý poloostrov a [iberian_footholder.GetFaith.HighGodName] pak bude stát v jeho čele."
 fp2_other_decisions.1001.closing: "\n\nZatímco [iberian_footholder.GetTitledFirstName] upevňuje vládu nad svými državami, dávné rozdíly mezi muslimy a křesťany jako by bledly ve srovnání s touto [iberian_footholder.GetFaith.GetAdjective] okupací..."
 fp2_other_decisions.1001.a: "Zatracení vetřelci."
 council_of_toledo_decision_title: "Svolat toledský koncil"
 council_of_toledo_decision_desc_count: "[ROOT.Char.GetFaith.GetAdherentNamePlural] opět čelí náboženským otázkám, které je třeba vyřešit. Nastal čas svolat [SCOPE.ScriptValue('council_of_toledo_counter_value')][ROOT.Char.Custom('get_council_of_toledo_count_suffix')] toledský koncil."
 council_of_toledo_decision_desc: "Po staletí se v Toledu konaly náboženské koncily, na nichž duchovenstvo z celého křesťanstva řešilo sporné otázky své doby. Svoláním devatenáctého koncilu lze tuto vizigótskou tradici obnovit."
 council_of_toledo_decision_tooltip: "Svolat do Toleda [ROOT.Char.GetFaith.GetReligion.GetAdjective] duchovní"
 council_of_toledo_decision_confirm: "Nastal čas."
 council_of_toledo_decision_toledo_holder_trigger: "[GetTitleByKey('c_toledo').GetName] je pod tvou vládou, přímo nebo prostřednictvím vazala, a místní [Concept('ruler','vládce')|E] vyznává [THIS.Char.GetFaith.GetName]"
 council_of_toledo_decision_toledo_faith_trigger: "[Concept('faith','Víra')|E] je [THIS.Char.GetLiege.GetFaith.GetName]"
 council_of_toledo_decision_catalyst_tt: "Může dojít ke [Concept('struggle_catalyst','katalyzátoru sváru')|E]"
 council_of_toledo_decision_tt: "Odměny závisejí na výsledku koncilu"
 fp2_other_decisions.0700.council: "[SCOPE.ScriptValue('council_of_toledo_counter_value')][ROOT.Char.Custom('get_council_of_toledo_count_suffix')] toledský koncil"
 fp2_other_decisions.0700.t: "$fp2_other_decisions.0700.council$: Organizace"
 fp2_other_decisions.0700.19: "[council_priest.GetTitledFirstName] má na starosti přípravy devatenáctého náboženského koncilu v Toledu, který naváže na dávné vizigótské synody.\n\nOd maurské invaze má [GetTitleByKey('k_papal_state').GetDefinitiveName] stále větší vliv, naše duchovenstvo si však zachovává vlastní tradice a autonomii. Nastal čas znovu připomenout význam Ibérie jako místa náboženského dialogu.\n\nPodle staré tradice mezi účastníky nechybí [ROOT.Char.GetFaith.BishopNeuterPlural] z celého křesťanstva, ale dnes tomu tak být nemusí..."
 fp2_other_decisions.0700.desc: "[ROOT.Char.GetFaith.BishopNeuterPlural] z Ibérie netrpělivě vyhlížejí další koncil už od chvíle, kdy byla toledská tradice obnovena.\n\nPřípravy má na starosti [council_priest.GetCouncilTitleFirstName], stále však zbývá rozhodnout, zda budou pozváni také duchovní jiných tradic."
 fp2_other_decisions.0700.a: "Bude to mozarabský synod."
 fp2_other_decisions.0700.b: "V Toledu jsou vítáni všichni [ROOT.Char.GetFaith.HighGodNamePossessive] služebníci."
 fp2_other_decisions.0700.b.success: "Přijíždějí ekumeničtí biskupové"
 fp2_other_decisions.0700.b.failure: "Výzva z Toleda zůstává bez odezvy"
 fp2_other_decisions.0700.tt: "[SCOPE.ScriptValue('council_of_toledo_counter_value')][THIS.Char.Custom('get_council_of_toledo_count_suffix')] toledský koncil začne za několik týdnů"
 fp2_other_decisions.0701.t: "$fp2_other_decisions.0700.council$: Účastníci"
 fp2_other_decisions.0701.opening.success: "Zdá se, že širší [ROOT.Char.GetFaith.GetReligion.GetAdjective] obec pozvání přijala dobře. [ROOT.Char.GetFaith.AltPriestTermPlural] i [ROOT.Char.GetFaith.BishopNeuterPlural] z cizích zemí nyní ve velkém proudí do Toleda."
 fp2_other_decisions.0701.opening.failure: "Reakce ekumenické obce na naše pozvání je chladná. [ROOT.Char.GetFaith.BishopNeuterPlural] z mnoha míst se odvolávají na špatné počasí, které jim brání dorazit do Toleda, a koncilu se tak účastní jen místní preláti..."
 fp2_other_decisions.0701.opening.catastrophe: "V Toledu není jediný biskup, jáhen ani opat z některého z ostatních [ROOT.Char.GetFaith.GetReligion.GetAdjective] vyznání. Zdá se, že naše ekumenické společenství pohlíží na koncil s opovržením či hněvem, a účastní se ho pouze místní preláti."
 fp2_other_decisions.0701.opening: "Do Toleda dorazila duchovní smetánka. [ROOT.Char.GetFaith.GetAdherentNamePlural] tu mají zastoupena všechna svá biskupství a opatství."
 fp2_other_decisions.0701.religious_head_bishop: "\n\nMezi méně významnými preláty vyniká [portrait_bishop.GetTitledFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], hlava [portrait_bishop.GetFaith.GetAdjective] církve."
 fp2_other_decisions.0701.powerful_bishop: "\n\nZa zmínku stojí zejména [portrait_bishop.GetTitledFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], s mimořádným vlivem mezi [portrait_bishop.GetFaith.GetAdjective] duchovenstvem."
 fp2_other_decisions.0701.saint_bishop: "\n\nÚčastníci mají požehnání mít mezi sebou [portrait_bishop.GetFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], postavu uctívanou jako svatou!"
 fp2_other_decisions.0701.theologian_bishop: "\n\nMezi účastníky je také [portrait_bishop.GetFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], všeobecně uznávaná autorita v teologii."
 fp2_other_decisions.0701.bad_bishop: "\n\nNechybí ani [portrait_bishop.GetFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')]; bezbožnost této postavy je terčem vtipů známých po celém křesťanstvu."
 fp2_other_decisions.0701.senior_bishop: "\n\nNejstarší ze všech duchovních je [portrait_bishop.GetFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')]. Je to [portrait_bishop.GetWomanMan] v úctyhodném věku. "
 fp2_other_decisions.0701.failure: "\n\nObchodníci opevněného města neskrývají zklamání z nízké účasti. Připravili se na příjezd velkého množství duchovních. Škoda."
 fp2_other_decisions.0701.desc: "\n\nOpevněné město už těží z příjezdu duchovních. Hostince i tržiště ožívají a obchodníci si mnou ruce."
 fp2_other_decisions.0701.a: "Výborně."
 fp2_other_decisions.0701.b: "Pýcha předchází pád..."
 fp2_other_decisions.0701.c: "Dobře."
 fp2_other_decisions.0701.tt: "[SCOPE.ScriptValue('council_of_toledo_counter_value')]. toledský koncil začíná"
 fp2_other_decisions.0702.t: "$fp2_other_decisions.0700.council$: Debata"
 fp2_other_decisions.0702.19: "Staletí po posledním koncilu arcibiskupa Gunderika za krále Wittizy obnovuje [council_priest.GetCouncilTitleFirstName] naši tradici zahájením devatenáctého shromáždění v památném Toledu.\n\n"
 fp2_other_decisions.0702.opening: "V Toledu začíná další koncil, který tentokrát zahajuje [council_priest.GetCouncilTitleFirstName].\n\n"
 fp2_other_decisions.0702.present: "\n\nDo konce týdne je zřejmé, že v této otázce získává rozhodující vliv [debate_bishop.GetTitledFirstName] z [debate_bishop.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip], $fp2_other_decisions.0702.closing$"
 fp2_other_decisions.0702.second_hand: "\n\nKdyž se jednání chýlí ke konci, je zřejmé, že hlavní tváří tohoto názoru se stává [debate_bishop.GetTitledFirstName] z [debate_bishop.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip], $fp2_other_decisions.0702.closing$"
 fp2_other_decisions.0702.conversion: "Brzy se prosadilo přesvědčení, že [ROOT.Char.GetFaith.GetAdherentNamePlural] mohou dosáhnout míru a bezpečí jedině obracením kacířů a nevěřících."
 fp2_other_decisions.0702.reform: "Hlavní myšlenkou se stalo, že nyní, když je postavení iberské církve pevné, nastal čas na zásadní reformu a [ROOT.Char.GetFaith.GetAdherentNamePlural] se jí nemají obávat."
 fp2_other_decisions.0702.tolerance: "Jednání ovládla myšlenka, že [ROOT.Char.GetFaith.GetAdherentNamePlural] mají být tolerantnější vůči mírumilovným nevěřícím."
 fp2_other_decisions.0702.rights: "Hlavním tématem je obava o zachování dávných práv [ROOT.Char.GetFaith.GetAdjective] duchovenstva a obnovu kostelů."
 fp2_other_decisions.0702.hof: "Překvapivě se ukázalo, že [ROOT.Char.GetFaith.GetAdherentNamePlural] podle mnoha našich biskupů naléhavě potřebují vlastní duchovní hlavu."
 fp2_other_decisions.0702.pope: "Jednání ovládla vstřícná nálada a mnoho biskupů volá po užší spolupráci našeho společenství s ekumenickými bratry."
 fp2_other_decisions.0702.heresy: "Jednání náhle získalo na naléhavosti, když se otevřela otázka hrozby, kterou představují [heretic_faith.GetAdherentNamePlural], kacíři podobní někdejším priscillianům a ariánům."
 fp2_other_decisions.0702.closing: "zatímco [counter_bishop.GetTitledFirstName|U] z [counter_bishop.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] proti tomu nejostřeji vystupuje."
 fp2_other_decisions.0702.a: "Nemohu než souhlasit."
 fp2_other_decisions.0702.b.hof: "[ROOT.Char.GetFaith.HighGodNamePossessive] vůle to není."
 fp2_other_decisions.0702.b: "Ten hlas umlčíme."
 council_of_toledo_ruler_effect_tt: "Každý [council_toledo_faith.GetAdjective] [Concept('ruler','vládce')|E]"
 fp2_other_decisions.0703.t: "$fp2_other_decisions.0700.council$: Odloženo"
 fp2_other_decisions.0703.war: "S vypuknutím války odkládá [council_priest.GetCouncilTitleFirstName] nadcházející toledský koncil na neurčito."
 fp2_other_decisions.0703.control: "Po ztrátě Toleda již nebude možné nadcházející toledský koncil uspořádat..."
 fp2_other_decisions.0703.desc: "\n\n[ROOT.Char.GetFaith.GetAdherentNamePlural] se z tohoto nezdaru bezpochyby brzy vzpamatují..."
 fp2_other_decisions.0703.a: "To je zklamání."
 fp2_other_decisions.0704.t: "$fp2_other_decisions.0700.council$"
 fp2_other_decisions.0704.success: "\n\n[council_toledo_host.GetTitledFirstName] [Select_CString(council_toledo_host.IsFemale,'poskytla','poskytl')] podporu, díky níž duchovenstvo [ROOT.Char.GetFaith.GetAdherentNamePlural] dokázalo prosadit svůj hlas."
 fp2_other_decisions.0704.failure: "[council_toledo_host.GetTitledFirstName] [Select_CString(council_toledo_host.IsFemale,'měla','měl')] ovšem jiné představy a proti těmto návrhům se důrazně [Select_CString(council_toledo_host.IsFemale,'postavila','postavil')]."
 fp2_other_decisions.0704.a: "Zajímavé."
 council_toledo_landed_desc: "[ROOT.Char.GetTitleAsNameNoTooltip] ([ROOT.Char.GetPrimaryTitle.GetNameNoTier])"
 council_toledo_unlanded_desc: "[Select_CString(ROOT.Char.IsFemale,'Arcibiskupka','Arcibiskup')] [ROOT.Char.GetLiege.GetPrimaryTitle.GetNameNoTier]"
 fp2_council_culture_tt: "Iberské [Concept('cultures','kultury')|E] získají #positive_value [SCOPE.ScriptValue('council_toledo_culture_acceptance_value')|0]#! [Concept('cultural_acceptance','kulturního přijetí')|E] vůči [THIS.Char.GetCulture.GetName] kultuře"
 fp2_council_opinion_mozarabic_effect_tt: "Každý mozarabský účastník"
