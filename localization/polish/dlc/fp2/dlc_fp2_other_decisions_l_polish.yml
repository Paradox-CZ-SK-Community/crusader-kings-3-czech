 fp2_other_decisions.1100.t: "Království Toledu"
 fp2_other_decisions.1100.desc: "S jistotou mé pozice beze zbytku proběhla korunovace v [GetTitleByKey('c_toledo').GetNameNoTier] podle plánu.\n\nJe nejvyšší čas, abychom my [ROOT.Char.GetFaith.GetAdherentNamePlural] vytesali vlastní doménu, odlišnou od malicherných taifa a panství severu; říši, která se vyrovná starému vizigótskému království!"
 fp2_other_decisions.1100.a: "Ať naše království dlouho prosperuje."
 fp2_other_decisions.1101.desc: "Jdouce z jedné síly do druhé, [toledo_former.GetTitledFirstName] [Select_CString(toledo_former.IsFemale,'byla','byl')] formálně [Select_CString(toledo_former.IsFemale,'korunována','korunován')] v [GetTitleByKey('c_toledo').GetNameNoTier].\n\nSíla tohoto nového [toledo_former.GetFaith.GetAdjective] království, které začleňuje země starých dominí Iberie, je nyní nesporná.\n\n"
 fp2_other_decisions.1101.stolen: "S těmito otravnými vetřelci bude třeba jednat dříve než později!"
 fp2_other_decisions.1101.mozarab: "Ač to pro naši víru vypadá dobře, může to být meč se dvěma ostřími..."
 fp2_other_decisions.1101.a: "Nevydrží dlouho!"
 fp2_other_decisions.1101.b: "Něco, co je třeba sledovat."
 fp2_other_decisions.1101.c: "Zajímavé."
 fp2_form_kingdom_toledo_modifier: "$fp2_other_decisions.1100.t$"
 fp2_form_kingdom_toledo_modifier_desc: "Tato postava založila nové království se středem v bývalém vizigótském hlavním městě."
