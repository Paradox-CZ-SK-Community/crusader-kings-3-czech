 found_kingdom_toledo_culture_tt: "Tvá [Concept('culture','kultura')|E] má iberské [Concept('heritage','dědictví')|E]"
 found_kingdom_toledo_faith_tt: "Tvá [Concept('faith','víra')|E] je [GetFaithByKey('mozarabic_church').GetName] nebo z ní vznikla"
 found_kingdom_toledo_duchy_tt: "[Concept('hold','Držíš')|E] a [Concept('completely_control','zcela ovládáš')|E] některé [Concept('duchy','vévodství')|E], které [Concept('de_jure','de iure')|E] sousedí s [GetTitleByKey('d_toledo').GetName] a je součástí [Concept('kingdom','království')|E] s více než dvěma [Concept('de_jure','de iure')|E] [Concept('duchies','vévodstvími')|E]"
 found_kingdom_toledo_capital_tt: "[GetTitleByKey('c_toledo').GetNameNoTier] je tvým [Concept('realm_capital','hlavním sídlem panství')|E]"
 fp2_other_decisions.1100.t: "Toledské království"
 fp2_other_decisions.1100.desc: "O síle mého postavení už nemůže být pochyb a korunovace v Toledu konečně proběhla podle plánu.\n\nNastal čas, aby si [ROOT.Char.GetFaith.GetAdherentNamePlural] vybudovali vlastní panství, odlišné od drobných taif i držav na severu. Panství, které se vyrovná dávnému Vizigótskému království!"
 fp2_other_decisions.1100.a: "Ať naše království dlouho vzkvétá."
 fp2_other_decisions.1101.desc: "Moc [toledo_former.GetTitledFirstName] neustále roste a nyní došlo v Toledu i k formální korunovaci.\n\nO síle tohoto nového [toledo_former.GetFaith.GetAdjective] království, které zahrnuje země někdejších iberských panství, už nemůže být pochyb.\n\n"
 fp2_other_decisions.1101.stolen: "S těmi drzými povýšenci bude třeba skoncovat dříve než později!"
 fp2_other_decisions.1101.mozarab: "Pro naši víru je to dobré znamení, ale může jít o dvousečnou zbraň..."
 fp2_other_decisions.1101.a: "Dlouho nevydrží!"
 fp2_other_decisions.1101.b: "Tohle bude třeba sledovat."
 fp2_other_decisions.1101.c: "Zajímavé."
 fp2_form_kingdom_toledo_modifier: "$fp2_other_decisions.1100.t$"
 fp2_form_kingdom_toledo_modifier_desc: "Tato postava založila nové království s centrem ve starém vizigótském hlavním městě."
