 fp2_secure_mediterranean.desc: "S klíčovými ostrovy po Středomoří zajištěnými a sloužícími jako hlídací věže na moři, je čas nárokovat si vládu nad vlnami."
 fp2_secure_mediterranean.tip: "Nárokovat si kontrolu nad Středomořím"
 secure_iberian_foothold_decision_title: "Iberský opěrný bod"
 secure_iberian_foothold_decision_desc: "Oslabené válčící státy Iberie otevřely poloostrov cizincům. Kdo by se mohl prohlásit novým [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] vůdcem regionu, nebo prostě slavným vetřelcem, mohl by toho mnoho získat."
 secure_iberian_foothold_decision_tooltip: "Připojit část Iberie"
 secure_iberian_foothold_decision_confirm: "Nechť zvítězí nejsilnější."
 fp2_struggle_uninvolved_or_external_tt: "Vaše [capital|E] je mimo [GetGeographicalRegion('world_europe_west_iberia').GetName] [region|E]"
 fp2_struggle_secure_iberian_foothold_empire_tt: "Vy [hold|E] [empire|E] [title|E], který není [GetTitleByKey('e_spain').GetNameNoTier]"
 fp2_struggle_phase_hostility_or_opportunity_tt: "Iberské [struggle_phase|E] je [struggle_phase_iberia_hostility|E] nebo [struggle_phase_iberia_opportunity|E] (Aktuálně: [GetStruggle('iberian_struggle').GetCurrentPhase.GetName])"
 fp2_struggle_secure_iberian_foothold_kingdom_iberian_tt: "Vy [hold|E] a [completely_control|E] [de_jure|E] [kingdom|E] v [GetTitleByKey('e_spain').GetNameNoTier]"
 fp2_struggle_secure_iberian_foothold_kingdom_faith_tt: "Alespoň #Z [SCOPE.ScriptValue('fp2_struggle_secure_iberian_foothold_faith_target_percent_value')|0]%#! z těchto [titlepossessive|E] [de_jure|E] [counties|E] jsou [THIS.Char.GetFaith.GetAdjective]"
 fp2_struggle_secure_iberian_foothold_kingdom_border_tt: "Tento [title|E] hraničí s drženým [de_jure|E] [kingdom|E] v [empire|E], který Vy [hold|E] a který není [GetTitleByKey('e_spain').GetNameNoTier]"
 fp2_struggle_secure_iberian_foothold_kingdom_held_tt: "Tento [title|E] držíte alespoň [SCOPE.ScriptValue('fp2_struggle_secure_iberian_foothold_years_value')|0Z] let"
 fp2_struggle_secure_iberian_foothold_religion_tt: "Vy [hold|E] alespoň #Z [SCOPE.ScriptValue('fp2_struggle_secure_iberian_foothold_religion_target_percent_value')|0]%#! z [THIS.Char.GetFaith.GetReligion.GetAdjective] [faith|E] [counties|E] v [GetGeographicalRegion('world_europe_west_iberia').GetName] [region|E] (Aktuálně: [SCOPE.ScriptValue('fp2_struggle_secure_iberian_foothold_religion_percent_value')|1]%)\n"
 fp2_struggle_secure_iberian_foothold_outsider_tt: "Vy [hold|E] alespoň #Z [SCOPE.ScriptValue('fp2_struggle_secure_iberian_foothold_outsider_target_percent_value')|0]%#! z [counties|E] v [GetGeographicalRegion('world_europe_west_iberia').GetName] [region|E] (Aktuálně: [SCOPE.ScriptValue('fp2_struggle_secure_iberian_foothold_outsider_percent_value')|0]%)\n"
 fp2_struggle_secure_iberian_foothold_empire_held_effect_tt: "Každé [de_jure|E] [kingdom|E] [GetTitleByKey('e_spain').GetNameNoTier], které splní níže uvedené podmínky, se stane [de_jure|E] součástí [THIS.Char.GetPrimaryTitle.GetNameNoTier]"
 fp2_struggle_secure_iberian_foothold_empire_dejure_effect_tt: "Každé [de_jure|E] [kingdom|E] [GetTitleByKey('e_spain').GetNameNoTier], které splní níže uvedené podmínky, se stane [de_jure|E] součástí [empire|E] [THIS.Char.GetPrimaryTitle.GetDeJureLiege.GetNameNoTier]"
 fp2_struggle_secure_iberian_foothold_ends_the_struggle_tt: "[iberian_struggle|E] končí"
 iberian_footholder_transfer_tt: "[THIS] [THIS.Title.GetName] [THIS.GetName]"
 fp2_other_decisions.1000.t: "$secure_iberian_foothold_decision_title$: [iberian_footholder.GetPrimaryTitle.GetAdjectiveNoTooltip] Konsolidace"
 fp2_other_decisions.1000.involved_religion: "Války rozhádaných knížectví Iberie téměř přivedly [ROOT.Char.GetFaith.GetReligion.GetAdjective] panství regionu na kolena.\n\nBez našeho zásahu by [ROOT.Char.GetFaith.HighGodNamePossessive] věrní byli nakonec vytlačeni z poloostrova panovačnými nevěřícími.\n\n"
 fp2_other_decisions.1000.desc: "Rozdělené víry a národy Iberie nám poskytly velkou příležitost; byly příliš zaneprázdněné boji mezi sebou na to, aby odolaly [ROOT.Char.GetFaith.GetReligion.GetAdjective] invazi na poloostrov."
 fp2_other_decisions.1000.involved_faith: "Jsme legitimními obránci [ROOT.Char.GetFaith.GetAdherentNamePlural] západu, nyní v bezpečí pod ochranou [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]."
 fp2_other_decisions.1000.uninvolved_faith: "Spadlo na nás přinést světlo [ROOT.Char.GetFaith.GetName]; jako součást [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] budou tyto země opět prosperovat a žít v míru."
 fp2_other_decisions.1000.closing: "\n\nČasem uvidí, že doba jejich falešných bohů skončila, a budou se radovat, že [ROOT.Char.GetFaith.HighGodName] vedl [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] k záchraně regionu."
 fp2_other_decisions.1000.a: "Iberii byla zapotřebí nová krev."
 fp2_other_decisions.1001.involved_religion: "Po staletích válek mezi iberskými křesťany a Mauři byla naše bitva nyní zneužita panovačnými [iberian_footholder.GetPrimaryTitle.GetAdjective] vetřelci.\n\n"
 fp2_other_decisions.1001.desc: "Rozptýlením, závistí a nedbalostí jsme my Iberové dovolili [iberian_footholder.GetPrimaryTitle.GetAdjective] vetřelcům využít rozdělení naší vlasti a vpadnout do historických království poloostrova."
 fp2_other_decisions.1001.involved_faith: "[iberian_footholder.GetTitledFirstName] [Select_CString(iberian_footholder.IsFemale,'prohlásila','prohlásil')] [iberian_footholder.GetHerselfHimself] legitimním [iberian_footholder.GetFaith.GetAdjectiveNoTooltip] vůdcem poloostrova a používá [iberian_footholder.GetHerHis] vítězství jako důkaz [iberian_footholder.GetHerHis] nároku nad ochablými [iberian_footholder.GetFaith.GetReligion.GetAdjective] panstvími Iberie."
 fp2_other_decisions.1001.same_uninvolved_faith: "Tvrdí, že naše neúspěchy jsou [ROOT.Char.GetFaith.HighGodNamePossessive] trestem za odklon od správné cesty [iberian_footholder.GetFaith.GetName], a že [iberian_footholder.GetTitledFirstName] je legitimním vůdcem [ROOT.Char.GetFaith.GetReligion.GetAdjective] Iberie..."
 fp2_other_decisions.1001.uninvolved_faith: "S [iberian_footholder.GetHerHis] vítězstvími jako důkazem [Select_CString(ROOT.Char.IsFemale,'prohlásila','prohlásil')] [iberian_footholder.GetTitledFirstName] svou [iberian_footholder.GetFaith.GetAdjective] víru za pravou [iberian_footholder.GetFaith.GetReligion.GetAdjective] cestu; cestu, která sjednotí celý poloostrov pod [iberian_footholder.GetFaith.HighGodName]."
 fp2_other_decisions.1001.closing: "\n\nJak [iberian_footholder.GetTitledFirstName] konsoliduje [iberian_footholder.GetHerHis] državy, minulé rozdíly mezi muslimy a křesťany blednou ve srovnání s touto [iberian_footholder.GetFaith.GetAdjective] okupací..."
 fp2_other_decisions.1001.a: "Zatracení vetřelci."
 council_of_toledo_decision_title: "Svolat koncil v Toledu"
 council_of_toledo_decision_desc_count: "Nastane čas svolat [SCOPE.ScriptValue('council_of_toledo_counter_value')][ROOT.Char.Custom('get_council_of_toledo_count_suffix')] koncil v [GetTitleByKey('c_toledo').GetNameNoTier] a znovu projednat náboženské otázky [ROOT.Char.GetFaith.GetAdherentNamePlural]."
 council_of_toledo_decision_desc: "Po staletí se v [GetTitleByKey('c_toledo').GetNameNoTier] konaly náboženské koncily, kde duchovenstvo z celé křesťanské říše řešilo sporné otázky doby. Uspořádáním devatenáctého koncilu může být tato vizigótská tradice obnovena."
 council_of_toledo_decision_tooltip: "Uspořádat shromáždění [ROOT.Char.GetFaith.GetReligion.GetAdjective] duchovních v Toledu"
 council_of_toledo_decision_confirm: "Je čas."
 council_of_toledo_decision_toledo_holder_trigger: "Vy [hold|E] nebo vládnete nad [GetTitleByKey('c_toledo').GetName], a jeho [ruler|E] je vyznání [THIS.Char.GetFaith.GetName]"
 council_of_toledo_decision_toledo_faith_trigger: "[faith|E] je [THIS.Char.GetLiege.GetFaith.GetName]"
 council_of_toledo_decision_catalyst_tt: "Může nastat [struggle_catalyst|E]"
 council_of_toledo_decision_tt: "Odměny závisí na výsledku koncilu"
 fp2_other_decisions.0700.council: "[SCOPE.ScriptValue('council_of_toledo_counter_value')][ROOT.Char.Custom('get_council_of_toledo_count_suffix')] koncil v Toledu"
 fp2_other_decisions.0700.t: "$fp2_other_decisions.0700.council$: Organizace"
 fp2_other_decisions.0700.19: "[council_priest.GetTitledFirstName] zahájil přípravy na devatenáctý náboženský koncil v [GetTitleByKey('c_toledo').GetNameNoTier], aby se vyrovnal starým vizigótským synodám.\n\nAčkoli dosah [GetTitleByKey('k_papal_state').GetDefinitiveName] od doby maurské invaze vzrostl, naše duchovenstvo si stále uchovává vlastní tradici a autonomii. Je čas znovu zdůraznit význam Iberie jako místa náboženského dialogu.\n\nPředchozí shromáždění zahrnovala [ROOT.Char.GetFaith.BishopNeuterPlural] z celé křesťanské říše, ale to už nemusí být nutné..."
 fp2_other_decisions.0700.desc: " [ROOT.Char.GetFaith.BishopNeuterPlural] Iberie netrpělivě očekávali další koncil od doby, kdy byla tradice v Toledu obnovena.\n\n[council_priest.GetCouncilTitleFirstName] zahájil přípravy, přesto je třeba rozhodnout, zda budou pozváni i kněží z jiných tradic."
 fp2_other_decisions.0700.a: "Bude to mozarábský synod."
 fp2_other_decisions.0700.b: "Všichni ministři [ROOT.Char.GetFaith.HighGodNamePossessive] jsou v Toledu vítáni."
 fp2_other_decisions.0700.b.success: "Účast ekumenických biskupů"
 fp2_other_decisions.0700.b.failure: "Výzva do Toledu je ignorována"
 fp2_other_decisions.0700.tt: "[SCOPE.ScriptValue('council_of_toledo_counter_value')][THIS.Char.Custom('get_council_of_toledo_count_suffix')] koncil v Toledu začne za několik týdnů"
 fp2_other_decisions.0701.t: "$fp2_other_decisions.0700.council$: Účastníci"
 fp2_other_decisions.0701.opening.success: "Zdá se, že pozvání širšímu okruhu [ROOT.Char.GetFaith.GetReligion.GetAdjective] [ROOT.Char.GetFaith.BishopNeuterPlural] bylo přijato pozitivně; mnoho vážených [ROOT.Char.GetFaith.BishopNeuterPlural] ze zahraničí se s nadšením sjelo do [GetTitleByKey('c_toledo').GetNameNoTier]."
 fp2_other_decisions.0701.opening.failure: "Odezva na naše pozvání ekumenické obce byla chladná; mnozí [ROOT.Char.GetFaith.BishopNeuterPlural] uvedli špatné počasí bránící jim v dosažení [GetTitleByKey('c_toledo').GetNameNoTier], takže přítomni byli jen místní prelátové...."
 fp2_other_decisions.0701.opening.catastrophe: "Neviděli jsme ani jednoho biskupa, jáhna nebo opata z jiných [ROOT.Char.GetFaith.GetReligion.GetAdjective] denominací v [GetTitleByKey('c_toledo').GetNameNoTier]; zdá se, že náš koncil je našimi ekumenickými bratry vnímán s pohrdáním nebo hněvem a přítomni jsou pouze místní prelátové."
 fp2_other_decisions.0701.opening: "Velcí a významní sestoupili do [GetTitleByKey('c_toledo').GetNameNoTier], zastupujíce všechna biskupství a opatsví [ROOT.Char.GetFaith.GetAdherentNamePlural]."
 fp2_other_decisions.0701.religious_head_bishop: "\n\nMezi prostými preláty je [portrait_bishop.GetTitledFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], hlava [portrait_bishop.GetFaith.GetAdjective] církve."
 fp2_other_decisions.0701.powerful_bishop: "\n\nMožná nejvýznamnější z nich je [portrait_bishop.GetTitledFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], [portrait_bishop.GetFaith.GetAdjective] prelát velikého vlivu."
 fp2_other_decisions.0701.saint_bishop: "\n\nÚčastníci mají štěstí, že mezi nimi je [portrait_bishop.GetFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], [portrait_bishop.GetFaith.GetAdjective] světec!"
 fp2_other_decisions.0701.theologian_bishop: "\n\nZvláště mezi nimi je [portrait_bishop.GetFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], široce respektovaný [portrait_bishop.GetFaith.GetAdjective] teolog."
 fp2_other_decisions.0701.bad_bishop: "\n\nJeden z nejznámějších je [portrait_bishop.GetFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], jehož bezbožnost je terčem vtipů po celé křesťanské říši."
 fp2_other_decisions.0701.senior_bishop: "\n\nNejváženějším ze všech je [portrait_bishop.GetFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], vážený [portrait_bishop.GetWomanMan] v rouše. "
 fp2_other_decisions.0701.failure: "\n\nMěstští obchodníci jsou zklamáni nízkou účastí, připravovali se na návštěvu velkého počtu duchovních. Škoda."
 fp2_other_decisions.0701.desc: "\n\nMěsto za zdmi již pociťuje přínosy návštěv duchovních; obchod a pohostinnost přitahují kupce."
 fp2_other_decisions.0701.a: "Vynikající."
 fp2_other_decisions.0701.b: "Pýcha..."
 fp2_other_decisions.0701.c: "Dobře."
 fp2_other_decisions.0701.tt: "[SCOPE.ScriptValue('council_of_toledo_counter_value')][THIS.Char.Custom('get_council_of_toledo_count_suffix')] koncil v Toledu začíná"
 fp2_other_decisions.0702.t: "$fp2_other_decisions.0700.council$: Diskuse"
 fp2_other_decisions.0702.19: "Staletí po posledním koncilu arcibiskupa Gundrica za vlády krále Wittizy, [council_priest.GetCouncilTitleFirstName] obnovil naši tradici otevřením devatenáctého shromáždění v proslulém [GetTitleByKey('c_toledo').GetNameNoTier].\n\n"
 fp2_other_decisions.0702.opening: "Další koncil začal v [GetTitleByKey('c_toledo').GetNameNoTier], tentokrát jej otevřel [council_priest.GetCouncilTitleFirstName].\n\n"
 fp2_other_decisions.0702.present: "\n\nNa konci týdne bylo rychle zřejmé, že [debate_bishop.GetTitledFirstName] z [debate_bishop.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] měl v této záležitosti pozornost sálu, $fp2_other_decisions.0702.closing$"
 fp2_other_decisions.0702.second_hand: "\n\nKdyž se jednání chýlí ke konci, je jasné, že [debate_bishop.GetTitledFirstName] z [debate_bishop.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] je vnímán jako vůdce tohoto názoru, $fp2_other_decisions.0702.closing$"
 fp2_other_decisions.0702.conversion: "Hlavní téma, že konverze kacírů a nevěřících je jediný způsob, jak zajistit mír a ochránit [ROOT.Char.GetFaith.GetAdherentNamePlural], rychle vystoupilo na povrch."
 fp2_other_decisions.0702.reform: "Hlavním tématem bylo, že by se [ROOT.Char.GetFaith.GetAdherentNamePlural] neměli bát velkých reforem, nyní když je postavení iberské církve zajištěno."
 fp2_other_decisions.0702.tolerance: "Převládajícím tématem bylo, že by [ROOT.Char.GetFaith.GetAdherentNamePlural] měli být tolerantnější k pokojně žijícím nevěřícím, myšlenka, která se rychle stala středem jednání."
 fp2_other_decisions.0702.rights: "Hlavním tématem byla obava o zachování starých práv [ROOT.Char.GetFaith.GetAdjective] duchovenstva a opravy kostelů."
 fp2_other_decisions.0702.hof: "Překvapivě, pocit, že [ROOT.Char.GetFaith.GetAdherentNamePlural] potřebují svého vlastního duchovního vůdce, [Select_CString(ROOT.Char.IsFemale,'byla','byl')] nejpalčivějším problémem mnoha našich biskupů."
 fp2_other_decisions.0702.pope: "Vznikla nálada spolupráce; mnoho biskupů prosazovalo větší spolupráci mezi [ROOT.Char.GetFaith.GetAdherentNamePlural] a jejich ekumenickými bratry."
 fp2_other_decisions.0702.heresy: "Jednání pohltila naléhavá energie, když byla nastolena hrozba představovaná [heretic_faith.GetAdherentNamePlural], kacíři jako priscilliané a ariáni minulosti."
 fp2_other_decisions.0702.closing: "zatímco [counter_bishop.GetTitledFirstName|U] z [counter_bishop.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] nejdůrazněji oponoval [debate_bishop.GetHerHis] argumentům."
 fp2_other_decisions.0702.a: "Nemohu souhlasit více."
 fp2_other_decisions.0702.b.hof: "To není vůle [ROOT.Char.GetFaith.HighGodNamePossessive]."
 fp2_other_decisions.0702.b: "Bude [Select_CString(debate_bishop.IsFemale,'přehlušena','přehlušen')]."
 council_of_toledo_ruler_effect_tt: "Každý [council_toledo_faith.GetAdjective] [ruler|E]"
 fp2_other_decisions.0703.t: "$fp2_other_decisions.0700.council$: Odloženo"
 fp2_other_decisions.0703.war: "S nástupem války [council_priest.GetCouncilTitleFirstName] dočasně odložil nadcházející koncil v Toledu."
 fp2_other_decisions.0703.control: "Se ztrátou [GetTitleByKey('c_toledo').GetNameNoTier] již nebude možné hostit nadcházející koncil v Toledu..."
 fp2_other_decisions.0703.desc: "\n\n[ROOT.Char.GetFaith.GetAdherentNamePlural] se z tohoto neúspěchu nepochybně brzy vzpamatují..."
 fp2_other_decisions.0703.a: "Zklamání."
 fp2_other_decisions.0704.t: "Tento $fp2_other_decisions.0700.council$"
 fp2_other_decisions.0704.success: "\n\nS podporou [council_toledo_host.GetTitledFirstNamePossessive] se duchovenstvo [ROOT.Char.GetFaith.GetAdherentNamePlural] prosadilo."
 fp2_other_decisions.0704.failure: "Zdá se, že [council_toledo_host.GetTitledFirstName] měl jiné záměry a důrazně proti těmto návrhům loboval."
 fp2_other_decisions.0704.a: "Zajímavé."
