l_polish:
 clan_event.2000.t: "Učení za pochodu"
 clan_event.2000.desc: "Zdá se, že [Select_CString(improved_tax_collector.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('improved_tax_collector'))|l] [improved_tax_collector.GetName] odvádí v poslední době mimořádně dobrou práci. Naskytla se mi tak příležitost výrazně ovlivnit a usměrnit [Select_CString(improved_tax_collector.IsFemale,'její','jeho')] další působení.\n\nMožná je to zároveň příležitost, jak [Select_CString(improved_tax_collector.IsFemale,'jí','mu')] pomoci ještě více zdokonalit své schopnosti?"
 clan_event.2000.a: "Věnuj se potřebám lidu."
 clan_event.2000.b: "Zorganizuj hlídky stráží. #EMP To#! udrží vazaly na uzdě."
 clan_event.2000.c: "Veď si pečlivé účetní knihy a uspořádej si práci."
 clan_event.2000.d: "Špehuj mé poddané. Když budeš mít oči otevřené, dozvíš se mnohé."
 clan_event.2000.d.tt: "Pokud některý z vazalů, od nichž [improved_tax_collector.GetName] vybírá daně, skrývá dosud neodhalené tajemství, dozvíš se o něm"
 clan_event.2000.e1: "Věnuj svůj čas učenému bádání."
 clan_event.2000.e2: "Věnuj se otázkám víry. [ROOT.Char.GetFaith.HighGodName] stojí nade všemi."
 clan_event.2000.option_f: "Tvým úkolem je vybírat daně, ne? Tak mi je #EMP vybírej#!!"
 clan_event.2000.g: "Na svých cestách o mně mluv v dobrém."
 clan_event.2000.a.success: "[improved_tax_collector.GetNameNoTooltip|U] [Select_CString(improved_tax_collector.IsFemale,'potěšila','potěšil')|l] vazaly"
 clan_event.2000.b.success: "[improved_tax_collector.GetNameNoTooltip|U] [Select_CString(improved_tax_collector.IsFemale,'zneklidnila','zneklidnil')|l] vazaly"
 clan_event.2000.c.success: "[improved_tax_collector.GetNameNoTooltip|U] [Select_CString(improved_tax_collector.IsFemale,'zlepšila','zlepšil')|l] výběr daní"
 clan_event.2000.d.success: "[improved_tax_collector.GetNameNoTooltip|U] [Select_CString(improved_tax_collector.IsFemale,'odhalila','odhalil')|l] tajemství"
 every_taxed_vassal_tt: "Každý [Concept('taxpayer','poplatník')|E] přidělený [tax_collector_name.Custom('CZ_Name_D')]"
 clan_event.2001.t: "Daně jako škola"
 clan_event.2001.opening_desc: "Zdá se, že [educational_tax_collector.GetName] se při vybírání daní lecčemu [Select_CString(educational_tax_collector.IsFemale,'přiučila','přiučil')]. Je to ostatně patrné, když začne vyprávět o svých posledních zkušenostech.\n\n"
 clan_event.2001.education_diplomacy: "„...a celou tu záležitost se mi podařilo vyřešit pouhými slovy! Ach, to nádherné umění diplomacie!“"
 clan_event.2001.education_martial: "„...ale doprovodné vojáky se mi podařilo výborně využít. Postarali se, abychom vybrali každou minci, kterou vám ti lidé dlužili, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]!“"
 clan_event.2001.education_stewardship: "„...a ukázalo se, že se mi #EMP opravdu#! vyplácí vést tak podrobné záznamy. Odteď budu účetní knihy nosit stále s sebou.“"
 clan_event.2001.education_intrigue: "„...po několika zastřených hrozbách konečně zaplatili a já jsem se [Select_CString(educational_tax_collector.IsFemale,'mohla','mohl')] vydat dál. Jen si říkám, jestli si při příští návštěvě nebudu muset hlídat záda...“"
 clan_event.2001.education_learning: "„...a nakonec se z toho vyklubala docela vášnivá debata. Díky lepším argumentům jsem samozřejmě [Select_CString(educational_tax_collector.IsFemale,'zvítězila','zvítězil')]. Nakonec dokonce zaplatili posledních pár mincí #EMP s radostí#!!“"
 clan_event.2001.a: "Daně jsou přece prospěšné nám oběma!"
 clan_event.2001.b: "To přece dokážeš ještě lépe!"
 clan_event.2001.success: "Zlepšila se dovednost [educational_tax_collector.Custom('CZ_NameNoTooltip_G')]"
 clan_event.2002.t: "Přepracovaný výběrčí daní"
 clan_event.2002.desc: "Je už pozdě, ale z vedlejší místnosti prosvítá škvírou pootevřených dveří slabé světlo. Opatrně dveře otevřu a spatřím [Select_CString(troubled_tax_collector.IsFemale,'svou','svého')] [ROOT.Char.Custom2('CZ_RelationToMeShort_A', SCOPE.sC('troubled_tax_collector'))] [troubled_tax_collector.Custom('CZ_Name_A')], jak s unavenýma očima sedí [Select_CString(troubled_tax_collector.IsFemale,'skloněná','skloněný')] nad otevřenou účetní knihou. Vedle [Select_CString(troubled_tax_collector.IsFemale,'ní','něj')] se vrší další stoh účetních knih.\n\nZvedne hlavu, všimne si mě a promluví: „Ach, odpusťte mi, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')], ale ještě musím projít poslední daňové záznamy...“"
 clan_event.2002.a: "Dovol, abych ti [Select_CString(ROOT.Char.IsFemale,'pomohla','pomohl')]!"
 clan_event.2002.b: "Proč si trochu neodpočineš?"
 clan_event.2002.c: "Dobře. Moji vazalové #EMP očekávají#!, že se jejich daně budou vybírat bez průtahů..."
 clan_event.2005.t: "Nabídka náhradníka"
 clan_event.2005.desc: "Na mém dvoře se nečekaně objeví [Select_CString(loyal_vassal.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('loyal_vassal'))|l], [loyal_vassal.GetName]. Těsně za [Select_CString(loyal_vassal.IsFemale,'ní','ním')] kráčí [tax_collector_replacement.GetWomanMan|l].\n\n„[Select_CString(ROOT.Char.IsFemale,'Vznešená','Vznešený')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|l]! Neuniklo mi, že váš výběrčí daní [bad_tax_collector.GetName] tak trochu... #EMP postrádá#! schopnosti potřebné k řádnému výkonu své práce. Proto vám přivádím dar.“\n\n[loyal_vassal.GetFirstNameNoTooltip|U] ukáže na osobu, která [Select_CString(loyal_vassal.IsFemale,'ji','ho')] doprovází. „[tax_collector_replacement.GetName] vám bude skvěle sloužit.“"
 clan_event.2005.a: "To je dar, kterého si nesmírně vážím!"
 clan_event.2005.b: "Svého služebníka si nech. Tvá věrnost mi stačí."
 clan_event.2005.c: "[bad_tax_collector.GetNameNoTooltip|U] se prostě bude muset víc snažit..."
 clan_event.2007.t: "Potíže s účetní knihou"
 clan_event.2007.desc: "Už celé hodiny zírám do té zatracené účetní knihy. Čísla #EMP očividně#! nesedí, ale pořád nemohu přijít na to, kde je chyba...\n\nNajednou si všimnu, že mi přes rameno nahlíží [Select_CString(helping_tax_collector.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('helping_tax_collector'))|l], [helping_tax_collector.GetName], a prohlíží si účetní knihu přede mnou. [helping_tax_collector.GetFirstNameNoTooltip|U] poklepe prstem na horní část stránky.\n\n„Možná by bylo nejlepší začít tady, [ROOT.Char.Custom('FormOfAddressForLiege')|l].“"
 clan_event.2007.a: "Ehm... Nemohl[Select_CString(helping_tax_collector.IsFemale,'a','')] bys mi s tím pomoci?"
 clan_event.2007.b: "Poradím si s tím [Select_CString(ROOT.Char.IsFemale,'sama','sám')], děkuji pěkně."
 clan_event.2007.c: "Počkat, právě ses [Select_CString(helping_tax_collector.IsFemale,'nabídla','nabídl')], že se o to postaráš? Děkuji!"
 clan_event.2007.success_tt: "Podaří se ti najít chybu v účetní knize"
 clan_event.2007.success: "Úspěšně uspořádáš účetní záznamy"
 clan_event.2007.failure_tt: "Nepodaří se ti v účetních záznamech vyznat"
 clan_event.2007.failure: "Účetní kniha zůstane nepřehledným chaosem"
 clan_event.2007.tt: "#weak [helping_tax_collector.GetName|U] odhalí v účetní knize další nesrovnalosti a zjistí, že ti několik drobných vlastníků půdy dluží daně.#!"
 clan_event.2007.successful_tax_collector: "[helping_tax_collector.GetName|U] [Select_CString(helping_tax_collector.IsFemale,'vybrala','vybral')|l] dlužné daně"
 fp3_efficient_tax_collector: "Zdatný výběrčí daní"
 fp3_efficient_tax_collector_desc: "Výběrčí daní ve službách této postavy vyniká svými schopnostmi a při hledání dalších mincí nenechá kámen na kameni."
 fp3_outrageous_tax_collection_opinion: "Pobouření kvůli daním"
 fp3_diplomatic_tax_collection_opinion: "Spokojenost s [Concept('tax_collector','výběrčím daní')|E]"
 fp3_thankful_tax_collector_opinion: "Vděčnost"
