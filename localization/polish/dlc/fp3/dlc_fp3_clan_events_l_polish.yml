l_polish:
 fp3_clan.8000.t: "Lichva proti svornosti"
 fp3_clan.8000.desc: "[concerned_one.GetName|U] ke mně přichází se znepokojeným výrazem. „Doslechl[Select_CString(concerned_one.IsFemale,'a','')], že [usurer.GetTitledFirstName] půjčuje peníze dvořanům ve finanční tísni a vydělává na jejich neštěstí prostřednictvím přemrštěných úroků. Všichni [Select_CString(usurer.IsFemale,'ji označují za lichvářku, která se musí zodpovídat ze svých činů','ho označují za lichváře, který se musí zodpovídat ze svých činů')|l].“\n\nKdyž s tímto obviněním konfrontuji [usurer.Custom('CZ_TitledFirstName_A')], [Select_CString(usurer.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('usurer'))|l] se rozhořčeně ohradí. „To je odporné nařčení! Je pravda, že mě několik přátel požádalo o finanční pomoc, ale [Select_CString(usurer.IsFemale,'neměla','neměl')|l] jsem žádné nekalé úmysly ani jsem nepožadoval[Select_CString(usurer.IsFemale,'a','')|l] víc, než mi právem náleželo.\n\n[concerned_one.GetTitledFirstNameNoTooltip|U] mi ve skutečnosti dluží peníze. Proto se do této záležitosti vůbec plete!“"
 fp3_clan.8000.a: "Pobyt v žaláři tě napraví, [usurer.Custom('CZ_FirstName_V')]."
 fp3_clan.8000.b: "Poděl se o své nepoctivě získané peníze a můžeme na všechno zapomenout."
 fp3_clan.8000.c: "To si musíte vyřešit mezi sebou."
 fp3_relations_reaction_to_imprisonment.tt: "Členové klanu a vazalové, kteří mají rádi [usurer.Custom('CZ_TitledFirstNameNoTooltip_A')], na to zareagují negativně."
 fp3_clan.8001.t: "Klanová rozepře"
 fp3_clan.8001_beginning: "[bickerer_1.GetTitledFirstName|U] a [bickerer_2.GetTitledFirstName] se nedávno pohádali během soukromé oslavy. Oba teď trvají na tom, abych se do jejich sporu vložil a postavil se na jejich stranu."
 fp3_clan.8001_faith_schism: "Zdá se, že jejich spor rozpoutala vášnivá debata o tom, jakou povahu [bickerer_1.GetFaith.PantheonTerm|l] [bickerer_1.GetFaith.PantheonTermHasHave|l].\n\n„[bickerer_1.GetFirstNameNoTooltip|U] zastává #EMP velmi#! pochybné názory,“ tvrdí [bickerer_2.GetFirstNameNoTooltip]. „Na tvém místě by už [bickerer_1.GetFirstNameNoTooltip] u dvora [Select_CString(bickerer_1.IsFemale,'neměla','neměl')|l] co pohledávat!“\n\n„Ušetřím tě nechutných podrobností o takzvaných argumentech [bickerer_2.Custom('CZ_FirstNameNoTooltip_G')],“ namítne [bickerer_1.GetFirstNameNoTooltip], „ale věř mi, #EMP já#! tu nejsem [Select_CString(bickerer_1.IsFemale,'tou bezbožnou','tím bezbožným')|l]...“"
 fp3_clan.8001_generic_fallback: "Ačkoli není úplně jasné, co se mezi nimi stalo, oba mi s velkým zápalem líčí, co si o tom druhém myslí.\n\n„[bickerer_2.GetFirstNameNoTooltip|U] je [Select_CString(bickerer_2.IsFemale,'obyčejná natvrdlá venkovanka','obyčejný nevychovaný buran')|l], nic víc,“ prohlašuje [bickerer_1.GetFirstNameNoTooltip].\n\n„Drž hubu, [bickerer_1.Custom2('CZ_InsultNoun_V', SCOPE.sC('bickerer_2'))|l]!“ zavrčí [bickerer_2.GetFirstNameNoTooltip].\n\nPokusit se je usmířit mi v tuto chvíli připadá jako marná práce. Obávám se však, že bez mého zásahu se jejich spor jen vyhrotí."
 fp3_clan.8001.a: "V zájmu všech je načase tuto rozepři ukončit."
 fp3_clan.8001.b: "[bickerer_1.GetFirstNameNoTooltip|U] má vlastně v něčem pravdu..."
 fp3_clan.8001.c: "Mám na práci něco důležitějšího... někde jinde."
 fp3_clan.8001.d: "Mě do toho netahejte."
 fp3_clan_making_conflict_worse_flavor: "Pokusíš se prohloubit rozkol mezi [bickerer_1.Custom('CZ_FirstNameNoTooltip_I')] a [bickerer_2.Custom('CZ_FirstNameNoTooltip_I')]."
 fp3_clan.8001.b.success: "Nalétnou na tvou manipulaci"
 fp3_clan.8001.b.failure: "Prohlédnou tvou lest"
 fp3_clan.8001.b.success.tt: "Vyvoláš rozkol v klanu"
 fp3_clan.8001.b.failure.tt: "Nepodaří se ti zasít rozkol"
 fp3_clan.8001.a.success: "Úspěšně urovnáš jejich spor"
 fp3_clan.8001.a.success.tt: "Tvé zprostředkování uspěje"
 fp3_clan.8001.a.failure: "Situaci jen zhoršíš"
 fp3_clan.8001.a.failure.tt: "Tvé zprostředkování selže"
 fp3_clan.8002.t: "Pouta víry"
 fp3_clan.8002.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ pronese znepokojeně [chaplain.GetCouncilTitle|l] [chaplain.GetFirstName], „musíme si promluvit o duchovních záležitostech.“ Na okamžik se odmlčí, aby se ujistil[Select_CString(chaplain.IsFemale,'a','')|l], že jsme o samotě.\n\n„[Select_CString(chaplain.IsFemale,'Zaslechla','Zaslechl')|U] jsem, jak [clan_member.GetName] pomlouvá tvou zbožnost. Tvrdí, že na bohoslužby chodíš jen zřídka a že [ROOT.Char.GetFaith.HouseOfWorship|l] tvou návštěvu zažívá jen výjimečně.\n\nNetroufám si soudit, jaký je tvůj osobní vztah k božství. [ROOT.Char.GetTitleTierName|U] však musí dbát i na to, jak jej vnímají poddaní. Záleží především na tom, za jak zbožnou osobu tě #EMP považují#!.“"
 fp3_clan.8002.a: "Možná jsem skutečně [Select_CString(ROOT.Char.IsFemale,'pochybila a zanedbala','pochybil a zanedbal')|l] své povinnosti..."
 fp3_clan.8002.b: "Místní [ROOT.Char.GetFaith.HouseOfWorship|l] ode mě dostane dar."
 fp3_clan.8002.c: "Ať si ti důvěřiví hlupáci #EMP myslí#!, že mi na tom záleží..."
 fp3_clan.8002.d: "[clan_member.GetFirstNameNoTooltip|U], říkáš? Za to si [Select_CString(clan_member.IsFemale,'její','jeho')|l] jazyk nechám vyříznout..."
 fp3_clan.8002.e: "O své zbožnosti nemusím nikomu lhát."
 fp3_pretending_to_be_pious_flavor: "[ROOT.Char.GetFaith.HouseOfWorship|U] je nyní místem, kde trávíš více času – nebo o tom alespoň všechny přesvědčíš."
 fp3_clan.8002.b.success: "Tvůj klam uspěje"
 fp3_clan.8002.b.failure: "Nikoho neoklameš"
 fp3_clan.8002.b.success.tt: "Tvou zbožnost nebude možné zpochybnit"
 fp3_clan.8002.b.failure.tt: "Tvá předstíraná zbožnost bude odhalena"
 fp3_clan.8003.t: "Síla jména"
 fp3_clan.8003_fear_opening: "„[ROOT.Char.GetName|U], mezi lidmi jsi dosáhl[Select_CString(ROOT.Char.IsFemale,'a','')|l] velikosti. [ROOT.Char.Custom('LevyMenWomen')|U] tě ctí a tvé skutky i jméno vzbuzují úctu... a strach.“\n\nVyslanec [righteous_caliph.Custom('CZ_TitledFirstName_G')], [hof_emissary.GetFirstName], se na okamžik nervózně odmlčí.\n\n"
 fp3_clan.8003_respect_opening: "„[ROOT.Char.GetName|U], mezi lidmi jsi dosáhl[Select_CString(ROOT.Char.IsFemale,'a','')|l] velikosti. [ROOT.Char.Custom('LevyMenWomen')|U] tě ctí a tvé skutky i tvůj rod si vysloužily všeobecnou úctu a uznání.“\n\nVyslanec [righteous_caliph.Custom('CZ_TitledFirstName_G')], [hof_emissary.GetFirstName], se slavnostně odmlčí.\n\n"
 fp3_clan.8003_ending: "„Taková jsou slova, která pronesl [righteous_caliph.GetTitleTierName|l],“ pokračuje [hof_emissary.GetFirstNameNoTooltip]. „[Select_CString(righteous_caliph.IsFemale,'Rozhodla se','Rozhodl se')|U] ti prokázat velikou čest. Tvé jméno bude předčítáno při páteční modlitbě, a to přímo [CZPrepV(caliphal_location.GetNameNoTooltip)] [CZProvName(caliphal_location,'L')]. [righteous_caliph.GetTitleTierName|U] za to žádá jediné. Nezapomeň na [Select_CString(righteous_caliph.IsFemale,'její','jeho')|l] velkorysost, díky níž se ti této pocty dostalo...“\n\nVyslancův hlas postupně utichá, jako by chtěl zdůraznit skrytý význam svých slov."
 fp3_clan.8003.a: "Je to pro mě čest."
 fp3_clan.8003.b: "Stačí, když mé jméno zazní jednou."
 fp3_clan.8003.c: "Takovou poctu si nezasloužím."
 fp3_clan.8004.t: "Pouta strachu"
 fp3_clan.8004.desc: "[murder_enthusiast.GetFirstName], [murder_enthusiast.Custom('GetCouncilOrCourtPosition')|l] v mých službách, mě požádá o soukromý rozhovor. Ve tváři se [Select_CString(murder_enthusiast.IsFemale,'jí','mu')] zračí znepokojení.\n\n„[ROOT.Char.GetTitleTierName|U] musí být na pozoru,“ pronese téměř šeptem. „[clan_member.GetName] něco chystá. Nejspíš proti tobě znovu spřádá intriky. Možná je načase vyslat jasné varování a zasáhnout proti někomu z [Select_CString(clan_member.IsFemale,'jejích','jeho')] blízkých? Prý má [clan_member.GetFirstNameNoTooltip] ve svých službách člověka, kterému obzvlášť přeje...“"
 fp3_clan.8004.a: "Zařiď to, ale nenápadně."
 fp3_clan.8004.b: "Není třeba nic tajit. Prostě toho člověka bez okolků zavraždi."
 fp3_clan.8004.c: "Ne. A už o tom nikdy nemluv."
 fp3_clan.8004.a.success: "Úspěšně zastrašíš [clan_member.Custom('CZ_TitledFirstNameNoTooltip_A')]"
 fp3_clan.8004.a.success.tt: "Členové klanu z tebe mají strach"
 fp3_clan.8004.a.failure: "Tvůj plán se obrátí proti tobě"
 fp3_clan.8004.a.failure.tt: "[clan_member.GetTitledFirstNameNoTooltip|U] se nenechá zastrašit"
 fp3_clan.8005.t: "Náležité postavení"
 fp3_clan.8005.desc: "„To není spravedlivé!“ stěžuje si [ambitious_consort.GetTitledFirstName] a konečně dává průchod zášti, kterou v sobě zjevně dlouho potlačoval[Select_CString(ambitious_consort.IsFemale,'a','')].\n\n„[heir_child.GetFirstName|U], [Select_CString(heir_child.IsFemale,'rozmazlená','rozmazlený')] [heir_child.Custom('GetDaughterSon')|l] [heir_parent.Custom('CZ_TitledFirstName_G')], zdědí [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l], zatímco [Select_CString(empowered_child.IsFemale,'moje bystrá','můj bystrý')] [empowered_child.Custom('GirlBoy')|l] [empowered_child.GetFirstName] nedostane téměř nic.\n\nChci, abys [empowered_child.Custom('CZ_FirstNameNoTooltip_D')] okamžitě [Select_CString(ROOT.Char.IsFemale,'udělila','udělil')] titul [title_to_grant.GetName], aby [Select_CString(empowered_child.IsFemale,'dostala','dostal')] příležitost dokázat, že se svým vrstevníkům ve všem vyrovná!“"
 fp3_clan.8005.a: "#EMP Nikdy#!, rozumíš? A neopovažuj se o tom znovu mluvit."
 fp3_clan.8005.b: "To je absurdní, ale budiž..."
 fp3_clan.8005.d: "[empowered_child.GetFirstNameNoTooltip|U] je na držení titulu ještě příliš [Select_CString(empowered_child.IsFemale,'mladá','mladý')]!"
 fp3_clan.8005.e: "Slibuji ti, že [empowered_child.GetFirstNameNoTooltip] se svého dědictví dočká, až přijde čas."
 original_heir_upset_flavor: "Původního dědice titulu to rozhořčí."
 fp3_clan.8005.e.success: "Uklidníš [ambitious_consort.Custom('CZ_FirstNameNoTooltip_A')]"
 fp3_clan.8005.e.success.tt: "Podaří se ti [ambitious_consort.Custom('CZ_FirstNameNoTooltip_A')] uchlácholit"
 fp3_clan.8005.e.failure: "Nepodaří se ti přesvědčit [ambitious_consort.Custom('CZ_FirstNameNoTooltip_A')]"
 fp3_clan.8005.e.failure.tt: "[ambitious_consort.GetFirstNameNoTooltip|U] ti nedůvěřuje"
 fp3_empowered_child.tt: "Pokud bude [empowered_child.GetFirstNameNoTooltip] za několik let stále držet tento titul, zlepší si některou [Concept('skill','dovednost')|E] podle svých tehdejších [Concept('traits','rysů')|E]."
 fp3_8007_studies_pay_off_toast: "[empowered_child.GetFirstName|U] projevuje nadání"
 fp3_clan.8006.t: "Malí špehové"
 fp3_clan.8006.desc: "[paranoia_enthusiast.GetName|U], [paranoia_enthusiast.Custom('GetCouncilOrCourtPosition')|l] v mých službách, věnuje v poslední době mimořádnou pozornost jedné osobě z mé rodiny. Tou osobou je [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sneaky_child'))|l] [sneaky_child.GetFirstName].\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], situace v rodě [ROOT.Char.GetDynastyHouseNameNoTooltip] je každým dnem napjatější. Tví příbuzní proti tobě neustále spřádají intriky,“ pronese [paranoia_enthusiast.GetFirstNameNoTooltip] a postrčí [sneaky_child.Custom('CZ_FirstNameNoTooltip_A')], aby [Select_CString(sneaky_child.IsFemale,'předstoupila','předstoupil')] přede mě.\n\n„Budoval[Select_CString(paranoia_enthusiast.IsFemale,'a','')] jsem však síť mladých informátorů, kteří ti pomohou získat převahu. Takoví malí špehové totiž dokážou být nesmírně užiteční... Ostatní děti sice pocházejí z prostých poměrů, ale [Select_CString(sneaky_child.IsFemale,'mladá','mladý')] [sneaky_child.GetLadyLord|l] [sneaky_child.GetFirstNameNoTooltip] prokazuje mimořádné nadání a [Select_CString(sneaky_child.IsFemale,'mohla','mohl')] by ti dobře posloužit...“"
 fp3_clan.8006.a: "[Select_CString(sneaky_child.IsFemale,'Má','Můj')] [sneaky_child.Custom('GetDaughterSon')|l] patří ke šlechtě, ne mezi nějaké malé špehy!"
 fp3_clan.8006.b: "Jen běž, [Select_CString(sneaky_child.IsFemale,'maličká','maličký')], a dávej pozor na zrádce v našem rodě..."
 fp3_clan.8006.c: "Najmi několik špehů, ale mou rodinu z toho vynech."
 fp3_clan.8008.t: "Vyždímat do poslední mince"
 fp3_clan.8008.desc: "V poslední době tráví [Select_CString(ambitious_tax_collector.IsFemale,'má neúprosná výběrčí daní','můj neúprosný výběrčí daní')] [ambitious_tax_collector.GetName] mnoho času zamyšleným mlčením. Zdá se však, že [Select_CString(ambitious_tax_collector.IsFemale,'konečně na něco přišla','konečně na něco přišel')], protože mě nyní vyhledá.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], tvoji vazalové si vymýšlejí všemožné výmluvy, proč by neměli platit tolik daní, kolik jim přísluší. Jenže i já dokážu předložit jistá... #italic odůvodnění#!...“\n\n[ambitious_tax_collector.GetFirstNameNoTooltip|U] vytáhne starobyle vyhlížející listinu. „Tento dokument dokazuje, že [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('beleaguered_clan_member'))|l] [beleaguered_clan_member.GetTitledFirstName] ti dluží víc, než jsme si dosud mysleli. A podobné listiny mám i na další tvé poddané...“"
 fp3_clan.8008.a: "Čím víc, tím líp!"
 fp3_clan.8008.b: "Zaměřme se na [beleaguered_clan_member.Custom('CZ_TitledFirstNameNoTooltip_A')]."
 fp3_clan.8008.c: "Nedovolím, aby chamtivost rozvrátila můj rod."
 unlock_extortion.tt: "Na 20 let odemkne [Concept('decision','rozhodnutí')|E] [Concept('extort_subjects','Vydírat poddané')|E]."
 fp3_clan.8009.t: "Oblíbenec lidu"
 fp3_clan.8009.desc: "„Dále tu máme [corrupt_mayor.GetName]. [Select_CString(corrupt_mayor.IsFemale,'Je to velmi schopná správkyně, oblíbená','Je to velmi schopný správce, oblíbený')] mezi lidmi jak ve vlastní državě, tak v celém hrabství [fawazil_county.GetNameNoTier]. Zároveň však pravidelně a potají strhává značné částky z daní, které ti odvádí. Je to zcela zřejmé z levého horního sloupce loňských příjmů.“\n\nRozsáhlá a pečlivě vypracovaná daňová zpráva, kterou [righteous_tax_collector.GetName] [Select_CString(righteous_tax_collector.IsFemale,'připravila','připravil')], tak končí skutečně šokujícím odhalením."
 fp3_clan.8009.a: "Krást mi peníze? Přibijte [corrupt_mayor.Custom('CZ_Name_A')] na kříž!"
 fp3_clan.8009.b: "Zákon stojí na naší straně. Odstraňte [corrupt_mayor.Custom('CZ_Name_A')]."
 fp3_clan.8009.c: "Pche, [corrupt_mayor.GetTitleAsNameNoTooltip|l]? Nic než [ROOT.Char.Custom('GetRegionalFish')|l]!"
 fp3_clan.8009.a.success: "Zastrašíš stoupence [corrupt_mayor.Custom('CZ_FirstNameNoTooltip_G')] k poslušnosti"
 fp3_clan.8009.a.failure: "Lidé jsou spíše rozhněvaní než vyděšení"
 fp3_clan.8009.a.success.tt: "Tvá krutost se vyplatí"
 fp3_clan.8009.a.failure.tt: "Tvá krutost přijde vniveč"
 fp3_clan.8009.a.eccentric: "Jak se mi [corrupt_mayor.GetFirstNameNoTooltip] opovažuje vzdorovat!"
 fp3_clan.8010.t: "Více soudců"
 fp3_clan.8010_muslim.t: "Schopní kádíové"
 fp3_clan.8010.desc_beginning: "„Takhle se nedá pracovat!“ vykřikne můj výběrčí daní [competent_tax_collector.GetName], zjevně [Select_CString(competent_tax_collector.IsFemale,'rozčilená a sklíčená','rozčilený a sklíčený')].\n\n"
 fp3_clan.8010_muslim_version: "„Každý soud uplatňující #italic šaríu#! na území [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] je žalostným hnízdem neschopnosti, které maří veškeré mé úsilí. Řádný výběr daní vyžaduje schopné #italic kádíe#!, kteří udrží místní velmože na uzdě. Jen tak bude [ROOT.Char.GetFaith.HighGodNameAlternate] považovat tvou vládu za spravedlivou a tvůj nárok na většinu daní za oprávněný.\n\nMusíš mi poskytnout prostředky na zaměstnání většího počtu schopných soudců a také pravomoc propouštět dosavadní zkorumpované kádíe.“"
 fp3_clan.8010_non_muslim_version: "„Každý soud na území [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] je žalostným místem, kde chamtivost vítězí nad řádnou správou a spravedlností. To maří veškeré mé úsilí. Řádný výběr daní vyžaduje schopné soudce, kteří udrží místní velmože na uzdě, aby tvá vláda působila spravedlivě a tvůj nárok na daně byl oprávněný.\n\nMusíš mi poskytnout prostředky na zaměstnání většího počtu schopných soudců a také pravomoc propouštět neschopné hlupáky, kteří v těchto úřadech nyní působí.“"
 fp3_clan.8010.a: "[Select_CString(capable_magistrate_candidate.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('capable_magistrate_candidate'))|l] [capable_magistrate_candidate.GetFirstNameNoTooltip] má potřebné schopnosti. Vystačíš si s [Select_CString(capable_magistrate_candidate.IsFemale,'ní','ním')]."
 fp3_clan.8010.b: "Samozřejmě, poskytnu ti vše potřebné."
 fp3_clan.8010.c: "Vypadám snad, že mám peněz na rozdávání?"
 tax_farming_capable_courtier_flavor: "Pošleš [capable_magistrate_candidate.Custom('CZ_FirstNameNoTooltip_A')] vykonávat úřad soudce."
 increase_aptitude.tt: "Tento modifikátor může zvýšit [Concept('aptitude','způsobilost')|E] [competent_tax_collector.Custom('CZ_FirstNameNoTooltip_G')]"
 fp3_clan.8011.t: "Správce výplat"
 fp3_clan.8011.desc: "[competent_tax_collector.GetName|U] nikdy nemá nouzi o nápady, jak zvýšit příjmy panství. Tentokrát mě vyhledá během pravidelné kontroly vojska.\n\n„[ROOT.Char.GetTitleTierName|U], [Select_CString(competent_tax_collector.IsFemale,'všimla','všiml')|l] jsem si, že ve tvé vlastní doméně se místní drobní velmožové neustále snaží plnit své měšce na úkor vojáků, kterým mají vyplácet žold. Navrhuji, abys mi [Select_CString(ROOT.Char.IsFemale,'svěřila','svěřil')|l] dohled nad výplatami vojáků. [Select_CString(competent_tax_collector.IsFemale,'Mohla','Mohl')|U] bych tak potírat korupci a zajistit účinnější financování tvé armády.“\n\n„Obávám se však, že [concerned_marshal.GetTitledFirstName] se kvůli tomu [Select_CString(concerned_marshal.IsFemale,'rozhněvá','rozhněvá')|l]. Veškeré záležitosti týkající se tvých vojáků totiž dosud spadaly výhradně do [Select_CString(concerned_marshal.IsFemale,'její','jeho')|l] pravomoci.“"
 fp3_clan.8011.a: "[concerned_marshal.GetTitledFirstName|U] už má stejně práce nad hlavu..."
 fp3_clan.8011.b: "O tuto odpovědnost se můžete podělit."
 fp3_clan.8011.c: "Ne, všechno zůstane při starém."
 fp3_clan.8011.b.success: "[competent_tax_collector.GetFirstNameNoTooltip] a [concerned_marshal.GetFirstNameNoTooltip] se neochotně dohodnou na spolupráci"
 fp3_clan.8011.b.failure: "Obě postavy tuto reformu odmítají"
 fp3_clan.8011.b.success.tt: "Podaří se ti vyjednat kompromis"
 fp3_clan.8011.b.failure.tt: "Tvůj pokus o kompromis selže"
 fp3_clan.8012.t: "Výnosná chamtivost"
 fp3_clan.8012.desc: "„Někdy se, [ROOT.Char.Custom('FormOfAddressForLiege')|l], objeví nečekaný příjem.“ [Select_CString(greedy_tax_collector.IsFemale,'Má výběrčí daní','Můj výběrčí daní')|U] [greedy_tax_collector.GetName] si mne ruce v sotva potlačovaném uspokojení.\n\n„Narazil[Select_CString(greedy_tax_collector.IsFemale,'a','')|l] jsem na svědky ochotné dosvědčit, že [extorted_vassal.GetTitledFirstName] ti dluží značnou částku na příhodně #italic zapomenutých#! pozemkových daních z trvalých dřevin a vodních kol. Dovolil[Select_CString(greedy_tax_collector.IsFemale,'a','')|l] jsem si tyto daně vybrat.\n\nJeden z mých družiníků však měl potíže dostat zlato [CZPrepZ(extorted_vassal.GetCapitalLocation.GetNameNoTooltip)] [CZProvName(extorted_vassal.GetCapitalLocation,'G')], protože ho obtěžovaly místní stráže. Možná by sis proto [Select_CString(ROOT.Char.IsFemale,'měla','měl')|l] dát pozor na [extorted_vassal.Custom('CZ_FirstNameNoTooltip_A')]...“"
 fp3_clan.8012.a: "Dobrá práce!"
 fp3_clan.8012.b: "Věnujme peníze jako náboženský dar. [ROOT.Char.GetFaith.HouseOfWorship|U] tak získá podporu a [extorted_vassal.GetFirstNameNoTooltip] nebude moci nic namítat."
 fp3_clan.8012.c: "Projevím velkorysost a část peněz vrátím [extorted_vassal.Custom('CZ_TitledFirstName_D')] jako dar."
 fp3_clan.8013.t: "Břemeno výběru daní"
 fp3_clan.8013.desc: "Procházím [ROOT.Char.Custom('ResidenceBuilding')|l] a míjím knihovnu, kde spatřím [Select_CString(stressed_tax_collector.IsFemale,'svou výběrčí daní','svého výběrčího daní')] [stressed_tax_collector.Custom('CZ_Name_A')]. Zdá se, že [Select_CString(stressed_tax_collector.IsFemale,'propadla naprostému zoufalství','propadl naprostému zoufalství')].\n\n„Kéž mi [ROOT.Char.GetFaith.HighGodNameAlternate] pomůže!“ mumlá si [stressed_tax_collector.GetFirstNameNoTooltip] pro sebe. „Tohle nezvládnu. Tyto spisy o daňovém právu jsou příliš staré, příliš nejasné a naprosto neuspořádané. Jak v nich mám vůbec něco najít?\n\n[Select_CString(stressed_tax_collector.IsFemale,'Chtěla','Chtěl')|l] jsem si jen ověřit jednu drobnost, než zase vyrazím do provincií...“"
 fp3_clan.8013.a: "Uklidni se, můžeme se na to podívat společně."
 fp3_clan.8013.b: "Dělej svou práci, nebo tě nechám zbičovat!"
 fp3_clan.8013.c: "Raději budu pokračovat v procházce..."
 fp3_clan.8013.a.success: "Uklidníš [stressed_tax_collector.Custom('CZ_FirstNameNoTooltip_A')]"
 fp3_clan.8013.a.failure: "[stressed_tax_collector.GetFirstNameNoTooltip|U] dál propadá zoufalství"
 fp3_clan.8013.b.success: "Zastrašíš [stressed_tax_collector.Custom('CZ_FirstNameNoTooltip_A')] k usilovnější práci"
 fp3_clan.8013.b.failure: "Tvé zastrašování má jen malý účinek"
 fp3_clan.8013.a.success.tt: "[stressed_tax_collector.GetFirstNameNoTooltip|U] [Select_CString(stressed_tax_collector.IsFemale,'našla','našel')|l] nové odhodlání"
 fp3_clan.8013.a.failure.tt: "[stressed_tax_collector.GetFirstNameNoTooltip|U] [Select_CString(stressed_tax_collector.IsFemale,'začala','začal')|l] pracovat nedbale"
 fp3_clan.8013.b.success.tt: "[stressed_tax_collector.GetFirstNameNoTooltip|U] z tebe má strach"
 fp3_clan.8013.b.failure.tt: "[stressed_tax_collector.GetFirstNameNoTooltip|U] prohlédne tvou výhrůžku"
 fp3_clan.8015.t: "Skandální potomek"
 fp3_clan.8015.desc: "[concerned_parent.GetName|U] vstoupí do mé síně a vleče za sebou [Select_CString(scandalous_scion.IsFemale,'svou dceru','svého syna')], [scandalous_scion.Custom('CZ_FirstName_A')]. Nadšení z toho [scandalous_scion.GetFirstNameNoTooltip] rozhodně nemá.\n\n„[ROOT.Char.GetTitleTierName|U],“ pronese [concerned_parent.GetFirstNameNoTooltip], „možná se k tobě už doneslo, jak se toto moje dítě chová. [scandalous_scion.GetFirstNameNoTooltip|U] se stýká s potulnými válečníky v klubech #EMP futuwwa#!, kde se tito pobudové scházejí, popíjí s nimi v pochybných krčmách a potuluje se po městě.“ [concerned_parent.GetFirstNameNoTooltip|U] si zhluboka povzdechne.\n\n„Musíme ochránit [Select_CString(scandalous_scion.IsFemale,'její','jeho')|l] pověst, než z toho propukne veřejný skandál. Napadlo mě, že by [Select_CString(concerned_parent.IsFemale,'mohla','mohl')|U] zůstat tady a naučit se u tvého dvora slušnému chování.“"
 fp3_clan.8015.a: "Budiž, [scandalous_scion.GetFirstNameNoTooltip] může zůstat u mého dvora."
 fp3_clan.8015.b: "Je to plod tvých beder, ne mých."
 fp3_clan.8016.t: "Rozruch v hammámu"
 fp3_clan.8016.opening_desc: "Užívám si poklidnou koupel ve společnosti [chaplain.GetCouncilTitle] [chaplain.GetFirstName], když přijde řeč na mnohem vážnější záležitost.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ zašeptá [chaplain.GetFirstNameNoTooltip], „včera v noci se tu v lázních [scandalous_clan_member.GetName] [Select_CString(scandalous_clan_member.IsFemale,'objevila','objevil')] v doprovodu neoholených pobudů"
 fp3_clan.8016.deviant_desc: ", zvrhlíků a osla."
 fp3_clan.8016.drunkard_desc: ", opilců a zhýralců."
 fp3_clan.8016.rakish_desc: ", prostitutek a degenerátů."
 fp3_clan.8016.hashishiyah_desc: " a výtržníků omámených drogami."
 fp3_clan.8016.ending_desc: " Potom se dopustili takových nemravností, že je sotva dokážu popsat, a odmítali lázně opustit. A rozhodně to není poprvé, co [scandalous_clan_member.GetFirstNameNoTooltip] způsobuje podobné pohoršení.“ [chaplain.GetFirstNameNoTooltip|U] se znepokojeně odmlčí.\n\n„Musíš [scandalous_clan_member.Custom('CZ_FirstNameNoTooltip_A')] veřejně pokárat, než [Select_CString(scandalous_clan_member.IsFemale,'její','jeho')] záliby poskvrní pověst celého rodu.“"
 fp3_clan.8016.a: "Dobrá, veřejně [Select_CString(scandalous_clan_member.IsFemale,'ji pokárám','ho pokárám')]."
 fp3_clan.8016.b: "Ne. Za svými příbuznými si stojím, ať už se oddávají čemukoli."
 fp3_clan.8017.t: "Pochybný úřad"
 fp3_clan.8017.opening_desc: "„[tax_collector.GetName] už nějakou dobu působí jako tvůj výběrčí daní na mých pozemcích a svou práci odvádí docela dobře. Jenže se také [Select_CString(tax_collector.IsFemale,'začala','začal')] ujímat dohledu nad veřejnou mravností.“\n\n[unclan_taxpayer.GetTitledFirstName|U] vypadá znepokojeně a možná i trochu provinile.\n\n"
 fp3_clan.8017.overly_eager.desc: "„[Select_CString(tax_collector.IsFemale,'Je až přehnaně horlivá','Je až přehnaně horlivý')]. Poddané nechává bičovat za sebemenší prohřešek, ať už jde o neškodné opilecké výstřelky, hraní hudby na ulicích, nebo pouhé setkání mužů a žen v lázních...“"
 fp3_clan.8017.corrupt.desc: "„Bohužel se ukázalo, že [tax_collector.GetFirstNameNoTooltip] nejedná ani čestně, ani spravedlivě. Přijímá stříbro výměnou za to, že nad některými prohřešky přimhouří oči.“"
 fp3_clan.8017.cruel.desc: "„Obávám se, že [tax_collector.GetFirstNameNoTooltip] projevuje značnou krutost. I za sebemenší provinění s oblibou ukládá bičování, nebo dokonce kamenování.“"
 fp3_clan.8017.generic.desc: "„[Select_CString(tax_collector.IsFemale,'Není ani přehnaně horlivá, ani zkorumpovaná či krutá','Není ani přehnaně horlivý, ani zkorumpovaný či krutý')], ale místní [Select_CString(tax_collector.IsFemale,'ji','ho')] přesto nenávidějí.“"
 fp3_clan.8017.ending.desc: "\n\n„Prosím, vím, že [tax_collector.GetFirstNameNoTooltip] je [Select_CString(tax_collector.IsFemale,'tvá','tvůj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('tax_collector'))|l], ale musíš [Select_CString(tax_collector.IsFemale,'jí','mu')] říct, aby s tím přestal[Select_CString(tax_collector.IsFemale,'a','')].“"
 fp3_clan.8017.a: "[tax_collector.GetFirstNameNoTooltip|U] naplňuje [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] záměr."
 fp3_clan.8017.b: "Čeho se bojíš? Co by na tebe mohl[Select_CString(tax_collector.IsFemale,'a','')] [tax_collector.GetNameNoTooltip] odhalit?"
 fp3_clan.8017.c: "Dobrá, ale na tuto laskavost nezapomeň."
 fp3_clan.8017.d: "To si musíte vyřešit mezi sebou."
 fp3_clan_protect_kinsman_flavor: "Ochráníš [tax_collector.Custom('CZ_NameNoTooltip_A')] před těmito obviněními"
 fp3_clan_accuse_accuser_flavor: "Výhrůžkami přiměješ [unclan_taxpayer.Custom('CZ_TitledFirstNameNoTooltip_A')], aby svou žádost [Select_CString(unclan_taxpayer.IsFemale,'přehodnotila','přehodnotil')]"
 fp3_clan.3000.t: "Zničené tulipány"
 fp3_clan.3000.desc: "Dnešní krásné počasí mě vylákalo do zahrady. [CZPrepV(fp3_clan_3000_loc_loc.GetNameNoTooltip)|U] [CZProvNameNoTooltip(fp3_clan_3000_loc_loc,'L')] byly pro mé osobní potěšení pečlivě vysázeny celé řady těch nejkrásnějších květin.\n\nMá radost však rázem skončí, když dojdu ke svým milovaným tulipánům. [Select_CString(fp3_clan_3000_bad_child.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fp3_clan_3000_bad_child'))|l] [fp3_clan_3000_bad_child.GetFirstName] je bez milosti [Select_CString(fp3_clan_3000_bad_child.IsFemale,'otrhala','otrhal')], aby je [Select_CString(fp3_clan_3000_bad_child.IsFemale,'věnovala','věnoval')] jako dárek [Select_CString(fp3_clan_3000_random_family_member.IsFemale,'své','svému')] [SCOPE.sC('fp3_clan_3000_bad_child').Custom2('CZ_RelationToMeShort_D', SCOPE.sC('fp3_clan_3000_random_family_member'))] [fp3_clan_3000_random_family_member.Custom('CZ_FirstNameNoTooltip_D')].\n\n„Podívej, [Select_CString(fp3_clan_3000_bad_child.IsFemale,'našla','našel')] jsem krásné květiny! Myslím, že se [fp3_clan_3000_random_family_member.Custom('CZ_FirstNameNoTooltip_D')] budou líbit!“"
 fp3_clan.3000.a: "To je roztomilé! [Select_CString(fp3_clan_3000_random_family_member.IsFemale,'Tvá','Tvůj')] [SCOPE.sC('fp3_clan_3000_bad_child').Custom2('RelationToMeShort', SCOPE.sC('fp3_clan_3000_random_family_member'))|l] z nich bude mít radost!"
 fp3_clan.3000.b: "Vypadni z mé zahrady! #italic A vrať mi ty květiny zpátky!!#!"
 fp3_clan.3000.c: "Co kdybychom společně vysadili další?"
 fp3_clan.3000.c.flavor: "Využiješ příležitosti a naučíš [fp3_clan_3000_bad_child.Custom('CZ_FirstNameNoTooltip_A')] radosti ze zahradničení"
 fp3_clan.3000.d: "A dost! #italic Za to tě proměním ve hnojivo.#!"
