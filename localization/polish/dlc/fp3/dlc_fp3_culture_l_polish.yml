l_polish:
 asawira: "Asávira"
 asawira_flavor: "#F Oddíly Asávira tvoří íránští šlechtici zdatní v boji kopím i lukem. Nyní, když byla tato vojenská síla obnovena, jsou připraveni zaútočit na nepřátele Persie.#!"
 tarkhan: "Tarchanové"
 tarkhan_flavor: "#F Tarchanové jsou elitní stepní jezdci, kteří díky kombinaci kopí, palcátů a luků dokážou prolomit téměř jakoukoli obranu.#!"
 zupin_warrior: "Zupinští kopiníci"
 zupin_warrior_flavor: "#F Tito dajlamští válečníci tvoří mimořádně všestrannou jednotku. Dokážou vytvořit pevnou štítovou hradbu, ale také se rozptýlit a zasypat nepřítele krátkými oštěpy.#!"
 tawashi: "Taváší"
 tawashi_flavor: "#F Toto všestranné jezdectvo využívá meče, kopí i luky k obraně své hornaté domoviny před vetřelci.#!"
 master_assassin_court_position: "Mistr asasínů"
 master_assassin_court_position_desc: "Mistr asasínů, vázaný náboženskou vírou či přesvědčením, pomáhá svému lennímu pánovi neobvyklými způsoby vedení války, špionáží, zastrašováním a vraždami."
 has_no_particular_noble_roots_trigger: "Je [Concept('lowborn','neurozeného původu')|E] nebo pochází z bezvýznamné [Concept('dynasty','dynastie')|E]"
 court_scholar_court_position: "Dvorní učenec"
 court_scholar_court_position_desc: "Dvorní učenec představuje intelektuální zázemí tvého panství a napomáhá objevování nových [Concept('innovations','inovací')|E]."
 building_type_sar_i_sang_mines_01: "Doly Sar-i Sang"
 building_type_sar_i_sang_mines_01_desc: "Doly Sar-i Sang jsou hlavním světovým zdrojem lapisu lazuli. Těží se zde již od pravěku a zdejší vzácné modré kameny zdobily dvory po celém starověkém světě. Místní horníci tu dnem i nocí namáhavě dobývají proslulý drahokam."
 building_sar_i_sang_mines_01: "Starobylý důl Sar-i Sang"
 building_sar_i_sang_mines_01_desc: "$building_type_sar_i_sang_mines_01_desc$"
 building_sar_i_sang_mines_02: "Obnovený důl Sar-i Sang"
 building_sar_i_sang_mines_02_desc: "Starobylé štoly byly rozšířeny a zabezpečeny. Byli povoláni důlní stavitelé, aby vyhloubili novou šachtu a otevřeli tak další možnosti těžby."
 building_sar_i_sang_mines_03: "Rozšířený důl Sar-i Sang"
 building_sar_i_sang_mines_03_desc: "S rostoucím objemem těžby se rozrůstají i samotné doly. Vznikají nové vstupy do podzemí a starobylé šachty sahají stále hlouběji do nitra hory."
 building_sar_i_sang_mines_04: "Důlní komplex Sar-i Sang"
 building_sar_i_sang_mines_04_desc: "Těžba lapisu lazuli dosáhla téměř průmyslového rozsahu a v dolech nyní pracují tisíce horníků. Tato starobylá, kdysi odlehlá hora se proměnila v centrum prosperujícího hospodářství."
 tradition_fp3_frontier_warriors_name: "Pohraniční válečníci"
 tradition_fp3_frontier_warriors_desc: "Tato kultura neustále svádí boj o ovládnutí divokého pohraničí. Využívá k tomu nevyzpytatelnou směs elitních vojáků, kmenových žoldnéřů a fanatických dobrovolníků."
 tradition_fp3_irrigation_experts_name: "Mistři zavlažování"
 tradition_fp3_irrigation_experts_desc: "Příslušníci této kultury dokonale ovládají zavlažovací techniky. Díky vynalézavosti a společnému úsilí dokážou proměnit v rozkvetlou krajinu i ty nejnehostinnější pouště."
 tradition_fp3_beacon_of_learning_name: "Maják vzdělanosti"
 tradition_fp3_beacon_of_learning_desc: "Tato kultura představuje místo, kde se setkávají řecké, indické a arabské učené tradice, a zakládá si na vědeckém pokroku."
 culture_parameter_can_appoint_court_scholar: "Může obsadit [Concept('court_position','dvorský úřad')|E] #high $court_scholar_court_position$#!"
 culture_parameter_guardian_education_better_outcomes: "[Concept('guardians','Poručníci')|EU] této kultury mají větší šanci zajistit svým [Concept('wards','svěřencům')|E] lepší [Concept('education_traits','rysy vzdělání')|E]"
 tradition_fp3_jirga_name: "Džirga"
 tradition_fp3_jirga_desc: "Stařešinové a vůdci této kultury mohou svolávat shromáždění, na nichž podle prastarého kmenového práva urovnávají spory, a dokonce korunují krále."
 tradition_fp3_pragmatic_creed_name: "Pragmatické přesvědčení"
 tradition_fp3_pragmatic_creed_desc: "Válečníci této kultury si nepotrpí na okázalost. Před tradiční elitní jízdou dávají přednost schopnostem a přizpůsobivosti obyčejných vojáků."
 tradition_fp3_fierce_independence_name: "Nezdolná nezávislost"
 tradition_fp3_fierce_independence_desc: "V průběhu staletí se mnoho tyranů pokoušelo tuto kulturu vyhladit. Díky houževnatosti a vojenským úspěchům však dokázala přežít."
 not_of_central_asian_heritage_desc: "Tato [Concept('culture','kultura')|E] nemá íránské, tocharské, turkické ani mongolské [Concept('heritage','dědictví')|E]"
 culture_on_eastern_frontier_desc: "Méně než #V 20 %#! [Concept('counties','hrabství')|E] této [Concept('culture','kultury')|E] leží v oblastech [GetGeographicalRegion('world_transoxiana').GetName], [GetGeographicalRegion('world_khorasan').GetName] nebo [GetGeographicalRegion('world_steppe_tarim').GetName]"
 culture_not_iranian_desc: "Tato [Concept('culture','kultura')|E] nemá íránské [Concept('heritage','dědictví')|E]"
 steppe_or_desert_percentage_desc: "Méně než #V 30 %#! [Concept('counties','hrabství')|E] této [Concept('culture','kultury')|E] leží ve stepním nebo pouštním [Concept('terrain','terénu')|E]"
 culture_parameter_unlock_maa_tarkhan: "Může verbovat [GetMaA('tarkhan').GetName] jako [Concept('men_at_arms','ozbrojence')|E]"
 culture_parameter_faith_warrior_traits_more_valued: "[Concept('traits','Rysy')|EU] [GetTrait('faith_warrior').GetName( GetNullCharacter )] a [GetTrait('order_member').GetName( GetNullCharacter )] jsou považovány za [prestige_i][Concept('prestigious','prestižní')|E]"
 culture_parameter_tribal_elective_enabled: "Může zavést [Concept('succession_law','zákon nástupnictví')|E] [GetLaw('tribal_elective_succession_law').GetName]"
 culture_parameter_pardoning_gives_prestige: "[Concept('interaction','Interakce')|EU] #V $pardon_interaction$#! přináší [Concept('prestige','prestiž')|E]"
 culture_parameter_pragmatic_traits_county_opinion_modifiers: "[Concept('traits','Rysy')|EU] [GetTrait('diligent').GetName( GetNullCharacter )] a [GetTrait('shrewd').GetName( GetNullCharacter )] poskytují bonus k [Concept('county_opinion','lidovému mínění')|E]"
 culture_parameter_unlock_maa_zupin_warrior: "Může verbovat [GetMaA('zupin_warrior').GetName] jako [Concept('men_at_arms','ozbrojence')|E]"
 culture_parameter_innovative_traits_more_valued: "[Concept('traits','Rysy')|EU] [GetTrait('lifestyle_gardener').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )] a [GetTrait('erudite').GetName( GetNullCharacter )] poskytují bonus k [Concept('tax','daním')|E] v pouštích, suchých oblastech a pouštních horách"
 cannot_have_tradition_futuwaa: "$cannot_combine_tradition_trigger_desc$ #high $tradition_futuwaa_name$#!"
 cannot_have_tradition_roman_legacy: "$cannot_combine_tradition_trigger_desc$ #high $tradition_roman_legacy_name$#!"
 cannot_have_tradition_dryland_dwellers: "$cannot_combine_tradition_trigger_desc$ #high $tradition_dryland_dwellers_name$#!"
 cannot_have_tradition_irrigation_experts: "$cannot_combine_tradition_trigger_desc$ #high $tradition_fp3_irrigation_experts_name$#!"
 cannot_have_tradition_tribe_unity: "$cannot_combine_tradition_trigger_desc$ #high $tradition_tribe_unity_name$#!"
 tradition_fp3_enlightened_magnates_name: "Osvícení velmoži"
 tradition_fp3_enlightened_magnates_desc: "Tato kultura se pyšní dlouhou tradicí vynikající správy a básnického umění. Dobrý vládce by měl obě tyto schopnosti mistrně ovládat, nebo alespoň vyhledávat rady těch, kteří je mají."
 culture_parameter_characters_are_better_tax_collector: "[Concept('characters','Postavy')|EU] této [Concept('culture','kultury')|E] dosahují lepších výsledků v úřadu [Concept('tax_collectors','výběrčích daní')|E]"
 culture_parameter_unlock_tax_obligation_deqhan: "Může vydat [Concept('tax_decree','daňové nařízení')|E] #high $deqhan_special_rights_tax_collector$#!"
 unlock_tax_obligation_deqhan_name: "[GetCultureTradition('tradition_fp3_enlightened_magnates').GetName|U]"
 culture_parameter_unlocks_qanat_building: "V [Concept('holdings','državách')|E] této [Concept('culture','kultury')|E] lze v pouštních horách, horách, kopcích, pouštích a suchých oblastech stavět [Concept('buildings','budovy')|E] řady #V $building_type_qanats_01$#!"
 unlocks_cereal_fields_and_orchards: "V této [Concept('holding','državě')|E] lze stavět [Concept('buildings','budovy')|E] řad #V $building_type_cereal_fields_01$#! a #V $building_type_orchards_01$#!"
 culture_parameter_unlock_maa_tawashi: "Může verbovat [GetMaA('tawashi').GetName] jako [Concept('men_at_arms','ozbrojence')|E]"
 TRADITION_HARDER_TO_CULTURE_CONVERT: "Postih za místní [Concept('cultural','kulturní')|E] [Concept('tradition','tradici')|E]"
 PAM_ORIGINAL_SIN_HARDER_TO_CONVERT_CULTURE_MODIFIER: "Postih za místní [Concept('core_tenet','zásadu')|E] [Concept('faith','víry')|E]"
 culture_parameter_harder_to_convert_county_culture: "V [Concept('counties','hrabstvích')|E] této [Concept('culture','kultury')|E] je obtížnější [Concept('promote_culture','podporovat vlastní kulturu')|E]"
