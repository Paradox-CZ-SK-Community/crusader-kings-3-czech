l_polish:
 fp3_struggle.0051.t: "Íránské intermezzo"
 fp3_struggle.0051.desc: "[Mostaza.GetPrimaryTitle.GetBaseName|U], kdysi nedotknutelné panství, se zmítá v krvavé občanské válce. Členové vládnoucího rodu se navzájem vraždí a válčí spolu o to, kdo se prosadí jako [GetFaithByKey('sunni').ReligiousHeadTitleName|l]. Irák se otřásá, zatímco za východními horami perští pohraniční vládci využívají situace k prosazení nezávislosti. Na troskách bagdádské moci budují vlastní říše.\n\n"
 fp3_struggle.0051.desc.caliph: "Za mnou stojí bledá řada přízraků: [Mutawakkil.GetFirstName], [Muntasir.GetFirstName] a [Mustain.GetFirstName]. Každý z nich byl [Mostaza.GetTitleTierName|l], všichni padli za oběť tomuto [Concept('struggle','sváru')|E]. Vzpurní Peršané i zrádní Turci už se těší, až se k přízrakům předchůdců přidám. Já však stále mohu zvrátit běh událostí!"
 fp3_struggle.0051.desc.involved: "Přišel čas, aby rod [ROOT.Char.GetHouse.GetNameNoTooltip] jednal a dosáhl slávy. Zachráníme chalífát, nebo jednou provždy rozbijeme sen o sjednocené ummě?"
 fp3_struggle.0051.desc.interloper: "Poslední tři vládci skončili rychle a předčasně. Všichni teď očekávají stejný osud i pro [Mostaza.Custom('CZ_FirstName_A')], který nyní vládne jako [Mostaza.GetTitleAsNameNoTooltip]. V tomhle zmatku a nejistotě se rodu [ROOT.Char.GetHouse.GetNameNoTooltip] otevírá bezpočet příležitostí..."
 fp3_struggle.0051.desc.supporter: "Nikdy nebylo tolik zapotřebí věrnosti a vytrvalého úsilí rodu [ROOT.Char.GetHouse.GetNameNoTooltip] obnovit pořádek. Je čas usilovat o slávu, zachránit chalífát a stát se skutečnými bojovníky za [CZFaithAdjDecline(ROOT.Char.GetFaith,'ou')|l] věc!"
 fp3_struggle.0051.desc.detractor: "Páni islámu vězí v nekonečné krizi. Rod [ROOT.Char.GetHouse.GetNameNoTooltip] tak dostává jedinečnou příležitost vzít osud do vlastních rukou a vepsat své jméno do dějin."
 fp3_struggle.0051.desc.unrest: "$fp3_struggle.0051.desc$"
 fp3_struggle.0051.desc.stabilization: "Po období krize se [Mostaza.GetPrimaryTitle.GetName] vzpamatovává a krvavý svár v Persii pomalu ustupuje."
 fp3_struggle.0051.desc.stabilization_actor: "Rod [ROOT.Char.GetHouse.GetNameNoTooltip] tu musí postupovat opatrně. Můžeme využít situace a položit základy blahobytné budoucnosti. Nebo zasít nový chaos a nesvár, který nám umožní vystoupat ještě výše..."
 fp3_struggle.0051.a: "Kéž mě [ROOT.Char.GetFaith.HighGodName] provází!"
 fp3_struggle.0051.b: "Těm pošetilým ambicím je třeba učinit přítrž!"
 fp3_struggle.0071.t: "[struggle_liege.GetFirstNameNoTooltip|U] znovu prosazuje nadvládu"
 fp3_struggle.0071.desc.caliph: "Svár skončil! Ať už díky vítězství ve válce, obratné diplomacii, nebo nezpochybnitelné váze mého úřadu, zrádci a rebelové obrátili. Teď se před mým trůnem předhánějí v nových přísahách, v nejhlubších úklonách i v projevech důvěry. Jsem [Select_CString(ROOT.Char.IsFemale,'jejich právoplatná a správně vedená','jejich právoplatný a správně vedený')|l] [ROOT.Char.GetTitleTierName|l].\n\nVzpurní perští vládci přísahali poddanství a litují svého bláznovství, nebo je nahradili spolehliví a zbožní [ROOT.Char.GetCulture.Custom('CZ_Adjective_sti')|l] místodržitelé. [Select_CString(ROOT.Char.IsFemale,'Dokončila','Dokončil')|U] jsem dobytí Persie, které před dvěma stoletími zahájil chalífát správně vedených, pro nehynoucí slávu náboženství [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]."
 fp3_struggle.0071.desc.supporter: "Sliby i hrozbami, lstí i silou se podařilo obnovit autoritu [struggle_liege.Custom('CZ_TitledFirstName_G')]. Někdejší rebelové byli zkroceni a neukáznění perští vládci se předhánějí v pokoře před trůnem, na němž sedí [struggle_liege.GetTitleTierName|l].\n\nZa tím trůnem však stojím #italic já#!. V čase zmatku jsem [Select_CString(ROOT.Char.IsFemale,'přijala','přijal')|l] výzvu, [Select_CString(ROOT.Char.IsFemale,'prokázala','prokázal')|l] se jako největší opora trůnu, na němž sedí [Mostaza.GetTitleTierName|l], a [Select_CString(ROOT.Char.IsFemale,'vrátila','vrátil')|l] světu pořádek. Jistě každý brzy uzná můj přínos a rod [ROOT.Char.GetHouse.GetNameNoTooltip] získá nehynoucí slávu..."
 fp3_struggle.0071.a: "Stojím tu [Select_CString(ROOT.Char.IsFemale,'vítězná','vítězný')|l]!"
 fp3_struggle.0071.b: "Vítězství je sladké, ale můžeme dosáhnout ještě víc!"
 fp3_struggle.0072.t: "$fp3_struggle.0071.t$"
 fp3_struggle.0072.desc.caliph: "Sliby i hrozbami, lstí i silou jsem znovu [Select_CString(ROOT.Char.IsFemale,'upevnila','upevnil')|l] svou autoritu nad #italic dár al-islám#!. Mnozí sice budou tvrdit, že za tím stojí [ROOT.GetCharacter.GetFaith.HighGodNameAlternate], ale [struggle_liege.GetPrimaryTitle.GetNameNoTooltip] uniká ještě krvavější občanské válce jen díky mým schopnostem a chytrým tahům.\n\nPřichází nový, velký den pro Persii i celý svět! A pro #italic mě!#!"
 fp3_struggle.0072.desc.supporter: "Sliby i hrozbami, lstí i silou se podařilo obnovit autoritu [struggle_liege.Custom('CZ_TitledFirstName_G')]. Mnozí teď budou tvrdit, že za tím stojí [ROOT.GetCharacter.GetFaith.HighGodNameAlternate], ale [struggle_liege.GetPrimaryTitle.GetNameNoTooltip] uniká ještě krvavější občanské válce jen díky podpoře spojenců, jako jsem já.\n\nNepochybuji, že za svou snahu a věrnost dostanu odměnu. Přesto si říkám, jestli by mi opačná strana nepřinesla více..."
 fp3_struggle.0072.desc.detractor: "Prázdnými sliby a podlými hrozbami [struggle_liege.GetTitleTierName|l] [Select_CString(struggle_liege.IsFemale,'obnovila','obnovil')|l] svou takzvanou autoritu a znovu si [Select_CString(struggle_liege.IsFemale,'získala','získal')|l] věrnost hlupáků a patolízalů, kteří kdysi zaplavovali [Select_CString(struggle_liege.IsFemale,'její','jeho')|l] dvůr.\n\nNavzdory veškerému mému úsilí přetrvává zkorumpovaný chalífát [struggle_liege.GetPrimaryTitle.GetNameNoTierNoTooltip]. Pro Persii je to temný den, ale snad ještě není vše ztraceno. Přijde nový den a s ním nové příležitosti..."
 fp3_struggle.0072.desc.uninvolved: "Svár o Persii ustupuje. [struggle_liege.GetTitledFirstName|U] nejen [Select_CString(struggle_liege.IsFemale,'obnovila','obnovil')|l] svou autoritu a říši, ale [Select_CString(struggle_liege.IsFemale,'získala','získal')|l] větší moc než kdy dříve.\n\nDosazením [struggle_liege.GetCulture.Custom('CZ_Adjective_yych')|l] loutek do čela Persie a podrobením všech odpůrců znovu [Select_CString(struggle_liege.IsFemale,'prosadila','prosadil')|l] [CZFaithAdjDecline(struggle_liege.GetFaith,'ou')|l] nadvládu. [struggle_liege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip|U] se teď [Select_CString(struggle_liege.IsFemale,'jí','mu')|l] podřizuje.\n\nTěžko si představit, že se [Select_CString(struggle_liege.IsFemale,'jí','mu')|l] někdo postaví. Ale snad ještě není vše ztraceno..."
 fp3_struggle.0072.desc.involved: "Zmatek, který pohltil Persii, ustupuje. [struggle_liege.GetTitledFirstName|U] nejen [Select_CString(struggle_liege.IsFemale,'obnovila','obnovil')|l] svou autoritu a říši, ale [Select_CString(struggle_liege.IsFemale,'získala','získal')|l] větší prestiž a moc než kdy dříve.\n\nDosazením [struggle_liege.GetCulture.Custom('CZ_Adjective_yych')|l] loutek do čela Persie a podrobením všech odpůrců znovu [Select_CString(struggle_liege.IsFemale,'prosadila','prosadil')|l] [CZFaithAdjDecline(struggle_liege.GetFaith,'ou')|l] nadvládu. [struggle_liege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip|U] se teď [Select_CString(struggle_liege.IsFemale,'jí','mu')|l] podřizuje.\n\nLidé tvrdí, že tuto autoritu nebude možné zpochybnit. Možná bych to [Select_CString(ROOT.Char.IsFemale,'měla','měl')|l] vyzkoušet..."
 fp3_struggle.0072.desc.interloper: "Svár o Persii ustupuje. [struggle_liege.GetTitledFirstName|U] nejen [Select_CString(struggle_liege.IsFemale,'obnovila','obnovil')|l] svou autoritu a říši, ale [Select_CString(struggle_liege.IsFemale,'získala','získal')|l] větší moc než kdy dříve.\n\nDosazením [struggle_liege.GetCulture.Custom('CZ_Adjective_yych')|l] loutek do čela Persie a podrobením všech odpůrců znovu [Select_CString(struggle_liege.IsFemale,'prosadila','prosadil')|l] [CZFaithAdjDecline(struggle_liege.GetFaith,'ou')|l] nadvládu. [struggle_liege.GetPrimaryTitle.GetBaseNameNoTooltip|U] se teď [Select_CString(struggle_liege.IsFemale,'jí','mu')|l] podřizuje.\n\nPostavit se takové autoritě bude těžké. Možná bych se i já [Select_CString(ROOT.Char.IsFemale,'měla','měl')|l] vetřít do [Select_CString(struggle_liege.IsFemale,'její','jeho')|l] přízně a upevnit svou moc v perských zemích..."
 fp3_struggle.0072.a: "[ROOT.GetCharacter.GetFaith.HighGodNameAlternate|U] stojí při mně!"
 fp3_struggle.0072.b: "Přijde nový den!"
 fp3_struggle.0082.t: "[GetTitleByKey('d_sunni').GetNameNoTooltip|U] ustupuje"
 fp3_struggle.0082.desc.intro: "Po letech marného boje proti beznadějné přesile [struggle_liege.GetTitledFirstName] [Select_CString(struggle_liege.IsFemale,'ustoupila','ustoupil')|l] a [Select_CString(struggle_liege.IsFemale,'vzdala','vzdal')|l] se naděje na opětovné sjednocení kraje. Východní hranice nyní patří novým vládcům. Ti budou dál bojovat proti stepním nomádům i mezi sebou, jako tomu bývalo odjakživa.\n\n"
 fp3_struggle.0082.desc.supporter: "Chalífát rodu [struggle_liege.GetHouse.GetNameNoTooltip] obklíčili nepřátelé ze všech stran a roztrhaly jej zrady i neštěstí. Zda jsem [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')|l] zvrátit běh událostí, ví jen [ROOT.GetCharacter.GetFaith.HighGodName]. Osud mi však rozdal špatné karty a zbývá mi jen přemítat, co bude dál. Je to strašná rána, ale konec to #italic není#!!\n\nAť si hlupáci, kteří se mi postavili, na chvíli oddechnou. Až to budou nejméně čekat, má vojska znovu vyrazí a rozdupou prapory zrádců do prachu."
 fp3_struggle.0082.desc.involved: "Ať už je to výsledek, který jsem si [Select_CString(ROOT.Char.IsFemale,'přála','přál')|l], nebo ne, stále jej mohu obrátit ve svůj prospěch. Mé panství může vyrůst ke slávě v prázdnotě, kterou po sobě zanechal rod [struggle_liege.GetHouse.GetNameNoTooltip]."
 fp3_struggle.0082.desc.interloper: "Dosud jsem na perském jevišti [Select_CString(ROOT.Char.IsFemale,'byla vetřelkyní','byl vetřelcem')|l]. Možná teď přišla příležitost získat větší roli a zaplnit prázdnotu po rodu [struggle_liege.GetHouse.GetNameNoTooltip]. Nebo mohu ten zmatek nechat být a po budoucím domově rodu [ROOT.Char.GetHouse.GetNameNoTooltip] se poohlédnout jinde..."
 fp3_struggle.0082.desc.detractor: "Po letech marných bojů a hořkého trápení [struggle_liege.GetTitledFirstName] konečně [Select_CString(struggle_liege.IsFemale,'musela','musel')|l] ustoupit. Někdejší autorita rodu [struggle_liege.GetHouse.GetNameNoTooltip] nad Persií je dávno pryč, což dodává odvahu všem rebelům a soupeřům.\n\nZ tohoto chaosu může rod [ROOT.Char.GetHouse.GetNameNoTooltip] povstat silnější než kdy dříve, hrdý a #italic svobodný#!."
 fp3_struggle.0082.desc.uninvolved: "Po letech vyčerpávajících bojů a bezvládí [struggle_liege.GetTitledFirstName] tiše [Select_CString(struggle_liege.IsFemale,'ustoupila','ustoupil')|l] a [Select_CString(struggle_liege.IsFemale,'vzdala','vzdal')|l] se naděje znovu sjednotit Arábii a Persii.\n\nVýchod nyní patří novým vládcům. Ti budou dál bojovat se stepními nomády i mezi sebou, zatímco chalífa z dálky bezmocně přihlíží.\n\nPád rodu [struggle_liege.GetHouse.GetNameNoTooltip] zjevně přinese mnoho příležitostí každému rodu, který si je troufne využít..."
 fp3_struggle.0082.a: "Dne, kdy nás zradili, budou litovat..."
 fp3_struggle.0082.b: "Znovu přijde úsvit!"
 fp3_struggle.0082.c: "Za nehynoucí slávu Persie!"
 fp3_struggle.0091.t: "[struggle_ender.GetPrimaryTitle.GetNameNoTooltip|U] jako základ nové Persie"
 fp3_struggle.0091.desc.detractor: "Za Dámávandem vychází slunce a jeho jemná záře zahřívá bledá pole. [GetTitleByKey('e_persia').GetBaseName|U] už nebude jen historickým dědictvím. Koruna tohoto panství se stane symbolem našeho hrdinného boje proti [struggle_liege.Custom('CZ_TitledFirstName_D')].\n\nŽádný cizí vetřelec nás znovu nespoutá. Získali jsme zpět moc a slávu dávných dnů, kdy se svět třásl před králem králů.\n\nBrzy celá Persie vyvěsí prapory nové říše. #italic Mé#! říše!"
 fp3_struggle.0091.desc.supporter: "Věc [struggle_liege.Custom('CZ_Name_G')] byla spravedlivá, ale možná předem ztracená. Perský lid chtěl nového vůdce, znovu zažehnout dávné ohně a obnovit ztracenou slávu starověku. A já jsem jeho volání [Select_CString(ROOT.Char.IsFemale,'vyslyšela','vyslyšel')|l]. Ze základů, které jsem [Select_CString(ROOT.Char.IsFemale,'položila','položil')|l], může vyrůst nová říše, první v Persii od chvíle, kdy padla dynastie [sassanid_dynasty.GetName]. Nebo se mohu spokojit s tím, čeho jsem už [Select_CString(ROOT.Char.IsFemale,'dosáhla','dosáhl')|l], posílit zemi a rozdmýchat plamen v srdci každého Peršana..."
 fp3_struggle.0091.a: "Tím by měl být zajištěn odkaz rodu [ROOT.Char.GetHouse.GetNameNoTooltip]."
 fp3_struggle.0092.t: "$fp3_struggle.0091.t$"
 fp3_struggle.0092.intro: "Za Dámávandem vychází slunce a jeho jemná záře zahřívá bledá pole. [struggle_ender.GetName|U] [Select_CString(struggle_ender.IsFemale,'získala','získal')|l] dost síly a legitimity, aby [Select_CString(struggle_ender.IsFemale,'vyhlásila','vyhlásil')|l] obnovu říše. [persia_loc.GetName|U] znovu povstává a této zemi nyní vládne nová velmoc, hráz proti mstivým vládcům Arábie i divokým stepním nomádům, která obnovuje slávu dávných králů.\n\n"
 fp3_struggle.0092.desc.iranian: "Jaké bude mé místo v říši [struggle_ender.Custom('CZ_TitledFirstNameNoTooltip_G')], se teprve ukáže. S mou pomocí by [Select_CString(struggle_ender.IsFemale,'mohla','mohl')|l] vytvořit trvalý odkaz. Nebo je to jen [Select_CString(struggle_ender.IsFemale,'další dobyvatelka','další dobyvatel')|l] pro dějepisné knihy, [Select_CString(struggle_ender.IsFemale,'velká','velký')|l], ale pomíjivého významu."
 fp3_struggle.0092.desc.non-iranian: "Někdejší pouhé pohraničí skomírajícího chalífátu se teď stává jádrem rostoucí říše. Svět se zájmem sleduje, zda [struggle_ender.GetTitledFirstNameNoTooltip] vytvoří trvalý odkaz, nebo je to jen [Select_CString(struggle_ender.IsFemale,'další dobyvatelka','další dobyvatel')|l] pro dějepisné knihy, [Select_CString(struggle_ender.IsFemale,'velká','velký')|l], ale pomíjivého významu."
 fp3_struggle.0092.a: "Bylo to nevyhnutelné"
 fp3_struggle.0095.t: "Vzestup [CZAdherent_G(struggle_ender.GetFaith)|l]"
 fp3_struggle.0095.desc.shia_and_zandaqa: "Pomýlení sunnité příliš dlouho pokládali svůj skomírající chalífát za nejvyšší autoritu tohoto světa hned po Bohu. Jak hluboce se mýlili.\n\nPo pádu [struggle_liege.Custom('CZ_TitledFirstName_G')] jsem se [Select_CString(ROOT.Char.IsFemale,'ujala','ujal')|l] vedení #EMP ummy#! a pro následovníky [ali.Custom('CZ_FirstName_G')] [Select_CString(ROOT.Char.IsFemale,'pomstila','pomstil')|l] bitvu u Karbaly. Nastolím novou éru nadvlády, v níž bude mít hlavní slovo [ROOT.Char.GetFaith.GetAdherentNameNoTooltip|l], a usednu na největší trůn tohoto světa.\n\nSunnitům, kteří si dříve tak samolibě věřili, nezbude než se podřídit."
 fp3_struggle.0095.desc.muhakkima: "Nevědomí sunnité dlouho považovali za samozřejmé, že jejich zkorumpovaný chalífát je nejvyšší autoritou tohoto světa. Ve svém bláznovství však zapomněli, že soud náleží jen Bohu! [Select_CString(ROOT.Char.IsFemale,'Dokázala','Dokázal')|U] jsem to, oč přede mnou usilovali mnozí [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|l], a [Select_CString(ROOT.Char.IsFemale,'ukončila','ukončil')|l] sunnitský chalífát. Na pomstu za bitvu u Nahrawánu a staletí pronásledování to zdaleka nestačí, ale je to jen začátek. [Select_CString(ROOT.Char.IsFemale,'Stala','Stal')|U] jsem se chalífou [CZAdherentPl_G(ROOT.Char.GetFaith)|l] a povedu je k velkému zúčtování se šíity, které jistě přijde jako další."
 fp3_struggle.0095.desc.fallback: "Chalífát má vést ummu na zemi po posvátné cestě. My jsme jej však ve svém bláznovství nechali zeslábnout a zkorumpovat. To se dnes mění. Pod mým moudrým a neúplatným vedením začíná nová doba pro Persii i islám.\n\nPřestože nás čeká mnoho práce, mé činy už nepochybně navždy změní běh perských dějin. Teď míříme do budoucnosti, k [CZFaithAdjDecline(ROOT.Char.GetFaith,'é')|l] víře. [GetTitleByKey('e_persia').GetName|U] povstane s námi!"
 fp3_struggle.0095.a: "Kéž [ROOT.Char.GetFaith.HighGodNameAlternate] vede mou vládu!"
 fp3_struggle.0096.t: "$fp3_struggle.0095.t$"
 fp3_struggle.0096.desc.supporter: "Panství [struggle_liege.Custom('CZ_Name_G')] bohužel padlo. Z jeho popela [Select_CString(struggle_ender.IsFemale,'povstala','povstal')|l] [struggle_ender.GetName] a [struggle_ender.GetFaith.GetAdherentName|l] nyní získává chalífát. Má podpora [struggle_liege.Custom('CZ_TitledFirstNameNoTooltip_G')] tak byla marná, všechno zlato i úsilí přišlo vniveč. Možná ale ještě není pozdě zachránit sunnitskou věc. Nebo změnit stranu a plně se spojit s [CZAdherentPl_I(struggle_ender.GetFaith)|l]..."
 fp3_struggle.0096.desc.involved: "Zmatky a bezvládí zřejmě skončily. [struggle_ender.GetName|U] [Select_CString(struggle_ender.IsFemale,'přelstila','přelstil')|l] všechny soupeře a [Select_CString(struggle_ender.IsFemale,'získala','získal')|l] chalífát ve jménu víry [struggle_ender.GetFaith.GetName]. Podporovatele i odpůrce už má jistě také. Někteří mluví o konci #italic ummy#!, jiní slaví vítězství své víry. Musím dobře zvážit, ke komu se přidám. [struggle_ender.GetTitledFirstNameNoTooltip|U] se chystá zahájit novou éru islámu a přinést mír Mezopotámii i Persii. S mou podporou však může stát i padnout..."
 fp3_struggle.0096.desc.interloper: "$fp3_struggle.0096.desc.involved$"
 fp3_struggle.0096.desc.detractor: "Zkorumpované panství [struggle_liege.Custom('CZ_TitledFirstName_G')] konečně padlo. Z jeho popela [Select_CString(struggle_ender.IsFemale,'povstala','povstal')|l] [struggle_ender.GetTitledFirstName]. [struggle_ender.GetFaith.GetAdherentName|U] nyní ovládá chalífát a začíná nová doba.\n\nMůj dlouhý boj proti [struggle_liege.Custom('CZ_TitledFirstNameNoTooltip_D')] tak přinesl ovoce, i když možná jiné, než jsem si [Select_CString(ROOT.Char.IsFemale,'přála','přál')|l]. Pro sunnitskou věc však stále zbývá naděje a já mohu být jejím světlem. Nebo se mohu plně spojit s [CZAdherentPl_I(struggle_ender.GetFaith)|l]..."
 fp3_struggle.0096.desc.uninvolved: "Dlouhý svár v Persii skončil. [struggle_ender.GetName|U] [Select_CString(struggle_ender.IsFemale,'přelstila','přelstil')|l] všechny soupeře a [Select_CString(struggle_ender.IsFemale,'získala','získal')|l] chalífát ve jménu víry [struggle_ender.GetFaith.GetName]. Zda to bylo právem, či neprávem, nikdo neví. Zřejmě však zahájí novou éru islámu a přinese mír Mezopotámii i Persii. Zdaleka ne všichni v #italic ummě#! z toho mají radost a pohraniční vládci si ve vzdálených pevnostech mohou lámat hlavu. Prozatím však budou muset zatnout zuby."
 fp3_struggle.0096.a: "[ROOT.Char.GetFaith.HighGodNameAlternate|U] oplývá velikostí a milosrdenstvím!"
 fp3_struggle.0096.b: "To je temný den..."
 fp3_struggle.0100.t: "Základ nové moci: Podrobený chalífát"
 fp3_struggle.0100.desc: "Muslimové dlouho uznávali chalífát za nejvyšší autoritu tohoto světa hned po Bohu. Panství však upadalo do sklíčenosti a úpadku a tento stav bylo třeba přehodnotit.\n\n[ROOT.GetCharacter.GetPrimaryTitle.GetNameNoTooltip|U] nyní povstává pod mým vedením a chalífa se dostává pod mou ochranu i dohled. [struggle_liege.GetName|U] možná vede věřící, ale odteď budu #italic já#! [Select_CString(struggle_liege.IsFemale,'její','jeho')|l] [Select_CString(ROOT.Char.IsFemale,'paní','pánem')|l], [Select_CString(ROOT.Char.IsFemale,'novou správkyní','novým správcem')|l] islámu. A pro [Select_CString(struggle_liege.IsFemale,'její','jeho')|l] vlastní #EMP dobro#! by na to [Select_CString(struggle_liege.IsFemale,'neměla','neměl')|l] zapomínat!"
 fp3_struggle.0100.desc.shia_and_zandaqa: "Muslimové dlouho uznávali chalífát za nejvyšší autoritu tohoto světa hned po Bohu. Jak ale panství propadalo sklíčenosti a úpadku, ukázalo se, že Alího následovníci mají na vedení věřících lepší nárok.\n\n[Select_CString(ROOT.Char.IsFemale,'Vzala','Vzal')|U] jsem pod svou ochranu a dohled chalífát [struggle_liege.GetPrimaryTitle.GetNameNoTierNoTooltip]. V #EMP ummě#! nastolím novou éru nadvlády. [ROOT.Char.GetFaith.GetAdherentName|U] bude udávat směr a naši odpůrci udělají nejlépe, když se podřídí!"
 fp3_struggle.0100.desc.muhakkima: "Sunnité dlouho uznávali chalífát za nejvyšší autoritu tohoto světa hned po Bohu. Jakmile se však panství zatřáslo před silou muhakkimy, prohlédli svůj omyl.\n\nPod mým vedením se [ROOT.Char.GetFaith.GetAdherentNamePlural|l] ujali dohledu nad bídným chalífou, jehož území je [struggle_liege.GetPrimaryTitle.GetNameNoTierNoTooltip]. Celá #EMP umma#! brzy bude muset přijmout naše posvátná slova: soud náleží jen Bohu!"
 fp3_struggle.0100.a: "Nový den pro islám!"
 fp3_struggle.0101.t: "$fp3_struggle.0100.t$"
 fp3_struggle.0101.desc.detractor: "Nikoho by nemělo překvapit, že chalífát [struggle_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] byl papírovým tygrem. Jeho vojska se rozprchla a věrní přívrženci porušili přísahy nebo se skryli v zapomenutém pohraničí. [struggle_ender.GetName|U] se teď [Select_CString(struggle_ender.IsFemale,'prohlásila za','prohlásil za')|l] #italic [Select_CString(struggle_ender.IsFemale,'ochránkyni','ochránce')|l]#! chalífy. Jen hlupáci však nepoznají, co to znamená. Sunnitský chalífát byl podroben a ponížen. Jeho [Select_CString(struggle_ender.IsFemale,'novou paní','novým pánem')|l] je [Select_CString(struggle_ender.IsFemale,'ona','on')|l].\n\nJako [Select_CString(ROOT.Char.IsFemale,'dlouholetá odpůrkyně','dlouholetý odpůrce')|l] [struggle_liege.Custom('CZ_TitledFirstNameNoTooltip_G')] si musím v novém pořádku zajistit důležité místo pro sebe i rod [ROOT.Char.GetHouse.GetNameNoTooltip]..."
 fp3_struggle.0101.desc.supporter: "Přes mou neochvějnou podporu byl chalífát [struggle_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] příliš rozdrobený. Nebo měl příliš mnoho příliš houževnatých nepřátel. [struggle_ender.GetName|U] se nyní [Select_CString(struggle_ender.IsFemale,'prohlásila za','prohlásil za')|l] #italic [Select_CString(struggle_ender.IsFemale,'ochránkyni','ochránce')|l]#! chalífy. Ve skutečnosti však potupně [Select_CString(struggle_ender.IsFemale,'podrobila','podrobil')|l] právoplatného vládce #italic dár al-islám#!.\n\nTeď musím postupovat opatrně, abych [Select_CString(ROOT.Char.IsFemale,'zajistila','zajistil')|l] budoucnost rodu [ROOT.Char.GetHouse.GetNameNoTooltip]..."
 fp3_struggle.0101.desc.interloper: "Rozhodné činy [struggle_ender.Custom('CZ_Name_G')] zřejmě přinesly zmatkům a bezvládí v Persii konec, byť křehký. [struggle_ender.GetTitledFirstNameNoTooltip|U] [Select_CString(struggle_ender.IsFemale,'podrobila','podrobil')|l] [struggle_liege.Custom('CZ_TitledFirstName_A')] a nyní si nárokuje poručnictví nad sunnitským chalífátem i uznání za největšího vládce země.\n\nOtázka zní: má rod [ROOT.Char.GetHouse.GetNameNoTooltip] tento stav přijmout, nebo jej zpochybnit?"
 fp3_struggle.0101.desc.involved: "$fp3_struggle.0101.desc.interloper$"
 fp3_struggle.0101.desc.uninvolved: "Svár v Persii a Mezopotámii skončil. [struggle_ender.GetName|U] [Select_CString(struggle_ender.IsFemale,'podrobila','podrobil')|l] [struggle_liege.Custom('CZ_Name_A')] a [Select_CString(struggle_ender.IsFemale,'ovládla','ovládl')|l] podstatnou část #italic dár al-islám#!. Autorita a sláva sunnitského chalífátu byly navždy oslabeny, zatímco [struggle_ender.GetPrimaryTitle.GetName] září jako nová rostoucí moc. Jen čas ukáže, zda přetrvá, nebo je pouhou padající hvězdou..."
 fp3_struggle.0101.a: "Kéž to zvěstuje nový den!"
 fp3_struggle.0101.b: "To je temný den pro islám."
 fp3_struggle.0191.t: "Konec [GetTitleByKey('d_sunni').Custom('CZ_LandedName_G')]"
 fp3_struggle.0191.desc: "[GetTitleByKey('d_sunni').GetNameNoTooltip|U] marně vzdoruje ctižádostivým generálům, nespokojeným vazalům i vlastním někdejším otrokům. Nakonec sklízí plody vlastní setby. Pýcha a marnivost přerostly všechny meze, výdaje byly plýtvavé a vrtkavé a dvůr zrádný jako žádný jiný.\n\nŘíše padla a její pád jsem [Select_CString(ROOT.Char.IsFemale,'zosnovala','zosnoval')|l] #italic já#!. Stojím tu ve slávě, zatímco vláda [struggle_liege.Custom('CZ_FirstName_G')] se nanejvýš stane varovným příběhem v dějepisných knihách, krátkou vsuvkou v perských letopisech."
 fp3_struggle.0191.a: "To je můj největší okamžik!"
 fp3_struggle.0191.b: "[Select_CString(ROOT.Char.IsFemale,'Udělala','Udělal')|U] jsem, co bylo nutné."
 fp3_struggle.0192.t: "$fp3_struggle.0191.t$"
 fp3_struggle.0192.desc.caliph: "Všichni mě zradili. Rádci, vazalové i přátelé. Ať jsem se panství rodu [ROOT.Char.GetHouse.GetNameNoTooltip] [Select_CString(ROOT.Char.IsFemale,'snažila','snažil')|l] zachránit sebevíc, naděje nakonec nezbyla. Mohu se ptát, zda jsem [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')|l] něco udělat jinak, ale pravdu zná jen [ROOT.GetCharacter.GetFaith.HighGodName]. Panství leží zpustošené a rozbité mezi padlými věžemi a troskami někdejší slávy. [ROOT.Char.Custom('ResidenceBuilding')|U] mi zbývá jako úkryt, zatímco se vše kolem hroutí. Musím se spokojit s tím, že alespoň stále žiji."
 fp3_struggle.0192.desc.supporter_or_vassal: "[struggle_liege.GetPrimaryTitle.GetNameNoTooltip|U] nedokáže vydržet beznadějný boj s ctižádostivými generály, nespokojenými vazaly a vlastními někdejšími otroky. Cena ve zlatě, krvi i námaze byla ohromná. Svět možná neuzná mou roli ani oběti, které jsem [Select_CString(ROOT.Char.IsFemale,'přinesla','přinesl')|l], ale [ROOT.GetCharacter.GetFaith.HighGodName] je vidí. Ať už je to k dobrému, nebo ke zlému, nyní stojíme před roztrhaným panstvím, vydaným napospas těm, kdo by na krále tohoto světa udeřili smrtící silou. Zkáza rodu [struggle_liege.GetHouse.GetNameNoTooltip] však nemusí být mou zkázou. Z tohoto popela mohou vyrůst nové květy."
 fp3_struggle.0192.desc.detractor: "[struggle_liege.GetPrimaryTitle.GetNameNoTooltip|U] marně vzdoruje ctižádostivým generálům, nespokojeným vazalům i vlastním někdejším otrokům. Nakonec sklízí plody vlastní setby. Pýcha a marnivost přerostly všechny meze, výdaje byly plýtvavé a vrtkavé a dvůr zrádný jako žádný jiný. Rod [struggle_liege.GetHouse.GetNameNoTooltip] padl tak hluboko, že si nikdo neumí představit jeho opětovný vzestup. Jeho jméno se nanejvýš stane varovným příběhem v dějepisných knihách, krátkou vsuvkou v perských letopisech."
 fp3_struggle.0192.a: "Ať to stojí cokoli, musím zajistit budoucnost dynastie."
 fp3_struggle.0192.b: "Je to jen dočasný nezdar."
 fp3_struggle.0192.c: "To přináší nové příležitosti. Pro mě."
 fp3_struggle.0123.d: "Jaká pohroma..."
 sway_outcome.1004.t: "Přísaha věrnosti"
 sway_outcome_magnanimity.1004.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U],“ říká [target.GetName], „teď vidím, že bylo chybou o tobě pochybovat. Tvá velkorysost ti slouží ke cti v těchto těžkých časech, kdy bychom se měli všichni spojit pro dobro panství.“ Ukloní se přede mnou a působí opravdu upřímně. Možná se mi [Select_CString(target.IsFemale,'ji','ho')|l] skutečně podařilo přimět, aby [Select_CString(target.IsFemale,'přešla','přešel')|l] na mou stranu."
 sway_outcome_blessed.1004.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ prohlašuje [target.GetName] s hlubokou úklonou. „Možná ti [ROOT.GetCharacter.GetFaith.HighGodName] skutečně žehná, jak někteří říkají. Nebo tvá slova zasáhla cíl pouhou náhodou. Důležité však je, že mě naše poslední rozhovory dojaly. V tomhle zmatku musíme udržet panství pohromadě a já ti budu oporou.“"
 sway_outcome_grudgingly.1004.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U],“ říká [target.GetName] neochotně, „teď mi připadá jasné, že bychom se při společných nepřátelích ze všech stran [Select_CString(And(ROOT.Char.IsFemale,target.IsFemale),'měly','měli')|l] snažit si navzájem důvěřovat. Proto se před tebou skláním a znovu ti vyznávám věrnost.“"
 sway_outcome_flattery.1004.desc: "„Ó, [Select_CString(ROOT.Char.IsFemale,'velká','velký')|l] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ říká [target.GetName] s úklonou. „Mám to štěstí stát ve tvém stínu. [Select_CString(ROOT.Char.IsFemale,'Má milosrdná a slavná lenní paní','Můj milosrdný a slavný lenní pane')|U], jak mě mrzí, že jsem o tobě kdy [Select_CString(target.IsFemale,'pochybovala','pochyboval')|l]. Odmítám všechny nešťastné výroky, které jsem o tobě údajně [Select_CString(target.IsFemale,'pronesla','pronesl')|l], ať už jsou skutečné, nebo smyšlené.“"
 sway_outcome_dharmic.1004.desc: "„Ó, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ prohlásí [target.GetName] vážně. „Každé panství potřebuje vládce nad ostatními, toho, kdo roztáčí kolo a vidí za hranice pomíjivého světa těla a bláznovství. Možná jsi [ROOT.Char.GetTitleTierName|l] skutečně ty. Proto odložím pochybnosti i marnivost a obnovím svůj závazek vůči tobě.“"
 sway_outcome_caliph.1004.desc: "[target.GetName|U] mi na okamžik pohlédne do očí, potom se hluboce ukloní. „Jsi [ROOT.Char.GetTitleTierName|l], [Select_CString(ROOT.Char.IsFemale,'má lenní paní','můj lenní pane')|l], a právoplatně vedeš #italic ummu#!. [Select_CString(target.IsFemale,'Měla','Měl')|U] jsem pochybnosti, to nepopírám. Nemohu však dopustit, aby věc věřících byla ohrožena. Na svůj slib vůči tobě jsem [Select_CString(target.IsFemale,'nezapomněla','nezapomněl')|l] a znovu už nezakolísám.“"
 sway_outcome.1004.a: "Dobrá... Ale budu tě sledovat!"
 sway_outcome.1004.b: "Vše je odpuštěno."
 fp3_decision.0001.t: "Zažehnutí královského ohně"
 fp3_decision.0001.desc_mazdakist: "Kdyby Mazdak žil, přikázal by mi zavřít chrámy ohně jako pomníky marnivosti. Já však jsem [ROOT.Char.GetTitleTierName|l] a mohu zvolit jinou cestu. Chci-li ctít jeho odkaz, musím svou vládu posvětit ohněm jako velcí králové minulosti."
 fp3_decision.0001.desc_khurramite: "Možná by na tomto světě nikdo neměl mít titul [ROOT.Char.GetTitleTierName|l]. Lid mi však toto postavení svěřil a zaslouží si ochranu Átara, #italic jazaty#! tepla a světla."
 fp3_decision.0001.desc_general_zoroastrian: "Teď, když jsem [ROOT.Char.GetTitleTierName|l], musím vládnout ve světle slávy svých předků a usilovat o přízeň. Kéž mou vládu provází [ROOT.Char.GetFaith.HighGodNamePossessive] souhlas."
 fp3_decision.0001_desc_ending: "Na dvoře uspořádám obřad a zažehnu velký plamen. [ROOT.Char.Custom('ResidenceBuilding')|U] [CZPrepV(ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip)|l] [ROOT.Char.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')] se stane jeho domovem. Kéž hoří po celou dobu mé vlády."
 fp3_decision.0001_vassal_and_courtier_opinion_impressed: "Dvořanům a vazalům nepřátelských vír se to nemusí líbit, ale na ostatní to může udělat #italic velmi#! silný dojem."
 fp3_decision.0001_vassal_and_courtier_opinion: "Dvořanům a vazalům nepřátelských vír se to nemusí líbit, ale na ostatní to udělá dojem."
 fp3_decision.0001.a: "Co to dělám? Chrámy se mají zničit."
 fp3_decision.0001.b: "Okázalý obřad hodný slávy perských králů!"
 fp3_decision.0001.c: "Skromný obřad postačí."
 fp3_decision.0001.d: "Plameny mohou počkat."
 fp3_decision.0001_pledged_to_quench_fire: "Toto rozhodnutí bude po 20 let nedostupné."
 fp3_decision.0001.a.tt: "Slavnostně přísaháš, že posvátné ohně uhasíš."
 fp3_decision.0002.t: "Uhašení královského ohně"
 fp3_decision.0002.desc: "Pohroma! Vojska [occupant.Custom('CZ_Name_G')] vyplenila [ROOT.Char.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_A')] a udeřila na mé sídlo. [ROOT.Char.Custom('ResidenceBuilding')|U] se ocitá v jejich rukou a někteří vojáci dorazili do místnosti s mým královským ohněm. Zlomyslně jej uhasili. Pro dynastii [ROOT.Char.GetDynastyNameNoTooltip] to může být nesmírně zlé znamení."
 fp3_decision.0002_fire_destroyed_tt: "Pověrčiví či horliví dvořané a vazalové to považují za velmi zlé znamení pro tvou vládu."
 fp3_decision.0002.a: "Na tom nezáleží. Byl to jen symbol."
 fp3_decision.0002.b: "Ten zločin bude pomstěn!"
 fp3_decision.0002.c: "Co mám teď dělat?"
 fp3_dynasty_decision.0003.t: "Perský projekt"
 fp3_dynasty_decision.0003.intro: "Už dávno je načase, aby se obyvatelé [capital_county.Custom('CZ_LandedName_G')] dočkali pohledu na velkolepou novou stavbu. "
 fp3_dynasty_decision.0003.char: "Do čela tohoto podniku jsem [Select_CString(ROOT.Char.IsFemale,'nemohla','nemohl')|l] vybrat nikoho lepšího než [chosen_architect.Custom('CZ_Name_A')]. Má mou plnou důvěru."
 fp3_dynasty_decision.0003.desc: "\n\nAby byla stavba dostatečně nádherná, můžeme použít kořist nedávno uloupenou v [target_county.Custom('CZ_LandedName_L')]. To by však obyvatele jistě rozhněvalo.\n\nNebo bych tento podnik [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')|l] velkoryse financovat z vlastní pokladnice..."
 fp3_dynasty_decision.0003.a: "Ať obyvatelé [target_county.Custom('CZ_LandedNameNoTierNoTooltip_G')] prokážou svou věrnost!"
 fp3_dynasty_decision.0003.b: "Tento podnik zaplatím [Select_CString(ROOT.Char.IsFemale,'sama','sám')|l]."
 fp3_dynasty_decision.0003.c: "Když o tom přemýšlím, možná jindy."
 cultural_acceptance_built_magnificent_capital: "Velkolepá místní stavba"
 splurge_above_expectations_toast: "Projekt překoná očekávání"
 splurge_as_expected_toast: "Projekt postupuje podle plánu"
 fp3_dynasty_decision.0004.t: "Stavební ambice"
 fp3_dynasty_decision.0004.intro: "[chosen_architect.GetFirstName|U] pilně pracuje a shromažďuje pracovníky pro náš nový projekt."
 fp3_dynasty_decision.0004.plunder.desc: "Z [target_county.Custom('CZ_LandedNameNoTier_G')] proudí zástupy dělníků i vozy s materiálem."
 fp3_dynasty_decision.0004.desc: "„Brzy bude všechno připraveno, [ROOT.Char.Custom('FormOfAddressForLiege')|l],“ prohlašuje. „Ale co postavíme?“\n\n„Napadlo mě velké mauzoleum obložené lazuritem z dolů Sar-e Sang. Nebo obnova sídla v tradičním stylu. [ROOT.Char.Custom('ResidenceBuilding')|U] po obnově na poddané [CZPrepV(capital_province.GetNameNoTooltip)|l] [CZProvNameNoTooltip(capital_province,'L')] jistě zapůsobí. Mohli bychom také rozšířit #italic kanáty#!, kašny a lázně a bohatě je vyzdobit.“ \n\n„Čemu dáváš přednost, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]?“"
 fp3_dynasty_decision.0004.a: "Mauzoleum pro dynastii [ROOT.Char.GetDynastyNameNoTooltip]."
 fp3_dynasty_decision.0004.b: "Ať [ROOT.Char.Custom('ResidenceBuilding')|l] dostane nový vzhled."
 fp3_dynasty_decision.0004.c: "Nádherně zdobené lázně a kašny."
 every_house_member: "Každý člen [Concept('house','rodu')|E] [root_scope.MakeScope.Char.GetHouse.GetBaseNameNoTooltip]"
 fp3_dynasty_decision.0005.t: "Vidina nádhery"
 fp3_dynasty_decision.0005.desc: "Jindy jasnou tvář [chosen_architect.Custom('CZ_Name_G')] tíží tmavé kruhy pod očima. Celou noc [Select_CString(chosen_architect.IsFemale,'pracovala','pracoval')|l] na plánu, jak zkrášlit [CZProvName(capital_province,'A')].\n\n„Představuji si, [ROOT.Char.Custom('FormOfAddressForLiege')|l], krásné lázně hammám obložené pestrobarevnými keramickými dlaždicemi. Uvnitř mozaikové podlahy, parní lázně, chladné bazény a bujné stromy v čínských porcelánových nádobách...“\n\n„... ale pokud ti víc vyhovuje [ROOT.Char.GetFaith.HouseOfWorship|l] nebo malý palác, samozřejmě nakreslím nové plány.“"
 fp3_dynasty_decision.0005.a: "Hammám zní nádherně."
 fp3_dynasty_decision.0005.b: "Raději ať tu vznikne [ROOT.Char.GetFaith.HouseOfWorship|l]."
 fp3_dynasty_decision.0005.c: "Může mít [Select_CString(ROOT.Char.IsFemale,'žena','muž')|l] příliš mnoho paláců?"
 fp3_decisons_closer_to_love.tt: "Sblížíš se s [chosen_architect.Custom('CZ_FirstNameNoTooltip_I')]"
 fp3_dynasty_decision.0007.t: "Duchovní stavitelství"
 fp3_dynasty_decision.0007_desc_beginning: "[chosen_architect.GetTitledFirstName|U] neztrácí čas a pouští se do plánů nové stavby [CZPrepV(capital_province.GetNameNoTooltip)|l] [CZProvName(capital_province,'L')].\n\n„[ROOT.Char.GetFaith.HouseOfWorship|U] může nabídnout nádherný oblouk a mramorové průčelí v nejnovějším perském stylu,“ navrhne.\n\n"
 fp3_dynasty_decision.0007_dakhma: "„Nebo dachma, věž mlčení, kde budou mrtví v tichosti spočívat, dokud se [ROOT.Char.Custom('GetRegionalEagleType')|l] nesnesou k hostině. Můžeme ji však postavit tak velkou a krásnou ve své důstojné nádheře, že by i mrchožraví ptáci museli zůstat stát a obdivovat ji.“\n\n"
 fp3_dynasty_decision.0007_madrasa: "„Nebo velká madrasa s klidnými místnostmi ke studiu a rozjímání. Budou se tu scházet [ROOT.Char.Custom('LevyMenWomen')|l] učeného ducha ze všech národů země.“\n\n"
 fp3_dynasty_decision.0007_outro: "„Působivá by také byla velká výpravná freska na východní zdi, která by propojovala zbožná témata s dějinami dynastie [ROOT.Char.GetDynastyNameNoTooltip]!“"
 fp3_dynasty_decision.0007.a: "Ať tu vznikne [ROOT.Char.GetFaith.HouseOfWorship|l], pokud dokážeš vytvořit něco opravdu velkolepého."
 fp3_dynasty_decision.0007.b: "Postav dachmu, ať můžeme bezpečně uctít mrtvé."
 fp3_dynasty_decision.0007.c: "Nová madrasa by panství jistě prospěla."
 fp3_dynasty_decision.0007.d: "Tu fresku bych [Select_CString(ROOT.Char.IsFemale,'ráda','rád')|l] [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')|l]..."
 fp3_dynasty_decision.0008.t: "Vlastní pomník"
 fp3_dynasty_decision.0008.desc: "Dlouhé hodiny jsem v samotě [Select_CString(ROOT.Char.IsFemale,'kreslila','kreslil')|l] návrhy na zvelebení [CZProvName(capital_province,'G')].\n\nProjekt bude jistě lepší, když je dílem jen mé mysli, bez dotěrných prostředníků a lichotících dvořanů. Ale co z něj vznikne?\n\nPohlédnu do zápisků a vidím tři slibné návrhy. Mohu..."
 fp3_dynasty_decision.0008.a: "Zkrášlit a rozšířit bazar."
 fp3_dynasty_decision.0008.b: "Vybudovat velké náměstí a studnu."
 fp3_dynasty_decision.0008.c: "Postavit velké mauzoleum pro dobu, kdy nadejde můj čas."
 fp3_dynasty_decision.0008.d: "Navrhnout přepychové lázně."
 fp3_dynasty_decision.0008.e: "Vztyčit vysokou, zářivou strážní věž."
 fp3_dynasty_decision.0008.f: "Postavit pohodlný letní palác."
 fp3_dynasty_decision.0008.g: "Ať tu vznikne podivuhodná stavba: [ROOT.Char.GetFaith.HouseOfWorship|l]."
 fp3_decision.0003.t: "Pevnost Badd"
 fp3_decision.0003.desc_recently: "Jen před několika desítkami let, na vrcholu churramitského povstání proti Abbásovcům, se vůdce sedláků Bábak se svými následovníky opevnil ve staré parthské pevnosti. Tam svedl poslední boj, ale Abbásovci za vítězství draze zaplatili."
 fp3_decision.0001.desc_less_recently: "V počátcích abbásovského chalífátu pronásledovala jeho vojska churramitského vůdce Bábaka až do vysoko položené pevnosti na hoře v lese Arasbaránu. Tam svedl poslední boj. Zříceninu sice od té doby nahlodaly živly, místo však zůstává působivé a bude skvělou baštou."
 fp3_decision.0001.desc_long_ago: "Vysoko v Černých horách arasbaránského lesa stojí na zasněženém vrcholu zřícenina pevnosti. V tomto orlím hnízdě svedl churramitský hrdina Bábak kdysi dávno svůj poslední boj. Já mu navrátím slávu, jakou mohlo mít za starých časů."
 fp3_decision.0003.desc_khurramite: "Místní [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|l] mému záměru velmi přejí. Slíbili, že mi pomohou místo obnovit a zajistit.\n\n"
 fp3_decision.0003.desc_zandik: "Sedláci a pastevci v těchto drsných horách jsou proslulí neukázněností. Nenávidí však staré [ROOT.Char.GetFaith.GetReligion.Custom('CZ_AdjectiveNoTooltip_ee')|l] duchovenstvo a slíbili mi podporu.\n\n"
 fp3_decision.0003.desc_fallback: "Místní jsou bojovní a náchylní ke vzpourám, ale milují Bábakovu památku uchovanou v příbězích a písních. Pomohou mi obnovit jeho dávný horský domov.\n\n"
 fp3_decision.0003.desc_ending: "Nastal čas založit nové sídlo rodu [ROOT.Char.GetDynastyHouseNameNoTooltip]. Kéž přetrvá dlouhé věky!"
 fp3_decision.0003.a: "Vidím způsob, jak získat část nákladů zpět..."
 fp3_decision.0003.b: "Bude z ní mocná pevnost!"
 fp3_decision.0003.c: "Nepotřebuji slávu, jen bezpečnou pevnost."
 fp3_decision.0004.t: "Víra pro lid"
 fp3_decision.0004_alternate.t: "Uhašení věčných ohňů"
 fp3_decision.0004_desc: "My [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|l] jsme už dlouho kráčeli vlastní cestou. [ROOT.Char.GetFaith.HighGodName|U] od nás přijímá úctu tak, jak to našim srdcím nejlépe vyhovovalo. Ani za velkých dnů minulosti nám nebyli zapotřebí vysocí [ROOT.Char.GetFaith.random_AltPriestTermPlural|l] a jejich spletité obřady. Dnes žijeme v jiném světě, naše sužovaná víra má mnoho soupeřů a potřeba reformy nebyla nikdy větší. Odteď bude kněžstvo blíž lidu. Vytvoříme si vlastní budoucnost: [ROOT.Char.GetFaith.PriestNeuter|l] může být kdokoli, kdo má důvěru společenství."
 fp3_decision.0004_alternate_desc: "[ROOT.Char.GetFaith.random_AltPriestTermPlural|U] nás pronásledují už dlouho. My [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|l] víme, jak se drží posvátných ohňů, zděděné moci a bohatství. Lidé mimo naši víru na tyto zastaralé zvyky dlouho hleděli s pohrdáním. Dost! Víra [ROOT.Char.GetFaith.GetNameNoTooltip] odteď změní směr. [ROOT.Char.GetFaith.HouseOfWorshipPlural|U] zavřou své brány a věčné ohně navždy vyhasnou. [ROOT.Char.GetFaith.random_AltPriestTermPlural|U] tak přijdou o moc a pro náboženství [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] začne nová doba. Odteď už nás nevedou [ROOT.Char.Custom('DefaultPriestWomenMen')|l] ani žádní jiní smrtelníci. Naši cestu určuje pouze [ROOT.Char.GetFaith.HighGodName]."
 fp3_decision.0004.a: "Tím se otevře tolik dveří... pro mě!"
 fp3_decision.0004.b: "A kéž z uhlíků zbude studený popel!"
 fp3_decision.0004.c: "Knězem se teď může stát i chudák."
 fp3_decision.0004.d: "Bylo to pro dobro všech."
 fervor_gain_magi_destroyed: "Reforma mágů"
 destroy_the_magi_opinion_tooltip: "[CZReligionAdjSti(root_religion)|U] vládci s méně radikálními názory tím budou velmi rozhořčeni."
 replace_the_high_priest_effect_tooltip: "[Concept('head_of_faith','Hlava víry')|EU] se mění: dosud [GetDoctrineType('doctrine_temporal_head').GetBaseName], nově [GetDoctrineType('doctrine_no_head').GetBaseName]"
 fp3_decision.0008.t: "Nárok na světlo"
 fp3_decision.0008.desc: "Sužovaní [founder.GetFaith.GetAdherentNamePlural|l] dlouho marně bojovali bez správně vedeného vůdce. Teď jejich potupa končí. [Select_CString(ROOT.Char.IsFemale,'Ujala','Ujal')|U] jsem se #italic waláji#!, poručnictví nad věřícími, a [ROOT.Char.GetFaith.HighGodNameAlternate] mi propůjčuje #italic světlo nad světlem#!. Povedu je se všemi schopnostmi a prozíravostí, které mi [ROOT.Char.GetFaith.HighGodNameAlternate] ve své moudrosti dopřeje, a po mně totéž učiní moji potomci. Kéž tím začíná nová doba: [founder.GetFaith.GetAdherentNamePluralNoTooltip|l] budou znovu prospívat!"
 fp3_decision.0008.a: "To bude má povinnost i břemeno."
 fp3_decision.0008.b: "Kéž nad mým rodem září světlo bez žáru!"
 fp3_decision.0009.t: "Nová hlava víry: [founder.GetFaith.ReligiousHeadName]"
 fp3_decision.0009.desc: "[founder.GetFirstName|U] se [Select_CString(founder.IsFemale,'rozhodla','rozhodl')|l] vystupovat jako [founder.GetFaith.ReligiousHeadName|l]. [founder.GetFaith.GetAdherentNamePlural|U] tak dostávají nové vedení a mnozí následovníci tento smělý krok podporují. Prý [founder.GetFirstNameNoTooltip] získává #italic waláju#!, mystické vedení, které poskytuje [ROOT.Char.GetFaith.HighGodNameAlternate] a které umožňuje vést věřící. Nyní snad nemám možnost tento nárok otevřeně zpochybnit. Patřím však k předním osobnostem víry [founder.GetFaith.GetNameNoTooltip], a na mém názoru tedy záleží. Mám [founder.Custom('CZ_FirstNameNoTooltip_A')] přijmout jako novou hlavu věřících, nebo se [Select_CString(founder.IsFemale,'jí','mu')|l] potají stavět na odpor?"
 fp3_decision.0009.a: "[founder.GetTitledFirstNameNoTooltip|U] jistě prokáže, že si to zaslouží."
 fp3_decision.0009.b: "To je výsměch."
 fp3_decision.0009.a.tt: "[founder.GetFaith.ReligiousHeadName|U] získává tvé bezvýhradné uznání."
 fp3_decision.0009.b.tt: "Potichu se podřídíš... prozatím."
 fp3_decision.0009.c: "[founder.GetFaith.GetAdherentNamePluralNoTooltip|U] si zaslouží skutečného vůdce..."
 fp3_decision.0010.t: "Nová hlava víry: [founder.GetFaith.ReligiousHeadName]"
 fp3_decision.0010.desc: "[founder.GetFirstName|U] [Select_CString(founder.IsFemale,'získala','získal')|l] dost podpory a pověsti zbožnosti, aby [Select_CString(founder.IsFemale,'vystupovala','vystupoval')|l] jako [founder.GetFaith.ReligiousHeadName|l]. [founder.GetFaith.GetAdherentNamePlural|U] teď uznávají nové vedení. Někteří šíité to oslavují jako malé vítězství své víry v #italic ismu#!. Podle ní je [founder.GetFaith.ReligiousHeadTitleName|l] bez hříchu. Více pospolitě smýšlející $islam_religion_adherent_plural$ však naříkají nad další trhlinou v ummě. [founder.GetFaith.GetAdherentNamePluralNoTooltip|U] mezitím působí radikálněji než kdy dříve."
 fp3_decision.0010.a: "Musím si to promyslet..."
 fp3_decision.0010.b: "Musím zůstat [Select_CString(ROOT.Char.IsFemale,'ostražitá','ostražitý')|l]..."
 fp3_decision.0011.t: "Pomsta za naše mučedníky"
 fp3_decision.0011_opening.desc: "Kdysi muhakkima neochvějně odmítla zbabělý kompromis, který někdejší velikán [ali.GetFirstName] uzavřel s uchvatitelem [muawiya.Custom('CZ_FirstName_I')]. Tím jsme se stali prokletými v očích sunnitů i šíitů. Od té doby naši #italic fedajíni#! obětovali životy, aby zabíjeli zrádce a odpadlíky a vrátili muhakkimě význam.\n\nTen den nyní přišel. Zrádné chalífáty padly a pod mým vedením [ROOT.Char.GetFaith.GetAdherentNamePlural|l] znovu získali Mezopotámii i naše dávná svatá místa."
 fp3_decision.0011_fanatic_murderer.desc: "Brzy celé náboženství [ROOT.Char.GetFaith.GetReligion.GetName] zavrhne bludné názory a přidá se k naší pravověrné věci. Nebo zemře!"
 fp3_decision.0011_unfanatic_unmurderer.desc: "Brzy budou naši velcí řečníci a básníci slyšet v celé ummě a obrátí na naši pravověrnou věc nesčetné zástupy."
 fp3_decision.0011.a: "Lá hukma illá lilláh!"
 fp3_decision.0012.t: "Nadvláda víry [avenger.GetFaith.GetNameNoTooltip]"
 fp3_decision.0012.desc: "[avenger.GetName|U] [Select_CString(avenger.IsFemale,'získala','získal')|l] dost podpory i zbožnosti, aby [Select_CString(avenger.IsFemale,'vyvolala','vyvolal')|l] vlnu přívrženců. [avenger.GetFaith.GetAdherentName|U] nyní získává podporu na rozsáhlých územích muslimského světa. Prý mnoho vládců i měst přijalo [Select_CString(avenger.IsFemale,'její','jeho')|l] víru, dobrovolně či nikoli. Jen [ROOT.Char.GetFaith.HighGodName] ví, co se chystá dál."
 fp3_decision.0012.a: "To je velký den pro islám!"
 fp3_decision.0012.b: "To je strašné..."
 fp3_decision.0013.t: "[ROOT.Char.GetFaith.GetReligiousHeadTitle.Custom('CZ_AdjectiveNoTooltip_ee')|U] námitky"
 fp3_decision.0013.desc: "[hof_emissary.GetName|U] zastupuje [ROOT.Char.GetFaith.GetReligiousHeadTitle.Custom('CZ_LandedName_A')] a působí značně rozrušeně. To snad něco napovídá i o pocitech [righteous_caliph.Custom('CZ_TitledFirstName_G')].\n\n„Posvátný text [righteous_caliph.GetFaith.ReligiousText] byl světu zjeven v arabštině a v žádném jiném jazyce se číst nebude,“ prohlašuje [hof_emissary.GetFirstNameNoTooltip]. „Ani jiné knihy, svitky či voskové tabulky o věcech víry. Ne dokud [Select_CString(righteous_caliph.IsFemale,'má paní, velká','můj pán, velký')|l] [righteous_caliph.GetTitleTierName|l], dýchá. Žádá, abys okamžitě [Select_CString(ROOT.Char.IsFemale,'zanechala','zanechal')|l] pomýleného překládání a [Select_CString(ROOT.Char.IsFemale,'zpřetrhala','zpřetrhal')|l] vazby se svatokrádežnými učenci.“ Odmlčí se.\n\n„Nezoufej ale. [righteous_caliph.GetTitleTierName|U] ti ze své štědrosti vrátí většinu zlata, které jsi na ten výsměch [Select_CString(ROOT.Char.IsFemale,'utratila','utratil')|l].“"
 fp3_decision.0013.a: "Bohužel, má cesta je daná."
 fp3_decision.0013.b: "Dobrá, tu politiku odvolám."
 fp3_decision.0014.t: "Perská hrdost"
 fp3_decision.0014_opening.desc: "Má podpora sotva začala, ale někteří #italic ulamá#! [CZPrepV(ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip)|l] [ROOT.Char.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')] už tvoří díla v místním jazyce. [persian_genius_ulama.GetName|U] projevuje zvláštní nadšení.\n\n„O to usiluji už dlouho,“ říká. „Velikost náboženství [ROOT.Char.GetFaith.GetReligion.GetName] vyrostla ze spojení arabské udatnosti a perské vytříbenosti i vědomostí. Už dávno je načase, aby Persie znovu získala úlohu světla duchovního osvícení. [Select_CString(persian_genius_ulama.IsFemale,'Přeložila','Přeložil')|U] jsem a [Select_CString(persian_genius_ulama.IsFemale,'opatřila','opatřil')|l] výkladem mnoho hadísů. Dokonce jsem znovu [Select_CString(persian_genius_ulama.IsFemale,'objevila','objevil')|l] ztracená díla samotného Hasana al-Basrího, uchovaná ve starých knihovnách Gundéšápúru...“\n\n"
 fp3_decision.0014_there_is_caliph.desc: "[uncaring_caliph.GetTitledFirstName|U] mezitím mlčí a sleduje tento vývoj s obavami."
 fp3_decision.0014_no_caliph.desc: "Pohlédnu na [Select_CString(persian_genius_ulama.IsFemale,'tu ctižádostivou ženu','toho ctižádostivého muže')|l]. Snad bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')|l] [Select_CString(persian_genius_ulama.IsFemale,'jejích','jeho')|l] schopností využít lépe?"
 fp3_decision.0014.a: "To zní slibně!"
 fp3_decision.0014.b: "[Select_CString(persian_genius_ulama.IsFemale,'Měla','Měl')|U] bys zůstat a pracovat přímo pro mě."
 promote_persian_scripture_cannot_take_decision.tt: "Toto [Concept('decision','rozhodnutí')|E] nebudeš moci znovu přijmout po 30 let."
 pledged_to_not_promote_persian_desc: "[Select_CString(ROOT.Char.IsFemale,'Zavázala','Zavázal')|U] ses nepodporovat perské náboženské texty."
 fp3_decision.0015.t: "Oznámení při páteční modlitbě"
 fp3_decision.0015.desc.switch.supporter_becoming_detractor: "[Select_CString(ROOT.Char.IsFemale,'Vyhlásila','Vyhlásil')|U] jsem, že odteď se v mých zemích jméno [ROOT.Char.GetFaith.GetReligiousHead.Custom('CZ_TitledFirstName_G')] při páteční modlitbě bude číst až na posledním místě. Tehdy se [ROOT.Char.Custom('LevyMenWomen')|l] z celého panství scházejí k místnímu uctívání; [ROOT.Char.GetFaith.HouseOfWorshipPlural|l] se plní věřícími.\n\nTento jasný projev separatismu jistě rozhněvá poskoky, které opouštím. Ale koho zajímá mínění patolízalů?\n\n"
 fp3_decision.0015.desc.switch.detractor_becoming_supporter: "[Select_CString(ROOT.Char.IsFemale,'Vyhlásila','Vyhlásil')|U] jsem, že odteď se v mých zemích jméno [ROOT.Char.GetFaith.GetReligiousHead.Custom('CZ_TitledFirstName_G')] při páteční modlitbě bude číst jako první a nejpřednější.\n\nPrávě tehdy se [ROOT.Char.Custom('LevyMenWomen')|l] z panství scházejí k uctívání; [ROOT.Char.GetFaith.HouseOfWorshipPlural|l] se plní věřícími. To by mělo být jasným znamením mé dobrovolné podřízenosti i podpory jednoty chalífátu.\n\n"
 fp3_decision.0015.desc.switch.presently_neutral: "Vládci kolem mě si vybírají strany. Buď podporují jednotu [ROOT.Char.GetFaith.GetReligiousHeadTitle.Custom('CZ_LandedName_G')], nebo prosazují nezávislost.\n\nJá se zatím [Select_CString(ROOT.Char.IsFemale,'nevyjádřila','nevyjádřil')|l], ale změnit postoj je snadné. Stačí oznámit, zda se jméno [ROOT.Char.GetFaith.GetReligiousHead.Custom('CZ_TitledFirstName_G')] při páteční modlitbě bude číst jako první, nebo poslední. [ROOT.Char.Custom('LevyMenWomen')|U] z panství se přitom shromáždí k místnímu uctívání; [ROOT.Char.GetFaith.HouseOfWorshipPlural|l] budou dějištěm tohoto oznámení.\n\n"
 fp3_decision.0015.desc.liege.presently_neutral: "[Select_CString(ROOT.Char.GetLiege.IsFemale,'Má lenní paní','Můj lenní pán')|U] [ROOT.Char.GetLiege.GetTitledFirstName] jistě doufá, že se v této věci vydám v [Select_CString(ROOT.Char.GetLiege.IsFemale,'jejích','jeho')|l] stopách."
 fp3_decision.0015.desc.liege.aligning: "Naštěstí tím dosáhnu dokonalé shody se [Select_CString(ROOT.Char.GetLiege.IsFemale,'svou lenní paní','svým lenním pánem')|l] [ROOT.Char.GetLiege.Custom('CZ_TitledFirstName_I')], [Select_CString(ROOT.Char.GetLiege.IsFemale,'která','který')|l] sdílí mé nové přesvědčení."
 fp3_decision.0015.desc.liege.contradicting: "Přesto mě znepokojuje, že [Select_CString(ROOT.Char.GetLiege.IsFemale,'má lenní paní','můj lenní pán')|l] [ROOT.Char.GetLiege.GetTitledFirstName] můj názor nesdílí a nový postoj nejspíš přijme špatně."
 fp3_decision.0015.desc.liege.fallback: "Pro mě i [ROOT.Char.GetFaith.GetReligiousHead.Custom('CZ_TitledFirstNameNoTooltip_A')] je to velmi důležité. Pochybuji však, že by [Select_CString(ROOT.Char.GetLiege.IsFemale,'má lenní paní','můj lenní pán')|l] [ROOT.Char.GetLiege.GetTitledFirstName] o takovou vnitřní sunnitskou politiku příliš [Select_CString(ROOT.Char.GetLiege.IsFemale,'stála','stál')|l]."
 fp3_decision.0015.a: "Podporuji [ROOT.Char.GetFaith.GetReligiousHead.Custom('CZ_TitleAsNameNoTooltip_A')], ale ne [ROOT.Char.GetLiege.Custom('CZ_TitleAsNameNoTooltip_A')]."
 fp3_decision.0015.a.tt: "Místo tvého lenního pána zazní tvé jméno. [ROOT.Char.Custom2('YourCharacterIntroduction', ROOT.Char.GetLiege)|U] tak přijde o prvenství"
 fp3_decision.0015.b: "[ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstNameNoTooltip|U] má mou věrnost!"
 fp3_decision.0015.c: "Jsem důležitější než [Select_CString(And(ROOT.Char.GetFaith.GetReligiousHead.IsFemale,ROOT.Char.GetLiege.IsFemale),'obě ty hlupačky','oba ti hlupáci')|l]."
 fp3_decision.0015.c.tt: "$fp3_decision.0015.a.tt$"
 fp3_decision.0015.d: "Patří do [ROOT.Char.GetFaith.GetReligiousHead.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')], ne sem. [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip|U] [Select_CString(ROOT.Char.GetFaith.GetReligiousHead.IsFemale,'její','jeho')|l] místo není."
 fp3_decision.0015.e: "Možná by mé jméno mělo nahradit jméno lenního pána..."
 fp3_decision.0015.e.tt: "$fp3_decision.0015.a.tt$"
 fp3_decision.0015.f: "[Select_CString(ROOT.Char.IsFemale,'Udělala','Udělal')|U] jsem smělé rozhodnutí."
 fp3_decision.0015.vassal_semi_rebel: "Vazal pohrdá tvou svrchovaností"
 fp3_misc_decisions.0010.opening: "[Select_CString(ROOT.Char.IsFemale,'Velitelko věřících','Veliteli věřících')|U],"
 fp3_misc_decisions.0010.desc_intro: "Bude mi ctí uznat tvou požehnanou a ctnostnou vládu nad tímto světem."
 fp3_misc_decisions.0010.desc_struggle: "Kéž [recipient.GetFaith.HighGodName] žehná tvému úsilí proti ničemným rebelům, kteří ohrožují tvou vládu."
 fp3_misc_decisions.0010.a: "Skvělé."
 fp3_misc_decisions.0011.desc: "Uznávám sice, že právoplatně zastáváš úřad [recipient.GetFaith.ReligiousHeadName|l], ale tvým požadavkům vyhovět nemohu."
 fp3_misc_decisions.0011.a: "Ničemný nevěřící!"
 fp3_misc_decisions.0015.t: "Přijetí zoroastrismu"
 fp3_misc_decisions.0015.desc: "Ať se stane cokoli, $zoroastrianism_good_god_zoroaster$ bude mou oporou v učení a $zoroastrianism_devil_name$ nenaruší mou odhodlanou obranu. Kterou víru však v hodině nouze nazvu svou vlastní?"
 fp3_misc_decisions.0015.a: "Má víra bude [zoroastrian_faith_1.GetName]."
 fp3_misc_decisions.0015.b: "[zoroastrian_faith_2.GetName|U] je jasná volba."
 fp3_misc_decisions.0015.c: "Mé srdce si volí víru [zoroastrian_faith_3.GetName]."
 fp3_misc_decisions.0020.t: "Výzva splněna: Rod [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 fp3_misc_decisions.0020.desc.a: "[recipient.GetFirstName|U], [Select_CString(recipient.IsFemale,'potlučená a zbitá','potlučený a zbitý')|l], [Select_CString(recipient.IsFemale,'pochopila','pochopil')|l], že musí ustoupit někomu, kdo dokáže náš rod pevněji vést.\n\n[Select_CString(ROOT.Char.IsFemale,'Nezasloužila','Nezasloužil')|U] jsem si to jen silou. Nakonec zvítězilo mé odhodlání dovést rod [ROOT.Char.GetHouse.GetBaseName] k velikosti. [Select_CString(recipient.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))|l] slabé vůle by to nikdy [Select_CString(recipient.IsFemale,'nedokázala','nedokázal')|l]."
 fp3_misc_decisions.0020.desc.a.lethal: "[recipient.GetFirstName|U], ta skvrna na jménu naší rodiny, je [Select_CString(recipient.IsFemale,'mrtvá','mrtvý')|l]. Můj nárok na vedení rodu je nepopiratelný.\n\n[Select_CString(ROOT.Char.IsFemale,'Nezasloužila','Nezasloužil')|U] jsem si to jen silou. Nakonec zvítězilo mé odhodlání dovést rod [ROOT.Char.GetHouse.GetBaseName] k velikosti. [Select_CString(recipient.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))|l] slabé vůle by to nikdy [Select_CString(recipient.IsFemale,'nedokázala','nedokázal')|l]."
 fp3_misc_decisions.0020.desc.b: "[Select_CString(ROOT.Char.IsFemale,'Vyčerpaná','Vyčerpaný')|U] vzhlédnu do tváře [recipient.Custom('CZ_FirstName_G')]. [Select_CString(recipient.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('recipient'))|l] mi přísným pohledem potvrzuje, co už vím. [Select_CString(ROOT.Char.IsFemale,'Selhala','Selhal')|U] jsem...\n\n„K vedení rodu je zapotřebí odvahy,“ povzdechne si. „Břemena rodu [ROOT.Char.GetHouse.GetBaseName] musím nést já.“\n\nNení pochyb. [recipient.GetFirstNameNoTooltip|U] [Select_CString(recipient.IsFemale,'prokázala','prokázal')|l] před dvorem mou slabost..."
 fp3_misc_decisions.0020.lose.a: "[Select_CString(ROOT.Char.IsFemale,'Nebyla','Nebyl')|U] jsem dost [Select_CString(ROOT.Char.IsFemale,'silná','silný')|l]."
 fp3_misc_decisions.0020.lose.b: "Rod [ROOT.Char.GetHouse.GetBaseNameNoTooltip] je #bold #EMP MŮJ!#!#!"
 fp3_misc_decisions.0020.win.a: "Rod [ROOT.Char.GetHouse.GetBaseNameNoTooltip] se přede mnou sklání!"
 fp3_misc_decisions.0020.win.b: "[Select_CString(recipient.IsFemale,'Bojovala','Bojoval')|U] jsi statečně, hlavo našeho rodu!"
 fp3_misc_decisions.0022.t: "Výzva vznesena: Rod [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 fp3_misc_decisions.0022.desc.intro: "[duel_location.GetBaseNameNoTierNoTooltip|U] je místem našeho setkání. Když dorazím, [recipient.GetTitledFirstName], [Select_CString(recipient.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))|l], už čeká v plné pohotovosti. Přivítá mě jako [Select_CString(ROOT.Char.IsFemale,'příbuznou','příbuzného')|l] a měří si mě pohledem, zatímco se dvůr shromažďuje, aby byl svědkem mé výzvy."
 fp3_misc_decisions.0022.desc.body: "\n\n„Tak pojď,“ řekne drsně. „Rozhodněme o osudu rodu [ROOT.Char.GetHouse.GetBaseName].“"
 fp3_misc_decisions.0022.trigger_failure.actor: "Můj [Concept('trial_by_combat_trial','soud')|E] proti [recipient.Custom('CZ_FirstNameNoTooltip_D')] pozbyl platnosti"
 fp3_misc_decisions.0022.trigger_failure.recipient: "Můj [Concept('trial_by_combat_trial','soud')|E] proti [actor.Custom('CZ_FirstNameNoTooltip_D')] pozbyl platnosti"
 fp3_misc_decisions.0022.a: "Ať vyhraje lepší z nás."
 fp3_misc_decisions.0022.a.tt: "[Concept('single_combat_duel','Duel')|EU] začíná!"
 fp3_misc_decisions.0023.desc.a: "[actor.GetFirstName|U], [Select_CString(actor.IsFemale,'potlučená a zbitá','potlučený a zbitý')|l], [Select_CString(actor.IsFemale,'pochopila','pochopil')|l], že bylo pošetilé zpochybňovat mé vedení našeho rodu.\n\n[Select_CString(actor.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))|l] slabé vůle svou výzvou jen [Select_CString(actor.IsFemale,'prokázala','prokázal')|l] rodu [ROOT.Char.GetHouse.GetBaseName] i poddaným, že si vedení zasloužím já."
 fp3_misc_decisions.0023.desc.a.lethal: "[actor.GetFirstName|U] konečně leží [Select_CString(actor.IsFemale,'mrtvá','mrtvý')|l] a s [Select_CString(actor.IsFemale,'ní','ním')|l] i všechny ničivé a zlovolné ambice.\n\n[Select_CString(actor.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))|l] slabé vůle svou výzvou jen [Select_CString(actor.IsFemale,'prokázala','prokázal')|l] rodu [ROOT.Char.GetHouse.GetBaseName] i poddaným, že si vedení zasloužím já."
 fp3_misc_decisions.0023.desc.b: "[Select_CString(ROOT.Char.IsFemale,'Vyčerpaná','Vyčerpaný')|U] vzhlédnu do tváře [actor.Custom('CZ_FirstName_G')]. [Select_CString(actor.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))|l] mi vítězoslavným pohledem potvrzuje, co už vím. [Select_CString(ROOT.Char.IsFemale,'Selhala','Selhal')|U] jsem...\n\n„Náš rod konečně získá [Select_CString(actor.IsFemale,'silnou vůdkyni','silného vůdce')|l],“ povzdechne si. „Břemena rodu [ROOT.Char.GetHouse.GetBaseName] musím nést já.“\n\nNení pochyb. [actor.GetFirstNameNoTooltip|U] [Select_CString(actor.IsFemale,'prokázala','prokázal')|l] před dvorem mou slabost..."
 fp3_misc_decisions.0023.lose.a: "[Select_CString(ROOT.Char.IsFemale,'Nebyla','Nebyl')|U] jsem dost [Select_CString(ROOT.Char.IsFemale,'silná','silný')|l]."
 fp3_misc_decisions.0023.win.a: "Pastýř musí své stádo udržet na uzdě."
 fp3_misc_decisions.0025.t: "[Select_CString(actor.IsFemale,'Má','Můj')|U] [SCOPE.sC('recipient').Custom2('CZ_RelationToMeShort_V', SCOPE.sC('actor'))|l] [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')],"
 fp3_misc_decisions.0025.desc: "Zjevně ještě nejsi [Select_CString(ROOT.Char.IsFemale,'připravena','připraven')|l] nést břemena vedení rodu [ROOT.Char.GetHouse.GetBaseName].\n\nPro dobro rodiny musím tvou pomýlenou výzvu odmítnout."
 fp3_misc_decisions.0025.a: "Nakonec mě budeš muset uznat!"
 fp3_misc_decisions.0025.b: "Na tvé pošetilé odmítnutí se nezapomene."
 fp3_misc_decisions.0026.desc: "[duel_location.GetBaseNameNoTierNoTooltip|U] je místem našeho setkání. Když dorazím, [recipient.GetTitledFirstName], [Select_CString(recipient.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))|l], mě klidně očekává. Před dvorem mě obejme a učiní zadost všem zvyklostem našeho rodu.\n\nSlabě se usměje. „Pojď, [recipient.Custom2('CZ_RelationToMeShort_V', SCOPE.sC('actor'))|l], vyslechneme, co nám chceš říci.“\n\n[recipient.GetFirstNameNoTooltip|U] objedná občerstvení. Posadíme se a [Select_CString(recipient.IsFemale,'ona','on')|l] se ke mně s očekáváním obrátí."
 fp3_misc_decisions.0026.desc.no_court: "[duel_location.GetBaseNameNoTierNoTooltip|U] je místem našeho setkání. Když dorazím, [recipient.GetTitledFirstName], [Select_CString(recipient.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))|l], mě klidně očekává. Obejmeme se a učiníme zadost všem zvyklostem našeho rodu.\n\nSlabě se usměje. „Pojď, [recipient.Custom2('CZ_RelationToMeShort_V', SCOPE.sC('actor'))|l], vyslechneme, co nám chceš říci.“\n\n[recipient.GetFirstNameNoTooltip|U] objedná občerstvení. Posadíme se a [Select_CString(recipient.IsFemale,'ona','on')|l] se ke mně s očekáváním obrátí."
 fp3_misc_decisions.0026.a: "Kde začít..."
 fp3_misc_decisions.0026.a.tt: "Rozhovor začíná!"
 fp3_misc_decisions.0027.desc: "Začínám dějinami rodu [actor.GetHouse.GetBaseName] a činy [actor.GetHouse.GetFounder.Custom('CZ_TitledFirstName_G')]. Pomalu přecházím k současnosti.\n\n[recipient.GetFirstName|U] trpělivě naslouchá a občas přikývne, zatímco shrnuji hrozby, kterým naše rodina čelí, i způsob obrany.\n\nKdyž skončím, [Select_CString(recipient.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))|l] klidně řekne: „Ano, ano, velmi dobře. Ale proč máš naši rodinu vést #EMP ty#! místo mě?“"
 fp3_misc_decisions.0027.desc.founder: "Začínám dějinami rodu [actor.GetHouse.GetBaseName] a činy našich předků. Pomalu přecházím k současnosti.\n\n[recipient.GetFirstName|U] trpělivě naslouchá a občas přikývne, zatímco shrnuji hrozby, kterým naše rodina čelí, i způsob obrany.\n\nKdyž skončím, [Select_CString(recipient.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))|l] klidně řekne: „Ano, ano, velmi dobře. Ale proč máš naši rodinu vést #EMP ty#! místo mě?“"
 fp3_misc_decisions.0027.a.sick: "Mysli na své zdraví. Tvé břemeno mohu převzít."
 fp3_misc_decisions.0027.a.sick.tt: "Tato možnost je dostupná, protože má špatné [Concept('health','zdraví')|E]"
 fp3_misc_decisions.0027.a.old: "Přišel čas, aby naši rodinu vedla další generace."
 fp3_misc_decisions.0027.a.old.tt: "Tato možnost je dostupná, protože je mnohem starší než ty"
 fp3_misc_decisions.0027.a.young: "Ještě jsi [Select_CString(recipient.IsFemale,'mladá a nezkušená','mladý a nezkušený')|l] a máš se mnoho co učit."
 fp3_misc_decisions.0027.a.young.tt: "Tato možnost je dostupná, protože je mladší než ty"
 fp3_misc_decisions.0027.a.trigger: "Musí mít špatné zdraví nebo být podstatně starší či mladší než ty"
 fp3_misc_decisions.0027.b.vassal: "[actor.GetPrimaryTitle.GetBaseNameNoTierNoTooltip|U] má právo na tvou poslušnost. Vyslechni mě."
 fp3_misc_decisions.0027.b.vassal.tt: "Tato možnost je dostupná, protože je tvým [Concept('vassal','vazalem')|E] či pod ním"
 fp3_misc_decisions.0027.b.tier: "Jsi [recipient.GetTitleAsNameNoTooltip]. Já jsem [actor.GetTitleAsNameNoTooltip]. Dbej mých slov."
 fp3_misc_decisions.0027.b.tier.tt: "Tato možnost je dostupná, protože je [Select_CString(recipient.IsFemale,'její','jeho')|l] [Concept('rank','hodnost')|E] nižší"
 fp3_misc_decisions.0027.b.military: "Jen já mám sílu náš rod ubránit."
 fp3_misc_decisions.0027.b.military.tt: "Tato možnost je dostupná, protože je [Select_CString(recipient.IsFemale,'její','jeho')|l] armáda podstatně menší"
 fp3_misc_decisions.0027.b.dread: "Opravdu chceš, abych se na tebe [Select_CString(ROOT.Char.IsFemale,'rozhněvala','rozhněval')|l]?"
 fp3_misc_decisions.0027.b.dread.tt: "Tato možnost je dostupná, protože z tebe má strach"
 fp3_misc_decisions.0027.b.trigger: "Musíš patřit mezi [Select_CString(recipient.IsFemale,'její','jeho')|l] [Concept('liege','lenní pány')|E], mít vyšší [Concept('rank','hodnost')|E], podstatně větší armádu nebo mít pověst [Concept('dreadful','hrůzostrašné')|E] osoby"
 fp3_misc_decisions.0027.accept: "[recipient.GetFirstNameNoTooltip|U] přijme tvůj argument"
 fp3_misc_decisions.0027.bargain: "[recipient.GetFirstNameNoTooltip|U] chce něco na oplátku"
 fp3_misc_decisions.0027.bargain.tt: "[recipient.GetFirstName|U] vznese požadavek"
 fp3_misc_decisions.0027.reject: "[recipient.GetFirstNameNoTooltip|U] tvůj argument odmítne"
 fp3_misc_decisions.0027.c: "Odpusť mi, ale #EMP víš#!, že mám větší schopnosti."
 fp3_misc_decisions.0027.c.trigger: "Tvé souhrnné [Concept('skills','dovednosti')|E] musí být vyšší než [Select_CString(recipient.IsFemale,'její','jeho')|l]"
 fp3_misc_decisions.0027.c.tt: "Tato možnost je dostupná, protože jsou tvé souhrnné [Concept('skills','dovednosti')|E] vyšší než dovednosti [recipient.Custom('CZ_FirstNameNoTooltip_G')]"
 fp3_misc_decisions.0027.d: "Tak pojď, [recipient.Custom('CZ_FirstNameNoTooltip_V')], ustup."
 fp3_misc_decisions.0028.desc: "[actor.GetFirstName|U] [Select_CString(actor.IsFemale,'dorazila','dorazil')|l] na místo setkání. [duel_location.GetBaseNameNoTierNoTooltip|U] bude svědkem [Select_CString(actor.IsFemale,'jejích','jeho')|l] pochybných důvodů pro převzetí vedení rodu [actor.GetHouse.GetBaseName]. Ze zdvořilosti se před rozhovorem obejmeme.\n\nVypráví o dějinách našeho rodu od dob [actor.GetHouse.GetFounder.Custom('CZ_TitledFirstName_G')] až po současnost a já trpělivě čekám na jádro argumentu.\n\nKonečně zazní: „[actor.Custom2('CZ_RelationToMeShort_V', SCOPE.sC('recipient'))|U]..."
 fp3_misc_decisions.0028.desc.founder: "[actor.GetFirstName|U] [Select_CString(actor.IsFemale,'dorazila','dorazil')|l] na místo setkání. [duel_location.GetBaseNameNoTierNoTooltip|U] bude svědkem [Select_CString(actor.IsFemale,'jejích','jeho')|l] pochybných důvodů pro převzetí vedení rodu [actor.GetHouse.GetBaseName]. Ze zdvořilosti se před rozhovorem obejmeme.\n\nVypráví o dějinách našeho rodu od dávných předků až po současnost a já trpělivě čekám na jádro argumentu.\n\nKonečně zazní: „[actor.Custom2('CZ_RelationToMeShort_V', SCOPE.sC('recipient'))|U]..."
 fp3_misc_decisions.0028.sick: "$fp3_misc_decisions.0027.a.sick$“ Takže jde o mé zdraví...? $fp3_misc_decisions.0028.perhaps$"
 fp3_misc_decisions.0028.old: "$fp3_misc_decisions.0027.a.old$“ Takže jde o můj věk...? $fp3_misc_decisions.0028.perhaps$"
 fp3_misc_decisions.0028.young: "$fp3_misc_decisions.0027.a.young$“ Takže jde o mé mládí...? $fp3_misc_decisions.0028.perhaps$"
 fp3_misc_decisions.0028.vassal: "$fp3_misc_decisions.0027.b.vassal$“ To nepopírám. $fp3_misc_decisions.0028.perhaps$"
 fp3_misc_decisions.0028.tier: "$fp3_misc_decisions.0027.b.tier$“ To nepopírám. $fp3_misc_decisions.0028.perhaps$"
 fp3_misc_decisions.0028.military: "$fp3_misc_decisions.0027.b.military$“ To nepopírám. $fp3_misc_decisions.0028.perhaps$"
 fp3_misc_decisions.0028.dread: "$fp3_misc_decisions.0027.b.dread$“ Ta drzost! I když... $fp3_misc_decisions.0028.perhaps$"
 fp3_misc_decisions.0028.skill: "$fp3_misc_decisions.0027.c$“\n\nNemám přece tak malé schopnosti! Nebo ano...?"
 fp3_misc_decisions.0028.fallback: "$fp3_misc_decisions.0027.a.sick$“ To je opravdu všechno, co mi chce říci?"
 fp3_misc_decisions.0028.perhaps: "Možná má pravdu."
 fp3_misc_decisions.0028.bargain.tt: "Pokud [actor.GetShortUIName] [Select_CString(actor.IsLocalPlayer,'přijmeš','přijme')|l]:"
 fp3_misc_decisions.0028.a: "Máš pravdu, náš rod máš vést #EMP ty#!."
 fp3_misc_decisions.0028.b: "Dobrá, ale [Select_CString(ROOT.Char.IsFemale,'ráda','rád')|l] bych nadále [Select_CString(ROOT.Char.IsFemale,'působila','působil')|l] jako [Select_CString(ROOT.Char.IsFemale,'poradkyně','poradce')|l]."
 fp3_misc_decisions.0028.c: "[Select_CString(actor.IsFemale,'Schopná vůdkyně','Schopný vůdce')|U] má jistě dost mincí, aby [Select_CString(actor.IsFemale,'dostála','dostál')|l] svému slovu."
 fp3_misc_decisions.0028.d: "Možná bys [Select_CString(actor.IsFemale,'mohla','mohl')|l] převzít vedení, ale chci tvou záruku."
 fp3_misc_decisions.0028.e: "Ne, myslím, že ne."
 fp3_misc_decisions.0029.desc: "[recipient.GetFirstName|U] zvažuje má slova a bedlivě zkoumá mou tvář, zatímco kolem nás dvůr šumí. Po chvíli, která se zdá nekonečná, "
 fp3_misc_decisions.0029.desc.no_court: "[recipient.GetFirstName|U] zvažuje má slova a bedlivě zkoumá mou tvář, zatímco místnost kolem nás šumí. Po chvíli, která se zdá nekonečná, "
 fp3_misc_decisions.0029.accept: "přikývne.\n\n„Ano. Možná máš pravdu,“ řekne zamyšleně. „Od tohoto dne budeš hlavou rodu [actor.GetHouse.GetBaseName]. Kéž [recipient.GetFaith.HighGodName] vede tebe i náš rod.“"
 fp3_misc_decisions.0029.regent: "se napřímí.\n\n„Možná bych [Select_CString(recipient.IsFemale,'byla ochotna','byl ochoten')|l] ustoupit,“ řekne opatrně, „kdybys mi [Select_CString(actor.IsFemale,'dala','dal')|l] místo ve vládě. [actor.GetPrimaryTitle.GetBaseNameNoTooltip|U] tak může využít i mé schopnosti...“"
 fp3_misc_decisions.0029.gold: "pozvedne obočí.\n\n„Možná bych [Select_CString(recipient.IsFemale,'byla ochotna','byl ochoten')|l] ustoupit,“ řekne opatrně, „kdybys nejprve [Select_CString(actor.IsFemale,'prokázala','prokázal')|l], že máš dost bohatství k péči o náš rod...“"
 fp3_misc_decisions.0029.hook: "se usměje.\n\n„Možná bych [Select_CString(recipient.IsFemale,'byla ochotna','byl ochoten')|l] ustoupit,“ řekne opatrně, „kdybys mi [Select_CString(actor.IsFemale,'zaručila','zaručil')|l], že zůstaneme [Select_CString(And(actor.IsFemale,recipient.IsFemale),'přítelkyněmi','přáteli')|l]...“"
 fp3_misc_decisions.0029.fail: "se zamračí.\n\n„Ne. Tvé argumenty jsou slabé,“ řekne odmítavě. „Jako právoplatná hlava rodu [actor.GetHouse.GetBaseName] ti přikazuji, ať na tuto směšnou myšlenku zapomeneš.“"
 fp3_misc_decisions.0029.a: "Udělám vše, co dokážu."
 fp3_misc_decisions.0029.b: "Dobrá, stane se."
 fp3_misc_decisions.0029.c: "O osudu naší rodiny se nesmlouvá."
 fp3_misc_decisions.0029.d: "[Select_CString(recipient.IsFemale,'Ta hlupačka','Ten hlupák')|U] mou cenu #EMP pozná#!. Tak či onak."
 fp3_misc_decisions.0030.desc: "[recipient.GetFirstName|U] zamyšleně zvažuje můj návrh a zkoumavě se mi dívá do očí.\n\n"
 fp3_misc_decisions.0030.accept: "Nakonec si povzdechne. „Dobrá, [house_challenger.Custom2('CZ_RelationToMeShort_V', SCOPE.sC('house_head'))|l], dostaneš, co chceš.“"
 fp3_misc_decisions.0030.reject: "Nakonec zavrtí hlavou a s jistým pohrdáním řekne: „O osudu naší rodiny se nesmlouvá!“"
 fp3_misc_decisions.0030.a: "Velmi dobře!"
 fp3_misc_decisions.0030.b: "Pak už není o čem mluvit..."
 fp3_misc_decisions.0041.intro: "Když se [house_head.GetFirstName] otočí k odchodu s tváří zkřivenou pohrdáním, využiji příležitosti.\n\n"
 fp3_misc_decisions.0041.desc.success: "[Select_CString(house_head.IsFemale,'Ta hlupačka','Ten hlupák')|U] sotva postřehne můj rychlý pohyb a téměř nestihne zareagovat, když [Select_CString(house_head.IsFemale,'jí','mu')|l] vrazím dýku do hrudi.\n\nNechápavě pohlédne dolů. Přiblížím se a zašeptám: „Rod [ROOT.Char.GetHouse.GetBaseNameNoTooltip] je #bold #EMP MŮJ!#!#!“ Pak vytrhnu čepel z [Select_CString(house_head.IsFemale,'jejího','jeho')|l] břicha."
 fp3_misc_decisions.0041.desc.failure: "[Select_CString(house_head.IsFemale,'Ta prohnaná mrcha','Ten prohnaný pes')|U] uskočí právě včas, aby se [Select_CString(house_head.IsFemale,'vyhnula','vyhnul')|l] mé dýce, a volá stráže! Než [Select_CString(house_head.IsFemale,'ji','ho')|l] zaženu do kouta, jsou u mě a silou mě přitisknou k podlaze.\n\n[Select_CString(house_head.IsFemale,'Má','Můj')|U] [house_challenger.Custom2('RelationToMeShort', SCOPE.sC('house_head'))|l] stojí nade mnou a zavrčí: „Hoďte toho hada do žaláře!“"
 fp3_misc_decisions.0041.a: "K vedení rodu je třeba lstivosti, [house_challenger.Custom2('CZ_RelationToMeShort_V', SCOPE.sC('house_head'))|l]!"
 fp3_misc_decisions.0041.b: "Za to zaplatíš!"
 fp3_misc_decisions.0042.intro: "Otočím se k odchodu a chci nechat [house_challenger.Custom('CZ_FirstName_A')] napospas potupě i zlovolným myšlenkám. Vtom však zahlédnu záblesk."
 fp3_misc_decisions.0042.desc: "$fp3_misc_decisions.0042.intro$\n\nUskočím právě včas, abych se [Select_CString(ROOT.Char.IsFemale,'vyhnula','vyhnul')|l] [Select_CString(house_challenger.IsFemale,'její','jeho')|l] dýce, a volám stráže.\n\nBrzy [Select_CString(house_challenger.IsFemale,'ji','ho')|l] přitisknou k podlaze. Svíjí se a křičí: „Rod [ROOT.Char.GetHouse.GetBaseNameNoTooltip] je #bold #EMP MŮJ!#!#!“"
 fp3_misc_decisions.0042.a: "Hoďte toho hada do žaláře!"
 fp3_misc_decisions.0043.desc: "$fp3_misc_decisions.0042.intro$\n\n[Select_CString(house_challenger.IsFemale,'Ta stvůra','Ten ničema')|U] stojí přede mnou se zlovolným zábleskem v oku, paží nataženou a pěstí sevřenou kolem jílce...\n\nPřiblíží se a zašeptá: „Rod [ROOT.Char.GetHouse.GetBaseNameNoTooltip] je #bold #EMP MŮJ!#!#!“ Pak mi vytrhne čepel z břicha."
 fp3_misc_decisions.0043.a: "#DIE1 [house_head.Custom2('CZ_RelationToMeShort_V', SCOPE.sC('house_challenger'))|U]....#!"
 fp3_misc_decisions.0051.t: "Zvyklosti rodu"
 fp3_misc_decisions.0051.desc: "Teď vidím, že pouta rodiny jsou nejdůležitějším klíčem ke spravedlivé a stabilní vládě.\n\nPo vzoru [ROOT.Char.GetHouse.GetHeadOfHouse.Custom('CZ_TitledFirstName_G')] jsem [Select_CString(ROOT.Char.IsFemale,'nařídila','nařídil')|l] přestavět vládu. [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip|U] se nyní bude řídit zvyklostmi rodu [ROOT.Char.GetHouse.GetBaseName]."
 fp3_misc_decisions.0051.a: "Rodina především!"
 fp3_struggle.8000.t: "[attacker.Custom2('AppropriateGreeting', ROOT.Char)|U]"
 fp3_struggle.8000.desc: "Zrada [Select_CString(defender.IsFemale,'tvé lenní paní','tvého lenního pána')|l] [defender.Custom('CZ_TitledFirstName_G')] vůči právoplatnému chalífovi se blíží ke konci.\n\nJako [Select_CString(attacker.IsFemale,'věrná stoupenkyně','věrný stoupenec')|l] zajistím, abys [Select_CString(ROOT.Char.IsFemale,'usedla','usedl')|l] na trůn místo [Select_CString(defender.IsFemale,'ní','něj')|l]. [defender.GetPrimaryTitle.GetBaseNameNoTierNoTooltip|U] tak získá nové vedení."
 fp3_struggle.8000.a: "Opravdu?"
 fp3_struggle.8001.desc: "Tvá zrada vůči právoplatnému chalífovi se blíží ke konci.\n\nJe načase, aby [loyalist_puppet.GetTitledFirstName], [Select_CString(loyalist_puppet.IsFemale,'věrná stoupenkyně','věrný stoupenec')|l], [Select_CString(loyalist_puppet.IsFemale,'vládla','vládl')|l] místo tebe. [defender.GetPrimaryTitle.GetBaseNameNoTierNoTooltip|U] tak získá nové vedení."
 fp3_struggle.8001.a: "Jen přes mou mrtvolu!"
 fp3_struggle.8002.desc: "[Select_CString(defender.IsFemale,'Ta zrádkyně','Ten zrádce')|U] [defender.GetTitledFirstName] [Select_CString(defender.IsFemale,'byla konečně poražena','byl konečně poražen')|l]. [defender.GetPrimaryTitle.GetBaseNameNoTierNoTooltip|U] je znovu v rukou [Select_CString(ROOT.Char.IsFemale,'věrné přívrženkyně','věrného přívržence')|l] chalífy.\n\nKéž je tvá vláda dlouhá a požehnaná!"
 fp3_struggle.8002.a: "Hurá!"
 fp3_struggle.8002.alliance_tt: "[attacker.GetTitledFirstName|U] nyní patří mezi tvé [Concept('ally','spojence')|E]"
 install_loyalist_puppet_declared_puppet: "Válka za dosazení věrného přívržence"
 install_loyalist_puppet_declared_defender: "$install_loyalist_puppet_declared_puppet$"
 install_loyalist_puppet_won_puppet: "$install_loyalist_puppet_declared_puppet$"
 fp3_misc_decisions.0031.desc.intro: "Jak jsem si [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')|l]: navzdory pohoršení některých šlechticů se i v drobných úřadech a nižších správních pozicích najde nadání. [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|U] má z čeho vybírat.\n\nKandidáty na povýšení lze snadno rozdělit na pouhé dvě skupiny. Na jedné straně [batch_a_char1.GetFirstName], [batch_a_char2.GetFirstName] a [batch_a_char3.GetFirstName], na druhé [batch_b_char1.GetFirstName] a [batch_b_char2.GetFirstName].\n\n"
 fp3_misc_decisions.0031.desc.cultures.single: "Všichni pocházejí z [batch_a_county.GetProvince.GetCounty.GetCulture.Custom('CZ_Adjective_eeho')|l] obyvatelstva. Jejich domovem je [batch_a_county.GetBaseNameNoTier]. Skupina kolem [batch_a_char1.Custom('CZ_FirstNameNoTooltip_G')] má schopnosti, ale trochu jí schází vytříbené vzdělání. [batch_b_char1.GetFirstNameNoTooltip|U] a [Select_CString(batch_b_char1.IsFemale,'její','jeho')|l] [Select_CString(batch_b_char2.IsFemale,'družka','druh')|l] jsou o něco kultivovanější, ale jsou jen [Select_CString(And(batch_b_char1.IsFemale,batch_b_char2.IsFemale),'dvě','dva')|l]."
 fp3_misc_decisions.0031.desc.cultures.fallback: "Skupina kolem [batch_a_char1.Custom('CZ_FirstNameNoTooltip_G')] má schopnosti, i když je méně vzdělaná. Jejím lidem jsou [batch_a_county.GetProvince.GetCounty.GetCulture.GetCollectiveNoun] a jejím domovem je [batch_a_county.GetBaseNameNoTier]. [batch_b_char1.GetFirstNameNoTooltip|U] a [Select_CString(batch_b_char1.IsFemale,'její','jeho')|l] [Select_CString(batch_b_char2.IsFemale,'družka','druh')|l] jsou #EMP trochu#! kultivovanější. Jejich rodáci jsou [batch_b_county.GetProvince.GetCounty.GetCulture.GetCollectiveNoun] a jejich domovem je [batch_b_county.GetBaseNameNoTier]."
 fp3_misc_decisions.0031.tt.all_outsiders: "Všichni cizinci vstupující na tvůj dvůr"
 fp3_misc_decisions.0031.tt.all_outsiders.you_gain_hook: "Získáš na ně [Concept('strong_hook','silnou páku')|E] #WEAK ($loyalty_hook$)#!"
 fp3_misc_decisions.0031.a: "[batch_a_char1.GetFirstNameNoTooltip|U] a [Select_CString(batch_a_char1.IsFemale,'její','jeho')|l] [Select_CString(And(batch_a_char2.IsFemale,batch_a_char3.IsFemale),'družky','druhové')|l] se skvěle hodí na můj dvůr."
 fp3_misc_decisions.0031.b: "Větší dojem na mě dělá [batch_b_char1.GetFirstNameNoTooltip]..."
 fp3_misc_decisions.0031.c: "Nikdo z vás se nehodí. Zpět na svá místa!"
 fp3_misc_decisions.0031.c.tt: "Cizinci promarní příležitost získat vliv"
