 fp3_rally_troops_in_rebellion_decision: "Shromáždit vojsko k povstání"
 fp3_rally_troops_in_rebellion_decision_desc: "Uprostřed chaosu vždy vyvstane příležitost. Ani tato doba není výjimkou. Zastávám úřad [ROOT.Char.Custom('GetCouncilOrCourtPosition')] a mám stovky, možná i tisíce druhů připravených pomoci mi získat vlastní země. Kdysi mi panství [ROOT.Char.GetLiege.GetPrimaryTitle.GetBaseName] přiznalo zásluhy a svěřilo nepatrnou moc. Dnes, s mečem v ruce, dosáhnu svých skutečných ambicí."
