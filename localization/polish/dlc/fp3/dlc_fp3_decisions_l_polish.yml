 fp3_name_read_in_friday_prayer_decision.supporter_turns_detractor.desc: "$fp3_name_read_in_friday_prayer_decision.supporter_turns_detractor.desc.boilerplate$\n\nTím, že vynechám jméno chalífy ze seznamu, oznamuji celé Ummě, že se #EMP sám#! považuji za nejvyššího pána svého panství."
