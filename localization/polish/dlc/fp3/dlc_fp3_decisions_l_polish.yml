 avenge_the_battle_of_nahrawan_decision_desc: "V raných dnech [ROOT.Char.GetFaith.GetReligion.GetName], poté co nás zradil Rášídúnský chalífát, byli Muhakkima hanebně poraženi v bitvě u Nahrawanu. Od té doby neúprosně bojujeme za zničení všech odpadlíků a dokazujeme, že souzení náleží pouze [ROOT.Char.GetFaith.HighGodNameAlternate]. Rozhodl jsem se ukončit boj proti falešným věřícím jednou provždy."
