 invite_former_slave_soldiers_decision: "Naverbovat kmenové bojovníky"
 invite_former_slave_soldiers_decision_desc: "Jako [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], vždy potřebuji nebojácné duše, které zaplní řady mých elitních $knight_culture_player_plural_no_tooltip_lowercase$. Pro statečné a odvážné není lepší zdroj než bojovníci z mnoha rozptýlených kmenů uvnitř a kolem mé říše, proto mohu nařídit svému [Concept('marshal','maršálovi')|E] vybrat ty nejlepší, aby sloužili přímo mému dvoru." # todo: CONCEPT CASE
