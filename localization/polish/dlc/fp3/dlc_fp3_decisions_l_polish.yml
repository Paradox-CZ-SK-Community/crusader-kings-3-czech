 fp3_promote_persian_scripture_decision_name: "Podpořit perské svaté texty"
 fp3_promote_persian_scripture_decision_desc: "Arabština je už dlouho považována za nadřazený jazyk, zejména v otázkách víry. Nastal čas tuto představu zpochybnit, podpořit islámskou literaturu v perštině a přeložit i důležité hadísy. U Arabů, konzervativních vazalů ani kněží mi to možná oblibu nezíská, ale lid si zaslouží poznávat ve vlastní řeči, jako za dávných časů, jakou cestu ukazuje [ROOT.Char.GetFaith.HighGodNameAlternate]."
