 fp3_promote_persian_scripture_decision_name: "Prosazovat perské spisy"
 fp3_promote_persian_scripture_decision_desc: "Arabština byla dlouho považována za nadřazenou, zejména v náboženských záležitostech. Nyní je čas zpochybnit toto přesvědčení, podporovat islámskou literaturu v perštině a dokonce překládat důležité hadísy. To mi nemusí přinést sympatie Arabů ani konzervativních vazalů a duchovních, ale lidé si zaslouží znát [ROOT.Char.GetFaith.HighGodNameAlternate] ve svém vlastním jazyce, jak tomu bylo kdysi."
