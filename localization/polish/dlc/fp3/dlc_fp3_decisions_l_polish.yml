 destroy_the_magi_decision_desc: "Dlouho měli lidé na venkově své vlastní praktiky a sami pečovali o věčné ohně. Je čas, aby spletité rituály a hierarchické doktríny ustaveného kněžstva skončily, aby role [ROOT.Char.GetFaith.PriestNeuter] byla dostupná komukoli, kdo si získá důvěru společenství."
 destroy_the_magi_decision_alternate_desc: "Dlouho bylo [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] zamotáno v pověrách a archaických rituálech, utlačováno kněžími toužícími po moci. Nastal čas uvést novou éru, víru pro moderní svět. Ukončím schátralé uctívání ohně a zreformuji [ROOT.Char.GetFaith.random_AltPriestTermPlural] na svých územích."
