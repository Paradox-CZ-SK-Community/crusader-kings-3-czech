 avenge_the_battle_of_nahrawan_decision_desc: "V počátcích náboženství [ROOT.Char.GetFaith.GetReligion.GetName] utrpěli muhakkimité po zradě rāšidského chalífátu potupnou porážku v bitvě u Nahrawánu. Od té doby neúnavně bojujeme za zničení všech odpadlíků a za důkaz, že jedinou soudní autoritou je [ROOT.Char.GetFaith.HighGodNameAlternate]. Rozhodně skoncujeme s bojem proti falešným věřícím jednou provždy."
