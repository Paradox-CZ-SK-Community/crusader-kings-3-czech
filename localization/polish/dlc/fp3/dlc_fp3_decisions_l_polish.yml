 restore_badd_fortress_decision_desc: "Krajina kolem [GetTitleByKey('b_ahar').GetNameNoTier] je strmou spleťí zubatých skal, vysokých hor a hlubokých dubových lesů. Zde stojí ruiny mohutné staré pevnosti khurramitského vůdce Babaka, posazené na vysoké hoře, chráněné ledem a sněhem. Pokud bych ji mohl obsadit a obnovit, mohl bych získat strategickou pevnost pro těžce zkoušenou [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] víru."
