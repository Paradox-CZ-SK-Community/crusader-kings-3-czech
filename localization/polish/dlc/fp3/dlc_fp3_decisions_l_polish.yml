 fp3_name_read_in_friday_prayer_decision.supporter_turns_detractor.desc: "$fp3_name_read_in_friday_prayer_decision.supporter_turns_detractor.desc.boilerplate$\n\nVyškrtnutím chalífova jména z tohoto seznamu celé ummě oznamuji, že nejvyšší autoritu nad svými zeměmi mám #EMP já#!."
