 invite_former_slave_soldiers_decision: "Naverbovat kmenové válečníky"
 invite_former_slave_soldiers_decision_desc: "Jsem [ROOT.Char.GetTitleAsNameNoTooltip] a vládnu [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_D')]. Neustále potřebuji nebojácné duše do řad své elity: $knight_culture_player_plural_no_tooltip_lowercase$. Odvážnější a smělejší lidi nenajdu nikde než mezi válečníky mnoha roztroušených kmenů v mém panství a jeho okolí. Mohu proto svému [Concept('marshal','maršálovi')|E] nařídit, aby z nich vybral ty nejlepší pro přímou službu mému dvoru."
 invite_former_slave_soldiers_decision_confirm: "Ať přede mě předstoupí ti nejlepší!"
 invite_former_slave_soldiers_decision_tooltip: "Pozvi kmenové válečníky k věrné službě: $knight_culture_player_plural_no_tooltip$"
 invite_former_slave_soldiers_decision_effect_desc: "Do dvou měsíců na tvůj [Concept('court','dvůr')|E] nastoupí #P jedna či více#! osob s vysokou [Concept('prowess','udatností')|E] podle dovednosti [Concept('stewardship','správcovství')|E] tvého [Concept('marshal','maršála')|E]."
