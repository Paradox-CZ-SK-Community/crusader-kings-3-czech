 choose_alevi_desc: "[GetRiteByKey('alevi').GetName|U]"
 choose_alevi_tooltip: "Jedním z mnoha dobrých přínosů turkických kmenů je [Concept('faith','víra')|E] vyznávající ritus [GetRiteByKey('alevi').GetAdjective|l]. Díky zásadám [GetTenetType('tenet_esotericism').GetBaseName] a [GetTenetType('tenet_inner_journey').GetBaseName] naši vládci zmoudří více než kdy předtím, přestože budeme řazeni k doktríně [GetDoctrineType('muhammad_succession_zandaqa_doctrine').GetBaseName]."
