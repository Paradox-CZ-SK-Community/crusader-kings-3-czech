 fp3_rally_troops_in_rebellion_decision_desc: "Uprostřed chaosu se vždy naskytne příležitost. Tato doba není výjimkou — jako [ROOT.Char.Custom('GetCouncilOrCourtPosition')] mám stovky — možná i tisíce — spojenců připravených spojit se a pomoci mi získat vlastní území. Kdysi [ROOT.Char.GetLiege.GetPrimaryTitle.GetBaseName] uznal mé zásluhy a dal mi mizivou moc. Dnes, s mečem v ruce, osud místo toho uzná mé skutečné ambice."
