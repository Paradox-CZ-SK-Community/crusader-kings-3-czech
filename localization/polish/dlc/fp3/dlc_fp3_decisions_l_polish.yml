 restore_badd_fortress_decision_desc: "Krajina kolem [GetTitleByKey('b_ahar').Custom('CZ_LandedNameNoTier_G')] je drsným bludištěm rozeklaných skal, vysokých hor a hlubokých dubových lesů. Zde leží trosky někdejší mohutné pevnosti churramitského vůdce Bábaka, vysoko na hoře, chráněné ledem a sněhem. Pokud ji získám a obnovím, zajistím strategickou oporu pro sužovanou [ROOT.Char.GetFaith.Custom('CZ_AdjectiveNoTooltip_ou')|l] víru."
