 favour_skilled_outsiders_decision_desc: "V mé správě zastávají vedoucí místa lidé, kteří pro ně nemají téměř žádné vlohy. Nadání jejich podřízených však zůstává pohřbené pod silnou vrstvou neschopnosti a průměrnosti jen proto, že je [ROOT.Char.GetCulture.Custom('CZ_Adjective_aa')|l] šlechta, k níž patřím i já, považuje za cizí.\n\nProč by tolik mých nejlepších poddaných nemělo v mé službě dosáhnout výš?"
