 destroy_the_magi_decision_desc: "Venkovský lid má už dlouho vlastní zvyky a o věčné ohně se stará sám. Nastal čas skoncovat se spletitými rituály a hierarchickými doktrínami zavedeného kněžstva. Úřad [ROOT.Char.GetFaith.PriestNeuter] má být přístupný každému, komu společenství důvěřuje."
 destroy_the_magi_decision_alternate_desc: "[ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip|U] se už dlouho utápí v pověrách a archaických rituálech pod jhem kněží bažících po moci. Nastal čas nové éry, víry pro moderní svět. Skoncuji se skomírajícím uctíváním ohně a reformou projdou [ROOT.Char.GetFaith.random_AltPriestTermPlural] v mých zemích."
