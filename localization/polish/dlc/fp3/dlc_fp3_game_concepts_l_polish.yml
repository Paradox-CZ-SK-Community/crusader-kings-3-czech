l_polish:
 game_concept_persian_struggle: "Íránské intermezzo"
 game_concept_persian_struggle_desc: "$game_concept_persian_struggle$ zachycuje bouřlivý úpadek Abbásovského chalífátu, během něhož Mezopotámii sužovala povstání a mocenské sváry a několik perských vládců prosadilo svou nezávislost.\n\nAčkoli [Concept('struggle_involved','zapojené')|E] [Concept('characters','postavy')|E] mohou mít mnoho cílů, většina z nich bude chtít buď získat [GetTrait('fp3_struggle_supporter').GetName( GetNullCharacter )] a usilovat o obnovení moci chalífátu, nebo získat [GetTrait('fp3_struggle_detractor').GetName( GetNullCharacter )] a pokusit se jej zničit.\n\n[Concept('struggle','Svár')|E] přechází mezi dvěma [Concept('struggle_phase_phases','fázemi')|E] – [Concept('struggle_persia_phase_unrest','nepokoji')|E] a [Concept('struggle_persia_phase_stabilisation','stabilizací')|E]."
 game_concept_kindle_royal_fire_decision: "Rozhodnutí zažehnout královský oheň"
 game_concept_kindle_royal_fire_decision_desc: "[Concept('decision','Rozhodnutí')|E], které ti umožňuje zažehnout královský oheň a získat bonusy ke [Concept('health','zdraví')|E] a [Concept('dynasty_prestige','věhlasu')|E]."
 game_concept_fp3_embellish_capital_decision: "Rozhodnutí $fp3_embellish_capital_decision_name$"
 game_concept_fp3_embellish_capital_decision_desc: "[Concept('decision','Rozhodnutí')|E], které ti umožňuje vylepšit své [Concept('capital','hlavní sídlo')|E] za cenu nedávno dobytého [Concept('county','hrabství')|E]"
 game_concept_master_assassin: "Mistr asasínů"
 game_concept_master_assassin_desc: "$game_concept_master_assassin$ je [Concept('court_position','dvorský úřad')|E] umožněný [Concept('faiths','vírami')|E] se [Concept('core_tenet','zásadou')|E] [GetFaithDoctrine('tenet_fp3_fedayeen').GetBaseName]. $game_concept_master_assassin$ je nebezpečný fanatik, který spolupracuje s nižšími asasíny na zabíjení domnělých nepřátel víry."
 game_concept_assassin: "Asasín"
 game_concept_research_project: "Výzkumný projekt"
 game_concept_research_projects: "Výzkumné projekty"
 game_concept_research_project_desc: "$game_concept_research_project$ je [Concept('inspiration','inspirace')|E], která se opírá o [Concept('aptitude','způsobilost')|E] $court_scholar_court_position$ a přináší výhody jeho zaměstnavateli.\n\nV některých vzácných případech může výzkumný projekt odhalit novou [Concept('innovation','inovaci')|E]."
 game_concept_ending_phase: "Závěrečná fáze"
 game_concept_ending_phase_desc: "$game_concept_ending_phase$ je zvláštní typ [Concept('struggle_phase','fáze sváru')|E], která při spuštění ukončí [Concept('struggle','svár')|E]. [Concept('struggle_involved','Zapojené')|E] a [Concept('struggle_interloper','vetřelecké')|E] [Concept('characters','postavy')|E] mohou k závěrečné fázi postupovat běžným způsobem, pomocí [Concept('struggle_catalyst_catalysts','katalyzátorů')|E]."
 game_concept_struggle_ending_decision: "Rozhodnutí o ukončení"
 game_concept_struggle_ending_decisions: "Rozhodnutí o ukončení"
 game_concept_struggle_ending_decision_desc: "$game_concept_struggle_ending_decision$ je jedinečné [Concept('decision','rozhodnutí')|E], které ukončí [Concept('struggle','svár')|E]. Taková rozhodnutí bývají často dostupná pouze během určitých [Concept('struggle_phase_phases','fází')|E]."
 game_concept_struggle_persia_phase_stabilisation: "Stabilizace"
 game_concept_struggle_persia_phase_stabilisation_desc: "Navzdory narůstajícím potížím si chalífa stále získává úctu. Povstání a frakcionářství jsou na ústupu, ale páni Persie se nenechají snadno zkrotit.\n\nNapětí může přerůst v [Concept('struggle_persia_phase_unrest','nepokoje')|E], což by znamenalo další chaos."
 game_concept_struggle_persia_phase_unrest: "Nepokoje"
 game_concept_struggle_persia_phase_unrest_desc: "Chalífát, sužovaný povstáními a intrikami, se rozpadá. Ctižádostiví vojevůdci i prohnaní guvernéři se chápou každé moci, kterou si mohou uzurpovat, a neustále se přou.\n\nČasem, pokud situaci nevyřeší [Concept('ending_phase','závěrečná fáze')|E], vstoupí panství do fáze [Concept('struggle_persia_phase_stabilisation','stabilizace')|E], zatímco zoufalí podporovatelé budou obnovovat chalífovu autoritu."
 game_concept_struggle_persia_phase_concession: "Ústupek"
 game_concept_struggle_persia_phase_concession_desc: "Časem, jak napětí v Persii poleví a podporovatelé i odpůrci chalífátu se unaví neustálým krveprolitím, může [Concept('persian_struggle','íránské intermezzo')|E] dojít k přirozenému konci: ne s rachotem, ale s tichým povzdechem."
 game_concept_fp3_request_turkic_invasion_interaction: "$fp3_request_turkic_invasion_interaction$"
 game_concept_fp3_request_turkic_invasion_interaction_desc: "Financuj libovolného [Concept('ruler','vládce')|E] turkického původu, aby dobyl kteréhokoli z tvých sousedních vládců"
 game_concept_fp3_install_loyalist_cb: "Dosadit podporovatele"
 game_concept_fp3_install_loyalist_cb_desc: "Umožňuje ti vést [Concept('war','válku')|E] s cílem dosadit [GetTrait('fp3_struggle_supporter').GetName( GetNullCharacter )] chalífátu do čela cílového [Concept('realm','panství')|E]"
 game_concept_fp3_demand_submission_interaction: "$fp3_demand_submission_interaction$"
 game_concept_fp3_demand_submission_interaction_desc: "Vyžádej si věrnost [Concept('character_possessive','postavy')|E] v podobě [Concept('hook','páky')|E] pomocí zbožnosti, lsti nebo zastrašení."
 game_concept_fp3_request_house_unity_change_interaction: "$fp3_request_house_unity_change_interaction$"
 game_concept_fp3_request_house_unity_change_interaction_desc: "$fp3_request_house_unity_change_interaction_desc$"
 game_concept_fp3_request_honorary_titles_interaction: "$fp3_request_honorary_titles_interaction$"
 game_concept_fp3_request_honorary_titles_interaction_desc: "$fp3_request_honorary_titles_interaction_desc$"
 game_concept_fp3_free_house_member_cb: "$fp3_free_house_member_cb_name$"
 game_concept_fp3_free_house_member_cb_desc: "[Concept('casus_belli','Casus belli')|E] dostupný [Concept('house_heads','hlavám rodů')|E], který přinutí cíl propustit každého [Concept('imprisoned','uvězněného')|E] člena [Concept('house','rodu')|E]."
 game_concept_fp3_unify_house_cb: "$fp3_unify_house_cb_name$"
 game_concept_fp3_unify_house_cb_desc: "[Concept('casus_belli','Casus belli')|E], který [Concept('house_head','hlavě rodu')|E] umožňuje získat členy [Concept('house','rodu')|E] z jiného [Concept('realm','panství')|E] jako [Concept('vassal','vazala')|E]."
