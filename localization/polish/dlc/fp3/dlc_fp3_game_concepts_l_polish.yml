l_polish:
 game_concept_persian_struggle: "Íránské intermezzo"
 game_concept_persian_struggle_desc: "$game_concept_persian_struggle$ zachycuje bouřlivý úpadek abbásovského chalífátu, během něhož Mezopotámii sužovala povstání a mocenské boje a několik perských vládců si vydobylo nezávislost.\n\nAčkoli [Concept('struggle_involved','zapojené')|E] [Concept('characters','postavy')|E] mohou sledovat nejrůznější cíle, většina z nich se bude chtít buď stát stoupenci chalífátu, získat rys [GetTrait('fp3_struggle_supporter').GetName( GetNullCharacter )] a usilovat o obnovení jeho moci, nebo získat rys [GetTrait('fp3_struggle_detractor').GetName( GetNullCharacter )] a pokusit se chalífát zničit.\n\nV tomto [Concept('struggle','sváru')|E] se střídají dvě [Concept('struggle_phase_phases','fáze')|E]: [Concept('struggle_persia_phase_unrest','Nepokoje')|E] a [Concept('struggle_persia_phase_stabilisation','Stabilizace')|E]."
 game_concept_kindle_royal_fire_decision: "Rozhodnutí zažehnout královský oheň"
 game_concept_kindle_royal_fire_decision_desc: "[Concept('decision','Rozhodnutí')|EU], které ti umožňuje zažehnout královský oheň a získat bonusy ke [Concept('health','zdraví')|E] a [Concept('dynasty_prestige','věhlasu')|E]."
 game_concept_fp3_embellish_capital_decision: "Rozhodnutí $fp3_embellish_capital_decision_name$"
 game_concept_fp3_embellish_capital_decision_desc: "[Concept('decision','Rozhodnutí')|EU], které ti umožňuje zvelebit své [Concept('capital','hlavní sídlo')|E] na úkor nedávno dobytého [Concept('county','hrabství')|E]."
 game_concept_master_assassin: "Mistr asasínů"
 game_concept_master_assassin_desc: "$game_concept_master_assassin$ je [Concept('court_position','dvorský úřad')|E] dostupný [Concept('faiths','vírám')|E], které vyznávají [Concept('core_tenet','zásadu')|E] [GetTenetType('tenet_fp3_fedayeen').GetBaseName]. $game_concept_master_assassin$ je nebezpečný fanatik, který spolupracuje s dalšími asasíny nižšího postavení na vraždění domnělých nepřátel víry."
 game_concept_assassin: "Asasín"
 game_concept_research_project: "Výzkumný projekt"
 game_concept_research_projects: "Výzkumné projekty"
 game_concept_research_project_desc: "Výzkumný projekt je [Concept('inspiration','inspirace')|E], při níž $court_scholar_court_position$ využívá svou [Concept('aptitude','způsobilost')|E] k tomu, aby přinesl prospěch svému zaměstnavateli.\n\nVe vzácných případech může výzkumný projekt vést také k objevení nové [Concept('innovation','inovace')|E]."
 game_concept_ending_phase: "Závěrečná fáze"
 game_concept_ending_phase_desc: "$game_concept_ending_phase$ je zvláštní typ [Concept('struggle_phase','fáze sváru')|E], která při svém spuštění ukončí [Concept('struggle','svár')|E]. K jejímu dosažení mohou běžným způsobem přispívat [Concept('struggle_involved','zapojené')|E] [Concept('characters','postavy')|E] i [Concept('struggle_interloper','vetřelci')|E] prostřednictvím [Concept('struggle_catalyst_catalysts','katalyzátorů')|E]."
 game_concept_struggle_ending_decision: "Rozhodnutí o ukončení"
 game_concept_struggle_ending_decisions: "Rozhodnutí o ukončení"
 game_concept_struggle_ending_decision_desc: "$game_concept_struggle_ending_decision$ je jedinečné [Concept('decision','rozhodnutí')|E], které ukončuje [Concept('struggle','svár')|E]. Taková rozhodnutí bývají často dostupná pouze během určitých [Concept('struggle_phase_phases','fází')|E]."
 game_concept_struggle_persia_phase_stabilisation: "Stabilizace"
 game_concept_struggle_persia_phase_stabilisation_desc: "Navzdory narůstajícím problémům se chalífa stále těší úctě. Povstání a soupeřící frakce jsou na ústupu, ale perské vládce nebude snadné přimět k poslušnosti.\n\nNapětí však může znovu vyústit ve fázi [Concept('struggle_persia_phase_unrest','Nepokoje')|E], což by přineslo další chaos."
 game_concept_struggle_persia_phase_unrest: "Nepokoje"
 game_concept_struggle_persia_phase_unrest_desc: "Chalífát se hroutí pod tíhou povstání a intrik. Ctižádostiví vojevůdci i prohnaní místodržící se neustále přou a snaží se urvat co největší podíl na moci.\n\nPokud situaci neukončí [Concept('ending_phase','závěrečná fáze')|E], panství časem přejde do fáze [Concept('struggle_persia_phase_stabilisation','Stabilizace')|E], protože zoufalí stoupenci chalífátu začnou postupně obnovovat jeho autoritu."
 game_concept_struggle_persia_phase_concession: "Ústupek"
 game_concept_struggle_persia_phase_concession_desc: "Jak napětí v Persii postupně opadá a stoupenci i odpůrci chalífátu jsou stále unavenější nekonečným krveprolitím, může [Concept('persian_struggle','Íránské intermezzo')|E] dospět k přirozenému konci. Nikoli s velkým třeskem, ale s tichým povzdechem."
 game_concept_fp3_request_turkic_invasion_interaction: "$fp3_request_turkic_invasion_interaction$"
 game_concept_fp3_request_turkic_invasion_interaction_desc: "Umožňuje financovat kteréhokoli [Concept('ruler','vládce')|E] turkického původu, aby dobyl území některého z tvých sousedních vládců."
 game_concept_fp3_install_loyalist_cb: "Dosadit podporovatele"
 game_concept_fp3_install_loyalist_cb_desc: "Umožňuje vést [Concept('war','válku')|E] s cílem dosadit do čela cílového [Concept('realm','panství')|E] stoupence chalífátu s rysem [GetTrait('fp3_struggle_supporter').GetName( GetNullCharacter )]."
 game_concept_fp3_demand_submission_interaction: "$fp3_demand_submission_interaction$"
 game_concept_fp3_demand_submission_interaction_desc: "Pomocí zbožnosti, lstivosti nebo zastrašování můžeš od [Concept('character_possessive','postavy')|E] vyžadovat věrnost v podobě [Concept('hook','páky')|E]."
 game_concept_fp3_request_house_unity_change_interaction: "$fp3_request_house_unity_change_interaction$"
 game_concept_fp3_request_house_unity_change_interaction_desc: "$fp3_request_house_unity_change_interaction_desc$"
 game_concept_fp3_request_honorary_titles_interaction: "$fp3_request_honorary_titles_interaction$"
 game_concept_fp3_request_honorary_titles_interaction_desc: "$fp3_request_honorary_titles_interaction_desc$"
 game_concept_fp3_free_house_member_cb: "$fp3_free_house_member_cb_name$"
 game_concept_fp3_free_house_member_cb_desc: "[Concept('casus_belli','Casus belli')|EU], které mohou využít [Concept('house_heads','hlavy rodů')|E] k tomu, aby donutily protivníka propustit všechny [Concept('imprisoned','uvězněné')|E] členy [Concept('house','rodu')|E]."
 game_concept_fp3_unify_house_cb: "$fp3_unify_house_cb_name$"
 game_concept_fp3_unify_house_cb_desc: "[Concept('casus_belli','Casus belli')|EU], které umožňuje [Concept('house_head','hlavě rodu')|E] získat členy [Concept('house','rodu')|E] z jiného [Concept('realm','panství')|E] jako své [Concept('vassal','vazaly')|E]."
