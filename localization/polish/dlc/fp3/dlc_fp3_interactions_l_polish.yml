 fp3_antagonize_character_interaction.success_notif.negative.desc: "Šíří se nepříjemné zvěsti a lži; váš [secondary_recipient.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetTitledFirstName] jim uvěřil a začal o vás hůře smýšlet!\n"
 fp3_antagonize_character_interaction.success_notif.negative.desc.alt: "[actor.GetTitledFirstName] šířil přehnané lži o vás, což způsobilo, že váš [secondary_recipient.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetTitledFirstName] o vás začal hůře smýšlet!\n"
 fp3_antagonize_character_interaction.success_notif.negative.desc.alt.alt: "Zvěst není vystopována zpět k vám..."
