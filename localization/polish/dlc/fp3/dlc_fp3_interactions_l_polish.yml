 fp3_antagonize_character_interaction.success_notif.positive.desc: "Příjemné zvěsti o vás se šířily, což způsobilo, že váš [secondary_recipient.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetTitledFirstName] o vás začal lépe smýšlet.\n"
