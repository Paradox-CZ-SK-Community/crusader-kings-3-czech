 fp3_antagonize_character_interaction.success_notif.t: "[recipient.GetTitledFirstNameNoTooltip|U] [Select_CString(recipient.IsFemale,'uvěřila','uvěřil')] zvěstem o tobě"
 fp3_antagonize_character_interaction.success_notif.discovered: "[secondary_recipient.GetTitledFirstNameNoTooltip|U] už o všem ví!"
 fp3_antagonize_character_interaction.success_notif.discovered.tooltip: "[secondary_recipient.GetTitledFirstName|U] [Select_CString(secondary_recipient.IsFemale,'vypátrala','vypátral')], že zvěsti pocházejí od tebe!"
 fp3_antagonize_character_interaction.success_notif.positive.desc: "Začaly se šířit lichotivé zvěsti o tobě a [Select_CString(recipient.IsFemale,'tvá','tvůj')] [secondary_recipient.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetTitledFirstName] o tobě nyní smýšlí lépe.\n"
 fp3_antagonize_character_interaction.success_notif.positive.desc.alt: "[actor.GetTitledFirstName|U] [Select_CString(actor.IsFemale,'šířila','šířil')] lichotivé zvěsti o tobě, díky nimž [Select_CString(recipient.IsFemale,'tvá','tvůj')] [secondary_recipient.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetTitledFirstName] o tobě nyní smýšlí lépe.\n"
 fp3_antagonize_character_interaction.success_notif.negative.desc: "Šíří se o tobě nepříjemné zvěsti a lži. [Select_CString(recipient.IsFemale,'Tvá','Tvůj')] [secondary_recipient.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetTitledFirstName] jim [Select_CString(recipient.IsFemale,'uvěřila','uvěřil')] a nyní o tobě smýšlí hůře!\n"
 fp3_antagonize_character_interaction.success_notif.negative.desc.alt: "[actor.GetTitledFirstName|U] o tobě [Select_CString(actor.IsFemale,'šířila','šířil')] nehorázné lži, kvůli nimž [Select_CString(recipient.IsFemale,'tvá','tvůj')] [secondary_recipient.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetTitledFirstName] o tobě nyní smýšlí hůře!\n"
 fp3_antagonize_character_interaction.success_notif.negative.desc.alt.alt: "Nepodaří se zjistit, že zvěsti pocházejí od tebe..."
 fp3_antagonize_character_interaction.success_tooltip.positive: "Uvěří ti a její [Concept('opinion','mínění')|E] o [secondary_recipient.Custom('CZ_TitledFirstName_L')] se #P zlepší#!"
 fp3_antagonize_character_interaction.success_tooltip.negative: "Uvěří ti a její [Concept('opinion','mínění')|E] o [secondary_recipient.Custom('CZ_TitledFirstName_L')] se #N zhorší#!"
 fp3_antagonize_character_interaction.success_tooltip.positive.past: "[recipient.GetTitledFirstName|U] si o tobě #P [Select_CString(recipient.IsFemale,'zlepšila','zlepšil')]#! [Concept('opinion','mínění')|E]"
 fp3_antagonize_character_interaction.success_tooltip.negative.past: "[recipient.GetTitledFirstName|U] si o tobě #N [Select_CString(recipient.IsFemale,'zhoršila','zhoršil')]#! [Concept('opinion','mínění')|E]"
 fp3_antagonize_character_interaction.recipient_message.fallback: "Měl bys vědět, že [secondary_recipient.GetTitledFirstName] je [secondary_recipient.Custom2('InsultNoun', SCOPE.sC('actor'))]. Podle toho bys s [Select_CString(secondary_recipient.IsFemale,'ní','ním')] měl také zacházet. Nemyslíš?"
 fp3_antagonize_character_interaction.recipient_message.01: "Měl bys vědět, že [Select_CString(secondary_recipient.IsFemale,'tvá lenní paní','tvůj lenní pán')], [secondary_recipient.GetTitledFirstName], proti tobě za zavřenými dveřmi kuje pikle. Dej si na tu proradnou osobu pozor!"
 fp3_antagonize_character_interaction.recipient_message.02: "Mám důvod se domnívat, že [Select_CString(secondary_recipient.IsFemale,'tvá lenní paní','tvůj lenní pán')], [secondary_recipient.GetTitledFirstName], plánuje tvou vraždu! Měj se před [Select_CString(secondary_recipient.IsFemale,'ní','ním')] na pozoru, bez ohledu na to, jak přátelsky se tváří!"
 fp3_antagonize_character_interaction.recipient_message.03: "Mezi mými dvořany se povídá, že [Select_CString(secondary_recipient.IsFemale,'tvá lenní paní','tvůj lenní pán')], [secondary_recipient.GetTitledFirstName], tě bez tvého vědomí #italic velice bedlivě#! sleduje. Není mi jasné, co tím sleduje, ale na tvém místě bych si před [Select_CString(secondary_recipient.IsFemale,'ní','ním')] dával pozor."
 fp3_antagonize_character_interaction.recipient_message.04: "[Select_CString(secondary_recipient.IsFemale,'Tvá','Tvůj')] [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], se nedávno [Select_CString(secondary_recipient.IsFemale,'zesměšnila','zesměšnil')] a mezi prostým lidem [Select_CString(secondary_recipient.IsFemale,'pošpinila','pošpinil')] dobré jméno rodu [recipient.GetHouse.GetBaseNameNoTooltip]."
 fp3_antagonize_character_interaction.recipient_message.05: "Musím tě upozornit, že [Select_CString(secondary_recipient.IsFemale,'tvá lenní paní','tvůj lenní pán')], [secondary_recipient.GetTitledFirstName], je ve skutečnosti pouhou loutkou svých dvořanů! Kdykoli [Select_CString(secondary_recipient.IsFemale,'odmítla','odmítl')] tvou radu, bylo to na příkaz té neurozené chátry!"
 fp3_antagonize_character_interaction.recipient_message.06: "Měl bys vědět, že [Select_CString(secondary_recipient.IsFemale,'tvá','tvůj')] [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], pokládá jisté #italic nebezpečné#! otázky ohledně rodu [recipient.GetHouse.GetBaseNameNoTooltip]... Ber mé varování vážně, ale nikomu neprozrazuj, že ses to dozvěděl ode mě!"
 fp3_antagonize_character_interaction.recipient_message.07: "[Select_CString(secondary_recipient.IsFemale,'Tvá','Tvůj')] [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], se snaží pošpinit dobré jméno rodu [recipient.GetHouse.GetBaseNameNoTooltip]. Za tvými zády totiž šíří pomluvy, že kradeš dobytek!"
 fp3_antagonize_character_interaction.recipient_message.08: "[Select_CString(secondary_recipient.IsFemale,'Tvá','Tvůj')] [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], neustále posílá na můj dvůr dopisy, v nichž vychvaluje údajnou „nadřazenost“ rodu [recipient.GetHouse.GetBaseNameNoTooltip]. Prosím tě, udělej s tím něco!"
 fp3_antagonize_character_interaction.recipient_message.09: "[secondary_recipient.GetTitledFirstName|U] o tobě šíří odporné pomluvy, a když [Select_CString(secondary_recipient.IsFemale,'ji','ho')] někdo přistihne, vymlouvá se, že „to byl jen žert“! Takoví pomlouvači jsou příšerní a [secondary_recipient.GetTitledFirstName] už [Select_CString(secondary_recipient.IsFemale,'poškodila','poškodil')] tvé dobré jméno!"
 fp3_antagonize_character_interaction.recipient_message.10: "[Select_CString(secondary_recipient.IsFemale,'Tvá','Tvůj')] [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], [Select_CString(secondary_recipient.IsFemale,'byla nedávno přistižena','byl nedávno přistižen')], jak pojídá jídlo přímo z podlahy jako pes! Podle mého skromného názoru bys s [Select_CString(secondary_recipient.IsFemale,'ní','ním')] měl zacházet úplně stejně!"
 fp3_antagonize_character_interaction.recipient_message.11: "Měl by ses dozvědět, že [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], nedávno [Select_CString(secondary_recipient.IsFemale,'porazila','porazil')] bez cizí pomoci tucet ozbrojených asasínů! [Select_CString(secondary_recipient.IsFemale,'Nikomu se tím nepochlubila','Nikomu se tím nepochlubil')], aby na dvoře nevzbudil zbytečné obavy. Považuji však za správné tě o tomto velkolepém činu informovat, aby takové hrdinství nezůstalo bez uznání!"
 fp3_antagonize_character_interaction.recipient_message.12: "Máš štěstí, že máš ve svém životě někoho tak skvělého, jako je [secondary_recipient.GetTitledFirstName], [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))]. Slyšel jsem, že [Select_CString(secondary_recipient.IsFemale,'nedávno vrátila','nedávno vrátil')] jednomu ze svých vazalů ohromnou sumu zlata, když vyšlo najevo, že správce chybně vypočítal jeho daňové povinnosti!"
 fp3_antagonize_character_interaction.recipient_message.13: "Máš opravdu laskavého člověka ve svém okolí, [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))]. [secondary_recipient.GetTitledFirstName|U] se nedávno [Select_CString(secondary_recipient.IsFemale,'setkala','setkal')] s dalším členem [Concept('house','rodu')|E] [secondary_recipient.GetHouse.GetBaseName] a [Select_CString(secondary_recipient.IsFemale,'pomohla','pomohl')] mu urovnat spor. Kdyby tento spor dopadl špatně, mohl poškodit pověst [secondary_recipient.Custom('CZ_FirstName_G')]."
 fp3_antagonize_character_interaction.recipient_message.14: "[Select_CString(secondary_recipient.IsFemale,'Tvá','Tvůj')] [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], je skutečně výjimečnou osobností. Ještě nikdy jsem neviděl nikoho, kdo by byl ochoten bránit svůj [Concept('house','rod')|E] s takovým odhodláním. Máš velké štěstí, že se můžeš na [secondary_recipient.Custom('CZ_TitledFirstName_A')] vždy spolehnout."
 fp3_antagonize_character_interaction.recipient_message.15: "[secondary_recipient.GetTitledFirstName|U] je skutečně úžasná osobnost. Neuvažoval jsi někdy o tom, že bys přehodnotil své mínění o [secondary_recipient.Custom('CZ_TitledFirstName_L')]?"
