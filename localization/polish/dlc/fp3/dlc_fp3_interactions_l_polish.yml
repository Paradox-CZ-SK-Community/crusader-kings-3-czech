 fp3_antagonize_character_interaction.recipient_message.fallback: "Měli byste vědět, že [secondary_recipient.GetTitledFirstName] je [secondary_recipient.Custom2('InsultNoun', SCOPE.sC('secondary_recipient'))] a měl by být tak brán, souhlasíte?"
 fp3_antagonize_character_interaction.recipient_message.01: "Měl bys vědět, že tvůj pán, [secondary_recipient.GetTitledFirstName], za tvými zády proti tobě intrikuje. Měl bys být ostražitý ohledně svého vztahu s tím zrádcem!"
 fp3_antagonize_character_interaction.recipient_message.02: "Mám důvod věřit, že tvůj pán, [secondary_recipient.GetTitledFirstName], plánuje tě zavraždit! Měj se na pozoru před [secondary_recipient.GetHerHim], ať už se zdá jakkoli přátelský!"
 fp3_antagonize_character_interaction.recipient_message.03: "Mezi mými dvořany koluje pověst, že tvůj pán, [secondary_recipient.GetTitledFirstName], tě #italic velmi bedlivě#! sleduje bez tvého vědomí. Není mi jasné, jaké jsou [Select_CString(secondary_recipient.IsFemale,'její','jeho')] úmysly, ale [Select_CString(ROOT.Char.IsFemale,'byla','byl')] bych opatrný(á) kolem [secondary_recipient.GetHerHim]."
 fp3_antagonize_character_interaction.recipient_message.04: "Váš [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], se nedávno ztrapnil a pošpinil dobré jméno rodu [recipient.GetHouse.GetBaseNameNoTooltip] mezi lidmi."
 fp3_antagonize_character_interaction.recipient_message.05: "Měl jsem ti říct, že tvůj pán, [secondary_recipient.GetTitledFirstName], je tajně loutkou svých dvořanů! Kdykoliv [secondary_recipient.GetSheHe] ignoroval tvou radu, bylo to na přání těch níže postavených lidí!"
 fp3_antagonize_character_interaction.recipient_message.06: "Měl bys vědět, že tvůj [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], klade #italic nebezpečné#! otázky o rodu [recipient.GetHouse.GetBaseNameNoTooltip]... Vezmi toto varování vážně, ale nikomu neříkej, že jsem tě o tom informoval!"
 fp3_antagonize_character_interaction.recipient_message.07: "[Select_CString(secondary_recipient.IsFemale,'Tvoje,'Tvůj')] [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], se snaží poškodit dobré jméno rodu [recipient.GetHouse.GetBaseNameNoTooltip] tím, že za tvými zády tvrdí, že kradeš dobytek!"
 fp3_antagonize_character_interaction.recipient_message.08: "[Select_CString(secondary_recipient.IsFemale,'Tvoje,'Tvůj')] [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], neustále posílá dopisy na můj dvůr, oslavující „nadřazenost“ rodu [recipient.GetHouse.GetBaseNameNoTooltip]. Prosím, udělej s tím něco!"
 fp3_antagonize_character_interaction.recipient_message.09: "[secondary_recipient.GetTitledFirstName] šíří o tobě ošklivé pomluvy a když je přistihnut, tvrdí, že „to byla legrace“! Lidé, kteří šíří pomluvy, jsou hrozní a poškodili tvé jméno!"
 fp3_antagonize_character_interaction.recipient_message.10: "[Select_CString(secondary_recipient.IsFemale,'Tvoje,'Tvůj')] [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], [Select_CString(secondary_recipient.IsFemale,'byla','byl')] prý přistižen, jak jí jídlo z podlahy jako pes! Podle mého skromného názoru bys s ním měl takto zacházet!"
 fp3_antagonize_character_interaction.recipient_message.11: "Nechť je známo, že [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], nedávno na vlastní pěst přemohl tucet ozbrojených vrahů. [secondary_recipient.GetSheHe|U] o tom nikomu neřekl — aby nedělal starosti dvoru, ale považil jsem za vhodné vás o tomto skvělém činu informovat, aby [Select_CString(secondary_recipient.IsFemale,'její','jeho')] činy nezůstaly bez uznání!"
 fp3_antagonize_character_interaction.recipient_message.12: "Máš štěstí, že máš tak dobrého [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] jako [secondary_recipient.GetTitledFirstName]. Slyšel jsem, že nedávno [Select_CString(secondary_recipient.IsFemale,'vrátila','vrátil')] obrovskou sumu zlata jednomu ze svých vazalů poté, co správce chybně spočítal, co bylo dlužno!"
 fp3_antagonize_character_interaction.recipient_message.13: "Máš velmi laskavého [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))]. [secondary_recipient.GetTitledFirstName] se nedávno [Select_CString(secondary_recipient.IsFemale,'setkala','setkal')] s dalším členem [Concept('house','rodem')|E] [secondary_recipient.GetHouse.GetBaseName] a pomohl jim vyřešit spor, který by mohl poškodit pověst [secondary_recipient.GetFirstName], kdyby [Select_CString(secondary_recipient.IsFemale,'byla','byl')] špatně vyřešen." # todo: CONCEPT CASE
 fp3_antagonize_character_interaction.recipient_message.14: "Váš [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], je opravdu jako žádný jiný — nikdy předtím jsem neviděl někoho tak ochotného bránit svůj [Concept('house','rod')|E] jako [secondary_recipient.GetHerHim]. Jste obdařeni spolehlivým [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))]." # todo: CONCEPT CASE
 fp3_antagonize_character_interaction.recipient_message.15: "[secondary_recipient.GetTitledFirstName] je úžasná osoba, zvážil jsi přehodnotit své pojetí [secondary_recipient.GetHerHim]?"
