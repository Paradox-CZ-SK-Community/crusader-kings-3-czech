l_polish:
 fp3_brutal_predations_county_modifier: "Brutální řádění"
 fp3_brutal_predations_county_modifier_desc: "Místní obyvatelstvo děsí série násilných činů, které má na svědomí krvelačný žoldnéř, jenž stále uniká spravedlnosti."
 fp3_low_frontier_morale_county_modifier: "Nízká morálka pohraničních posádek"
 fp3_low_frontier_morale_county_modifier_desc: "Vojáci sloužící v pevnostech této oblasti mají pocit, že na ně jejich vládce zapomněl."
 fp3_boosted_frontier_morale_county_modifier: "Posílená morálka pohraničních posádek"
 fp3_boosted_frontier_morale_county_modifier_desc: "Vojákům sloužícím v pevnostech této oblasti dodala odvahu osobní návštěva jejich vládce."
 fp3_visited_the_frontier_modifier: "Návštěva pohraničí"
 fp3_visited_the_frontier_modifier_desc: "Tato postava se nedávno setkala s vojáky v pohraničních pevnostech, kde byla vystavena nejrůznějším chorobám, které se šíří v jejich přeplněných ubikacích."
 fp3_frontier_heresy_county_modifier: "Pohraniční kacířství"
 fp3_frontier_heresy_county_modifier_desc: "Mezi vojáky i osadníky tohoto hrabství se zakořenila radikální náboženská přesvědčení."
 fp3_garrison_decimated_county_modifier: "Zmasakrovaná posádka"
 fp3_garrison_decimated_county_modifier_desc: "Vojáci, kteří dříve střežili tuto oblast, byli na rozkaz svého vládce zmasakrováni za vyznávání pohanské víry."
 fp3_jinx_modifier: "Uhranutí"
 fp3_jinx_modifier_desc: "Tato postava věří, že proti ní někdo se zlými úmysly použil zlé oko a uvrhl na ni kletbu."
 fp3_call_of_the_wild_modifier: "Volání divočiny"
 fp3_call_of_the_wild_modifier_desc: "Tato postava pociťuje neodolatelnou touhu prozkoumávat vzdálené stepi, nehostinné pouště a vysoké hory, aby odhalila, co se skrývá za jejich hranicemi."
 fp3_marriage_material_modifier: "Vhodná partie"
 fp3_marriage_material_modifier_desc: "Tato postava byla přesvědčena, že je v jejím nejlepším zájmu poslechnout rodiče a uzavřít manželství. Je tomu však skutečně tak?"
 fp3_dutiful_scion_modifier: "Oddaný potomek"
 fp3_dutiful_scion_modifier_desc: "Tato postava zasvětila svůj život dynastii a nenechává se rozptylovat takovými malichernostmi, jako jsou dobrodružství nebo osobní štěstí."
 fp3_worried_sick_modifier: "Strachy bez sebe"
 fp3_worried_sick_modifier_desc: "Tuto postavu sžírají obavy o milovanou osobu, která se vydala vstříc nebezpečím daleko od domova."
 fp3_gross_persecutions_county_modifier: "Kruté pronásledování"
 fp3_gross_persecutions_county_modifier_desc: "Mnozí věřící v této oblasti se skrývají nebo uprchli před násilným náboženským pronásledováním ze strany svého pána."
 fp3_galvanized_heretics_county_modifier: "Radikalizovaní kacíři"
 fp3_galvanized_heretics_county_modifier_desc: "Útlak proměnil obyvatelstvo tohoto hrabství v zahořklé radikály, pokud jimi již nebyli. Jsou odhodláni bránit svou víru za každou cenu."
 fp3_promoting_arabic_modifier: "Podpora arabštiny"
 fp3_promoting_arabic_modifier_desc: "Tato postava podporuje používání arabského jazyka."
 fp3_conversion_curious_county_modifier: "Zájem o jiné víry"
 fp3_conversion_curious_county_modifier_desc: "Mezi obyvateli tohoto hrabství roste zájem o jiná náboženská vyznání."
 fp3_teapot_alcoholism_modifier: "Náruživý piják čaje"
 fp3_teapot_alcoholism_modifier_desc: "Tato postava má vždy po ruce pěknou malou čajovou konvičku a je známá tím, že ve velkém množství popíjí její záhadný obsah."
 ulema_displeased_drinking: "Veřejný skandál kvůli pití"
 ulema_displeased_drinking_desc: "Všeobecně známé pijácké návyky této postavy vyvolaly veřejný skandál. Duchovenstvo otevřeně zpochybňuje, nakolik její záliba v alkoholu ovlivňuje schopnost vládnout."
 fp3_mountain_redoubt_modifier: "Pevnost Badd"
 fp3_mountain_redoubt_modifier_desc: "Tato pevnost, tyčící se na vrcholu vysoké hory, je téměř nedobytná. Kdysi ji ovládali churramitští vůdci Džávídhán a Bábak. Nyní byla obnovena a stala se impozantní baštou bojovných obyvatel Černých hor."
 fp3_royal_fire_modifier: "Královský oheň"
 fp3_royal_fire_modifier_desc: "Na počest této vládnoucí postavy byl zažehnut věčný oheň, jehož světlo má požehnat její vládě slávou."
 fp3_plundered_county_modifier: "Vydírané a drancované hrabství"
 fp3_plundered_county_modifier_desc: "Vládce panství vyždímal toto hrabství do poslední mince, aby mohl financovat okázalé projekty v jiných částech své říše."
 fp3_architectural_splendor_county_modifier: "Monumentální nádhera"
 fp3_architectural_splendor_county_modifier_desc: "V tomto hrabství byly vynaloženy značné prostředky na monumentální architekturu a velkolepé veřejné stavby."
 fp3_efficient_splendor_county_modifier: "Zdatní stavitelé"
 fp3_efficient_splendor_county_modifier_desc: "Toto hrabství zažívá nebývalý stavební rozmach, při němž vznikají monumentální stavby a velkolepá veřejná díla."
 fp3_luxurious_bathhouse_modifier: "Nebeský hammám"
 fp3_luxurious_bathhouse_modifier_desc: "Tato postava obohatila své hlavní sídlo o nové lázně výjimečné velkoleposti a kvality."
 fp3_less_luxurious_bathhouse_modifier: "Hammám poškozený vlhkostí"
 fp3_less_luxurious_bathhouse_modifier_desc: "Ačkoli tato postava vlastní přepychové lázně, jejich stavební provedení není zdaleka dokonalé. V obkladech a kamenném zdivu se již začínají objevovat praskliny."
 fp3_very_lofty_tower_modifier: "Věž tyčící se k nebesům"
 fp3_very_lofty_tower_modifier_desc: "Sídlo této postavy zdobí mimořádně vysoká a nádherná věž. Po jejích schodech lze vystoupat až na vrchol, odkud se otevírá výhled na okolní svět a kde je možné uniknout všem zvědavým pohledům."
 fp3_less_lofty_tower_modifier: "Vysoká věž"
 fp3_less_lofty_tower_modifier_desc: "Sídlo této postavy zdobí vysoká a štíhlá věž. Přestože nedosahuje původně zamýšlené výšky, pohled z jejího vrcholu stále bere dech a v případě potřeby poskytuje útočiště před zvědavými pohledy."
 fp3_spiritual_splendor_county_modifier: "Duchovní nádhera"
 fp3_spiritual_splendor_county_modifier_desc: "V tomto hrabství proběhla rozsáhlá výstavba a obnova náboženských památek všeho druhu."
 fp3_great_tower_of_silence_modifier: "Velká věž mlčení"
 fp3_great_tower_of_silence_modifier_desc: "Tato postava dohlížela na výstavbu dachmy nebývalých rozměrů. Často hledí na tuto děsivou stavbu a rozjímá o tom, co se nachází za hranicemi světa země a těla."
 fp3_less_great_tower_of_silence_modifier: "Věž mlčení"
 fp3_less_great_tower_of_silence_modifier_desc: "Tato postava dohlížela na výstavbu rozlehlé dachmy. Při pohledu na stepní supy, kteří k ní slétají, často rozjímá o životě a smrti."
 police_chief_of_baghdad_modifier: "Velitel bagdádské stráže"
 police_chief_of_baghdad_modifier_desc: "Tato postava zastává titul sáhib aš-šurta, velitele bagdádské stráže. Navzdory nedávným otřesům jí tento úřad stále poskytuje určité možnosti, jak uplatňovat svůj vliv."
 fp3_light_of_the_walayah_modifier: "Světlo waláji"
 fp3_light_of_the_walayah_modifier_desc: "O této dynastii se říká, že vlastní #italic núr#!, mystické světlo Božího vedení."
 fp3_azariqa_ascendancy_modifier: "Vzestup muhakkimů"
 fp3_azariqa_ascendancy_modifier_desc: "Tato postava dovedla muhakkimy k dosud nevídané velikosti."
 fp3_promoted_persian_scripture_modifier: "Velký překladatel"
 fp3_promoted_persian_scripture_modifier_desc: "Tato postava dohlížela na překlady arabských náboženských děl, což bylo dříve považováno za tabu."
 fp3_persian_resurgence_county_modifier: "Perské obrození"
 fp3_persian_resurgence_county_modifier_desc: "Toto hrabství zachvátilo náboženské nadšení spojené s obrozeným místním vlastenectvím. Z této směsice mohou vzejít nečekané události."
 fp3_forgotten_runestones_county_modifier: "Zapomenuté runové kameny"
 fp3_forgotten_runestones_county_modifier_desc: "V tomto hrabství stojí tři tajemné kameny zdobené nádherně vytesanými runami po vzoru Rusů. Čas je však poznamenal natolik, že dnes už nikdo nedokáže rozluštit jejich význam."
 fp3_dismayed_daylamites_county_modifier: "Znepokojení obyvatelé lesů"
 fp3_dismayed_daylamites_county_modifier_desc: "Mezi místními obyvateli se kolem tajemných runových kamenů ukrytých hluboko v lese rozšířily děsivé pověry. Nyní, když kameny zmizely, se lidé obávají odplaty jejich neznámých tvůrců."
 fp3_insulted_chinese_noble_modifier: "Opovržení v Číně"
 fp3_insulted_chinese_noble_modifier_desc: "Tato postava urazila významného čínského šlechtice, který o ní nyní šíří zlomyslné pomluvy na dvorech v Čchang-anu, Kchaj-fengu a Luo-jangu."
 fp3_vengeful_nomads_county_modifier: "Pomstychtiví kočovníci"
 fp3_vengeful_nomads_county_modifier_desc: "Toto hrabství sužují bezohledné útoky kočovníků, kteří touží pomstít svého nespravedlivě zabitého vůdce."
 fp3_nomad_recruits_modifier: "Kočovní rekruti"
 fp3_nomad_recruits_modifier_desc: "Tato dynastie umožnila kočovným kmenům usadit se na svém území, čímž získala vynikající zdroj schopných jezdců pro své vojsko."
 fp3_nomad_friction_county_modifier: "Boj o pastviny"
 fp3_nomad_friction_county_modifier_desc: "Toto hrabství sužují neustálé spory mezi usedlými rolníky a kočovnými kmeny."
 fp3_resentful_nomads_county_modifier: "Rozhořčení kočovníci"
 fp3_resentful_nomads_county_modifier_desc: "Toto hrabství sužují konflikty vyvolané nespokojenými a nezkrotnými kočovníky."
 fp3_banning_archery_modifier: "Zákaz lukostřelby"
 fp3_banning_archery_modifier_desc: "Tato postava zakázala v některých částech svého panství lukostřelecký výcvik. Ačkoli tím omezuje schopnosti svých lučištníků, zároveň výrazně snižuje riziko nehod."
 fp3_crushed_by_failure_modifier: "Zdrcení neúspěchem"
 fp3_crushed_by_failure_modifier_desc: "Ať už se tato postava pokoušela o cokoli, utrpěla naprostý neúspěch. Nyní její mysl sžírají pochybnosti o vlastních schopnostech."
 fp3_silk_road_secure_county_modifier: "Zabezpečená Hedvábná stezka"
 fp3_silk_road_secure_county_modifier_desc: "Kočovní válečníci v této oblasti se přísahou zavázali chránit karavanní cesty a zajišťovat bezpečný průchod obchodníků."
 fp3_nomad_attacks_county_modifier: "Neustálé nájezdy"
 fp3_nomad_attacks_county_modifier_desc: "Toto hrabství trpí nájezdy na projíždějící karavany, které vážně narušují obchodní styky."
 fp3_gnostic_fervor_county_modifier: "Gnostické zanícení"
 fp3_gnostic_fervor_county_modifier_desc: "V tomto hrabství se nedávno usadila skupina pracovitých manichejských uprchlíků."
 fp3_lackluster_diet_modifier: "Nechutná dieta"
 fp3_lackluster_diet_modifier_desc: "Této postavě byla v naději na vyléčení melancholie nařízena jednotvárná strava sestávající ze solených ryb a syrových řapíků celeru."
 fp3_herbal_remedies_modifier: "Bylinné léčivo"
 fp3_herbal_remedies_modifier_desc: "Tato postava užívá směs fenyklových semínek, okurek a dalších bylin v naději, že jí pomůže překonat melancholii."
 fp3_worshipping_in_solitude_modifier: "Rozjímání v ústraní"
 fp3_worshipping_in_solitude_modifier_desc: "Tato postava tráví dlouhé hodiny ve své soukromé kapli, daleko od zvědavých pohledů. O tom, co se za jejími dveřmi odehrává, koluje mnoho dohadů."
 fp3_rare_books_modifier: "Vzácné knihy"
 fp3_rare_books_modifier_desc: "Tato postava získala malou sbírku vzácných knih zachráněných z legendárních knihoven, například v Ktésifóntu, Gundéšápúru a snad dokonce i Alexandrii."
 fp3_oil_of_vitriol_modifier: "Vitriolový olej"
 fp3_oil_of_vitriol_modifier_desc: "Tato postava má k dispozici nebezpečně velké množství mimořádně žíravé látky, kterou připravil perský alchymista."
 fp3_dabbling_in_alchemy_modifier: "Pokusy s alchymií"
 fp3_dabbling_in_alchemy_modifier_desc: "Tato postava se začala zabývat alchymií a při svých pokusech byla vystavena nejrůznějším škodlivým látkám."
 fp3_alchemical_insights_modifier: "Alchymistické poznatky"
 fp3_alchemical_insights_modifier_desc: "Tato postava společně s perským alchymistou učinila významné objevy při zkoumání kapalin a hmoty a dozvěděla se mnohé o samotné podstatě okolního světa."
 fp3_reneged_on_promise_modifier: "Porušený slib"
 fp3_reneged_on_promise_modifier_desc: "Tato postava porušila slib, že finančně podpoří literární tvorbu slavného básníka, a nyní má pověst poněkud nedůvěryhodné osoby."
 fp3_broken_icehouses_county_modifier: "Zničené jachčály"
 fp3_broken_icehouses_county_modifier_desc: "Toto hrabství bývalo proslulé výrobou sladkých chlazených pochoutek. To však skončilo, když místní jachčály, tradiční perské ledárny, zničilo zemětřesení."
 fp3_court_austerity_modifier: "Dvorská střídmost"
 fp3_court_austerity_modifier_desc: "Na dvoře této postavy panuje přísná střídmost. Okázalý přepych je vzácností, smíchu je poskrovnu a sladké zákusky jsou zcela zakázány."
 fp3_securing_sorbet_supply_modifier: "Zajištěné zásoby falúde"
 fp3_securing_sorbet_supply_modifier_desc: "Tato postava zabrala veškeré zásoby chlazených pochoutek v celém panství. Zatímco její dvořané jásají nadšením, vazalové zuří."
 fp3_thinking_about_the_afterlife_modifier: "Úvahy o smrti"
 fp3_thinking_about_the_afterlife_modifier_desc: "Tato postava v poslední době tráví mnoho času rozjímáním o tom, co ji čeká po smrti."
 fp3_sufi_initiate_modifier: "Súfijský zasvěcenec"
 fp3_sufi_initiate_modifier_desc: "Tato postava se začala zajímat o súfijskou mystiku a meditaci murákaba, při níž se ponořuje do hlubokého rozjímání o vztahu lidského srdce ke Stvořiteli."
 fp3_avoiding_dark_places_modifier: "Vyhýbání se temnotě"
 fp3_avoiding_dark_places_modifier_desc: "Tato postava zažila až příliš mnoho děsivých příhod a nyní se všemožně snaží vyhýbat temným místům."
 fp3_looking_for_bodyguards_modifier: "Hledání osobních strážců"
 fp3_looking_for_bodyguards_modifier_desc: "Tato postava zažila až příliš mnoho děsivých příhod a nyní hledá další osobní strážce, kteří by jí zajistili bezpečí."
 fp3_relentless_skeptic_modifier: "Neúnavný skeptik"
 fp3_relentless_skeptic_modifier_desc: "Tato postava začala zpochybňovat mnohé lidové pověry a představy o neviditelném světě. Ostatní ji mohou považovat za cynika, neotesaného pochybovače, nebo dokonce odpadlíka od víry."
 fp3_womens_faith_galvanized_modifier: "Víra žen"
 fp3_womens_faith_galvanized_modifier_desc: "Tato postava se cítí pronásledována kvůli uctívání světice, ale útlak její odhodlání pouze posílil."
 fp3_promoted_persian_mathematics_modifier: "Podpora perské matematiky"
 fp3_promoted_persian_mathematics_modifier_desc: "Učenci této postavy přicházejí s vlastními matematickými objevy, které mohou směle soupeřit s poznatky národů $indo_aryan_group_collective_noun$."
 fp3_denied_religious_protection_modifier: "Odepřená náboženská ochrana"
 fp3_denied_religious_protection_modifier_desc: "Tato vládnoucí postava odepřela jinověrcům svobodu vyznávat jejich vlastní víru."
 patron_of_the_sciences: "Ačkoli tento projekt nepřinesl žádný významný objev, [Select_CString(ROOT.Char.IsFemale,'získala','získal')|l] jsi díky němu pověst významného mecenáše vědy."
 fp3_treatise_on_development_modifier: "Pojednání o správě"
 fp3_treatise_on_development_modifier_desc: "Pojednání o významu úřední správy, které nabízí několik doporučení, jak zajistit účinnou komunikaci od panovnického dvora až po nejnižší úroveň místní správy."
 fp3_treatise_on_building_modifier: "Pojednání o hospodaření"
 fp3_treatise_on_building_modifier_desc: "Pojednání o tom, jak účelně spravovat dostupné zdroje a dosáhnout co nejvyšší efektivity."
 fp3_treatise_on_control_modifier: "Pojednání o autoritě"
 fp3_treatise_on_control_modifier_desc: "Spis o tom, jak by měl panovník přistupovat k vládnutí a potlačování povstání."
 fp3_treatise_on_mathematics_modifier: "Matematická monografie"
 fp3_treatise_on_mathematics_modifier_desc: "Odborné pojednání o matematice doplněné několika poznámkami o jejím využití v každodenním životě."
 fp3_treatise_on_taxation_modifier: "Pojednání o zdanění"
 fp3_treatise_on_taxation_modifier_desc: "Dlouhé a rozvláčné pojednání o daních a nejvhodnějších postupech při řešení daňových záležitostí."
 fp3_treatise_on_light_warfare_modifier: "Příručka k vedení šarvátek"
 fp3_treatise_on_light_warfare_modifier_desc: "Krátké pojednání o přednostech lehké pěchoty a možnostech jejího účinného nasazení."
 fp3_treatise_on_heavy_warfare_modifier: "Příručka k obrannému boji"
 fp3_treatise_on_heavy_warfare_modifier_desc: "Pojednání o vhodných bojových formacích těžké pěchoty. Na konci obsahuje stručný návod na výcviková cvičení, která pomáhají zlepšit soudržnost vojska."
 fp3_treatise_on_cavalry_modifier: "Dějiny jezdeckého boje"
 fp3_treatise_on_cavalry_modifier_desc: "Rozsáhlé pojednání o dějinách jezdeckých útoků s důrazem na to, jak lze ze sedla koně zvrátit průběh bitvy."
 fp3_treatise_on_siege_modifier: "Příručka k bourání hradeb"
 fp3_treatise_on_siege_modifier_desc: "Stručná, avšak výstižná příručka o povaze obléhání a o tom, jak postupovat proti nepříteli s obléhacími stroji i bez nich."
 fp3_treatise_on_strategy_modifier: "Dějiny strategie"
 fp3_treatise_on_strategy_modifier_desc: "Obsáhlé, ale přístupně napsané pojednání o dějinách strategie a taktiky s příklady z několika uplynulých staletí."
 fp3_fearsome_example_modifier: "Odstrašující příklad"
 fp3_fearsome_example_modifier_desc: "Tato vládnoucí postava brutálně zničila náboženskou komunitu v pohraničí a dala tak najevo svou děsivou odhodlanost potlačit jakékoli kacířství."
 fp3_refused_the_caliph_modifier: "Odmítnutá výzva ke svaté válce"
 fp3_refused_the_caliph_modifier_desc: "Tato postava odmítla požadavek hlavy víry, aby zaútočila na sousedního pohanského vládce."
 fp3_praying_too_much_modifier: "Přehnaná zbožnost"
 fp3_praying_too_much_modifier_desc: "Tato postava tráví nadměrné množství času modlitbami v chrámu a zanedbává své ostatní povinnosti."
 fp3_name_read_in_friday_prayer_modifier: "Jméno předčítané při páteční modlitbě"
 fp3_name_read_in_friday_prayer_modifier_desc: "Tato postava nařídila, aby se při nejdůležitější bohoslužbě týdne předčítalo její jméno namísto jména chalífy. Jde o pravidelné veřejné vyjádření její politické příslušnosti a významného postavení."
 fp3_displayed_pious_submission_to_caliph_modifier: "Zdůrazněná oddanost chalífovi"
 fp3_displayed_pious_submission_to_caliph_modifier_desc: "Tato postava vydala přísný příkaz, aby se při páteční modlitbě, nejvýznamnější bohoslužbě v každé mešitě, předčítalo nejprve chalífovo jméno. Celý svět tak ví, čí svrchovanost uznává."
 fp3_honored_by_the_faithful_modifier: "Pocty od věřících"
 fp3_honored_by_the_faithful_modifier_desc: "Jméno této postavy se předčítá při páteční modlitbě přímo v sídle hlavy její víry, což jí jako vládnoucí osobě dodává značnou legitimitu."
 fp3_rule_by_fear_modifier: "Vláda strachem"
 fp3_rule_by_fear_modifier_desc: "Tato postava prokázala, že je ochotná a schopná nechat kohokoli svévolně zabít, a udržuje tak své panství pohromadě pomocí strachu."
 fp3_minor_child_spy_network_modifier: "Malá síť dětských špehů"
 fp3_minor_child_spy_network_modifier_desc: "Tato postava využívá malou síť dětských špehů k odhalování tajemství ostatních členů klanu."
 fp3_better_company_modifier: "Lepší společnost"
 fp3_better_company_modifier_desc: "Tuto postavu pokárali starší příbuzní a nyní se učí chovat tak, jak se na potomka jejího klanu sluší."
 fp3_justification_for_taxation_modifier: "Odůvodnění vyšších daní"
 fp3_justification_for_taxation_modifier_desc: "Výběrčí daní ve službách této postavy vytvořil pochybná odůvodnění, proč mají její vazalové odvádět více daní, než by většina lidí považovala za spravedlivé."
 fp3_excuses_for_extortion_modifier: "Záminky k vydírání"
 fp3_excuses_for_extortion_modifier_desc: "$fp3_justification_for_taxation_modifier_desc$"
 fp3_locals_intimidated_county_modifier: "Zastrašené obyvatelstvo"
 fp3_locals_intimidated_county_modifier_desc: "Prostý lid tohoto hrabství byl zastrašen k poslušnosti."
 fp3_locals_infuriated_county_modifier: "Rozzuření místní obyvatelé"
 fp3_locals_infuriated_county_modifier_desc: "Prostý lid tohoto hrabství je rozhořčen tím, jak jeho vládce naložil s oblíbeným místním soudcem."
 fp3_looking_the_other_way_modifier: "Přivírání očí"
 fp3_looking_the_other_way_modifier_desc: "Tato postava se rozhodla přehlížet některé finanční nepravosti svých vazalů a poddaných, ať už v zájmu panství, nebo pro vlastní klid."
 fp3_capable_magistrates_modifier: "Schopní soudci"
 fp3_capable_magistrates_modifier_desc: "Tato postava má k dispozici mimořádně schopné soudce, kteří dokážou téměř každé rozhodnutí vykreslit jako spravedlivé."
 fp3_delegated_payments_modifier: "Svěřené vyplácení žoldu"
 fp3_delegated_payments_modifier_desc: "Tato postava pověřila svého výběrčího daní vyplácením vojenského žoldu. Zatím se toto opatření ukazuje jako účinné."
 fp3_army_influence_modifier: "Vliv na vojsko"
 fp3_army_influence_modifier_desc: "Lenní pán svěřil této postavě značný vliv na vojsko."
 fp3_messy_payments_modifier: "Nespolehlivé výplaty"
 fp3_messy_payments_modifier_desc: "Odpovědnost za vyplácení žoldu vojákům této postavy byla nešikovně rozdělena. Výplaty se proto někdy zpožďují, což podkopává morálku vojska."
 fp3_cutting_corners_modifier: "Odbývání práce"
 fp3_cutting_corners_modifier_desc: "Tato postava je přetížená prací, a proto začala některé své povinnosti odbývat."
 fp3_promoting_zoroastrianism_modifier: "Přítel zoroastriánů"
 fp3_promoting_zoroastrianism_modifier_desc: "Tato postava je známá tím, že vyvíjí mimořádné úsilí, aby pomáhala zoroastriánské komunitě."
 fp3_blessed_by_fire_modifier: "Požehnání ohněm"
 fp3_blessed_by_fire_modifier_desc: "Tato postava prožila hluboký duchovní zážitek při setkání s ohněm zažehnutým bleskem, nejčistším živlem tohoto světa."
 fp3_bad_tower_of_silence_county_modifier: "Věž pošetilosti"
 fp3_bad_tower_of_silence_county_modifier_desc: "V tomto hrabství se pokusili vybudovat novou velkolepou dachmu, ale při stavbě došlo k závažným chybám. Rozkládající se lidské ostatky nyní znečišťují podzemní vodu."
 fp3_wary_of_sabotage_modifier: "Ostražitost vůči sabotáži"
 fp3_wary_of_sabotage_modifier_desc: "Tato postava nehodlá v hrabství, které jí bylo svěřeno, strpět žádné podvody, úskoky ani jiné nekalé praktiky."
 fp3_antagonize_character_interaction_known_liar: "Pověstný přeháněním"
 fp3_antagonize_character_interaction_known_liar_desc: "Lidé mají výroků této postavy plné zuby, protože má ve zvyku přehánět."
 fp3_not_puppeteering_kingmaker_modifier: "Neúspěšný loutkovodič"
 fp3_not_puppeteering_kingmaker_modifier_desc: "Této postavě se nepodařilo sesadit nepřátelského vládce a nahradit ho někým, kdo by lépe vyhovoval jejím zájmům. Nyní je zpochybňována i její vlastní legitimita."
 fp3_sickly_monkey_modifier: "Nemocná opice"
 fp3_sickly_monkey_modifier_desc: "Tato postava se snaží uzdravit nemocnou opici. Zvíře má ostré drápy a zuby jako břitvy."
 fp3_chess_playing_monkey_modifier: "Opice hrající šachy"
 fp3_chess_playing_monkey_modifier_desc: "Tato postava vlastní opici, o níž se vypráví, že ji umění šachu naučil východní král-filozof."
 fp3_paper_surplus_modifier: "Hojnost papíru"
 fp3_paper_surplus_modifier_desc: "Tato postava má stálý přísun papíru, na který může zaznamenávat výsledky svého bádání."
 fp3_paper_shortage_modifier: "Nedostatek papíru"
 fp3_paper_shortage_modifier_desc: "Tato postava nemá zajištěný pravidelný přísun papíru, a proto musí příležitostně využívat obtížně dostupný pergamen."
 fp3_liquid_wisdom_modifier: "Tekutá moudrost"
 fp3_liquid_wisdom_modifier_desc: "Tato postava se osvědčila jako výborný hostitel navštěvujících učenců a nepochybně těží z otevřenější výměny myšlenek."
 fp3_morbid_insights_modifier: "Ponuré poznatky"
 fp3_morbid_insights_modifier_desc: "Tato postava získala několik nepříjemných poznatků o lidské existenci."
 fp3_wheat_shortage_modifier: "Nedostatek pšenice"
 fp3_wheat_shortage_modifier_desc: "Královský pekař v tomto hrabství hromadí zásoby pšenice a rolníkům nenechává ani jediný maund."
 fp3_generous_bakers_modifier: "Štědří pekaři"
 fp3_generous_bakers_modifier_desc: "Po popravě chamtivého pekaře začali ostatní pekaři v tomto hrabství rozdávat chléb mnohem štědřeji."
 fp3_impious_tax_collector_modifier: "Bezbožný výběrčí daní"
 fp3_impious_tax_collector_modifier_desc: "Hříšné jednání této postavy bylo veřejně odhaleno a její pověst schopného výběrčího daní tím značně utrpěla."
 fp3_incapable_tax_collector_modifier: "Nezpůsobilý výběrčí daní"
 fp3_incapable_tax_collector_modifier_desc: "Tato postava již kvůli svému hříšnému jednání nemůže zastávat úřad výběrčího daní."
 fp3_religious_desertion_modifier: "Odmítnutí boje z náboženských důvodů"
 fp3_religious_desertion_modifier_desc: "Vojáci tohoto hrabství odmítli bojovat, aby nemuseli pozvednout zbraně proti hlavě své víry."
 fp3_struggle_supremacy_house_reward_modifier: "Sunnitská nadvláda"
 fp3_struggle_supremacy_house_reward_modifier_desc: "Chalífové pocházející z tohoto rodu si nárokují rozsáhlé pravomoci díky úspěšnému obnovení své moci nad Íránem."
 fp3_struggle_caliph_super_suspicious_modifier: "Mimořádná podezíravost"
 fp3_struggle_caliph_super_suspicious_modifier_desc: "Kvůli rostoucím nepokojům v oblasti má tato postava neustále pocit, že jí hrozí vážné nebezpečí."
 has_fp3_struggle_caliph_super_suspicious_modifier: "[target.GetShortUIName|U] [Select_CString(target.IsLocalPlayer,'máš','má')|l] modifikátor $fp3_struggle_caliph_super_suspicious_modifier$: $VALUE|+0=-+$"
 fp3_irrigation_insights_modifier: "Poznatky o zavlažování"
 fp3_irrigation_insights_modifier_desc: "Studiem starobylého systému kanátů získala tato postava cenné znalosti o zavlažování."
 disturbed_sky_burial: "Narušený nebeský pohřeb"
 disturbed_sky_burial_desc: "Náboženští horlivci v panství obdivují rozhodnost, s jakou tato postava zasáhla proti pohanským zvykům, například nebeským pohřbům."
 disturbed_funerals: "Znevážená víra"
 fp3_untrained_falcon: "Nevycvičený sokol"
 fp3_untrained_falcon_desc: "Tato postava nalezla při nebeském pohřbu dravého ptáka. Dosud jí působil jen samé starosti, ale doufá, že z něj dokáže vycvičit skutečného lovce."
 fp3_aggressive_falcon: "Agresivní sokol"
 fp3_aggressive_falcon_desc: "Tato postava nalezla při nebeském pohřbu dravého ptáka, který si zřejmě vypěstoval zálibu v lidském mase. Namísto potlačení této choutky se ji rozhodla ještě podporovat."
 fp3_had_delicious_kumis: "Lahodný kumys"
 fp3_had_delicious_kumis_desc: "Tato postava se během svých cest podělila o lahodný nápoj z kobylího mléka s turkickými poutníky, které potkala."
 turkic_war_band: "Najmutá turkická válečná družina"
 turkic_war_band_desc: "Tato postava najala skupinu turkických kočovníků, aby pomohli s výcvikem jejího vojska. Někteří vazalové jsou tímto rozhodnutím přímo zděšeni."
 rebuffed_turkic_war_band: "Uražení turkičtí válečníci"
 rebuffed_turkic_war_band_desc: "Tato postava během svých cest předvedla pozoruhodnou odvahu, když bezostyšně urazila početnou skupinu kočovných válečníků."
 ancient_persian_relics: "Starověké poklady"
 ancient_persian_relics_desc: "Díky nečekanému přílivu bohatství získala tato postava pověst zámožného a štědrého člověka."
 fp3_house_modifier_conceded_hegemony: "Ústupek z hegemonie"
 fp3_house_modifier_conceded_hegemony_desc: "Tento rod se musel vzdát svého hegemonního postavení, aby usmířil své nepřátele."
 fp3_house_modifier_rebuilding_efforts: "Úsilí o obnovu"
 fp3_house_modifier_rebuilding_efforts_desc: "Tento rod obnovuje své panství po krvavém boji s nepřáteli chalífátu."
 fp3_house_modifier_frontier_ambitions: "Pohraniční ambice"
 fp3_house_modifier_frontier_ambitions_desc: "Po neúspěšném střetu s chalífátem hledá tento rod nové možnosti územní expanze."
 fp3_house_modifier_destroyed_the_caliphate: "Zničení chalífátu"
 fp3_established_futuwaa_lodges_modifier: "Založené spolky futuwwa"
 fp3_established_futuwaa_lodges_modifier_desc: "Tato postava založila ve svém hlavním sídle bojové spolky futuwwa, které poskytují zahálčivé mládeži příležitost k výcviku."
 fp3_established_madrasas_modifier: "Založené madrasy"
 fp3_established_madrasas_modifier_desc: "Tato postava založila ve svém hlavním sídle madrasy, aby poskytla vzdělání zahálčivé mládeži."
 fp3_rekindler_of_iran_modifier: "Plamen Persie"
 fp3_rekindler_of_iran_modifier_desc: "Tato dynastie ukončila Íránské intermezzo tím, že znovu zažehla plameny perské slávy."
 fp3_rekindler_of_iran_modifier_reason: "Máš [Concept('modifier','modifikátor')|E] [GetModifier('fp3_rekindler_of_iran_modifier').GetNameWithTooltip|L]: $VALUE|=+0$"
 dreaded_beauty: "Děsivá krása"
 dreaded_beauty_desc: "Někteří tvrdí, že právě reakce ostatních na tělesné znetvoření této postavy z ní učinily tak krutého člověka."
 generous_beauty: "Štědrá krása"
 generous_beauty_desc: "Možná se tato vládnoucí postava snaží vyvážit pomluvy o svém vzhledu. Získala si totiž pověst mimořádné štědrosti a ochoty odpouštět dlužné daně."
 fp3_flame_of_iran_modifier: "Znovu zažehnutý perský duch"
 fp3_flame_of_iran_modifier_desc: "Mysl této postavy plane nezdolnou touhou po nezávislosti a silným vědomím sounáležitosti se svým společenstvím."
 unified_the_persian_region_house_modifier: "Rod sjednotitele"
 unified_the_persian_region_house_modifier_desc: "Tento rod sjednotil oblast a přinesl jí stabilitu."
 fp3_resisted_the_struggle_modifier: "Odpor proti chalífátu"
 fp3_resisted_the_struggle_modifier_desc: "Tato postava bojovala proti chalífátu a nakonec dosáhla zachování současného uspořádání."
 scheme_helpful_sympathizer_modifier: "Nápomocný sympatizant"
 scheme_helpful_sympathizer_modifier_desc: "Jeden z dvořanů cílové postavy tajně poskytuje informace asasínům."
 scheme_untrustworthy_sympathizer_modifier: "Nedůvěryhodný sympatizant"
 scheme_assassin_recruits_modifier: "Noví asasíni"
 scheme_assassin_recruits_modifier_desc: "Mistru asasínů pomáhají čerstvě naverbovaní fanatici, kteří mohou mít více nadšení než skutečných schopností."
 scheme_assassin_closing_in_modifier: "Blížící se asasín"
 scheme_strengthened_resolve_modifier: "Posílené odhodlání"
 scheme_weakened_resolve_modifier: "Oslabené odhodlání"
 scheme_poisoned_blade_modifier: "Otrávená čepel"
 scheme_pestilent_blade_modifier: "Čepel šířící nákazu"
 scheme_renegade_assassin_modifier: "Odpadlý asasín"
 fp3_tax_collector_become_teacher: "Výběrčí daní jako učitel"
 fp3_cunning_tax_collectors: "Prohnaní výběrčí daní"
 fp3_sided_with_different_faith_vassal_tax_dispute: "Daňové ústupky vazalovi jiné víry"
 fp3_sided_with_tax_collector_tax_dispute: "Podpora výběrčího daní ve sporu"
 fp3_honorary_title_intrigue_modifier: "Pomocník státu"
 fp3_honorary_title_scholarship_modifier: "Podporovatel státu"
 fp3_honorary_title_stewardship_modifier: "Opora státu"
 fp3_honorary_title_diplomacy_modifier: "Přítel státu"
 fp3_honorary_title_piety_modifier: "Koruna společenství"
 fp3_honorary_title_prestige_modifier: "Pilíř státu"
 fp3_honorary_title_martial_modifier: "Meč státu"
 fp3_higher_purpose_modifier: "Vyšší poslání"
 fp3_higher_purpose_modifier_desc: "Tato postava svěřuje své existenciální starosti do rukou vyšší moci."
 changed_tax_collector_mandate_opinion: "Změna mého pověření"
 fired_from_tax_collector_position_opinion: "Propuštění z úřadu výběrčího daní"
 goldlust_opinion: "Touha po zlatě"
 resigned_opinion: "Rezignace"
 took_my_coin_opinion: "Přivlastnění mých peněz"
 liar_opinion: "Lhář"
 fp3_sundered_caliphate_opinion: "Zničení chalífátu"
 fp3_zanj_rebellion_work_concessions_modifier: "Pracovní ústupky Zandžům"
