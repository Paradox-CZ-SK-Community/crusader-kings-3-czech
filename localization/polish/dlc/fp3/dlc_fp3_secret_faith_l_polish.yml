l_polish:
 secret_faith.1001.message: "Zasvěcení do tajné víry: [guardian.GetSecretFaith.GetName]"
 child_secret_faith_conversion_success_effect.desc: "[child.GetFirstNameNoTooltip|U] [Select_CString(child.IsFemale,'je přesvědčená','je přesvědčený')]"
 child_secret_faith_conversion_failure_effect.desc: "[child.GetFirstNameNoTooltip|U] má pochybnosti"
 child_secret_faith_conversion_critical_failure_effect.desc: "[child.GetFirstNameNoTooltip|U] prozradí mé tajemství"
 child_secret_faith_conversion_critical_failure_effect.liege.desc: "[child.GetFirstNameNoTooltip|U] prozradí, že [guardian.GetFirstNameNoTooltip] tajně vyznává [guardian.GetSecretFaith.GetName]"
 secret_faith.1002.t: "Věk poznání"
 secret_faith.1002.desc: "[child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] stojí na prahu dospělosti. [Select_CString(ROOT.Char.IsFemale,'Naučila','Naučil')|U] jsem [Select_CString(child.IsFemale,'ji','ho')] už dost, aby [Select_CString(child.IsFemale,'pochopila','pochopil')] pravdu, a zároveň je stále dost [Select_CString(child.IsFemale,'mladá','mladý')], aby [Select_CString(child.IsFemale,'dokázala','dokázal')] přijmout nové myšlenky.\n\nPokud chci [child.Custom('CZ_FirstNameNoTooltip_A')] zasvětit do služby, kterou si žádá [ROOT.Char.GetSecretFaith.HighGodName], je to teď, nebo nikdy."
 secret_faith.1002.a: "[child.GetFirstNameNoTooltip|U] si zaslouží poznat, jakou moc má [ROOT.Char.GetSecretFaith.HighGodNameAlternate]."
 secret_faith.1002.b: "[child.GetFirstNameNoTooltip|U] je ztracený případ."
 secret_faith.1003.t: "Skryté poznání"
 secret_faith.1003.desc: "Jsou věci, o kterých mi [guardian.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(guardian.IsFemale,'vyprávěla','vyprávěl')], ale o kterých nikdo jiný nikdy nemluví. Nikdy se u těchto témat příliš dlouho nezdržíme a dobře vím, že nemám klást otázky.\n\nDnes večer je však mezi námi něco jinak. Když se usadíme ke čtení, [guardian.GetFirstNameNoTooltip] se mě zeptá, jestli mě něco zajímá..."
 secret_faith.1003.a: "Ano! Prosím, řekni mi všechno!"
 secret_faith.1003.b: "Ne, myslím, že ne..."
 secret_faith.1003.c: "To je rouhání!"
