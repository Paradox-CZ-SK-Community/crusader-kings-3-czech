l_polish:
 fp3_clan.1000.t: "Cennější než zlato?"
 fp3_clan.1000.desc: "Můj výběrčí daní, [target_tax_collector.GetFirstName], se [Select_CString(target_tax_collector.IsFemale,'vrátila','vrátil')] z [Select_CString(target_tax_collector.IsFemale,'její','jeho')] nedávné cesty po říši. [Select_CString(target_tax_collector.IsFemale,'Požádala','Požádal')] o audienci, tvrdíce, že [Select_CString(target_tax_collector.IsFemale,'přivezla','přivezl')] něco #EMP hodnotnějšího#! než zlato.\n\n„Můj pane, právě jsem [Select_CString(ROOT.Char.IsFemale,'vybrala','vybral')] korunní poplatek v [secret_holder.GetCapitalLocation.GetName]. Během mého pobytu jsem [Select_CString(ROOT.Char.IsFemale,'zaslechla','zaslechl')] tiché drby, že [secret_holder.GetTitledFirstName] [target_secret.Custom('SecretDescriptionThirdPerson')]...“\n\n„...a po dalším zjišťování se zdá, že tyto drby skutečně vypadají jako pravdivé.“"
 fp3_clan.1000.a: "Trocha mincí za tvé úsilí."
 fp3_clan.1000.b: "Tak vynikající práce si zaslouží odměnu!"
 fp3_clan.1000.c: "#EMP Lahodné#!! Výborná práce, [target_tax_collector.GetFirstNameNoTooltip]!"
 fp3_clan.1010.t: "[Select_CString(target_tax_collector.IsFemale,'Její','Jeho')] pohár přetéká"
 fp3_clan.1010.desc: "Můj purkrabí, [steward.GetTitledFirstName], procházel daňové knihy a zjistil několik nesrovnalostí v záznamech o výběrech [target_tax_collector.GetFirstNamePossessive] — nesrovnalostí, které činí téměř [ROOT.Var('embezzled_gold').GetValue] zlatých...\n\nJediným logickým vysvětlením takových rozdílů je, že [target_tax_collector.GetFirstNameNoTooltip] z koruny [Select_CString(target_tax_collector.IsFemale,'zpronevěřovala','zpronevěřoval')]. [Select_CString(ROOT.Char.IsFemale,'Povolala','Povolal')] jsem [target_tax_collector.GetHerHim] přede mě, aby [Select_CString(ROOT.Char.IsFemale,'odpověděla','odpověděl')] na tato obvinění.\n\n„Je to pravda, můj pane. Ačkoliv se za to poněkud stydím, prosím vás, abyste spatřil v mých činech důmyslnost — dovednost, kterou byste [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] využít ve svých budoucích záležitostech...“"
 fp3_clan.1010.a: "Vrátíš, co dlužíš #EMP okamžitě!#!"
 fp3_clan.1010.a.success: "Přesvědčíte [target_tax_collector.GetFirstNameNoTooltip], aby peníze [Select_CString(target_tax_collector.IsFemale,'vrátila','vrátil')]"
 fp3_clan.1010.a.failure: "[target_tax_collector.GetFirstNameNoTooltip] není [Select_CString(target_tax_collector.IsFemale,'přesvědčena','přesvědčen')]"
 fp3_clan.1010.b: "Příležitost plus instinkt rovná se zisku."
 fp3_clan.1010.b.flavor: "Chválíte [target_tax_collector.GetFirstNameNoTooltip] za [Select_CString(target_tax_collector.IsFemale,'její','jeho')] důmyslnost"
 fp3_clan.1010.c: "Několik ran bičem by mělo připomenout, čí zlato vybírá."
 fp3_clan.1020.t: "Praktické učení"
 fp3_clan.1020.desc: "Můj purkrabí, [steward.GetTitledFirstName], přistupuje ke mně s [target_tax_collector.GetFirstName], mým výběrčím daní, který kráčí těsně za ním.\n\n„[target_tax_collector.GetFirstNameNoTooltip] v poslední době vykazuje zvlášť dobré výsledky. ‚"
 fp3_clan.1020.stewardship: "„[target_tax_collector.GetSheHe|U] prokazuje nadějné schopnosti v otázkách správy a práce s čísly.“\n\n"
 fp3_clan.1020.intrigue: "„[Select_CString(target_tax_collector.IsFemale,'Projevila','Projevil')] zálibu v rafinovanějších aspektech [Select_CString(target_tax_collector.IsFemale,'její','jeho')] řemesla.“\n\n"
 fp3_clan.1020.diplomacy: "„[Select_CString(target_tax_collector.IsFemale,'Ukázala','Ukázal')] hlubokou dovednost v umění diplomacie.“\n\n"
 fp3_clan.1020.outro: "„Řekl bych, že [target_tax_collector.GetSheHe] si zaslouží nějaké ocenění, můj pane. Koneckonců, zdokonalení této dovednosti může znamenat více zlata v pokladnách říše.“"
 fp3_clan.1020.a: "„Dobrá práce, [target_tax_collector.GetFirstNameNoTooltip]! [Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bys být [Select_CString(ROOT.Char.IsFemale,'hrdá','hrdý')] na své řemeslo.“"
 fp3_clan.1020.b: "„Možná bys [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] naučit ostatní výběrčí daní pár věcí?“"
 fp3_clan.1020.every_tax_collector: "Všichni [tax_collector|E]"
 fp3_clan.1020.b.improved_tax_collectors: "Výběrčí daní vylepšeni"
 fp3_clan.1020.b.improved_tax_collectors.desc: "[target_tax_collector.GetFirstNameNoTooltip] [Select_CString(target_tax_collector.IsFemale,'sdílela','sdílel')] své poznatky s [ROOT.Var('num_improved_tax_collectors').GetValue] výběrčími daní"
 fp3_clan.1020.b.none_improved: "Žádní výběrčí daní nebyli zlepšeni"
 fp3_clan.1020.b.none_improved.desc: "[target_tax_collector.GetFirstNameNoTooltip] [Select_CString(target_tax_collector.IsFemale,'nedokázala','nedokázal')] předat žádné poznatky svým kolegům výběrčím daní"
 fp3_clan.1020.c: "„Nemám čas nafukovat tvé ego!“"
 fp3_clan.1030.t: "Spor o daně"
 fp3_clan.1030.desc: "„Odmítám platit daně [target_tax_collector.Custom2('InsultAdjective', SCOPE.sC('target_taxed_vassal'))] [target_tax_collector.GetFaith.GetAdherentNameNoTooltip]!“ [target_taxed_vassal.GetTitledFirstName] křičí do tváře [target_tax_collector.GetFirstName].\n\n„Je mou povinností vybírat daně pro korunu! Urážka mé osoby je urážkou [ROOT.Char.GetNameNoTooltip]!“ [target_tax_collector.GetFirstNameNoTooltip] odvětí. „Můj pane, prosím vyřešte tento spor, abych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] pokračovat ve své práci.“\n\n[target_taxed_vassal.GetTitledFirstNameNoTooltip] stojí vzteky bez sebe, zatímco [target_tax_collector.GetFirstNameNoTooltip] netrpělivě ťuká [Select_CString(target_tax_collector.IsFemale,'její','jeho')] nohou. Jasně, musím se rozhodnout, zda udobřit svého vazala nebo podpořit svého vybírače daní..."
 fp3_clan.1030.a: "Zjevně [target_tax_collector.GetFirstNameNoTooltip] není [Select_CString(target_tax_collector.IsFemale,'stvořena','stvořen')] pro tuto daňovou oblast."
 tax_collector_fired_on_religious_grounds: "Výběrčí daní propuštěn z náboženských důvodů"
 fp3_clan.1030.b: "[target_taxed_vassal.GetFirstNameNoTooltip] uhradí [target_taxed_vassal.GetHerHis] dlužné."
 fp3_clan.1030.c: "Vyřiďte si to sami."
 fp3_clan.1040.t: "Špatně spravovaná půda"
 fp3_clan.1040.desc: "Můj výběrčí daní, [target_tax_collector.GetFirstName], předkládá zprávu o [Select_CString(target_tax_collector.IsFemale,'jejímu','jeho')] posledním průzkumu říše a vytyčuje záležitost velkého znepokojení:\n\n„Můj pane, způsob, jakým [target_taxed_vassal.GetTitledFirstName] spravuje [Select_CString(target_taxed_vassal.IsFemale,'její','jeho')] pozemky, je naprosto nepřijatelný! S pozemky [target_taxed_vassal.GetPrimaryTitle.GetNameNoTier] by šlo mnohem více udělat, kdyby měli kompetentního správce.“"
 fp3_clan.1040.a: "Připomeňte všem mým vazalům jejich povinnosti."
 fp3_clan.1040.b: "[Select_CString(ROOT.Char.IsFemale,'Sáma','Sám')] naučím [target_taxed_vassal.GetHerHim] pár věcí!"
 fp3_clan.1040.b.success: "Úspěšně jste poučili [target_taxed_vassal.GetTitledFirstNameNoTooltip]"
 fp3_clan.1040.b.failure: "[target_taxed_vassal.GetTitledFirstNameNoTooltip] [Select_CString(target_taxed_vassal.IsFemale,'nepochopila','nepochopil')] vaše poučení"
 fp3_clan.1040.c: "Možná je na místě #EMP fyzické#! připomenutí mé autority..."
