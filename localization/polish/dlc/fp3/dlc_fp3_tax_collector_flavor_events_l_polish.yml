l_polish:
 fp3_clan.1000.t: "Cennější než zlato?"
 fp3_clan.1000.desc: "[Select_CString(target_tax_collector.IsFemale,'Má výběrčí daní','Můj výběrčí daní')|U], [target_tax_collector.GetFirstName], se [Select_CString(target_tax_collector.IsFemale,'vrátila','vrátil')] z nedávné cesty po panství. [Select_CString(target_tax_collector.IsFemale,'Požádala','Požádal')|U] mě o audienci s tvrzením, že [Select_CString(target_tax_collector.IsFemale,'přivezla','přivezl')] něco #EMP cennějšího#! než zlato.\n\n„[Select_CString(ROOT.Char.IsFemale,'Má paní','Můj pane')|U], právě jsem [Select_CString(target_tax_collector.IsFemale,'vybrala','vybral')] daně náležející koruně [CZPrepV(secret_holder.GetCapitalLocation.GetNameNoTooltip)] [CZProvName(secret_holder.GetCapitalLocation,'L')]. Během pobytu se ke mně donesly nenápadné zvěsti, že [secret_holder.GetTitledFirstName] [target_secret.Custom('SecretDescriptionThirdPerson')|l]...“\n\n„...a při podrobnějším pátrání se ukázalo, že tyto zvěsti jsou skutečně pravdivé.“"
 fp3_clan.1000.a: "Několik mincí za tvé úsilí."
 fp3_clan.1000.b: "Tak znamenitá práce si zaslouží pořádnou odměnu!"
 fp3_clan.1000.c: "#EMP Lahůdka#!! Výborná práce, [target_tax_collector.Custom('CZ_FirstNameNoTooltip_V')]!"
 fp3_clan.1010.t: "[Select_CString(target_tax_collector.IsFemale,'Její','Jeho')|U] pohár přetéká"
 fp3_clan.1010.desc: "[Select_CString(steward.IsFemale,'Má správkyně','Můj správce')|U], [steward.GetTitledFirstName], [Select_CString(steward.IsFemale,'procházela','procházel')] daňové záznamy a [Select_CString(steward.IsFemale,'odhalila','odhalil')] několik nesrovnalostí ve výkazech [target_tax_collector.Custom('CZ_FirstName_G')]. Tyto nesrovnalosti představují bezmála [ROOT.Var('embezzled_gold').GetValue] zlatých...\n\nJediným rozumným vysvětlením je, že [target_tax_collector.GetFirstNameNoTooltip] [Select_CString(target_tax_collector.IsFemale,'zpronevěřovala','zpronevěřoval')] peníze koruny. [Select_CString(ROOT.Char.IsFemale,'Povolala','Povolal')|U] jsem si [Select_CString(target_tax_collector.IsFemale,'ji','ho')] před sebe, aby se k těmto obviněním [Select_CString(target_tax_collector.IsFemale,'vyjádřila','vyjádřil')].\n\n„Je to pravda, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]. Trochu se za to stydím, ale prosím, oceň důvtip, který se za mými činy skrývá. Taková schopnost by ti mohla při budoucích záměrech dobře posloužit...“"
 fp3_clan.1010.a: "Vrátíš, co dlužíš, a to #EMP okamžitě!#!"
 fp3_clan.1010.a.success: "Přesvědčíš [target_tax_collector.Custom('CZ_FirstNameNoTooltip_A')], aby peníze [Select_CString(target_tax_collector.IsFemale,'vrátila','vrátil')]"
 fp3_clan.1010.a.failure: "[target_tax_collector.GetFirstNameNoTooltip|U] [Select_CString(target_tax_collector.IsFemale,'zůstává nepřesvědčená','zůstává nepřesvědčený')]"
 fp3_clan.1010.b: "Příležitost a důvtip přinášejí zisk."
 fp3_clan.1010.b.flavor: "Pochválíš [target_tax_collector.Custom('CZ_FirstNameNoTooltip_A')] za [Select_CString(target_tax_collector.IsFemale,'její','jeho')] prohnanost"
 fp3_clan.1010.c: "Dvacet ran bičem ti připomene, čí zlato vlastně vybíráš."
 fp3_clan.1020.t: "Praktická výuka"
 fp3_clan.1020.desc: "[Select_CString(steward.IsFemale,'Má správkyně','Můj správce')|U], [steward.GetTitledFirstName], ke mně přichází v doprovodu [target_tax_collector.Custom('CZ_FirstName_G')], [Select_CString(target_tax_collector.IsFemale,'mé výběrčí daní','mého výběrčího daní')].\n\n„[target_tax_collector.GetFirstNameNoTooltip|U] v poslední době odvádí mimořádně dobrou práci. "
 fp3_clan.1020.stewardship: "[Select_CString(target_tax_collector.IsFemale,'Prokázala','Prokázal')|U] slibné schopnosti v oblasti správy a práce s čísly.“\n\n"
 fp3_clan.1020.intrigue: "[Select_CString(target_tax_collector.IsFemale,'Projevila','Projevil')|U] značné nadání pro rafinovanější stránky svého řemesla.“\n\n"
 fp3_clan.1020.diplomacy: "[Select_CString(target_tax_collector.IsFemale,'Prokázala','Prokázal')|U] mimořádné nadání pro umění diplomacie.“\n\n"
 fp3_clan.1020.outro: "„[Select_CString(steward.IsFemale,'Řekla bych','Řekl bych')|U], že si [target_tax_collector.GetFirstNameNoTooltip] zaslouží nějaké uznání, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]. Koneckonců, zdokonalení těchto schopností může přinést do pokladnice panství ještě více zlata.“"
 fp3_clan.1020.a: "„Výborně, [target_tax_collector.Custom('CZ_FirstNameNoTooltip_V')]! Na své řemeslo můžeš být [Select_CString(target_tax_collector.IsFemale,'právem hrdá','právem hrdý')].“"
 fp3_clan.1020.b: "„Možná bys [Select_CString(target_tax_collector.IsFemale,'mohla','mohl')] něco ze svého umění naučit i ostatní výběrčí daní?“"
 fp3_clan.1020.every_tax_collector: "Každý [Concept('tax_collector','výběrčí daní')|E]"
 fp3_clan.1020.b.improved_tax_collectors: "Výběrčí daní se zlepšili"
 fp3_clan.1020.b.improved_tax_collectors.desc: "[target_tax_collector.GetFirstNameNoTooltip|U] [Select_CString(target_tax_collector.IsFemale,'předala','předal')] své poznatky [ROOT.Var('num_improved_tax_collectors').GetValue] [CZPlural(ROOT.Var('num_improved_tax_collectors').GetValue,'dalšímu výběrčímu daní','dalším výběrčím daní','dalším výběrčím daní')|l]"
 fp3_clan.1020.b.none_improved: "Žádný výběrčí daní se nezlepšil"
 fp3_clan.1020.b.none_improved.desc: "[target_tax_collector.GetFirstNameNoTooltip|U] [Select_CString(target_tax_collector.IsFemale,'nedokázala','nedokázal')] předat ostatním výběrčím daní žádné užitečné poznatky"
 fp3_clan.1020.c: "„Nemám čas ještě přiživovat tvou ješitnost!“"
 fp3_clan.1030.t: "Spor o daně"
 fp3_clan.1030.desc: "„Odmítám platit daně [target_tax_collector.Custom2('CZ_InsultAdjective_D', SCOPE.sC('target_taxed_vassal'))|l] [Select_CString(target_tax_collector.IsFemale,Concatenate(CZFaithAdjDecline(target_tax_collector.GetFaith,'é'),' ženě'),CZAdherent_D(target_tax_collector.GetFaith))|l]!“ [target_taxed_vassal.GetTitledFirstName] křičí přímo do tváře [target_tax_collector.Custom('CZ_FirstName_G')].\n\n„Mou povinností je vybírat daně pro korunu! Urážka mé osoby je urážkou [ROOT.Char.Custom('CZ_NameNoTooltip_G')]!“ odsekne [target_tax_collector.GetFirstNameNoTooltip]. „[Select_CString(ROOT.Char.IsFemale,'Má paní','Můj pane')|U], prosím, rozhodni tento spor, abych [Select_CString(target_tax_collector.IsFemale,'mohla','mohl')] pokračovat ve své práci.“\n\n[target_taxed_vassal.GetTitledFirstNameNoTooltip|U] stojí vzteky bez sebe, zatímco [target_tax_collector.GetFirstNameNoTooltip] netrpělivě podupává nohou. Je jasné, že se musím rozhodnout, zda uklidním [Select_CString(target_taxed_vassal.IsFemale,'svou vazalku','svého vazala')|l], nebo podpořím [Select_CString(target_tax_collector.IsFemale,'svou výběrčí daní','svého výběrčího daní')|l]..."
 fp3_clan.1030.a: "Pro tuto daňovou oblast se [target_tax_collector.GetFirstNameNoTooltip] zjevně nehodí."
 tax_collector_fired_on_religious_grounds: "Výběrčí daní propuštěn z náboženských důvodů"
 fp3_clan.1030.b: "[target_taxed_vassal.GetFirstNameNoTooltip|U] zaplatí, co dluží."
 fp3_clan.1030.c: "Vyřiďte si to mezi sebou."
 fp3_clan.1040.t: "Špatně spravované pozemky"
 fp3_clan.1040.desc: "[Select_CString(target_tax_collector.IsFemale,'Má výběrčí daní','Můj výběrčí daní')|U], [target_tax_collector.GetFirstName], mi předkládá zprávu ze své poslední inspekce panství. Zpráva upozorňuje na závažný problém.\n\n„[Select_CString(ROOT.Char.IsFemale,'Má paní','Můj pane')|U], způsob, jakým [target_taxed_vassal.GetTitledFirstName] spravuje své pozemky, je naprosto nepřijatelný! Na území [target_taxed_vassal.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] by se toho dalo dokázat mnohem více, kdyby bylo svěřeno do rukou schopného správce.“"
 fp3_clan.1040.a: "Připomeň všem mým vazalům jejich povinnosti."
 fp3_clan.1040.b: "[Select_CString(ROOT.Char.IsFemale,'Sama','Sám')|U] [Select_CString(target_taxed_vassal.IsFemale,'jí','mu')] ukážu, jak se to dělá!"
 fp3_clan.1040.b.success: "Podaří se ti poučit [target_taxed_vassal.Custom('CZ_TitledFirstNameNoTooltip_A')]"
 fp3_clan.1040.b.failure: "[target_taxed_vassal.GetTitledFirstNameNoTooltip|U] tvé rady [Select_CString(target_taxed_vassal.IsFemale,'nepochopila','nepochopil')]"
 fp3_clan.1040.c: "Možná je na místě trochu #EMP důraznější#! připomenutí mé autority..."
