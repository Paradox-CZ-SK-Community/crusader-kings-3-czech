l_polish:
 fp3_yearly.2000.t: "Strážci denní počestnosti"
 fp3_yearly.2000.desc_drinking: "Celou noc jsem [Select_CString(ROOT.Char.IsFemale,'popíjela','popíjel')|l] s ostatními vazaly a dobrými přáteli. Právě si vychutnávám poslední ranní doušek, když"
 fp3_yearly.2000.desc_hashish: "Celou noc až do východu slunce jsem si s ostatními vazaly a dobrými přáteli [Select_CString(ROOT.Char.IsFemale,'dopřávala','dopřával')|l] hašiš. Právě kradu poslední hašišový koláček, když"
 fp3_yearly.2000.desc_warning: "mě [cautious_vassal.GetTitledFirstName] v mém rozjaření odvádí stranou.\n\n„Jestli tě takhle na bazaru spatří #italic muhtasibové#!, které vysílá [prudish_liege.GetTitledFirstName], nechá tě zatknout a zbičovat. Zůstaň tady uvnitř až do odpolední modlitby #italic zuhr#!. Ven vyjdi, teprve až vystřízlivíš.“"
 fp3_yearly.2000.a: "Ano, ty víš nejlépe, co dělat."
 fp3_yearly.2000.b: "[prudish_liege.GetTitleAsNameNoTooltip|U] by mě nikdy [Select_CString(prudish_liege.IsFemale,'nenechala','nenechal')|l] zatknout!"
 fp3_yearly.2000.b_flavor: "Věřím, že by mi [prudish_liege.GetTitledFirstName] ve jménu [CZFaithAdjDecline(prudish_liege.GetFaith,'ého')|l] práva úmyslně [Select_CString(prudish_liege.IsFemale,'neublížila','neublížil')|l]."
 fp3_yearly.2000.b_success: "V pořádku se vrátíš domů"
 fp3_yearly.2000.b_failure: "#italic Muhtasibové#!, které vysílá [prudish_liege.GetTitledFirstNameNoTooltip], tě chytí a zbičují"
 fp3_yearly.2001.t: "Opilost na veřejnosti"
 fp3_yearly.2001.desc_intro: "Moji #italic muhtasibové#! hlásí, že [intoxicated.Custom2('MyCharacterIntroduction', ROOT.Char)] bloumá po bazaru,"
 fp3_yearly.2001.desc_drinking: "klopýtá a nesrozumitelně blekotá,"
 fp3_yearly.2001.desc_hashish: "hihňá se a zírá do oblak"
 fp3_yearly.2001.desc_outro: "a to za bílého dne!\n\nObvyklým trestem za tak nestoudné chování je prý zatčení a bičování [Select_CString(intoxicated.IsFemale,'této zbloudilé věřící','tohoto zbloudilého věřícího')|l]."
 fp3_yearly.2001.a: "Nechme metlu stranou..."
 fp3_yearly.2001.b: "[ROOT.Char.GetFaith.HighGodName|U] tentokrát odpustí."
 fp3_yearly.2010.t: "Maundy pšenice"
 fp3_yearly.2010.desc: "Žádné zprávy o suchu ani hladomoru ke mně nedolehly, a přesto si lidé z [bakers_county.Custom('CZ_LandedNameNoTier_G')] stěžují, že chléb neúměrně zdražuje.\n\n„Může za to [Select_CString(greedy_baker.IsFemale,'tvá královská pekařka','tvůj královský pekař')|l] [greedy_baker.GetFirstName],“ povídá mi [random_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)]. „[Select_CString(greedy_baker.IsFemale,'Skoupila','Skoupil')|U] každou dodávku pšenice a mouky, která do města dorazí, a nedovolí nám koupit si ani jediný #italic maund#! pro vlastní potřebu.“"
 fp3_yearly.2010.a: "[Select_CString(greedy_baker.IsFemale,'Bude hozena','Bude hozen')|U] pod nohy"
 fp3_yearly.2010.a.tt: "[greedy_baker.GetFirstName|U] [Select_CString(greedy_baker.IsFemale,'bude ušlapána','bude ušlapán')|l] a doplníme místní zásoby pšenice, abychom uklidnili obyvatele"
 fp3_yearly.2010.a_elephants: "slonům!"
 fp3_yearly.2010.a_camels: "velbloudům!"
 fp3_yearly.2010.a_horses: "koním!"
 fp3_yearly.2010.b: "Zajímavé. [Select_CString(greedy_baker.IsFemale,'Tu','Toho')|U] si musím udržet nablízku."
 fp3_yearly.2010.c: "Skutečným zločinem je, že přede mnou ty zisky tají."
 fp3_yearly.2020.t: "Vychýlené váhy"
 fp3_yearly.2020.desc_intro: "[sinful_tax_collector.GetTitledFirstName|U] vybírá daně pro mého lenního pána, ale do ctnostného člověka má daleko."
 fp3_yearly.2020.desc_greedy: "[Select_CString(sinful_tax_collector.IsFemale,'Její','Jeho')|U] lásce ke zlatu se vyrovná jen láska k vlastnímu životu. Udělá cokoli, aby [Select_CString(sinful_tax_collector.IsFemale,'vybrala','vybral')|l] byť jen o jediný stříbrňák víc, než se má platit."
 fp3_yearly.2020.desc_arbitrary: "Spravedlnost [Select_CString(sinful_tax_collector.IsFemale,'jí','mu')|l] nic neříká. Daně vybírá podle vlastních rozmarů a ignoruje všechna nařízení, která se [Select_CString(sinful_tax_collector.IsFemale,'jí','mu')|l] nehodí."
 fp3_yearly.2020.desc_cynical: "O náboženské záležitosti se příliš nezajímá a [ROOT.Char.GetFaith.HighGodName] u [Select_CString(sinful_tax_collector.IsFemale,'ní','něj')|l] nemá žádnou vážnost. Ranní modlitby prospí a po celý ramadán se potají cpe sousty jídla."
 fp3_yearly.2020.desc_contrite: "Na [Select_CString(sinful_tax_collector.IsFemale,'její','jeho')|l] diskrétnost není spolehnutí. O financích kohokoli vypráví na potkání; nic nedolehne k uším mého lenního pána, aniž by to slyšelo dalších devět lidí."
 fp3_yearly.2020.desc_outro: "\n\nJak může mít [Select_CString(sinful_tax_collector.IsFemale,'taková žena','takový muž')|l] na starosti finance celého panství, a tedy i ty moje?"
 fp3_yearly.2020.a: "[liege.GetTitledFirstNameNoTooltip|U] se musí zodpovídat za hříchy, které má na svědomí [sinful_tax_collector.GetTitledFirstNameNoTooltip]."
 fp3_yearly.2020.a_success: "[sinful_tax_collector.GetTitledFirstNameNoTooltip|U] přijde o svůj úřad"
 fp3_yearly.2020.a_failure: "Tvé protesty zůstanou nevyslyšeny"
 fp3_yearly.2020.a_failure.tt: "[sinful_tax_collector.GetTitledFirstNameNoTooltip|U] ti může začít působit problémy."
 fp3_yearly.2020.b: "Pro dobro panství musím odsoudit [sinful_tax_collector.Custom('CZ_TitledFirstNameNoTooltip_A')]."
 fp3_yearly.2020.b.t: "Odsouzený výběrčí daní"
 fp3_yearly.2020.b.desc: "Došlo k tomu, protože [Select_CString(denouncing_taxpayer.IsFemale,'tvá vazalka','tvůj vazal')|l] [denouncing_taxpayer.GetShortUIName] odsoudil hříšné chování [sinful_tax_collector.Custom('CZ_ShortUIName_G')]."
 fp3_yearly.2020.c: "Pomodlím se za [Select_CString(sinful_tax_collector.IsFemale,'ni','něj')|l]."
 fp3_yearly.2021.desc_intro: "Ačkoli [sinful_tax_collector.GetTitledFirstName] vybírá mé daně celkem schopně, [denouncing_taxpayer.GetName] za mnou přichází se zásadními výhradami.\n\n"
 fp3_yearly.2021.desc_greedy: "„[sinful_tax_collector.GetTitledFirstNameNoTooltip|U] myslí jen na sebe. Pohání [Select_CString(sinful_tax_collector.IsFemale,'ji','ho')|l] láska k penězům, ne spravedlnost. Běžně vybírá víc, než je předepsáno, a na almužnovou daň nedává nic.“"
 fp3_yearly.2021.desc_arbitrary: "„[sinful_tax_collector.GetTitledFirstNameNoTooltip|U] málokdy dbá na zákony či nařízení. Daně vybírá podle vlastních rozmarů a nepravidelné odvody sedlákům často působí těžkosti.“"
 fp3_yearly.2021.desc_cynical: "„[sinful_tax_collector.GetTitledFirstNameNoTooltip|U] nezná bázeň. [ROOT.Char.GetFaith.HighGodName|U] v [Select_CString(sinful_tax_collector.IsFemale,'ní','něm')|l] nevzbuzuje žádnou obavu. Ranní modlitby často prospí a během ramadánu potají ujídá. Kvůli [Select_CString(sinful_tax_collector.IsFemale,'ní','němu')|l] se nás všech zmocňuje strach, že přijde [ROOT.Char.GetFaith.HighGodNamePossessive] soud.“"
 fp3_yearly.2021.desc_contrite: "„[sinful_tax_collector.GetTitledFirstNameNoTooltip|U] nedokáže zachovat diskrétnost. O financích panství vypráví každému, kdo je ochoten naslouchat. Je jen otázkou času, než ty informace padnou do rukou nepřítele.“"
 fp3_yearly.2021.desc_outro: "\n\n[denouncing_taxpayer.GetTitledFirstNameNoTooltip|U] [denouncing_taxpayer.Custom('quirk_pos_present')|l] a zjevně očekává, že kvůli těmto prohřeškům zbavím [sinful_tax_collector.Custom('CZ_TitledFirstNameNoTooltip_A')] úřadu."
 fp3_yearly.2021.a: "[sinful_tax_collector.GetTitledFirstNameNoTooltip|U] [Select_CString(sinful_tax_collector.IsFemale,'bude propuštěna','bude propuštěn')|l], inšalláh."
 fp3_yearly.2021.b: "Budu mít tvá slova na paměti."
 fp3_yearly.2030.t: "Krása vlády"
 fp3_yearly.2030.desc_intro: "Když v zrcadle zkoumám svůj vzhled a můj pohled spočine na"
 fp3_yearly.2030.desc_beauty_bad: "mé děsivé ošklivosti,"
 fp3_yearly.2030.desc_spindly: "mých hubených, uzlovitých končetinách,"
 fp3_yearly.2030.desc_disfigured: "mé znetvořené tváři skryté za maskou,"
 fp3_yearly.2030.desc_scaly: "mé skvrnité, svědivé kůži,"
 fp3_yearly.2030.desc_albino: "mé přízračně bledé kůži a ďábelských očích,"
 fp3_yearly.2030.desc_hunchbacked: "mém nešťastném hrbu,"
 fp3_yearly.2030.desc_inbred: "mém pokřiveném těle,"
 fp3_yearly.2030.desc_outro: "obávám se, že mě lid bude pro můj nepříjemný vzhled nenávidět. Vtom mi však [reassuring_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] nabídne moudrou radu.\n\n„Pokud za svého nepřítele budeš považovat jen zlato, [Select_CString(ROOT.Char.IsFemale,'všechny ženy v tobě uvidí přítelkyni','všichni muži v tobě uvidí přítele')|l].“"
 fp3_yearly.2030.a: "Pak se tedy spřátelím s celým panstvím."
 fp3_yearly.2030.b: "Děkuji ti, [reassuring_courtier.Custom('CZ_NameNoTooltip_V')]."
 fp3_yearly.2030.c: "Jejich věrnost si koupí strach, ne láska."
 fp3_yearly.2030.d: "Časem mě poznají lépe."
 fp3_yearly.2040.t: "Velitel věřících"
 fp3_yearly.2040.desc_attacker_is_muslim: "Kdo se staví proti mně, staví se proti samotnému Prorokovi. A přesto si [infidel.Custom2('InsultNoun', ROOT.Char)|l] [infidel.GetTitledFirstName] [Select_CString(infidel.IsFemale,'troufla','troufl')|l] vyhlásit mi válku.\n\nNe všichni jsou však tak bezbožní. Kdybych [Select_CString(ROOT.Char.IsFemale,'předstoupila','předstoupil')|l] před vojsko [infidel.Custom('CZ_TitledFirstNameNoTooltip_G')] a [Select_CString(ROOT.Char.IsFemale,'připomněla','připomněl')|l] vojákům svou pravomoc udělenou Prorokem, jistě by mnozí složili zbraně."
 fp3_yearly.2040.desc_attacker_is_not_muslim: "[infidel.Custom2('InsultNoun', ROOT.Char)|U] [infidel.GetTitledFirstName] nedbá Prorokových slov. [Select_CString(infidel.IsFemale,'Vyhlásila','Vyhlásil')|U] mi válku a chce zničit mou božskou vládu.\n\nNe všichni jsou však tak bezbožní. Na území [infidel.Custom('CZ_TitledFirstNameNoTooltip_G')] žijí i lidé, kterým [caliph.GetFaith.HighGodName] přikazuje poslušnost. Kdybych před ně [Select_CString(ROOT.Char.IsFemale,'předstoupila','předstoupil')|l] a [Select_CString(ROOT.Char.IsFemale,'připomněla','připomněl')|l] jim svou pravomoc udělenou Prorokem, jistě by složili zbraně."
 fp3_yearly.2040.a: "Posel mě povede!"
 fp3_yearly.2040.a.flavor: "Má slova povede zbožnost i posvátný text [caliph.GetFaith.ReligiousText]."
 fp3_yearly.2040.a_success: "Vojáci uposlechnou tvé autority"
 fp3_yearly.2040.a_failure: "Vojáci se tvé prosbě vysmějí a srazí tě k zemi"
 fp3_yearly.2040.b: "Posel povede [imam.Custom('CZ_TitledFirstName_A')]."
 fp3_yearly.2040.b.flavor: "[imam.GetTitledFirstNameNoTooltip|U] se v náboženských záležitostech vyzná lépe než já."
 fp3_yearly.2040.b_success: "[imam.Custom('MyPriestTitle')|U] z tvého dvora si získá úctu vojáků"
 fp3_yearly.2040.b_failure: "[imam.Custom('MyPriestTitle')|U] z tvého dvora padne pod meči vojáků"
 fp3_yearly.2040.c: "Ne, to je příliš riskantní."
 fp3_yearly.2041.desc_cynical: "[caliph.GetTitledFirstName|U] [Select_CString(caliph.IsFemale,'požadovala','požadoval')|l], aby moji [caliph.GetFaith.GetReligion.Custom('CZ_AdjectiveNoTooltip_sti')|l] vojáci složili zbraně, protože je [Select_CString(caliph.IsFemale,'právoplatnou nástupkyní','právoplatným nástupcem')|l] Proroka. A oni [Select_CString(caliph.IsFemale,'ji','ho')|l] poslechli!\n\nKoho sakra zajímá, jestli je [Select_CString(caliph.IsFemale,'nástupkyní','nástupcem')|l] vlastního zadku? To mi nezabrání do něj pořádně kopnout."
 fp3_yearly.2041.desc_fallback: "Vím přece, že mou válku proti [caliph.Custom('CZ_Name_D')] schvaluje [ROOT.Char.GetFaith.HighGodName]. Přesto [caliph.Custom2('InsultNoun', ROOT.Char)|l] [Select_CString(caliph.IsFemale,'dokázala','dokázal')|l] přesvědčit mé [caliph.GetFaith.GetReligion.Custom('CZ_AdjectiveNoTooltip_ee')|l] vojáky, že coby [Select_CString(caliph.IsFemale,'nástupkyně','nástupce')|l] Proroka může přikázat, aby složili zbraně a vrátili se domů.\n\nMnozí poslechli a já se teď musím vyrovnat s následky. Má armáda je oddaná, ale menší..."
 fp3_yearly.2041.a: "Ať je [caliph.Custom2('InsultNoun', ROOT.Char)|l] [Select_CString(caliph.IsFemale,'prokleta','proklet')|l]!"
 fp3_yearly.2050.t: "Bratrstva futuwwy"
 fp3_yearly.2060.t_madrasas: "Madrasy"
 fp3_yearly.2060.t_houses_of_worship: "Vzdělávání, které nabízejí [ROOT.Char.GetFaith.HouseOfWorshipPlural|l]"
 fp3_yearly.8000.t: "Ghází na scestí"
 fp3_yearly_non_islamic.t: "Bojovník pro pohraničí?"
 fp3_yearly.8000.desc_opening: "[raging_ghazi.GetFirstName|U] [Select_CString(raging_ghazi.IsFemale,'patřila','patřil')|l] k mnoha samozvaným #italic gházíům#!, kteří mířili na hranici bojovat s pohany,"
 fp3_yearly.8000.desc_unislamic_opening: "[raging_ghazi.GetFirstName|U] se [Select_CString(raging_ghazi.IsFemale,'prohlásila za','prohlásil za')|l] #italic [Select_CString(raging_ghazi.IsFemale,'bojovnici','bojovníka')|l]#! a tvrdí, že [ROOT.Char.GetFaith.WarGodName] stojí na [Select_CString(raging_ghazi.IsFemale,'její','jeho')|l] straně. [Select_CString(raging_ghazi.IsFemale,'Vydala','Vydal')|U] se na hranici bojovat s barbary,"
 fp3_yearly.8000_dancing_girl.desc: "když se [Select_CString(raging_ghazi.IsFemale,'zastavila','zastavil')|l] ve městě [murder_barony.Custom('CZ_LandedNameNoTier_L')] a [Select_CString(raging_ghazi.IsFemale,'pustila','pustil')|l] se do nezřízeného pití. V těžké opilosti se tam [Select_CString(raging_ghazi.IsFemale,'zapletla','zapletl')|l] do hádky a [Select_CString(raging_ghazi.IsFemale,'ubila','ubil')|l] hostinského, tanečnici i její ochočenou opici.\n\n"
 fp3_yearly.8000_bath_inspector.desc: "když se [Select_CString(raging_ghazi.IsFemale,'zastavila','zastavil')|l] ve městě [murder_barony.Custom('CZ_LandedNameNoTier_L')] a [Select_CString(raging_ghazi.IsFemale,'pustila','pustil')|l] se do hýření s kurtizánami a ničemy. V té pochybné společnosti se [Select_CString(raging_ghazi.IsFemale,'pohádala','pohádal')|l] se strážným a lázeňským dozorcem a oba [Select_CString(raging_ghazi.IsFemale,'ubodala','ubodal')|l].\n\n"
 fp3_yearly.8000_townsfolk.desc: "když [Select_CString(raging_ghazi.IsFemale,'ji','ho')|l] ve městě [murder_barony.Custom('CZ_LandedNameNoTier_L')] obelstili a okradli svůdní šarlatáni. [Select_CString(raging_ghazi.IsFemale,'Vybila','Vybil')|U] si pak zlost na místním tržišti a čalouněnou podnožkou nelítostně [Select_CString(raging_ghazi.IsFemale,'umlátila','umlátil')|l] prodavače čaje i osla.\n\n"
 fp3_yearly.8000.desc: "„[Select_CString(raging_ghazi.IsFemale,'Tato žena musí být přísně potrestána','Tento muž musí být přísně potrestán')|U],“ říká [righteous_marshal.GetCouncilTitle|l] [righteous_marshal.GetFirstName], [Select_CString(righteous_marshal.IsFemale,'proslulá','proslulý')|l] svou bezúhonností, „aby se uklidnili spořádaní obyvatelé [murder_barony.Custom('CZ_LandedNameNoTierNoTooltip_G')].“\n\n„Ne,“ prosí [raging_ghazi.GetFirstNameNoTooltip], [Select_CString(raging_ghazi.IsFemale,'spoutaná','spoutaný')|l] v mém žaláři. „Musíš mě pustit na hranici. Takový je [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] záměr.“"
 fp3_yearly.8000.a: "I já jsem [Select_CString(ROOT.Char.IsFemale,'kráčela','kráčel')|l] po svaté cestě. Jdi v míru."
 fp3_yearly.8000.b: "Mám pěknou novou celu, přímo pro tebe!"
 fp3_yearly.8000.c: "[Select_CString(raging_ghazi.IsFemale,'Žena','Muž')|U] tvého nadání by se mi [Select_CString(raging_ghazi.IsFemale,'hodila','hodil')|l]..."
 fp3_yearly.8000.flavor.a.tt: "Dovolíš [raging_ghazi.Custom('CZ_FirstNameNoTooltip_D')] pokračovat v hledání mučednické smrti."
 fp3_yearly.8000.flavor.b.tt: "To uklidní obyvatele města."
 fp3_yearly.8001.t: "Dobrodinec pohraničních pevností"
 fp3_yearly.8001.desc: "[concerned_councillor.GetCouncilTitle|U] [concerned_councillor.GetFirstName] bděle sleduje dění a v poslední době si dělá starosti o stav našeho pohraničního opevnění.\n\n„Musíš co nejdříve navštívit pevnosti [frontier_fort_county.Custom('CZ_LandedName_G')], [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Vojákům by to velmi pozvedlo morálku, jinak už propadají malomyslnosti.“\n\nOdmlčí se. „Ale asi bych se [Select_CString(concerned_councillor.IsFemale,'měla','měl')|l] zmínit o zcela nepodložených zvěstech, že tam vypukla drobná epidemie...“"
 fp3_yearly.8001.a: "Dobrá, vyrazím."
 fp3_yearly.8001.b: "[Select_CString(dutiful_spouse.IsFemale,'Má manželka','Můj manžel')|U] [dutiful_spouse.GetFirstName] potřebuje víc práce. Může jet místo mě."
 fp3_yearly.8001.c: "Vyrazím... za pár dní..."
 fp3_yearly.8001.d: "Pohraničí je pro vojáky a osadníky, ne pro mě."
 convincing_councillor_toast.success: "[concerned_councillor.GetFirstName|U] ti důvěřuje"
 convincing_councillor_toast.failure: "[concerned_councillor.GetFirstName|U] si myslí, že [Select_CString(concerned_councillor.IsFemale,'ji považuješ za hlupačku','ho považuješ za hlupáka')|l]"
 delegated_fortress_inspection_toast.success: "[dutiful_spouse.GetFirstName|U] [Select_CString(dutiful_spouse.IsFemale,'udělala','udělal')|l] na vojáky dobrý dojem"
 delegated_fortress_inspection_toast.failure: "[dutiful_spouse.GetFirstName|U] [Select_CString(dutiful_spouse.IsFemale,'nedokázala','nedokázal')|l] vojáky povzbudit"
 fp3_yearly.8001.flavor.b.tt: "[concerned_councillor.GetFirstNameNoTooltip|U] nesouhlasí s tím, aby [Select_CString(dutiful_spouse.IsFemale,'ženy zastávaly','muži zastávali')|l] vojenské role."
 fp3_yearly.8001.flavor.c.tt: "Ve skutečnosti se k tomu nechystáš."
 fp3_yearly.8002.t: "Víra na hranici"
 fp3_yearly.8002.desc: "[Select_CString(concerned_person.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('concerned_person'))|l] [concerned_person.GetFirstName] se [Select_CString(concerned_person.IsFemale,'doslechla','doslechl')|l] znepokojivé zprávy o vojácích v pevnostech [frontier_fort_county.Custom('CZ_LandedName_G')].\n\n„Potají přijali odporné kacířské učení, kterému se říká [regional_heresy.GetName],“ vypráví mi roztřeseným hlasem. „Nevím sice, kdo je vede, ale obávám se, že pokud se nic neudělá, brzy vezmou zbraně, které jsi [Select_CString(ROOT.Char.IsFemale,'zaplatila','zaplatil')|l] #italic ty#!, a pokusí se tě svrhnout.“"
 fp3_yearly.8002.a: "Všechny je upálím a jejich půdu posypu solí."
 fp3_yearly.8002.b: "[regional_heresy.GetNameNoTooltip|U], říkáš? To zní zajímavě..."
 fp3_yearly.8002.c: "Když ti to dělá takové starosti, můžeš je obrátit zpět #italic ty#!."
 fp3_yearly.8002.d: "Počkejme, jak se situace vyvine."
 dealing_with_soldier_heresy_toast.success: "[concerned_person.GetNameNoTooltip|U] [Select_CString(concerned_person.IsFemale,'přivedla','přivedl')|l] kacíře zpět na pravou cestu."
 dealing_with_soldier_heresy_toast.failure: "[concerned_person.GetNameNoTooltip|U] [Select_CString(concerned_person.IsFemale,'nedokázala','nedokázal')|l] vojáky přesvědčit."
 fp3_county_pacified.tt: "Kacíři jsou rozehnáni"
 fp3_county_converted.tt: "[concerned_person.GetNameNoTooltip|U] přivede vojáky zpět k pravé víře"
 fp3_county_galvanized.tt: "Kacíři jsou vyburcováni"
 frontier_heresy_eased: "Kacířství ustoupilo"
 frontier_heresy_mega_outbreak: "Kacířství se rozšířilo"
 fp3_yearly.8003.t: "Vzácný espand"
 fp3_yearly.8003.desc: "[Select_CString(superstitious_consort.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('superstitious_consort'))|l] [superstitious_consort.GetFirstName] má ve zvyku pálit semena #italic espandu#!, aby [Select_CString(superstitious_consort.IsFemale,'zahnala','zahnal')|l] zlé síly. Teď však tvrdí, že [Select_CString(cruel_consort.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('cruel_consort'))|l] [cruel_consort.GetFirstName] na [Select_CString(superstitious_consort.IsFemale,'ni','něj')|l] [Select_CString(cruel_consort.IsFemale,'uvrhla','uvrhl')|l] uřknutí a [Select_CString(cruel_consort.IsFemale,'ukradla','ukradl')|l] [Select_CString(superstitious_consort.IsFemale,'jí','mu')|l] zásoby espandu. [cruel_consort.GetFirstNameNoTooltip|U] samozřejmě popírá, že by o čemkoli [Select_CString(cruel_consort.IsFemale,'věděla','věděl')|l]. [superstitious_consort.GetFirstNameNoTooltip|U] se však zcela soustředí na získání nového espandu, aby se údajné kletby [Select_CString(superstitious_consort.IsFemale,'zbavila','zbavil')|l].\n\n„Prosím, [ROOT.Char.Custom('FormOfAddressForLiege')|l],“ žadoní, „jeden mág mi vyprávěl o posvátné hoře [CZPrepV(espad_mountain_province.GetNameNoTooltip)|l] [CZProvName(espad_mountain_province,'L')]. Jen tam kvete nejlepší espand. Musíš mi ho nechat přivézt.“"
 fp3_yearly.8003.a: "Tvou důvěru si zaslouží [ROOT.Char.GetFaith.HighGodNameAlternate], ne hloupé pověry."
 fp3_yearly.8003.b: "Pošlu ty nejlepší zvědy, jaké lze za zlato najmout."
 fp3_yearly.8003.c: "Pošlu pro něj [quest_chaplain.Custom('CZ_FirstName_A')]. [quest_chaplain.GetCouncilTitle|U] se o to postará."
 fp3_yearly.8003.d: "Nemůžeš si nasbírat obyčejný espand jako všichni ostatní?"
 questing_for_espand_toast.success: "[quest_chaplain.GetFirstName|U] se [Select_CString(quest_chaplain.IsFemale,'vrátila','vrátil')|l] s nejkvalitnějšími semeny espandu."
 questing_for_espand_toast.failure: "[quest_chaplain.GetFirstName|U] se [Select_CString(quest_chaplain.IsFemale,'vrátila','vrátil')|l] s prázdnou."
 fp3_espand_found.tt: "[quest_chaplain.GetFirstNameNoTooltip|U] najde posvátné byliny espandu"
 fp3_espand_unfound.tt: "[quest_chaplain.GetFirstNameNoTooltip|U] ve svém úkolu neuspěje"
 fp3_closer_to_love.tt: "Sblížíš se s [superstitious_consort.Custom('CZ_FirstNameNoTooltip_I')]"
 fp3_yearly.8004.t: "Volání hranice"
 fp3_yearly.8004.desc: "Některým obyvatelům nádherných měst této země stále v srdci zní kvílení větrů severní stepi. Ať už je to k dobrému, nebo ke zlému, [Select_CString(fp3_child_to_leave.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fp3_child_to_leave'))|l] [fp3_child_to_leave.GetFirstName] toto volání začíná cítit.\n\n„[Select_CString(parent.IsFemale,'Matko','Otče')|U], musíš mě nechat odejít. Chci na divoké hranici zdokonalit mysl i umění meče, putovat s karavanami a horaly a možná dokonce najít bájnou horu #italic Hara Berezaiti#!.“\n\n[worried_relation.GetFirstName|U] však [fp3_child_to_leave.Custom('CZ_FirstNameNoTooltip_A')] vroucně miluje a prosí mě, abych tuto žádost [Select_CString(ROOT.Char.IsFemale,'odmítla','odmítl')|l]."
 fp3_yearly.8004.a: "Tas meč, ty nezdárné mládě!"
 fp3_yearly.8004.b: "Nezůstaneš kvůli [worried_relation.Custom('CZ_FirstNameNoTooltip_D')]?"
 fp3_yearly.8004.c: "Pokud odejdeš, nejsi [Select_CString(fp3_child_to_leave.IsFemale,'má dcera','můj syn')|l]."
 fp3_yearly.8004.d: "I já jsem to volání [Select_CString(ROOT.Char.IsFemale,'cítila','cítil')|l]. Jdi, [Select_CString(fp3_child_to_leave.IsFemale,'má dcero','můj synu')|l]."
 fp3_yearly.8004.c.flavor: "Pokud [fp3_child_to_leave.GetFirstNameNoTooltip] odejde, vydědíš [Select_CString(fp3_child_to_leave.IsFemale,'ji','ho')|l]."
 fp3_yearly.8004.a.tt: "Vyzvi [fp3_child_to_leave.Custom('CZ_FirstName_A')] na #V souboj#!, aby [Select_CString(fp3_child_to_leave.IsFemale,'zůstala','zůstal')|l]!\n#weak Tento souboj NENÍ na život a na smrt.#!\nPokud vyhraješ, získáš [prestige_i] [Concept('prestige','prestiž')|E]\n\nTvá [Concept('prowess','udatnost')|E]: [prowess_i]#V [parent.GetProwess]#!\n[Concept('prowess','Udatnost')|EU] [fp3_child_to_leave.Custom('CZ_FirstName_G')]: [prowess_i]#V [fp3_child_to_leave.GetProwess]#!"
 fp3_yearly.8004.b.success: "[fp3_child_to_leave.GetFirstNameNoTooltip|U] se vzdá snů o dobrodružství"
 fp3_yearly.8004.b.failure: "[fp3_child_to_leave.GetFirstNameNoTooltip|U] je stále [Select_CString(fp3_child_to_leave.IsFemale,'pevně rozhodnutá','pevně rozhodnutý')|l] odejít"
 fp3_yearly.8007.t: "[ROOT.Char.GetCulture.Custom('CZ_Adjective_aa')|U] výchova"
 fp3_yearly.8007.desc: "„Vzdávám se! Vzdávám se, [Select_CString(parent.IsFemale,'matko','otče')|l]! Už dost!“ [Select_CString(fp3_child_to_leave.IsFemale,'Má dcera','Můj syn')|U] ustupuje.\n\n„Pokud si tolik přeješ, abych [Select_CString(fp3_child_to_leave.IsFemale,'zůstala','zůstal')|l], udělám to. Budu [Select_CString(fp3_child_to_leave.IsFemale,'tou poslušnou dcerou','tím poslušným synem')|l], [Select_CString(fp3_child_to_leave.IsFemale,'jakou','jakého')|l] chceš mít. Nakonec tě posoudí [ROOT.Char.GetFaith.HighGodNameAlternate].“"
 fp3_yearly.8007.a: "V tom soudu obstojím."
 fp3_yearly.8007.b: "Dobře. Mám pro tebe #italic skutečné#! povinnosti."
 fp3_yearly.8007.c: "A teď se musíš [Select_CString(fp3_child_to_leave.IsFemale,'vdát','oženit')|l]!"
 fp3_yearly.8008.t: "Potupná porážka"
 fp3_yearly.8008.desc: "Klopýtám dozadu, [Select_CString(ROOT.Char.IsFemale,'zkrvavená a vyčerpaná','zkrvavený a vyčerpaný')|l], zatímco ke mně [fp3_child_to_leave.GetFirstNameNoTooltip] přistupuje se zbraní v ruce.\n\n„Už jsem ti to [Select_CString(fp3_child_to_leave.IsFemale,'řekla','řekl')|l], [Select_CString(parent.IsFemale,'matko','otče')|l]. Já #italic odejdu#!. Vyrazím na hranici, jak si mé srdce přeje, daleko po Hedvábné stezce. A #italic ty#! to zaplatíš.“\n\nNezbývá mi než sledovat, jak [Select_CString(fp3_child_to_leave.IsFemale,'má dcera','můj syn')|l] odchází s hlavou vztyčenou a s měšcem kušánských a sásánovských zlatých mincí z mé pokladnice."
 fp3_yearly.8008.a: "[Select_CString(fp3_child_to_leave.IsFemale,'Dceru','Syna')|U] oželet dokážu, ale i své zlato?"
 fp3_yearly.8008.b: "Lepší by snad bylo být eunuchem..."
 fp3_yearly.8008.c: "Osud tě ke mně vrátí, uvidíš..."
 fp3_yearly.8009.t: "[ROOT.Char.GetFaith.GetReligiousHeadTitle.Custom('CZ_AdjectiveNoTooltip_ee')|U] obavy"
 fp3_yearly.8009.desc_beginning: "Východní pohraničí už dlouho poskytuje útočiště pohanům a podivným sektám. V [CZProvName(caliphal_location,'L')] si s tím však [righteous_caliph.GetTitleTierName|l] [righteous_caliph.GetFirstName] dělá čím dál větší starosti.\n\n„Doslechli jsme se, že [very_heretic_county.GetCountyData.GetFaith.GetAdherentNamePlural|l] [CZPrepV(very_heretic_county.GetNameNoTooltip)|l] [very_heretic_county.Custom('CZ_LandedName_L')] provozují bizarní rituály.“ [hof_emissary.GetName|U], [ROOT.Char.GetFaith.GetReligiousHeadTitle.Custom('CZ_AdjectiveNoTooltip_yy')|l] vyslanec, se odmlčí, jako by sbíral odvahu, a potom pokračuje tichým, pohoršeným hlasem. „Někteří dokonce mluví o obřadech #italic tělesné#! povahy. Co je moc, to je příliš."
 fp3_yearly.8009.desc_muslim_or_jewish_insult_ending: "[righteous_caliph.GetTitleTierName|U] chce, aby ses s těmi zločinci [Select_CString(ROOT.Char.IsFemale,'vypořádala','vypořádal')|l].“"
 fp3_yearly.8009.desc_other_insult_ending: "[righteous_caliph.GetTitleTierName|U] chce, aby ses s těmi špinavými rouhači [Select_CString(ROOT.Char.IsFemale,'vypořádala','vypořádal')|l].“"
 fp3_yearly.8009.qurans.flavor: "[righteous_caliph.GetCulture.GetLanguage.GetNameNoTooltip|U] bude jazykem opisů posvátného textu [righteous_caliph.GetFaith.ReligiousText], které financuješ."
 fp3_yearly.8009.a: "Udělám z nich odstrašující příklad."
 fp3_yearly.8009.b: "Písmo ve správném jazyce jim ukáže cestu."
 fp3_yearly.8009.c: "[loyal_chaplain.GetCouncilTitle|U] [loyal_chaplain.GetFirstNameNoTooltip] jim bude kázat."
 fp3_yearly.8009.d: "Bohužel mám naléhavější starosti."
 cultural_acceptance_gain_arabic_books: "Vznik knih v arabštině"
 dealing_with_frontier_heresy_toast.success: "Mise [loyal_chaplain.Custom('CZ_TitledFirstNameNoTooltip_G')] přinesla jisté úspěchy"
 dealing_with_frontier_heresy_toast.failure: "[concerned_person.GetTitledFirstNameNoTooltip|U] [Select_CString(concerned_person.IsFemale,'nedokázala','nedokázal')|l] nikoho přesvědčit"
 fp3_county_listened.tt: "Část místních se obrátí k pravé víře"
 fp3_county_unfazed.tt: "Místní zůstanou neteční"
 fp3_gross_persecutions_toast: "Kacíři jsou rozehnáni"
 fp3_galvanized_heretics_toast: "Kacíři jsou vyburcováni"
 fp3_yearly.8010.t: "Příbytek války"
 fp3_yearly.8010.desc_muslim: "Mezopotámští učenci rozdělili svět na tři části. Mluví o #italic dár at-tauhíd#! věřících a #italic dár al-ahd#! našich spojenců, ale také o #italic dár al-harb#!, pohraničí, příbytku války. [righteous_caliph.GetTitleTierName|U] [righteous_caliph.GetFirstName] tento pohled na svět pevně zastává a neustále se obává hrozby z východu.\n\n„Z tvé [ROOT.Char.GetFaith.GetReligion.Custom('CZ_AdjectiveNoTooltip_ee')|l] víry plyne povinnost rozšířit naši moc nad pohanským pohraničím,“ říká mi. „Modlářské zvyky [pagan_ruler.Custom('CZ_TitledFirstName_G')] jsme snášeli příliš dlouho. Pošlu ti věrné oddíly #italic gházíů#! a turkické žoldnéře, abys [Select_CString(ROOT.Char.IsFemale,'osvobodila','osvobodil')|l] [pagan_county.Custom('CZ_LandedNameNoTier_A')] od [Select_CString(pagan_ruler.IsFemale,'její','jeho')|l] vlády.“"
 fp3_yearly.8010.desc_not_muslim: "[righteous_caliph.GetTitleTierName|U] [righteous_caliph.GetFirstName] pevně věří, že svět je nekonečným bojem civilizace s barbarstvím. Neustále se obává bezvěrců, kteří číhají a kují pikle na nespoutaném východě.\n\n„Z tvé [ROOT.Char.GetFaith.GetReligion.Custom('CZ_AdjectiveNoTooltip_ee')|l] víry plyne povinnost,“ říká mi, „rozšířit naši moc nad pohanským pohraničím. Modlářské zvyky [pagan_ruler.Custom('CZ_TitledFirstName_G')] jsme snášeli příliš dlouho. Pošlu ti věrné oddíly #italic gházíů#! a turkické žoldnéře, abys [Select_CString(ROOT.Char.IsFemale,'osvobodila','osvobodil')|l] [pagan_county.Custom('CZ_LandedNameNoTier_A')] od [Select_CString(pagan_ruler.IsFemale,'její','jeho')|l] vlády.“"
 fp3_yearly.8010.a: "Bez otálení na [Select_CString(pagan_ruler.IsFemale,'ni','něj')|l] udeřím!"
 fp3_yearly.8010_warmonger.tt: "Očekává se, že dobudeš [pagan_county.Custom('CZ_LandedNameNoTier_A')] do #bold pěti let#!."
 fp3_yearly.8010.b: "Pomoz mi tu válku financovat a já ji zahájím."
 fp3_yearly.8010.c: "Jistě chápeš, [Select_CString(righteous_caliph.IsFemale,'velká','velký')|l] [righteous_caliph.Custom('CZ_TitleAsNameNoTooltip_V')], že teď není vhodná doba."
 fp3_yearly.8010.d: "Nad mou zemí nemáš žádnou pravomoc."
 convincing_the_caliph_toast.success: "[righteous_caliph.GetTitleTierName|U] na tvé naléhání své rozhodnutí přehodnotí"
 convincing_the_caliph_toast.failure: "Tvé argumenty nikoho nepřesvědčily"
 fp3_caliph_convinced.tt: "[righteous_caliph.GetTitleTierName|U] se prozatím válce vyhne."
 fp3_caliph_unconvinced.tt: "[righteous_caliph.GetTitleTierName|U] zuří nad tvou slabostí."
 fp3_caliph_dead.title: "Neplatný závazek"
 fp3_caliph_dead.desc: "Tvá dosavadní hlava víry již není k dispozici a tvůj slib dobývání pozbyl platnosti."
 fp3_yearly.8012.t: "Splněný slib"
 fp3_yearly.8012.desc: "„Zdá se,“ prohlašuje [righteous_caliph.GetTitleTierName|l] [righteous_caliph.GetFirstName], „že jsi s naplněním svého slibu dobýt [pagan_county.Custom('CZ_LandedNameNoTier_A')] ve jménu naší víry [Select_CString(ROOT.Char.IsFemale,'neotálela','neotálel')|l]. [Select_CString(ROOT.Char.IsFemale,'Prokázala','Prokázal')|U] jsi, že jsi [Select_CString(ROOT.Char.IsFemale,'spolehlivou panovnicí','spolehlivým panovníkem')|l] a oddaně následuješ [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip|l] učení. Na to jen tak nezapomeneme.“"
 fp3_yearly.8012.a: "[Select_CString(ROOT.Char.IsFemale,'Udělala','Udělal')|U] jsem jen to, co by udělal každý, kdo vyznává [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip|l] učení."
 become_faith_warrior.toast: "[Select_CString(ROOT.Char.IsFemale,'Stala','Stal')|U] ses bojovníkem za náboženství [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]"
 fp3_yearly.8013.t: "[ROOT.Char.GetFaith.GetReligiousHeadTitle.Custom('CZ_AdjectiveNoTooltip_ee')|U] zklamání"
 fp3_yearly.8013.desc: "„Před pěti lety,“ prohlašuje [righteous_caliph.GetTitleTierName|l] [righteous_caliph.GetFirstName], „jsi před námi [Select_CString(ROOT.Char.IsFemale,'slíbila','slíbil')|l] osvobodit [pagan_county.Custom('CZ_LandedNameNoTier_A')] od pohanů. Jak je tedy možné, že se tak nestalo?“"
 fp3_yearly.8013.a: "Mrzí mě to, okolnosti se spikly proti mně."
 fp3_yearly.8013.b: "Neuznávám tebe ani žádný slib."
 fp3_yearly.8014.t: "Tajemství čajové konvice"
 fp3_yearly.8014.desc: "Dlouho jsem se [Select_CString(ROOT.Char.IsFemale,'snažila','snažil')|l] smířit svou zálibu v opojných nápojích se zbožným pohledem, který na tyto věci zastává [ROOT.Char.GetFaith.GetAdherentNameNoTooltip|l]. Naštěstí [Select_CString(smart_courtier.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('smart_courtier'))|l] [smart_courtier.GetFirstName] [Select_CString(smart_courtier.IsFemale,'přišla','přišel')|l] s řešením.\n\n„[Select_CString(smart_courtier.IsFemale,'Doslechla','Doslechl')|U] jsem se, že [ROOT.Char.Custom('LevyMenWomen')|l] z Ušrúsány s přibývajícím věkem potřebují jisté množství alkoholu, aby zvládli tamní chlad,“ říká. „A samozřejmě si také chtějí zpříjemnit život. Mají ve zvyku nalévat nápoje do měděné konvice, takže každý přehnaně horlivý přihlížející předpokládá, že pijí čaj, ne víno. Dělám to už nějakou dobu také a je to velmi praktické.“"
 fp3_yearly.8014.a: "To je ale dobrý nápad!"
 fp3_yearly.8014.b: "[ROOT.Char.Custom('LevyMenWomen')|U] mě možná soudit nebudou, ale [ROOT.Char.GetFaith.HighGodNameAlternate] ano."
 fp3_yearly.8014.c: "Já to dělat nebudu a #italic ty také ne#!."
 f3_yearly.8014_forbidding_teapot_alcohol_flavor: "Přinutíš [smart_courtier.Custom('CZ_NameNoTooltip_A')], aby [Select_CString(smart_courtier.IsFemale,'přestala','přestal')|l] skrývat svůj hřích."
 fp3_yearly.8016.t: "Zapomenuté kameny"
 fp3_yearly.8016.desc: "[Select_CString(hyrcanian_vassal.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hyrcanian_vassal'))|l] [hyrcanian_vassal.GetFirstName] mě [Select_CString(hyrcanian_vassal.IsFemale,'pozvala','pozval')|l] prohlédnout si trojici podivných tesaných kamenů hluboko v hyrkánském lese na svém panství.\n\n„Musela je vztyčit ztracená výprava divokých #italic Rusů#!,“ vypráví mi. „Místní obyvatelé lesa si ty kameny oblíbili. Věří, že pokud je zničíme, jejich neznámí tvůrci se na ně snesou od Kaspického moře a přinesou rychlou a krvavou pomstu. Takovým báchorkám ale nevěřím. Písmena na kamenech sice nedokážu přečíst, ale určitě jsou to pohanské modly a je třeba je rozbít na kusy. Není to tak, [ROOT.Char.Custom('FormOfAddressForLiege')|l]?“"
 fp3_yearly.8016.a: "Podejte mi palici!"
 fp3_yearly.8016.b: "Ne, vyslechneme obyvatele lesa."
 fp3_yearly.8016.c: "Nechám je odvézt a znovu vztyčit u vstupu. [ROOT.Char.Custom('ResidenceBuilding')|U] tak dostane novou ozdobu..."
 fp3_hyrcanian_vassal_convinced.tt: "[hyrcanian_vassal.GetFirstNameNoTooltip|U] toto řešení přijme."
 fp3_hyrcanian_vassal_unconvinced.tt: "[hyrcanian_vassal.GetFirstNameNoTooltip|U] nechápe, proč něco takového děláš."
 convincing_the_hyrcanian_vassal_toast.success: "[hyrcanian_vassal.GetTitledFirstName|U] [Select_CString(hyrcanian_vassal.IsFemale,'přijala','přijal')|l] tvůj návrh."
 convincing_the_hyrcanian_vassal_toast.failure: "[hyrcanian_vassal.GetTitledFirstName|U] [Select_CString(hyrcanian_vassal.IsFemale,'sledovala','sledoval')|l] v zatvrzelém mlčení, jak kameny odvážejí."
 fp3_yearly.8017.t: "Hyrkánská pohroma"
 fp3_yearly.8017.desc: "Došlo k pohromě! Rozzuření #italic ruští#! válečníci se snesli na [runestone_county.Custom('CZ_LandedNameNoTier_A')] jako mrchožrouti na mrtvolu a pobíjeli vše, co jim přišlo do cesty. Dokonce i [hyrcanian_vassal.GetTitledFirstName] [Select_CString(hyrcanian_vassal.IsFemale,'padla','padl')|l] pod ranou sekery. [Select_CString(hyrcanian_vassal.IsFemale,'Utrpěla','Utrpěl')|U] těžké zmrzačení a je v kritickém stavu. Stejně rychle, jako přišli, se však nájezdníci vrátili na čluny a zmizeli v ranní mlze na Kaspickém moři.\n\nMezi přeživšími se šíří zvěsti, že se útočníci možná přišli pomstít [hyrcanian_vassal.Custom('CZ_FirstNameNoTooltip_D')] za znesvěcení ruských runových kamenů před tolika lety..."
 fp3_yearly.8017.a: "Co jsme provedli, že se na nás [ROOT.Char.GetFaith.HighGodNameAlternate] tolik hněvá?"
 fp3_yearly.8017.b: "Pošlu nějaké zlato, snad to aspoň trochu pomůže."
 fp3_yearly.8017.c: "To je zlé znamení... Musím kameny vrátit do [runestone_county.Custom('CZ_LandedNameNoTierNoTooltip_G')]."
 fp3_yearly.8018.t: "Nebeský kůň"
 fp3_yearly.8018.desc_eunuch: "[ROOT.Char.Custom('WarhorseStoryName')|U] se mnou právě cvičí, když ke mně přistoupí poutník z dalekých krajů. Ukloní se jemným, pečlivě odměřeným pohybem, který prozrazuje dlouhá léta strávená na nádherných dvorech.\n\n„Sloužím urozené paní,“ říká, „v Číně, za těmito velkými horami. Má paní je vášnivou hráčkou #italic čóvgánu#!, ale také se ráda vychloubá. Přátelům řekla, že v příští hře pojede na nejlepším koni pod nebesy. Můj lid si už dávno cení #italic nebeských koní#! tvé země a zdá se, [ROOT.Char.Custom('FormOfAddressForLiege')|l], že ty máš toho nejlepšího ze všech. Náhodou však také vím, že máš jisté #italic finanční#! potíže...“\n\n„Tak co říkáš? [ROOT.Char.Custom('HorseStoryMareStallion')|U] takové kvality se jen tak nevidí. Smím tohle nádherné zvíře koupit?“"
 fp3_yearly.8018.desc_grand_old_lady: "[ROOT.Char.Custom('WarhorseStoryName')|U] se mnou právě cvičí, když ke mně s doprovodem přistoupí vznešená dáma v exotickém oděvu.\n\n„Přicházím,“ říká mi, „z velkolepých čínských dvorů. Nedávno jsem se začala zajímat o #italic čóvgán#!, jezdecký sport oblíbený i v tomto tvém malém panství. Pro příští hru jsem se však zavázala jet na #italic nebeském koni#!. Na jednom z těch krví potících ořů z Fergany, kterých si můj lid cení víc než pilulky nesmrtelnosti. Doslechla jsem se, že ty, [Select_CString(ROOT.Char.IsFemale,'bezvýznamná paní','bezvýznamný pán')|l] těchto končin, máš nejlepší zvíře ze všech. Ve tvé stáji prý stojí [ROOT.Char.Custom('HorseStoryMareStallion')|l] nejlepší pod nebesy. A také jsem se doslechla, že jsi v dluzích...“\n\nPodá mi těžký měšec zlata. Její úmysl je zcela jasný."
 fp3_yearly.8018.a: "Dobrá, prodám ti svého koně."
 fp3_yearly.8018.b: "[ROOT.Char.Custom('WarhorseStoryName')|U] zůstane navždy se mnou."
 fp3_yearly.8018.c: "Zmiz mi z očí, ty bezkoňá babo!"
 fp3_yearly.8888.t: "Spor o pastviny"
 fp3_yearly.8888.desc: "[upset_vassal.GetName|U] mě vyhledá, [Select_CString(upset_vassal.IsFemale,'viditelně rozrušená','viditelně rozrušený')|l].\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ prohlásí, „[turkic_leader.GetCulture.Custom('CZ_Adjective_yy')|l] kmen, který vede [turkic_leader.GetName], zabírá všechny pastviny [nomads_county.Custom('CZ_LandedNameNoTier_G')] a vůbec působí spořádaným usedlíkům samé potíže. [Select_CString(upset_vassal.IsFemale,'Zkusila','Zkusil')|U] jsem na ně poslat válečníky #italic ghází#!, ale nomádi jen ustoupí a skryjí se v liduprázdných pustinách. O měsíc později jsou zpátky. Musíš mi pomoci ty špinavé barbary vyhnat, jednou provždy.“\n\n„Já si s nimi poradím,“ ozve se [possibly_capable_marshal.GetCouncilTitle|l] [possibly_capable_marshal.GetFirstName]. „Pošli mě do [nomads_county.Custom('CZ_LandedNameNoTierNoTooltip_G')].“"
 fp3_yearly.8888.a: "Ne, půjdu s nimi jednat [Select_CString(ROOT.Char.IsFemale,'sama','sám')|l]."
 fp3_yearly.8888.b: "Dobrá, [possibly_capable_marshal.Custom('CZ_FirstNameNoTooltip_V')]. Vyveď vojsko do [nomads_county.Custom('CZ_LandedNameNoTierNoTooltip_G')]."
 fp3_yearly.8888.c: "[upset_vassal.Custom('CZ_TitledFirstNameNoTooltip_V')|U], tohle je mezi tebou a [turkic_leader.Custom('CZ_FirstNameNoTooltip_I')]."
 fp3_fighting_turks.success.tt: "[possibly_capable_marshal.GetFirstName|U] zajme [Select_CString(turkic_leader.IsFemale,'vůdkyni','vůdce')|l] nomádů"
 fp3_fighting_turks.failure.tt: "Uniknou tvým vojákům"
 fp3_treating_with_turks.success.tt: "[turkic_leader.GetCulture.Custom('CZ_Adjective_sti')|U] nomádi přistoupí na jednání"
 fp3_treating_with_turks.failure.tt: "Nepodaří se ti je přesvědčit"
 fp3_treating_with_turks_toast.failure: "Nomádi s tebou odmítli jednat."
 fp3_fighting_turks_toast.failure: "[possibly_capable_marshal.GetTitledFirstName|U] [Select_CString(possibly_capable_marshal.IsFemale,'nedokázala','nedokázal')|l] porazit vzpurné nomády."
 fp3_yearly.8889.t: "Trávy dost pro všechny"
 fp3_yearly.8889.desc: "[turkic_leader.GetName|U] mě přijímá s pohostinností odpovídající mému postavení. Nabízí čaj, sušené koňské maso i čerstvou pramenitou vodu. O [upset_vassal.Custom('CZ_Name_L')] však mluví s pohrdáním.\n\n„[upset_vassal.GetTitledFirstNameNoTooltip|U] lže,“ říká [Select_CString(turkic_leader.IsFemale,'vůdkyně','vůdce')|l] nomádů. „Trávy je dost pro všechny. Nech můj lid zůstat [CZPrepV(nomads_county.GetNameNoTierNoTooltip)|l] [nomads_county.Custom('CZ_LandedNameNoTierNoTooltip_L')] a my propůjčíme své luky a meče tvým vojskům. Dokonce přijdu na tvůj dvůr. [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')|U] v tvých službách, to bude mé nové poslání.“"
 fp3_yearly.8889.a: "To zní rozumně."
 fp3_yearly.8889.b: "Tady zůstat nemůžete, ale pojďte pást do [nomads_new_county.Custom('CZ_LandedNameNoTierNoTooltip_G')]."
 fp3_yearly.8889.c: "Bohužel na takovou dohodu nemohu přistoupit."
 fp3_yearly.8890.t: "Osud [Select_CString(turkic_leader.IsFemale,'náčelnice','náčelníka')|l]"
 fp3_yearly.8890.desc_beginning: "[turkic_leader.GetName|U], [Select_CString(turkic_leader.IsFemale,'náčelnice nomádů','náčelník nomádů')|l], vypadá po předvedení přede mě zcela sklíčeně. Spojenců tu má pramálo, pokud vůbec nějaké.\n\n„Podařilo se nám [turkic_leader.GetCulture.Custom('CZ_Adjective_ee')|l] nomády přepadnout,“ vysvětluje [possibly_capable_marshal.GetFirstName], „a zajmout [Select_CString(turkic_leader.IsFemale,'tuto ženu','tohoto muže')|l] i část [Select_CString(turkic_leader.IsFemale,'jejích','jeho')|l] válečníků.“\n\n"
 fp3_yearly.8890_brutal_demands: "„Setněte jim hlavy,“ naléhá [upset_vassal.GetName], „ti divoši zabili mnoho mých poddaných.“\n\n"
 fp3_yearly.8890_nonbrutal_demands: "„Ať slíbí, že mou zemi navždy opustí,“ navrhuje [upset_vassal.GetTitledFirstName]. „[turkic_leader.Custom('CZ_FirstNameNoTooltip_A')|U] drž jako rukojmí, aby dodrželi slovo.“\n\n"
 fp3_yearly.8890.desc_ending: "„Pravda,“ říká [turkic_leader.GetNameNoTooltip], „nebojím se zabíjet ty, kdo proti mně přicházejí s kopími. Ale můj meč i luk, stejně jako zbraně mých válečníků, by ti mohly sloužit, [Select_CString(ROOT.Char.IsFemale,'velká','velký')|l] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')], pokud mě pustíš.“"
 fp3_yearly.8890.a: "Dobrá, ať se tvůj lid usadí [CZPrepV(nomads_new_county.GetNameNoTierNoTooltip)|l] [nomads_new_county.Custom('CZ_LandedNameNoTierNoTooltip_L')] a slouží mi."
 fp3_yearly.8890.b: "Ne, tvůj život propadl."
 fp3_yearly.8890.c: "Nechám si tě jako rukojmí, aby tvůj kmen zůstal v klidu."
 nomad_friction_gone.tt: "Nomádi jsou uklidněni"
 nomad_friction_active.tt: "Nomádi zuří"
 fp3_frontier_story_cycle.0001_opening: "[Select_CString(ROOT.Char.IsFemale,'Má drahá lenní paní','Můj drahý lenní pane')|U]"
 fp3_frontier_story_cycle.0001_letter: "Posílám ti dva ubohé sirotky. Jejich rodiče zemřeli hlady poté, co horda [turkic_leader.GetCulture.Custom('CZ_Adjective_yych')|l] nomádů nechala koně rozdupat jejich pole a sady. Když máš pro divoké nomády takovou slabost, věřím, že přijmeš odpovědnost i za jejich oběti. Kéž tvou vládu prozáří světlo, které sesílá [ROOT.Char.GetFaith.HighGodNameAlternate]."
 fp3_frontier_story_cycle.0001.a: "Co to..."
 children_arriving_shortly.tt: "Děti brzy dorazí"
 fp3_frontier_story_cycle.0002_opening: "[Select_CString(ROOT.Char.IsFemale,'Velká','Velký')|U] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]"
 fp3_frontier_story_cycle.0002_letter: "Lituji svého chování během sporu s nomády. Skutečně opustili [nomads_county.Custom('CZ_LandedNameNoTier_A')] a doslechlo se ke mně, že konflikty se sedláky ustaly. Stále sice trvám na tom, že bys [Select_CString(ROOT.Char.IsFemale,'měla','měl')|l] hrozbu nomádů brát vážně, ale jako projev úcty ti chci nabídnout tyto krásné zlaté mince, ražené kdysi dávno v Kušánské říši."
 fp3_frontier_story_cycle.0002.a: "Pěkný dar. Vše je odpuštěno."
 fp3_frontier_story_cycle.0002.b: "Tvé cetky nepotřebuji a tvou omluvu nepřijímám."
 fp3_frontier_story_cycle.0003.t: "Jejich díl břemene"
 fp3_frontier_story_cycle.0003_beginning: "[Select_CString(greedy_chaplain.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('greedy_chaplain'))|l] [greedy_chaplain.GetFirstName] očividně [Select_CString(greedy_chaplain.IsFemale,'strávila','strávil')|l] mnoho času úvahami o [turkic_leader.Custom('CZ_Name_L')] a [Select_CString(turkic_leader.IsFemale,'jejím','jeho')|l] kočovném kmeni.\n\n„Ano, [ROOT.Char.Custom('FormOfAddressForLiege')|l],“ říká [greedy_chaplain.GetFirstNameNoTooltip], „[Select_CString(greedy_chaplain.IsFemale,'pamatovala','pamatoval')|l] jsem na ně v modlitbách. [Select_CString(greedy_chaplain.IsFemale,'Zjistila','Zjistil')|U] jsem totiž, že někteří se stále drží pohanské víry."
 fp3_frontier_story_cycle.0003_jizya: "Za výsadu ponechat si modlářské zvyky by měli platit daň #italic džizju#!.“\n\n"
 fp3_frontier_story_cycle.0003_not_jizya: "Měli bychom následovat příkladu muslimů a uvalit na ně zvláštní daň. Vždyť už tak jsi [Select_CString(ROOT.Char.IsFemale,'byla','byl')|l] víc než [Select_CString(ROOT.Char.IsFemale,'štědrá','štědrý')|l], ne?“\n\n"
 fp3_frontier_story_cycle.0003_ending: "„To není fér,“ protestuje [turkic_leader.GetFirstNameNoTooltip]. „[Select_CString(turkic_leader.IsFemale,'Dala','Dal')|U] jsem ti do služeb sto jízdních lučištníků i sebe. Pokud nám tuhle daň neuložíš, slibuji, že na tu laskavost nezapomenu.“"
 fp3_frontier_story_cycle.0003.a: "Najdeme každičkou minci, kterou tvůj kmen ukrývá."
 fp3_frontier_story_cycle.0003.b: "Ne, [greedy_chaplain.GetFirstNameNoTooltip] má pravdu. Daň platit musíte."
 fp3_frontier_story_cycle.0003.c: "Dobrá, [turkic_leader.Custom('CZ_FirstNameNoTooltip_V')], to zní spravedlivě."
 resentful_nomads.toast: "Nomádi jsou rozladěni"
 fp3_frontier_story_cycle.0004.t: "Sirotci kvůli [turkic_leader.GetCulture.Custom('CZ_AdjectiveNoTooltip_yym')|l] nomádům"
 fp3_frontier_story_cycle.0004.desc: "[orphan_girl.GetName|U] vypadá opravdu zbědovaně. Její malý bratr [orphan_boy.GetName] je na tom stejně, jako by ho stíhalo každé možné neštěstí.\n\n„Prosím, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ říká rozechvělým hlasem, „už týden jsme nejedli. Smím požádat aspoň o kousek chleba? Nevadí, když bude plesnivý, pokud nějaký můžeš postrádat...“\n\nKdyž se ptám dál, zdá se, že přesně neví, kdo za neštěstí její rodiny může. „Přijeli jezdci, rozdupali nám úrodu a ukradli ovce... Pak zmizeli. Teď nevím, co s námi bude. Ale strašně mě mrzí, že tě [upset_vassal.GetTitledFirstName] [Select_CString(upset_vassal.IsFemale,'obtěžovala','obtěžoval')|l] takovou maličkostí.“"
 fp3_frontier_story_cycle.0004.a: "Neboj se, ujmu se vás."
 fp3_frontier_story_cycle.0004.b: "Připadá mi spravedlivé, aby vás přijal kmen [turkic_leader.Custom('CZ_FirstNameNoTooltip_G')]."
 fp3_frontier_story_cycle.0004.c: "Pošlu vás do kláštera."
 fp3_frontier_story_cycle.0004.d: "Nevím, co [upset_vassal.GetFirstNameNoTooltip] [Select_CString(upset_vassal.IsFemale,'očekávala','očekával')|l]. Běžte najít sirotčinec."
 fp3_pay_for_upkeep_flavor: "Budeš muset hradit jejich živobytí."
 fp3_frontier_story_cycle.0005.t: "Dvě stě jezdců"
 fp3_frontier_story_cycle.0005.desc: "Zatímco přemítám o strategii a bitvách, přichází [turkic_leader.GetName] a s [Select_CString(turkic_leader.IsFemale,'ní','ním')|l] stovky jezdců.\n\n„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U],“ říká s úklonou, „já i celý můj kmen jsme ti slíbili podporu. Teď, když jsi ve válce, ti můžeme nabídnout dalších dvě stě zkušených jízdních lučištníků, ale pouze po dobu tohoto konfliktu. Až se situace uklidní, vrátí se do jurt ke svým rodinám. Žádáme jen, abys na tuto laskavost [Select_CString(ROOT.Char.IsFemale,'nezapomněla','nezapomněl')|l].“"
 fp3_frontier_story_cycle.0005.a: "S tím mohu souhlasit."
 fp3_frontier_story_cycle.0005.b: "Už mám těch řečí o laskavostech dost! "
 fp3_frontier_story_cycle.0005.c: "Ne, děkuji. Zvládnu to i bez nich."
 fp3_frontier_story_cycle.0006.t: "Zbloudilý šíp"
 fp3_frontier_story_cycle.0006_beginning: "[one_eyed_child.GetName|U] [Select_CString(one_eyed_child.IsFemale,'pobíhala','pobíhal')|l] po mém sídle a [ROOT.Char.Custom('ResidenceBuilding')|l] [Select_CString(one_eyed_child.IsFemale,'jí','mu')|l] slouží jako oblíbené hřiště. Pak ale došlo k neštěstí. [turkic_leader.GetName|U] [Select_CString(turkic_leader.IsFemale,'cvičila','cvičil')|l] s několika svými válečníky střelbu z luku a [Select_CString(one_eyed_child.IsFemale,'má nezbedná','můj nezbedný')|l] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('one_eyed_child'))|l] [Select_CString(one_eyed_child.IsFemale,'dostala','dostal')|l] zbloudilý šíp přímo do oka."
 fp3_frontier_story_cycle.0006_has_court_physician: "„Bude v pořádku, věřím,“ říká [Select_CString(scoped_physician.IsFemale,'má lékařka','můj lékař')|l] [scoped_physician.GetFirstName], „bohužel se však bude muset celý život obejít bez jednoho oka. Smím pokorně doporučit, aby v budoucnu přes nádvoří létalo méně šípů?“\n\n"
 fp3_frontier_story_cycle.0006_no_court_physician: "Narychlo přivolaný místní lékař potvrdil, že se uzdraví, ale oko je navždy ztraceno.\n\n"
 fp3_frontier_story_cycle.0006_ending: "„Byla to nehoda,“ prosí [turkic_leader.GetFirstName]. „Netrestej mě ukvapeně, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Jak máme bránit tvou zemi, když nebudeme cvičit?“"
 fp3_frontier_story_cycle.0006.a: "O svém umění lukostřelby můžeš přemýšlet... v žaláři."
 fp3_frontier_story_cycle.0006.b: "[ROOT.Char.Custom('ResidenceBuilding')|U] a okolí budou odteď bez lukostřelby."
 fp3_frontier_story_cycle.0006.c: "Asi si to [ROOT.Char.GetFaith.HighGodNameAlternate] přeje."
 fp3_frontier_story_cycle.0007.t: "Pohroma karavan"
 fp3_frontier_story_cycle.0007.desc: "„Ach, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ říká [Select_CString(warmonger_councillor.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('warmonger_councillor'))|l] [warmonger_councillor.GetFirstName], „kupci [CZPrepV(bandits_county.GetNameNoTooltip)|l] [bandits_county.Custom('CZ_LandedName_L')] si stěžují na nájezdy jízdních lupičů. Karavany se teď této zemi vyhýbají a našemu obchodu na Hedvábné stezce to škodí. Prosím, pošli mě to vyšetřit.“\n\n„Ne,“ vpadne prudce [turkic_leader.GetName]. „Mohu své válečníky poslat natrvalo chránit cesty karavan, pokud nám dovolíš odteď pást koně [CZPrepV(bandits_county.GetNameNoTierNoTooltip)|l] [bandits_county.Custom('CZ_LandedNameNoTierNoTooltip_L')]. To by přece bylo lepší řešení?“\n\n[warmonger_councillor.GetFirstNameNoTooltip|U] však protestuje. „Pozor, [ROOT.Char.Custom('FormOfAddressForLiege')|l], sedláci nesnášejí, když necháváš nomády volně putovat.“"
 fp3_frontier_story_cycle.0007.a: "Plán [turkic_leader.Custom('CZ_FirstNameNoTooltip_G')] je přesto lepší."
 fp3_frontier_story_cycle.0007.b: "Dobrá, dám ti tuto příležitost."
 fp3_frontier_story_cycle.0007.c: "Stačí počkat, kupci se nakonec vrátí."
 fp3_investigating_attacks_successful: "[warmonger_councillor.GetFirstNameNoTooltip|U] zastaví útoky a poučí se z toho"
 fp3_investigating_attacks_dismal_failure: "[warmonger_councillor.GetFirstNameNoTooltip|U] se vrátí bez výsledků"
 fp3_investigating_attacks_toast_successful: "[bandits_county.GetNameNoTierNoTooltip|U] je v bezpečí"
 fp3_investigating_attacks_toast_dismal_failure: "[CZPrepV(bandits_county.GetNameNoTierNoTooltip)|U] [bandits_county.Custom('CZ_LandedNameNoTierNoTooltip_L')] vládnou lupiči"
 attacks_abated.toast: "Útoky lupičů ustaly"
 fp3_frontier_story_cycle.0099.t: "Léno pro [turkic_leader.Custom('CZ_FirstNameNoTooltip_A')]"
 fp3_frontier_story_cycle.0099.desc: "„Dlouho jsem ti [Select_CString(turkic_leader.IsFemale,'věrně sloužila','věrně sloužil')|l], [ROOT.Char.Custom('FormOfAddressForLiege')|l], a na vlastní náklady [Select_CString(turkic_leader.IsFemale,'vydatně podporovala','vydatně podporoval')|l] tvé cíle.“ [turkic_leader.GetName|U] zjevně [Select_CString(turkic_leader.IsFemale,'čekala','čekal')|l] právě na tuto chvíli. Člověk nemusí být [Select_CString(turkic_leader.IsFemale,'věštkyní','věštcem')|l], aby poznal, co přijde dál.\n\n„Už dávno je načase dát mi odměnu i odpovědnost, která mi náleží. Uděl mi [title_to_grant.Custom('CZ_LandedName_A')] do dědičného držení a můj kmen bude sloužit rodu [ROOT.Char.GetDynastyHouseName] po celé věky. Zdaleka to není tvá nejbohatší země, ale přímou správu naléhavě potřebuje. Pocti mě takto, jinak možná odvedu své válečníky jinam.“"
 fp3_frontier_story_cycle.0099.a: "Považuj to za své."
 fp3_frontier_story_cycle.0099.b: "Nevezmeš si raději [extra_title_to_grant.Custom('CZ_LandedNameNoTooltip_A')]?"
 fp3_frontier_story_cycle.0099.c: "Mohu ti udělit [extra_extra_title_to_grant.Custom('CZ_LandedNameNoTierNoTooltip_A')], ale víc ne."
 fp3_frontier_story_cycle.0099.d: "Ne."
 fp3_yearly.8019.t: "Útočiště světla"
 fp3_yearly.8019.desc: "[hateful_ruler.GetTitleTierName|U] [hateful_ruler.GetFirstName] [Select_CString(hateful_ruler.IsFemale,'zahájila','zahájil')|l] ve své zemi pronásledování. Jeho terčem jsou zbývající [manichean_leader.GetFaith.GetAdherentNamePlural|l]. [manichean_leader.GetName|U], [Select_CString(manichean_leader.IsFemale,'vůdkyně','vůdce')|l] této sužované víry, mě nyní vyhledává s velkou hromadou zaprášených knih.\n\n„[Select_CString(ROOT.Char.IsFemale,'Velká','Velký')|U] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ říká, „má víra je stará. Soupeřila s křesťanstvím, když bylo ještě mladé. O tomto padlém hmotném světě máme mnoho vědomostí a něco skromného víme i o vyšším světě světla. Někteří naši druhové se už usadili [CZPrepV(refuge_of_light.GetNameNoTierNoTooltip)|l] [refuge_of_light.Custom('CZ_LandedNameNoTier_L')]. Dovolíš totéž i mým následovníkům?“\n\n„Na oplátku tu mohu zůstat a sloužit ti. Podělím se s tebou o poklady vědění z našich starobylých knihoven v Bagdádu i z Ktésifóntu před jeho pádem.“"
 fp3_yearly.8019.a: "Tento návrh [Select_CString(ROOT.Char.IsFemale,'ráda','rád')|l] přijímám."
 fp3_yearly.8019.b: "Všichni se můžete usadit [CZPrepV(refuge_of_light.GetNameNoTierNoTooltip)|l] [refuge_of_light.Custom('CZ_LandedNameNoTierNoTooltip_L')], pokud zaplatíte příslušnou daň."
 fp3_yearly.8019.c: "Ve své zemi vám útočiště neposkytnu."
 manicheans_sent_away.tt: "[manichean_leader.GetFaith.GetAdherentNamePlural|U] od tebe dostanou příkaz odejít"
 fp3_yearly.8020.t: "Paní této země"
 fp3_yearly.8020.desc: "[CZPrepV(temple_county.GetNameNoTierNoTooltip)|U] [temple_county.Custom('CZ_LandedNameNoTier_L')] stojí svatyně zasvěcená [bibi_shahrbanu.Custom('CZ_FirstName_D')], sásánovské princezně, která si vzala velkého [imam_husayn.Custom('CZ_TitledFirstName_A')]. Prý při útěku na koni z bitvy u Karbaly [bibi_shahrbanu.GetFirstNameNoTooltip] zvolala o záchranu, hora se otevřela a přijala ji do sebe. Od té doby na to místo putuje mnoho žen, aby jí vzdaly úctu.\n\n[righteous_caliph.GetTitledFirstName|U] však tvrdí, že původně tu byl předmětem uctívání [GetFaithByKey('mazdayasna').FertilityGodName] a dnešní projevy zbožnosti jsou zvrácené a bezbožné. Chce svatyni zničit.\n\n„To nesmíš,“ prosí [Select_CString(pious_woman.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('pious_woman'))|l] [pious_woman.GetFirstName]. „[bibi_shahrbanu.GetFirstNameNoTooltip|U] je vzorem všem ženám v Persii. Musíš svatyni zachovat.“"
 fp3_yearly.8020.a: "Kvůli tobě tam dokonce pošlu stráže, aby ji chránily."
 fp3_yearly.8020.b: "Byla to perská #italic princezna#!! Nikdo tu svatyni nepoškodí."
 fp3_yearly.8020.c: "Bohužel musí být zničena."
 supporting_womens_faith_flavor: "Začneš podporovat kult [bibi_shahrbanu.Custom('CZ_FirstNameNoTooltip_G')]."
 fp3_sharhabanu_devotees_angry.tt: "Ctitelům [bibi_shahrbanu.Custom('CZ_FirstNameNoTooltip_G')] na tvém dvoře se to nemusí líbit"
 fp3_yearly.8021.t: "Nehoda s kyselinou"
 fp3_yearly.8021.desc: "Před několika dny se [alchemy_enthusiast.GetName], [Select_CString(alchemy_enthusiast.IsFemale,'učená','učený')|l] [alchemy_enthusiast.Custom2('RelationToMe', SCOPE.sC('upset_vassal'))|l], [Select_CString(alchemy_enthusiast.IsFemale,'zúčastnila','zúčastnil')|l] pokusu s vitriolovým olejem, který [Select_CString(enthusiastic_alchemist.IsFemale,'připravila','připravil')|l] [Select_CString(enthusiastic_alchemist.IsFemale,'proslulá alchymistka','proslulý alchymista')|l] [enthusiastic_alchemist.GetName]. [upset_vassal.GetFirstName|U], [Select_CString(upset_vassal.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('upset_vassal'))|l], si teď stěžuje, že se zřejmě něco strašlivě pokazilo.\n\n„Musíš [enthusiastic_alchemist.Custom('CZ_FirstNameNoTooltip_A')] přísně potrestat,“ říká [upset_vassal.GetTitledFirstNameNoTooltip]. „Podívej, v jakém zbědovaném stavu teď je [alchemy_enthusiast.Custom2('RelationToMe', SCOPE.sC('upset_vassal'))|l]!“\n\n„Ne, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ prosí [enthusiastic_alchemist.GetFirstNameNoTooltip]. „Jen jsem [Select_CString(enthusiastic_alchemist.IsFemale,'zdokonalila','zdokonalil')|l] postup, který moudří hledali už dlouho. Nemohu za to, že [alchemy_enthusiast.GetTitledFirstNameNoTooltip] [Select_CString(alchemy_enthusiast.IsFemale,'zacházela','zacházel')|l] neopatrně s celou #italic ukíjou#! nejžíravější látky, jakou svět dosud viděl.“"
 fp3_acid_delving_deeper_tooltip: "Přehlédneš stížnost [upset_vassal.Custom('CZ_FirstNameNoTooltip_G')], abys [Select_CString(ROOT.Char.IsFemale,'prozkoumala','prozkoumal')|l] objevy [enthusiastic_alchemist.Custom('CZ_NameNoTooltip_G')]."
 fp3_yearly.8021.a: "[enthusiastic_alchemist.Custom('CZ_NameNoTooltip_V')|U], pověz mi o těch objevech víc..."
 fp3_yearly.8021.b: "Dobrá, [upset_vassal.Custom('CZ_TitledFirstNameNoTooltip_V')], nechám [Select_CString(enthusiastic_alchemist.IsFemale,'ji','ho')|l] popravit."
 fp3_yearly.8021.c: "Pro [Select_CString(enthusiastic_alchemist.IsFemale,'tu vyzáblou alchymistku','toho vyzáblého alchymistu')|l] bych v žaláři místo [Select_CString(ROOT.Char.IsFemale,'našla','našel')|l]..."
 fp3_yearly.8021.d: "Nikdo za to nemůže. Musíte si navzájem odpustit."
 fp3_yearly.8022.t: "Vitriolové vidiny"
 fp3_yearly.8022.desc: "„Můj vynález vychází ze sklovitého nerostu, kterému staří Babyloňané a Řekové říkali #italic vitriol#!,“ vysvětluje [enthusiastic_alchemist.GetName]. „Pečlivým pražením zelené skalice v železné retortě jsem [Select_CString(enthusiastic_alchemist.IsFemale,'vytvořila','vytvořil')|l] tuto žíravinu. Dovedu si představit její využití ve vědě i lékařství. Ale pozor, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')|l], není radno si s ní zahrávat, jak už [alchemy_enthusiast.GetTitledFirstName] [Select_CString(alchemy_enthusiast.IsFemale,'zjistila','zjistil')|l]. Nechceš podpořit můj další výzkum?“"
 fp3_yearly.8022.a: "Tu látku prozkoumám osobně!"
 fp3_yearly.8022.b: "Nemohla by mít i... #italic vojenské#! využití?"
 fp3_yearly.8022.c: "Dobrá práce, ale nemám pro ni využití."
 fp3_studying_acid_ominously_tooltip: "Pokračuješ ve výzkumu..."
 fp3_yearly.8022.b.flavor: "[enthusiastic_alchemist.GetNameNoTooltip|U] zůstane na tvém dvoře a bude pokračovat ve výzkumu."
 fp3_yearly.8022.c.flavor: "[enthusiastic_alchemist.GetNameNoTooltip|U] odnese své vědomosti jinam."
 fp3_yearly.8023.t: "Žíravé záhady"
 fp3_yearly.8023.desc: "Zatímco opatrně přelévám zlověstně syčící kapaliny z lahve do lahve, [enthusiastic_alchemist.GetName] mě sleduje s obavami.\n\n„Ach, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ říká, „mým hlavním oborem jsou dějiny a teologie. Vedle tebe si v alchymii připadám jen jako [Select_CString(enthusiastic_alchemist.IsFemale,'amatérka','amatér')|l]. Zkušenost mi však říká, že víc se prozatím nedozvíme. S tímto vitriolovým olejem, který jsem [Select_CString(enthusiastic_alchemist.IsFemale,'vytvořila','vytvořil')|l], bychom [Select_CString(And(ROOT.Char.IsFemale,enthusiastic_alchemist.IsFemale),'měly','měli')|l] přestat pokusničit. Obávám se, že nás jinak [ROOT.GetCharacter.GetFaith.HighGodNameAlternate] za naši marnivost potrestá. Možná taková kyselina vůbec neměla na svět přijít.“"
 fp3_yearly.8023.a: "Ne, dotáhnu to do konce."
 fp3_yearly.8023.b: "Možná máš pravdu. Přesto bys [Select_CString(enthusiastic_alchemist.IsFemale,'měla','měl')|l] zůstat a sloužit mi."
 fp3_yearly.8023.c: "Jak si přeješ. Jdi a vezmi si svou kyselinu s sebou."
 experimenting_with_acid_toast.failure: "Tvé pokusy selhaly"
 experimenting_with_acid_toast.success: "Tvé pokusy dopadly dobře"
 fp3_horrible_accident.flavor: "Riskuješ strašlivou nehodu."
 fp3_yearly.8024.t: "Návrat k nebesům"
 fp3_yearly.8024.desc: "Když horečka a třes na krátký okamžik poleví, [dying_consort.GetFirstName] se na mě podívá s bledým úsměvem. „[Select_CString(ROOT.Char.IsFemale,'Má dobrá ženo','Můj dobrý muži')|U], na tomto světě už mi mnoho času nezbývá. Ani nejlepší lékaři nemohou nevyhnutelné víc než oddálit. Cítím to.“ Zdá se, že i udržet se ještě chvíli při vědomí stojí [Select_CString(dying_consort.IsFemale,'ji','ho')|l] veliké úsilí.\n\n„Poslouchej,“ říká slábnoucím hlasem, „tohle je mé poslední přání. Chci, aby mé tělo podle zvyku předků připadlo mrchožravým ptákům. Ať mou duši odnesou zpět do jejího příbytku v nebesích. Žádný hrob ani oheň, prosím, zapřísahám tě. V horečnatých snech jsem [Select_CString(dying_consort.IsFemale,'zahlédla','zahlédl')|l] svět za hranicí života... Chci skončit postaru, jako [Select_CString(dying_consort.IsFemale,'pravá dcera','pravý syn')|l] Persie.“"
 fp3_yearly.8024.a: "Postarám se o to, slibuji."
 fp3_yearly.8024.b: "Mohu ti nebeský pohřeb dopřát potají, ale panství se o tom nesmí dozvědět."
 fp3_yearly.8024.c: "Bohužel něco takového [ROOT.GetCharacter.GetFaith.HighGodNameAlternate] pokládá za urážku."
 fp3_relations_care_about_sky_burial.tt: "Tví [Concept('courtiers','dvořané')|E], [Concept('vassals','vazalové')|E] a [Concept('close_family_members','členové blízké rodiny')|E] na to budou mít svůj názor."
 hiding_sky_burial_toast.success: "Nebeský pohřeb se ti podařilo utajit"
 hiding_sky_burial_toast.failure: "Tvůj nebeský pohřeb byl odhalen"
 fp3_hidden_sky_burial.tt: "Provedeš obřad potají"
 fp3_unhidden_sky_burial.tt: "Obřad bude následně odhalen"
 fp3_helpful_courtier.tt: "[helpful_courtier.GetName|U] ti s tím pomůže"
 fp3_yearly.8025.t: "Čtvrté ráno"
 fp3_yearly.8025.desc: "Se všemi náležitými obřady je tělo [dying_consort.Custom('CZ_Name_G')] uloženo do výklenků staré #italic dachmy#!, pod širé nebe a před zraky stepních supů, kteří už krouží nad námi.\n\nOd [Select_CString(dying_consort.IsFemale,'její','jeho')|l] smrti uběhly tři dny a já zůstávám u dachmy až do východu slunce. Podle starého učení se čtvrtého rána po smrti duše vrací ke svému duchu #italic fravaši#! ve vyšším světě. Tam mu předá všechno, co se za života naučila, aby pomohla ve věčném boji proti zlu. Ze zvětralých zdí dachmy však žádnou duši stoupat k nebesům nevidím. Jen temné siluety mrchožravých ptáků proti bledému světlu vycházejícího slunce."
 fp3_yearly.8025.a: "Kéž přejde na druhý břeh v míru."
 fp3_yearly.8025.b: "[Select_CString(ROOT.Char.IsFemale,'Splnila','Splnil')|U] jsem [Select_CString(dying_consort.IsFemale,'její','jeho')|l] poslední přání."
 fp3_yearly.8026.t: "Tajná dachma"
 fp3_yearly.8026.desc: "Mé sídlo, [ROOT.Char.Custom('ResidenceBuilding')|l], zůstává daleko za námi. Stojí tu stará #italic dachma#!, věž mlčení, která se pomalu rozpadá v chladných stepních větrech. Zvědavé oči tu zřejmě nejsou. S [helpful_courtier.Custom('CZ_FirstName_I')] nesu tělo [dying_consort.Custom('CZ_TitledFirstName_G')] na místo posledního odpočinku do zvětralých výklenků. Mlčky sleduji, jak se stepní supi snášejí jako černý mrak, a na okamžik si kladu otázku, odkud přiletěli. Poslali je staří bohové, nebo [ROOT.Char.GetFaith.DevilName]? Nikdy se to nedozvím.\n\n[helpful_courtier.GetFirstNameNoTooltip|U] mlčí, zřejmě pod dojmem ponuré nálady."
 fp3_yearly.8026.a: "Doufám, že na to nikdo nepřijde..."
 fp3_yearly.8026.b: "Pro jistotu bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')|l] [helpful_courtier.Custom('CZ_FirstNameNoTooltip_A')] navždy umlčet..."
 fp3_yearly.8027.t: "Devět set devadesát kapitol zlata"
 fp3_yearly.8027.desc: "[Select_CString(snubbed_poet.IsFemale,'Proslulá spisovatelka','Proslulý spisovatel')|U] [snubbed_poet.GetName] se [Select_CString(snubbed_poet.IsFemale,'rozhádala','rozhádal')|l] [Select_CString(former_employer.IsFemale,'se svou dlouholetou mecenáškou','se svým dlouholetým mecenášem')|l], [former_employer.Custom('CZ_Name_I')].\n\n„[Select_CString(former_employer.IsFemale,'Slíbila','Slíbil')|U] mi devět set devadesát talentů zlata,“ vypráví mi [snubbed_poet.GetFirstNameNoTooltip], „jeden za každou kapitolu eposu, který jsem pro [Select_CString(former_employer.IsFemale,'ni','něj')|l] dlouho [Select_CString(snubbed_poet.IsFemale,'připravovala','připravoval')|l]. Za ty peníze jsem [Select_CString(snubbed_poet.IsFemale,'chtěla','chtěl')|l] obnovit zřícené #italic kanáty#! v rodné vesnici. Když jsem [Select_CString(snubbed_poet.IsFemale,'byla','byl')|l] v lázních, dorazil posel se slíbenou odměnou. Jenže mince byly #italic stříbrné#!! Rozrušila mě ta zrada natolik, že jsem všechno [Select_CString(snubbed_poet.IsFemale,'dala','dal')|l] poslovi, správci lázní a prodavači šťáv. Teď potřebuji nového mecenáše, abych [Select_CString(snubbed_poet.IsFemale,'dokončila','dokončil')|l] poslední kapitoly. A slyším, že máš zlata dost na stejnou nabídku...“"
 fp3_yearly.8027.a: "Dám ti #italic polovinu#!, až uvidím hotovou knihu."
 fp3_yearly.8027.b: "To musí být nedorozumění s [former_employer.Custom('CZ_TitledFirstNameNoTooltip_I')]..."
 fp3_yearly.8027.c: "Máš mě za [Select_CString(ROOT.Char.IsFemale,'rozhazovačku','rozhazovače')|l]? Běž jinam."
 fp3_mediation_fails.tt: "Tvé zprostředkování selže"
 fp3_mediation_succeeds.tt: "Tvé zprostředkování uspěje"
 fp3_poet_leaves.tt: "[snubbed_poet.GetNameNoTooltip|U] odejde na dvůr [former_employer.Custom('CZ_FirstNameNoTooltip_G')], ale ty získáš [Concept('opinion','mínění')|E] a [Concept('prestige','prestiž')|E]"
 fp3_promise_to_pay_for_book.tt: "Slíbíš za hotovou knihu zaplatit 495 [Concept('gold','zlata')|E]."
 fp3_mediate_between_them.flavor: "Pokusíš se vyjasnit situaci mezi [snubbed_poet.Custom('CZ_NameNoTooltip_I')] a [former_employer.Custom('CZ_FirstNameNoTooltip_I')]."
 fp3_yearly.8028.t: "Kniha králů"
 fp3_yearly.8028.desc: "„Je hotovo,“ prohlašuje [snubbed_poet.GetName], „jak jsem [Select_CString(snubbed_poet.IsFemale,'slíbila','slíbil')|l]. Všech 990 kapitol. Epické příběhy perského hrdinství a zázraků dávných dob. Do tohoto díla jsem [Select_CString(snubbed_poet.IsFemale,'vložila','vložil')|l] celou duši a už nikdy nic podobného nevytvořím. Jsem jen [Select_CString(snubbed_poet.IsFemale,'pokorná smrtelná básnířka','pokorný smrtelný básník')|l]. Ale díky tvé podpoře možná má kniha přetrvá věky a stane se světlem znovu probuzené perské hrdosti.“\n\n„A teď... [Select_CString(ROOT.Char.IsFemale,'slíbila','slíbil')|l] jsi mi 495 talentů zlata?“"
 fp3_yearly.8028.a: "Jsou tvoje. Zůstaň a služ mi."
 fp3_yearly.8028.b: "Ano, vezmi je a běž pomoci své vesnici."
 fp3_yearly.8028.c: "Za #italic tohle#! jsem [Select_CString(ROOT.Char.IsFemale,'zaplatila','zaplatil')|l]? Jaké zklamání."
 shahnameh_name: "Kniha králů"
 shahnameh_desc: "Tento mohutný svazek v nádherných verších a podrobném líčení vypráví mýtické dějiny Perské říše od stvoření světa až po muslimské dobytí. Zdá se, že rozechvívá srdce každého Peršana, který jej čte."
 persian_epic_name: "Perský epos"
 persian_epic_desc: "Tato kniha je plná epické poezie oslavující činy a osudy perských hrdinů dávných časů."
 fp3_yearly.8029.t: "Příběh dávné slávy"
 fp3_yearly.8029.desc: "[snubbed_poet.GetName|U] mi podává rukopis. Mnohé stránky už zdobí jemné miniatury namalované zručnou rukou. „Tady je kniha, kterou jsem ti [Select_CString(snubbed_poet.IsFemale,'slíbila','slíbil')|l],“ prohlásí vítězoslavně. „Při všem svém skromném umění ti mohu slíbit, že tě nezklame. Vypráví o hrdinech, jako byli lučištník Áraš a drakobijce Ferejdún, o krásných princeznách i o dávné perské slávě. Dokonce jsem [Select_CString(snubbed_poet.IsFemale,'složila','složil')|l] dvojverší, které s tím vším spojuje tvou velkou dynastii...“\n\n„A teď, mluvili jsme o 495 talentech zlata?“"
 fp3_yearly.8029.a: "Jsou tvoje. Zůstaň a služ mi."
 fp3_yearly.8029.b: "Ano, vezmi je a běž pomoci své vesnici."
 fp3_yearly.8029.c: "Tolik zlata za #italic tohle#!?"
 fp3_yearly.8030.opening: "[former_employer.Custom2('AppropriateGreetingNegative', ROOT.Char)|U]"
 fp3_yearly.8030.desc: "Máš mě za [Select_CString(former_employer.IsFemale,'hlupačku','hlupáka')|l]? [snubbed_poet.GetName|U] [Select_CString(snubbed_poet.IsFemale,'rozdala','rozdal')|l] mé bohatství ubohým pouličním prodavačům a zvrhlým správcům #italic hammámů#!. Teď sice tvrdí, že [Select_CString(snubbed_poet.IsFemale,'dostala','dostal')|l] stříbro, ale lidé důvěryhodnější než ty mi potvrdili, že to bylo zlato. Přesto [Select_CString(snubbed_poet.IsFemale,'utekla','utekl')|l] s knihou slíbenou mně za #italic tebou#!. Kéž tě [former_employer.GetFaith.HighGodNameAlternate] vykáže z rajské zahrady!"
 fp3_yearly.8030.a: "Škoda, že nejsi [Select_CString(former_employer.IsFemale,'přístupná','přístupný')|l] rozumu..."
 fp3_yearly.8031.opening: "[former_employer.Custom2('AppropriateGreetingPositive', ROOT.Char)|U]"
 fp3_yearly.8031.desc: "Ukázalo se, že mě zradil jeden zlomyslný dvořan a [snubbed_poet.Custom('CZ_Name_D')] dal méně, než jsem [Select_CString(former_employer.IsFemale,'slíbila','slíbil')|l]. Děkuji ti za vyjasnění tohoto nedorozumění mezi mnou a [Select_CString(snubbed_poet.IsFemale,'básnířkou','básníkem')|l]. Nyní se vrátí do mých služeb. Před ostatními panovníky o tobě budu mluvit v dobrém."
 fp3_yearly.8031.a: "Bylo mi potěšením."
 fp3_yearly.8032.t: "Deset dnů mrtvých"
 fp3_yearly.8032.desc: "Blíží se konec starého perského kalendářního roku a s ním #italic fravardegán#!, pradávná slavnost připomínající duše mrtvých. [Select_CString(death_enthusiast.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('death_enthusiast'))|l] [death_enthusiast.GetTitledFirstName] je nápadně [Select_CString(death_enthusiast.IsFemale,'zamlklá a téměř sklíčená','zamlklý a téměř sklíčený')|l] a u dveří nechává oběti jídla pro duchy předků.\n\n„Musíš jít rozsvítit lampy,“ říká mi, „aby duchové #italic fravaši#! dostali náležité přivítání. Tví předkové nás jistě sledují za tenkými stěnami tohoto hmotného světa. Pomysli na [ancestor_1.Custom('CZ_Name_A')] a další mocné předky svého rodu.“"
 fp3_yearly.8032.a: "Bohužel pohanské obřady neslavím."
 fp3_yearly.8032.b: "Samozřejmě, [Select_CString(death_enthusiast.IsFemale,'má drahá','můj drahý')|l]."
 fp3_yearly.8032.c: "Rod [ROOT.Char.GetDynastyHouseName] je vskutku slavný, když už o tom mluvíš..."
 fp3_yearly.8032.d: "Pravda... Život je jako krátká svíce. Tak snadno zhasne."
 fp3_yearly.8033.t: "Ledové potěšení"
 fp3_yearly.8033.desc: "[Select_CString(sorbet_enthusiast.IsFemale,'Má bystrozraká','Můj bystrozraký')|U] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sorbet_enthusiast'))|l] [sorbet_enthusiast.GetTitledFirstName], [Select_CString(sorbet_enthusiast.IsFemale,'milovnice','milovník')|l] sladkostí, si jako první všímá nápadného nedostatku na jídelních stolech.\n\n„Není tu #italic fálúde#!!“ vykřikne. Míní tím studený dezert s nudlemi, sirupem a růžovou vodou, který těší každého Peršana. „[Select_CString(sorbet_enthusiast.IsFemale,'Poslala','Poslal')|U] jsem pro dodavatele,“ pokračuje, „a [Select_CString(sorbet_enthusiast.IsFemale,'dozvěděla','dozvěděl')|l] jsem se, že se lednice #italic jachčál#! [CZPrepV(yakhchal_county.GetNameNoTierNoTooltip)|l] [yakhchal_county.Custom('CZ_LandedNameNoTier_L')] zřítily při zemětřesení. Musíme hned něco udělat, jinak bude trpět celý dvůr a zhubneme tak, že si nás spletou s východními mystiky!“"
 fp3_yearly.8033.a: "Musím zajistit všechny zásoby fálúde v panství, dokud to ještě jde!"
 fp3_yearly.8033.b: "Takové rozmařilosti nepotřebuji já ani ty."
 fp3_yearly.8033.c: "Máš pravdu. Pošlu zlato na obnovu lednic."
 fp3_yearly.8033.d: "Příště mě obtěžuj se #italic skutečným#! problémem."
 fp3_yearly.8034.t: "Heftalitský poklad"
 fp3_yearly.8034.desc: "„Poslyš, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ prosí [wronged_vassal.GetName]. „Před měsícem jsem [Select_CString(wronged_vassal.IsFemale,'prohlížela','prohlížel')|l] pozemky u řeky [CZPrepV(hephthalite_hoard_province.GetNameNoTierNoTooltip)|l] [hephthalite_hoard_province.Custom('CZ_LandedNameNoTier_L')], když jsem [Select_CString(wronged_vassal.IsFemale,'narazila','narazil')|l] na nádherný zlatý poklad. Podle protáhlých lebek králů vyobrazených na mincích soudím, že jej ukryl nějaký hunský národ. Snad říšští Heftalité, kteří tu ještě nedávno vládli. Protože z jejich lidu pocházím, mám podle mě právo si poklad ponechat. Můj lenní pán [greedy_vassal.GetTitledFirstName] to však zpochybňuje. Snaží se mi poklad vzít a tvrdí, že na něj má právo jako [Select_CString(greedy_vassal.IsFemale,'nástupkyně','nástupce')|l] heftalitských vládců této země. Prosím, podpoř mě.“"
 fp3_yearly.8034.a: "Zjednodušíme to. Zlato si vezmu #italic já#!."
 fp3_yearly.8034.b: "Všechno předáš [greedy_vassal.Custom('CZ_FirstNameNoTooltip_D')]."
 fp3_yearly.8034.c: "Je třeba kompromisu. Dej ho lidem z [hephthalite_hoard_province.Custom('CZ_LandedNameNoTierNoTooltip_G')]."
 fp3_yearly.8034.d: "Nechám ti ho. Ale na tuhle laskavost nezapomeň."
 fp3_yearly.8035.t: "Srdce a Stvořitel"
 fp3_yearly.8035.desc: "Zatímco neklidně kráčím nocí ozářenou měsícem, přidá se ke mně [sufi_mystic.GetTitledFirstName].\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ pronese vážně, „přeješ si, aby k tobě [ROOT.GetCharacter.GetFaith.HighGodNameAlternate] promlouval důvěrněji? [Select_CString(sufi_mystic.IsFemale,'Potkala','Potkal')|U] jsem súfijského mystika z Chorásánu, který mě naučil meditaci #italic murákaba#!. Ta cesta není snadná, ale můžeš se díky ní zbavit nízkých smrtelných pudů, odhalit skryté vědění a dosáhnout blaženého splynutí s vesmírem. [ROOT.Char.GetFaith.ReligiousText|U] ti při tom ukáže cestu. Necháš mě, abych tě [Select_CString(sufi_mystic.IsFemale,'vedla','vedl')|l]?“"
 fp3_yearly.8035.a: "Ano, jsem [Select_CString(ROOT.Char.IsFemale,'připravena','připraven')|l] to zkusit."
 fp3_yearly.8035.b: "Ať už je to cokoli, musí to být bezbožné."
 fp3_yearly.8035.c: "Raději půjdu spát, děkuji."
 fp3_unlock_meditation.tt: "Odemkne [Concept('decision','rozhodnutí')|E] Meditovat v ústraní"
 learning_muraqaba_toast.success: "[Select_CString(ROOT.Char.IsFemale,'Naučila','Naučil')|U] ses základy meditace #italic murákaba#!."
 learning_muraqaba_toast.failure: "Nepodařilo se ti naučit se základy meditace #italic murákaba#!."
 fp3_yearly.8036.t: "Město bezeústých"
 fp3_yearly.8036.desc: "Slunce už zapadlo a já jedu divočinou za [spooky_county.Custom('CZ_LandedNameNoTier_I')]. Doprovází mě [superstitious_councillor.GetTitledFirstName], [Select_CString(superstitious_councillor.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('superstitious_councillor'))|l].\n\nV ponurém měsíčním světle narazíme na místo, o němž jsem už [Select_CString(ROOT.Char.IsFemale,'slyšela','slyšel')|l]. Rozlehlé bludiště vztyčených kamenů, rozeklaných a nakloněných. Pohřebiště či posvátné místo dávno zapomenutého lidu. V kamenech jsou však vytesány lidské podoby, kterým chybějí ústa. Zvětralé modly na nás chladně hledí, když se snažíme projít kolem. Skoro jako by se hýbaly.\n\n„Nezdržujme se tu,“ říká [superstitious_councillor.GetFirstNameNoTooltip] a chvěje se. Přesto mi to nedá. Kdo ti lidé byli? A existují opravdu duchové?"
 fp3_yearly.8036.a: "Chvíli zůstaneme a prozkoumáme to tu."
 fp3_yearly.8036.b: "Rychle odsud pryč. A najdeme další stráže..."
 fp3_yearly.8036.c: "Uklidni se, [superstitious_councillor.Custom('CZ_FirstNameNoTooltip_V')]. Jsou to jen stíny a prach."
 fp3_yearly.8036.d: "Pro jistotu bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')|l] odříkat modlitbu."
 fp3_yearly.8037.t: "Lék na acedii"
 fp3_yearly.8037.desc: "Zatímco se bez cíle toulám v měsíčním světle, přistoupí ke mně [court_physician.GetTitledFirstName], [Select_CString(court_physician.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))|l].\n\n „[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U],“ říká, „v poslední době působíš značně sklíčeně. Nedalo mi to a [Select_CString(court_physician.IsFemale,'pokusila','pokusil')|l] jsem se určit příčinu... Domnívám se, že trpíš acedií, tím bídným stavem otupělosti, který často sužuje poustevníky a moudré [Select_CString(ROOT.Char.IsFemale,'ženy','muže')|l]. Je tu však [Select_CString(persian_polymath.IsFemale,'učená','učený')|l] [persian_polymath.GetName], [Select_CString(persian_polymath.IsFemale,'mnohem lepší lékařka','mnohem lepší lékař')|l] než já. Nedávno [Select_CString(persian_polymath.IsFemale,'napsala','napsal')|l] knihu o nemocech mysli a možná ti dokáže pomoci.“"
 fp3_yearly.8037.a: "Tak pro [Select_CString(persian_polymath.IsFemale,'ni','něj')|l] pošli, ať to stojí cokoli."
 fp3_yearly.8037.b: "Nech mě být."
 fp3_yearly.8038.t: "Černá žluč"
 fp3_yearly.8038.desc: "Od příchodu na můj [ROOT.Char.Custom('GetCourt')|l] mě [persian_polymath.GetFirstName] bedlivě sleduje. Teď už má diagnózu.\n\n„Jde o nadbytek černé žluči v mozku, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]. Už staří učenci znali základy tohoto neduhu, ale moji druhové z Chorásánu a Chórezmu jej studují dlouho. Říkáme mu #italic malichúlie#! a zbavuje člověka radosti i naděje. Někteří nemocní ztrácejí chuť k jídlu nebo napodobují zvířata. Mohou však také nabýt důvtipu a tvořivosti, což snad není tak nešťastné.“\n\n„Ale odbočuji... Zkusíš stravu ze solených ryb a celerových stonků? Zkušenost ukazuje, že by mohla pomoci.“"
 fp3_yearly.8038.a: "Dobrá, zkusím to."
 fp3_yearly.8038.b: "#italic Tohle#! je tvá nejlepší léčba? Najdu si někoho jiného..."
 lackluster_diet.tt: "Během této diety nebudeš moci použít [Concept('decision','rozhodnutí')|E] Dopřát si jídlo"
 fp3_yearly.8039.t: "Byliny a tělesné šťávy"
 fp3_yearly.8039.desc: "[persian_polymath.GetFirstName|U] se hluboce zamýšlí. „Zdá se, že předepsaná strava nezabrala, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Přesto nesmíš hledat útěchu v měsíci a hvězdách, amuletech ani jiných primitivních prostředcích. Ty nepomohou. Navrhuji denně užívat jisté léčivé rostliny, například fenyklové stonky, okurky a kadidlo. Mohou působit proti černé žluči, obnovit rovnováhu tělesných šťáv a posílit tvého ducha. To by ti jistě prospělo.“"
 fp3_yearly.8039.a: "Stojí to za pokus."
 fp3_yearly.8039.b: "Raději věřím své dietě. Ještě u ní nějakou dobu zůstaňme."
 fp3_yearly.8039.c: "Už mám tvých neúčinných léků dost. Odejdi."
 fp3_yearly.8040.t: "Síla ducha"
 fp3_yearly.8040.desc: "„Bohužel, [ROOT.Char.Custom('FormOfAddressForLiege')|l],“ říká [persian_polymath.GetFirstName], „ačkoli se podle mě tvá nálada i tělesný stav poněkud zlepšily, melancholie jsem tě ještě [Select_CString(persian_polymath.IsFemale,'nezbavila','nezbavil')|l]. Nemoci mysli jsou houževnatí nepřátelé. Přesto zbývají další prostředky. Ve své knize jsem [Select_CString(persian_polymath.IsFemale,'napsala','napsal')|l], že lidská psyché tvoří samostatnou soustavu, která ovlivňuje tělo. Musíme posílit tvého ducha a dokázat tvému podvědomí, že duše je věčná a smrt jí neublíží. Jednoduše řečeno, musíš znovu přijmout víru, že tě [ROOT.GetCharacter.GetFaith.HighGodNameAlternate] neopustí.“"
 fp3_yearly.8040.a: "Vyhledám súfijské učení."
 fp3_yearly.8040.b: "Poradím se s [court_chaplain.Custom('CZ_TitledFirstName_I')]."
 fp3_yearly.8040.c: "Má víra nikdy nezakolísala. Za koho mě máš?"
 fp3_yearly.8040.d: "To nemá smysl. Běž své „léky“ nabízet jinam."
 fp3_refusing_faith_treatment_flavor: "Odmítneš tuto léčbu, ale [persian_polymath.GetFirstNameNoTooltip] může ve svém úsilí pokračovat."
 fp3_yearly.8041.t: "Útěcha ticha"
 fp3_yearly.8041.desc: "„To by byla obtížná cesta,“ prohlásí [sufi_mystic.GetName], když vyslechne mé trápení.\n\n„Súfijské řády #italic taríka#! mohou přinést hluboké pochopení sebe i vesmíru. K jeho dosažení je však třeba nesmírné kázně. I já na té cestě teprve začínám. Přesto, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')], bychom [Select_CString(And(ROOT.Char.IsFemale,sufi_mystic.IsFemale),'mohly','mohli')|l] zkusit dosáhnout #italic faná#!. Je to stav meditace, v němž si uvědomíš, že jsi jen malou kapkou v oceánu, o kterém sní [ROOT.GetCharacter.GetFaith.HighGodNameAlternate]. Myslím, že by ti to mohlo nabídnout nový pohled na tento krátký život.“"
 fp3_yearly.8041.a: "Jsem [Select_CString(ROOT.Char.IsFemale,'připravena','připraven')|l]."
 fp3_yearly.8041.b: "Raději bych [Select_CString(ROOT.Char.IsFemale,'zkusila','zkusil')|l] jiný lék..."
 fp3_yearly.8042.t: "Nehynoucí duch"
 fp3_yearly.8042.desc: "„Pravda,“ říká [Select_CString(court_chaplain.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_chaplain'))|l] [court_chaplain.GetFirstName], „naše strasti a trápení v tomto pozemském životě jsou pomíjivé, ale tvůj duch přetrvá. Chápu však, [ROOT.Char.Custom('FormOfAddressForLiege')|l], jestli tě takové tvrzení samo o sobě nedokáže utěšit.“\n\nRozvine svitek. „Toto je část posvátného textu [ROOT.Char.GetFaith.ReligiousText2]. Opisují jej [ROOT.Char.Custom('LevyMenWomen')|l] svatého života, kteří jsou mnohem moudřejší než my. Obsahuje barvité popisy života po smrti a verše, v nichž snad nalezneš vodítko ke smyslu všeho. Doporučuji je studovat, třeba opakovaně, dokud tvá duše nenajde klid. Pokud ti však čtení není po chuti, [ROOT.Char.GetFaith.HouseOfWorship|l] ti nabídne místo, kde může k tvé duši promluvit [ROOT.GetCharacter.GetFaith.HighGodName].“"
 fp3_yearly.8042.a: "Texty budou stačit."
 fp3_yearly.8042.b: "Možná mi spíš pomůže [ROOT.Char.GetFaith.HouseOfWorship|l]."
 fp3_yearly.8042.c: "Zdá se, že mi nakonec pomoci nedokážeš."
 fp3_yearly.8043.t: "Konec léčby"
 fp3_yearly.8043.desc: "[persian_polymath.GetFirstName|U] mě už mnoho týdnů bedlivě sleduje a přemítá.\n\n„Bohužel už nevím kudy dál, [Select_CString(ROOT.Char.IsFemale,'velká','velký')|l] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]. [Select_CString(persian_polymath.IsFemale,'Použila','Použil')|U] jsem všechny své vědomosti a dovednosti, ale jak jsem už [Select_CString(persian_polymath.IsFemale,'řekla','řekl')|l], nemoci mysli se léčí velmi těžko. Přesto jsme podle mě pokročili. Tvé tělesné šťávy jsou zřejmě lépe vyvážené a duch zesílil. Pokud budeš [Select_CString(ROOT.Char.IsFemale,'trpělivá','trpělivý')|l] a budeš dál jíst zdravé množství ryb i některých předepsaných bylin, možná #italic malichúlii#! ještě přemůžeš, bude-li si to [ROOT.GetCharacter.GetFaith.HighGodNameAlternate] přát.“\n\n„Já však musím odejít. Další vědění na mě čeká jinde.“"
 fp3_yearly.8043.a: "Koupím ti všechny knihy, které chceš. Pořád tě potřebuji."
 fp3_yearly.8043.b: "Možná to bylo beznadějné od začátku."
 fp3_polymath_stays_flavor: "[persian_polymath.GetFirstNameNoTooltip|U] zůstane na tvém dvoře."
 fp3_yearly.8044.t: "Světlo světa"
 fp3_yearly.8044.desc: "Tak dlouho se mi svět zdál šedivý a smutný. Věci, které mě kdysi těšily, působily jen jako prchavé rozptýlení bez smyslu a obsahu. Myšlenky mi bloudily do temných, skličujících míst a sny byly plné strachu. Teď však ona dlouhá tíseň začíná ustupovat.\n\nKdyž hledím na krajinu kolem sebe, vidím světlo pronikající skrze oblaka. Vidím krásu země i všech jejích tajemství. Možná za to může léčba, kterou mi [persian_polymath.GetFirstName] [Select_CString(persian_polymath.IsFemale,'předepsala','předepsal')|l], možná něco jiného. Snad se to nikdy nedozvím. Ale něco se ve mně změnilo. Zase se cítím [Select_CString(ROOT.Char.IsFemale,'celá','celý')|l]."
 fp3_yearly.8044.a: "Toho pocitu si musím vážit. Možná nevydrží."
 fp3_yearly.8045.t: "Tajemný uzlíček"
 fp3_yearly.8045.desc: "Při procházce za měsíčního svitu potkám [buzina_enthusiast.Custom('CZ_Name_A')]. [Select_CString(buzina_enthusiast.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('buzina_enthusiast'))|l] v náručí chová uzlíček velký jako nemluvně. Zdání ale klame. Z pokrývek se ozývají podivné zvuky a tvář [buzina_enthusiast.Custom('CZ_NameNoTooltip_G')] pokrývá bezpočet škrábanců.\n\n„To není dítě, [ROOT.Char.Custom('FormOfAddressForLiege')|l], ale opice,“ zašeptá. „Když jsem [Select_CString(buzina_enthusiast.IsFemale,'vybírala','vybíral')|l] daně, ze kterých [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] žije, [Select_CString(buzina_enthusiast.IsFemale,'přijala','přijal')|l] jsem ji místo zlata. Prý dřív patřila velkému východnímu králi, který ji naučil hrát šachy. Bohužel však onemocněla a je poněkud... agresivní.“\n\nPodá mi uzlíček a pokračuje. „Ve tvé péči ale jistě brzy nabude zdraví.“"
 fp3_yearly.8045.a: "[Select_CString(court_physician.IsFemale,'Má lékařka','Můj lékař')|U] na to jistě bude mít nějaký lék..."
 fp3_yearly.8045.b: "Platím tě za vybírání zlata, #EMP ne opic!#!"
 fp3_yearly.8045.c: "Nevím, nevím..."
 sick_monkey_flavor_desc: "Opice, která umí hrát šachy, by jistě byla zábavná"
 playing_with_monkey.tt: "Odemkne [Concept('decision','rozhodnutí')|E] Hrát si s opicí, dokud si ji ponecháš"
 fp3_inspired_tax_collector: "[buzina_enthusiast.GetShortUIName|U] se [Select_CString(buzina_enthusiast.IsLocalPlayer,'snažíš','snaží')|l] vybírat daně lépe"
 fp3_yearly.8046.t: "Opičí medicína"
 fp3_yearly.8046.desc: "„Pokud vím,“ říká [court_physician.GetName], „opice jsou potomky Gajómarta, prvního člověka. Jejich tělesný stav je podobný našemu a možná i ten duchovní. Některé prý dokonce umějí mluvit!“\n\n„Nemoc téhle malé bych [Select_CString(court_physician.IsFemale,'měla','měl')|l] dokázat vyléčit. Nejlépe by však pomohl bylinný odvar a ten je drahý. Druhou možností je strava ze solených ryb a kadidla...“\n\nS velkými obavami sleduje drápy opice, ostré jako břitva."
 fp3_yearly.8046.a: "Na nákladech nezáleží."
 fp3_yearly.8046.b: "Je silná. Zdravá strava postačí."
 fp3_wait_and_see.tt: "Jen čas ukáže, zda léčba zabere"
 monkey_recover_better_chances_tt: "Šance opice na uzdravení se zvýší"
 playing_chess_with_monkey.tt: "Dokud opice žije, můžeš používat [Concept('interaction','interakci')|E] Vyzvat ke stolní hře."
 fp3_yearly.8047.t: "Už je lépe"
 fp3_yearly.8047.desc: "[Select_CString(court_physician.IsFemale,'Má lékařka','Můj lékař')|U] přichází s nemocnou opicí, kterou mi dříve [Select_CString(buzina_enthusiast.IsFemale,'přinesla','přinesl')|l] [buzina_enthusiast.GetName], [Select_CString(buzina_enthusiast.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('buzina_enthusiast'))|l].\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], s radostí mohu oznámit, že opice znovu nabyla chuti do života a její nálada se zklidnila. Na #EMP mistryni#! šachu sice nevypadá, ale hru ji určitě někdo do jisté míry naučil.“\n\nI když ta opice není v šachu mistryní, lidé přijedou zblízka i zdaleka, aby takový div výcviku spatřili..."
 fp3_yearly.8047.a: "Je čas rozeslat pozvánky!"
 monkey_died_from_sickness_toast: "Tvá ochočená opice zemřela na svou nemoc."
 fp3_yearly.8050.t: "Osud mrtvých"
 fp3_yearly.8050_zoroastrian.desc: "Jako [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|l] máme posvátnou povinnost bojovat proti vlivu Nasu, daévy rozkladu. [dakhma_enthusiast.GetCouncilTitle|U] [dakhma_enthusiast.GetFirstName] proto přináší velmi znepokojivé zprávy z [dakhma_county.Custom('CZ_LandedName_G')]."
 fp3_yearly.8050_unzoroastrian.desc: "Ozývají se stížnosti na pohřební zvyky mých zarathuštrických poddaných [CZPrepV(dakhma_county.GetNameNoTooltip)|l] [dakhma_county.Custom('CZ_LandedName_L')]. [dakhma_enthusiast.GetCouncilTitle|U] [dakhma_enthusiast.GetFirstName] má zvlášť velké obavy."
 fp3_yearly.8050_early_period.desc: "\n\n„Dříve, [Select_CString(ROOT.Char.IsFemale,'moudrá','moudrý')|l] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ začne, „bývalo zvykem ponechávat těla mrtvých v divočině, kde nemohla znečistit tři posvátné živly.“\n\n„Osady [CZPrepV(dakhma_county.GetNameNoTierNoTooltip)|l] [dakhma_county.Custom('CZ_LandedNameNoTierNoTooltip_L')] se ale rozrostly a místa už není dost. Lidé začínají mrtvé nechtěně rušit. Měli bychom postavit #italic dachmu#!, věž mlčení, kde budou mrtví bezpečně uloženi a vystaveni psům a mrchožravým ptákům, dokud z nich nezbude jen prach.“"
 fp3_yearly.8050_late_period.desc: "\n\n„Kdysi dávno, [Select_CString(ROOT.Char.IsFemale,'moudrá','moudrý')|l] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ říká, „byla [CZPrepV(dakhma_county.GetNameNoTierNoTooltip)|l] [dakhma_county.Custom('CZ_LandedNameNoTierNoTooltip_L')] postavena malá #italic dachma#!. Těla mrtvých tam mohla být vystavena živlům a mrchožravým ptákům. Jenže věž je stará a rozpadá se. Panují obavy, že z ní vytéká tělesná hmota a znečišťuje tři posvátné živly.“\n\n„Místní by velice ocenili, kdybychom jim pomohli postavit novou věž, kde jejich mrtví bezpečně spočinou.“"
 fp3_yearly.8050.a: "[architect.GetFirstNameNoTooltip|U], [Select_CString(architect.IsFemale,'má architektka','můj architekt')|l], nám může pomoci trochu ušetřit..."
 fp3_yearly.8050.b: "Jistě, mohu na to přispět ze své pokladnice."
 fp3_yearly.8050.c: "Ti pohané si mohou mrtvé nechat v příkopu. Mně je to jedno."
 fp3_yearly.8050.d: "To zní draze. Co fungovalo dříve, může fungovat i teď."
 fp3_zoroastrian_courtiers_and_vassals_happy: "Zbožní [CZReligionAdjSti(GetReligionByKey('zoroastrianism_religion'))|l] [Concept('courtiers','dvořané')|E], [Concept('guests','hosté')|E] a [Concept('vassals','vazalové')|E] si zlepší své [Concept('opinion','mínění')|E] o tobě."
 building_a_dakhma.failure: "[architect.GetFirstName|U] [Select_CString(architect.IsFemale,'navrhla','navrhl')|l] vadnou věž mlčení"
 building_a_dakhma.success: "[architect.GetFirstName|U] [Select_CString(architect.IsFemale,'navrhla','navrhl')|l] funkční věž mlčení"
 fp3_cheap_architecture_flavor: "Čím levnější, tím lepší!"
 fp3_silence_architecture_success_toast: "Snižování nákladů je úspěšné"
 fp3_silence_architecture_failure_toast: "Stavba je #italic velmi#! pochybná"
 fp3_yearly.8051.t: "Nejčistší oheň"
 fp3_yearly.8051_opening.desc: "Posvátný oheň, který hořel v chrámu [CZProvName(sacred_fire_province,'G')], nedávno"
 fp3_yearly.8051_torrential_rain: "uhasil přívalový déšť, tak prudký, že protekl trhlinami ve střeše chrámu až k plameni dole."
 fp3_yearly.8051_earthquake: "uhasilo zemětřesení, které zasáhlo chrám a málem roztrhlo budovu vedví."
 fp3_yearly.8051_sandstorm: "udusila písečná bouře, tak silná, že rozbila chrámové dveře."
 fp3_yearly.8051_gust_of_wind: "uhasil ledově chladný poryv větru, který musel proniknout skrytou puklinou v chrámových zdech."
 fp3_yearly.8051_islamic_zealots: "uhasili muslimští horlivci, kteří vtrhli do chrámu a znesvětili jej velmi nápaditými způsoby."
 fp3_yearly.8051_invisible_hand: "záhadně uhasilo cosi neviditelného, jako by jej zhasla skrytá ruka."
 fp3_yearly.8051_ending.desc: "Navzdory tomuto zlému znamení [magi.GetName] zřejmě nezoufá.\n\n„Musíme oheň znovu zažehnout,“ prohlásí. „Nejčistším a největším ze všech plamenů by byl #italic átaš Bahrám#!, oheň vítězství, zrozený z blesku mezi oblaky. Je to však menší chrám, možná bychom se tedy měli spokojit s #italic átaš Ádarán#!, ohněm ohňů, který nám může dát zlatnická výheň. Nebo i s nejnižším stupněm, #italic átaš Dádgáh#!, který lze posvětit z libovolného domácího plamene...“"
 fp3_yearly.8051.a: "Nestačí nic menšího než blesk. Najdu ti ho. "
 fp3_yearly.8051.b: "Opatříme ti plamen ze zlatnické výhně."
 fp3_yearly.8051.c: "Ze znamení si hlavu nelámu. Domácí plamen postačí."
 fp3_yearly.8051_chasing_lightning.tt: "Počkáš na příští bouři..."
 fp3_yearly.8052.t: "Honba za oblaky "
 fp3_yearly.8052.desc: "[ROOT.Char.GetFaith.AltPriestTermPlural|U] mi neustále připomínají slib najít oheň vítězství pro chrám [CZProvName(sacred_fire_province,'G')]. Ne že bych [Select_CString(ROOT.Char.IsFemale,'zapomněla','zapomněl')|l]... [Select_CString(ROOT.Char.IsFemale,'Vyslala','Vyslal')|U] jsem zvědy do všech směrů hledat bouři a znamení, kterým se [ROOT.GetCharacter.GetFaith.HighGodName] přihlásí. Blesky však byly nepolapitelné.\n\nTeď stojím venku a [ROOT.Char.Custom('ResidenceBuilding')|l] zůstává za mými zády. V dálce burácí hrom a přes temná oblaka přeskakují blesky. Služebnictvo pobíhá sem a tam a pokouší se je zachytit na vysoké tyče. Já hledím do kraje a pátrám po sebemenší známce plamene. Naše úsilí je marné. Mraky se brzy rozestoupí a blesky zmizí vysoko v nebesích.\n\nOpravdu si to [ROOT.GetCharacter.GetFaith.HighGodName] přeje? Copak hledaný oheň nikdy nenajdu?"
 fp3_yearly.8052.a: "Místo toho bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')|l] chrámu přinést oheň ze zlatnické výhně..."
 fp3_yearly.8052.b: "Snad se mohu spokojit i s nižším plamenem."
 fp3_give_up_the_quest.flavor: "Hledání ohně vítězství vzdáváš... prozatím."
 fp3_yearly.8053.t: "Oheň vítězství"
 fp3_yearly.8053.desc: "Dny a týdny míjely. Zvědové pročesávali panství a marně hledali oheň zrozený z blesku. Když už začínám propadat sklíčenosti, v dálce náhle vyrostou temná oblaka a zazní dunivý hrom. [ROOT.Char.Custom('ResidenceBuilding')|U] zůstává za mnou a se služebnictvem spěchám vstříc bouři. Opravdu se blíží, jako by ji přivolávala neviditelná ruka.\n\nPřímo přede mnou náhle prorazí oblaka jasné světlo. [ROOT.Char.GetFaith.DivineRealm|U] se rozzáří a blesk se jako kopí vrhne dolů do osamělého stromu. Suché dřevo okamžitě vzplane bílým ohněm, čistým jako duchové #italic fravaši#!. [Select_CString(ROOT.Char.IsFemale,'Našla','Našel')|U] jsem jej. Oheň vítězství. Přišel ke mně!"
 fp3_yearly.8053.a: "Nemohu tomu uvěřit..."
 fp3_scholarship.0001.t: "Příchod učence"
 fp3_scholarship.0001.desc: "[scholar.GetTitledFirstName|U] [Select_CString(scholar.IsFemale,'dorazila','dorazil')|l] v naději na podporu vědecké práce"
 fp3_scholarship.1000.t: "Druhý Árjabhata"
 fp3_scholarship.1000.desc: "Sláva indické matematiky dolehla i k mým uším. Mluví o ní dokonce nejprostší žáci aritmetiky. Kdybych dvorní síně [Select_CString(ROOT.Char.IsFemale,'zaplnila','zaplnil')|l] [nearby_indian_ruler.GetCulture.Custom('CZ_Adjective_yymi')|l] učenci, pak se [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] může stát významným střediskem matematiky.\n\nMohu požádat [nearby_indian_ruler.Custom('CZ_TitledFirstName_A')], aby mi několik takových učenců [Select_CString(nearby_indian_ruler.IsFemale,'poslala','poslal')|l]. Přijme však takový návrh?"
 fp3_scholarship.1000.a: "Mou žádost jistě neodmítne."
 fp3_scholarship.1000.b: "Štědrý dar nabídku osladí."
 fp3_scholarship.1000.c: "[ROOT.Char.GetCulture.Custom('CZ_AdjectiveNoTooltip_sti')|U] učenci nepotřebují [nearby_indian_ruler.GetCulture.Custom('CZ_AdjectiveNoTooltip_ou')|l] pomoc!"
 fp3_scholarship.1000.duel_success: "[nearby_indian_ruler.GetNameNoTooltip|U] přijme tvou žádost"
 fp3_scholarship.1000.duel_success_tt: "Na tvůj dvůr brzy dorazí několik [nearby_indian_ruler.GetCulture.Custom('CZ_AdjectiveNoTooltip_yych')|l] matematiků"
 fp3_scholarship.1000.duel_failure: "[nearby_indian_ruler.GetNameNoTooltip|U] se vysměje tvé drzosti"
 fp3_scholarship.1000.gift_failure: "[nearby_indian_ruler.GetNameNoTooltip|U] si tvůj dar ponechá"
 fp3_scholarship.1000.native_tt: "Díky našim prostředkům získá na dvoře místo matematik [SCOPE.GetRootScope.GetCharacter.GetCulture.Custom('CZ_AdjectiveNoTooltip_ee')|l] kultury."
 fp3_scholarship.1001.t: "Příchod matematika"
 fp3_scholarship.1001.desc: "[nearby_indian_ruler.GetTitledFirstNameNoTooltip|U] [Select_CString(nearby_indian_ruler.IsFemale,'poslala','poslal')|l] [mathematician.Custom('CZ_TitledFirstName_A')] na tvůj dvůr."
 fp3_scholarship.1001.native.desc: "[mathematician.GetTitledFirstName|U] se [Select_CString(mathematician.IsFemale,'připojila','připojil')|l] k tvému dvoru."
 fp3_scholarship.1000.d: "Nemám na to čas ani chuť."
 fp3_scholarship.1010.t: "Osamělý mág"
 fp3_scholarship.1010.desc_dying_faith: "„Chceme jen v míru vyznávat svou víru až do posledního dne. Pokud nám to slíbíš, osobně ti budu sloužit, dokud mi srdce nepřestane bít.“\n\nVíra [magus_faith.GetName] jistě vymírá, její zbloudilí vyznavači však stále přežívají v opuštěných chrámech ohně [magus_county.GetProvince.GetCounty.Custom('CZ_LandedName_G')]. [Select_CString(magus.IsFemale,'Tato kněžka se nyní vrhla','Tento kněz se nyní vrhl')|U] na zem přede mnou i mou družinou; [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')|l] [Select_CString(magus.IsFemale,'nad ní','nad ním')|l] stojí, zatímco prosí o mé slitování.\n\n"
 fp3_scholarship.1010.desc_living_faith: "„Slituj se! Chceme jen ctít své předky. Pokud nám dopřeješ ochranu, slibuji, že ti osobně budu sloužit až do smrti.“\n\nVíra [magus_faith.GetName] mi stále zůstává trnem v oku. Zdá se, že chrámy ohně [magus_county.GetProvince.GetCounty.Custom('CZ_LandedName_G')] pod rouškou noci znovu ožívají. Můj [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')|l] a já jsme zřejmě přistihli [Select_CString(magus.IsFemale,'odpadlou mágyni','odpadlého mága')|l] při jeho nevyzpytatelných obřadech. Místo útěku se však odvážně vrhá na zem přede mnou."
 fp3_scholarship.1010.a: "Nikdy! [ROOT.Char.GetFaith.HighGodName|U] si přeje tvůj pád!"
 fp3_scholarship.1010.b: "Poskytnu ochranu [magus_county.Custom('CZ_LandedNameNoTooltip_D')]."
 fp3_scholarship.1010.b.tt: "Víra [magus_county.Custom('CZ_LandedNameNoTooltip_G')] se po 20 let nesmí změnit\n[magus.GetShortUINameNoTooltip|U] [Select_CString(magus.IsLocalPlayer,'nemůžeš','nemůže')|l] být nikdy [Select_CString(magus.IsFemale,'obrácena','obrácen')|l] na jinou víru"
 fp3_scholarship.1010.c: "Do budoucna nic neslíbím, ale můžeme tě pustit."
 fp3_scholarship.2000.t: "Cena papíru"
 fp3_scholarship.2000.desc: "Dodávky papíru z východu téměř ustaly. Někteří méně významní básníci už zaznamenávají své úvahy na palmové listy a kůru. Brzy nedokáže vzácné archy spolehlivě sehnat ani [court_scholar.GetTitledFirstName], [Select_CString(court_scholar.IsFemale,'má dvorní učenkyně','můj dvorní učenec')|l].\n\n„Snad bych se [Select_CString(court_scholar.IsFemale,'mohla','mohl')|l] vrátit k pergamenu, ale i ten je dnes velmi vzácný. Více papíru by rozhodně bylo lepším řešením...“"
 fp3_scholarship.2000.a: "Všechen papír bude zabaven pro tvé potřeby."
 fp3_scholarship.2000.b: "Pak musíme papír dovézt."
 fp3_scholarship.2000.c: "Budeš si muset vystačit s tím, co máš."
 fp3_scholarship.2010.t: "Tekutá moudrost"
 fp3_scholarship.2010.desc: "Strážci počestnosti mi hlásí, že [court_scholar.GetTitledFirstName], [Select_CString(court_scholar.IsFemale,'má dvorní učenkyně','můj dvorní učenec')|l], potají popíjí [Select_CString(foreign_scholar.IsFemale,'se zahraniční učenkyní','se zahraničním učencem')|l].\n\nS kýmkoli jiným bych jejich setkání [Select_CString(ROOT.Char.IsFemale,'přerušila','přerušil')|l] a [court_scholar.Custom('CZ_TitledFirstNameNoTooltip_D')] [Select_CString(ROOT.Char.IsFemale,'udělila','udělil')|l] důrazné napomenutí. [Select_CString(foreign_scholar.IsFemale,'S touto dobrou přítelkyní','S tímto dobrým přítelem')|U] však prý vede poučný rozhovor."
 fp3_scholarship.2010.a: "To, co od nás očekává [ROOT.Char.GetFaith.HighGodName], má přednost."
 fp3_scholarship.2010.b: "Možná pijí jen čaj?"
 fp3_scholarship.2020.t: "Morbidní poznatky"
 fp3_scholarship.2020.desc: "„Mé bádání uvázlo,“ říká mi [ROOT.Char.Custom2('QuirkAdverbPosOrNeg', court_scholar)|l] [court_scholar.GetTitledFirstNameNoTooltip], [Select_CString(court_scholar.IsFemale,'má dvorní učenkyně','můj dvorní učenec')|l]. „Z knih se dá vyčíst jen omezené množství poznatků. Kdybys mi však na chvíli [Select_CString(ROOT.Char.IsFemale,'půjčila','půjčil')|l] [specimen.Custom('CZ_TitledFirstName_A')], jistě bychom společně [Select_CString(And(ROOT.Char.IsFemale,court_scholar.IsFemale),'dosáhly','dosáhli')|l] průlomu.“\n\nBezpečí [specimen.Custom('CZ_TitledFirstNameNoTooltip_G')] ovšem zaručit nemůže."
 fp3_scholarship.2020.a: "Máš mé plné svolení."
 fp3_scholarship.2020.b: "Ty zvrácené pokusy si nech na stránkách svých zápisků."
 fp3_scholarship.2030.t: "Zveřejněné výsledky"
 fp3_scholarship.2030.desc: "„...a tak mohu s velkou radostí podat zprávu o svém stálém pokroku v bádání. Téma [ROOT.Char.Custom('education_conversation_subject')|l] nyní chápu mnohem lépe.“\n\nNěkdy je těžké obhájit, proč učence platíme. Jejich práce málokdy panství přímo prospívá.\n[court_scholar.GetName|U], [Select_CString(court_scholar.IsFemale,'má dvorní učenkyně','můj dvorní učenec')|l], si to nepochybně uvědomuje také. Dnešní podrobnou zprávu o pokroku podává s takovým nadšením, že to hraničí s neupřímností."
 fp3_scholarship.2030.a: "Pokrok může být jedině dobrý"
 fp3_scholarship.2030.tt: "[court_scholar.GetNameNoTooltip|U] [Select_CString(court_scholar.IsFemale,'těžila','těžil')|l] ze středisek vyššího vzdělání ve tvém panství."
 fp3_research_project_title: "Výzkum:"
 fp3_scholarship_research_success_loss_effect: "[Concept('research_project','Výzkumný projekt')|EU], na kterém [inspiration_owner.GetShortUIName] [Select_CString(inspiration_owner.IsLocalPlayer,'pracuješ','pracuje')|l], bude mít #N nižší šanci#! na úspěch"
 fp3_scholarship_research_success_slight_loss_effect: "[Concept('research_project','Výzkumný projekt')|EU], na kterém [inspiration_owner.GetShortUIName] [Select_CString(inspiration_owner.IsLocalPlayer,'pracuješ','pracuje')|l], bude mít #N o něco nižší šanci#! na úspěch"
 fp3_scholarship_research_success_gain_effect: "[Concept('research_project','Výzkumný projekt')|EU], na kterém [inspiration_owner.GetShortUIName] [Select_CString(inspiration_owner.IsLocalPlayer,'pracuješ','pracuje')|l], bude mít #P vyšší šanci#! na úspěch"
 fp3_scholarship_research_success_slight_gain_effect: "[Concept('research_project','Výzkumný projekt')|EU], na kterém [inspiration_owner.GetShortUIName] [Select_CString(inspiration_owner.IsLocalPlayer,'pracuješ','pracuje')|l], bude mít #P o něco vyšší šanci#! na úspěch"
 fp3_scholarship.8000.t: "Nový $game_concept_research_project$"
 fp3_scholarship.8000.desc: "[court_scholar.GetName|U], [Select_CString(court_scholar.IsFemale,'má dvorní učenkyně','můj dvorní učenec')|l], ke mně spěchá s několika sluhy v závěsu. Všichni nesou knihy, svitky či staré pergameny.\n\n„Věřím, že mohu dosáhnout průlomu, pokud dostanu dost času, hojné prostředky a tolik inkoustu, že by se jím dal Indus obarvit načerno.“"
 fp3_scholarship.8000.a: "Ujmi se toho, [court_scholar.Custom('CZ_FirstNameNoTooltip_V')]."
 fp3_scholarship.8000.b: "Snad někdy jindy?"
 fp3_scholarship.8000.a.tt: "[court_scholar.GetFirstNameNoTooltip|U] zahájí [Concept('research_project','výzkumný projekt')|E]"
 fp3_scholarship.8500.t: "Vábení zlata"
 fp3_scholarship.8500.desc: "„Jistě dokážu odhalit tajemství samotného stvoření, pokud mi jen opatříš správné nástroje a pomocníky!“\n\n[court_scholar.GetName|U], [Select_CString(court_scholar.IsFemale,'má dvorní učenkyně','můj dvorní učenec')|l], mluví už nějakou dobu. Naléhavě mě prosí, abych [Select_CString(ROOT.Char.IsFemale,'dovolila','dovolil')|l] utratit #EMP mé zlato a stříbro#! za zkoumání toho, jak vznikají prvky jako #EMP zlato#! a #EMP stříbro#!.\n\n[court_scholar.GetFirstNameNoTooltip|U] je očividně [Select_CString(court_scholar.IsFemale,'velmi nadšená','velmi nadšený')|l]. Je obdivuhodné, že se [Select_CString(court_scholar.IsFemale,'dokázala','dokázal')|l] vyznat v tak záhadných zápiscích o tomto tématu. Není však jasné, zda nám to přinese zisk."
 fp3_scholarship.8500.a.tt: "[court_scholar.GetFirstNameNoTooltip|U] začne naplňovat [Concept('inspiration','inspiraci')|E] k alchymii"
 fp3_scholarship.8600.t: "Moc psaného slova"
 fp3_scholarship.8600.desc: "„Tvá vytrvalá podpora je velmi ušlechtilá a nezištná. Jenže skvělé poznatky, které nikdo nezapíše, mohou být zapomenuty! Kdo bude znát mé myšlenky, až zemřu a už o nich nebudu moci mluvit? Svět by bez nich byl chudší.“\n\n[court_scholar.GetName|U], [Select_CString(court_scholar.IsFemale,'má dvorní učenkyně','můj dvorní učenec')|l], má nový projekt. Chce mě přesvědčit, abych [Select_CString(ROOT.Char.IsFemale,'financovala','financoval')|l] vznik nové knihy. Skvostného rukopisu, kvůli kterému prý mí soupeři zblednou závistí.\nMožná tento nápad poslouží [Select_CString(court_scholar.IsFemale,'její','jeho')|l] prestiži stejně jako mé. To ale nemusí znamenat, že je špatný..."
 fp3_scholarship.8600.a.tt: "[court_scholar.GetFirstNameNoTooltip|U] začne naplňovat [Concept('inspiration','inspiraci')|E] k napsání knihy"
 fp3_scholarship.8999.tt_failure: "Výzkum, na kterém [court_scholar.GetShortUINameNoTooltip] [Select_CString(court_scholar.IsLocalPlayer,'pracuješ','pracuje')|l], nepřinese nic užitečného"
 fp3_scholarship.8999.tt_success: "[court_scholar.GetShortUINameNoTooltip|U] [Select_CString(court_scholar.IsLocalPlayer,'dosáhneš','dosáhne')|l] drobného vědeckého průlomu pro rod [THIS.Char.GetHouse.GetNameNoTooltip]"
 fp3_scholarship.8999.tt_crit_success: "[court_scholar.GetShortUINameNoTooltip|U] [Select_CString(court_scholar.IsLocalPlayer,'objevíš','objeví')|l] novou inovaci pro [THIS.Char.GetCulture.Custom('CZ_Adjective_ou')|l] kulturu"
 fp3_scholarship.8100.t: "$fp3_research_project_title$ Lepší knihovna"
 fp3_scholarship.8100.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] si bez ustání stěžuje na stav královské knihovny a nosí mi hromady zažloutlých svitků a rozpadajících se knih.\n\n„Některé z těchto textů zaostávají za dnešními poznatky o stovky let, ne-li víc. Jak mám provádět nejnovější výzkum s tak zastaralými svazky?“"
 fp3_scholarship.8100.a: "Královskou knihovnu vybavíme podle tvého přání."
 fp3_scholarship.8100.b: "Královská knihovna je dokonalá tak, jak je."
 fp3_scholarship.9000.t: "$fp3_research_project_title$ Neúspěch"
 fp3_scholarship.9000.desc: "„Nemá to cenu!“ volá na mě [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)]. Pod očima má tmavé kruhy po nesčetných probdělých nocích.\n\n„Přes moře čísel nevidím dál. Budu muset tento projekt opustit, alespoň prozatím.“"
 fp3_scholarship.9000.a: "Tak tedy dobře."
 fp3_scholarship.9000.b: "Platím tě za výzkum, ne za výmluvy!"
 fp3_scholarship.9100.t: "$fp3_research_project_title$ Nový objev"
 fp3_scholarship.9100.desc: "„[ROOT.Char.Custom2('RelationToMeAddress', inspiration_owner)|U]! Má práce je hotova.“\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] obšírně rozebírá své objevy a jejich možné dopady na naše panství. Snažím se dostat ke slovu, ale marně.\n\nKdyž se konečně posadí, vidím v očích dvořanů stejný zmatek, jaký cítím [Select_CString(ROOT.Char.IsFemale,'sama','sám')|l]. Přesto ze sebe dostanu jedinou odpověď, která mě napadá."
 fp3_scholarship.9100.a: "Dobrá práce, [inspiration_owner.Custom('CZ_ShortUINameNoTooltip_V')]."
 fp3_scholarship.9200.t: "$fp3_research_project_title$ Nová inovace"
 fp3_scholarship.9200.desc: "„[ROOT.Char.Custom2('RelationToMeAddress', inspiration_owner)|U]!“ ozve se výkřik. Otočím se a uvidím [Select_CString(inspiration_owner.IsFemale,'její','jeho')|l] oči unavené radostí a náruč plnou popsaných listů. Práce je hotova.\n\nTeprve později pochopím význam tohoto objevu. Nebudu žít dost dlouho, abych [Select_CString(ROOT.Char.IsFemale,'spatřila','spatřil')|l], jak mění celé dějiny. Pro tuto chvíli však stačí říci:"
 fp3_scholarship.9200.a: "Velmi dobrá práce."
 fp3_scholarship.9900.t: "$fp3_research_project_title$ Zrušeno"
 fp3_scholarship.9900.tt: "[CZProDrop(court_scholar,'zemřela','zemřel')|U] a [Select_CString(court_scholar.IsLocalPlayer,'nemůžeš','nemůže')|l] pokračovat ve výzkumu."
 fp3_scholarship.9901.tt: "Pozici $court_scholar_court_position$ už [court_scholar.GetShortUIName] [Select_CString(court_scholar.IsLocalPlayer,'nezastáváš','nezastává')|l] a [Select_CString(court_scholar.IsLocalPlayer,'nemůžeš','nemůže')|l] pokračovat ve výzkumu."
 fp3_h_yearly.0001.t: "Vábení al-khulu"
 fp3_h_yearly.0001.desc.main: "[ROOT.Char.Custom( 'FortifiedBuilding' )|U] [CZPrepV(ROOT.GetCharacter.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip)|l] [ROOT.GetCharacter.GetCurrentLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')] mi poskytuje klidný kout k odpočinku. V ruce držím sklenici a je v ní [ROOT.Char.Custom('RegionalAlcoholicDrink')|l]. Přiblíží se ke mně [ulema_member.GetName], [Select_CString(ulema_member.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMe', ulema_member)|l], s přísným výrazem.\n\n„Tvá posedlost #italic al-khulem#! je ostudná!\nPolovina lidí na tomto dvoře k tobě ztratila úctu a druhá polovina vlastní mravnost! Nespokojenci v ulicích otevřeně pohrdají pravidly naší víry. Jsou odrazem hříchů svých pánů tady v paláci!“\n\n[ulema_member.GetNameNoTooltip|U] teď zuří, křičí a přitahuje pozornost. Někteří dvořané tiše odkládají vlastní sklenice, aby se nestali terčem hněvu [Select_CString(ulema_member.IsFemale,'rozzuřené duchovní','rozzuřeného duchovního')|l]."
 fp3_h_yearly.0001.a: "Smělá slova na někoho, koho [ulema_member.Custom('RegionalAlcoholicDrink')|l] také drží v otroctví!"
 fp3_h_yearly.0001.a.notif.t: "Dělej, co říkám, ne co dělám!"
 fp3_h_yearly.0001.b: "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] sice otupuje mysl, ale konejší ducha."
 fp3_h_yearly.0001.bb: "[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|U] nacházejí v pití radost. Bez takového potěšení nedokážeme žít!"
 fp3_h_yearly.0001.b.desc: "Pokusíš se přesvědčit [ulema_member.Custom('CZ_FirstNameNoTooltip_A')] i svůj dvůr, že pití může být prospěšné"
 fp3_h_yearly.0001.b.success: "Podaří se ti ponížit [ulema_member.Custom('CZ_FirstNameNoTooltip_A')]"
 fp3_h_yearly.0001.b.failure: "Uděláš ze sebe [Select_CString(ROOT.Char.IsFemale,'hlupačku','hlupáka')|l]"
 fp3_h_yearly.0001.c: "[Select_CString(ROOT.Char.IsFemale,'Ráda','Rád')|U] přispěji na dobročinnost"
 fp3_h_yearly.0001.c.tt: "Pokusíš se podplatit [ulema_member.Custom('CZ_NameNoTooltip_A')]."
 fp3_h_yearly.0001.c.success: "Dar utiší námitky [ulema_member.Custom('CZ_NameNoTooltip_G')]"
 fp3_h_yearly.0001.c.failure: "[ulema_member.GetNameNoTooltip|U] úplatek odmítne"
 fp3_h_yearly.0001.d: "Jsem jen [Select_CString(ROOT.Char.IsFemale,'hříšnice','hříšník')|l], ale pokusím se polepšit."
 fp3_h_yearly.0001.e: "Ticho! Zapomínáš, s kým mluvíš."
 fp3_story_cycle_seljuks_invasion_events.0001.t: "Zoufalí nomádi"
 fp3_story_cycle_seljuks_invasion_events.0001.desc: "[lead_seljuk.GetCulture.Custom('CZ_AdjectiveNoTooltip_sti')|U] nomádi z pohraničí přišli přede mě prosit. Chtějí se usadit [CZPrepV(fp3_seljuk_settle_target.GetNameNoTierNoTooltip)|l] [fp3_seljuk_settle_target.Custom('CZ_LandedNameNoTier_L')]"
 fp3_story_cycle_seljuks_invasion_events.0001.desc_vassal: " jako mí poddaní. Za „odpočinek v mém velkém stínu“ nabízejí věrnost a zkušenosti z bitev.\n\nJejich zoufalství je zjevné. Nemají kam jinam jít, a odmítnutí jejich žádosti proto nevyhnutelně povede ke konfliktu."
 fp3_story_cycle_seljuks_invasion_events.0001.desc_independent: " jako mí noví sousedé. Za kus mé země nabízejí zkušenosti z bitev.\n\nJejich zoufalství je zjevné. Zlověstné vojsko za jejich zády mi však napovídá, že jde spíš o ultimátum než o žádost."
 fp3_story_cycle_seljuks_invasion_events.0001.a_liege: "Dokud budete odpovídat na výzvu lenního pána, bude vám [fp3_seljuk_settle_target.GetNameNoTierNoTooltip] patřit."
 fp3_story_cycle_seljuks_invasion_events.0001.a: "[fp3_seljuk_settle_target.GetNameNoTierNoTooltip|U] ti patří, sousede!"
 fp3_story_cycle_seljuks_invasion_events.0001.b: "Nikdy! Nenechám tu vaši špínu obsadit mou zemi!"
 fp3_story_cycle_zanj_rebellion_events.0002.t: "Otevřený buřič"
 fp3_story_cycle_zanj_rebellion_events.0002.desc: "[outspoken_rebel.GetName|U], [Select_CString(outspoken_rebel.IsFemale,'charismatická rebelka známá','charismatický rebel známý')|l] dřívějším pokusem o vzpouru v Bahrajnu, se nyní [Select_CString(outspoken_rebel.IsFemale,'objevila','objevil')|l] [CZPrepV(outspoken_rebel.GetCurrentLocation.GetCounty.GetNameNoTooltip)|l] [outspoken_rebel.GetCurrentLocation.GetCounty.Custom('CZ_LandedName_L')].\n\n[Select_CString(outspoken_rebel.IsFemale,'Tato samozvaná světice se toulá','Tento samozvaný světec se toulá')|U] slanými močály a podněcuje místní k nepokojům. Patří k nim Zandžové, lid z východních zemí Afriky. Mnozí tu pracují jako otroci či svobodní lidé. Snad je to příležitost [Select_CString(outspoken_rebel.IsFemale,'ji','ho')|l] chytit a potrestat."
 fp3_story_cycle_zanj_rebellion_events.0002.a: "Nastražíme na [Select_CString(outspoken_rebel.IsFemale,'ni','něj')|l] past."
 fp3_story_cycle_zanj_rebellion_events.0002.a.success: "Zatkneš [Select_CString(outspoken_rebel.IsFemale,'buřičku','buřiče')|l]"
 fp3_story_cycle_zanj_rebellion_events.0002.a.failure: "Unikne ti"
 fp3_story_cycle_zanj_rebellion_events.0002.a.failure.tt: "[Select_CString(outspoken_rebel.IsFemale,'Její','Jeho')|U] hnutí získá více stoupenců"
 fp3_story_cycle_zanj_rebellion_events.0002.c: "Nevšímej si [Select_CString(outspoken_rebel.IsFemale,'jí','ho')|l], je [Select_CString(outspoken_rebel.IsFemale,'neškodná','neškodný')|l]."
 fp3_story_cycle_zanj_rebellion_events_cause_strengthened_tt: "Hnutí [outspoken_rebel.Custom('CZ_Name_G')] zesílí"
 fp3_story_cycle_zanj_rebellion_events_cause_greatly_strengthened_tt: "Hnutí [outspoken_rebel.Custom('CZ_Name_G')] výrazně zesílí"
 fp3_zanj_rebellion_opressed_me: "Útlak z tvé strany"
 fp3_story_cycle_zanj_rebellion_leaves_for_baghdad: "[outspoken_rebel.GetName|U] odchází do Bagdádu"
 fp3_story_cycle_zanj_rebellion_events.0004.t: "Nárok na posvátný původ"
 fp3_story_cycle_zanj_rebellion_events.0004.desc: "[zanj_leader.GetName|U], [Select_CString(zanj_leader.IsFemale,'neblaze proslulá výtržnice','neblaze proslulý výtržník')|l], se [Select_CString(zanj_leader.IsFemale,'objevila','objevil')|l] v Bagdádu. Z Basry [Select_CString(zanj_leader.IsFemale,'uprchla','uprchl')|l] po neúspěšném pokusu rozpoutat vzpouru. [Select_CString(zanj_leader.IsFemale,'Ta zpupná agitátorka tvrdí, že je potomkem','Ten zpupný agitátor tvrdí, že je potomkem')|U] Zajda ibn Alího, a tedy součástí Prorokova rodu.\n\nTyto nároky jsou směšné. Mým odpůrcům by se však mohlo hodit dodat jim váhu a nechat [Select_CString(zanj_leader.IsFemale,'tuto povýšenku','tohoto povýšence')|l] zpochybňovat oprávněnost mé vlastní vlády."
 fp3_story_cycle_zanj_rebellion_events.0004.a: "Vyvrátím [Select_CString(zanj_leader.IsFemale,'její','jeho')|l] tvrzení."
 fp3_story_cycle_zanj_rebellion_events.0004.a.success: "Prokážeš, že jde o [Select_CString(zanj_leader.IsFemale,'podvodnici','podvodníka')|l]"
 fp3_story_cycle_zanj_rebellion_events.0004.a.failure: "Nepodaří se ti vyvrátit [Select_CString(zanj_leader.IsFemale,'její','jeho')|l] přehnané nároky"
 fp3_story_cycle_zanj_rebellion_events.0004.b: "[Select_CString(zanj_leader.IsFemale,'Té hlupačky','Toho hlupáka')|U] si nebudu všímat."
 fp3_story_cycle_zanj_rebellion_events.0006.t: "Zandž vystupuje vpřed"
 fp3_story_cycle_zanj_rebellion_events.0006.desc.a: "[outspoken_rebel.GetName|U], [Select_CString(outspoken_rebel.IsFemale,'vůdkyně','vůdce')|l] zandžských dělníků přidělených k nekonečnému vysoušení slaných močálů Basry, za mnou přichází s prosbou o lepší pracovní podmínky. Žijí v kraji po generace a tvoří významnou část baserského obyvatelstva.\n\n"
 fp3_story_cycle_zanj_rebellion_events.0006.desc.b: "Mám podezření, že [zanj_leader.GetName] a [Select_CString(zanj_leader.IsFemale,'její','jeho')|l] vzpurné řeči mají s rostoucí nespokojeností něco společného.\n\n"
 fp3_story_cycle_zanj_rebellion_events.0006.desc.c: "„[ROOT.Char.Custom('CZ_TitleAsName_V')|U], prosím, cožpak [ROOT.Char.GetFaith.HighGodName] neoceňuje důstojné zacházení s dělníky bez ohledu na jejich původ?“"
 fp3_story_cycle_zanj_rebellion_events.0006.a: "Za svou tvrdou práci dostanete odměnu."
 fp3_rival_gave_title_away: "[CZProDrop(CHARACTER,'rozdala','rozdal')|U] půdu patřící [TARGET_CHARACTER.Custom('CZ_ShortUIName_D')]."
 fp3_landed_zanj_reason: "Půda výměnou za mír"
 fp3_story_cycle_zanj_rebellion_events.0006.b: "Mohu udělat drobné ústupky..."
 fp3_zanj_rebellion_interfered_with_my_workers: "[CZProDrop(CHARACTER,'zasáhla','zasáhl')|U] do práce dělníků, které [TARGET_CHARACTER.GetShortUIName] [Select_CString(TARGET_CHARACTER.IsLocalPlayer,'zaměstnáváš','zaměstnává')|l]."
 fp3_story_cycle_zanj_rebellion_events.0006.c: "Takový je úděl Zandžů."
 fp3_rival_stayed_out_of_my_business: "[CZProDrop(CHARACTER,'držela','držel')|U] se stranou záležitostí, které [TARGET_CHARACTER.GetShortUIName] [Select_CString(TARGET_CHARACTER.IsLocalPlayer,'řešíš','řeší')|l]."
 fp3_story_cycle_zanj_rebellion_events.0008.t: "Povstání Zandžů"
 fp3_story_cycle_zanj_rebellion_events.0008.desc.a: "Doléhají ke mně zprávy o otevřené vzpouře ve slaných močálech Basry."
 fp3_story_cycle_zanj_rebellion_events.0008.desc.b: "[zanj_leader.GetName|U], [Select_CString(zanj_leader.IsFemale,'kterou mnozí pokládali za neškodnou šarlatánku','kterého mnozí pokládali za neškodného šarlatána')|l], [Select_CString(zanj_leader.IsFemale,'dokázala','dokázal')|l] pod svým praporem spojit nespokojené zandžské dělníky a vzpurné arabské kmeny. Ačkoli [Select_CString(zanj_leader.IsFemale,'sama','sám')|l] patří k [zanj_leader.GetCulture.Custom('CZ_Adjective_eemu')|l] lidu, nikoli k Zandžům, povstalci [Select_CString(zanj_leader.IsFemale,'ji začali vnímat jako vůdkyni','ho začali vnímat jako vůdce')|l]."
 fp3_story_cycle_zanj_rebellion_events.0008.desc.c: "[zanj_leader.GetName|U], [Select_CString(zanj_leader.IsFemale,'zvlášť výřečná Zandžka','zvlášť výřečný Zandž')|l], [Select_CString(zanj_leader.IsFemale,'sjednotila','sjednotil')|l] přepracované dělníky a vzpurné arabské kmeny pod svým praporem. Ačkoli [Select_CString(zanj_leader.IsFemale,'sama','sám')|l] patří k [zanj_leader.GetCulture.Custom('CZ_Adjective_eemu')|l] lidu a není [Select_CString(zanj_leader.IsFemale,'Arabkou','Arabem')|l], povstalci [Select_CString(zanj_leader.IsFemale,'ji začali vnímat jako vůdkyni','ho začali vnímat jako vůdce')|l]."
 fp3_story_cycle_zanj_rebellion_events.0008.desc.d: "\n\nPo řece do Basry poslali člun. Na něm se tyčí hlavy pobitých pánů Zandžů. Nezaměnitelná výzva mé autoritě."
 fp3_story_cycle_zanj_rebellion_events.0008.a: "Arvand bude řekou krve."
