 found_the_hanseatic_league_decision_tooltip: "Spoj [Concept('counties','hrabství')|E] své [Concept('trade_league','obchodní ligu')|E] do ještě mocnější obchodnické konfederace" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 found_the_hanseatic_league_decision_confirm: "Ve svornosti nalezneme blahobyt" # todo: NEW TRANSLATION
 found_the_hanseatic_league_decision_desc: "Králové si představují, že moc nosí korunu a třímá meč. My známe jinou pravdu. Moc je zabalena do kožešin, voní po rybách a nese účetní knihy se sumami, které by přivedly království na mizinu.\n\nOsamocené nás zdaňují, plení a hrozbami si vynucují naši poslušnost; sjednoceni nemáme na severních mořích sobě rovného. Žádný přístav neodepře našim lodím vjezd, žádný cizí obchodník nedokáže nabídnout levnější zboží a žádný kníže se neodváží zpochybnit naše výsady." # todo: NEW TRANSLATION
 found_the_hanseatic_league_cohesion_tt: "[Concept('trade_league','Obchodní liga')|E] musí mít alespoň #V 95#! [Concept('cohesion','soudržnost')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 found_the_hanseatic_league_members_tt: "[Concept('trade_league','Obchodní liga')|E] musí mít alespoň #V 4#! členy" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 found_the_hanseatic_league_message_title: "Zrodila se Hanza" # todo: NEW TRANSLATION
 found_the_hanseatic_league_message_desc: "[hanse_founder.GetUIName|U] [Select_CString( hanse_founder.IsLocalPlayer, 'have', 'has' )] [Select_CString(hanse_founder.IsFemale,'spojila','spojil')] ligu do přísahou stvrzené Hanzy." # todo: NEW TRANSLATION
 league_needs_liege_consent_tt: "Jako [Concept('vassal','vazal')|E] potřebuješ souhlas svého [Concept('liege','lenního pána')|E], nebo musíš být městem, které se může připojit samostatně" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_hanseatic.0010.opening: "Od [the_league.Custom('CZ_LandedName_G')]," # todo: NEW TRANSLATION
 gdp_hanseatic.0010.desc: "Obchodní práva držíš vlastním jménem, ku prospěchu sobě a nikomu jinému.\n\nTaková individuální ujednání nás oslabují. Žádáme tě, abys nám je postoupil, abychom společně mohli lépe prosperovat." # todo: NEW TRANSLATION
 gdp_hanseatic.0010.a: "Postoupíme je [the_league.Custom('CZ_LandedName_D')]." # todo: NEW TRANSLATION
 gdp_hanseatic.0010.b: "Věnuji je městu [hanse_city_title.Custom('CZ_LandedNameNoTier_D')]." # todo: NEW TRANSLATION
 gdp_hanseatic.0010.c: "Tato práva patří mně, #EMP a tak to také zůstane#!." # todo: NEW TRANSLATION
