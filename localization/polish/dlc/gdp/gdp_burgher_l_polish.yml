 gdp_burgher.0001.desc: "My, [burgher_county.Custom('BurgherPluralNoun')] z [burgher_county.Custom('CZ_LandedNameNoTier_G')], požadujeme, abys nám udělil [burgher_county.Custom('BurgherDemandedPrivilege')], aby naše město mohlo vzkvétat a přinášet tvému panství větší bohatství." # todo: NEW TRANSLATION
 gdp_burgher.0001.a: "Jejich žádost je rozumná. Zpečetím ji." # todo: NEW TRANSLATION
 gdp_burgher.0001.b: "Odmítám!" # todo: NEW TRANSLATION
 gdp_burgher.0001.opening: "Našemu [ROOT.Char.Custom('LadyLordWomanMan')]," # todo: NEW TRANSLATION
 gdp_burgher.0010.desc: "My, [burgher_county.Custom('BurgherPluralNoun')] z [burgher_county.Custom('CZ_LandedNameNoTierNoTooltip_G')], žádáme, abys nám udělil svobodu spravovat se sami, volit si vlastní představitele a jednat vlastním jménem. Jinak možná budeme nuceni zmocnit se toho, co nám z dobré vůle neudělíš." # todo: NEW TRANSLATION
 gdp_burgher.0010.a: "Dejte jim svobodu." # todo: NEW TRANSLATION
 gdp_burgher.0010.b: "Ať bojují za svá #EMP „práva“#!." # todo: NEW TRANSLATION
 gdp_burgher.0020.t: "Svoboda [freed_county.Custom('CZ_LandedNameNoTierNoTooltip_G')]" # todo: NEW TRANSLATION
 gdp_burgher.0020.desc: "[freed_county.Custom('CZ_LandedNameNoTier')] získalo svobodu a s ní i právo spravovat se samo a jmenovat si vlastní úředníky.\n\nNic z toho by samozřejmě nebylo možné bez #EMP mé#! podpory." # todo: NEW TRANSLATION
 gdp_burgher.0020.desc.assembly_head: "[freed_county.Custom('CZ_LandedNameNoTier')] získalo svobodu a s ní i právo spravovat se samo a jmenovat si vlastní úředníky.\n\nNic z toho by samozřejmě nebylo možné bez #EMP mé#! podpory." # todo: NEW TRANSLATION
 gdp_burgher.0020.a: "Břímě vedení rád přijmu." # todo: NEW TRANSLATION
 gdp_burgher.0020.b: "Zaujmu své místo mezi jejich magnáty." # todo: NEW TRANSLATION
 gdp_burgher.0020.c: "Jejich přízeň bude dostatečnou odměnou." # todo: NEW TRANSLATION
 gdp_burgher_agitator_not_republic_head_tt: "Už #bold nesmíš#! stát v čele [Concept('republic','republiky')|E]" # todo: NEW TRANSLATION
 gdp_burgher_agitator_outranks_republic_head_tt: "Tvoje [Concept('title_tier','úroveň titulu')|E] musí být nižší než [burgher_ruler.Custom('CZ_TitledFirstName_G')]" # todo: NEW TRANSLATION
 gdp_civic_agitation.0001.t: "Zažehnutá touha po svobodě" # todo: NEW TRANSLATION
 gdp_civic_agitation.0001.desc: "Všechno se vydařilo. Lid v [target.GetNameNoTier] plane nejhoroucnější touhou po městské svobodě, jakou v něm moji spolčenci dokázali rozdmýchat, zatímco jeho představitelé pronášejí na tržišti vášnivé řeči o tíživých daních a nespravedlivých úřednících.\n\nDoneslo se mi, že se chystá delegace, která vyrazí za jejich lenním pánem a požádá o právo na samosprávu. Zbývá jen otázka, zda pojedu s nimi." # todo: NEW TRANSLATION
 gdp_civic_agitation.0001.a: "Ušel jsem už takovou cestu, a tak to dovedu do konce." # todo: NEW TRANSLATION
 gdp_civic_agitation.0001.b: "Měli by vyrazit v síle, ozbrojení a na koních, které zaplatím." # todo: NEW TRANSLATION
 gdp_civic_agitation.0001.c: "Ať si lidé myslí, že je to jejich nápad. Ti, na kterých záleží, to vědí." # todo: NEW TRANSLATION
 gdp_civic_agitation.0001.c.exposed: "Přiznej se k tomu a nic dalšího jim neslibuj" # todo: NEW TRANSLATION
 gdp_civic_agitation_sponsor_joins_war_tt: "Pokud je jejich vládce odmítne, připojíš se k [Concept('war','válce')|E] po boku [agitated_county.Custom('BurgherPluralNoun')]" # todo: NEW TRANSLATION
 gdp_civic_agitation_sponsor_war_chest_tt: "Pro případ války zaplatíš oddíl profesionálních vojáků" # todo: NEW TRANSLATION
 gdp_civic_agitation.0002.t: "Špatně vynaložená mince" # todo: NEW TRANSLATION
 gdp_civic_agitation.0002.desc: "Seznam křivd sepsali, přečetli ho lidem [target.Custom('CZ_LandedNameNoTier_G')], jejich vůdci se sešli a neudělali #EMP nic#!.\n\nMoji spolčenci nevědí, co se stalo, kromě toho, co je zřejmé. Moje mince koupily vše, co potřebovali, kromě odvahy to skutečně #EMP použít#!." # todo: NEW TRANSLATION
 gdp_civic_agitation.0002.a: "Na tuhle zbabělou zradu jen tak nezapomenu." # todo: NEW TRANSLATION
