 gdp_civic_agitation_scheme_desc_general: "$gdp_civic_agitation_scheme$ je [Concept('hostile_scheme','nepřátelská intrika')|E], jejímž cílem je přimět [Concept('county','hrabství')|E] požadovat samosprávu po svém [Concept('ruler','vládce')|E]. Jde o [Concept('secret_scheme','tajnou intriku')|E] založenou na [Concept('intrigue','pletichářství')|E], do níž lze získávat [Concept('agents','spolčenci')|E].\n\nÚspěšná intrika $gdp_civic_agitation_scheme$ přiměje cílové [Concept('county','hrabství')|E] založit [Concept('faction','frakci')|E] $FACTION_BURGHER_AUTONOMY_NAME$, která zahájí [Concept('war','válku')|E], pokud budou její požadavky odmítnuty.\n\nPodněcovat nepokoje může kterýkoli [Concept('merchant','obchodník')|E] i hlava $republic_type_popular$ a každá [Concept('republic','republika')|E], kterou osvobodí, přijme stejný typ. Ostatní hlavy [Concept('republic','republik')|E] potřebují [Concept('patrician_rating','patricijské hodnocení')|E] alespoň [EmptyScope.ScriptValue('gdp_patrician_house_score_threshold_2_value')|0V] a ostatní [Concept('republican','republikánský')|E] [Concept('house_heads','hlav rodu')|E] potřebují alespoň [EmptyScope.ScriptValue('gdp_patrician_house_score_threshold_3_value')|0V]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
