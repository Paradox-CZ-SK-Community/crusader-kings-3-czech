l_polish:
 dinar: "dinár" # todo: NEW TRANSLATION
 dinar_plural: "dináry" # todo: NEW TRANSLATION
 dinar_gloss: "[Glossary('dinar', 'DINAR_GLOSS')]" # todo: NEW TRANSLATION
 dinar_gloss_plural: "[Glossary('dinars', 'DINAR_GLOSS')]" # todo: NEW TRANSLATION
 DINAR_GLOSS: "#bold Dinár#! neboli #emp denár#! byla zlatá mince, kterou v 7. století zavedli Umajjovci jako protějšek byzantského zlatého [Glossary('solidus', 'SOLIDUS_GLOSS')], její název však pocházel ze stříbrného [Glossary('denarius', 'DENARIUS_GLOSS')].\n\nRozšířil se po arabském světě a jeho název se dodnes používá jako označení několika moderních měn." # todo: NEW TRANSLATION
 denarius: "denár" # todo: NEW TRANSLATION
 denarius_plural: "denáry" # todo: NEW TRANSLATION
 denarius_gloss: "[Glossary('denarius', 'DENARIUS_GLOSS')]" # todo: NEW TRANSLATION
 denarius_gloss_plural: "[Glossary('denarii', 'DENARIUS_GLOSS')]" # todo: NEW TRANSLATION
 DENARIUS_GLOSS: "#bold Denár#! byl původně stříbrnou mincí římské republiky, jejíž obsah drahého kovu se v období císařství výrazně snížil.\n\nNavzdory tomu se tento výraz uchoval jako označení měny v oblastech pod římským vlivem. Jeho název přežil v pozdějším karolinském stříbrném [Glossary('denar', 'PENNY_GLOSS')] i arabském zlatém [Glossary('dinar', 'DINAR_GLOSS')]." # todo: NEW TRANSLATION
 ducat: "dukát" # todo: NEW TRANSLATION
 ducat_plural: "dukáty" # todo: NEW TRANSLATION
 ducat_gloss: "[Glossary('ducat', 'DUCAT_GLOSS')]" # todo: NEW TRANSLATION
 ducat_gloss_plural: "[Glossary('ducats', 'DUCAT_GLOSS')]" # todo: NEW TRANSLATION
 DUCAT_GLOSS: "#bold Dukát#! neboli #emp dogado#! byla zlatá mince, kterou Benátky zavedly ve 13. století jako protějšek florentského [Glossary('florin', 'FLORIN_GLOSS')] a janovského #emp genovino#!. Reagovaly tím na znehodnocování byzantského zlatého [Glossary('solidus', 'SOLIDUS_GLOSS')]. Jeho název pocházel z titulu benátského #emp dóžete#!.\n\nBrzy získal velkou hodnotu v obchodní směně, rozšířil se po Evropě i za její hranice a byl napodobován jako standardní mince." # todo: NEW TRANSLATION
 dirham: "dirham" # todo: NEW TRANSLATION
 dirham_plural: "dirhamy" # todo: NEW TRANSLATION
 dirham_gloss: "[Glossary('dirham', 'DIRHAM_GLOSS')]" # todo: NEW TRANSLATION
 dirham_gloss_plural: "[Glossary('dirhams', 'DIRHAM_GLOSS')]" # todo: NEW TRANSLATION
 DIRHAM_GLOSS: "#bold Dirham#! neboli #emp dram#! byla stříbrná mince, kterou v 7. století zavedli Umajjovci a která se rozšířila po celém arabsky mluvícím světě. Její název pocházel ze starořecké stříbrné mince #emp drachma#! z klasického a helénistického období.\n\nStala se standardní jednotkou hmotnosti v muslimském světě, rozšířila se do dalekých krajů a její název se dodnes používá jako označení několika moderních měn." # todo: NEW TRANSLATION
 aureus: "aureus" # todo: NEW TRANSLATION
 aureus_plural: "aurey" # todo: NEW TRANSLATION
 aureus_gloss: "[Glossary('aureus', 'AUREUS_GLOSS')]" # todo: NEW TRANSLATION
 aureus_gloss_plural: "[Glossary('aurei', 'AUREUS_GLOSS')]" # todo: NEW TRANSLATION
 solidus: "solidus" # todo: NEW TRANSLATION
 solidus_plural: "solidy" # todo: NEW TRANSLATION
 solidus_gloss: "[Glossary('solidus', 'SOLIDUS_GLOSS')]" # todo: NEW TRANSLATION
 solidus_gloss_plural: "[Glossary('solidi', 'SOLIDUS_GLOSS')]" # todo: NEW TRANSLATION
 SOLIDUS_GLOSS: "#bold Solidus#! neboli #emp nomisma#! (doslova „mince“) byla zlatá mince, kterou Byzantinci zavedli ve 4. století jako náhradu dřívějšího římského [Glossary('aureus', 'AUREUS_GLOSS')]. V 11. století ji pak nahradil [Glossary('hyperpyron', 'HYPERPYRON_GLOSS')].\n\nZlaté mince italských republik, jako [Glossary('ducat', 'DUCAT_GLOSS')], [Glossary('florin', 'FLORIN_GLOSS')] a #emp genovino#!, byly zavedeny ve 13. století jako reakce na znehodnocování solidu.\n\nV severní Evropě se mu říkalo #emp šilink#!, dokud Karlovy reformy v 8. století nestanovily stříbrnou směnnou hodnotu pod tímto názvem." # todo: NEW TRANSLATION
 hyperpyron: "hyperpyron" # todo: NEW TRANSLATION
 hyperpyron_plural: "hyperpyra" # todo: NEW TRANSLATION
 hyperpyron_gloss: "[Glossary('hyperpyron', 'HYPERPYRON_GLOSS')]" # todo: NEW TRANSLATION
 hyperpyron_gloss_plural: "[Glossary('hyperpyra', 'HYPERPYRON_GLOSS')]" # todo: NEW TRANSLATION
 HYPERPYRON_GLOSS: "#bold Hyperpyron#!, což znamená „vysoce čištěný“, známý v Evropě jako #emp bezant#!, byla zlatá mince, kterou Byzantinci zavedli v 11. století jako náhradu dřívějšího zlatého [Glossary('solidus', 'SOLIDUS_GLOSS')].\n\nAčkoli nebyl znehodnocen tolik jako #emp solidus#!, jeho hodnota se do 13. století také výrazně snížila. To přimělo italské republiky zavést [Glossary('ducat', 'DUCAT_GLOSS')], [Glossary('florin', 'FLORIN_GLOSS')] a #emp genovino#!." # todo: NEW TRANSLATION
 bezant: "bezant" # todo: NEW TRANSLATION
 bezant_plural: "bezanty" # todo: NEW TRANSLATION
 bezant_gloss: "[Glossary('bezant', 'HYPERPYRON_GLOSS')]" # todo: NEW TRANSLATION
 bezant_gloss_plural: "[Glossary('bezants', 'HYPERPYRON_GLOSS')]" # todo: NEW TRANSLATION
 florin: "florén" # todo: NEW TRANSLATION
 florin_plural: "florény" # todo: NEW TRANSLATION
 florin_gloss: "[Glossary('florin', 'FLORIN_GLOSS')]" # todo: NEW TRANSLATION
 florin_gloss_plural: "[Glossary('florins', 'FLORIN_GLOSS')]" # todo: NEW TRANSLATION
 FLORIN_GLOSS: "#bold Florén#! byla zlatá mince, kterou Florentská republika zavedla ve 13. století jako reakci na znehodnocování byzantského [Glossary('solidus', 'SOLIDUS_GLOSS')] a [Glossary('hyperpyron', 'HYPERPYRON_GLOSS')]. Brzy ji následovaly janovské #emp genovino#! a benátský [Glossary('ducat', 'DUCAT_GLOSS')].\n\nStejně jako #emp dukát#! se stala rozšířenou směnnou mincí. V mnoha evropských mincovnách se razily její napodobeniny a její název přetrval v maďarském #emp forintu#!." # todo: NEW TRANSLATION
 penny: "peníz" # todo: NEW TRANSLATION
 penny_plural: "peníze" # todo: NEW TRANSLATION
 penny_gloss: "[Glossary('penny', 'PENNY_GLOSS')]" # todo: NEW TRANSLATION
 penny_gloss_plural: "[Glossary('pennies', 'PENNY_GLOSS')]" # todo: NEW TRANSLATION
 PENNY_GLOSS: "#bold Fenik#! neboli #emp peníz#! byla standardizovaná stříbrná mince, kterou Karel Veliký zavedl v 8. století jako obdobu dřívějšího všudypřítomného stříbrného [Glossary('denarius', 'DENARIUS_GLOSS')] římského světa.\n\nBrzy se rozšířila a byla napodobována po celé Evropě. Názvy jako #emp denár#!, #emp denier#! a #emp dinero#! se po staletí používaly pro stříbrné mince této hmotnosti." # todo: NEW TRANSLATION
 pfennig: "fenik" # todo: NEW TRANSLATION
 pfennig_plural: "feniky" # todo: NEW TRANSLATION
 pfennig_gloss: "[Glossary('pfennig', 'PENNY_GLOSS')]" # todo: NEW TRANSLATION
 pfennig_gloss_plural: "[Glossary('pfennigs', 'PENNY_GLOSS')]" # todo: NEW TRANSLATION
 denier: "denier" # todo: NEW TRANSLATION
 denier_plural: "deniery" # todo: NEW TRANSLATION
 denier_gloss: "[Glossary('denier', 'PENNY_GLOSS')]" # todo: NEW TRANSLATION
 denier_gloss_plural: "[Glossary('deniers', 'PENNY_GLOSS')]" # todo: NEW TRANSLATION
 dinero: "dinero" # todo: NEW TRANSLATION
 dinero_plural: "dinera" # todo: NEW TRANSLATION
 dinero_gloss: "[Glossary('dinero', 'PENNY_GLOSS')]" # todo: NEW TRANSLATION
 dinero_gloss_plural: "[Glossary('dineros', 'PENNY_GLOSS')]" # todo: NEW TRANSLATION
 denaro: "denaro" # todo: NEW TRANSLATION
 denaro_plural: "denara" # todo: NEW TRANSLATION
 denaro_gloss: "[Glossary('denaro', 'PENNY_GLOSS')]" # todo: NEW TRANSLATION
 denaro_gloss_plural: "[Glossary('denaros', 'PENNY_GLOSS')]" # todo: NEW TRANSLATION
 denar: "denár" # todo: NEW TRANSLATION
 denar_plural: "denáry" # todo: NEW TRANSLATION
 denar_gloss: "[Glossary('denar', 'PENNY_GLOSS')]" # todo: NEW TRANSLATION
 denar_gloss_plural: "[Glossary('denar', 'PENNY_GLOSS)]" # todo: NEW TRANSLATION
 groschen: "groš" # todo: NEW TRANSLATION
 groschen_plural: "groše" # todo: NEW TRANSLATION
 groschen_gloss: "[Glossary('groschen', 'GROSCHEN_GLOSS')]" # todo: NEW TRANSLATION
 groschen_gloss_plural: "[Glossary('groschen', 'GROSCHEN_GLOSS')]" # todo: NEW TRANSLATION
 GROSCHEN_GLOSS: "#bold Groš#! neboli „tlustý peníz“ byla těžší stříbrná mince, kterou ve 13. století zavedl tyrolský vévoda Menhard II. jako obdobu benátského #emp grosso#!. Původně měla hodnotu 12 [Glossary('pfennigs', 'PENNY_GLOSS')].\n\nTento standard se brzy rozšířil po Evropě. Významnými mincovnami byly Kutná Hora v Čechách a Freiberg v Míšeňsku." # todo: NEW TRANSLATION
 tongbao: "tongbao" # todo: NEW TRANSLATION
 tongbao_plural: "tongbao" # todo: NEW TRANSLATION
 tongbao_gloss: "[Glossary('tongbao', 'TONGBBAO_GLOSS')]" # todo: NEW TRANSLATION
 tongbao_gloss_plural: "[Glossary('tongbao', 'TONGBBAO_GLOSS')]" # todo: NEW TRANSLATION
 TONGBBAO_GLOSS: "#bold Tchung-pao#!, což znamená „obíhající poklad“, je název pro mince ve stylu [Glossary('qian', 'QIAN_GLOSS')] odlévané ze slitiny bronzu, které začala razit dynastie Tchang v 7. století.\n\nStaly se standardním prostředkem směny v celé čínské oblasti a dnes se používají v tradiční čínské medicíně i jako talismany pro štěstí." # todo: NEW TRANSLATION
 qian: "čchien" # todo: NEW TRANSLATION
 qian_plural: "čchien" # todo: NEW TRANSLATION
 qian_gloss: "[Glossary('qian', 'QIAN_GLOSS')]" # todo: NEW TRANSLATION
 qian_gloss_plural: "[Glossary('qian', 'QIAN_GLOSS')]" # todo: NEW TRANSLATION
 QIAN_GLOSS: "#bold Čchien#!, což znamená „peníze“, je obecný název pro všudypřítomné mince ze slitiny mědi odlévané v Číně jako platidlo od období válčících států.\n\nČtvercové otvory umožňovaly navlékat mince na tyč a hromadně jim zahlazovat okraje, a také je spojovat do větších nominálních hodnot. Běžně se svazovaly po tisíci kusech. Inspirovaly podobné odlévané mince v Japonsku, Koreji, Vietnamu i jinde." # todo: NEW TRANSLATION
 mon_coin: "mon" # todo: NEW TRANSLATION
 mon_coin_plural: "mon" # todo: NEW TRANSLATION
 mon_coin_gloss: "[Glossary('mon', 'QIAN_GLOSS')]" # todo: NEW TRANSLATION
