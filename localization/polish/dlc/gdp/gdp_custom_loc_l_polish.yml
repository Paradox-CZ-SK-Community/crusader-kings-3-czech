 suq_gloss_plural: "[Glossary('suqs', 'SUQ_GLOSS')]" # todo: NEW TRANSLATION
 SUQ_GLOSS: "#bold Suq#!, psáno také #emp souk#!, je arabské slovo označující tržiště. Původně bylo přejato z akkadského výrazu pro „ulici“ přes aramejštinu; dnes se běžně používá v muslimském světě i jinde." # todo: NEW TRANSLATION
