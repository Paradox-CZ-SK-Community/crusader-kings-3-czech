 tanka: "tanka" # todo: NEW TRANSLATION
 tanka_plural: "tanky" # todo: NEW TRANSLATION
 tanka_gloss: "[Glossary('tanka', 'TANKA_GLOSS')]" # todo: NEW TRANSLATION
 tanka_gloss_plural: "[Glossary('tanka', 'TANKA_GLOSS')]" # todo: NEW TRANSLATION
 TANKA_GLOSS: "#bold Tanka#! neboli #emp taka#! byla stříbrná mince, kterou ve 13. století zavedl Dillíský sultanát.\n\nRozšířila se po Indii a sousedních oblastech, kde se ve velké míře napodobovala, a stala se standardní směnnou jednotkou na Hedvábné stezce." # todo: NEW TRANSLATION
 jital: "džítal" # todo: NEW TRANSLATION
 jital_plural: "džítaly" # todo: NEW TRANSLATION
 jital_gloss: "[Glossary('jital', 'JITAL_GLOSS')]" # todo: NEW TRANSLATION
 jital_gloss_plural: "[Glossary('jital', 'JITAL_GLOSS')]" # todo: NEW TRANSLATION
 JITAL_GLOSS: "#bold Džítaly#! byly původně stříbrné mince s vyobrazením býka a jezdce, které se začaly razit v 8. století v Kábulu.\n\nJejich podoba se rozšířila po okolí a vzniklo mnoho napodobenin. Postupně se znehodnocovaly a obsahovaly stále více mědi. V 16. století se #emp džítaly#! razily výhradně z mědi." # todo: NEW TRANSLATION
 coin: "mince" # todo: NEW TRANSLATION
 coin_plural: "mince" # todo: NEW TRANSLATION
 coin_gloss: "mince" # todo: NEW TRANSLATION
 coin_gloss_plural: "mince" # todo: NEW TRANSLATION
 bazaar: "bazar" # todo: NEW TRANSLATION
 bazaar_plural: "bazary" # todo: NEW TRANSLATION
 bazaar_gloss: "[Glossary('bazaar', 'BAZAAR_GLOSS')]" # todo: NEW TRANSLATION
 bazaar_gloss_plural: "[Glossary('bazaars', 'BAZAAR_GLOSS')]" # todo: NEW TRANSLATION
 BAZAAR_GLOSS: "#bold Bazar#! neboli #emp bazar#! je perské označení tržiště, které pochází z praindoevropštiny. Později se rozšířilo do arabštiny a dnes se běžně používá v celé západní Asii, Indii i jinde." # todo: NEW TRANSLATION
 khrom: "khrom" # todo: NEW TRANSLATION
 khrom_plural: "khromy" # todo: NEW TRANSLATION
 khrom_gloss: "[Glossary('khrom', 'KHROM_GLOSS')]" # todo: NEW TRANSLATION
 khrom_gloss_plural: "[Glossary('khroms', 'KHROM_GLOSS')]" # todo: NEW TRANSLATION
 KHROM_GLOSS: "#bold Khrom#! je tibetský výraz pro tržiště, který se rozšířil po regionu podél Hedvábné stezky." # todo: NEW TRANSLATION
 shuka: "shuka" # todo: NEW TRANSLATION
 shuka_plural: "shuky" # todo: NEW TRANSLATION
 shuka_gloss: "[Glossary('shuka', 'SHUKA_GLOSS')]" # todo: NEW TRANSLATION
 shuka_gloss_plural: "[Glossary('shukas', 'SHUKA_GLOSS')]" # todo: NEW TRANSLATION
 SHUKA_GLOSS: "#bold Shuka#! je výraz pro tržiště v kavkazských jazycích. Podobně jako arabské [Glossary('suq', 'SUQ_GLOSS')] bylo toto slovo původně přejato z akkadského výrazu pro „ulici“, ovšem prostřednictvím syrštiny." # todo: NEW TRANSLATION
 suq: "suq" # todo: NEW TRANSLATION
 suq_plural: "suqy" # todo: NEW TRANSLATION
