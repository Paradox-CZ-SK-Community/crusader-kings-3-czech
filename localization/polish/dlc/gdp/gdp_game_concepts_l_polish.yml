 game_concept_unity_contracts_possessive: "Zakázek na sjednocení" # todo: NEW TRANSLATION
 game_concept_unity_contract_desc: "Zakázky na sjednocení vznikají, když je [Concept('company_sentiment','směřování společnosti')|E] [Concept('merchant_possessive','kupce')|E] nízké, a poukazují na problém, který je třeba řešit." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_domicile_artifact: "Artefakt domicilu" # todo: NEW TRANSLATION
 game_concept_domicile_artifacts: "Artefakty domicilu" # todo: NEW TRANSLATION
 game_concept_domicile_artifact_desc: "Artefakt domicilu je [Concept('artifact','artefakt')|E] vystavený v [Concept('company','společnosti')|E] [Concept('merchant_possessive','kupci')|E], například [Concept('curios','kuriozity')|E] a [Concept('creatures','tvorové')|E].\n\nArtefakty domicilu jsou hlavním zdrojem pasivního příjmu [Concept('prestige','prestiže')|E] kupce.\n\nPočet $game_concept_artifacts$, které může [Concept('character','postava')|E] vlastnit, není omezen, ale účinek mají pouze ty vystavené v příslušném slotu.\n\nKupci mohou získat $game_concept_domicile_artifacts$ úspěšným dokončením [Concept('luxury_contracts','smlouvami na luxusní zboží')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_menagerie: "Zvěřinec" # todo: NEW TRANSLATION
 game_concept_menagerie_creature: "Tvor zvěřince" # todo: NEW TRANSLATION
 game_concept_menagerie_creatures: "Tvorové zvěřince" # todo: NEW TRANSLATION
 game_concept_creature: "Tvor" # todo: NEW TRANSLATION
 game_concept_creatures: "Tvorové" # todo: NEW TRANSLATION
 game_concept_creature_desc: "Tvor je živé zvíře získané prostřednictvím [Concept('merchants','kupců')|E] při dokončení [Concept('luxury_contracts','smlouvách na luxusní zboží')|E]. \n\n$game_concept_gain_domicile_artifact_desc$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_curio: "Kuriozita" # todo: NEW TRANSLATION
 game_concept_curios: "Kuriozity" # todo: NEW TRANSLATION
 game_concept_curio_desc: "Kuriozita je vzácný druh [Concept('artifact','artefakt')|E], který lze získat prostřednictvím [Concept('merchants','kupců')|E] při dokončení [Concept('luxury_contracts','smlouvách na luxusní zboží')|E].\n\n$game_concept_gain_domicile_artifact_desc$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_gain_domicile_artifact_desc: "Lze je vystavit jako [Concept('domicile_artifact','artefakt domicilu')|E] v [Concept('company','společnosti')|E] a získávat tak stálý přísun [Concept('prestige','prestiž')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_guelph_ghibelline_precursor_situation: "Předehra k situaci guelfy a Ghibellini" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_guelph_ghibelline_precursor_situation_desc: "Předehra k [Concept('situation','situaci')|E] [Concept('guelph_ghibelline_situation','guelfům a Ghibellini')|E] je souborem událostí, které prohlubují konflikt mezi Svatou říší římskou a papežstvím.\n\n#F Vše začalo papežským znovuvzestupem [Glossary( 'In nomine Domini', 'IN_NOMINE_DOMINI_GLOSS' )], kdy tehdejší papež prohlásil, že šlechta se nemá podílet na papežských volbách; ty mají náležet kardinálům shromážděným v Římě.\n\nPozději, během [Glossary( 'Dictatus Papae', 'DICTATUS_PAPAE_GLOSS' )] a boje o investituru, papež prohlásil, že papežská moc svěřená mu Bohem je mocí univerzální a že pouze papež může jmenovat či sesazovat církevní představitele. Udělování úřadů biskupům pomocí světských symbolů bylo odsuzováno." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_guelph_ghibelline_situation: "Guelfové a Ghibellini" # todo: NEW TRANSLATION
 game_concept_guelph_ghibelline_situation_desc: "Situace, která vznikla v důsledku konfliktu mezi papežem ([Concept('guelphs','guelfy')|E]) a Svatou říší římskou ([ghibellines|E]).\n\nPostupem času se změnila v místní spor o to, zda si vládci severní Itálie přejí větší vliv říše, nebo si chtějí zachovat nezávislost." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_gg_involvement: "Zapojení" # todo: NEW TRANSLATION
 game_concept_gg_involvement_desc: "Zapojení [Concept('ruler','vládce')|E] v [Concept('situation','situaci')|E] [Concept('guelph_ghibelline_situation','guelfech a Ghibellini')|E] vyjadřuje, nakolik tato postava ovlivnila její průběh. Toho dosahuje především podnikáním kroků proti opačné straně.\n\nMezi tyto kroky patří:\n$BULLET_WITH_TAB$[Concept('hostile_schemes','Nepřátelské intriky')|E]\n$BULLET_WITH_TAB$[Concept('interactions','Interakce')|E] [Concept('imprison','Uvěznit')|E], [Concept('torture','mučení')|E] a [Concept('execution','poprava')|E]\n$BULLET_WITH_TAB$[Concept('scheme','Intrika')|E] [GetScheme('gg_switch_sides').GetTypeName], [Concept('interaction','interakce')|E] $gg_recruit_partisan_interaction|V$, [Concept('casus_belli','casus belli')|E] [GetCasusBelliType('displace_guelph_ghibelline_ruler_cb').GetName|V] atd.\n$BULLET_WITH_TAB$Spouštění [Concept('situation_catalysts','spouštěče situace')|E]\n\nZapojení naopak:\n$BULLET_WITH_TAB$Uplatňuje stupňující se [Concept('modifier','modifikátorem')|E] [GetModifier( 'gg_involvement_modifier' ).GetNameWithTooltip] za každý přírůstek #V [FixedPointToInt(EmptyScope.ScriptValue('gg_involvement_modifier_cap'))|O]#!\n$BULLET_WITH_TAB$Slouží jako násobitel odměn, pokud vaše strana situaci ukončí.\n\n#F Během [guelph_ghibelline_precursor_situation|E] zatím nelze $game_concept_gg_involvement$ získat a přibývá pomaleji, dokud konflikt naplno nevypukne.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_gg_involvement_i: "@gg_involvement_icon!" # todo: NEW TRANSLATION
 game_concept_guelph: "Guelf" # todo: NEW TRANSLATION
 game_concept_guelphs: "Guelfové" # todo: NEW TRANSLATION
 game_concept_guelph_desc: "Guelfové jsou stranou [Concept('situation','situace')|E] [Concept('guelph_ghibelline_situation','guelfů a Ghibellini')|E], která podporuje nezávislost na Svaté říši římské, a tím i svrchovanost z boží vůle.\n\n#F Název Guelfové pochází od rodu Welfů, historických vévodů bavorských, a postupně se proměnil ústním podáním a výslovností.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_ghibelline: "Ghibellin" # todo: NEW TRANSLATION
 game_concept_ghibellines: "Ghibellini" # todo: NEW TRANSLATION
 game_concept_ghibelline_desc: "Ghibellini jsou stranou [Concept('situation','situace')|E] [Concept('guelph_ghibelline_situation','guelfů a Ghibellini')|E], která podporuje větší vliv a kontrolu Svaté říše římské nad vzdorujícími městskými státy severní Itálie.\n\n#F Název Ghibellini pochází z bojového pokřiku Hohenštaufů, který odkazoval na hrad Wibellingen během obléhání Weinsbergu.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_lombard_league: "Lombardská liga" # todo: NEW TRANSLATION
 game_concept_lombard_league_desc: "Liga vytvořená městy severní Itálie, která se staví proti rostoucím požadavkům na centralizaci ze strany císařství $e_hre$." # todo: NEW TRANSLATION
 game_concept_confederation_cohesion: "Soudržnost konfederace" # todo: NEW TRANSLATION
 game_concept_cohesion: "Soudržnost" # todo: MOVED KEY
 game_concept_confederation_cohesion_desc: "Soudržnost měří, jak pevně [Concept('confederation','konfederace')|E] drží pohromadě, na stupnici od #V 0#! do #V 100#!. Každý člen k ní každý měsíc přispívá, ať už kladně, nebo záporně; při vysoké hodnotě soudržnosti se přírůstky snižují.\n\nKaždá dosažená úroveň přináší členům postupně větší výhody. To, co soudržnost zvyšuje a jaké odměny jednotlivé úrovně přinášejí, závisí na typu konfederace.\n\nKonfederace používají tyto typy $game_concept_cohesion$:\n$BULLET_WITH_TAB$[bloc_cohesion|E]\n$BULLET_WITH_TAB$[Concept('league_cohesion','Soudržnost ligy')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_league: "Obchodní liga" # todo: NEW TRANSLATION
 game_concept_trade_league_desc: "Obchodní liga je [Concept('confederation','konfederace')|E] [Concept('republics','republik')|E], kterou mohou republikánští [Concept('rulers','vládci')|E] založit nebo se k ní připojit, aby dosáhli společných obchodních a obranných výhod.\n\nJeden člen drží [Concept('leading_title','vedoucí titul')|E] a působí jako [Concept('trade_league_leader','vůdce obchodní ligy')|E] (jediný člen, který může zvát nebo vylučovat ostatní), zatímco ostatní drží [Concept('member_title','členský titul')|E].\n\nS rostoucí [Concept('league_cohesion','soudržností ligy')|E] získávají členové větší výhody." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_leagues: "Obchodní ligy" # todo: NEW TRANSLATION
 game_concept_trade_league_short: "Liga" # todo: NEW TRANSLATION
 game_concept_league_cohesion: "Soudržnost ligy" # todo: NEW TRANSLATION
 game_concept_league_cohesion_desc: "Soudržnost měří jednotu [Concept('trade_league','obchodní ligu')|E]; každá dosažená úroveň přináší jejím členům postupně větší výhody v [Concept('trade','obchodě')|E]. Pod #V 20#! je liga příliš volná na to, aby se její členové mohli připojovat k [Concept('wars','válkám')|E] ostatních nebo žádat o [Concept('trade_monopolies','obchodní monopoly')|E].\n\nČlenové ji zvyšují podle své [Concept('title_tier','úrovně')|E], [Concept('capital','hlavní sídlo')|E] a [Concept('opinion','mínění')|E] o [Concept('trade_league_leader','vůdce obchodní ligy')|E]. Držené monopoly přidávají další soudržnost, zatímco příliš malý či příliš velký počet [Concept('trade_league_members_short','členové')|E] ji snižuje." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_league_leader: "Vůdce obchodní ligy" # todo: NEW TRANSLATION
 game_concept_trade_league_leader_desc: "Vůdce obchodní ligy je její oficiální hlavou v rámci [Concept('trade_league','obchodní ligy')|E].\n\nVůdce je jediný [Concept('trade_league_member_short','členu')|E] obchodní ligy, který může zvát nové členy nebo vylučovat stávající. Liga začíná se svým zakladatelem jako vůdcem. Členové se později mohou domáhat nároku na vůdcovství. Pokud vůdce odejde, nastoupí po něm jiný člen na základě své [Concept('title_tier','úrovní')|E], [Concept('settlement_size','velikosti sídla')|E] v [Concept('capital','hlavním sídle')|E] a [Concept('prestige','prestiži')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_league_leader_short: "Vůdce" # todo: NEW TRANSLATION
 game_concept_trade_league_member: "Člen obchodní ligy" # todo: NEW TRANSLATION
 game_concept_trade_league_members: "Členové obchodní ligy" # todo: NEW TRANSLATION
 game_concept_trade_league_member_short: "Člen" # todo: NEW TRANSLATION
 game_concept_trade_league_members_short: "Členové" # todo: NEW TRANSLATION
 game_concept_trade_league_member_desc: "Člen obchodní ligy je součástí [Concept('trade_league','obchodní ligou')|E], protože drží [Concept('member_title','členský titul')|E], který je tvořen [Concept('primary_title','hlavní titul')|E] členských [Concept('republics','republik')|E].\n\nJeden člen drží [Concept('leading_title','vedoucí titul')|E] a působí jako [Concept('trade_league_leader','vůdce obchodní ligy')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_league_focus: "Zaměření ligy" # todo: NEW TRANSLATION
 game_concept_league_focuses: "Zaměření ligy" # todo: NEW TRANSLATION
 game_concept_league_focus_desc: "Zaměření ligy je [Concept('trade_category','kategorie zboží')|E], které vybírá [Concept('trade_league_leader','vůdce obchodní ligy')|E] [Concept('trade_league','obchodní ligy')|E]. [Concept('holder','Držitel')|E] každého [Concept('member_title','členského titulu')|E] získává pro tuto kategorii bonusy k [Concept('trade_expertise','obchodní zkušenosti')|E], [Concept('production','produkci')|E] a [Concept('sell_price','prodejní ceně')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_patrician: "Patricij" # todo: NEW TRANSLATION
 game_concept_patricians: "Patricijové" # todo: NEW TRANSLATION
 game_concept_patrician_possessive: "Patricijův" # todo: NEW TRANSLATION
 game_concept_patrician_desc: "Patricij je [Concept('house_head','hlava rodu')|E] předního [Concept('merchant','kupce')|E] rodu v rámci [Concept('republic','republiky')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_patrician_family: "Patricijský rod" # todo: NEW TRANSLATION
 game_concept_patrician_families: "Patricijské rody" # todo: NEW TRANSLATION
 game_concept_patrician_family_short: "Rodina" # todo: NEW TRANSLATION
 game_concept_patrician_family_desc: "Patricijský rod je [Concept('merchant_family','kupecká rodina')|E], která je součástí [Concept('republic','republikou')|E]. Jde o urozenou elitu, která v rámci republiky drží moc a vliv a jako svůj [Concept('domicile','domicilu')|E] využívá [consortery|E].\n\nRepublika s hodností [Concept('county','hrabstvím')|E] [Concept('title_tier','úrovní')|E] může mít pouze jednu patricijskou rodinu, zatímco republiky vyšší hodnosti jich mohou mít více a očekává se, že je mít budou." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_patrician_rating: "Hodnocení patricije" # todo: NEW TRANSLATION
 game_concept_patrician_rating_short: "Hodnocení" # todo: NEW TRANSLATION
 game_concept_patrician_rating_desc: "[Concept('patrician_family','Patricijský rod')|E] má své hodnocení patricije, které vyjadřuje, jak důležitá a vlivná je rodina a její [Concept('patrician','patricij')|E] v rámci [Concept('republic','republiky')|E].\n\nVysoké hodnocení poskytuje bonusy patricijovi a jeho [Concept('house','rodu')|E], a to na třech různých úrovních. Každá úroveň odemyká další výhody, například:\n$BULLET_WITH_TAB$Vylepšené [Concept('house_ambition','ambicí rodu')|E]\n$BULLET_WITH_TAB$Vyšší přijetí při [Concept('interactions','interakci')|E]\n$BULLET_WITH_TAB$Vyšší [Concept('governor_salary','platě guvernéra')|E]\n\nHodnocení lze zvýšit mnoha způsoby; mezi klíčové faktory patří:\n$BULLET_WITH_TAB$Příjmy [Concept('trade','obchodu')|E] [Concept('patrician_possessive','patricijova')|E]\n$BULLET_WITH_TAB$Vláda nad [Concept('republic','republikou')|E]\n$BULLET_WITH_TAB$Získání křesel v [Concept('assembly','shromáždění')|E] a [Concept('council','radě')|E] [Concept('liege_possessive','lenním pánovi')|E][AddLocalizationIf( HasDlcFeature( 'by_god_alone' ), 'game_concept_patrician_rating_church_factors' )]\n\n[SelectLocalization( HasDlcFeature( 'by_god_alone' ), 'game_concept_patrician_rating_penalties_PAM', 'game_concept_patrician_rating_penalties_NO_PAM' )]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_patrician_rating_church_factors: "\n$BULLET_WITH_TAB$Členové [Concept('house','rod')|E], kteří drží [Concept('clerical_region','církevní oblast')|E]\n$BULLET_WITH_TAB$Vlastnictví [Concept('modifier','modifikátor')|E] [GetModifier('favored_by_pope_modifier').GetNameWithTooltip]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_patrician_rating_penalties_PAM: "Hodnocení klesá, pokud je patricij [Concept('excommunicated','exkomunikovaný')|E], je známým [Concept('criminal','zločinnému')|E] nebo má [GetModifier('scorned_pope_modifier').GetNameWithTooltip]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_patrician_rating_penalties_NO_PAM: "Hodnocení klesá, pokud je patricij [Concept('excommunicated','exkomunikovaný')|E] nebo je známým [Concept('criminal','zločinnému')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_consortery: "Konzorterie" # todo: NEW TRANSLATION
 game_concept_consorteries: "Konzorterie" # todo: NEW TRANSLATION
 game_concept_consortery_possessive: "Konzorterie" # todo: NEW TRANSLATION
 game_concept_consortery_desc: "Konzorterie je sídlem a [Concept('domicile','domicil')|E] [Concept('patrician_family','patricijského rodu')|E]. Obvykle se nachází v [Concept('capital','hlavním sídle')|E] jejího [Concept('liege_possessive','lenním pánovi')|E]. \n\nPodobně jako [Concept('trade_companies','obchodní společnosti')|E] [Concept('merchant_possessive','kupce')|E] využívá $game_concept_consortery$ [Concept('company_buildings','budovy společnosti')|E] jako [Concept('domicile_buildings','budovy domicilu')|E], aby posílila zdatnost a konkurenceschopnost rodu v obchodě.\n\nDědí se spolu s titulem [Concept('patrician_family','patricijským rodem')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_assembly: "Shromáždění" # todo: NEW TRANSLATION
 game_concept_assembly_possessive: "Shromáždění" # todo: NEW TRANSLATION
 game_concept_assembly_desc: "Shromáždění je řídicí orgán [Concept('realm','panství')|E].\n\nJeho pravomoci určují [Concept('laws','zákony')|E]. Mohou zahrnovat hlasování o zákonech a jejich schvalování, [Concept('republic_decrees','republikové výnosy')|E] nebo hlasování o kandidátech v některých typech voleného [Concept('succession','nástupnictví')|E], například v rámci [GetLaw('republican_elective_succession_law').GetName]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_republic_senate: "Senát" # todo: NEW TRANSLATION
 game_concept_republic_senate_possessive: "Senátu" # todo: NEW TRANSLATION
 game_concept_voting_session: "Hlasování" # todo: NEW TRANSLATION
 game_concept_voting_sessions: "Hlasování" # todo: NEW TRANSLATION
 game_concept_voting_session_desc: "Hlasování je proces, při němž [Concept('assembly','shromáždění')|E] rozhoduje o navrženém [Concept('law','zákon')|E] nebo [Concept('republic_decree','republikový výnos')|E].\n\nBěhem hlasování jeho členové podle míry svého souhlasu hlasují pro návrh, nebo proti němu. Pokud s ním před koncem hlasování souhlasí dostatek členů, návrh je přijat a nabývá účinnosti.\n\nSouhlas lze před hlasováním zvýšit pomocí [Concept('councillor_task','úkolu rádce')|E] a některých [Concept('perks','talentů')|E]. Lze také využít [Concept('hook','páka')|E] a přinutit člena hlasovat podle vašich představ." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_republic_decree: "Republikový výnos" # todo: NEW TRANSLATION
 game_concept_republic_decrees: "Republikové výnosy" # todo: NEW TRANSLATION
 game_concept_republic_decree_short: "Výnos" # todo: NEW TRANSLATION
 game_concept_republic_decrees_short: "Výnosy" # todo: NEW TRANSLATION
 game_concept_republic_decree_desc: "Republikový výnos je druh [Concept('decision','rozhodnutí')|E] pro [Concept('republic','republiku')|E], který musí schválit [Concept('assembly','shromáždění')|E].\n\nExistuje několik druhů výnosů, většina z nich obvykle ovlivňuje [patricians|E], [Concept('realm_capital','hlavní sídlo panství')|E] nebo celou republiku." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_house_ambition: "Ambice rodu" # todo: NEW TRANSLATION
 game_concept_house_ambitions: "Ambice rodů" # todo: NEW TRANSLATION
 game_concept_house_ambition_desc: "Každý [Concept('house','rod')|E] v rámci [Concept('republic','republiky')|E] má svou ambici, která vyjadřuje, jak chtějí jeho členové ovlivnit republiku." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_republic_administration: "Správa republiky" # todo: NEW TRANSLATION
 game_concept_republic_administration_short: "Správa" # todo: NEW TRANSLATION
 game_concept_republic_administrations: "Způsoby správy republiky" # todo: NEW TRANSLATION
 game_concept_republic_administration_desc: "Všechny [Concept('republics','republiky')|E] mají stanovený způsob správy, který určuje, na co se republika specializuje.\n\nZpůsob správy může změnit pouze [Concept('ruler','vládce')|E] republiky.\n\nNa výběr je několik způsobů správy, z nichž každý přináší jedinečné výhody.\n\n#help Nejčastějšími způsoby správy jsou [GetLaw( 'republic_type_communal' ).GetName], [GetLaw( 'republic_type_maritime' ).GetName] a [GetLaw( 'republic_type_civic' ).GetName].#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_republic_senator: "Senátor" # todo: NEW TRANSLATION
 game_concept_republic_senators: "Senátoři" # todo: NEW TRANSLATION
 game_concept_republic_senator_desc: "Senátor je jmenovaný člen [Concept('assembly','shromáždění')|E] v rámci zákona [GetLaw( 'republic_assembly_composition_roman_senate' ).GetName].\n\nSenátory jmenuje [Concept('ruler','vládce')|E] [Concept('republic_possessive','republik')|E] nebo cenzor.\n\nSoučasně lze jmenovat pouze omezený počet senátorů; ten určuje [Concept('law','zákona')|E] o velikosti senátu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_mercenary_limit: "Limit žoldnéřů" # todo: NEW TRANSLATION
 game_concept_mercenary_limit_desc: "Limit žoldnéřů určuje, kolik [Concept('mercenaries','žoldnéře')|E] může [Concept('character','postava')|E] najmout najednou.\n\nLimit žoldnéřů závisí na:\n$BULLET_WITH_TAB$[martial_i][Concept('martial','Válečnictví')|E] [Concept('skill','Dovednost')|E]\n$BULLET_WITH_TAB$[title_tier_i][Concept('title_tier','Úroveň')|E]\n$BULLET_WITH_TAB$[Concept('government_form','Forma vlády')|E]\n$BULLET_WITH_TAB$[Concept('lifestyles','Životní styly')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
