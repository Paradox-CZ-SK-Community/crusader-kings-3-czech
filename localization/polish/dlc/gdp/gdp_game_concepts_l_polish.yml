 game_concept_charter_i: "@charter_icon!" # todo: NEW TRANSLATION
 game_concept_merchant_charter_desc: "Listina je dokument [Concept('artifact','artefakt')|E], který [Concept('merchant_patron','patron')|E] uděluje jednomu ze svých [Concept('clients','klientů')|E].\n\nKupci, kteří vlastní listinu mezi artefakty nesoucími pečeť svého patrona, mohou využít:\n$EFFECT_LIST_BULLET$#EMP #V $abuse_charter_authority_decision$#!#! [Concept('decision','rozhodnutí')|E]\n$EFFECT_LIST_BULLET$#EMP #V $benevolent_charter_authority_decision$#!#! [Concept('decision','rozhodnutí')|E]\n$EFFECT_LIST_BULLET$#EMP #V $leverage_charter_authority_interaction$#!#! [Concept('interaction','interakce')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_make_a_request: "$patron_request_interaction$" # todo: NEW TRANSLATION
 game_concept_make_a_request_desc: "$patron_request_interaction$ je [Concept('interaction','interakce')|E], kterou lze požádat [Concept('merchant_patron','patron')|E] o laskavost, sponzorství nebo jinou podporu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_request_contract_change: "$subject_modify_tributary_contract_interaction$" # todo: NEW TRANSLATION
 game_concept_request_contract_change_desc: "$subject_modify_tributary_contract_interaction$ je [Concept('interaction','interakce')|E], pomocí níž může [Concept('vassal','vazal')|E], [Concept('tributary','tributář')|E] nebo [Concept('client','klient')|E] znovu vyjednat své závazky vůči svému [Concept('liege','lennímu pánovi')|E] nebo [suzerain|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_leading_title: "Vedoucí titul" # todo: NEW TRANSLATION
 game_concept_leading_title_desc: "[Concept('title','Titul')|E], který stojí v čele konfederace založené na titulech, jako je [Concept('trade_league','obchodní liga')|E].\n\n[Concept('holder','Držitel')|E] vedoucího titulu je [Concept('trade_league_leader','vůdce obchodní ligy')|E] konfederace." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_client_contract: "Klientská smlouva" # todo: NEW TRANSLATION
 game_concept_client_contracts: "Klientské smlouvy" # todo: NEW TRANSLATION
 game_concept_client_contract_desc: "Klientské smlouvy upravují [Concept('obligations','povinnosti')|E] mezi [Concept('client','klientem')|E] a jeho [Concept('merchant_patron','patronem')|E].\n\nLze vyjednat čtyři závazky: podíl z příjmů z [Concept('trade','obchodu')|E] odváděný patronovi, podporu patrona v oblasti [Concept('prestige','prestiž')|E], podporu [Concept('trade_competitiveness','obchodní konkurenceschopnost')|E] a zprostředkování [Concept('marriages','sňatky')|E] jménem kupecké rodiny.\n\nSmlouva se dědí při nástupnictví a nelze ji zrušit, pokud kupec nepřemístí svou [Concept('company','společnost')|E] do nových [Concept('holding','državy')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_member_title: "Členský titul" # todo: NEW TRANSLATION
 game_concept_member_title_desc: "[Concept('title','Titul')|E], který je součástí konfederace založené na titulech, jako je [Concept('trade_league','obchodní liga')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_company_sentiment: "Směřování společnosti" # todo: NEW TRANSLATION
 game_concept_company_sentiment_i: "@company_sentiment_icon!" # todo: NEW TRANSLATION
 game_concept_company_direction: "Směřování společnosti" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_company_direction_i: "@company_sentiment_icon!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_sentiment: "Směřování" # todo: NEW TRANSLATION
 game_concept_sentiment_i: "@company_sentiment_icon!" # todo: NEW TRANSLATION
 game_concept_company_sentiment_desc: "Směřování společnosti vyjadřuje způsob fungování [Concept('merchant_family_possessive','kupecké rodiny')|E] a postoje jejích členů vůči sobě navzájem.\n\nExistuje několik [Concept('company_sentiment_levels','postojů společnosti')|E], z nichž každý přináší členům [Concept('house','rodu')|E] různé výhody a postihy.\n\nSměřování společnosti se mění podle činů celé společnosti. [Concept('company_sentiment_positive_actions','Činy posilující legitimitu')|E] obvykle posouvají $game_concept_sentiment$ směrem k [company_sentiment_concerted_i][Concept('company_sentiment_concerted','povýšenému do šlechtickému stavu')|E], zatímco [Concept('company_sentiment_negative_actions','činy vedené touhou po zisku')|E] jej posouvají směrem k [company_sentiment_divided_i][Concept('company_sentiment_divided','dravému')|E].\n\n[Concept('house_heads','Hlavy rodu')|E] mají obvykle větší vliv na směřování svého rodu než ostatní členové." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_company_sentiment_level: "Postoj společnosti" # todo: NEW TRANSLATION
 game_concept_company_sentiment_level_i: "@company_sentiment_icon!" # todo: NEW TRANSLATION
 game_concept_company_sentiment_levels: "Postoje společnosti" # todo: NEW TRANSLATION
 game_concept_company_sentiment_level_desc: "Postoj společnosti označuje aktuální stav [Concept('company_sentiment','směřování společnosti')|E]. Aktivní postoj se mění podle toho, zda je $game_concept_sentiment$ posouváno směrem k [company_sentiment_concerted_i][Concept('company_sentiment_concerted','povýšenému do šlechtickému stavu')|E] prostřednictvím [Concept('company_sentiment_positive_actions','činů posilujících legitimitu')|E], nebo směrem k [company_sentiment_divided_i][Concept('company_sentiment_divided','dravým')|E] prostřednictvím [Concept('company_sentiment_negative_actions','činů vedených touhou po zisku')|E]. Každý postoj přináší členům [Concept('house','rodu')|E] různé výhody a postihy.\n\nExistuje pět různých postojů:\n$EFFECT_LIST_BULLET$[company_sentiment_divided_i][Concept('company_sentiment_divided','Dravý')|E]\n$EFFECT_LIST_BULLET$[company_sentiment_fractious_i][Concept('company_sentiment_fractious','Příležitostný')|E]\n$EFFECT_LIST_BULLET$[company_sentiment_independent_i][Concept('company_sentiment_independent','Vyvážený')|E]\n$EFFECT_LIST_BULLET$[company_sentiment_cooperative_i][Concept('company_sentiment_cooperative','Chamtivý')|E]\n$EFFECT_LIST_BULLET$[company_sentiment_concerted_i][Concept('company_sentiment_concerted','Povýšený do šlechtického stavu')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
