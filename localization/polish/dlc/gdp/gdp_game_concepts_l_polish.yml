 game_concept_company_sentiment_concerted_i: "@company_sentiment_concerted_icon!" # todo: NEW TRANSLATION
 game_concept_company_sentiment_divided_desc: "Dravý [Concept('company_sentiment_level','postoj společnosti')|E] je nejvíce soutěživý postoj. Když [Concept('company','společnost')|E] tento postoj přijme, každý člen rodu se soustředí především na zisk, i kdyby to znamenalo šlapat si navzájem po krku.\n\n#bold Účinky této úrovně postoje společnosti:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #N -20#!\n$EFFECT_LIST_BULLET$Mínění [Concept('merchant_patron','patron')|E]: #P +20#!\n$EFFECT_LIST_BULLET$[competitiveness_i][Concept('competitiveness','Konkurenceschopnost')|E]: #P +25%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_very_high_risk_of_leaving$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_merchant_can_request_complete_exploitative_monopolies$\n$EFFECT_LIST_BULLET$#EMP #V $unity_regional_networks_decision$#!#! [Concept('decision','rozhodnutí')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_company_sentiment_fractious_desc: "Příležitostný [Concept('company_sentiment_level','postoj společnosti')|E] je vysoce soutěživý postoj, méně soutěživý pouze než postoj [Concept('rapacious','$game_concept_company_sentiment_divided$')|E]. Když [Concept('company','společnost')|E] tento postoj přijme, členové dávají přednost vlastním zájmům před povinnostmi vůči rodu.\n\n#bold Účinky této [Concept('company_sentiment_level','postoji společnosti')|E]:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #N -10#!\n$EFFECT_LIST_BULLET$[competitiveness_i][Concept('competitiveness','Konkurenceschopnost')|E]: #P +10%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_risk_of_leaving$\n$EFFECT_LIST_BULLET$#EMP #V $unity_establish_network_decision$#!#! [Concept('decision','rozhodnutí')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_company_sentiment_independent_desc: "Vyvážený [Concept('company_sentiment_level','postoj společnosti')|E] představuje střední postoj. Když [Concept('company','společnost')|E] tento postoj přijme, rod stále potřebuje hlavu, ale jeho členové mohou bez zásahů či odsuzování jednat po svém.\n\n#bold Účinky této [Concept('company_sentiment_level','postoji společnosti')|E]:#!\n$EFFECT_LIST_BULLET$#EMP #V $unity_consult_house_decision$#!#! [Concept('decision','rozhodnutí')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_company_sentiment_cooperative_desc: "Chamtivý [Concept('company_sentiment_level','postoj společnosti')|E] je vysoce zaměřený na legitimitu, méně zaměřený na legitimitu pouze než postoj [Concept('ennobled','$game_concept_company_sentiment_concerted$')|E]. Když [Concept('company','společnost')|E] tento postoj přijme, pověst společnosti a pověst jejích členů splynou v jedno a každý člen se musí snažit zlepšit svou pověst i společenské postavení.\n\n#bold Účinky této [Concept('company_sentiment_level','postoji společnosti')|E]:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #P +10#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_LIFESTYLE_XP_GAIN_MULT$: #P +5%#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_PRESTIGE_GAIN_MULT$: #P +10%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_deputy_positions_cost_less$\n$EFFECT_LIST_BULLET$#EMP #V $unity_merchant_prosperity_decision$#!#! [Concept('decision','rozhodnutí')|E]\n$EFFECT_LIST_BULLET$#EMP #V $unity_merchant_bailiffs_decision$#!#! [Concept('decision','rozhodnutí')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_company_sentiment_concerted_desc: "Povýšený do šlechtického stavu [Concept('company_sentiment_level','postoje společnosti')|E] je nejvíce zaměřený na legitimitu. Když [Concept('company','společnost')|E] tento postoj přijme, věrnost pramenící z povinnosti a úcty spojí zájmy celku se zájmy hlavy rodu a společnost se může rovnat šlechtickým rodům.\n\n#bold Účinky této [Concept('company_sentiment_level','postoji společnosti')|E]:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #P +20#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_PRESTIGE_GAIN_MULT$: #P +25%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_unlock_befriend_scheme$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_deputy_positions_cost_significantly_less$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_merchant_can_petition_for_noble_standing$\n$EFFECT_LIST_BULLET$#EMP #V $unity_family_business_decision$#!#! [Concept('decision','rozhodnutí')|E]\n$EFFECT_LIST_BULLET$#EMP #V $unity_merchant_prosperity_decision$#!#! [Concept('decision','rozhodnutí')|E]\n$EFFECT_LIST_BULLET$#EMP #V $unity_merchant_bailiffs_decision$#!#! [Concept('decision','rozhodnutí')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_company_sentiment_positive_actions: "Činy posilující legitimitu" # todo: NEW TRANSLATION
 game_concept_company_sentiment_positive_actions_desc: "Činy vaší [Concept('company','společnost')|E] posilující legitimitu posunou [Concept('company_sentiment','směřování společnosti')|E] směrem k [company_sentiment_concerted_i][Concept('company_sentiment_concerted','povýšenému do šlechtickému stavu')|E].\n\n[Concept('house_heads','Hlavy rodu')|E] mohou pomocí [Concept('decision','rozhodnutí')|E] #V $unity_merchant_promote_excess_decision$#! výrazně posunout [Concept('company_sentiment','směřování společnosti')|E] směrem k [company_sentiment_concerted_i][Concept('company_sentiment_concerted','povýšenému do šlechtickému stavu')|E].\n\n#weak Mezi příklady $game_concept_company_sentiment_positive_actions$ patří:$company_sentiment_increase_examples$#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_company_sentiment_negative_actions: "Činy vedené touhou po zisku" # todo: NEW TRANSLATION
 game_concept_company_sentiment_negative_actions_desc: "Činy vaší [Concept('company','společnost')|E] vedené touhou po zisku posunou [Concept('company_sentiment','směřování společnosti')|E] směrem k [company_sentiment_divided_i][Concept('company_sentiment_divided','dravému')|E].\n\n[Concept('house_heads','Hlavy rodu')|E] mohou pomocí [Concept('decision','rozhodnutí')|E] #V $unity_merchant_promote_diligence_decision$#! výrazně posunout [Concept('company_sentiment','směřování společnosti')|E] směrem k [company_sentiment_divided_i][Concept('company_sentiment_divided','dravé')|E].\n\n#weak Mezi příklady $game_concept_company_sentiment_negative_actions$ patří:$company_sentiment_decrease_examples$#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 company_sentiment_increase_examples: "\n$EFFECT_LIST_BULLET$ $arrange_marriage_interaction$ mezi rodem a šlechtou\n$EFFECT_LIST_BULLET$ $gift_artifact_interaction$\n$EFFECT_LIST_BULLET$ Splnění žádosti společníka\n$EFFECT_LIST_BULLET$ $pay_ransom_interaction$\n$EFFECT_LIST_BULLET$ $offer_guardianship_interaction$\n$EFFECT_LIST_BULLET$ $restore_inheritance_interaction$\n$EFFECT_LIST_BULLET$ $abandon_hook_interaction$\n$EFFECT_LIST_BULLET$ $fund_inspiration_interaction$\n$EFFECT_LIST_BULLET$ $propose_best_friendship_interaction$" # todo: NEW TRANSLATION
 company_sentiment_decrease_examples: "\n$EFFECT_LIST_BULLET$ $arrange_marriage_interaction$ s jiným kupeckým rodem\n$EFFECT_LIST_BULLET$ Pozvání do společnosti\n$EFFECT_LIST_BULLET$ Nesplnění žádosti společníka\n$EFFECT_LIST_BULLET$ $merchant_adopt_interaction$\n$EFFECT_LIST_BULLET$ $declare_war_interaction$\n$EFFECT_LIST_BULLET$ $imprison_interaction$\n$EFFECT_LIST_BULLET$ $move_to_dungeon_interaction$\n$EFFECT_LIST_BULLET$ $disinherit_interaction$\n$EFFECT_LIST_BULLET$ $denounce_interaction$\n$EFFECT_LIST_BULLET$ $expose_secret_interaction$\n$EFFECT_LIST_BULLET$ $blackmail_interaction$\n$EFFECT_LIST_BULLET$ $break_betrothal_interaction$" # todo: NEW TRANSLATION
