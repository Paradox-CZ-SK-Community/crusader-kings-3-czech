 game_concept_trade_opportunities_possessive: "Obchodních příležitostí" # todo: NEW TRANSLATION
 game_concept_opportunity: "Příležitost" # todo: NEW TRANSLATION
 game_concept_opportunities: "Příležitosti" # todo: NEW TRANSLATION
 game_concept_opportunity_possessive: "Příležitosti" # todo: NEW TRANSLATION
 game_concept_opportunities_possessive: "Příležitostí" # todo: NEW TRANSLATION
 game_concept_trade_opportunity_desc: "Obchodní příležitosti vyžadují, aby [Concept('merchant','kupec')|E] [Concept('companies','společností')|E] úspěšně dokončily [Concept('scheme','intrika')|E].\n\nObvykle jde čistě o obchodní záležitosti (jako propagace výnosného [Concept('trade_goods','obchodního zboží')|E]), mohou však být i více nepřátelské (jako soupeření s konkurenčním rodem o kontrolu nad [Concept('market','trhem')|E]).\n\nPokud $game_concept_scheme$ z jakéhokoli důvodu selže nebo je opuštěna, selže také $game_concept_trade_opportunity$." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_opportunity_tier: "Úroveň obchodní příležitosti" # todo: NEW TRANSLATION
