 game_concept_merchant_patron_desc: "Patron je [Concept('ruler','vládce')|E] [Concept('holding','državy')|E], kde se nachází [Concept('domicile','domicilem')|E] [Concept('merchant_possessive','kupcem')|E].\n\nKupec je pak považován za [Concept('client','klienta')|E] patrona a musí mu platit [Concept('taxes','daně')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
