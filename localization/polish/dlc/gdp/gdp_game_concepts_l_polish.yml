 game_concept_trade: "Obchod" # todo: NEW TRANSLATION
 game_concept_trade_desc: "Obchod je zdrojem obživy [Concept('republics','republiky')|E], [Concept('trade_leagues','obchodní ligy')|E] a [Concept('merchants','kupci')|E].\n\n[Concept('trade_routes','Obchodní trasy')|E] zajišťují dovoz a vývoz [Concept('goods','zboží')|E] do [Concept('trade_markets','obchodních trhů')|E] i z nich, zatímco [Concept('needs','potřeby')|E] a [Concept('surpluses','přebytky')|E] trhu určují [Concept('buildings','budovy')|E] v příslušných [Concept('baronies','baronstvích')|E].\n\nProdejní ceny naproti tomu určuje [Concept('prosperity','rozkvět')|E] državy a postavy zapojené do prodeje využívají [Concept('competitiveness','konkurenceschopnost')|E] a [Concept('monopolies','monopoly')|E], aby ovládly trhy. Každý, kdo obchoduje na trhu, by se měl snažit zvýšit [Concept('capacity','kapacita')|E] a délku svých tras, stejně jako počet trhů a obchodního zboží na každé trase, aby zvýšil zisk.\n\nDo obchodu se mohou zapojit všechny [Concept('government_forms','formy vlády')|E] kromě [Concept('adventurers','dobrodruhů')|E] a [nomads|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_good: "Obchodní zboží" # todo: NEW TRANSLATION
 game_concept_trade_goods: "Obchodní zboží" # todo: NEW TRANSLATION
 game_concept_trade_goods_i: "@trade_goods_icon!" # todo: NEW TRANSLATION
 game_concept_trade_good_possessive: "Obchodního zboží" # todo: NEW TRANSLATION
 game_concept_trade_goods_possessive: "Obchodního zboží" # todo: NEW TRANSLATION
 game_concept_good: "Zboží" # todo: NEW TRANSLATION
 game_concept_goods: "Zboží" # todo: NEW TRANSLATION
 game_concept_basic_trade_good: "Základní obchodní zboží" # todo: NEW TRANSLATION
 game_concept_basic_trade_goods: "Základní obchodní zboží" # todo: NEW TRANSLATION
 game_concept_basic_trade_good_desc: "Základní obchodní zboží je [Concept('trade_goods','obchodní zboží')|E], které lze přepravovat pomocí [Concept('distribution_route','zásobovací trasy')|E].\n\nNaproti tomu [Concept('profit_route','výnosné trase')|E] nebo [Concept('commission_route','zakázková trasa')|E] mohou obchodovat s jakýmkoli obchodním zbožím." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_market_toll: "Tržní clo" # todo: NEW TRANSLATION
 game_concept_market_tolls: "Tržní cla" # todo: NEW TRANSLATION
 game_concept_toll: "Clo" # todo: NEW TRANSLATION
 game_concept_tolls: "Cla" # todo: NEW TRANSLATION
 game_concept_market_toll_desc: "Tržní cla jsou poplatky vybírané z každého prodeje uskutečněného na [Concept('trade_market','obchodní trh')|E].\n\nO jejich výši rozhoduje [Concept('market_owner','vlastník trhu')|E], kterému také náleží veškeré vybrané poplatky.\n\n[Concept('markets','Trhy')|E] s nižšími tržními cly jsou pro [Concept('merchants','kupce')|E] výnosnější.\n\nVyšší tržní cla zvyšují [Concept('income','příjem')|E] vlastníka trhu, ale snižují zisk, který $game_concept_merchants$ získají z každé [Concept('profit_route','výnosné trasy')|E] prodávající zboží na trh. Dostatečně vysoká $game_concept_tolls$ mohou přimět $game_concept_merchants$ prodávat raději na [Concept('markets','trhy')|E] s nižším tržními cly.\n\n[Concept('market_owner','Vlastník trhu')|E] a jeho [Concept('direct_vassals','přímých vazalů')|E], [tributaries|E] a [Concept('clients','klienti')|E] jsou od placení cla osvobozeni." # todo: NEW TRANSLATION, CHECK FORMAT # todo: CONCEPT CASE # todo: FORMAT chýba [goods], [market], [market_owner_possessive], [market_tolls], [market_tolls], [market_tolls], [markets]; navyše [m
 game_concept_good_possessive: "Zboží" # todo: NEW TRANSLATION
 game_concept_goods_possessive: "Zboží" # todo: NEW TRANSLATION
 game_concept_trade_good_desc: "Obchodní zboží lze kupovat a prodávat na [Concept('market','trh')|E]. Po celém světě se obchoduje s množstvím různých druhů zboží, aby byly uspokojeny [Concept('needs','potřeby')|E] [Concept('realms','panství')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_category: "Kategorie zboží" # todo: NEW TRANSLATION
 game_concept_trade_categories: "Kategorie zboží" # todo: NEW TRANSLATION
 game_concept_trade_category_short: "Kategorie" # todo: NEW TRANSLATION
 game_concept_trade_categories_short: "Kategorie" # todo: NEW TRANSLATION
 game_concept_trade_category_desc: "Kategorie zboží jsou skupiny [Concept('trade_goods','obchodní zboží')|E]. [Concept('trade_markets','Obchodní trhy')|E] často mají [Concept('need','potřeba')|E] na zboží z určité kategorie. Potřebu lze uspokojit jakýmkoli zbožím z dané kategorie." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_expertise: "Obchodní zkušenost" # todo: NEW TRANSLATION
 game_concept_expertise: "Zkušenost" # todo: NEW TRANSLATION
 game_concept_trade_expertise_desc: "Obchodní zkušenost vyjadřuje praktické zkušenosti s obchodováním v konkrétní [Concept('trade_category','kategorii zboží')|E]. Získává se díky [Concept('primary_good','hlavní komoditě')|E] aktivních [Concept('trade_routes','obchodních tras')|E]. S rostoucí zkušeností se obchodování v dané kategorii stává výnosnějším a vyšší [Concept('expertise_levels','úrovně zkušenosti')|E] přinášejí další bonusy závisející na dané kategorii." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_expertise_progress: "Postup obchodní zkušenosti" # todo: NEW TRANSLATION
 game_concept_expertise_progress: "Postup zkušenosti" # todo: NEW TRANSLATION
 game_concept_trade_expertise_progress_desc: "Každý bod [Concept('expertise','zkušenost')|E] zvyšuje postup postavy k další [Concept('expertise_level','úrovni zkušenosti')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_expertise_level: "Úroveň obchodní zkušenosti" # todo: NEW TRANSLATION
 game_concept_expertise_level: "Úroveň zkušenosti" # todo: NEW TRANSLATION
 game_concept_expertise_levels: "Úrovně zkušenosti" # todo: NEW TRANSLATION
 game_concept_trade_expertise_level_desc: "Úroveň obchodní zkušenosti [Concept('trade_category','kategorie zboží')|E] je úroveň vyjadřující, jak zkušená je [Concept('trade_company','obchodní společnost')|E] v obchodování s danou kategorií.\n\nZvyšuje se s hromaděním [Concept('expertise_progress','postupem zkušenosti')|E] z aktivních [Concept('trade_routes','obchodních tras')|E] a každá úroveň poskytuje další bonusy k [Concept('trade','obchodu')|E].\n\nBez aktivního obchodu v dané kategorii bude úroveň postupně klesat (#N -[GetDefine('NTrade', 'TRADE_CATEGORY_BASE_MONTHLY_XP_DECLINE')|0]#! postupu zkušenosti za měsíc)." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_market: "Obchodní trh" # todo: NEW TRANSLATION
 game_concept_market_i: "@trade_market_icon!" # todo: NEW TRANSLATION
 game_concept_trade_markets: "Obchodní trhy" # todo: NEW TRANSLATION
 game_concept_trade_market_possessive: "Obchodního trhu" # todo: NEW TRANSLATION
 game_concept_trade_markets_possessive: "Obchodních trhů" # todo: NEW TRANSLATION
 game_concept_market: "Trh" # todo: NEW TRANSLATION
 game_concept_markets: "Trhy" # todo: NEW TRANSLATION
 game_concept_market_possessive: "Trhu" # todo: NEW TRANSLATION
 game_concept_markets_possessive: "Trhů" # todo: NEW TRANSLATION
 game_concept_trade_market_desc: "Obchodní trh je obchodní centrum, které sdružuje [Concept('production','produkce')|E] a [Concept('needs','potřeby')|E] všech [Concept('holdings','držav')|E], jež zahrnuje.\n\nNa trhu se místní produkce nejprve využije k uspokojení [Concept('needs','potřebám')|E] jeho [Concept('buildings','budovám')|E]; vše, co zbude, se stává [Concept('surplus','přebytkem')|E], který lze prodat, zatímco neuspokojené potřeby je nutné pokrýt dovozem. [Concept('trade_routes','Obchodní trasy')|E] propojují trhy a přepravují mezi nimi [Concept('goods','zbožím')|E].\n\nKaždý trh se soustředí kolem [Concept('market_capital','tržního hlavního sídla')|E], kterou drží jeho [Concept('market_owner','vlastníka trhu')|E]. Čím vyšší je [Concept('market_prosperity','hospodářská prosperita trhu')|E], tím lepší [Concept('sell_prices','prodejní ceny')|E] nabízí obchodníkům." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_market_prosperity: "Hospodářská prosperita trhu" # todo: NEW TRANSLATION
 game_concept_market_prosperity_i: "@prosperity_icon!" # todo: NEW TRANSLATION
 game_concept_market_prosperity_desc: "Hospodářská prosperita trhu je průměrná úroveň [Concept('prosperity','rozkvět')|E] ve všech [Concept('counties','hrabství')|E] na [Concept('market','trh')|E].\n\nVyšší hospodářskou prosperitu trhu zvyšuje [Concept('sell_prices','prodejní ceny')|E] [Concept('goods','zboží')|E] na trhu a činí jej tak výnosnější destinací pro [Concept('merchants','kupce')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_market_capital: "Tržní hlavní sídlo" # todo: NEW TRANSLATION
 game_concept_market_capitals: "Tržní hlavní sídla" # todo: NEW TRANSLATION
 game_concept_market_capital_possessive: "Tržního hlavního sídla" # todo: NEW TRANSLATION
 game_concept_market_capitals_possessive: "Tržních hlavních sídel" # todo: NEW TRANSLATION
 game_concept_market_capital_desc: "Tržní hlavní sídlo je [Concept('holding','država')|E] v srdci [Concept('market','trhu')|E], obvykle [Concept('de_jure','de iure')|E] hlavní sídlo [Concept('duchy','vévodství')|E], které trh pokrývá.\n\nNa začátku hry je pevně určeno a nepřesouvá se. Kdo drží toto [Concept('barony','baronství')|E], stává se [Concept('market_owner','vlastníkem trhu')|E] a ovládá trh." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_market_owner: "Vlastník trhu" # todo: NEW TRANSLATION
 game_concept_market_owners: "Vlastníci trhu" # todo: NEW TRANSLATION
 game_concept_market_owner_possessive: "Vlastníka trhu" # todo: NEW TRANSLATION
 game_concept_market_owners_possessive: "Vlastníků trhu" # todo: NEW TRANSLATION
 game_concept_owner: "Vlastník" # todo: NEW TRANSLATION
 game_concept_owners: "Vlastníci" # todo: NEW TRANSLATION
 game_concept_owner_possessive: "Vlastníka" # todo: NEW TRANSLATION
 game_concept_owners_possessive: "Vlastníků" # todo: NEW TRANSLATION
 game_concept_market_owner_desc: "Vlastník trhu je ten, kdo drží [Concept('market_capital','tržní hlavní sídlo')|E] [Concept('market','trhu')|E]. Ovládání trhu přechází spolu s vlastnictvím jeho [Concept('barony','baronstvím')|E] prostřednictvím války nebo dědictví.\n\nVlastník trhu jej ovládá: může vytvářet [Concept('distribution_routes','zásobovací trasy')|E], které jsou s ním propojené, je nezbytným partnerem pro [Concept('commission_routes','zakázkové trasy')|E], může v něm udělovat [Concept('monopolies','monopoly')|E] a stanovuje jeho [Concept('market_toll','tržního cla')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_market_priority: "Priorita trhu" # todo: NEW TRANSLATION
 game_concept_market_priorities: "Priority trhu" # todo: NEW TRANSLATION
 game_concept_market_priority_desc: "Priorita trhu určuje pořadí, v jakém jsou [Concept('holdings','državách')|E] na [Concept('market','trh')|E] obslouženy při uspokojování jejich [Concept('needs','potřeby')|E].\n\nPrvní je [Concept('market_capital','tržní hlavní sídlo')|E], poté zbytek jejího [Concept('county','hrabství')|E] a následně ostatní $game_concept_counties$ podle [Concept('settlement_size','velikosti sídla')|E] jejich [Concept('county_capital','hlavní sídlo hrabství')|E].\n\nV rámci každého hrabství je první [Concept('county_capital','hlavního sídla hrabství')|E], po níž následují ostatní držav podle [Concept('settlement_size','velikosti sídla')|E].\n\nJakmile se dostaneš do [Concept('holding','državy')|E], můžeš změnit pořadí [districts|E] a [Concept('buildings','budov')|E], aby správná [Concept('building','budovy')|E] dostala své [Concept('needs','potřeb')|E] uspokojeny jako první." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_market_share: "Podíl na trhu" # todo: NEW TRANSLATION
 game_concept_market_shares: "Podíly na trhu" # todo: NEW TRANSLATION
 game_concept_market_share_desc: "Tvůj $game_concept_market_share$ určuje, jaké množství [Concept('trade_good','obchodní zboží')|E] může tvá [Concept('profit_route','výnosná trasa')|E] na [Concept('market','trh')|E] zobchodovat. Závisí na tvé hodnotě konkurenceschopnosti.\n\nNapříklad pokud máš u určitého zboží stejnou hodnotu konkurenceschopnost jako všichni ostatní dohromady, tvůj $game_concept_market_share$ bude 50 %. Pokud s daným zbožím nikdo další neobchoduje, tvůj $game_concept_market_share$ bude vždy 100 %.\n\nV takovém případě budeš moci nakoupit veškerý [Concept('surplus','přebytek')|E] nebo prodat zboží k uspokojení všech [Concept('needs','potřeb')|E] na daném trhu, pokud máš dostatečnou [Concept('capacity','kapacity')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_route: "Obchodní trasa" # todo: NEW TRANSLATION
 game_concept_route_i: "@trade_route_icon!" # todo: NEW TRANSLATION
 game_concept_distribution_route_i: "@distribution_route_icon!" # todo: NEW TRANSLATION
 game_concept_trade_routes: "Obchodní trasy" # todo: NEW TRANSLATION
 game_concept_trade_route_possessive: "Obchodní trasy" # todo: NEW TRANSLATION
 game_concept_trade_routes_possessive: "Obchodních tras" # todo: NEW TRANSLATION
 game_concept_route: "Trasa" # todo: NEW TRANSLATION
 game_concept_routes: "Trasy" # todo: NEW TRANSLATION
 game_concept_route_possessive: "Trasy" # todo: NEW TRANSLATION
 game_concept_routes_possessive: "Tras" # todo: NEW TRANSLATION
 game_concept_trade_route_desc: "Obchodní trasa umožňuje [Concept('character','postava')|E] [Concept('trade','obchodu')|E] za [Concept('gold','zlato')|E] nebo uspokojovat potřeby svého [Concept('realm','panství')|E]. Těmito kanály se mezi [Concept('markets','trhy')|E] vyměňuje [Concept('goods','zboží')|E] a [Concept('surplus','přebytek')|E] z jednoho trhu slouží k uspokojení [Concept('needs','potřebám')|E] na druhém.\n\nExistují tři typy tras:\n #indent_newline:4    $EFFECT_LIST_BULLET$[Concept('distribution_route','zásobovací trasa')|E]: Používají je [Concept('dukes','vévodové')|E] a vyšší vládci k uspokojování [Concept('needs','potřebám')|E] svých [Concept('buildings','budovám')|E].\n$EFFECT_LIST_BULLET$[Concept('profit_route','Výnosná trasa')|E]: Používají je [Concept('merchants','kupci')|E] a [Concept('republican','republikánští')|E] vládci k získávání [Concept('gold','zlatu')|E].\n$EFFECT_LIST_BULLET$[Concept('commission_route','Zakázková trasa')|E]: Podobají se výnosným trasám, ale zeměpanský vládce je zadává obchodníkům, aby po omezenou dobu uspokojovali potřeby za jednorázovou platbu předem.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_distribution_route: "Zásobovací trasa" # todo: NEW TRANSLATION
 game_concept_distribution_routes: "Zásobovací trasy" # todo: NEW TRANSLATION
 game_concept_distribution: "Zásobování" # todo: NEW TRANSLATION
 game_concept_distribution_route_possessive: "Zásobovací trasy" # todo: NEW TRANSLATION
 game_concept_distribution_routes_possessive: "Zásobovacích tras" # todo: NEW TRANSLATION
 game_concept_distribution_route_desc: "Zásobovací trasa je typ [Concept('trade_route','obchodní trasa')|E], který používají [Concept('dukes','vévodové')|E] a vyšší vládci k zásobování vlastního [Concept('realm','panství')|E].\n\nPropojuje dva [Concept('markets','trhy')|E] a veškerý [Concept('surplus','přebytek')|E] na jednom trh se používá k uspokojení [Concept('needs','potřebám')|E] na druhém. Pomocí zásobovacích tras lze však přepravovat pouze [Concept('basic_trade_goods','základní obchodní zboží')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_profit_route: "Výnosná trasa" # todo: NEW TRANSLATION
 game_concept_profit_routes: "Výnosné trasy" # todo: NEW TRANSLATION
 game_concept_profit: "Zisk" # todo: NEW TRANSLATION
 game_concept_profit_route_possessive: "Výnosné trasy" # todo: NEW TRANSLATION
 game_concept_profit_routes_possessive: "Výnosných tras" # todo: NEW TRANSLATION
 game_concept_profit_route_desc: "Výnosná trasa je typ [Concept('trade_route','obchodní trasa')|E], který používají [Concept('merchants','kupci')|E] a [Concept('republican','republikánský')|E] [Concept('rulers','vládců')|E] k vydělávání [Concept('gold','zlatu')|E].\n\nNakupuje [Concept('trade_goods','obchodní zboží')|E] levně tam, kde je jich [Concept('surplus','přebytku')|E], a prodává je tam, kde jsou vysoké [Concept('needs','potřeby')|E]. Vydělává tak na rozdílu mezi [Concept('buy_price','nákupní cenou')|E] a [Concept('sell_price','prodejní cenou')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_route_modifier: "Modifikátor obchodních tras" # todo: NEW TRANSLATION
 game_concept_trade_route_modifier_i: "@trade_route_icon!" # todo: NEW TRANSLATION
 game_concept_trade_route_modifiers: "Modifikátory obchodních tras" # todo: NEW TRANSLATION
 game_concept_trade_route_modifier_desc: "Tento [Concept('modifier','modifikátor')|E] se vztahuje na všechny [Concept('trade_routes','obchodní trasy')|E] jeho vlastníka. Měnit lze tyto vlastnosti:\n$BULLET_WITH_TAB$[competitiveness_i][Concept('trade_competitiveness','Obchodní konkurenceschopnost')|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i][Concept('trade_route_capacity_short','Obchodní kapacita')|E]\n$BULLET_WITH_TAB$[route_i][Concept('route_length','Délka trasy')|E]\n$BULLET_WITH_TAB$[trade_goods_i][Concept('max_trade_goods_short','Obchodní komodity')|E]\n$BULLET_WITH_TAB$[market_i][Concept('max_trade_markets_short','Obchodní trhy')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_commission_route: "Zakázková trasa" # todo: NEW TRANSLATION
 game_concept_commission_route_desc: "Zakázková trasa je [Concept('trade_route','obchodní trasa')|E], kterou [Concept('merchant','kupce')|E] plní jménem svého [Concept('merchant_patron','patrona')|E].\n\nKupec dostává od patrona zaplaceno za dopravu konkrétního [Concept('trade_good','obchodního zboží')|E] do určeného [Concept('trade_market','obchodního trhu')|E] po dobu trvání $game_concept_commission_possessive$.\n\nKupec může mít současně aktivní pouze #V 1#! $game_concept_commission_route$." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_commission_routes: "Zakázkové trasy" # todo: NEW TRANSLATION
 game_concept_commission_route_possessive: "Zakázkové trasy" # todo: NEW TRANSLATION
 game_concept_commission_routes_possessive: "Zakázkových tras" # todo: NEW TRANSLATION
 game_concept_commission: "Zakázka" # todo: NEW TRANSLATION
 game_concept_commissions: "Zakázky" # todo: NEW TRANSLATION
 game_concept_commission_possessive: "Zakázky" # todo: NEW TRANSLATION
 game_concept_commissions_possessive: "Zakázek" # todo: NEW TRANSLATION
 game_concept_commissioned_route: "Trasa na zakázku" # todo: NEW TRANSLATION
 game_concept_commissioned_routes: "Trasy na zakázku" # todo: NEW TRANSLATION
 game_concept_trade_route_length: "Délka obchodní trasy" # todo: NEW TRANSLATION
 game_concept_route_length: "Délka trasy" # todo: NEW TRANSLATION
 game_concept_trade_route_length_i: "@trade_route_length_icon!" # todo: NEW TRANSLATION
 game_concept_trade_route_length_desc: "Délka obchodní trasy je maximální počet [Concept('baronies','baronství')|E], který může [Concept('profit_route','výnosná trasa')|E] překonat, včetně moří a splavných řek. Lze ji zvýšit vylepšováním [Concept('company_buildings','budovami společnosti')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_max_trade_goods: "Max. počet obchodních komodit" # todo: NEW TRANSLATION
 game_concept_max_trade_goods_short: "Obchodní komodity" # todo: NEW TRANSLATION
 game_concept_max_trade_goods_desc: "Max. počet obchodních komodit je počet různých druhů [Concept('good','zboží')|E], s nimiž lze obchodovat na [Concept('route','trasu')|E]. Lze jej zvýšit vylepšováním [Concept('company_buildings','budovami společnosti')|E].\n\n[Concept('profit_route','Výnosná trasa')|E] nikdy nemůže přepravovat více než #V [GetDefine('NTrade', 'MAX_TRADE_GOODS_ON_ROUTE_CAP')|0]#! [Concept('goods','zboží')|E], bez ohledu na případné bonusy." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_max_trade_markets: "Max. počet obchodních trhů" # todo: NEW TRANSLATION
 game_concept_max_trade_markets_short: "Obchodní trhy" # todo: NEW TRANSLATION
 game_concept_max_trade_markets_desc: "Max. počet obchodních trhů je počet [Concept('markets','trhy')|E], které si [Concept('character','postavě')|E] může zvolit jako zastávky na [Concept('profit_route','výnosnou trasu')|E]. Lze jej zvýšit vylepšováním [Concept('company_buildings','budovami společnosti')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_route_capacity: "Kapacita obchodní trasy" # todo: NEW TRANSLATION
 game_concept_trade_route_capacity_short: "Obchodní kapacita" # todo: NEW TRANSLATION
 game_concept_trade_route_capacity_i: "@trade_capacity!" # todo: NEW TRANSLATION
 game_concept_capacity: "Kapacita" # todo: NEW TRANSLATION
 game_concept_trade_route_capacity_desc: "Kapacita obchodní trasy určuje množství [Concept('trade_goods','obchodní zboží')|E], s nimiž lze v danou chvíli obchodovat na [Concept('profit_route','výnosnou trasu')|E]. Lze ji zvýšit vylepšováním [Concept('company_buildings','budovami společnosti')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_primary_good: "Hlavní komodita" # todo: NEW TRANSLATION
 game_concept_primary_goods: "Hlavní komodity" # todo: NEW TRANSLATION
 game_concept_primary_good_desc: "[Concept('merchants','Kupci')|E] a [Concept('patricians','patricijové')|E] mají jednu [Concept('trade_good','obchodní zboží')|E], která je $game_concept_primary_good$ jejich [Concept('trade_routes','obchodní trasy')|E].\n\nObchodováním s ní získávají [Concept('trade_expertise','obchodní zkušeností')|E] v její [Concept('trade_category','kategorii zboží')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_road: "Silnice" # todo: NEW TRANSLATION
 game_concept_roads: "Silnice" # todo: NEW TRANSLATION
 game_concept_road_possessive: "Silnice" # todo: NEW TRANSLATION
 game_concept_roads_possessive: "Silnic" # todo: NEW TRANSLATION
 game_concept_road_desc: "[Concept('road','Silnice')|E] spojuje dva [Concept('markets','trhy')|E] a umožňuje [Concept('trade_routes','obchodní trasy')|E] mezi nimi cestovat.\n\nObchodní trasy na silnice z ní mají prospěch, především díky prodloužení své [Concept('trade_route_length','délce obchodní trasy')|E].\n\nSilnice přímo prospívá také [Concept('barony','baronství')|E], kterou prochází, například zvyšuje rychlost pohybu [Concept('armies','armád')|E].\n\nVýhody $game_concept_road$ se zvětšují s její [Concept('road_tier','úrovní silnice')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_road_tier: "Úroveň silnice" # todo: NEW TRANSLATION
 game_concept_road_tiers: "Úrovně silnice" # todo: NEW TRANSLATION
 game_concept_road_tier_short: "Úroveň" # todo: NEW TRANSLATION
 game_concept_road_tier_desc: "Úroveň silnice označuje stupeň rozvoje [Concept('road','silnice')|E], od hrubé, neudržované cesty až po dobře vybudovanou silnici.\n\nÚroveň silnice stoupá s tím, jak po ní proudí [Concept('trade','obchodě')|E]. Každá další úroveň vyžaduje větší využití a její dosažení trvá déle než dosažení předchozí. Vyšší úrovně posilují účinky silnice — prodlužují [Concept('trade_route_length','délka obchodní trasy')|E] pro [Concept('trade_routes','obchodní trasy')|E], které ji využívají, a zvyšují bonusy pro [Concept('baronies','baronství')|E], kterými prochází.\n\nSilnice začínají na úrovni určené na mapě a na začátku hry se zobrazují pouze ty, které jsou nad nejnižší úrovní." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_building_need: "Potřeba budovy" # todo: NEW TRANSLATION
 game_concept_building_needs: "Potřeby budovy" # todo: NEW TRANSLATION
 game_concept_need: "Potřeba" # todo: NEW TRANSLATION
 game_concept_needs: "Potřeby" # todo: NEW TRANSLATION
 game_concept_building_need_desc: "[Concept('building','Budova')|E] může mít $game_concept_needs$ ohledně [Concept('trade_goods','obchodního zboží')|E], jejichž splnění přináší bonusy.\n\nPotřeby se mohou týkat buď konkrétní [Concept('good','zboží')|E] #weak (například [GetTradeGoodType('trade_good_wine').GetName])#!, nebo libovolné $game_concept_good$ z určité [Concept('trade_category_short','kategorie')|E] #weak (například [GetTradeGoodCategory('trade_category_alcohol').GetName])#!.\n\nVšechny potřeby uspokojují $game_concept_trade_goods$ na místním [Concept('market','trhu')|E]. Pokud na místním trhu není [Concept('surplus','přebytek')|E] dané $game_concept_good$, budou $game_concept_goods$ přidělovány podle [Concept('market_priority','priority trhu')|E].\n\nPotřeby jsou vždy nepovinné; za jejich nesplnění nehrozí žádné postihy." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_market_balance: "Bilance trhu" # todo: NEW TRANSLATION
 game_concept_market_balances: "Bilance trhů" # todo: NEW TRANSLATION
 game_concept_market_balance_short: "Bilance" # todo: NEW TRANSLATION
 game_concept_market_balances_short: "Bilance" # todo: NEW TRANSLATION
 game_concept_market_balance_desc: "Každý [Concept('market','trh')|E] má bilanci pro každou [Concept('trade_good','obchodní zboží')|E] nebo kategorii [Concept('goods','zboží')|E].\n\nJe-li bilance kladná, jedná se o [Concept('surplus','přebytek')|E].\n\nJe-li bilance záporná, v [Concept('buildings','budovách')|E] na trhu stále nejsou uspokojeny některé [Concept('needs','potřeby')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_surplus: "Přebytek na trhu" # todo: NEW TRANSLATION
 game_concept_trade_surpluses: "Přebytky na trhu" # todo: NEW TRANSLATION
 game_concept_surplus: "Přebytek" # todo: NEW TRANSLATION
 game_concept_surpluses: "Přebytky" # todo: NEW TRANSLATION
 game_concept_trade_surplus_desc: "[Concept('trade_good','Obchodní zboží')|E] je na [Concept('market','trh')|E] v přebytku, pokud je [Concept('production','produkce')|E] vyšší než [Concept('need','potřeba')|E].\n\nTo znamená, že všechny [Concept('buildings','budovy')|E] na trh mají uspokojeny své potřeby.\n\nTento přebytek lze vyvážet prostřednictvím [Concept('trade_routes','obchodních tras')|E] na jiné trhy." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_deficit: "Deficit trhu" # todo: NEW TRANSLATION
 game_concept_trade_deficits: "Deficity trhu" # todo: NEW TRANSLATION
 game_concept_deficit: "Deficit" # todo: NEW TRANSLATION
 game_concept_deficits: "Deficity" # todo: NEW TRANSLATION
 game_concept_trade_deficit_desc: "[Concept('trade_good','Obchodní zboží')|E] má na [Concept('market','trh')|E] deficit, pokud jsou [Concept('needs','potřeby')|E] vyšší než [Concept('production','produkce')|E] nebo dovoz.\n\nTo znamená, že některé [Concept('buildings','budovy')|E] na trh nebudou mít uspokojeny své potřeby.\n\nDovoz prostřednictvím [Concept('trade_routes','obchodních tras')|E] může pomoci $game_concept_deficit$ pokrýt." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_production: "Produkce" # todo: NEW TRANSLATION
 game_concept_productions: "Produkce" # todo: NEW TRANSLATION
 game_concept_trade_goods_production: "Produkce obchodních komodit" # todo: NEW TRANSLATION
 game_concept_produced: "Vyrobeno" # todo: NEW TRANSLATION
 game_concept_production_desc: "Produkce je množství [Concept('trade_good','obchodní zboží')|E], které každý měsíc vyprodukují [Concept('districts','čtvrti')|E] a jejich [Concept('buildings','budovy')|E].\n\nPokud $game_concept_production$ na [Concept('market','trh')|E] převyšuje jeho [Concept('needs','potřeb')|E] dané komodity, [Concept('surplus','přebytek')|E] je k dispozici pro [Concept('trade','obchod')|E]. Pokud je $game_concept_production$ nedostatečná, potřeby zůstanou neuspokojeny." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_potential_production: "Potenciální produkce" # todo: NEW TRANSLATION
 game_concept_potential_productions: "Potenciální produkce" # todo: NEW TRANSLATION
 game_concept_potential_production_desc: "Potenciální produkce každého [Concept('county_possessive','hrabství')|E] určuje, které surové [Concept('trade_goods','obchodní zboží')|E] lze vyrábět v [Concept('resource_district','zdrojové čtvrti')|E] v [Concept('county_capital','hlavním sídle hrabství')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_sell_price: "Prodejní cena" # todo: NEW TRANSLATION
 game_concept_sell_price_i: "@gold_icon!" # todo: NEW TRANSLATION
 game_concept_sell_prices: "Prodejní ceny" # todo: NEW TRANSLATION
 game_concept_sell_price_desc: "Prodejní cena na [Concept('market_possessive','trh')|E] je [Concept('gold','zlato')|E] hodnota [Concept('trade_good','obchodní zboží')|E], po které je na [Concept('need','potřeba')|E].\n\nVlastníci [Concept('profit_routes','výnosné trasy')|E] získávají prodejní cenu za obchodní zboží na trh, když jejich [Concept('route','trasa')|E] na tomto trhu prodává $game_concept_goods$, aby uspokojila $game_concept_market_possessive$ potřebám.\n\n[Concept('landed','Zeměpán')|E] [Concept('rulers','Vládci')|E] mají prospěch také z vysoké prodejní ceny, protože na trh přiláká více [Concept('merchants','kupci')|E], což zvyšuje příjem z [Concept('tolls','cel')|E] nebo pravděpodobnost uspokojení $game_concept_need$.\n\nCla se odvádějí z každé prodané zboží, čímž se skutečná prodejní cenou snižuje.\n\nStejně jako její protějšek [Concept('buy_price','nákupní cena')|E] roste s [Concept('market_prosperity','hospodářskou prosperitou trhu')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_buy_price: "Nákupní cena" # todo: NEW TRANSLATION
 game_concept_buy_price_i: "@gold_icon!" # todo: NEW TRANSLATION
 game_concept_buy_prices: "Nákupní ceny" # todo: NEW TRANSLATION
 game_concept_buy_price_desc: "Nákupní cena na [Concept('market_possessive','trh')|E] je cena v [Concept('gold','zlatu')|E] za [Concept('trade_good','obchodní zboží')|E], které je [Concept('surplus','přebytek')|E].\n\nVlastníci [Concept('profit_routes','výnosné trasy')|E] platí $game_concept_buy_price$ za obchodní zboží na trh, když jejich [Concept('route','trasa')|E] nakupuje $game_concept_goods$, které jsou tam v přebytku.\n\nStejně jako její protějšek [Concept('sell_price','prodejní cena')|E] roste s [Concept('market_prosperity','hospodářskou prosperitou trhu')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_monopoly: "Obchodní monopol" # todo: NEW TRANSLATION
 game_concept_monopoly_i: "@trade_monopoly!" # todo: NEW TRANSLATION
 game_concept_trade_monopolies: "Obchodní monopoly" # todo: NEW TRANSLATION
 game_concept_monopoly: "Monopol" # todo: NEW TRANSLATION
 game_concept_monopolies: "Monopoly" # todo: NEW TRANSLATION
 game_concept_trade_monopoly_desc: "Monopol umožňuje nakupovat a prodávat [Concept('goods','zboží')|E] na [Concept('market','trh')|E] pouze jeho vlastníkovi.\n\nMonopol může mít několik podob:\n #indent_newline:4    $EFFECT_LIST_BULLET$Běžný $game_concept_monopoly$ se vztahuje na jedinou [Concept('trade_category','kategorii zboží')|E], zatímco [Concept('complete_monopoly','úplný monopol')|E] se vztahuje na všechny.\n$EFFECT_LIST_BULLET$[Concept('exploitative_monopoly','Vykořisťovatelský monopol')|E] umožňuje vlastníkovi nakupovat $game_concept_goods$ z [Concept('production','produkce')|E], ještě než jsou uspokojeny [Concept('needs','potřeby')|E].\n$EFFECT_LIST_BULLET$Monopol může vlastnit [Concept('merchant','kupec')|E], [Concept('republic','republika')|E] nebo celá [Concept('trade_league','obchodní liga')|E].#!\n\nMonopoly lze získat prostřednictvím interakce $request_trade_monopoly_for_character_interaction|V$." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_complete_monopoly: "Úplný monopol" # todo: NEW TRANSLATION
 game_concept_complete_monopoly_i: "@trade_monopoly!" # todo: NEW TRANSLATION
 game_concept_complete_monopolies: "Úplné monopoly" # todo: NEW TRANSLATION
 game_concept_complete_monopoly_short: "Úplný" # todo: NEW TRANSLATION
 game_concept_complete_monopoly_desc: "Úplný monopol se najednou vztahuje na všechna [Concept('trade_good','obchodní zboží')|E] na [Concept('market','trh')|E]. Na rozdíl od běžného [Concept('monopoly','monopolu')|E] se neomezuje pouze na jednu [Concept('trade_category','kategorii zboží')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_exploitative_monopoly: "Vykořisťovatelský monopol" # todo: NEW TRANSLATION
 game_concept_exploitative_monopoly_i: "@trade_monopoly_exploitative!" # todo: NEW TRANSLATION
 game_concept_exploitative_monopolies: "Vykořisťovatelské monopoly" # todo: NEW TRANSLATION
 game_concept_exploitative_monopoly_short: "Vykořisťovatelský" # todo: NEW TRANSLATION
 game_concept_exploitative_monopoly_desc: "Vykořisťovatelský monopol je typ [Concept('monopoly','monopol')|E], který svému vlastníkovi umožňuje přímo nakupovat [Concept('production','produkce')|E] na [Concept('market','trh')|E].\n\nZa běžných okolností lze nakupovat pouze [Concept('surplus','přebytek')|E]. Vlastník $game_concept_exploitative_monopoly$ však může nakupovat $game_concept_production$ z [Concept('buildings','budov')|E] na trh ještě před uspokojením místních [Concept('building_needs','potřeb budovy')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_competitiveness: "Obchodní konkurenceschopnost" # todo: NEW TRANSLATION
 game_concept_trade_competitiveness_i: "@competitiveness_icon!" # todo: NEW TRANSLATION
 game_concept_competitiveness: "Konkurenceschopnost" # todo: NEW TRANSLATION
 game_concept_competitiveness_i: "@competitiveness_icon!" # todo: NEW TRANSLATION
 game_concept_trade_competitiveness_desc: "Každá [Concept('profit_route','výnosná trasa')|E] má svou konkurenceschopnosti: určuje, s jakou částí [Concept('trade_goods','obchodním zbožím')|E] na [Concept('market','trh')|E] může obchodovat, když soupeří s ostatními výnosnými trasami.\n\nČím větší podíl na celkové konkurenceschopnost pro určitou obchodní zboží máte, tím větší je váš [Concept('market_share','podíl na trhu')|E].\n\nPokud na trh existuje [Concept('monopoly','monopol')|E], svou konkurenceschopnost porovnávají pouze vlastníci tohoto monopolu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_competitive_pressure: "Konkurenční tlak" # todo: NEW TRANSLATION
 game_concept_competitive_pressure_i: "@competitive_pressure_icon!" # todo: NEW TRANSLATION
 game_concept_competitive_pressure_desc: "Konkurenční tlak představuje krátkodobou obchodní výhodu, kterou získá [Concept('merchant','kupec')|E]. Lze jej využít na jedinečná [Concept('decisions','rozhodnutí')|E] a [Concept('interactions','interakci')|E], která poskytují zvláštní výhody konkrétními [Concept('trade_routes','obchodními trasami')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_put_on_notice: "Dát na vědomí" # todo: NEW TRANSLATION
 game_concept_put_on_notice_desc: "Dát na vědomí je [Concept('character_interaction','interakce s postavou')|E], kterou zpřístupňuje [Concept('perk','talent')|E] [GetPerk('prepared_conscription_perk').GetName(GetPlayer)]. Spotřebuje [competitive_pressure_i][Concept('competitive_pressure','konkurenčního tlaku')|E] a zahájí konkurenční [Concept('trade_opportunity','obchodní příležitost')|E] proti [Concept('merchant','kupci')|E] na jednom z [Concept('trade_markets','obchodních trhů')|E] na vaší [Concept('trade_route','obchodní trasu')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_ruthless_oversight: "Nelítostný dohled" # todo: NEW TRANSLATION
 game_concept_ruthless_oversight_desc: "Nelítostný dohled je [Concept('character_interaction','interakce s postavou')|E], kterou zpřístupňuje [Concept('perk','talent')|E] [GetPerk('fear_tax_perk').GetName(GetPlayer)]. Může zvýšit [Concept('aptitude','způsobilost')|E] postavy v [Concept('court_position','dvorském úřadě')|E] za cenu [Concept('dread','hrůzu')|E], [Concept('opinion','mínění')|E] a [Concept('company_sentiment','směřování společnosti')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_request_merchant_charter: "Požádat o kupeckou listinu" # todo: NEW TRANSLATION
 game_concept_request_merchant_charter_desc: "Požádat o kupeckou listinu je [Concept('character_interaction','interakce s postavou')|E], která umožňuje [Concept('merchant','kupec')|E] požádat svého [Concept('merchant_patron','patrona')|E] o [Concept('charter','listinu')|E], jež mu poskytne zvláštní práva na místním [Concept('market','trhu')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_monopolize_trade: "Získat obchodní monopol" # todo: NEW TRANSLATION
 game_concept_monopolize_trade_i: "@trade_monopoly!" # todo: NEW TRANSLATION
 game_concept_monopolize_trade_desc: "Získat obchodní monopol je [Concept('character_interaction','interakce s postavou')|E], která [Concept('merchant','kupec')|E] umožňuje zaplatit [Concept('market_owner','vlastník trhu')|E] [Concept('gold','zlata')|E] výměnou za [Concept('trade_monopoly','obchodní monopol')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trader: "Obchodník" # todo: NEW TRANSLATION
 game_concept_traders: "Obchodníci" # todo: NEW TRANSLATION
 game_concept_trader_possessive: "Obchodníka" # todo: NEW TRANSLATION
 game_concept_traders_possessive: "Obchodníků" # todo: NEW TRANSLATION
 game_concept_trader_desc: "Obchodník je [Concept('character','postava')|E] pověřená dohledem nad [Concept('trade_route','obchodní trasou')|E].\n\nMusí jít o [Concept('associate','společníka')|E] nebo [Concept('courtier','dvořana')|E] vlastníka trasy a může dohlížet pouze na jednu trasu zároveň. [SelectLocalization( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_merchant' ), 'game_concept_trader_council_merchant', 'game_concept_trader_council' )]\n\nKaždý obchodník dostane za úkol zlepšit určitý aspekt trasy. Jeho [Concept('aptitude','způsobilosti')|E] pro daný úkol závisí na jeho [Concept('skills','dovednosti')|E].\n\nObchodníci při práci na trase podnikají osobní [Concept('schemes','intriky')|E] na každém [Concept('trade_market','obchodním trhu')|E]. Pokud intrika selže, získají [Concept('trait','rys')|E] [GetTrait('lifestyle_merchant').GetName( GetNullCharacter )], pokud jej ještě nemají. Pokud už tento rys mají, získají místo toho malé množství [Concept('trait_level_track_xp','zkušenosti rysu')|E] v náhodné [Concept('trait_level_track','cestě rysu')|E] rysu [GetTrait('lifestyle_merchant').GetNameNoTooltip( GetNullCharacter )] ($trait_track_caravaneer$, $trait_track_artisan$ nebo $trait_track_creditor$)." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trader_council: "Kromě [Concept('spouse','chotě')|E] vlastníka nemohou být zároveň členy [Concept('council','radu')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trader_council_merchant: "[Concept('spouse','Choť')|E] vlastníka a jeho [Concept('deputies','zástupců')|E] mohou být zároveň $game_concept_traders$, s výjimkou [GetCourtPositionType('partner_court_position').GetName()] a [GetCourtPositionType('travel_leader_court_position').GetName()]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_merchant: "Kupec" # todo: NEW TRANSLATION
 game_concept_merchants: "Kupci" # todo: NEW TRANSLATION
 game_concept_merchant_possessive: "Kupce" # todo: NEW TRANSLATION
 game_concept_merchants_possessive: "Kupců" # todo: NEW TRANSLATION
 game_concept_merchant_i: "@government_type_merchant!" # todo: NEW TRANSLATION
 game_concept_merchant_desc: "Kupec je [Concept('unlanded','bezzemek')|E] [Concept('character','postavy')|E], který se věnuje [Concept('trade','obchod')|E] v rámci [Concept('company','společnosti')|E].\n\nTito lidé usilují o naplnění [Concept('building_needs','potřeby budovy')|E] [Concept('trade_markets','obchodní trhy')|E], posilují ekonomiku ve snaze získat osobní bohatství a vyšší společenské postavení. Z těchto dvou cílů má [Concept('prestige','prestiže')|E] větší hodnotu než [Concept('gold','zlata')|E], protože kupcům umožňuje zlepšit jejich postavení u [Concept('merchant_patron','patrona')|E] a [Concept('associates','společníků')|E], rozšiřovat [Concept('trade_routes','obchodních tras')|E] a nakonec získat [Concept('trade_monopoly','obchodního monopolu')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_merchant_family: "Kupecká rodina" # todo: NEW TRANSLATION
 game_concept_merchant_families: "Kupecké rodiny" # todo: NEW TRANSLATION
 game_concept_merchant_family_possessive: "Kupecké rodiny" # todo: NEW TRANSLATION
 game_concept_merchant_family_desc: "Kupecké rodiny jsou [Concept('houses','rody')|E], které se věnují obchodu jako [Concept('merchants','kupci')|E] nebo [Concept('republicans','republikáni')|E]. Vlastní [Concept('company','společnost')|E], kterou ovládá a vlastní [Concept('house_head','hlavu rodu')|E], a jsou důležitou součástí [Concept('trade','obchodem')|E] a [Concept('prosperity','rozkvět')|E] panství." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_associate: "Společník" # todo: NEW TRANSLATION
 game_concept_associates: "Společníci" # todo: NEW TRANSLATION
 game_concept_associate_possessive: "Společníka" # todo: NEW TRANSLATION
 game_concept_associates_possessive: "Společníků" # todo: NEW TRANSLATION
 game_concept_associate_desc: "Společníci jsou [Concept('unlanded','bezzemek')|E] postavy náležející ke [Concept('company','společnosti')|E] [Concept('merchant','kupci')|E]. Plní podobné úkoly jako [Concept('courtiers','dvořané')|E] zeměpanského vládce a mohou spravovat [Concept('trade_routes','obchodní trasy')|E] jako [Concept('traders','obchodníci')|E] a stát se [Concept('deputies','zástupci')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_associate_i: "@courtier_icon!" # todo: NEW TRANSLATION
 game_concept_deputy: "Zástupce" # todo: NEW TRANSLATION
 game_concept_deputies: "Zástupci" # todo: NEW TRANSLATION
 game_concept_deputy_possessive: "Zástupce" # todo: NEW TRANSLATION
 game_concept_deputies_possessive: "Zástupců" # todo: NEW TRANSLATION
 game_concept_deputy_desc: "Zástupci plní různé úkoly pro [Concept('merchant_families','kupecké rodiny')|E] a jejich [Concept('companies','společnosti')|E]. Tyto role se podobají [Concept('court_positions','dvorskými úřady')|E], jsou svěřovány [Concept('associates','společníci')|E] [Concept('company','společnosti')|E] a jejich [Concept('aptitude','způsobilost')|E] určuje, jak úspěšně své úkoly plní." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_company: "Společnost" # todo: NEW TRANSLATION
 game_concept_companies: "Společnosti" # todo: NEW TRANSLATION
 game_concept_company_possessive: "Společnosti" # todo: NEW TRANSLATION
 game_concept_trade_company: "Obchodní společnost" # todo: NEW TRANSLATION
 game_concept_trade_companies: "Obchodní společnosti" # todo: NEW TRANSLATION
 game_concept_company_desc: "Obchodní společnosti slouží [Concept('merchant_family_possessive','kupecké rodiny')|E] jako základna, odkud začínají všechny jejich [Concept('trade_routes','obchodní trasy')|E].\n\nKaždá [GetGovernment( 'merchant_government' ).GetName] má [Concept('domicile','domicil')|E] obchodní společnosti. Pokud existuje [Concept('merchant_patron','patron')|E], [Concept('holding','država')|E] domicilu kupce se obvykle nachází v panství jeho [Concept('merchant_patron_possessive','patroně')|E].\n\n[Concept('company_buildings','Budovy společnosti')|E] jsou [Concept('domicile_buildings','budovách domicilu')|E] společnosti a přinášejí bonusy obchodu i všem, kdo jsou s ní spojeni. Společnost také poskytuje ubytování svým [Concept('associates','společníky')|E] a jejich rodinným příslušníkům i [Concept('knights','rytíři')|E], které lze najmout jako [Concept('deputies','zástupci')|E].\n\n#WEAK Stejně jako [Concept('courts','dvory')|E] zahrnují $game_concept_companies$ také několik bezejmenných [Concept('characters','postav')|E], kteří nejsou dost důležití na to, aby byli zobrazováni (je jich však méně).#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_company_building: "Budova společnosti" # todo: NEW TRANSLATION
 game_concept_company_buildings: "Budovy společnosti" # todo: NEW TRANSLATION
 game_concept_company_buildings_short: "Budovy" # todo: NEW TRANSLATION
 game_concept_company_building_desc: "Budovy společnosti jsou [Concept('domicile_buildings','budovy domicilu')|E] [Concept('company','společnosti')|E]. Zlepšují především [Concept('trade','obchod')|E], včetně [Concept('capacity','kapacita')|E], [Concept('route_length','délka trasy')|E], [Concept('max_trade_goods_short','obchodní komodity')|E] a [Concept('max_trade_markets_short','obchodní trhy')|E] na [Concept('trade_routes','obchodní trasy')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_usury: "Lichva" # todo: NEW TRANSLATION
 game_concept_usurer: "Lichvář" # todo: NEW TRANSLATION
 game_concept_usurers: "Lichváři" # todo: NEW TRANSLATION
 game_concept_usurer_possessive: "Lichváře" # todo: NEW TRANSLATION
 game_concept_usurers_possessive: "Lichvářů" # todo: NEW TRANSLATION
 game_concept_usurious: "Lichvářský" # todo: NEW TRANSLATION
 game_concept_interest: "Úrok" # todo: NEW TRANSLATION
 game_concept_usury_desc: "Lichva je [Concept('lending','půjčování')|E] [Concept('gold','zlata')|E] za úrok. Zda jde o poctivé podnikání, nebo o [Concept('sin','hřích')|E], určuje [Concept('doctrine','doktrína')|E] [Concept('rite','ritu')|E] [GetDoctrine('doctrine_usury_accepted').GetGroup.GetBaseNameNoTooltip].\n\nTam, kde je lichva odsuzována, ztrácí [Concept('merchant','kupec')|E] [Concept('piety','zbožnosti')|E] za každou [Concept('loan','půjčku')|E] poskytnutou prostřednictvím [Concept('interaction','interakce')|E] $loan_money_interaction|V$ a [Concept('company','společnost')|E] provozovaná za účelem $company_purpose_creditor|V$ svému vlastníkovi vynese trvalou pověst $game_concept_usurer$, jakmile vyjde najevo jeho úroku.\n\n#weak Některé $game_concept_rites$ zakazují půjčování za úrok pouze uvnitř vlastní [Concept('religion','náboženství')|E], takže jejich $game_concept_merchants$ mohou půjčovat všem ostatním.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_loan: "Půjčka" # todo: NEW TRANSLATION
 game_concept_loans: "Půjčky" # todo: NEW TRANSLATION
 game_concept_loan_possessive: "Půjčky" # todo: NEW TRANSLATION
 game_concept_loans_possessive: "Půjček" # todo: NEW TRANSLATION
 game_concept_loaned: "Půjčený" # todo: NEW TRANSLATION
 game_concept_lending: "Půjčování" # todo: NEW TRANSLATION
 game_concept_loan_desc: "Půjčka je částka [Concept('gold_i','@gold_icon!')|E][Concept('gold','zlata')|E] poskytnutá s očekáváním, že bude splacena, ať už s úrokem, nebo bez něj.\n\nPůjčky si obvykle bere [Concept('ruler','vládce')|E], který se ocitl v [Concept('debt','dluhu')|E] nebo potřebuje další prostředky na [Concept('war','válku')|E] či jiné výdaje.\n\nPůjčky mohou být poskytnuty s otevřeně přiznaným úroku, se skrytým úrokem nebo bez úroku; různé [Concept('faiths','víry')|E] mají na [Concept('usury','lichvu')|E] různé názory.\n\n$loan_inheritance_hint$\n\n$loan_repayment_help$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 loan_inheritance_hint: "#help Půjčka může přežít i ty, kdo se na ní dohodli: když jedna ze stran zemře, přejde na jejího [Concept('heir','dědice')|E], pokud nějakého má#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 loan_repayment_help: "#help Půjčky může [Concept('debtor','dlužník')|E] splatit pomocí [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('repay_loan_decision').GetName] a [Concept('creditor','věřitele')|E] může její splacení požadovat prostřednictvím [Concept('interaction','interakce')|E] #V $demand_repayment_interaction$#! po uplynutí alespoň #V 2#! let.\n\n[Concept('merchants','Kupci')|E] s [Concept('company_purpose','zaměřením společnosti')|E] [GetLaw('company_purpose_creditor').GetName] mohou také postupně vymáhat [Concept('loans','půjčky')|E], pokud zaměstnají [GetCourtPositionType( 'bailiff_court_position' ).GetName()] a využijí [Concept('court_position_task','úkol dvorského úřadu')|E] #V $bailiff_collect_loans$#!#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
