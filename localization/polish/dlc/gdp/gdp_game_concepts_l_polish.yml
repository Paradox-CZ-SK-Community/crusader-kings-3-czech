 game_concept_seize_realm_cb: "Zmocnit se panství" # todo: NEW TRANSLATION
 game_concept_seize_realm_cb_desc: "[Concept('casus_belli','Casus belli')|E], který umožňuje [Concept('merchant','kupec')|E] založit [Concept('republic','republika')|E] a stát se zeměpánem. Útočník může použít [Concept('interaction','interakce')|E] #V $gdp_merchant_seize_realm_call_debtor_interaction$#! k utracení @unspent_strong_hook_icon! [Concept('strong_hooks','silným pákám')|E] #weak ($strong_indebted_hook$ nebo $strong_loan_hook$)#! a přinutit [Concept('independent','nezávislý')|E] [Concept('rulers','vládců')|E], aby se k této [Concept('war','válce')|E] připojili jako [Concept('allies','spojenci')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_company_purpose: "Zaměření společnosti" # todo: NEW TRANSLATION
 game_concept_company_purposes: "Zaměření společnosti" # todo: NEW TRANSLATION
 game_concept_company_purpose_desc: "Zaměření společnosti určují zaměření [Concept('company','společnost')|E] a její [Concept('merchant_family','kupecká rodina')|E].\n\nSpolečnost se může soustředit na půjčování peněz, spolehlivost rodiny, kvalitu a vzácnost svého zboží nebo dosah své sítě, která překonává vzdálenosti i kulturní rozdíly.\n\nRůzná zaměření poskytují jedinečné [Concept('interactions','interakce')|E], pozice [Concept('deputy','zástupce')|E] a bonusy k [Concept('trade','obchodu')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_acumen: "Obchodní důvtip" # todo: NEW TRANSLATION
 game_concept_trade_acumen_i: "@trade_acumen!" # todo: NEW TRANSLATION
 game_concept_acumen: "Důvtip" # todo: NEW TRANSLATION
 game_concept_trade_acumen_desc: "Důvtip představuje celkové množství [Concept('gold','zlato')|E], které [Concept('company','společnost')|E] [Concept('merchant','kupce')|E] nashromáždila prostřednictvím [Concept('trade','obchodu')|E] napříč všemi [Concept('trade_categories','kategorií zboží')|E].\n\nDůvtip se používá k odemknutí různých [Concept('company_sizes','velikostem společností')|E] a nelze jej utratit." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_company_size: "Velikost společnosti" # todo: NEW TRANSLATION
 game_concept_company_sizes: "Velikosti společností" # todo: NEW TRANSLATION
 game_concept_company_size_desc: "Velikost společnosti představuje nadvládu [Concept('merchant_family_possessive','kupecké rodiny')|E] v [Concept('trade','obchodě')|E]; každá úroveň výrazně zvyšuje její [Concept('competitiveness','konkurenceschopnost')|E] a obchodní schopnosti. Postup na vyšší velikost vyžaduje nashromáždění [Concept('acumen','důvtip')|E].\n\nExistují čtyři velikosti: [GetLaw('company_size_small').GetName], [GetLaw('company_size_medium').GetName], [GetLaw('company_size_large').GetName] a [GetLaw('company_size_huge').GetName]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_contract: "Obchodní smlouva" # todo: NEW TRANSLATION
 game_concept_trade_contract_i: "@government_type_merchant!" # todo: NEW TRANSLATION
 game_concept_trade_contracts: "Obchodní smlouvy" # todo: NEW TRANSLATION
