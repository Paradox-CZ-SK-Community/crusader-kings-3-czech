 game_concept_trade_contracts_possessive: "Obchodních smluv" # todo: NEW TRANSLATION
 game_concept_trade_contract_desc: "Obchodní smlouvy umožňují [Concept('merchant','kupec')|E] [Concept('companies','společností')|E] ovlivňovat své [Concept('trade_routes','obchodní trasy')|E] nebo hledat cenné bohatství v dalekých krajích.\n\nPrvní z nich se nazývají [Concept('trade_opportunities','obchodními příležitostmi')|E], druhé pak [Concept('luxury_contracts','smlouvy na luxusní zboží')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_trade_contract_tier: "Úroveň obchodní smlouvy" # todo: NEW TRANSLATION
 game_concept_trade_contract_tier_i: "@task_contract_tier_icon!" # todo: NEW TRANSLATION
 game_concept_trade_contract_tier_tier: "Úroveň" # todo: NEW TRANSLATION
 game_concept_trade_contract_tier_desc: "Každá [Concept('trade_contract','obchodní smlouva')|E] má svou úrovně, která určuje obtížnost i odměnu za obchodní smlouvu. Obvykle závisí na [Concept('prosperity','rozkvět')|E] daného místa." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_luxury_contract: "Smlouva na luxusní zboží" # todo: NEW TRANSLATION
 game_concept_luxury_contract_i: "@luxury_contract!" # todo: NEW TRANSLATION
 game_concept_luxury_contracts: "Smlouvy na luxusní zboží" # todo: NEW TRANSLATION
 game_concept_luxury_contract_possessive: "Smlouvy na luxusní zboží" # todo: NEW TRANSLATION
 game_concept_luxury_contracts_possessive: "Smluv na luxusní zboží" # todo: NEW TRANSLATION
 game_concept_luxury_contract_desc: "Smlouvy na luxusní zboží vyžadují, aby [Concept('merchant','kupec')|E] [Concept('companies','společností')|E] [Concept('travel','cestování')|E] na vzdálené místo a pokusily se získat [Concept('domicile_artifact','artefakt domicilu')|E].\n\nTyto smlouvy se mohou každý rok objevit kupcům se zaměřením [Concept('company_purpose','zaměřením společnosti')|E] Kupec karavan a lze je získat prostřednictvím [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('gdp_visit_holding_decision').GetName]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
