 game_concept_trade_opportunity_tier_desc: "Úroveň obchodní příležitosti odráží [Concept('prosperity','rozkvět')|E] místa, kde je zakázka zadána.\n\nČím vyšší je $game_concept_trade_opportunity_tier$, tím vyšší je odměna — obvykle však také obtížnost úkolu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
