 game_concept_patron_contracts_possessive: "Zakázek patronů" # todo: NEW TRANSLATION
 game_concept_patron_contract_desc: "Zakázky patronů vyžadují, aby [Concept('merchant','kupec')|E] [Concept('companies','společností')|E] úspěšně provedly [Concept('scheme','intrika')|E] proti svému [Concept('merchant_patron','patronovi')|E].\n\nObvykle se zaměřují na [Concept('diplomacy','diplomacii')|E] a mají naplnit patronova přání (jako vyřešit spor o trh), nebo ho přimět podřídit se vůli obchodníka (jako vytlačit konkurenční obchodní rod).\n\nPokud $game_concept_scheme$ z jakéhokoli důvodu selže nebo je opuštěna, selže také $game_concept_patron_contract$." # todo: NEW TRANSLATION # todo: CONCEPT CASE
