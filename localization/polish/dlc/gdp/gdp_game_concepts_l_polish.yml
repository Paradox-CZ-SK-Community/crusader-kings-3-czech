 game_concept_client_merchant_desc: "Závislý kupec je [Concept('merchant','kupec')|E] [Concept('character','postavy')|E]. Vlastní [Concept('company','společnost')|E] v [Concept('realm','panství')|E] [Concept('landed','zeměpánovi')|E] [Concept('ruler','vládci')|E], který se stává jeho [Concept('merchant_patron','patronem')|E].\n\nZávislý kupec poskytuje svému patronovi část příjmů z [Concept('trade','obchodu')|E]. Nemůže se přidat k válce ani k [Concept('faction','frakcím')|E] namířené proti svému patronovi a nemůže se osamostatnit, pokud nepřesune svou společnost jinam." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 game_concept_merchant_tributary_client: "Klient" # todo: NEW TRANSLATION # todo: CONCEPT CASE
