l_polish:
 guelphs_ghibellines_prefix: "Guelfové a Ghibellini:" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.0500.t: "Guelfové a Ghibellini" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.0500.intro.all: "Podezíravý pohled, pohrdavé odfrknutí — konflikt mezi [pope_scope.Custom('CZ_TitledFirstName_I')] a [ghibelline_leader.Custom('CZ_TitledFirstName_I')] vytvořil stále větší rozkol v kdysi tak úzce spjatých komunitách severní Itálie.\n\nTi, kdo podporují ghibelliny [ghibelline_leader.Custom('CZ_TitledFirstName_G')] kvůli imperialismu a ochraně, stojí proti těm, kdo usilují o větší nezávislost podporou guelfů papežství." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [ghibelline_leader.GetTitleAsName]; navyše [ghibelline_leader.GetTitledFirstName]
 gdp_guelph_ghibelline.0500.desc.guelph_leader: "Podezíravý pohled, pohrdavé odfrknutí — tento absurdní konflikt mezi odpadlíkem [ghibelline_leader.GetTitleAsName] a mými zbožnými úředníky bohužel vytvořil stále větší rozkol v kdysi tak úzce spjatých komunitách severní Itálie.\n\nTi, kdo podporují imperialistické ghibelliny kvůli bezpečí a ochraně, stojí proti mým bohabojným guelfům, kteří pouze hájí svou svrchovanost tváří v tvář tomuto tyranovi.\n\nSpolečně přimějeme [ghibelline_leader.GetTitleAsName], aby [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')] k rozumu. Je čas, abych uplatnil svou [ROOT.Char.Custom('GetHighestSkillAdjective')]." # todo: NEW TRANSLATION # todo: GENDER FORM ROOT.Char - over, ci ROOT je postava, ktorej sa text tyka
 gdp_guelph_ghibelline.0500.desc.ghibelline_leader: "Podezíravý pohled, pohrdavé odfrknutí — tento absurdní konflikt mezi hlupáky v papežství a mnou údajně vytvořil stále větší rozkol v kdysi tak úzce spjatých komunitách severní Itálie.\n\nTi, kdo podporují #EMP mé#! ghibelliny kvůli bezpečí a ochraně, stojí proti těm, kdo si podporou naivních guelfů papežství přejí nejistotu a křehkou nezávislost.\n\nJako [ghibelline_leader.GetTitleAsNameNoTooltip] začínám být těmito církevními guelfskými intrikány ostražitý. Dost dlouho podkopávali mou autoritu a srovnají krok — tak či onak..." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.0500.desc.guelph_member: "\n\nPožehnej nám, aby náš svědomitý vůdce [guelph_leader.GetFirstNameNoTooltip] promluvil naším jménem a chopil se boje proti našemu imperialistickému utlačovateli. A já přiložím ruku k dílu." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.0500.desc.ghibelline_member: "\n\nChápu to tak, že náš [ghibelline_leader.GetTitleAsNameNoTooltip] je jediný, kdo skutečně brání náš lid a naše panství před těmi, kdo nám chtějí ublížit. Na oplátku budu [Select_CString(ghibelline_leader.IsFemale,'její','jeho')] ghibelliny plně podporovat." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.0500.desc.unaligned: "\n\nProtože jsem si zatím nevybral, komu budu věrný, musím znepřátelené strany pečlivě zvážit, abych jednal v nejlepším zájmu rodu [ROOT.Char.GetHouse.GetBaseName]." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.0500.a: "Vpřed!" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.1000.opening: "[gg_leader.Custom2('AppropriateGreetingPositive', ROOT.Char )]" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.1000.desc: "Dozvěděl jsem se, že jste neúnavně šířil a posiloval mocenské postavení [ROOT.Char.Custom('GetGuelphGhibellinePossessive')] v tomto znepokojivém konfliktu.\n\nZa to vám patří má nehynoucí vděčnost." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.1000.a: "Jsem vám zavázán." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.5000.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor )]" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.5000.desc: "K vašim zchátralým [actor.Custom('GetGuelphsGhibellines')] se jen tak nepřipojím." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.5000.a: "Velmi nerozvážné." # todo: NEW TRANSLATION
 gg_recruit_partisan_interaction_cooldown_tt: "[CZProDrop(actor,'nebude moci','nebude moci')|U] několik let nebude moci požádat [recipient.Custom('CZ_ShortUIName_A')], aby se připojil k [actor.Custom('GetGuelphsGhibellines')]" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.6500.t: "$guelphs_ghibellines_prefix$ Wormský konkordát" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.6500.desc: "Tento konflikt už trvá dost dlouho. Po dlouhém přemítání mi moji písaři předkládají písemnou dohodu:\n\nVliv [ghibelline_leader.GetTitleAsNamePossessive|U] na církevní jmenování by byl omezen, ale [ghibelline_leader.GetHerHim] by bylo dovoleno znovu dohlížet na volby a rozhodovat o sporných výsledcích.\n\nŠkrábu se na bradě a pečlivě přemýšlím, jaký to bude mít dopad na nás všechny." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.6500.a: "Tudy vede cesta vpřed." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.6500.b: "Moc papežství je #EMP nejvyšší#!!" # todo: NEW TRANSLATION
 concordat_of_worms_fulfilled.t: "Wormský konkordát naplněn" # todo: NEW TRANSLATION
 concordat_of_worms_abandoned.t: "Wormský konkordát opuštěn" # todo: NEW TRANSLATION
 hre_decides_the_outcome.tt: "[GetTitleByKey('e_hre').GetHolder.GetShortUIName] rozhodne, zda dohodu přijmout" # todo: NEW TRANSLATION
 cow_phase_moves_to_agitation.tt: "[GetSituation('guelph_ghibelline').GetName] opouští fázi předehry a přechází do fáze [GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName]" # todo: NEW TRANSLATION
 cow_phase_moves_to_repose.tt: "[GetSituation('guelph_ghibelline').GetName] opouští fázi předehry a přechází do fáze [GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName]" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.6505.opening: "[guelph_leader.Custom2('AppropriateGreeting', ROOT.Char )]" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.6505.desc: "Odložme na chvíli naše rozpory a dohodněme se na správném způsobu správy vašich církevních jmenování.\n\nNa oplátku se [ROOT.Char.GetTitleAsNameNoTooltip|U] může účastnit voleb a řešit sporné výsledky." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.6505.a: "To snad bude stačit..." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.6505.b: "To je nepřijatelné!" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.7000.t: "$guelphs_ghibellines_prefix$ $lombard_league_name$" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.7000.desc: "Když se rozšířila zpráva, že [hre_kaiser.GetTitleAsName] upírá [Select_CString(hre_kaiser.IsFemale,'její','jeho')] zrak na severní Itálii a hodlá v oblasti centralizovat a posílit [hre_kaiser.GetHerHis] moc, vrátili se ke mně poslové:" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.7000.desc.all: "\n\nNa mou žádost se k Lombardské lize připojili všichni oslovení.\n\nNyní jsme dost silní, abychom odolali jakémukoli náhlému kroku, který by [hre_kaiser.GetTitleAsName] podnikl... !" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.7000.desc.more_than_half: "\n\nNa mou žádost se k Lombardské lize připojila více než polovina oslovených.\n\nTo by nám mělo umožnit odolat [hre_kaiser.GetTitleAsName] a snad se nám dostane další pomoci od našich svatých přátel..." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.7000.desc.less_than_half: "\n\nK Lombardské lize se připojilo jen několik oslovených, což mě nepochybně znepokojuje.\n\n#EMP Nevadí!#! S trochou svaté pomoci bychom měli být schopni bránit naši nově nabytou nezávislost." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.7000.a: "Je čas na změnu!" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.7000.b: "Naše chvíle právě nastala!" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.7005.t: "$guelphs_ghibellines_prefix$ Připojit se k $lombard_league_name$?" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.7005.desc: "Zdá se, že [league_creator.GetTitledFirstName] je nakonec čestný [league_creator.GetWomanMan].\n\nDoneslo se ke mně, že [league_creator.GetSheHe] založil [lombard_league_conf.GetName], iniciativu, která má zastavit postup [hre_kaiser.GetTitleAsName].\n\nZdá se to jako rozumná iniciativa, pokud se chce někdo vymanit z okovů říše..." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.7005.a: "$gdp_guelph_ghibelline.7000.a$" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.7005.b: "$gdp_guelph_ghibelline.7000.b$" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.7005.c: "Nebuďme tak zbrklí..." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.7010.t: "$guelphs_ghibellines_prefix$ $lombard_league_name$" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.7010.desc: "Moji poslové mi sdělují, že ten svárlivý [ROOT.Char.Custom2( 'InsultNoun', SCOPE.sC('league_creator' ))] #EMP [league_creator.GetTitledFirstName]#! není spokojený se stavem věcí v [league_creator.GetCapitalLocation.GetTitle.GetNameNoTier] a že ten proradný [ROOT.Char.Custom2( 'InsultNoun', SCOPE.sC('league_creator' ))] přesvědčil další slabomyslné ovce, aby se k [league_creator.GetHerHim] přidaly!\n\nCo je to vůbec ta #EMP Lombardská liga#!?!" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.7010.a: "Jejich drzost nesmí zůstat nepotrestána!" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.7010.b: "Mám na mušce jiné věci." # todo: NEW TRANSLATION
 league_creator_created_lombard_league.tt: "[league_creator.GetShortUIName] založil [league_creator.GetConfederation.GetName] #weak (nyní #V [lombard_league_conf.GetMemberCount]#! členů)#!" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.7015.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor )]" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.7015.desc: "Obávám se, že se Lombardská liga obejde bez vašich #EMP velkorysých#! příspěvků." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.7015.a: "Hmmm." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.8500.t: "$guelphs_ghibellines_prefix$ Dosaženo kompromisu" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.8500.desc: "Když se [guelph_leader.GetName] a [ghibelline_leader.GetName], dva zástupci guelfů a ghibellinů, scházejí k podpisu smlouvy, ozve se z publika šum.\n\nNěkteří jsou radostní, jiní naopak rozrušení představou kompromisu, který je nutí vzdát se svých pevně zastávaných přesvědčení o vlastní pravdě.\n\nPoté se rozproudí tlumené rozhovory a dav se rozchází, aby se zapojil do obvyklých příprav večeře." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.8500.a: "Konečně je po všem." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.8510.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.8510.desc: "Vidím, že jste stále nepochopili, v čem chybujete. Proč bychom měli přistupovat na tak rozsáhlé ústupky, když vy [actor.Custom('GetGuelphsGhibellines')] se očividně mýlíte?\n\nBavilo by mě to, kdyby to nebylo tak nestoudné." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.8510.a: "Ta drzost!" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.8510.tt: "[recipient.GetShortUIName|U] odmítl váš návrh ukončit [GetSituation('guelph_ghibelline').GetName] [Concept('situation','situace')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_guelph_ghibelline.8520.t: "$gdp_guelph_ghibelline.8500.t$" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.8520.desc: "Dohoda byla ukázkou diplomacie, o tom není pochyb.\n\n[guelph_leader.GetName] i [ghibelline_leader.GetName] přistoupili na kompromis, dosáhli drobných vítězství, ale ztratili lidové mínění.\n\nUzavřít smlouvu, která obstojí ve zkoušce času, není maličkost. Uvidíme, kolik z nás dokáže nechat minulost minulostí a hledět vpřed, vstříc zářivější budoucnosti." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.8520.a: "Snad je to tak nejlepší." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.9000.t: "$guelphs_ghibellines_prefix$ Vítězství [ROOT.Char.Custom('GetGuelphGhibelline')]" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.9000.desc.guelph: "Je rozhodnuto. Obhájili jsme práva toho nejsvětějšího — nejvyšší autoritu, která papeži umožňuje chránit a do budoucna volit naše posvátné pastýře.\n\nA také omezit vliv [GetTitleByKey('e_hre').GetName], jehož ambice nás nakonec všechny ohrožují.\n\nTy #EMP zbloudilé#! ghibellinské duše ani netušily, co je zasáhlo." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.9000.desc.ghibelline: "Konečně jsme dokázali své svrchované právo vládnout říši tak, jak to zamýšlel [ROOT.Char.GetFaith.HighGodName] — pevnou rukou a rozumem.\n\nJak by ostatně mohl sesazený svatý prostředník rozhodovat o tom, kdo má nejlépe vládnout zemím [GetTitleByKey('e_hre').GetName]?\n\nTi guelfové podporující papeže se mohou starat o naše duše a my se postaráme o to, na čem #EMP skutečně#! záleží." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.9000.a: "Myslím, že je důvod k oslavám." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.9010.t: "$gdp_guelph_ghibelline.9000.t$" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.9010.t.defeat: "$guelphs_ghibellines_prefix$ Porážka [ROOT.Char.Custom('GetGuelphGhibelline')]" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.9010.desc.win: "Znovu a znovu získáváme podporu lidu tváří v tvář slabé opozici [ROOT.Char.Custom('GuelphGhibellineGetOpposite')].\n\nNáš významný vůdce [victorious_leader.GetTitledFirstName] i nezávislí zákonodárci prohlásili, že [ROOT.Char.Custom('GetGuelphsGhibellines')] mají pravdu, a tím jednou provždy urovnali tuto vleklou #EMP situaci#!.\n\nKonečně do této části světa přichází rozum!" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.9010.desc.lose: "Naše podpora slábne, to je fakt.\n\nMoc ani vliv [ROOT.Char.Custom('GetGuelphsGhibellines')] nedosahují tak daleko, jak by měly a jak potřebují, a ti pomatení vládci [ROOT.Char.Custom('GuelphGhibellineGetOpposite')] si zajistili podporu zdrcujícího počtu #EMP nezávislých#! zákonodárců.\n\nJe čas, aby [ROOT.Char.Custom('GetGuelphsGhibellines')] tento boj vzdali a zaměřili se na dosažitelnější cíle." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.9010.a.win: "Vychutnejme si tento okamžik." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline.9010.a.lose: "Ti #EMP hadi#!!" # todo: NEW TRANSLATION
