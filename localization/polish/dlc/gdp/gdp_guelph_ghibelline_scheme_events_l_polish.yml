 gdp_guelph_ghibelline_scheme.1000.t: "[scheme.GetNameNoTooltip]: Co je ztraceno" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1000.desc: "Ocitl jsem se na každoročním jarmarku v [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], kde je radost a soudržnost přímo hmatatelná.\n\nUlice jsou plné hluku bujarých oslav, pestrobarevných ozdob z látek a vůně lahodných pokrmů z [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetAdjectiveNoTooltip] — pastva pro mé unavené smysly.\n\nNáhodou tu narazím na [target.GetTitledFirstName], který si se zájmem prohlíží zboží v nedalekém stánku na trhu, a spatřím příležitost využít svého šarmu." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1000.a: "„Víte, že #EMP [ROOT.Char.Custom('GuelphsGhibellinesGetOpposite')]#! se tyto oslavy pokusili zakázat.“" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1000.t.success: "$board_games.0001.tt.success$" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1000.t.failure: "$board_games.0001.tt.failure$" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1000.a.desc.success: "Úspěšně poukážeš na zlou vůli [ROOT.Char.Custom('GuelphsGhibellinesGetOpposite')]" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1000.a.desc.failure: "[target.Custom('CZ_ShortUIName_A')] tě odbude" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1000.b: "„Tenhle odznak by ti dokonale slušel, příteli!“" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1000.c: "Nemusím zasahovat." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1010.t: "[scheme.GetNameNoTooltip]: Povídá se..." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1010.desc: "Moji informátoři mi sdělují, že [target.GetTitledFirstName], náš #EMP vážený#! vůdce [ROOT.Char.Custom('GetGuelphGhibelline')], působí v poslední době poněkud přetíženě a pod tíhou [Select_CString(target.IsFemale,'jejích','jeho')] náročných povinností se hroutí.\n\nNěkolik dobře mířených dopisů našim stoupencům by mohlo tento dojem upevnit a naznačit, že se této zátěže může ujmout někdo mnohem #EMP schopnější#!." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1010.a: "Nechte ty dopisy hned sepsat." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1010.a.tt: "Šance na úspěch je ovlivněna tvým @gg_involvement_icon! [Concept('gg_involvement','zapojením')|E] (#V [THIS.Char.MakeScope.Var('gg_involvement').GetValue]#!)" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_guelph_ghibelline_scheme.1010.t.success: "$board_games.0001.tt.success$" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1010.t.failure: "$board_games.0001.tt.failure$" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1010.a.desc.success: "Tvými dopisy přesvědčíš mnoho členů [ROOT.Char.Custom('GetGuelphsGhibellines')], že jsi lepším vůdcem" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1010.a.desc.failure: "Tvé dopisy tvé věci spíše uškodí, než prospějí" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1010.b: "Skvělým vůdcem by byl kdokoli z rodu [ROOT.Char.GetHouse.GetName]!" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1010.c: "Kdo může říct, jestli je to vůbec pravda?" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1020.t: "[scheme.GetNameNoTooltip]: Stříbrný jazyk" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1020.intro.replace_ruler: "Zdá se, že můj spojenec, [court_agent.GetTitledFirstName], si získal pozornost skupiny zahořklých dvořanů a odpůrců u dvora [target.Custom('CZ_TitledFirstName_G')]." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1020.intro.claim_leadership: "Zdá se, že můj spojenec, [court_agent.GetTitledFirstName], [Select_CString(court_agent.IsFemale,'našla','našel')] pochopení u členů [target.Custom('GetGuelphsGhibellines')], kteří nejsou spokojeni s vedením [target.Custom('CZ_TitledFirstName_G')]." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1020.intro: "Zdá se, že můj spojenec, [court_agent.GetTitledFirstName], si získal pozornost [target.GetTitledFirstName]." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1020.segway: "\n\nMěl bych už konečně odpovědět na poslední dopis od [court_agent.GetTitledFirstNameNoTooltip]; mám" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1020.outro.replace_ruler: "spolupracovat s těmito místními buřiči, abychom posunuli naše plány kupředu?" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1020.outro.promote_character: "nechat [court_agent.GetHerHim] podnítit jejich pochybnosti o [target.Custom('CZ_TitledFirstName_L')]?" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [target.GetFirstName]; navyše [target.GetTitledFirstName]
 gdp_guelph_ghibelline_scheme.1020.outro.promote_scheme: "využít této příležitosti a nechat [court_agent.GetHerHim] obhajovat [ROOT.Char.Custom('GetGuelphsGhibellines')] před [target.Custom('CZ_TitledFirstName_I')]?" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [target.GetTitleAsName]; navyše [target.GetTitledFirstName]
 gdp_guelph_ghibelline_scheme.1020.a: "Raději vsaďme na mé úsilí." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1020.b: "Využijme tyhle... ničemy." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1020.c: "[court_agent.GetTitledFirstNameNoTooltip] by si měl zasloužit [Select_CString(court_agent.IsFemale,'její','jeho')] živobytí." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1020.t.success: "$board_games.0001.tt.success$" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1020.t.failure: "$board_games.0001.tt.failure$" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1020.c.desc.success: "[court_agent.Custom('CZ_ShortUIName_G')] úspěšně posune tvé plány kupředu" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1020.c.desc.failure: "[court_agent.Custom('CZ_ShortUIName_G')] příliš přesvědčivý není" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1020.d: "[court_agent.GetSheHe|U] by se měl zaměřit na mou pověst." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1020.prestige: "Pošramocená prestiž" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1020.prestige.desc: "Tvoje prestiž utrpěla menší újmu." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1020.piety: "Pošramocená zbožnost" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1020.piety.desc: "Tvoje zbožnost utrpěla menší újmu." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1020.e: "Má zbožnost mluví sama za sebe!" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1020.f: "Neměl bych do toho zasahovat." # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1030.t: "[scheme.GetNameNoTooltip]: Mazání koleček" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1030.desc: "Jednoho rána, když obcházím své panství, ke mně přiběhne můj dlouholetý služebník:\n\n„Můj [ROOT.Char.GetTitleAsNameNoTooltip], naši informátoři u dvora [target.Custom('CZ_TitledFirstName_G')] hlásí, že [ROOT.Char.Custom('DescribeTargetSkill')] toho [target.GetTitleAsNameNoTooltip] je přinejlepším k smíchu.\n\nMožná bychom toho mohli nějak využít ve svůj prospěch...?„" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1030.desc.sly_character: "Jednoho rána, když obcházím své panství, ke mně nenápadně přistoupí můj [ROOT.Char.Custom2('RelationToMe', sly_character )], [sly_character.GetTitledFirstName]:\n\n„V rámci našeho úsilí #EMP zachránit#! [target.GetPrimaryTitle.GetDefinitiveName] před pošetilými [target.Custom('GetGuelphsGhibellines')] bychom mohli zpochybnit [ROOT.Char.Custom('DescribeTargetSkill')] toho [target.GetTitledFirstName].\n\nPodle toho, co jsem slyšel, [target.GetSheHe] v tomto ohledu příliš nevyniká.„" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1030.a: "„Úsilí musí převážit nad pomluvami.“" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1030.a.tt: "Šance na úspěch je ovlivněna tvým @gg_involvement_icon! [Concept('gg_involvement','zapojením')|E] (#V [THIS.Char.MakeScope.Var('gg_involvement').GetValue]#!)" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_guelph_ghibelline_scheme.1030.t.success: "$board_games.0001.tt.success$" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1030.t.failure: "$board_games.0001.tt.failure$" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1030.b.desc.success: "Úspěšně podkopeš postavení [target.Custom('CZ_ShortUIName_G')]" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1030.b.desc.failure: "Tvé úsilí přijde vniveč" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1030.b: "„Měli bychom toho využít a podkopat [target.GetHerHim] u [Select_CString(target.IsFemale,'jejího','jeho')] dvora.“" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1030.c: "„Pojďme tyhle zvěsti šířit.“" # todo: NEW TRANSLATION
 gdp_guelph_ghibelline_scheme.1030.d: "„Nemyslím, že bychom to měli dělat.“" # todo: NEW TRANSLATION
 scheme_critical_moments.1262.t: "[scheme.GetNameNoTooltip]: Úspěch" # todo: NEW TRANSLATION
 scheme_critical_moments.1262.desc: "Velký úspěch! [target.GetTitledFirstName|U] konečně pochopil a nyní stojí po našem boku jako skutečný [owner.Custom('GetGuelphGhibelline')].\n\nVěděl jsem, že [target.GetSheHe] nakonec změní názor." # todo: NEW TRANSLATION
 scheme_critical_moments.1262.a: "Výborně!" # todo: NEW TRANSLATION
 scheme_critical_moments.1263.t: "[scheme.GetNameNoTooltip]: Neúspěch" # todo: NEW TRANSLATION
 scheme_critical_moments.1263.desc: "#EMP Někteří lidé.#! K naší společné frustraci [target.Custom('CZ_TitledFirstName_A')] navzdory všem mým snahám o domluvu, debatování a přemlouvání [target.GetSheHe] trvá na tom, že [target.Custom('GetGuelphsGhibellines')] má pravdu.\n\nNetřeba dodávat, že tentokrát jsme se #EMP nerozešli#! v přátelském duchu." # todo: NEW TRANSLATION
 scheme_critical_moments.1263.a: "#EMP [owner.Custom('InsultNounDumb')]#!!" # todo: NEW TRANSLATION
 scheme_critical_moments.1272.t: "[scheme.GetNameNoTooltip]: Úspěch" # todo: NEW TRANSLATION
 scheme_critical_moments.1272.desc: "Je důvod k oslavám! Jeden po druhém přestávají [owner.Custom('GetGuelphsGhibellines')] podporovat [target.GetTitledFirstName] a místo toho hledají vedení u mě.\n\n[target.GetSheHe|U] nemá na výběr a musí odstoupit." # todo: NEW TRANSLATION
 scheme_critical_moments.1272.a: "Skvělé!" # todo: NEW TRANSLATION
 scheme_critical_moments.1273.t: "[scheme.GetNameNoTooltip]: Neúspěch" # todo: NEW TRANSLATION
 scheme_critical_moments.1273.desc: "Navzdory našemu úsilí zůstává [target.GetTitledFirstName] neochvějným vůdcem [owner.Custom('GetGuelphsGhibellines')] a podpora, kterou se mi podařilo získat, uvadla a zmizela." # todo: NEW TRANSLATION
 scheme_critical_moments.1273.desc.secret: "\n\nAlespoň [target.GetSheHe] stále nic netuší o mých plánech." # todo: NEW TRANSLATION
 scheme_critical_moments.1273.desc.discovered: "\n\nA co hůř, [target.GetSheHe] ví, že jsem za tím stál, a [target.GetSheHe] na to nejspíš nezapomene." # todo: NEW TRANSLATION
 scheme_critical_moments.1273.a: "Tsk, tsk." # todo: NEW TRANSLATION
 scheme_critical_moments.1282.t: "[scheme.GetNameNoTooltip]: Úspěch" # todo: NEW TRANSLATION
 scheme_critical_moments.1282.desc: "Velký úspěch! [target.GetTitledFirstName|U] konečně pochopil a nyní stojí po našem boku jako skutečný [owner.Custom('GetGuelphGhibelline')].\n\nVěděl jsem, že [target.GetSheHe] nakonec změní názor." # todo: NEW TRANSLATION
 scheme_critical_moments.1282.a: "Výborně!" # todo: NEW TRANSLATION
 scheme_critical_moments.1283.t: "[scheme.GetNameNoTooltip]: Neúspěch" # todo: NEW TRANSLATION
 scheme_critical_moments.1283.desc: "#EMP Někteří lidé.#! K naší společné frustraci [target.Custom('CZ_TitledFirstName_A')] navzdory všem mým snahám o domluvu, debatování a přemlouvání [target.GetSheHe] trvá na tom, že [target.Custom('GetGuelphsGhibellines')] má pravdu.\n\nNetřeba dodávat, že tentokrát jsme se #EMP nerozešli#! v přátelském duchu." # todo: NEW TRANSLATION
 scheme_critical_moments.1283.a: "#EMP [owner.Custom('InsultNounDumb')]#!!" # todo: NEW TRANSLATION
 scheme_critical_moments.1292.t: "[scheme.GetNameNoTooltip]: Úspěch" # todo: NEW TRANSLATION
 scheme_critical_moments.1292.desc.intro: "Skvělé zprávy — [target.GetTitledFirstName|U] nahradí mnohem mírnější [target_character.GetTitledFirstName]!" # todo: NEW TRANSLATION
 scheme_critical_moments.1292.desc.intro.unknown: "Skvělé zprávy — [target.GetTitledFirstName|U] nahradí řádný stoupenec naší věci!" # todo: NEW TRANSLATION
 scheme_critical_moments.1292.desc: "\n\nJe to skutečně zásluha [ROOT.Char.Custom('GetGuelphsGhibellines')]; nyní můžeme být klidní, že [target.GetPrimaryTitle.GetDefinitiveName] bude spravováno spravedlivě a řádně." # todo: NEW TRANSLATION
 scheme_critical_moments.1292.desc.discovered: "\n\nMého zapojení si však všimli, takže si budu muset dávat pozor..." # todo: NEW TRANSLATION
 scheme_critical_moments.1292.a: "Tak je to správně!" # todo: NEW TRANSLATION
 scheme_critical_moments.1293.t: "[scheme.GetNameNoTooltip]: Neúspěch" # todo: NEW TRANSLATION
 scheme_critical_moments.1293.desc: "Nejlepší plány...\n\n#EMP Někdo to cestou pokazil.#! Zjistím kdo, ale mezitím nelze popřít, že mi [target.GetTitledFirstName] tentokrát unikl. Budeme se muset ještě chvíli smířit s tím, že [target.GetPrimaryTitle.GetDefinitiveName] vládne pomýlený [target.Custom('GetGuelphGhibelline')]." # todo: NEW TRANSLATION
 scheme_critical_moments.1293.a: "#EMP K čertu s tím#!!" # todo: NEW TRANSLATION
