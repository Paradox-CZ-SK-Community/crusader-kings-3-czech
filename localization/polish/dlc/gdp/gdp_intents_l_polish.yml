l_polish:
 schmooze_intent: "Navazování známostí" # todo: NEW TRANSLATION
 schmooze_intent_desc: "Snažíš se usnadnit obchodování a zlepšit [Concept('competitiveness','konkurenceschopnost')|E]." # todo: NEW TRANSLATION
 gdp_merchant_schmooze_modifier: "[Select_CString(ROOT.Char.IsFemale,'Navázala','Navázal')] styky se šlechtou" # todo: NEW TRANSLATION
 gdp_merchant_schmooze_modifier_desc: "Tato postava navázala na hostině styky s místní šlechtou na tomto trhu." # todo: NEW TRANSLATION
 gdp_schmooze_successful_title: "[CHARACTER.GetShortUINameNoTooltip|U] [Select_CString(CHARACTER.IsFemale,'navázala','navázal')] styky s [TARGET_CHARACTER.Custom('CZ_ShortUIName_I')]" # todo: NEW TRANSLATION
 gdp_schmooze_successful: "[CHARACTER.GetTitledFirstName] [Select_CString(CHARACTER.IsFemale,'využila','využil')] příležitosti a [Select_CString(CHARACTER.IsFemale,'navázala','navázal')] styky s [TARGET_CHARACTER.Custom('CZ_ShortUIName_I')]" # todo: NEW TRANSLATION
 gdp_schmooze_successful_empty_title: "[CHARACTER.GetShortUINameNoTooltip|U] [Select_CString(CHARACTER.IsFemale,'navázala','navázal')] styky se šlechtou" # todo: NEW TRANSLATION
 gdp_schmooze_successful_empty: "[CHARACTER.GetTitledFirstName] [Select_CString(CHARACTER.IsFemale,'využila','využil')] příležitosti a [Select_CString(CHARACTER.IsFemale,'navázala','navázal')] styky se šlechtou" # todo: NEW TRANSLATION
 gdp_schmooze_events.1000.t: "Navazování známostí s [schmoozee.GetFirstNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_schmooze_events.1000.desc: "My, obchodníci, musíme popadnout každou příležitost, jak se sblížit se šlechtou. Díky obratnému slovu či vzácnému daru lze zajistit, aby nám nestála v cestě za obchodním úspěchem ani nepodporovala našeho konkurenta.\n\nPečlivě se vyhýbám hranici mezi úlisným lichocením a přílišnou troufalostí a snažím se naklonit si [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee'))], [schmoozee.Custom('CZ_TitledFirstName_A')]." # todo: NEW TRANSLATION
 gdp_schmooze_events.1000.a: "„Prosím, vzácný [schmoozee.GetTitleAsNameNoTooltip], přijměte tento dar.“" # todo: NEW TRANSLATION
 gdp_schmooze_events.1000.b: "„Pokorný obchodník jako já se musí obracet na své představené.“" # todo: NEW TRANSLATION
 gdp_schmooze_events.1000.b.success: "[schmoozee.GetFirstNameNoTooltip] je [Select_CString(schmoozee.IsFemale,'polichocena','polichocen')]" # todo: NEW TRANSLATION
 gdp_schmooze_events.1000.b.failure: "[schmoozee.GetFirstNameNoTooltip] obrací [Select_CString(schmoozee.IsFemale,'její','jeho')] oči v sloup" # todo: NEW TRANSLATION
 gdp_schmooze_events.1000.c: "„Bylo mi ctí s vámi hovořit.“" # todo: NEW TRANSLATION
 gdp_schmooze_events.1000.d: "„Obchoduji s mnoha věcmi, které se hodí pro [schmoozee.GetTitleAsNameNoTooltip]!“" # todo: NEW TRANSLATION
 gdp_schmooze_events.1010.t: "Přátelské soupeření" # todo: NEW TRANSLATION
 gdp_schmooze_events.1010.feast: "Se [schmoozee.GetName] společně hodujeme a střídavě se chlubíme úspěchy svých společností, zatímco popíjíme [ROOT.Char.Custom('RegionalDrink')] a vychutnáváme si [ROOT.Char.Custom('GetExpensiveMeal')]." # todo: NEW TRANSLATION
 gdp_schmooze_events.1010.hunt: "Se [schmoozee.GetName] společně odpočíváme ve stínu [ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')] a střídavě se chlubíme úspěchy svých společností." # todo: NEW TRANSLATION
 gdp_schmooze_events.1010.outro: "\n\nPřes všechnu naši chvástavost je zřejmé, že se v mnohém shodneme. [schmoozee.GetWomanMan] by mi [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] být užitečný(á) a já zase [schmoozee.GetHerHim]." # todo: NEW TRANSLATION
 gdp_schmooze_events.1010.a: "„Za určitou částku bych ti [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] uvolnit trochu prostoru.“" # todo: NEW TRANSLATION
 gdp_schmooze_events.1010.b: "„Vezmi si tohle a nepleť se nám do cesty.“" # todo: NEW TRANSLATION
 gdp_schmooze_events.1010.c: "„Ty budeš chválit mě a já budu chválit tebe.“" # todo: NEW TRANSLATION
 gdp_schmooze_events.1010.c.success: "[schmoozee.GetFirstNameNoTooltip] souhlasí" # todo: NEW TRANSLATION
 gdp_schmooze_events.1010.c.failure: "[schmoozee.GetFirstNameNoTooltip] nemá zájem" # todo: NEW TRANSLATION
 gdp_schmooze_events.1010.d: "Teď se to nehodí." # todo: NEW TRANSLATION
 gdp_schmooze_events.1030.t: "Rozdělená pozornost" # todo: NEW TRANSLATION
 gdp_schmooze_events.1030.feast: "Jak večer pokračuje, ocitám se mezi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_1'))], [schmoozee_1.Custom('CZ_TitledFirstName_I')], a [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_2'))], [schmoozee_2.Custom('CZ_TitledFirstName_I')]. Šlechtici líně rozebírají hypotetické principy obchodu a zprostředkování, zatímco pojídají grilovanou [schmoozer.Custom('GetRegionalFish')]." # todo: NEW TRANSLATION
 gdp_schmooze_events.1030.hunt: "Jak lov pokračuje, ocitám se mezi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_1'))], [schmoozee_1.Custom('CZ_TitledFirstName_I')], a [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_2'))], [schmoozee_2.Custom('CZ_TitledFirstName_I')]. Šlechtici líně rozebírají hypotetické principy obchodu a zprostředkování, zatímco psi hledají stopu." # todo: NEW TRANSLATION
 gdp_schmooze_events.1030.outro: "\n\nNakonec se ke mně [schmoozee_1.GetFirstNameNoTooltip] obrátí, aby věc [Select_CString(schmoozee_1.IsFemale,'rozhodla','rozhodl')]: „Pověz, [schmoozer.Custom('CZ_TitledFirstName_V')], vždyť jsi přece obchodník, ty k tomu musíš mít co říct!“" # todo: NEW TRANSLATION
 gdp_schmooze_events.1030.a: "„To jsi [Select_CString(ROOT.Char.IsFemale,'vystihla','vystihl')] přesně, vzácný [schmoozee_1.GetTitleAsNameNoTooltip].“" # todo: NEW TRANSLATION
 gdp_schmooze_events.1030.b: "„[schmoozee_2.GetTitledFirstNameNoTooltip] má pravdu.“" # todo: NEW TRANSLATION
 gdp_schmooze_events.1030.c: "„Oba vaše postřehy mě opravdu inspirují.“" # todo: NEW TRANSLATION
 gdp_schmooze_events.1030.c.success: "Jsou polichoceni" # todo: NEW TRANSLATION
 gdp_schmooze_events.1030.c.failure: "Obrací oči v sloup" # todo: NEW TRANSLATION
 gdp_schmooze_events.1030.d: "„Nemohu se k tomu vyjádřit.“" # todo: NEW TRANSLATION
 gdp_schmooze_events.1050.t: "Pohyby na trhu" # todo: NEW TRANSLATION
 gdp_schmooze_events.1050.feast: "Oslavy se na chvíli přeruší, aby se hosté mohli promísit a služebnictvo vše připravit," # todo: NEW TRANSLATION
 gdp_schmooze_events.1050.hunt: "Zastavíme se, abychom se rozhlédli po [ROOT.Char.GetCurrentLocation.Custom('GetProvinceAdjective')] [ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')], zatímco psi a honci pokračují dál," # todo: NEW TRANSLATION
 gdp_schmooze_events.1050.outro: "a já si mimoděk všímám klíčových hráčů na našich trzích.\n\n[schmoozee_1.GetTitledFirstName] je užitečný(á) [schmoozee_1.GetWomanMan], kterého stojí za to znát v [market_1.GetLocationTitle.Custom('CZ_LandedNameNoTier_G')], a [schmoozee_2.GetTitledFirstName] zase v [market_2.GetLocationTitle.Custom('CZ_LandedNameNoTier_G')]." # todo: NEW TRANSLATION
 gdp_schmooze_events.1050.three: "Všimnu si také [schmoozee_3.GetTitledFirstName], který(á) působí v [market_3.GetLocationTitle.Custom('CZ_LandedNameNoTier_G')]." # todo: NEW TRANSLATION
 gdp_schmooze_events.1050.a: "„[schmoozee_1.GetFirstNameNoTooltip], už jsem s tebou [Select_CString(schmoozee_1.IsFemale,'chtěla','chtěl')] mluvit!“" # todo: NEW TRANSLATION
 gdp_schmooze_events.1050.b: "„[Select_CString(ROOT.Char.IsFemale,'Slyšla','Slyšel')] jsem o tobě velmi zajímavé věci, [schmoozee_2.GetFirstNameNoTooltip].“" # todo: NEW TRANSLATION
 gdp_schmooze_events.1050.c: "„Ale [schmoozee_3.GetFirstNameNoTooltip], pojďme si popovídat!“" # todo: NEW TRANSLATION
 gdp_schmooze_events.1050.d: "Trhům se daří dobře." # todo: NEW TRANSLATION
 gdp_schmooze_events.1060.t: "Soutěž o pozornost" # todo: NEW TRANSLATION
 gdp_schmooze_events.1060.feast: "Zatímco služebnictvo obchází stoly, dolévá poháry a přináší další chod," # todo: NEW TRANSLATION
 gdp_schmooze_events.1060.hunt: "Zatímco se zastavíme, abychom se napili z měchů a protáhli si nohy," # todo: NEW TRANSLATION
 gdp_schmooze_events.1060.outro: "zahlédnu svého konkurenta, [rival.GetName], jak se nestydatě podbízí [schmoozee.GetName].\n\nTen slizký [rival.GetWomanMan] se vemlouvá a vychvaluje výhody, které [Select_CString(rival.IsFemale,'její','jeho')] obchodníci přinášejí, a přitom mé společníky označuje za ničemy a chvastouny!" # todo: NEW TRANSLATION
 gdp_schmooze_events.1060.a: "„Ale no tak! Ta vaše ubohá firma [rival.GetHouse.GetBaseNameNoTooltip] je k smíchu!“" # todo: NEW TRANSLATION
 gdp_schmooze_events.1060.a.success: "[rival.GetFirstNameNoTooltip] vypadá jako hlupák" # todo: NEW TRANSLATION
 gdp_schmooze_events.1060.a.failure: "Vypadáš jako hlupák" # todo: NEW TRANSLATION
 gdp_schmooze_events.1060.b: "„Jen klid! Naše účetní knihy jsou v naprostém pořádku.“" # todo: NEW TRANSLATION
 gdp_schmooze_events.1060.b.success: "[schmoozee.GetFirstNameNoTooltip] je [Select_CString(schmoozee.IsFemale,'přesvědčena','přesvědčen')]" # todo: NEW TRANSLATION
 gdp_schmooze_events.1060.b.failure: "Tvůj argument není přesvědčivý" # todo: NEW TRANSLATION
 gdp_schmooze_events.1060.c: "Nech je plácat." # todo: NEW TRANSLATION
 activity_used_trade_market_luxury_items_modifier: "Společenská poptávka" # todo: NEW TRANSLATION
 activity_used_trade_market_luxury_items_modifier_desc: "Obchodník odklonil luxusní zboží z tohoto trhu pro potřeby aktivity." # todo: NEW TRANSLATION
 activity_used_trade_market_comforts_modifier: "Společenská poptávka" # todo: NEW TRANSLATION
 activity_used_trade_market_comforts_modifier_desc: "Obchodník odklonil pohodlné zboží z tohoto trhu pro potřeby aktivity." # todo: NEW TRANSLATION
