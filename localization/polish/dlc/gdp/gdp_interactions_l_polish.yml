 action_merchant_company_in_debt_desc: "Máte méně než [Concept('gold_i','@gold_icon!')|E]#V [EmptyScope.ScriptValue('company_debt_gold_threshold_value')|0]#! [Concept('gold','zlato')|E], a vaše [Concept('company','společnost')|E] se tak ocitla v [Concept('debt','dluhu')|E]!\n\nDokud bude společnost zadlužená:\n$BULLET_WITH_TAB$Pokrok [Concept('company_direction','$game_concept_company_sentiment$')|E] směrem k [company_sentiment_divided_i][Concept('company_sentiment_divided','dravému')|E] se každých [EmptyScope.ScriptValue('company_debt_direction_interval_months_value')|V0] měsíců posune o [EmptyScope.ScriptValue('company_debt_direction_shift_value')|V0]\n$BULLET_WITH_TAB$Nelze vyhlásit [Concept('war','válka')|E]\n\nČím hlubší váš dluh bude, tím přísnější budou jeho následky. Vaše současná výše dluhu má tyto další dopady:\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help Zadlužení již stálo vaši společnost [trade_acumen_i][Concept('acumen','důvtipu')|E] a zastavilo růst její [Concept('company_size','velikost společnosti')|E]. Splaťte dluh, abyste zabránili dalšímu poklesu [Concept('company_sentiment','směřování společnosti')|E].#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
