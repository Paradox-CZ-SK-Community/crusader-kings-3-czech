l_polish:
 gdp_merchant_activity_events.0001.t: "Neutišené chutě" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0001.desc: "Jak veselí pokračuje, zaslechnu kručení v žaludcích hladových a čím dál podrážděnějších hostů. Na podnosech s jídlem zbyly jen drobky a žádní sluhové nespěchají, aby je doplnili.\n\n[guest.GetTitledFirstName] [guest.Custom('quirk_neg_present')], vedle [Select_CString(guest.IsFemale,'její','jeho')] prázdný pohár, a ptá se: „Co má člověk udělat, aby na téhle zatracené hostině dostal něco k pití?“" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0001.host: "\n\nMožná mám příležitost trochu oživit slavnost?" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0001.guest: "\n\nMožná mám příležitost oživit slavnost, kterou pořádá [host.Custom('CZ_TitledFirstName_G')]?" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0001.a: "„Tady, rozjeďte kuchyni [host.Custom('CZ_TitledFirstName_G')], nešetřete!“" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0001.a.host: "„Výborně, to se do toho #EMP opřu#!!“" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0001.b: "Vypadá to, že mám dobrou pozici k vyjednávání." # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0001.c: "„[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bys být vděčnější, [guest.GetTitledFirstNameNoTooltip]!“" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0001.d: "„Jestli se ti to nelíbí, tak vypadni!“" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0001.e: "„Sáhněte do firemního skladu.“" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0005.t: "Exotická žádost" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0005.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('admirer'))], [admirer.GetTitledFirstName], na mě mává, abych se [Select_CString(admirer.IsFemale,'připojila','připojil')] k rozhovoru [admirer.GetHerHis] s [guest.Custom('CZ_TitledFirstName_I')].\n\n[admirer.GetFirstNameNoTooltip] se usměje" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0005.desc_esteemed: "vřele" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0005.desc_fallback: "pobaveně" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0005.desc_outro: "a v [Select_CString(admirer.IsFemale,'jejích','jeho')] očích se zableskne. „Právě jsem tu [Select_CString(ROOT.Char.IsFemale,'vyprávěla','vyprávěl')] svému [admirer.Custom2('RelationToMeShort', SCOPE.sC('guest'))] o tom, jaký [luxury_artifact.Custom('GetLuxuryArtifactSentiment')] objev jsi [Select_CString(ROOT.Char.IsFemale,'učinila','učinil')] v cizině. Jen povídej, jak se ti podařilo získat [luxury_artifact.GetName]!“\n\nJe mi jasné, že [admirer.Custom('NoblewomanNobleman')] chce, abych se před nimi [Select_CString(ROOT.Char.IsFemale,'předváděla','předváděl')] a [Select_CString(ROOT.Char.IsFemale,'bavila','bavil')] je." # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0005.a: "„Nebyla to žádná velká sláva…“" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0005.b: "„[Select_CString(ROOT.Char.IsFemale,'Riskovala','Riskoval')] jsem kvůli té věci život i zdraví!“" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0005.b.success: "Vaše přikrášlené vyprávění zní věrohodně" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0005.b.failure: "Vaše lež je odhalena" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0005.c: "„Tak poslouchej, a dobře poslouchej!“" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0005.d: "„To nic není ve srovnání s luxusním zbožím, s nímž obchoduji [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitlyNoTooltip].“" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0010.t: "Darování darů" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0010.desc: "Jakmile dorazil můj kolega kupec, [merchant.GetTitledFirstName], [merchant.GetSheHe] začal se chlubit [Select_CString(merchant.IsFemale,'jejím','jeho')] bohatstvím. [merchant.GetSheHe|U] si pohrává s [Select_CString(merchant.IsFemale,'jejími','jeho')] drahými šperky, předvádí [Select_CString(merchant.IsFemale,'její','jeho')] nádherné roucho z látky [merchant.Custom('RegionalFabric')] a nestydatě vychvaluje [good.Custom('GetTradeGood')] [good.Custom('GetTradeGoodUnitPlural')], s nimiž [merchant.GetSheHe] obchoduje na trhu [merchant.GetTradeMarketForMerchant.GetLocationTitle.Custom('CZ_LandedNameNoTierNoTooltip')].\n\nPřistihnu [merchant.GetHerHim], jak před zástupem ohromených přihlížejících dává dar [receiver.Custom('CZ_TitledFirstName_D')], mému [ROOT.Char.Custom2('RelationToMeShort', receiver)]." # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0010.a: "Ve dvou se to lépe táhne…" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0010.b: "„To je ale pozorný dar, [merchant.GetTitledFirstNameNoTooltip]!“" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0010.b.success: "Zastíníte [merchant.GetFirstNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0010.b.failure: "Vypadáte směšně" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0010.c: "No a co." # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0010.d: "„Není slušné chlubit se před těmi, kdo jsou ti nadřazeni.“" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0015.t: "Úděl poddaných" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0015.desc: "Hostina s dobrým pitím, hojným jídlem a příjemným teplem krbu je v ostrém kontrastu s nočním chladem venku.\n\nPrávě jsem [Select_CString(ROOT.Char.IsFemale,'odešla','odešel')]/odešla ze slavnosti na čerstvý vzduch, když jsem [Select_CString(ROOT.Char.IsFemale,'zahlédla','zahlédl')] skupinku nuzáků: několik prostých lidí postávalo u zdí a doufalo, že po skončení hostiny uloví nějaké drobky." # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0015.a: "Ať se najedí a pobaví na můj účet!" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0015.b: "Raději bych se s šlechtici [Select_CString(ROOT.Char.IsFemale,'podělila','podělil')] o [ROOT.Char.Custom('RegionalDrink')]." # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0015.b.alcohol: "Raději bych se s šlechtici [Select_CString(ROOT.Char.IsFemale,'podělila','podělil')] o [ROOT.Char.Custom('RegionalAlcoholicDrink')]." # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0015.c: "Tady #EMP opravdu#! patřím." # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0015.d: "Zmizte, vy žabince!" # todo: NEW TRANSLATION
 custom.every_attending_noble: "Každá přítomná [Concept('noble','urozený')|E] [Concept('character','postavy')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_activity_events.0020.t: "V oku pozorovatele" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0020.desc: "Doneslo se ke mně, že můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other'))] [other.GetTitledFirstName] má na sobě tu nejúchvatnější [fake_artifact.GetNameNoTooltip].\n\nNajdu [other.GetWomanMan] ve velkém sále, kde [Select_CString(other.IsFemale,'její','jeho')] šaty a náhrdelník spočívající na [Select_CString(other.IsFemale,'její','jeho')] hrudi působí opravdu velkolepě. Když se přiblížím, [other.GetSheHe|U] [other.Custom('quirk_pos_present')] a říká: „[Select_CString(ROOT.Char.IsFemale,'Viděla','Viděl')] jsi můj nejnovější nákup? To byla ale cena, co říkáš?“\n\nTeplé světlo mnoha svíček v sále dopadá na drahokam půvabným způsobem, ale mé cvičené oko nemůže přehlédnout jeho četné vady." # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0020.a: "„To je k popukání! [other.GetFirstNameNoTooltip] si myslí, že tahle cetka má nějakou cenu.“" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0020.b: "#weak *šeptem*#! „Dovol mi, abych se tě toho vadného šperku [Select_CString(ROOT.Char.IsFemale,'zbavila','zbavil')].“" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0020.b.tt: "Získáte [Concept('attraction','přitažlivost')|E] [Concept('opinion','mínění')|E] [Concept('artifact','artefaktu')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_activity_events.0020.b.equipped_tt: "Získán [fake_artifact.GetName] od [other.Custom('CZ_TitledFirstName_G')]." # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0020.c: "„To je vskutku vzácný kousek.“" # todo: NEW TRANSLATION
 fake_artifact_name: "Drahokamový náhrdelník" # todo: NEW TRANSLATION
 fake_artifact_desc: "Elegantní náhrdelník, který se krásně třpytí, ale při bližším pohledu je vidět, jak ledabyle jsou drahokamy vybroušeny." # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0025.t: "Prošlapaná cesta" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0025.desc: "Mezi smíchem a hovorem v sále zaslechnu nečekaný zvuk —" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0025.desc_ape: "#EMP UÁ UÁ!#!" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0025.desc_bird: "#EMP KÍ KÍ!#!" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0025.desc_cont: "— Přivedl někdo na hostinu [luxury_artifact.Custom('GetDomicileArtifactCreatureType')]?\n\nRozhlédnu se po davu a spatřím majitele toho tvora, kupce [merchant.GetTitledFirstName]. [merchant.GetSheHe|U] si všimne mého zvědavého pohledu, [merchant.Custom('quirk_pos_present')] a říká: „Tenhle krásný exemplář jsem [Select_CString(ROOT.Char.IsFemale,'získala','získal')] na jedné ze svých mnoha cest. Často navštěvuji jeden půvabný trh. Obchodní tajemství.“ [merchant.GetSheHe|U] si s tím samolibým úsměvem poklepe na [Select_CString(merchant.IsFemale,'její','jeho')] nos." # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0025.a: "„Myslím, že to místo znám!“" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0025.b: "„[Select_CString(ROOT.Char.IsFemale,'Dala','Dal')] by ses přesvědčit, abys mi [Select_CString(ROOT.Char.IsFemale,'prozradila','prozradil')], kde to je?“" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0025.b.success: "Předkládáte přesvědčivé argumenty" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0025.b.failure: "Nedaří se vám předložit přesvědčivé argumenty" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0025.c: "„Pověz mi víc o svých cestách!“" # todo: NEW TRANSLATION
 gdp_merchant_activity_events.0025.tt.menagerie: "Vytvořte #V $menagerie_acquisition_contract$#! [luxury_contract_i][Concept('luxury_contract','smlouvy na luxusní zboží')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_activity_events.0025.tt.curio: "Vytvořte #V $find_curio_contract$#! [luxury_contract_i][Concept('luxury_contract','smlouvy na luxusní zboží')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
