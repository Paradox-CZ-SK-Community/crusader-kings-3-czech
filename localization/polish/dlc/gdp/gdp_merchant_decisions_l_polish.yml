 gdp_repudiate_usurious_loan_decision: "Odmítnout lichvářskou půjčku" # todo: NEW TRANSLATION
 gdp_repudiate_usurious_loan_decision_desc: "[ROOT.Var('loan_holder').Char.Custom('CZ_ShortUIName_G')] sepsal smlouvu o půjčce s úrokem veřejně a naši [ROOT.Char.GetRite.PriestNeuterPlural] zastávají názor, že žádná taková smlouva nikoho nezavazuje. Nechme dluh zrušit, místo abychom ho spláceli.\n\nNení to krádež. Je to [ROOT.Char.GetRite.GetAdjectiveNoTooltip] právo a každý kupec odtud až k moři tomu bude říkat krádež." # todo: NEW TRANSLATION
 gdp_repudiate_usurious_loan_decision_tooltip: "Nechat své [Concept('clergy','duchovenstvo')|E] zrušit dluh jako [Concept('usury','lichva')|E] a ponechat si [Concept('gold','zlatu')|E] za cenu své pověsti mezi [Concept('merchants','kupci')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_repudiate_usurious_loan_decision_confirm: "Žádná smlouva uzavřená v hříchu mě nezavazuje!" # todo: NEW TRANSLATION
 gdp_repudiate_usurious_loan_decision_afford_repay_tt: "Nemůžeš splatit tuto [Concept('loan','půjčku')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_repudiate_usurious_loan_not_repudiator_tt: "V poslední době jsi neodmítl žádného [Concept('creditor','věřitele')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_repudiate_usurious_loan_credit_tt: "@warning_icon! #X [Concept('merchants','Kupci')|E] ti v dohledné budoucnosti možná nebudou chtít poskytnout úvěr#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_repudiate_usurious_loan_needs_cleric_tt: "Tvé [Concept('rite','ritus')|E] musí považovat půjčku za hřích a musí být nablízku vládce tvé [Concept('faith','víra')|E] z řad [Concept('clergy','duchovenstvo')|E], který ji může zrušit: někdo, jehož [Concept('rite','ritus')|E] souhlasí s tvým, kdo není tvým [Concept('creditor','věřitelem')|E] ani [Concept('rival','sok')|E] a není s tebou ve válce\n#weak Tvá [Concept('head_of_faith','hlava víry')|E], držitel [Concept('clerical_region','církevní oblast')|E] tvého hlavního sídla nebo místa, kde se nacházíš, anebo kdokoli z [Concept('clergy','duchovenstva')|E] v panství tvého [Concept('top_liege_possessive','nejvyšším lenním pánovi')|E].#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_repudiate_usurious_loan_needs_chaplain_tt: "Tvůj [Concept( 'realm_priest', GetPlayer.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName )|E] tě musí podporovat: musí mít o tobě #P kladné#! [Concept('opinion','mínění')|E], anebo musí být tvou [Concept('puppet','loutku')|E] a ty na něj musíš mít [Concept('strong_hook','silná páka')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 become_merchant_decision: "Stát se kupcem" # todo: NEW TRANSLATION
 become_merchant_decision_desc: "K čemu je služba u dvora, když člověk nezná zvyklosti lidí? Touha cestovat do ciziny a stát se spojnicí mezi panstvími je příliš silná, než abychom ji mohli ignorovat." # todo: NEW TRANSLATION
 become_merchant_decision_tooltip: "Vzdej se svých [Concept('titles','tituly')|E] a založ [Concept('merchant','kupec')|E] [Concept('company','společnosti')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 become_merchant_decision_confirm: "Čas obchodovat nastal!" # todo: NEW TRANSLATION
 become_merchant_decision_house_head_tt: "Musíš být [Concept('house_head','hlava rodu')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_recently_became_adventurer_decision_cooldown_tt: "Jsi [Concept('adventurer','dobrodruh')|E] už #V 5 let#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 repudiate_loan_tt: "[repudiating_borrower.GetShortUIName|U] už nebude [repudiated_lender.GetShortUIName] dlužit [repudiating_borrower.GetHerHisYour] půjčku" # todo: NEW TRANSLATION
 abuse_charter_authority_decision: "Zneužít pravomoci z listiny" # todo: NEW TRANSLATION
 abuse_charter_authority_decision_tooltip: "Využít svou [Concept('charter','listinu')|E] k získání [gold_i|E][Concept('gold','zlatu')|E] a zvýšení své [competitiveness_i|E][Concept('competitiveness','konkurenceschopností')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 abuse_charter_authority_decision_desc: "Mám listinu od [ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip] z [ROOT.Char.GetSuzerain.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')], která činí vůli [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] prakticky zákonem. S vládcem panství za zády se nám nikdo neodváží stát v cestě." # todo: NEW TRANSLATION
 abuse_charter_authority_decision_confirm: "Jednám jménem [ROOT.Char.GetSuzerain.Custom('CZ_TitledFirstName_G')]!" # todo: NEW TRANSLATION
 abuse_charter_authority_decision.not_topdog_realm_or_steppe: "Zde se autorita [Concept('gurkhan_possessive','gurkhanův')|E] neuznává" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 abuse_charter_authority_decision.region_already_abused: "Tyto země už zažily zneužití autority [Concept('gurkhan_possessive','gurkhanův')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 abuse_charter_authority_decision.nothing_to_abuse: "V této [Concept('location','poloze')|E] nejsou žádné země, které by se daly zneužít" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_charter_abused_market_modifier: "Zneužití pravomocí z listiny" # todo: NEW TRANSLATION
 gdp_charter_abused_market_modifier_desc: "Tato postava zneužila pravomoci udělené listinou, aby prospěla své společnosti." # todo: NEW TRANSLATION
 gdp_charter_abused_market_county_modifier: "Zneužití pravomocí z listiny" # todo: NEW TRANSLATION
 gdp_charter_abused_market_county_modifier_desc: "Toto hrabství vykořisťuje kupecká společnost, která využívá svou listinu k vlastnímu obohacení." # todo: NEW TRANSLATION
 gdp_charter_leveraged_market_modifier: "Odsunut stranou držitelem listiny" # todo: NEW TRANSLATION
 gdp_charter_leveraged_market_modifier_desc: "Této postavě se přestalo dařit, protože její společnost zastínil konkurent s listinou od vládce panství." # todo: NEW TRANSLATION
 gdp_charter_charitable_market_county_modifier: "Rozvoj nařízený listinou" # todo: NEW TRANSLATION
 gdp_charter_charitable_market_county_modifier_desc: "Toto hrabství rozvíjí kupecká společnost, která využívá svou listinu k přímému zásahu." # todo: NEW TRANSLATION
 gdp_decision.1000.t: "Rozhořčení mecenáše" # todo: NEW TRANSLATION
 gdp_decision.1000.desc: "Z paláce [patron.GetTitledFirstNameNoTooltipRegnal] ke mně dorazila zpráva. Můj zachmuřený mecenáš si vyslechl obvinění, že moje společnost zneužila své pravomoci.\n\nDozvídám se, že soudci podrobně vyjmenovali naše přečiny a [patron.GetTitleAsNameNoTooltip] se pomalu obrátil proti mně.\n\nMůj mecenáš nyní požaduje okamžitou odpověď a vysvětlení našich výstřelků..." # todo: NEW TRANSLATION
 gdp_decision.1000.a: "„Rád přijmu váš soud.“" # todo: NEW TRANSLATION
 gdp_decision.1000.b: "„Jistě chápete, že jsem to udělal pro panství...“" # todo: NEW TRANSLATION
 gdp_decision.1000.b.success: "Tvůj mecenáš je milosrdný" # todo: NEW TRANSLATION
 gdp_decision.1000.b.failure: "Tvůj mecenáš je pobouřen" # todo: NEW TRANSLATION
 gdp_decision.1000.a.effects: "Tvůj [Concept('merchant_patron','patron')|E] získá [Concept('imprisonment_reason','důvod k uvěznění')|E] a [Concept('execute_reason','důvod k popravě')|E] vůči tobě" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_decision.1000.a.severe_effects: "Tvůj [Concept('merchant_patron','patron')|E] získá [Concept('imprisonment_reason','důvod k uvěznění')|E] a [Concept('execute_reason','důvod k popravě')|E] vůči tobě a členům tvé [Concept('close_family_members','členové blízké rodiny')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_decision.1000.a.survived_patrons_wrath: "I když jsi přečkal hněv svého [Concept('merchant_patron_possessive','patrona')|E], už nebudeš moci znovu zneužít jeho pravomoci" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_decision.1010.t: "$gdp_decision.1000.t$" # todo: NEW TRANSLATION
 gdp_decision.1010.intro: "Jako [ROOT.Char.GetTitleAsNameNoTooltip] dávají kupci z [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] své služby mně a nikdo z nich víc než ti, kterým jsem udělil listiny opatřené mou pečetí.\n\n" # todo: NEW TRANSLATION
 gdp_decision.1010.desc: "$gdp_decision.1010.intro$Zdá se, že jeden takový kupec, [merchant.GetName], zneužil mé přízně a využil [Select_CString(merchant.IsFemale,'jejích','jeho')] výsadních pravomocí, aby [merchant.GetHerselfHimself] obohatil na úkor lidu.\n\nTaková svévole je pobuřující, ale musím zvážit i přínos, který tito obchodníci přinášejí panství." # todo: NEW TRANSLATION
 gdp_decision.1010.a: "[merchant.GetSheHe|U] za to ponese následky!" # todo: NEW TRANSLATION
 gdp_decision.1010.a.tt: "Ostatní [Concept('clients','klienti')|E] s tvými [Concept('charters','listinami')|E] budou méně ochotní zneužívat tvou autoritu, pokud bude [merchant.GetShortUIName] [Concept('imprisoned','uvězněný')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_decision.1010.b: "Tentokrát to nechám být." # todo: NEW TRANSLATION
 gdp_decision.1010.c: "Tyhle řeči o hokynářích jsou pode mě." # todo: NEW TRANSLATION
 gdp_decision.1010.c.flavor: "K dalšímu zneužití tvých pravomocí může dojít, ale už o něm nedostaneš zprávu" # todo: NEW TRANSLATION
 gdp_decision.1010.d: "[merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U]...? Nikdy jsem jim listinu neudělil!" # todo: NEW TRANSLATION
 gdp_decision.1020.t: "Jménem [patron.GetTitleAsNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_decision.1020.opening: "Stačí mávnout listinou a brány [market_province.GetBaronyNameExplicitly] i kanceláře tamních soudců se mi jménem [patron.GetTitledFirstName] otevřou.\n\n" # todo: NEW TRANSLATION
 gdp_decision.1020.market_holder: "Místní mocipán, [market_holder.GetTitledFirstName], neskrývá [Select_CString(market_holder.IsFemale,'její','jeho')] nelibost a štěká, že se o tom [patron.GetTitleAsNameNoTooltip] dozví, ale [Select_CString(market_holder.IsFemale,'její','jeho')] tlachání nic neznamená. Dokument nelze zpochybnit.\n\n" # todo: NEW TRANSLATION
 gdp_decision.1020.closing: "Když je město vydáno na milost a nemilost, mohou spolčenci společnosti zajistit tržní zařízení, zabavit zboží bez řádných dokladů a znepříjemnit život konkurenci falešnými nároky a obviněními." # todo: NEW TRANSLATION
 gdp_decision.1020.a: "Nikdo nám nemůže stát v cestě." # todo: NEW TRANSLATION
 gdp_decision.1020.b: "Měli bychom [market_holder.GetTitledFirstNameNoTooltip] přizvat ke spolupráci." # todo: NEW TRANSLATION
 gdp_decision.1020.c: "Rozmyslel jsem si to." # todo: NEW TRANSLATION
 gdp_decision.1020.d: "„Má #EMP inspekce#! skončila. Prozatím...“" # todo: NEW TRANSLATION
 gdp_decision.1020.b.success: "[patron.GetTitleAsNameNoTooltip] se o tom nedozví" # todo: NEW TRANSLATION
 gdp_decision.1020.b.failure: "[patron.GetTitleAsNameNoTooltip] se o tomto zneužití dozví" # todo: NEW TRANSLATION
 benevolent_charter_authority_decision: "Přímé investice do místní oblasti" # todo: NEW TRANSLATION
 benevolent_charter_authority_decision_tooltip: "Využít svou [Concept('charter','listinu')|E] k rozvoji [building_i|E][Concept('building','budovy')|E] a zvýšení místní [Concept('prosperity_i','@prosperity_icon!')|E][Concept('prosperity','rozkvětu')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 benevolent_charter_authority_decision_desc: "Díky svolení [ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip] z [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTierNoTooltip] mám dostatečný vliv k přímým zásahům v panství, které by jinak přesahovaly pravomoci pouhé kupecké společnosti." # todo: NEW TRANSLATION
 benevolent_charter_authority_decision_confirm: "Ve jménu [ROOT.Char.GetSuzerain.GetTitleAsNamePossessiveNoTooltip] lze vykonat mnoho dobrého." # todo: NEW TRANSLATION
 merchant_charter_intervention_county_cooldown: "V posledních #V 5#! letech jsi nezasáhl v [THIS.Char.GetDomicile.GetLocation.GetName]#!" # todo: NEW TRANSLATION
 gdp_decision.1200.t: "Potěšení mecenáše" # todo: NEW TRANSLATION
 gdp_decision.1200.desc: "Z paláce [patron.GetTitledFirstNameNoTooltipRegnal] ke mně dorazila zpráva, že můj potěšený mecenáš vyslechl nadšenou chválu na iniciativu mé společnosti.\n\nNěkolik svědků básnilo o [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] a jeho nedávných zásazích.\n\n[patron.GetTitleAsNameNoTooltip] proto společnosti poslal zprávu: „Dobrý [ROOT.Char.GetTitledFirstNameNoTooltip], tvé úsilí je přínosem pro panství!“" # todo: NEW TRANSLATION
 gdp_decision.1200.a: "„Společnost ráda slouží.“" # todo: NEW TRANSLATION
 gdp_decision.1200.b: "„Uznání potěší, ale odměna také.“" # todo: NEW TRANSLATION
 gdp_decision.1200.b.flavor: "Při vší úctě..." # todo: NEW TRANSLATION
 gdp_decision.1200.b.success: "Tvůj mecenáš je štědrý" # todo: NEW TRANSLATION
 gdp_decision.1200.b.failure: "Tvůj mecenáš je zklamaný" # todo: NEW TRANSLATION
 gdp_decision.1210.t: "$gdp_decision.1200.t$" # todo: NEW TRANSLATION
 gdp_decision.1210.desc: "$gdp_decision.1010.intro$Zdá se, že jeden takový kupec, [merchant.GetName], využil [Select_CString(merchant.IsFemale,'její','jeho')] výsadní pravomoci ku prospěchu panství a investoval do rozvoje [market_province.GetBaronyNameExplicitlyNoTooltip]!\n\nTakové záslužné jednání si zaslouží pochvalu, a poskytnutí pobídek nejspíš povzbudí další dobročinnost." # todo: NEW TRANSLATION
 gdp_decision.1210.a: "Takovou iniciativu je třeba podporovat." # todo: NEW TRANSLATION
 gdp_decision.1210.a.tt: "Ostatní [Concept('clients','klienti')|E] s tvými [Concept('charters','listinami')|E] budou ochotnější uplatňovat tvou autoritu ku prospěchu všech" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_decision.1210.b: "Při [ROOT.Char.GetFaith.HighGodName]u, čestní kupci snad #EMP opravdu#! existují!" # todo: NEW TRANSLATION
 gdp_decision.1210.c: "Neobtěžujte mě takovými věcmi." # todo: NEW TRANSLATION
 gdp_decision.1210.c.flavor: "K dalšímu dobročinnému uplatnění tvých pravomocí může dojít, ale už o něm nedostaneš zprávu" # todo: NEW TRANSLATION
 gdp_decision.1220.t: "Jménem [patron.GetTitleAsNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_decision.1220.opening: "Když dorazím do [market_province.GetBaronyNameExplicitly] s listinou v ruce, místní soudci jsou zpočátku zaražení, ale brzy jim vysvětlím dobré úmysly své společnosti.\n\n" # todo: NEW TRANSLATION
 gdp_decision.1220.market_holder: "Místní mocipán, [market_holder.GetTitledFirstName], naslouchá mým návrhům s opatrným zájmem a chápe, že podpora výroby a obchodu mezi [Select_CString(market_holder.IsFemale,'její','jeho')] poddanými má své výhody.\n\n" # todo: NEW TRANSLATION
 gdp_decision.1220.closing: "Při prohlídce se rychle ukáže několik zjevných míst, která je třeba opravit či vylepšit. Měšťané nám je ochotně ukážou." # todo: NEW TRANSLATION
 gdp_decision.1220.a: "„Tak na co čekáme?“" # todo: NEW TRANSLATION
 gdp_decision.1220.d: "„To je všechno velmi zajímavé, ale čekají mě jiné záležitosti...“" # todo: NEW TRANSLATION
 press_the_advantage_decision: "Využít převahu" # todo: NEW TRANSLATION
 press_the_advantage_decision_desc: "Naše nedávné úspěchy zaskočily soupeře a vnesly nejistotu na trhy. Nyní je čas nasadit spolčence, protislužby a těžce získaný vliv na obchodní cestu, která dokáže proměnit tlak v zisk." # todo: NEW TRANSLATION
 press_the_advantage_decision_tooltip: "Utratit [competitive_pressure_i][Concept('competitive_pressure','konkurenčního tlaku')|E] a po určitou dobu získat lepší [competitiveness_i][Concept('trade_competitiveness','obchodní konkurenceschopnosti')|E] na [Concept('trade_route','obchodní trasu')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 press_the_advantage_decision_confirm: "Využijme své převahy." # todo: NEW TRANSLATION
 merchant_competitive_pressure_gain_1_tt: "Získáš [competitive_pressure_i]#P 1#! [Concept('competitive_pressure','konkurenční tlak')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 merchant_competitive_pressure_gain_2_tt: "Získáš [competitive_pressure_i]#P [EmptyScope.ScriptValue('merchant_competitive_pressure_undercut_competition_gain_value')|0]#! [Concept('competitive_pressure','konkurenční tlak')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 merchant_competitive_pressure_spend_tt: "Utratíš [competitive_pressure_i]#N [EmptyScope.ScriptValue('merchant_competitive_pressure_spend_cost_value')|0]#! [Concept('competitive_pressure','konkurenční tlak')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 merchant_competitive_pressure_spend_cost_tt: "Máš alespoň [competitive_pressure_i]#V [EmptyScope.ScriptValue('merchant_competitive_pressure_spend_cost_value')|0]#! [Concept('competitive_pressure','konkurenční tlak')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 merchant_competitive_pressure_below_max_tt: "Máš méně než maximální množství [competitive_pressure_i][Concept('competitive_pressure','konkurenčního tlaku')|E] #weak ([GetPlayer.MakeScope.ScriptValue('merchant_competitive_pressure_value')|0]/[GetPlayer.MakeScope.ScriptValue('merchant_competitive_pressure_current_max_value')|0])#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 press_the_advantage_route_not_already_pressed_tt: "Máš aktivní [Concept('trade_route','obchodní trasy')|E], která ještě nezískává výhodu z modifikátoru [GetModifier('merchant_competitive_pressure_route_modifier').GetNameWithTooltip]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 press_the_advantage_selected_route_has_trader_tt: "Vybraná [Concept('trade_route','obchodní trasa')|E] má [Concept('trader','obchodník')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 press_the_advantage_selected_route_not_already_pressed_tt: "Vybraná [Concept('trade_route','obchodní trasa')|E] ještě nezískává výhodu z modifikátoru [GetModifier('merchant_competitive_pressure_route_modifier').GetNameWithTooltip]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 merchant_competitive_pressure_route_modifier: "Využitá převaha" # todo: NEW TRANSLATION
 merchant_competitive_pressure_route_modifier_desc: "Této obchodní cestě věnují zvýšenou pozornost spolčenci, kteří přesně vědí, kde jsou konkurenti zranitelní." # todo: NEW TRANSLATION
 choose_specialized_market_decision: "Vybrat specializovaný trh" # todo: NEW TRANSLATION
 choose_specialized_market_decision_desc: "Společnost, která rozumí zvykům, úředníkům i skrytým cestám nějakého trhu, se může zabydlet i v neznámých ulicích. Zaměříme-li své inspektory na jeden trh na našich obchodních cestách, můžeme místní znalosti proměnit v obchodní výhodu." # todo: NEW TRANSLATION
 choose_specialized_market_decision_tooltip: "Vyber [market_i][Concept('market','trhu')|E] na jedné ze svých [route_i][Concept('trade_routes','obchodních tras')|E], ve kterém získáš bonus za specializaci inspektora" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 choose_specialized_market_decision_confirm: "Prozkoumat trh" # todo: NEW TRANSLATION
 choose_specialized_market_decision_effect_tt: "Vybraný [market_i][Concept('market','trhu')|E] se stane tvým specializovaným [market_i][Concept('market','trhu')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 choose_specialized_market_has_valid_market_tt: "Máš platný [market_i][Concept('market','trhu')|E] na [route_i][Concept('trade_route','obchodní trasu')|E] nebo v místě svého [Concept('domicile','domicilu')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 choose_specialized_market_selected_market_has_valid_route_tt: "Vybraný [market_i][Concept('market','trhu')|E] leží na jedné z tvých [route_i][Concept('trade_routes','obchodních tras')|E] nebo v místě tvého [Concept('domicile','domicilu')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
