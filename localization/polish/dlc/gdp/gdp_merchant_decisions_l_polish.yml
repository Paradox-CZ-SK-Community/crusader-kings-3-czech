 craft_artifact_scheme.1000.t: "$craft_artifact$: Úspěch" # todo: NEW TRANSLATION
 craft_artifact_scheme.1000.intro.curio: "Noc co noc jsem trávil v dílně, po boku svého spolčence či místního cechovního [ROOT.Char.GetWomanMan], a vyráběl tu či onu věc." # todo: NEW TRANSLATION
 craft_artifact_scheme.1000.desc.curio: "$craft_artifact_scheme.1000.intro.curio$\n\nDnes ale konečně mohu říct, že všechna ta práce přinesla ovoce! Když si hotové dílo prohlížím, každá stopa mého úsilí mi vykouzlí úsměv na tváři a jediné, na co myslím, je, kde ho hrdě vystavím." # todo: NEW TRANSLATION
 craft_artifact_scheme.1000.intro.library: "Noc co noc jsem seděl shrbený ve své pracovně, ruce potřísněné inkoustem a ztuhlé od psaní, zatímco knot svíčky pomalu dohoříval." # todo: NEW TRANSLATION
 craft_artifact_scheme.1000.desc.library: "$craft_artifact_scheme.1000.intro.library$\n\nDnes ale konečně mohu říct, že všechna ta práce přinesla ovoce! Když si dílo pročítám, každá pasáž mi vykouzlí úsměv na tváři a jediné, na co myslím, je, jak si jeho řádky budou číst ostatní." # todo: NEW TRANSLATION
 craft_artifact_scheme.1000.desc.curator: "\n\nMému kurátorovi [curator.GetFirstNamePossessive] se při prohlížení díla rozzáří oči. „Tohle je #EMP skutečný#! úspěch, [ROOT.Char.GetTitleAsNameNoTooltip].“" # todo: NEW TRANSLATION
 craft_artifact_scheme.1000.a: "Ta námaha stála za to." # todo: NEW TRANSLATION
 craft_artifact_desc_curio: "[newly_created_artifact.GetDesc]\n\nVyrobil [ROOT.Char.Custom('CZ_TitledFirstName_I')] z [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedName_G')|l]." # todo: NEW TRANSLATION
 craft_artifact_desc_library: "[newly_created_artifact.GetDesc]\n\nSepsal [ROOT.Char.Custom('CZ_TitledFirstName_I')] z [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedName_G')|l]." # todo: NEW TRANSLATION
 craft_artifact_scheme.2000.t: "$craft_artifact$: Neúspěch" # todo: NEW TRANSLATION
 craft_artifact_scheme.2000.desc.curio: "$craft_artifact_scheme.1000.intro.curio$\n\nKaždý pokus uskutečnit mou představu zmařil chybný výpočet či nepochopení a místnost je posetá troskami opuštěných pokusů, které už nelze nijak využít..." # todo: NEW TRANSLATION
 craft_artifact_scheme.2000.desc.library: "$craft_artifact_scheme.1000.intro.library$\n\nKaždé ráno se po podlaze povalují vyhozené útržky textu a ani těch pár kousků, které jsem si ponechal, nedokáže naplnit šíři mého záměru..." # todo: NEW TRANSLATION
 craft_artifact_scheme.2000.desc.curator: "\n\nMůj kurátor [curator.GetFirstName] si povzdechne, když si prohlíží skromné výsledky mého snažení. „Možná je čas přiznat porážku?“" # todo: NEW TRANSLATION
 craft_artifact_scheme.2000.a: "Už se mi z toho dělá špatně..." # todo: NEW TRANSLATION
 craft_artifact_scheme.2000.b: "...ale moje práce nesmí přijít nazmar!" # todo: NEW TRANSLATION
