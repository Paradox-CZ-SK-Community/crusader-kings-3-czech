 craft_artifact_desc_general: "[Concept('scheme','intrika')|E] $craft_artifact$ je [Concept('personal_scheme','osobní intrika')|E], v níž se ty a tvoje [Concept('company','společnost')|E] pokusíte vytvořit zcela nový [Concept('domicile_artifact','artefakt domicilu')|E]. Tato intrika závisí především na tvém [Concept('stewardship','správcovství')|E].\n\n[Concept('success_chance','Šance na úspěch')|E] ovlivňuje mnoho faktorů, hlavně však tvá [Concept('stewardship_skill','správcovská dovednost')|E] a [Concept('aptitude','způsobilost')|E] tvého $antiquarian_merchant$." # todo: NEW TRANSLATION # todo: CONCEPT CASE
