 gdp_merchant.3000.t: "Rada překladatele" # todo: NEW TRANSLATION
 gdp_merchant.3000.desc: "Můj překladatel, [translator.GetTitledFirstName], se už nějakou dobu straní ostatních a zjevně se probírá nějakým cizojazyčným textem. Konečně se [translator.GetSheHe] objeví.\n\n„[ROOT.Char.GetTitleAsNameNoTooltip],“ [translator.GetSheHe] se rozzáří, „prohlížel jsem zprávy získané na [market.GetName|l]. Zkratkovitá [saved_culture.GetLanguage.GetName] byla zapeklitá, ale je tu mnoho informací o pohybu místního zboží!“" # todo: NEW TRANSLATION
 gdp_merchant.3000.a: "„Chci znát každý sebemenší detail, [translator.GetFirstNameNoTooltip]!“" # todo: NEW TRANSLATION
 gdp_merchant.3000.a.tt: "[Concept('company','Společnost')|E] získá [Concept('trade_expertise','obchodní zkušenost')|E] ve všech [Concept('trade_categories_short','kategorie')|E] obchodovaných na [market.GetName]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.3000.b: "„Mohl bys mě naučit tento jazyk?“" # todo: NEW TRANSLATION
 gdp_merchant.3000.b.tt: "Tvé [Concept('scheme','intrika')|E] získá [GetModifier('gdp_merchant_translator_buff_modifier').GetNameWithTooltip]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.3000.c: "„Prodej zjištění tomu, kdo nabídne nejvíc.“" # todo: NEW TRANSLATION
 gdp_merchant.3000.d: "„Zaměř se na své jazykové dovednosti.“" # todo: NEW TRANSLATION
 gdp_merchant_translator_buff_modifier: "Učitel překladatele" # todo: NEW TRANSLATION
 gdp_merchant.3010.t: "Zjištění prostředníka" # todo: NEW TRANSLATION
 gdp_merchant.3010.desc: "Můj prostředník, [fixer.GetTitledFirstName], se už nějakou dobu vytrvale plíží po [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. Konečně sjedná schůzku a pošle neurčitý vzkaz o [Select_CString(fixer.IsFemale,'jejímu','jeho')] nálezu #EMP zboží#!.\n\n[fixer.GetSheHe|U] se záhadně usadí na [fixer.GetHerHis] místo," # todo: NEW TRANSLATION
 gdp_merchant.3010.desc.secret: "a pak se usměje. „Dalo to práci, ale mám důkaz, že [secret_haver.GetName] je téměř jistě [secret.GetName]!“" # todo: NEW TRANSLATION
 gdp_merchant.3010.desc.scheme: "a [Select_CString(fixer.IsFemale,'její','jeho')] výraz zvážní. „Mám špatné zprávy, [ROOT.Char.GetTitleAsNameNoTooltip]. Zjistil jsem, že [scheme_owner.GetName] proti tobě — proti společnosti — něco kuje!“" # todo: NEW TRANSLATION
 gdp_merchant.3010.a: "„To se velmi hodí, přines mi další!“" # todo: NEW TRANSLATION
 gdp_merchant.3010.b: "„Ty jsi ale pěkný špeh, co, [fixer.GetFirstNameNoTooltip]?“" # todo: NEW TRANSLATION
 gdp_merchant.3010.c: "„S pomluvami získanými nekalým způsobem se nezabývám.“" # todo: NEW TRANSLATION
 gdp_merchant.3010.d: "„To by se mi mohlo hodit při práci...“" # todo: NEW TRANSLATION
 gdp_merchant.3020.t: "Výhrůžky soudního vykonavatele" # todo: NEW TRANSLATION
 gdp_merchant.3020.desc: "Můj soudní vykonavatel, [bailiff.GetTitledFirstName], pročítá seznam dlužníků a přemýšlí, jak na ně zatlačit, abychom dostali své [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] co nejdříve zpět.\n\n" # todo: NEW TRANSLATION
 gdp_merchant.3020.pressure: "„[pressure_debtor_1.GetTitledFirstName] nemá prostředky, ale mohl by alespoň projevit dobrou vůli a začít dluh splácet...“ zavrčí [bailiff.GetFirstNameNoTooltip].\n\n" # todo: NEW TRANSLATION
 gdp_merchant.3020.demand: "[bailiff.GetSheHe|U] si povzdechne: „Mám spolehlivé zprávy, že [demand_debtor_1.GetTitledFirstName] může zaplatit... [demand_debtor_1.GetSheHe] si [demand_debtor_1.GetHerselfHimself] jen myslí, že je nad nás povznesený!“\n\n" # todo: NEW TRANSLATION
 gdp_merchant.3020.third: "„A pak je tu ještě [portrait_3.GetTitledFirstName]...“ zamumlá [bailiff.GetSheHe]." # todo: NEW TRANSLATION
 gdp_merchant.3020.a: "„Ano, jistě si [pressure_debtor_1.GetFirstNameNoTooltip] může dovolit #EMP malou#! službičku?“" # todo: NEW TRANSLATION
 gdp_merchant.3020.a.tt: "Bude vám dlužit o [gold_i]#V [THIS.Char.MakeScope.ScriptValue('minor_gold_value')]#! méně" # todo: NEW TRANSLATION
 gdp_merchant.3020.b: "„Zatlačte na [demand_debtor_1.Custom('CZ_TitledFirstName_A')]...“" # todo: NEW TRANSLATION
 gdp_merchant.3020.c: "„[pressure_debtor_2.GetFirstNameNoTooltip] si může dovolit malou splátku.“" # todo: NEW TRANSLATION
 gdp_merchant.3020.d: "„[demand_debtor_2.GetFirstNameNoTooltip] před námi očividně něco zatajuje!“" # todo: NEW TRANSLATION
 gdp_merchant.3020.e: "„Připomeňte [pressure_debtor_3.GetFirstNameNoTooltip] [Select_CString(pressure_debtor_3.IsFemale,'její','jeho')] závazky.“" # todo: NEW TRANSLATION
 gdp_merchant.3020.f: "„Je čas dát [demand_debtor_3.GetFirstNameNoTooltip] jasně najevo, co si o tom myslíme.“" # todo: NEW TRANSLATION
 gdp_merchant.3020.g: "„Raději je nechám, ať mi dál dluží.“" # todo: NEW TRANSLATION
 ho_loan_demand_refused_title: "Požadavek na splátku půjčky odmítnut" # todo: NEW TRANSLATION
 gdp_merchant_3020_demand_refused_tt: "[THIS.Story.GetOwner.GetShortUIName] vám stále dluží [gold_i][outstanding|V0]" # todo: NEW TRANSLATION
 ho_loan_reduced_title: "Půjčka snížena" # todo: NEW TRANSLATION
 gdp_merchant_3020_pressure_tt: "[THIS.Story.GetOwner.GetShortUIName] vám nyní dluží [gold_i][outstanding|V0]" # todo: NEW TRANSLATION
 gdp_merchant.3031.t: "Zápal spolčence" # todo: NEW TRANSLATION
 gdp_merchant.3031.desc: "Můj obchodní zástupce [market_agent.GetTitledFirstName] poslední dobou ponocuje a dlouho do noci pročítá účetní knihy, zatímco kolem [market_agent.GetHerHim] dohořívá svíčka. Dnes ráno [market_agent.GetSheHe|U] zamrká a s unaveným pohledem [market_agent.GetSheHe] vstoupí do mé pracovny.\n\n„[ROOT.Char.GetTitledFirstName]! Prohlížel jsem naše účetní knihy pro [market.GetName|l] a je tu jasná příležitost, kterou bychom měli-“ #weak *zívnutí*#! „Rozhodně bychom ji měli využít!“" # todo: NEW TRANSLATION
 gdp_merchant.3031.a: "„Dobrá práce, [market_agent.GetFirstNameNoTooltip], teď se běž vyspat!“" # todo: NEW TRANSLATION
 gdp_merchant.3031.a.tt: "V [market.GetName|l] se objeví [trade_opportunity.GetType.GetName|V] [Concept('trade_opportunity','obchodní příležitostí')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.3031.b: "„Na to zapomeň, soustřeď se na naše současné záležitosti!“" # todo: NEW TRANSLATION
 gdp_merchant.3040.t: "Kurátorova péče" # todo: NEW TRANSLATION
 gdp_merchant.3040.desc: "Můj kurátor [antiquarian.GetTitledFirstName] bedlivě dohlíží na sbírku [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip], dbá na to, aby byly její předměty v bezpečí a dobrém stavu, a příležitostným hostům vypráví zajímavé podrobnosti.\n\nJednoho rána se zastavím, abych obdivoval [artifact.GetName], a [antiquarian.GetSheHe] se objeví přesně ve chvíli, kdy má: „Ach, [ROOT.Char.GetTitleAsNameNoTooltip], tohle je opravdu výjimečný kousek. Někdy si ale říkám, jestli obstojí ve srovnání se zbytkem sbírky.“" # todo: NEW TRANSLATION
 gdp_merchant.3040.b: "„Je čas se ho zbavit. Najdi kupce.“" # todo: NEW TRANSLATION
 gdp_merchant.3040.c: "„Možná by potřeboval trochu zrenovovat.“" # todo: NEW TRANSLATION
 gdp_merchant.3040.c.tt: "[artifact.GetName] je již v dokonalém stavu" # todo: NEW TRANSLATION
 gdp_merchant.3040.c.tt.creature: "[artifact.GetName] je #V tvor#!" # todo: NEW TRANSLATION
 gdp_merchant.3040.d: "„Nesmysl, sbírka je bezchybná.“" # todo: NEW TRANSLATION
 gdp_merchant.8000.t: "$merchant_caravaneer_capstone_decision$" # todo: NEW TRANSLATION
 gdp_merchant.8000.desc: "Prostý měšťan by jen stěží uvěřil, jakou cestu může urazit pouhý kousek látky, než se objeví na stánku na trhu — přes žhnoucí pouště a rozbouřená moře.\n\nTakové útrapy obchodníků, zvířat a lodí jsou každodenním chlebem [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]. Naše dodávky jsou důležité i pro vzdálená města, kde nikdo nepromluví ani slovo [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]." # todo: NEW TRANSLATION
 gdp_merchant.8000.a: "Pověst hodná naší společnosti!" # todo: NEW TRANSLATION
 gdp_merchant.8000.b: "Nesmím však zapomenout na své kořeny." # todo: NEW TRANSLATION
 gdp_merchant.8001.t: "$merchant_artisan_capstone_decision$" # todo: NEW TRANSLATION
 gdp_merchant.8001.desc: "Cennější než balíky a kusy směněného zboží či drahokamy a kovy ze země jsou zázraky, které z nich lidské ruce dokážou s talentem vytvořit.\n\nDůmyslné vynálezy, dechberoucí ozdoby a jemné řemeslné zpracování jsou životní mízou [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] a naše jméno je zárukou kvality a důvěry." # todo: NEW TRANSLATION
 gdp_merchant.8001.a: "$gdp_merchant.8000.a$" # todo: NEW TRANSLATION
 gdp_merchant.8001.b: "$gdp_merchant.8000.b$" # todo: NEW TRANSLATION
 gdp_merchant.8002.t: "$merchant_creditor_capstone_decision$" # todo: NEW TRANSLATION
 gdp_merchant.8002.desc: "I ten nejmocnější král se může proměnit v bezmocného žebráka, když přestanou proudit peníze. Úvěrové linky ho však obklopují jako četná vlákna pavoučí sítě.\n\nJméno [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessive] je známo u dvorech po celé zemi. Lidé se na něj spoléhají při sjednávání obchodů a dohod; vždy ochotně pomůže v nouzi, ale není radno toho zneužívat." # todo: NEW TRANSLATION
 gdp_merchant.8002.a: "$gdp_merchant.8000.a$" # todo: NEW TRANSLATION
 gdp_merchant.8002.b: "$gdp_merchant.8000.b$" # todo: NEW TRANSLATION
 gdp_merchant.8010.t: "Kniha cest" # todo: NEW TRANSLATION
 gdp_merchant.8010.desc: "Málokdo toho spatřil tolik co já a nikdo nezná celý rozsah mých jedinečných zkušeností. Od žebráka po mocnáře — vzdálené kraje tohoto světa jsou pro většinu jen mlhavou představou a lidé touží po postřezích a zábavě, které by tuto temnotu prozářily.\n\nKdyž přemýšlím o zajímavých příhodách ze svých cest v [poi.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTier], napadá mě, co by cizinci i moji potomci chtěli slyšet nejvíc." # todo: NEW TRANSLATION
 gdp_merchant.8010.a: "Zaměřím se na cizí zvyky a etiketu." # todo: NEW TRANSLATION
 gdp_merchant.8010.a.tt: "Kvalita této knihy bude do značné míry záviset na tvých [GetTrait( 'lifestyle_merchant' ).GetTraitTrackByKey( 'caravaneer' ).GetName|V] #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#! a [GetTrait( 'lifestyle_traveler' ).GetTraitTrackByKey( 'travel' ).GetName|V] #weak ([GetTrait('lifestyle_traveler').GetName( GetNullCharacter )])#! [Concept('trait_level_track_xp','zkušenosti rysu')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.8010.b: "Čtenáři hledají obchodní rady a postřehy z trhů." # todo: NEW TRANSLATION
 gdp_merchant.8010.c: "Popíšu exotická města a jejich divy." # todo: NEW TRANSLATION
 gdp_merchant.8011.t: "$gdp_merchant.8010.t$" # todo: NEW TRANSLATION
 gdp_merchant.8011.intro: "Trvalo to déle, než jsem čekal, ale konečně jsem se svými zápisky docela spokojen. Podrobně jsem popsal svou cestu do [poi.GetName] a doplnil ji příhodami z cest, přičemž zvláštní důraz jsem kladl na exotické [author.Custom('GetTravelogueTopic')].\n\n" # todo: NEW TRANSLATION
 gdp_merchant.8011.weak: "Když knihu pročítám, jsem zklamaný a říkám si, zda jsem se nemohl více snažit. Ale běda, je čas odložit pero." # todo: NEW TRANSLATION
 gdp_merchant.8011.mid: "Když knihu pročítám, jsem hrdý na její šíři, přesto mám pocit, že jí možná stále chybí něco zvláštního." # todo: NEW TRANSLATION
 gdp_merchant.8011.great: "Když knihu pročítám, přistihnu se, jak se směju vlastním slovům a vzrušují mě jednotlivé pasáže, jako bych všechno znovu prožíval. Na tuhle knihu se nezapomene!" # todo: NEW TRANSLATION
 gdp_merchant.8011.a: "Zatím si ji nechám." # todo: NEW TRANSLATION
 gdp_merchant.8011.b: "Bude patřit do knihovny společnosti." # todo: NEW TRANSLATION
 travelogue_description_full: "Toto je barvité cestopisné vyprávění o krajinách [author.MakeScope.Var('poi_title').Title.GetBaseNameNoTier], které sepsal obchodník [author.GetTitledFirstName]. Přináší postřehy z [Select_CString(author.IsFemale,'jejích','jeho')] zkušeností s cizími [author.Custom('GetTravelogueTopic')].\n\n[SCOPE.Custom('GetTravelogueQuality')]" # todo: NEW TRANSLATION
