 gdp_merchant.2010.desc.intro: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName] mi neustále vypráví o mistru řemeslníkovi [craftsman.GetWomanMan] [craftsman.GetFirstName] v [CZPrepV(workshop_province.GetNameNoTooltip)] [CZProvName(workshop_province,'L')]. Teď, když stojím před [craftsman.GetHerHis] dílem, chápu, proč kolem toho tolik nadělá.\n\n[craftsman.GetFirstNameNoTooltip] mě vítá, aniž by zvedl [Select_CString(craftsman.IsFemale,'její','jeho')] zrak od [Select_CString(craftsman.IsFemale,'její','jeho')] práce. „Jen si v klidu prohlédněte mé zboží.“\n\nŽasnu nad " # todo: NEW TRANSLATION
 gdp_merchant.2010.desc.weapon: "nádhernou zbraní." # todo: NEW TRANSLATION
 gdp_merchant.2010.desc.chalice: "důmyslně zpracovaným kalichem." # todo: NEW TRANSLATION
 gdp_merchant.2010.desc.box: "důmyslně vyřezávanou dřevěnou skříňkou." # todo: NEW TRANSLATION
 gdp_merchant.2010.desc.saddle: "dokonale vyřezávaným sedlem." # todo: NEW TRANSLATION
 gdp_merchant.2010.desc.vase: "jemně malovanou keramickou vázou." # todo: NEW TRANSLATION
 gdp_merchant.2010.desc.craftsmanship: "Tohle není obyčejné řemeslné dílo." # todo: NEW TRANSLATION
 gdp_merchant.2010.a: "Takový talent by neměl přijít nazmar." # todo: NEW TRANSLATION
 gdp_merchant.2010.b: "Možná bys mohl [associate.GetFirstNameNoTooltip] něčemu přiučit." # todo: NEW TRANSLATION
 gdp_merchant.2010.c: "Rád bych tu zůstal a pozoroval tvou práci." # todo: NEW TRANSLATION
 gdp_merchant.2015.t: "Cena [counsel_good.GetNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant.2015.desc: "Od svého patrona [patron.GetTitledFirstName] jsem dostal nečekané předvolání. Vzhledem k [patron.GetHerHis] [patron.Custom('quirk_neg_adjective')] povaze vstupuji do trůnního sálu s obavami.\n\n„[ROOT.Char.Custom('MistressMaster')|U] [ROOT.Char.GetFirstNameNoTooltip], řekněte mi, prosím, jaké jsou vlastnosti a tržní hodnota [counsel_good.GetNameNoTooltip]?“" # todo: NEW TRANSLATION
 gdp_merchant.2015.a: "„V této věci jsem poměrně zkušený.“" # todo: NEW TRANSLATION
 gdp_merchant.2015.a.tt: "V [counsel_category.GetName] kategorii [Concept('trade_category_short','kategorii')|E] musíš dosáhnout alespoň [Concept('expertise_level','úroveň zkušenosti')|E] #V [GetPlayer.MakeScope.ScriptValue('merchant_monopoly_trade_expertise_level_medium_value')|0]#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.2015.b: "„Možná bych o tom něco věděl...“" # todo: NEW TRANSLATION
 gdp_merchant.2015.a.monopoly.tt: "[monopoly_i][Concept('trade_monopoly','Obchodní monopol')|E] přijetí: [monopoly_opinion_acceptance|=+0]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.2015.b.success: "[patron.GetFirstNameNoTooltip] tě považuje za odborníka" # todo: NEW TRANSLATION
 gdp_merchant.2015.b.failure: "[patron.GetFirstNameNoTooltip] prohlédne tvé lži" # todo: NEW TRANSLATION
 gdp_merchant.2015.b.monopoly.tt: "[monopoly_i][Concept('trade_monopoly','Obchodní monopol')|E] přijetí: [monopoly_acceptance|=+0]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.2015.c: "„V životě se chci věnovat i něčemu jinému než obchodu.“" # todo: NEW TRANSLATION
 gdp_merchant.2020.t: "Místo u stolu" # todo: NEW TRANSLATION
 gdp_merchant.2020.desc: "Mám tu čest povečeřet v [patron.GetCapitalLocation.GetHolding.GetType.GetName|l] svého patrona [patron.Custom('CZ_TitledFirstName_G')] v [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. [courtier_1.GetTitledFirstName], [courtier_1.Custom('NoblewomanNobleman')], mě při cestě k mému místu probodává žhnoucím pohledem. [Select_CString(courtier_1.IsFemale,'Její','Jeho')] šepot k ostatním hostům je téměř neslyšný, ale zaslechnu slova „holota“ a „úplatky od obyčejného kramáře“. Hlasy utichnou, když [patron.GetFirstNameNoTooltip] vstane, aby promluvil:\n\n„Drazí společníci, noví známí i dávno ztracení bratři, shromáždil jsem vás tu dnes večer, abychom si užili mé pohostinnosti. Pojďme hodovat!“" # todo: NEW TRANSLATION
 gdp_merchant.2020.a: "„Výtečné, tohle bychom měli pořádat častěji!“" # todo: NEW TRANSLATION
 gdp_merchant.2020.a.feast.tt: "[patron.GetShortUIName] co nejdříve uspořádá [GetActivityType('activity_feast').GetTextIcon][GetActivityType('activity_feast').GetName] #weak (během 1–3 měsíců)#!" # todo: NEW TRANSLATION
 gdp_merchant.2020.b: "Rod [ROOT.Char.GetHouse.GetBaseNameNoTooltip] získá uznání, které si zasloužíme." # todo: NEW TRANSLATION
 gdp_merchant.2020.b.unity_gain.desc: "jménem našeho rodu získal místo mezi šlechtou" # todo: NEW TRANSLATION
 gdp_merchant.2020.c: "„Slyším, slyším, a teď pojďme mluvit o obchodu!“" # todo: NEW TRANSLATION
 gdp_merchant.2020.c.unity_loss.desc: "soustředil se na to, na čem opravdu záleží: obchod" # todo: NEW TRANSLATION
 gdp_merchant.2025.t: "Menší kupec" # todo: NEW TRANSLATION
 gdp_merchant.2025.desc: "[charter_rival.GetTitledFirstName] jako obvykle nedorazí, když je třeba plnit povinnosti. Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('patron'))] [patron.GetTitledFirstName] a já trpělivě čekáme na [Select_CString(charter_rival.IsFemale,'její','jeho')] příchod, než se rozhodneme projít účetní knihy za tento měsíc bez [charter_rival.GetHerHim].\n\nNeověřené obchodní dohody jsou stále rozházené po stole, když [patron.GetFirstNameNoTooltip] odhrne pergameny a obrátí [Select_CString(patron.IsFemale,'její','jeho')] pozornost ke mně:\n\n„[ROOT.Char.GetFirstNameNoTooltip], jen mezi námi dvěma, co si #EMP doopravdy#! myslíš o [charter_rival.GetFirstNameNoTooltip]? Rozhodl jsem se správně, když jsem [charter_rival.GetHerHim] udělil svou obchodní listinu?“" # todo: NEW TRANSLATION
 gdp_merchant.2025.a: "„Možná by se lépe vyjímala v mých rukou?“" # todo: NEW TRANSLATION
 gdp_merchant.2025.a.charter.tt: "[charter_i][Concept('request_merchant_charter','Požádat o kupeckou listinu')|E] přijetí: [charter_opinion_acceptance|=+0]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.2025.b: "„Důvěřuji vašemu lepšímu úsudku, [patron.Custom('FormOfAddressForLiege')].“" # todo: NEW TRANSLATION
 gdp_merchant.2025.b.unity_gain.desc: "ukázal patronovi, že důvěřujeme jeho úsudku" # todo: NEW TRANSLATION
 gdp_merchant.4000.t: "Naše místo stranou od cesty" # todo: NEW TRANSLATION
 gdp_merchant.4000.desc.intro: "Vcházím na trh v [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] a vidím, že mí prodejci byli odsunuti do odlehlé uličky. Jejich stánky stojí v blátě u nedalekého vepřína.\n\n" # todo: NEW TRANSLATION
 gdp_merchant.4000.desc.patron: "Můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('market_character'))]" # todo: NEW TRANSLATION
 gdp_merchant.4000.desc.patron_representative: "[patron.Custom('CZ_TitledFirstName_G')] [patron.Custom2('RelationToMe', SCOPE.sC('market_character'))], [market_character.GetName]" # todo: NEW TRANSLATION
 gdp_merchant.4000.desc.body: "postává daleko proti větru a ušklíbá se, zatímco [market_character.GetSheHe] sleduje, jak mě mí společníci zasypávají stížnostmi.\n\nKdyž přistoupím blíž, [market_character.GetFirstNameNoTooltip] řekne:" # todo: NEW TRANSLATION
 gdp_merchant.4000.desc.body.patron: "„Vhodné místo pro obchod [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip|l], nemyslíš?“ [market_character.GetSheHe|U] ukáže na prasata." # todo: NEW TRANSLATION
 gdp_merchant.4000.desc.body.patron_representative: "„Jsem tu jménem vašeho patrona.“ Soudě podle toho, jak [Select_CString(market_character.IsFemale,'její','jeho')] zvedá bradu a jak se mu [Select_CString(market_character.IsFemale,'její','jeho')] oči lesknou, si [market_character.GetSheHe] předáváním této zprávy zjevně docela užívá." # todo: NEW TRANSLATION
 gdp_merchant.4000.desc.outro: "„Nedodržujete naše zvyky a nikdy nedbáte slov [Glossary( 'Kǒngzǐ', 'CONFUCIUS_GLOSS' )]. Dokud to nenapravíte, bude tohle vaše místo.“" # todo: NEW TRANSLATION
 gdp_merchant.4000.b: "Měl bych se poučit o Cestě." # todo: NEW TRANSLATION
 gdp_merchant.4000.b.tt: "Tvoje příští [GetActivityType('activity_adult_education').GetName] bude stát o #P [EmptyScope.ScriptValue('gdp_merchant_confucian_university_visit_discount_loc')]%#! méně [Concept('gold','zlato')|E], pokud ji uspořádáš v centru s rysem [GetTrait('confucian_education').GetName(GetNullCharacter)]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.4000.c: "Já jim ukážu..." # todo: NEW TRANSLATION
 gdp_merchant.4010.t: "Brány vzdělanosti" # todo: NEW TRANSLATION
 gdp_merchant.4010.desc: "Po dlouhém dni na trhu si vychutnávám čaj. Tu a tam si všimnu, jak na mě místní učenec zvědavě pohlédne.\n\n„[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] jsou pohrdavá cháska,“ slyším [student.GetHerHim] mumlat ke [Select_CString(student.IsFemale,'jejímu','jeho')] příteli. „Myslí si, že jsou lepší než my, kteří dodržujeme správné rity. My jsme zkoušky složili s náležitou pečlivostí. Čeho [ROOT.Char.GetFirstNameNoTooltip] kdy dosáhl, kromě vykořisťování ostatních?“" # todo: NEW TRANSLATION
 gdp_merchant.4010.a: "Ta zkouška přece nemůže být tak těžká." # todo: NEW TRANSLATION
 gdp_merchant.4010.b: "„A čí čaj to vlastně piješ?“" # todo: NEW TRANSLATION
 gdp_merchant.4010.c: "„A o čí obchod si tohle místo může dovolit přijít?“" # todo: NEW TRANSLATION
 gdp_merchant.4020.t: "Hedvábná stezka" # todo: NEW TRANSLATION
 gdp_merchant.4020.desc: "Vcházím do [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] sevřeného davem lidí i zvířat, který proudí branami [ROOT.Char.GetCurrentLocation.GetTitle.Custom('BaronyTownTypePossessive')], aby se přidal k nekonečnému zástupu karavan. Zdejší dromedáři jsou kvůli množství nákladu vysocí jako sloni a pod tíhou břemen na hřbetě se kymácejí ze strany na stranu.\n\n" # todo: NEW TRANSLATION
 gdp_merchant.4020.desc.exceptional_bounty: "Na každém rohu obchodníci vykládají takové množství zboží, až tomu člověk nemůže uvěřit.\n\nVidím stánky, kde je jídlo odložené stranou, protože se toho vyprodukovalo tolik, že se to všechno nedá prodat dřív, než se to zkazí." # todo: NEW TRANSLATION
 gdp_merchant.4020.desc.steady_trading: "Nikdy předtím jsem na jednom místě neviděl takové bohatství. Je tu tolik lidí, že se z nás stává hlučící masa, která splývá v jediný celek.\n\nKdyž některá karavana poleví, vždy se najde mistr, který dychtivě práskne bičem." # todo: NEW TRANSLATION
 gdp_merchant.4020.desc.hardship: "Z útržků rozhovorů v cizích jazycích jsem vyrozuměl, že se zdejšímu trhu právě nedaří.\n\nJak to tu asi vypadá v lepších časech? Takové množství zboží se snad ani nedá spočítat..." # todo: NEW TRANSLATION
 gdp_merchant.4020.a: "Tohle je cesta do budoucnosti." # todo: NEW TRANSLATION
 gdp_merchant.4030.t: "Vzdálené bohatství" # todo: NEW TRANSLATION
 gdp_merchant.4030.desc.intro: "Můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('associate'))] [associate.GetFirstName] vstoupí do pracovny [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] a oči se mu rozzáří, jako když spatří hromadu zlata.\n\n[associate.GetSheHe|U] mi podá krabičku. Otevřu ji a najdu v ní" # todo: NEW TRANSLATION
 gdp_merchant.4030.desc.silk: "to nejjemnější hedvábí, jaké jsem kdy viděl. Je tenké jako pavučina a neuvěřitelně lehké.\n\n" # todo: NEW TRANSLATION
 gdp_merchant.4030.desc.spice: "čerstvě namletý, voňavý prášek.\n\n„Říkají tomu [rumoured_market_owner.Custom('RegionalSpice')],“ poví mi [associate.GetSheHe]." # todo: NEW TRANSLATION
 gdp_merchant.4030.desc.jade: "nefritový kámen vyleštěný tak, že je jeho povrch hladký jako sklo.\n\n" # todo: NEW TRANSLATION
 gdp_merchant.4030.desc.ivory: "kus slonoviny vyřezaný do podoby miniaturní citadely.\n\n" # todo: NEW TRANSLATION
 gdp_merchant.4030.desc.outro: "„Koupil jsem to od kupce, který vyprávěl o svých [rumoured_market_owner.GetCulture.GetNameNoTooltip|l] kontaktech na Hedvábné stezce. Zlato, které vyděláváme tady v [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], není nic ve srovnání s tím, co získávají na [rumoured_market_location.Custom('GetRegionalMarketTermGlossPlural')] v [rumoured_market_location.GetBaronyNameExplicitlyNoTooltip].“" # todo: NEW TRANSLATION
 gdp_merchant.4030.a: "„Hedvábná stezka, říkáš?“" # todo: NEW TRANSLATION
 gdp_merchant_4030_a_tt: "Pokud v příštích #V 5#! letech přesuneš svou [Concept('company','společnost')|E] do [rumoured_market.GetName], získáš na tomto [Concept('market','trhu')|E] na #V 10 let#! [GetModifier('gdp_silk_road_market_foothold_modifier').GetNameWithTooltip]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.4030.b: "„Děkuji, to je od tebe milý dar.“" # todo: NEW TRANSLATION
 gdp_merchant.4030.c: "„Máme tu důležitou práci, [associate.GetFirstNameNoTooltip].“" # todo: NEW TRANSLATION
 merchant_unity_local_business: "upřednostnil blízký obchod před [silk_road|E]" # todo: NEW TRANSLATION
 gdp_merchant.4030.artifact.silk: "Hedvábí z [rumoured_market_location.GetBaronyNameExplicitlyNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant.4030.artifact.silk.desc: "Vzorek hedvábí tenkého jako pavučina, přivezeného z trhů Hedvábné stezky. Je neuvěřitelně lehké a na dotek hladké." # todo: NEW TRANSLATION
 gdp_merchant.4030.artifact.spice: "Pytlík koření" # todo: NEW TRANSLATION
 gdp_merchant.4030.artifact.spice.desc: "Pytlík voňavého koření přivezeného z trhů Hedvábné stezky." # todo: NEW TRANSLATION
 gdp_merchant.4030.artifact.jade: "Leštěný nefritový kámen" # todo: NEW TRANSLATION
 gdp_merchant.4030.artifact.jade.desc: "Nefritový kámen z tržišť Hedvábné stezky, vyleštěný tak, až je jeho povrch hladký jako sklo." # todo: NEW TRANSLATION
 gdp_merchant.4030.artifact.ivory: "Slonovinová citadela" # todo: NEW TRANSLATION
 gdp_merchant.4030.artifact.ivory.desc: "Kousek slonoviny z tržišť Hedvábné stezky, pečlivě vyřezaný do podoby miniaturní citadely." # todo: NEW TRANSLATION
 gdp_merchant.5000.t: "Odhalený úrok" # todo: NEW TRANSLATION
 gdp_merchant.5000.desc.debtor: "Dveře do kanceláře [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] se rozletí a dovnitř vstoupí můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('accuser'))] [accuser.GetFirstName], po boku s mými vlastními společníky." # todo: NEW TRANSLATION
 gdp_merchant.5000.desc.debtor_paranoid: "Přítomnost mého [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('accuser'))] [accuser.GetFirstName] prozradí jen zavrzání dveří, když [accuser.GetSheHe] tiše vstoupí do kanceláře [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]." # todo: NEW TRANSLATION
 gdp_merchant.5000.desc.bishop: "Prahové dveře [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] potemní postavy v kápích. Netrvá dlouho a přede mnou stojí [accuser.Custom('GetActualBishopTitle')] [accuser.GetFirstName], vedený mými vlastními společníky." # todo: NEW TRANSLATION
 gdp_merchant.5000.desc.clergy: "Prahové dveře [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] potemní postavy v kápích. Netrvá dlouho a přede mnou stojí [accuser.Custom('PriestTitle')] [accuser.GetFirstName], vedený mými vlastními společníky." # todo: NEW TRANSLATION
 gdp_merchant.5000.desc.steward: "Dveře do kanceláře [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] se rozletí a dovnitř vtrhne [debtor.GetFirstNamePossessive] [debtor.Custom2('RelationToMeShort', SCOPE.sC('accuser'))], po boku s mými vlastními společníky." # todo: NEW TRANSLATION
 gdp_merchant.5000.desc.break: "\n\n„[ROOT.Char.GetTitledFirstNameNoTooltip], zdá se, že v půjčce poskytnuté [SelectLocalization( ROOT.Char.MakeScope.Var('gdp_usury_penance_accuser_is_debtor').IsSet, 'mně', debtor.GetTitledFirstName )] je nesrovnalost,“ říká [accuser.GetSheHe]." # todo: NEW TRANSLATION
 gdp_merchant.5000.desc.accepted: "„Zvlášť nemám rád, když mě někdo krmí lžemi. Ukažte mi účetní knihy vaší společnosti a uveďme vše na pravou míru.“" # todo: NEW TRANSLATION
 gdp_merchant.5000.desc.discouraged.debtor: "„Znáte nesouhlas [accuser.GetFaith.Custom('HouseOfWorshipBase')] s lichvou. Vyrovnejme účty hned a tato záležitost nemusí zajít dál.“" # todo: NEW TRANSLATION
 gdp_merchant.5000.desc.shunned.debtor: "„Jakmile se o tom dozvědí [accuser.Custom('DefaultPriestTitlePlural')], tvrdě zasáhnou proti vám i vašemu podnikání. Jsem tu, abych vám dal šanci zachránit se.“" # todo: NEW TRANSLATION
 gdp_merchant.5000.desc.accepted.steward: "„Váš patron nemá zrovna rád, když ho někdo krmí lžemi. Ukažte mi účetní knihy vaší společnosti a uveďme čísla do pořádku.“" # todo: NEW TRANSLATION
 gdp_merchant.5000.desc.discouraged.steward: "$gdp_merchant.5000.desc.discouraged.debtor$" # todo: NEW TRANSLATION
 gdp_merchant.5000.desc.shunned.steward: "$gdp_merchant.5000.desc.shunned.debtor$" # todo: NEW TRANSLATION
 gdp_merchant.5000.desc.discouraged: "„Jako obchodník jistě chápete, že člověk nemůže získat něco za nic. A přece… Nuže, doufáme, že tuto záležitost lze vyřešit hned a diskrétně, aby vaše podnikání neutrpělo kvůli této chybě a neutrpěl tím obchod.“" # todo: NEW TRANSLATION
 gdp_merchant.5000.desc.shunned: "„Způsob, jakým jste vedl své podnikání, je odporný. Vy, obchodník, prodáváte něco, co neexistuje? Pokud nebudete prosit o odpuštění, skončí to u soudu.“" # todo: NEW TRANSLATION
 gdp_merchant.5000.a: "„Copak nevíte, že jednám jménem [ROOT.Char.GetSuzerain.Custom('CZ_TitledFirstName_G')]?“" # todo: NEW TRANSLATION
 gdp_merchant.5000.a.debtor: "„Jistě přece nechcete poškodit náš obchod?“" # todo: NEW TRANSLATION
 gdp_merchant.5000.b: "„Můžete si vzít náš majetek jako náhradu.“" # todo: NEW TRANSLATION
 gdp_merchant.5000.c: "„Pojďme se podívat na drobné písmo.“" # todo: NEW TRANSLATION
 gdp_merchant.5000.c.success: "Vaše účty jsou bez poskvrny" # todo: NEW TRANSLATION
 gdp_merchant.5000.c.failure: "Čísla nesedí" # todo: NEW TRANSLATION
 gdp_merchant.5000.c.critical: "Úrok je zastřen jen chabě" # todo: NEW TRANSLATION
 gdp_merchant.5000.d: "„Myslím, že bych se mohl úroku vzdát…“" # todo: NEW TRANSLATION
 gdp_merchant.5000.e: "„Považujte půjčku za zapomenutou.“" # todo: NEW TRANSLATION
 gdp_usury_penance_seized_goods_modifier: "Zabavené karavany" # todo: NEW TRANSLATION
 gdp_usury_penance_seized_goods_modifier_desc: "Podnikání této postavy utrpělo poté, co byly odhaleny její skryté úročené půjčky." # todo: NEW TRANSLATION
 gdp_usury_penance_same_faith_scandal_modifier: "Známý lichvář" # todo: NEW TRANSLATION
 gdp_usury_penance_same_faith_scandal_modifier_desc: "Tato postava trpí následky odhalení své nečestné lichvy." # todo: NEW TRANSLATION
 gdp_usury_penance_forgive_interest_tt: "Zastřený [Concept('interest','úrok')|E] je prominut #weak ([TARGET_CHARACTER.GetShortUIName] dluží [Concept('gold_i','@gold_icon!')|E]$VALUE|0V$)#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_usury_penance_forgive_interest_tt_first: "$gdp_usury_penance_forgive_interest_tt$" # todo: NEW TRANSLATION
 gdp_usury_penance_loan_stands_tt: "Zastřená [Concept('loan','půjčka')|E] zůstává v platnosti" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.5010.t: "Drobné písmo" # todo: NEW TRANSLATION
 gdp_merchant.5010.desc: "Dozvěděl jsem se, že můj věřitel [lender.GetFirstName] nebyl při sjednávání mé půjčky zcela upřímný.\n\nKdyž jsem znovu [Select_CString(ROOT.Char.IsFemale,'prošla','prošel')] čísla, zjistil jsem, že drobné písmo obsahuje ustanovení, která navyšují částku nad rámec toho, na čem jsme se původně dohodli.\n\nNesrovnalost v naší dohodě je zřejmá všem, pokud se rozhodnu jednat." # todo: NEW TRANSLATION
 gdp_merchant.5010.a: "Udržet to v tajnosti." # todo: NEW TRANSLATION
 gdp_merchant.5010.b: "[lender.GetSheHe|U] mi vrátí úrok." # todo: NEW TRANSLATION
 gdp_merchant.5010.b.wipe: "[lender.GetSheHe|U] žádný úrok nedostane." # todo: NEW TRANSLATION
 gdp_merchant.5010.c: "Odmítnout půjčku." # todo: NEW TRANSLATION
 gdp_usury_debtor_discover_interest_tt: "Skrytý [Concept('interest','úrok')|E] činí #weak ([Concept('gold_i','@gold_icon!')|E]$VALUE|0V$)#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_usury_debtor_keep_secret_tt: "Zastřený [Concept('interest','úrok')|E] zůstane tajemstvím" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_usury_debtor_demand_repayment_tt: "Požadovat vrácení skrytého [Concept('interest','úroku')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_usury_debtor_inform_creditor_tt: "Dopis bude odeslán [lender.Custom('CZ_ShortUIName_D')]" # todo: NEW TRANSLATION
 gdp_merchant.5020.opening: "[debtor.Custom2('AppropriateGreetingNegative', ROOT.Char)]" # todo: NEW TRANSLATION
 gdp_merchant.5020.desc: "$gdp_merchant.5020.desc_intro$ Požaduji okamžité vrácení skrytého úroku. Už mě znovu nezkoušejte oklamat." # todo: NEW TRANSLATION
 gdp_merchant.5020.a: "Jaká škoda." # todo: NEW TRANSLATION
 gdp_merchant.5020.a.tt: "Skrytý úrok byl vrácen" # todo: NEW TRANSLATION
 gdp_usury_penance_interest_paid_back_tt: "Skrytý [Concept('interest','úrok')|E] již není dlužen" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.5020.desc_intro: "[Select_CString(ROOT.Char.IsFemale,'Prošla','Prošel')] jsem naši smlouvu o půjčce a je nad slunce jasné, že jste se mě pokusil podvést!" # todo: NEW TRANSLATION
 gdp_usury_debtor_kept_secret_message: "Tajemství zachováno" # todo: NEW TRANSLATION
 gdp_usury_debtor_kept_secret_message_desc: "[debtor.GetTitledFirstName] ví o zastřeném [Concept('interest','úrok')|E] a zachová ho v tajnosti." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.5040.opening: "[debtor.Custom2('AppropriateGreetingNegative', ROOT.Char)]" # todo: NEW TRANSLATION
 gdp_merchant.5040.desc: "Považujte půjčku, kterou jste mi poskytl, za neplatnou. Příště si lépe rozmyslím, zda od vás něco přijmu." # todo: NEW TRANSLATION
 gdp_merchant.5040.a: "Ta drzost!" # todo: NEW TRANSLATION
 gdp_merchant.0060.opening: "[associate.Custom2('AppropriateGreetingPositive', ROOT.Char)]" # todo: NEW TRANSLATION
 gdp_merchant.0060.desc: "Bolí mě, že vám musím napsat a přiznat, že útrapy cestování po otevřené silnici a nekonečné hádky na tržištích jsou pro mě příliš těžké.\n\nMohli byste se smilovat a povolat společnost zpět domů, alespoň na nějaký čas?" # todo: NEW TRANSLATION
 gdp_merchant.0060.a: "Jestli musím." # todo: NEW TRANSLATION
 gdp_merchant.0060.a.tt: "Slibujete, že během 2 let přijmete [GetDecisionWithKey('gdp_return_trade_envoys_decision').GetName]." # todo: NEW TRANSLATION
 gdp_merchant.0060.b: "Budeš to muset překonat." # todo: NEW TRANSLATION
 gdp_merchant.0060.b.tt: "[associate.GetShortUIName] má [stress_i]#N [associate.GetStress|0]#! [Concept('stress','stresu')|E]. [associate.GetSheHe|U] bude i nadále získávat stres kvůli neúspěšným [Concept('scheme','intrikám')|E] na [Select_CString(associate.IsFemale,'její','jeho')] cestě." # todo: NEW TRANSLATION, CHECK FORMAT # todo: CONCEPT CASE # todo: FORMAT chýba [associate.GetHerHis], [schemes|E]; navyše [scheme|E]
