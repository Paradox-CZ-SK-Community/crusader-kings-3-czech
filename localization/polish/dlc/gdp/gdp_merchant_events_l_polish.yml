l_polish:
 gdp_merchant.0001.t: "Cesta dlážděná zlatem" # todo: NEW TRANSLATION
 gdp_merchant.0001.desc: "Vstupuji na místní tržiště jako svobodný [ROOT.Char.GetWomanMan]. Z každého rohu ulice se ozývá křik prodavačů, proplétající se s kovovým řinčením a bušením z nedalekých dílen. Kamkoli se podívám, všude se vozí sem a tam povozy s bednami [ROOT.Char.Custom('RegionalDrink')], svitky [ROOT.Char.Custom('RegionalFabric')] a klecemi s [ROOT.Char.Custom('GetRandomRegionalBird')].\n\nTady vybuduji svou dynastii." # todo: NEW TRANSLATION
 gdp_merchant.0001.heir: "$ep3_laamps.0030.heir$" # todo: NEW TRANSLATION
 gdp_merchant.0001.liege: "$ep3_laamps.0030.liege$" # todo: NEW TRANSLATION
 gdp_merchant.0001.new: "$ep3_laamps.0030.new$" # todo: NEW TRANSLATION
 gdp_merchant.0001.a: "Jaký bude můj první podnikatelský počin?" # todo: NEW TRANSLATION
 gdp_merchant.0002.opening: "[merchant.Custom2('AppropriateGreetingPositive', ROOT.Char)]" # todo: NEW TRANSLATION
 gdp_merchant.0002.desc: "Po pečlivém zvážení jsem se rozhodl věnovat životu obchodníka. Jsem v nejlepších letech a touha cestovat do ciziny mě nutí jednat. Doufám, že jednou budeme moci uzavřít obchodní dohodu, která bude výhodná pro nás oba. [old_primary_title.GetBaseNameNoTierNoTooltip] nechávám ve vašich schopných rukou." # todo: NEW TRANSLATION
 gdp_merchant.0002.a: "To je zajímavý zvrat událostí." # todo: NEW TRANSLATION
 gdp_merchant.0010.t: "Rodinné záležitosti" # todo: NEW TRANSLATION
 gdp_merchant.0010.desc: "Když dnešní rodinná schůze skončí, můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetTitledFirstName] na mě mávne s odhodlaným výrazem v [Select_CString(associate.IsFemale,'její','jeho')] tváři.\n\n„Drahý [associate.Custom2('RelationToMe', ROOT.Char)]!" # todo: NEW TRANSLATION
 gdp_merchant.0010.desc.starting: "Jsem členem této společnosti od jejího založení,„" # todo: NEW TRANSLATION
 gdp_merchant.0010.desc.starting_fallback: "Pro tuto rodinu pracuji už nějakou dobu,„" # todo: NEW TRANSLATION
 gdp_merchant.0010.desc.cont: "říká [associate.GetSheHe] a pečlivě volí [Select_CString(associate.IsFemale,'její','jeho')] slova." # todo: NEW TRANSLATION
 gdp_merchant.0010.desc.children: "„A protože tvůj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('heir'))] ještě není plnoletý," # todo: NEW TRANSLATION
 gdp_merchant.0010.desc.no_children: "„A protože nemáš žádné dospělé děti," # todo: NEW TRANSLATION
 gdp_merchant.0010.desc.outro: "doufal jsem, že bys zvážil, zda si mě neadoptovat. Bylo by mi ctí zastupovat rodinu jako její člen.„" # todo: NEW TRANSLATION
 gdp_merchant.0010.a: "Vždycky jsem tě považoval za jednoho z nás." # todo: NEW TRANSLATION
 merchant_adoption_event_tt: "[associate.GetShortUIName] se stane členem tvého [Concept('house','rodu')|E]" # todo: NEW TRANSLATION
 merchant_unity_adoption_loss: "adoptoval dvořana do [Concept('house','rodu')|E]" # todo: NEW TRANSLATION
 gdp_merchant.0010.b: "Ještě ses neosvědčil." # todo: NEW TRANSLATION
 gdp_merchant.0010.c: "Nech mě si to rozmyslet." # todo: NEW TRANSLATION
 gdp_merchant.0015.t: "Tvář našeho obchodu" # todo: NEW TRANSLATION
 gdp_merchant.0015.desc: "Zřízením [trade_route.GetNameNoTooltip|l] jsme určili směr našeho obchodu.\n\nJeště jsem nevybral nikoho, kdo by nás zastupoval v tomto novém podniku. Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_1'))] [courtier_1.GetTitledFirstName] je [courtier_1.Custom('quirk_pos_adjective')] člověk s" # todo: NEW TRANSLATION
 gdp_merchant.0015.desc_good_intellect: "rozumným intelektem. Kdo ví, možná nás [courtier_1.GetSheHe] překvapí skrytým talentem." # todo: NEW TRANSLATION
 gdp_merchant.0015.desc_excellent_intellect: "vynikajícím intelektem. Snadno si lze představit, jak [courtier_1.GetHerHim] dělá čest našemu rodu." # todo: NEW TRANSLATION
 gdp_merchant.0015.desc_poor_intellect: "slabým intelektem. Možná by tato příležitost mohla [courtier_1.GetHerHim] přimět, aby zdokonalil [Select_CString(courtier_1.IsFemale,'její','jeho')] schopnosti." # todo: NEW TRANSLATION
 gdp_merchant.0015.a: "[courtier_1.GetFirstNameNoTooltip] [courtier_1.GetWomanMan] by se na tu práci mohl hodit..." # todo: NEW TRANSLATION
 gdp_merchant.0015.b: "...ale [courtier_2.GetFirstNameNoTooltip] by se možná hodil víc." # todo: NEW TRANSLATION
 gdp_merchant.0015.c: "Svůj talent si musím držet blízko." # todo: NEW TRANSLATION
 gdp_merchant.0015.c.fallback: "Ne. Potřebuji tu všechny." # todo: NEW TRANSLATION
 gdp_merchant.0015.c.tt: "Zahájíš svou [Concept('trade_route','obchodní trasu')|E] bez přiděleného [Concept('trader','obchodníka')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.0020.t: "Obchodní partner" # todo: NEW TRANSLATION
 gdp_merchant.0020.desc: "Hlava rodinného podniku je jen tak dobrá jako šíje, která jí obrací pohled k novým příležitostem." # todo: NEW TRANSLATION
 gdp_merchant.0020.desc.partner_exists: "Můj partner [old_holder.GetFirstName], který měl tento úkol zastávat, soustavně plýtvá naším časem i zlatem na bezvýsledné podniky." # todo: NEW TRANSLATION
 gdp_merchant.0020.desc.fallback: "Momentálně nemám nikoho, kdo by tuto roli zastával a byl mi po boku jako partner." # todo: NEW TRANSLATION
 gdp_merchant.0020.desc.body: "Napětí ve společnosti je hmatatelné a všichni, kdo mají alespoň trochu ctižádosti, se hádají a předvádějí.\n\n" # todo: NEW TRANSLATION
 gdp_merchant.0020.desc.outro_three: "Mezi nimi jsou [candidate_2.GetTitledFirstName] a [candidate_3.GetTitledFirstName], kteří přísahají neochvějnou věrnost, aby získali místo u stolu.\n\nUdělají všechno pro to, aby se protlačili před [candidate_1.GetTitledFirstName], který je zjevně převyšuje." # todo: NEW TRANSLATION
 gdp_merchant.0020.desc.outro_two: "Mezi nimi je [candidate_2.GetTitledFirstName], který přísahá [Select_CString(candidate_2.IsFemale,'její','jeho')] neochvějnou věrnost, aby získal místo u stolu.\n\n[candidate_2.GetSheHe|U] udělá všechno [candidate_2.GetSheHe], co může, aby se protlačil před [candidate_1.GetTitledFirstName], který [candidate_2.GetHerHis] zjevně převyšuje." # todo: NEW TRANSLATION
 gdp_merchant.0020.desc.outro_one: "Mezi nimi je [candidate_1.GetTitledFirstName], který přísahal [Select_CString(candidate_1.IsFemale,'její','jeho')] neochvějnou věrnost, aby získal místo u stolu.\n\n[candidate_1.GetSheHe|U] udělá všechno [candidate_1.GetSheHe], co může, aby se protlačil na [Select_CString(candidate_1.IsFemale,'její','jeho')] cestě před každého, kdo by se mohl postavit mezi [candidate_1.GetHerHim] a tuto práci." # todo: NEW TRANSLATION
 gdp_merchant.0020.a: "[candidate_1.GetFirstNameNoTooltip] si zaslouží šanci." # todo: NEW TRANSLATION
 gdp_merchant.0020.a.custom: "Každý další kandidát" # todo: NEW TRANSLATION
 gdp_merchant.0020.b: "[candidate_2.GetFirstNameNoTooltip] by měl dostat příležitost." # todo: NEW TRANSLATION
 gdp_merchant.0020.c: "[candidate_3.GetFirstNameNoTooltip] si to zaslouží nejvíc." # todo: NEW TRANSLATION
 gdp_merchant.0020.d: "Tito lidé už mají své úkoly..." # todo: NEW TRANSLATION
 gdp_merchant.0020.d.custom: "Každý kandidát" # todo: NEW TRANSLATION
 merchant_unity_partner_gain: "zaměstnal člena rodu jako partnera" # todo: NEW TRANSLATION
 merchant_unity_partner_loss: "zaměstnal cizince jako partnera" # todo: NEW TRANSLATION
 gdp_merchant.0025.t: "Vážení řemeslníci" # todo: NEW TRANSLATION
 gdp_merchant.0025.desc: "„Dobrý den, [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetFirstNameNoTooltip],“ ozve se z nedaleké koželužny neznámý hlas. Jdu za zvukem a dávám pozor, abych nešlápl do kaluže z barvířských kádí.\n\nNež se naději, stojím tváří v tvář... zdechlině? Její lovec se na mě usměje a hrdě vystaví [Select_CString(traveler.IsFemale,'její','jeho')] trofej, zatímco [traveler.GetSheHe] se jí chlubí.\n\n„[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U] je široko daleko známé jako sídlo vynikajících řemeslníků. Jistě tedy víte, že kvalita prodávaného zboží závisí na dostupném materiálu. Jako lovec se živím obstaráváním těch nejlepších surovin pro vážené zákazníky, jako jste vy.“" # todo: NEW TRANSLATION
 gdp_merchant.0025.a: "„Uvažoval jste o obchodování ve větším měřítku?“" # todo: NEW TRANSLATION
 gdp_merchant.0025.b: "„Jen pokračujte...“" # todo: NEW TRANSLATION
 merchant_unity_artisan_recruit_loss: "najali cizince" # todo: NEW TRANSLATION
 merchant_unity_artisan_recruit_decline_gain: "dozvěděli se o luxusních materiálech" # todo: NEW TRANSLATION
 gdp_merchant.0030.t: "Síla, se kterou je třeba počítat" # todo: NEW TRANSLATION
 gdp_merchant.0030.desc: "„[ROOT.Char.GetTitleAsNameNoTooltip|U] [ROOT.Char.GetFirstNameNoTooltip], podívejte se sem!“ zaslechnu vykřiknout [traveler.GetWomanMan].\n\nOtočím se a spatřím kováře, jak na mě mává od [Select_CString(traveler.IsFemale,'její','jeho')] pracoviště. Když k [traveler.GetHerHim] dojdu, nemohu si nevšimnout, jak [traveler.GetSheHe] kroutí a napíná [Select_CString(traveler.IsFemale,'její','jeho')] tělo a nastavuje [traveler.GetHerHim] se tak, aby světlo výhně ozářilo [Select_CString(traveler.IsFemale,'její','jeho')] svaly...\n\n„Tak dlouho jsem čekal, až vás potkám. Jelikož si vaše společnost vydobyla #EMP úctyhodnou#! pověst díky tomu, jak drtí konkurenci, rád bych vám nabídl své pěsti. Dokážu rozbíjet hlavy, ovládat meč, cokoli budete potřebovat.“" # todo: NEW TRANSLATION
 gdp_merchant.0030.a: "„Líbí se mi tvé nadšení.“" # todo: NEW TRANSLATION
 gdp_merchant.0030.b: "„#EMP Ehm...#! Ukaž mi víc ze své práce.“" # todo: NEW TRANSLATION
 merchant_unity_creditor_recruit_loss: "najali cizince" # todo: NEW TRANSLATION
 merchant_unity_creditor_recruit_decline_gain: "odmítli dotěrného fanatika společnosti" # todo: NEW TRANSLATION
 gdp_merchant.0035.t: "Pověst sahající do dálav" # todo: NEW TRANSLATION
 gdp_merchant.0035.desc: "Neobvykle hlasité volání odvede mou pozornost od účetních knih přede mnou.\n\nVyjdu z kanceláře [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] a setkám se s bystrozrakým obchodníkem, jehož [Select_CString(traveler.IsFemale,'její','jeho')] šaty pokrývá několikadenní vrstva prachu.\n\n„Rád vás poznávám, [ROOT.Char.GetTitledFirstNameNoTooltip],“ říká [traveler.GetSheHe]. „Všichni na cestách znají vaše jméno a každý, koho jsem potkal, mi říká, že jste [ROOT.Char.GetWomanMan], kterého musím poznat. Doufal jsem, že mě od nynějška necháte cestovat pod svým jménem.“" # todo: NEW TRANSLATION
 gdp_merchant.0035.a: "„Vždyť se zdáte být zcela schopný!“" # todo: NEW TRANSLATION
 gdp_merchant.0035.b: "„Raději bych slyšel zprávy o vzdáleném obchodu.“" # todo: NEW TRANSLATION
 merchant_unity_caravaneer_recruit_loss: "najali cizince" # todo: NEW TRANSLATION
 merchant_unity_caravaneer_recruit_decline_gain: "dozvěděli se o vzdálených trzích" # todo: NEW TRANSLATION
 gdp_merchant.0101.t: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U]" # todo: NEW TRANSLATION
 gdp_merchant.0101.desc_republic: "[ROOT.Char.Custom('GetRegionalUrbanEliteTermPlural')] byli pesimističtí, ale nakonec jsme dostali souhlas [recipient.GetTitledFirstNamePossessive] s naší žádostí a nyní všichni jásají! Konečně budeme mít vlastní město, republiku, které budeme vládnout podle svého!\n\nBudu prvním [ROOT.Char.GetTitleAsNameNoTooltip] z [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]," # todo: NEW TRANSLATION
 gdp_merchant.0101.liege: "budu spravovat [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] a jeho okolí jako poddanské město, závislé a zavázané našim [new_liege.GetPrimaryTitle.GetAdjectiveNoTooltip] pánům." # todo: NEW TRANSLATION
 gdp_merchant.0101.independent: "budu spolu s ostatními významnými místními rody spravovat [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] a jeho okolí jménem lidu." # todo: NEW TRANSLATION
 gdp_merchant.0101.republic: "\n\nPo mnoha dohodách a jednáních může velký rod [ROOT.Char.GetHouse.GetBaseNameNoTooltip] konečně vybudovat trvalý odkaz..." # todo: NEW TRANSLATION
 gdp_merchant.0101.a: "Pro lid [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetBaseNameNoTierNoTooltip] začíná nová éra!" # todo: NEW TRANSLATION
 gdp_merchant.0102.desc: "Velmi mě potěšilo, když jsem se dozvěděl, že jste naši žádost přijali!\n\nZlato už bylo odesláno a připravujeme listinu pro [actor.GetPrimaryTitle.GetName]," # todo: NEW TRANSLATION
 gdp_merchant.0102.liege: "které budeme spravovat jako vaši pokorní poddaní." # todo: NEW TRANSLATION
 gdp_merchant.0102.top_liege: "které budeme spravovat pod vládou [new_liege.GetTitledFirstName]." # todo: NEW TRANSLATION
 gdp_merchant.0102.independent: "a které budeme spravovat jako nezávislé město." # todo: NEW TRANSLATION
 gdp_merchant.0103.desc: "To je směšný návrh. Myslíš si snad vážně, že jsou mé tituly na prodej? A takovému ubohému [actor.GetWomanMan], jako jsi #EMP ty?!#!" # todo: NEW TRANSLATION
 gdp_merchant.0110.t: "$merge_company_interaction$: [actor.GetHouse.GetNameNoTooltip]-[recipient.GetHouse.GetNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant.0110.desc: "Po dlouhém jednání [recipient.GetTitledFirstName] neskrývá [Select_CString(recipient.IsFemale,'její','jeho')] zájem o mou velkorysou nabídku spojit naše dvě společnosti a rody.\n\n[recipient.GetSheHe||U] přikývne," # todo: NEW TRANSLATION
 gdp_merchant.0110.desc.personality.ai_honor: "„Zdá se, že v této věci nemám na výběr. Přesto dodržím naši dohodu a budu sloužit vašim zájmům stejně věrně jako svým vlastním.“" # todo: NEW TRANSLATION
 gdp_merchant.0110.desc.personality.ai_zeal: "„Věřím, že nám [recipient.GetFaith.WealthGodName] ukázal tuto cestu.“" # todo: NEW TRANSLATION
 gdp_merchant.0110.desc.personality.ai_greed: "„Prostudoval jsem vaše i naše účetní knihy. S takovými čísly mi nezbývá než vaši nabídku přijmout.“" # todo: NEW TRANSLATION
 gdp_merchant.0110.desc.personality.ai_compassion: "„Poradil jsem se se společností a věříme, že toto spojení našich společností prospěje nám všem.“" # todo: NEW TRANSLATION
 gdp_merchant.0110.desc.personality.ai_boldness: "„Přijímám váš návrh. Už mezi námi nemusí panovat žádné pochybnosti.“" # todo: NEW TRANSLATION
 gdp_merchant.0110.desc.personality.ai_rationality: "„Zvážil jsem naše zisky oproti ceně za odmítnutí vaší nabídky. Přijímám.“" # todo: NEW TRANSLATION
 gdp_merchant.0110.desc.personality.ai_vengefulness: "„Nenecháváte mi na výběr. Zahrál jste své karty dobře a toto kolo vyhráváte.“" # todo: NEW TRANSLATION
 gdp_merchant.0110.desc.personality.ai_energy: "„Přijímám. Ať vaši písaři připraví smlouvu a co nejrychleji mi ji pošlou!“" # todo: NEW TRANSLATION
 gdp_merchant.0110.desc.personality.ai_sociability: "„Společnost [recipient.GetHouse.GetBaseNameNoTooltip] přijímá vaše podmínky. Bude mi chybět obchodování pod vlastním jménem, ale není moudré lpět na hrdosti.“" # todo: NEW TRANSLATION
 gdp_merchant.0110.desc.personality.ai_personality_fallback: "„Po dlouhém přemýšlení přijímám váš návrh na spojení našich zájmů.“" # todo: NEW TRANSLATION
 gdp_merchant.0110.desc.closing: "\n\n„Naše obchodní trasy jsou zrušeny podle dohody a jméno [recipient.GetHouse.GetBaseNameNoTooltip] bude od nynějška sloužit vaší společnosti.“" # todo: NEW TRANSLATION
 gdp_merchant.0110.a: "Trhy [recipient.GetHouse.GetBaseNameNoTooltip] jsou naše!" # todo: NEW TRANSLATION
 gdp_merchant.0111.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]" # todo: NEW TRANSLATION
 gdp_merchant.0111.desc: "Zapomínáte, kdo jste, a na význam [actor.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip]. [recipient.GetPrimaryTitle.GetDefinitiveNameNoTooltip] se nikdy nepodřídí vašim malicherným zájmům." # todo: NEW TRANSLATION
 gdp_merchant.0111.a: "Tento podnik se ukázal jako špatně promyšlený." # todo: NEW TRANSLATION
 gdp_purpose_events.0001.opening: "[merchant.Custom2('AppropriateGreetingPositive', ROOT.Char)]" # todo: NEW TRANSLATION
 gdp_purpose_events.0001.desc: "Kolují zvěsti, že panství [indebted_ruler.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] zoufale potřebuje finanční pomoc. Mohl bych být tím, kdo situaci vyřeší... Samozřejmě výměnou za laskavost." # todo: NEW TRANSLATION
 gdp_purpose_events.0001.a: "To by mohla být moje cesta ven..." # todo: NEW TRANSLATION
 gdp_purpose_events.0001.a.tt: "[merchant.GetFirstName] zváží tvůj návrh." # todo: NEW TRANSLATION
 gdp_purpose_events.0001.b: "Ta drzost!" # todo: NEW TRANSLATION
 gdp_purpose_events.0002.opening: "[indebted_ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]" # todo: NEW TRANSLATION
 gdp_purpose_events.0002.desc: "Žádám tě v této těžké době o finanční pomoc. Stanov si podmínky a já je neodmítnu, pokud se přiměješ je sepsat." # todo: NEW TRANSLATION
 gdp_purpose_events.0002.a: "Sepiš smlouvu, i s úroky." # todo: NEW TRANSLATION
 gdp_purpose_events.0002.a.sin: "Sepiš smlouvu, i s lichvářskými úroky." # todo: NEW TRANSLATION
 gdp_purpose_events.0002.c: "Sepiš ji tak, aby ji nikdo nemohl nazvat lichvou." # todo: NEW TRANSLATION
 gdp_purpose_events.0002.d: "Pošli zlato a nic za něj nechtěj." # todo: NEW TRANSLATION
 gdp_purpose_events.0002.b: "Musím zdvořile odmítnout..." # todo: NEW TRANSLATION
 gdp_purpose_events.0002_notification: "Půjčka úspěšně sjednána" # todo: NEW TRANSLATION
 gdp_purpose_events.0002_fail_notification: "Půjčka odmítnuta" # todo: NEW TRANSLATION
 fund_maa: "Na financování [Concept('men_at_arms','ozbrojence')|E] [Concept('regiment','pluk')|E] @stationed_regiment_icon!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 fund_mercenaries: "Na financování smlouvy s [mercenary_i|E][Concept('mercenary','žoldnéřem')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_purpose_events.0003.desc: "Je známo, že válka si na tvém panství vybírá svou daň. Jsem připraven podpořit tvé úsilí, pokud mi, můj [ruler.GetTitleAsNameNoTooltip], v budoucnu projevíš laskavost..." # todo: NEW TRANSLATION
 gdp_purpose_events.0003.a: "Potřebuji veškerou pomoc, jakou mohu dostat!" # todo: NEW TRANSLATION
 gdp_purpose_events.0003.b: "Laskavost? To bych nikdy neudělal!" # todo: NEW TRANSLATION
 no_thanks.tt: "Necháš si tuto příležitost uniknout..." # todo: NEW TRANSLATION
 gdp_purpose_events.0004.opening: "[ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]" # todo: NEW TRANSLATION
 gdp_purpose_events.0004.desc: "Nerad ti píšu, ale mé panství by ve válce, které čelíme, potřebovalo tvou podporu. Jsem připraven ti v budoucnu projevit laskavost, pokud mi pomůžeš." # todo: NEW TRANSLATION
 gdp_purpose_events.0004.a: "Mohl bych ti nabídnout nový specializovaný pluk!" # todo: NEW TRANSLATION
 gdp_purpose_events.0004.b: "Mohu podmazat pár známých..." # todo: NEW TRANSLATION
 gdp_merchant.1002.t: "Založení společnosti" # todo: NEW TRANSLATION
 gdp_merchant.1002.desc: "Na stole přede mnou leží prázdná účetní kniha. Otevřeným oknem doléhají do kanceláře [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')|l] zvuky zdejšího [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')]: smlouvání o obchodech, skřípání kol vozů a pokřikování zvířat z ohrad.\n\nStudovna je skromná, slabě osvětlená a ponurá — nemohu v tom soupeřit s obchodníky z [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] sám. Neměl bych najmout někoho, kdo by společnosti pomohl?" # todo: NEW TRANSLATION
 gdp_merchant.1002.a: "Potřebuji lidi, kteří rozumějí obchodu." # todo: NEW TRANSLATION
 gdp_merchant.1002.a.tt: "Začínáš se dvěma [Concept('associates','společníkům')|E] zběhlými ve [Concept('stewardship','správcovství')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.1002.b: "Naše protivníky zastrašíme." # todo: NEW TRANSLATION
 gdp_merchant.1002.b.tt: "Začínáš se dvěma [Concept('associates','společníkům')|E] zběhlými ve [Concept('martial','válečnictví')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.1002.c: "Zdatní vyjednavači uzavírají výhodné obchody." # todo: NEW TRANSLATION
 gdp_merchant.1002.c.tt: "Začínáš se dvěma [Concept('associates','společníkům')|E] zběhlými v [Concept('diplomacy','diplomacii')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.1002.d: "O učence tu není nouze!" # todo: NEW TRANSLATION
 gdp_merchant.1002.d.tt: "Začínáš se dvěma [Concept('associates','společníkům')|E] zběhlými v [Concept('learning','učenosti')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.1002.e: "Díky důvtipu získáme výhodu." # todo: NEW TRANSLATION
 gdp_merchant.1002.e.tt: "Začínáš se dvěma [Concept('associates','společníkům')|E] zběhlými v [Concept('intrigue','pletichářství')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.1002.f: "Ne, nikoho nepotřebuji." # todo: NEW TRANSLATION
 gdp_merchant.1002.f.tt.difficulty: "@alert_icon! #alert_trial Dokud nezískáš [Concept('associates','společníci')|E], mohou pro tebe být [Concept('task_contracts','zakázky')|E] obtížné, nebo dokonce nesplnitelné#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.1002.f.tt.associates: "Začínáš bez [Concept('associates','společníků')|E] — máš pouze [Concept('family','rodina')|E] a [Concept('friends','přátelé')|E], které už máš" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.1003.t: "Založení společnosti" # todo: NEW TRANSLATION
 gdp_merchant.1003.desc: "Přede mnou se rozprostírá [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')], plný nekonečných zástupů lidí. Ani na okamžik neutichá uzavírání obchodů a [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] mění majitele.\n\nObchodní ruch je všude: kola vozů skřípou, z přeplněných ohrad se ozývají zvířata a moji kolegové obchodníci v pozadí halekají ve snaze předběhnout konkurenci.\n\nZboží všeho druhu tu přechází z ruky do ruky — mám-li soupeřit s mnoha obchodníky, neměl bych zaměřit své úsilí na něco konkrétního?" # todo: NEW TRANSLATION
 gdp_merchant.1003.a: "„Zajištění hromadné přepravy je klíčové.“" # todo: NEW TRANSLATION
 gdp_merchant.1003.b: "„Musíme využít toho, jak nás [ROOT.Char.GetSuzerain.GetTitleAsNamePossessiveNoTooltip] vnímá.“" # todo: NEW TRANSLATION
 gdp_merchant.1003.b.tt: "Bude vytvořena [Concept('patron_contract','zakázka patrona')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.1003.c: "„Jsme obchodníci. Zisk je nade vše.“" # todo: NEW TRANSLATION
 gdp_merchant.1100.t: "Přeplněná společnost" # todo: NEW TRANSLATION
 gdp_merchant.1100.desc: "Můj [ROOT.Char.Custom2('RelationToMe', plaintiff)], [plaintiff.GetTitledFirstName], za mnou přichází do studovny a zvažuje [Select_CString(plaintiff.IsFemale,'její','jeho')] slova. „[ROOT.Char.GetFirstNameNoTooltip]... tohle má být rodinný podnik, ale stále více se spoléháme na cizí lidi.“\n\n„[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] by se mělo zbavit přebytečné zátěže, chceme-li si zachovat důstojnost.“" # todo: NEW TRANSLATION
 gdp_merchant.1100.a: "„[associate_2.GetFirstNameNoTooltip] už není potřeba.“" # todo: NEW TRANSLATION
 gdp_merchant.1100.b: "„Je načase se rozejít s [associate_1.GetFirstNameNoTooltip].“" # todo: NEW TRANSLATION
 gdp_merchant.1100.c: "„Ano, ‚zbavme se přebytečné zátěže‘...“" # todo: NEW TRANSLATION
 gdp_merchant.1100.d: "„Nesmysl, potřebujeme veškerou pomoc, kterou můžeme dostat.“" # todo: NEW TRANSLATION
 merchant_overcrowding_ignored_loss: "[Select_CString(ROOT.Char.IsFemale,'ignorovala','ignoroval')] přeplněnost společnosti" # todo: NEW TRANSLATION
 merchant_overcrowding_fired_gain: "[Select_CString(ROOT.Char.IsFemale,'propustila','propustil')] spolčence kvůli přeplněnosti" # todo: NEW TRANSLATION
 merchant_overcrowding_yeet_gain: "[Select_CString(ROOT.Char.IsFemale,'propustila','propustil')] spolčence kvůli přeplněnosti" # todo: NEW TRANSLATION
 gdp_merchant.1200.t: "Žádost spolčence" # todo: NEW TRANSLATION
 gdp_merchant.1200.desc: "Po dlouhém dni stráveném nad účetními knihami přistihnu u dveří svého [ROOT.Char.Custom2('RelationToMe', requester)], [requester.GetTitledFirstName], jak na mě čeká. „Ach, [ROOT.Char.Custom2('RelationToMeAddress', requester)]! Už dlouho jsem se tě chtěl na něco zeptat...“\n\n" # todo: NEW TRANSLATION
 gdp_merchant.1200.desc.artifact: "„Společnosti se pod tvým vedením tak daří a v jejích knihách se objevuje tolik cenných předmětů. Nenapadlo by tě... nechat mi jeden?“" # todo: NEW TRANSLATION
 gdp_merchant.1200.desc.activity: "„Společnost tvrdě pracuje a ty ji dobře vedeš, ale neměli bychom už naše úspěchy oslavit nějakou nezapomenutelnou událostí?“" # todo: NEW TRANSLATION
 gdp_merchant.1200.desc.luxury_contract: "„Obchodní stezky společnosti pod tvým vedením vzkvétají, ale na světě musí být tolik divů, které jen čekají, až je někdo objeví...“" # todo: NEW TRANSLATION
 gdp_merchant.1200.a: "„Dobrá, uvidím, co se dá dělat.“" # todo: NEW TRANSLATION
 gdp_merchant.1200.b: "„Ale no tak, mám na práci důležitější věci.“" # todo: NEW TRANSLATION
