 gdp_merchant_unity_noble_marriage_desc: "uzavřel sňatek se členem šlechtického [Concept('house','rodu')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.2000.t: "Prázdný trh: [needed_good.GetNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant.2000.desc.intro: "Když procházím " # todo: NEW TRANSLATION
 gdp_merchant.2000.desc.disaster: "zkázou postiženými " # todo: NEW TRANSLATION
 gdp_merchant.2000.desc.war: "válkou zpustošenými " # todo: NEW TRANSLATION
 gdp_merchant.2000.desc.plague: "morem sužovanými " # todo: NEW TRANSLATION
 gdp_merchant.2000.desc.unrest: "nepokojnými " # todo: NEW TRANSLATION
 gdp_merchant.2000.desc.stalls: "ulicemi [CZPrepV(starving_province.GetNameNoTooltip)] [CZProvName(starving_province,'L')], všímám si, že obvykle přeplněné [starving_province.Custom('GetRegionalMarketTermGloss')] ztichlo.\n\nStánky s jídlem jsou téměř prázdné, jen tu leží pár oschlých [ROOT.Char.Custom('GetLocalStreetFoodPlural')] a shnilých [ROOT.Char.Custom('RegionalRootVegetablePlural')]. Vyhublí muži a ženy přehrabují hromady odpadků na okrajích ulice." # todo: NEW TRANSLATION
 gdp_merchant.2000.a: "Měl bych si dobře střežit to málo, co zbylo." # todo: NEW TRANSLATION
 gdp_merchant.2000.b: "Lidé si najdou někoho, koho budou moct obvinit." # todo: NEW TRANSLATION
 gdp_merchant.2000.c: "To není můj problém." # todo: NEW TRANSLATION
 gdp_merchant.2010.t: "Monopol na [craft_monopoly.GetTradeGoodCategoryType.GetNameNoTooltip]:" # todo: NEW TRANSLATION
