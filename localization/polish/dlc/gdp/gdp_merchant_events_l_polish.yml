 gdp_merchant.8021.t: "$merchant_company_caravaneer_capstone_01_domicile_building$: Zvědavý návštěvník" # todo: NEW TRANSLATION
 gdp_merchant.8021.suzerain: "Je mi velkou ctí, když mě navštíví můj patron [visitor.GetTitledFirstName]," # todo: NEW TRANSLATION
 gdp_merchant.8021.merchant: "[visitor.GetTitledFirstName], spřátelený obchodník a majitel [visitor.GetPrimaryTitle.GetDefinitiveName]," # todo: NEW TRANSLATION
 gdp_merchant.8021.laamp: "[visitor.GetTitledFirstName], vůdce kočovné skupiny, která si říká [visitor.GetPrimaryTitle.GetDefinitiveName]," # todo: NEW TRANSLATION
 gdp_merchant.8021.ruler: "Příjemně mě překvapí, když se objeví místní vládce [visitor.GetTitledFirstName]," # todo: NEW TRANSLATION
 gdp_merchant.8021.fallback: "[visitor.GetTitledFirstName], prostý cestovatel," # todo: NEW TRANSLATION
 gdp_merchant.8021.desc: "a zastaví se v mém sídle.\n\n[visitor.GetSheHe|U] se rozzáří, když je [visitor.GetSheHe] vedená na prohlídku naší sbírky, a rozhlíží se kolem [visitor.GetHerHim], očividně uchvácená.\n\n„Rád vás poznávám, [ROOT.Char.GetTitledFirstNameNoTooltip]! Slyšel jsem o výpravách vaší společnosti i o vaší exotické sbírce... mohl bych vás poprosit o chvilku sto-“ [visitor.GetSheHe] zalapá po dechu, protože [artifact.GetName] upoutá pozornost.\n\n„Ach! Co to tu máte...?“" # todo: NEW TRANSLATION
 gdp_merchant.8021.curio: "[visitor.GetSheHe|U] si jej prohlíží ze všech stran a chce znát celý jeho příběh, než [visitor.GetSheHe] bude spokojená." # todo: NEW TRANSLATION
 gdp_merchant.8021.library: "[visitor.GetSheHe|U] opatrně listuje stránkami, zatímco [visitor.GetSheHe] klade nespočet otázek." # todo: NEW TRANSLATION
 gdp_merchant.8021.creature: "[visitor.GetSheHe|U] obdivuje jeho půvab a s potěšením sleduje, jak dostává najíst." # todo: NEW TRANSLATION
 gdp_merchant.8021.a: "Ano, je to opravdu pozoruhodný kousek." # todo: NEW TRANSLATION
 gdp_merchant.8021.b: "Chtěl bys ho?" # todo: NEW TRANSLATION
 gdp_merchant.9021.opening: "Zdravím vás, vážený [merchant.GetTitledFirstNameNoTooltip]," # todo: NEW TRANSLATION
 gdp_merchant.9021.diarch.desc: "Jakožto [commissioner.GetDiarchTitle] [commissioner.GetName] bych rád zadal [merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] zakázku." # todo: NEW TRANSLATION
 gdp_merchant.9021.no_diarch.desc: "Rád bych zadal [merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] zakázku." # todo: NEW TRANSLATION
 gdp_merchant.9021.desc: "\n\nV [trade_market.GetName|l] je nedostatek zboží [target.GetName]. Dovezte je do oblasti a dostanete za to spravedlivě zaplaceno." # todo: NEW TRANSLATION
 gdp_merchant.9021.a: "Zakázku přijímám." # todo: NEW TRANSLATION
 gdp_merchant.9021.b: "Musím s úctou odmítnout." # todo: NEW TRANSLATION
 gdp_merchant.9021.b.cooldown_tt: "Další žádost o [Concept('commission','zakázku')|E] dostaneš za #V [EmptyScope.ScriptValue('commission_trade_route_merchant_cooldown_years_value')]#! let" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.9005.t: "Vyhnáni" # todo: NEW TRANSLATION
 gdp_merchant.9005.desc_intro: "Můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))] [courtier.GetTitledFirstName] vtrhne do kanceláře [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] s [Select_CString(courtier.IsFemale,'jejími','jeho')] tvářemi rudými rozčilením.\n\n„Přináším zprávu od našeho patrona, [expeller.GetTitledFirstName],“ říká [courtier.GetSheHe]. „Naše společnost musí uzavřít účty a okamžitě opustit [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]!“\n\n" # todo: NEW TRANSLATION
 gdp_merchant.9005.desc_intro.fallback: "[expeller.GetTitledFirstName|U] nařídila, aby [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] opustila [expeller.GetPrimaryTitle.GetDefinitiveNameNoTooltip].\n\n" # todo: NEW TRANSLATION
 gdp_merchant.9005.desc_body.dealbreaker: "[expeller.GetTitledFirstNamePossessiveNoTooltip] důvěra v nás se vytratila." # todo: NEW TRANSLATION
 gdp_merchant.9005.desc_body.enemies: "Má [expeller.GetTitledFirstNamePossessiveNoTooltip] nepřátelství nějaké meze?" # todo: NEW TRANSLATION
 gdp_merchant.9005.desc_body.fallback: "Po tom všem, co jsme tu vykonali..." # todo: NEW TRANSLATION
 gdp_merchant.9005.a: "Tak to tedy dopadlo." # todo: NEW TRANSLATION
 gdp_merchant.9005.a.tt: "Tvoje [Concept('company','společnost')|E] opustí [Concept('realm','panství')|E] [expeller.Custom('CZ_ShortUIName_G')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.9100.t: "Patricijský rod [ROOT.Char.GetHouse.GetBaseNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant.9100.desc: "Když jsme dostatečně prokázali svou hodnotu před zpupnými rody [new_patrician_liege.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] a poskytli [new_patrician_liege.Custom('CZ_TitledFirstName_D')] ty správné #emp pobídky#!, je jisté, že bude mé žádosti o povýšení vyhověno.\n\nKonečně mám v rukou listiny, které nade vši pochybnost potvrzují, že [ROOT.Char.GetHouse.GetBaseName] není pouhým kupeckým rodem, ale zasedá mezi ostatními váženými patricijskými rody v shromáždění tohoto [new_patrician_liege.GetPrimaryTitle.GetTierAsNameNoTooltip], a podle zákona se dokonce rovná rodu [new_patrician_liege.GetHouse.GetBaseName]!" # todo: NEW TRANSLATION
 gdp_merchant.9100.a: "Už se nemohu dočkat svého prvního zasedání ve shromáždění." # todo: NEW TRANSLATION
 merchant_patrician_transition_domicile_tt: "Tvé [Concept('domicile_buildings','budovy domicilu')|E] byly zachovány" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant.9110.t: "Kupecký rod [ROOT.Char.GetHouse.GetBaseNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant.9110.desc: "Se zánikem staré republiky se [ROOT.Char.GetHouse.GetBaseName] a ostatní hrdé patricijské rody [new_merchant_location.GetBaronyNameExplicitly] proměnily v pouhé kupecké rody, vydané napospas rozmarům osudu i místního vládce, [ROOT.Char.GetSuzerain.Custom('CZ_TitledFirstName_G')].\n\nBez našeho shromáždění a ochrany republiky musíme důvěřovat zákonům [ROOT.Char.GetSuzerain.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')], chceme-li si uchovat alespoň zdání někdejšího postavení." # todo: NEW TRANSLATION
 gdp_merchant.9110.a: "Jak to jen mohlo dojít tak daleko..." # todo: NEW TRANSLATION
