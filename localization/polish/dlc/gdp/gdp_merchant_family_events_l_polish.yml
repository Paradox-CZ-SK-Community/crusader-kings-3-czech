 gdp_merchant_family.9140.t: "Tržní zboží" # todo: NEW TRANSLATION
 gdp_merchant_family.9140.desc: "Ve vydýchaných kancelářích v [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitly] se učím o obchodních cestách, na nichž [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] vydělává své jmění, nebo se o to alespoň snaží. Je tolik míst a zboží, které si musím zapamatovat.\n\nZ denního snění mě vytrhne [associate.GetFirstName], který klepe [associate.GetHerHis] [ROOT.Char.Custom('WritingInstrument')] na stůl. „Pojď sem, [ROOT.Char.Custom('GirlBoy')]! Jaký z tebe bude [ROOT.Char.GetTitleAsNameNoTooltip], když se nenaučíš nic o našem podnikání!“" # todo: NEW TRANSLATION
