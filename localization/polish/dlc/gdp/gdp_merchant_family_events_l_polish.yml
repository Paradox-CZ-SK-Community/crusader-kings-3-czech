 gdp_merchant_family.9140.a.tt: "Po dosažení plnoletosti získá [merchant.GetPrimaryTitle.GetDefinitiveName|l] #V 450#! [category_1.GetNameWithIcon] [Concept('trade_expertise','obchodní zkušenost')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_family.9140.b: "„Obchodování s [category_2.Custom('GetTradeGoodCategory')] mě fascinuje.“" # todo: NEW TRANSLATION
 gdp_merchant_family.9140.b.tt: "Po dosažení plnoletosti získá [merchant.GetPrimaryTitle.GetDefinitiveName|l] #V 450#! [category_2.GetNameWithIcon] [Concept('trade_expertise','obchodní zkušenost')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_family.9140.c: "„Chci se dozvědět o přepravě [category_3.Custom('GetTradeGoodCategory')].“" # todo: NEW TRANSLATION
 gdp_merchant_family.9140.c.tt: "Po dosažení plnoletosti získá [merchant.GetPrimaryTitle.GetDefinitiveName|l] #V 450#! [category_3.GetNameWithIcon] [Concept('trade_expertise','obchodní zkušenost')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_family.9150.t: "Pravá ruka [partner.GetWomanMan|U]" # todo: NEW TRANSLATION
 gdp_merchant_family.9150.desc: "Dokud nedospěji, trávím většinu dne po boku obchodního partnera společnosti, [partner.GetFirstName]. Sleduji [Select_CString(partner.IsFemale,'její','jeho')] jednání a schůzky a snažím se pochytit vše, co se dá.\n\nJednoho dne se ke mně [partner.GetSheHe|U] po úmorném sezení nad účetními knihami otočí. „Daří se ti dobře, mladý [ROOT.Char.Custom('CZ_TitledFirstName_V')].“ [partner.GetSheHe|U] se zazubí a hodí mi minci. „Podnikání není snadné, ale na rozdíl od [ROOT.Char.GetSuzerain.Custom('GetGovernmentLegitimacyAdjective')] [ROOT.Char.GetSuzerain.Custom('CZ_TitledFirstName_G')] nás nad vodou drží jen naše vlastní úsilí.“" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [ROOT.Char.GetSuzerain.GetTitleAsName], [ROOT.Char.GetTitleAsName], [partner.GetHerHis]; navyše [ROOT.Char.GetSuze
 gdp_merchant_family.9150.a: "„Nezklamu tebe ani společnost.“" # todo: NEW TRANSLATION
 gdp_merchant_family.9150.b: "„Zasloužil ses o to víc než dost, [partner.GetFirstNameNoTooltip].“" # todo: NEW TRANSLATION
 gdp_merchant_family.9150.b.tt: "Po dobu následujících #V 10#! let: [GetCourtPositionType( 'partner_court_position' ).GetName()] [Concept('aptitude','způsobilost')|E] [partner.Custom('CZ_ShortUIName_G')]: #p +1#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
