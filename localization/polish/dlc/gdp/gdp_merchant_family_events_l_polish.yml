l_polish:
 gdp_merchant_family.0001.t: "[Select_CString(ROOT.Char.IsFemale,'Uprchlá','Uprchlý')] [house_member.Custom('GetBrideGroom')|U]" # todo: NEW TRANSLATION
 gdp_merchant_family.0001.desc: "Při noční potyčce přistihnu svého/svou [ROOT.Char.Custom2('RelationToMe', house_member)] [house_member.GetTitledFirstName], jak se přehrabuje v pokladně společnosti. Po [Select_CString(house_member.IsFemale,'její','jeho')] boku stojí [wedding_interest.GetWomanMan] a tichým hlasem [house_member.GetHerHim] pobízí, aby se [Select_CString(house_member.IsFemale,'dala','dal')] do pohybu.\n\n„Co to má znamenat?“ zeptám se a dvojice se ke mně otočí, pevně se držíc jeden druhého. Vzápětí poznám, že cizincem je [wedding_interest_house_head.GetTitledFirstNamePossessive] [wedding_interest_house_head.Custom2('RelationToMe', wedding_interest)].\n\n„Už tu déle nezůstaneme. Jed mezi našimi rody nás bude držet od sebe, a tak jsme se rozhodli odejít,“ řekne [house_member.GetTitledFirstNameNoTooltip]," # todo: NEW TRANSLATION
 gdp_merchant_family.0001.desc.stubborn_outro: "s hlavou vzdorně vztyčenou a rukou svírající [wedding_interest.GetTitledFirstNamePossessiveNoTooltip]." # todo: NEW TRANSLATION
 gdp_merchant_family.0001.desc.fallback_outro: "pouští [wedding_interest.GetTitledFirstNamePossessiveNoTooltip] ruku, ačkoliv je pro [house_member.GetHerHim] očividně bolestivé to udělat, a v tiché prosbě ke mně natahuje ruku." # todo: NEW TRANSLATION
 gdp_merchant_family.0001.a: "„Vezměte si zlato a jděte s mým požehnáním.“" # todo: NEW TRANSLATION
 gdp_merchant_family.0001.b: "„Co mohu udělat, abych vás oba [Select_CString(ROOT.Char.IsFemale,'přesvědčila','přesvědčil')], že máte zůstat?“" # todo: NEW TRANSLATION
 gdp_merchant_family.0001.b.success: "[wedding_interest.GetFirstName] se k tobě přidá" # todo: NEW TRANSLATION
 gdp_merchant_family.0001.b.failure: "[wedding_interest.GetFirstName] to neosloví" # todo: NEW TRANSLATION
 gdp_merchant_family.0001.c: "„Nikam #EMP nepůjdete#!!“" # todo: NEW TRANSLATION
 gdp_merchant_family.0002.t: "Krev není voda" # todo: NEW TRANSLATION
 gdp_merchant_family.0002.desc_intro: "Prohlížím si nejnovější zprávy o zisku, když dovnitř vtrhne [blood.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n„Tenhle [water.Custom('InsultAdjective')] [water.Custom('InsultNoun')] překračuje meze,“ vyštěkne [blood.GetSheHe]. „[water.GetSheHe] riskuje, nerespektuje hranice a z nás ostatních dělá naprosté hlupáky. " # todo: NEW TRANSLATION
 gdp_merchant_family.0002.desc_adopted: "To se na člena rodu [ROOT.Char.GetHouse.GetName] zrovna nesluší.„" # todo: NEW TRANSLATION
 gdp_merchant_family.0002.desc_associate: "To se na pouhého společníka naší společnosti zrovna nesluší.„" # todo: NEW TRANSLATION
 gdp_merchant_family.0002.desc_outro: "\n\nKdyž stížnosti konečně ustanou, vrátím se pohledem k účetní knize. Ať už je pravda cokoliv, [water.GetFirstNameNoTooltip] přináší zisk a výsledky se těžko zpochybňují." # todo: NEW TRANSLATION
 gdp_merchant_family.0002.a: "[water.GetFirstNameNoTooltip] se musí naučit [water.GetHerHis] místo." # todo: NEW TRANSLATION
 gdp_merchant_family.0002.a.unity_gain.desc: "[Select_CString(ROOT.Char.IsFemale,'upřednostnila','upřednostnil')] rodinu před zásluhami v podnikání" # todo: NEW TRANSLATION
 gdp_merchant_family.0002.b: "Vrať se, až budeš mít výsledky jako [water.GetFirstNamePossessiveNoTooltip]." # todo: NEW TRANSLATION
 gdp_merchant_family.0002.b.unity_loss.desc: "[Select_CString(ROOT.Char.IsFemale,'upřednostnila','upřednostnil')] zásluhy v podnikání před pokrevní rodinou" # todo: NEW TRANSLATION
 gdp_merchant_family.0002.c: "„Na tohle nemám čas…“" # todo: NEW TRANSLATION
 gdp_merchant_family.0003.t: "Žádná potupa nebude trpěna" # todo: NEW TRANSLATION
 gdp_merchant_family.0003.desc: "[offended.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně přistoupí a je zjevně [Select_CString(ROOT.Char.IsFemale,'rozčilená','rozčilený')].\n\n„Neuvěříš, co mi právě řekli,“ prohlásí [offended.GetSheHe]. „[offender.Custom2('MyCharacterIntroduction', ROOT.Char)] zřejmě [Select_CString(ROOT.Char.IsFemale,'považovala','považoval')] za zábavné mě urazit, a tím i náš rod.“\n\nUrážka je malicherná, ale úmyslná." # todo: NEW TRANSLATION
 gdp_merchant_family.0003.a: "Při [ROOT.Char.GetFaith.HighGodName], rod [offender.GetHouse.GetNameNoTooltip] se omluví!" # todo: NEW TRANSLATION
 gdp_merchant_family.0003.a.unity_gain.desc: "společně se [Select_CString(ROOT.Char.IsFemale,'postavila','postavil')] proti veřejné urážce" # todo: NEW TRANSLATION
 house_relation_reason_gdp_merchant_family.0003.a.relation_damage.desc_desc: "[target_char.GetShortUIName|U] veřejně [Select_CString(target_char.IsFemale,'urazila','urazil')] rod [target_char.GetShortUINamePossessive]" # todo: NEW TRANSLATION
 gdp_merchant_family.0003.b: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('offended'))|U], soustřeď se na to, co neříkají…" # todo: NEW TRANSLATION
 gdp_merchant_family.0003.b.unity_loss.desc: "[Select_CString(ROOT.Char.IsFemale,'odmítla','odmítl')] oplatit urážku stejnou mincí" # todo: NEW TRANSLATION
 gdp_merchant_family.0003.c: "Vyřeš to. Mám na práci jiné věci." # todo: NEW TRANSLATION
 gdp_merchant_family.0003.c.unity_loss.desc: "[Select_CString(ROOT.Char.IsFemale,'ignorovala','ignoroval')] urážku našeho rodu" # todo: NEW TRANSLATION
 gdp_merchant_family.0004.t: "Příznivá nabídka" # todo: NEW TRANSLATION
 gdp_merchant_family.0004.desc: "Když se vydám na poklidnou procházku, uslyším, jak mě přes dvůr oslovuje neznámý hlas. „Rád/a bych s vámi [Select_CString(ROOT.Char.IsFemale,'promluvila','promluvil')], [ROOT.Char.Custom('FormOfAddressForLiege')].“ [offer_2.GetFullName] stojí přímo přede mnou a promlouvá medovým hlasem.\n\n„[foreign_liege.Custom2('MyCharacterIntroduction', offer_2)|U] mě posílá s návrhem. Mám si vzít [offer.Custom2('YourCharacterIntroduction', ROOT.Char)] a posílit pouta mezi našimi rody.“ Při zvažování nabídky mimoděk zadržím dech.\n\n„Tak co na to říká [ROOT.Char.Custom('FormOfAddressForLiege')]?“" # todo: NEW TRANSLATION
 gdp_merchant_family.0004.a: "„Můj/Má [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('offer'))] bude poctěn/a.“" # todo: NEW TRANSLATION
 gdp_merchant_family.0004.b: "„Co kdybychom uzavřeli vzájemně výhodnou dohodu?“" # todo: NEW TRANSLATION
 house_relation_reason_gdp_merchant_family.0004.b.relation_improve.desc_desc: "[target_char.GetShortUIName|U] a [target_char.GetShortUINamePossessive] uzavřeli vzájemně výhodnou dohodu" # todo: NEW TRANSLATION
 gdp_merchant_family.0004.c: "„Musím s úctou odmítnout, ale můžete tu zůstat.“" # todo: NEW TRANSLATION
 gdp_merchant_family.0005.t: "Ostuda pro rod [ROOT.Char.GetHouse.GetNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_family.0005.desc: "[Select_CString(ROOT.Char.IsFemale,'Dozvěděla','Dozvěděl')] jsem se, že [wayward.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(ROOT.Char.IsFemale,'ztratila','ztratil')] zásadní zásilku pod [Select_CString(wayward.IsFemale,'jejích','jeho')] odpovědností. Pokud to nenapravíme, vážně to poškodí naši pověst. Zavolám [wayward.GetHerHim] do svých komnat, abych se [wayward.GetHerHim] na to [Select_CString(ROOT.Char.IsFemale,'zeptala','zeptal')].\n\n„Opravdu mě to mrzí, [wayward.Custom2('RelationToMe', ROOT.Char)], ale [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')] byste mi tu nehodu vyčítat. Moje vlastní krev, můj vlastní rod se mě snaží podkopat!“" # todo: NEW TRANSLATION
 gdp_merchant_family.0005.a: "„Proklínám tě, můj/moje [wayward.Custom('InsultAdjective')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('wayward'))]!“" # todo: NEW TRANSLATION
 gdp_merchant_family.0005.a.unity_loss.desc: "veřejně [Select_CString(ROOT.Char.IsFemale,'odsoudila','odsoudil')] člena rodu" # todo: NEW TRANSLATION
 gdp_merchant_family.0005.b: "„Vždy budeme stát při sobě.“" # todo: NEW TRANSLATION
 gdp_merchant_family.0005.b.unity_gain.desc: "[Select_CString(ROOT.Char.IsFemale,'rozhodla','rozhodl')] se čelit nepřízni osudu společně" # todo: NEW TRANSLATION
 gdp_merchant_family.0005.c: "„Vyřeš to.“" # todo: NEW TRANSLATION
 gdp_merchant_family.0010.t: "Váhy se naklánějí" # todo: NEW TRANSLATION
 gdp_merchant_family.0010.desc: "S hlasitým — #EMP PRÁSK#! — dopadnou bedny na zem a obvyklý ruch [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')] ustane. Otočím se a spatřím své dva společníky, [attacker.GetTitledFirstName] a [defender.GetTitledFirstName], na pokraji rvačky.\n\n„Dřu se pro tuhle rodinu až k smrti,“ řekne [attacker.GetTitledFirstNameNoTooltip] a [attacker.Custom('quirk_neg_present')], v očích mu šíleně žhnou vztekem. „Zatímco tahle neschopná [defender.GetWomanMan] se jen tak poflakuje po [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]. Jestli mě nezastavíš, přísahám, že [defender.GetHerHim] přivedu k rozumu.“" # todo: NEW TRANSLATION
 gdp_merchant_family.0010.a: "Takhle se moji společníci chovat nemohou." # todo: NEW TRANSLATION
 gdp_merchant_family.0010.a.tt.success: "Úspěšně zprostředkuješ smír" # todo: NEW TRANSLATION
 gdp_merchant_family.0010.a.tt.failure: "Smír zprostředkovat nedokážeš" # todo: NEW TRANSLATION
 gdp_merchant_family.0010.b: "Jen do toho, ukažte všem, jak si vyřizujeme účty." # todo: NEW TRANSLATION
 gdp_merchant_family.0010.c: "Budeš litovat, že jsi [Select_CString(ROOT.Char.IsFemale,'vztáhla','vztáhl')] ruku na [defender.GetTitledFirstNameNoTooltip]!" # todo: NEW TRANSLATION
 gdp_merchant_family.0010.d: "Dělejte si, co chcete." # todo: NEW TRANSLATION
 gdp_merchant_family.0010.tt.duel: "@alert_icon! #alert_trial [attacker.GetShortUIName] a [defender.GetShortUIName] se utkají ve společném souboji v [prowess_i][Concept('prowess','udatnosti')|E] a [martial_i][Concept('martial','válečnictví')|E]! Někdo bude [Select_CString(ROOT.Char.IsFemale,'zraněna','zraněn')]#!" # todo: NEW TRANSLATION
 merchant_unity_fight_stopped: "[Select_CString(ROOT.Char.IsFemale,'zastavila','zastavil')] vnitřní spory mezi členy společnosti" # todo: NEW TRANSLATION
 merchant_unity_fight_promoted: "[Select_CString(ROOT.Char.IsFemale,'podnítila','podnítil')] vnitřní spory mezi členy společnosti" # todo: NEW TRANSLATION
 gdp_merchant_family.0010.tt.attacker_won: "[attacker.GetFirstNameNoTooltip] vítězí" # todo: NEW TRANSLATION
 gdp_merchant_family.0010.tt.attacker_won.tt: "[Select_CString(attacker.IsFemale,'Zranila','Zranil')] [defender.GetFirstName]" # todo: NEW TRANSLATION
 gdp_merchant_family.0010.tt.defender_won: "[defender.GetFirstNameNoTooltip] vítězí" # todo: NEW TRANSLATION
 gdp_merchant_family.0010.tt.defender_won.tt: "V sebeobraně [Select_CString(defender.IsFemale,'zranila','zranil')] [attacker.GetFirstName]" # todo: NEW TRANSLATION
 gdp_merchant_family.0015.t: "Obchodní důvěrník" # todo: NEW TRANSLATION
 gdp_merchant_family.0015.desc: "Ze všech známých tváří na [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]ském [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')|l] mě zaujme [tip_giver.GetShortUIName] a odvede mě stranou. S potutelným úsměvem mi [tip_giver.GetSheHe] podá účetní knihu.\n\n„Ach, [ROOT.Char.GetTitledFirstName], zrovna vás jsem [Select_CString(ROOT.Char.IsFemale,'hledala','hledal')]! Dovolte, abych se s vámi [Select_CString(ROOT.Char.IsFemale,'podělila','podělil')] o své nedávné poznatky. Berte to jako příspěvek k naší pokračující spolupráci.“" # todo: NEW TRANSLATION
 gdp_merchant_family.0015.a: "„Společně bychom mohli vydělat pořádný balík!“" # todo: NEW TRANSLATION
 gdp_merchant_family.0015.b: "„Dovolte, abych to od vás [Select_CString(ROOT.Char.IsFemale,'koupila','koupil')].“" # todo: NEW TRANSLATION
 gdp_merchant_family.0015.b.artifact: "Kniha obchodních tajemství" # todo: NEW TRANSLATION
 gdp_merchant_family.0015.b.artifact.desc: "Pečlivě střežená kniha se zisky z trhu, maržemi a užitečnými kontakty" # todo: NEW TRANSLATION
 gdp_merchant_family.0015.c: "„#EMP [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]#! z toho bude mít prospěch…“" # todo: NEW TRANSLATION
 house_relation_reason_gdp_merchant_family.0015.a.relation_improve.desc_desc: "[char.GetShortUIName|U] a [target_char.GetShortUIName] si vyměnili výnosný tip" # todo: NEW TRANSLATION
 house_relation_reason_gdp_merchant_family.0015.c.relation_damage.desc_desc: "[char.GetShortUIName|U] [Select_CString(char.IsFemale,'použila','použil')] tip [target_char.GetShortUINamePossessive] proti [target_char.GetHerHim]" # todo: NEW TRANSLATION
 gdp_merchant_family.0020.t: "Výměna talentů" # todo: NEW TRANSLATION
 gdp_merchant_family.0020.desc: "Můj obchodní kontakt [house_friend.Custom('MistressMaster')|U] [house_friend.GetFirstName] má zpoždění na naše obvyklé setkání. Když [house_friend.GetSheHe] konečně dorazí, přivede s sebou nečekaný doprovod.\n\n„[ROOT.Char.Custom('MistressMaster')|U], tohle je můj/moje [house_friend.Custom2('RelationToMe', SCOPE.sC('nepo_hire'))] [nepo_hire.GetFirstName], " # todo: NEW TRANSLATION
 gdp_merchant_family.0020.desc.diplomacy: "zdatný diplomat. " # todo: NEW TRANSLATION
 gdp_merchant_family.0020.desc.martial: "rázný stratég. " # todo: NEW TRANSLATION
 gdp_merchant_family.0020.desc.stewardship: "mistr účetnictví. " # todo: NEW TRANSLATION
 gdp_merchant_family.0020.desc.intrigue: "[Select_CString(ROOT.Char.IsFemale,'bystrá','bystrý')] [nepo_hire.GetWomanMan]. " # todo: NEW TRANSLATION
 gdp_merchant_family.0020.desc.learning: "[Select_CString(ROOT.Char.IsFemale,'učená','učený')] [nepo_hire.GetWomanMan]. " # todo: NEW TRANSLATION
 gdp_merchant_family.0020.desc.outro: "Pod vaším vedením v [ROOT.Char.GetPrimaryTitle.GetName] by jistě [Select_CString(nepo_hire.IsFemale,'vzkvétala','vzkvétal')].„" # todo: NEW TRANSLATION
 gdp_merchant_family.0020.a: "„[nepo_hire.GetFirstNameNoTooltip|U] se k nám může přidat.“" # todo: NEW TRANSLATION
 gdp_merchant_family.0020.a.unity_loss.desc: "[Select_CString(ROOT.Char.IsFemale,'udělila','udělil')] místo společníka jako laskavost" # todo: NEW TRANSLATION
 gdp_merchant_family.0020.b: "„Obávám se, že nemáme volná místa.“" # todo: NEW TRANSLATION
 gdp_merchant_family.0020.b.unity_gain.desc: "[Select_CString(ROOT.Char.IsFemale,'odmítla','odmítl')] zaměstnat cizince" # todo: NEW TRANSLATION
 gdp_merchant_family.0020.c: "„Tímto návrhem mě urážíte.“" # todo: NEW TRANSLATION
 house_relation_reason_gdp_merchant_family.0020.a.relation_improve.desc_desc: "[char.GetShortUIName|U] [Select_CString(char.IsFemale,'přijala','přijal')] do [Select_CString(char.IsFemale,'její','jeho')] společnosti příbuzného [target_char.GetShortUINamePossessive]" # todo: NEW TRANSLATION
 house_relation_reason_gdp_merchant_family.0020.c.relation_damage.desc_desc: "[char.GetShortUIName|U] [Select_CString(char.IsFemale,'odmítla','odmítl')] příbuzného [target_char.GetShortUINamePossessive]" # todo: NEW TRANSLATION
 gdp_merchant_family.0025.t: "Nic osobního" # todo: NEW TRANSLATION
 gdp_merchant_family.0025.desc: "Z podpisování poslední hromady zdánlivě nekonečných obchodních smluv mě bolí zápěstí. Zrovna když se chystám ukončit den, přistoupí ke mně [leaving_associate.Custom2('MyCharacterIntroduction', ROOT.Char)]. [leaving_associate.GetSheHe] nervózně přešlapuje, zvedne malý pergamen a začne předčítat jeho obsah.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], s lítostí vám oznamuji, že jsem [Select_CString(ROOT.Char.IsFemale,'dostala','dostal')] nabídku od [rival_poacher.GetPrimaryTitle.GetName], kterou prostě nemohu odmítnout. Není to nic osobního, jen dobrý obchod.“" # todo: NEW TRANSLATION
 gdp_merchant_family.0025.a: "„Jdi s mým požehnáním.“" # todo: NEW TRANSLATION
 gdp_merchant_family.0025.b: "„Tvé místo je tady, u nás.“" # todo: NEW TRANSLATION
 gdp_merchant_family.0025.b.tt: "[leaving_associate.GetShortUIName|U] zůstane ve společnosti [Concept('company','společnost')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_family.0025.b.success: "[leaving_associate.GetFirstNameNoTooltip] souhlasí, že zůstane" # todo: NEW TRANSLATION
 gdp_merchant_family.0025.b.fail: "[leaving_associate.GetFirstNameNoTooltip] přesto odejde" # todo: NEW TRANSLATION
 gdp_merchant_family.0025.c: "„Pamatuj, že mi něco dlužíš.“" # todo: NEW TRANSLATION
 gdp_merchant_family.0025.d: "„Dobrá, odejdi.“" # todo: NEW TRANSLATION
 gdp_merchant_family.0025.d.rival: "„[rival_poacher.GetTitledFirstNameNoTooltip], budeš proklínat den, kdy ses mi [Select_CString(rival_poacher.IsFemale,'postavila','postavil')]!“" # todo: NEW TRANSLATION
 gdp_merchant_family.0025.d.rival.desc: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'přetáhla','přetáhl')] [CHARACTER.GetShortUIName] [Concept('associate','společník')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 house_relation_reason_gdp_merchant_family.0025.a.relation_improve.desc_desc: "[char.GetShortUIName|U] v dobré víře [Select_CString(char.IsFemale,'propustila','propustil')] [Concept('associate','společník')|E] do společnosti [target_char.GetShortUINamePossessive]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 house_relation_reason_gdp_merchant_family.0025.d.relation_damage.desc_desc: "[target_char.GetShortUIName|U] [Select_CString(target_char.IsFemale,'přetáhla','přetáhl')] [Concept('associate','společník')|E] od rodu [char.GetHouse.GetName]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_family.0030.t: "Práce, nebo zábava?" # todo: NEW TRANSLATION
 gdp_merchant_family.0030.desc: "Dva moji společníci, [house_member.GetTitledFirstName] a [associate.GetTitledFirstName], se po #EMP dlouhém#! obědě vracejí do kanceláře [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|l] a přinášejí s sebou džbán [ROOT.Char.Custom('RegionalAlcoholicDrink')].\n\n„…A já mu řekl, že ta kočka patří do chlívku!“ prohlásí [house_member.GetTitledFirstNameNoTooltip] a [associate.GetTitledFirstNameNoTooltip] se rozesměje od plic.\n\nJestli nezasáhnu, tahle dvojice dnes už nejspíš nic produktivního neudělá." # todo: NEW TRANSLATION
 gdp_merchant_family.0030.a: "„Donesu pořádnou láhev.“" # todo: NEW TRANSLATION
 gdp_merchant_family.0030.a.flavor: "Jen to nejlepší pro [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|l]" # todo: NEW TRANSLATION
 gdp_merchant_family.0030.b: "„Zpátky do práce, vy nevděčníci!“" # todo: NEW TRANSLATION
 gdp_merchant_family.0030.b.flavor: "V [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|l] se lenoši trpět nebudou" # todo: NEW TRANSLATION
 gdp_merchant_family.0030.c: "Uvidíme, kam tohle přátelství povede." # todo: NEW TRANSLATION
 merchant_unity_breaks_encouraged: "pije pouze to nejlepší, co trh nabízí" # todo: NEW TRANSLATION
 merchant_unity_breaks_discouraged: "odrazují je pracovní přestávky" # todo: NEW TRANSLATION
 gdp_merchant_family.9000.t: "Mladý [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetHouse.GetNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_family.9000.desc: "Konečně jsem [ROOT.Char.GetWomanMan] a dost starý na to, abych zaujal své právoplatné místo jako [ROOT.Char.GetTitleAsNameNoTooltip|l] [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]. Musím navázat na svého [ROOT.Char.Custom2('RelationToMeShort', predecessor)], [predecessor.GetFirstName], který po sobě zanechal prázdné místo.\n\nMoji společníci nyní očekávají, že povedu náš podnik a najdu nové cesty a příležitosti ve světě obchodu, i když mi říkají, že bych se měl spoléhat na jejich zkušenosti a moudrost..." # todo: NEW TRANSLATION
 gdp_merchant_family.9000.a: "Rady [educator.GetTitledFirstNamePossessiveNoTooltip] budou neocenitelné." # todo: NEW TRANSLATION
 gdp_merchant_family.9000.b: "Kde jen začít..." # todo: NEW TRANSLATION
 gdp_merchant_family.9000.route_hint_tt: "Nyní můžeš vytvářet a upravovat [Concept('distribution_routes','zásobovací trasy')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_family.9010.t: "Osiřelá společnost" # todo: NEW TRANSLATION
 gdp_merchant_family.9010.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', previous_holder)], [previous_holder.GetFirstName], nás opustil. [previous_holder.GetSheHe|U] byl váženým [previous_holder.Custom('MistressMaster')] společnosti. V našich síních se už nikdo nesměje, v kancelářích neutichají vášnivé debaty a všichni vypadají tak ustaraně.\n\n" # todo: NEW TRANSLATION
 gdp_merchant_family.9010.interim_generated: "Všichni hledí k [interim.GetWomanMan] jménem [interim.GetFirstName], který byl povolán, aby pomohl řídit záležitosti a" # todo: NEW TRANSLATION
 gdp_merchant_family.9010.interim_relation: "Všichni hledí k mému [ROOT.Char.Custom2('RelationToMeShort', interim)], [interim.GetFirstName], který" # todo: NEW TRANSLATION
 gdp_merchant_family.9010.interim: "Všichni hledí k důvěryhodnému společníkovi mého [ROOT.Char.Custom2('RelationToMePossessive', previous_holder)], [interim.GetFirstName], který" # todo: NEW TRANSLATION
 gdp_merchant_family.9010.close: "zařídil vše potřebné během nepřítomnosti [previous_holder.GetFirstNamePossessiveNoTooltip] a postará se o každodenní chod podniku, dokud nebudu dost starý na to, abych jej mohl řídit." # todo: NEW TRANSLATION
 gdp_merchant_family.9010.a: "Všechno se změnilo tak rychle." # todo: NEW TRANSLATION
 gdp_merchant_family.9110.t: "Obchodnické triky" # todo: NEW TRANSLATION
 gdp_merchant_family.9110.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', trader)], [trader.GetFirstName], patří k nejzkušenějším obchodníkům společnosti a v kanceláři se objevuje jen zřídka.\n\n[trader.GetSheHe|U] řídí [route.GetName|l] a dbá na to, aby každá [good.Custom('GetTradeGoodUnit')] bezpečně putovala od prodávajícího ke kupujícímu a cestou plnila naši pokladnu [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationDGlossPlural')].\n\n„Dobrý obchodník je všude zároveň.“ [trader.GetSheHe|U] se usměje. „Zná tváře u každého stánku na [ROOT.Char.GetDomicile.GetLocation.Custom('GetRegionalMarketTermGloss')], jejich starosti i starosti každého města a každého karavanního strážného!“" # todo: NEW TRANSLATION
 gdp_merchant_family.9110.a: "Až budu ve vedení, budu jako [trader.GetNameNoTooltip]." # todo: NEW TRANSLATION
 gdp_merchant_family.9110.b: "„Pověz mi o karavanách!“" # todo: NEW TRANSLATION
 gdp_merchant_family.9110.b.tt: "Po dosažení plnoletosti získáš #V 10#! [Concept('trait_level_track_xp','zkušenosti rysu')|E] v #emp $trait_track_caravaneer$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_family.9110.c: "„Také chci obchodovat s [good.Custom('GetTradeGood')]!“" # todo: NEW TRANSLATION
 gdp_merchant_family.9110.c.tt: "Po dosažení plnoletosti získá [merchant.GetPrimaryTitle.GetDefinitiveName|l] #V 450#! [category.GetNameWithIcon] [Concept('trade_expertise','obchodní zkušenost')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_family.9130.t: "Mládí plné ambicí" # todo: NEW TRANSLATION
 gdp_merchant_family.9130.desc: "Pozorováním každodenního chodu společnosti se toho hodně učím a moji společníci dělají vše pro to, aby mě zapojili a rozšířili tak mé znalosti." # todo: NEW TRANSLATION
 gdp_merchant_family.9130.caravaneer: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] obchoduje široko daleko a jeho účetní knihy jsou plné míst, jejichž názvy sotva dokážu vyslovit a která leží daleko od [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitly]. Kde přesně, to mohu jen hádat." # todo: NEW TRANSLATION
 gdp_merchant_family.9130.artisan: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] je známý jako dodavatel vzácných a kvalitních výrobků a mecenáš řemeslníků [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip]." # todo: NEW TRANSLATION
 gdp_merchant_family.9130.creditor: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] je známý tím, že vyměňuje [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationDGlossPlural')] za laskavosti. Jeho účetní knihy jsou plné jmen nešťastníků a hazardních hráčů [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip]." # todo: NEW TRANSLATION
 gdp_merchant_family.9130.fallback: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] je dobře zavedený, ale ničím konkrétním se neproslavil. Je jen jedním z obchodních rodů [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip], který má prsty v mnoha odvětvích." # todo: NEW TRANSLATION
 gdp_merchant_family.9130.a: "Už se nemohu dočkat, až budu [ROOT.Char.GetWomanMan] u kormidla." # todo: NEW TRANSLATION
 gdp_merchant_family.9130.a.caravaneer: "A doplujeme ještě dál." # todo: NEW TRANSLATION
 gdp_merchant_family.9130.a.artisan: "Naše jméno je zárukou kvality." # todo: NEW TRANSLATION
 gdp_merchant_family.9130.a.creditor: "Úvěry jsou naše živobytí." # todo: NEW TRANSLATION
 gdp_merchant_family.9130.a.tt: "Po dosažení plnoletosti získáš #V 5#! [Concept('trait_level_track_xp','zkušenosti rysu')|E] v každé z těchto oblastí: #emp $trait_track_caravaneer$#!, #emp $trait_track_artisan$#! a #emp $trait_track_creditor$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_family.9130.b: "Širý svět je plný možností." # todo: NEW TRANSLATION
 gdp_merchant_family.9130.b.tt: "Po dosažení plnoletosti přijmeš [Concept('company_purpose','zaměření společnosti')|E] [GetLaw('company_purpose_caravaneer').GetName] #P zdarma#! a získáš #V 20#! [Concept('trait_level_track_xp','zkušenosti rysu')|E] v #emp $trait_track_caravaneer$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_family.9130.c: "Za pěkné tretky se utrácí mnoho." # todo: NEW TRANSLATION
 gdp_merchant_family.9130.c.tt: "Po dosažení plnoletosti přijmeš [Concept('company_purpose','zaměření společnosti')|E] [GetLaw('company_purpose_artisan').GetName] #P zdarma#! a získáš #V 20#! [Concept('trait_level_track_xp','zkušenosti rysu')|E] v #emp $trait_track_artisan$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_family.9130.d: "Skutečná moc a bohatství spočívají v pákách." # todo: NEW TRANSLATION
 gdp_merchant_family.9130.d.tt: "Po dosažení plnoletosti přijmeš [Concept('company_purpose','zaměření společnosti')|E] [GetLaw('company_purpose_creditor').GetName] #P zdarma#! a získáš #V 20#! [Concept('trait_level_track_xp','zkušenosti rysu')|E] v #emp $trait_track_creditor$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
