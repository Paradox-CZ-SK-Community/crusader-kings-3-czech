l_polish:
 gdp_merchant_luxury_contract.0001.t: "[task_contract.GetType.GetName]: [local_county.GetNameNoTierNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0001.desc: "Překračujeme [local_province.Custom('GetTerrainLandPlural')] hrabství [local_county.GetNameNoTierNoTooltip] a blížíme se k místnímu sídlu. Táboříme mezi [local_province.Custom('GetProvinceFoliageDescAdjective')] okraji," # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0001.desc.locals: "Skupinka vesničanů, které míjíme, odpovídá na naše nemotorné dotazy ohledně místní zvěře zvláštními, ale nezaměnitelnými výjevy" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0001.desc.locals_language: "Skupinka vesničanů, které míjíme, odpovídá na naše dotazy místními příběhy o" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0001.desc.jungle: "vzduch je těžký sladkým nektarem." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0001.desc.mountain: "svěží vzduch sviští mezi větvemi." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0001.desc.desert: "pálící slunce spaluje tichou krajinu." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0001.desc.plains: "vzduch je omamný vůní lučních květů." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0001.desc.big_cat: "děsivých kočkovitých šelem." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0001.desc.small_cat: "lstivých koček" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0001.desc.bear: "divokých medvědů." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0001.desc.monkey: "rozpustilých opic." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0001.desc.elephant: "majestátních slonů." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0001.desc.bear_cat: "děsivých kočkovitých šelem a divokých medvědů." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0001.desc.bear_elephant: "divokých medvědů a majestátních slonů." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0001.desc.elephant_cat: "děsivých kočkovitých šelem a majestátních slonů." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0001.desc.monkey_cat: "rozpustilých opic a děsivých kočkovitých šelem." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0001.desc.monkey_elephant: "rozpustilých opic a majestátních slonů." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0001.desc.bird: "okouzlujících ptáků." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0001.desc.close: "Zdá se, že jsme na správné cestě, alespoň!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0001.a: "Divočina čeká na své šelmy!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0001.a.flavor: "Upřednostňuje projevy [Concept('martial_i','@skill_martial_icon!')|E][Concept('martial','válečnictví')|E], [Concept('intrigue_i','@skill_intrigue_icon!')|E][Concept('intrigue','pletichářství')|E] a [Concept('prowess_i','@skill_prowess_icon!')|E][Concept('prowess','udatnosti')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.0001.a.tt: "Pokusíš se v divočině získat #V tvora#! [Concept('domicile_artifact','artefakt domicilu')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.0001.b: "Podívejme se, co najdeme v [local_barony.Custom('BaronyTownType')]." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0001.b.flavor: "Upřednostňuje projevy [Concept('diplomacy_i','@skill_diplomacy_icon!')|E][Concept('diplomacy','diplomacie')|E], [Concept('stewardship_i','@skill_stewardship_icon!')|E][Concept('stewardship','správcovství')|E] a [Concept('gold_i','@gold_icon!')|E][Concept('gold','zlata')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.0001.b.tt: "Pokusíš se získat #V tvora#! [Concept('domicile_artifact','artefakt domicilu')|E] v městském centru" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract_back_to_town_tt: "Vracíš se do [local_barony.Custom('BaronyTownType')]" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract_back_to_wilderness_tt: "Vracíš se do divočiny" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0011.t: "[task_contract.GetType.GetName]: Místní kolorit" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0011.desc: "Bloudím neznámými uličkami [local_province.GetBaronyNameExplicitlyNoTooltip], až brzy narazím na [local_province.Custom('GetProvinceAdjective')] [local_province.Custom('GetRegionalMarketTermGloss')]. U něj stojí dobře oblečený místní [rich_local.GetWomanMan], kterého nelze přehlédnout, a s někým rozmlouvá" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0011.cage: "u klece s [rich_local.Custom('GetAnimalType')]!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0011.shoulder: "s [rich_local.Custom('GetAnimalArticle')] [rich_local.Custom('GetAnimalType')] na [Select_CString(rich_local.IsFemale,'jejímu','jeho')] rameni!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0011.leashed: "s [rich_local.Custom('GetAnimalType')] na vodítku po [Select_CString(rich_local.IsFemale,'její','jeho')] boku!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0011.close: "\n\nOd nedalekých kramářů se dozvídám, že [rich_local.GetSheHe] je [rich_local.GetTitledFirstName], [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', rich_local)] místní vážená osoba se zálibou v divokých a exotických zvířatech.\n\nMožná bude [rich_local.GetSheHe] ochoten uzavřít obchod?" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0011.a: "„Můj milý [rich_local.GetWomanMan], mohli bychom si promluvit o vašem skvostném [rich_local.Custom('GetAnimalType')]?“" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0011.a.success: "[rich_local.GetSheHe|U] ti prodá [rich_local.Custom('GetAnimalType')]" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0011.a.failure: "[rich_local.GetSheHe|U] tvou nabídku odmítne" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0011.b: "Dokážu si najít vlastní..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.some_other_way: "Musíš najít jiný způsob, jak získat tvora" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0012.t: "$gdp_merchant_luxury_contract.0011.t$" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0012.desc: "[rich_local.GetTitledFirstName] si mě zvědavě prohlíží od hlavy k patě, zatímco se představuji a zahrnuji [Select_CString(rich_local.IsFemale,'její','jeho')] zvíře nadšenými chválami.\n\n" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0012.success: "Když promluvím, [Select_CString(rich_local.IsFemale,'Její','Jeho')] výraz se rozzáří. Dychtivě hltá mé komplimenty a vzrušeně se vyptává, co mě přivedlo tak daleko od domova.\n\nBrzy se dohodneme na ceně a já se náhle stávám hrdým majitelem nádherného [rich_local.Custom('GetAnimalType')]!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0012.failure: "[Select_CString(rich_local.IsFemale,'Její','Jeho')] výraz však brzy zvážní: nejprve se zamračí a pak pohrdavě odfrkne. [rich_local.GetSheHe] mě rázně odmítne a pokyne [Select_CString(rich_local.IsFemale,'jejímu','jeho')] služebnictvu, aby mě vyvedlo.\n\nTen nafoukaný hlupák se ke mně chová, jako bych #EMP já#! byl [rich_local.Custom('GetAnimalType')]..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0012.a: "V [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] se o tom bude mluvit!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0012.b: "Počkejte, podívejte, můžu nabídnout víc!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0012.c: "Kde ten hlupák bydlí? Ten [rich_local.Custom('GetAnimalType')] #EMP bude#! můj!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0012.c.success: "Ukradneš [rich_local.Custom('GetAnimalType')]" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0012.c.failure: "Jen tak tak unikneš strážím" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0012.d: "#weak *zakroutím hlavou*#! „To nic, ulovím si nějaké sám.“" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0012.e: "S tímhle končím..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0013.t: "$gdp_merchant_luxury_contract.0011.t$" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0013.desc: "Najít [rich_local.GetTitledFirstNamePossessive] sídlo v [local_province.GetBaronyNameExplicitlyNoTooltip] nebylo těžké. V hospodě jsem najal pár místních tupců a po setmění jsme se na místo nepozorovaně vloupali.\n\n" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0013.success: "Prolomit obvodovou ochranu bylo až příliš snadné. Než se nadějeme, jsme několik ulic daleko a napínáme uši, jestli neuslyšíme poplach.\n\nJediné, co je slyšet, jsou tlumené [rich_local.Custom('GetAnimalSoundPresent')] [rich_local.Custom('GetAnimalPossessive')]!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0013.failure: "Bohužel právě tam mě opustilo štěstí! Jen tak tak jsem unikl strážím. Ten zrádný [rich_local.Custom('GetAnimalPossessive')] [rich_local.Custom('GetAnimalSoundPresent')] mě prozradil a celý plán se zhroutil...\n\nLidé [rich_local.GetFirstNamePossessiveNoTooltip] mě jistě budou hledat!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0013.a: "Hlupák mi ho měl prodat!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0013.b: "Musím okamžitě opustit tohle místo!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0021.t: "[task_contract.GetType.GetName]: Bestiář" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0021.desc: "Hluboko v bludišti uliček [local_barony.Custom('BaronyTownType')] [local_province.Custom('GetRegionalMarketTermGloss')] mě pach a zvířecí křik přivedou k [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', dealer)] vyhlížejícímu [dealer.GetWomanMan] za otlučeným stánkem. [local_province.Custom('GetProvinceAdjective')] prostranství je plné klecí ze všech možných [local_province.Custom('GetRandomRegionalWood')].\n\nKdyž si všimne mého zájmu, [dealer.GetSheHe] mě naléhavě láká k sobě. To je pastva pro oči! Okamžitě mě zaujme nádherný [ROOT.Char.Custom('GetAnimalType')]. Zatímco obdivuji [ROOT.Char.Custom('GetAnimalFeature')], docela žalostný [dealer.Custom('GetAnimalType')] na protest [dealer.Custom('GetAnimalSoundPresent')].\n\nKramářovy oči lačně září, zatímco si prohlížím zboží." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0021.a: "„Nádhera... Musím mít tohohle [ROOT.Char.Custom('GetAnimalType')]!“" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0021.b: "I v [local_province.GetBaronyNameExplicitlyNoTooltip] se jistě dá smlouvat..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0021.b.success_critical: "Vyjednáš mistrovskou dohodu" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0021.b.success: "Ušetříš pár mincí" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0021.b.failure: "Všechno jen zhoršíš" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0021.b.tt: "Budeš mít možnost odmítnout" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0021.c: "#weak *ukážu prstem*#! „Vezmu si toho [dealer.Custom('GetAnimalType')]!“" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0021.d: "„Jen se rozhlížím.“" # todo: NEW TRANSLATION
 task_contract_success_pseudo: "#P Úspěch:#!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0022.t: "$gdp_merchant_luxury_contract.0021.t$" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0022.desc: "Kupec mrkne; je zjevně rozený obchodník. Zdá se, že smlouváme celou věčnost, probíráme každou skvrnku na [ROOT.Char.Custom('GetAnimalPossessive')] [ROOT.Char.Custom('GetAnimalHide')] a přeme se o kvalitu [ROOT.Char.Custom('GetAnimalSoundPresent')].\n\n" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0022.success: "Předložím přesvědčivé argumenty a [dealer.GetSheHe] je z nich poněkud nesvůj. Brzy [dealer.GetSheHe] povolí a výrazně sníží cenu, ale i jeho trpělivost má své meze..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0022.neutral: "Mé argumenty zřejmě na [dealer.GetHerHim] zapůsobily, protože [dealer.Custom('GetWomanManPossessive')] cena trochu klesne, ale [dealer.GetSheHe] už dál ustoupit nechce..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0022.failure: "Zdá se, že jsem [dealer.GetHerHim] popudil. [dealer.Custom('GetWomanManPossessive')] cena jen vzrostla a [dealer.GetSheHe] teď tvrdohlavě trvá na svém..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0022.a: "„Platí.“" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0022.b: "„Vlastně chci toho [dealer.Custom('GetAnimalType')]...“" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0022.c: "#weak *zakroutím hlavou*#! „Nech to být.“" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0023.t: "$gdp_merchant_luxury_contract.0021.t$" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0023.desc: "Konečně jsem dosáhl svého a jsem hrdým majitelem [ROOT.Char.Custom('GetAnimalArticle')] [ROOT.Char.Custom('GetAnimalType')]! To hrdé zvíře je řádně zajištěné a připravené vydat se s naší karavanou domů.\n\nJen počkejte, až tohle uvidí v [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0023.a: "Vyrazíme." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0041.t: "[task_contract.GetType.GetName]: Na lovu" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0041.desc: "Opouštím stezky a mířím hlouběji do [local_province.Custom('GetTerrainType')], prodírám se [local_province.Custom('GetProvinceFoliageDesc')] a hledám jakékoli známky přítomnosti zvířete. Tísnivé ticho přerušuje jen ptačí zpěv. Pevněji si přitáhnu plášť.\n\nZrovna se otáčím k odchodu z houštiny, když si toho málem nevšimnu! Tam, na [local_province.Custom('GetProvinceGroundDesc')], jsou jasné stopy [ROOT.Char.Custom('GetAnimalTrack')]! Náhlé [ROOT.Char.Custom('GetAnimalSound')] v dálce to potvrzuje: poblíž číhá [ROOT.Char.Custom('GetAnimalType')]!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0041.a: "Kupředu, než uteče!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0041.a.tt: "Pronásleduješ [THIS.Char.Custom('GetAnimalType')]" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0041.b: "N-nechme toho, vraťme se!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0042.t: "$gdp_merchant_luxury_contract.0041.t$" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0042.desc: "Prodírám se [local_province.Custom('GetProvinceFoliageDesc')], když koutkem oka zahlédnu [ROOT.Char.Custom('GetAnimalColor')] [ROOT.Char.Custom('GetAnimalHide')]. V obavách z nejhoršího se prudce otočím a srdce mi málem vyskočí z hrudi!\n\nPřede mnou sedí malý, zubožený [ROOT.Char.Custom('GetAnimalType')], pouhé [ROOT.Char.Custom('GetAnimalChild')]. Jeho velké, zvědavé oči se beze strachu upírají na mě. Rozhlédnu se, ale zdá se, že je úplně samo; nikde není rodič ani [ROOT.Char.Custom('GetAnimalGroup')]..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0042.a: "[Select_CString(ROOT.Char.IsFemale,'Přišla','Přišel')] jsem pro dospělou šelmu!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0042.a.tt: "Pokračuješ v hledání dospělého [THIS.Char.Custom('GetAnimalType')] [Concept('artifact','artefaktu')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.0042.b: "Možná bych mohl nastražit past..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0042.b.success: "Použiješ [ROOT.Char.Custom('GetAnimalChild')] jako návnadu" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0042.b.success.tt: "Získáš také dospělého [THIS.Char.Custom('GetAnimalType')] [Concept('artifact','artefaktu')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.0042.b.failure: "Neuspěješ a [ROOT.Char.Custom('GetAnimalChild')] uteče" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0042.c: "Je čas jít. #EMP Ty#! půjdeš se mnou, drobečku!" # todo: NEW TRANSLATION
 baby_creature_artifact_name: "[baby_creature.GetNameNoTooltip] [ROOT.Char.Custom('GetAnimalChild')|U]" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0043.t: "$gdp_merchant_luxury_contract.0041.t$" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0043.desc: "Záblesk v [local_province.Custom('GetProvinceFoliageDesc')] mě vyleká. Myslím, že mě přepadla nějaká šelma, a bojím se nejhoršího!\n\nS úlevou, byť jen napůl, zjišťuji, že jde pouze o místního lovce. Podezřívavě si mě měří a má připravený šíp.\n\n„Hah, hledáte snad [ROOT.Char.Custom('GetAnimalPlural')]? Ještě jsem někoho jako vy neviděl.“" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0043.a: "Prosím, mohl byste mi... pomoct?" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0043.b: "Bylo by mi ctí lovit po vašem boku!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0043.b.success: "[hunter.GetFirstNameNoTooltip] ti pomůže" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0043.b.success_tt: "Budeš mít větší šanci uspět" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0043.b.failure: "[hunter.GetFirstNameNoTooltip] tě odmítne" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0043.c: "Nepleť se mi do cesty." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0044.t: "$gdp_merchant_luxury_contract.0041.t$" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0044.bait: "Ochotné [ROOT.Char.Custom('GetAnimalChild')] není těžké dovést na vhodnou mýtinu a přivázat ho k zemi provazem.\n\n" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0044.trapper: "[hunter.GetFirstName] nám ochotně pomáhá a dobře zná zdejší [local_province.Custom('GetTerrainType')] i jeho obyvatele. Brzy jsme na stopě [ROOT.Char.Custom('GetAnimalPossessive')]!\n\n" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0044.desc: "V tak neznámé krajině postupujeme pomalu, často bloudíme a vracíme se po vlastních stopách, ale brzy jsme na stopě [ROOT.Char.Custom('GetAnimalPossessive')]!\n\n" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0044.bait_success: "Jak se dalo čekat, jeho tiché [ROOT.Char.Custom('GetAnimalSoundParticiple')] brzy přiláká dospělého [ROOT.Char.Custom('GetAnimaltype')]. Sledujeme, jak zvíře obezřetně vyhlíží z [local_province.Custom('GetProvinceFoliageDesc')]. Konečně se váhavě přiblíží k [ROOT.Char.Custom('GetAnimalChild')] a my nastražíme past!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0044.bait_failure: "Tedy, mělo to tak být... Po chvíli klidného čekání a tichého [ROOT.Char.Custom('GetAnimalSoundParticiple')] se ta zatracená potvora náhle ze všech sil vytrhne a zmizí v [local_province.Custom('GetProvinceFoliageDesc')]..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0044.success: "Máme štěstí a téměř bez varování narazíme na [ROOT.Char.Custom('GetAnimalType')] v [local_province.Custom('GetProvinceFoliageDesc')]. Zvíře se prudce [ROOT.Char.Custom('GetAnimalSoundParticiple')] a [ROOT.Char.Custom('GetAnimalColor')] pohne, ale nakonec uvízne v síti!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0044.failure: "Jenže všechno se záhy zvrtne. Sotva ho zahlédneme, zvíře se vydá do [local_province.Custom('GetTerrainLand')] v prudkém, [ROOT.Char.Custom('GetAnimalSoundParticiple')] a [ROOT.Char.Custom('GetAnimalColor')] pohybu. Je příliš vyděšené na to, abychom ho chytili." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0044.a: "Vy dva k sobě tak pasujete!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0044.b: "Zatracená zvířata!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0044.c: "Teď tě mám!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0044.d: "Zatracená bestie!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0044.e: "Co kdybychom se podívali na [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip], [hunter.GetFirstNameNoTooltip]?" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0051.t: "[task_contract.GetType.GetName]: Pytláctví" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0051.desc: "Dorazíme do vesnice na [local_province.Custom('GetProvinceGroundDescAdjective')] půdě a vyptáváme se na zdejší zvěř. Stařešina nás vážně nabádá, abychom odešli, a vysvětluje, že v okolí loví místní velmož, „[rich_local.GetName]“ [rich_local.Custom('GetAnimalPlural')].\n\nNež se vydáme dál, objeví se [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', hunter)] vesničan, který potichu namítá, že chytit jednoho z [rich_local.Custom('GetAnimalPlural')] [rich_local.GetTitleAsNamePossessiveNoTooltip] by bylo snadné!\n\nDrzý nápad, ale možná až příliš dobrá příležitost, než abychom ji nechali plavat?" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0051.a: "[rich_local.Custom('GetAnimalType')]? Vyrazme hned!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0051.a.flavor: "Místní mohou být potrestáni..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0051.a.tt: "Pokusíš se pytlačit na území [rich_local.GetShortUIName]" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0051.b: "Nechci si zahrávat s [rich_local.GetTitleAsNameNoTooltip]..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0052.t: "$gdp_merchant_luxury_contract.0051.t$" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0052.desc: "Můj průvodce [hunter.GetFirstName] nás rychle vede přes [local_province.Custom('GetProvinceFoliageDesc')] a působivou rychlostí překonáváme [local_province.Custom('GetTerrainTypePlural')]. Když dorazíme na mýtinu, [hunter.GetSheHe] se náhle zastaví a nastraží ucho.\n\n„Ticho!“ zasyčí [hunter.GetSheHe] a stáhne mě z dohledu. „Už jsou blízko.“\n\nZanedlouho kolem nás duní družina a rozrývá [local_province.Custom('GetProvinceGroundDesc')], zatímco se v dálce ozývají výkřiky lovců.\n\nA pak to uslyším: [rich_local.Custom('GetAnimalSound')] [rich_local.Custom('GetAnimalType')]!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0052.a: "Tamhle běží! Síť!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0052.a.success: "Chytíš [rich_local.Custom('GetAnimalType')]" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0052.a.neutral: "Minul jsi [rich_local.Custom('GetAnimalType')]" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0052.a.failure: "[rich_local.Custom('GetAnimalType')] ti ublíží" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0052.b: "Schovejte se! Jsme ztraceni!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0052.b.tt: "[rich_local.Custom('GetAnimalType')] uteče" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0053.t: "$gdp_merchant_luxury_contract.0051.t$" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0053.desc: "Vracíme se do vesnice, kde se stařešina vyřítí ven a křičí, že tu byli muži [rich_local.GetTitledFirstNamePossessive] a pátrali po pytlácích!\n\n" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0053.success: "[hunter.GetFirstName] se provinile dívá na spoutaného [rich_local.Custom('GetAnimalType')], ale ne dost provinile na to, aby skryl [Select_CString(hunter.IsFemale,'její','jeho')] hrdost." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0053.failure: "[hunter.GetFirstName] sklesle hledí do země, zatímco se zbytek vesnice mračí.\n\nKdyž se [hunter.GetSheHe] vrací do [Select_CString(hunter.IsFemale,'jejího','jeho')] příbytku, objeví se uvázaný [hunter.Custom('GetAnimalType')], který se [hunter.Custom('GetAnimalWalkParticiple')] po [local_province.Custom('GetProvinceGroundDesc')]." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0053.a: "„To je nádherné zvíře...“" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0053.b: "„...Řeknu [rich_local.GetTitleAsNameNoTooltip], kdo ho ukradl!“" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0053.b.flavor: "[hunter.GetFirstNameNoTooltip] obdivuje tvou smělost" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0053.c: "„Tohle byl hrozný nápad...“" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0053.d: "„...Přesto by se mi [hunter.GetWomanMan] jako ty hodil, [hunter.GetFirstNameNoTooltip].“" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.0053.e: "„Nikdy jsi neříkal, že máš [hunter.Custom('GetAnimalType')]!“" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1001.t: "[task_contract.GetType.GetName]: [local_county.GetNameNoTierNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1001.desc: "Dnes ráno spatříme [local_province.GetBaronyNameExplicitlyNoTooltip], [local_barony.Custom('BaronyTownType')], náš dlouho hledaný cíl, jak se vynořuje z [local_province.Custom('GetTerrainLandPlural')]" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1001.desc.locals: "U brány nám kolemjdoucí vesničané jen s obtížemi rozumějí, když se neohrabaně ptáme na cestu v jazyce [local_county.GetCountyData.GetCulture.GetLanguage.GetName], ale ukážou nám" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1001.desc.locals_language: "U brány nám skupina kolemjdoucích vesničanů v odpověď na naše dotazy v jazyce [local_county.GetCountyData.GetCulture.GetLanguage.GetName] ukáže cestu k" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1001.desc.religious: "velkolepé a posvátné hrobce v [religious_building_province.GetBaronyNameExplicitlyNoTooltip]." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1001.desc.scholarly: "moudrému centru vzdělanosti v [scholarly_building_province.GetBaronyNameExplicitlyNoTooltip]." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1001.desc.fallback: "místnímu trhu." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1001.a: "Na místním [local_province.Custom('GetRegionalMarketTerm')] se určitě něco najde." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1001.a.flavor: "Upřednostňuje projevy [Concept('stewardship_i','@skill_stewardship_icon!')|E][Concept('stewardship','správcovství')|E] a [Concept('gold_i','@gold_icon!')|E][Concept('gold','zlata')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1001.a.tt: "Pokusíš se na trhu získat [Concept('domicile_artifact','artefakt domicilu')|E] typu #V Kuriozita#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1001.d: "Velkolepý [local_province.Custom('GetRegionalMarketTerm')] nás volá!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1001.d.flavor: "$gdp_merchant_luxury_contract.1001.a.flavor$" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1001.d.tt: "$gdp_merchant_luxury_contract.1001.a.tt$" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1001.e: "Vydejme se na toto svaté místo." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1001.e.flavor: "Upřednostňuje projevy [Concept('piety_i','[GetLocalPlayerPietyTextIcon]')|E][Concept('piety','zbožnosti')|E] a [Concept('learning_i','@skill_learning_icon!')|E][Concept('learning','učenosti')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1001.e.tt: "Pokusíš se získat [Concept('domicile_artifact','artefakt domicilu')|E] typu #V Kuriozita#! na náboženském místě" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1001.f: "Tady se toho určitě můžeme hodně naučit." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1001.f.flavor: "Upřednostňuje projevy [Concept('learning_i','@skill_learning_icon!')|E][Concept('learning','učenosti')|E] a [Concept('diplomacy_i','@skill_diplomacy_icon!')|E][Concept('diplomacy','diplomacie')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1001.f.tt: "Pokusíš se získat [Concept('domicile_artifact','artefakt domicilu')|E] typu #V Kuriozita#! v centru vzdělanosti" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1001.return.religious: "Vraťme se na to svaté místo..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1001.return.scholarly: "Najděme to centrum vzdělanosti..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1001.return.urban: "Zajdu prostě na trh..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1001.give_up: "Ach, nechte to být!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1001.fallback: "Z [local_province.GetBaronyNameExplicitlyNoTooltip] neodejdu s prázdnou." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1001.fallback.flavor: "Na [local_province.Custom('GetRegionalMarketTermGloss')] najdeš nějakou drobnost" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1101.t: "[task_contract.GetType.GetName]: Obchodní centrum" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1101.desc: "[local_province.GetTitle.Custom('BaronyTownType')] [local_province.GetBaronyNameExplicitlyNoTooltip] kypí obchodem. Místní i cestovatelé zde hledají nejrůznější zboží, obklopeni pohledy, zvuky a vůněmi [local_province.Custom('GetProvinceAdjective')] [local_province.Custom('GetRegionalMarketTermGloss')].\n\n" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1101.urchin: "V temném koutě zahlédnu mrzutého pouličního uličníka, [Select_CString(urchin.IsFemale,'její','jeho')] korálkové oči tiše sledují proud kolemjdoucích." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1101.antiques: "Ošuntělý stánek se starožitnostmi, posetý cetkami z [local_province.Custom('GetRandomRegionalWood')] a zašlým kovem, probudí mou zvědavost — k radosti jeho [dealer.Custom('GetYoungMiddleAgedOld')] správce." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1101.bookseller: "Roztrhaná plátěná [ROOT.Char.Custom('RegionalFabric')] markýza ošuntělého krámku skrývá množství potrhaných svitků a knih nakupených podél stěn. Dohlíží na ně [dealer.Custom('GetYoungMiddleAgedOld')] [dealer.GetWomanMan]." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1101.travelers: "Skupina ostříleně vyhlížejících [traveler.GetCulture.GetCollectiveNoun] se usadila na nedalekém náměstí. Oblečení a řeč je odlišují od místních [local_province.GetCulture.GetName]." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1101.tavern: "Naproti mě upoutá hlučné veselí v krčmě a spatřím drsně vyhlížejícího hazardního hráče, který si pohrává s měšcem, jejž právě [gambler.GetSheHe] obral o zdrceného soupeře." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1101.merchant: "Všimnu si dobře oblečené [other_merchant.GetWomanMan], jak hubuje na pomalý průjezd karavany městem. [other_merchant.GetSheHe|U] je zjevně místní obchodník přesně podle mého gusta." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1101.a: "To dítě vypadá... #EMP prohnaně#!." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1101.a.flavor: "Upřednostňuje projevy [Concept('intrigue_i','@skill_intrigue_icon!')|E][Concept('intrigue','pletichářství')|E] a [Concept('diplomacy','diplomacie')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1101.a.tt: "Zjistíš, co uličník říká" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1101.b: "Tenhle obchodník by mohl mít něco zajímavého..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1101.b.flavor: "Upřednostňuje projevy [Concept('learning_i','@skill_learning_icon!')|E][Concept('learning','učenosti')|E] a [Concept('gold_i','@gold_icon!')|E][Concept('gold','zlata')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1101.b.tt: "Pokusíš se koupit zajímavou starožitnost" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1101.c: "Musí tu být nějaká zajímavá kniha." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1101.c.flavor: "Upřednostňuje projevy [Concept('learning_i','@skill_learning_icon!')|E][Concept('learning','učenosti')|E] a [Concept('gold_i','@gold_icon!')|E][Concept('gold','zlata')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1101.c.tt: "Pokusíš se koupit zajímavou knihu" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1101.d: "Ti [traveler.GetCulture.GetCollectiveNounNoTooltip] toho jistě hodně zažili." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1101.d.lingua: "Příležitost vyzkoušet si svou znalost jazyka [traveler.GetCulture.GetLanguage.GetNameNoTooltip]." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1101.d.flavor: "Upřednostňuje projevy [Concept('diplomacy_i','@skill_diplomacy_icon!')|E][Concept('diplomacy','diplomacie')|E] a [Concept('learning_i','@skill_learning_icon!')|E][Concept('learning','učenosti')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1101.d.tt: "Pohovoříš si s cestovateli" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1101.e: "Hře náhody neodolám..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1101.e.flavor: "Upřednostňuje projevy [Concept('intrigue_i','@skill_intrigue_icon!')|E][Concept('intrigue','pletichářství')|E] a náhodu" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1101.e.tt: "Zjistíš, co se dá vyhrát od hazardního hráče" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1101.f: "Ach, konkurent by mi mohl rozumět." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1101.f.flavor: "Upřednostňuje projevy [Concept('stewardship_i','@skill_stewardship_icon!')|E][Concept('stewardship','správcovství')|E] a [Concept('prestige_i','@prestige_icon!')|E][Concept('prestige_level','úrovně slávy')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1101.f.tt: "Zjistíš, co ti obchodník poví" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1102.urchin: "Hlídku [urchin.GetFirstNamePossessive|U] není snadné obměkčit. Snažím se [urchin.GetHerHim] získat na svou stranu pohrdáním kolemjdoucími a příběhy z drsných ulic [merchant.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip].\n\n" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1102.urchin.success_critical: "Mé příběhy o dalekých krajích a výdělcích obchodnického života [Select_CString(urchin.IsFemale,'její','jeho')] zájem vzbudí. Když už se chystám něco nabídnout, [urchin.GetSheHe] mi šperky nabídne rovnou — pokud [urchin.GetHerHim] vezmu s sebou!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1102.urchin.success: "Nakonec mám pocit, že jsem dost pokročil, abych přešel k věci, a zeptám se, kolik by [urchin.GetSheHe] za šperky chtěl. S potutelným úsměvem mi [urchin.GetSheHe] sdělí [Select_CString(urchin.IsFemale,'její','jeho')] cenu." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1102.urchin.failure: "Nakonec mám pocit, že jsem dost pokročil, abych přešel k věci, a zeptám se, kolik by [urchin.GetSheHe] za šperky chtěl. [urchin.GetSheHe|U] jen ohrne [Select_CString(urchin.IsFemale,'její','jeho')] ret a řekne mi, ať vypadnu." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1102.antiques: "S mazaným obchodníkem se nějakou dobu přeme o kvalitu zpracování předmětu, jeho stáří i stav.\n\nNakonec se já a ten [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('dealer') )] mizera dostaneme do slepé uličky." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1102.antiques.success: "Musím uznat, že cena není špatná — je mnohem lepší, než jsem doufal." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1102.antiques.failure: "Nemůžu říct, že jsem s výsledkem spokojený. Mám jen pocit, že mě napálili." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1102.bookseller: "S mazaným obchodníkem se nějakou dobu přeme o původ knihy, její stáří i stav.\n\nNakonec se já a ten [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('dealer') )] mizera dostaneme do slepé uličky." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1102.bookseller.success: "$gdp_merchant_luxury_contract.1102.antiques.success$" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1102.bookseller.failure: "$gdp_merchant_luxury_contract.1102.antiques.failure$" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1102.travelers: "Skupina ke mně trochu pookřeje. Zjevně jsem to nejzajímavější, co celý den potkali, a brzy si vyměňujeme příběhy z cest." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1102.travelers.success: "\n\nNetrvá dlouho a už lámeme chléb, smějeme se a žertujeme o společných útrapách a zážitcích z [local_province.GetBaronyNameExplicitly]. Když se loučíme, [traveler.GetFirstName] mi vtiskne do ruky balíček a vřele mě obejme." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1102.travelers.failure: "\n\nPo několika historkách mi brzy dojdou témata k hovoru a [traveler.GetCulture.GetCollectiveNoun] nedokážou skrýt, že si přejí, abych už šel dál." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1102.tavern: "Když rozehříváme kostky, zdá se, že jsou naše síly vyrovnané. Střídavě vyhráváme jedno či dvě kola, vyměňujeme si mince a pošťuchujeme se, ale [gambler.GetFirstName] je pořádný lišák, o tom není pochyb.\n\n" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1102.tavern.success: "[merchant.GetFaith.WealthGodName] se na mě dnes usmívá! Díky drtivému náskoku hned zkraje nechám [gambler.GetFirstNamePossessiveNoTooltip] zaraženého a klejícího. Jeho prohra se stále prohlubuje, až [gambler.GetSheHe] vyrazí ven a mrští [Select_CString(gambler.IsFemale,'jejími','jeho')] kostkami na ulici!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1102.tavern.failure: "Chvíli to trvá, ale nakonec se mi podaří získat náskok. [gambler.GetFirstNamePossessiveNoTooltip] trpělivost zkouším natolik, že [gambler.GetHerHim] hru ukončí, zatímco já se kochám pohledem na své mince." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1102.tavern.failure_critical: "Netrvá dlouho a [gambler.GetSheHe] začne hrát naplno. Brzy prohrávám jedno kolo za druhým a dochází mi trpělivost i mince. S mrzutým výrazem odcházím, zatímco se [gambler.GetFirstNamePossessiveNoTooltip] raduje z vítězství." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1102.merchant: "V tiché kanceláři nedaleko [local_province.Custom('GetRegionalMarketTermGloss')] si s [other_merchant.GetTitledFirstName] dlouze povídáme o svém podnikání. Probíráme společné známé v dalekých krajích a oba vychvalujeme své úspěchy.\n\n" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1102.merchant.success: "Dobře si rozumíme. U chleba popíjíme [other_merchant.Custom('RegionalDrink')], vyměňujeme si rady a probíráme možnosti budoucího vzájemného prospěchu. Když se loučíme, [other_merchant.GetFirstNameNoTooltip] mi jako dárek na rozloučenou věnuje několik výtečných vzorků." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1102.merchant.failure: "Zdá se, že toho nemáme mnoho společného. Oba nás dráždí vychloubání toho druhého i jeho neochota sdílet užitečné informace. Brzy se rozloučím s tím nudným [other_merchant.GetWomanMan]." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1102.a: "Tohle se bude skvěle hodit." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1102.b: "Tohle bude muset stačit..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1111.desc: "Vykročím přes [local_province.Custom('GetProvinceAdjective')] ulici směrem k [urchin.Custom('GirlBoy')]. Když mě [urchin.GetSheHe] spatří, [Select_CString(urchin.IsFemale,'její','jeho')] pronikavé oči se dožadují vysvětlení. Dávám však jasně najevo, že nejsem hrozba, a opřu se o zeď vedle [urchin.GetSheHe].\n\nV [Select_CString(urchin.IsFemale,'její','jeho')] ruce se lákavě zaleskne nějaká cetka, ale jakmile [urchin.GetSheHe] sleduje můj pohled, rychle ji schová. „Co chceš?“ odsekne. „Jmenuju se [urchin.GetFirstName]. Tohle jsou #EMP moje#! ulice.“" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1111.a: "Vypadáš, že se v tomhle vyznáš." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1111.a.success_critical: "Získáš si [Select_CString(urchin.IsFemale,'její','jeho')] důvěru" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1111.a.success: "Koupíš [Select_CString(urchin.IsFemale,'její','jeho')] lup" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1111.a.failure: "Vzbudíš v [Select_CString(urchin.IsFemale,'její','jeho')] pohrdání" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1111.artifact.urchin: "Ukradl [urchin.GetFirstName] v ulicích [local_province.GetBaronyNameExplicitly]." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1111.artifact.ring: "[local_county.GetAdjectiveNoTooltip] prsten" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1111.artifact.ring.desc: "$artifact_ring_description$ $gdp_merchant_luxury_contract.1111.artifact.urchin$" # todo: NEW TRANSLATION
