 gdp_merchant_luxury_contract.1121.desc: "Při prohlížení nabízeného zboží se tvářím, že mě příliš nezajímá, a skrývám, jak moc mě ve skutečnosti láká. Těžko však říct, nakolik tomu obchodník věří.\n\nBrzy mě zaujme konkrétní předmět, který mezi ostatními vyniká. Časem se jeho styl stal exotickým dokonce i tady, v místě, kde vznikl." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1121.a: "Pojďme probrat cenu..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1121.a.success_critical: "Usmlouváš velmi výhodnou cenu" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1121.a.success: "Usmlouváš výhodnou cenu" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1121.a.failure: "[dealer.GetSheHe|U] tvrdě smlouvá" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1121.artifact.weapon: "Starožitná zbraň [artifact.GetName]" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1121.artifact.weapon.desc: "[artifact.GetDesc] Vlivem času je opotřebovaná a v boji už se nedá použít." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1121.artifact.bowl: "Starožitná mísa [local_province.GetCounty.GetCulture.GetNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1121.artifact.plate: "Starožitný talíř [local_province.GetCounty.GetCulture.GetNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1121.artifact.urn: "Starožitná urna [local_province.GetCounty.GetCulture.GetNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1131.desc: "Při prohlížení nabízených děl se tvářím, že mě příliš nezajímají, a skrývám, jak moc mě ve skutečnosti lákají. Těžko však říct, nakolik tomu obchodník věří.\n\nBrzy mě zaujme konkrétní svazek, který mezi ostatními vyniká. Pokud mohu soudit, jde o vzácné a přehlížené dílo." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1131.a: "$gdp_merchant_luxury_contract.1121.a$" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1131.a.success_critical: "$gdp_merchant_luxury_contract.1121.a.success_critical$" # todo: NEW TRANSLATION
