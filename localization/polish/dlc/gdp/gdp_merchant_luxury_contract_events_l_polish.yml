 gdp_merchant_luxury_contract.1111.artifact.brooch.desc: "$artifact_brooch_description$ $gdp_merchant_luxury_contract.1111.artifact.urchin$" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1111.artifact.necklace: "[local_county.GetAdjectiveNoTooltip] náhrdelník" # todo: NEW TRANSLATION
