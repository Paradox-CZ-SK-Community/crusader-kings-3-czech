 gdp_merchant_luxury_contract.1601.f: "Sbírka vzorků je úchvatná." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1601.f.flavor: "Vyhovuje předvádění [Concept('learning_i','@skill_learning_icon!')|E][Concept('learning','učenosti')|E] a [Concept('diplomacy_i','@skill_diplomacy_icon!')|E][Concept('diplomacy','diplomacie')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1601.f.tt: "Prozkoumáš sbírku" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1601.artifact.collection.desc: "Původně součást sbírky [scholarly_building_district.GetType.GetPrimaryBuildingType.GetName]." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1602.dean: "[scholar.GetFirstName] sleduje mou úvahu, dokud mu ji zcela nevysvětlím. Pocházím ze vzdálené země a tenhle kus papíru tam stejně nebude mít žádnou váhu.\n\nKdyž předložím všechny potřebné argumenty, nechám [scholar.GetHerHim] prostor k vyjádření." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1602.dean.success: "[Select_CString(scholar.IsFemale,'její','jeho')] tvář rozzáří široký úsměv a [scholar.GetSheHe] přinese úřední listiny, které potvrzují mé... kvality." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1602.dean.failure: "[Select_CString(scholar.IsFemale,'Její','Jeho')] kamenná tvář zvážní a [scholar.GetSheHe] mě rozpačitě požádá, abych [Select_CString(ROOT.Char.IsFemale,'odešla','odešel')]." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1602.sages: "Zdá se, že o filozofii rozmlouváme celé věky. Přemítáme o otázkách, o nichž jsem mluvil jen zřídka, a nevšímáme si, jak se obloha pomalu stmívá a ruch dalšího pracovního dne utichá.\n\n" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1602.sages.success: "Konečně [sage.Custom('GetYoungMiddleAgedOld')] [sage.GetWomanMan] vstane, vytáhne něco ze [Select_CString(sage.IsFemale,'její','jeho')] roucha, s chápavým přikývnutím mi to podá a bez okolků zmizí." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1602.sages.failure: "Konečně [sage.Custom('GetYoungMiddleAgedOld')] [sage.GetWomanMan] vstane, přehodí si [Select_CString(sage.IsFemale,'její','jeho')] roucho přes [sage.GetHerHim] a bez okolků zmizí. Alespoň jsem si náš rozhovor užil..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1602.library: "Naznačím, že mě zajímá [Select_CString(scholar.IsFemale,'její','jeho')] četba, a [scholar.GetSheHe] se mi představí jako [scholar.GetHerselfHimself] [scholar.GetFirstName]. Nějakou dobu mi [scholar.GetSheHe] vypočítává četná díla, která v rámci [Select_CString(scholar.IsFemale,'její','jeho')] studia [scholar.GetSheHe] přečetl nebo teprve hodlá přečíst, a u každého se ptá na můj názor.\n\n" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1602.library.success: "[scholar.GetFirstNameNoTooltip] se brzy usmívá jako dítě a když nadejde čas k odchodu, [scholar.GetSheHe] mi podá malý svazek a spiklenecky na mě mrkne." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1602.library.failure: "[scholar.GetFirstNameNoTooltip] brzy ztratí veškerý zájem o mě i mé odpovědi, hrubě se vrátí ke [Select_CString(scholar.IsFemale,'jejím','jeho')] poznámkám a já se rozloučím." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1602.physician: "Dám najevo svůj zájem o anatomii a přispěji, jak jen dokážu. [physician.GetSheHe|U] dlouze hovoří o fungování těla a bere do ruky kostěné pomůcky, aby [Select_CString(physician.IsFemale,'její','jeho')] argumenty názorně předvedl.\n\n" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1602.physician.success: "[physician.GetSheHe|U] vypadá, že na znalosti udělalo mé vědění dojem. Naříká nad nevědomostí [Select_CString(scholar.IsFemale,'jejích','jeho')] studentů a kolegů a předává mi jeden předmět." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1602.physician.failure: "[physician.GetSheHe|U] netrpělivě obrací [Select_CString(physician.IsFemale,'její','jeho')] oči v sloup nad mými otázkami a nejistými vysvětleními a brzy si najde nějakou otřepanou výmluvu, aby mě vykázal z místnosti." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1602.student: "V [student.Custom('GetPubName')] se báječně bavíme. Mezi těmi mladými prostopášníky se kolem mě vytvoří kroužek posluchačů a já vyprávím o svých cestách a odpovídám na jejich četné otázky.\n\n" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1602.student.success: "Putujeme z jedné krčmy do druhé, až je najednou ráno. Po poslední improvizované básni u cesty se rozloučíme a jeden z nich mi vtiskne do ruky něco na památku. To byla noc!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1602.student.failure: "Nejdřív se zdá, že se všechno daří, ale brzy je mé společnosti omrzím a já se ocitnu sám se svým pohárem na špatném konci města. Co jsem jen řekl?" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1602.botanist: "[botanist.GetFirstName] mě nadšeně provádí sbírkou a ukazuje mi pozoruhodné předměty, které jsou krásné i zajímavé.\n\n" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1602.botanist.success: "[botanist.GetSheHe|U] je mým zájmem nadšen a horlivě přikyvuje, zatímco [botanist.GetSheHe] mi ukazuje vzácnost a původ jednotlivých předmětů.\n\nKdyž už konečně musím odejít, [botanist.GetSheHe|U] mi daruje drobný předmět, o který [botanist.GetSheHe] viděl, že jsem projevil zvláštní zájem." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1602.botanist.failure: "Zdá se, že sbírku ani [Select_CString(botanist.IsFemale,'její','jeho')] výklad nedokážu náležitě ocenit, a [botanist.GetSheHe] mi brzy dá jasně najevo, že už mě tu podle [Select_CString(botanist.IsFemale,'jejích','jeho')] požadavků není třeba..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1602.a: "Budu si ho hýčkat!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1602.b: "Asi to ujde." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1611.desc: "Děkan se ke mně zprvu chová odmítavě, ale když mu objasním, že jsem úspěšný kupec z dalekého [merchant.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip], je zjevně polichocen. Okázale se představí [scholar.GetHerselfHimself] jako [scholar.Custom('MistressMaster')|U] [scholar.GetFirstName].\n\n[scholar.GetSheHe|U] mě zve do [Select_CString(scholar.IsFemale,'její','jeho')] soukromé pracovny a cestou mi ukazuje architektonické zvláštnosti a zajímavosti. „Tak co pro vás mohu udělat, vážený [merchant.GetTitledFirstNameNoTooltip]?“ usměje se [scholar.GetSheHe]." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1611.a: "Kéž bych tu býval mohl studovat..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1611.a.flavor: "Zkouška tvé [Concept('diplomacy_i','@skill_diplomacy_icon!')|E][Concept('diplomacy','diplomacie')|E] a [Concept('prestige_i','@prestige_icon!')|E][Concept('prestige_level','úrovně slávy')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1611.a.success_critical: "Je ti udělen čestný diplom" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1611.a.success: "Je ti nabídnut čestný diplom za poplatek" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1611.a.failure: "[scholar.GetFirstNameNoTooltip] se urazí" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1611.artifact.certificate: "Čestný diplom" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1611.artifact.certificate.desc: "Čestné osvědčení o vzdělání, které udělil děkan budovy [scholarly_building_district.GetType.GetPrimaryBuildingType.GetName] v [local_province.GetBaronyNameExplicitly]." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1621.desc: "K mudrci přistupuji obezřetně a dávám pozor, abych příliš nenarušil [Select_CString(sage.IsFemale,'její','jeho')] hluboké soustředění. Jenže to [sage.GetSheHe|U] vyleká mě!\n\n„Připojíte se ke mně?“ zeptá se [sage.GetSheHe] klidně, aniž se otočí, nebo dokonce otevře [Select_CString(sage.IsFemale,'její','jeho')] oči. „Pojďte a posaďte se.“\n\nPokorně přijímám [Select_CString(sage.IsFemale,'její','jeho')] nabídku a co nejzdvořileji se usazuji vedle [sage.GetHerHim].\n\n„Jmenuji se [sage.GetFirstName],“ zachraptí [sage.GetSheHe]. „Co vás přivádí na toto místo?“" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1621.a: "Já... nevím." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1621.a.flavor: "Zkouška tvé [Concept('learning_i','@skill_learning_icon!')|E][Concept('learning','učenosti')|E] a [Concept('piety_i','[GetLocalPlayerPietyTextIcon]')|E][Concept('piety_level','úrovně oddanosti')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1621.a.success: "[sage.GetSheHe|U] je povzbuzen" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1621.a.failure: "[sage.GetSheHe|U] je zklamán" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1631.desc: "Vstupuji do místnosti, kde se táhnou zdánlivě nekonečné řady polic napěchovaných svitky. Vzduch je prosycen zatuchlým pachem starého inkoustu a papíru.\n\nTiše přistupuji k mlčícímu učenci a konečně upoutám [Select_CString(scholar.IsFemale,'její','jeho')] pozornost. [Select_CString(scholar.IsFemale,'její','jeho')] pohled, zpočátku zaneprázdněný a odmítavý, změkne, když [Select_CString(scholar.IsFemale,'její','jeho')] zvědavost vzbudí můj cizokrajný původ. " # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1631.a: "Co to čtete, příteli?" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1631.a.success: "[scholar.GetSheHe|U] je ohromen tvými znalostmi" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1631.a.failure: "[scholar.GetSheHe|U] tě považuje za hlupáka" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1631.artifact.book.desc: "[artifact.GetDesc] $gdp_merchant_luxury_contract.1601.artifact.collection.desc$" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1641.desc: "Čeká mě ponurý výjev. V úhledných řadách leží nespočet kostí, lidských i zvířecích. [physician.GetWomanMan], kterého doprovází [merchant.Custom2('QuirkAdjectivePosOrNeg', physician)], do nich šťouchá a ukazuje je hrstce studentů.\n\n[physician.GetSheHe|U] si mě konečně všimne, zvědavě se na mě podívá a pokyne mi, abych se připojil ke skupině. Zjišťuji, že jde o [physician.GetFirstName], a s úlevou zjišťuji, že [physician.GetSheHe] je skutečně [physician.GetWomanMan] lékař." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1641.a: "Ach, to je kost [merchant.Custom('RandomSaintBone')|l], že?" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1641.a.success: "[physician.GetFirstNameNoTooltip] je ohromen" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1641.a.failure: "[physician.GetFirstNameNoTooltip] se na tebe zlobí" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1641.artifact.elixir.desc: "$artifact_elixir_description$. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1641.artifact.bone: "Lidská kost [physician.Custom('RandomSaintBone')]" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1641.artifact.bone.desc: "Kost používaná jako učební pomůcka při výuce medicíny. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1641.artifact.skull: "Lidská lebka" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1641.artifact.skull.desc: "Lebka používaná jako učební pomůcka při výuce medicíny. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1651.desc: "Přistoupím ke skupině a představím se. Studenti kolem mě utvoří kruh a smějí se mezi sebou, ale zjevně je zaujal cizinec, který se k nim přidal.\n\nKdyž se dozvědí, že jsem protřelý kupec z dalekého [merchant.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip], vzbudím jejich zvědavost a pozvou mě do nedalekého proslulého podniku na... občerstvení." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1651.a: "Do krčmy!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1651.a.success: "Studenty pobavíš" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1651.a.failure: "Studenty nudíš" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1661.desc: "Vstupuji do podivné haly a zůstávám ohromen. Takovou sbírku jsem ještě neviděl: nepřeberné množství barev, okvětních lístků a listů, kožešin a peří; pastva pro smysly a souhrn všeho, co příroda nabízí...\n\nDo reality mě vrátí správce tohoto místa, který se představí [botanist.GetHerselfHimself] jako [botanist.GetFirstName] a nabídne mi prohlídku." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1661.a: "Budu vám vděčný!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1661.a.success: "[botanist.GetFirstNameNoTooltip] oceňuje tvůj zájem" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1661.a.failure: "[botanist.GetFirstNameNoTooltip] není příliš ohromen" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1661.artifact.flower.desc: "$artifact_pressed_flower_description$ $gdp_merchant_luxury_contract.1601.artifact.collection.desc$" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1661.artifact.animal.desc: "[newly_created_artifact.Custom('ArtifactAnimalTrinketType')] zvířete [owner.Custom('GetAnimalType')]. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1661.artifact.feather.desc: "Peří zvířete [owner.Custom('GetAnimalType')]. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$" # todo: NEW TRANSLATION
