 gdp_merchant_luxury_contract.1131.artifact.book.desc: "[artifact.GetDesc] Získáno od obchodníka v [local_province.GetBaronyNameExplicitly]." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1141.desc: "S vřelým úsměvem přistoupím k [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('traveler') )] vůdci skupiny v naději, že nás v cizím prostředí sblíží, že jsme oba cizinci.\n\n[traveler.GetWomanMan] se představí jako [traveler.GetHerselfHimself] [traveler.GetFirstName]. Na oplátku se představím jako „[merchant.GetNameNoTooltip]. Jistě jste o mně slyšel?“ napůl blufuju a napůl žertuju." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1141.a: "Určitě znáš spoustu zajímavých příběhů!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1141.a.flavor: "Ověří tvou [diplomacy_i|E][Concept('diplomacy','diplomacie')|E] a [Concept('prestige_i','@prestige_icon!')|E][Concept('prestige_level','úrovně slávy')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1141.a.success: "S [traveler.GetFirstNameNoTooltip] si padnete do oka" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1141.a.failure: "[traveler.GetFirstNameNoTooltip] tě má brzy dost" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1141.artifact.weapon.desc: "[artifact.GetDesc] Získáno od obchodníka v [local_province.GetBaronyNameExplicitly]. Vlivem času je opotřebovaná a v boji už se nedá použít." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1141.artifact.brooch: "[traveler.GetCulture.GetNameNoTooltip] brož" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1141.artifact.brooch.desc: "$artifact_brooch_description$ Získáno od cestovatelů v [local_province.GetBaronyNameExplicitly]." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1151.desc: "Protlačím se závěsem do špinavého doupěte a rozhlédnu se po zvrhlících a tulácích. Uprostřed místnosti sedí hráč a spokojeně počítá mince.\n\nPosadím se naproti a [gambler.GetWomanMan] si mě přeměří se zdviženým obočím. „Chceš si zahrát, co?“ usměje se [gambler.GetSheHe]. „Jsem [gambler.GetFirstName], a až tě připravím o mince, nebreč.“" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1151.a: "Pojďme si zahrát." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1151.a.flavor: "Ověří tvé [Concept('intrigue_i','@skill_intrigue_icon!')|E][Concept('intrigue','pletichářství')|E] a štěstí" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1151.a.success: "Připravíš [gambler.GetHerHim] o všechny peníze" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1151.a.failure: "Vyhraješ nějaké mince" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1151.a.failure_critical: "Prohraješ nějaké mince" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1151.artifact.dice: "Hráčovy šťastné kostky" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1151.artifact.dice.desc: "Kostky, které si [gambler.GetFirstName], darebák a hráč z [local_province.GetBaronyNameExplicitly], těžce vybojoval." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1161.desc: "Přeruším obchodníkovo reptání a představím se jako hlava [merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] se sídlem v [merchant.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. Dodám, že tu nejsem pracovně.\n\nDozvím se, že [other_merchant.GetSheHe] se jmenuje [other_merchant.GetName] a pochází z [other_merchant.GetCapitalLocation.GetBaronyNameExplicitly]. Obchoduje zde s [merchant_good.GetName]. Když se navzájem představíme, [other_merchant.GetSheHe] mi nabídne pohostinství v nedalekém domě." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1161.a: "Je toho hodně, o čem můžeme mluvit." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1161.a.flavor: "Ověří tvé [Concept('stewardship_i','@skill_stewardship_icon!')|E][Concept('stewardship','správcovství')|E] a [Concept('prestige_i','@prestige_icon!')|E][Concept('prestige_level','úrovně slávy')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1161.a.success: "[other_merchant.GetFirstNameNoTooltip] k tobě pookřeje" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1161.a.failure: "[other_merchant.GetFirstNameNoTooltip] je neoblomný" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1161.artifact.fabric: "Vzorky látek" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1161.artifact.fabric.desc: "Vzorky [other_merchant.Custom('RegionalFabric')] z [local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip], které obchodníci používají při svých jednáních." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1161.artifact.gem: "Vzorky drahokamů" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1161.artifact.gem.desc: "Vzorky drahých kamenů z [local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip], které obchodníci používají při svých jednáních." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1161.artifact.gold: "Vzorky kovů" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1161.artifact.gold.desc: "Vzorky drahých kovů z [local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip], které obchodníci používají při svých jednáních." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1501.t: "[task_contract.GetType.GetName]: Náboženské centrum" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1501.desc: "Putujeme po cestách, po nichž kráčely nesčetné zástupy poutníků a věřících, a brzy dorazíme k nádherné stavbě [religious_building_district.GetType.GetPrimaryBuildingType.GetName] [CZPrepV(religious_building_province.GetNameNoTooltip)] [CZProvName(religious_building_province,'L')].\n\n" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1501.site: "Hrobka je velkolepým pomníkem horlivosti, s níž minulí vládci [religious_building_faith.GetReligion.GetAdjective] uctívali [religious_building_faith.HighGodName]. Zevnitř se ozývá melodické mumlání probíhající bohoslužby." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1501.tombs: "Nedaleko se zvedá skupina zvětralých kamenných hrobek označených [religious_building_faith.ReligiousSymbol], zarostlých a rozrušených mnoha ročními obdobími." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1501.pilgrim: "Věřící v pravidelných zástupech čekají, až budou moci vstoupit. Jejich oděv prozrazuje, že jde o poutníky. Zvlášť mě zaujme jedna skupinka, která společně nese jakousi relikviářovou schránku." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1501.monks: "Nedaleko se ve stínu tiše shlukuje skupina mnichů. Přemítají a šeptem spolu hovoří, zatímco svět kolem nich líně plyne." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1501.keepsake: "Když se blížím k budově, všimnu si zvětralého místa ve zdivu, kde čas uvolnil a popraskal několik kamenů." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1501.apostate: "Opodál, na [Select_CString(pilgrim.IsFemale,'její','jeho')] vlastní pěst, sedí ve stínu budovy ustaraně vyhlížející [pilgrim.GetWomanMan]. Lokty má na [Select_CString(pilgrim.IsFemale,'jejích','jeho')] kolenou, v jedné ruce si podpírá tvář a v druhé drží malou knihu." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1501.a: "Chci se podívat dovnitř." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1501.a.flavor: "Přeje ukázkám [learning_i|E][Concept('learning','učenosti')|E] a [Concept('piety_i','[GetLocalPlayerPietyTextIcon]')|E][Concept('piety','zbožnosti')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1501.a.tt: "Uvidíš, co se skrývá uvnitř [religious_building_faith.HouseOfWorship]" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1501.b: "V těch hrobkách se určitě něco najde..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1501.b.flavor: "Přeje ukázkám [intrigue_i|E][Concept('intrigue','pletichářství')|E] a [Concept('prowess_i','@skill_prowess_icon!')|E][Concept('prowess','udatnosti')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1501.b.tt: "V noci se vrátíš a vykradeš hrob" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1501.c: "Ti poutníci vypadají důvěřivě..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1501.c.flavor: "Přeje ukázkám [intrigue_i|E][Concept('intrigue','pletichářství')|E] a [Concept('diplomacy_i','@skill_diplomacy_icon!')|E][Concept('diplomacy','diplomacie')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1501.c.tt: "Pokusíš se napálit poutníka" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1501.d: "Chci si promluvit s těmi mnichy." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1501.d.flavor: "Přeje ukázkám [learning_i|E][Concept('learning','učenosti')|E] a [Concept('piety_i','[GetLocalPlayerPietyTextIcon]')|E][Concept('piety','zbožnosti')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1501.d.tt: "Pustíš se s mnichy do rozhovoru" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1501.e: "Nikdo si nevšimne, když bude chybět jeden kámen..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1501.e.flavor: "Přeje ukázkám [intrigue_i|E][Concept('intrigue','pletichářství')|E] a [Concept('prowess_i','@skill_prowess_icon!')|E][Concept('prowess','udatnosti')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1501.e.tt: "Pokusíš se odštípnout kus budovy" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1501.f: "Vypadá to, že ten [pilgrim.GetWomanMan] [pilgrim.GetSheHe] potřebuje pomoc." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1501.f.flavor: "Přeje ukázkám [diplomacy_i|E][Concept('diplomacy','diplomacie')|E] a [Concept('piety_i','[GetLocalPlayerPietyTextIcon]')|E][Concept('piety','zbožnosti')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1501.f.tt: "Dáš se s poutníkem do řeči" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1502.site: "[priest.Custom('PriestTitle')] si mě pozorně prohlíží a zvažuje má slova i výraz, zatímco kolem nás procházejí věřící a mumlají modlitby a přání.\n\n" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1502.site.success: "Nakonec si [priest.GetSheHe] povzdechne: „Nemohu odmítnout vaši upřímnou žádost.“ [priest.GetSheHe|U] sáhne po nedaleké knize, [Select_CString(priest.IsFemale,'její','jeho')] prsty chvíli přejíždějí po jejích deskách a pak mi ji podá.\n\n„Vezměte si ji, příteli. Kéž v ní naleznete slovo [religious_building_faith.HighGodNameAlternate].“" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1502.site.failure: "Nakonec se [priest.GetSheHe] zamračí. „Odejděte, nemáte tu co dělat. Tohle je [religious_building_faith.HouseOfWorship], místo modlitby. Na vaše hlouposti dnes nemám čas.“\n\nNěkolik věřících se otočí a čeká, až odejdu." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1502.pilgrim: "Díky přátelskému vyptávání nakonec zjistím, že přinesli relikvii, kterou chtějí věnovat [pilgrim.GetFaith.HouseOfWorship]. Získali ji nedaleko svého domova.\n\nPředstírám zděšení a dávám najevo, že mě rozhořčilo, jak hanebně je napálili!\n\n" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1502.pilgrim.success: "Jsou rozrušení, ale ne rozzlobení. Sleduji, jak odcházejí a odhazují malou schránku na odpadní plochu za areálem." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1502.pilgrim.failure: "Jejich reakce mě však poněkud zaskočí: hodí relikvii na zem, rozbijí ji na kousky a rozkopou, čímž zděsí přihlížející dav.\n\nRaději bych měl odejít..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1502.tomb: "Tyhle hrobky se otvírají hůř, než vypadají! Nakonec se nám s obrovským úsilím podaří rozebrat jednu z honosnějších památek.\n\nOtřu si pot a nahlédnu do její temné hloubky. Něco tam zahlédnu, opatrně sáhnu dovnitř a vytáhnu to ven.\n\n„Přineste světlo!“ zašeptám netrpělivě.\n\nV rukou držím..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1502.tomb.success_critical: "jemně zpracovaná a zdobená urna!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1502.tomb.success: "opotřebovaná a poškozená urna?" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1502.tomb.failure: "#EMP kost#!?" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1502.monks: "Tito mniši jsou ještě zajímavější, než jsem si myslel! Život v řeholním rouše přináší mnoho podnětných výkladů a postřehů, od [monk.GetFaith.ReligiousText] až po tajemství [monk.GetFaith.TricksterGodName].\n\n" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1502.monks.success: "Pustíme se do dlouhého rozhovoru a zdá se, že mnichům je líto, že se se mnou musejí rozloučit. Když se loučíme, [monk.GetFirstName] mi něco vtiskne do dlaně a odchází s vřelým úsměvem." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1502.monks.failure: "[monk.GetFirstName] však pokaždé, když se dostanu ke slovu, ztrácí zájem a tváří se nespokojeně či znuděně. Brzy mi dá jasně najevo, že jsem tu už příliš dlouho." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1502.keepsake: "Ještě jednou se ohlédnu a pokusím se v jediném plynulém pohybu do zdi udeřit, zachytit kus a popadnout ho.\n\n" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1502.keepsake.success: "S grácií a obratností odlomím kousek zdi a schovám si ho pod plášť, zatímco nonšalantně pokračuji v chůzi. Zdá se, že si toho nikdo nevšiml!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1502.keepsake.failure: "Mé ubohé pokusy mě jen s žuchnutím srazí k zemi. Syčím bolestí, zatímco několik zvědavých poutníků nevěřícně střídavě hledí na mě a na zeď." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1502.apostate: "[pilgrim.GetWomanMan] nijak neprotestuje, když si sedám vedle [pilgrim.GetHerHim] a tiše si vybavuji své oblíbené verše z [merchant.GetFaith.ReligiousText]. [pilgrim.GetSheHe] však brzy přestává plakat a má slova ho rozptýlí.\n\n" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1502.apostate.success_critical: "Cítím, že má slova [pilgrim.GetSheHe] dojímají. A skutečně, netrvá dlouho a [pilgrim.GetFirstName] mi dá jasně najevo, že [pilgrim.GetSheHe] si přeje toto místo opustit a vydat se se mnou na cestu [merchant.GetFaith.HighGodNameAlternate]!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1502.apostate.success: "Při čtení cítím, jak se [pilgrim.GetHerHim] rozpoložení mění, jako by [Select_CString(pilgrim.IsFemale,'jejích','jeho')] ramen spadlo těžké břímě.\n\nBeze slova [pilgrim.GetSheHe] vstane a odejde z areálu. [Select_CString(pilgrim.IsFemale,'její','jeho')] potrhaná kniha zůstane ležet vedle mě." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1502.apostate.failure: "Netrvá však dlouho a [Select_CString(pilgrim.IsFemale,'její','jeho')] tvář ztvrdne. [pilgrim.GetSheHe] se roznítí novou emocí: zuřivostí.\n\n[Select_CString(pilgrim.IsFemale,'Její','Jeho')] křik, že [pilgrim.GetHerHim] svádím k odpadlictví — a ještě k tomu na pozemcích [pilgrim.GetFaith.HouseOfWorship]! — brzy přiláká rozhořčené přihlížející..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1502.a.critical: "Tohle bude víc než dobré!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1502.a: "Tohle bude stačit." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1502.b: "Tohle bude muset stačit..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1511.desc: "Po západu slunce se potají vracíme do blízkosti [religious_building_district.GetType.GetPrimaryBuildingType.GetName] a hledáme bohatství v zapomenutých hrobech dávno zesnulých místních obyvatel.\n\nVe strachu, že nás někdo spatří, se vyhýbáme obvyklým cestám a nakonec se ocitáme na chladném a tichém hřbitově." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1511.a: "Otevřeme hrob, a rychle!" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1511.a.flavor: "Zkouška tvého [intrigue_i|E][Concept('intrigue','pletichářství')|E] a [Concept('prowess_i','@skill_prowess_icon!')|E][Concept('prowess','udatnosti')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
