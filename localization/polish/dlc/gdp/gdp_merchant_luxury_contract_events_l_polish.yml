 gdp_merchant_luxury_contract.1511.artifact.bone.desc: "Kost dávno zesnulého [religious_building_faith.GetAdherentName], uloupená z hrobu v [religious_building_district.GetType.GetPrimaryBuildingType.GetName]." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1521.desc: "Když projdu velkými dveřmi do přítmí, ocitnu se ve zdobené vstupní hale, těžké exotickými vůněmi obřadů a obětin.\n\nVěřící se shromažďují kolem [priest.GetWomanMan], [priest.Custom('PriestTitle')], který rozmlouvá s přítomnými. Okamžitě si mě všimne — je jasné, že sem nepatřím.\n\n[priest.GetSheHe|U] ke mně [merchant.Custom2( 'QuirkAdverbPosOrNeg', SCOPE.sC('priest') )] přistoupí. „Vítej, právě se nacházíš v [religious_building_district.GetType.GetPrimaryBuildingType.GetName].“\n\n„Co tu hledáš?“ zeptá se [priest.GetSheHe] a zvědavě si mě prohlíží. „Řídíš se zásadami [religious_building_faith.GetNameNoTooltip]?“" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1521.a: "Chci se o [religious_building_faith.GetNameNoTooltip] dozvědět všechno, co se dá." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1521.a.flavor: "Zkouška tvého [learning_i|E][Concept('learning','učenosti')|E] a [Concept('piety_i','[GetLocalPlayerPietyTextIcon]')|E][Concept('piety_level','úrovně oddanosti')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1521.a.success: "[priest.Custom('PriestTitle')] mi nabídne text" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1521.a.failure: "[priest.Custom('PriestTitle')] je podezřívavý" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1531.desc: "[merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('pilgrim') )] poutníci si mě podezřívavě prohlížejí, když se k nim přibližuji. Pevně svírají svou skromnou relikvii, zatímco se snažím lépe si ji prohlédnout.\n\nPro [pilgrim.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip] má jistě velký význam a v [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] by se o ní dobře vyprávělo.\n\nJistě dokážu tyhle prosťáčky přesvědčit, že je napálil nějaký kramář nebo bezohledný [pilgrim.GetFaith.PriestNeuter]..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1531.a: "Je to očividný padělek, v [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetHolder.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] jich jsou stovky..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1531.a.success: "Poutníci relikvii odhodí" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1531.a.failure: "Poutníci se rozzlobí" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1541.desc: "Mniši se na mě zpočátku dívají úkosem, zaskočeni mými cizokrajnými způsoby, ale nedokážou skrýt zvědavost, zvlášť když jim dám najevo, že chci rozmlouvat o teologii.\n\nMladší mniši si nejsou jistí, ale jejich vůdce, [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('monk') )] [monk.GetFirstName], mě přijme do svého kruhu a zahrne mě otázkami o mých cestách." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1541.a: "Ano, ano, ale co si myslíte o [monk.GetFaith.WealthGodName]?" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1541.a.flavor: "Zkouška tvého [learning_i|E][Concept('learning','učenosti')|E] a [Concept('piety_i','[GetLocalPlayerPietyTextIcon]')|E][Concept('piety_level','úrovně oddanosti')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1541.a.success: "Mniši si rozhovor užívají" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1541.a.failure: "Mniši nejsou příliš nadšení" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1541.artifact.prayer_beads: "Modlitební korálky [religious_building_faith.GetAdjectiveNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1541.artifact.prayer_beads.desc: "Sada modlitebních korálků [religious_building_faith.GetAdjective], dar od mnicha z [religious_building_district.GetType.GetPrimaryBuildingType.GetName]." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1541.artifact.icon: "Ikona [religious_building_faith.GetAdjectiveNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1541.artifact.icon.desc: "[SCOPE.Custom('ArtifactArticleWealth')] ikona [SCOPE.Custom('ArtifactQuality')] řemeslného zpracování zobrazující [newly_created_artifact.GetFeatureText('icon_decoration')], dar od mnicha [monk.GetFirstName] z [religious_building_district.GetType.GetPrimaryBuildingType.GetName]." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1551.desc: "Nenápadně se rozhlížím a nenuceně procházím kolem [religious_building_district.GetType.GetPrimaryBuildingType.GetName]. Zdvořile se usmívám na kolemjdoucí a předstírám, že obdivuji architekturu.\n\nPostupně se zaměřím na vybranou část kamenného zdiva, která se zdá být už uvolněná. Nachází se v jedné z nejklidnějších částí obvodu areálu." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1551.a: "Jen musím najít tu správnou chvíli..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1551.a.success: "Ulomíš kus kamenného zdiva" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1551.a.failure: "Přistihnou tě při činu" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1551.artifact.edifice: "Posvátný kámen" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1551.artifact.edifice.desc: "Malý úlomek kamenného zdiva z náboženského centra [religious_building_district.GetType.GetPrimaryBuildingType.GetName], který jsem ukradl na památku." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1561.desc: "Když přistupuji k [pilgrim.GetWomanMan], je jasné, že [pilgrim.GetSheHe] je poutníkem jako mnozí další zde — je obtěžkaný cestovní výbavou a spálený od slunce.\n\nDozvídám se, že [Select_CString(pilgrim.IsFemale,'její','jeho')] jméno je [pilgrim.GetFirstName] a po mnoha neštěstích [pilgrim.GetSheHe] ztratil [Select_CString(pilgrim.IsFemale,'její','jeho')] víru v [pilgrim.GetFaith.GetAdjectiveNoTooltip] [pilgrim.GetFaith.HighGodName]. Ani tato pouť ji nedokázala obnovit.\n\nVšimnu si [Select_CString(pilgrim.IsFemale,'jejími','jeho')] slzami potřísněného a značně opotřebovaného [pilgrim.GetFaith.ReligiousText]. Je svědectvím o [Select_CString(pilgrim.IsFemale,'jejích','jeho')] útrapách." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1561.a: "[merchant.GetFaith.ReligiousText] má odpovědi..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1561.a.flavor: "Zkouška tvé [Concept('diplomacy_i','@skill_diplomacy_icon!')|E][Concept('diplomacy','diplomacie')|E] a [Concept('piety_i','[GetLocalPlayerPietyTextIcon]')|E][Concept('piety_level','úrovně oddanosti')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1561.a.success_critical: "[pilgrim.GetFirstNameNoTooltip] konvertuje" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1561.a.success: "[pilgrim.GetFirstNameNoTooltip] pookřeje" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1561.a.failure: "[pilgrim.GetFirstNameNoTooltip] se rozzuří" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1561.artifact.holy_book: "Slzami potřísněný [religious_building_faith.ReligiousText|U]" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1561.artifact.holy_book.desc: "Osobní svatá kniha ztrápeného [pilgrim.GetFaith.GetAdherentNameNoTooltip] jménem [pilgrim.GetFirstName], který ztratil [Select_CString(pilgrim.IsFemale,'její','jeho')] víru." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1601.t: "[task_contract.GetType.GetName]: Centrum vědění" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1601.desc: "Rozsah [scholarly_building_district.GetType.GetPrimaryBuildingType.GetName] mě ohromuje. Jeho pozemky a síně překypují učenými lidmi, kteří diskutují a přemítají.\n\n" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1601.dean: "[scholar.GetWomanMan], neustále [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )], spěchá sem a tam v doprovodu služebnictva a povýšeně odbývá [Select_CString(scholar.IsFemale,'její','jeho')] kolegy. Zjevně [scholar.GetSheHe] to tu má na starost." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1601.sages: "Pod stromem na pozemcích tiše sedí vrásčitý starý [sage.GetWomanMan]. Možná rozjímá nad hlubokou otázkou vesmíru, možná si jen zdřímnul." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1601.library: "Když míjím dveře, spatřím [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )] [scholar.GetWomanMan] o samotě v působivé knihovně, obklopeného hromadami knih. [scholar.GetSheHe|U] se zdá být v naprosté blaženosti a tiše čte." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1601.physician: "V jiné místnosti [physician.GetWomanMan] předsedá děsivé sbírce zvířecích i lidských vzorků a všemožných nástrojů. Nezbývá než doufat, že [physician.GetSheHe] je skutečně lékař..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1601.student: "Jedné zvlášť hlučné skupiny studentů si nelze nevšimnout. Dobromyslně se hádají a hlasitě se smějí, zatímco se navzájem škádlí ve stinném koutě centrálního nádvoří." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1601.botanist: "V klidném koutě areálu narazím na místnost se zvláštní sbírkou rostlin a živočichů, které konzervuje a katalogizuje [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )] [botanist.GetWomanMan]." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1601.a: "To musí být děkan." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1601.a.flavor: "Vyhovuje předvádění [Concept('diplomacy_i','@skill_diplomacy_icon!')|E][Concept('diplomacy','diplomacie')|E] a [Concept('prestige_i','@prestige_icon!')|E][Concept('prestige_level','úrovně slávy')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
