 gdp_merchant_luxury_contract.1601.b: "Přitahuje mě ten starý [sage.GetWomanMan]..." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1601.b.flavor: "Vyhovuje předvádění [Concept('learning_i','@skill_learning_icon!')|E][Concept('learning','učenosti')|E] a [Concept('piety_i','[GetLocalPlayerPietyTextIcon]')|E][Concept('piety_level','úrovně oddanosti')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1601.b.tt: "Přistoupíš k mudrci" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1601.c: "V knihovně člověk vždy najde vědění." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1601.c.flavor: "Vyhovuje předvádění [Concept('learning_i','@skill_learning_icon!')|E][Concept('learning','učenosti')|E] a [Concept('diplomacy_i','@skill_diplomacy_icon!')|E][Concept('diplomacy','diplomacie')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1601.c.tt: "Vstoupíš do knihovny" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1601.d: "Lékařské umění je fascinující." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1601.d.flavor: "Vyhovuje předvádění [Concept('learning_i','@skill_learning_icon!')|E][Concept('learning','učenosti')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_luxury_contract.1601.d.tt: "Přistoupíš k lékaři" # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1601.e: "Ti studenti vypadají zábavně." # todo: NEW TRANSLATION
 gdp_merchant_luxury_contract.1601.e.flavor: "Vyhovuje předvádění [Concept('diplomacy_i','@skill_diplomacy_icon!')|E][Concept('diplomacy','diplomacie')|E] a [Concept('prowess_i','@skill_prowess_icon!')|E][Concept('prowess','udatnosti')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
