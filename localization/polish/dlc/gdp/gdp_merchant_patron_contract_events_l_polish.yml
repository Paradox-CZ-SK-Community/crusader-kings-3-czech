l_polish:
 gdp_merchant_patron_contract.0001.t: "[task_contract.GetType.GetName]: [patron.Custom('GetRoomPlural')|U] [patron.Custom('CZ_TitledFirstName_G')] " # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [patron.GetTitleAsName]; navyše [patron.GetTitledFirstName]
 gdp_merchant_patron_contract.0001.desc: "[patron.GetTitledFirstName] je mimořádná osobnost, ať už jde o [patron.GetWomanMan], a šlechtici, kněží, obchodníci i prostí lidé z [patron.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] i z daleka se předhánějí v tom, kdo upoutá [Select_CString(patron.IsFemale,'její','jeho')] pozornost a získá [Select_CString(patron.IsFemale,'její','jeho')] přízeň.\n\nMusíme jednat otevřeně, ale zároveň opatrně, chceme-li zajistit, aby společnost zůstala v [Select_CString(patron.IsFemale,'její','jeho')] přízni, aby ji nezastínil prohnanější soupeř ani aby zcela neunikla [Select_CString(patron.IsFemale,'její','jeho')] pozornosti.\n\nO našem podnikání musí neustále mluvit významní a vážení lidé z [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [patron.GetHerHis], [patron.GetHerHis], [patron.GetHerHis]
 gdp_merchant_patron_contract.0001.a: "$merchant_base_patron_contract_schemes.0000.generic_option.success_chance$" # todo: NEW TRANSLATION
 gdp_merchant_patron_contract.0001.b: "$merchant_base_patron_contract_schemes.0000.generic_option.speed$" # todo: NEW TRANSLATION
 gdp_merchant_patron_contract.0001.c: "$merchant_base_patron_contract_schemes.0000.generic_option.progress$" # todo: NEW TRANSLATION
 gdp_merchant_patron_contract.0001.d: "$merchant_base_patron_contract_schemes.0000.generic_option.nothing$" # todo: NEW TRANSLATION
 gdp_merchant_patron_contract.0001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$" # todo: NEW TRANSLATION
 gdp_merchant_patron_contract.0002.t: "$gdp_merchant_patron_contract.0001.t$: Úspěch!" # todo: NEW TRANSLATION
 gdp_merchant_patron_contract.0002.desc: "[patron.GetTitledFirstName] neodolal mým vyprávěním o vzdálených zemích a spletitých obchodních cestách a každý večer u tabule při hostině hltal každé mé slovo.\n\nMohu se vrátit ke společnosti s vědomím, že [patron.GetFirstNameNoTooltip] nás považuje za cenné partnery a vítané přátele.\n\nNaše pověst v [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] značně vzrostla a není pochyb, že pověst o mém vlivu mě předběhne i do vzdálenějších krajů." # todo: NEW TRANSLATION
 gdp_merchant_patron_contract.0002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$" # todo: NEW TRANSLATION
 gdp_merchant_patron_contract.0003.t: "$gdp_merchant_patron_contract.0001.t$: Neúspěch!" # todo: NEW TRANSLATION
 gdp_merchant_patron_contract.0003.desc: "[patron.GetTitledFirstName] si mě žádal čím dál méně. Udělal jsem něco špatně? Změna v chování dvořanů z [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] mi potvrzuje [Select_CString(patron.IsFemale,'její','jeho')] nelibost.\n\nNudily [patron.GetHerHim] mé příběhy? Mluvil jsem příliš často o vrtkavosti obchodu? Překročil jsem nějakou neviditelnou hranici #EMP noblesse#!?\n\nTeď už nezbývá než se vrátit ke společnosti, napravit škody a vrátit věci na správnou cestu..." # todo: NEW TRANSLATION
 gdp_merchant_patron_contract.0003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$" # todo: NEW TRANSLATION
