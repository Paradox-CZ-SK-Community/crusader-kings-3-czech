l_polish:
 gdp_merchant_scheme_advantage.1000.t: "[task_contract.GetType.GetName]: Prosazování výhod" # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1000.intro: "Přemýšlím, jak urychlit naše podnikání zde v [task_contract_location.GetBaronyNameExplicitly], a obracím se na" # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1000.intro.rival: "to, jak nám překáží přítomnost našeho rivala, [rival.Custom('CZ_TitledFirstName_G')]." # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1000.intro.partner: "svého partnera, [portrait.GetTitledFirstName], aby [Select_CString(portrait.IsFemale,'přišla','přišel')] s řešením." # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1000.intro.agent: "svého společníka, [portrait.GetTitledFirstName], aby [Select_CString(portrait.IsFemale,'přišla','přišel')] s řešením." # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1000.intro.trader: "svého obchodníka, [portrait.GetTitledFirstName], aby [Select_CString(portrait.IsFemale,'přišla','přišel')] s řešením." # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1000.desc.associate: "\n\nKdyby se [portrait.Custom('CZ_TitledFirstName_G')] konečně začal věnovat práci a plně se soustředil na [Select_CString(portrait.IsFemale,'její','jeho')] záležitost, mohli bychom ji jistě co nevidět mít za sebou..." # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1000.desc.unity: "\n\nKdyby společnost táhla za jeden provaz a pořádně přiložila ruku k dílu, mohli bychom mít tuhle záležitost jistě co nevidět za sebou..." # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1000.desc.stress: "\n\nMožná bych si měl v zájmu společnosti vyhrnout rukávy a pustit se konečně do pořádné práce, abychom se mohli věnovat i jiným věcem..." # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1000.a: "„Za co tě vlastně platím, [portrait.Custom('CZ_TitledFirstName_G')]?!“" # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1000.a.flavor: "[Concept('associate_i','@courtier_icon!')|E] [portrait.Custom('CZ_TitledFirstName_G')] je přetížen" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_scheme_advantage.1000.b: "„Celá společnost by měla pořádně zabrat!“" # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1000.b.flavor: "[Concept('company_sentiment_i','@company_sentiment_icon!')|E] [Concept('company','Společnost')|E] je přetížená" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_scheme_advantage.1000.c: "„Dobrá, budu to muset udělat sám!“" # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1000.c.flavor: "[Concept('stress_i','@stress_icon!')|E] Jsi přetížen" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_scheme_advantage.1000.d.associate: "„Tak pojď, [portrait.GetFirstNameNoTooltip] toho jistě zvládne víc.“" # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1000.d.unity: "„V téhle společnosti jsou samí povaleči!“" # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1000.d.stress: "„Prostě budu muset ještě trochu pracovat...“" # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1000.e: "„Ach, nechme to být...“" # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1010.t: "$gdp_merchant_scheme_advantage.1000.t$" # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1010.intro: "[trader.GetFirstName] a já každý den sedíme a probíráme nejlepší způsoby, jak se přiblížit našemu cíli. Můj obchodník opakovaně poukazuje na to, že nám v [task_contract_location.GetBaronyNameExplicitly] chybí spolehliví lidé.\n\n„Víš,“ povzdechne si [trader.GetFirstNameNoTooltip], „je tu [recruit.GetWomanMan], který by nám mohl pomoct." # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1010.desc.liege: "[recruit.GetFirstName] se jmenuje a je to [Select_CString(recruit.IsFemale,'její','jeho')] poskok [recruit_liege.GetTitledFirstName], který slouží [recruit_liege.GetPrimaryTitle.GetDefinitiveName|l]...„" # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1010.desc.recruit: "[recruit.GetFirstName] se jmenuje a je to [Select_CString(recruit.IsFemale,'její','jeho')] místní agent a zprostředkovatel na trhu...„" # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1010.a: "„Nech mě s [recruit.GetHerHim] promluvit...“" # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1010.a.flavor: "@skill_diplomacy_icon! Spolehneš se na své kouzlo osobnosti" # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1010.b: "„Přiveďte [recruit.GetWomanMan] dovnitř, ať to stojí cokoli.“" # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1010.b.flavor: "@gold_icon! Spolehneš se na peníze" # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1010.e: "„Pche, [recruit.GetSheHe] za ty potíže nestojí.“" # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1020.t: "$gdp_merchant_scheme_advantage.1000.t$" # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1020.desc: "[trader.GetFirstName] a já každý den sedíme a probíráme nejlepší způsoby, jak se přiblížit našemu cíli. Můj obchodník nakonec otevře téma naší [charter.GetName] a toho, jak by nám mohla otevřít dveře, které jsou nám v [task_contract_location.GetBaronyNameExplicitly] zatím zavřené.\n\n„Koneckonců,“ usměje se [trader.GetFirstNameNoTooltip], „proč nevyužít listinu [patron.Custom('CZ_TitledFirstName_G')]?“" # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1020.a: "„Ano, jsem si jistý, že se můžeme opřít o podporu [patron.Custom('CZ_TitledFirstName_G')]!“" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [patron.GetTitleAsName]; navyše [patron.GetTitledFirstName]
 gdp_merchant_scheme_advantage.1020.b: "„Naše listina mluví sama za sebe.“" # todo: NEW TRANSLATION
 gdp_merchant_scheme_advantage.1020.e: "„Teď není vhodná chvíle...“" # todo: NEW TRANSLATION
