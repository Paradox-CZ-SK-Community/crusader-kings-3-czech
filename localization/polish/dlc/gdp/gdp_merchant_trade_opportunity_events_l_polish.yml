l_polish:
 gdp_merchant_trade_opportunity.0001.t: "Vyzvat konkurenta: [task_contract_target.GetHouse.GetBaseNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0001.desc: "Přítomnost [task_contract_target.GetPrimaryTitle.GetNamePossessive] nám neustále hází klacky pod nohy, poškozuje naše vyhlídky i zisky, a nikde víc než v [local_market.GetShortName].\n\nS těmito potížisty je třeba si poradit a tak či onak jim ukázat, že jsme právoplatnými pány místních trhů." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0001.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0001.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0001.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0002.t: "$scheme_critical_moments.8002.t$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0002.desc: "Po mnoha dnech a nocích strávených přemlouváním místních kramářů a zjišťováním všeho, co se dá vědět o trzích v [trade_market.GetShortName], jsme odhalili slabiny [target_title.GetNamePossessive].\n\nKdyž víme, jak podkopat jejich místní vztahy a jak je v klíčových oblastech podbízet a přeplácet, můžeme brzy srazit jejich zisky i pověst!" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0002.a: "Ukážeme jim, že se nám nemají plést do řemesla." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0002.b: "Když odhalíme své karty, získáme si jejich úctu." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0002.b.tt: "Musíš být [Concept('friend','přítel')|E], [Concept('spouse','choť')|E] nebo mít alespoň [SCOPE.ScriptValue('high_skill_rating')|V0] [Concept('diplomacy','diplomacie')|E] a zároveň nesmíš mít záporné [Concept('relation','zvláštní vztah')|E] ani být ve [house_feuding|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_trade_opportunity.0003.t: "$scheme_critical_moments.8003.t$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0003.desc: "Naše snaha zmapovat sítě [target_title.GetNamePossessive] v [trade_market.GetShortName] i daleko za jeho hranicemi přinesla jen malé ovoce. Zdá se, že jsme si dokonce poškodili vlastní pověst v [task_contract.GetLocation.Custom('GetRegionalMarketTermGloss')].\n\nNaše neobratné počínání jen posílilo pozici [target_title.GetHolder.GetHouse.GetBaseNameNoTooltip] a v dlouhých řetězcích jejich obchodních tras jsme nenašli ani jedinou slabinu..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0003.a: "Při [ROOT.Char.GetFaith.WealthGodName]! To nám ukrojí ze zisků!" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0011.t: "Propagovat zboží: [task_contract_title.GetNameNoTierNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0011.desc: "Na rušných [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l] v [task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip] svádějí kramáři a obchodníci nelítostný boj o zboží všeho druhu.\n\nUprostřed hluku, obtékáni neustálým proudem kolemjdoucích, jasně vidíme otázku, jak naše zboží odlišit od ostatního a upoutat pozornost zákazníků i obchodníků..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0011.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0011.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0011.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0012.t: "$scheme_critical_moments.8002.t$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0012.desc: "Zdá se, že se nám podařilo podpořit prodej [trade_good_type.GetNameNoTooltip|l] v [target_title.GetBaseNameNoTierNoTooltip]. Mnozí vyhledávají naše „vynikající“ výrobky a prodeje v celé oblasti stabilně rostou.\n\nZdá se, že naše naléhání a vychvalování zapůsobilo přesně na ty správné měšce!" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0012.a: "Tuhle příležitost nepromarníme." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0012.b: "Už cítím vůni [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationPlural')]!" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0013.t: "$scheme_critical_moments.8003.t$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0013.desc: "Začíná být jasné, že naše snaha přilákat zákazníky pomocí poněkud přikrášlených popisů kvality našeho zboží nepřinesla žádoucí výsledek...\n\nProdeje spíše klesají a poptávka po [trade_good_type.GetNameNoTooltip|l] v [target_title.GetBaseNameNoTierNoTooltip] zřejmě vysychá, jak kupující ztrácejí důvěru." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0013.a: "Vždyť tohle #EMP je#! to nejkvalitnější [trade_good_type.GetNameNoTooltip|l]!" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0021.t: "Podpořit investice: [local_market.GetShortNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0021.desc: "Při procházce po [task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip] se ukazují četné nedostatky zdejší infrastruktury: od kvality cest přes žalostné skladovací prostory až po samotné [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGloss')|l].\n\nMístní vládci musí pochopit, že výhody malé investice jasně převažují nad náklady. A pokud se nám to nepodaří, budeme muset našich zdejších kontaktů využít a zařídit vše sami..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0021.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0021.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0021.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0022.t: "$scheme_critical_moments.8002.t$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0022.desc: "Naše obratné vysvětlení nedostatků [target_title.GetAdjectiveNoTooltip] infrastruktury i výhod jejího zlepšení upoutalo pozornost těch správných lidí.\n\nZasazená semínka začínají nést ovoce: zdá se, že jsme přesvědčili [local_ruler.GetTitledFirstName] a práce mají začít. Obchodní ruch má zesílit a místní obchodníci i měšťané nám už nesměle gratulují." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0022.a: "Když chceš něco udělat pořádně, udělej to sám." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0023.t: "$scheme_critical_moments.8003.t$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0023.desc: "Naše snaha přesvědčit zdejší obyvatele o nesčetných nedostatcích [target_title.GetAdjectiveNoTooltip] infrastruktury přinesla trapně málo výsledků a je nepravděpodobné, že tihle hlupáci někdy dostanou rozum.\n\nJedno selhání za druhým nás nechá tam, kde jsme začali. Odměnou za naši námahu nám budou jen zmatení místní úředníci a obchodníci, pokud nevezmeme věci do vlastních rukou..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0023.a: "Obchod musí proudit, tak či onak." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0023.b: "Místní jsou hlupáci..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0031.t: "$exploit_upheaval_contract$: [local_market.GetShortNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0031.desc: "Stopy neštěstí jsou na [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l] v [local_market.GetShortName] zjevné: zabedněné a opuštěné obchody svědčí o ochromeném obchodu po odchodu obchodníků v těchto těžkých časech.\n\nMusí však pochopit, že zoufalství a útěk obchodu nijak neprospívají a že mír není nikdy zaručen. Je na nás, abychom obnovili pořádek a zaplnili jejich prázdná místa." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0031.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0031.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0031.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0032.t: "$exploit_upheaval_contract$: Úspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0032.desc: "Obyvatelé [target_title.GetBaseNameNoTierNoTooltip] vykukovali zpoza zavřených dveří, ale rychle pochopili, oč nám jde, a my brzy pevně ovládli trh i sklady.\n\nTi, kteří na této změně tratili, museli neochotně uznat výhody obnoveného pořádku a pomalého oživení obchodu." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0032.a: "To je prostě dobrý obchod..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0032.b: "Naše práce je zde hotová." # todo: NEW TRANSLATION
 every_county_province_custom: "Každá [Concept('holding','država')|E] s modifikátorem $recently_looted_modifier$ v [saved_county.Custom('CZ_LandedName_G')]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_trade_opportunity.0033.t: "$exploit_upheaval_contract$: Neúspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0033.desc: "Naše agresivní přítomnost v [target_title.GetBaseNameNoTierNoTooltip] a snaha přimět jeho obyvatele, aby jednali podle našich představ, se setkala s všeobecným nepřátelstvím a tvrdošíjným odmítáním spolupráce.\n\nObyvatelé i místní obchodníci se proti nám spojili. Obnovení pořádku a obchodu je podle nich příliš vysokou cenou za naše panování!" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0033.a: "Tvrdošíjní hlupáci!" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0041.t: "$support_guilds_contract$: [task_contract_title.GetNameNoTierNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0041.desc: "Na [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l] v [local_market.GetShortName] působí řada řemeslných skupin, jejichž přísně střežené počty členů vyrábějí vše od provazů po stříbrné příbory pro místní i kupce.\n\nDíky správným kontaktům bychom mohli proniknout do sítí těchto zručných řemeslníků, vybudovat si zde pověst mecenášů a snad se dozvědět o výnosných metodách či trendech." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0041.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0041.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0041.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0042.t: "$support_guilds_contract$: Úspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0042.desc: "Naše peníze nám v [target_title.GetBaseNameNoTierNoTooltip] pomohly navázat plodné vztahy. Financujeme talentované řemeslníky nejrůznějšího zaměření, kteří potichu pracují na předmětech skromných i podivuhodných.\n\nJako mecenáše nás všude vítají s otevřenou náručí a zájem o nás projevil i známý místní řemeslník [inspired_artisan.GetFirstName], který hledá prostředky na výrobu [inspired_artisan.Custom('InspirationArtisanType')]." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0042.a: "Naše investice splnily svůj účel." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0042.b: "Tuhle příležitost si nesmíme nechat ujít!" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0043.t: "$support_guilds_contract$: Neúspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0043.desc: "Naše snaha proniknout do sítí místních řemeslníků z [target_title.GetBaseNameNoTierNoTooltip] narážela na odmítnutí na každém kroku. Naše peníze i zájmy sice neochotně přijali, ale s pramalým vděkem.\n\nPoškodilo naši pověst nějaké nedorozumění, intriky našich soupeřů, nebo jsme si prostě dovolili strkat nos, kam nemáme? To se možná nikdy nedozvíme..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0043.a: "Pche, jejich zboží stejně stálo za starou bačkoru..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0051.t: "$seek_debtors_contract$: [task_contract_title.GetNameNoTierNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0051.desc: "Na [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l] v [task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip] pulzuje touha po zisku, patrná v každém pohledu i gestu. Místo volá po našich penězích a láká budoucí klienty, kteří nedokážou odolat jeho příslibu.\n\nPříjemců [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] se hledá mnohem snáz než dárců, ale musíme si vybírat. Nahazujeme udice s myšlenkou na významné a vážené obyvatele [local_market.GetShortName] a víme, že důstojný úlovek vyžaduje lstivost a trpělivost." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0051.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0051.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0051.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0052.t: "$seek_debtors_contract$: Úspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0052.desc: "Rozhlásili jsme po [target_title.GetBaseNameNoTierNoTooltip], že nabízíme financování, a zanedlouho jsme obdrželi podivně pokorné pozvání. A to přímo od [debtor.GetTitledFirstName]!\n\nZdá se, že vážený [debtor.Custom('LadyLordWomanMan')] potřebuje ve [Select_CString(debtor.IsFemale,'jejích','jeho')] účtech trochu „pružnosti“. Nepřísluší nám, obyčejným obchodníkům, vyptávat se na způsoby někoho tak ctihodného..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0052.a: "„Pojďme ty účetní knihy trochu upravit... #EMP [debtor.GetFirstNameNoTooltip]. [debtor.GetTitleAsNameNoTooltip] z [debtor.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]...#!“" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0052.b: "„Obávám se, že to nyní nebude možné, můj [debtor.GetLadyLord].“" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0053.t: "$seek_debtors_contract$: Neúspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0053.desc: "Po rozšíření zprávy o našem financování nemáme co ukázat. Místní vážení občané z [target_title.GetBaseNameNoTierNoTooltip] naše štědré nabídky jednomyslně odmítli.\n\nTěžko říct, zda jsme špatně vedli jednání, zda do toho zasáhli jiní obchodníci, nebo zda si mocní tohoto kraje zrovna užívají vzácné období všeobecné prosperity." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0053.a: "Nevadí, přilezou zpátky. Vždycky to tak dopadne..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0061.t: "$sabotage_competition_contract$: [task_contract_target.GetHouse.GetBaseNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0061.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))] [contract_employer.GetFirstName] přichází se zajímavými zprávami. [market_owner.GetName] potřebuje [trade_good_type.GetNameNoTooltip|l] a hledá obchodníka, který dodá [market_owner.GetHerHim] velkou zásilku.\n\nChvástavý [task_contract_target.GetTitledFirstName] ze společnosti [task_contract_target.GetHouse.GetBaseName] hrdě prohlašuje, že [task_contract_target.GetSheHe] zakázku nepochybně získá. Věřím, že bychom ho lstí a důvtipem mohli přeplatit a ukázat mu, kam patří." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0061.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0061.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0061.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0062.t: "$sabotage_competition_contract$: Úspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0062.desc: "Naše nenápadné pokusy zasáhnout do obchodu [target_title.GetNamePossessive] nám přinesly výhodu. Když nadešel den dražebního souboje, [target_title.GetHolder.GetTitledFirstName] mohl jen v šoku a hrůze přihlížet, jak jsme ho připravili o vítězství.\n\nPověst [target_title.GetNameNoTooltip] utrpěla vážnou újmu a bylo by moudré využít toto mocenské vakuum ve svůj prospěch." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0062.a: "Všechno jde podle plánu..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0063.t: "$sabotage_competition_contract$: Neúspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0063.desc: "Navzdory našim úskokům nás [target_title.GetHolder.GetTitledFirstName] znovu předčil. Museli jsme se zahanbeně smířit s drtivou porážkou od [target_title.GetNameNoTier].\n\nPříčinu našeho přešlapu se možná nikdy nedozvíme: Zmohla se na nás pýcha, nebo nám chyběla finanční obratnost? Zatím víme jen, že jsme odešli poraženi, s hlavou svěšenou a prázdnými kapsami." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0063.a: "Příště je dostaneme..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0071.t: "$build_category_connections_contract$: [trade_good_category.GetNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0071.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))] [contract_employer.GetFirstName] prohlíží zásilku [trade_good_type.Custom('GetTradeGood')] a důkladně zkoumá [trade_good_type.Custom('GetTradeGoodUnitPlural')], zda se při neopatrném zacházení nepoškodily, a kontroluje každé zapínání.\n\nZboží se ne vždy využívá naplno a může přijít nazmar kvůli zanedbání či neznalosti. Od nejubožejšího kramáře po nejvýznamnějšího velkoobchodníka se toho lze mnoho naučit." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0071.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0071.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0071.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0072.t: "$build_category_connections_contract$: Úspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0072.desc: "Procházeli jsme mezi [destination.Custom('GetProvinceAdjective')] stánky na rušném [destination.GetTitle.GetNameNoTierPossessiveNoTooltip] [destination.Custom('GetRegionalMarketTermGloss')] i tichými obchodními síněmi a nasbírali spoustu drobných postřehů, příběhů a rad o obchodování s [trade_good_type.Custom('GetTradeGood')].\n\nOd skladování a přepravy [trade_good_type.Custom('GetTradeGoodUnitPlural')] po sezónní poptávku a hodnocení kvality — naše nové poznatky jistě prospějí našemu obchodu v [local_market.GetName|l] i jinde." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0072.a: "Kdo by tušil, že obchodování s [trade_good_type.Custom('GetTradeGood')] je tak složité?" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0073.t: "$build_category_connections_contract$: Neúspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0073.desc: "Strávili jsme bezpočet dní a nekonečné hodiny putováním mezi [destination.Custom('GetProvinceAdjective')] stánky na rušném [destination.GetTitle.GetNameNoTierPossessiveNoTooltip] [destination.Custom('GetRegionalMarketTermGloss')] i jeho tichými obchodními síněmi, ale zdá se, že o obchodování s [trade_good_type.Custom('GetTradeGood')] nevíme o nic víc.\n\nMlčenliví kramáři a odmítaví zprostředkovatelé na naše otázky málokdy odpovídali jinak než pobaveným pohrdáním či ostražitým mlčením. A to málo, co nám prozradili, bylo bezvýznamné nebo zbytečně zamotané. " # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0073.a: "Pche, jejich pomoc nepotřebujeme!" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0081.t: "$disrupt_charter_contract$: [contract_target.GetPrimaryTitle.GetNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0081.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))] [contract_employer.GetFirstName] obrací [Select_CString(contract_employer.IsFemale,'její','jeho')] oči v sloup, když si stěžujeme na nejnovější kousky [contract_target.GetPrimaryTitle.GetDefinitiveNamePossessive|l] v [market.GetName|l].\n\nS tím [contract_target.GetTitledFirstName] a [Select_CString(contract_target.IsFemale,'její','jeho')] podporou ze strany [contract_target.GetSuzerain.GetTitledFirstName] je třeba něco udělat, jinak zůstaneme pozadu..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0081.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0081.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0081.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0082.t: "$disrupt_charter_contract$: Úspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0082.desc: "Naše neúnavné úsilí při přemlouvání prostředníků a očerňování [target_title.GetDefinitiveName|l] a jejich proklaté listiny zřejmě přineslo ovoce a mnozí si teď dvakrát rozmyslí, než uvěří slovu [target_title.GetHolder.Custom('CZ_TitledFirstName_G')].\n\nZpochybňována byla dokonce i pravost pečeti [target_title.GetHolder.GetSuzerain.Custom('CZ_TitledFirstName_G')] na listinách [target_title.GetHolder.Custom('CZ_TitledFirstName_G')], což jistě nepotěší ani jednu ze stran." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0082.a: "Ať si své listiny strčí za [ROOT.Char.GetRite.NegativeAfterLife]!" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0083.t: "$disrupt_charter_contract$: Neúspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0083.desc: "Naše neúnavné navazování kontaktů a intrikování proti prokletým spolčencům [target_title.GetDefinitiveName|l] bylo k ničemu. Jen málokdo je ochoten zvážit naše nabídky, když mají před sebou listinu s vlastní pečetí [target_title.GetHolder.GetSuzerain.Custom('CZ_TitledFirstName_G')].\n\nPověst [target_title.GetHolder.Custom('CZ_TitledFirstName_G')] zůstává jako vždy neposkvrněná a my jsme jen pošpinili své jméno tím, že jsme klesli tak hluboko..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0083.a: "[target_title.GetHolder.GetRite.FateGodName] se na [target_title.GetHolder.GetHouse.GetBaseNameNoTooltip] stále usmívá..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0091.t: "$alleviate_upheaval_contract$: [local_market.GetNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0091.desc: "Když se [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.GetFirstName], a já touláme podmračeným [destination.Custom('GetRegionalMarketTermGloss')], je žalostný stav [destination.GetBaronyNameExplicitlyNoTooltip], způsobený rozmary války a hladomoru, zjevný na každém kroku.\n\nUličky jsou přeplněné znepokojivým množstvím žebráků, ať už jde o vdovy, sirotky či mrzáky, a nad opuštěnými stánky se jako druhá vrstva mraků vznáší zlověstná předtucha." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0091.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0091.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0091.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0092.t: "$alleviate_upheaval_contract$: Úspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0092.desc: "Při putování krajem jsme dokázali najít místní kramáře a řemeslníky, kteří stále podnikají navzdory" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0092.war: "válečným útrapám," # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0092.disaster: "hrozící pohromě," # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0092.epidemic: "nedávným epidemiím," # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0092.closing: "a dokonce jsme jim pomohli znovu rozhýbat účetní knihy. I malé úsilí se počítá.\n\nKaždým dnem se zdá, že [destination.Custom('GetRegionalMarketTermGloss')] v [destination.GetBaronyNameExplicitlyNoTooltip] zní o něco více hlasy, stánky se lesknou o něco větším množstvím zboží a hostince se plní dalšími návštěvníky.\n\nKaždým dnem se zdá, že tržiště v [destination.GetBaronyNameExplicitlyNoTooltip] zní o něco více hlasy, stánky se lesknou o něco větším množstvím zboží a hostince se plní dalšími návštěvníky." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0092.a: "[destination.GetBaronyNameExplicitlyNoTooltip] brzy znovu vzkvétá." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0093.t: "$alleviate_upheaval_contract$: Neúspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0093.desc: "Proputovali jsme [destination.GetBaronyNameExplicitlyNoTooltip] křížem krážem a hledali příležitosti, jak vložit peníze do rukou těch, kteří je dokážou nejlépe využít, a obnovit obchodní tep kraje, ale většinou marně.\n\nVětšina těch, které najdeme, jsou obyčejní kšeftaři nehodní naší štědrosti, nebo nemohou ničemu prospět. Tváří v tvář nezdarům se jen těžko udržuje optimismus a propadáme zoufalství a frustraci." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0093.a: "Už nemůžeme nic dalšího udělat..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0101.t: "$silk_road_network_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0101.desc: "S úžasem sledujeme se svým [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.GetFirstName], rušné stánky na velkém [destination.Custom('GetRegionalMarketTermGloss')] [destination.GetTitle.GetNameNoTierPossessive]. Zde není tok obchodu žádnou abstrakcí – je stejně hmatatelný jako [ROOT.Char.Custom('GroundType')] pod nohama.\n\nNa takovém místě, hemžícím se obchodníky, kteří se stejně jako my snaží uzavírat obchody, jak bychom tu mohli nenajít výhodu či přízeň?" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0101.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0101.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0101.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0102.t: "$disrupt_charter_contract$: Úspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0102.desc: "Poslední týdny jsme strávili v neustálém pohybu, každý den jsme spěchali po [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], abychom se s někým setkali a našli nové kontakty. Díky obratné diplomacii a ještě obratnějšímu obchodování jsme však uzavřeli řadu výhodných dohod s místními makléři a prostředníky.\n\nJe jasné, že naše úsilí nepřišlo nazmar a že jsme si zde připravili dobrou půdu pro nadcházející sezónu." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0102.a: "Kéž naše semínka přinesou ovoce!" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0103.t: "$silk_road_network_contract$: Neúspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0103.desc: "Navzdory všem pokusům získat si přízeň místních makléřů a prostředníků, každodennímu putování napříč [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] za schůzkami a kontakty, jsme na tom stejně jako na začátku.\n\nTo nám pro nadcházející sezónu jistě přinese potíže..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0103.a: "Při [ROOT.Char.GetRite.WealthGodName]..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0111.t: "$silk_road_caravan_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0111.desc: "$gdp_merchant_trade_opportunity.0101.desc$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0111.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0111.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0111.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0112.t: "$silk_road_caravan_contract$: Úspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0112.desc: "Pilně jsme pracovali a rozhodili sítě po celém městě [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], hledali příležitosti k udělení laskavosti či úplatku. Na poslední chvíli se naše naděje konečně naplnily díky několika výhodným aukcím a dohodám a obchodní cesty jsou zajištěné.\n\nMůžeme v klidu odpočívat s vědomím, že naše práce zajistila stálý tok zboží, a to na nějakou dobu." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0112.a: "[ROOT.Char.GetRite.WealthGodName] se na nás usmívá!" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0113.t: "$silk_road_caravan_contract$: Neúspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0113.desc: "Všechno naše pilné úsilí a rozhozené sítě po celém městě [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] při hledání příležitostí k udělení laskavosti či úplatku přišlo vniveč a bylo pohlceno jako kapka deště rozbouřeným mořem obchodu.\n\nJe jasné, že nedokážeme zajistit potřebné místo pro karavanu, abychom splnili své požadované kvóty, a ještě nějakou dobu to nepůjde..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0113.a: "Co je obchodník bez karavany..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0121.t: "$entrepot_buy_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0121.desc: "Procházíme se se svým [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.GetFirstName], entrepôtem v [destination.GetBaronyNameExplicitly], centrem prodeje a dalšího prodeje, kde se setkávají nejrůznější obchodníci a posílají zboží do neznámých a vzdálených končin.\n\nNa takovém místě, kde z ruky do ruky přechází tolik zboží, rozhodují o obchodníkově štěstí velké obchody a nákupy za velkoobchodní ceny..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0121.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0121.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0121.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0122.t: "$entrepot_buy_contract$: Úspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0122.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nNějakým způsobem jsme z toho zmijího hnízda vyvázli bez úhony a s úctyhodnou sbírkou směnek, které nám pro nadcházející sezónu zajistí konkurenceschopné prodejní ceny za [trade_good_type.Custom('GetTradeGoodUnitPlural')] [trade_good_type.Custom('GetTradeGood')] v [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]!" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0122.intro: "Dny nám splývají v nekonečné smlouvání, dohadování a přemlouvání. Oči mi těkají mezi mávajícími jazyky a cenícími zuby, zatímco se na aukčních dvorech překřikují ceny a [ROOT.Char.Custom('GroundType')] pokrývají odhozené žetony, čmáranice a ztracená jmění." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0122.a: "Je to trh kupujících!" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0123.t: "$entrepot_buy_contract$: Neúspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0123.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nZe zmijího hnízda vycházíme potlučení a vyčerpaní, bez zaručených prodejních cen [trade_good_type.Custom('GetTradeGood')], které jsme si chtěli zajistit, a naši soupeři nás přeplatili..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0123.a: "Je to trh prodávajících..." # todo: NEW TRANSLATION
