 gdp_merchant_trade_opportunity.0133.t: "$entrepot_sell_contract$: Neúspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0133.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nZe zmijího hnízda vycházíme potlučení a vyčerpaní, bez zaručených nákupních cen [trade_good_type.Custom('GetTradeGood')], které jsme si chtěli zajistit, a naši soupeři nás přeplatili..." # todo: NEW TRANSLATION
