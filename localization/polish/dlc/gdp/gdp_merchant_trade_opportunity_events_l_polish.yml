 gdp_merchant_trade_opportunity.0132.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nNějakým způsobem jsme z toho zmijího hnízda vyvázli bez úhony a s úctyhodnou sbírkou směnek, které nám pro nadcházející sezónu zajistí konkurenceschopné nákupní ceny za [trade_good_type.Custom('GetTradeGoodUnitPlural')] [trade_good_type.Custom('GetTradeGood')] v [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]!" # todo: NEW TRANSLATION
