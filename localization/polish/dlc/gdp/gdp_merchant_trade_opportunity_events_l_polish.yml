 gdp_merchant_trade_opportunity.0141.t: "$negotiate_tolls_contract$: [task_contract_target.GetTitledFirstNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0141.desc: "Je snad jen spravedlivé, že [task_contract_target.GetTitledFirstName] dostává část tržeb v [local_market.GetName|l], neboť udržuje pořádek a dbá na dodržování zákona.\n\nVždy je však #EMP prostor#! k vyjednávání. Stačí, když [task_contract_target.GetHerHim] ukážeme, jakou hodnotu mají naše cesty, a vysvětlíme, jaké břemeno [task_contract_target.GetSheHe] nakládá na naše ubohá záda..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0141.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0141.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0141.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0142.t: "$negotiate_tolls_contract$: Úspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0142.desc: "Dlouhé dny jsme v síních [task_contract_target.GetTitledFirstName] přemlouvali, lichotili a naléhali. Tváře nás stále bolí od úsměvů, naše úsilí však nebylo marné.\n\nPodařilo se nám vyjednat nižší mýtné, což nám na nějakou dobu zajistí vyšší zisky." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0142.a: "To je cena za dobrý obchod." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0143.t: "$negotiate_tolls_contract$: Neúspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0143.desc: "Po tolika dlouhých dnech, kdy jsme v síních [target.GetTitledFirstName] přemlouvali, lichotili a naléhali, s tvářemi bolavými od úsměvů a nohama slabými od stání, se musíme vrátit s prázdnou...\n\nDnes, když jsme čekali na audienci, nám stráže [target.GetTitleAsNamePossessiveNoTooltip] s patřičnou úslužností vysvětlily, že nám [target.GetSheHe] bohužel nemůže pomoci a musí se věnovat naléhavým záležitostem..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0143.a: "Ale [target.GetSheHe] vypadal tak přístupně..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0151.t: "$smuggle_goods_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0151.desc: "Faktorové a výběrčí v [local_market.GetName|l] se tu promenádují. Tihle šakali se šklebí a po bocích jim cinkají pytlíky s [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')], naplněné poctivě vydělaným zlatem vyždímaným z kapes řádných obchodníků, jako jsme s [associate.GetFirstName] my...\n\nMýto [owner.Custom('CZ_TitledFirstName_G')] je tu zkázou obchodu a [Select_CString(owner.IsFemale,'její','jeho')] chamtivost nás přinutila pustit se do nekalých kšeftů." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0151.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0151.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0151.c: "$merchant_base_trade_opportunity_schemes.0000.generic_option.secrecy$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0151.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0152.t: "$smuggle_goods_contract$: Úspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0152.desc: "Po usilovné práci jsme navázali dobré kontakty mezi místními darebáky a zajistili si spolehlivé #EMP alternativní#! cesty pro zboží z [trade_market.GetName|l].\n\nBednu po bedně, s každou zásilkou, která proklouzne důvěřivým strážím pod nosem, budou naše úspory brzy narůstat..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0152.a: "Jsou to #EMP naše#! peníze a necháme si je." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0153.t: "$smuggle_goods_contract$: Neúspěch" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0153.desc: "Naše snaha založit pašeráckou síť v [trade_market.GetName|l] ztroskotala na každém kroku: kvůli neschopnosti našich spolčenců, ostražitosti místních úřadů i nepoctivosti zdejších darebáků...\n\nNezbývá nám než dál platit mýto. Přes všechnu naši tvrdou práci jsme si jen pošpinili pověst poctivých obchodníků." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.0153.a: "Měli jsme prostě platit mýto..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1001.t: "Promazávání soukolí" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1001.desc: "Naši [task_contract_location.GetTitle.GetDeJureLiege.GetAdjectiveNoTooltip] známí projevují při obchodování neobvyklou zdrženlivost a je jasné, že za tím stojí místní vládce, [local_ruler.GetTitledFirstName].\n\nZanedlouho se od samotného velkého [local_ruler.GetWomanMan] [local_ruler.GetHerselfHimself] dozvíme, že žádá o „#EMP ochutnávku příležitostí#!“ ve [Select_CString(local_ruler.IsFemale,'jejích','jeho')] zemích..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1001.a: "#weak *povzdech*#! Dejte tomu [local_ruler.GetWomanMan] jeho [local_ruler.GetHerHis] [local_ruler.CustomFixedRandom('GetCurrencyDenominationPlural')]..." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1001.b: "Jistě #EMP vážený#! člověk pochopí naši situaci." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1001.b.good: "[local_ruler.GetTitledFirstNameNoTooltip] je okouzlen" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1001.b.bad: "[local_ruler.GetTitledFirstNameNoTooltip] je podrážděn" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1001.c: "Víte, [other_merchant.GetPrimaryTitle.GetNameNoTooltip|l] si #EMP opravdu#! dovoluje." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1001.c.good: "[local_ruler.GetTitledFirstNameNoTooltip] se nechal nachytat" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1001.c.bad: "[local_ruler.GetTitledFirstNameNoTooltip] se urazil" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1001.d: "Pche, nějak si poradíme." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1011.t: "Vzájemná štědrost" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1011.desc: "Zdá se, že naše obchody v [local_market.GetShortName] upoutaly pozornost místního vládce, [local_ruler.GetTitledFirstName], který pozval naši společnost na soukromou audienci.\n\nKdyž stojím před [local_ruler.GetHerHim], [local_ruler.GetTitleAsNameNoTooltip] se usměje. „Obchod přináší velké výhody: lidem, šlechticům, celému [local_ruler.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]! Svěřte se mi se svými potížemi a já udělám, co budu moci.“" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1011.a: "#weak *ehm*#! „Cesty jsou #EMP opravdu#! náročné, vaše Výsosti…“" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1011.b: "„Mám pár nápadů ohledně místního [task_contract_location.Custom('GetRegionalMarketTerm')|l].“" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1011.b.good: "Vaše rada je rozumná" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1011.b.bad: "Vaše rada je nesmysl" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1011.c: "„[other_merchant.GetPrimaryTitle.GetNameNoTooltip] nám značně ztěžuje situaci.“" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1011.c.fallback: "„Konkurence nám značně ztěžuje situaci.“" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1011.c.good: "[local_ruler.GetTitledFirstNameNoTooltip] se vás zastane" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1011.c.bad: "[local_ruler.GetTitledFirstNameNoTooltip] se zastane rodu [other_merchant.GetHouse.GetNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1011.c.flavor: "Soutěž v oblíbenosti založená na [diplomacy_i|E][Concept('diplomacy','diplomacii')|E] a [opinion_i|E][Concept('opinion','mínění')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_trade_opportunity.1011.d: "„Bůh žehnej vám i vaší dobrotivé vládě, velký [local_ruler.GetTitleAsNameNoTooltip].“" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1021.t: "Společný soupeř" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1021.desc: "Zcela pohlcen tím, co provádějí ti darebáci v [target.GetPrimaryTitle.GetName], nechám se zaskočit příchodem [other_merchant.GetTitledFirstName] z [other_merchant.GetPrimaryTitle.GetName], dalšího konkurenta na [task_contract_location.Custom('GetRegionalMarketTermGlossPlural')|l] v [local_market.GetShortName].\n\n„Rád vás poznávám, [ROOT.Char.Custom('CZ_TitledFirstName_V')],“ osloví mě [other_merchant.GetSheHe]. „Doslechl jsem se o vašich potížích s tím podomním obchodníkem z rodu [target.GetHouse.GetNameNoTooltip], [target.GetTitledFirstName]. Co kdybychom si navzájem pomohli?“" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1021.a: "„Výborně! Tady je plán…“" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1021.b: "„Jak mám vědět, že se ti dá věřit?“" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1021.b.good: "Dohodnete se" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1021.b.bad: "Pustíte se do sebe" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1021.c: "„Společně jim to můžeme pořádně zavařit.“" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1021.d: "„Nikdy! Vy z rodu [other_merchant.GetHouse.GetNameNoTooltip] jste ještě horší!“" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1031.t: "Obchodní tajemství" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1031.desc: "Při procházení firemních záznamů v [task_contract_location.GetBaronyNameExplicitlyNoTooltip] se z nich uvolní několik listů papíru a snesou se k zemi. Seberu je a otočím se k [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.GetFirstName], který se na mě nejistě mračí.\n\nKdyž si dokumenty pročítám, nemohu pozvednout obočí. Důvod [Select_CString(associate.IsFemale,'jejího','jeho')] rozrušení je zřejmý. [associate.GetFirstNameNoTooltip] přede mnou tajil informace, které jsou pro naše zdejší podnikání zásadní! A to všechno ze zášti?" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1031.a: "„Zatraceně, [associate.GetFirstNameNoTooltip]! Komu jsi vlastně věrný?“" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1031.b: "„Tak pověz, co tě trápí?“" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1031.c: "„#EMP VEN!#! Už pro naši společnost nejsi přínosem!“" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1041.t: "Rodinné úsilí" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1041.desc: "Všichni jsou v dobré náladě a řeč ve společnosti se neustále stáčí k nedávným úspěchům v [task_contract_location.GetBaronyNameExplicitlyNoTooltip], které shodou okolností vedl můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.GetFirstName].\n\n[Select_CString(associate.IsFemale,'Její','Jeho')] chválu pějí jako na skutečného obchodního génia, ale pravdou samozřejmě je, že každý podnik se opíral o tvrdou práci mnoha lidí a jejich výřečnost napříč sítí rodu [ROOT.Char.GetHouse.GetNameNoTooltip]." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1041.a: "Skvělá práce, [associate.GetFirstNameNoTooltip]!" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1041.b: "Zjevně jsme tě ještě dostatečně nezaměstnali." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1041.c: "Tvé úsilí je neuvěřitelné, jsi nám všem příkladem!" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1051.t: "Hledání dohody" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1051.desc: "Když procházím [task_contract_location.Custom('GetRegionalMarketTermGloss')], náhle se přede mnou objeví náš konkurent [target.GetTitledFirstName] z [target.GetPrimaryTitle.GetName], a to [target.GetHerselfHimself]! Musím ale říct, že [Select_CString(target.IsFemale,'její','jeho')] pokora mě trochu zaskočí.\n\n„Podívejte, [ROOT.Char.GetTitledFirstNameNoTooltip],“ povzdechne si [target.GetSheHe], „budu upřímný: naše zájmy se tu rozcházejí a vzájemné soupeření nám nic dobrého nepřinese. Žádám vás, abyste toho nechali, a " # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1051.desc.gold: "zaplatím vám za vaše potíže.„" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1051.desc.luxury: "na oplátku vám prozradím, kde v daleké zemi získat úžasné zboží.„" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1051.a: "„Mluvíte pravdu. Dobrá, přijímám.“" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1051.b: "„Něco by se tu našlo… pojďme se domluvit.“" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1051.b.good: "[target.GetTitledFirstNameNoTooltip] souhlasí" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1051.b.bad: "[target.GetTitledFirstNameNoTooltip] odmítá" # todo: NEW TRANSLATION
 trade_opportunity_accept_feast_tt: "[target.GetShortUIName] uspořádá na vaši počest [GetActivityType('activity_feast').GetName] [Concept('activity','aktivitu')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_trade_opportunity.1052.t: "Hostina zrušena" # todo: NEW TRANSLATION
 trade_opportunity_gain_luxury_contract_tt: "Získáte [Concept('luxury_contract','smlouva na luxusní zboží')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_trade_opportunity.1051.d: "„Ha, obchodům se vám musí #EMP opravdu#! nedařit! Ani náhodou.“" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1061.t: "Přes síly" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1061.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.GetTitledFirstName], si stěžuje, že soustředěním úsilí na dokončení našeho podnikání v [task_contract_location.GetBaronyNameExplicitlyNoTooltip] přestáváme zvládat každodenní tok [task_contract_location.Custom('GetRegionalMarketTermGlossPlural')|l].\n\n„Něco musí ustoupit, [ROOT.Char.GetTitleAsNameNoTooltip]. Den nemá dost hodin a ve společnosti nemáme dost lidí, abychom to tu zvládli, pokud budeme pokračovat jako dosud.“" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1061.a: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] se žádné výzvy nezalekne!" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1061.a.good: "Všechno jde podle plánu" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1061.a.bad: "Přepínáte své síly" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1061.b: "Zisky za mé vlády neklesnou." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1061.already_tt: "Již získáno: [associate.GetShortUIName] #N [EmptyScope.ScriptValue('minor_stress_gain')|V0]#! [Concept('stress','stres')|E], [Concept('scheme','intrika')|E] #P +1#! [Concept('scheme_opportunity_i','@scheme_opportunity_icon!')|E][Concept('scheme_opportunity_opportunity','výhody')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_trade_opportunity.1071.t: "Úzké hrdlo" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1071.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.GetTitledFirstName], už celou věčnost přechází sem a tam a [Select_CString(associate.IsFemale,'její','jeho')] náladu ještě zhoršuje líně bzučící moucha. „Ach!“ zasténá [associate.GetSheHe]. „Podívejte se, [ROOT.Char.GetTitleAsNameNoTooltip], vaše práce tady v [task_contract_location.GetBaronyNameExplicitlyNoTooltip] vyčerpává mé zdroje!“\n\nKdyž se pozorně podívám na účtenky a účetní knihy, těžko s [associate.GetHerHim] nesouhlasit. [associate.GetSheHe|U] povzdechne: „Budeme muset najít kompromis, jinak se naše kancelář tady pod tím tlakem začne hroutit…“" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1071.a: "Jsme odhodláni dosáhnout jediného cíle." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1071.d: "Nech to na mně a soustřeď se na své vlastní úkoly." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1081.t: "Ve schopných rukou" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1081.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.GetTitledFirstName], se stará o většinu podrobností našeho současného podnikání v [task_contract_location.GetBaronyNameExplicitlyNoTooltip] a je to znát! [associate.GetFirstName] očividně oplývá smyslem pro detail i dalšími vlastnostmi zdatného obchodníka.\n\nOd začátku naší zdejší práce jsem sotva musel nahlédnout do účetní knihy nebo kontrolovat, zda byly splněny příkazy." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1081.a: "Jen tak dál, [associate.GetFirstNameNoTooltip]!" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1081.b: "Taková iniciativa si zaslouží odměnu." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1081.c: "Celá společnost by si z tohoto příkladu měla vzít ponaučení!" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1081.c.title: "[associate.GetFirstNameNoTooltip] jde příkladem" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1081.c.trigger: "Kterýkoli jiný [Concept('associate','společník')|E] má méně než [Concept('stewardship_i','@skill_stewardship_icon!')|E][EmptyScope.ScriptValue('medium_skill_rating')|V0]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_trade_opportunity.1081.c.tt: "[Concept('stewardship','Správcovství')|E] jiného [Concept('associate_possessive','společníka')|E] se zvýší o [stewardship_i|E]#P 1#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_trade_opportunity.1081.d: "Lidé z rodu [ROOT.Char.GetHouse.GetNameNoTooltip] jsou přirozeně nejlepší." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1091.t: "Neschopný společník" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1091.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.GetTitledFirstName], převzal vedení našeho současného podnikání v [task_contract_location.GetBaronyNameExplicitlyNoTooltip], ale teď si člověk přeje, aby to [associate.GetSheHe] nedělal…\n\nKaždý den se zdá, že objevím nějakou špatně sečtenou částku, nebo musím snášet stížnosti kontaktu, kterého zbytečně nechali čekat na zprávu. Tak nedbale se obchodovat nedá!" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1091.b: "[associate.GetFirstNameNoTooltip], pojďme projít účetní knihy." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1091.b.good: "[associate.GetFirstNameNoTooltip] se něčemu přiučí" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1091.b.bad: "[associate.GetFirstNameNoTooltip] je beznadějný případ" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1091.c: "Společnost bude muset napravit, co zanedbal." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1091.d: "[associate.GetSheHe|U] dělá [associate.GetHerHis] nejlepší, myslím." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1101.t: "Počáteční kapitál" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1101.desc: "Půjčování může být výnosným podnikem pro ty, kdo mají nazbyt [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] a dost trpělivosti, aby počkali na zisk. Jak se stává, dychtivý investor požádal o schůzku v [task_contract_location.GetBaronyNameExplicitlyNoTooltip].\n\nUvítá mě [investor.GetTitledFirstName]," # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1101.ruler: "místní vládce v [investor.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1101.courtier: "dvořan nějakého místního šlechtice." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1101.adventurer: "světem protřelý člověk v doprovodu družiny." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1101.fallback: "[investor.GetWomanMan] bezvýznamného původu." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1101.end: "„Rád vás poznávám, [ROOT.Char.Custom('CZ_TitledFirstName_V')]!“ [investor.GetSheHe|U] se dychtivě usměje. „Rád se stanu štědrým mecenášem [ROOT.Char.GetPrimaryTitle.GetNamePossessiveNoTooltip|l]. A co za to očekávám? Inu, tím se teď nemusíme zabývat.“" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1101.a: "Můžeš se na nás spolehnout, [investor.GetFirstNameNoTooltip]." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1101.c: "Trochu víc by se hodilo; ručím za to svou ctí." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1101.d: "To nás těší, ale teď se držíme při zemi." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity_1101_calling_tt: "[investor.GetShortUIName] si za #V 5#! let přijde vyzvednout [Concept('gold_i','@gold_icon!')|E][interest|0V] (#M 20% úrok#!)" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_trade_opportunity.1102.opening: "[investor.Custom2('AppropriateGreetingPositive', ROOT.Char)]" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1102.desc: "Konečně nadešel čas sklidit plody mé investice do vaší vážené obchodní společnosti.\n\nTrpělivě očekávám výplatu svých [investor.CustomFixedRandom('GetCurrencyDenominationGlossPlural')]." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1102.a: "Výborně, ať vám ty peníze dobře poslouží." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1102.b: "Ach… podívejme se. Bylo to období sucha, [investor.GetFirstNameNoTooltip]…" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1102.b.good: "[investor.GetFirstNameNoTooltip] přijímá vaše výmluvy" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1102.b.bad: "[investor.GetFirstNameNoTooltip] tuší nějakou zradu" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.1102.d: "U nás žádnou investici nemáte, tím to končí." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.9000.t: "Naléhavé záležitosti v [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.9000.desc: "Když je tato záležitost vyřešena, čekají nás zde v [ROOT.Char.GetCurrentLocation.GetTitle.GetTradeMarket.GetName|l] další obchodní povinnosti.\n\nMáme dát do pořádku své záležitosti v [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], než se vydáme na cestu zpět do [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]?" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.9000.a: "Tohle bychom měli prošetřit." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.9000.b: "Pojďme to vyřídit." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.9000.c: "O tuto záležitost se postarám." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.9000.d: "Ne, potřebují nás zpátky v [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]." # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.9000.accept_tt: "Přijmete a zahájíte [Concept('trade_opportunity_tier_tier','úroveň')|E] [THIS.TaskContract.GetTaskContractTierValue|V] [Concept('trade_opportunity','obchodní příležitost')|E] [THIS.TaskContract.GetEmployer.GetUINamePossessive] typu [THIS.TaskContract.GetType.GetName|V] v [THIS.TaskContract.GetLocation.GetBaronyNameExplicitly]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_trade_opportunity.9010.t: "Obchodní příležitost: [task_contract.GetType.GetName]" # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.9010.intro_elsewhere: "V [task_contract_location.GetBaronyNameExplicitly] nás čekají důležité firemní záležitosti," # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.9010.intro: "Tady v [task_contract_location.GetBaronyNameExplicitly] nás čekají důležité firemní záležitosti," # todo: NEW TRANSLATION
 gdp_merchant_trade_opportunity.9010.desc: "a než se vrátím, budu muset svěřit své úkoly do rukou svých společníků.\n\n" # todo: NEW TRANSLATION
