 option_boilerplate.tt.partner_aptitude: "#WEAK O tomto duelu rozhodne [Concept('deputy_possessive','zástupce')|E] [Concept('aptitude','způsobilosti')|E]#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 option_boilerplate.tt.partner_aptitude.success: "Tvůj zástupce uspěl" # todo: NEW TRANSLATION
 option_boilerplate.tt.partner_aptitude.failure: "Tvůj zástupce selhal" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1004.t: "$unity_irregularities_contract$: Nespokojenost v [destination.GetBaronyNameExplicitlyNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1004.desc: "Dopis od [local_ruler.GetTitledFirstNamePossessive] je krátký a výstižný: rozhořčení obyvatelé [destination.GetBaronyNameExplicitly] si stěžují na chování mého obchodníka [trader.GetTitledFirstName], a tím pádem i mé společnosti.\n\nMístní obchodníci, majitelé živností i obyvatelé si stěžují na nesrovnalosti v obchodních jednáních mé společnosti. [local_ruler.GetTitledFirstNameNoTooltip] chce celou záležitost rychle vyřešit a [Select_CString(local_ruler.IsFemale,'její','jeho')] prosebníky uklidnit.\n\nJe jasné, že si [trader.GetTitledFirstNameNoTooltip] dopřál až příliš mnoho svobody, daleko od dohledu, kterému by [trader.GetSheHe] tady v [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] čelil.\n\nZbývá už jen cesta do [destination.GetBaronyNameExplicitlyNoTooltip]." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1004.a: "Vydejme se na cestu." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1004.tt.destination_list: "Okamžitě zahájíš cestu do [destination.GetBaronyNameExplicitly]" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1004.tt.explanation: "#TUT K dokončení [Concept('task_contract','zakázce')|E]:\n$EFFECT_LIST_BULLET$Budeš mít #V 3#! příležitosti poskytnout ujištění:\n$TAB$$EFFECT_LIST_BULLET$#V 2#! ujištění zaručí $label_success_standard$\n$TAB$$EFFECT_LIST_BULLET$#V 3#! ujištění zaručí $label_success_critical$\n$TAB$$EFFECT_LIST_BULLET$#V 1#! ujištění může vést k $label_success_standard$, $label_success_qualified$ nebo $label_failure_standard$\n$EFFECT_LIST_BULLET$Výzvy mohou prověřit:\n$TAB$$EFFECT_LIST_BULLET$Tvé [Concept('stewardship','správcovství')|E]\n$TAB$$EFFECT_LIST_BULLET$[Concept('aptitude','Způsobilost')|E] [Concept('deputy_possessive','Zástupce')|E] [GetCourtPositionType('partner_court_position').GetName()]\n$TAB$$EFFECT_LIST_BULLET$Tvou [Concept('diplomacy','diplomacii')|E], [Concept('intrigue','pletichářství')|E] nebo [Concept('learning','učenost')|E]#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_unity_contract.1010.t: "$unity_irregularities_contract$: Náměstí" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1010.desc.intro: "„[ROOT.Char.GetTitledFirstNameNoTooltip], předpokládám?“ povzdechne si [local_ruler.GetTitledFirstName], když se já a můj doprovod setkáme s [Select_CString(local_ruler.IsFemale,'její','jeho')] družinou v [destination.GetBaronyNameExplicitly]. Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('trader'))] [trader.GetTitledFirstName] je s námi a za ním se drží stráže." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1010.desc.intro.has_partner: "Můj [GetCourtPositionType('partner_court_position').GetName()] [partner.GetFirstName] cupitá za mnou, bdělý a připravený pomoci." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1010.desc.midtro: "\n\n„Tenhle váš obchodník způsobil pořádný rozruch, jak dosvědčí naši svědkové,“ pokračuje [local_ruler.GetFirstNameNoTooltip]. „Věřím, že to rychle vyřešíte. Na tyhle záležitosti nemám čas!“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1010.desc.outro: "\n\nDostanu pokyn setkat se s [person_c.GetTitledFirstName] a [person_d.GetTitledFirstName] a vyslechnout jejich stížnosti. [trader.GetFirstNameNoTooltip] se na mě podívá a beze slov říká: „[ROOT.Char.GetTitleAsNameNoTooltip], no tak, jistě chápete…“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1010.a: "Dobrý [local_ruler.GetTitledFirstNameNoTooltip], mohl byste mě zasvětit?" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1010.a.tt: "Okamžitě požádáš [THIS.Char.GetTitledFirstNamePossessive] o vysvětlení" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1010.b: "Setkáme se s [person_c.GetTitledFirstNameNoTooltip]." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1010.c: "[person_d.GetTitledFirstNameNoTooltip] s námi chce mluvit." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1010.d: "Skončeme s tím hned." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.t: "$unity_irregularities_contract$: [char_current.GetTitledFirstNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.business.local_ruler: "Doprovodí nás do soukromých a nepříliš skromných komnat [char_current.GetTitleAsNamePossessive]. [char_current.GetSheHe|U] mě zavede do místnosti, která zjevně slouží k poradám nejvýznamnějších lidí [destination.GetTitle.Custom('BaronyTownTypePossessive')], a ukáže na židli." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.business.merchant: "[char_current.GetTitledFirstName] mě zavede do nedalekých prostor [Select_CString(char_current.IsFemale,'její','jeho')] společnosti, kde [Select_CString(char_current.IsFemale,'její','jeho')] vlastní společníci pilně zapisují do účetních knih výnosy z dnešních obchodů." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.business.docks: "[char_current.GetFirstName] má na starosti městské doky a z nábřeží sleduje ruch kolem. V [Select_CString(char_current.IsFemale,'Jejích','Jeho')] nekonečných dokumentech jsou evidovány poplatky, které dluží lodě, i náklad, který byl doručen a naložen." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.business.market: "[char_current.GetFirstName] dohlíží na hlavní tržiště [destination.GetTitle.GetBaseNameNoTierPossessive], zajišťuje řádné licence pro kramáře a dbá na dodržování zákonů [local_ruler.GetTitleAsNamePossessiveNoTooltip]." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.business.smithy: "Najdu [char_current.GetFirstName] v [Select_CString(char_current.IsFemale,'její','jeho')] kovárně, kde [char_current.GetSheHe] pilně kuje podkovy. [char_current.GetSheHe|U] si mě sotva všimne, a když se naše pohledy střetnou, omluví se a předá práci učňovi." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.business.tannery: "Najdu [char_current.GetFirstName] v [Select_CString(char_current.IsFemale,'její','jeho')] koželužně, páchnoucím místě na okraji města. [char_current.GetSheHe|U] si zápachu sotva všímá; množství kůží a zákazníků svědčí o tom, že zisk dalece převyšuje odpudivý odér." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.business.carpentry: "Najdu [char_current.GetFirstName] v [char_current.GetHerHis] dílně, kde vzduch prostupuje vůně [char_current.Custom('GetRandomAppropriateTree')]. Když mě [char_current.GetSheHe] zahlédne, odloží dláta, se kterými [char_current.GetSheHe] pracuje." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.business.town_watch: "[char_current.GetFirstName] je velitelem městské stráže v [destination.GetTitle.GetAdjectiveNoTooltip] a najdu [char_current.GetHerHim], jak podřimuje ve zbrojnici. Když se probere, [char_current.GetSheHe] nabídne mi místo a zakoktá něco o [Select_CString(char_current.IsFemale,'její','jeho')] přestávce." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.personality.local_ruler: "„Promluvme si otevřeně, [ROOT.Char.GetTitledFirstNameOnlyNotMeNoTooltip],“ začne [char_current.GetSheHe]. „Říká se, že se ten váš [trader.GetWomanMan] dopustil všelijakých podvodů a" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.personality.local_ruler.closing: "\n\n„Dejte svou společnost do pořádku, nebo si budete muset najít jiné místo k podnikání.“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.personality.merchant: "„Je to tak těžké?“ usměje se [char_current.GetSheHe]. „Obchodovat poctivě? Vaše obchodní jednání vrhají na [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] špatné světlo…“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.personality.courtier: "„Varuji vás,“ usměje se [char_current.GetSheHe], „[local_ruler.GetTitleAsNameNoTooltip] měl dosud trpělivost, ale nedoporučuji [local_ruler.GetHerHim] zkoušet.“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.personality.market: "„Ze všech obchodníků, kteří tu působí,“ usměje se [char_current.GetSheHe] a rozpřáhne [Select_CString(char_current.IsFemale,'její','jeho')] ruce, „je právě #EMP váš#! obchodník,“ [char_current.GetSheHe] ukáže na mě obviňujícím gestem, „terčem stížností znovu a znovu.“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.personality.town_watch: "„Tady se říká,“ zašklebí se [char_current.GetSheHe], „#EMP není kouře bez ohně#!, a ten váš obchodník toho kouře nadělá #EMP spoustu#!, to vám povídám!“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.personality.ai_honor: "„Vždycky jsem podnikal poctivě, vedl řádné záznamy a udržoval dobré vztahy se zákazníky. Škoda, že ne každý dbá na totéž…“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.personality.ai_zeal: "„Tomu se nevyhneme, [char_current.GetFaith.WealthGodName] nad námi všemi bdí a já dbám na to, abych si [char_current.GetFaith.WealthGodHerHis] přízeň udržel. Ti, kdo to nedělají, brzy poznají následky…“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.personality.ai_greed: "„Podívejte, rád si vezmu minci jako každý jiný [char_current.GetWomanMan], možná ještě raději! Ale takhle se podnikat nedá, když mě na každém kroku někdo ošidí.“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.personality.ai_compassion: "„Vypadáte jako rozumný [ROOT.Char.GetWomanMan], [ROOT.Char.GetTitledFirstNameNoTooltip]. Pochopte prosím, že nám váš [trader.GetWomanMan] ublížil a my si to nemůžeme dovolit.“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.personality.ai_boldness: "„Považuji se za přímočarého [char_current.GetWomanMan]. Mluvím otevřeně a doufám, že ostatní budou mluvit otevřeně se mnou. Váš [trader.GetWomanMan] je lhář. Takhle jednoduché to je.“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.personality.ai_rationality: "„Já vím, já vím, vypadá to, že se nám daří, ale při svém podnikání závisím na dodávkách a váš [trader.GetWomanMan] mě zklamal už příliš mnohokrát.“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.personality.ai_vengefulness: "„Rád hraju poctivě, [ROOT.Char.GetTitledFirstNameNoTooltip], ať už obchodně, s těmi podřízenými, nebo s nadřízenými. Poctivost má ale smysl jen tehdy, když ji dodržují všichni. Jinak… takhle si někteří lidé zadělají na #EMP pořádnou#! zášť.“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.personality.ai_energy: "„Jsem zaneprázdněný [char_current.GetWomanMan] a vy jste zaneprázdněný [ROOT.Char.GetWomanMan], takže budu stručný. Když nedostanu, co potřebuji, nemám čím nakrmit své blízké. Chci to vyřešit.“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.personality.ai_sociability: "„Podívejte, jsem si jistý, že [trader.GetFirstName] je v jádru slušný člověk, ale i moje trpělivost má své meze a [trader.GetSheHe] je už dávno překročil.“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.personality.ai_personality_fallback: "„Takže… co s tím hodláte dělat? Váš [trader.GetWomanMan] si tu nadělal spoustu nepřátel, a úplně zbytečně. Chceme jen slušné zacházení.“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.irregularity.missing: "ztratil několik zásilek.„" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.irregularity.quality: "dodal nekvalitní zboží.„" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.desc.irregularity.dues: "nezaplatil řádné poplatky.„" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.a: "Zkusit vysvětlit ty nesrovnalosti." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.b: "Pokusit se [char_current.GetHerHim] přesvědčit o své poctivosti." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.c: "Něco si vymyslet." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.d.gold: "„Přijměte to jako náhradu za způsobené potíže.“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.d.competitiveness: "„Postarám se, aby se všechno napravilo.“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.e: "„Co kdybychom se #EMP nějak dohodli?#!“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.f.partner: "[partner.GetFirstNameNoTooltip|U], vysvětlete to." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.f.partner_away: "Kéž by tu byl můj [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]…" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.f.partner_diff: "Kéž bych měl jiného [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]…" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.f.no_partner: "Kéž bych měl [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]…" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.tt.current_assurances: "#TUT Poskytl jsi [task_contract.MakeScope.Var('assurances_given').GetValue|0V] ujištění z možných #V 3#!#!" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.tt.chars_checked: "#TUT Promluvil jsi s [task_contract.MakeScope.Var('chars_checked').GetValue|0V] [Concept('characters','postavami')|E] z možných #V 3#!#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_merchant_unity_contract.1011.tt.success_increases_score: "Poskytneš #P +1#! ujištění" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.tt.failure_gives_no_score: "Žádné ujištění neposkytneš" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.stewardship.tt.success: "Tady přičíst, támhle jeden záznam vynechat" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.stewardship.tt.failure: "Počkat, ne. Aha. Opravdu?" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.diplomacy.tt.success: "To byla z [Select_CString(char_current.IsFemale,'její','jeho')] strany hloupá chyba" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.diplomacy.tt.failure: "Každé slovo souhlasí" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.intrigue.tt.success: "Není tak chytrý, jak si [char_current.GetSheHe] myslí, že [char_current.GetSheHe] je" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.intrigue.tt.failure: "Je o polovinu chytřejší než ty" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.learning.tt.success: "Víš, kde hledat" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1011.learning.tt.failure: "Prohledáš všechno, ale nic nenajdeš" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.t.success: "$unity_irregularities_contract$: Úspěch!" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.t.failure: "$unity_irregularities_contract$: Neúspěch!" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.t.ignored: "$unity_irregularities_contract$: Úkol ignorován" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.desc.method.stewardship: "Když si [char_current.GetTitledFirstName] prohlíží účetní knihy [char_current.GetHerHis], ukazuje na příklady zpronevěry a výdajů, jejichž očekávané výnosy se nikdy nedostavily nebo nedosáhly slíbené výše." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.desc.method.diplomacy: "Dlouze vyprávím o dobré pověsti své společnosti v [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] a o mnoha doporučeních od tamních čestných lidí. Nedávné obchody jsou zjevně výjimkou, nad kterou bychom měli v zájmu obchodu přimhouřit oči." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.desc.method.intrigue: "Spřádám klikatý příběh o nedávných potížích, plný bezvýznamných odboček a pečlivě dávkovaných pravdivých detailů, až se i já ztrácím v síti lží." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.desc.method.learning: "Rozmlouváme tak dlouho, že se zdá, jako by to trvalo #EMP většinu dne#!. Probíráme každou myslitelnou stránku podnikání [char_current.GetTitledFirstNamePossessive] v [destination.GetBaronyNameExplicitly]. Neponecháme kámen na kameni ani otázku bez odpovědi." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.desc.method.partner: "Zatímco [partner.GetFirstName] vede výslech, [char_current.GetTitledFirstName] usedá a odpovídá na zdánlivě nekonečnou záplavu otázek. Zpočátku trpělivě, ale jak čas plyne, stále méně ochotně." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.desc.method.bribe.gold: "„Vaše pochopení této záležitosti bych #EMP nesmírně#! ocenil.“ Usměju se, sáhnu do měšce a vysypu na stůl několik mincí. [char_current.GetSheHe|U] na okamžik ztuhne a střídavě pohlíží na lesklý kov a na mé pozvednuté obočí." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.desc.method.reimburse: "„[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] hluboce lituje potíží, které vám toto nedorozumění způsobilo,“ zapěju. „Vaše ztráty #EMP osobně#! napravím.“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.desc.result.outro.all_done: "A tím jsem udělal vše, co jsem mohl. Je čas celou věc uzavřít." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.desc.result.bribe_success: "[char_current.GetFirstNameNoTooltip] na mě spiklenecky mrkne a přitáhne si mince k [char_current.GetHerHim]." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.desc.result.bribe_failure: "Překvapení [char_current.GetFirstNameNoTooltip] rychle vystřídá hněv a ukáže mi ke dveřím." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.desc.result.success: "Díky několika výmluvám a nářkům nad vrtkavostí obchodu [char_current.GetFirstNameNoTooltip] pomalu přijme má vysvětlení každé nesrovnalosti. Prostě smutná realita dálkového obchodu." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.desc.result.failure: "Navzdory veškeré snaze [char_current.GetSheHe] odmítá každý můj argument a předkládá vlastní řešení, protiargument či příklad ze [Select_CString(char_current.IsFemale,'jejích','jeho')] zkušeností. Stále není spokojený." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.desc.result.reimburse: "Lepší vrabec v hrsti než holub na střeše. A pravděpodobně nepoctivě nabyté zisky tohoto [char_current.GetWomanMan] spočinuly tak pohodlně v mé dlani — i když jsme tím přišli o možnost [char_current.GetHerHim] vyšetřovat." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.desc.result.outro.success: "Kéž nám štěstí přeje i příště." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.desc.result.outro.failure: "Snad si příště povedeme lépe." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.desc.result.outro.reimburse: "Proti tomu [char_current.GetSheHe] nemůže nic namítat." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.desc.result.outro.bribe: "Kéž můj měšec přežije naši příští návštěvu…" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.a: "Další bude [local_ruler.GetTitledFirstNameNoTooltip]." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.b: "Dál, za [person_c.GetTitledFirstNameNoTooltip]." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.c: "[person_d.GetTitledFirstNameNoTooltip] na nás čeká…" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.d: "Skončeme s tím…" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.tt.boilerplate.continue_investigation: "Pokračuješ ve snaze poskytnout ujištění" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1012.tt.boilerplate.end_investigation: "Rozhodneš se, jak situaci vyřešit" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1021.t: "$unity_irregularities_contract$: Rozuzlení" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1021.desc.intro: "Znovu se shromažďujeme na náměstí, kde [local_ruler.GetTitledFirstName] svolal netrpělivé stěžovatele i mého obchodníka, aby si vyslechli můj konečný názor na celou záležitost.\n\n[person_c.GetFirstName] a [person_d.GetFirstName] ke mně vzhlížejí, zatímco [trader.GetFirstName] vypadá poprvé od mého příjezdu nervózně a pod jejich pohledem se ošívá.\n\nMůj instinkt mi napovídá, že" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1021.desc.assurances_given.three: "jsem si místní získal na svou stranu." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1021.desc.assurances_given.two: "jsou místní s mým úsilím celkem spokojení." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1021.desc.assurances_given.one_or_less: "jsem si v každém případě nezískal důvěru místních." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1021.desc.body: "\n\n[local_ruler.GetTitleAsNameNoTooltip] zívne: „Tak už, co tedy…“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1021.desc.irregularity.missing: "tyto chybějící zásilky?„" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1021.desc.irregularity.quality: "toto nekvalitní zboží?„" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1021.desc.irregularity.dues: "tyto nezaplacené poplatky?„" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1021.tt.clue_total.exceptional_achievable: "#TUT Když jste poskytli všechna možná ujištění, vaše mimořádné úsilí stačilo k dosažení $label_success_critical$, i když [trader.Custom('CZ_TitledFirstName_A')] nepotrestáte#!" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1021.tt.clue_total.normal_achievable: "#TUT Po dostatečném ujištění vaše úsilí nejspíš povede k výsledku $label_success_standard$, i když [trader.Custom('CZ_TitledFirstName_A')] nepotrestáte#!" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1021.tt.clue_total.failure_possible: "#TUT Protože jste poskytli nedostatečná ujištění, vaše chabé úsilí může vést k odporu, pokud [trader.Custom('CZ_TitledFirstName_A')] nepotrestáte#!" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1021.a: "„Jak jsem vysvětlil, šlo jen o politováníhodné nedorozumění.“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1021.a.tt: "Považujete svá ujištění za dostatečná" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1021.a.tt.success_standard: "Pokud jste poskytli mnoho ujištění" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1021.a.tt.success_qualified: "Pokud jste poskytli nějaká ujištění a místní ustoupí" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1021.a.tt.failure_standard: "Pokud jste nedokázali poskytnout dostatečná ujištění a místní zareagují nepříznivě" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1021.b: "Zaplatíte — polovinu." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1021.b.tt: "Rozhodnete ve prospěch [local_ruler.Custom('CZ_TitledFirstName_G')], ale přesto [trader.Custom('CZ_TitledFirstName_D')] zmírníte daňové břemeno" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1021.c: "„Celá ta záležitost je naprostý nesmysl. Pomluvy a nesmysly!“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1021.c.tt: "Rozhodně popřete jakékoli pochybení společnosti" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1021.d: "„[trader.GetTitledFirstName] je vinen a musí být potrestán.“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1021.d.tt: "Obětujete [trader.Custom('CZ_TitledFirstName_A')] ve prospěch společnosti" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1022.t.success_critical: "$unity_irregularities_contract$: Pouhé nedorozumění" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1022.t.success_standard: "$unity_irregularities_contract$: Záležitost uzavřena" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1022.t.success_qualified_insufficient_assurances: "$unity_irregularities_contract$: Neuzavřená záležitost" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1022.t.failure_standard: "$unity_irregularities_contract$: Neuspokojivé" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1022.desc.success_critical: "Místní se na sebe podívají a s nadšením přikyvují, zatímco se [trader.GetFirstName] rozzáří. [local_ruler.GetTitledFirstName] si zjevně oddechl a zároveň je poněkud překvapený. „Výborně, v tom případě je záležitost uzavřena!“ [local_ruler.GetSheHe] pronese.\n\nŽalobci mi jeden po druhém vřele děkují za návštěvu a za to, že jsem je uklidnil. Společnosti se nějak podařilo získat v [destination.GetBaronyNameExplicitlyNoTooltip] ještě #EMP větší#! důvěru než kdy dřív." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1022.desc.success_standard: "Místní se na sebe podívají a rozvážně přikyvují, zatímco se [trader.GetFirstName] usměje. [local_ruler.GetTitledFirstName] působí nejistě, ale rychle pokračuje dál. „Dobrá. Tak tedy považujme záležitost za uzavřenou,“ [local_ruler.GetSheHe] řekne, téměř jako by se ptal.\n\nŽalobci se zdají být při probírání argumentů dostatečně spokojení. Vypadá to, že pověst společnosti v [destination.GetBaronyNameExplicitlyNoTooltip] je zatím v bezpečí." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1022.desc.success_qualified_insufficient_evidence: "Na krátký, napjatý okamžik to vypadá, že [local_ruler.GetTitledFirstName] a [Select_CString(local_ruler.IsFemale,'její','jeho')] poskoci hodlají zpochybnit můj slabý závěr, ale vzápětí napětí v tichosti pomine.\n\n„Dobrá tedy…“ povzdechne si [local_ruler.GetTitleAsNameNoTooltip] a pohlédne na nespokojené žalobce. „Dohlédněte na to, aby se něco takového už nikdy neopakovalo.“\n\nMístní očividně pochybují, ale to je problém [trader.GetFirstNamePossessive]." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1022.desc.failure_standard: "Náměstí zahalí ticho.\n\nNapjaté, rozpačité ticho, zatímco si místní měří jeden druhého pohledem a nelibostí téměř odhalují zuby.\n\n[local_ruler.GetTitledFirstName] zavrčí: „To je všechno?“ Žalobci mu rozzlobeně přitakají.\n\nNapjaté polknutí [trader.GetFirstNamePossessive] přeruší ticho. „Velice se omlouvám za ty potíže,“ nabídne [trader.GetSheHe], „ale už se nedá nic dělat, takové věci… se stávají.“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1022.a: "Lépe to snad ani dopadnout nemohlo." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1022.b: "Konec dobrý, všechno dobré…" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1022.c: "No, mohlo to dopadnout lépe." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1022.d: "Ehm… je čas jít." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1023.t: "$unity_irregularities_contract$: Popření" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1023.desc: "Žalobci jsou očividně ohromeni, soudě podle jejich rozzlobeného šeptání. [local_ruler.GetTitleAsName] zjevně neví, jak postupovat dál.\n\nPřekvapení [trader.GetFirstName] se mění v odvážnou hrdost, když pokračuji: „Nedovolím, aby se dobré jméno mé společnosti vláčelo blátem kvůli takovým maličkostem.“\n\nOhrnu nos: „Zbytečně jste mě zdrželi. V [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] mám naléhavé povinnosti!“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1023.a: "Je čas jít." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1024.t: "$unity_irregularities_contract$: Pod vůz" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1024.desc: "Žalobci propuknou v jásot a poněkud překvapený [local_ruler.GetTitledFirstName] přivolá městskou stráž, aby nasadila pouta užaslému [trader.GetFirstName].\n\n„A-ale, [ROOT.Char.GetTitleAsNameNoTooltip]!“ zachraptí můj kupec. Lenoše mávnu rukou, aby [trader.GetHerHim] [Select_CString(ROOT.Char.IsFemale,'odešla','odešel')]: „Dobře mu tak, stejně [trader.GetSheHe] byl mizerný kupec…“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1024.a: "Nezbytná oběť." # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1031.t: "$unity_irregularities_contract$: Inspirativní prozíravost" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1031.desc: "„[ROOT.Char.GetTitledFirstNameNoTooltip]?“\n\nZvednu oči od účetních knih a spatřím… poněkud povědomého [hopeful.GetCulture.GetName] [hopeful.GetWomanMan]? Odkud jen [hopeful.GetHerHim] znám…\n\n„Jmenuji se [hopeful.GetTitledFirstName], [ROOT.Char.GetTitleAsNameNoTooltip]. Před několika lety jste navštívil mé rodné město, [destination_1.GetBaseNameNoTier], a vyřešil tamní nedorozumění. Myslel jsem, že jste to zvládl důstojně a s grácií.“\n\n„Každopádně se mi před časem zhroutily podniky a hledám si jinou práci. Napadlo mě, že byste pro mě… mohl najít uplatnění…“" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1031.a: "Dobrá, vítej na palubě!" # todo: NEW TRANSLATION
 gdp_merchant_unity_contract.1031.b: "Společnost pro tebe nemá využití." # todo: NEW TRANSLATION
