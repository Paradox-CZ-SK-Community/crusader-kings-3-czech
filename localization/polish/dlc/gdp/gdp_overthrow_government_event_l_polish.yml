l_polish:
 overthrow_government_outcome.1001.t: "Svržení vlády" # todo: NEW TRANSLATION
 overthrow_government_outcome.1001.desc: "Spiknutí dospělo k vrcholu. Teď, anebo nikdy. Klíčoví spolčenci byli rozmístěni v kasárnách městské stráže, ve Shromáždění a v paláci. Na můj rozkaz se zmocní pák moci a zajistí, že starý režim bude smeten.\n\nZítra nebude mít Shromáždění na vybranou a bude muset uznat můj režim a odsoudit mé protivníky jako nepřátele státu." # todo: NEW TRANSLATION
 overthrow_government_outcome.1001.a: "Žádná krev. Žádné vyhnanství." # todo: NEW TRANSLATION
 overthrow_government_outcome.1001.b: "Moji osobní nepřátelé." # todo: NEW TRANSLATION
 overthrow_government_outcome.1001.c: "Každý, kdo nám odporuje, musí pryč." # todo: NEW TRANSLATION
 overthrow_government_outcome.1002.t: "Republika obstála" # todo: NEW TRANSLATION
 overthrow_government_outcome.1002.desc: "Vyšlo najevo spiknutí mezi mými patriciji, které zosnoval ten darebák [owner.GetShortUINameNoTooltip]. Naštěstí se puč rychle roztříštil o skálu mé slavné vlády!\n\nDarebáci se pokusili zmocnit mé vznešené osoby, ale moji strážci jejich útok odrazili. Shromáždění i armáda mi navzdory jejich hanebným snahám stále zůstávají věrné." # todo: NEW TRANSLATION
 overthrow_government_outcome.1002.a: "Dejte je zatknout!" # todo: NEW TRANSLATION
 overthrow_government_outcome.1002.b: "Vypořádám se s nimi, až přijde čas." # todo: NEW TRANSLATION
 overthrow_government_outcome.1002.c: "Najdu v srdci odpuštění." # todo: NEW TRANSLATION
 overthrow_government_outcome_forgive_tt: "[owner.GetShortUIName] a [owner.GetHerHis] [Concept('agents','spolčenci')|E] jsou zproštěni svého [Concept('criminal','zločinného')|E] postavení a už nejsou nepřáteli státu" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 overthrow_government_outcome.1003.t: "Svržení" # todo: NEW TRANSLATION
 overthrow_government_outcome.1003.desc: "„Můj pane!“ vykřikne [craftsman_character.GetShortUINameNoTooltip], když [craftsman_character.GetSheHe] vtrhne do dveří a vypadá, jako by [craftsman_character.GetSheHe] utíkal o [Select_CString(craftsman_character.IsFemale,'její','jeho')] život.\n\n„Spiknutí! Zrada! [owner.GetShortUINameNoTooltip] shromáždil stoupence a zařídil, aby vás Shromáždění odsoudilo jako nepřítele státu! Míří sem násilníci!“\n\n[craftsman_character.GetSheHe|U] přechází místnost jako zvíře v kleci. „Co máme dělat?“ zeptá se [craftsman_character.GetSheHe]." # todo: NEW TRANSLATION
 overthrow_government_outcome.1003.b.desc: "„Můj pane!“ vykřikne [craftsman_character.GetShortUINameNoTooltip], když [craftsman_character.GetSheHe] vtrhne do dveří a vypadá, jako by [craftsman_character.GetSheHe] utíkal o [Select_CString(craftsman_character.IsFemale,'její','jeho')] život.\n\n„Spiknutí! Zrada! [owner.GetShortUINameNoTooltip] shromáždil stoupence a zařídil, aby Shromáždění vyhlásilo novou vládu. Lidé si povídají, že jste byl sesazen, ale nová vláda omilostnila všechny své politické nepřátele.“\n\n[craftsman_character.GetSheHe|U] se na mě podívá se sklíčeným výrazem. „Co máme dělat?“ zeptá se [craftsman_character.GetSheHe]." # todo: NEW TRANSLATION
 overthrow_government_outcome.1003.a: "Přednesu svou obhajobu před [ROOT.Char.GetLiege.Custom('CZ_TitledFirstName_I')|U] a Shromážděním." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [ROOT.Char.GetLiege.GetTitleAsName]; navyše [ROOT.Char.GetLiege.GetTitledFirstName]
 overthrow_government_outcome.1003.b: "Odejdu do vyhnanství." # todo: NEW TRANSLATION
 overthrow_government_outcome.1003.c: "Stáhnu se z politiky a stanu se prostým obchodníkem." # todo: NEW TRANSLATION
 overthrow_government_outcome.1003.d: "Zatím nic. Takové jsou politické zvraty." # todo: NEW TRANSLATION
 overthrow_government_outcome.1004.t: "Nepřítel státu" # todo: NEW TRANSLATION
 overthrow_government_outcome.1004.1.desc: "Byl jsem prohlášen za nepřítele státu!" # todo: NEW TRANSLATION
 overthrow_government_outcome.1004.2.desc: "\n\nProhlášení se vyvěšuje na každém tržišti a na dveřích každého kostela. Můj život i majetek jsou v ohrožení." # todo: NEW TRANSLATION
 overthrow_government_outcome.1004.3.desc: "\n\nKaždou chvíli mě mohou zatknout!" # todo: NEW TRANSLATION
 overthrow_government_outcome.1004.councilor.desc: "\n\nNepochybně kvůli mému významnému postavení v radě sesazeného režimu." # todo: NEW TRANSLATION
 overthrow_government_outcome.1004.personal.desc: "\n\nJelikož mě [owner.GetName] považuje za osobního nepřítele, není těžké uhodnout proč." # todo: NEW TRANSLATION
 overthrow_government_outcome.1004.political.desc: "\n\nNepochybně kvůli mému postavení mocného patricije a výrazného hlasu proti agendě [owner.GetHouse.GetHouseAspiration.GetName] nového režimu." # todo: NEW TRANSLATION
 overthrow_government_outcome.1004.conspiracy.desc: "\n\nNepochybně kvůli mé roli spolčence ve spiknutí za účelem svržení vlády." # todo: NEW TRANSLATION
 overthrow_government_outcome.1004.a: "$overthrow_government_outcome.1003.a$" # todo: NEW TRANSLATION
 overthrow_government_outcome.1004.b: "$overthrow_government_outcome.1003.b$" # todo: NEW TRANSLATION
 overthrow_government_outcome.1004.c: "$overthrow_government_outcome.1003.c$" # todo: NEW TRANSLATION
 overthrow_government_outcome.1005.t: "Kostky jsou vrženy" # todo: NEW TRANSLATION
 overthrow_government_outcome.1005.desc: "Když [speaker.GetShortUINameNoTooltip] předstoupí a ujme se slova před Shromážděním, ve vzduchu visí napjaté očekávání.\n\n„Patricijové! Ať žije Patria a naše Republika. S bolestí vám oznamuji, že náš [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U] [target.GetFirstNameNoTooltip] byl sesazen kvůli korupci a zradě Republiky—“\n\nSálem se nese vlna výkřiků a šepotu, ale několik vlivných patricijů vstane a zatleská.\n\n„Na základě mimořádného výnosu se občanka [owner.GetFirstNameNoTooltip] ujal vedení státu, aby jej zachránil, jako náš nový [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U].“\n\nPotlesk sílí, jak vstávají další patricijové." # todo: NEW TRANSLATION
 overthrow_government_outcome.1005.a: "Ať žije Republika!" # todo: NEW TRANSLATION
 overthrow_government_outcome.1005.b: "Fuj! Tyran! Zrada!" # todo: NEW TRANSLATION
 government_overthrow_enemies.1001.b.custom: "Následující patricijové se stanou [Concept('criminals','zločinci')|E]:\n$EFFECT_LIST_BULLET$Sesazený [Concept('liege','lenní pán')|E] a [Concept('councillors','rádci')|E]\n$EFFECT_LIST_BULLET$Tvoji [rivals|E] a [Concept('nemesis','úhlavní nepřítel')|E]\n$EFFECT_LIST_BULLET$Postavy, jejichž [Concept('opinion','mínění')|E] o tobě je #N -60#! nebo nižší\n$EFFECT_LIST_BULLET$[Concept('house_heads','Hlavy rodu')|E] s [Concept('rivalry','sokovstvím')|E] [Concept('house_relation','vztahem rodů')|E]\n$EFFECT_LIST_BULLET$Mohou požádat o milost v [Concept('assembly','shromáždění')|E], nebo odejít do vyhnanství\n$EFFECT_LIST_BULLET$[Concept('friends','Přátelé')|E], [Concept('lovers','milenců')|E], [Concept('soulmates','spřízněných duší')|E] a [Concept('blood_brothers','pokrevních bratrů')|E] jsou vynecháni" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 government_overthrow_enemies.1001.c.custom: "Následující patricijové se stanou [Concept('criminals','zločinci')|E]:\n$EFFECT_LIST_BULLET$Každý [Concept('powerful_vassal','mocný vazal')|E] s odlišnou [Concept('house_ambition','ambicemi rodu')|E]\n$EFFECT_LIST_BULLET$Sesazený [Concept('liege','lenní pán')|E] a [Concept('councillors','rádci')|E]\n$EFFECT_LIST_BULLET$Tvoji [rivals|E] a [Concept('nemesis','úhlavní nepřítel')|E]\n$EFFECT_LIST_BULLET$Postavy, jejichž [Concept('opinion','mínění')|E] o tobě je #N -60#! nebo nižší\n$EFFECT_LIST_BULLET$[Concept('house_heads','Hlavy rodu')|E] s [Concept('rivalry','sokovstvím')|E] [Concept('house_relation','vztahem rodů')|E]\n$EFFECT_LIST_BULLET$Osobní nepřátelé tvých [Concept('agents','spolčenci')|E]\n$EFFECT_LIST_BULLET$Mohou požádat o milost v [Concept('assembly','shromáždění')|E], nebo odejít do vyhnanství" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 government_overthrow_populace.1001.a.custom: "Každé [Concept('county','hrabství')|E] v tvém [Concept('realm','panství')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 government_overthrow_populace.1001.a.description: "Udělíš plošnou amnestii odpůrcům nového režimu." # todo: NEW TRANSLATION
 government_overthrow_forgiven.tt: "Jsi zproštěn svých zločinů proti státu" # todo: NEW TRANSLATION
 overthrow_government_outcome.tt.success.desc: "Výmluvně obhájíš své činy" # todo: NEW TRANSLATION
 overthrow_government_outcome.tt.success.toast: "Dokážeš, že tvé činy vedla láska k Republice" # todo: NEW TRANSLATION
 overthrow_government_outcome.tt.failure.desc: "Tvá řeč padne na hluché uši" # todo: NEW TRANSLATION
 overthrow_government_outcome.tt.failure.toast: "Publikum tě vypíská a vykáže ze Shromáždění" # todo: NEW TRANSLATION
 overthrow_government_become_merchant.tt: "[ROOT.Char.GetShortUINameNoTooltip] se stal prostým obchodníkem" # todo: NEW TRANSLATION
 overthrow_government_enemy_of_the_state.tt: "Shromáždění tě označilo za nepřítele státu" # todo: NEW TRANSLATION
 overthrow_government_amnesty.tt: "Shromáždění udělilo plošnou amnestii všem spiklencům" # todo: NEW TRANSLATION
 overthrow_government_arrested.tt: "[target.GetShortUINameNoTooltip] nařídil tvé zatčení za účast na spiknutí proti státu" # todo: NEW TRANSLATION
 overthrow_government_blanket_pardon.tt: "Svržení vlády: omilostněn" # todo: NEW TRANSLATION
 overthrow_government_blanket_pardon.desc: "[the_new_dodge.GetShortUINameNoTooltip] vydal prohlášení, jímž uděluje milost všem [Select_CString(the_new_dodge.IsFemale,'jejím','jeho')] politickým nepřátelům." # todo: NEW TRANSLATION
