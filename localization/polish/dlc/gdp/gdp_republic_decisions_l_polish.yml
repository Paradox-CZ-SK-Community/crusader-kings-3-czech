 gdp_popular_gifts_decision: "Požádat o dary" # todo: NEW TRANSLATION
 gdp_popular_gifts_decision_desc: "Mé postavení mezi obyvateli [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] mi dává určitou moc. Rozhlásím, že [ROOT.Char.GetTitleAsNameNoTooltip|l] přijímá nabídky od významných patricijských rodů. Budou se předhánět, kdo nabídne víc. Palác z toho bude těžit tak či tak." # todo: NEW TRANSLATION
 gdp_popular_gifts_decision_tooltip: "Využijete [Concept('popular_opinion','lidové mínění')|E] k tomu, abyste přiměli bohaté patricijské rody soutěžit o přízeň, a získáte [Concept('gold','zlato')|E] a dary pro palác" # todo: NEW TRANSLATION # todo: CONCEPT CASE
