 gdp_civic_labor_decision_tooltip: "Využijete [Concept('popular_opinion','lidové mínění')|E] v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] a získáte bonusy ke stavbě domicilu [ROOT.Char.GetTitleAsNameNoTooltip|l]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
