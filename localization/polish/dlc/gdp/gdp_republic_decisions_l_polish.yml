 gdp_popular_mandate_decision: "Požádat o podporu lidu" # todo: NEW TRANSLATION
 gdp_popular_mandate_decision_desc: "Lidé v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] mě mají rádi. Mohu jejich přízně využít a získat si jejich podporu pro své další působení ve funkci. Hlas davu má ve shromáždění váhu a [ROOT.Char.GetTitleAsNameNoTooltip|l], za nímž stojí lid, má při sčítání hlasů silnější postavení.\n\nBude mě to stát část přízně, ale hlasování se vyhrává dnes, ne zítra." # todo: NEW TRANSLATION
 gdp_popular_mandate_decision_tooltip: "Využijete [Concept('popular_opinion','lidové mínění')|E] v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] a získáte dodatečný hlas v příštích [Concept('election','voleb')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
