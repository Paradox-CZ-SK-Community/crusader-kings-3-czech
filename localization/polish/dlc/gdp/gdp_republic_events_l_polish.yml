l_polish:
 republic_event.0001.t: "The [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]" # todo: NEW TRANSLATION
 republic_event.0001.desc: "Základy naší republiky jsou konečně položeny! Drobní tyrani a jejich najatí bijci nás už nebudou poutat k pluhu a brázdě. Jejich spory nám už nebudou přinášet bolest a žal.\n\nNyní, sjednoceni v jedné komuně, budeme utvářet svůj vlastní osud a bránit naši těžce vydobytou svobodu. Ať naše město září jako maják naděje a jeho hradby nás chrání před tyranií." # todo: NEW TRANSLATION
 republic_event.0001.a: "Začátek nové éry!" # todo: NEW TRANSLATION
 republic_event.0002.t: "The [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]" # todo: NEW TRANSLATION
 republic_event.0002.desc: "Staré způsoby nám dobře sloužily a vždy jim budeme vzdávat čest. Klanová síň už ale nemůže pojmout vše, čím jsme se stali. Trhy, hradby a vůle lidu si nyní žádají jiný způsob vlády.\n\nDnes odkládáme [Concept('tribal','kmenovou')|E] vládu a zakládáme [Concept('republic','republika')|E]. Ať město promluví jedním hlasem — a ať ten hlas patří nám." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 republic_event.0002.a: "Město na to nikdy nezapomene" # todo: NEW TRANSLATION
 republic_event.0010.opening: "[actor.Custom2('AppropriateGreetingNegative', recipient)]" # todo: NEW TRANSLATION
 republic_event.0010.desc: "Tímto vám oznamuji, že jsem s okamžitou platností zrušil vaši obchodní stanici v [actor.GetCapitalLocation.GetBaronyNameExplicitly].\n\nJe to samozřejmě v nejlepším zájmu [actor.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip]. Jsem si jist, že to pochopíte." # todo: NEW TRANSLATION
 republic_event.0010.a: "Ale to byla #EMP moje#! obchodní stanice!" # todo: NEW TRANSLATION
 republic_event.0012.desc: "V [trade_post_target_county.Custom('CZ_LandedNameNoTierNoTooltip_L')] už nejste vítáni! Vaše obchodní práva jsou zrušena. Veškerý váš cenný majetek tam bude zabaven a obchodní stanice srovnána se zemí." # todo: NEW TRANSLATION
 republic_event.0012.a: "Budu si muset najít nový domov pro své obchodní zboží..." # todo: NEW TRANSLATION
 republic_event.0020.t: "The [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] Treasury" # todo: NEW TRANSLATION
 republic_event.0020.intro: "Nastal čas upravit rozpočet republiky." # todo: NEW TRANSLATION
 republic_event.0020.steward_desc: "[steward.GetShortUIName|U] stojí přede mnou, s ustaraným výrazem a účetní knihou v ruce. Za [steward.GetHerHim] se táhne malá armáda pomocníků obtěžkaných svitky, knihami a finančními záznamy.\n\n„[ROOT.Char.Custom('CZ_TitledFirstName_V')|U]. Musíme #EMP bezpodmínečně#! projít naše výdaje a připravit nový rozpočet pokladnice. Obávám se, že to nesnese odkladu.“" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [ROOT.Char.GetTitleAsName]; navyše [ROOT.Char.GetTitledFirstName]
 republic_event.0020.solo_desc: "Jsem obklopen malou armádou písařů obtěžkaných svitky, knihami a finančními záznamy. Všichni čekají, až dokončím kontrolu.\n\n" # todo: NEW TRANSLATION
 republic_event.0020.income_desc: "Naše současné příjmy výrazně převyšují výdaje a mohli bychom s nimi naložit lépe." # todo: NEW TRANSLATION
 republic_event.0020.deficit_desc: "Naše výdaje jsou příliš vysoké a bez zásahu se pokladnice zhroutí." # todo: NEW TRANSLATION
 republic_event.0020.fallback_desc: "Od chvíle, kdy vstoupil v platnost poslední rozpočet, uplynulo mnoho let." # todo: NEW TRANSLATION
 republic_event.0020.a: "$tgp_china_ministry.0100.a$" # todo: NEW TRANSLATION
 republic_event.0020.b: "$tgp_china_ministry.0100.b$" # todo: NEW TRANSLATION
 republic_event.0020.c: "$tgp_china_ministry.0100.c$" # todo: NEW TRANSLATION
 republic_event.0020.c_no_change: "[steward.GetShortUIName|U] už rozpočet zkontroloval a je v dobrém stavu. [steward.GetSheHe|U] nemá co měnit." # todo: NEW TRANSLATION
 republic_event.0020.a_tooltip: "$tgp_china_ministry.0100.a_tooltip$" # todo: NEW TRANSLATION
 republic_event.0021.desc: "Přede mnou leží několik dokumentů s návrhy, z nichž každý představuje jiný přístup k pokladnici — kde utrácet a kde utáhnout opasek.\n\nKterý z nich si vyberu?" # todo: NEW TRANSLATION
 republic_event.0021.a: "Zajistěte, aby všichni dostávali dobrý plat." # todo: NEW TRANSLATION
 republic_event.0021.b: "Nejlépe nám poslouží vyvážené platy." # todo: NEW TRANSLATION
 republic_event.0021.c: "Měli bychom upřednostnit další prostředky pro stát." # todo: NEW TRANSLATION
 republic_event.0021.a.info_desc: "[Concept('treasury_budget_category','Rozpočtová kategorie')|E] Zaměření: @gold_icon![Concept('treasury_salary_budget_short','plat')|E]\nVysoké platy se obvykle líbí většině [patricians|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 republic_event.0021.b.info_desc: "[Concept('treasury_budget_category','Rozpočtová kategorie')|E] Zaměření: @law_icon!Vyvážený rozpočet\nDobře vyvážený rozpočet zajišťuje [Concept('patricians','patricijové')|E] slušné platy a zároveň ponechává dostatek prostředků v [Concept('treasury','pokladnici')|E] pro [Concept('liege','lenního pána')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 republic_event.0021.c.info_desc: "[Concept('treasury_budget_category','Rozpočtová kategorie')|E] Zaměření: @treasury_icon!Panství\nNízký rozpočet na platy znamená více peněz pro republiku — [Concept('liege','lenního pána')|E] tak získá další prostředky, které může utratit podle svého uvážení" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 republic_event.0030.desc: "S lítostí vám oznamuji, že jsem zrušil všechny vaše monopoly na svých trzích. Obchodu musí být umožněno volně proudit." # todo: NEW TRANSLATION
 republic_event.0030.a: "Budeme muset soutěžit jako všichni ostatní..." # todo: NEW TRANSLATION
 republic_event.0040.desc: "S lítostí vám oznamuji, že jsem se rozhodl vás vyloučit z [actor.GetConfederation.GetName]." # todo: NEW TRANSLATION
 republic_event.0040.a: "Znovu soupeři" # todo: NEW TRANSLATION
 republic_event.0050.desc: "Shromáždění [title.Custom('CZ_LandedName_G')] mě zvolilo do vznešeného úřadu [new_holder.Custom('CZ_TitledFirstName_G')] [new_holder.Custom('GetRepublicTermLength')]." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [new_holder.GetTitleAsName]; navyše [new_holder.GetTitledFirstName]
 republic_event.0051.desc: "Byl jsem znovu zvolen [new_holder.Custom('GetRepublicTermLength')]. Sláva [title.Custom('CZ_LandedName_D')]!" # todo: NEW TRANSLATION
 republic_term_length_1_desc: "na funkční období v délce [EmptyScope.ScriptValue('law_term_length_1_value')|0] let" # todo: NEW TRANSLATION
 republic_term_length_2_desc: "na funkční období v délce [EmptyScope.ScriptValue('law_term_length_2_value')|0] let" # todo: NEW TRANSLATION
 republic_term_length_3_desc: "na funkční období v délce [EmptyScope.ScriptValue('law_term_length_3_value')|0] let" # todo: NEW TRANSLATION
 republic_term_length_4_desc: "na funkční období v délce [EmptyScope.ScriptValue('law_term_length_4_value')|0] let" # todo: NEW TRANSLATION
 republic_term_length_5_desc: "na funkční období v délce [EmptyScope.ScriptValue('law_term_length_5_value')|0] let" # todo: NEW TRANSLATION
 republic_term_length_indefinite_desc: "doživotně" # todo: NEW TRANSLATION
 republic_event.0052.desc: "Předložil jsem vznešeným členům shromáždění nový zákon.\n\nNávrh „[new_law.GetNameNoTooltip]“ bude po důkladném projednání předložen k hlasování." # todo: NEW TRANSLATION
 republic_event.0053.pass.desc: "Návrh „[new_law.GetNameNoTooltip]“ byl schválen a stal se zákonem republiky!" # todo: NEW TRANSLATION
 republic_event.0053.rejected.desc: "Shromáždění návrh „[new_law.GetNameNoTooltip]“ zamítlo." # todo: NEW TRANSLATION
 republic_event.law.TT: "#bold Navrženo:#! [new_law.GetName]" # todo: NEW TRANSLATION
 republic_event.law_passed.TT: "#bold #P Schváleno:#!#! [new_law.GetName]" # todo: NEW TRANSLATION
 republic_event.law_rejected.TT: "#bold #N Zamítnuto:#!#! [new_law.GetName]" # todo: NEW TRANSLATION
 republic_event.law_kept.TT: "#bold Zachováno:#! [current_law.GetName]" # todo: NEW TRANSLATION
 republic_event.assembly.response: "Rozumím." # todo: NEW TRANSLATION
 republic_event.assembly.opening: "Vážení spoluobčané," # todo: NEW TRANSLATION
 rescind_trade_monopoly_notification_base_desc: "Všechny [Concept('trade_monopolies','obchodní monopoly')|E] na trzích [actor.Custom('CZ_ShortUIName_G')] [Concept('trade_markets','obchodních trzích')|E] byly zrušeny. Patřily:" # todo: NEW TRANSLATION # todo: CONCEPT CASE
