 republic_event.0100.t: "The Republic of Rome" # todo: NEW TRANSLATION
 republic_event.0100.desc: "Řím. Vyslovit to slovo nikoli jako název města, nýbrž jako symbol, jako #EMP ideál#!, bylo dlouho snem mnohých. Já jsem tento sen proměnil ve skutečnost.\n\nZ každého kouta panství ke mně doléhají ozvěny oslav. Občané — ba ne, #EMP Římané#! — se mohou těšit na budoucnost, v níž budeme opět středem civilizace. Nyní začíná obnova ztracených ideálů antiky. Musíme se stát majákem naděje, světlem, které nám ukáže cestu v těchto temných časech." # todo: NEW TRANSLATION
 republic_event.0100.a: "Všechny cesty opět povedou do Říma." # todo: NEW TRANSLATION
 republic_event.0100.b: "Řím není jen místo, je to ideál." # todo: NEW TRANSLATION
