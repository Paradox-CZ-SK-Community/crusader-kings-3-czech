 gdp_republic_law_maker_modifier_desc: "Tato postava si nedávno lstivým manévrováním či náležitým využitím svých konexí zajistila podporu sněmu pro navrhovaný zákon.\n[Concept('patrician_rating','Hodnocení patricije')|E]: [EmptyScope.ScriptValue('gdp_republic_law_maker_patrician_rating_bonus_value')|0=+]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_dominate_market_trade_post_modifier: "Vlivná obchodní stanoviště" # todo: NEW TRANSLATION
 gdp_dominate_market_trade_post_modifier_desc: "Tento trh je silně ovlivňován obchodními stanovišti patricije." # todo: NEW TRANSLATION
 gdp_trade_post_charity_modifier: "Uspořádaná dobročinná sbírka" # todo: NEW TRANSLATION
 gdp_trade_post_charity_modifier_desc: "Tato postava uspořádala dobročinnou sbírku pro prostý lid, aby pomohla nemocným, chudým a potřebným." # todo: NEW TRANSLATION
 gdp_gather_popular_support_modifier: "Oblíbená mezi lidmi" # todo: NEW TRANSLATION
 gdp_gather_popular_support_modifier_desc: "Tato postava získala podporu obyvatel města, díky čemuž se její jméno stalo známým a její hlas je slyšet." # todo: NEW TRANSLATION
 gdp_gather_popular_support_house_t3_modifier: "Výjimečný rod lidu" # todo: NEW TRANSLATION
 gdp_gather_popular_support_house_t3_modifier_desc: "Tento rod má výjimečnou podporu obyvatel města.\n[Concept('patrician_rating','Hodnocení patricije')|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t3_patrician_rating_bonus_value')|0=+]\nSkóre podpory členů [Concept('house','rodu')|E] pro [GetLaw('republican_elective_succession_law').GetName]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t3_elective_bonus_value')|0=+]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_gather_popular_support_house_t2_modifier: "Silný rod lidu" # todo: NEW TRANSLATION
 gdp_gather_popular_support_house_t2_modifier_desc: "Tento rod má silnou podporu obyvatel města.\n[Concept('patrician_rating','Hodnocení patricije')|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t2_patrician_rating_bonus_value')|0=+]\nSkóre podpory členů [Concept('house','rodu')|E] pro [GetLaw('republican_elective_succession_law').GetName]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t2_elective_bonus_value')|0=+]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_gather_popular_support_house_t1_modifier: "Rod lidu" # todo: NEW TRANSLATION
 gdp_gather_popular_support_house_t1_modifier_desc: "Tento rod má podporu obyvatel města.\n[Concept('patrician_rating','Hodnocení patricije')|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t1_patrician_rating_bonus_value')|0=+]\nSkóre podpory členů [Concept('house','rodu')|E] pro [GetLaw('republican_elective_succession_law').GetName]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t1_elective_bonus_value')|0=+]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_signorial_execute_and_banish_modifier: "Despotický purkmistr" # todo: NEW TRANSLATION
 gdp_signorial_execute_and_banish_modifier_desc: "Tato postava popravila a vyhnala občany republiky a chová ambice udělat toho ještě více." # todo: NEW TRANSLATION
 gdp_ambition_promote_scheme_bonus_modifier: "Podporovaní patricijové" # todo: NEW TRANSLATION
 gdp_ambition_promote_scheme_bonus_modifier_desc: "Tato postava věnovala čas a úsilí zlepšení pověsti jiného patricije a získala si tím jeho přízeň.\n[Concept('patrician_rating','Hodnocení patricije')|E]: [EmptyScope.ScriptValue('gdp_ambition_promote_scheme_bonus_value')|0=+] #weak (Hodnocení se nesčítá)#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_noble_magistrate_modifier: "Úřad šlechtického magistráta" # todo: NEW TRANSLATION
 gdp_noble_magistrate_modifier_desc: "Tato postava získala nižší šlechtický magistrátní úřad, aby mohla sloužit republice čestně a poctivě v oficiální funkci." # todo: NEW TRANSLATION
 gdp_republic_plaza_prestige_modifier: "Prestižní náměstí" # todo: NEW TRANSLATION
 gdp_republic_plaza_prestige_modifier_desc: "Tato postava přispěla na Velké náměstí, čímž získala prestiž a přízeň veřejnosti." # todo: NEW TRANSLATION
 gdp_republic_trader_competitiveness_modifier: "Zdatný obchodník" # todo: NEW TRANSLATION
 gdp_republic_trader_competitiveness_modifier_desc: "Tato postava je tvrdým obchodníkem, který neustoupí — protistranu vždy přiměje povolit." # todo: NEW TRANSLATION
 gdp_republic_plaza_chancery_modifier: "Dřevo z kanceláře" # todo: NEW TRANSLATION
 gdp_republic_plaza_chancery_modifier_desc: "Tato postava vybavila archiv a zbyli jí tesaři, lisy i kvalitní dřevo, které teď využívá ve svém domově." # todo: NEW TRANSLATION
 gdp_republic_plaza_scriptorium_modifier: "Dobře zásobené skriptorium" # todo: NEW TRANSLATION
 gdp_republic_plaza_scriptorium_modifier_desc: "Tato postava vlastní velké zásoby kvalitních inkoustů a pigmentů, neboť jimi zásobovala písaře komuny." # todo: NEW TRANSLATION
 gdp_republic_plaza_magistracy_modifier: "Úřední oděv" # todo: NEW TRANSLATION
 gdp_republic_plaza_magistracy_modifier_desc: "Tato postava na vlastní náklady obstarala oděvy městským magistrátům, a tak je všude, kde zazní zákon, náležitě vítána." # todo: NEW TRANSLATION
 gdp_republic_plaza_popular_favor_modifier: "Oblíbená tvář" # todo: NEW TRANSLATION
 gdp_republic_plaza_popular_favor_modifier_desc: "Tato postava mistrně ovládá umění získávat si přízeň davu a dbá na to, aby všichni věděli, čí peníze zaplatily za jejich pohodlí." # todo: NEW TRANSLATION
 gdp_republic_plaza_trade_capacity_modifier: "Vyměřeno a zapečetěno" # todo: NEW TRANSLATION
 gdp_republic_plaza_trade_capacity_modifier_desc: "Zboží této postavy prochází přes váhu bez námitek a s každou sezonou se ho vymění větší množství." # todo: NEW TRANSLATION
 gdp_republic_plaza_expertise_modifier: "Obchodník na náměstí" # todo: NEW TRANSLATION
 gdp_republic_plaza_expertise_modifier_desc: "Tato postava má vliv na mnoho městských obchodníků a získává tak poznatky o zboží a obchodu, jejichž nabytí by jinak trvalo celé desítky let." # todo: NEW TRANSLATION
 gdp_republic_plaza_estate_income_modifier: "Veřejný věřitel" # todo: NEW TRANSLATION
 gdp_republic_plaza_estate_income_modifier_desc: "Komuna této postavě dluží peníze a úroky přicházejí do jejího obchodního domu včas." # todo: NEW TRANSLATION
 gdp_republic_plaza_physician_modifier: "Přízeň lékaře" # todo: NEW TRANSLATION
 gdp_republic_plaza_physician_modifier_desc: "Tato postava zaplatila za zásoby bylin a léčiv pro městské špitály, aby je její domácnost měla vždy dostatek." # todo: NEW TRANSLATION
 gdp_republic_plaza_hired_swords_modifier: "Plátce žoldnéřských rot" # todo: NEW TRANSLATION
 gdp_republic_plaza_hired_swords_modifier_desc: "Tato postava dbá na to, aby žoldnéřské roty dostávaly svůj žold včas a v plné výši. A ony si pamatují, z které měšce peníze pocházejí." # todo: NEW TRANSLATION
 gdp_republic_plaza_organized_worker_modifier: "Organizátor pracovních sil" # todo: NEW TRANSLATION
 gdp_republic_plaza_organized_worker_modifier_desc: "Tato postava zorganizovala pracovní síly pro rozsáhlé stavební projekty a získala tak mnoho zkušeností s náročnou logistikou, kterou vyžadují." # todo: NEW TRANSLATION
 gdp_republic_civic_works_labor_modifier: "Organizovaná práce" # todo: NEW TRANSLATION
 gdp_republic_civic_works_labor_modifier_desc: "Republika shromáždila a zorganizovala dělníky, čímž urychlila výstavbu v hlavním sídle." # todo: NEW TRANSLATION
 gdp_republic_civic_works_materials_modifier: "Zajištěné stavební materiály" # todo: NEW TRANSLATION
 gdp_republic_civic_works_materials_modifier_desc: "Koordinované zajišťování a hromadění stavebních materiálů snížilo náklady na výstavbu v celém hlavním sídle." # todo: NEW TRANSLATION
 gdp_republic_civic_works_amenities_modifier: "Veřejná vybavenost" # todo: NEW TRANSLATION
 gdp_republic_civic_works_amenities_modifier_desc: "Nové lázně, kašny a místa k setkávání zlepšily náladu obyvatel města." # todo: NEW TRANSLATION
 gdp_republic_civic_works_market_modifier: "Rozšířený trh" # todo: NEW TRANSLATION
 gdp_republic_civic_works_market_modifier_desc: "Větší a lépe organizovaná tržní čtvrť přilákala více obchodníků a zlepšila obchodní podmínky v hlavním sídle." # todo: NEW TRANSLATION
 gdp_republic_civic_works_guilds_modifier: "Podpora řemeslných cechů" # todo: NEW TRANSLATION
 gdp_republic_civic_works_guilds_modifier_desc: "Podporované cechy přivedly do hlavního sídla zkušené řemeslníky, podnítily investice a postupně zlepšují zdejší podmínky." # todo: NEW TRANSLATION
 gdp_republic_civic_works_labor_character_modifier: "Síť pracovních sil" # todo: NEW TRANSLATION
 gdp_republic_civic_works_labor_character_modifier_desc: "Organizace pracovních sil pro veřejné stavby poskytla tomuto vládci kontakty na kvalifikované dělníky a dodavatele po celém hlavním sídle.\n[Concept('patrician_rating','Hodnocení patricije')|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_republic_civic_works_materials_character_modifier: "Zásobovací síť" # todo: NEW TRANSLATION
 gdp_republic_civic_works_materials_character_modifier_desc: "Zajišťování materiálů pro veřejné stavby otevřelo spolehlivé cesty k získání kamene, dřeva a zásob za výhodné ceny.\n[Concept('patrician_rating','Hodnocení patricije')|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_republic_civic_works_amenities_character_modifier: "Podporovatel veřejných staveb" # todo: NEW TRANSLATION
 gdp_republic_civic_works_amenities_character_modifier_desc: "Financování veřejné vybavenosti města přineslo tomuto vládci značnou přízeň obyvatel hlavního sídla.\n[Concept('patrician_rating','Hodnocení patricije')|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_republic_civic_works_market_character_modifier: "Obchodní kontakty" # todo: NEW TRANSLATION
 gdp_republic_civic_works_market_character_modifier_desc: "Rozšíření tržní čtvrti hlavního sídla zprostředkovalo tomuto vládci kontakty s obchodníky a kupci, kteří na prokázanou laskavost nezapomínají.\n[Concept('patrician_rating','Hodnocení patricije')|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_republic_civic_works_guilds_character_modifier: "Podporovatel cechů" # todo: NEW TRANSLATION
 gdp_republic_civic_works_guilds_character_modifier_desc: "Podpora řemeslných cechů vytvořila trvalá pouta s městskými řemeslníky, jejichž vděčnost prospívá postavení tohoto vládce.\n[Concept('patrician_rating','Hodnocení patricije')|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_republic_civic_works_settlement_modifier: "Rozšiřování osídlení" # todo: NEW TRANSLATION
 gdp_republic_civic_works_settlement_modifier_desc: "Investice do městské infrastruktury hlavního sídla vytvořily prostor pro více lidí a ti už přicházejí." # todo: NEW TRANSLATION
 gdp_republic_civic_works_settlement_character_modifier: "Městský investor" # todo: NEW TRANSLATION
 gdp_republic_civic_works_settlement_character_modifier_desc: "Financování rozšiřování hlavního sídla republiky dalo tomuto vládci vliv na to, jak se město rozrůstá.\n[Concept('patrician_rating','Hodnocení patricije')|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_republic_civic_works_order_modifier: "Občanský pořádek" # todo: NEW TRANSLATION
 gdp_republic_civic_works_order_modifier_desc: "Investice do stráží a městské infrastruktury učinily hlavní sídlo spořádanějším a usnadnily jeho správu." # todo: NEW TRANSLATION
 gdp_republic_civic_works_order_character_modifier: "Občanská autorita" # todo: NEW TRANSLATION
 gdp_republic_civic_works_order_character_modifier_desc: "Financování udržování pořádku v hlavním sídle vyneslo tomuto vládci pověst zastánce stability a rozumné správy.\n[Concept('patrician_rating','Hodnocení patricije')|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_republic_civic_works_school_modifier: "Veřejné školy" # todo: NEW TRANSLATION
 gdp_republic_civic_works_school_modifier_desc: "Toto hrabství získalo značné finanční prostředky na výstavbu veřejných škol." # todo: NEW TRANSLATION
 gdp_republic_civic_works_school_character_modifier: "Podporovatel škol" # todo: NEW TRANSLATION
 gdp_republic_civic_works_school_character_modifier_desc: "Tato postava financovala výstavbu škol v hlavním sídle a poskytla tak mladým lidem vzdělání a možnost učit se.\n[Concept('patrician_rating','Hodnocení patricije')|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
