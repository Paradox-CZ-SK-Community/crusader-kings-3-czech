 custom_gp_civic_ward: "stavba městského stavebního úřadu, který bude dohlížet na chystané stavby ve městě" # todo: NEW TRANSLATION
 custom_gp_improved_civic_ward: "rozšíření městského stavebního úřadu, které zvýší jeho kapacitu i počet úředníků pověřených vyřizováním úkolů" # todo: NEW TRANSLATION
 custom_gp_league_chapter_house: "zřízení spolkového domu pro pořádání shromáždění spolku a vyřizování jeho záležitostí" # todo: NEW TRANSLATION
 custom_gp_improved_league_chapter_house: "vylepšení spolkového domu, které umožní pohodlnější shromáždění ve jménu diplomacie" # todo: NEW TRANSLATION
