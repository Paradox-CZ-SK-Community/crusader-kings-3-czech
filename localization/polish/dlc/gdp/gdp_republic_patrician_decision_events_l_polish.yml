l_polish:
 city_stroll_prefix: "Procházka městem" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1000.t: "$city_stroll_prefix$: Kdo najde, ten bere" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1000.desc: "Zahnul jsem z hlavní ulice do úzké uličky a narazil na místního podomního obchodníka, který byl zrovna uprostřed rozhovoru:\n\n„... a pak si to nikdo nepřišel vyzvednout.“ [local_character.GetWomanMan] pokrčí rameny směrem ke [Select_CString(local_character.IsFemale,'jejímu','jeho')] společníkovi a ukáže na bedny s [abandoned_trade_good.GetNameNoTooltip|l], které se povalují v uličce.\n\nNikdo se nepřihlásil, že mu náklad patří. Rychle si ho prohlédnu odshora dolů. #EMP Příležitost#!." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1000.a: "Co kdybychom po něm trochu zvýšili poptávku..." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1000.a.flavor: "Bedny s [abandoned_trade_good.GetNameNoTooltip|l] se objeví rozbité a jejich obsah roztříštěný." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1000.b: "„Ó-ho, to je moje, vidíte!“" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1000.c: "„Ach, ztracené [abandoned_trade_good.GetNameNoTooltip|l] [liege_scope.GetTitledFirstNamePossessiveNoTooltip]. Mnohokrát děkuji.“" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1000.d: "Tohle se mě netýká." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1010.t: "$city_stroll_prefix$: Den v zahradě" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1010.desc: "Objevím skrytou oázu, opravdový drahokam v surovém kameni, v malé zahradě ukryté v zákoutích a uličkách [city_location.GetTitle.Custom('CZ_LandedNameNoTier_G')]. Chodníčky už něco pamatují a rostlin tu není mnoho, ale jsou dobře udržované. O tohle místo se někdo pečlivě stará.\n\nVe stínu zeleně odpočívají skupinky šlechticů, ale také obchodníků, prostých lidí a dělníků, kteří si užívají krátkou přestávku od práce.\n\nPomalým krokem procházím zahradou, s lehčí myslí a o něco snesitelnějšími břemeny." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1010.a: "Z téhle zahrady uděláme tu nejlepší v [city_location.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')]!" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1010.b: "Copak je tohle za rostlinku?" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1010.b.poison_plant: "Najdeš zajímavé rostliny" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1010.b.health_plant: "Najdeš blahodárné byliny" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1010.c: "Dovolte mi jen... trochu se uvolnit..." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1010.c.flavor: "Nechám všechno volně plynout. To je ale úleva!" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1010.c.success: "Zůstaneš neodhalen" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1010.c.failure: "Budeš odhalen" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1010.d: "To je nádhera!" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1020.t: "$city_stroll_prefix$: Velké náměstí [city_location.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')]" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1020.intro: "Ať už politika a intriky [city_location.GetCounty.GetTitle.GetAdjective] šlechticů a vládců vypadají jakkoli, život na velkém náměstí pokračuje." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1020.intro.01: "Kuchyně jedou na plné obrátky a nos mi plní lahodná vůně čerstvého [ROOT.Char.Custom('GetLocalStreetFood')]." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1020.intro.02: "Neposlušný osel hýká na svého majitele, který se ho rozzuřeně pokouší osprchovat a smýt z něj vrstvy zaschlého bláta." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1020.intro.03: "Několik postarších měšťanů se prochází kolem a nespokojeně brblá nad cenou chleba a namyšleností dnešní mládeže." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1020.intro.04: "Nad náměstím krouží hejno [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBirdPlural')|l] a hladově pokukuje po místních stáncích s jídlem." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1020.intro.rain: "Je ráno, které se nese ve znamení včerejší bouřky." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1020.desc.maa: "\n\nV dálce si všimnu skupiny vojáků, kteří nejsou zdejší, z [city_location.GetCounty.GetTitle.GetNameNoTierNoTooltip]. Vypadají, jako by sem nepatřili, a ostražitě se rozhlížejí. Z útržků jejich občas vyhrocených rozhovorů zaslechnu, že hledají nového patrona." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1020.desc.trader: "\n\nNa okraji náměstí se drsná postava zasmušile dívá na kolemjdoucí. Když se k [local_character.GetHerHim] přiblížím, zaslechnu nářek nad nedávným ukončením [Select_CString(local_character.IsFemale,'její','jeho')] prestižní obchodní smlouvy s rodem [liege_scope.GetHouse.GetBaseName]. Vážený obchodník, kterému se přestalo dařit?" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1020.desc.physician: "\n\nUprostřed náměstí, na hromadě beden, právě lékař zakončuje přednášku o tělesných tekutinách a o tom, jak snáze vyvážit černou žluč. Nejistě přikývnu na souhlas.$gdp_republic_patrician_decision.1020.outro$" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1020.desc.scheme: "\n\nVe stánku ve stinném koutě náměstí zahlédnu dokonalý [ROOT.Char.Custom('RandomMediumObject')], něco, co mi jistě pomůže s mou intrikou [scheme_to_boost.GetName|l]...$gdp_republic_patrician_decision.1020.outro$" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1020.desc.jewellery: "\n\nRozhlížím se po náměstí a všimnu si něčeho, co zachytilo světlo. Přimhouřím oči a pátrám po zdroji. Na zemi spatřím malý šperk, téměř celý pokrytý hlínou.$gdp_republic_patrician_decision.1020.outro$" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1020.desc.generic: "\n\nNa druhé straně náměstí odvádějí z areálu skupinku zchudlých rolníků. Jedno z malých dětí srdceryvně zakřičí, z hladu a strachu, zatímco přihlížející dělají, co mohou, aby tu ubohou skupinku ignorovali." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1020.outro: "\n\nMůj sluha si nenápadně pročistí [Select_CString(ROOT.Char.IsFemale,'její','jeho')] hrdlo a připomene mi, že je čas vrátit se domů a věnovat se dalším povinnostem." # todo: NEW TRANSLATION # todo: GENDER FORM ROOT.Char - over, ci ROOT je postava, ktorej sa text tyka
 gdp_republic_patrician_decision.1020.a: "Měl bych být schopen nakrmit jeden nebo dva hladové krky." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1020.b: "Ti vojáci by se mohli hodit..." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1020.c: "Hmm, další schopný obchodník by se mi vždycky hodil..." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1020.d: "Ten lékař by měl pracovat pro mě." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1020.e: "Nejdřív práce, procházka později." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1020.f: "Jen to očistím..." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1020.g: "Ještě je co vidět a koho poznat!" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1020.g.alternate: "Další den v [GetPlayer.GetCapitalLocation.GetNameNoTooltip]." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1030.t: "$city_stroll_prefix$: Přístav [city_location.GetTitle.Custom('CZ_LandedNameNoTier_G')]" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1030.desc: "Čím blíž jsme k místnímu přístavu, tím silnější je pach ryb a hnijících mořských řas. Všude kolem se zdržují rybáři s rodinami — matkami a malými dětmi — a také hejno toulavých koček. Každý se věnuje svým každodenním povinnostem.\n\nKdyž procházíme kolem, zaslechnu dva rybáře, jak si stěžují: „... nový háky jsme pořídili. Ale s novou sadou sítí bychom toho mohli dělat mnohem víc...“ Jakmile si všimnou mé přítomnosti, zmlknou." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1030.desc.outro: "\n\nZabroukám a přikývnu." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1030.desc.outro.cat: "\n\nZabroukám a přikývnu, zatímco se mi k noze přitulí toulavá kočka a hlasitě přede." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1030.a: "„Možná bych se nechal přesvědčit, abych opatřil nové sítě...“" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1030.a.flavor: "Mohlo by to přinést #EMP čistý#! zisk!" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1030.b: "„Jakou cenu mi nabídnete, když koupím vaše ryby ve velkém?“" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1030.c: "Kočička!" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1030.d: "„To je ale krásný den, že?“" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1040.t: "$city_stroll_prefix$: [ROOT.Char.Custom('GetGreatProjectName')]" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1040.desc: "Při poklidné procházce narazím na nejnovější příspěvek [liege_scope.GetTitledFirstNamePossessive] na velkém náměstí: [ROOT.Char.Custom('GetGreatProjectDescription')].\n\nPředák je ale zjevně v úzkých, protože [local_character.GetSheHe] pořád se dívá na seznam jmen a pečetí a přitom si škrábe [Select_CString(local_character.IsFemale,'její','jeho')] hlavu: „Tento... štědrý příspěvek... na pečeti kousek chybí... kdo jen mohl být odesílatelem, hmm...“\n\nNeoznačený příspěvek na projekt? #EMP Zajímavé.#!" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1040.a: "„To je můj příspěvek! To my jsme ho udělali!“" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1040.a.success: "Přivlastníš si zásluhy za příspěvek" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1040.a.failure: "Budeš odhalen" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1040.b: "„Příspěvek [liege_scope.GetTitledFirstNamePossessiveNoTooltip]! Skvělé!“" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1040.c: "Tohle se mě netýká." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1040.c.flavor: "Jsem si jistý, že na to přijdou." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1040.c.tt: "[THIS.Char.Custom('GetGreatProjectName')] získá [contribution_to_fund.GetName]" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1100.t: "$city_stroll_prefix$: Nezdar hned na začátku" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1100.desc: "Ještě naposledy poklepu na váček, než vyjdu ze své pracovny na procházku krásnými ulicemi [city_location.GetTitle.Custom('CZ_LandedNameNoTier_G')].\n\nČelo mi zlehka narazí do dveří a ozve se tlumené #EMP žuchnutí#!. Ta zatracená věc se ani #EMP nehne#!! Nenabobtnala snad?\n\nRozhlédnu se po místnosti. Okno tu sice je, ale pád by mi jistě zlomil jednu nebo dvě kosti.\n\nZkusím se zamyslet." # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1100.a: "„Haló? Stráže? SLUŽEBNICTVO?!“" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1100.a.flavor: "Ne, stěny se nesvírají. Nesvírají... že ne?" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1100.b: "Pod oknem je spousta měkkého polstrování!" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1100.b.success: "$playdate.3007.a.success$" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1100.b.failure: "$playdate.3007.a.failure$" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1100.c: "Moje tělo prahne po cvičení!" # todo: NEW TRANSLATION
 gdp_republic_patrician_decision.1100.d: "Prostě... se vrátím ke svému stolu." # todo: NEW TRANSLATION
 custom_gp_expand_great_plaza_name: "Rozšíření velkého náměstí" # todo: NEW TRANSLATION
 custom_gp_expand_great_plaza: "samotné rozšíření náměstí" # todo: NEW TRANSLATION
