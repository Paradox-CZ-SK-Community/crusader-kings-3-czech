 gdp_city_stroll_modifier_desc: "Tato postava se pravidelně prochází po městě a díky tomu dobře zná zdejší poměry." # todo: NEW TRANSLATION
 gdp_patrician_city_investments_modifier: "Městský investor" # todo: NEW TRANSLATION
 gdp_patrician_city_investments_modifier_desc: "Tato postava investovala a přispěla dary na zlepšení svého města.\n[Concept('patrician_rating','Hodnocení patricije')|E]: [EmptyScope.ScriptValue('gdp_republic_investor_patrician_rating_bonus_value')|0=+]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_bulk_fish_modifier: "Ryby ve velkém" # todo: NEW TRANSLATION
 gdp_bulk_fish_modifier_desc: "Tato postava zařídila nákup ryb ve velkém za nižší cenu." # todo: NEW TRANSLATION
 gdp_publicly_shamed_modifier: "Veřejně zostuzen" # todo: NEW TRANSLATION
