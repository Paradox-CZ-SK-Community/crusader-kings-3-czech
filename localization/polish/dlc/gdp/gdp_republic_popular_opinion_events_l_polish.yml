l_polish:
 republic_popular_opinion_event.1001.t: "Vařící se kotel" # todo: NEW TRANSLATION
 republic_popular_opinion_event.1001.desc: "V těchto dnech není na ulici zrovna dobrý čas nechat se poznat jako patricij.\n\nKdyž si [relation_01.GetName] všimne mých těkavých pohledů a ustaraného výrazu, zvolá:\n\n„Zatraceně, [ROOT.Char.GetFullName]. Patricijové z [event_location_01.Custom('CZ_LandedName_G')] se neschovávají. Chodí po ulicích jako hrdí občané!“\n\n[relation_01.GetSheHe|U] má pravdu, ale poslední dobou je ve městě napjatá nálada; pod povrchem to vře nespokojeností. Město sužují protesty a rvačky a já si jen dokážu představit, co se děje po setmění." # todo: NEW TRANSLATION
 republic_popular_opinion_event.1001.a: "„Máš pravdu. Musíme chodit s hlavou vztyčenou.“" # todo: NEW TRANSLATION
 republic_popular_opinion_event.1001.b: "„Možná by bylo dobré pořídit si osobního strážce.“" # todo: NEW TRANSLATION
 republic_popular_opinion_event.1001.c: "„Dav nás všechny zabije!“" # todo: NEW TRANSLATION
 republic_popular_opinion_event.1001.d: "„Nebudou mě mít za snadnou kořist.“" # todo: NEW TRANSLATION
 republic_popular_opinion_event.1002.t: "Období nespokojenosti" # todo: NEW TRANSLATION
 republic_popular_opinion_event.1002.desc_1: "Stojím u okna a slyším ozvěnu rozhněvaných hlasů; v [event_location_01.GetName] to vře nespokojeností. Dělníci vyhrožují, že odloží nářadí nebo vyjdou do ulic. Symboly vlády jsou pod rouškou noci rozbíjeny a ničeny.\n\n" # todo: NEW TRANSLATION
 republic_popular_opinion_event.1002.desc_2: "[ROOT.Char.Custom('GetRepublicCapitalControlDesc')]\n\n" # todo: NEW TRANSLATION
 republic_popular_opinion_event.1002.desc_3: "Kam se podívám, všude narážím na zachmuřené tváře, překážky a tlumené urážky." # todo: NEW TRANSLATION
 republic_popular_opinion_event.1002.desc_control_firm: "Davům nezbývá než symbolicky vzdorovat, protože vláda brutálně a účinně potlačuje sebemenší náznak nezákonného shromáždění." # todo: NEW TRANSLATION
 republic_popular_opinion_event.1002.desc_control_strained: "Díky [ROOT.Char.GetFaith.HighGodName] se městské stráži daří nepokoje držet na uzdě. Vůdci jsou denně zatýkáni a dávani do klády. Spolčenci, kteří chtějí využít chaosu, jsou pronásledováni a odhalováni. Zatím se daří udržovat pořádek." # todo: NEW TRANSLATION
 republic_popular_opinion_event.1002.desc_control_slipping: "Navzdory usilovné práci městské stráže agitátoři proklouzávají mezi prsty a ulice sužuje násilí. Scházejí se davy a ne všechny se podaří včas rozehnat. Noc patří gangům a výtržníkům." # todo: NEW TRANSLATION
 republic_popular_opinion_event.1002.desc_control_broken: "Vláda ztratila kontrolu nad ulicemi. Městská stráž se ukrývá v kasárnách a dav obtěžuje patricije přímo na schodech paláce! Šíří se zvěsti o cizích agentech a sabotérech." # todo: NEW TRANSLATION
 republic_popular_opinion_event.1002.a: "Stojím na straně vlády!" # todo: NEW TRANSLATION
 republic_popular_opinion_event.1002.b: "Dám jasně najevo, že stojím na straně lidu." # todo: NEW TRANSLATION
 republic_popular_opinion_event.1002.c: "Nejlepší bude držet se při zemi." # todo: NEW TRANSLATION
 republic_popular_opinion_event.1003.t: "Slavnostní nálada" # todo: NEW TRANSLATION
 republic_popular_opinion_event.1003.desc: "V ruchu a shonu tržiště [event_location_01.GetTitle.GetNamePossessive] se dávám do řeči s občanem jménem [craftsman_character.GetName] a [Select_CString(craftsman_character.IsFemale,'její','jeho')] vtipy o [Select_CString(craftsman_character.IsFemale,'jejímu','jeho')] oslu mě rozesmějí tak, že se lámu v pase.\n\nPoslední dobou mám pocit, jako by město bylo jedna velká rodina; mluvit s cizími lidmi je snazší a všichni mají dobrou náladu, navzdory náročnému životu. Osel radostně hýká a šťouchá mě hlavou.\n\n„Shromáždění odvádí dobrou práci, co?“ říká [craftsman_character.GetFirstNameNoTooltip] a škrábe [Select_CString(craftsman_character.IsFemale,'jejího','jeho')] osla za uchem. „Co kdybys to oslavil — uspořádal hostinu? Cechy by jistě přispěly, aby udělaly dobrý dojem a ukázaly své uznání.“" # todo: NEW TRANSLATION
 republic_popular_opinion_event.1003.a: "„To je skvělý nápad!“" # todo: NEW TRANSLATION
 republic_popular_opinion_event.1003.b: "„Říkáš, že to bude zadarmo?“" # todo: NEW TRANSLATION
 republic_popular_opinion_event.1003.c: "„Raději bych tě lépe poznal.“" # todo: NEW TRANSLATION
 republic_popular_opinion_event.1003.tt: "Tvoje příští [feast|E] [Concept('activity','aktivity')|E] bude #P zdarma. #!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 republic_popular_opinion_event.1004.t: "Ambiciózní nálada" # todo: NEW TRANSLATION
 republic_popular_opinion_event.1004.desc: "S [relation_01.GetName] popíjíme [ROOT.Char.Custom('RegionalDrink')] na náměstí nedaleko mého domova a líně pozorujeme ruch a pilné občany, kteří se věnují svým každodenním záležitostem. [relation_01.GetName] si po doušku [Select_CString(relation_01.IsFemale,'její','jeho')] nápoje spokojeně povzdechne.\n\n„Povím ti, [ROOT.Char.GetFullName]: je čas kovát železo, dokud je žhavé. Říkám, pusťme se do něčeho ambiciózního! Když má město tak dobrou náladu, zdá se možné úplně všechno.“ [relation_01.GetSheHe|U] pozvedne [Select_CString(relation_01.IsFemale,'její','jeho')] číši a usměje se. „Připijme si na nové příležitosti a spoustu peněz!“\n\nUsměju se a pozvednu svůj pohár." # todo: NEW TRANSLATION
 republic_popular_opinion_event.1004.a: "„Na dobrodružství v dalekých krajích!“" # todo: NEW TRANSLATION
 republic_popular_opinion_event.1004.b: "„Na novou lásku a romantiku!“" # todo: NEW TRANSLATION
 republic_popular_opinion_event.1004.c: "„Na slávu a věhlas!“" # todo: NEW TRANSLATION
 republic_popular_opinion_event.1004.d: "„Na rodinu a přátele!“" # todo: NEW TRANSLATION
