 gdp_popular_opinion_mild_neg_prosperity: "Ekonomická stagnace" # todo: NEW TRANSLATION
 gdp_popular_opinion_mild_neg_prosperity_desc: "Nespokojenost mezi lidmi způsobila, že se občané zdráhají investovat do města, čímž zpomalují jeho dlouhodobý růst." # todo: NEW TRANSLATION
 gdp_popular_opinion_mild_neg_taxes: "Vyhýbání se daním" # todo: NEW TRANSLATION
 gdp_popular_opinion_mild_neg_taxes_desc: "Rozhořčení občané hledají způsoby, jak se vyhnout placení svých povinností, což snižuje příjmy ze všech městských čtvrtí." # todo: NEW TRANSLATION
 gdp_popular_opinion_mild_neg_construction: "Zpoždění ve výstavbě" # todo: NEW TRANSLATION
 gdp_popular_opinion_mild_neg_construction_desc: "Dělníci a řemeslníci spolupracují méně ochotně než obvykle, což zvyšuje náklady a zpomaluje výstavbu." # todo: NEW TRANSLATION
 gdp_popular_opinion_mild_neg_defense: "Nedostatečně obsazené hradby" # todo: NEW TRANSLATION
 gdp_popular_opinion_mild_neg_defense_desc: "Občané nechtějí sloužit v městské domobraně, a tak městské obránce sužuje nedostatek mužů." # todo: NEW TRANSLATION
 gdp_popular_opinion_severe_neg_prosperity: "Ekonomický kolaps" # todo: NEW TRANSLATION
 gdp_popular_opinion_severe_neg_prosperity_desc: "Hluboké nepokoje rozvrátily městské hospodářství. Růst se zastavil a dosavadní prosperita začíná upadat." # todo: NEW TRANSLATION
 gdp_popular_opinion_severe_neg_taxes: "Daňová vzpoura" # todo: NEW TRANSLATION
 gdp_popular_opinion_severe_neg_taxes_desc: "Otevřený odpor vůči daním se rozšířil do všech městských čtvrtí a prudce snížil veřejné příjmy." # todo: NEW TRANSLATION
 gdp_popular_opinion_severe_neg_construction: "Stávky stavitelů" # todo: NEW TRANSLATION
 gdp_popular_opinion_severe_neg_construction_desc: "Cechy a dělníci odmítají pracovat. Výstavba je nyní nesmírně pomalá a nákladná." # todo: NEW TRANSLATION
 gdp_popular_opinion_severe_neg_defense: "Opouštějící posádka" # todo: NEW TRANSLATION
 gdp_popular_opinion_severe_neg_defense_desc: "Vojáci opustili svá stanoviště nebo odmítli sloužit. Městské hradby zůstávají téměř bez obránců." # todo: NEW TRANSLATION
 gdp_popular_opinion_mild_pos_prosperity: "Občanské investice" # todo: NEW TRANSLATION
 gdp_popular_opinion_mild_pos_prosperity_desc: "Sebevědomí občané vkládají svou přízeň do budoucnosti města a mírně tak podporují jeho dlouhodobou prosperitu." # todo: NEW TRANSLATION
 gdp_popular_opinion_mild_pos_taxes: "Ochotní poplatníci" # todo: NEW TRANSLATION
 gdp_popular_opinion_mild_pos_taxes_desc: "Občané platí daně bez reptání, a tak každá městská čtvrť přináší vyšší příjmy." # todo: NEW TRANSLATION
 gdp_popular_opinion_mild_pos_construction: "Občanské nadšení" # todo: NEW TRANSLATION
 gdp_popular_opinion_mild_pos_construction_desc: "Cechy a řemeslníci dychtí přispět k rozvoji města, čímž snižují náklady i dobu potřebnou k novým stavbám." # todo: NEW TRANSLATION
 gdp_popular_opinion_strong_pos_prosperity: "Zlatý věk prosperity" # todo: NEW TRANSLATION
 gdp_popular_opinion_strong_pos_prosperity_desc: "Město překypuje optimismem. Občané i obchodníci bez zábran investují, což pohání silný a trvalý růst." # todo: NEW TRANSLATION
 gdp_popular_opinion_strong_pos_taxes: "Pokladnice přetékají" # todo: NEW TRANSLATION
 gdp_popular_opinion_strong_pos_taxes_desc: "Hrdost lidí na jejich město se přímo promítá do ochotného placení daní ve všech městských čtvrtích." # todo: NEW TRANSLATION
 gdp_popular_opinion_strong_pos_construction: "Mistrovská výstavba" # todo: NEW TRANSLATION
 gdp_popular_opinion_strong_pos_construction_desc: "Nejlepší umělci a řemeslníci soupeří o čest pracovat ve městě, čímž snižují náklady a urychlují každý projekt." # todo: NEW TRANSLATION
 gdp_popular_opinion_mild_neg_sell_price: "Obezřetní prodejci" # todo: NEW TRANSLATION
 gdp_popular_opinion_mild_neg_sell_price_desc: "Nejistota ve městě způsobila, že obchodníci jsou obezřetní, zadržují zboží a snižují ceny na celém trhu." # todo: NEW TRANSLATION
 gdp_popular_opinion_mild_neg_capacity: "Nejistota na trhu" # todo: NEW TRANSLATION
 gdp_popular_opinion_mild_neg_capacity_desc: "Klesající důvěra přiměla některé obchodníky omezit svou činnost, čímž se snižuje kapacita trhu." # todo: NEW TRANSLATION
 gdp_popular_opinion_severe_neg_sell_price: "Panika na trhu" # todo: NEW TRANSLATION
 gdp_popular_opinion_severe_neg_sell_price_desc: "Krize v ulicích prudce srazila ceny, protože se prodejci snaží zbavit zboží na hroutícím se trhu." # todo: NEW TRANSLATION
 gdp_popular_opinion_severe_neg_capacity: "Odchod obchodníků" # todo: NEW TRANSLATION
 gdp_popular_opinion_severe_neg_capacity_desc: "Významní obchodníci město zcela opouštějí a obchodní trh se tak výrazně zmenšuje." # todo: NEW TRANSLATION
 gdp_popular_opinion_mild_pos_sell_price: "Sebevědomí prodejci" # todo: NEW TRANSLATION
 gdp_popular_opinion_mild_pos_sell_price_desc: "Dobrá nálada ve městě posílila sebevědomí prodejců a mírně zvýšila ceny na celém trhu." # todo: NEW TRANSLATION
 gdp_popular_opinion_mild_pos_capacity: "Rostoucí trh" # todo: NEW TRANSLATION
 gdp_popular_opinion_mild_pos_capacity_desc: "Optimismus láká do města nové obchodníky a kupce a mírně tak rozšiřuje kapacitu trhu." # todo: NEW TRANSLATION
 gdp_popular_opinion_strong_pos_sell_price: "Obchodní boom" # todo: NEW TRANSLATION
 gdp_popular_opinion_strong_pos_sell_price_desc: "Mimořádná hrdost na město učinila z jeho trhu synonymum kvality, takže lze za veškeré zboží požadovat vyšší ceny." # todo: NEW TRANSLATION
 gdp_popular_opinion_strong_pos_capacity: "Kvetoucí trh" # todo: NEW TRANSLATION
 gdp_popular_opinion_strong_pos_capacity_desc: "Pověst města láká obchodníky zdaleka i zblízka a výrazně rozšiřuje jeho obchodní kapacitu." # todo: NEW TRANSLATION
