l_polish:
 gdp_republic_unrest.0001.t: "Povstání v hlavním městě: Stížnosti" # todo: NEW TRANSLATION
 gdp_republic_unrest.0001.desc: "Na nádvoří se shromáždila skupina dělníků a cechovních tovaryšů. Jeden z nich předstoupí. „Můj [ROOT.Char.GetLadyLord], daně z nás dělají žebráky…“\n\nTohle už jsem slyšel tolikrát. Nejsou první ani poslední, kdo mi s těmito stížnostmi klepe na dveře." # todo: NEW TRANSLATION
 gdp_republic_unrest.0001.a: "Stráže! Zbavte mě těch… lidí." # todo: NEW TRANSLATION
 gdp_republic_unrest.0001.b: "S rolníky vyjednávat nebudu." # todo: NEW TRANSLATION
 gdp_republic_unrest.0001.b.success: "Rozejdou se bez dalších problémů" # todo: NEW TRANSLATION
 gdp_republic_unrest.0001.b.success.toast: "$gdp_republic_unrest.0001.b.success$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0001.b.fail: "Odmítnutí je rozzuří" # todo: NEW TRANSLATION
 gdp_republic_unrest.0001.b.fail.toast: "$gdp_republic_unrest.0001.b.fail$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0001.c: "Ať to vyřeší rada." # todo: NEW TRANSLATION
 gdp_republic_unrest.0001.c.success: "Prozatím se je podaří přesvědčit" # todo: NEW TRANSLATION
 gdp_republic_unrest.0001.c.success.toast: "$gdp_republic_unrest.0001.c.success$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0001.c.fail: "Prohlédnou zdržovací taktiku" # todo: NEW TRANSLATION
 gdp_republic_unrest.0001.c.fail.toast: "$gdp_republic_unrest.0001.c.fail$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0001.d: "Tentokrát jim ustoupím." # todo: NEW TRANSLATION
 gdp_republic_unrest.0011.t: "Povstání v hlavním městě: Chladné přijetí" # todo: NEW TRANSLATION
 gdp_republic_unrest.0011.desc: "Když procházím tržištěm, slyším obvyklý hlasitý hovor, ale něco mi připadá jinak než obvykle. Stánky ztichnou, stejně jako lidé, kteří se na mě jen nepříjemně dívají.\n\nPo těchto ulicích chodím už léta a nikdy předtím to takhle nevypadalo." # todo: NEW TRANSLATION
 gdp_republic_unrest.0011.a: "Určitě se mi to jen zdá." # todo: NEW TRANSLATION
 gdp_republic_unrest.0011.b: "Pošlete někoho, ať vypátrá ty zvěsti." # todo: NEW TRANSLATION
 gdp_republic_unrest.0011.b.success: "Moji lidé vypátrají jejich zdroj" # todo: NEW TRANSLATION
 gdp_republic_unrest.0011.b.success.toast: "$gdp_republic_unrest.0011.b.success$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0011.b.fail: "Zvěsti neutichají" # todo: NEW TRANSLATION
 gdp_republic_unrest.0011.b.fail.toast: "$gdp_republic_unrest.0011.b.fail$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0011.c: "Zastavím se a promluvím s lidmi." # todo: NEW TRANSLATION
 gdp_republic_unrest.0011.c.success: "Lidé toto gesto ocení" # todo: NEW TRANSLATION
 gdp_republic_unrest.0011.c.success.toast: "$gdp_republic_unrest.0011.c.success$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0011.c.fail: "Nikdo není ochoten mluvit" # todo: NEW TRANSLATION
 gdp_republic_unrest.0011.c.fail.toast: "$gdp_republic_unrest.0011.c.fail$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0011.d: "Rozdejte jídlo a víno, ať to stojí, co to stojí." # todo: NEW TRANSLATION
 gdp_republic_unrest.0021.t: "Povstání v hlavním městě: Anonymní dopis" # todo: NEW TRANSLATION
 gdp_republic_unrest.0021.desc: "Když dnes ráno dorazím, čeká na mém stole dopis. Není zapečetěný a není na něm uvedeno žádné jméno. Podrobně v něm stojí, oč hůře se [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] vede od chvíle, kdy jsem se stal [ROOT.Char.GetTitleAsName]." # todo: NEW TRANSLATION
 gdp_republic_unrest.0021.a: "Hoďte ho do ohně." # todo: NEW TRANSLATION
 gdp_republic_unrest.0021.b: "Někdo si s tím dal práci. Zjistěte kdo." # todo: NEW TRANSLATION
 gdp_republic_unrest.0021.b.success: "Autor byl odhalen" # todo: NEW TRANSLATION
 gdp_republic_unrest.0021.b.success.toast: "$gdp_republic_unrest.0021.b.success$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0021.b.fail: "Autor zůstává neznámý" # todo: NEW TRANSLATION
 gdp_republic_unrest.0021.b.fail.toast: "$gdp_republic_unrest.0021.b.fail$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0021.c: "Veřejně na něj odpovím." # todo: NEW TRANSLATION
 gdp_republic_unrest.0021.c.success: "Odpověď má příznivý ohlas" # todo: NEW TRANSLATION
 gdp_republic_unrest.0021.c.success.toast: "$gdp_republic_unrest.0021.c.success$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0021.c.fail: "Odpověď se setká s odporem" # todo: NEW TRANSLATION
 gdp_republic_unrest.0021.c.fail.toast: "$gdp_republic_unrest.0021.c.fail$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0101.t: "Povstání v hlavním městě: Náměstí teď patří jim" # todo: NEW TRANSLATION
 gdp_republic_unrest.0101.desc: "„Můj [ROOT.Char.GetLadyLord], někteří měšťané ovládají tržiště… už několik dní.“ Informuje mě jeden z mých strážných. „Zdá se, že jakýsi [demagogue.GetWomanMan] jménem [demagogue.GetFirstName] hlasitě popouzí lidi.“\n\nZa co těm hlupákům vlastně platím, když může být tržiště několik dní zavřené a nikdo mi o tom neřekne?" # todo: NEW TRANSLATION
 gdp_republic_unrest.0101.a: "Už to náměstí vyklidněte!" # todo: NEW TRANSLATION
 gdp_republic_unrest.0101.b: "Zničte tomu demagogovi pověst." # todo: NEW TRANSLATION
 gdp_republic_unrest.0101.b.success: "[demagogue.GetFirstName] ztrácí dobrou pověst" # todo: NEW TRANSLATION
 gdp_republic_unrest.0101.b.success.toast: "$gdp_republic_unrest.0101.b.success$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0101.b.fail: "Mé snahy vyjdou naprázdno" # todo: NEW TRANSLATION
 gdp_republic_unrest.0101.b.fail.toast: "$gdp_republic_unrest.0101.b.fail$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0101.c: "Promluvím si s nimi sám." # todo: NEW TRANSLATION
 gdp_republic_unrest.0101.c.success: "Dav se rozejde" # todo: NEW TRANSLATION
 gdp_republic_unrest.0101.c.success.toast: "$gdp_republic_unrest.0101.c.success$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0101.c.fail: "Čelím hlasitému posměchu" # todo: NEW TRANSLATION
 gdp_republic_unrest.0101.c.fail.toast: "$gdp_republic_unrest.0101.c.fail$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0101.d: "Prostě jim dejte, co chtějí." # todo: NEW TRANSLATION
 gdp_republic_unrest.0111.t: "Povstání v hlavním městě: Uzavřená čtvrť" # todo: NEW TRANSLATION
 gdp_republic_unrest.0111.desc: "Doneslo se ke mně, že [closed_district.GetType.CalcTriggeredName( ROOT.Char.GetCapitalLocation )] přerušila veškeré styky. Odmítají uznat naše výběrčí daní a nechtějí poslouchat naše stráže." # todo: NEW TRANSLATION
 gdp_republic_unrest.0111.a: "Pošlete k výběrčím daní několik strážných." # todo: NEW TRANSLATION
 gdp_republic_unrest.0111.b: "Zkusme si je koupit." # todo: NEW TRANSLATION
 gdp_republic_unrest.0111.b.success: "Dostanou, co chtějí" # todo: NEW TRANSLATION
 gdp_republic_unrest.0111.b.success.toast: "$gdp_republic_unrest.0111.b.success$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0111.b.fail: "Odmítnou vyjednávat" # todo: NEW TRANSLATION
 gdp_republic_unrest.0111.b.fail.toast: "$gdp_republic_unrest.0111.b.fail$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0111.c: "Půjdu si s nimi promluvit sám." # todo: NEW TRANSLATION
 gdp_republic_unrest.0111.c.success: "Poslechnou" # todo: NEW TRANSLATION
 gdp_republic_unrest.0111.c.success.toast: "$gdp_republic_unrest.0111.c.success$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0111.c.fail: "Odmítnou poslouchat" # todo: NEW TRANSLATION
 gdp_republic_unrest.0111.c.fail.toast: "$gdp_republic_unrest.0111.c.fail$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0111.d: "Nakonec je to přejde. Snad." # todo: NEW TRANSLATION
 gdp_republic_unrest.0121.t: "Povstání v hlavním městě: Figurína" # todo: NEW TRANSLATION
 gdp_republic_unrest.0121.desc: "Když procházím ulicemi, zastavím se jako přikovaný. Přede mnou visí na veřejnosti ohyzdná figurína oblečená v něčem, co připomíná mé šaty, a všichni ji mohou vidět. Dav mlčky hledí na ni a potom na mě.\n\n„Jako živý!“ vykřikne někdo zezadu a dav propukne v hlasitý posměch." # todo: NEW TRANSLATION
 gdp_republic_unrest.0121.a: "Sundejte to! HNED!" # todo: NEW TRANSLATION
 gdp_republic_unrest.0121.a.flavor: "Postarám se, aby tu nikdo nemluvil o tom, co viděl." # todo: NEW TRANSLATION
 gdp_republic_unrest.0121.b: "Zjistěte, kdo za tím stojí." # todo: NEW TRANSLATION
 gdp_republic_unrest.0121.b.success: "S organizátory je vypořádáno" # todo: NEW TRANSLATION
 gdp_republic_unrest.0121.b.success.toast: "$gdp_republic_unrest.0121.b.success$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0121.b.fail: "Organizátory se nepodaří vypátrat" # todo: NEW TRANSLATION
 gdp_republic_unrest.0121.b.fail.toast: "$gdp_republic_unrest.0121.b.fail$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0121.c: "Veřejně se k tomu vyjádřím." # todo: NEW TRANSLATION
 gdp_republic_unrest.0121.c.success: "Lidé poslouchají" # todo: NEW TRANSLATION
 gdp_republic_unrest.0121.c.success.toast: "$gdp_republic_unrest.0121.c.success$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0121.c.fail: "Dav se mi vysmívá a bučí" # todo: NEW TRANSLATION
 gdp_republic_unrest.0121.c.fail.toast: "$gdp_republic_unrest.0121.c.fail$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0121.d: "Neodpovídejme na to, jako by to stálo za řeč." # todo: NEW TRANSLATION
 gdp_republic_unrest.0201.t: "Povstání v hlavním městě: Město hoří" # todo: NEW TRANSLATION
 gdp_republic_unrest.0201.desc: "Než ke mně dorazí stráže, spatřím stoupající kouř. „Můj [ROOT.Char.GetLadyLord], demagog jménem [demagogue.GetFirstName] přesvědčil lidi, aby zapálili jednu z městských čtvrtí.“\n\nCo se to děje s mým městem?" # todo: NEW TRANSLATION
 gdp_republic_unrest.0201.a: "Svolejte celou posádku. Udělejte s tím pořádek." # todo: NEW TRANSLATION
 gdp_republic_unrest.0201.b: "Připravte mi koně!" # todo: NEW TRANSLATION
 gdp_republic_unrest.0201.b.success: "Výtržníci se rozprchnou" # todo: NEW TRANSLATION
 gdp_republic_unrest.0201.b.success.toast: "$gdp_republic_unrest.0201.b.success$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0201.b.fail: "Musím uprchnout zpátky do paláce" # todo: NEW TRANSLATION
 gdp_republic_unrest.0201.b.fail.toast: "$gdp_republic_unrest.0201.b.fail$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0201.c: "Sejdu se s nimi na náměstí." # todo: NEW TRANSLATION
 gdp_republic_unrest.0201.c.success: "$gdp_republic_unrest.0201.b.success$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0201.c.success.toast: "$gdp_republic_unrest.0201.c.success$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0201.c.fail: "Dav se obrátí proti mně" # todo: NEW TRANSLATION
 gdp_republic_unrest.0201.c.fail.toast: "$gdp_republic_unrest.0201.c.fail$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0201.d: "Dejte jim celou pokladnici, bude-li třeba." # todo: NEW TRANSLATION
 gdp_republic_unrest.0211.t: "Povstání v hlavním městě: Stávka" # todo: NEW TRANSLATION
 gdp_republic_unrest.0211.desc: "Když procházím tržištěm, stávku si nelze nevšimnout. Nikdo nevyvolává a nenabízí své zboží, stánky jsou prázdné a dílny ztichly.\n\nJe jasné, že se cechy mezi sebou dohodly a všichni jejich dělníci se podle toho řídí." # todo: NEW TRANSLATION
 gdp_republic_unrest.0211.a: "Pozvěte cechmistry k jednání." # todo: NEW TRANSLATION
 gdp_republic_unrest.0211.a.success: "Dohoda byla uzavřena" # todo: NEW TRANSLATION
 gdp_republic_unrest.0211.a.success.toast: "$gdp_republic_unrest.0211.a.success$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0211.a.fail: "Odmítli se dostavit" # todo: NEW TRANSLATION
 gdp_republic_unrest.0211.a.fail.toast: "$gdp_republic_unrest.0211.a.fail$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0211.b: "Tentokrát jim zaplatíme." # todo: NEW TRANSLATION
 gdp_republic_unrest.0211.b.success: "Byla dohodnuta cena" # todo: NEW TRANSLATION
 gdp_republic_unrest.0211.b.success.toast: "$gdp_republic_unrest.0211.b.success$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0211.b.fail: "Odmítli můj kompromis" # todo: NEW TRANSLATION
 gdp_republic_unrest.0211.b.fail.toast: "$gdp_republic_unrest.0211.b.fail$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0211.c: "Ať se vrátí do práce. Ihned." # todo: NEW TRANSLATION
 gdp_republic_unrest.0211.d: "Vyhovte jejich požadavkům." # todo: NEW TRANSLATION
 gdp_republic_unrest.0221.t: "Povstání v hlavním městě: Rukopis" # todo: NEW TRANSLATION
 gdp_republic_unrest.0221.desc: "„Můj [ROOT.Char.GetLadyLord], teď... tohle všude šíří,“ sdělí mi jeden z mých strážných a podává mi rukopis. „Je toho plné město.“\n\nDo nejmenších podrobností mě osobně uráží a obviňuje ze všech možných hříchů." # todo: NEW TRANSLATION
 gdp_republic_unrest.0221.a: "Najděte a potrestejte toho, kdo to napsal." # todo: NEW TRANSLATION
 gdp_republic_unrest.0221.a.success: "Původce byl nalezen a umlčen" # todo: NEW TRANSLATION
 gdp_republic_unrest.0221.a.success.toast: "$gdp_republic_unrest.0221.a.success$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0221.a.fail: "Autor zůstává neznámý" # todo: NEW TRANSLATION
 gdp_republic_unrest.0221.a.fail.toast: "$gdp_republic_unrest.0221.a.fail$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0221.b: "Veřejně to odmítnu." # todo: NEW TRANSLATION
 gdp_republic_unrest.0221.b.success: "Obvinění začínají utichat" # todo: NEW TRANSLATION
 gdp_republic_unrest.0221.b.success.toast: "$gdp_republic_unrest.0221.b.success$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0221.b.fail: "Lidé se mi vysmívají" # todo: NEW TRANSLATION
 gdp_republic_unrest.0221.b.fail.toast: "$gdp_republic_unrest.0221.b.fail$" # todo: NEW TRANSLATION
 gdp_republic_unrest.0221.c: "Kupte všechny výtisky." # todo: NEW TRANSLATION
 gdp_republic_unrest.0221.d: "Takové věci samy vyšumí." # todo: NEW TRANSLATION
 gdp_republic_unrest.0301.t: "Povstání v hlavním městě: U bran" # todo: NEW TRANSLATION
 gdp_republic_unrest.0301.desc: "Probudí mě několik strážných se zprávou, že se k nám blíží dav. Když procházím chodbami, vidím, jak jsou prázdné... většina mých strážných mě opustila.\n\nZ okna pozoruji, jak se pomalu blíží, křičí a jásají. Dav si jde pro mě." # todo: NEW TRANSLATION
 gdp_republic_unrest.0301.a: "Je tu jen jeden pravý [ROOT.Char.GetTitleAsNameNoTooltip]. Tak si pro [ROOT.Char.GetHerHim] pojďte." # todo: NEW TRANSLATION
 gdp_republic_unrest.0301.a.success: "Sekám je, dokud nezbývají jen mé třesoucí se ruce a tichý, zakrvácený palác" # todo: NEW TRANSLATION
 gdp_republic_unrest.0301.a.fail: "Dav mě přemůže" # todo: NEW TRANSLATION
 gdp_republic_unrest.0301.b: "Nikdy mě nedostanou živého!" # todo: NEW TRANSLATION
 gdp_republic_unrest.0301.b.success: "Já a mí muži si prosekáme cestu ven" # todo: NEW TRANSLATION
 gdp_republic_unrest.0301.b.fail: "Je jich příliš mnoho" # todo: NEW TRANSLATION
 gdp_republic_unrest.0301.c: "Vyjděte ven bránou pro služebnictvo." # todo: NEW TRANSLATION
 gdp_republic_unrest.0301.c.success: "Podaří se mi nepozorovaně uniknout" # todo: NEW TRANSLATION
 gdp_republic_unrest.0301.c.fail: "Chytili mě" # todo: NEW TRANSLATION
 gdp_republic_unrest.0301.d: "Má vláda skončila." # todo: NEW TRANSLATION
 gdp_republic_unrest.0301.d.flavor: "Přijdu k oknu a oznámím, že se vzdávám vlády. Pak vyjdu beze zbraně a budu se modlit, aby mě nechali naživu." # todo: NEW TRANSLATION
 gdp_republic_unrest.0302.t: "Povstání v hlavním městě: Velké ticho" # todo: NEW TRANSLATION
 gdp_republic_unrest.0302.desc: "V paláci teď panuje ticho.\n\nTěla nikdo neodklidil a brány jsou stále otevřené, kudy uprchli poslední vzbouřenci. Ruce se mi už většinou přestaly třást.\n\nPořád jsem tady." # todo: NEW TRANSLATION
 gdp_republic_unrest.0302.a: "Já... ještě stojím?" # todo: NEW TRANSLATION
 gdp_republic_unrest.0303.t: "Povstání v hlavním městě: Nové jméno, nový život" # todo: NEW TRANSLATION
 gdp_republic_unrest.0303.desc: "Jsem naživu.\n\nMěsto je teď za mnou a na téhle ulici nikdo neví, kdo jsem. Titul je pryč, palác je pryč a všechno, co mě po léta utvářelo, je pryč.\n\nA přesto jsem přežil, a to musí něco znamenat. Kam teď půjdu?" # todo: NEW TRANSLATION
 gdp_republic_unrest.0303.a: "Vydej se do [destination_a.Custom('CZ_LandedNameNoTier_G')]. Čeká mě nový začátek." # todo: NEW TRANSLATION
 gdp_republic_unrest.0303.a.tt: "Cestuji do [destination_a.Custom('CZ_LandedNameNoTier_G')] a přesunu tam svůj domicil" # todo: NEW TRANSLATION
 gdp_republic_unrest.0303.b: "[destination_b.Custom('CZ_LandedNameNoTier_G')] je dost daleko. Tam se můžu znovu postavit na nohy." # todo: NEW TRANSLATION
 gdp_republic_unrest.0303.b.tt: "Cestuji do [destination_b.Custom('CZ_LandedNameNoTier_G')] a přesunu tam svůj domicil" # todo: NEW TRANSLATION
 gdp_republic_unrest.0303.c: "Někam, kde nikdo nezná mé jméno. [destination_c.Custom('CZ_LandedNameNoTier_G')] bude stačit." # todo: NEW TRANSLATION
 gdp_republic_unrest.0303.c.tt: "Cestuji do [destination_c.Custom('CZ_LandedNameNoTier_G')] a přesunu tam svůj domicil" # todo: NEW TRANSLATION
 gdp_republic_unrest.0303.d: "Nemám kam jinam jít. Zůstanu a budu užitečný." # todo: NEW TRANSLATION
 gdp_republic_unrest.0303.tt: "Vráceny všechny [Concept('domicile_buildings','budovy domicilu')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_republic_unrest.0304.t: "[old_doge.GetTitleAsNameNoTooltip] padl" # todo: NEW TRANSLATION
 gdp_republic_unrest.0304.desc: "[old_doge.GetFirstName] je mrtvý. [old_doge.GetHeShe] padl během povstání a v paláci zavládlo ticho.\n\nCo bude dál, to se teprve uvidí." # todo: NEW TRANSLATION
 gdp_republic_unrest.0304.a: "Tohle všechno mění." # todo: NEW TRANSLATION
 gdp_republic_unrest.0305.t: "[old_doge.GetTitleAsNameNoTooltip] zmizel" # todo: NEW TRANSLATION
 gdp_republic_unrest.0305.desc: "[old_doge.GetFirstName] je pryč. Žádné tělo, žádné rozloučení, [old_doge.GetHeShe] prostě v noci zmizel, zatímco dav čekal u bran.\n\nCo bude dál, to se teprve uvidí." # todo: NEW TRANSLATION
 gdp_republic_unrest.0305.a: "Tohle všechno mění." # todo: NEW TRANSLATION
 gdp_republic_unrest.0306.t: "Povstání v hlavním městě: Nové město, nový život" # todo: NEW TRANSLATION
 gdp_republic_unrest.0306.desc: "Cesta za mnou je dlouhá a snažím se neohlížet.\n\nTady zatím nikdo nezná mé jméno. Trhy jsou mi cizí a tváře ještě cizejší. Ale dá se tu vydělat, uzavřít spojenectví a znovu vybudovat život z toho mála, co mi zbylo." # todo: NEW TRANSLATION
 gdp_republic_unrest.0306.a: "Je čas pustit se do práce." # todo: NEW TRANSLATION
 gdp_republic_unrest.0311.t: "Povstání v hlavním městě: Vrah na náměstí" # todo: NEW TRANSLATION
 gdp_republic_unrest.0311.desc: "Když procházím tržištěm, dav se přede mnou rozestoupí. Hlučné hovory rázem utichnou. Náhle spatřím postavu, která se ke mně řítí s tasenou čepelí.\n\nMoji strážní jsou příliš daleko, aby mi pomohli, a na reakci mám jen okamžik." # todo: NEW TRANSLATION
 gdp_republic_unrest.0311.a: "Kde mám čepel?!" # todo: NEW TRANSLATION
 gdp_republic_unrest.0311.a.success: "Podaří se mi včas ubránit" # todo: NEW TRANSLATION
 gdp_republic_unrest.0311.a.fail: "[assassin.GetSheHe|U] se ke mně dostane dřív než moji strážní" # todo: NEW TRANSLATION
 gdp_republic_unrest.0311.b: "Musím odsud pryč. Hned." # todo: NEW TRANSLATION
 gdp_republic_unrest.0311.b.success: "Podaří se mi vrahovi uniknout" # todo: NEW TRANSLATION
 gdp_republic_unrest.0311.b.fail: "Není kam utéct" # todo: NEW TRANSLATION
 gdp_republic_unrest.0312.t: "Povstání v hlavním městě: Stále na nohou" # todo: NEW TRANSLATION
 gdp_republic_unrest.0312.desc: "Dav se v nastalém zmatku rozprchl a já zjišťuji, že jsem nějakým zázrakem stále naživu.\n\nDívám se na mrtvé tělo vraha poté, co ho strážní dostihli a vypořádali se s [assassin.GetHerHim]. [assassin.GetSheHe|U] vypadá jako kterýkoli řemeslník ve městě.\n\nKde jsem v bezpečí, když se mě o život pokoušejí i obyčejní občané?" # todo: NEW TRANSLATION
 gdp_republic_unrest.0312.a: "Já... musím domů." # todo: NEW TRANSLATION
 gdp_republic_unrest.0321.t: "Povstání v hlavním městě: Krev za krev" # todo: NEW TRANSLATION
 gdp_republic_unrest.0321.desc: "Pozdě v noci je do mé pracovny uveden posel a podává mi dopis.\n\nNěkolik výtržníků ve městě zajalo [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))] [heir.GetFirstName] a jestli do rána nezmizím, pošlou tělo [Select_CString(heir.IsFemale,'jejího','jeho')] zpátky do mého sídla." # todo: NEW TRANSLATION
 gdp_republic_unrest.0321.rival: "Ať si [heir.GetHerHim] nechají." # todo: NEW TRANSLATION
 gdp_republic_unrest.0321.a: "Zmobilizujte stráž. Přiveďte [heir.GetHerHim] zpět." # todo: NEW TRANSLATION
 gdp_republic_unrest.0321.heir_survives: "[heir.Custom('CZ_ShortUIName_G')|U] přežije" # todo: NEW TRANSLATION
 gdp_republic_unrest.0321.a.success: "Moji muži [heir.GetHerHim] včas zachrání" # todo: NEW TRANSLATION
 gdp_republic_unrest.0321.a.fail: "Přijdou příliš pozdě" # todo: NEW TRANSLATION
 gdp_republic_unrest.0321.b: "Zjistěte, kde [heir.GetHerHim] drží." # todo: NEW TRANSLATION
 gdp_republic_unrest.0321.b.success: "Vypátrají [heir.GetHerHim]" # todo: NEW TRANSLATION
 gdp_republic_unrest.0321.b.fail: "[heir.GetSheHe|U] se nedá najít" # todo: NEW TRANSLATION
 gdp_republic_unrest.0321.c: "Všechny mé peníze. Jen mi [heir.GetHerHim] vraťte." # todo: NEW TRANSLATION
 gdp_republic_unrest.0321.d: "Titul nic neznamená bez [heir.GetFirstNameNoTooltip]." # todo: NEW TRANSLATION
 gdp_republic_unrest.0321.d.flavor: "Jestli to zachrání [heir.GetHerHim], stojí to za tu cenu." # todo: NEW TRANSLATION
 gdp_republic_unrest.0322.t: "Povstání v hlavním městě: V bezpečí" # todo: NEW TRANSLATION
 gdp_republic_unrest.0322.desc: "[heir.GetFirstNameNoTooltip] vchází do mé pracovny a na tváři má nejistý úsměv. [heir.GetSheHe|U] je v pořádku, [heir.GetSheHe] přežil. Na tom teď záleží nejvíc.\n\nMusím zajistit, aby se to už neopakovalo." # todo: NEW TRANSLATION
 gdp_republic_unrest.0322.desc.rival: "Do mého pokoje přichází služebník se zprávou. [heir.GetFirstNameNoTooltip] je zpátky.\n\nDobře, nástupnictví je prozatím zajištěno. Musím zajistit, aby se to už neopakovalo." # todo: NEW TRANSLATION
 gdp_republic_unrest.0322.a: "Ach, ty jsi zpátky!" # todo: NEW TRANSLATION
 gdp_republic_unrest.0322.a.rival: "Dobře. Teď se můžeme vrátit k práci." # todo: NEW TRANSLATION
 gdp_republic_unrest.0323.t: "Povstání v hlavním městě: Příliš pozdě" # todo: NEW TRANSLATION
 gdp_republic_unrest.0323.desc: "Na bránu někdo zaklepe až po setmění. Venku slyším hlasy, pak nastane ticho.\n\nKdyž dorazím na nádvoří, už to vím. [heir.GetFirstNameNoTooltip] tam leží na kamenech. Dav poslal domů to, co z [heir.GetHerHim] zbylo." # todo: NEW TRANSLATION
 gdp_republic_unrest.0323.desc.rival: "Na bránu někdo zaklepe až po setmění. Když dorazím na nádvoří, už to vím.\n\n[heir.GetFirstNameNoTooltip] tam leží na kamenech. Dav poslal domů to, co z [heir.GetHerHim] zbylo. Dlouho tam stojím a dívám se na ostatky svého dědice." # todo: NEW TRANSLATION
 gdp_republic_unrest.0323.a.child: "Podívej, co provedli mému [heir.Custom('GirlBoy')]..." # todo: NEW TRANSLATION
 gdp_republic_unrest.0323.a: "Co ti to udělali, [heir.Custom('CZ_TitledFirstName_V')]?" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [heir.GetFirstName]; navyše [heir.GetTitledFirstName]
