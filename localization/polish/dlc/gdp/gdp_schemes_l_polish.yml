 hostile_takeover_desc_general: "$hostile_takeover$ je [Concept('hostile_scheme','nepřátelská intrika')|E], jejímž cílem je zmocnit se aktiv konkurenční [Concept('merchant','kupec')|E] [Concept('company','společnosti')|E]. Opírá se o [Concept('intrigue','pletichářství')|E] a [Concept('stewardship','správcovství')|E] a lze do ní zapojit [Concept('agents','spolčenci')|E].\n\nÚspěšné $hostile_takeover$ povede ke zničení [Concept('scheme_target','cíli intriky')|E] společnosti a posílí [Concept('competitiveness','konkurenceschopnost')|E] [Concept('scheme_owner','osnovatele intriky')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
