 scheme_critical_moments.8503.t: "[scheme.GetNameNoTooltip]: Neúspěch" # todo: NEW TRANSLATION
 scheme_critical_moments.8503.desc: "Dny strávené slovními přestřelkami s kupci a dlouhé noci šeptáním při prskajících svíčkách nás nepřiblížily k žádným poznatkům o fungování [target.GetPrimaryTitle.GetDefinitiveNamePossessive|l]...\n\nDokumenty, které jsme odnesli přímo z kanceláří [target.Custom('CZ_TitledFirstName_G')], byly jen nesmyslné čmáranice nebo staré záznamy." # todo: NEW TRANSLATION
 scheme_critical_moments.8503.discovered: "\n\nAby toho nebylo málo, zdá se, že [target.GetTitledFirstNameNoTooltip] [Select_CString(target.IsFemale,'přišla','přišel')] na naše pletichy." # todo: NEW TRANSLATION
