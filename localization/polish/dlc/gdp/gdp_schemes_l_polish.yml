 gdp_patrician_find_secrets.0002.t: "$scheme_critical_moments.1132.t$" # todo: NEW TRANSLATION
 gdp_patrician_find_secrets.0002.desc: "Rodina [target.GetHouse.GetName] ve mně skoro vzbuzuje lítost. Jejich služebnictvo a údajní spojenci se při odhalování těch nejskandálnějších tajemství mým spolčencům projevili jako vstřícní — ba dokonce #EMP nadšení#!. #EMP Skoro#!.\n\nDůkazy, které mám v rukou, jsou nezvratné; [secret_holder.GetTitledFirstName] [secret_to_reveal.Custom('SecretDescriptionThirdPerson')]!" # todo: NEW TRANSLATION
 gdp_patrician_find_secrets.0002.a: "[Select_CString(secret_holder.IsFemale,'Její','Jeho')] pověst mám ve svých rukou." # todo: NEW TRANSLATION
 gdp_patrician_find_secrets.0003.t: "$scheme_critical_moments.1133.t$" # todo: NEW TRANSLATION
 gdp_patrician_find_secrets.0003.desc.nothing_to_find: "Moji spolčenci prohledali odhozené dokumenty rodiny [target.GetHouse.GetName], donutili jejich služebnictvo k poslušnosti a upláceli každého trhového drbnu, ale stejně nenašli nic cenného.\n\nAť už [target.GetTitledFirstName] za [Select_CString(target.IsFemale,'jejími','jeho')] dveřmi ukrývá jakákoli tajemství, jsou buď příliš hluboko pohřbená, než abychom je rozpoznali, nebo vůbec neexistují." # todo: NEW TRANSLATION
 gdp_patrician_find_secrets.0003.desc.outmatched: "Moji spolčenci sledovali každý krok rodiny [target.GetHouse.GetName], ale nepodařilo se jim zachytit ani bledý stín jejich tajemství. Jejich dveře jsou zavřené pevněji než měšec lakomce a služebnictvo střeží svá slova tak úzkostlivě, jako by jim snad chyběly hlasivky.\n\nAť už se [target.GetTitledFirstName] dopustil jakýchkoli zvrhlých činů, nevíme o nic víc než na začátku." # todo: NEW TRANSLATION
 gdp_patrician_find_secrets.0003.a: "[ROOT.Char.Custom('CulturalCurse')|U]! Všechno to bylo k ničemu." # todo: NEW TRANSLATION
