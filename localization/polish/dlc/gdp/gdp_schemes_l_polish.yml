 scheme_critical_moments.1142.desc_patrician_self: "Veškeré úsilí vložené do mé kampaně za vlastní zviditelnění přineslo ovoce.\n\nMé postavení mezi vrstevníky se zlepšilo, k mému [Concept('house','rodu')|E] se hrnou noví podporovatelé a svého cíle jsem blíž než kdy dřív!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 scheme_critical_moments.1142.desc_patrician_other: "Čas a prostředky vložené do podpory věci [target.Custom('CZ_TitledFirstName_G')] přinesly ovoce.\n\n[Select_CString(target.IsFemale,'Její','Jeho')] pověst mezi [Select_CString(target.IsFemale,'jejími','jeho')] vrstevníky se zlepšila, noví podporovatelé jsou nyní přesvědčeni o [Select_CString(target.IsFemale,'její','jeho')] hodnotě a [Select_CString(target.IsFemale,'její','jeho')] postavení v [Concept('republic','republice')|E] je nyní o krok výš!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 scheme_critical_moments.1143.desc_patrician_self: "Veškerá energie a prostředky vložené do mé kampaně za vlastní zviditelnění jednoduše nestačily. Nikdo se nenechal přesvědčit o mé hodnotě ani ovlivnit mými sliby či úplatky, a mé postavení se tak nezměnilo.\n\nBudu muset vymyslet něco jiného, abych podpořil svůj [Concept('house','rod')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
