 steal_market_insights_desc_general: "$steal_market_insights$ je [Concept('hostile_scheme','nepřátelská intrika')|E], jejímž cílem je ukrást [Concept('expertise','zkušenost')|E] konkurenční [Concept('merchant','kupec')|E] [Concept('company','společnosti')|E]. Opírá se o [Concept('intrigue','pletichářství')|E] a [Concept('stewardship','správcovství')|E] a lze do ní zapojit [Concept('agents','spolčenci')|E].\n\nÚspěšná intrika $steal_market_insights$ způsobí, že [Concept('company','společnost')|E] [Concept('scheme_owner_possessive','osnovatelů intriky')|E] získá $game_concept_expertise$ ve všech [Concept('trade_categories','kategorie zboží')|E], v nichž má [Concept('scheme_target_possessive','cíle intriky')|E] společnosti vyšší $game_concept_expertise$." # todo: NEW TRANSLATION # todo: CONCEPT CASE
