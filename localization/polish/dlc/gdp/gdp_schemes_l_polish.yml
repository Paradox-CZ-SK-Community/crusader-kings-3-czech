 scheme_critical_moments.8402.t: "[scheme.GetNameNoTooltip]: Úspěch" # todo: NEW TRANSLATION
 scheme_critical_moments.8402.desc: "Hluboko v [target_patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] sleduji, jak [target_patron.Custom('CZ_TitledFirstName_G')] magistráti líně pročítají stohy dokumentů. Každé uspokojivé razítko potvrzuje převod dalšího majetku rodu [target.GetHouse.GetName] na [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l].\n\nPoklidné bzučení mouchy nad jejich hlavami náhle přeruší [target.GetFirstName], který vtrhne do komnaty.\n\n#EMP „TY!#!“ [target.GetSheHe] zachraptí jedovatě. „Jak?! #DIE2 Proč...#!“" # todo: NEW TRANSLATION
 scheme_critical_moments.8402.a: "To je prostě dobrý obchod..." # todo: NEW TRANSLATION
 scheme_critical_moments.8403.t: "[scheme.GetNameNoTooltip]: Neúspěch" # todo: NEW TRANSLATION
 scheme_critical_moments.8403.desc: "Ani přes všechno to dohadování a naléhání na [target_patron.Custom('CZ_TitledFirstName_A')] se nám nepodařilo provést poslední kroky dřív, než [target.GetTitledFirstName] pojal podezření, že se něco chystá...\n\n[target.GetPrimaryTitle.GetDefinitiveName] nyní zaujalo pevnou obrannou pozici, což nám znemožňuje přelstít ty ničemy u soudu." # todo: NEW TRANSLATION
 scheme_critical_moments.8403.discovered: "\n\nA aby toho nebylo málo, [target.GetTitledFirstNameNoTooltip] zjevně ví, že za tím stojíme..." # todo: NEW TRANSLATION
 scheme_critical_moments.8403.fallback: "\n\nDrobnou útěchou nám však může být, že [target.GetTitledFirstNamePossessiveNoTooltip] nemá o našem zapojení ani tušení..." # todo: NEW TRANSLATION
 scheme_critical_moments.8403.a: "Typické..." # todo: NEW TRANSLATION
 scheme_critical_moments.8403.tt.failed: "[scheme.GetOwner.GetShortUIName|U] se pokusil provést $hostile_takeover$ společnosti [target.Custom('CZ_ShortUIName_G')], ale neuspěl!" # todo: NEW TRANSLATION
 scheme_critical_moments.8404.t: "Nepřátelské převzetí: [owner.GetPrimaryTitle.GetDefinitiveNameNoTooltip]" # todo: NEW TRANSLATION
 scheme_critical_moments.8404.desc: "Zatímco jsme se věnovali každodennímu počítání výnosů z našich tras a hledání příležitostí, dnes jsme zjistili, že jsme svou pozornost věnovali naprosto nesprávným věcem.\n\nZ [target_patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] dorazilo stručné oznámení, pouhá formalita potvrzující dnešní soudní řízení, jehož výsledkem bude zrušení naší společnosti a #EMP zabavení#! jejích aktiv ve prospěch [owner.GetPrimaryTitle.GetDefinitiveName|l]!\n\nKdyž jsem dorazil, bylo už pozdě — pokud vůbec někdy nebylo...\n\nTen ničema [owner.GetTitledFirstName] se na mě šklebí, zatímco zoufale pročítám dokumenty, které všechny potvrdil můj patron [target_patron.GetTitledFirstName]!" # todo: NEW TRANSLATION
 scheme_critical_moments.8404.a: "Jak?! #DIE2 Proč...#!" # todo: NEW TRANSLATION
