 steal_trade_post_desc_general: "$steal_trade_post$ je [Concept('hostile_scheme','nepřátelská intrika')|E], jejímž cílem je zmocnit se [Concept('trade_post','obchodními stanicemi')|E] konkurenčního [Concept('patrician','patricijem')|E]. Opírá se o [Concept('intrigue','pletichářství')|E] a [Concept('stewardship','správcovství')|E] a lze do ní zapojit [Concept('agents','spolčenci')|E].\n\nÚspěšná krádež převede vlastnictví cílového obchodních stanic z [Concept('scheme_target','cíle intriky')|E] na [Concept('scheme_owner','osnovatele intriky')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
