 scheme_critical_moments.8602.t: "[scheme.GetNameNoTooltip]: Úspěch" # todo: NEW TRANSLATION
 scheme_critical_moments.8602.desc: "Ukázalo se, že soudci v [trade_post_county.GetName] mají svou cenu, a nebyla nijak vysoká. Pečeť za pečetí přechází nájemní právo v [trade_post_province.GetName] do našich rukou.\n\nNež se o tom [target.GetTitledFirstName] dozví, naši zástupci už vyhánějí [Select_CString(target.IsFemale,'její','jeho')] písaře a přetírají [Select_CString(target.IsFemale,'její','jeho')] barvy nade dveřmi." # todo: NEW TRANSLATION
 scheme_critical_moments.8602.a: "Krásná adresa, a teď je naše." # todo: NEW TRANSLATION
 scheme_critical_moments.8603.t: "[scheme.GetNameNoTooltip]: Neúspěch" # todo: NEW TRANSLATION
 scheme_critical_moments.8603.desc: "Každý úplatek přijali a každý slib porušili. Soudci v [trade_post_county.GetName] si strčili mé mince do kapes, aniž by jakkoli potvrdili mé vlastnictví.\n\nDržení toho místa [target.Custom('CZ_TitledFirstName_G')] zůstává neotřeseno." # todo: NEW TRANSLATION
 scheme_critical_moments.8603.discovered: "\n\nA co hůř, [target.GetTitledFirstNameNoTooltip] přesně ví, čí ruka se natahovala po [Select_CString(target.IsFemale,'jejími','jeho')] měšci..." # todo: NEW TRANSLATION
 scheme_critical_moments.8603.fallback: "\n\nAspoň naše účast na celé záležitosti zůstává tajemstvím." # todo: NEW TRANSLATION
 scheme_critical_moments.8603.a: "Mince vyhozené za věrolomné muže." # todo: NEW TRANSLATION
 scheme_critical_moments.8603.tt.failed: "[scheme.GetOwner.GetShortUIName|U] se pokusil zmocnit tvého [Concept('trade_post','obchodních stanic')|E] v [trade_post_province.GetNameNoTooltip], ale neuspěl!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 scheme_critical_moments.8604.t: "Obchodní stanice zabrána: [trade_post_province.GetNameNoTooltip]" # todo: NEW TRANSLATION
 scheme_critical_moments.8604.desc: "Jezdec přináší zprávy z [trade_post_county.GetName]: našeho zástupce vyhodili na ulici a místní soudci mě prohlásili za nežádoucího, zatímco jako nového vlastníka obchodní stanice v [trade_post_province.GetName] jmenovali někoho jiného.\n\nRoky obchodu, skladování a těžce získané dobré vůle — a to vše podepsali muži, které jsme už zaplatili." # todo: NEW TRANSLATION
 scheme_critical_moments.8604.discovered: "\n\nA teď na mém místě stojí [owner.GetTitledFirstName], jako by to vždy patřilo [owner.GetHersHis]. Na tohle #EMP nezapomeneme#!" # todo: NEW TRANSLATION
 scheme_critical_moments.8604.a: "Vyhnali nás z vlastního prahu!" # todo: NEW TRANSLATION
 steal_trade_post_failed_toast: "Pokus o zabrání obchodní stanice" # todo: NEW TRANSLATION
 steal_trade_post_host_toast: "Obchodní stanice změnila majitele" # todo: NEW TRANSLATION
