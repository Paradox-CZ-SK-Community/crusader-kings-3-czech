 scheme_critical_moments.8502.t: "[scheme.GetNameNoTooltip]: Úspěch" # todo: NEW TRANSLATION
 scheme_critical_moments.8502.desc: "Ukradené účetní knihy, vylákané drby a drobné informace získané díky laskavostem postupně skládají obraz mnoha kupců, prodejců a dalších kontaktů [target.GetPrimaryTitle.GetDefinitiveNamePossessive|l].\n\nNení pochyb, že nám tyto poznatky umožní lépe soupeřit o oblíbené zboží [target.Custom('CZ_TitledFirstName_G')] za rovných podmínek." # todo: NEW TRANSLATION
 scheme_critical_moments.8502.discovered: "\n\nBohužel našemu pátrání neunikl [target.GetTitledFirstNameNoTooltip]..." # todo: NEW TRANSLATION
