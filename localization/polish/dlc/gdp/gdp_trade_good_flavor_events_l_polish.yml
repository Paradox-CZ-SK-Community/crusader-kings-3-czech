l_polish:
 gdp_trade_good_flavor.1001.t: "Počítání zásob" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1001.desc: "Ještě jednou před spaním počítám své [tgf_good.Custom('GetTradeGoodUnitPlural')] [tgf_good.Custom('GetTradeGood')]. Tři sta dvanáct a všechny už prodané... alespoň v mé hlavě.\n\nPočítám je znovu. Jen pro jistotu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1001.a: "Všechno na místě. Všechno moje." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1001.b: "Účetní kniha se mnou musí souhlasit." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1002.t: "Zpráva se šíří" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1002.desc: "Doneslo se ke mně, že [tgf_market_holder.GetTitledFirstName] u [Select_CString(tgf_market_holder.IsFemale,'jejího','jeho')] vlastního stolu chválí mé [tgf_good.Custom('GetTgfGoodLook')]. [tgf_market_holder.GetSheHe|U] chce další a [Select_CString(tgf_market_holder.IsFemale,'její','jeho')] sousedé slyšeli, jak [tgf_market_holder.GetHerHim] říká, že ho chce.\n\nChvála potěší. Ještě lepší je chvála od [tgf_market_holder.GetWomanMan], který stále nakupuje." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1002.a: "Dárek pro mého oblíbeného kupce." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1002.b: "Tak ať [tgf_market_holder.GetSheHe] zaplatí víc." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1002.c: "Ať si povídají." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1003.t: "Přímo od zdroje" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1003.desc: "„Dělníci [tgf_source_culture.GetName] tady znají své řemeslo do posledního [tgf_good.Custom('GetTgfGoodSmallest')],“ píše mi můj obchodník [tgf_trader.GetFirstName] z [tgf_source_county.GetNameNoTier]. „[tgf_good.Custom('GetTradeGood')] [tgf_good.Custom('GetTgfGoodIsAre')] [tgf_good.Custom('GetTgfGoodMade')] a nikdo nic nešidí.“\n\nZnát zdroj je polovina úspěchu při prodeji zásob." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1003.a: "Každý detail má svou cenu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1003.b: "Teď už vím, kolik by to mělo stát." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1003.c: "Máš můj respekt, obchodníku [ROOT.Char.GetWomanMan]." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1004.t: "Volná cesta" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1004.desc: "Můj obchodník [tgf_trader.GetFirstName] se šklebí jako [tgf_trader.GetWomanMan], který už [Select_CString(tgf_trader.IsFemale,'její','jeho')] část utratil. „Celá cesta je volná a lidé se po tvém [tgf_good.Custom('GetTgfGoodLook')] ptají jménem.“\n\nDobré roky rychle utíkají. Raději z toho vytěžím co nejvíc." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1004.a: "Prodávej, dokud nám cesta přeje." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1004.b: "Každý dobrý rok přináší ponaučení. Pouč se." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1004.c: "Investujme do dalších vozů!" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1005.t: "Sny o zisku" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1005.desc: "Znovu se mi zdálo o [tgf_good.Custom('GetTradeGood')]. [tgf_good.Custom('GetTradeGoodUnitPlural')] toho zboží, navršené až po trámy, a já na vrcholu hromady — sleduji, jak se kupci dole perou o to, kdo zaplatí první.\n\n" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1005.desc.livestock: "Znovu se mi zdálo o [tgf_good.Custom('GetTradeGood')]. Celá stáda zaplnila všechny cesty na tržiště — a já jel v čele průvodu a počítal kupce, kteří se k nám sbíhali.\n\n" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1005.desc.outro: "Probudil jsem se se smíchem. Pak jsem začal zapisovat čísla. Jednou budu bohatý!" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1005.a: "Proč by to mělo zůstat jen snem?" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1005.a.tt: "Brzy se objeví nová [Concept('trade_opportunity','obchodní příležitostí')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_trade_good_flavor.1005.b: "Čísla budou sedět. Já se o to postarám." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1005.c: "Ještě pět minut v roli boháče... Zz#DIE1 zz#!#DIE2 zz...#!" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1006.t: "Hlupáci, kteří kontrolují" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1006.desc: "Můj obchodník [tgf_trader.GetFirstName] mě ve skladu odtáhne stranou. „To [tgf_good.Custom('GetTradeGood')] z [tgf_source_county.GetNameNoTier] — [tgf_good.Custom('GetTgfGoodFlaw')]. Myslí si, že jsme hlupáci, kteří nic nekontrolují!“\n\nChtěli mě ošidit. Místo toho mi dali slevu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1006.a: "Špatné zboží si zaslouží nízkou cenu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1006.b: "Heh. Převezli jsme je." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1007.t: "Žádejte to jménem" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1007.desc: "Můj obchodník [tgf_trader.GetFirstName] přináší podivné zprávy z [tgf_source_county.GetNameNoTier]. „[tgf_good.Custom('GetTradeGood')|U], [tgf_good.Custom('GetTgfGoodSold')], a přesto [tgf_source_culture.GetCollectiveNoun] žádají #EMP '[ROOT.Char.GetHouse.GetName] [tgf_good.Custom('GetTradeGood')]'#! jménem a platí za něj víc, než je běžná cena! Zásoby nám téměř došly!“\n\nUkázalo se, že mé jméno má svou cenu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1007.a: "Označ mou značkou každý [tgf_good.Custom('GetTradeGoodUnit')]." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1007.b: "Prodávat, prodávat, prodávat!" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1008.t: "Oceňování [tgf_good.GetNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1008.desc: "Dorazí dopis se [tgf_market_holder.GetTitledFirstNamePossessive] pečetí. „Bylo mi nabídnuto [tgf_good.Custom('GetTgfGoodUnitArticle')] [tgf_good.Custom('GetTradeGoodUnit')] [tgf_good.Custom('GetTradeGood')] a můj správce nedokáže poznat dobré od špatného. Podíval byste se na to svým kupeckým okem?“\n\nLichotivé. Za lichotky se obvykle připlácí." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1008.a: "Pravdu, zváženou a změřenou." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1008.b: "Nádhera. Nic lepšího jsem nikdy neviděl." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1008.c: "Za odborný názor se platí, ten se nedává zadarmo." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1009.t: "Nauč se počítat" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1009.desc: "Přistihnu svého dědice [tgf_heir.GetFirstName] ve skladu, jak zkoumá [tgf_good.Custom('GetTgfGoodUnitArticle')] [tgf_good.Custom('GetTradeGoodUnit')] [tgf_good.Custom('GetTradeGood')], jako by se na dně mohly skrývat mince.\n\n" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1009.desc.livestock: "Přistihnu svého dědice [tgf_heir.GetFirstName] u ohrady, jak si prohlíží [tgf_good.Custom('GetTradeGoodUnit')] [tgf_good.Custom('GetTradeGood')], jako by se pod kůží mohly skrývat mince.\n\n" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1009.desc.outro: "Dobré instinkty. Je načase, aby je někdo vybrousil." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1009.a: "Pojď. Dívej se, co dělám." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1009.b: "Tak je spočítej. Dvakrát." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1010.t: "Napodobitel" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1010.desc: "Do [tgf_source_county.GetNameNoTier] se mi vrátí bedna, protože prý „neodpovídá obvyklé kvalitě“. Není moje, ale někdo okopíroval mou značku do poslední kudrlinky.\n\n" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1010.desc.livestock: "Z [tgf_source_county.GetNameNoTier] se mi vrátí jedno zvíře, protože prý „neodpovídá obvyklé kvalitě“. Není moje, ale někdo okopíroval mou značku do poslední kudrlinky.\n\n" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1010.desc.outro: "Můj obchodník [tgf_trader.GetFirstName] odhalí padělatele: jistého [tgf_rival.GetFirstName] z [tgf_rival.Custom('GetTgfCompanyWord')] rodu [tgf_rival.GetHouse.GetBaseNameNoTooltip]. [tgf_rival.GetSheHe|U] umí napodobovat, to mu musím uznat." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [tgf_rival.GetHerHim]
 gdp_trade_good_flavor.1010.a: "Znič to padělané zboží, ať to stojí, co to stojí." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1010.b: "Ať se o této urážce dozví každý rod." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1010.c: "Napodobování šíří mé jméno zadarmo." # todo: NEW TRANSLATION
 house_relation_tgf_imitation_desc: "[ROOT.Char.GetShortUINameNotMe|U] proměnil padělky [tgf_rival.GetShortUINamePossessiveNotMy] ve spor mezi jejich rody." # todo: NEW TRANSLATION
 house_relation_reason_tgf_imitation_desc: "[char.GetShortUINameNotMe|U] proměnil padělky [target_char.GetShortUINamePossessiveNotMy] ve spor mezi jejich rody." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1011.t: "Cena [tgf_good.GetNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1011.desc: "[tgf_envoy.GetFirstName|U], obchodník ve službách [tgf_rival.Custom('GetTgfCompanyWord')] rodu [tgf_rival.GetHouse.GetBaseNameNoTooltip], mě vyhledá ve skladu a položí na stůl těžký měšec. „Můj pán [tgf_rival.GetFirstName] chce jména těch, kdo vám prodávají [tgf_good.Custom('GetTradeGood')]. Všechna. Měšec říká prosím.“\n\n[tgf_envoy.GetSheHe|U] si jména nekupuje. [tgf_envoy.GetSheHe|U] kupuje léta mé práce." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1011.a: "Jména jsou jen inkoust na papíře. Zaplať." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1011.b: "Mé výhody nejsou na prodej." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1012.t: "Příměří obchodníků" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1012.desc: "[tgf_ally.GetFirstName|U] prodává [tgf_good.Custom('GetTradeGood')] v [tgf_source_county.GetNameNoTier], stejně jako já, a každou sezonu si navzájem snižujeme ceny až na dřeň. Dnes mi [Select_CString(tgf_ally.IsFemale,'její','jeho')] dopis nabízí příměří: přestaneme se podbízet a oběma se povede dobře.\n\nUkazuje se, že i mír se dá koupit jako cokoli jiného." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1012.a: "Souhlasím. Oba se najíme." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1012.b: "Dokážu hladovět déle než [tgf_ally.GetSheHe]." # todo: NEW TRANSLATION
 house_relation_tgf_truce_desc: "[ROOT.Char.GetShortUINameNotMe|U] a [tgf_ally.GetShortUINameNotMe] se dohodli, že se přestanou vzájemně podbízet." # todo: NEW TRANSLATION
 house_relation_reason_tgf_truce_desc: "[char.GetShortUINameNotMe|U] a [target_char.GetShortUINameNotMe] se dohodli, že se přestanou vzájemně podbízet." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1013.t: "Soukromá cena" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1013.desc: "Dostanu dopis s pečetí [tgf_market_holder.GetTitledFirstName]. „Nakupujete své [tgf_good.Custom('GetTradeGood')] na mém tržišti. Nakupujte [tgf_good.Custom('GetTgfGoodItThem')] výhradně tam a zaplatíte méně než kterýkoli jiný obchodník před vámi.“\n\nVýhradní nabídka je jiné označení pro vodítko. Ale ta cena je dobrá." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1013.a: "[Select_CString(tgf_market_holder.IsFemale,'Její','Jeho')] tržiště, moje sleva. Platí." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1013.b: "Nikomu se nebudu klanět kvůli účetní knize." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1014.t: "Zeptej se zkušených" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1014.desc: "Šedovlasý nosič odloží [Select_CString(tgf_porter.IsFemale,'její','jeho')] náklad ve skladu v [tgf_source_county.GetNameNoTier]. „Promiňte, ale [tgf_good.Custom('GetTradeGood')] kontrolujete úplně špatně.“ [tgf_porter.GetSheHe|U] mi ukáže: tady a tady.\n\nZa celý život nošení [tgf_good.Custom('GetTradeGoodUnitPlural')] se toho [tgf_porter.GetHerHim] naučil víc než většina lidí." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1014.desc.livestock: "Šedovlasý honák zpomalí [Select_CString(tgf_porter.IsFemale,'její','jeho')] stádo na tržišti v [tgf_source_county.GetNameNoTier]. „Promiňte, ale [tgf_good.Custom('GetTradeGood')] posuzujete úplně špatně.“ [tgf_porter.GetSheHe|U] mi ukáže: tady a tady.\n\nZa celý život hnání [tgf_good.Custom('GetTradeGood')] na trh se toho [tgf_porter.GetHerHim] naučil víc než většina lidí." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1014.a: "Tady. Za moudrost se sluší zaplatit." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1014.b: "Pokračuj. Poslouchám." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1015.t: "Začátečnická chyba" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1015.desc: "Někde v [tgf_source_county.GetNameNoTier] pije kupec, který mi prodal [tgf_good.Custom('GetTradeGood')], na mé zdraví. Zaplatil jsem cenu pro hlupáka a dozvídám se to jako poslední.\n\nNu což. Hlupáci, kteří se poučí... přestanou být hlupáky." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1015.a: "I drahá lekce je pořád lekcí." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1015.b: "Dost. Dnes v noci bude účetní kniha spát." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1016.t: "Obchodníkova příručka" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1016.desc.intro: "Mezi bednou [tgf_good.Custom('GetTradeGood')], zabalenou proti vlhku, najdu výtisk knihy " # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1016.desc.intro_livestock: "Ve výbavě, která přišla s posledním [tgf_good.Custom('GetTradeGood')], je zabalený proti vlhku výtisk knihy " # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1016.desc.book_1: "Obchodní praxe" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1016.desc.book_2: "Kniha cest a tržišť" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1016.desc.book_3: "Obchodníkovo zrcadlo" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1016.desc.outro: " — váhy, míry, cesty a ceny, sepsané obchodníkem, který zjevně nikdy nespal.\n\nNěkdo [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')] o poklad. Já ho hodlám využít." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1016.a: "Čti ji, dokud se nerozpadne vazba." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1016.b: "Vzácné knihy se prodávají za ještě vzácnější ceny." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1017.t: "Jaké to je" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1017.desc: "V [tgf_source_county.GetNameNoTier] mi prodavač, jeden z [tgf_seller.GetCulture.GetCollectiveNoun], podává jeden [tgf_good.Custom('GetTradeGoodUnit')] [tgf_good.Custom('GetTradeGood')] a žádá cenu za tři. „Jste v tom nový, že? Tak zaplaťte za to, abyste poznal, jaké to je.“\n\n" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1017.desc.livestock: "V [tgf_source_county.GetNameNoTier] mi prodavač, jeden z [tgf_seller.GetCulture.GetCollectiveNoun], předvádí jeden [tgf_good.Custom('GetTradeGoodUnit')] [tgf_good.Custom('GetTradeGood')] a žádá cenu za tři. „Jste v tom nový, že? Tak zaplaťte za to, abyste poznal, jaké to je.“\n\n" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1017.desc.outro: "Drzé. A má pravdu, ale přesto drzé." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1017.a: "Vezmi si mince. Nauč mě to." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1017.b: "Ani náhodou." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1018.t: "Špatná míra" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1018.desc: "Můj obchodník [tgf_trader.GetFirstName] zjistí, že jsme prodávali [tgf_good.Custom('GetTradeGood')] podle míry kultury [ROOT.Char.GetCulture.GetName] — která je o něco menší než míra kultury [tgf_source_culture.GetName], jakou kupci očekávají. Každý prodaný [tgf_good.Custom('GetTradeGoodUnit')] byl menší, než měl být.\n\nPoctivá chyba. Jestli jí zůstane, záleží na mně." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1018.a: "Oprav ty míry. Všechny." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1018.b: "Rozdíl si nechám." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1018.c: "Važ to podle jejich míry a hlasitě to přiznej." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1019.t: "Dvě zboží, jeden kupec" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1019.desc: "Dostanu dopis od [tgf_market_holder.GetTitledFirstName]. „Pošlete mi své [tgf_good.Custom('GetTradeGood')]. Pošlete mi i své [tgf_good_b.Custom('GetTradeGood')], protože jedno bez druhého nemá cenu.“\n\n" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1019.desc.generic: "Obdržím dopis od [tgf_market_holder.Custom('CZ_TitledFirstName_G')]. „Pošli mi své [tgf_good.Custom('GetTradeGood')]. Pošli mi také své [tgf_good_b.Custom('GetTradeGood')], obojí v jedné dodávce.“\n\n" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1019.desc.outro: "Dvoje zboží, jeden kupující, jedna cena. Přesně takové počty mám nejradši." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1019.a: "Prodáno jako sada, za cenu sady." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1019.b: "Zvlášť. Mince teď jsou lepší než mince později." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1020.t: "Stavební cena" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1020.desc: "Nad [tgf_build_county.GetNameNoTier] se tyčí lešení. [tgf_market_holder.GetTitledFirstName] staví a každý vůz, který dorazí na staveniště, je naložený mým zbožím [tgf_good.Custom('GetTradeGood')]. [tgf_market_holder.GetSheHe|U] píše a žádá stavební cenu — stejné zboží [tgf_good.Custom('GetTradeGood')], jen o něco levnější, dokud nebudou hradby stát.\n\nKaždá hradba, kterou [tgf_market_holder.GetSheHe] postaví, už je z poloviny moje." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1020.a: "Tak tedy stavební cena." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1020.b: "Sleva ano. Dar ne." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1020.c: "Teď laskavost, později laskavost." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1020.d: "To nejlepší si nechám na svém dvoře." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1021.t: "Poznej své zboží" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1021.desc: "Každý obchod má své mistry a mistři se #EMP stále#! učí. Dnes večer jsem tu já, lampa a to nejlepší z mých zásob — ty nejkvalitnější [tgf_good.Custom('GetTradeGoodUnitPlural')] [tgf_good.Custom('GetTradeGood')], které studuji, dokud nedojde olej.\n\nNěkde v tom tkví důvod, proč se moje zboží prodává a jejich ne." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1021.desc.livestock: "Každý obchod má své mistry a mistři se stále učí. Dnes večer jsem tu já, lucerna a to nejlepší z mého zboží [tgf_good.Custom('GetTradeGood')], které si prohlížím od zubů až po ocas.\n\nNěkde v tom tkví důvod, proč se moje zboží prodává a jejich ne." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1021.desc.books: "Každý obchod má své mistry a mistři se #EMP stále#! učí. Dnes večer jsem tu já, lampa a to nejlepší z mých zásob — knihy, které čtu, dokud nedojde olej.\n\nNěkde v tom tkví důvod, proč se moje zboží prodává a jejich ne." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1021.a: "Tuhle si nechám. Všechno ostatní se bude poměřovat s ní." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1021.b: "Vždycky se dá naučit něco dalšího." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1022.t: "Jméno pro obchod" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1022.desc: "V [tgf_source_county.GetNameNoTier] už mi neříkají jménem. Říkají mi [tgf_good.Custom('GetTgfGoodNickname')] a každý ví, koho tím myslí. #bold Mě.#!\n\nTituly udělují lenní páni. Taková jména udělují trhy a jejich chválu si člověk musí zasloužit." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1022.a: "Vulgární. Účinné, ale vulgární." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1022.b: "Jen ať. To jméno prospívá obchodu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1023.t: "Nedostatečná nabídka" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1023.desc: "„Nakupujete rychleji, než to stíháme vyrábět,“ říká [tgf_foreman.GetFirstName], předák[tgf_foreman.GetWomanMan] v [tgf_source_county.GetNameNoTier], zatímco sleduji, jak se vyrábí mé zboží [tgf_good.Custom('GetTradeGood')][tgf_good.Custom('GetTgfGoodMade')]. „Rukou je jen omezený počet.“\n\nVíce rukou stojí mince. Odmítnout kupující stojí ještě víc." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1023.a: "Najmi další lidi. Zaplatím." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1023.b: "Pojď raději pracovat pro mě." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1023.c: "Tak mi ukaž, jak se to dělá." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1024.t: "Pod kladívkem" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1024.desc: "„Čtyřicet [tgf_good.Custom('GetTradeGoodUnitPlural')] [tgf_good.Custom('GetTradeGood')] tomu, kdo nabídne nejvíc!“ Na [tgf_source_county.GetNameNoTier] [tgf_source_province.Custom('GetRegionalMarketTerm')] zvedne [tgf_rival.GetFirstName] z rodu [tgf_rival.GetHouse.GetBaseNameNoTooltip] [tgf_rival.Custom('GetTgfCompanyWord')] [Select_CString(tgf_rival.IsFemale,'její','jeho')] ruku dřív, než dražitel vůbec domluví.\n\n[tgf_rival.GetSheHe|U] se na mě podívá a usměje se. [tgf_rival.GetSheHe|U] si myslí, že tahle várka už patří [tgf_rival.GetHerHim]..." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1024.a: "Ať [tgf_rival.GetSheHe] nabídne cokoli, přidej jednu minci." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1024.b: "Přihazuj, přihazuj, přihazuj... a všechno je tvoje, [tgf_rival.GetFirstNameNoTooltip]!" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1024.c: "Ať [tgf_rival.GetHerHim] přihazuje. Podívám se, kdo vyhraje." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1025.t: "První u mola" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1025.desc: "„Dvacet lodí u mola a jeden jeřáb,“ říká [tgf_docks_boss.GetFirstName], který řídí přístavní dělníky v [tgf_source_county.GetNameNoTier]. „Kdo jako první vyloží své zboží [tgf_good.Custom('GetTradeGood')], určí cenu na celou sezonu. To tvoje může být první.“\n\n[tgf_docks_boss.GetSheHe|U] natáhne [Select_CString(tgf_docks_boss.IsFemale,'její','jeho')] ruku dlaní vzhůru." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1025.a: "Kdo je první z lodi, první určuje cenu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1025.b: "Tak ho prodám rovnou tady, z paluby." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1025.c: "Nech ostatní vyložit jako první a sleduj, kolik si řeknou." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1026.t: "Po hrstech" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1026.desc: "„Chudí nakupují po jednom [tgf_good.Custom('GetTgfGoodSmallest')], tak to chodí,“ říká [tgf_stallholder.GetFirstName], který má stánek na trhu v [tgf_source_county.GetNameNoTier]. Rozdělil[tgf_stallholder.GetSheHe] [tgf_good.Custom('GetTgfGoodUnitArticle')] [tgf_good.Custom('GetTradeGoodUnit')] mého zboží [tgf_good.Custom('GetTradeGood')] na sto malých balíčků a každý prodává za trochu víc, než stojí.\n\n„Zásobuj mě a já se postarám, aby ti zaplatili.“" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1026.a: "Čerstvý [tgf_good.Custom('GetTradeGoodUnit')], kdykoli ho budeš potřebovat. Platí." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1026.b: "Prodávej jim [tgf_good.Custom('GetTgfGoodItThem')] za tolik, kolik si mohou dovolit." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1026.c: "Vezmi si teď celou várku. Mince na ruku." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1027.t: "Tržní den" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1027.desc: "„[tgf_good.Custom('GetTradeGood')|U]! [tgf_good.Custom('GetTgfGoodLook')|U]! Kdo chce [tgf_good.Custom('GetTradeGood')]?“ V [tgf_source_county.GetNameNoTier] je tržní den a mého vyvolávače sotva slyšet. Všichni kupující z hrabství jsou na jednom místě a všichni mají mince v ruce.\n\nJen je musím přimět, aby je utratili #EMP u mě!#!" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1027.a: "Potřebuji tu nejlepší nabídku. Ať to stojí cokoli." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1027.b: "Žádný stánek. Postarám se o dav sám." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1028.t: "Cizí mince" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1028.desc: "[tgf_buyer.GetFirstName], kupující z [tgf_source_county.GetNameNoTier], chce mé zboží [tgf_good.Custom('GetTradeGood')] a platí v měně [tgf_buyer.Custom('GetCurrencyDenominationGlossPlural')]. „Mince jako mince,“ říká [tgf_buyer.GetSheHe].\n\nMince jako mince, souhlasím, a povím [tgf_buyer.GetHerHim], jakou pro mě [Select_CString(tgf_buyer.IsFemale,'její','jeho')] mince mají cenu. [tgf_buyer.GetSheHe|U] se přestane usmívat." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1028.a: "Dobrá. Stříbro jako stříbro." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1028.b: "Moje cena, nebo žádný obchod." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1028.c: "Zaplať mi raději zbožím [tgf_good_b.Custom('GetTradeGood')]." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1029.t: "Roky na cestách" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1029.desc: "„Už tři roky se po téhle cestě vozí vaše zboží [tgf_good.Custom('GetTradeGood')],“ říká můj obchodník [tgf_trader.GetFirstName] a zvedá [Select_CString(tgf_trader.IsFemale,'její','jeho')] číši. „A za celou tu dobu jsem neztratil ani jeden [tgf_good.Custom('GetTradeGoodUnit')]!“\n\n[tgf_trader.GetSheHe|U] jich ztratil pět. Ale dnes večer mu dopřeji slávu [tgf_trader.GetHerHim]." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1029.a: "Odvedl jsi dobrou práci!" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1029.b: "Na další tři roky." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1029.c: "Příště dál. Mnohem dál." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1030.t: "Sledovat, jak se prodává" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1030.desc: "„To je opravdové zboží [ROOT.Char.GetHouse.GetName] [tgf_good.Custom('GetTradeGood')],“ říká kupující na trhu v [tgf_source_county.GetNameNoTier] a ukazuje na jeden z mých [tgf_good.Custom('GetTradeGoodUnitPlural')]. „[tgf_good.Custom('GetTgfGoodLook')|U]!“\n\n[tgf_buyer.GetSheHe|U] nemá tušení, že člen rodu [ROOT.Char.GetHouse.GetName] stojí přímo za [tgf_buyer.GetHerHim].\n\nMohl bych něco říct. Ale taky si to můžu jen užít." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1030.a: "Nic neříkat. Poslouchat, co chtějí." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1030.b: "Vskutku. Měl bych to vědět." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1031.t: "Cizí peníze" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1031.desc: "[tgf_investor_a.GetFirstName] a [tgf_investor_b.GetFirstName], dva [tgf_market_holder.Custom('GetRegionalUrbanEliteTermPlural')] z [tgf_source_county.GetNameNoTier], už roky kupují mé zboží [tgf_good.Custom('GetTradeGood')]. Teď chtějí podíl.\n\n„Podíl na tvém obchodu,“ říká [tgf_investor_a.GetFirstNameNoTooltip], zatímco [tgf_investor_b.GetFirstNameNoTooltip] odpočítává mince. „Dobře zaplatíme a na moc věcí se ptát nebudeme.“\n\nPtát se budou. Investoři to tak dělají vždycky." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1031.a: "Tvoje mince, mé zisky. Nějaké." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1031.b: "Tenhle obchod zůstane v rodině." # todo: NEW TRANSLATION
 gdp_tgf_kept_in_family_unity_desc: "Udržel obchod v rodině" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1032.t: "Výstavní síň" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1032.desc: "„To je [tgf_good.Custom('GetTgfGoodIsThat')] zboží [tgf_good.Custom('GetTradeGood')]?“ ptá se každý návštěvník, který se zastaví v mé síni. [tgf_good.Custom('GetTgfGoodItIs')]: to nejlepší, co vlastním, [tgf_good.Custom('GetTgfGoodLook')], vystavené tak, aby si [tgf_good.Custom('GetTgfGoodItThem')] každý všiml.\n\nNikdo neopustí můj dům, aniž by věděl, co prodávám." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1032.desc.livestock: "„To je [tgf_good.Custom('GetTradeGood')]?“ ptá se každý návštěvník a opatrně kolem nich prochází v mé síni. Jsou to: to nejlepší, co vlastním, [tgf_good.Custom('GetTgfGoodLook')], ustájené tak, aby si jich každý všiml.\n\nNikdo neopustí můj dům, aniž by věděl, co prodávám. Nebo aniž by si zkontroloval boty." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1032.a: "Jen ať zírají. Zpráva se rozšíří." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1032.b: "Vezmi si to, s mým přáním všeho dobrého." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1033.t: "Udržovat si přehled" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1033.desc: "Píše mi starý dodavatel zboží [tgf_good.Custom('GetTradeGood')]: „Nechal jsem pro tebe stranou to nejlepší z letošního zboží [tgf_good.Custom('GetTradeGood')], za starou cenu. Nechtěl bys zase něco koupit?“\n\nTenhle obchod jsem opustil, ale můj cit pro zboží [tgf_good.Custom('GetTradeGood')] je pořád bystrý. Takový cit má cenu, pokud ho dál používám." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1033.a: "Odepsat. Udržet si bystrý cit." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1033.b: "Mé znalosti jsou na prodej. Za určitou cenu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1033.c: "Nechat to být. Teď mám nové obchody." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1034.t: "Itinerář" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1034.desc: "[tgf_pilgrim.GetFirstName], poutník, který nocuje v [tgf_source_county.GetNameNoTier], poklepe na ošoupanou knížečku. „Je v ní každá cesta, každá hospoda a každý brod odsud až k moři. A na okrajích všechny trhy, kde dobře platí za zboží [tgf_good.Custom('GetTradeGood')]. Je tvoje, za určitou cenu.“\n\nDostal se dál než kterýkoli z mých vozů." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1034.a: "Řekni si o cenu, poutníku." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1034.b: "Dnes v noci si ji opiš. Ráno ji vrať." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1034.c: "Jen mi pověz, co jsi na trzích viděl." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1035.t: "Řeči o obchodě" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1035.desc: "„A čím se vlastně obchoduješ?“ ptá se můj host [tgf_guest.GetFirstName], když se po večeři procházíme. Chyba. Než mu vysvětlím, jak získávám své zboží [tgf_good.Custom('GetTradeGood')] — jak se vyrábí [tgf_good.Custom('GetTgfGoodMade')] —, projdeme celý trh dvakrát.\n\n[tgf_guest.GetSheHe|U] se ani jednou nepokusil změnit téma. Tak poznám, že mám kupujícího." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1035.a: "Neprobereme podmínky u dezertu?" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1035.b: "Dost o mém zboží. Kde nakupuješ ty?" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1035.c: "Povím ti, jak jsem na tom vydělal své první jmění." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1036.t: "Balička" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1036.desc: "„Na každý vůz se vejde o třetinu víc [tgf_good.Custom('GetTradeGoodUnitPlural')],“ říká můj obchodník [tgf_trader.GetFirstName] a ukazuje mi jak. „Některé se cestou rozbijí a kupující si budou stěžovat. Většina ne.“\n\nVětšina je číslo, které se mi líbí. Některé je číslo, se kterým dokážu žít." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1036.a: "Naskládej je těsně. Zisk se vejde do mezer." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1036.b: "Zabal je pořádně. Kupující soudí podle prvního, které otevřou." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1036.c: "Nech to být. Zatím to fungovalo." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1037.t: "Tržní pečeť" # todo: NEW TRANSLATION
 TGF_SEALER_GLOSS: "Tržní úředník, který kontroloval kvalitu a správnou míru zboží a na to, které kontrolou prošlo, připevnil olověnou nebo voskovou pečeť. Mnohá města zakazovala prodávat látky a další zboží bez takové pečeti a pečetník si za každou účtoval poplatek." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1037.desc: "„Zboží s pečetí se prodává dráž. To ví každý,“ říká [tgf_sealer.GetFirstName], [Glossary( 'sealer', 'TGF_SEALER_GLOSS' )] na trhu v [tgf_source_county.GetNameNoTier], aniž by zvedl oči od [Select_CString(tgf_sealer.IsFemale,'její','jeho')] lavice. „Pečetím v pořadí, v jakém dostanu zaplaceno, ne v pořadí, v jakém mě kdo požádá.“\n\nMoje vozy se zbožím [tgf_good.Custom('GetTradeGood')] čekají na slunci. A s nimi i můj zisk." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1037.a: "Tak počkáme. Pečeť je pečeť." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1037.b: "Tady. A teď pečeť rychleji." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1037.c: "Mé jméno je dostatečná pečeť." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1038.t: "Zprostředkovatel" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1038.desc: "„Znám kupující, o kterých jsi nikdy neslyšel, ve městech, kam ses nikdy nepodíval,“ říká [tgf_broker.GetFirstName], zprostředkovatel na trhu v [tgf_source_county.GetNameNoTier], a nalévá mi číši, o kterou jsem nežádal. „Tvoje zboží [tgf_good.Custom('GetTradeGood')], jejich mince, můj podíl.“\n\nJsme tři. Jen jeden z nás dostává něco zadarmo." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1038.a: "Najdi je. Vezmi si svůj podíl." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1038.b: "Najdu si vlastní kupující, děkuji." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1039.t: "Obchodníkův učeň" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1039.desc: "„Tenhle počítá rychleji než já,“ říká můj obchodník [tgf_trader.GetFirstName] a postrčí kupředu vyzáblého mladíka jménem [tgf_youth.GetFirstName]. [tgf_youth.GetFirstNameNoTooltip] mi dřív, než se stačím zeptat, řekne cenu zboží [tgf_good.Custom('GetTradeGood')] na obou našich trzích.\n\nDůvtipné dítě stojí peníze. Důvtipné dítě, které pro mě pracuje, je zase vydělá zpátky." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1039.a: "[tgf_youth.GetFirstNameNoTooltip] zůstane se mnou." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1039.b: "Nech si toho mladíka, [tgf_trader.GetFirstNameNoTooltip]. Dobře ho vyuč." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1039.c: "Máme dost hladových krků." # todo: NEW TRANSLATION
 gdp_tgf_family_only_unity_desc: "Společnost zůstala v rodině" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1040.t: "Plavu v tom" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1040.desc: "Pozdě v noci patří skladiště jen mně: [tgf_good.Custom('GetTgfGoodLook')], navršené výš než nad mou hlavu. Nechávám první hrst proklouznout mezi prsty, jednu [tgf_good.Custom('GetTgfGoodSmallest')] po druhé.\n\nVkrádá se mi do hlavy myšlenka. Co kdybych se v tom... #EMP vykoupal?#!" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1040.a: "Skoč do toho jako šťastná kachna!" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1040.a.toast: "Tvrdý dopad" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1040.b: "Ne. Počítej to. Každou [tgf_good.Custom('GetTgfGoodSmallest')]." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1041.t: "První prodej" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1041.desc: "Při vyklízení staré truhly ji najdu, zabalenou v látce: první [tgf_good.Custom('GetTgfGoodSmallest')] [tgf_good.Custom('GetTradeGood')], který jsem kdy prodal. Před lety jsem ho koupil zpět za dvojnásobnou cenu.\n\nKdyž mě nikdo nevidí, podržím ho proti světlu a vyprávím mu, jak daleko jsme to dotáhli. Každá mince, kterou jsem od té doby vydělal, je jeho potomkem." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1041.a: "Zarámuj ho. Pověs ho tam, kde ho uvidím." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1041.b: "Relikvie mého vzestupu. Někdo za ni zaplatí." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1042.t: "Mince pod polštářem" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1042.desc: "„Dobrou noc, mince,“ říkám teď každý večer měšci pod polštářem: je v něm všechno, co mi letos vynesl můj [tgf_good.Custom('GetTradeGood')].\n\nJe to nejtvrdší polštář, jaký jsem kdy měl, a jediný, který stojí celé jmění." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1042.a: "Spi na něm. Spi na tom všem." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1042.b: "Pod polštářem k ničemu není. Nakup další [tgf_good.Custom('GetTradeGood')]." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1043.t: "Portrét s mincemi" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1043.desc: "„Vy u svého stolu. Na jedné straně váš [tgf_good.Custom('GetTradeGood')], na druhé vaše mince,“ říká [tgf_painter.GetFirstName], malíř, který projíždí [tgf_source_county.GetNameNoTier], a palci si mě rámuje. „Každou minci namaluji a každou [Glossary( 'counted', 'TGF_MONEYLENDER_PORTRAIT_GLOSS' )].“\n\nMám rád [tgf_painter.GetWomanMan], který umí počítat." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [tgf_painter.GetHerHis]
 gdp_trade_good_flavor.1043.a: "Namaluj ho. Každou minci." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1043.b: "Namaluj ty mince... #EMP větší.#!" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1043.c: "Malíř není zákazník." # todo: NEW TRANSLATION
 TGF_MONEYLENDER_PORTRAIT_GLOSS: "Obchodníci a směnárníci se rádi nechávali malovat při práci, obklopení svými mincemi a váhami. Petrus Christus v roce 1449 namaloval zlatníka, který snoubencům váží prsten." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1044.t: "Příliš těžký měšec" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1044.desc: "„Mám přivést druhého sluhu, [ROOT.Char.Custom('FormOfAddressForLiege')]?“ ptá se [tgf_servant.GetFirstName]. Můj měšec, plný peněz za letošní [tgf_good.Custom('GetTradeGood')], teď potřebuje vlastního sluhu, který ho ponese za mnou.\n\nZvažuji, že si pořídím vůz." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1044.a: "Ano. Dva sluhy. Ať jdou pomalu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1044.b: "Ne. Vůz. S mým jménem namalovaným na boku!" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1044.c: "Nejdřív přes trh s [tgf_good.Custom('GetTradeGood')], [tgf_servant.GetFirstNameNoTooltip]." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1045.t: "Zisk a zbožnost" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1045.desc: "Mé účetní knihy začínají [Glossary( 'the old way', 'TGF_DATINI_GLOSS' )], ve jménu [ROOT.Char.GetFaith.HighGodName] a zisku. Letos zaplnil zisk čtyřicet stran a [ROOT.Char.GetFaith.HighGodName] z něj nedostal ani jedinou minci.\n\nKaždý obchodník ví, že si společník zaslouží spravedlivý podíl." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1045.a: "Spravedlivý podíl pro mého nebeského společníka." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1045.b: "Klidná hodinka s [ROOT.Char.GetFaith.HighGodName] a pak zpátky k účtům." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1045.c: "[ROOT.Char.GetFaith.HighGodName] mi dal schopnost dělat tohle. Bylo by nezdvořilé přestat." # todo: NEW TRANSLATION
 TGF_SEVEN_YEARS_GLOSS: "V příběhu o Josefovi, který vypráví Tóra, Bible i Korán, se egyptskému vládci zdá o sedmi tučných kravách, které sežere sedm vyhublých. Josef sen vyloží jako sedm let hojnosti a sedm let hladu, a Egypt včas naplní své sýpky." # todo: NEW TRANSLATION
 TGF_DATINI_GLOSS: "Francesco Datini, obchodník z Prata, nadepisoval své účetní knihy slovy „Ve jménu Boha a zisku“ a zemřel jako jeden z nejbohatších mužů v Toskánsku." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1046.t: "Jeden z nich" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1046.desc: "„Polovina [tgf_source_county.GetNameNoTier] jsou [tgf_source_culture.GetCollectiveNoun], stejně jako já,“ říká mi můj obchodník [tgf_trader.GetFirstName]. „Dveře, které vám zůstávají zavřené, se přede mnou otevírají. Ceny, které vám nikdy neklesnou, mně klesají, protože jste [ROOT.Char.GetCulture.GetCollectiveNoun].“\n\n[tgf_trader.GetFirstNameNoTooltip] to myslí dobře. Rozhodnu se slyšet jen tu část o cenách." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1046.a: "Odteď budeš mluvit za nás." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1046.b: "Tady. Nenech nikoho, aby tě přetáhl." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1046.c: "Tak se naučím jejich způsoby." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1047.t: "Zaplavený trh" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1047.desc: "[tgf_rival.GetFirstName] z [tgf_rival.GetHouse.GetBaseNameNoTooltip] [tgf_rival.Custom('GetTgfCompanyWord')] prodává v [tgf_source_county.GetNameNoTier] [tgf_good.Custom('GetTradeGood')] za méně, než kolik stojí jeho doprava. Můj obchodník [tgf_trader.GetFirstName] zuří.\n\nJsem zvědavý. Za takovou cenu by to měl někdo kupovat. Nejlépe já." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1047.a: "Jestli to [tgf_rival.GetFirstNameNoTooltip] rozdává, vezmu si to." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1047.b: "Ať [tgf_rival.GetFirstNameNoTooltip] prodává se ztrátou. Můj [tgf_good.Custom('GetTradeGood')] vydrží." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1048.t: "Rukopis v balíku" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1048.desc: "Někdo v [tgf_source_county.GetNameNoTier] zabalil mou poslední [tgf_good.Custom('GetTradeGoodUnit')] [tgf_good.Custom('GetTradeGood')] do starých stránek, aby zůstala v suchu. Můj obchodník [tgf_trader.GetFirstName] je opatrně rozbaluje. „Kniha, nebo většina z ní. Někdo ji bude postrádat.“\n\nZaplatil jsem za [tgf_good.Custom('GetTradeGood')]. Knihu jsem dostal zdarma a může mít větší cenu." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [book]
 gdp_trade_good_flavor.1048.a: "Nechám si ji." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1048.b: "Prodej ji spolu s [tgf_good.Custom('GetTradeGood')]." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1048.c: "Pošli ji zpátky do [tgf_source_county.GetNameNoTierNoTooltip]." # todo: NEW TRANSLATION
 TGF_HOUSE_OF_WISDOM_GLOSS: "Knihy putovaly přes hranice v kupeckých vacích. V bagdádském Domě moudrosti učenci překládali řecká, perská a indická díla do arabštiny, odkud se mnohá dostala do latiny." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1049.t: "Obchodníci z domova" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1049.desc: "Můj obchodník [tgf_trader.GetFirstName] píše z [tgf_source_county.GetNameNoTier]. „Je tu celá [Glossary( 'quarter', 'TGF_DIASPORA_GLOSS' )] [ROOT.Char.GetCulture.GetCollectiveNoun], daleko od domova, po kterém se jim stýská. Doma každý zná jméno [ROOT.Char.GetHouse.GetBaseNameNoTooltip]. Když ho tady uslyší, seběhnou se kolem.“\n\nUkazuje se, že stesk po domově je obchodní příležitost." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1049.a: "Prodávej jim za stejné ceny jako doma." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1049.b: "Přiveď nejstaršího z nich do mé společnosti." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1049.c: "Za chuť domova stojí za to si připlatit." # todo: NEW TRANSLATION
 TGF_DIASPORA_GLOSS: "Obchodníci usazení v cizině si zakládali vlastní čtvrti: Sogdijci podél Hedvábné stezky, Benátčané v Konstantinopoli, židovští obchodníci od Káhiry po Aden. Jejich příbuzní doma s nimi obchodovali." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1050.t: "Cesta [tgf_good.GetNameNoTooltip]" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1050.desc: "Představili mi [tgf_smuggler.GetFirstName], [Glossary( 'smuggler', 'TGF_SMUGGLER_GLOSS' )] z [tgf_source_county.GetNameNoTier], který má jeden trik: vrchní [tgf_good.Custom('GetTradeGoodUnit')] na každém voze je ten nejhorší na prodej — [tgf_good.Custom('GetTgfGoodFlaw')] — takže výběrčí daní [tgf_market_holder.Custom('CZ_TitledFirstName_G')] nikdy nepátrají hlouběji.\n\n„Za poloviční tržní cenu,“ říká [tgf_smuggler.GetFirstNameNoTooltip]. „Pod vrchní [tgf_good.Custom('GetTradeGoodUnit')] je všechno prvotřídní.“" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1050.a: "Poloviční cena je moje nejoblíbenější cena." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1050.a.toast: "Zpráva se donesla" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1050.b: "[tgf_market_holder.GetTitledFirstNameNoTooltip] ti bude vděčný. Za tvou hlavu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.1050.c: "Obelstít výběrčí daní? Jsi přijat." # todo: NEW TRANSLATION
 TGF_SMUGGLER_GLOSS: "Kdekoli vládci zdaňovali zboží, pašeráci jim proklouzli mezi prsty. Největší bohatství přinášela sůl, zdaněná téměř všude: Chuang Čchao, pašerák soli v říši Tchang, vedl povstání, které dobylo hlavní město Tchang, Čchang-an." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2001.t: "Bohatá sklizeň" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2001.desc: "Z [tgf_source_county.GetNameNoTier], kde nakupuji [tgf_good.Custom('GetTradeGood')], ke mně dorazila zpráva. Rolníci kultury [tgf_source_culture.GetName] sklidili úrodu, jaká se urodí jednou za generaci, a sýpky ji nemohou pojmout.\n\n" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2001.desc.livestock: "Z [tgf_source_county.GetNameNoTier], kde nakupuji [tgf_good.Custom('GetTradeGood')], ke mně dorazila zpráva. Pastevci kultury [tgf_source_culture.GetName] prožili rok, jaký se urodí jednou za generaci. Každý ohradník je plný a pro všechna zvířata není dost trávy.\n\n" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2001.desc.outro: "Jejich dobrý rok. Moje výhodná cena." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2001.a: "Zajisti cenu, dokud slaví." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2001.b: "Vyraz tam. Zjisti, jak to vypěstovali." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2001.b.livestock: "Vyraz tam. Zjisti, jak je rozmnožili." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2002.t: "Lovcův úlovek" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2002.desc: "„[tgf_good.Custom('GetTgfGoodGatherers')] z [tgf_source_county.GetNameNoTier] předčili sami sebe,“ říká mi můj obchodník [tgf_trader.GetFirstName]. „Celá sezónní zásoba [tgf_good.Custom('GetTradeGood')] v jediné dodávce, to nejlepší, co kdy poslali. Nabídky už se jen hrnou.“\n\nProdat všechno, nebo si nechat ten nejkrásnější kus? Obchodníkovo oblíbené dilema." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2002.a: "Prodej všechno, dokud je cena vysoká." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2002.b: "Nejlepší kus zůstane u mě." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2002.c: "Zaplav stánky. Ať si každý něco vezme." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2003.t: "Bohatá žíla" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2003.desc: "Můj obchodník [tgf_trader.GetFirstName] se vrací z cesty do [tgf_source_county.GetNameNoTier] s úsměvem na tváři. „Nová žíla — bohatá, mělká a všichni kopáči v hrabství se tlačí, aby na ní mohli pracovat. [tgf_good.Custom('GetTradeGood')] je dnes levný. Ještě levnější bude, když do té žíly investujeme.“\n\nNikdy jsem nezažil, že by nějaká žíla zůstala levná dlouho." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2003.desc.amber: "Můj obchodník [tgf_trader.GetFirstName] se vrací z cesty do [tgf_source_county.GetNameNoTier] s úsměvem na tváři. „Podzimní bouře vyplavily víc [tgf_good.Custom('GetTradeGood')], než kdo pamatuje, a každá rodina na pobřeží ho sbírá. [tgf_good.Custom('GetTradeGood')] je dnes levný. Ještě levnější bude, když #EMP my#! zaplatíme sběračům.“\n\nMoře nebývá tak štědré dlouho." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2003.a: "Investuj do dolů." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2003.a.amber: "Zaplať sběračům." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2003.b: "Nakup, dokud se vozy prohýbají." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2004.t: "Tajemství za tu cenu stojí" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2004.desc: "„Nová barva!“ Můj obchodník [tgf_trader.GetFirstName] přivezl vzorek až z [tgf_source_county.GetNameNoTier] a barvířská dílna přísahá, že nikdo jiný to tajemství nezná.\n\n" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2004.desc.ceramics: "„Nová glazura!“ Můj obchodník [tgf_trader.GetFirstName] přivezl vzorek až z [tgf_source_county.GetNameNoTier] a dílna přísahá, že nikdo jiný to tajemství nezná.\n\n" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2004.desc.outro: "Tajemství jsou drahá. Za výhradní tajemství se vyplatí zaplatit." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2004.a: "Řekni si o cenu. To tajemství bude moje." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2004.b: "Obdivuj ho, zapamatuj si ho a pokračuj dál." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2005.t: "Ochutnávka zboží" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2005.desc: "Obchodník musí znát své zboží. A tak ochutnávám vlastní [tgf_good.Custom('GetTradeGood')] — jednou z povinnosti, podruhé pro jistotu a pak už jen pro potěšení. K večeru je celá [tgf_good.Custom('GetTradeGoodUnit')] pryč.\n\nLahodné. [tgf_source_culture.GetCollectiveNoun] by za to zaplatili dvojnásobek." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2005.a: "Dvojnásobek. Zaplatí dvojnásobek." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2005.b: "Mmm. Čistě kvůli kvalitě. Ještě jeden kousek." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2006.t: "Vhodně se obléct" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2006.desc: "Chceš-li prodávat [tgf_good.Custom('GetTradeGood')], nos [tgf_good.Custom('GetTradeGood')]. Přicházím na trh oblečený do toho nejlepšího ze svých zásob a sleduji, jak se kupci dívají dvakrát.\n\nZboží mluví samo. Já ho jen nosím." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2006.a: "Padne mi. Nechám si ho." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2006.a.tt_furs: "Odteď nosíš svůj kožešinový plášť" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2006.a.tt_leather: "Odteď nosíš svůj kožený plášť" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2006.a.tt_silk: "Odteď nosíš svůj hedvábný plášť" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2006.a.tt_textiles: "Odteď nosíš svůj krásný plášť" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2006.b: "Nech zboží mluvit za sebe." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2007.t: "Nominální hodnota" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2007.desc: "„Nové [tgf_market_holder.Custom('GetCurrencyDenominationGlossPlural')] budou mít mou tvář,“ říká mi [tgf_market_holder.GetTitledFirstName], „a tvé [tgf_good.Custom('GetTradeGood')]. Chci stálé dodávky za přátelskou cenu.“\n\n[Select_CString(tgf_market_holder.IsFemale,'Její','Jeho')] tvář, můj kov, jedna mince. Historie si nás oba zapamatuje." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2007.a: "Přátelská cena! Vyraz mi první minci." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2007.b: "Plná cena. Mince jako mince." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2007.c: "Přátelská cena? Mám na práci důležitější věci." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2008.t: "Bez úhony" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2008.desc: "„Neztratil se ani jeden [tgf_good.Custom('GetTradeGoodUnit')],“ říká mi můj obchodník [tgf_trader.GetFirstName], nadmíru spokojený s [tgf_trader.GetHerselfHimself]. „Nic se nezkazilo, nic se nerozbilo, nic se neukradlo. Každý [tgf_good.Custom('GetTradeGoodUnit')] [tgf_good.Custom('GetTradeGood')] dorazil přesně v tom stavu, v jakém vyrazil.“\n\nTo není štěstí. To je dovednost a té se lze naučit." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2008.a: "Ukaž mi, jak jsi to zabalil." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2008.b: "Pečlivé ruce. Působivé." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2008.c: "Řekni to kupcům. Nepoškozené zboží se prodává za víc." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2009.t: "Ostatní [ROOT.Char.Custom('WomenMen')|U] Vidí Armády" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2009.desc: "Na [tgf_market_holder.GetTitledFirstName] přišla válka a válka spotřebuje [tgf_good.Custom('GetTradeGood')]. [Select_CString(tgf_market_holder.IsFemale,'Její','Jeho')] zásobovači nakupují všechno, co moje trasa uveze, a ptají se, kdy dorazí další zboží.\n\nOstatní [ROOT.Char.Custom('WomenMen')] vidí armády. Já vidím zákazníky." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2009.a: "Válka platí předem." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2009.b: "Výhody, písemně a hned." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2009.c: "Pamatuj, kdo tě vyzbrojil." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2010.t: "Cech klepe na dveře" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2010.desc: "Cech [tgf_source_culture.GetName] z [tgf_source_county.GetNameNoTier] mi píše velmi zdvořile. Mé ceny jsou nižší než jejich a rádi by se se mnou dohodli na společné ceně, než se někdo zraní.\n\nCechy klepou zdvořile, ale jen jednou." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2010.a: "Zaplať poplatek. Stanov cenu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2010.b: "Ať si zkusí, co chtějí." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2011.t: "Vládcové určují módu" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2011.desc: "Zprávy se šíří rychleji než povozy: [tgf_market_holder.GetTitledFirstName] měl na sobě mé [tgf_good.Custom('GetTradeGood')] před celým dvorem v [tgf_source_county.GetNameNoTier] a polovina dvořanů už se ptala, odkud pochází.\n\nVládcové určují módu. Obchodníci určují ceny." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [tgf_market_holder.GetHerHis]
 gdp_trade_good_flavor.2011.a: "Řekni všem, čí [tgf_good.Custom('GetTradeGood')] to bylo." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2011.b: "Zvyš cenu, dokud na něj zírají." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2012.t: "Ochutnávka zboží" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2012.desc: "[tgf_good.Custom('GetTradeGoodUnitPlural')] [tgf_good.Custom('GetTradeGood')] na mě zírají. Mám za sebou černý měsíc, hlava mi nedá pokoj a jsem obklopen tím nejlepším pitím, které se dá za peníze koupit.\n\nKontrola kvality. Nikdo se to nemusí dozvědět." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2012.a: "Kontrola kvality. Všechno." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2012.a.toast: "O jednu ochutnávku víc, než bylo třeba" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2012.b: "Ne. Zboží je zboží." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2013.t: "Zakázka na mistrovské dílo" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2013.desc: "„Dej mi své nejlepší [tgf_good.Custom('GetTradeGood')] a odměnu pro mistra,“ říká [tgf_crafter.GetFirstName], nejlepší [tgf_good.Custom('GetTgfGoodCrafter')] v [tgf_source_county.GetNameNoTier], „a vyrobím ti něco, co ještě nikdo neviděl.“\n\nMoje měšec zvažuje. Moje pýcha už souhlasila." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2013.a: "Odměna dohodnuta. Ohrom mě." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2013.b: "Mé zboží nepotřebuje žádné příkrasy." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2014.t: "Jejich pokrm, naše zboží" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2014.desc: "„Teď dávají tvé [tgf_good.Custom('GetTradeGood')] do svého [tgf_source_province.Custom('GetTgfLocalDish')],“ říká mi můj obchodník [tgf_trader.GetFirstName] a přitom ochutnává. „Dělají to všichni v [tgf_source_county.GetNameNoTier]. Kuchaři tomu říkají nový způsob a nikdo si už nevzpomíná na ten starý.“\n\nJeště jsem jejich [tgf_source_province.Custom('GetTgfLocalDish')] ani neochutnal. Nikdy jsem nebyl pyšnější." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2014.a: "Tak ať za ten nový způsob zaplatí." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2014.b: "Více povozů. Kuchaři mají hlad." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2015.t: "Placeno zbožím" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2015.desc: "„Chceme víc mincí,“ říká [tgf_spokesperson.GetFirstName] za [tgf_good.Custom('GetTgfGoodGatherers')] z [tgf_source_county.GetNameNoTier]. Místo toho jim nabídnu [tgf_good.Custom('GetTradeGood')].\n\n„Sami ho sbíráte,“ připomenu jim. „Copak ho nemáte rádi?“\n\nNemají." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2015.a: "Zaplať jim. Mincemi." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2015.b: "Dej jim podíl na zisku." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2015.c: "I zboží je mzda." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2016.t: "Peníze nesmrdí" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2016.desc: "„Smrdí to,“ říká kupec v [tgf_source_county.GetNameNoTier] a drží mé [tgf_good.Custom('GetTradeGood')] co nejdál od těla. Prý má [tgf_good.Custom('GetTgfGoodFlaw')|U].\n\nVezmu si od kupce minci a přičichnu k ní. [Glossary( 'It smells of nothing at all', 'TGF_PECUNIA_NON_OLET_GLOSS' )]." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2016.a: "Prodávej kupcům, kteří mají rýmu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2016.b: "Možná se dá něco udělat s tím zápachem?" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2016.c: "Drž minci pod nosem. Celý den." # todo: NEW TRANSLATION
 TGF_PECUNIA_NON_OLET_GLOSS: "#G Pecunia non olet#! — „peníze nesmrdí“. Říká se, že římský císař Vespasianus přidržel před nosem svého syna minci z daně za veřejné záchodky, aby mu to dokázal." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2017.t: "Sedm tučných let" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2017.desc: "Zdá se mi o sedmi tučných kravách a sedmi hubených[ROOT.Char.GetFaith.Custom('GetTgfSevenYearsRef')]. Probudím se a ještě před snídaní začnu počítat.\n\nAť budou hubená léta stát cokoli, mé [tgf_good.Custom('GetTradeGood')] bude stát víc." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2017.a: "Uskladni všechno. Každý poslední [tgf_good.Custom('GetTradeGoodUnit')]." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2017.b: "Nakup víc hned, dokud je levné." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2017.c: "Krávy nejsou účetní knihy. Zpátky do postele." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2018.t: "Něčí dobytek" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2018.desc: "Vyjdu ven a zjistím, že mi bránu blokuje celé stádo [tgf_good.Custom('GetTradeGood')]. Uprostřed něj se šklebí můj obchodník [tgf_trader.GetFirstName]. „[tgf_raider.GetFirstName], [Glossary( 'raider', 'TGF_CATTLE_RAID_GLOSS' )], je přivedl z pastvin [tgf_market_holder.GetTitledFirstNamePossessive]. Neptej se jak. Za polovinu tržní ceny.“\n\n[tgf_market_holder.GetFirstNamePossessiveNoTooltip|U] značka je na každém boku.\n\n„Značky,“ dodává [tgf_trader.GetFirstNameNoTooltip], „se dají změnit.“" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2018.a: "Výhodná koupě je výhodná koupě, ať je značka jakákoli." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2018.a.toast: "Někdo tu značku poznal" # todo: NEW TRANSLATION
 rival_tgf_bought_stolen_herd: "[TARGET_CHARACTER.GetShortUIName|U] vědomě koupil dobytek ukradený ze stád [CHARACTER.Custom('CZ_ShortUIName_G')]." # todo: NEW TRANSLATION
 rival_tgf_bought_stolen_herd_corresponding: "[CHARACTER.GetShortUIName|U] vědomě koupil dobytek ukradený ze stád [TARGET_CHARACTER.Custom('CZ_ShortUIName_G')]." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2018.b: "[tgf_market_holder.Custom('CZ_TitledFirstName_G')] mi za ten dobytek bude něco dlužit." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2018.c: "Rychle ho poraz." # todo: NEW TRANSLATION
 TGF_CATTLE_RAID_GLOSS: "Nájezdy na stáda sousedů byly starým sportem i vážnou záležitostí. Velký irský epos Táin Bó Cúailnge vypráví o válce vedené kvůli jedinému býkovi." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2019.t: "Žízeň na střízlivém dvoře" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2019.desc: "„Dvůr [tgf_market_holder.GetTitledFirstNamePossessive] nikdy nepije [tgf_good.Custom('GetTradeGood')],“ říká mi můj obchodník [tgf_trader.GetFirstName]. „[tgf_market_holder.GetTitledFirstNamePossessiveNoTooltip] dvůr si také objednal čtyřicet [tgf_good.Custom('GetTradeGoodUnitPlural')] od nás. Obojí je zřejmě pravda.“\n\nVíra [tgf_market_holder.GetFirstName] [Glossary( 'forbids the drinking', 'TGF_ABU_NUWAS_GLOSS' )]. Nic však nezakazuje účtovat přemrštěné ceny." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2019.a: "Označ sudy jako ocet." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2019.b: "Zdvojnásob cenu. Komu si budou stěžovat?" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2019.b.toast: "Další dodavatel" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2019.b.toast_good: "Zaplaceno v plné výši" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.2019.c: "Nestojí to za mou hlavu. Prodávej jinde." # todo: NEW TRANSLATION
 TGF_ABU_NUWAS_GLOSS: "Víno bylo na mnoha dvorech zakázané a na většině z nich oblíbené. Abú Nuvás, básník na dvoře chalífy Hárúna ar-Rašída, napsal některé z nejlepších arabských básní o víně." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3001.t: "Dokonalé kolo" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3001.desc: "Ucítím ho ve skladišti ještě dřív, než ho spatřím. Kolo sýra tak zralého a lahodného, že k němu nosiči napůl žertem postavili stráž. Napůl.\n\nProdej ho a vydělá na hostinu. Nech si ho a bude hostinou sám." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3001.a: "Střež ho vlastním životem." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3001.b: "Všechno má svou cenu. I dokonalost." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3002.t: "Slavná stížnost" # todo: NEW TRANSLATION
 TGF_EA_NASIR_GLOSS: "Nejstarší známá stížnost zákazníka: hliněná tabulka z Uru, stará už téměř tři tisíce let. Nanni na ní kárá obchodníka Ea-násira za dodávku nekvalitních měděných ingotů a pohrdavé zacházení se svým poslem." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3002.desc: "[tgf_market_holder.GetTitledFirstName] píše, že má měď je nekvalitní a mé ingoty lehké. Obojí je pravda.\n\n„Za koho mě máte, že se ke mně chováte s takovým [Glossary( 'contempt', 'TGF_EA_NASIR_GLOSS' )]?“\n\nPovažuji [tgf_market_holder.GetHerHim] za dobrého zákazníka. [tgf_market_holder.GetSheHe|U] už zaplatil." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3002.a: "[tgf_market_holder.GetSheHe|U] nakoupí znovu. Vždycky nakoupí." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [tgf_market_holder.GetSheHe]
 gdp_trade_good_flavor.3002.a.toast: "Už nikdy" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3002.a.toast_good: "[Select_CString(ROOT.Char.IsFemale,'Přišla','Přišel')] si pro další" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3002.b: "Má měď je pravá. Ať ji [tgf_market_holder.GetHerHim] otestuje!" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3002.b.toast_bad: "Přistižen při činu" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3002.b.toast_good: "Zkouška dopadla dobře" # todo: NEW TRANSLATION
 rival_tgf_light_ingots: "[TARGET_CHARACTER.GetShortUIName|U] prodal [CHARACTER.Custom('CZ_ShortUIName_A')] lehké ingoty a přísahal, že jsou pravé." # todo: NEW TRANSLATION
 rival_tgf_light_ingots_corresponding: "[CHARACTER.GetShortUIName|U] prodal [TARGET_CHARACTER.Custom('CZ_ShortUIName_A')] lehké ingoty a přísahal, že jsou pravé." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3002.c: "Omluv se a příště dodej lepší ingoty." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3003.t: "Placeno pepřem" # todo: NEW TRANSLATION
 TGF_PEPPER_GLOSS: "Pepř měl téměř cenu svého množství ve stříbře a často se jím platilo. V Londýně stanovily zákony krále Æthelreda kolem roku 1000 část cla pro německé obchodníky v pepři." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3003.desc: "Můj dlužník v [tgf_source_county.GetNameNoTier], [tgf_debtor.GetFirstName], už nemá žádné mince. Platí tedy místo nich [Glossary( 'pepper', 'TGF_PEPPER_GLOSS' )], [tgf_good.Custom('GetTradeGoodUnit')] po malém [tgf_good.Custom('GetTradeGoodUnit')], až můj stůl voní jako trh s kořením.\n\nPočítám to dvakrát. Není to špatná cena. A [tgf_debtor.GetFirstNameNoTooltip] nemůže být jediný." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [tgf_debtor.GetSheHe]
 gdp_trade_good_flavor.3003.a: "Odteď přijímám pepř." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3003.b: "Mince. Sežeň je, jak chceš." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3003.c: "Pracuj pro mě. Dluh počká." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3004.t: "Dopis plný stížností" # todo: NEW TRANSLATION
 TGF_GENIZA_GLOSS: "Dopisy obchodníků, po staletí hromaděné — jako ty uchované v káhirské genize, skladišti odložených písemností při synagoze — popisují středomořský obchod do nejmenších a rozhořčených podrobností. Nejvíc si stěžují obchodníci se lnem." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3004.desc: "Můj obchodník [tgf_trader.GetFirstName] prodal v [tgf_source_county.GetNameNoTier] všechny mé balíky lnu za dobrou cenu. [tgf_trader.GetHerHis|U] [Glossary( 'letter', 'TGF_GENIZA_GLOSS' )] to potvrzuje — jednou větou. Zbývajících čtyřicet si stěžuje na vlhkost, nosiče, kupce i mé balení.\n\nNejdřív zisk, potom brblání. Kdyby to bylo naopak, znepokojilo by mě to." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3004.a: "Jedna věta o zisku. Tu si přečtu dvakrát." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3004.b: "Čtyřicet řádků rad zdarma." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3005.t: "Cukrářské překvapení" # todo: NEW TRANSLATION
 TGF_SUBTLETY_GLOSS: "Výstavní dílo z cukru a mandlové pasty podávané mezi chody hostiny — hrady, lodě a zvířata vytvarovaná tak, aby ohromila hosty. Ty nejvelkolepější cukrářské výtvory byly stejně tak politickým prohlášením jako dezertem." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3005.desc: "„[tgf_market_holder.GetTitledFirstName] chce cukrového [ROOT.Char.Custom('GetRandomRegionalBird')],“ říká mi můj obchodník [tgf_trader.GetFirstName]. „Dvakrát většího než ve skutečnosti, s každým peřím zvlášť vypracovaným, na [Select_CString(tgf_market_holder.IsFemale,'její','jeho')] stole do půlky léta. [Glossary( 'subtlety', 'TGF_SUBTLETY_GLOSS' )], které korunuje [Select_CString(tgf_market_holder.IsFemale,'její','jeho')] hostinu.“\n\nCukr se rozpouští. Pověst přetrvá." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3005.a: "Vyrobím ho. Většího než ve skutečnosti." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3005.a.success: "Hostina ztichne" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3005.a.failure: "Pokřivený pták" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3005.b: "Hostinové ceny za hostinové kousky." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3005.c: "Prodávám cukr, ne sochy." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3006.t: "Roj" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3006.desc: "Včely přiletěly bez pozvání, usadily se mezi trámy a teď mi ve skladu vyrábějí med, aniž by platily nájem.\n\nNájemníci platící medem. Mohlo by to být horší — kdyby člověk nepočítal žihadla." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3006.a: "Med zadarmo. Co by se mohlo stát?" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3006.a.toast: "Dostáváš žihadlo!" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3006.b: "Nech je pracovat. Bez nájmu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3007.t: "Další konvice čaje" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3007.desc: "Jeden šálek, abych poznal zboží. Pak další, protože ten první zabral. O půlnoci jsem přepočítal tři účetní knihy a napsal dva dopisy a cítím se skvěle.\n\nBuď je to velmi kvalitní náklad, nebo velmi drahý zlozvyk." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3007.a: "Další konvici. Každé ráno." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3007.b: "Podávej ho celé společnosti." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3008.t: "Než se zkazí" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3008.desc: "Můj obchodník [tgf_trader.GetFirstName] otevře [tgf_good.Custom('GetTradeGoodUnit')] [tgf_good.Custom('GetTradeGood')] a zašklebí se. „Dostala se do toho říční mlha. Teď je to měkké — do konce týdne to zplesniví.“\n\nSušené ovoce vydrží roky. Mokré ovoce vydrží dny. Čas jsou peníze." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3008.a: "Znovu to usuš, a pořádně." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3008.b: "Nech to zkvasit. Říkej tomu víno." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3009.t: "Půlnoční olej" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3009.desc: "Olej v lampě dojde hodinu předtím, než skončí práce s účetními knihami, a tak pálím vlastní zásoby, ten kvalitní [tgf_good.Custom('GetTradeGood')] určený k prodeji. Nehoří o nic jasněji než zakalené zbytky, které vyhazujeme.\n\nNehoří jasněji. Přesto za něj kupci platí třikrát víc." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3009.a: "Prodávej zbytky do lamp a kvalitní olej na stůl." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3009.b: "Ať hoří dál. Účty mají přednost." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3009.c: "Do postele. Olej si také může odpočinout." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3010.t: "Ještě na stéble" # todo: NEW TRANSLATION
 TGF_IN_THE_BLADE_GLOSS: "Obilí koupené „ještě na stéble“ se platilo v době, kdy bylo na poli stále zelené, za cenu mnohem nižší, než jakou by přinesla sklizeň. Kazatelé a kanonističtí právníci tuto praktiku odsuzovali jako lichvu v přestrojení." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3010.desc.condemned: "Moje víra to nazývá lichvou. Moje účetní kniha slevou." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3010.desc.permitted: "Některé víry to nazývají lichvou. Ta moje prozíravostí." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3010.desc.intro: "„Teď je zelené, ale v létě bude zlaté,“ říká mi [tgf_peasant.GetFirstName] z [tgf_source_county.Custom('CZ_LandedNameNoTier_G')], celý po kolena v blátě. „Zaplaťte mi dnešní cenu za to, [Glossary( 'in the blade', 'TGF_IN_THE_BLADE_GLOSS' )], a sklizeň bude vaše.“\n\n" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3010.a: "Příští rok sklizeň za letošní cenu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3010.b: "Nech si úrodu, dokud nedozraje." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3011.t: "Proso staré deset let" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3011.desc: "Za novějšími zásobami nacházím [tgf_good.Custom('GetTradeGoodUnitPlural')] prosa z dávných let, zapomenuté a špatně spočítané. Každé zrnko je stále dobré. Proso vydrží.\n\nZásoby zadarmo z minulosti. To je to nejlepší dědictví." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3011.a: "Prodej ho. Mé minulé já by si to tak přálo." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3011.b: "Zabal ho na cestu. Proso vydrží." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3011.c: "Přepočítej celý sklad." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3012.t: "Leštěná, nebo ne" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3012.desc: "Leštěná rýže je bílá, lehká a žádoucí na každém vznešeném stole. Neloupaná rýže je těžká, hnědá a žádoucí všude jinde. Můj obchodník [tgf_trader.GetFirstName] chce vědět, jakým jsem kupcem.\n\nJsem takovým, který dostane zaplaceno." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3012.a: "Vylešti ji. Na vznešených stolech se platí víc." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3012.b: "Prodávej ji hnědou a levnou všem." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3012.c: "Vylešti tu nejlepší. Zbytek prodej hnědý." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3013.t: "Před půstem" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3013.desc: "„Brzy začíná [tgf_source_faith.Custom('GetTgfFastName')]!“ píše mi narychlo můj obchodník [tgf_trader.GetFirstName] z [tgf_source_county.Custom('CZ_LandedNameNoTier_G')]. „Po celé týdny se nikdo nedotkne masa — a potom nebudou chtít nic jiného.“\n\nHladový kupec nikdy nesmlouvá." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3013.desc_ramadan: "„Brzy začíná ramadán!“ píše mi narychlo můj obchodník [tgf_trader.GetFirstName] z [tgf_source_county.Custom('CZ_LandedNameNoTier_G')]. „Nikdo nejí až do západu slunce a po západu slunce nikdo nejí nic jiného než maso.“\n\nHladový kupec nikdy nesmlouvá." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3013.a: "Také se budu postit. Maso počká." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3013.b: "Nasol ho a počkej, až přijde hlad." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3013.c: "Prodej ho všechno na poslední hostině před půstem." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3014.t: "Podívej se mu na zuby" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3014.desc: "[tgf_dealer.GetFirstName|U], obchodník s koňmi, přísahá na všechno, co je mu svaté. „Jsou mu čtyři roky, příteli, nejvýš pět. Podívej se na tu srst!“ Srst má opravdu nádhernou. Všiml jsem si však, že od zubů mě [tgf_dealer.GetSheHe] pořád odvádí.\n\nŘíká se, že darovanému koni se na zuby nehledí. Tenhle ale darem není." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [tgf_dealer.GetSheHe]
 gdp_trade_good_flavor.3014.a: "Otevři mu tlamu. Podíváme se na ty zuby." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3014.b: "Ať je starý, jak chce, tenhle kůň je můj." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3014.c: "Tvé slovo platí. Přidej se k mé společnosti." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3015.t: "Vykrmit na trh" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3015.desc: "„Stádo dorazilo do [tgf_source_county.Custom('CZ_LandedNameNoTier_G')] vyhublé a unavené, jako by to byly jejich vlastní přízraky,“ vypráví mi můj obchodník [tgf_trader.GetFirstName]. „[tgf_market_holder.GetTitledFirstName] má poblíž dobrou pastvinu a nabízí nám ji. Samozřejmě za poplatek.“\n\nTučné se prodává. Tráva je levnější než tuk." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3015.a: "Zaplať za trávu. Prodej tučné kusy." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3015.b: "I vyhublá zvířata mají svou cenu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3016.t: "Telecí kůže pro písaře" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3016.desc: "[tgf_chaplain.GetTitledFirstName], kaplan [tgf_market_holder.Custom('CZ_TitledFirstName_G')], prochází mou koželužnou jako poutník, který si vybírá relikvie. „Když se tyhle kůže seškrábou do tenka, vydrží na nich svatá slova tisíc let,“ říká [tgf_chaplain.GetSheHe].\n\nTisíc let z mé kůže. Na jednu krávu to není špatné." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3016.a: "Vezmi si ty nejlepší jako dar." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3016.b: "Tak tedy pro písaře. Ať vydrží." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3016.c: "Raději bych prodával ševcům." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3017.t: "Nákup vlny ze střihu" # todo: NEW TRANSLATION
 TGF_WOOL_CLIP_GLOSS: "Cisterciácká opatství prodávala svou roční vlnu ze střihu italským a vlámským kupcům s několikaletým předstihem a přijímala peníze za rouno, které ještě ani nenarostlo. Mnohé kláštery se tím hluboce zadlužily." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3017.desc: "„[tgf_abbot.GetTitledFirstName] nám nabízí vlnu z [tgf_abbey.Custom('CZ_LandedNameNoTier_G')] na mnoho let dopředu,“ vypráví mi můj obchodník [tgf_trader.GetFirstName]. „[Glossary( 'Years of clip', 'TGF_WOOL_CLIP_GLOSS' )], zaplacená předem, dodávaná postupně po každém střihu. Chtějí peníze hned.“\n\nPlánují s velkým předstihem. Stejně tak obchodníci." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3017.a: "Peníze hned, vlna na celé roky." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3017.b: "Dávám přednost ovcím, které už jsou ostříhané." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3018.t: "Rostlinné jehně" # todo: NEW TRANSLATION
 TGF_VEGETABLE_LAMB_GLOSS: "Legenda opakovaná cestovateli i učenci: na Dálném východě roste rostlina, která na svém stonku plodí živá jehňata. Ta spásají trávu kolem sebe, dokud stonek nezvadne. Takto si lidé vysvětlovali bavlnu, vlnu rostoucí na rostlinách." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3018.desc: "[tgf_buyer.GetFirstName|U], kupec v [tgf_source_county.Custom('CZ_LandedNameNoTier_L')], s úžasem obrací chomáč mé bavlny v rukou. „Je to pravda? Prý roste na rostlině, která plodí malá jehňata. Ta se pasou, dokud stonek neuschne.“\n\n[Glossary( 'The vegetable lamb', 'TGF_VEGETABLE_LAMB_GLOSS' )]. Zázraky se prodávají." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3018.a: "Je to pravda, každé slovo. A je velmi vzácné." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3018.b: "Žádná jehňata. Jen velmi načechraná rostlina." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3019.t: "Spolia" # todo: NEW TRANSLATION
 TGF_SPOLIA_GLOSS: "Kámen odebraný ze starých staveb a znovu použitý v nových. Sloupy, řezby a popsané kamenné bloky ze starověkých zřícenin nacházely v celém středověkém světě nové využití v kostelech, hradbách i domech." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3019.desc: "„Kameníci přestali lámat kámen,“ přiznává mi můj obchodník [tgf_trader.GetFirstName] v dopise z [tgf_source_county.Custom('CZ_LandedNameNoTier_G')]. „Místo toho řežou kámen ze starých zřícenin — sloupy, řezby, všechno.“\n\n[Glossary( 'Spolia', 'TGF_SPOLIA_GLOSS' )]. Starý kámen, nová cena." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3019.a: "Starobylý kámen za starobylé ceny." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3019.b: "Nech si pro mě tu nejkrásnější řezbu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3020.t: "Kmen na stěžeň" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3020.desc: "„Lodní tesaři [tgf_market_holder.Custom('CZ_TitledFirstName_G')] chtějí naše [tgf_good.Custom('GetTradeGood')],“ říká mi můj obchodník [tgf_trader.GetFirstName]. „Ne ledajaké dřevo. Chtějí ty nejdelší a nejrovnější kmeny na stěžně. Vědí, že dokonalé dřevo je vzácné.“\n\nVzácné věci se nikdy nemají prodávat ve spěchu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3020.a: "Ten nejlepší kmen je pro mou vlastní loď." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3020.b: "Prodáno. Stěžně na nikoho nečekají." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3020.c: "Ať čekají. Cena poroste." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3021.t: "Stan plný kouře" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3021.t_bhang: "Šálek bhangu" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3021.t_hashish: "Sladkosti za zavřenými dveřmi" # todo: NEW TRANSLATION
 TGF_HEMP_TENT_GLOSS: "Hérodotos psal, že Skythové házeli konopná semena na rozžhavené kameny v uzavřených plstěných stanech a v oblacích kouře radostně výskali. Stepní národy tento zvyk zachovaly ještě dlouho poté." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3021.desc: "[tgf_hemp_host.GetSheHe|U] hází konopná semena na rozpálené kameny ve [tgf_hemp_host.GetHerHis] stanu a stoupá z nich kouř. „[Glossary( 'Breathe', 'TGF_HEMP_TENT_GLOSS' )], kupče. Takhle se u nás obchoduje.“\n\nSamozřejmě čistě z obchodních důvodů." # todo: NEW TRANSLATION
 TGF_HEMP_BHANG_GLOSS: "Atharvavéda uvádí bhang mezi pěti posvátnými rostlinami. Konopné listy se melou s mlékem, ghí a kořením na nápoj, který se pije při slavnostech a obětuje Šivovi." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3021.desc_bhang: "[tgf_hemp_host.GetSheHe|U] rozemele konopné listy s mlékem a kořením a podá mi šálek. „[Glossary( 'Bhang', 'TGF_HEMP_BHANG_GLOSS' )], kupče. O slavnostech ho pije celé město. Dnes večer i ty.“\n\nBylo by neslušné odmítnout, a neslušnost škodí obchodu." # todo: NEW TRANSLATION
 TGF_HEMP_HASHISH_GLOSS: "Hašiš, konopná pryskyřice konzumovaná v pastách a sladkostech, se od dvanáctého století rozšířil po Egyptě a Sýrii. Někteří súfijové jej chválili jako cestu k extázi, zatímco právníci jej odsuzovali a vládci nechávali vypalovat celá pole." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3021.desc_hashish: "[tgf_hemp_host.GetSheHe|U] zavře dveře a rozbalí malou sladkost z lisované konopné pryskyřice. „[Glossary( 'Hashish', 'TGF_HEMP_HASHISH_GLOSS' )], kupče. Právníci se na něj mračí. Ale nejsou tady.“\n\nBylo by neslušné odmítnout kupce." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3021.desc.intro: "„[tgf_good.Custom('GetTradeGood')|U] [tgf_good.Custom('GetTgfHempUse')]?“ zasměje se [tgf_hemp_host.GetTitledFirstName] v [tgf_source_county.Custom('CZ_LandedNameNoTier_L')]. „My pro [tgf_good.Custom('GetTgfGoodItThem')] máme lepší využití.“\n\n" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3021.a: "Obchod je obchod. Podej mi ta semena." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3021.a_bhang: "Obchod je obchod. Podej mi ten šálek." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3021.a_hashish: "Obchod je obchod. Podej mi ty sladkosti." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3021.b: "Prodej to. Já si zachovám čistou hlavu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3021.a.toast_habit: "Nový zlozvyk" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3022.t: "Čepel z mého nejlepšího železa" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3022.desc: "Kovář z [tgf_source_county.Custom('CZ_LandedNameNoTier_G')] jménem [tgf_smith.GetFirstName] zváží na [Select_CString(tgf_smith.IsFemale,'její','jeho')] dlani jeden z mých železných ingotů a usměje se. „Dej mi ten nejlepší a já ti vykovám čepel, která bude mít desetkrát větší cenu než ten kov.“\n\nDesetkrát větší. [tgf_smith.GetSheHe|U] ví, jak mluvit s kupcem." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3022.a: "Vykovej ji. Ať ta chlouba stojí za to." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3022.b: "Nauč mě, které ingoty jsou nejlepší." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3023.t: "Tvrzení lapidária" # todo: NEW TRANSLATION
 TGF_LAPIDARY_GLOSS: "Brusič a leštič drahokamů, často také znalec lapidárií: knih popisujících skryté síly jednotlivých kamenů, od safírů proti jedu po ametysty proti opilosti." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3023.desc: "[tgf_lapidary.GetFirstName|U], [Glossary( 'lapidary', 'TGF_LAPIDARY_GLOSS' )] z [tgf_source_county.Custom('CZ_LandedNameNoTier_G')], drží jeden z mých drahokamů proti světlu s velkou vážností. „Tento kámen chrání před neduhem [ROOT.Char.Custom('GetTgfAilment')]. Píše se to v knihách.“\n\nV ceně se to ještě nepíše. Zatím." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3023.a: "Prodám i s nárokem. Cena tomu odpovídá." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3023.b: "Přidej se k mé společnosti. Přines své účetní knihy." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3023.c: "S účetními knihami se přít nebudu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3024.t: "Kámen gentlemana" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3024.desc: "[tgf_connoisseur.GetFirstName|U], znalec nefritu, poklepává každým z mých kusů o [Select_CString(tgf_connoisseur.IsFemale,'její','jeho')] zuby a poslouchá. Dva [tgf_connoisseur.GetSheHe] odloží stranou. „Mastek. Velmi dobrý mastek.“ Zbytek ocení pomalým, uznalým přikývnutím.\n\n[tgf_connoisseur.GetWomanMan], který pozná pravé od falešného, má větší cenu než obojí." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3024.a: "Rozbij padělky. A zjisti jméno dodavatele." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3024.b: "Přidej se k mé společnosti. Za tvůj úsudek ti zaplatím." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3024.c: "Nauč mě ten trik se zuby." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3025.t: "Porcelánová zátěž" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3025.desc: "Můj obchodník, [tgf_trader.GetFirstName], je se [tgf_trader.GetHerselfHimself] velmi spokojený. „Loď potřebovala zátěž — a naše [tgf_good.Custom('GetTradeGoodUnitPlural')] s keramikou jsou těžké. Kapitán nám za přepravu naúčtoval skoro nic.“\n\nNáklad, který si zaplatí vlastní přepravu. Můj nejoblíbenější druh." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3025.a: "Ulož ušetřené peníze do dalšího nákladu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3025.b: "Nauč se ukládat zboží jako zátěž." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3026.t: "Míza pálí" # todo: NEW TRANSLATION
 TGF_LACQUER_CURE_GLOSS: "Lak na vzduchu neschne. Každá vrstva stromové mízy musí několik dní tvrdnout v teplé, vlhké místnosti a na kvalitní kus je potřeba desítek vrstev. Dokud míza neztvrdne, způsobí na každé kůži, které se dotkne, puchýře." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3026.desc: "Nové [tgf_good.Custom('GetTradeGoodUnitPlural')] s lakovaným zbožím dorazily dřív, než poslední vrstva [Glossary( 'cured', 'TGF_LACQUER_CURE_GLOSS' )]. Povrch vypadá dokonale — hluboký, lesklý, téměř mokrý. Prsty mě svrbí touha ho vyzkoušet.\n\nLakýrníci říkají, že míza pálí. Tuším, že přehánějí." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3026.a: "Postav vlhkou místnost, aby lak řádně vytvrdl." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3026.b: "Jeden dotek. Jen pro jistotu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3026.b.toast_rash: "Lak pálí" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3026.c: "Nech ho vytvrdnout. Na dobré věci se čeká." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3027.t: "Kameny na čtení" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3027.desc.intro: "Sklenář z [tgf_source_county.Custom('CZ_LandedNameNoTier_G')] jménem [tgf_glassmaker.GetFirstName] pokládá na mou účetní knihu dva vyleštěné kameny. Drobounká čísla se zvětší, jsou ostrá a černá. „Pro staré oči, příteli. Nebo unavené.“\n\n" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3027.desc.old_eyes: "Mé oči jsou obojí. Po letech si poprvé dokážu přečíst drobné písmo ve všech smlouvách." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3027.desc.young_eyes: "Mé oči nejsou ani jedno. Ale teď dokážu přečíst drobné písmo ve všech smlouvách." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3027.a: "Jednu dvojici pro mě. Pečlivě je zabal." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3027.b: "Pošli jednu dvojici [tgf_market_holder.Custom('CZ_TitledFirstName_A')]." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3027.c: "Ne ty kameny. Jejich tajemství." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3028.t: "Ceny ve sváteční dny" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3028.desc.christian: "„Blíží se svaté dny,“ říká mi můj obchodník [tgf_trader.GetFirstName], čerstvě se vrátivší z [tgf_source_county.Custom('CZ_LandedNameNoTier_G')]. „Každý kupec chce kadidlo hodné mudrců a nikdo nesmlouvá o tom, co pálí na oltáři.“\n\n" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3028.desc: "„Blíží se svaté dny,“ říká mi můj obchodník [tgf_trader.GetFirstName], čerstvě se vrátivší z [tgf_source_county.Custom('CZ_LandedNameNoTier_G')]. „Každý kupec chce kadidlo hodné nejposvátnější svatyně a nikdo nesmlouvá o tom, co pálí na oltáři.“\n\n" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3028.desc.outro: "Kupec, který nesmlouvá, je dar od [ROOT.Char.GetFaith.HighGodName]." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3028.a: "Něco si sám spálím při oslavách." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3028.b: "Chrám dostane první výběr za nákladovou cenu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3028.c: "Sváteční dny, sváteční ceny." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3029.t: "Teriak" # todo: NEW TRANSLATION
 TGF_THERIAC_GLOSS: "Známý všelék připravovaný z desítek přísad, mezi nimiž bývalo často i zmijí maso a opium, a ponechávaný léta zrát. Lékaři ho předepisovali proti jedu, moru a téměř všemu ostatnímu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3029.desc: "[tgf_apothecary.GetFirstName|U], lékárník z [tgf_source_county.Custom('CZ_LandedNameNoTier_G')], posílá dopis, který voní po bylinách. „Vaše zásoby jsou přesně to, co potřebuji na [Glossary( 'theriac', 'TGF_THERIAC_GLOSS' )]. Proti jedu, moru i všem ostatním neduhům.“\n\nJestli zabere, to je mezi [tgf_apothecary.GetHerHim] a [Select_CString(tgf_apothecary.IsFemale,'její','jeho')] pacienty. Mým úkolem je prodávat." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3029.a: "Připrav ho a prodávej podél mých cest." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3029.b: "Všech šedesát čtyři přísad. Ode mě." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3029.c: "Nauč mě recept. A dej mi jednu dávku." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3030.t: "Na listiny žádný papír" # todo: NEW TRANSLATION
 TGF_PAPER_GLOSS: "V roce 1231 zakázal císař Fridrich II. notářům ve svém Sicilském království psát veřejné listiny na papír, který považoval za příliš křehký, než aby se mu dalo důvěřovat. Stačil jedině pergamen." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3030.desc: "„Písaři [tgf_market_holder.Custom('CZ_TitledFirstName_G')] [Glossary( 'will not touch paper', 'TGF_PAPER_GLOSS' )], pokud jde o cokoli úředního,“ říká mi můj obchodník [tgf_trader.GetFirstName], který se vrátil z [tgf_source_county.Custom('CZ_LandedNameNoTier_G')] a pořád je znechucený. „Prý jedině pergamen. Jako by byl svatý.“\n\nProti každému pravidlu se dá protestovat." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3030.a: "Vysvětli jim to. Papír je budoucnost." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3030.a.success: "Kancelář přijme papír" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3030.a.failure: "Kancelář zůstane u pergamenu" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3030.b: "Tak si koupí můj pergamen." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3030.c: "Tak zjistím, co vlastně chtějí." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3031.t: "Gruit, nebo chmel" # todo: NEW TRANSLATION
 TGF_GRUIT_GLOSS: "Směs bylin, například rojovníku bahenního a řebříčku, která před chmelem dodávala pivu chuť a pomáhala ho uchovávat. Mnozí vládci měli výhradní právo ji prodávat, a tak zdaňovali každou várku." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3031.desc: "„Chmel,“ šeptá nad mými sudy [tgf_brewer.GetFirstName], sládek z [tgf_source_county.Custom('CZ_LandedNameNoTier_G')]. „Pivo, které vydrží celé měsíce. A chmel nikdo nemůže zdanit.“ V [tgf_source_county.Custom('CZ_LandedNameNoTier_L')] musí každý sládek kupovat [tgf_market_holder.Custom('CZ_TitledFirstName_G')] [Glossary( 'gruit', 'TGF_GRUIT_GLOSS' )] a odvádět z něj [Select_CString(tgf_market_holder.IsFemale,'její','jeho')] daň.\n\nZa pokrok vždy někdo zaplatí." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3031.a: "Tak tedy chmel. Ať se rozšíří." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3031.b: "Gruit, jak si [tgf_market_holder.GetTitleAsNameNoTooltip|l] přeje." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3031.c: "Trochu obojího do každého sudu." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3032.t: "Košík ovoce" # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3032.desc: "V [tgf_source_county.Custom('CZ_LandedNameNoTier_L')] se [tgf_fruit_province.Custom('get_region_fruit_plural')] jedí po koších a sotva se dostanou dál než do sousední vesnice.\n\nSušené by vydržely. Přepravované by se prodaly. Jedno ochutnám a sáhnu po účetní knize." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3032.a: "Zjisti, kdo je pěstuje a kolik jich má." # todo: NEW TRANSLATION
 gdp_trade_good_flavor.3032.b: "Ještě jeden. Pro výzkum." # todo: NEW TRANSLATION
