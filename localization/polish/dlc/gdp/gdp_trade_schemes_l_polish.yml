 gdp_improve_trade_capacity_decision_desc: "Vím, že některé zboží musíme nechávat za sebou, protože naši obchodníci nemají dost místa, aby je přepravili. Díky několika investicím a úpravám je jen otázkou času, než budeme moci rozšířit své působení na všech trzích, které navštěvujeme." # todo: NEW TRANSLATION
 gdp_improve_trade_capacity_decision_tooltip: "Zahájit [GetScheme('gdp_improve_trade_capacity').GetTypeName] [Concept('scheme','intriku')|E] na vybrané [Concept('trade_route','obchodní trasu')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
