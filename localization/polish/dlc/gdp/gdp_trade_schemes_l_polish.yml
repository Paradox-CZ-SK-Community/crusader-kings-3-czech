 gdp_improve_trade_expertise_decision: "Obchodní intrika: odbornost" # todo: NEW TRANSLATION
 gdp_improve_trade_expertise_decision_desc: "Moji obchodníci mi říkají, že na některých obchodních trasách pořád dokola opakujeme stejné chyby. Je načase poučit se ze svých zkušeností a zajistit, aby naše trasy fungovaly co nejefektivněji." # todo: NEW TRANSLATION
