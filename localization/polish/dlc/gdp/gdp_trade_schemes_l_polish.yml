 gdp_improve_trade_competitiveness_decision: "Obchodní intrika: konkurenceschopnost" # todo: NEW TRANSLATION
 gdp_improve_trade_competitiveness_decision_desc: "Na některých trzích, které moji obchodníci pravidelně navštěvují, panuje tvrdá konkurence. Když pošlu pár mincí do správných rukou a uzavřu několik drobných dohod s místními, dostanou moji obchodníci přednost před konkurencí." # todo: NEW TRANSLATION
 gdp_improve_trade_competitiveness_decision_tooltip: "Zahájit [GetScheme('gdp_improve_trade_competitiveness').GetTypeName] [Concept('scheme','intriku')|E] na vybrané [Concept('trade_route','obchodní trasu')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
