 gdp_trade_scheme.0012.desc_capacity: "[disrupted_trade_route.GetName|U] bude mít nedostatek prostoru k přepravě veškerého zboží jako dřív. Ať [target.GetShortUIName] přemýšlí, proč už [Select_CString(target.IsFemale,'její','jeho')] účetní knihy nesedí." # todo: NEW TRANSLATION
