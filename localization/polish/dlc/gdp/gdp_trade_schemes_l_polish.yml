 gdp_trade_scheme.0002.desc: "[improved_trade_route.GetName|U] konečně funguje tak, jak měla odjakživa. Obchodníci mi oznámili, že konečně převážíme více zboží, jak jsem doufal." # todo: NEW TRANSLATION
 gdp_trade_scheme.0002.a: "Stálo to za každou minci." # todo: NEW TRANSLATION
 gdp_trade_scheme.0003.t: "[scheme.GetNameNoTooltip]: Neúspěch" # todo: NEW TRANSLATION
 gdp_trade_scheme.0003.desc: "Přes veškerou mou snahu funguje obchodní trasa přesně jako dřív. Je to k vzteku, ale někdy je zkrátka takový trh." # todo: NEW TRANSLATION
 gdp_trade_scheme.0003.a: "Zpátky k účetním knihám." # todo: NEW TRANSLATION
 gdp_trade_scheme.0004.t: "$gdp_improve_trade_competitiveness$: Úspěch" # todo: NEW TRANSLATION
 gdp_trade_scheme.0004.desc: "[improved_trade_route.GetName|U] konečně vydělává tolik, kolik jsem doufal. Moji obchodníci dostávají přednost před konkurencí a vyděláváme víc než dřív." # todo: NEW TRANSLATION
 gdp_trade_scheme.0004.a: "Laskavosti byly dobře vynaloženy." # todo: NEW TRANSLATION
