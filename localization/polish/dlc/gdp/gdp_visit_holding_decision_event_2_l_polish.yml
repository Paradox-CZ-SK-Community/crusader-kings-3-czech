 gdp_visit_holding_decision_event.1500.d: "Je tamhle kazatel?" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.d_second: "S [merchant_physician_recruit.GetFirstNameNoTooltip] mám ještě nevyřízené záležitosti." # todo: NEW TRANSLATION
