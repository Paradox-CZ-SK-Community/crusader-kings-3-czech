 gdp_visit_holding_decision_event.1501.treatment_failure.t: "Neúspěšná léčba" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1501.treatment_failure.desc: "Léčba selže" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1501.treatment_success.t: "Úspěšná léčba" # todo: NEW TRANSLATION
