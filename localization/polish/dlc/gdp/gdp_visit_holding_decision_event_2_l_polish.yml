 gdp_visit_holding_decision_event.1507.desc_returned_01: "Dveře do pracovny [merchant_physician_recruit.Custom('CZ_TitledFirstName_G')] jsou pootevřené a škvírou pozoruji [merchant_physician_recruit.GetFirstNameNoTooltip], jak stříhá vlasy klientovi, který sedí naprosto nehybně. Používá při tom děsivě ostré a úzké nůžky.\n\nZaklepu na dveře a vstoupím, čímž upoutám lékařovu pozornost: „To je ale plížení. Co jste chtěl?“" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [merchant_physician_recruit.GetFirstName]; navyše [merchant_physician_recruit.GetTitledFirstName]
 gdp_visit_holding_decision_event.1507.desc_returned_02: "[merchant_physician_recruit.GetFirstName] stojí před svými dveřmi a prohlíží rameno nějakého [ROOT.Char.GetWomanMan], který zjevně trpí bolestí.\n\n[merchant_physician_recruit.GetSheHe|U] ukončí vyšetření, podá pokyny, jak kloub nejlépe léčit, a pak se ke mně otočí: „Už jste zpátky. Chtěl jste tentokrát něco?“" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [merchant_physician_recruit.GetHerHis]
 gdp_visit_holding_decision_event.1507.desc_returned_03: "Opatrně stoupám po schodech do pracovny [merchant_physician_recruit.Custom('CZ_TitledFirstName_G')] a nahlédnu otevřenými dveřmi dovnitř.\n\n[merchant_physician_recruit.GetSheHe|U] se zřejmě věnuje nějakému tělesnému cvičení a pořádně se při něm potí; opakovaně dělá dřepy, vstává a začíná znovu.\n\nPo určitém počtu opakování [merchant_physician_recruit.GetSheHe] přestane, otře si čelo a napije se z nedaleké lahve. [Select_CString(merchant_physician_recruit.IsFemale,'Její','Jeho')] nyní bystré oči se zaměří na mě: „Vy jste ale neodbytný, což?“" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [merchant_physician_recruit.GetFirstName], [merchant_physician_recruit.GetHerHis], [merchant_physician_recruit.Get
 gdp_visit_holding_decision_event.1507_desc_intro: "Následuji [merchant_physician_recruit.GetFirstName] úzkou uličkou, po schodech vzhůru a do jeho pracovny. Místnost je od podlahy ke stropu přeplněná policemi s náboženskými texty a spisy o tělesných šťávách, zdraví a duchovnu.\n\n[merchant_physician_recruit.GetSheHe|U] se posadí na jedinou židli za stolem, nepřítomně hladí malý talisman a teprve pak si všimne mé přítomnosti: " # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [merchant_physician_recruit.GetHerHis]
 gdp_visit_holding_decision_event.1507.desc_reused_physician: "$gdp_visit_holding_decision_event.1507_desc_intro$„Ach. Neviděl jsem vás už někde? Co chcete?“\n\nPečlivě zvažuji svá slova, než odpovím:" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1507.desc: "$gdp_visit_holding_decision_event.1507_desc_intro$„Ach. Vy. Chtěl jste něco?“\n\n„Viděl jsem vaši přednášku pro ty méně šťastné,“ odpovím a před pokračováním se zarazím:" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1507.a: "„Nechtěl byste pro mě pracovat?“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1507.b: "„Pomozte mi posílit ducha mých společníků!“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1507.c: "„Musíte své dovednosti #EMP využívat#!, abyste neztratil cvik. Přidejte se k mé družině.“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1507.c.success: "[merchant_physician_recruit.GetShortUIName] souhlasí s vaším hodnocením" # todo: NEW TRANSLATION
