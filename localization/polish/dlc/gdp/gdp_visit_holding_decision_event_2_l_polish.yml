 gdp_visit_holding_decision_event.1503.t: "$gdp_visit_holding_decision_event.1500.t$: [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1503.desc_returned_01: "Když se vrátíme do [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship], právě skončilo kázání. [merchant_clergy_character.Custom('SisterBrother')|U] [merchant_clergy_character.GetFirstName] obchází místnost s koštětem, jemně uklízí a připravuje svatou půdu pro návštěvníky, kteří sem přicházejí rozjímat a modlit se.\n\n[merchant_clergy_character.GetSheHe|U] ke mně vzhlédne a na rtech se [Select_CString(merchant_clergy_character.IsFemale,'její','jeho')] objeví něžný úsměv: „Vítejte zpátky v [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodHerHis|U] vřelém objetí. Proč tu chvíli nezůstat a nepokochat se výhledem?“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1503.desc_returned_02: "Když znovu vstoupím do [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship], [merchant_clergy_character.Custom('SisterBrother')|U] [merchant_clergy_character.GetFirstName] sedí na jedné z lavic obrácených ke kazatelně a zdánlivě se oddává rozjímání.\n\n[merchant_clergy_character.GetSheHe|U] otočí hlavu mým směrem a přes rameno se na mě podívá, když se přiblížím: „Jste samá práce. Nechte své unavené nohy chvíli odpočinout, dítě mé. Jak vám mohu posloužit?“" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [merchant_clergy_character.GetHerHis], [merchant_clergy_character.GetHerHis]
 gdp_visit_holding_decision_event.1503.desc_reused_clergy: "Když vstoupím do pozoruhodné brány [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship], [GetTrait('devoted').GetNameNoTooltip( merchant_clergy_character )|l]ové, kteří se o toto místo starají, právě dokončili dnešní práci.\n\nPodívám se hlavní lodí a nečekaně poznám [merchant_clergy_character.Custom('SisterBrother')] [merchant_clergy_character.GetFirstName], který mi na oplátku věnuje nečitelný pohled a vykročí ke mně: „Mé zatoulané dítě. [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] tě bezpečně přivedl zpět k našemu prahu!“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1503.desc: "Když procházím branou [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship], ohromí mě, kolik práce muselo dát vybudování těch nádherných staveb a posvátné výzdoby.\n\nJeden z [GetTrait('devoted').GetNameNoTooltip( merchant_clergy_character )|l]ů, kteří se o toto místo starají, si mě všimne a klidně ke mně přistoupí: „Zdravím tě, dítě mé. Jsem [merchant_clergy_character.Custom('SisterBrother')] [merchant_clergy_character.GetFirstName]. Jak ti mohu pomoci?“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1503.desc_outro: "$ep3_laamp_decision_event.1043.desc_outro$" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1503.desc_outro_thief: "$ep3_laamp_decision_event.1043.desc_outro_thief$" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1503.desc_return_outro_thief: "$ep3_laamp_decision_event.1043.desc_return_outro_thief$" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1503.desc_return_outro: "$ep3_laamp_decision_event.1043.desc_return_outro$" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1503.a: "$ep3_laamp_decision_event.1043.a$" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1503.a.flavor_unzealous: "To #EMP asi#!..." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1503.b: "„Co kdyby [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] požehnal našemu obchodu?“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1503.c: "Zjevně #EMP já#! tyto dary potřebuji." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1503.c_guarded: "Ještě jeden dar do #EMP mé#! kapsy." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1503.c_master_thief: "„Psst, [visiting_partner.GetFirstNameNoTooltip], hlídej!“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1503.c.flavor: "Odveď pozornost, ukradni pár mincí. Snadné." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1503.c.flavor_guarded: "Hmm. Z nějakého důvodu tu stráže obcházejí okolí mnohem častěji..." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1503.c.thievery_success.t: "Úspěšná krádež" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1503.c.thievery_success.desc: "Úspěšně ukradneš dary" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1503.c.thievery_failure.t: "Vyhoštění!" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1503.c.thievery_failure.desc: "Jsi vyhoštěn z [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1503.c.thievery_critical_failure.t: "Přivolány stráže" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1503.c.thievery_critical_failure.desc: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1503.d: "$ep3_laamp_decision_event.1021.d$" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1504.t: "$gdp_visit_holding_decision_event.1503.t$" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1504.desc_epiphany: "Když předávám dar, oči [merchant_clergy_character.Custom('CZ_TitledFirstName_G')] se rozšíří šokem: „Vy... vypadáte úplně jako [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodHerHis|U]... [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodHerHis|U]... přísahám...“ [merchant_clergy_character.GetSheHe] na mě chvíli zírá a bezradně otevírá a zavírá ústa jako ryba na suchu.\n\nPak si [merchant_clergy_character.GetFirstNameNoTooltip] uvědomí, co dělá, vzpamatuje se a odkašle si: „Bude mi ctí věnovat #EMP svůj#! život vaší věci.“" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [merchant_clergy_character.GetFirstName], [merchant_clergy_character.GetHerHis], [merchant_clergy_character.GetHer
 gdp_visit_holding_decision_event.1504.desc: "Úsměv [merchant_clergy_character.Custom('CZ_TitledFirstName_G')] se rozšíří a [merchant_clergy_character.GetSheHe] se nakloní, položí mi ruku na rameno a pronese: „To je od vás velmi laskavé, dítě mé. Chápu, že pro obchodníka, jako jste vy, nebývá snadné se rozloučit s penězi.“\n\n[merchant_clergy_character.GetSheHe|U] významně přikývne, [Select_CString(merchant_clergy_character.IsFemale,'její','jeho')] ruka klesne zpět k boku a [merchant_clergy_character.GetSheHe] na mě upře zrak." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [merchant_clergy_character.GetFirstName], [merchant_clergy_character.GetHerHis], [merchant_clergy_character.GetHer
 gdp_visit_holding_decision_event.1504.a: "„Co kdyby [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] požehnal našemu podnikání?“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1504.a_epiphany: "„Zajímá mě pouze milost [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodNamePossessive].“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1504.b: "„Další schopný člověk by se nám #EMP hodil#!.“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1504.c: "„Nezáleží mi na ničem, pokud ne na bližních.“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1504.c_epiphany: "...v tuto chvíli nikoho nepřijímáme." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1505.t: "$gdp_visit_holding_decision_event.1500.t$: Zahrada" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1505.desc_returned_01: "V zahradě stále panuje klid. Někteří návštěvníci si v místech k posezení tiše povídají, zatímco jiní se ponořili do tichého rozjímání a pozorují okolní přírodu.\n\nNaslouchám šumění a vánku; větru v korunách stromů, a najednou se cítím mnohem klidněji." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1505.desc_returned_02: "Tentokrát si všimnu malého ptáčka na jednom ze stromů [ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')], který se chystá poprvé zkusit létat.\n\nPlynule sklouzne přes okraj hnízda, ale křídla se mu nějak zapletou a ptáček několik okamžiků volně padá vzduchem, dokud... ho vítr jemně nezachytí a neodnese do bezpečí. Hruď se mi naplní úlevou." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1505.desc: "Zahradu lemují živé ploty a na mírných pahorcích jsou roztroušeny stromy, v jejichž listoví lze zahlédnout tu a tam nějakého ptáka či veverku.\n\nCítím tu silnou přítomnost, obklopen krásou. Co když se mnou [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] byl po celou dobu, navzdory všem mým zkouškám a útrapám...?" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1505.desc_outro_return_partner: "\n\nO kus dál po cestě si [visiting_partner.GetFirstName] znovu prohlíží zdejší jedlé rostliny." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1505.desc_outro_return_gardener: "\n\nA dál po cestě zahlédnu ještě víc divokých pochoutek, které se vyhřívají v odpoledním slunci." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1505.desc_outro_partner: "\n\nZa sebou slyším [visiting_partner.GetFirstName], jak si mumlá pokaždé, když při naší procházce narazíme na další podivně jedlou rostlinu." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1505.desc_outro_gardener: "\n\nKoutkem oka si všimnu lákavých lesních plodů a bylin, které zahradě dodávají na bujnosti." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1505.a: "Cítím se vyrovnaně." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1505.a_convert: "Možná [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetNameNoTooltip] nakonec není tak špatná." # todo: NEW TRANSLATION
