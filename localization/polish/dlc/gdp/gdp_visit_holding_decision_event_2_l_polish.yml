 gdp_visit_holding_decision_event.1500.e: "Budu se věnovat jiným záležitostem." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1501.intro: "Světla je méně a v léčitelově chýši je zřetelně cítit #EMP zápach#!. Není #EMP nepříjemný#!, ale je vtíravý.\n\n[merchant_healer_character.GetFirstName] stojí u vysokého stolu a pilně připravuje směs." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1501.t: "$gdp_visit_holding_decision_event.1500.t$: Léčitel" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1501.desc: "$gdp_visit_holding_decision_event.1501.intro$ Když vstoupíme, [merchant_healer_character.GetWomanMan] se na nás podívá se zářivým úsměvem.\n\n„Vítejte v mém skromném příbytku! Jmenuji se [merchant_healer_character.GetFirstNameNoTooltip]. Jak vám mohu pomoci?“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1501.desc_sickly_minor: "Můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))] [1500_sickly_minor.GetFirstName], který je nemocný, se ke mně připojí v léčitelově chatrči. [1500_sickly_minor.GetSheHe|U] bezútěšně kašle, zatímco [1500_sickly_minor.GetHerHim] nesu po schodech dolů.\n\nLéčitel [merchant_healer_character.GetFirstName] vstane ze své dřevěné stoličky a věnuje mi zachmuřený pohled: „Budete potřebovat mé služby?“" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [merchant_healer_character.GetHerHis]
 gdp_visit_holding_decision_event.1501.desc_physician_partner: "Když vstoupíme do léčitelovy chatrče, [merchant_healer_character.GetFirstName] právě provádí očistnou proceduru na postarším [ROOT.Char.GetWomanMan]. [visiting_partner.GetFirstName] zaujatě pozoruje [merchant_healer_character.GetFirstNameNoTooltip] a v [Select_CString(visiting_partner.IsFemale,'jejích','jeho')] očích se zableskne nadšení: „Nevadilo by mi zkusit si #EMP tohle#!...“\n\n[merchant_healer_character.GetFirstNameNoTooltip] vzhlédne, když [merchant_healer_character.GetSheHe] zaslechne naše hlasy: „Ani jsem vás neviděl! Trápí vás něco?“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1501.desc_reused_healer: "$gdp_visit_holding_decision_event.1501.intro$ [merchant_healer_character.GetSheHe|U] vzhlédne a lehce pozvedne obočí: „Vidím, že jste se vrátil v jednom kuse! Jak vám tentokrát mohu pomoci?“" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [merchant_healer_character.GetHerHis]
 gdp_visit_holding_decision_event.1501.desc_returned_sickly_minor: "[1500_sickly_minor.GetFirstName] odpočívá na měkkém lůžku u rohových kamen v léčitelově chatrči a čeká na můj návrat. Instinktivně se nakloním, abych zkontroloval [Select_CString(1500_sickly_minor.IsFemale,'její','jeho')] dech, a pohladím [Select_CString(1500_sickly_minor.IsFemale,'její','jeho')] vlasy.\n\n[merchant_healer_character.GetFirstName] odloží své [ROOT.Char.Custom('WritingInstrument')] a věnuje mi zachmuřený pohled: „Na čem jsme se dohodli?“" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [1500_sickly_minor.GetHerHis], [1500_sickly_minor.GetHerHis], [merchant_healer_character.GetHerHis]
 gdp_visit_holding_decision_event.1501.desc_returned_physician_partner: "Když vstoupíme do léčitelovy chatrče, [merchant_healer_character.GetFirstName] zrovna přebírá nějaké byliny, ale při našem sestupu po schodech k nám vzhlédne: „Ach, rozmyslel jste si to?“\n\nPo mé levici přešlapuje [visiting_partner.GetFirstNameNoTooltip] z nohy na nohu a stále touží vyzkoušet si proceduru, kterou jsme předtím viděli provádět [merchant_healer_character.GetFirstNameNoTooltip]." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [merchant_healer_character.GetSheHe], [visiting_partner.GetHerHis], [visiting_partner.GetHerHis]
 gdp_visit_holding_decision_event.1501.desc_returned_01: "[merchant_healer_character.GetFirstName] se věnuje dalšímu pacientovi, když scházím ze schodů do léčitelovy chatrče. [merchant_healer_character.GetSheHe|U] na mě pohlédne a pak pokyne svému pacientovi, aby se posadil na lůžko hlouběji v místnosti.\n\n[merchant_healer_character.GetSheHe|U] poté zatáhne provizorní závěs ze starého prostěradla, aby pacientovi i nám dopřál trochu soukromí.\n\n„Vidím, že jste se vrátil,“ poznamená [merchant_healer_character.GetSheHe] pilně. „Potřebujete s něčím pomoci?“" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [merchant_healer_character.GetHerHis]
 gdp_visit_holding_decision_event.1501.desc_returned_02: "Když sestoupím zpátky do spoře osvětlené léčitelovy chatrče, [merchant_healer_character.GetFirstName] sedí o kus dál a listuje stránkami jakéhosi opotřebovaného deníku. Z dálky se to nedá rozeznat, ale zdá se, že obsahuje vyobrazení lidského těla.\n\n[merchant_healer_character.GetSheHe|U] deník opatrně zavře, uklidí ho a pak se na mě podívá a klidným hlasem pronese: „Ach, už jste zpátky. [Select_CString(ROOT.Char.IsFemale,'Našla','Našel')] jste nakonec něco, co vás trápí?“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1501.desc_outro_horn: "\n\nKoutkem oka zahlédnu několik léčivých cetek; mou pozornost upoutá nádherný roh." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1501.desc_outro_return_horn: "\n\nO něco dál v místnosti stále leží nádherný [1500_health_artifact.GetName] spolu s ostatními léčivými cetkami." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1501.desc_outro_artifact: "\n\nO něco dál v místnosti na polici plné léčivých cetek spatřím podivuhodný [1500_health_artifact.GetName], který se dožaduje mé pozornosti." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1501.desc_outro_return_artifact: "\n\nO něco dál v místnosti si stále žádá mou pozornost [1500_health_artifact.GetName]." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1501.a: "$ep3_laamp_decision_event.1041.a$" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1501.a_ill: "$ep3_laamp_decision_event.1041.a_ill$" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1501.b: "„Zajímá mě ten [1500_health_artifact.GetNameNoTooltip].“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1501.c: "$ep3_laamp_decision_event.1041.c$" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1501.c.flavor: "$ep3_laamp_decision_event.1041.c.flavor$" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1501.d: "„[1500_sickly_minor.GetFirstNameNoTooltip], můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('1500_sickly_minor'))], potřebuje ošetřit!“" # todo: NEW TRANSLATION
