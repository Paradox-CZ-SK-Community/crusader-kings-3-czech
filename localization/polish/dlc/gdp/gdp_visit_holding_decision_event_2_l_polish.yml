l_polish:
 gdp_visit_holding_decision_event.1200.t: "Návštěva mecenáše" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.intro_desc: "Když vstoupím do [ROOT.Char.GetCurrentLocation.GetName] [ROOT.Char.GetCurrentLocation.GetHolding.GetType.GetName|l], ohromí mě jeho nádhera. Kamkoli se podívám, všude jsou nevyčíslitelně cenné artefakty a ozdoby: tapiserie z [patron.Custom('RegionalFabric')], sochy a mistrovsky vyřezávaný nábytek. Vzduch je naplněný bohatou vůní pokrmu [patron.Custom('GetExpensiveMeal')].\n\nZtracený mezi pobíhajícími sloužícími " # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.all_available_desc: "Všimnu si, jak [steward.Custom2('CZ_MyCharacterIntroduction_I', ROOT.Char)] oznamuje můj příchod, zatímco poblíž stojí [patron.Custom2('CZ_MyCharacterIntroduction_I', ROOT.Char)]. Musím se dát dohromady a přednést svůj návrh." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.patron_available_desc: "Všimnu si, jak mi [patron.Custom2('CZ_MyCharacterIntroduction_I', ROOT.Char)] gestem naznačuje, abych [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')] blíž. Hádám, že to znamená, že mám [Select_CString(patron.IsFemale,'její','jeho')] přednostní pozornost. Musím se dát dohromady a přednést svůj návrh." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.steward_available_desc: "Všimnu si, jak mi [steward.Custom2('CZ_MyCharacterIntroduction_I', ROOT.Char)] gestem naznačuje, abych [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')] blíž, zatímco [patron.Custom2('CZ_MyCharacterIntroduction_I', ROOT.Char)] nikde není. Hádám, že [patron.GetSheHe] je příliš zaneprázdněn, než aby se se mnou setkal. Musím se dát dohromady a přednést svůj návrh." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.representative_desc: "Spatřím [negotiator.Custom2('CZ_MyCharacterIntroduction_I', ROOT.Char)], který mě čeká, aby mě přijal jménem [patron.Custom('CZ_TitledFirstName_G')], jenž se podle mých informací nemůže dostavit. Musím se dát dohromady a přednést svůj návrh." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.none_available_desc: "Neustále se snažím najít [patron.Custom2('CZ_MyCharacterIntroduction_I', ROOT.Char)] nebo kohokoli jiného, komu bych mohl přednést svou prosbu, ale marně. Asi jsem si měl domluvit schůzku." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.a: "Chci získat větší kontrolu nad trhy kultury [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip]." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.a.tt: "Váš návrh může přinést následující příležitost:$gdp_visit_holding_decision_effect_competitiveness$" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.b: "Budu hledat investiční příležitosti." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.b.tt: "Hledání finančních příležitostí může přinést následující příležitosti:$gdp_visit_holding_decision_effect_prestige$ " # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.c: "Když o tom tak přemýšlím..." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.c.tt: "Vraťte se a podívejte se, co dalšího [THIS.Char.GetCurrentLocation.GetName] nabízí" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.a_diplomacy.success: "Můj seznam známých udělá dojem na [negotiator.Custom('CZ_TitledFirstName_A')]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.a_diplomacy.failure: "Jména, která zmiňuji, jsou bezvýznamná" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.a_diplomacy.critical_failure: "Má slova urazí" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.a_stewardship.success: "Mé organizační schopnosti přesvědčí [negotiator.Custom('CZ_TitledFirstName_A')]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.a_stewardship.failure: "Zamotám se ve svých argumentech" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.a_stewardship.critical_failure: "V mé účetní knize se objeví známky zpronevěry" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.a_intrigue.success: "Podaří se mi přesvědčit [negotiator.Custom('CZ_TitledFirstName_A')]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.a_intrigue.failure: "[negotiator.Custom('CZ_TitledFirstName_N')] se nenechá přesvědčit" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.a_intrigue.critical_failure: "[negotiator.Custom('CZ_TitledFirstName_N')] urazí mé lži" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.a_learning.success: "[negotiator.Custom('CZ_TitledFirstName_N')] udělají dojem mé znalosti" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.a_learning.failure: "Mé hluboké zabřednutí do ekonomické teorie [negotiator.Custom('CZ_TitledFirstName_A')] nudí" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.a_learning.critical_failure: "Nějak se mi podaří, aby se [negotiator.Custom('CZ_TitledFirstName_A')] cítil hloupě" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.a_martial.success: "Mé znalosti vojenské logistiky udělají dojem na [negotiator.Custom('CZ_TitledFirstName_A')]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.a_martial.failure: "Nakonec zním jako podvodník" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.a_martial.critical_failure: "Mé příklady znějí jako výhrůžky" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.a_prowess.success: "[negotiator.Custom('CZ_TitledFirstName_N')] hluboce ohromí má síla" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.a_prowess.failure: "[negotiator.Custom('CZ_TitledFirstName_N')] zívne" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.a_prowess.critical_failure: "[negotiator.Custom('CZ_TitledFirstName_N')] mylně považuje mou ukázku fyzické síly za výhrůžku" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.a.competitiveness_cooldown.tt: "Nedávno jste od [patron.Custom('CZ_ShortUIName_G')] žádali obchodní privilegia — zkuste to znovu po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_patron_competitiveness') )]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1200.b.prestige_cooldown.tt: "Nedávno jste u [patron.Custom('CZ_ShortUIName_G')] vyměnili zlato za prestiž — zkuste to znovu po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_patron_prestige') )]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1201.t: "$gdp_visit_holding_decision_event.1200.t$: Konkurenční trh" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1201.all_available_desc: "Vstřícným gestem mě [steward.Custom2('CZ_MyCharacterIntroduction_I', ROOT.Char)] vybízí, abych [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')] blíž. Ještě jednou si v rychlosti projdu svůj návrh, než vykročím. Pro obchodní společnost rodu [ROOT.Char.GetHouse.GetName] je naprosto zásadní, aby tato dohoda vyšla.\n\nKdyž přistoupím blíž, vycítím z [patron.GetFirstName] nadřazenost.\n\n„Jasně mi předložte svou nabídku a možná budu tak laskavý, že ji zvážím…“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1201.patron_available_desc: "Výhružným gestem mě [patron.Custom2('CZ_MyCharacterIntroduction_I', ROOT.Char)] vybízí, abych [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')] blíž. Ještě jednou si v rychlosti projdu svůj návrh, než vykročím. Pro obchodní společnost rodu [ROOT.Char.GetHouse.GetName] je naprosto zásadní, aby tato dohoda vyšla.\n\nKdyž přistoupím blíž, vycítím z [patron.GetFirstName] nadřazenost.\n\n„Jasně mi předložte svou nabídku a možná budu tak laskavý, že ji zvážím…“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1201.steward_available_desc: "Vstřícným gestem mě [steward.Custom2('CZ_MyCharacterIntroduction_I', ROOT.Char)] vybízí, abych [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')] blíž. Ještě jednou si v rychlosti projdu svůj návrh, než vykročím. Pro obchodní společnost rodu [ROOT.Char.GetHouse.GetName] je naprosto zásadní, aby tato dohoda vyšla.\n\n„Jasně mi předložte svou nabídku a posoudím, zda je v nejlepším zájmu [patron.Custom('CZ_TitledFirstName_G')].“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1201.representative_desc: "Rozvážným gestem mě [negotiator.Custom2('CZ_MyCharacterIntroduction_I', ROOT.Char)] vybízí, abych [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')] blíž. Ještě jednou si v rychlosti projdu svůj návrh, než vykročím. Pro obchodní společnost rodu [ROOT.Char.GetHouse.GetName] je naprosto zásadní, aby tato dohoda vyšla.\n\n„Jasně mi předložte svou nabídku a posoudím, zda je v nejlepším zájmu [patron.Custom('CZ_TitledFirstName_G')].“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1201.a: "„Dovolte mi projít návrh smlouvy…“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1201.b: "„Jste přece vázáni svými slovy, nebo ne?“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1201.c: "To nic." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1201.c.tt: "Vraťte se ke svému jednání a podívejte se, co dalšího byste mohli navrhnout" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1202.t: "$gdp_visit_holding_decision_event.1200.t$: Investiční návrh" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1202.all_available_desc: "Nečinně stojím, zatímco [patron.GetFirstName] pročítá můj návrh. Mezi jeho obočím se rýsuje náznak zamračení, když vzhlédne od listin.\n\n„Hmm… Rozumím… Asi bych mohl zvážit, že se za vás a společnost rodu [ROOT.Char.GetHouse.GetName] zaručím v této výši. To by vám mělo vynést trochu úcty, že, [ROOT.Char.GetFirstNameNoTooltip]?“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1202.patron_available_desc: "[patron.Custom2('CZ_MyCharacterIntroduction_I', ROOT.Char)] vypadá docela zaujatě [patron.GetHerHis] [negotiator.Custom('ComplimentAdjective')] výrazem, když [negotiator.GetHerHim] vyprávím o svém návrhu.\n\n„Tohle vám vynese trochu úcty, [ROOT.Char.GetFirstNameNoTooltip].“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1202.steward_available_desc: "Trpělivě stojím, zatímco [steward.GetFirstName] pročítá můj návrh. Je zjevně zaujatý jeho obsahem a [steward.GetSheHe] ke mně vzhlédne.\n\n„Ten návrh je dobře sepsaný, to vám musím uznat… Asi bych mohl zvážit, že se za vás a společnost rodu [ROOT.Char.GetHouse.GetName] u [patron.Custom('CZ_TitledFirstName_G')] zaručím.“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1202.representative_desc: "Trpělivě stojím, zatímco [negotiator.Custom2('CZ_MyCharacterIntroduction_I', ROOT.Char)] pročítá můj návrh jménem [patron.Custom('CZ_TitledFirstName_G')]. Je zjevně zaujatý jeho obsahem a [negotiator.GetSheHe] ke mně vzhlédne.\n\n„Ten návrh je dobře sepsaný. Zajistím, aby se dostal k [patron.Custom('CZ_TitledFirstName_G')].“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1202.a: "„Možná bychom mohli vyjednávat…“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1202.b: "„Přijímám vaši nabídku.“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1202.b.success: "Transakce úspěšná!" # todo: NEW TRANSLATION
 gdp_guards_were_summoned.tt: "[patron.Custom('CZ_ShortUIName_N')] vás nějakou dobu nechce znovu vidět — zkuste to znovu po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_guards_summoned') )]" # todo: NEW TRANSLATION
 gdp_caught_stealing.tt: "Nedávno vás přistihli při krádeži na svatém místě — jste vykázáni až do [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_caught_stealing') )]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1000.b.tt: "Obrátit se na vašeho [Concept('merchant_patron','patrona')|E] může přinést následující příležitosti: $gdp_visit_holding_decision_effect_competitiveness$ $gdp_visit_holding_decision_effect_prestige$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_visit_holding_decision_event.1200.a.negotiator.tt: "Váš [Concept('merchant_patron','patron')|E] nebo [Select_CString(patron.IsFemale,'její','jeho')] zástupce musí být přítomen" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_visit_holding_decision_event.1500.t: "Návštěva [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.desc_returned_01: "Zpátky na pozemcích [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] je všechno při starém. Jak slunce pomalu putuje po obloze, sousední budovy kolem náměstí střídavě vrhají stín na otevřené prostranství" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.desc_returned_02: "Do nosu se mi neúprosně vkrádá intenzivní vůně kadidla, zatímco se tlumeným slunečním světlem vracím na pozemky [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.desc_returned_from_healer: "Přimhouřím oči, když se vynořím z šera léčitelovy chýše a zamířím zpět na prostranství u [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.desc_returned_from_church: "Když procházím zpátky branou [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship], doprovází mě téměř rajský klid a ocitám se znovu na náměstí u [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.desc_returned_from_garden: "Vrátím se z poklidné zahrady s lehčím srdcem a rozhlédnu se po rušném náměstí u [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.desc_returned_from_physician: "Z bludiště uliček odcházím od pracovny [merchant_physician_recruit.GetFirstNamePossessiveNoTooltip] a ocitám se zpátky na pozemcích [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.desc: "Na náměstí u [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] panuje zvláštní klid, přestože se tu hemží obchodníci, [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuterPlural] i pomocníci.\n\nUprostřed se tyčí nádherná [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] a po stranách zahlédnu vývěsní štíty s tučnými sliby uzdravení i přilehlou zahradu, kde lze v tichosti rozjímat o [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.desc_outro_physician_sickly_minor: "\n\nNa okraji náměstí káže jeden z věřících o lepším tělesném zdraví; a jak jsme se předem domluvili, mé nemocné [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))] [1500_sickly_minor.GetFirstName] doprovodili a čeká na mě v léčitelově chýši." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.desc_outro_physician: "\n\nNa okraji náměstí káže jeden z věřících o tom, jak lepší tělesné zdraví posílí i naše zdraví duchovní. [merchant_physician_recruit.GetSheHe|U] vytrvale pokračuje navzdory občasnému pokřikování davu sedláků." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.desc_outro_sickly_minor: "\n\nJak jsem se domluvil s jedním z obsluhujících v táboře, mé nemocné [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))] [1500_sickly_minor.GetFirstName] doprovodili a čeká na mě v léčitelově chýši." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.desc_outro_partner: "\n\n[visiting_partner.GetFirstName] uznale přikývne a rozhlédne se po rušném náměstí, už teď pokukuje po zajímavých stáncích a místech." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.desc_outro: "\n\nCítím se spokojeně, rozhlížím se po prostranství a několikrát se zhluboka nadechnu, zatímco přemýšlím o svém dalším cíli." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_finished: "\n\n[visiting_partner.GetFirstName], který už začíná vypadat trochu unaveně, říká: „Nechci si stěžovat, ale… už jsme tu snad skončili, [visiting_partner.Custom2('RelationToMe', ROOT.Char)]?“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.desc_outro_return_finished: "\n\nPo značné době strávené na náměstí u [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] jsem s dnešním jednáním spokojen a rozhlížím se, kudy se nejrychleji dostanu zpět na hlavní náměstí." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.desc_outro_physician_return: "\n\nVěřící kazatel dál káže o [Select_CString(merchant_physician_recruit.IsFemale,'její','jeho')] zdraví, ale zdá se, že se jeho přednáška blíží ke konci." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.desc_outro_sickly_minor_return: "\n\nZ nějakého důvodu se teď zdá, že je náměstí plné dětí. Byly tu celou dobu? Hrají si a dovádějí, neustále přicházejí na nové způsoby, jak dělat staré věci; k nemalému překvapení a rozmrzelosti svých opatrovníků.\n\nZatímco se rozhlížím po náměstí a přemýšlím, kam zamířit dál, stále mi vrtá hlavou zdravotní stav [1500_sickly_minor.GetFirstNamePossessive]." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_01: "\n\nPo mé levici si [visiting_partner.GetFirstName] zvědavě prohlíží stánek pokrytý těmi nejmenšími lahvičkami — údajně naplněnými kapkami jedu [ROOT.Char.Custom('VenomousCreature')].\n\nUž jen ta představa mi nahání husí kůži, zatímco přemýšlím, kam zamířit dál." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_02: "\n\n[visiting_partner.GetFirstName] do mě šťouchne ramenem a ukáže na stráže, které odvádějí otrhaného [ROOT.Char.GetWomanMan] z areálu; křičí přitom o konci světa.\n\nInstinktivně pozvednu obočí a pozoruji ten rozruch, zatímco přemýšlím, co podniknout dál." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_03: "\n\n[visiting_partner.GetFirstName] mi při cestě přes náměstí podá sousto.\n\nZamyšleně žvýkám sušený proviant a přemítám, co podniknu dál." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.desc_outro_return_01: "\n\nVe stinném koutě prostranství se nějaký šarlatán snaží přesvědčit urozeného [ROOT.Char.GetWomanMan] o léčivých účincích červeného písku.\n\nNezúčastněně pozoruji jejich hádku a přemýšlím, co podniknu dál." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.desc_outro_return_02: "\n\nU nedalekého stánku se zrcadly z obsidiánu se [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuter] snaží skrýt [Select_CString(ROOT.Char.IsFemale,'její','jeho')] nadšení, že [ROOT.Char.GetSheHe] má konečně příležitost prohlédnout si [ROOT.Char.GetHerselfHimself].\n\nMírně pobaveně přemýšlím, kam zamířit dál." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.desc_outro_return_03: "\n\nU malé rotundy čte šarlatán s opisy [ROOT.Char.Custom('RandomReligiousTextName')] nahlas z textu skromnému publiku.\n\nNepřítomně naslouchám a rozhlížím se po prostranství, zatímco přemýšlím, co podniknout dál." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.a: "Vyhledám požehnání léčitelů." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.a_second: "Vrátím se k léčitelům." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1500.a_sickly_minor: "Možná mohou léčitelé pomoci [1500_sickly_minor.GetFirstNameNoTooltip]." # todo: NEW TRANSLATION
