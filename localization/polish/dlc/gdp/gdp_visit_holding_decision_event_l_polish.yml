 gdp_visit_holding_decision_event.1333.t: "Zkušený karavanář" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1333.desc: "Dromedáři se tísní v malém přístřešku svých ohrad. Z jejich houfu se tu a tam ozve zabručení, zadupání kopyta a... #EMP chrápání#!?\n\nPři bližším pohledu spatřím karavanáře spícího opřeného o [Select_CString(caravaneer.IsFemale,'její','jeho')] brašny. [caravaneer.GetSheHe|U] se probudí, když zaslechne, že přicházím, rychle se postaví na [Select_CString(caravaneer.IsFemale,'její','jeho')] nohy a otře si sliny z [Select_CString(caravaneer.IsFemale,'její','jeho')] tváře.\n\nVysvětlí: „Ujišťuji vás, majitel stájí ví, že tu jsem. Nikdy svá zvířata neopouštím, kvůli jejich bezpečí i svému klidu.“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1333.desc_returned_01: "Dromedáři se stále tísní v ohradě. Tentokrát je [caravaneer.GetFirstName] vzhůru a přejíždí rukou po obvodu sedla.\n\n[caravaneer.GetSheHe|U] se ohlédne přes [Select_CString(caravaneer.IsFemale,'její','jeho')] rameno. „Zase ty.“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1333.desc_returned_02: "Z ohrady se ozve zabručení a pak [caravaneer.GetFirstNamePossessive] hlas: „Jestli ses [Select_CString(caravaneer.IsFemale,'přišla','přišel')] dívat, za zvířata si připlatíš.“\n\n[caravaneer.GetSheHe|U] teď sedí na brašnách, plně oblečený, a čeká, jestli si chceš promluvit." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1333.a: "„O tvá zvířata bude postaráno.“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1333.a.tt: "K najmutí [caravaneer.GetFirstNameNoTooltip] je potřeba @gold_icon![caravaneer_recruit_cost|V0] [Concept('gold','zlata')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1333.recruit_benefits.tt$" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1333.recruit_benefits.tt$" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1333.b: "„Jaké jsou novinky z cest?“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1333.b.cooldown.tt: "Na cesty ses vyptával nedávno — zkus to znovu za [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1333_gained_caravaneer_xp_recently') )]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1333.c: "„O organizaci karavan něco vím...“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1333.c.success: "[caravaneer.GetFirstNameNoTooltip] uděláš dojem" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1333.c.failure: "[caravaneer.GetFirstName] si vezme [Select_CString(caravaneer.IsFemale,'její','jeho')] zvířata a odejde" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1333.d: "Snad někdy jindy." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1334.t_docks: "$gdp_visit_holding_decision_event.1400.t$:" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1334.t: "Námořní kapitán" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1334.desc: "Na molu se kolem ostříleného námořníka shromáždil dav žen a mužů, kteří doufají, že si zajistí místo na [Select_CString(sea_captain.IsFemale,'její','jeho')] lodi.\n\nZaslechnu, jak si dva kolemjdoucí šeptají: „Přišli jsme pozdě! [sea_captain.GetTitledFirstName|U] pro nás nebude mít místo.“ Místo aby oslovili jiného námořníka, rozhodnou se počkat na jeho další příjezd.\n\nKdo přesně je tenhle [sea_captain.GetWomanMan], a necinká mu v [Select_CString(sea_captain.IsFemale,'její','jeho')] dřevěné noze #EMP zlato#!?" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1334.desc_returned_01: "Dav kolem [sea_captain.GetFirstName] prořídl. [sea_captain.GetSheHe|U] postupně vhazuje mince do [Select_CString(sea_captain.IsFemale,'její','jeho')] dřevěné nohy, zatímco poslední žadatelé odcházejí.\n\n[sea_captain.GetSheHe|U] se ani neobtěžuje otočit. „Nečekal jsem, že tě ještě uvidím.“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1334.desc_returned_02: "[sea_captain.Custom('CZ_TitledFirstName_N')|U] ukazuje opozdilci jinou loď. Dřevěná noha klape o prkna, když se [sea_captain.GetSheHe] otočí.\n\n„Už zase. Chceš místo na palubě, nebo jdeš po mně?“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1334.a: "„Zaplatím dvakrát tolik co kdokoli tady.“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1334.a.tt: "K najmutí [sea_captain.GetFirstNameNoTooltip] je potřeba @gold_icon![sea_captain_recruit_cost|V0] [Concept('gold','zlata')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1334.recruit_benefits.tt$" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1334.recruit_benefits.tt$" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1334.b: "„Nechceš se podělit o pár příběhů?“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1334.b.cooldown.tt: "Nedávno jsi slyšel příběh námořního kapitána — zkus to znovu za [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1334_gained_traveler_xp_recently') )]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1334.c: "„Obchodování se zbožím je mnohem výnosnější podnik.“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1334.c.success: "[sea_captain.GetFirstNameNoTooltip] je [Select_CString(sea_captain.IsFemale,'přesvědčena','přesvědčen')]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1334.c.failure: "[sea_captain.GetFirstName] odrazí od břehu" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1334.d: "Snad někdy jindy." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1335.t_market: "$gdp_visit_holding_decision_event.1300.t$:" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1335.t: "Karnevalový šašek" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1335.desc: "Uprostřed ulice vystupuje [carnival_jester.GetWomanMan] a kolem něj se shromáždí zaujaté publikum. Přiláká kupce od nedalekých obchodních stánků a zastaví dění na trhu.\n\nÚčinkující rozpřáhne [Select_CString(carnival_jester.IsFemale,'její','jeho')] ruce a prohlásí: „Podívejte se, vy všichni, kteří jste mi říkali, že mé triky fungují jen díky mdlým karnevalovým scénám. Na rozdíl od vás se nemusím skrývat za žádnou maskou.“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1335.desc_returned_01: "Je to stejný roh ulice, jen dav je menší. [carnival_jester.GetFirstName] dokončí otočku, spatří mě a rozpřáhne [Select_CString(carnival_jester.IsFemale,'její','jeho')] ruce, jako bych byl součástí vystoupení.\n\n„Přídavek?“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1335.desc_returned_02: "[carnival_jester.GetFirstName] si balí [Select_CString(carnival_jester.IsFemale,'její','jeho')] rekvizity do látky.\n\n„Začínám si myslet, že jdeš po mně.“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1335.a: "„Moje společnost potřebuje bystrý důvtip, jako je ten váš.“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1335.a.tt: "@gold_icon![carnival_jester_recruit_cost|V0] [Concept('gold','Zlato')|E] potřebných k naverbování [carnival_jester.GetFirstNameNoTooltip]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
