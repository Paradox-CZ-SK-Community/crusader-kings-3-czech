 gdp_visit_holding_decision_event.1326.c: "Nemyslím, že je to pro mě." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1330.t: "Mnich" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1330.desc: "V tichém koutě místní čajovny najdu mnicha, který hledá význam ve stoncích řebříčku rozložených před [monk.GetHerHim]. Svíčka osvětluje [Select_CString(monk.IsFemale,'její','jeho')] stůl. [monk.GetWomanMan] se na mě podívá a vycítí můj zájem.\n\n„Jsi, příteli, učedníkem věštírny? Máš-li otevřenou a upřímnou mysl, Cesta ti má mnoho co ukázat.“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1330.desc_returned_01: "Čajovna je prázdnější než předtím. [monk.GetFirstName] stále sedí a před sebou má rozložené stonky řebříčku před [monk.GetHerHim]; svíčka dohořela o něco níže.\n\n[monk.GetSheHe|U] nevzhlédne." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1330.desc_returned_02: "Když se vrátím, [monk.GetFirstName] právě smetá stonky zpátky do látky. Svíčka zhasíná.\n\n„Vytrvalý,“ pronese [monk.GetSheHe]. „Cestě druhá návštěva nevadí. A tobě?“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1330.a: "Mé společnosti by se hodil vzdělaný společník." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1330.a.tt: "K najmutí [monk.GetFirstNameNoTooltip] je potřeba @gold_icon![monk_recruit_cost|V0] [Concept('gold','zlata')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
