 gdp_visit_holding_decision_event.1324.t: "Zkušený cestovatel" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1324.desc: "Napětí mezi oběma obchodníky dosáhlo vrcholu. [traveler_recruit.GetFirstName] se snaží konflikt uklidnit smířlivými gesty. I přes [traveler_recruit.GetHerHis] lámanou [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetLanguage.GetName] je [traveler_recruit.GetSheHe] docela úspěšný. Na někoho, kdo očividně není zvyklý na místní kulturu, je to obdivuhodný výkon.\n\nAni jeden z obchodníků však nedokáže poznat, zda [traveler_recruit.GetSheHe] myslí kvalitu, zboží, nebo něco úplně jiného, a hádka skončí patem." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1324.a: "„Dovolte, abych se [Select_CString(ROOT.Char.IsFemale,'pokusila','pokusil')] zprostředkovat smír.“" # todo: NEW TRANSLATION # todo: GENDER FORM ROOT.Char - over, ci ROOT je postava, ktorej sa text tyka
