 gdp_visit_holding_decision_event.1326.t: "Bylinkář" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1326.desc: "[herbalist_recruit.GetFirstName] si mě nevšímá, když se přiblížím. [herbalist_recruit.GetSheHe|U] je fascinovaně zaujatý pohyby tlouku, který drtí přísadu na neurčitou směs.\n\n„Trochu [ROOT.Char.Custom('Abortifacient')], možná nějaký [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')], a pak bych to [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] povařit v [ROOT.Char.Custom('RegionalDrink')]. Ano... To by mělo zabrat. Co myslíš?“\n\n[herbalist_recruit.GetSheHe] mě sotva bere na vědomí, otočí se ke mně a přiloží mi hmoždíř k nosu. Udeří mě do něj pronikavý zápach." # todo: NEW TRANSLATION # todo: GENDER FORM ROOT.Char - over, ci ROOT je postava, ktorej sa text tyka
 gdp_visit_holding_decision_event.1326.a: " #EMP Hm#!, co kdybys přidal víc [ROOT.Char.Custom('Abortifacient')]?" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1326.a.success: "Tvůj návrh pomůže" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1326.a.failure: "Tvůj návrh nepomůže" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1326.b: "Někdo s tvými schopnostmi by se mi opravdu hodil." # todo: NEW TRANSLATION
