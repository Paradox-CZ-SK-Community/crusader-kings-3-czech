 gdp_visit_holding_decision_event.1000.d.changed_mind: "„Vlastně jsem si to rozmyslel.“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1000.d.changed_mind.tt: "Odejít, aniž byste prozkoumali tuto [ROOT.Char.Custom('LocalHoldingTypeConcept')]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1000.d.exhausted: "Zdá se, že už tu není co dělat..." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1000.d.exhausted.tt: "Vrátit se domů. Nové příležitosti budou dostupné po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_all_options_refresh_tracker') )|V]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1000.not_in_patron_realm.tt: "Váš [Concept('domicile','domicil')|E] se momentálně nenachází v panství vašeho [Concept('merchant_patrons','patronech')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_visit_holding_decision_event.1110.t: "Návštěva cechů v [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1110.desc: "Uličkami cechů se rozléhá zvuk kladiva dopadajícího na kov. O kus dál nese mladý učeň nářadí svého mistra do hrnčířské dílny. Cechovní domy po generace vychovávaly tovaryše v zručné mistry svého řemesla.\n\nCechy nabízejí každému obchodníkovi řadu služeb. Kterou z nich bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] dnes vyhledat?" # todo: NEW TRANSLATION # todo: GENDER FORM ROOT.Char - over, ci ROOT je postava, ktorej sa text tyka
 gdp_visit_holding_decision_event.1110.a: "Jeden z mých artefaktů by potřeboval trochu vyleštit." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1110.a.tt: "Návštěva kurátora může nabídnout tuto příležitost:\n$EFFECT_LIST_BULLET$ Vylepšit běžné artefakty a mistrovská díla @artifact_icon![Concept('artifacts','artefakty')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_visit_holding_decision_event.1110.a.cooldown.tt: "Nedávno jste využili služeb kurátora — zkuste to znovu po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1111_has_improved_artifact_recently') )]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1110.a.no.arfitfacts.tt: "Nemáte žádné běžné artefakty ani mistrovská díla [Concept('artifacts','artefakty')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_visit_holding_decision_event.1110.b: "Mám chuť pořídit si nové zbraně a zbroj." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1110.b.tt: "Návštěva kováře může nabídnout tuto příležitost:\n$EFFECT_LIST_BULLET$ Koupit běžné, mistrovské nebo slavné zbraně a zbroj @artifact_icon![Concept('artifacts','artefakty')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_visit_holding_decision_event.1110.b.cooldown.tt: "Nedávno jste si něco koupili od kováře — zkuste to znovu po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1111_has_bought_artifact_recently') )]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1110.c: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych si domluvit schůzku s cechmistrem." # todo: NEW TRANSLATION # todo: GENDER FORM ROOT.Char - over, ci ROOT je postava, ktorej sa text tyka
 gdp_visit_holding_decision_event.1110.c.tt: "Setkání s cechmistrem může nabídnout tuto příležitost:$gdp_visit_holding_decision_effect_guild$" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1110.c.cooldown.tt: "Nedávno jste se setkali s cechmistrem — zkuste to znovu po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1110_visited_guild_master_recently') )]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1110.d: "Co kdybych se vydal někam jinam?" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1110.d.tt: "Zatím opustit cechy" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1111.t: "$gdp_visit_holding_decision_event.1110.t$: Kurátor" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1111.desc: "Když vstoupím do kurátorovy dílny, obklopí mě fascinující předměty z blízka i z daleka. U pracovního stolu vzadu se [curator.GetWomanMan] sklání nad dýkou a zasazuje do její rukojeti ty nejkrásnější drahokamy. Zatímco si prohlížím jednu z vystavených cetek, [curator.GetSheHe] vytrhne [Select_CString(curator.IsFemale,'její','jeho')] soustředění.\n\n„Ach, potenciální zákazník! Jak mohu dnes [ROOT.Char.GetTitledFirstNameNoTooltip] posloužit?“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1111.a: "Možná by [artifact_target_1.GetNameNoTooltip] potřeboval trochu vyleštit." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1111.a.tt: "[artifact_target_1.GetName] získá vylepšení" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1111.b: "Možná by [artifact_target_2.GetNameNoTooltip] potřeboval trochu péče." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1111.b.tt: "[artifact_target_2.GetName] získá vylepšení" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1111.c: "Myslím, že můj [artifact_target_3.GetNameNoTooltip] by [Select_CString(artifact_target_3.IsFemale,'mohla','mohl')] být lepší." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1111.c.tt: "[artifact_target_3.GetName] získá vylepšení" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1111.d: "Možná se budu muset vrátit později..." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1111.d.tt: "Vrátit se do cechů a zjistit, co dalšího [THIS.Char.GetCurrentLocation.GetName] nabízí" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1112.t: "$gdp_visit_holding_decision_event.1110.t$: Kovář" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1112.desc: "Když vstoupím do kovářovy dílny, pocítím téměř nesnesitelné žároviště výhně. Kováře, který právě bušil do širokého meče, můj příchod náhle vyruší. Setře si z [Select_CString(blacksmith.IsFemale,'její','jeho')] čela směs potu a sazí a [blacksmith.GetSheHe] místo práce začne věnovat [Select_CString(blacksmith.IsFemale,'její','jeho')] pozornost mně.\n\n„Tak co tu máme? Má snad můj [ROOT.Char.GetTitleAsNameNoTooltip] zájem pořídit si některou z těchto skvělých zbraní a zbrojí? Lepší v [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] neseženete.“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1112.a: "Tento [arms_armor_artifact_1.GetNameNoTooltip] by byl skvělým přírůstkem." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1112.b: "Možná bych si [Select_CString(ROOT.Char.IsFemale,'měla','měl')] koupit [arms_armor_artifact_2.GetNameNoTooltip]." # todo: NEW TRANSLATION # todo: GENDER FORM ROOT.Char - over, ci ROOT je postava, ktorej sa text tyka
 gdp_visit_holding_decision_event.1112.c: "Něco jako [arms_armor_artifact_3.GetNameNoTooltip] by se mi hodilo." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1112.d: "Když o tom tak přemýšlím, dnes raději ne." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1112.d.tt: "Vrátit se do cechů a zjistit, co dalšího [THIS.Char.GetCurrentLocation.GetName] nabízí" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1113.t: "$gdp_visit_holding_decision_event.1110.t$: Rady cechmistra" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1113.desc: "Schůzka s cechmistrem [guild_master.GetName] se pro společnost rodu [ROOT.Char.GetHouse.GetName] ukázala jako přínosná. V zaprášené kanceláři, mezi hromadami papírů a knih, najednou uběhly celé hodiny.\n\n[guild_master.GetNameNoTooltip] má vskutku jedinečný vhled do [guild_master.Custom('highest_skill_noun')]. [Select_CString(guild_master.IsFemale,'Její','Jeho')] projev mě i [visiting_associate.GetName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_associate'))], zcela uchvátil a oba toužíme dozvědět se víc." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1113.a.success: "Vy i [visiting_associate.GetName] snadno vstřebáte nové poznatky" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1113.a_learning.failure: "Rozluštit starobylé rukopisy není snadné" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1113.a_stewardship.failure: "Rovnice jsou pro vás i [visiting_associate.GetName] příliš složité" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1113.a_diplomacy.failure: "Velké diplomatické půtky jsou příliš složité na pochopení" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1113.a.failure.tt: "Poučení padne na neúrodnou půdu." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1113.a: "„Možná bychom s [visiting_associate.GetNameNoTooltip] mohli ještě chvíli zůstat?“" # todo: NEW TRANSLATION
