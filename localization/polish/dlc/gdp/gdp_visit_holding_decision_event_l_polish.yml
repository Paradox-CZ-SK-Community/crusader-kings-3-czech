 gdp_visit_holding_decision_event.1300.asia: "Stejně jako na všech tržištích podél Velké hedvábné stezky se tu hojně vyskytují luxusní zboží, jako je nefrit, hedvábí a čaj.\n\nUprostřed přeplněné ulice muž opatrně vykládá z vozu jemné porcelánové vázy. Vedle něj si cizí obchodník v pestrém oděvu prohlíží stánky a dychtí po nákupu.\n\n" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1300.mena_india: "Barevné látky a zdobená keramika rozjasňují jinak ponurou uličku. Vzduch naplňuje příjemná vůně kadidla a koření.\n\nV tmavém koutě se podomní obchodník zoufale snaží přesvědčit skeptického kolemjdoucího, aby koupil jeho kvalitní měděné talíře. Teď je vhodná chvíle uzavřít obchod.\n\n" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1300.default: "Vůně čerstvých potravin se mísí s pachem houstnoucího davu. Podomní obchodníci na přeplněném náměstí se překřikují.\n\n„[ROOT.Char.Custom('RegionalDrink')|U]! Speciální nabídka, jen dnes!“ „Poslední příležitost koupit ten nejlepší kus [ROOT.Char.Custom('RegionalEdibleMeat')].“\n\n" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.monk_hint: "Muž odchází z nedaleké čajovny se svěšenou hlavou a mumlá cosi o zlých znameních. Zdá se, že uvnitř někdo věští." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.monk_hint_return: "V čajovně je teď klidněji, ale věštící mnich ještě neodešel." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.caravaneer_hint: "Ulici zaplňuje průvod karavan ošlehaných počasím a místní stáje mají co dělat, aby zvládly příliv obchodníků." # todo: NEW TRANSLATION
