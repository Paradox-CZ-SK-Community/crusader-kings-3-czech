 gdp_visit_holding_decision_event.1324.a.failure: "Tvůj zásah není vítán" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1324.b: "Někoho s tvými zkušenostmi bych potřeboval." # todo: NEW TRANSLATION
