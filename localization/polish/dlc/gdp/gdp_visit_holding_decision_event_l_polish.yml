 gdp_visit_holding_decision_event.1000.desc: "S východem slunce vstávají i obyvatelé [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]. Ranní ticho rychle vystřídá živý ruch lidí, kteří se věnují svým každodenním povinnostem. Pozorný pozorovatel najde příležitosti na každém rohu těchto rušných ulic.\n\nKam bych se dnes [Select_CString(ROOT.Char.IsFemale,'měla','měl')] vydat hledat štěstí?" # todo: NEW TRANSLATION # todo: GENDER FORM ROOT.Char - over, ci ROOT je postava, ktorej sa text tyka
