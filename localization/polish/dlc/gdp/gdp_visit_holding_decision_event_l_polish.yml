 gdp_visit_holding_decision_event.1340.t: "Oddech v [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1340.desc: "Obchodní svět dokáže být únavný. Člověk může prohlédnout jen omezené množství nabídek a nasadit jen omezený počet falešných úsměvů, než si potřebuje pořádně odpočinout.\n\n" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1340.tea: "Tady v čajovně mohu na chvíli nechat starosti společnosti za sebou.\n\nJe úlevné jen tak usrkávat horký čerstvý čaj a prohodit pár slov, novinek a klepů s místními štamgasty." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1340.hashish: "Tady v hašišovně mohu na chvíli nechat starosti společnosti za sebou.\n\nJe úlevné jen tak posedět v chládku a tichu a prohodit pár slov, novinek a klepů s místními štamgasty." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1340.drink: "Tady v krčmě mohu na chvíli nechat starosti společnosti za sebou.\n\nJe úlevné jen tak upíjet dobrý [ROOT.Char.Custom('RegionalAlcoholicDrink')] a prohodit pár slov, novinek a klepů s místními štamgasty." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1340.food: "Tady v hodovní síni mohu na chvíli nechat starosti společnosti za sebou.\n\nJe úlevné jen tak ochutnávat z bohatě prostřeného stolu, uzobávat [ROOT.Char.Custom('FavoriteTreat')] a prohodit pár slov, novinek a klepů s místními štamgasty." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1340.bath: "Tady v lázních mohu na chvíli nechat starosti společnosti za sebou.\n\nJe úlevné jen tak se ponořit do léčivé vody a prohodit pár slov, novinek a klepů s místními štamgasty." # todo: NEW TRANSLATION
