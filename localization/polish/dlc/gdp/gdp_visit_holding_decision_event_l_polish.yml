 gdp_visit_holding_decision_event.1323.desc: "[numerate_recruit.GetFirstName] má [Select_CString(numerate_recruit.IsFemale,'její','jeho')] nos zabořený v knize a sotva si mě všimne, dokud nejsem opravdu blízko. [numerate_recruit.GetSheHe|U] ke mně vzhlédne a zamyšleně se zatváří.\n\n„Vypadáš na schopného [ROOT.Char.GetWomanMan]. Nemohl bys mi pomoct vyřešit jeden drobný problém?“\n\nList, který mi [numerate_recruit.GetSheHe] ukazuje, je pečlivě popsaný čísly a výpočty. Vypadá jako účetní kniha se zisky a výdaji stánků." # todo: NEW TRANSLATION
