 gdp_visit_holding_decision_event.1322.t: "Drsný darebák" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1322.desc: "Když se přiblížím k [hired_muscle_recruit.GetFirstName], cítím, jak si mě [Select_CString(hired_muscle_recruit.IsFemale,'její','jeho')] podezíravýma očima měří.\n\n„Copak nevíš, na koho se díváš? Jsem neporažený šampion [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]. Máš pěknou drzost myslet si, že [hired_muscle_recruit.Custom2('InsultNoun', ROOT.Char)] jako ty se mi může v boji vůbec postavit.“\n\n[hired_muscle_recruit.GetSheHe|U] proti mně výhrůžně pozvedne [Select_CString(hired_muscle_recruit.IsFemale,'její','jeho')] pěst." # todo: NEW TRANSLATION
