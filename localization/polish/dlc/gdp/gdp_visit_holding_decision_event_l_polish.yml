 gdp_visit_holding_decision_event.1400.t: "Návštěva doků v [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1400.intro: "V rušném přístavu [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] dělníci pilně vykládají náklad nejrůznějších tvarů a velikostí." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1400.asia: "Ztvrdlé ruce opatrně přenášejí bedny s hedvábím a pytle s čajovými lístky. Brzy zásobí zázraky zbytek známého světa; džunky je bezpečně převezou přes rozbouřené moře." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1400.mena_india: "Uprostřed zmatku si kupec prohlíží náklad v několika poškozených bednách. Na druhém konci přístavu pečlivě zapečeťují bedny s kořením, aby přečkaly nebezpečnou cestu přes oceán." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1400.default: "Pytle s obilím a solí se nakládají na lodě a míří do vzdálených zemí. Právě zakotvila mohutná dubová koga a vystupuje z ní skupina cizích kupců v pestrých oděvech." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1400.outro: "Plíce mi naplní čerstvý vzduch a těším se, zda mi dnes bude štěstěna přát.\n\n…Kam bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] zamířit dál?\n\n" # todo: NEW TRANSLATION # todo: GENDER FORM ROOT.Char - over, ci ROOT je postava, ktorej sa text tyka
 gdp_visit_holding_decision_event.1400.b: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych se mít na pozoru před zajímavými lidmi." # todo: NEW TRANSLATION # todo: GENDER FORM ROOT.Char - over, ci ROOT je postava, ktorej sa text tyka
 gdp_visit_holding_decision_event.1400.b.tt: "Prohlídka doků může přinést následující příležitost:$gdp_visit_holding_decision_effect_recruit$" # todo: NEW TRANSLATION
