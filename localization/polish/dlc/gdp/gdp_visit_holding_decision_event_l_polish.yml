 gdp_visit_holding_decision_event.1310.desc: "V poslední době jsem [Select_CString(ROOT.Char.IsFemale,'vyslechla','vyslechl')] mnoho příběhů o cizokrajných zvířatech a pokladech. Dnes prohledám tržiště a zjistím, zda nenajdu někoho, kdo by o těchto zvěstech [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] vědět víc.\n\nMezi obchodníky si všimnu [foreigner.GetWomanMan] s podivným cizím přízvukem, chlubí se [Select_CString(foreigner.IsFemale,'jejími','jeho')] dobrodružstvími v dalekých krajích zdánlivě nezaujatému místnímu obchodníkovi. [foreigner.GetSheHe|U] může být chvástal, ale možná je na [Select_CString(foreigner.IsFemale,'jejích','jeho')] příbězích i něco pravdy. Třeba by [foreigner.GetHerHim] rozpovídalo trochu zlata..." # todo: NEW TRANSLATION # todo: GENDER FORM ROOT.Char - over, ci ROOT je postava, ktorej sa text tyka
