 gdp_visit_holding_decision_event.1335.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1335.recruit_benefits.tt$" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1335.recruit_benefits.tt$" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1335.b: "„Povězte mi více o těchto karnevalech.“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1335.b.cooldown.tt: "Na karnevaly jste se [Select_CString(ROOT.Char.IsFemale,'ptala','ptal')] nedávno — zkuste to znovu po [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1335_gained_creditor_xp_recently') )]" # todo: NEW TRANSLATION # todo: GENDER FORM ROOT.Char - over, ci ROOT je postava, ktorej sa text tyka
 gdp_visit_holding_decision_event.1335.c: "„Copak už tu nemáte co dokazovat?“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1335.c.success: "[carnival_jester.GetFirstNameNoTooltip] je [Select_CString(carnival_jester.IsFemale,'přesvědčena','přesvědčen')]" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1335.c.failure: "[carnival_jester.GetFirstName] si sbalí věci a odejde" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1335.d: "Snad někdy jindy." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1336.t_market: "$gdp_visit_holding_decision_event.1300.t$:" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1336.t: "Pekař" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1336.desc_intro: "Z nedalekého stánku na tržišti se line sladká vůně čerstvého [ROOT.Char.Custom('FavoriteTreat')]. Koše s pečivem jsou naskládané na každém volném místě.\n\n[cook.GetWomanMan], který obchod vlastní, stojí opodál a drží se [Select_CString(cook.IsFemale,'její','jeho')] hlavu v [Select_CString(cook.IsFemale,'jejích','jeho')] dlaních. Když mě [cook.GetSheHe] spatří, [cook.GetSheHe] poví," # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1336.desc_named_noble: "„Dříve jsem [Select_CString(ROOT.Char.IsFemale,'pracovala','pracoval')] pro [local_noble.GetTitledFirstNameNoTooltip], ale teď si [local_noble.GetSheHe] ‚hlídá [Select_CString(local_noble.IsFemale,'její','jeho')] postavu‘ a nemá mě zapotřebí.“ [cook.GetSheHe|U] si okusuje [Select_CString(cook.IsFemale,'její','jeho')] rty. „Možná byste s tím [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] obchodovat vy, jakožto kupec. Já… na to prostě nemám dost času.“" # todo: NEW TRANSLATION # todo: GENDER FORM ROOT.Char - over, ci ROOT je postava, ktorej sa text tyka
 gdp_visit_holding_decision_event.1336.desc_unknown_noble: "„Z panského sídla si pro mě nikoho neposílají. Mám toho víc, než dokážu prodat!“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1336.desc_returned_01: "Stánek stále voní po [ROOT.Char.Custom('FavoriteTreat')]. [cook.GetFirstName] balí další balíček pro cizince, který za něj nezaplatil.\n\n[cook.GetSheHe|U] mě spatří a povzdechne si. „Stále si pro mě nikoho neposlali. Nemohu to rozdávat zadarmo.“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1336.desc_returned_02: "Košů už je méně. [cook.GetFirstName] se opírá o pult, na [Select_CString(cook.IsFemale,'jejích','jeho')] rukávech má mouku a sleduje, jak mizí poslední bochníky.\n\n„Jestli pro pekaře máte nějaké využití,“ řekne [cook.GetSheHe], „řekněte mi to, než bude stánek prázdný.“" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1336.a: "„Moje společnost má spoustu hladových krků.“" # todo: NEW TRANSLATION
