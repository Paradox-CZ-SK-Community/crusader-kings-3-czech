 gdp_visit_holding_decision_event.1325.t: "Uličnice" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1325.desc: "Tuhle scénku jsem už viděl mnohokrát, a tak vím, že k [urchin_recruit.Custom('GirlBoy')] musím přistupovat opatrně. Než stačím promluvit, vrazí mi do rukou chatrná paže ten uzlík.\n\n„Prosím, laskavý [ROOT.Char.GetWomanMan], nemohl byste mně a tomu maličkému dát něco k jídlu?“\n\n[Select_CString(urchin_recruit.IsFemale,'Její','Jeho')] druhá ruka už šmátrá po mém váčku. Uzlík vyklouzne a dopadne na zem; v dece jsou zabalené tři kameny, přesně jak jsem tušil. Očividná lest, ale odvážná." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1325.a: "Okamžitě vytáhni tu ruku z mého váčku!" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1325.a.success: "Chytíš zloděje" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1325.a.failure: "Jsi příliš pomalý" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1325.b: "Mé společnosti by se šikovné ruce hodily." # todo: NEW TRANSLATION
