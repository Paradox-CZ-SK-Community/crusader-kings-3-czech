 gdp_visit_holding_decision_event.1330.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1330.recruit_benefits.tt$" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1330.recruit_benefits.tt$" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1330.b: "Pověz mi, co studuješ." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1330.c: "O nebesích něco vím." # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1330.c.success: "[monk.GetFirstNameNoTooltip] uděláš dojem" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1330.c.failure: "[monk.GetFirstName] odejde, aniž bys na něj udělal dojem" # todo: NEW TRANSLATION
 gdp_visit_holding_decision_event.1330.d: "Snad někdy jindy." # todo: NEW TRANSLATION
