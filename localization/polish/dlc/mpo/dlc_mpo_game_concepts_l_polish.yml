l_polish:
 game_concept_nomadic_government: "Kočovná vláda"
 game_concept_nomadic: "Kočovný"
 game_concept_nomadic_desc: "Kočovní [Concept('rulers','vládci')|E] spásají [Concept('county_fertility','úrodnost hrabství')|E], aby rozšiřovali své [Concept('herd','stádo')|E]. Stádo mohou použít jako [Concept('horde','nomádskou hordu')|E], kterou lze vylepšit na [Concept('men_at_arms','ozbrojence')|E]. Mají [Concept('yurt','kočovné hlavní sídlo')|E].\n\nNomádi mohou [Concept('migrate','migrovat')|E] a hledat úrodnější země, ačkoli velká kočovná [Concept('realms','panství')|E] mohou své stádo rozšiřovat prostřednictvím [Concept('tributaries','tributářů')|E] nebo dosažením vysoké [Concept('fertility_equilibrium','rovnováhy úrodnosti')|E].\n\nNomádi mají vyšší maximální [Concept('dread','hrůzu')|E]."
 game_concept_nomad_i: "@government_type_nomad!"
 game_concept_nomads: "Nomádi"
 game_concept_nomads_desc: "$game_concept_nomadic_desc$"
 game_concept_nomad: "Nomád"
 game_concept_nomad_desc: "$game_concept_nomadic_desc$"
 game_concept_confederation_government: "Konfederační vláda"
 game_concept_confederation: "Konfederace"
 game_concept_confederations: "Konfederace"
 game_concept_confederation_desc: "Vztah, který váže [Concept('tribal','kmenové')|E] nebo [Concept('nomadic','kočovné')|E] [Concept('rulers','vládce')|E] ke vzájemné obraně, podobně jako [Concept('alliance','aliance')|E]. Konfederace vzniklá prostřednictvím [Concept('decision','rozhodnutí')|E] #high $call_for_confederation_decision$#! vyžaduje, aby se její členové připojovali k obranným [Concept('wars','válkám')|E] ostatních členů. Konfederace jsou viditelné v záložce Diplomacie.\n\nOstatní [Concept('confederates','konfederáti')|E] na sebe také nesmějí útočit ani podnikat [Concept('raid','nájezdy')|E]. Mají omezený přístup k vysokým úrovním [Concept('tribal_authority','kmenové autority')|E] a [Concept('nomadic_authority','dominance')|E] a nesmějí vytvářet nové [Concept('titles','tituly')|E].\n\n[Concept('confederates','Konfederáti')|E] mohou použít [Concept('decision','rozhodnutí')|E] #high $leave_confederation_decision$#! nebo [Concept('migrate','migrovat')|E], aby se stali [Concept('independent','nezávislými')|E]. Pokud v konfederaci zůstane pouze jeden člen, zanikne."
 game_concept_confederate: "Konfederát"
 game_concept_confederates: "Konfederáti"
 game_concept_confederate_desc: "[Concept('ruler','Vládce')|E], který je v [Concept('confederation','konfederaci')|E]. Automaticky se připojí k obranným [Concept('wars','válkám')|E] ostatních konfederátů a nesmí je napadat ani proti nim podnikat [Concept('raiding','plenění')|E]."
 game_concept_county_fertility: "Úrodnost hrabství"
 game_concept_county_fertility_desc: "$game_concept_county_fertility$ existuje v [Concept('counties','hrabstvích')|E] nacházejících se ve [Concept('the_great_steppe','Velké stepi')|E] a [Concept('rulers','vládci')|E] s vládou typu [GetGovernment( 'nomad_government' ).GetName] ji mohou spásat, aby navýšili své [Concept('herd','stádo')|E].\n\nÚrodnost hrabství představuje kvalitu jeho pastvin.\n\nÚrodnost se ustaluje kolem [Concept('fertility_equilibrium','rovnováhy úrodnosti')|E], což kočovným vládcům s velkým [Concept('domain_limit','limitem domény')|E] umožňuje udržovat růst stáda. Úrodnost ovlivňují [Concept('steppe_seasons','stepní období')|E] a pomalu ji obnovují [Concept('herders','pastevci')|E].\n\nKdyž je úrodnost [Concept('realm','panství')|E] nízká, je to znamení k [Concept('migrate','migraci')|E].\n\n[Concept('county_control','Kontrola hrabství')|E] zpomaluje tempo růstu úrodnosti o procento odpovídající současné kontrole."
 game_concept_county_fertility_i: "@county_fertility_icon!"
 game_concept_fertility_equilibrium: "Rovnováha úrodnosti"
 game_concept_fertility_equilibrium_desc: "$game_concept_fertility_equilibrium$ je předpověď toho, jak úrodné bude [Concept('county','hrabství')|E] v delším časovém horizontu. Je to hodnota, k níž bude [Concept('county_fertility','úrodnost hrabství')|E] časem směřovat.\n\nPokud je současná [Concept('county_fertility','úrodnost hrabství')|E] pod rovnováhou, poroste; pokud je nad ní, bude klesat.\n\nRovnováha úrodnosti a rychlost změny závisejí hlavně na poměru modifikátorů růstu a spotřeby daného [Concept('county','hrabství')|E]. Pokud jsou růst i spotřeba relativně malé, jakákoli změna bude mít na rovnováhu mnohem větší dopad."
 game_concept_equilibrium: "Rovnováha"
 game_concept_domain_fertility: "Úrodnost domény"
 game_concept_domain_fertility_desc: "$game_concept_domain_fertility$ je celková [Concept('county_fertility','úrodnost hrabství')|E] všech tvých držených [Concept('counties','hrabství')|E]."
 game_concept_seasonal_prediction: "Sezónní předpověď"
 game_concept_seasonal_prediction_desc: "Zdatný $court_position_court_astrologer$ dokáže v oblasti předpovědět další [Concept('steppe_season','stepní období')|E] a poskytnout svému lennímu pánovi užitečné informace pro plánování dalších kroků."
 game_concept_kurultai: "Kurultaj"
 game_concept_kurultais: "Kurultaje"
 game_concept_kurultai_member: "Člen kurultaje"
 game_concept_kurultai_members: "Členové kurultaje"
 game_concept_kurultai_desc: "U [Concept('nomadic_government','kočovné vlády')|E] nahrazuje kurultaj [Concept('council','radu')|E]. Členové kurultaje patří k elitě panství a je třeba je buď usmířit, nebo přinutit k [Concept('obedience','poslušnosti')|E], aby bylo zajištěno hladké [Concept('succession','nástupnictví')|E].\n\nPo chaotickém nástupnictví mohou ukrást část [Concept('herd','stáda')|E], opustit svého nového [Concept('liege','lenního pána')|E] a získají [Concept('claim','nárok')|E] na [Concept('title','titul')|E] [Concept('realm','panství')|E]."
 game_concept_kurultai_1_desc: "$game_concept_kurultai_desc$"
 game_concept_kurultai_2_desc: "$game_concept_kurultai_desc$"
 game_concept_kurultai_3_desc: "$game_concept_kurultai_desc$"
 game_concept_kurultai_4_desc: "$game_concept_kurultai_desc$"
 game_concept_herd: "Stádo"
 game_concept_herd_desc: "$game_concept_herd$ představuje lid [Concept('ruler','vládce')|E] s vládou typu [GetGovernment( 'nomad_government' ).GetName] a jeho stáda zvířat, jako jsou koně, ovce a kozy.\n\nLze jej získat držením [Concept('counties','hrabství')|E] s vysokou [Concept('county_fertility','úrodností hrabství')|E], od [Concept('vassals','vazalů')|E] nebo od [Concept('tributaries','tributářů')|E]. Kulturní [Concept('traditions','tradice')|E], [Concept('dynasty_perks','dynastické odkazy')|E], [Concept('legitimacy','legitimita')|E] a některé [Concept('yurt_buildings','budovy jurty')|E] v [Concept('yurt','kočovném hlavním sídle')|E] mohou poskytovat bonusy k zisku $game_concept_herd$.\n\nKdyž vládce povolá své [Concept('armies','armády')|E], část stáda se přemění na [Concept('horde','nomádskou hordu')|E], kterou lze poté za sníženou cenu přeměnit na [Concept('men_at_arms','ozbrojence')|E]. Jakmile jsou tyto armády rozpuštěny, zbývající nomádská horda se přemění zpět na stádo.\n\nStádo poskytuje malý pravidelný přísun [Concept('gold','zlata')|E] a lze jej také používat jako měnu pro některá [Concept('decisions','rozhodnutí')|E] nebo ke zvýšení přijetí [Concept('migration','migrace')|E]."
 game_concept_herd_i: "@herd_icon!"
 game_concept_horde: "Nomádská horda"
 game_concept_horde_desc: "$game_concept_horde$ představuje vojenskou sílu [Concept('ruler','vládce')|E] s vládou typu [GetGovernment( 'nomad_government' ).GetName]. Získává se jako část jeho [Concept('herd','stáda')|E] a objevuje se pouze tehdy, když [Concept('ruler','vládce')|E] povolá své [Concept('armies','armády')|E].\n\nPřeměňuje se na [GetMaA('nomadic_riders').GetName], které lze za cenu ve [Concept('gold','zlatě')|E] vylepšit na jiné [Concept('men_at_arms','ozbrojence')|E].\n\nNěkteré kulturní [Concept('traditions','tradice')|E], perky odkazu [Concept('dynasty','dynastie')|E] a [Concept('yurt_buildings','budovy jurty')|E] mohou zvýšit míru této přeměny."
 game_concept_herder: "Pastevec"
 game_concept_herder_desc: "Pastevecká panství jsou vyňata ze všech aspektů vládnutí. Nevelí [Concept('armies','armádám')|E], nevlastní [Concept('buildings','budovy')|E], nevytvářejí [Concept('alliances','aliance')|E] ani nevyhlašují [Concept('wars','války')|E]. Když [Concept('nomads','nomádi')|E] [Concept('migrate','migrují')|E] [Concept('holding','državu')|E], pastevci díky svému menšímu stádu pomalu obnovují místní [Concept('county_fertility','úrodnost hrabství')|E].\n\nSkuteční [Concept('nomad','nomádští')|E] [Concept('rulers','vládci')|E] je zastrašují a při výzvě se okamžitě vzdají své země."
 game_concept_herder_i: "@government_type_herder!"
 game_concept_herders: "Pastevci"
 game_concept_herders_desc: "$game_concept_herder_desc$"
 game_concept_nomadic_holding: "Kočovné sídliště"
 game_concept_nomadic_holding_desc: "$game_concept_nomadic_holdings$ představují existenci [Concept('yurt','kočovného hlavního sídla')|E] na mapě. Jsou [Concept('holding_type','typem državy')|E] používaným [Concept('rulers','vládci')|E] s vládou typu [GetGovernment( 'nomad_government' ).GetName] a poskytují malé množství [Concept('county_control','kontroly hrabství')|E] a [Concept('county_opinion','lidového mínění')|E]."
 game_concept_nomadic_holdings: "Kočovná sídliště"
 game_concept_nomadic_holdings_desc: "$game_concept_nomadic_holding_desc$"
 game_concept_herder_holding: "Pastevecké sídliště"
 game_concept_herder_holding_desc: "$game_concept_herder_holding$ je nejmenší z [Concept('holding_types','typů držav')|E]. Představuje přítomnost [Concept('herders','pastevců')|E] v oblasti a poskytuje bonusy k [Concept('county_fertility','úrodnosti hrabství')|E]."
 game_concept_nomadic_authority: "Dominance"
 game_concept_nomadic_authority_desc: "$game_concept_nomadic_authority$ představuje promítanou moc [Concept('ruler','vládce')|E] s vládou typu [GetGovernment( 'nomad_government' ).GetName]. Lze ji zvyšovat velikostí [Concept('herd','stáda')|E] a odemyká další možnosti [Concept('migration','migrace')|E].\n\nExistuje pět různých úrovní $game_concept_nomadic_authority$: [Concept('unruly_nomadic','nezkrotní nomádi')|E], [Concept('limited_nomadic','omezená')|E], [Concept('high_nomadic','vysoká')|E], [Concept('absolute_nomadic','absolutní')|E] a [Concept('unrestricted_nomadic','neomezená')|E].\n\n#weak Poslední úroveň může během jedné hry získat pouze jediný vládce.#!"
 game_concept_dominance: "$game_concept_nomadic_authority$"
 game_concept_unruly_nomadic: "Nezkrotní nomádi"
 game_concept_unruly_nomadic_desc: "$game_concept_unruly_nomadic$ je nejnižší úroveň [Concept('nomadic_authority','dominance')|E]. Na této úrovni může [Concept('migration','migrace')|E] cílit pouze na [Concept('de_jure','de iure')|E] [Concept('titles','tituly')|E] [Concept('county','hrabství')|E] v rámci [Concept('the_great_steppe','Velké stepi')|E] a [Concept('characters','postavy')|E] nemohou být [Concept('imprisoned','uvězněny')|E]."
 game_concept_limited_nomadic: "Omezená"
 game_concept_limited_nomadic_desc: "$game_concept_limited_nomadic$ je druhá nejnižší úroveň [Concept('nomadic_authority','dominance')|E]. [Concept('migration','Migrace')|E] může cílit na [Concept('de_jure','de iure')|E] [Concept('titles','tituly')|E] [Concept('duchy','vévodství')|E] v rámci [Concept('the_great_steppe','Velké stepi')|E], [Concept('titles','tituly')|E] lze odebírat a lenní pán nyní může [Concept('imprison','uvěznit')|E] [Concept('characters','postavy')|E] ve svém [Concept('realm','panství')|E].\n\nLze použít [Concept('decision','rozhodnutí')|E] #V $step_away_from_the_steppe_decision$#!"
 game_concept_high_nomadic: "Vysoká"
 game_concept_high_nomadic_desc: "$game_concept_high_nomadic$ je prostřední úroveň [Concept('nomadic_authority','dominance')|E]. Na této úrovni může [Concept('migration','migrace')|E] cílit na [Concept('de_jure','de iure')|E] [Concept('titles','tituly')|E] [Concept('kingdom','království')|E] v rámci [Concept('the_great_steppe','Velké stepi')|E] a lenní pán může [Concept('retract','odejmout')|E] vazaly svého [Concept('vassal','vazala')|E]."
 game_concept_absolute_nomadic: "Absolutní"
 game_concept_absolute_nomadic_desc: "$game_concept_absolute_nomadic$ je druhá nejvyšší úroveň [Concept('nomadic_authority','dominance')|E]. Na této úrovni může [Concept('migration','migrace')|E] cílit na [Concept('de_jure','de iure')|E] [Concept('titles','tituly')|E] [Concept('empire','říše')|E] v rámci [Concept('the_great_steppe','Velké stepi')|E].\n\n[Concept('independent','Nezávislí')|E] [Concept('rulers','vládci')|E] se mohou usadit mimo step pomocí [Concept('decision','rozhodnutí')|E] #high $settle_the_steppe_decision$#!"
 game_concept_unrestricted_nomadic: "Neomezená"
 game_concept_unrestricted_nomadic_desc: "$game_concept_unrestricted_nomadic$ je nejvyšší úroveň [Concept('nomadic_authority','dominance')|E]. Tuto úroveň může v celé hře získat pouze jedna [Concept('character','postava')|E] a stane se [GetTrait('greatest_of_khans').GetName( GetNullCharacter )].\n\n[Concept('independent','Nezávislí')|E] [Concept('rulers','vládci')|E] mohou použít [Concept('decisions','rozhodnutí')|E] #high $mpo_become_greatest_of_khans_decision$#! a #high $mpo_gok_world_conquest_decision$#!"
 game_concept_the_great_steppe: "Velká step"
 game_concept_the_great_steppe_desc: "$game_concept_the_great_steppe$ představuje nekonečné moře trávy Eurasijské stepi i klimatické podmínky, které jej utvářejí, a dělí se na tři oblasti: západní, střední a východní.\n\nJednotlivá [Concept('steppe_seasons','stepní období')|E] znázorňují jak příznivé, tak nepříznivé události, nabízejí příležitosti ke zvláštním akcím dostupným pouze v danou dobu a upravují [Concept('county_fertility','úrodnost hrabství')|E] v každé oblasti.\n\nTéto [Concept('situation','situace')|E] se účastní pouze vládci typu [GetGovernment( 'nomad_government' ).GetName] a [Concept('herder','pastevečtí')|E] [Concept('rulers','vládci')|E] a [Concept('gurkhan','gürkhan')|E] představuje nejmocnějšího vládce v celé oblasti."
 game_concept_suzerain: "Suzerén"
 game_concept_suzerain_desc: "$game_concept_suzerain$ je [Concept('ruler','vládce')|E] s alespoň jedním [Concept('tributary','tributářem')|E]. Suzeréni sami mohou být tributáři jiného [Concept('ruler','vládce')|E], ale nikdy nesmějí být [Concept('vassals','vazaly')|E]."
 game_concept_suzerains: "Suzeréni"
 game_concept_suzerains_desc: "$game_concept_suzerain_desc$"
 game_concept_suzerain_possessive: "Suzerénův"
 game_concept_tributary: "Tributář"
 game_concept_tributary_desc: "$game_concept_tributary$ je [Concept('ruler','vládce')|E], který uzavřel dohodu s jiným vládcem, svým [Concept('suzerain','suzerénem')|E].\n\n$game_concept_tributary$ odvádí pravidelný tribut v podobě [Concept('herd','stáda')|E], [Concept('taxes','daní')|E], [Concept('prestige','prestiže')|E] nebo dokonce [Concept('piety','zbožnosti')|E] podle svého typu a výměnou za to získává [Concept('truce','příměří')|E] se $game_concept_suzerain$.\n\nTributáři jsou volnější formou podřízenosti, která se nemůže připojovat k [Concept('factions','frakcím')|E], ale může se osvobodit, pokud nejsou splněny její požadavky.\n\nPokud suzerén již není [Concept('landed','zeměpánem')|E] ani [Concept('migrating','nemigruje')|E], tributáři se po krátké době osvobodí."
 game_concept_tributaries: "Tributáři"
 game_concept_tributary_possessive: "Tributářův"
 game_concept_tributaries_desc: "$game_concept_tributary_desc$"
 game_concept_subject: "Subjekt"
 game_concept_subject_desc: "$game_concept_subject$ je jakýkoli [Concept('ruler','vládce')|E], který přísahal věrnost jinému vládci. Může mít různé podoby, například [Concept('vassals','vazalové')|E] nebo [Concept('tributaries','tributáři')|E], přičemž každá má vlastní specifika."
 game_concept_subjects: "Subjekti"
 game_concept_subjects_desc: "$game_concept_subject_desc$"
 game_concept_steppe_season: "Stepní období"
 game_concept_steppe_season_desc: "$game_concept_steppe_season$ představuje současné klima [Concept('the_great_steppe','Velké stepi')|E] a jeho účinky na [Concept('county_fertility','úrodnost hrabství')|E], stejně jako akce dostupné [Concept('rulers','vládcům')|E] zapojeným do [Concept('situation','situace')|E].\n\n$game_concept_steppe_seasons$ jsou pro každou oblast nezávislá a vládci typu [GetGovernment( 'nomad_government' ).GetName] se mohou chtít přesunout do oblastí s příznivými aktivními obdobími.\n\nObčas může stejné období nastat ve více než jedné [Concept('situation_sub_region','oblasti situace')|E] zároveň."
 game_concept_steppe_seasons: "Stepní období"
 game_concept_steppe_seasons_desc: "$game_concept_steppe_season_desc$"
 game_concept_situation: "Situace"
 game_concept_situation_situations: "Situace"
 game_concept_situation_desc: "$game_concept_situation_situations$ jsou střednědobé až dlouhodobé záležitosti, které zahrnují postavy v geografické [Concept('situation_sub_region','oblasti situace')|E] a přecházejí mezi různými [Concept('situation_phases','fázemi situace')|E]."
 game_concept_situation_phase: "Fáze situace"
 game_concept_situation_phase_desc: "Každá $game_concept_situation_phase$ má vlastní modifikátory a podmínky, které ovlivňují zapojené postavy.\n\nNěkteré $game_concept_situation_phases$ se spouštějí konkrétními podmínkami, zatímco jiné jednoduše následují plynutí času."
 game_concept_situation_phases: "Fáze situace"
 game_concept_situation_phases_desc: "$game_concept_situation_phase_desc$"
 game_concept_situation_sub_region: "Oblast situace"
 game_concept_situation_sub_regions: "Oblasti situace"
 game_concept_situation_sub_region_desc: "[Concept('situation_situations','Situace')|E] mohou mít více než jednu oblast, přičemž každá z nich má nezávislé [Concept('situation_phases','fáze situace')|E]."
 game_concept_situation_sub_regions_desc: "$game_concept_situation_sub_region_desc$"
 game_concept_situation_participant_group: "Skupina účastníků"
 game_concept_situation_participant_groups: "Skupiny účastníků"
 game_concept_situation_participant_group_desc: "Skupiny účastníků v rámci [Concept('situation','situace')|E] jsou soubory postav, které během každé [Concept('situation_phase','fáze situace')|E] sdílejí stejné účinky."
 game_concept_situation_catalyst: "Katalyzátor situace"
 game_concept_situation_catalyst_catalyst: "Katalyzátor"
 game_concept_situation_catalyst_catalysts: "Katalyzátory"
 game_concept_situation_catalyst_desc: "Některé [Concept('situation_situations','situace')|E] přecházejí mezi [Concept('situation_phases','fázemi situace')|E], když nastane $game_concept_situation_catalyst$.\n\nSeznam toho, které $game_concept_situation_catalyst$ jsou důležité v jednotlivých $game_concept_situation_phase$, najdeš v okně $game_concept_situation$."
 game_concept_migration: "Migrace"
 game_concept_migration_desc: "$game_concept_migration$ je pro [Concept('nomads','nomády')|E] nezbytná. Když je [Concept('county_fertility','úrodnost hrabství')|E] v jejich [Concept('realms','panstvích')|E] nízká, často se přesunou hledat zelenější pastviny.\n\nMigrace může cílit pouze na [Concept('de_jure','de iure')|E] [Concept('titles','tituly')|E] a dostupné [Concept('title_tiers','úrovně')|E] jsou omezeny [Concept('nomadic_authority','dominancí')|E] [Concept('ruler','vládce')|E].\n\nNávrh bude zaslán nomádovi s největším [Concept('herd','stádem')|E] v požadované oblasti a ten se může rozhodnout, zda své země dobrovolně opustí, nebo půjde do války, aby je bránil.\n\n[Concept('herders','Pastevci')|E] své země vždy opustí, protože nemají prostředky k vlastní obraně."
 game_concept_migrate: "Migrovat"
 game_concept_migrate_desc: "$game_concept_migration_desc$"
 game_concept_migrates: "Migruje"
 game_concept_migrated: "Migroval"
 game_concept_migrating: "Migrující"
 game_concept_raid_intent: "Záměr nájezdu"
 game_concept_raid_intent_desc: "$game_concept_raid_intent$ může upravit typy odměn získaných z [Concept('raid','nájezdu')|E], rychlost pohybu armády nebo její kapacitu [Concept('loot','kořisti')|E]. Kromě běžného nájezdu za [Concept('gold','zlato')|E] a [Concept('prestige','prestiž')|E] existují alternativy, jako je pokus o zničení [Concept('buildings','budov')|E] nebo zvýšení šance na [Concept('imprisoning','uvěznění')|E] [Concept('characters','postav')|E]."
 game_concept_raid_intents: "Záměry nájezdu"
 game_concept_raid_intents_desc: "$game_concept_raid_intent_desc$"
 game_concept_gurkhan: "Gürkhan"
 game_concept_gurkhan_desc: "Největší hrozba [Concept('the_great_steppe','Velké stepi')|E]. $game_concept_gurkhan$ je [Concept('ruler','vládce')|E] typu [GetGovernment( 'nomad_government' ).GetName] s největším [Concept('herd','stádem')|E] v celé oblasti, což z něj činí mocného spojence nebo děsivého nepřítele.\n\nPouze $game_concept_gurkhan$ může dosáhnout nejvyšší úrovně [Concept('nomadic_authority','dominance')|E], což mu umožňuje stát se [GetTrait('greatest_of_khans').GetName( GetNullCharacter )] a označuje jej jako cíl."
 game_concept_yurt: "Kočovné hlavní sídlo"
 game_concept_yurt_desc: "$game_concept_yurts$ jsou pohyblivé soubory stanů, dobytka, lidí a koní. Mohou sahat od několika ovcí až po burácející hordu.\n\n[Concept('rulers','Vládci')|E] typu [GetGovernment( 'nomad_government' ).GetName] mají $game_concept_yurt$, které rozšiřují prostřednictvím [Concept('yurt_buildings','budov jurty')|E] a berou si je s sebou, když [Concept('migrate','migrují')|E]. Nemohou stavět běžné [Concept('buildings','budovy')|E] v [Concept('holdings','državách')|E].\n\n$game_concept_yurt$ má [Concept('faith','víru')|E] a [Concept('culture','kulturu')|E] představující většinu migrujícího lidu, které se mohou lišit od víry a kultury [Concept('ruler','vládce')|E].\n\nCelý jejich [Concept('court','dvůr')|E] cestuje s nimi, stejně jako jejich [Concept('family','rodina')|E], [Concept('kurultai','kurultaj')|E] a [Concept('knights','rytíři')|E]."
 game_concept_yurts: "Kočovná hlavní sídla"
 game_concept_yurts_desc: "$game_concept_yurt_desc$"
 game_concept_yurt_buildings: "Budovy jurty"
 game_concept_yurt_buildings_desc: "$game_concept_yurt_buildings$ jsou jedinečná vylepšení $game_concept_yurt$.\n\nMechanicky jde o [Concept('domicile_buildings','budovy domicilu')|E] — mnohé však představují spíše společenské zvyklosti nebo prostě oblasti zaměření $game_concept_nomad$ kmene, nikoli doslovné stavby.\n\nBonusy, které mohou poskytovat, zahrnují:\n$EFFECT_LIST_BULLET$Odemykání [Concept('court_positions','dvorských úřadů')|E], nomádských [Concept('decisions','rozhodnutí')|E] a [Concept('character_interaction','interakcí s postavou')|E]\n$EFFECT_LIST_BULLET$Různé bonusy ke [Concept('herd','stádu')|E] a [Concept('county_fertility','úrodnosti hrabství')|E], včetně specializací na [Concept('terrain','terén')|E]\n$EFFECT_LIST_BULLET$Odemykání a vylepšování nomádských [Concept('men_at_arms','ozbrojenců')|E] a posilování síly [Concept('horde','nomádské hordy')|E]\n$EFFECT_LIST_BULLET$Jedinečné bonusy nomádských [Concept('culture_tradition','kulturních tradic')|E]\n$EFFECT_LIST_BULLET$Způsoby, jak spravovat své [Concept('vassals','vazaly')|E] a [Concept('tributaries','tributáře')|E] i ovlivňovat [Concept('characters','postavy')|E] u svého dvora\n$EFFECT_LIST_BULLET$Bonusy ke [Concept('kurultai','kurultaji')|E] a [Concept('obedience','poslušnosti')|E]."
 game_concept_yurt_building: "Budova jurty"
 game_concept_yurt_building_desc: "$game_concept_yurt_buildings_desc$"
 game_concept_obedience: "Poslušnost"
 game_concept_obedience_desc: "V [Concept('realms','panstvích')|E] typu [GetGovernment( 'nomad_government' ).GetName] určuje poslušnost věrnost [Concept('character','postavy')|E] vůči jejímu [Concept('liege','lennímu pánovi')|E], [Concept('suzerain','suzerénovi')|E] nebo vlastníkovi jejího [Concept('court','dvora')|E]. Postavy mohou být poslušné vždy pouze jednomu [Concept('ruler','vládci')|E].\n\nPoslušné postavy se méně často účastní [Concept('hostile_schemes','nepřátelských intrik')|E], připojují k [Concept('wars','válkám')|E] nebo vstupují do [Concept('factions','frakcí')|E] proti svému lennímu pánovi. Během [Concept('succession','nástupnictví')|E] budou vždy podporovat preference svého lenního pána a nebudou vůči němu prosazovat své [Concept('claims','nároky')|E]. Neposlušní [Concept('tributaries','tributáři')|E] se mohou pokusit osvobodit.\n\nKdyž skóre postavy překročí [Concept('obedience_threshold','práh poslušnosti')|E], stane se poslušnou."
 game_concept_obedient: "Poslušný"
 game_concept_obedience_i: "@obedience_icon!"
 game_concept_obedient_desc: "$game_concept_obedience_desc$"
 obedience_value: "[Concept('obedience','Poslušnost')|E]:"
 obedience_threshold_value: "[Concept('obedience_threshold','Práh poslušnosti')|E]:"
 game_concept_disobedient: "Neposlušný"
 game_concept_disobedience_i: "@disobedience_icon!"
 game_concept_disobedient_desc: "$game_concept_obedience_desc$"
 game_concept_obedience_threshold: "Práh poslušnosti"
 game_concept_obedience_threshold_desc: "$game_concept_obedience_threshold$ je skóre, kterého musí [Concept('characters','postavy')|E] dosáhnout, aby byly považovány za [Concept('obedient','poslušné')|E].\n\nPráh ovlivňuje řada faktorů: zda jsou [Concept('close_family','blízkou rodinou')|E] [Concept('overlord','vrchního pána')|E], zda jsou [Concept('primary_heir','hlavním dědicem')|E], jejich [Concept('friendship','přátelství')|E] nebo [Concept('rivalry','sokovství')|E], jejich [Concept('traits','rysy')|E] a zda je zaměstnáváš ve svém [Concept('kurultai','kurultaji')|E] nebo [Concept('court','dvoře')|E]. [Concept('children','Děti')|E] bývají poslušné častěji než dospělí.\n\n[Concept('rulers','Vládci')|E] typu [GetGovernment( 'nomad_government' ).GetName] mohou použít [Concept('decision','rozhodnutí')|E] #EMP $mpo_desperate_stance_decision$#!, aby učinili poslušnými všechny, [Concept('intent','záměr')|E] #EMP $impose_obedience_intent$#! během [GetActivityType( 'activity_hunt').GetName], aby zacílili jednu postavu, a [Concept('character_interaction','interakci s postavou')|E] #EMP $mpo_demand_obedience_interaction$#!, pokud mají dostatečně vysokou [Concept('dread','hrůzu')|E]."
 game_concept_overlord: "Vrchní pán"
 game_concept_overlord_desc: "$game_concept_overlord$ je [Concept('ruler','vládce')|E], jemuž jiný vládce slíbil poslušnost, buď jako [Concept('vassal','vazal')|E], nebo jako [Concept('tributary','tributář')|E]. [Concept('suzerains','Suzeréni')|E] i [Concept('lieges','lenní páni')|E] jsou vrchní páni."
 game_concept_overlord_possessive: "Vrchního pána"
 game_concept_settlement_issue: "Záležitost osídlení"
 game_concept_settlement_issue_desc: "Záležitosti osídlení jsou úkoly zadávané [Concept('nomad','nomádskému')|E] [Concept('ruler','vládci')|E] po dokončení [Concept('migration','migrace')|E] do nových zemí. Dávají příležitost řešit konflikty a zvýšit místní [Concept('county_control','kontrolu hrabství')|E] v nové [Concept('domain','doméně')|E].\n\nTyto záležitosti se budou v prvních letech po migraci vládce objevovat dál, dokud má hrabství nízkou kontrolu hrabství."
 game_concept_settlement_issue_tier: "Úroveň záležitosti osídlení"
 game_concept_settlement_issue_tier_desc: "Každá [Concept('settlement_issue','záležitost osídlení')|E] má úroveň záležitosti osídlení, která odráží celkové odměny za její úspěšné vyřešení. Vyřešení záležitosti vyšší úrovně obvykle přinese kromě [Concept('county_control','kontroly hrabství')|E] více odměn."
 game_concept_unmanaged_holdings: "Nespravované državy"
 game_concept_unmanaged_holding: "Nespravovaná država"
 game_concept_unmanaged_holdings_desc: "Jde o neaktivní [Concept('holdings','državy')|E], které se nezapočítávají do tvého [Concept('domain_limit','limitu domény')|E]."
 game_concept_nerge: "Nerge"
 game_concept_nerge_outcome: "Výsledek nerge"
 game_concept_nerge_desc: "Nerge je zvláštní typ [GetActivityType('activity_hunt').GetName], který mohou podnikat [Concept('rulers','vládci')|E] typu [GetGovernment( 'nomad_government' ).GetName]. Namísto lovu jediného zvířete jde o rozsáhlý hon, při němž jsou pobity stovky, ne-li tisíce zvířat.\n\nNamísto běžné [Concept('hunt_success_chance','šance na úspěch lovu')|E] sleduje skóre výsledku nerge podle toho, kolik zvířat bylo zabito, a to určuje druh odměn, které [Concept('activity_host_short','pořadatel')|E] a [Concept('activity_guests_short','hosté')|E] získají.\n\nÚspěšné nerge obvykle udělí:\n$BULLET_WITH_TAB$[legitimacy_i][Concept('legitimacy','legitimitu')|E]\n$BULLET_WITH_TAB$[prestige_i][Concept('prestige','prestiž')|E]\n$BULLET_WITH_TAB$[dread_i][Concept('dread','hrůzu')|E]\n$BULLET_WITH_TAB$[gold_i][Concept('gold','zlato')|E]\nA v některých případech může udělit:\n$BULLET_WITH_TAB$[martial_i][Concept('martial','válečnictví')|E]\n$BULLET_WITH_TAB$[command_modifier_i][Concept('commander_trait','velitelský rys')|E] nebo [Concept('trait_level_track_xp','zkušenosti rysu')|E]"
 game_concept_dominate_title: "Ovládnout titul"
 game_concept_domination_war: "Válka o dominanci"
 game_concept_dominate_title_desc: "[Concept('nomads','Nomádi')|E], kteří chtějí získat [Concept('title','titul')|E] vyšší [Concept('title_tier','úrovně')|E] bez [Concept('migrating','migrace')|E], mají možnost bojovat s místními obyvateli oblasti o titul, pokud mají správnou úroveň [Concept('dominance','dominance')|E].\n\nPokud daný titul někdo drží, zahájí proti tomuto cíli válku, aby mu titul uzurpovali. Pokud daný titul nikdo nedrží, budou místo toho bojovat proti každému jednotlivému ne-[Concept('tributary','tributáři')|E] a ne-[Concept('ally','spojenci')|E] v [Concept('de_jure','de iure')|E] oblasti daného titulu.\n\nPři vítězství agresor získá daný titul a všichni obránci se stanou jeho tributáři. Při porážce agresor zaplatí obránci [gold_i][Concept('gold','zlato')|E] a ztratí značné množství [dread_i][Concept('dread','hrůzy')|E].\n\nPokud držitel [Concept('decision','rozhodnutí')|E] drží celou de iure oblast, titul jednoduše získá okamžitě, protože zde nejsou žádní obránci, s nimiž by bylo třeba bojovat."
 game_concept_expand_dominance: "Rozšířit dominanci"
 game_concept_dominance_expansion: "Rozšíření dominance"
 game_concept_expand_dominance_desc: "Zvláštní válka pro [Concept('rulers','vládce')|E] typu [GetGovernment( 'nomad_government' ).GetName] buď o oblast v rámci jejich [Concept('de_jure','de iure')|E] zemí, nebo za účelem rozšíření jejich [Concept('de_jure','de iure')|E] oblasti k novým hranicím.\n\nVšichni nomádští vládci s [Concept('title_tier','úrovní')|E] [Concept('duchy','vévodství')|E] nebo vyšší mohou zahájit válku uvnitř svého de iure území. Při vítězství se pokusí obránce buď [Concept('vassalize','vazalizovat')|E], nebo jej přinutit stát se [Concept('tributary','tributářem')|E], případně jeho země zcela dobýt, pokud drží půdu mimo cílové země války.\n\nAby nomádský vládce rozšířil svou vládu do cizích zemí, musí mít úroveň [Concept('kingdom','království')|E] nebo vyšší. Při vítězství se stále pokusí země vazalizovat, učinit tributárními nebo je dobýt, ale země se také okamžitě de iure přesunou pod hlavní titul nomádského vládce."
 game_concept_paiza: "Paiza"
 game_concept_paiza_desc: "Paiza neboli gerege je malá kovová tabulka vydávaná mocnými [Concept('characters','postavami')|E] ve [Concept('the_great_steppe','Velké stepi')|E], která přenáší chánovu moc na svého nositele.\n\nMechanicky jde o [Concept('artifacts','artefakty')|E], které mocný vládce typu [GetGovernment( 'nomad_government' ).GetName] uděluje svým oblíbencům prostřednictvím [Concept('character_interaction','interakce s postavou')|E] #V$mpo_interaction_grant_paiza$#!.\nPo přijetí [Concept('decision','rozhodnutí')|E] #V $mpo_establish_paiza_system_decision$#! získáš přístup k [Concept('decision','rozhodnutí')|E] #V $mpo_call_for_merchants_decision$#!, které ti umožní obchodovat s usedlým obyvatelstvem; tento obchod lze zlepšovat různými [Concept('internal_upgrades','vnitřními vylepšeními')|E] [Concept('yurt_buildings','budov jurty')|E] [GetDomicileBuilding('trade_yurt_01').GetName]\n\nPostavy nesoucí [Concept('artifacts','artefakty')|E] paizy se jménem žijícího [Concept('gurkhan','gürkhana')|E] však mají přístup k [Concept('decision','rozhodnutí')|E] #V $mpo_abuse_authority_paiza_decision$#! a [Concept('character_interaction','interakci s postavou')|E] #V $mpo_interaction_leverage_khan_authority$#!\n\n#weak Mocí Věčného nebe. Pod ochranou císařského štěstí. Výnos chána; kdokoli jej nebude ctít, bude potrestán a zemře.#!"
