l_polish:
 game_concept_nomadic_government: "Kočovná vláda"
 game_concept_nomadic: "Kočovný"
 game_concept_nomadic_desc: "Kočovní [Concept('rulers','vládci')|E] využívají [Concept('county_fertility','úrodnost hrabství')|E] k pastvě, a rozšiřují tak své [Concept('herd','stádo')|E]. Stádo mohou využít jako [Concept('horde','nomádskou hordu')|E], kterou lze následně přeměnit na [Concept('men_at_arms','ozbrojence')|E]. Jejich sídlem je [Concept('yurt','kočovné hlavní sídlo')|E].\n\nNomádi mohou [Concept('migrate','migrovat')|E] za úrodnější půdou, ale rozsáhlá kočovná [Concept('realms','panství')|E] mohou rozšiřovat svá stáda také díky [Concept('tributaries','tributářům')|E] nebo dosažení vysoké [Concept('fertility_equilibrium','rovnováhy úrodnosti')|E].\n\nNomádi mají vyšší maximální hodnotu [Concept('dread','hrůzy')|E]."
 game_concept_nomad_i: "@government_type_nomad!"
 game_concept_nomads: "Nomádi"
 game_concept_nomads_desc: "$game_concept_nomadic_desc$"
 game_concept_nomad: "Nomád"
 game_concept_nomad_desc: "$game_concept_nomadic_desc$"
 game_concept_confederation_government: "Konfederační vláda"
 game_concept_confederation: "Konfederace"
 game_concept_confederations: "Konfederace"
 game_concept_confederation_desc: "Konfederace je svazek, který spojuje [Concept('tribal','kmenové')|E] nebo [Concept('nomadic','kočovné')|E] [Concept('rulers','vládce')|E] za účelem vzájemné obrany, podobně jako [Concept('alliance','aliance')|E]. Vzniká prostřednictvím [Concept('decision','rozhodnutí')|E] #high $call_for_confederation_decision$#! a zavazuje své členy k účasti ve vzájemných obranných [Concept('wars','válkách')|E]. Konfederace se zobrazují na záložce Diplomacie.\n\nSpříznění [Concept('confederates','konfederáti')|E] na sebe navíc nesmějí útočit ani proti sobě podnikat [Concept('raid','nájezdy')|E]. Jsou omezeni v dosahování vysokých úrovní [Concept('tribal_authority','kmenové autority')|E] a [Concept('nomadic_authority','dominance')|E] a nesmějí vytvářet nové [Concept('titles','tituly')|E].\n\n[Concept('confederates','Konfederáti')|EU] mohou využít [Concept('decision','rozhodnutí')|E] #high $leave_confederation_decision$#! nebo [Concept('migrate','migrovat')|E], aby se stali [Concept('independent','nezávislými')|E]. Pokud v konfederaci zůstane jediný člen, konfederace zanikne."
 game_concept_confederate: "Konfederát"
 game_concept_confederates: "Konfederáti"
 game_concept_confederate_desc: "Konfederát je [Concept('ruler','vládce')|E], který je členem [Concept('confederation','konfederace')|E]. Automaticky se zapojuje do obranných [Concept('wars','válek')|E] ostatních konfederátů a nesmí na ně útočit ani je [Concept('raiding','plenit')|E]."
 game_concept_county_fertility: "Úrodnost hrabství"
 game_concept_county_fertility_desc: "$game_concept_county_fertility$ existuje v [Concept('counties','hrabstvích')|E] na území [Concept('the_great_steppe','Velké stepi')|E]. Jejich úrodnost mohou využívat k pastvě [Concept('rulers','vládci')|E], jejichž typem vlády je [GetGovernment( 'nomad_government' ).GetName|l], a rozšiřovat tak svá [Concept('herd','stáda')|E].\n\nÚrodnost hrabství vyjadřuje kvalitu jeho pastvin.\n\nÚrodnost se ustaluje kolem [Concept('fertility_equilibrium','rovnováhy úrodnosti')|E], což kočovným vládcům s vysokým [Concept('domain_limit','limitem domény')|E] umožňuje udržovat růst jejich stád. Úrodnost ovlivňují [Concept('steppe_seasons','stepní období')|E] a postupně ji obnovují [Concept('herders','pastevci')|E].\n\nNízká úrodnost [Concept('realm','panství')|E] naznačuje, že nastal čas [Concept('migrate','migrovat')|E].\n\n[Concept('county_control','Kontrola hrabství')|EU] zpomaluje růst úrodnosti o procentní podíl odpovídající své aktuální hodnotě."
 game_concept_county_fertility_i: "@county_fertility_icon!"
 game_concept_fertility_equilibrium: "Rovnováha úrodnosti"
 game_concept_fertility_equilibrium_desc: "Rovnováha úrodnosti představuje odhad toho, jaké úrodnosti [Concept('county','hrabství')|E] dlouhodobě dosáhne. Jde o hodnotu, k níž [Concept('county_fertility','úrodnost hrabství')|E] postupně směřuje.\n\nPokud je současná [Concept('county_fertility','úrodnost hrabství')|E] pod rovnovážnou hodnotou, bude růst. Pokud ji naopak převyšuje, bude klesat.\n\nRovnováha úrodnosti a rychlost její změny závisejí především na poměru modifikátorů růstu a spotřeby daného [Concept('county','hrabství')|E]. Pokud jsou růst i spotřeba relativně nízké, bude mít každá změna na rovnováhu výrazně větší vliv."
 game_concept_equilibrium: "Rovnováha"
 game_concept_domain_fertility: "Úrodnost domény"
 game_concept_domain_fertility_desc: "Úrodnost domény představuje součet [Concept('county_fertility','úrodnosti hrabství')|E] všech [Concept('counties','hrabství')|E], která osobně držíš."
 game_concept_seasonal_prediction: "Sezónní předpověď"
 game_concept_seasonal_prediction_desc: "Schopný $court_position_court_astrologer$ dokáže předpovědět následující [Concept('steppe_season','stepní období')|E] v dané oblasti a poskytnout svému lennímu pánovi cenné informace pro plánování dalších kroků."
 game_concept_kurultai: "Kurultaj"
 game_concept_kurultais: "Kurultaje"
 game_concept_kurultai_member: "Člen kurultaje"
 game_concept_kurultai_members: "Členové kurultaje"
 game_concept_kurultai_desc: "Kurultaj nahrazuje [Concept('council','radu')|E] v rámci [Concept('nomadic_government','kočovné vlády')|E]. Jeho členové patří k elitě [Concept('realm','panství')|E] a je třeba si je naklonit nebo je přimět k [Concept('obedience','poslušnosti')|E], aby [Concept('succession','nástupnictví')|E] proběhlo hladce.\n\nV případě chaotického nástupnictví mohou členové kurultaje ukrást část [Concept('herd','stáda')|E] a opustit svého nového [Concept('liege','lenního pána')|E]. Zároveň získají [Concept('claim','nárok')|E] na [Concept('title','titul')|E] celého [Concept('realm','panství')|E]."
 game_concept_kurultai_1_desc: "$game_concept_kurultai_desc$"
 game_concept_kurultai_2_desc: "$game_concept_kurultai_desc$"
 game_concept_kurultai_3_desc: "$game_concept_kurultai_desc$"
 game_concept_kurultai_4_desc: "$game_concept_kurultai_desc$"
 game_concept_herd: "Stádo"
 game_concept_herd_desc: "$game_concept_herd$ představuje lid a stáda zvířat, jako jsou koně, ovce a kozy, které patří [Concept('ruler','vládci')|E], jehož typem vlády je [GetGovernment( 'nomad_government' ).GetName|l].\n\nStádo lze rozšiřovat držením [Concept('counties','hrabství')|E] s vysokou [Concept('county_fertility','úrodností hrabství')|E], prostřednictvím [Concept('vassals','vazalů')|E] nebo [Concept('tributaries','tributářů')|E]. $game_concept_herd$ se může rozrůstat rychleji díky kulturním [Concept('traditions','tradicím')|E], [Concept('dynasty_perks','dynastickým odkazům')|E], [Concept('legitimacy','legitimitě')|E] a některým [Concept('yurt_buildings','budovám jurty')|E] v [Concept('yurt','kočovném hlavním sídle')|E].\n\nPři povolání [Concept('armies','armád')|E] se část stáda promění v [Concept('horde','nomádskou hordu')|E], jejíž jednotky lze za sníženou cenu přeměnit na [Concept('men_at_arms','ozbrojence')|E]. Po rozpuštění těchto armád se zbývající horda opět promění ve stádo.\n\nStádo zajišťuje malý, ale pravidelný přísun [Concept('gold','zlata')|E]. Lze jej také využít jako platidlo při některých [Concept('decisions','rozhodnutích')|E] nebo ke zvýšení ochoty přijmout [Concept('migration','migraci')|E]."
 game_concept_herd_i: "@herd_icon!"
 game_concept_horde: "Nomádská horda"
 game_concept_horde_desc: "$game_concept_horde$ představuje vojenskou sílu [Concept('ruler','vládce')|E], jehož typem vlády je [GetGovernment( 'nomad_government' ).GetName|l]. Vzniká převedením části jeho [Concept('herd','stáda')|E] a objevuje se pouze tehdy, když vládce povolá své [Concept('armies','armády')|E].\n\nHorda se promění v jednotky typu [GetMaA('nomadic_riders').GetName], které lze za [Concept('gold','zlato')|E] vylepšit na jiné druhy [Concept('men_at_arms','ozbrojenců')|E].\n\nNěkteré kulturní [Concept('traditions','tradice')|E], odkazy [Concept('dynasty','dynastie')|E] a [Concept('yurt_buildings','budovy jurty')|E] mohou zvýšit podíl stáda, který se přemění na hordu."
 game_concept_herder: "Pastevec"
 game_concept_herder_desc: "Pastevecká panství jsou vyňata ze všech běžných záležitostí vlády. Nevelí [Concept('armies','armádám')|E], nevlastní [Concept('buildings','budovy')|E], neuzavírají [Concept('alliances','aliance')|E] ani nevyhlašují [Concept('wars','války')|E]. Když [Concept('nomads','nomádi')|E] [Concept('migrate','migrují')|E] a opustí [Concept('holding','državu')|E], pastevci díky svým menším stádům postupně obnovují místní [Concept('county_fertility','úrodnost hrabství')|E].\n\nZe skutečných [Concept('nomad','nomádských')|E] [Concept('rulers','vládců')|E] mají strach a při jejich výzvě jim okamžitě přenechají svou půdu."
 game_concept_herder_i: "@government_type_herder!"
 game_concept_herders: "Pastevci"
 game_concept_herders_desc: "$game_concept_herder_desc$"
 game_concept_nomadic_holding: "Kočovné sídliště"
 game_concept_nomadic_holding_desc: "$game_concept_nomadic_holdings$ představují přítomnost [Concept('yurt','kočovného hlavního sídla')|E] na mapě. Jde o [Concept('holding_type','typ državy')|E] využívaný [Concept('rulers','vládci')|E], jejichž typem vlády je [GetGovernment( 'nomad_government' ).GetName|l]. Poskytují malé množství [Concept('county_control','kontroly hrabství')|E] a [Concept('county_opinion','lidového mínění')|E]."
 game_concept_nomadic_holdings: "Kočovná sídliště"
 game_concept_nomadic_holdings_desc: "$game_concept_nomadic_holding_desc$"
 game_concept_herder_holding: "Pastevecké sídliště"
 game_concept_herder_holding_desc: "$game_concept_herder_holding$ je nejmenším z [Concept('holding_types','typů držav')|E]. Představuje přítomnost [Concept('herders','pastevců')|E] v oblasti a poskytuje bonusy k [Concept('county_fertility','úrodnosti hrabství')|E]."
 game_concept_nomadic_authority: "Dominance"
 game_concept_nomadic_authority_desc: "$game_concept_nomadic_authority$ představuje předpokládanou moc [Concept('ruler','vládce')|E], jehož typem vlády je [GetGovernment( 'nomad_government' ).GetName|l]. Roste s velikostí jeho [Concept('herd','stáda')|E] a zpřístupňuje další možnosti [Concept('migration','migrace')|E].\n\nExistuje pět úrovní dominance: [Concept('unruly_nomadic','Nezkrotní nomádi')|E], [Concept('limited_nomadic','Omezená')|E], [Concept('high_nomadic','Vysoká')|E], [Concept('absolute_nomadic','Absolutní')|E] a [Concept('unrestricted_nomadic','Neomezená')|E].\n\n#weak Nejvyšší úrovně může během jedné herní partie dosáhnout pouze jediný vládce.#!"
 game_concept_dominance: "$game_concept_nomadic_authority$"
 game_concept_unruly_nomadic: "Nezkrotní nomádi"
 game_concept_unruly_nomadic_desc: "Nejnižší úroveň [Concept('nomadic_authority','dominance')|E] nese název $game_concept_unruly_nomadic$. Na této úrovni může [Concept('migration','migrace')|E] cílit pouze na [Concept('de_jure','de iure')|E] [Concept('titles','tituly')|E] na úrovni [Concept('county','hrabství')|E] ve [Concept('the_great_steppe','Velké stepi')|E] a [Concept('characters','postavy')|E] nelze [Concept('imprisoned','uvěznit')|E]."
 game_concept_limited_nomadic: "Omezená"
 game_concept_limited_nomadic_desc: "Druhým nejnižším stupněm [Concept('nomadic_authority','dominance')|E] je úroveň $game_concept_limited_nomadic$. [Concept('migration','Migrace')|EU] může cílit na [Concept('de_jure','de iure')|E] [Concept('titles','tituly')|E] na úrovni [Concept('duchy','vévodství')|E] ve [Concept('the_great_steppe','Velké stepi')|E]. Lze odebírat [Concept('titles','tituly')|E] a lenní pán nyní může [Concept('imprison','uvěznit')|E] [Concept('characters','postavy')|E] ve svém [Concept('realm','panství')|E].\n\nUmožňuje využít [Concept('decision','rozhodnutí')|E] #V $step_away_from_the_steppe_decision$#!."
 game_concept_high_nomadic: "Vysoká"
 game_concept_high_nomadic_desc: "Prostředním stupněm [Concept('nomadic_authority','dominance')|E] je úroveň $game_concept_high_nomadic$. Na této úrovni může [Concept('migration','migrace')|E] cílit na [Concept('de_jure','de iure')|E] [Concept('titles','tituly')|E] na úrovni [Concept('kingdom','království')|E] ve [Concept('the_great_steppe','Velké stepi')|E] a lenní pán může [Concept('retract','odebírat')|E] vazaly svých [Concept('vassal','vazalů')|E]."
 game_concept_absolute_nomadic: "Absolutní"
 game_concept_absolute_nomadic_desc: "Druhým nejvyšším stupněm [Concept('nomadic_authority','dominance')|E] je úroveň $game_concept_absolute_nomadic$. Na této úrovni může [Concept('migration','migrace')|E] cílit na [Concept('de_jure','de iure')|E] [Concept('titles','tituly')|E] na úrovni [Concept('empire','říše')|E] ve [Concept('the_great_steppe','Velké stepi')|E].\n\n[Concept('independent','Nezávislí')|EU] [Concept('rulers','vládci')|E] se mohou usadit mimo step prostřednictvím [Concept('decision','rozhodnutí')|E] #high $settle_the_steppe_decision$#!."
 game_concept_unrestricted_nomadic: "Neomezená"
 game_concept_unrestricted_nomadic_desc: "Nejvyšším stupněm [Concept('nomadic_authority','dominance')|E] je úroveň $game_concept_unrestricted_nomadic$. V celé herní partii jí může dosáhnout pouze jediná [Concept('character','postava')|E], která získá jedinečné postavení [GetTrait('greatest_of_khans').GetName( GetNullCharacter )].\n\n[Concept('independent','Nezávislí')|EU] [Concept('rulers','vládci')|E] mohou využít [Concept('decisions','rozhodnutí')|E] #high $mpo_become_greatest_of_khans_decision$#! a #high $mpo_gok_world_conquest_decision$#!."
 game_concept_the_great_steppe: "Velká step"
 game_concept_the_great_steppe_desc: "$game_concept_the_great_steppe$ představuje nekonečné moře trávy Eurasijské stepi a klimatické podmínky, které jej utvářejí. Dělí se na tři oblasti: Západní, Střední a Východní step.\n\nJednotlivá [Concept('steppe_seasons','stepní období')|E] zachycují příznivé i nepříznivé události. Nabízejí příležitosti ke zvláštním akcím dostupným pouze v daném období a ovlivňují [Concept('county_fertility','úrodnost hrabství')|E] v každé oblasti.\n\nTéto [Concept('situation','situace')|E] se účastní pouze [Concept('rulers','vládci')|E], jejichž typem vlády je [GetGovernment( 'nomad_government' ).GetName|l], a [Concept('herder','pastevci')|E]. [Concept('gurkhan','Gürkhan')|EU] představuje nejmocnějšího vládce celého regionu."
 game_concept_suzerain: "Suzerén"
 game_concept_suzerain_desc: "$game_concept_suzerain$ je [Concept('ruler','vládce')|E], který má alespoň jednoho [Concept('tributary','tributáře')|E]. Suzeréni mohou být sami tributáři jiného [Concept('ruler','vládce')|E], nikdy však nesmějí být [Concept('vassals','vazaly')|E]."
 game_concept_suzerains: "Suzeréni"
 game_concept_suzerains_desc: "$game_concept_suzerain_desc$"
 game_concept_suzerain_possessive: "Suzerénův"
 game_concept_tributary: "Tributář"
 game_concept_tributary_desc: "$game_concept_tributary$ je [Concept('ruler','vládce')|E], který uzavřel dohodu s jiným vládcem, svým [Concept('suzerain','suzerénem')|E].\n\n$game_concept_tributary$ pravidelně odvádí tribut v podobě [Concept('herd','stáda')|E], [Concept('taxes','daní')|E], [Concept('prestige','prestiže')|E], nebo dokonce [Concept('piety','zbožnosti')|E], podle svého typu. Výměnou získává [Concept('truce','příměří')|E] se svým suzerénem ($game_concept_suzerain$).\n\nTributáři představují volnější formu poddanství. Nemohou se připojovat k [Concept('factions','frakcím')|E], ale pokud nejsou splněny jejich požadavky, mohou se osvobodit.\n\nPokud suzerén není [Concept('landed','zeměpánem')|E] a zároveň [Concept('migrating','nemigruje')|E], tributáři se po krátké době osamostatní."
 game_concept_tributaries: "Tributáři"
 game_concept_tributary_possessive: "Tributářův"
 game_concept_tributaries_desc: "$game_concept_tributary_desc$"
 game_concept_subject: "Subjekt"
 game_concept_subject_desc: "$game_concept_subject$ je jakýkoli [Concept('ruler','vládce')|E], který přísahal věrnost jinému vládci. Subjekti mohou být různého typu, například [Concept('vassals','vazalové')|E] nebo [Concept('tributaries','tributáři')|E], přičemž každý typ podléhá vlastním pravidlům."
 game_concept_subjects: "Subjekti"
 game_concept_subjects_desc: "$game_concept_subject_desc$"
 game_concept_steppe_season: "Stepní období"
 game_concept_steppe_season_desc: "$game_concept_steppe_season$ představuje aktuální klimatické podmínky [Concept('the_great_steppe','Velké stepi')|E], jejich vliv na [Concept('county_fertility','úrodnost hrabství')|E] i zvláštní akce dostupné [Concept('rulers','vládcům')|E], kteří se účastní této [Concept('situation','situace')|E].\n\n$game_concept_steppe_seasons$ se v jednotlivých oblastech střídají nezávisle a vládci, jejichž typem vlády je [GetGovernment( 'nomad_government' ).GetName|l], tak mohou vyhledávat oblasti, v nichž právě panuje příznivé období.\n\nNěkdy může stejné období současně nastat ve více [Concept('situation_sub_region','oblastech situace')|E]."
 game_concept_steppe_seasons: "Stepní období"
 game_concept_steppe_seasons_desc: "$game_concept_steppe_season_desc$"
 game_concept_situation: "Situace"
 game_concept_situation_situations: "Situace"
 game_concept_situation_desc: "$game_concept_situation_situations$ představují střednědobé až dlouhodobé dění, do něhož jsou zapojeny postavy v určité zeměpisné [Concept('situation_sub_region','oblasti situace')|E] a které prochází různými [Concept('situation_phases','fázemi situace')|E]."
 game_concept_situation_phase: "Fáze situace"
 game_concept_situation_phase_desc: "$game_concept_situation_phase$ má vlastní modifikátory a podmínky, které ovlivňují zúčastněné postavy.\n\nNěkteré [Concept('situation_phases','fáze situace')|E] se spouštějí při splnění určitých podmínek, zatímco jiné nastávají prostým plynutím času."
 game_concept_situation_phases: "Fáze situace"
 game_concept_situation_phases_desc: "$game_concept_situation_phase_desc$"
 game_concept_situation_sub_region: "Oblast situace"
 game_concept_situation_sub_regions: "Oblasti situace"
 game_concept_situation_sub_region_desc: "[Concept('situation_situations','Situace')|EU] mohou zahrnovat více oblastí, z nichž každá prochází vlastními [Concept('situation_phases','fázemi situace')|E]."
 game_concept_situation_sub_regions_desc: "$game_concept_situation_sub_region_desc$"
 game_concept_situation_participant_group: "Skupina účastníků"
 game_concept_situation_participant_groups: "Skupiny účastníků"
 game_concept_situation_participant_group_desc: "Skupiny účastníků v rámci [Concept('situation','situace')|E] tvoří postavy, na které v průběhu každé [Concept('situation_phase','fáze situace')|E] působí stejné účinky."
 game_concept_situation_catalyst: "Katalyzátor situace"
 game_concept_situation_catalyst_catalyst: "Katalyzátor"
 game_concept_situation_catalyst_catalysts: "Katalyzátory"
 game_concept_situation_catalyst_desc: "Jakmile nastane $game_concept_situation_catalyst$, mohou některé [Concept('situation_situations','situace')|E] přejít do jiné [Concept('situation_phase','fáze situace')|E].\n\nPřehled toho, co se v dané fázi ($game_concept_situation_phase$) považuje za $game_concept_situation_catalyst$, najdeš v okně $game_concept_situation$."
 game_concept_migration: "Migrace"
 game_concept_migration_desc: "$game_concept_migration$ je pro [Concept('nomads','nomády')|E] nezbytná. Když [Concept('county_fertility','úrodnost hrabství')|E] v jejich [Concept('realms','panstvích')|E] poklesne, často se vydávají hledat úrodnější pastviny.\n\nMigrace může cílit pouze na [Concept('de_jure','de iure')|E] [Concept('titles','tituly')|E] a dostupné [Concept('title_tiers','úrovně titulů')|E] jsou omezeny [Concept('nomadic_authority','dominancí')|E] příslušného [Concept('ruler','vládce')|E].\n\nNávrh na migraci obdrží nomád s největším [Concept('herd','stádem')|E] v cílové oblasti. Může se rozhodnout, zda své území dobrovolně opustí, nebo je bude bránit ve válce.\n\n[Concept('herders','Pastevci')|EU] své území vždy opustí, protože nemají prostředky k jeho obraně."
 game_concept_migrate: "Migrovat"
 game_concept_migrate_desc: "$game_concept_migration_desc$"
 game_concept_migrates: "Migruje"
 game_concept_migrated: "Migroval"
 game_concept_migrating: "Migrující"
 game_concept_raid_intent: "Záměr nájezdu"
 game_concept_raid_intent_desc: "$game_concept_raid_intent$ může měnit druhy odměn získaných z [Concept('raid','nájezdu')|E], rychlost pohybu armády nebo její kapacitu pro [Concept('loot','kořist')|E]. Kromě běžných nájezdů za účelem získání [Concept('gold','zlata')|E] a [Concept('prestige','prestiže')|E] existují i jiné možnosti, například pokusy o ničení [Concept('buildings','budov')|E] nebo zvýšení pravděpodobnosti [Concept('imprisoning','uvěznění')|E] [Concept('characters','postav')|E]."
 game_concept_raid_intents: "Záměry nájezdu"
 game_concept_raid_intents_desc: "$game_concept_raid_intent_desc$"
 game_concept_gurkhan: "Gürkhan"
 game_concept_gurkhan_desc: "Největší hrozbu pro [Concept('the_great_steppe','Velkou step')|E] představuje $game_concept_gurkhan$. Jde o [Concept('ruler','vládce')|E], jehož typem vlády je [GetGovernment( 'nomad_government' ).GetName|l] a který má největší [Concept('herd','stádo')|E] v celé oblasti. Může být mocným spojencem i obávaným nepřítelem.\n\nPouze $game_concept_gurkhan$ může dosáhnout nejvyšší úrovně [Concept('nomadic_authority','dominance')|E] a získat titul [GetTrait('greatest_of_khans').GetName( GetNullCharacter )]. Tím se však zároveň stává vyhledávaným cílem svých nepřátel."
 game_concept_yurt: "Kočovné hlavní sídlo"
 game_concept_yurt_desc: "$game_concept_yurts$ představují putující společenství stanů, dobytka, lidí a koní. Mohou čítat pouhých několik ovcí, ale také se rozrůst v mohutnou, burácející hordu.\n\nVládci, jejichž typem vlády je [GetGovernment( 'nomad_government' ).GetName|l], rozvíjejí své $game_concept_yurt$ prostřednictvím [Concept('yurt_buildings','budov jurty')|E] a berou je s sebou, když [Concept('migrate','migrují')|E]. V [Concept('holdings','državách')|E] nemohou stavět běžné [Concept('buildings','budovy')|E].\n\nKaždé $game_concept_yurt$ má vlastní [Concept('faith','víru')|E] a [Concept('culture','kulturu')|E], které odrážejí většinu migrujícího lidu. Ty se mohou lišit od víry a kultury samotného [Concept('ruler','vládce')|E].\n\nSpolu s vládcem putuje také celý jeho [Concept('court','dvůr')|E], včetně [Concept('family','rodiny')|E], [Concept('kurultai','kurultaje')|E] a [Concept('knights','rytířů')|E]."
 game_concept_yurts: "Kočovná hlavní sídla"
 game_concept_yurts_desc: "$game_concept_yurt_desc$"
 game_concept_yurt_buildings: "Budovy jurty"
 game_concept_yurt_buildings_desc: "$game_concept_yurt_buildings$ představují jedinečná vylepšení pro $game_concept_yurt$.\n\nZ hlediska herních mechanik jde o [Concept('domicile_buildings','budovy domicilu')|E]. Mnohá však nepředstavují skutečné stavby, nýbrž společenské zvyklosti nebo oblasti, na které se zaměřuje kmen, jejž vede $game_concept_nomad$.\n\nMezi bonusy, které mohou poskytovat, patří:\n$EFFECT_LIST_BULLET$ Zpřístupnění [Concept('court_positions','dvorských úřadů')|E], kočovných [Concept('decisions','rozhodnutí')|E] a [Concept('character_interaction','interakcí s postavami')|E]\n$EFFECT_LIST_BULLET$ Různé bonusy pro [Concept('herd','stádo')|E] a [Concept('county_fertility','úrodnost hrabství')|E], včetně specializací podle [Concept('terrain','terénu')|E]\n$EFFECT_LIST_BULLET$ Zpřístupnění a vylepšení kočovných [Concept('men_at_arms','ozbrojenců')|E] a posílení [Concept('horde','nomádské hordy')|E]\n$EFFECT_LIST_BULLET$ Jedinečné bonusy ke kočovným [Concept('culture_tradition','kulturním tradicím')|E]\n$EFFECT_LIST_BULLET$ Možnosti správy vlastních [Concept('vassals','vazalů')|E] a [Concept('tributaries','tributářů')|E] i ovlivňování [Concept('characters','postav')|E] na svém dvoře\n$EFFECT_LIST_BULLET$ Bonusy pro [Concept('kurultai','kurultaj')|E] a [Concept('obedience','poslušnost')|E]."
 game_concept_yurt_building: "Budova jurty"
 game_concept_yurt_building_desc: "$game_concept_yurt_buildings_desc$"
 game_concept_obedience: "Poslušnost"
 game_concept_obedience_desc: "V [Concept('realms','panstvích')|E], jejichž typem vlády je [GetGovernment( 'nomad_government' ).GetName|l], určuje poslušnost míru věrnosti [Concept('character','postavy')|E] vůči jejímu [Concept('liege','lennímu pánovi')|E], [Concept('suzerain','suzerénovi')|E] nebo vlastníkovi jejího [Concept('court','dvora')|E]. Každá postava může být poslušná vždy pouze jedinému [Concept('ruler','vládci')|E].\n\nPoslušné postavy mají menší sklon účastnit se [Concept('hostile_schemes','nepřátelských intrik')|E], zapojovat se do [Concept('wars','válek')|E] nebo se přidávat k [Concept('factions','frakcím')|E] namířeným proti jejich lennímu pánovi. Během [Concept('succession','nástupnictví')|E] vždy podporují jeho záměry a neuplatňují vůči němu své [Concept('claims','nároky')|E]. Neposlušní [Concept('tributaries','tributáři')|E] se mohou pokusit osamostatnit.\n\nJakmile hodnota poslušnosti postavy překročí [Concept('obedience_threshold','práh poslušnosti')|E], stane se poslušnou."
 game_concept_obedient: "Poslušný"
 game_concept_obedience_i: "@obedience_icon!"
 game_concept_obedient_desc: "$game_concept_obedience_desc$"
 obedience_value: "[Concept('obedience','Poslušnost')|EU]:"
 obedience_threshold_value: "[Concept('obedience_threshold','Práh poslušnosti')|EU]:"
 game_concept_disobedient: "Neposlušný"
 game_concept_disobedience_i: "@disobedience_icon!"
 game_concept_disobedient_desc: "$game_concept_obedience_desc$"
 game_concept_obedience_threshold: "Práh poslušnosti"
 game_concept_obedience_threshold_desc: "$game_concept_obedience_threshold$ je hodnota, které musí [Concept('characters','postavy')|E] dosáhnout, aby byly považovány za [Concept('obedient','poslušné')|E].\n\nTento práh ovlivňuje řada faktorů: zda postavy patří do [Concept('close_family','blízké rodiny')|E] svého [Concept('overlord','vrchního pána')|E], zda jde o [Concept('primary_heir','hlavního dědice')|E], jejich [Concept('friendship','přátelství')|E] či [Concept('rivalry','sokovství')|E], jejich [Concept('traits','rysy')|E] a také to, zda je zaměstnáváš ve svém [Concept('kurultai','kurultaji')|E] nebo u [Concept('court','dvora')|E]. [Concept('children','Děti')|EU] bývají poslušnější než dospělí.\n\nVládci, jejichž typem vlády je [GetGovernment( 'nomad_government' ).GetName|l], mohou prostřednictvím [Concept('decision','rozhodnutí')|E] #EMP $mpo_desperate_stance_decision$#! přimět všechny k poslušnosti. Během [CZActivity('activity_hunt','G')|l] mohou využít [Concept('intent','záměr')|E] #EMP $impose_obedience_intent$#! a zaměřit se na jedinou postavu. Pokud mají dostatečně vysokou [Concept('dread','hrůzu')|E], mohou také použít [Concept('character_interaction','interakci s postavou')|E] #EMP $mpo_demand_obedience_interaction$#!."
 game_concept_overlord: "Vrchní pán"
 game_concept_overlord_desc: "$game_concept_overlord$ je [Concept('ruler','vládce')|E], kterému jiný vládce slíbil poslušnost, ať už jako [Concept('vassal','vazal')|E], nebo jako [Concept('tributary','tributář')|E]. Mezi vrchní pány patří jak [Concept('suzerains','suzeréni')|E], tak [Concept('lieges','lenní páni')|E]."
 game_concept_overlord_possessive: "Vrchního pána"
 game_concept_settlement_issue: "Záležitost osídlení"
 game_concept_settlement_issue_desc: "Záležitosti osídlení jsou úkoly, které [Concept('nomad','nomádský')|E] [Concept('ruler','vládce')|E] dostává po dokončení [Concept('migration','migrace')|E] do nových zemí. Umožňují mu řešit místní konflikty a zvyšovat [Concept('county_control','kontrolu hrabství')|E] v nově získané [Concept('domain','doméně')|E].\n\nTyto záležitosti se budou objevovat během prvních let po migraci, dokud bude kontrola v příslušném hrabství nízká."
 game_concept_settlement_issue_tier: "Úroveň záležitosti osídlení"
 game_concept_settlement_issue_tier_desc: "Každá [Concept('settlement_issue','záležitost osídlení')|E] má svou úroveň, která určuje celkové odměny za její úspěšné vyřešení. Záležitosti vyšší úrovně obvykle poskytují kromě zvýšení [Concept('county_control','kontroly hrabství')|E] také další hodnotnější odměny."
 game_concept_unmanaged_holdings: "Nespravované državy"
 game_concept_unmanaged_holding: "Nespravovaná država"
 game_concept_unmanaged_holdings_desc: "Jde o neaktivní [Concept('holdings','državy')|E], které se nezapočítávají do tvého [Concept('domain_limit','limitu domény')|E]."
 game_concept_nerge: "Nerge"
 game_concept_nerge_outcome: "Výsledek nerge"
 game_concept_nerge_desc: "Nerge je zvláštní druh [CZActivity('activity_hunt','G')|l], který mohou pořádat [Concept('rulers','vládci')|E], jejichž typem vlády je [GetGovernment( 'nomad_government' ).GetName|l]. Namísto lovu jediného zvířete jde o rozsáhlý hon, při němž jsou pobity stovky, ne-li tisíce zvířat.\n\nNa rozdíl od běžné [Concept('hunt_success_chance','šance na úspěch lovu')|E] se zde sleduje hodnota výsledku nerge, která závisí na počtu zabitých zvířat. Ta určuje, jaké odměny získají [Concept('activity_host_short','pořadatel')|E] a [Concept('activity_guests_short','hosté')|E].\n\nÚspěšné nerge obvykle přináší:\n$BULLET_WITH_TAB$[legitimacy_i][Concept('legitimacy','legitimitu')|E]\n$BULLET_WITH_TAB$[prestige_i][Concept('prestige','prestiž')|E]\n$BULLET_WITH_TAB$[dread_i][Concept('dread','hrůzu')|E]\n$BULLET_WITH_TAB$[gold_i][Concept('gold','zlato')|E]\nV některých případech může také přinést:\n$BULLET_WITH_TAB$[martial_i][Concept('martial','válečnictví')|E]\n$BULLET_WITH_TAB$[command_modifier_i][Concept('commander_trait','velitelský rys')|E] nebo [Concept('trait_level_track_xp','zkušenosti rysu')|E]"
 game_concept_dominate_title: "Ovládnout titul"
 game_concept_domination_war: "Válka o dominanci"
 game_concept_dominate_title_desc: "[Concept('nomads','Nomádi')|EU], kteří chtějí získat [Concept('title','titul')|E] vyšší [Concept('title_tier','úrovně')|E] bez nutnosti [Concept('migrating','migrace')|E], mohou místo toho bojovat o titul s místními obyvateli, pokud mají dostatečnou úroveň [Concept('dominance','dominance')|E].\n\nPokud už titul někdo drží, zahájí proti jeho držiteli válku s cílem titul uzurpovat. Pokud titul nemá žádného držitele, budou místo toho bojovat proti všem vládcům v jeho [Concept('de_jure','de iure')|E] oblasti, kteří nejsou jejich [Concept('tributary','tributáři')|E] ani [Concept('ally','spojenci')|E].\n\nV případě vítězství získá útočník příslušný titul a všichni obránci se stanou jeho tributáři. Pokud prohraje, musí obránci zaplatit [gold_i][Concept('gold','zlato')|E] a přijde o značné množství [dread_i][Concept('dread','hrůzy')|E].\n\nPokud vládce, který [Concept('decision','rozhodnutí')|E] vykonává, již ovládá celou de iure oblast, získá titul okamžitě, protože proti němu nestojí žádní obránci."
 game_concept_expand_dominance: "Rozšířit dominanci"
 game_concept_dominance_expansion: "Rozšíření dominance"
 game_concept_expand_dominance_desc: "Zvláštní druh války pro [Concept('rulers','vládce')|E], jejichž typem vlády je [GetGovernment( 'nomad_government' ).GetName|l]. Umožňuje jim podmanit si území v rámci vlastních [Concept('de_jure','de iure')|E] držav nebo rozšířit své de iure území za dosavadní hranice.\n\nVšichni kočovní vládci s [Concept('title_tier','úrovní titulu')|E] [Concept('duchy','vévodství')|E] nebo vyšší mohou zahájit tuto válku v rámci vlastního de iure území. Po vítězství se pokusí obránce [Concept('vassalize','vazalizovat')|E] nebo jej přimět, aby se stal [Concept('tributary','tributářem')|E]. Pokud však obránce drží také území mimo oblast, o kterou se válka vede, mohou jeho země přímo dobýt.\n\nAby mohl kočovný vládce rozšířit svou nadvládu do cizích zemí, musí mít [Concept('title_tier','úroveň titulu')|E] alespoň [Concept('kingdom','království')|E]. Po vítězství se opět pokusí obránce vazalizovat, učinit z něj tributáře nebo dobýt jeho území. Dobyté země však navíc okamžitě přejdou de iure pod primární titul kočovného vládce."
 game_concept_paiza: "Pajdza"
 game_concept_paiza_desc: "Pajdza, známá také jako gerege, je malá kovová destička, kterou mocné [Concept('characters','postavy')|E] ve [Concept('the_great_steppe','Velké stepi')|E] propůjčují svým pověřencům. Jejímu nositeli uděluje pravomoci samotného chána.\n\nZ hlediska herních mechanik jde o [Concept('artifacts','artefakty')|E], které mocný vládce, jehož typem vlády je [GetGovernment( 'nomad_government' ).GetName|l], uděluje svým oblíbencům prostřednictvím [Concept('character_interaction','interakce s postavou')|E] #V $mpo_interaction_grant_paiza$#!.\nPo přijetí [Concept('decision','rozhodnutí')|E] #V $mpo_establish_paiza_system_decision$#! získáš přístup k [Concept('decision','rozhodnutí')|E] #V $mpo_call_for_merchants_decision$#!, které ti umožní obchodovat s usedlým obyvatelstvem. Tento obchod lze dále zlepšovat prostřednictvím různých [Concept('internal_upgrades','vnitřních vylepšení')|E] [Concept('yurt_buildings','budov jurty')|E] typu [GetDomicileBuilding('trade_yurt_01').GetName].\n\nPostavy, které vlastní [Concept('artifacts','artefakty')|E] typu pajdza nesoucí jméno žijícího [Concept('gurkhan','gürkhana')|E], však mohou využívat [Concept('decision','rozhodnutí')|E] #V $mpo_abuse_authority_paiza_decision$#! a [Concept('character_interaction','interakci s postavou')|E] #V $mpo_interaction_leverage_khan_authority$#!.\n\n#weak Mocí Věčného nebe. Pod ochranou císařského štěstí. Chánův výnos: Každý, kdo jej nebude ctít, bude potrestán smrtí.#!"
