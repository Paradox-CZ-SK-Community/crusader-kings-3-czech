l_polish:
 court_astrologer_events.0002.t: "Pohleď k sousedům"
 court_astrologer_events.0002.desc.intro: "[astrologer.GetShortUIName|U] ke mně přichází ve chvíli, kdy slunce mizí za horami. [astrologer.Custom('quirk_pos_present')|U], zatímco se přibližuje a rozhlíží se po okolní krajině.\n\n"
 court_astrologer_events.0002.desc.bad: "„[astrologer.GetFaith.HighGodName|U] se nad námi nesmiluje, [ROOT.GetCharacter.Custom('GetMongolHonorific')|l] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]. Tráva strádá, vyschlá jako stará mrtvola.“"
 court_astrologer_events.0002.desc.meh: "„Ani když nám [astrologer.GetFaith.HighGodName] žehná, naše stádo stále strádá,“ pronese a ukáže na několik koní, kteří neklidně přecházejí sem a tam."
 court_astrologer_events.0002.desc.outro: "\n\n„Sousední panství [target_realm.GetName] nabízí mnohem úrodnější pastviny. Musíš přesvědčit [target_realm_owner.Custom('CZ_TitledFirstName_A')], aby našemu lidu [Select_CString(target_realm_owner.IsFemale,'uvolnila','uvolnil')] cestu.“"
 court_astrologer_events.0002.a: "„Věřím tvému slovu.“"
 court_astrologer_events.0002.a.tt: "Pokud během následujících #V 5#! let #EMP mírovou cestou#! [Concept('migrate','migruješ')|E] do panství [target_realm.GetName], po příchodu získáš [GetModifier('astrologer_desired_area_modifier').GetNameWithTooltip|l]."
 court_astrologer_events.0002.b: "„Tvá slova jsou plná zbožnosti.“"
 court_astrologer_events.0002.c: "„Utíkají jen slabí.“"
