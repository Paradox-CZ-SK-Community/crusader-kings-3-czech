 mpo_decisions_events.0001.t: "Svolávání kmenů"
 mpo_decisions_events.0001.desc: "Projeví-li [ROOT.Char.GetFaith.HighGodName] svou vůli, i [ROOT.Char.GetPrimaryTitle.GetTierAsName|l] se může pod mou vládou zlomit jako dřík jediného šípu! Vždyť můj skromný kmen sdílí zemi [home_kingdom.Custom('CZ_LandedNameNoTier_G')] s obávanými válečnými družinami [threat.Custom('CZ_TitledFirstName_G')], v jejichž řadách bojují [threat.GetCulture.GetCollectiveNoun].\n\nAle co kdybychom své šípy svázali se šípy přátel a příbuzných? Dokázala by nás pak nepřátelská ruka tak snadno zlomit?\n\n#EMP Bratři a sestry! Nevolme si pána, nýbrž hlas, který bude mluvit za všechny kmeny! Hlas, který se vysměje [threat.Custom('CZ_TitledFirstNameNoTooltip_D')] i celému světu!#!"
 mpo_decisions_events.0001.a: "Musím najít ty, kdo se k nám přidají."
 mpo_decisions_events.0001.b: "#EMP Pche! To je zbabělost!#!"
 every_confederation_member: "Každý další [Concept('confederate','konfederát')|E]"
