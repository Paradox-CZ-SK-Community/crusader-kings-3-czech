 mpo_decisions_events.0120.desc.intro: "Nastal čas proměnit můj tábor v něco většího. V putující sídliště, které se bude přesouvat stepí podle střídajících se ročních období.\n\n„Doufám, že vám tyto země budou dobře sloužit,“ vítá nás ve svém stanu [herder.GetTitledFirstName], [Select_CString(herder.IsFemale,'pastýřka, která zdejší lid vedla před námi','pastýř, který zdejší lid vedl před námi')]."
 mpo_decisions_events.0120.desc.subject: "\n\n„Mým vrchním pánem je [nomad.GetTitledFirstName],“ pokračuje [Select_CString(herder.IsFemale,'pastýřka','pastýř')] varovným tónem. „A požaduje od nás tribut.“"
 mpo_decisions_events.0120.a: "„Ostatně tato země patřila [nomad.Custom('CZ_TitledFirstName_D')].“"
 mpo_decisions_events.0120.b: "„[Select_CString(ROOT.Char.IsFemale,'Nepřišla','Nepřišel')] jsem sem, abych se někomu [Select_CString(ROOT.Char.IsFemale,'podřizovala','podřizoval')].“"
 mpo_decisions_events.0120.c: "„Není důvod, abys odcházel.“"
 mpo_decisions_events.0120.d: "„Odteď už se o vše postaráme my.“"
 invite_a_siege_engineer_decision: "Vyhledat obléhacího inženýra"
