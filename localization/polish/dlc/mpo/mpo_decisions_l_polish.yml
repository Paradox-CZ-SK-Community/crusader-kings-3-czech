 introduce_heir_decision_desc: "Aby [Select_CString(ROOT.Char.GetPlayerHeir.IsFemale,'má nástupkyně','můj nástupce')] [Select_CString(ROOT.Char.GetPlayerHeir.IsFemale,'dokázala','dokázal')] vzít svůj osud do vlastních rukou, bude potřebovat čestné přátele. Musím se postarat, aby mocní poznali [Select_CString(ROOT.Char.GetPlayerHeir.IsFemale,'její','jeho')] tvář a aby [Select_CString(ROOT.Char.GetPlayerHeir.IsFemale,'její','jeho')] hlas zazněl v jejich příbytcích zahalených hedvábím.\n\nZkáza čeká na [Select_CString(ROOT.Char.GetPlayerHeir.IsFemale,'ženu','muže')], [Select_CString(ROOT.Char.GetPlayerHeir.IsFemale,'která','který')] stojí pod širým nebem [Select_CString(ROOT.Char.GetPlayerHeir.IsFemale,'sama','sám')]."
