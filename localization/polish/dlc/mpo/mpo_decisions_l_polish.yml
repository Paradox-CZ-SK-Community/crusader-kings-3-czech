 become_nomadic_decision: "Stát se nomády"
 become_nomadic_decision_desc: "Země pod našima nohama nás poutala ke stejnému místu po celé generace. Jenže step nepřeje těm, kdo zůstávají stát. Sledovali jsme jezdce širých plání, jak putují, kam se jim zachce, nespoutaní hradbami a nesoucí své bohatství s sebou, volní jako sám vítr.\n\nNyní ze sebe setřásáme tíhu usedlého života."
 become_nomadic_decision_tooltip: "Přijmi [Concept('government','vládu')|E] typu [GetGovernment( 'nomad_government' ).GetNameWithIcon]"
 become_nomadic_decision_confirm: "Naším jediným domovem bude jurta."
 settle_the_steppe_decision: "Usadit se na stepi"
 settle_the_steppe_decision_desc: "Step živila naše stáda, nesla naše jezdce a rozprášila naše nepřátele do všech větrů. Nyní však budeme pokládat kameny tam, kde kdysi hřměla kopyta. Už nebudeme pronásledovat obzor. Přimějeme obzor, aby přišel k nám.\n\nZůstáváme dětmi stepi. Zapustíme však kořeny do její půdy, vztyčíme hradby proti jejím větrům a z táborových ohňů vytvoříme domácí krby."
 settle_the_steppe_decision_tooltip: "Usaď svůj lid, který tvoří [ROOT.Char.GetDomicile.GetCulture.GetCollectiveNoun] vyznávající [CZFaithAdjDecline(ROOT.Char.GetDomicile.GetRite,'ou')|l] víru. Zvol si vládu typu [GetGovernment('tribal_government').GetName|l], [GetGovernment('feudal_government').GetName|l] nebo [GetGovernment('clan_government').GetName|l] a opusť dosavadní vládu typu [GetGovernment( 'nomad_government' ).GetName|l]"
 settle_the_steppe_decision_confirm: "Volá nás nová éra."
