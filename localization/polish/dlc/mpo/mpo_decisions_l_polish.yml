 leave_confederation_decision: "Opustit konfederaci"
 leave_confederation_decision_desc: "Už dost dlouho jsem [Select_CString(ROOT.Char.IsFemale,'bránila','bránil')] své spolubojovníky z konfederace. Nyní budu stát [Select_CString(ROOT.Char.IsFemale,'sama','sám')] za sebe. A pokud konfederace beze mě nedokáže přežít, pak si zaslouží upadnout v zapomnění!"
