 confederation_modifier_tt: "[Concept('confederates','Konfederáti')|EU] získají [GetModifier('mpo_confederation_member_modifier').GetNameWithTooltip|l] a určité množství [Concept('county_fertility','úrodnosti hrabství')|E]."
