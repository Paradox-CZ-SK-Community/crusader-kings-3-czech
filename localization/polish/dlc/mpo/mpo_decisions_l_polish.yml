 mpo_become_greatest_of_khans_decision_desc: "Svolej klany! Prohlaš, že celý svět patří tobě, ó cháne chánů! A přestože proti tobě povstanou chánové i kmenoví náčelníci, aby tvé nároky popřeli, staneš se [ROOT.Char.GetLadyLord|l] všeho, co se nachází pod nebesy."
 mpo_become_greatest_of_khans_decision_tooltip: "Prohlaš se za [GetTrait('greatest_of_khans').GetName( GetNullCharacter )] a zahaj dobývání světa. Nejprve však musíš zvítězit ve válce $mpo_great_war_of_defiance_cb$"
 mpo_become_greatest_of_khans_decision_genghis_warning: "\n\n#EMP Buď varován!#! Znamení praví, že jednoho dne tento nárok vznese mocný Syn nebes, předpovězený Mongol. A jakmile dokončí svá dobyvačná tažení, žádný vládce stepi se už nikdy nevyrovná jeho slávě!"
