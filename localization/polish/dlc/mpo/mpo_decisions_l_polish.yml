 step_away_from_the_steppe_decision_desc: "Život v koňském sedle dokáže být pořádně vyčerpávající. Viděli jste někdy, jak se žije ve městech? Měkká postel za pevnými zdmi... Žádné odřeniny od sedla, žádné neustálé přesuny... Občas je tak lákavé sesednout z koně a natáhnout se na pořádnou matraci."
