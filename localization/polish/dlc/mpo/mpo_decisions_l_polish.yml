 invite_a_foreign_emissary_decision_desc: "Potřebuji někoho, kdo bude můj dvůr bavit podivuhodnými příběhy a vyprávěním z dalekých krajů."
 mpo_decisions_events.0090.t: "Příběh, nebo rovnou tři"
 mpo_decisions_events.0090.desc: "Zabořím se hlouběji do křesla a začíná mě přemáhat ospalost. [courtier.GetFirstName|U] totiž právě vypráví tentýž příběh už popatnácté. Potřebuji někoho, #EMP kohokoli#!, kdo mi konečně poví něco nového.\n\nVyšlu vzkazy po projíždějících kupcích a zanedlouho do [CZProvNameNoTooltip(ROOT.Char.GetCapitalLocation,'G')] dorazí dva cestovatelé. Oba vyprávějí o cizokrajných zemích, horách tyčících se k nebesům a nekonečných pustinách."
 mpo_decisions_events.0090.a: "[great_foreign_emissary_option.GetFirstNameNoTooltip|U] má v zásobě spoustu příběhů."
 mpo_decisions_events.0090.b: "[good_foreign_emissary_option.GetFirstNameNoTooltip|U] působí sympaticky."
 mpo_decisions_events.0090.c: "Ani jeden z nich není dost dobrý."
