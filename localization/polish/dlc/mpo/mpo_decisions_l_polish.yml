 confederation_kingdom_decision: "Povýšit konfederaci na království"
 confederation_kingdom_decision_desc: "To, co kdysi vzniklo z nutnosti — spojenectví válečníků, kteří přísahali stát bok po boku proti blížící se bouři — se nyní musí proměnit v něco většího. Velitelé válečných družin nechť se stanou pány, kmenoví náčelníci vazaly a konfederace nechť se sjednotí pod jediným praporem."
 confederation_kingdom_decision_tooltip: "Rozpusť [Concept('confederation','konfederaci')|E] a spolu s [Concept('confederates','konfederáty')|E] vytvoř nové [Concept('kingdom','království')|E]"
 confederation_kingdom_decision_confirm: "A jeho [ROOT.Char.Custom('get_queen_king')|l] budu já!"
 mpo_decisions_events.0004.t: "Zrodilo se [new_king_ruler.GetPrimaryTitle.GetTierAsNameNoTooltip|l]"
 mpo_decisions_events.0004.desc: "Kdysi jsme vládli podle vlastní vůle a naše válečné družiny se nezodpovídaly nikomu jinému. Nyní však poklekáme — nikoli jako [Select_CString(ROOT.Char.IsFemale,'poražené','poražení')] [ROOT.Char.GetWomenMen|l], nýbrž jako vazalové.\n\nNěkdejší společenství sobě rovných se proměnilo v [new_king_ruler.GetPrimaryTitle.GetTierAsName|l] a naše meče nyní přísahají věrnost [new_king_ruler.Custom('CZ_TitledFirstNameNicknamed_D')] — prvnímu mezi rovnými...\n\nToto [new_king_ruler.GetPrimaryTitle.GetTierAsName|l] může přetrvat celé věky. Anebo padne, jako nakonec padá všechno."
 mpo_decisions_events.0004.a: "$mpo_decisions_events.0005.a$"
 mpo_decisions_events.0004.b: "Tohoto se účastnit nebudu."
 mpo_decisions_events.0005.t: "$mpo_decisions_events.0004.t$"
 mpo_decisions_events.0005.desc: "Kdysi jsme byli pouhými válečnými družinami, které spojovala nutnost a jejichž jednota byla pomíjivá jako střídání ročních období. Nyní však tvoříme jediný celek. Konfederace se proměnila v mocného tvora a já jsem jeho hlavou.\n\nNáčelníci, kteří kdysi jezdili po mém boku, nyní poklekají na můj rozkaz. Stojí po stranách mého trůnu a zpívají u mého slavnostního stolu! Dohodli jsme se na spravedlivém nástupnictví, a ostatní klany proto se ctí vyčkávají, až na ně přijde řada ve vládě.\n\nZrodilo se [new_king_ruler.GetPrimaryTitle.GetTierAsName|l]. A dokud budu naživu, budu mu vládnout."
 mpo_decisions_events.0005.a: "Kéž společně vzkvétáme!"
