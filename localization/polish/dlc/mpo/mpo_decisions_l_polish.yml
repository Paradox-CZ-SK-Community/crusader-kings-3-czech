 invite_a_siege_engineer_decision_desc: "Nastal čas najít někoho, kdo dokáže rozdrtit hradby mých nepřátel."
 mpo_decisions_events.0080.t: "Odborníci z dalekých krajů"
 mpo_decisions_events.0080.desc: "[Select_CString(ROOT.Char.IsFemale,'Rozeslala','Rozeslal')] jsem poselství do všech koutů světa v naději, že najdu někoho, kdo mi nabídne své technické znalosti. Zpočátku se zdálo, že jde o nesplnitelný úkol, ale nakonec do mého tábora dorazili dva kandidáti.\n\nPodle všeho má [great_siege_engineer_option.GetFirstName] lepší schopnosti, ale požaduje mnohem vyšší odměnu než [good_siege_engineer_option.GetFirstName]. Ať už si vyberu kohokoli, konečně získám někoho, kdo dokáže pomoci mým armádám tam, kde jejich vlastní schopnosti nestačí."
