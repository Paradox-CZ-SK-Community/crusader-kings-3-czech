 terrain_disadvantage_foliage: "— hustý porost jim znemožňoval cokoli zahlédnout."
 terrain_disadvantage_heavy_rain: "— prudký déšť proměnil půdu v bahno a zpomalil vojáky."
 terrain_disadvantage_sand: "— písečné duny činily pochod téměř nemožným."
 terrain_disadvantage_heat: "— nesnesitelné horko vojáky zcela vyčerpalo."
 terrain_disadvantage_freeze: "— krutý mráz připravil o život mnoho vojáků."
 terrain_disadvantage_hike: "— vojáky čekal dlouhý a vyčerpávající pochod."
