 mpo_decisions_events.0002.t: "Zavržení konfederace"
 mpo_decisions_events.0002.desc: "Zpráva se šíří rychlostí větru a zanedlouho se z konfederace [confederation.GetName] ozývají vyděšené hlasy. [ROOT.Char.GetName|U] s nimi už nechce mít nic společného!\n\n"
 mpo_decisions_events.0002.desc_confederation_survives: "Na čí sílu se teď ti ubožáci mohou spolehnout? Na čí milosrdenství? #EMP Čí mír je ochrání?#! Konfederaci nečeká nic jiného než chaos.\n\nBlahobyt teď bude patřit výhradně [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_D')]."
 mpo_decisions_events.0002.desc_confederation_done: "Když už přísahy dodržuje pouze [other_confederate.GetTitledFirstName], konfederace zaniká. Mír? Blahobyt? Ty nyní patří jen silným."
 mpo_decisions_events.0002.a: "Můj lid nepotřebuje nikoho jiného než mě."
 mpo_decisions_events.0003.t: "Ztráta pro konfederaci"
 mpo_decisions_events.0003.desc: "Na můj lid padá zlá předtucha, neboť [leaver.GetTitledFirstName] [Select_CString(leaver.IsFemale,'porušila','porušil')] svůj slib, že bude stát po našem boku. [Select_CString(leaver.IsFemale,'Opustila','Opustil')] naši konfederaci. Už nikdy nevyjedeme s vojsky [leaver.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] proti mocným tohoto světa.\n\n"
 mpo_decisions_events.0003.desc_confederation_survives: "Konfederace [confederation.GetName] tím byla oslabena. Přesto stále držíme pohromadě."
 mpo_decisions_events.0003.desc_confederation_done: "Jelikož jsem #EMP [Select_CString(ROOT.Char.IsFemale,'sama','sám')]#! [Select_CString(ROOT.Char.IsFemale,'zůstala','zůstal')] [Select_CString(ROOT.Char.IsFemale,'věrná','věrný')] svým přísahám, ztratila má konfederace veškerý smysl. Přestala existovat."
