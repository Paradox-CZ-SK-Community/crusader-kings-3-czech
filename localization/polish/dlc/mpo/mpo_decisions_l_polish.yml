 mpo_decisions_events.0070.desc: "Moji soukmenovci pátrali po [Select_CString(great_court_astrologer_option.IsFemale,'dcerách','synech')] šamanů, vyhledávali poustevníky v jejich úkrytech, cizince s posvátnými slovy na rtech i vyhnance bloudící pustinou. To vše proto, aby našli někoho, kdo se ujme úřadu $court_astrologer_court_position$.\n\nNyní přede mnou stojí shromáždění svatých mužů a žen. Každý vypráví o mém osudu a znameních, která se projevují v přírodě."
