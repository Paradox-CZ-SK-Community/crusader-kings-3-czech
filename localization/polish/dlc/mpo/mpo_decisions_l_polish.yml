l_polish:
 call_for_confederation_decision: "Výzva k vytvoření konfederace"
 call_for_confederation_decision_desc: "Proti velmocím, které pohrdají slabými, ani [ROOT.Char.GetCulture.Custom('CZ_Adjective_yy')|l] válečník neobstojí sám. Kdo bojuje osamocen, také osamocen zemře.\n\nMusím vyhledat ty, kterým záleží na mém lidu a kteří by byli ochotni složit posvátnou přísahu, že budeme společně bojovat až do smrti."
