 terrain_desert_mountains: "Pouštní hory"
 mpo_decisions_events.0300.t: "Obřad země"
 mpo_decisions_events.0300.desc: "[shaman.GetTitledFirstName|U] vzhlíží k nebi a zpívá verše plné vroucí oddanosti. [shaman.GetFaith.FertilityGodName] stojí v samém středu těchto modliteb.\n\n„Připomeňme si nyní, jak se naši předkové starali o tuto zemi,“ pronese a vyzve ostatní, aby se podělili o svou moudrost.\n\n„Co naši dědové věděli o novorozených jehňatech? Co nám naše pratety říkávaly o půdě?“"
 mpo_decisions_events.0300.tt: "Shromáždění v [fertility_county.Custom('CZ_LandedName_L')] bylo zahájeno."
 mpo_decisions_events.0300.a: "Kéž nám [shaman.GetFaith.FertilityGodName] pomůže rozpomenout se."
 mpo_decisions_events.0300.b: "Připojím se k rozjímání, které vede [shaman.GetNameNoTooltip]."
 mpo_decisions_events.0300.b_tt: "Výsledky shromáždění budou #V účinnější#!"
 mpo_fertility_dance_county_modifier: "Shromáždění za úrodnost"
 mpo_fertility_dance_county_modifier_desc: "V tomto hrabství se konalo velké shromáždění, při němž se všichni dělili o své pastevecké znalosti a zkušenosti."
 friend_heir_may_become_blood_brother: "Může s [heir.Custom('CZ_ShortUIName_I')] uzavřít [Concept('blood_brother','pokrevní bratrství')|E]"
 friend_heir_may_become_obedient: "Může se stát [Concept('obedient','poslušným')|E]"
 mpo_pax_mongolica_decision: "$mpo_nomad_legacy_5_name$"
 mpo_pax_mongolica_decision_desc: "Nádhera naší dynastie září nad celou Velkou stepí. Tam, kde kdysi zůstal jen popel, budou nyní vzkvétat města.\n\nVzniknou nové obchodní stanice a opěrné body, které budou svědčit o milosrdenství chána chánů."
 mpo_pax_mongolica_decision_confirm: "Není času nazbyt"
 mpo_pax_mongolica_decision_tooltip: "Podpoř výstavbu měst ve Velké stepi"
 pax_mongolica_ruler_modifier: "$mpo_nomad_legacy_5_name$"
 pax_mongolica_ruler_modifier_desc: "Tato postava zajistila dobré spojení mezi městy Velké stepi."
 pax_mongolica_every_county_in_steppe_tt: "Každé [Concept('county','hrabství')|E] ve [Concept('the_great_steppe','Velké stepi')|E], které je součástí [Concept('realm','panství')|E] člena tvé [Concept('dynasty','dynastie')|E]:"
 mpo_decisions_events.0400.t: "Mír v zemi"
 mpo_decisions_events.0400.desc: "„...Koření z dalekého východu!“ „Pravý pepř, sesbíraný přímo v dračím doupěti!“ „Nejjemnější hedvábí, nejzářivější barvy!“\n\nKupci pokřikují a mávají na každého, kdo je ochoten naslouchat. S neúnavným nadšením předvádějí své zboží a překřikují jeden druhého.\n\n„Takto to nyní vypadá všude, [Select_CString(ROOT.Char.IsFemale,'vznešená','vznešený')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ pronese [courtier.GetTitledFirstName] a na pozdrav se hluboce ukloní. „Celý svět nyní spočívá pod ochrannými křídly dynastie [ROOT.Char.GetDynasty.GetBaseNameNoTooltip]. Lidé proudí do tvých měst, přitahováni jejich blahobytem.“"
 mpo_decisions_events.0400.a: "Nechte brány otevřené."
 mpo_desperate_stance_decision: "Zoufalé časy"
 mpo_desperate_stance_decision_desc: "Země je neúrodná. Telata umírají v lůnech svých matek, aniž by kdy spatřila sluneční světlo. Koně, hubení jako suché větvičky, se s odporným praskotem hroutí k zemi.\n\nZbývá jediná cesta. Pryč odsud."
 mpo_desperate_stance_decision_confirm: "Svolat lid"
 mpo_desperate_stance_decision_tooltip: "Sjednoť svůj lid k poslednímu zoufalému odporu"
 mpo_desperate_stance_decision_tt: "Ve [Concept('the_great_steppe','Velké stepi')|E] právě panuje [Concept('steppe_season','stepní období')|E] $situation_steppe_havsarsan_zud_season$"
 mpo_decisions_events.0500.t: "Zoufalá opatření"
 mpo_decisions_events.0500.desc: "Vrstvy ledu pokrývají uvadající trávu. Dobytek má čenichy rozedřené do krve, jak se zoufale snaží dostat k pastvě.\n\nPřichází ke mně [Select_CString(courtier.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier'))] [courtier.GetShortUIName] s tělem tak vyhublým, až připomíná hadrovou panenku:\n\n„[ROOT.GetCharacter.Custom('GetMongolHonorific')|U] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')], s každým novým východem slunce umírají další z tvého lidu. Prosím, vyveď nás z tohoto pustého pekla.“"
 mpo_decisions_events.0500.a: "Následujte mě!"
 mpo_desperate_stance_invasion_cb_enable_var_tt: "Budeš moci využít [Concept('casus_belli','casus belli')|E] $invasion_war$"
 expand_the_steppe_decision_generic: "Rozšířit step"
 expand_the_steppe_decision_desc: "Ve své domovině jsme získali sílu, ale výboje a dobrodružné výpravy nás zavedly stále dál od starých pastvin a lovišť, až do zemí obývaných usedlým lidem, který se řídí cizími zvyky.\n\nJe načase přinést náš způsob života i do těchto nových, neznámých krajů."
