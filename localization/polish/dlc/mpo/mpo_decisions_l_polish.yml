 mpo_decisions_events.0020.t: "Představení dědice"
 mpo_decisions_events.0020.desc: "Krev mé krve, [Select_CString(loc_heir.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', loc_heir)] [heir.GetFirstName], bude jednoho dne muset získat věrnost všech členů rodu [ROOT.Char.GetHouse.GetName] i mnoha dalších národů. Bez mocných přátel, kteří [Select_CString(heir.IsFemale,'ji','ho')] podpoří, však může [Select_CString(heir.IsFemale,'její','jeho')] hlas zůstat nevyslyšen.\n\nZatímco nasedáme na koně, v duchu si probírám všechny, kdo mi zachovávají věrnost.\n\n"
 mpo_decisions_events.0020.desc_multiple: "[target_1.Custom('ComplimentAdjective')|U] [target_1.GetTitledFirstName] jistě nabídne [heir.Custom('CZ_FirstNameNoTooltip_D')] místo u svého ohně. Ale na koho musí můj dědic udělat #EMP největší#! dojem...?"
 mpo_decisions_events.0020.desc_one: "Není jich mnoho a existuje pouze jediný člověk, kterému mohu skutečně důvěřovat..."
 mpo_decisions_events.0020.a: "Vyberu [ROOT.Char.Custom2('CZ_RelationToMeShort_A', target_1)] [target_1.Custom('CZ_FirstNameNoTooltip_A')] z [target_1.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')]."
