 mpo_gok_world_conquest_decision: "Reformovat Velký kaganát"
 mpo_gok_world_conquest_decision_desc: "[ROOT.Char.GetPrimaryTitle.GetName|U] se rozprostírá dál než naše širé travnaté pláně, dál než slaná moře, dál, než kdy sahaly sny kteréhokoli nomáda.\n\nTo vše jsme vybojovali v koňských sedlech. Všechno si můžeme udržet, všemu můžeme vládnout... ale jedině z trůnu. Odtud musím jako [ROOT.Char.GetFaith.CreatorName] pohlédnout na zrod nového světa. Světa [ROOT.Char.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_yych')|l] zákonů, nové moudrosti a věčné vlády [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')]."
