 settle_people_decision: "Osídlit dobyté země"
 settle_people_decision_desc: "Tyto země nebyly odjakživa naše, ale nyní se stejně sklánějí před naší vůlí. Jejich města nesou cizí jména a jejich půdu obdělávají ruce, které nepatří našemu lidu. To se však změní.\n\nVezmeme si, co jsme vybojovali, a pevně zarazíme kůly do země. Ať nás nazývají dobyvateli. My se staneme králi."
 settle_people_decision_tooltip: "Přesuň svůj lid, který tvoří [ROOT.Char.GetDomicile.GetCulture.GetCollectiveNoun] vyznávající [CZFaithAdjDecline(ROOT.Char.GetDomicile.GetRite,'ou')|l] víru, do dobytých zemí a opusť vládu typu [GetGovernment( 'nomad_government' ).GetName|l]"
