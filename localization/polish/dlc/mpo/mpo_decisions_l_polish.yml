 mpo_decisions_events.0021.t: "Uvítací obyčeje"
 mpo_decisions_events.0021.desc_intro: "Zatímco [friendship_target.GetTitledFirstName] chystá jídlo a pití na přivítanou,"
 mpo_decisions_events.0021.desc_warm: "zdá se, že [Select_CString(friendship_target.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMe', friendship_target)] neví, jak se k nám zachovat. Nabízí nám dnešní úlovek a společně vzpomínáme na slavné hony minulých let. [Select_CString(heir.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMe', loc_heir)] toho mnoho nenamluví a jen se tiše usmívá."
 mpo_decisions_events.0021.desc_cold: "je [Select_CString(friendship_target.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMe', friendship_target)] [Select_CString(friendship_target.IsFemale,'šedivá a nehybná','šedivý a nehybný')] jako prastará kamenná mohyla. A přestože [Select_CString(heir.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', loc_heir)] dobře zná mou vůli, [heir.GetFirstName] jen [heir.Custom('quirk_pos_present')|l] a pak si mlčky vychutnává teplo ohně."
 mpo_decisions_events.0021.desc: "\n\nMusím ty dva koně dostat do jedné ohrady. Musím mezi nimi ukovat pouto důvěry, které přetrvá i dlouho poté, co mé tělo obrátí se v prach..."
 mpo_decisions_events.0021.a.success: "Pomůžeš [friendship_target.Custom('CZ_FirstNameNoTooltip_D')] rozpoznat ty nejušlechtilejší vlastnosti [heir.Custom('CZ_FirstNameNoTooltip_G')]"
 mpo_decisions_events.0021.a: "Jen má slova je mohou spojit."
 mpo_decisions_events.0021.a.flavor: "Spolehni se na své mistrovství v diplomacii."
 mpo_decisions_events.0021.a.fail: "Svou přítomností zastíníš [heir.Custom('CZ_FirstNameNoTooltip_A')]"
 mpo_decisions_events.0021.b: "„Stejně jako ty je i [heir.GetFirstNameNoTooltip] [lifestyle_trait.GetNameNoTooltip( loc_heir )|l]!“"
 mpo_decisions_events.0021.b.flavor: "Spolehni se na společný zájem, který má tvůj dědic i [ROOT.Char.Custom2('RelationToMeShort', friendship_target)] [friendship_target.GetTitledFirstName]. Oba mají rys [lifestyle_trait.GetNameNoTooltip( loc_heir )|l]."
 mpo_decisions_events.0021.b.success: "[heir.GetFirstNameNoTooltip|U] a [friendship_target.GetFirstNameNoTooltip] si užívají společnou zálibu"
 mpo_decisions_events.0021.b.fail: "Pohádají se a rozejdou ve zlém"
 mpo_decisions_events.0021.c: "Oba vynikají v tradičních sportech."
 mpo_decisions_events.0021.c.flavor: "Spolehni se na jejich společné zkušenosti s rysem [GetTrait('tourney_participant').GetName( GetNullCharacter )]."
 mpo_decisions_events.0021.c.success: "V soutěžení se rodí přátelství"
 mpo_decisions_events.0021.c.fail: "[heir.GetFirstNameNoTooltip|U] a [friendship_target.GetFirstNameNoTooltip] se k sobě chovají příliš hrubě"
 mpo_decisions_events.0021.d: "Ti dva jsou si tolik podobní."
 mpo_decisions_events.0021.d.flavor: "Spolehni se na rysy, které mají oba společné."
 mpo_decisions_events.0021.d.success: "[heir.GetFirstNameNoTooltip|U] a [friendship_target.GetFirstNameNoTooltip] nacházejí společnou řeč díky podobným povahám"
 mpo_decisions_events.0021.d.fail: "Jejich podobnost v nich neprobudí žádný zájem"
 mpo_decisions_events.0021.e: "„Pojí nás vzácná pouta a ta #EMP musí#! přetrvat.“"
 mpo_decisions_events.0021.e.flavor: "Spolehni se na kulturní, rodinná a osobní pouta mezi tebou a [friendship_target.Custom('CZ_TitledFirstNameNoTooltip_I')]."
 mpo_decisions_events.0021.e.success: "Snadno připomeneš příbuzenská pouta s [friendship_target.Custom('CZ_FirstNameNoTooltip_I')]"
 mpo_decisions_events.0021.e.fail: "[heir.GetFirstNameNoTooltip|U] vidí jen přívětivého cizince"
 mpo_decisions_events.0021.f: "Dary jim jistě pozvednou náladu..."
 mpo_decisions_events.0021.f.flavor: "Spolehni se na radost, kterou přináší bohatství."
 heir_friend_will_not_become_friends_tt: "[heir.GetFirstNameNoTooltip|U] a [friendship_target.GetFirstNameNoTooltip] se nestali [Concept('friends','přáteli')|E]"
 mpo_heir_friend_if_accept_tt: "Pokud [friendship_target.GetShortUIName] nabídku přijme:"
 mpo_heir_friend_if_do_not_accept_tt: "Pokud [friendship_target.GetShortUIName] nabídku odmítne:"
 mpo_decisions_events.0022.t: "Návštěvníci z [CZProvNameNoTooltip(root_scope.GetCapitalLocation,'G')]"
 mpo_decisions_events.0022.desc_intro: "Do [CZProvNameNoTooltip(ROOT.Char.GetCapitalLocation,'G')] za mnou přijíždí [root_scope.GetName], [Select_CString(root_scope.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', root_scope)]. [heir.GetFirstName], [Select_CString(root_scope.IsFemale,'její','jeho')] [heir.Custom('ComplimentAdjective')|l] [Select_CString(heir.IsFemale,'dědička','dědic')], mě objímá.\n\nZatímco si kolem prsteníčku ovíjím obřadní šátek z jehněčí kůže zvaný [Glossary( 'chadag', 'KHATAG_GLOSS' )] a na pozdrav podávám jeho cíp,"
 KHATAG_GLOSS: "Obřadní šátek z hedvábí nebo jehněčí kůže, který symbolizuje úctu. Používá se jako dar, znamení přivítání a obětina na posvátných místech. #G Chadag#! pochází z Tibetu, ale rozšířil se mezi buddhisty i vyznavače tengrismu v eurasijské stepi."
 mpo_decisions_events.0022.desc_personal_charm: "[root_scope.GetFirstNameNoTooltip] s hrdostí pronese: „[Select_CString(heir.IsFemale,'Má','Můj')] [root_scope.Custom2('RelationToMe', loc_heir)] [heir.GetFirstNameNoTooltip]! V [Select_CString(heir.IsFemale,'ní','něm')] koluje [heir.GetCulture.Custom('CZ_Adjective_aa')|l] krev! [Select_CString(heir.IsFemale,'Žena předurčená','Muž předurčený')] k velkým činům! O tvé [friendship_target.Custom('ComplimentAdjective')|l] vládě jsem [heir.Custom('CZ_FirstNameNoTooltip_D')] již [Select_CString(root_scope.IsFemale,'vyprávěla','vyprávěl')]. Touží tě poznat ještě lépe než já.“"
 mpo_decisions_events.0022.desc_lifestyle: "[heir.GetFirstNameNoTooltip] prohlásí: „Konečně potkávám někoho, kdo je stejně jako já [lifestyle_trait.GetNameNoTooltip( loc_heir )|l]! Společně si popovídáme o moci a příbuzenství a budeme se věnovat tomu, co nás skutečně baví.“"
 mpo_decisions_events.0022.desc_sports: "[heir.GetFirstNameNoTooltip] mě zve na otevřené prostranství. „Ty i já jsme mistři stejného sportu! Až budeme rozmlouvat o příbuzenství a moci, můžeme si zároveň zdokonalovat dovednosti [ROOT.Char.GetCulture.Custom('CZ_Adjective_eeho')|l] lidu!“"
 mpo_decisions_events.0022.desc_shared_traits: "[root_scope.GetFirstNameNoTooltip] se rozesměje. „[heir.GetFirstNameNoTooltip] je jako tvůj obraz na vodní hladině! Chová se úplně stejně jako ty. Pořád [heir.Custom('CZ_FirstNameNoTooltip_D')] opakuji: právě ty se [Select_CString(heir.IsFemale,'jí','mu')] podobáš nejvíc, právě ty [Select_CString(heir.IsFemale,'ji','ho')] dokážeš nejlépe pochopit a podpořit!“"
 mpo_decisions_events.0022.desc_kinship: "[heir.GetFirstNameNoTooltip] mě pevně uchopí za rameno.\n\n„Pro [heir.Custom2('CZ_RelationToMeShort_A', root_scope)] jsi jako věrný kůň, který nikdy nezabloudí. Ale zůstaneš po našem boku i v nadcházejících letech? Vyhledáš mě, až tělo [root_scope.Custom('CZ_FirstNameNoTooltip_G')] vychladne?“"
 mpo_decisions_events.0022.desc_gift: "[root_scope.GetFirstNameNoTooltip] nám oběma, mně i [heir.Custom('CZ_FirstNameNoTooltip_D')], věnuje kašmírem podšité [Glossary( 'dély', 'DEEL_GLOSS' )] a uzdy dvou bílých koní. „Jako vás spojuje blahobyt,“ pronese [root_scope.GetFirstNameNoTooltip], „kéž vás spojuje i přátelství. Neboť jen díky přátelství může blahobyt vzkvétat.“"
 DEEL_GLOSS: "Tradiční oděv národů stepi v podobě zavinovacího kabátce, který nosí muži i ženy."
 mpo_decisions_events.0022.desc_outro: "\n\nOba návštěvníci pokračují ve vyprávění o tom, jak [heir.GetFirstNameNoTooltip] jednou povede rod [root_scope.GetHouse.GetName]... a jaké čestné místo na mě čeká v [Select_CString(heir.IsFemale,'její','jeho')] [root_scope.Custom('ResidenceBuilding')|l]."
 mpo_decisions_events.0022.a: "„#EMP Dost už slov!#! Naše pouto bude zpečetěno krví.“"
 mpo_decisions_events.0022.b: "„V zájmu [Select_CString(heir.IsFemale,'té, která','toho, kdo')] má převzít vládu [Select_CString(ROOT.Char.IsFemale,'ráda','rád')] uposlechnu svého [root_scope.Custom('CZ_TitleAsNameNoTooltip_G')]!“"
 mpo_decisions_events.0022.c: "„Kéž se často vracíte a usedáte k mému ohni.“"
 mpo_decisions_events.0022.d: "Čeká nás poučný večer plný rozhovorů. Nic víc."
 cultural_acceptance_friendly_visit: "Přátelské návštěvy mezi šlechtici"
 mpo_decisions_events.0023.t: "Nad rámec obyčejů"
 mpo_decisions_events.0023.desc: "Doutnají poslední uhlíky.\n\nHodovali jsme a rozmlouvali až do hluboké noci. Svým smíchem jsme budili ospalé děti a hrdelním zpěvem je děsili. [Select_CString(ROOT.Char.IsFemale,'Sama','Sám')] už sotva musím zpívat, ba ani promluvit, neboť [friendship_target.GetTitledFirstName] a [heir.GetFirstName] si živě povídají o dnešním veselí a sní o radovánkách, které teprve přijdou.\n\nDnes v noci se mi podařilo spojit dvě ušlechtilé duše poutem přátelství."
 mpo_decisions_events.0023.desc_fail: "Doutnají poslední uhlíky.\n\nPřesto se stále ozývá vlídný smích a milá slova, která se však rozlétají jako drobní ptáčci. Navzdory veškerému mému přemlouvání se zdá, že [friendship_target.Custom('ComplimentAdjective')|l] [friendship_target.GetFirstName] před mým dědicem stále skrývá své srdce.\n\nMohu jen doufat, že až ze mě zbude pouhý prach a kosti, podaří se jim přece jen navázat přátelství."
 mpo_decisions_events.0023.desc_accidental_friend: "Snad [Select_CString(accidental_friend.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', accidental_friend)] [accidental_friend.GetFirstName] přivede [heir.Custom('CZ_FirstName_A')] do stejného kruhu! Vždyť [friendship_target.GetTitledFirstName] je [Select_CString(accidental_friend.IsFemale,'jí','jím')] #EMP očividně#! naprosto [Select_CString(friendship_target.IsFemale,'okouzlena','okouzlen')]!"
 mpo_decisions_events.0023.a: "Věrný stoupenec po boku [heir.Custom('CZ_FirstNameNoTooltip_G')]."
 mpo_decisions_events.0023.a_fail: "Zklamání, ale večer byl přesto příjemný."
 EVENT_WINDOW_OPTION_AVAILABLE_HASTILUDER: "Tato možnost je dostupná díky zkušenostem s rysem [GetTrait('tourney_participant').GetName( GetNullCharacter )]."
 study_commander_trait_decision: "Ovládnout umění velení"
 study_commander_trait_decision_desc: "Lid [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] je obrazem svého vládce. Nemohu nečinně přihlížet, jak obyvatelé mé země umírají za svou vlast, zatímco se mí velitelé nedokážou poučit ze svých chyb. Musím vzít otěže do vlastních rukou a dovést je k velikosti."
 study_commander_trait_decision_tooltip: "Získej [Concept('stress','stres')|E] výměnou za šanci získat [Concept('commander_trait','velitelský rys')|E]."
 study_commander_trait_decision_confirm: "Za vítězství!"
 study_commander_trait_decision_effect: "Vydáš se na [Concept('stress','stresující')|E] cestu, během níž můžeš získat [Concept('commander_trait','velitelský rys')|E]."
 mpo_decisions_events.0200.t: "Cíl: $study_commander_trait_decision$"
 mpo_decisions_events.0200.desc: "Zamířím do zbrojnice a ze stojanu si vyberu znamenitou čepel. Pozoruji vojáky, jejich pohyby, opilství a nedostatek kázně. Než jimi začnu pohrdat, musím se naučit jim velet. Proč by měl člověk dbát na řád, když řád nedbá na něj?\n\nPři odchodu si všimnu, že mě zpovzdálí pozoruje [commander_trait_mentor.GetName]. [Select_CString(commander_trait_mentor.IsFemale,'Je to obávaná bojovnice','Je to obávaný bojovník')], přestože tuto zbrojnici zaplňují samí slaboši. Snad by mě [Select_CString(commander_trait_mentor.IsFemale,'mohla','mohl')] lecčemu naučit."
 mpo_decisions_events.0200.desc_my_mentor: "Už dříve mi s tímto úsilím [Select_CString(commander_trait_mentor.IsFemale,'pomohla','pomohl')], a tak se na [Select_CString(commander_trait_mentor.IsFemale,'ni','něj')] mohu znovu obrátit."
 mpo_decisions_events.0200.desc_mentor: "S podobným úsilím už dříve [Select_CString(commander_trait_mentor.IsFemale,'pomáhala','pomáhal')] jiným, a proto se těší dobré pověsti."
 mpo_decisions_events.0200.mentor: "Zdá se, že [commander_trait_mentor.GetName] získá [Select_CString(ROOT.Char.IsFemale,'novou svěřenkyni','nového svěřence')]."
 mpo_decisions_events.0200.my_mentor: "Opět se setkáváme, [commander_trait_mentor.Custom('CZ_TitledFirstName_V')]."
 mpo_decisions_events.0200.mentor_flavor: "Požádáš [commander_trait_mentor.Custom('CZ_NameNoTooltip_A')] o pomoc na své cestě za zdokonalením velitelských schopností."
 mpo_decisions_events.0200.mentor_traits: "Díky [Concept('commander_traits','velitelským rysům')|E], které má [commander_trait_mentor.GetName]:"
 study_commander_trait_bonus: "Díky tvým [Concept('traits','rysům')|E]:"
 mpo_decisions_events.0200.a: "Musím to zvládnout bez pomoci."
 mpo_decisions_events.0200.alone: "Tvá cesta bude poněkud #bold nepředvídatelná#! a #bold bez vedení#!."
 mpo_decisions_events.0200.martial: "Má taktická mysl je dost bystrá. Vystačím si s ní."
 mpo_decisions_events.0200.martial_flavor: "Cesta k vítězství je osamělá, ale #bold povede#! tě tvá znalost válečnictví."
 mpo_decisions_events.0200.learning: "Raději se poučím z historických kronik a moudrosti učenců."
 mpo_decisions_events.0200.learning_flavor: "#bold Povedou#! tě zkušenosti dávných bitev a spisy slavných vojevůdců."
 mpo_decisions_events.0200.intrigue: "Své nepřátele vymanévruji a protivníky přelstím."
 mpo_decisions_events.0200.intrigue_flavor: "#bold Povedou#! tě tvé úskoky, živené šepotem ze dvora i válečných táborů."
 mpo_decisions_events.0201.t: "Zkoušky velení"
 mpo_decisions_events.0201.desc_intro: "Nyní, když jsem se do výcviku [Select_CString(ROOT.Char.IsFemale,'pustila','pustil')] naplno, musím zjistit, v čem spočívají mé přednosti a slabiny. Dobře vím, že často bývám [ROOT.Char.Custom('DescriptorNegativeStandalone')|l], ale nesmím dovolit, aby se mi tato neřest stala osudnou.\n\nMusím se zaměřit na svou největší slabinu."
 mpo_decisions_events.0201.desc_mentor: "\n\n„Každý boj je jiný, [ROOT.Char.Custom('CZ_FirstName_V')],“ pronese [commander_trait_mentor.GetNameNoTooltip]. „Musíš být [Select_CString(ROOT.Char.IsFemale,'připravena','připraven')] na všechno, skutečně na všechno. Nepřítel nebude čekat, až budeš [Select_CString(ROOT.Char.IsFemale,'připravena','připraven')]. Co je tvou největší slabinou v boji? Pověz mi to.“"
 mpo_decisions_events.0201.martial_1: "Na bojišti jsem jedním z mnoha. Když však stojím osamoceně, jsem [Select_CString(ROOT.Char.IsFemale,'slabá','slabý')]."
 study_commander_trait_option_mentor_desc: "Tvým protivníkem bude [commander_trait_mentor.GetNameNoTooltip]"
 study_commander_trait_option_success: "Během zkoušky se mnoho naučíš"
 study_commander_trait_option_success_ok: "Ve výcviku dosáhneš pokroku"
 study_commander_trait_option_fail: "Nedaří se ti osvojit potřebné dovednosti"
 study_commander_trait_option_fail_ok: "K ovládnutí umění velení nejsi o nic blíž"
 mpo_decisions_events.0201.martial_1_mentor_success: "V souboji porazíš [commander_trait_mentor.Custom('CZ_NameNoTooltip_A')]"
 mpo_decisions_events.0201.martial_1_mentor_fail: "[commander_trait_mentor.GetNameNoTooltip|U] tě v souboji porazí"
 mpo_decisions_events.0201.martial_1_flavor: "Tvou slabinou je neschopnost bojovat bez pomoci ostatních."
 mpo_decisions_events.0201.martial_1_tt: "Pokusíš se zdokonalit své soubojové schopnosti tím, že se v kasárnách utkáš s jedním z vojáků"
 mpo_decisions_events.0201.martial_1_success: "Porazíš svého protivníka"
 mpo_decisions_events.0201.martial_1_fail: "Voják tě porazí"
 mpo_decisions_events.0201.martial_2: "Musím se naučit bojovat po boku ostatních."
 mpo_decisions_events.0201.martial_2_flavor: "Tvou slabinou je neschopnost účinně spolupracovat s ostatními v boji."
 mpo_decisions_events.0201.martial_2_tt: "Shromáždíš skupinu vojáků a na nádvoří s nimi budeš nacvičovat bojové formace"
 mpo_decisions_events.0201.martial_2_success: "Pod tvým velením vznikne neproniknutelná obrana"
 mpo_decisions_events.0201.martial_2_fail: "Tví vojáci jsou neuspořádaní a snadno poraženi"
 mpo_decisions_events.0201.learning_1: "Znát nepřítele je jen polovina vítězství. Tou druhou je vyznat se v terénu."
 mpo_decisions_events.0201.learning_1_flavor: "Tvou slabinou je nedostatečná znalost krajiny a terénu."
 mpo_decisions_events.0201.learning_1_tt: "Prozkoumáš okolní krajinu a pokusíš se najít nejvhodnější místo pro zaujetí pozic"
 mpo_decisions_events.0201.learning_1_mentor: "[commander_trait_mentor.GetNameNoTooltip|U] ti pomůže s průzkumem"
 mpo_decisions_events.0201.learning_1_success: "Najdeš dokonalé místo pro léčky i obranu"
 mpo_decisions_events.0201.learning_1_fail: "Ztratíš se v divočině"
 mpo_decisions_events.0201.learning_2: "Zbraně poskytují největší výhodu tomu, kdo je umí používat."
 mpo_decisions_events.0201.learning_2_flavor: "Chceš si prohloubit znalosti zbraní a obléhacích strojů."
 mpo_decisions_events.0201.learning_2_tt: "Budeš studovat pokroky ve vývoji zbraní a hledat způsoby, jak je využít ve svůj prospěch"
 mpo_decisions_events.0201.learning_2_mentor: "[commander_trait_mentor.GetNameNoTooltip|U] ti vysvětlí složitosti fungování jednotlivých zbraní"
 mpo_decisions_events.0201.learning_2_success: "Naučíš se účinněji používat zbraně a možná dokonce vylepšíš ty, které už máš"
 mpo_decisions_events.0201.learning_2_fail: "Vývoj zbraní v průběhu dějin je příliš složitý, než abys jej dokázal pochopit"
 mpo_decisions_events.0201.intrigue_1_flavor: "Chceš zdokonalit svou schopnost získávat ostatní na svou stranu a manipulovat spojenci i nepřáteli."
 mpo_decisions_events.0201.intrigue_1: "Musím se naučit proniknout do myslí ostatních."
 mpo_decisions_events.0201.intrigue_1_tt: "Shromáždíš skupinu rolníků a pokusíš se je přesvědčit, aby jednali podle tvých pokynů"
 mpo_decisions_events.0201.intrigue_1_mentor: "[commander_trait_mentor.GetNameNoTooltip|U] ti poradí, jak manipulovat s ostatními"
 mpo_decisions_events.0201.intrigue_1_success: "Navzdory počáteční neochotě se ti podaří dav přesvědčit"
 mpo_decisions_events.0201.intrigue_1_fail: "Zdá se, že nikdo neposlouchá, co říkáš"
 mpo_decisions_events.0201.intrigue_2: "Někdy je nejlepším způsobem, jak zvítězit, vůbec nebojovat."
 mpo_decisions_events.0201.intrigue_2_flavor: "Chceš zdokonalit svou schopnost předcházet konfliktům."
 mpo_decisions_events.0201.intrigue_2_tt: "Pokusíš se přesvědčit rozvášněný dav, aby složil zbraně"
 mpo_decisions_events.0201.intrigue_2_success: "Dav přijme tvé podmínky a podaří se ti zabránit boji"
 mpo_decisions_events.0201.intrigue_2_fail: "Tvá slova dav jen ještě více rozzuří"
 mpo_decisions_events.0201.none_1: "Nikdo nebude následovat vůdce, který nechává své lidi hladovět."
 mpo_decisions_events.0201.none_1_flavor: "Chceš se naučit účinněji rozdělovat zásoby."
 mpo_decisions_events.0201.none_1_tt: "Pokusíš se vymyslet nejlepší způsob, jak zajistit dostatek jídla pro své vojáky"
 mpo_decisions_events.0201.none_1_success: "Potravin je dostatek a tví vojáci jsou dobře živeni"
 mpo_decisions_events.0201.none_1_fail: "Tvůj plán se obrátí proti tobě a vojáci zůstanou hladoví"
 mpo_decisions_events.0201.none_2: "Prvním krokem je stát se silnějším."
 mpo_decisions_events.0201.none_2_flavor: "Chceš zlepšit svou tělesnou sílu."
 mpo_decisions_events.0202.t: "Nečekaný vývoj událostí"
 mpo_decisions_events.0202.desc_battlefield: "Když se vracím z bojiště,"
 mpo_decisions_events.0202.desc_study: "Když se vracím od svých studií,"
 mpo_decisions_events.0202.desc_terrain: "Když se vracím ze svých cest,"
 mpo_decisions_events.0202.desc_town: "Když se vracím z města,"
 mpo_decisions_events.0202.desc: "vítá mě [situation_alerter.GetName]. Začne mi vyprávět o nedávné události, o níž soudí, že by mě mohla zajímat."
 mpo_decisions_events.0202.desc_1_intro: "\n\nVypráví mi o místě nedaleko odsud.\n\n„Usadila se tam tlupa banditů,“ vysvětluje. „Svou výhodu získali díky místním podmínkám. Především kvůli terénu:"
 mpo_decisions_events.0202.desc_1_outro: "Pravidelné vojsko nemělo sebemenší šanci!“ zvolá."
 mpo_decisions_events.0202.desc_2: "\n\nDozvídám se o pevnosti, která byla obléhána, a o tom, jak rychle její obránci ztráceli půdu pod nohama. „Stačila jediná střela z trebuchetu a hradby se zřítily,“ vypráví nadšeně. „Není divu, že se tamní pán tak rychle vzdal. Dlouho by se stejně neubránil.“"
 mpo_decisions_events.0202.desc_3: "\n\nDozvídám se o skupině nespokojených důstojníků a vojáků, kteří se dopustili zrady a zosnovali spiknutí s cílem podkopat autoritu svého velitele a svrhnout ho. „A pak, uprostřed noci – bodnutí nožem!“ vypráví. „Velitel vůbec netušil, co se na něj chystá.“"
 mpo_decisions_events.0202.desc_outro: "\n\n[situation_alerter.GetFirstNameNoTooltip|U] si odkašle. „A co bys v takové situaci [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')] ty?“"
 mpo_decisions_events.0202.martial_situation_1: "[Select_CString(ROOT.Char.IsFemale,'Prozkoumala','Prozkoumal')] bych terén a [Select_CString(ROOT.Char.IsFemale,'využila','využil')] ho ve svůj prospěch."
 mpo_decisions_events.0202.martial_situation_1_flavor: "Vysvětlíš [situation_alerter.Custom('CZ_FirstNameNoTooltip_D')], jak důležité je znát krajinu, v níž se odehrává boj."
 mpo_decisions_events.0202.learning_situation_1: "Odkud se ti bandité vlastně vzali?"
 mpo_decisions_events.0202.learning_situation_1_flavor: "Vysvětlíš [situation_alerter.Custom('CZ_FirstNameNoTooltip_D')], že poznání nepřítele je prvním krokem k jeho porážce."
 mpo_decisions_events.0202.success: "[situation_alerter.GetFirstNameNoTooltip|U] souhlasně přikývne"
 mpo_decisions_events.0202.fail: "[situation_alerter.GetFirstNameNoTooltip|U] na mě pohlédne se zdviženým obočím"
 mpo_decisions_events.0202.intrigue_situation_1: "Bandité? [Select_CString(ROOT.Char.IsFemale,'Obrátila','Obrátil')] bych jejich chamtivost proti nim."
 mpo_decisions_events.0202.intrigue_situation_1_flavor: "Ukážeš [situation_alerter.Custom('CZ_FirstNameNoTooltip_D')], jak využít slabin nepřítele."
 mpo_decisions_events.0202.none_situation_1: "Mou obranou by nikdy nepronikli!"
 mpo_decisions_events.0202.none_situation_1_flavor: "Vysvětlíš [situation_alerter.Custom('CZ_FirstNameNoTooltip_D')], že nejlepší cestou k porážce nepřítele je důkladná příprava."
 mpo_decisions_events.0202.martial_situation_2: "Proč se krčit za hradbami? Rozdrťte ten zatracený stroj!"
 mpo_decisions_events.0202.martial_situation_2_flavor: "Vysvětlíš [situation_alerter.Custom('CZ_FirstNameNoTooltip_D')], že bys obléhací stroje [Select_CString(ROOT.Char.IsFemale,'zničila','zničil')] přímým útokem."
 mpo_decisions_events.0202.learning_situation_2: "Proti každé zbrani existuje účinná obrana."
 mpo_decisions_events.0202.learning_situation_2_flavor: "Navrhneš prostudovat konstrukci obléhacích strojů, odhalit jejich slabiny a možná objevit i nové možnosti jejich vylepšení."
 mpo_decisions_events.0202.intrigue_situation_2: "Pokud jejich síla spočívá ve zbraních, připravme je o ně."
 mpo_decisions_events.0202.intrigue_situation_2_flavor: "Vysvětlíš [situation_alerter.Custom('CZ_FirstNameNoTooltip_D')], že bys nepřátelské obléhací stroje [Select_CString(ROOT.Char.IsFemale,'sabotovala','sabotoval')]."
 mpo_decisions_events.0202.none_situation_2: "Evakuovat obyvatele a nechat hradby padnout."
 mpo_decisions_events.0202.none_situation_2_flavor: "Vysvětlíš [situation_alerter.Custom('CZ_FirstNameNoTooltip_D')], že bys [Select_CString(ROOT.Char.IsFemale,'zachránila','zachránil')] obyvatele a pevnost [Select_CString(ROOT.Char.IsFemale,'přenechala','přenechal')] nepříteli."
 mpo_decisions_events.0202.martial_situation_3: "Shromáždit věrné a vyrazit proti zrádcům!"
 mpo_decisions_events.0202.martial_situation_3_flavor: "Vysvětlíš [situation_alerter.Custom('CZ_FirstNameNoTooltip_D')], že bys [Select_CString(ROOT.Char.IsFemale,'neztrácela','neztrácel')] čas a okamžitě proti zrádcům [Select_CString(ROOT.Char.IsFemale,'zakročila','zakročil')]."
 mpo_decisions_events.0202.learning_situation_3: "Odhalit jejich plán a postarat se, aby selhal."
 mpo_decisions_events.0202.learning_situation_3_flavor: "Navrhneš [situation_alerter.Custom('CZ_FirstNameNoTooltip_D')], že bys důkladně [Select_CString(ROOT.Char.IsFemale,'rozebrala','rozebral')] plán spiklenců a [Select_CString(ROOT.Char.IsFemale,'našla','našel')] způsob, jak jej překazit na dálku."
 mpo_decisions_events.0202.intrigue_situation_3: "Předstírat spojenectví se zrádci a rozvrátit je zevnitř."
 mpo_decisions_events.0202.intrigue_situation_3_flavor: "Vysvětlíš [situation_alerter.Custom('CZ_FirstNameNoTooltip_D')], že by ses vetřel mezi spiklence a jejich plány sabotoval."
 mpo_decisions_events.0202.none_situation_3: "Ať se všichni dozvědí o plánech těch zbabělců!"
 mpo_decisions_events.0202.none_situation_3_flavor: "Vysvětlíš [situation_alerter.Custom('CZ_FirstNameNoTooltip_D')], že bys spiklence [Select_CString(ROOT.Char.IsFemale,'odhalila','odhalil')] a [Select_CString(ROOT.Char.IsFemale,'nechala','nechal')] lid rozhodnout o jejich osudu."
 mpo_decisions_events.0203.t: "Chvíle klidu"
 mpo_decisions_events.0203.desc_intro: "Mé myšlenky se vzdalují od bojiště a já se uchyluji na tiché místo. Jsem tu [Select_CString(ROOT.Char.IsFemale,'sama','sám')] a jediným zvukem je šelest listí, kterým venku povívá vítr.\n\n"
 mpo_decisions_events.0203.desc: "V těchto bitvách se prolévá krev a nespočet životů přichází nazmar. Přesto to není zbytečné a rozhodně mi to nepřináší potěšení. V této chvíli si musím vybavit tváře padlých i jména těch, kteří přežili.\n\nPro koho to všechno dělám? A proč?"
 mpo_decisions_events.0203.desc_mentor: "[commander_trait_mentor.GetNameNoTooltip|U] sedí opodál a pozorně mě sleduje. „Vidím, že tě něco trápí,“ pronese. „Musíš si však položit otázku: Za koho bojuješ? A proč?“"
 mpo_decisions_events.0203.a: "Aby [heir_person.GetName] [Select_CString(heir_person.IsFemale,'mohla','mohl')] vládnout tak jako já."
 mpo_decisions_events.0203.b: "Abych se [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] vrátit tam, kde na mě čeká [love_person.GetFirstName] – [Select_CString(love_person.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', love_person)]."
 mpo_decisions_events.0203.c: "Abych pobil své nepřátele."
 mpo_decisions_events.0203.c_rival: "Kvůli sobě. Chci se dožít dne, kdy [hate_person.GetName] zemře, abych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] oslavit [Select_CString(hate_person.IsFemale,'její','jeho')] smrt."
 mpo_decisions_events.0203.d: "Pro slávu [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')]!"
 mpo_decisions_events.0203.d_landless: "Za lid, který vedu."
 mpo_decisions_events.0203.e: "Kéž [ROOT.Char.GetFaith.HighGodName] přijme mou úctu!"
 mpo_decisions_events.0203.sentiment: "Protože [target_person.GetFirstName] to cítí stejně:"
 mpo_decisions_events.0203.dread: "Díky tvé [Concept('dread','hrůze')|E]:"
 mpo_decisions_events.0203.prestige: "Díky tvé [Concept('prestige_level','úrovni slávy')|E]:"
 mpo_decisions_events.0203.piety: "Díky tvé [Concept('piety_level','úrovni oddanosti')|E]:"
 mpo_decisions_events.0204.t: "Nová cesta"
 mpo_decisions_events.0204.desc: "Od chvíle, kdy jsem [Select_CString(ROOT.Char.IsFemale,'zahájila','zahájil')] svůj výcvik, uplynul už nějaký čas. Myslím, že nyní konečně nastala chvíle sklidit plody svého úsilí. Je načase podrobit své schopnosti zkoušce a zjistit, zda jsem skutečně [Select_CString(ROOT.Char.IsFemale,'ovládla','ovládl')] umění velení."
 mpo_decisions_events.0204.desc_mentor: "Samozřejmě jsem [Select_CString(ROOT.Char.IsFemale,'vděčná','vděčný')] za vedení a rady, kterých se mi dostalo od [commander_trait_mentor.Custom('CZ_Name_G')]."
 mpo_decisions_events.0204.a: "Za vítězstvím!"
 mpo_decisions_events.0204.a_success: "#p Získáš#! náhodný [Concept('commander_trait','velitelský rys')|E]"
 mpo_decisions_events.0204.a_success_desc: "O získání dalšího se můžeš pokusit za #V 10#! let"
 mpo_decisions_events.0204.a_fail: "#n Nepodaří#! se ti získat [Concept('commander_trait','velitelský rys')|E]"
 mpo_decisions_events.0204.a_fail_desc: "Pokus můžeš zopakovat za #V 5#! let"
