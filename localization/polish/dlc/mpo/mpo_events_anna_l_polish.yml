l_polish:
 mpo_events_anna.0001.t: "Do sedla od malička"
 mpo_events_anna.0001.desc: "Společně s [ROOT.Char.Custom2('CZ_RelationToMeShort_I', SCOPE.sC('pushy_adult'))] [pushy_adult.Custom('CZ_FirstName_I')] pozorujeme, jak si [Select_CString(child.IsFemale,'má dcera','můj syn')] [child.GetFirstName] bezstarostně poskakuje po táboře s několika kamínky připravenými ke hře. [pushy_adult.GetFirstNameNoTooltip|U] se ke mně dychtivě otočí s širokým úsměvem.\n\n„Nemyslíš, že už je načase, aby se [child.GetFirstNameNoTooltip] místo těch dětských her [Select_CString(child.IsFemale,'naučila','naučil')] jezdit na koni? [Select_CString(pushy_adult.IsFemale,'Připravila','Připravil')] jsem velmi klidné hříbě a také provaz, který [Select_CString(child.IsFemale,'ji','ho')] při první jízdě ochrání před pádem.“"
 mpo_events_anna.0001.a: "Ať [child.GetFirstNameNoTooltip] vyjede bez pomoci."
 mpo_events_anna.0001.a.tt: "Přivážu [child.Custom('CZ_FirstNameNoTooltip_A')] provazem ke koni."
 mpo_events_anna.0001.a.toast.good: "[child.GetFirstNameNoTooltip|U] se naučí jezdit na koni"
 mpo_events_anna.0001.a.toast.neutral: "[child.GetFirstNameNoTooltip|U] se jezdit na koni nenaučí"
 mpo_events_anna.0001.a.toast.bad: "[child.GetFirstNameNoTooltip|U] spadne z koně"
 mpo_events_anna.0001.b: "Pojedu s [child.Custom('CZ_FirstNameNoTooltip_I')], aby se to naučilo."
 mpo_events_anna.0001.c: "„[child.GetFirstNameNoTooltip|U] se to naučí, až přijde čas.“"
 mpo_events_anna.0005.t: "Příběhy dávných časů"
 mpo_events_anna.0005.desc: "S příchodem noci se na temné obloze rozzáří hvězdy. Mezi jurtami plápolá táborový oheň, který svým teplem a světlem láká všechny shromážděné.\n\n[Select_CString(storyteller.IsFemale,'Naše dnešní vypravěčka','Náš dnešní vypravěč')] [storyteller.GetFirstName] přejíždí pohledem po nedočkavém davu. Zdá se, že něco hledá. Anebo spíš #EMP někoho#!.\n\nNaše pohledy se setkají a [storyteller.GetFirstNameNoTooltip] náhle vyskočí mým směrem. Shromáždění polekaně ucouvne, zaskočené tím prudkým pohybem. Pomalu se zvedne ruka, jejíž prst nakonec ukáže přímo na mě. „Teď je řada na tobě! Vyber příběh z dávných časů, který nám budu vyprávět!“"
 mpo_events_anna.0005.a: "„Pověz nám něco kouzelného!“"
 mpo_events_anna.0005.a.tt: "Nezkrotitelní okřídlení koně, zvířata rozmlouvající s lidmi a děsivé bouře ovládané božstvy."
 mpo_events_anna.0005.b: "„Co takhle něco veselého, ať se zasmějeme?“"
 mpo_events_anna.0005.b.tt: "Šibalství starších mužů, nepochopené prosby a závody, které nabraly zcela nečekaný směr."
 mpo_events_anna.0005.c: "„Legendy o hrdinských činech!“"
 mpo_events_anna.0005.c.tt: "Slavné bitvy, válečné bratrství a legendární bojovníci nahánějící hrůzu svým nepřátelům."
 mpo_events_anna.0010.t: "Hvízdnutí ostré jako šíp"
 mpo_events_anna.0010.desc: "V dálce vidím několik koní z našeho tábora, jak se pokojně pasou. Moc bych se s nimi [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')] lépe seznámit, ale nedaří se mi upoutat jejich pozornost. Zkouším mávat rukama, přecházet sem a tam, dokonce i křičet, ale odpovědí je mi jen ticho.\n\nZnechucení z marných pokusů nakonec převáží, a tak se otočím a vydám se zpátky do tábora. Jenže vzápětí se čelně srazím s [whistler.Custom('CZ_FirstName_I')].\n\n„Budeme tě muset naučit pár nových triků, jak přivolat svého koně. Sleduj mě a dělej to, co já.“"
 mpo_events_anna.0010.a: "Pozorně poslouchat pokyny."
 mpo_events_anna.0010.a.tt.learning: "[Concept('learning_skill','Učenost')|EU] [whistler.Custom('CZ_FirstName_G')] zvýší tvou šanci na úspěch"
 mpo_events_anna.0010.a.tt.success: "Podaří se ti zapískat"
 mpo_events_anna.0010.a.tt.failure: "Nepochopíš pokyny [whistler.Custom('CZ_FirstNameNoTooltip_G')]"
 mpo_events_anna.0010.b: "„Já se budu učit, až se mi bude chtít!“"
 mpo_events_anna.0015.t: "Sousto masa"
 mpo_events_anna.0015.desc: "Z okolních kopců se ozývá slabé zvířecí naříkání a kňučení. Zvědavost mě přiměje vydat se za tím zvukem a podívat se, co se děje.\n\nNacházím opuštěné kolouší mládě, které uvízlo v [Glossary( 'pasti khogste', 'KHOGSTE_GLOSS' )]. Zoufale se snaží vyprostit zaklíněnou nohu a žalostně volá po útěše své matky. Nikdo však nepřichází.\n\nAčkoli tato kořist není naše, čeká nás namáhavá cesta a musíme udělat vše pro to, abychom ji přežili."
 mpo_events_anna.0015.a: "Přivlastnit si kořist a doplnit zásoby."
 mpo_events_anna.0015.b: "Zalžu, že ta past byla od začátku moje."
 mpo_events_anna.0015.c: "Osvobodím mládě, aby dostalo šanci dospět."
 mpo_events_anna.0015.d: "Není to moje kořist."
 KHOGSTE_GLOSS: "Nášlapná past vyrobená z různých druhů kamene, zakopaná do země a pevně ukotvená."
 mpo_events_anna.0020.t: "Závod s časem"
 mpo_events_anna.0020.desc: "Hřmění kopyt se žene přes planinu přímo k nám. Vynoří se silueta [Select_CString(messenger.IsFemale,'jezdkyně','jezdce')] na koni. Zdá se, že veškeré síly věnuje pouhé snaze udržet se v sedle.\n\nPřímo před námi kůň prudce zastaví a jeho [Select_CString(messenger.IsFemale,'jezdkyně','jezdec')] s nesmírnou námahou sesedá. Přes celá záda se táhne hrozivá rána. Je zázrak, že se vůbec ještě drží na nohou.\n\n„M-m-musíte to d-doručit... p-prosím...“ To jsou poslední slova, která ze sebe dokáže vypravit. V ruce svírá zašifrovanou zprávu a bolestivě ukazuje k obzoru. Pak se oči zavřou a vyčerpané tělo se zhroutí k zemi..."
 mpo_events_anna.0020.war_impact.tt: "Výsledek tvého rozhodnutí #EMP může#! ovlivnit události na jiných místech"
 mpo_events_anna.0020.a: "Rychle, musím ošetřit [Select_CString(messenger.IsFemale,'její','jeho')] zranění!"
 mpo_events_anna.0020.a.toast.good: "Podaří se ti ošetřit zraněného posla"
 mpo_events_anna.0020.a.toast.bad: "Nepodaří se ti ošetřit poslova zranění"
 mpo_events_anna.0020.b: "Splním poslední přání a zprávu doručím osobně."
 mpo_events_anna.0020.b.toast.good: "Podaří se ti předat zprávu další osobě"
 mpo_events_anna.0020.b.toast.bad: "Ztratíš se a zprávu se ti nepodaří doručit"
 mpo_events_anna.0020.c: "Toho člověka neznám. Jak mám vědět, zda [Select_CString(messenger.IsFemale,'jí','mu')] mohu věřit?"
 mpo_events_anna.0020.c_flavor: "#EMP Prohledej [Select_CString(messenger.IsFemale,'její','jeho')] mrtvolu a vezmi si, co má u sebe. Stejně už to nebude potřebovat.#!"
 mpo_events_anna.0025.t: "Známé melodie"
 mpo_events_anna.0025.desc: "Písně dokážou spojovat náš lid po celá staletí, dlouho poté, co byly poprvé složeny. Některé nás inspirují, jiné přinášejí útěchu a vytoužený odpočinek v těžkých časech. Další nám vlévají novou sílu do žil, abychom dokázali pokračovat v boji. Takové písně se jen tak nezapomínají. Stávají se součástí našeho dědictví.\n\nTo všechno si znovu uvědomuji, když potkám [Select_CString(throat_singer.IsFemale,'zpěvačku sedící na skále','zpěváka sedícího na skále')]. Podmanivý zpěv mě zcela uchvátí."
 mpo_events_anna.0025.a: "Pokusit se napodobit melodii a přidat se ke zpěvu."
 mpo_events_anna.0025.a.toast.success: "Podaří se ti zpívat společně s [throat_singer.Custom('CZ_FirstName_I')]"
 mpo_events_anna.0025.a.toast.failure: "Tvůj rytmus a intonace trochu pokulhávají"
 mpo_events_anna.0025.b: "Jen poslouchat a vychutnávat si zpěv."
