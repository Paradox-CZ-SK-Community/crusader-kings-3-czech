l_polish:
 mpo_events_tova.0001.t: "Chladné přivítání"
 mpo_events_tova.0001.desc: "Nedlouho po návratu si všimnu, že mi [demanding_relation.GetTitledFirstName] chodí v patách s očekáváním ve tváři. Už nějakou dobu jsme se neviděli, neboť během mé poslední cesty [Select_CString(demanding_relation.IsFemale,'zůstala','zůstal')] u dvora. Je však zřejmé, že ode mě očekává víc než pouhou společnost.\n\nVzhlédne ke mně rozzářenýma očima a zeptá se: „[Select_CString(ROOT.Char.IsFemale,'Přivezla','Přivezl')] jsi mi něco z cesty?“\n\nZačnu si horečně prohmatávat kapsy, ale nenacházím v nich nic kromě [ROOT.Char.Custom('RandomWeirdObject')|l]. Vůbec si nevzpomínám, jak se mi to tam dostalo."
 mpo_events_tova.0001.a: "Raději ti budu vyprávět o svých cestách."
 mpo_events_tova.0001.a.tt.failure: "Nepodaří se ti zapůsobit na [demanding_relation.Custom('CZ_TitledFirstName_A')]"
 mpo_events_tova.0001.a.tt.success: "Podaří se ti zapůsobit na [demanding_relation.Custom('CZ_TitledFirstName_A')]"
 mpo_events_tova.0001.b: "Zajdu na trh a něco ti koupím."
 mpo_events_tova.0001.b.equipped_tt: "Pro [demanding_relation.Custom('CZ_TitledFirstName_A')] byl zakoupen [wanderer_toy.GetName]"
 gifted_toy_name: "Dřevěný koník"
 gifted_toy_desc: "Nádherně vyřezávaný dřevěný koník na hraní."
 mpo_events_tova.0001.c: "Opravdu chci lhát dítěti?"
 mpo_events_tova.0001.c.tt.failure: "[demanding_relation.GetTitledFirstName|U] se nenechá tak snadno oklamat"
 mpo_events_tova.0001.c.tt.success: "Přesvědčíš [demanding_relation.Custom('CZ_TitledFirstName_A')], že předmět je výjimečný"
 mpo_events_tova.0002.t: "Vzdálené melodie"
 DynamicIntroLanded: "Když se procházím svými síněmi"
 DynamicIntroWanderer: "Když procházím táborem"
 mpo_events_tova.0002.desc: "[ROOT.Char.Custom('DynamicIntroLoc')|U], zaslechnu z nádvoří tiché tóny hudby.\n\nJednotlivé akordy splývají v nádherný souzvuk, který mě přiměje zastavit a probudí ve mně hlubokou nostalgii. Nemusím ani slyšet slova, abych poznal, že píseň vypráví o stesku po domově.\n\nVydám se za hudbou a objevím [musician.GetTitledFirstName]. Je to [Select_CString(musician.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('musician'))]. [Select_CString(musician.IsFemale,'Urazila','Urazil')] dlouhou cestu ze své domoviny a nyní hraje píseň, která jako by měla oživit vzpomínky na místo, odkud pochází.\n\nSkutečně, stačí zavřít oči a představuji si [journey_province.GetName] a tamní [journey_province.Custom('TerrainInspirationLoc')|l]."
 mpo_events_tova.0002.a: "Jednou bych se tam měl podívat."
 mpo_events_tova.0002.a.tt: "Pokud během aktivity [GetActivityType('activity_journey').GetName] navštívíš [journey_province.GetName], můžeš získat dodatečné zkušenosti pro [Concept('wanderer_lifestyle','potulný životní styl')|E]"
 mpo_events_tova.0002.b: "Má láska k hudbě mi pomůže získat [musician.Custom('CZ_TitledFirstName_A')] do svých služeb."
 mpo_events_tova.0002.b.flavor: "Copak není souzvuk několika nástrojů krásnější než osamělý tón?"
 mpo_events_tova.0002.b.tt.success: "Podaří se ti přesvědčit [musician.Custom('CZ_TitledFirstName_A')], aby se k tobě přidal"
 mpo_events_tova.0002.b.tt.failure: "Nepodaří se ti přesvědčit [musician.Custom('CZ_TitledFirstName_A')], aby se k tobě přidal"
 cultural_acceptance_enjoyed_music: "[Concept('cultural_acceptance','Kulturní přijetí')|EU] mezi [ROOT.Char.GetCulture.Custom('CZ_Adjective_ou')|l] a [journey_province.GetCounty.GetCulture.Custom('CZ_Adjective_ou')|l] kulturou se zvýší o [EmptyScope.ScriptValue('minor_cultural_acceptance_gain')]"
 mpo_events_tova.0002.c: "Na chvíli se posadím a vychutnám si hudbu."
 mpo_events_tova.0003.t: "Žert, který zašel příliš daleko"
 mpo_events_tova.0003.desc: "Když vyjdu z lesa, přivítá mě zlověstné krákání krkavců. Na větvích [unruly_province.Custom('GetRandomRegionalWood')|l] se mírně pohupují prázdné oprátky. Pod nimi klečí tři muži v řetězech. Jeden z nich se nápadně podobá [unruly_province_owner.Custom('CZ_TitledFirstName_D')].\n\n„Tihle prašiví psi se vysmívali právoplatné vládě [unruly_province_owner.Custom('CZ_TitleTierName_G')]!“ vykřikne kat. „Jsou to vzbouření sedláci, kteří se vydávají za herce. Za svou pomlouvačnou kampaň zaplatí životem!“\n\n„Prosím, pomoz nám!“ zvolá na mě jeden z obviněných."
 mpo_events_tova.0003.a: "„Ve skutečnosti jsou to moji herci a chci je zpátky.“"
 mpo_events_tova.0003.a.tt: "Pokusíš se získat herce do svých služeb tím, že kata přesvědčíš, že jsou tvými poddanými a pouze ty smíš rozhodovat o jejich osudu."
 mpo_events_tova.0003.a.tt.success: "Přesvědčíš kata, že herci patří tobě a že o jejich osudu rozhoduješ pouze ty"
 mpo_events_tova.0003.a.tt.failure: "Tvůj podvod je odhalen a [unruly_province_owner.GetTitledFirstName] se dozví o tvém jednání"
 mpo_events_tova.0003.b: "„Takový trest neodpovídá jejich provinění.“"
 mpo_events_tova.0003.b.tt: "Pokusíš se kata přesvědčit, aby vězňům ušetřil život."
 mpo_events_tova.0003.b.tt.success: "Přesvědčíš kata, aby vězně propustil"
 mpo_events_tova.0003.b.tt.failure: "Nepodaří se ti kata přesvědčit a [unruly_province_owner.GetTitledFirstName] bude tvým vměšováním pobouřen"
 mpo_events_tova.0003.c: "Mám namířeno jinam. Pokračujeme v cestě."
 mpo_events_tova.0003.c.tt: "Za své hanebné činy si zaslouží spravedlivý trest!"
 mpo_events_tova.0004.t: "Nestoudná nevěrnost"
 mpo_events_tova.0004.desc: "Večerní šero prozařuje světlo praskajícího ohně, kolem něhož společně večeří skupina mých vojáků umístěných v této oblasti.\n\n„I když zavřu oči a zacpu si nos, mám co dělat, abych tenhle blaf vůbec spolkl! Už mám po krk té břečky! A taky přehrabování ve shnilém obilí, abych vůbec našel něco k jídlu!“\n\nTakto promlouvá muž, který je zřejmě velitelem skupiny, soudě podle souhlasného povzbuzování a srdečných poplácávání po ramenou, jichž se mu od ostatních dostává."
 mpo_events_tova.0004.a: "Přísnější příděly je naučí kázni."
 mpo_events_tova.0004.a.flavor: "Snad nespokojení vojáci nesáhnou k nějakým zoufalým činům..."
 mpo_events_tova.0004.a.tt: "Prodáš část armádních zásob."
 mpo_events_tova.0004.b: "Nechám tomu vůdci srazit hlavu."
 mpo_events_tova.0004.b.tt: "Mladý buřič je na místě zabit."
 mpo_events_tova.0004.c: "Zaplatím za lepší zásoby."
 mpo_events_tova.0005.t: "Spokojení vojáci"
 mpo_events_tova.0005.desc: "Přede mnou stoupá k nebi sloup kouře a už zdálky ke mně doléhá příjemná vůně pečené zvěřiny. Vydám se za ní a narazím na skupinu svých vojáků, kteří si pochutnávají hned na třech křepelkách.\n\n„Na takový život bych si dokázal zvyknout,“ prohlásí nejhlučnější z nich. „Ten klid a mír člověku prospívá na duši. A kamkoli přijdeme, sedláci mají jídla na rozdávání. Máme štěstí, že žijeme v tak pokojných časech a že se [ROOT.Char.GetTitleTierName|l] o svůj lid tak dobře stará.“"
 mpo_events_tova.0005.a: "Z těch lenochů zase vyženu pohodlnost!"
 mpo_events_tova.0005.b: "Potrestám je za nedostatečnou ostražitost."
 mpo_events_tova.0005.c: "Jejich spokojenost a laskavá slova mě těší."
 mpo_events_tova.0006.t: "Zasloužená odplata"
 mpo_events_tova.0006.desc: "Přináším znepokojivé zprávy, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]. Tví vojáci přepadli a vypálili sýpky v [maa_province.GetCounty.Custom('CZ_LandedName_L')]. Běsnili kvůli prázdným žaludkům a troufali si pronášet zrádná obvinění, že jsi je [Select_CString(ROOT.Char.IsFemale,'donutila','donutil')] krást a plenit, aby si vůbec opatřili každodenní chléb.\n\nNěkteří uprchli do okolní pustiny. Ty, kteří neutekli, na místě pobili vojáci, kteří ti zůstali věrní. Zdá se, že hlad dokáže dohnat člověka k zoufalým činům."
 mpo_events_tova.0006.a: "Ti prašiví psi!"
 mpo_special_flavor_events.0001.t: "Step nekonečných vod"
 mpo_special_flavor_events.0001.desc: "O moři jsem slýchal mnoho příběhů. O jeho kráse i hrůzách, které skrývá, a o tom, jak v obojím předčí dokonce i samotnou step. Dnes poprvé spatřuji tu nesmírnou vodní pláň na vlastní oči.\n\nKonečně chápu onen zvláštní lesk v očích vypravěčů, kteří marně hledali slova, jimiž by popsali nekonečné vody. Posadím se a hledím k obzoru, kde se známá jasná Tengriho obloha něžně dotýká modré hladiny.\n\nNa tváři cítím jemné pohlazení slaného mořského oparu. Uši mi naplňuje poklidný rytmus vln. Klid moře je tak podmanivý, že mě alespoň na okamžik zcela pohltí."
 mpo_special_flavor_events.0001.a: "Taková nádhera..."
 mpo_special_flavor_events.0001.b: "Myslím, že tu ještě nějakou chvíli zůstanu."
 mpo_events_tova.0025.t: "Střelba hlezenními kůstkami"
 mpo_events_tova.0025.desc: "Už zdálky slyším známé pokřikování soutěžících a #EMP – PRÁSK!#! – rachot kostěných hracích kamenů narážejících do dřevěného terče. Teprve potom ke mně přistoupí [challenger_anda.GetTitledFirstName], [Select_CString(challenger_anda.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('challenger_anda'))], s oním důvěrně známým vyzývavým zábleskem v očích.\n\n„Co ty na to? Spojíme síly a zahrajeme si jedno kolo [Glossary( 'šagaje', 'SHAGAI_GLOSS' )]?“"
 mpo_events_tova.0025.a: "Přelstíme naše soupeře."
 mpo_events_tova.0025.a.tt.success: "Díky vynikající taktice vyhraješ hru"
 mpo_events_tova.0025.a.tt.failure: "Tvůj důvtip se ukáže jako nedostatečný"
 mpo_events_tova.0025.b: "Rozdrtím hrací kameny našich soupeřů!"
 mpo_events_tova.0025.b.tt.success: "Díky své síle vyhraješ hru"
 mpo_events_tova.0025.b.tt.failure: "Tvá síla se ukáže jako nedostatečná"
 mpo_events_tova.0025.c: "Dnes ne, příteli."
 mpo_sharp_wits_modifier: "Bystrý důvtip"
 mpo_sharp_wits_modifier.desc: "Tato postava si při taktické hře s hlezenními kůstkami bystří smysly a zdokonaluje svůj důvtip."
 mpo_thunder_knuckles_modifier: "Hromové kůstky"
 mpo_thunder_knuckles_modifier.desc: "Tato postava vrhá hrací kůstky silou, která připomíná mohutné zahřmění."
 mpo_events_tova.0030.t: "Vznešené vidění"
 mpo_events_tova.0030.desc: "Slunce sotva začíná barvit obzor, když ke mně přispěchá [visionary.GetTitledFirstName], [Select_CString(visionary.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visionary'))]. Tváře má zardělé vzrušením a oči mu planou.\n\n„[ROOT.Char.GetTitleTierName|U], musím se s tebou podělit o vidění, které se mi zjevilo ve snu!“ zvolá. „[Select_CString(visionary.IsFemale,'Viděla','Viděl')] jsem "
 mpo_events_tova.0030.desc_red: "rudého vola se zvonky na rozích, jak pohazuje hlavou ze strany na stranu. Hlasitě zabučel, "
 mpo_events_tova.0030.desc_white: "bílého levharta, jak seskakuje z oblak a drápy vyrývá hluboké brázdy do písku. Hrozivě zavrčel, "
 mpo_events_tova.0030.desc_green: "zeleného kohouta, jak běží po slunečních paprscích a třepetá křídly. Mocně zakokrhal, "
 mpo_events_tova.0030.desc_outro: "že [ROOT.Char.GetTitledFirstNameNoTooltip] je [Select_CString(ROOT.Char.IsFemale,'předurčena','předurčen')] vládnout nebi i zemi!“"
 mpo_events_tova.0030.a: "Nebesa tě skutečně obdařila výjimečným nadáním!"
 mpo_events_tova.0030.b: "Nebesa jistě přejí mně i mým činům."
 mpo_events_tova.0030.c: "Pěkný příběh."
 mpo_heavens_favor_modifier: "Přízeň nebes"
 mpo_heavens_favor_modifier.desc: "Příznivá vidění dodávají této postavě odvahu a sebedůvěru."
 mpo_heavens_favor_martial_modifier: "$mpo_heavens_favor_modifier$"
 mpo_heavens_favor_martial_modifier.desc: "$mpo_heavens_favor_modifier.desc$"
 mpo_heavens_favor_diplo_modifier: "$mpo_heavens_favor_modifier$"
 mpo_heavens_favor_diplo_modifier.desc: "$mpo_heavens_favor_modifier.desc$"
 mpo_events_tova.0035.t: "Muž z hory"
 mpo_events_tova.0035.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('distressed_anda'))] [distressed_anda.GetTitledFirstName] prudce odhrne plstěný závěs a vrazí do mé jurty. Hruď se mu prudce zvedá potlačovaným rozhořčením.\n\n„Tak si to poslechni!“ vyhrkne. „[pregnant_woman.GetTitledFirstName|U] čeká dítě a já jsem si jistý, že není moje!“\n\n„Když jsem ji s tím konfrontoval, začala mi vyprávět, že se jí zdálo o medvědovi, který sestoupil z vysoké hory. Ta bestie se prý proměnila v kouř, jenž nabyl podoby muže, a potom se jí usadil na břiše. Následujícího rána pocítila první známky těhotenství.“"
 mpo_events_tova.0035.a: "Raduj se! Nebesa ti seslala dítě."
 mpo_events_tova.0035.a.tt: "Dítě se může narodit s pozoruhodnou dovedností"
 mpo_events_tova.0035.b: "Krmí tě jen samými lžemi."
 mpo_events_tova.0035.c: "Nic směšnějšího jsem v životě neslyšel!"
 mpo_events_tova.0045.t: "Drahocenný přítel"
 mpo_events_tova.0045.desc: "„[Select_CString(ROOT.Char.IsFemale,'Má paní','Můj pane')], naše přátelství je pevnější než beraní šíje. Přesto ti chci věnovat dar jako důkaz své neochvějné věrnosti,“ pronese [generous_anda.GetTitledFirstName], [Select_CString(generous_anda.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('generous_anda'))], zatímco společně sedíme u hřejivého táborového ohně.\n\n"
 mpo_events_tova.0045.desc_knucklebone: "Sáhne do kapsy a vytáhne malý váček. Když jej otevře, odhalí hrací kůstku [Glossary( 'šagaj', 'SHAGAI_GLOSS' )] zatíženou mědí. Potom pokračuje: „S touto kůstkou jsem vyhrál mnoho soutěží a jsem si jistý, že přinese štěstí i tobě.“"
 mpo_events_tova.0045.desc_herd: "Pokyne směrem ke vzdáleným pastvinám, kde se pasou ovce, a pokračuje: „Přivedl jsem ti stádo ovcí, které jsem vyhrál při hře [Glossary( 'šagaj', 'SHAGAI_GLOSS' )]. Kéž poskytne obživu tobě i celé tvé rodině.“"
 mpo_events_tova.0045.desc_axe: "Odhalí nádherně vyleštěnou válečnou sekeru, jejíž ostří je nepochybně stejně dokonalé jako její vzhled. Potom pokračuje: „Tuto zbraň jsem získal v naší poslední společné bitvě. Vyrval jsem ji z chladného sevření mrtvého nepřítele.“"
 mpo_events_tova.0045.a: "Děkuji ti za tento štědrý dar."
 mpo_events_tova.0045.a.equipped_tt: "Získáš [gift.GetName]"
 mpo_events_tova.0045.b: "Tvé přátelství je jediným darem, který potřebuji."
 gifted_bone_name: "Mědí zatížená hrací kůstka"
 gifted_bone_desc: "Ovčí hlezenní kůstka vykládaná mědí, určená ke hře s hlezenními kůstkami."
 gifted_axe_name: "Sekera dobyvatele"
 gifted_axe_desc: "Dokonale vyvážená válečná sekera."
