l_polish:
 mpo_bb_events.0001.t: "Přátelské poměření sil"
 mpo_bb_events.0001.desc: "Na obzoru zahlédnu osamělého jezdce, který se ke mně blíží. Vždyť je to [Select_CString(my_blood_brother.IsFemale,'má pokrevní sestra','můj pokrevní bratr')], [ROOT.Char.Custom2('RelationToMe', my_blood_brother)] [my_blood_brother.GetTitledFirstName]!\n\nSesedne z koně a obrátí se ke mně s vážným výrazem ve tváři.\n\nPotom se přikrčí, zaujme pevný postoj a natáhne ruce před sebe. Není pochyb, že mě vyzývá k zápasu.\n\n„Co říkáš na malé poměření sil, [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')]?“"
 mpo_bb_events.0001.a: "#italic Ukážu ti sílu [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_G')]!#!"
 mpo_bb_events.0001.b: "Místo zápasu nabídnout přátelské objetí."
 mpo_bb_events.0001.c: "Podrazit [my_blood_brother.Custom('CZ_TitledFirstName_D')] nohy!"
 mpo_bb_events.0001.a.tt_success: "Zvítězíš"
 mpo_bb_events.0001.a.tt_failure: "Prohraješ"
