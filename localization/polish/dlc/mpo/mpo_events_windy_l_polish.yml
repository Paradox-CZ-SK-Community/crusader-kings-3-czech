l_polish:
 mpo_bb_events.0001.t: "Přátelská šarvátka"
 mpo_bb_events.0001.desc: "Za horizontem zahlédnu blížícího se osamělého jezdce. Je to můj bratr v krvi a drahý [my_blood_brother.Custom2('RelationToMe', ROOT.Char )] [my_blood_brother.GetTitledFirstName]! \n\n[my_blood_brother.GetSheHe|U] sesedá z koně a postaví se přede mě s vážným výrazem na [Select_CString(my_blood_brother.IsFemale,'její','jeho')] tváři. \n\n[my_blood_brother.GetSheHe|U] zaujímá nízký postoj s [Select_CString(my_blood_brother.IsFemale,'jejími','jeho')] pažemi nataženými. To je bezpochyby výzva k zápasu.\n\n„Co řekneš na malý zápas, [ROOT.Char.GetFirstNameNoTooltip]?“"
 mpo_bb_events.0001.a: "#italics Ukážu ti sílu [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] #!!"
 mpo_bb_events.0001.b: "Místo toho natáhni paže k objetí."
 mpo_bb_events.0001.c: "Podrazit [Select_CString(my_blood_brother.IsFemale,'její','jeho')] nohy!"
 mpo_bb_events.0001.a.tt_success: "[Select_CString(ROOT.Char.IsFemale,'Vyhrála','Vyhrál')] jsi"
 mpo_bb_events.0001.a.tt_failure: "[Select_CString(ROOT.Char.IsFemale,'Prohrála','Prohrál')] jsi"
