l_polish:
 feast_type_tsagaan_sar: "Cagán sar"
 feast_type_tsagaan_sar_desc: "$EFFECT_LIST_BULLET$ Během závěrečného přípitku můžeš získat dary v podobě [Concept('herd','stád')|E] a [Concept('gold','zlata')|E]\n$EFFECT_LIST_BULLET$ Události nabídnou příležitosti ke zlepšení [Concept('opinion','mínění')|E]\n$EFFECT_LIST_BULLET$ Některé možnosti ti umožní snížit [Concept('stress','stres')|E]\n\n#weak Vychází nový Bílý měsíc – radujme se!#!"
 feast_type_tsagaan_sar_valid_tt: "V posledních 5 letech jsi [Select_CString(ROOT.Char.IsFemale,'uspořádala','uspořádal')] slavnost Cagán sar v rámci aktivity [GetActivityType('activity_feast').GetName]"
 feast_type_tsagaan_sar_valid_tt_time: "Slavnost Cagán sar lze pořádat pouze od ledna do března"
 feast_tsagaan_sar_events.0001.t: "Noc před námi"
 feast_tsagaan_sar_events.0001.desc: "Před jurtami tábora se shromažďují koně. Jejich jezdci je naposledy pohladí, než se vydají mezi ostatní hosty. Mládež dovádí, hraje na honěnou a tropí žerty svým starším. Všichni jsou oděni do zářivě bílých šatů, jejichž čerstvě ušité tuniky jsou stejně nové jako rok, který právě začíná.\n\nZatímco [ROOT.Char.Custom('GetWomenOrMenBasedOnFaith')|l] se pošťuchují a zápasí, ve vzduchu vládne pokojná nálada. Drobné potyčky a sázky jen upevňují jejich vzájemné bratrství. [ROOT.Char.Custom('GetWomenOrMenBasedOnFaithOpposite')|U] připravují slavnostní tabule a ke mně doléhá vůně skopového masa.\n\nNa tuto hostinu se bude dlouho vzpomínat – pokud ovšem věnuji náležitou pozornost..."
 feast_tsagaan_sar_events.0001.a: "...truhlicím plným mincí, které dostanu."
 feast_tsagaan_sar_events.0001.a_tt: "Zvýší se pravděpodobnost, že od hostů získáš [Concept('gold','zlato')|E]"
 feast_tsagaan_sar_events.0001.b: "...všem drobným darům a příběhům, které se k nim vážou."
 feast_tsagaan_sar_events.0001.b_tt: "Zvýší se pravděpodobnost, že od hostů získáš [Concept('artifacts','artefakty')|E]"
 feast_tsagaan_sar_events.0001.c: "...hostům. Bez nich by slavnost za mnoho nestála."
 feast_tsagaan_sar_events.0001.c_tt: "Zvýší se pravděpodobnost, že od hostů získáš [Concept('hook','páku')|E]"
 feast_tsagaan_sar_events.0001.d: "...tomu, aby nám [ROOT.Char.GetFaith.HighGodName] v novém roce požehnal."
 feast_tsagaan_sar_events.0001.d_tt: "Zvýší se pravděpodobnost, že od hostů získáš [Concept('piety','zbožnost')|E]"
 feast_tsagaan_sar_events.0001.e: "...jídlu!"
 feast_tsagaan_sar_events.0001.f: "...samotné oslavě!"
 feast_tsagaan_sar_events.0001_none: "Žádný z tvých [Concept('activity_guests','hostů aktivity')|E] tě letos nemohl ničím obdarovat"
 feast_tsagaan_sar_events.0001_tt: "#V [gifters_list_size]#! hostů tě #p obdaruje#!"
 feast_tsagaan_sar_events.0002.t: "Příprava daru"
 feast_tsagaan_sar_events.0002.desc: "Slavnosti již začaly, a přestože si vážím pozvání od [host.Custom('CZ_Name_G')], přemýšlím, jaký dar bych [Select_CString(host.IsFemale,'jí','mu')] měl věnovat. Nejde jen o dodržení tradice, ale především o čest.\n\nPozoruji jiné šlechtice, jak přinášejí truhlice plné cizích mincí, zatímco sedláci nesou malé váčky s cennostmi. Další hosté přivádějí koně a pečlivě je hřebelcují, aby byli připraveni na setkání se svými novými majiteli. Někteří nabízejí dary, kterých se nelze dotknout, a skládají drahocenné přísahy věrnosti.\n\nCo však mohu darovat já? Vždyť oslavu pořádá [Select_CString(host.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))] [host.GetFirstNameNoTooltip]!"
 feast_tsagaan_sar_events.0002.desc_again: "Znovu musím přemýšlet, jak projevit úctu [host.Custom('CZ_Name_D')]. Mohl bych také nedat vůbec nic a doufat, že [host.GetSheHe] tomu nebude přikládat význam. Anebo ještě lépe, že si toho ani nevšimne.\n\nČas se však krátí a možná je to má poslední příležitost nějaký dar připravit."
 feast_tsagaan_sar_events.0002.nothing_arrogant: "Má přítomnost je sama o sobě dostatečným darem."
 feast_tsagaan_sar_events.0002.nothing_fickle: "Nemohl bych se rozhodnout později?"
 feast_tsagaan_sar_events.0002.nothing: "Zdá se, že nemám co darovat..."
 feast_tsagaan_sar_events.0002.herd_1: "Několik ovcí jistě přijde vhod."
 feast_tsagaan_sar_events.0002.herd_2: "Jednoho koně mohu postrádat..."
 feast_tsagaan_sar_events.0002.herd_3: "Skot, nebo ovce? Co jen vybrat?"
 feast_tsagaan_sar_events.0002.herd_4: "Mé stádo by nakonec mohlo být vhodným darem."
 feast_tsagaan_sar_events.0002.herd_tt: "Vybereš, jak velkou část svého [herd_i][Concept('herd','stáda')|E] věnuješ [host.Custom('CZ_Name_D')]"
 feast_tsagaan_sar_events.0002.gold_1: "Snad mohu nějaké mince postrádat."
 feast_tsagaan_sar_events.0002.gold_2: "Měšec zlata bude stačit!"
 feast_tsagaan_sar_events.0002.gold_3: "Rád se o své bohatství podělím s [host.Custom('CZ_FirstNameNoTooltip_I')]!"
 feast_tsagaan_sar_events.0002.gold_tt: "Vybereš, kolik [gold_i][Concept('gold','zlata')|E] věnuješ [host.Custom('CZ_Name_D')]"
 feast_tsagaan_sar_events.0002.artifact: "S jedním ze svých předmětů se mohu rozloučit."
 feast_tsagaan_sar_events.0002.artifact_tt: "Vybereš [Concept('artifact','artefakt')|E], který věnuješ [host.Custom('CZ_Name_D')]"
 feast_tsagaan_sar_events.0002.loyalty: "Má věrnost je tím největším darem."
 feast_tsagaan_sar_events.0002.prestige: "Budu o [host.Custom('CZ_Name_L')] šířit chválu!"
 feast_tsagaan_sar_events.0002.prestige_tt: "Budeš šířit zvěsti o vznešenosti [host.Custom('CZ_FirstNameNoTooltip_G')], čímž [Select_CString(host.IsFemale,'jí','mu')] věnuješ část své [prestige_i][Concept('prestige','prestiže')|E]"
 feast_tsagaan_sar_events.0002.blessing: "Kéž [host.GetFaith.HighGodName] požehná [host.Custom('CZ_Name_D')]. Postarám se o to."
 feast_tsagaan_sar_events.0002.blessing_tt: "Vyprosíš požehnání pro [host.Custom('CZ_FirstNameNoTooltip_A')] a věnuješ [Select_CString(host.IsFemale,'jí','mu')] část své [piety_i][Concept('piety','zbožnosti')|E]"
 feast_tsagaan_sar_events.0002.nothing_important: "@warning_icon! #warning Protože pro [host.Custom('CZ_FirstNameNoTooltip_A')] hodně znamenáš, absence daru [Select_CString(host.IsFemale,'ji','ho')] urazí.#!"
 feast_tsagaan_sar_events.0002.nothing_tt: "Protože nemáš co nabídnout, [host.GetFirstNameNoTooltip] ti to nebude mít za zlé."
 feast_tsagaan_sar_events.0002.nothing_unimportant: "@warning_icon! #warning Přestože pro [host.Custom('CZ_FirstNameNoTooltip_A')] nejsi nijak důležitý, může se [Select_CString(host.IsFemale,'jí','ho')] dotknout, že nepřineseš žádný dar.#!"
 feast_tsagaan_sar_events.0003.herd: "Mé stádo bude pro [host.Custom('CZ_Name_A')] velkolepým darem. Poddaní budou vzkvétat, až budou putovat stepí a na mých koních vyrážet do bitev. Přesto zbývá jedna otázka: kolik dobytka mohu postrádat?"
 feast_tsagaan_sar_events.0003.gold: "Mince mají cenu všude a [host.GetName] by se mnou jistě souhlasil. Mé pokladnice však nejsou bezedné a nemohu rozdat úplně všechno."
 feast_tsagaan_sar_events.0003.prestige: "Poddaní považují [host.Custom('CZ_Name_A')] za [host.Custom('ComplimentAdjective')|l] a já chci toto mínění šířit dál."
 feast_tsagaan_sar_events.0003.piety: "[host.GetFaith.HighGodName|U] jistě zahrne [host.Custom('CZ_Name_A')] svou přízní. V myšlenkách se obrátím k místu, kde čeká [host.GetFaith.PositiveAfterLife], a v modlitbě připomenu dobré skutky [host.Custom('CZ_FirstNameNoTooltip_G')]."
 feast_tsagaan_sar_events.0003.minor.herd: "Jeden kůň by mohl stačit."
 feast_tsagaan_sar_events.0003.minor.herd_2: "Možná jedna nebo dvě ovce."
 feast_tsagaan_sar_events.0003.medium.herd: "Několik stád dobytka by mělo postačit."
 feast_tsagaan_sar_events.0003.medium.herd_2: "Celé stádo koní, dost pro [Select_CString(host.IsFemale,'její','jeho')] rodinu."
 feast_tsagaan_sar_events.0003.major.herd: "[host.GetFirstNameNoTooltip|U] bude mít tolik dobytka, že se stáda potáhnou na míle daleko!"
 feast_tsagaan_sar_events.0003.minor.gold: "Pár mincí [Select_CString(host.IsFemale,'jí','mu')] snad mohu věnovat."
 feast_tsagaan_sar_events.0003.minor.gold_2: "Malý měšec bude stačit."
 feast_tsagaan_sar_events.0003.medium.gold: "Celou truhlici pro [host.Custom('CZ_TitleAsNameNoTooltip_A')]!"
 feast_tsagaan_sar_events.0003.medium.gold_2: "[host.GetSheHe|U] si zaslouží víc než pouhou hrst mincí."
 feast_tsagaan_sar_events.0003.major.gold: "Kéž pokladnice [host.Custom('CZ_FirstNameNoTooltip_G')] přetéká bohatstvím!"
 feast_tsagaan_sar_events.0003.minor.prestige: "Můj lid se dozví o [host.Custom('CZ_FirstNameNoTooltip_L')]."
 feast_tsagaan_sar_events.0003.medium.prestige: "Budu o [Select_CString(host.IsFemale,'ní','něm')] zpívat oslavné písně!"
 feast_tsagaan_sar_events.0003.major.prestige: "Jméno [host.Custom('CZ_FirstNameNoTooltip_G')] se ponese po celé zemi a [ROOT.Char.GetFaith.PositiveAfterLife] jím bude znít také!"
 feast_tsagaan_sar_events.0003.minor.piety: "Vím, že [host.GetFirstNameNoTooltip] je [host.GetFaith.GetAdherentName|l] tělem i duší!"
 feast_tsagaan_sar_events.0003.medium.piety: "Mé modlitby zajistí, že [host.GetFaith.PositiveAfterLife] jednou přivítá [host.Custom('CZ_FirstNameNoTooltip_A')]."
 feast_tsagaan_sar_events.0003.major.piety: "Jméno [host.Custom('CZ_FirstNameNoTooltip_G')] budou znát všichni [host.GetFaith.GetAdherentNamePlural|l]!"
 feast_tsagaan_sar_events.0002.choose: "Možná bych měl vybrat něco jiného."
 feast_tsagaan_sar_events.0002.choose_tt: "Vybereš jiný dar pro [host.Custom('CZ_Name_A')]"
 feast_tsagaan_sar_events.0002.none: "Vlastně [host.Custom('CZ_FirstNameNoTooltip_D')] nedám vůbec nic."
 feast_tsagaan_sar_events.0004.desc: "Naštěstí nemám své zásoby úplně prázdné a [host.GetTitledFirstName] by jistě [Select_CString(host.IsFemale,'dokázala','dokázal')] některý z mých předmětů dobře využít.\n\nOtázkou však zůstává, který z nich by [Select_CString(host.IsFemale,'nejvíce ocenila','nejvíce ocenil')]. Anebo bych se mohl jednoduše zbavit toho, který mi samotnému slouží nejméně..."
 feast_tsagaan_sar_events.0004.a: "[artifact_1.GetName|U] bude ten pravý dar!"
 feast_tsagaan_sar_events.0004.b: "[artifact_2.GetName|U] mi stejně k ničemu není..."
 feast_tsagaan_sar_events.0004.c: "[artifact_3.GetName|U] může přejít do nových rukou!"
 feast_tsagaan_sar_events.0100.t: "Ztracený dar"
 feast_tsagaan_sar_events.0100.desc: "Přistoupí ke mně [gift_collector.GetName], [Select_CString(gift_collector.IsFemale,'dvořanka','dvořan')] [host.Custom('CZ_Name_G')].\n\n„Zdravím tě, [ROOT.Char.Custom('ComplimentAdjective')|l] [host.Custom('CZ_TitleAsNameNoTooltip_V')]. Dosud jsme neobdrželi tvůj dar pro [host.Custom('CZ_TitledFirstNameNoTooltip_A')],“ oznámí mi [gift_collector.GetFirstNameNoTooltip]. „Snad jsi nepřišel s prázdnýma rukama!“ dodá žertem.\n\n„Co to má znamenat?“ ohradím se. „Vždyť už jsem přece věnoval [ROOT.Char.Custom('GetTsagaanSarGiftDesc')|l]! Copak to [host.Custom('CZ_FirstNameNoTooltip_D')] nestačí?“\n\n[gift_collector.GetFirstNameNoTooltip|U] si povzdechne. „Možná se na tvůj dar při zapisování zapomnělo?“"
 feast_tsagaan_sar_events.0100.a: "Vyberu [Select_CString(host.IsFemale,'jí','mu')] jiný dar."
 feast_tsagaan_sar_events.0100.b: "Snad mohu postrádat ještě o něco víc..."
 feast_tsagaan_sar_events.0100.c: "Zdá se, že tentokrát nedostane vůbec nic!"
 feast_tsagaan_sar_events.0100.c_paranoid: "Prý se ztratil? Tomu ani trochu nevěřím."
 feast_tsagaan_sar_events.0101.t: "Nádherná klisna"
 feast_tsagaan_sar_events.0101.desc: "Na druhé straně louky zahlédnu nádherného koně. Je to klisna se srstí bílou jako měsíc. Díky své dlouhé, splývavé hřívě a očím zářivým jako hvězdy se její krása vyrovná i těm nejpůvabnějším dívkám.\n\n[Select_CString(horse_haver.IsFemale,'Jezdkyně','Jezdec')] [horse_haver.GetName] si všimne mého obdivného pohledu.\n\n„Vidím, že máš dobré oko,“ pronese [horse_haver.GetFirstNameNoTooltip]. „Jestli chceš, můžeš se na ní krátce projet. Ale dávej pozor. Je to pěkná divoška.“"
 feast_tsagaan_sar_events.0101.a: "Tvou nabídku rád přijmu."
 feast_tsagaan_sar_events.0101.b: "Zajímal by mě nějaký #EMP trvalejší#! způsob, jak ji získat."
 feast_tsagaan_sar_events.0101.b.success: "[horse_haver.GetFirstNameNoTooltip|U] souhlasí s prodejem klisny"
 feast_tsagaan_sar_events.0101.b.failure: "[horse_haver.GetFirstNameNoTooltip|U] se s klisnou nechce rozloučit"
 feast_tsagaan_sar_events.0101.b.duel: "Požádáš [horse_haver.Custom('CZ_FirstNameNoTooltip_A')], aby ti klisnu [Select_CString(horse_haver.IsFemale,'prodala','prodal')]"
 feast_tsagaan_sar_events.0101.c: "Jistě, jen na „krátkou“ projížďku."
 feast_tsagaan_sar_events.0101.c.duel: "Během projížďky se pokusíš klisnu ukrást"
 feast_tsagaan_sar_events.0101.c.success: "Ujedeš z dohledu [horse_haver.Custom('CZ_FirstNameNoTooltip_G')]"
 feast_tsagaan_sar_events.0101.c.failure: "[horse_haver.GetFirstNameNoTooltip|U] tě dostihne"
 rival_stole_my_horse: "[CZProDrop(CHARACTER,'ukradla','ukradl')|U] [TARGET_CHARACTER.Custom('CZ_ShortUIName_D')] milovaného koně."
 rival_stole_my_horse_corresponding: "[CZProDrop(TARGET_CHARACTER,'ukradla','ukradl')|U] [CHARACTER.Custom('CZ_ShortUIName_D')] milovaného koně."
 feast_tsagaan_sar_events.0200.t: "Hra šagaj"
 feast_tsagaan_sar_events.0200.desc: "„Zdravím tě, [ROOT.Char.GetFirstNameNoTooltip]!“ zavolá na mě [gambler.GetName]. „Vidím, že máš chvilku volna. Co kdybychom si zahráli [Glossary( 'šagaj', 'SHAGAI_GLOSS' )]?“ navrhne a nasype si do dlaně několik hlezenních kůstek.\n\nPosadí se na zem se zkříženýma nohama a pokyne mi, abych učinil totéž. [gambler.GetFirstNameNoTooltip|U] mi připomene pravidla a pak se začneme střídat v házení kůstkami."
 ts_wager: "Vsadíš [gold_i]"
 feast_tsagaan_sar_events.0200.a: "Co by to bylo za zábavu bez rizika?"
 feast_tsagaan_sar_events.0200.a_tt: "$ts_wager$#V [GetPlayer.MakeScope.ScriptValue('medium_gold_value')]#!"
 feast_tsagaan_sar_events.0200.b_tt: "$ts_wager$#V [GetPlayer.MakeScope.ScriptValue('minor_gold_value')]#!"
 feast_tsagaan_sar_events.0200.c_tt: "$ts_wager$#V [GetPlayer.MakeScope.ScriptValue('tiny_gold_value')]#!"
 feast_tsagaan_sar_events.0200.b: "Mohu vsadit o něco víc než jen pár drobných."
 feast_tsagaan_sar_events.0200.c: "Vsadím jen nepatrnou část svého bohatství."
 feast_tsagaan_sar_events.0200.d_content: "Nemám potřebu hazardovat."
 feast_tsagaan_sar_events.0200.d: "Ne, ale děkuji za nabídku."
 feast_tsagaan_sar_events.0200_lose: "Prohraješ hru"
 feast_tsagaan_sar_events.0200_win: "Vyhraješ hru"
 friend_played_party_games: "[CHARACTER.GetShortUIName|U] se s [TARGET_CHARACTER.Custom('CZ_ShortUIName_I')] sblížili při hazardních hrách."
 friend_played_party_games_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] se s [CHARACTER.Custom('CZ_ShortUIName_I')] sblížili při hazardních hrách."
 SHAGAI_GLOSS: "#bold Šagaj#! je věštecká hra hraná s hlezenními kůstkami ovcí nebo koz. Kůstky se házejí podobně jako kostky a mohou dopadnout na jednu ze čtyř stran, které představují koně, ovci, velblouda a kozu. Kůň a velbloud jsou považováni za šťastná znamení, zatímco ovce a koza nikoli."
 feast_tsagaan_sar_events.0210.t: "Moudrost pastevce"
 feast_tsagaan_sar_events.0210.desc: "Rodiny se shromažďují kolem ohňů a slavnostních stolů, dělí se o jídlo a vyprávějí si příběhy. Vedle mě sedí [herder.GetName], zkušený znalec chovu ovcí. Nakloní se ke mně a ukáže na veliké stádo v dálce.\n\n„Tyhle jsou moje,“ pronese [herder.GetFirstNameNoTooltip]. „Letos je věnuji jako dar pro [ROOT.Char.GetInvolvedActivity.GetHost.Custom('CZ_TitleAsNameNoTooltip_A')].“\n\nZahledím se na ovce a pozoruji, jak se pokojně pasou. Jejich ohromné množství ve mně vzbuzuje úžas. Možná bych se měl [herder.Custom('CZ_FirstNameNoTooltip_G')] zeptat, jak se správně starat o vlastní stádo."
 feast_tsagaan_sar_events.0210.a: "Zeptat se, jak se daří udržovat tak velké stádo."
 feast_tsagaan_sar_events.0210.tt: "Zaplatíš [herder.Custom('CZ_FirstNameNoTooltip_D')] za rady"
 feast_tsagaan_sar_events.0210.b: "Vyptat se na důmyslné způsoby chovu dobytka."
 feast_tsagaan_sar_events.0210.c: "Žádné rady nepotřebuji."
 feast_tsagaan_sar_events.0220.t: "Shledání se soupeřem"
 feast_tsagaan_sar_events.0220.desc: "Tváří v tvář se setkávám s [old_rival.Custom('CZ_Name_I')], [old_rival.Custom2('InsultAdjectiveArticle', ROOT.Char)|l] [Select_CString(old_rival.IsFemale,'potvorou','ničemou')].\n\n„Á... Vidím, že jsi tady, [ROOT.Char.GetFirstNameNoTooltip],“ ušklíbne se [old_rival.GetFirstNameNoTooltip]. „Doufám, že jsi nezapomněl na naši minulost a na všechna příkoří, která jsi mi způsobil.“\n\nZ těch slov jasně cítím přetrvávající napětí, ale můj dávný sok pokračuje klidným hlasem: „S příchodem nového roku tě žádám, abychom na naše vzájemné křivdy zapomněli.“"
 feast_tsagaan_sar_events.0220.a: "Souhlasím. Mír je tou nejlepší cestou vpřed."
 feast_tsagaan_sar_events.0220.b: "Ale můžeme zajít #EMP mnohem dál#!."
 feast_tsagaan_sar_events.0220.b_flavor: "Pod napětím dávného nepřátelství náhle přeskočí jiskra vášně."
 feast_tsagaan_sar_events.0220_win: "[old_rival.GetSheHe|U] tvé city opětuje"
 feast_tsagaan_sar_events.0220_lose: "[old_rival.GetSheHe|U] tvé city odmítne s odporem"
 feast_tsagaan_sar_events.0220.c: "Proč nezajít ve vzájemném odpuštění ještě dál?"
 feast_tsagaan_sar_events.0220.d_vengeful: "Dokud budeš naživu, nikdy!"
 feast_tsagaan_sar_events.0220.d: "Ne, to si nemyslím."
 friend_feast_rivalry: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] se během hostiny usmířili, odložili své soupeření stranou a stali se přáteli."
 feast_tsagaan_sar_events.0230.t: "Hlas měsíce"
 feast_tsagaan_sar_events.0230.desc_intro: "Kolem vzdálené jurty se shlukují hosté. Davem se šíří zvěsti o chystaném vystoupení, a tak se vydám za ostatními. Když dorazím, všechny pohledy se obrátí k [throat_singer.Custom('CZ_Name_D')]. Náhle se ozve hrdelní zpěv, jehož námětem je [throat_singer.Custom('GetRandomThroatSingingTheme')|l].\n\nZvuk připomíná"
 feast_tsagaan_sar_events.0230.desc_sygyt: "průzračné, vysoké hvízdání, podobné větru vanoucímu mezi stromy."
 feast_tsagaan_sar_events.0230.desc_hoomei: "bzučivý vítr, který postupně sílí v bouři nebo se nese vzdušným proudem za letícím ptákem."
 feast_tsagaan_sar_events.0230.desc_kargyraa: "hluboké hrdelní vrčení, podobné vzdálenému dunění bouře nebo medvědímu mručení."
 feast_tsagaan_sar_events.0230.desc_outro: "\n\n[observer.GetName|U] se ke mně otočí a zašeptá: „Ten zpěv ve stylu [throat_singer.Custom('GetThroatSingingStyle')|l] je opravdu působivý, nemyslíš?“\n\nSleduji, jak [throat_singer.GetSheHe] dokončuje první píseň a shromážděný dav propuká v potlesk."
 feast_tsagaan_sar_events.0230.a: "[throat_singer.GetFirstNameNoTooltip|U] má skutečný talent."
 feast_tsagaan_sar_events.0230.b: "Ještě by to chtělo trochu cviku..."
 feast_tsagaan_sar_events.0230.b_tt: "Vypískáš vystoupení [throat_singer.Custom('CZ_FirstNamePossessiveNoTooltip_N')], čímž [Select_CString(throat_singer.IsFemale,'ji','ho')] uvedeš do rozpaků"
 feast_tsagaan_sar_events.0230.c: "Možná se ke zpěvu také přidám."
 feast_tsagaan_sar_events.0230.d: "Ach, také bych se chtěl naučit zpívat ve stylu [throat_singer.Custom('GetThroatSingingStyle')|l]!"
 feast_tsagaan_sar_events.0230.d.duel: "Pokusíš se napodobit [Concept('throat_singing','hrdelní zpěv')|E] ve stylu [throat_singer.Custom('GetThroatSingingStyle')|l]"
 feast_tsagaan_sar_events.0230.d.success: "Tvůj pokus se zdaří"
 feast_tsagaan_sar_events.0230.d_tt: "Naučíš se techniku hrdelního zpěvu ve stylu [throat_singer.Custom('GetThroatSingingStyle')|l]"
 feast_tsagaan_sar_events.0230.d.failure: "Tvůj pokus se nezdaří, ale přesto se něco málo naučíš"
 feast_tsagaan_sar_events.0240.t: "Dar v podobě písně"
 feast_tsagaan_sar_events.0240.desc: "Při večerním popíjení a veselí zavede [audience.GetFirstName], [Select_CString(audience.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('audience'))], řeč na hrdelní zpěv. Letmo se zmíním o vlastních zkušenostech a [audience.GetFirstNameNoTooltip] se rozzáří širokým úsměvem.\n\n„Ty umíš zpívat ve stylu [ROOT.Char.Custom('GetThroatSingingStyle')|l]?“ zeptá se [audience.GetFirstNameNoTooltip]. „Moc rád bych si něco poslechl!“"
 feast_tsagaan_sar_events.0240.a: "Pak to tedy ber jako svůj dárek."
 feast_tsagaan_sar_events.0240.duel: "Předvedeš své pěvecké umění [audience.Custom('CZ_FirstNameNoTooltip_D')]"
 feast_tsagaan_sar_events.0240.duel_new: "Předvedeš své pěvecké umění [audience.Custom('CZ_FirstNameNoTooltip_D')] v novém stylu"
 feast_tsagaan_sar_events.0240.success: "[audience.GetFirstNameNoTooltip|U] je tvým nadáním [Select_CString(audience.IsFemale,'okouzlena','okouzlen')]"
 feast_tsagaan_sar_events.0240.ok: "Tvým vystoupením se ti podaří na [audience.Custom('CZ_FirstNameNoTooltip_A')] do jisté míry zapůsobit"
 feast_tsagaan_sar_events.0240.sygyt: "Už nějakou dobu chci vyzkoušet píseň ve stylu [Glossary( 'sygyt', 'SYGYT_GLOSS' )]..."
 feast_tsagaan_sar_events.0240.hoomei: "Co třeba zazpívat něco ve stylu [Glossary( 'chöömej', 'HOOMEI_GLOSS' )]?"
 feast_tsagaan_sar_events.0240.kargyraa: "Vlastně bych rád [Select_CString(ROOT.Char.IsFemale,'zkusila','zkusil')] zpívat ve stylu [Glossary( 'kargyraa', 'KARGYRAA_GLOSS' )]."
 feast_tsagaan_sar_events.0240.d_shy: "To jsem si [Select_CString(ROOT.Char.IsFemale,'měla','měl')] raději nechat pro sebe."
 feast_tsagaan_sar_events.0240.d: "Na vystupování před ostatními moc nejsem."
 feast_tsagaan_sar_events.0240.success_sygyt_tt: "Zapomeneš svůj dosavadní styl a naučíš se hrdelní zpěv ve stylu sygyt"
 feast_tsagaan_sar_events.0240.success_hoomei_tt: "Zapomeneš svůj dosavadní styl a naučíš se hrdelní zpěv ve stylu chöömej"
 feast_tsagaan_sar_events.0240.success_kargyraa_tt: "Zapomeneš svůj dosavadní styl a naučíš se hrdelní zpěv ve stylu kargyraa"
 SYGYT_GLOSS: "#bold Sygyt#! je styl hrdelního zpěvu, který často připomíná pískání nebo zvuk flétny. Vyznačuje se jasným, vysokým tónem a používá se k napodobování šumění větru či ptačího zpěvu."
 HOOMEI_GLOSS: "Nejrozšířenější styl hrdelního zpěvu, #bold chöömej#!, lze popsat jako bzučivý zvuk, který zpěvák obvykle vytváří ve střední hlasové poloze."
 KARGYRAA_GLOSS: "Hluboký, téměř hrdelně drsný styl zpěvu se nazývá #bold kargyraa#!. Využívá nepravé hlasivky a jeho zvuk bývá přirovnáván k vrčení divokého zvířete nebo dunění hromu."
 friend_throat_singing: "Společný hrdelní zpěv sblížil [CHARACTER.Custom('CZ_ShortUIName_A')] a [TARGET_CHARACTER.Custom('CZ_ShortUIName_A')]."
 rival_throat_singing: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'zesměšnila','zesměšnil')] hrdelní zpěv [TARGET_CHARACTER.Custom('CZ_ShortUIName_G')]."
 rival_throat_singing_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'zesměšnila','zesměšnil')] hrdelní zpěv [CHARACTER.Custom('CZ_ShortUIName_G')]."
 feast_tsagaan_sar_events.0250.t: "Jezdci z [CZProvName(ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation,'G')]"
 feast_tsagaan_sar_events.0250.desc: "Pastevec přivádí skupinu koní, jejichž srst se leskne v měsíčním světle. Hosté se kolem nich shromažďují a obdivují nádherná zvířata. [horse_rider_1.GetName|U] se nadšeně vrhá do sedla a [horse_rider_2.GetName] se vzápětí přidává.\n\n„Tak co, [horse_rider_1.GetFirstNameNoTooltip]? Ty proti mně!“ zavolá [horse_rider_2.GetFirstNameNoTooltip]. [horse_rider_1.GetFirstNameNoTooltip|U] se pobaveně zasměje. „Jen žádný spěch, [horse_rider_2.GetFirstNameNoTooltip]. Musíme si šetřit síly na závod!“\n\n[horse_rider_2.GetFirstNameNoTooltip|U] souhlasně přikývne. „Chce se k nám přidat ještě někdo další? Anebo si snad někdo chce vsadit?“"
 feast_tsagaan_sar_events.0250.a: "[horse_rider_1.GetFirstNameNoTooltip|U] určitě vyhraje!"
 feast_tsagaan_sar_events.0250.a_tt: "Vsadíš na vítězství [horse_rider_1.Custom('CZ_FirstNameNoTooltip_G')] v dostihu"
 feast_tsagaan_sar_events.0250.b: "[horse_rider_2.GetFirstNameNoTooltip|U] vypadá jako silný soupeř."
 feast_tsagaan_sar_events.0250.b_tt: "Vsadíš na vítězství [horse_rider_2.Custom('CZ_FirstNameNoTooltip_G')] v dostihu"
 feast_tsagaan_sar_events.0250.c: "Já vás oba porazím!"
 feast_tsagaan_sar_events.0250.c_tt: "Zapojíš se do dostihu"
 feast_tsagaan_sar_events.0250.d: "Budu se jen dívat."
 feast_tsagaan_sar_events.0250.after_tt: "Dostih začíná..."
 feast_tsagaan_sar_events.0251.desc_intro: "Jezdci jsou připraveni a dav netrpělivě čeká, jak závod dopadne. [horse_rider_1.GetName|U] i [horse_rider_2.GetName] už čekají na startu, zatímco ostatní hosté se chystají přihlížet.\n\n"
 feast_tsagaan_sar_events.0251.desc_watch: "Nasednu na nedalekého koně a pomalu vyjedu na kopec, odkud budu mít lepší výhled na závodní trať. Je odstartováno! Hosté nadšeně povzbuzují jezdce, kteří se tryskem ženou [ROOT.Char.GetCurrentLocation.Custom('CZ_GetTerrainType_In')|l]."
 feast_tsagaan_sar_events.0251.desc_race: "Když nasednu na koně, [horse_rider_1.GetFirstNameNoTooltip] i [horse_rider_2.GetFirstNameNoTooltip] po mně úkosem pohlédnou.\n\n„Ty pojedeš s námi?“ zeptá se [horse_rider_1.GetFirstNameNoTooltip]. „Přesně tak,“ odpovím a vzápětí vyrazíme vpřed, tryskem se ženeme [ROOT.Char.GetCurrentLocation.Custom('CZ_GetTerrainType_In')|l].\n\nJedeme bok po boku a já horečně přemýšlím, jak nad ostatními získat převahu."
 feast_tsagaan_sar_events.0251.a: "To jsou ale skvělí jezdci!"
 feast_tsagaan_sar_events.0251.b: "Stačí trochu vrazit do [horse_rider_1.Custom('CZ_FirstNameNoTooltip_G')]..."
 feast_tsagaan_sar_events.0251.b.duel: "Pokusíš se shodit [horse_rider_1.Custom('CZ_FirstNameNoTooltip_A')] z koně"
 feast_tsagaan_sar_events.0251.b_tt: "#p [horse_rider_1.GetFirstNameNoTooltip|U] je vyřazen z dostihu#!"
 feast_tsagaan_sar_events.0251.c: "[horse_rider_2.GetFirstNameNoTooltip|U] mi začíná být nebezpečně blízko..."
 feast_tsagaan_sar_events.0251.c.duel: "Pokusíš se shodit [horse_rider_2.Custom('CZ_FirstNameNoTooltip_A')] z koně"
 feast_tsagaan_sar_events.0251.c_tt: "#p [horse_rider_2.GetFirstNameNoTooltip|U] je vyřazen z dostihu#!"
 feast_tsagaan_sar_events.0251.success: "Úspěšně sabotuješ soupeřovu jízdu"
 feast_tsagaan_sar_events.0251.failure: "Nepodaří se ti soupeře vyřadit"
 feast_tsagaan_sar_events.0251.lose: "#n Jsi vyřazen z dostihu#!"
 feast_tsagaan_sar_events.0251.d: "Budu se prostě držet svého tempa."
 feast_tsagaan_sar_events.0251.d.knocked_out_1: "[horse_rider_1.GetFirstNameNoTooltip|U] nestačí držet tempo"
 feast_tsagaan_sar_events.0251.d.knocked_out_2: "[horse_rider_2.GetFirstNameNoTooltip|U] začíná zaostávat"
 feast_tsagaan_sar_events.0251.d.knocked_out_3: "Tvé tempo je příliš pomalé"
 feast_tsagaan_sar_events.0251.after_tt: "Dostih pokračuje..."
 feast_tsagaan_sar_events.0251.d_title: "Někdo je vyřazen z dostihu!"
 rival_cheated_horse_race: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'podváděla','podváděl')] při dostihu proti [TARGET_CHARACTER.Custom('CZ_ShortUIName_D')]."
 rival_cheated_horse_race_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'podváděla','podváděl')] při dostihu proti [CHARACTER.Custom('CZ_ShortUIName_D')]."
 feast_tsagaan_sar_events.0252.desc_knocked: "Sleduji, jak mě oba jezdci předjíždějí, a nedokážu potlačit závist. Vítězství mělo patřit mně, ale můj kůň jejich rychlosti nestačil."
 feast_tsagaan_sar_events.0252.desc_knocked_1: "Ohlédnu se a spatřím, jak [horse_rider_1.GetFirstNameNoTooltip] padá k zemi. V závodě tak zůstává už jen [horse_rider_2.GetFirstNameNoTooltip]. Jedeme bok po boku a hosté nás nadšeně povzbuzují."
 feast_tsagaan_sar_events.0252.desc_knocked_2: "Ohlédnu se a spatřím, jak [horse_rider_2.GetFirstNameNoTooltip] padá k zemi. V závodě tak zůstává už jen [horse_rider_1.GetFirstNameNoTooltip]. Jedeme bok po boku a hosté nás nadšeně povzbuzují."
 feast_tsagaan_sar_events.0252.desc_watch: "[horse_rider_1.GetFirstNameNoTooltip|U] a [horse_rider_2.GetFirstNameNoTooltip] jedou bok po boku a diváci napětím ani nedýchají. Cílová čára se rychle blíží a hosté oba jezdce hlasitě povzbuzují."
 feast_tsagaan_sar_events.0252.a: "Snad [final_opponent.GetFirstNameNoTooltip] nebude nic namítat, když vyhraji..."
 feast_tsagaan_sar_events.0252.a.duel: "Pokusíš se lstivým manévrem překonat [final_opponent.Custom('CZ_FirstNameNoTooltip_A')]"
 feast_tsagaan_sar_events.0252.success: "Podaří se ti přelstít [final_opponent.Custom('CZ_FirstNameNoTooltip_A')]"
 feast_tsagaan_sar_events.0252.failure: "[final_opponent.GetFirstNameNoTooltip|U] tvůj úmysl prohlédne"
 feast_tsagaan_sar_events.0252.b: "Uvidíme, jak to dopadne..."
 feast_tsagaan_sar_events.0252.c: "Ještě jednou pořádně zabrat!"
 feast_tsagaan_sar_events.0252.after_tt: "Dostih končí"
 feast_tsagaan_sar_events.0253.desc_lost: "[rider_winner.GetName|U] prudce stočí koně a nechá mě za sebou v oblaku prachu. Sleduji, jak projíždí cílovou čárou, zatímco dav propuká v nadšený jásot."
 feast_tsagaan_sar_events.0253.desc_won: "V posledním zoufalém úsilí pobídnu svého koně, který se vyřítí vpřed a předstihne [rider_winner.Custom('CZ_Name_A')]. Projedu cílovou čárou a dav propukne v nadšený jásot."
 feast_tsagaan_sar_events.0253.desc_watch: "[horse_rider_1.GetName|U] a [horse_rider_2.GetName] postupně zrychlují a stále není jasné, kdo zvítězí. Náhle se však [rider_winner.GetFirstNameNoTooltip] dostává do čela a jako první překračuje cílovou čáru. Dav propuká v nadšený jásot."
 feast_tsagaan_sar_events.0253.a: "To byla podívaná!"
 feast_tsagaan_sar_events.0253.winner: "Jsem nejlepší!"
 feast_tsagaan_sar_events.0253.b: "Působivý výkon, [rider_winner.Custom('CZ_FirstNameNoTooltip_V')]!"
 feast_tsagaan_sar_events.0253.c: "Příště si vítězství zasloužím já."
 feast_tsagaan_sar_events.0253.d: "Takového jezdce bych ve svých službách uvítal, [rider_winner.Custom('CZ_FirstNameNoTooltip_V')]."
 feast_tsagaan_sar_events.0253.bet_tt: "Vyhraješ svou sázku"
 feast_tsagaan_sar_events.0260.t: "[drip_haver.Custom('CZ_FirstNamePossessiveNoTooltip_M')|U] skvostný oděv"
 feast_tsagaan_sar_events.0260.desc: "Už zdálky zahlédnu [drip_haver.Custom('CZ_Name_A')] a nemohu odtrhnout oči od nádherného oděvu. Jeho nejvýraznější součástí je zářivě bílý hedvábný [Glossary( 'dél', 'DEEL_GLOSS' )], ozdobený jemným peřím.\n\n[drip_haver.GetFirstNameNoTooltip|U] ke mně přistoupí a s podnapilým úsměvem pronese: „Á, [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')]! Doufám, že tvé srdce dnes večer naplňuje pokoj.“ Souhlasně přikývnu a začnu přemýšlet, co bych měl říct dál."
 feast_tsagaan_sar_events.0260.a: "Pochválit [drip_haver.Custom('CZ_Name_A')] za nádherný oděv."
 feast_tsagaan_sar_events.0260.b_shy: "Rozpačitě se vzdálit."
 feast_tsagaan_sar_events.0260.b: "Rozloučit se a odejít."
 friend_tsagaan_sar_compliment: "[CZProDrop(CHARACTER,'pochválila','pochválil')|U] [TARGET_CHARACTER.Custom('CZ_ShortUIName_A')] za nádherný oděv, a tak mezi nimi vzniklo přátelství."
 feast_tsagaan_sar_events.0270.t: "Výzva s pohárem"
 feast_tsagaan_sar_events.0270.desc: "[drinker.GetName|U] se ke mně přikolébá s pohárem [Glossary( 'ajragu', 'AIRAG_GLOSS' )] v ruce. Se širokým úsměvem jej pozvedne k přípitku.\n\n„Na tvé zdraví, [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')]!“ zvolá [drinker.GetFirstNameNoTooltip].\n\nPřevezmu pohár a přiložím jej ke rtům. Ajrag je pořádně silný a jeho účinky pocítím téměř okamžitě.\n\n„Vsadím se, že toho vypiju víc než ty!“ vyzve mě [drinker.GetFirstNameNoTooltip]."
 AIRAG_GLOSS: "#bold Ajrag#! neboli #bold kumys#! je tradiční mongolský a turkický alkoholický nápoj vyráběný kvašením kobylího mléka."
 feast_tsagaan_sar_events.0270.win: "Vypiješ mnohem více než [drinker.GetFirstNameNoTooltip]"
 feast_tsagaan_sar_events.0270.win_price: "Vypiješ více než [drinker.GetFirstNameNoTooltip], ale draze za to zaplatíš"
 feast_tsagaan_sar_events.0270.lose: "[drinker.GetFirstNameNoTooltip|U] tě v pití překoná"
 feast_tsagaan_sar_events.0270.a: "Přijímám výzvu, [drinker.Custom('CZ_FirstNameNoTooltip_V')]!"
 feast_tsagaan_sar_events.0270.b: "Dnes večer už jsem toho vypil dost."
 feast_tsagaan_sar_events.0270.b_paranoid: "Počkat... Co jsi mi to vlastně dal?"
 feast_tsagaan_sar_events.0280.t: "Moudrost stařešiny"
 feast_tsagaan_sar_events.0280.desc: "V jedné klidnější chvíli zahlédnu [elder.GetName], jak osamoceně sedí a ztrácí se ve vlastních myšlenkách. Jemně se dotknu ramene, abych zjistil, zda je ještě vzhůru. Náhle sebou trhne a polekaně vzhlédne.\n\n„Á, [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')],“ zasměje se [elder.GetFirstNameNoTooltip]. „Odpusť mi. [Select_CString(elder.IsFemale,'Zažila','Zažil')] jsem už tolik podobných oslav, a přesto si pokaždé naliju víc, než bych [Select_CString(elder.IsFemale,'měla','měl')]. Doufám, že se dobře bavíš.“\n\nZdvořile se ukloním a posadím se vedle. Chvíli společně mlčíme. Potom mě [elder.GetFirstNameNoTooltip] uchopí za ruku a začne promlouvat.\n\n„Vidím v tobě veliký potenciál, [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')]. Zeptej se mě, jak si poradit s jakoukoli záležitostí, a já ti odpovím, jak nejlépe dovedu.“"
 feast_tsagaan_sar_events.0280.a: "Pověz mi něco o mé rodině."
 feast_tsagaan_sar_events.0280.a_grow: "[elder.GetFirstNameNoTooltip|U] ti doporučí rozšířit rodinu"
 feast_tsagaan_sar_events.0280.a_strength: "[elder.GetFirstNameNoTooltip|U] ti doporučí upevnit rodinná pouta"
 feast_tsagaan_sar_events.0280.b: "Pověz mi něco o válce."
 feast_tsagaan_sar_events.0280.b_defense: "[elder.GetFirstNameNoTooltip|U] ti doporučí zaměřit se na obranu vlastních zemí"
 feast_tsagaan_sar_events.0280.b_attack: "[elder.GetFirstNameNoTooltip|U] ti doporučí zaměřit se na dobývání nepřátelských území"
 feast_tsagaan_sar_events.0280.c: "Pověz mi něco o mém stádu."
 feast_tsagaan_sar_events.0280.c_tend: "[elder.GetFirstNameNoTooltip|U] ti doporučí věnovat se péči o stádo"
 feast_tsagaan_sar_events.0280.c_migrate: "[elder.GetFirstNameNoTooltip|U] ti doporučí přesunout stádo na jiné pastviny"
 feast_tsagaan_sar_events.0280.d: "Chci si jen užít tvou společnost."
 feast_tsagaan_sar_events.0290.t: "Novému roku vládne [ROOT.Char.Custom('GetLunarNewYearAnimal')|l]"
 feast_tsagaan_sar_events.0290.desc: "Noc se protáhla a vzduch celou dobu naplňoval smích a cinkání pohárů. [wise_guy.GetName|U] svolává hosty k jurtě, aby pronesl přípitek.\n\n„Bratři a sestry!“ zvolá. „S příchodem nového měsíce vzdáváme úctu síle, kterou představuje [ROOT.Char.Custom('GetLunarNewYearAnimal')|l], i požehnáním, která nám přináší. Kéž [ROOT.Char.Custom('GetLunarNewYearAnimalToastDesc')|l]!“\n\n[wise_guy.GetFirstNameNoTooltip|U] pozvedne svůj pohár a ostatní hosté učiní totéž. Společně propuknou v nadšený jásot."
 feast_tsagaan_sar_events.0290.a: "Na zdraví! Ať žije [ROOT.Char.Custom('GetLunarNewYearAnimal')|l]!"
 feast_tsagaan_sar_events.0290.b: "Páni, [wise_guy.GetFirstNameNoTooltip] toho opravdu hodně ví."
 feast_tsagaan_sar_events.0300.t: "Pomocná ruka"
 feast_tsagaan_sar_events.0300.desc: "Večer se pomalu chýlí ke konci a já se uchýlím do tichého kouta jurty. [cleaner.GetName|U] si tiše pobrukuje a pilně uklízí kolem sebe. Nenechá na zemi jediný odřezek ani drobeček.\n\nPřestože si přeji, aby se mí hosté bavili a nemuseli se starat o žádnou práci, [cleaner.GetFirstNameNoTooltip] se dobrovolně [Select_CString(cleaner.IsFemale,'ujala','ujal')] úklidu po ostatních. Díky této péči bude naše jurta do nového roku vstupovat čistá a svěží."
 feast_tsagaan_sar_events.0300.a: "Děkuji ti za všechnu tu námahu, [cleaner.Custom('CZ_FirstNameNoTooltip_V')]."
 feast_tsagaan_sar_events.0300.a_tt: "Projevíš [cleaner.Custom('CZ_FirstNameNoTooltip_D')] svou vděčnost"
 feast_tsagaan_sar_events.0300.b: "Ale copak, támhle ti něco uniklo."
 feast_tsagaan_sar_events.0300.b_tt: "Úmyslně uděláš nepořádek, aby po tobě [cleaner.GetFirstNameNoTooltip] musel uklízet"
 feast_tsagaan_sar_events.0300.c: "Ach, to je milé."
 feast_tsagaan_sar_events.0310.t: "Neuvážené přiznání"
 feast_tsagaan_sar_events.0310.desc: "„Dárek pro [ROOT.Char.Custom('CZ_FirstName_A')]? Ha! To se raději nechám zaživa sežrat krkavci!“ vychloubá se [bragger.GetName] před [bragger_friend.Custom('CZ_Name_I')].\n\n„Pšt!“ zasyčí [bragger_friend.GetFirstNameNoTooltip] a nervózně se ohlédne mým směrem. „Nikdy nevíš, kdo tě může poslouchat.“\n\nJenže na varování už je příliš pozdě. Slyšel jsem dost těch drzých řečí, abych pochopil, že [bragger.GetFirstNameNoTooltip] mi letos žádný dar nepřinesl."
 feast_tsagaan_sar_events.0310.a: "V mém domově pro tebe není místo."
 feast_tsagaan_sar_events.0310.b: "Pokud chceš zůstat, musíš přinést dar."
 feast_tsagaan_sar_events.0310.b.duel: "Pokusíš se přimět [bragger.Custom('CZ_FirstNameNoTooltip_A')], aby ti věnoval dar"
 feast_tsagaan_sar_events.0310.b.success: "[bragger.GetFirstNameNoTooltip|U] ustoupí a vybere pro tebe dar"
 feast_tsagaan_sar_events.0310.b.failure: "[bragger.GetFirstNameNoTooltip|U] ti odmítne dát jakýkoli dar"
 feast_tsagaan_sar_events.0310.c: "Tentokrát ty řeči přejdu bez povšimnutí."
 feast_tsagaan_sar_events.0320.t: "Úcta ke stařešinům"
 feast_tsagaan_sar_events.0320.desc: "S přibývajícími léty roste i moudrost. Jsou mezi námi lidé, kteří prožili bezpočet měsíčních cyklů a předávají dalším pokolením příběhy o svých dobyvačných taženích i ponaučení, která jim přinesl život. Jejich těla jsou křehká a smysly slábnou, ale mysl jim zůstává bystrá a jejich slova mají váhu.\n\nČas, který jim na tomto světě zbývá, se krátí. Projevit jim úctu vhodným darem proto jistě nemůže být na škodu."
 feast_tsagaan_sar_events.0320.a: "Zahrňme je dary!"
 feast_tsagaan_sar_events.0320.a_tt: "Každý [Concept('activity_guest','host aktivity')|E] starší #V 50#! let:\n$EFFECT_LIST_BULLET$Jeho [Concept('opinion','mínění')|E] o #V tobě#! se zvýší o #p 10#!"
 feast_tsagaan_sar_events.0320.b: "Už se jim dostává úcty až dost."
 feast_tsagaan_sar_events.0010.t: "Cagán sar"
 feast_tsagaan_sar_events.0010.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ osloví mě [gift_collector.GetName]. „Nadešel čas vybrat dary od hostů. Doufám, že jsi [Select_CString(ROOT.Char.IsFemale,'připravena','připraven')] je přijmout.“\n\n[gift_collector.GetFirstNameNoTooltip|U] pokyne k vchodu do jurty, kde už čeká dlouhá řada hostů připravených předat své dary.\n\nSouhlasně přikývnu a připravím se na zbytek večera."
 feast_tsagaan_sar_events.0010.a: "Přineste dary!"
 feast_tsagaan_sar_events.0010.a_tt: "Celkem jsi [Select_CString(ROOT.Char.IsFemale,'obdržela','obdržel')]:\n$EFFECT_LIST_BULLET$ [gold_i] #V [GetPlayer.MakeScope.Var('feast_gold_total').GetValue]#! [Concept('gold','zlata')|E]\n$EFFECT_LIST_BULLET$ [herd_i] #V [GetPlayer.MakeScope.Var('feast_herd_total').GetValue]#! [Concept('herd','stáda')|E]\n$EFFECT_LIST_BULLET$ [piety_i] #V [GetPlayer.MakeScope.Var('feast_piety_total').GetValue]#! [Concept('piety','zbožnosti')|E]\n$EFFECT_LIST_BULLET$ [prestige_i] #V [GetPlayer.MakeScope.Var('feast_prestige_total').GetValue]#! [Concept('prestige','prestiže')|E]"
