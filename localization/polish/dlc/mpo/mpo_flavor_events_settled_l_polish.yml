l_polish:
 mpo_flavor_events_settled.0001.t: "Blížící se bouře"
 mpo_flavor_events_settled.0001.desc: "Ledový vítr mi řeže do tváří jako střepy skla. V poslední době panuje nezvykle chladné počasí.\n\nPrávě když se otočím, abych se [Select_CString(ROOT.Char.IsFemale,'vrátila','vrátil')] do tepla, upoutá mou pozornost zoufalé zařehtání koně. Jeho [Select_CString(nomad.IsFemale,'jezdkyně','jezdec')] se sotva drží otěží.\n\n„Pomoc...“ zašeptá [Select_CString(nomad.IsFemale,'vyčerpaná jezdkyně','vyčerpaný jezdec')] a téměř se zhroutí. „Přišla velká zima. Můj lid umírá při pokusech uprchnout ze stepi.“"
 mpo_flavor_events_settled.0001.aa: "„Zmiz odsud!“"
 mpo_flavor_events_settled.0001.a: "„Ať přijdou!“"
 mpo_flavor_events_settled.0001.b: "„Musíme se na příchod těch nomádů připravit.“"
 mpo_flavor_events_settled.0001.c: "„Teď už si můžeš odpočinout.“"
 mpo_settled_preparations_war_county_modifier: "Válečné přípravy"
 mpo_settled_preparations_war_county_modifier_desc: "Tato postava se připravuje na hrozící vpád nomádů a posiluje svá vojska."
 mpo_settled_preparations_building_county_modifier: "Příprava území"
 mpo_settled_preparations_building_county_modifier_desc: "Tato postava se připravuje na hrozící vpád nomádů a zajišťuje, aby její hrabství byla na útok připravena."
 mpo_flavor_events_settled.0001.tt: "@alert_icon! #alert_trial [Concept('nomads','Nomádi')|EU] se mohou pokusit zmocnit našich zemí#!"
 mpo_flavor_events_settled.0010.t: "Pán koní"
 mpo_flavor_events_settled.0010.desc: "#Emp „Kš! Kš!“#! [Select_CString(nomad.IsFemale,'Neznámá žena','Neznámý muž')] poklepává svého koně po boku, aby jej [Select_CString(nomad.IsFemale,'uklidnila','uklidnil')], a pak ke mně přistoupí.\n\n„Zdravím tě, [Select_CString(ROOT.Char.IsFemale,'ctihodná','ctihodný')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]. [Select_CString(nomad.IsFemale,'Jsem vyslankyní','Jsem vyslancem')] [Select_CString(nomad_lord.IsFemale,'mocné','mocného')] [nomad_lord.Custom('CZ_TitledFirstName_G')]. [Select_CString(nomad_lord.IsFemale,'Má','Můj')] [nomad_lord.GetLadyLord|l] mě [Select_CString(nomad_lord.IsFemale,'vyslala','vyslal')] s nabídkou příměří mezi našimi národy.“"
 mpo_flavor_events_settled.0010.a: "„Prosím, přijmi můj tribut.“"
 mpo_flavor_events_settled.0010.b: "„Jistě dokážeme dospět k dohodě.“"
 mpo_flavor_events_settled.0010.b_perk_tt: "Díky [Concept('perk','talentu')|E] [GetPerk('defensive_measures_perk').GetName( GetNullCharacter )] můžeš vyjednat výhodnější cenu"
 mpo_flavor_events_settled.0010.c: "#EMP Plivnout na zem.#!"
 mpo_flavor_events_settled.0010.d: "„Ať [nomad_lord.GetLadyLord|l] přijme mé uctivé pozdravy.“"
