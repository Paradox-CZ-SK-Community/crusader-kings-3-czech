 ask_for_herd_county_depleted_modifier_desc: "Pastevci tohoto hrabství byli násilně připraveni o svá stáda. Bez pasoucích se zvířat došlo k narušení přirozeného koloběhu, který udržoval půdu úrodnou.\nTráva, kterou už nikdo nespásá, se při úderu blesku mění v popel. Bez kopyt, která půdu udusávají a provzdušňují, země pustne. A bez čtyřnohých roznašečů přírodního hnojiva je zdejší krajina odsouzena k #EMP opravdu#! hubeným létům."
