 blood_brother_clever_modifier_desc: "Tato postava se může spolehnout na moudré rady svého pokrevního sourozence."
 blood_brother_loving_modifier: "Laskavé pokrevní bratrství"
 blood_brother_loving_modifier_desc: "Laskavé a štědré srdce upevňuje pouto mezi touto postavou a jejím pokrevním sourozencem."
 mpo_interactions_events.0006.t: "Krev mé krve"
 mpo_interactions_events.0006.desc_intro: "[blood_bro.GetFirstName|U] si nařízne dlaň a pronese: „Když"
 mpo_interactions_events.0006.desc_anda: "se staneme [Glossary( 'anda', 'ANDA_GLOSS' )],"
 mpo_interactions_events.0006.desc_no_anda: "vyslovíme tato slova,"
 mpo_interactions_events.0006.desc: "naše životy splynou v jediný! [Select_CString(ROOT.Char.IsFemale,'Sestro','Bratře')], přísahám, že tě budu navždy milovat a chránit.“\n\nStejnou přísahu složím i já. Naříznu si dlaň a smísím svou krev s krví [Select_CString(blood_bro.IsFemale,'své nové pokrevní sestry','svého nového pokrevního bratra')].\n\nKdyž je naše pouto zpečetěno, vyměníme si vzácné dary, dosyta se najíme a na noc se společně přikryjeme jedinou kožešinou. Ve spánku sníme o"
 mpo_interactions_events.0006.desc_shared_foe: "utrpení našich nepřátel, o žalu a zkáze, které čekají [shared_foe.Custom('CZ_TitledFirstName_A')]!"
 mpo_interactions_events.0006.desc_memories: "šťastných dnech, které už dávno minuly."
 mpo_interactions_events.0006.desc_war_allies: "vítězných bitvách a burácení našich válečných rohů."
 mpo_interactions_events.0006.desc_outro: "bitvách, které nás teprve čekají."
 ANDA_GLOSS: "#bold Anda#! je mongolský výraz pro pokrevního bratra. Nejznámějšími nositeli tohoto označení byli Čingischán a Džamucha. Ještě jako děti si vyměnili hlezenní kůstky a složili přísahu pokrevního bratrství. V mladé dospělosti pak své pouto znovu stvrdili."
 mpo_interactions_events.0006.a: "Naši nepřátelé budou trpět."
 mpo_interactions_events.0006.a.flavor: "A náš společný nepřítel [shared_foe.GetTitledFirstNameNoTooltip] bude #EMP trpět ze všech nejvíce!#!"
 mpo_interactions_events.0006.b: "Všichni znají vznešené postavení [Select_CString(blood_bro.IsFemale,'mé pokrevní sestry','mého pokrevního bratra')]..."
 mpo_interactions_events.0006.c: "[Select_CString(blood_bro.IsFemale,'Má pokrevní sestra je hrozivá jako vlčice!','Můj pokrevní bratr je hrozivý jako vlk!')]"
 mpo_interactions_events.0006.d: "Vždy se budu řídit moudrostí [Select_CString(blood_bro.IsFemale,'své pokrevní sestry','svého pokrevního bratra')]."
 mpo_interactions_events.0006.e: "Věřím šlechetnému srdci [Select_CString(blood_bro.IsFemale,'své pokrevní sestry','svého pokrevního bratra')]."
 mpo_interactions_events.0006.f: "[Select_CString(blood_bro.IsFemale,'Má pokrevní sestra','Můj pokrevní bratr')]. Krev mé krve."
