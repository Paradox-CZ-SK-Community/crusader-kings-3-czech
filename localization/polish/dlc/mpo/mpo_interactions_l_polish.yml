 mpo_interactions_events.0003.opening: "[Select_CString(ROOT.Char.IsFemale,'Má sestro, má vznešená ochránkyně,','Můj bratře, můj vznešený ochránce,')]"
 mpo_interactions_events.0003.desc: "Budu ctít zásady konfederace [confederation.GetName]. Společně obstojíme!\n\nKaždý meč, který se rozmáchne proti tvému hrdlu, narazí na mou čepel. Žádný šíp mířící na tvé srdce nebude rychlejší než můj štít."
 mpo_interactions_events.0003.a: "Máme [Select_CString(recipient.IsFemale,'ji','ho')] na své straně."
 mpo_interactions_events.0004.opening: "Zbabělé kryse, [ROOT.Char.Custom('CZ_TitledFirstName_V')],"
 mpo_interactions_events.0004.desc: "Myslíš, že ti příslušnost k celé záplavě krys přinese pocit bezpečí, ty malé stvoření? Vždyť tě může každým okamžikem uchvátit ze země a spolknout mohutný orel!\n\n"
 mpo_interactions_events.0004.desc_join: "Odběhni zpátky do své díry, kryso. Nepotřebujeme tě."
 mpo_interactions_events.0004.desc_offer: "Ne. Nebudu patřit k žádné ubohé konfederaci."
 mpo_interactions_events.0004.a: "Krysa je chytrá. Ty ne."
