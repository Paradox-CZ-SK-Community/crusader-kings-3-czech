 mpo_interaction_grant_paiza_notification: "Pod mým praporem [Select_CString(recipient.IsFemale,'jsi jezdila','jsi jezdil')] statečně a celá step by to měla vědět. Nos tuto pajdzu jako znamení mé přízně a nechť každý, kdo se ti postaví do cesty, pocítí strach z ruky, která ji razila."
