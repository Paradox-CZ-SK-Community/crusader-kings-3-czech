 MAKE_BLOOD_BROTHER_NOTIFICATION: "[recipient.Custom('RegionalFerociousAnimal')|U] — tak tě znají [recipient.GetCulture.GetCollectiveNoun]. Přísahám, že se stanu [Select_CString(actor.IsFemale,'tvou pokrevní sestrou','tvým pokrevním bratrem')], krví tvé krve.\n\nAť přijde krupobití či temnota noci, vždy ti vyjedu na pomoc a #EMP nikdy tě neopustím!#! Proliješ svou krev a složíš tutéž přísahu?"
