 mpo_interactions_events.0002.t: "[confederation.GetName|U]"
 mpo_interactions_events.0002.desc: "Kolem nás se shromažďují [other_confederate.GetCulture.GetCollectiveNoun] pod vedením [other_confederate.Custom('CZ_TitledFirstName_G')] spolu s válečníky ze země [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier]. Smísíme svou krev a přísaháme si věrnost v novém spojenectví.\n\n„Bude nás mnoho, [Select_CString(other_confederate.IsFemale,'sestro','bratře')], a společně budeme střežit tyto země!“ zvolá [other_confederate.GetFirstNameNoTooltip] a pevně mě obejme. „Budeme bojovat jako vlci jedné smečky. Nikdo nebude stát nad ostatními a nikdo nebude hladovět víc než druzí!“\n\n"
 mpo_interactions_events.0002.desc_new: "A tak se rodí [new_confederation.GetName]."
 mpo_interactions_events.0002.desc_joining: "A tak vstupuji do konfederace [confederation.GetName]. Má přísaha věrnosti patří každému z mladých vlků její smečky."
 mpo_interactions_events.0002.a: "Žít či zemřít, vždy bok po boku!"
