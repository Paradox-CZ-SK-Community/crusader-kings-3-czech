 blood_brother_august_modifier_desc: "Pokrevní přísaha této postavy byla spojena se slibem povznést její postavení a dopomoci jí k větší vážnosti."
 blood_brother_warrior_modifier: "Válečnické pokrevní bratrství"
 blood_brother_warrior_modifier_desc: "Po boku této postavy stojí obávaný válečník, s nímž ji pojí pokrevní přísaha."
 blood_brother_clever_nomadic_modifier: "$blood_brother_clever_modifier$"
