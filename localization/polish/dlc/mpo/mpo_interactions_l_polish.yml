 mpo_interactions_events.0101.t: "$influence_child_commander_interaction$: [target_trait.GetNameNoTooltip(GetPlayer)] — Úspěch"
 mpo_interactions_events.0101.desc_intro: "Po dlouhých hodinách strávených nad mapami a studiem vojenské taktiky se [recipient.GetName] očividně nudí. Vstanu, hodím [Select_CString(recipient.IsFemale,'jí','mu')] cvičný meč a zavolám:\n\n„Pojď ven! Kdo jako první zasáhne protivníka do těla, vyhrává!“\n\n"
 mpo_interactions_events.0101.logistician: "Vytasím cvičný meč a připravím se k souboji. [recipient.GetFirstNameNoTooltip|U] popadne svůj meč a bez váhání se pustí do boje. Údery jsou prudké, ale přesné. Bojujeme dlouho, nikdo z nás však nezískává převahu a nakonec nás přemůže únava.\n\n„Odpočiňme si, zítra můžeme pokračovat.“"
 mpo_interactions_events.0101.desc_logistician: "$mpo_interactions_events.0101.logistician$ Chystám se vyhlásit přestávku, ale [recipient.GetFirstNameNoTooltip] se rozčílí a začne se přehrabovat ve svém vaku.\n\n„Ne, ještě můžeme pokračovat!“ zvolá a nabídne mi něco k snědku: [recipient.Custom('GetLocalStreetFood')|l]."
 mpo_interactions_events.0101.military_engineer: "Vyměňujeme si údery, ale ani jeden z nás nedokáže zasáhnout cíl. Nakonec [recipient.GetFirstNameNoTooltip] ustoupí, zvětší mezi námi odstup a sesune se k zemi.\n\n„[Select_CString(recipient.IsFemale,'Neublížila','Neublížil')] sis?“ začnu se strachovat"
 mpo_interactions_events.0101.desc_military_engineer: "$mpo_interactions_events.0101.military_engineer$, ale vzápětí mi kolem hlavy prosviští kámen.\n\n„Málem jsem tě [Select_CString(recipient.IsFemale,'trefila','trefil')]!“ vykřikne [recipient.GetFirstNameNoTooltip] a vkládá další kámen do malého praku."
 mpo_interactions_events.0101.aggressive_attacker: "Okamžitě se vrhnu na [recipient.Custom('CZ_ShortUINameNoTooltip_A')] a bez ustání dorážím na [Select_CString(recipient.IsFemale,'její','jeho')] meč.\n\n„Pamatuj, že v bitvě jde buď o tvůj život, nebo o život protivníka. Vlož do každého úderu veškerou svou sílu, a ještě něco navíc!“"
 mpo_interactions_events.0101.desc_aggressive_attacker: "$mpo_interactions_events.0101.aggressive_attacker$\n\nNež stačím domluvit, [recipient.GetFirstNameNoTooltip] se na mě vrhne. Prudké údery odštěpují třísky z mého cvičného meče, až jej nakonec rozštípnou. Bez možnosti se bránit mi nezbývá než se vzdát."
 mpo_interactions_events.0101.desc_unyielding_defender: "$mpo_interactions_events.0101.aggressive_attacker$\n\n[recipient.GetFirstNameNoTooltip|U] však ani na okamžik nezaváhá. Každý můj úder odrazí nebo vykryje a já se k [Select_CString(recipient.IsFemale,'ní','němu')] vůbec nedokážu dostat."
 mpo_interactions_events.0101.forder: "Sejdeme k řece, abychom zahájili souboj. Po několika úderech mě protivník zatlačí do vody. Přeskakuji z jednoho travnatého ostrůvku na druhý a snažím se najít pevnou půdu pod nohama."
 mpo_interactions_events.0101.desc_forder: "$mpo_interactions_events.0101.forder$\n\n„[Select_CString(ROOT.Char.IsFemale,'Jsi moc pomalá, stará dámo!','Jsi moc pomalý, starý pane!')]“ Náhle se přede mnou objeví [recipient.GetFirstNameNoTooltip] a jediným úderem mě srazí do vody."
 mpo_interactions_events.0101.flexible_leader: "„Hýbej nohama, drž správný postoj, hledej skuliny v obraně a nenech se rozptýlit!“ Vrhnu se vpřed v naději, že moje neustálé poučování [recipient.Custom('CZ_FirstNameNoTooltip_A')] dostatečně zmátlo."
 mpo_interactions_events.0101.desc_flexible_leader: "$mpo_interactions_events.0101.flexible_leader$ Jenže [recipient.GetFirstNameNoTooltip] se mému výpadu vyhne a okamžitě přejde do protiútoku. Souboj tak skončí dřív, než se vůbec stačí pořádně rozběhnout."
 mpo_interactions_events.0101.desert_warrior: "Kroužíme kolem sebe a oba čekáme na příležitost k útoku. Jakmile spatřím skulinu v obraně, okamžitě zaútočím. [recipient.GetFirstNameNoTooltip|U] však vyčkává až do poslední chvíle, kdy mi do tváře vrhne hrst"
 mpo_interactions_events.0101.desc_desert_warrior: "$mpo_interactions_events.0101.desert_warrior$ písku, který mě oslepí. Můj úder mine cíl a já nechám svou obranu zcela odkrytou. [recipient.GetFirstNameNoTooltip|U] toho okamžitě využije a vítězí."
 mpo_interactions_events.0101.jungle_stalker: "[recipient.GetFirstNameNoTooltip|U] vyrazí jako první a zmizí v džungli. Pokouším se [recipient.Custom('CZ_FirstNameNoTooltip_A')] najít, ale čím hlouběji pronikám mezi stromy, tím je les temnější a hustší."
 mpo_interactions_events.0101.desc_jungle_stalker: "$mpo_interactions_events.0101.jungle_stalker$\n\n„Teď tě mám!“ vykřikne [recipient.GetFirstNameNoTooltip] a seskočí na mě z větví jednoho ze stromů. Útok mě zcela zaskočí a souboj končí mou porážkou."
 mpo_interactions_events.0101.reaver: "Na rozehřátí si vyměníme několik rychlých úderů."
 mpo_interactions_events.0101.desc_reaver: "$mpo_interactions_events.0101.reaver$ [recipient.GetFirstNameNoTooltip|U] se ke mně náhle přitiskne a strhne mě do zápasu zblízka. Chvíli spolu zápolíme, než můj protivník nečekaně ustoupí.\n\n„Tohle je snad tvoje?“ zeptá se [recipient.GetFirstNameNoTooltip] s potutelným úsměvem a přitom si zkouší #EMP můj#! prsten."
 mpo_interactions_events.0101.reckless: "Okamžitě se do sebe pustíme. Sek, minutí! Bodnutí, úhyb! Kopnutí, zásah! [recipient.GetFirstNameNoTooltip|U] se skutálí přímo do řeky. Otřepe ze sebe vodu a vykřikne:\n\n„Nenávidím tě!“ Pak se na mě znovu vrhne.\n\n„Ne, nedělej to!“"
 mpo_interactions_events.0101.desc_reckless: "$mpo_interactions_events.0101.reckless$ Pokusím se uhnout, ale počítám s mnohem rychlejším výpadem. [recipient.GetFirstNameNoTooltip|U] do mě místo toho narazí hlavou napřed."
 mpo_interactions_events.0101.holy_warrior: "Před začátkem souboje se pomodlím:\n\n„Kéž [ROOT.Char.GetFaith.WarGodName] vede mé ruce a propůjčí mým úderům rychlost i sílu!“"
 mpo_interactions_events.0101.desc_holy_warrior: "$mpo_interactions_events.0101.holy_warrior$\n\n„A dej mi sílu prokázat milosrdenství mým nepřátelům!“ dokončí svou modlitbu [recipient.GetFirstNameNoTooltip] a zaujme bezchybný bojový postoj."
 mpo_interactions_events.0101.terrain_expert: "Vstoupíme do nedalekého hájku. Souboj se protahuje, protože nám větve neustále překážejí a brání dostat se jeden k druhému. Dlouho se ani jednomu z nás nedaří získat převahu."
 mpo_interactions_events.0101.desc_open_terrain_expert: "$mpo_interactions_events.0101.terrain_expert$\n\n[recipient.GetFirstNameNoTooltip|U] si však všimne mýtiny za mými zády.\n\n„Teď tě mám!“ vykřikne a vytlačí mě na otevřené prostranství. Na široké pláni jsou pohyby mého protivníka tak rychlé a nepředvídatelné, že proti nim nemám šanci. Zásah přichází téměř okamžitě."
 mpo_interactions_events.0101.rough_terrain_expert: "$mpo_interactions_events.0101.terrain_expert$"
 mpo_interactions_events.0101.desc_rough_terrain_expert: "$mpo_interactions_events.0101.rough_terrain_expert$\n\n[recipient.GetFirstNameNoTooltip|U] si však všimne kamenitého úseku za mými zády.\n\n„Teď tě mám!“ vykřikne a vytlačí mě mezi skaliska. V členitém kamenitém terénu jsou pohyby mého protivníka tak rychlé a nepředvídatelné, že proti nim nemám šanci. Zásah přichází téměř okamžitě."
 mpo_interactions_events.0101.forest_fighter: "$mpo_interactions_events.0101.terrain_expert$ [recipient.GetFirstNameNoTooltip|U] vyšplhá na jeden ze stromů.\n\n„Chytej!“ vykřikne, ulomí větev a hodí ji po mně. Uhnout se mi sice podaří, ale už je příliš pozdě. Vzápětí ucítím zásah mečem do nohy."
 mpo_interactions_events.0101.desc_forest_fighter: "$mpo_interactions_events.0101.forest_fighter$"
 mpo_interactions_events.0101.desc_cautious_leader: "Zkouším několik seků, výpadů a bodnutí, ale [recipient.GetFirstNameNoTooltip] mi nenabízí sebemenší skulinu v obraně. Dupáním a křikem se pokouším protivníka zastrašit, ale pevný obranný postoj se ani na okamžik nezmění.\n\n„Už toho mám dost!“ Ztratím trpělivost a vrhnu se do bezhlavého útoku. Jenže právě na to [recipient.GetFirstNameNoTooltip] čeká! Jakmile odkryji svou obranu, okamžitě mě zasáhne a souboj je rozhodnut."
 mpo_interactions_events.0101.organizer: "Popadneme cvičné meče a pustíme se do souboje. Bojujeme celé hodiny."
 mpo_interactions_events.0101.desc_organizer: "$mpo_interactions_events.0101.organizer$ Síly mi postupně docházejí, ale pohyby mého protivníka zůstávají rychlé a přesné. Už nedokážu držet krok. S posledními zbytky sil se pokusím o bodnutí, jenže [recipient.GetFirstNameNoTooltip] můj útok lehce odrazí a přejde do protiútoku, jako bychom s výcvikem teprve začínali. Nezbývá mi než uznat porážku."
 mpo_interactions_events.0101.winter_soldier: "$mpo_interactions_events.0101.desert_warrior$"
 mpo_interactions_events.0101.desc_winter_soldier: "$mpo_interactions_events.0101.winter_soldier$ sněhu. Na okamžik ztratím orientaci a odkryji svou obranu. [recipient.GetFirstNameNoTooltip|U] toho využije, zasáhne mě a vítězí."
 mpo_interactions_events.0101.a: "„[Select_CString(recipient.IsFemale,'Jednou z tebe bude skvělá velitelka!','Jednou z tebe bude skvělý velitel!')]“"
 mpo_interactions_events.0101.a.flavor: "Zdá se, že [recipient.GetFirstNameNoTooltip] už dobře chápe podstatu [Concept('commander_trait','velitelského rysu')|E] [target_trait.GetNameNoTooltip(GetPlayer)]."
 mpo_interactions_events.0102.t: "$influence_child_commander_interaction$: [target_trait.GetNameNoTooltip(GetPlayer)] — Neúspěch"
 mpo_interactions_events.0102.desc_intro: "$mpo_interactions_events.0101.desc_intro$"
 mpo_interactions_events.0102.desc_logistician: "$mpo_interactions_events.0101.logistician$ Přestávku navrhne [recipient.GetFirstNameNoTooltip], ale já sáhnu do svého vaku a vytáhnu něco k zakousnutí. Je to [ROOT.Char.Custom('GetLocalStreetFood')|l] a kousek nabídnu i [recipient.Custom('CZ_FirstNameNoTooltip_D')].\n\n„Ne, ještě můžeme pokračovat!“"
 mpo_interactions_events.0102.desc_military_engineer: "$mpo_interactions_events.0101.military_engineer$, když zaslechnu tiché zakňourání.\n\n„[Select_CString(recipient.IsFemale,'Chtěla jsem po tobě vystřelit z praku, a-ale...','Chtěl jsem po tobě vystřelit z praku, a-ale...')]“ [recipient.GetFirstNameNoTooltip|U] se rozpláče a ukáže mi prsty zapletené do řemínků praku."
 mpo_interactions_events.0102.desc_aggressive_attacker: "$mpo_interactions_events.0101.aggressive_attacker$\n\n[recipient.GetFirstNameNoTooltip|U] začne před sebou divoce mávat mečem a se zavřenýma očima se proti mně rozběhne. Proběhnu kolem a zasadím čistý zásah."
 mpo_interactions_events.0102.desc_unyielding_defender: "$mpo_interactions_events.0101.aggressive_attacker$\n\n[recipient.GetFirstNameNoTooltip|U] už po několika dalších úderech nevydrží. Meč vypadne z ruky a obrana zůstane zcela odkrytá. Jen tak tak dokážu svůj úder zadržet, aby nedopadl #EMP plnou silou#!."
 mpo_interactions_events.0102.desc_forder: "$mpo_interactions_events.0101.forder$ [recipient.GetFirstNameNoTooltip|U] se mě pokusí dostihnout, ale kameny jsou příliš kluzké. Uklouzne a spadne mi přímo k nohám, takže mám snadnou příležitost zasadit vítězný úder!"
 mpo_interactions_events.0102.desc_flexible_leader: "$mpo_interactions_events.0101.flexible_leader$ [recipient.GetFirstNameNoTooltip|U] se ani nestihne připravit k vykrytí mého útoku a já bez obtíží zasadím přesný zásah."
 mpo_interactions_events.0102.desc_desert_warrior: "$mpo_interactions_events.0101.desert_warrior$ písku, já jej však odrazím štítem přímo zpátky. Písek zasáhne protivníka do očí a oslepí ho. Využiji odkryté obrany a snadno zvítězím."
 mpo_interactions_events.0102.desc_jungle_stalker: "$mpo_interactions_events.0101.jungle_stalker$\n\n„Áá! Had!“ vykřikne [recipient.GetFirstNameNoTooltip] a zřítí se z jednoho ze stromů přímo k mým nohám. Tak snadné vítězství jsem opravdu nečekal."
 mpo_interactions_events.0102.desc_reaver: "$mpo_interactions_events.0101.reaver$ Přitáhnu si [recipient.Custom('CZ_FirstNameNoTooltip_A')] k tělu a strhnu souboj do zápasu zblízka. Chvíli spolu zápolíme, až se mi podaří nenápadně stáhnout prsten z protivníkova prstu.\n\n„Musíš si dávat pozor, protože příště by tě to mohlo stát celou ruku!“"
 mpo_interactions_events.0102.desc_reckless: "$mpo_interactions_events.0101.reckless$ Uskočím stranou, takže [recipient.GetFirstNameNoTooltip] ztratí rovnováhu. Nohy podklouznou a můj protivník se znovu svalí k zemi."
 mpo_interactions_events.0102.desc_holy_warrior: "$mpo_interactions_events.0101.holy_warrior$\n\n„Méně řečí, více boje!“ přeruší mě [recipient.GetFirstNameNoTooltip] a vrhne se do útoku.\n\n„Kéž mi [ROOT.Char.GetFaith.HighGodName] odpustí!“ zašeptám a jediným úderem [recipient.Custom('CZ_FirstNameNoTooltip_A')] srazím k zemi."
 mpo_interactions_events.0102.desc_open_terrain_expert: "$mpo_interactions_events.0101.terrain_expert$\n\nZa [recipient.Custom('CZ_FirstNameNoTooltip_I')] zahlédnu mýtinu.\n\nVytlačím protivníka na otevřené prostranství, kde mohu naplno využít svou převahu. Mé pohyby jsou na široké pláni příliš rychlé a nepředvídatelné. [recipient.GetFirstNameNoTooltip|U] se nemá kam schovat a já snadno zasadím vítězný úder."
 mpo_interactions_events.0102.desc_rough_terrain_expert: "$mpo_interactions_events.0101.rough_terrain_expert$\n\nZa [recipient.Custom('CZ_FirstNameNoTooltip_I')] zahlédnu kamenitý úsek.\n\nVytlačím protivníka mezi skaliska, kde mohu naplno využít svou převahu. V členitém terénu jsou mé pohyby příliš rychlé a nepředvídatelné. [recipient.GetFirstNameNoTooltip|U] se nemá kam schovat a já snadno zasadím vítězný úder."
 mpo_interactions_events.0102.desc_forest_fighter: "$mpo_interactions_events.0101.forest_fighter$ Vyšplhám na jeden ze stromů.\n\n„Chytej!“ vykřiknu, ulomím větev a hodím ji po [recipient.Custom('CZ_FirstNameNoTooltip_L')]. [recipient.GetFirstNameNoTooltip|U] sice uhne, ale už je pozdě. Seskočím hned za letící větví a snadno zasáhnu protivníkovo tělo."
 mpo_interactions_events.0102.desc_cautious_leader: "[recipient.GetFirstNameNoTooltip|U] zkouší několik seků, výpadů a bodnutí, ale v mé obraně nenachází sebemenší skulinu. Dupáním a křikem se mě pokouší zastrašit. Já však neustoupím ani o krok.\n\n„Už toho mám dost!“ vykřikne [recipient.GetFirstNameNoTooltip], ztratí trpělivost a vrhne se proti mně. Jenže právě na tento okamžik jsem čekal! Jakmile se objeví skulina v obraně, okamžitě zaútočím a souboj vyhraji."
 mpo_interactions_events.0102.desc_organizer: "$mpo_interactions_events.0101.organizer$ Všimnu si, že [recipient.GetFirstNameNoTooltip] začíná těžce dýchat. Pohyby se zpomalují a údery stále častěji míjejí cíl. Můj protivník už nedokáže držet krok. S posledními zbytky sil se pokusí o bodnutí, ale já jednoduše ustoupím stranou. [recipient.GetFirstNameNoTooltip|U] se vyčerpáním zhroutí."
 mpo_interactions_events.0102.desc_winter_soldier: "$mpo_interactions_events.0101.winter_soldier$ sněhu, ale já se mu vyhnu. [recipient.GetFirstNameNoTooltip|U] tím zcela odkryje svou obranu, takže snadno zasadím vítězný úder."
 mpo_interactions_events.0102.a: "„Možná příště.“"
 mpo_interactions_events.0102.a.flavor: "Dnešní výcvik ukázal, že [recipient.GetFirstNameNoTooltip] má před sebou ještě dlouhou cestu."
 mpo_interactions_events.0102.b: "„Budeme výcvik opakovat, dokud nevyhraješ!“"
 mpo_interactions_events.0102.b.flavor: "S dostatečnou #EMP vytrvalostí#! může [recipient.GetFirstNameNoTooltip] dosáhnout všeho, co si pro [Select_CString(recipient.IsFemale,'ni','něj')] předsevzal."
