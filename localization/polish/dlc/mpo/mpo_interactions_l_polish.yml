 BLOOD_BROTHER_NORMAL: "Pojí nás silné pouto."
 BLOOD_BROTHER_COMMON_ENEMY: "Spojuje nás společný nepřítel."
 BLOOD_BROTHER_COMMON_ENEMY_TRIGGER: "Abyste měli společného nepřítele, musíš ty i oslovená postava vůči témuž protivníkovi splňovat alespoň jednu z následujících podmínek:\n $EFFECT_LIST_BULLET$Nepřítel je tvým sokem\n$EFFECT_LIST_BULLET$ Nepřítel je tvým hlavním válečným protivníkem\n$EFFECT_LIST_BULLET$ Nepřítel je členem nepřátelské frakce\n$EFFECT_LIST_BULLET$ Nepřítel je cílem tvé frakce\n$EFFECT_LIST_BULLET$ Rod nepřítele vede proti tvému rodu rodovou mstu\n$EFFECT_LIST_BULLET$ Máš nárok na některý z nepřítelových titulů, na který si tvůj pokrevní bratr nečiní nárok\n$EFFECT_LIST_BULLET$ Nepřítel má nárok na některý z tvých titulů, na který si tvůj pokrevní bratr nečiní nárok"
