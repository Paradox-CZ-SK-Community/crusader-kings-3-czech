l_polish:
 jamukha_choose_blood_brother_tt: "[jamukha.GetShortUIName|U] [Select_CString(jamukha.IsLocalPlayer,'rozhodneš','rozhodne')|l], zda přistoupit k uzavření [Concept('blood_brothers','pokrevního bratrství')|E]"
 jamukha_warhorse_tt: "#high Ty#! věnuješ [jamukha.Custom('CZ_ShortUIName_D')] [GetModifier('horse_story_modifier').GetNameWithTooltip]"
 temujin_warhorse_tt: "[jamukha.GetShortUIName|U] ti věnuje [GetModifier('horse_story_modifier').GetNameWithTooltip]"
 temujin_warhorse_jamukha_tt: "#high Ty#! věnuješ [temujin.Custom('CZ_ShortUIName_D')] [GetModifier('horse_story_modifier').GetNameWithTooltip]"
 jamukha_warhorse_jamukha_tt: "[temujin.GetShortUIName|U] ti věnuje [GetModifier('horse_story_modifier').GetNameWithTooltip]"
 blood_brother_gains_hook_tt: "Získá [Concept('strong_hook','silnou páku')|E] #EMP (pokrevní bratr)#! na #high tebe#!"
 blood_brother_gains_hook_other_tt: "#high Ty#! získáš [Concept('strong_hook','silnou páku')|E] #EMP (pokrevní bratr)#! na [blood_bro.Custom('CZ_ShortUIName_A')]"
 mpo_jamukha_flavor.0001.t: "Léta bratrství"
 mpo_jamukha_flavor.0001.desc: "Sedím s [temujin.Custom('CZ_TitledFirstName_I')] u ohně. Kolem nás se v jediném velikém táboře shromáždily naše národy, nyní spojené v jeden celek.\n\nUplynula dlouhá léta od chvíle, kdy jsem poprvé nabídl přátelství mladému válečníkovi, kterého zavrhl rod jeho otce. Tehdy jsme na zamrzlé hladině řeky Onon házeli hlezenními kůstkami a přísahali si věčné přátelství.\n\nByli jsme ještě děti. Od té doby jsme společně válčili a naše přátelství jen sílilo. Dnes už jsme dospělí muži a známe slova přísahy, která z nás učiní [Glossary( 'anda', 'ANDA_GLOSS' )] na celý život."
 mpo_jamukha_flavor.0001.a: "Složím [temujin.Custom('CZ_FirstNameNoTooltip_D')] přísahu pokrevního bratrství."
 mpo_jamukha_flavor.0001.a.tt: "A vyměníme si dary hodné našeho přátelství."
 mpo_jamukha_flavor.0001.b: "Jde mi o moc. Ne o lásku."
 mpo_nerge_promised_feast_failed: "Plané sliby o hostině"
 mpo_nerge_promised_feast_failed_desc: "Tato postava slibovala urozeným lovcům celé hory znamenitého masa. Ze svých slibů však nesplnila nic."
 jamukha_temujin_response_warning_tt: "@warning_icon! #X [temujin.GetShortUIName|U] může poškodit tvou @prestige_icon![Concept('prestige','prestiž')|E] a @dread_icon![Concept('dread','hrůzu')|E]#!"
 negotiate_togrul_alliance_effect_tooltip: "[jamukha.GetShortUIName|U] a [togrul.GetShortUIName] uzavřou vzájemnou [Concept('alliance','alianci')|E]"
 mpo_jamukha_flavor.0010.t: "Urážky, které žádný Mongol nesnese"
 mpo_jamukha_flavor.0010.desc: "Již nějakou dobu vedu svůj lid po boku [temujin.Custom('CZ_TitledFirstName_G')]. Věrně následuji každý jeho rozmar a vytrvávám, přestože mou mysl sužují pochybnosti.\n\nŽeny šeptají [temujin.Custom('CZ_FirstNameNoTooltip_D')] do ucha jedovatá slova. Jeho noční stráže si mě nepřátelsky měří pokaždé, když se blížím k jeho jurtě. Jak dlouho ještě dokážu snášet takové urážky?\n\n"
 mpo_jamukha_flavor.0010.desc_togrul: "A mocný [togrul.GetName] mi navíc slíbil svou ochranu, pokud se rozhodnu [temujin.Custom('CZ_FirstNameNoTooltip_A')] opustit..."
 mpo_jamukha_flavor.0020.t: "Muži se sny potřísněnými krví"
 mpo_jamukha_flavor.0020.desc: "V hluboké noci jsem vyjel do tábora [temujin.Custom('CZ_TitledFirstName_G')], spalován hněvem a hanbou. Hnal mě osud, temné myšlenky číhající daleko za hranicí světla, které dosud pronikalo do mé mysli.\n\nKdyž jsme byli s [temujin.Custom('CZ_FirstNameNoTooltip_I')] malí, společně jsme rozřezali mrtvého sviště. Jeho maso mi však všechna ta léta leželo v útrobách jako jed. Kdykoli si vzpomenu na naše sliby přátelství, ta slova mi spalují mysl a jako by mi zaživa strhávala kůži z tváře. #EMP Jak#! jsem mohl přísahat věrnost muži, jemuž je souzeno vládnout všem Mongolům? Vždyť právě to je #EMP můj#! osud! Svými dětskými sliby jsem sám sebe odsoudil k životu zrádce.\n\n#EMP „Zničím tě!“#! zařvu, zatímco [temujin.GetFirstNameNoTooltip] se pohrdavě ušklíbne. #EMP „Já, [ROOT.Char.GetFirstName], jsem chánem a všichni [ROOT.Char.GetDomicile.GetCulture.GetCollectiveNoun] jsou můj lid!“#!"
 mpo_jamukha_flavor.0010.a: "Musím naplnit svůj vlastní osud. Bez [temujin.Custom('CZ_FirstNameNoTooltip_G')]."
 mpo_jamukha_flavor.0010.b: "Mé slovo mě poutá stejně pevně jako meč zavěšený u pasu [temujin.Custom('CZ_FirstNameNoTooltip_G')]."
 jamukha_chose_loyalty_modifier: "Zvolena věrnost Temüdžinovi"
 jamukha_chose_loyalty_modifier_desc: "Džamucha prokázal, že je ušlechtilým a opravdovým přítelem, a to i za cenu vlastní hrdosti."
 jamukha_temujin_no_more_positive_tt: "@alert_icon! #X Všechny kladné [Concept('relations','zvláštní vztahy')|E] mezi #high tebou#! a [temujin.Custom('CZ_ShortUIName_I')] byly zrušeny"
 jamukha_temujin_rivals_tt: "[CZProDrop(temujin,'stala','stal')|U] tvým [Concept('rival','sokem')|E]"
 jamukha_gain_from_defectors_tt: "#weak Získáš @herd_icon![Concept('herd','stádo')|E] a @prestige_icon![Concept('prestige','prestiž')|E] díky Mongolům, kteří se shromažďují k válce#!"
 temujin_gain_from_defectors_tt: "$jamukha_gain_from_defectors_tt$"
 mpo_jamukha_flavor.0020.a: "#EMP „Ty prašivý pse, kterého jsem kdysi nazýval bratrem!“#!"
 mpo_jamukha_flavor.0020.b: "„Tvá smrt bude žalostná, [temujin.Custom('CZ_FirstNameNoTooltip_V')]...“"
 mpo_jamukha_flavor.0020.c: "„Na bitevním poli se #EMP tvůj osud stane mým!#!“"
 mpo_jamukha_flavor.0020.b_murder: "Získáš #P #EMP obrovský#!#! bonus k [Concept('schemes','intrikám')|E] typu [GetScheme('murder').GetTypeName] namířeným proti [temujin.Custom('CZ_ShortUIName_D')]"
 mpo_jamukha_flavor.0020.a_war_win: "Vítězství v #high útočné#! [Concept('war','válce')|EU] proti [temujin.Custom('CZ_ShortUIName_D')] ti přinese dodatečnou @legitimacy_icon![Concept('legitimacy','legitimitu')|E] a @prestige_icon![Concept('prestige','prestiž')|E]"
