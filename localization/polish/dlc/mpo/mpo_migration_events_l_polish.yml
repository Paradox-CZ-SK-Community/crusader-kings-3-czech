l_polish:
 migration_events.0001.t: "Místo, které můžeme nazývat domovem"
 migration_events.0001.desc.intro: "Když dorazíme do [CZProvName(ROOT.Char.GetCurrentLocation,'G')], bezmračné nebe se právě začíná barvit doruda. Do barvy čerstvé rány.\n\n"
 migration_events.0001.desc.drought: "Popraskaná země nás vítá nezdravě vybledlými barvami. Sucho se k tomuto kraji rozhodně nechovalo milosrdně.\n\n"
 migration_events.0001.desc.white_zud: "Pod kopyty našich koní křupe měkký sníh. Jeho vrstva je tak silná, že pod sebou pohřbila veškerou trávu.\n\n"
 migration_events.0001.desc.havsarsan_zud: "Déšť, sníh a prudký vítr. Počasí nás rozhodně nevítá tak přívětivě, jak jsme doufali.\n\n"
 migration_events.0001.desc.blessing: "Kam až oko dohlédne, krajinu pokrývají rozkvetlé květiny zalité slunečními paprsky. Zakloním hlavu a na okamžik se oddám jejich příjemnému teplu.\n\n"
 migration_events.0001.desc.tributary: "„Tyto země poctivě odvádějí tribut [overlord.Custom('CZ_TitledFirstName_D')],“ upozorní nás [recipient.GetTitledFirstName]. „A pochybuji, že by [Select_CString(overlord.IsFemale,'strpěla','strpěl')] něco jiného.“\n\n"
 migration_events.0001.desc.nomad: "„Dobře se o tuto zemi starejte,“ přivítá nás [recipient.GetTitledFirstName] u vchodu do osady, přestože většina jejích obyvatel už odešla.\n\n"
 migration_events.0001.desc.herder: "[recipient.GetTitledFirstName|U] s námahou pohání své skromné stádo a pomalu mizí v dálce.\n\n"
 migration_events.0001.desc.nomad_obedient: "„Můj [ROOT.GetCharacter.Custom('GetMongolHonorific')|l] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ vítá nás [recipient.GetTitledFirstName] u vchodu do osady. „Je mi velikou ctí nabídnout ti své země.“\n\n"
 migration_events.0001.desc.nomad_angry: "[recipient.GetTitledFirstName|U] uzavírá průvod opouštějící tábor. „Tak hodně štěstí,“ pronese chladně a připojí se k ostatním.\n\n"
 migration_events.0001.desc.good: "Vůně čerstvých pastvin je přesně tak slibná, jak jsem [Select_CString(ROOT.Char.IsFemale,'doufala','doufal')]. Tady se nám bude dařit."
 migration_events.0001.desc.bad: "Suché, zažloutlé pastviny odumírají pod krvavě rudým sluncem. Nebude to snadné, ale pohodlný život ještě nikdy nevychoval pořádného válečníka."
 migration_events.0001.desc.meh: "Zdejší pastviny nejsou tak kvalitní, jak bych si [Select_CString(ROOT.Char.IsFemale,'přála','přál')]. Ostatně, máloco v životě splní všechna naše očekávání."
 migration_events.0001.aaa: "Budu ctít zvyky této země."
 migration_events.0001.aa: "Před nikým nepokleknu."
 migration_events.0001.aa.cb_tt: "Získá proti tobě na #V 5#! let [Concept('casus_belli','casus belli')|E] #EMP $retaliation_cb$#!"
 migration_events.0001.a: "Konečně jsme dorazili na správné místo."
 migration_events.0001.a.tt: "Tato možnost je dostupná, protože jsi [Select_CString(ROOT.Char.IsFemale,'vyslyšela','vyslyšel')] doporučení, které ti poskytl [GetCourtPositionType('court_astrologer_court_position').GetName|l]"
 migration_events.0001.b: "Postavme stany."
 astrologer_desired_area_modifier: "Vytoužený cíl migrace"
 astrologer_desired_area_modifier_desc: "Protože tento lid následoval přání svého $court_astrologer_court_position$, je odhodlán věnovat novým pastvinám tu nejlepší možnou péči."
 msg_tributary_toast: "Nabídka tributu"
 msg_tributary_toast_tt: "[CZProDrop(new_tributary,'přesídlila','přesídlil')|U] do zemí obývaných jedním z tvých [Concept('tributaries','tributářů')|E] a [Select_CString(new_tributary.IsFemale,'podřídila','podřídil')] se ti"
 msg_tributary_toast_bad: "Odmítnutí tributu"
 msg_tributary_toast_bad_tt: "[CZProDrop(new_tributary,'přesídlila','přesídlil')|U] do zemí obývaných jedním z tvých [Concept('tributaries','tributářů')|E]\nNa #V 5#! let získáš proti [new_tributary.Custom('CZ_ShortUIName_A')] [Concept('casus_belli','casus belli')|E] $retaliation_cb$"
 migration_events.0002.t: "Migrace: Dobytá země"
 migration_events.0002.desc.intro: "Krev mi stéká po lokti a vsakuje se do půdy. Tyto nové země jsme vybojovali a brzy na nich vyrostou naše stany.\n\n"
 migration_events.0002.desc: "Předchozí vládce však odváděl tribut [overlord.Custom('CZ_TitledFirstName_D')] a nyní se od nás očekává totéž."
 migration_events.0002.desc.high_dominance: "Říká se, že [overlord.GetTitledFirstName] je suzerénem těchto zemí, neboť [recipient.GetTitledFirstName] [Select_CString(overlord.IsFemale,'jí','mu')] pravidelně [Select_CString(recipient.IsFemale,'odváděla','odváděl')] tribut. Jsme však stejně silní jako [overlord.GetTitledFirstName]. Proč bychom se měli plazit u [Select_CString(overlord.IsFemale,'jejích','jeho')] nohou a žebrat o ochranu?"
 migration_events.0002.a: "To je jedině spravedlivé."
 migration_events.0002.b: "Svou zemi jsem si [Select_CString(ROOT.Char.IsFemale,'vybojovala','vybojoval')]!"
 migration_events.0002.b.alt: "Ha! Jestli chce mé zlato, ať si pro něj přijde!"
 migration_events.1000.t: "Kousek zeleně"
 migration_events.1000.desc: "Koně mého kmene funí a odfrkují, nedočkaví, až ochutnají zdejší trávu. Tady, na území [ROOT.Char.GetCurrentLocation.GetTitle.Custom('CZ_LandedNameNoTier_G')], roste hustá a svěže zelená. Zdejší zámožní obyvatelé"
 migration_events.1000.desc.ruler_present: "podléhají [local_ruler.Custom('CZ_FirstName_D')], [Select_CString(local_ruler.IsFemale,'bezvýznamné','bezvýznamnému')] [local_ruler.Custom('CZ_TitleAsNameNoTooltip_D')] [local_ruler.GetCulture.Custom('CZ_Adjective_ee')|l] kultury."
 migration_events.1000.desc.ruler_away: "přísahají věrnost [local_ruler.Custom('CZ_TitledFirstName_D')] [local_ruler.GetCulture.Custom('CZ_Adjective_ee')|l] kultury, ačkoli po [Select_CString(local_ruler.IsFemale,'jejích','jeho')] jezdcích není nikde ani památky."
 migration_events.1000.desc_outro: "\n\nDostává se nám vřelého přivítání, nabízejí nám mléko a maso... ale z roztřesených hlasů místních zaznívá naléhavá prosba, abychom pokračovali v cestě."
 migration_events.1000.a: "Svišti, soboli... Zdejší kožešiny vypadají lákavě."
 migration_events.1000.a.flavor: "Vydáš se na lov místní zvěře."
 migration_events.1000.b: "„#EMP Dary! Tribut!#! Jinak se na vás vrhneme jako vlci!“"
 migration_events.1000.b.flavor: "Vynutíš si dary od zámožných místních obyvatel a vypleníš jejich tábor."
 migration_events.1000.c: "Mé stádo se tu nějaký čas popase."
 migration_events.1000.d: "Poděkuji za pohostinnost a znovu nasednu na koně."
 custom.every_consort: "Každá [Concept('spouse','choť')|E] a [Concept('concubine','konkubína')|E]"
 nomadic_comforts_modifier: "Pohodlí na kočovné cestě"
 nomadic_comforts_modifier_desc: "Tato neobvyklá kočovná postava dává před dlouhými hodinami v sedle přednost pohodlí a bezpečí."
 migration_events.1010.t: "Proč klusat, když se můžeš vézt?"
 migration_events.1010.desc: "Z veliké jurty na kolech, která se pod prapory z koňských ohonů tyčí uprostřed našeho průvodu, vychází [spouse.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('spouse'))|l].\n\n„Cožpak ten statný vůl zapláče, když mu k nákladu přibude váha [Select_CString(ROOT.Char.IsFemale,'jediné ženy','jediného muže')]?“ zazní otázka. „Ne? Tak proč by sis tedy [Select_CString(ROOT.Char.IsFemale,'nepřišla','nepřišel')] posedět se svou rodinou...?“\n\nNáš domov táhne hned několik takových volů. Uvnitř čekají měkké, vyhřáté podušky. Jenže ostatní jezdci mě sledují s neskrývaným odsudkem."
 migration_events.1010.a: "Mé tělo potřebuje odpočinek."
 migration_events.1010.b: "„Lásko moje... možná nás čeká #EMP pořádně hrbolatá cesta#!.“"
 migration_events.1010.c: "Vždy pojedu v čele. [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')|U] mě musí následovat."
 migration_events.1010.d: "Nastoupím dovnitř."
 migration_events.1010.d.flavor: "Po dlouhých hodinách v sedle zatouží i [Select_CString(ROOT.Char.IsFemale,'žena','muž')] po houpavém, drncavém pohodlí domova."
 migration_events.1020.t: "Pán pastevců"
 migration_events.1020.desc: "„[ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTier|U], tak se tomuhle místu říká!“ odfrkne [aspirant.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('aspirant'))|l]. „A kdo chrání zdejší stáda ovcí? Nějaký pes a [Select_CString(herder.IsFemale,'bezvýznamná ženská','bezvýznamný chlapík')] jménem [herder.GetTitledFirstName]!“\n\n„Pár koní, několik dobrých jezdců... #EMP [herder.Custom('CZ_FirstNameNoTooltip_D')|U] bych [Select_CString(aspirant.IsFemale,'sevřela','sevřel')] hrdlo mezi prsty#!... a všechno [CZTerrainObjIn(ROOT.Char.GetCurrentLocation.GetTerrain)|l] by mohlo být moje!“\n\n[aspirant.GetFirstNameNoTooltip|U] si chtivě prohlíží několik kolemjdoucích koz a čeká, až mu [aspirant.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))|l] dá své požehnání."
 migration_events.1020.a: "„Budeš mi odvádět tribut, [ROOT.Char.Custom2('CZ_RelationToMeShort_V', SCOPE.sC('aspirant'))].“"
 migration_events.1020.b: "„Jdi a ukaž jim moc rodu [ROOT.Char.GetHouse.GetNameNoTooltip]!“"
 migration_events.1020.b.flavor: "Postaráš se, aby si tvůj příbuzný v těchto zemích vybudoval pevné postavení."
 migration_events.1020.c: "„Vezmi si několik následovníků a rozluč se se svými příbuznými.“"
 migration_events.1020.d: "„Zůstaň se svým lidem, [aspirant.Custom('CZ_FirstNameNoTooltip_V')].“"
 migration_events.1030.t: "Neúrodná cesta"
 migration_events.1030.desc: "Ženeme dál nespočetné zástupy mých koní, krav, koz a ovcí. Kdybychom míjeli dobré pastviny, mohla by si zvířata odpočinout a dosyta se napást... Jenže na území [location_county.Custom('CZ_LandedNameNoTier_G')] je volné půdy s dostatkem trávy žalostně málo.\n\nZbytky pastvy přenecháváme mým nejlepším koním. Ostatní zvířata slábnou hlady."
 migration_events.1030.a: "Místní vládce nám své nejlepší pastviny #EMP poskytne#!."
 migration_events.1030.b: "[Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')] bych prodat ta nejslabší zvířata..."
 migration_events.1030.b.flavor: "Zvířata, která nabízíš, mají smrt na jazyku, ale [local_ruler.GetNameNoTooltip] se přesto možná nechá přesvědčit ke koupi."
 migration_events.1030.c: "Jestli mají zemřít... pak bude nejlepší je sníst."
 migration_events.1030.c.flavor: "Necháš porazit dobytek a uspořádáš hostinu pro svůj lid."
 migration_events.1030.d: "Musíme v této zemi najít dobré pastviny."
 migration_events.1030.d.success: "Dovedeš svá stáda na pastviny, kde se dosyta napasou"
 migration_events.1030.d.failure: "Nic nenajdeš a zvířata dál hladovějí"
 migration_events.1040.t: "Vřelé přijetí [CZPrepV(ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip)|l] [ROOT.Char.GetCurrentLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')]"
 migration_events.1040.desc: "S vřelým pozdravem ke mně přichází místní vládce, [local_ruler.GetName]. Kolem nás proudí [ROOT.Char.GetCulture.GetCollectiveNoun] se svými stády.\n\n„[ROOT.Char.Custom('CZ_TitleAsName_V')|U], neposadíš se ke mně a nepodělíš se se mnou o teplé jídlo?“ zeptá se [local_ruler.GetFirstNameNoTooltip], jak velí zdejší zvyk pohostinnosti vůči poutníkům.\n\nSlužebnictvo mi předkládá dary:"
 migration_events.1040.furs: "ozdoby vyřezávané z paroží, kožešiny a mladého, temperamentního valacha."
 migration_events.1040.camels: "chladivou vodu z místního pramene a řadu vysokých velbloudů."
 migration_events.1040.wool: "pláště z jemné vlny, několik ovcí a kozu vysokou jako hřebec."
 migration_events.1040.horses: "uzdy z kvalitní kůže a dvojici statných koní."
 migration_events.1040.a: "„#EMP Tohle#! je všechno...? Víc mi nedáš...?“"
 migration_events.1040.b: "S radostí oplatím dar darem."
 migration_events.1040.c: "Na tebe nemám čas, [Select_CString(local_ruler.IsFemale,'bezvýznamná','bezvýznamný')] [local_ruler.Custom('CZ_TitleAsNameNoTooltip_V')]."
 migration_events.1040.d: "Najím se."
 mpo_refusing_diplomatic_stops_modifier: "Odmítání diplomatických zastávek"
 mpo_refusing_diplomatic_stops_modifier_desc: "Tato kočovná postava žene svůj lid neustále kupředu, bez ohledu na přátelsky naladěné místní obyvatele a jejich tradiční projevy pohostinnosti."
 cultural_acceptance_meal_of_hospitality: "Pohostinnost vůči migrujícím a poutníkům"
 migration_raiding_effect_tt: "[Concept('holdings','Državy')|EU], kterými během [Concept('migrate','migrace')|E] projdeš, ti poskytnou @gold_icon![Concept('gold','zlato')|E] a @herd_icon![Concept('herd','stádo')|E], ale zhorší se [Concept('opinion','mínění')|E] jejich [Concept('holder','držitele')|E] o tobě i vzájemné [Concept('cultural_acceptance','kulturní přijetí')|E]"
 migration_raiding_effect_no_culture_tt: "[Concept('holdings','Državy')|EU], kterými během [Concept('migrate','migrace')|E] projdeš, ti poskytnou @gold_icon![Concept('gold','zlato')|E] a @herd_icon![Concept('herd','stádo')|E], ale zhorší se [Concept('opinion','mínění')|E] jejich [Concept('holder','držitele')|E] o tobě"
 cultural_acceptance_recompense_for_raiding: "Odškodnění za násilí"
 cultural_acceptance_raiding_migrators: "Plenění a drancování migrujících"
 migration_events.1051_title: "Plenění během migrace"
 migration_events.1051_tooltip: "Tvůj lid vyplení [raided_settlement.Custom('CZ_LandedName_A')]."
 migration_events.1050.t: "Procházejí jako oheň"
 migration_events.1050.desc: "Předsunutí jezdci mého lidu, rozptýlení daleko před našimi stády a vozy, se plíží krajinou jako panteři na lovu.\n\n„Místní na nás vystřelili první šíp!“ hlásí [warrior.GetFirstName], velitel mých předsunutých jezdců. „Ale ohněm a mečem jsme je přinutili toho litovat! Přivážíme ti veškerou kořist z jejich tábora... a také tento [newly_created_artifact.GetName]!“"
 migration_events.1050.a: "Taková zuřivost si zaslouží odměnu."
 migration_events.1050.b: "„#EMP Vrhěte se na každý příbytek, který cestou potkáme, mí válečníci!#!“"
 migration_events.1050.c: "Vraťte kořist a proste jejich pána o odpuštění."
 migration_events.1050.d: "Rozdělím kořist mezi své válečníky."
 migration_events.1050.e: "Kořist [CZPrepZ(ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip)] [ROOT.Char.GetCurrentLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] připadne mně."
 migration_events.1060.t: "Pomalí jako ovce"
 migration_events.1060.desc_desert: "Zvířata v mém stádě sužuje žízeň, ale při našem putování přes [root_location.GetName] nacházíme jen žalostně málo vody. Pod spalujícím sluncem se vlečeme kupředu, krok za krokem."
 migration_events.1060.desc_forest: "Stromy na území [root_location.GetName] stojí těsně vedle sebe jako pěší válečníci v bitevní řadě a podrost je ještě hustší. Trnité keře zachytávají a trhají vlnu našich ovcí. Své stádo musíme hnát úzkou stezkou."
 migration_events.1060.desc_wetlands: "Naše cesta přes [root_location.GetName] připomíná putování útrobami obrovského tvora. Všude jen páchnoucí, lepkavé bahno a kaluže odporné vody. Zvířata se s žalostným bečením a bučením brodí močály a na každém kroku klopýtají. Mí lidé je musí znovu a znovu vytahovat z bažin."
 migration_events.1060.desc_hilly: "Cesta přes [root_location.GetName] se vine do prudkých svahů a zase klesá do úzkých soutěsek. Vyčerpává lidi i zvířata. Pastevci se opírají rameny do vzpurného dobytka, křičí a tahají ho vpřed, ale vysílená zvířata už sotva dokážou stoupat."
 migration_events.1060.desc_winter: "Bílý sníh dusí krajinu na území [root_location.GetName] a každý krok vpřed si musíme vybojovat namáhavým broděním v mrazu. Zvířata se k sobě tisknou, aby se zahřála, ale hlad je stále více zpomaluje."
 migration_events.1060.desc: "\n\n[warrior.GetFirstName|U], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('warrior'))|l], už nemá s tímto žalostným tempem nejmenší trpělivost.\n\n„Dovol mi shromáždit naše nejmladší jezdce!“ prosí. „Tryskem bychom dojeli do [destination.Custom('CZ_LandedNameNoTier_G')] a připravili vše na tvůj příjezd. Tahle dřina, to nekonečné postrkování volů a koz, je pod důstojnost tvých válečníků!“"
 migration_events.1060.a: "Najdu schůdnější a rychlejší cestu."
 mpo_migration_events.1060.a.success: "Dovedeš svůj lid na méně náročnou cestu"
 mpo_migration_events.1060.a.failure: "Vyčerpávající a pošetilá zacházka"
 migration_events.1060.b: "„Jeďte napřed, prozkoumejte náš nový domov a dobře jej připravte.“"
 migration_events.1060.c: "„Zůstaňte a pomozte slabým. Potřebují vaši sílu.“"
 mpo_migration_prepared_home_modifier: "Dobře připravený nový domov"
 mpo_migration_prepared_home_modifier_desc: "Byla nalezena nejvhodnější místa pro kočovná sídliště a odstraněny místní překážky bránící jejich osídlení."
 mpo_migrating_accolade_duke_modifier: "Kočovná válečná družina"
 mpo_migrating_accolade_king_modifier: "$mpo_migrating_accolade_duke_modifier$"
 mpo_migrating_accolade_emperor_modifier: "$mpo_migrating_accolade_duke_modifier$"
 mpo_migrating_without_labor_modifier: "Migrace bez pracovních sil"
 mpo_migrating_without_labor_modifier_desc: "Tato postava vede svůj lid krajinou bez pomoci mladých válečníků, jejichž síla by jinak usnadnila přesun celého tábora."
 mpo_found_paths_for_herds_modifier: "Schůdné cesty pro stáda"
 mpo_found_paths_for_herds_modifier_desc: "Tento moudrý vůdce vede svá stáda s rozvahou a díky důkladné znalosti krajiny vybírá ty nejvhodnější cesty."
