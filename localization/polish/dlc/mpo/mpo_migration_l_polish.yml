 nomadic_migration_contract_request: "Tato [GetPlayer.Custom('GetContractOrIssueGameConcept')|l] vyžaduje, abys vyřešil nepokoje na území [CZProvName(TaskContract.GetLocation,'G')]"
 migration_contract_county_ownership_text: "Toto [Concept('county','hrabství')|E] již není součástí našeho [Concept('realm','panství')|E]"
 migration_contract_county_text: "Toto [Concept('county','hrabství')|E] již netrpí nízkou [Concept('county_control','kontrolou hrabství')|E]"
 migration_contract_county_alt_text: "Toto [Concept('county','hrabství')|E] se již s touto záležitostí nepotýká"
 ongoing_settlement_contract: "Probíhající zakázka na osídlení"
 nomadic_migration_contract_1_contract: "$nomadic_migration_contract_1_desc_title$"
 nomadic_migration_contract_1_desc_title: "Vzpurní pastevci"
 nomadic_migration_contract_1_desc: "Od chvíle, kdy jsme se usadili na území [CZProvName(TaskContract.GetLocation,'G')], dochází podle [TaskContract.GetEmployer.Custom('CZ_Name_G')] k opakovaným střetům se skupinou místních pastevců. Jejich provokace trvají už příliš dlouho. Nastal čas učinit těmto nepokojům přítrž."
 nomadic_migration_contract_1_request: "$nomadic_migration_contract_request$"
 mpo_contract_events.0005.t: "$nomadic_migration_contract_1_desc_title$"
 mpo_contract_events.0005.desc: "Stačí jen několik okamžiků rozhovoru s jedním z pastevců v Karakorumu a pochopím, v čem spočívá jádro sporu. [herder_character.GetName|U] tvrdí, že společenství, k němuž patří, obývá tyto země již po celé generace. Teprve od našeho příchodu však začalo trpět nedostatkem potravin.\n\nPastevci odmítají opustit domov svých předků, ale rázná ukázka moci by je mohla přesvědčit, aby změnili názor. Ovšem pokud bychom chtěli, jistě by se našel způsob, jak jejich přítomnosti využít v náš prospěch."
 mpo_contract_events.0005.a: "Přidejte se ke mně. Společně budeme silnější."
 mpo_contract_events.0005.a.impressed: "Podaří se nám dosáhnout dohody"
 mpo_contract_events.0005.a.unimpressed: "Naše argumenty je nepřesvědčí"
 mpo_contract_events.0005.b: "Pracujte pro mě a já vyřeším vaše problémy s potravinami."
 mpo_contract_events.0005.c: "Vyžeňte je z #EMP našich#! zemí."
 nomadic_migration_contract_2_contract: "$nomadic_migration_contract_2_desc_title$"
 nomadic_migration_contract_2_desc_title: "Divoké stádo"
 nomadic_migration_contract_2_desc: "Po polích v okolí [CZProvName(TaskContract.GetLocation,'G')] se nekontrolovaně potuluje divoké stádo. Dokud tato zvířata necháme bez povšimnutí, budou tím trpět naše vlastní stáda."
 nomadic_migration_contract_2_request: "$nomadic_migration_contract_request$"
 mpo_si_slaughtered_for_a_feast: "Bohatá hostina"
 mpo_si_slaughtered_for_a_feast_desc: "Tato postava přinesla svému lidu tolik masa, že z něj lze uspořádat skutečně velkolepou hostinu."
 migration_contract_2_herd_reward_tt: "#V Získáš#! [herd_i] #P [SCOPE.ScriptValue('miniscule_herd_value_static')]-[SCOPE.ScriptValue('minor_herd_value_static')]#! [Concept('herd','stáda')|EU]"
 mpo_contract_events.0015.t: "$nomadic_migration_contract_2_desc_title$"
 mpo_contract_events.0015.desc: "Už z dálky je pohled na pasoucí se divoké stádo ohromující. Zvířata nenasytně spásají všechnu trávu a našim vlastním stádům tak zbývá jen málo prostoru k pastvě a rozmnožování.\n\nVyděšení pastevci mě žádají, abych s těmito zvířaty něco udělal, než naše stáda začnou hladovět a hynout."
 mpo_contract_events.0015.a: "Několik těch zvířat odchytím a připojím k našim stádům."
 mpo_contract_events.0015.a.successful: "Odchytíš velkou část divokého stáda"
 mpo_contract_events.0015.a.failure: "Odchytíš jen malou část divokého stáda"
 mpo_contract_events.0015.b: "Porazte je a připravte menší hostinu."
 mpo_contract_events.0015.c: "Ta zvířata nám vynesou pěkné jmění."
 nomadic_migration_contract_3_contract: "$nomadic_migration_contract_3_desc_title$"
 nomadic_migration_contract_3_desc_title: "Spor o pastviny"
 nomadic_migration_contract_3_desc: "Moji [TaskContract.GetTaker.Custom('KnightCulturePluralNoTooltip')|l] se již nějakou dobu přou o nejlepší pastviny v okolí [CZProvName(TaskContract.GetLocation,'G')]. Jejich spor postupně přerostl v hluboké nepřátelství a uražená hrdost nyní brání oběma stranám ustoupit."
 nomadic_migration_contract_3_request: "$nomadic_migration_contract_request$"
 mpo_contract_events.0025.t: "$nomadic_migration_contract_3_desc_title$"
 mpo_contract_events.0025.desc: "Od chvíle, kdy jsme přesídlili na území [CZProvName(task_contract.GetLocation,'G')], mezi [task_contract.GetEmployer.Custom('CZ_FirstName_I')] a [knight_2.Custom('CZ_FirstName_I')] vedou neustálé spory o nedaleké pastviny.\n\nZpočátku šlo jen o drobnou nepříjemnost, ale neshody postupně přerostly v otevřené nepřátelství. Ani jedné straně už hrdost nedovoluje ustoupit. [Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych zasáhnout, než se spor ještě více vyhrotí a začne podkopávat morálku celého tábora."
 mpo_contract_events.0025.a: "[task_contract.GetEmployer.GetFirstNameNoTooltip|U] má pravdu, ta země je [Select_CString(task_contract.GetEmployer.IsFemale,'její','jeho')]."
 mpo_contract_events.0025.b: "Vlastně má [knight_2.GetFirstNameNoTooltip] přesvědčivější argumenty."
 mpo_contract_events.0025.c: "Na těch pastvinách se bude dařit mému vlastnímu stádu."
 nomadic_migration_contract_4_contract: "$nomadic_migration_contract_4_desc_title$"
 nomadic_migration_contract_4_desc_title: "Nedostatek nástrojů"
 nomadic_migration_contract_4_desc: "Migrace na území [CZProvName(TaskContract.GetLocation,'G')] značně vyčerpala naše zásoby materiálu a nástrojů. Pokud je brzy nedoplníme, náš kmen to nepochybně pocítí."
 nomadic_migration_contract_4_request: "$nomadic_migration_contract_request$"
 mpo_contract_events.0035.t: "$nomadic_migration_contract_4_desc_title$"
 mpo_contract_events.0035.desc: "Poslední migrace na území [CZProvName(task_contract.GetLocation,'G')] můj lid značně vyčerpala. Nyní nám chybí mnoho základních nástrojů, které každodenně potřebujeme. Kvůli jejich nedostatku trvají i ty nejjednodušší práce mnohem déle.\n\nPokud nenajdeme obchodníka, který nám potřebné zboží přiveze, budou mí lidé strádat i nadále."
 mpo_contract_events.0035.a: "Naši obchodníci se o to postarají."
 mpo_contract_events.0035.b: "Najdeme obchodníka, který nám potřebné nástroje obstará."
 mpo_contract_events.0035.c: "Mé jméno je známé široko daleko. Někdo už se toho ujme."
 mpo_contract_events.0035.d: "Lidé se budou muset obejít bez nich."
 EVENT_WINDOW_OPTION_AVAILABLE_TRADE_YURT: "Tato možnost je dostupná díky budově [GetDomicileBuilding('trade_yurt_01').GetName|l]"
 mpo_si_lacking_tools: "Nedostatek nástrojů"
 mpo_si_lacking_tools_desc: "Lidu této postavy chybí nástroje nezbytné k řádné péči o vlastní klan."
 mpo_si_lacking_tools_2: "$mpo_si_lacking_tools$"
 mpo_si_lacking_tools_2_desc: "$mpo_si_lacking_tools_desc$"
 mpo_si_lacking_tools_3: "$mpo_si_lacking_tools$"
 mpo_si_lacking_tools_3_desc: "$mpo_si_lacking_tools_desc$"
 nomadic_migration_contract_5_contract: "$nomadic_migration_contract_5_desc_title$"
 nomadic_migration_contract_5_desc_title: "Rozdrobení kmene"
 nomadic_migration_contract_5_desc: "Kmen usazený na území [CZProvName(TaskContract.GetLocation,'G')] ztratil spojení se zbytkem lidu pod mým vedením a nyní požaduje vlastního místního náčelníka."
 nomadic_migration_contract_5_request: "$nomadic_migration_contract_request$"
 mpo_contract_events.0045.t: "$nomadic_migration_contract_5_desc_title$"
 mpo_contract_events.0045.desc: "Kmen usazený na území [CZProvName(task_contract.GetLocation,'G')] byl už před naším příchodem poněkud odtržený od zbytku [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedName_G')]. Nyní se zdá, že jeho příslušníci touží po ještě větší nezávislosti a především po vlastním náčelníkovi.\n\nKdyž dorazím, jejich jménem vystupuje [new_chieftain.GetFirstName], [Select_CString(new_chieftain.IsFemale,'místní žena','místní muž')], [Select_CString(new_chieftain.IsFemale,'která působí rozumně a je ochotná','který působí rozumně a je ochotný')] přísahat mi poslušnost, pokud [Select_CString(new_chieftain.IsFemale,'její','jeho')] lid bude smět žít podle vlastních zvyklostí."
 mpo_contract_events.0045.a: "Můžeme se přece dohodnout."
 mpo_contract_events.0045.a.successful: "Podaří se mi je přesvědčit"
 mpo_contract_events.0045.a.failure: "Nedokážu je přesvědčit"
 mpo_contract_events.0045.b: "Tak [new_chieftain.GetFirstNameNoTooltip]? Ať jim tedy vládne."
 mpo_contract_events.0045.b.tt: "Na území [CZProvName(task_contract.GetLocation,'G')] může vzniknout [Concept('divergent_culture','odštěpená kultura')|E] vycházející z [task_contract.GetLocation.GetCulture.Custom('CZ_Adjective_ee')|l] kultury"
 mpo_contract_events.0045.c: "Malý dar jim připomene vše, co pro ně dělám."
 mpo_contract_events.0045.d: "Časem si zvyknou."
 mpo_si_accepting_cultures: "Přijetí rozdrobení kmene"
 mpo_si_accepting_cultures_desc: "Tato postava se smířila s tím, že se od jejího kmene oddělují další kmenová společenství."
 nomadic_migration_contract_6_contract: "$nomadic_migration_contract_6_desc_title$"
 nomadic_migration_contract_6_desc_title: "Jedovaté pastviny"
 nomadic_migration_contract_6_desc: "Zdá se, že země v okolí [CZProvName(TaskContract.GetLocation,'G')] má na naše zdejší stádo zhoubný vliv. Od chvíle, kdy jsme se tu usadili, postihla zvířata jakási nemoc, která je připravuje o síly."
 nomadic_migration_contract_6_request: "$nomadic_migration_contract_request$"
 mpo_contract_events.0055.t: "$nomadic_migration_contract_6_desc_title$"
 mpo_contract_events.0055.desc: "Naše stádo slábne. Zvířata, která dříve kráčela pevným krokem, se nyní nejistě potácejí. Když si stádo prohlížím, spatřím několik kusů, které jen bezvládně leží na zemi a nemají sílu se ani pohnout.\n\nPokud se nemoc bude šířit dál, hrozí, že nakonec zachvátí celé naše stádo na území [CZProvName(task_contract.GetLocation,'G')]. Co by se pak stalo s naším kmenem?"
 mpo_contract_events.0055.a: "Zvířata to překonají. Osobně se o to postarám."
 mpo_contract_events.0055.a.successful: "Stádo se uzdraví"
 mpo_contract_events.0055.a.failure: "Stav stáda se zhorší"
 mpo_contract_events.0055.b: "Vyšlu posly, aby našli někoho, kdo dokáže zvířatům pomoci."
 mpo_contract_events.0055.c: "Porazte nemocná zvířata, než se nákaza rozšíří ještě dál."
 mpo_si_slaughtered_animals: "Zásoby masa"
 mpo_si_slaughtered_animals_desc: "Tato postava si vytvořila značné zásoby masa.\n#emp Odstraní se při příštím uspořádání [CZActivity('activity_feast','G')]#!\n\nNáklady na [CZActivity('activity_feast','A')]: #P [gold_i]-50%#!"
 nomadic_migration_contract_7_contract: "$nomadic_migration_contract_7_desc_title$"
 nomadic_migration_contract_7_desc_title: "Problémoví sousedé"
 nomadic_migration_contract_7_desc: "Jezdci ze sousedního kmene se bezostyšně prohánějí po území [CZProvName(TaskContract.GetLocation,'G')] a přivádějí s sebou početné stádo zvířat."
 nomadic_migration_contract_7_request: "$nomadic_migration_contract_request$"
 mpo_contract_events.0065.t: "$nomadic_migration_contract_7_desc_title$"
 mpo_contract_events.0065.desc: "Je jich sice jen hrstka, ale jezdci, jejichž domovem je [neighbor_leader.GetPrimaryTitle.GetBaseName], se bez sebemenších rozpaků prohánějí po území [CZProvName(task_contract.GetLocation,'G')] a ženou před sebou početné stádo. Zdá se, že pátrali po zatoulaných zvířatech právě ve chvíli, kdy jsme se zde usadili.\n\nAčkoli jim tato země při příchodu mohla připadat opuštěná, nemohu jim dovolit jen tak projíždět mým panstvím.\n\n#bold Tyto pastviny patří mému stádu, a pouze mému stádu!#!"
 mpo_contract_events.0065.a: "Necháme je pokojně odejít, ale budou muset zaplatit."
 mpo_contract_events.0065.a.successful: "Zaplatí požadovanou cenu"
 mpo_contract_events.0065.a.failure: "Nepodaří se nám je zastavit"
 mpo_contract_events.0065.b: "Tohle je #emp naše#! země a tamto jsou #emp naše#! stáda."
 mpo_contract_events.0065.c: "Nechte je být."
 nomadic_migration_contract_8_contract: "$nomadic_migration_contract_8_desc_title$"
 nomadic_migration_contract_8_desc_title: "Co po nich zůstalo"
 nomadic_migration_contract_8_desc: "Zdá se, že jsme narazili na pozůstatky po lidech, kteří tuto oblast obývali před námi. V okolí našeho nového tábora na území [CZProvName(TaskContract.GetLocation,'G')] se potuluje stádo zvířat a stojí zde několik poničených jurt."
 nomadic_migration_contract_8_request: "$nomadic_migration_contract_request$"
 mpo_contract_events.0075.t: "$nomadic_migration_contract_8_desc_title$"
 mpo_contract_events.0075.desc: "Když procházím krajinou [barony_location.Custom('HoldingNoHoldingTerrainRoaming')|l], narazím na napůl ochočené stádo, které naši lidé již několikrát spatřili. Stačí se ke zvířatům přiblížit, abych [Select_CString(ROOT.Char.IsFemale,'poznala','poznal')], že byla kdysi zvyklá na lidskou přítomnost.\n\nPokud je necháme napospas osudu, budou dál spásat pastviny, které by mohly sloužit našim vlastním stádům. Mám je přivést zpátky do [CZProvName(ROOT.Char.GetCapitalLocation,'G')], nebo s nimi naložit jinak? Jaké řešení bude pro můj lid nejlepší?"
 mpo_contract_events.0075.a: "Budou skvělým přírůstkem do našich stád."
 mpo_contract_events.0075.b: "Vyžeňte je z [CZProvNameNoTooltip(task_contract.GetLocation,'G')]."
 mpo_contract_events.0075.c: "Porazte ta zvířata."
 nomadic_migration_contract_9_contract: "$nomadic_migration_contract_9_desc_title$"
 nomadic_migration_contract_9_desc_title: "Vymezení hranic"
 nomadic_migration_contract_9_desc: "Od chvíle, kdy jsme se usadili na území [CZProvName(TaskContract.GetLocation,'G')], panují neshody ohledně některých z nejlepších okolních pastvin. [TaskContract.GetEmployer.GetName|U] se neúspěšně pokouší spor mezi kmeny urovnat."
 nomadic_migration_contract_9_request: "$nomadic_migration_contract_request$"
 mpo_contract_events.0085.t: "$nomadic_migration_contract_9_desc_title$"
 mpo_contract_events.0085.desc: "[task_contract.GetEmployer.GetName|U] mi celou záležitost podrobně vylíčí. Zdá se, že po našem příchodu zabral nejlepší pastviny jako první kmen z [other_county.Custom('CZ_LandedName_G')], ačkoli leží mnohem blíže k [CZProvName(task_contract.GetLocation,'D')].\n\nPřestože se [task_contract.GetEmployer.GetName] pokouší mezi oběma stranami zprostředkovat dohodu, veškeré snahy vyšly naprázdno. Ať rozhodnu jakkoli, jedna ze stran bude zklamaná. Rozhodnutí však musí padnout co nejdříve."
 mpo_contract_events.0085.a: "Pastviny připadnou [CZProvNameNoTooltip(task_contract.GetLocation,'D')]."
 mpo_contract_events.0085.b: "Patří [other_county.Custom('CZ_LandedNameNoTooltip_D')]."
 mpo_si_spurned_tribe: "Odmítnutý kmen"
 nomadic_migration_contract_10_contract: "$nomadic_migration_contract_10_desc_title$"
 nomadic_migration_contract_10_desc_title: "Původní kmen"
 nomadic_migration_contract_10_desc: "K našemu táboru na území [CZProvName(TaskContract.GetLocation,'G')] přicházejí zástupci malých společenství, která tuto oblast obývala již před naší migrací."
 nomadic_migration_contract_10_request: "$nomadic_migration_contract_request$"
 mpo_contract_events.0095.t: "$nomadic_migration_contract_10_desc_title$"
 mpo_contract_events.0095.desc: "K mému táboru přichází [new_chieftain.GetName], [Select_CString(new_chieftain.IsFemale,'vůdkyně','vůdce')] pouhé hrstky lidí. Mluví neznámým nářečím, ale o svém lidu a útrapách, jimiž prošel, vypráví s hrdostí a odhodláním.\n\n#emp „[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')], pokud pro nás najdeš místo mezi svými jurtami, nabídneme ti své stádo a já ti budu osobně sloužit. Pokud ne... V těchto zemích už pro nás mnoho nezbývá.“#!"
 mpo_contract_events.0095.a: "Přijmeme je mezi sebe."
 mpo_contract_events.0095.b: "Tady nemají co pohledávat. Zbavte se jich."
 mpo_si_old_tribe: "Cizí kmen"
 herd_starvation_title: "Stádo hladoví!"
 herd_starvation_custom_tooltip: "@alert_icon! #alert_trial Pokud nebudeš [Concept('migrate','migrovat')|E] do nových zemí, každé #V 3#! roky budeš ztrácet část [Concept('herd','stáda')|E]#!"
