 MIGRATE_HUD_BUTTON: "#T Migrace#!\n\nJako [Concept('ruler','vládce')|E] s [GetGovernment( 'nomad_government' ).GetName|l] bys [Select_CString(GetPlayer.IsFemale,'měla','měl')] [Concept('migrate','migrovat')|E], pokud je [Concept('domain_fertility','úrodnost tvé domény')|E] nízká.\n\n[Concept('realms','Panství')|EU] s rozsáhlou [Concept('domain','doménou')|E] a vysokou [Concept('dominance','dominancí')|E] už migrovat nemusí, protože jejich [Concept('fertility_equilibrium','rovnováha úrodnosti')|E] je dostatečně vysoká, aby umožňovala další růst.\n\n#I Kliknutím naplánuješ [Concept('migration','migraci')|E]#!"
