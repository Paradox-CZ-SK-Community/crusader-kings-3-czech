l_polish:
 mpo_migration_travel_events.0001.t: "[ruler.Custom('CZ_FirstNamePossessiveNoTooltip_M')|U] „dar“"
 mpo_migration_travel_events.0001.desc: "Přichází ke mně [Select_CString(messenger.IsFemale,'pastýřka','pastýř')] se stádem ovcí a zdraví mě: „Buď zdráv, [ROOT.Char.GetTitledFirstNameNoTooltip]!“\n\n„[Select_CString(ruler.IsFemale,'Má','Můj')] [ruler.GetTitleAsNameNoTooltip|l] [ruler.GetFirstName] se mnou sleduje, jak se tvé stádo den ode dne zmenšuje. Přijmi prosím toto malé stádo jako dar. Na oplátku [Select_CString(ruler.IsFemale,'má paní žádá','můj pán žádá')] jen drobnou laskavost.“"
 mpo_migration_travel_events.0001.a: "Pokorně přijímám [Select_CString(ruler.IsFemale,'její','jeho')] dar."
 mpo_migration_travel_events.0001.b: "Vyřiď [ruler.Custom('CZ_FirstNameNoTooltip_D')], že nemám zájem."
 mpo_migration_travel_events.0010.t: "Příliš početné stádo"
 mpo_migration_travel_events.0010.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], přece se neodvážíš hnát tak obrovské stádo přes step!“ zvolá [messenger.GetFirstName]. „Naši pastýři se s ním už tak dlouho potýkají. Tolik zvířat přece nemůžeš potřebovat!“\n\n[messenger.GetFirstNameNoTooltip|U] se znovu uklidní. „Raději tě prosím, abys část zvířat věnoval některému ze svých poddaných. Už jen tím bys ulevil našim přetíženým pastvinám. [vassal_1.GetTitledFirstName|U] ti věrně slouží, ale také [vassal_2.GetTitledFirstName] by jistě [Select_CString(vassal_2.IsFemale,'ocenila','ocenil')] takové gesto od [Select_CString(ROOT.Char.IsFemale,'své nové vládkyně','svého nového vládce')].“"
 mpo_migration_travel_events.0010.a: "Ať [vassal_1.GetFirstNameNoTooltip] dostane část stáda jako dar na rozloučenou."
 mpo_migration_travel_events.0010.b: "Raději investuji do zemí [vassal_2.Custom('CZ_FirstNameNoTooltip_G')]."
 mpo_migration_travel_events.0010.c: "Přebytečná zvířata necháme za sebou."
 mpo_migration_travel_events.0010.d: "Tohle je mé stádo a vezmu si ho celé s sebou."
 no_longer_herd_limit_tt: "Tvé [Concept('herd','stádo')|E] již nepřekračuje povolený limit."
 nomad_keep_herd_modifier: "Stagnující stádo"
 nomad_keep_herd_modifier_desc: "Stádo této postavy se rozrostlo do značné velikosti a jeho další rozšiřování bude stále obtížnější."
 mpo_migration_travel_events.0020.t: "Neúrodné země"
 mpo_migration_travel_events.0020.desc: "Naše stádo pokračuje v cestě, když průzkumníci přinášejí znepokojivé zprávy. V [target_title.Custom('CZ_LandedNameNoTier_L')] je trávy poskrovnu, a právě tam se přitom hodláme usadit. Tamní krajina působí téměř neobyvatelně."
 mpo_migration_travel_events.0020.a: "Navzdory všemu bude [target_title.GetNameNoTierNoTooltip] naším domovem."
 mpo_migration_travel_events.0020.b: "Zpátky! Tam bychom nepřežili!"
 mpo_migration_travel_events.0020.c: "Když zmenšíme stádo, možná se nám podaří přežít."
 mpo_migration_travel_events.0020.d: "Kéž nám [ROOT.Char.GetFaith.FertilityGodName] pomůže!"
 mpo_migration_travel_events.0020.d_tt: "Požádáš [astrologer.Custom('CZ_FirstName_A')], aby se [Select_CString(astrologer.IsFemale,'pomodlila','pomodlil')] za úrodnost země."
 mpo_migration_travel_events.0020.win: "Modlitby [astrologer.Custom('CZ_FirstName_G')] byly vyslyšeny!"
 mpo_migration_travel_events.0020.lose: "Modlitby [astrologer.Custom('CZ_FirstName_G')] nepřinesly žádný užitek"
 mpo_migration_travel_events.0030.t: "$travel_danger_prefix$ Nákaza ve stádě"
 mpo_migration_travel_events.0030.desc: "Na vyčerpaném koni ke mně přijíždí [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('messenger'))|l]. Ve tváři má vepsané hluboké obavy.\n\n„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], naše stádo zachvátila nemoc! Zvířata umírají a nákaza se každým dnem šíří. Prosím, pomoz nám, jinak nám nezůstane vůbec nic!“ naléhá [messenger.GetFirstName].\n\nZatímco naslouchám této zoufalé prosbě, v dálce spatřím nemocná zvířata. Dokonce i kůň [messenger.Custom('CZ_FirstName_G')] neklidně frká a podivně oddechuje."
 mpo_migration_travel_events.0030.a: "Porazte všechna nemocná zvířata, ať se nákaza nešíří."
 mpo_migration_travel_events.0030.b: "Možná některý z místních pastýřů tuto nemoc zná."
 mpo_migration_travel_events.0030.b_good: "Pastýřova léčba se ukáže jako neocenitelná"
 mpo_migration_travel_events.0030.b_bad: "Pastýřova léčba téměř nepomůže"
 mpo_migration_travel_events.0030.c: "Musíme počkat, až si příroda poradí sama."
 mpo_migration_travel_events.0030.c_none: "Nákazu se podaří zastavit"
 mpo_migration_travel_events.0030.c_medium: "Nákaza odezní jen s malými ztrátami"
 mpo_migration_travel_events.0030.c_massive: "Nákaza zdecimuje stádo"
 mpo_migration_travel_events.0030.c_major: "Nákaza stádo výrazně oslabí"
 nomad_weak_herd_modifier: "Oslabené stádo"
 nomad_weak_herd_modifier_desc: "Stádo této postavy bylo oslabeno nemocí."
 nomad_slow_horses_modifier: "Pomalí koně"
 mpo_migration_travel_events.0040.t: "Rozbouřená řeka"
 mpo_migration_travel_events.0040.desc: "Když se blížíme k řece nedaleko [county.Custom('CZ_LandedNameNoTier_G')], prudký hukot vody vyplaší mého koně. Hladina je zjevně příliš vysoko, než abychom mohli bezpečně přebrodit. Proud by mohl odnést ta nejmenší zvířata z našeho stáda.\n\nZdá se, že řeku nelze snadno obejít, a stádo je čím dál neklidnější."
 mpo_migration_travel_events.0040.a: "Tu vodu prostě překonáme!"
 mpo_migration_travel_events.0040.a_tt: "Přeženeš stádo přes řeku"
 mpo_migration_travel_events.0040.win: "Stádo bezpečně překročí řeku"
 mpo_migration_travel_events.0040.lose: "Proud ti odnese část zvířat"
 mpo_migration_travel_events.0040.b: "Na vorech se dostaneme bezpečně přes řeku."
 mpo_migration_travel_events.0040.b_flavor: "Postavíš vory, které pomohou stádu překonat řeku."
 mpo_migration_travel_events.0040.c: "Není někde poblíž brod?"
 mpo_migration_travel_events.0040.c_christian: "Když [ROOT.Char.GetFaith.HighGodName] dokáže rozdělit moře, jistě nám pomůže překročit i tuto řeku."
 mpo_migration_travel_events.0050.t: "Láska ve stepi"
 mpo_migration_travel_events.0050.desc: "V poslední době si všímám, že [courtier.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))|l], tráví více času mimo naše stádo než s námi. Když se chystáme vyrazit k dalšímu cíli, přichází ke mně s očima plnýma touhy.\n\n„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], [Select_CString(courtier.IsFemale,'našla','našel')] jsem zde svou životní lásku,“ přiznává [courtier.GetFirstNameNoTooltip]. „Chci opustit naše stádo a zůstat s [local.Custom('CZ_FirstName_I')]. Prosím, dovol mi odejít.“"
 mpo_migration_travel_events.0050.a: "Jdi, kam tě srdce táhne, [courtier.Custom('CZ_FirstNameNoTooltip_V')]."
 mpo_migration_travel_events.0050.b: "Opustit svého [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_A')] kvůli lásce? Cha!"
 mpo_migration_travel_events.0050.c: "Raději svou náklonnost věnuj mně, [courtier.Custom('CZ_FirstNameNoTooltip_V')]."
 mpo_migration_travel_events.0050.c_tt: "Pokusíš se svést [courtier.Custom('CZ_FirstNameNoTooltip_A')]"
 mpo_migration_travel_events.0050.win: "[courtier.GetFirstNameNoTooltip|U] podlehne tvému kouzlu"
 mpo_migration_travel_events.0050.lose: "[courtier.GetFirstNameNoTooltip|U] přesto odejde"
 mpo_migration_travel_events.0050.d: "Jak ses [Select_CString(courtier.IsFemale,'mohla','mohl')] zamilovat do někoho jiného?!"
 mpo_migration_travel_events.0060.t: "$travel_danger_prefix$ Splášený kůň"
 mpo_migration_travel_events.0060.desc: "Táborem se šíří panika. Jeden z koní se utrhne z úvazu a málem shodí [courtier.Custom('CZ_FirstName_A')] ze hřbetu. Možná jej dlouhá cesta připravila o rozum, možná ho někdo vyprovokoval. Teď zběsile pobíhá kolem a nedbá na nikoho, kdo se jej snaží uklidnit.\n\n[courtier.GetFirstNameNoTooltip|U] zděšeně vykřikne, když si uvědomí, že už nad zvířetem nemá žádnou kontrolu. S každým dalším vyhozením zadních nohou hrozí, že se neudrží v sedle."
 mpo_migration_travel_events.0060.a: "Rychle, zabijte toho koně!"
 mpo_migration_travel_events.0060.a_tt: "Obětuješ koně, abys zachránil [courtier.Custom('CZ_FirstNameNoTooltip_A')] a ostatní"
 mpo_migration_travel_events.0060.a_bad: "Kůň zemře"
 mpo_migration_travel_events.0060.a_bad_tt: "@death_icon!#n Jeden dvořan zemře#!"
 mpo_migration_travel_events.0060.win: "Koně se podaří uklidnit bez dalších potíží"
 mpo_migration_travel_events.0060.b: "Tohle zvládnu. Ustupte!"
 mpo_migration_travel_events.0060.tt: "Pokusíš se koně uklidnit"
 mpo_migration_travel_events.0060.lose: "Kůň se rozběhne do útoku"
 mpo_migration_travel_events.0060.c: "Doufejme, že [courtier.GetFirstNameNoTooltip] bude jedinou obětí..."
 mpo_migration_travel_events.0060.herd: "Kůň pošlape část stáda"
 mpo_migration_travel_events.0060.people: "Kůň pošlape další členy doprovodu"
 mpo_migration_travel_events.0060.people_tt: "#n Několik dalších lidí se může stát obětí splašeného koně#!"
