l_polish:
 mpo_storyteller_fantastical_creatures_modifier: "Bájná stvoření"
 mpo_storyteller_fantastical_creatures_modifier_desc: "Tato postava vyslechla příběhy o rozmanitých nebezpečných tvorech, na které je třeba si ve stepi dávat pozor."
 mpo_storyteller_humorous_tales_modifier: "Veselé příběhy"
 mpo_storyteller_humorous_tales_modifier_desc: "Tato postava vyslechla řadu humorných příběhů, které by rozesmály snad každého."
 mpo_storyteller_heroic_triumphs_modifier: "Hrdinská vítězství"
 mpo_storyteller_heroic_triumphs_modifier_desc: "Vyprávění o nezdolných válečnících a slavných bitvách probudilo v této postavě bojového ducha."
 mpo_whistling_is_difficult_modifier: "Marné hvízdání"
 mpo_whistling_is_difficult_modifier_desc: "Tato postava se pokoušela naučit hvízdat, ale zatím se jí to příliš nedaří."
 mpo_sufficient_liar_modifier: "Všechno promyšleno"
 mpo_sufficient_liar_modifier_desc: "Této postavě se podařilo přesvědčit své okolí, že jí patří past, a zajistit si tak prostředek k přežití v době hladu."
 mpo_trapped_fawn_modifier: "Koloběh života"
 mpo_trapped_fawn_modifier_desc: "Tato postava vysvobodila koloucha z pasti v naději, že jednou přispěje k zachování a rozšíření jelení populace."
 mpo_messenger_positive_liege_modifier: "Zpráva z bojiště"
 mpo_messenger_positive_liege_modifier_desc: "Tato postava obdržela od jednoho ze svých podřízených naléhavou zprávu, která jí umožnila včas se připravit."
 mpo_messenger_negative_liege_modifier: "Tápání ve tmě"
 mpo_messenger_negative_liege_modifier_desc: "K této postavě se nedostala životně důležitá zpráva, a proto ji následující události zastihly nepřipravenou."
 mpo_inspiring_tunes_modifier: "Povznášející melodie"
 mpo_inspiring_tunes_modifier_desc: "Tuto postavu povzbudily nostalgické melodie připomínající tradice a dědictví jejího lidu."
