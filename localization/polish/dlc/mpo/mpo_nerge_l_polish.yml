 mpo_nerge.0010.t: "Velký hon nerge začíná"
 mpo_nerge.0010.desc.intro: "Za mými zády stojí jezdci seřazení do dlouhé řady, která se táhne nalevo i napravo, kam až oko dohlédne. Všichni netrpělivě čekají na znamení, kterým jejich [ROOT.Char.GetTitleAsNameNoTooltip] zahájí velký hon.\n\n"
 mpo_nerge.0010.desc.intro.master_of_hunt: "Za mými zády stojí jezdci seřazení do dlouhé řady, která se táhne nalevo i napravo, kam až oko dohlédne.\n\n„[Select_CString(ROOT.Char.IsFemale,'Má','Můj')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')], všichni čekají na znamení k zahájení,“ pronese [master_of_hunt.GetFirstName] a nakloní se ke mně. „Přípravy jsou dokončeny.“\n\n"
 mpo_nerge.0010.desc.outro: "Nasadím šíp na tětivu, pozvednu luk a vypustím jej. Šíp zasviští vzduchem a vzápětí spatřím, jak se statná koza s bolestným výkřikem zhroutí k zemi a její tělo se zmítá v křečích. Ozve se vyděšené mečení, které se rychle šíří mezi ostatními zvířaty. Vzápětí je přehluší rytmický dusot kopyt. Jezdci vyrážejí na lov."
 mpo_nerge.0010.desc.outro.alt.moh: "Kývnu na [master_of_hunt.Custom('CZ_FirstName_A')]. [master_of_hunt.GetFirstNameNoTooltip|U] pozvedne luk s nasazeným šípem, napne tětivu a vystřelí. Luk zazpívá a vzápětí se ozve bolestný zvířecí výkřik. Hon právě začal."
 mpo_nerge.0010.desc.outro.alt: "Kývnu na jednoho ze svých jezdců. Ten pozvedne luk s nasazeným šípem, napne tětivu a vystřelí. Luk zazpívá a vzápětí se ozve bolestný zvířecí výkřik. Hon právě začal."
 mpo_nerge.0010.a: "Ukažte mi sílu [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_G')]!"
 mpo_nerge.0015.t: "$mpo_nerge.0010.t$"
 mpo_nerge.0015.desc: "Po dlouhém čekání se konečně všichni seřadíme. Ještě chvíli trvá, než je vše připraveno, ale nakonec [host.GetTitledFirstName] pozvedne luk, aby [Select_CString(host.IsFemale,'skolila','skolil')] první zvíře. Ozve se bolestný výkřik následovaný vyděšeným mečením. Mezi zvířaty propuká panika.\n\nSotva zazní první výkřik, několik jezdců okamžitě vyrazí. Každý chce dokázat svou hodnotu, sám sobě, ostatním i [host.Custom('CZ_TitleAsNameNoTooltip_D')]."
 mpo_nerge.0015.a: "A přesto budu nejlepším lovcem ze všech!"
 mpo_nerge.0110.t: "Neúspěšné nerge"
 mpo_nerge.0110.desc: "Navzdory veškerému našemu úsilí je výsledek honu žalostný. Podařilo se nám skolit jen několik zvířat, ani zdaleka tolik, kolik jsme plánovali a v kolik jsme doufali.\n\nOstatní jezdci na mě hledí sklíčenýma očima. Hanba tíží jejich ramena stejně jako ta má. Jak se po tomhle vůbec můžeme vrátit do [CZProvName(ROOT.Char.GetCapitalLocation,'G')] a podívat se našim lidem do očí?"
 mpo_nerge.0110.a: "Taková ostuda..."
 mpo_nerge.0115.t: "Úspěšné nerge"
 mpo_nerge.0115.desc: "Když nerge konečně skončí, rozhlédneme se po všech ulovených zvířatech. Je na co se dívat. Před námi leží tolik kořisti, že se hned pouštíme do jejího třídění a porcování, aby se maso nezkazilo.\n\nPráce probíhá ve veselé náladě. Všichni jsou s výsledkem honu spokojeni a každý rád přiloží ruku k dílu."
 mpo_nerge.0115.a: "Maso nám vystačí na celé období."
 mpo_nerge.0120.t: "Povedené nerge"
 mpo_nerge.0120.desc: "Hon se skutečně vydařil. U našich nohou leží desítky a desítky mrtvých zvířat. Naštěstí máme dostatek lidí, abychom všechna stihli stáhnout a rozporcovat. Domů tak odvezeme obrovské zásoby masa.\n\nVe vzduchu se vznáší těžký pach krve a potu, ale nikomu to nevadí. Lovci si s nadšením vyprávějí své nejlepší zážitky a vzájemně se předhánějí v líčení úspěchů."
 mpo_nerge.0120.a: "Toto maso nám vystačí na několik období."
 mpo_nerge.0125.t: "Velkolepé nerge"
 mpo_nerge.0125.desc: "Náš hon skončil ohromujícím úspěchem. Pomalu procházím mezi malými pahorky navršenými z mrtvých zvířat. Je to skutečně působivá podívaná a všude kolem mě lidé pilně stahují a porcují ulovenou zvěř.\n\nSlyším několik lovců, jak se chlubí svými úlovky. Každý vypráví ještě neuvěřitelnější příběh než ten předchozí. Jedno je však jisté: masa máme dost na celé dlouhé měsíce a mnoho budoucích hostin."
 mpo_nerge.0125.a: "To je skutečný úspěch!"
 mpo_nerge.0130.t: "Vynikající nerge"
 mpo_nerge.0130.desc: "Zemi pokrývá moře masa a krve. Vzduch je prosycen tak silným pachem, že se jím téměř nedá dýchat. Přesto mezi lovci vládne nespoutané veselí. S úsměvy na tvářích procházejí mezi nesčetnými těly ulovených zvířat a oslavují svůj úspěch.\n\nSlužebnictvo i ostatní účastníci honu mají plné ruce práce s porcováním kořisti. Já však stojím jako přikovaný a nedokážu od té podívané odtrhnout oči. Jak jen všechno to maso dopravíme domů?"
 mpo_nerge.0130.a: "Na tento hon bude náš lid vzpomínat po generace."
 mpo_nerge.1000.t: "[ROOT.Char.Custom('EagleStoryNamePossessive')|U] znamení"
 mpo_nerge.1000.desc: "Můj orel [ROOT.Char.Custom('EagleStoryName')] přelétá nad naší loveckou družinou a pátrá po kořisti. [ROOT.Char.Custom('EagleStorySheHe')|U] se pak vrací, usedá mi na předloktí a v pařátech svírá kožešinu, kterou získal od [ROOT.Char.Custom('GetAnimalArticle')|l] [ROOT.Char.Custom('GetAnimalType')|l].\n\nTento nález by nám mohl ukázat cestu k další kořisti. Stejně tak však může jít o pouhou šťastnou náhodu."
 mpo_nerge.1000.a: "Veď nás k [activity.Custom('GetAnimalPlural')|l], [ROOT.Char.Custom('EagleStoryName')]!"
 mpo_nerge.1000.a.tt.success: "Nález, který přinesl [ROOT.Char.Custom('EagleStoryName')], nás zavede k dalším [activity.Custom('GetAnimalPlural')|l]"
 mpo_nerge.1000.a.tt.failure: "Žádná [activity.Custom('GetAnimalPlural')|l] se nepodaří najít"
 mpo_nerge.1000.b: "Moji nejlepší jezdci by mohli vyrazit po stopách zvířete [ROOT.Char.Custom('GetAnimalType')|l]..."
 mpo_nerge.1000.b.tt.success: "Jezdci objeví několik [activity.Custom('GetAnimalPlural')|l]"
 mpo_nerge.1000.c: "Pěkný úlovek, ale jistě tu najdeme něco lepšího."
 mpo_nerge.1005.t: "Hlas pochybností"
 mpo_nerge.1005.desc: "Stovky divokých zvířat už padly za oběť našemu honu. Jejich mrtvá těla pokrývají zemi a krev barví půdu doruda. Přestože se úspěch zdá být na dosah ruky, někteří nejsou s naší kořistí spokojeni.\n\n„[Select_CString(dissenter.IsFemale,'Myslela','Myslel')] jsem, že jsme sem přijeli předvést svou moc,“ prohlásí [dissenter.GetFirstName] hlasem, který se nese nad hlukem honu. „Musíme dokázat víc! Kdybych [Select_CString(dissenter.IsFemale,'vypustila','vypustil')] první šíp já, měli bychom tolik masa, že by nám vystačilo na tucet zim!“\n\n[dissenter.GetFirstNameNoTooltip|U] se na mě zahledí a v očích se [Select_CString(dissenter.IsFemale,'jí','mu')] zablýskne divoký oheň. „Nemám snad pravdu, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]?“"
 mpo_nerge.1005.a: "Budiž. Ukážu ti, co je skutečná moc."
 mpo_nerge.1005.a.tt: "Povedeš malou skupinu jezdců na další lov: [activity.Custom('GetAnimalPlural')|l]"
 mpo_nerge.1005.a.tt.success: "Tvůj plán se vydaří"
 mpo_nerge.1005.a.tt.failure: "Tvým jezdcům se nepodaří ulovit žádnou kořist"
 mpo_nerge.1005.b: "Dokaž, co v tobě je, [dissenter.Custom('CZ_FirstNameNoTooltip_V')]!"
 mpo_nerge.1005.b.tt: "[CZProDropNoTooltip(dissenter,'povedla','povedl')|U] malou skupinu jezdců"
 mpo_nerge.1005.c: "Nemám zapotřebí na tebe dělat dojem."
 mpo_nerge.1005.b.tt.success: "[CZProDropNoTooltip(dissenter,'dokázala','dokázal')|U] ulovit další zvěř: [activity.Custom('GetAnimalPlural')|l]"
 mpo_nerge.1005.b.tt.failure: "[CZProDropNoTooltip(dissenter,'ztrapnila','ztrapnil')|U] se"
 mpo_nerge.1010.t: "Prolomený kruh"
 mpo_nerge.1010.desc: "Každý lovec zaujme své místo a naši jezdci postupně svírají kruh kolem divoké zvěře. [activity.Custom('GetAnimalPlural')|U] se ocitají v obklíčení. Někteří jezdci klusají před hlavní formací, aby sledovali pohyb zvířat, zatímco ostatní jsou připraveni udeřit.\n\nJenže [chaser.GetFirstName] se pošetile vyřítí před ostatní a část zvířat se rozprchne. Veškeré pokusy zahnat je zpátky do kruhu přijdou vniveč. Zvěř se snaží uniknout z našeho sevření."
 mpo_nerge.1010.a: "Nechte [chaser.Custom('CZ_FirstName_A')] napospas té zvěři!"
 mpo_nerge.1010.a.tt.death: "[CZProDropNoTooltip(chaser,'byla','byl')|U] [Select_CString(chaser.IsFemale,'ušlapána','ušlapán')] prchajícím stádem: [activity.Custom('GetAnimalPlural')|l]"
 mpo_nerge.1010.a.tt.injury: "[CZProDropNoTooltip(chaser,'byla','byl')|U] [Select_CString(chaser.IsFemale,'zraněna','zraněn')] prchající zvěří: [activity.Custom('GetAnimalPlural')|l]"
 mpo_nerge.1010.b: "Znovu se seřaďte a pochytáme, co se dá!"
 mpo_nerge.1010.b.tt.success: "Podaří se ti pochytat velkou část prchající zvěře: [activity.Custom('GetAnimalPlural')|l]"
 mpo_nerge.1010.b.tt.failure: "Podaří se pochytat jen několik prchajících zvířat"
 mpo_nerge.1010.c: "Pořád patří mezi nás. Chybovat je lidské."
 mpo_nerge.1010.c_obedience: "Dokud mi bude prokazovat poslušnost, dostane odpuštění."
 mpo_nerge.1015.t: "Splášené stádo"
 mpo_nerge.1015.desc: "„[GetPlayer.Custom('CZ_TitleAsNameNoTooltip_V')|U]! Zvěř prolomila naše obklíčení!“ vykřikne [hunter_1.GetFirstName], těsně následovaný [hunter_2.Custom('CZ_FirstName_I')].\n\nZpoza obzoru se k jezdcům a táboru žene několik desítek splašených zvířat. [activity.Custom('GetAnimalPlural')|U] se řítí přímo proti nám. Je zřejmé, že se hon vymkl kontrole, ale na ústup už není čas."
 mpo_nerge.1015.a: "Tohle je naše příležitost! Pobijte je všechny!"
 mpo_nerge.1015.a.tt.success: "Prchající zvěř je pobita"
 mpo_nerge.1015.a.tt.failure: "Zvířata zraní několik jezdců"
 mpo_nerge.1015.b: "Nechte stádo proběhnout, ale opozdilce skolte."
 mpo_nerge.1015.c: "Útěk je jejich přirozeností. Nechme je vrátit se do divočiny."
 mpo_nerge.1015.d: "[hunter_1.GetFirstNameNoTooltip|U] a [hunter_2.GetFirstNameNoTooltip] za tyto ztráty zaplatí."
 mpo_nerge.1020.t: "Rozptýlená kořist"
 mpo_nerge.1020.desc: "„Náš úspěch je sice nezpochybnitelný, ale obávám se, že tu nakonec nezůstane dost živé zvěře,“ vysvětluje [master_of_hunt.GetFirstName]. „Nechci po nás zanechat neúrodnou pustinu.“\n\nUž jsme ulovili tolik zvířat, že bychom z jejich masa mohli žít celé měsíce. Jenže jak jejich počty klesají, hon se mění v únavné pátrání. [master_of_hunt.GetFirstNameNoTooltip|U] vysílá jezdce hledat další místa, kde se zvěř zdržuje, ale [activity.Custom('GetAnimalPlural')|l] jsou stále vzácnější a jejich stáda rozptýlenější."
 mpo_nerge.1020.a: "Vezměme si, co potřebujeme, a ostatní nechme žít."
 mpo_nerge.1020.a.tt: "Část zvěře přežije a bude se moci znovu rozmnožit: [activity.Custom('GetAnimalPlural')|l]"
 mpo_nerge.1020.b: "Polevit znamená projevit slabost. Pokračujte v lovu!"
 mpo_nerge.1020.c: "Pozorujte tu zvěř. Zaměřme se na nejslabší kusy."
 mpo_nerge.1020.c.tt: "Pokusíš se vybírat k odstřelu pouze nejslabší kusy: [activity.Custom('GetAnimalPlural')|l]"
 mpo_nerge.1020.c.tt.success: "Zbývající zvěř neutrpí újmu"
 mpo_nerge.1020.c.tt.failure: "Zvěře zbude jen žalostně málo"
 mpo_nerge_overhunting_modifier: "Nadměrný lov"
 mpo_nerge_overhunting_modifier_desc: "Zvěř v tomto hrabství byla nadměrně lovena a zdejší krajina bude jen obtížně poskytovat dostatek obživy."
 mpo_nerge.1025.t: "Největší lovec"
 mpo_nerge.1025.desc: "Dosud jsme ulovili desítky zvířat a ten největší kus skolil neznámý šíp. Než si však kdokoli stačí úlovek pořádně prohlédnout, [hunter_1.GetFirstName] přikluše na koni a přihlásí se o zásluhy. Vzápětí dorazí [hunter_2.GetFirstName] a oba se začnou přít o to, komu náleží čest za tento úlovek.\n\n„Každému musí být jasné, že to zvíře zasáhl můj šíp!“ vykřikne [hunter_1.GetFirstName]. „Vždyť jsi [Select_CString(hunter_2.IsFemale,'byla','byl')] tak daleko vzadu, že jsi ho ani [Select_CString(hunter_2.IsFemale,'nemohla','nemohl')] trefit!“\n\n[hunter_2.GetFirstNameNoTooltip|U] si pohrdavě odfrkne. Napětí mezi oběma lovci roste a jejich hádka odvádí pozornost od samotného honu..."
 mpo_nerge.1025.a: "Na slávě nezáleží. O kořist se podělíme všichni."
 mpo_nerge.1025.a.flavor: "To bude znamenitý začátek hostiny!"
 mpo_nerge.1025.a.tt: "Pokud do jednoho roku #bold neuspořádáš#! [CZActivity('activity_feast','A')], ztratíš [Concept('prestige','prestiž')|E] a [Concept('opinion','mínění')|E]"
 mpo_nerge.1025.b: "Nejjednodušší bude rozhodnout to zkouškou síly."
 mpo_nerge.1025.b.tt: "Lovci vyřeší svůj spor soubojem"
 mpo_nerge.1025.b.tt.hunter_1: "[hunter_1.GetFirstNameNoTooltip|U] zvítězí v souboji"
 mpo_nerge.1025.b.tt.hunter_2: "[hunter_2.GetFirstNameNoTooltip|U] zvítězí v souboji"
 mpo_nerge.1025.c: "Vy hlupáci! To můj šíp zasáhl to zvíře!"
 mpo_nerge.1025.c.tt: "Pokusíš se přivlastnit si zásluhy za úlovek"
 mpo_nerge.1025.c.tt.success: "Ostatní lovci se postaví na tvou stranu"
 mpo_nerge.1025.c.tt.failure: "Nikdo tvému tvrzení neuvěří"
 mpo_nerge.1025.d: "[Select_CString(ROOT.Char.IsFemale,'Viděla','Viděl')] jsem to! [intent_target.GetFirstNameNoTooltip|U] [Select_CString(intent_target.IsFemale,'zasáhla','zasáhl')] to zvíře!"
 mpo_nerge_feast_discount: "Připravené maso"
 mpo_nerge_feast_discount_desc: "Tato postava má připravené maso z nedávného nerge, a proto může uspořádat hostinu s nižšími náklady.\n[GetActivityType('activity_feast').GetTextIcon][GetActivityType('activity_feast').GetName] – náklady: -#P 50%#!"
 mpo_nerge_promised_feast_fail: "Nesplněné sliby"
 mpo_nerge_promised_feast_fail_desc: "Tato postava nedávno někomu něco slíbila, ale svůj slib nesplnila."
 mpo_nerge.1026.t: "Nesplněné sliby"
 mpo_nerge.1026.desc: "[Select_CString(ROOT.Char.IsFemale,'Slíbila','Slíbil')] jsem lovcům hostinu z kořisti našeho nerge, ale nakonec všechno maso přišlo nazmar.\n\nJe lepší nic neslibovat než dané slovo porušit. Lovci jsou právem rozhořčeni, že jsem svůj slib [Select_CString(ROOT.Char.IsFemale,'nedodržela','nedodržel')]."
 mpo_nerge.1026.a: "..."
 mpo_nerge.1030.t: "Vzácná podívaná"
 mpo_nerge.1030.desc: "Když se trochu vzdálíme od hlavního houfu lovců, [master_of_hunt.GetFirstName] mi vypráví o neobyčejném zvířeti, které bylo nedávno spatřeno. V okolí se prý potuluje [ROOT.Char.Custom('GetRegionalDeerType')|l] s nádherně bílou srstí.\n\n„Nic podobného jsem ještě nikdy [Select_CString(master_of_hunt.IsFemale,'neviděla','neviděl')],“ pronese [master_of_hunt.GetFirstNameNoTooltip] s očima doširoka rozevřenýma. „A nebylo tam samo. Doprovázela ho menší zvířata, všechna bílá jako sníh.“\n\n[Select_CString(ROOT.Char.IsFemale,'Ulovila','Ulovil')] jsem už vlky, jeleny i divoké kočky, ale skolit tak výjimečného tvora by mi mohlo přinést nesmírnou slávu."
 mpo_nerge.1030.a: "To zvíře bude moje!"
 mpo_nerge.1030.a.tt.success: "[ROOT.Char.Custom('GetRegionalDeerType')|U] padne po zásahu tvým šípem"
 mpo_nerge.1030.a.tt.failure: "[ROOT.Char.Custom('GetRegionalDeerType')|U] unikne"
 mpo_nerge.1030.b: "Vystopujme to zvíře, ale neubližujme mu."
 mpo_nerge.1030.b.tt.success: "Získáš nové poznatky o druhu [ROOT.Char.Custom('GetRegionalDeerType')|l]"
 mpo_nerge.1030.b.tt.failure: "[ROOT.Char.Custom('GetRegionalDeerType')|U] unikne bez újmy"
 mpo_nerge.1030.b.tt.effect: "Během 2 let získá [county.GetName] [GetModifier('hunt_sighting_legendary_modifier').GetNameWithTooltip]"
 mpo_nerge.1030.c: "Jsme tu kvůli lovu, ne kvůli obdivování přírody."
 mpo_nerge.1030.d: "Proč se mě snažíš vlákat do pasti?"
 mpo_nerge.1031.t: "Šetrnost přináší ovoce"
 mpo_nerge.1035.t: "Lovecká taktika"
 mpo_nerge.1035.desc: "První nápor honu už opadl a mnozí lovci se vracejí do tábora, aby prodiskutovali další postup. Ostatní zatím z dálky pozorují zvěř: [activity.Custom('GetAnimalPlural')|l].\n\n„Musíme být nelítostní! Stejně krutí jako vůči našim nepřátelům!“ vykřikne [hunter_1.GetFirstName]. [hunter_2.GetFirstName|U] souhlasně přikývne a dodá: „Jenže početní převaha nám nebude k ničemu, pokud nebudeme spolupracovat.“\n\nNež se mezi nimi stačí rozhořet další hádka, vstoupí do rozhovoru [hunter_3.GetFirstName] s vlastní radou. „Můžeme se držet tradice,“ prohlásí [hunter_3.GetFirstNameNoTooltip], „ale musíme být trpěliví. Sledujme zvířata, pomalu je obkličujme a udeřme ve chvíli, kdy to budou nejméně čekat.“\n\nUprostřed živé debaty se všichni otočí ke mně a čekají na můj názor."
 mpo_nerge.1035.a: "Udeřme tvrdě a rychle!"
 mpo_nerge.1035.a.tt: "Tento postup je #bold nebezpečný#!, ale přinese lepší výsledky."
 mpo_nerge.1035.b: "Rozdělme se do skupin a koordinujme svůj postup."
 mpo_nerge.1035.b.tt: "Tento postup přinese #bold menší kořist#!, ale zlepší [Concept('opinion','mínění')|E] ostatních lovců o tobě, nebo je dokonce učiní [Concept('obedient','poslušnými')|E]."
 mpo_nerge.1035.c: "Připravíme léčku."
 mpo_nerge.1035.c.tt: "Tento postup je poměrně #bold bezpečný#!, ale příliš velkou kořist nepřinese."
 mpo_nerge.1035.d: "Ať o výsledku rozhodnou naše luky."
 mpo_nerge.1035.tt.success: "Plán se vydaří"
 mpo_nerge.1035.tt.failure: "Plán selže"
 mpo_nerge_investigation: "Pozorování zvířat"
 mpo_nerge_investigation_desc: "Tato postava během honu pozorovala divoká zvířata a získané poznatky nyní využívá při péči o vlastní stádo."
 mpo_nerge.1040.t: "Zapomenutý nález"
 mpo_nerge.1040.desc: "„Počkej!“ [hunter.GetTitledFirstName] náhle seskočí z koně a poklekne na zem. „Zdálo se mi, že něco vidím... Tady!“\n\n„Nejspíš to patřilo nějakým méně šťastným lovcům,“ poznamená [hunter.GetFirstNameNoTooltip] jízlivě a ukáže mi luk potřísněný krví, jehož dřevo je na několika místech odštípnuté."
 mpo_nerge.1040.a: "„Odevzdej jej svému [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_D')].“"
 mpo_nerge.1040.b: "„Co se nachází na mé půdě, patří mně.“"
 mpo_nerge.1040.c: "„Můžeš si ho nechat.“"
 mpo_nerge.1040.c.tt: "Artefakt [newly_created_artifact.GetName] si ponechá [hunter.GetShortUIName]"
 mpo_nerge.1040.d: "„Zpátky na koně!“"
 mpo_nerge.1050.t: "Ukázka síly"
 mpo_nerge.1050.desc: "„Podívej, [ROOT.Char.Custom('GetAnimalTypeMismanaged')|l],“ pronese [hunter.GetTitledFirstName] tlumeným hlasem. „Stačí jediný šíp přímo do srdce a kořist bude naše, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')].“\n\n[hunter_2.GetTitledFirstName|U] přikývne, napne luk a čeká na mé pokyny."
 mpo_nerge.1050.a: "„[hunter.Custom('CZ_FirstNameNoTooltip_V')|U], [Select_CString(hunter.IsFemale,'má sestro','můj bratře')], vyrazíme společně!“"
 mpo_nerge.1050.a.tt.success: "Zvíře padne k tvým nohám"
 mpo_nerge.1050.a.tt.failure: "Zvíře unikne"
 mpo_nerge.1050.b: "„Nechte to na mně.“"
 mpo_nerge.1050.b.tt.success: "Zvíře skolíš"
 mpo_nerge.1050.b.tt.failure: "Ztrapníš se"
 mpo_nerge.1050.c: "„Dobře zamiřte.“"
 mpo_nerge.1050.c.tt.success: "Zvíře padne"
 mpo_nerge.1050.c.tt.failure: "Zvíře se šípům vyhne"
 mpo_nerge.1050.d: "„Nenechte se tím rozptylovat!“"
 mpo_nerge.1060.t: "Lákavé rozptýlení"
 mpo_nerge.1060.desc: "„Podívej!“ [hunter.GetTitledFirstName] ukáže na stezku nalevo, kde se ukrývá skupina divokých zvířat. „Tamhle jsou [ROOT.Char.Custom('RegionalEdibleAnimalPlural')|l]! Pojďme je ulovit! Už se mi při té představě sbíhají sliny!“"
 mpo_nerge.1060.a: "„Zjevnější past jsem ještě [Select_CString(ROOT.Char.IsFemale,'neviděla','neviděl')].“"
 mpo_nerge.1060.b: "„Příležitost prokázat svou udatnost!“"
 mpo_nerge.1060.b.tt.success: "Zvířata padnou tvou rukou"
 mpo_nerge.1060.b.tt.failure: "Ztrapníš se"
 mpo_nerge.1060.c: "„Ulovte jich co nejvíc!“"
 mpo_nerge.1060.c.tt.success: "Ulovíš úctyhodné množství zvěře"
 mpo_nerge.1060.c.tt.failure: "Získáš jen žalostně malou kořist"
 mpo_nerge.1060.c.tt_feast: "Příští [CZActivity('activity_feast','A')|l] uspořádáš #high zdarma#!"
 mpo_nerge.1060.d: "„Nemá smysl pronásledovat zatoulané stádo.“"
 nerge_evaded_trap_modifier: "Vyhnutí se pasti"
 nerge_evaded_trap_modifier_desc: "Tato postava se domnívá, že během nerge správně rozpoznala nastraženou past."
 mpo_nerge_1060_free_feast_desc: "Událost nerge"
