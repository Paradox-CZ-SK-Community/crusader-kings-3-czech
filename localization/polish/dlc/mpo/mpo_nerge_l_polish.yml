 hunt_type_nerge_desc: "$BULLET$ Ulovit stovky zvířat a prokázat svou udatnost a sílu\n$BULLET$ Podle výsledku získat [legitimacy_i][Concept('legitimacy','legitimitu')|E], [gold_i][Concept('gold','zlato')|E], [dread_i][Concept('dread','hrůzu')|E] a [prestige_i][Concept('prestige','prestiž')|E]\n$BULLET$ Možnost získat [martial_i][Concept('martial','válečnictví')|E], [command_modifier_i][Concept('commander_traits','velitelské rysy')|E] nebo [Concept('trait_level_track_xp','zkušenosti rysu')|E]\n$hunt_type_nerge_flavor$"
 hunt_type_nerge_flavor: "#weak Nerge je velkolepý hon, při němž jsou pobity stovky, ne-li tisíce zvířat. Je to příležitost, při které může [GetPlayer.GetTitleAsNameNoTooltip] ohromit vazaly i tributáře svou silou.#!"
 activity_window_character_master_of_chase: "Vrchní lovčí"
