 activity_hunt_conclusion_nerge_desc_standard: "Hon byl úspěšný a ještě celý příští rok se na něj bude vzpomínat. Ulovená zvěř našemu lidu na nějaký čas vystačí."
 activity_hunt_conclusion_nerge_desc_excellent: "Hon dopadl znamenitě a bude se na něj vzpomínat ještě dlouhá léta. Domů přivážíme maso pro všechny a nastal čas velkých oslav."
