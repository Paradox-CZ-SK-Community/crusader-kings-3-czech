 mpo_nomad_events.1040.t: "Domov za hranicemi stepi"
 mpo_nomad_events.1040.desc_duchy: "#EMP Pryč, [defender.Custom('CZ_TitledFirstName_V')]!#! Pryč se zbabělci, pryč s [Select_CString(defender.IsFemale,'poraženou paní','poraženým pánem')] těchto zemí! [expelled_culture.GetCollectiveNoun|U] se nyní musí podřídit [ROOT.Char.Custom('CZ_TitleAsName_D')]. Naučí se mi zavděčit, jinak brzy poznají, že jejich podrobení teprve začíná!\n\n[target.GetBaseNameNoTier] bude skvělým domovem pro můj lid. Už nás vítr nebude hnát po pláních jako prach! Zde nás čeká usedlý život a práce místních obyvatel nám zajistí pohodlí.\n\nV [CZProvName(ROOT.Char.GetCapitalLocation,'L')] se [CZTerrainIn(ROOT.Char.GetCapitalLocation)|l] tyčí [ROOT.Char.Custom('ResidenceBuilding')|l], přepychové sídlo, kde mé válkami znavené tělo konečně nalezne odpočinek... zatímco má mysl už začíná přemítat o tom, "
 mpo_nomad_events.1040.desc: "#EMP Pryč, [defender.Custom('CZ_TitledFirstName_V')]! Pryč, [expelled_culture.GetCollectiveNoun]!#! Popadněte své vykrmené děti na ramena, zanechte za sebou rozházené bohatství a prchejte před [ROOT.Char.GetCulture.Custom('CZ_Adjective_yy')|l] jezdcem a [Select_CString(dummy_soldier.IsFemale,'jejími','jeho')] šípy!\n\n[target.GetBaseNameNoTier] nyní patří mému lidu. Už nás vítr nebude hnát po pláních jako prach! Zde nás čeká usedlý život, v němž nám práci místních obyvatel i našich vlastních prostých lidí zajistí pohodlí.\n\nV [CZProvName(ROOT.Char.GetCapitalLocation,'L')] se [CZTerrainIn(ROOT.Char.GetCapitalLocation)|l] tyčí [ROOT.Char.Custom('ResidenceBuilding')|l], přepychové sídlo, kde mé válkami znavené tělo konečně nalezne odpočinek... zatímco má mysl už začíná přemítat o tom, "
 mpo_nomad_events.1040.desc_tribal: "kde bude usedlý [ROOT.Char.GetTitleAsNameNoTooltip|l] čerpat svou sílu."
 mpo_nomad_events.1040.desc_clan: "jak bude vypadat vznešený klan [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')] a kolik daní mu bude plynout."
 mpo_nomad_events.1040.desc_feudal: "jakými zákony bude vládnout feudální [ROOT.Char.GetTitleAsNameNoTooltip|l]."
 mpo_nomad_events.1040.a: "Zde končí putování mého lidu."
