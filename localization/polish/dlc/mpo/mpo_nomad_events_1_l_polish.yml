 mpo_nomad_events.1050.t: "Rozlehlejší pastviny"
 mpo_nomad_events.1050.desc: "Přede mnou stojí [herder.GetTitledFirstName], [Select_CString(herder.IsFemale,'otrhaná žena','otrhaný muž')], ze [Select_CString(herder.IsFemale,'které','kterého')] táhne kozí moč. Tvrdí, že má na starosti nedaleké pastviny [herder_county.Custom('CZ_LandedNameNoTier_G')], které se rozkládají [CZTerrainIn(herder.GetCapitalLocation)|l].\n\n„Tví pastevci z [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedName_G')] nedbají odvěkých hranic!“ stěžuje si. „Přesunu svá stáda na nové pastviny, a tam najdu jen vyprahlou půdu! Vítr ke mně donáší chechot tvých jezdců a dusot jejich vykrmených koní!“\n\n„Copak se o půdu nedokážeme spravedlivě podělit, [ROOT.Char.Custom('CZ_TitleAsName_V')]?“"
 mpo_nomad_events.1050.a: "Pro mě tradiční hranice neznamenají #EMP nic#!."
 mpo_nomad_events.1050.b: "„Propůjč mi svůj poctivý jazyk a svou odvahu!“"
 mpo_nomad_events.1050.b.flavor: "Z tohohle páchnoucího a hubatého pastevce koz udělám váženého jezdce!"
 mpo_nomad_events.1050.c: "„Potrestám ty, kteří ti ukřivdili.“"
 mpo_nomad_events.1050.c.flavor: "Zdá se totiž, že se mi vlastní stáda vymkla z rukou..."
 mpo_nomad_events.1050.d: "„#EMP Prchej před mými stády, pasáčku koz!#!“"
 mpo_nomad_events.1060.t: "Obchodování za ovce"
 mpo_nomad_events.1060.desc: "Hned za mými pastvinami se rozkládá osada [neighbor_province.GetName], odkud se ozývá řinčení kladiv, skřípění kol a halasné hovory početných obyvatel [county_culture.Custom('CZ_Adjective_eeho')|l] původu.\n\nPřicházíme sem vyměnit zvířata za řemeslné výrobky. Břichatí kupci si nás nedůvěřivě prohlížejí a v očích se jim zračí strach.\n\n„Jen se podívej na ty zbraně! A ten kov – [neighbor.Custom('RegionalWeaponMetal')|l]! Jak nádherné oděvy! To musí být [neighbor.Custom('RegionalFabric')|l]!“ překřikují se moji společníci. „A mince z drahých kovů!“"
 mpo_nomad_events.1060.a: "Vážně si myslíš, že stříbrná mince má #EMP takovouhle#! cenu...?"
 mpo_nomad_events.1060.a.flavor: "Tihle usedlí slaboši brzy poznají, že nás „divochy“ není tak snadné ošidit..."
 mpo_nomad_events.1060.b: "„Seberte všechno! #EMP A tryskem pryč!#!“"
 mpo_nomad_events.1060.b.flavor: "Pravé dítě stepi s žádnými slabochy nevyjednává!"
 mpo_nomad_events.1060.b.success: "Tvé družině se podaří uniknout s ukořistěným zbožím"
 mpo_nomad_events.1060.b.failure: "Podaří se ti jen těsně uniknout, ale musíš odhodit kořist"
 mpo_nomad_events.1060.c: "„Přiveďte kožešiny, jogurt a ušlechtilé koně!“"
 mpo_nomad_events.1060.c.flavor: "Obchodování s [neighbor.GetTopLiege.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_yymi')|l] osadami nám může jedině prospět."
 nomad_trading_mastery_modifier: "Obchodní magnát"
 nomad_trading_mastery_modifier_desc: "Tento nomád dobře zná skutečnou hodnotu cizích mincí a luxusního zboží. Možná dokonce lépe než samotní obchodníci, kteří je nabízejí."
 nomad_trading_partners_modifier: "Obchodní dohody s usedlíky"
 nomad_trading_partners_modifier_desc: "Tento nomád se aktivně věnuje obchodování, při němž vyměňuje produkty svého pasteveckého hospodářství za nástroje, luxusní zboží a mince."
 mpo_nomad_events.1070.t: "Zatoulaní v noci"
 mpo_nomad_events.1070.desc_intro: "Probouzím se s koňským dechem ve tváři.\n\n"
 mpo_nomad_events.1070.desc_has_horse: "Když se ke mně přitulí můj kůň [ROOT.Char.Custom('WarhorseStoryName')],"
 mpo_nomad_events.1070.desc_new_horse: "Když se ke mně přitulí neznámý kůň,"
 mpo_nomad_events.1070.desc: "vítr kolem nás skučí [CZTerrainIn(ROOT.Char.GetCurrentLocation)|l]. Uprostřed divočiny jsme jen my dva.\n\nV hlavě mám úplně prázdno. Co se to #EMP stalo#! mezi včerejším soumrakem a tímto chladným úsvitem? Copak mě můj lid... opustil? Ne! Vzpomínky se začínají vracet. Vybavují se mi útržky:"
 mpo_nomad_events.1070.desc_spiritual: "šepot duchů a posvátné vytržení, které mě vyvedlo z lůžka a přivedlo k osamělému koni stojícímu v měsíčním světle..."
 mpo_nomad_events.1070.desc_mental_thing: "mé vlastní šílené kletby, které jsem uprostřed noci [Select_CString(ROOT.Char.IsFemale,'vykřikovala','vykřikoval')]. Příbuzní se mě snažili uklidnit, ale nedokázal jsem mezi nimi vydržet. [Select_CString(ROOT.Char.IsFemale,'Odešla','Odešel')] jsem do noci, jen s tímto tichým koněm..."
 mpo_nomad_events.1070.desc_new_drunk: "těžké misky [Glossary( 'kumis', 'KUMIS_GLOSS' )], dusot kopyt a pocit tmavé hřívy přitisknuté k mé tváři..."
 mpo_nomad_events.1070.a: "Jsi věrné zvíře, viď?"
 begin_warhorse_story_tt: "Tento kůň se stane tvým milovaným oblíbencem"
 mpo_nomad_events.1070.b: "Už nikdy! Přísahám ti, koni: #EMP už nikdy!#!"
 mpo_nomad_events.1070.c: "Za mou cestou na toto posvátné místo jistě stojí [ROOT.Char.GetFaith.HighGodName]!"
 mpo_nomad_events.1070.c.flavor: "Nemusím propadat panice. Zdejší přírodní síly jsou mi nakloněny a dovedou mě domů."
 mpo_nomad_events.1070.d: "Vzhůru domů! Nomád nikdy nezabloudí."
 mpo_nomad_events.1070.d.flavor: "Ani když mi hlava třeští tak strašlivě, že sotva vidím..."
 mpo_nomad_events.1070.d.success: "Podaří se ti vrátit po stopách tvého koně"
 mpo_nomad_events.1070.d.failure: "Do setmění se ti nepodaří najít cestu domů"
 mpo_nomad_events.1070.e: "Snad si cestu zpátky pamatuješ alespoň ty, koni..."
 nomad_alone_in_adversity_modifier: "Důvěra v koně"
 nomad_alone_in_adversity_modifier_desc: "V těžkých chvílích tento nomád nespoléhá na nic tolik jako na instinkt přežití a rychlost svých koní."
