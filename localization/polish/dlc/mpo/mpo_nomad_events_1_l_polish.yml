l_polish:
 mpo_nomad_events.1000.t: "Zachráněná hlava"
 mpo_nomad_events.1000.army_camp: "Přeživší krvavého střetu u [CZProvName(beheaded_warrior_location,'G')] se připojují k mému vojsku. Ženou své koně až na pokraj sil. Ze sedlových řemenů jednoho z nich se houpe dosud krvácející hlava. Ve znetvořené, smrtelně bledé tváři poznávám:"
 mpo_nomad_events.1000.capital: "Přeživší krvavého střetu u [CZProvName(beheaded_warrior_location,'G')] posílají zprávu přímo z bojiště. A spolu s ní přichází i dosud krvácející hlava. Ve znetvořené, smrtelně bledé tváři poznávám:"
 mpo_nomad_events.1000.family: "[beheaded_warrior.GetFirstName], [Select_CString(beheaded_warrior.IsFemale,'mou','mého')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('beheaded_warrior'))|l]."
 mpo_nomad_events.1000.vassal: "[beheaded_warrior.GetName], [Select_CString(beheaded_warrior.IsFemale,'mou kdysi mocnou podřízenou','mého kdysi mocného podřízeného')]."
 mpo_nomad_events.1000.councillor: "[beheaded_warrior.GetName], [Select_CString(beheaded_warrior.IsFemale,'mou důvěryhodnou rádkyni','mého důvěryhodného rádce')]."
 mpo_nomad_events.1000.generic_knight: "[beheaded_warrior.GetName], váženou postavu z řad [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l]."
 mpo_nomad_events.1000.desc: "\n\n„[Select_CString(beheaded_warrior.IsFemale,'Padla','Padl')] jako [Select_CString(beheaded_warrior.IsFemale,'pravá válečnice','pravý válečník')]. [Select_CString(beheaded_warrior.IsFemale,'Pronikla','Pronikl')] až do samého středu válečné družiny [beheaded_warrior_foe.Custom('CZ_TitledFirstName_G')], kde [Select_CString(beheaded_warrior.IsFemale,'jí','mu')] srazili hlavu z ramen! Z úcty k [Select_CString(beheaded_warrior.IsFemale,'ní','němu')] naši jezdci zachránili alespoň to, co mohli.“\n\nKrutý konec... Naši moudří stařešinové však říkají, že hlava udatného bojovníka si uchovává část jeho životní síly i osudu."
 mpo_nomad_events.1000.a: "Uctím hlavu [Select_CString(beheaded_warrior.IsFemale,'této významné ženy','tohoto významného muže')]."
 mpo_nomad_events.1000.a.flavor: "Hlava [beheaded_warrior.Custom('CZ_TitledFirstNameNoTooltip_G')] bude uložena na bílém plstěném koberci, kde jí má domácnost bude předkládat obřadní nápoje a vykonávat posvátné rituály."
 mpo_nomad_events.1000.b: "Hlava [beheaded_warrior.Custom('CZ_FirstNameNoTooltip_G')] patří zpět mezi své blízké."
 mpo_nomad_events.1000.c: "Ať moji [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] vzdají úctu [Select_CString(beheaded_warrior.IsFemale,'své padlé družce','svému padlému druhovi')]."
 mpo_nomad_events.1000.d: "Pohřběte hlavu [beheaded_warrior.Custom('CZ_FirstNameNoTooltip_G')]."
 mpo_warriors_grave_modifier: "Hrob sťatého válečníka"
 mpo_warriors_grave_modifier_desc: "V půdě této země je pohřbena hlava, kterou v bitvě oddělili od těla. Její tvář dodnes nese stopy posledního válečného pokřiku. Hrob často navštěvují rodiny těch, jejichž blízcí odjeli do války."
 mpo_noble_warriors_grave_modifier: "Hrob sťatého velmože"
 mpo_noble_warriors_grave_modifier_desc: "V půdě této země je pohřbena hlava proslulého velmože, kterou v bitvě oddělili od těla. Jeho hrob se stal posvátným místem, všeobecně známým a často navštěvovaným."
 custom.every_beheaded_family: "Každý [Concept('close_family_member','člen blízké rodiny')|E] postavy [beheaded_warrior.GetShortUIName]"
 warriors_head_artifact: "[beheaded_warrior.Custom('CZ_TitledFirstNamePossessiveNoTooltip_F')|U] uctívaná hlava"
 kin_head_artifact_desc: "Rozkládající se, k nepoznání znetvořená hlava [beheaded_warrior.Custom('CZ_FirstName_G')], [Select_CString(beheaded_warrior.IsFemale,'milované potomkyně','milovaného potomka')] rodu [beheaded_warrior.GetHouse.GetName]. Tato postava padla rukou vojáků [beheaded_warrior_foe.Custom('CZ_Name_G')] v bitvě u [CZProvName(beheaded_warrior_location,'G')]."
 accolade_head_artifact_desc: "Hrůzné ostatky [beheaded_warrior.Custom('CZ_FirstName_G')], proslulé postavy z řad [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l], známé pod jménem „[beheaded_warrior_accolade.GetName]“. Bojovníci [beheaded_warrior_foe.Custom('CZ_Name_G')] si připisují zásluhu za její smrt na bojišti u [CZProvName(beheaded_warrior_location,'G')]."
 warriors_head_artifact_desc: "Useknutá hlava [beheaded_warrior.Custom('CZ_FirstName_G')], [Select_CString(beheaded_warrior.IsFemale,'statečné bojovnice','statečného bojovníka')] z řad [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l], [Select_CString(beheaded_warrior.IsFemale,'která padla','který padl')] v boji proti vojsku [beheaded_warrior_foe.Custom('CZ_Name_G')] u [CZProvName(beheaded_warrior_location,'G')]. Navzdory odpornému zápachu ji ostatní bojovníci chovají v hluboké úctě."
 keep_warrior_head_tt: "Ponecháš si [head_artifact.GetName]"
 gain_illustrious_victim_head_artifact_tt: "Můžeš si ponechat hlavu [victim.Custom('CZ_FirstName_G')] jako $illustrious$ [Concept('inventory_artifact','osobní artefakt')|E]"
 gain_famed_victim_head_artifact_tt: "Můžeš si ponechat hlavu [victim.Custom('CZ_FirstName_G')] jako $famed$ [Concept('inventory_artifact','osobní artefakt')|E]"
 send_head_for_warscore_tt: "Odeslání hlavy [victim.Custom('CZ_FirstName_G')] [Concept('heir','dědici')|E] této postavy může zvýšit jeho ochotu přijmout [Concept('peace','mír')|E] s #high tebou#!"
 send_head_for_vassalization_tt: "Odeslání hlavy [victim.Custom('CZ_FirstName_G')] [Concept('heir','dědici')|E] této postavy může zvýšit ochotu přijmout [Concept('vassalization','vazalizaci')|E]"
 send_head_for_hook_tt: "Odeslání hlavy [victim.Custom('CZ_FirstName_G')] [Concept('heir','dědici')|E] této postavy ti může zajistit [Concept('weak_hook','slabou páku')|E]"
 send_head_for_prestige_tt: "Odesláním hlavy [victim.Custom('CZ_FirstName_G')] [Concept('heir','dědici')|E] této postavy můžeš získat [Concept('prestige','prestiž')|E]"
 send_head_for_obedience_tt: "Odeslání hlavy [victim.Custom('CZ_FirstName_G')] [Concept('heir','dědici')|E] této postavy jej může přimět k [Concept('obedient','poslušnosti')|E]"
 headless_heir_rises_to_challenge_tt: "#N Pokud příjemce odvážně přísahá pomstu:#!"
 mpo_nomad_events.1011.t: "Stětí"
 mpo_nomad_events.1011.desc_execution_spite: "[victim.GetName|U] chrlí kletby a ještě ve chvíli, kdy katova čepel odděluje hlavu od těla, na mě upírá nenávistný pohled."
 mpo_nomad_events.1011.desc_execution_beg: "[victim.GetName|U] nesouvisle blábolí a zoufale prosí o život. Pak přijde jediná mohutná rána a hlava se oddělí od ramen."
 mpo_nomad_events.1011.desc_execution_pray: "[victim.GetName|U] si stále mumlá modlitby, když je kat donutí pokleknout. Pak jediný mohutný úder oddělí hlavu od ramen."
 mpo_nomad_events.1011.desc_bad_execution: "Hlavu [victim.Custom('CZ_Name_G')] neoddělí od ubohého těla jediná čistá rána. Kat ji musí doslova usekat sérií surových úderů."
 mpo_nomad_events.1011.desc: "\n\nZadívám se do očí [victim.Custom('CZ_Name_G')]. [Select_CString(victim.IsFemale,'Tato vládkyně','Tento vládce')] kultury [victim.GetCulture.GetName] jimi naposledy divoce zakoulí, zatímco krev pomalu vsakuje do hlíny."
 mpo_nomad_events.1011.desc_send_head: "\n\nCo kdyby tuto hrůznou podívanou spatřil také [headless_heir.GetTitledFirstName], nástupce [victim.Custom('CZ_FirstNameNoTooltip_G')]? Možná by pak poznal strach z mé moci a mé nezkrotné, vlčí vůle..."
 mpo_nomad_events.1011.desc_cant_send: "\n\nZ [victim.Custom('CZ_FirstNameNoTooltip_G')] nezbylo nic než kus mrtvého masa. Hostina pro mrchožrouty..."
 mpo_nomad_events.1011.desc_keep_head: "\n\n...anebo by si tuto proslulou hlavu měl ponechat ten, kdo ji získal. Tedy já."
 mpo_nomad_events.1011.a: "Ať nikdo nezapomene na sťatou hlavu [victim.Custom('CZ_TitleAsNameNoTooltip_G')]."
 mpo_nomad_events.1011.a.flavor: "A ať všichni vědí, že #EMP já#! [Select_CString(ROOT.Char.IsFemale,'ukončila','ukončil')] [Select_CString(victim.IsFemale,'její','jeho')] slavný život!"
 mpo_nomad_events.1011.b: "Pošlete tento „dar“ [headless_heir.Custom('CZ_TitledFirstNameNoTooltip_D')]."
 mpo_nomad_events.1011.b.success: "Tvá krutá urážka zastraší [headless_heir.Custom('CZ_TitledFirstNameNoTooltip_A')]"
 mpo_nomad_events.1011.b.fail: "[headless_heir.GetTitledFirstNameNoTooltip|U] odvážně přísahá pomstu"
 mpo_nomad_events.1011.b.flavor: "Ten, kdo nyní vládne [victim.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_D')], musí vědět, jaký konec čeká mé nepřátele! #EMP [headless_heir.GetTitledFirstNameNoTooltip|U] tomu pohlédne přímo do očí!#!"
 mpo_nomad_events.1011.c: "Nechte [victim.Custom('CZ_FirstNameNoTooltip_A')] supům."
 headless_heir_high_tier_warning_tt: "@alert_icon! #alert_trial Varování: [headless_heir.GetShortUIName|U] z tebe nemá strach!#!"
 headless_heir_ignores_challenge_tt: "#P Pokud příjemce před touto urážkou ustoupí:#!"
 mpo_nomad_events.1012.t: "Návrat [victim.Custom('CZ_TitleAsNameNoTooltip_G')]"
 mpo_nomad_events.1012.desc: "Nechám si na boty stékat starou krev a do prstů uchopím chladnou kůži. Právě mi totiž byla vrácena useknutá hlava [victim.Custom('CZ_Name_G')].\n\n„To je urážka! Ponížení!“ ozývají se výkřiky všude kolem, zatímco děti pláčou. Bojovníci z řad [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] řinčí meči a přísahají pomstu.\n\nByla mi však tato zohavená hlava poslána jen proto, aby zasela strach do mého srdce? Anebo... [executioner.GetTitledFirstName] touží po mé nenávisti?"
 mpo_nomad_events.1012.a: "Nejdůležitější je uctít ostatky [victim.Custom('CZ_FirstNameNoTooltip_G')]."
 mpo_nomad_events.1012.a_flavor: "Tato „urážka“ nám umožní omýt a ozdobit vznešenou hlavu [victim.Custom('CZ_TitledFirstNameNoTooltip_G')] a pronést nad ní modlitby."
 mpo_nomad_events.1012.b: "#EMP Tuto urážku pomstím!#!"
 mpo_nomad_events.1012.b_flavor: "Poslali mi zkrvavenou tvář války. Ze záhrobí ke mně doléhá hlas [victim.Custom('CZ_FirstName_G')], který volá po krvi [executioner.Custom('CZ_TitledFirstName_G')]!"
 mpo_nomad_events.1012.c: "Musím ustoupit, jinak mě čeká stejný osud..."
 peace_acceptance_head_scare_tt: "Ochota [headless_heir.Custom('CZ_ShortUIName_G')] přijmout [Concept('peace','mír')|E] s #high tebou#!: #P +30#! po dobu #high 20 let#!"
 COWED_BY_SEVERED_HEAD_MODIFIER: "Zastrašení stětím předchůdce: $VALUE|+=0$"
 severed_head_revenge_modifier: "Touha pomstít stětí předchůdce: $VALUE|+=0$"
 severed_head_cb_revenge_tt: "Cena [Concept('casus_belli','casus belli')|E] proti postavě #high [executioner.GetShortUIName]#!: #P -75%#!"
 severed_head_vassalization_tt: "Ochota [headless_heir.Custom('CZ_ShortUIName_G')] přijmout [Concept('offer_vassalization','nabídku vazalizace')|E] $ep3_laamps.0010.connector$ #high $demand_tributary_interaction$#! od [executioner.GetShortUIName]: #P +200#! po dobu #high 20 let#!"
 mpo_nomad_events.1013: "[Select_CString(ROOT.Char.IsFemale,'Vražedkyně','Vrahu')] [victim.Custom('CZ_TitledFirstNameNoTooltip_G')],"
 mpo_nomad_events.1013.desc_takes_it_sedentary: "Mé sídlo nyní hyzdí děsivá výhrůžka – [headless_heir.Custom('ResidenceBuilding')|l] se stalo místem, kam dorazila useknutá hlava vznešeného velmože, mého vlastního předka.\n\nProsím tě, pane koní! V zemích [headless_heir.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] se s takovými hrůzami setkáváme jen zřídka a rozhodně v nich nenacházíme zalíbení. Raději s tebou budu jednat v dobrém, než abych [Select_CString(headless_heir.IsFemale,'byla tak krutě pokořena','byl tak krutě pokořen')]."
 mpo_nomad_events.1013.desc_takes_it: "[victim.GetCulture.GetCollectiveNoun|U] doufali, že [victim.Custom('CZ_Name_A')] ještě někdy spatří. Nyní před nimi leží zkrvavená hlava a při pohledu na tak nepřirozenou hrůzu jim černají srdce.\n\nProsím, ušetři nás svého strašlivého hněvu! Kéž [headless_heir.GetFaith.PositiveAfterLife] přijme [victim.Custom('CZ_FirstName_A')] k věčnému odpočinku!"
 mpo_nomad_events.1013.desc_angeee: "Tím, že jsi mi [Select_CString(ROOT.Char.IsFemale,'poslala','poslal')] hlavu [Select_CString(victim.IsFemale,'vládkyně','vládce')] [victim.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')], jsi mi [Select_CString(ROOT.Char.IsFemale,'předložila','předložil')] zkrvavenou tvář války. Poslala jsi mi šedé rty, které jako by dosud křičely po pomstě.\n\nDočkám se chvíle, kdy tvé živé tělo začne hnít. Skolím tě jako starý strom.\n\nA mezi tvé kosti uložím hlavu [victim.Custom('CZ_FirstName_G')]."
 mpo_nomad_events.1013.a.cowed: "Jak jehně teď [headless_heir.GetTitleAsNameNoTooltip|l] bečí a kňučí!"
 mpo_nomad_events.1013.a.revenge: "Tak tedy... [headless_heir.GetFirstNameNoTooltip|U] přísahá pomstu."
 executed_head_artifact: "Královská hlava [victim.Custom('CZ_TitledFirstNameNoTooltip_G')]"
 executed_head_emperor_artifact_desc: "Useknutá hlava [victim.Custom('CZ_TitleAsNameNoTooltip_G')], [Select_CString(victim.IsFemale,'vládkyně','vládce')] [victim.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')], stále nese korunu. Šedé rty a obočí doplněné koňskými žíněmi byly sešity do výrazu panovačné přísnosti. Vzbuzuje úžas i hrůzu.\n\nJestliže tak strašlivý osud mohl potkat i tak mocného panovníka, jaké hrůzy asi čekají všechny ostatní?"
 executed_head_king_artifact_desc: "Poslední pozůstatek [victim.Custom('CZ_Name_G')], uchovaný a ozdobený způsobem odpovídajícím [Select_CString(victim.IsFemale,'jejímu','jeho')] někdejšímu postavení. Svědectví o nelítostné vůli toho, kdo jej vlastní."
 nomad_defected_invite_desc: "Tuto postavu jsi během posledních 5 let vyhnal ze svého dvora"
 nomad_defector_wont_come_back_tt: "Po dobu #high 5 let#! nemůžeš vůči postavě [rowdy_boy.GetShortUIName] použít interakci #high Pozvat na dvůr#!"
 nomad_defector_family_tt: "Členové rodiny [rowdy_boy.Custom('CZ_ShortUIName_G')] opustí tvůj dvůr"
 nomad_defector_family_wont_come_back_tt: "Po dobu #high 5 let#! nemůžeš vůči těmto vyhnancům použít interakci #high Pozvat na dvůr#!"
 nomad_defector_gain_all_courtiers_tt: "Získá některé z tvých nezaměstnaných [Concept('courtiers','dvořanů')|E]"
 mpo_nomad_events.1020.t: "Nejhladovější z potomstva"
 mpo_nomad_events.1020.desc: "[Select_CString(rowdy_boy.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rowdy_boy'))|l] [rowdy_boy.GetFirstName] v poslední době nezná klidu.\n\n„Ohlodávat kosti po tvých hostinách! Cucát kyselé sražené mléko ve stínu tvé jurty! Tohle má být #EMP můj#! život?“ [Select_CString(rowdy_boy.IsFemale,'vyprskne','vyprskne')]. „Jsem [Select_CString(rowdy_boy.IsFemale,'připravená','připravený')] vést ostatní, [rowdy_boy.Custom2('CZ_RelationToMeShort_V', SCOPE.sC('root_scope'))|l]! A v tvém vojsku [ROOT.Char.GetDomicile.GetCulture.Custom('CZ_Adjective_eeho')|l] původu se najdou lidé, kteří mě budou následovat.“\n\n[Select_CString(rowdy_boy.IsFemale,'Tato hrdá válečnice','Tento hrdý válečník')] z rodu [rowdy_boy.GetHouse.GetName], [Select_CString(rowdy_boy.IsFemale,'kterou držím','kterého držím')] u sebe jako bezmocného domácího mazlíčka, na mě nyní cení zuby."
 mpo_nomad_events.1020.a: "„Zmlkni, [ROOT.Char.Custom2('CZ_RelationToMeShort_V', SCOPE.sC('rowdy_boy'))|l]. Věz, kam patříš.“"
 mpo_nomad_events.1020.b: "„Kdo mě vyzve, #EMP nepřežije!#!“"
 mpo_nomad_events.1020_duel_tt: "#V Souboj#! s [rowdy_boy.Custom('CZ_FirstName_I')].\n@death_icon! #X Tento souboj je na život a na smrt!#!\nPokud zvítězíš, získáš @skill_prowess_icon![Concept('prowess','udatnost')|E], @dread_icon![Concept('dread','hrůzu')|E], @prestige_icon![Concept('prestige','prestiž')|E] a @stress_icon![Concept('stress','stres')|E]. Pokud prohraješ, [rowdy_boy.GetShortUIName] převezme tvé [Concept('titles','tituly')|E] jako [Concept('primary_heir','hlavní dědic')|E].\n\nTvá [Concept('prowess','udatnost')|E]: [prowess_i]#V [root_scope.GetProwess]#!\n[Concept('prowess','Udatnost')|EU] [rowdy_boy.Custom('CZ_FirstName_G')]: [prowess_i]#V [rowdy_boy.GetProwess]#!"
 mpo_nomad_events.1020.c: "„Pastvin mám na rozdávání.“"
 mpo_nomad_events.1020.c.flavor: "Ať si ten opovážlivec hospodaří s vlastními stády... ovšem pod mou nadvládou."
 mpo_nomad_events.1020.d: "„Vyjeď do světa a prokaž čest svému jménu!“"
 mpo_nomad_events.1020.d.flavor: "[rowdy_boy.GetFirstNameNoTooltip|U] dostane vše potřebné, aby se [Select_CString(rowdy_boy.IsFemale,'mohla','mohl')] postavit na vlastní nohy."
 mpo_nomad_events.1020.e: "„Nezůstaneš, když si to přeje [Select_CString(ROOT.Char.IsFemale,'tvá','tvůj')] [rowdy_boy.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))|l]?“"
 mpo_nomad_events.1020.e.success: "[rowdy_boy.GetFirstNameNoTooltip|U] souhlasí, že zůstane a bude sloužit"
 mpo_nomad_events.1020.e.failure: "[rowdy_boy.GetFirstNameNoTooltip|U] se svými příznivci potají odchází"
 mpo_nomad_events.1020.f: "„Vyháním tě, [ROOT.Char.Custom2('CZ_RelationToMeShort_V', SCOPE.sC('rowdy_boy'))|l]! Zmiz!“"
 mpo_nomad_events.1020.f.flavor: "Čeká tě divoká a osamělá cesta ke svobodě!"
 attacked_family_opinion: "Napadení člena mé rodiny"
 mpo_nomad_events.1022.t: "Smrt opovážlivce"
 mpo_nomad_events.1022.desc: "Jako panter, který se bez rozmyslu vrhá ze srázu, jako sokol útočící na vlastní stín, jako velbloud chňapající po nohách svého mláděte... Také mě zcela pohltil hněv.\n\nNáš souboj o čest skončil. [rowdy_boy.GetFirstName] – [Select_CString(rowdy_boy.IsFemale,'má vlastní','můj vlastní')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rowdy_boy'))|l] – leží [Select_CString(rowdy_boy.IsFemale,'mrtvá','mrtvý')] na zemi.\n\nKdyž utichne dunění bubnů mého spravedlivého hněvu, začnu rozeznávat nářek. Můj lid oplakává důkaz mé moci."
 mpo_nomad_events.1022.a: "[Select_CString(ROOT.Char.IsFemale,'Udělala','Udělal')] jsem to, co se od [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')] očekává."
 mpo_quelled_family_dissent_modifier: "Zabití vzpurného příbuzného"
 mpo_quelled_family_dissent_modifier_desc: "Člen rodiny, který se odvážil zpochybnit obávanou autoritu této postavy, dlouho nepřežil."
 mpo_nomad_events.1030.t: "Výchova ve třech disciplínách"
 mpo_nomad_events.1030.desc: "Zatímco sleduji, jak [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] cvičí své válečnické dovednosti, přivádějí ke mně [child.Custom('CZ_FirstName_A')], [Select_CString(child.IsFemale,'mou','mého')] [ROOT.Char.Custom2('CZ_RelationToMeShort_A', SCOPE.sC('child'))|l].\n\n„[child.Custom2('CZ_RelationToMeShort_V', SCOPE.sC('root_scope'))|U],“ zeptá se dítě, „která ze tří"
 mpo_nomad_events.1030.desc_mongolic: " disciplín [Glossary( 'nadaam', 'NADAAM_GLOSS' )] je nejdůležitější?“\n\n[Select_CString(child.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))|l] by se [Select_CString(child.IsFemale,'mohla','mohl')] podrobit nelítostné zkoušce [Glossary( 'bökh', 'BOKH_GLOSS' )],"
 mpo_nomad_events.1030.desc_non_mongolic: " velkých sportovních disciplín je nejdůležitější?“\n\n[Select_CString(child.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))|l] by se [Select_CString(child.IsFemale,'mohla','mohl')] podrobit nelítostné zkoušce zápasu,"
 mpo_nomad_events.1030.desc.outro: " osvojit si vytříbené umění lukostřelby... nebo se snad zdokonalit v jízdě na koni, díky níž provázíme svá stáda a naši nájezdníci se rychle vracejí domů?"
 NADAAM_GLOSS: "#bold Erin Gurban Naadam#! neboli „tři mužné hry“ jsou hlavními sportovními disciplínami mongolských národů již od neolitu a ústřední součástí slavností a soutěží. Patří mezi ně střelba z kompozitního luku, zápas a dálkové dostihy."
 BOKH_GLOSS: "Starobylý tradiční mongolský zápas, jehož hlavním cílem je dostat horní část soupeřova těla na zem. Některé styly dovolují techniky, jako je chytání a podkopávání nohou, ale především jde o zkoušku hrubé síly a neústupnosti. Zápas může trvat celé hodiny."
 mpo_nomad_events.1030.a: "Nechte mě vrátit se k vlastnímu výcviku!"
 mpo_nomad_events.1030.a.flavor: "Na ničem nezáleží tolik jako na úsilí, při němž sotva popadáš dech a celé tělo tě bolí!"
 mpo_nomad_events.1030.b: "Dokaž, že dokážeš stát pevně jako hora."
 mpo_nomad_events.1030.c: "Večeři si obstaráš vlastními šípy."
 mpo_nomad_events.1030.c.flavor: "Svišť je mnohem mazanější než všechny terče na našem cvičišti... ale alespoň je větší."
 mpo_nomad_events.1030.d: "Získej si důvěru koně, [child.Custom('GirlBoy')|l]."
 mpo_nomad_events.1030.d.flavor: "Až tě tvůj kůň bude poslouchat, můžeš se za zpěvu vydat na dlouhé dostihy."
 is_nomadic_tt: "Máš [Concept('nomadic_government','kočovnou vládu')|E]"
