 GetMongolHonorific_dreadful: "[Select_CString(ROOT.GetCharacter.IsFemale,'strašlivá','strašlivý')]"
 GetMongolHonorific_mighty: "[Select_CString(ROOT.GetCharacter.IsFemale,'mocná','mocný')]"
 GetMongolHonorific_fearsome: "[Select_CString(ROOT.GetCharacter.IsFemale,'hrozivá','hrozivý')]"
 GetMongolHonorific_frightful: "[Select_CString(ROOT.GetCharacter.IsFemale,'hrůzostrašná','hrůzostrašný')]"
 nomad_events.ill_advised.header: "Špatná rada"
 nomad_events.0001.t: "$nomad_events.ill_advised.header$?"
 nomad_events.0001.desc: "Noční ticho náhle přeruší dusot těžkých kroků.\n\n„To přece musí být zřejmé i tobě, [ROOT.Char.Custom('FormOfAddressForLiege')|l],“ vyčítá mi [jealous_courtier.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('jealous_courtier'))|l], když vstoupí do mého geru. „[achmach_scope.GetTitledFirstName|U] odvádí svou práci až podezřele dobře. Příliš mnoho mluví, získává si příliš mnoho příznivců a až příliš často přichází a odchází. Zdá se, že všechno vždy dopadne přesně podle [Select_CString(achmach_scope.IsFemale,'jejích','jeho')] představ.“\n\nOči [jealous_courtier.Custom('CZ_FirstNameNoTooltip_G')] se podezíravě zúží. „Co když, [Select_CString(ROOT.Char.IsFemale,'má','můj')] [ROOT.GetCharacter.Custom('GetMongolHonorific')|l] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')], za tím vším stojí nějaké... temné čáry? Co když [achmach_scope.GetTitledFirstName] používá zakázaná kouzla, aby dosáhl svého?“"
 nomad_events.0001.a: "[Select_CString(achmach_scope.IsFemale,'Propustím ji.','Propustím ho.')]"
 nomad_events.0001.b: "To jsou jen slova žárlivého soupeře."
 achmach_firing_tt: "@alert_icon! [achmach_scope.GetShortUIName|U] nebude možné znovu zaměstnat po dobu 5 let#!"
 nomad_events.0002.t: "$nomad_events.ill_advised.header$: Otázky"
 nomad_events.0002.desc.calm: "„Řekni mi pravdu, [ROOT.GetCharacter.Custom('GetMongolHonorific')|l] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ naléhá [achmach_scope.GetTitledFirstName] a ztiší hlas natolik, že jej téměř nelze rozeznat od praskání ohně. „Mohl se můj přístup v něčem změnit? Čím jsem tě [Select_CString(achmach_scope.IsFemale,'zklamala','zklamal')]?“"
 nomad_events.0002.desc.angry: "„Mé [achmach_scope.Custom('EyeEyes')|l] mě snad klamou! Jak mohl někdo tak snadno obelstít [Select_CString(ROOT.Char.IsFemale,'naši obávanou','našeho obávaného')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_A')]?“ rozhořčeně vyhrkne [achmach_scope.GetTitledFirstNameNoTooltip] a odvrátí tvář od ohně. „Pokud nasloucháš pomluvám, doufám, že alespoň dokážeš rozeznat pravdu od lži.“"
 nomad_events.0002.desc.fallback: "„Nebudu se ptát, proč jsi mě [Select_CString(ROOT.Char.IsFemale,'odstranila','odstranil')] ze své blízkosti, [Select_CString(ROOT.Char.IsFemale,'má','můj')] [ROOT.GetCharacter.Custom('GetMongolHonorific')|l] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')], ale před něčím tě musím varovat,“ obrátí se ke mně [achmach_scope.GetTitledFirstNameNoTooltip] poté, co dopije svůj [Glossary( 'kumis', 'KUMIS_GLOSS' )]."
 nomad_events.0002.desc.outro: "\n\n„Jen se na okamžik zamysli... Co vedlo [jealous_courtier.Custom('CZ_TitledFirstName_A')] k tomu, aby o mně [Select_CString(jealous_courtier.IsFemale,'mluvila','mluvil')] tak špatně? Možná se tě někdo snaží odloučit právě od těch, kterým na tobě záleží nejvíc.“"
 nomad_events.0002.a: "„Lituji, že jsem tě od sebe [Select_CString(ROOT.Char.IsFemale,'odehnala','odehnal')].“"
 nomad_events.0002.b: "„Už jsem se [Select_CString(ROOT.Char.IsFemale,'rozhodla','rozhodl')].“"
 nomad_events.0003.t: "$nomad_events.ill_advised.header$: Není kouře bez ohně"
 nomad_events.0003.desc.intro: "Ohniště je v tuto noční hodinu už téměř plné popela. Opilecké rozhovory postupně utichají, aby vzápětí znovu propukly v hlučné veselí. Bez jakékoli snahy o nenápadnost ke mně přistoupí [jealous_courtier_2.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('jealous_courtier_2'))|l].\n\n"
 nomad_events.0003.desc.rehired: "„Tvá laskavost je až příliš veliká, [ROOT.GetCharacter.Custom('GetMongolHonorific')|l] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]. [achmach_scope.GetTitledFirstName|U] musel povolat mocné démony, aby tě dokázal takhle oklamat.“"
 nomad_events.0003.desc.not_rehired: "„Přestože jsi [achmach_scope.Custom('CZ_TitledFirstName_A')] [Select_CString(ROOT.Char.IsFemale,'vykázala','vykázal')] ze své blízkosti, obávám se, že [Select_CString(achmach_scope.IsFemale,'její','jeho')] úklady tím neskončily.“"
 nomad_events.0003.desc.outro: "\n\n„To utrpení, které mi [achmach_scope.GetTitledFirstName] působí, snad nikdy neskončí!“ hlasitě si povzdechne [jealous_courtier_2.GetFirstNameNoTooltip]. „Není pochyb, že se uchyluje k zakázaným zaříkávadlům a nebezpečným kouzlům! Vždyť [dummy_attracted_gender.GetWomenMen|l] z celého našeho tábora se vrhají do [Select_CString(achmach_scope.IsFemale,'její','jeho')] náruče!“"
 nomad_events.0003.a: "Rozhodně chápu proč..."
 nomad_events.0003.b: "Tohle musí skončit."
 nomad_events.0003.c: "#EMP Ha, ha, ha!#!"
 nomad_events_0003_b_tt: "Tvá nestálost vzbudí nelibost"
 mpo_assertion_modifier: "Rozhodný ochránce"
 mpo_assertion_modifier_desc: "Tato postava prosadila svou autoritu vůči záletnému rádci."
 nomad_events_0003_a_tt: "Tvá [Concept('scheme','intrika')|E] začne s vyšším postupem a získá [Concept('modifier','modifikátor')|E] [GetModifier('extra_success_chance_modifier').GetNameWithTooltip]"
 nomad_events.0004.opening: "[Select_CString(ROOT.Char.IsFemale,'Nejmilosrdnější','Nejmilosrdnějšímu')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_D')],"
 nomad_events.0004.desc: "Pokorně tě prosím, abys [Select_CString(ROOT.Char.IsFemale,'přijala','přijal')] tento skromný dar, který jsem s velkým úsilím [Select_CString(achmach_scope.IsFemale,'shromáždila','shromáždil')].\n\nDěkuji za velikou důvěru, kterou ve mne vkládáš."
 nomad_events.0004.a: "Jak milá pozornost."
 nomad_events.0005.desc: "Přiletí supi a oberou tě do poslední nitky.\n\nMěj se na pozoru."
 nomad_events.0005.a: "Co to má znamenat...?"
 nomad_events_0005_tt: "Nyní můžeš použít [Concept('character_interaction','interakci s postavou')|E] $interrogate_interaction$ vůči [achmach_scope.Custom('CZ_ShortUIName_D')], [jealous_courtier.Custom('CZ_ShortUIName_D')] a [jealous_courtier_2.Custom('CZ_ShortUIName_D')]"
 nomad_events_0005_tt_only_one: "Nyní můžeš použít [Concept('character_interaction','interakci s postavou')|E] $interrogate_interaction$ vůči [achmach_scope.Custom('CZ_ShortUIName_D')] a [jealous_courtier.Custom('CZ_ShortUIName_D')], abys odhalil význam záhadného dopisu"
 nomad_events.0006.t: "$nomad_events.ill_advised.header$: Výslechy"
 nomad_events.0006.desc.achmach: "Ve stanu [recipient.Custom('CZ_TitledFirstName_G')] panuje taková tma, že bez přimhouření očí sotva něco rozeznám. [recipient.GetFirstNameNoTooltip|U] odpočívá na polštáři [ROOT.Char.Custom('GetSimpleColor')|l] barvy.\n\n„Ach, [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')], čím jsem si [Select_CString(recipient.IsFemale,'zasloužila','zasloužil')] takovou přízeň?“"
 nomad_events.0006.desc.courtier: "[recipient.GetTitledFirstName|U] odpočívá na lůžku a pokojně popíjí [Glossary( 'bol', 'BOL_GLOSS' )].\n\n„[ROOT.GetCharacter.Custom('GetMongolHonorific')|U] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]!“ Při mém příchodu [recipient.GetFirstNameNoTooltip] okamžitě vstane a podá mi vlastní misku. „Prosím, smím se zeptat, co tě ke mně přivádí?“"
 nomad_events.0006.desc.courtier_2: "[recipient.GetTitledFirstName|U] [recipient.Custom('quirk_pos_present')], když vstoupím do stanu. Z oděvu je stále cítit vůně čerstvé trávy.\n\n„[Select_CString(ROOT.Char.IsFemale,'Má','Můj')] [ROOT.GetCharacter.Custom('GetMongolHonorific')] [Select_CString(ROOT.Char.IsFemale,'paní','pane')]! Pověz mi, prosím, jak ti mohu posloužit?“"
 nomad_events.0006.desc.calm: "\n\nPodám [recipient.Custom('CZ_ShortUIName_D')] dopis a očekávám vysvětlení."
 nomad_events.0006.desc.fallback: "\n\nHodím dopis k nohám [recipient.Custom('CZ_ShortUIName_G')] a dožaduji se vysvětlení."
 nomad_events.0006.desc.achmach_outro: "\n\n„Ach, vidím, že má zpráva k tobě dorazila. Už dříve jsem tě [Select_CString(recipient.IsFemale,'varovala','varoval')], [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]. Dokážu nechat psy vyhladovět natolik, že už neudělají ani krok. Pak nebudou moci pokousat svého pána.“"
 nomad_events.0006.desc.courtier_outro: "\n\n„Přece si nemůžeš myslet, že se ten dopis týká mě, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]. Vždyť jsem se tě jen [Select_CString(recipient.IsFemale,'snažila','snažil')] chránit!“"
 nomad_events.0006.desc.courtier_outro_2: "\n\n[recipient.GetFirstNameNoTooltip|U] si nervózně poškrábe krk a naléhavě prohlásí: „S tím nemám nic společného.“"
 nomad_events.0006.a: "Vymáčknu z tebe pravdu jako mléko z klisny."
 nomad_events.0006.b: "Ten dopis se očividně týkal černé magie."
 nomad_events.0006.c: "Proč se tváříš tak nervózně?"
 nomad_events.0006.d: "Proměň mé nepřátele v mršiny."
 nomad_events.0006.e: "Nedá se ti věřit."
 nomad_events.0006.f: "Věřím, že se ten dopis netýkal tebe."
 bol: "Bol"
 BOL_GLOSS: "Kvašený nápoj vyráběný z medu, podobný medovině."
 nomad_events_0006_d_tt: "Všechny tvé [Concept('schemes','intriky')|E] typu [GetScheme('murder').GetTypeName] budou mít vyšší [Concept('success_chance','šanci na úspěch')|E], dokud bude [achmach.GetShortUIName] tvým [Concept('councillor','rádcem')|E]"
 nomad_events_0006_c_success_info: "Odhalíš příčinu neklidu"
 nomad_events.0006.c.success: "[recipient.GetShortUIName|U] se přizná"
 nomad_events_0006_c_success_loyal: "Šlo pouze o žárlivost"
 nomad_events_0006_c_success_disloyal: "Byli svědky temného rituálu"
 nomad_events.0006.c.failure: "Úmysly [recipient.Custom('CZ_ShortUIName_G')] zůstanou nejasné"
 ACHMACH_MURDER_BONUS: "Slib schopného rádce"
 nomad_events.0007.t: "$nomad_events.ill_advised.header$: Zlomený paroh"
 nomad_events.0007.desc.imprisoned: "K vězňům se přibližuje jen málokdo. Nemají ani ohniště, u kterého by se zahřáli, a tak se třesou zimou. Když však přijdu blíž, zjistím, že [achmach_scope.GetTitledFirstName] nikde není."
 nomad_events.0007.desc.fallback: "Všimnu si, jak [achmach_scope.GetTitledFirstName] opouští společnost uprostřed pití a potyček, mnohem dříve než obvykle. Mine svůj stan a zamíří do divočiny."
 nomad_events.0007.desc.outro: "\n\nNáhlé zapraskání mi umožní sledovat stopy. Nakonec najdu [achmach_scope.Custom('CZ_ShortUIName_A')], jak se krčí u země. Dlouhý stín se sklání nad jakýmisi nástroji.\n\n[achmach_scope.GetTitledFirstName|U] láme jelení parohy, jako by to byly křehké větvičky. Jejich úlomky létají do všech stran."
 nomad_events.0007.aa: "Já to věděl! [achmach_scope.GetTitledFirstName|U] je proti mně! Všichni jsou!"
 nomad_events.0007.a: "#EMP Ha!#! Tohle už jsem [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')] tisíckrát."
 nomad_events.0007.b: "Co to #EMP doopravdy#! děláš?"
 nomad_events.0007.b.success: "Získáš jistotu o skutečných úmyslech [achmach_scope.Custom('CZ_ShortUIName_G')]"
 nomad_events.0007.b.failure: "Úmysly [achmach_scope.Custom('CZ_ShortUIName_G')] ti zůstanou nejasné"
 nomad_events.0007.c: "Řekni mi pravdu. #EMP Okamžitě.#!"
 nomad_events_0007_b_success_info: "Odhalíš skutečnou povahu rituálu"
 nomad_events.0008_0009.desc.intro: "Z ohniště stoupá dým bledý jako mrtvolné maso. [achmach_scope.GetTitledFirstName|U] začne mumlat zaklínadlo a pak pronese stále hlasitěji:\n\n"
 nomad_events.0008.t: "$nomad_events.ill_advised.header$: Přízeň nebes"
 nomad_events.0008.desc: "$nomad_events.0008_0009.desc.intro$„Kéž [achmach_scope.GetFaith.HighGodName] bdí nad tebou a chrání tě svou přízní, [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')], [ROOT.Char.Custom('FormOfAddressForLiege')]. Kéž tví nepřátelé padají k zemi jako balvany z vysokých hor.“\n\n[achmach_scope.GetTitledFirstName|U] se otočí a spatří mě. [ROOT.Char.Custom2('QuirkPPPosOrNeg', SCOPE.sC('achmach_scope'))] „[ROOT.GetCharacter.Custom('GetMongolHonorific')|U] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')], nyní tě budou chránit sama nebesa,“ vysvětlí mi a podá mi amulet vyrobený z paroží."
 nomad_events.0008.a: "Říkáš, že [achmach_scope.GetFaith.HighGodName] poskytuje ochranu... Pověz mi o tom víc."
 nomad_events.0008.b: "Tenhle amulet budu nosit vždy při sobě."
 nomad_events.0008.c: "To je skutečně působivé dílo! Věnuj se této práci naplno."
 magic_amulet: "Ochranný amulet"
 magic_amulet_desc: "Rozštípnutý paroh potřísněný krví. Jeho výsady byly opáleny."
 nomad_events_0008_b_tt: "Dokud budeš mít nasazený [Concept('artifact','artefakt')|E] [newly_created_artifact.GetName], získáš přístup k [Concept('decision','rozhodnutí')|E] $pray_to_protective_amulet_decision$"
 pray_to_protective_amulet_decision: "Modlitba u amuletu ($magic_amulet$)"
 pray_to_protective_amulet_decision_desc: "Amulet zasvěcený ochraně před nebezpečím."
 pray_to_protective_amulet_decision_confirm: "Pomodlit se"
 pray_to_protective_amulet_decision_tooltip: "Modlitbou snížíš [Concept('stress','stres')|E]"
 pray_to_protective_amulet_decision_valid_tt: "Musíš mít nasazený [Concept('artifact','artefakt')|E] $magic_amulet$"
 pray_to_protective_amulet_decision_toast: "Modlitba tě uklidnila"
 nomad_events.0009.t: "$nomad_events.ill_advised.header$: Krev na kosti"
 nomad_events.0009.desc: "$nomad_events.0008_0009.desc.intro$„Kéž [Select_CString(ROOT.Char.IsFemale,'nehodná','nehodný')] [ROOT.Char.GetTitledFirstNameNoTooltip] zakusí hněv, který sešle [achmach_scope.GetFaith.HighGodName]. Kéž [Select_CString(ROOT.Char.IsFemale,'její','jeho')] život bude krátký a plný utrpení.“\n\n[achmach_scope.GetTitledFirstName|U] se otočí a spatří mě. Okamžitě sevře v rukou amulet na hrudi, jako by se jím [Select_CString(achmach_scope.IsFemale,'chtěla','chtěl')] chránit."
 nomad_events.0009.a: "Rozbiju ti lebku!"
 nomad_events.0009.b_imprisoned: "Co to tam máš?"
 nomad_events.0009.b: "Ať se propadneš v prach! A tohle mi dej."
 nomad_events.0009.c: "Tohle je #EMP naposledy#!, co mě někdo zaskočil."
 mpo_eyes_everywhere_modifier: "Oči všude"
 mpo_eyes_everywhere_modifier_desc: "Tato postava se rozhodla věnovat veškeré své úsilí odhalování a maření intrik namířených proti sobě."
 nomad_events.0010.t: "$nomad_events.ill_advised.header$: Nůž ve tmě"
 nomad_events.0010.desc.intro: "Zdá se mi o nekonečném nebi. Mraky víří, rozplývají se, přichází déšť a hromobití, které nebere konce. Náhle ucítím, jak mi po hrudi stéká kapka vody. Její chlad mě probudí.\n\n"
 nomad_events.0010.desc.loyal: "Nade mnou stojí zahalená postava a na krku mi drží nůž.\n\n„K zemi!“ vykřikne [achmach_scope.GetTitledFirstName] a odstrčí útočníka ode mě. Ten bolestně zachroptí, když zády narazí do stěny."
 nomad_events.0010.desc.disloyal: "Nade mnou stojí [achmach_scope.GetTitledFirstName] a na krku mi drží nůž. [Select_CString(achmach_scope.IsFemale,'Strčím ji','Strčím ho')] na zem, ale téměř okamžitě se znovu postaví."
 nomad_events.0010.aaa: "Nemáš ponětí, s kým si zahráváš..."
 nomad_events.0010.aa: "Já odsud #EMP mizím#!!"
 nomad_events_0010_aa_tt: "Dáš se na útěk ze všech sil"
 nomad_events.0010.a: "[achmach_scope.Custom('CZ_ShortUIName_V')|U], chyť [Select_CString(assassin.IsFemale,'ji','ho')]!"
 nomad_events.0010.a.success: "[achmach_scope.GetShortUIName|U] zabije atentátníka"
 nomad_events.0010.a.failure: "Atentátník zraní [achmach_scope.Custom('CZ_ShortUIName_A')]"
 nomad_events.0010.b: "Stráže! Stráže!"
 nomad_events.0010.b.success: "Tvé stráže čekaly hned za vchodem"
 nomad_events.0010.b.failure: "Tvé stráže zanedbaly své povinnosti"
 nomad_events.0010.c_imprisoned: "Vrať se do své díry!"
 nomad_events.0010.c: "Za tohle mi zaplatíš!"
 nomad_events.0010.c.success: "Zvítězíš v souboji"
 nomad_events.0010.c.failure: "[dueling_enemy.GetShortUIName|U] tě zraní"
 mpo_imprisoned_assassin_modifier: "Uvěznění nepřátelé"
 mpo_imprisoned_assassin_modifier_desc: "Této postavě se podařilo uvěznit člověka, který se ji pokusil zavraždit."
 nomad_events.0100.t: "To není moje stádo"
 nomad_events.0100.desc: "„Věříš tomu, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]?!“ [vassal_1.GetTitledFirstName|U] ke mně přikluse na koni. „[Select_CString(vassal_2.IsFemale,'Ta','Ten')] [vassal_2.Custom2('InsultAdjective', SCOPE.sC('vassal_1'))|l] [vassal_2.GetFirstName] mi v noci [Select_CString(vassal_2.IsFemale,'ukradla','ukradl')] několik zvířat! [Select_CString(vassal_2.IsFemale,'Vplížila','Vplížil')] se do ohrady jako červ škvírou ve zdi!“\n\n„Požaduji, aby mi vrátili všechno, co mi bylo ukradeno. Jinak si svá zvířata vezmu zpátky [Select_CString(vassal_1.IsFemale,'sama','sám')]!“"
 nomad_events.0100.aa: "„Myslím, že ta zvířata byla moje.“"
 nomad_events.0100.a: "„[vassal_2.GetTitledFirstNameNoTooltip|U] musí ukradené stádo vrátit.“"
 nomad_events.0100.b: "„Těmto obviněním nevěřím.“"
 nomad_events.0100.c: "„S takovými nesmysly obtěžuješ svého [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_A')]?“"
 friend_supported_in_herd_dispute: "[CZProDrop(CHARACTER,'podpořila','podpořil')|U] [TARGET_CHARACTER.Custom('CZ_ShortUIName_A')] ve sporu o stádo"
 friend_supported_in_herd_dispute_corresponding: "[CZProDrop(TARGET_CHARACTER,'získala','získal')|U] podporu [CHARACTER.Custom('CZ_ShortUIName_G')] ve sporu o stádo"
 nomad_events.0110.t: "V úzkých"
 nomad_events.0110.desc: "Sníh. Šumění stromů. Odkudsi z dálky se ozývá vytí. I když... vlastně není tak daleko.\n\n„Pomoc! Pomoc!“ Hlas [victim.Custom('CZ_TitledFirstName_G')] okamžitě poznám a rozběhnu se tím směrem. #EMP „Prosím, pomozte mi!“#!\n\nKdyž dorazím na místo, spatřím [victim.Custom('CZ_FirstNameNoTooltip_A')], jak se krčí za několika balvany. Pomalu se blíží osamělý vlk."
 nomad_events.0110.a: "„$knight_culture_player_plural_no_tooltip$, na toho vlka!“"
 nomad_events.0110.b: "„Zlámu ti vaz, bestie!“"
 nomad_events.0110.b.success: "Podaří se ti zvíře zahnat"
 nomad_events.0110.b.failure: "Zvíře tě zraní"
 nomad_events.0110.c: "„Utíkej, [victim.Custom('CZ_FirstNameNoTooltip_V')]!“"
 nomad_events.0110.c.success: "[victim.GetShortUIName|U] běží rychleji než kdykoli předtím"
 nomad_events.0120.t: "Večerní projížďka"
 nomad_events.0120.desc: "Nad našimi hlavami se mraky skládají do podob zvířat. Společně s [companion.Custom('CZ_FirstName_I')] se vydáváme na koních o něco dál od tábora.\n\n„Jak daleko ses vlastně někdy [Select_CString(ROOT.Char.IsFemale,'dostala','dostal')], [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]?“\n\n„Já jsem se nikdy moc daleko [Select_CString(companion.IsFemale,'nedostala','nedostal')],“ zazní odpověď s náznakem studu. „Ale jednou bych [Select_CString(companion.IsFemale,'chtěla','chtěl')] navštívit zemi, kde nikdo nerozumí mému jazyku.“"
 nomad_events.0120.a: "„Chci tě lépe poznat.“"
 nomad_events.0120.b: "Příležitost poznat [companion.Custom('CZ_FirstNameNoTooltip_A')] trochu blíž..."
 nomad_events.0120.c: "Musím se soustředit na jízdu."
 lover_evening_ride: "Romantická večerní projížďka sblížila [CHARACTER.Custom('CZ_ShortUIName_A')] a [TARGET_CHARACTER.Custom('CZ_ShortUIName_A')]"
 lover_evening_ride_corresponding: "Romantická večerní projížďka sblížila [TARGET_CHARACTER.Custom('CZ_ShortUIName_A')] a [CHARACTER.Custom('CZ_ShortUIName_A')]"
 friend_evening_ride: "Společná večerní projížďka upevnila přátelství mezi [CHARACTER.Custom('CZ_ShortUIName_I')] a [TARGET_CHARACTER.Custom('CZ_ShortUIName_I')]"
 friend_evening_ride_corresponding: "Společná večerní projížďka upevnila přátelství mezi [TARGET_CHARACTER.Custom('CZ_ShortUIName_I')] a [CHARACTER.Custom('CZ_ShortUIName_I')]"
 nomad_events.0130.t: "Výhodný obchod"
 nomad_events.0130.desc: "Neznámá postava se snaží uklidnit dvojici neposedných koní a přitahuje jim otěže.\n\n„Klid, jen klid,“ tiší je. „Ach, to je ale šťastné setkání!“ [merchant.GetTitledFirstName|U] se ke mně otočí se širokým úsměvem.\n\n„Pokud by tě zajímalo něco z mého zboží,“ nabídne a ukáže na koně, „mám tamhle na pastvině také několik ovcí.“"
 nomad_events.0130.a: "„Zmiz. A zvířata tu nech.“"
 nomad_events.0130.b: "„Schopný obchodník by se mi hodil.“"
 nomad_events.0130.c: "„[Select_CString(ROOT.Char.IsFemale,'Ráda','Rád')] si něco koupím.“"
 nomad_events.0130.d: "„Nemám zájem.“"
 nomad_events.0140.t: "Daleko od domova"
 nomad_events.0140.desc: "„...Už jsi [Select_CString(merchant.IsFemale,'ji','ho')] viděl?“ „Odkud asi pochází?“ „A co říkáš na [Select_CString(merchant.IsFemale,'její','jeho')] oblečení?“\n\nKdyž procházím táborem, neustále ke mně doléhá šeptání a tlumené rozhovory. Brzy pochopím proč. U mého ohniště stojí [Select_CString(merchant.IsFemale,'podivně oblečená cizinka','podivně oblečený cizinec')].\n\n„Zdravím tě, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]. Není divu, že jsi [ROOT.GetCharacter.Custom('GetMongolHonorific')|l]! Jsem [Select_CString(merchant.IsFemale,'obchodnice','obchodník')] [merchant.GetFaith.Custom('CZ_AdjectiveNoTooltip_eeho')|l] vyznání a [Select_CString(merchant.IsFemale,'uvízla','uvízl')] jsem v této neznámé zemi. [Select_CString(merchant.IsFemale,'Ráda','Rád')] bych [Select_CString(merchant.IsFemale,'strávila','strávil')] několik let u tvého dvora.“"
 nomad_events.0140.a: "„Pověz mi víc o své víře. Jaké učení hlásá [merchant.GetFaith.GetNameNoTooltip]?“"
 nomad_events.0140.b: "„Můj tábor tě vítá.“"
 nomad_events.0140.c: "„Odejdi. Okamžitě.“"
 nomad_events.0140.a.tt: "Pokud přijmeš [merchant.GetFaith.GetName], získáš při konverzi slevu #P 50%#!"
 nomad_events.0150.t: "Ještě jeden pohár"
 nomad_events.0150.desc: "Misky plné až po okraj [Glossary( 'kumisu', 'KUMIS_GLOSS' )] putují od jednoho člověka k druhému.\n\n„Sem, sem!“ volá [companion.GetTitledFirstName] a gestikuluje ve snaze získat další dávku. „Vždyť si to žádá [ROOT.Char.GetTitleAsNameNoTooltip]!“, rozesměje se a věnuje mi široký úsměv. „Jste pomalí jako hříbata! Pohyb!“\n\n„Ach!“ Konečně se miska dostane do rukou [companion.Custom('CZ_FirstName_G')], ale místo aby se z ní [Select_CString(companion.IsFemale,'napila','napil')], okamžitě mi ji nabídne.\n\n„Tak se napijme, [Select_CString(ROOT.Char.IsFemale,'má milá','můj milý')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')], neboť noc je ještě mladá, ale my už brzy nebudeme!“"
 nomad_events.0150.a: "„Víš, kdo je skutečný zbabělec? Ten hlupák [rival.GetFirstNameNoTooltip].“"
 nomad_events.0150.a.tt: "Tato možnost je dostupná, protože máš [Concept('rival','soka')|E]"
 nomad_events.0150.b: "„Tak na zdraví!“"
 nomad_events.0150.c: "Lahodná příležitost ukázat, kolik toho vydržím."
 KUMIS_GLOSS: "Kvašený alkoholický nápoj vyráběný z kobylího mléka, rozšířený po celé Velké stepi. V mongolských jazycích je známý také jako #EMP ajrag#!."
 friend_drank_together: "[CZProDrop(CHARACTER,'prožila','prožil')|U] společně s [TARGET_CHARACTER.Custom('CZ_ShortUIName_I')] večer plný pití a žertování"
 friend_drank_together_corresponding: "[CZProDrop(TARGET_CHARACTER,'prožila','prožil')|U] společně s [CHARACTER.Custom('CZ_ShortUIName_I')] večer plný pití a žertování"
 nomad_events.0160.t: "Vlídné slovo"
 nomad_events.0160.desc.intro: "„Už nějakou dobu mi něco vrtá hlavou,“ pronese [spouse.GetFirstName], když odpočívá na lůžku. „V poslední době jsem si na tobě něčeho [Select_CString(spouse.IsFemale,'všimla','všiml')].“\n\n"
 nomad_events.0160.desc.dread: "„Tvá přítomnost nahání [ROOT.Char.GetWomenMen|l] hrůzu. Křičí, prchají a prosí tě o slitování.“"
 nomad_events.0160.desc.prowess: "„Tvá udatnost nemá sobě rovného. Ostatní [ROOT.Char.GetWomenMen|l] ti ji závidí a vrhají po tobě žárlivé pohledy.“"
 nomad_events.0160.desc.lover: "„Láska, kterou k tobě cítím, den ode dne sílí. Je jako divoká květina na stepi, která nikdy neuvadá.“"
 nomad_events.0160.desc.brave: "„Tvá odvaha je pro všechny inspirací. Když vidí tvou statečnost, [ROOT.Char.GetWomenMen|l] zatouží jít za tebou, kamkoli je povedeš.“"
 nomad_events.0160.desc.generic: "„Tvá mysl je stejně silná jako tvé paže. [ROOT.Char.GetWomenMen|U] tě budou následovat kamkoli.“"
 nomad_events.0160.desc.outro: "„Všímám si toho všeho. A musím přiznat, že na mě děláš velký dojem.“\n\n[spouse.GetFirstNameNoTooltip|U] mi pokyne, abych [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')] blíž."
 nomad_events.0160.a: "„Konečně jsi [Select_CString(spouse.IsFemale,'dostala','dostal')] rozum.“"
 nomad_events.0160.b: "„Také tě miluji, má lásko.“"
 nomad_events.0160.c: "„Nezapomeň to všem říct.“"
 lover_admirable_thing: "[CZProDrop(TARGET_CHARACTER,'vyznala','vyznal')|U] svůj hluboký obdiv k [CHARACTER.Custom('CZ_ShortUIName_D')]"
 lover_admirable_thing_corresponding: "[CZProDrop(CHARACTER,'vyznala','vyznal')|U] svůj hluboký obdiv k [TARGET_CHARACTER.Custom('CZ_ShortUIName_D')]"
 nomad_events.0170.t: "Obávaný vládce"
 nomad_events.0170.desc: "Když vstoupím do stanu, [spouse.GetFirstName] sedí u ohniště. Při pohledu na mě sebou trhne, tiše si povzdechne a sklopí zrak.\n\nZatímco se svlékám a oplachuji si obličej vodou, nepadne jediné slovo. Po chvíli však začne být ticho nesnesitelné.\n\n„Musím si s tebou promluvit, [Select_CString(ROOT.Char.IsFemale,'má milá','můj milý')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ ozve se tichý hlas. „Všichni se tě bojí. A já... já se tě bojím stejně jako oni,“ přizná se [spouse.GetFirstNameNoTooltip]."
 nomad_events.0170.a: "„Myslíš si snad, že jsem #EMP [Select_CString(ROOT.Char.IsFemale,'slabá','slabý')]#!?“"
 nomad_events.0170.b: "„Příliš dlouho jsem [Select_CString(ROOT.Char.IsFemale,'podléhala','podléhal')] svému hněvu.“"
 nomad_events.0170.c: "„Jinak to nejde.“"
 dread_spouse_modifier: "Lépe budit strach"
 dread_spouse_modifier_desc: "Než být milován."
 nomad_events.0180.t: "Nejslabší článek"
 nomad_events.0180.desc: "Smích [rival.Custom('CZ_TitledFirstName_G')] zaslechnu dřív, než se mi podaří zjistit, odkud přichází. Stojí ke mně téměř zády a z dechu je cítit [Glossary( 'kumis', 'KUMIS_GLOSS' )].\n\n„#EMP Kdo#! nám bude vládnout, až [ROOT.Char.GetTitledFirstNameNoTooltip] skončí jako potrava pro ptáky? Snad [child.GetFirstName]? Vždyť má tak slabou paži, že sotva dokáže udržet pohromadě vlastní prsty!“\n\n„Ne. Rozhodně to nebude [Select_CString(child.IsFemale,'ta milá a poslušná','ten milý a poslušný')] [child.GetFirstNameNoTooltip].“"
 nomad_events.0180.a: "„O mé rodině už #EMP nikdy#! takhle mluvit nebudeš.“"
 nomad_events.0180.b: "Je načase, aby se [child.GetFirstNameNoTooltip] něco [Select_CString(child.IsFemale,'naučila','naučil')]."
 nomad_events.0180.c: "Ať slova [rival.Custom('CZ_FirstNameNoTooltip_G')] odnese vítr."
 nomad_events.0190.t: "Jako za starých časů"
 nomad_events.0190.desc: "„[Glossary( 'Vladařská čapka ti sluší', 'TAKE_HAT_GLOSS' )], [Select_CString(ROOT.Char.IsFemale,'má milá','můj milý')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ prohlásí [friend.GetTitledFirstName] se smíchem. Přitáhne otěže svého koně a konejšivě ho hladí po hlavě, dokud se neuklidní. „Hej! Pomalu!“\n\nPak se ke mně znovu otočí. „Nemůžu uvěřit, že jsi pořád [Select_CString(ROOT.Char.IsFemale,'stejná','stejný')] jako před všemi těmi lety. Napadlo tě někdy, že to s námi takhle dopadne?“\n\nPři těch slovech se neubráním úsměvu a vzpomenu si na dobu, kdy [memory.GetDescription|l]."
 nomad_events.0190.a: "„Jsi mi stejně [Select_CString(friend.IsFemale,'drahá','drahý')] jako vlastní krev.“"
 nomad_events.0190.b: "„S tebou se cítím v bezpečí.“"
 nomad_events.0190.c: "„Ha! A to je teprve začátek!“"
 nomad_events.0190.d: "„Ať o našem příběhu slyší každý strom!“"
 mpo_good_memory_modifier: "Hřejivé vzpomínky"
 mpo_good_memory_modifier_desc: "Krásné vzpomínky naplňují tuto postavu radostí."
 TAKE_HAT_GLOSS: "Mongolské úsloví vyjadřující moc, vládcovskou autoritu a královskou důstojnost."
 friend_cute_memory: "[CZProDrop(CHARACTER,'zavzpomínala','zavzpomínal')|U] společně s [TARGET_CHARACTER.Custom('CZ_ShortUIName_I')] na krásný okamžik z dávné minulosti"
 friend_cute_memory_corresponding: "[CZProDrop(TARGET_CHARACTER,'zavzpomínala','zavzpomínal')|U] společně s [CHARACTER.Custom('CZ_ShortUIName_I')] na krásný okamžik z dávné minulosti"
 nomad_events.0200.t: "V mých snech"
 nomad_events.0200.desc.intro: "Zatímco dopíjím svou [Glossary( 'boal', 'BOL_GLOSS' )], [courtier.GetTitledFirstName] se posadí vedle mě. Zahledí se do plamenů a začne vyprávět:\n\n„Minulou noc se mi zdál sen. [Select_CString(courtier.IsFemale,'Spatřila','Spatřil')] jsem bílého sokola, jak se snesl "
 nomad_events.0200.desc.good: "z Měsíce a usedl ti na ruku. Rozžehl na ní plamen a pak odletěl.“"
 nomad_events.0200.desc.bad: "ze Slunce, ale vzápětí ho sežral divoký pes. Jeho tělo zůstalo ležet v kaluži krve.“"
 nomad_events.0200.desc.outro: "\n\nZdá se, že oheň najednou sálá mnohem silněji. Po čele mi stékají kapky potu."
 nomad_events.0200.a: "„Svůj osud si vytesám do kostí padlých.“"
 nomad_events.0200.b: "„Prosím, zjisti, co ten sen znamená.“"
 nomad_events.0200.c: "„Zlá znamení jen zocelují [ROOT.Char.GetWomenMen|l].“"
 nomad_events.0200.d: "„Stane se to, co určí [ROOT.Char.GetFaith.HighGodName].“"
 mpo_no_omens_modifier: "Osud ve vlastních rukou"
 mpo_no_omens_modifier_desc: "Tato postava nedovolí, aby sny rozhodovaly o jejím osudu."
 nomad_events.0210.t: "Jen kořínky"
 nomad_events.0210.desc.intro: "Kolem tábora se potulují psi. Je jich stále méně a pod napjatou kůží jim vystupují kosti. Včera v noci padla jedna ovce. Do rána z ní nezbylo vůbec nic.\n\n"
 nomad_events.0210.desc.spouse: "„Má lásko...“ [family.GetFirstName|U] ke mně přistoupí a v dlani pevně svírá hrst kořínků. „Celé dopoledne jsem [Select_CString(family.IsFemale,'hledala','hledal')] něco k jídlu, ale tohle je všechno, co se mi podařilo najít.“"
 nomad_events.0210.desc.child: "„[ROOT.Char.GetMotherFather|U]...“ [family.GetFirstName|U] ke mně přistoupí se zarudlýma očima a v rukou drží hrst kořínků. „[Select_CString(family.IsFemale,'Nasbírala','Nasbíral')] jsem ti je... Promiň, že jsem [Select_CString(family.IsFemale,'nenašla','nenašel')] víc.“"
 nomad_events.0210.aa: "[courtier.GetShortUINameNoTooltip|U] vypadá v poslední době nějak podezřele dobře..."
 nomad_events.0210.a: "„Tvůj soucit nepotřebuji.“"
 nomad_events.0210.b.child: "„Děkuji ti, mé dítě.“"
 nomad_events.0210.b.spouse: "„Má lásko...“"
 nomad_events.0210.c: "„Nedovolím, abys takhle strádal.“"
 nomad_events_0210_c_tt: "Při použití [Concept('character_interaction','interakce s postavou')|E] $mpo_ask_for_herd_interaction$ získáš po dobu následujících #value 5#! let větší příspěvek do [Concept('herd','stáda')|E]"
 friend_offered_roots: "[CZProDrop(TARGET_CHARACTER,'nabídla','nabídl')|U] [CHARACTER.Custom('CZ_ShortUIName_D')] nasbírané kořínky, na pomoc v těžkých časech."
 friend_offered_roots_corresponding: "[CZProDrop(CHARACTER,'nabídla','nabídl')|U] [TARGET_CHARACTER.Custom('CZ_ShortUIName_D')] nasbírané kořínky, na pomoc v těžkých časech."
 nomad_events.0220.t: "Slabá paže"
 nomad_events.0220.desc: "[spouse.GetFirstName|U] leží na boku a třískou si čistí zuby. Když si konečně všimne, že jsem [Select_CString(ROOT.Char.IsFemale,'vstoupila','vstoupil')] do stanu, otráveně obrátí oči v sloup.\n\n„Co jsi dneska [Select_CString(ROOT.Char.IsFemale,'dělala','dělal')]?“ zeptá se posměšně. „Snad jsi [Select_CString(ROOT.Char.IsFemale,'nehladila','nehladil')] zatoulané jehňátko? Nebo jsi svým nepřátelům [Select_CString(ROOT.Char.IsFemale,'líbala','líbal')] prsty u nohou?“\n\n„Nevstupovali jsme do manželství proto, abych [Select_CString(spouse.IsFemale,'měla','měl')] po boku někoho slabého jako proutek. Musíš stát pevně jako mohutný [ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')|l].“"
 nomad_events.0220.a: "„Máš pravdu. Tohle musí skončit.“"
 nomad_events.0220.b: "„Budu cvičit, jak jen to půjde.“"
 nomad_events.0220.c: "„Nemá smysl bojovat proti vlastní přirozenosti. Jsem, kdo jsem.“"
 nomad_events.0230.t: "Stesk po domově"
 nomad_events.0230.desc: "Když otevřu oči, víčka mám stále těžká únavou. Po ranním světle není ani stopy. Teprve když se trochu proberu, zaslechnu tichý pláč [spouse.Custom('CZ_FirstName_G')].\n\n„Já... promiň. [Select_CString(spouse.IsFemale,'Nechtěla','Nechtěl')] jsem tě probudit. Jenže... tolik se mi stýská po domově. Tady je všechno jiné. Zdejší země je [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip|l], ale pro mě nikdy nebude [spouse.GetCulture.GetNameNoTooltip|l].“"
 nomad_events.0230.a: "„Vím, jaké to je.“"
 nomad_events.0230.b: "„Postarám se, aby ses tu cítil jako doma.“"
 nomad_events.0230.c: "„Minulost musíš nechat za sebou.“"
 lover_homesick_comfort: "[CZProDrop(CHARACTER,'utěšila','utěšil')|U] [TARGET_CHARACTER.Custom('CZ_ShortUIName_A')], když se [Select_CString(TARGET_CHARACTER.IsLocalPlayer,'ti',Select_CString(TARGET_CHARACTER.IsFemale,'jí','mu'))] stýskalo po domově."
 lover_homesick_comfort_corresponding: "[CZProDrop(TARGET_CHARACTER,'utěšila','utěšil')|U] [CHARACTER.Custom('CZ_ShortUIName_A')], když se [Select_CString(CHARACTER.IsLocalPlayer,'ti',Select_CString(CHARACTER.IsFemale,'jí','mu'))] stýskalo po domově."
 mpo_hardened_modifier: "Smíření s osudem"
 mpo_hardened_modifier_desc: "Tato postava pochopila, že stesk po minulosti může být nebezpečný."
 nomad_events.0240.t: "Nečekaní hosté"
 nomad_events.0240.desc: "Kolem tábora se rozléhá neustávající bečení.\n\n„Ať už konečně zmlknou!“ zaslechnu naříkat [courtier.Custom('CZ_TitledFirstName_A')], jak si s bolestivou grimasou mne čelo.\n\n„Ach, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]! Konečně jsi tady!“ [courtier.GetFirstNameNoTooltip|U] se usměje a ukáže na stádo ovcí, které stojí opodál.\n\n„Naši lidé našli toto zatoulané stádo poblíž hranice území, kterému vládne [ruler.GetTitledFirstName]. Máme důvod se domnívat, že ovce patří právě [ruler.Custom('CZ_TitledFirstName_D')].“"
 nomad_events.0240.a: "„Všechny si necháme až na jednu. Její hlavu pošlete [ruler.Custom('CZ_FirstNameNoTooltip_D')].“"
 nomad_events.0240.b: "„Pošlete stádo zpátky [ruler.Custom('CZ_ShortUIName_D')].“"
 nomad_events.0240.c: "„To je ale šťastný den.“"
 mpo_honorable_ruler: "Čestný pastevec"
 mpo_honorable_ruler_desc: "Tato postava vrátila zatoulané stádo jeho právoplatnému majiteli."
 house_feud_stolen_herd: "ukradené stádo"
 house_feud_stolen_herd_flavor: "[ROOT.Var('house_feud_attacker').Char.GetFirstName|U] prohloubil své již existující soupeření s [ROOT.Var('house_feud_victim').Char.Custom('CZ_FirstName_I')] tím, že ukradl stádo, které mu patřilo."
 friend_returned_herd: "[CZProDrop(CHARACTER,'prokázala','prokázal')|U] svou čestnost vrácením stáda [TARGET_CHARACTER.Custom('CZ_ShortUIName_D')]."
 friend_returned_herd_corresponding: "[CZProDrop(TARGET_CHARACTER,'prokázala','prokázal')|U] svou čestnost vrácením stáda [CHARACTER.Custom('CZ_ShortUIName_D')]."
 nomad_events.0250.t: "[Select_CString(priest.IsFemale,'Žena, kterou','Muž, kterého')] vede [priest.GetFaith.HighGodName]"
 nomad_events.0250.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], tvá moc budí právem bázeň,“ ozve se neznámý hlas. „Po mnoho měsíců tě hledám, protože si to přeje [priest.GetFaith.HighGodName].“\n\n„Ve svých snech jsem tě [Select_CString(priest.IsFemale,'spatřila','spatřil')] ležet u vlčích tlap. [Select_CString(ROOT.Char.IsFemale,'Otevřela','Otevřel')] jsi ústa zbrocená krví a vypadl z nich [priest.GetFaith.ReligiousSymbol|l], posvátný symbol mé víry.“"
 nomad_events.0250.a: "„Proroctví poznám, když nějaké slyším.“"
 nomad_events.0250.b: "„Zajímavé... Zůstaň s námi.“"
 nomad_events.0250.c: "„Nesmysl! Vyháním tě!“"
 chosen_by_the_heavens_modifier: "Vyvolený nebesy"
 chosen_by_the_heavens_modifier_desc: "Tato postava je přesvědčena, že si ji vyvolila sama nebesa, a její lidé s ní souhlasí."
 nomad_events.0260.t: "Otázky víry"
 nomad_events.0260.desc: "„Zdravím tě, [ROOT.Char.Custom('CZ_Name_V')]. Jmenuji se [priest.GetFullName],“ pronese [Select_CString(priest.IsFemale,'neznámá žena','neznámý muž')] a ukloní se přede mnou. „Má cesta začala v dalekém panství, které nese jméno [distant_realm.GetBaseName]. [Select_CString(other_ruler.IsFemale,'Vyslala','Vyslal')] mě sem [Select_CString(other_ruler.IsFemale,'má','můj')] [other_ruler.GetLadyLord|l], [other_ruler.GetTitledFirstName].“\n\n„Na [Select_CString(other_ruler.IsFemale,'její','jeho')] přání jsem [Select_CString(priest.IsFemale,'přišla','přišel')] šířit pravou víru. Tou je [priest.GetFaith.GetName].“"
 nomad_events.0260.a: "„Jak se opovažuješ urážet mou víru?!“"
 nomad_events.0260.b: "„Chci vědět víc. Co učí [priest.GetFaith.GetNameNoTooltip]?“"
 nomad_events.0260.c: "„Tvůj ubohý bůžek neobstojí, postaví-li se proti němu [ROOT.Char.GetFaith.HighGodName].“"
 nomad_events.0260.c.tt.crit_success: "Na všechny uděláš dojem"
 nomad_events.0260.c.tt.success: "[priest.GetShortUINameNoTooltip|U] je ohromen"
 nomad_events.0260.c.tt.failure: "Ztrapníš se"
 nomad_events.0260.d: "„Zmiz mi z očí.“"
 mpo_nomad_events.1080.t: "Muž s trestním chomoutem"
 mpo_nomad_events.1080.desc_high_intro: "[neighbor_ruler.GetTitledFirstName|U] má svou jurtu v nedalekém kraji zvaném [neighbor_county.GetBaseNameNoTier], ale nyní bez pozvání projíždí mými pastvinami. Moji jezdci obklíčí ozbrojenou družinu stejně rychle, jako se vlci vrhají na kořist.\n\n„[Select_CString(ROOT.Char.IsFemale,'Vznešená','Vznešený')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]!“"
 mpo_nomad_events.1080.desc_low_intro: "[neighbor_ruler.GetTitledFirstName|U] vládne v nedalekém [neighbor_county.Custom('CZ_LandedNameNoTier_L')] a nyní projíždí mými pastvinami. Ozve se poplašný křik. Rychle svolám své [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')|l] a vyrazím vstříc ozbrojené družině.\n\n„Ty... [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]!“"
 mpo_nomad_events.1080.desc_1: " zvolá [neighbor_ruler.GetFirstNameNoTooltip]. „Pronásledujeme uprchlíka. Je to "
 mpo_nomad_events.1080.criminal: "zločinec"
 mpo_nomad_events.1080.desc_2: " a nyní se skrývá [CZTerrainIn(ROOT.Char.GetCapitalLocation)|l] na tvém území. Přestože má na krku trestní [Glossary( 'chomout', 'CANGUE_GLOSS' )], [escaped_warrior.GetFirstName] šplhá po skalách jako koza. Ani nedostatek spánku nebrání tomu, aby dál přelstíval mé stopaře.“\n\n„Naše kořist se ukrývá ve tvých zemích, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]. Připojíš se k pronásledování?“"
 CANGUE_GLOSS: "Trestní nástroj používaný ve stepních oblastech a východní Asii. #G Kanga#! je těžký dřevěný chomout upevněný kolem ramen. Jeho nošení po celé dny či týdny člověka vyčerpává, ponižuje a omezuje v pohybu. Může dokonce způsobit smrt hladem, protože odsouzenému znemožňuje samostatně se najíst."
 mpo_nomad_events.1080.a: "Ten uprchlík vypadá schopně a zdatně..."
 mpo_nomad_events.1080.a.flavor: "Nenechám schopnosti [escaped_warrior.Custom('CZ_FirstNameNoTooltip_G')] zahnívat pod #EMP chomoutem#!. Ne, taková síla posílí mou hordu!"
 mpo_nomad_events.1080.b: "Zažeňte [neighbor_ruler.Custom('CZ_FirstNameNoTooltip_A')] bouří šípů."
 mpo_nomad_events.1080.b.flavor: "Ať už pronásleduje uprchlíka, nebo ne, [neighbor_ruler.GetTitleAsNameNoTooltip] vnikl na mé území bez dovolení. Zaslouží si, aby odtud prchal v bolestech!"
 mpo_nomad_events.1080.c: "Toho zatoulaného kozla doženeme."
 BOUND_TO_FAMILY_WIDOW: "[Select_CString(GetPlayer.IsFemale,'Přísahala','Přísahal')] jsi, že se postaráš o vdovu po svém příbuzném"
 ranged_and_searched_modifier: "Důkladně prohledaná krajina"
 ranged_and_searched_modifier_desc: "Jezdecké družiny prozkoumaly každé údolí, prohlubeň i návrší... a přitom objevily chráněné pastviny a dosud neznámé úkryty."
 family_widow_cant_divorce_tt: "@alert_icon! #alert_trial Po dobu #high 10 let#! se nemůžeš [Concept('divorce','rozvést')|E] s [widow.Custom('CZ_FirstName_I')]#!"
 family_widow_cant_dismiss_tt: "@alert_icon! #alert_trial Po dobu #high 10 let#! nemůžeš propustit [widow.Custom('CZ_FirstName_A')]#!"
 family_widow_seduce_romance_bonus_tt: "Při použití [Concept('schemes','intrik')|E] [GetScheme('seduce').GetTypeName] nebo [GetScheme('courting').GetTypeName] vůči [widow.Custom('CZ_FirstName_D')]: #P +20#! k [Concept('success_chance','šanci na úspěch')|E]"
 scheme_family_widow_seduce_romance: "Zachránil mě před vdovstvím: $VALUE|0=-+$"
 inspired_in_wifely_duties_modifier: "Milovaná a inspirovaná"
 inspired_in_wifely_duties_modifier_desc: "Tato žena vede svou domácnost s neobyčejnou oddaností, neboť dobře ví, jakou lásku a věrnost jí projevuje rodina jejího manžela."
 concubine_lavished_attention_modifier: "Zahrnovaná pozorností"
 concubine_lavished_attention_modifier_desc: "Tato žena zakusila oddanost panovníka i veškerý přepych, který s ní přichází."
 truce_family_widow: "\nPříměří uzavřené při sňatku: [ROOT.Char.GetShortUIName] a vdova [widow.GetShortUIName]"
 mpo_nomad_events.1091.t: "Úděl vdovy"
 mpo_nomad_events.1091.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_husband'))|l] je po smrti. [dead_husband.GetFirstName|U] už patří větru. Jeho vdova [widow.GetName] truchlí a prolévá slzy. Součástí naší rodiny se stala už ve chvíli, kdy poprvé vstoupila do jurty mého příbuzného.\n\nSrdcem možná stále patří k rodu [ROOT.Char.GetHouse.GetName], ale její místo mezi námi i ochrana, kterou jí naše rodina poskytuje, nyní závisejí na mně... Na mé povinnosti převzít odpovědnost za vše, co po sobě můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_husband'))|l] zanechal.\n\n"
 mpo_nomad_events.1091.desc.marry: "Podle našich zvyklostí bych se měl oženit s [widow.Custom('CZ_TitledFirstNameNoTooltip_I')], vdovou po svém příbuzném."
 mpo_nomad_events.1091.desc.concubine: "Podle našich zvyklostí bych měl přijmout [widow.Custom('CZ_TitledFirstNameNoTooltip_A')], vdovu po svém příbuzném, za svou konkubínu."
 mpo_nomad_events.1091.a: "#EMP Konečně bude moje!#!"
 mpo_nomad_events.1091.a.flavor: "Žena, kterou měl za manželku můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_husband'))|l], je #EMP hotová bohyně#!. Zaslouží si každičkou špetku mé oddanosti."
 mpo_nomad_events.1091.b: "Náš sňatek potěší [widow.Custom('CZ_TitledFirstNameNoTooltip_A')]..."
 mpo_nomad_events.1091.b.flavor: "...a také mě. Toto manželství mi dobře poslouží."
 mpo_nomad_events.1091.c: "Ano, připadnou mi #EMP všechny#! cennosti, které po sobě můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_husband'))|l] zanechal."
 mpo_nomad_events.1091.d: "Má rodina vždy chrání své vlastní."
 mpo_nomad_events.1091.e: "Odteď budeš žebrat se psy, [Select_CString(widow.IsFemale,'ženo','muži')]."
 mpo_nomad_events.1100.t: "Pastviny [capital_province.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')]"
 mpo_nomad_events.1100.desc: "V okolí mé velké jurty, [CZTerrainIn(capital_province)|l], se potulují poslušná stáda dobytka, pastevci i jezdci. Zemi zvanou [capital_province.GetTitle.GetNameNoTier] využíváme do posledního trsu křovin a každého stébla trávy.\n\n"
 mpo_nomad_events.1100.desc.camel: "Jenže v tomhle suchu a žáru toho mnoho neroste. Ze čtyř druhů zvířat, které chováme, si s nedostatkem potravy hlavu neláme pouze jediný. Velbloud. Ten nespokojeně bručí, ale ne proto, že by měl hlad. Touží se volně toulat zdejší krajinou.\n\nZatímco se ostatní zvířata pasou na těch nejlepších místech, velbloudi procházejí pastvinami po celém území [capital_province.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')]."
 mpo_nomad_events.1100.desc.sheep: "Zdejší půda je vyprahlá a kamenitá. Hrubá a řídká vegetace našim koním ani volům příliš nechutná, ale pro ovce a kozy je to hotový ráj.\n\nMléka i vlny máme díky tomu tolik, že [ROOT.Char.GetCulture.GetCollectiveNoun] nemusejí strádat."
 mpo_nomad_events.1100.desc.hunting: "Zdejší zeleň však roste příliš vysoko a otevřených pastvin je poskrovnu. Náš dobytek hubne, a tak se [ROOT.Char.GetCulture.GetCollectiveNoun] při shánění obživy spoléhají na luky a lovecké ptáky.\n\nMísto ovčí vlny obchodujeme s jeleními kožešinami."
 mpo_nomad_events.1100.desc.horses: "Takové místo mohlo vzniknout jen z vůle, kterou představuje [ROOT.Char.GetFaith.HighGodName]. Je to pokojné moře trávy, kde rychlé nohy a ušlechtilá srdce našich koní nacházejí vše, po čem touží.\n\n[ROOT.Char.GetCulture.GetCollectiveNoun|U] zde pasou své oře, dokud nejsou všichni dobře živení a spokojení."
 mpo_nomad_events.1100.a: "Ať jsme [CZTerrainIn(capital_province)|l], pány jsme tu my."
 mpo_nomad_events.1100.a.flavor: "Kdo zná svou zemi, zná také veškeré její bohatství, ať už leží na očích, nebo se skrývá před zraky ostatních."
 mpo_nomad_events.1100.b: "Můj lid si tento kraj neoblíbil."
 mpo_nomad_events.1100.c.camel: "Vyměňte ostatní zvířata za velbloudy!"
 mpo_nomad_events.1100.c.sheep: "Čeká nás skvělá sezóna jehňat."
 mpo_nomad_events.1100.c.hunting: "Tady budeme lovit, nebo zemřeme hlady."
 mpo_nomad_events.1100.c.horse: "Země stvořená pro koně."
 custom.every_camel_terrain_county_tt: "Každé [Concept('county','hrabství')|E] v [Concept('realm','panství')|E], které leží [CZTerrainObjIn(GetTerrain('desert'))], [CZTerrainObjIn(GetTerrain('desert_mountains'))] nebo [CZTerrainObjIn(GetTerrain('oasis'))]"
 custom.every_sheep_terrain_county_tt: "Každé [Concept('county','hrabství')|E] v [Concept('realm','panství')|E], které leží [CZTerrainObjIn(GetTerrain('mountains'))], [CZTerrainObjIn(GetTerrain('hills'))] nebo [CZTerrainObjIn(GetTerrain('drylands'))]"
 custom.every_hunting_terrain_county_tt: "Každé [Concept('county','hrabství')|E] v [Concept('realm','panství')|E], které leží [CZTerrainObjIn(GetTerrain('forest'))], [CZTerrainObjIn(GetTerrain('taiga'))], [CZTerrainObjIn(GetTerrain('jungle'))] nebo [CZTerrainObjIn(GetTerrain('wetlands'))]"
 custom.every_horse_terrain_county_tt: "Každé [Concept('county','hrabství')|E] v [Concept('realm','panství')|E], které leží [CZTerrainObjIn(GetTerrain('steppe'))], [CZTerrainObjIn(GetTerrain('plains'))] nebo [CZTerrainObjIn(GetTerrain('floodplains'))]"
