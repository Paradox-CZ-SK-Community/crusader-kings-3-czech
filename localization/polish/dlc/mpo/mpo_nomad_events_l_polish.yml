 mpo_bountiful_hunting_cheaper_hunts_desc: "Náklady na [CZActivity('activity_hunt','A')]: @gold_icon!#P -20%#!"
 mpo_restless_for_migration_modifier: "Neklidná válečná družina"
 mpo_restless_for_migration_modifier_desc: "Všichni jezdci tohoto nomáda jsou připraveni vyrazit a dobýt nové země."
 mpo_bountiful_camels_modifier: "Početná velbloudí stáda"
 mpo_bountiful_camels_modifier_desc: "Lidé tohoto vládce se dokonale přizpůsobili životu v poušti a chovají početná stáda velbloudů."
 mpo_bountiful_sheep_modifier: "Hojná ovčí stáda"
 mpo_bountiful_sheep_modifier_desc: "Vlna, ovčí mléko a skopové maso patří k hlavním zdrojům obživy tohoto vládce a jeho lidu."
 mpo_bountiful_hunting_modifier: "Lovecké tábory"
 mpo_bountiful_hunting_modifier_desc: "Nomádi tohoto vládce získávají obživu především lovem divoké zvěře."
 mpo_bountiful_horses_modifier: "Dobře živení koně"
 mpo_bountiful_horses_modifier_desc: "Válečné družiny tohoto nomáda se prohánějí na silných, dobře živených koních a vedou s sebou množství náhradních ořů."
 mpo_bountiful_hunting_cheaper_hunts_tt: "Náklady na [CZActivity('activity_hunt','A')]: @gold_icon!#P -20%#! po dobu #high 10 let#!"
 mpo_bountiful_sheep_cheaper_feasts_tt: "$feast_type_tsagaan_sar$ – náklady na [CZActivity('activity_feast','A')]: @gold_icon!#P -20%#! po dobu #high 10 let#!"
 mpo_nomad_events.1110.t: "Vodnaté pastviny"
 mpo_nomad_events.1110.desc_river: "Vody zelené řeky vesele zurčí"
 mpo_nomad_events.1110.desc_sea: "Vlny širého moře se tříští o břeh"
 mpo_nomad_events.1110.desc_lake: "Klidné vody modrého jezera tiše spočívají"
 mpo_nomad_events.1110.desc: " jen kousek od mého tábora na území [capital_province.GetTitle.Custom('CZ_LandedNameNoTier_G')].\n\n[ROOT.Char.GetCulture.GetCollectiveNoun|U] stojí v mělké vodě a nadšeně obdivují rybu dlouhou jako šavle, jejíž hnědavé šupiny se lesknou na slunci. Místní [dummy_gender.GetWomanMan|l] drží obrovský úlovek vysoko nad hlavou a pyšně se jím chlubí.\n\nTaková ryba je jasným důkazem, že zde lze získat spoustu dobrého masa. Stačí, aby se [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] začali věnovat lovu tvorů, kteří se namísto pastvin živí ve vodě."
 mpo_nomad_events.1110.a: "Postavte lodě a využijte bohatství zdejších vod."
 mpo_nomad_events.1110.a_repeat: "Naše lodě nám dobře poslouží."
 mpo_nomad_events.1110.b: "#EMP Utopím#! [Select_CString(dummy_gender.IsFemale,'každou','každého')] [Select_CString(dummy_gender.IsFemale,'ženu','muže')], [Select_CString(dummy_gender.IsFemale,'která','který')] sesedne ze svého koně!"
 mpo_nomad_events.1110.c: "Sítě! Upleťte spoustu sítí."
 custom.every_fishing_county_tt: "Každé [Concept('county','hrabství')|E] v [Concept('domain','doméně')|E], které leží na pobřeží, u řeky nebo u jezera"
 fishing_counties_gold_scaling: "#weak Získané zlato se odvíjí od počtu hrabství v doméně ležících na pobřeží, u řek nebo jezer#!"
 maritime_tradition_unlock_tt: "#weak Dostupné díky námořní [Concept('cultural','kulturní')|E] [Concept('tradition','tradici')|E]#!"
 nomad_unlocked_fishing_yurt_flag_tt: "Odemkneš #high $fishing_yurt_01_domicile_building$#! pro svou [Concept('yurt_building','budovu jurty')|E] #high $yurt_main_01_domicile_building$#!"
 mpo_nomad_events.1120.t: "Zimní vlci"
 mpo_nomad_events.1120.desc: "Na území [capital_province.GetTitle.Custom('CZ_LandedNameNoTier_G')] není ledový vítr jediný, kdo vyje. Ne během této kruté zimy. A už vůbec ne této noci.\n\n#EMP „Vlci! Vlci mezi ovcemi!“#! ozve se křik a já se společně se svými jezdci horečně soukám do sedla.\n\nOvce se choulí jedna k druhé a vydávají zoufalé, hrůzou prodchnuté zvuky. Temné šelmy je chytají za nohy i za krky, rvou z nich kusy masa a vzápětí mizí v neproniknutelné noční pustině."
 mpo_nomad_events.1120.a: "Vlci? Pche! Mých jezdců je bezpočet."
 mpo_nomad_events.1120.a.flavor: "V kraji [capital_county.Custom('CZ_LandedNameNoTierNoTooltip_G')] přece neexistuje šelma, která by dokázala proklouznout kolem mých hord..."
 mpo_nomad_events.1120.b: "Pobídněte koně! Obkličte je!"
 mpo_nomad_events.1120.b.success: "Žádný vlk není rychlejší než tvůj kůň"
 mpo_nomad_events.1120.b.failure: "V nastalém zmatku vlci uniknou"
 mpo_nomad_events.1120.c: "#EMP Šípy! Šípy!#! Chci jejich kožešiny!"
 mpo_nomad_events.1120.c.success: "Tvé šípy skolí šelmy"
 mpo_nomad_events.1120.c.failure: "Tvé šípy zasáhnou koně a ovce"
 mpo_nomad_events.1120.d: "Dost! Jen zbavují stádo slabých kusů."
 mpo_nomad_events.1120.d.flavor: "V tomto ročním období už nejsou žádná jehňata, která by mohli vlci odnést. Zbývají jen stará a nemocná zvířata. Neměli bychom jim tuto kořist odpírat."
