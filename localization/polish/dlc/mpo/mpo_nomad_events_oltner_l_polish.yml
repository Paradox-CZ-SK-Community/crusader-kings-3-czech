l_polish:
 nomad_events_oltner.0001.t: "Čerstvé stopy"
 nomad_events_oltner.0001.desc: "V mých zemích je zvěře dostatek. Lovci mi přinášejí zprávy o nových stopách. Na území hrabství [sighting_county_1.GetBaseNameNoTier] se [sighting_province_1.Custom('CZ_GetTerrainTypePlural_In')|l] pohybuje [sighting_county_1.Custom('GetAnimalGroup')|l] [sighting_county_1.Custom('GetAnimalPlural')|l]. V hrabství [sighting_county_2.GetBaseNameNoTier] se zase [sighting_province_2.Custom('CZ_GetTerrainType_In')|l] ukrývá obzvlášť [sighting_county_2.Custom('GetAnimalAdjective')|l] [sighting_county_2.Custom('GetAnimalType')|l].\n\nJako [ROOT.Char.GetTitleAsNameNoTooltip|l] bych si měl vybrat, po které kořisti se vydám."
 nomad_events_oltner.0001.a: "Dnes večer bude k večeři [sighting_county_1.Custom('GetAnimalType')|l]."
 nomad_events_oltner.0001.b: "Až [sighting_county_2.Custom('GetAnimalAdjective')|l] [sighting_county_2.Custom('GetAnimalType')|l] padne mou rukou, všichni poznají mou cenu."
 nomad_events_oltner.0001.c: "Jiné záležitosti vyžadují mou pozornost."
 nomad_events_oltner.0002.t: "Stopy pod křídly"
 nomad_events_oltner.0002.desc: "Nesou se zvěsti, že se [sighting_province_1.Custom('CZ_GetTerrainTypePlural_In')|l] hrabství [sighting_county_1.GetBaseNameNoTier] pohybuje [sighting_province_1.Custom('GetAnimalGroup')|l] [sighting_county_1.Custom('GetAnimalPlural')|l]. Je to dokonalá příležitost procvičit naše sokoly.\n\nSamozřejmě bych se místo toho mohl vydat za větší kořistí."
 nomad_events_oltner.0002.a: "V mém kotli se brzy bude vařit [sighting_county_1.Custom('GetAnimalType')|l]."
 nomad_events_oltner.0002.b: "Raději budu cvičit lovecké psy."
 nomad_events_oltner.0002.c: "Na tohle nemohu ztrácet čas."
 nomad_events_oltner.0003.t: "[sighting_county_1.Custom('GetAnimalGroup')|U] [sighting_county_1.Custom('GetAnimalPlural')|l]"
 nomad_events_oltner.0003.desc: "Dvacet mrtvých ovcí, zohavený pastevec a stopy mizející [sighting_province_1.Custom('CZ_GetTerrainTypePlural_In')|l]. Na území hrabství [sighting_county_1.GetBaseNameNoTier] řádí [sighting_county_1.Custom('GetAnimalAdjective')|l] [sighting_county_1.Custom('GetAnimalGroup')|l] [sighting_county_1.Custom('GetAnimalPlural')|l]. Zabíjí zvířata, která mi právem patří.\n\nMěl bych si připravit luk a toulec. Má pověst [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')] je v sázce."
 nomad_events_oltner.0003.a: "Ať [sighting_county_1.Custom('GetAnimalPlural')|l] okusí mé šípy!"
 nomad_events_oltner.0003.b: "Nasadím [maa_regiment.GetNameNoTooltip]. [sighting_county_1.Custom('GetAnimalGroup')|U] nepřežije."
 nomad_events_oltner.0003.c: "Kéž je [ROOT.Char.GetFaith.FertilityGodName] přiměje táhnout dál."
 nomad_events_oltner.0004.t: "[sighting_county_1.Custom('GetAnimalPlural')|U] během dzudu"
 nomad_events_oltner.0004.desc: "[my_subregion.GetCurrentPhase.GetName|U] nepřináší nic než sníh a led. Jenže teď krajem táhne [sighting_county_1.Custom('GetAnimalGroup')|l] [sighting_county_1.Custom('GetAnimalPlural')|l]. Sežere všechno, co jí přijde do cesty. A nám tak kromě zimy a hladu hrozí i smrt.\n\nNebudu nečinně přihlížet, jak má stáda a můj lid hynou."
 nomad_events_oltner.0004.a: "Vylovím je do posledního! Žádný [sighting_county_1.Custom('GetAnimalType')|l] mi neunikne!"
 nomad_events_oltner.0004.b: "Ať si [sighting_county_1.Custom('GetAnimalPlural')|l] zůstanou. My musíme pryč."
 nomad_events_oltner.0005.t: "Za novými stopami"
 nomad_events_oltner.0005.desc: "Nastalo období [my_subregion.GetCurrentPhase.GetName], které lovu neobyčejně přeje. Kořisti je všude dostatek a ve velkých počtech se stahuje [sighting_province_1.Custom('CZ_GetTerrainTypePlural_In')|l] hrabství [sighting_county_1.GetBaseNameNoTier]. Takovou hojnost nám jistě sesílá [ROOT.Char.GetFaith.WealthGodName].\n\nAť už se rozhodnu lovit cokoli, budu mít z čeho vybírat."
 nomad_events_oltner.0005.a: "Vyhledám nějakou zuřivou šelmu."
 nomad_events_oltner.0005.b: "Vyrážíme na laně a jeleny!"
 nomad_events_oltner.0005.c: "Pařáty našich sokolů touží po nové kořisti."
 nomad_events_oltner.0006.t: "Lovecký tribut"
 nomad_events_oltner.0006.desc: "„Klaním se před tebou, [ROOT.Char.Custom('FormalComplimentAdjective')|l] [Select_CString(ROOT.Char.IsFemale,'vládkyně','vládce')],“ pronese můj tributář [generous_tributary.GetTitledFirstName] a padne přede mnou na kolena.\n\n„Nabízím ti služby toho nejlepšího lovčího, jakého mé země znají. [offered_master_of_the_hunt.GetFirstNameNicknamed|U] je nejlepší [GetCourtPositionType('master_of_hunt_court_position').CalcTriggeredNameNoTooltip( ROOT.Char )|l] v celé [generous_tributary.GetPrimaryTitle.Custom('CZ_Adjective_ee')|l] zemi. Kéž v tvém jménu skolí mnoho jelenů.“"
 nomad_events_oltner.0006.a: "[offered_master_of_the_hunt.GetFirstNameNoTooltip|U] mi bude dobře sloužit."
 nomad_events_oltner.0006.b: "Skvostný dar! Zasloužíš si odměnu."
 nomad_events_oltner.0006.c: "Ponech si [Select_CString(offered_master_of_the_hunt.IsFemale,'ji','ho')] a ať tvé lovy provází zdar."
 nomad_events_oltner.0007.t: "Opeřený tribut"
 nomad_events_oltner.0007.desc: "„[ROOT.Char.Custom('FormalComplimentAdjective')|U] [Select_CString(ROOT.Char.IsFemale,'vládkyně','vládce')], přijmi ode mě tento dar.“ Můj tributář [generous_tributary.GetTitledFirstName] přede mnou pozvedne majestátního dravce.\n\n„Tato sokolice pochází z hrabství [tribute_capital_county.GetBaseNameNoTier], kde vyrůstala [tribute_capital.Custom('CZ_GetTerrainTypePlural_In')|l]. Od chvíle, kdy byla sotva opeřeným mládětem, jsem ji cvičil vlastníma rukama. Přísahám, že pro tebe uloví stovky kachen a dropů.“"
 nomad_events_oltner.0007.a: "Budu jí říkat „[ROOT.Char.Custom('GetBirdName')|U]“!"
 nomad_events_oltner.0007.b: "Raději si ji ponech."
 chaotic_kurultai_title: "Chaotické nástupnictví:"
 chaotic_kurultai_intro_1: "[Select_CString(dead_parent.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_parent'))|l] [dead_parent.GetFirstNameNicknamed] [dead_parent.GetDeathReasonHideKiller|l]. Nastává úsvit mé vlády. [ROOT.Char.GetCapitalLocation.Custom('CZ_TerrainTypeProvinceFull_In')|l] se rozléhají nesourodé hlasy členů kurultaje.\n\n"
 chaotic_kurultai_intro_2: "Nastává úsvit mé vlády. [ROOT.Char.GetCapitalLocation.Custom('CZ_TerrainTypeProvinceFull_In')|l] se rozléhají nesourodé hlasy členů kurultaje.\n\n"
 mpo_chaotic_kurultai_succession.0001.t: "$chaotic_kurultai_title$ Závist"
 mpo_chaotic_kurultai_succession.0001.desc: "[Select_CString(sibling_rival_1.IsFemale,'Má','Můj')] #EMP „[sibling_rival_1.Custom('ComplimentAdjective')|l]“#! [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling_rival_1'))|l] [sibling_rival_1.GetFirstNameNicknamed] přísahá na vlastní život, že [ROOT.Char.GetPrimaryTitle.GetName] právem náleží [Select_CString(sibling_rival_1.IsFemale,'jí','jemu')]. Tvrdí, že můj titul [ROOT.Char.GetTitleAsName|l] je pouhý žert, který mají na svědomí [sibling_rival_1.GetFaith.EvilGodNames]. Přitom je [sibling_rival_1.Custom('DescriptorNegativeStandalone')|l] a [Select_CString(sibling_rival_1.IsFemale,'slabá','slabý')]."
 mpo_chaotic_kurultai_succession.0001.desc_addition: "\n\nA zdá se, že se přidává i [sibling_rival_2.GetFirstNameNicknamed], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling_rival_2'))|l] a [sibling_rival_2.Custom2('InsultNoun', ROOT.Char)|l] v jedné osobě."
 mpo_chaotic_kurultai_succession.0001.a: "Časem všem dokážu svou cenu."
 rival_kurultai_succession: "[CZProDrop(TARGET_CHARACTER,'nebyla','nebyl')|U] během nástupnictví jednomyslně [Select_CString(TARGET_CHARACTER.IsFemale,'zvolena','zvolen')] kurultajem. [CZProDrop(CHARACTER,'pocítila','pocítil')|U] kvůli tomu rozhořčení."
 rival_kurultai_succession_corresponding: "[CZProDrop(CHARACTER,'nebyla','nebyl')|U] během nástupnictví jednomyslně [Select_CString(CHARACTER.IsFemale,'zvolena','zvolen')] kurultajem. [CZProDrop(TARGET_CHARACTER,'pocítila','pocítil')|U] kvůli tomu rozhořčení."
 mpo_chaotic_kurultai_succession.0002.t: "$chaotic_kurultai_title$ Uchvácení tributárního území"
 sibling_usurped_tributary_lands_tt: "[sibling_rival_1.GetShortUIName|U] [Select_CString(sibling_rival_1.IsFemale,'uchvátila','uchvátil')] veškeré země a vazaly tvého [Concept('tributary','tributáře')|E] [tributary_usurped.GetShortUIName] a [Select_CString(sibling_rival_1.IsFemale,'stala se nezávislou vládkyní','stal se nezávislým vládcem')]"
 mpo_chaotic_kurultai_succession.0002.desc: "[Select_CString(sibling_rival_1.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling_rival_1'))|l] [sibling_rival_1.GetFirstNameNicknamed] [Select_CString(sibling_rival_1.IsFemale,'usoudila','usoudil')], že nastal vhodný čas na výpravu. V čele oddílu, který tvoří [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')|l], [Select_CString(sibling_rival_1.IsFemale,'vpadla','vpadl')] do zemí mého tributáře [tributary_usurped.Custom('CZ_TitledFirstNameNicknamed_G')] a násilím se [Select_CString(sibling_rival_1.IsFemale,'zmocnila','zmocnil')] jeho panství."
 mpo_chaotic_kurultai_succession.0002.desc_addition: " A to vše za podpory [backing_kurultai.Custom('CZ_FirstNameNicknamed_G')], [Select_CString(backing_kurultai.IsFemale,'zrádné členky','zrádného člena')] kurultaje."
 mpo_chaotic_kurultai_succession.0002.desc_end: "\n\nTo byl osudový přešlap."
 mpo_chaotic_kurultai_succession.0002.a: "Jak se [Select_CString(sibling_rival_1.IsFemale,'odvážila','odvážil')] sáhnout na to, co mi patří?!"
 mpo_chaotic_kurultai_succession.0003.t: "$chaotic_kurultai_title$ Konec tributu"
 mpo_chaotic_kurultai_succession.0003.desc: "Můj tributář [tributary_leaving.GetFirstNameNicknamed], který vládne [tributary_leaving.GetPrimaryTitle.Custom('CZ_LandedName_D')], se [Select_CString(tributary_leaving.IsFemale,'rozhodla','rozhodl')] přestat odvádět tribut."
 mpo_chaotic_kurultai_succession.0003.desc_addition: " Na této zradě se podílí také [backing_kurultai.GetFirstNameNicknamed], vzpurný člen kurultaje."
 mpo_chaotic_kurultai_succession.0003.a: "Za tu drzost [Select_CString(tributary_leaving.IsFemale,'ji','ho')] rozdrtím!"
 mpo_chaotic_kurultai_succession.0003.desc_end: "\n\nSvůj tribut dostanu, ať už po dobrém, nebo po zlém."
 mpo_chaotic_kurultai_succession.0004.t: "$chaotic_kurultai_title$ Ztráta kontroly"
 mpo_chaotic_kurultai_succession.0004.desc: "Mé pastviny zaplavili nájezdníci, psi a všelijací tuláci, [ROOT.Char.Custom2('InsultAdjective', ROOT.Char)|l] až do morku kostí. Drancují mé jurty, zabíjejí mé koně a zapalují mé praporce."
 mpo_chaotic_kurultai_succession.0004.desc_addition: " Je jasné, že je k tomu podněcuje [backing_kurultai.GetFirstNameNicknamed], [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)|l] člen kurultaje."
 mpo_chaotic_kurultai_succession.0004.a: "Časem znovu nastolím pořádek."
 mpo_chaotic_kurultai_succession.0004.desc_end: "\n\nVšichni se budou muset podřídit."
 mpo_chaotic_kurultai_succession.0005.t: "$chaotic_kurultai_title$ Potupa"
 mpo_chaotic_kurultai_succession.0005.desc: "Mé jméno vláčejí bahnem. Šlapou po něm koňská kopyta. Nikdo si ho neváží. Každý jím pohrdá."
 mpo_chaotic_kurultai_succession.0005.desc_addition: " A většina těch pomluv vychází přímo z úst [backing_kurultai.Custom('CZ_FirstNameNicknamed_G')], [ROOT.Char.Custom2('CZ_RelationToMeShort_G', SCOPE.sC('backing_kurultai'))], [backing_kurultai.Custom2('CZ_InsultAdjective_G', ROOT.Char)|l] až hanba."
 mpo_chaotic_kurultai_succession.0005.a: "Získám svou čest zpět."
 mpo_chaotic_kurultai_succession.0006.t: "$chaotic_kurultai_title$ Ztracené stádo"
 mpo_chaotic_kurultai_succession.0006.desc: "Během noci zmizela velká část mého stáda. Zvířata se buď zatoulala, nebo je někdo ukradl."
 mpo_chaotic_kurultai_succession.0006.desc_addition: " Podezírám [backing_kurultai.Custom('CZ_FirstNameNicknamed_A')], [ROOT.Char.Custom2('CZ_RelationToMeShort_A', SCOPE.sC('backing_kurultai'))], ze zrady. Právě [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)|l] člen kurultaje mohl zvířata v noci vypustit."
 mpo_chaotic_kurultai_succession.0006.desc_end: "\n\nKdo ví, možná už jsou [rustler.GetCapitalLocation.Custom('CZ_TerrainTypeProvince_In')|l] poblíž [CZProvName(rustler.GetCapitalLocation,'G')]. Už je nikdy neuvidím."
 mpo_chaotic_kurultai_succession.0006.a: "Má síla se vrátí."
 mpo_chaotic_kurultai_succession.1006.t: "Ztracené stádo"
 mpo_chaotic_kurultai_succession.1006.desc: "Během noci se zničehonic objevilo stádo koz a ovcí. Zvířata se zřejmě zatoulala nebo je někdo opustil.\n\nJsou krotká a mohla by snadno rozšířit mé vlastní stádo. Někteří tvrdí, že za tím stojí chaotické nástupnictví [ruler_rustled.Custom('CZ_TitledFirstNameNicknamed_G')], [Select_CString(ruler_rustled.IsFemale,'vládkyně','vládce')] [ruler_rustled.GetPrimaryTitle.Custom('CZ_LandedName_G')]."
 mpo_chaotic_kurultai_succession.1006.desc_addition: " Moji jezdci navíc hlásí, že na okraji našich zemí zahlédli [backing_kurultai.Custom('CZ_TitledFirstNameNicknamed_A')], [Select_CString(backing_kurultai.IsFemale,'neposlušnou členku','neposlušného člena')] kurultaje [ruler_rustled.Custom('CZ_FirstNameNoTooltip_G')]. Nejspíš v tom má prsty právě tato postava."
 mpo_chaotic_kurultai_succession.1006.a: "Připojte je k mým stádům."
 mpo_chaotic_kurultai_succession.1006.b: "Pošlete je [ruler_rustled.Custom('CZ_FirstNameNoTooltip_D')] zpět jako dar."
 mpo_chaotic_kurultai_succession.1006.b.title: "[rustler.GetFirstName|U] ti vrací stádo"
 mpo_chaotic_kurultai_succession.1006.b.tt: "Ztracené [Concept('herd','stádo')|E] se vrátí [ruler_rustled.Custom('CZ_ShortUIName_D')]"
 mpo_chaotic_kurultai_succession.0007.t: "$chaotic_kurultai_title$ Odchod dvořanů"
 mpo_chaotic_kurultai_succession.0007.desc: "Tři z mých nejlepších dvořanů zmizeli: [courtier_1.GetFirstNameNicknamed], [courtier_2.GetFirstNameNicknamed] a [courtier_3.GetFirstNameNicknamed]. Rozhořčila je debata o nástupnictví."
 mpo_chaotic_kurultai_succession.0007.desc_addition: " Nepochybně je poštval [backing_kurultai.GetFirstNameNicknamed], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))|l] a [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)|l] člen kurultaje."
 mpo_chaotic_kurultai_succession.0007.desc_end: "\n\nPohrdají mou autoritou a nyní ujíždějí do [CZProvName(courtier_stealer.GetCapitalLocation,'G')], kde hledají nového pána."
 mpo_chaotic_kurultai_succession.0007.a: "Věrných poddaných mám stále dost."
 mpo_chaotic_kurultai_succession.1007.t: "Nově příchozí"
 mpo_chaotic_kurultai_succession.1007.desc: "Tři poutníci, [courtier_1.GetFirstNameNicknamed], [courtier_2.GetFirstNameNicknamed] a [courtier_3.GetFirstNameNicknamed], přicházejí hledat místo na mém dvoře.\n\nPocházejí z [ruler_rustled.GetPrimaryTitle.Custom('CZ_LandedName_G')], odkud je vyhnaly zmatky provázející nástupnictví [ruler_rustled.Custom('CZ_TitledFirstNameNicknamed_G')]."
 mpo_chaotic_kurultai_succession.1007.desc_addition: " K jejich odchodu nejspíš přispěla také postava [backing_kurultai.GetTitledFirstNameNicknamed], která patří mezi neposlušné členy kurultaje [ruler_rustled.Custom('CZ_FirstNameNoTooltip_G')]."
 mpo_chaotic_kurultai_succession.1007.a: "Budou mi dobře sloužit."
 mpo_chaotic_kurultai_succession.1007.b: "Pošlete je zpět [ruler_rustled.Custom('CZ_FirstNameNoTooltip_D')]."
 mpo_chaotic_kurultai_succession.1007.b.title: "[courtier_stealer.GetFirstName|U] vrací tvé dvořany"
 mpo_chaotic_kurultai_succession.0008.t: "$chaotic_kurultai_title$ Zběhnutí vojáci"
 mpo_chaotic_kurultai_succession.0008.desc: "Během zmatků kolem nástupnictví ztratila má nejlepší jednotka [defecting_maa.GetName] důvěru v mou vládu. Tito válečníci mě nyní opouštějí. Jsou to muži s [maa_stealer.Custom2('CZ_InsultAdjective_I', ROOT.Char)|l] charakterem."
 mpo_chaotic_kurultai_succession.0008.desc_addition: " Za jejich zběhnutím nejspíš stojí [backing_kurultai.GetFirstNameNicknamed], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))|l] s [backing_kurultai.Custom2('CZ_InsultAdjective_I', ROOT.Char)|l] charakterem."
 mpo_chaotic_kurultai_succession.0008.desc_end: "\n\nZa jejich koňmi se zvedá prach a táhne se směrem k [maa_stealer.GetPrimaryTitle.Custom('CZ_LandedName_D')]. Doufám, že tam všichni zahynou."
 mpo_chaotic_kurultai_succession.0008.a: "Kdo je potřebuje?"
 mpo_chaotic_kurultai_succession.1008.t: "Ochotní bojovníci: [defecting_maa.GetNameNoTooltip]"
 mpo_chaotic_kurultai_succession.1008.desc: "Přede mnou stojí skupina dobře vyzbrojených vojáků, které tvoří [defecting_maa.GetName]. Nevypadají jako bandité. Naopak se chtějí připojit k mému vojsku.\n\nPocházejí z [ruler_rustled.GetPrimaryTitle.Custom('CZ_LandedName_G')]. O svou dosavadní věrnost přišli kvůli chaotickému nástupnictví [ruler_rustled.Custom('CZ_TitledFirstNameNicknamed_G')]."
 mpo_chaotic_kurultai_succession.1008.desc_addition: " Za jejich příchodem pravděpodobně stojí [backing_kurultai.GetTitledFirstNameNicknamed], [Select_CString(backing_kurultai.IsFemale,'neposlušná členka','neposlušný člen')] kurultaje [ruler_rustled.Custom('CZ_FirstNameNoTooltip_G')]."
 mpo_chaotic_kurultai_succession.1008.a: "Tito vojáci se mi budou hodit."
 mpo_chaotic_kurultai_succession.1008.b: "Pošlete je zpět [ruler_rustled.Custom('CZ_FirstNameNoTooltip_D')]."
 mpo_chaotic_kurultai_succession.1008.b.title: "[maa_stealer.GetFirstName|U] vrací tvé vojáky"
 chaos_upgrade_maa_tt: "Mohou být vylepšeni i další [Concept('men_at_arms','ozbrojenci')|E]"
 regiment_destroyed_tt: "[Concept('regiment','Pluk')|EU] typu [defecting_maa.GetName] se připojil k [maa_stealer.Custom('CZ_FirstName_D')]"
 mpo_chaotic_kurultai_succession.0009.t: "$chaotic_kurultai_title$ Rozdělená pokladnice"
 mpo_chaotic_kurultai_succession.0009.desc: "Moji sourozenci zuří kvůli rozhodnutí kurultaje. Drancují pokladnici a berou si z ní svůj údajný podíl."
 mpo_chaotic_kurultai_succession.0009.desc_addition: "[Select_CString(sibling_rival_1.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling_rival_1'))|l] [sibling_rival_1.GetFirstNameNicknamed] [Select_CString(sibling_rival_1.IsFemale,'je rozzuřená','je rozzuřený')] rozhodnutím kurultaje a drancuje pokladnici, aby si [Select_CString(sibling_rival_1.IsFemale,'přivlastnila','přivlastnil')] svůj podíl.\n\nZa tuto zradu [Select_CString(sibling_rival_1.IsFemale,'zaplatí','zaplatí')]."
 mpo_chaotic_kurultai_succession.0009.desc_addition2: "\n\n[sibling_rival_1.GetFirstNameNicknamed], [sibling_rival_2.GetFirstNameNicknamed] — "
 mpo_chaotic_kurultai_succession.0009.desc_addition3: "také [sibling_rival_3.GetFirstNameNicknamed] — "
 mpo_chaotic_kurultai_succession.0009.desc_addition4: "i [sibling_rival_4.GetFirstNameNicknamed] — "
 mpo_chaotic_kurultai_succession.0009.desc_addition5: "dokonce [sibling_rival_5.GetFirstNameNicknamed] — "
 mpo_chaotic_kurultai_succession.0009.desc_end: "všichni za svou zradu zaplatí."
 mpo_chaotic_kurultai_succession.0009.a: "Jejich chamtivost bude potrestána."
 mpo_chaotic_kurultai_succession.0010.t: "$chaotic_kurultai_title$ Oslabená autorita"
 mpo_chaotic_kurultai_succession.0010.desc: "Všichni se mi vysmívají a častují mě urážkami. Tvrdí, že jsem [ROOT.Char.Custom2('InsultAdjective', ROOT.Char)|l], [Select_CString(ROOT.Char.IsFemale,'slabá','slabý')] a [Select_CString(ROOT.Char.IsFemale,'nehodná','nehodný')] titulu [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')]."
 mpo_chaotic_kurultai_succession.0010.desc_addition: " Nehlasitěji ze všech se směje [backing_kurultai.GetFirstNameNicknamed], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))|l] s [backing_kurultai.Custom2('CZ_InsultAdjective_I', ROOT.Char)|l] charakterem."
 mpo_chaotic_kurultai_succession.0010.desc_end: "\n\nJak se opovažují zpochybňovat mou moc?!"
 mpo_chaotic_kurultai_succession.0010.a: "Musím jim dokázat, že se mýlí..."
 mpo_chaotic_kurultai_succession.0011.t: "$chaotic_kurultai_title$ Splášené stádo!"
 mpo_chaotic_kurultai_succession.0011.desc: "Uprostřed hluboké noci se mé stádo splašilo. Všude plály ohně a vyděšená zvířata se hnala hlava nehlava pryč.\n\nTohle nebyla žádná nehoda. Někdo je úmyslně vyplašil a poranil."
 mpo_chaotic_kurultai_succession.0011.desc_addition: " Přivítá mě [backing_kurultai.GetFirstNameNicknamed], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))|l], s [backing_kurultai.Custom2('CZ_InsultAdjective_I', ROOT.Char)|l] úšklebkem od ucha k uchu."
 mpo_chaotic_kurultai_succession.0011.desc_end: "\n\nVětšinu zvířat se mi podařilo pochytat. Zbytek se však stále žene směrem k [CZProvName(rustler.GetCapitalLocation,'D')]."
 mpo_chaotic_kurultai_succession.0011.a: "Ať jsou ta splašená zvířata prokletá!"
 mpo_chaotic_kurultai_succession.0012.t: "$chaotic_kurultai_title$ Rozdělené panství"
 mpo_chaotic_kurultai_succession.0012.desc: "Je rozhodnuto. Zdědím pouze polovinu panství. Zbytek připadne [Select_CString(sibling_rival_1.IsFemale,'mé','mému')] [sibling_rival_1.Custom2('CZ_InsultAdjective_D', ROOT.Char)|l] [ROOT.Char.Custom2('CZ_RelationToMeShort_D', SCOPE.sC('sibling_rival_1'))|l] [sibling_rival_1.Custom('CZ_FirstNameNicknamed_D')], [Select_CString(sibling_rival_1.IsFemale,'která se už přesunula','který se už přesunul')] do [CZProvName(sibling_rival_1.GetCapitalLocation,'G')]!\n\nVíce než polovina členů kurultaje toto rozhodnutí podpořila. Jsou to pomýlení hlupáci."
 mpo_chaotic_kurultai_succession.0012.a: "Kurultaj za to zaplatí!"
 sibling_tool_50_percent_tt: "[sibling_rival_1.GetFirstNameNicknamed|U] s pomocí [Concept('kurultai','kurultaje')|E] [Select_CString(sibling_rival_1.IsFemale,'odtrhla','odtrhl')] velkou část tvého [Concept('realm','panství')|E] a [Select_CString(sibling_rival_1.IsFemale,'vytvořila','vytvořil')] z ní nové [Concept('de_jure','de iure')|E] [Concept('kingdom','království')|E]"
 mpo_chaotic_kurultai_succession.0013.t: "$chaotic_kurultai_title$ Odštěpené panství"
 mpo_chaotic_kurultai_succession.0013.desc: "Rozhodnutí je jasné: lví podíl našich zemí připadne mně. Zbytek získá [sibling_rival_1.GetFirstNameNicknamed], [Select_CString(sibling_rival_1.IsFemale,'má','můj')] [sibling_rival_1.Custom2('InsultAdjective', ROOT.Char)|l] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling_rival_1'))|l].\n\nAť si [sibling_rival_1.GetFirstNameNicknamed] shnije v [CZProvName(sibling_rival_1.GetCapitalLocation,'L')]."
 mpo_chaotic_kurultai_succession.0013.a: "Jednou to všechno bude moje..."
 sibling_tool_20_percent_tt: "[sibling_rival_1.GetFirstNameNicknamed|U] s pomocí [Concept('kurultai','kurultaje')|E] [Select_CString(sibling_rival_1.IsFemale,'odtrhla','odtrhl')] malou část tvého [Concept('realm','panství')|E] a [Select_CString(sibling_rival_1.IsFemale,'vytvořila','vytvořil')] z ní nové [Concept('de_jure','de iure')|E] [Concept('kingdom','království')|E]"
 mpo_chaotic_kurultai_succession.0014.t: "$chaotic_kurultai_title$ Rozpad"
 mpo_chaotic_kurultai_succession.0014.desc: "Hněv, rozhořčení, křik a hádky. Pro zákon tu není místo. Pro rozhodnutí také ne. Zůstala jen nesvornost.\n\nTohle je konec [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedName_G')]."
 mpo_chaotic_kurultai_succession.0014.desc_alt: "Hlasy jsou však slabé a bezmocné. Nelze dospět k rozhodnutí, nelze prosadit právo ani zákon.\n\nTohle je konec [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedName_G')]. Kéž by jen můj předchůdce jmenoval do kurultaje dostatek členů..."
 mpo_chaotic_kurultai_succession.0014.a: "Své panství znovu sjednotím!"
 liege_primary_title_chaos_desc: "Tvá lenní vrchnost přišla o svůj [Concept('primary_title','hlavní titul')|E] v důsledku chaotického [Concept('succession','nástupnictví')|E]"
 title_chaos_dissolved_tt: "[Concept('kurultai','Kurultaj')|EU] nedokázal dospět k rozhodnutí, což způsobilo rozpad tvého [Concept('realm','panství')|E]"
 mpo_chaotic_kurultai_succession.0015.t: "$chaotic_kurultai_title$ Hřmění bez jezdců"
 mpo_chaotic_kurultai_succession.0015.desc: "Začali si mezi sebou rozdělovat stádo. Nejdřív se přeli a hádali, až nakonec došlo na rány. Vyděšená zvířata se splašila a rozprchla do všech stran."
 mpo_chaotic_kurultai_succession.0015.desc_addition: " [Select_CString(backing_kurultai.IsFemale,'Má','Můj')] [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)|l] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))|l] [backing_kurultai.GetFirstNameNicknamed] se marně [Select_CString(backing_kurultai.IsFemale,'pokoušela','pokoušel')] zahnat zpět zvířata, která [Select_CString(backing_kurultai.IsFemale,'sama','sám')] vyplašila."
 mpo_chaotic_kurultai_succession.0015.desc_end: "\n\nCelý den jsem se snažil stádo znovu shromáždit. Většina zvířat se však ztratila někde směrem k [CZProvName(rustler.GetCapitalLocation,'D')]."
 mpo_chaotic_kurultai_succession.0015.a: "Mé stádo je zdecimované!"
 mpo_chaotic_kurultai_succession.0016.t: "$chaotic_kurultai_title$ Odchod tributářů"
 mpo_chaotic_kurultai_succession.0016.desc: "[tributary_leaving.GetFirstNameNicknamed] z [tributary_leaving2.GetPrimaryTitle.Custom('CZ_LandedName_G')], [tributary_leaving2.GetFirstNameNicknamed] z [tributary_leaving.GetPrimaryTitle.Custom('CZ_LandedName_G')] a [tributary_leaving3.GetFirstNameNicknamed] z [tributary_leaving3.GetPrimaryTitle.Custom('CZ_LandedName_G')] přestali odvádět tribut ve zlatě i stádech."
 mpo_chaotic_kurultai_succession.0016.desc_addition: " K této vzpouře jim [Select_CString(backing_kurultai.IsFemale,'dodala','dodal')] odvahu [backing_kurultai.GetFirstNameNicknamed], [Select_CString(backing_kurultai.IsFemale,'má','můj')] [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)|l] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))|l]."
 mpo_chaotic_kurultai_succession.0016.desc_end: "\n\nZanedlouho přede mnou opět pokleknou."
 mpo_chaotic_kurultai_succession.0016.a: "Jehňata jdoucí na porážku."
 mpo_chaotic_kurultai_succession.0017.t: "$chaotic_kurultai_title$ Slábnoucí tribut"
 mpo_chaotic_kurultai_succession.0017.desc: "Moji tributáři sledovali, jak se naše jednota rozpadá. Viděli slabost, pohrdavě se ušklíbli a odjeli. Jejich hádky přehlušily všechna má slova."
 mpo_chaotic_kurultai_succession.0017.desc_addition: " Ze všech nejvíce přiléval olej do ohně [backing_kurultai.GetFirstNameNicknamed], [Select_CString(backing_kurultai.IsFemale,'má','můj')] [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)|l] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))|l]. Právě [Select_CString(backing_kurultai.IsFemale,'ona jim dodala','on jim dodal')] odvahu obrátit se ke mně zády."
 mpo_chaotic_kurultai_succession.0017.desc_end: "\n\nZůstali jen ti nejpokornější."
 mpo_chaotic_kurultai_succession.0017.a: "Brzy mi budou opět sloužit."
 mpo_chaotic_kurultai_succession.1000.t: "Nástupnické chanáty"
 mpo_chaotic_kurultai_succession.1000.desc: "Říše se rozpadla. Dědicové mezi sebou soupeří o vládu, ale nikdo z nich nemá dost sil, aby ji uchvátil.\n\nJedna výjimka tu však je..."
 mpo_chaotic_kurultai_succession.1000.a: "Já, samozřejmě."
