l_polish:
 mpo_nomads_season_events.0001.t: "Vstříc bouři"
 mpo_nomads_season_events.0001.desc: "„Vidíš, jaký tvar mají ta oblaka? Vypadají, jako by je rozdrásaly sokolí pařáty,“ pronese [storm_chaser.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('storm_chaser'))|l], a ukáže k nebi.\n\n„Věstí strašlivou bouři. Říkám, využijme ji ve svůj prospěch. Osedlejme koně, vezměme luky a vyrazme do běsnící vichřice. Zaskočíme [raid_target.Custom('CZ_TitledFirstName_A')] a ukradneme stádo, které [Select_CString(raid_target.IsFemale,'jí','mu')] patří.“"
 mpo_nomads_season_events.0001.a: "Zítra vyrážíme!"
 mpo_nomads_season_events.0001.b: "Nejdřív musíme zabezpečit vlastní přístřeší."
 mpo_storm_shelter_modifier: "Zajištění proti bouři"
 mpo_storm_shelter_modifier_desc: "Jurty v tomto táboře jsou k zemi připevněny dvojitými úvazy a zvířata jsou držena těsně pohromadě, aby tábor lépe odolal blížícím se bouřím."
 mpo_nomads_season_events.0005.t: "Prázdné žaludky"
 mpo_nomads_season_events.0005.desc: "Kvílivý vítr se opírá do stěn mé jurty.\n\nK mému překvapení přichází [hungry_neighbour.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hungry_neighbour'))|l]. Navzdory nebezpečí zuřící bouře se odváží až do mého tábora, kde přede mnou padá na kolena a jako dar mi k nohám pokládá láhev [Glossary( 'kumis', 'KUMIS_GLOSS' )].\n\n„Nastaly zlé časy a můj lid hladoví. Nezbývá mi než tě požádat o pomoc.“"
 mpo_nomads_season_events.0005.a: "Tvůj lid už nebude hladovět."
 mpo_nomads_season_events.0005.b: "Co mi za to nabídneš?"
 mpo_nomads_season_events.0005.c: "Tady pro tebe nic není."
 mpo_nomads_season_events.0010.t: "Čas hojnosti"
 mpo_nomads_season_events.0010.desc: "Ranní klid mi naruší bečení ovcí. Vzápětí mě udeří do nosu jejich pronikavý pach, který na prudkém slunci ještě sílí. A nakonec dorazí i jejich majitel. [rich_neighbour.GetTitledFirstName|U], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rich_neighbour'))|l], "
 mpo_nomads_season_events.0010.desc_offered_herd: "si pečlivě zuje obuv, aby do mé jurty [Select_CString(rich_neighbour.IsFemale,'nezanesla','nezanesl')] trus.\n\n„[Select_CString(rich_neighbour.IsFemale,'Nezapomněla','Nezapomněl')] jsem na tvou štědrost, kterou jsi [Select_CString(ROOT.Char.IsFemale,'projevila','projevil')], když můj lid hladověl. [Select_CString(rich_neighbour.IsFemale,'Přišla','Přišel')] jsem splatit svůj dluh.“"
 mpo_nomads_season_events.0010.desc_fallback: "si při vstupu zamaže práh mé jurty trusem.\n\n„[Select_CString(ROOT.Char.IsFemale,'Má','Můj')] #EMP [Select_CString(ROOT.Char.IsFemale,'drahá','drahý')]#! [ROOT.Char.GetTitleTierName|l]!“ zvolá. „Za tak početné stádo mohu děkovat samotným nebesům. Mám zvířat víc než dost, a pokud máš zlato, [Select_CString(rich_neighbour.IsFemale,'ráda','rád')] se o ně podělím.“"
 mpo_nomads_season_events.0010.a: "Řekni mi svou cenu."
 mpo_nomads_season_events.0010.b: "Přijímám tvůj dar."
 mpo_nomads_season_events.0010.c: "Mezi sourozenci se dluhy nepočítají."
 mpo_nomads_season_events.0010.d: "Dej mi své stádo, nebo přijdeš o hlavu!"
 mpo_nomads_season_events.0010.e: "Nemám potřebu obchodovat."
 mpo_nomads_season_events.0010.d.tt.success: "Úspěšně přemůžeš [rich_neighbour.Custom('CZ_TitledFirstName_A')] i jeho osobní stráž"
 mpo_nomads_season_events.0010.d.tt.failure: "[rich_neighbour.GetTitledFirstName|U] i jeho osobní stráž dokážou uprchnout"
 given_herd: "Tato možnost je dostupná, protože jsi této postavě dříve [Select_CString(ROOT.Char.IsFemale,'darovala','daroval')] [Concept('herd','stádo')|E]."
 mpo_nomads_season_events.0015.t: "Vzkypělá krev"
 mpo_nomads_season_events.0015.desc: "Kamkoli se podívám, vidím své poddané, jak vyškrabují dna prázdných misek a snaží se zachránit každé sousto z našich tenčících se zásob.\n\nTicho náhle přeruší hlasitý třesk. Na zemi leží převržená miska [Glossary( 'kumis', 'KUMIS_GLOSS' )], která patří [kurultai_2.Custom('CZ_TitledFirstName_D')], a její obsah se vsakuje do vyprahlé půdy. Nad tou spouští stojí [kurultai_1.GetTitledFirstName] a se smíchem pronese: „Vůbec jsem si tě [Select_CString(kurultai_1.IsFemale,'nevšimla','nevšiml')].“\n\n[kurultai_2.GetTitledFirstName|U] vyskočí na nohy se zaťatými pěstmi. Zdá se, že se tito dva členové mého kurultaje každou chvíli poperou."
 mpo_nomads_season_events.0015.a: "„Neplač nad rozlitým #EMP kumysem#!, [kurultai_2.Custom('CZ_TitledFirstNameNoTooltip_V')].“"
 mpo_nomads_season_events.0015.b: "Jen do toho, poperte se! Alespoň nás pobavíte."
 mpo_nomads_season_events.0015.c: "Nechte toho, oba dva."
 mpo_nomads_season_events.0015.b.tt.success: "[kurultai_1.GetTitledFirstName|U] utrpí při rvačce zranění"
 mpo_nomads_season_events.0015.b.tt.failure: "[kurultai_2.GetTitledFirstName|U] utrpí při rvačce zranění"
