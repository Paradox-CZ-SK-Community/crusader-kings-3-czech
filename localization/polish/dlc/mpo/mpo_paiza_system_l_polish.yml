l_polish:
 mpo_establish_paiza_system_decision: "Zavést systém pajdzí"
 mpo_establish_paiza_system_decision_desc: "Zavedu systém zvláštních kovových destiček, který přiláká bohaté cizince a posílí postavení věrných poddaných [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')]. Každý, kdo ponese [Concept('paiza','pajdzu')|E] s vyrytým jménem [ROOT.Char.Custom('CZ_TitledFirstNameNoTooltip_G')], bude jednat z mého pověření a získá právo bezpečně procházet mými zeměmi. Ti, kdo se opováží zneuctít mé jméno, budou popraveni jako psi."
 mpo_establish_paiza_system_decision_tooltip: "Posílíš postavení svých věrných poddaných"
 mpo_establish_paiza_system_decision_confirm: "Mocí Věčného nebe"
 mpo_establish_paiza_system_decision_is_gurkhan: "Jsi [Concept('gurkhan','gürkhanem')|E]"
 mpo_establish_paiza_system_decision.grant_paiza_interaction_unlocked: "Odemkne [Concept('character_interaction','interakci s postavou')|E] #V $mpo_interaction_grant_paiza$#!, kterou můžeš použít vůči svým [Concept('courtiers','dvořanům')|E], [Concept('vassals','vazalům')|E] a [Concept('tributaries','tributářům')|E]"
 mpo_establish_paiza_system_decision.request_paiza_interaction_unlocked: "Odemkne [Concept('character_interaction','interakci s postavou')|E] #V $mpo_interaction_ask_for_paiza$#! pro tvé [Concept('vassals','vazaly')|E], [Concept('tributaries','tributáře')|E] a [Concept('adventurers','dobrodruhy')|E], kteří navštíví tvůj [Concept('court','dvůr')|E]"
 mpo_establish_paiza_system_decision.paiza_obedient: "Postavy, které obdrží pajdzu v podobě [Concept('artifacts','artefaktů')|E], se vůči tobě stanou [Concept('obedient','poslušnými')|E]"
 mpo_establish_paiza_system_decision.paiza_abuse_authority_unlocked: "@alert_icon! Nositelé pajdzí získají přístup k [Concept('decision','rozhodnutí')|E] #V $mpo_abuse_authority_paiza_decision$#!"
 mpo_establish_paiza_system_decision.leverage_khan_authority_unlocked: "@alert_icon! Nositelé pajdzí získají přístup k [Concept('interaction','interakci')|E] #V $mpo_interaction_leverage_khan_authority$#!"
 mpo_establish_paiza_system_decision.call_for_merchants_decision_unlocked: "Odemkne [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('mpo_call_for_merchants_decision').GetName]"
 mpo_establish_paiza_system_decision.paiza_recently_established: "Systém pajdzí již zavedla postava [THIS.Char.GetName]. Dokud je naživu, nemůžeš zavést nový. Každý její ubohý nádech je urážkou tvé autority."
 mpo_decisions_events.0099.t: "Systém pajdzí zaveden"
 mpo_decisions_events.0099.desc: "Má moc je jako sama step: rozprostírá se donekonečna, daleko za obzor. Přesto připomínám jedinou kapku deště, která je připoutána k jednomu místu.\n\nZa hranicemi stepi si obyvatelé měst vedou písemné záznamy, díky nimž jejich vědomosti dosáhnou dál, než kam kdy dohlédnou. Vezmu si z nich příklad a začnu rozdávat pajdzy. Moji věrní poddaní ponesou ta nejdůležitější slova ze všech: #EMP mé jméno.#!\n\n[ROOT.Char.GetTitledFirstNameNoTooltip]. Tyto znaky vyryté do kovu budou vzbuzovat strach a vynucovat naprostou poslušnost."
 mpo_decisions_events.0099.a: "Má vůle vtělená do kovu."
 paiza_artifact_title: "Pajdza [patron.Custom('CZ_TitledFirstNameNoTooltip_G')]"
 paiza_artifact_desc: "[Concept('paiza','Pajdza')|EU] je prostá, avšak hrozivá kovová destička, která může svému nositeli přinést moc i zkázu. Na její zadní straně jsou vyryta následující slova:\n\nMocí Věčného nebe. Pod ochranou císařského štěstí. Nařízení [patron.Custom('CZ_TitledFirstName_G')]. Kdokoli je nebude respektovat, bude potrestán a zemře."
 mpo_call_for_merchants: "Povolat zámožné návštěvníky"
 mpo_call_for_merchants_decision: "$mpo_call_for_merchants$: Pajdza"
 mpo_call_for_merchants_decision_desc: "Velká step je mnohem velkolepější než ta přepychová města rozmazlených cizinců. Přesto tamní obyvatelé vlastní zboží, důmyslná zařízení a znalosti, které by nám mohly být užitečné. Možná se některý z těch bohatých hlupáků odváží vydat až k nám."
 mpo_call_for_merchants_decision_tooltip: "$mpo_call_for_merchants_decision.merchant_will_arrive$"
 mpo_call_for_merchants_decision_confirm: "Vyslat posly"
 mpo_call_for_merchants_dead_merchant_toast: "Zámožný návštěvník zemřel na cestě"
 mpo_call_for_merchants_dead_merchant_desc: "Zámožný návštěvník [merchant.GetShortUIName] během své cesty zahynul"
 mpo_call_for_merchants_small_decision: "$mpo_call_for_merchants$: Místní nabídky"
 mpo_call_for_merchants_small_decision_desc: "$mpo_call_for_merchants_decision_desc$"
 mpo_call_for_merchants_small_decision_tooltip: "Vylepšíš své vojáky nebo získáš možnost vytvářet [Concept('artifact','artefakty')|E]"
 mpo_call_for_merchants_small_decision_confirm: "Vyslat posla"
 mpo_call_for_merchants_decision.merchant_will_arrive_smol: "$mpo_call_for_merchants_decision.merchant_will_arrive_generic$\n$BULLET_WITH_TAB$Přibližně #P 20%#! investovaného [Concept('gold','zlata')|E]"
 mpo_call_for_merchants_decision.merchant_will_arrive_generic: "Na tvůj dvůr dorazí zámožný cizinec, který povede karavanu do vyspělých, trvale osídlených měst. Po jeho návratu můžeš získat následující výhody:\n$BULLET_WITH_TAB$Materiály k výrobě [Concept('artifact','artefaktů')|E], které odemknou [Concept('decision','rozhodnutí')|E] #V $commission_artifact_decision$#!\n$BULLET_WITH_TAB$Výzbroj pro tvou [Concept('horde','nomádskou hordu')|E] a [Concept('archer_cavalry','jízdní lučištníky')|E]"
 mpo_call_for_merchants_decision.gold_needed_smol: "Výnosnější nabídky vyžadují vyšší investici [Concept('gold','zlata')|e], až do výše 800 [gold_i|E]"
 mpo_call_for_merchants_decision.robbed_merchants: "Předchozí cizinec, který vyslyšel tvé pozvání, zmizel za násilných okolností a zpráva o jeho osudu se rozšířila. Potrvá nějakou dobu, než se další pošetilec odváží přijít."
 mpo_call_for_merchants_decision.merchant_will_arrive: "$mpo_call_for_merchants_decision.merchant_will_arrive_generic$\n$BULLET_WITH_TAB$Přibližně #P 40%#! investovaného [Concept('gold','zlata')|E]\n$BULLET_WITH_TAB$Pokrok v náhodné [Concept('innovation','inovaci')|E]"
 mpo_call_for_merchants_decision.buildings: "Různá [Concept('internal_upgrades','vnitřní vylepšení')|E] [Concept('yurt_building','budovy jurty')|E] [GetDomicileBuilding('trade_yurt_01').GetName] poskytují další výhody."
 mpo_call_for_merchants_decision.gold_needed: "Výnosnější nabídky vyžadují vyšší investici [Concept('gold','zlata')|E], až do výše 2400 [gold_i|E]"
 is_paiza_merchant: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'je obchodnicí vyslanou','je obchodníkem vyslaným')] na cestu z pověření kočovného vládce"
 mpo_decisions_events.0100.t: "$mpo_call_for_merchants_decision$"
 mpo_decisions_events.0100.desc: "$mpo_decisions_events.2141.desc$"
 mpo_decisions_events.0100.a: "Přines mi nové myšlenky."
 mpo_decisions_events.0100.a_not_unlocked: "Nemáš [Concept('yurt_building','budovu jurty')|E] [GetDomicileBuilding('trade_yurt_01').GetName]"
 mpo_decisions_events.0100.b: "Ocel najde dobré využití."
 mpo_decisions_events.0100.c: "Zbroj pro mou hordu."
 mpo_decisions_events.0100.d: "Nejprve vyměňme stádo za zlato."
 mpo_decisions_events.0100.d.unlocked: "Po výměně [Concept('herd','stáda')|E] si budeš moci vybrat požadované zboží.\n#weak Tato možnost je dostupná díky [Concept('yurt_building','budově jurty')|E] [GetDomicileBuilding('herd_trade_yurt_01').GetName].#!"
 mpo_decisions_events.0100.e: "Tvé bohatství. A tvůj život. Hned."
 mpo_decisions_events.0100.e.warning: "@alert_icon! #alert_trial Po dobu dvaceti let se žádný další zámožný návštěvník neodváží přijet na tvůj dvůr. Během této doby nebudeš moci přijmout [Concept('decision','rozhodnutí')|E] #V $mpo_call_for_merchants_decision$#!.#!"
 mpo_decisions_events.2141.t: "$mpo_call_for_merchants_small_decision$"
 mpo_decisions_events.2141.desc: "[paiza_merchant.GetName|U] dorazí dříve, než jsem očekával. Boty má pokryté prachem z cest a v očích mu jiskří.\n\n„Děkuji, že mi dovoluješ pobývat ve svém táboře, [Select_CString(ROOT.Char.IsFemale,'moudrá a mocná','moudrý a mocný')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]. Doslechl jsem se, že tě zajímá zboží z [merchant_origin.Custom('CZ_LandedNameNoTier_G')]. Mohu je přivézt až k tvé jurtě. Sám povedu karavanu tam i zpět.\n\nPokorně ti přinesu vše, po čem zatoužíš. Přeješ si surovou ocel z nejlepších pecí? Zbroj, která odrazí každou ránu? Nebo snad něco jiného?“"
 mpo_decisions_events.2141.b: "$mpo_decisions_events.0100.b$"
 mpo_decisions_events.2141.c: "$mpo_decisions_events.0100.c$"
 mpo_decisions_events.2141.d: "$mpo_decisions_events.0100.d$"
 mpo_decisions_events.2141.d.unlocked: "$mpo_decisions_events.0100.d.unlocked$"
 mpo_decisions_events.2141.e: "$mpo_decisions_events.0100.e$"
 mpo_decisions_events.2141.e.warning: "$mpo_decisions_events.0100.e.warning$"
 mpo_decisions_events.2141.upon_merchant_return: "$mpo_decisions_events.0100.upon_merchant_return$"
 mpo_decisions_events.0100.upon_merchant_return: "Až se [paiza_merchant.GetNameNoTooltip] vrátí z cesty do [merchant_origin.Custom('CZ_LandedName_G')]:"
 mpo_decisions_events.0101.t: "Návrat cizince"
 mpo_decisions_events.0101.desc: "[paiza_merchant.GetName|U] se konečně vrací z dlouhé a strastiplné cesty do [merchant_origin.Custom('CZ_LandedName_G')]. Nyní sedí v mé jurtě a popíjí [Glossary( 'kumis', 'KUMIS_GLOSS' )].\n\nVzácné zboží, které jsem si objednal, právě vykládají z karavany. Stepní vlk a městský beránek našli způsob, jak spolu vycházet. Alespoň na nějaký čas."
 mpo_decisions_events.0101.a: "Výborně!"
 mpo_decisions_events.0101.b: "Vyprávěj mi o dalekých zemích."
 mpo_decisions_events.0101.b.desc: "[paiza_merchant.GetName|U] tě potěší vyprávěním o zemích, kterými během svých cest prošel."
 mpo_decisions_events.2137.t: "Cesty [paiza_merchant.Custom('CZ_FirstNameNoTooltip_G')]"
 mpo_decisions_events.2137.desc_intro: "[paiza_merchant.GetName|U] se zhluboka nadechne, zahledí se do dáli a začne vyprávět:\n#weak"
 mpo_decisions_events.2137.desc_interludium: "\n\n#!Po chvíli se znovu nadechne a začne překotně vyprávět o dalším panství:\n#weak"
 mpo_decisions_events.2137.a: "Rozumím."
 mpo_decisions_events.2137.b: "Pověz mi víc!"
 mpo_decisions_events.2137.c: "Zůstaň v mé jurtě."
 mpo_decisions_events.2138.t: "Stádo za zlato"
 mpo_decisions_events.2138.desc: "Společně s [paiza_merchant.Custom('CZ_Name_I')] se vydáme k mé [Concept('yurt_building','budově jurty')|E] [GetDomicileBuilding('trade_yurt_01').GetName], abychom projednali podrobnosti obchodu.\n\n„Mohu od tebe odkoupit značnou část stáda,“ vysvětluje obchodník. „Během cesty sem jsem navázal mnoho užitečných kontaktů. Žádného velkého odběratele sice nemám, ale při zpáteční cestě mohu navštívit dostatek drobných pastevců, abych na obchodu vydělal. Nebo alespoň příliš neprodělal.\n\nTuto nabídku ti předkládám z úcty k tobě a tvému vznešenému postavení, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')].“"
 mpo_decisions_events.2138.desc_rate_1: "[GetDomicileBuilding('herd_trade_yurt_01').GetName]: 6 [herd_i] za 1 [gold_i]"
 mpo_decisions_events.2138.desc_rate_2: "[GetDomicileBuilding('herd_trade_yurt_03').GetName]: 4 [herd_i] za 1 [gold_i]"
 mpo_decisions_events.2138.desc_rate_3: "[GetDomicileBuilding('herd_trade_yurt_06').GetName]: 2 [herd_i] za 1 [gold_i]"
 mpo_decisions_events.2138.a: "Platí."
 mpo_decisions_events.2138.b: "Čím víc nabídnu, tím víc vydělám."
 mpo_decisions_events.2138.c: "Vraťme se k původnímu jednání."
 mpo_decisions_events.2138.c.desc: "Nevyměníš žádné [Concept('herd','stádo')|E] a vrátíš se k projednávání cíle cesty [paiza_merchant.Custom('CZ_Name_G')]"
 mpo_decisions_events.2141.already_traded: "Již jsi vyměnil [Concept('herd','stádo')|E] za [Concept('gold','zlato')|E]"
 mpo_abuse_authority_paiza_decision: "Zneužít gürchánovu autoritu"
 mpo_abuse_authority_paiza_decision_tooltip: "[Concept('gurkhan','Gürchán')|EU] promlouvá mými ústy!"
 mpo_abuse_authority_paiza_decision_desc: "Nosím s sebou jméno samotného gürchána. Znaky vyryté do mé pajdzy vzbuzují v srdcích lidí strach. Okolní země jsou úrodné, avšak jejich obyvatelé jsou slabí. Vezmu si od nich vše, co budu moci. Nikoliv silou své nezdolné paže, nýbrž mocí gürchánova jména."
 mpo_abuse_authority_paiza_decision_confirm: "Ve jménu [Concept('gurkhan','gürchána')|E]!"
 mpo_abuse_authority_paiza_decision.paiza_patron_not_topdog: "Vydavatel [Concept('paiza','pajdzy')|E] již není [Concept('gurkhan','gürchánem')|E]"
 mpo_abuse_authority_paiza_decision.not_topdog_realm_or_steppe: "Autorita [Concept('gurkhan','gürchána')|E] zde není uznávána"
 mpo_abuse_authority_paiza_decision.no_more_paiza_abuse: "[Concept('gurkhan','Gürchán')|EU] zareagoval na tvé činy"
 mpo_abuse_authority_paiza_decision.region_already_abused: "V těchto zemích již došlo ke zneužití autority [Concept('gurkhan','gürchána')|E]"
 mpo_abuse_authority_paiza_decision.nothing_to_abuse: "V této [Concept('location','poloze')|E] se nenachází žádné území vhodné ke zneužití moci"
 mpo_decisions_events.0110.t: "Ve jménu [paiza_patron.Custom('CZ_TitleAsNameNoTooltip_G')]"
 mpo_decisions_events.0110.desc: "Jsem [Select_CString(ROOT.Char.IsFemale,'věrnou poddanou','věrným poddaným')] [paiza_patron.Custom('CZ_TitledFirstName_G')]. Nosím [Select_CString(paiza_patron.IsFemale,'její','jeho')] jméno vyryté do kovu a [Select_CString(paiza_patron.IsFemale,'její','jeho')] vůli ve svých slovech i skutcích. [Select_CString(paiza_patron.IsFemale,'Její','Jeho')] síla je mou silou.\n\n[Select_CString(local_boi.IsFemale,'Ta slabá','Ten slabý')] [local_boi.GetName] může prosit, jak dlouho chce. Nic to nezmění na gürchánových příkazech, které vycházejí z mých úst.\n\nVeškeré bohatství a všechna zdravá zvířata z těchto zemí musí být okamžitě shromážděna a předána mně. Vaše slabost totiž uráží autoritu [paiza_patron.Custom('CZ_TitleAsNameNoTooltip_G')]. A já pro všechno to bohatství najdu... #EMP lepší#! využití."
 mpo_decisions_events.0110.a: "Shromážděte všechno, co se hýbe!"
 mpo_decisions_events.0110.b: "„Ani slovo o tom, vy psi!“"
 mpo_decisions_events.0110.c: "Rozmyslel jsem si to."
 mpo_decisions_events.0110.d: "Tohle je #EMP špatné.#! Odcházíme!"
 mpo_decisions_events.0110.b.success: "Úspěch"
 mpo_decisions_events.0110.b.success_desc: "O tom, co se zde stalo, se [paiza_patron.GetTitledFirstName] vůbec nedozví"
 mpo_decisions_events.0110.b.failure: "[paiza_patron.GetTitledFirstName|U] se dozví o zneužití své autority"
 custom.mpo_resources_gained_abuse: "Kořist z okolních [Concept('counties','hrabství')|E]"
 mpo_decisions_events.0111.t: "Gürchánův hněv"
 mpo_decisions_events.0111.desc: "Gürchán je jako sama step. Moc a vůle [paiza_patron.Custom('CZ_Name_G')] sahají až za její obzory. [Select_CString(paiza_patron.IsFemale,'Její','Jeho')] jméno si šeptá sám vítr.\n\nNosil jsem toto jméno vyryté do kovu své pajdzy. Využíval jsem je, abych v srdcích lidí vzbuzoval strach a poslušnost. Zřejmě však až příliš často.\n\nNyní je řada na mně, abych poznal strach. Gürchán se doslechl o mých činech a považuje je za zneužití svého slova i jména. A za to se ze mě stane odstrašující příklad, na který jen tak nezapomene celá step."
 mpo_decisions_events.0111.a: "Přijímám svůj rozsudek."
 mpo_decisions_events.0111.b: "„Ach, ale mé činy byly přece oprávněné...“"
 mpo_decisions_events.0112.t: "$mpo_decisions_events.0111.t$"
 mpo_decisions_events.0112.desc: "Jsem jako sama step. Má moc a vůle sahají až za její obzory. Mé jméno si šeptá sám vítr.\n\nJezdci nosí mé jméno vyryté do kovu svých pajdzí. Někteří je však překrucují jako prohnaní hadi. Chamtiví hlupáci jako [paiza_abuser.GetName] a [paiza_abuser_1.GetName]. Ještě nedávno se přede mnou [paiza_abuser.GetName] [Select_CString(paiza_abuser.IsFemale,'plazila','plazil')] jako červ, a nyní utiskuje mé věrné poddané. Ti se přitom obracejí právě na mě a žádají odpovědi a spravedlnost. Nechť tedy vítr roznese mou skutečnou vůli!\n\n„Právě ke mně dorazila zpráva. Dejte všem vědět, že [ROOT.Char.GetTitledFirstNameNoTooltip] se postaví každému vykleštěnému čoklovi, ať už je to [paiza_abuser.GetFirstNameNoTooltip], [paiza_abuser_1.GetFirstNameNoTooltip] nebo kdokoli jiný. Mé jméno patří jen mně!“"
 mpo_decisions_events.0112.a: "Přineste mi jejich hlavy!"
 mpo_decisions_events.0112.a.desc: "Pokud [paiza_abuser.GetFirstName] i [paiza_abuser_1.GetFirstName] zemřou, ostatní [Concept('characters','postavy')|E] vlastnící tvé [Concept('paiza','pajdzy')|E] budou méně ochotné zneužívat tvou autoritu"
 mpo_decisions_events.0112.b: "Tentokrát to přehlédnu..."
 mpo_decisions_events.0112.c: "Už mě s tím nikdy neobtěžujte."
 mpo_decisions_events.0112.c.flavor: "Ke zneužívání tvé autority bude docházet i nadále, ale už o něm nebudeš dostávat žádná oznámení."
 mpo_paiza_abuse_counter_effect.random: "Činy [Concept('gurkhan','gürchána')|E] jsou nepředvídatelné, jak už to u lidí bývá"
 mpo_paiza_abuse_counter_effect.angry: "@warning_icon! [Concept('gurkhan','Gürchán')|EU] zuří kvůli zneužívání své autority a téměř jistě zareaguje"
 mpo_paiza_abuse_counter_effect.annoyed: "@alert_icon! [Concept('gurkhan','Gürchána')|EU] zneužívání jeho autority rozčiluje a pravděpodobně zareaguje"
 mpo_paiza_abuse_counter_effect.indifferent: "[Concept('gurkhan','Gürchán')|EU] je ke zneužívání své autority lhostejný a tentokrát nijak nezasáhne"
 mpo_paiza_abuse_counter_effect.khan_reaction_action: "@alert_icon! [Concept('gurkhan','Gürchán')|EU] zareaguje #EMP násilím#!"
