 steal_herd_vassal_tt: "Každý [Concept('powerful_vassal','mocný vazal')|E] postavy [target.GetShortUIName]:\n$EFFECT_LIST_BULLET$Ztratí #n 15#! bodů [Concept('opinion','mínění')|E] vůči #V [owner.Custom('CZ_ShortUIName_D')]#! #weak (-0,60/rok) (Krádež stáda mého lenního pána)#!"
 steal_herd_event_title: "Krádež stáda:"
 steal_herd_outcome.1001.t: "$steal_herd_event_title$ Úspěch!"
 steal_herd_outcome.1001.desc: "[Select_CString(courtier.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier'))|l], [courtier.GetName], [Select_CString(courtier.IsFemale,'přiklusala','přiklusal')] do tábora s náležitou hrdostí. V patách se drží neznámý pastevec, který přede mnou žene stádo dobytka.\n\n„Z tábora [target.Custom('CZ_TitledFirstName_G')]!“ zvolá [courtier.GetFirstNameNoTooltip]. Zatímco pastevci udílím pokyny, kam má nově získaná zvířata zahnat, neubráním se potměšilému úsměvu. Mé stádo se opět rozrostlo, a přitom mě to téměř nic nestálo."
 steal_herd_outcome.1001.a: "„Děkuji za tvou ‚štědrost‘, [target.Custom('CZ_FirstNameNoTooltip_V')]!“"
 steal_herd_outcome.1003.desc: "[courtier.GetFirstNameNoTooltip|U] mi začne podrobně líčit naši krádež, včetně toho, jak snadno jsme překonali obranu [target.Custom('CZ_FirstNameNoTooltip_G')]. Když jsme do tábora pronikli s takovou lehkostí, nedá mi to a začnu přemýšlet, co dalšího bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] svému protivníkovi sebrat..."
 steal_herd_outcome.1003.a: "„[courtier.Custom('CZ_FirstNameNoTooltip_V')|U], můžeš mi to ještě jednou vysvětlit?“"
 steal_herd_outcome.1003.a_desc: "Pokusíš se ukrást další část [Concept('herd','stáda')|E] [target.Custom('CZ_FirstNameNoTooltip_G')]"
 steal_herd_outcome.1003.win: "Tvé krádeže pokračují"
 steal_herd_outcome.1003.lose: "Další kořist se ti získat nepodaří"
 steal_herd_outcome.1003.b: "„Co takhle prohledat i [Select_CString(target.IsFemale,'její','jeho')] pokladnici?“"
 steal_herd_outcome.1003.b_desc: "Pokusíš se ukrást zlato postavě [target.GetFirstNameNoTooltip]"
 steal_herd_outcome.1003.c: "„Také [target.GetPrimarySpouse.GetFirstName] zatím patří [target.Custom('CZ_FirstNameNoTooltip_D')].“"
 steal_herd_outcome.1003.c_tt: "Zahájím [Concept('scheme','intriku')|E] typu [GetScheme('seduce').GetTypeName] vůči [target.GetPrimarySpouse.GetFirstName] se #p zvýšenou#! #V šancí na úspěch#!"
 mpo_steal_herd_seduce_modifier: "Pastevcův dotek"
 mpo_steal_herd_murder_modifier: "Spolčenci na pastvinách"
 steal_herd_outcome.1003.d: "„A co takhle [Select_CString(target.IsFemale,'její','jeho')] život?“"
 steal_herd_outcome.1003.d_tt: "Zahájím [Concept('scheme','intriku')|E] typu [GetScheme('murder').GetTypeName] vůči [target.Custom('CZ_FirstName_A')] se #p zvýšenou#! #V šancí na úspěch#!"
 steal_herd_outcome.1003.e: "Prozatím jsem [Select_CString(ROOT.Char.IsFemale,'získala','získal')] dost."
 steal_herd_outcome.1002.t: "$steal_herd_event_title$ Ukradené stádo!"
 steal_herd_outcome.1002.desc: "[spymaster.GetName|U] za mnou přichází se znepokojivou zprávou.\n\n„[ROOT.Char.Custom('CZ_FirstName_V')|U], některá zvířata, která jsme chovali na našem dvoře, beze stopy zmizela.“\n\n[spymaster.GetFirstNameNoTooltip|U] si odkašle a pokračuje: „Po důkladném pátrání se ukázalo, že [owner.GetName] [Select_CString(owner.IsFemale,'vyslala','vyslal')] několik svých poskoků, aby si naše stádo ‚vyzvedli‘. Dokonce přesvědčili pastevce, že jednají na tvůj rozkaz.“"
 steal_herd_outcome.1002.desc_monies: "\n\nPo tomto odhalení si všimnu truhlice, která bývala do poloviny naplněná vzácnými šperky. Teď v ní zbývá sotva hrstka cenností. Vím, kdo za tím stojí, a těžce si povzdechnu."
 steal_herd_outcome.1002.a: "„Kéž se [ROOT.Char.GetFaith.NegativeAfterLife] stane tvým věčným domovem, [owner.Custom('CZ_FirstNameNoTooltip_V')]!“"
 steal_herd_outcome.2001.t: "$steal_herd_event_title$ Neúspěch"
 steal_herd_outcome.2001.desc: "Můj plán ukrást stádo [target.Custom('CZ_TitledFirstName_G')] proběhl přesně podle očekávání. Přesto se [courtier.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier'))|l], vrací s prázdnýma rukama. Ani chomáč vlny [Select_CString(courtier.IsFemale,'nepřinesla','nepřinesl')] na důkaz svého úspěchu.\n\n„[owner.Custom('CZ_FirstNameNoTooltip_V')|U], odpusť mi. [target.GetFirstNameNoTooltip|U] nám [Select_CString(target.IsFemale,'byla','byl')] neustále v patách,“ povzdechne si [courtier.GetFirstNameNoTooltip]. „Naštěstí se nám podařilo uniknout dřív, než nás dostihli [Select_CString(target.IsFemale,'její','jeho')] jezdci.“"
 steal_herd_outcome.2001.a: "[target.GetFirstNameNoTooltip|U] musí být pod ochranou samotných bohů..."
 steal_herd_outcome.2002.desc: "[courtier.GetName|U] mě vyvede ven a já ke svému zděšení zjistím, že nám chybí celé stádo!\n\n[courtier.GetFirstNameNoTooltip|U] mi vysvětlí, že se nám nepodařilo ukrást zvířata [target.Custom('CZ_TitledFirstName_D')]. Jenže místo aby naše jezdce [Select_CString(target.IsFemale,'nechala','nechal')] uprchnout, [target.GetTitledFirstName] se okamžitě [Select_CString(target.IsFemale,'rozhodla','rozhodl')] pomstít. Vyslaná družina pronásledovala [courtier.Custom('CZ_FirstNameNoTooltip_A')] a ostatní účastníky krádeže až k našim pastvinám. Tam se jezdci zmocnili ovcí i dalšího dobytka a rychle zmizeli."
 steal_herd_outcome.2002.a: "„Jak jsme mohli být tak neschopní?!“"
 steal_herd_outcome.2003.t: "Stádo [owner.Custom('CZ_TitledFirstName_G')]"
 steal_herd_outcome.2003.desc: "V táboře vypukne rozruch a vzápětí se objeví [courtier.GetName]. S úsměvem mi pokyne, abych [Select_CString(ROOT.Char.IsFemale,'vyšla','vyšel')] ven.\n\nNa dvoře stojí stádo ovcí a koní, které přivádí jeden z mých jezdců. [courtier.GetFirstNameNoTooltip|U] se na mě významně zadívá.\n\n„Ta drzost! [owner.GetFirstNameNoTooltip|U] se [Select_CString(owner.IsFemale,'pokusila','pokusil')] okrást #italic tebe#! a zmocnit se tvého stáda!“ rozhořčí se. „Naštěstí však má [courtier.GetFaith.HighGodName] jiné plány. Všechna tato nádherná zvířata původně patřila právě [owner.Custom('CZ_FirstNameNoTooltip_D')]!“"
 steal_herd_outcome.2003.a: "„Dnes mi tvé nezdary přišly vhod, [owner.Custom('CZ_FirstNameNoTooltip_V')]!“"
 steal_herd_ongoing.1001.t: "$steal_herd_event_title$ Hlídka"
 steal_herd_ongoing.1001.desc: "Pokud chci ukrást stádo [target.Custom('CZ_TitledFirstName_G')], musím nejprve poznat zdejší krajinu i její obyvatele. Vydám se proto zjistit, které pastviny leží blízko sídla mého protivníka a které jsou odlehlé a nehlídané.\n\nPrávě si prohlížím návrší poblíž [target.GetCapitalLocation.GetTitle.Custom('CZ_LandedName_G')], když se k mé družině zezadu přiblíží skupina ozbrojených jezdců.\n\n„Co tu pohledáváte?“ zeptá se jejich vůdce, [target_knight.GetFirstName]."
 steal_herd_ongoing.1001.a: "Konečně někdo, na kom mohu vyzkoušet svou udatnost!"
 steal_herd_ongoing.1001.a_win: "Svými bojovými schopnostmi zapůsobíš na [target_knight.Custom('CZ_FirstNameNoTooltip_A')]"
 steal_herd_ongoing.1001.duel_desc: "Pokusíš se odvést pozornost [target_knight.Custom('CZ_FirstNameNoTooltip_G')]"
 steal_herd_ongoing.1001.lose: "[target_knight.GetFirstNameNoTooltip|U] tě přemůže"
 steal_herd_ongoing.1001.b: "„Přece obdivuji krásy panství, kterému vládne [target.GetFirstNameNoTooltip].“"
 steal_herd_ongoing.1001.b_win: "[target_knight.GetFirstNameNoTooltip|U] ocení tvá slova"
 steal_herd_ongoing.1001.c: "„Jen si užívám dobrého pití! Nepřidáš se?“"
 steal_herd_ongoing.1001.c_win: "S [target_knight.Custom('CZ_FirstNameNoTooltip_I')] prohýříš celou noc"
 steal_herd_ongoing.1001.c_win_big: "Podaří se ti přesvědčit opilého [target_knight.Custom('CZ_FirstNameNoTooltip_A')], aby se přidal na tvou stranu"
 steal_herd_ongoing.1001.d: "„Nic zvláštního. Už jsem na odchodu.“"
 steal_herd_ongoing.1002.t: "$steal_herd_event_title$ Pastevec v přestrojení"
 steal_herd_ongoing.1002.desc: "[chosen_agent.GetName|U] mi vypráví, že pastevci [target.Custom('CZ_TitledFirstName_G')] často nedokážou uhlídat ani jedinou ovci ze svěřeného stáda.\n\n„Co kdyby ses převlékl do pasteveckého oděvu?“ navrhnu [chosen_agent.Custom('CZ_FirstNameNoTooltip_D')]. „Vydej se za [target.Custom('CZ_FirstNameNoTooltip_I')] a nabídni pomoc těm neschopným pastevcům.“\n\n[chosen_agent.GetFirstNameNoTooltip|U] se na mě znepokojeně zadívá a těžce si povzdechne."
 steal_herd_ongoing.1002.a: "„Jen běž, [chosen_agent.Custom('CZ_FirstNameNoTooltip_V')], a pěkně [target.Custom('CZ_FirstNameNoTooltip_D')] pomoz!“"
 steal_herd_ongoing.1002.b: "„A já přesně vím, co bys [Select_CString(chosen_agent.IsFemale,'měla','měl')] říct...“"
 steal_herd_ongoing.1002.c: "„Vlastně na to zapomeň.“"
 steal_herd_ongoing.1002.duel_desc: "[chosen_agent.GetFirstName|U] se vydává za pasteveckou výpomoc"
 steal_herd_ongoing.1002.win: "Přestrojení [chosen_agent.Custom('CZ_FirstName_G')] je přesvědčivé"
 steal_herd_ongoing.1002.b_tt: "Pomůžeš [chosen_agent.Custom('CZ_FirstName_D')] s přestrojením"
 steal_herd_ongoing.1002.lose: "Přestrojení [chosen_agent.Custom('CZ_FirstName_G')] nikoho nepřesvědčí"
