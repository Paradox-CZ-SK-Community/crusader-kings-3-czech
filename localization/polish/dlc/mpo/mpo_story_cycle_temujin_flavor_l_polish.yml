l_polish:
 mpo_temujin_flavor.0001.t: "Už nejsme sami"
 mpo_temujin_flavor.0001.desc: "Noc se prohlubuje. V táboře už jsme zůstali jen já a [jamukha.GetTitledFirstName].\n\n„[ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')|U],“ pronese [jamukha.GetFirstNameNoTooltip] a namíří na mě svou dýku. „Za války jsem bojoval po tvém boku, abychom získali zpět tvou milovanou manželku. V míru budu naslouchat tvým radám, vyměňovat si s tebou dary a následovat tě, dokud mi budou nohy sloužit.“\n\nPřitiskne ostří dýky k dlani a vyřízne si hlubokou ránu. „Nechť krev stvrdí přísahu, kterou jazyk nedokáže vyslovit.“"
 mpo_temujin_flavor.0001.a: "„Budu stát při tobě, dokud mi oči nezbělají.“"
 mpo_temujin_flavor.0001.b: "„Vlk nepotřebuje ovce.“"
 mpo_temujin_flavor.0010.t: "Sbohem"
 mpo_temujin_flavor.0010.desc.intro: "„Nadešel čas, [ROOT.GetCharacter.Custom('GetMongolHonorific')|l] [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')],“ pronese [jamukha.GetFirstName], který sedí naproti mně u táborového ohně. „Pod tvou právoplatnou vládou se mi dařilo, ale semeno nemůže vzklíčit ve stínu mohutného stromu.“\n\nVstane a pokračuje."
 mpo_temujin_flavor.0010.desc.rejected: "„Jednou jsi mě už odmítl. Doufám, že mě nyní pochopíš.“"
 mpo_temujin_flavor.0010.desc.blood_brothers: "„Právě před tímto ohněm jsme kdysi složili přísahu, kterou hodlám dodržet. Jenže můj lid žádá svobodu.“"
 mpo_temujin_flavor.0010.desc.fallback: "„Můj lid touží pouze po stejné svobodě, jakou má ten tvůj.“"
 mpo_temujin_flavor.0010.aa: "„Tak jdi! Schovej se jako červ, kterým jsi!“"
 mpo_temujin_flavor.0010.aa_remove_blood_brother: "S [jamukha.Custom('CZ_ShortUIName_I')] přestanete být [Concept('blood_brothers','pokrevními bratry')|E]"
 mpo_temujin_flavor.0010.a: "„Svůj lid odsuzuješ k pojídání hlíny.“"
 mpo_temujin_flavor.0010.a.tt.success: "[jamukha.GetShortUIName|U] se stane terčem posměchu"
 mpo_temujin_flavor.0010.a.tt.failure: "Zdá se, že to nikoho neznepokojuje"
 mpo_temujin_flavor.0010.b: "„#EMP Zůstaň.#!“"
 mpo_temujin_flavor.0010.c: "„Rozhodl ses sám.“"
 every_non_brave_compassionate_courtier: "Každý [Concept('courtier','dvořan')|E], který není ani [GetTrait('brave').GetName( GetNullCharacter )|l], ani [GetTrait('compassionate').GetName( GetNullCharacter )|l]"
 mpo_temujin_flavor.0020.t: "[jamukha.Custom('CZ_FirstNamePossessiveNoTooltip_F')|U] zrada"
 mpo_temujin_flavor.0020.desc.intro: "„[ROOT.Char.GetFirstNameNoTooltip]! [ROOT.Char.GetFirstNameNoTooltip]!“ Uprostřed hluboké noci mě probudí známý hlas. „Odpusť, ale muselo to takhle dopadnout.“\n\n[ jamukha.GetFirstName] sedí na koni přímo před vchodem do mého stanu.\n\n„Přijel jsem tě varovat —"
 mpo_temujin_flavor.0020.desc.blood_brothers: " kvůli krvi, kterou jsme kdysi společně prolili.“"
 mpo_temujin_flavor.0020.desc.friend: " kvůli přátelství, které nás kdysi pojilo.“"
 mpo_temujin_flavor.0020.desc.rival: " z úcty, kterou si zaslouží důstojný sok.“"
 mpo_temujin_flavor.0020.desc.fallback: " z úcty k tobě jako ke svému bývalému [ROOT.Char.GetLadyLord|l].“"
 mpo_temujin_flavor.0020.desc.outro: "\n\n„Od této chvíle tě budu pronásledovat a štvát jako zvěř. Rozetnu hluboké vody a obrousím i ten nejtvrdší kámen. Neexistuje nic, co bych neudělal, abych tě zničil. Protože jsem to já, kdo se narodil, aby vládl všem Mongolům. #EMP Ne ty!#!“"
 mpo_temujin_flavor.0020.a: "„Ty, kterého jsem kdysi nazýval bratrem...“"
 mpo_temujin_flavor.0020.b: "„Má dýka si najde tvůj krk.“"
 mpo_temujin_flavor.0020.c: "„Tohle budeš litovat!“"
 temujin_jamukha_truce: "Bývalý vrchní pán"
 mpo_temujin_flavor.0020.cb.tt: "[temujin.GetShortUIName|U] a [jamukha.GetShortUIName] vůči sobě navzájem získají [Concept('casus_bellis','casus belli')|E] #high $retaliation_cb$#!"
 mpo_temujin_flavor.0020.jamukha_gok_requirement: "Než bude možné přijmout [Concept('decision','rozhodnutí')|E] #high $mpo_become_greatest_of_khans_decision$#!, musíš porazit [jamukha.Custom('CZ_ShortUIName_A')]"
 mpo_temujin_flavor.0020.a_war_win: "Vítězství v #high útočné#! [Concept('war','válce')|EU] proti [jamukha.Custom('CZ_ShortUIName_D')] ti přinese dodatečnou @legitimacy_icon![Concept('legitimacy','legitimitu')|E] a @prestige_icon![Concept('prestige','prestiž')|E]"
 mpo_temujin_flavor.0020.b_murder: "Získáš #P #EMP obrovský#!#! bonus k [Concept('schemes','intrikám')|E] typu [GetScheme('murder').GetTypeName] zaměřeným na [jamukha.Custom('CZ_ShortUIName_A')]"
 TEMUJIN_JAMUKHA_MURDER_BONUS: "Přísahal jsi zabít [target.Custom('CZ_ShortUIName_A')]: $VALUE|+0=$"
 temujin_jamukha_war_modifier: "Bratrova pomsta"
 temujin_jamukha_war_modifier_desc: "Tuto postavu zradil někdo, kdo jí byl nesmírně blízký."
 temujin_jamukha_war_smaller_modifier: "Krvavá pomsta"
 temujin_jamukha_war_smaller_modifier_desc: "Tuto postavu zradil někdo, komu důvěřovala."
 mpo_temujin_flavor.0020.remove_friend: "S [jamukha.Custom('CZ_ShortUIName_I')] přestanete být [Concept('friends','přáteli')|E]"
 mpo_temujin_flavor.0030.t: "Příkoří rodu [mergid.GetDynastyNameNoTooltip]"
 mpo_temujin_flavor.0030.desc: "„[ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')|U],“ ozve se tiše [borte.GetFirstNameNoTooltip], když vstoupí do mého stanu. Tváře má zrudlé a vlasy rozcuchané. „Od té doby, co mě drželi v zajetí lidé z rodu [mergid.GetDynastyName], se necítím dobře.“\n\n[borte.GetFirstNameNoTooltip|U] si roztřesenýma rukama zakryje podbřišek."
 mpo_temujin_flavor.0030.a: "„Za tohle zaplatí.“"
 mpo_temujin_flavor.0030.b: "„#EMP Ty#! jsi pro mě ze všeho nejdůležitější.“"
 mpo_temujin_flavor.0030.c: "„Proč mě obtěžuješ takovými nesmysly?“"
 mpo_temujin_flavor.0030.a.tt: "Získáš [Concept('casus_belli','casus belli')|E] #high $retaliation_cb$#! proti [mergid.Custom('CZ_ShortUIName_D')]"
 mpo_temujin_flavor.0030.pregnancy_tt: "[borte.GetShortUIName|U] brzy začne jevit známky těhotenství"
 pregnancy.1002.d.borte: "Nadešel okamžik, kterého jsem se tolik obával..."
 pregnancy.1002.a.borte: "Teď už je to za námi."
 birth.1003.desc.borte: "\n\n[ mother.Custom('CZ_FirstNamePossessiveNoTooltip_F')|U] upřímnost je však obdivuhodná. Nesmím dovolit, aby mě tato skutečnost odváděla od toho, co mám přímo před očima."
 birth.1003.desc.empty: ""
 birth.1003.c.borte: "Ne! [child.GetFirstName|U] není [Select_CString(child.IsFemale,'moje','můj')] [child.Custom('GetDaughterSon')|l]!"
