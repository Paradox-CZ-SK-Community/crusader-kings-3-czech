l_polish:
 mpo_the_great_steppe.0001.t: "Velká step"
 mpo_the_great_steppe.0001.desc: "Nekonečné moře trávy a kamení. Step není milosrdným domovem. Stany se stavějí a bourají podle střídání ročních období. Kvůli krutým sněhovým bouřím či mocnějším nepřátelům se přesouvají celé vesnice.\n\nČlověk je tu vydán zvířatům na milost a nemilost. Ať stádo potřebuje k přežití cokoli, musí to dostat.\n\nKdo zkrotí živly a povstane jako chán chánů?"
 mpo_the_great_steppe.0001.a: "Společně vyrážíme!"
 mpo_the_great_steppe.0002.t: "[my_subregion.GetNameNoTooltip|U]: [my_subregion.GetCurrentPhase.GetName|U]"
 mpo_the_great_steppe.0002.desc.cold_zud: "Mráz se mi zařezává až pod kůži. Kůže na tvářích se mi začíná loupat. Zvířata se třesou v prudkém větru a nemají už ani dost sil, aby si obstarala potravu."
 mpo_the_great_steppe.0002.desc.drought: "Země je rozpraskaná a vyprahlá jako hojící se rána. Tráva uschla a zvířata se perou o poslední stébla.\n\nNastal čas bojovat, nebo uprchnout."
 mpo_the_great_steppe.0002.desc.white_zud: "Pod silnou vrstvou sněhu není vidět jediné stéblo trávy. Smrt, bílá jako měsíc, si přišla pro naše zvířata."
 mpo_the_great_steppe.0002.desc.warm_nights: "Ptáci zpívají a děti si hrají. Zahlédnu, jak [person.GetFirstName] leží v trávě se zavřenýma očima a vyhřívá se na slunci.\n\nMezi zvířaty se ozývá slabé pískání a bečení. Právě narozeným telatům a jehňatům se dostává té nejněžnější péče.\n\nKéž by to tak mohlo zůstat navždy."
 mpo_the_great_steppe.0002.desc.abundant_grazing: "Tráva vyrostla tak vysoko, že se v ní ztrácejí děti. Jejich matky se smějí, když je v hustém porostu znovu nacházejí.\n\nZdravější stáda ani šťastnější časy si snad ani nelze představit."
 mpo_the_great_steppe.0002.desc.havsarsan_zud: "Řeky vysychají a louky pustnou. Půdu pokrývá led a nic už neroste. Zvířata padají mrtvá k zemi a my je brzy budeme následovat.\n\nKéž nám [ROOT.Char.GetFaith.HighGodName] pomůže, protože právě takhle snad vypadá [ROOT.Char.GetFaith.NegativeAfterLife]."
 mpo_the_great_steppe.0002.desc.sky_blessing: "Květiny rozkvétají a zvířatům se daří lépe než kdy dřív. Pastviny se rozšiřují i do míst, která byla po celé generace považována za mrtvou zemi.\n\nKaždé novorozené dítě zahrne [ROOT.Char.GetFaith.HealthGodName] láskou a [ROOT.Char.GetFaith.WarGodName] obdaří silou.\n\nStačí zavřít oči a téměř uvěřím, že právě takhle vypadá [ROOT.Char.GetFaith.PositiveAfterLife]."
 mpo_the_great_steppe.0002.desc.obedience: "\n\nV těchto těžkých časech, kdy se naděje na přežití ztenčuje, jsou však lidé mnohem ochotnější přísahat poslušnost."
 mpo_the_great_steppe.0002.a: "A tak se svět točí dál."
 mpo_the_great_steppe.0002.tt: "[Concept('steppe_season','Stepní období')|EU] se změnilo"
 mpo_the_great_steppe_0002_souvenirs_aplenty_tt: "Díky tvému [Concept('perk','talentu')|E] [GetPerk('souvenirs_aplenty_perk').GetName( GetPlayer )]"
 souvenirs_aplenty_perk_county_modifier: "Střídání ročních období"
 souvenirs_aplenty_perk_county_modifier_desc: "Díky zkušenostem získaným během svého života se tato postava naučila, jak se co nejlépe vyrovnávat se střídáním ročních období."
