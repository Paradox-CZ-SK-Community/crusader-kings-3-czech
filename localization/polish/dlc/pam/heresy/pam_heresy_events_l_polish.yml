l_polish:
 cathar_rite: "$cathar$" # todo: NEW TRANSLATION
 cathar_rite_name: "Kataři" # todo: NEW TRANSLATION
 cathar_rite_adj: "katarský" # todo: NEW TRANSLATION
 cathar_rite_adherent: "katar" # todo: NEW TRANSLATION
 cathar_rite_adherent_plural: "kataři" # todo: NEW TRANSLATION
 cathar_rite_desc: "Stroze dualistický ritus, podle něhož je hmotný svět dílem zlého demiurga. Jeho perfecti skládají sliby chudoby a čistoty, odmítají svátosti zavedené církve a odmítají vojenskou službu ve jménu Boha." # todo: NEW TRANSLATION
 waldensian_rite: "$waldensian$" # todo: NEW TRANSLATION
 waldensian_rite_name: "Valdenští" # todo: NEW TRANSLATION
 waldensian_rite_adj: "valdenský" # todo: NEW TRANSLATION
 waldensian_rite_adherent: "valden" # todo: NEW TRANSLATION
 waldensian_rite_adherent_plural: "valdenští" # todo: NEW TRANSLATION
 waldensian_rite_desc: "Ritus bosonohých žebravých kazatelů, kteří trvají na tom, že i laici smějí kázat Písmo, že institucionální církev nemá výhradní nárok na milost a že křesťané nemají vlastnit majetek ani nosit zbraň." # todo: NEW TRANSLATION
 lollard_rite: "$lollard$" # todo: NEW TRANSLATION
 lollard_rite_name: "Lollardi" # todo: NEW TRANSLATION
 lollard_rite_adj: "lollardský" # todo: NEW TRANSLATION
 lollard_rite_adherent: "lollard" # todo: NEW TRANSLATION
 lollard_rite_adherent_plural: "lollardi" # todo: NEW TRANSLATION
 lollard_rite_desc: "Reformní ritus, který odmítá okázalé obřady, transsubstanciaci, uctívání relikvií a bohaté duchovenstvo. Bible se čte v lidovém jazyce a každý věřící je pokládán za svého vlastního kněze." # todo: NEW TRANSLATION
 hussite_rite: "$hussite$" # todo: NEW TRANSLATION
 hussite_rite_name: "Husité" # todo: NEW TRANSLATION
 hussite_rite_adj: "husitský" # todo: NEW TRANSLATION
 hussite_rite_adherent: "husita" # todo: NEW TRANSLATION
 hussite_rite_adherent_plural: "husité" # todo: NEW TRANSLATION
 hussite_rite_desc: "Český reformní ritus, který požaduje kalich pro laiky, Písmo v lidovém jazyce a konec bohatství duchovenstva i prodeje odpustků. Jeho kazatelé hojně čerpají z Viklefových argumentů a z vroucího přesvědčení, že Řím sešel z apoštolské cesty." # todo: NEW TRANSLATION
 joachimite_rite: "$joachimite$" # todo: NEW TRANSLATION
 joachimite_rite_name: "Joachimité" # todo: NEW TRANSLATION
 joachimite_rite_adj: "joachimitský" # todo: NEW TRANSLATION
 joachimite_rite_adherent: "joachimita" # todo: NEW TRANSLATION
 joachimite_rite_adherent_plural: "joachimité" # todo: NEW TRANSLATION
 joachimite_rite_desc: "Apokalyptický ritus, který vykládá dějiny jako tři věky: Otce, Syna a přicházející věk Ducha svatého, jenž rozpustí institucionální církev a pozvedne nový kontemplativní řád. Jeho stoupenci putují v apoštolské chudobě, káží na tržištích a s rozzářenýma očima vyhlížejí bezprostřední konec světa." # todo: NEW TRANSLATION
 iconoclast_rite: "$iconoclast$" # todo: NEW TRANSLATION
 iconoclast_rite_name: "Ikonoklasté" # todo: NEW TRANSLATION
 iconoclast_rite_adj: "ikonoklastický" # todo: NEW TRANSLATION
 iconoclast_rite_adherent: "ikonoklast" # todo: NEW TRANSLATION
 iconoclast_rite_adherent_plural: "ikonoklasté" # todo: NEW TRANSLATION
 iconoclast_rite_desc: "Obnova starého východního hnutí proti zobrazování, které odsuzuje uctívání obrazů jako plíživé modlářství a požaduje odstranění ikon z kostelů i domácností." # todo: NEW TRANSLATION
 bogomilist_rite: "$bogomilist$" # todo: NEW TRANSLATION
 bogomilist_rite_name: "Bogomilové" # todo: NEW TRANSLATION
 bogomilist_rite_adj: "bogomilský" # todo: NEW TRANSLATION
 bogomilist_rite_adherent: "bogomil" # todo: NEW TRANSLATION
 bogomilist_rite_adherent_plural: "bogomilové" # todo: NEW TRANSLATION
 bogomilist_rite_desc: "Slovanský dualistický ritus, jehož kořeny sahají ke knězi Bogomilovi. Jeho kazatelé putují bosí, odmítají hierarchii, odmítají nosit zbraň a učí, že stvořitelem viditelného světa je Satan." # todo: NEW TRANSLATION
 paulician_rite: "$paulician$" # todo: NEW TRANSLATION
 paulician_rite_name: "Pavlikáni" # todo: NEW TRANSLATION
 paulician_rite_adj: "pavlikánský" # todo: NEW TRANSLATION
 paulician_rite_adherent: "pavlikán" # todo: NEW TRANSLATION
 paulician_rite_adherent_plural: "pavlikáni" # todo: NEW TRANSLATION
 paulician_rite_desc: "Válečnicky zaměřený dualistický ritus, který vznikl v Malé Asii. Jeho stoupenci pohrdají ikonami i zavedenými náboženskými hierarchiemi, cení si bezprostředního četby Pavlových listů a ochotně berou do ruky zbraně na obranu své čistoty." # todo: NEW TRANSLATION
 messalian_rite: "$messalian$" # todo: NEW TRANSLATION
 messalian_rite_name: "Messaliáni" # todo: NEW TRANSLATION
 messalian_rite_adj: "messaliánský" # todo: NEW TRANSLATION
 messalian_rite_adherent: "messalián" # todo: NEW TRANSLATION
 messalian_rite_adherent_plural: "messaliáni" # todo: NEW TRANSLATION
 messalian_rite_desc: "Esoterický asketický ritus, který považuje neustálou modlitbu za jedinou svátost, jež má skutečnou hodnotu. Jakmile je totiž démon přebývající ve věřícím vyhnán, žádný tělesný čin už tohoto věřícího nemůže poskvrnit." # todo: NEW TRANSLATION
 adoptionist_rite: "$adoptionist$" # todo: NEW TRANSLATION
 adoptionist_rite_name: "Adopcionisté" # todo: NEW TRANSLATION
 adoptionist_rite_adj: "adopcionistický" # todo: NEW TRANSLATION
 adoptionist_rite_adherent: "adopcionista" # todo: NEW TRANSLATION
 adoptionist_rite_adherent_plural: "adopcionisté" # todo: NEW TRANSLATION
 adoptionist_rite_desc: "Christologický ritus z Ibérie, který učí, že Kristus byl ve své lidské přirozenosti Božím adoptivním, nikoli vlastním Synem — nauka, kterou karolinská církev odsoudila jako kryptonestoriánství." # todo: NEW TRANSLATION
 pam_heresy_fervor_reset_component_1_desc: "Věřící se semkli proti šířícímu se [rite_divergence|E]" # todo: NEW TRANSLATION
 pam_heresy_fervor_reset_component_2_desc: "Věřící se semkli proti novému rozkolnickému [rite|E]" # todo: NEW TRANSLATION
 pam_heresy_fervor_reset_component_3_desc: "Věřící se semkli proti obnově hereze" # todo: NEW TRANSLATION
