 heresy_light.0010.desc.opener.lands: "z [founder.GetPrimaryTitle.GetBaseNameNoTier] " # todo: NEW TRANSLATION
 heresy_light.0010.desc.body.uneasy: "ještě více odchýlil [new_rite.GetName] od [source_rite.GetAdjective], " # todo: NEW TRANSLATION
 heresy_light.0010.desc.body.alarming: "nebezpečně vzdálil [new_rite.GetName] od obecně přijímané [source_rite.GetAdjective] praxe, " # todo: NEW TRANSLATION
 heresy_light.0010.desc.body.dangerous: "odchýlil [new_rite.GetName] natolik, že ji [source_rite.GetAdjective] sotva může rozpoznat jako příbuznou, " # todo: NEW TRANSLATION
 heresy_light.0010.desc.differing.tenet: "přičemž nejvýraznější odchylkou je [differing_tenet.GetBaseName]." # todo: NEW TRANSLATION
 heresy_light.0010.desc.differing.doctrine: "přičemž nejvýraznější odchylkou je [differing_doctrine.GetDescriptiveName( source_rite.GetFaith.Self )]." # todo: NEW TRANSLATION
 heresy_light.0010.desc.differing.fallback: "nové důrazy jsou příliš nenápadné, než aby se daly vystihnout jediným pojmem." # todo: NEW TRANSLATION
 heresy_light.0010.desc.outro: "\n\nZatím ještě nejde o kacíře. Hranice však už není daleko." # todo: NEW TRANSLATION
 heresy_light.0010.desc.outro.own_rite: "\n\nZatím ještě nejsme kacíři. Hranice však už není daleko." # todo: NEW TRANSLATION
 heresy_light.0010.a: "Budu se modlit za vedení." # todo: NEW TRANSLATION
 heresy_light.0010.b: "V [new_rite.GetNameNoTooltip] je moudrost. Vydám se touto cestou." # todo: NEW TRANSLATION
 heresy_light.0010.c: "To mi zavání kacířstvím..." # todo: NEW TRANSLATION
 heresy_light.0010.c.own_rite: "Kupředu tedy. Tato cesta je naše." # todo: NEW TRANSLATION
