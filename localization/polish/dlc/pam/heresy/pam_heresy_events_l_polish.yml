l_polish:
 cathar_rite: "$cathar$"
 cathar_rite_name: "Kataři"
 cathar_rite_adj: "katarský"
 cathar_rite_adherent: "katar"
 cathar_rite_adherent_plural: "kataři"
 cathar_rite_desc: "Asketicky založený dualistický ritus, podle něhož je hmotný svět dílem zlého demiurga. Jeho dokonalí, známí jako perfecti, skládají sliby chudoby a čistoty, odmítají svátosti oficiální církve a ve jménu Boha se zříkají vojenské služby."
 waldensian_rite: "$waldensian$"
 waldensian_rite_name: "Valdenští"
 waldensian_rite_adj: "valdenský"
 waldensian_rite_adherent: "valden"
 waldensian_rite_adherent_plural: "valdenští"
 waldensian_rite_desc: "Ritus bosých žebravých kazatelů, kteří hlásají, že i laici mají právo kázat Písmo, že církevní instituce nemají výhradní nárok na Boží milost a že křesťané nemají vlastnit majetek ani se chápat zbraní."
 lollard_rite: "$lollard$"
 lollard_rite_name: "Lollardi"
 lollard_rite_adj: "lollardský"
 lollard_rite_adherent: "lollard"
 lollard_rite_adherent_plural: "lollardi"
 lollard_rite_desc: "Reformní ritus prosazující užívání lidového jazyka, který odmítá okázalé obřady, transsubstanciaci, uctívání relikvií i bohatství duchovenstva. Bible se čte v lidovém jazyce a každý věřící je považován za kněze sám o sobě."
 hussite_rite: "$hussite$"
 hussite_rite_name: "Husité"
 hussite_rite_adj: "husitský"
 hussite_rite_adherent: "husita"
 hussite_rite_adherent_plural: "husité"
 hussite_rite_desc: "Český reformní ritus, který požaduje přijímání z kalicha i pro laiky, Písmo v lidovém jazyce a konec bohatství duchovenstva i prodeje odpustků. Jeho kazatelé se hojně opírají o Viklefovy argumenty a vroucí přesvědčení, že se Řím odchýlil od apoštolské cesty."
 joachimite_rite: "$joachimite$"
 joachimite_rite_name: "Joachimité"
 joachimite_rite_adj: "joachimitský"
 joachimite_rite_adherent: "joachimita"
 joachimite_rite_adherent_plural: "joachimité"
 joachimite_rite_desc: "Apokalyptický ritus, který rozděluje dějiny na tři věky: věk Otce, věk Syna a nadcházející věk Ducha svatého, jenž ukončí vládu institucionální církve a dá vzniknout novému kontemplativnímu řádu. Jeho stoupenci putují v apoštolské chudobě, káží na tržištích a s rozzářenýma očima vyhlížejí blížící se konec světa."
 iconoclast_rite: "$iconoclast$"
 iconoclast_rite_name: "Ikonoklasté"
 iconoclast_rite_adj: "ikonoklastický"
 iconoclast_rite_adherent: "ikonoklast"
 iconoclast_rite_adherent_plural: "ikonoklasté"
 iconoclast_rite_desc: "Obnovené starobylé východní hnutí odmítající náboženská vyobrazení, které odsuzuje uctívání obrazů jako plíživé modlářství a požaduje odstranění ikon z kostelů i domácností."
 bogomilist_rite: "$bogomilist$"
 bogomilist_rite_name: "Bogomilové"
 bogomilist_rite_adj: "bogomilský"
 bogomilist_rite_adherent: "bogomil"
 bogomilist_rite_adherent_plural: "bogomilové"
 bogomilist_rite_desc: "Slovanský dualistický ritus, jehož kořeny sahají ke knězi Bogomilovi. Jeho kazatelé putují bosí, odmítají náboženskou hierarchii i nošení zbraní a hlásají, že stvořitelem viditelného světa je Satan."
 paulician_rite: "$paulician$"
 paulician_rite_name: "Pavlikáni"
 paulician_rite_adj: "pavlikánský"
 paulician_rite_adherent: "pavlikán"
 paulician_rite_adherent_plural: "pavlikáni"
 paulician_rite_desc: "Bojovně založený dualistický ritus, který vznikl v Malé Asii. Jeho stoupenci pohrdají ikonami i zavedenou náboženskou hierarchií, cení si přímé četby Pavlových epištol a neváhají sáhnout po zbrani na obranu své čistoty."
 messalian_rite: "$messalian$"
 messalian_rite_name: "Messaliáni"
 messalian_rite_adj: "messaliánský"
 messalian_rite_adherent: "messalián"
 messalian_rite_adherent_plural: "messaliáni"
 messalian_rite_desc: "Esoterický asketický ritus, který považuje neustálou modlitbu za jedinou skutečně hodnotnou svátost. Jakmile je totiž démon přebývající v nitru věřícího vyhnán, žádný tělesný čin už tohoto věřícího nemůže poskvrnit."
 adoptionist_rite: "$adoptionist$"
 adoptionist_rite_name: "Adopcionisté"
 adoptionist_rite_adj: "adopcionistický"
 adoptionist_rite_adherent: "adopcionista"
 adoptionist_rite_adherent_plural: "adopcionisté"
 adoptionist_rite_desc: "Christologický ritus pocházející z Ibérie, který učí, že Kristus byl ve své lidské přirozenosti Božím adoptivním, nikoli vlastním Synem. Karolinská církev toto učení odsoudila jako kryptonestoriánství."
 pam_heresy_fervor_reset_component_1_desc: "Věřící se semkli proti rostoucí [Concept('rite_divergence','odlišnosti')|E]"
 pam_heresy_fervor_reset_component_2_desc: "Věřící se semkli proti novému schizmatickému [Concept('rite','ritu')|E]"
 pam_heresy_fervor_reset_component_3_desc: "Věřící se semkli proti obrodě kacířství"
 heresy_light.0010.t: "Kacířský odklon"
 heresy_light.0010.desc.intro.descriptor_archbishop: "[Select_CString(founder.IsFemale,founder.GetCulture.Custom('CZ_Adjective_aa'),founder.GetCulture.Custom('CZ_Adjective_yy'))|U] [Select_CString(founder.IsFemale,'arcibiskupka','arcibiskup')] [founder.GetFirstName] "
 heresy_light.0010.desc.intro.descriptor_ruler: "[founder.GetTitledFirstName|U] "
 heresy_light.0010.desc.opener.archbishopric: "[CZPrepZ(founder_clerical_title.GetNameNoTierNoTooltip)|l] [founder_clerical_title.Custom('CZ_LandedNameNoTier_G')] "
 heresy_light.0010.desc.opener.lands: "[CZPrepZ(founder.GetPrimaryTitle.GetNameNoTierNoTooltip)|l] [founder.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] "
 heresy_light.0010.desc.body.uneasy: "posouvá ritus [new_rite.GetName] stále dále od nauky, kterou zastává [source_rite.GetAdjective|l] ritus, "
 heresy_light.0010.desc.body.alarming: "nebezpečně vzdaluje ritus [new_rite.GetName] zavedeným zvyklostem, které zachovává [source_rite.GetAdjective|l] ritus, "
 heresy_light.0010.desc.body.dangerous: "mění ritus [new_rite.GetName] natolik, že v něm [source_rite.GetAdjective|l] ritus sotva ještě rozpoznává spřízněnou větev, "
 heresy_light.0010.desc.differing.tenet: "přičemž nejvýraznější změnou je [differing_tenet.GetBaseName|l]."
 heresy_light.0010.desc.differing.doctrine: "přičemž nejvýraznější změnou je [differing_doctrine.GetDescriptiveName(source_rite.GetFaith.Self)|l]."
 heresy_light.0010.desc.differing.fallback: "přičemž nové důrazy v učení jsou příliš nenápadné, než aby se daly shrnout jediným názvem."
 heresy_light.0010.desc.outro: "\n\nZatím to nejsou kacíři. K této hranici však už nemají daleko."
 heresy_light.0010.desc.outro.own_rite: "\n\nZatím nejsme kacíři. K této hranici však už nemáme daleko."
 heresy_light.0010.a: "Budu se modlit za správné vedení."
 heresy_light.0010.b: "Ritus [new_rite.GetNameNoTooltip] v sobě skrývá moudrost. Vydám se jeho cestou."
 heresy_light.0010.c: "To mi zavání kacířstvím..."
 heresy_light.0010.c.own_rite: "Tak tedy vpřed. Tato cesta je naše."
 heresy_light.notification.member.title: "Náš ritus se odklání"
 heresy_light.notification.member.tt: "[founder.GetTitledFirstName|U] odvádí ritus [new_rite.GetName] stále dále od tradice, kterou představuje [source_rite.GetAdjective|l] ritus."
 heresy_light.notification.hof.title: "Ritus na cestě ke kacířství"
 heresy_light.notification.hof.tt: "[founder.GetTitledFirstName|U] prudce odklání ritus [new_rite.GetName] od tradice, kterou představuje [source_rite.GetAdjective|l] ritus."
 heresy_light.notification.mainline.title: "Sousední ritus se odklání"
 heresy_light.notification.mainline.tt: "[founder.GetTitledFirstName|U] odvádí ritus [new_rite.GetName] stále dále od tradice, kterou představuje [source_rite.GetAdjective|l] ritus."
 heresy_dangerous_rite.0010.t: "Kacířský ritus"
 heresy_dangerous_rite.0010.desc.intro.descriptor_archbishop: "[Select_CString(founder.IsFemale,founder.GetCulture.Custom('CZ_Adjective_aa'),founder.GetCulture.Custom('CZ_Adjective_yy'))|U] [Select_CString(founder.IsFemale,'arcibiskupka','arcibiskup')] [founder.GetFirstName] "
 heresy_dangerous_rite.0010.desc.intro.descriptor_ruler: "[founder.GetTitledFirstName|U] "
 heresy_dangerous_rite.0010.desc.opener.archbishopric: "[CZPrepZ(founder_clerical_title.GetNameNoTierNoTooltip)|l] [founder_clerical_title.Custom('CZ_LandedNameNoTier_G')] "
 heresy_dangerous_rite.0010.desc.opener.lands: "[CZPrepZ(founder.GetPrimaryTitle.GetNameNoTierNoTooltip)|l] [founder.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] "
 heresy_dangerous_rite.0010.desc.body.alarming: "se ostře rozchází s tím, co hlásá [source_rite.GetAdjective|l] ritus, a vyhlašuje nový ritus [new_rite.GetName] — "
 heresy_dangerous_rite.0010.desc.body.severe: "odmítá téměř vše, co zastává [source_rite.GetAdjective|l] ritus, kromě samotného názvu, a vyhlašuje nový ritus [new_rite.GetName] — "
 heresy_dangerous_rite.0010.desc.differing.tenet: "nejodvážnějším z nových nařízení je zásada [differing_tenet.GetBaseName|l], kterou kazatelé otevřeně hlásají."
 heresy_dangerous_rite.0010.desc.differing.doctrine: "nejodvážnějším z nových nařízení je doktrína [differing_doctrine.GetDescriptiveName(source_rite.GetFaith.Self)|l], kterou kazatelé otevřeně hlásají."
 heresy_dangerous_rite.0010.desc.differing.fallback: "nových nařízení je tolik, že je nelze shrnout jedinou větou."
 heresy_dangerous_rite.0010.desc.outro: "\n\nKazatelé se rozcházejí po celém panství — [origin_faith.ReligiousText] v jedné ruce, pochodně v druhé. Starší, pro které je [origin_faith.GetName] jedinou pravou vírou, pro to nebudou mít jediné vlídné slovo.\n\nZárodek kacířství dostal písemnou podobu a jeho poselství zaznělo z kazatelen. Tam, kde kázání nestačí, odpoví meč a oheň."
 heresy_dangerous_rite.0010.a: "Ať to tedy začne."
 heresy_dangerous_rite.0010.c: "To mi zavání kacířstvím..."
 heresy_dangerous_rite.spread.title: "Nový ritus se šíří"
 heresy_historical.0050.t.lollard.first: "Viklefovo kacířství"
 heresy_historical.0050.t.hussite.first: "Husovo kacířství"
 heresy_historical.0050.t.joachimite.first: "Jáchymovo kacířství"
 heresy_historical.0050.t.cathar.first: "Katarské kacířství"
 heresy_historical.0050.t.waldensian.first: "Valdovo kacířství"
 heresy_historical.0050.t.bogomilist.first: "Bogomilovo kacířství"
 heresy_historical.0050.t.resurgence: "[heresy_faith.Custom('CZ_AdjectiveNoTooltip_ee')|U] kacířství se vrací"
 heresy_historical.0050.t.fallback: "Nové [heresy_faith.Custom('CZ_AdjectiveNoTooltip_ee')|l] kacířství"
 heresy_historical.0050.desc.nearby.first: "Už nelze přehlížet, jak [founder.GetTitledFirstName] hlásá [CZFaithAdjDecline(heresy_faith,'é')|l] učení [CZPrepV(epicenter_ruler.GetCapitalLocation.GetTitle.GetNameNoTooltip)|l] [epicenter_ruler.GetCapitalLocation.GetTitle.Custom('CZ_LandedName_L')], nedaleko od nás. Naši [origin_faith.PriestMalePlural|l] odsoudili [Select_CString(founder.IsFemale,'její','jeho')] učení z kazatelen, ale zdá se, že tím jen zvýšili jeho přitažlivost pro prosté věřící.\n\n"
 heresy_historical.0050.desc.nearby.resurgence: "[CZFaithAdjDecline(heresy_faith,'é')|U] hnutí znovu vzplálo [CZPrepV(epicenter_ruler.GetCapitalLocation.GetTitle.GetNameNoTooltip)|l] [epicenter_ruler.GetCapitalLocation.GetTitle.Custom('CZ_LandedName_L')], nedaleko míst, kde kdysi mocně planulo. Když [founder.GetTitledFirstName] promlouvá, dvořané i prostý lid si stále připomínají hříšné svody tohoto kacířství.\n\n"
 heresy_historical.0050.desc.distant.first: "Poutníci a kupci nám přinášejí zprávy o [CZFaithAdjDecline(heresy_faith,'ém')|l] hnutí, které roznítilo mysl lidí daleko od nás, [CZPrepV(epicenter_ruler.GetCapitalLocation.GetTitle.GetNameNoTooltip)|l] [epicenter_ruler.GetCapitalLocation.GetTitle.Custom('CZ_LandedName_L')]. Slova, která káže [founder.GetTitledFirstName], si pomalu razí cestu až k našim branám.\n\n"
 heresy_historical.0050.desc.distant.resurgence: "Přicházejí zprávy, že [CZFaithAdjDecline(heresy_faith,'é')|l] hnutí znovu vzplanulo daleko od nás, [CZPrepV(epicenter_ruler.GetCapitalLocation.GetTitle.GetNameNoTooltip)|l] [epicenter_ruler.GetCapitalLocation.GetTitle.Custom('CZ_LandedName_L')]. Zdá se, že [founder.GetTitledFirstName] se nebojí pekelných plamenů ani církevních odsudků a výnosů namířených proti [Select_CString(founder.IsFemale,'jejímu','jeho')] rouhačskému učení.\n\n"
 heresy_historical.0050.desc.insider.first: "[CZPrepV(epicenter_ruler.GetCapitalLocation.GetTitle.GetNameNoTooltip)|U] [epicenter_ruler.GetCapitalLocation.GetTitle.Custom('CZ_LandedName_L')] [founder.GetTitledFirstName] směle hlásá [CZFaithAdjDecline(heresy_faith,'é')|l] učení. Šepot minulých let se konečně proměnil v kázání, které může slyšet celý svět.\n\n"
 heresy_historical.0050.desc.insider.resurgence: "[founder.GetTitledFirstName|U] znovu rozněcuje [CZFaithAdjDecline(heresy_faith,'é')|l] hnutí [CZPrepV(epicenter_ruler.GetCapitalLocation.GetTitle.GetNameNoTooltip)|l] [epicenter_ruler.GetCapitalLocation.GetTitle.Custom('CZ_LandedName_L')]. Svět se opět probouzí k našemu svatému světlu a božská pravda je znovu hlásána!\n\n"
 heresy_historical.0050.gloss.lollard: "Hlásá Písmo v jazyce prostého lidu, duchovenstvo bez pozemkového majetku a bohoslužby zbavené okázalých obřadů."
 heresy_historical.0050.gloss.hussite: "Hlásá přijímání pod obojí i pro laiky, Písmo v češtině a církev zbavenou hodností získaných za peníze."
 heresy_historical.0050.gloss.joachimite: "Hlásá blížící se věk Ducha svatého, v němž římské kněžské řády ustoupí rozjímavé církvi chudých."
 heresy_historical.0050.gloss.cathar: "Hlásá přísný dualismus, označuje svět za dílo zlého boha a římskou církev za nevěstku babylonskou."
 heresy_historical.0050.gloss.waldensian: "Hlásá chudou církev bosých laických kazatelů, odmítá přísahy i válčení a požaduje, aby Písmo patřilo všem."
 heresy_historical.0050.gloss.bogomilist: "Hlásá slovanský dualismus: svět patří Satanovi a duši může vykoupit jedině nepřetržitá modlitba."
 heresy_historical.0050.gloss.paulician: "Hlásá starobylé východní učení plné náboženského zápalu — dualismus, obrazoborectví a neúprosné lpění na Pavlových listech. [Select_CString(founder.IsFemale,'Její','Jeho')] stoupenci dávají přednost meči před hranicí."
 heresy_historical.0050.gloss.iconoclast: "Hlásá znovuzrozené obrazoborectví: každé malované vyobrazení Krista i pozlacený obraz světce jsou modly a druhý nicejský koncil představoval omyl, za který dosud nikdo nečinil pokání."
 heresy_historical.0050.gloss.adoptionist: "Oživuje starý iberský spor: podle [Select_CString(founder.IsFemale,'jejího','jeho')] učení byl Kristus ve své lidské přirozenosti přijat za Božího syna."
 heresy_historical.0050.gloss.messalian: "Hlásá nepřetržitou modlitbu namísto svátostí a učení, že v nitru každého člověka přebývá démon, kterého žádný kněz nedokáže vyhnat."
 heresy_historical.0050.gloss.generic: "Hlásá učení o zásadní náboženské obnově, zakořeněné v [CZFaithAdjDecline(heresy_faith,'é')|l] tradici."
 heresy_historical.0050.history.lollard: "\n\nVše začalo v Oxfordu, kde mistři a studenti zpochybňovali kanonické právo. Nyní se jejich překlady Písma šíří z klášterů do měst takovou rychlostí, že je žádný kněz nedokáže zastavit."
 heresy_historical.0050.history.hussite: "\n\nToto hnutí se zrodilo v pražské Betlémské kapli, kde se začalo kázat v českém jazyce a kde byl posvátný kalich poprvé přiložen také ke rtům laiků."
 heresy_historical.0050.history.joachimite: "\n\nVše začalo v kalábrijském klášteře, kde jeden opat četl Zjevení Janovo jako kalendář a odpočítával roky do příchodu nového věku. Jeho výpočty převzali potulní žebraví kazatelé a dnes se o nich hovoří na tržištích po celé zemi."
 heresy_historical.0050.history.cathar: "\n\nTato víra pronikla z Balkánu na západ a nyní ji v Languedoku vyznávají tkalci i vikomti. Její duchovní vůdci, dokonalí známí jako perfecti, putují bosí ve dvojicích a pečují o nemocné a umírající."
 heresy_historical.0050.history.waldensian: "\n\nVše začalo u lyonského kupce, který rozdal své bohatství chudým a kázal v ulicích. Nyní ti, které inspiroval, putují bosí přes vysoké hory a šíří Boží slovo i mezi těmi nejubožejšími."
 heresy_historical.0050.history.bogomilist: "\n\nToto hnutí se poprvé probudilo, když venkovští kněží začali učit, že chléb a víno nejsou ničím jiným než chlebem a vínem. Slovanský venkovský lid se tohoto zjevení pevně drží a žádná patriarchova klatba jej dosud nedokázala odradit."
 heresy_historical.0050.history.paulician: "\n\nToto hnutí, založené na přísném výkladu Pavlových listů, je starší než kterákoli katedrála na Bosporu. V Tephrike na Arménské vysočině pavlikáni kdysi vzkvétali, než Byzantská říše jejich stát zničila."
 heresy_historical.0050.history.iconoclast: "\n\nDvakrát říše odstranila ze svých kostelů malovaná vyobrazení Krista i pozlacené obrazy světců a dvakrát se tyto ikony vrátily. Nyní se otázka modlářství znovu dostává na pořad dne."
 heresy_historical.0050.history.adoptionist: "\n\nV iberském pohraničí někteří biskupové učí, že tesařův syn byl přijat do Boží slávy, nikoli že se do ní narodil. Ve Frankfurtu i Cáchách bylo toto učení odsouzeno, místní si však stále kladou otázku, kde skutečně leží pravda."
 heresy_historical.0050.history.messalian: "\n\nToto hnutí povstalo v mezopotámských pouštích, mezi potulnými mnichy, kteří se modlili bez spánku a věřili, že každá duše ukrývá démona, kterého žádný kněz nedokáže vyhnat. Ačkoli byli odsouzeni v Efesu, věřící vytrvávají dodnes."
 heresy_historical.0050.history.generic: "\n\nKaždá doba zažehne podobný plamen — kláštery, které porušily svá pravidla, kazatele, kteří vyšli z katedrál a už se nikdy nevrátili. A nyní je toto hnutí na pochodu."
 heresy_historical.0050.a: "Jejich věc je spravedlivá. Přijmu ji za svou."
 heresy_historical.0050.b: "Takové přesvědčení... Kéž bych na jejich místě [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] být já."
 heresy_historical.0050.c: "Kacíři..."
 heresy_historical.0050.c.insider: "Vytrváme. Naše hnutí sílí."
 heresy_historical.spread.title: "Kacířství se šíří"
