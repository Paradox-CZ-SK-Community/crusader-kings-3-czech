 heresy_dangerous_rite.0010.t: "Kacířský ritus" # todo: NEW TRANSLATION
 heresy_dangerous_rite.0010.desc.intro.descriptor_archbishop: "[founder.GetCulture.GetName] arcibiskup [founder.GetFirstName] " # todo: NEW TRANSLATION
 heresy_dangerous_rite.0010.desc.intro.descriptor_ruler: "[founder.GetTitledFirstName] " # todo: NEW TRANSLATION
 heresy_dangerous_rite.0010.desc.opener.archbishopric: "[CZPrepZ(founder_clerical_title.GetNameNoTierNoTooltip)] [founder_clerical_title.Custom('CZ_LandedNameNoTier_G')] " # todo: NEW TRANSLATION
 heresy_dangerous_rite.0010.desc.opener.lands: "z [founder.GetPrimaryTitle.GetBaseNameNoTier] " # todo: NEW TRANSLATION
 heresy_dangerous_rite.0010.desc.body.alarming: "se ostře rozešla s [source_rite.GetAdjective] a vyhlásila [new_rite.GetName] — " # todo: NEW TRANSLATION
 heresy_dangerous_rite.0010.desc.body.severe: "se ve všem kromě jména odtrhla od [source_rite.GetAdjective] a vyhlásila [new_rite.GetName] — " # todo: NEW TRANSLATION
 heresy_dangerous_rite.0010.desc.differing.tenet: "nejodvážnější z nových nařízení, [differing_tenet.GetBaseName], se otevřeně hlásá." # todo: NEW TRANSLATION
 heresy_dangerous_rite.0010.desc.differing.doctrine: "nejodvážnější z nových nařízení, [differing_doctrine.GetDescriptiveName( source_rite.GetFaith.Self )], se otevřeně hlásá." # todo: NEW TRANSLATION
 heresy_dangerous_rite.0010.desc.differing.fallback: "nových nařízení je příliš mnoho, než aby se dala shrnout do jediné věty." # todo: NEW TRANSLATION
 heresy_dangerous_rite.0010.desc.outro: "\n\nKazatelé se rozcházejí po celé říši — v jedné ruce [origin_faith.ReligiousText], v druhé pochodně. Starší víry [origin_faith.GetName] k tomu neřeknou jediné vlídné slovo.\n\nMožná hereze byla zaznamenána písmem a vykřičena z kazatelny; tam, kde kázání nestačí, promluví meč a oheň." # todo: NEW TRANSLATION
 heresy_dangerous_rite.0010.a: "Ať to začne." # todo: NEW TRANSLATION
 heresy_dangerous_rite.0010.c: "To mi zavání kacířstvím..." # todo: NEW TRANSLATION
 heresy_dangerous_rite.spread.title: "Nový ritus se šíří" # todo: NEW TRANSLATION
 heresy_historical.0050.t.lollard.first: "Vikleфovo kacířství" # todo: NEW TRANSLATION
 heresy_historical.0050.t.hussite.first: "Husovo kacířství" # todo: NEW TRANSLATION
 heresy_historical.0050.t.joachimite.first: "Jáchymovo kacířství" # todo: NEW TRANSLATION
 heresy_historical.0050.t.cathar.first: "Katarské kacířství" # todo: NEW TRANSLATION
 heresy_historical.0050.t.waldensian.first: "Valdovo kacířství" # todo: NEW TRANSLATION
 heresy_historical.0050.t.bogomilist.first: "Bogomilovo kacířství" # todo: NEW TRANSLATION
 heresy_historical.0050.t.resurgence: "Kacířství [heresy_faith.GetAdjectiveNoTooltip] se vrací" # todo: NEW TRANSLATION
 heresy_historical.0050.t.fallback: "Kacířství [heresy_faith.GetAdjectiveNoTooltip]" # todo: NEW TRANSLATION
 heresy_historical.0050.desc.nearby.first: "Už nelze přehlížet [founder.GetTitledFirstName], když [founder.GetSheHe] káže [heresy_faith.GetAdjective] učení v nedalekém [epicenter_ruler.GetCapitalLocation.GetTitle.GetName]. Naši [origin_faith.PriestMalePlural] z kazatelen odsoudili [founder.GetHerHis] učení, což zřejmě jen zvýšilo jeho přitažlivost pro prosté muže a ženy církve.\n\n" # todo: NEW TRANSLATION
 heresy_historical.0050.desc.nearby.resurgence: "[heresy_faith.GetAdjective] učení znovu vzplálo [CZPrepV(epicenter_ruler.GetCapitalLocation.GetTitle.GetNameNoTooltip)] [epicenter_ruler.GetCapitalLocation.GetTitle.Custom('CZ_LandedName_L')], nedaleko místa, kde kdysi jasně hořelo. Když [founder.GetTitledFirstName] promlouvá, dvořané i prostý lid si stále vybavují hříšné vábení kacířství.\n\n" # todo: NEW TRANSLATION
 heresy_historical.0050.desc.distant.first: "Poutníci a kupci nám přinášejí zprávy o [heresy_faith.GetAdjective] učení, které roznítilo mysli lidí ve vzdáleném [epicenter_ruler.GetCapitalLocation.GetTitle.GetName]. Kázání [founder.GetTitledFirstName] si pomalu razí cestu k našim branám.\n\n" # todo: NEW TRANSLATION
 heresy_historical.0050.desc.distant.resurgence: "Přicházejí zprávy, že [heresy_faith.GetAdjective] učení znovu vzplálo ve vzdáleném [epicenter_ruler.GetCapitalLocation.GetTitle.GetName]. Zdá se, že [founder.GetTitledFirstName] se nebojí plamenů zatracení ani cenzur a výnosů namířených proti [founder.GetHerHis] rouhačství.\n\n" # todo: NEW TRANSLATION
 heresy_historical.0050.desc.insider.first: "[CZPrepV(epicenter_ruler.GetCapitalLocation.GetTitle.GetNameNoTooltip)|U] [epicenter_ruler.GetCapitalLocation.GetTitle.Custom('CZ_LandedName_L')] [founder.GetTitledFirstName] směle hlásá [heresy_faith.GetAdjective] učení. Šeptanda z minulých let se konečně proměnila v kázání, které může slyšet celý svět.\n\n" # todo: NEW TRANSLATION
 heresy_historical.0050.desc.insider.resurgence: "[founder.GetTitledFirstName] znovu rozdmýchává [heresy_faith.GetAdjective] učení [CZPrepV(epicenter_ruler.GetCapitalLocation.GetTitle.GetNameNoTooltip)] [epicenter_ruler.GetCapitalLocation.GetTitle.Custom('CZ_LandedName_L')]. Svět znovu procitá do světla naší svaté víry a božská pravda je opět hlásána!\n\n" # todo: NEW TRANSLATION
 heresy_historical.0050.gloss.lollard: "[founder.GetSheHe|U] káže o Písmu v obecném jazyce, o žádné půdě pro kněžstvo a o žádném divadle u oltáře." # todo: NEW TRANSLATION
 heresy_historical.0050.gloss.hussite: "[founder.GetSheHe|U] káže o přijímání pod obojí pro laiky, o Písmu v češtině a o církvi zbavené zakoupených hodností." # todo: NEW TRANSLATION
 heresy_historical.0050.gloss.joachimite: "[founder.GetSheHe|U] káže o blížícím se Věku Ducha, v němž římské kněžské řády ustoupí rozjímavé církvi chudých." # todo: NEW TRANSLATION
 heresy_historical.0050.gloss.cathar: "[founder.GetSheHe|U] káže přísný dualismus: svět označuje za dílo zlého boha a římskou církev za nevěstku babylonskou." # todo: NEW TRANSLATION
 heresy_historical.0050.gloss.waldensian: "[founder.GetSheHe|U] káže o chudé církvi bosých laických kazatelů: zříkají se přísah i válčení a Písmo náleží všem." # todo: NEW TRANSLATION
 heresy_historical.0050.gloss.bogomilist: "[founder.GetSheHe|U] káže slovanský dualismus: svět patří Satanovi a duši lze získat zpět jen neustálou modlitbou." # todo: NEW TRANSLATION
 heresy_historical.0050.gloss.paulician: "[founder.GetSheHe|U] káže staré východní učení — dualismus, obrazoborectví a přísný výklad Pavla. [founder.GetHerHis|U] následovníci dávají přednost meči před kůlem." # todo: NEW TRANSLATION
 heresy_historical.0050.gloss.iconoclast: "[founder.GetSheHe|U] káže obnovené obrazoborecké učení: každý malovaný Kristus a pozlacený světec je modla a druhý nikajský koncil byl omyl, za nějž nikdy nebylo učiněno pokání." # todo: NEW TRANSLATION
 heresy_historical.0050.gloss.adoptionist: "[founder.GetSheHe|U] obnovuje iberský argument: v [founder.GetHerHis] lidství byl Kristus adoptován." # todo: NEW TRANSLATION
 heresy_historical.0050.gloss.messalian: "[founder.GetSheHe|U] káže nekonečnou modlitbu namísto svátostí a tvrdí, že v člověku sídlí démon, kterého žádný kněz nedokáže vyhnat." # todo: NEW TRANSLATION
 heresy_historical.0050.gloss.generic: "[founder.GetSheHe|U] káže přísné učení o obnově, zakořeněné v tradici [heresy_faith.GetAdjective] víry." # todo: NEW TRANSLATION
 heresy_historical.0050.history.lollard: "\n\nVše začalo v Oxfordu, kde mistři a studenti zpochybňovali kanonické právo. Jejich překlady Písma se nyní šíří z klášterů do měst rychlostí, kterou žádný kněz nedokáže zastavit." # todo: NEW TRANSLATION
 heresy_historical.0050.history.hussite: "\n\nToto hnutí začalo v pražské Betlémské kapli, kde poprvé zazněla kázání v českém jazyce a laikům byl poprvé nabídnut svatý kalich." # todo: NEW TRANSLATION
 heresy_historical.0050.history.joachimite: "\n\nVše začalo v kalábrijském klášteře, kde opat vykládal Zjevení jako kalendář a počítal roky do příchodu nového věku. Tohoto počítání se chopili potulní žebraví mniši a nyní se o něm mluví na trzích po celé zemi." # todo: NEW TRANSLATION
 heresy_historical.0050.history.cathar: "\n\nTato víra přišla ze západu z Balkánu a nyní ji v Languedocu vyznávají tkalci i vikomti. Její duchovní vůdci, perfecti, chodí bosí ve dvojicích a pečují o nemocné a umírající." # todo: NEW TRANSLATION
 heresy_historical.0050.history.waldensian: "\n\nVše začalo lyonským kupcem, který rozdal své bohatství chudým a kázal v ulicích. Ti, které inspiroval, nyní chodí bosí vysokými horami a šíří Boží slovo mezi nejnižšími vrstvami." # todo: NEW TRANSLATION
 heresy_historical.0050.history.bogomilist: "\n\nToto hnutí poprvé vzplálo, když vesničtí kněží učili, že chléb a víno jsou prostě jen chléb a víno. Slovanský venkovský lid se tohoto zjevení drží a žádná patriarchova klatba ho dosud nepřesvědčila, aby se ho vzdal." # todo: NEW TRANSLATION
 heresy_historical.0050.history.paulician: "\n\nToto hnutí, založené na přísném výkladu Pavla, je starší než kterákoli katedrála na Bosporu. Pavlikáni kdysi vzkvétali v Tephrike v arménské vysočině, než jejich stát zničila Byzantská říše." # todo: NEW TRANSLATION
 heresy_historical.0050.history.iconoclast: "\n\nŘíše dvakrát zbavila své kostely malovaných Kristů a pozlacených světců a dvakrát se tyto ikony vrátily. Nyní znovu vyvstala otázka modlářství." # todo: NEW TRANSLATION
 heresy_historical.0050.history.adoptionist: "\n\nNěkteří biskupové v iberských pohraničních oblastech učí, že tesařův syn byl do slávy přijat, místo aby se v ní narodil. Frankfurt a Cáchy toto učení odsoudily, místní se však stále ptají, kde leží skutečná pravda." # todo: NEW TRANSLATION
 heresy_historical.0050.history.messalian: "\n\nToto hnutí povstalo v mezopotámských pouštích — potulní mniši se modlili bez spánku a tvrdili, že každá duše chová démona, kterého žádný kněz nedokáže vymítat. Věřící byli odsouzeni na efezském koncilu, přesto vytrvávají." # todo: NEW TRANSLATION
 heresy_historical.0050.history.generic: "\n\nKaždá doba zplodí podobný plamen — kláštery, které porušily svou řeholi, kazatele, kteří vyšli z katedrály a už se nevrátili. Toto hnutí je nyní na cestě." # todo: NEW TRANSLATION
 heresy_historical.0050.a: "Jejich věc je spravedlivá. Přijmu ji za svou." # todo: NEW TRANSLATION
 heresy_historical.0050.b: "Takové přesvědčení... Kéž bych ho měl i já." # todo: NEW TRANSLATION
