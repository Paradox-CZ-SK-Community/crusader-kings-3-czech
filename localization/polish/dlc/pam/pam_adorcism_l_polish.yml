l_polish:
 pam_curse_enemy_decision: "Proklít nepřítele" # todo: NEW TRANSLATION
 pam_curse_enemy_decision_desc: "#F Kdo je ten blázen, že se mi staví na odpor? Vyslovím jeho jméno před duchy a zahrnu ho všemi křivdami, urážkami i kletbami. Ať se směje, dokud může; jeho zúčtování přijde dost brzy.#!" # todo: NEW TRANSLATION
 pam_curse_enemy_decision_tooltip: "Proveďte rituál proti rivalovi nebo protivníkovi v jedné ze svých [wars|E]" # todo: NEW TRANSLATION
 pam_curse_enemy_decision_confirm: "Zahájit obřad" # todo: NEW TRANSLATION
 pam_curse_enemy_decision_valid_target: "Máte žijícího dospělého [rival|E], [nemesis|E] nebo nepřítele ve válce" # todo: NEW TRANSLATION
 pam_curse_enemy_decision_selected_target_valid: "Váš vybraný nepřítel je stále žijící dospělý [rival|E], [nemesis|E] nebo nepřítel ve válce" # todo: NEW TRANSLATION
 pam_curse_enemy_decision_no_item_selected: "Není vybrán žádný nepřítel" # todo: NEW TRANSLATION
 pam_seek_war_aid_decision: "Vyhledat pomoc ve válce" # todo: NEW TRANSLATION
 pam_seek_war_aid_decision_desc: "#F Válka prověřuje víc než zbraně a počty. Obrátím se na duchy s prosbou o vhled, sílu či výdrž, abych svou věc dokázal prosadit v nadcházejících zkouškách.#!" # todo: NEW TRANSLATION
 pam_seek_war_aid_decision_tooltip: "Požádejte duchy o pomoc ve svých současných válkách" # todo: NEW TRANSLATION
 pam_seek_war_aid_decision_confirm: "Přivolat duchy" # todo: NEW TRANSLATION
 pam_adorcism_events.0001.t: "Jméno vyslovené před duchy" # todo: NEW TRANSLATION
 pam_adorcism_events.0001.desc: "Na odlehlém místě ryji [pam_adorcism_curse_target.GetTitledFirstNamePossessive] jméno do země a nahlas vyslovuji všechny křivdy. Obřad nemůže lámat kosti ani nechat uschnout úrodu, ale o to v něm nejde.\n\nKdyž vstávám, můj hněv se proměnil v odhodlání. Každá pověst o [pam_adorcism_curse_target.GetHerHim] mi teď připadá jako nitka, za kterou stačí zatáhnout." # todo: NEW TRANSLATION
 pam_adorcism_events.0001.a: "Můj záměr je jasný." # todo: NEW TRANSLATION
 pam_adorcism_events.0002.opening: "[pam_adorcism_curser.Custom2('AppropriateGreetingNegative', ROOT.Char)]" # todo: NEW TRANSLATION
 pam_adorcism_events.0002.desc.intro: "[pam_adorcism_curser.Custom2('NegativeSupplimentaryGreeting', ROOT.Char)]" # todo: NEW TRANSLATION
 pam_adorcism_events.0002.desc.christian: "\n\n[pam_adorcism_curser.Custom('christian_curse')|U], vyslovil jsem tvé jméno před duchy a uvalil na tebe kletbu. Až tě potká neštěstí, vzpomeň si, že jsem je přivolal svou vůlí." # todo: NEW TRANSLATION
 pam_adorcism_events.0002.desc.default: "\n\nVyslovil jsem tvé jméno před duchy a uvalil na tebe kletbu. Až tě potká neštěstí, vzpomeň si, že jsem je přivolal svou vůlí." # todo: NEW TRANSLATION
 pam_adorcism_events.0002.a: "Ať někdo rychle přivede [ROOT.Char.GetFaith.PriestNeuter]!" # todo: NEW TRANSLATION
 pam_adorcism_events.0002.a.flavor: "Kletba hlodá ve vašich myšlenkách a každý stín vám připadá jako zlé znamení." # todo: NEW TRANSLATION
 pam_adorcism_events.0101.t: "Rada z neviditelného světa" # todo: NEW TRANSLATION
 pam_adorcism_events.0101.desc: "Za posledním táborovým ohněm přináším oběť a naslouchám, zatímco zvuky vojska za mnou pomalu utichají. Vítr víří prachem, ale nepřináší žádný srozumitelný hlas. Rituál mi přesto pomáhá utřídit si myšlenky.\n\nMusím se rozhodnout, o jakou pomoc pro nadcházející tažení požádám." # todo: NEW TRANSLATION
 pam_adorcism_events.0101.a: "Ukažte mi cestu k vítězství." # todo: NEW TRANSLATION
 pam_adorcism_events.0101.b: "Propůjčte sílu mé paži s mečem." # todo: NEW TRANSLATION
 pam_adorcism_events.0101.c: "Dopřejte mému vojsku výdrž." # todo: NEW TRANSLATION
 pam_adorcism_curse_focus_modifier: "Usměrněný hněv" # todo: NEW TRANSLATION
 pam_adorcism_curse_focus_modifier_desc: "Tato postava pojmenovala terč svého hněvu a rituálem jej obrátila navenek." # todo: NEW TRANSLATION
 pam_adorcism_ill_omen_modifier: "Poznamenán zlým znamením" # todo: NEW TRANSLATION
 pam_adorcism_ill_omen_modifier_desc: "Členové této postavy obřadu na ni po pověstech o kletbě pohlížejí s podezřením." # todo: NEW TRANSLATION
 pam_adorcism_curse_anxiety_modifier: "Obavy z kletby" # todo: NEW TRANSLATION
 pam_adorcism_curse_anxiety_modifier_desc: "Tato postava se nedokáže zbavit myšlenky, že každé nadcházející neštěstí na ni přivolala kletba." # todo: NEW TRANSLATION
 pam_adorcism_battle_guidance_modifier: "Strategie vedená duchy" # todo: NEW TRANSLATION
 pam_adorcism_battle_guidance_modifier_desc: "Tato postava věří, že jí duchové zjevili příznivá znamení pro bitvu." # todo: NEW TRANSLATION
 pam_adorcism_personal_vigor_modifier: "Síla propůjčená duchy" # todo: NEW TRANSLATION
 pam_adorcism_personal_vigor_modifier_desc: "Důvěra v rituál dodává této postavě sílu v osobním boji." # todo: NEW TRANSLATION
 pam_adorcism_campaign_endurance_modifier: "Vojsko podporované duchy" # todo: NEW TRANSLATION
 pam_adorcism_campaign_endurance_modifier_desc: "Armády této postavy vytrvávají v dlouhých taženích s obnoveným odhodláním." # todo: NEW TRANSLATION
