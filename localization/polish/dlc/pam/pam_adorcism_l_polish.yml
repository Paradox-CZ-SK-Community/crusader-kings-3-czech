l_polish:
 pam_curse_enemy_decision: "Proklít nepřítele"
 pam_curse_enemy_decision_desc: "#F Kdo se to opovažuje postavit proti mně? Před duchy vyslovím jméno svého nepřítele a vychrlím všechny křivdy, urážky i kletby, které se ve mně nahromadily. Ať se směje, dokud může. Čas zúčtování se blíží.#!"
 pam_curse_enemy_decision_tooltip: "Proveď obřad proti sokovi nebo protivníkovi v některé ze svých [Concept('wars','válek')|E]"
 pam_curse_enemy_decision_confirm: "Zahájit obřad"
 pam_curse_enemy_decision_valid_target: "Máš žijícího dospělého [Concept('rival','soka')|E], [Concept('nemesis','úhlavního nepřítele')|E] nebo nepřítele ve válce"
 pam_curse_enemy_decision_selected_target_valid: "Vybraný cíl je stále naživu, je dospělý a je [Concept('rival','sokem')|E], [Concept('nemesis','úhlavním nepřítelem')|E] nebo protivníkem ve válce"
 pam_curse_enemy_decision_no_item_selected: "Není vybrán žádný nepřítel"
 pam_seek_war_aid_decision: "Požádat o pomoc ve válce"
 pam_seek_war_aid_decision_desc: "#F Válka neprověřuje jen sílu zbraní a počet vojáků. Požádám duchy o prozíravost, sílu či vytrvalost, aby má věc obstála ve zkouškách, které mě čekají.#!"
 pam_seek_war_aid_decision_tooltip: "Požádej duchy o pomoc ve svých probíhajících válkách"
 pam_seek_war_aid_decision_confirm: "Vzývat duchy"
 pam_adorcism_events.0001.t: "Jméno před duchy"
 pam_adorcism_events.0001.desc: "Na odlehlém místě vyrývám do země jméno [pam_adorcism_curse_target.Custom('CZ_TitledFirstName_G')] a nahlas vypočítávám všechny křivdy. Tento obřad nedokáže lámat kosti ani nechat uvadnout úrodu, ale o to mi ani nejde.\n\nKdyž se zvedám, můj hněv už ochladl a proměnil se v odhodlání. Každá zvěst, která se o [Select_CString(pam_adorcism_curse_target.IsFemale,'ní','něm')] šíří, mi teď připadá jako nit, za kterou stačí zatáhnout."
 pam_adorcism_events.0001.a: "Můj záměr je jasný."
 pam_adorcism_events.0002.opening: "[pam_adorcism_curser.Custom2('AppropriateGreetingNegative', ROOT.Char)|U]"
 pam_adorcism_events.0002.desc.intro: "[pam_adorcism_curser.Custom2('NegativeSupplimentaryGreeting', ROOT.Char)|U]"
 pam_adorcism_events.0002.desc.christian: "\n\n[pam_adorcism_curser.Custom('christian_curse')|U], [Select_CString(pam_adorcism_curser.IsFemale,'vyslovila','vyslovil')] jsem tvé jméno před duchy a [Select_CString(pam_adorcism_curser.IsFemale,'uvalila','uvalil')] na tebe kletbu. Až tě potká neštěstí, pamatuj, že je přivolala má vůle."
 pam_adorcism_events.0002.desc.default: "\n\n[Select_CString(pam_adorcism_curser.IsFemale,'Vyslovila','Vyslovil')] jsem tvé jméno před duchy a [Select_CString(pam_adorcism_curser.IsFemale,'uvalila','uvalil')] na tebe kletbu. Až tě potká neštěstí, pamatuj, že je přivolala má vůle."
 pam_adorcism_events.0002.a: "Ať sem okamžitě přijde [ROOT.Char.GetFaith.PriestNeuter|l]!"
 pam_adorcism_events.0002.a.flavor: "Kletba ti hlodá v mysli a každý stín se zdá být zlým znamením."
 pam_adorcism_events.0101.t: "Rada neviditelných"
 pam_adorcism_events.0101.desc: "Za posledním táborovým ohněm přináším obětinu a naslouchám, zatímco hluk vojska za mými zády postupně utichá. Vítr víří prach, ale nepřináší žádný srozumitelný hlas. Obřad mi přesto pomáhá utřídit myšlenky.\n\nMusím se rozhodnout, o jakou pomoc duchů požádám pro nadcházející tažení."
 pam_adorcism_events.0101.a: "Ukažte mi cestu k vítězství."
 pam_adorcism_events.0101.b: "Propůjčte sílu mé paži, která třímá meč."
 pam_adorcism_events.0101.c: "Dodejte mému vojsku vytrvalost."
 pam_adorcism_curse_focus_modifier: "Usměrněný hněv"
 pam_adorcism_curse_focus_modifier_desc: "Tato postava pojmenovala cíl svého hněvu a prostřednictvím obřadu jej obrátila navenek."
 pam_adorcism_ill_omen_modifier: "Ve stínu zlého znamení"
 pam_adorcism_ill_omen_modifier_desc: "Po zvěstech o kletbě pohlížejí příslušníci tohoto ritu na tuto postavu s podezřením."
 pam_adorcism_curse_anxiety_modifier: "Strach z kletby"
 pam_adorcism_curse_anxiety_modifier_desc: "Tato postava se nedokáže zbavit myšlenky, že každé nadcházející neštěstí na ni bylo přivoláno kletbou."
 pam_adorcism_battle_guidance_modifier: "Strategie vedená duchy"
 pam_adorcism_battle_guidance_modifier_desc: "Tato postava věří, že jí duchové odhalili příznivá znamení pro bitvu."
 pam_adorcism_personal_vigor_modifier: "Síla propůjčená duchy"
 pam_adorcism_personal_vigor_modifier_desc: "Sebejistota získaná při obřadu dodává této postavě sílu v osobním boji."
 pam_adorcism_campaign_endurance_modifier: "Vojsko posilované duchy"
 pam_adorcism_campaign_endurance_modifier_desc: "Vojska této postavy díky obnovenému odhodlání vytrvávají i na dlouhých taženích."
