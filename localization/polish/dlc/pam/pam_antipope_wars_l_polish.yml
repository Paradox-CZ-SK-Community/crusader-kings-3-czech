l_polish:
 PAM_CHALLENGE_HOF_WAR_CB_NAME: "Vyzvat [Concept('head_of_faith','hlavu víry')|E]"
 pam_challenge_hof_cb: "$PAM_CHALLENGE_HOF_WAR_CB_NAME$"
 pam_challenge_hof_cb_victory_desc_attacker_sponsor: "[Concept('challenger_hof','Konkurenční hlava víry')|EU], kterou podporuješ, získá tituly [Concept('head_of_faith_possessive','hlavy víry')|E] a ritus [attacker.GetRite.GetName] se stane [Concept('mainline_rite','hlavním ritem')|E]."
 pam_challenge_hof_cb_victory_desc_attacker: "Získáš tituly [Concept('head_of_faith_possessive','hlavy víry')|E] a ritus [attacker.GetRite.GetName] se stane [Concept('mainline_rite','hlavním ritem')|E]."
 pam_challenge_hof_cb_victory_desc: "Úřadu [Concept('head_of_faith','hlavy víry')|E] se ujme [Concept('challenger_hof','konkurenční hlava víry')|E]."
 pam_challenge_hof_cb_white_peace_desc: "[defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer,'zůstáváš','zůstává')] [Concept('head_of_faith','hlavou víry')|E]."
 pam_challenge_hof_cb_defeat_desc_attacker: "Tvůj pokus vyzvat [Concept('head_of_faith','hlavu víry')|E] selhal."
 pam_challenge_hof_cb_defeat_desc: "$pam_challenge_hof_cb_defeat_desc_attacker$"
 msg_pam_challenge_hof_cb_invalidated_message: "Válka skončila: obránce již nezastává úřad [Concept('head_of_faith','hlavy víry')|E]."
 msg_pam_challenge_hof_cb_invalidated_no_challenger_message: "Válka skončila: o úřad hlavy víry již nikdo neusiluje."
 pam_antipope_sponsor_vassalize_hof_tt: "[new_hof.GetShortUIName|U] [Select_CString(new_hof.IsLocalPlayer,'podléháš','podléhá')] [sponsor.Custom('CZ_ShortUIName_D')] jako [Concept('vassal','vazal')|E]"
 PAM_ANTIKING_WAR_CB_NAME: "Sesadit [Concept('challenger_hof','konkurenční hlavu víry')|E]"
 pam_antiking_cb: "$PAM_ANTIKING_WAR_CB_NAME$"
 pam_antiking_cb_victory_desc_attacker: "Sesadíš [Concept('challenger_hof','konkurenční hlavu víry')|E], kterou [defender.GetShortUIName] [Select_CString(defender.IsLocalPlayer,'podporuješ','podporuje')], a získáš vděčnost [attacker.GetFaith.GetReligiousHead.Custom('CZ_ShortUIName_G')]."
 pam_antiking_cb_victory_desc_attacker_no_gratitude: "Sesadíš [Concept('challenger_hof','konkurenční hlavu víry')|E], kterou [defender.GetShortUIName] [Select_CString(defender.IsLocalPlayer,'podporuješ','podporuje')]."
 pam_antiking_cb_victory_desc: "[Concept('challenger_hof','Konkurenční hlava víry')|EU] je sesazena."
 pam_antiking_cb_white_peace_desc: "[Concept('challenger_hof','Konkurenční hlava víry')|EU] zůstává ve svém úřadu."
 pam_antiking_cb_defeat_desc_attacker: "Tvůj pokus sesadit [Concept('challenger_hof','konkurenční hlavu víry')|E] selhal."
 pam_antiking_cb_defeat_desc: "[Concept('challenger_hof','Konkurenční hlava víry')|EU] odolala pokusu o sesazení."
 msg_pam_antiking_cb_invalidated_message: "Válka skončila: obránce již nepodporuje [Concept('challenger_hof','konkurenční hlavu víry')|E]."
 pam_humiliation_cb_papabile_score_loss_tt: "U [defender.Custom('CZ_ShortUIName_G')] se [Concept('papabile_score','skóre papežské kandidatury')|E] sníží o #N -25#!"
 pam_humiliation_cb_papabile_score_loss_attacker_tt: "U [attacker.Custom('CZ_ShortUIName_G')] se [Concept('papabile_score','skóre papežské kandidatury')|E] sníží o #N -25#!"
 pam_clerical_disgrace_modifier: "Potupa duchovenstva"
 pam_clerical_disgrace_modifier_desc: "Tato postava utrpěla ponížení v náboženské válce, čímž se oslabilo její [Concept('candidate_score','skóre kandidáta')|E] při ucházení se o [Concept('clerical_titles','duchovní tituly')|E]."
 pam_clerical_disgrace_candidacy_penalty_desc: "Ponížení v náboženské válce"
 pam_antipope_events.0010.t: "Pokoření samozvané hlavy víry"
 pam_antipope_events.0010.desc.christian: "[pam_ch_hof_challenger.Custom('InsultAdjectiveGeneric')|U] [Select_CString(pam_ch_hof_challenger.IsFemale,'rozkolnice','rozkolník')] [pam_ch_hof_challenger.GetTitledFirstName] přede mnou klečí. Falešný titul [ROOT.Char.GetFaith.ReligiousHeadTitleName] je nyní minulostí.\n\nAni nyní se však nevzdává a prohlašuje: „Archa je tam, kde stojím já. Nikoli u tvých nohou.“\n\nZdá se, že [Select_CString(pam_ch_hof_challenger.IsFemale,'její','jeho')] jazyk stále slouží Satanovi."
 pam_antipope_events.0010.desc: "Samozvaná hlava víry [pam_ch_hof_challenger.GetTitledFirstName] přede mnou klečí. Falešný titul [ROOT.Char.GetFaith.ReligiousHeadTitleName] je nyní minulostí.\n\nAni nyní se však nevzdává a odpovídá: „Jsem tím, komu právem náleží titul [ROOT.Char.GetFaith.ReligiousHeadName]!“"
 pam_antipope_events.0010.a.christian: "Snad v [Select_CString(pam_ch_hof_challenger.IsFemale,'ní','něm')] vězeňská cela probudí stejnou kajícnost jako v Jonášovi."
 pam_antipope_events.0010.a: "Zavři [Select_CString(pam_ch_hof_challenger.IsFemale,'ji','ho')] do žaláře."
 pam_antipope_events.0010.b.christian: "Poprav [Select_CString(pam_ch_hof_challenger.IsFemale,'ji','ho')]. Pán pozná své."
 pam_antipope_events.0010.b: "Poprav [Select_CString(pam_ch_hof_challenger.IsFemale,'ji','ho')]. O ostatním rozhodne [ROOT.Char.GetFaith.HighGodName]."
 pam_antipope_events.0010.c: "Prokaž milosrdenství."
 pam_antipope_events.0010.d: "Ještě bude křičet, komu právem náleží titul [ROOT.Char.GetFaith.ReligiousHeadName]!"
 pam_challenge_hof_war_random_permanent_harm_tt: "Utrpí náhodné trvalé zranění"
 pam_antipope_events.0011.t: "Cena za podporu"
 pam_antipope_events.0011.desc.christian: "Peníze z měšce [pam_ch_hof_sponsor.Custom('CZ_TitledFirstName_G')] podnítily tento hanebný rozkol a pomohly proti ritu [ROOT.Char.GetRite.GetName] postavit konkurenční hlavu víry, která si nárokuje titul [ROOT.Char.GetFaith.ReligiousHeadName].\n\nPísmo nemá pro takové podporovatele pochopení: [Glossary('$pam_romans_1_32_english$|q','ROMANS_1_32_GLOSS')]\n\n[pam_ch_hof_sponsor.GetTitledFirstName|U] vzhlíží a vzdoruje až do konce: „Ty nejsi [ROOT.Char.GetFaith.ReligiousHeadName], ale [Select_CString(ROOT.Char.IsFemale,'falešná mniška','falešný mnich')]. Sestup, sestup, ať tě stihne zatracení na věky věků.“"
 pam_antipope_events.0011.desc: "Zlato [pam_ch_hof_sponsor.Custom('CZ_TitledFirstName_G')] vyneslo na výsluní konkurenční hlavu víry, která si nárokuje titul [ROOT.Char.GetFaith.ReligiousHeadName], a zaselo rozkol. [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip|U] se tak ocitli ve dvou znepřátelených táborech.\n\n[pam_ch_hof_sponsor.GetTitledFirstName|U] vzhlíží a pronáší: „Ty nejsi [ROOT.Char.GetFaith.ReligiousHeadName]. Jsi [Select_CString(ROOT.Char.IsFemale,'podvodnice','podvodník')].“"
 pam_antipope_events.0011.a: "Zabavím měšec, který tento rozkol financoval."
 pam_antipope_events.0011.b: "Poprav [Select_CString(pam_ch_hof_sponsor.IsFemale,'ji','ho')]. Podpora má svou cenu."
 pam_antipope_events.0011.c: "Hanba, která padla na rod [pam_ch_hof_sponsor.Custom('CZ_TitledFirstName_G')], je dostatečným trestem."
 pam_antipope_events.0011.d: "Bičuj [Select_CString(pam_ch_hof_sponsor.IsFemale,'ji','ho')], dokud tělo nepovolí."
 pam_romans_1_32_english: "Ti, kdo takové věci činí, zasluhují smrt... a přesto je nejen sami páchají, ale dokonce schvalují i ty, kdo je činí."
 ROMANS_1_32_GLOSS: "#weak Římanům 1,32, NRSVUE#!"
 pam_antipope_events.0012.t: "Rozsudek nad sesazenou hlavou víry"
 pam_antipope_events.0012.t.christian: "[Select_CString(pam_ch_hof_old_hof.IsFemale,'Rozsudek nad Satanovou služebnicí','Rozsudek nad Satanovým služebníkem')]"
 pam_antipope_events.0012.intro.christian: "Ritus [ROOT.Char.GetRite.GetName] nyní podléhá mé autoritě. [pam_ch_hof_old_hof.GetTitledFirstName] přede mnou klečí. [Select_CString(pam_ch_hof_old_hof.IsFemale,'Její','Jeho')] nárok na úřad [ROOT.Char.GetFaith.ReligiousHeadName] byl falešný."
 pam_antipope_events.0012.intro: "[ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip|U] nyní podléhají mé autoritě. [pam_ch_hof_old_hof.GetTitledFirstName] přede mnou klečí. [Select_CString(pam_ch_hof_old_hof.IsFemale,'Její','Jeho')] nárok na úřad [ROOT.Char.GetFaith.ReligiousHeadName] byl falešný."
 pam_antipope_events.0012.intro.sponsor: "Na trůnu nyní jako [ROOT.Char.GetFaith.ReligiousHeadName] sedí [pam_ch_hof_new_hof.GetFirstName]. Samozvaný uchvatitel, [pam_ch_hof_old_hof.GetTitledFirstName], přede mnou klečí."
 pam_antipope_events.0012.dialogue.christian: "\n\nAni nyní se však nevzdává a vzdorovitě chrlí slova: „Tvůj meč ti vydobyl stolec míru.“\n\n„Pán mi poskytl prostředky k naplnění svého plánu,“ odpovídám."
 pam_antipope_events.0012.dialogue: "\n\n[pam_ch_hof_old_hof.GetTitledFirstName|U] pronáší: „[Select_CString(ROOT.Char.IsFemale,'Zmocnila','Zmocnil')] ses toho mečem.“\n\n„A mečem si to také udržím,“ odpovídám."
 pam_antipope_events.0012.a: "Žalář možná zchladí tuto pýchu."
 pam_antipope_events.0012.b: "Dvě hlavy tvoří nestvůru. Jedna musí padnout."
 pam_antipope_events.0012.c: "Už bylo dost svárů. Nechť [pam_ch_hof_old_hof.GetTitledFirstName] odejde v pokoji."
 pam_antipope_events.0012.d: "Ještě bude křičet, komu právem náleží titul [ROOT.Char.GetFaith.ReligiousHeadName]!"
 pam_antipope_events.0014.t: "Soud nade mnou"
 pam_antipope_events.0014.intro.judge: "„Tímto zbavuji všechny [pam_ch_hof_judge.GetFaith.GetAdherentNamePlural|l] povinnosti poslouchat tě,“ prohlašuje [pam_ch_hof_judge.GetTitledFirstName]."
 pam_antipope_events.0014.intro.mercy.christian: "„Jdi a už nehřeš,“ pronáší [pam_ch_hof_judge.GetTitledFirstName]."
 pam_antipope_events.0014.intro.mercy: "„Jdi. A na tuto cestu se už nevracej,“ pronáší [pam_ch_hof_judge.GetTitledFirstName]."
 pam_antipope_events.0014.desc.condemned.christian: "\n\n[Select_CString(ROOT.Char.IsFemale,'Milovala','Miloval')] jsem spravedlnost a [Select_CString(ROOT.Char.IsFemale,'nenáviděla','nenáviděl')] nepravost. A proto nyní umírám."
 pam_antipope_events.0014.desc.condemned: "\n\nUmírám za to, co považuji za pravdu."
 pam_antipope_events.0014.desc.broken: "\n\n[pam_ch_hof_judge.GetTitledFirstName|U] a [Select_CString(pam_ch_hof_judge.IsFemale,'její','jeho')] muži se mi vysmívají, zatímco bičují mé tělo. Zbyla ze mě jen prázdná slupka, z níž už bylo vymláceno zrno."
 pam_antipope_events.0014.desc.captive.christian: "\n\nDali mi celu. Vždycky mi říkali, že svatému člověku, ať už je [Select_CString(ROOT.Char.IsFemale,'ženou','mužem')], stačí ke spokojenosti pouhá cela."
 pam_antipope_events.0014.desc.captive: "\n\nDali mi celu. Nic víc mi zřejmě nedopřejí."
 pam_antipope_events.0014.desc.spared.christian: "\n\nZdá se, že kameny zůstaly v jejich rukou a já smím svobodně odejít. Toto milosrdenství nesmím promarnit."
 pam_antipope_events.0014.desc.spared: "\n\nZdá se, že smím svobodně odejít. Toto milosrdenství nesmím promarnit."
 pam_antipope_events.0014.desc.generic: "\n\nRozsudek padl. O tom, co přijde dál, rozhoduji já."
 pam_antipope_events.0014.a: "Ať se na můj rod vzpomíná jako na věrný. [ROOT.Char.GetFaith.HighGodName|U] zná naši oddanost."
 pam_antipope_events.0014.b: "Z jejich rukou tuto krev už nic nesmyje."
 pam_antipope_events.0014.b.toast: "Poskvrňuje tě [GetModifier('pam_ch_hof_sacred_bloodguilt_modifier').GetName]"
 pam_antipope_events.0014.c: "Ochraň můj rod před touto hanbou."
 pam_antipope_events.0014.d: "Usmířím se s právoplatnou hlavou víry. Kéž [ROOT.Char.GetFaith.ReligiousHeadName] přijme mou pokoru."
 pam_antipope_events.0014.e: "Podlost, kterou mi [pam_ch_hof_judge.GetTitledFirstNameNoTooltip] [Select_CString(pam_ch_hof_judge.IsFemale,'předvedla','předvedl')], nyní obrátím proti [Select_CString(pam_ch_hof_judge.IsFemale,'ní','němu')]."
 pam_antipope_events.0014.e.tt: "$prelude_events.0040.c.tt$"
 pam_antipope_events.0014.f: "Budu putovat bosky, dokud nevykonám své pokání."
 pam_antipope_events.0015.opening: "[Select_CString(ROOT.Char.IsFemale,ROOT.Char.GetFaith.Custom('CZ_AdjectiveNoTooltip_ee'),ROOT.Char.GetFaith.Custom('CZ_AdjectiveNoTooltip_eemu'))|U] [ROOT.Char.Custom('CZ_TitledFirstNameNoTooltip_D')],"
 pam_antipope_events.0015.desc.defender_victory.christian: "Věz, že pokus rozvrátit autoritu hlavy víry byl rozdrcen. [ROOT.Char.GetFaith.ReligiousHeadName|U] si zachovává své postavení, úřad samozvance byl zrušen a ritus [ROOT.Char.GetRite.GetName] zůstává pevný. Ať žádný kníže ani prelát nepochybuje o tom, komu náleží jeho věrnost."
 pam_antipope_events.0015.desc.defender_victory: "Věz, že pokus rozvrátit autoritu hlavy víry byl rozdrcen. [ROOT.Char.GetFaith.ReligiousHeadName|U] si zachovává své postavení, úřad samozvance byl zrušen a [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip|l] zůstávají neochvějní. Ať žádný panovník nepochybuje o tom, komu náleží jeho věrnost."
 pam_antipope_events.0015.desc.attacker_victory.christian: "Věz, že válka o nejvyšší duchovní úřad skončila. Satanovo jho nad úřadem [ROOT.Char.GetFaith.ReligiousHeadTitleName] jsem zlomil a ritus [ROOT.Char.GetRite.GetName] se nyní bude řídit mými příkazy."
 pam_antipope_events.0015.desc.attacker_victory: "Věz, že válka o nejvyšší duchovní úřad skončila. [ROOT.Char.GetFaith.ReligiousHeadTitleName|U] je nyní v mé moci a [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip|l] mě následují. Ať všichni věřící vědí, že nyní vládne [ROOT.Char.GetFaith.ReligiousHeadName]."
 pam_antipope_events.0015.a: "Budiž tedy."
