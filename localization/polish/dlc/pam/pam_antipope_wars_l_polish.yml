 pam_clerical_disgrace_modifier_desc: "Tato postava byla ponížena v náboženské válce, což oslabilo její [candidate_score|E] pro [clerical_titles|E]." # todo: NEW TRANSLATION
 pam_clerical_disgrace_candidacy_penalty_desc: "Ponížen v náboženské válce" # todo: NEW TRANSLATION
 pam_antipope_events.0010.t: "Pokořený pretendent" # todo: NEW TRANSLATION
 pam_antipope_events.0010.desc.christian: "[pam_ch_hof_challenger.Custom('InsultAdjectiveGeneric')] schizmatik [pam_ch_hof_challenger.GetTitledFirstName] přede mnou klečí, zbaven [pam_ch_hof_challenger.GetHerHis] falešného [ROOT.Char.GetFaith.ReligiousHeadTitleName|U].\n\n[pam_ch_hof_challenger.GetSheHe] vzdorovitě prohlašuje: „Archa je všude, kde stojím. Ne u tvých nohou.“\n\nZdá se, že [pam_ch_hof_challenger.GetHerHis|U] jazyk stále slouží Satanovi." # todo: NEW TRANSLATION
 pam_antipope_events.0010.desc: "Pretendent [pam_ch_hof_challenger.GetTitledFirstName] přede mnou klečí, zbaven [pam_ch_hof_challenger.GetHerHis] falešného [ROOT.Char.GetFaith.ReligiousHeadTitleName|U].\n\n[pam_ch_hof_challenger.GetSheHe] stále vzdoruje a odpovídá: „Já jsem pravý [ROOT.Char.GetFaith.ReligiousHeadName].“" # todo: NEW TRANSLATION
 pam_antipope_events.0010.a.christian: "Cela může [pam_ch_hof_challenger.GetHerHim] přimět k pokání jako Jonáše." # todo: NEW TRANSLATION
 pam_antipope_events.0010.a: "Zavřete [pam_ch_hof_challenger.GetHerHim]." # todo: NEW TRANSLATION
 pam_antipope_events.0010.b.christian: "Popravte [pam_ch_hof_challenger.GetHerHim]. Pán zná své." # todo: NEW TRANSLATION
 pam_antipope_events.0010.b: "Popravte [pam_ch_hof_challenger.GetHerHim]. [ROOT.Char.GetFaith.HighGodName] zbytek rozsoudí." # todo: NEW TRANSLATION
 pam_antipope_events.0010.c: "Projevte milosrdenství." # todo: NEW TRANSLATION
 pam_antipope_events.0010.d: "[pam_ch_hof_challenger.GetSheHe|U] bude křičet jméno pravého [ROOT.Char.GetFaith.ReligiousHeadName|U]." # todo: NEW TRANSLATION
 pam_challenge_hof_war_random_permanent_harm_tt: "Utrpí náhodné trvalé zranění" # todo: NEW TRANSLATION
 pam_antipope_events.0011.t: "Cena podpory" # todo: NEW TRANSLATION
 pam_antipope_events.0011.desc.christian: "Měšec [pam_ch_hof_sponsor.GetTitledFirstNamePossessive] podnítil toto zlé rozkolnictví a postavil konkurenčního [ROOT.Char.GetFaith.ReligiousHeadName|U] proti [ROOT.Char.GetRite.GetName].\n\nPísmo takové patrony nešetří: [Glossary('$pam_romans_1_32_english|q$','ROMANS_1_32_GLOSS')]\n\n[pam_ch_hof_sponsor.GetSheHe|U] vzhlédne, stále vzdorovitý: „Nejsi [ROOT.Char.GetFaith.ReligiousHeadName], ale falešný mnich. Sestup, sestup, ať jsi navěky zatracen.“" # todo: NEW TRANSLATION
 pam_antipope_events.0011.desc: "Zlato [pam_ch_hof_sponsor.GetTitledFirstNamePossessive] postavilo konkurenčního [ROOT.Char.GetFaith.ReligiousHeadName|U], aby rozdělilo [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip].\n\n[pam_ch_hof_sponsor.GetSheHe|U] vzhlédne: „Nejsi žádný [ROOT.Char.GetFaith.ReligiousHeadName]. Jsi podvodník.“" # todo: NEW TRANSLATION
 pam_antipope_events.0011.a: "Zabavte měšec, který to umožnil." # todo: NEW TRANSLATION
 pam_antipope_events.0011.b: "Popravte [pam_ch_hof_sponsor.GetHerHim]. Souhlas má svou cenu." # todo: NEW TRANSLATION
 pam_antipope_events.0011.c: "Hanba, kterou [pam_ch_hof_sponsor.GetHerHis] rodině přinese, je dostatečným trestem." # todo: NEW TRANSLATION
 pam_antipope_events.0011.d: "Zbičujte [pam_ch_hof_sponsor.GetHerHim], dokud se maso neroztrhá." # todo: NEW TRANSLATION
 pam_romans_1_32_english: "Ti, kdo se takových věcí dopouštějí, zasluhují smrt... a nejenže je sami činí, ale dokonce schvalují ty, kdo je činí." # todo: NEW TRANSLATION
 ROMANS_1_32_GLOSS: "#weak Římanům 1:32, NRSVUE#!" # todo: NEW TRANSLATION
 pam_antipope_events.0012.t: "Rozsudek nad sesazeným" # todo: NEW TRANSLATION
 pam_antipope_events.0012.t.christian: "Rozsudek nad Satanovým služebníkem" # todo: NEW TRANSLATION
 pam_antipope_events.0012.intro.christian: "[ROOT.Char.GetRite.GetName] se zodpovídá mně. Falešný [ROOT.Char.GetFaith.ReligiousHeadName|U], [pam_ch_hof_old_hof.GetTitledFirstName], klečí u mých nohou." # todo: NEW TRANSLATION
 pam_antipope_events.0012.intro: "[ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip] se zodpovídají mně. Falešný [ROOT.Char.GetFaith.ReligiousHeadName|U], [pam_ch_hof_old_hof.GetTitledFirstName], klečí u mých nohou." # todo: NEW TRANSLATION
 pam_antipope_events.0012.intro.sponsor: "Můj [ROOT.Char.GetFaith.ReligiousHeadName|U] [pam_ch_hof_new_hof.GetFirstName] je dosazen na trůn. Pretendent [pam_ch_hof_old_hof.GetTitledFirstName] přede mnou klečí." # todo: NEW TRANSLATION
 pam_antipope_events.0012.dialogue.christian: "\n\n[pam_ch_hof_old_hof.GetSheHe] stále vzdoruje a plive: „Mečem jsi získal trůn míru.“\n\n„Pán uznal za vhodné dát mi nástroje potřebné k naplnění svého plánu,“ odpovídám." # todo: NEW TRANSLATION
 pam_antipope_events.0012.dialogue: "\n\n[pam_ch_hof_old_hof.GetSheHe|U] říká: „Získal jsi to mečem.“\n\n„A mečem si to také udržím,“ odpovídám." # todo: NEW TRANSLATION
 pam_antipope_events.0012.a: "Cela může zchladit tuto pýchu." # todo: NEW TRANSLATION
 pam_antipope_events.0012.b: "Dvě hlavy tvoří nestvůru; jedna musí pryč." # todo: NEW TRANSLATION
 pam_antipope_events.0012.c: "Sporu už bylo dost. Nechte [pam_ch_hof_old_hof.GetHerHim] odejít v pokoji." # todo: NEW TRANSLATION
 pam_antipope_events.0012.d: "[pam_ch_hof_old_hof.GetSheHe|U] bude křičet jméno pravého [ROOT.Char.GetFaith.ReligiousHeadName|U]." # todo: NEW TRANSLATION
 pam_antipope_events.0014.t: "Rozsudek nade mnou" # todo: NEW TRANSLATION
 pam_antipope_events.0014.intro.judge: "„Zprošťuji všechny [pam_ch_hof_judge.GetFaith.GetAdherentNamePlural] povinnosti tě poslouchat,“ říká [pam_ch_hof_judge.GetTitledFirstName]." # todo: NEW TRANSLATION
 pam_antipope_events.0014.intro.mercy.christian: "„Jdi a už nehřeš,“ říká [pam_ch_hof_judge.GetTitledFirstName]." # todo: NEW TRANSLATION
 pam_antipope_events.0014.intro.mercy: "„Jdi. Na tuto cestu se už nevracej,“ říká [pam_ch_hof_judge.GetTitledFirstName]." # todo: NEW TRANSLATION
 pam_antipope_events.0014.desc.condemned.christian: "\n\nMiloval jsem spravedlnost a nenáviděl nepravost, a proto umírám." # todo: NEW TRANSLATION
 pam_antipope_events.0014.desc.condemned: "\n\nUmírám za to, co jsem považoval za pravdu." # todo: NEW TRANSLATION
 pam_antipope_events.0014.desc.broken: "\n\n[pam_ch_hof_judge.GetSheHe|U] a [pam_ch_hof_judge.GetHerHis] muži se mi posmívají a smějí, zatímco bičují mé tělo. Jsem jen prázdná schránka, zrno už bylo vymláceno." # todo: NEW TRANSLATION
 pam_antipope_events.0014.desc.captive.christian: "\n\nDali mi celu. Vždy mi říkali, že cela je pro svatého [ROOT.Char.GetWomanMan] dost dobrá." # todo: NEW TRANSLATION
 pam_antipope_events.0014.desc.captive: "\n\nDali mi celu. Víc mi nedovolí." # todo: NEW TRANSLATION
 pam_antipope_events.0014.desc.spared.christian: "\n\nZdá se, že kameny zůstaly v jejich rukou a já mohu odejít svobodný. Neměl bych tímto milosrdenstvím pohrdnout." # todo: NEW TRANSLATION
 pam_antipope_events.0014.desc.spared: "\n\nZdá se, že mohu odejít svobodný. Neměl bych tímto milosrdenstvím pohrdnout." # todo: NEW TRANSLATION
 pam_antipope_events.0014.desc.generic: "\n\nRozsudek padl. Co přijde dál, si musím zvolit sám." # todo: NEW TRANSLATION
 pam_antipope_events.0014.a: "Ať se na můj rod vzpomíná jako na věrný [ROOT.Char.GetFaith.HighGodName]." # todo: NEW TRANSLATION
 pam_antipope_events.0014.b: "Jejich ruce se nikdy neočistí." # todo: NEW TRANSLATION
 pam_antipope_events.0014.b.toast: "Jste poskvrněni: [GetModifier('pam_ch_hof_sacred_bloodguilt_modifier').GetName]" # todo: NEW TRANSLATION
 pam_antipope_events.0014.c: "Ochraňte můj rod před touto hanbou." # todo: NEW TRANSLATION
 pam_antipope_events.0014.d: "Usmířím se s pravým [ROOT.Char.GetFaith.ReligiousHeadName]." # todo: NEW TRANSLATION
 pam_antipope_events.0014.e: "Zlořády, kterým mě [pam_ch_hof_judge.GetTitledFirstNameNoTooltip] naučil, nyní vykonám." # todo: NEW TRANSLATION
 pam_antipope_events.0014.e.tt: "$prelude_events.0040.c.tt$" # todo: NEW TRANSLATION
 pam_antipope_events.0014.f: "Budu chodit bos, dokud mé pokání neskončí." # todo: NEW TRANSLATION
 pam_antipope_events.0015.opening: "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetTitledFirstNameNoTooltip]," # todo: NEW TRANSLATION
 pam_antipope_events.0015.desc.defender_victory.christian: "Vězte, že schizmatická výzva vůči [ROOT.Char.GetFaith.ReligiousHeadName|U] byla rozdrcena. Úřad pretendenta byl zrušen a [ROOT.Char.GetRite.GetName] zůstává pevný. Ať žádný kníže ani prelát nepochybuje, komu dluží věrnost." # todo: NEW TRANSLATION
 pam_antipope_events.0015.desc.defender_victory: "Vězte, že výzva vůči [ROOT.Char.GetFaith.ReligiousHeadName|U] byla rozdrcena. Úřad pretendenta byl zrušen a [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip] zůstávají pevní. Ať žádný vládce nepochybuje, komu dluží věrnost." # todo: NEW TRANSLATION
 pam_antipope_events.0015.desc.attacker_victory.christian: "Vězte, že válka o [ROOT.Char.GetFaith.ReligiousHeadTitleName|U] skončila. Osvobodil jsem stolec z jha Satana a [ROOT.Char.GetRite.GetName] se bude řídit mými příkazy." # todo: NEW TRANSLATION
 pam_antipope_events.0015.desc.attacker_victory: "Vězte, že válka o [ROOT.Char.GetFaith.ReligiousHeadTitleName|U] skončila. Stolec je můj a [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip] mě následují. Ať věřící vědí, že vládne nový [ROOT.Char.GetFaith.ReligiousHeadName]." # todo: NEW TRANSLATION
 pam_antipope_events.0015.a: "Staň se." # todo: NEW TRANSLATION
