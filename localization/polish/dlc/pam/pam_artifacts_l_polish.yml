l_polish:
 artifact_pedestal_bible_name: "$artifact_name_prefix_F|U$ Bible"
 artifact_pedestal_bible_description: "Iluminovaná Bible v deskách zdobených drahokamy. Každý její verš je výsledkem trpělivého a zbožného opisování."
 artifact_pedestal_thurible_name: "$artifact_name_prefix_F|U$ kadidelnice"
 artifact_pedestal_thurible_description: "Jemně tepaná kadidelnice zavěšená na leštěných řetízcích. Po zapálení zahalí místnost vonnými oblaky kadidla, které nesou modlitby vzhůru k nebesům."
 artifact_pedestal_situla_name: "$artifact_name_prefix_F|U$ situla"
 artifact_pedestal_situla_description: "Bohatě zdobená nádoba na svěcenou vodu, nošená při procesích, aby jí mohli být kropeni věřící a přijímat požehnání."
 artifact_pedestal_crozier_name: "$artifact_name_prefix_F|U$ berla"
 artifact_pedestal_crozier_description: "Biskupská pastýřská berla s hlavicí zahnutou po vzoru pastýřské hole. Slouží k vedení věřících i usměrňování těch, kdo sešli ze správné cesty."
