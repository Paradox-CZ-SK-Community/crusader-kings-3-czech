 pam_abbey_of_st_gall_01_desc: "Toto opatství, vybudované kolem poustevny svatého Havla, proslulo svou školou, skriptoriem a knihovnou. V jeho zdech mniši opisují posvátné texty a vzdělávají duchovní, jejichž učenost přesahuje daleko za břehy Bodamského jezera." # todo: NEW TRANSLATION
 building_pam_abbey_of_st_gall_01_destination_desc: "[GetBuildingType('pam_abbey_of_st_gall_01').GetName|U] přitahuje pod své střechy poutníky i učence. Zdejší mniši uchovávají rukopisy, vzdělávají duchovní a udržují památku svatého Havla živou v podhůří Alp." # todo: CHANGED (predtym: [GetBuilding('pam_abbey_of_st_gall_01').GetName|U] přitahuje pod své střechy poutníky i učence. Zdejší mniši uchovávají )
