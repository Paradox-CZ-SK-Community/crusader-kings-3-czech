 pam_reims_cathedral_01: "Katedrála v Remeši" # todo: NEW TRANSLATION
 pam_reims_cathedral_01_desc: "Katedrála v Remeši stojí na posvátném místě, kde byl pokřtěn Chlodvík a korunováni králové. Zde může požehnání duchovních proměnit nároky vladaře v božskou autoritu a zpevnit pouto mezi vírou a královskou mocí." # todo: NEW TRANSLATION
 building_pam_reims_cathedral_01_destination_desc: "[GetBuildingType('pam_reims_cathedral_01').GetName|U] přitahuje poutníky do posvátného centra královských korunovací, kde franští králové poklekají před oltářem, aby odtud vyšli pomazáni a posvěceni před celým panstvím." # todo: CHANGED (predtym: [GetBuilding('pam_reims_cathedral_01').GetName|U] přitahuje poutníky do posvátného centra královských korunovací, kde fr)
