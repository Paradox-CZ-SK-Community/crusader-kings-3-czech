l_polish:
 building_type_pam_abbey_of_st_gall_01: "$building_pam_abbey_of_st_gall_01$" # todo: NEW TRANSLATION
 building_type_pam_abbey_of_st_gall_01_desc: "$building_pam_abbey_of_st_gall_01_desc$" # todo: NEW TRANSLATION
 building_pam_abbey_of_st_gall_01: "Klášter svatého Havla" # todo: NEW TRANSLATION
 building_pam_abbey_of_st_gall_01_desc: "Tento klášter, založený kolem poustevny svatého Havla, proslul svou školou, písařskou dílnou a knihovnou. Za jeho zdmi mniši opisují posvátné texty a vzdělávají duchovní, jejichž učenost sahá daleko za břehy Bodamského jezera." # todo: NEW TRANSLATION
 building_pam_abbey_of_st_gall_01_destination_desc: "[GetBuilding('pam_abbey_of_st_gall_01').GetName] láká poutníky a učence pod své zdi. Jeho mniši uchovávají rukopisy, vzdělávají duchovní a udržují živou památku na svatého Havla v podhůří Alp." # todo: NEW TRANSLATION
 building_type_pam_palais_de_papes_01: "$building_pam_palais_de_papes_01$" # todo: NEW TRANSLATION
 building_type_pam_palais_de_papes_01_desc: "$building_pam_palais_de_papes_01_desc$" # todo: NEW TRANSLATION
 building_pam_palais_de_papes_01: "Palais des Papes" # todo: NEW TRANSLATION
 building_pam_palais_de_papes_01_desc: "Tento palác, vybudovaný nad Avignonem jako pevnost i sídlo, ukrývá papežský dvůr za mohutnými kamennými zdmi. Kaple, audienční sály a správní komnaty proměňují město v centrum církevní moci." # todo: NEW TRANSLATION
 building_pam_palais_de_papes_01_destination_desc: "[GetBuilding('pam_palais_de_papes_01').GetName] vévodí Avignonu svými opevněnými zdmi a důstojnými kaplemi; je to palác vystavěný pro církevní záležitosti i obřady." # todo: NEW TRANSLATION
 building_type_pam_lateran_basilica_01: "$building_pam_lateran_basilica_01$" # todo: NEW TRANSLATION
 building_type_pam_lateran_basilica_01_desc: "$building_pam_lateran_basilica_01_desc$" # todo: NEW TRANSLATION
 building_pam_lateran_basilica_01: "Lateránská bazilika svatého Jana" # todo: NEW TRANSLATION
 building_pam_lateran_basilica_01_desc: "Katedrální kostel v Římě je matkou a hlavou kostelů města i celého světa. V jeho bazilice a přilehlých sálech se scházejí koncily, ustavuje se nauka a všem se zde ukazuje autorita římského pontifika." # todo: NEW TRANSLATION
 building_pam_lateran_basilica_01_destination_desc: "[GetBuilding('pam_lateran_basilica_01').GetName] přijímá poutníky i preláty v římském biskupském sídle, kde se pod ctihodnými zdmi snoubí slavnostní bohoslužby se správou církve." # todo: NEW TRANSLATION
 building_type_pam_reims_cathedral_01: "$building_pam_reims_cathedral_01$" # todo: NEW TRANSLATION
 building_type_pam_reims_cathedral_01_desc: "$building_pam_reims_cathedral_01_desc$" # todo: NEW TRANSLATION
 building_pam_reims_cathedral_01: "Katedrála v Remeši" # todo: NEW TRANSLATION
 building_pam_reims_cathedral_01_desc: "Katedrála v Remeši je posvátným místem, kde byl pokřtěn Chlodvík a kde byli korunováni králové. Požehnání duchovenstva zde může proměnit panovníkovy nároky v božskou autoritu a zpečetit pouto mezi vírou a královskou mocí." # todo: NEW TRANSLATION
 building_pam_reims_cathedral_01_destination_desc: "[GetBuilding('pam_reims_cathedral_01').GetName] přitahuje poutníky do posvátného srdce královského pomazání, kde franští králové poklekají před oltářem a odcházejí pomazaní před zraky celé říše." # todo: NEW TRANSLATION
