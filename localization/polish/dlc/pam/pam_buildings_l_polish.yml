 pam_palais_de_papes_01: "Palais des Papes" # todo: NEW TRANSLATION
 pam_palais_de_papes_01_desc: "Tento palác, vybudovaný nad Avignonem jako pevnost i sídlo, ukrývá za mohutnými kamennými hradbami papežský dvůr. Kaple, audienční síně a správní komnaty proměňují město v centrum církevní moci." # todo: NEW TRANSLATION
 building_pam_palais_de_papes_01_destination_desc: "[GetBuildingType('pam_palais_de_papes_01').GetName|U] se svými opevněnými hradbami a slavnostními kaplemi vévodí Avignonu. Jeho prostory slouží správě církve i velkolepým náboženským obřadům." # todo: CHANGED (predtym: [GetBuilding('pam_palais_de_papes_01').GetName|U] se svými opevněnými hradbami a slavnostními kaplemi vévodí Avignonu. J)
