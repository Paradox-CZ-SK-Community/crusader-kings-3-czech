l_polish:
 building_type_pam_abbey_of_st_gall_01: "$building_pam_abbey_of_st_gall_01$"
 building_type_pam_abbey_of_st_gall_01_desc: "$building_pam_abbey_of_st_gall_01_desc$"
 building_pam_abbey_of_st_gall_01: "Opatství svatého Havla"
 building_pam_abbey_of_st_gall_01_desc: "Toto opatství, vybudované kolem poustevny svatého Havla, proslulo svou školou, skriptoriem a knihovnou. Za jeho zdmi mniši opisují posvátné texty a vzdělávají duchovní, jejichž učenost se šíří daleko za břehy Bodamského jezera."
 building_pam_abbey_of_st_gall_01_destination_desc: "[GetBuilding('pam_abbey_of_st_gall_01').GetName|U] přitahuje pod své střechy poutníky i učence. Zdejší mniši uchovávají rukopisy, vzdělávají duchovní a udržují památku svatého Havla živou v podhůří Alp."
 building_type_pam_palais_de_papes_01: "$building_pam_palais_de_papes_01$"
 building_type_pam_palais_de_papes_01_desc: "$building_pam_palais_de_papes_01_desc$"
 building_pam_palais_de_papes_01: "Papežský palác v Avignonu"
 building_pam_palais_de_papes_01_desc: "Tento palác, tyčící se nad Avignonem jako pevnost i honosné sídlo, chrání papežský dvůr za mohutnými kamennými hradbami. Kaple, audienční sály a správní komnaty proměňují město v centrum církevní moci."
 building_pam_palais_de_papes_01_destination_desc: "[GetBuilding('pam_palais_de_papes_01').GetName|U] se svými opevněnými hradbami a slavnostními kaplemi vévodí Avignonu. Jeho prostory slouží správě církve i velkolepým náboženským obřadům."
 building_type_pam_lateran_basilica_01: "$building_pam_lateran_basilica_01$"
 building_type_pam_lateran_basilica_01_desc: "$building_pam_lateran_basilica_01_desc$"
 building_pam_lateran_basilica_01: "Arcibazilika svatého Jana v Lateránu"
 building_pam_lateran_basilica_01_desc: "Římský katedrální chrám je matkou a hlavou všech kostelů města i celého světa. V jeho bazilice a přilehlých sálech se scházejí církevní koncily, stanovují se věroučné zásady a před zraky všech se ukazuje autorita římského papeže."
 building_pam_lateran_basilica_01_destination_desc: "[GetBuilding('pam_lateran_basilica_01').GetName|U] vítá poutníky i vysoké církevní hodnostáře v sídle římského biskupa, kde se pod starobylými klenbami snoubí slavnostní bohoslužby se správou církve."
 building_type_pam_reims_cathedral_01: "$building_pam_reims_cathedral_01$"
 building_type_pam_reims_cathedral_01_desc: "$building_pam_reims_cathedral_01_desc$"
 building_pam_reims_cathedral_01: "Remešská katedrála"
 building_pam_reims_cathedral_01_desc: "Katedrála v Remeši stojí na posvátném místě spojeném se křtem Chlodvíka a korunovacemi králů. Právě zde může požehnání duchovenstva proměnit nárok panovníka v moc posvěcenou Bohem a utvrdit tak pouto mezi vírou a královskou autoritou."
 building_pam_reims_cathedral_01_destination_desc: "[GetBuilding('pam_reims_cathedral_01').GetName|U] přitahuje poutníky do posvátného centra královských korunovací, kde franští králové poklekají před oltářem, aby odtud vyšli pomazáni a posvěceni před celým panstvím."
