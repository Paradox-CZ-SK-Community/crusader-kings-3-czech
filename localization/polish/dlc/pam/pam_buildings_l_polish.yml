 pam_lateran_basilica_01: "Arcibazilika svatého Jana v Lateránu" # todo: NEW TRANSLATION
 pam_lateran_basilica_01_desc: "Římská katedrála je matkou a hlavou církví města i celého světa. V její bazilice a přilehlých síních se scházejí koncily, ustavuje se doktrína a všem se tu předvádí autorita římského pontifika." # todo: NEW TRANSLATION
 building_pam_lateran_basilica_01_destination_desc: "[GetBuildingType('pam_lateran_basilica_01').GetName|U] vítá poutníky i vysoké církevní hodnostáře v sídle římského biskupa, kde se pod starobylými klenbami snoubí slavnostní bohoslužby se správou církve." # todo: CHANGED (predtym: [GetBuilding('pam_lateran_basilica_01').GetName|U] vítá poutníky i vysoké církevní hodnostáře v sídle římského biskupa, )
