 pam_interactions_events.0070.t: "Válka pro [puppet_or_actor.Custom('CZ_TitleAsNameNoTooltip_A')|l]"
 pam_interactions_events.0070.desc_intro_pagan: "„Zlovolným pohanům z [target.Custom('CZ_LandedNameNoTier_G')]"
 pam_interactions_events.0070.desc_intro_heretic: "„Kacířům zvaným [recipient.GetFaith.GetAdherentNamePlural] z [target.Custom('CZ_LandedNameNoTier_G')]"
 pam_interactions_events.0070.desc_intro_infidel: "„Nevěřícím, jejichž [CZReligionAdjDecline(recipient.GetFaith.GetReligion,'á')|l] víra sídlí v [target.Custom('CZ_LandedNameNoTier_L')]"
 pam_interactions_events.0070.desc_intro_heathen: "„Pohanům zvaným [recipient.GetFaith.GetReligion.GetAdherentNamePlural] z [target.Custom('CZ_LandedNameNoTier_G')]"
 pam_interactions_events.0070.desc: "#EMP zatracení, zkázu — smrt mečem!#!“ volá [puppet_or_actor.GetTitledFirstNameRegnal] a zpráva se nese k neklidným masám [secondary_recipient.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')].\n\n„[ROOT.Char.GetFaith.random_GoodGodNames|U] je na naší straně; vztyč svatý prapor, [ROOT.Char.Custom('CZ_TitledFirstName_V')]! Vyzývám tě, abys [Select_CString(ROOT.Char.IsFemale,'vyhnala','vyhnal')|l] [recipient.Custom('CZ_TitledFirstName_A')] ze země [target.Custom('CZ_LandedNameNoTierNoTooltip_G')]! Abys [Select_CString(ROOT.Char.IsFemale,'uvrhla','uvrhl')|l] nevěřící zvané [recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)|l], kteří obývají [recipient.GetPrimaryTitle.Custom('CZ_Adjective_ou')|l] zemi, do plamenů místa zvaného [ROOT.Char.GetFaith.NegativeAfterLife]!“\n\n"
 pam_interactions_events.0070.desc_outro_joining_war: "Držitel titulu [puppet_or_actor.GetTitleAsNameNoTooltip|l] opravdu touží šířit [puppet_or_actor.GetFaith.HighGodNamePossessive] vliv! Slibuje osobně vyjet do války a dát mi svá vojska k dispozici."
 pam_interactions_events.0070.desc_outro_funding_war: "Tyto požadavky jsou podloženy mincemi: [puppet_or_actor.GetTitleAsNameNoTooltip|l] slibuje válečnou pokladnu plnou prostředků, aby mé bojovníky zvané [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] z vlastní [ROOT.Char.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_ee')|l] země pohánělo i něco víc než samotná víra."
 pam_interactions_events.0070.a: "„[ROOT.Char.GetFaith.WarGodName|U] je s námi! #EMP Do války!#!“"
 pam_interactions_events.0070.b: "Nech lid [recipient.Custom('CZ_TitledFirstNameNoTooltip_G')] na pokoji."
 cultural_acceptance_gain_refused_incited_holy_war: "Světský vládce zabránil svaté válce"
 pam_interactions_events.0071.t: "[ROOT.Char.GetFaith.HighGodNamePossessive|U] zábor území [target.Custom('CZ_LandedNameNoTierNoTooltip_G')]"
 pam_interactions_events.0071.desc_intro: "V bojových pokřicích, písních i modlitbách za vítězství — [ROOT.Char.GetFaith.HighGodNamePossessive] posvátný vzkaz se nese do území s hodností [target.GetTierAsNameNoTooltip], které obývají nevěřící zvaní [recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)|l]! Z hlavní svatyně zvané [ROOT.Char.GetFaith.HouseOfWorship] v [secondary_recipient.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_L')] vyhlašuje [secondary_recipient.GetName] svatou válku proti"
 pam_interactions_events.0071.desc_intro_pagan: "pohanům, kteří obývají [recipient.GetPrimaryTitle.Custom('CZ_Adjective_ou')|l] zemi.\n\nJako tupá zvířata se [recipient.GetTitledFirstName] a [recipient.GetCulture.GetCollectiveNoun] z [Select_CString(recipient.IsFemale,'jejích','jeho')|l] zemí jistě rozprchnou před spravedlivým příchodem vojsk [secondary_recipient.GetPrimaryTitle.GetNameNoTier], jež hlásají [CZReligionAdjDecline(secondary_recipient.GetFaith.GetReligion,'ou')|l] víru!"
 pam_interactions_events.0071.desc_intro_heretic: "kacířům, kteří obývají [recipient.GetPrimaryTitle.Custom('CZ_Adjective_ou')|l] zemi.\n\nVelká krvavá vlna smete [recipient.Custom('CZ_TitledFirstName_A')] a špinavé věřící zvané [recipient.GetFaith.GetAdherentNamePlural] z této země! Takový osud vždy čeká ty, kdo kazí slovo, které hlásá [ROOT.Char.GetFaith.HighGodName]!"
 pam_interactions_events.0071.desc_intro_infidel: "[recipient.Custom('CZ_TitleAsName_D')|U] v [recipient.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_L')].\n\nNevěřící vyznávající [CZReligionAdjDecline(recipient.GetFaith.GetReligion,'ou')|l] víru se brzy podvolí, jako všichni, kdo padli před Prorokovým #EMP džihádem#!!"
 pam_interactions_events.0071.desc_intro_heathen: "[recipient.Custom('CZ_TitleAsName_D')|U] v [recipient.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_L')].\n\n[ROOT.Char.GetFaith.WarGodName|U] je s námi: [secondary_recipient.GetName] rozdrtí pohanská vojska! A všechny národy vyznávající [CZReligionAdjDecline(ROOT.Char.GetFaith.GetReligion,'ou')|l] víru budou s úžasem přihlížet."
 pam_interactions_events.0071.desc_outro_joining_war: "\n\nMá vlastní vojska nebudou nečinně sedět. Ne! Proniknou do [recipient.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_G')] po boku bojovníků zvaných [secondary_recipient.Custom('KnightCulturePluralNoTooltip')|l] pod velením [secondary_recipient.Custom('CZ_TitledFirstNameNoTooltip_G')]."
 pam_interactions_events.0071.desc_outro_rally_crusaders: "\n\nUž teď se z [secondary_recipient.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] i odjinud scházejí zanícení válečníci pod prapor [secondary_recipient.Custom('CZ_TitledFirstNameNoTooltip_G')]."
 pam_interactions_events.0071.desc_outro_funding_war: "\n\nPřízeň, kterou projevuje [ROOT.Char.GetFaith.HighGodName], sama slibuje [secondary_recipient.Custom('CZ_TitledFirstNameNoTooltip_D')] vítězství. Ale můj štědrý dar upevňuje [Select_CString(secondary_recipient.IsFemale,'její','jeho')|l] jistotu."
 pam_interactions_events.0071.a: "Kéž jsou ti, kdo zemřou za tuto věc, navždy hodni závisti."
