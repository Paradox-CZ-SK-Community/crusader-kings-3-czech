 JUSTIFY_DIVORCE_INTERACTION_OPTION: "Zdůvodnit náboženským právem"
 divorce_justified_tt: "Alespoň jedna z následujících podmínek:\n$EFFECT_LIST_BULLET$[CZProDrop(secondary_recipient,'pokusila','pokusil')] se tě zavraždit\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName|U] [Select_CString(secondary_recipient.IsLocalPlayer,'máš','má')|l] rys [GetTrait('adulterer').GetName( secondary_recipient )]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName|U] [Select_CString(secondary_recipient.IsLocalPlayer,'máš','má')|l] velmi nízkou [Concept('fertility','plodnost')|E] a vaše manželství je bezdětné\n$EFFECT_LIST_BULLET$[Concept('faith','Víra')|EU] vyznávaná [secondary_recipient.Custom('CZ_ShortUIName_I')] je [Concept('faith_hostile','nepřátelská')|E] nebo [Concept('faith_evil','zavrženíhodná')|E]\n$EFFECT_LIST_BULLET$S [secondary_recipient.Custom('CZ_ShortUIName_I')] žijí v manželství další [Concept('spouses','choti')|E], přestože je mnohoženství zakázáno\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName|U] [Select_CString(secondary_recipient.IsLocalPlayer,'trpíš','trpí')|l] impotencí\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName|U] [Select_CString(secondary_recipient.IsLocalPlayer,'máš','má')|l] [Concept('incestuous','krvesmilný')|E] milenecký vztah\n$EFFECT_LIST_BULLET$Tvé manželství s [secondary_recipient.Custom('CZ_ShortUIName_I')] je [Concept('incestuous','krvesmilné')|E]\n$EFFECT_LIST_BULLET$Tvé manželství s [secondary_recipient.Custom('CZ_ShortUIName_I')] je svazek stejného pohlaví a je zakázáno"
 divorce_justified_secondary_tt: "Alespoň jedna z následujících podmínek:\n$EFFECT_LIST_BULLET$[CZProDrop(secondary_recipient,'pokusila','pokusil')] se zavraždit [secondary_actor.Custom('CZ_ShortUIName_A')]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName|U] [Select_CString(secondary_recipient.IsLocalPlayer,'máš','má')|l] rys [GetTrait('adulterer').GetName( secondary_recipient )]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName|U] [Select_CString(secondary_recipient.IsLocalPlayer,'máš','má')|l] velmi nízkou [Concept('fertility','plodnost')|E] a jejich manželství je bezdětné\n$EFFECT_LIST_BULLET$[Concept('faith','Víra')|EU] vyznávaná [secondary_recipient.Custom('CZ_ShortUIName_I')] je [Concept('faith_hostile','nepřátelská')|E] nebo [Concept('faith_evil','zavrženíhodná')|E]\n$EFFECT_LIST_BULLET$S [secondary_recipient.Custom('CZ_ShortUIName_I')] žijí v manželství další [Concept('spouses','choti')|E], přestože je mnohoženství zakázáno\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName|U] [Select_CString(secondary_recipient.IsLocalPlayer,'trpíš','trpí')|l] impotencí\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName|U] [Select_CString(secondary_recipient.IsLocalPlayer,'máš','má')|l] [Concept('incestuous','krvesmilný')|E] milenecký vztah\n$EFFECT_LIST_BULLET$Manželství [secondary_actor.Custom('CZ_ShortUIName_G')|U] s [secondary_recipient.Custom('CZ_ShortUIName_I')] je [Concept('incestuous','krvesmilné')|E]\n$EFFECT_LIST_BULLET$Manželství [secondary_actor.Custom('CZ_ShortUIName_G')|U] s [secondary_recipient.Custom('CZ_ShortUIName_I')] je svazek stejného pohlaví a je zakázáno"
