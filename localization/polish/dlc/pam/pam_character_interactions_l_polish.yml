 pam_interactions_events.0060.t: "Zdůvodnění rozvodu"
 pam_interactions_events.0060.desc: "[puppet_or_actor.GetTitledFirstName|U] si přeje ukončit své manželství, ano, ale přes všechnu zášť mezi [puppet_or_actor.Custom('CZ_TitledFirstName_I')] a [secondary_recipient.Custom('CZ_TitledFirstName_I')]... jejich svazek uzavřeli před posvátnou autoritou, kterou představuje [puppet_or_actor.GetFaith.HighGodName]. A k jeho ukončení nemají pádný důvod.\n\nMusím tedy vymyslet lež, která ospravedlní zrušení jejich manželství. Rouhání, které si snad zaslouží nějakou náhradu..."
 pam_interactions_events.0060.a: "Tento rozchod si zaslouží... krvavý skandál."
 pam_interactions_events.0060.a.tt: "Nevytvořím žádné vznešené lži, nýbrž odporná obvinění proti [secondary_recipient.Custom('CZ_FirstNameNoTooltip_D')]! Na obranu se bude muset postavit [Select_CString(secondary_recipient.IsFemale,'její','jeho')|l] rodina... a také příbuzenstvo [puppet_or_actor.Custom('CZ_FirstNameNoTooltip_G')] na obranu svého člena."
 pam_interactions_events.0060.b: "Přimět [puppet_or_actor.Custom('CZ_TitleAsNameNoTooltip_G')|l] k darování půdy věřícím."
 pam_interactions_events.0060.b.tt: "Předání titulu řádu [lease_order.GetName] ulehčí tomuto břemeni na všech našich duších..."
 pam_interactions_events.0060.c: "Laskavost, která zasluhuje laskavost na oplátku."
 pam_interactions_events.0060.d: "Tvrdit, že [secondary_recipient.GetFirstNameNoTooltip] má dávný příslib služby duchovenstvu."
 pam_interactions_events.0060.d.tt: "Pokud byly už dávno složeny sliby řádu [divorcee_joining_order.GetName], toto manželství by bylo neplatné! A kdo by pak mohl nový život [secondary_recipient.Custom('CZ_FirstNameNoTooltip_G')] vést lépe než já?"
 pam_interactions_events.0060.e: "Nic od nešťastného páru nežádat."
