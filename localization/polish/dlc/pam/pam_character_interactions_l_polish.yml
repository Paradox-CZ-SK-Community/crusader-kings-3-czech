 pam_interactions_events.0094.opening: "[Select_CString(ROOT.Char.IsFemale,'Právoplatná','Právoplatný')|U] [ROOT.Char.Custom('CZ_TitleAsName_V')|l]!"
 pam_interactions_events.0094.desc_conversion: "Šiř posvátné slovo, které hlásá [cleric.GetFaith.HighGodName], po celém území [target.Custom('CZ_LandedNameNoTier_G')]! Nešetři holí na jeho zbloudilý lid ani silou svých bojovníků zvaných [ROOT.Char.Custom('GetFighterTermPlural')|l] při obraně ctností této země.\n\nToto území s hodností [target.GetTierAsNameNoTooltip] ti patří k vládnutí. Podléhá moci každé osoby s úřadem [ROOT.Char.Custom('CZ_TitleAsName_G')|l] nad [ROOT.Char.GetPrimaryTitle.Custom('CZ_Adjective_eem')|l] územím, #EMP de iure#! až do konce věků."
 pam_interactions_events.0094.desc: "Pro věřící zvané [cleric.GetFaith.GetAdherentNamePlural] z [target.Custom('CZ_LandedNameNoTooltip_G')] je to požehnaný den! Jak toužili po sjednocení se svými bratry a sestrami v [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_L')]!\n\nTo, co žilo v srdcích obyvatel [target.Custom('CZ_AdjectiveNoTooltip_eeho')|l] území, činí zákonem [cleric.GetTitleAsName|l] z vůle, kterou hlásá [cleric.GetFaith.HighGodName]: panovníci mnoha zemí nyní uznávají toto území s hodností [target.GetTierAsNameNoTooltip] za panství #EMP de iure#! [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')]."
 pam_interactions_events.0094.a: "[target.GetNameNoTierNoTooltip|U] a [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] jsou navěky spojeny."
 pam_interactions_events.0095.opening: "Držiteli titulu [ROOT.Char.GetTitleAsName|l] v [target_county.Custom('CZ_LandedNameNoTier_L')] a dalších zemích,"
 pam_interactions_events.0095.desc: "[cleric.GetFaith.HighGodName|U] ti uděluje požehnání! Ve své moudrosti svěřuje celé území [target.Custom('CZ_LandedName_G')] věčné ochraně [de_jure_master.Custom('CZ_TitleAsName_G')|l] v [de_jure_master.GetPrimaryTitle.Custom('CZ_LandedName_L')].\n\nJako [cleric.GetTitleAsName|l] vydávám tento výnos jménem věřících zvaných [cleric.GetFaith.GetAdherentNamePlural] z [target.Custom('CZ_AdjectiveNoTooltip_eeho')|l] území, [de_jure_master.Custom('CZ_TitleAsNameNoTooltip_G')|l] a těch, kdo chápou moudrost tohoto dělení smrtelných panství #EMP de iure#!, jejichž řád určuje [cleric.GetFaith.HighGodName]."
 pam_interactions_events.0095.a: "Ať je prokleta chamtivost věřících zvaných [de_jure_master.GetFaith.GetAdherentNamePluralNoTooltip]!"
 pam_interactions_events.0095.a_same_faith: "Vskutku, kdo jiný může rozdělovat panství než [ROOT.Char.GetFaith.HighGodName]."
