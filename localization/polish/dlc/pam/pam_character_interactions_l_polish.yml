 pam_interactions_events.0031.opening: "Můj svéhlavý [actor.Custom('GetDaughterSon')]," # todo: NEW TRANSLATION
 pam_interactions_events.0031.desc: "[actor.GetFaith.HighGodName] ti dal rty, abys mluvil spravedlivá slova. [actor.GetFaith.HighGodName] ti dal ruce, abys třímal meč. A [actor.GetFaith.HighGodName] seslal do světa [actor.GetFaith.PriestNeuterPlural], abys mohl naslouchat jejich moudrosti. \n\nPohlcen chamtivostí pronášíš nespravedlivá slova. Sevřen strachem otálíš s tasením meče, který tak toužíš použít proti [target.Custom('CZ_LandedNameNoTier_D')].\n\nA tak jsme dospěli k tomu, že musíš vyslyšet mou moudrost... a nechat [target.GetTierAsName] na pokoji." # todo: NEW TRANSLATION
 pam_interactions_events.0031.a: "[secondary_recipient.GetTitleAsNameNoTooltip] odmítá mou věc!" # todo: NEW TRANSLATION
 pam_interactions_events.0033.opening: "Strážce nebeského i pozemského řádu," # todo: NEW TRANSLATION
 pam_interactions_events.0033_de_jure: "Žádám tě o pomoc. Prohlaš, že má vláda právoplatně zahrnuje [target.GetName] — který mi náleží z práva de iure. Posvěť mě svou autoritou, abych mohl [recipient.GetName] přesvědčit bez prolévání krve.\n\n" # todo: NEW TRANSLATION
 pam_interactions_events.0033_claim: "Chci uplatnit svůj nárok na [target.Custom('CZ_LandedNameNoTier_A')]. Uděl mi své svaté požehnání, aby mi [recipient.GetName] mohl předat [target.GetTierAsName] bez prolévání [actor.GetFaith.GetAdjective] krve.\n\n" # todo: NEW TRANSLATION
 pam_interactions_events.0033_threaten: "Jestli mi tuto žádost odmítneš... budeš to #EMP ty#!, kdo bude muset [ROOT.Char.GetFaith.HighGodName] vysvětlit to strašlivé krveprolití a vypálení, které bych rozpoutal [CZPrepV(target.GetNameNoTierNoTooltip)] [target.Custom('CZ_LandedNameNoTierNoTooltip_L')]." # todo: NEW TRANSLATION
 pam_interactions_events.0033_succession: "Pokud se za mě přimluvíš, nabízím tento slib: zemřu-li jako [actor.GetTitleAsName] titulu [actor.GetPrimaryTitle.GetNameNoTier] bez dětí svého rodu, [actor.GetPrimaryTitle.GetNameNoTier] pak připadne církvi." # todo: NEW TRANSLATION
 pam_interactions_events.0033_pilgrimage: "Na oplátku za tvůj posvátný souhlas v této pozemské záležitosti slibuji, že vykonám pouť: projev vděčnosti za požehnání, jimiž mě obdařil [actor.GetFaith.HighGodName]." # todo: NEW TRANSLATION
 pam_interactions_events.0033_use_hook: "Jistě jsi nezapomněl... že je tvé jméno zapsáno na můj příkaz a že slova tvého pera musí být podle mé vůle...?" # todo: NEW TRANSLATION
 pam_interactions_events.0033_offer_hook: "Propůjčit mé věci svou zbožnou pověst není žádná maličkost. Podpoř mě v této světské politice a já podpořím tebe v budoucnu." # todo: NEW TRANSLATION
 pam_interactions_events.0033_donate: "Pomoz mi, obohať mou říši o půdu a já rád přispěji do tvé zbožné pokladnice." # todo: NEW TRANSLATION
 pam_interactions_events.0033_fallback: "Pokud jednání o půdě a titulu nezahájí svatý prostředník, nikam nepovedou. Propůjčíš mé věci svou posvátnou autoritu?" # todo: NEW TRANSLATION
 pam_interactions_events.0033.aa: "Ano. Budiž." # todo: NEW TRANSLATION
 pam_interactions_events.0033.a: "[target.GetNameNoTierNoTooltip] musí podle mého výnosu připadnout [actor.GetFirstNamePossessiveNoTooltip]." # todo: NEW TRANSLATION
 pam_interactions_events.0033.a.tt: "Pošlete [recipient.GetTitledFirstNameNoTooltip] dopis: lpět na neprávem drženém území znamená pohrdat [secondary_recipient.GetFaith.HighGodName] i [secondary_recipient.GetTitleAsNameNoTooltip]!" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [recipient.GetHerHis]
 pam_interactions_events.0033.b: "Nemohu schválit tento drzý požadavek." # todo: NEW TRANSLATION
 pam_interactions_events.0033.b.tt: "Svět je takto dobře uspořádaný. [recipient.GetTitledFirstNameNoTooltipRegnal] si musí ponechat [target.GetNameNoTierNoTooltip]." # todo: NEW TRANSLATION
 clergy_land_inform_priest_might_fail_tt: "@warning_icon! #X #bold [actor.GetShortUIName] se pokusí přesvědčit [recipient.GetShortUIName], aby [target.GetName] předal [actor.GetHerHim], ale nemusí uspět#!#!" # todo: NEW TRANSLATION
 clergy_land_inform_priest_can_force_tt: "@alert_icon! #alert_trial #bold [actor.GetShortUIName] může [recipient.GetShortUIName] přinutit, aby [target.GetName] předal [actor.GetHerHim], ale místo toho může riskovat neúspěch#!#!" # todo: NEW TRANSLATION
 clergy_land_inform_priest_will_happen_tt: "#P #EMP #bold [recipient.GetShortUIName] předá [target.GetName] [actor.GetShortUIName] bez odporu#!#!#!" # todo: NEW TRANSLATION
 high_church_authority_unlock_land_transfer_tt: "#P #EMP #bold Váš [law|E] [GetLaw('church_authority_3').GetName] vám umožňuje přinutit [recipient.GetShortUIName], aby [target.GetName] předal [actor.GetShortUIName] bez odporu#!#!#!" # todo: NEW TRANSLATION
 pam_interactions_events.0032.opening: "Jakožto svatý rozhodce tímto zahajuji jednání." # todo: NEW TRANSLATION
 pam_interactions_events.0032_intro: "O [target.Custom('CZ_LandedNameNoTier_A')] jste se starali schopně, avšak vůlí [recipient.GetFaith.HighGodName] je, aby tento [target.GetTierAsNameNoTooltip] náležel [actor.GetName]. Prosím, mohli byste tuto zemi postoupit [actor.GetHerHim] bez krveprolití?\n\n" # todo: NEW TRANSLATION
 pam_interactions_events.0032_de_jure: "[target.GetNameNoTierNoTooltip] totiž [actor.GetHersHis] náleží na základě práva #EMP de jure#!." # todo: NEW TRANSLATION
 pam_interactions_events.0032_claim: "Neboť v očích Všemohoucího je [actor.GetHerHis] nárok na [target.Custom('CZ_LandedNameNoTierNoTooltip_A')] nejoprávněnější ze všech." # todo: NEW TRANSLATION
 pam_interactions_events.0032.aa: "Tak, kde mám pero..." # todo: NEW TRANSLATION
 pam_interactions_events.0032.aa.flavor: "Celému světu dokážu, že [recipient.GetFaith.HighGodName] těmto hříšným šarlatánům upřel veškeré [recipient.GetFaith.GetAdjectiveNoTooltip] ctnosti. Jediné, co mají — a kdy budou mít — je nestydatá drzost." # todo: NEW TRANSLATION
 clergy_interaction_scholar_block_tt: "#P #bold #EMP Pokus [actor.GetShortUINamePossessive] získat [target.GetName] selže#!#!#!" # todo: NEW TRANSLATION
 pam_interactions_events.0032.a: "Pokud si to [actor.GetFaith.HighGodName] přeje, vzdám se [target.GetNameNoTierNoTooltip]." # todo: NEW TRANSLATION
 pam_interactions_events.0032.b: "Ne. Ani jeden z vás mě nepřesvědčil." # todo: NEW TRANSLATION
 pam_interactions_events.0032.b.tt: "Kéž by šlo [actor.GetTitledFirstNameNoTooltip] a [secondary_recipient.GetTitledFirstNameNoTooltip] umlčet tak snadno..." # todo: NEW TRANSLATION
 clerical_land_transfer_actor_attempt_tt: "@alert_icon! #alert_trial #bold Může vás přimět přijmout [actor.GetHerHis] zabrání [target.GetName] jednou z následujících metod:#!#!" # todo: NEW TRANSLATION
 pam_interactions_events.0030.t: "Jednání o [target.Custom('CZ_LandedNameNoTierNoTooltip_A')]" # todo: NEW TRANSLATION
 pam_interactions_events.0030.desc_intro_envoy: "Na posvátné půdě můj vyslanec [secondary_recipient.GetTitledFirstNameRegnal] předkládá můj nárok na [target.Custom('CZ_LandedNameNoTier_A')]." # todo: NEW TRANSLATION
 pam_interactions_events.0030.desc_intro: "S požehnáním [secondary_recipient.GetTitledFirstNameRegnal] a pod ochranou posvátné půdy předkládám svůj nárok na [target.Custom('CZ_LandedNameNoTier_A')]." # todo: NEW TRANSLATION
 pam_interactions_events.0030.desc: "Slova o mírumilovné svornosti, prokládaná hrozbami války. Prohlášení o mých právoplatných nárocích. A tak dále, a tak dále...\n\n" # todo: NEW TRANSLATION
 pam_interactions_events.0030.desc_target: "[recipient.GetTitledFirstNameNicknamed] se svého [target.GetTierAsNameNoTooltip] nevzdá tak snadno. Tuto záležitost je třeba uzavřít pozemskými sliby, nebo zlověstnými hrozbami." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [recipient.GetHerHis]
 pam_interactions_events.0030.desc_vassal: "[recipient.GetTitledFirstNameNicknamed] se svého sevření [vassal.GetName] tak snadno nevzdá. Ať už pozlacenými nabídkami, nebo hrozivými výhrůžkami: mého vazala je třeba si získat." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [recipient.GetHerHis]
 pam_interactions_events.0030.a: "Připomeň [recipient.GetFirstNameNoTooltip], že [recipient.GetSheHe] má jisté... povinnosti." # todo: NEW TRANSLATION
 pam_interactions_events.0030.a.flavor: "A že je to [actor.GetTitleAsNameNoTooltip] [CZPrepZ(actor.GetPrimaryTitle.GetNameNoTierNoTooltip)] [actor.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')], kdo je může vymáhat!" # todo: NEW TRANSLATION
 pam_interactions_events.0030.b: "Nepotřebuji žádného [ROOT.Char.Custom2('RelationToMe', recipient)]. Potřebuji [target.GetNameNoTierNoTooltip]." # todo: NEW TRANSLATION
 pam_interactions_events.0030.b.flavor: "Dej jasně najevo, že pokud [recipient.GetFirstNameNoTooltip] odmítne, [recipient.GetSheHe] pro tebe nic neznamená." # todo: NEW TRANSLATION
 pam_interactions_events.0030.c: "Jestli se [recipient.GetSheHe] nevzdá, znesvěť tuto svatou půdu." # todo: NEW TRANSLATION
 pam_interactions_events.0030.c.tt: "Zasyp tu špinavou hříšnici odpornými obviněními! Přivolej na vás oba zatracení a pohrdání! [secondary_recipient.GetTitledFirstNameNoTooltip] a všichni ostatní [actor.GetFaith.PriestNeuterPlural] přimějí [recipient.GetFirstNameNoTooltip] ustoupit!" # todo: NEW TRANSLATION
 pam_interactions_events.0030.d: "Vyhrožuj, že z toho uděláš skandál, který podkope její legitimitu." # todo: NEW TRANSLATION
 pam_interactions_events.0030.d.flavor: "Málo vážený [recipient.GetTitleAsNameNoTooltip] sotva obstojí, pokud se do toho zapletou jména a pověst..." # todo: NEW TRANSLATION
 pam_interactions_events.0030.e: "Jednoduše nabídni, že [target.GetTierAsNameNoTooltip] koupíš." # todo: NEW TRANSLATION
 pam_interactions_events.0030.f: "Nechám to na [ROOT.Char.GetFaith.HighGodName] a úsudku [recipient.GetFirstNamePossessiveNoTooltip]." # todo: NEW TRANSLATION
 clergy_land_no_method_warning_tt: "@warning_icon!#X #bold Bez nabídnutých pobídek [recipient.GetShortUIName] nejspíš nepřijme!#!#!" # todo: NEW TRANSLATION
 clergy_land_no_method_warning_soft_tt: "@alert_icon! #alert_trial Bez nabídnutých pobídek je méně pravděpodobné, že [recipient.GetShortUIName] přijme#!" # todo: NEW TRANSLATION
 pam_interactions_events.0034.t: "Spor o [target.Custom('CZ_LandedNameNoTierNoTooltip_A')]" # todo: NEW TRANSLATION
 pam_interactions_events.0034.desc_intro_envoy: "[secondary_recipient.GetTitledFirstNameRegnal] dále obhajuje [target.GetNameNoTier] jménem [actor.GetNamePossessive] — a podle [secondary_recipient.GetSheHe] také jménem pozemského řádu [recipient.GetFaith.HighGodNamePossessive] a veškerého [recipient.GetFaith.GetAdjective] duchovenstva." # todo: NEW TRANSLATION
 pam_interactions_events.0034.desc_intro: "[actor.GetName] předkládá své nároky na [target.Custom('CZ_LandedNameNoTier_A')]: opakuje požadavek, který chrání a podporuje víra [recipient.GetFaith.GetAdjective]." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [actor.GetHerHis], [actor.GetSheHe]
 pam_interactions_events.0034.desc_vassal: "Jako by nezáleželo na tom, že mi [target.GetHolder.GetName] přísahal věrnost až do smrti. Zdá se, že i s touto věrností lze obchodovat." # todo: NEW TRANSLATION
 pam_interactions_events.0034.desc_target: "Jako by nezáleželo na tom, že mi [target.GetTierAsNameNoTooltip] náleží po krvi a dobytí. Na této zemi lze obchodovat se vším." # todo: NEW TRANSLATION
 pam_interactions_events.0034.desc: "\n\nJelikož k jednání dochází na posvátné půdě, snáším tyto útoky na svá práva v klidu. Mohu jen zvážit, co mi nabízejí...\n\n" # todo: NEW TRANSLATION
 pam_interactions_events.0034.desc_method_hook: "Slib, že povinnosti, které vůči mně [actor.GetTitledFirstNameNoTooltip] uplatňuje, budou zrušeny." # todo: NEW TRANSLATION
 pam_interactions_events.0034.desc_method_relation: "Tím skončí veškerá vřelost, důvěra i láska mezi námi. Podle [actor.GetFirstNameNoTooltip] závisí [actor.GetHerHim|U] srdce na této půdě.\n\n[actor.GetSheHe|U] mě bude navždy nenávidět, když jí to odepřu." # todo: NEW TRANSLATION
 pam_interactions_events.0034.desc_method_piety: "Hrozba, že můj už tak vratký vztah k víře zcela ztroskotá. Uškodilo by to i [actor.GetTitledFirstNameNoTooltip], ale [actor.GetHerHis] zbožnost má pevnější základy než ta moje." # todo: NEW TRANSLATION
 pam_interactions_events.0034.desc_method_legitimacy: "Vážná hrozba pro mou legitimitu. Odporná veřejná hádka o [target.Custom('CZ_LandedNameNoTierNoTooltip_A')], skandál, který z nás obou udělá terč posměchu..." # todo: NEW TRANSLATION
 pam_interactions_events.0034.desc_method_gold: "Hromada třpytivých mincí. [actor.GetTitleAsNameNoTooltip] tvrdí, že je to přiměřená cena za [target.GetTierAsNameNoTooltip]." # todo: NEW TRANSLATION
 pam_interactions_events.0034.desc_no_method: "...#EMP vůbec nic#!. Je tu pouze požadavek na [target.Custom('CZ_LandedNameNoTier_A')] a domněnka, že se bojím pohrdání [recipient.GetFaith.PriestNeuterPlural] i hrůz války." # todo: NEW TRANSLATION
 pam_interactions_events.0034.a: "[actor.GetSheHe|U] může vztyčit [actor.GetHerHis] prapor nad [target.Custom('CZ_LandedNameNoTierNoTooltip_I')]." # todo: NEW TRANSLATION
 pam_interactions_events.0034.b: "Dokud žiju, [target.GetTierAsNameNoTooltip] mi patří." # todo: NEW TRANSLATION
 pam_interactions_events.0035.t: "[target.GetNameNoTierNoTooltip] získán" # todo: NEW TRANSLATION
 pam_interactions_events.0035.desc_intro: "Po chvíli rozmýšlení [recipient.GetFirstNameNicknamed] ustoupí! Jednání o postoupení [target.GetNameNoTier] jsou rychlá a úspěšná.\n\nDekret [secondary_recipient.GetTitledFirstNamePossessive] o mých právech je naplněn." # todo: NEW TRANSLATION
 pam_interactions_events.0035.desc_hook: "Povinnost, kterou jsem vůči [recipient.GetFirstNameNoTooltip] uplatňoval, byla čestně splněna." # todo: NEW TRANSLATION
 pam_interactions_events.0035.desc_relation: "Ano, prolévají se hořké slzy, radost a obdiv jsou minulostí. Kvůli [target.Custom('CZ_LandedNameNoTierNoTooltip_D')] jsem [recipient.GetFirstNameNoTooltip] hluboce ranil. Ale..." # todo: NEW TRANSLATION
 pam_interactions_events.0035.desc_piety: "A tak se mé hrozby, že [recipient.GetFirstNameNoTooltip] i sebe utopím v hanebné potupě... nemusí naplnit." # todo: NEW TRANSLATION
 pam_interactions_events.0035.desc_legitimacy: "A tak se mé hrozby skandálem a pomluvami... nemusí naplnit." # todo: NEW TRANSLATION
 pam_interactions_events.0035.desc_gold: "Dal jsem zprávu svým správcům pokladny a věřitelům a cenu ochotně zaplatím." # todo: NEW TRANSLATION
 pam_interactions_events.0035.desc_fallback: "Jakou moc [actor.GetFaith.HighGodName] vložil do našich [actor.GetFaith.GetAdjective] [actor.GetFaith.PriestNeuterPlural] i do mě! Bez armád a válečných tažení — svět se mění na náš rozkaz." # todo: NEW TRANSLATION
 pam_interactions_events.0035.desc_vassal: "\n\n[vassal.GetName] mi přísahá věrnost." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [vassal.GetHerHis]
 pam_interactions_events.0035.desc: "\n\n[ target.GetTierAsNameNoTooltip] je můj." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [target.GetTierAsNameNoTooltip]; navyše [ target.GetTierAsNameNoTooltip]
 pam_interactions_events.0035.a: "Ať se nad [target.Custom('CZ_LandedNameNoTierNoTooltip_I')] vysoko vztyčí mé prapory!" # todo: NEW TRANSLATION
 pam_interactions_events.0036.t: "[target.GetNameNoTierNoTooltip] odepřen" # todo: NEW TRANSLATION
 pam_interactions_events.0036.desc_intro_afraid_admin: "[recipient.GetTitledFirstName] pronáší svou odpověď v doprovodu zdatných vojáků, nesvůj navzdory smířlivému zprostředkování [secondary_recipient.GetTitledFirstNamePossessive]:\n\n" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [recipient.GetHerHis]
 pam_interactions_events.0036.desc_intro_afraid: "[recipient.GetTitledFirstName] pronáší svou odpověď v doprovodu statných [recipient.Custom('KnightCulturePluralNoTooltip')|l], nesvůj navzdory smířlivému zprostředkování [secondary_recipient.GetTitledFirstNamePossessive]:\n\n" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [recipient.GetHerHis]
 pam_interactions_events.0036.desc_intro_pious: "[recipient.GetTitledFirstName] pronáší svou odpověď o samotě a vzpřímeně, povzbuzen smířlivým zprostředkováním [secondary_recipient.GetTitledFirstNamePossessive]:\n\n" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [recipient.GetHerHis]
 pam_interactions_events.0036.desc_intro_admin: "[recipient.GetTitledFirstName] pronáší svou odpověď obklopen tělesnými strážci a pohrdá smířlivým zprostředkováním [secondary_recipient.GetTitledFirstNamePossessive]:\n\n" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [recipient.GetHerHis]
 pam_interactions_events.0036.desc_intro: "[recipient.GetTitledFirstName] pronáší svou odpověď obklopen statnými [recipient.Custom('KnightCulturePluralNoTooltip')|l] a pohrdá smířlivým zprostředkováním [secondary_recipient.GetTitledFirstNamePossessive]:\n\n" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [recipient.GetHerHis]
 pam_interactions_events.0036.desc_hook: ""[target.GetNameNoTierPossessive] místo v mém srdci je nade všechny povinnosti, které byste po mně mohl vymáhat." # todo: NEW TRANSLATION
 pam_interactions_events.0036.desc_relation: ""[actor.GetTitleAsName] [CZPrepZ(actor.GetPrimaryTitle.GetNameNoTierNoTooltip)] [actor.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] plive na mé srdce. Trhá mou duši na kusy. Už od [actor.GetHerHim] nechci nic slyšet." # todo: NEW TRANSLATION
 pam_interactions_events.0036.desc_piety: ""Odepřu-li vám [target.GetNameNoTier], uvrhnete nás oba do hříchu a obvinění? Dobrá." # todo: NEW TRANSLATION
 pam_interactions_events.0036.desc_legitimacy: ""Pronášejte své jedovaté lži. Poštvěte proti nám oba lid [target.Custom('CZ_LandedNameNoTier_G')] i všechny ostatní." # todo: NEW TRANSLATION
 pam_interactions_events.0036.desc_gold: ""Myslíte si, že si můžete [target.GetNameNoTier] koupit zlatem a stříbrem? Tak vznešený [target.GetTierAsNameNoTooltip] si zaslouží víc než tak prostou transakci." # todo: NEW TRANSLATION
 pam_interactions_events.0036.desc_fallback: ""Může snad [actor.GetTitleAsName] a [secondary_recipient.GetTitleAsNameNoTooltip] získat [target.GetNameNoTier] pouhými pár jednoduchými slovy...? Ne." # todo: NEW TRANSLATION
 pam_interactions_events.0036.desc_afraid: "Pošlete [recipient.GetFaith.PriestNeuterPlural] a uvítám je. Pošlete vyslance a budu s nimi jednat..."\n\n"Ale [target.GetTierAsNameNoTooltip] se takto vzdát nemohu."" # todo: NEW TRANSLATION
 pam_interactions_events.0036.desc_pious: "Pošlete další zkažené [recipient.GetFaith.PriestNeuterPlural], pošlete ozbrojená ďábelská vojska do [target_capital.GetTitle.Custom('CZ_LandedNameNoTier_G')]..."\n\n"Neustoupím od [target.GetTierAsNameNoTooltip], který mi daroval [recipient.GetFaith.HighGodName]."" # todo: NEW TRANSLATION
 pam_interactions_events.0036.desc: "Pošlete další kvílející [recipient.GetFaith.PriestNeuterPlural], pošlete ozbrojená vojska [actor.Custom('GetFighterTermPlural')] do [target_capital.GetTitle.Custom('CZ_LandedNameNoTier_G')]..."\n\n"Tak snadno se [target.GetTierAsNameNoTooltip] nevzdám."" # todo: NEW TRANSLATION
 pam_interactions_events.0036.a_relation: "Jak mě [recipient.GetSheHe] mohl odmítnout?!?" # todo: NEW TRANSLATION
 pam_interactions_events.0036.a: "Odmítnout vůli [secondary_recipient.GetTitleAsNameNoTooltip]? Hanebné..." # todo: NEW TRANSLATION
 clergy_land_transfer_refusal_tt: "Odmítl postoupit [target.GetName] [actor.GetShortUIName]" # todo: NEW TRANSLATION
 pam_interactions_events.0037.opening: "[ROOT.Char.GetFirstNameNicknamed], [ROOT.Char.GetTitleAsNameNoTooltip] [CZPrepZ(ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip)] [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')]," # todo: NEW TRANSLATION
 pam_interactions_events.0037.desc: "Mrzí mě, že vám tuto zprávu musím sdělit tak náhle, ale musím vám oznámit, že [actor.GetTitleAsName] [CZPrepZ(actor.GetPrimaryTitle.GetNameNoTierNoTooltip)] [actor.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] je od nynějška vaším lenním pánem.\n\nTaková je vůle [secondary_recipient.GetTitledFirstNameRegnal], který vedl jednání o vašem [ROOT.Char.GetPrimaryTitle.GetTierAsName] mezi [actor.GetTitledFirstNameNicknamed] a mnou. Jako jste byli věrní [recipient.GetPrimaryTitle.GetNameNoTier], buďte věrní i svému novému lennímu pánovi." # todo: NEW TRANSLATION
 pam_interactions_events.0037_new_liege_tt: "[actor.GetShortUIName] se stal vaším [liege|E]" # todo: NEW TRANSLATION
 pam_interactions_events.0037.a: "Má přísaha už neplatí. Nikdo mi nemůže poroučet." # todo: NEW TRANSLATION
 pam_interactions_events.0037.a.tt: "[recipient.GetTitledFirstNameNoTooltip] se vzdal [recipient.GetHerHis] svrchovanosti. A pokud se jí [actor.GetTitledFirstNameNoTooltip] chce ujmout... [actor.GetSheHe] musí dorazit do [target.Custom('CZ_LandedNameNoTierNoTooltip_G')] dobře ozbrojen." # todo: NEW TRANSLATION
 pam_interactions_events.0037.b: "[actor.GetPrimaryTitle.GetNameNoTierNoTooltip]? Opravdu?" # todo: NEW TRANSLATION
 pam_interactions_events.0037.b.tt: "Když se můj lid dříve obracel pohledem [CZPrepK(recipient.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip)] [recipient.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_D')], předpokládám, že se teď dívá [CZPrepK(actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip)] [actor.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_D')]." # todo: NEW TRANSLATION
