 pam_interactions_events.0101.opening: "Požehnání tvému rodu,"
 pam_interactions_events.0101.desc: "S radostí ti posílám dobrou zprávu. [recipient.GetFirstNameNoTooltip] — [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('recipient'))|l] — má nyní postavení zákonného potomka a svědkem je [ROOT.Char.GetFaith.HighGodName].\n\nŽádný zákon ani pomluva už nesmějí [Select_CString(recipient.IsFemale,'jí','mu')|l] vyčítat narození."
 pam_interactions_events.0101.a: "Opravdu vítaná zpráva."
