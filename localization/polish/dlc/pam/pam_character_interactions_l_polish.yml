 pam_interactions_events.0070.desc: "#EMP zatracení, zkáza — smrt mečem!#!" vykřikne [puppet_or_actor.GetTitledFirstNameRegnal] a jeho poselství se donese k neklidným masám [secondary_recipient.GetPrimaryTitle.GetNameNoTier].\n\n„Pozvedněte svatou korouhev [ROOT.Char.GetFaith.random_GoodGodNames], [ROOT.Char.GetTitledFirstName]! Vyzývám vás, abyste vyhnali [recipient.GetTitledFirstName] [CZPrepZ(target.GetNameNoTierNoTooltip)] [target.Custom('CZ_LandedNameNoTierNoTooltip_G')]! Vhoďte [recipient.GetHerHis] [recipient.GetPrimaryTitle.GetAdjective] [recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)] do plamenů [ROOT.Char.GetFaith.NegativeAfterLife]!“\n\n" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [puppet_or_actor.GetHerHis]
 pam_interactions_events.0070.desc_outro_joining_war: "[puppet_or_actor.GetTitleAsNameNoTooltip] skutečně touží šířit nadvládu [puppet_or_actor.GetFaith.HighGodNamePossessive]! Přísahá, že sám vytáhne do války a dá mi k dispozici své vojsko." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [puppet_or_actor.GetHerHis], [puppet_or_actor.GetHerselfHimself], [puppet_or_actor.GetSheHe|U]
 pam_interactions_events.0070.desc_outro_funding_war: "Tato výzva je podložena penězi: [puppet_or_actor.GetTitleAsNameNoTooltip] slibuje financovat válečnou pokladnu, aby moji [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] poháněla nejen víra." # todo: NEW TRANSLATION
 pam_interactions_events.0070.a: ""[ROOT.Char.GetFaith.WarGodName] stojí při nás! #EMP Do války!#!"" # todo: NEW TRANSLATION
 pam_interactions_events.0070.b: "Nechte lid [recipient.GetTitledFirstNamePossessiveNoTooltip] na pokoji." # todo: NEW TRANSLATION
 cultural_acceptance_gain_refused_incited_holy_war: "Světský vládce zabránil svaté válce" # todo: NEW TRANSLATION
 pam_interactions_events.0071.t: "Dobývání [target.GetNameNoTierNoTooltip] ve jménu [ROOT.Char.GetFaith.HighGodNamePossessive]" # todo: NEW TRANSLATION
 pam_interactions_events.0071.desc_intro: "V bitevních pokřicích, písních i modlitbách za vítězství se [ROOT.Char.GetFaith.HighGodNamePossessive] svaté slovo nese do [target.GetTierAsNameNoTooltip] obývaného [recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)]! Z hlavního [ROOT.Char.GetFaith.HouseOfWorship] [CZPrepV(secondary_recipient.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip)] [secondary_recipient.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_L')] [secondary_recipient.GetName] vyhlašuje svatou válku proti" # todo: NEW TRANSLATION
 pam_interactions_events.0071.desc_intro_pagan: "[recipient.GetPrimaryTitle.GetAdjective] pohané.\n\nJako tupá zvířata se [recipient.GetTitledFirstName] a [recipient.GetHerHis] [recipient.GetCulture.GetCollectiveNoun] jistě rozprchnou před spravedlivým příchodem [secondary_recipient.GetPrimaryTitle.GetNameNoTierPossessive] [secondary_recipient.GetFaith.GetReligion.GetAdjective] vojsk!" # todo: NEW TRANSLATION
 pam_interactions_events.0071.desc_intro_heretic: "[recipient.GetPrimaryTitle.GetAdjective] kacíři.\n\nV mohutné záplavě krve budou [recipient.GetTitledFirstName] a [recipient.GetHerHis] odporní [recipient.GetFaith.GetAdherentNamePlural] smeteni ze země! Takový osud vždy čeká ty, kdo překrucují slovo [ROOT.Char.GetFaith.HighGodName]!" # todo: NEW TRANSLATION
 pam_interactions_events.0071.desc_intro_infidel: "[recipient.GetTitleAsName] [CZPrepZ(recipient.GetPrimaryTitle.GetNameNoTierNoTooltip)] [recipient.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')].\n\n[recipient.GetFaith.GetReligion.GetAdjective] bezvěrci, stejně jako všichni, kdo selhali před Prorokovým #EMP džihádem#!, budou brzy donuceni se podrobit!" # todo: NEW TRANSLATION
 pam_interactions_events.0071.desc_intro_heathen: "[recipient.GetTitleAsName] [CZPrepZ(recipient.GetPrimaryTitle.GetNameNoTierNoTooltip)] [recipient.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')].\n\nPři [ROOT.Char.GetFaith.WarGodName], [secondary_recipient.GetSheHe] pohanská vojska rozdrtí! A všechny národy [ROOT.Char.GetFaith.GetReligion.GetAdjective] budou s úžasem přihlížet." # todo: NEW TRANSLATION
 pam_interactions_events.0071.desc_outro_joining_war: "\n\nMé vlastní vojsko nebude nečinně přihlížet. Ne! Spolu s [secondary_recipient.GetTitledFirstNamePossessiveNoTooltip] [secondary_recipient.Custom('KnightCulturePluralNoTooltip')|l] prolomí hradby [recipient.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_G')]." # todo: NEW TRANSLATION
 pam_interactions_events.0071.desc_outro_rally_crusaders: "\n\nUž nyní se [CZPrepZ(secondary_recipient.GetPrimaryTitle.GetNameNoTierNoTooltip)] [secondary_recipient.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] i zdaleka shromažďují horliví válečníci pod korouhví [secondary_recipient.GetTitledFirstNamePossessiveNoTooltip]." # todo: NEW TRANSLATION
 pam_interactions_events.0071.desc_outro_funding_war: "\n\nVítězství [secondary_recipient.GetTitledFirstNameNoTooltip] slibuje jen přízeň [ROOT.Char.GetFaith.HighGodNamePossessive]. Můj štědrý dar však posílí [secondary_recipient.GetHerHis] odhodlání." # todo: NEW TRANSLATION
 pam_interactions_events.0071.a: "Kéž jsou ti, kdo zemřou za tuto věc, navždy vzorem k závisti." # todo: NEW TRANSLATION
