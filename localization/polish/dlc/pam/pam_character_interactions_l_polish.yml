 pam_interactions_events.0020_indebted: "Jsem jen [secondary_recipient.GetFaith.PriestNeuter] a ve vší pokoře uznávám svůj dluh vůči tobě. Proto se mi podařilo vyhledat nezpochybnitelný důkaz, že [target.GetNameNoTier] právem patří tvé rodové linii a že ti tento titul byl upírán!"
 pam_interactions_events.0020: "Máš právo nárokovat si [target.Custom('CZ_LandedNameNoTier_A')]: starobylé právo z boží prozřetelnosti! Tvé radě předkládám důkazy."
 pam_interactions_events.0020_end: "\n\n[recipient.GetNameRegnal|U] se z tohoto odhalení sotva zaraduje. Ale [secondary_recipient.GetFaith.FateGodName] nedbá na protesty šarlatánů."
 pam_interactions_events.0020.a.low_zeal: "A tak se přepisují dějiny..."
 pam_interactions_events.0020.a.high_zeal: "[target.GetNameNoTierNoTooltip|U] mi patří posvátným právem!"
 pam_interactions_events.0020.a: "Můj nárok je vznesen, ať je [recipient.GetTitledFirstNameNoTooltip] zatracen!"
 pam_interactions_events.0020.toast_puppeteer: "[CZProDrop(secondary_recipient,'udělila','udělil')|U] [puppet_or_actor.Custom('CZ_ShortUIName_D')] nárok na [target.Custom('CZ_LandedNameNoTier_A')]"
 pam_interactions_events.0021.opening: "[actor.Custom('CZ_Name_V')|U],"
 pam_interactions_events.0021: "Kdyby ti bylo souzeno vládnout [target.Custom('CZ_LandedNameNoTier_D')], nepřisoudil by ti tento titul [secondary_recipient.GetFaith.HighGodName] právem narození?\n\nNe, nebudu urážet [recipient.Custom('CZ_TitledFirstNameRegnal_A')] — a zrazovat naše smrtelné duše, tvou i mou — psaním lží pro tvou zlovolnou věc.\n\nModli se nad svými omyly."
 pam_interactions_events.0021.a: "[secondary_recipient.GetFaith.HouseOfWorship|U] a okolní zdi dodávají téhle pošetilé duši odvahu!"
 pam_interactions_events.0021.toast_puppeteer: "[CZProDrop(secondary_recipient,'odmítla','odmítl')|U] žádost od [puppet_or_actor.Custom('CZ_ShortUIName_G')] o nárok na [target.Custom('CZ_LandedNameNoTier_A')]"
 pam_interactions_events.0022.opening: "Držiteli mého dědičného práva,"
 pam_interactions_events.0022_shrimp: "Ačkoli mi náleží jen titul [actor.GetTitleAsName|l], učenci, které naše [actor.GetFaith.GetAdjective|l] víra nazývá [secondary_recipient.GetFaith.AltPriestTermPlural], zjistili, že z mé krve vyplývá starobylý nárok na celé území [target.Custom('CZ_LandedName_G')]."
 pam_interactions_events.0022_shark: "[target.GetName|U] patří mezi tituly, které mé rodové linii s přídomkem [actor.Custom('GetTitleTierAdjective')] přisoudil [actor.GetFaith.HighGodName]. Tak tomu bylo vždy, i když to dosud nebylo známo."
 pam_interactions_events.0022: "Mezi vzdělanými učenci je již dlouho známo — a nyní nově doloženo — že mi právem náleží nárok na [target.Custom('CZ_LandedName_A')]."
 pam_interactions_events.0022_end: "\n\n[secondary_recipient.GetTitledFirstNameRegnal|U] můj nárok posvátně posvěcuje. [secondary_recipient.GetPrimaryTitle.GetName] stojí plně za mnou.\n\nA tak začínám doufat a modlit se, že mě jednoho dne krásná země [target.GetNameNoTierNoTooltip] uvítá jako svého vládce..."
 pam_interactions_events.0022.a: "Lži! Falešný nárok podpořený falešným knězem, který se označuje jako [secondary_recipient.GetFaith.PriestNeuter]!"
 pam_interactions_events.0023.opening: "[Select_CString(secondary_recipient.IsFemale,'Svatá matko','Svatý otče')|U],"
 pam_interactions_events.0023_shrimp: "Kdybych [Select_CString(actor.IsFemale,'měla','měl')|l] v rukou oprávněný nárok, nemohu snad vést [target.Custom('CZ_LandedName_A')] ctnostněji než [actor.Custom2('InsultAdjective', recipient)|l] [recipient.GetFirstNameRegnal]? Prosím, dovol, aby tvou podporu pocítil i někdo s pouhým titulem [actor.GetTitleAsName|l] a aby mě ozářil [actor.GetFaith.HighGodNamePossessive] jas."
 pam_interactions_events.0023_shark: "Jak si přeje [actor.GetFaith.HighGodName], již vládnu rozličným zemím a národům a chráním je. Přesto [target.GetName] leží mimo mé panství i má práva."
 pam_interactions_events.0023: "Mezi věřícími panuje zmatek. Někteří si vroucně přejí, abych [Select_CString(puppet_or_actor.IsFemale,'vznesla','vznesl')|l] nárok na [target.Custom('CZ_LandedName_A')], zatímco jiní popírají, že mám na tento titul jakékoli právo."
 pam_interactions_events.0023_end: "\n\nNěkdo tak učený jako ty přece dokáže v dějinách #EMP objevit#! potřebný důkaz... a poskytnout mi posvěcený nárok na [target.Custom('CZ_LandedNameNoTierNoTooltip_A')]?"
 pam_interactions_events.0023.a: "Ať ti [target.GetNameNoTierNoTooltip] patří, [Select_CString(actor.IsFemale,'má dcero','můj synu')]."
 pam_interactions_events.0023.b: "Držitel titulu [secondary_recipient.GetTitleAsNameNoTooltip|l] nesmí obchodovat se lží."
