 bestow_empire_iberian_struggle_tt: "[recipient.GetShortUIName|U] [Select_CString(recipient.IsLocalPlayer,'nemůžeš','nemůže')|l] získat [Concept('empire','říši')|E] během zapojení do [Concept('iberian_struggle','iberského sváru')|E]"
 pam_interactions_events.0091.opening: "Můj dobrodinče,"
 pam_interactions_events.0091.desc_hook_theocrat: "Tvé přispění mě velmi zavazuje. Do jedné ruky mi vkládá pastýřskou hůl; druhou pevně svírá sám [recipient.GetFaith.HighGodName]. Tak tomu musí být, neboť mu věrně sloužím! [target.GetNameNoTier] je velkolepý dar a já jej přijímám s vděčností.\n\nAť je známo ve všech zemích: z vůle [ROOT.Char.Custom('CZ_TitledFirstNameRegnal_G')] patří toto území s hodností [target.GetTierAsName] duchovenstvu!"
 pam_interactions_events.0091.desc_hook: "Tvé přispění mě velmi zavazuje. Do jedné ruky mi vkládá žezlo vlády; druhou pevně svírá sám [recipient.GetFaith.HighGodName]. Tak tomu musí být. [target.GetNameNoTier] je velkolepý dar a já jej přijímám s vděčností.\n\nAť je známo ve všech zemích: z vůle [ROOT.Char.Custom('CZ_TitledFirstNameRegnal_G')] je toto území s hodností [target.GetTierAsName] mé!"
 pam_interactions_events.0091.desc: "Tvé přispění je požehnáním větším, než jsem si [Select_CString(recipient.IsFemale,'dokázala','dokázal')|l] představit. [Select_CString(ROOT.Char.IsFemale,'Svatá matka','Svatý otec')|U] panství má dlouhý a laskavý dosah — nechť je za to [recipient.GetFaith.HighGodName] veleben!\n\n[target.GetName|U] je vznešená země. Ponesu její titul a budu s pokorou a laskavostí vládnout věřícím zvaným [recipient.GetFaith.GetAdherentNamePlural]."
 pam_interactions_events.0091.a: "Budu [target.Custom('CZ_LandedNameNoTierNoTooltip_A')] bedlivě sledovat."
 pam_interactions_events.0092.opening_theocratic: "Ctihodný duchovní, kterému náleží označení [ROOT.Char.GetFaith.PriestNeuter],"
 pam_interactions_events.0092.opening: "Mé dítě s přívlastkem [ROOT.Char.Custom('GetTitleTierAdjective')|l],"
 pam_interactions_events.0092.desc_hook: "Když se modlíš nad mocným darem, který ti udělil [recipient.GetFaith.HighGodName] se svými preláty, dobře zvaž, nakolik si toto území s hodností [target.GetTierAsName] zasluhuješ. Možná máš před sebou ještě další zbožné povinnosti.\n\nV tom ti poskytnu své rady. Musíme zajistit, aby tvá vláda v [target.Custom('CZ_LandedNameNoTierNoTooltip_L')] byla taková, jakou si [recipient.GetFaith.HighGodName] přeje."
 pam_interactions_events.0092.desc: "Tvé území s hodností [target.GetTierAsNameNoTooltip] je vyhlášeno!\n\nPod vedením svých modliteb věnuji tvému vzestupu zvláštní pozornost. Žádám pouze dobrou vládu, aby tvé panování bylo požehnáním pro věřící zvané [recipient.GetFaith.GetAdherentNamePlural] v [target.Custom('CZ_LandedNameNoTier_L')]."
 pam_interactions_events.0092.a: "Mandát přímo z místa zvaného [recipient.GetFaith.PositiveAfterLife]!"
 request_unformed_title_interaction: "Prosit o titul"
 request_unformed_title_interaction_desc: "Požádat [recipient.Custom('CZ_ShortUIName_A')] o vyhlášení nevytvořeného [Concept('title','titulu')|E], který stojí [Concept('de_jure','de iure')|E] nad tvými zeměmi, a jeho předání do tvých rukou"
 REQUEST_UNFORMED_TITLE_NOTIFICATION: "[target.GetName|U] zeje prázdnotou příliš dlouho, přestože jeho země už jsou mé ve všem kromě jména. Vyhlas tento titul a každý věřící zvaný [puppet_or_actor.GetFaith.GetAdherentName] bude vědět, že jej držím z milosti, kterou dává [puppet_or_actor.GetFaith.HighGodName], i z tvé."
