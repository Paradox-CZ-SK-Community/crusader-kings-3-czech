 DEMAND_DIVORCE_NOTIFICATION: "Je mou povinností žádat, abys [Select_CString(recipient.IsFemale,'odložila','odložil')|l] svůj manželský protějšek, [secondary_recipient.Custom('CZ_TitledFirstName_A')]."
 DEMAND_DIVORCE_NOTIFICATION_INCESTUOUS: "\n\nS [secondary_recipient.Custom('CZ_FirstNameNoTooltip_I')] tě pojí krev a celý svět to ví. Takové krvesmilstvo nemůže trpět [actor.GetFaith.HighGodName]."
 DEMAND_DIVORCE_NOTIFICATION_SAME_SEX: "\n\nTvůj svazek se vysmívá manželskému loži, jak je ustanovil [actor.GetFaith.HighGodName]. Nelze ho trpět."
 DEMAND_DIVORCE_NOTIFICATION_HEATHEN: "\n\n[secondary_recipient.GetFirstNameNoTooltip|U] se klaní cizím bohům, a přesto sdílí tvé lože. Nemohu takový svazek trpět."
 DEMAND_DIVORCE_NOTIFICATION_HERETIC: "\n\n[secondary_recipient.GetFirstNameNoTooltip|U] se odklání od pravé víry a strhává s sebou tvou duši. Takový svazek nelze trpět."
 DEMAND_DIVORCE_NOTIFICATION_INFIDELITY: "\n\nCelý svět ví, že [secondary_recipient.GetFirstNameNoTooltip] zrazuje vaše manželské lože. To, co je rozbité, musí být nyní ukončeno."
 DEMAND_DIVORCE_NOTIFICATION_POLYGAMY: "\n\n[secondary_recipient.Custom('CZ_FirstNameNoTooltip_A')|U] máš jen jako jeden z mnoha manželských protějšků, což se příčí vůli, kterou hlásá [actor.GetFaith.HighGodName]. Nelze to trpět."
 DEMAND_DIVORCE_NOTIFICATION_PRETEXT: "\n\nUčení muži vysledovali tvou rodovou linii i linii [secondary_recipient.Custom('CZ_FirstNameNoTooltip_G')] a zjistili, že se prolínají v zakázaných stupních. Pokrevní příbuzenství — závěry jsou zcela průkazné."
