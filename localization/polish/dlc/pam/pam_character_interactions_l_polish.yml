 pam_interactions_events.0100.desc: "[ROOT.Char.GetFaith.HighGodName|U] i shromáždění věřící jsou svědky, jak mě [actor.GetTitledFirstName] prohlašuje za zákonného potomka. Duchovenstvo mi svatými obřady a tahem pera uděluje to, co mi upřelo narození.\n\nOznačení levoboček už nikdy neuslyším."
