 pam_interactions_events.0097.desc: "Vaší žádosti bylo vyhověno. [target.GetName] zůstával neobsazený, zatímco duše [ROOT.Char.GetFaith.GetAdherentName] tamních věřících byly bez pastýře, což nebyl dobrý způsob, jak uctít [ROOT.Char.GetFaith.HighGodName].\n\nNoste jej pokorně. [title|E], který udělí církev, zůstává její starostí." # todo: NEW TRANSLATION
 pam_interactions_events.0097.desc_holy_war: "Vaší žádosti bylo vyhověno a váš slib byl zaznamenán, aby nebyl zapomenut. [target.GetName] je váš, přesto se jeho část stále klaní těm, kdo popírají [ROOT.Char.GetFaith.HighGodName].\n\nJděte a získejte to, co váš titul již označuje za vaše. Žádný věrný [ROOT.Char.GetFaith.PriestNeuter] nebude vaši válku zpochybňovat, ale za pět let se zeptáme, jaký měla výsledek. Nečinný slib je porušený slib." # todo: NEW TRANSLATION
