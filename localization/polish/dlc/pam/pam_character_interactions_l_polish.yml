 ecclesiastical_bestow_title_interaction_desc: "Pomocí své duchovní autority udělit dosud nevytvořený [Concept('title','titul')|E] přímo [recipient.Custom('CZ_ShortUIName_D')] a případně tak zvýšit [Select_CString(recipient.IsLocalPlayer,'tvou',Select_CString(recipient.IsFemale,'její','jeho'))|l] [Concept('rank','hodnost')|E]"
 ecclesiastical_bestow_title_interaction_toast: "[target.GetNameNoTierNoTooltip|U]: uděleno"
 ecclesiastical_bestow_title_interaction_effect_tt: "[target.GetName|U] se vytvoří a udělí [recipient.Custom('CZ_ShortUIName_D')]"
 ECCLESIASTICAL_BESTOW_TITLE_NOTIFICATION: "Všichni věřící tvého panství, kteří hlásají [CZReligionAdjDecline(recipient.GetFaith.GetReligion,'ou')|l] víru, zasluhují mír a prosperitu, kterými [recipient.GetFaith.HighGodName] žehná území s hodností [target.GetTierAsNameNoTooltip] hlásajícímu tutéž víru. Proto chci vyhlásit [target.Custom('CZ_LandedName_A')] a svěřit ti jeho správu."
 ecclesiastical_bestow_title_asks_nothing_tt: "[recipient.GetShortUIName|U] [Select_CString(recipient.IsLocalPlayer,'nemůžeš','nemůže')|l] odmítnout [Concept('title','titul')|E] udělený bez podmínek"
