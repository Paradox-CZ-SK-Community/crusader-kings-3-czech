 pam_interactions_events.0020: "Je tvým právem vznést nárok na [target.Custom('CZ_LandedNameNoTier_A')]: prastaré právo udělené božskou prozřetelností! Dodal jsem tvé radě důkazy, které to potvrzují." # todo: NEW TRANSLATION
