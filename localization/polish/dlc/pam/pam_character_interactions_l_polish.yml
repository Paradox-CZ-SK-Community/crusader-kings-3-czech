 pam_interactions_events.0072.desc_joined_war: "Nyní přicházím za tebou. Jako misionář, abych vnesl světlo do tvé temnoty. Jako [puppet_or_actor.GetMotherFather], abych tě potrestal.\n\nPo boku tvého [puppet_or_actor.Custom('MotherFatherPossessive')] přichází válečník [puppet_or_actor.GetFaith.GoodGodNames], [secondary_recipient.GetName]. [secondary_recipient.GetHerHis|U] vojska osvobodí [target.GetNameNoTier] od jeho zla." # todo: NEW TRANSLATION
 pam_interactions_events.0072.desc: "Už je příliš pozdě. Pokání nepřipadá v úvahu.\n\nHle, zlovolná země [recipient.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] bude rozervána! Hle, služebníci [puppet_or_actor.GetFaith.DevilName] budou pobiti! Pozvedl jsem zbraně věřících a poslal [secondary_recipient.GetName], aby tě zničil!" # todo: NEW TRANSLATION
 pam_interactions_events.0072.a: "[puppet_or_actor.GetFaith.HighGodName] musí být krutý, když na nás posílá takové [puppet_or_actor.GetWomenMen]!" # todo: NEW TRANSLATION
 incite_holy_war_past_tense_tt: "[puppet_or_actor.GetShortUIName] přiměl [secondary_recipient.GetShortUIName], aby vyhlásil [holy_war|E] o [target.GetName]" # todo: NEW TRANSLATION
