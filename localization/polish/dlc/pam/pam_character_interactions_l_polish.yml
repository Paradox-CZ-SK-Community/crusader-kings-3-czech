 pam_interactions_events.0094.desc_conversion: "Šiřte slovo [cleric.GetFaith.HighGodName] po celé [target.GetNameNoTier]! Nešetřete holí na jeho zbloudilém lidu ani silou svých [ROOT.Char.Custom('GetFighterTermPlural')], když bráníte ctnosti této země.\n\n[ target.GetTierAsNameNoTooltip] vám náleží k vládnutí. Až do konce věků je svěřeno prozřetelnosti každého [ROOT.Char.GetPrimaryTitle.GetAdjective] [ROOT.Char.GetTitleAsName], #EMP de jure#!." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [target.GetTierAsNameNoTooltip]; navyše [ target.GetTierAsNameNoTooltip]
