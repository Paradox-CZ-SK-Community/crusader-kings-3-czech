 ecclesiastical_de_jure_shifting_grant_interaction_notification: "Jako [Select_CString(puppet_or_actor.IsFemale,'matka','otec')] pečuje o milované dítě, přeji si, aby [puppet_or_actor.GetPrimaryTitle.GetName] navěky živilo a chránilo [target.Custom('CZ_LandedName_A')]. Vyhlašme tento vztah za zákonný a posvátný."
 pam_interactions_events.0096.opening: "[ROOT.Char.GetFaith.random_GoodGodNames|U] má rozvážnou ruku!"
 pam_interactions_events.0096.desc: "Oddělení [target.Custom('CZ_LandedNameNoTier_G')] od [former_de_jure_liege.Custom('CZ_LandedNameNoTier_G')] je nanejvýš moudrý a požehnaný skutek!\n\nAť je tomu, jak nařizuješ: po všechny věky bude [de_jure_master.GetPrimaryTitle.GetNameNoTier] oporou mezi tímto územím s hodností [target.GetTierAsNameNoTooltip] a místem zvaným [ROOT.Char.GetFaith.PositiveAfterLife], aby věrní věřící zvaní [ROOT.Char.GetFaith.GetAdherentNamePlural] z [target.Custom('CZ_AdjectiveNoTooltip_eeho')|l] území byli navždy vedeni k světlu, které září jako [ROOT.Char.GetFaith.HighGodNamePossessive] dar.\n\nTo zahrnu do své posvátné přísahy spojené s postavením [de_jure_master.Custom('GetTitleTierAdjective')|l]."
 pam_interactions_events.0096.a: "Kéž se toto skutečně ukáže být souladným svazkem."
