 pam_interactions_events.0050.opening: "[recipient.Custom('CZ_TitledFirstNameRegnal_V')|U],"
 pam_interactions_events.0050.desc: "Posvátný text [puppet_or_actor.GetFaith.ReligiousText] říká, že manželství je svatý svazek. V živém světě mužů a žen... už tak dokonalé není.\n\nOdmítáš oddělit [secondary_recipient.Custom('CZ_TitledFirstName_A')] a mě. Co máme dělat s troskami, které zbyly...?"
 pam_interactions_events.0050.aa: "Utrpení vám působí tělesná touha."
 pam_interactions_events.0050.aa.tt: "Naučit tuto necitelnou duši, co je třeba k odřeknutí všech potřeb a očekávání těla..."
 pam_interactions_events.0050.a: "Cesty, na jejichž konci čeká blaženost — [recipient.GetFaith.PositiveAfterLife]? Láska. Oddanost."
 pam_interactions_events.0050.a.tt: "Pod tvým vedením může tento téměř zničený pár najít spásu jeden v druhém."
 pam_interactions_events.0050.b: "Ctěte sliby, jejichž svědky byli [recipient.GetFaith.GoodGodNames]."
 pam_interactions_events.0050.c: "Toto opovržení svatým manželstvím je rouhání!"
 pam_interactions_events.0050.d: "Modlete se společně za vedení, které poskytuje [recipient.GetFaith.HighGodName]."
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS: "\n\nUkončíš krvesmilný svazek, nepřirozené uspořádání!"
 ASK_FOR_DIVORCE_NOTIFICATION_SAME_SEX: "\n\nNaše [CZFaithAdjDecline(puppet_or_actor.GetFaith,'á')|l] víra mě nutí vypudit ze svého lože [Select_CString(secondary_recipient.IsFemale,'tuto ženu','tohoto muže')]!"
 ASK_FOR_DIVORCE_NOTIFICATION_IMPOTENCE: "\n\nVěz, že [secondary_recipient.GetFirstNameNoTooltip] čelí obvinění z žalostné impotence..."
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_LOVER: "\n\n[secondary_recipient.GetFirstNameNoTooltip|U] se otevřeně dopouští odporného krvesmilstva a pohrdá naším svazkem! Je to hanba!"
 ASK_FOR_DIVORCE_NOTIFICATION_EXPOSED_CHEATING: "\n\n[secondary_recipient.GetFirstNameNoTooltip|U] mi nezachovává věrnost a všichni to vědí!"
 ASK_FOR_DIVORCE_NOTIFICATION_EUNUCH: "\n\n[puppet_or_actor.GetFaith.HighGodName|U] chce, abych [Select_CString(puppet_or_actor.IsFemale,'žila','žil')|l] v manželství s mužem! A [secondary_recipient.GetFirstNameNoTooltip]... nemá mužství, o němž by stálo za to mluvit."
 ASK_FOR_DIVORCE_NOTIFICATION_ATTEMPTED_MURDER: "\n\nNechť mi [puppet_or_actor.GetFaith.HighGodName] svědčí, tento ďábelský protějšek — [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))|l] — se mě [Select_CString(secondary_recipient.IsFemale,'pokusila','pokusil')|l] nechat zavraždit!"
 ASK_FOR_DIVORCE_NOTIFICATION_MULTIPLE_CONSORTS: "\n\n[secondary_recipient.GetFirstNameNoTooltip|U] žije v mnohoženství! Já jsem jen jedním kusem v [Select_CString(secondary_recipient.IsFemale,'jejím','jeho')|l] stádu majetku. Osvoboď mě!"
 ASK_FOR_DIVORCE_NOTIFICATION_HOSTILE_FAITH: "\n\n[puppet_or_actor.GetFaith.HighGodName|U] si jistě nepřeje, abych dál [Select_CString(puppet_or_actor.IsFemale,'sdílela','sdílel')|l] lože s odporným pohanem, který hlásá [CZFaithAdjDecline(secondary_recipient.GetFaith,'ou')|l] víru?"
 ASK_FOR_DIVORCE_NOTIFICATION_ADULTERY_TRAIT: "\n\nNení tajemstvím, proč tě o to prosím! [secondary_recipient.GetFirstNameNoTooltip], [puppet_or_actor.Custom2('InsultNoun', SCOPE.sC('secondary_recipient'))|l] bez špetky studu, mi nezachovává věrnost."
 ASK_FOR_DIVORCE_NOTIFICATION_INFERTILITY: "\n\nNaše manželství je bezdětné a nemá naději, že kdy ponese ovoce."
 ASK_FOR_DIVORCE_NOTIFICATION_HATRED: "\n\nMusíš vymyslet nějaké zdůvodnění, ale nechť mi [puppet_or_actor.GetFaith.HighGodName] svědčí! Má nenávist k [secondary_recipient.Custom('CZ_FirstNameNoTooltip_D')] by sama měla stačit."
 ASK_FOR_DIVORCE_NOTIFICATION_NOT_JUSTIFIED: "\n\nNepředkládám žádné právní zdůvodnění... ale věřím, že díky své znalosti náboženského práva #EMP objevíš#! důvody ke zrušení manželství."
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_SECONDARY: "\n\nUkončíš krvesmilný svazek, nepřirozené uspořádání!"
 ASK_FOR_DIVORCE_NOTIFICATION_SAME_SEX_SECONDARY: "\n\nNaše [CZFaithAdjDecline(puppet_or_actor.GetFaith,'á')|l] víra mě nutí vypudit [Select_CString(secondary_recipient.IsFemale,'tuto ženu','tohoto muže')] z lože [puppet_or_actor.Custom2('CZ_RelationToMeShort_G',SCOPE.sC('secondary_actor'))|l]!"
 ASK_FOR_DIVORCE_NOTIFICATION_IMPOTENCE_SECONDARY: "\n\nVěz, že [secondary_recipient.GetFirstNameNoTooltip] čelí obvinění z žalostné impotence..."
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_LOVER_SECONDARY: "\n\n[secondary_recipient.GetFirstNameNoTooltip|U] se otevřeně dopouští odporného krvesmilstva a pohrdá jejich svazkem! Je to hanba!"
 ASK_FOR_DIVORCE_NOTIFICATION_EXPOSED_CHEATING_SECONDARY: "\n\n[secondary_recipient.GetFirstNameNoTooltip|U] nezachovává věrnost [puppet_or_actor.Custom2('CZ_RelationToMeShort_D',SCOPE.sC('secondary_actor'))|l] a všichni to vědí!"
 ASK_FOR_DIVORCE_NOTIFICATION_EUNUCH_SECONDARY: "\n\n[puppet_or_actor.GetFaith.HighGodName|U] chce, aby [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))|l] [Select_CString(secondary_actor.IsFemale,'žila','žil')|l] v manželství s mužem! A [secondary_recipient.GetFirstNameNoTooltip]... nemá mužství, o němž by stálo za to mluvit."
 ASK_FOR_DIVORCE_NOTIFICATION_ATTEMPTED_MURDER_SECONDARY: "\n\nNechť mi [puppet_or_actor.GetFaith.HighGodName] svědčí, tento ďábelský protějšek — [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))|l] — se [Select_CString(secondary_recipient.IsFemale,'pokusila','pokusil')|l] nechat zavraždit [puppet_or_actor.Custom2('CZ_RelationToMeShort_A',SCOPE.sC('secondary_actor'))|l]!"
 ASK_FOR_DIVORCE_NOTIFICATION_MULTIPLE_CONSORTS_SECONDARY: "\n\n[secondary_recipient.GetFirstNameNoTooltip|U] žije v mnohoženství! [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))|U] je jen jedním kusem v [Select_CString(secondary_recipient.IsFemale,'jejím','jeho')|l] stádu majetku. Osvoboď [secondary_actor.Custom('CZ_ShortUIName_A')]!"
 ASK_FOR_DIVORCE_NOTIFICATION_HOSTILE_FAITH_SECONDARY: "\n\n[puppet_or_actor.GetFaith.HighGodName|U] si jistě nepřeje, aby [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))|l] dál [Select_CString(secondary_actor.IsFemale,'sdílela','sdílel')|l] lože s odporným pohanem, který hlásá [CZFaithAdjDecline(secondary_recipient.GetFaith,'ou')|l] víru?"
 ASK_FOR_DIVORCE_NOTIFICATION_ADULTERY_TRAIT_SECONDARY: "\n\nNení tajemstvím, proč tě o to prosím! [secondary_recipient.GetFirstNameNoTooltip], [puppet_or_actor.Custom2('InsultNoun', SCOPE.sC('secondary_recipient'))|l] bez špetky studu, nezachovává věrnost [puppet_or_actor.Custom2('CZ_RelationToMeShort_D',SCOPE.sC('secondary_actor'))|l]."
 ASK_FOR_DIVORCE_NOTIFICATION_INFERTILITY_SECONDARY: "\n\nJejich manželství je bezdětné a nemá naději, že kdy ponese ovoce."
 ASK_FOR_DIVORCE_NOTIFICATION_HATRED_SECONDARY: "\n\nMusíš vymyslet nějaké zdůvodnění, ale nechť mi [puppet_or_actor.GetFaith.HighGodName] svědčí! Naše nenávist k [secondary_recipient.Custom('CZ_FirstNameNoTooltip_D')] by sama měla stačit."
 ASK_FOR_DIVORCE_NOTIFICATION_NOT_JUSTIFIED_SECONDARY: "\n\nNepředkládám žádné právní zdůvodnění... ale věřím, že díky své znalosti náboženského práva #EMP objevíš#! důvody ke zrušení manželství."
 DIVORCE_INDUCEMENTS: "Zajistit souhlas příjemce:"
 cleric_divorce_fuckery_tt: "@alert_icon! #bold #alert_trial Protože [puppet_or_actor.GetShortUIName] [Select_CString(puppet_or_actor.IsLocalPlayer,Select_CString(puppet_or_actor.IsFemale,'jsi nezvolila','jsi nezvolil'),Select_CString(puppet_or_actor.IsFemale,'nezvolila','nezvolil'))] žádný způsob, jak #high zajistit souhlas příjemce#! #weak (níže)#!:#!#!"
 cleric_cause_house_feud_tt: "Může způsobit [Concept('house_feud','rodovou mstu')|E] mezi [Concept('houses','rody')|E] [divorcer.GetHouse.GetName] a [secondary_recipient.GetHouse.GetName]"
 cleric_force_holy_order_lease_tt: "Může [Concept('lease','pronajmout')|E] jedno z [Concept('holdings','držav')|E] pod vládou [divorcer.Custom('CZ_ShortUIName_G')] [Concept('holy_order','svatému řádu')|E]"
 cleric_get_hook_tt: "Může získat @hook_on_me_icon![Concept('hook','páku')|E] na [divorcer.Custom('CZ_ShortUIName_A')]"
