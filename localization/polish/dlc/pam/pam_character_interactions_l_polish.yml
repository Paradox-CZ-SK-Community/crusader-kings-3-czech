 pam_interactions_events.0090.opening: "Ó [Select_CString(puppet_or_actor.IsFemale,'matko','otče')] panství,"
 pam_interactions_events.0090.desc: "[recipient.GetFaith.HighGodName|U] opravdu shlíží na [recipient.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_A')] s laskavou přízní! Tvým prohlášením získávám titul [recipient.GetTitleAsName|l] v této zemi a věřící, kteří hlásají [CZFaithAdjDecline(recipient.GetFaith,'ou')|l] víru, jásají.\n\nSvým životem budu chránit toto území s hodností [recipient.GetPrimaryTitle.GetTierAsName]. Svými zákony je budu moudře spravovat. Svým mečem a žezlem mu budu pevně vládnout. A budu pozorně naslouchat tvým radám."
 pam_interactions_events.0090.a: "[actor.GetFaith.HighGodName|U] nám udělil nového panovníka s titulem [recipient.GetTitleAsNameNoTooltip|l]."
 pam_interactions_events.0090.a.flavor: "A ve své moudrosti... učinil [recipient.Custom('CZ_FirstNameNoTooltip_A')] [recipient.Custom('CZ_TitleAsNameNoTooltip_I')|l] s velkým dluhem vůči mně."
 has_valid_exclave_duchy_tt: "[Concept('duchies','Vévodství')|EU], která budou přidána ke [Concept('kingdom','království')|E] pod vládou [recipient.Custom('CZ_ShortUIName_G')], musejí sousedit s každým vévodstvím, které se jeho vytvořením stane exklávou [Concept('de_jure','de iure')|E]: vévodstvím bez hlavního sídla, které už nebude sousedit s ostatními vévodstvími svého království."
