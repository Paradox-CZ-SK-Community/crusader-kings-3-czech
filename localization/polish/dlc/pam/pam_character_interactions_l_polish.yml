 must_be_same_tier_or_one_higher_tt: "Můžeš udělit pouze [Concept('titles','tituly')|E] na [Concept('title_tier','úrovni titulu')|E] [recipient.Custom('CZ_ShortUIName_G')] nebo o jednu úroveň výše"
 clerical_hesitation_high_bestowing_tt: "#weak #EMP Ztratíš [Concept('spiritual_fulfillment','duchovní naplnění')|E], protože [recipient.Custom('CZ_ShortUIName_A')] považuješ za nemorálního [Concept('ruler','vládce')|E]"
