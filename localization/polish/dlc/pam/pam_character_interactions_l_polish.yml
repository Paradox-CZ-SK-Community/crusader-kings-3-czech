 pam_clergy_land_possible_success_tt: "@warning_icon! #X #bold [recipient.Custom('CZ_ShortUIName_A')|U] je třeba přesvědčit a i tak může tuto [Concept('interaction','interakci')|E] odmítnout#!#!"
 clergy_land_if_accepted_tt: "#alert_trial #bold Pokud [recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer,'přijmeš','přijme')|l]:#!#!"
 clergy_transfer_vassal_tt: "[target.GetHolder.GetShortUIName|U] [Select_CString(target.GetHolder.IsLocalPlayer,'se staneš','se stane')] [Concept('vassal','vazalem')|E] pro [actor.Custom('CZ_ShortUIName_A')]"
 pam_interactions_events.0031.opening: "[Select_CString(actor.IsFemale,'Má svéhlavá dcero','Můj svéhlavý synu')|U],"
 pam_interactions_events.0031.desc: "[actor.GetFaith.HighGodName|U] ti dal rty, aby pronášely spravedlivá slova. [actor.GetFaith.HighGodName] ti dal ruce, aby třímaly meč. A [actor.GetFaith.HighGodName] určil, že [actor.GetFaith.PriestNeuterPlural] mají vést svět svou moudrostí, které máš naslouchat.\n\nChamtivost tě pohlcuje a pronášíš nespravedlivá slova. Bázlivé pochybnosti tě zmítají a zadržuješ meč, který toužíš použít proti [target.Custom('CZ_LandedNameNoTier_D')].\n\nA tak je řešení jediné: musíš naslouchat mé moudrosti... a nechat toto území s hodností [target.GetTierAsName] na pokoji."
 pam_interactions_events.0031.a: "[secondary_recipient.GetTitleAsNameNoTooltip|U] mou věc odmítá!"
 pam_interactions_events.0033.opening: "Strážce nebeského i pozemského řádu,"
 pam_interactions_events.0033_de_jure: "Žádám tě o pomoc. Prohlaš, že má vláda právem sahá nad území [target.Custom('CZ_LandedName_G')] — které mi náleží právem de iure. Dej mi své posvěcení, abych [Select_CString(actor.IsFemale,'mohla','mohl')|l] přesvědčit [recipient.Custom('CZ_Name_A')] bez krveprolití.\n\n"
 pam_interactions_events.0033_claim: "Usiluji o naplnění svého nároku na [target.Custom('CZ_LandedNameNoTier_A')]. Dej mi své svaté posvěcení, aby [recipient.GetName] [Select_CString(recipient.IsFemale,'mohla','mohl')|l] toto území s hodností [target.GetTierAsName] předat, aniž by se prolila [CZFaithAdjDecline(actor.GetFaith,'á')|l] krev.\n\n"
 pam_interactions_events.0033_threaten: "Pokud mou žádost odmítneš... budeš to #EMP ty#!, kdo se bude muset zodpovídat, až [ROOT.Char.GetFaith.HighGodName] bude žádat vysvětlení masakru a požárů, které přinesu do [target.Custom('CZ_LandedNameNoTierNoTooltip_G')]."
 pam_interactions_events.0033_succession: "Pokud promluvíš v můj prospěch, nabízím ti tento slib: zemřu-li jako [actor.GetTitleAsName|l] v [actor.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_L')] — bez dětí svého rodu — připadne [actor.GetPrimaryTitle.GetNameNoTier] církvi."
 pam_interactions_events.0033_pilgrimage: "Za tvé posvátné svolení v této pozemské záležitosti slibuji vykonat pouť: projev vděčnosti za požehnání, která mi udělil [actor.GetFaith.HighGodName]."
 pam_interactions_events.0033_use_hook: "Jistě si pamatuješ... že tvé jméno se zapisuje na můj příkaz a slova tvého pera se musejí řídit mými rozmary...?"
 pam_interactions_events.0033_offer_hook: "Propůjčit mé věci tvou zbožnou pověst není malá laskavost. Podpoř mě v této pozemské politice a já tě podpořím v nadcházejících dnech."
 pam_interactions_events.0033_donate: "Poskytni mi pomoc, obohať mé panství o půdu a já ochotně přispěji do tvých zbožných pokladnic."
 pam_interactions_events.0033_fallback: "Pokud jednání o půdě a titulu nezahájí svatý prostředník, nikam nepovedou. Propůjčíš mé věci svou posvátnou autoritu?"
 pam_interactions_events.0033.aa: "Ano. Je to hotovo."
 pam_interactions_events.0033.a: "Na můj příkaz musí [target.GetNameNoTier] patřit [actor.Custom('CZ_FirstNameNoTooltip_D')]."
 pam_interactions_events.0033.a.tt: "Poslat [recipient.Custom('CZ_TitledFirstNameNoTooltip_D')] dopis: lpět na neprávem držené půdě znamená pohrdat posvátnou vůlí, kterou hlásá [secondary_recipient.GetFaith.HighGodName], i úřadem [secondary_recipient.GetTitleAsNameNoTooltip|l]!"
 pam_interactions_events.0033.b: "Tento nestoudný požadavek nemohu posvětit."
 pam_interactions_events.0033.b.tt: "Svět má svůj řád takový, jaký je. [recipient.GetTitledFirstNameNoTooltipRegnal] si musí ponechat [target.Custom('CZ_LandedNameNoTierNoTooltip_A')]."
 clergy_land_inform_priest_might_fail_tt: "@warning_icon! #X #bold [actor.GetShortUIName|U] se [Select_CString(actor.IsLocalPlayer,'pokusíš','pokusí')|l] přesvědčit [recipient.Custom('CZ_ShortUIName_A')] k předání [target.Custom('CZ_LandedName_G')] do svých rukou a může neuspět#!#!"
 clergy_land_inform_priest_can_force_tt: "@alert_icon! #alert_trial #bold [actor.GetShortUIName|U] [Select_CString(actor.IsLocalPlayer,'můžeš','může')|l] přinutit [recipient.Custom('CZ_ShortUIName_A')] k předání [target.Custom('CZ_LandedName_G')] do svých rukou, ale může se rozhodnout riskovat neúspěch#!#!"
 clergy_land_inform_priest_will_happen_tt: "#P #EMP #bold [recipient.GetShortUIName|U] [Select_CString(recipient.IsLocalPlayer,'předáš','předá')|l] [target.Custom('CZ_LandedName_A')] [actor.Custom('CZ_ShortUIName_D')] bez odporu#!#!#!"
 high_church_authority_unlock_land_transfer_tt: "#P #EMP #bold Tvůj [Concept('law','zákon')|E] [GetLaw('church_authority_3').GetName] ti dovoluje přinutit [recipient.Custom('CZ_ShortUIName_A')] k předání [target.Custom('CZ_LandedName_G')] [actor.Custom('CZ_ShortUIName_D')] bez odporu#!#!#!"
 pam_interactions_events.0032.opening: "Jako svatý rozhodčí tímto zahajuji jednání."
 pam_interactions_events.0032_intro: "O území [target.Custom('CZ_LandedNameNoTier_G')] se staráš zdatně, ale [recipient.GetFaith.HighGodName] si přeje, aby toto území s hodností [target.GetTierAsNameNoTooltip] patřilo [actor.Custom('CZ_Name_D')]. Můžeme tě požádat, abys [Select_CString(actor.IsFemale,'jí','mu')|l] tuto půdu [Select_CString(recipient.IsFemale,'předala','předal')|l] bez krveprolití?\n\n"
 pam_interactions_events.0032_de_jure: "Neboť [target.GetNameNoTierNoTooltip] patří [actor.Custom('CZ_Name_D')] právem #EMP de iure#!."
 pam_interactions_events.0032_claim: "Neboť v očích Všemohoucího je nárok [actor.Custom('CZ_Name_G')] na [target.Custom('CZ_LandedNameNoTierNoTooltip_A')] ze všech nejoprávněnější."
 pam_interactions_events.0032.aa: "Tak, kde mám pero..."
 pam_interactions_events.0032.aa.flavor: "Celému světu dokážu, že [recipient.GetFaith.HighGodName] těmto hříšným šarlatánům odepřel každou ctnost, kterou ctí [recipient.GetFaith.GetAdjectiveNoTooltip|l] víra. Mají — a vždy budou mít — jen nestoudnou drzost."
 clergy_interaction_scholar_block_tt: "#P #bold #EMP Pokus [actor.Custom('CZ_ShortUIName_G')] o získání [target.Custom('CZ_LandedName_G')] selže#!#!#!"
 pam_interactions_events.0032.a: "Pokud si to [actor.GetFaith.HighGodName] přeje, vzdám se [target.Custom('CZ_LandedNameNoTierNoTooltip_G')]."
 pam_interactions_events.0032.b: "Ne. Ani jeden z vás mě nepřesvědčil."
 pam_interactions_events.0032.b.tt: "Kéž by se [actor.GetTitledFirstNameNoTooltip] a [secondary_recipient.GetTitledFirstNameNoTooltip] dali umlčet tak snadno..."
 clerical_land_transfer_actor_attempt_tt: "@alert_icon! #alert_trial #bold K souhlasu se zabráním [target.Custom('CZ_LandedName_G')] pro [actor.Custom('CZ_Name_A')] tě může přimět jeden z následujících způsobů:#!#!"
 pam_interactions_events.0030.t: "Jednání o [target.Custom('CZ_LandedNameNoTierNoTooltip_L')]"
 pam_interactions_events.0030.desc_intro_envoy: "Na posvátné půdě můj vyslanec [secondary_recipient.GetTitledFirstNameRegnal] předkládá mé důvody pro získání [target.Custom('CZ_LandedNameNoTier_G')]."
 pam_interactions_events.0030.desc_intro: "S požehnáním [secondary_recipient.Custom('CZ_TitledFirstNameRegnal_G')] a pod ochranou posvátné půdy předkládám své důvody pro získání [target.Custom('CZ_LandedNameNoTier_G')]."
 pam_interactions_events.0030.desc: "Slova o mírové shodě protkaná hrozbami války. Prohlášení o mých právoplatných nárocích. A stále dokola...\n\n"
 pam_interactions_events.0030.desc_target: "[recipient.GetTitledFirstNameNicknamed|U] se svého území s hodností [target.GetTierAsNameNoTooltip] nevzdá tak levně. Tuto záležitost půdy je třeba zpečetit pozemskými sliby nebo zlovolnými hrozbami."
 pam_interactions_events.0030.desc_vassal: "[recipient.GetTitledFirstNameNicknamed|U] se nadvlády nad [vassal.Custom('CZ_Name_I')] nevzdá tak levně. Pozlacenými nabídkami či hrozivými výhrůžkami: svého vazala si musím zasloužit."
 pam_interactions_events.0030.a: "Připomenout [recipient.Custom('CZ_FirstNameNoTooltip_D')] jisté... povinnosti."
 pam_interactions_events.0030.a.flavor: "A že je může vymáhat právě [actor.GetTitleAsNameNoTooltip|l] v [actor.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')]!"
 pam_interactions_events.0030.b: "Vztah označovaný jako [ROOT.Char.Custom2('RelationToMe', recipient)|l] nepotřebuji. Potřebuji [target.Custom('CZ_LandedNameNoTierNoTooltip_A')]."
 pam_interactions_events.0030.b.flavor: "Dát najevo: pokud [recipient.GetFirstNameNoTooltip] odmítne, nic pro tebe neznamená."
 pam_interactions_events.0030.c: "Pokud se nepodvolí, znesvětím tuto posvátnou půdu."
 pam_interactions_events.0030.c.tt: "Zahrnout špinavou hříšnou duši odpornými obviněními! Přivolat na vás oba zatracení a opovržení! [actor.GetFaith.PriestNeuterPlural|U] — [secondary_recipient.GetTitledFirstNameNoTooltip] i celé ostatní duchovenstvo — přimějí [recipient.Custom('CZ_FirstNameNoTooltip_A')] k ústupku!"
 pam_interactions_events.0030.d: "Pohrozit skandálem, který podkope legitimitu."
 pam_interactions_events.0030.d.flavor: "[recipient.GetTitleAsNameNoTooltip|U], už tak s nevalnou pověstí, se sotva udrží, pokud budou v sázce jména a pověst..."
 pam_interactions_events.0030.e: "Prostě nabídnout odkup území s hodností [target.GetTierAsNameNoTooltip]."
 pam_interactions_events.0030.f: "Nechávám tuto věc posouzení [recipient.Custom('CZ_FirstNameNoTooltip_G')]. Ať rozhodne [ROOT.Char.GetFaith.HighGodName]."
 clergy_land_no_method_warning_tt: "@warning_icon!#X #bold Bez pobídek [recipient.GetShortUIName] pravděpodobně [Select_CString(recipient.IsLocalPlayer,'nesouhlasíš','nesouhlasí')|l]!#!#!"
 clergy_land_no_method_warning_soft_tt: "@alert_icon! #alert_trial Bez pobídek má souhlas od [recipient.Custom('CZ_ShortUIName_G')] menší pravděpodobnost#!"
 pam_interactions_events.0034.t: "Spor o [target.Custom('CZ_LandedNameNoTierNoTooltip_A')]"
 pam_interactions_events.0034.desc_intro_envoy: "[secondary_recipient.GetTitledFirstNameRegnal|U] dál usiluje o získání [target.Custom('CZ_LandedNameNoTier_G')] jménem [actor.Custom('CZ_Name_G')] — a údajně také ve jménu pozemského řádu a všeho duchovenstva, které hlásá [CZFaithAdjDecline(recipient.GetFaith,'ou')|l] víru a chrání [recipient.GetFaith.HighGodNamePossessive] řád."
 pam_interactions_events.0034.desc_intro: "[actor.GetName|U] předkládá důvody pro získání [target.Custom('CZ_LandedNameNoTier_G')]: znovu vznáší požadavek chráněný a podporovaný [CZFaithAdjDecline(recipient.GetFaith,'ou')|l] vírou."
 pam_interactions_events.0034.desc_vassal: "Jako by nezáleželo na tom, že mi [target.GetHolder.GetName] přísahá věrnost až do smrti. Zdá se, že o té věrnosti lze smlouvat."
 pam_interactions_events.0034.desc_target: "Jako by nezáleželo na tom, že mi toto území s hodností [target.GetTierAsNameNoTooltip] patří krví a dobytím. O všem na tomto světě lze smlouvat."
 pam_interactions_events.0034.desc: "\n\nNa posvátné půdě snáším tyto útoky na svá práva pokojně. Mohu jen zvažovat nabídku...\n\n"
 pam_interactions_events.0034.desc_method_hook: "Slib, že závazky, které vůči mně drží [actor.GetTitledFirstNameNoTooltip], pozbudou platnosti."
 pam_interactions_events.0034.desc_method_relation: "Zničující konec veškeré náklonnosti, důvěry a lásky mezi námi. [actor.GetFirstNameNoTooltip] tvrdí, že na této záležitosti půdy závisí celé [Select_CString(actor.IsFemale,'její','jeho')|l] srdce.\n\nZa odmítnutí mě bude navždy nenávidět."
 pam_interactions_events.0034.desc_method_piety: "Hrozbu úplného zničení mého už tak vratkého vztahu k víře. Poškodilo by to i [actor.Custom('CZ_TitledFirstNameNoTooltip_A')], ale má zbožnost je slabší než [Select_CString(actor.IsFemale,'ta její','ta jeho')|l]."
 pam_interactions_events.0034.desc_method_legitimacy: "Vážnou hrozbu mé legitimitě. Ohavnou veřejnou hádku o [target.Custom('CZ_LandedNameNoTierNoTooltip_A')], skandál, který z nás obou udělá terč posměchu..."
 pam_interactions_events.0034.desc_method_gold: "Hromadu třpytivých mincí. Prý přiměřenou cenu za území s hodností [target.GetTierAsNameNoTooltip], tvrdí [actor.GetTitleAsNameNoTooltip|l]."
 pam_interactions_events.0034.desc_no_method: "...#EMP vůbec nic#!. Jen požadavek na [target.Custom('CZ_LandedNameNoTier_A')] a předpoklad, že se bojím opovržení duchovenstva zvaného [recipient.GetFaith.PriestNeuterPlural] a hrůz války."
 pam_interactions_events.0034.a: "Ať nad územím [target.Custom('CZ_LandedNameNoTierNoTooltip_G')] zavlaje [Select_CString(actor.IsFemale,'její','jeho')|l] prapor."
 pam_interactions_events.0034.b: "Dokud žiji, toto území s hodností [target.GetTierAsNameNoTooltip] je mé."
 pam_interactions_events.0035.t: "[target.GetNameNoTierNoTooltip|U]: získáno"
 pam_interactions_events.0035.desc_intro: "Po krátkém zvažování [recipient.GetFirstNameNicknamed] ustupuje! Jednání o odstoupení [target.Custom('CZ_LandedNameNoTier_G')] jsou rychlá a plodná.\n\nVýnos od [secondary_recipient.Custom('CZ_TitledFirstName_G')], který potvrzuje má práva, dochází naplnění."
 pam_interactions_events.0035.desc_hook: "Závazek, který vůči mně má [recipient.GetFirstNameNoTooltip], byl čestně splněn."
 pam_interactions_events.0035.desc_relation: "Ano, prolévají se hořké slzy, končí radost i obdiv. Kvůli získání [target.Custom('CZ_LandedNameNoTierNoTooltip_G')] z mé ruky [recipient.GetFirstNameNoTooltip] těžce trpí. Ale..."
 pam_interactions_events.0035.desc_piety: "A tak mé hrozby, že [recipient.Custom('CZ_FirstNameNoTooltip_A')] i sebe utopím v hanebné potupě... nemusejí dojít naplnění."
 pam_interactions_events.0035.desc_legitimacy: "A tak mé hrozby spory a pomluvami... nemusejí dojít naplnění."
 pam_interactions_events.0035.desc_gold: "Posílám zprávu správcům mincí a věřitelům a cenu ochotně platím."
 pam_interactions_events.0035.desc_fallback: "Takovou moc nám svěřil [actor.GetFaith.HighGodName]: [actor.GetFaith.PriestNeuterPlural] hlásají [CZFaithAdjDecline(actor.GetFaith,'ou')|l] víru a já s nimi! Bez potřeby vojsk či válčení — na náš příkaz se mění řád světa."
 pam_interactions_events.0035.desc_vassal: "\n\n[vassal.GetName|U] mi přísahou stvrdí věrnost."
 pam_interactions_events.0035.desc: "\n\nToto území s hodností [target.GetTierAsNameNoTooltip] je mé."
 pam_interactions_events.0035.a: "Ať nad celým územím [target.Custom('CZ_LandedNameNoTierNoTooltip_G')] zavlají mé prapory!"
 pam_interactions_events.0036.t: "[target.GetNameNoTierNoTooltip|U]: odepřeno"
 pam_interactions_events.0036.desc_intro_afraid_admin: "[recipient.GetTitledFirstName|U] odpovídá pod ochranou statečných vojáků, neklidně navzdory pokojnému prostřednictví od [secondary_recipient.Custom('CZ_TitledFirstName_G')]:\n\n"
 pam_interactions_events.0036.desc_intro_afraid: "[recipient.GetTitledFirstName|U] odpovídá pod ochranou odvážných bojovníků zvaných [recipient.Custom('KnightCulturePluralNoTooltip')|l], neklidně navzdory pokojnému prostřednictví od [secondary_recipient.Custom('CZ_TitledFirstName_G')]:\n\n"
 pam_interactions_events.0036.desc_intro_pious: "[recipient.GetTitledFirstName|U] odpovídá o samotě a bez pokory, s odvahou dodanou pokojným prostřednictvím od [secondary_recipient.Custom('CZ_TitledFirstName_G')]:\n\n"
 pam_interactions_events.0036.desc_intro_admin: "[recipient.GetTitledFirstName|U] odpovídá mezi osobními strážci, s opovržením k pokojnému prostřednictví od [secondary_recipient.Custom('CZ_TitledFirstName_G')]:\n\n"
 pam_interactions_events.0036.desc_intro: "[recipient.GetTitledFirstName|U] odpovídá mezi odvážnými bojovníky zvanými [recipient.Custom('KnightCulturePluralNoTooltip')|l], s opovržením k pokojnému prostřednictví od [secondary_recipient.Custom('CZ_TitledFirstName_G')]:\n\n"
 pam_interactions_events.0036.desc_hook: "„Místo, které v mém srdci zaujímá [target.GetNameNoTier], stojí nad každým závazkem, který vůči mně můžeš uplatnit."
 pam_interactions_events.0036.desc_relation: "„Držitel titulu [actor.GetTitleAsName|l] v [actor.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_L')] mi plive na srdce. Trhá mou duši na kusy. Už od něj nechci nic slyšet."
 pam_interactions_events.0036.desc_piety: "„Když ti odmítnu předat [target.Custom('CZ_LandedNameNoTier_A')], potupíš nás oba hříchem a obviněními? Dobrá."
 pam_interactions_events.0036.desc_legitimacy: "„Pronášej své jedovaté lži. Obrať obyvatele [target.Custom('CZ_LandedNameNoTier_G')] i všechny ostatní národy proti nám oběma."
 pam_interactions_events.0036.desc_gold: "„Myslíš, že si [target.Custom('CZ_LandedNameNoTier_A')] koupíš za zlato a stříbro? Na tak vznešené území s hodností [target.GetTierAsNameNoTooltip] příliš prostý obchod."
 pam_interactions_events.0036.desc_fallback: "„Může [actor.GetTitleAsName|l] a [secondary_recipient.GetTitleAsNameNoTooltip|l] získat [target.Custom('CZ_LandedNameNoTier_A')] několika prostými slovy...? Ne."
 pam_interactions_events.0036.desc_afraid: "Ať [recipient.GetFaith.PriestNeuterPlural] přijdou a já je přivítám. Pošli vyslance a já s nimi budu jednat...“\n\n„Ale takto se svého území s hodností [target.GetTierAsNameNoTooltip] vzdát nemohu.“"
 pam_interactions_events.0036.desc_pious: "Ať přijdou další [recipient.GetFaith.PriestNeuterPlural], ať z nich čiší zkaženost! Pošli ďábelská ozbrojená vojska do [target_capital.GetTitle.Custom('CZ_LandedNameNoTier_G')]...“\n\n„Nevzdám se území s hodností [target.GetTierAsNameNoTooltip], které mi udělil [recipient.GetFaith.HighGodName].“"
 pam_interactions_events.0036.desc: "Ať přijdou další [recipient.GetFaith.PriestNeuterPlural] a dál vřískají! Ať [actor.Custom('GetFighterTermPlural')] v plné zbroji přitáhnou do [target_capital.GetTitle.Custom('CZ_LandedNameNoTier_G')]...“\n\n„Svého území s hodností [target.GetTierAsNameNoTooltip] se tak snadno nevzdám.“"
 pam_interactions_events.0036.a_relation: "Jak mě jen může odmítnout?!?"
 pam_interactions_events.0036.a: "Vzepřít se vůli [secondary_recipient.Custom('CZ_TitleAsNameNoTooltip_G')|l]? Hanba..."
 clergy_land_transfer_refusal_tt: "Odmítnuté odstoupení [target.Custom('CZ_LandedName_G')] [actor.Custom('CZ_ShortUIName_D')]"
 pam_interactions_events.0037.opening: "[ROOT.Char.GetFirstNameNicknamed|U], [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|l] v [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_L')],"
