 pam_interactions_events.0091.opening: "Můj dobrodinče," # todo: NEW TRANSLATION
 pam_interactions_events.0091.desc_hook_theocrat: "Vaše přímluva mě zavazuje k velkému dluhu. Do jedné ruky mi byl vložen pastýřský háček, druhou pevně svírá sama ruka [recipient.GetFaith.HighGodName]. Tak to musí být, neboť jsem věrným služebníkem [recipient.GetFaith.HighGodHerHis|U]! [target.GetNameNoTier] je veliký dar a já jsem vděčným obdarovaným.\n\nNechť se po všech zemích rozhlásí: z vůle [ROOT.Char.GetTitledFirstNameRegnal] náleží toto [target.GetTierAsName] duchovenstvu!" # todo: NEW TRANSLATION
 pam_interactions_events.0091.desc_hook: "Vaše přímluva mě zavazuje k velkému dluhu. Do jedné ruky mi bylo vloženo žezlo vlády, druhou pevně svírá sama ruka [recipient.GetFaith.HighGodName]. Tak to musí být. [target.GetNameNoTier] je veliký dar a já jsem vděčným obdarovaným.\n\nNechť se po všech zemích rozhlásí: z vůle [ROOT.Char.GetTitledFirstNameRegnal] náleží [target.GetTierAsName] mně!" # todo: NEW TRANSLATION
 pam_interactions_events.0091.desc: "Vaše přímluva je požehnáním, v něž jsem ani nedoufal. Svatý [ROOT.Char.GetMotherFather|U] má daleký dosah a je také laskavý — díky [recipient.GetFaith.HighGodName]!\n\n[target.GetName] je vznešená země. Budu nosit její titul a vládnout jejím [recipient.GetFaith.GetAdherentNamePlural] s pokorou a laskavostí." # todo: NEW TRANSLATION
 pam_interactions_events.0091.a: "Budu [target.GetNameNoTierNoTooltip] bedlivě sledovat." # todo: NEW TRANSLATION
 pam_interactions_events.0092.opening_theocratic: "Nejdůstojnější [ROOT.Char.GetFaith.PriestNeuter]," # todo: NEW TRANSLATION
 pam_interactions_events.0092.opening: "Mé [ROOT.Char.Custom('GetTitleTierAdjective')] dítě," # todo: NEW TRANSLATION
 pam_interactions_events.0092.desc_hook: "Zatímco se modlíte za mocný dar, jímž vás [recipient.GetFaith.HighGodName] a [recipient.GetFaith.HighGodHerHis|U] preláti zahrnuli, dobře zvažte, nakolik jste skutečně hodni tohoto [target.GetTierAsName]. Možná je třeba za vás ještě pronést zbožné modlitby.\n\nRád vám v tom poskytnu svou radu. Musíme zajistit, aby vaše vláda [CZPrepV(target.GetNameNoTierNoTooltip)] [target.Custom('CZ_LandedNameNoTierNoTooltip_L')] těšila [recipient.GetFaith.HighGodName] a sloužila mu." # todo: NEW TRANSLATION
 pam_interactions_events.0092.desc: "Váš [target.GetTierAsNameNoTooltip] byl vyhlášen!\n\nDíky mým modlitbám jsem se skutečně zvlášť zajímal o váš vzestup. Žádám pouze, abyste dobře vládl, aby vaše panování bylo požehnáním pro [recipient.GetFaith.GetAdherentNamePlural] [CZPrepV(target.GetNameNoTierNoTooltip)] [target.Custom('CZ_LandedNameNoTier_L')]." # todo: NEW TRANSLATION
