 bishop_excommunication_target_secular_tt: "[target_char.GetShortUIName|U] [Select_CString(target_char.IsLocalPlayer,'musíš','musí')|l] splnit alespoň jednu z podmínek:\n$EFFECT_LIST_BULLET$Být [Concept('vassal','vazalem')|E] pod vládou [excommunicator.Custom('CZ_ShortUIName_G')] nebo stát níže\n$EFFECT_LIST_BULLET$Být sousedním [Concept('ruler','vládcem')|E] nebo sídlit v [Concept('clerical_region','církevní oblasti')|E] pod správou [excommunicator.Custom('CZ_ShortUIName_G')]\n$EFFECT_LIST_BULLET$Mít [Concept('court_chaplain','dvorního kaplana')|E], který je [Concept('subordinate','podřízeným')|E] [excommunicator.Custom('CZ_ShortUIName_G')] nebo stojí níže\n$EFFECT_LIST_BULLET$Mít [excommunicator.Custom('CZ_ShortUIName_A')] jako [Concept('court_chaplain','dvorního kaplana')|E], přičemž [excommunicator.GetShortUIName] [Select_CString(excommunicator.IsLocalPlayer,'nemáš','nemá')] žádného [Concept('superior','nadřízeného')|E]\n$EFFECT_LIST_BULLET$Některý [Concept('liege','lenní pán')|E] nebo vyšší vládce má [excommunicator.Custom('CZ_ShortUIName_A')] jako [Concept('court_chaplain','dvorního kaplana')|E]"
 bishop_excommunication_target_courtier_tt: "[Concept('liege','Lenní pán')|EU] pro [target_char.Custom('CZ_ShortUIName_A')|U] musí být [excommunicator.GetShortUIName], [Concept('vassal','vazalem')|E] pod vládou [excommunicator.Custom('CZ_ShortUIName_G')] nebo stát níže, být sousedním [Concept('ruler','vládcem')|E] nebo sídlit v [Concept('clerical_region','církevní oblasti')|E] pod správou [excommunicator.Custom('CZ_ShortUIName_G')]"
 bishop_excommunication_target_wanderer_tt: "[target_char.GetName|U] se musí nacházet v [Concept('realm','panství')|E] pod vládou [excommunicator.Custom('CZ_ShortUIName_G')], v sousedním [Concept('county','hrabství')|E] nebo v [Concept('clerical_region','církevní oblasti')|E] pod správou [excommunicator.Custom('CZ_ShortUIName_G')]"
 can_excommunicate_directly: "[puppet_or_actor.GetShortUIName|U] [Select_CString(puppet_or_actor.IsLocalPlayer,'můžeš','může')] přímo [Concept('excommunicate','exkomunikovat')|E] [secondary_recipient.Custom('CZ_ShortUIName_A')]"
 no_valid_excommunicator_tt: "Protože tvá [Concept('faith','víra')|E] nemá [Concept('theocratic','teokratickou')|E] [Concept('head_of_faith','hlavu víry')|E], [secondary_recipient.GetShortUIName] [Select_CString(secondary_recipient.IsLocalPlayer,'můžeš','může')|l] získat postavení [Concept('excommunicated','exkomunikované osoby')|E] pouze z rozhodnutí mocného [Concept('ecclesiastical','církevního')|E] [Concept('ruler','vládce')|E], který splňuje alespoň jednu z podmínek:\n$EFFECT_LIST_BULLET$Je [Select_CString(secondary_recipient.IsLocalPlayer,'tvým',Select_CString(secondary_recipient.IsFemale,'jejím','jeho'))|l] [Concept('liege','lenním pánem')|E] nebo stojí výše\n$EFFECT_LIST_BULLET$Je sousedním [Concept('ruler','vládcem')|E] nebo má [Select_CString(secondary_recipient.IsLocalPlayer,'tvé',Select_CString(secondary_recipient.IsFemale,'její','jeho'))|l] [Concept('realm_capital','hlavní sídlo panství')|E] ve své [Concept('clerical_region','církevní oblasti')|E]\n$EFFECT_LIST_BULLET$Je [Concept('superior','nadřízeným')|E] [Select_CString(secondary_recipient.IsLocalPlayer,'tvého',Select_CString(secondary_recipient.IsFemale,'jejího','jeho'))|l] [Concept('court_chaplain','dvorního kaplana')|E] nebo stojí výše\n$EFFECT_LIST_BULLET$Je [Select_CString(secondary_recipient.IsLocalPlayer,'tvým',Select_CString(secondary_recipient.IsFemale,'jejím','jeho'))|l] [Concept('court_chaplain','dvorním kaplanem')|E] a nemá žádného [Concept('superior','nadřízeného')|E]"
 excommunicator_must_be_hof_tt: "Pouze [Concept('head_of_faith','hlava víry')|E] může [Concept('excommunicate','exkomunikovat')|E] [target_char.Custom('CZ_Name_A')]"
 pam_interactions_events.0072.opening: "Odporná nevěřící duše, která se nazývá [recipient.Custom2('GetUnbelieverTerm', puppet_or_actor)|l],"
 pam_interactions_events.0072.desc_joined_war: "Nyní k tobě přicházím. Jako misionář přinést světlo do tvé temnoty. Jako [Select_CString(puppet_or_actor.IsFemale,'matka','otec')] přinést trest.\n\nA po mém rodičovském boku přichází [secondary_recipient.GetName], [Select_CString(secondary_recipient.IsFemale,'válečnice','válečník')|l], [Select_CString(secondary_recipient.IsFemale,'kterou','kterého')|l] vedou [puppet_or_actor.GetFaith.GoodGodNames]. [Select_CString(secondary_recipient.IsFemale,'Její','Jeho')|U] vojska zbaví [target.Custom('CZ_LandedNameNoTier_A')] zla."
 pam_interactions_events.0072.desc: "Je pro tebe příliš pozdě. Pokání už není možné.\n\nHle, zlovolná země [recipient.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] bude rozervána! Hle, služebníci, kterým vládne [puppet_or_actor.GetFaith.DevilName], budou pobiti! Pozvedám zbraně věřících a posílám [secondary_recipient.Custom('CZ_Name_A')] ke tvé zkáze!"
 pam_interactions_events.0072.a: "[puppet_or_actor.GetFaith.HighGodName|U] musí být krutý, když na nás vypouští takové lidi — [Select_CString(puppet_or_actor.IsFemale,'ženy','muže')]!"
 incite_holy_war_past_tense_tt: "[CZProDrop(puppet_or_actor,'přiměla','přiměl')|U] [secondary_recipient.Custom('CZ_ShortUIName_A')] k vyhlášení [Concept('holy_war','svaté války')|E] o získání [target.Custom('CZ_LandedName_G')]"
 incite_holy_war_joined_tt: "[CZProDrop(puppet_or_actor,'vstoupila','vstoupil')|U] do [Concept('holy_war','svaté války')|E] proti [recipient.Custom('CZ_ShortUIName_D')]"
 not_at_war_for_target_title_or_above_tt: "Vedeš [Concept('war','válku')|E] o [target.Custom('CZ_LandedName_A')] nebo o [Concept('title','titul')|E] v jeho hierarchii [Concept('de_jure','de iure')|E]"
