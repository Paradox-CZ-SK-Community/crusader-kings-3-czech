 pam_interactions_events.0020.a.low_zeal: "A tak se přepisují dějiny..." # todo: NEW TRANSLATION
 pam_interactions_events.0020.a.high_zeal: "[target.GetNameNoTierNoTooltip] mi náleží z posvátného práva!" # todo: NEW TRANSLATION
 pam_interactions_events.0020.a: "Vznáším svůj nárok, ať je [recipient.GetTitledFirstNameNoTooltip] třeba proklet." # todo: NEW TRANSLATION
 pam_interactions_events.0020.toast_puppeteer: "[secondary_recipient.GetShortUIName] udělil [puppet_or_actor.GetShortUIName] nárok na [target.Custom('CZ_LandedNameNoTier_A')]" # todo: NEW TRANSLATION
 pam_interactions_events.0021.opening: "[actor.GetName]," # todo: NEW TRANSLATION
 pam_interactions_events.0021: "Kdybys měl vládnout [target.GetNameNoTier], nepředal by ti snad [secondary_recipient.GetFaith.HighGodName] toto právo již při narození?\n\nNe, [recipient.GetTitledFirstNameRegnal] neublížím — a nezradím naše smrtelné duše, tvou ani svou — tím, že bych kvůli tvé zvrhlé věci sepisoval lži.\n\nPomodli se a zamysli nad svými chybami." # todo: NEW TRANSLATION
 pam_interactions_events.0021.a: "Hradby [secondary_recipient.GetFaith.HouseOfWorship|U] mu dodávají bláhovou odvahu!" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [secondary_recipient.GetHerHim]
 pam_interactions_events.0021.toast_puppeteer: "[secondary_recipient.GetShortUIName] odmítl žádost [puppet_or_actor.GetShortUINamePossessive] o nárok na [target.Custom('CZ_LandedNameNoTier_A')]" # todo: NEW TRANSLATION
 pam_interactions_events.0022.opening: "Držitel mého dědičného práva," # todo: NEW TRANSLATION
 pam_interactions_events.0022_shrimp: "Ačkoli jsem pouhý [actor.GetTitleAsName], [actor.GetFaith.GetAdjective] [secondary_recipient.GetFaith.AltPriestTermPlural] zjistili, že v mých žilách koluje prastarý nárok na celý [target.GetName]." # todo: NEW TRANSLATION
 pam_interactions_events.0022_shark: "[target.GetName] patří mezi tituly, které [actor.GetFaith.HighGodName] předal mému [actor.Custom('GetTitleTierAdjective')] rodu. Tak tomu bylo vždy, ačkoli se to až dosud nevědělo." # todo: NEW TRANSLATION
 pam_interactions_events.0022: "Mezi učenými znalci se to ví už dlouho — a nyní je to nově dokázáno — [target.GetName] mi právem náleží." # todo: NEW TRANSLATION
 pam_interactions_events.0022_end: "\n\n[secondary_recipient.GetTitledFirstNameRegnal] posvětil můj nárok. [secondary_recipient.GetPrimaryTitle.GetName] za mnou stojí až do konce.\n\nA tak začínám doufat a modlit se, že mě jednoho dne přivítají jako pána krásného [target.GetNameNoTierNoTooltip]..." # todo: NEW TRANSLATION
 pam_interactions_events.0022.a: "Lži! Falešný nárok podpořený falešným [secondary_recipient.GetFaith.PriestNeuter]!" # todo: NEW TRANSLATION
 pam_interactions_events.0023.opening: "Svatý [secondary_recipient.GetMotherFather]," # todo: NEW TRANSLATION
 pam_interactions_events.0023_shrimp: "Kdybych byl ozbrojen právoplatným nárokem, nemohl bych vládnout [target.GetName] ctnostněji než [actor.Custom2('InsultAdjective', recipient)] [recipient.GetFirstNameRegnal]? Prosím, dovolte, ať světlo [actor.GetFaith.HighGodNamePossessive] zazáří na tohoto pouhého [actor.GetTitleAsName]." # todo: NEW TRANSLATION
 pam_interactions_events.0023_shark: "Z vůle [actor.GetFaith.HighGodNamePossessive] jsem již pánem a ochráncem mnoha zemí a národů. [target.GetName] však leží mimo mou říši i má práva." # todo: NEW TRANSLATION
 pam_interactions_events.0023: "Mezi věřícími panuje zmatek. Někteří si vroucně přejí, abych vznesl nárok na [target.GetName], zatímco jiní popírají, že bych měl na tento titul jakékoli právo." # todo: NEW TRANSLATION
 pam_interactions_events.0023_end: "\n\nJistě by někdo tak učený jako vy mohl v dějinách #EMP objevit#! potřebné důkazy... a opatřit mi posvěcený nárok na [target.Custom('CZ_LandedNameNoTierNoTooltip_A')]?" # todo: NEW TRANSLATION
 pam_interactions_events.0023.a: "Kéž [target.GetNameNoTierNoTooltip] připadne tobě, můj [actor.Custom('GetDaughterSon')]." # todo: NEW TRANSLATION
 pam_interactions_events.0023.b: "[secondary_recipient.GetTitleAsNameNoTooltip] nesmí obchodovat se lží." # todo: NEW TRANSLATION
