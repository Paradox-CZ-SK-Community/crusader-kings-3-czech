 secondary_recipient_must_have_superior_tt: "[secondary_recipient.GetShortUIName|U] musí mít [superior|E] nebo [liege|E], který je [ecclesiastical|E] nebo [theocratic|E]" # todo: NEW TRANSLATION
 target_char_must_be_clerical_subordinate_tt: "Jako [ecclesiastical|E] nebo [theocratic|E] [ruler|E] musí být [target_char.GetShortUIName] [vassal|E], [subordinate|E] [excommunicator.GetShortUINamePossessive] nebo někým níže postaveným" # todo: NEW TRANSLATION
 bishop_excommunication_target_secular_tt: "[target_char.GetShortUIName|U] musí splňovat alespoň jednu z těchto podmínek:\n$EFFECT_LIST_BULLET$Být [vassal|E] [excommunicator.GetShortUINamePossessive] nebo někým níže postaveným\n$EFFECT_LIST_BULLET$Být sousedním [ruler|E] nebo sídlit v [clerical_region|E] [excommunicator.GetShortUINamePossessive]\n$EFFECT_LIST_BULLET$Mít [court_chaplain|E], který je [subordinate|E] [excommunicator.GetShortUINamePossessive] nebo někým níže postaveným\n$EFFECT_LIST_BULLET$Mít [excommunicator.GetShortUIName] jako [court_chaplain|E], přičemž [excommunicator.GetShortUIName] [CharHaveHas(excommunicator)] žádného [superior|E]\n$EFFECT_LIST_BULLET$Mít [liege|E] nebo někoho výše postaveného, jehož [court_chaplain|E] je [excommunicator.GetShortUIName]" # todo: NEW TRANSLATION
 bishop_excommunication_target_courtier_tt: "[liege|E] [target_char.GetShortUINamePossessive|U] musí být [excommunicator.GetShortUIName], [vassal|E] [excommunicator.GetShortUINamePossessive] nebo někým níže postaveným, sousedním [ruler|E] či musí sídlit v [clerical_region|E] [excommunicator.GetShortUINamePossessive]" # todo: NEW TRANSLATION
 bishop_excommunication_target_wanderer_tt: "[target_char.GetName|U] se musí nacházet v [realm|E] [excommunicator.GetShortUINamePossessive], v sousedním [county|E] nebo v [clerical_region|E] [excommunicator.GetShortUINamePossessive]" # todo: NEW TRANSLATION
 can_excommunicate_directly: "[puppet_or_actor.GetShortUIName|U] může přímo [excommunicate|E] [secondary_recipient.GetShortUIName]" # todo: NEW TRANSLATION
 no_valid_excommunicator_tt: "Protože vaše [faith|E] nemá [theocratic|E] [head_of_faith|E], může [secondary_recipient.GetShortUIName] [excommunicated|E] pouze mocný [ecclesiastical|E] [ruler|E], který splňuje alespoň jednu z těchto podmínek:\n$EFFECT_LIST_BULLET$Je [liege|E] [secondary_recipient.GetHerHis] nebo někým výše postaveným\n$EFFECT_LIST_BULLET$Je sousedním [ruler|E] nebo má [realm_capital|E] [secondary_recipient.GetHerHis] ve své [clerical_region|E]\n$EFFECT_LIST_BULLET$Je [superior|E] [court_chaplain|E] [secondary_recipient.GetHerHis] nebo někým výše postaveným\n$EFFECT_LIST_BULLET$Je [court_chaplain|E] [secondary_recipient.GetHerHis] a nemá žádného [superior|E]" # todo: NEW TRANSLATION
