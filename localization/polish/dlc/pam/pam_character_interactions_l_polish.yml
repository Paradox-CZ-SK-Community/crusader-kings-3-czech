 pam_interactions_events.0097.desc: "Tvá žádost je přijata. [target.GetName] zeje prázdnotou, zatímco věřící zvaní [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|l] tam zůstávají bez pastýře — ubohý způsob pocty, kterou si zaslouží [ROOT.Char.GetFaith.HighGodName].\n\nNes svůj titul pokorně. [Concept('title','Titul')|EU], který církev udělí, zůstává věcí církve."
 pam_interactions_events.0097.desc_holy_war: "Tvá žádost je přijata a tvůj slib zapsán tam, kde nebude zapomenut. [target.GetName] je tvé, ale část území se stále klaní těm, jejichž víra popírá, že [ROOT.Char.GetFaith.HighGodName] je pravým bohem.\n\nJdi a získej to, co už tvůj titul označuje za tvé. Žádný věrný duchovní zvaný [ROOT.Char.GetFaith.PriestNeuter] tvou válku nezpochybní, ale za pět let se zeptáme na její výsledek. Nenaplněný slib je porušený slib."
 pam_interactions_events.0097.a: "Za [target.Custom('CZ_LandedNameNoTierNoTooltip_A')] nyní odpovídám já."
