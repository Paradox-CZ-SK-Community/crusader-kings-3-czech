l_polish:
 pam_the_christian_church.0051.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]" # todo: NEW TRANSLATION
 pam_the_christian_church.0051.desc.intro: "[GetSituation('the_christian_church').GetTopSubRegion.GetName] se rozkládá na mnoha državách a tvoří ji nesčetné rozmanité národy, jejich jazyky, kultury a sváry.\n\nNaukové spory jsou staré jako sama církev, ale v těchto posledních časech, zmučených morem, válkou a kacířstvím, je naše jednota vystavena zkoušce.\n\nStejně jako apoštol [st_paul.GetName] vyzval Korinťany k jednotě, měli by se i všichni [christians|E] řídit [st_paul.GetHerHis] vedením a [Glossary( 'non sint in vobis schismata', '1_CORINTHIANS_1_10_LATIN_GLOSS' )]. Jinak uvízneme v kacířství a staneme se pouhými hračkami v rukou Antikrista.\n\n" # todo: NEW TRANSLATION
 pam_the_christian_church.0051.desc.unreformed_pagan: "Naši změkčilí sousedé, [christians|E], následují slabého a žárlivého boha a hašteří se jako děti o povaze své panenky. Zatímco jejich ostražitost otupuje a jejich meče hladoví, už je to tak dlouho, co si dopřáli poctivé krveprolití.\n\nDoufají, že nám pošlou svaté muže, aby v našich zemích šířili svou slabost. Co kdybychom je navštívili sami a vyplenili jejich pokladnice! Na našem příkladu se možná znovu naučí být silní." # todo: NEW TRANSLATION
 pam_the_christian_church.0051.desc.heathen_rulers: "Naši [christian|E] sousedé jsou hrubí a hašteřiví. Jsou jako usazenina ve vodě, hrubé zrcadlo pro následovníky [ROOT.Char.GetFaith.HighGodName]. Uvízli v minulosti a jejich falešná víra je přivede jedině k záhubě.\n\nJejich poklady, jakkoli skromné, čekají na to, až si je vezmeme. Jejich lid, jakkoli nedisciplinovaný, je zralý k podrobení." # todo: NEW TRANSLATION
 pam_the_christian_church.0051.desc.heretic_rulers: "Osel na stolci [st_peter.GetName] by nás nazval kacíři, ačkoli jsme pravověrní věřící. Kdyby se Kristus znovu narodil, jistě by se z něj stal farizej a znovu by volal po ukřižování našeho Pána.\n\nJen se podívejme na rozkol mezi námi, kdo nazýváme Krista svým pánem! Falešný kněz v Římě zasel semeno tohoto sváru.\n\nTento satanův místodržící by z nás rád učinil mučedníky. Tuto zhoubu je třeba vyříznout pro spásu všech [christians|E]!" # todo: NEW TRANSLATION
 pam_the_christian_church.0051.desc.western: "Moc římského biskupa zeslábla, a tak musíme zacelit trhliny ve víře, než přijde poslední soud." # todo: NEW TRANSLATION
 pam_the_christian_church.0051.desc.eastern: "Jsme obklíčeni nepřáteli Krista, a proto musíme hledat společnou řeč s římským biskupem, než přijde poslední soud." # todo: NEW TRANSLATION
 pam_the_christian_church.0051.desc.investiture_temporal: "\n\nKoncil ponechal korunám právo sesazovat preláty jmenované církví." # todo: NEW TRANSLATION
 pam_the_christian_church.0051.desc.oriental_orthodox: ""[Glossary( 'Mia physis tou theou logou sesarkomene', 'MIAPHYSITISM_GLOSS' )]". Musíme přivést naše bratry zpět ke světlu, než přijde poslední soud." # todo: NEW TRANSLATION
 pam_the_christian_church.0051.a: "S Kristem jako naším průvodcem!" # todo: NEW TRANSLATION
 pam_the_christian_church.0051.b: "Musíme na tyto Kristovy následovníky dohlížet." # todo: NEW TRANSLATION
 MIAPHYSITISM_GLOSS: "#bold „Jedna je přirozenost Slova Božího, jež se stalo tělem!“#! prohlásil svatý Cyril Alexandrijský na koncilu v Efezu roku 431. Tento christologický názor, známý jako miafyzitismus, zastává většina orientálních pravoslavných." # todo: NEW TRANSLATION
 pam_the_christian_church.0052.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]" # todo: NEW TRANSLATION
 pam_the_christian_church.0052.desc.intro: "Temnotou, která zahaluje [GetSituation('the_christian_church').GetTopSubRegion.GetName], se rozléhá sbor hlasů.\n\n#EMP „Řím se proměňuje v novodobou Sodomu!“#!\n\n#EMP „Papež je kuplířem i prostitutkou!“#!\n\nI ti, kdo mají umírněnější názor, musí uznat, že církev je v krizi a je třeba hledat nápravu." # todo: NEW TRANSLATION
 pam_the_christian_church.0052.desc.unreformed_pagan: "Naši malověrní sousedé, [christians|E], křičí: „Blíží se náš konec! Náš papež je stejně divoký jako pohan.“\n\nAlespoň jedna z těch věcí je pravda. Pomozme jim tedy najít konec, který tak často přivolávají!" # todo: NEW TRANSLATION
 pam_the_christian_church.0052.desc.heathen_rulers: "„Naše církev je v krizi!“ křičí [christians|E].\n\nJe dobře, že konečně uznávají to, co víme odjakživa. Tito pohanští hlupáci mohou jen doufat, že jednou půjdou v našich šlépějích a přijmou cesty [ROOT.Char.GetFaith.HighGodName].\n\nJejich poklady, jakkoli skromné, čekají na to, až si je vezmeme. Jejich lid, jakkoli nedisciplinovaný, je zralý k podrobení." # todo: NEW TRANSLATION
 pam_the_christian_church.0052.desc.heretic_rulers: "Tohoto Antikrista v rouchu svatého Petra je třeba zastavit!" # todo: NEW TRANSLATION
 pam_the_christian_church.0052.desc.western: "Náprava musí začít v Římě; teprve potom se může [GetSituation('the_christian_church').GetTopSubRegion.GetNameNoTooltip] uzdravit." # todo: NEW TRANSLATION
 pam_the_christian_church.0052.desc.eastern: "Jsme obklíčeni nepřáteli Krista. Musíme vymýtit zkázu v Římě, jinak nás pohltí." # todo: NEW TRANSLATION
 pam_the_christian_church.0052.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$" # todo: NEW TRANSLATION
 pam_the_christian_church.0052.a: "Kéž nám Pán osvítí cestu!" # todo: NEW TRANSLATION
 pam_the_christian_church.0052.b: "$pam_the_christian_church.0051.b$" # todo: NEW TRANSLATION
 pam_the_christian_church.0053.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]" # todo: NEW TRANSLATION
 pam_the_christian_church.0053.desc.intro: "Radujme se z velkého pokroku naší misie! Hranice [GetSituation('the_christian_church').GetTopSubRegion.GetName] se rozšiřují, zatímco se pohanští barbaři učí kráčet po Kristově cestě.\n\nBohužel ne všichni vítají učení církve. Nemějme strach: odmítnou-li naše misionáře, mohou se naše modlitby naučit i na hrotu meče!\n\n" # todo: NEW TRANSLATION
 pam_the_christian_church.0053.desc.unreformed_pagan: "[christians|E] přicházejí do našich zemí se svými svatými muži. Když je odeženeme, vrátí se s meči.\n\nMnozí z nás se snaží zachovat cesty [ROOT.Char.GetFaith.HighGodName], ale někteří spatřují výhody ve službě tomuto bohočlověku, Kristu. Moc člověka se stává božsky posvěcenou, církev nám může sloužit jako posel a co je nejlákavější, vybírá daně." # todo: NEW TRANSLATION
 pam_the_christian_church.0053.desc.heathen_rulers: "Naši sousedé, [christians|E], násilím obracejí modláře na svou víru, ačkoli sotva stojí za to je ušetřit meče.\n\nZatímco jejich meče míří od nás, [ROOT.Char.GetFaith.HighGodName] nám otevírá příležitost. Jejich poklady, jakkoli skromné, čekají na to, až si je vezmeme. Jejich lid, jakkoli nedisciplinovaný, je zralý k podrobení." # todo: NEW TRANSLATION
 pam_the_christian_church.0053.desc.heretic_rulers: "Římský uchvatitel doufá, že obrátí pohany na svou pomýlenou víru! Tento Antikrist se nespokojí s tím, že jen otravuje mysl [christians|E]; jeho zvrácená touha ho vede k tomu, aby do svého pekelného objetí přivedl i ty nezkušené modláře." # todo: NEW TRANSLATION
 pam_the_christian_church.0053.desc.western: "Musíme dohlédnout na to, aby tito nově pokřtění křesťané byli vedeni k uctívání [ROOT.Char.GetRite.GetName], jak to posvětil stolec svatého Petra." # todo: NEW TRANSLATION
 pam_the_christian_church.0053.desc.eastern: "Řím tvrdí, že chce obracet na víru pouze ty, kdo žijí mimo [GetSituation('the_christian_church').GetTopSubRegion.GetName], ale musíme zůstat ostražití. Mohli by nás připravit o náš obřad [ROOT.Char.GetRite.GetName], nebo ještě hůře, obrátit své čerstvě nabroušené meče, potřísněné pohanskou krví, proti svým křesťanským bratřím." # todo: NEW TRANSLATION
 pam_the_christian_church.0053.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$" # todo: NEW TRANSLATION
 pam_the_christian_church.0053.a: "$pam_the_christian_church.0052.a$" # todo: NEW TRANSLATION
 pam_the_christian_church.0053.b: "$pam_the_christian_church.0051.b$" # todo: NEW TRANSLATION
 pam_the_christian_church.0054.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]" # todo: NEW TRANSLATION
 pam_the_christian_church.0054.desc.intro.head: "$pam_the_christian_church.0054.desc.intro.common$\n\n[christianity.GetReligiousHead.GetTitledFirstName] má před [christianity.GetReligiousHead.GetHerHim] nelehký úkol, ale Církev lze ještě zachránit.\n\n" # todo: NEW TRANSLATION
 pam_the_christian_church.0054.desc.intro.no_head: "$pam_the_christian_church.0054.desc.intro.common$\n\nCírkev však ještě není ztracena!\n\n" # todo: NEW TRANSLATION
 pam_the_christian_church.0054.desc.intro.common: "Naše víra v Boha může být neochvějná, ale mnozí ztratili víru v církev. Duchovenstvo, kdysi příkladné svými skutky podobnými Kristovým, se nyní přeme o ty nejzákladnější nauky." # todo: NEW TRANSLATION
 pam_the_christian_church.0054.desc.unreformed_pagan: "[christianity.GetAdherentNamePlural] trhají vlastní duchovenské roucho a doufají, že si Bůh nevšimne záplat. Jestliže se budou zašívat do ornátů a letopisů, možná pošlou méně duchovních, aby rušili naše háje a říční svatyně." # todo: NEW TRANSLATION
 pam_the_christian_church.0054.desc.heathen_rulers: "[christianity.GetAdherentNamePlural] chystají rozsáhlou obnovu svých zákonů a oltářů a každá frakce tvrdí, že slouží bohu utrpení čistěji než ostatní. Můžeme si všimnout jejich nových hesel, ale ostří našich seker promlouvá jasněji než jejich sněmy." # todo: NEW TRANSLATION
 pam_the_christian_church.0054.desc.heretic_rulers: "Římští sektáři se nyní přou o reformu! To, čemu říkají obnova, je jen nové uspořádání téhož jha, utaženého smrtící samospravedlností. Ať si jejich reforma láme lebky v jejich vlastních bazilikách, než si vzpomenou na nás." # todo: NEW TRANSLATION
 pam_the_christian_church.0054.desc.western: "Někteří mohou toto narovnání kormidla nazývat reformou, ale lidé jsou vůči novotám nedůvěřiví. Mohli by ji lépe přijmout, kdyby byla představena jako „návrat ke starým pořádkům“." # todo: NEW TRANSLATION
 pam_the_christian_church.0054.desc.eastern: "Řím — nebo kterákoli kurie, jež se prohlašuje za rozhodce oikumeny — se snaží vyleštit své obřady: nové kánony, nové přísahy, nové výtky za dávné hříchy. My přihlížíme, napomínáme a posilujeme vlastní synody, aby západní umírněnost nebyla mylně považována za všeobecné jho." # todo: NEW TRANSLATION
 pam_the_christian_church.0054.desc.investiture_spiritual: "\n\nKoncil rozhodl ve prospěch práva církve jmenovat duchovní, kteří svou funkci zastávají doživotně." # todo: NEW TRANSLATION
 pam_the_christian_church.0054.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$" # todo: NEW TRANSLATION
 pam_the_christian_church.0054.a: "$pam_the_christian_church.0052.a$" # todo: NEW TRANSLATION
 pam_the_christian_church.0054.b: "$pam_the_christian_church.0051.b$" # todo: NEW TRANSLATION
 pam_the_christian_church.0055.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]" # todo: NEW TRANSLATION
 pam_the_christian_church.0055.desc.intro.head: "$pam_the_christian_church.0055.desc.intro.common$\n\nLaičtí knížata vynucují přísahy na biskupech [christianity.GetReligiousHeadTitle.GetNamePossessive|U], jako by svěcení bylo další statkem k pronájmu. Mezitím [christianity.GetReligiousHeadTitle.GetName] zakazuje korunovaným rukám žehnat mitrám, které samy neposvětily.\n\n" # todo: NEW TRANSLATION
 pam_the_christian_church.0055.desc.intro.no_head: "$pam_the_christian_church.0055.desc.intro.common$\n\nBez pastýře, kterého by všichni uznávali, jmenuje každý trůn biskupy podle své vůle; roucha jsou svatá, ale svěcení zavání penězi, nikoli kadidlem.\n\n" # todo: NEW TRANSLATION
 pam_the_christian_church.0055.desc.intro.common: "V celé oblasti [GetSituation('the_christian_church').GetTopSubRegion.GetName] už spor mezi oltářem a trůnem není pouhým předmětem klepů." # todo: NEW TRANSLATION
 pam_the_christian_church.0055.desc.unreformed_pagan: "Zatímco se [christianity.GetAdherentNamePlural] přou, kdo má světit biskupa — koruna, nebo kápě —, méně misionářů se obrací k nám. Ať se králové a pontifikové udusí svými listinami; jejich rozkol nechá naše háje na pokoji." # todo: NEW TRANSLATION
 pam_the_christian_church.0055.desc.heathen_rulers: "$pam_the_christian_church.0054.desc.heathen_rulers$" # todo: NEW TRANSLATION
 pam_the_christian_church.0055.desc.heretic_rulers: "Řím křičí, že investitura je tyranie, a přitom by naše učitele spoutal, kdyby se jich jen zmocnil! Sundejte si z krku obojky, farizeové, a pak nás poučujte!" # todo: NEW TRANSLATION
 pam_the_christian_church.0055.desc.western: "Přikloníme-li biskupskou berlu příliš k žezlu, mohla by se tato dvě znamení dokonce zaměnit.\n\n" # todo: NEW TRANSLATION
 pam_the_christian_church.0055.desc.eastern: "Západní králové se přou s Římem o prsteny a berly a jejich hříchy poskvrňují celou církev.\n\n" # todo: NEW TRANSLATION
 pam_the_christian_church.0055.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$" # todo: NEW TRANSLATION
 pam_the_christian_church.0055.a: "$pam_the_christian_church.0052.a$" # todo: NEW TRANSLATION
 pam_the_christian_church.0055.b: "$pam_the_christian_church.0051.b$" # todo: NEW TRANSLATION
 pam_the_christian_church.0056.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]" # todo: NEW TRANSLATION
 pam_the_christian_church.0056.desc.intro: "Po celé oblasti [GetSituation('the_christian_church').GetTopSubRegion.GetName] věřící volají po osvobození Božího hrobu. Kříže se leští na pochod, relikvie se zastavují za válečné pokladnice.\n\nZápal plane vášnivě, ale až tato horečka opadne, může se horlivost stejně rychle změnit v pochybnosti, jako popel odlétá od pohřební hranice.\n\n" # todo: NEW TRANSLATION
 pam_the_christian_church.0056.desc.unreformed_pagan: "$pam_the_christian_church.0053.desc.unreformed_pagan$" # todo: NEW TRANSLATION
 pam_the_christian_church.0056.desc.heathen_rulers: "$pam_the_christian_church.0053.desc.heathen_rulers$" # todo: NEW TRANSLATION
 pam_the_christian_church.0056.desc.heretic_rulers: "Jejich váleční kazatelé vyhlašují křížovou výpravu a zanedbávají vlastní země. Nechme Římany vyčerpat síly v dalekých pustinách." # todo: NEW TRANSLATION
 pam_the_christian_church.0056.desc.western: "Ocel může dosáhnout tam, kam kázání nedosáhnou.\n\n" # todo: NEW TRANSLATION
 pam_the_christian_church.0056.desc.eastern: "Západní vojska táhnou do Svaté země.\n\n" # todo: NEW TRANSLATION
 pam_the_christian_church.0056.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$" # todo: NEW TRANSLATION
 pam_the_christian_church.0056.a: "$pam_the_christian_church.0052.a$" # todo: NEW TRANSLATION
 pam_the_christian_church.0056.b: "$pam_the_christian_church.0051.b$" # todo: NEW TRANSLATION
 pam_the_christian_church.0057.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]" # todo: NEW TRANSLATION
 pam_the_christian_church.0057.desc.intro.head: "$pam_the_christian_church.0057.desc.intro.common$ pod bedlivým dohledem [christianity.GetReligiousHeadTitle.GetNamePossessive|U].\n\n" # todo: NEW TRANSLATION
 pam_the_christian_church.0057.desc.intro.no_head: "$pam_the_christian_church.0057.desc.intro.common$.\n\nI bez jediného nesporného pastýře musí víra znovu najít cestu k rozumu.\n\n" # todo: NEW TRANSLATION
 pam_the_christian_church.0057.desc.intro.common: "Spory v církvi ustaly. [GetSituation('the_christian_church').GetTopSubRegion.GetName] vítá věk míru a společenství" # todo: NEW TRANSLATION
 pam_the_christian_church.0057.desc.unreformed_pagan: "$pam_the_christian_church.0054.desc.unreformed_pagan$" # todo: NEW TRANSLATION
 pam_the_christian_church.0057.desc.heathen_rulers: "$pam_the_christian_church.0054.desc.heathen_rulers$" # todo: NEW TRANSLATION
 pam_the_christian_church.0057.desc.heretic_rulers: "$pam_the_christian_church.0054.desc.heretic_rulers$" # todo: NEW TRANSLATION
 pam_the_christian_church.0057.desc.western: "Učenci mohou vršit jeden argument na druhý, ale většina duší stále poznává Boha skrze slova kněze.\n\nNesmíme zapomínat, že naše náboženství patří lidu." # todo: NEW TRANSLATION
 pam_the_christian_church.0057.desc.eastern: "Stále se modlíme zpěvem, zatímco západní písaři se sklánějí nad těžkopádnými smlouvami. Souznění vítáme, ale jejich učené spory by neměly pronikat do našich kanceláří." # todo: NEW TRANSLATION
 pam_the_christian_church.0057.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$" # todo: NEW TRANSLATION
 pam_the_christian_church.0057.a: "$pam_the_christian_church.0054.a$" # todo: NEW TRANSLATION
 pam_the_christian_church.0057.b: "$pam_the_christian_church.0051.b$" # todo: NEW TRANSLATION
 pam_the_christian_church.0058.t: "Svolání koncilu" # todo: NEW TRANSLATION
 pam_the_christian_church.0058.desc: "Dlouhá léta [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] vrcholí. Byl svolán koncil, aby jednou provždy rozhodl, kdo bude investovat duchovenstvo: církev, nebo koruna." # todo: NEW TRANSLATION
 pam_the_christian_church.0058.a: "Ať je rozhodnuto." # todo: NEW TRANSLATION
 pam_the_christian_church.0059.t: "Koncil se schází" # todo: NEW TRANSLATION
 pam_the_christian_church.0059.desc.located: "Rozeslali jsme pozvánky a otcové církve se scházejí na koncilu o investituře, který svolal [investiture_convene_host.GetTitledFirstName] v [investiture_convene_location.GetName]. Jejich rozhodnutí určí, kdo bude investovat duchovenstvo — církev, nebo koruna — a ovlivní tak celé křesťanstvo." # todo: NEW TRANSLATION
 pam_the_christian_church.0059.desc: "Rozeslali jsme pozvánky a otcové církve se scházejí na koncilu o investituře. Jejich rozhodnutí určí, kdo bude investovat duchovenstvo — církev, nebo koruna — a ovlivní tak celé křesťanstvo." # todo: NEW TRANSLATION
 pam_the_christian_church.0059.a: "Ať jednají." # todo: NEW TRANSLATION
 pam_the_christian_church_not_hof_trigger_tt: "Nejste hlavou víry" # todo: NEW TRANSLATION
 pam_investiture_upcoming_council_tt: "Církev brzy svolá zvláštní koncil, který rozhodne o příští [doctrine|E] jmenování duchovních vaší [faith|E]." # todo: NEW TRANSLATION
 pam_the_christian_church.0060.t: "Ať mezi vámi nejsou rozkoly" # todo: NEW TRANSLATION
 pam_the_christian_church.0060.desc: "Křesťanstvo balancuje na ostří nože. [schism_mainline_rite.GetName] si nárokuje dědictví apoštolů, zatímco [schism_competitor_rite.GetName] odmítá ustoupit.\n\nSám Kristus varoval, že [Glossary( 'Omne regnum divisum contra se desolabitur', 'MATTHEW_12_25_LATIN_GLOSS' )]. Pokud se tato rána během krize ještě prohloubí, církev už možná nikdy nebude mluvit jedním hlasem." # todo: NEW TRANSLATION
 pam_the_christian_church.0060.a: "Stojím na straně [schism_mainline_rite.GetNameNoTooltip]." # todo: NEW TRANSLATION
 pam_the_christian_church.0060.a.tt: "Přispívá k [decision|E] [GetDecisionWithKey('pam_cause_great_schism_decision').GetName]" # todo: NEW TRANSLATION
 pam_the_christian_church.0060.b: "Stojím na straně [schism_competitor_rite.GetNameNoTooltip]." # todo: NEW TRANSLATION
 pam_the_christian_church.0060.b.tt: "Přispívá k [decision|E] [GetDecisionWithKey('pam_cause_great_schism_decision').GetName]" # todo: NEW TRANSLATION
 pam_the_christian_church.0060.c: "Tělo potřebuje dvě paže." # todo: NEW TRANSLATION
 pam_the_christian_church.0060.c.tt: "Přispívá k [decision|E] [GetDecisionWithKey('pam_prevent_great_schism_decision').GetName]" # todo: NEW TRANSLATION
 pam_the_christian_church.0061.t: "Velké schizma" # todo: NEW TRANSLATION
 pam_the_christian_church.0061.desc: "Vyslanci z [schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip] vynesli nad oltářem tento rozsudek:\n\n„Ať jsou [schism_eastern_faith.GetReligiousHead.GetFirstName], falešně nazývaný [schism_eastern_faith.ReligiousHeadName], a všichni jeho následovníci prokleti. [Glossary( 'Maranatha', 'MARANATHA_GLOSS' )] se všemi kacíři! Ba dokonce i s ďáblem a jeho anděly, pokud nebudou činit pokání.“\n\n„Tento bezbožný dokument budiž proklet spolu s těmi, kteří jej upravili, sepsali či s ním měli cokoli společného,“ odpověděl [schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip].\n\nVěřící se rozdělili na [schism_western_faith.GetAdherentNamePlural] a [schism_eastern_faith.GetAdherentNamePlural]. Má duše je nyní [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]." # todo: NEW TRANSLATION
 pam_the_christian_church.0061.desc.bystander: "Z [schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip] přicházejí zprávy: papežští legáti vyhlásili nad oltářem klatbu a [schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip] jim odpověděl stejným způsobem.\n\nTi, kdo se nazývali jedinou církví, se nyní rozdělili na [schism_western_faith.GetAdherentNamePlural] a [schism_eastern_faith.GetAdherentNamePlural]. Jejich spor se mě nikdy netýkal a víra [ROOT.Char.GetFaith.GetName] se jím nezměnila, přesto je trpké být toho svědkem." # todo: NEW TRANSLATION
 pam_the_christian_church.0061.a: "Staň se." # todo: NEW TRANSLATION
 pam_the_christian_church.0061.a.shame: "To je opravdu škoda." # todo: NEW TRANSLATION
 pam_the_christian_church.0061.a.bystander: "Je škoda, když se bratři hádají." # todo: NEW TRANSLATION
 MARANATHA_GLOSS: "Aramejské zvolání, které znamená #bold „Pane náš, přijď!“#! Z verše 1. Korintským 16:22 se stalo formulí proklínání: prokletí jsou vyobcováni, dokud se Pán nevrátí." # todo: NEW TRANSLATION
 pam_the_christian_church.0062.t: "Společenství zachováno" # todo: NEW TRANSLATION
 pam_the_christian_church.0062.desc: "Rána, která hrozila rozštěpit křesťanstvo, je zašitá. Díky úsilí [schism_peacemaker.GetTitledFirstName] usedají znesvářené stolce opět k jednomu stolu.\n\n[Glossary( 'Solliciti servare unitatem Spiritus in vinculo pacis. Unum corpus, et unus Spiritus... Unus Dominus, una fides, unum baptisma.', 'EPHESIANS_4_3_6_LATIN_GLOSS' )]\n\n[ROOT.Char.GetFaith.GetName] zůstává ve společenství." # todo: NEW TRANSLATION
 pam_the_christian_church.0062.a: "Budiž Pán požehnán." # todo: NEW TRANSLATION
 pam_the_christian_church.0062.a.peacemaker: "Žádný stolec nebude vládnout ostatním." # todo: NEW TRANSLATION
 pam_the_christian_church.0062.b: "Ať nás všechny vede [new_head_of_faith.GetTitledFirstNameNoTooltip]." # todo: NEW TRANSLATION
 pam_the_christian_church.0062.b.self: "Pak se mi bude zodpovídat celé stádo." # todo: NEW TRANSLATION
 pam_the_christian_church.0063.t: "Ten, kdo zůstal pozadu" # todo: NEW TRANSLATION
 pam_the_christian_church.0063.desc: "Přestoupil jsem k [ROOT.Char.GetRite.GetName], ale [schism_dissenter.GetTitledFirstName] mě nenásledoval. [schism_dissenter.GetSheHe|U] si nepřestává dělat starosti o mou duši a o stádo, které jsem opustil:\n\n„Opustil jsi nás,“ říká [schism_dissenter.GetSheHe] tiše. „Až bude církev rozervána... a ona bude... ty a já budeme stát na opačných stranách té rány.“" # todo: NEW TRANSLATION
 pam_the_christian_church.0063.a: "Tentýž Bůh slyší nás oba." # todo: NEW TRANSLATION
 pam_the_christian_church.0063.b: "Dovol mi ukázat ti, proč jsem přestoupil." # todo: NEW TRANSLATION
 pam_the_christian_church.0063.b.success: "[schism_dissenter.GetTitledFirstNameNoTooltip] přestoupí se mnou" # todo: NEW TRANSLATION
 pam_the_christian_church.0063.b.failure: "[schism_dissenter.GetTitledFirstNameNoTooltip] se nedá přesvědčit" # todo: NEW TRANSLATION
 pam_the_christian_church.0063.c: "Nech si své obavy pro sebe." # todo: NEW TRANSLATION
 pam_the_christian_church.0064.t: "Rána se otevře" # todo: NEW TRANSLATION
 pam_the_christian_church.0064.desc.opening.self_mainline: "Můj hlas se střetává s hlasem [schism_competitor_head.GetTitledFirstName]." # todo: NEW TRANSLATION
 pam_the_christian_church.0064.desc.opening.self_competitor: "Můj hlas se střetává s hlasem [schism_mainline_head.GetTitledFirstName]." # todo: NEW TRANSLATION
 pam_the_christian_church.0064.desc.opening: "Hlasy [schism_mainline_head.GetTitledFirstName] a [schism_competitor_head.GetTitledFirstName] se střetávají. " # todo: NEW TRANSLATION
 pam_the_christian_church.0064.desc: "Mezi [schism_mainline_rite.GetName] a [schism_competitor_rite.GetName] nevidím cestu zpět k svornosti.\n\nVarování z Písma se naplnilo: [Glossary( 'Omne regnum divisum contra se desolabitur', 'MATTHEW_12_25_LATIN_GLOSS' )]. Společenství v rámci [christianity.GetName] se dosud nerozpadlo, ale rána se otevře. Její hodina nevyhnutelně přijde." # todo: NEW TRANSLATION
 pam_the_christian_church.0064.a: "Bože, neopouštěj nás." # todo: NEW TRANSLATION
 pam_the_christian_church.0064.a.tt: "Pokrok velkého schizmatu dosáhl prahové hodnoty" # todo: NEW TRANSLATION
