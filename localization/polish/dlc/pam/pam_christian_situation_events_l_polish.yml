l_polish:
 pam_the_christian_church.0051.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0051.desc.intro: "[GetSituation('the_christian_church').GetTopSubRegion.GetName|U] se rozprostírá napříč mnoha panstvími a zahrnuje nespočet rozmanitých národů s vlastními jazyky, kulturami a vzájemnými sváry.\n\nVěroučné spory jsou staré jako sama církev, avšak v těchto posledních časech, sužovaných morem, válkami a kacířstvím, prochází naše jednota těžkou zkouškou.\n\nTak jako apoštol [st_paul.GetName] kdysi vyzýval Korinťany k jednotě, měli by i všichni [Concept('christians','křesťané')|E] dbát jeho slov: [Glossary('non sint in vobis schismata','1_CORINTHIANS_1_10_LATIN_GLOSS')]. Jinak zabředneme do kacířství a staneme se pouhými hříčkami v rukou Antikrista.\n\n"
 pam_the_christian_church.0051.desc.unreformed_pagan: "Naši změkčilí sousedé, [Concept('christians','křesťané')|E], následují slabého a žárlivého boha. Hašteří se jako děti, které se přou o povahu své loutky. Jejich ostražitost mezitím ochabuje a jejich meče hladovějí, neboť už dávno neokusily slast poctivého krveprolití.\n\nDoufají, že k nám vyšlou své svaté muže, aby v našich zemích šířili jejich slabost. Co kdybychom je místo toho navštívili my a vyplenili jejich pokladnice? Třeba se od nás znovu naučí, co znamená být silný!"
 pam_the_christian_church.0051.desc.heathen_rulers: "Naši [Concept('christian','křesťanští')|E] sousedé jsou hrubí a věčně rozhádaní. Jsou jako kal zvířený ve vodě, ubohý a pokřivený odraz nás, které vede [ROOT.Char.GetFaith.HighGodName]. Uvízli v minulosti a jejich falešná víra je dovede jedině k záhubě.\n\nJejich poklady, jakkoli skromné, čekají, až si je vezmeme. Jejich lid, jakkoli neukázněný, přímo vybízí k podrobení."
 pam_the_christian_church.0051.desc.heretic_rulers: "Ten osel na stolci [st_peter.Custom('CZ_Name_G')] by nás nejraději označil za kacíře, přestože právě my jsme pravověrní! Kdyby se Kristus znovu narodil, tenhle pokrytec by se jistě přidal k farizeům a opět žádal ukřižování našeho Pána.\n\nJen pohleďme, jak hluboké rozkoly panují mezi námi, kdo vyznáváme Krista jako svého Pána! Právě falešný kněz v Římě zasévá semena tohoto sváru.\n\nTen Satanův místodržící by z nás nejraději učinil mučedníky. Tuto zhoubnou ránu musíme vyříznout, má-li dojít spásy všech [Concept('christians','křesťanů')|E]!"
 pam_the_christian_church.0051.desc.western: "Moc římského biskupa zeslábla. Musíme proto zacelit trhliny ve víře, než nastane poslední soud."
 pam_the_christian_church.0051.desc.eastern: "Obklíčeni nepřáteli Krista musíme najít společnou řeč s římským biskupem, než nastane poslední soud."
 pam_the_christian_church.0051.desc.investiture_temporal: "\n\nKoncil ponechal světským korunám právo sesazovat preláty jmenované církví."
 pam_the_christian_church.0051.desc.oriental_orthodox: "„[Glossary('Mia physis tou theou logou sesarkomene','MIAPHYSITISM_GLOSS')]“. Musíme přivést své bratry zpět ke světlu, než nastane poslední soud."
 pam_the_christian_church.0051.a: "Ať nás vede Kristus!"
 pam_the_christian_church.0051.b: "Musíme tyto Kristovy následovníky bedlivě sledovat."
 MIAPHYSITISM_GLOSS: "#bold „Jedna je přirozenost vtěleného Božího Slova!“#! prohlásil svatý Cyril Alexandrijský na efezském koncilu roku 431 n. l. Tento christologický názor, známý jako miafyzitismus, je běžně zastáván orientálními pravoslavnými církvemi."
 pam_the_christian_church.0052.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0052.desc.intro: "[GetSituation('the_christian_church').GetTopSubRegion.GetName|U] zahaluje temnota, z níž se ozývá sbor rozhořčených hlasů.\n\n#EMP „Řím se mění v novodobou Sodomu!“#!\n\n#EMP „Papež ze sebe dělá kuplíře i nevěstku!“#!\n\nDokonce i ti umírněnější musejí uznat, že církev prochází hlubokou krizí a bez nápravy se neobejde."
 pam_the_christian_church.0052.desc.unreformed_pagan: "Naši slabošští sousedé, [Concept('christians','křesťané')|E], bědují: „Náš konec se blíží! Náš papež je divoký jako nějaký pohan!“\n\nAlespoň jedno z toho je pravda. Pomozme jim tedy přivolat konec, o kterém tak rádi mluví!"
 pam_the_christian_church.0052.desc.heathen_rulers: "„Naše církev je v krizi!“ křičí [Concept('christians','křesťané')|E].\n\nJak milé, že konečně přiznávají něco, co my víme odjakživa. Tihle bezvěrečtí hlupáci mohou jen doufat, že jednoho dne přijmou cestu, kterou ukazuje [ROOT.Char.GetFaith.HighGodName].\n\nJejich poklady, jakkoli skromné, čekají, až si je vezmeme. Jejich lid, jakkoli neukázněný, přímo vybízí k podrobení."
 pam_the_christian_church.0052.desc.heretic_rulers: "Toho Antikrista v rouchu svatého Petra musíme zastavit!"
 pam_the_christian_church.0052.desc.western: "Náprava musí začít v Římě. Teprve potom se [GetSituation('the_christian_church').GetTopSubRegion.GetNameNoTooltip] může uzdravit."
 pam_the_christian_church.0052.desc.eastern: "Obklíčeni nepřáteli Krista musíme vymýtit zkaženost Říma, jinak nás všechny pohltí."
 pam_the_christian_church.0052.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0052.a: "Kéž nám Pán osvítí cestu!"
 pam_the_christian_church.0052.b: "$pam_the_christian_church.0051.b$"
 pam_the_christian_church.0053.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0053.desc.intro: "Radujme se z velikých úspěchů naší misie! [GetSituation('the_christian_church').GetTopSubRegion.GetName|U] rozšiřuje své hranice, zatímco se pohanští barbaři učí kráčet po Kristově cestě.\n\nBohužel ne všichni přijímají učení církve s otevřenou náručí. Netřeba však zoufat! Odmítnou-li naše misionáře, mohou se našim modlitbám naučit pod hrotem meče!\n\n"
 pam_the_christian_church.0053.desc.unreformed_pagan: "[Concept('christians','Křesťané')|EU] přicházejí do našich zemí se svými svatými muži. Když je odmítneme, vrátí se s meči.\n\nMnozí z nás se snaží zachovat staré způsoby, které nám ukazuje [ROOT.Char.GetFaith.HighGodName]. Najdou se však i tací, kteří ve službě tomuto člověku-bohu, Kristu, spatřují jisté výhody. Jejich moc získá božské posvěcení, církev může roznášet jejich příkazy a co je snad nejlákavější, vybírá daně."
 pam_the_christian_church.0053.desc.heathen_rulers: "Naši sousedé, [Concept('christians','křesťané')|E], násilím obracejí modloslužebníky na svou víru, přestože ti sotva stojí za něco víc než za pobití.\n\nDokud jsou jejich meče namířeny jinam než proti nám, [ROOT.Char.GetFaith.HighGodName] nám otevírá jedinečnou příležitost. Jejich poklady, jakkoli skromné, čekají, až si je vezmeme. Jejich lid, jakkoli neukázněný, přímo vybízí k podrobení."
 pam_the_christian_church.0053.desc.heretic_rulers: "Ten samozvanec v Římě doufá, že obrátí pohany na své pomýlené učení! Tomu Antikristovi nestačí, že už otrávil mysl tolika [Concept('christians','křesťanů')|E]. Jeho zvrácená lačnost ho žene k tomu, aby do svého pekelného objetí sevřel i ty nezkušené modloslužebníky."
 pam_the_christian_church.0053.desc.western: "Musíme dohlédnout na to, aby se nově obrácení křesťané řídili obřady, které předepisuje [ROOT.Char.GetRite.GetName], jak schválil stolec svatého Petra."
 pam_the_christian_church.0053.desc.eastern: "Řím sice tvrdí, že [GetSituation('the_christian_church').GetTopSubRegion.GetName] zůstane mimo dosah jeho misijních snah, přesto musíme být ve střehu. Co když se pokusí zničit vše, co pro nás představuje [ROOT.Char.GetRite.GetName]? Nebo, co je ještě horší, obrátí své meče, čerstvě zbrocené pohanskou krví, proti vlastním křesťanským bratřím?"
 pam_the_christian_church.0053.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0053.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0053.b: "$pam_the_christian_church.0051.b$"
 pam_the_christian_church.0054.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0054.desc.intro.head: "$pam_the_christian_church.0054.desc.intro.common$\n\n[christianity.GetReligiousHead.GetTitledFirstName|U] stojí před nelehkým úkolem, ale církev ještě není ztracena.\n\n"
 pam_the_christian_church.0054.desc.intro.no_head: "$pam_the_christian_church.0054.desc.intro.common$\n\nCírkev však ještě není ztracena!\n\n"
 pam_the_christian_church.0054.desc.intro.common: "Naše víra v Boha může být neochvějná, ale mnozí už ztratili důvěru v církev. Duchovní, kteří kdysi svými skutky následovali Kristův příklad, se nyní přou i o ty nejzákladnější články víry."
 pam_the_christian_church.0054.desc.unreformed_pagan: "[christianity.GetAdherentNamePlural|U] si cupují vlastní kněžská roucha a doufají, že si jejich Bůh nevšimne záplat. Budou-li mít plné ruce práce se spravováním ornátů a letopisů, možná vyšlou méně duchovních, aby obtěžovali naše posvátné háje a říční svatyně."
 pam_the_christian_church.0054.desc.heathen_rulers: "[christianity.GetAdherentNamePlural|U] chystají velkou přestavbu svých zákonů a oltářů. Každá ze soupeřících stran přitom tvrdí, že právě ona slouží jejich trpícímu bohu s větší čistotou. Můžeme si všímat jejich nových hesel, ale ostří našich seker stále odpovídá jasněji než všechny jejich koncily."
 pam_the_christian_church.0054.desc.heretic_rulers: "Římští sektáři se teď hašteří o reformu! To, čemu říkají obroda, není nic než nové uspořádání téhož jha, utaženého ještě zhoubnější samolibou pravověrností. Ať jejich reformy nejprve rozbíjejí lebky ve vlastních bazilikách, než si vzpomenou na ty naše."
 pam_the_christian_church.0054.desc.western: "Někteří možná nazývají toto narovnání kurzu reformou, ale lidé se novot obávají. Snadněji je přesvědčíme, pokud změny představíme jako „návrat ke starým pořádkům“."
 pam_the_christian_church.0054.desc.eastern: "Řím, či kterákoli z komnat jeho kurie, která se sama prohlašuje za rozhodčího celé oikúmené, se usilovně snaží vypilovat své obřady. Nové kánony, nové přísahy, nová kázání proti dávným hříchům. My přihlížíme, napomínáme a upevňujeme vlastní synody, aby si nikdo nespletl západní mravokárství s jhem, jemuž se musí podrobit celý křesťanský svět."
 pam_the_christian_church.0054.desc.investiture_spiritual: "\n\nKoncil rozhodl ve prospěch výhradního práva církve jmenovat duchovní do jejich úřadů na doživotí."
 pam_the_christian_church.0054.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0054.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0054.b: "$pam_the_christian_church.0051.b$"
 pam_the_christian_church.0055.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0055.desc.intro.head: "$pam_the_christian_church.0055.desc.intro.common$\n\n[christianity.GetReligiousHeadTitle.GetNamePossessive|U] biskupové čelí nátlaku světských knížat, která od nich vynucují přísahy, jako by biskupské svěcení bylo jen dalším statkem k pronájmu. Mezitím [christianity.GetReligiousHeadTitle.GetName] zakazuje korunovaným vládcům žehnat mitrám, které sami neposvětili.\n\n"
 pam_the_christian_church.0055.desc.intro.no_head: "$pam_the_christian_church.0055.desc.intro.common$\n\nBez pastýře, kterého by všichni uznávali, si každý panovník dosazuje biskupy podle vlastní vůle. Jejich roucha jsou sice posvátná, ale z jejich svěcení je cítit spíše zlato než kadidlo.\n\n"
 pam_the_christian_church.0055.desc.intro.common: "[GetSituation('the_christian_church').GetTopSubRegion.GetName|U] zachvátil spor mezi oltářem a trůnem, o němž se už dávno nemluví jen šeptem."
 pam_the_christian_church.0055.desc.unreformed_pagan: "Zatímco se [christianity.GetAdherentNamePlural|l] přou, kdo má právo světit biskupy – zda koruna, nebo kněžské roucho –, ubývá misionářů, kteří obracejí zrak k našim zemím. Ať se králové a pontifikové třeba udusí vlastními listinami! Jejich rozkol alespoň dopřeje našim posvátným hájům klid."
 pam_the_christian_church.0055.desc.heathen_rulers: "$pam_the_christian_church.0054.desc.heathen_rulers$"
 pam_the_christian_church.0055.desc.heretic_rulers: "Řím křičí o tyranii, když přijde řeč na investituru, ale kdyby mohl, sám by naše učitele uvrhl do okovů! Nejdřív si sundejte jha z vlastních šíjí, farizejové, a teprve potom nás poučujte!"
 pam_the_christian_church.0055.desc.western: "Přikloníme-li biskupskou berlu příliš blízko ke královskému žezlu, může se stát, že je od sebe nakonec ani nerozeznáme.\n\n"
 pam_the_christian_church.0055.desc.eastern: "Západní králové se s Římem přou o prsteny a berly a jejich hříchy poskvrňují celou církev.\n\n"
 pam_the_christian_church.0055.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0055.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0055.b: "$pam_the_christian_church.0051.b$"
 pam_the_christian_church.0056.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0056.desc.intro: "Všude, kam sahá [GetSituation('the_christian_church').GetTopSubRegion.GetName], volají věřící po osvobození Božího hrobu. Kříže se leští před nadcházejícím tažením a relikvie končí v zástavě, aby naplnily válečné pokladnice.\n\nNáboženské nadšení plane prudkým žárem. Pokud však toto horečné zanícení ochladne, může se horlivost proměnit v pochybnosti stejně rychle, jako vítr roznese popel z pohřební hranice.\n\n"
 pam_the_christian_church.0056.desc.unreformed_pagan: "$pam_the_christian_church.0053.desc.unreformed_pagan$"
 pam_the_christian_church.0056.desc.heathen_rulers: "$pam_the_christian_church.0053.desc.heathen_rulers$"
 pam_the_christian_church.0056.desc.heretic_rulers: "Jejich váleční kazatelé vyhlašují křížové výpravy, zatímco zanedbávají vlastní země. Jen ať se Římané vyčerpají na vzdálených písečných dunách!"
 pam_the_christian_church.0056.desc.western: "Ocel může dosáhnout tam, kam slova kazatelů nedolehnou.\n\n"
 pam_the_christian_church.0056.desc.eastern: "Západní vojska táhnou do Svaté země.\n\n"
 pam_the_christian_church.0056.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0056.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0056.b: "$pam_the_christian_church.0051.b$"
 pam_the_christian_church.0057.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0057.desc.intro.head: "$pam_the_christian_church.0057.desc.intro.common$.\n\n[christianity.GetReligiousHeadTitle.GetNamePossessive|U] bedlivý dohled nadále střeží tento nově nalezený smír.\n\n"
 pam_the_christian_church.0057.desc.intro.no_head: "$pam_the_christian_church.0057.desc.intro.common$.\n\nI bez jediného všeobecně uznávaného pastýře však víra musí znovu hledat cestu k rozumu.\n\n"
 pam_the_christian_church.0057.desc.intro.common: "Církevní sváry utichly. [GetSituation('the_christian_church').GetTopSubRegion.GetName|U] vítá období míru a duchovního společenství"
 pam_the_christian_church.0057.desc.unreformed_pagan: "$pam_the_christian_church.0054.desc.unreformed_pagan$"
 pam_the_christian_church.0057.desc.heathen_rulers: "$pam_the_christian_church.0054.desc.heathen_rulers$"
 pam_the_christian_church.0057.desc.heretic_rulers: "$pam_the_christian_church.0054.desc.heretic_rulers$"
 pam_the_christian_church.0057.desc.western: "Učenci mohou vršit jeden argument na druhý, ale většina věřících stále poznává Boha především skrze slova kněží.\n\nNesmíme zapomínat, že naše náboženství je především vírou prostého lidu."
 pam_the_christian_church.0057.desc.eastern: "My stále pozvedáme své modlitby zpěvem, zatímco se západní písařské stoly prohýbají pod tíhou učených smluv. Svornost vítáme, ale jejich školské spory by neměly pronikat do našich kanceláří."
 pam_the_christian_church.0057.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0057.a: "$pam_the_christian_church.0054.a$"
 pam_the_christian_church.0057.b: "$pam_the_christian_church.0051.b$"
 pam_the_christian_church.0058.t: "Svolává se koncil"
 pam_the_christian_church.0058.desc: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|U] po dlouhých letech dospívá k vyvrcholení. Svolává se koncil, který má jednou provždy rozhodnout, komu náleží právo dosazovat duchovní do jejich úřadů: církvi, nebo koruně."
 pam_the_christian_church.0058.a: "Ať je rozhodnuto."
 pam_the_christian_church.0059.t: "Koncil se schází"
 pam_the_christian_church.0059.desc.located: "Pozvánky byly rozeslány a církevní otcové se scházejí na investiturním koncilu, který [investiture_convene_host.GetTitledFirstName] [Select_CString(investiture_convene_host.IsFemale,'svolala','svolal')] [CZPrepV(investiture_convene_location.GetNameNoTooltip)|l] [CZProvName(investiture_convene_location,'L')]. Jejich rozhodnutí určí celému křesťanstvu, komu náleží právo dosazovat duchovní: církvi, nebo koruně."
 pam_the_christian_church.0059.desc: "Pozvánky byly rozeslány a církevní otcové se scházejí na investiturním koncilu. Jejich rozhodnutí určí celému křesťanstvu, komu náleží právo dosazovat duchovní: církvi, nebo koruně."
 pam_the_christian_church.0059.a: "Ať jednají."
 pam_the_christian_church_not_hof_trigger_tt: "Nejsi [Concept('head_of_faith','hlavou víry')|E]"
 pam_investiture_upcoming_council_tt: "Církev brzy svolá zvláštní koncil, který rozhodne o budoucí [Concept('doctrine','doktríně')|E] jmenování duchovních tvé [Concept('faith','víry')|E]."
 pam_the_christian_church.0060.t: "Ať mezi vámi nejsou rozkoly"
 pam_the_christian_church.0060.desc: "Křesťanstvo balancuje na ostří nože. [schism_mainline_rite.GetName|U] si nárokuje dědictví apoštolů, zatímco [schism_competitor_rite.GetName] odmítá ustoupit.\n\nSám Kristus varoval: [Glossary('Omne regnum divisum contra se desolabitur','MATTHEW_12_25_LATIN_GLOSS')]. Pokud se tato rána během krize ještě více zanítí, církev už možná nikdy nepromluví jediným hlasem."
 pam_the_christian_church.0060.a: "[schism_mainline_rite.GetNameNoTooltip|U] má mou podporu."
 pam_the_christian_church.0060.a.tt: "Přispěje k uskutečnění [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('pam_cause_great_schism_decision').GetName]"
 pam_the_christian_church.0060.b: "[schism_competitor_rite.GetNameNoTooltip|U] má mou podporu."
 pam_the_christian_church.0060.b.tt: "Přispěje k uskutečnění [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('pam_cause_great_schism_decision').GetName]"
 pam_the_christian_church.0060.c: "Tělo přece musí mít dvě paže."
 pam_the_christian_church.0060.c.tt: "Přispěje k uskutečnění [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('pam_prevent_great_schism_decision').GetName]"
 pam_the_christian_church.0061.t: "Velké schizma"
 pam_the_christian_church.0061.desc: "Vyslanci [CZPrepZ(schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(schism_western_faith.GetReligiousHead.GetCapitalLocation,'G')] položili na oltář rozsudek:\n\n„Kéž [schism_eastern_faith.GetReligiousHead.GetFirstName], [Select_CString(schism_eastern_faith.GetReligiousHead.IsFemale,'která si neprávem říká','který si neprávem říká')] [schism_eastern_faith.ReligiousHeadName], i všichni [Select_CString(schism_eastern_faith.GetReligiousHead.IsFemale,'její','jeho')] stoupenci propadnou klatbě. Klatba [Glossary('Maranatha','MARANATHA_GLOSS')] ať stihne všechny kacíře! Ba i samotného ďábla a jeho anděly, pokud nebudou činit pokání.“\n\n„Tento bezbožný dokument budiž proklet spolu se všemi, kdo jej upravovali, sepsali nebo s ním měli cokoli společného,“ odpovídá [schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip].\n\nVěřící se rozdělili a nyní proti sobě stojí [schism_western_faith.GetAdherentNamePlural|l] a [schism_eastern_faith.GetAdherentNamePlural|l]. Má duše je nyní [ROOT.Char.GetFaith.Custom('CZ_AdjectiveNoTooltip_aa')|l]."
 pam_the_christian_church.0061.desc.bystander: "[CZPrepZ(schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip)|U] [CZProvNameNoTooltip(schism_western_faith.GetReligiousHead.GetCapitalLocation,'G')] přicházejí zprávy: papežští legáti položili na oltář listinu s klatbou a [schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip] jim [Select_CString(schism_eastern_faith.GetReligiousHead.IsFemale,'odpověděla','odpověděl')] stejným způsobem.\n\nTi, kdo se dosud považovali za jedinou církev, se nyní rozdělili na [CZAdherentPl_A(schism_western_faith)|l] a [CZAdherentPl_A(schism_eastern_faith)|l]. Jejich spor nikdy nebyl mým sporem a víra [ROOT.Char.GetFaith.GetName] se kvůli němu nezměnila. Přesto je trpké být svědkem takového rozkolu."
 pam_the_christian_church.0061.a: "Budiž."
 pam_the_christian_church.0061.a.shame: "To je vskutku ostuda."
 pam_the_christian_church.0061.a.bystander: "Jak smutné, když bratři bojují proti sobě."
 MARANATHA_GLOSS: "Aramejské zvolání znamenající #bold „Pane náš, přijď!“#! Pochází z Prvního listu Korintským (16,22) a postupně se stalo součástí formule klatby: prokletí jsou vyloučeni ze společenství věřících až do Pánova návratu."
 pam_the_christian_church.0062.t: "Jednota zachována"
 pam_the_christian_church.0062.desc: "Rána, která hrozila roztrhnout křesťanstvo, je konečně zacelena. Zásluhou [schism_peacemaker.Custom('CZ_TitledFirstName_G')] usedají znepřátelené církevní stolce opět ke společnému stolu.\n\n[Glossary('Solliciti servare unitatem Spiritus in vinculo pacis. Unum corpus, et unus Spiritus... Unus Dominus, una fides, unum baptisma.','EPHESIANS_4_3_6_LATIN_GLOSS')]\n\n[ROOT.Char.GetFaith.GetName|U] zůstává v církevním společenství."
 pam_the_christian_church.0062.a: "Buď Pán požehnán."
 pam_the_christian_church.0062.a.peacemaker: "Žádný stolec nebude vládnout ostatním."
 pam_the_christian_church.0062.b: "Ať nás všechny vede [new_head_of_faith.GetTitledFirstNameNoTooltip]."
 pam_the_christian_church.0062.b.self: "Pak se mi bude zodpovídat celé stádo."
 pam_the_christian_church.0063.t: "Ten, kdo zůstal pozadu"
 pam_the_christian_church.0063.desc: "[Select_CString(ROOT.Char.IsFemale,'Přijala','Přijal')] jsem [ROOT.Char.GetRite.GetName], ale [schism_dissenter.GetTitledFirstName] mě [Select_CString(schism_dissenter.IsFemale,'nenásledovala','nenásledoval')]. Stále si dělá starosti o mou duši i o stádo, které jsem [Select_CString(ROOT.Char.IsFemale,'opustila','opustil')].\n\n„[Select_CString(ROOT.Char.IsFemale,'Opustila','Opustil')] jsi nás,“ pronáší tiše. „Až se církev roztrhne... a ona se roztrhne... ty a já budeme stát na opačných stranách té rány.“"
 pam_the_christian_church.0063.a: "Oba nás slyší tentýž Bůh."
 pam_the_christian_church.0063.b: "Vysvětlím ti, proč jsem přestoupil[Select_CString(ROOT.Char.IsFemale,'a','')]."
 pam_the_christian_church.0063.b.success: "[schism_dissenter.GetTitledFirstNameNoTooltip|U] přestoupí spolu se mnou"
 pam_the_christian_church.0063.b.failure: "[schism_dissenter.GetTitledFirstNameNoTooltip|U] se nenechá přesvědčit"
 pam_the_christian_church.0063.c: "Nech si své obavy pro sebe."
 pam_the_christian_church.0064.t: "Rána se otevře"
 pam_the_christian_church.0064.desc.opening.self_mainline: "Můj hlas se střetává s hlasem [schism_competitor_head.Custom('CZ_TitledFirstName_G')]."
 pam_the_christian_church.0064.desc.opening.self_competitor: "Můj hlas se střetává s hlasem [schism_mainline_head.Custom('CZ_TitledFirstName_G')]."
 pam_the_christian_church.0064.desc.opening: "Hlasy [schism_mainline_head.Custom('CZ_TitledFirstName_G')] a [schism_competitor_head.Custom('CZ_TitledFirstName_G')] se střetávají. "
 pam_the_christian_church.0064.desc: "[schism_mainline_rite.GetName|U] a [schism_competitor_rite.GetName] už podle mě nikdy nenajdou cestu zpět ke svornosti.\n\nVarování Písma se proměnilo v rozsudek: [Glossary('Omne regnum divisum contra se desolabitur','MATTHEW_12_25_LATIN_GLOSS')]. [christianity.GetName|U] dosud tvoří jediné společenství, ale rána se brzy otevře. Její chvíle nevyhnutelně přijde."
 pam_the_christian_church.0064.a: "Bože, neopouštěj nás."
 pam_the_christian_church.0064.a.tt: "Postup k Velkému schizmatu dosáhl stanoveného prahu"
