 the_christian_church_conversion_phase_situation_phase: "$conversion_phase$"
 conversion_phase: "Konverze"
 conversion_phase_icon: "@pam_the_christian_church_conversion_phase_icon! $conversion_phase$"
 conversion_phase_desc: "Nastává čas nových křtů. Králové vztyčují kříže nad říčními pevnostmi a tržišti, potulní misionáři a královská vojska soupeří o duše obyvatel pohraničí. Obrácení jediného panovníka může přivést ke stejné křtitelnici celé národy."
 reform_phase: "Reforma"
 reform_phase_icon: "@pam_the_christian_church_reform_phase_icon! $reform_phase$"
 reform_phase_desc: "Mezi duchovenstvo se vrací kázeň, řád a horlivá mravní přísnost. Vnitřní uspořádání křesťanství prochází důkladným přezkumem, avšak za očištění církve se často platí krví."
 the_christian_church_reform_phase_situation_phase: "$reform_phase$"
 investiture_crisis: "Spor o investituru"
 investiture_crisis_icon: "@pam_the_christian_church_investiture_crisis_icon! $investiture_crisis$"
 investiture_crisis_desc: "Koruna a biskupská berla stojí proti sobě a přou se o klíče k Božím sýpkám. Světští patroni dosazují preláty předáním berly a prstenu, zatímco církev odmítá uznat oprávněnost takových jmenování."
 the_christian_church_investiture_crisis_situation_phase: "$investiture_crisis$"
 CHRISTIAN_CHURCH_INVESTITURE_TIME_REMAINING: "Příští koncil: [GetGameTimeDifferenceForDiffDays( Situation.MakeScope.VarRemaining('investiture_council_countdown') )]"
 CHRISTIAN_CHURCH_INVESTITURE_TIME_REMAINING_TT: "Čas zbývající do vyvrcholení a vyřešení fáze [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName].\n\nJakmile odpočet skončí, sejde se investiturní koncil, aby projednal [Concept('doctrine','doktrínu')|E] jmenování duchovních [GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName] a podle výsledku hlasování ji nahradil buď doktrínou [GetDoctrineType('doctrine_clerical_succession_spiritual_fixed_appointment').GetBaseName], nebo doktrínou [GetDoctrineType('doctrine_clerical_succession_spiritual_appointment').GetBaseName]. Světští [Concept('rulers','vládci')|E] mohou donutit [Concept('clergy','duchovenstvo')|E] hlasovat opačně prostřednictvím [Concept('casus_belli','casus belli')|E] $PAM_INVESTITURE_CONFLICT_WAR_CB_NAME$ nebo získáním [Concept('puppets','loutek')|E]."
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_CHURCH_AHEAD: "#weak Církev má navrch#!"
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_CROWN_AHEAD: "#weak Koruny mají navrch#!"
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_BALANCED: "#weak Nadcházející hlasování je nerozhodné.#!"
 CHRISTIAN_CHURCH_SCHISM_PROGRESS: "Postup k [Concept('schism','schizmatu')|e]: [Situation.MakeScope.ScriptValue('pam_great_schism_progress_value')|V0] / [Situation.MakeScope.ScriptValue('pam_great_schism_progress_threshold_value')|V0]"
 CHRISTIAN_CHURCH_SCHISM_PROGRESS_TT: "Ukazuje, nakolik spory, v nichž proti sobě stojí [GetRiteByKey('roman_rite').GetAdherentNamePlural|l] a [GetRiteByKey('byzantine_rite').GetAdherentNamePlural|l], přiblížily křesťanstvo k [Concept('schism','Velkému schizmatu')|E].\n\nS narůstajícími křivdami hrozí rozdělení církve. $GREAT_SCHISM_PROGRESS_EFFECT_TT$\n\n@alert_icon! #alert_trial [GetFaithByKey('christian_faith').GetName|U] nemůže ustanovit [Concept('head_of_faith','hlavu víry')|E], dokud nebude rozhodnuto o [Concept('schism','Velkém schizmatu')|E]#!\n\n#help Postup se zvyšuje při následujících událostech:\n$BULLET_WITH_TAB$Hlasování na [CZActivity('activity_ecumenical_council','L')|l], při němž je z [Concept('rites','ritů')|E] odstraněna [Concept('core_tenet','zásada')|E] nebo [Concept('doctrine','doktrína')|E]\n$BULLET_WITH_TAB$Spor mezi rity před zahájením rozprav na [CZActivity('activity_ecumenical_council','L')|l]\n$BULLET_WITH_TAB$[Concept('war','Válka')|EU] mezi [Concept('kings','králi')|E] nebo výše postavenými vládci jednotlivých ritů v rámci situace [GetSituation('the_christian_church').GetName]\n$BULLET_WITH_TAB$Přechod [Concept('holy_site','svatého místa')|E] od jednoho ritu k druhému\n$BULLET_WITH_TAB$Snížení významu [Concept('holy_site','svatého místa')|E] jednoho z obou ritů\n$BULLET_WITH_TAB$Zavraždění [Concept('head_of_rite','hlavy ritu')|E] příslušníkem druhého ritu#!"
 GREAT_SCHISM_PROGRESS_EFFECT_TT: "Následující fáze [GetSituationType('the_christian_church').GetPhaseType('saeculum_obscurum').GetName] zpřístupní [Concept('decisions','rozhodnutí')|E] [GetDecisionWithKey('pam_prevent_great_schism_decision').GetName] a [GetDecisionWithKey('pam_cause_great_schism_decision').GetName] a také [Concept('interaction','interakci')|E] #V $pam_sway_schism_stance_interaction$#!"
