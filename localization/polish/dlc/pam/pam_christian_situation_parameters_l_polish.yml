l_polish:
 the_christian_church: "$game_concept_the_christian_church$"
 the_christian_church_desc: "$game_concept_the_christian_church_desc$"
 the_christian_church_government_effects: "Vládní efekty"
 the_christian_church_government_effects_concept: "[Concept('situation_participant_group','Skupina účastníků')|EU]"
 situation_parameter_the_christian_church_recently_converted_rulers_will_change_rite_easier: "Nedávno obrácené [Concept('christian','křesťanské')|E] [Concept('rulers','vládce')|E] lze snáze přesvědčit k přijetí jiného [Concept('rite','ritu')|E]."
 situation_parameter_the_christian_church_no_aid_to_other_rite: "[Concept('christian','Křesťanští')|EU] [Concept('rulers','vládci')|E] nepřispěchají na pomoc [Concept('rulers','vládcům')|E] jiného [Concept('rite','ritu')|E] v obranné [Concept('holy_war','svaté válce')|E]."
 situation_parameter_the_christian_church_emperor_can_call_ecumenical_council: "Světští [Concept('christian','křesťanští')|E] [Concept('rulers','vládci')|E] s [Concept('title_tier','úrovní')|E] [Concept('emperor','císaře')|E] nebo vyšší mohou svolávat [Concept('ecumenical_councils','ekumenické koncily')|E]."
 situation_parameter_the_christian_church_king_can_appoint_bishops: "Světští [Concept('christian','křesťanští')|E] [Concept('rulers','vládci')|E] na úrovni [Concept('king','krále')|E] nebo vyšší mohou jmenovat držitele [Concept('clerical_titles','duchovních titulů')|E]"
 saeculum_obscurum_clergy_would_marry_desc_secondary_actor: "[secondary_actor.GetShortUIName|U] [Select_CString(secondary_actor.IsLocalPlayer,'žiješ','žije')] jako [secondary_actor.GetFaith.PriestNeuter|l] v bázni Boží: $VALUE|=+0$"
 saeculum_obscurum_clergy_would_marry_desc_actor: "[actor.GetShortUIName|U] [Select_CString(actor.IsLocalPlayer,'žiješ','žije')] jako [actor.GetFaith.GetAdherentNameNoTooltip|l] v bázni Boží: $VALUE|=+0$"
 saeculum_obscurum_clergy_would_marry_desc_secondary_recipient: "[secondary_recipient.GetShortUIName|U] [Select_CString(secondary_recipient.IsLocalPlayer,'žiješ','žije')] jako [secondary_recipient.GetFaith.PriestNeuter|l] v bázni Boží: $VALUE|=+0$"
 saeculum_obscurum_clergy_would_marry_desc_recipient: "[recipient.GetShortUIName|U] [Select_CString(recipient.IsLocalPlayer,'žiješ','žije')] jako [recipient.GetFaith.GetAdherentNameNoTooltip|l] v bázni Boží: $VALUE|=+0$"
