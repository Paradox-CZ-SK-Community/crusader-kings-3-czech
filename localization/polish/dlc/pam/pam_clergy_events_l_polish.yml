l_polish:
 pam_clergy_events.0001.t: "Quo nomine vis vocari?"
 pam_clergy_events.0001.desc: "[Select_CString(chaplain.IsFemale,'Má','Můj')] [chaplain.GetCouncilTitle|l] [chaplain.GetFirstName] obrací list na další prázdný řádek v seznamu nástupců svatého Petra, který je živým svědectvím toho, že [GetTenetType('tenet_apostolic_succession').GetName(GetPlayer.GetRite)|l] stále přetrvává.\n\n#emp „Jméno, které si zvolíš, přežije tvou vládu o tisíc pokolení.“#!\n\n[Select_CString(chaplain.IsFemale,'Její','Jeho')] brk ukazuje na místo, kam má dopadnout inkoust.\n\n#emp „Quo nomine vis vocari?“#!"
 pam_clergy_events.0001.a: "Ať je to jméno navždy známo."
 pam_clergy_events.0003.t: "Změna věroučné zásady"
 pam_clergy_events.0003.desc: "Za působení [pam_recast_pope.Custom('CZ_TitledFirstName_G')] se změnila jedna ze základních zásad ritu [pam_recast_rite.GetNameNoTooltip]: [tenet_to_remove.GetBaseName] ustupuje a [tenet_to_add.GetBaseName] zaujímá její místo."
 pam_clergy_events.0010.t: "Co si přeje [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))|l]"
 pam_clergy_events.0010.desc.intro: "Jako [cardinalate.GetHolder.GetTitleAsNameNoTooltip|l] jsem nástrojem vůle [Select_CString(actor.IsFemale,'Svaté matky','Svatého otce')].\n\n"
 pam_clergy_events.0010.desc.puppet.intro: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))|U] je pro mě nejvyšší autoritou a vede mé kroky při plnění povinností, které vykonávám jako [cardinalate.GetHolder.GetTitleAsNameNoTooltip|l].\n\n"
 pam_clergy_events.0010.desc: "Ve své nekonečné moudrosti [actor.GetTitledFirstName] [Select_CString(actor.IsFemale,'usoudila','usoudil')], že se mám zasadit o "
 pam_clergy_events.0010.desc.develop: "rozvoj veřejných staveb, z nichž budou mít prospěch všichni [recipient.GetFaith.GetAdherentNamePlural|l] v [archdiocese.Custom('CZ_LandedName_L')]."
 pam_clergy_events.0010.desc.convert_faith: "misii, při níž mají [ROOT.Char.Custom('GetUnbelieverNamePlural')|l] v [archdiocese.Custom('CZ_LandedName_L')] a okolí přijmout naši víru."
 pam_clergy_events.0010.desc.increase_control: "uklidnění obyvatelstva v [archdiocese.Custom('CZ_LandedName_L')]."
 pam_clergy_events.0010.desc.cultural_fascination: "urychlení výzkumu nových technologií, z nichž budou mít prospěch také [actor.GetCulture.GetCollectiveNoun]."
 pam_clergy_events.0010.desc.epidemic_resistance: "využití církevních prostředků k omezení šíření epidemií v [archdiocese.Custom('CZ_LandedName_L')]."
 pam_clergy_events.0010.desc.improve_legitimacy: "posílení legitimity [CZFaithAdjDecline(recipient.GetFaith,'ých')|l] panovníků v [archdiocese.Custom('CZ_LandedName_L')]."
 pam_clergy_events.0010.desc.undermine_legitimacy: "oslabení legitimity [CZFaithAdjDecline(recipient.GetFaith,'ých')|l] panovníků v [archdiocese.Custom('CZ_LandedName_L')]."
 pam_clergy_events.0010.a: "„Postarám se o to, [actor.Custom('FormOfAddressForLiege')]!“"
 pam_clergy_events.0010.b: "Desátky by se daly využít lépe..."
 pam_clergy_events.0030.t: "Habemus Papam"
 pam_clergy_events.0030.t.female: "Habemus Mamam"
 pam_clergy_events.0030.desc: "Bílý dým v samém srdci [CZProvName(new_pope.GetCurrentLocation,'G')] ohlašuje, že na svatopetrský stolec usedá [new_pope.GetTitledFirstName]:\n\n„Kéž se za nás před Pánem přimlouvají svatí apoštolové Petr a Pavel, v jejichž moc a autoritu vkládáme svou důvěru. A kéž na vás sestoupí požehnání všemohoucího Boha, Otce i Syna i Ducha svatého a zůstane s vámi navěky.“\n\n„Amen.“"
 pam_clergy_events.0030.a: "Sláva stolci svatého Petra."
 pam_clergy_events.0030.b: "Zdá se, že povstal falešný prorok."
 pam_clergy_events.0030.b.tt: "[Concept('decision','Rozhodnutí')|EU] [GetDecisionWithKey('declare_antipope_decision').GetName] bude po dobu #V 15 let#! levnější"
 pam_clergy_events.0030.aa: "Koho zajímají církevní záležitosti?"
 pam_clergy_events.0030.aa.tt: "Příští události „Habemus Papam“ se budou místo samostatných oken zobrazovat jako zprávy"
 pam_clergy_events.0030.feed: "[new_pope.GetTitledFirstName|U] [Select_CString(new_pope.IsFemale,'byla zvolena','byl zvolen')] [Concept('head_of_faith','hlavou víry')|E]."
 pam_clergy_events.0040.opening: "Zbožné duši, [head_of_faith.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_clergy_events.0040.desc: "Řady Svatého kolegia prořídly, a proto tě povyšuji do kardinálského sboru. Kéž tvá zbožnost a moudrost posílí církev v této těžké chvíli."
 pam_clergy_events.0040.appoint_tt: "Získáváš hodnost [Concept('cardinal','kardinála')|E]"
 pam_clergy_events.0040.a: "Přijímám toto posvátné břemeno."
 pam_clergy_events.0041.opening: "Stolci svatého Petra,"
 pam_clergy_events.0041.desc: "Kardinálské kolegium stále není úplné. [Select_CString(ROOT.Char.IsFemale,'Naše','Naši')] nejzbožnější [ROOT.Char.GetWomenMen|l] už v něm nezasedají a ty dosud necháváš jejich místa neobsazená.\n\nNenechám církev bez ochrany! Sám se ujímám kardinálské hodnosti."
 pam_clergy_events.0041.appoint_tt: "[cardinal_candidate.GetShortUIName|U] si přisvojuje titul [Concept('cardinal','kardinála')|E]"
 pam_clergy_events.0041.a: "Na takovou opovážlivost nezapomenu."
 pam_clergy_events.0042.opening: "$pam_clergy_events.0041.opening$"
 pam_clergy_events.0042.desc: "Křesla kardinálského kolegia zůstávala prázdná a církev nemůže čekat na obřadnosti. Několik našich nejzbožnějších služebníků proto společně přijalo červený klobouk a kolegium je opět úplné.\n\nDoufáme, že nám naši unáhlenost odpustíš."
 pam_clergy_events.0042.a: "Úplné kolegium mi poslouží lépe než prázdné."
 pam_clergy_events.0051.t: "Otřes základů víry"
 pam_clergy_events.0051.desc: "Mé sídlo [CZPrepV(county.GetNameNoTierNoTooltip)|l] [county.Custom('CZ_LandedNameNoTier_L')] se pode mnou otřásá. Lidé, jejichž duchovní službě jsem zasvětil svůj život, se nyní modlí jako [new_faith.GetAdherentNamePlural|l].\n\nMám přijmout jejich víru a udržet si svou moc? Mohl bych dál pečovat o obyvatele [title.Custom('CZ_LandedName_G')], ale dokážu skutečně pomáhat těm, kdo už o sobě neříkají, že jsou [old_faith.GetAdherentNamePlural|l]? Může vůbec vzejít něco dobrého z toho, že budeme všichni nuceni vyznávat [new_faith.GetNameNoTooltip]?!"
 pam_clergy_events.0051.a: "Udělám vše, co je třeba, abych mohl sloužit svým věřícím."
 pam_clergy_events.0051.a.keep_see_tt: "Nadále budeš ovládat [title.Custom('CZ_LandedName_A')]"
 pam_clergy_events.0051.b: "Mohu sloužit jen těm, kdo jsou stejně jako já [old_faith.GetAdherentNamePluralNoTooltip|l]."
 pam_clergy_events.0051.b.tt: "Všechny tvé [Concept('landed','zeměpanské')|E] [Concept('titles','tituly')|E] zaniknou"
 pam_clergy_events.0051.c: "Přijímám konec svého úřadu."
 pam_clergy_events.0051.c.tt: "[SelectLocalization(HasDlcFeature('roads_to_power'),'pam_clergy_events.0051.c.tt_ep3','pam_clergy_events.0051.c.tt_no_ep3')]"
 pam_clergy_events.0051.c.tt_ep3: "#mixed_value #BER Založíš [Concept('camp','tábor')|E] [Concept('adventurer','dobrodruha')|E]#!#!"
 pam_clergy_events.0051.c.tt_no_ep3: "#negative_value #BER Čeká tě [Concept('game_over','konec hry')|E]#!#!"
 pam_clergy_events.0052.t: "Zánik [title.Custom('CZ_LandedNameNoTooltip_G')]"
 pam_clergy_events.0052.desc: "Ať k tomu došlo jakkoli, [title.GetDefinitiveName|l] už nemůže právoplatně zůstat pod mou duchovní správou. Co mi církev kdysi svěřila do rukou, nyní z nich odchází."
 pam_clergy_events.0052.a: "Budiž tedy."
 pam_clergy_events.0060.t.pope: "Dynastie [new_prelate.GetDynasty.GetNameNoTooltip] na stolci svatého Petra"
 pam_clergy_events.0060.t.head_of_faith: "[new_prelate.GetFaith.ReligiousHeadName|U] z dynastie [new_prelate.GetDynasty.GetNameNoTooltip]"
 pam_clergy_events.0060.t.antipope: "Dynastie [new_prelate.GetDynasty.GetNameNoTooltip] si nárokuje titul [new_prelate.GetFaith.ReligiousHeadTitleName]"
 pam_clergy_events.0060.t.archbishop: "Dynastie [new_prelate.GetDynasty.GetNameNoTooltip] přebírá pastýřskou berlu"
 pam_clergy_events.0060.desc.intro: "Naše dynastie dlouho usilovala o to, aby mohla vést křesťanstvo. Nyní [new_prelate.GetFaith.HighGodName] uznal za vhodné, aby naše dynastie [new_prelate.GetDynasty.GetName] dosáhla nových výšin.\n\n"
 pam_clergy_events.0060.desc.pope: "[Select_CString(new_prelate.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] [Select_CString(new_prelate.IsFemale,'usedla','usedl')] na stolec svatého Petra jako [new_prelate.GetFaith.HighGodNamePossessive] [Select_CString(new_prelate.IsFemale,'zástupkyně','zástupce')] na zemi."
 pam_clergy_events.0060.desc.head_of_faith: "[prelate_title.GetDefinitiveName|U] nyní spravuje [Select_CString(new_prelate.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName]."
 pam_clergy_events.0060.desc.hof_outro: "Králové a císaři jsou pouhými dětmi ve stínu vůle [Select_CString(new_prelate.IsFemale,'svaté matky','svatého otce')]. [new_prelate.GetFaith.BishopMalePlural|U] nyní tvoří celé vojsko ve službách naší dynastie [new_prelate.GetDynasty.GetNameNoTooltip]."
 pam_clergy_events.0060.desc.antipope: "[Select_CString(new_prelate.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] [Select_CString(new_prelate.IsFemale,'byla prohlášena','byl prohlášen')] novou hlavou víry. Tento úřad nese titul [new_prelate.GetFaith.ReligiousHeadName], ačkoli jej stále zastává někdo jiný. Každý [new_prelate.GetFaith.GetAdherentName|l] se teď musí rozhodnout, koho [new_prelate.GetFaith.HighGodName] skutečně ustanovil svým zástupcem. Dokud se tento spor nevyřeší, jsou všechny naše duše v nebezpečí."
 pam_clergy_events.0060.desc.archbishop: "[prelate_title.GetDefinitiveName|U] nyní spravuje [Select_CString(new_prelate.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName]. Desátky, opatství i svěcení, k němuž přistupuje každý [new_prelate.GetFaith.BishopNeuter|l] pod [Select_CString(new_prelate.IsFemale,'její','jeho')] pravomocí, nyní spadají do rukou dynastie [new_prelate.GetDynasty.GetNameNoTooltip]."
 pam_clergy_events.0060.desc.different_faith: "\n\n[Select_CString(new_prelate.IsFemale,'Její','Jeho')] vírou je [new_prelate.GetFaith.GetNameNoTooltip], nikoli [ROOT.Char.GetFaith.GetNameNoTooltip], ale stále jsme jedna rodina."
 pam_clergy_events.0060.a: "Požehnání pro církev i naši dynastii [new_prelate.GetDynasty.GetNameNoTooltip]."
 pam_clergy_events.0060.a.antipope: "Tento spor není mým dědictvím."
 pam_clergy_events.0060.b: "Zajímá mě, co obnáší [prelate_title.GetDefinitiveNameNoTooltip]."
 pam_clergy_events.0060.b.antipope: "Jen já mohu tuto krizi vyřešit."
 pam_clergy_events.0060.b.tt: "@warning_icon! Opustíš svou současnou postavu a později se k jejímu hraní už nebudeš moci vrátit.\n#TUT Až [new_prelate.GetShortUINameNoTooltip] zemře, budeš pokračovat za svého [Concept('player_heir','hráčského dědice')|E], který tento [Concept('ecclesiastical','církevní')|E] úřad získá [Concept('appointment','jmenováním')|E] nebo volbou, nikoli [Concept('dynasty','dynastickým')|E] nástupnictvím.#!"
 pam_clergy_events.0060.b.faith_tt: "[new_prelate.GetTitledFirstName|U] nevyznává tvou víru. Po převzetí této postavy budeš [new_prelate.GetFaith.GetAdherentName|l]."
 pam_clergy_events.0060.b.antipope_tt: "[new_prelate.GetTitledFirstName|U] zastává úřad díky vzdoru, nikoli volbě. Každý, kdo tento nárok odmítá, bude usilovat o sesazení."
