l_polish:
 pam_clergy_events.0001.t: "Quo Nomine Vis Vocari?" # todo: NEW TRANSLATION
 pam_clergy_events.0001.desc: "Můj [chaplain.GetCouncilTitle|l] [chaplain.GetFirstName] se obrací k dalšímu prázdnému řádku v seznamu nástupců svatého Petra, živoucím svědectví [GetTenetType('tenet_apostolic_succession').GetName( GetPlayer.GetRite )].\n\n#emp \"Jméno, které si zvolíte, vás přežije o tisíc generací.\"#! \n\n[chaplain.GetHerHis|U] brk označuje místo, kam má být nanesen inkoust.\n\n#emp \"Quo nomine vis vocari?\"#!" # todo: NEW TRANSLATION
 pam_clergy_events.0001.a: "Ať je známo navěky." # todo: NEW TRANSLATION
 pam_clergy_events.0003.t: "Změna věroučného principu" # todo: NEW TRANSLATION
 pam_clergy_events.0003.desc: "Základní věroučný princip [pam_recast_rite.GetNameNoTooltip] se za vlády [pam_recast_pope.GetTitledFirstName] změnil: [tenet_to_remove.GetBaseName] ustupuje principu [tenet_to_add.GetBaseName]." # todo: NEW TRANSLATION
 pam_clergy_events.0010.t: "Vůle [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))|U]" # todo: NEW TRANSLATION
 pam_clergy_events.0010.desc.intro: "Jako [cardinalate.GetHolder.GetTitleAsNameNoTooltip] jsem prodlouženou rukou vůle Svatého [actor.Custom('GetMotherFatherPossessive')|U].\n\n" # todo: NEW TRANSLATION
 pam_clergy_events.0010.desc.puppet.intro: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))], jehož si ctím nade vše, vede mou ruku při plnění povinností [cardinalate.GetHolder.GetTitleAsNameNoTooltip].\n\n" # todo: NEW TRANSLATION
 pam_clergy_events.0010.desc: "Ve své nekonečné moudrosti [actor.GetHerHis] [actor.GetTitledFirstName] usoudil, že je nezbytné, abych usiloval" # todo: NEW TRANSLATION
 pam_clergy_events.0010.desc.develop: "rozvoji veřejných prací pro blaho všech [recipient.GetFaith.GetAdherentNamePlural] v oblasti [archdiocese.GetName]." # todo: NEW TRANSLATION
 pam_clergy_events.0010.desc.convert_faith: "misi, jejímž cílem je podpořit obracení [ROOT.Char.Custom('GetUnbelieverNamePlural')] v oblasti [archdiocese.GetName] a jejím okolí na naši víru." # todo: NEW TRANSLATION
 pam_clergy_events.0010.desc.increase_control: "misi, jejímž cílem je uklidnit obyvatelstvo v oblasti [archdiocese.GetName]." # todo: NEW TRANSLATION
 pam_clergy_events.0010.desc.cultural_fascination: "misi, jejímž cílem je urychlit výzkum nových technologií pro [actor.GetHerHis] soukmenovce, [actor.GetCulture.GetCollectiveNoun]." # todo: NEW TRANSLATION
 pam_clergy_events.0010.desc.epidemic_resistance: "shromažďování církevních zdrojů na pomoc při zmírňování moru v oblasti [archdiocese.GetName]." # todo: NEW TRANSLATION
 pam_clergy_events.0010.desc.improve_legitimacy: "misi, jejímž cílem je posílit legitimitu [recipient.GetFaith.GetAdjective] panovníků v oblasti [archdiocese.GetName]." # todo: NEW TRANSLATION
 pam_clergy_events.0010.desc.undermine_legitimacy: "misi, jejímž cílem je oslabit legitimitu [recipient.GetFaith.GetAdjective] panovníků v oblasti [archdiocese.GetName]." # todo: NEW TRANSLATION
 pam_clergy_events.0010.a: "\"Zařídím to, [actor.Custom('FormOfAddressForLiege')]!\"" # todo: NEW TRANSLATION
 pam_clergy_events.0010.b: "Desátky by se daly využít lépe..." # todo: NEW TRANSLATION
 pam_clergy_events.0030.t: "Habemus Papam" # todo: NEW TRANSLATION
 pam_clergy_events.0030.t.female: "Habemus Mamam" # todo: NEW TRANSLATION
 pam_clergy_events.0030.desc: "Bílý kouř oznamuje nového [new_pope.GetTitledFirstName] v centru [new_pope.GetCurrentLocation.GetName]:\n\n\"Kéž se za nás před Pánem přimlouvají svatí apoštolové Petr a Pavel, v jejichž moci a autoritě důvěřujeme. A kéž na vás sestoupí požehnání všemohoucího Boha, Otce i Syna i Ducha svatého, a zůstane s vámi navěky.\"\n\n\"Amen.\"" # todo: NEW TRANSLATION
 pam_clergy_events.0030.a: "Sláva trůnu svatého Petra." # todo: NEW TRANSLATION
 pam_clergy_events.0030.b: "Zdá se, že povstal falešný prorok." # todo: NEW TRANSLATION
 pam_clergy_events.0030.b.tt: "[decision|E] [GetDecisionWithKey('declare_antipope_decision').GetName] je na #V 15 let#! levnější" # todo: NEW TRANSLATION
 pam_clergy_events.0030.aa: "Koho zajímají záležitosti církve?" # todo: NEW TRANSLATION
 pam_clergy_events.0030.aa.tt: "Budoucí události Habemus Papam se budou zobrazovat pouze jako zprávy" # todo: NEW TRANSLATION
 pam_clergy_events.0030.feed: "[new_pope.GetTitledFirstName] byl zvolen [head_of_faith|E]." # todo: NEW TRANSLATION
 pam_clergy_events.0040.opening: "Zbožnému [head_of_faith.Custom2('AppropriateGreeting', ROOT.Char)]," # todo: NEW TRANSLATION
 pam_clergy_events.0040.desc: "Svaté kolegium prořídlo, a proto jsem se rozhodl povýšit vás do kardinálského stavu. Kéž vaše zbožnost a moudrost posílí církev v této chvíli nouze." # todo: NEW TRANSLATION
 pam_clergy_events.0040.appoint_tt: "Jste jmenováni [cardinal|E]" # todo: NEW TRANSLATION
 pam_clergy_events.0040.a: "Přijímám toto svaté břímě." # todo: NEW TRANSLATION
 pam_clergy_events.0041.opening: "Svatému stolci," # todo: NEW TRANSLATION
 pam_clergy_events.0041.desc: "Kardinálské kolegium není úplné a dosud jste neobsadili místa, která zůstala po našich nejzbožnějších [ROOT.Char.GetWomenMen] neobsazená.\n\nNenechám církev bez ochrany! Beru na sebe červený klobouk." # todo: NEW TRANSLATION
 pam_clergy_events.0041.appoint_tt: "[cardinal_candidate.GetShortUIName|U] se prohlašuje [cardinal_candidate.GetHerselfHimself] za [cardinal|E]" # todo: NEW TRANSLATION
 pam_clergy_events.0041.a: "Tuto opovážlivost nezapomenu." # todo: NEW TRANSLATION
 pam_clergy_events.0042.opening: "$pam_clergy_events.0041.opening$" # todo: NEW TRANSLATION
 pam_clergy_events.0042.desc: "Místa v kolegiu zela prázdnotou a církev nemůže čekat na obřady. Několik našich nejzbožnějších členů společně přijalo červený klobouk a kolegium je opět úplné.\n\nVěříme, že nám naši spěšnost odpustíte." # todo: NEW TRANSLATION
 pam_clergy_events.0042.a: "Plné kolegium mi slouží lépe než prázdné." # todo: NEW TRANSLATION
 pam_clergy_events.0051.t: "Otřes ve víře" # todo: NEW TRANSLATION
 pam_clergy_events.0051.desc: "Mé sídlo v [county.GetNameNoTier|U] se pode mnou otřásá. Duše, jimž jsem zasvětil život, aby jim sloužil, se nyní modlí jako [new_faith.GetAdherentNamePlural].\n\nMám konvertovat a udržet si moc? Mohl bych pečovat o lid [title.GetName], ale mohu vůbec smysluplně pomáhat těm, kteří už nejsou [old_faith.GetAdherentNamePlural]? Může z toho, že budeme všichni nuceni vyznávat [new_faith.GetNameNoTooltip], vzejít něco dobrého?!" # todo: NEW TRANSLATION
 pam_clergy_events.0051.a: "Učiním cokoli, abych sloužil svému stádu." # todo: NEW TRANSLATION
 pam_clergy_events.0051.a.keep_see_tt: "Udržíte si vládu nad [title.GetName]" # todo: NEW TRANSLATION
 pam_clergy_events.0051.b: "Sloužit mohu pouze souvěrcům, kteří vyznávají [old_faith.GetAdherentNamePluralNoTooltip]." # todo: NEW TRANSLATION
 pam_clergy_events.0051.b.tt: "Všechny vaše [landed|E] [titles|E] budou zničeny" # todo: NEW TRANSLATION
 pam_clergy_events.0051.c: "Přijímám konec svého úřadu." # todo: NEW TRANSLATION
 pam_clergy_events.0051.c.tt: "[SelectLocalization( HasDlcFeature( 'roads_to_power' ), 'pam_clergy_events.0051.c.tt_ep3', 'pam_clergy_events.0051.c.tt_no_ep3' )]" # todo: NEW TRANSLATION
 pam_clergy_events.0051.c.tt_ep3: "#mixed_value #BER Založíte [adventurer|E] [camp|E]#!#!" # todo: NEW TRANSLATION
 pam_clergy_events.0051.c.tt_no_ep3: "#negative_value #BER Nastane [game_over|E]#!#!" # todo: NEW TRANSLATION
 pam_clergy_events.0052.t: "Konec [title.GetNameNoTooltip]" # todo: NEW TRANSLATION
 pam_clergy_events.0052.desc: "Ať se to stalo jakkoli, už nemohu právoplatně spravovat [title.GetDefinitiveName]. To, co mi církev kdysi svěřila, jí nyní vracím." # todo: NEW TRANSLATION
 pam_clergy_events.0052.a: "Budiž." # todo: NEW TRANSLATION
 pam_clergy_events.0060.t.pope: "[new_prelate.GetDynasty.GetNameNoTooltip] na trůně svatého Petra" # todo: NEW TRANSLATION
 pam_clergy_events.0060.t.head_of_faith: "[new_prelate.GetDynasty.GetNameNoTooltip] – [new_prelate.GetFaith.ReligiousHeadName|U]" # todo: NEW TRANSLATION
 pam_clergy_events.0060.t.antipope: "[new_prelate.GetDynasty.GetNameNoTooltip] si činí nárok na titul [new_prelate.GetFaith.ReligiousHeadTitleName|U]" # todo: NEW TRANSLATION
 pam_clergy_events.0060.t.archbishop: "[new_prelate.GetDynasty.GetNameNoTooltip] se ujímá berly" # todo: NEW TRANSLATION
 pam_clergy_events.0060.desc.intro: "Náš rod se dlouho snažil vést křesťanský svět. Nyní [new_prelate.GetFaith.HighGodName|U] uznal za vhodné povýšit rod [new_prelate.GetDynasty.GetName] na novou úroveň.\n\n" # todo: NEW TRANSLATION
 pam_clergy_events.0060.desc.pope: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] byl dosazen na trůn svatého Petra jako zástupce [new_prelate.GetFaith.HighGodNamePossessive] na zemi." # todo: NEW TRANSLATION
 pam_clergy_events.0060.desc.head_of_faith: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] zastává úřad [prelate_title.GetDefinitiveName]." # todo: NEW TRANSLATION
 pam_clergy_events.0060.desc.hof_outro: "Králové a císaři jsou jen dětmi ve stínu vůle Svatého [new_prelate.Custom('GetMotherFatherPossessive')|U]. Armádě [new_prelate.GetFaith.BishopMalePlural] nyní velí člen rodu [new_prelate.GetDynasty.GetNameNoTooltip]." # todo: NEW TRANSLATION
 pam_clergy_events.0060.desc.antipope: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] byl prohlášen [new_prelate.GetFaith.ReligiousHeadName|U], přestože na stolci stále sedí jiný. Každý [new_prelate.GetFaith.GetAdherentName] si nyní musí zvolit, kdo zastupuje [new_prelate.GetFaith.HighGodName|U]. Dokud se spor nevyřeší, jsou v ohrožení duše nás všech." # todo: NEW TRANSLATION
 pam_clergy_events.0060.desc.archbishop: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] byl uveden do úřadu [prelate_title.GetDefinitiveName]. Desátky, opatství i svěcení všech [new_prelate.GetFaith.BishopNeuter], kteří podléhají [new_prelate.GetHerHim], nyní řídí člen rodu [new_prelate.GetDynasty.GetNameNoTooltip]." # todo: NEW TRANSLATION
 pam_clergy_events.0060.desc.different_faith: "\n\n[new_prelate.GetHerHis|U] víra je [new_prelate.GetFaith.GetNameNoTooltip], nikoli [ROOT.Char.GetFaith.GetNameNoTooltip], ale přesto jsme rodina." # todo: NEW TRANSLATION
 pam_clergy_events.0060.a: "Požehnání pro církev i rod [new_prelate.GetDynasty.GetNameNoTooltip]." # todo: NEW TRANSLATION
 pam_clergy_events.0060.a.antipope: "Tento spor není můj, abych jej zdědil." # todo: NEW TRANSLATION
 pam_clergy_events.0060.b: "Rád bych se blíže podíval na [prelate_title.GetDefinitiveNameNoTooltip]." # todo: NEW TRANSLATION
 pam_clergy_events.0060.b.antipope: "Tuto krizi mohu vyřešit jen já." # todo: NEW TRANSLATION
 pam_clergy_events.0060.b.tt: "@warning_icon! Opustíte svou současnou postavu a později za ni již nebudete moci hrát.\n\n#TUT Až [new_prelate.GetShortUINameNoTooltip] zemře, budete hrát za svého [player_heir|E], který tento [ecclesiastical|E] úřad zdědí na základě [appointment|E] či volby, nikoli nástupnictvím v rámci [dynasty|E].#!" # todo: NEW TRANSLATION
 pam_clergy_events.0060.b.faith_tt: "[new_prelate.GetTitledFirstName|U] nevyznává vaši víru. Pokračovali byste jako [new_prelate.GetFaith.GetAdherentName]." # todo: NEW TRANSLATION
 pam_clergy_events.0060.b.antipope_tt: "[new_prelate.GetTitledFirstName|U] zastává úřad z trucu, nikoli na základě volby. Všichni, kdo tento nárok odmítají, si pro něj přijdou." # todo: NEW TRANSLATION
