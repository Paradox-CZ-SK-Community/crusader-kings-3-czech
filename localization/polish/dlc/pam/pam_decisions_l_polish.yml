 pam_bull_events.0001.t: "Bula roku [GetCurrentDate.GetYear]" # todo: NEW TRANSLATION
 pam_bull_events.0001.desc: ""Vyzývám vás všechny, abyste se postavili nevěřícím v [title.GetName], osvobodili zemi od jejich tyranie a vyrvali jim z rukou mnoho tisíc vašich zajatých bratrů."\n\n"Ať za vašich dnů vzroste důstojnost křesťanského jména a vaše udatnost, oslavovaná po celém světě, zůstane nedotčená a neochvějná."" # todo: NEW TRANSLATION
 pam_bull_events.0001.a: "#EMP In nomine Domini.#!" # todo: NEW TRANSLATION
 pam_bull_events.0001.a.flavor: "#EMP Ve jménu Páně.#!" # todo: NEW TRANSLATION
