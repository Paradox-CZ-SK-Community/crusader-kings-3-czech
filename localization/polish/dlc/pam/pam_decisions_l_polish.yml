 pam_bull_events.desc.intro: "Já, [ROOT.Char.GetTitledFirstNameNoTooltip], [Select_CString(ROOT.Char.IsFemale,'služebnice','služebník')] služebníků Božích, se obracím ke svým nejmilejším dětem v Kristu:\n\n"
 pam_bull_events.desc.outro: "\n\n#EMP Vydáno [CZPrepV(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)|l] [CZProvName(ROOT.Char.GetCurrentLocation,'L')] dne [GetCurrentDate.GetStringLong]#!"
 every_theocratic_vassal_tt: "Každý [Concept('vassal','vazal')|E] s [Concept('theocracy','teokratickou vládou')|E] nebo [Concept('ecclesiastical_government','církevní vládou')|E] ([THIS.ScriptValue('number_of_theocratic_vassals')|V0])"
 pam_bull_events.0001.t: "Bula z roku [GetCurrentDate.GetYear]"
 pam_bull_events.0001.desc: "„Vyzývám vás všechny, abyste se postavili nevěřícím, kteří ovládají [title.Custom('CZ_LandedName_A')], osvobodili tuto zemi od jejich tyranie a vyrvali z jejich rukou mnoho tisíc svých zotročených bratří.“\n\n„Nechť za vašich dnů vzroste vážnost křesťanského jména a nechť vaše udatnost, opěvovaná po celém světě, zůstane neochvějná a neposkvrněná.“"
 pam_bull_events.0001.a: "#EMP In nomine Domini.#!"
 pam_bull_events.0001.a.flavor: "#EMP Ve jménu Páně.#!"
 pam_bull_events.0002.t: "$pam_bull_events.0001.t$"
 pam_bull_events.0002.desc.tenet_permitted: "„Všichni, kdo jste přijali zásadu [tenet_scope.GetName(ROOT.GetCharacter.GetRite)], vězte, že je nyní povolena se souhlasem [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')].“"
 pam_bull_events.0002.desc.tenet_forbidden: "„Zásada [tenet_scope.GetName(ROOT.GetCharacter.GetRite)] již nemá v našem společenství místo. Kdo ji nadále vyznává, nechť ví, že tím poskvrňuje svatost církve a dopouští se smrtelného hříchu.“"
 pam_bull_events.0002.a: "$pam_bull_events.0001.a$"
