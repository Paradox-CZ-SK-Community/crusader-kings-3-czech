 pam_kingdom_of_heaven_decision_piety_highest_tt: "Nikdo jiný, kdo vyznává tvou [Concept('faith','víru')|E], nesmí mít vyšší [Concept('piety_level','úroveň oddanosti')|E] než ty"
 pam_kingdom_of_heaven_decision_emperor_hooks_tt: "Buď neexistuje žádný nezávislý [Concept('ruler','vládce')|E] tvé [Concept('faith','víry')|E] s titulem na úrovni [Concept('empire','říše')|E], nebo máš na každého takového vládce [Concept('hook','páku')|E]"
