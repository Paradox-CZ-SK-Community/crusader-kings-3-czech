l_polish:
 pam_invite_syncretic_exiles_decision: "Pozvat synkretické vyhnance"
 pam_invite_syncretic_exiles_decision_desc: "Vyhnané komunity náboženství, kterého si vážíme, putují světem a hledají bezpečný domov. Mohu je pozvat, aby se usadily v mém panství a podělily se s námi o své tradice."
 pam_invite_syncretic_exiles_decision_tooltip: "Pozvi vyhnance z náboženské rodiny uznávané tvým osobním synkretismem. Zvýší se [Concept('development','rozvoj')|E], ale změní se místní [Concept('faith','víra')|E] nebo [Concept('rite','ritus')|E].\n\nVyžaduje velké množství [Concept('piety','zbožnosti')|E]."
 pam_invite_syncretic_exiles_decision_confirm: "Pozvat vyhnance"
 pam_invite_syncretic_exiles_decision_effect: "Osloví tě skupina vyhnanců, kteří požádají o svolení usadit se ve tvých [Concept('counties','hrabstvích')|E]. Tím se zvýší [Concept('development','rozvoj')|E], ale změní se místní [Concept('faith','víra')|E] nebo [Concept('rite','ritus')|E]."
 pam_invite_syncretic_exiles_no_pool: "Momentálně nejsou k dispozici žádní vyhnanci odpovídajícího náboženství, které by bylo možné pozvat"
 SELECT_TENET: "Vybrat zásadu"
 REPLACE_TENET: "Nahradit zásadu"
 SELECT_HOLY_SITE: "Vybrat svaté místo"
 puppet_cost_desc: "[Character.GetName|U],"
 pam_decision_confession_name: "Přistoupit ke zpovědi"
 pam_decision_confession_name_low: "Vyznat své hříchy"
 pam_decision_confession_desc: "Když si [Select_CString(ROOT.Char.IsFemale,'žena','muž')] uvědomí tíhu viny, kterou nese, musí se ze svých hříchů vyzpovídat."
 pam_decision_confession_tooltip: "Vyznej své hříchy"
 pam_decision_confession_tooltip_sp_effect: "Získáš určité množství [Concept('spiritual_fulfillment','duchovního naplnění')|E]"
 pam_decision_confession_tooltip_stress_effect: "Ztratíš určité množství [Concept('stress','stresu')|E]"
 pam_decision_confession_confirm: "Ať přijde [ROOT.Char.GetFaith.PriestNeuter|l]"
 sp_confession_decision_tooltip: "Tvé [Concept('spiritual_fulfillment','duchovní naplnění')|E] dosahuje alespoň #V [EmptyScope.ScriptValue('spiritual_fulfillment_1')|0]#!"
 pam_decision_confession_sp_court_chaplain: "Zaměstnáváš [Concept('court_chaplain','dvorního kaplana')|E]"
 pam_decision_events.0001.t: "Zpověď"
 pam_decision_events.0001.desc.intro: "[chaplain.GetTitledFirstName|U] trpělivě čeká v prázdné kapli.\n\n"
 pam_decision_events.0001.desc.bad: "[Select_CString(chaplain.IsFemale,'Její','Jeho')] přísný pohled připomíná ten, který očekávám od samotného Otce."
 pam_decision_events.0001.desc.good: "I když na mých bedrech neleží příliš těžké břemeno, stále je možné je alespoň trochu odlehčit."
 pam_decision_events.0001.desc.neutral: "Jako zbloudilá ovce přistupuji k [chaplain.Custom('CZ_TitledFirstName_D')] a pochybuji, zda je mé srdce skutečně dobré."
 pam_decision_events.0001.desc.sin.preamble: "\n\nVinu, kterou ve mně probouzejí vlastní hříchy, znám až příliš dobře."
 pam_decision_events.0001.desc.sin.lustful: "[Select_CString(ROOT.Char.IsFemale,'Dovolila','Dovolil')] jsem chtíči ovládnout svou vůli."
 pam_decision_events.0001.desc.sin.chaste: "Má cudnost se stala chladným útočištěm před povinnostmi."
 pam_decision_events.0001.desc.sin.gluttonous: "[Select_CString(ROOT.Char.IsFemale,'Dopřávala','Dopřával')] jsem svému tělu více, než je zdrávo, a neznala míru."
 pam_decision_events.0001.desc.sin.temperate: "Má střídmost se zvrhla v popírání vlastních potřeb."
 pam_decision_events.0001.desc.sin.greedy: "[Select_CString(ROOT.Char.IsFemale,'Lpěla','Lpěl')] jsem na zlatě, i když bylo třeba rozdávat."
 pam_decision_events.0001.desc.sin.generous: "Má štědrost překročila meze rozumu a zanechala mě bez prostředků."
 pam_decision_events.0001.desc.sin.lazy: "Lenost mě odváděla od modliteb i povinností."
 pam_decision_events.0001.desc.sin.diligent: "Má horlivost v práci vytlačila ze srdce milosrdenství."
 pam_decision_events.0001.desc.sin.wrathful: "Hněv mě přivedl ke hříchu."
 pam_decision_events.0001.desc.sin.calm: "Můj klid byl jen lhostejností převlečenou za ctnost."
 pam_decision_events.0001.desc.sin.patient: "Má trpělivost se zvrhla ve zbabělé otálení."
 pam_decision_events.0001.desc.sin.impatient: "Netrpělivost mě vedla k tvrdosti a ukvapeným činům."
 pam_decision_events.0001.desc.sin.arrogant: "Mé srdce nadmula pýcha."
 pam_decision_events.0001.desc.sin.humble: "Falešná pokora mě odváděla od pravdy."
 pam_decision_events.0001.desc.sin.deceitful: "Namísto upřímnosti jsem [Select_CString(ROOT.Char.IsFemale,'volila','volil')] lži a zamlčování pravdy."
 pam_decision_events.0001.desc.sin.honest: "Má neomalená upřímnost ranila tam, kde byla třeba laskavost."
 pam_decision_events.0001.desc.sin.craven: "Strach mě přiměl opustit to, co bylo správné."
 pam_decision_events.0001.desc.sin.brave: "Má odvaha překročila meze obezřetnosti a změnila se v lehkomyslnost."
 pam_decision_events.0001.desc.sin.shy: "Ostych mě odradil od dobrých skutků, které bylo mou povinností vykonat."
 pam_decision_events.0001.desc.sin.gregarious: "Má záliba ve společnosti druhých přehlušila hlas svědomí."
 pam_decision_events.0001.desc.sin.ambitious: "Ctižádost přehlušila mé svědomí."
 pam_decision_events.0001.desc.sin.content: "Spokojenost ve mně otupila touhu po spravedlivém životě."
 pam_decision_events.0001.desc.sin.arbitrary: "[Select_CString(ROOT.Char.IsFemale,'Vládla','Vládl')] jsem podle vlastních rozmarů namísto spravedlnosti."
 pam_decision_events.0001.desc.sin.just: "Má spravedlnost byla nemilosrdná a pyšná."
 pam_decision_events.0001.desc.sin.cynical: "Cynismus nahlodal mou víru."
 pam_decision_events.0001.desc.sin.zealous: "Má náboženská horlivost planula silněji než láska k bližním."
 pam_decision_events.0001.desc.sin.paranoid: "Podezíravost otrávila mé vztahy s druhými."
 pam_decision_events.0001.desc.sin.trusting: "Přílišná důvěřivost mě oslepila vůči zlu."
 pam_decision_events.0001.desc.sin.compassionate: "Soucit mě přiměl omlouvat to, co zasloužilo odsouzení."
 pam_decision_events.0001.desc.sin.callous: "[Select_CString(ROOT.Char.IsFemale,'Zatvrdila','Zatvrdil')] jsem své srdce vůči utrpení druhých."
 pam_decision_events.0001.desc.sin.stubborn: "Tvrdohlavost mě učinila hluchým vůči napomenutí."
 pam_decision_events.0001.desc.sin.fickle: "Má nestálost učinila mé slovo nespolehlivým."
 pam_decision_events.0001.desc.sin.eccentric: "Mé výstřední chování pohoršovalo věřící."
 pam_decision_events.0001.desc.sin.vengeful: "Touha po pomstě mě zcela pohltila."
 pam_decision_events.0001.desc.sin.forgiving: "Odpouštění vážných provinění mi šlo až příliš snadno."
 pam_decision_events.0001.desc.sin.sadistic: "[Select_CString(ROOT.Char.IsFemale,'Nacházela','Nacházel')] jsem potěšení v krutosti."
 pam_decision_events.0001.desc.outro: "\n\n„[Glossary('$pam_john_20_22_english|q$','JOHN_20_22_GLOSS')]“"
 pam_decision_events.0001.a: "Odpusť mi, [Select_CString(chaplain.IsFemale,'matko','otče')], neboť jsem [Select_CString(ROOT.Char.IsFemale,'zhřešila','zhřešil')]."
 pam_john_20_22_english: "Přijměte Ducha svatého. Komu odpustíte hříchy, tomu jsou odpuštěny; komu je zadržíte, tomu jsou zadrženy."
 JOHN_20_22_GLOSS: "#weak Jan 20,22–23, NRSVUE#!"
 pam_decision_act_of_devotion: "Uspořádat veřejný projev zbožnosti"
 pam_decision_act_of_devotion_desc: "Cítím tak hluboké duchovní pouto, že je musím projevit navenek! [ROOT.Char.GetFaith.HighGodName|U] přece zná hloubku mé víry!\n\nAť se [ROOT.Char.GetFaith.PriestNeuterPlural|l] shromáždí, ať se slouží velkolepá mše a ať dorazí všichni z mého panství. Ať každý vidí, jak [Select_CString(ROOT.Char.IsFemale,'oddaná','oddaný')] je jejich [Select_CString(ROOT.Char.IsFemale,'panovnice','panovník')]!"
 pam_decision_act_of_devotion_desc_tooltip: "Vyměň [Concept('piety','zbožnost')|E] za [Concept('prestige','prestiž')|E]"
 pam_decision_act_of_devotion_tooltip_effect: "Budeš si moci vybrat mezi:\n$BULLET_WITH_TAB$ [prestige_i]#P [EmptyScope.ScriptValue('major_prestige_gain')|0]#! [Concept('prestige','prestiže')|E]\n$BULLET_WITH_TAB$ [prestige_i]#P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#! [Concept('prestige','prestiže')|E] a jednou [Concept('prestige_level','úrovní slávy')|E] navíc výměnou za jednu [Concept('piety_level','úroveň oddanosti')|E]"
 pam_decision_act_of_devotion_confirm: "Ať se rozezní zvony!"
 pam_decision_act_of_devotion_sp_tooltip: "Tvé [Concept('spiritual_fulfillment','duchovní naplnění')|E] dosahuje alespoň #V [EmptyScope.ScriptValue('spiritual_fulfillment_2')|0]#!"
 pam_decision_act_of_devotion_fame_tooltip: "Tvá [Concept('prestige_level','úroveň slávy')|E] musí být nižší než [GetModifier('prestige_level_3').GetNameWithTooltip|L]"
 pam_confession_penalty_modifier: "Závazek ze zpovědi"
 pam_confession_penalty_modifier_desc: "Tato postava musí na žádost svého zpovědníka vykonat určitý čin."
 pam_meddled_in_clerical_appointments_modifier: "Zasahování do jmenování duchovních"
 pam_meddled_in_clerical_appointments_modifier_desc: "Násilné nahrazení [Concept('holder','držitele')|E] [Concept('clerical_title','duchovního titulu')|E] tímto [Concept('ruler','vládcem')|E] pobouřilo [Concept('clergy','duchovenstvo')|E]."
 pam_kowtowed_to_pope_modifier: "Pokleknutí před církví"
 pam_kowtowed_to_pope_modifier_desc: "Tento [Concept('ruler','vládce')|E] poklekl před církví a zavázal se podpořit doktrínu #EMP [GetDoctrineType('doctrine_clerical_succession_spiritual_fixed_appointment').GetBaseName]#! na koncilu, který ukončí [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l]. Jakmile koncil tento spor vyřeší, modifikátor zmizí."
 pam_kowtow_to_pope_decision: "Pokleknout a přísahat, že [ROOT.Char.GetFaith.ReligiousHeadName] má mou podporu"
 pam_kowtow_to_pope_decision_desc: "Koruna a pastýřská berla vedou nelítostný spor o právo jmenovat držitele duchovních titulů. Namísto otevřeného vzdoru raději pokleknu a uznám, že [ROOT.Char.GetFaith.ReligiousHeadName] má v této otázce přednost. Až bude svolán velký koncil, který má spor rozhodnout, postavím se na stranu věřících."
 pam_kowtow_to_pope_decision_tooltip: "Zavaž se podpořit nárok církve na jmenování duchovních"
 pam_kowtow_to_pope_decision_confirm: "Pokleknout"
 pam_kowtow_to_pope_effect_tt: "Na koncilu, který ukončí [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l], podpoříš doktrínu #EMP [GetDoctrineType('doctrine_clerical_succession_spiritual_fixed_appointment').GetBaseName]#!"
 pam_kowtow_to_pope_not_already_pledged_tt: "Dosud ses nezavázal podpořit církev"
 pam_kowtow_to_pope_needs_head_of_faith_tt: "Tvá [Concept('faith','víra')|E] musí mít [Concept('head_of_faith','hlavu víry')|E]"
 pam_kowtow_to_pope_toast: "Skláníš hlavu a [ROOT.Char.GetFaith.ReligiousHeadName] má tvou podporu"
 pam_decision_events.0001.a.confession_random_outcome: "Tvůj [Concept('court_chaplain','dvorní kaplan')|E] tě může o něco požádat, nebo během zpovědi něco zaslechneš..."
 pam_decision_events.0001.a.piety: "Tvá zpověď působila upřímně"
 pam_decision_events.0001.a.hook: "[chaplain.GetShortUIName|U] [Select_CString(chaplain.IsFemale,'získala','získal')] nové informace"
 pam_decision_events.0001.a.opinion_malus: "[chaplain.GetShortUIName|U] neschvaluje tvé hříšné povahové rysy"
 pam_decision_events.0001.a.courtier_secret: "Zaslechneš, jak se [my_courtier.GetShortUIName] zpovídá"
 pam_decision_events.0001.a.random_confession: "Zaslechneš zpověď někoho jiného"
 pam_decision_events.0001.a.pilgrimage: "[chaplain.GetShortUIName|U] tě žádá, abys vykonal [Concept('pilgrimage','pouť')|E]"
 pam_decision_events.0001.a.high_almoner: "[chaplain.GetShortUIName|U] tě žádá, abys najal někoho, kdo bude působit jako [GetCourtPositionType('high_almoner_court_position').GetName()]"
 pam_decision_events.0001.a.no_war: "[chaplain.GetShortUIName|U] tě žádá, abys po dobu #V 5 let#! [Select_CString(ROOT.Char.IsFemale,'nevyhlašovala','nevyhlašoval')] žádné útočné války"
 pam_confession_penalty_var.no_war_toast: "Slíbil jsi, že nebudeš vyhlašovat žádné války"
 pam_decision_events.0001.a.conversion: "[chaplain.GetShortUIName|U] tě žádá, abys [target.Custom('CZ_ShortUIName_A')] [Select_CString(ROOT.Char.IsFemale,'obrátila','obrátil')] na svou víru"
 pam_decision_events.0001.a.conversion.toast: "Svůj slib máš splněný"
 pam_decision_events.0001.a.conversion.toast_puppeteer: "[puppet_or_actor.GetShortUIName|U] [Select_CString(puppet_or_actor.IsLocalPlayer,'jsi','')] svůj slib [Select_CString(puppet_or_actor.IsFemale,'dodržela','dodržel')]"
 pam_decision_events.0002.t: "Projev zbožnosti"
 pam_decision_events.0002.desc.intro: "[my_chaplain.GetTitledFirstName|U] stojí vedle mě u oltáře. Jemné sluneční paprsky dopadají na "
 pam_decision_events.0002.desc.uncrowned: "můj oděv a propůjčují mu vzhled posvátného pláště."
 pam_decision_events.0002.desc.crowned: "mou korunu, která v jejich světle září jako svatozář."
 pam_decision_events.0002.desc.mid: "\n\n„[ROOT.Char.Custom('RandomBibleQuote')]...“ [Select_CString(my_chaplain.IsFemale,'Její','Jeho')] kázání se vleče dál a dál, "
 pam_decision_events.0002.desc.bad: "zatímco se marně snažím udržet pozornost."
 pam_decision_events.0002.desc.good: "zatímco se zdá, že všichni přítomní upírají oči jen na mě."
 pam_decision_events.0002.desc.neutral: "zatímco mezi přítomnými pátrám po tvářích plných obdivu."
 pam_decision_events.0002.desc.outro: "\n\n„A v těchto neblahých časech nás povede [ROOT.Char.GetNameNoTooltip], [Select_CString(ROOT.Char.IsFemale,'moudrá a ctnostná','moudrý a ctnostný')].“"
 pam_decision_events.0002.a: "Musím se k davu obrátit osobně."
 pam_decision_events.0002.b: "Postačí prosté přikývnutí."
 pam_mentor_sp_decision: "Poskytnout duchovní vedení"
 pam_mentor_sp_decision_desc: "My, kdo kráčíme ve světle, jímž nás provází [ROOT.Char.GetFaith.HighGodName], máme povinnost vést ty, kdo bloudí v temnotách, i mladé lidi, které nezkušenost může svést na scestí v myšlenkách či činech."
 pam_mentor_sp_decision_desc_tooltip: "Pomoz svému dítěti zvýšit [Concept('spiritual_fulfillment','duchovní naplnění')|E]"
 pam_mentor_sp_decision_confirm: "Promluvit si a naslouchat"
 pam_mentor_sp_decision_sp_tooltip: "Tvé [Concept('spiritual_fulfillment','duchovní naplnění')|E] dosahuje alespoň #V [EmptyScope.ScriptValue('spiritual_fulfillment_3')|0]#!"
 pam_mentor_sp_decision_tooltip_effect: "Zvýšíš [Concept('spiritual_fulfillment','duchovní naplnění')|E] svého [Concept('primary_heir','hlavního dědice')|E] nebo [Concept('favorite_child','oblíbeného dítěte')|E]"
 pam_mentor_sp_decision_valid_child_tt: "Musíš mít [Concept('child','dítě')|E], které splňuje následující podmínky:\n$BULLET_WITH_TAB$Má stejnou [Concept('faith','víru')|E] jako ty\n$BULLET_WITH_TAB$Je mu alespoň #V 16#! let\n$BULLET_WITH_TAB$Je tvým [Concept('primary_heir','hlavním dědicem')|E] nebo [Concept('favorite_child','oblíbeným dítětem')|E]\n$BULLET_WITH_TAB$Jeho [Concept('spiritual_fulfillment','duchovní naplnění')|E] je nižší než #V 75#!\n$BULLET_WITH_TAB$Dosud neobdrželo duchovní vedení"
 pam_mentor_sp_decision_primary_heir_tt: "Tvůj [Concept('primary_heir','hlavní dědic')|E] musí splňovat následující podmínky:$pam_mentor_sp_decision_primary_requirements_tt$"
 pam_mentor_sp_decision_primary_heir_name: "Hlavní dědic"
 pam_mentor_sp_decision_primary_favorite_child_tt: "Tvé [Concept('favorite_child','oblíbené dítě')|E] musí splňovat následující podmínky:$pam_mentor_sp_decision_primary_requirements_tt$"
 pam_mentor_sp_decision_primary_favorite_child_name: "Oblíbené dítě"
 pam_mentor_sp_decision_primary_requirements_tt: "\n$BULLET_WITH_TAB$Má stejnou [Concept('faith','víru')|E] jako ty\n$BULLET_WITH_TAB$Je mu alespoň #V 16#! let\n$BULLET_WITH_TAB$Jeho [Concept('spiritual_fulfillment','duchovní naplnění')|E] je nižší než #V 75#!\n$BULLET_WITH_TAB$Dosud neobdrželo duchovní vedení"
 pam_decision_events.0003.t: "Nejdůležitější ponaučení"
 pam_decision_events.0003.desc.intro: "Padla noc a v hradní pevnosti zavládlo ticho. [Select_CString(target_child.IsFemale,'Má dcera','Můj syn')] sedí vedle mě v soukromé kapli.\n\nZadívám se na své dítě."
 pam_decision_events.0003.desc.bad: "Vpadlé tváře, nepřítomný pohled a oči, které se únavou téměř zavírají.\n\n„[Select_CString(ROOT.Char.IsFemale,'Matko','Otče')],“ ozve se netrpělivě, „proč jsi mě [Select_CString(ROOT.Char.IsFemale,'nechala','nechal')] zavolat?“"
 pam_decision_events.0003.desc.good: "Záře svící rozjasňuje [Select_CString(target_child.IsFemale,'její','jeho')] oči. [Select_CString(target_child.IsFemale,'Je to dobrá žena','Je to dobrý muž')].\n\n„[Select_CString(ROOT.Char.IsFemale,'Matko','Otče')],“ zazní otázka, „[Select_CString(target_child.IsFemale,'ublížila','ublížil')] jsem ti nějak?“"
 pam_decision_events.0003.desc.neutral: "[target_child.Custom('ComplimentAdjective')|U]. Už je dost [Select_CString(target_child.IsFemale,'dospělá','dospělý')].\n\n„[Select_CString(ROOT.Char.IsFemale,'Matko','Otče')],“ ozve se tichá otázka, „jak má člověk žít správně?“"
 pam_decision_events.0003.a: "[Select_CString(ROOT.Char.IsFemale,'Zkažená','Zkažený')] [ROOT.Char.GetTitleAsNameNoTooltip|l] brzy otráví i [Select_CString(target_child.IsFemale,'její','jeho')] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]."
 pam_decision_events.0003.b: "Prostě... buď [Select_CString(target_child.IsFemale,'dobrá','dobrý')]."
