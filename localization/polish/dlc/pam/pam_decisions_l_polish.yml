 pam_decision_events.0015.desc.intro: "oslavný text vytvořený mou budovou [GetDomicileBuilding('chancery_01').GetName]:\n\n„Ctnostné skutky jsou jako semena, která Pán zasadil, aby přinesla hojné plody zbožnosti. Všichni by měli znát [praise_worthy_priest.GetName], neboť [praise_worthy_priest.GetHerHis] vznešené" # todo: NEW TRANSLATION
 pam_decision_events.0015.desc.virtuoustrait: " a [my_virtuous_trait.GetName(praise_worthy_priest)]" # todo: NEW TRANSLATION
 pam_decision_events.0015.desc.mid: "ctnosti jsou vždy vedeny" # todo: NEW TRANSLATION
 pam_decision_events.0015.desc.virtuoustenet: "[my_virtuous_tenet.GetName( praise_worthy_priest.GetRite )]...\"" # todo: NEW TRANSLATION
 pam_decision_events.0015.desc.novirtuoustenet: "Bohem...\"" # todo: NEW TRANSLATION
 pam_decision_events.0015.desc.bad: "\n\nPřes všechna chvályhodná slova se mé srdce obává pekelného ohně." # todo: NEW TRANSLATION
 pam_decision_events.0015.desc.good: "\n\nJsem vskutku nástrojem Páně, ztělesněním jeho krásy na zemi." # todo: NEW TRANSLATION
 pam_decision_events.0015.desc.neutral: "\n\nPřes všechna chvályhodná slova se teprve po smrti dozvím, zda je má duše před Pánem čistá." # todo: NEW TRANSLATION
 pam_decision_events.0015.desc.outro: "\n\n"...vskutku, díky spravedlivosti [praise_worthy_priest.GetHerHis] činů je [praise_worthy_priest.GetWomanMan] tím pravým člověkem, který by jednoho dne mohl vést Církev!"" # todo: NEW TRANSLATION
 pam_decision_events.0015.b: "\"Už jsem vykonal/a mnoho zázraků.\"" # todo: NEW TRANSLATION
 pam_decision_events.0015.b.flavor: "Proč se spokojit s papežstvím, když můžete být svatořečeni?" # todo: NEW TRANSLATION
 pam_decision_events.0015.b.tt: "#V Zvýšit šanci na svatořečení#! po smrti\n#weak K svatořečení je zapotřebí [dynasty|E]#!" # todo: NEW TRANSLATION
