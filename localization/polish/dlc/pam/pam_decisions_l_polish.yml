 pam_decision_events.0017.desc: "Pro kamenný kříž jsem vybral vyvýšené místo s výhledem na [khachkar_location.GetNameNoTier].\n\nNechám mistry kameníky vytvořit něco skutečně úctyhodného na památku [khachkar_ancestor.GetTitledFirstNameNicknamed]. Kříž obklopený růžicemi a ornamenty, s nápisem, že [khachkar_ancestor.GetHerHis] [khachkar_ancestor.Custom2('RelationToMeShort', ROOT.Char)] uctil [khachkar_ancestor.GetHerHis] památku.\n\nAť se pod ním modlí místní poutníci a všichni spatří, že nám tato země právem náleží." # todo: NEW TRANSLATION
