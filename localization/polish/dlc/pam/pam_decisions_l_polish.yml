 pam_renounce_papal_candidacy_decision: "Odmítnout kandidaturu na [ROOT.Char.GetFaith.ReligiousHeadTitleName]" # todo: NEW TRANSLATION
 pam_renounce_papal_candidacy_decision_embrace: "Usilovat o [ROOT.Char.GetFaith.ReligiousHeadTitleName]" # todo: NEW TRANSLATION
 pam_renounce_papal_candidacy_decision_desc_renounce: "Někteří zasvětí celý život cestě na trůn [ROOT.Char.GetFaith.ReligiousHeadName] a já jsem viděl, co to s nimi dělá.\n\nDám [cardinal|E]ům vědět, že se při příští volbě [ROOT.Char.GetFaith.ReligiousHeadName] nebudu ucházet o místo. Moje práce je tady, v mém vlastním biskupství." # todo: NEW TRANSLATION
 pam_renounce_papal_candidacy_decision_desc_embrace: "Kdysi jsem dal najevo, že se nebudu ucházet o trůn [ROOT.Char.GetFaith.ReligiousHeadName]. Tehdy jsem byl mladší [ROOT.Char.GetWomanMan] a [ROOT.Char.GetFaith.GetName] spočívala v mírnějších rukou.\n\nAť se [cardinal|E]ové dozvědí, že jsem si to rozmyslel." # todo: NEW TRANSLATION
