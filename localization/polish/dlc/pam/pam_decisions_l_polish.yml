 pam_evangelize_personal_tenet_valid_targets_tt: "V [Concept('clerical_region','církevní oblasti')|E] svého [Concept('realm_capital','hlavního sídla panství')|E] musíš mít alespoň jednoho [Concept('subject','subjektu')|E] nebo [Concept('ruler','vládce')|E], který splňuje následující podmínky:\n$BULLET_WITH_TAB$Je [Concept('adult','dospělý')|E]\n$BULLET_WITH_TAB$Vyznává stejnou [Concept('faith','víru')|E] jako ty\n$BULLET_WITH_TAB$Má stejnou nebo nižší [Concept('title_tier','úroveň titulu')|E] než ty\n$BULLET_WITH_TAB$Vyznává jinou [Concept('personal_tenet','osobní zásadu')|E] než ty"
 can_pick_one_option_tt: "Můžeš si vybrat jednu z následujících možností:"
