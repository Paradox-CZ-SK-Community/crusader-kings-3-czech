 pam_decision_events.0021.t: "Živé Slovo" # todo: NEW TRANSLATION
 pam_decision_events.0021.desc: "V [ROOT.Char.Custom('GetFaithTemple')] už nezbývá místo k pokleknutí. Poutníci se tísní bok po boku s [ROOT.Char.GetFaith.PriestNeuterPlural], baroni s žebráky, a dav u dveří stále narůstá.\n\nMé skutky byly zaznamenány důkladněji, než by dokázal kterýkoli kronikář — každá ušlá cesta, každá bdělá noc, každá mince darovaná ve jménu [ROOT.Char.GetFaith.HighGodNamePossessive]. Jeden z [ROOT.Char.GetFaith.PriestNeuterPlural] mě vezme za ruku a přitiskne ji k oltáři [ROOT.Char.GetFaith.HighGodNamePossessive]: "Promluvte a my budeme naslouchat."\n\nTicho, které následuje, patří mně. To, čím je naplním, bude znít daleko za těmito zdmi." # todo: NEW TRANSLATION
 pam_decision_events.0021.a: "Ať je mé kázání milosrdné." # todo: NEW TRANSLATION
 pam_decision_events.0021.b: "Ponesu Slovo ohněm a mečem." # todo: NEW TRANSLATION
 pam_herald_shepherd_of_the_faithful_modifier: "Pastýř věřících" # todo: NEW TRANSLATION
 pam_herald_shepherd_of_the_faithful_modifier_desc: "Tato postava vyhlásila své svaté poslání slovy milosrdenství a věřící ji za to zbožňují." # todo: NEW TRANSLATION
 pam_herald_fire_and_sword_modifier: "Oheň a meč" # todo: NEW TRANSLATION
 pam_herald_fire_and_sword_modifier_desc: "Tato postava vyhlásila své svaté poslání jako výzvu do zbraně a bojovníci víry se houfně přidávají pod její prapor." # todo: NEW TRANSLATION
 pam_convert_to_theocracy_decision: "Přijmout teokratickou vládu" # todo: NEW TRANSLATION
 pam_convert_to_theocracy_decision_desc: "Současná hierarchie je zvrácením pravidel stanovených [ROOT.Char.GetFaith.GoodGodNames]. Byla mi svěřena jediná cesta, jak ji napravit — cesta, která bude zároveň chválit [ROOT.Char.GetFaith.CreatorHerHim|U] a plnit mé povinnosti vůči lidu. Toť slovo [ROOT.Char.GetFaith.GoodGodNames]." # todo: NEW TRANSLATION
 pam_convert_to_theocracy_decision_confirm: "Uchopit autoritu [ROOT.Char.GetFaith.HighGodNamePossessive|U]" # todo: NEW TRANSLATION
 pam_convert_to_theocracy_decision_tooltip: "Změníte svou [government|E] na [theocracy|E]" # todo: NEW TRANSLATION
 pam_convert_theocracy_to_feudal_decision: "Obnovit světskou vládu" # todo: NEW TRANSLATION
 pam_convert_theocracy_to_feudal_decision_desc: "Jakožto formální autorita [ROOT.Char.GetFaith.HighGodNamePossessive|U] zákona se [ROOT.Char.GetFaith.GetAdherentNamePlural] obracejí na mě s žádostí o duchovní vedení. Bohužel se na tento úkol necítím a přenechávám takové soudy svému [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]. \n\nMé schopnosti spočívají ve světských záležitostech a je jen správné, abych se ujal(a) světské koruny! Ať lidé vědí, že vládnu já, nikoli [ROOT.Char.GetFaith.PriestNeuterPlural] či dokonce [ROOT.Char.GetFaith.HighGodName]." # todo: NEW TRANSLATION
 pam_convert_theocracy_to_feudal_decision_tooltip: "Změníte svůj [realm|E] na [feudal|E] namísto [theocracy|E]" # todo: NEW TRANSLATION
 pam_convert_theocracy_to_feudal_decision_confirm: "Vraťte říši do rukou smrtelných [ROOT.Char.GetWomenMen|U]" # todo: NEW TRANSLATION
 religious_head_is_not_ecclesiastical: "[head_of_faith|E] není #bold #! [ecclesiastical_government|E]" # todo: NEW TRANSLATION
