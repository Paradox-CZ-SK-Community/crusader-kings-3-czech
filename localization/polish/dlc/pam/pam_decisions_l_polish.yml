 pam_promulgate_word_of_pious_deeds_decision: "Rozhlásit zprávy o zbožných skutcích" # todo: NEW TRANSLATION
 pam_promulgate_word_of_pious_deeds_decision_desc: "Moje kancelář sepsala chvalozpěv oslavující mé skutky podobné Kristovým. Ačkoli se nesluší vychvalovat vlastní ctnosti, moji blízcí chtějí rozšířit zprávu o mé zbožnosti mezi všechny [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip].\n\nKdyž se o tom všichni dozvědí, mohlo by se rozšířit, že právě já jsem [ROOT.Char.GetWomanMan] nejhodnější usednout na trůn svatého Petra... a možná i výš." # todo: NEW TRANSLATION
 pam_promulgate_word_of_pious_deeds_decision_desc_tooltip: "#V Zvýšit volební skóre#! pro [Select_CString(ROOT.Char.GetReligiousSuperior.IsValid, ROOT.Char.GetReligiousSuperior.GetPrimaryTitle.GetName, ROOT.Char.GetPrimaryTitle.GetName)]: #P +30#! nebo zvýšit šanci na [canonization|E]" # todo: NEW TRANSLATION
 pam_promulgate_word_of_pious_deeds_decision_tooltip_effect: "Vyberte si: \n\t$EFFECT_LIST_BULLET$Zaplatit [piety|E] a #V zvýšit volební skóre#! pro [praise_worthy_priest_superior_title.GetName] \n\t$EFFECT_LIST_BULLET$Zvýšit svou šanci na budoucí [canonization|E]" # todo: NEW TRANSLATION
 pam_promulgate_word_of_pious_deeds_decision_confirm: "Dovolím, aby mě chválili!" # todo: NEW TRANSLATION
