 grudge_pressured_me_sp_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer,'chováš','chová')] k [CHARACTER.Custom('CZ_ShortUIName_D')] křivdu kvůli nátlaku ohledně vlastního duchovního naplnění."
 pam_decision_events.0003.after_tt: "Může vyjít najevo něco o [target_child.Custom('CZ_FirstName_L')]..."
