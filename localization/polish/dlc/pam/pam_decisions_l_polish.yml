 pam_schism_leave_faith_headless_tt: "@alert_icon! #alert_trial [GetFaithByKey('christian_faith').GetName|U] zůstane bez [Concept('head_of_faith','hlavy víry')|E]#!"
 pam_prevent_great_schism_clerical_support_tt: "#V $VALUE|0$/7#! [Concept('characters','postav')|E] ze skupiny [GetSituation('the_christian_church').GetTopParticipantGroupByKey('christian_clerical_main_power_rulers').GetName] kromě tebe sdílí tvůj postoj ke schizmatu a splňuje alespoň jednu z následujících podmínek:\n$BULLET_WITH_TAB$Jsou ti [Concept('hooked','zavázány')|E]\n$BULLET_WITH_TAB$Jsou tvými [Concept('puppet','loutkami')|E]\n$BULLET_WITH_TAB$Pojí je s tebou [Concept('friend','přátelství')|E]\n$BULLET_WITH_TAB$Pojí je s tebou [Concept('lover','milostný vztah')|E]"
