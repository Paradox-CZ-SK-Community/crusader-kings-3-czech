 pam_decision_events.0008.desc.chaplain: ""Těší se [ROOT.Char.GetTitleAsNameNoTooltip|l] z ponižování služebníků [ROOT.Char.GetFaith.HighGodName]?" kárá mě [chaplain.GetTitledFirstName]. "Přináší vám nějaké potěšení svlékat [ROOT.Char.GetFaith.HighGodHerHis|U] dům donaha jako #EMP odpornou#! děvku?"" # todo: NEW TRANSLATION
