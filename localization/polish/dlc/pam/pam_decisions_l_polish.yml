 pam_develop_clerical_court_decision: "Vzdělávat duchovní dvůr" # todo: NEW TRANSLATION
 pam_develop_clerical_court_decision_desc_christian: "Nečinní duchovní jsou špatnými služebníky [ROOT.Char.GetFaith.HighGodName]. Svolám svou domácnost — vysvětím hodné, vzdělám vysvěcené a povolám nováčky ke svým branám." # todo: NEW TRANSLATION
 pam_develop_clerical_court_decision_desc: "Nečinní služebníci nedělají [ROOT.Char.GetFaith.HighGodName] čest. Svolám svou domácnost — povýším hodné do [clergy|E], vzdělám ty, kteří slouží, a povolám nováčky ke svým branám." # todo: NEW TRANSLATION
 pam_develop_clerical_court_decision_tooltip: "Vysvětit, vzdělávat nebo získat [clergy|E] pro svůj dvůr" # todo: NEW TRANSLATION
 pam_develop_clerical_court_decision_confirm: "Svolat domácnost" # todo: NEW TRANSLATION
 pam_develop_clerical_court_decision_tt: "Svoláte svou domácnost a zvolíte si #EMP jednu#! z následujících možností:\n$EFFECT_LIST_BULLET$ Až [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] laiků z řad [courtiers|E] vstoupí do [clergy|E]; za každého získáte dodatečnou [piety_i][piety|E]\n$EFFECT_LIST_BULLET$ Až [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] dvorských příslušníků [clergy|E] získá [learning_i][learning|E] a [trait|E] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] nebo [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] / zkušenosti [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ Až [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] nováčků z okolních zemí vstoupí do vašeho dvora a [clergy|E]\n\nAť už zvolíte kteroukoli cestu, získáte [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_piety_reward_value')|V0] [piety_i][piety|E]\n\n#weak Odměny se odvíjejí od vašeho [learning|E], [piety_level|E] a náboženských [traits|E]; občas se naskytne vzácná příležitost#!" # todo: NEW TRANSLATION
 pam_develop_clerical_court_decision_candidates_tt: "Máte [courtier|E] vhodného k vysvěcení či vzdělávání, nebo poblíž žije důstojný kandidát" # todo: NEW TRANSLATION
 pam_clerical_court_joins_clergy_tt: "Vstupuje do [clergy|E] víry [pam_clerical_patron.GetFaith.GetName]" # todo: NEW TRANSLATION
 pam_clerical_court_ordain_toast: "[pam_clerical_ordained.GetShortUIName] vstupuje do duchovenstva" # todo: NEW TRANSLATION
 pam_clerical_court_instruct_toast: "[pam_clerical_instructed.GetShortUIName] získává moudrost" # todo: NEW TRANSLATION
 pam_clerical_court_recruit_toast: "[pam_clerical_novice_current.GetShortUIName] vyslyšel povolání" # todo: NEW TRANSLATION
 pam_oblate_patron_reason: "Proslulý mecenáš nováčků" # todo: NEW TRANSLATION
 pam_oblate_patron_modifier: "Mecenáš nováčků" # todo: NEW TRANSLATION
 pam_oblate_patron_modifier_desc: "Tato postava je známá podporou těch, kteří zaslechli volání k duchovní službě. Skládání slibů je snazší a rodiče ochotněji posílají své děti do služby." # todo: NEW TRANSLATION
 pam_scriptorium_modifier: "Síň písařů" # todo: NEW TRANSLATION
 pam_scriptorium_modifier_desc: "Tato postava udržuje síň písařů, jejichž dílo přitahuje do hlavního města vzdělané myslitele." # todo: NEW TRANSLATION
 pam_decision_events.0032.t: "Péče o stádo" # todo: NEW TRANSLATION
 pam_decision_events.0032.desc.intro.christian: "Obracím se na duchovní a členy duchovenstva své domácnosti a zvažuji, kdo bude vysvěcen a komu se ještě nedostává vedení." # todo: NEW TRANSLATION
 pam_decision_events.0032.desc.intro: "Obracím se na ty, kteří na mém dvoře slouží víře [ROOT.Char.GetFaith.GetName]: kdo vstoupí do jejích služeb a komu se nedostává vedení?" # todo: NEW TRANSLATION
 pam_decision_events.0032.desc.pupil: "\n\nMůj žák, [pam_clerical_pupil.GetFirstName], stojí v modlitbě a dychtivě touží dokázat [pam_clerical_pupil.GetHerHis] hodnotu." # todo: NEW TRANSLATION
 pam_decision_events.0032.desc.no_pupil: "\n\nJen málokdo z nich vstoupil do služeb víry — a to chci napravit." # todo: NEW TRANSLATION
 pam_decision_events.0032.desc.novice: "\n\nZa hranicemi mé domácnosti prosí o místo ve službách víry nadějný cizinec jménem [pam_clerical_novice.GetFirstName]." # todo: NEW TRANSLATION
 pam_decision_events.0032.desc.outro.christian: "\n\nJak mám pečovat o stádo, které mi [ROOT.Char.GetFaith.HighGodName] svěřil?" # todo: NEW TRANSLATION
 pam_decision_events.0032.desc.outro: "\n\nJak mám povýšit ty, které mi [ROOT.Char.GetFaith.HighGodName] svěřil?" # todo: NEW TRANSLATION
 pam_decision_events.0032.prodigy: "Můj žák má božský dar!" # todo: NEW TRANSLATION
 pam_decision_events.0032.oblates: "Ať všichni vědí, že vítám ty, kteří zaslechli volání ke službě." # todo: NEW TRANSLATION
 pam_decision_events.0032.piety: "Jejich zbožnost posiluje i mou vlastní." # todo: NEW TRANSLATION
 pam_decision_events.0032.novice: "Nadějná duše — přijměte [pam_clerical_novice.GetHerHim] ihned." # todo: NEW TRANSLATION
 pam_decision_events.0032.miracle: "Říká se, že můj žák činí zázraky." # todo: NEW TRANSLATION
 pam_decision_events.0032.relic.christian: "Tento posvátný text patří do mé pokladnice!" # todo: NEW TRANSLATION
 pam_decision_events.0032.relic: "Ať tyto spisy obohatí můj dvůr." # todo: NEW TRANSLATION
 pam_decision_events.0032.language: "Nechť můj žák studuje posvátné texty." # todo: NEW TRANSLATION
 pam_decision_events.0032.scriptorium.christian: "Ať se v písařské dílně chopí práce každý brk." # todo: NEW TRANSLATION
 pam_decision_events.0032.scriptorium: "Ať se chopí práce každý písař na mém dvoře." # todo: NEW TRANSLATION
 pam_decision_events.0032.a.christian: "Vysvěť nejhodnější členy mé domácnosti." # todo: NEW TRANSLATION
 pam_decision_events.0032.a: "Povolej nejhodnější členy mé domácnosti do služeb víry." # todo: NEW TRANSLATION
 pam_decision_events.0032.a.tt: "Až [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] nejvzdělanějších laiků mezi tvými [courtiers|E] #weak (včetně příbuzných)#!, každému z nich:\n$EFFECT_LIST_BULLET$ Připojí se k [clergy|E] víry [pam_clerical_patron.GetFaith.GetName]\n$EFFECT_LIST_BULLET$ Získá [learning_i][learning|E] a [opinion|E] o tobě\n$EFFECT_LIST_BULLET$ Udělí ti [piety_i][piety|E]" # todo: NEW TRANSLATION
 pam_decision_events.0032.b: "Pouč duchovní, kteří už jsou v mé péči." # todo: NEW TRANSLATION
 pam_decision_events.0032.b.tt: "Až [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] nejvzdělanějších duchovních mezi tvými dvorskými [clergy|E], každému z nich:\n$EFFECT_LIST_BULLET$ Získá [learning_i][learning|E] #weak (až [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_learning_cap_value')|V0])#!\n$EFFECT_LIST_BULLET$ Získá nebo rozvine [trait|E] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] či [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]" # todo: NEW TRANSLATION
 pam_decision_events.0032.c.named: "Přijmi [pam_clerical_novice.GetFirstNameNoTooltip] a rozhlásej, že přijímáš novici." # todo: NEW TRANSLATION
 pam_decision_events.0032.c: "Rozhlaš, že přijímáš novici." # todo: NEW TRANSLATION
 pam_decision_events.0032.c.tt: "Až [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] noviců z okolních zemí, každému z nich:\n$EFFECT_LIST_BULLET$ Připojí se k tvému dvoru a k [clergy|E] víry [pam_clerical_patron.GetFaith.GetName]\n$EFFECT_LIST_BULLET$ Konvertuje k tvému [rite|E]" # todo: NEW TRANSLATION
 pam_seize_capital_clerical_region_decision: "Zabrat církevní oblast" # todo: NEW TRANSLATION
 pam_seize_capital_clerical_region_decision_desc: "Mé vlastní hlavní město leží v [clerical_region|E], které mi nepatří. Nad sídlem, z něhož vládnu, by neměl sedět žádný [archbishop|E]: tento [title|E] náleží [head_of_faith|E]." # todo: NEW TRANSLATION
 pam_seize_capital_clerical_region_decision_tooltip: "Zabereš [clerical_region|E], v němž leží tvé hlavní město, a sesadíš jeho [archbishop|E], pokud je stolec obsazen" # todo: NEW TRANSLATION
 pam_seize_capital_clerical_region_decision_confirm: "Převzít stolec" # todo: NEW TRANSLATION
 pam_seize_capital_clerical_region_decision_deposed_tt: "[pam_deposed_archbishop.GetShortUIName] je sesazen" # todo: NEW TRANSLATION
 pam_seize_capital_clerical_region_decision_effect_tt: "[pam_seized_clerical_region.GetName] připadne tobě" # todo: NEW TRANSLATION
