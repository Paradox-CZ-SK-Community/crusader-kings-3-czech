 pam_decision_events.0003.mystic: "[target_child.GetShortUIName|U] projevuje hluboký zájem o duchovní záležitosti"
 pam_decision_events.0003.learning: "[target_child.GetShortUIName|U] si prohlubuje své znalosti"
 pam_decision_events.0003.education: "[target_child.GetShortUIName|U] se dále vzdělává"
