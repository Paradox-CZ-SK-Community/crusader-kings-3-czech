 pam_kingdom_of_heaven_news_tt: "[kingdom_of_heaven_founder.GetTitledFirstName|U] [Select_CString(kingdom_of_heaven_founder.IsFemale,'vyhlásila','vyhlásil')] [GetTitleByKey('h_kingdom_of_heaven').Custom('CZ_LandedName_A')] a nárokuje si právo vést všechny věřící"
 pam_founded_kingdom_of_heaven_modifier: "Krev Nového Jeruzaléma"
 pam_proclaim_living_word_decision: "Hlásat živé slovo"
 pam_proclaim_living_word_decision_desc: "Věřící si šeptají, že mě zvláštním znamením označuje [ROOT.Char.GetFaith.HighGodName]. Poutníci vyslovují mé jméno u svatyní podél cest a [ROOT.Char.GetFaith.PriestNeuterPlural|l] citují má rozhodnutí, jako by šlo o samotné Písmo.\n\nAť je to vyhlášeno od každého oltáře: skrze mě se světu zjevuje živé slovo."
 pam_proclaim_living_word_decision_tooltip: "Získej rys $trait_herald$ a staň se hlasatelem své [Concept('faith','víry')|E]"
 pam_proclaim_living_word_decision_confirm: "Ať se slovo šíří!"
 pam_proclaim_living_word_decision_sf_tt: "Tvé [Concept('spiritual_fulfillment','duchovní naplnění')|E] dosahuje alespoň #V [EmptyScope.ScriptValue('spiritual_fulfillment_3')|0]#!"
 pam_proclaim_living_word_decision_archbishop_tt: "Jsi [Concept('archbishop','arcibiskupem')|E]"
 pam_proclaim_living_word_decision_puppet_tt: "Jedna z tvých [Concept('puppets','loutek')|E] je [Concept('archbishop','arcibiskupem')|E] nebo zastává vyšší úřad"
 pam_proclaim_living_word_decision_realm_rite_tt: "Všechna [Concept('county','hrabství')|E] ve tvém [Concept('realm','panství')|E] vyznávají tvůj [Concept('rite','ritus')|E] a je jich alespoň #V 5#!"
 pam_proclaim_living_word_decision_effect_tt: "Budeš si moci vybrat mezi:\n$BULLET_WITH_TAB$ [GetModifier('pam_herald_shepherd_of_the_faithful_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$ [GetModifier('pam_herald_fire_and_sword_modifier').GetNameWithTooltip]"
 pam_decision_events.0021.t: "Živé slovo"
 pam_decision_events.0021.desc: "[ROOT.Char.Custom('GetFaithTemple')|U] praská ve švech. Už není ani kde pokleknout. Poutníci se tísní bok po boku s [ROOT.Char.GetFaith.PriestNeuterPlural|l], baroni s žebráky, a přesto se u vchodu shromažďují další a další lidé.\n\nMé skutky byly zkoumány pečlivěji, než by dokázal kterýkoli kronikář. Každá cesta, kterou jsem [Select_CString(ROOT.Char.IsFemale,'prošla','prošel')], každé modlitební bdění i každá mince obětovaná na [ROOT.Char.GetFaith.HighGodNamePossessive] oltář. Jeden z [ROOT.Char.GetFaith.PriestNeuterPlural|l] uchopí mou ruku a přitiskne ji k oltáři: „Mluv a my budeme naslouchat.“\n\nTicho, které následuje, patří jen mně. Čím je naplním, bude znít daleko za těmito zdmi."
 pam_decision_events.0021.a: "Milosrdenství bude mým kázáním."
 pam_decision_events.0021.b: "Ponesu toto slovo ohněm a mečem."
 pam_herald_shepherd_of_the_faithful_modifier: "Pastýř věřících"
 pam_herald_shepherd_of_the_faithful_modifier_desc: "Tato postava vyhlásila své posvátné poslání slovy milosrdenství a věřící ji za to zbožňují."
 pam_herald_fire_and_sword_modifier: "Oheň a meč"
 pam_herald_fire_and_sword_modifier_desc: "Tato postava vyhlásila své posvátné poslání jako výzvu do zbraně a bojovníci víry se houfně shromažďují pod jejím praporem."
 pam_convert_to_theocracy_decision: "Přijmout teokratickou vládu"
 pam_convert_to_theocracy_decision_desc: "Současná hierarchie převrací naruby řád, který ustanovuje [ROOT.Char.GetFaith.GoodGodNames]. Byla mi ukázána jediná cesta k nápravě. Cesta, která mi umožní velebit [ROOT.Char.GetFaith.CreatorHerHim|l] a zároveň dostát povinnostem vůči svému lidu. Tak praví [ROOT.Char.GetFaith.GoodGodNames]."
 pam_convert_to_theocracy_decision_confirm: "Prosadit [ROOT.Char.GetFaith.HighGodNamePossessive] řád"
 pam_convert_to_theocracy_decision_tooltip: "Změň své [Concept('government','vládní zřízení')|E] na [Concept('theocracy','teokracii')|E]"
 pam_convert_theocracy_to_feudal_decision: "Obnovit světskou vládu"
 pam_convert_theocracy_to_feudal_decision_desc: "Navenek mi propůjčuje autoritu [ROOT.Char.GetFaith.HighGodNamePossessive] zákon, a [ROOT.Char.GetFaith.GetAdherentNamePlural|l] proto u mě hledají duchovní vedení. Běda, necítím se být k takovému úkolu [Select_CString(ROOT.Char.IsFemale,'povolaná','povolaný')], a v těchto otázkách se raději řídím radami, které mi poskytuje [ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName|l].\n\nMé schopnosti spočívají ve světských záležitostech, a proto je jedině správné, abych se [Select_CString(ROOT.Char.IsFemale,'ujala','ujal')] světské koruny! Ať lid ví, že vládnu já, nikoli [ROOT.Char.GetFaith.PriestNeuterPlural|l], a dokonce ani [ROOT.Char.GetFaith.HighGodName]!"
 pam_convert_theocracy_to_feudal_decision_tooltip: "Změň vládní zřízení svého [Concept('realm','panství')|E] na [Concept('feudal','feudální')|E] namísto [Concept('theocracy','teokracie')|E]"
 pam_convert_theocracy_to_feudal_decision_confirm: "Ať panství opět spravují [ROOT.Char.GetWomenMen|l] z masa a kostí!"
 religious_head_is_not_ecclesiastical: "Vládní zřízení [Concept('head_of_faith','hlavy víry')|E] #bold není#! [Concept('ecclesiastical_government','církevní vláda')|E]"
 different_rite_than_hof: "Tvůj [Concept('rite','ritus')|E] se od [Concept('rite','ritu')|E] [Concept('head_of_faith_possessive','hlavy víry')|E] liší nejméně o [ROOT.Char.GetFaith.GetHeresyThreshold|-0] bodů [Concept('rite_divergent','odlišnosti')|E]"
 pam_decision_events.0009.t: "Posvátná správa"
 pam_decision_events.0009.desc: "Nasazuji si [ROOT.Char.Custom('ReligiousHeadHeadgear')|l] na hlavu a předstupuji před své zbožné [CZAdherentPl_A(ROOT.Char.GetFaith)|l]:\n\n„Staré pořádky lén a listin nám sloužily dobře, dokud nás nezačaly svádět na scestí. Naše vláda se nyní musí řídit učením, které nám předává [ROOT.Char.GetFaith.HighGodName]. [ROOT.Char.GetFaith.HighGodNameSheHe|U] určuje, jak máme spravovat [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_A')]. Jsem pouze [ROOT.Char.GetFaith.HighGodHerHis|l] [Select_CString(ROOT.Char.IsFemale,'pokornou služebnicí','pokorným služebníkem')], stejně jako vy všichni.“" # todo: CHANGED (predtym: S posvátnou úctou pozvedám [ROOT.Char.Custom('ReligiousHeadHeadgear')|l], nasazuji si ji na hlavu a předstupuji před své)
 pam_decision_events.0009.a: "Novým hlavním sídlem bude [ROOT.Char.Custom('GetFaithTemple')] [CZPrepV(new_capital.GetNameNoTierNoTooltip)|l] [new_capital.Custom('CZ_LandedNameNoTierNoTooltip_L')]!"
 church_holding_as_new_capital: "Ustanov [new_capital.GetName] [Concept('realm_capital','hlavním sídlem panství')|E]"
 pam_decision_events.0009.b: "Taková je vůle, kterou projevuje [ROOT.Char.GetFaith.HighGodName]."
 pam_decision_events.0009.liege_msg_title: "Přijetí teokracie"
 pam_decision_events.0009.liege_msg_desc: "[ROOT.Char.GetShortUIName|U] [Select_CString(ROOT.Char.IsLocalPlayer,'jsi','')] [Select_CString(ROOT.Char.IsFemale,'přeměnila','přeměnil')] své panství na [Concept('theocracy','teokracii')|E]."
 pam_decision_events.0010.opening: "[theocratic_ruler.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_decision_events.0010.desc: "Přijal jsem cestu posvátného uspořádání vlády. Očekávám, že se i tvé země vydají touto božskou cestou. Tak praví [theocratic_ruler.GetFaith.GoodGodNames]."
 pam_decision_events.0010.a: "Rozumím."
