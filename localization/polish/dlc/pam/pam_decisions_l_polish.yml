 pam_mentor_sp_decision: "Poskytnout duchovní vedení" # todo: NEW TRANSLATION
 pam_mentor_sp_decision_desc: "My, kteří kráčíme ve světle [ROOT.Char.GetFaith.HighGodNamePossessive], máme povinnost vést ty, kdo bloudí v temnotách, i ty, které mládí může svést na scestí v myšlenkách či skutcích." # todo: NEW TRANSLATION
