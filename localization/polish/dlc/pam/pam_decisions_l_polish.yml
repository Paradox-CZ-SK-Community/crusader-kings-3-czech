 pam_bull_events.desc.intro: "Já, [ROOT.Char.GetTitledFirstNameNoTooltip], služebník služebníků Božích, svým nejmilejším dětem v Kristu:\n\n" # todo: NEW TRANSLATION
 pam_bull_events.desc.outro: "\n\n#EMP Dáno v [ROOT.Char.GetCurrentLocation.GetName] dne [GetCurrentDate.GetStringLong]#!" # todo: NEW TRANSLATION
