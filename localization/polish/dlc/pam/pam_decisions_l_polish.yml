 pam_determine_patron_saint_decision_desc: "Svatí ze svých nebeských trůnů sledují zápasy smrtelných vládců a posuzují stav našich duší.\n\nVyberu si patrona, jehož ctnosti mi budou ukazovat cestu a jehož přímluva mi dodá jistotu před lidmi i tam, kde mě pozoruje [ROOT.GetCharacter.GetFaith.HighGodName]."
