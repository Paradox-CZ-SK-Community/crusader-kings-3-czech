 pam_decision_last_rites_doctrine_tt: "[faith|E] musí mít [doctrine|E] [GetDoctrineType('doctrine_sacraments_central').GetBaseName]" # todo: NEW TRANSLATION
 pam_decision_events.0005.no_last_rites_warning: "@warning_icon! #X Pokud nepřijmete poslední pomazání:\n$BULLET_WITH_TAB$Ztratíte [legitimacy_i][EmptyScope.ScriptValue('massive_legitimacy_gain')]\n$BULLET_WITH_TAB$$every_zealot_vassal$:\n$TAB$$BULLET_WITH_TAB$Ztratí #N 30#! [opinion|E] vůči #V vám#! #!" # todo: NEW TRANSLATION
 pam_decision_events.0005.secret_reveal: "@alert_icon! #alert_trial Možná budete muset odhalit [secret|E]" # todo: NEW TRANSLATION
 pam_decision_events.0005.details: "Budete mít možnost [lease|E] [titles|E], nebo pokud žádné nemáte k dispozici, darovat [gold|E] [monastic_holy_orders|E], [holy_orders|E] nebo [the_christian_church|E] — tím získáte pro svého [player_heir|E] prospěšné [modifiers|E]" # todo: NEW TRANSLATION
 pam_decision_events.0005.t: "Poslední pomazání: má poslední hodina" # todo: NEW TRANSLATION
 pam_decision_events.0005.desc.healthtrait: "Hřích mě učinil [death_trait.GetName(soon_dead)|l] a pravděpodobně je příčinou mé blížící se smrti." # todo: NEW TRANSLATION
 pam_decision_events.0005.desc.bad: "Snažil jsem se ctít [ROOT.Char.GetFaith.HighGodName], ale ve své pýše jsem se pokoušel skrýt své hříchy před jeho vševidoucíma očima.\n\n" # todo: NEW TRANSLATION
 pam_decision_events.0005.desc.good: "Naštěstí mám pocit, že jsou andělé nablízku a chrání mou duši před démony, kteří by si ji chtěli přivlastnit.\n\n" # todo: NEW TRANSLATION
 pam_decision_events.0005.desc.neutral: "Ačkoliv jsem se snažil ctít [ROOT.Char.GetFaith.HighGodName], s blížícím se prahem věčnosti se obávám, zda bude má duše uznána hodnou jeho Království nebeského.\n\n" # todo: NEW TRANSLATION
 pam_decision_events.0005.desc.notalone: "Po mém boku jsou [ROOT.Char.Custom2('PartnerOpinionDescription', SCOPE.sC('fam_or_friend_1') )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('fam_or_friend_1'))] [fam_or_friend_1.GetFirstName] a další, kteří se budou modlit za mou duši." # todo: NEW TRANSLATION
 pam_decision_events.0005.desc.alone: "Třesu se strachy, sám a bez blízkých, kteří by se modlili za mou duši." # todo: NEW TRANSLATION
 pam_decision_events.0005.desc.outro: "Můj zpovědník, s [Glossary('sacramentary','SACRAMENTARY_GLOSS')] v ruce, mi radí: "Postav se [ROOT.Char.GetFaith.HighGodName] bez přetvářky!"\n\nI král David, oděný do hříchu, byl po své zpovědi očištěn...[Glossary('$pam_psalm_51_english|q$','PSALM_51_5_GLOSS')]" # todo: NEW TRANSLATION
 pam_decision_events.0005.a: "Čeká mě svátost pokání." # todo: NEW TRANSLATION
 pam_decision_events.0005.b: "Ať si mě vezme ďábel! Zbavte mě toho kněze." # todo: NEW TRANSLATION
 pam_psalm_51_english: ""Proti tobě... jsem zhřešil a dopustil se zla... máš pravdu ve svém rozsudku a jsi bezúhonný, když vynášíš soud." # todo: NEW TRANSLATION
 SACRAMENTARY_GLOSS: "Sakramentář neboli #EMP liturgikon#! byly knihy používané při liturgických obřadech křesťanskými biskupy či kněžími. Podle doby a oblasti mohly obsahovat texty k předčítání či zpěvu, stejně jako texty ke svátostem." # todo: NEW TRANSLATION
 pam_decision_events.0006.t: "Poslední pomazání: Můj hřích je stále přede mnou" # todo: NEW TRANSLATION
 pam_decision_events.0006.intro: ""Chybovat je lidské. Bez zpovědi však nemůže dojít k rozhřešení," říká [confessor.GetTitledFirstName]." # todo: NEW TRANSLATION
 pam_decision_events.0006.desc.bad: "\n\nMé hříchy byly četné a závažné. Má duše těžkne, svírána spalujícími prsty Satana, který se chce zmocnit toho, co mu tak očividně náleží.\n\n" # todo: NEW TRANSLATION
 pam_decision_events.0006.desc.good: "\n\nMé srdce je lehké, neboť mé skutky byly v souladu s vůlí Páně.\n\n" # todo: NEW TRANSLATION
 pam_decision_events.0006.desc.neutral: "\n\nJsem jen [ROOT.Char.GetWomanMan] a hřích si mě našel navzdory mým nejlepším úmyslům.\n\n" # todo: NEW TRANSLATION
 pam_decision_events.0006.desc.my_sinful_trait_sin: "Kolikrát už mě svedla na scestí má [my_sinful_trait.GetName(soon_dead)] povaha!" # todo: NEW TRANSLATION
 pam_decision_events.0006.desc.secret_sin: "V temném zákoutí jsem v sobě skrýval, že jsem [my_secret.GetName]." # todo: NEW TRANSLATION
 pam_decision_events.0006.desc.my_criminal_trait_sin: "A snad ze všeho nejhorší je, že jsem [my_criminal_trait.GetName(soon_dead)]! Dusivá vina mi svírá hrdlo při každém nádechu." # todo: NEW TRANSLATION
 pam_decision_events.0006.desc.sin_default: "Mé hříchy jsou jistě četné, ale těžko si na ně vzpomínám. Jsem si jistý, že se vyvalí jako oceán protrženou hrází, až promluvím s [confessor.GetTitledFirstNameNoTooltip]." # todo: NEW TRANSLATION
 pam_decision_events.0006.desc.sin_default_good_sp: "Kéž mi [ROOT.Char.GetFaith.HighGodName] rozdrtí kosti a smaže mou nepravost." # todo: NEW TRANSLATION
 pam_decision_events.0006.desc.outro: "Musím se s náležitou lítostí přiznat ke svým hříchům, jinak mi bude odepřena eucharistie." # todo: NEW TRANSLATION
 pam_decision_events.0006.a: ""Odpusť mi, [confessor.GetMotherFather]..."" # todo: NEW TRANSLATION
 pam_decision_events.0006.b: "Některé hříchy si vezmu s sebou do hrobu." # todo: NEW TRANSLATION
 pam_decision_events.0006.b.flavor: "Z některých hříchů se vyzpovídáš, ale zamlčíš tajemství, která by mohla usvědčit ostatní." # todo: NEW TRANSLATION
 pam_decision_events.0007.t: "Poslední pomazání: Tělo, krev a olej" # todo: NEW TRANSLATION
 pam_decision_events.0007.intro: "Vyúčtování mých hříchů je u konce. Dlužit pouhý haléř je něco jiného než dlužit deset tisíc talentů.\n\nMůj zpovědník mi nabízí posvěcený chléb a víno." # todo: NEW TRANSLATION
 pam_decision_events.0007.desc.bad: "I teď, když se přede mnou objevuje tělo a krev mého Pána, slyším šeptání skřetů, kteří mě prosí, abych jim odevzdal svou duši, abych mohl dál žít a oddávat se světským rozkoším.\n\n" # todo: NEW TRANSLATION
 pam_decision_events.0007.desc.good: "Když jsem ze sebe sňal své břímě, vrhám se do náruče smrti. Toužím přijmout tělo a krev svého Pána, po jehož boku brzy spočinu.\n\n" # todo: NEW TRANSLATION
 pam_decision_events.0007.desc.neutral: "Kéž mě tělo a krev Páně ochrání před démony, kteří číhají jako vlci a chtějí mě odvést dřív, než přijde můj čas.\n\n" # todo: NEW TRANSLATION
 pam_decision_events.0007.desc.oil.intro: "[confessor.GetSheHe|U] mi pak pomaže čelo, ruce a nohy svatým olejem." # todo: NEW TRANSLATION
 pam_decision_events.0007.desc.oil.bad: "Má duše zůstává znepokojená.\n\n" # todo: NEW TRANSLATION
 pam_decision_events.0007.desc.oil.good: "Má duše září láskou Páně.\n\n" # todo: NEW TRANSLATION
 pam_decision_events.0007.desc.oil.neutral: "Má duše se cítí připravena na svou cestu.\n\n" # todo: NEW TRANSLATION
 pam_decision_events.0007.desc.outro: "Když jsou [Glossary('viaticum','VIATICUM_GLOSS')] a [Glossary('unction','UNCTION_GLOSS')] dokončeny, mohu naplánovat, kdo se za mě bude modlit." # todo: NEW TRANSLATION
 VIATICUM_GLOSS: "Latinsky „výbava na cestu“. Viatikum je název pro svátost přijímání, neboli eucharistii, v souvislosti s posledním pomazáním. Touto cestou se míní cesta do věčného života." # todo: NEW TRANSLATION
 UNCTION_GLOSS: "Poslední pomazání je označení pro pomazání nemocného svatým olejem, pokud k němu dochází „in extremis“, tedy v okamžiku krajního nebezpečí či blízké smrti. Má člověka připravit na věčný život." # todo: NEW TRANSLATION
 pam_decision_events.0007.a: "Kéž se za mě modlí [monastic_order.GetName]." # todo: NEW TRANSLATION
 pam_decision_events.0007.b: "Rád bych podpořil [military_order.GetName]." # todo: NEW TRANSLATION
 pam_decision_events.0007.c: "[religious_head.GetTitledFirstNameNoTooltip] může mít mé bohatství a já [religious_head.GetHerHis] modlitby." # todo: NEW TRANSLATION
 pam_decision_events.0007.d: "Zbožné slovo [confessor.GetTitledFirstNameNoTooltip] postačí." # todo: NEW TRANSLATION
