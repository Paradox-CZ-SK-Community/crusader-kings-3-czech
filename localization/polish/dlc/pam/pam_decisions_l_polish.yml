 pam_kingdom_of_heaven.0001.t: "Království nebeské" # todo: NEW TRANSLATION
 pam_kingdom_of_heaven.0001.desc: ""S královstvím Božím je to tak, jako když člověk zaseje semeno do země; ve dne v noci spí i vstává, a semeno klíčí a roste, on ani neví jak."\n\nObracím se ke křesťanstvu. V prstech držím hlínu ze Svaté země.\n\n"Země sama od sebe plodí nejprve stéblo," otevřu dlaň a hlína se rozptýlí ve vzduchu. "Potom klas," ukážu na svůj lid. "A nakonec zralé zrno v klasu." Pozvednu berlu.\n\n"A když úroda dozraje... hned se pustí do žně, protože nastal čas sklizně."" # todo: NEW TRANSLATION
