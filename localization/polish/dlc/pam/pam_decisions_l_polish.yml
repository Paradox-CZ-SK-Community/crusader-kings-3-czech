 recipient_head_of_rite_is_not_lieges_head_of_rite_tt: "Jste [head_of_rite|E] postavy [recipient.GetShortUINamePossessive], ale nikoli [head_of_rite|E] jejího [liege|E]" # todo: NEW TRANSLATION
