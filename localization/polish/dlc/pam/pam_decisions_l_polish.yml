 pam_decision_events.0011.desc.permitted: "Svou pečetí jsem stvrdil rozhodnutí. Od tohoto dne je zásada [pam_tenet_stance_tenet.GetName(pam_tenet_stance_issuer.GetRite)] uznávána za řádné učení naší víry.\n\nNechť její dosud skrytí vyznavači vystoupí na světlo."
