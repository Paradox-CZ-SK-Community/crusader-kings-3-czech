 pam_decision_last_rites_desc: "#EMP Smiluj se nade mnou, ó [ROOT.Char.GetFaith.HighGodName]! Důkladně mě očisti od mé nepravosti a zbav mě mého hříchu.#!\n\nProtože se blíží můj odchod z tohoto tělesného bytí, doufám, že napravím svou duši. Ochráněn před pekelnými svody snad naleznu dobrou smrt a věčný život v Království nebeském." # todo: NEW TRANSLATION
