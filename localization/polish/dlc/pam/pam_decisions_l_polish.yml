 pam_declare_rite_heresy_decision_desc: "Ritus, který se příliš vzdálil pravé cestě, je třeba nazvat pravým jménem.\n\nProhlásím jej za kacířský, aby věřící věděli, že se mu mají vyhýbat." # todo: NEW TRANSLATION
