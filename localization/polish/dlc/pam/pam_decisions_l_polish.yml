 pam_promulgate_word_of_pious_deeds_decision: "Rozhlásit zvěst o zbožných skutcích"
 pam_promulgate_word_of_pious_deeds_decision_desc: "Má kancelář sepsala oslavný spis vyzdvihující mé skutky hodné Kristova příkladu. Ačkoli se nesluší vychvalovat vlastní ctnosti, mí blízcí touží rozšířit zprávy o mé zbožnosti mezi všechny [CZAdherentPl_A(ROOT.Char.GetFaith)|l].\n\nTaková pověst by mohla přesvědčit mnohé, že právě já jsem [Select_CString(ROOT.Char.IsFemale,'tou nejpovolanější ženou','tím nejpovolanějším mužem')], kdo by měl usednout na stolec svatého Petra... a možná dosáhnout ještě výše."
 pam_promulgate_word_of_pious_deeds_decision_desc_tooltip: "#V Zvýšení volebního skóre#! pro [Select_CString(ROOT.Char.GetReligiousSuperior.IsValid,ROOT.Char.GetReligiousSuperior.GetPrimaryTitle.GetName,ROOT.Char.GetPrimaryTitle.GetName)]: #P +30#! nebo zvýšení šance na [Concept('canonization','kanonizaci')|E]"
 pam_promulgate_word_of_pious_deeds_decision_tooltip_effect: "Budeš si moci vybrat mezi:\n\t$EFFECT_LIST_BULLET$Vynalož [Concept('piety','zbožnost')|E] a #V zvyš volební skóre#! pro [praise_worthy_priest_superior_title.GetName]\n\t$EFFECT_LIST_BULLET$Zvyš svou šanci na budoucí [Concept('canonization','kanonizaci')|E]"
 pam_promulgate_word_of_pious_deeds_decision_confirm: "Ať šíří mou slávu!"
 cardinal_unlocks_pam_promulgate_word_of_pious_deeds_decision_tooltip: "Jsi [Concept('cardinal','kardinálem')|E]"
 domicile_unlocks_pam_promulgate_word_of_pious_deeds_decision_tooltip: "Tvůj [Concept('domicile','domicil')|E] musí mít [Concept('domicile_building','budovu domicilu')|E] [GetDomicileBuilding('chancery_01').GetName] nebo budovu vyšší úrovně"
 pam_renounce_papal_candidacy_decision: "Vzdát se kandidatury na [ROOT.Char.GetFaith.ReligiousHeadTitleName]"
 pam_renounce_papal_candidacy_decision_embrace: "Ucházet se o [ROOT.Char.GetFaith.ReligiousHeadTitleName]"
 pam_renounce_papal_candidacy_decision_desc_renounce: "Někteří zasvětí celý život snaze usednout na trůn, na němž nyní sedí [ROOT.Char.GetFaith.ReligiousHeadName], a já jsem [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')], co s nimi takové úsilí dělá.\n\nAť [Concept('cardinal','kardinálové')|E] vědí, že při příští volbě, z níž vzejde nový [ROOT.Char.GetFaith.ReligiousHeadName], nebudu kandidovat. Mé poslání je zde, v mém vlastním biskupském sídle."
 pam_renounce_papal_candidacy_decision_desc_embrace: "Kdysi jsem [Select_CString(ROOT.Char.IsFemale,'dala','dal')] najevo, že se nebudu ucházet o trůn, na němž sedí [ROOT.Char.GetFaith.ReligiousHeadName]. Tehdy jsem [Select_CString(ROOT.Char.IsFemale,'byla ještě mladší','byl ještě mladší')] a pro [ROOT.Char.GetFaith.GetName] to bývaly vlídnější časy.\n\nAť se [Concept('cardinal','kardinálové')|E] dozvědí, že jsem si to [Select_CString(ROOT.Char.IsFemale,'rozmyslela','rozmyslel')] a jsem opět [Select_CString(ROOT.Char.IsFemale,'ochotná','ochotný')] kandidovat."
 pam_renounce_papal_candidacy_decision_tooltip_renounce: "Stáhni svou kandidaturu na příští [Concept('head_of_faith','hlavu víry')|E]"
 pam_renounce_papal_candidacy_decision_tooltip_embrace: "Znovu se ucházej o zvolení příští [Concept('head_of_faith','hlavou víry')|E]"
 pam_renounce_papal_candidacy_decision_renounce_tt: "Při příští volbě [Concept('head_of_faith','hlavy víry')|E] nebudeš mezi kandidáty, ale ponecháš si své hlasovací právo"
 pam_renounce_papal_candidacy_decision_embrace_tt: "Při příští volbě [Concept('head_of_faith','hlavy víry')|E] se můžeš ucházet o zvolení"
 pam_renounce_papal_candidacy_decision_last_candidate_tt: "Alespoň jeden další [Concept('cardinal','kardinál')|E] musí být ochotný kandidovat"
 pam_renounce_papal_candidacy_decision_confirm_renounce: "Stáhnout svou kandidaturu"
 pam_renounce_papal_candidacy_decision_confirm_embrace: "Jsem [Select_CString(ROOT.Char.IsFemale,'připravena','připraven')]"
 pam_decision_events.0015.t: "Rozhlásit zvěst o zbožných skutcích"
 pam_decision_events.0015.desc.intro.no_praiser: "Mí věrní kněží předčítají"
 pam_decision_events.0015.desc.intro.praiser: "[Select_CString(my_praiser.IsFemale,'Má vlivná','Můj vlivný')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('my_praiser'))], [my_praiser.GetTitledFirstName], předčítá"
 pam_decision_events.0015.desc.intro: "oslavný spis sepsaný v [GetDomicileBuilding('chancery_01').GetName]:\n\n„Ctnostné skutky jsou jako semena, která Pán zasévá, aby z nich vzešla bohatá úroda zbožnosti. Všichni by měli znát [praise_worthy_priest.Custom('CZ_Name_A')], neboť tak ušlechtilé činy si zaslouží úctu."
 pam_decision_events.0015.desc.virtuoustrait: " Obdiv si zaslouží také ctnost [my_virtuous_trait.GetName(praise_worthy_priest)]."
 pam_decision_events.0015.desc.mid: " Všechny tyto skutky jsou vedeny"
 pam_decision_events.0015.desc.virtuoustenet: " zásadou [my_virtuous_tenet.GetName(praise_worthy_priest.GetRite)]...“"
 pam_decision_events.0015.desc.novirtuoustenet: " vůlí Boží...“"
 pam_decision_events.0015.desc.bad: "\n\nNavzdory všem těm pochvalným slovům se mé srdce chvěje strachem z pekelného ohně."
 pam_decision_events.0015.desc.good: "\n\nVskutku jsem nástrojem Páně, ztělesněním jeho krásy na zemi."
 pam_decision_events.0015.desc.neutral: "\n\nNavzdory všem těm pochvalným slovům se teprve po smrti dozvím, zda má duše obstojí před Pánem."
 pam_decision_events.0015.desc.outro: "\n\n„...vskutku, právě spravedlnost těchto činů dokazuje, že [praise_worthy_priest.GetName] si zaslouží jednoho dne stanout v čele církve!“"
 pam_decision_events.0015.b: "„Na svém kontě mám nejeden zázrak.“"
 pam_decision_events.0015.b.flavor: "Proč se spokojit s papežstvím, když můžeš dosáhnout svatořečení?"
 pam_decision_events.0015.b.tt: "#V Zvýšení šance na kanonizaci#! po smrti\n#weak Kanonizace vyžaduje příslušnost k [Concept('dynasty','dynastii')|E]#!"
 pam_decision_events.0015.c: "„Pokud si Pán přeje, abych vedl[Select_CString(ROOT.Char.IsFemale,'a','')] církev...“"
 pam_decision_events.0015.c.flavor: "...musím být [Select_CString(ROOT.Char.IsFemale,'připravena','připraven')] dostát svému poslání"
 pam_decision_events.0015.c.tt: "#V Zvýšení volebního skóre#! pro [praise_worthy_priest_superior_title.GetName]: #P +30#!"
 pam_decision_events.0015.d: "Ať nezazní žádné jiné jméno."
 pam_decision_events.0015.d.flavor: "Vydám veškerou svou zbožnost. S druhým místem se nespokojím"
 pam_decision_events.0015.d.tt: "#V Zvýšení volebního skóre#! pro [praise_worthy_priest_superior_title.GetName]: #P +[praise_worthy_priest.MakeScope.ScriptValue('pam_papabile_place_first_populist_value')|0]#!, což postačí k získání prvního místa v kategorii $theocratic_elective_populist$\nVyžaduje @piety_icon![praise_worthy_priest.MakeScope.ScriptValue('pam_place_first_as_populist_piety_cost_value')|0] [Concept('piety','zbožnosti')|E]"
 pam_evangelize_personal_tenet_decision: "Šířit osobní zásadu"
 pam_evangelize_personal_tenet_decision_desc: "O mém přesvědčení by měli slyšet všichni. Budu následovat Ježíšovo učení a šířit jeho poselství v jeho jménu."
 pam_evangelize_personal_tenet_decision_tooltip: "Šiř svou [Concept('personal_tenet','osobní zásadu')|E] mezi [Concept('subjects','subjekty')|E] a [Concept('rulers','vládci')|E] v [Concept('clerical_region','církevní oblasti')|E] svého [Concept('realm_capital','hlavního sídla panství')|E], aby ji přijali jako svou vlastní osobní zásadu"
 pam_evangelize_personal_tenet_decision_confirm: "Šířit zásadu [selected_item.GetNameNoTooltip(actor.GetRite)] [GuiScope.SetRoot(actor.MakeScope).AddScope('second',selected_item.MakeScope).Custom('pam_tenet_popularity_status')](#high [actor.GetFaith.GetTenetPopularityScore(selected_item.Self)]#!)"
