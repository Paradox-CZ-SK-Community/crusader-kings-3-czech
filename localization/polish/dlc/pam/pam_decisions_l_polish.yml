 pam_declare_rite_heresy_decision: "Prohlásit ritus za kacířský"
 pam_declare_rite_heresy_decision_desc: "Ritus, který se příliš vzdálil od pravé cesty, musí být označen pravým jménem.\n\nProhlásím jej za kacířství, aby věřící věděli, že se mu mají vyhýbat."
 pam_declare_rite_heresy_decision_tooltip: "Vyber odlišný [Concept('rite','ritus')|E] víry [ROOT.Char.GetFaith.GetName] a prohlas jej za [Concept('heresy','kacířství')|E]"
 pam_declare_rite_heresy_decision_confirm: "Vyhlásit odsouzení"
 pam_declare_rite_heresy_decision_valid_tt: "Musí existovat další [Concept('rite','ritus')|E] téže [Concept('faith','víry')|E], jehož [Concept('rite_divergence','odlišnost')|E] od hlavního [Concept('rite','ritu')|E] překračuje #V [THIS.ScriptValue('faith_heresy_threshold')|0V]#!"
 pam_declare_rite_heresy_decision_valid_zealous_tt: "Musí existovat další [Concept('rite','ritus')|E] téže [Concept('faith','víry')|E], jehož [Concept('rite_divergence','odlišnost')|E] překračuje #V [THIS.ScriptValue('faith_heresy_threshold_times_4_over_5')|0V]#!. Výchozím měřítkem je hlavní $game_concept_rite$"
 pam_declare_rite_heresy_bull_decision_desc: "Ritus, který se příliš vzdálil od pravé cesty, musí být označen pravým jménem.\n\nBude vydána [Concept('papal_bull','papežská bula')|E], která jej odsoudí jako kacířství."
