 pam_decision_events.0001.t: "Zpověď" # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.intro: "[chaplain.GetTitledFirstName] trpělivě čeká v prázdné kapli.\n\n" # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.bad: "[chaplain.GetHerHis|U] přísný pohled připomíná ten, který očekávám od Otce." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.good: "I když mě tíha na bedrech příliš netíží, přesto ji lze zmírnit." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.neutral: "Jako ztracený kus dobytka, nejistý ohledně dobroty svého srdce, přistupuji k [chaplain.GetHerHim]." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.preamble: "\n\nVina, kterou cítím kvůli svým hříchům, mi není cizí." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.lustful: "Nechal jsem chtíč, aby ovládl mou vůli." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.chaste: "Má cudnost se stala chladným útočištěm před povinností." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.gluttonous: "Dopřával jsem tělu víc, než bylo únosné." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.temperate: "Má střídmost se změnila v popírání vlastních potřeb." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.greedy: "Držel jsem se zlata, ačkoli jsem měl dávat." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.generous: "Rozdával jsem víc, než bylo moudré, a zůstal jsem s prázdnýma rukama." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.lazy: "Lenost mi bránila v modlitbě i plnění povinností." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.diligent: "Má horlivost v práci vytlačila milosrdenství." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.wrathful: "Hněv mě přivedl k hříchu." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.calm: "Můj klid byl jen lhostejností převlečenou za ctnost." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.patient: "Trpělivost se zvrhla v zbabělé otálení." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.impatient: "Netrpělivost ze mě učinila člověka tvrdého a zbrklého." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.arrogant: "Pýcha mi nadmula srdce." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.humble: "Falešná pokora mi bránila poznat pravdu." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.deceitful: "Lhal jsem a zatajoval, co jsem měl poctivě přiznat." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.honest: "Má přímočará upřímnost ranila tam, kde jsem měl projevit laskavost." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.craven: "Strach mě přiměl opustit to, co bylo správné." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.brave: "Má odvaha předčila rozvahu a změnila se v bezhlavost." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.shy: "Nesmělost mi bránila konat dobro, které jsem měl vykonat." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.gregarious: "Má láska ke společnosti přehlušila svědomí." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.ambitious: "Má ctižádost předčila mé svědomí." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.content: "Spokojenost otupila mou touhu po spravedlnosti." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.arbitrary: "Vládl jsem podle rozmaru namísto spravedlnosti." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.just: "Má spravedlnost byla nemilosrdná a pyšná." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.cynical: "Cynismus nahlodal mou víru." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.zealous: "Horlivost hořela silněji než láska k bližnímu." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.paranoid: "Podezřívavost otrávila mé vztahy s ostatními." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.trusting: "Důvěřivost mě zaslepila vůči zlu." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.compassionate: "Soucit mě přiměl omlouvat to, co mělo být odsouzeno." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.callous: "Zatvrdil jsem své srdce vůči utrpení druhých." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.stubborn: "Tvrdohlavost mě učinila hluchým vůči napomenutí." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.fickle: "Nestálost způsobila, že se na má slova nelze spolehnout." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.eccentric: "Mým výstředním chováním jsem pohoršil věřící." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.vengeful: "Pomsta mě pohltila." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.forgiving: "Závažné provinění jsem odpustil příliš snadno." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.sin.sadistic: "Měl jsem potěšení z krutosti." # todo: NEW TRANSLATION
 pam_decision_events.0001.desc.outro: "\n\n"[Glossary('$pam_john_20_22_english|q$','JOHN_20_22_GLOSS')]"" # todo: NEW TRANSLATION
 pam_decision_events.0001.a: "Odpusťte mi, [chaplain.GetMotherFather], neboť jsem zhřešil." # todo: NEW TRANSLATION
 pam_john_20_22_english: "Přijměte Ducha svatého. Komu odpustíte hříchy, tomu jsou odpuštěny; komu je neodpustíte, tomu odpuštěny nejsou." # todo: NEW TRANSLATION
 JOHN_20_22_GLOSS: "#weak Jan 20:22–23, NRSVUE#!" # todo: NEW TRANSLATION
 pam_decision_act_of_devotion: "Uspořádat projev zbožnosti" # todo: NEW TRANSLATION
 pam_decision_act_of_devotion_desc: "Mé hluboké vnitřní spojení s [ROOT.Char.GetFaith.HighGodName] je tak silné, že je musím dát najevo!\n\nSvolám [ROOT.Char.GetFaith.PriestNeuterPlural], uspořádám velkou mši a povolám všechny z říše. Ať vidí, jak zbožný je jejich lenní pán." # todo: NEW TRANSLATION
 pam_decision_act_of_devotion_desc_tooltip: "Vyměňte [piety|E] za [prestige|E]" # todo: NEW TRANSLATION
 pam_decision_act_of_devotion_tooltip_effect: "Budete si moci vybrat mezi:\n$BULLET_WITH_TAB$ [prestige_i]#P [EmptyScope.ScriptValue('major_prestige_gain')|0]#! [prestige|E]\n$BULLET_WITH_TAB$ [prestige_i]#P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#! [prestige|E] a jednou úrovní [prestige_level|E] navíc výměnou za jednu úroveň [piety_level|E]" # todo: NEW TRANSLATION
