 pam_antipope_events.0001.t: "Soupeřící [ROOT.Char.GetFaith.ReligiousHeadName|l]"
 pam_antipope_events.0001.desc.intro: "[ROOT.Char.GetFaith.HouseOfWorship|U] dnes zřejmě hostí všechny vyznavače ritu [ROOT.Char.GetRite.GetName].\n\n"
 pam_antipope_events.0001.desc.self: "Pozvedám ruku vysoko nad hlavu. [pope.GetTitledFirstName] již dlouho neudrží svou nepravou vládu. Nyní na mně spočívá povinnost vést věřící, s nimiž se za této vlády tak špatně zacházelo."
 pam_antipope_events.0001.desc.sponsor: "„Ať heroldi oznámí světu, že #EMP já#! jsem pravý [ROOT.Char.GetFaith.ReligiousHeadName|l]!“ hřímá [antipope.GetTitledFirstName]. „Ať všichni vědí, že [pope.GetTitledFirstName] se skrývá za zdmi svého paláce ve městě [pope_capital.GetName], zatímco věřící trpí bez pomoci a duchovního vedení!“\n\n[antipope.GetTitledFirstNameNoTooltip] se ke mně obrátí. „Ale už se nemusíte bát. [ROOT.Char.GetTitledFirstName] se [Select_CString(ROOT.Char.IsFemale,'rozhodla','rozhodl')] skoncovat s vaším utrpením. A já budu stát po [Select_CString(ROOT.Char.IsFemale,'jejím','jeho')] boku.“"
 pam_antipope_events.0001.a: "Ať se [ROOT.Char.GetFaith.GetNameNoTooltip] otřese v základech."
 pam_antipope_events.0002.opening: "Tobě, [ROOT.Char.Custom('CZ_TitledFirstNameNoTooltip_D')], [Select_CString(ROOT.Char.IsFemale,'vyznavačce','vyznavači')] víry [ROOT.Char.GetFaith.GetNameNoTooltip],"
 pam_antipope_events.0002.desc.challenger_sponsor: "Věz, že já, [sponsor.GetTitledFirstName], jsem [Select_CString(sponsor.IsFemale,'povýšila','povýšil')] [antipope.Custom('CZ_TitledFirstName_A')]"
 pam_antipope_events.0002.desc.antipope_self: "Věz, že já, [sponsor.GetTitledFirstName], jsem [Select_CString(sponsor.IsFemale,'povýšila samu sebe','povýšil sám sebe')]"
 pam_antipope_events.0002.desc.outro: " do úřadu soupeřící hlavy víry s titulem [antipope.GetFaith.ReligiousHeadName]. Nová hlava víry se postaví proti nepravé vládě [pope.Custom('CZ_TitledFirstName_G')] a povede vyznavače ritu [antipope.GetRite.GetName] tak, jak velí naše tradice."
 pam_antipope_events.0002.a: "Další Proti[antipope.GetFaith.ReligiousHeadName|l]...?"
