 pam_decision_events.0003.t: "Nejdůležitější lekce" # todo: NEW TRANSLATION
 pam_decision_events.0003.desc.intro: "Nastala noc a hrad je tichý. Mé [target_child.Custom('GetDaughterSon')] sedí vedle mě v soukromé kapli.\n\nPodívám se na [target_child.GetHerHim]." # todo: NEW TRANSLATION
 pam_decision_events.0003.desc.bad: "[target_child.GetHerHis|U] propadlá tvář, nezúčastněný pohled, téměř spí.\n\n"[ROOT.Char.GetMotherFather|U]," ptá se [target_child.GetSheHe] netrpělivě, "proč jsi mě zavolal?"" # todo: NEW TRANSLATION
 pam_decision_events.0003.desc.good: "[target_child.GetHerHis|U] oči rozzářené světlem svíčky. [target_child.GetSheHe|U] je dobrý [target_child.GetWomanMan].\n\n„[ROOT.Char.GetMotherFather|U],“ ptá se [target_child.GetSheHe], „ublížil jsem ti?“" # todo: NEW TRANSLATION
 pam_decision_events.0003.desc.neutral: "[target_child.Custom('ComplimentAdjective')|U]. Už dost starý.\n\n"[ROOT.Char.GetMotherFather|U]," ptá se [target_child.GetSheHe] tiše, "jak má člověk žít správně?"" # todo: NEW TRANSLATION
 pam_decision_events.0003.a: "Zkažený [ROOT.Char.GetTitleAsNameNoTooltip|l] brzy otráví [target_child.GetHerHis] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]." # todo: NEW TRANSLATION
