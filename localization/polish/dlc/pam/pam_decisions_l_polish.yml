 pam_determine_patron_saint_decision_desc: "Svatí ze svých nebeských trůnů sledují útrapy smrtelných vládců a váží rozpoložení našich duší.\n\nDovolte mi vybrat si patrona, jehož ctnost utváří mou cestu a jehož přímluva povede mou ruku před [ROOT.GetCharacter.GetFaith.HighGodName] i lidmi." # todo: NEW TRANSLATION
