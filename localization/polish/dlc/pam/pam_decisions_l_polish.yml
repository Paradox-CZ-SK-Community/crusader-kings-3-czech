 pam_bull_events.0002.desc.tenet_permitted: ""Vězte všichni, kdo věříte v [tenet_scope.GetName( ROOT.GetCharacter.GetRite )], že nyní je to se svolením [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] dovoleno."" # todo: NEW TRANSLATION
 pam_bull_events.0002.desc.tenet_forbidden: ""Učení [tenet_scope.GetName( ROOT.GetCharacter.GetRite )] už v naší zemi nemá místo. Každý, kdo je praktikuje, ať ví, že porušuje posvátnost církve a dopouští se smrtelného hříchu."" # todo: NEW TRANSLATION
