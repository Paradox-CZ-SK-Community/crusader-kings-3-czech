 pam_mended_great_schism_diplomatic_dynasty_modifier_desc: "Tato dynastie přesvědčila soupeřící patriarchy, aby obnovili církevní společenství, a bez jediné prolité kapky krve tak zacelila rozkol v křesťanstvu."
