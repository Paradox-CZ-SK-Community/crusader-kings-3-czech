 pam_kingdom_of_heaven.0001.t: "Království nebeské"
 pam_kingdom_of_heaven.0001.desc: "„S královstvím Božím je to tak, jako když člověk zaseje semeno do země. Ve dne v noci spí i vstává, semeno klíčí a roste, a on ani neví jak.“\n\nObracím se ke křesťanstvu. Mezi prsty svírám hlínu ze Svaté země.\n\n„Země sama od sebe vydává nejprve stéblo,“ rozevřu dlaň a hlína se rozptýlí ve vzduchu. „Potom klas,“ ukážu na svůj lid. „A nakonec plné zrno v klasu.“ Pozvednu svou pastýřskou berlu.\n\n„Jakmile však obilí dozraje... hned se chopí srpu, neboť nastaly žně.“"
 pam_kingdom_of_heaven.0001.a: "Mým hlavním sídlem i nadále zůstane [previous_capital.GetNameNoTooltip]."
 pam_kingdom_of_heaven.0001.b: "Čím je stolec svatého Petra proti stolci Kristovu?"
 kingdom_of_heaven_lower_vassals_gained_tt: "[SCOPE.ScriptValue('kingdom_of_heaven_lower_vassals_gained_value')|V0] [Concept('dukes','vévodů')|E] a [Concept('counts','hrabat')|E] se stalo tvými [Concept('vassals','vazaly')|E]"
 kingdom_of_heaven_lower_de_jure_gained_tt: "[Concept('empires','Říše')|EU] ve tvém držení a říše bez [Concept('holder','držitele')|E], které byly tebou [Concept('completely_controlled','zcela ovládány')|E], se staly [Concept('de_jure','de iure')|E] součástí [GetTitleByKey('h_kingdom_of_heaven').Custom('CZ_LandedName_G')]"
