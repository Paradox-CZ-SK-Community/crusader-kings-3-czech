 pam_decision_events.0031.desc.self_crowning: "Která země je požehnanější než [ROOT.Char.GetPrimaryTitle.GetNameNoTier]? Které léno si více zaslouží královskou ochranu? Nechránil snad [ROOT.Char.GetFaith.WarGodName] jeho lid před neštěstím a neuchoval mé svaté sídlo uvnitř jeho hranic?\n\nVykonavatelem vůle [ROOT.Char.GetFaith.HighGodNamePossessive] jsem posvětil [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]. Stal jsem se posvátným ochráncem této země a už nikdy nebude má vůle zavržena.\n\nVazalové i věřící — pokloňte se! Dobří [religious_authority.GetFaith.GetReligion.GetAdherentNamePlural] vědí, že mají ctít svého [ROOT.Char.GetTitleAsName]." # todo: NEW TRANSLATION
 pam_decision_events.0031.desc_three_duchies: "Z vůle [religious_authority.GetTitledFirstNamePossessiveRegnal] jsou země mé říše uspořádány jako osudové hvězdy na neustále se otáčející obloze. Z [duchy_1.GetName], [duchy_2.GetName] a [duchy_3.GetName] vzniká požehnané a sjednocené [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l].\n\nA ze spravedlivé a důstojné duše povstává nový [ROOT.Char.GetTitleAsName]! Povýšil mě mandát [religious_authority.GetTitleAsNamePossessiveNoTooltip] a nyní musím vést lid ve jménu [religious_authority.GetHerHis]." # todo: NEW TRANSLATION
 pam_decision_events.0031.desc: "Z vůle [religious_authority.GetTitledFirstNamePossessiveRegnal] se do letopisů zapisuje název nového [ROOT.Char.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l]. [ROOT.Char.GetFaith.PriestNeuterPlural] a lid mě s jásotem povyšují! Dokud [ROOT.Char.GetPrimaryTitle.GetNameNoTier] nepadne do rukou pohanů a kacířů, zůstanu jeho právoplatným [ROOT.Char.GetFaith.GetAdjective] [ROOT.Char.GetTitleAsName].\n\n[religious_authority.GetTitleAsNameNoTooltip], můj stvořitel, požehnal této skromné říši... a jistě bude s jistým zájmem sledovat mé královské počínání." # todo: NEW TRANSLATION
 pam_decision_events.0031.a: "Ať [ROOT.Char.GetFaith.HighGodName] navždy miluje mé [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]." # todo: NEW TRANSLATION
 any_landed_duchy_title_tt: "Držíte alespoň jeden [duchy|E], který je [landed|E] [title|E] #weak #EMP (nikoli [clerical_region|E] ani [noble_family|E])#!#!" # todo: NEW TRANSLATION
