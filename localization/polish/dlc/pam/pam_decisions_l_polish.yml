 pam_kowtowed_to_pope_modifier: "Poklekl před církví" # todo: NEW TRANSLATION
 pam_kowtowed_to_pope_modifier_desc: "Tento [ruler|E] poklekl před církví a na koncilu, který ukončí [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName], slíbil podporovat nauku #EMP Duchovní, odvolatelná#!. Odstraní se po skončení koncilu, který spor vyřeší." # todo: NEW TRANSLATION
 pam_kowtow_to_pope_decision: "Pokleknout před [ROOT.Char.GetFaith.ReligiousHeadName]" # todo: NEW TRANSLATION
 pam_kowtow_to_pope_decision_desc: "Koruna a berla se přou o to, kdo smí jmenovat držitele církevních titulů. Namísto riskování otevřeného vzdoru poklekněte před [ROOT.Char.GetFaith.ReligiousHeadName] a stůjte při věřících, až bude svolán velký koncil, který má spor rozhodnout." # todo: NEW TRANSLATION
 pam_kowtow_to_pope_decision_tooltip: "Slibte, že podpoříte nárok církve na jmenování" # todo: NEW TRANSLATION
