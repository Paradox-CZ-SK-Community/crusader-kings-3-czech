 pam_decision_events.0009.t: "Posvátná správa" # todo: NEW TRANSLATION
 pam_decision_events.0009.desc: "Zbožně pozvedám [ROOT.Char.Custom('ReligiousHeadHeadgear')], nasazuji si ji na hlavu a předstupuji před své zbožné [ROOT.Char.GetFaith.GetAdherentNamePlural]:\n\n"Staré způsoby lén a listin nám dobře sloužily, dokud nás nezačaly svádět na scestí. Veden slovem [ROOT.Char.GetFaith.HighGodName], je to [ROOT.Char.GetFaith.HighGodNameSheHe|U], kdo určuje, jak máme vládnout [ROOT.Char.GetPrimaryTitle.GetNameNoTier]. Jsem jen [ROOT.Char.GetFaith.HighGodHerHis|U] pokorný služebník, stejně jako vy všichni."" # todo: NEW TRANSLATION
 pam_decision_events.0009.a: "[ROOT.Char.Custom('GetFaithTemple')] v [new_capital.GetNameNoTierPossessiveNoTooltip] se stává novým hlavním městem!" # todo: NEW TRANSLATION
