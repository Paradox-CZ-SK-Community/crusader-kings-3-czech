 pam_decision_events.0002.desc.intro: "[my_chaplain.GetTitledFirstName] stojí vedle mě, u oltáře. Měkké sluneční paprsky osvětlují" # todo: NEW TRANSLATION
 pam_decision_events.0002.desc.uncrowned: "mé šaty jako svatý plášť." # todo: NEW TRANSLATION
 pam_decision_events.0002.desc.crowned: "mou korunu jako svatozář." # todo: NEW TRANSLATION
 pam_decision_events.0002.desc.mid: "\n\n"[ROOT.Char.Custom('RandomBibleQuote')].." [my_chaplain.GetHerHis|U] kázání nemá konce" # todo: NEW TRANSLATION
 pam_decision_events.0002.desc.bad: "a já se jen stěží soustředím." # todo: NEW TRANSLATION
 pam_decision_events.0002.desc.good: "a zdá se, že se všichni přítomní soustředí jen na mě." # todo: NEW TRANSLATION
 pam_decision_events.0002.desc.neutral: "a já pátrám mezi přítomnými po tvářích plných úžasu." # todo: NEW TRANSLATION
 pam_decision_events.0002.desc.outro: "\n\n"A náš [ROOT.Char.GetNameNoTooltip], moudrý a ctnostný, nás povede v této zkázyplné době."" # todo: NEW TRANSLATION
 pam_decision_events.0002.a: "Musím k zástupu promluvit sám." # todo: NEW TRANSLATION
