 pam_decision_events.0008.t: "Vymáhání desátků"
 pam_decision_events.0008.desc.intro: "V dosahu mé moci stojí [ROOT.Char.GetFaith.HouseOfWorshipPlural|l], jejichž pokladnice přetékají bohatstvím. Sotva mé stráže vstoupí do chrámů, ozve se cinkot mincí.\n\n"
 pam_decision_events.0008.desc.chaplain: "„Copak [ROOT.Char.GetTitleAsNameNoTooltip|l] nachází potěšení v ponižování služebníků, které [ROOT.Char.GetFaith.HighGodName] povolal?“ kárá mě [chaplain.GetTitledFirstName]. „Dělá ti snad radost obírat [ROOT.Char.GetFaith.HighGodHerHis|l] dům do naha jako #EMP špinavou#! nevěstku?“"
 pam_decision_events.0008.desc.fallback: "[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|U] se znechuceně odvracejí. Zdá se, že [ROOT.Char.GetFaith.HighGodName] má služebníky, kteří se o zlato zajímají až příliš."
 pam_decision_events.0008.a: "Copak štědrost není ctností?"
