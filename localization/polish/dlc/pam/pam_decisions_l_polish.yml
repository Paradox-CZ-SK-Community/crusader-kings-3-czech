 newly_exclaved_duchies_decision: "Panství a vévodské exklávy"
 newly_exclaved_duchies_tooltip: "Kromě [Concept('duchies','vévodství')|E] ve tvém [Concept('realm','panství')|E] získá nové [Concept('kingdom','království')|E] [Concept('de_jure','de iure')|E] nároky také na vévodství, která by se jeho založením stala exklávami: vévodství bez hlavního sídla, jež přestanou sousedit s ostatními vévodstvími svého dosavadního království."
 only_sub_realm_duchies_decision: "Pouze vévodství panství"
 only_sub_realm_duchies_tooltip: "Tvé nové [Concept('kingdom','království')|E] získá [Concept('de_jure','de iure')|E] nároky pouze na [Concept('duchies','vévodství')|E], která držíš nebo zcela ovládáš."
 consecrate_kingdom_exclave_duchies_available_tt: "Existují sousední [Concept('duchies','vévodství')|E], která se mohou stát exklávami v rámci svých [Concept('de_jure','de iure')|E] [Concept('kingdoms','království')|E]"
 newly_exclaved_kingdoms_decision: "Panství a královské exklávy"
 newly_exclaved_kingdoms_tooltip: "Kromě [Concept('kingdoms','království')|E] ve tvém [Concept('realm','panství')|E] získá nová [Concept('empire','říše')|E] [Concept('de_jure','de iure')|E] nároky také na království, která by se jejím založením stala exklávami: království bez hlavního sídla říše, jež přestanou po souši, řece či moři sousedit s ostatními královstvími své dosavadní říše."
 only_sub_realm_kingdoms_decision: "Pouze království panství"
 only_sub_realm_kingdoms_tooltip: "Tvá nová [Concept('empire','říše')|E] získá [Concept('de_jure','de iure')|E] nároky pouze na [Concept('kingdoms','království')|E], která držíš nebo zcela ovládáš."
 consecrate_kingdom_exclave_kingdoms_available_tt: "Existují sousední [Concept('kingdoms','království')|E], která se mohou stát exklávami v rámci svých [Concept('de_jure','de iure')|E] [Concept('empires','říší')|E]"
 consecrate_kingdom_decision: "Posvětit nové království"
 consecrate_kingdom_decision_desc_self: "Je to [ROOT.Char.GetFaith.HighGodName], kdo dosazuje panovníky na trůn, a [ROOT.Char.GetFaith.HighGodNamePossessive|U] hlas nyní promlouvá mými ústy. Mohl by snad existovat vhodnější panovník, který by vládl zemím věřících?"
 consecrate_kingdom_decision_desc: "Je to [ROOT.Char.GetFaith.HighGodName], kdo dosazuje panovníky na trůn. V časech nouze dokáže povýšit i ty nejprostší šlechtice.\n\nTaková chvíle právě nastala. Budu prosit o posvátnou korunu pro svou dosud nekorunovanou hlavu."
 consecrate_kingdom_decision_confirm: "Přijmout královské poslání"
 consecrate_kingdom_decision_tooltip: "Založ nový [Concept('title','titul')|E] na úrovni [Concept('kingdom','království')|E] díky podpoře nejvyšší duchovní autority, nikoli na základě mocenského postavení svého [Concept('realm','panství')|E]"
 consecrate_kingdom_player_warning_tt: "@warning_icon! #X [religious_authority.GetShortUIName|U] [Select_CString(religious_authority.IsLocalPlayer,'můžeš','může')] stále odmítnout posvětit tvé [Concept('kingdom','království')|E], čímž toto [Concept('decision','rozhodnutí')|E] pozbude platnosti!#!"
 consecrated_king_ai_behavior_large_tt: "#EMP #weak Bude jednat zbožněji a spravedlivěji#!#!"
 consecrated_king_modifier: "První z posvěcených panovníků"
 consecrated_king_modifier_small: "$consecrated_king_modifier$"
 consecrated_king_modifier_desc: "Aby tato postava mohla usednout na trůn, bylo založeno posvátné království. Její právo vládnout pochází přímo od božské moci."
 consecrated_king_modifier_small_desc: "$consecrated_king_modifier_desc$"
 pam_decision_events.0030.b.decline: "[religious_authority.GetTitleAsName|U] zavrhuje tvé království"
 pam_decision_events.0030.opening: "Nejsvětější [religious_authority.GetMotherFather|l],"
 pam_decision_events.0030.desc: "[religious_authority.GetFaith.HighGodName|U] povolává jen několik vyvolených, aby jako vznešení strážci ochraňovali [ROOT.Char.GetFaith.GetReligion.Custom('CZ_AdjectiveNoTooltip_ee')|l] děti a jako panovníci spravovali nádherné země, jimiž [ROOT.Char.GetFaith.HighGodName] obdařuje tento svět.\n\nProsím, abych mohl[Select_CString(ROOT.Char.IsFemale,'a','')] sloužit jako jeden z těchto požehnaných vyvolených. Ustanovte království na území [king_aspirant.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] a já je budu bránit před veškerým zlem."
 pam_decision_events.0030.a: "Tímto je posvěceno nové [religious_authority.GetFaith.GetReligion.Custom('CZ_AdjectiveNoTooltip_ee')|l] království."
 pam_decision_events.0030.b: "[religious_authority.GetFaith.HighGodName|U] s tebou nemá takové plány, [king_aspirant.Custom('CZ_FirstNameNoTooltip_V')]..."
 pam_decision_events.0031.t: "[ROOT.Char.GetFaith.Custom('CZ_AdjectiveNoTooltip_ee')|U] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]"
 pam_decision_events.0031.desc.self_crowning: "Která země je požehnanější než [ROOT.Char.GetPrimaryTitle.GetNameNoTier]? Které léno si více zaslouží královské požehnání? Cožpak [ROOT.Char.GetFaith.WarGodName] nechrání zdejší lid před pohromami a nezachovává mé posvátné sídlo v bezpečí jeho hranic?\n\nŘídím se vůlí, kterou zjevuje [ROOT.Char.GetFaith.HighGodName], a proto jsem [Select_CString(ROOT.Char.IsFemale,'posvětila','posvětil')] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')]. [Select_CString(ROOT.Char.IsFemale,'Stala jsem se posvátnou strážkyní','Stal jsem se posvátným strážcem')] této země a nikdo již nebude pohrdat mou vůlí.\n\nVazalové i věřící, hluboce se pokloňte! Zbožní [religious_authority.GetFaith.GetReligion.GetAdherentNamePlural|l] dobře vědí, že [ROOT.Char.GetTitleAsName] si zaslouží jejich úctu."
 pam_decision_events.0031.desc_three_duchies: "Z rozhodnutí [religious_authority.Custom('CZ_TitledFirstNameRegnal_G')] jsou země mého panství uspořádány jako hvězdy předurčené osudem na věčně se otáčející obloze. Vévodství [duchy_1.GetName], [duchy_2.GetName] a [duchy_3.GetName] nyní společně tvoří jediné požehnané [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l].\n\nA tak se spravedlivá duše hodná koruny konečně ujímá vlády. Nyní jsem [ROOT.Char.GetTitleAsName]! Z pověření [religious_authority.Custom('CZ_TitleAsNameNoTooltip_G')] jsem [Select_CString(ROOT.Char.IsFemale,'byla povýšena','byl povýšen')] a od nynějška musím vládnout podle [Select_CString(religious_authority.IsFemale,'jejího','jeho')] vedení."
 pam_decision_events.0031.desc: "Z rozhodnutí [religious_authority.Custom('CZ_TitledFirstNameRegnal_G')] se do letopisů zapisuje jméno nového [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]. [ROOT.Char.GetFaith.PriestNeuterPlural|U] i všechen lid mě s nadšením pozvedají! Dokud si pohané ani kacíři nepodmaní území [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')], budu zde právoplatně vládnout jako [ROOT.Char.GetTitleAsName] ve jménu [CZFaithAdjDecline(ROOT.Char.GetFaith,'é')] víry.\n\n[religious_authority.GetTitleAsNameNoTooltip|U], [Select_CString(religious_authority.IsFemale,'která mi korunu udělila','který mi korunu udělil')], tomuto skromnému panství skutečně [Select_CString(religious_authority.IsFemale,'požehnala','požehnal')]... a nepochybně se bude živě zajímat o mé královské počínání."
 pam_decision_events.0031.a: "Kéž [ROOT.Char.GetFaith.HighGodName] navždy miluje mé [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]!"
 any_landed_duchy_title_tt: "Alespoň jedno [Concept('duchy','vévodství')|E], které držíš, musí představovat [Concept('landed','zeměpanský')|E] [Concept('title','titul')|E] #weak #EMP (nikoli [Concept('clerical_region','církevní oblast')|E] nebo [Concept('noble_family','šlechtickou rodinu')|E])#!#!"
 head_of_faith_tt: "Tvá [Concept('faith','víra')|E] má [Concept('head_of_faith','hlavu víry')|E]"
 custom.every_empire_secular_ruler: "Každý světský [Concept('ruler','vládce')|E] stejné [Concept('faith','víry')|E] v [Concept('de_jure','de iure')|E] [Concept('empire','říši')|E] tvého [Concept('realm','panství')|E]"
 NEW_CREATED_TITLE_NAME_LANDLESS: "[name_title.GetBaseNameNoTierNoTooltip|U]"
 head_of_rite_is_not_lieges_head_of_rite_tt: "Tvá [Concept('head_of_rite','hlava ritu')|E] není zároveň [Concept('head_of_rite','hlavou ritu')|E] tvého [Concept('liege','lenního pána')|E]"
 recipient_head_of_rite_is_not_lieges_head_of_rite_tt: "Jsi [Concept('head_of_rite','hlavou ritu')|E], který [recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer,'vyznáváš','vyznává')], nikoli však hlavou ritu [Concept('liege','lenního pána')|E] této postavy"
 pam_personal_sacrifice_of_wealth_decision: "Obětovat část bohatství"
 pam_personal_sacrifice_of_wealth_decision_desc: "Obětuji část svého bohatství na důkaz oddanosti víře a podpořím tím rozvoj hrabství pod svou ochranou."
 pam_personal_sacrifice_of_wealth_decision_tooltip: "Vynalož [Concept('gold','zlato')|E] na zvýšení [Concept('development_growth','růstu rozvoje')|E] ve vybraném [Concept('county','hrabství')|E] a získej [Concept('spiritual_fulfillment','duchovní naplnění')|E]"
 pam_personal_sacrifice_of_wealth_decision_confirm: "Přinést oběť"
 pam_personal_sacrifice_of_wealth_decision_toast: "Zbožná investice uskutečněna"
 pam_develop_clerical_court_decision: "Vzdělávat dvorní duchovenstvo"
 pam_develop_clerical_court_decision_desc_christian: "Nečinní písaři nejsou hodni poslání, které jim svěřuje [ROOT.Char.GetFaith.HighGodName]. Svolám tedy své služebníky, nechám vysvětit ty, kdo si to zaslouží, vzdělám již vysvěcené a pozvu k sobě nové novice."
 pam_develop_clerical_court_decision_desc: "Od svých služebníků očekává [ROOT.Char.GetFaith.HighGodName] více než pouhou zahálku. Svolám tedy svůj dvůr, povýším ty nejhodnější mezi [Concept('clergy','duchovenstvo')|E], postarám se o vzdělání ostatních a pozvu k sobě nové novice."
 pam_develop_clerical_court_decision_tooltip: "Vysvěcuj, vzdělávej nebo získávej [Concept('clergy','duchovenstvo')|E] pro svůj dvůr"
 pam_develop_clerical_court_decision_confirm: "Svolat své služebníky"
 pam_develop_clerical_court_decision_tt: "Shromáždíš své služebníky a vybereš si #EMP jednu#! z následujících možností:\n$EFFECT_LIST_BULLET$ Až [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] světských [Concept('courtiers','dvořanů')|E] vstoupí mezi [Concept('clergy','duchovenstvo')|E] a každý ti přinese dodatečnou [piety_i][Concept('piety','zbožnost')|E]\n$EFFECT_LIST_BULLET$ Až [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] dvorních duchovních získá [learning_i][Concept('learning','učenost')|E] a [Concept('trait','rys')|E] [GetTrait('lifestyle_scholar').GetName(GetNullCharacter)] nebo [GetTrait('lifestyle_mystic').GetName(GetNullCharacter)], případně [Concept('trait_level_track_xp','zkušenosti rysu')|E]\n$EFFECT_LIST_BULLET$ Až [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] noviců z okolních zemí vstoupí na tvůj dvůr a mezi [Concept('clergy','duchovenstvo')|E]\n\nBez ohledu na svou volbu získáš [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_piety_reward_value')|V0] [piety_i][Concept('piety','zbožnosti')|E]\n\n#weak Odměny se odvíjejí od tvé [Concept('learning','učenosti')|E], [Concept('piety_level','úrovně oddanosti')|E] a náboženských [Concept('traits','rysů')|E]. Občas se může naskytnout i vzácná příležitost#!"
 pam_develop_clerical_court_decision_candidates_tt: "Máš [Concept('courtier','dvořana')|E] vhodného k vysvěcení či vzdělávání, nebo v okolí žije vhodný uchazeč"
 pam_clerical_court_joins_clergy_tt: "Vstoupí mezi [Concept('clergy','duchovenstvo')|E] víry [pam_clerical_patron.GetFaith.GetName]"
 pam_clerical_court_ordain_toast: "[pam_clerical_ordained.GetShortUIName|U] [Select_CString(pam_clerical_ordained.IsLocalPlayer,'vstupuješ','vstupuje')] mezi duchovenstvo"
 pam_clerical_court_instruct_toast: "[pam_clerical_instructed.GetShortUIName|U] [Select_CString(pam_clerical_instructed.IsLocalPlayer,'prohlubuješ','prohlubuje')] svou učenost"
 pam_clerical_court_recruit_toast: "[pam_clerical_novice_current.GetShortUIName|U] [Select_CString(pam_clerical_novice_current.IsLocalPlayer,'odpovídáš','odpovídá')] na povolání"
 pam_oblate_patron_reason: "Proslulý patron noviců"
 pam_oblate_patron_modifier: "Patron noviců"
 pam_oblate_patron_modifier_desc: "Tato postava je proslulá podporou těch, kdo byli povoláni k duchovní službě. Složení řeholních slibů je nyní snazší a rodiče ochotněji svěřují své děti církvi."
 pam_scriptorium_modifier: "Síň písařů"
 pam_scriptorium_modifier_desc: "Tato postava vydržuje síň písařů, jejichž práce přitahuje vzdělané učence do hlavního sídla."
 pam_decision_events.0032.t: "Péče o stádo věřících"
 pam_decision_events.0032.desc.intro.christian: "Obracím se na písaře a duchovní svého dvora a rozhoduji, kdo si zaslouží vysvěcení a kdo ještě potřebuje další vedení."
 pam_decision_events.0032.desc.intro: "Obracím se na ty, kdo na mém dvoře slouží víře [ROOT.Char.GetFaith.GetName]. Kdo by měl vstoupit do jejích služeb a kdo ještě potřebuje vedení?"
 pam_decision_events.0032.desc.pupil: "\n\n[Select_CString(pam_clerical_pupil.IsFemale,'Má žačka','Můj žák')] [pam_clerical_pupil.GetFirstName] stojí pohroužená do modlitby a touží prokázat svou hodnotu."
 pam_decision_events.0032.desc.no_pupil: "\n\nPříliš málo z nich dosud vstoupilo do služeb víry. Tento nedostatek hodlám napravit."
 pam_decision_events.0032.desc.novice: "\n\nZa branami mého dvora prosí [pam_clerical_novice.GetFirstName], [Select_CString(pam_clerical_novice.IsFemale,'nadějná uchazečka','nadějný uchazeč')], o přijetí do služeb víry."
 pam_decision_events.0032.desc.outro.christian: "\n\nJak mám pečovat o stádo, které mi svěřuje [ROOT.Char.GetFaith.HighGodName]?"
 pam_decision_events.0032.desc.outro: "\n\nJak mám vést ty, které mi do péče svěřuje [ROOT.Char.GetFaith.HighGodName]?"
 pam_decision_events.0032.prodigy: "[Select_CString(pam_clerical_pupil.IsFemale,'Má žačka má','Můj žák má')] božský dar!"
 pam_decision_events.0032.oblates: "Ať všichni vědí, že vítám každého, kdo je povolán ke službě."
 pam_decision_events.0032.piety: "Jejich oddanost posiluje mou vlastní."
 pam_decision_events.0032.novice: "Tak nadějná duše! Okamžitě [Select_CString(pam_clerical_novice.IsFemale,'ji','ho')] přijměte."
 pam_decision_events.0032.miracle: "Říká se, že můj [Select_CString(pam_clerical_pupil.IsFemale,'žákyně','žák')] dokáže konat zázraky."
 pam_decision_events.0032.relic.christian: "Tento posvátný text patří do mé pokladnice!"
 pam_decision_events.0032.relic: "Nechť tyto spisy obohatí můj dvůr."
 pam_decision_events.0032.language: "Ať se můj [Select_CString(pam_clerical_pupil.IsFemale,'žačka','žák')] věnuje studiu posvátných textů."
 pam_decision_events.0032.scriptorium.christian: "Ať se ve skriptoriu dá do práce každé brko."
 pam_decision_events.0032.scriptorium: "Ať se všichni písaři mého dvora pustí do práce."
 pam_decision_events.0032.a.christian: "Vysvětit nejhodnější členy svého dvora."
 pam_decision_events.0032.a: "Přijmout nejhodnější členy svého dvora do služeb víry."
 pam_decision_events.0032.a.tt: "Každý z až [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] tvých nejvzdělanějších světských [Concept('courtiers','dvořanů')|E] #weak (včetně příbuzných)#!:\n$EFFECT_LIST_BULLET$ Vstoupí mezi [Concept('clergy','duchovenstvo')|E] víry [pam_clerical_patron.GetFaith.GetName]\n$EFFECT_LIST_BULLET$ Získá [learning_i][Concept('learning','učenost')|E] a zlepší své [Concept('opinion','mínění')|E] o tobě\n$EFFECT_LIST_BULLET$ Přinese ti [piety_i][Concept('piety','zbožnost')|E]"
 pam_decision_events.0032.b: "Vzdělávat duchovenstvo, o které již pečuji."
 pam_decision_events.0032.b.tt: "Každý z až [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] tvých nejvzdělanějších dvorních duchovních:\n$EFFECT_LIST_BULLET$ Získá [learning_i][Concept('learning','učenost')|E] #weak (nejvýše do [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_learning_cap_value')|V0])#!\n$EFFECT_LIST_BULLET$ Získá nebo zdokonalí [Concept('trait','rys')|E] [GetTrait('lifestyle_scholar').GetName(GetNullCharacter)] či [GetTrait('lifestyle_mystic').GetName(GetNullCharacter)]"
 pam_decision_events.0032.c.named: "Přijměte [pam_clerical_novice.Custom('CZ_FirstNameNoTooltip_A')] a rozhlaste, že novicové jsou vítáni."
 pam_decision_events.0032.c: "Rozhlaste, že novicové jsou vítáni."
 pam_decision_events.0032.c.tt: "Každý z až [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] noviců z okolních zemí:\n$EFFECT_LIST_BULLET$ Vstoupí na tvůj dvůr a mezi [Concept('clergy','duchovenstvo')|E] víry [pam_clerical_patron.GetFaith.GetName]\n$EFFECT_LIST_BULLET$ Přijme tvůj [Concept('rite','ritus')|E]"
 pam_seize_capital_clerical_region_decision: "Převzít církevní oblast hlavního sídla"
 pam_seize_capital_clerical_region_decision_desc: "Mé vlastní hlavní sídlo leží v [Concept('clerical_region','církevní oblasti')|E], kterou neovládám. Žádný [Concept('archbishop','arcibiskup')|E] by neměl vládnout území, z něhož spravuji své panství. Tento [Concept('title','titul')|E] právem náleží [Concept('head_of_faith','hlavě víry')|E]."
 pam_seize_capital_clerical_region_decision_tooltip: "Převezmi [Concept('clerical_region','církevní oblast')|E], v níž leží tvé hlavní sídlo, a sesaď jejího [Concept('archbishop','arcibiskupa')|E], pokud je úřad obsazen"
 pam_seize_capital_clerical_region_decision_confirm: "Převzít biskupský stolec"
 pam_seize_capital_clerical_region_decision_deposed_tt: "[pam_deposed_archbishop.GetShortUIName|U] [Select_CString(pam_deposed_archbishop.IsLocalPlayer,'přicházíš','přichází')] o svůj úřad"
 pam_seize_capital_clerical_region_decision_effect_tt: "Získáš [pam_seized_clerical_region.Custom('CZ_LandedName_A')]"
