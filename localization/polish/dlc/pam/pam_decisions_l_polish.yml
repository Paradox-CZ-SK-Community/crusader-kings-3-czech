 pam_decision_last_rites_name_low: "Přijmout poslední pomazání"
 pam_decision_last_rites_desc: "#EMP Kéž se nade mnou [ROOT.Char.GetFaith.HighGodName] smiluje, smyje ze mě veškerou nepravost a očistí mě od hříchu!#!\n\nS blížícím se odchodem z tohoto pozemského života toužím dát svou duši do pořádku. Budu-li ochráněn před pekelnými silami, snad se mi dostane pokojné smrti a věčného života v Království nebeském."
 pam_decision_last_rites_tooltip: "Připrav svou duši na odchod z tohoto světa"
 pam_decision_last_rites_tooltip_sp_effect: "Získáš určité množství [Concept('spiritual_fulfillment','duchovního naplnění')|E] @spiritual_fulfillment_icon!"
 pam_decision_last_rites_confirm: "Shromáždit se u mého lože"
 pam_decision_last_rites_sp_tooltip: "Tvé [Concept('spiritual_fulfillment','duchovní naplnění')|E] dosahuje alespoň #V [EmptyScope.ScriptValue('spiritual_fulfillment_1')|0]#!"
 pam_decision_last_rites_doctrine_tt: "[Concept('faith','Víra')|EU] musí mít [Concept('doctrine','doktrínu')|E] [GetDoctrineType('doctrine_sacraments_central').GetBaseName]"
 pam_decision_events.0005.no_last_rites_warning: "@warning_icon! #X Pokud nepřijmeš poslední svátosti:\n$BULLET_WITH_TAB$Ztratíš [legitimacy_i][EmptyScope.ScriptValue('massive_legitimacy_gain')]\n$BULLET_WITH_TAB$$every_zealot_vassal$:\n$TAB$$BULLET_WITH_TAB$Ztratí #N 30#! bodů [Concept('opinion','mínění')|E] o #V tobě#!#!"
 pam_decision_events.0005.secret_reveal: "@alert_icon! #alert_trial Možná bude nutné odhalit [Concept('secret','tajemství')|E]"
 pam_decision_events.0005.details: "Budeš mít možnost [Concept('lease','pronajmout')|E] [Concept('titles','tituly')|E] [Concept('monastic_holy_orders','mnišským řádům')|E], [Concept('holy_orders','svatým řádům')|E] nebo [Concept('the_christian_church','křesťanské církvi')|E]. Pokud nebudeš mít žádné vhodné tituly, můžeš jim místo toho darovat [Concept('gold','zlato')|E]. Tvůj [Concept('player_heir','hráčský dědic')|E] díky tomu získá prospěšné [Concept('modifiers','modifikátory')|E]."
 pam_decision_events.0005.t: "Poslední svátosti: Má poslední hodina"
 pam_decision_events.0005.desc.healthtrait: "Hřích způsobil, že jsem [death_trait.GetName(soon_dead)|l], a nejspíš tak přivodil mou blížící se smrt."
 pam_decision_events.0005.desc.bad: "Mé skutky ne vždy odpovídaly vůli, již [ROOT.Char.GetFaith.HighGodName] zjevuje. Ve své pýše jsem si navíc [Select_CString(ROOT.Char.IsFemale,'namlouvala','namlouval')], že své hříchy dokážu skrýt před vševidoucím zrakem.\n\n"
 pam_decision_events.0005.desc.good: "Milosrdně se mi dostává útěchy v pocitu, že andělé jsou nablízku a střeží mou duši před démony, kteří by si ji chtěli přivlastnit.\n\n"
 pam_decision_events.0005.desc.neutral: "Ačkoli jsem se snažil žít podle vůle, kterou [ROOT.Char.GetFaith.HighGodName] zjevuje, na prahu věčnosti mě přepadají pochybnosti. Bude má duše shledána hodnou vstupu do Království nebeského?\n\n"
 pam_decision_events.0005.desc.notalone: "Po mém boku je [ROOT.Char.Custom2('PartnerOpinionDescription', SCOPE.sC('fam_or_friend_1'))|l] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('fam_or_friend_1'))|l] [fam_or_friend_1.GetFirstName] spolu s dalšími, kteří se budou modlit za mou duši."
 pam_decision_events.0005.desc.alone: "Třesu se strachy v naprosté samotě. Nablízku není nikdo z mých milovaných, kdo by se modlil za mou duši."
 pam_decision_events.0005.desc.outro: "Můj zpovědník se [Glossary('sakramentářem','SACRAMENTARY_GLOSS')] v ruce mě nabádá: „Předstup beze lsti. [ROOT.Char.GetFaith.HighGodName|U] zná pravdu!“\n\nDokonce i král David, obtížený hříchem, byl po své zpovědi očištěn...[Glossary('$pam_psalm_51_english|q$','PSALM_51_5_GLOSS')]"
 pam_decision_events.0005.a: "Čeká mě svátost pokání."
 pam_decision_events.0005.b: "Ať si mě odnese ďábel! Zbavte mě toho kněze."
 pam_psalm_51_english: "„Proti tobě... jsem zhřešil a učinil, co je zlé... Tvůj rozsudek je spravedlivý a tvůj soud bezúhonný.“"
 SACRAMENTARY_GLOSS: "Sakramentář neboli #EMP liturgikon#! je liturgická kniha používaná při bohoslužbách křesťanskými biskupy a kněžími. Podle doby a oblasti může obsahovat texty určené k předčítání či zpěvu i texty jednotlivých svátostí."
 pam_decision_events.0006.t: "Poslední svátosti: Můj hřích je stále přede mnou"
 pam_decision_events.0006.intro: "„Chybovat je lidské. Bez zpovědi však není odpuštění,“ pronáší [confessor.GetTitledFirstName]."
 pam_decision_events.0006.desc.bad: "\n\nMých hříchů bylo mnoho a byly těžké. Duši mi svírá drtivá tíha viny a pálící prsty Satana, který se již natahuje po tom, co považuje za své právoplatné vlastnictví.\n\n"
 pam_decision_events.0006.desc.good: "\n\nMé srdce je lehké, neboť mé skutky byly v souladu s vůlí Páně.\n\n"
 pam_decision_events.0006.desc.neutral: "\n\nJsem [Select_CString(ROOT.Char.IsFemale,'prostá žena','prostý muž')] a navzdory svým nejlepším úmyslům se ani mně hřích nevyhnul.\n\n"
 pam_decision_events.0006.desc.my_sinful_trait_sin: "Kolikrát mě už na scestí svedlo, že jsem [my_sinful_trait.GetName(soon_dead)|l]!"
 pam_decision_events.0006.desc.secret_sin: "V temnotách vlastní duše jsem [Select_CString(ROOT.Char.IsFemale,'ukrývala','ukrýval')] tajemství: [my_secret.GetName]."
 pam_decision_events.0006.desc.my_criminal_trait_sin: "Snad nejhorší ze všeho je, že jsem [my_criminal_trait.GetName(soon_dead)|l]! Dusivá vina mi bere dech."
 pam_decision_events.0006.desc.sin_default: "Hříchů mám jistě mnoho, ale nyní si na žádný nedokážu vzpomenout. Jakmile se však svěřím [confessor.Custom('CZ_TitledFirstNameNoTooltip_D')], vyvalí se ze mě jako moře přes protrženou hráz."
 pam_decision_events.0006.desc.sin_default_good_sp: "Kéž [ROOT.Char.GetFaith.HighGodName] rozdrtí mé kosti a smaže mé nepravosti."
 pam_decision_events.0006.desc.outro: "Musím se s opravdovou lítostí přiznat ke svým hříchům, jinak mi bude odepřeno svaté přijímání."
 pam_decision_events.0006.a: "„Odpusť mi, [Select_CString(confessor.IsFemale,'matko','otče')]...“"
 pam_decision_events.0006.b: "Některé hříchy by mě měly následovat do hrobu."
 pam_decision_events.0006.b.flavor: "Vyzpovídáš se z některých hříchů, ale zatajíš tajemství, která by mohla usvědčit i jiné."
 pam_decision_events.0007.t: "Poslední svátosti: Tělo, krev a olej"
 pam_decision_events.0007.intro: "Nyní mám za sebou účtování se svými hříchy. Něco jiného je dlužit pouhý haléř a něco jiného deset tisíc talentů.\n\nMůj zpovědník mi podává posvěcený chléb a víno."
 pam_decision_events.0007.desc.bad: "Dokonce i nyní, když přede mnou spočívá tělo a krev Páně, slyším šepot ďáblíků, kteří mě přemlouvají, abych jim odevzdal svou duši. Slibují mi, že budu moci dál žít a oddávat se světským rozkoším.\n\n"
 pam_decision_events.0007.desc.good: "Když jsem se [Select_CString(ROOT.Char.IsFemale,'zbavila','zbavil')] břemene hříchů, vítám smrt s otevřenou náručí. Toužím přijmout tělo a krev Páně, v jehož blízkosti již brzy spočinu.\n\n"
 pam_decision_events.0007.desc.neutral: "Kéž mě tělo a krev Páně ochrání před démony, kteří zde číhají jako vlci a chtějí se mě zmocnit dříve, než nadejde má určená hodina.\n\n"
 pam_decision_events.0007.desc.oil.intro: "[Select_CString(confessor.IsFemale,'Zpovědnice','Zpovědník')] mi poté pomaže čelo, ruce i chodidla svěceným olejem."
 pam_decision_events.0007.desc.oil.bad: "Má duše však zůstává neklidná.\n\n"
 pam_decision_events.0007.desc.oil.good: "Má duše září láskou Páně.\n\n"
 pam_decision_events.0007.desc.oil.neutral: "Má duše se cítí chráněna na své poslední cestě.\n\n"
 pam_decision_events.0007.desc.outro: "Po přijetí [Glossary('viatika','VIATICUM_GLOSS')] a [Glossary('posledního pomazání','UNCTION_GLOSS')] mohu rozhodnout, kdo se za mě bude modlit."
 VIATICUM_GLOSS: "Latinsky „zásoba na cestu“. Viatikum je označení pro svaté přijímání neboli eucharistii podávanou v rámci posledních svátostí. Touto cestou se rozumí přechod člověka do věčného posmrtného života."
 UNCTION_GLOSS: "Poslední pomazání je označení pro pomazání nemocných svěceným olejem, pokud se uděluje #EMP in extremis#!, tedy na prahu smrti. Má člověka připravit na věčný posmrtný život."
 pam_decision_events.0007.a: "Kéž se za mě přimluví [monastic_order.GetName]."
 pam_decision_events.0007.b: "Ať mou podporu získá [military_order.GetName]."
 pam_decision_events.0007.c: "Kéž můj majetek získá [religious_head.GetTitledFirstNameNoTooltip] a já na oplátku [Select_CString(religious_head.IsFemale,'její','jeho')] modlitby."
 pam_decision_events.0007.d: "Zbožná slova určená [confessor.Custom('CZ_TitledFirstNameNoTooltip_D')] postačí."
 pam_last_rites_monastic_order_donation_modifier: "Dar předchůdce mnišskému řádu při posledních svátostech"
 pam_last_rites_military_order_donation_modifier: "Dar předchůdce vojenskému řádu při posledních svátostech"
 pam_last_rites_church_donation_modifier: "Dar předchůdce církvi při posledních svátostech"
