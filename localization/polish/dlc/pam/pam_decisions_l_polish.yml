 pam_decision_events.0018.desc.armed_pilgrimages: "Záležitost jsem stvrdil svou pečetí. Od tohoto dne bude [GetTenetType('tenet_armed_pilgrimages').GetName( hof_scope.GetRite )] jednou ze základních zásad [hof_scope.GetFaith.GetName].\n\nAť všichni vládci víry dbají tohoto varování." # todo: NEW TRANSLATION
 pam_decision_events.0018.desc.struggle_submission: "Záležitost jsem stvrdil svou pečetí. Od tohoto dne bude [GetTenetType('tenet_struggle_submission').GetName( hof_scope.GetRite )] jednou ze základních zásad [hof_scope.GetFaith.GetName].\n\nAť všichni vládci víry dbají tohoto varování." # todo: NEW TRANSLATION
