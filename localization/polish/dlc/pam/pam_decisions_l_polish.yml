 pam_mentor_sp_decision_valid_child_tt: "Musíte mít [child|E], který:\n$BULLET_WITH_TAB$Má stejnou [faith|E] jako vy\n$BULLET_WITH_TAB$Je alespoň #V 16#! let starý\n$BULLET_WITH_TAB$Je buď vaším [primary_heir|E], nebo [favorite_child|E]\n$BULLET_WITH_TAB$Má hodnotu [spiritual_fulfillment|E] nižší než #V 75#!\n$BULLET_WITH_TAB$Dosud neobdržel duchovní vedení" # todo: NEW TRANSLATION
