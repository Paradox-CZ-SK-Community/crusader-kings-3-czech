 pam_rite_heresy_not_mainline_tt: "Nesmí jít o hlavní [Concept('rite','ritus')|E] dané [Concept('faith','víry')|E]"
 pam_rite_heresy_no_antipope_tt: "Tento ritus nesmí vyznávat [Concept('challenger_hof','konkurenční hlava víry')|E] ani žádný z jejích podporovatelů"
 pam_rite_heresy_divergence_tt: "[Concept('rite_divergence','Odlišnost')|EU] od hlavního [Concept('rite','ritu')|E] musí být vyšší než [THIS.ScriptValue('faith_heresy_threshold')|0V]"
