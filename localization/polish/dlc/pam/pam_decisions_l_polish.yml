 pam_bull_events.0003.t: "$pam_bull_events.0001.t$" # todo: NEW TRANSLATION
 pam_bull_events.0003.desc: ""Abych učinil přítrž zlu [heresy_rite.GetName], apoštolskou mocí je všechny odsuzuji jako kacíře a uvaluji na ně věčnou klatbu," # todo: NEW TRANSLATION
 pam_bull_events.0003.desc.heresiarch: "a jejich vůdce [heresiarch.GetTitledFirstName] bude znám jako arcikacíř."" # todo: NEW TRANSLATION
 pam_bull_events.0003.desc.no_heresiarch: "na celá staletí."" # todo: NEW TRANSLATION
