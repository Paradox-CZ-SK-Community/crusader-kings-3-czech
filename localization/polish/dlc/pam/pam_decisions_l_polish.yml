 pam_decision_events.0004.desc: "Po celá léta jsem místo praporu [Select_CString(ROOT.Char.IsFemale,'nosila','nosil')] kněžské roucho. Přesto se mi dostalo hodnosti i moci.\n\nProč by měl můj odkaz zaniknout spolu se mnou jen proto, že jsem se [Select_CString(ROOT.Char.IsFemale,'nenarodila','nenarodil')] do rodu se slavným jménem?"
