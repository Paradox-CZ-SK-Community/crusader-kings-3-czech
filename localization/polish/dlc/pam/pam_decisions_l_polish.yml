 pam_decision_events.0019.t: "Ochránce poutníků"
 pam_decision_events.0019.desc: "Všichni [ROOT.Char.GetFaith.GetAdherentNamePlural|l] nechť slyší má slova:\n\n„Cesty ke svatým místům se staly nebezpečnými. Nechť je všem známo, že věřící smějí během poutí nosit zbraně a bránit se proti těm, kdo jim zastupují cestu do ráje.“"
 pam_decision_events.0019.a: "Ó Pane, dej sílu našim pažím."
 pam_decision_events.0018.opening: "Všichni [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|l] ze všech zemí,"
 pam_decision_events.0018.desc.armed_pilgrimages: "Svou pečetí jsem stvrdil rozhodnutí. Od tohoto dne bude zásada [GetTenetType('tenet_armed_pilgrimages').GetName(hof_scope.GetRite)] patřit mezi základní učení víry [hof_scope.GetFaith.GetName].\n\nNechť si všichni vládci této víry vezmou toto prohlášení k srdci."
 pam_decision_events.0018.desc.struggle_submission: "Svou pečetí jsem stvrdil rozhodnutí. Od tohoto dne bude zásada [GetTenetType('tenet_struggle_submission').GetName(hof_scope.GetRite)] patřit mezi základní učení víry [hof_scope.GetFaith.GetName].\n\nNechť si všichni vládci této víry vezmou toto prohlášení k srdci."
 pam_decision_events.0018.a: "Budiž."
 pam_decision_events.0017.t: "Vztyčení rodového chačkaru"
 pam_decision_events.0017.desc: "Pro kamenný kříž jsem [Select_CString(ROOT.Char.IsFemale,'vybrala','vybral')] vyvýšené místo s výhledem na [khachkar_location.Custom('CZ_LandedNameNoTier_A')].\n\nNechám zkušené kameníky vytvořit skutečně úchvatný památník na počest [khachkar_ancestor.Custom('CZ_TitledFirstNameNicknamed_G')]. Kříž bude zdoben rozetami, ornamenty a nápisem, který připomene, že [khachkar_ancestor.Custom2('RelationToMeShort', ROOT.Char)] [Select_CString(ROOT.Char.IsFemale,'uctila','uctil')] [Select_CString(khachkar_ancestor.IsFemale,'její','jeho')] památku.\n\nNechť se pod ním modlí místní poutníci a každý v něm spatří důkaz našeho právoplatného panství nad touto zemí."
 pam_decision_events.0017.a: "Nechť kříž stojí po celé věky."
 pam_decision_events.0017.b: "Ještě nenadešel správný čas."
