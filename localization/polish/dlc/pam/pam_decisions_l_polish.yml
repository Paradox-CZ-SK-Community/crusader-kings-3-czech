 pam_bull_events.0004.desc.heresy: "Nechť všichni vědí, že ritus [heresy_rite.GetName] byl stižen klatbou a jeho stoupenci jsou nyní považováni za kacíře."
 pam_bull_events.0004.desc.tenet_permitted: "„Všichni, kdo jste přijali zásadu [tenet_scope.GetName(ROOT.GetCharacter.GetRite)], vězte, že je nyní povolena se souhlasem [bull_issuer.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')].“"
