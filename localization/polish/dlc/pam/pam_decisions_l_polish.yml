 pam_declare_rite_heresy_decision_confirm: "Vynést odsouzení" # todo: NEW TRANSLATION
 pam_declare_rite_heresy_decision_valid_tt: "Musí existovat jiný [rite|E] stejné [faith|E], jehož [rite_divergence|E] od hlavního [rite|E] je vyšší než #V [THIS.ScriptValue('faith_heresy_threshold')|0V]#!" # todo: NEW TRANSLATION
 pam_declare_rite_heresy_decision_valid_zealous_tt: "Musí existovat jiný [rite|E] stejné [faith|E], jehož [rite_divergence|E] od hlavního $game_concept_rite$ je vyšší než #V [THIS.ScriptValue('faith_heresy_threshold_times_4_over_5')|0V]#!" # todo: NEW TRANSLATION
 pam_declare_rite_heresy_bull_decision_desc: "Ritus, který se příliš vzdálil pravé cestě, je třeba nazvat pravým jménem.\n\nBude vydána [papal_bull|E], která jej odsoudí jako kacířský." # todo: NEW TRANSLATION
