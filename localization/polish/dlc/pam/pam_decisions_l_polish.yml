 pam_proclaim_living_word_decision: "Vyhlásit živé Slovo" # todo: NEW TRANSLATION
 pam_proclaim_living_word_decision_desc: "Věřící šeptají, že si mě [ROOT.Char.GetFaith.HighGodName] označil. Poutníci vyslovují mé jméno u svatyní podél cest a [ROOT.Char.GetFaith.PriestNeuterPlural] citují mé soudy, jako by šlo o Písmo.\n\nAť se to vyhlásí od každého oltáře: skrze mě se zjevuje živé Slovo." # todo: NEW TRANSLATION
