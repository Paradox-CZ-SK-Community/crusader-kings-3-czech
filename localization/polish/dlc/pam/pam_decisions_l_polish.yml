 pam_decision_events.0010.opening: "[theocratic_ruler.Custom2('AppropriateGreeting', ROOT.Char)]" # todo: NEW TRANSLATION
 pam_decision_events.0010.desc: "Vydal(a) jsem se cestou posvátného uspořádání vlády. Očekává se, že vaše země budou následovat božskou cestu. Taková je vůle [theocratic_ruler.GetFaith.GoodGodNames]." # todo: NEW TRANSLATION
