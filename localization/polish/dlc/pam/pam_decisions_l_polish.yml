 pam_kingdom_of_heaven_decision_hegemony_effect_tt: "Staneš se [Concept('holder','držitelem')|E] [Concept('hegemony','hegemonie')|E] [GetTitleByKey('h_kingdom_of_heaven').Custom('CZ_LandedName_G')]"
 pam_kingdom_of_heaven_decision_vassals_effect_tt: "Nezávislí [Concept('rulers','vládci')|E] tvé [Concept('faith','víry')|E] ti mohou přísahat věrnost. Jejich rozhodnutí závisí na [Concept('piety_level','úrovni oddanosti')|E], [Concept('opinion','mínění')|E] o tobě a na tom, zda vyznávají tvůj [Concept('rite','ritus')|E]"
