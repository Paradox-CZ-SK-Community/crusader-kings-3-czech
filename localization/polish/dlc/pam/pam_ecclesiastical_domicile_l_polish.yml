 pam_estate_interaction_tt_demand_child_as_monk_interaction: "Požaduj, aby ti někdo svěřil [Concept('child','dítě')|E], potomka nebo nezletilého [Concept('courtier','dvořana')|E], o kterého pečuje. Tato osoba získá rys [GetTrait('devoted').GetName(GetNullCharacter)], bude vyřazena z [Concept('succession','nástupnictví')|E] a přidá se mezi tvé [Concept('courtier','dvořany')|E]."
 pam_estate_interaction_tt_demand_church_succession_interaction: "Pokud někdo zemře bez právoplatného dědice, jeho země ti připadnou jako [Concept('fallback_heir','náhradnímu dědici')|E]."
 pam_estate_interaction_tt_demand_divorce_interaction: "Požaduj, aby někdo zapudil svého manžela či manželku, protože jejich sňatek odporuje [Concept('faith','víře')|E] – nebo jej za takový lze alespoň vydávat."
 pam_estate_interaction_tt_ecclesiastic_consecrate_kingdom_interaction: "Ustanov pro někoho nové [Concept('kingdom','království')|E] a získej za to [Concept('hook','páku')|E]."
 pam_estate_interaction_tt_ecclesiastical_bestow_title_interaction: "Využij svou duchovní autoritu a uděl někomu dosud nevytvořený [Concept('title','titul')|E], čímž můžeš zvýšit jeho [Concept('rank','hodnost')|E]."
 pam_estate_interaction_tt_influence_papal_vote_interaction: "Vyvíjej nátlak na [Concept('cardinal','kardinála')|E], aby svůj hlas odevzdal kandidátovi podle tvého výběru."
 pam_estate_interaction_tt_pam_evangelize_personal_tenet_interaction: "Hlásej někomu svou [Concept('personal_tenet','osobní zásadu')|E] a přesvědč jej, aby ji přijal za vlastní."
