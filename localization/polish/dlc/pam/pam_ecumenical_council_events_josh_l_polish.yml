l_polish:
 ecumenical_council_events_josh.0001.t: "Vražda při kompletáři" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0001.desc: "Věřící jsou tak předvídatelní. Zatímco se [murder_target.GetTitledFirstName] modlí při [Glossary( 'Compline', 'COMPLINE_GLOSS' )], číhám ve stínech. \n\n[murder_target.GetHerHis|U] dlouhé modlitby nechávají [murder_target.GetHerHim] bezbranného. Když jsme sami, i jemné roucho — ornát či samet — se může stát oprátkou." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0001.a: "Přitáhnout [murder_target.GetHerHis] ozdoby." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0001.a.tt: "Trochu příliš těsné, aby to bylo pohodlné" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0001.a.tt2: "[murder_target.GetSheHe|U] se mi vytrhne" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0001.a.toast.success: "Vražda se zdařila" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0001.a.toast.failure: "Pokus o vraždu selhal" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0001.a.flavor: "Kdo se tolik modlí, musí být hříšník..." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0001.b: "Ne, ne během posvátného obřadu..." # todo: NEW TRANSLATION
 COMPLINE_GLOSS: "Kompletář je noční modlitba. Jde o poslední modlitbu dne v liturgii hodin, každodenním cyklu modliteb křesťanské tradice." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0010.t: "Oslava svatého" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0010.desc: "Sešlo se duchovenstvo a není větší radosti než oslavovat jednu z našich vůdčích hvězd. Tento měsíc považujeme za nejvhodnější uctít [monthly_saint.GetTitledFirstName].\n\n„Ve jménu [ROOT.Char.GetFaith.HighGodNamePossessive] zasvětíme dnešní bohoslužbu.“" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0010.a: "Zasvětit mši." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0010.b: "Pronesu kázání." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0010.c: "Stačí přidat další žalm nebo hymnus." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0011.t: "Jako hrom" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0011.desc: "Když zdravím hosty, nemohu si nevšimnout [guest_giant.GetTitledFirstName], který díky své obrovité postavě vyčnívá z davu. Když však [guest_giant.GetSheHe] pronese: „Zdravím své druhy, strážce víry“, spatřím jeho skutečný potenciál. \n\nSvým hromovým hlasem by [guest_giant.GetSheHe] mohl být velmi užitečný. Žalmy při [Glossary( 'Vesper', 'VESPER_GLOSS' )] by potřebovaly další bas..." # todo: NEW TRANSLATION, CHECK FORMAT
 ecumenical_council_events_josh.0011.a: "Ať [guest_giant.GetHerHis] hlas zanese naše modlitby k [ROOT.Char.GetFaith.HighGodName]." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0011.a.flavor: "[ROOT.Char.GetFaith.HighGodName] i všichni přítomní jsou ohromeni." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0011.b: "Jeho mohutný hlas by se mi hodil spíš při debatě." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0011.b.tt: "[guest_giant.GetSheHe|U] se stane oporou" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0011.b.tt2: "[guest_giant.GetSheHe|U] se dá věřit, jen když dostane svůj podíl" # todo: NEW TRANSLATION, CHECK FORMAT
 ecumenical_council_events_josh.0011.b.toast.success: "Přesvědčili jste [guest_giant.GetHerHim], aby vás podpořil." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0011.b.toast.failure: "[guest_giant.GetSheHe|U] za svou podporu něco požaduje." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0011.b.flavor: "Když bude [guest_giant.GetTitledFirstName] ve správnou chvíli hlasitě souhlasně vykřikovat, získám navrch." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0011.c: "[guest_giant.GetSheHe|U] je host, ne nástroj." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0011.c.flavor: "Nechme [guest_giant.GetHerHim], ať si mezi námi najde své místo." # todo: NEW TRANSLATION, CHECK FORMAT
 ecumenical_council_events_josh.0011.c.tt: "Nenutíte [guest_giant.GetTitledFirstName] zpívat ve sboru ani se účastnit debaty" # todo: NEW TRANSLATION
 friend_giant_support_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U] se rozhodl podpořit [CHARACTER.GetShortUIName] na ekumenickém koncilu." # todo: NEW TRANSLATION
 VESPER_GLOSS: "Nešpory jsou večerní modlitba. V liturgii hodin, každodenním cyklu modliteb křesťanské tradice, se obvykle konají před večeří." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0012.t: "Biskupský prsten" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0012.desc: "[guest_bishoplover.GetTitledFirstName] a [guest_bishop.GetTitledFirstName] jsou od zahájení koncilu nerozluční. Během [Glossary( 'Laud', 'LAUD_GLOSS' )] dorazí [guest_bishoplover.GetFirstName] pozdě a neupravený — a není to na [guest_bishoplover.GetHerHis] prstu prsten [guest_bishop.GetFirstNamePossessive]? Kývnu na [guest_bishoplover.GetHerHim] a pozvednu obočí.\n\n[guest_bishoplover.GetFirstName] si uvědomí [guest_bishoplover.GetHerHis] chybu, zrudne a zakoktá se:\n\n„Prosím, tohle musí zůstat mezi námi...“" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0012.b: "„Dej mi ten prsten a mlč.“" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0012.c: "„Tohle zůstane mezi mnou, tebou a [ROOT.Char.GetFaith.HighGodName].“" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0012.bishopringname: "Biskupský prsten" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0012.bishopringdesc: "[newly_created_artifact.GetDesc]\n\nViditelný znak apoštolské služby svého nositele." # todo: NEW TRANSLATION
 LAUD_GLOSS: "Laudy jsou jitřní modlitba liturgie hodin, každodenního cyklu modliteb křesťanské tradice." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0013.t: "Módní přečin" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0013.desc: "[fashion_criminal.GetTitledFirstName|U] stojí oděn v přepychu. Má na sobě čerstvě utkané roucho zhotovené pro tuto příležitost, bezpochyby dar od [fashion_criminal.GetHerHis] zbožňujícího stáda. Ze štoly z hedvábí na nás hledí výšivka [ROOT.Char.GetFaith.WealthGodName]. \n\nTa drzost! Porušuje [fashion_criminal.GetSheHe] otevřeně zásady [fashion_criminal.GetFaith.GetName], nebo je to jen marnivý páv?" # todo: NEW TRANSLATION, CHECK FORMAT
 ecumenical_council_events_josh.0013.a: "„Odveďte tu ostudu z mého dohledu.“" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0013.b: "„Zmiz, prokázal ses jako nehodný!“" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0013.b.toast.success: "Dosáhli jste toho, že [fashion_criminal.GetHerHim] vykázali." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0013.b.toast.failure: "[fashion_criminal.GetSheHe|U] na koncilu zůstává." # todo: NEW TRANSLATION
 fashion_criminal_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U] měl na ekumenickém koncilu nevhodné oblečení." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0020.t: "Ohnisko horlivosti" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0020.desc.intro: "„Pohleďte na tento pilíř víry [ROOT.Char.GetFaith.GetName]! Je živoucím důkazem toho, jak spravedliví následují kříž.“ \n\n[host.GetTitledFirstName]" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0020.desc_battle_memory: " tím připomíná, jak [faith_battle_memory.GetDescription]. Proti pohanům je třeba vystoupit na každém kroku. Pozvednu meč a přijmu jeho chválu. „Za věrné!“" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0020.desc.fallback: " tak uznává můj nedávný přínos víře. Když mě vyzdvihne před shromážděným duchovenstvem, hruď se mi pýchou dmě." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0020.a: "„Ve jménu [ROOT.Char.GetFaith.HighGodNamePossessive] zvítězíme!“" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0020.a.flavor: "Mé činy zapůsobily na přítomné duchovenstvo." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0020.b: "Budu se jen kochat slávou." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0021.t: "Ve světle" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0021.desc: "Jak se debata vleče, na podlahu dopadá pruh světla. Vstoupím do něj a náhle se ke mně obrátí všechny oči. \n\nJako by má slova nestačila, božské světlo posiluje mou věc. Můj debatní protivník [council_opponent.GetFirstName] zůstává ve stínu. [council_opponent.GetHerHis|U] argumenty se zdají ještě neprůhlednější." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0021.a: "Využít své výhody proti [council_opponent.GetFirstName]." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0021.a.ct: "[council_opponent.GetShortUINameNoTooltip|U] opustí [ec_conservatives|E] a přidá se k [ec_innovators|E]" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0021.b: "Nechat světlo, ať přesvědčí shromáždění." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0021.b.ct: "Až #V 3#! [ec_conservatives|E] se přidají k [ec_innovators|E]" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0021.c: "Nechat je obdivovat mou nádheru." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0021.c.ct: "Přidat #V 50#! investic do [appointment|E] na [clerical_title|E]" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0022.t: "Sjednoceni ve víře" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0022.desc: "Při obchůzce koncilu [host.GetTitledFirstName|U] spatří příležitost sjednotit [host.GetHerHis] stoupence proti vnějším hrozbám. [host.GetSheHe|U] mě a [alliance_target.GetTitledFirstName] zavolá, abychom před [host.GetHerHim] předstoupili.\n\n„Moji oddaní, stejně jako stojíte pevně ve víře, měli byste držet při sobě i tváří v tvář nepřízni osudu.“" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0022.a: "Ať naši alianci požehná církev." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0022.a.flavor: "Využiji svého zbožného postavení, abych alianci zpečetil." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0022.b: "Alianci založíme na vzájemném porozumění." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0022.b.toast.success: "[alliance_target.GetHerHim|U] s aliancí souhlasí." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0022.b.toast.failure: "[alliance_target.GetSheHe|U] se vaším návrhem cítí uražen." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0022.b.flavor: "Mé okouzlující vystupování jistě postačí." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0022.c: "Koncil není to pravé místo." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0022.c.flavor: "Stačí uctivé poklonění." # todo: NEW TRANSLATION
 alliance_target_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U] odmítl nevhodnou alianci." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0023.t: "Modli se za mě" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0023.desc: "„Milost a pokoj s vámi.“ [host.GetTitledFirstName|U] žehná hostům, jak přicházejí. Můžu využít této chvíle a vrhnout se před tento pilíř víry. Kdybych [host.GetHerHim] přiměl, aby mě zahrnul do svých modliteb [Glossary( 'Laud', 'LAUD_GLOSS' )], jistě bych se přiblížil spáse. \n\n „Uhněte a přestaňte blábolit. Zdržujete frontu.“ [prayer_opponent.GetFirstName|U], který stojí za mnou v řadě, zašeptá." # todo: NEW TRANSLATION, CHECK FORMAT
 ecumenical_council_events_josh.0023.a: "„Štědrý dar, abyste na mě pamatoval ve svých modlitbách.“" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0023.b: "Políbit lem hostitelova ornátu" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0023.b.tt: "Postarám se, aby mou žádost vyslechl" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0023.b.tt2: "Poruším etiketu a odstrčí mě" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0023.b.toast.success: "[host.GetTitledFirstName|U] se za vás bude modlit." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0023.b.toast.failure: "[host.GetTitledFirstName|U] vaši žádost smete ze stolu." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0023.c: "Lepší bude ustoupit a zachovat zbožnost." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0024.t: "Krása tajemství" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0024.desc: "Někteří sem přijeli dychtiví debatovat o posvátných tajemstvích, vymýšlet nové výklady a přít se. [tenet_target_a.GetName] je jedním z nich.\n\n„[tenet_target_a_shareable_tenet.GetName( tenet_target_a.GetRite )]! [tenet_target_a_shareable_tenet.GetName( tenet_target_a.GetRite )], bratři moji. Ctěte tyto zásady, jež nám [ROOT.Char.GetFaith.HighGodName] uložil, hledejte moudrost v této cestě a pochopíte božské!“\n\nHlasy v davu sílí a zase utichají. [tenet_target_b.Custom('FormalComplimentAdjective')] [tenet_target_b.GetTitledFirstName] je mezitím uchvácen neznámým textem. Jediné slovo, které z něj rozpoznám, zní: „[tenet_target_b_shareable_tenet.GetName( tenet_target_b.GetRite )].“" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0024.a: "„Moudrost, říkáš, [tenet_target_a.GetFirstNameNoTooltip]?“" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0024.b: "Ta kniha vypadá velmi zajímavě." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0024.c: "[ROOT.Char.GetFaith.HighGodName] mi už ukázal pravou cestu." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0025.t: "O jednoho teologa navíc" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0025.desc: "Na okraji velkého shromáždění se strhne rozruch. Několik neobvyklých příchozích ze sebe opráší cestovní prach; naši preláti si šeptají, zírají na ně a snaží se je odvést pryč. [theologian.GetWomanMan], který vede cizince, zvolá:\n\n„Urazil jsem dlouhou cestu, abych svědčil za své bratry ve víře, [theologian.GetFaith.GetAdherentNamePlural]. Naši dávní otcové, svatí apoštolové, byli jako bratři. Proč mě tedy mezi sebe nechcete přijmout?“" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0025.a: "Vstupné něco stojí..." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0025.a.flavor: "Snadno [theologian.GetHerHim] dopíšu na konec svého seznamu pozvaných." # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0025.b: "„Vaše učení je ostudné!“" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0025.c: "„Zajímavé. Později uspořádáme vlastní koncil.“" # todo: NEW TRANSLATION
 ecumenical_council_events_josh.0025.d: "Zdvořile [theologian.GetHerHim] vyprovodit." # todo: NEW TRANSLATION
