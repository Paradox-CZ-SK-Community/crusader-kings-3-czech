l_polish:
 ecumenical_council_events_josh.0001.t: "Vražda při kompletáři"
 ecumenical_council_events_josh.0001.desc: "Věřící jsou tak předvídatelní. Zatímco se [murder_target.GetTitledFirstName] sklání k modlitbě při [Glossary('kompletáři','COMPLINE_GLOSS')], číhám ve stínech.\n\nDlouhé modlitby činí [murder_target.Custom('CZ_TitledFirstName_A')] snadným cílem. Až osamíme, i nádherný oděv – kněžské roucho či jemný samet – se může proměnit v oprátku."
 ecumenical_council_events_josh.0001.a: "Nenápadně utáhnu ozdoby kolem krku [murder_target.Custom('CZ_TitledFirstName_G')]."
 ecumenical_council_events_josh.0001.a.tt: "Až nepříjemně těsné"
 ecumenical_council_events_josh.0001.a.tt2: "[murder_target.GetTitledFirstName|U] se mi vytrhne ze sevření"
 ecumenical_council_events_josh.0001.a.toast.success: "Vražda se zdařila"
 ecumenical_council_events_josh.0001.a.toast.failure: "Pokus o vraždu selhal"
 ecumenical_council_events_josh.0001.a.flavor: "Kdo se tolik modlí, musí mít pořádně hříšné svědomí..."
 ecumenical_council_events_josh.0001.b: "Ne, ne při posvátném obřadu..."
 COMPLINE_GLOSS: "Kompletář je modlitba před spaním. Jde o poslední modlitbu dne v liturgii hodin, každodenním cyklu modliteb používaném v křesťanské tradici."
 ecumenical_council_events_josh.0010.t: "Oslava světce"
 ecumenical_council_events_josh.0010.desc: "Duchovenstvo se shromáždilo a nic nás netěší víc než oslava těch, kdo nám byli duchovním vzorem. Tento měsíc je obzvlášť příhodné uctít [monthly_saint.Custom('CZ_TitledFirstName_A')].\n\n„Kéž [ROOT.Char.GetFaith.HighGodName] požehná naší dnešní bohoslužbě!“"
 ecumenical_council_events_josh.0010.a: "Zasvětím tomu mši."
 ecumenical_council_events_josh.0010.b: "Pronesu kázání."
 ecumenical_council_events_josh.0010.c: "Postačí přidat žalm nebo hymnus."
 ecumenical_council_events_josh.0011.t: "Jako hrom"
 ecumenical_council_events_josh.0011.desc: "Když vítám hosty, nemohu si nevšimnout, jak [guest_giant.GetTitledFirstName] vyčnívá z davu svou obrovitou postavou. Teprve když zazní slova „Zdravím vás, drazí strážci víry!“, uvědomím si skutečný potenciál tohoto pozoruhodného hlasu.\n\nTakový hlas, dunící jako hrom, by se nám mohl náramně hodit. Žalmy při [Glossary('nešporách','VESPER_GLOSS')] by snesly další bas..."
 ecumenical_council_events_josh.0011.a: "Ať [ROOT.Char.GetFaith.HighGodName] vyslyší naše modlitby, které [guest_giant.GetTitledFirstName] svým hlasem vynese k nebesům."
 ecumenical_council_events_josh.0011.a.flavor: "I [ROOT.Char.GetFaith.HighGodName] žasne spolu se všemi přítomnými."
 ecumenical_council_events_josh.0011.b: "Raději bych ten mohutný hlas využil při debatě."
 ecumenical_council_events_josh.0011.b.tt: "Na [guest_giant.Custom('CZ_TitledFirstName_A')] se teď mohu spolehnout"
 ecumenical_council_events_josh.0011.b.tt2: "Na [guest_giant.Custom('CZ_TitledFirstName_A')] je spoleh, jen když dostane svůj podíl"
 ecumenical_council_events_josh.0011.b.toast.success: "Podařilo se ti přesvědčit [guest_giant.Custom('CZ_TitledFirstName_A')], aby tě [Select_CString(guest_giant.IsFemale,'podpořila','podpořil')]."
 ecumenical_council_events_josh.0011.b.toast.failure: "[guest_giant.GetTitledFirstName|U] za svou podporu něco požaduje."
 ecumenical_council_events_josh.0011.b.flavor: "Když [guest_giant.GetTitledFirstName] v pravou chvíli hlasitě vyjádří souhlas, získám navrch."
 ecumenical_council_events_josh.0011.c: "[guest_giant.GetTitledFirstName|U] je tu jako [Select_CString(guest_giant.IsFemale,'hostka','host')], ne jako nástroj."
 ecumenical_council_events_josh.0011.c.flavor: "Ať si [guest_giant.GetTitledFirstName] najde mezi námi své vlastní místo."
 ecumenical_council_events_josh.0011.c.tt: "Nebudeš [guest_giant.Custom('CZ_TitledFirstName_A')] nutit do sboru ani do debaty"
 friend_giant_support_at_council_reason: "[CZProDrop(TARGET_CHARACTER,'rozhodla','rozhodl')|U] se na ekumenickém koncilu zastat [CHARACTER.Custom('CZ_ShortUIName_G')]."
 VESPER_GLOSS: "Nešpory jsou večerní modlitba, obvykle pronášená před večeří v rámci liturgie hodin, každodenního cyklu modliteb používaného v křesťanské tradici."
 ecumenical_council_events_josh.0012.t: "Biskupský prsten"
 ecumenical_council_events_josh.0012.desc: "[guest_bishoplover.GetTitledFirstName] a [guest_bishop.GetTitledFirstName] jsou od zahájení koncilu nerozluční. Při [Glossary('ranních chválách','LAUD_GLOSS')] přichází [guest_bishoplover.GetFirstName] pozdě a v neupraveném stavu. A copak to má na prstu? Není to snad [guest_bishop.Custom('CZ_FirstNamePossessive_M')] prsten? Věnuji [guest_bishoplover.Custom('CZ_FirstName_D')] významné kývnutí a povytáhnu obočí.\n\n[guest_bishoplover.GetFirstName] si uvědomí svůj omyl, zrudne a zakoktá se:\n\n„Prosím, tohle musí zůstat mezi námi...“"
 ecumenical_council_events_josh.0012.b: "„Dej mi ten prsten a mlč.“"
 ecumenical_council_events_josh.0012.c: "„Tohle víme jen my. A [ROOT.Char.GetFaith.HighGodName] také.“"
 ecumenical_council_events_josh.0012.bishopringname: "Biskupský prsten"
 ecumenical_council_events_josh.0012.bishopringdesc: "[newly_created_artifact.GetDesc]\n\nViditelné znamení apoštolské služby toho, kdo jej nosí."
 LAUD_GLOSS: "Ranní chvály jsou modlitbou za úsvitu v rámci liturgie hodin, každodenního cyklu modliteb používaného v křesťanské tradici."
 ecumenical_council_events_josh.0013.t: "Prohřešek proti vkusu"
 ecumenical_council_events_josh.0013.desc: "[fashion_criminal.GetTitledFirstName|U] se pyšní nádherným, pro tuto příležitost čerstvě utkaným liturgickým rouchem, patrně darem od svých oddaných věřících. Z hedvábné štoly na mě hledí vyšitý [ROOT.Char.GetFaith.WealthGodName].\n\nTa troufalost! Opravdu si [fashion_criminal.GetTitledFirstName] dovoluje tak otevřeně porušovat zásady, které hlásá [fashion_criminal.GetFaith.GetName], nebo je to jen [Select_CString(fashion_criminal.IsFemale,'marnivá pávice','marnivý páv')]?"
 ecumenical_council_events_josh.0013.a: "„Odstraňte mi tu ostudu z očí!“"
 ecumenical_council_events_josh.0013.b: "„Pryč odsud! [Select_CString(fashion_criminal.IsFemale,'Prokázala','Prokázal')] jsi, že si tuto poctu nezasloužíš!“"
 ecumenical_council_events_josh.0013.b.toast.success: "Podaří se ti [fashion_criminal.Custom('CZ_TitledFirstName_A')] vykázat z koncilu."
 ecumenical_council_events_josh.0013.b.toast.failure: "[fashion_criminal.GetTitledFirstName|U] se přesto na koncilu udrží."
 fashion_criminal_at_council_reason: "[CZProDrop(TARGET_CHARACTER,'měla','měl')|U] na ekumenickém koncilu nevhodný oděv."
 ecumenical_council_events_josh.0020.t: "Maják náboženské horlivosti"
 ecumenical_council_events_josh.0020.desc.intro: "„Pohleďte na tento pilíř víry! [ROOT.Char.GetFaith.GetName|U] má v této osobě pevnou oporu. Takto spravedliví následují kříž!“\n\n[host.GetTitledFirstName|U]"
 ecumenical_council_events_josh.0020.desc_battle_memory: " právě připomíná dobu, kdy [faith_battle_memory.GetDescription]. Pohanským nepřátelům je třeba čelit na každém kroku. Pozvedám meč a s hrdostí přijímám vyslovenou chválu. „Za všechny věrné!“"
 ecumenical_council_events_josh.0020.desc.fallback: " tak oceňuje mé nedávné zásluhy o víru. Když mě vyzdvihne před shromážděným duchovenstvem, hruď se mi málem rozskočí pýchou."
 ecumenical_council_events_josh.0020.a: "„[ROOT.Char.GetFaith.HighGodName|U] nás dovede k vítězství!“"
 ecumenical_council_events_josh.0020.a.flavor: "Mé činy hluboce zapůsobily na přítomné duchovenstvo."
 ecumenical_council_events_josh.0020.b: "Budu se jen vyhřívat na výsluní slávy."
 ecumenical_council_events_josh.0021.t: "V záři světla"
 ecumenical_council_events_josh.0021.desc: "Debata se vleče a na podlahu dopadá úzký paprsek světla. Vstoupím do něj a náhle se ke mně obrátí všechny pohledy.\n\nJako by má slova sama o sobě nestačila, božské světlo dodává mým argumentům ještě větší váhu. Můj protivník v debatě, [council_opponent.GetFirstName], zůstává ve stínu. [Select_CString(council_opponent.IsFemale,'Její','Jeho')] argumenty nyní působí ještě nejasněji."
 ecumenical_council_events_josh.0021.a: "Využiji svou převahu a přitlačím na [council_opponent.Custom('CZ_FirstName_A')]."
 ecumenical_council_events_josh.0021.a.ct: "[council_opponent.GetShortUINameNoTooltip|U] [Select_CString(council_opponent.IsLocalPlayer,'opouštíš','opouští')] [Concept('ec_conservatives','konzervativce')|E] a [Select_CString(council_opponent.IsLocalPlayer,'přidáváš','přidává')] se k [Concept('ec_innovators','novátorům')|E]"
 ecumenical_council_events_josh.0021.b: "Ať světlo přesvědčí celé shromáždění."
 ecumenical_council_events_josh.0021.b.ct: "Až #V 3#! [Concept('ec_conservatives','konzervativci')|E] se přidají k [Concept('ec_innovators','novátorům')|E]"
 ecumenical_council_events_josh.0021.c: "Ať všichni spatří mou velkolepost."
 ecumenical_council_events_josh.0021.c.ct: "Získáš #V 50#! bodů investice do [Concept('appointment','jmenování')|E] na [Concept('clerical_title','duchovní titul')|E]"
 ecumenical_council_events_josh.0022.t: "Sjednoceni ve víře"
 ecumenical_council_events_josh.0022.desc: "Při obcházení účastníků koncilu [host.GetTitledFirstName] spatří příležitost sjednotit své stoupence proti hrozbám zvenčí. Přivolá mě a [alliance_target.Custom('CZ_TitledFirstName_A')], abychom společně předstoupili.\n\n„Mé věrné ovečky, když vás spojuje víra, měli byste stát bok po boku i tváří v tvář protivenstvím.“"
 ecumenical_council_events_josh.0022.a: "Ať našemu spojenectví požehná církev."
 ecumenical_council_events_josh.0022.a.flavor: "Svou pověst zbožného člověka využiji ke zpečetění spojenectví."
 ecumenical_council_events_josh.0022.b: "Naše spojenectví vybudujeme na vzájemném porozumění."
 ecumenical_council_events_josh.0022.b.toast.success: "[alliance_target.GetTitledFirstName|U] se spojenectvím souhlasí."
 ecumenical_council_events_josh.0022.b.toast.failure: "[alliance_target.GetTitledFirstName|U] se tvým návrhem cítí [Select_CString(alliance_target.IsFemale,'dotčená','dotčený')]."
 ecumenical_council_events_josh.0022.b.flavor: "Mé osobní kouzlo a přesvědčivost jistě postačí."
 ecumenical_council_events_josh.0022.c: "Koncil není místem pro takové dohody."
 ecumenical_council_events_josh.0022.c.flavor: "Uctivá úklona zcela postačí."
 alliance_target_at_council_reason: "[CZProDrop(TARGET_CHARACTER,'odmítla','odmítl')|U] nevhodně navržené spojenectví."
 ecumenical_council_events_josh.0023.t: "Pomodli se za mě"
 ecumenical_council_events_josh.0023.desc: "„Milost a pokoj s vámi.“ [host.GetTitledFirstName|U] žehná přicházejícím hostům. Mohu využít této chvíle a vrhnout se před tuto oporu víry. Kdyby na mě [host.GetTitledFirstName] [Select_CString(host.IsFemale,'pamatovala','pamatoval')] při [Glossary('ranních chválách','LAUD_GLOSS')], jistě bych [Select_CString(ROOT.Char.IsFemale,'byla','byl')] o krok blíže ke spáse.\n\n„Uhni a přestaň blábolit. Zdržuješ ostatní,“ šeptá za mnou [prayer_opponent.GetFirstName], další v řadě."
 ecumenical_council_events_josh.0023.a: "„Štědrý dar, pokud na mě budete pamatovat v modlitbách.“"
 ecumenical_council_events_josh.0023.b: "Políbit lem roucha [host.Custom('CZ_TitledFirstName_G')]."
 ecumenical_council_events_josh.0023.b.tt: "Postarám se, aby má prosba byla vyslyšena"
 ecumenical_council_events_josh.0023.b.tt2: "Poruším etiketu a odstrčí mě stranou"
 ecumenical_council_events_josh.0023.b.toast.success: "[host.GetTitledFirstName|U] se za tebe pomodlí."
 ecumenical_council_events_josh.0023.b.toast.failure: "[host.GetTitledFirstName|U] tvou prosbu odbyde."
 ecumenical_council_events_josh.0023.c: "Raději ustoupím a zachovám si zbožnost."
 ecumenical_council_events_josh.0024.t: "Krása posvátných tajemství"
 ecumenical_council_events_josh.0024.desc: "Někteří sem přijeli přímo dychtiví debatovat o posvátných tajemstvích, přicházet s novými výklady a přít se o každé slovo. [tenet_target_a.GetName] k takovým účastníkům rozhodně patří.\n\n„[tenet_target_a_shareable_tenet.GetName(tenet_target_a.GetRite)|U]! [tenet_target_a_shareable_tenet.GetName(tenet_target_a.GetRite)|U], bratři moji! Ctěte tato přikázání, která před nás staví [ROOT.Char.GetFaith.HighGodName], hledejte moudrost na této cestě a poznáte božskou pravdu!“\n\nHlasy v davu sílí a zase utichají. Mezitím [tenet_target_b.GetTitledFirstName] s očividným zaujetím studuje neznámý text. Jindy tolik [tenet_target_b.Custom('FormalComplimentAdjective')|l] vystupování ustoupilo naprostému úžasu. Dokážu rozeznat jen několik slov: „[tenet_target_b_shareable_tenet.GetName(tenet_target_b.GetRite)|U].“"
 ecumenical_council_events_josh.0024.a: "„Moudrost, říkáš, [tenet_target_a.GetFirstNameNoTooltip]?“"
 ecumenical_council_events_josh.0024.b: "Ta kniha vypadá velice zajímavě."
 ecumenical_council_events_josh.0024.c: "[ROOT.Char.GetFaith.HighGodName|U] mi už ukázal pravou cestu."
 ecumenical_council_events_josh.0025.t: "O jednoho teologa navíc"
 ecumenical_council_events_josh.0025.desc: "Na okraji velkého shromáždění se strhne rozruch. Několik neobvyklých příchozích ze sebe opráší prach dlouhé cesty. Naši preláti si mezi sebou šeptají, podezíravě na ně hledí a snaží se nově příchozí odvést stranou. [Select_CString(theologian.IsFemale,'Žena','Muž')] v čele cizinců však hlasitě zvolá:\n\n„Přicházím zdaleka vydat svědectví za své souvěrce! [theologian.GetFaith.GetAdherentNamePlural|U] si přece také zaslouží být vyslyšeni. Naši dávní otcové, svatí apoštolové, si byli jako bratři. Proč tedy nesmím vstoupit mezi vás?“"
 ecumenical_council_events_josh.0025.a: "Vstup nebude zadarmo..."
 ecumenical_council_events_josh.0025.a.flavor: "Stačí [theologian.Custom('CZ_Name_A')] připsat na konec seznamu pozvaných."
 ecumenical_council_events_josh.0025.b: "„Tvé nauky jsou hanebné!“"
 ecumenical_council_events_josh.0025.c: "„Zajímavé. Později uspořádáme vlastní koncil.“"
 ecumenical_council_events_josh.0025.d: "Zdvořile vyprovodit [theologian.Custom('CZ_Name_A')]."
