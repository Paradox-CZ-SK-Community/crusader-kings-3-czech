 ecumenical_council_events.0122.t: "Dokud ještě mohu"
 ecumenical_council_events.0122.desc: "Několik churavých kněží sedí stranou tlačenice v sále a vyhledává sluneční teplo.\n\n„Říkám si, zda ještě uslyším poslední slova tohoto koncilu, než mě povolá [lead_conservative.GetFaith.HighGodName]... a odsoudí mě na místo zvané [lead_conservative.GetFaith.NegativeAfterLife], páchnoucí jeho čerstvými hrůzami,“ sípe [lead_conservative.GetTitledFirstName].\n\n„Už nemáš mnoho co ztratit, [lead_conservative.Custom('CZ_FirstNameNoTooltip_V')], ale jistě ještě můžeš světu nabídnout trochu naděje, abys v blaženosti [Select_CString(lead_conservative.IsFemale,'odešla','odešel')|l] tam, kde tě očekává [lead_innovator.GetFaith.PositiveAfterLife],“ odpovídá [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0122.support: "„[ROOT.Char.GetFaith.HighGodNamePossessive|U] soud, tyto poslední chvíle jsou vzácné!“"
 ecumenical_council_events.0122.support_duel: "Až mě povolá [ROOT.Char.GetFaith.HighGodName], nebudu mít na svědomí mlčení."
 ecumenical_council_events.0122.support_duel.success: "Inspiruje je to k poslednímu reformnímu skutku"
 ecumenical_council_events.0122.support_duel.success_halved: "Některé to inspiruje k poslednímu reformnímu skutku"
 ecumenical_council_events.0122.support_duel.failure: "Budou chřadnout v hořkosti"
 ecumenical_council_events.0122.oppose: "Naši poslední sílu žádá [ROOT.Char.GetFaith.HighGodName] i slovo, které hlásá."
 ecumenical_council_events.0122.oppose_duel: "„Neposkvrňme tím celý svůj život!“"
 ecumenical_council_events.0122.oppose_duel.success: "Okruh stoupenců [lead_innovator.Custom('CZ_TitledFirstNameNoTooltip_G')] ustupuje"
