 ecumenical_council_events.0113.t: "Víra ve zbrani"
 ecumenical_council_events.0113.desc: "Ti, jejichž panství trpí pod náporem zavrženíhodných vír, se stranou jednací síně scházejí ve vzájemném pochopení.\n\n„Zatímco nepřátelé víry pálí má pole,“ prohlašuje [lead_conservative.GetTitledFirstName], „máme se přít o pošetilé sny? Jako by naše srdce neprobodávaly meče?“\n\n„Rozštěpená víra je rozbitý štít,“ odpovídá [lead_innovator.GetTitledFirstName]. „Urovnejme kánon a budeme znovu bojovat jako jeden celek!“"
 ecumenical_council_events.0113.support: "Bylo by dobré znovu okusit naději."
 ecumenical_council_events.0113.support_duel: "Napravme církev, náš štít!"
 ecumenical_council_events.0113.support_duel.success: "Přijímají návrh a budeme bojovat jako jeden celek"
 ecumenical_council_events.0113.support_duel.success_halved: "Někteří se přikloní k reformě"
 ecumenical_council_events.0113.support_duel.failure: "Už si nedokážou vybavit naději"
 ecumenical_council_events.0113.oppose: "Nejsou snad naléhavější otázky než tato pošetilost?"
 ecumenical_council_events.0113.oppose_duel: "Varuji je před touto lehkomyslností."
