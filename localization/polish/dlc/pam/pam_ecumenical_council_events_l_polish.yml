 ecumenical_council_events.0106.t: "Povinná věrnost"
 ecumenical_council_events.0106.desc: "S vazaly se shromažďujeme v jedné z komnat.\n\n„I zde je váš lenní pán vaším pánem,“ varuje ostatní [lead_conservative.GetTitledFirstName]. „Pokud [Select_CString(ROOT.Char.IsFemale,'naše','náš')|l] [ROOT.Char.GetTitleAsName|l] nepodpoří tuto kacířskou novotu, musíte mlčet i vy.“\n\n„[Select_CString(ROOT.Char.IsFemale,'Naše','Náš')|U] [ROOT.Char.GetTitleAsNameNoTooltip|l] nás jinde drží na uzdě. Ale tady ne!“ odsekne [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0106.desc_innovator: "S vazaly se shromažďujeme v jedné z komnat.\n\n„Lenní pán si zaslouží odpověď,“ říká [lead_conservative.GetTitledFirstName]. „Bohužel se obávám, že tato otázka přesahuje [Select_CString(ROOT.Char.IsFemale,'její','jeho')|l] možnosti. Pouze [lead_conservative.GetFaith.HighGodName] vede naše srdce a [lead_conservative.GetFaith.HighGodName] určuje hranici, kterou musíme neochvějně bránit!“\n\n„Ach, ale to, co žádá [Select_CString(ROOT.Char.IsFemale,'naše','náš')|l] [ROOT.Char.GetTitleAsNameNoTooltip|l], neodporuje tomu, co žádá [ROOT.Char.GetFaith.HighGodName],“ odpovídá [lead_innovator.GetTitledFirstName]. „Pamatuj na svou přísahu a dbej [Select_CString(ROOT.Char.IsFemale,'její','jeho')|l] moudrosti!“"
 ecumenical_council_events.0106.support: "„Jako [ROOT.Char.GetTitleAsNameNoTooltip|l] jednám z pověření, které mi dává [ROOT.Char.GetFaith.HighGodName].“"
 ecumenical_council_events.0106.support_duel: "Budu požadovat věrnou službu, kterou tito vazalové přísahali."
