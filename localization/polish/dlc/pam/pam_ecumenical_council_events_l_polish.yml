 ecumenical_council_events.0040.t: "Konec koncilu"
 ecumenical_council_events.0040.desc: "Po náročném jednání se koncil chýlí ke konci."
 ecumenical_council_events.0040.desc.change: "Pod mým vedením změnila víra [ROOT.Char.GetFaith.GetName] své samotné základy. Nyní je třeba tuto požehnanou zprávu zvěstovat prostému lidu!"
 ecumenical_council_events.0040.desc.status_quo: "Žádnou z mnou navržených změn se nepodařilo prosadit. Víra [ROOT.Char.GetFaith.GetName] zůstává beze změny."
 ecumenical_council_events.0040.a: "Je čas vydat se domů."
 ecumenical_council_events.0041.t: "Konec koncilu"
 ecumenical_council_events.0041.desc: "Po náročném jednání se koncil chýlí ke konci."
 ecumenical_council_events.0041.desc.change: "Pod vedením [host.Custom('CZ_Name_G')] změnila víra [host.GetFaith.GetName] své samotné základy. Nyní je třeba tuto zprávu zvěstovat prostému lidu!"
 ecumenical_council_events.0041.desc.status_quo: "[host.GetName|U] [Select_CString(host.IsFemale,'nedokázala','nedokázal')|l] prosadit žádnou ze svých navržených změn. Víra [host.GetFaith.GetName] zůstává beze změny."
 ecumenical_council_events.0041.a: "$ecumenical_council_events.0040.a$"
 ecumenical_council_events.schism_crisis_end: "\n\nKaždá delegace odjíždí domů s jiným výkladem toho, v čem kdo ustoupil a kdo koho zradil. Takto rozdělený dům nemůže stát navěky."
 ecumenical_council_events.0080.t: "Koncil hlasuje"
 ecumenical_council_events.0080.desc.passed: "Hlasy jsou sečteny. [lead_portrait.GetTitledFirstName|U] předstupuje před shromáždění:\n\n„Duch svatý nás vedl celým koncilem a dospěli jsme k rozhodnutí. Věc je vyřešena – návrh se přijímá!“"
 ecumenical_council_events.0080.desc.failed: "Hlasy jsou sečteny. [lead_portrait.GetTitledFirstName|U] předstupuje před shromáždění:\n\n„Duch svatý nás vedl celým koncilem a dospěli jsme k rozhodnutí. Návrh neprošel. Víra [host.GetFaith.GetName] zůstává beze změny.“"
 ecumenical_council_events.0080.desc.outcome.passed: "\n\nZásada [ec_current_topic.GetName( ROOT.GetCharacter.GetRite )] získává status [activity.Custom('GetEcumenicalCouncilCurrentProposal')|l]."
 ecumenical_council_events.0080.desc.outcome.passed.make_core: "\n\nZásada [ec_current_topic.GetName( ROOT.GetCharacter.GetRite )] se stává ústřední a nahrazuje zásadu [core_tenet_to_swap.GetName( ROOT.GetCharacter.GetRite )]."
 ecumenical_council_events.0080.desc.outcome.failed: "\n\nZásada [ec_current_topic.GetName( ROOT.GetCharacter.GetRite )] nezískává status [activity.Custom('GetEcumenicalCouncilCurrentProposal')|l]."
 ecumenical_council_events.0080.a: "Tak bylo rozhodnuto."
 first_debate_resolultion_failed_tt: "Nepodařilo se zásadě [activity.MakeScope.Var('current_topic').TenetType.GetNameNoTooltip( activity.GetHost.GetRite )] přiznat status [activity.Custom('GetEcumenicalCouncilTenet1Proposal')|l]"
 second_debate_resolultion_failed_tt: "Nepodařilo se zásadě [activity.MakeScope.Var('current_topic').TenetType.GetNameNoTooltip( activity.GetHost.GetRite )] přiznat status [activity.Custom('GetEcumenicalCouncilTenet2Proposal')|l]"
 third_debate_resolultion_failed_tt: "Nepodařilo se pro doktrínu [activity.MakeScope.Var('current_topic').DoctrineType.GetGroup.GetName( activity.GetHost.GetFaith )] prosadit návrh [activity.Custom('GetEcumenicalCouncilDoctrine1Proposal')]"
