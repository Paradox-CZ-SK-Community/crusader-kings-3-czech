 ecumenical_council_events.0122.t: "Dokud ještě můžu" # todo: NEW TRANSLATION
 ecumenical_council_events.0122.desc: "Několik neduživých kněží sedí stranou od davu v sále a vyhřívá se na slunci.\n\n„Přemýšlím, zda vyslechnu závěrečná slova tohoto koncilu dřív, než se setkám s [lead_conservative.GetFaith.HighGodName]... a budu tak odsouzen k [lead_conservative.GetFaith.NegativeAfterLife], páchnoucímu jeho čerstvými hrůzami,“ zasípá [lead_conservative.GetTitledFirstName].\n\n„Už toho máte tak málo co ztratit, [lead_conservative.GetFirstNameNoTooltip], ale jistě vám ještě zbývá nějaká naděje, kterou můžete světu nabídnout, abyste mohl blaženě odejít do [lead_innovator.GetFaith.PositiveAfterLife],“ odpoví [lead_innovator.GetTitledFirstName]." # todo: NEW TRANSLATION
 ecumenical_council_events.0122.support: ""Při [ROOT.Char.GetFaith.HighGodName], tyto poslední chvíle jsou vzácné!"" # todo: NEW TRANSLATION
 ecumenical_council_events.0122.support_duel: "Nechci se setkat s [ROOT.Char.GetFaith.HighGodName], aniž bych promluvil." # todo: NEW TRANSLATION
 ecumenical_council_events.0122.support_duel.success: "Inspirují se k poslednímu reformnímu činu" # todo: NEW TRANSLATION
