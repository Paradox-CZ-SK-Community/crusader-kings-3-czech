 msg_ecumenical_council_ruling_desc: "[LEFT_CHARACTER.GetTitledFirstName|U] [Select_CString(LEFT_CHARACTER.IsFemale,'svolala','svolal')|l] [Concept('ecumenical_council','ekumenický koncil')|E] a jeho rozhodnutí nyní zavazují všechny, kdo vyznávají víru [GetPlayer.GetFaith.GetName], přítomné i nepřítomné"
 ecumenical_council_events.0081.t: "Koncil hlasuje"
 ecumenical_council_events.0081.desc.innovator_passed: "My, kdo jsme se zasazovali o změnu, jsme zvítězili. Naše argumenty přesvědčily dostatečnou část koncilu a nový způsob byl přijat."
 ecumenical_council_events.0081.desc.innovator_failed: "Přestože jsme se zasazovali o změnu, při sčítání jsme nezískali dost hlasů. Staré zvyklosti přetrvají a naše argumenty jsou prozatím odloženy."
 ecumenical_council_events.0081.desc.conservative_passed: "Navzdory naší obhajobě tradice získali reformátoři většinu hlasů. Změna byla přijata i přes naše pochybnosti."
 ecumenical_council_events.0081.desc.conservative_failed: "My, kdo jsme hájili tradici, jsme obstáli. Návrh byl zamítnut a náš ritus zachován."
 ecumenical_council_events.0081.desc.neutral: "Koncil vynáší svůj verdikt a věc je uzavřena."
 ecumenical_council_events.0081.a: "Tak bylo rozhodnuto."
 ecumenical_council_events.0082.opening: "Pro [ROOT.GetCharacter.Custom('CZ_TitledFirstName_A')],"
 ecumenical_council_events.0082.desc: "Duchovenstvo se sešlo a přijalo usnesení, které nyní zavazuje nás všechny."
 ecumenical_council_events.0082.desc.unchanged: "Duchovenstvo se sešlo, ale dlouhá rozprava nezměnila ani čárku. Zůstáváme při starém."
 ecumenical_council_events.0082.a: "Církev jedná i beze mě."
 ecumenical_council_events.0082.a.tt.tenet_1: "Zásada [ec_letter_tenet_1.GetName( GetPlayer.GetRite )] nyní získává status [ec_council.Custom('GetEcumenicalCouncilTenet1Proposal')|l]"
