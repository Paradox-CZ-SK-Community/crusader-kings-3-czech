 ecumenical_council_events.0107.t: "Jejich první koncil" # todo: NEW TRANSLATION
 ecumenical_council_events.0107.desc: "Skupinka mladších duchovních si povídá, očividně nadšená z toho, co je pro mnohé z nich prvním koncilem.\n\n"Zde se rodí nové hnutí: cítíte dotek [lead_innovator.GetFaith.HouseholdGodName]? Zanechme v církvi svou stopu s odvahou, která byla dávno zapomenuta!" říká [lead_innovator.GetTitledFirstName].\n\n"Opovrženíhodní blázni! Musíme se řídit církevními otci a odmítnout tyto odporné novoty," trvá na svém [lead_conservative.GetTitledFirstName]." # todo: NEW TRANSLATION
 ecumenical_council_events.0107.support: "Ráno pro víru!" # todo: NEW TRANSLATION
 ecumenical_council_events.0107.support_duel: "Vyvrať tuto zbabělou konzervativnost." # todo: NEW TRANSLATION
 ecumenical_council_events.0107.support_duel.success: "V očích se jim zableskne naděje" # todo: NEW TRANSLATION
 ecumenical_council_events.0107.support_duel.success_halved: "Několik z nich slíbí podporu" # todo: NEW TRANSLATION
 ecumenical_council_events.0107.support_duel.failure: "Zůstávají pohrdaví" # todo: NEW TRANSLATION
 ecumenical_council_events.0107.oppose: "[lead_conservative.GetTitledFirstNameNoTooltip] mluví pravdu." # todo: NEW TRANSLATION
 ecumenical_council_events.0107.oppose_duel: "Varuj před nebezpečím odvahy!" # todo: NEW TRANSLATION
