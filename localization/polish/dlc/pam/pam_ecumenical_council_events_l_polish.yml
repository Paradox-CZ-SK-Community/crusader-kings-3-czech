 ecumenical_council_events.0110.support_duel.failure: "Tvoje chamtivost je zřejmá" # todo: NEW TRANSLATION
 ecumenical_council_events.0110.oppose: "Pýcha předchází pád" # todo: NEW TRANSLATION
 ecumenical_council_events.0110.oppose_duel: "Varuj před zhoubnými následky ambicí!" # todo: NEW TRANSLATION
