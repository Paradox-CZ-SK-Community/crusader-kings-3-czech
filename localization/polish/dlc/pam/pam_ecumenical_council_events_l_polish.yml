 ecumenical_council_events.0111.t: "Reptající šediny"
 ecumenical_council_events.0111.desc: "Šedovlasí starci postávají a hašteří se.\n\n„Viděli jsme přicházet a odcházet koncily a na každém se dělaly chyby. Místo abychom ty zvrácenosti napravili, chceme zřejmě zavést další!“ bručí [lead_conservative.GetTitledFirstName].\n\n„Z tebe mluví jen staré dobytče — [lead_conservative.Custom('RegionalFarmAnimal')|l]! Minule jsi [Select_CString(lead_conservative.IsFemale,'říkala','říkal')|l] totéž a budeš takhle hulákat, dokud neskončíš v hrobě!“ štěkne [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0111.support: "Tato změna napraví staré chyby!"
 ecumenical_council_events.0111.support_duel: "Zopakuji argumenty pro změnu starým uším."
 ecumenical_council_events.0111.support_duel.success: "S reptáním přijímají návrh"
 ecumenical_council_events.0111.support_duel.success_halved: "Někteří přijímají tuto nápravu"
 ecumenical_council_events.0111.support_duel.failure: "Stále volají „Zvrácenost!“"
 ecumenical_council_events.0111.oppose: "Podpořím [lead_conservative.Custom('CZ_TitledFirstNameNoTooltip_A')]: dost dalších pošetilostí."
 ecumenical_council_events.0111.oppose_duel: "Rozdrtím staré snílky v učené rozpravě!"
