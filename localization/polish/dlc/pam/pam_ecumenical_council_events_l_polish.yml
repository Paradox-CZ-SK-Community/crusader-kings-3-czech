 ecumenical_council_events.0101.t: "Učenci promlouvají"
 ecumenical_council_events.0101.desc: "Učenci si přes sál vyměňují citace a každý verš přiostřuje spor.\n\n„[lead_conservative.GetFaith.ReligiousText|U] hovoří jasně,“ trvá na svém [lead_conservative.GetTitledFirstName]. „Zásada [ec_current_topic.GetName( activity.GetHost.GetRite )] má zůstat beze změny.“\n\n„Přečtěte si citovanou pasáž celou,“ odpovídá [lead_innovator.GetTitledFirstName]. „Zjistíte, že na této změně téměř trvá!“"
 ecumenical_council_events.0101.support: "Upozorním na chybějící souvislosti citované pasáže."
 ecumenical_council_events.0101.support_duel: "Překonám je hlubší učeností."
