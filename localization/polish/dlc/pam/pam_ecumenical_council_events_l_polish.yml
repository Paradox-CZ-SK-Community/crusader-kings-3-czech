 ecumenical_council_events.0105.t: "[ROOT.Char.GetCulture.Custom('CZ_AdjectiveNoTooltip_ee')|U] postoje"
 ecumenical_council_events.0105.desc: "Mezi mnoha zdejšími jazyky vyniká povědomý jazyk [ROOT.Char.GetCulture.GetLanguage.GetName]. Samozřejmě že je to [lead_conservative.GetTitledFirstName], kdo dotírá na naše krajany.\n\n„My [lead_conservative.GetCulture.GetCollectiveNounNoTooltip] o takové novoty nestojíme!“ rozčiluje se.\n\n„Ale chceš snad, aby nám bylo kladeno za vinu, že církev přešlapuje na místě?“ namítá [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0105.support: "Nemluvíš za nás všechny, [lead_conservative.Custom('CZ_FirstNameNoTooltip_V')]."
 ecumenical_council_events.0105.support_duel: "My [lead_conservative.GetCulture.GetCollectiveNounNoTooltip] máme dlouhou tradici nových myšlenek."
