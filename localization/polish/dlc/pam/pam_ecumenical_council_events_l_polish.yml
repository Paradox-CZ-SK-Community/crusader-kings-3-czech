 ecumenical_council_events.0126.t: "Mezi soupeři" # todo: NEW TRANSLATION
 ecumenical_council_events.0126.desc: "Najít [rival.GetTitledFirstName], mého [ROOT.Char.Custom2('RelationToMe', rival)], mezi shromážděnými je těžký úkol.\n\n„Jistě víš, proč jsem tady,“ zavrčí [rival.GetSheHe]. „Řekni, co máš na srdci, vyber si stranu... Já jen čekám, až budu moct hlasovat proti tobě.“" # todo: NEW TRANSLATION
 ecumenical_council_events.0126.a: "Hlasuj podle svého svědomí, ne podle nenávisti." # todo: NEW TRANSLATION
 ecumenical_council_events.0126.b: "Nech si svou zášť. Nenechám se jí vyprovokovat." # todo: NEW TRANSLATION
 ecumenical_council_events.0126.c: "Koncil odvádí [rival.GetHerHim] pozornost..." # todo: NEW TRANSLATION
