 ecumenical_council_events.0123.support_duel.failure: "Vaše spojence nelze zastrašovat" # todo: NEW TRANSLATION
 ecumenical_council_events.0123.oppose: ""Tady jste loajální pouze písmu."" # todo: NEW TRANSLATION
