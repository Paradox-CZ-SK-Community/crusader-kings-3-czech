 pam_great_schism_progress_holy_site_tt: "Snížení významu posvátného místa: pokrok směrem k [schism|E] #N +[EmptyScope.ScriptValue('pam_great_schism_progress_holy_site_value')|0]#!" # todo: NEW TRANSLATION
 pam_great_schism_progress_county_conversion_tt: "Posvátné místo přešlo mezi obřady: pokrok směrem k [schism|E] #N +[EmptyScope.ScriptValue('pam_great_schism_progress_county_conversion_value')|0]#!" # todo: NEW TRANSLATION
 pam_great_schism_progress_county_conversion_edge_tt: "Posvátné místo ztracené obřadem rozkolu: pokrok směrem k [schism|E] #N +[EmptyScope.ScriptValue('pam_great_schism_progress_county_conversion_edge_value')|0]#!" # todo: NEW TRANSLATION
 pam_great_schism_progress_rite_conversion_tt: "Vládce přešel mezi obřady: pokrok směrem k [schism|E] #N +[EmptyScope.ScriptValue('pam_great_schism_progress_rite_conversion_value')|0]#!" # todo: NEW TRANSLATION
 pam_ecumenical_council_roman_guests_custom: "Každý host koncilu vyznávající [GetRiteByKey('roman_rite').GetAdherentName]" # todo: NEW TRANSLATION
 pam_ecumenical_council_greek_guests_custom: "Každý host koncilu vyznávající [GetRiteByKey('byzantine_rite').GetAdherentName]" # todo: NEW TRANSLATION
 pam_ecumenical_council_overruled_guests_custom: "Hosté obřadu, proti němuž bylo rozhodnuto — přikázalo se jim, místo aby byli vyslyšeni" # todo: NEW TRANSLATION
 pam_rite_quarrel_championed_opinion: "Na ekumenickém koncilu se postavil na stranu mého obřadu" # todo: NEW TRANSLATION
 pam_rite_quarrel_slighted_opinion: "Na ekumenickém koncilu se postavil na stranu druhého obřadu proti mému" # todo: NEW TRANSLATION
 pam_rite_quarrel_overruled_opinion: "Na ekumenickém koncilu rozhodl proti mému obřadu" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0060.t: "První mezi rovnými" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0060.desc: "[ec_roman_champion.GetTitledFirstName], který mluví za [GetRiteByKey('roman_rite').GetName], se této záležitosti nevzdá:\n\n"Každá církev podléhá Římu a Římu nepodléhá nikdo!"\n\n[ec_greek_champion.GetTitledFirstName] odpočítá na prstech [ec_greek_champion.GetHerHis] pět patriarchů:\n\n"Který z nich kdy poklekl?"" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0060.a: ""Klid, vy oba. Koncil ještě ani nezačal."" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0060.a.success: "Oba diskutující se podaří uklidnit a chaosu je zabráněno" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0060.a.failure: "Ani jeden mě neposlouchá a sál se rozděluje na strany" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0060.b: "Petrovi byly svěřeny klíče a Řím je stále drží." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0060.c: "Řím je první mezi rovnými. Nic víc." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0060.d: "Tento úřad zastávám já. Tím je otázka uzavřena." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0061.t: "I Syna" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0061.desc: ""Dvě slova," začíná [ec_greek_champion.GetTitledFirstName] z [GetRiteByKey('byzantine_rite').GetName]. "Dvě slova, která [GetRiteByKey('roman_rite').GetAdherentNamePlural] přidali do Vyznání víry, aniž by se poradili s Východem."\n\n"Pravda se zodpovídá pouze Bohu," odpovídá [ec_roman_champion.GetTitledFirstName]." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0061.a: "Vyznání víry přežilo i horší věci než spor o jeho znění." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0061.a.success: "Znění je odloženo stranou, než se spor stihne vyhrotit" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0061.a.failure: "Spor na obou stranách přerůstá v otázku nauky" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0061.b: "Tato slova byla přidána, protože jsou pravdivá." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0061.c: "Vyznání víry sepsal koncil. Změnit ho může pouze koncil." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0061.d: "Vyznání víry se zde bude pronášet tak, jak určím." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0062.t: "Chléb na oltáři" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0062.desc: "[ec_roman_champion.GetTitledFirstName] pozvedá oplatku, tenkou a bledou jako pergamen:\n\n"[GetRiteByKey('roman_rite').GetAdherentNamePlural] nikdy nepotřebovali nic víc."\n\n[ec_greek_champion.GetTitledFirstName] vedle ní pokládá nakynutý bochník:\n\n"Takže se [GetRiteByKey('byzantine_rite').GetAdherentNamePlural] mýlili už od dob apoštolů?"" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0062.a: "Zítra požehnám u svého oltáře oběma chlebům a z každého se najíme." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0062.a.success: "Snědí se oba chleby a s nimi i rozepře" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0062.a.failure: "Toho večera se připraví dva oltáře a ulička mezi nimi zůstane prázdná" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0062.b: "Nekvašený, jako při Poslední večeři." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0062.c: "Nakynutý chléb pro vzkříšeného Pána." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0062.d: "Chléb je chléb. Záleží na požehnání." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0063.t: "Otázka jazyka" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0063.desc: "Modlitby se přednášejí latinsky. Lavice [GetRiteByKey('byzantine_rite').GetAdherentNamePlural] čekají na překlad a po jeho zaznění se mračí. [ec_greek_champion.GetTitledFirstName] zamumlá:\n\n"Římané se přou jako právníci. Jen samá slova, žádný obsah."\n\n"Řekové se přou jako filozofové! Nikdy nic nedokázali rozhodnout," odpovídá [ec_roman_champion.GetTitledFirstName]." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0063.a: "Najděme tedy slova, která budou srozumitelná v obou jazycích." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0063.a.success: "Najde se formulace, kterou žádná ze stran nemůže překroutit" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0063.a.failure: "Obě strany odcházejí přesvědčené, že ta druhá jednala ve zlé víře" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0063.b: "Řekněte to latinsky a jasně." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0063.c: "Otcové psali řecky. Zvládneme si to přečíst." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0063.d: "Vydám jej v obou jazycích. Tím je věc uzavřena." # todo: NEW TRANSLATION
