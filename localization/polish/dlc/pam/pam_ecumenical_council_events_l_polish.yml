 pam_ecumenical_council_rite_quarrel_ruled_tt: "Rozhodnutí otázku definitivně uzavírá: pokrok směrem k [schism|E] #N +[EmptyScope.ScriptValue('pam_great_schism_progress_rite_quarrel_overruled_value')|0]#!" # todo: NEW TRANSLATION
