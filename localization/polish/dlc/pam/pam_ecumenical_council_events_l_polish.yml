 ecumenical_council_events.0123.t: "Kdyby brzy přišla válka" # todo: NEW TRANSLATION
 ecumenical_council_events.0123.desc: "Zjišťuji, že se moji spojenci přou, jako by se proti sobě šikovaly oddíly na válečném poli. To je zlé znamení.\n\n„Máme společný jen jeden zájem, zatraceně! Nežádej mě, abych hlasoval, jako bych byl nějaký mazlíček, štěkající pes na vodítku [ROOT.Char.GetTitledFirstName]!“ vyštěkne [lead_conservative.GetTitledFirstName].\n\n„Co si mám myslet o spojenci, který se nehodlá prostými slovy přihlásit k tomu, co [lead_innovator.GetSheHe] přísahal [ROOT.Char.GetPrimaryTitle.GetNameNoTier] na život a na smrt?“ odvětí [lead_innovator.GetTitledFirstName]." # todo: NEW TRANSLATION
 ecumenical_council_events.0123.support: ""Musím se tedy dovolávat veškeré loajality."" # todo: NEW TRANSLATION
 ecumenical_council_events.0123.support_duel: "Varujte, že to považujete za nečestné." # todo: NEW TRANSLATION
 ecumenical_council_events.0123.support_duel.success: "Vaši spojenci při vás budou stát" # todo: NEW TRANSLATION
