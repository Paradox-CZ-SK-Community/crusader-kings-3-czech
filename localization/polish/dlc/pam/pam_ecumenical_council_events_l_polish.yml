 ecumenical_council_events.0114.t: "Ozbrojeni vírou a ocelí" # todo: NEW TRANSLATION
 ecumenical_council_events.0114.desc.intro: "Jak už to u mužů, kteří poznali válku, bývá, staří válečníci mezi námi spolu tráví dlouhé chvíle.\n\n„Při [lead_innovator.GetFaith.HighGodName], bude dobře, až se na těchto změnách shodneme. Věřící se opět mohou sjednotit pod jedním praporem!“ prohlašuje [lead_innovator.GetTitledFirstName]\n\n" # todo: NEW TRANSLATION
 ecumenical_council_events.0114.desc.conservative: "„Pobíjeli jsme už mnoho [ec_hostile_faith.GetAdherentName],“ říká [lead_conservative.GetTitledFirstName]. „Copak [lead_conservative.GetFaith.WarGodName] nežehná našim praporům už nyní?“" # todo: NEW TRANSLATION
 ecumenical_council_events.0114.desc.conservative_generic: "„Pobíjeli jsme už mnoho nepřátel,“ říká [lead_conservative.GetTitledFirstName]. „Copak [lead_conservative.GetFaith.WarGodName] nežehná našim praporům už nyní?“" # todo: NEW TRANSLATION
 ecumenical_council_events.0114.support: "Pozvedněme vysoko nový, požehnaný prapor." # todo: NEW TRANSLATION
 ecumenical_council_events.0114.support_duel: "Naverbuj bojácné pod požehnaný prapor [ROOT.Char.GetFaith.HighGodNamePossessive]!" # todo: NEW TRANSLATION
 ecumenical_council_events.0114.support_duel.success: "Voják musí sloužit" # todo: NEW TRANSLATION
 ecumenical_council_events.0114.support_duel.success_halved: "Několik jich bylo naverbováno" # todo: NEW TRANSLATION
 ecumenical_council_events.0114.support_duel.failure: "Tvrdohlavě drží pozice" # todo: NEW TRANSLATION
 ecumenical_council_events.0114.oppose: "Podpoř [lead_conservative.GetTitledFirstNameNoTooltip], obránce pravověrnosti." # todo: NEW TRANSLATION
 ecumenical_council_events.0114.oppose_duel: "Souboj slov, tedy!" # todo: NEW TRANSLATION
