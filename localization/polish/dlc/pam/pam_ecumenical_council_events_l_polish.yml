 ecumenical_council_events.0115.t: "Šepoty a páka" # todo: NEW TRANSLATION
 ecumenical_council_events.0115.desc: "Ačkoli nerad přiznávám, ne všichni duchovní získali svá roucha čestně. I mezi tímto vznešeným shromážděním si musím dávat dobrý pozor na ty, kdo dávají přednost stínům před čistým světlem Písma. Našeptávání ve tmě není těžké zaslechnout.\n\n„Každá duše zde po něčem... prahne. My moudří bychom se měli ptát, kdo zaplatí cenu za ukojení jejího hladu,“ šeptá [lead_conservative.GetTitledFirstName] ochotným uším. „Drzá ideologie, vášnivá reforma... nic nepřijde dráž...“\n\nDalší zmije, [lead_innovator.GetTitledFirstName], povstane a postaví se [lead_conservative.GetHerHim]: „Myslíš, že cenu za chaos zaplatíš #EMP ty#!? V nadcházejících časech zmatku, kdy si budeme moci počínat, jak se nám zachce...?“" # todo: NEW TRANSLATION
 ecumenical_council_events.0115.support: "Rozvrat se může hodit." # todo: NEW TRANSLATION
 ecumenical_council_events.0115.support_duel: "Promluv o příležitosti k těm, kdo jsou dost chytří, aby naslouchali." # todo: NEW TRANSLATION
 ecumenical_council_events.0115.support_duel.success: "Jejich chamtivost je přiměje přidat se k tobě" # todo: NEW TRANSLATION
 ecumenical_council_events.0115.support_duel.success_halved: "Někteří budou usilovat o rozvrat" # todo: NEW TRANSLATION
 ecumenical_council_events.0115.support_duel.failure: "Ukážou se vůči příležitosti slepí" # todo: NEW TRANSLATION
 ecumenical_council_events.0115.oppose: "Skrovné sousto a pak budeme my [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] navždy hladovět." # todo: NEW TRANSLATION
 ecumenical_council_events.0115.oppose_duel: "Hledej pravdu v Písmu, nebo jsi ztracen." # todo: NEW TRANSLATION
 ecumenical_council_events.0115.oppose_duel.success: "Okruh [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] ustupuje" # todo: NEW TRANSLATION
