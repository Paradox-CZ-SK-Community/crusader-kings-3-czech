 ecumenical_council_events.0103.t: "Cena změny" # todo: NEW TRANSLATION
 ecumenical_council_events.0103.desc: "„Vaše neústupnost nás zahubí!“ vykřikne [lead_innovator.GetTitledFirstName].\n\n„Věřící z [lead_conservative.GetPrimaryTitle.GetNameNoTooltip] by děkovali mecenáši, který by jim obnovil jejich [lead_conservative.Custom('GetFaithTemple')],“ říká [lead_conservative.GetTitledFirstName]." # todo: NEW TRANSLATION
 ecumenical_council_events.0103.support: "Nabídnout mecenášství." # todo: NEW TRANSLATION
 ecumenical_council_events.0103.support_duel: "Vysvětlit, jak může být [lead_conservative.GetHerHis] stádo obohaceno." # todo: NEW TRANSLATION
