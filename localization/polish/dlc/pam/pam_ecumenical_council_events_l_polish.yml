 ecumenical_council_events.0123.t: "Přijde-li brzy válka"
 ecumenical_council_events.0123.desc: "Moji spojenci se hašteří téměř jako oddíly postavené proti sobě na bojišti. To je zlé znamení.\n\n„Máme jen jeden společný zájem, zatraceně! Nechtěj po mně, abych [Select_CString(lead_conservative.IsFemale,'hlasovala','hlasoval')|l] jako nějaký mazlíček, nějaký vyjící pes na vodítku [ROOT.Char.Custom('CZ_TitledFirstName_G')]!“ vyštěkne [lead_conservative.GetTitledFirstName].\n\n„Co si mám myslet o spojenci, který nechce prostými slovy stvrdit to, co [Select_CString(lead_innovator.IsFemale,'ona přísahala','on přísahal')|l] hájit vlastní krví pro [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_A')]?“ odsekne [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0123.support: "„Ano, musím se dovolávat veškeré věrnosti.“"
 ecumenical_council_events.0123.support_duel: "Varuji, že to považuji za potupu."
 ecumenical_council_events.0123.support_duel.success: "Tví spojenci budou stát při tobě"
 ecumenical_council_events.0123.support_duel.success_halved: "Někteří spojenci budou stát při tobě"
 ecumenical_council_events.0123.support_duel.failure: "Tvé spojence nelze zastrašit"
 ecumenical_council_events.0123.oppose: "„Zde jste věrností zavázáni pouze Písmu.“"
 ecumenical_council_events.0123.oppose_duel: "Budu žádat věrnost... od spojenců, jako je [lead_innovator.GetFirstNameNoTooltip]."
