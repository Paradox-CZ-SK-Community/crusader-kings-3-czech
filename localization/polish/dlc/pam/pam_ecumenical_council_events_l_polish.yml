 ecumenical_council_events.0104.t: "Duchovní mé krve"
 ecumenical_council_events.0104.desc: "Duchovní mé krve debatují o tom, na kterou stranu se má přiklonit rod [ROOT.Char.GetHouse.GetName]. [lead_conservative.GetTitledFirstName|U] říká: „Náš rod nesmí působit rozděleně a já se na stranu [host.Custom('CZ_TitledFirstName_G')] nepřidám!“\n\nZa zády [lead_conservative.Custom('CZ_TitledFirstNameNoTooltip_G')] se [lead_innovator.GetTitledFirstName] šklebí; ne celý můj rod odmítá nové myšlenky."
 ecumenical_council_events.0104.support: "Vyzvu rod [ROOT.Char.GetHouse.GetNameNoTooltip], aby návrh podpořil."
 ecumenical_council_events.0104.support_duel: "Získám na svou stranu ty, kdo odmítají nové myšlenky."
