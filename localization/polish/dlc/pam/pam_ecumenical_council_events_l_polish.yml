 ecumenical_council_events.0108.t: "Mezi přáteli" # todo: NEW TRANSLATION
 ecumenical_council_events.0108.desc: "Je útěchou najít ve shromáždění [friend.GetTitledFirstName], mého [ROOT.Char.Custom2('RelationToMe', friend)].\n\n"Jistě víš, na čí straně stojím," řekne [friend.GetSheHe]. "Stačí říct a přidám se k tobě."" # todo: NEW TRANSLATION
 ecumenical_council_events.0108.a: "Stůj při mně, [friend.GetFirstNameNoTooltip]." # todo: NEW TRANSLATION
 ecumenical_council_events.0108.b: "Můžeš se držet vlastního přesvědčení." # todo: NEW TRANSLATION
 ecumenical_council_events.0108.conservatives_custom: "[ec_conservatives|E] mezi tvými [friends|E] (#V [feature_conservatives_size]#!)" # todo: NEW TRANSLATION
 ecumenical_council_events.0108.innovators_custom: "[ec_innovators|E] mezi tvými [friends|E] (#V [feature_innovators_size]#!)" # todo: NEW TRANSLATION
 ecumenical_council_events.0109.t: "Tiché nespokojence" # todo: NEW TRANSLATION
 ecumenical_council_events.0109.desc: "Mimo hlavní jednání se zřejmě schyluje k malé radě. Kdo se snad pokouší přetvořit víru beze mě?\n\n"Jestli lze zpochybnit tuto záležitost, proč ne i všechno ostatní?" varuje [lead_conservative.GetTitledFirstName]. "Ty dveře neotevřu a nevpustím nejistotu do domu [lead_conservative.GetFaith.HighGodName]."\n\n"Netoužíš setřást tradice, které nám už neslouží?" odpovídá [lead_innovator.GetTitledFirstName]." # todo: NEW TRANSLATION
 ecumenical_council_events.0109.support: "Stačí projevit pochopení." # todo: NEW TRANSLATION
 ecumenical_council_events.0109.support_duel: "Vím, jak přimět opatrné naslouchat..." # todo: NEW TRANSLATION
 ecumenical_council_events.0109.support_duel.success: "Nebudou ti stát v cestě" # todo: NEW TRANSLATION
 ecumenical_council_events.0109.support_duel.success_halved: "Někteří tě vyslyší" # todo: NEW TRANSLATION
 ecumenical_council_events.0109.support_duel.failure: "Semknou se proti tobě" # todo: NEW TRANSLATION
 ecumenical_council_events.0109.oppose: "Tiše ty dveře zavři." # todo: NEW TRANSLATION
 ecumenical_council_events.0109.oppose_duel: ""Ty vždycky šíříš chaos, [lead_innovator.GetFirstNameNoTooltip]?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0109.oppose_duel.success: "Nebudou riskovat chaos" # todo: NEW TRANSLATION
