 ecumenical_council_events.0103.t: "Cena změny"
 ecumenical_council_events.0103.desc: "„Vaše neústupnost nás zahubí!“ křičí [lead_innovator.GetTitledFirstName].\n\n„Věřící v [lead_conservative.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_L')] by poděkovali mecenáši, díky němuž se dočká obnovy jejich [lead_conservative.Custom('GetFaithTemple')|l],“ říká [lead_conservative.GetTitledFirstName]."
