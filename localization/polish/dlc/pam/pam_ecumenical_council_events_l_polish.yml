 ecumenical_council_events.0109.t: "Tichá nespokojenost"
 ecumenical_council_events.0109.desc: "Stranou hlavního jednání se zřejmě schází malý koncil. Kdo se snaží přetvořit víru beze mě?\n\n„Pokud lze zpochybnit tuto věc, proč ne všechno ostatní?“ varuje [lead_conservative.GetTitledFirstName]. „Neotevřu ty dveře a nepozvu nejistotu do domu, v němž přebývá [lead_conservative.GetFaith.HighGodName].“\n\n„Netoužíš snad setřást tradice, které nám už neslouží?“ odpovídá [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0109.support: "Stačí je s pochopením vyslechnout."
 ecumenical_council_events.0109.support_duel: "Vím, jak přimět opatrné k naslouchání..."
 ecumenical_council_events.0109.support_duel.success: "Nebudou stát v cestě"
 ecumenical_council_events.0109.support_duel.success_halved: "Někteří tě vyslechnou"
 ecumenical_council_events.0109.support_duel.failure: "Semknou se proti tobě"
 ecumenical_council_events.0109.oppose: "Tiše zavřu ty dveře."
 ecumenical_council_events.0109.oppose_duel: "„Musíš vždy rozsévat chaos, [lead_innovator.Custom('CZ_FirstNameNoTooltip_V')]?“"
 ecumenical_council_events.0109.oppose_duel.success: "Nebudou riskovat chaos"
 ecumenical_council_events.0109.oppose_duel.success_halved: "Někteří odvolají svou podporu"
 ecumenical_council_events.0109.oppose_duel.failure: "Stále si přejí rozkol a zkázu"
