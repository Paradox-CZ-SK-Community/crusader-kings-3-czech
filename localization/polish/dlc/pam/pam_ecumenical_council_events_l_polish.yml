 ecumenical_council_events.0129.t: "Strach v sále"
 ecumenical_council_events.0129.desc: "Ti, kdo se přede mnou třesou, sledují debatu s očima rozechvělýma jako hrudky smetany. Nejponíženější z nich, [lead_conservative.GetTitledFirstName], se mi ani nepodívá do očí.\n\n„Řekni své,“ zašeptá. „Už vím, co se stane, pokud tě odmítnu.“"
 ecumenical_council_events.0129.support: "Krutost mě nikdy nezklamala."
 ecumenical_council_events.0129.support_duel: "Postarám se, aby to věděli i ostatní."
 ecumenical_council_events.0129.support_duel.success: "Strach je přivede na tvou stranu"
 ecumenical_council_events.0129.support_duel.success_halved: "Strach zotročí jen některé"
 ecumenical_council_events.0129.support_duel.failure: "Jejich strach se promění ve vzdor"
 ecumenical_council_events.0129.oppose: "A tak hrůza pohltí naději."
 ecumenical_council_events.0129.oppose_duel: "Nedovolím nikomu, aby mi vzdoroval."
 ecumenical_council_events.0129.oppose_duel.success: "Bázliví se podřídí"
 ecumenical_council_events.0129.oppose_duel.success_halved: "Někteří se podřídí"
