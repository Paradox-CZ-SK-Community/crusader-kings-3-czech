 ecumenical_council_events.0129.t: "Strach v sále" # todo: NEW TRANSLATION
 ecumenical_council_events.0129.desc: "Ti, kdo se přede mnou třesou, sledují debatu očima jako rozechvělé kopečky smetany. Ten nejubožejší z nich, [lead_conservative.GetTitledFirstName], se mi ani nepodívá do očí.\n\n„Řekněte, co máte na srdci,“ zašeptá [lead_conservative.GetSheHe]. „Už vím, co se stane, když vám odmítnu vyhovět.“" # todo: NEW TRANSLATION
 ecumenical_council_events.0129.support: "Krutost mě dosud nikdy nezklamala." # todo: NEW TRANSLATION
 ecumenical_council_events.0129.support_duel: "Postarám se, aby to věděli i ostatní." # todo: NEW TRANSLATION
 ecumenical_council_events.0129.support_duel.success: "Strach je přiměje se vám podřídit" # todo: NEW TRANSLATION
 ecumenical_council_events.0129.support_duel.success_halved: "Strach zotročí jen několik z nich" # todo: NEW TRANSLATION
 ecumenical_council_events.0129.support_duel.failure: "Jejich strach se mění ve vzdor" # todo: NEW TRANSLATION
 ecumenical_council_events.0129.oppose: "A tak hrůza pohltí naději." # todo: NEW TRANSLATION
 ecumenical_council_events.0129.oppose_duel: "Nedovolím nikomu, aby se mi vzepřel." # todo: NEW TRANSLATION
 ecumenical_council_events.0129.oppose_duel.success: "Ti, kdo se bojí, se zařadí" # todo: NEW TRANSLATION
