 ecumenical_council_events.0110.t: "Nesmírné ambice" # todo: NEW TRANSLATION
 ecumenical_council_events.0110.desc: ""Je to jen drobná změna!" říká [lead_innovator.GetTitledFirstName]. "A když ji pomůžeme prosadit, získáme dobrou pověst jako kandidáti na [lead_innovator.GetFaith.ReligiousHeadName]."\n\n"Tvé přehnané ambice tě zaslepují a přivedou nás všechny do záhuby," ušklíbne se [lead_conservative.GetTitledFirstName]." # todo: NEW TRANSLATION
 ecumenical_council_events.0110.support: "Trocha ambicí má své místo" # todo: NEW TRANSLATION
 ecumenical_council_events.0110.support_duel: "Dále argumentuj ve prospěch postupu!" # todo: NEW TRANSLATION
 ecumenical_council_events.0110.support_duel.success: "Přijmou to: jde jen o drobnou změnu" # todo: NEW TRANSLATION
