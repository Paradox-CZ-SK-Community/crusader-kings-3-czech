 ecumenical_council_events.0116.t: "Kdo to zaplatí?" # todo: NEW TRANSLATION
 ecumenical_council_events.0116.desc: "Přistihnu správce několika diecézí, jak se přou o čísla jako lichváři.\n\n„Moje diecéze si nemůže dovolit další převrat,“ říká [lead_conservative.GetTitledFirstName]. „Nové knihy pro každou farnost, poslové ke každému [lead_conservative.GetFaith.HouseOfWorship]. Jestli to projde, desátky na to stačit nebudou.“\n\n„A co když to neprojde?“ ptá se [lead_innovator.GetTitledFirstName]. „Hádáme se už léta a o to stříbro přijdeme, ať hlasujeme jakkoli. Financujme alespoň zákon, kterým se stádo bude řídit.“" # todo: NEW TRANSLATION
 ecumenical_council_events.0116.support: "Ano, proč truchlit nad stříbrem, které už je utracené?" # todo: NEW TRANSLATION
 ecumenical_council_events.0116.support_duel: "Argumentuj takto: podpora je investice!" # todo: NEW TRANSLATION
 ecumenical_council_events.0116.support_duel.success: "Přesvědčí je vidina reformy" # todo: NEW TRANSLATION
 ecumenical_council_events.0116.support_duel.success_halved: "Někteří přijmou tento způsob výkladu" # todo: NEW TRANSLATION
 ecumenical_council_events.0116.support_duel.failure: "Stále naříkají nad výdaji" # todo: NEW TRANSLATION
 ecumenical_council_events.0116.oppose: "Moje diecéze si tento převrat nemůže dovolit." # todo: NEW TRANSLATION
 ecumenical_council_events.0116.oppose_duel: "„Při [ROOT.Char.GetFaith.HighGodName]! To je fiskálně nezodpovědné!“" # todo: NEW TRANSLATION
