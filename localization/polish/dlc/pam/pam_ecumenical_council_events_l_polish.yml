 ecumenical_council_events.0118.t: "Tradice vzdáleného sídla" # todo: NEW TRANSLATION
 ecumenical_council_events.0118.desc: "[lead_conservative.GetTitledFirstName], významný člen koncilu pocházející z [lead_conservative.GetCulture.GetNameNoTooltip], stojí se skupinou dalších duchovních, kteří urazili dlouhou cestu, aby hájili církevní tradice.\n\n„Svět [lead_conservative.GetFaith.GetAdjective] je stejně rozlehlý jako láska [lead_conservative.GetFaith.HighGodName],“ říká [lead_conservative.GetSheHe]. „Doufáme, že jsme tu pouť nepodnikli jen proto, abychom vyslechli, jak [lead_innovator.GetTitledFirstName] káže o zmaření díla církevních otců.“" # todo: NEW TRANSLATION
 ecumenical_council_events.0118.support: "Nejtěžší poutě přinášejí největší zjevení." # todo: NEW TRANSLATION
 ecumenical_council_events.0118.support_duel: "Ujisti je o vizi [lead_innovator.GetFirstNamePossessiveNoTooltip]." # todo: NEW TRANSLATION
 ecumenical_council_events.0118.support_duel.success: "Přijmou, že tradice otců jsou v bezpečí" # todo: NEW TRANSLATION
 ecumenical_council_events.0118.support_duel.success_halved: "Někteří přijmou, že tradice otců jsou v bezpečí" # todo: NEW TRANSLATION
 ecumenical_council_events.0118.support_duel.failure: "Stále se obávají kázání [lead_innovator.GetTitledFirstNamePossessiveNoTooltip]" # todo: NEW TRANSLATION
 ecumenical_council_events.0118.oppose: "„Vzdejme všichni hold vaší oběti.“" # todo: NEW TRANSLATION
