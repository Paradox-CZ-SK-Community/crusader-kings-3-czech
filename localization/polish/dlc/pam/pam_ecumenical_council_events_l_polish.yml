 ecumenical_council_summons_events.0001.t: "Starosti [guest_1.GetTitleAsNameNoTooltip|U]" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0001.desc: ""A ta moje záležitost... při [guest_1.GetFaith.HighGodName], nedá mi pokoj. Sotva můžu spát..." svěřuje se [guest_1.GetTitledFirstName] [guest_2.GetTitledFirstName] bolestným šepotem.\n\n"Chápu..." přikývne [guest_2.GetFirstNameNoTooltip]. "Možná kdybys promluvil s naším hostitelem, [host.GetTitleAsNameNoTooltip], [host.GetSheHe] by ti mohl nabídnout duchovní radu?"" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0001.a: "Co jen může [guest_1.GetHerHim] tolik trápit..." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0001.a.learn_secret_tt: "Dozvíš se o tajemství [guest_1.GetShortUINamePossessive]" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0001.b: "[guest_1.GetFirstNameNoTooltip] potřebuje jen trochu přátelské útěchy." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0001.c: "Lepší nevědět." # todo: NEW TRANSLATION
 friend_comforted_at_council_reason: "[CHARACTER.GetShortUIName|U] utěšil/a [TARGET_CHARACTER.GetShortUIName] ohledně [TARGET_CHARACTER.GetShortUINamePossessive] tajemství na ekumenickém koncilu." # todo: NEW TRANSLATION
