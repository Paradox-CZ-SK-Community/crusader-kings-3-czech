 ecumenical_council_events.0104.t: "Duchovní z mé krve" # todo: NEW TRANSLATION
 ecumenical_council_events.0104.desc: "Duchovní z mého rodu debatují o tom, na kterou stranu by se měl rod [ROOT.Char.GetHouse.GetName] přiklonit. [lead_conservative.GetTitledFirstName] prohlásí: „Náš rod nesmí vypadat rozděleně a já se nepřidám na stranu [host.GetTitledFirstName]!“\n\nZa zády [lead_conservative.GetTitledFirstNamePossessiveNoTooltip] dělá [lead_innovator.GetTitledFirstName] grimasy: ne všichni v mém rodu jsou proti inovaci." # todo: NEW TRANSLATION
 ecumenical_council_events.0104.support: "Vyzvat rod [ROOT.Char.GetHouse.GetNameNoTooltip], aby se postavil na stranu změny." # todo: NEW TRANSLATION
 ecumenical_council_events.0104.support_duel: "Přesvědčit ty, kteří odmítají inovaci." # todo: NEW TRANSLATION
