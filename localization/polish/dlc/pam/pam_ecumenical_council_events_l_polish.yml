 ecumenical_council_events.0113.t: "Víra ve zbrani" # todo: NEW TRANSLATION
 ecumenical_council_events.0113.desc: "Ti, jejichž říše trpí pod náporem bezbožných vyznání, se stranou od sněmovního sálu semknou ve společném soucitu.\n\n„Zatímco nepřátelé víry spalují má pole,“ prohlašuje [lead_conservative.GetTitledFirstName], „máme se přít o pošetilých snech? Jako by nám srdce neprobodávaly meče?“\n\n„Rozštěpené vyznání je zlomený štít,“ odpovídá [lead_innovator.GetTitledFirstName]. „Ustavme kánon a budeme znovu bojovat jako jeden, obnoveni!“" # todo: NEW TRANSLATION
 ecumenical_council_events.0113.support: "Bylo by dobré znovu okusit naději." # todo: NEW TRANSLATION
 ecumenical_council_events.0113.support_duel: "Obnovme církev, náš štít!" # todo: NEW TRANSLATION
 ecumenical_council_events.0113.support_duel.success: "Souhlasí a budeme bojovat jako jeden" # todo: NEW TRANSLATION
 ecumenical_council_events.0113.support_duel.success_halved: "Několik z nich přesvědčí reforma" # todo: NEW TRANSLATION
 ecumenical_council_events.0113.support_duel.failure: "Nedokážou si vzpomenout na naději" # todo: NEW TRANSLATION
 ecumenical_council_events.0113.oppose: "Nemáme naléhavější starosti než tyhle hlouposti?" # todo: NEW TRANSLATION
 ecumenical_council_events.0113.oppose_duel: "Varuj je před touto nerozvážností." # todo: NEW TRANSLATION
