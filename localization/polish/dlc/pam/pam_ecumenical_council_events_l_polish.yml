 ecumenical_council_events.0111.t: "Reptající starci" # todo: NEW TRANSLATION
 ecumenical_council_events.0111.desc: "Šedovlasí starší postávají kolem a hašteří se.\n\n"Zažili jsme už mnoho koncilů a na každém se udělaly chyby. Místo abychom napravili ty zvrácenosti, hodláme jich snad ještě víc zavést!" brblá [lead_conservative.GetTitledFirstName].\n\n"Ty starý [lead_conservative.Custom('RegionalFarmAnimal')]! Totéž jsi říkal minule a budeš to opakovat, dokud neskončíš v hrobě!" odsekne [lead_innovator.GetTitledFirstName]." # todo: NEW TRANSLATION
 ecumenical_council_events.0111.support: "Tato změna napraví staré chyby!" # todo: NEW TRANSLATION
 ecumenical_council_events.0111.support_duel: "Zopakuj argumenty ve prospěch změny pro staré uši." # todo: NEW TRANSLATION
 ecumenical_council_events.0111.support_duel.success: "Nakonec ji s reptáním přijmou" # todo: NEW TRANSLATION
 ecumenical_council_events.0111.support_duel.success_halved: "Někteří tuto nápravu přijmou" # todo: NEW TRANSLATION
 ecumenical_council_events.0111.support_duel.failure: "Stále vykřikují „Zvrácenost!“" # todo: NEW TRANSLATION
 ecumenical_council_events.0111.oppose: "Podpoř [lead_conservative.GetTitledFirstNameNoTooltip]: už žádné pošetilosti." # todo: NEW TRANSLATION
 ecumenical_council_events.0111.oppose_duel: "Rozdrť staré snílky na prach svými argumenty!" # todo: NEW TRANSLATION
