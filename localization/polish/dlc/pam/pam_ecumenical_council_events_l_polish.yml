 ecumenical_council_events.0118.t: "Tradice vzdáleného stolce"
 ecumenical_council_events.0118.desc: "[lead_conservative.GetTitledFirstName|U], [Select_CString(lead_conservative.IsFemale,'významná členka','významný člen')|l] koncilu [lead_conservative.GetCulture.Custom('CZ_AdjectiveNoTooltip_eeho')|l] původu, stojí se skupinou dalších duchovních, kteří vážili dalekou cestu, aby hájili tradice církve.\n\n„[CZFaithAdjDecline(lead_conservative.GetFaith,'ý')|U] svět je stejně rozlehlý jako láska, kterou nám dává [lead_conservative.GetFaith.HighGodName],“ říká. „Doufáme, že tato pouť nebude jen příležitostí poslouchat, jak [lead_innovator.GetTitledFirstName] káže zničení díla církevních otců.“"
 ecumenical_council_events.0118.support: "Nejtěžší poutě přinášejí nejvyšší zjevení."
 ecumenical_council_events.0118.support_duel: "Ujistím je o vizi [lead_innovator.Custom('CZ_FirstNameNoTooltip_G')]."
 ecumenical_council_events.0118.support_duel.success: "Uznávají, že tradicím otců nic nehrozí"
 ecumenical_council_events.0118.support_duel.success_halved: "Někteří uznávají, že tradicím otců nic nehrozí"
 ecumenical_council_events.0118.support_duel.failure: "Stále se obávají kázání [lead_innovator.Custom('CZ_TitledFirstNameNoTooltip_G')]"
 ecumenical_council_events.0118.oppose: "„Vzdejme všichni čest vaší oběti.“"
 ecumenical_council_events.0118.oppose_duel: "„Budu kázat proti [lead_innovator.Custom('CZ_TitledFirstNameNoTooltip_D')].“"
