 ecumenical_council_events.0114.t: "Vyzbrojeni vírou a ocelí"
 ecumenical_council_events.0114.desc.intro: "Jak bývá zvykem mezi lidmi, kteří znají válku, staří válečníci mezi námi tráví dlouhé hodiny společně.\n\n„[lead_innovator.GetFaith.HighGodNamePossessive|U] meč, bude dobré se na těchto změnách shodnout. Věřící se budou moci znovu sjednotit pod jedním praporem!“ míní [lead_innovator.GetTitledFirstName].\n\n"
 ecumenical_council_events.0114.desc.conservative: "„Už teď padl pod našimi meči nejeden nepřítel, který se označuje jako [ec_hostile_faith.GetAdherentName|l],“ říká [lead_conservative.GetTitledFirstName]. „Cožpak našim praporům už nyní nežehná [lead_conservative.GetFaith.WarGodName]?“"
 ecumenical_council_events.0114.desc.conservative_generic: "„Už teď padl pod našimi meči nejeden nepřítel,“ říká [lead_conservative.GetTitledFirstName]. „Cožpak našim praporům už nyní nežehná [lead_conservative.GetFaith.WarGodName]?“"
 ecumenical_council_events.0114.support: "Pozvedněme nový, požehnaný prapor."
 ecumenical_council_events.0114.support_duel: "Získám bázlivé pod prapor, kterému žehná [ROOT.Char.GetFaith.HighGodName]!"
 ecumenical_council_events.0114.support_duel.success: "Voják musí sloužit"
 ecumenical_council_events.0114.support_duel.success_halved: "Některé se podaří získat"
 ecumenical_council_events.0114.support_duel.failure: "Tvrdohlavě drží svou pozici"
 ecumenical_council_events.0114.oppose: "Podpořím [lead_conservative.Custom('CZ_TitledFirstNameNoTooltip_A')], [Select_CString(lead_conservative.IsFemale,'obránkyni','obránce')|l] pravověrnosti."
