 ecumenical_council_events.0102.t: "Soupeřící modlitby"
 ecumenical_council_events.0102.desc: "Nejzbožnější ze shromážděných se kvůli návrhu rozdělili do dvou modlitebních kruhů.\n\n[lead_innovator.GetTitledFirstName|U] prosí, aby [lead_innovator.GetFaith.HighGodName] potvrdil, že jejich zjevení odrážejí jeho vůli. Kruh stoupenců [lead_conservative.Custom('CZ_TitledFirstName_G')] vzápětí odpovídá prosbou, ať [lead_innovator.GetFaith.random_GoodGodNames] zachová tradice, které církvi dlouho sloužily."
