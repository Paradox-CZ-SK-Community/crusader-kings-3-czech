 ecumenical_council_events.0102.t: "Modlitby soupeří" # todo: NEW TRANSLATION
 ecumenical_council_events.0102.desc: "Ti nejzbožnější ze shromážděných se kvůli návrhu rozdělili do dvou modlitebních kruhů.\n\n[lead_innovator.GetTitledFirstName] žádá [lead_innovator.GetFaith.HighGodName], aby potvrdil, že jejich zjevení odrážejí [lead_innovator.GetFaith.HighGodHerHis|U] vůli. Okruh [lead_conservative.GetTitledFirstNamePossessive] jim okamžitě odpovídá a úpěnlivě prosí [lead_innovator.GetFaith.random_GoodGodNames], aby zachoval tradice, které církvi dlouho sloužily." # todo: NEW TRANSLATION
