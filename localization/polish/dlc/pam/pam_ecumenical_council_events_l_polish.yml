 ecumenical_council_events.0105.t: "Zvyklosti kultury [ROOT.Char.GetCulture.GetNameNoTooltip]" # todo: NEW TRANSLATION
 ecumenical_council_events.0105.desc: "Známé zvuky jazyka [ROOT.Char.GetCulture.GetLanguage.GetName] vynikají mezi mnoha jazyky, kterými se zde mluví. Samozřejmě je to [lead_conservative.GetTitledFirstName], kdo peskuje naše soukmenovce.\n\n„My [lead_conservative.GetCulture.GetCollectiveNounNoTooltip] nemáme pro takové inovace pochopení!“ rozohňuje se [lead_conservative.GetSheHe].\n\n„Ale chcete, aby nás vinili z toho, že církev přešlapuje na místě?“ namítne [lead_innovator.GetTitledFirstName]." # todo: NEW TRANSLATION
 ecumenical_council_events.0105.support: "Nemluvíte za nás všechny, [lead_conservative.GetFirstNameNoTooltip]." # todo: NEW TRANSLATION
 ecumenical_council_events.0105.support_duel: "My [lead_conservative.GetCulture.GetCollectiveNounNoTooltip] máme za sebou dějiny inovací." # todo: NEW TRANSLATION
 ecumenical_council_events.0105.support_duel.success: "Všichni přítomní souhlasí, že se postaví na stranu změny" # todo: NEW TRANSLATION
