 ecumenical_council_events.doctrine.t: "Otázka doktríny [ec_debate_topic_3.GetGroup.GetName( ROOT.GetCharacter.GetFaith )]"
 ecumenical_council_events.doctrine.intro: "Posledním zkoumaným tématem je doktrína [ec_debate_topic_3.GetGroup.GetName( ROOT.GetCharacter.GetFaith )]. Současný postoj kanonického práva zní [ec_debate_topic_3.GetDescriptiveName( ROOT.GetCharacter.GetFaith )]. [lead_portrait.GetTitledFirstName|U] zahajuje rozpravu:\n\n"
 ecumenical_council_events.doctrine.chaplain_suggestion: "\n\n„Doktrína [ec_chaplain_pick.GetDescriptiveName( ROOT.GetCharacter.GetFaith )] nejlépe odpovídá potřebám víry [ROOT.Char.GetFaith.GetName],“ radí [court_chaplain.GetName]."
