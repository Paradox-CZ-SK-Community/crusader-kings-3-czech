 ecumenical_council_events.0108.desc: "Je útěchou vidět mezi shromážděnými [friend.Custom('CZ_TitledFirstName_A')]; je to [ROOT.Char.Custom2('RelationToMe', friend)|l].\n\n„Jistě víš, na čí straně stojím,“ říká. „Stačí slovo a půjdu za tebou.“"
