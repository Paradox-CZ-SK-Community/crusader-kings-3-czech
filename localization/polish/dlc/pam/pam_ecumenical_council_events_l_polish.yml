 ecumenical_council_events.0112.t: "Nemoc v panství"
 ecumenical_council_events.0112.desc: "„V mých zemích se kupí mrtví! Zpočátku jsem [Select_CString(lead_conservative.IsFemale,'přemýšlela','přemýšlel')|l], proč nás stíhá [lead_conservative.GetFaith.HighGodNamePossessive] trest, ale teď je to až příliš jasné! Lidstvo trpí, protože náš svět odmítá toto pokřivení kanonického práva,“ říká [lead_conservative.GetTitledFirstName].\n\n„Copak tě nenávist k tomuto koncilu zaslepila natolik, že nevidíš svou spásu?“ odsekne [lead_innovator.GetTitledFirstName]. „Naše reforma způsobí, že se [lead_innovator.GetFaith.HighGodName] přestane hněvat!“"
 ecumenical_council_events.0112.support: "Ano. [ROOT.Char.GetFaith.HighGodName|U] žádá, aby se církev změnila."
 ecumenical_council_events.0112.support_duel: "Použít [Select_CString(lead_conservative.IsFemale,'její','jeho')|l] vlastní logiku proti [Select_CString(lead_conservative.IsFemale,'ní','němu')|l] by mohlo zabrat!"
 ecumenical_council_events.0112.support_duel.success: "Mnozí vidí konec božského hněvu"
 ecumenical_council_events.0112.support_duel.success_halved: "Někteří se pokusí dosáhnout toho, aby se [lead_innovator.GetFaith.HighGodName] usmířil"
 ecumenical_council_events.0112.support_duel.failure: "Ničit kanonické právo je příliš velké riziko"
 ecumenical_council_events.0112.oppose: "Nebo se [ROOT.Char.GetFaith.HighGodName] rozhněvá ještě víc!"
 ecumenical_council_events.0112.oppose_duel: "Varuji, že by to zničilo kanonické právo."
