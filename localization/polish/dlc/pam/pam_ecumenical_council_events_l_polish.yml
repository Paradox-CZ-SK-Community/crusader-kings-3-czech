 ecumenical_council_events.0031.desc.intro: "$ecumenical_council_events.doctrine.intro$"
 ecumenical_council_events.0031.desc.proposal: "„[host.GetTitledFirstName|U] laskavě navrhuje, aby se doktrína [ec_proposed_doctrine.GetDescriptiveName( ROOT.GetCharacter.GetFaith )] stala novou normou.“"
