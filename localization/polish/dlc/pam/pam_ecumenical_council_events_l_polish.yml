 ecumenical_council_events.0117.t: "Příliš mnoho dodatků" # todo: NEW TRANSLATION
 ecumenical_council_events.0117.desc: "Zastihnu dva zkušené vyjednavače, jak do okraje dekretu zapisují změny a škrtají i obnovují jednotlivá ustanovení, jako by šlo o smlouvu.\n\n„Nechte to tak, jak to je! Riskujeme, že polovina z nich odejde ještě předtím, než se dostaneme k ožehavějším otázkám,“ říká [lead_conservative.GetTitledFirstName]. „Strávil jsem měsíce tím, abych ty lidi udržel u jednoho stolu. Zmírněte to, jinak přijdeme o samotný koncil.“\n\n„A nechat po sobě tenhle nepořádek, který po skončení koncilu nikdo nebude vymáhat?“ odpovídá [lead_innovator.GetTitledFirstName]." # todo: NEW TRANSLATION
 ecumenical_council_events.0117.support: "Musíme být přesvědčiví. Musíme být jasní." # todo: NEW TRANSLATION
 ecumenical_council_events.0117.support_duel: "Lepší pevný dekret než tiché nic, ne?" # todo: NEW TRANSLATION
 ecumenical_council_events.0117.support_duel.success: "Přijmou, že zmatečné znění nikdo nebude vymáhat" # todo: NEW TRANSLATION
 ecumenical_council_events.0117.support_duel.success_halved: "Někteří přijmou, že zmatečné znění nikdo nebude vymáhat" # todo: NEW TRANSLATION
 ecumenical_council_events.0117.support_duel.failure: "Stále se bojí, že někoho odradí" # todo: NEW TRANSLATION
 ecumenical_council_events.0117.oppose: "Nemůžeme riskovat, že přijdeme o koncil!" # todo: NEW TRANSLATION
 ecumenical_council_events.0117.oppose_duel: "Tohle je hrubé, to nemůže projít!" # todo: NEW TRANSLATION
