 ecumenical_council_events.0117.t: "Příliš mnoho dodatků"
 ecumenical_council_events.0117.desc: "Dva ostřílení vyjednavači píší na okraj dekretu, škrtají a vracejí jedno ustanovení, jako by šlo o smlouvu.\n\n„Nechme to tak! Hrozí, že polovina z nich odejde ještě dřív, než se dostaneme k ožehavějším otázkám,“ říká [lead_conservative.GetTitledFirstName]. „Celé měsíce je držím u jednoho stolu. Zmírněte to, nebo přijdeme o celý koncil.“\n\n„A ponecháme ten zmatek, který po koncilu nikdo nebude prosazovat?“ odpovídá [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0117.support: "Musíme být přesvědčiví. Musíme být jasní."
 ecumenical_council_events.0117.support_duel: "Lepší pevný dekret než ticho, ne?"
 ecumenical_council_events.0117.support_duel.success: "Uznávají, že zmatečný dekret nikdo nebude prosazovat"
 ecumenical_council_events.0117.support_duel.success_halved: "Někteří uznávají, že zmatečný dekret nikdo nebude prosazovat"
 ecumenical_council_events.0117.support_duel.failure: "Stále se bojí odcizení"
 ecumenical_council_events.0117.oppose: "Nemůžeme riskovat ztrátu koncilu!"
 ecumenical_council_events.0117.oppose_duel: "Je to neotesané, takhle to nemůže projít!"
