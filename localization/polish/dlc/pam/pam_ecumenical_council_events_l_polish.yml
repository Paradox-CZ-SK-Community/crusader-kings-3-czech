 ecumenical_council_events.0115.t: "Šepot a páky"
 ecumenical_council_events.0115.desc: "Ač to přiznávám [Select_CString(ROOT.Char.IsFemale,'nerada','nerad')|l], ne všichni duchovní si své roucho vysloužili čestně. I v tomto vznešeném shromáždění si musím dávat pozor na ty, kdo dávají přednost stínům před čistým světlem Písma. Netrvá dlouho a narazím na šepot v temnotě.\n\n„Každá zdejší duše hladoví po... něčem. My moudří si musíme klást otázku, kdo zaplatí cenu toho hladu,“ našeptává [lead_conservative.GetTitledFirstName] ochotným uším. „Smělá ideologie, vášnivá reforma... nic není dražší...“\n\nDalší zmije, [lead_innovator.GetTitledFirstName], vstává a namítá: „Myslíš si, že cenu chaosu zaplatíš právě #EMP ty#!? V nadcházejícím období nepořádku, kdy si budeme moci hrát, jak se nám zlíbí...?“"
 ecumenical_council_events.0115.support: "Rozvrat má své využití."
 ecumenical_council_events.0115.support_duel: "Promluvím o příležitostech k těm, kdo jsou dost chytří, aby naslouchali."
 ecumenical_council_events.0115.support_duel.success: "Jejich chamtivost je přivede na tvou stranu"
 ecumenical_council_events.0115.support_duel.success_halved: "Někteří budou usilovat o rozvrat"
 ecumenical_council_events.0115.support_duel.failure: "Ukáže se, že příležitosti nevidí"
 ecumenical_council_events.0115.oppose: "Malé sousto a pak budeme my, [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|l], hladovět navždy."
 ecumenical_council_events.0115.oppose_duel: "Hledejte pravdu v Písmu, nebo jste ztraceni."
 ecumenical_council_events.0115.oppose_duel.success: "Okruh stoupenců [lead_innovator.Custom('CZ_TitledFirstNameNoTooltip_G')] ustupuje"
