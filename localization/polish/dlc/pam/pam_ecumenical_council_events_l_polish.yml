 ecumenical_council_events.0112.t: "Nemoc v říši" # todo: NEW TRANSLATION
 ecumenical_council_events.0112.desc: ""Mrtví se v mých zemích vrší do výšky! Zpočátku jsem přemýšlel, čím jsme si zasloužili trest [lead_conservative.GetFaith.HighGodNamePossessive], ale nyní je to až příliš jasné! Lidstvo trpí, protože náš svět odmítá tuto změnu kanonického práva," říká [lead_conservative.GetTitledFirstName].\n\n"Jsi zaslepen svou nenávistí k tomuto koncilu natolik, že nevidíš svou spásu?" odvětí [lead_innovator.GetTitledFirstName]. "Naše reforma usmíří hněv [lead_innovator.GetFaith.HighGodName]!"" # todo: NEW TRANSLATION
 ecumenical_council_events.0112.support: "Ano. [ROOT.Char.GetFaith.HighGodName|U] požaduje, aby se církev změnila." # todo: NEW TRANSLATION
 ecumenical_council_events.0112.support_duel: "Použít logiku toho neústupného proti [lead_conservative.GetHerHim] by mohlo zabrat!" # todo: NEW TRANSLATION
 ecumenical_council_events.0112.support_duel.success: "Mnozí spatřují konec božského hněvu" # todo: NEW TRANSLATION
 ecumenical_council_events.0112.support_duel.success_halved: "Někteří se pokusí usmířit [lead_innovator.GetFaith.HighGodName]" # todo: NEW TRANSLATION
 ecumenical_council_events.0112.support_duel.failure: "Zničit kanonické právo je příliš velké riziko" # todo: NEW TRANSLATION
 ecumenical_council_events.0112.oppose: "Nebo [ROOT.Char.GetFaith.HighGodName] ještě více rozhněváme!" # todo: NEW TRANSLATION
 ecumenical_council_events.0112.oppose_duel: "Varuj, že by to zničilo kanonické právo." # todo: NEW TRANSLATION
