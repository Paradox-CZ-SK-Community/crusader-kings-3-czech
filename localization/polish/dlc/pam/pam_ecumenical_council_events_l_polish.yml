 ecumenical_council_events.0106.t: "Dlužná věrnost" # todo: NEW TRANSLATION
 ecumenical_council_events.0106.desc: "S mými vazaly se scházíme v jedné z komnat.\n\n„I tady je váš lenní pán vaším pánem,“ napomíná ostatní [lead_conservative.GetTitledFirstName]. „Pokud náš [ROOT.Char.GetTitleAsName] nebude mluvit ve prospěch této kacířské inovace, musíte také mlčet.“\n\n„Náš [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] nás drží na uzdě jinde. Ale ne tady!“ odvětí [lead_innovator.GetTitledFirstName]." # todo: NEW TRANSLATION
 ecumenical_council_events.0106.desc_innovator: "S mými vazaly se scházíme v jedné z komnat.\n\n„Lenní pán si zaslouží odpověď,“ říká [lead_conservative.GetTitledFirstName]. „Bohužel se obávám, že tato záležitost může být nad [ROOT.Char.GetHerHim]. Naše srdce vede pouze [lead_conservative.GetFaith.HighGodName] a [lead_conservative.GetFaith.HighGodName] nám neomylně vytyčuje hranici, kterou musíme bránit!“\n\n„Ach, ale přání našeho [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] nejsou v rozporu s vůlí [ROOT.Char.GetFaith.HighGodNamePossessive],“ odpovídá [lead_innovator.GetTitledFirstName]. „Vzpomeňte na svou přísahu a dbejte na [ROOT.Char.GetHerHis] moudrost!“" # todo: NEW TRANSLATION
 ecumenical_council_events.0106.support: ""Jako [ROOT.Char.GetTitleAsNameNoTooltip] jsem zástupcem [ROOT.Char.GetFaith.HighGodName]."" # todo: NEW TRANSLATION
 ecumenical_council_events.0106.support_duel: "Požaduj věrnou službu, kterou tito vazalové přísahali." # todo: NEW TRANSLATION
 ecumenical_council_events.0106.support_duel.success: "Budou tě poslouchat" # todo: NEW TRANSLATION
 ecumenical_council_events.0106.support_duel.success_halved: "Několik z nich souhlasí, že tě bude poslouchat" # todo: NEW TRANSLATION
 ecumenical_council_events.0106.support_duel.failure: "Tvoji vazalové zůstávají věrní [lead_conservative.GetFaith.HighGodName]" # todo: NEW TRANSLATION
 ecumenical_council_events.0106.oppose: "Podpoř [lead_conservative.GetTitledFirstNameNoTooltip]: tohle přesahuje pravomoci lenního pána." # todo: NEW TRANSLATION
 ecumenical_council_events.0106.oppose_duel: "Prohlaš, že přání pána nejsou v rozporu s Bohem." # todo: NEW TRANSLATION
 ecumenical_council_events.0106.oppose_duel.success: "Okruh [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] ustoupí" # todo: NEW TRANSLATION
 ecumenical_council_events.0106.oppose_duel.success_halved: "Několik lidí z okruhu [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] ustoupí" # todo: NEW TRANSLATION
 ecumenical_council_events.0106.oppose_duel.failure: "Trvají na svém" # todo: NEW TRANSLATION
