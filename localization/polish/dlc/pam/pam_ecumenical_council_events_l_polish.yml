 rival_eavesdropped_on_secret_reason_corresponding: "[CHARACTER.GetShortUIName|U] přistihl/a [TARGET_CHARACTER.GetShortUIName] při pokusu slídit po [CHARACTER.GetHerHis] tajemství na koncilu." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0010.t: "Tajemství" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0010.desc: "Náš hostitel [host.GetTitledFirstName] si zřejmě nevšímá mé přítomnosti, zatímco služebník [host.GetSheHe] pomáhá upravit [host.GetHerHis] roucho.\n\n"[host.GetFaith.HighGodName], odpusť mi..." zamumlá [host.GetSheHe]. "Ty zvěsti o mých... sklonech. Představa, že bych já, Kristův náměstek, podléhal takovým choutkám! Ty zvěsti se nikdy nesmějí dostat ke mým kardinálům."" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0010.a: ""Vidím, že činíš pokání, [host.GetTitleAsNameNoTooltip]."" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0010.a.learn_secret_tt: "Dozvídáš se o tajemství [host.GetShortUINamePossessive]" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0010.b: ""[ROOT.Char.Custom('RandomBibleQuoteShort')]"" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0010.b.flavor: "[host.GetSheHe|U] nalezne útěchu v Písmu!" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0010.c: "Některé věci je lepší nevědět." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0020.t: "Potíže se zásobováním" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0020.desc.intro: ""Jestli to tak musí být..." [host.GetTitledFirstName] gestem propouští jednoho z kněží.\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip]!" [host.GetSheHe|U] na sebe upoutává mou pozornost." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0020.desc.caravans: ""Karavany převážející naše zásoby ještě nedorazily." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0020.desc.servants: ""Prostě nemáme dostatek služebnictva, které by se postaralo o všechny naše hosty." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0020.desc.overcrowded: ""Ubytování v [ROOT.Char.GetCurrentLocation.GetName], které jsme pro náš koncil zajistili, jednoduše nestačí pro tolik hostů." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0020.desc.outro: "Nenapadá vás nějaké řešení našich potíží?"" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0020.aaa: ""Tohle jsou mé země, Vaše Svatosti. Postarám se o to."" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0020.aa: "Znám #EMP spoustu#! lidí, kteří mi něco dluží..." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0020.a: ""Zlato spraví všechno, Vaše Svatosti!"" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0020.b: ""Využiji všechny své známosti!"" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0020.b.flavor: "[host.GetShortUIName] si mě zapamatuje jako vlivného kandidáta..." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0020.c: "Mohu nabídnout jen skromnou modlitbu..." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0020.papabile_tt: "Vaše [papabile_score|E] pro papežské nástupnictví se zvýší o #P +10#!" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0030.t: "Na milost živlům" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0030.desc.intro: "Vítr vyje a déšť bičuje cestu, když se blíží koncil." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0030.desc.dry_season: "V tomto ročním období je to velmi neobvyklé." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0030.desc.wet_season: "V tomto ročním období se takové nevlídné počasí dá očekávat." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0030.desc.outro: "Můj [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('chaplain') )] [chaplain.GetFirstName] se nekontrolovatelně třese.\n\n"Můj pane... obávám se, že se koncilu nebudu moci zúčastnit. Tato bouře, ten chlad... mému tělu to nedělá dobře. Mám příliš mnoho hlenu..."" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0030.aa: ""O tomto neduhu jsem četl #EMP spoustu#!!"" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0030.a: "Musím povolat nejlepšího lékaře!" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0030.b: ""Budu se za vás modlit."" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0030.c: "Život půjde dál svou cestou." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0040.t: "Tréma" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0040.desc: "Jak se blíží koncil, můj [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('chaplain') )] [chaplain.GetFirstName] nervózně přechází po nádvoří.\n\n"Jistě, jde o [ROOT.Char.GetFaith.ReligiousSymbol], to je jasné... a co [chaplain.CustomFixedRandom('random_learning_topic')]...?" slyším [chaplain.GetHerHim] mumlat [chaplain.GetHerselfHimself]." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0040.aa: ""Musíte pamatovat na [ROOT.Char.GetFaith.KnowledgeGodName], [chaplain.GetFirstNameNoTooltip]."" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0040.aa.flavor: "Duchovní vedení jistě dodá odvahu." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0040.a: "[chaplain.GetSheHe|U] by měl[a] dostat na vědomí, že zastupuje také mě." # todo: NEW TRANSLATION, CHECK FORMAT
 ecumenical_council_summons_events.0040.a.tt.success: "Vaše diplomacie přináší ovoce" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0040.a.tt.failure: "[chaplain.GetShortUIName] si není jistý vašimi úmysly" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0040.b: "Vždy mohu využít svého postavení ve [chaplain.GetHerHis] prospěch..." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0040.c: "Modlitba přece napraví všechno." # todo: NEW TRANSLATION
 friend_reassured_at_council: "[CHARACTER.GetShortUIName|U] dodal [TARGET_CHARACTER.GetShortUIName] odvahu na ekumenickém koncilu." # todo: NEW TRANSLATION
 friend_reassured_at_council_corresponding: "[CHARACTER.GetShortUIName|U] dodal [TARGET_CHARACTER.GetShortUIName] odvahu na ekumenickém koncilu." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0050.t: "Víra zpochybněna" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0050.desc.intro: "[pious_guest.GetTitledFirstName] sotva skrývá pobavení při pohledu na [non_pious_guest.GetTitledFirstName].\n\n„Viděli jste to, [ROOT.Char.GetTitleAsNameNoTooltip]?“ osloví mě [pious_guest.GetSheHe]. „[non_pious_guest.GetFirstNameNoTooltip] je třeba pochválit! Už jsem si začínal[a] myslet, že jediné místo, které [non_pious_guest.GetSheHe] zná, je některý z [Glossary( 'bath houses', 'BATHHOUSES_GLOSS' )].“" # todo: NEW TRANSLATION, CHECK FORMAT
 ecumenical_council_summons_events.0050.desc.non_pious_host: "A pomyslet si, že [non_pious_guest.GetSheHe] prohlašuje [non_pious_guest.GetHerselfHimself] za hlavu všech [ROOT.Char.GetFaith.GetAdherentNamePlural]."" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0050.aaa: "[chaplain.GetTitledFirstNameNoTooltip] by byl pro tuto práci dokonalý [chaplain.GetWomanMan]." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0050.desc.non_pious_fallback: "Žasnu, že se [non_pious_guest.GetSheHe] rozhodl zúčastnit tohoto koncilu."" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0050.aa: "Dobrý pastýř musí povstat z řad ovcí..." # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0050.a: ""Mohu o tom dát vědět #EMP všem#!... za určitou cenu."" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0050.b: ""Jak to #EMP vy#! víte, kdo navštěvuje lázně, [pious_guest.GetTitleAsNameNoTooltip]?"" # todo: NEW TRANSLATION
 ecumenical_council_summons_events.0050.c: "Poděkujme [ROOT.Char.GetFaith.HighGodName] za trochu zábavy." # todo: NEW TRANSLATION
 BATHHOUSES_GLOSS: "V mnoha středověkých městech si lázně — původně určené ke skromné očistě — získaly nechvalnou pověst. Jejich skryté místnosti poskytovaly dostatek soukromí, aby se v nich mohly věnovat svému řemeslu pracovnice nabízející potěšení." # todo: NEW TRANSLATION
 friend_defended_piety_at_ec_reason: "[CHARACTER.GetShortUIName|U] hájil zbožnost [TARGET_CHARACTER.GetShortUINamePossessive] na ekumenickém koncilu." # todo: NEW TRANSLATION
 friend_defended_piety_at_ec_reason_corresponding: "Mnozí svědkové prohlásili, že [TARGET_CHARACTER.GetShortUIName|U] hájil zbožnost [CHARACTER.GetShortUINamePossessive] na ekumenickém koncilu." # todo: NEW TRANSLATION
 rival_accused_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U] obvinil [CHARACTER.GetShortUIName] z bezbožného chování na ekumenickém koncilu." # todo: NEW TRANSLATION
 rival_accused_at_council_reason_corresponding: "[CHARACTER.GetShortUIName|U] byl [TARGET_CHARACTER.GetShortUIName] obviněn z bezbožného chování na ekumenickém koncilu." # todo: NEW TRANSLATION
 pam_ecumenical_council_rite_quarrel_defused_tt: "Rozepře je urovnána: pokrok směrem k [schism|E] #P [EmptyScope.ScriptValue('pam_great_schism_progress_rite_quarrel_defused_value')|0]#!" # todo: NEW TRANSLATION
