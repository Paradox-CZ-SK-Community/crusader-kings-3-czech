 ecumenical_council_events.0101.t: "Učení promlouvají" # todo: NEW TRANSLATION
 ecumenical_council_events.0101.desc: "Učenci si napříč sálem vyměňují citace a každý verš přiostřuje spor.\n\n„[lead_conservative.GetFaith.ReligiousText|U] hovoří jasně,“ trvá na svém [lead_conservative.GetTitledFirstName]. „[ec_current_topic.GetName( activity.GetHost.GetRite )] by se nemělo měnit.“\n\n„Přečtěte si celý úryvek, který cituji,“ odpovídá [lead_innovator.GetTitledFirstName]. „Zjistíte, že si tato změna přímo žádá!“" # todo: NEW TRANSLATION
 ecumenical_council_events.0101.support: "Upozornit na chybějící kontext v jejich úryvku." # todo: NEW TRANSLATION
