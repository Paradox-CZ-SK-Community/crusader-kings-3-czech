 ecumenical_council_summons_events.0001.t: "Starosti [guest_1.Custom('CZ_TitleAsNameNoTooltip_G')]"
 ecumenical_council_summons_events.0001.desc: "„A ta má záležitost... [guest_1.GetFaith.HighGodNamePossessive|U] soud, ta mě sžírá. Sotva dokážu spát...“ svěřuje se [guest_1.GetTitledFirstName] bolestným šepotem [guest_2.Custom('CZ_TitledFirstName_D')].\n\n„Rozumím...“ přikyvuje [guest_2.GetFirstNameNoTooltip]. „Co kdybys [Select_CString(guest_1.IsFemale,'promluvila','promluvil')|l] s naším hostitelem? [host.GetTitleAsNameNoTooltip|U] ti snad může poskytnout duchovní radu?“"
 ecumenical_council_summons_events.0001.a: "Co [Select_CString(guest_1.IsFemale,'ji','ho')|l] může tolik trápit..."
 ecumenical_council_summons_events.0001.a.learn_secret_tt: "Dozvíš se tajemství [guest_1.Custom('CZ_ShortUIName_G')]"
 ecumenical_council_summons_events.0001.b: "[guest_1.GetFirstNameNoTooltip|U] potřebuje jen trochu přátelské útěchy."
 ecumenical_council_summons_events.0001.c: "Raději nevědět."
 friend_comforted_at_council_reason: "[CZProDrop(CHARACTER,'utěšila','utěšil')|U] [TARGET_CHARACTER.Custom('CZ_ShortUIName_A')] na ekumenickém koncilu kvůli tajemství, které [TARGET_CHARACTER.Custom('CZ_ShortUIName_A')] tížilo."
 friend_comforted_at_council_reason_corresponding: "[CZProDrop(TARGET_CHARACTER,'utěšila','utěšil')|U] [CHARACTER.Custom('CZ_ShortUIName_A')] na ekumenickém koncilu kvůli tajemství, které [CHARACTER.Custom('CZ_ShortUIName_A')] tížilo."
 rival_eavesdropped_on_secret_reason: "Na koncilu se provalilo, že [CHARACTER.GetShortUIName] [Select_CString(CHARACTER.IsLocalPlayer,'se snažíš','se snaží')|l] vyzvědět tajemství [TARGET_CHARACTER.Custom('CZ_ShortUIName_G')]."
 rival_eavesdropped_on_secret_reason_corresponding: "[CZProDrop(CHARACTER,'přistihla','přistihl')|U] [TARGET_CHARACTER.Custom('CZ_ShortUIName_A')] na koncilu při snaze vyzvědět své tajemství."
 ecumenical_council_summons_events.0010.t: "Tajemství"
 ecumenical_council_summons_events.0010.desc: "[Select_CString(host.IsFemale,'Naše hostitelka','Náš hostitel')|U], [host.GetTitledFirstName], si zřejmě nevšímá mé přítomnosti, zatímco [Select_CString(host.IsFemale,'jí','mu')|l] sluha upravuje roucho.\n\n„Kéž mi [host.GetFaith.HighGodName] odpustí...“ mumlá. „Ty zvěsti o mých... sklonech. Pomyslet, že já, [Select_CString(host.IsFemale,'náměstkyně Kristova','náměstek Kristův')|l], holduji takovým zálibám! Takové zvěsti se k mým kardinálům nikdy nesmějí dostat.“"
 ecumenical_council_summons_events.0010.a: "„Vidím, že cítíš lítost.“ [host.GetTitleAsNameNoTooltip|U] naslouchá."
 ecumenical_council_summons_events.0010.a.learn_secret_tt: "Dozvíš se tajemství [host.Custom('CZ_ShortUIName_G')]"
 ecumenical_council_summons_events.0010.b: "„[ROOT.Char.Custom('RandomBibleQuoteShort')|U]“"
 ecumenical_council_summons_events.0010.b.flavor: "Najde útěchu v Písmu!"
 ecumenical_council_summons_events.0010.c: "Některé věci je lepší nevědět."
 ecumenical_council_summons_events.0020.t: "Potíže se zásobováním"
 ecumenical_council_summons_events.0020.desc.intro: "„Když to musí být...“ [host.GetTitledFirstName|U] gestem propouští jednoho z kněží.\n\n„[ROOT.Char.Custom('CZ_TitledFirstNameNoTooltip_V')|U]!“ obrací se na mě."
 ecumenical_council_summons_events.0020.desc.caravans: "„Karavany s našimi zásobami dosud nedorazily."
 ecumenical_council_summons_events.0020.desc.servants: "„Zkrátka nemáme dost sluhů, aby se postarali o všechny naše hosty."
 ecumenical_council_summons_events.0020.desc.overcrowded: "„Hostů je zkrátka příliš mnoho na ubytování, které jsme pro koncil připravili v [CZProvName(ROOT.Char.GetCurrentLocation,'L')]."
 ecumenical_council_summons_events.0020.desc.outro: "Nemáš snad řešení našich potíží?“"
 ecumenical_council_summons_events.0020.aaa: "„Toto jsou mé země, Vaše Svatosti. Postarám se o to.“"
 ecumenical_council_summons_events.0020.aa: "Znám #EMP spoustu#! lidí, kteří mi dluží laskavost..."
 ecumenical_council_summons_events.0020.a: "„Není nic, co by zlato nenapravilo, Vaše Svatosti!“"
 ecumenical_council_summons_events.0020.b: "„Připomenu všem jejich dluhy!“"
 ecumenical_council_summons_events.0020.b.flavor: "[host.GetShortUIName|U] si mě zapamatuje jako [Select_CString(ROOT.Char.IsFemale,'vlivnou kandidátku','vlivného kandidáta')|l]..."
 ecumenical_council_summons_events.0020.c: "Mohu nabídnout jen skromnou modlitbu..."
 ecumenical_council_summons_events.0020.papabile_tt: "Tvé [Concept('papabile_score','skóre papežské kandidatury')|E] pro papežské nástupnictví se zvýší o #P +10#!"
 ecumenical_council_summons_events.0030.t: "Na milost živlům"
 ecumenical_council_summons_events.0030.desc.intro: "S blížícím se koncilem kvílí vítr a déšť bičuje cestu."
 ecumenical_council_summons_events.0030.desc.dry_season: "V tomto ročním období dost neobvyklé."
 ecumenical_council_summons_events.0030.desc.wet_season: "Takové nevlídné počasí se v tomto ročním období dalo čekat."
 ecumenical_council_summons_events.0030.desc.outro: "[ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('chaplain') )|U] [chaplain.GetFirstName] se nekontrolovatelně třese.\n\n„[Select_CString(ROOT.Char.IsFemale,'Má lenní paní','Můj lenní pane')|U]... obávám se, že se koncilu nebudu moci zúčastnit. Ta bouře, ten chlad... mému tělu neprospívají. Mám příliš mnoho hlenu...“"
 ecumenical_council_summons_events.0030.aa: "„O tomto neduhu toho mám načteno #EMP mnoho#!!“"
 ecumenical_council_summons_events.0030.a: "Musím přivolat nejlepšího lékaře!"
 ecumenical_council_summons_events.0030.b: "„Budu na tebe myslet ve svých modlitbách.“"
 ecumenical_council_summons_events.0030.c: "Život půjde svou cestou."
 ecumenical_council_summons_events.0040.t: "Tréma"
 ecumenical_council_summons_events.0040.desc: "Jak se koncil blíží, po nádvoří úzkostně přechází [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('chaplain') )|l] [chaplain.GetFirstName].\n\n„Je tu samozřejmě otázka symbolu, kterým je [ROOT.Char.GetFaith.ReligiousSymbol|l], samozřejmě... a co téma [chaplain.CustomFixedRandom('random_learning_topic')|l]...?“ slyším [Select_CString(chaplain.IsFemale,'ji','ho')|l] mumlat pro sebe."
 ecumenical_council_summons_events.0040.aa: "„Pamatuj, [chaplain.Custom('CZ_FirstNameNoTooltip_V')], že [ROOT.Char.GetFaith.KnowledgeGodName] je s tebou.“"
 ecumenical_council_summons_events.0040.aa.flavor: "Trocha duchovního vedení jistě dodá odvahu."
 ecumenical_council_summons_events.0040.a: "Je třeba [Select_CString(chaplain.IsFemale,'jí','mu')|l] připomenout, že zastupuje i mě."
 ecumenical_council_summons_events.0040.a.tt.success: "Tvá diplomacie přináší ovoce"
 ecumenical_council_summons_events.0040.a.tt.failure: "[chaplain.GetShortUIName|U] si [Select_CString(chaplain.IsLocalPlayer,'nejsi','není')|l] [Select_CString(chaplain.IsFemale,'jistá','jistý')|l] tvými úmysly"
 ecumenical_council_summons_events.0040.b: "Vždy mohu využít svého postavení v [Select_CString(chaplain.IsFemale,'její','jeho')|l] prospěch..."
 ecumenical_council_summons_events.0040.c: "Není nic, co by modlitba nenapravila."
 friend_reassured_at_council: "[CZProDrop(CHARACTER,'povzbudila','povzbudil')|U] [TARGET_CHARACTER.Custom('CZ_ShortUIName_A')] na ekumenickém koncilu."
 friend_reassured_at_council_corresponding: "[CZProDrop(TARGET_CHARACTER,'povzbudila','povzbudil')|U] [CHARACTER.Custom('CZ_ShortUIName_A')] na ekumenickém koncilu."
 ecumenical_council_summons_events.0050.t: "Zpochybněná zbožnost"
 ecumenical_council_summons_events.0050.desc.intro: "[pious_guest.GetTitledFirstName|U] sotva potlačuje pobavení při pohledu na [non_pious_guest.Custom('CZ_TitledFirstName_A')].\n\n„Vidíš to?“ obrací se na mě. [ROOT.Char.GetTitleAsNameNoTooltip|U] teď musí poslouchat. „[non_pious_guest.GetFirstNameNoTooltip|U] zaslouží pochvalu! Už jsem si [Select_CString(pious_guest.IsFemale,'začínala','začínal')|l] myslet, že jediné místo k sezení, které zná, je v [Glossary( 'lázních', 'BATHHOUSES_GLOSS' )]."
 ecumenical_council_summons_events.0050.desc.non_pious_host: "A přitom se prohlašuje za hlavu všech, kdo si říkají [ROOT.Char.GetFaith.GetAdherentNamePlural|l].“"
 ecumenical_council_summons_events.0050.aaa: "[chaplain.GetTitledFirstNameNoTooltip|U] by [Select_CString(chaplain.IsFemale,'byla','byl')|l] pro tento úkol [Select_CString(chaplain.IsFemale,'ideální ženou','ideálním mužem')|l]."
 ecumenical_council_summons_events.0050.desc.non_pious_fallback: "Žasnu, že se vůbec [Select_CString(non_pious_guest.IsFemale,'rozhodla','rozhodl')|l] zúčastnit tohoto koncilu.“"
 ecumenical_council_summons_events.0050.aa: "Dobrý pastýř musí vzejít z ovcí..."
 ecumenical_council_summons_events.0050.a: "„Mohu o tom zpravit #EMP všechny#!... za jistou cenu.“"
 ecumenical_council_summons_events.0050.b: "„Jak víš právě #EMP ty#!, kdo chodí do lázní?“ [pious_guest.GetTitleAsNameNoTooltip|U] teď musí odpovědět."
 ecumenical_council_summons_events.0050.c: "Kéž [ROOT.Char.GetFaith.HighGodName] přijme mé díky za trochu zábavy."
 BATHHOUSES_GLOSS: "V mnoha středověkých městech získaly lázně, původně určené k prosté očistě, nechvalnou pověst. Jejich skryté komnaty nabízely dost soukromí pro provozování placených milostných služeb."
 friend_defended_piety_at_ec_reason: "[CZProDrop(CHARACTER,'obhájila','obhájil')|U] na ekumenickém koncilu zbožnost [TARGET_CHARACTER.Custom('CZ_ShortUIName_G')]."
 friend_defended_piety_at_ec_reason_corresponding: "Mnoho svědků uvedlo, že [CZProDropSub(TARGET_CHARACTER)] na ekumenickém koncilu [Select_CString(TARGET_CHARACTER.IsFemale,'obhájila','obhájil')|l] zbožnost [CHARACTER.Custom('CZ_ShortUIName_G')]."
 rival_accused_at_council_reason: "[CZProDrop(TARGET_CHARACTER,'obvinila','obvinil')|U] [CHARACTER.Custom('CZ_ShortUIName_A')] na ekumenickém koncilu z bezbožného chování."
 rival_accused_at_council_reason_corresponding: "[CZProDrop(TARGET_CHARACTER,'obvinila','obvinil')|U] [CHARACTER.Custom('CZ_ShortUIName_A')] na ekumenickém koncilu z bezbožného chování."
