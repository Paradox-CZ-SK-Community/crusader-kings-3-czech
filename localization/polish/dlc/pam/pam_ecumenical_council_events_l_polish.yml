l_polish:
 ecumenical_council_events.0001: "Koncil [my_location.GetBaronyNameExplicitlyNoTooltip]"
 ecumenical_council_events.0001.desc_intro: "Koncil hostí [my_location.GetBaronyNameExplicitly] a zdejší [ROOT.Char.GetFaith.HouseOfWorshipPlural|l] zdobí nádherná slavnostní výzdoba. Nejlepší z celého křesťanského světa vyslyšeli"
 ecumenical_council_events.0001.host: "mou výzvu."
 ecumenical_council_events.0001.dislikes_host: "výzvu, kterou vydává [host.Custom('InsultAdjective')|l] [host.GetTitledFirstName]."
 ecumenical_council_events.0001.likes_host: "výzvu, kterou vydává [host.Custom('ComplimentAdjective')|l] [host.GetTitledFirstName]."
 ecumenical_council_events.0001.neutral: "výzvu, kterou vydává [host.GetTitledFirstName]."
 ecumenical_council_events.0001.intent_arrived: "\n\nA už mezi shromážděnými vidím [intent_target.Custom('CZ_TitledFirstName_A')]. Výborně!"
 ecumenical_council_events.0001.waiting_for_intent: "\n\nJe jen otázkou času, kdy se objeví [intent_target.GetTitledFirstName]..."
 ecumenical_council_events.0001.no_intent_target: "\n\nStačí jen vyčkat na jejich příchod!"
 ecumenical_council_events.0001.a.bad: "Když není zbytí."
 ecumenical_council_events.0001.a.good: "Naše povinnost je svatá."
 ecumenical_council_events.0002.t: "Svolání"
 ecumenical_council_events.0002.desc_intro: "[host.GetFaith.HouseOfWorship|U] nyní otevírá své dveře a naše velké dílo může začít. Na úvod je třeba uzavřít spojenectví"
 ecumenical_council_events.0002.reformist: "mezi králi i kněžími."
 ecumenical_council_events.schism_crisis_intro: "\n\nPozdravy jsou vřelé; mlčení, které po nich následuje, už ne. Řím a Konstantinopol si přestaly vyměňovat zdvořilosti a každá neusmířená rozepře je další trhlinou v jediném těle Kristově."
 ecumenical_council_events.0002.first_tenet: "\n\nVzduchem se nese živý hovor. Svolaní si začínají utvářet postoje k zásadě [ec_debate_topic_1.GetName( ROOT.GetCharacter.GetRite )] a dalším naléhavým otázkám."
 ecumenical_council_events.0002.host: "\n\nRozpřahuji paže a vítám své děti, abychom společně stanuli před naším velkolepým úkolem."
 ecumenical_council_events.0002.guest: "\n\n„Vítejte, mé děti. Kéž nás Pán vede při našem velkolepém úkolu!“ [host.GetTitledFirstName|U] nás zve dál."
 ecumenical_council_events.0002.a: "Amen."
 ecumenical_council_events.0010.t: "Náš postoj k zásadě [ec_debate_topic_1.GetNameNoTooltip( ROOT.GetCharacter.GetRite )]"
 ecumenical_council_events.0010.desc.intro: "První rozprava se týká zásady [ec_debate_topic_1.GetName( ROOT.GetCharacter.GetRite )]. Současné kanonické právo jí přiznává status [host.Custom('GetEcumenicalDebateTenet1StatusText')|l]. [lead_portrait.GetTitledFirstName|U] uvádí téma:\n\n"
 ecumenical_council_events.0010.desc.intro_permit_promote: "\n\n„Stále více lidí ji považuje za ústřední součást své bohoslužby,“ hlásí [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )|l] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_permit_demote: "\n\n„Zakázat nějaký zvyk s sebou nese riziko, ale v tomto případě je to více než opodstatněné,“ ujišťuje mě [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )|l] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_core_demote_bad: "\n\n„Tento zvyk je stále oblíbený. Jeho odsouzení... s sebou nese jistá rizika,“ vyjadřuje obavy [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )|l] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_core_demote_good: "\n\n„Tento zvyk ztrácí na oblibě. Je příhodná chvíle přestat jej podporovat,“ radí mi [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )|l] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_prohibited_promote_good: "\n\n„Tento zvyk získává na oblibě. Bylo by moudré zvážit jeho podporu,“ navrhuje [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )|l] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_prohibited_promote_bad: "\n\n„Tento zvyk je téměř neznámý; zastávat se jej je nebezpečné,“ varuje mě [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )|l] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.fallback.explanation: "„Jde o učení, jehož místo naše víra dosud pevně nestanovila; nyní o něm má rozhodnout tento koncil.“"
 ecumenical_council_events.0010.desc.peace_of_god.explanation: "„Máme rozhodnout, zda zachováme mír a příměří, které žádá [ROOT.Char.GetFaith.HighGodName]. Musí naši lidé přísahat, že ochrání kostely, duchovenstvo a neozbrojené před pleněním a krveprolitím? Smíme ve svatých obdobích zakázat válčení pod hrozbou klatby [CZFaithAdjDecline(ROOT.Char.GetFaith,'é')|l] církve?“"
 ecumenical_council_events.0010.desc.dulia.explanation: "„Máme rozhodnout, zda mají být svatí předmětem velké úcty. Smíme jejich ostatky pokládat za posvátné, světit jejich svátky a prosit je o přímluvu, zatímco pouze [ROOT.Char.GetFaith.HighGodName] zůstává předmětem našeho uctívání?“"
 ecumenical_council_events.0010.desc.transubstantiation.explanation: "„Máme rozhodnout, zda se kněžským posvěcením chléb a víno na oltáři skutečně proměňují v tělo a krev Kristovu.“"
 ecumenical_council_events.0010.desc.ora_et_labora.explanation: "„Máme rozhodnout, zda svatý život musí spojovat modlitbu s prací. Je zahálka nepřítelem duše? Má být naše práce na poli či ve skriptoriu stejně vážená jako chvíle, kdy se koná [ROOT.Char.Custom('GetReligiousRite')|l]?“"
 ecumenical_council_events.0010.desc.hyperdulia.explanation: "„Máme rozhodnout, zda má být svatá Matka Marie, Bohorodička, ctěna nade všechny ostatní svaté.“"
 ecumenical_council_events.0010.desc.simony.explanation: "„Máme rozhodnout, zda lze svatý úřad, požehnání či svátost kupovat a prodávat za zlato.“"
 ecumenical_council_events.0010.desc.monophysitism.explanation: "„Máme rozhodnout, zda má Kristus jedinou, zcela božskou přirozenost. Je jeho lidství pohlceno a ve Slovu, které se stalo tělem, zbývá pouze božství?“"
 ecumenical_council_events.0010.desc.acts_of_apostles.explanation: "„Máme rozhodnout, zda musí [CZFaithAdjDecline(ROOT.Char.GetFaith,'á')|l] církev žít podle Skutků apoštolů. Máme vyslat své misionáře, aby s apoštolským zápalem nesli Slovo těm, kdo dosud žijí v temnotě?“"
 ecumenical_council_events.0010.desc.purgatory.explanation: "„Máme rozhodnout, zda lze duše, které nejsou zcela čisté ani zcela zavržené, po smrti očistit. Mohou jim modlitby a obřady živých pomoci na cestě k místu, kde je očekává [ROOT.Char.GetFaith.HighGodName]?“"
 ecumenical_council_events.0010.desc.be_fruitful_and_multiply.explanation: "„Máme rozhodnout, zda je plození dětí svatou povinností. Mají věřící naplnit zemi svými potomky?“"
 ecumenical_council_events.0010.desc.apostolic_succession.explanation: "„Máme rozhodnout, zda autorita biskupů skutečně vychází z jejich nepřerušené posloupnosti od apoštolů.“"
 ecumenical_council_events.0010.desc.confession.explanation: "„Máme rozhodnout, zda musí každý, kdo se označuje jako [ROOT.Char.GetFaith.GetAdherentName|l], vyznat své hříchy knězi, aby získal rozhřešení. Je zpovědní tajemství nedotknutelné?“"
 ecumenical_council_events.0010.desc.original_sin.explanation: "„Máme rozhodnout, zda každá duše dědí Adamův hřích. Jsme poskvrněni již od narození a potřebujeme milost křtu?“"
 ecumenical_council_events.0010.desc.celestial_hierarchy.explanation: "„Máme rozhodnout, zda jsou svatí andělé uspořádáni v hierarchii, nad níž stojí [ROOT.Char.GetFaith.HighGodName]. Mají úřady [CZFaithAdjDecline(ROOT.Char.GetFaith,'é')|l] církve odrážet tento nebeský řád?“"
 ecumenical_council_events.0010.desc.miles_christi.explanation: "„Máme rozhodnout, zda mají být věřící vojáky Kristovými. Jsme povinni na výzvu pozvednout meč a bránit [CZFaithAdjDecline(ROOT.Char.GetFaith,'ou')|l] církev?“"
 ecumenical_council_events.0010.desc.scholasticism.explanation: "„Máme rozhodnout, zda smí víra hledat porozumění prostřednictvím rozumu. Mají školy užívat dialektiku a filozofii k uspořádání a obraně doktríny?“"
 ecumenical_council_events.0010.desc.adoptionism.explanation: "„Máme rozhodnout, zda je Kristus ve svém lidství synem, jehož přijal za vlastního [ROOT.Char.GetFaith.HighGodName].“"
 ecumenical_council_events.0010.desc.love_thy_neighbour.explanation: "„Máme rozhodnout, zda musí každého, kdo se označuje jako [ROOT.Char.GetFaith.GetAdherentName|l], zavazovat láska k bližnímu, včetně cizince a nepřítele, jako spolehlivá míra lásky, kterou žádá [ROOT.Char.GetFaith.HighGodName].“"
 ecumenical_council_events.0010.desc.divine_liturgy.explanation: "„Máme rozhodnout, zda [ROOT.Char.Custom('GetReligiousRite')|l] za doprovodu zpěvu, kadidla a náležitého obřadu představuje hlavní cestu, na jejímž konci věřící očekává [ROOT.Char.GetFaith.HighGodName].“"
 ecumenical_council_events.0010.desc.miaphysitism.explanation: "„Máme rozhodnout, zda v Kristu tvoří božství a lidství jedinou vtělenou přirozenost, bez rozdělení a bez smíšení.“"
 ecumenical_council_events.0010.desc.hesychasm.explanation: "„Máme rozhodnout, zda svaté ztišení a prostá, neustále opakovaná modlitba srdce mohou duši umožnit spatřit nestvořené světlo, které vyzařuje [ROOT.Char.GetFaith.HighGodName].“"
 ecumenical_council_events.0010.desc.anachoresis.explanation: "„Máme rozhodnout, zda je odchod ze světa svatý. Je poustevnická samota pravou cestou, na jejímž konci čeká [ROOT.Char.GetFaith.HighGodName]?“"
 ecumenical_council_events.0010.desc.mortification_of_the_flesh.explanation: "„Máme rozhodnout, zda je duch obohacen, když se tělo podrobuje půstu, žíněné košili a bičování.“"
 ecumenical_council_events.0010.desc.holy_myron.explanation: "„Máme rozhodnout, zda má svaté [Glossary( 'křižmo', 'CHRISM_GLOSS' )] stvrzovat křest a korunovaci darem Ducha svatého.“"
 CHRISM_GLOSS: "Řecké označení pro „pomazání“. #bold Křižmo#! je vonný posvátný olej svěcený biskupem, kterým jsou věřící pomazáváni při křtu a biřmování a někdy také při královské korunovaci."
 ecumenical_council_events.0010.desc.khachkar.explanation: "„Máme rozhodnout, zda mezi námi smějí vyrůstat kamenné tesané kříže jako trvalá veřejná svědectví víry, označující posvátnou půdu a místa odpočinku zemřelých.“"
 ecumenical_council_events.0010.desc.philanthropia.explanation: "„Máme rozhodnout, zda je péče o chudé závaznou povinností [CZFaithAdjDecline(ROOT.Char.GetFaith,'é')|l] církve. Musíme financovat almužny, nemocnice a domy milosrdenství?“"
 ecumenical_council_events.0010.desc.aniconism.explanation: "„Máme rozhodnout, zda musí být z našich kostelů odstraněny všechny svaté obrazy. Je jejich úcta skutečně modloslužbou pozemských podobizen, kvůli níž se z našich očí a myslí vytrácí [ROOT.Char.GetFaith.HighGodName]?“"
 ecumenical_council_events.0010.desc.alexandrian_catechism.explanation: "„Máme rozhodnout, zda je nutné v Písmu hledat skryté duchovní významy. Mohou řecká učenost a alegorie odhalit to, co samotná slova skrývají?“"
 ecumenical_council_events.0010.desc.armed_pilgrimages.explanation: "„Máme rozhodnout, zda je přijetí kříže a pochod ve svatém poslání projevem oddanosti Kristu. Smí meč chránit poutníky a získat zpět to, co drží nevěřící?“"
 ecumenical_council_events.0010.desc.carnal_exaltation.explanation: "„Máme rozhodnout, zda tělesné rozkoše přibližují duši božskému. Má být touha ctěna a vyhledávána, místo aby byla zavrhována jako hřích?“"
 ecumenical_council_events.0010.desc.communal_identity.explanation: "„Máme rozhodnout, zda víra a příslušnost k národu tvoří jednotu, kterou zaštituje [ROOT.Char.GetFaith.HighGodName]. Musí cizinci zůstat mimo pravé stádo?“"
 ecumenical_council_events.0010.desc.communion.explanation: "„Máme rozhodnout, zda společné posvátné obřady působí, že je mezi námi přítomen [ROOT.Char.GetFaith.HighGodName]. Musí ti, kdo se jich s námi neúčastní, stát mimo pravé stádo?“"
 ecumenical_council_events.0010.desc.consolamentum.explanation: "„Máme rozhodnout, zda může konečné duchovní očištění před smrtí smýt všechny hříchy a zda pak očištění musí odmítnout potravu i život, aby se hřích nevrátil.“"
 ecumenical_council_events.0010.desc.divine_marriage.explanation: "„Máme rozhodnout, zda musí sňatky zůstat uvnitř posvátné pokrevní linie, dokonce i mezi příbuznými, jejichž blízkost by [CZFaithAdjDecline(ROOT.Char.GetFaith,'á')|l] církev označila za zapovězenou.“"
 ecumenical_council_events.0010.desc.gnosticism.explanation: "„Máme rozhodnout, zda spása spočívá ve skrytém poznání, zjeveném pouze zasvěceným, které osvobodí božskou jiskru a navrátí ji k jejímu zdroji.“"
 ecumenical_council_events.0010.desc.mendicant_preachers.explanation: "„Máme rozhodnout, zda mají bratři zůstat zcela bez majetku. Mají putovat od města k městu, živit se almužnami a kázat slovo, které hlásá [ROOT.Char.GetFaith.HighGodName]?“"
 ecumenical_council_events.0010.desc.pacifism.explanation: "„Máme rozhodnout, zda meč nemá místo v životě nikoho, kdo se označuje jako [ROOT.Char.GetFaith.GetAdherentName|l]. Je představa spravedlivé války mylná?“"
 ecumenical_council_events.0010.desc.pentarchy.explanation: "„Máme rozhodnout, zda má [CZFaithAdjDecline(ROOT.Char.GetFaith,'á')|l] církev podléhat společné vládě pěti patriarchálních stolců. Znamenalo by to popření prvenství hlavního přímluvce, kterého pověřuje [ROOT.Char.GetFaith.HighGodName]?“"
 ecumenical_council_events.0010.desc.unrelenting_faith.explanation: "„Máme rozhodnout, zda má víra neochvějně obstát v pronásledování, strádání a pochybnostech. Jsme povinni vytrvat bez ohledu na cenu?“"
 ecumenical_council_events.0010.desc.vows_of_poverty.explanation: "„Máme rozhodnout, zda [ROOT.Char.GetFaith.HighGodName] nejvíce ocení naši službu, složíme-li stejně jako apoštolové slib chudoby.“"
 ecumenical_council_events.0010.desc.pastoral_isolation.explanation: "„Máme rozhodnout, zda má být stádo ponecháno samo sobě, aby si zachovalo vlastní zvyky. Má [CZFaithAdjDecline(ROOT.Char.GetFaith,'á')|l] církev nedůvěřovat cizincům a odmítat jejich zásahy?“"
 ecumenical_council_events.0010.desc.adaptive.explanation: "„Máme rozhodnout, zda požadavek všeobecného dodržování našich zvyků a omezení škodí stádu. Smějí se naše zákony přizpůsobovat světu, v němž musí platit, pokud zůstane jádro naší víry beze změny?“"
 ecumenical_council_events.0010.desc.esotericism.explanation: "„Máme rozhodnout, zda nás tajemství, která ukrývá [ROOT.Char.GetFaith.HighGodName], zavazují k hledání poznání okolního světa.“"
 ecumenical_council_events.0010.desc.legalism.explanation: "„Máme rozhodnout, zda musí posvátný zákon řídit každý skutek v [CZFaithAdjDecline(ROOT.Char.GetFaith,'ém')|l] životě. Nesmí být žádný hříšník, byť král či císař, nad jeho přikázáními?“"
 ecumenical_council_events.0010.desc.literalism.explanation: "„Máme rozhodnout, zda je svaté Písmo neměnné a úplné, jediný zdroj moudrosti, kterou zjevuje [ROOT.Char.GetFaith.HighGodName].“"
 ecumenical_council_events.0010.desc.reincarnation.explanation: "„Máme rozhodnout, zda se duše vrací v mnoha životech, místo aby ji pouze jednou čekal [ROOT.Char.GetFaith.HighGodNamePossessive] soud.“"
 ecumenical_council_events.0010.desc.religious_legal_pronouncements.explanation: "„Máme rozhodnout, zda smějí učenci [CZFaithAdjDecline(ROOT.Char.GetFaith,'é')|l] církve vydávat závazná rozhodnutí ke každé nové otázce víry a práva.“"
 ecumenical_council_events.0010.desc.struggle_submission.explanation: "„Máme rozhodnout, zda se [CZFaithAdjDecline(ROOT.Char.GetFaith,'ý')|l] život musí utvářet kolem zápasu a podrobení. Musí se věřící zcela poddat tomu, co žádá [ROOT.Char.GetFaith.HighGodName]?“"
 ecumenical_council_events.0010.desc.false_conversion_sanction.explanation: "„Máme rozhodnout, zda smí ten, kdo se označuje jako [ROOT.Char.GetFaith.GetAdherentName|l], za pronásledování předstírat jinou víru.“"
 ecumenical_council_events.0010.desc.tax_nonbelievers.explanation: "„Máme rozhodnout, zda nevěřící smějí žít pod [CZFaithAdjDecline(ROOT.Char.GetFaith,'ou')|l] vládou, zaplatí-li daň za ochranu.“"
 ecumenical_council_events.0010.desc.asceticism.explanation: "„Máme rozhodnout, zda je cestou hladu, nouze a odpírání veškerého tělesného pohodlí hledán [ROOT.Char.GetFaith.HighGodName].“"
 ecumenical_council_events.0010.desc.bhakti.explanation: "„Máme rozhodnout, zda se má každá duše v láskyplné oddanosti připoutat k jedinému aspektu božského.“"
 ecumenical_council_events.0010.desc.dharmic_pacifism.explanation: "„Máme rozhodnout, zda je zakázáno ubližovat všemu živému. Máme se vyvarovat ubližování i prostým zvířatům a hmyzu?“"
 ecumenical_council_events.0010.desc.inner_journey.explanation: "„Máme rozhodnout, zda je především rozjímáním a sebepoznáním hledán [ROOT.Char.GetFaith.HighGodName].“"
 ecumenical_council_events.0010.desc.ritual_hospitality.explanation: "„Máme rozhodnout, zda je naší svatou povinností přijmout každého cizince k našemu stolu.“"
 ecumenical_council_events.0010.desc.adorcism.explanation: "„Máme rozhodnout, zda mají být duchové tohoto světa ctěni a vítáni, aby nám mohli pomoci, nebo zda mají být vyháněni jako nečisté síly.“"
 ecumenical_council_events.0010.desc.ancestor_worship.explanation: "„Máme rozhodnout, zda mají být naši předkové ctěni modlitbami a oběťmi, aby nás chránili a vedli.“"
 ecumenical_council_events.0010.desc.astrology.explanation: "„Máme rozhodnout, zda je ve hvězdách zapsáno, co žádá [ROOT.Char.GetFaith.HighGodName]. Znají nebesa tajemství našich osudů?“"
 ecumenical_council_events.0010.desc.hedonistic.explanation: "„Máme rozhodnout, zda je rozkoš darem, který máme vyhledávat jako formu uctívání.“"
 ecumenical_council_events.0010.desc.human_sacrifice.explanation: "„Máme rozhodnout, zda smí být na oltáři obětován lidský život. Smí být krev prolévána jako posvátný dar, který přijímá [ROOT.Char.GetFaith.HighGodName]?“"
 ecumenical_council_events.0010.desc.mystical_birthright.explanation: "„Máme rozhodnout, zda jsou některé duše od narození určeny k posvátné moci a duchovnímu vedení, ještě před pomazáním [CZFaithAdjDecline(ROOT.Char.GetFaith,'ou')|l] církví.“"
 ecumenical_council_events.0010.desc.ritual_celebrations.explanation: "„Máme rozhodnout, zda má [CZFaithAdjDecline(ROOT.Char.GetFaith,'ý')|l] kalendář oplývat svatými svátky, aby spojoval věřící.“"
 ecumenical_council_events.0010.desc.sacred_childbirth.explanation: "„Máme rozhodnout, zda musí být porod připravován posvátnými obřady. Musí být místo porodu očištěno, aby [ROOT.Char.GetFaith.HighGodName] mohl požehnat matce i dítěti?“"
 ecumenical_council_events.0010.desc.sanctity_of_nature.explanation: "„Máme rozhodnout, zda jsou lesní háj, divoká řeka a rosou skropené údolí posvátné. Je divočina tím místem, kde na nás čeká [ROOT.Char.GetFaith.HighGodName]?“"
 ecumenical_council_events.0010.desc.sun_worship.explanation: "„Máme rozhodnout, zda máme své modlitby směřovat ke slunci. Je toto životodárné světlo tím, co ztělesňuje [ROOT.Char.GetFaith.HighGodName]?“"
 ecumenical_council_events.0010.desc.warmonger.explanation: "„Máme rozhodnout, zda jsou válka a dobývání samy o sobě svatou službou. Je meč nejjistější cestou, jak šířit slovo, které hlásá [ROOT.Char.GetFaith.HighGodName]?“"
 ecumenical_council_events.0010.desc.gruesome_festivals.explanation: "„Máme rozhodnout, zda smějí být svaté dny provázeny krví a krutou podívanou. Je takové veselí pravým uctíváním, které přijímá [ROOT.Char.GetFaith.HighGodName]?“"
 ecumenical_council_events.0010.desc.cthonic_redoubts.explanation: "„Máme rozhodnout, zda jsou výšiny a hlubiny země svaté. Jsou vrcholky a skryté kamenné stezky místy, kde se nám zjevuje [ROOT.Char.GetFaith.HighGodName]?“"
 ecumenical_council_events.0010.desc.household_gods.explanation: "„Máme rozhodnout, zda smějí být v [CZFaithAdjDecline(ROOT.Char.GetFaith,'ých')|l] domácnostech ctěni bohové krbu a domova a zda jim smíme sloužit.“"
 ecumenical_council_events.0010.desc.sinitic_syncretism.explanation: "„Máme rozhodnout, zda smějí být obřady a kánon vzdáleného Východu vetkány do naší víry.“"
 ecumenical_council_events.0010.desc.eastern_syncretism.explanation: "„Máme rozhodnout, zda se smíme učit od vír Východu, které žijí vedle sebe a neoznačují jedna druhou za zavrženíhodnou, přestože nesdílíme jejich bohy.“"
 ecumenical_council_events.0010.desc.unreformed_syncretism.explanation: "„Máme rozhodnout, zda smějí být staré lidové zvyky nových věřících zachovány a zda se z nich můžeme tiše učit, místo abychom je ničili a odsuzovali.“"
 ecumenical_council_events.0010.desc.christian_syncretism.explanation: "„Máme rozhodnout, zda smějí ti, kdo stojí mimo Krista, přesto ctít jeho učení a příklad, i když jej neuznávají jako pravého Boha.“"
 ecumenical_council_events.0010.desc.islamic_syncretism.explanation: "„Máme rozhodnout, zda smí být zákon Saracénů přijat do [CZFaithAdjDecline(ROOT.Char.GetFaith,'é')|l] církve a jejich učení smíšeno s evangeliem.“"
 ecumenical_council_events.0010.desc.jewish_syncretism.explanation: "„Máme rozhodnout, zda mají být zákon a učenost Židů přijaty do [CZFaithAdjDecline(ROOT.Char.GetFaith,'é')|l] církve, přestože nesdílíme všechna jejich přesvědčení.“"
 ecumenical_council_events.0010.desc.exaltation_of_pain.explanation: "„Máme rozhodnout, zda je bolest sama o sobě svatá. Je její působení požehnáním a její přijímání milostí, kterou uděluje [ROOT.Char.GetFaith.HighGodName]?“"
 ecumenical_council_events.0010.desc.natural_primitivism.explanation: "„Máme rozhodnout, zda lze svatost nalézt opuštěním měst a přijetím života v divočině, návratem k původnímu stavu bytí.“"
 ecumenical_council_events.0010.desc.pursuit_of_power.explanation: "„Máme rozhodnout, zda je vláda nad tímto světem posvátným cílem. Naplní uchvácení moci to, co žádá [ROOT.Char.GetFaith.HighGodName]?“"
 ecumenical_council_events.0010.desc.ritual_cannibalism.explanation: "„Máme rozhodnout, zda smějí být těla zemřelých pojídána jako posvátný obřad.“"
 ecumenical_council_events.0010.desc.sacred_shadows.explanation: "„Máme rozhodnout, zda může být klam svatý. Smějí věřící lhát, a dokonce vlastním lžím uvěřit, pokud by pravda ohrozila víru?“"
 ecumenical_council_events.0010.desc.polyamory.explanation: "„Máme rozhodnout, zda smějí věřící milovat více lidí a odmítnout představu, že někomu náleží láska druhé duše.“"
 ecumenical_council_events.0010.desc.sacrificial_ceremonies.explanation: "„Máme rozhodnout, zda smí být v posvátném obřadu obětován lidský život. Smějí se dobrovolníci obětovat sami a viníci být obětováni na [CZFaithAdjDecline(ROOT.Char.GetFaith,'ých')|l] oltářích?“"
 ecumenical_council_events.0010.desc.megaliths.explanation: "„Máme rozhodnout, zda je nutné stavět velké kamenné památníky jako svědectví trvalé slávy, kterou požívá [ROOT.Char.GetFaith.HighGodName].“"
 ecumenical_council_events.0010.desc.communal_possessions.explanation: "„Máme rozhodnout, zda musí věřící držet veškerý majetek společně.“"
 ecumenical_council_events.0010.desc.pure_land.explanation: "„Máme rozhodnout, zda se požehnané říše prosté utrpení dosahuje pouze důvěrou a oddaností, nikoli bohatstvím, studiem či obřadní zručností.“"
 ecumenical_council_events.0010.desc.no_mind.explanation: "„Máme rozhodnout, zda je prostřednictvím prázdné mysli a umlčeného já hledán [ROOT.Char.GetFaith.HighGodName].“"
 ecumenical_council_events.0010.desc.mountain_worship.explanation: "„Máme rozhodnout, zda jsou výšiny skutečně vznešené a svaté. Je vrchol hory tím nejlepším místem, kde se nám zjevuje [ROOT.Char.GetFaith.HighGodName]?“"
 ecumenical_council_events.0010.desc.extinction_of_dharma.explanation: "„Máme rozhodnout, zda tento věk upadá do temnoty a zda po světě chodí démoni v rouše zbožnosti. Musíme takové nepřátele zabíjet, abychom bránili upadající posvátný zákon?“"
 ecumenical_council_events.0010.desc.cranial_trophies.explanation: "„Máme rozhodnout, zda mají být hlavy zabitých proměňovány v posvátné trofeje.“"
 ecumenical_council_events.0010.desc.pursuit_of_knowledge.explanation: "„Máme rozhodnout, zda je hledání poznání svatou povinností.“"
 ecumenical_council_events.0010.desc.benevolent_governance.explanation: "„Máme rozhodnout, zda je spravedlivá vláda svatou povinností, které musí dostát [CZFaithAdjDecline(ROOT.Char.GetFaith,'á')|l] knížata.“"
 ecumenical_council_events.0010.desc.filial_piety.explanation: "„Máme rozhodnout, zda úctu k rodičům a starším nařizuje [ROOT.Char.GetFaith.HighGodName].“"
 ecumenical_council_events.0010.desc.harmonious_society.explanation: "„Máme rozhodnout, zda je společenská harmonie, v níž má každá duše své místo, jádrem [CZFaithAdjDecline(ROOT.Char.GetFaith,'ého')|l] řádu.“"
 ecumenical_council_events.0010.desc.sacred_destruction.explanation: "„Máme rozhodnout, zda může být ničení samo o sobě svaté. Je boření starého tím, co od nás žádá [ROOT.Char.GetFaith.HighGodName]?“"
 ecumenical_council_events.0010.desc.preservation.explanation: "„Máme rozhodnout, zda svatost spočívá v tom, co vybudujeme a uchováme. Musíme pečovat o [CZFaithAdjDecline(ROOT.Char.GetFaith,'é')|l] chrámy a díla, aby navěky vzkvétaly?“"
 ecumenical_council_events.0010.desc.takamin.explanation: "„Máme rozhodnout, zda je mocný medvěd nositelem božského. Musí lovci ctít velké zvíře jako posvátné a zabíjet je pouze se svatou úctou?“"
 ecumenical_council_events.0010.a_1: "Nahradí zásadu [current_core_1.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]."
 ecumenical_council_events.0010.a_2: "Udělám místo odstraněním zásady [current_core_2.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]."
 ecumenical_council_events.0010.a_3: "Zásada [current_core_3.GetNameNoTooltip(ROOT.GetCharacter.GetRite)] musí ustoupit."
 ecumenical_council_events.0010.b: "Zakázat tento zvyk!"
 ecumenical_council_events.0010.c: "Prozatím jeho dodržování prostě povolím."
 ecumenical_council_events.0010.d: "Alespoň tuto zásadu vezměme na vědomí."
