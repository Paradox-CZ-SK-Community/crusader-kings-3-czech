 ecumenical_council_events.0011.desc.intro: "$ecumenical_council_events.0010.desc.intro$" # todo: NEW TRANSLATION
 ecumenical_council_events.0011.desc.outro: "Náš host [host.GetTitledFirstName] prohlašuje:\n\n„Navrhuji, aby se [ec_debate_topic_1.GetNameNoTooltip( ROOT.GetCharacter.GetRite )]" # todo: NEW TRANSLATION
 ecumenical_council_events.0011.desc.permit: "povolilo.“" # todo: NEW TRANSLATION
 ecumenical_council_events.0011.desc.prohibit: "zakázalo.“" # todo: NEW TRANSLATION
 ecumenical_council_events.0011.desc.learn: "poznalo.“" # todo: NEW TRANSLATION
 ecumenical_council_events.0011.desc.make_core: "stalo základním učením a nahradilo [core_tenet_to_swap.GetName( ROOT.GetCharacter.GetRite )]“" # todo: NEW TRANSLATION
 ecumenical_council_events.0011.a: "Hlasuji pro změnu." # todo: NEW TRANSLATION
 ecumenical_council_events.0011.b: "Nesouhlasím." # todo: NEW TRANSLATION
