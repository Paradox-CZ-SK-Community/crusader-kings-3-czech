 ecumenical_council_events.0107.t: "Jejich první koncil"
 ecumenical_council_events.0107.desc: "Skupina mladších duchovních živě rozpráví; zjevně jsou nadšeni svým mnohdy prvním koncilem.\n\n„Rodí se tu hnutí. Cítíte, jak se nás dotýká [lead_innovator.GetFaith.HouseholdGodName]? Zanechme v církvi svou stopu s odvahou, na kterou se už dávno zapomnělo!“ říká [lead_innovator.GetTitledFirstName].\n\n„Politováníhodní hlupáci! Musíme se podřídit církevním otcům a odmítnout tyto odporné novoty,“ trvá na svém [lead_conservative.GetTitledFirstName]."
