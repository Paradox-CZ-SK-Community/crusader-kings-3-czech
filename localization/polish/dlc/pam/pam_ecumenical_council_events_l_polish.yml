l_polish:
 ecumenical_council_events.0001: "Koncil v [my_location.GetBaronyNameExplicitlyNoTooltip]" # todo: NEW TRANSLATION
 ecumenical_council_events.0001.desc_intro: "[ROOT.Char.GetFaith.HouseOfWorshipPlural] v [my_location.GetBaronyNameExplicitly] byly pro tuto příležitost nádherně vyzdobeny. Ti nejlepší z křesťanského světa vyslyšeli" # todo: NEW TRANSLATION
 ecumenical_council_events.0001.host: "mé volání." # todo: NEW TRANSLATION
 ecumenical_council_events.0001.dislikes_host: "Volání [host.Custom('InsultAdjective')] [host.GetTitledFirstNamePossessive]." # todo: NEW TRANSLATION
 ecumenical_council_events.0001.likes_host: "Volání [host.Custom('ComplimentAdjective')] [host.GetTitledFirstNamePossessive]." # todo: NEW TRANSLATION
 ecumenical_council_events.0001.neutral: "Volání [host.GetTitledFirstNamePossessive]." # todo: NEW TRANSLATION
 ecumenical_council_events.0001.intent_arrived: "\n\nA už mezi shromážděnými zahlédnu [intent_target.GetTitledFirstName]. Výborně!" # todo: NEW TRANSLATION
 ecumenical_council_events.0001.waiting_for_intent: "\n\nJe jen otázkou času, než se [intent_target.GetTitledFirstName] objeví..." # todo: NEW TRANSLATION
 ecumenical_council_events.0001.no_intent_target: "\n\nNezbývá mi než čekat na jejich příchod!" # todo: NEW TRANSLATION
 ecumenical_council_events.0001.a.bad: "Když už musíme." # todo: NEW TRANSLATION
 ecumenical_council_events.0001.a.good: "Je naší svatou povinností." # todo: NEW TRANSLATION
 ecumenical_council_events.0002.t: "Svolání" # todo: NEW TRANSLATION
 ecumenical_council_events.0002.desc_intro: "Dveře do [host.GetFaith.HouseOfWorship] se nyní mohou otevřít a naše velké dílo může začít. Nejdříve je třeba uzavřít spojenectví" # todo: NEW TRANSLATION
 ecumenical_council_events.0002.reformist: "mezi králi i kněžími." # todo: NEW TRANSLATION
 ecumenical_council_events.schism_crisis_intro: "\n\nPozdravy jsou srdečné, ale ticho, které po nich následuje, už ne. Řím a Konstantinopol si už nevyměňují zdvořilosti a každá nezhojená roztržka je novou trhlinou v jediném Těle Kristově." # todo: NEW TRANSLATION
 ecumenical_council_events.0002.first_tenet: "\n\nVzduch je plný hovoru. Svolaní začínají utvářet své postoje k [ec_debate_topic_1.GetName( ROOT.GetCharacter.GetRite )] a dalším naléhavým záležitostem." # todo: NEW TRANSLATION
 ecumenical_council_events.0002.host: "\n\nRozevírám náruč a vítám své děti, abychom společně čelili našemu velkolepému úkolu." # todo: NEW TRANSLATION
 ecumenical_council_events.0002.guest: "\n\n"Vítejte, mé děti. Kéž nás Pán vede při našem velkolepém úkolu!" [host.GetTitledFirstName] nás zve dál." # todo: NEW TRANSLATION
 ecumenical_council_events.0002.a: "Amen." # todo: NEW TRANSLATION
 ecumenical_council_events.0010.t: "Náš postoj k [ec_debate_topic_1.GetNameNoTooltip( ROOT.GetCharacter.GetRite )]" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.intro: "První debata se soustředí na [ec_debate_topic_1.GetName( ROOT.GetCharacter.GetRite )]. Stávající kanonické právo jej uznává jako [host.Custom('GetEcumenicalDebateTenet1StatusText')|l]. [lead_portrait.GetTitledFirstName] uvádí téma:\n\n" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.intro_permit_promote: "\n\n"Stále více lidí to považuje za ústřední součást své bohoslužby," hlásí můj [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]." # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.intro_permit_demote: "\n\n"Zakázat nějaký zvyk je riskantní, ale v tomto případě je to více než opodstatněné," ujišťuje mě můj [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]." # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.intro_core_demote_bad: "\n\n"Tento zvyk je stále oblíbený. Odsoudit jej... s sebou nese určitá rizika," vyjadřuje obavy můj [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]." # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.intro_core_demote_good: "\n\n"Tento zvyk ztrácí na oblibě. Nastal vhodný čas přestat jej podporovat," radí můj [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]." # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.intro_prohibited_promote_good: "\n\n"Tento zvyk získává na oblibě. Bylo by moudré zvážit, zda jej nepodpořit," navrhuje můj [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]." # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.intro_prohibited_promote_bad: "\n\n"Tento zvyk je málo známý; zastávat se ho je nebezpečné," varuje můj [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]." # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.fallback.explanation: ""Toto je učení, které naše víra dosud pevně neustavila; nyní je předmětem rozpravy tohoto koncilu."" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.peace_of_god.explanation: ""Jsme tázáni: máme zachovávat mír a příměří [ROOT.Char.GetFaith.HighGodName]? Mají naši lidé přísahat, že ušetří kostely, duchovenstvo a neozbrojené před pleněním a krveprolitím? Smíme zakázat válčení během svatých období pod hrozbou zákazu ze strany [ROOT.Char.GetFaith.GetAdjective] církve?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.dulia.explanation: ""Jsme tázáni, zda mají být svatí uctíváni s velkou úctou. Mohou být jejich ostatky považovány za svaté, slaveny jejich svátky a vyhledávána jejich přímluva, zatímco naše bohoslužba zůstane vyhrazena jedině [ROOT.Char.GetFaith.HighGodName]?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.transubstantiation.explanation: ""Jsme tázáni, zda se chléb a víno na oltáři kněžským posvěcením skutečně proměňují v Tělo a Krev Kristovu."" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.ora_et_labora.explanation: ""Jsme tázáni, zda má svatý život spojovat modlitbu a práci. Je zahálka nepřítelem duše? Mají být naše práce na poli či ve skriptoriu uctívány stejně jako hodiny [ROOT.Char.Custom('GetReligiousRite')]?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.hyperdulia.explanation: ""Jsme tázáni: má být svatá matka Marie, Bohorodička, uctívána více než všichni ostatní svatí?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.simony.explanation: ""Jsme tázáni: lze za zlato kupovat a prodávat svaté úřady, požehnání či svátosti?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.monophysitism.explanation: ""Jsme tázáni: má Kristus jen jedinou, zcela božskou přirozenost? Je jeho lidství pohlceno a zůstává pouze božství Slova, jež se stalo tělem?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.acts_of_apostles.explanation: ""Jsme tázáni, zda má [ROOT.Char.GetFaith.GetAdjective] církev žít jako v dobách Skutků apoštolů. Máme vyslat misionáře s apoštolským zápalem, aby přinášeli Slovo těm, kdo dosud žijí v temnotě?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.purgatory.explanation: ""Jsme tázáni: mohou být duše, které nejsou ani zcela čisté, ani zcela zavržené, po smrti očištěny? Mohou jim modlitby a obřady živých pomoci na cestě k [ROOT.Char.GetFaith.HighGodName]?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.be_fruitful_and_multiply.explanation: ""Jsme tázáni: je plození dětí posvátným posláním? Mají věřící naplnit zemi svým potomstvem?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.apostolic_succession.explanation: ""Jsme tázáni: pochází autorita biskupů skutečně z jejich nepřerušené posloupnosti od apoštolů?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.confession.explanation: ""Jsme tázáni: musí každý [ROOT.Char.GetFaith.GetAdherentName] vyznat své hříchy knězi, aby dosáhl rozhřešení? Je zpovědní tajemství nedotknutelné?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.original_sin.explanation: ""Jsme tázáni: dědí každá duše Adamův hřích? Jsme poskvrněni od narození a potřebujeme milost křtu?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.celestial_hierarchy.explanation: ""Jsme tázáni: stojí svatí andělé v řadách pod [ROOT.Char.GetFaith.HighGodName]? Má uspořádání [ROOT.Char.GetFaith.GetAdjective] církve odrážet toto nebeské pořadí?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.miles_christi.explanation: ""Jsme tázáni: mají být věřící Kristovými vojáky? Jsme povinni chopit se meče a bránit [ROOT.Char.GetFaith.GetAdjective] církev, kdykoli nás povolá?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.scholasticism.explanation: ""Jsme tázáni: může víra hledat porozumění prostřednictvím rozumu? Mají školy využívat dialektiku a filozofii k uspořádání a obhajobě nauky?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.adoptionism.explanation: ""Jsme tázáni, zda je Kristus ve svém lidství Synem [ROOT.Char.GetFaith.HighGodName] z přijetí za vlastního."" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.love_thy_neighbour.explanation: ""Jsme tázáni, zda má láska k bližnímu zavazovat každého [ROOT.Char.GetFaith.GetAdherentName], i k cizinci a nepříteli, jako spolehlivé měřítko lásky k [ROOT.Char.GetFaith.HighGodName]."" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.divine_liturgy.explanation: ""Jsme tázáni, zda je [ROOT.Char.Custom('GetReligiousRite')], se zpěvem, kadidlem a řádným obřadem, hlavní cestou, kterou věřící přistupují k [ROOT.Char.GetFaith.HighGodName]."" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.miaphysitism.explanation: ""Jsme tázáni, zda jsou v Kristu božská a lidská přirozenost jednou vtělenou přirozeností, bez rozdělení a bez smísení."" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.hesychasm.explanation: ""Jsme tázáni: mohou svatý klid a prostá modlitba srdce — neustále opakovaná — dopřát duši spatřit nestvořené světlo [ROOT.Char.GetFaith.HighGodNamePossessive|U]?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.anachoresis.explanation: ""Jsme tázáni, zda je odvrácení se od světa svaté. Je samota poustevníka skutečnou cestou k [ROOT.Char.GetFaith.HighGodName]?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.mortification_of_the_flesh.explanation: ""Jsme tázáni: prospívá duchu, když se tělo podrobuje půstu, žíněnému rouchu a bičování?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.holy_myron.explanation: ""Jsme tázáni, zda má svatý [Glossary( 'chrism', 'CHRISM_GLOSS' )] stvrzovat křest a korunovaci darem Ducha svatého."" # todo: NEW TRANSLATION
 CHRISM_GLOSS: "Řecky „pomazání“. #bold Křižmo#!, posvěcené biskupem, je vonný svatý olej používaný k pomazání věřících při křtu a biřmování a někdy také při královské korunovaci." # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.khachkar.explanation: ""Jsme tázáni: smějí mezi námi stát vytesané kamenné kříže jako trvalé veřejné svědectví víry a označovat svatá místa i místa posledního odpočinku?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.philanthropia.explanation: ""Jsme tázáni: je péče o chudé závaznou povinností [ROOT.Char.GetFaith.GetAdjective] církve? Musíme financovat almužny, špitály a útulky milosrdenství?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.aniconism.explanation: ""Jsme tázáni, zda mají být všechny svaté obrazy z našich kostelů odstraněny. Je jejich uctívání skutečně modloslužbou světským obrazům, která odvádí naše oči i mysl od [ROOT.Char.GetFaith.HighGodName]?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.alexandrian_catechism.explanation: ""Jsme tázáni: máme v Písmu hledat skryté duchovní významy? Mohou řecké vzdělání a alegorie odhalit to, co prostá slova skrývají?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.armed_pilgrimages.explanation: ""Jsme tázáni: je přijetí kříže a pochod za svatým cílem projevem oddanosti Kristu? Smí meč chránit poutníky a získat zpět to, co drží nevěřící?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.carnal_exaltation.explanation: ""Jsme tázáni: přibližují tělesné slasti duši k božství? Má být touha ctěna a vyhledávána, místo aby byla odmítána jako hřích?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.communal_identity.explanation: ""Jsme tázáni, zda jsou víra a příslušnost k lidu v [ROOT.Char.GetFaith.HighGodName] jedno. Musí cizinci zůstat mimo pravé stádo?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.communion.explanation: ""Jsme tázáni, zda společné posvátné obřady přivolávají přítomnost [ROOT.Char.GetFaith.HighGodName]. Mají být ti, kdo se k nám odmítají připojit, považováni za ty, kdo stojí mimo pravé stádo?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.consolamentum.explanation: ""Jsme tázáni: může poslední duchovní očištění před smrtí smýt všechny hříchy a musí se pak očištěný zříci jídla i života, aby se hřích nevrátil?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.divine_marriage.explanation: ""Jsme tázáni, zda se manželství musí uzavírat pouze uvnitř posvátné pokrevní linie, dokonce i mezi příbuznými, jejichž blízkost by [ROOT.Char.GetFaith.GetAdjective] církev označila za zakázanou."" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.gnosticism.explanation: ""Jsme tázáni: spočívá spása ve skrytém poznání, zjeveném pouze zasvěceným, které osvobozuje božskou jiskru a navrací ji ke zdroji?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.mendicant_preachers.explanation: ""Jsme tázáni: mají mniši žebravých řádů nevlastnit nic? Mají putovat od města k městu a živit se almužnami, aby hlásali Slovo [ROOT.Char.GetFaith.HighGodName]?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.pacifism.explanation: ""Jsme tázáni: nemá meč v životě [ROOT.Char.GetFaith.GetAdherentName] místo? Je myšlenka spravedlivé války mylná?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.pentarchy.explanation: ""Jsme tázáni: má být [ROOT.Char.GetFaith.GetAdjective] církev spravována kolektivně pěti patriarchálními stolci? Znamenalo by to popření prvenství hlavního přímluvce [ROOT.Char.GetFaith.HighGodNamePossessive]?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.unrelenting_faith.explanation: ""Jsme tázáni: musí víra neochvějně vzdorovat pronásledování, strádání i pochybnostem? Jsme povinni stát pevně, ať to stojí cokoli?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.vows_of_poverty.explanation: ""Jsme tázáni, zda nejlépe sloužíme [ROOT.Char.GetFaith.HighGodName], když složíme slib chudoby jako apoštolové."" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.pastoral_isolation.explanation: ""Jsme tázáni: má být stádo ponecháno samo sobě, aby si zachovalo své vlastní způsoby? Má [ROOT.Char.GetFaith.GetAdjective] církev nedůvěřovat cizincům a odmítat jejich vměšování?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.adaptive.explanation: ""Jsme tázáni, zda požadavek všeobecného přijetí našich zvyků a omezení stádo nepoškozuje. Smíme přizpůsobit své zákony světu, v němž musí platit, pokud podstata naší víry zůstane nezměněna?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.esotericism.explanation: ""Jsme tázáni, zda nás tajemství [ROOT.Char.GetFaith.HighGodName] podněcují k hledání poznání o světě kolem nás."" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.legalism.explanation: ""Jsme tázáni: musí posvátný zákon zavazovat každý čin [ROOT.Char.GetFaith.GetAdjective] života? Nemůže žádný hříšník, ať už královského či panovačného původu, stát nad jeho přísnými ustanoveními?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.literalism.explanation: ""Jsme tázáni: je svaté Písmo neměnné a úplné, jediná schránka moudrosti [ROOT.Char.GetFaith.HighGodNamePossessive]?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.reincarnation.explanation: ""Jsme tázáni: vrací se duše v mnoha životech, místo aby jen jednou stanula před soudem [ROOT.Char.GetFaith.HighGodNamePossessive]?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.religious_legal_pronouncements.explanation: ""Jsme tázáni: mohou učenci [ROOT.Char.GetFaith.GetAdjective] církve vydávat závazná rozhodnutí o každé nové otázce víry a zákona?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.struggle_submission.explanation: ""Jsme tázáni, zda se má [ROOT.Char.GetFaith.GetAdjective] život utvářet kolem boje a podrobení. Musí se věřící zcela podřídit vůli [ROOT.Char.GetFaith.HighGodNamePossessive|U]?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.false_conversion_sanction.explanation: ""Jsme tázáni, zda může [ROOT.Char.GetFaith.GetAdherentName] za pronásledování předstírat, že vyznává jinou víru."" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.tax_nonbelievers.explanation: ""Jsme tázáni: mohou nevěřící žít pod nadvládou [ROOT.Char.GetFaith.GetAdjective] vlády, pokud platí daň za ochranu?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.asceticism.explanation: ""Jsme tázáni: hledáme [ROOT.Char.GetFaith.HighGodName] skrze hladovění, strádání a odříkání veškerého tělesného pohodlí?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.bhakti.explanation: ""Jsme tázáni: má se každá duše s láskyplnou oddaností připoutat k jednomu aspektu božství?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.dharmic_pacifism.explanation: ""Jsme tázáni, zda je zakázáno ubližovat všem živým tvorům. Máme se vyhýbat ubližování i bezvýznamným zvířatům a hmyzu?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.inner_journey.explanation: ""Jsme tázáni, zda lze [ROOT.Char.GetFaith.HighGodName] hledat především rozjímáním a poznáním sebe sama."" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.ritual_hospitality.explanation: ""Jsme tázáni: je naší posvátnou povinností přivítat u svého stolu každého cizince?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.adorcism.explanation: ""Jsme tázáni: mají být duchové tohoto světa uctíváni a vítáni, aby nám mohli pomáhat? Nebo je máme vymítat jako nečisté síly?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.ancestor_worship.explanation: ""Jsme tázáni: mají být naši předkové uctíváni modlitbami a obětinami, aby nás mohli chránit a vést?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.astrology.explanation: ""Jsme tázáni: je vůle [ROOT.Char.GetFaith.HighGodNamePossessive] vepsána do hvězd? Znají nebesa tajemství našeho osudu?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.hedonistic.explanation: ""Jsme tázáni: je rozkoš darem, který máme vyhledávat jako formu bohoslužby?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.human_sacrifice.explanation: ""Jsme tázáni, zda lze lidský život obětovat na oltáři. Smí být krev prolita jako posvátný dar pro [ROOT.Char.GetFaith.HighGodName]?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.mystical_birthright.explanation: ""Jsme tázáni: jsou některé duše od narození předurčeny k posvátné moci a duchovnímu vedení, ještě před jakýmkoli pomazáním [ROOT.Char.GetFaith.GetAdjective] církví?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.ritual_celebrations.explanation: ""Jsme tázáni, zda má být [ROOT.Char.GetFaith.GetAdjective] kalendář bohatý na svaté svátky, které věřící sjednocují."" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.sacred_childbirth.explanation: ""Jsme tázáni, zda se na porod musí připravovat posvátnými obřady. Musí být místo porodu očištěno, aby [ROOT.Char.GetFaith.HighGodName] požehnal matce i dítěti?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.sanctity_of_nature.explanation: ""Jsme tázáni, zda jsou lesní háje, prudké řeky a údolí pokrytá rosou svaté. Máme [ROOT.Char.GetFaith.HighGodName] hledat v divočině?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.sun_worship.explanation: ""Jsme tázáni, zda se máme modlit ke slunci. Je toto světlo dávající život naším [ROOT.Char.GetFaith.HighGodName]?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.warmonger.explanation: ""Jsme tázáni: jsou válka a dobývání samy o sobě svatou službou? Je meč nejjistější cestou, jak šířit slovo [ROOT.Char.GetFaith.HighGodName]?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.gruesome_festivals.explanation: ""Jsme tázáni, zda lze svaté dny slavit krví a krutou podívanou. Je takové veselí pravou bohoslužbou před [ROOT.Char.GetFaith.HighGodName]?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.cthonic_redoubts.explanation: ""Jsme tázáni, zda jsou horská návrší a kořeny země svaté. Máme [ROOT.Char.GetFaith.HighGodName] hledat na vrcholcích a podél skrytých kamenitých stezek?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.household_gods.explanation: ""Jsme tázáni: smějí být bohové krbu a domova uctíváni a obsluhováni v [ROOT.Char.GetFaith.GetAdjective] domácnostech?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.sinitic_syncretism.explanation: ""Jsme tázáni: smějí být obřady a kánon vzdáleného Východu začleněny do naší víry?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.eastern_syncretism.explanation: ""Jsme tázáni: smíme se učit od východních vyznání — od věr, které žijí bok po boku a navzájem se neoznačují za zlé — přestože nesdílíme jejich bohy?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.unreformed_syncretism.explanation: ""Jsme tázáni: mohou být staré lidové zvyky nových konvertitů zachovány a tiše se od nich učit, místo abychom je zavrhli a odsoudili?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.christian_syncretism.explanation: ""Jsme tázáni: mohou ti, kdo jsou mimo Krista, stále ctít Jeho učení a příklad, a přitom Ho popírat jako pravého Boha?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.islamic_syncretism.explanation: ""Jsme tázáni: může být zákon Saracénů přijat do [ROOT.Char.GetFaith.GetAdjective] církve a jejich učení smíšeno s evangeliem?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.jewish_syncretism.explanation: ""Jsme tázáni, zda má být zákon a vzdělanost Židů přijata do [ROOT.Char.GetFaith.GetAdjective] církve, i když nesdílíme všechna jejich tvrzení."" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.exaltation_of_pain.explanation: ""Jsme tázáni: je bolest sama o sobě svatá? Je její působení požehnáním a její snášení milostí od [ROOT.Char.GetFaith.HighGodName|U]?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.natural_primitivism.explanation: ""Jsme tázáni: spočívá svatost v opuštění měst a přijetí života v divočině, v návratu k původnímu stavu bytí?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.pursuit_of_power.explanation: ""Jsme tázáni: je nadvláda nad tímto světem posvátným cílem? Naplní uchvácení moci vůli [ROOT.Char.GetFaith.HighGodNamePossessive]?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.ritual_cannibalism.explanation: ""Jsme tázáni: smí se maso mrtvých pojídat jako posvátný obřad?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.sacred_shadows.explanation: ""Jsme tázáni: může být klam svatý? Smějí věřící lhát, a dokonce svým lžím uvěřit, když by pravda ohrozila víru?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.polyamory.explanation: ""Jsme tázáni: mohou věřící sdílet lásku s mnohými a zavrhnout tvrzení, že něčí duše vlastní náklonnost druhého?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.sacrificial_ceremonies.explanation: ""Jsme tázáni, zda smí být lidský život obětován při posvátném obřadu. Smějí se ochotní obětovat sami a viníci být obětováni na [ROOT.Char.GetFaith.GetAdjective] oltářích?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.megaliths.explanation: ""Jsme tázáni: musí být stavěny mohutné kamenné monumenty jako svědectví o věčné slávě [ROOT.Char.GetFaith.HighGodNamePossessive]?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.communal_possessions.explanation: ""Jsme tázáni, zda se věřící musí o veškerý majetek dělit."" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.pure_land.explanation: ""Jsme tázáni: dosahuje se požehnané říše bez utrpení pouze důvěrou a oddaností, a nikoli bohatstvím, učeností či mistrovstvím v obřadech?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.no_mind.explanation: ""Jsme tázáni: hledá se [ROOT.Char.GetFaith.HighGodName] skrze prázdnotu mysli a umlčení vlastního já?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.mountain_worship.explanation: ""Jsme tázáni: jsou vyvýšená místa skutečně vysoká a svatá? Hledá se [ROOT.Char.GetFaith.HighGodName] nejlépe na vrcholcích hor?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.extinction_of_dharma.explanation: ""Jsme tázáni: nastává temný věk, kdy se mezi námi potulují démoni v rouše zbožnosti? Musíme tyto nepřátele zabíjet, abychom bránili posvátný zákon, zatímco upadá?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.cranial_trophies.explanation: ""Jsme tázáni: mají se z hlav zabitých vyrábět posvátné trofeje?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.pursuit_of_knowledge.explanation: ""Jsme tázáni, zda je hledání vědění posvátnou povinností."" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.benevolent_governance.explanation: ""Jsme tázáni, zda je spravedlivá vláda posvátným závazkem, který musí [ROOT.Char.GetFaith.GetAdjective] knížata dodržovat."" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.filial_piety.explanation: ""Jsme tázáni: přikazuje [ROOT.Char.GetFaith.HighGodName] úctu k rodičům a starším?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.harmonious_society.explanation: ""Jsme tázáni: je společenský soulad, kdy každá duše zná své místo, základem [ROOT.Char.GetFaith.GetAdjective] řádu?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.sacred_destruction.explanation: ""Jsme tázáni: může být ničení samo o sobě svaté? Požaduje od nás [ROOT.Char.GetFaith.HighGodName] stržení starého?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.preservation.explanation: ""Jsme tázáni: spočívá svatost v tom, co je vybudováno a zachováno? Musíme pečovat o [ROOT.Char.GetFaith.GetAdjective] chrámy a díla, aby navždy vzkvétaly?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.desc.takamin.explanation: ""Jsme tázáni: je mocný medvěd nádobou božského? Musí lov vzdávat poctu velikému zvířeti jako posvátnému a zabít ho pouze s posvátnou úctou?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.a_1: "Nahradí [current_core_1.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]." # todo: NEW TRANSLATION
 ecumenical_council_events.0010.a_2: "Uvolním mu místo odstraněním [current_core_2.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]." # todo: NEW TRANSLATION
 ecumenical_council_events.0010.a_3: "[current_core_3.GetNameNoTooltip(ROOT.GetCharacter.GetRite)] musí skončit." # todo: NEW TRANSLATION
 ecumenical_council_events.0010.b: "Tuto praktiku zakažte!" # todo: NEW TRANSLATION
 ecumenical_council_events.0010.c: "Prozatím její dodržování jednoduše povolím." # todo: NEW TRANSLATION
 ecumenical_council_events.0010.d: "Přinejmenším uznejme tuto zásadu." # todo: NEW TRANSLATION
