 pam_ecumenical_council_rite_quarrel_ruled_tt: "Rozhodnutí otázku definitivně uzavírá: #N +[EmptyScope.ScriptValue('pam_great_schism_progress_rite_quarrel_overruled_value')|0]#! pokroku směrem ke [Concept('schism','schizmatu')|E]"
 pam_great_schism_progress_head_of_rite_murdered_tt: "Vražda [Concept('head_of_rite','hlavy ritu')|E]: #N +[EmptyScope.ScriptValue('pam_great_schism_progress_head_of_rite_murdered_value')|0]#! pokroku směrem ke [Concept('schism','schizmatu')|E]"
 pam_great_schism_progress_head_of_rite_excommunicated_tt: "Anatéma [Concept('head_of_rite','hlavy ritu')|E]: #N +[EmptyScope.ScriptValue('pam_great_schism_progress_head_of_rite_excommunicated_value')|0]#! pokroku směrem ke [Concept('schism','schizmatu')|E]"
 pam_great_schism_progress_excommunication_tt: "Exkomunikace napříč rity: #N +[EmptyScope.ScriptValue('pam_great_schism_progress_excommunication_value')|0]#! pokroku směrem ke [Concept('schism','schizmatu')|E]"
 pam_great_schism_progress_rite_war_tt: "Válka mezi rity: #N +[EmptyScope.ScriptValue('pam_great_schism_progress_rite_war_value')|0]#! pokroku směrem ke [Concept('schism','schizmatu')|E]"
 pam_great_schism_progress_holy_site_tt: "Snížení významu svatého místa: #N +[EmptyScope.ScriptValue('pam_great_schism_progress_holy_site_value')|0]#! pokroku směrem ke [Concept('schism','schizmatu')|E]"
 pam_great_schism_progress_county_conversion_tt: "Obrácení svatého místa na jiný ritus: #N +[EmptyScope.ScriptValue('pam_great_schism_progress_county_conversion_value')|0]#! pokroku směrem ke [Concept('schism','schizmatu')|E]"
 pam_great_schism_progress_county_conversion_edge_tt: "Svaté místo ztracené ritem zapojeným do schizmatu: #N +[EmptyScope.ScriptValue('pam_great_schism_progress_county_conversion_edge_value')|0]#! pokroku směrem ke [Concept('schism','schizmatu')|E]"
 pam_great_schism_progress_rite_conversion_tt: "Vládce přešel mezi rity: #N +[EmptyScope.ScriptValue('pam_great_schism_progress_rite_conversion_value')|0]#! pokroku směrem ke [Concept('schism','schizmatu')|E]"
 pam_ecumenical_council_roman_guests_custom: "Každý host koncilu, který se označuje jako [GetRiteByKey('roman_rite').GetAdherentName|l]"
 pam_ecumenical_council_greek_guests_custom: "Každý host koncilu, který se označuje jako [GetRiteByKey('byzantine_rite').GetAdherentName|l]"
 pam_ecumenical_council_overruled_guests_custom: "Hosté ritu, proti němuž bylo rozhodnuto a který dostal příkaz místo slyšení"
 pam_rite_quarrel_championed_opinion: "Zastání mého ritu na ekumenickém koncilu"
 pam_rite_quarrel_slighted_opinion: "Podpora druhého ritu proti mému na ekumenickém koncilu"
 pam_rite_quarrel_overruled_opinion: "Rozhodnutí na ekumenickém koncilu proti mému ritu"
 ecumenical_council_summons_events.0060.t: "První mezi rovnými"
 ecumenical_council_summons_events.0060.desc: "[ec_roman_champion.GetTitledFirstName|U], zastupující ritus [GetRiteByKey('roman_rite').GetName], se otázky nehodlá vzdát:\n\n„Každá církev odpovídá Římu a Řím neodpovídá nikomu!“\n\n[ec_greek_champion.GetTitledFirstName|U] odpočítává na prstech pět patriarchů:\n\n„Který z nich kdy poklekl?“"
 ecumenical_council_summons_events.0060.a: "„Klid, vy dva. Koncil ještě ani nezačal.“"
 ecumenical_council_summons_events.0060.a.success: "Oba diskutující se podařilo uklidnit a zabránit chaosu"
 ecumenical_council_summons_events.0060.a.failure: "Ani jeden mě nechce poslouchat a sál se rozděluje na dva tábory"
 ecumenical_council_summons_events.0060.b: "Petr dostal klíče a Řím je drží."
 ecumenical_council_summons_events.0060.c: "Řím je první mezi rovnými. Nic víc."
 ecumenical_council_summons_events.0060.d: "Tento úřad zastávám já. Otázka je uzavřena."
 ecumenical_council_summons_events.0061.t: "I Syna"
 ecumenical_council_summons_events.0061.desc: "„Dvě slova,“ začíná [ec_greek_champion.GetTitledFirstName], zastupující ritus [GetRiteByKey('byzantine_rite').GetName]. „Dvě slova, která do vyznání víry vložili [GetRiteByKey('roman_rite').GetAdherentNamePlural|l], aniž se poradili s Východem.“\n\n„Pravda odpovídá jedině Bohu,“ odvětí [ec_roman_champion.GetTitledFirstName]."
 ecumenical_council_summons_events.0061.a: "Vyznání víry přečkalo horší věci než spor o jeho znění."
 ecumenical_council_summons_events.0061.a.success: "Otázka znění je odložena dřív, než se spor vyhrotí"
 ecumenical_council_summons_events.0061.a.failure: "Spor na obou stranách zatvrdne v doktrínu"
 ecumenical_council_summons_events.0061.b: "Ta slova byla přidána, protože jsou pravdivá."
 ecumenical_council_summons_events.0061.c: "Vyznání víry sepsal koncil. Jen koncil je smí změnit."
 ecumenical_council_summons_events.0061.d: "Zde se vyznání víry bude říkat tak, jak je říkám já."
 ecumenical_council_summons_events.0062.t: "Chléb na oltáři"
 ecumenical_council_summons_events.0062.desc: "[ec_roman_champion.GetTitledFirstName|U] zvedá hostii, tenkou a bledou jako pergamen:\n\n„[GetRiteByKey('roman_rite').GetAdherentNamePlural|U] nikdy nepotřebovali víc.“\n\n[ec_greek_champion.GetTitledFirstName|U] vedle ní pokládá kynutý bochník:\n\n„Takže se [GetRiteByKey('byzantine_rite').GetAdherentNamePlural|l] mýlí už od dob apoštolů?“"
 ecumenical_council_summons_events.0062.a: "Zítra u mého oltáře požehnáme oběma chlebům a z obou budeme jíst."
 ecumenical_council_summons_events.0062.a.success: "Oba chleby jsou snědeny a s nimi zmizí i spor"
 ecumenical_council_summons_events.0062.a.failure: "Toho večera jsou připraveny dva oltáře a ulička mezi nimi zůstává prázdná"
 ecumenical_council_summons_events.0062.b: "Nekvašený, jako při poslední večeři."
 ecumenical_council_summons_events.0062.c: "Vzkříšený Pán si zaslouží vzešlý chléb."
 ecumenical_council_summons_events.0062.d: "Chléb je chléb. Záleží na požehnání."
 ecumenical_council_summons_events.0063.t: "Otázka jazyka"
 ecumenical_council_summons_events.0063.desc: "Modlitby jsou přednášeny latinsky. [GetRiteByKey('byzantine_rite').GetAdherentNamePlural|U] v lavicích čekají na překlad a po jeho vyslechnutí se mračí. [ec_greek_champion.GetTitledFirstName|U] zamumlá:\n\n„Římané se přou jako právníci. Samá slova a žádný obsah.“\n\n„Řekové se přou jako filozofové! Nikdy nic nerozhodli,“ odpovídá [ec_roman_champion.GetTitledFirstName]."
 ecumenical_council_summons_events.0063.a: "Najděme tedy slova, která obstojí v obou jazycích."
 ecumenical_council_summons_events.0063.a.success: "Podaří se najít znění, které žádná strana nemůže překroutit"
 ecumenical_council_summons_events.0063.a.failure: "Obě strany odcházejí přesvědčeny, že druhá jednala nepoctivě"
 ecumenical_council_summons_events.0063.b: "Řekněte to latinsky a řekněte to jasně."
 ecumenical_council_summons_events.0063.c: "Otcové psali řecky. Dokážeme to přečíst."
 ecumenical_council_summons_events.0063.d: "Vydám to v obou jazycích. Otázka je uzavřena."
