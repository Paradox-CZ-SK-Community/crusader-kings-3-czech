 pam_great_schism_progress_head_of_rite_excommunicated_tt: "Anathema proti [head_of_rite|E]: pokrok směrem k [schism|E] #N +[EmptyScope.ScriptValue('pam_great_schism_progress_head_of_rite_excommunicated_value')|0]#!" # todo: NEW TRANSLATION
