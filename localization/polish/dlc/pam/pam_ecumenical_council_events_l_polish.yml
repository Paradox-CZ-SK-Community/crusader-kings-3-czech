 ecumenical_council_events.0126.t: "Mezi soky"
 ecumenical_council_events.0126.desc: "Je zkouškou najít mezi shromážděnými [rival.Custom('CZ_TitledFirstName_A')]; je to [ROOT.Char.Custom2('RelationToMe', rival)|l].\n\n„Jistě víš, proč tu jsem,“ zavrčí. „Řekni své, vyber si stranu... čekám jen na možnost hlasovat proti tobě.“"
 ecumenical_council_events.0126.a: "Hlasuj podle svědomí, ne podle nenávisti."
 ecumenical_council_events.0126.b: "Ponech si svou zášť. Nenechám se vyprovokovat."
 ecumenical_council_events.0126.c: "Koncil odvádí [Select_CString(rival.IsFemale,'její','jeho')|l] pozornost..."
