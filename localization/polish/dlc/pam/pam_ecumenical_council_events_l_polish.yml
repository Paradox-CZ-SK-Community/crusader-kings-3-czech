 ecumenical_council_events.0116.t: "Kdo to zaplatí?"
 ecumenical_council_events.0116.desc: "Správci několika biskupských stolců se přou o čísla jako lichváři.\n\n„Má diecéze si nemůže dovolit další otřesy,“ říká [lead_conservative.GetTitledFirstName]. „Nové knihy pro každou farnost, poslové na každé místo, kde stojí [lead_conservative.GetFaith.HouseOfWorship|l]. Jestli to projde, desátky na to nestačí.“\n\n„A jestli to neprojde?“ ptá se [lead_innovator.GetTitledFirstName]. „Přeme se už celé roky a to stříbro je ztracené bez ohledu na náš hlas. Financujme alespoň zákon, který bude stádo dodržovat.“"
 ecumenical_council_events.0116.support: "Ano, proč truchlit nad stříbrem, které už je utracené?"
 ecumenical_council_events.0116.support_duel: "Vysvětlím, že podpora je investice!"
 ecumenical_council_events.0116.support_duel.success: "Vyhlídky je zlákají k reformě"
 ecumenical_council_events.0116.support_duel.success_halved: "Někteří přijmou tuto formulaci"
 ecumenical_council_events.0116.support_duel.failure: "Stále naříkají nad výdaji"
 ecumenical_council_events.0116.oppose: "Má diecéze si tento otřes nemůže dovolit."
