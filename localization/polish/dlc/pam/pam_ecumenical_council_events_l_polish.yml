 ecumenical_council_events.0120.t: "Jména v kronice"
 ecumenical_council_events.0120.desc: "Několik nejproslulejších hostů zůstává stranou jednání a zvažuje, co bude s jejich pověstí, až bude všechno zapsáno.\n\n„Mé jméno je v každé nedávno sepsané kronice. Proč bych je [Select_CString(lead_conservative.IsFemale,'měla','měl')|l] spojovat s dekretem, kterému se možná budou smát navěky?“ říká [lead_conservative.GetTitledFirstName].\n\n„Lidé si pamatují, kdo spor urovnal, ne kdo si zachoval čisté ruce. A právě tak si budou pamatovat mě,“ odpovídá [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0120.support: "„Nejsme snad vůdci církve?“"
 ecumenical_council_events.0120.support_duel: "„Nezůstanete sami!“"
 ecumenical_council_events.0120.support_duel.success: "Pochybující se odevzdávají dějinám"
 ecumenical_council_events.0120.support_duel.success_halved: "Někteří se odevzdávají dějinám"
 ecumenical_council_events.0120.support_duel.failure: "Stále se vyhýbají závazku"
 ecumenical_council_events.0120.oppose: "Nepřipojím své jméno k něčemu, co bude všem pro smích."
 ecumenical_council_events.0120.oppose_duel: "„Hlupáci urovnávají spory... prosazováním paskvilů.“"
 ecumenical_council_events.0120.oppose_duel.success: "Okruh stoupenců [lead_innovator.Custom('CZ_TitledFirstNameNoTooltip_G')] ustupuje"
