 ecumenical_council_events.0120.t: "Jména v kronice" # todo: NEW TRANSLATION
 ecumenical_council_events.0120.desc: "Několik nejproslulejších hostů se drží stranou od sněmovního sálu a přemýšlí, jak jejich pověst obstojí, až se to všechno zapíše.\n\n„Mé jméno se objevuje v každé kronice napsané v poslední době. Proč bych se měl spojovat s dekretem, kterému se mohou věčně vysmívat?“ říká [lead_conservative.GetTitledFirstName].\n\n„Lidé si pamatují, kdo spor urovnal, ne kdo si zachoval čisté ruce. A tak si mě budou pamatovat,“ odpovídá [lead_innovator.GetTitledFirstName]." # todo: NEW TRANSLATION
 ecumenical_council_events.0120.support: ""Nejsme snad vůdci církve?"" # todo: NEW TRANSLATION
 ecumenical_council_events.0120.support_duel: ""Nebudeš na to sám!"" # todo: NEW TRANSLATION
 ecumenical_council_events.0120.support_duel.success: "Pochybovači se odevzdávají dějinám" # todo: NEW TRANSLATION
 ecumenical_council_events.0120.support_duel.success_halved: "Někteří se odevzdávají dějinám" # todo: NEW TRANSLATION
 ecumenical_council_events.0120.support_duel.failure: "Zůstávají nepolapitelní" # todo: NEW TRANSLATION
 ecumenical_council_events.0120.oppose: "S touhle fraškou nechci mít své jméno nic společného." # todo: NEW TRANSLATION
 ecumenical_council_events.0120.oppose_duel: ""Hlupáci řeší spory... prosazováním parodií."" # todo: NEW TRANSLATION
