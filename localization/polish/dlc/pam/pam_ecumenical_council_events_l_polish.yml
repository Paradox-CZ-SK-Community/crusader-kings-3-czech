 ecumenical_council_events.0110.t: "Přehnané ambice"
 ecumenical_council_events.0110.desc: "„Jde jen o drobnou úpravu!“ říká [lead_innovator.GetTitledFirstName]. „A pomůžeme-li ji prosadit, získáme dobré postavení mezi uchazeči o úřad, jehož nositelem je [lead_innovator.GetFaith.ReligiousHeadName|l].“\n\n„Vaše přehnané ambice přeskakují samy sebe a budou zkázou nás všech,“ ušklíbne se [lead_conservative.GetTitledFirstName]."
 ecumenical_council_events.0110.support: "Trocha ctižádosti má své místo."
 ecumenical_council_events.0110.support_duel: "Budu dál hájit postup vpřed!"
 ecumenical_council_events.0110.support_duel.success: "Přijímají, že jde jen o drobnou úpravu"
 ecumenical_council_events.0110.support_duel.success_halved: "Někteří uznávají výhody podpory"
 ecumenical_council_events.0110.support_duel.failure: "Tvá chamtivost je zřejmá"
 ecumenical_council_events.0110.oppose: "Pýcha předchází pád."
 ecumenical_council_events.0110.oppose_duel: "Budu varovat před zlem ctižádosti!"
