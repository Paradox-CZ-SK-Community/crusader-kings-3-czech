 pam_pentarchy_see_visited_message_desc: "Navštívili jste další ze sídel posvátných pro vaši víru.\n\nNavštívili jste [pam_pentarchy_pilgrim.MakeScope.Var('pam_pentarchy_sees_count').GetValue|0] z celkových [pam_pentarchy_pilgrim.MakeScope.Var('pam_pentarchy_sees_total').GetValue|0] [holy_sites|E]." # todo: NEW TRANSLATION
