 pam_pentarchy_circuit_completed_toast_desc: "Navštívili jste všechna sídla uznávaná vaší vírou a každému jste prokázali stejnou úctu" # todo: NEW TRANSLATION
 pam_pentarchy_circuit_entourage_tt: "Každý, kdo s vámi cestuje, získá #V 1#! bod [skill|E]" # todo: NEW TRANSLATION
