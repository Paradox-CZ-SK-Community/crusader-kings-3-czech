 pam_tenet_events.0004.opening.hof: "Nejctěnější [diverged_rite.GetFaith.GetReligiousHead.Custom('CZ_TitleAsNameNoTooltip_V')],"
 pam_tenet_events.0004.opening.ruler: "[diverged_hor.Custom2('AppropriateGreeting', ROOT.Char)|U]"
 pam_tenet_events.0004.desc.forward_tenet: "Píši vám, abych vás zpravil, že ritus [diverged_rite.GetName] přijal mezi své zásady [diverged_added_tenet.GetBaseName].\n\nRitus, který moudře vede své věřící, posiluje celou [CZFaithAdjDecline(diverged_rite.GetFaith,'ou')|l] víru. To je prostá pravda."
 pam_tenet_events.0004.desc.forward_doctrine: "Píši vám, abych vás zpravil, že ritus [diverged_rite.GetName] se nyní oficiálně řídí doktrínou [diverged_added_doctrine.GetDescriptiveName(diverged_rite.GetFaith.Self)].\n\nRitus, který správně vede své věřící, posiluje celou [CZFaithAdjDecline(diverged_rite.GetFaith,'ou')|l] víru. To je prostá pravda."
 pam_tenet_events.0004.desc.backward_tenet: "Píši vám, abych vás zpravil, že ritus [diverged_rite.GetName] přijal mezi své zásady [diverged_added_tenet.GetBaseName].\n\nDíky tomu se přibližujeme hlavnímu ritu [diverged_rite.GetFaith.GetMainRite.GetName]. Když všechny rity hovoří jedním hlasem, [diverged_rite.GetFaith.GetName|U] vzkvétá!"
 pam_tenet_events.0004.desc.backward_doctrine: "Píši vám, abych vás zpravil, že ritus [diverged_rite.GetName] se od nynějška řídí doktrínou [diverged_added_doctrine.GetDescriptiveName(diverged_rite.GetFaith.Self)].\n\nDíky tomu se přibližujeme hlavnímu ritu [diverged_rite.GetFaith.GetMainRite.GetName]. Když jednotlivé směry dosáhnou jednoty, [diverged_rite.GetFaith.GetName|U] jen získává na síle!"
 pam_tenet_events.0004.a: "Budiž."
 pam_tenet_events.0004.a.tt.diverged: "Ritus [diverged_rite.GetName] se ještě více vzdálil od [Concept('mainline_rite','hlavního ritu')|E] [diverged_rite.GetFaith.GetMainRite.GetName], čímž se urychlí každoroční pokles [fervor_i][Concept('fervor','horlivosti')|E]"
 pam_tenet_events.0004.a.tt.consolidated: "Ritus [diverged_rite.GetName] se přiblížil k [Concept('mainline_rite','hlavnímu ritu')|E] [diverged_rite.GetFaith.GetMainRite.GetName], čímž se zpomalí každoroční pokles [fervor_i][Concept('fervor','horlivosti')|E]"
 pam_tenet_events.0005.opening: "[redistributing_liege.Custom2('AppropriateGreeting', ROOT.Char)|U]"
 pam_tenet_events.0005.desc: "Vzdal jsem se poloviny svého bohatství ve prospěch chudých, a přesto jsem díky tomu bohatší než dřív.\n\nStejnou polovinu nyní požaduji od tebe. Prázdné ruce lze omluvit. Na ty plné se však nezapomíná."
 pam_tenet_events.0005.a: "Když to unese [redistributing_liege.GetTitleAsNameNoTooltip], unesu to i já."
 pam_tenet_events.0005.b: "Mé ruce jsou plné a takové také zůstanou."
 pam_tenet_events.0005.b.tt: "Tvé pokladnice zůstanou nedotčené a tvá [Concept('counties','hrabství')|E] nic nedostanou"
 pam_tenet_events.0006.t: "Skryté nauky"
 pam_tenet_events.0006.desc_intro: "Na mém stole leží rozložené knihy bez jakéhokoli označení. Jejich nákresy jsou vystaveny mému pohledu a jejich názvy se příčí samotnému jazyku. Je to vědění, před nímž jsou všichni řádní věřící varováni. Já si však dopřávám celou noc, abych je prozkoumal."
 pam_tenet_events.0006.desc_witness: "\n\n[mystic_witness.GetTitledFirstName|U] se zastaví na prahu a odmítá vstoupit. „Tyto věci jsou zamčené a zahalené modlitbami z dobrého důvodu,“ zazní tichý šepot. „Jakmile jednou spatříš, co se v nich skrývá, už to nikdy nedokážeš zapomenout.“"
 pam_tenet_events.0006.desc_alone: "\n\nNikdo z mých dvořanů se mnou nad těmito stránkami nechce strávit ani okamžik. Jejich obsahu tak čelím bez společnosti a bez jediné rady."
 pam_tenet_events.0006.a: "V těchto knihách není nic, co bych nedokázal pochopit. Budu číst dál."
 pam_tenet_events.0006.b: "Půjdu jen tak daleko, dokud bude hořet lampa."
 pam_tenet_events.0007.t: "Rady mrtvých"
 pam_tenet_events.0007.desc: "Dveře jsou zajištěné závorami a lampy zhasnuté. Svět se kolem mě zmenšuje, až zbývá jen jediný skomírající plamínek a hustý dým, který se kolem mě svíjí. Za tím dusivým závojem už cítím neklidnou přítomnost [guiding_forebear.Custom('CZ_TitledFirstName_G')].\n\nV temnotě odhaluji svá nejtíživější trápení, o nichž bych se za denního světla neodvážil ani promluvit. Duchové neodpovídají jako smrtelníci. Jejich odpovědi přicházejí v hrobovém šepotu, v praskání neklidného plamene, v letmém doteku neviditelného vánku i ve stínech, které se probouzejí v kouři.\n\nZoufale toužím po vedení a v každém sebemenším znamení hledám odpověď, kterou ze všeho nejvíce potřebuji."
 pam_tenet_events.0007.a: "Propůjč mi moudrost, která tě kdysi vedla."
 pam_tenet_events.0007.b: "Dopřej mi klid, abych dokázal čelit novému dni."
 pam_tenet_events.0008.t: "Vzpomínka na vlastní já"
 pam_tenet_events.0008.desc: "[Select_CString(remembered_forebear.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('remembered_forebear'))|l] [remembered_forebear.GetTitledFirstName] – pečeť, pohár a prsten, které jsem kdysi sňal z [Select_CString(remembered_forebear.IsFemale,'její','jeho')] ruky, mám nyní před sebou. Pečlivě je uspořádám a usednu k nim. Pomalu přestávají působit jako vypůjčené předměty.\n\nNic se nezjevuje. Nikdo nepromlouvá. Nejde o vyprávění o [remembered_forebear.Custom('CZ_TitledFirstName_L')]. Připomíná se mi mé vlastní já, povaha, kterou jsem s oním životem odložil, ale nikdy doopravdy neztratil."
 pam_tenet_events.0008.a: "To jsem [Select_CString(ROOT.Char.IsFemale,'byla','byl')] já: [remembered_trait_1.GetNameNoTooltip(ROOT.Char)|l] skrz naskrz."
 pam_tenet_events.0008.b: "Probouzím se a v srdci znovu nacházím rys [remembered_trait_2.GetNameNoTooltip(ROOT.Char)|l]. Poznávám v něm svou vlastní povahu."
 pam_tenet_events.0008.c: "Ano. Tehdy jsem [Select_CString(ROOT.Char.IsFemale,'byla','byl')] [remembered_trait_3.GetNameNoTooltip(ROOT.Char)|l] a mohu se k tomu vrátit."
 pam_tenet_events.0008.d: "Ty životy už skončily. Já zůstávám [Select_CString(ROOT.Char.IsFemale,'sama sebou','sám sebou')]."
 pam_tenet_events.0009.t: "Otevřete truhly"
 pam_tenet_events.0009.desc_intro: "Truhly už byly vyneseny na nádvoří a klíče svírám v ruce."
 pam_tenet_events.0009.desc_witness: " [redistribution_witness.GetTitledFirstName] prochází podél jejich řady.\n\n„Ať je [ROOT.Char.GetTitleAsNameNoTooltip] sebeštědřejší, pořád zůstává [ROOT.Char.GetTitleAsNameNoTooltip],“ zazní. „Nikdo nedosáhne spásy pouhou štědrostí. Spasen bude teprve ten, komu už nezbude nic, co by si mohl ponechat.“"
 pam_tenet_events.0009.desc_alone: " V tomhle jsem [Select_CString(ROOT.Char.IsFemale,'sama','sám')]. Správci stojí opodál a mlčky čekají, jak to všechno dopadne."
 pam_tenet_events.0009.desc_end: "\n\nSvou vlastní truhlu dokážu otevřít pouhým otočením klíče. Zbytek bohatství však budu muset zabavit."
 pam_tenet_events.0009.a: "Rozbijte zámky. Ať si každý vezme svůj díl."
 pam_tenet_events.0009.flavor: "Tví vazalové, kteří mají peněz nazbyt, budou přinuceni otevřít své pokladnice. Tvá hrabství získají více svobody, ale bude těžší je ovládat. Ti, kdo tuto zásadu nesdílejí, ti to budou mít za zlé."
 pam_tenet_events.0009.b: "Počkat. Stačí rozdat jen mé vlastní bohatství."
 pam_tenet_events.0009.b.tt: "Rozdělíš pouze svůj vlastní majetek. Tví [Concept('vassals','vazalové')|E] si ponechají své pokladnice zavřené a nebudou ti to zazlívat"
 pam_tenet_events.0010.t: "Co tělo dluží"
 pam_tenet_events.0010.desc_intro: "Důtky visí na svém obvyklém místě. Dnes večer k nim však přibyly železné nástroje a krátký nůž. Obojí jsem si [Select_CString(ROOT.Char.IsFemale,'opatřila','opatřil')] tajně a bez cizí pomoci."
 pam_tenet_events.0010.desc_alone: "\n\nDnes večer mi nikdo nepodrží lampu. Ať si z toho stolu vezmu cokoli, nikdo u toho nebude."
 pam_tenet_events.0010.a: "Důtky. Dokud se má mysl neutiší."
 pam_tenet_events.0010.b: "Ať už nikdy nemusím spatřit tento svět."
 pam_tenet_events.0010.c: "Zbavím se chtíče a s ním i hříchu."
