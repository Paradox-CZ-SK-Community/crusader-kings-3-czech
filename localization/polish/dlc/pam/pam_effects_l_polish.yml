 pam_tenet_events.0004.opening.hof: "Nejváženější [diverged_rite.GetFaith.GetReligiousHead.GetTitleAsNameNoTooltip]," # todo: NEW TRANSLATION
 pam_tenet_events.0004.opening.ruler: "[diverged_hor.Custom2('AppropriateGreeting', ROOT.Char)]" # todo: NEW TRANSLATION
 pam_tenet_events.0004.desc.forward_tenet: "Píši Vám, abych Vás informoval, že [diverged_rite.GetName] přijal mezi své zásady [diverged_added_tenet.GetBaseName].\n\nObřad, který moudře vede své věřící, posiluje celou víru [diverged_rite.GetFaith.GetAdjective]. To je prostá moudrost." # todo: NEW TRANSLATION
 pam_tenet_events.0004.desc.forward_doctrine: "Píši vám, abych vás informoval, že [diverged_rite.GetName] nyní oficiálně vyznává [diverged_added_doctrine.GetDescriptiveName( diverged_rite.GetFaith.Self )].\n\nRitus, který dobře vede svůj lid, posiluje víru [diverged_rite.GetFaith.GetAdjective] jako celek. To je prostá moudrost." # todo: NEW TRANSLATION
 pam_tenet_events.0004.desc.backward_tenet: "Píši vám, abych vás informoval, že [diverged_rite.GetName] přijal [diverged_added_tenet.GetBaseName] jako jednu ze svých zásad.\n\nDíky tomu se přibližujeme k [diverged_rite.GetFaith.GetMainRite.GetName]. Když jeho obřady mluví jedním hlasem, víra [diverged_rite.GetFaith.GetAdjective] vzkvétá!" # todo: NEW TRANSLATION
 pam_tenet_events.0004.desc.backward_doctrine: "Píši vám, abych vás informoval, že [diverged_rite.GetName] od nynějška vyznává [diverged_added_doctrine.GetDescriptiveName( diverged_rite.GetFaith.Self )].\n\nDíky tomu se přibližujeme k [diverged_rite.GetFaith.GetMainRite.GetName]. A když jsou sekty zajedno, víra [diverged_rite.GetFaith.GetAdjective] sílí!" # todo: NEW TRANSLATION
 pam_tenet_events.0004.a: "Budiž." # todo: NEW TRANSLATION
 pam_tenet_events.0004.a.tt.diverged: "[rite|E] [diverged_rite.GetName] se ještě více vzdálil od [mainline_rite|E] [diverged_rite.GetFaith.GetMainRite.GetName], což způsobuje rychlejší každoroční pokles [fervor_i][fervor|E]" # todo: NEW TRANSLATION
 pam_tenet_events.0004.a.tt.consolidated: "[rite|E] [diverged_rite.GetName] se přiblížil k [mainline_rite|E] [diverged_rite.GetFaith.GetMainRite.GetName], což způsobuje pomalejší každoroční pokles [fervor_i][fervor|E]" # todo: NEW TRANSLATION
 pam_tenet_events.0005.opening: "[redistributing_liege.Custom2('AppropriateGreeting', ROOT.Char)]" # todo: NEW TRANSLATION
 pam_tenet_events.0005.desc: "Rozdal jsem polovinu svého jmění chudým a díky tomu jsem bohatší.\n\nPožaduji od vás totéž. Prázdné ruce vám odpustím. Plné si zapamatuji." # todo: NEW TRANSLATION
 pam_tenet_events.0005.a: "Když to můj [redistributing_liege.GetTitleAsNameNoTooltip] zvládne, zvládnu to také." # todo: NEW TRANSLATION
 pam_tenet_events.0005.b: "Mé ruce jsou plné a takové i zůstanou." # todo: NEW TRANSLATION
 pam_tenet_events.0005.b.tt: "Vaše pokladnice zůstane taková, jaká je, a vaše [counties|E] nedostanou nic" # todo: NEW TRANSLATION
 pam_tenet_events.0006.t: "Skryté učení" # todo: NEW TRANSLATION
 pam_tenet_events.0006.desc_intro: "Nepopsané knihy leží rozložené na mém stole, jejich nákresy odhalené a jejich jména příliš nepatřičná, než aby je vyslovila lidská ústa. Toto je učení, před nímž jsou prostí zbožní varováni, a já si s ním koupil noc." # todo: NEW TRANSLATION
 pam_tenet_events.0006.desc_witness: "\n\n[mystic_witness.GetTitledFirstName] se zastaví na prahu a dál už nevkročí. „Tyto věci jsou z nějakého důvodu uzamčené a opředené modlitbami,“ zamumlá [mystic_witness.GetSheHe]. „Jakmile se podíváš, už nemůžeš zapomenout, co se tam skrývá.“" # todo: NEW TRANSLATION
 pam_tenet_events.0006.desc_alone: "\n\nNikdo z mých dvořanů se mnou nad těmito stránkami nebude sedět. Jejich obsah poznávám sám, bez rádce." # todo: NEW TRANSLATION
 pam_tenet_events.0006.a: "Nic z těchto stránek není nade mnou. Čti dál." # todo: NEW TRANSLATION
 pam_tenet_events.0006.b: "Pokračuj, dokud lampa hoří, a ani o krok dál." # todo: NEW TRANSLATION
 pam_tenet_events.0007.t: "Rada mrtvých" # todo: NEW TRANSLATION
 pam_tenet_events.0007.desc: "Dveře jsou zatarasené a lampy zhasnuté. Svět se zmenšuje, až z něj zbývá jediný chřadnoucí plamen a kouř, který se kolem mě hustě vlní. Už cítím, jak se za dýmnou clonou svíjí přítomnost [guiding_forebear.GetTitledFirstName].\n\nVe tmě odhaluji tíživé starosti, které se za denního světla neodvažuji vyslovit. Duchové neodpovídají jako smrtelníci, nýbrž prostřednictvím hrobového šeptání, praskání neklidného plamene, závanů neviditelného vzduchu a přízraků čeřících kouř.\n\nZoufalý po radě pátrám očima v každém znamení po odpovědi, kterou nejvíc potřebuji." # todo: NEW TRANSLATION
 pam_tenet_events.0007.a: "Propůjč mi moudrost, která vedla tebe." # todo: NEW TRANSLATION
 pam_tenet_events.0007.b: "Daruj mi dostatek klidu, abych čelil úsvitu." # todo: NEW TRANSLATION
 pam_tenet_events.0008.t: "Vzpomínka na sebe" # todo: NEW TRANSLATION
 pam_tenet_events.0008.desc: "Pečeť, pohár, prsten — věci, které jsem vzal z rukou svého [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('remembered_forebear'))] [remembered_forebear.GetTitledFirstName]. Rozložil jsem je a usedl k nim; pomalu přestávají působit jako vypůjčené.\n\nNic se neobjevuje. Nic se neříká. Nikdo mi nevypráví o [remembered_forebear.GetHerHim]; připomínám si sám sebe, svou povahu, kterou jsem s oním životem odložil, ale nikdy neztratil." # todo: NEW TRANSLATION
 pam_tenet_events.0008.a: "To jsem byl já: [remembered_trait_1.GetNameNoTooltip( ROOT.Char )|l], skrz naskrz." # todo: NEW TRANSLATION
 pam_tenet_events.0008.b: "V hloubi duše se probouzím jako [remembered_trait_2.GetNameNoTooltip( ROOT.Char )|l] a vím, že je to má pravá podstata." # todo: NEW TRANSLATION
 pam_tenet_events.0008.c: "Ano. Tehdy jsem byl [remembered_trait_3.GetNameNoTooltip( ROOT.Char )|l] a mohu jím být znovu." # todo: NEW TRANSLATION
 pam_tenet_events.0008.d: "Ty životy jsou za mnou. Já zůstávám sám sebou." # todo: NEW TRANSLATION
 pam_tenet_events.0009.t: "Otevřít truhlice" # todo: NEW TRANSLATION
 pam_tenet_events.0009.desc_intro: "Truhlice byly přineseny na nádvoří a klíče mám v ruce." # todo: NEW TRANSLATION
 pam_tenet_events.0009.desc_witness: " [redistribution_witness.GetTitledFirstName] prochází podél řady.\n\n„Štědrý [ROOT.Char.GetTitleAsNameNoTooltip] je stále [ROOT.Char.GetTitleAsNameNoTooltip],“ říká [redistribution_witness.GetSheHe]. „Dáváním se nikdo nezachrání; zachrání se jen ten, kdo už nemá co si nechat.“" # todo: NEW TRANSLATION
 pam_tenet_events.0009.desc_alone: " Jsem v tom sám a správci mlčky zůstávají opodál, aby viděli, jak to dopadne." # todo: NEW TRANSLATION
 pam_tenet_events.0009.desc_end: "\n\nSvou truhlici mohu odemknout jediným otočením zápěstí. Zbytek si budu muset vzít." # todo: NEW TRANSLATION
 pam_tenet_events.0009.a: "Rozbijte zámky. Ať si každý vezme svůj díl." # todo: NEW TRANSLATION
 pam_tenet_events.0009.flavor: "Vaši vazalové, kteří mají peněz nazbyt, budou nuceni otevřít své pokladnice, vaše hrabství získají větší svobodu a bude těžší je ovládat a ti, kdo nesdílejí tuto zásadu, vám to budou mít za zlé." # todo: NEW TRANSLATION
 pam_tenet_events.0009.b: "Počkat. Stačí rozdat jen mé vlastní bohatství." # todo: NEW TRANSLATION
 pam_tenet_events.0009.b.tt: "Rozdáte pouze svůj majetek. Vaši [vassals|E] ponechají své pokladnice zavřené a nebudou vám to mít za zlé" # todo: NEW TRANSLATION
 pam_tenet_events.0010.t: "Co tělo dluží" # todo: NEW TRANSLATION
 pam_tenet_events.0010.desc_intro: "Bič visí na svém obvyklém místě. Dnes v noci mu dělají společnost železné nástroje a krátký nůž, přinesené potají a pouze mnou." # todo: NEW TRANSLATION
 pam_tenet_events.0010.desc_alone: "\n\nDnes v noci mi lampu nepodrží ani živá duše. Co si odnesu z toho stolu, odnesu bez svědků." # todo: NEW TRANSLATION
 pam_tenet_events.0010.a: "Bič, dokud se má mysl neutiší." # todo: NEW TRANSLATION
 pam_tenet_events.0010.b: "Ať už nemusím hledět na svět." # todo: NEW TRANSLATION
 pam_tenet_events.0010.c: "Vezměte mi chuť k jídlu a s ní odejde i hřích." # todo: NEW TRANSLATION
