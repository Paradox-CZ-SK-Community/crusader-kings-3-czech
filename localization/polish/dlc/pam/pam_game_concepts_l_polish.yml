l_polish:
 game_concept_puppet: "Loutka"
 game_concept_puppets: "Loutky"
 game_concept_puppeted: "Ovládaný"
 game_concept_puppeting: "Ovládání loutek"
 game_concept_puppet_type: "Typ loutky"
 game_concept_puppet_types: "Typy loutek"
 game_concept_puppet_type_desc: "[Concept('puppet','Loutka')|e] má vždy určitý typ, který určuje, jaké akce může provádět tvým jménem.\n\nVětšina zvláštních akcí je společná všem typům, ale každý $game_concept_puppet_type$ má i vlastní, jedinečné akce.\n\nNapříklad [Concept('clerical_puppet','loutkový zemský kněz')|e] může tvým jménem někoho [Concept('excommunicate','exkomunikovat')|e], zatímco [Concept('external_ruler_puppet','loutkového světského vládce')|e] lze přimět, aby propustil [Concept('tributary','tributáře')|e] nebo se rozvedl se svým [Concept('spouse','chotěm')|e].\n\nZ každého typu ti může sloužit pouze jedna $game_concept_puppet$."
 game_concept_puppet_desc: "Loutka je [Concept('character','postava')|E] ovládaná [Concept('puppeteer','loutkářem')|E], který jejím prostřednictvím může provádět zvláštní loutkové akce.\n\nJednání prostřednictvím loutky otevírá jinak nedostupné možnosti: [Concept('clerical_puppet','loutkový zemský kněz')|E] může tvým jménem žádat o [Concept('clerical_titles','duchovní tituly')|E] nebo [Concept('excommunication','exkomunikaci')|E], zatímco [Concept('external_ruler_puppet','loutkového světského vládce')|E] lze přimět, aby propustil [Concept('tributaries','tributáře')|E], udělil nezávislost nebo se rozvedl se svým [Concept('spouse','chotěm')|E].\n\nDostupné akce určuje [Concept('puppet_type','typ loutky')|E]."
 game_concept_puppeteer: "Loutkář"
 game_concept_puppeteers: "Loutkáři"
 game_concept_puppeteer_possessive: "Loutkáře"
 game_concept_puppeteers_possessive: "Loutkářů"
 game_concept_puppeteer_desc: "Loutkář je [Concept('character','postava')|E], která ovládá jednu nebo více [Concept('puppets','loutek')|E].\n\nProstřednictvím svých loutek může uplatňovat pravomoci přesahující vlastní postavení, například vliv [Concept('clergy','duchovenstva')|E] nebo autoritu cizího [Concept('realm','panství')|E]."
 game_concept_clerical_puppet: "Loutkový zemský kněz"
 game_concept_clerical_puppets: "Loutkoví zemští kněží"
 game_concept_clerical_puppet_desc: "[Concept('realm_priest','Vrchní duchovní')|E], který je [Concept('puppet','loutkou')|E] svého [Concept('liege','lenního pána')|E].\n\nJeho prostřednictvím může loutkář zasahovat do záležitostí [Concept('faith','víry')|E]: žádat [Concept('head_of_faith','hlavu víry')|E] o [Concept('clerical_titles','duchovní tituly')|E] či [Concept('excommunication','exkomunikaci')|E], spravovat [Concept('holy_sites','svatá místa')|E], založit nový [Concept('rite','ritus')|E] nebo uspořádat [Concept('ecumenical_council','ekumenický koncil')|E]."
 game_concept_external_clerical_puppet: "Loutkový duchovní vládce"
 game_concept_external_clerical_puppets: "Loutkoví duchovní vládci"
 game_concept_external_clerical_puppet_desc: "Mocný člen [Concept('clergy','duchovenstva')|E] – [Concept('archbishop','arcibiskup')|E], nebo dokonce [Concept('head_of_faith','hlava víry')|E] – který se stal [Concept('puppet','loutkou')|E] jiného [Concept('ruler','vládce')|E].\n\nČím mocnější duchovní, tím širší možnosti: ovládaná hlava víry může tvým jménem [Concept('excommunicate','exkomunikovat')|E] nepřátele, jmenovat [Concept('cardinals','kardinály')|E], udělit [Concept('pressed_claim','uplatněný nárok')|E] nebo podnítit [Concept('holy_war','svatou válku')|E]."
 game_concept_external_ruler_puppet: "Loutkový světský vládce"
 game_concept_external_ruler_puppets: "Loutkoví světští vládci"
 game_concept_external_ruler_puppet_desc: "[Concept('ruler','Vládce')|E], který není členem [Concept('clergy','duchovenstva')|E] a stal se [Concept('puppet','loutkou')|E] jiné [Concept('character','postavy')|E].\n\nProstřednictvím této loutky můžeš zasahovat do záležitostí jiných [Concept('realms','panství')|E], například pomocí [Concept('schemes','intrik')|E] nebo [Concept('imprisonment','uvěznění')|E].\n\n\nK získání loutky tohoto typu slouží [Concept('interaction','interakce')|E] #V $make_external_ruler_puppet_interaction$#!, která se odemkne, pokud platí alespoň jedna z těchto podmínek:\n$BULLET_WITH_TAB$Jsi [Concept('vassal','vazalem')|E] cíle a členem [Concept('clergy','duchovenstva')|E]\n$BULLET_WITH_TAB$Máš rys [GetTrait('seducer').GetName( GetNullCharacter )] a cíl je tvůj [Concept('lover','milenec')|E]; u cíle v hodnosti [Concept('king','krále')|E] nebo vyšší musí jít o [Concept('soulmate','spřízněnou duši')|E]\n$BULLET_WITH_TAB$Máš rys [GetTrait('torturer').GetName( GetNullCharacter )] a držíš cíl ve svém [Concept('dungeon','žaláři')|E]\n$BULLET_WITH_TAB$Máš rys [GetTrait('family_first').GetName( GetNullCharacter )] a cíl patří do tvé [Concept('close_family','blízké rodiny')|E]\n$BULLET_WITH_TAB$Máš rys [GetTrait('diplomat').GetName( GetNullCharacter )] a cíl je [Concept('independent_ruler','nezávislým vládcem')|E]\n$BULLET_WITH_TAB$Máš rys [GetTrait('gallant').GetName( GetNullCharacter )] a cíl je tvůj [Concept('spouse','choť')|E]\n$BULLET_WITH_TAB$Jsi [Concept('diarch','diarchou')|E] cíle v [Concept('entrenched_regency','zakotveném regentství')|E]"
 game_concept_ecumenical_council: "Ekumenický koncil"
 game_concept_ecumenical_council_desc: "$game_concept_ecumenical_council$ je [Concept('activity','aktivita')|E], při níž se scházejí přední členové [Concept('clergy','duchovenstva')|E] z celého křesťanského světa, aby rozhodli o budoucnosti církve.\n\nV postupných debatách shromáždění preláti rozhodují o [Concept('tenet_status','postavení zásad')|E] u sporných [Concept('core_tenets','zásad')|E]: prohlašují je za [Concept('permitted_tenet_status','povolené')|E] či [Concept('prohibited_tenet_status','zakázané')|E], nebo je povyšují na [Concept('core_tenet_status','základní')|E]. Zároveň určují [Concept('doctrines','doktríny')|E] [Concept('faith','víry')|E]."
 game_concept_ecumenical_councils: "Ekumenické koncily"
 game_concept_ecumenical_councils_desc: "$game_concept_ecumenical_council_desc$"
 game_concept_schism: "Schizma"
 game_concept_schism_desc: "Velké $game_concept_schism$ nastává, když se jednotná [Concept('faith','víra')|E] $christian_faith$ rozpadne podle svých římských a řeckých [Concept('rites','ritů')|E] na $catholic$ a $orthodox$.\n\nHrozí, když [Concept('situation','situace')|E] [Concept('the_christian_church','křesťanské církve')|E] vstoupí do určitých [Concept('the_christian_church_chapters_short','kapitol')|E] a vládci v celém křesťanském světě si musí vybrat stranu. Pokud se rozkoly neurovnají – nebo naopak neprohloubí – pomocí [Concept('decisions','rozhodnutí')|E], stane se rozdělení na konci kapitoly trvalým."
 game_concept_schisms: "Schizmy"
 game_concept_schisms_desc: "$game_concept_schism_desc$"
 game_concept_clerical_title: "Duchovní titul"
 game_concept_clerical_titles: "Duchovní tituly"
 game_concept_clerical_title_desc: "$game_concept_clerical_title$ je [Concept('ecclesiastical','církevní')|E] [Concept('title','titul')|E] [Concept('clergy','duchovenstva')|E], který zajišťuje správu [Concept('clerical_region','církevní oblasti')|E] v rámci [Concept('faith','víry')|E]. U [Concept('christian','křesťanských')|E] vyznání jde o [Concept('archdiocese','arcidiecézi')|E].\n\nDržitel je [Concept('religious_superior','nadřízeným duchovním')|E] [Concept('clergy','duchovenstva')|E] v dané oblasti a obvykle jej jmenuje [Concept('head_of_faith','hlava víry')|E]."
 game_concept_the_christian_church: "Křesťanská církev"
 game_concept_the_christian_church_desc: "Křesťanská církev je církevní společenství, které dohlíží na následovníky Ježíše Krista a vede je. Ve hře ji představuje [Concept('situation','situace')|E] postupující řadou [Concept('the_christian_church_chapters_short','kapitol')|E].\n\nJejí hranice zahrnují každou [Concept('archdiocese','arcidiecézi')|E] na světě. Členem je každý [Concept('christian','křesťanský')|E] [Concept('ruler','vládce')|E] na úrovni [Concept('county','hrabství')|E] nebo vyšší, jehož [Concept('realm','panství')|E] alespoň zčásti leží v arcidiecézi, ať už jde o duchovního, nebo světského vládce."
 game_concept_christendom: "Křesťanstvo"
 game_concept_christendom_desc: "$game_concept_christendom$ zahrnuje [Concept('realm','panství')|E] všech [Concept('independent','nezávislých')|E] [Concept('christian','křesťanských')|E] [Concept('ruler','vládců')|E], kteří jsou členy [Concept('situation','situace')|E] [Concept('the_christian_church','křesťanské církve')|E]."
 game_concept_christian: "Křesťan"
 game_concept_christians: "Křesťané"
 game_concept_christian_possessive: "Křesťana"
 game_concept_christian_desc: "Vyznavač křesťanského [Concept('religion','náboženství')|E]."
 game_concept_papal_bull: "Papežská bula"
 game_concept_papal_bulls: "Papežské buly"
 game_concept_bull: "Bula"
 game_concept_bulls: "Buly"
 game_concept_papal_bull_desc: "Papežská bula je slavnostní výnos [Concept('head_of_faith','hlavy víry')|E] [Concept('christian','křesťanského')|E] [Concept('faith','vyznání')|E], opřený o autoritu [Concept('the_christian_church','křesťanské církve')|E].\n\nKřesťanská [Concept('head_of_faith','hlava víry')|E] s dostatečnou [Concept('church_authority','církevní autoritou')|E] může vyhlásit bulu pomocí [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('enact_a_bull_decision').GetName]. Vynaložením [Concept('piety','zbožnosti')|E] může:\n\n$EFFECT_LIST_BULLET$Vyhlásit [Concept('great_holy_war','velkou svatou válku')|E]\n$EFFECT_LIST_BULLET$Odsoudit [Concept('rite','ritus')|E] jako [Concept('heresy','kacířství')|E]\n$EFFECT_LIST_BULLET$Prohlásit [Concept('core_tenet','zásadu')|E] za [Concept('permitted_tenet_status','povolenou')|E] či [Concept('prohibited_tenet_status','zakázanou')|E]"
 game_concept_situation_the_christian_church_phase: "Kapitola křesťanské církve"
 game_concept_the_christian_church_chapter_short: "Kapitola"
 game_concept_the_christian_church_chapters_short: "Kapitoly"
 game_concept_situation_the_christian_church_phases: "Kapitoly křesťanské církve"
 game_concept_situation_the_christian_church_phase_desc: "Kapitoly jsou [Concept('situation_phases','fázemi situace')|E] [Concept('the_christian_church','křesťanské církve')|E]. Celkem jich je sedm, rozdělených do čtyř [Concept('the_christian_church_chapter_types','typů kapitol')|E]."
 game_concept_the_christian_church_chapter_type: "Typ kapitoly"
 game_concept_the_christian_church_chapter_types: "Typy kapitol"
 game_concept_the_christian_church_chapter_type_desc: "V [Concept('the_christian_church','křesťanské církvi')|E] existují čtyři $game_concept_the_christian_church_chapter_types$, do nichž se dělí [Concept('situation_the_christian_church_phases','kapitoly křesťanské církve')|E].\n\n$game_concept_the_christian_church_chapter_types$: [Concept('the_christian_church_unstable_short','nestabilita')|E], [Concept('the_christian_church_crisis_short','krize')|E], [Concept('the_christian_church_zeal_short','horlivost')|E] a [Concept('the_christian_church_stability_short','stabilita')|E]"
 game_concept_the_christian_church_unstable: "Kapitola nestability"
 game_concept_the_christian_church_unstable_short: "Nestabilita"
 game_concept_the_christian_church_unstable_desc: "#high $game_concept_the_christian_church_unstable$#! je obdobím, kdy v [Concept('the_christian_church','křesťanské církvi')|E] slábne poslušnost:\n\n[Concept('rulers','Vládce')|E] lze snáze přesvědčit k přijetí jiného [Concept('rite','ritu')|E], exkomunikace mohou být častější a [Concept('gold','zlato')|E] se může utrácet pro vlastní prospěch.\n\n#high $fragile_unity$#! a #high $reform_phase$#! jsou [Concept('the_christian_church_chapters_short','kapitoly')|E] typu $game_concept_the_christian_church_unstable_short$."
 game_concept_the_christian_church_zeal: "Kapitola horlivosti"
 game_concept_the_christian_church_zeal_short: "Horlivost"
 game_concept_the_christian_church_zeal_desc: "#high $game_concept_the_christian_church_zeal$#! rozdmýchává horlivost obrácenou navenek:\n\nMohou probíhat hromadné konverze, [Concept('great_holy_wars','velké svaté války')|E] i [Concept('papal_bulls','papežské buly')|E] mohou být častější a obracení na [Concept('faith','víru')|E] může být snazší.\n\n#high $conversion_phase$#! a #high $crusade_phase$#! jsou [Concept('the_christian_church_chapters_short','kapitoly')|E] typu $game_concept_the_christian_church_zeal_short$."
 game_concept_the_christian_church_stability: "Kapitola stability"
 game_concept_the_christian_church_stability_short: "Stabilita"
 game_concept_the_christian_church_stability_desc: "#high $game_concept_the_christian_church_stability$#! přináší [Concept('the_christian_church','křesťanské církvi')|E] vzácné období klidu:\n\nVýstavba v [Concept('temple_holding','chrámové državě')|E] je levnější, velkolepé katedrály rostou rychleji, [Concept('characters','postavy')|E] častěji získávají rys [GetTrait('devoted').GetName( GetNullCharacter )] a velké schizma může být překonáno.\n\n#high $concord$#! je jediná $game_concept_the_christian_church_stability$."
 game_concept_the_christian_church_crisis: "Kapitola krize"
 game_concept_the_christian_church_crisis_short: "Krize"
 game_concept_the_christian_church_crisis_desc: "#high $game_concept_the_christian_church_crisis$#! představuje nejbouřlivější období [Concept('the_christian_church','křesťanské církve')|E]:\n\nOdpustky mohou být levnější, [Concept('ecumenical_councils','ekumenické koncily')|E] častější, [Concept('rulers','vládci')|E] mohou jmenovat vlastního [Concept('court_chaplain','dvorního kaplana')|E], členové [Concept('clergy','duchovenstva')|E] se mohou ženit či vdávat, [Concept('head_of_faith','hlava víry')|E] může odmítnout uspořádat [Concept('anointment','pomazání')|E] a výnosy z [Concept('taxes','daní')|E] mohou klesnout.\n\n#high $saeculum_obscurum$#! a #high $investiture_crisis$#! jsou [Concept('the_christian_church_chapters_short','kapitoly')|E] typu $game_concept_the_christian_church_crisis_short$."
 game_concept_head_of_rite: "Hlava ritu"
 game_concept_head_of_rite_desc: "Vedoucí [Concept('character','postava')|E] [Concept('rite','ritu')|E]. Je jí [Concept('head_of_faith','hlava víry')|E], pokud daný ritus následuje; jinak držitel [Concept('clerical_region','církevní oblasti')|E], kde má ritus nejvíce vyznavačů. Pokud není ani ten, stává se jí [Concept('ruler','vládce')|E], který spravuje nejvíce [Concept('counties','hrabství')|E] tohoto [Concept('rite_possessive','ritu')|E].\n\nPouze $game_concept_head_of_rite$ může upravovat [Concept('core_tenets','zásady')|E] a [Concept('doctrines','doktríny')|E] svého [Concept('rite_possessive','ritu')|E] a právě ona zastupuje věřící, když se církev blíží ke [Concept('schism','schizmatu')|E]."
 game_concept_ecclesiastical: "Církevní"
 game_concept_ecclesiastical_government: "Církevní vláda"
 game_concept_ecclesiastical_i: "@government_type_ecclesiastical!"
 game_concept_ecclesiastical_desc: "$game_concept_ecclesiastical$ vláda je [Concept('theocratic','teokratická')|E] [Concept('government_form','forma vlády')|E], kterou vykonávají [Concept('christian','křesťanští')|E] [Concept('rulers','vládci')|E] z řad [Concept('clergy','duchovenstva')|E], například [Concept('bishops','biskupové')|E] a [Concept('archbishops','arcibiskupové')|E].\n\nVětšina církevních vládců jsou teokratičtí [Concept('vassals','vazalové')|E], kteří si [Concept('lease','pronajímají')|E] [Concept('temple_holdings','chrámové državy')|E] od světského [Concept('liege','lenního pána')|E] a podléhají [Concept('head_of_faith','hlavě víry')|E]. [Concept('bishop','Biskup')|E], který je [Concept('landed','zeměpánem')|E] a vlastní [Concept('titles','tituly')|E], jež nejsou [Concept('leased','pronajaté')|E], však může vládnout jako [Concept('independent','nezávislý')|E] církevní [Concept('ruler','vládce')|E]. Jeho moc nad vlastními [Concept('vassals','vazaly')|E] určuje [Concept('church_authority','církevní autorita')|E]."
 game_concept_lease_contract: "Nájemní smlouva"
 game_concept_lease_contract_desc: "Právní podmínky, za nichž má postava titul v [Concept('leasing','pronájmu')|E]. Určují také, kdo je jejím [Concept('religious_superior','nadřízeným duchovním')|E]."
 game_concept_church_obligations: "Církevní odvody"
 game_concept_church_obligations_desc: "Církevní odvody představují souhrn závazků týkajících se příjmů z [Concept('church_holding','církevní državy')|E]. Tyto odvody se platí [Concept('superior','nadřízenému')|E], [Concept('head_of_faith','hlavě víry')|E] nebo místnímu světskému [Concept('ruler','vládci')|E], případně více z nich. Patří mezi ně například [Concept('church_centralization','centralizace církve')|E] a [Concept('secular_obligations','světské odvody')|E]."
 game_concept_church_centralization: "Centralizace církve"
 game_concept_minimal_centralization: "Minimální centralizace"
 game_concept_mild_centralization: "Mírná centralizace"
 game_concept_strong_centralization: "Silná centralizace"
 game_concept_church_centralization_desc: "$game_concept_church_centralization$ vyjadřuje, nakolik církev přijala centralizované struktury autority a financí. Při silnější centralizaci proudí více příjmů k vyšším stupňům duchovní hierarchie.\n\nRozlišují se tyto typy:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_minimal_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_mild_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_strong_centralization$"
 game_concept_secular_obligations: "Světské odvody"
 game_concept_personal_obligations: "Osobní odvody"
 game_concept_fixed_obligations: "Pevné odvody"
 game_concept_secular_obligations_desc: "$game_concept_secular_obligations$ určují, jaká část příjmů z [Concept('church_holdings','církevních držav')|E] náleží místnímu [Concept('secular_ruler','světskému vládci')|E].\n\nRozlišují se tyto typy:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_personal_secular_obligations$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_fixed_secular_obligations$\n\nV některých kapitolách mají světští vládci navíc místní moc nad církví:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_local_secular_power$"
 game_concept_religious_superior: "Nadřízený duchovní"
 game_concept_religious_superiors: "Nadřízení duchovní"
 game_concept_superior: "Nadřízený"
 game_concept_religious_superior_desc: "Nadřízený duchovní je [Concept('character','postava')|E], která má v hierarchicky uspořádaném náboženském společenství náboženskou pravomoc nad jedním nebo více [Concept('subordinate','podřízenými')|E] duchovními."
 game_concept_religious_subordinate: "Podřízený duchovní"
 game_concept_religious_subordinates: "Podřízení duchovní"
 game_concept_subordinate: "Podřízený"
 game_concept_subordinates: "Podřízení"
 game_concept_religious_subordinate_desc: "Podřízený duchovní je [Concept('character','postava')|E], která má v hierarchicky uspořádaném náboženském společenství [Concept('religious_superior','nadřízeného duchovního')|E]."
 game_concept_clerical_region: "Církevní oblast"
 game_concept_clerical_regions: "Církevní oblasti"
 game_concept_clerical_region_possessive: "Církevní oblasti"
 game_concept_clerical_regions_possessive: "Církevních oblastí"
 game_concept_clerical_region_desc: "Církevní oblast je zeměpisná oblast spadající pod pravomoc [Concept('clerical_title','duchovního titulu')|E]. Každý člen duchovenstva v této oblasti je [Concept('subordinate','podřízeným')|E] držitele [Concept('title','titulu')|E], který je s oblastí spojen.\n\n[Concept('ruler','Vládce')|E] náleží do církevní oblasti, v níž leží [Concept('county','hrabství')|E] s jeho [Concept('capital','hlavním sídlem')|E]. Nová oblast se zakládá kolem [Concept('capital','hlavního sídla')|E] zakladatelova [Concept('primary_title','hlavního titulu')|E]. Oblast může zasahovat do více [Concept('realms','panství')|E] a mít podřízené v různých panstvích.\n\nPro každého vládce platí, že jím držená $game_concept_clerical_region$ může být vždy pouze jedna. Pokud $game_concept_ruler$ získá novou oblast, ztrácí veškerou půdu, kterou držel v předchozí oblasti."
 game_concept_clerical_region_capital: "Sídlo církevní oblasti"
 game_concept_clerical_region_capitals: "Sídla církevních oblastí"
 game_concept_clerical_region_capital_desc: "Sídlem církevní oblasti je [Concept('county','hrabství')|E], kde byla založena [Concept('clerical_region','církevní oblast')|E] s [Concept('ecclesiastical_estate','církevním statkem')|E]. Je sídlem [Concept('clerical_title','duchovního titulu')|E], který oblast spravuje. Na rozdíl od [Concept('de_jure_capital','de iure hlavního sídla')|E] je s oblastí pevně spjato a nelze je přesunout."
 clerical_electors: "Duchovní volitelé"
 game_concept_archdiocese: "Arcidiecéze"
 game_concept_archdioceses: "Arcidiecéze"
 game_concept_archdiocese_desc: "Arcidiecéze je [Concept('christian','křesťanskou')|E] podobou [Concept('clerical_region','církevní oblasti')|E]: církevním územím, které drží [Concept('archbishop','arcibiskup')|E] prostřednictvím svého [Concept('clerical_title','duchovního titulu')|E]. Jejím sídlem je hlavní [Concept('county','hrabství')|E], kde lze postavit [Concept('grand_cathedral','velkolepou katedrálu')|E].\n\n[Concept('christian','Křesťanský')|E] [Concept('ruler','vládce')|E] podléhá v duchovních záležitostech [Concept('archbishop','arcibiskupovi')|E] arcidiecéze, v níž leží [Concept('county','hrabství')|E] s jeho [Concept('capital','hlavním sídlem')|E]. Území podléhající arcidiecézím společně tvoří [Concept('situation','situaci')|E] [Concept('the_christian_church','křesťanské církve')|E]."
 game_concept_grand_cathedral: "Velkolepá katedrála"
 game_concept_grand_cathedrals: "Velkolepé katedrály"
 game_concept_grand_cathedral_desc: "Velkolepá katedrála je [Concept('great_building','velkolepá budova')|E] vystavěná prostřednictvím [Concept('great_project','velkého projektu')|E] v hlavním sídle [Concept('archdiocese','arcidiecéze')|E], kde sídlí její [Concept('archbishop','arcibiskup')|E].\n\nVýstavba první katedrály je velkolepým projevem oddanosti: jejímu zakladateli přináší trvalou [Concept('piety','zbožnost')|E], [Concept('legitimacy','legitimitu')|E] a [Concept('spiritual_fulfillment','duchovní naplnění')|E], další místo pro [Concept('personal_tenet','osobní zásadu')|E] a trvalý bonus k [Concept('opinion','názoru')|E] postav stejné [Concept('faith','víry')|E]. Po dokončení přitahuje křesťanské poutníky z celého [Concept('christendom','křesťanského světa')|E] a rozšiřuje držitelův [Concept('cathedral_complex','katedrální komplex')|E]. Později ji lze rozšířit na budovu [GetBuilding('great_project_cathedral_02').GetName|V] nebo [GetBuilding('great_project_cathedral_03').GetName|V]."
 game_concept_monastic_holy_order: "Mnišský řád"
 game_concept_monastic_holy_orders: "Mnišské řády"
 game_concept_monastic_holy_order_possessive: "Mnišského řádu"
 game_concept_monastic_holy_orders_possessive: "Mnišských řádů"
 game_concept_monastic: "Mnišský"
 game_concept_monastic_holy_order_i: "@government_type_monastic_holy_order!"
 game_concept_monastic_holy_order_desc: "Mnišský řád je druh [Concept('holy_order','svatého řádu')|E] zasvěcený modlitbě, učenosti a šíření jediné [Concept('core_tenet','zásady')|E]. Náleží k [Concept('rite','ritu')|E] svého zakladatele a prosazuje jednu ze [Concept('core_tenets','zásad')|E] tohoto [Concept('rite_possessive','ritu')|E], jejíž praktikování šíří mezi věřícími.\n\nMnišský řád vede [Concept('archabbot','opat')|E] a jeho chod zajišťují [Concept('temple_holdings','chrámové državy')|E] a [Concept('gold','zlato')|E], které mu poskytují jeho [Concept('monastic_order_patrons','mecenáši')|E]. Řád jim za to přináší [Concept('spiritual_fulfillment','duchovní naplnění')|E] a [Concept('piety','zbožnost')|E].\n\nŘád může založit každý [Concept('ruler','vládce')|E], jehož [Concept('faith','víra')|E] dovoluje mnišství, pomocí [Concept('decision','rozhodnutí')|E] #high Založit mnišský řád#!."
 game_concept_monastic_order_patron: "Mecenáš mnišského řádu"
 game_concept_monastic_order_patrons: "Mecenáši mnišských řádů"
 game_concept_monastic_order_patronize: "Podporovat"
 game_concept_monastic_order_patronized: "Podporovaný"
 game_concept_monastic_order_patronage: "Mecenášství"
 game_concept_monastic_order_patron_desc: "Mecenáš mnišského řádu je [Concept('ecclesiastical','církevní')|E] nebo světský [Concept('ruler','vládce')|E] na [Concept('title_tier','úrovni titulu')|E] [Concept('duchy','vévodství')|E] nebo vyšší, který podporuje [Concept('monastic_holy_order','mnišský řád')|E]. Nejčastěji jde o jeho zakladatele. Mecenáš řád obdarovává světským bohatstvím: pronajímá mu [Concept('temple_holdings','chrámové državy')|E] a přispívá [Concept('gold','zlatem')|E] do jeho pokladny.\n\nZa tuto štědrost získává [Concept('piety','zbožnost')|E] a [Concept('spiritual_fulfillment','duchovní naplnění')|E]. Může také ovládnout vůdce řádu a využívat jej jako [Concept('puppet','loutku')|E] k provádění [Concept('clerical','duchovních')|E] interakcí."
 game_concept_mendicant: "Žebravý"
 game_concept_rite: "Ritus"
 game_concept_rite_possessive: "Ritu"
 game_concept_rites_possessive: "Ritů"
 game_concept_rite_desc: "Ritus je větev [Concept('faith','víry')|E]: místní podoba jejích náboženských praktik vedená [Concept('head_of_rite','hlavou ritu')|E], kterou následují vlastní [Concept('counties','hrabství')|E] a [Concept('characters','postavy')|E]. Každá víra má [Concept('mainline_rite','hlavní ritus')|E] a může v ní vzniknout několik dalších.\n\nRitus vymezují [Concept('core_tenets','zásady')|E] a [Concept('doctrines','doktríny')|E], které prosazuje. Zda je zásada [Concept('permitted_tenet_status','povolená')|E] či [Concept('prohibited_tenet_status','zakázaná')|E], určuje [Concept('faith','víra')|E] prostřednictvím svého [Concept('mainline_rite','hlavního ritu')|E]. Čím více se volby daného [Concept('rite_possessive','ritu')|E] těmto úsudkům příčí, tím vyšší je jeho [Concept('rite_divergence','odlišnost')|E]: odlišující se rity oslabují [Concept('fervor','horlivost')|E] [Concept('faithpossessive','víry')|E] a začínají být považovány za [Concept('heresy','kacířství')|E]. Při #V 100#! bodech [Concept('divergence','odlišnosti')|E] se odtrhnou a stanou se vlastní [Concept('faith','vírou')|E].\n\nZbožné postavy mohou zakládat nové rity a [Concept('rulers','vládce')|E] lze přesvědčit k přechodu z jednoho ritu na jiný. Ritus může upravovat pouze jeho [Concept('head_of_rite','hlava')|E]."
 game_concept_rites: "Rity"
 game_concept_archabbot: "Opat"
 game_concept_archabbot_desc: "$game_concept_archabbot$ je [Concept('ruler','vládce')|E] [Concept('monastic_holy_order','mnišského řádu')|E] a [Concept('head_of_rite','hlava')|E] [Concept('rite','ritu')|E], který jeho řád prosazuje. Vede členy řádu při studiu, rozjímání a šíření jeho [Concept('core_tenets','zásad')|E].\n\nŘád může podporovat [Concept('monastic_order_patron','mecenáš')|E], jehož [Concept('monastic_order_patronage','mecenášství')|E] mu přináší bohatství a vliv.\n\nKdyž $game_concept_archabbot$ zemře, jeho [Concept('titles','tituly')|E] přecházejí na nástupce, zpravidla na jeho [Concept('courtier','dvořana')|E] s nejvyšší [Concept('learning','učeností')|E]."
 game_concept_archbishop: "Arcibiskup"
 game_concept_archbishops: "Arcibiskupové"
 game_concept_archbishop_possessive: "Arcibiskupa"
 game_concept_archbishops_possessive: "Arcibiskupů"
 game_concept_archbishop_desc: "Arcibiskup je křesťanský držitel [Concept('archdiocese','arcidiecéze')|E], [Concept('clerical_title','duchovního titulu')|E] na úrovni vévodství, jehož [Concept('clerical_region','církevní oblast')|E] může zasahovat do několika [Concept('realms','panství')|E].\n\nJako [Concept('religious_superior','nadřízený duchovní')|E] [Concept('bishops','biskupů')|E] a nižšího [Concept('clergy','duchovenstva')|E] v dané oblasti stojí arcibiskup výše než běžný [Concept('bishop','biskup')|E] a sám podléhá [Concept('head_of_faith','hlavě víry')|E]."
 game_concept_bishop: "Biskup"
 game_concept_bishops: "Biskupové"
 game_concept_bishop_possessive: "Biskupa"
 game_concept_bishops_possessive: "Biskupů"
 game_concept_bishop_desc: "$game_concept_bishop$ patří k [Concept('clergy','duchovenstvu')|E] křesťanské [Concept('faith','víry')|E] a drží nebo si pronajímá [Concept('temple_holdings','chrámové državy')|E].\n\nBiskup sídlí v [Concept('archdiocese','arcidiecézi')|E] a podléhá tamnímu [Concept('archbishop','arcibiskupovi')|E] jako svému [Concept('religious_superior','nadřízenému duchovnímu')|E]. Biskup bez vlastní půdy s [Concept('leased','pronajatými')|E] tituly slouží pod světským [Concept('liege','lenním pánem')|E]; biskup, který je [Concept('landed','zeměpánem')|E] a vlastní nepronajaté [Concept('titles','tituly')|E], však může vládnout jako [Concept('ecclesiastical','církevní')|E] [Concept('ruler','vládce')|E]."
 game_concept_rite_divergence: "Odlišnost"
 game_concept_rite_divergent: "Odlišný"
 game_concept_divergence: "Odlišnost"
 game_concept_divergence_desc: "$game_concept_rite_divergence_desc$"
 game_concept_divergence_i: "@divergence_icon!"
 game_concept_rite_divergence_i: "@divergence_icon!"
 game_concept_rite_divergence_desc: "Odlišnost měří, nakolik se [Concept('core_tenets','zásady')|E] a [Concept('doctrines','doktríny')|E] daného [Concept('rite_possessive','ritu')|E] vzdálily od mateřské [Concept('faith','víry')|E]. Ritus, který přijímá [Concept('prohibited_tenet_status','zakázané')|E] zásady jako [Concept('core_tenet_status','základní')|E], se odchyluje více.\n\nVysoká odlišnost oslabuje [Concept('fervor','horlivost')|E] mateřské víry, a tak častěji propuká [Concept('heresy','kacířství')|E]. Ritus, jehož odlišnost dosáhne #V 100#!, bude automaticky prohlášen za kacířský a stane se novou [Concept('faith','vírou')|E]."
 game_concept_spiritual_fulfillment: "Duchovní naplnění"
 game_concept_spiritual_fulfillment_desc: "$game_concept_spiritual_fulfillment$ měří, nakolik je [Concept('character','postava')|E] vnitřně smířená se svou [Concept('faith','vírou')|E].\n\nZákladní hodnota se vypočítává z jejích [Concept('traits','rysů')|E] a z toho, zda jsou považovány za [Concept('sinful','hříšné')|E] nebo [Concept('virtuous','ctnostné')|E].\n\n$game_concept_spiritual_fulfillment$ se zvyšuje či snižuje podle toho, nakolik jednání odpovídá požadavkům [Concept('faith','víry')|E]. Nepříznivé působení rysů lze vyvážit přijetím [Concept('personal_tenets','osobních zásad')|E]."
 game_concept_fulfillment: "Naplnění"
 game_concept_spiritual_fulfillment_i: "@spiritual_fulfillment_icon!"
 game_concept_spiritual_fulfillment_level: "Úroveň duchovního naplnění"
 game_concept_spiritual_fulfillment_levels: "Úrovně duchovního naplnění"
 game_concept_spiritual_fulfillment_level_desc: "Jednotlivé $game_concept_spiritual_fulfillment_levels$ vymezují hraniční hodnoty [Concept('spiritual_fulfillment','duchovního naplnění')|E] [Concept('character_possessive','postavy')|E] a každá z nich má vlastní účinky.\n\nNízké úrovně ztěžují život a snižují cenu hříšných činů. Vysoké úrovně usnadňují zbožné jednání a otevírají nové náboženské možnosti."
 game_concept_personal_tenet: "Osobní zásada"
 game_concept_personal_tenet_desc: "$game_concept_personal_tenet$ je [Concept('core_tenet','zásada')|E], kterou [Concept('ruler','vládce')|E] přijímá jako základní součást svého duchovního života.\n\nPokud je přijatá $game_concept_personal_tenet$ [Concept('core_tenet_status','základní')|E] nebo ji [Concept('faith','víra')|E] prohlásila za [Concept('permitted_tenet_status','povolenou')|E], přináší [Concept('spiritual_fulfillment','duchovní naplnění')|E]. Přijetí [Concept('prohibited_tenet_status','zakázané')|E] zásady naopak vytváří [Concept('secret','tajemství')|E]. $game_concept_personal_tenets$ mají také další účinky a odemykají zvláštní mechaniky.\n\nPostava může vyznávat $game_concept_personal_tenets$ v počtu, který závisí na její [Concept('piety_level','úrovni zbožnosti')|E] a [Concept('trait','rysu')|E] [GetTrait('theologian').GetName( GetNullCharacter )]."
 game_concept_personal_tenets: "Osobní zásady"
 game_concept_personal_tenets_desc: "$game_concept_personal_tenet_desc$"
 game_concept_cardinal: "Kardinál"
 game_concept_cardinals: "Kardinálové"
 game_concept_cardinal_possessive: "Kardinála"
 game_concept_cardinals_possessive: "Kardinálů"
 game_concept_cardinalate: "Kardinálský titul"
 game_concept_cardinalates: "Kardinálské tituly"
 game_concept_cardinal_desc: "Člen [Concept('clergy','duchovenstva')|e] vybraný papežem, aby pomáhal prosazovat vůli [Concept('the_christian_church','křesťanské církve')|e]. Všichni členové [Concept('college_of_cardinals','kolegia kardinálů')|E] jsou zároveň kandidáty na papežský úřad i jeho voliteli a mají [Concept('papabile_score','skóre papežské kandidatury')|E]."
 game_concept_college_of_cardinals: "Kardinálské kolegium"
 game_concept_college_of_cardinals_desc: "$game_concept_college_of_cardinals$ je sbor [Concept('cardinals','kardinálů')|E], kteří radí papeži a volí příští [Concept('head_of_faith','hlavu víry')|E] [Concept('the_christian_church','křesťanské církve')|E].\n\nKaždý [Concept('cardinal','kardinál')|E] je zároveň kandidátem na papežský úřad i jeho volitelem."
 game_concept_papabile_score: "Skóre papežské kandidatury"
 game_concept_papabile_scores: "Skóre papežské kandidatury"
 game_concept_papabile_score_desc: "Každému členu [Concept('college_of_cardinals','kolegia kardinálů')|E] se vypočítává $game_concept_papabile_score$, které zohledňuje jeho [Concept('traits','rysy')|E], [Concept('piety_level','úroveň zbožnosti')|E], [Concept('rite','ritus')|E] a [Concept('opinion','názor')|E] ostatních kardinálů.\n\nVíce hlasů při papežské volbě pravděpodobně získají [Concept('cardinals','kardinálové')|E], jejichž $game_concept_papabile_score$ je nejvyšší.\n\n$game_concept_papabile_score$ lze zvýšit prostřednictvím [Concept('character_interaction','interakce postav')|E] #high $increase_papabile_score_interaction$#! a [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('pam_promulgate_word_of_pious_deeds_decision').GetName]."
 game_concept_mainline_rite: "Hlavní ritus"
 game_concept_mainline_rite_desc: "Hlavní [Concept('rite','ritus')|E] představuje nejvýznamnější soubor náboženských představ dané [Concept('faith','víry')|E]. Pokud $game_concept_rite$ není hlavní, je [Concept('rite_divergent','odlišný')|E]; jeho výchozím bodem je hlavní $game_concept_rite$.\n\nTo, který $game_concept_rite$ je hlavní, závisí na tom, zda $game_concept_faith$ má [Concept('head_of_faith','hlavu víry')|E].\n\nMá-li $game_concept_faith$ duchovní vedení, stojí v jeho čele $game_concept_head_of_faith$. Hlavní je pak ten $game_concept_rite$, který tato autorita následuje. Hlavní ritus se tedy může změnit, když její místo zaujme nástupce, který vyznává jiný $game_concept_rite$, včetně případné [Concept('challenger_hof','konkurenční hlavy víry')|E].\n\nPokud $game_concept_head_of_faith$ chybí, kterýkoli $game_concept_rite$ s větším počtem vyznávajících [Concept('counties','hrabství')|E] než současný hlavní ritus jej nahradí, pokud ovládá alespoň stejný počet [Concept('holy_sites','svatých míst')|E] jako $game_concept_rite$, který má nahradit."
 game_concept_mainline_rites: "Hlavní rity"
 game_concept_mainline_rite_short: "Hlavní"
 game_concept_tenet_status: "Postavení zásady"
 game_concept_tenet_status_desc: "$game_concept_tenet_status$ je postoj [Concept('rite_possessive','ritu')|E] k určité [Concept('core_tenet','zásadě')|E] nebo [Concept('doctrine','doktríně')|E]. Existuje pět možných postojů:\n\n$EFFECT_LIST_BULLET$[Concept('unknown_tenet_status','Neznámá')|E] – $game_concept_rite$ ji nikdy nepoznal, ať už jde o praxi, kterou představuje $game_concept_core_tenet$ nebo $game_concept_doctrine$.\n\n$EFFECT_LIST_BULLET$[Concept('known_tenet_status','Známá')|E] – $game_concept_rite$ ji zná, ale o jejím praktikování ještě nerozhodl.\n\n$EFFECT_LIST_BULLET$[Concept('permitted_tenet_status','Povolená')|E] – $game_concept_rite$ její praktikování schvaluje.\n\n$EFFECT_LIST_BULLET$[Concept('prohibited_tenet_status','Zakázaná')|E] – $game_concept_rite$ její praktikování zakazuje.\n\n$EFFECT_LIST_BULLET$[Concept('core_tenet_status','Základní')|E] – $game_concept_rite$ dovoluje i aktivně podporuje praxi, kterou představuje $game_concept_core_tenet$.\n\nPostoj ritu určuje, zda je při zakládání či odvozování nového ritu možné zvolit praxi, kterou představuje $game_concept_core_tenet$ nebo $game_concept_doctrine$, a jaký nový $game_concept_rite$ tak může vzniknout. Určuje také, za které praktiky nesou [Concept('followers','vyznavači')|E] duchovní postihy.\n\nPostavení zásady se liší od [Concept('tenet_knowledge','náboženských znalostí')|E] [Concept('character_possessive','postavy')|E]: ty vyjadřují osobní povědomí, zatímco $game_concept_rite$ má celkový postoj."
 game_concept_doctrine_status_desc: "$game_concept_tenet_status_desc$"
 game_concept_unknown_tenet_status: "Neznámá"
 game_concept_unknown_tenet_status_desc: "[Concept('tenet_status','Postavení zásady')|E] označené jako $game_concept_unknown_tenet_status$ znamená, že [Concept('rite','ritus')|E] vůbec nezná danou [Concept('core_tenet','zásadu')|E] či [Concept('doctrine','doktrínu')|E]. Jeho [Concept('followers','vyznavači')|E] ji tedy neznají jen proto, že vyznávají tento $game_concept_rite$, a nemohou ji zvolit, když vytvářejí nový $game_concept_rite$, ani přijmout jako [Concept('personal_tenet','osobní zásadu')|E]."
 game_concept_known_tenet_status: "Známá"
 game_concept_known_tenet_status_desc: "[Concept('tenet_status','Postavení zásady')|E] označené jako $game_concept_known_tenet_status$ znamená, že [Concept('rite','ritus')|E] danou [Concept('core_tenet','zásadu')|E] nebo [Concept('doctrine','doktrínu')|E] zná, ale její praktikování nepodporuje ani nepovoluje. Lze o ní uvažovat, když vzniká či se odvozuje nový $game_concept_rite$, a lze jí přiznat vyšší [Concept('tenet_status','postavení')|E]."
 game_concept_permitted_tenet_status: "Povolená"
 game_concept_permit_tenet_status: "Povolit"
 game_concept_permitted_tenet_status_desc: "[Concept('tenet_status','Postavení zásady')|E] označené jako $game_concept_permitted_tenet_status$ znamená, že [Concept('rite','ritus')|E] danou [Concept('core_tenet','zásadu')|E] či [Concept('doctrine','doktrínu')|E] schvaluje, ale aktivně ji neprosazuje. [Concept('character','Postava')|E], která vyznává tento $game_concept_rite$, může bez duchovního postihu přijmout praxi, kterou představuje $game_concept_core_tenet$, jako [Concept('personal_tenet','osobní zásadu')|E]."
 game_concept_prohibited_tenet_status: "Zakázaná"
 game_concept_prohibit_tenet_status: "Zakázat"
 game_concept_prohibited_tenet_status_desc: "[Concept('tenet_status','Postavení zásady')|E] označené jako $game_concept_prohibited_tenet_status$ znamená, že [Concept('rite','ritus')|E] danou [Concept('core_tenet','zásadu')|E] nebo [Concept('doctrine','doktrínu')|E] výslovně zakazuje. [Concept('character','Postava')|E], která vyznává tento $game_concept_rite$ a přijme praxi, kterou představuje $game_concept_core_tenet$, jako [Concept('personal_tenet','osobní zásadu')|E], ji uchovává jako [Concept('secret','tajemství')|E]. Pokud $game_concept_rite$ přijme [Concept('prohibited_tenet_status','zakázané')|E] [Concept('core_tenets','zásady')|E] jako [Concept('core_tenet_status','základní')|E], stává se mnohem [Concept('rite_divergent','odlišnějším')|E] od své [Concept('faith','víry')|E]."
 game_concept_core_tenet_status: "Základní"
 game_concept_core_tenet_status_desc: "[Concept('tenet_status','Postavení zásady')|E] označené jako $game_concept_core_tenet_status$ znamená, že [Concept('rite','ritus')|E] danou [Concept('core_tenet','zásadu')|E] či [Concept('doctrine','doktrínu')|E] aktivně prosazuje jako jednu z praktik, které jej vymezují. Jejím účinkům podléhají všichni [Concept('followers','vyznavači')|E], kteří následují tento $game_concept_rite$."
 game_concept_tenet_knowledge: "Náboženské znalosti"
 game_concept_doctrine_knowledge: "Znalost doktrín"
 game_concept_rite_knowledge: "Znalost ritu"
 game_concept_agnostic_knowledge: "Znalosti"
 game_concept_tenet_knowledge_desc: "Postavy neznají všechny podrobnosti každé náboženské praktiky.\n\nZnámé zásady a doktríny lze využít, když se vytváří [Concept('rite_divergent','odlišný')|E] $game_concept_rite$, a přijmout je jako [Concept('personal_tenets','osobní zásady')|E]. Znát všechny $game_concept_core_tenets$ a $game_concept_doctrines$, které vyznává cílový $game_concept_rite$, usnadňuje přechod k němu.\n\nZnáš všechny [Concept('core_tenets','zásady')|E] a [Concept('doctrines','doktríny')|E] své [Concept('faith','víry')|E]. Nové znalosti můžeš získat od blízkých, například od [Concept('spouses','choťů')|E] či [Concept('friends','přátel')|E], při [Concept('traveling','cestování')|E], během [Concept('activities','aktivit')|E] nebo prostřednictvím [Concept('scheme','intriky')|E] Studovat ritus."
 game_concept_doctrine_knowledge_desc: "$game_concept_tenet_knowledge_desc$"
 game_concept_rite_knowledge_desc: "$game_concept_tenet_knowledge_desc$"
 game_concept_enshrined: "Uložená ve svatyni"
 game_concept_enshrine: "Uložit ve svatyni"
 game_concept_enshrined_desc: "[Concept('holy_relic','Svatá relikvie')|E] uložená ve svatyni na [Concept('holy_site','svatém místě')|E] aktivuje jeho bonusy a zvyšuje jejich účinek podle součtu úrovní [Concept('rarity','vzácnosti')|E] všech takto uložených artefaktů.\n\nArtefakt uložený ve svatyni již nevlastní žádná postava, ale nakládat s ním může [Concept('holder','držitel')|E] svatého místa, jeho [Concept('top_liege','nejvyšší lenní pán')|E] nebo držitel příslušné [Concept('clerical_region','církevní oblasti')|E]. Artefakt již nepodléhá opotřebení. Do svatyně můžeš uložit pouze svaté relikvie vlastní [Concept('faith','víry')|E]; uložené relikvie jiných vyznání nepřinášejí žádný užitek.\n\nUložení artefaktu do svatyně nebo jeho vyjmutí může být spojeno s odměnou či náklady."
 game_concept_holy_relic: "Svatá relikvie"
 game_concept_holy_relics: "Svaté relikvie"
 game_concept_holy_relic_desc: "$game_concept_holy_relic$ je [Concept('artifact','artefakt')|E] s náboženským významem pro určitou [Concept('faith','víru')|E]. $game_concept_holy_relic$ může být [Concept('enshrined','uložena ve svatyni')|E] na [Concept('holy_site','svatém místě')|E] tohoto vyznání a přinášet tak výhody.\n\nNěkteré artefakty jsou pro danou víru svaté samy o sobě, jiné lze [Concept('sanctified','posvětit')|E], aby se staly svatými relikviemi."
 game_concept_sanctified: "Posvěcený"
 game_concept_sanctify: "Posvětit"
 game_concept_sanctifying: "Posvěcování"
 game_concept_sanctified_desc: "Posvěcení [Concept('artifact','artefaktu')|E] z něj činí [Concept('holy_relic','svatou relikvii')|E] pro určitou [Concept('faith','víru')|E]. Artefakt může být posvěcen pro více vyznání."
 game_concept_ecclesiastical_domicile: "$game_concept_ecclesiastical_estate$"
 game_concept_ecclesiastical_domiciles: "$game_concept_ecclesiastical_estates$"
 game_concept_ecclesiastical_domicile_desc: "$game_concept_ecclesiastical_estate_desc$"
 game_concept_ecclesiastical_domicile_building: "$game_concept_ecclesiastical_estate_building$"
 game_concept_ecclesiastical_domicile_buildings: "$game_concept_ecclesiastical_estate_buildings$"
 game_concept_ecclesiastical_domicile_building_desc: "$game_concept_ecclesiastical_estate_building_desc$"
 game_concept_ecclesiastical_estate: "Církevní statek"
 game_concept_ecclesiastical_estates: "Církevní statky"
 game_concept_ecclesiastical_estate_desc: "$game_concept_ecclesiastical_estate$ neboli $game_concept_cathedral_complex$ je druh [Concept('domicile','domicilu')|E] spojený s [Concept('clerical_title','duchovním titulem')|E]. Představuje bezprostřední pozemkové zázemí [Concept('archbishop','arcibiskupa')|E] a jeho stolce. Nižší členové [Concept('clergy','duchovenstva')|E] se systémem vlády [GetGovernment('ecclesiastical_government').GetName] musejí nejprve získat takový [Concept('title','titul')|E], než jim bude statek přidělen.\n\nLze zde stavět [Concept('ecclesiastical_estate_buildings','budovy církevního statku')|E], které zvyšují držitelovo bohatství, [Concept('piety','zbožnost')|E] a [Concept('spiritual_fulfillment','duchovní naplnění')|E]. $game_concept_ecclesiastical_estate$ nemění polohu a zdědí jej další [Concept('holder','držitel')|E] titulu."
 game_concept_ecclesiastical_estate_building: "Budova církevního statku"
 game_concept_ecclesiastical_estate_buildings: "Budovy církevního statku"
 game_concept_ecclesiastical_estate_building_desc: "$game_concept_ecclesiastical_estate_buildings$ jsou jedinečná a trvalá vylepšení [Concept('ecclesiastical_estate','církevního statku')|E].\n\nDržitel může vybírat z mnoha různých staveb, které mu poskytují soukromé příjmy, [Concept('piety','zbožnost')|E], [Concept('spiritual_fulfillment','duchovní naplnění')|E] a přístup k řadě [Concept('decisions','rozhodnutí')|E], [Concept('interactions','interakcí')|E] a dalším možnostem."
 game_concept_cathedral_complex: "Katedrální komplex"
 game_concept_cathedral_complexes: "Katedrální komplexy"
 game_concept_cathedral_complex_desc: "$game_concept_ecclesiastical_estate_desc$"
 game_concept_cathedral_complex_building: "Budova pro $game_concept_cathedral_complex$"
 game_concept_cathedral_complex_buildings: "Budovy pro $game_concept_cathedral_complex$"
 game_concept_cathedral_complex_building_desc: "$game_concept_ecclesiastical_estate_building_desc$"
 game_concept_canonized: "Kanonizovaný"
 game_concept_canonized_desc: "[Concept('character','Postava')|E], která byla po smrti prohlášena za světce či obdobnou uctívanou osobnost jiného vyznání, například walího nebo uctívaného předka, a získala [Concept('trait','rys')|E] [GetTrait('saint').GetName( GetNullCharacter )].\n\nZa ctnostný život může po smrti následovat $game_concept_canonization$: žádá se o ni prostřednictvím [Concept('decision','rozhodnutí')|E], může vyžadovat požehnání [Concept('head_of_faith','hlavy víry')|E] a završuje ji posvěcení světcova hrobu. Místo posledního odpočinku poté přitahuje zbožné poutníky a ostatky mohou vydat [Concept('holy_relics','svaté relikvie')|E]."
 game_concept_canonization: "Kanonizace"
 game_concept_canonization_desc: "$game_concept_canonized_desc$"
 game_concept_sainthood: "Svatost"
 game_concept_sainthood_desc: "$game_concept_canonized_desc$"
 game_concept_strengthen_claim_interaction: "$strengthen_claim_interaction$"
 game_concept_strengthen_claim_interaction_desc: "[Concept('interaction','Interakce')|E], která díky podpoře příslušného [Concept('ecclesiastical','církevního')|E] nebo [Concept('theocratic','teokratického')|E] [Concept('ruler','vládce')|E] posiluje [Concept('unpressed_claim','neuplatněný nárok')|E] na [Concept('pressed_claim','uplatněný nárok')|E]."
 game_concept_ecclesiastic_grant_claim_interaction: "$ecclesiastic_grant_claim_interaction$"
 game_concept_ecclesiastic_grant_claim_interaction_desc: "[Concept('interaction','Interakce')|E], která uděluje [Concept('claim','nárok')|E] na [Concept('title','titul')|E] patřící jinému [Concept('ruler','vládci')|E]. Vyžaduje souhlas příslušné [Concept('ecclesiastical','církevní')|E] nebo [Concept('theocratic','teokratické')|E] [Concept('character','postavy')|E]."
 game_concept_ecclesiastic_transfer_land_interaction: "$ecclesiastic_transfer_land_interaction$"
 game_concept_ecclesiastic_transfer_land_interaction_desc: "[Concept('interaction','Interakce')|E], která umožňuje mírové předání [Concept('title','titulu')|E] nebo [Concept('vassal','vazala')|E] mezi dvěma [Concept('rulers','vládci')|E]. Vyžaduje souhlas cílového [Concept('ruler','vládce')|E] a dalšího prostředníka.\n\nOdmítnutí obvykle stojí příjemce [Concept('piety','zbožnost')|E] a [Concept('legitimacy','legitimitu')|E], ale i další cenu, kterou iniciátor zvolí jako prostředek k vynucení souhlasu.\n\nProstředník, příslušný [Concept('ecclesiastical','církevní')|E] nebo [Concept('theocratic','teokratický')|E] vládce, může tuto interakci zcela zakázat. Pokud platí [Concept('law','zákon')|E] [GetLaw('church_authority_3').GetName], může také vynutit její přijetí."
 game_concept_challenger_hof: "Konkurenční hlava víry"
 game_concept_antipope: "Vzdoropapež"
 game_concept_challenger_hof_desc: "$game_concept_challenger_hof$ je soupeřící [Concept('head_of_faith','hlava víry')|E] ustavená proti legitimní autoritě, jíž je $game_concept_head_of_faith$ [Concept('mainline_rite','hlavního ritu')|E].\n\n[Concept('ruler','Vládce')|E] může sponzorovat člena svého [Concept('clergy','duchovenstva')|E], aby byla ustavena $game_concept_challenger_hof$. [Concept('ruler','Vládce')|E] z řad [Concept('clergy','duchovenstva')|E] nebo vládce [Concept('faith','víry')|E] se světskou hlavou víry se může místo toho prohlásit za konkurenční hlavu sám.\n\nSponzorovaná $game_concept_challenger_hof$ přijímá [Concept('rite','ritus')|E] svého sponzora a stává se jeho [Concept('external_clerical_puppet','loutkovým duchovním vládcem')|E]. Sponzor na ni zároveň získává [Concept('weak_hook','slabou páku')|E].\n\n$game_concept_head_of_faith$, kterou uznává $game_concept_mainline_rite$, nemůže [Concept('excommunicate','exkomunikovat')|E] ty, které vede $game_concept_challenger_hof$: jejího sponzora a jeho [Concept('vassals','vazaly')|E].\n\nVšichni, které vede $game_concept_challenger_hof$, jí předkládají své duchovní žádosti. Už je nevyřizuje $game_concept_head_of_faith$, kterou uznává $game_concept_mainline_rite$. Patří mezi ně tyto [Concept('interactions','interakce')|E]:\n$EFFECT_LIST_BULLET$[Concept('petition_antipope_indulgences_interaction','Požádat vzdoropapeže o odpustek')|E]\n$EFFECT_LIST_BULLET$[Concept('petition_antipope_gold_interaction','Požádat vzdoropapeže o zlato')|E]\n\n$game_concept_challenger_hof$ nebo její sponzor mohou použít [Concept('casus_belli','casus belli')|E] [Concept('pam_challenge_hof_cb','Prosadit konkurenční hlavu víry')|E]. Protivníkem v takové válce je legitimní $game_concept_head_of_faith$.\n\nSoupeřící [Concept('kings','králové')|E] či vládci vyšší hodnosti stejné [Concept('faith','víry')|E] mohou místo toho použít casus belli [Concept('pam_antiking_cb','Sesadit vzdoropapeže')|E] proti sponzorovi a sesadit soupeřícího uchazeče."
 game_concept_antipope_desc: "$game_concept_challenger_hof_desc$"
 game_concept_pam_challenge_hof_cb: "Prosadit konkurenční hlavu víry"
 game_concept_pam_challenge_hof_cb_desc: "[Concept('casus_belli','Casus belli')|E], které používá [Concept('challenger_hof','konkurenční hlava víry')|E] nebo její sponzor proti legitimní [Concept('head_of_faith','hlavě')|E] své [Concept('faith','víry')|E]. Vítězství zajistí, že $game_concept_challenger_hof$ převezme nejvyšší úřad a bude uznávána jako $game_concept_head_of_faith$. Její [Concept('rite','ritus')|E] se zároveň stane [Concept('mainline_rite','hlavním ritem')|E]. Pokud zvítězí sponzor s vyšší hodností, jeho $game_concept_challenger_hof$ mu navíc podléhá jako [Concept('vassal','vazal')|E]."
 game_concept_pam_antiking_cb: "Sesadit vzdoropapeže"
 game_concept_pam_antiking_cb_desc: "[Concept('casus_belli','Casus belli')|E] dostupné [Concept('christian','křesťanským')|E] [Concept('kings','králům')|E] a vládcům vyšší hodnosti, kteří [Concept('challenger_hof','konkurenční hlavu víry')|E] nesponzorují ani sami nezastávají její úřad. Používá se proti [Concept('independent','nezávislému')|E] sponzorovi vlastního [Concept('faith','vyznání')|E], aby byla sesazena jeho $game_concept_challenger_hof$ a vítěz získal vděčnost legitimní [Concept('head_of_faith','hlavy víry')|E]."
 game_concept_petition_antipope_indulgences_interaction: "Požádat vzdoropapeže o odpustek"
 game_concept_petition_antipope_indulgences_interaction_desc: "[Concept('interaction','Interakce')|E] dostupná každému, kdo následuje [Concept('challenger_hof','konkurenční hlavu víry')|E]. Zaplať [Concept('gold','zlatem')|E] a tvůj $game_concept_antipope$ ti poskytne odpuštění a [Concept('piety','zbožnost')|E]. Tak obejdeš [Concept('head_of_faith','hlavu víry')|E] [Concept('mainline_rite','hlavního ritu')|E]. Žádosti sponzora jsou přijímány automaticky."
 game_concept_petition_antipope_gold_interaction: "Požádat vzdoropapeže o zlato"
 game_concept_petition_antipope_gold_interaction_desc: "[Concept('interaction','Interakce')|E] dostupná každému, kdo následuje [Concept('challenger_hof','konkurenční hlavu víry')|E]. Tvůj $game_concept_antipope$ ti na požádání může poskytnout [Concept('gold','zlato')|E]. Žádosti sponzora jsou přijímány automaticky."
 game_concept_pam_shape_the_christian_church_decision: "$pam_shape_the_christian_church_decision$"
 game_concept_pam_shape_the_christian_church_decision_desc: "[Concept('decision','Rozhodnutí')|E] dostupné prelátům a mocným vládcům, které posouvá [Concept('the_christian_church','křesťanskou církev')|E] ke kapitole podle jejich volby."
 game_concept_tenet_popularity: "Rozšířenost zásady"
 game_concept_tenet_popularity_desc: "Jak se v rámci [Concept('faith','víry')|E] šíří [Concept('personal_tenets','osobní zásady')|E], jejich praktikování je stále běžnější. $game_concept_tenet_popularity$ sleduje, nakolik je [Concept('core_tenet','zásada')|E] rozšířená, a ovlivňuje pravděpodobnost, že se stane tématem debaty na [Concept('ecumenical_council','ekumenickém koncilu')|E] nebo předmětem [Concept('papal_bull','papežské buly')|E].\n\nČím vyšší je $game_concept_tenet_popularity$, tím více se [Concept('clergy','duchovenstvo')|E] při debatě na [Concept('ecumenical_council','ekumenickém koncilu')|E] přikloní na stranu dané zásady. Jakmile její $game_concept_tenet_popularity$ dosáhne #high [EmptyScope.ScriptValue('pam_tenet_popularity_ai_override_threshold')|0]#!, [Concept('head_of_faith','hlava víry')|E] ji s největší pravděpodobností prohlásí za [Concept('permitted_tenet_status','povolenou')|E] bez ohledu na vlastní přesvědčení."
 game_concept_ecumenical_council_innovator: "Novátor"
 game_concept_ec_innovator: "$game_concept_ecumenical_council_innovator$"
 game_concept_ecumenical_council_innovators: "Novátoři"
 game_concept_ec_innovators: "$game_concept_ecumenical_council_innovators$"
 game_concept_ecumenical_council_innovator_desc: "Novátoři jsou [Concept('activity_guests_short','hosté')|E] [Concept('ecumenical_council','ekumenického koncilu')|E], [Concept('activity','aktivity')|E], při níž hlasují spolu s [Concept('activity_host_short','pořadatelem')|E] pro jeho návrhy na změnu postavení určité [Concept('core_tenet','zásady')|E] nebo [Concept('doctrine','doktríny')|E].\n\nStojí přímo proti [Concept('ec_conservatives','konzervativcům')|E], hostům, kteří hlasují proti jakýmkoli změnám a chtějí zachovat současný stav.$game_concept_ecumenical_council_groups_help$"
 game_concept_ecumenical_council_groups_help: "\n\n#help Hlasovat mohou tyto [Concept('characters','postavy')|E]: členové [Concept('clergy','duchovenstva')|E], [Concept('rulers','vládci')|E] s [Concept('clerical_puppet','loutkovým zemským knězem')|E] a [Concept('activity_host','pořadatel aktivity')|E]#!"
 game_concept_ecumenical_council_conservative: "Konzervativec"
 game_concept_ec_conservative: "$game_concept_ecumenical_council_conservative$"
 game_concept_ecumenical_council_conservatives: "Konzervativci"
 game_concept_ec_conservatives: "$game_concept_ecumenical_council_conservatives$"
 game_concept_ecumenical_council_conservative_desc: "Konzervativci jsou [Concept('activity_guests_short','hosté')|E] [Concept('ecumenical_council','ekumenického koncilu')|E], [Concept('activity','aktivity')|E], při níž hlasují proti návrhům [Concept('activity_host_short','pořadatele')|E] na změnu postavení určité [Concept('core_tenet','zásady')|E] nebo [Concept('doctrine','doktríny')|E].\n\nStojí přímo proti [Concept('ec_innovators','novátorům')|E], hostům, kteří se snaží změny prosadit.$game_concept_ecumenical_council_groups_help$"
 game_concept_request_ecclesiastical_title_expansion_interaction: "$request_ecclesiastical_title_expansion_interaction$"
 game_concept_request_ecclesiastical_title_expansion_interaction_desc: "[Concept('interaction','Interakce')|E], kterou [Concept('ecclesiastical','církevní')|E] [Concept('rulers','vládci')|E] používají k rozšíření své [Concept('clerical_region','církevní oblasti')|E] o [Concept('de_jure','de iure')|E] [Concept('counties','hrabství')|E] sousedního [Concept('duchy','vévodství')|E].\n\nTo je možné pouze se souhlasem [Concept('head_of_faith','hlavy víry')|E]."
 game_concept_ecclesiastic_incite_holy_war_interaction: "$ecclesiastic_incite_holy_war_interaction$"
 game_concept_ecclesiastic_incite_holy_war_interaction_desc: "[Concept('interaction','Interakce')|E], kterou [Concept('ecclesiastical','církevní')|E] [Concept('rulers','vládci')|E] mohou přimět světské vládce stejné [Concept('faith','víry')|E] k vyhlášení [Concept('holy_war','svaté války')|E] vládcům nepřátelského vyznání."
 game_concept_ecclesiastic_incite_claim_war_interaction: "$ecclesiastic_incite_claim_war_interaction$"
 game_concept_ecclesiastic_incite_claim_war_interaction_desc: "[Concept('interaction','Interakce')|E], kterou [Concept('ecclesiastical','církevní')|E] [Concept('rulers','vládci')|E] mohou přimět světské vládce stejné [Concept('faith','víry')|E] k vyhlášení [Concept('war','války')|E] za prosazení [Concept('claim','nároku')|E] proti světskému [Concept('ruler','vládci')|E]."
 game_concept_treasury_cardinal_budget: "Kardinálský rozpočet"
 game_concept_treasury_cardinal_budget_short: "Kardinál"
 game_concept_treasury_cardinal_budget_benefices: "Kardinálské beneficie"
 game_concept_treasury_cardinal_budget_desc: "Prostředky přidělené [Concept('cardinals','kardinálům')|E] z ústřední církevní pokladny, které představují přímo či nepřímo přidělené [Glossary( 'beneficie', 'CARDINAL_BENEFICES_GLOSS' )]."
 CARDINAL_BENEFICES_GLOSS: "Beneficie byly místní či vzdálené majetky, úřady nebo podíly na papežských příjmech, které mohly být členovi duchovenstva svěřeny #i in commendam#! (do správy). Přinášely příjem, obvykle bez přímých správních povinností."
 game_concept_spiritual_counsel_interaction: "$spiritual_counsel_interaction$"
 game_concept_spiritual_counsel_interaction_desc: "[Concept('interaction','Interakce')|E], při níž [Concept('clerical','duchovní')|E] autorita poskytuje útěchu v podobě [Concept('spiritual_fulfillment','duchovního naplnění')|E] výměnou za [Concept('hook','páku')|E]"
 game_concept_request_clerical_chastity_interaction: "$request_clerical_chastity_interaction$"
 game_concept_request_clerical_chastity_interaction_desc: "[Concept('interaction','Interakce')|E], která požaduje, aby jiná [Concept('character','postava')|E] složila slib cudnosti a přijala dlouhodobý postih k [Concept('fertility','plodnosti')|E]."
 game_concept_military_holy_order: "Vojenský řád"
 game_concept_military_holy_orders: "Vojenské řády"
 game_concept_military_holy_order_i: "@government_type_holy_order!"
 game_concept_military_holy_order_possessive: "Vojenského řádu"
 game_concept_military_holy_orders_possessive: "Vojenských řádů"
 game_concept_military_holy_order_desc: "$game_concept_military_holy_order$ je druh [Concept('holy_order','svatého řádu')|E] tvořený bojovníky, kteří přísahali bránit a rozšiřovat území své [Concept('faith','víry')|E].\n\nVládci stejného vyznání mohou řád najmout za cenu [Concept('piety','zbožnosti')|E], pokud vedou [Concept('war','válku')|E] s protivníkem, jehož $game_concept_faith$ je [Concept('faith_hostile','nepřátelská')|L] nebo [Concept('faith_evil','zavrženíhodná')|L]. Po skončení této války řád přestane za daného vládce bojovat.\n\n$game_concept_holy_order$ může mít [Concept('military_holy_order_patron','patrona vojenského řádu')|E], který za jeho služby nemusí platit."
 game_concept_military_holy_order_patron: "Patron vojenského řádu"
 game_concept_military_holy_order_patronage: "Patronát vojenského řádu"
 game_concept_military_holy_order_patronize: "Podporovat"
 game_concept_military_holy_order_patron_desc: "$game_concept_holy_order_patron$ příslušného [Concept('military_holy_order','vojenského řádu')|E] je [Concept('ruler','vládce')|E] na [Concept('title_tier','úrovni titulu')|E] [Concept('duke','vévody')|E] nebo vyšší, který sdílí jeho [Concept('faith','víru')|E] a jehož [Concept('realm','panství')|E] zahrnuje hlavní sídlo řádu.\n\n$game_concept_holy_order_patron$ si může vyžádat podporu proti náboženským nepřátelům a $game_concept_holy_order$ mu ji poskytne zdarma, bez placení [Concept('piety','zbožností')|E].\n\nPatronát může přejít na [Concept('vassals','vazaly')|E] na [Concept('title_tier','úrovni titulu')|E] [Concept('duke','vévody')|E] nebo vyšší, pokud jim připadne kontrola nad hlavním sídlem řádu."
