l_polish:
 game_concept_puppet: "Loutka" # todo: NEW TRANSLATION
 game_concept_puppets: "Loutky" # todo: NEW TRANSLATION
 game_concept_puppeted: "Ovládaný"
 game_concept_puppeting: "Ovládání loutek"
 game_concept_puppet_type: "Typ loutky"
 game_concept_puppet_types: "Typy loutek"
 game_concept_puppet_type_desc: "[puppet|e] má vždy určitý typ, který určuje, jaké činy může vaším jménem vykonávat.\n\nVětšinu zvláštních činů mají společnou, ale každý $game_concept_puppet_type$ nabízí jedinečné činy dostupné pouze loutkám daného typu.\n\nNapříklad [clerical_puppet|e] může vaším jménem někoho [excommunicate|e], zatímco [external_ruler_puppet|e] lze přimět, aby propustil [tributary|e] nebo se rozvedl se svým [spouse|e].\n\nOd každého typu můžete mít pouze jednu $game_concept_puppet$." # todo: NEW TRANSLATION
 game_concept_puppet_desc: "Loutka je [character|E] pod kontrolou [puppeteer|E], který jejím prostřednictvím může provádět zvláštní činy.\n\nJednání prostřednictvím loutky otevírá možnosti, které by jinak zůstaly nedostupné: [clerical_puppet|E] může vaším jménem požádat o [clerical_titles|E] nebo [excommunication|E], zatímco [external_ruler_puppet|E] lze přimět k propuštění [tributaries|E], udělení nezávislosti nebo rozvodu se svým [spouse|E].\n\nDostupné činy určuje [puppet_type|E]." # todo: NEW TRANSLATION
 game_concept_puppeteer: "Loutkář" # todo: NEW TRANSLATION
 game_concept_puppeteers: "Loutkáři" # todo: NEW TRANSLATION
 game_concept_puppeteer_possessive: "Loutkáře" # todo: NEW TRANSLATION
 game_concept_puppeteers_possessive: "Loutkářů" # todo: NEW TRANSLATION
 game_concept_puppeteer_desc: "Loutkář je [character|E], který ovládá jednu či více [puppets|E].\n\nJednáním prostřednictvím svých loutek získává loutkář moc přesahující jeho postavení, například vliv [clergy|E] nebo autoritu cizí [realm|E]." # todo: NEW TRANSLATION
 game_concept_clerical_puppet: "Loutkový zemský kněz"
 game_concept_clerical_puppets: "Loutkoví zemští kněží"
 game_concept_clerical_puppet_desc: "[realm_priest|E], který je [puppet|E] svého [liege|E].\n\nJeho prostřednictvím může loutkář zasahovat do záležitostí [faith|E]: žádat [head_of_faith|E] o [clerical_titles|E] nebo [excommunication|E], spravovat [holy_sites|E], založit nový [rite|E] či pořádat [ecumenical_council|E]." # todo: NEW TRANSLATION
 game_concept_external_clerical_puppet: "Loutkový duchovní vládce"
 game_concept_external_clerical_puppets: "Loutkoví duchovní vládci"
 game_concept_external_clerical_puppet_desc: "Mocný člen [clergy|E] — [archbishop|E] nebo dokonce [head_of_faith|E] —, který se stal [puppet|E] jiného [ruler|E].\n\nČím mocnější duchovní, tím větší dosah: ovládaná hlava víry může vaším jménem [excommunicate|E] vaše nepřátele, jmenovat [cardinals|E], udělit [pressed_claim|E] nebo podnítit [holy_war|E]." # todo: NEW TRANSLATION
 game_concept_external_ruler_puppet: "Loutkový světský vládce"
 game_concept_external_ruler_puppets: "Loutkoví světští vládci"
 game_concept_external_ruler_puppet_desc: "Ne-[clergy|E] [ruler|E], který se stal [puppet|E] jiného [character|E].\n\nProstřednictvím této loutky můžete zasahovat do záležitostí jiných [realms|E], například pomocí [schemes|E] nebo [imprisonment|E].\n\n\nZískání loutky tohoto typu vyžaduje [interaction|E] #V $make_external_ruler_puppet_interaction$#!, která se odemkne, pokud platí alespoň jedna z následujících podmínek:\n$BULLET_WITH_TAB$Jste [clergy|E] [vassal|E] cíle\n$BULLET_WITH_TAB$Jste [GetTrait('seducer').GetName( GetNullCharacter )] a cíl je váš [lover|E], nebo vaše [soulmate|E], pokud má cíl hodnost [king|E] či vyšší\n$BULLET_WITH_TAB$Jste [GetTrait('torturer').GetName( GetNullCharacter )] a držíte cíl ve svém [dungeon|E]\n$BULLET_WITH_TAB$Jste [GetTrait('family_first').GetName( GetNullCharacter )] a cíl je vaše [close_family|E]\n$BULLET_WITH_TAB$Jste [GetTrait('diplomat').GetName( GetNullCharacter )] a cíl je [independent_ruler|E]\n$BULLET_WITH_TAB$Jste [GetTrait('gallant').GetName( GetNullCharacter )] a cíl je váš [spouse|E]\n$BULLET_WITH_TAB$Jste [diarch|E] cíle v rámci [entrenched_regency|E]" # todo: NEW TRANSLATION
 game_concept_ecumenical_council: "Ekumenický koncil" # todo: NEW TRANSLATION
 game_concept_ecumenical_council_desc: "$game_concept_ecumenical_council$ je [activity|E], při níž se nejvyšší představitelé [clergy|E] celého křesťanstva shromáždí, aby rozhodli o budoucnosti církve.\n\nBěhem řady debat shromáždění preláti rozhodují o [tenet_status|E] sporných [core_tenets|E] — prohlásí je za [permitted_tenet_status|E] či [prohibited_tenet_status|E], nebo je povýší na [core_tenet_status|E] — a stanovují [doctrines|E] dané [faith|E]." # todo: NEW TRANSLATION
 game_concept_ecumenical_councils: "Ekumenické koncily" # todo: NEW TRANSLATION
 game_concept_ecumenical_councils_desc: "$game_concept_ecumenical_council_desc$" # todo: NEW TRANSLATION
 game_concept_schism: "Rozkol" # todo: NEW TRANSLATION
 game_concept_schism_desc: "Velké $game_concept_schism$ je okamžik, kdy se jednotná [faith|E] $christian_faith$ rozpadne podél římského a řeckého [rites|E] na $catholic$ a $orthodox$.\n\nHrozí, když [situation|E] [the_christian_church|E] vstoupí do určitých [the_christian_church_chapters_short|E], a vládci celého křesťanského světa si musí zvolit stranu. Pokud se rozkoly nezahojí — nebo se jejich rozdělení nevynutí — prostřednictvím [decisions|E], rozkol se s koncem kapitoly stane trvalým." # todo: NEW TRANSLATION
 game_concept_schisms: "Rozkoly" # todo: NEW TRANSLATION
 game_concept_schisms_desc: "$game_concept_schism_desc$" # todo: NEW TRANSLATION
 game_concept_clerical_title: "Duchovní titul" # todo: NEW TRANSLATION
 game_concept_clerical_titles: "Duchovní tituly" # todo: NEW TRANSLATION
 game_concept_clerical_title_desc: "$game_concept_clerical_title$ je [ecclesiastical|E] [title|E] [clergy|E], který spravuje [clerical_region|E] v rámci [faith|E]. Mezi [christian|E] vírami jde o [archdiocese|E].\n\nDržitel je [religious_superior|E] [clergy|E] v daném regionu a obvykle jej jmenuje [head_of_faith|E]." # todo: NEW TRANSLATION
 game_concept_the_christian_church: "Křesťanská církev" # todo: NEW TRANSLATION
 game_concept_the_christian_church_desc: "Křesťanská církev je církevní organizace, která dohlíží na následovníky Ježíše Krista a vede je. Ve hře je představována jako [situation|E], jež postupuje přes řadu [the_christian_church_chapters_short|E].\n\nJejí hranice zahrnují všechny [archdiocese|E] světa; jejími členy jsou všichni [christian|E] [ruler|E] s hodností [county|E] nebo vyšší, jejichž [realm|E] zasahuje alespoň zčásti do některé arcidiecéze, ať už jde o duchovní, nebo světské vládce." # todo: NEW TRANSLATION
 game_concept_christendom: "Křesťanstvo" # todo: NEW TRANSLATION
 game_concept_christendom_desc: "$game_concept_christendom$ zahrnuje [realm|E] všech [independent|E] [christian|E] [ruler|E], kteří jsou členy [situation|E] [the_christian_church|E]." # todo: NEW TRANSLATION
 game_concept_christian: "Křesťan" # todo: NEW TRANSLATION
 game_concept_christians: "Křesťané" # todo: NEW TRANSLATION
 game_concept_christian_possessive: "Křesťana" # todo: NEW TRANSLATION
 game_concept_christian_desc: "Následovník křesťanského [religion|E]." # todo: NEW TRANSLATION
 game_concept_papal_bull: "Papežská bula" # todo: NEW TRANSLATION
 game_concept_papal_bulls: "Papežské buly" # todo: NEW TRANSLATION
 game_concept_bull: "Bula" # todo: NEW TRANSLATION
 game_concept_bulls: "Buly" # todo: NEW TRANSLATION
 game_concept_papal_bull_desc: "Papežská bula je slavnostní výnos [head_of_faith|E] [christian|E] [faith|E], podpořený autoritou [the_christian_church|E].\n\nKřesťanský [head_of_faith|E] s dostatečnou [church_authority|E] může vyhlásit bulu prostřednictvím [decision|E] [GetDecisionWithKey('enact_a_bull_decision').GetName] a utratit [piety|E] za:\n\n$EFFECT_LIST_BULLET$Vyhlášení [great_holy_war|E]\n$EFFECT_LIST_BULLET$Označení [rite|E] za [heresy|E]\n$EFFECT_LIST_BULLET$Prohlášení [core_tenet|E] za [permitted_tenet_status|E] nebo [prohibited_tenet_status|E]" # todo: NEW TRANSLATION
 game_concept_situation_the_christian_church_phase: "Kapitola křesťanské církve" # todo: NEW TRANSLATION
 game_concept_the_christian_church_chapter_short: "Kapitola" # todo: NEW TRANSLATION
 game_concept_the_christian_church_chapters_short: "Kapitoly" # todo: NEW TRANSLATION
 game_concept_situation_the_christian_church_phases: "Kapitoly křesťanské církve" # todo: NEW TRANSLATION
 game_concept_situation_the_christian_church_phase_desc: "Kapitoly jsou [situation_phases|E] [the_christian_church|E]. Celkem existuje sedm kapitol rozdělených do čtyř [the_christian_church_chapter_types|E]." # todo: NEW TRANSLATION
 game_concept_the_christian_church_chapter_type: "Typ kapitoly" # todo: NEW TRANSLATION
 game_concept_the_christian_church_chapter_types: "Typy kapitol" # todo: NEW TRANSLATION
 game_concept_the_christian_church_chapter_type_desc: "V [the_christian_church|E] existují čtyři $game_concept_the_christian_church_chapter_types$, které rozdělují [situation_the_christian_church_phases|E] do kategorií.\n\n$game_concept_the_christian_church_chapter_types$: [the_christian_church_unstable_short|E], [the_christian_church_crisis_short|E], [the_christian_church_zeal_short|E] a [the_christian_church_stability_short|E]" # todo: NEW TRANSLATION
 game_concept_the_christian_church_unstable: "Kapitola nestability" # todo: NEW TRANSLATION
 game_concept_the_christian_church_unstable_short: "Nestabilita" # todo: NEW TRANSLATION
 game_concept_the_christian_church_unstable_desc: "#high $game_concept_the_christian_church_unstable$#! [the_christian_church|E] je obdobím, kdy poslušnost slábne:\n\n[rulers|E] lze snáze přimět k přijetí jiného [rite|E], exkomunikace mohou být častější a [gold|E] lze utrácet pro vlastní prospěch.\n\n#high $fragile_unity$#! a #high $reform_phase$#! jsou $game_concept_the_christian_church_unstable_short$ [the_christian_church_chapters_short|E]." # todo: NEW TRANSLATION
 game_concept_the_christian_church_zeal: "Kapitola horlivosti" # todo: NEW TRANSLATION
 game_concept_the_christian_church_zeal_short: "Horlivost" # todo: NEW TRANSLATION
 game_concept_the_christian_church_zeal_desc: "#high $game_concept_the_christian_church_zeal$#! rozdmýchává plameny náboženského zápalu:\n\nMohou probíhat hromadné konverze, [great_holy_wars|E] mohou být častější, [papal_bulls|E] mohou být vydávány častěji a konverze k jiné [faith|E] může být snazší.\n\n#high $conversion_phase$#! a #high $crusade_phase$#! jsou $game_concept_the_christian_church_zeal_short$ [the_christian_church_chapters_short|E]." # todo: NEW TRANSLATION
 game_concept_the_christian_church_stability: "Kapitola stability" # todo: NEW TRANSLATION
 game_concept_the_christian_church_stability_short: "Stabilita" # todo: NEW TRANSLATION
 game_concept_the_christian_church_stability_desc: "#high $game_concept_the_christian_church_stability$#! je pro [the_christian_church|E] vzácným obdobím klidu:\n\nStavby v [temple_holding|E] jsou levnější, výstavba Velkých katedrál postupuje rychleji, [characters|E] se častěji stávají [GetTrait('devoted').GetName( GetNullCharacter )] a Velký rozkol může být napraven.\n\n#high $concord$#! je jedinou $game_concept_the_christian_church_stability$." # todo: NEW TRANSLATION
 game_concept_the_christian_church_crisis: "Kapitola krize" # todo: NEW TRANSLATION
 game_concept_the_christian_church_crisis_short: "Krize" # todo: NEW TRANSLATION
 game_concept_the_christian_church_crisis_desc: "#high $game_concept_the_christian_church_crisis$#! je pro [the_christian_church|E] obdobím největší zkázy:\n\nOdpustky mohou být levnější, [ecumenical_councils|E] častější, [rulers|E] mohou jmenovat vlastního [court_chaplain|E], [clergy|E] se mohou ženit a vdávat, [head_of_faith|E] může odmítnout pořádat [anointment|E] a [taxes|E] mohou klesat.\n\n#high $saeculum_obscurum$#! a #high $investiture_crisis$#! jsou $game_concept_the_christian_church_crisis_short$ [the_christian_church_chapters_short|E]." # todo: NEW TRANSLATION
 game_concept_head_of_rite: "Hlava ritu" # todo: NEW TRANSLATION
 game_concept_head_of_rite_desc: "Nejvýznamnější [character|E] daného [rite|E]: [head_of_faith|E], pokud se k němu hlásí; jinak držitel [clerical_region|E] s největším zastoupením tohoto ritu, a pokud ani takového nelze určit, [ruler|E], který ovládá nejvíce [counties|E] daného [rite_possessive|E].\n\nPouze $game_concept_head_of_rite$ může upravovat [core_tenets|E] a [doctrines|E] svého [rite_possessive|E] a právě on zastupuje své věřící, když se církev blíží k [schism|E]." # todo: NEW TRANSLATION
 game_concept_ecclesiastical: "Církevní" # todo: NEW TRANSLATION
 game_concept_ecclesiastical_government: "Církevní vláda" # todo: NEW TRANSLATION
 game_concept_ecclesiastical_i: "@government_type_ecclesiastical!" # todo: NEW TRANSLATION
 game_concept_ecclesiastical_desc: "$game_concept_ecclesiastical$ je [theocratic|E] [government_form|E], kterému vládnou [christian|E] [clergy|E] [rulers|E], například [bishops|E] a [archbishops|E].\n\nVětšina církevních vládců jsou teokratičtí [vassals|E], kteří si [lease|E] své [temple_holdings|E] od světského [liege|E] a odpovídají [head_of_faith|E]. [bishop|E], který vlastní [landed|E] [titles|E], jež nejsou [leased|E], však může vládnout jako samostatný církevní [ruler|E]. Moc, kterou takový vládce uplatňuje nad vlastními [vassals|E], určuje jeho [church_authority|E]." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [independent|E]
 game_concept_lease_contract: "Nájemní smlouva" # todo: NEW TRANSLATION
 game_concept_lease_contract_desc: "Právní podmínky, za nichž postava [leasing|E] titul. Určuje také, kdo je jejím [religious_superior|E]." # todo: NEW TRANSLATION
 game_concept_church_obligations: "Církevní odvody" # todo: NEW TRANSLATION
 game_concept_church_obligations_desc: "Církevní odvody představují souhrnné povinnosti týkající se příjmů z [church_holding|E]. Tyto odvody se platí [superior|E], [head_of_faith|E] a/nebo místnímu světskému [ruler|E]. Příkladem jsou [church_centralization|E] a [secular_obligations|E]." # todo: NEW TRANSLATION
 game_concept_church_centralization: "Centralizace církve" # todo: NEW TRANSLATION
 game_concept_minimal_centralization: "Minimální centralizace" # todo: NEW TRANSLATION
 game_concept_mild_centralization: "Mírná centralizace" # todo: NEW TRANSLATION
 game_concept_strong_centralization: "Silná centralizace" # todo: NEW TRANSLATION
 game_concept_church_centralization_desc: "$game_concept_church_centralization$ vyjadřuje, do jaké míry církev přijala centralizovanou autoritu a finanční struktury. Čím silnější je centralizace, tím větší část příjmů plyne vzhůru církevní hierarchií.\n\nTypy jsou:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_minimal_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_mild_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_strong_centralization$" # todo: NEW TRANSLATION
 game_concept_secular_obligations: "Světské odvody" # todo: NEW TRANSLATION
 game_concept_personal_obligations: "Osobní odvody" # todo: NEW TRANSLATION
 game_concept_fixed_obligations: "Pevné odvody" # todo: NEW TRANSLATION
 game_concept_secular_obligations_desc: "$game_concept_secular_obligations$ určují, jak se stanovuje výše příjmů z [church_holdings|E], která náleží místnímu [secular_ruler|E].\n\nTypy jsou:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_personal_secular_obligations$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_fixed_secular_obligations$\n\nV některých kapitolách mají světští vládci navíc místní moc nad církví:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_local_secular_power$" # todo: NEW TRANSLATION
 game_concept_religious_superior: "Nadřízený duchovní" # todo: NEW TRANSLATION
 game_concept_religious_superiors: "Nadřízení duchovní" # todo: NEW TRANSLATION
 game_concept_superior: "Nadřízený" # todo: NEW TRANSLATION
 game_concept_religious_superior_desc: "Nadřízený duchovní je [character|E], který má v hierarchické náboženské struktuře náboženskou pravomoc nad jedním či více [subordinate|E] duchovními." # todo: NEW TRANSLATION
 game_concept_religious_subordinate: "Podřízený duchovní" # todo: NEW TRANSLATION
 game_concept_religious_subordinates: "Podřízení duchovní" # todo: NEW TRANSLATION
 game_concept_subordinate: "Podřízený" # todo: NEW TRANSLATION
 game_concept_subordinates: "Podřízení" # todo: NEW TRANSLATION
 game_concept_religious_subordinate_desc: "Podřízený duchovní je [character|E], který má v hierarchické náboženské struktuře svého [religious_superior|E]." # todo: NEW TRANSLATION
 game_concept_clerical_region: "Církevní oblast" # todo: NEW TRANSLATION
 game_concept_clerical_regions: "Církevní oblasti" # todo: NEW TRANSLATION
 game_concept_clerical_region_possessive: "Církevní oblasti" # todo: NEW TRANSLATION
 game_concept_clerical_regions_possessive: "Církevních oblastí" # todo: NEW TRANSLATION
 game_concept_clerical_region_desc: "Církevní oblast je zeměpisná oblast pod jurisdikcí [clerical_title|E]. Každý člen duchovenstva v této oblasti je [subordinate|E] držitele [title|E], s nímž je oblast spojena.\n\n[ruler|E] náleží k církevní oblasti, v níž se nachází jeho [capital|E] [county|E], a nová oblast vzniká kolem [capital|E] [primary_title|E] svého zakladatele. Oblast může zahrnovat více [realms|E] a mít podřízené z různých říší.\n\n$game_concept_ruler$ může současně držet pouze jednu $game_concept_clerical_region$. Pokud získá novou oblast, přijde o veškerou půdu, kterou držel v té předchozí." # todo: NEW TRANSLATION
 game_concept_clerical_region_capital: "Sídlo církevní oblasti"
 game_concept_clerical_region_capitals: "Sídla církevních oblastí"
 game_concept_clerical_region_capital_desc: "Hlavním městem církevní oblasti je [county|E], na němž byla [clerical_region|E] založena jako [ecclesiastical_estate|E]. Slouží jako sídlo [clerical_title|E], který oblast spravuje. Na rozdíl od [de_jure_capital|E] je pevně spjato s oblastí a nelze je přesunout." # todo: NEW TRANSLATION
 clerical_electors: "Církevní volitelé" # todo: NEW TRANSLATION
 game_concept_archdiocese: "Arcidiecéze" # todo: NEW TRANSLATION
 game_concept_archdioceses: "Arcidiecéze" # todo: NEW TRANSLATION
 game_concept_archdiocese_desc: "Arcidiecéze je [christian|E] podobou [clerical_region|E], církevním územím, kterému prostřednictvím svého [clerical_title|E] vládne [archbishop|E] a jehož sídlo se nachází v hlavním [county|E], kde lze postavit [grand_cathedral|E].\n\n[Christian|E] [ruler|E] se v duchovních záležitostech zodpovídá [archbishop|E] arcidiecéze, do níž spadá jeho [capital|E] [county|E]. Území spadající pod arcidiecéze pak společně tvoří [situation|E] [the_christian_church|E]." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [christian|E]; navyše [Christian|E]
 game_concept_grand_cathedral: "Velkolepá katedrála" # todo: NEW TRANSLATION
 game_concept_grand_cathedrals: "Velkolepé katedrály" # todo: NEW TRANSLATION
 game_concept_grand_cathedral_desc: "Velkolepá katedrála je [great_building|E] vybudovaná prostřednictvím [great_project|E] v hlavním městě [archdiocese|E], sídle jejího [archbishop|E].\n\nVybudování první katedrály je monumentálním činem zbožnosti: její zakladatel získá trvalou [piety|E], [legitimacy|E] a [spiritual_fulfillment|E], další slot pro [personal_tenet|E] a trvalý bonus k [opinion|E] postav stejné [faith|E]. Po vybudování přitahuje křesťanské poutníky z celého [christendom|E], rozšiřuje [cathedral_complex|E] držitele a později ji lze rozšířit na [GetBuilding('great_project_cathedral_02').GetName|V] nebo [GetBuilding('great_project_cathedral_03').GetName|V]." # todo: NEW TRANSLATION
 game_concept_monastic_holy_order: "Mnišský řád" # todo: NEW TRANSLATION
 game_concept_monastic_holy_orders: "Mnišské řády" # todo: NEW TRANSLATION
 game_concept_monastic_holy_order_possessive: "Mnišského řádu" # todo: NEW TRANSLATION
 game_concept_monastic_holy_orders_possessive: "Mnišských řádů" # todo: NEW TRANSLATION
 game_concept_monastic: "Mnišský" # todo: NEW TRANSLATION
 game_concept_monastic_holy_order_i: "@government_type_monastic_holy_order!" # todo: NEW TRANSLATION
 game_concept_monastic_holy_order_desc: "Mnišský řád je druh [holy_order|E] zasvěcený modlitbě, vzdělávání a šíření jediného [core_tenet|E]. Náleží k [rite|E] svého zakladatele a hájí jeden z [core_tenets|E] daného [rite_possessive|E], jehož praxi šíří mezi věřícími.\n\nMnišský řád vede [archabbot|E] a jeho chod zajišťují [temple_holdings|E] a [gold|E], které mu poskytují jeho [monastic_order_patrons|E]. Řád jim na oplátku nabízí [spiritual_fulfillment|E] a [piety|E].\n\nKaždý [ruler|E], jehož [faith|E] dovoluje mnišství, může mnišský řád založit pomocí [decision|E] #high Založit mnišský řád#!." # todo: NEW TRANSLATION
 game_concept_monastic_order_patron: "Mecenáš mnišského řádu" # todo: NEW TRANSLATION
 game_concept_monastic_order_patrons: "Mecenáši mnišských řádů" # todo: NEW TRANSLATION
 game_concept_monastic_order_patronize: "Podporovat" # todo: NEW TRANSLATION
 game_concept_monastic_order_patronized: "Podporovaný" # todo: NEW TRANSLATION
 game_concept_monastic_order_patronage: "Mecenášství" # todo: NEW TRANSLATION
 game_concept_monastic_order_patron_desc: "Patronem řeholního řádu je [ecclesiastical|E] nebo světský [ruler|E] s [title_tier|E] [duchy|E] či vyšším, který podporuje [monastic_holy_order|E]. Nejčastěji jde o vládce, jenž řád založil. Patron řádu poskytuje světské bohatství, pronajímá mu [temple_holdings|E] a věnuje [gold|E] do jeho pokladnice.\n\nZa tuto štědrost získává [piety|E] a [spiritual_fulfillment|E]. Může také převzít kontrolu nad vůdcem řádu a přimět ho, aby jako [puppet|E] vykonával [clerical|E] interakce." # todo: NEW TRANSLATION
 game_concept_mendicant: "Žebravý" # todo: NEW TRANSLATION
 game_concept_rite: "Ritus" # todo: NEW TRANSLATION
 game_concept_rite_possessive: "Ritu" # todo: NEW TRANSLATION
 game_concept_rites_possessive: "Ritů" # todo: NEW TRANSLATION
 game_concept_rite_desc: "Ritus je odnož [faith|E]: místní varianta náboženských praktik, kterou vede [head_of_rite|E] a následují ji vlastní [counties|E] a [characters|E]. Každá víra má jeden [mainline_rite|E] a může se rozrůst o několik dalších.\n\nRitus se vymezuje podle [core_tenets|E] a [doctrines|E], které zastává. O tom, zda je zásada [permitted_tenet_status|E], nebo [prohibited_tenet_status|E], rozhoduje [faith|E] prostřednictvím svého [mainline_rite|E]. Čím více se volby [rite_possessive|E] od těchto rozhodnutí odchylují, tím vyšší je jeho [rite_divergence|E]: odlišné ritusy oslabují [fervor|E] dané víry ([faithpossessive|E]), začínají být považovány za [heresy|E] a při [divergence|E] na úrovni #V 100#! se odtrhnou a stanou se samostatnou [faith|E].\n\nNové ritusy mohou zakládat zbožní lidé, [rulers|E] lze přesvědčit, aby přešli od jednoho ritu k jinému, a upravovat je může pouze [head_of_rite|E]." # todo: NEW TRANSLATION
 game_concept_rites: "Rity"
 game_concept_archabbot: "Opat"
 game_concept_archabbot_desc: "$game_concept_archabbot$ je [ruler|E] [monastic_holy_order|E] a [head_of_rite|E] [rite|E], který jeho řád zastává. Vede členy ve studiu, rozjímání a šíření jeho [core_tenets|E].\n\nŘád může podporovat [monastic_order_patron|E], jehož [monastic_order_patronage|E] mu zajišťuje bohatství a vliv.\n\nPo smrti $game_concept_archabbot$ přecházejí jeho [titles|E] na nástupce, jímž je obvykle jeho [courtier|E] s nejvyšší hodnotou [learning|E]." # todo: NEW TRANSLATION
 game_concept_archbishop: "Arcibiskup" # todo: NEW TRANSLATION
 game_concept_archbishops: "Arcibiskupové" # todo: NEW TRANSLATION
 game_concept_archbishop_possessive: "Arcibiskupa" # todo: NEW TRANSLATION
 game_concept_archbishops_possessive: "Arcibiskupů" # todo: NEW TRANSLATION
 game_concept_archbishop_desc: "Arcibiskup je křesťanský držitel [archdiocese|E], [clerical_title|E] na úrovni vévodství, jehož [clerical_region|E] může zasahovat do několika [realms|E].\n\nJako [religious_superior|E] [bishops|E] a nižšího [clergy|E] v dané oblasti stojí arcibiskup výše než běžný [bishop|E] a sám se zodpovídá [head_of_faith|E]." # todo: NEW TRANSLATION
 game_concept_bishop: "Biskup" # todo: NEW TRANSLATION
 game_concept_bishops: "Biskupové" # todo: NEW TRANSLATION
 game_concept_bishop_possessive: "Biskupa" # todo: NEW TRANSLATION
 game_concept_bishops_possessive: "Biskupů" # todo: NEW TRANSLATION
 game_concept_bishop_desc: "$game_concept_bishop$ náleží ke [clergy|E] křesťanské [faith|E] a drží či pronajímá [temple_holdings|E].\n\nBiskup sídlí v [archdiocese|E] a z pozice [religious_superior|E] se zodpovídá tamnímu [archbishop|E]. Biskup bez pozemků s [leased|E] tituly slouží světskému [liege|E]; biskup s [landed|E] [titles|E], které nejsou pronajaté, může vládnout jako [ecclesiastical|E] [ruler|E]." # todo: NEW TRANSLATION
 game_concept_rite_divergence: "Odlišnost" # todo: NEW TRANSLATION
 game_concept_rite_divergent: "Odlišný" # todo: NEW TRANSLATION
 game_concept_divergence: "Odlišnost" # todo: NEW TRANSLATION
 game_concept_divergence_desc: "$game_concept_rite_divergence_desc$" # todo: NEW TRANSLATION
 game_concept_divergence_i: "@divergence_icon!" # todo: NEW TRANSLATION
 game_concept_rite_divergence_i: "@divergence_icon!" # todo: NEW TRANSLATION
 game_concept_rite_divergence_desc: "Odlišnost vyjadřuje, nakolik se [core_tenets|E] a [doctrines|E] [rite_possessive|E] odklonily od původní [faith|E]. Ritus, který přijme [prohibited_tenet_status|E] zásady jako [core_tenet_status|E], je odlišnější.\n\nVysoká odlišnost oslabuje [fervor|E] původní víry, a proto dochází k častějšímu šíření [heresy|E]. Ritus, který dosáhne odlišnosti #V 100#!, bude automaticky prohlášen za herezi a stane se novou [faith|E]." # todo: NEW TRANSLATION
 game_concept_spiritual_fulfillment: "Duchovní naplnění" # todo: NEW TRANSLATION
 game_concept_spiritual_fulfillment_desc: "$game_concept_spiritual_fulfillment$ vyjadřuje, nakolik se [character|E] cítí ve spojení se svou [faith|E] v míru.\n\nZákladní hodnota se vypočítává podle [traits|E], které postava má, a podle toho, zda je považována za [sinful|E], či [virtuous|E].\n\n$game_concept_spiritual_fulfillment$ lze získávat či ztrácet jednáním, které [faith|E] považuje za vhodné. Přijetím [personal_tenets|E] lze zmírnit dopad škodlivých vlastností." # todo: NEW TRANSLATION
 game_concept_fulfillment: "Naplnění" # todo: NEW TRANSLATION
 game_concept_spiritual_fulfillment_i: "@spiritual_fulfillment_icon!" # todo: NEW TRANSLATION
 game_concept_spiritual_fulfillment_level: "Úroveň duchovního naplnění" # todo: NEW TRANSLATION
 game_concept_spiritual_fulfillment_levels: "Úrovně duchovního naplnění" # todo: NEW TRANSLATION
 game_concept_spiritual_fulfillment_level_desc: "[spiritual_fulfillment|E] [character_possessive|E] se podle prahových hodnot dělí na $game_concept_spiritual_fulfillment_levels$, z nichž každá má vlastní účinky.\n\nNízké úrovně ztěžují život a zlevňují hříšné skutky. Vysoké úrovně usnadňují zbožný život a zpřístupňují nové náboženské možnosti." # todo: NEW TRANSLATION
 game_concept_personal_tenet: "Osobní zásada" # todo: NEW TRANSLATION
 game_concept_personal_tenet_desc: "$game_concept_personal_tenet$ je [core_tenet|E], který [ruler|E] přijme jako základní součást své spirituality.\n\nPřijetí $game_concept_personal_tenet$, který je [core_tenet_status|E] nebo jej [faith|E] označila za [permitted_tenet_status|E], přináší [spiritual_fulfillment|E]. Přijetí zásady se statusem [prohibited_tenet_status|E] naopak povede k získání [secret|E]. $game_concept_personal_tenets$ také poskytují dodatečné účinky a odemykají zvláštní mechaniky.\n\nPočet $game_concept_personal_tenets$, které může postava přijmout, ovlivňuje její [piety_level|E] a [trait|E] [GetTrait('theologian').GetName( GetNullCharacter )]." # todo: NEW TRANSLATION
 game_concept_personal_tenets: "Osobní zásady" # todo: NEW TRANSLATION
 game_concept_personal_tenets_desc: "$game_concept_personal_tenet_desc$" # todo: NEW TRANSLATION
 game_concept_cardinal: "Kardinál" # todo: NEW TRANSLATION
 game_concept_cardinals: "Kardinálové" # todo: NEW TRANSLATION
 game_concept_cardinal_possessive: "Kardinála" # todo: NEW TRANSLATION
 game_concept_cardinals_possessive: "Kardinálů" # todo: NEW TRANSLATION
 game_concept_cardinalate: "Kardinálský titul" # todo: NEW TRANSLATION
 game_concept_cardinalates: "Kardinálské tituly" # todo: NEW TRANSLATION
 game_concept_cardinal_desc: "Člen [clergy|e] vybraný papežem, aby pomáhal prosazovat vůli [the_christian_church|e]. Všichni členové [college_of_cardinals|E] jsou kandidáty i voliteli papeže a mají hodnotu [papabile_score|E]." # todo: NEW TRANSLATION
 game_concept_college_of_cardinals: "Kardinálské kolegium" # todo: NEW TRANSLATION
 game_concept_college_of_cardinals_desc: "$game_concept_college_of_cardinals$ je sbor [cardinals|E], kteří radí papeži a volí dalšího [head_of_faith|E] [the_christian_church|E].\n\nKaždý [cardinal|E] je kandidátem i volitelem papeže." # todo: NEW TRANSLATION
 game_concept_papabile_score: "Skóre papežské kandidatury"
 game_concept_papabile_scores: "Skóre papežské kandidatury"
 game_concept_papabile_score_desc: "Všichni členové [college_of_cardinals|E] mají hodnotu $game_concept_papabile_score$, která zohledňuje jejich [traits|E], [piety_level|E], [rite|E] a [opinion|E] ostatních kardinálů.\n\n[cardinals|E] s nejvyšším $game_concept_papabile_score$ pravděpodobně získají při papežské volbě více hlasů.\n\n$game_concept_papabile_score$ lze zvýšit pomocí [character_interaction|E] #high $increase_papabile_score_interaction$#! a [decision|E] [GetDecisionWithKey('pam_promulgate_word_of_pious_deeds_decision').GetName]." # todo: NEW TRANSLATION
 game_concept_mainline_rite: "Hlavní ritus" # todo: NEW TRANSLATION
 game_concept_mainline_rite_desc: "Hlavní [rite|E] představuje nejrozšířenější soubor přesvědčení dané [faith|E]. Jiný než hlavní $game_concept_rite$ se považuje za [rite_divergent|E] od tohoto $game_concept_rite$.\n\nTo, který $game_concept_rite$ je hlavní, závisí na tom, zda má $game_concept_faith$ [head_of_faith|E].\n\nPokud má $game_concept_faith$ svého $game_concept_head_of_faith$, je hlavním $game_concept_rite$ ten, který tento vůdce následuje. To znamená, že se může změnit, pokud jej vystřídá nástupce jiného $game_concept_rite$, včetně případného [challenger_hof|E].\n\nPokud $game_concept_faith$ nemá $game_concept_head_of_faith$, každý $game_concept_rite$, který shromáždí více následovníků v [counties|E] než hlavní ritus, jej nahradí, pokud má alespoň tolik [holy_sites|E] jako $game_concept_rite$, který se snaží nahradit." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT navyše [faith]
 game_concept_mainline_rites: "Hlavní rity"
 game_concept_mainline_rite_short: "Hlavní" # todo: NEW TRANSLATION
 game_concept_tenet_status: "Postavení zásady"
 game_concept_tenet_status_desc: "$game_concept_tenet_status$ vyjadřuje postoj [rite_possessive|E] k [core_tenet|E] nebo [doctrine|E]. Existuje pět možných postojů:\n\n$EFFECT_LIST_BULLET$[unknown_tenet_status|E] — $game_concept_rite$ o této $game_concept_core_tenet$ nebo $game_concept_doctrine$ nikdy neslyšel.\n\n$EFFECT_LIST_BULLET$[known_tenet_status|E] — $game_concept_rite$ o ní ví a její praxi dosud neposoudil.\n\n$EFFECT_LIST_BULLET$[permitted_tenet_status|E] — $game_concept_rite$ tuto praxi schvaluje.\n\n$EFFECT_LIST_BULLET$[prohibited_tenet_status|E] — $game_concept_rite$ tuto praxi zakazuje.\n\n$EFFECT_LIST_BULLET$[core_tenet_status|E] — $game_concept_rite$ tuto $game_concept_core_tenet$ nejen povoluje, ale také aktivně prosazuje.\n\nPostoj ritu určuje, zda lze při vytváření či odštěpování $game_concept_rite$ zvolit určitou $game_concept_core_tenet$ nebo $game_concept_doctrine$, a které praktiky věřícím přinášejí duchovní postihy ([followers|E]).\n\nStatus zásady se liší od [tenet_knowledge|E] [character_possessive|E], které vyjadřuje osobní povědomí, nikoli obecný postoj $game_concept_rite$." # todo: NEW TRANSLATION
 game_concept_doctrine_status_desc: "$game_concept_tenet_status_desc$" # todo: NEW TRANSLATION
 game_concept_unknown_tenet_status: "Neznámá" # todo: NEW TRANSLATION
 game_concept_unknown_tenet_status_desc: "Status zásady [tenet_status|E] $game_concept_unknown_tenet_status$ znamená, že [rite|E] o této [core_tenet|E] nebo [doctrine|E] vůbec neví. Věřící ([followers|E]) daného $game_concept_rite$ o ní nemají automaticky povědomí a nemohou si ji zvolit při vytváření nového $game_concept_rite$ ani jako [personal_tenet|E]." # todo: NEW TRANSLATION
 game_concept_known_tenet_status: "Známá" # todo: NEW TRANSLATION
 game_concept_known_tenet_status_desc: "Status zásady [tenet_status|E] $game_concept_known_tenet_status$ znamená, že [rite|E] o této [core_tenet|E] nebo [doctrine|E] ví, ale její praxi nepodporuje ani nepovoluje. Lze ji zvážit při vytváření či odštěpování $game_concept_rite$ a její [tenet_status|E] lze zvýšit." # todo: NEW TRANSLATION
 game_concept_permitted_tenet_status: "Povolená" # todo: NEW TRANSLATION
 game_concept_permit_tenet_status: "Povolit" # todo: NEW TRANSLATION
 game_concept_permitted_tenet_status_desc: "Status zásady [tenet_status|E] $game_concept_permitted_tenet_status$ znamená, že [rite|E] tuto [core_tenet|E] nebo [doctrine|E] schvaluje, aniž by ji aktivně prosazoval. [character|E] daného $game_concept_rite$ může přijmout $game_concept_core_tenet$ jako [personal_tenet|E] bez duchovního postihu." # todo: NEW TRANSLATION
 game_concept_prohibited_tenet_status: "Zakázaná" # todo: NEW TRANSLATION
 game_concept_prohibit_tenet_status: "Zakázat" # todo: NEW TRANSLATION
 game_concept_prohibited_tenet_status_desc: "Status zásady [tenet_status|E] $game_concept_prohibited_tenet_status$ znamená, že [rite|E] tuto [core_tenet|E] nebo [doctrine|E] výslovně zakazuje. [character|E] daného $game_concept_rite$, který přijme $game_concept_core_tenet$ jako [personal_tenet|E], si ji ponechá jako [secret|E]. Pokud $game_concept_rite$ přijme [core_tenets|E] se statusem [prohibited_tenet_status|E] jako [core_tenet_status|E], stane se mnohem více [rite_divergent|E] od své [faith|E]." # todo: NEW TRANSLATION
 game_concept_core_tenet_status: "Základní" # todo: NEW TRANSLATION
 game_concept_core_tenet_status_desc: "Status zásady [tenet_status|E] $game_concept_core_tenet_status$ znamená, že [rite|E] tuto [core_tenet|E] nebo [doctrine|E] aktivně prosazuje jako jednu ze svých určujících praktik. Její účinky se vztahují na všechny věřící ([followers|E]) daného $game_concept_rite$." # todo: NEW TRANSLATION
 game_concept_tenet_knowledge: "Náboženské znalosti" # todo: NEW TRANSLATION
 game_concept_doctrine_knowledge: "Znalost doktrín" # todo: NEW TRANSLATION
 game_concept_rite_knowledge: "Znalost ritu" # todo: NEW TRANSLATION
 game_concept_agnostic_knowledge: "Znalosti" # todo: NEW TRANSLATION
 game_concept_tenet_knowledge_desc: "Postavy neznají všechny podrobnosti každé náboženské praktiky.\n\nZnámé zásady a nauky lze použít při vytváření [rite_divergent|E] $game_concept_rite$ a lze je přijmout jako [personal_tenets|E]. Znalost všech $game_concept_core_tenets$ a $game_concept_doctrines$ daného $game_concept_rite$ usnadňuje konverzi.\n\nVšechny [core_tenets|E] a [doctrines|E] vaší [faith|E] jsou vám známé. Nové znalosti lze získat od blízkých osob, jako jsou [spouses|E] nebo [friends|E], při [traveling|E], [activities|E] nebo prostřednictvím [scheme|E] Studium ritu." # todo: NEW TRANSLATION
 game_concept_doctrine_knowledge_desc: "$game_concept_tenet_knowledge_desc$" # todo: NEW TRANSLATION
 game_concept_rite_knowledge_desc: "$game_concept_tenet_knowledge_desc$" # todo: NEW TRANSLATION
 game_concept_enshrined: "Uložená ve svatyni" # todo: NEW TRANSLATION
 game_concept_enshrine: "Uložit ve svatyni" # todo: NEW TRANSLATION
 game_concept_enshrined_desc: "Uložení [holy_relic|E] ve svatyni na [holy_site|E] aktivuje bonusy posvátného místa a zvyšuje jejich účinnost. Jejich síla závisí na celkovém počtu úrovní [rarity|E] všech zde uložených artefaktů.\n\nUložený artefakt již nevlastní žádná postava, ale může s ním nakládat [holder|E], [top_liege|E] nebo držitel [clerical_region|E], v níž se posvátné místo nachází. Artefakt se již nebude opotřebovávat. Ve svatyni lze uložit pouze svaté relikvie vlastní [faith|E]; relikvie jiných věr zde uložené neposkytují žádné výhody.\n\nUložení či odebrání artefaktu ze svatyně může přinést odměny nebo náklady." # todo: NEW TRANSLATION
 game_concept_holy_relic: "Svatá relikvie" # todo: NEW TRANSLATION
 game_concept_holy_relics: "Svaté relikvie" # todo: NEW TRANSLATION
 game_concept_holy_relic_desc: "$game_concept_holy_relic$ je [artifact|E] náboženského významu pro [faith|E]. $game_concept_holy_relic$ lze [enshrined|E] na [holy_site|E] dané víry, čímž získá výhody.\n\nNěkteré artefakty jsou pro určitou víru svaté od přírody, ale artefakty lze také [sanctified|E] a učinit z nich svaté relikvie." # todo: NEW TRANSLATION
 game_concept_sanctified: "Posvěcený" # todo: NEW TRANSLATION
 game_concept_sanctify: "Posvětit" # todo: NEW TRANSLATION
 game_concept_sanctifying: "Posvěcování" # todo: NEW TRANSLATION
 game_concept_sanctified_desc: "Posvěcením [artifact|E] se z něj stane [holy_relic|E] pro [faith|E]. Artefakt lze posvětit pro více vír." # todo: NEW TRANSLATION
 game_concept_ecclesiastical_domicile: "$game_concept_ecclesiastical_estate$" # todo: NEW TRANSLATION
 game_concept_ecclesiastical_domiciles: "$game_concept_ecclesiastical_estates$" # todo: NEW TRANSLATION
 game_concept_ecclesiastical_domicile_desc: "$game_concept_ecclesiastical_estate_desc$" # todo: NEW TRANSLATION
 game_concept_ecclesiastical_domicile_building: "$game_concept_ecclesiastical_estate_building$" # todo: NEW TRANSLATION
 game_concept_ecclesiastical_domicile_buildings: "$game_concept_ecclesiastical_estate_buildings$" # todo: NEW TRANSLATION
 game_concept_ecclesiastical_domicile_building_desc: "$game_concept_ecclesiastical_estate_building_desc$" # todo: NEW TRANSLATION
 game_concept_ecclesiastical_estate: "Církevní statek" # todo: NEW TRANSLATION
 game_concept_ecclesiastical_estates: "Církevní statky" # todo: NEW TRANSLATION
 game_concept_ecclesiastical_estate_desc: "$game_concept_ecclesiastical_estate$ neboli $game_concept_cathedral_complex$ je typem [domicile|E] připojeným ke [clerical_title|E], který představuje soukromé pozemky [archbishop|E] a jeho sídla. Nižší [clergy|E] v rámci [GetGovernment('ecclesiastical_government').GetName] musí nejprve dosáhnout takového [title|E], aby jim byl statek přidělen.\n\nZde lze stavět [ecclesiastical_estate_buildings|E], které zvýší držitelovo bohatství, [piety|E] a [spiritual_fulfillment|E]. $game_concept_ecclesiastical_estate$ nemění polohu a zdědí jej další [holder|E] titulu." # todo: NEW TRANSLATION
 game_concept_ecclesiastical_estate_building: "Budova církevního statku" # todo: NEW TRANSLATION
 game_concept_ecclesiastical_estate_buildings: "Budovy církevního statku" # todo: NEW TRANSLATION
 game_concept_ecclesiastical_estate_building_desc: "$game_concept_ecclesiastical_estate_buildings$ jsou jedinečná a trvalá vylepšení [ecclesiastical_estate|E].\n\nK dispozici je široký výběr staveb, které může držitel postavit, aby získal osobní příjem, [piety|E], [spiritual_fulfillment|E] a přístup k řadě [decisions|E], [interactions|E] a dalším možnostem." # todo: NEW TRANSLATION
 game_concept_cathedral_complex: "Katedrální komplex" # todo: NEW TRANSLATION
 game_concept_cathedral_complexes: "Katedrální komplexy" # todo: NEW TRANSLATION
 game_concept_cathedral_complex_desc: "$game_concept_ecclesiastical_estate_desc$" # todo: NEW TRANSLATION
 game_concept_cathedral_complex_building: "Budova katedrálního komplexu"
 game_concept_cathedral_complex_buildings: "Budovy katedrálního komplexu"
 game_concept_cathedral_complex_building_desc: "$game_concept_ecclesiastical_estate_building_desc$" # todo: NEW TRANSLATION
 game_concept_canonized: "Kanonizovaný" # todo: NEW TRANSLATION
 game_concept_canonized_desc: "[character|E], který byl po smrti prohlášen za svatého nebo za obdobu světce v jiné víře, například valího či uctívaného předka, a získal [trait|E] [GetTrait('saint').GetName( GetNullCharacter )].\n\nCtnostný život může vyústit v $game_concept_canonization$: o kanonizaci se žádá prostřednictvím [decision|E], může vyžadovat požehnání [head_of_faith|E] a završuje ji vysvěcení světcova pohřebiště. Jejich místo posledního odpočinku pak přitahuje zbožné poutníky a jejich ostatky mohou vydat [holy_relics|E]." # todo: NEW TRANSLATION
 game_concept_canonization: "Kanonizace" # todo: NEW TRANSLATION
 game_concept_canonization_desc: "$game_concept_canonized_desc$" # todo: NEW TRANSLATION
 game_concept_sainthood: "Svatost" # todo: NEW TRANSLATION
 game_concept_sainthood_desc: "$game_concept_canonized_desc$" # todo: NEW TRANSLATION
 game_concept_strengthen_claim_interaction: "$strengthen_claim_interaction$" # todo: NEW TRANSLATION
 game_concept_strengthen_claim_interaction_desc: "[interaction|E], která mění [unpressed_claim|E] na [pressed_claim|E] díky podpoře příslušného [ecclesiastical|E] nebo [theocratic|E] [ruler|E]." # todo: NEW TRANSLATION
 game_concept_ecclesiastic_grant_claim_interaction: "$ecclesiastic_grant_claim_interaction$" # todo: NEW TRANSLATION
 game_concept_ecclesiastic_grant_claim_interaction_desc: "[interaction|E], která poskytuje [claim|E] na [title|E] náležející jinému [ruler|E]. Vyžaduje souhlas příslušné [ecclesiastical|E] nebo [theocratic|E] [character|E]." # todo: NEW TRANSLATION
 game_concept_ecclesiastic_transfer_land_interaction: "$ecclesiastic_transfer_land_interaction$" # todo: NEW TRANSLATION
 game_concept_ecclesiastic_transfer_land_interaction_desc: "[interaction|E], která umožňuje pokojné převedení [title|E] nebo [vassal|E] mezi dvěma [rulers|E] a závisí na souhlasu cílového [ruler|E] a dalšího prostředníka.\n\nOdmítnutí obvykle příjemce stojí [piety|E] a [legitimacy|E] a také další náklad, který aktér zvolí jako prostředek k vynucení souhlasu.\n\nProstředník, tedy příslušný [ecclesiastical|E] nebo [theocratic|E] vládce, může nejen zakázat, aby k této interakci vůbec došlo, ale díky [law|E] [GetLaw('church_authority_3').GetName] může její přijetí také vynutit." # todo: NEW TRANSLATION
 game_concept_challenger_hof: "Konkurenční hlava víry"
 game_concept_antipope: "Vzdoropapež"
 game_concept_challenger_hof_desc: "$game_concept_challenger_hof$ je soupeřící [head_of_faith|E], ustanovená proti $game_concept_head_of_faith$ hlavního [mainline_rite|E].\n\n[ruler|E] může podpořit člena svého [clergy|E] jako $game_concept_challenger_hof$. [clergy|E] [ruler|E] nebo vládce z [faith|E] s časnou hlavou víry se mohou za protivníka prohlásit sami.\n\nPodporovaný $game_concept_challenger_hof$ přijme [rite|E] svého podporovatele, stane se jeho [external_clerical_puppet|E] a dluží mu [weak_hook|E].\n\n$game_concept_mainline_rite$ $game_concept_head_of_faith$ nemůže [excommunicate|E] nikoho, kdo následuje $game_concept_challenger_hof$: jeho podporovatele ani jejich [vassals|E].\n\nKaždý, kdo následuje $game_concept_challenger_hof$, se obrací se svými církevními žádostmi na něj místo na $game_concept_mainline_rite$ $game_concept_head_of_faith$. Patří mezi ně tyto [interactions|E]:\n$EFFECT_LIST_BULLET$[petition_antipope_indulgences_interaction|E]\n$EFFECT_LIST_BULLET$[petition_antipope_gold_interaction|E]\n\n$game_concept_challenger_hof$ nebo jeho podporovatel může proti právoplatnému $game_concept_head_of_faith$ použít [casus_belli|E] [pam_challenge_hof_cb|E].\n\nSoupeřící [kings|E] stejné [faith|E] nebo vládci vyššího postavení mohou proti podporovateli použít [pam_antiking_cb|E] a sesadit tak soupeřícího uchazeče." # todo: NEW TRANSLATION
 game_concept_antipope_desc: "$game_concept_challenger_hof_desc$" # todo: NEW TRANSLATION
 game_concept_pam_challenge_hof_cb: "Prosadit konkurenční hlavu víry" # todo: NEW TRANSLATION
 game_concept_pam_challenge_hof_cb_desc: "[casus_belli|E], který [challenger_hof|E] nebo jeho podporovatel použije proti právoplatné [head_of_faith|E] své [faith|E]. Vítězství dosadí $game_concept_challenger_hof$ do role $game_concept_head_of_faith$ a učiní z jeho [rite|E] hlavní [mainline_rite|E]. Podporovatel, který válku vyhraje a převyšuje svého $game_concept_challenger_hof$ hodností, jej také získá jako [vassal|E]." # todo: NEW TRANSLATION
 game_concept_pam_antiking_cb: "Sesadit vzdoropapeže"
 game_concept_pam_antiking_cb_desc: "[casus_belli|E] dostupný [christian|E] [kings|E] a vládcům vyššího postavení, kteří nejsou podporovateli ani [challenger_hof|E]. Používá se proti [independent|E] podporovateli stejné [faith|E] s cílem sesadit jeho $game_concept_challenger_hof$ a získat vděčnost právoplatné [head_of_faith|E]." # todo: NEW TRANSLATION
 game_concept_petition_antipope_indulgences_interaction: "Požádat vzdoropapeže o odpustek"
 game_concept_petition_antipope_indulgences_interaction_desc: "[interaction|E] dostupná každému, kdo následuje [challenger_hof|E]. Zaplaťte svému $game_concept_antipope$ [gold|E] za odpuštění a [piety|E] a obejděte [head_of_faith|E] hlavního [mainline_rite|E]. Jeho podporovatel je přijat automaticky." # todo: NEW TRANSLATION
 game_concept_petition_antipope_gold_interaction: "Požádat vzdoropapeže o zlato"
 game_concept_petition_antipope_gold_interaction_desc: "[interaction|E] dostupná každému, kdo následuje [challenger_hof|E]. Požádejte svého $game_concept_antipope$ o [gold|E]. Jeho podporovatel je přijat automaticky." # todo: NEW TRANSLATION
 game_concept_pam_shape_the_christian_church_decision: "$pam_shape_the_christian_church_decision$" # todo: NEW TRANSLATION
 game_concept_pam_shape_the_christian_church_decision_desc: "[decision|E] dostupné prelátům a mocným vládcům, kteří mohou nasměrovat [the_christian_church|E] k vybrané kapitole." # todo: NEW TRANSLATION
 game_concept_tenet_popularity: "Rozšířenost zásady"
 game_concept_tenet_popularity_desc: "Jak se [personal_tenets|E] šíří v rámci [faith|E], jejich praktikování se stává běžnějším. $game_concept_tenet_popularity$ sleduje rozšíření [core_tenet|E] a ovlivňuje pravděpodobnost, že bude vybrána jako téma rozpravy na [ecumenical_council|E] nebo jako cíl [papal_bull|E].\n\nČím vyšší je $game_concept_tenet_popularity$, tím více se [clergy|E] při debatě na [ecumenical_council|E] přikloní k dané zásadě. Jakmile zásada dosáhne hodnoty #high [EmptyScope.ScriptValue('pam_tenet_popularity_ai_override_threshold')|0]#! $game_concept_tenet_popularity$, [head_of_faith|E] ji s největší pravděpodobností prohlásí za [permitted_tenet_status|E], bez ohledu na vlastní přesvědčení." # todo: NEW TRANSLATION
 game_concept_ecumenical_council_innovator: "Zastánce změn"
 game_concept_ec_innovator: "$game_concept_ecumenical_council_innovator$"
 game_concept_ecumenical_council_innovators: "Zastánci změn"
 game_concept_ec_innovators: "$game_concept_ecumenical_council_innovators$"
 game_concept_ecumenical_council_innovator_desc: "Zastánci změn jsou [activity_guests_short|E] na [activity|E] [ecumenical_council|E], kteří při hlasování o návrzích na změnu statusu [core_tenet|E] nebo [doctrine|E] podporují [activity_host_short|E].\n\nJsou přímým protějškem [ec_conservatives|E], tedy hostů, kteří hlasují proti jakýmkoli změnám a chtějí zachovat dosavadní stav.$game_concept_ecumenical_council_groups_help$" # todo: NEW TRANSLATION
 game_concept_ecumenical_council_groups_help: "\n\n#help Hlasovat mohou tyto [Concept('characters','postavy')|E]: [Concept('clergy','členové duchovenstva')|E], [Concept('rulers','vládci')|E] s [Concept('clerical_puppet','loutkovým zemským knězem')|E] a [Concept('activity_host','pořadatel aktivity')|E]#!" # todo: NEW TRANSLATION
 game_concept_ecumenical_council_conservative: "Konzervativec" # todo: NEW TRANSLATION
 game_concept_ec_conservative: "$game_concept_ecumenical_council_conservative$" # todo: NEW TRANSLATION
 game_concept_ecumenical_council_conservatives: "Konzervativci" # todo: NEW TRANSLATION
 game_concept_ec_conservatives: "$game_concept_ecumenical_council_conservatives$" # todo: NEW TRANSLATION
 game_concept_ecumenical_council_conservative_desc: "Konzervativci jsou [activity_guests_short|E] na [activity|E] [ecumenical_council|E], kteří při hlasování o návrzích na změnu statusu [core_tenet|E] nebo [doctrine|E] hlasují proti [activity_host_short|E].\n\nJsou přímým protějškem [ec_innovators|E], tedy hostů, kteří se snaží změny prosadit.$game_concept_ecumenical_council_groups_help$" # todo: NEW TRANSLATION
 game_concept_request_ecclesiastical_title_expansion_interaction: "$request_ecclesiastical_title_expansion_interaction$" # todo: NEW TRANSLATION
 game_concept_request_ecclesiastical_title_expansion_interaction_desc: "[interaction|E], kterou [ecclesiastical|E] [rulers|E] rozšiřují svou [clerical_region|E] do [de_jure|E] [counties|E] sousedního [duchy|E].\n\nTo je možné pouze se souhlasem [head_of_faith|E]." # todo: NEW TRANSLATION
 game_concept_ecclesiastic_incite_holy_war_interaction: "$ecclesiastic_incite_holy_war_interaction$" # todo: NEW TRANSLATION
 game_concept_ecclesiastic_incite_holy_war_interaction_desc: "[interaction|E], díky níž mohou [ecclesiastical|E] [rulers|E] přimět světské vládce stejné [faith|E], aby vyhlásili [holy_war|E] vládcům nepřátelské víry." # todo: NEW TRANSLATION
 game_concept_ecclesiastic_incite_claim_war_interaction: "$ecclesiastic_incite_claim_war_interaction$" # todo: NEW TRANSLATION
 game_concept_ecclesiastic_incite_claim_war_interaction_desc: "[interaction|E], díky níž mohou [ecclesiastical|E] [rulers|E] přimět světské vládce stejné [faith|E], aby vyhlásili [war|E] a prosadili [claim|E] na světského [ruler|E]." # todo: NEW TRANSLATION
 game_concept_treasury_cardinal_budget: "Kardinálský rozpočet" # todo: NEW TRANSLATION
 game_concept_treasury_cardinal_budget_short: "Kardinál" # todo: NEW TRANSLATION
 game_concept_treasury_cardinal_budget_benefices: "Kardinálské beneficie" # todo: NEW TRANSLATION
 game_concept_treasury_cardinal_budget_desc: "Prostředky přidělené [cardinals|E] z ústřední církevní pokladnice, které představují přímé i nepřímé [Glossary( 'benefices', 'CARDINAL_BENEFICES_GLOSS' )] přidělené kardinálům." # todo: NEW TRANSLATION
 CARDINAL_BENEFICES_GLOSS: "Beneficie byly místní či vzdálené statky, úřady nebo podíly na papežských příjmech, které mohl člen duchovenstva získat #i in commendam#! (do správy). Přinášely příjem, obvykle bez přímé správní odpovědnosti." # todo: NEW TRANSLATION
 game_concept_spiritual_counsel_interaction: "$spiritual_counsel_interaction$" # todo: NEW TRANSLATION
 game_concept_spiritual_counsel_interaction_desc: "[interaction|E], při níž církevní autorita vymění útěchu v podobě [spiritual_fulfillment|E] za [hook|E]" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [clerical|E]
 game_concept_request_clerical_chastity_interaction: "$request_clerical_chastity_interaction$" # todo: NEW TRANSLATION
 game_concept_request_clerical_chastity_interaction_desc: "[interaction|E], která požaduje, aby jiná [character|E] složila slib čistoty a přijala dlouhodobý postih k [fertility|E]." # todo: NEW TRANSLATION
 game_concept_military_holy_order: "Vojenský řád" # todo: NEW TRANSLATION
 game_concept_military_holy_orders: "Vojenské řády" # todo: NEW TRANSLATION
 game_concept_military_holy_order_i: "@government_type_holy_order!" # todo: NEW TRANSLATION
 game_concept_military_holy_order_possessive: "Vojenského řádu" # todo: NEW TRANSLATION
 game_concept_military_holy_orders_possessive: "Vojenských řádů" # todo: NEW TRANSLATION
 game_concept_military_holy_order_desc: "$game_concept_military_holy_order$ je typem [holy_order|E], jehož členy jsou bojovníci přísahající bránit a rozšiřovat území své [faith|E].\n\nVládci stejné víry si mohou řád najmout, pokud jsou ve [war|E] s [faith_hostile|L] nebo [faith_evil|L] [faith], a to za cenu [piety|E]. Jakmile tato válka skončí, řád už za daného vládce nebojuje.\n\n$game_concept_holy_order$ může mít [military_holy_order_patron|E], který za jeho služby nemusí platit." # todo: NEW TRANSLATION
 game_concept_military_holy_order_patron: "Patron vojenského řádu" # todo: NEW TRANSLATION
 game_concept_military_holy_order_patronage: "Patronát vojenského řádu" # todo: NEW TRANSLATION
 game_concept_military_holy_order_patronize: "Podporovat" # todo: NEW TRANSLATION
 game_concept_military_holy_order_patron_desc: "$game_concept_holy_order_patron$ [military_holy_order|E] je [ruler|E] s [title_tier|E] [duke|E] nebo vyšší, který sdílí jeho [faith|E] a jehož [realm|E] zahrnuje jeho hlavní město.\n\n$game_concept_holy_order_patron$ může bezplatně povolat $game_concept_holy_order$ do boje proti náboženským nepřátelům, místo aby platil [piety|E].\n\nPatronát může přejít na [vassals|E] s [title_tier|E] [duke|E] nebo vyšší, pokud se vzdají kontroly nad hlavním městem řádu." # todo: NEW TRANSLATION
