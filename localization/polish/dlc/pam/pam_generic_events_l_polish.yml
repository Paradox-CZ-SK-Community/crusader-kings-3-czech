l_polish:
 pam_generic_events.0001.t: "Učenec víry" # todo: NEW TRANSLATION
 pam_generic_events.0001.desc: "Můj [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] se zdá být pohroužený do přednášky, když vstoupím do [ROOT.Char.GetFaith.HouseOfWorship].\n\n„Ach, [ROOT.Char.Custom('FormOfAddressForLiege')],“ [chaplain.GetSheHe] si mě konečně všimne. „Roste váš zájem o slovo [ROOT.Char.GetFaith.HighGodName]? Mohu vás naučit, jak na to.“" # todo: NEW TRANSLATION
 pam_generic_events.0001.a: "Stojí to za tu snahu." # todo: NEW TRANSLATION
 pam_generic_events.0001.b: "Vládnutí už vyžaduje veškerou mou pozornost." # todo: NEW TRANSLATION
 pam_generic_events.0002.t: "Jsem dobrý člověk?" # todo: NEW TRANSLATION
 pam_generic_events.0002.desc.intro: "Můj [ROOT.Char.Custom2( 'RelationToMeShort', doubting_child )], [doubting_child.GetFirstName], vklouzne do mé komnaty dlouho poté, co měly být svíce zhasnuty. Po [doubting_child.GetHerHis] tvářích stékají slzy.\n\n„Jsem dobrý člověk?“ zašeptá [doubting_child.GetSheHe]. „Jestli je to, čím jsem, hřích...“" # todo: NEW TRANSLATION
 pam_generic_events.0002.desc.sin: "tak #EMP odporně#! [sinful_trait.GetName( ROOT.Char )|l]..." # todo: NEW TRANSLATION
 pam_generic_events.0002.desc.sp: "jestli má má duše takovou prázdnotu..." # todo: NEW TRANSLATION
 pam_generic_events.0002.desc.outro: "jak mě [ROOT.Char.GetFaith.HighGodName] může stále chtít?“" # todo: NEW TRANSLATION
 pam_generic_events.0002.a: "Zbav se toho, za co se stydíš." # todo: NEW TRANSLATION
 pam_generic_events.0002.b: "Už teď tě mají rádi." # todo: NEW TRANSLATION
 pam_generic_events.0002.c: "Tak se pomodlíme." # todo: NEW TRANSLATION
 friend_comforted_child_doubts: "[CHARACTER.GetShortUIName|U] utěšoval [TARGET_CHARACTER.GetShortUIName], když [TARGET_CHARACTER.GetSheHe] pochyboval o [TARGET_CHARACTER.GetHerHis] vlastní dobrotě." # todo: NEW TRANSLATION
 friend_comforted_child_doubts_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] utěšoval [CHARACTER.GetShortUIName], když [CHARACTER.GetSheHe] pochyboval o [CHARACTER.GetHerHis] vlastní dobrotě." # todo: NEW TRANSLATION
 pam_generic_events.0003.t: "Kým jsi" # todo: NEW TRANSLATION
 pam_generic_events.0003.desc: "Můj [ROOT.Char.Custom2( 'RelationToMeShort', worried_spouse )], [worried_spouse.GetFirstName], čeká po setmění mezi živými ploty. [worried_spouse.GetHerHis|U] ruce se nervózně svírají v [worried_spouse.GetHerHis] klíně.\n\n„Jsi tak #EMP [sinful_trait.GetName( ROOT.Char )|l]#!,“ říká [worried_spouse.GetSheHe] tichým hlasem. „Oba nás to zahanbuje před [ROOT.Char.GetFaith.HighGodName]. Jak můžeš být ke své víře tak lhostejný? Copak nevidíš, co ti to provádí?“" # todo: NEW TRANSLATION
 pam_generic_events.0003.a: "Kvůli tobě to napravím." # todo: NEW TRANSLATION
 pam_generic_events.0003.b: "Takovým mě stvořil [ROOT.Char.GetFaith.HighGodName]." # todo: NEW TRANSLATION
 pam_generic_events.0003.c: "Děláš si přílišné starosti." # todo: NEW TRANSLATION
 lover_promised_to_change_ways: "[CHARACTER.GetShortUIName|U] slíbil [TARGET_CHARACTER.GetShortUIName], že se polepší a vydá na pouť." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [CHARACTER.GetHerHis]
 lover_promised_to_change_ways_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] slíbil [CHARACTER.GetShortUIName], že se polepší a vydá na pouť." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [TARGET_CHARACTER.GetHerHis]
 rival_embraced_sinful_ways: "[CHARACTER.GetShortUIName|U] odmítl činit pokání, když ho [TARGET_CHARACTER.GetShortUIName] prosil, aby se změnil." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [CHARACTER.GetHerHim]
 rival_embraced_sinful_ways_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] odmítl činit pokání, když ho [CHARACTER.GetShortUIName] prosil, aby se změnil." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [TARGET_CHARACTER.GetHerHim]
 pam_generic_events.0004.t: "Světlo v temnotách" # todo: NEW TRANSLATION
 pam_generic_events.0004.desc: "Svíčky skomírají v prázdném [ROOT.Char.GetFaith.HouseOfWorship] za mého [ROOT.Char.Custom2( 'RelationToMeShort', deceased )], [deceased.GetFirstName], jehož [deceased.GetDeathReasonHideKiller].\n\nMůj [ROOT.Char.Custom2( 'RelationToMeShort', comforter )], [comforter.GetFirstName], je tak blízko, že se [comforter.GetHerHis] rukáv otírá o můj. „Zármutek je cesta,“ říká [comforter.GetSheHe] tiše. „Vydej se po ní a možná tě dovede až do [ROOT.Char.GetFaith.PositiveAfterLife].“" # todo: NEW TRANSLATION
 pam_generic_events.0004.a: "To já! #EMP Já#! jsem to udělal!" # todo: NEW TRANSLATION
 pam_generic_events.0004.b: "[Glossary('$pam_john_14_2_english|q$','JOHN_14_2_GLOSS')]" # todo: NEW TRANSLATION
 pam_john_14_2_english: "#EMP V domě mého Otce je mnoho příbytků.#!" # todo: NEW TRANSLATION
 JOHN_14_2_GLOSS: "#weak Jan 14:2, NRSVUE#!" # todo: NEW TRANSLATION
 pam_generic_events.0004.c: "Tak se pomodlíme." # todo: NEW TRANSLATION
 pam_generic_events.0004.d: "Pojď. Připijeme na jejich památku." # todo: NEW TRANSLATION
 pam_generic_events.0005.t: "Věrná pěst" # todo: NEW TRANSLATION
 pam_generic_events.0005.desc: ""Jak se #EMP opovažuje#! [clerical_holder.GetSheHe]!?"\n\nMůj [ROOT.Char.Custom2( 'RelationToMeShort', loyal_vassal )], [loyal_vassal.GetTitledFirstName], vtrhne do sněmovní síně s čepelí už napůl tasenou.\n\n"Jak se [clerical_holder.GetTitledFirstName] opovažuje tě vyhnat?" [loyal_vassal.GetSheHe|U] plivne na zem. "Mám muže v [clerical_region.GetName]. Stačí říct a půjdeme [clerical_holder.GetHerHim] navštívit."" # todo: NEW TRANSLATION
 pam_generic_events.0005.a: "Dobrá, jdi." # todo: NEW TRANSLATION
 pam_generic_events.0005.a.tt: "[loyal_vassal.GetTitledFirstName] odcestuje do [clerical_holder.GetCapitalLocation.GetName]. Po [loyal_vassal.GetHerHis] návratu získáte [dread|E] a [GetVassalStance('belligerent').GetTextIcon][GetVassalStance('belligerent').GetName] [opinion|E] od [vassal|E]." # todo: NEW TRANSLATION
 pam_generic_events.0005.b: "Jsou i chytřejší způsoby." # todo: NEW TRANSLATION
 pam_generic_events.0005.b.tt: "Získáte #P obrovský#! bonus k [schemes|E] [GetScheme('murder').GetTypeName] zaměřeným na [clerical_holder.GetShortUIName] po dobu #V 15 let#!" # todo: NEW TRANSLATION
 pam_generic_events.0005.c: "Učili mě nastavovat druhou tvář." # todo: NEW TRANSLATION
 pam_generic_events.0005.c.tt: "Přijetí [character_interaction|E] #V $declaration_of_repentance_interaction$#! se zvýší o #P +20#! po dobu #V 10 let#!" # todo: NEW TRANSLATION
 pam_generic_events.0005.c.tt2: "Během následujících #V 10 let#! bude pravděpodobnější, že na vás někdo použije [character_interaction|E] #V $lift_excommunication_interaction$#!" # todo: NEW TRANSLATION
 pam_turned_the_other_cheek_accept_reason: "Nastavil druhou tvář" # todo: NEW TRANSLATION
 PAM_GENERIC_0005_MURDER_BONUS: "Věrný vazal má muže v državě tohoto cíle: $VALUE|+0=$" # todo: NEW TRANSLATION
 pam_generic_events.0007.opening: "Pro [ROOT.Char.GetTitledFirstName]" # todo: NEW TRANSLATION
 pam_generic_events.0007.desc: "Čin je dokonán. Našel jsem [clerical_holder.GetTitledFirstName] a nechal [clerical_holder.GetHerHim] krvácet." # todo: NEW TRANSLATION
 pam_generic_events.0007.a: "Dobře." # todo: NEW TRANSLATION
 pam_generic_events.0008.t: "Hlas v temnotách" # todo: NEW TRANSLATION
 pam_generic_events.0008.desc: "Večeře mi stále těžce leží v žaludku, když klopýtám k ložnici. Vidím rozmazaně a chodba se mi pod nohama naklání.\n\nA pak... hlas. „Takový [virtuous_trait.GetName( ROOT.Char )|l] [ROOT.Char.GetTitleAsNameNoTooltip|l]...“ říká. „Tak ctnostný. Svému pánu se líbíš.“\n\nJe to skutečně [ROOT.Char.GetFaith.HighGodName]? Nebo jen nemoc, kterou cítím?" # todo: NEW TRANSLATION
 pam_generic_events.0008.a: "Ano. #EMP Ano!!#!" # todo: NEW TRANSLATION
 pam_generic_events.0008.b: "To musí být On!" # todo: NEW TRANSLATION
 pam_generic_events.0008.c: "Staré síly se probouzejí..." # todo: NEW TRANSLATION
 pam_generic_events.0008.d: "Někdy má jídlo takový účinek." # todo: NEW TRANSLATION
 pam_generic_events.0008.e: "Možná... něco, co jsem snědl?" # todo: NEW TRANSLATION
 pam_generic_events.0008.f: "Pro jistotu se raději pomodlím." # todo: NEW TRANSLATION
 pam_generic_events.0009.t: "Pekelné plameny" # todo: NEW TRANSLATION
 pam_generic_events.0009.desc: "Probouzím se celý promočený, srdce mi buší o žebra.\n\nVe snu jsem hořel. Maso se mi odlupovalo od kostí jako máslo. „[sinful_trait.GetNameNoTooltip( ROOT.Char )|U]! [sinful_trait.GetNameNoTooltip( ROOT.Char )|U]!“ křičel na mě houf démonů.\n\nPlameny [ROOT.Char.GetFaith.NegativeAfterLife] si mě braly a každý výkřik byl můj vlastní." # todo: NEW TRANSLATION
 pam_generic_events.0009.a: "Bič zná cestu." # todo: NEW TRANSLATION
 pam_generic_events.0009.b: "Maso musí pykat za maso." # todo: NEW TRANSLATION
 pam_generic_events.0009.c: "[Glossary('$pam_james_4_8_english|q$','JAMES_4_8_GLOSS')]" # todo: NEW TRANSLATION
 pam_james_4_8_english: "#EMP Očistěte své ruce, hříšníci, a posvěťte svá srdce.#!" # todo: NEW TRANSLATION
 JAMES_4_8_GLOSS: "#weak Jak 4:8, NRSVUE#!" # todo: NEW TRANSLATION
 pam_generic_events.0009.d: "Rozhovor s [comforting_courtier.GetTitledFirstName] mi vždycky pomůže." # todo: NEW TRANSLATION
 pam_generic_events.0009.e: "Sen je jen sen." # todo: NEW TRANSLATION
 friend_comforted_hell_nightmare_reason: "[CHARACTER.GetShortUIName|U] hledal útěchu u [TARGET_CHARACTER.GetShortUIName] po noční můře o zatracení." # todo: NEW TRANSLATION
 friend_comforted_hell_nightmare_reason_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] hledal útěchu u [CHARACTER.GetShortUIName] po noční můře o zatracení." # todo: NEW TRANSLATION
 pam_generic_events.0010.t: "Požehnaný lov" # todo: NEW TRANSLATION
 pam_generic_events.0010.desc: "Kolem nás se rozprostírají [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')]. Brzy se ozve hřmění desítek cválajících koní a [hunting_ruler.GetName] je hrdě vede.\n\n#EMP „Stááát!“#! [hunting_ruler.GetSheHe|U] zvedne ruku na pozdrav a zastaví tak [hunting_ruler.GetHerHis] družinu. „Chvála [ROOT.Char.GetFaith.HighGodName] za tohle počasí!“ zvolá [hunting_ruler.GetSheHe|U], „a za zvěř, kterou lovíme!“" # todo: NEW TRANSLATION
 pam_generic_events.0010.a: "Rada, pokud ji vyslechnete..." # todo: NEW TRANSLATION
 pam_generic_events.0010.b: "Vaše oko je stejně bystré jako vaše kopí." # todo: NEW TRANSLATION
 pam_generic_events.0010.b.success: "Vaše chvála padne na úrodnou půdu" # todo: NEW TRANSLATION
 pam_generic_events.0010.b.failure: "Vaše chvála vyzní naprázdno" # todo: NEW TRANSLATION
 pam_generic_events.0010.b.toast.success: "[hunting_ruler.GetSheHe|U] si vaši chválu vezme k srdci" # todo: NEW TRANSLATION
 pam_generic_events.0010.b.toast.failure: "[hunting_ruler.GetSheHe|U] se ohradí proti vaší prázdné lichotce" # todo: NEW TRANSLATION
 pam_generic_events.0010.b.tt: "[hunting_ruler.GetTitledFirstName] bude po dobu #V 10 let#! pravděpodobněji souhlasit s [character_interaction|E] #high $negotiate_alliance_interaction$#!" # todo: NEW TRANSLATION
 pam_generic_events.0010.c: "Chvála budiž!" # todo: NEW TRANSLATION
 pam_generic_events.0010.d: "Půjčte mi na cestu pár svých jezdců." # todo: NEW TRANSLATION
 friend_praised_hunting_reason: "[CHARACTER.GetShortUIName|U] pochválil lovecké schopnosti [TARGET_CHARACTER.GetShortUINamePossessive]." # todo: NEW TRANSLATION
 friend_praised_hunting_reason_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] pochválil lovecké schopnosti [CHARACTER.GetShortUINamePossessive]." # todo: NEW TRANSLATION
 pam_praised_hunting_alliance_accept_reason: "Pochválil můj lov" # todo: NEW TRANSLATION
 pam_generic_events.0011.t: "Trocha hříchu" # todo: NEW TRANSLATION
 pam_generic_events.0011.desc: "Hříšné skutky [sinful_courtier.GetTitledFirstNamePossessive] trvají už příliš dlouho. Můj dvůr je plný zvěstí o [sinful_courtier.GetHerHis] [sinful_trait.GetName( ROOT.Char )|l] chování a viděl jsem služebnictvo ucuknout, kdykoli [sinful_courtier.GetSheHe] prošel kolem.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ zvolá [sinful_courtier.GetSheHe|U], když vstoupím do pracovny, [sinful_courtier.Custom('quirk_neg_pp')]. „Je mi ctí být ve vaší přítomnosti.“" # todo: NEW TRANSLATION
 pam_generic_events.0011.a: "Zanecháš svých [sinful_trait.GetNameNoTooltip( ROOT.Char )|l] způsobů." # todo: NEW TRANSLATION
 pam_generic_events.0011.b: "Naslouchej poučením, která nám [ROOT.Char.GetFaith.HighGodName] dává." # todo: NEW TRANSLATION
 pam_generic_events.0011.b.success: "Poučení padne na úrodnou půdu" # todo: NEW TRANSLATION
 pam_generic_events.0011.b.failure: "Poučení nepřijme" # todo: NEW TRANSLATION
 pam_generic_events.0011.b.toast.success: "[sinful_courtier.GetSheHe|U] pochopí závažnost [sinful_courtier.GetHerHis] hříchu" # todo: NEW TRANSLATION
 pam_generic_events.0011.b.toast.failure: "[sinful_courtier.GetSheHe|U] vaše poučování odbude" # todo: NEW TRANSLATION
 pam_generic_events.0011.c: "Tohle ti nedělá dobře..." # todo: NEW TRANSLATION
 pam_generic_events.0011.c.success: "Jemná domluva je obměkčí" # todo: NEW TRANSLATION
 pam_generic_events.0011.c.failure: "Vaše mírnost vám přinese jen pohrdání" # todo: NEW TRANSLATION
 pam_generic_events.0011.c.toast.success: "[sinful_courtier.GetSheHe|U] dojme vaše starostlivost" # todo: NEW TRANSLATION
 pam_generic_events.0011.c.toast.failure: "[sinful_courtier.GetSheHe|U] považuje vaši laskavost za slabost" # todo: NEW TRANSLATION
 pam_generic_events.0011.d: "Možná to není tak vážné." # todo: NEW TRANSLATION
