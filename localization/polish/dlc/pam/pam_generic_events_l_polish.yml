l_polish:
 pam_generic_events.0001.t: "Učenec víry"
 pam_generic_events.0001.desc: "[ROOT.Char.GetFaith.HouseOfWorship|U] dnes hostí přednášku. [Select_CString(chaplain.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', chaplain)|l] [chaplain.GetFirstName] se do výkladu [Select_CString(chaplain.IsFemale,'ponořila','ponořil')] natolik, že si mého příchodu ani nevšimne.\n\n„Ach, [ROOT.Char.Custom('FormOfAddressForLiege')|l],“ konečně mě zaregistruje. „Začíná tě snad více zajímat slovo, které nám předává [ROOT.Char.GetFaith.HighGodName]? Mohu tě zasvětit do jeho učení.“"
 pam_generic_events.0001.a: "To by rozhodně stálo za námahu."
 pam_generic_events.0001.b: "Už samotné vládnutí vyžaduje veškerou mou pozornost."
 pam_generic_events.0002.t: "Jsem dobrý člověk?"
 pam_generic_events.0002.desc.intro: "[Select_CString(doubting_child.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', doubting_child)|l] [doubting_child.GetFirstName] se vplíží do mé komnaty dlouho poté, co už měly svíce dávno zhasnout. Po [Select_CString(doubting_child.IsFemale,'jejích','jeho')] tvářích stékají slzy.\n\n„Jsem dobrý člověk?“ zazní tichý šepot. „Jestli je hříchem to, [Select_CString(doubting_child.IsFemale,'jaká','jaký')] jsem..."
 pam_generic_events.0002.desc.sin: "když jsem tak #EMP odporně#! [sinful_trait.GetName(ROOT.Char)|l]..."
 pam_generic_events.0002.desc.sp: "když mám v duši takové prázdno..."
 pam_generic_events.0002.desc.outro: "jak mě potom může [ROOT.Char.GetFaith.HighGodName] stále chtít?“"
 pam_generic_events.0002.a: "Odvrhni to, co ti přináší hanbu."
 pam_generic_events.0002.b: "Lásku si nemusíš zasloužit. Už ji máš."
 pam_generic_events.0002.c: "Pak se budeme modlit."
 friend_comforted_child_doubts: "[CZProDrop(CHARACTER,'utěšila','utěšil')|U] [TARGET_CHARACTER.Custom('CZ_ShortUIName_A')] ve chvíli pochybností o vlastní dobrotě."
 friend_comforted_child_doubts_corresponding: "[CZProDrop(TARGET_CHARACTER,'utěšila','utěšil')|U] [CHARACTER.Custom('CZ_ShortUIName_A')] ve chvíli pochybností o vlastní dobrotě."
 pam_generic_events.0003.t: "Takový už jsi"
 pam_generic_events.0003.desc: "[Select_CString(worried_spouse.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', worried_spouse)|l] [worried_spouse.GetFirstName] na mě po setmění čeká mezi živými ploty. V klíně si nervózně mne ruce.\n\n„Jsi tak #EMP [sinful_trait.GetName(ROOT.Char)|l]#!,“ zazní tlumený hlas. „Před [ROOT.Char.GetFaith.HighGodName] to vrhá hanbu na nás oba. Jak můžeš svou víru brát tak lehkovážně? Copak nevidíš, co si tím způsobuješ?“"
 pam_generic_events.0003.a: "Kvůli tobě? Napravím své chyby."
 pam_generic_events.0003.b: "[ROOT.Char.GetFaith.HighGodName|U] stojí za tím, [Select_CString(ROOT.Char.IsFemale,'jaká','jaký')] jsem."
 pam_generic_events.0003.c: "Děláš si příliš velké starosti."
 lover_promised_to_change_ways: "[CZProDrop(CHARACTER,'slíbila','slíbil')|U] [TARGET_CHARACTER.Custom('CZ_ShortUIName_D')], že [Select_CString(CHARACTER.IsLocalPlayer,'napravíš','napraví')] své chování a [Select_CString(CHARACTER.IsLocalPlayer,'vydáš','vydá')] se na pouť."
 lover_promised_to_change_ways_corresponding: "[CZProDrop(TARGET_CHARACTER,'slíbila','slíbil')|U] [CHARACTER.Custom('CZ_ShortUIName_D')], že [Select_CString(TARGET_CHARACTER.IsLocalPlayer,'napravíš','napraví')] své chování a [Select_CString(TARGET_CHARACTER.IsLocalPlayer,'vydáš','vydá')] se na pouť."
 rival_embraced_sinful_ways: "[CZProDrop(CHARACTER,'odmítla','odmítl')|U] činit pokání, přestože [CZProDrop(TARGET_CHARACTER,'prosila','prosil')] o změnu."
 rival_embraced_sinful_ways_corresponding: "[CZProDrop(TARGET_CHARACTER,'odmítla','odmítl')|U] činit pokání, přestože [CZProDrop(CHARACTER,'prosila','prosil')] o změnu."
 pam_generic_events.0004.t: "Světlo v temnotách"
 pam_generic_events.0004.desc: "[Select_CString(deceased.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', deceased)|l] [deceased.GetFirstName] [deceased.GetDeathReasonHideKiller|l]. [ROOT.Char.GetFaith.HouseOfWorship|U] zeje prázdnotou. Jen svíce tu na [Select_CString(deceased.IsFemale,'její','jeho')] památku skomírají.\n\n[Select_CString(comforter.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', comforter)|l] [comforter.GetFirstName] stojí tak blízko, že se naše rukávy dotýkají. „Zármutek je cesta,“ zazní tichý hlas. „Vydej se po ní a na jejím konci tě možná čeká [ROOT.Char.GetFaith.PositiveAfterLife].“"
 pam_generic_events.0004.a: "To já! #EMP Já#! jsem to [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')]!"
 pam_generic_events.0004.b: "[Glossary('$pam_john_14_2_english|q$', 'JOHN_14_2_GLOSS')]"
 pam_john_14_2_english: "#EMP V domu Otce mého příbytkové mnozí jsou.#!"
 JOHN_14_2_GLOSS: "#weak Jan 14,2 - Bible kralická (1613)#!"
 pam_generic_events.0004.c: "Pak se budeme modlit."
 pam_generic_events.0004.d: "Pojď. Připijeme si na [Select_CString(deceased.IsFemale,'její','jeho')] památku."
 pam_generic_events.0005.t: "Věrná pěst"
 pam_generic_events.0005.desc: "„Jak si to #EMP dovoluje#!?!“\n\n[Select_CString(loyal_vassal.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', loyal_vassal)|l] [loyal_vassal.GetTitledFirstName] vtrhne do zasedací síně s mečem napůl taseným z pochvy.\n\n„Jak se [clerical_holder.GetTitledFirstName] opovažuje tě exkomunikovat?“ Rozhořčeně plivne na zem. „V oblasti [clerical_region.GetName] mám své muže. Stačí říct slovo a vypravíme se [clerical_holder.Custom('CZ_TitledFirstName_A')] navštívit.“"
 pam_generic_events.0005.a: "Dobrá tedy. Běž."
 pam_generic_events.0005.a.tt: "[loyal_vassal.GetTitledFirstName|U] se vypraví do [CZProvName(clerical_holder.GetCapitalLocation,'G')]. Po návratu získáš [Concept('dread','hrůzu')|E] a zlepší se [Concept('opinion','mínění')|E] [Concept('vassal','vazalů')|E] s postojem [GetVassalStance('belligerent').GetTextIcon][GetVassalStance('belligerent').GetName]"
 pam_generic_events.0005.b: "Existují i chytřejší způsoby."
 pam_generic_events.0005.b.tt: "Na #V 15 let#! získáš #P obrovský#! bonus k [Concept('schemes','intrikám')|E] typu [GetScheme('murder').GetTypeName] namířeným proti [clerical_holder.Custom('CZ_ShortUIName_D')]"
 pam_generic_events.0005.c: "Byl jsem učen nastavit i druhou tvář."
 pam_generic_events.0005.c.tt: "[Concept('character_interaction','Interakce s postavou')|EU] #V $declaration_of_repentance_interaction$#! získá na #V 10 let#! bonus #P +20#! k přijetí"
 pam_generic_events.0005.c.tt2: "Po následujících #V 10 let#! bude pravděpodobnější, že na tebe bude použita [Concept('character_interaction','interakce s postavou')|E] #V $lift_excommunication_interaction$#!"
 pam_turned_the_other_cheek_accept_reason: "Nastavení druhé tváře"
 PAM_GENERIC_0005_MURDER_BONUS: "Věrný vazal má na území cíle své muže: $VALUE|+0=$"
 pam_generic_events.0007.opening: "Pro [ROOT.Char.Custom('CZ_TitledFirstName_A')]"
 pam_generic_events.0007.desc: "Je hotovo. [clerical_holder.GetTitledFirstName|U] mi [Select_CString(clerical_holder.IsFemale,'padla','padl')] do rukou a nyní leží v krvi."
 pam_generic_events.0007.a: "Dobře."
 pam_generic_events.0008.t: "Hlas v temnotě"
 pam_generic_events.0008.desc: "Po večeři mám těžký žaludek a sotva se dovleču ke své ložnici. Před očima se mi všechno rozmazává a chodba se mi pod nohama povážlivě naklání.\n\nA pak... hlas. „Tak [virtuous_trait.GetName(ROOT.Char)|l] [ROOT.Char.GetTitleAsNameNoTooltip|l]...“ ozve se. „Jaká ctnost! Svému pánovi děláš radost.“\n\nJe to opravdu [ROOT.Char.GetFaith.HighGodName]? Nebo snad jen nevolnost, kterou cítím?"
 pam_generic_events.0008.a: "Ano. #EMP Ano!!#!"
 pam_generic_events.0008.b: "To musí být [ROOT.Char.GetFaith.HighGodName]!"
 pam_generic_events.0008.c: "Prastaré síly se probouzejí..."
 pam_generic_events.0008.d: "Jídlo někdy takhle působí."
 pam_generic_events.0008.e: "Možná... něco, co jsem snědl?"
 pam_generic_events.0008.f: "Pro jistotu se raději pomodlím."
 pam_generic_events.0009.t: "Pekelné plameny"
 pam_generic_events.0009.desc: "Probouzím se celý zbrocený potem a srdce mi zběsile buší v hrudi.\n\nVe snu jsem [Select_CString(ROOT.Char.IsFemale,'hořela','hořel')]. Maso se mi odlupovalo od kostí jako máslo. „[sinful_trait.GetNameNoTooltip(ROOT.Char)|U]! [sinful_trait.GetNameNoTooltip(ROOT.Char)|U]!“ křičel na mě zástup démonů.\n\n[ROOT.Char.GetFaith.NegativeAfterLife|U] – právě tam mě měly plameny pohltit. A každý výkřik vycházel z mých vlastních úst."
 pam_generic_events.0009.a: "Důtky znají cestu."
 pam_generic_events.0009.b: "Tělo musí splatit svůj dluh."
 pam_generic_events.0009.c: "[Glossary('$pam_james_4_8_english|q$','JAMES_4_8_GLOSS')]"
 pam_james_4_8_english: "#EMP Umejte ruce, hříšníci, a očisťte srdce.#!"
 JAMES_4_8_GLOSS: "#weak Jakub 4,8 - Bible kralická (1613)#!"
 pam_generic_events.0009.d: "Rozhovor s [comforting_courtier.Custom('CZ_TitledFirstName_I')] mi vždy pomůže."
 pam_generic_events.0009.e: "Sen je jen sen."
 friend_comforted_hell_nightmare_reason: "[CZProDrop(CHARACTER,'hledala','hledal')|U] po noční můře o zatracení útěchu u [TARGET_CHARACTER.Custom('CZ_ShortUIName_G')]."
 friend_comforted_hell_nightmare_reason_corresponding: "[CZProDrop(TARGET_CHARACTER,'hledala','hledal')|U] po noční můře o zatracení útěchu u [CHARACTER.Custom('CZ_ShortUIName_G')]."
 pam_generic_events.0010.t: "Požehnaný lov"
 pam_generic_events.0010.desc: "Ocitáme se uprostřed [ROOT.Char.GetCurrentLocation.Custom('CZ_GetTerrainTypePlural_G')]. Zanedlouho se ozve dunění kopyt desítek cválajících koní, v jejichž čele hrdě jede [hunting_ruler.GetName].\n\n#EMP „Stááát!“#! [hunting_ruler.GetTitledFirstName|U] zvedne ruku na pozdrav a celé procesí se zastaví. „Kéž [ROOT.Char.GetFaith.HighGodName] přijme naši chválu za tohle nádherné počasí!“ zazní hlasité zvolání. „A za zvěř, kterou dnes lovíme!“"
 pam_generic_events.0010.a: "Jedna rada, pokud si ji chceš vyslechnout..."
 pam_generic_events.0010.b: "Tvůj zrak je stejně ostrý jako tvé kopí."
 pam_generic_events.0010.b.success: "Tvá pochvala padne na úrodnou půdu"
 pam_generic_events.0010.b.failure: "Tvá pochvala vyzní naprázdno"
 pam_generic_events.0010.b.toast.success: "[hunting_ruler.GetTitledFirstName|U] si tvou pochvalu vezme k srdci"
 pam_generic_events.0010.b.toast.failure: "Tvé prázdné lichocení [hunting_ruler.Custom('CZ_TitledFirstName_A')] popudí"
 pam_generic_events.0010.b.tt: "[hunting_ruler.GetTitledFirstName|U] bude po dobu #V 10 let#! ochotněji přijímat [Concept('character_interaction','interakci s postavou')|E] #high $negotiate_alliance_interaction$#!"
 pam_generic_events.0010.c: "Budiž chvála!"
 pam_generic_events.0010.d: "Půjč mi na cestu několik svých jezdců."
 friend_praised_hunting_reason: "[CZProDrop(CHARACTER,'pochválila','pochválil')|U] [TARGET_CHARACTER.Custom('CZ_ShortUIName_A')] za lovecké schopnosti."
 friend_praised_hunting_reason_corresponding: "[CZProDrop(TARGET_CHARACTER,'pochválila','pochválil')|U] [CHARACTER.Custom('CZ_ShortUIName_A')] za lovecké schopnosti."
 pam_praised_hunting_alliance_accept_reason: "Pochvala mých loveckých schopností"
 pam_generic_events.0011.t: "Trocha hříchu"
 pam_generic_events.0011.desc: "Hříšné chování [sinful_courtier.Custom('CZ_TitledFirstName_G')] už trvá příliš dlouho. Můj dvůr se hemží zvěstmi o [Select_CString(sinful_courtier.IsFemale,'jejích','jeho')] neřestech a stále častěji zaznívá odsuzující označení „[sinful_trait.GetName(ROOT.Char)|l]“. Dokonce i služebnictvo ustupuje stranou, kdykoli tato osoba prochází kolem.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ zvolá [sinful_courtier.GetTitledFirstName], když vstoupím do pracovny, [sinful_courtier.Custom('quirk_neg_pp')]. „Jaká čest být ve vaší přítomnosti.“"
 pam_generic_events.0011.a: "S tím, co u tebe všichni nazývají „[sinful_trait.GetNameNoTooltip(ROOT.Char)|l]“, musíš skoncovat."
 pam_generic_events.0011.b: "Naslouchej poučení, které nám předává [ROOT.Char.GetFaith.HighGodName]."
 pam_generic_events.0011.b.success: "Poučení padne na úrodnou půdu"
 pam_generic_events.0011.b.failure: "Poučení zůstane nevyslyšeno"
 pam_generic_events.0011.b.toast.success: "[sinful_courtier.GetTitledFirstName|U] si uvědomí tíhu svého hříchu"
 pam_generic_events.0011.b.toast.failure: "[sinful_courtier.GetTitledFirstName|U] nad tvým poučením jen mávne rukou"
 pam_generic_events.0011.c: "Tohle ti neprospívá..."
 pam_generic_events.0011.c.success: "Laskavá rada obměkčí srdce"
 pam_generic_events.0011.c.failure: "Tvá mírnost vyvolá jen pohrdání"
 pam_generic_events.0011.c.toast.success: "[sinful_courtier.GetTitledFirstName|U] ocení tvou starostlivost"
 pam_generic_events.0011.c.toast.failure: "[sinful_courtier.GetTitledFirstName|U] považuje tvou laskavost za slabost"
 pam_generic_events.0011.d: "Možná to není tak závažné."
