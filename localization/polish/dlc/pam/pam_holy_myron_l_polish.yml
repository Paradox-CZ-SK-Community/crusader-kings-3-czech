l_polish:
 pam_holy_myron_artifact_name: "Ampule svatého myra"
 pam_holy_myron_artifact_desc_common: "Pečlivě uzavřená nádobka s posvěceným myrem. V čistém olivovém oleji se louhuje [Glossary('judský balzám','pam_myron_gloss_balsam')]. Do každé nové dávky se přidává kapka té předchozí, takže nepřerušená posloupnost požehnání sahá až k apoštolům."
 pam_holy_myron_artifact_desc_masterwork: "Pečlivě uzavřená nádobka s posvěceným myrem. V čistém olivovém oleji se louhují [Glossary('judský balzám','pam_myron_gloss_balsam')], [Glossary('kadidlo','pam_myron_gloss_frankincense')] a [Glossary('myrha','pam_myron_gloss_myrrh')]. Do každé nové dávky se přidává kapka té předchozí, takže nepřerušená posloupnost požehnání sahá až k apoštolům."
 pam_holy_myron_artifact_desc_famed: "Pečlivě uzavřená nádobka s posvěceným myrem. V čistém olivovém oleji se louhují [Glossary('judský balzám','pam_myron_gloss_balsam')], [Glossary('kadidlo','pam_myron_gloss_frankincense')], [Glossary('myrha','pam_myron_gloss_myrrh')], [Glossary('nard','pam_myron_gloss_spikenard')] a [Glossary('skořice','pam_myron_gloss_cinnamon')]. Do každé nové dávky se přidává kapka té předchozí, takže nepřerušená posloupnost požehnání sahá až k apoštolům."
 pam_holy_myron_artifact_desc_illustrious: "Pečlivě uzavřená nádobka s posvěceným myrem, připraveným s hlubokou vírou podle nejstarších receptur. V čistém olivovém oleji se louhují [Glossary('judský balzám','pam_myron_gloss_balsam')], [Glossary('kadidlo','pam_myron_gloss_frankincense')], [Glossary('myrha','pam_myron_gloss_myrrh')], [Glossary('nard','pam_myron_gloss_spikenard')], [Glossary('skořice','pam_myron_gloss_cinnamon')], [Glossary('puškvorec','pam_myron_gloss_calamus')] a [Glossary('kasie','pam_myron_gloss_cassia')]. Do každé nové dávky se přidává kapka té předchozí, takže nepřerušená posloupnost požehnání sahá až k apoštolům."
 pam_holy_myron_charges_line: "Zbývající pomazání: #V [pam_myron_vessel.MakeScope.Var('pam_holy_myron_charges').GetValue|V0]#!"
 pam_holy_myron_artifact_desc_charged_common: "$pam_holy_myron_artifact_desc_common$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_masterwork: "$pam_holy_myron_artifact_desc_masterwork$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_famed: "$pam_holy_myron_artifact_desc_famed$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_illustrious: "$pam_holy_myron_artifact_desc_illustrious$\n\n$pam_holy_myron_charges_line$"
 pam_myron_gloss_balsam: "Proslulý judský balzám, vonná pryskyřice získávaná z nízkého keře pěstovaného u Jericha a v Én-gedí poblíž Mrtvého moře. Kapka za kapku šlo o nejdražší vonnou látku starověku. Tvoří samotné srdce myra a háje, v nichž se získává, jsou žárlivě střeženy. Nikde jinde totiž tyto vzácné keře nerostou."
 pam_myron_gloss_frankincense: "Zlatavá pryskyřice získávaná nařezáváním sukovitých stromů jižní Arábie, které rostou jen na nemnoha dalších místech. Na oltářích se pálí od nepaměti. Myru propůjčuje sladkou vůni a její dým vynáší modlitby k nebesům."
 pam_myron_gloss_myrrh: "Hořká pryskyřice temná jako krev, vytékající z trnitých stromů jižní Arábie a Afrického rohu. Kniha Exodus ji uvádí mezi přísadami svatého oleje k pomazání. Mudrci ji přinesli jako dar novorozenému Kristu a věřící ji později použili k uctění jeho hrobu."
 pam_myron_gloss_spikenard: "Hustý, sladce vonící olej získávaný z kořenů rostliny, která roste ve vysokých horách dalekého Východu. Odtud se dopravuje do indických přístavů. Právě takovým nardem byl Pán pomazán v Betánii, a jeho nesmírná cena tehdy pobouřila učedníky."
 pam_myron_gloss_cinnamon: "Sladká vnitřní kůra stromů pocházejících z Indie a ještě vzdálenějších ostrovů. Kniha Exodus ji uvádí mezi přísadami svatého oleje k pomazání. Aby se dostala ke křesťanským oltářům, musí překonat téměř celý známý svět."
 pam_myron_gloss_calamus: "Vonný puškvorec z Písma, aromatická rákosovitá rostlina sbíraná v dalekých východních mokřadech. Kniha Exodus jej uvádí mezi přísadami svatého oleje k pomazání."
 pam_myron_gloss_cassia: "Hrubší příbuzná skořice, získávaná loupáním kůry stromů dalekého Východu. Kniha Exodus ji uvádí mezi přísadami svatého oleje k pomazání."
 pam_holy_myron_vessel_modifier: "Nádobka se svatým myrem"
 pam_holy_myron_vessel_modifier_desc: "Tato nádobka uchovává posvěcené myro a vůně [Glossary('judského balzámu','pam_myron_gloss_balsam')] posvěcuje každého, kdo ji opatruje."
 pam_holy_myron_vessel_potent_modifier: "Nádobka s mimořádně účinným svatým myrem"
 pam_holy_myron_vessel_potent_modifier_desc: "Tato nádobka obsahuje myro mimořádné síly, bohaté na [Glossary('kadidlo','pam_myron_gloss_frankincense')] a [Glossary('nard','pam_myron_gloss_spikenard')]. Už samotná jeho vůně svědčí o svatosti."
 pam_chrismated_artifact_modifier: "Pomazání myrem"
 pam_chrismated_artifact_modifier_desc: "Tento artefakt byl pomazán svatým myrem a dodnes na něm ulpívá vůně [Glossary('myrhy','pam_myron_gloss_myrrh')]."
 pam_chrismated_regalia_modifier: "Myrem pomazané korunovační insignie"
 pam_chrismated_regalia_modifier_desc: "Tento artefakt byl při korunovaci pomazán svatým myrem a jeho požehnání dosud nevyprchalo."
 pam_holy_myron_pilgrim_modifier: "Výprava za balzámy"
 pam_holy_myron_pilgrim_modifier_desc: "Tato postava putuje za vzácnými přísadami svatého myra, mezi něž patří [Glossary('balzám','pam_myron_gloss_balsam')], [Glossary('kadidlo','pam_myron_gloss_frankincense')] i ještě vzácnější látky. Na cestách nic neponechává náhodě."
 pam_chrismated_child_modifier: "Myropomazání"
 pam_chrismated_child_modifier_desc: "Tato postava krátce po narození přijala myropomazání, při němž byla požehnaným olejem zpečetěna darem Ducha svatého."
 pam_myron_chrismated_child_modifier: "Pomazání svatým myrem"
 pam_myron_chrismated_child_modifier_desc: "Tato postava krátce po narození přijala myropomazání samotným svatým myrem. [Glossary('Judský balzám','pam_myron_gloss_balsam')] se dotkl čela novorozence a zanechal požehnání, které nikdy nevyprchá."
 pam_anointed_with_holy_oil_modifier: "Pomazání svatým olejem"
 pam_anointed_with_holy_oil_modifier_desc: "Tato postava přijala pomazání nemocných. Čelo a ruce jí byly pomazány olejem s vůní [Glossary('balzámu','pam_myron_gloss_balsam')], který posiluje tělo i duši v čase těžké zkoušky."
 pam_prepare_holy_myron_decision: "Připravit svaté myro"
 pam_prepare_holy_myron_decision_tooltip: "Vyšli svého [Concept('court_chaplain','dvorního kaplana')|E] shromáždit vzácné balzámy a posvětit #V Ampuli svatého myra#!, [Concept('artifact','artefakt')|E] s omezeným počtem použití při svatých pomazáních"
 pam_prepare_holy_myron_decision_desc: "Posvátné myro nelze namíchat ze zbytků nalezených v kuchyni. Písmo jmenuje jeho přísady – [Glossary('myrhu','pam_myron_gloss_myrrh')], sladkou [Glossary('skořici','pam_myron_gloss_cinnamon')], [Glossary('puškvorec','pam_myron_gloss_calamus')] a [Glossary('kasii','pam_myron_gloss_cassia')], vše v čistém olivovém oleji. Každou z těchto vzácností je přitom nutné přivézt ze země, kde roste.\n\nČím dále se výprava vydá, tím bohatší směs přinese zpět k posvěcení. Cesta je však dlouhá a málokdy milosrdná. Lupiči či horečky mohou připravit výpravu o část drahocenných přísad, nebo dokonce o toho, kdo je nese."
 pam_prepare_holy_myron_decision_confirm: "Vyslat výpravu"
 pam_prepare_holy_myron_decision_needs_chaplain: "Tvůj [Concept('court_chaplain','dvorní kaplan')|E] musí být dospělý, dostupný a nesmí již být na cestách"
 pam_prepare_holy_myron_decision_already_owned: "Nesmíš již vlastnit Ampuli svatého myra"
 pam_prepare_holy_myron_decision_journey_underway: "Tvůj [Concept('court_chaplain','dvorní kaplan')|E] již shromažďuje vzácné balzámy"
 pam_prepare_holy_myron_decision_levant_name: "Judský balzám"
 pam_prepare_holy_myron_decision_levant_desc: "Tvůj [Concept('court_chaplain','dvorní kaplan')|E] získá [Glossary('judský balzám','pam_myron_gloss_balsam')] v #V [GetTitleByKey('c_jerusalem').Custom('CZ_LandedNameNoTier_L')]#!. Jediný cíl a nejjednodušší směs.\n\nVýsledkem bude [Concept('common','běžná')|E] ampule svatého myra."
 pam_prepare_holy_myron_decision_arabia_name: "Balzám a kadidlo"
 pam_prepare_holy_myron_decision_arabia_desc: "Tvůj [Concept('court_chaplain','dvorní kaplan')|E] získá [Glossary('balzám','pam_myron_gloss_balsam')] v #V [GetTitleByKey('c_jerusalem').Custom('CZ_LandedNameNoTier_L')]#! a [Glossary('kadidlo','pam_myron_gloss_frankincense')] spolu s [Glossary('myrhou','pam_myron_gloss_myrrh')] v #V [GetTitleByKey('c_dhofar').Custom('CZ_LandedNameNoTier_L')]#!. Dvě zastávky na kadidlové stezce.\n\nVýsledkem bude [Concept('masterwork','mistrovská')|E] ampule svatého myra."
 pam_prepare_holy_myron_decision_india_name: "Všechny posvátné přísady"
 pam_prepare_holy_myron_decision_india_desc: "Tvůj [Concept('court_chaplain','dvorní kaplan')|E] získá [Glossary('balzám','pam_myron_gloss_balsam')] v #V [GetTitleByKey('c_jerusalem').Custom('CZ_LandedNameNoTier_L')]#!, [Glossary('kadidlo','pam_myron_gloss_frankincense')] a [Glossary('myrhu','pam_myron_gloss_myrrh')] v #V [GetTitleByKey('c_dhofar').Custom('CZ_LandedNameNoTier_L')]#! a nakonec [Glossary('nard','pam_myron_gloss_spikenard')] se [Glossary('skořicí','pam_myron_gloss_cinnamon')] v #V [GetTitleByKey('c_kerala').Custom('CZ_LandedNameNoTier_L')]#!. Čeká jej dlouhá cesta.\n\nVýsledkem bude [Concept('famed','proslulá')|E] ampule svatého myra. Pokud tvůj [Concept('court_chaplain','dvorní kaplan')|E] věrně dodrží staré receptury, může vzniknout dokonce [Concept('illustrious','věhlasná')|E] ampule. Šance činí #V [ROOT.Char.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0]%#! a odvíjí se od [Select_CString(ROOT.Char.GetCouncillor('councillor_court_chaplain').IsFemale,'její','jeho')] [Concept('learning','učenosti')|E]."
 pam_myron_levant_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_myron_arabia_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_myron_india_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_prepare_holy_myron_decision_afford_arabia_tt: "Musíš si moci dovolit zaplatit [gold_i][GetPlayer.MakeScope.ScriptValue('major_gold_value')|0V] [Concept('gold','zlata')|E]"
 pam_prepare_holy_myron_decision_afford_india_tt: "Musíš si moci dovolit zaplatit [gold_i][GetPlayer.MakeScope.ScriptValue('pam_holy_myron_india_journey_gold_value')|0V] [Concept('gold','zlata')|E]"
 pam_prepare_holy_myron_journey_toast: "Výprava za svatým myrem vyráží"
 pam_prepare_holy_myron_journey_toast_tt: "Tvůj [Concept('court_chaplain','dvorní kaplan')|E] vyráží shromáždit přísady potřebné k přípravě svatého myra"
 pam_prepare_holy_myron_decision_levant_effect_tt: "Tvůj [Concept('court_chaplain','dvorní kaplan')|E] vyráží do #V [GetTitleByKey('c_jerusalem').Custom('CZ_LandedNameNoTier_G')]#!. Po návratu bude posvěcena [Concept('common','běžná')|E] ampule svatého myra, pokud cesta proběhne bez úhony"
 pam_prepare_holy_myron_decision_arabia_effect_tt: "Tvůj [Concept('court_chaplain','dvorní kaplan')|E] vyráží do #V [GetTitleByKey('c_jerusalem').Custom('CZ_LandedNameNoTier_G')]#! a #V [GetTitleByKey('c_dhofar').Custom('CZ_LandedNameNoTier_G')]#!. Po návratu bude posvěcena [Concept('masterwork','mistrovská')|E] ampule svatého myra. Lupiči či jiné neštěstí na cestě však mohou znehodnotit vzácnou směs"
 pam_prepare_holy_myron_decision_india_effect_tt: "Tvůj [Concept('court_chaplain','dvorní kaplan')|E] vyráží do #V [GetTitleByKey('c_jerusalem').Custom('CZ_LandedNameNoTier_G')]#!, #V [GetTitleByKey('c_dhofar').Custom('CZ_LandedNameNoTier_G')]#! a #V [GetTitleByKey('c_kerala').Custom('CZ_LandedNameNoTier_G')]#!. Po návratu bude posvěcena [Concept('famed','proslulá')|E] ampule svatého myra, s #V [GetPlayer.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0]%#! šancí, že místo ní vznikne [Concept('illustrious','věhlasná')|E] ampule. Lupiči či jiné neštěstí na cestě však mohou znehodnotit vzácnou směs"
 pam_holy_myron.0011.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U],"
 pam_holy_myron.0011.desc_levant: "Píši od břehů Slaného moře, kde [Glossary('judský balzám','pam_myron_gloss_balsam')] vytéká z naříznuté kůry jako zlaté slzy. Pěstitelé tvrdě smlouvají, ale pryskyřice je pravá. Jediná kapka na zápěstí provoní celou místnost. První z potřebných přísad je zajištěna."
 pam_holy_myron.0011.desc_arabia: "Kadidlová stezka byla dlouhá a studní po cestě poskrovnu, ale v Dafáru jsme získali, pro co jsme přijeli: [Glossary('kadidlo','pam_myron_gloss_frankincense')] bledé jako jinovatka a [Glossary('myrhu','pam_myron_gloss_myrrh')] barvy zaschlé krve. Vůdci karavan přísahají, že lepší pryskyřice neprochází žádným přístavem na světě. Uvěřil jsem jim a podle toho také zaplatil."
 pam_holy_myron.0011.desc_india: "Plavba po moři byla těžkou zkouškou pro každého na palubě, ale malabarské trhy nám vše vynahradily. Získali jsme [Glossary('nard','pam_myron_gloss_spikenard')] z vysokých hor a tu nejsladší [Glossary('skořici','pam_myron_gloss_cinnamon')], jakou jsem kdy ochutnal. Poslední z potřebných přísad je zajištěna. Vyplouváme domů."
 pam_holy_myron.0011.a: "Kéž zbytek cesty rychle uběhne."
 pam_holy_myron.0012.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U], postihlo nás neštěstí."
 pam_holy_myron.0012.desc: "Průsmyk před námi zatarasili ozbrojení lapkové, kteří se vydávají za výběrčí mýta, přestože jim žádný panovník takové právo neudělil. Spočítali naše truhly a dobře vědí, jakou mají cenu. Za náležitý obnos nás prý nechají projít, aniž by nás oloupili.\n\nOčekávám tvou odpověď a vzácné balzámy zatím pečlivě střežím."
 pam_holy_myron.0012.a: "Zaplať jim. Myro má větší cenu než zlato."
 pam_holy_myron.0012.b: "Církevní peníze nejsou určeny lapkům."
 pam_holy_myron.0012.b.tt: "Shromážděné balzámy budou uloupeny a výsledné svaté myro bude mít #N nižší kvalitu#!"
 pam_holy_myron.0013.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U],"
 pam_holy_myron.0013.desc: "Cestou mě skolila horečka. Při psaní se mi třesou prsty a hostinského žena každý den přísahá na jiný lék, jeden odpornější než druhý. O balzámy však neměj obavy. Jsou pečlivě zapečetěné a střežené lépe než já. Jakmile se znovu udržím v sedle, budu pokračovat v cestě."
 pam_holy_myron.0013.a: "Budu se za [Select_CString(myron_chaplain.IsFemale,'ni','něj')] modlit."
 pam_holy_myron_journey_abandoned_toast: "Výprava za svatým myrem byla přerušena"
 pam_holy_myron.0020.t: "Konec cesty"
 pam_holy_myron.0020.desc: "Obchodník mi píše, že [myron_chaplain.GetTitledFirstName], [Select_CString(myron_chaplain.IsFemale,'kterou','kterého')] jsem [Select_CString(ROOT.Char.IsFemale,'vyslala','vyslal')] pro přísady svatého myra, [Select_CString(myron_chaplain.IsFemale,'zemřela','zemřel')] v daleké cizině. Vzácné balzámy se ztratily mezi neznámými lidmi a ani mé stříbro, ani [Select_CString(myron_chaplain.IsFemale,'její','jeho')] úsilí nepřinesou jedinou kapku posvěceného myra."
 pam_holy_myron.0020.a: "Kéž [ROOT.Char.GetFaith.HighGodName] dopřeje [myron_chaplain.Custom('CZ_TitledFirstName_D')] věčný pokoj."
 pam_holy_myron.0100.t: "Posvěcení myra"
 pam_holy_myron.0100.desc.intro: "Z daleké cesty se ke mně konečně vrací [myron_chaplain.GetTitledFirstName], [Select_CString(myron_chaplain.IsFemale,'zmožená','zmožený')] dlouhým putováním. Vůni vzácného nákladu cítí celý můj dvůr už od brány. Za zavřenými dveřmi se přísady smísí s olejem a do nového myra se přidá kapka toho starého. Tak se zachovává nepřerušený obyčej sahající až k apoštolům.\n\n"
 pam_holy_myron.0100.desc_full: "Všechny přísady přečkaly cestu bez úhony. Hotové myro, zlatavé a nádherně vonící, se nalije do ampule, která pak zaujme své místo na mém oltáři."
 pam_holy_myron.0100.desc_robbed: "Mnohé přísady se cestou ztratily a výsledná směs je chudší, než jsem [Select_CString(ROOT.Char.IsFemale,'doufala','doufal')]. Posvěcení však napraví to, oč nás cesta připravila, a ampule přesto zaujme své místo na mém oltáři."
 pam_holy_myron.0100.a: "Řetězec požehnání zůstává nepřerušen."
 pam_holy_myron.0200.t: "Poslední pomazání"
 pam_holy_myron.0200.desc: "Smuteční hosté se rozestupují, když přicházím k márám. [pam_holy_myron_artifact.GetName|U] spočívá v mých rukou. Kříž z posvátného myra na čele by znamenal, že [deceased.GetTitledFirstName] předstoupí mezi pomazanými před trůn, na němž vládne [ROOT.Char.GetFaith.HighGodName]. Celý shromážděný dvůr by byl svědkem této pocty a ještě dlouho by o ní vyprávěl.\n\nKaždá kapka, kterou však věnuji mrtvým, je kapkou, jež už nikdy neposlouží živým."
 pam_holy_myron.0200.a: "Ať [deceased.GetFirstNameNoTooltip] odejde na věčnost s pomazáním."
 pam_holy_myron.0200.a.saint_tt: "#V [deceased.GetFirstNameNoTooltip|U]#! bude při posuzování případného svatořečení [Select_CString(deceased.IsFemale,'hodnocena příznivěji','hodnocen příznivěji')]"
 pam_holy_myron.0200.b: "Posvátné myro patří živým."
 pam_holy_myron.0200.b.tt: "Uchováš posvátné myro pro ty, kterým ještě může přinést požehnání"
 pam_holy_myron_spend_tt: "Spotřebuješ jednu dávku ze své Ampule svatého myra"
 pam_holy_myron_spend_last_tt: "Spotřebuješ #N poslední#! dávku ze své Ampule svatého myra. Prázdná nádobka bude #N ztracena#!"
 pam_holy_myron_vessel_spent_toast: "Ampule je prázdná"
