 pam_holy_myron.0300.t: "Pečeť Ducha"
 pam_holy_myron.0300.desc: "[Select_CString(child.IsFemale,'Má','Můj')] [child.Custom('GetDaughterSon')|l] [child.GetFirstName] usedavě pláče. [myron_officiant.GetFaith.PriestNeuter|U] drží dítě na hrudi, zatímco se přináší posvátné myro.\n\nCírkev má dostatek požehnaného oleje pro každého novorozence. Jenže má ampule svatého myra je na dosah ruky a jediná její třpytivá kapka by tomuto dítěti vtiskla pečeť na celý život."
 pam_holy_myron.0300.desc_twin: "\n\nA ne jedno čelo, ale hned dvě! [pam_myron_twin.GetFirstName|U] leží v zavinovačce vedle svého dvojčete. Obě děti čekají na stejné posvátné pomazání."
