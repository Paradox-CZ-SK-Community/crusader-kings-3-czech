 pam_holy_myron.0300.desc: "Mé [child.Custom('GetDaughterSon')] [child.GetFirstName] křičí na hrudi [myron_officiant.GetFaith.PriestNeuter], když přinášejí křižmo.\n\nCírkev má požehnaného oleje dost pro každého novorozence — ale mám po ruce svou ampuli svatého myronu a jediná její třpytivá kapka by toto dítě navždy zpečetila." # todo: NEW TRANSLATION
