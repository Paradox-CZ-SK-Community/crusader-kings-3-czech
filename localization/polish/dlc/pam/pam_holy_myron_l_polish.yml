l_polish:
 pam_holy_myron_artifact_name: "Ampule svatého myra" # todo: NEW TRANSLATION
 pam_holy_myron_artifact_desc_common: "Uzavřená nádoba s posvěceným křižmem: [Glossary('balsam of Judea','pam_myron_gloss_balsam')] louhovaným v čistém olivovém oleji, do něhož se přidává kapka předchozí várky, aby řetězec požehnání zůstal nepřerušený až k apoštolům." # todo: NEW TRANSLATION
 pam_holy_myron_artifact_desc_masterwork: "Uzavřená nádoba s posvěceným křižmem: [Glossary('balsam of Judea','pam_myron_gloss_balsam')], [Glossary('frankincense','pam_myron_gloss_frankincense')] a [Glossary('myrrh','pam_myron_gloss_myrrh')] louhovanými v čistém olivovém oleji, do něhož se přidává kapka předchozí várky, aby řetězec požehnání zůstal nepřerušený až k apoštolům." # todo: NEW TRANSLATION
 pam_holy_myron_artifact_desc_famed: "Uzavřená nádoba s posvěceným křižmem: [Glossary('balsam of Judea','pam_myron_gloss_balsam')], [Glossary('frankincense','pam_myron_gloss_frankincense')], [Glossary('myrrh','pam_myron_gloss_myrrh')], [Glossary('spikenard','pam_myron_gloss_spikenard')] a [Glossary('cinnamon','pam_myron_gloss_cinnamon')] louhovanými v čistém olivovém oleji, do něhož se přidává kapka předchozí várky, aby řetězec požehnání zůstal nepřerušený až k apoštolům." # todo: NEW TRANSLATION
 pam_holy_myron_artifact_desc_illustrious: "Uzavřená nádoba s posvěceným křižmem, namíchaným s dokonalou zbožností podle nejstarších receptů: [Glossary('balsam of Judea','pam_myron_gloss_balsam')], [Glossary('frankincense','pam_myron_gloss_frankincense')], [Glossary('myrrh','pam_myron_gloss_myrrh')], [Glossary('spikenard','pam_myron_gloss_spikenard')], [Glossary('cinnamon','pam_myron_gloss_cinnamon')], [Glossary('calamus','pam_myron_gloss_calamus')] a [Glossary('cassia','pam_myron_gloss_cassia')] louhovanými v čistém olivovém oleji, do něhož se přidává kapka předchozí várky, aby řetězec požehnání zůstal nepřerušený až k apoštolům." # todo: NEW TRANSLATION
 pam_holy_myron_charges_line: "Zbývající pomazání: #V [pam_myron_vessel.MakeScope.Var('pam_holy_myron_charges').GetValue|V0]#!" # todo: NEW TRANSLATION
 pam_holy_myron_artifact_desc_charged_common: "$pam_holy_myron_artifact_desc_common$\n\n$pam_holy_myron_charges_line$" # todo: NEW TRANSLATION
 pam_holy_myron_artifact_desc_charged_masterwork: "$pam_holy_myron_artifact_desc_masterwork$\n\n$pam_holy_myron_charges_line$" # todo: NEW TRANSLATION
 pam_holy_myron_artifact_desc_charged_famed: "$pam_holy_myron_artifact_desc_famed$\n\n$pam_holy_myron_charges_line$" # todo: NEW TRANSLATION
 pam_holy_myron_artifact_desc_charged_illustrious: "$pam_holy_myron_artifact_desc_illustrious$\n\n$pam_holy_myron_charges_line$" # todo: NEW TRANSLATION
 pam_myron_gloss_balsam: "Proslulý balzám z Judeje: vonná pryskyřice roněná nízkým keřem, který se pěstuje u Jericha a En-Gedi při Mrtvém moři. Kapka za kapkou jde o nejdražší parfém starověkého světa. Je srdcem křižma a jeho žárlivě střežené háje nerostou nikde jinde." # todo: NEW TRANSLATION
 pam_myron_gloss_frankincense: "Zlatavá pryskyřice získávaná z pokroucených stromů jižní Arábie a téměř z žádné jiné země. Pálí se na oltářích od nepaměti, křižmu dodává sladkou vůni a její dým vynáší modlitby k nebesům." # todo: NEW TRANSLATION
 pam_myron_gloss_myrrh: "Hořká, jako krev temná pryskyřice vytékající z trnitých stromů jižní Arábie a Afrického rohu. Kniha Exodus ji uvádí mezi složkami svatého oleje pomazání; byla darem mudrců Kristovu dítěti i obětí věřících u Jeho hrobu." # todo: NEW TRANSLATION
 pam_myron_gloss_spikenard: "Silně vonný, sladký olej lisovaný z kořenů rostliny z vysokých východních hor, který se dopravuje do indických přístavů. Takovým nardem byl Pán pomazán v Betánii — a jeho cena pohoršila učedníky." # todo: NEW TRANSLATION
 pam_myron_gloss_cinnamon: "Sladká vnitřní kůra stromů z Indie a ostrovů za ní, kterou Kniha Exodus uvádí mezi složkami svatého oleje pomazání. Putuje přes celý známý svět ke každému křesťanskému oltáři." # todo: NEW TRANSLATION
 pam_myron_gloss_calamus: "Sladká biblická třtina: aromatický rákos sbíraný v dalekých východních bažinách, který Kniha Exodus uvádí mezi složkami svatého oleje pomazání." # todo: NEW TRANSLATION
 pam_myron_gloss_cassia: "Hrubší příbuzná skořice, získávaná z kůry stromů na Dálném východě. Kniha Exodus ji uvádí mezi složkami svatého oleje pomazání." # todo: NEW TRANSLATION
 pam_holy_myron_vessel_modifier: "Nádoba svatého myra" # todo: NEW TRANSLATION
 pam_holy_myron_vessel_modifier_desc: "Tato nádoba obsahuje posvěcené křižmo a vůně [Glossary('balsam of Judea','pam_myron_gloss_balsam')] posvěcuje toho, kdo ji střeží." # todo: NEW TRANSLATION
 pam_holy_myron_vessel_potent_modifier: "Nádoba mocného svatého myra" # todo: NEW TRANSLATION
 pam_holy_myron_vessel_potent_modifier_desc: "Tato nádoba obsahuje mimořádně účinné křižmo bohaté na [Glossary('frankincense','pam_myron_gloss_frankincense')] a [Glossary('spikenard','pam_myron_gloss_spikenard')]; už jeho vůně svědčí o svatosti." # todo: NEW TRANSLATION
 pam_chrismated_artifact_modifier: "Pomazáno křižmem" # todo: NEW TRANSLATION
 pam_chrismated_artifact_modifier_desc: "Tento artefakt byl pomazán svatým myrem a stále na něm ulpívá vůně [Glossary('myrrh','pam_myron_gloss_myrrh')]." # todo: NEW TRANSLATION
 pam_chrismated_regalia_modifier: "Křižmem pomazané korunovační klenoty" # todo: NEW TRANSLATION
 pam_chrismated_regalia_modifier_desc: "Tento artefakt se při korunovaci dotkl svatého myra a jeho požehnání nevyprchalo." # todo: NEW TRANSLATION
 pam_holy_myron_pilgrim_modifier: "Nosič balzámů" # todo: NEW TRANSLATION
 pam_holy_myron_pilgrim_modifier_desc: "Tato postava cestuje a hledá přísady pro svaté myro — [Glossary('balsam','pam_myron_gloss_balsam')], [Glossary('frankincense','pam_myron_gloss_frankincense')] a vzácnější suroviny — a na cestách nic neriskuje." # todo: NEW TRANSLATION
 pam_chrismated_child_modifier: "Pomazáno křižmem" # todo: NEW TRANSLATION
 pam_chrismated_child_modifier_desc: "Tato postava byla krátce po narození pomazána křižmem a požehnaným olejem zapečetěna darem Ducha svatého." # todo: NEW TRANSLATION
 pam_myron_chrismated_child_modifier: "Pomazáno svatým myrem" # todo: NEW TRANSLATION
 pam_myron_chrismated_child_modifier_desc: "Tato postava byla krátce po narození pomazána samotným svatým myrem — [Glossary('balsam of Judea','pam_myron_gloss_balsam')] na čele novorozence — a toto pomazání nikdy nevyprchá." # todo: NEW TRANSLATION
 pam_anointed_with_holy_oil_modifier: "Pomazáno svatým olejem" # todo: NEW TRANSLATION
 pam_anointed_with_holy_oil_modifier_desc: "Tato postava přijala pomazání nemocných: olej vonící po [Glossary('balsam','pam_myron_gloss_balsam')] jí byl nanesen na čelo a ruce, aby posílil tělo i duši v těžké zkoušce." # todo: NEW TRANSLATION
 pam_prepare_holy_myron_decision: "Připravit svaté myro" # todo: NEW TRANSLATION
 pam_prepare_holy_myron_decision_tooltip: "Vyslat svého [court_chaplain|E], aby nasbíral vzácné balzámy a posvětil #V ampuli svatého myra#! — [artifact|E], jehož náplň se spotřebovává při svatých pomazáních" # todo: NEW TRANSLATION
 pam_prepare_holy_myron_decision_desc: "Posvátné křižmo nelze namíchat ze zbytků z kuchyně. Písmo uvádí jeho složky — [Glossary('myrrh','pam_myron_gloss_myrrh')], sladkou [Glossary('cinnamon','pam_myron_gloss_cinnamon')], [Glossary('calamus','pam_myron_gloss_calamus')] a [Glossary('cassia','pam_myron_gloss_cassia')] v čistém olivovém oleji — a každou z nich je třeba přivézt ze země, kde roste.\n\nČím dál výprava putuje, tím bohatší směs přiveze k posvěcení. Cesta je však dlouhá a málokdy milosrdná; lupiči a horečky mohou zmenšit zásoby, nebo připravit jejich nositele o život." # todo: NEW TRANSLATION
 pam_prepare_holy_myron_decision_confirm: "Vyslat výpravu" # todo: NEW TRANSLATION
 pam_prepare_holy_myron_decision_needs_chaplain: "Váš [court_chaplain|E] musí být dospělý, dostupný a nesmí být právě na cestách" # todo: NEW TRANSLATION
 pam_prepare_holy_myron_decision_already_owned: "Již nesmíte vlastnit ampuli svatého myra" # todo: NEW TRANSLATION
 pam_prepare_holy_myron_decision_journey_underway: "Váš [court_chaplain|E] již sbírá balzámy" # todo: NEW TRANSLATION
 pam_prepare_holy_myron_decision_levant_name: "Balzám z Judeje" # todo: NEW TRANSLATION
 pam_prepare_holy_myron_decision_levant_desc: "Váš [court_chaplain|E] sbírá [Glossary('balsam of Judea','pam_myron_gloss_balsam')] v #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#! — na jediném místě a v nejprostší směsi.\n\nZískáte [common|E] ampuli svatého myronu." # todo: NEW TRANSLATION
 pam_prepare_holy_myron_decision_arabia_name: "Balzám a kadidlo" # todo: NEW TRANSLATION
 pam_prepare_holy_myron_decision_arabia_desc: "Váš [court_chaplain|E] nasbírá [Glossary('balsam','pam_myron_gloss_balsam')] v #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#! a [Glossary('frankincense','pam_myron_gloss_frankincense')] a [Glossary('myrrh','pam_myron_gloss_myrrh')] v #V [GetTitleByKey('c_dhofar').GetNameNoTier]#! — dvě zastávky na kadidlové stezce.\n\nVýsledkem bude [masterwork|E] ampule svatého myra." # todo: NEW TRANSLATION
 pam_prepare_holy_myron_decision_india_name: "Všechny posvátné přísady" # todo: NEW TRANSLATION
 pam_prepare_holy_myron_decision_india_desc: "Váš [court_chaplain|E] nasbírá [Glossary('balsam','pam_myron_gloss_balsam')] v #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, [Glossary('frankincense','pam_myron_gloss_frankincense')] a [Glossary('myrrh','pam_myron_gloss_myrrh')] v #V [GetTitleByKey('c_dhofar').GetNameNoTier]#! a [Glossary('spikenard','pam_myron_gloss_spikenard')] a [Glossary('cinnamon','pam_myron_gloss_cinnamon')] v #V [GetTitleByKey('c_kerala').GetNameNoTier]#!, což je dlouhá cesta.\n\nVynese [famed|E] ampuli svatého myra. Pokud váš [court_chaplain|E] věrně dodrží staré receptury — což je šance #V [ROOT.Char.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0]%#!, která se odvíjí od [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetHerHis] [learning|E] — bude várka namísto toho [illustrious|E]." # todo: NEW TRANSLATION
 pam_myron_levant_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$" # todo: NEW TRANSLATION
 pam_myron_arabia_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$" # todo: NEW TRANSLATION
 pam_myron_india_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$" # todo: NEW TRANSLATION
 pam_prepare_holy_myron_decision_afford_arabia_tt: "Musíte si moci dovolit [gold_i][GetPlayer.MakeScope.ScriptValue('major_gold_value')|0V] [gold|E]" # todo: NEW TRANSLATION
 pam_prepare_holy_myron_decision_afford_india_tt: "Musíte si moci dovolit [gold_i][GetPlayer.MakeScope.ScriptValue('pam_holy_myron_india_journey_gold_value')|0V] [gold|E]" # todo: NEW TRANSLATION
 pam_prepare_holy_myron_journey_toast: "Výprava za svatým myrem vyráží na cestu" # todo: NEW TRANSLATION
 pam_prepare_holy_myron_journey_toast_tt: "Váš [court_chaplain|E] vyráží nasbírat přísady pro svaté myro" # todo: NEW TRANSLATION
 pam_prepare_holy_myron_decision_levant_effect_tt: "Váš [court_chaplain|E] vyráží do #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!. Po návratu bude posvěcena [common|E] ampule svatého myra — pokud mu bude cesta přát" # todo: NEW TRANSLATION
 pam_prepare_holy_myron_decision_arabia_effect_tt: "Váš [court_chaplain|E] vyráží do #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#! a #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!. Po návratu bude posvěcena [masterwork|E] ampule svatého myra — lupiči nebo jiné neštěstí na cestě mohou směs znehodnotit" # todo: NEW TRANSLATION
 pam_prepare_holy_myron_decision_india_effect_tt: "Váš [court_chaplain|E] vyráží do #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, #V [GetTitleByKey('c_dhofar').GetNameNoTier]#! a #V [GetTitleByKey('c_kerala').GetNameNoTier]#!. Po návratu bude posvěcena [famed|E] ampule svatého myra, s #V [GetPlayer.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0]%#! pravděpodobností, že bude namísto toho [illustrious|E] — lupiči nebo jiné neštěstí na cestě mohou směs znehodnotit" # todo: NEW TRANSLATION
 pam_holy_myron.0011.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U]," # todo: NEW TRANSLATION
 pam_holy_myron.0011.desc_levant: "Píši vám z břehů Slaného moře, kde z naříznuté kůry roní [Glossary('balm of Judea','pam_myron_gloss_balsam')] zlaté slzy. Pěstitelé smlouvají tvrdě, ale pryskyřice je pravá — jediná kapka na zápěstí provoní celou místnost. První přísada je zajištěna." # todo: NEW TRANSLATION
 pam_holy_myron.0011.desc_arabia: "Kadidlová stezka byla dlouhá a studní bylo pomálu, ale Dhofar nám přinesl naši odměnu: [Glossary('frankincense','pam_myron_gloss_frankincense')] bledé jako jinovatka a [Glossary('myrrh','pam_myron_gloss_myrrh')] barvy zaschlé krve. Velbloudáři přísahají, že jemnější pryskyřice neprochází žádným přístavem na světě. Uvěřil jsem jim a také jsem podle toho zaplatil." # todo: NEW TRANSLATION
 pam_holy_myron.0011.desc_india: "Plavba přes moře dala zabrat každé duši na palubě, ale trhy na malabarském pobřeží nám to vynahradily: [Glossary('spikenard','pam_myron_gloss_spikenard')] z vysokých hor a nejsladší [Glossary('cinnamon','pam_myron_gloss_cinnamon')], jakou jsem kdy ochutnal. Poslední přísada je zajištěna. Plujeme domů." # todo: NEW TRANSLATION
 pam_holy_myron.0011.a: "Kéž zbytek cesty rychle uteče." # todo: NEW TRANSLATION
 pam_holy_myron.0012.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U], stihlo nás neštěstí," # todo: NEW TRANSLATION
 pam_holy_myron.0012.desc: "Cestu před námi zatarasili ozbrojení lupiči a říkají si výběrčí mýta, ačkoli jim žádná koruna nikdy nedala takové právo. Prohlédli si naše truhly a znají jejich cenu; zaplatíme-li, možná nás nechají projít bez oloupení.\n\nČekám na vaši odpověď a balzámy střežím." # todo: NEW TRANSLATION
 pam_holy_myron.0012.a: "Zaplaťte jim. Křižmo má větší cenu než peníze." # todo: NEW TRANSLATION
 pam_holy_myron.0012.b: "Církevní peníze nejsou pro lupiče." # todo: NEW TRANSLATION
 pam_holy_myron.0012.b.tt: "Nasbírané balzámy budou uloupeny a výsledné svaté myro bude mít #N nižší kvalitu#!" # todo: NEW TRANSLATION
 pam_holy_myron.0013.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U]," # todo: NEW TRANSLATION
 pam_holy_myron.0013.desc: "Na cestě mě skolila horečka. Při psaní se mi třesou prsty a žena hostinského každý den přísahá na jiný lék, pokaždé odpornější než ten předchozí. O balzámy se nebojte — jsou zapečetěné a střežené lépe než já. Vyrazím, jakmile budu schopen sedět na koni." # todo: NEW TRANSLATION
 pam_holy_myron.0013.a: "Budu se za [myron_chaplain.GetHerHim] modlit." # todo: NEW TRANSLATION
 pam_holy_myron_journey_abandoned_toast: "Výprava za svatým myrem byla zrušena" # todo: NEW TRANSLATION
 pam_holy_myron.0020.t: "Cesta končí" # todo: NEW TRANSLATION
 pam_holy_myron.0020.desc: "Obchodník mi píše, že [myron_chaplain.GetTitledFirstName], kterého jsem vyslal pro přísady na svaté myro, zemřel v cizí zemi. Balzámy jsou ztraceny mezi cizinci a mé stříbro i úsilí [myron_chaplain.GetHerHis] nepřinesou žádné křižmo." # todo: NEW TRANSLATION
 pam_holy_myron.0020.a: "Kéž [ROOT.Char.GetFaith.HighGodName] dopřeje [myron_chaplain.GetHerHim] odpočinek." # todo: NEW TRANSLATION
 pam_holy_myron.0100.t: "Posvěcení myra" # todo: NEW TRANSLATION
 pam_holy_myron.0100.desc.intro: "Z cest se ke mně konečně vrací [myron_chaplain.GetTitledFirstName], zmožený dlouhým putováním, a jeho náklad je cítit už od brány. Za zavřenými dveřmi se olej smísí a do nové várky se přidá kapka starého myra — zvyk nepřerušený od dob apoštolů.\n\n" # todo: NEW TRANSLATION
 pam_holy_myron.0100.desc_full: "Všechny přísady přežily cestu. Hotové křižmo zlatavě září a voní; nalijí je do ampule a položí na můj oltář." # todo: NEW TRANSLATION
 pam_holy_myron.0100.desc_robbed: "Na cestě se mnoho ztratilo a směs je řidší, než jsem doufal — posvěcení však napraví, co cesta znehodnotila, a ampule přesto spočine na mém oltáři." # todo: NEW TRANSLATION
 pam_holy_myron.0100.a: "Řetězec požehnání zůstává nepřerušený." # todo: NEW TRANSLATION
 pam_holy_myron.0200.t: "Poslední pomazání" # todo: NEW TRANSLATION
 pam_holy_myron.0200.desc: "Truchlící ustoupí, když přicházím k márám s artefaktem [pam_holy_myron_artifact.GetName]. Pod zraky shromážděného dvora by kříž ze svatého křižma na čele poslal [deceased.GetTitledFirstName] na trůn [ROOT.Char.GetFaith.HighGodName] jako jednoho z pomazaných — pocta, kterou by všichni přítomní spatřili a znovu vyprávěli. Ale každá kapka, kterou vydám na mrtvé, je kapkou, kterou živí nikdy nespatří." # todo: NEW TRANSLATION
 pam_holy_myron.0200.a: "Ať [deceased.GetFirstNameNoTooltip] odejde pomazán." # todo: NEW TRANSLATION
 pam_holy_myron.0200.a.saint_tt: "Na #V [deceased.GetFirstNameNoTooltip]#! se bude při zvažování jeho svatořečení hledět příznivěji" # todo: NEW TRANSLATION
 pam_holy_myron.0200.b: "Křižmo je pro živé." # todo: NEW TRANSLATION
 pam_holy_myron.0200.b.tt: "Ušetříte posvátné křižmo pro ty, kterým může ještě požehnat" # todo: NEW TRANSLATION
 pam_holy_myron_spend_tt: "Spotřebuje se jedna dávka z vaší ampule svatého myra" # todo: NEW TRANSLATION
 pam_holy_myron_spend_last_tt: "Spotřebuje se #N poslední#! dávka z vaší ampule svatého myra — prázdná nádoba bude #N ztracena#!" # todo: NEW TRANSLATION
 pam_holy_myron_vessel_spent_toast: "Ampule je prázdná" # todo: NEW TRANSLATION
 pam_holy_myron_vessel_spent_tt: "Po vyprázdnění poslední dávky křižma se nádoba odloží" # todo: NEW TRANSLATION
 pam_holy_myron_coronation_option: "Ať tuto korunu zpečetí svaté myro." # todo: NEW TRANSLATION
 pam_holy_myron_coronation_option.flavor: "Spotřebovat dávku posvátného křižma při vlastním pomazání." # todo: NEW TRANSLATION
 pam_chrismated_regalia_desc: "[pam_regnal_artifact.GetDesc]\n\nPři korunovaci se ho dotklo svaté myro a dodnes nese jeho požehnání." # todo: NEW TRANSLATION
 pam_holy_myron_coronation_memory: "byl pomazán svatým myrem" # todo: NEW TRANSLATION
 pam_holy_myron_coronation_memory_desc: "Při mé korunovaci mě [anointer.GetTitledFirstName] pomazal samotným posvátným křižmem." # todo: NEW TRANSLATION
