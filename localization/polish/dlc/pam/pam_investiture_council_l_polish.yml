l_polish:
 activity_investiture_council: "Investiturní koncil"
 activity_investiture_council_desc: "Koncil svolaný na konci fáze [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName], který má jednou provždy rozhodnout, komu náleží právo jmenovat duchovní do jejich úřadů: církvi, nebo koruně."
 activity_investiture_council_province_desc: "Uspořádej zde investiturní koncil."
 activity_investiture_council_host_desc: "Svolej investiturní koncil, který rozhodne o jmenování duchovních."
 activity_investiture_council_guest_desc: "Zúčastni se investiturního koncilu a svým hlasem ovlivni rozhodnutí o jmenování duchovních."
 TRAVEL_NAME_FOR_activity_investiture_council: "[Character.Custom('CZ_FirstNamePossessiveNoTooltip_F')|U] cesta na investiturní koncil"
 pam_investiture_council_summons_clergy_value: "Povolání na investiturní koncil"
 pam_investiture_council_start_log_title: "Investiturní koncil zahajuje jednání"
 pam_investiture_council_start_log: "[CHARACTER.GetTitledFirstName|U] [Select_CString(CHARACTER.IsFemale,'zahájila','zahájil')] jednání koncilu, který má rozhodnout o jmenování duchovních."
 pam_investiture_council_concluded_spiritual_log_title: "Církev vítězí"
 pam_investiture_council_concluded_spiritual_log: "[CHARACTER.GetTitledFirstName|U] [Select_CString(CHARACTER.IsFemale,'vyhlásila','vyhlásil')] rozhodnutí koncilu: duchovní smí jmenovat výhradně církev a žádný světský panovník je nemůže sesadit."
 pam_investiture_council_concluded_temporal_log_title: "Koruna vítězí"
 pam_investiture_council_concluded_temporal_log: "[CHARACTER.GetTitledFirstName|U] [Select_CString(CHARACTER.IsFemale,'vyhlásila','vyhlásil')] rozhodnutí koncilu: duchovní jmenuje církev, ale světští páni si ponechávají právo sesadit preláty, kteří je zklamou."
 pam_investiture_council_conclusion.intro: "Investiturní koncil dospěl ke svému závěru."
 pam_investiture_council_conclusion.spiritual: "Shromáždění církevní otcové potvrdili výhradní právo církve jmenovat duchovní do jejich úřadů a postavili je mimo dosah světských korun. Jakmile je prelát vysvěcen, zastává svůj úřad doživotně.\n\nVleklý [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] je u konce. Církev z něj vychází posílena a bez prodlení obrací svou pozornost k vlastní vnitřní reformě."
 pam_investiture_council_conclusion.temporal: "Shromáždění církevní otcové ponechali jmenování duchovních v rukou církve, ale světským pánům zachovali právo sesadit preláty, kteří je zklamou.\n\nVleklý [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] je u konce, avšak autorita církve byla oslabena a její jednota zůstává křehká."
 activity_window_character_prelate_guest_arrived: "[Select_CString(Character.IsFemale,'Prelátka','Prelát')|U]\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_secular_guest_arrived: "[Concept('activity_guest_short','Host')|EU]\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_conclusion_church_rep: "[Select_CString(Character.IsFemale,'Konzervativka','Konzervativec')|U]\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_conclusion_crown_rep: "[Select_CString(Character.IsFemale,'Novátorka','Novátor')|U]\n[Character.GetShortUINameNoTooltip|U]"
 pam_investiture_resolution_spiritual_tt: "Dosavadní [Concept('doctrine','doktrína')|E] jmenování duchovenstva „[GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName]“ byla nahrazena doktrínou „[GetDoctrineType('doctrine_clerical_succession_spiritual_fixed_appointment').GetBaseName]“"
 pam_investiture_resolution_temporal_tt: "Dosavadní [Concept('doctrine','doktrína')|E] jmenování duchovenstva „[GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName]“ byla nahrazena doktrínou „[GetDoctrineType('doctrine_clerical_succession_spiritual_appointment').GetBaseName]“"
 investiture_council_phase_summons: "Svolání"
 investiture_council_phase_summons_desc: "Zprávy o blížícím se rozhodnutí o jmenování duchovních se šíří a věřící se začínají shromažďovat."
 investiture_council_phase_debate: "Rozprava"
 investiture_council_phase_debate_desc: "Koncil vede rozpravu o tom, komu náleží právo jmenovat duchovní do jejich úřadů, zda církvi, nebo koruně. O výsledku rozhodne hlasování."
 pam_investiture_council_events.0001.t: "Příjezd"
 pam_investiture_council_events.0001.desc: "[arrival_host.GetTitledFirstName|U] mě na prahu srdečně vítá. Za [Select_CString(arrival_host.IsFemale,'jejími','jeho')] zády už panuje čilý ruch mezi preláty a knížaty naší víry. Brzy před shromážděním vyvstane zásadní otázka jmenování duchovních."
 pam_investiture_council_events.0001.a: "Je mi ctí být mezi nimi."
 pam_investiture_council_events.0001.a.tt: "Rozprava začne, jakmile dorazí zbývající hosté."
 pam_investiture_council_events.0002.t: "Hodina zúčtování pro církev"
 pam_investiture_council_events.0002.desc: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|U] dospěl ke svému konci. Nyní musí shromáždění věřící rozhodnout, jak budou duchovní nadále jmenováni do svých úřadů. A já hodlám zajistit, aby autorita církve zůstala zachována."
 pam_investiture_council_events.0002.a: "Tak se také stane."
 pam_investiture_council_events.0003.t: "Rozprava začíná"
 pam_investiture_council_events.0003.desc: "Shromáždění utichá, když koncil otevírá otázku, která postavila církev proti koruně: kdo má právo jmenovat duchovní do jejich úřadů? Každý z přítomných může svým hlasem ovlivnit odpověď."
 pam_investiture_council_events.0003.a: "Nadešel čas."
 pam_investiture_council_events.0032.t: "Správné slovo do správného ucha"
 pam_investiture_council_events.0032.desc: "O výsledku hlasování ještě není rozhodnuto. Pár přesvědčivých slov pronesených do správného ucha by mohlo přivést váhající členy protistrany na mou stranu. Neobratný pokus o přesvědčování by mě však mohl přijít draho."
 pam_investiture_council_events.0032.a: "Získám shromáždění na svou stranu."
 pam_investiture_council_events.0032.b: "Nechám to být."
 pam_investiture_council_events.0033.t: "Váha koruny"
 pam_investiture_council_events.0033.desc: "Na tomto shromáždění duchovních nemám hlasovací právo, ale světský pán nikdy nemá nedostatek prostředků. Měšec plný zlata dokáže obměkčit svědomí a přesvědčivé argumenty mohou získat nerozhodnuté. Svým vlivem mohu podpořit církev nebo korunu. Anebo mohu mlčet."
 pam_investiture_council_events.0033.a: "Pokusím se podplatit hlasující ve prospěch církve."
 pam_investiture_council_events.0033.b: "Pokusím se přesvědčit hlasující, aby podpořili církev."
 pam_investiture_council_events.0033.c: "Pokusím se podplatit hlasující ve prospěch koruny."
 pam_investiture_council_events.0033.d: "Pokusím se přesvědčit hlasující, aby podpořili korunu."
 pam_investiture_council_events.0033.e: "Nebudu se vměšovat."
 pam_investiture_persuade_toast_title: "Odezva shromáždění"
 pam_investiture_persuade_toast_swayed_tt: "Podařilo se ti získat #P [investiture_persuader.MakeScope.Var('investiture_swayed_count').GetValue|0]#! hlasujících."
 pam_investiture_persuade_toast_backfired_tt: "Tvůj přešlap přiměl #N [investiture_persuader.MakeScope.Var('investiture_swayed_count').GetValue|0]#! hlasujících přiklonit se k protistraně."
 pam_investiture_persuade_target_spiritual_tt: "Stále zbývají hlasující, které lze přesvědčit, aby podpořili církev"
 pam_investiture_persuade_target_temporal_tt: "Stále zbývají hlasující, které lze přesvědčit, aby podpořili korunu"
 pam_investiture_persuade_tt_great_innovator: "Přesvědčíš až #P 10#! hlasujících, aby podpořili církev."
 pam_investiture_persuade_tt_great_conservative: "Přesvědčíš až #P 10#! hlasujících, aby podpořili korunu."
 pam_investiture_persuade_tt_good_innovator: "Přesvědčíš až #P 5#! hlasujících, aby podpořili církev."
 pam_investiture_persuade_tt_good_conservative: "Přesvědčíš až #P 5#! hlasujících, aby podpořili korunu."
 pam_investiture_persuade_tt_modest_innovator: "Přesvědčíš až #P 3#! hlasující, aby podpořili církev."
 pam_investiture_persuade_tt_modest_conservative: "Přesvědčíš až #P 3#! hlasující, aby podpořili korunu."
 pam_investiture_persuade_tt_backfire_innovator: "Neobratný pokus přiměje #N 5#! hlasujících podpořit církev."
 pam_investiture_persuade_tt_backfire_conservative: "Neobratný pokus přiměje #N 5#! hlasujících podpořit korunu."
 pam_investiture_council_events.0004.t: "Koncil tě povolává"
 pam_investiture_council_events.0004.desc: "Přicházejí zprávy, že se schází investiturní koncil, který má rozhodnout o jmenování duchovních. Já se však nacházím několik dní jízdy od místa jednání. Mohu všeho nechat a vyrazit tryskem, abych se k rozhodování připojil[Select_CString(ROOT.Char.IsFemale,'a','')], nebo přenechat rozhodnutí prelátům a zůstat stranou."
 pam_investiture_council_events.0004.a: "Nechám všeho a vyrazím tryskem na koncil."
 pam_investiture_council_events.0004.b: "Ať rozhodnou beze mě."
 pam_investiture_council_haste_modifier: "Spěch na investiturní koncil"
 pam_investiture_council_haste_modifier_desc: "Tento [Concept('ruler','vládce')|E] odkládá všechny ostatní záležitosti, aby se stihl zúčastnit investiturního koncilu, který má rozhodnout o jmenování [Concept('clergy','duchovenstva')|E]."
 pam_investiture_council_events.0010.t: "Právo církve"
 pam_investiture_council_events.0010.desc: "Předkládám koncilu zásadní otázku: právo jmenovat duchovní do jejich úřadů náleží církvi a žádná světská koruna nesmí zvrátit to, co církev posvětila. Nechť shromáždění promluví a svými hlasy rozhodne."
 pam_investiture_council_events.0010.a: "Budu hájit autoritu církve."
 pam_investiture_council_events.0031.t: "Na čí straně stojíš?"
 pam_investiture_council_events.0031.desc: "Hlava víry požaduje, aby právo jmenovat duchovní náleželo výhradně církvi a žádná světská koruna nemohla takové jmenování zrušit. Světští páni si naproti tomu chtějí ponechat právo sesadit preláty, kteří je zklamou. Koncil nyní čeká na tvůj hlas."
 pam_investiture_council_events.0031.a: "Podpořím církev: duchovní jmenuje církev a jejich úřady jsou doživotní."
 pam_investiture_council_events.0031.b: "Podpořím korunu: duchovní jmenuje církev, ale jejich páni je mohou odvolat."
 pam_investiture_council_events.0060.opening: "Nejsvětější otče,"
 pam_investiture_council_events.0060.desc.spiritual: "Koncil dospěl k závěru, a jelikož jste nebyl mezi námi, bez prodlení Vám zaznamenávám jeho výsledek. Shromáždění církevní otcové potvrdili výhradní právo církve jmenovat duchovní do jejich úřadů a postavili je mimo dosah světských korun. Ti, které církev vysvětí, budou svůj úřad zastávat doživotně. Tím končí [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l]."
 pam_investiture_council_events.0060.desc.temporal: "Koncil dospěl k závěru, a jelikož jste nebyl mezi námi, bez prodlení Vám zaznamenávám jeho výsledek. S těžkým srdcem Vám musím oznámit, že shromáždění církevní otcové sice ponechali jmenování duchovních v našich rukou, ale světským pánům přiznali právo sesadit každého preláta, který je zklame. Tím končí [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l]."
 pam_investiture_council_events.0060.a: "Přečíst usnesení."
 pam_investiture_council_events.0061.opening: "[Select_CString(ROOT.Char.IsFemale,'Má paní','Můj pane')],"
 pam_investiture_council_events.0061.desc.spiritual: "Do Vaší kaple dorazily zprávy z velkého koncilu. Shromáždění církevní otcové potvrdili výhradní právo církve jmenovat duchovní, a ty, které dosadí do úřadů, již nemáte pravomoc sesadit. Vleklý [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] je u konce a biskupská berla si uchovala to, po čem koruna tolik toužila."
 pam_investiture_council_events.0061.desc.temporal: "Do Vaší kaple dorazily zprávy z velkého koncilu. Shromáždění církevní otcové ponechali jmenování duchovních v rukou církve, ale zachovali Vám právo sesadit kteréhokoli preláta, jenž Vás zklame. Vleklý [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] je u konce a koruna zvítězila nad biskupskou berlou."
 pam_investiture_council_events.0061.a: "Tím je tedy rozhodnuto."
 pam_investiture_council_events.0050.t: "Svolání koncilu"
 pam_investiture_council_events.0050.desc.named: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|U] se chýlí ke konci a koncil rozhodne o jmenování duchovních.\n\n[investiture_nominee_host.GetTitledFirstName|U] se [Select_CString(investiture_nominee_host.IsFemale,'ujímá','ujímá')] úkolu koncil uspořádat. Jako hlava víry se máš jednání zúčastnit a vyjádřit svůj názor na rozhodnutí. O výsledku však budeš [Select_CString(ROOT.Char.IsFemale,'informována','informován')] i v případě, že se nezúčastníš."
 pam_investiture_council_events.0050.desc: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|U] se chýlí ke konci a koncil musí rozhodnout o jmenování duchovních. Jelikož jej nebudeš pořádat osobně, ujme se tohoto úkolu místo tebe některý z vysoce postavených arcibiskupů tvé víry. Stále se však můžeš jednání zúčastnit a přispět svým hlasem."
 pam_investiture_council_events.0050.a: "Budiž."
 pam_investiture_crisis_lapsed_toast: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetNameNoTooltip|U] končí"
 pam_investiture_crisis_lapsed_tt: "Protože nebyl svolán žádný koncil, [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] končí ve prospěch církve. Duchovní budou nadále jmenováni výhradně církví a své úřady budou zastávat doživotně."
