l_polish:
 activity_investiture_council: "Rada o investituře" # todo: NEW TRANSLATION
 activity_investiture_council_desc: "Rada svolaná na konci [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName], která má jednou provždy rozhodnout, kdo bude dosazovat duchovní: církev, nebo koruna." # todo: NEW TRANSLATION
 activity_investiture_council_province_desc: "Uspořádejte zde radu o investituře." # todo: NEW TRANSLATION
 activity_investiture_council_host_desc: "Svolejte radu o investituře, která rozhodne o dosazování duchovních." # todo: NEW TRANSLATION
 activity_investiture_council_guest_desc: "Zúčastněte se rady o investituře a přispějte svým hlasem k rozhodnutí o dosazování duchovních." # todo: NEW TRANSLATION
 TRAVEL_NAME_FOR_activity_investiture_council: "[Character.GetFirstNamePossessiveNoTooltip] cesta na radu o investituře" # todo: NEW TRANSLATION
 pam_investiture_council_summons_clergy_value: "Povolán na radu o investituře" # todo: NEW TRANSLATION
 pam_investiture_council_start_log_title: "Rada o investituře zahajuje jednání" # todo: NEW TRANSLATION
 pam_investiture_council_start_log: "[CHARACTER.GetTitledFirstName] zahájil jednání rady, která má rozhodnout o dosazování duchovních." # todo: NEW TRANSLATION
 pam_investiture_council_concluded_spiritual_log_title: "Církev vítězí" # todo: NEW TRANSLATION
 pam_investiture_council_concluded_spiritual_log: "[CHARACTER.GetTitledFirstName] vyhlásil rozhodnutí rady: duchovní dosazuje výhradně církev a žádná koruna je nemůže sesadit." # todo: NEW TRANSLATION
 pam_investiture_council_concluded_temporal_log_title: "Koruna vítězí" # todo: NEW TRANSLATION
 pam_investiture_council_concluded_temporal_log: "[CHARACTER.GetTitledFirstName] vyhlásil rozhodnutí rady: duchovní dosazuje církev, ale světský pán může stále sesadit preláta, který ho zklame." # todo: NEW TRANSLATION
 pam_investiture_council_conclusion.intro: "Rada o investituře dospěla k závěru." # todo: NEW TRANSLATION
 pam_investiture_council_conclusion.spiritual: "Shromáždění otcové potvrdili výhradní právo církve dosazovat duchovní a učinili je nedotknutelným pro jakoukoli korunu: jakmile je prelát vysvěcen, zastává svůj úřad až do smrti.\n\nDlouhá [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] skončila; církev z ní vychází jako vítěz a ihned se obrací k reformě sebe samé." # todo: NEW TRANSLATION
 pam_investiture_council_conclusion.temporal: "Shromáždění otcové ponechali dosazování duchovních církvi, světským pánům však ponechali právo sesadit kteréhokoli preláta, který je zklame. Dlouhá [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] skončila, autorita církve je však oslabena a její jednota zůstává křehká." # todo: NEW TRANSLATION
 activity_window_character_prelate_guest_arrived: "Prelát\n[Character.GetShortUINameNoTooltip|U]" # todo: NEW TRANSLATION
 activity_window_character_secular_guest_arrived: "[activity_guest_short|E]\n[Character.GetShortUINameNoTooltip|U]" # todo: NEW TRANSLATION
 activity_window_character_conclusion_church_rep: "Konzervativec\n[Character.GetShortUINameNoTooltip|U]" # todo: NEW TRANSLATION
 activity_window_character_conclusion_crown_rep: "Inovátor\n[Character.GetShortUINameNoTooltip|U]" # todo: NEW TRANSLATION
 pam_investiture_resolution_spiritual_tt: "Doktrína dosazování duchovních [doctrine|E] [GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName] byla nahrazena doktrínou [GetDoctrineType('doctrine_clerical_succession_spiritual_fixed_appointment').GetBaseName]" # todo: NEW TRANSLATION
 pam_investiture_resolution_temporal_tt: "Doktrína dosazování duchovních [doctrine|E] [GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName] byla nahrazena doktrínou [GetDoctrineType('doctrine_clerical_succession_spiritual_appointment').GetBaseName]" # todo: NEW TRANSLATION
 investiture_council_phase_summons: "Svolání" # todo: NEW TRANSLATION
 investiture_council_phase_summons_desc: "Věřící se shromažďují, zatímco se šíří zprávy o blížícím se rozhodnutí ohledně dosazování duchovních." # todo: NEW TRANSLATION
 investiture_council_phase_debate: "Rozprava" # todo: NEW TRANSLATION
 investiture_council_phase_debate_desc: "Rada debatuje o tom, kdo bude dosazovat duchovní, zda církev, nebo koruna, a následně o tom hlasuje." # todo: NEW TRANSLATION
 pam_investiture_council_events.0001.t: "Příjezd" # todo: NEW TRANSLATION
 pam_investiture_council_events.0001.desc: "[arrival_host.GetTitledFirstName] mě srdečně vítá u vchodu; za [arrival_host.GetHerHim] se dávají do pohybu preláti a knížata víry. Brzy bude shromáždění rozhodovat o zásadní otázce dosazování duchovních." # todo: NEW TRANSLATION
 pam_investiture_council_events.0001.a: "Je mi ctí být mezi nimi." # todo: NEW TRANSLATION
 pam_investiture_council_events.0001.a.tt: "Rozprava začne, až dorazí zbytek hostů." # todo: NEW TRANSLATION
 pam_investiture_council_events.0002.t: "Rozhodující okamžik pro církev" # todo: NEW TRANSLATION
 pam_investiture_council_events.0002.desc: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] dospěla ke svému konci. Nyní musí shromáždění věřící rozhodnout, jak se budou duchovní napříště dosazovat, a já hodlám prosadit autoritu církve." # todo: NEW TRANSLATION
 pam_investiture_council_events.0002.a: "Tak se tedy stane." # todo: NEW TRANSLATION
 pam_investiture_council_events.0003.t: "Rozprava začíná" # todo: NEW TRANSLATION
 pam_investiture_council_events.0003.desc: "Shromáždění ztichne, když rada zahajuje jednání o otázce, která staví církev proti koruně: kdo z nich bude dosazovat duchovní? Každý přítomný hlas bude mít na výsledek vliv." # todo: NEW TRANSLATION
 pam_investiture_council_events.0003.a: "Nadešel čas." # todo: NEW TRANSLATION
 pam_investiture_council_events.0032.t: "Slovo do správného ucha" # todo: NEW TRANSLATION
 pam_investiture_council_events.0032.desc: "Hlasování ještě není uzavřeno. Přesvědčivé slovo pronesené do správného ucha by mohlo přivést váhavé přívržence protistrany na mou stranu, ale neobratné naléhání by se mohlo prodražit." # todo: NEW TRANSLATION
 pam_investiture_council_events.0032.a: "Získat shromáždění na svou stranu." # todo: NEW TRANSLATION
 pam_investiture_council_events.0032.b: "Nechat to být." # todo: NEW TRANSLATION
 pam_investiture_council_events.0033.t: "Váha koruny" # todo: NEW TRANSLATION
 pam_investiture_council_events.0033.desc: "V tomto shromáždění církevních hodnostářů nemám hlas, ale světskému pánovi nikdy nechybí prostředky. Měšec plný mincí obměkčuje svědomí a dobře podložený argument přesvědčí nerozhodné. Mohu podpořit zájmy církve či koruny, nebo mlčet." # todo: NEW TRANSLATION
 pam_investiture_council_events.0033.a: "Zkusím podplatit hlasující, aby podpořili církev." # todo: NEW TRANSLATION
 pam_investiture_council_events.0033.b: "Zkusím je přesvědčit, aby podpořili církev." # todo: NEW TRANSLATION
 pam_investiture_council_events.0033.c: "Pokusím se úplatky získat podporu pro světskou moc." # todo: NEW TRANSLATION
 pam_investiture_council_events.0033.d: "Pokusím se je přesvědčit, aby podpořili světskou moc." # todo: NEW TRANSLATION
 pam_investiture_council_events.0033.e: "Nebudu se do toho plést." # todo: NEW TRANSLATION
 pam_investiture_persuade_toast_title: "Shromáždění reaguje" # todo: NEW TRANSLATION
 pam_investiture_persuade_toast_swayed_tt: "Přesvědčili jste #P [investiture_persuader.MakeScope.Var('investiture_swayed_count').GetValue|0]#! hlasujících." # todo: NEW TRANSLATION
 pam_investiture_persuade_toast_backfired_tt: "Vaše chyba obrátila #N [investiture_persuader.MakeScope.Var('investiture_swayed_count').GetValue|0]#! hlasujících proti vám." # todo: NEW TRANSLATION
 pam_investiture_persuade_target_spiritual_tt: "Jsou tu hlasující, kteří ještě nepodporují církev a které lze získat na její stranu" # todo: NEW TRANSLATION
 pam_investiture_persuade_target_temporal_tt: "Jsou tu hlasující, kteří ještě nepodporují korunu a které lze získat na její stranu" # todo: NEW TRANSLATION
 pam_investiture_persuade_tt_great_innovator: "Získat až #P 10#! hlasujících pro zájmy církve." # todo: NEW TRANSLATION
 pam_investiture_persuade_tt_great_conservative: "Získat až #P 10#! hlasujících pro zájmy koruny." # todo: NEW TRANSLATION
 pam_investiture_persuade_tt_good_innovator: "Získat až #P 5#! hlasujících pro zájmy církve." # todo: NEW TRANSLATION
 pam_investiture_persuade_tt_good_conservative: "Získat až #P 5#! hlasujících pro zájmy koruny." # todo: NEW TRANSLATION
 pam_investiture_persuade_tt_modest_innovator: "Získat až #P 3#! hlasujících pro zájmy církve." # todo: NEW TRANSLATION
 pam_investiture_persuade_tt_modest_conservative: "Získat až #P 3#! hlasujících pro zájmy koruny." # todo: NEW TRANSLATION
 pam_investiture_persuade_tt_backfire_innovator: "Chyba získá #N 5#! hlasujících na stranu církve." # todo: NEW TRANSLATION
 pam_investiture_persuade_tt_backfire_conservative: "Chyba získá #N 5#! hlasujících na stranu koruny." # todo: NEW TRANSLATION
 pam_investiture_council_events.0004.t: "Rada vás povolává" # todo: NEW TRANSLATION
 pam_investiture_council_events.0004.desc: "Přicházejí zprávy, že se schází rada o investituře, aby rozhodla o dosazování duchovních, a já jsem od ní vzdálen mnoho dní cesty. Mohu všeho nechat a rychle se tam vydat, abych přispěl svým hlasem, nebo ponechat preláty, ať rozhodnou beze mě." # todo: NEW TRANSLATION
 pam_investiture_council_events.0004.a: "Všeho nechat a vyrazit na radu." # todo: NEW TRANSLATION
 pam_investiture_council_events.0004.b: "Nechat je rozhodnout beze mě." # todo: NEW TRANSLATION
 pam_investiture_council_haste_modifier: "Spěchá na radu" # todo: NEW TRANSLATION
 pam_investiture_council_haste_modifier_desc: "Tento [ruler|E] opustil všechny ostatní záležitosti, aby se zúčastnil rady o investituře před jejím rozhodnutím o dosazování [clergy|E]." # todo: NEW TRANSLATION
 pam_investiture_council_events.0010.t: "Právo církve" # todo: NEW TRANSLATION
 pam_investiture_council_events.0010.desc: "Předkládám radě tuto záležitost: právo dosazovat duchovní náleží církvi a žádná koruna nemůže zvrátit to, co ona vysvětila. Nechť se shromáždění vyjádří a rozhodnou jeho hlasy." # todo: NEW TRANSLATION
 pam_investiture_council_events.0010.a: "Zastávat autoritu církve." # todo: NEW TRANSLATION
 pam_investiture_council_events.0031.t: "Na čí straně stojíte?" # todo: NEW TRANSLATION
 pam_investiture_council_events.0031.desc: "Hlava víry požaduje, aby duchovní dosazovala výhradně církev a žádná koruna to nemohla zvrátit. Světští páni si chtějí ponechat právo sesadit preláta, který je zklame. Rada čeká na váš hlas." # todo: NEW TRANSLATION
 pam_investiture_council_events.0031.a: "Podpořit církev: duchovní dosazuje církev a jejich úřad je doživotní." # todo: NEW TRANSLATION
 pam_investiture_council_events.0031.b: "Podpořit koruny: duchovní dosazuje církev, ale jejich páni je mohou sesadit." # todo: NEW TRANSLATION
 pam_investiture_council_events.0060.opening: "Nejsvětější Otče," # todo: NEW TRANSLATION
 pam_investiture_council_events.0060.desc.spiritual: "Rada skončila, a protože jste nebyl mezi námi, ihned jsem její výsledek zaznamenal na pergamen. Shromáždění otcové potvrdili výhradní právo církve dosazovat duchovní a učinili je nedotknutelným pro jakoukoli korunu: ti, které církev vysvětí, zastávají svůj úřad až do smrti. [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] skončila." # todo: NEW TRANSLATION
 pam_investiture_council_events.0060.desc.temporal: "Rada skončila, a protože jste nebyl mezi námi, ihned jsem její výsledek zaznamenal na pergamen. S lítostí píšu, že shromáždění otcové sice ponechali dosazování v našich rukou, ale dovolili světským pánům sesadit každého preláta, který je zklame. [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] skončila." # todo: NEW TRANSLATION
 pam_investiture_council_events.0060.a: "Přečíst si výnos." # todo: NEW TRANSLATION
 pam_investiture_council_events.0061.opening: "Můj pane," # todo: NEW TRANSLATION
 pam_investiture_council_events.0061.desc.spiritual: "Z velké rady dorazila zpráva do vaší kaple. Shromáždění otcové potvrdili výhradní právo církve dosazovat duchovní a ty, které jmenuje, už nemůžete sesadit. Dlouhá [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] skončila a berla si ponechala to, po čem toužila koruna." # todo: NEW TRANSLATION
 pam_investiture_council_events.0061.desc.temporal: "Z velké rady dorazila zpráva do vaší kaple. Shromáždění otcové ponechali dosazování duchovních církvi, avšak každého preláta, který vás zklame, stále můžete zbavit úřadu. Dlouhá [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] skončila a koruna zvítězila nad berlou." # todo: NEW TRANSLATION
 pam_investiture_council_events.0061.a: "A je rozhodnuto." # todo: NEW TRANSLATION
 pam_investiture_council_events.0050.t: "Rada zahajuje jednání" # todo: NEW TRANSLATION
 pam_investiture_council_events.0050.desc.named: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] se chýlí ke konci a o dosazování duchovních rozhodne rada.\n\n[investiture_nominee_host.GetTitledFirstName] se ujal pořádání rady. Jako hlava víry se jí máte zúčastnit a vyjádřit svůj názor na rozhodnutí, ale o výsledku budete informován, i pokud nedorazíte." # todo: NEW TRANSLATION
 pam_investiture_council_events.0050.desc: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] se chýlí ke konci a o dosazování duchovních musí rozhodnout rada. Protože ji neuspořádáte sám, ujme se tohoto úkolu váš zástupce, významný arcibiskup vaší víry. Stále se jí můžete zúčastnit a přispět svým hlasem." # todo: NEW TRANSLATION
 pam_investiture_council_events.0050.a: "Dobrá tedy." # todo: NEW TRANSLATION
 pam_investiture_crisis_lapsed_toast: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetNameNoTooltip] končí" # todo: NEW TRANSLATION
 pam_investiture_crisis_lapsed_tt: "Protože nebyla svolána žádná rada, [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] skončí ve prospěch církve: duchovní napříště dosazuje církev a svůj úřad zastávají doživotně." # todo: NEW TRANSLATION
