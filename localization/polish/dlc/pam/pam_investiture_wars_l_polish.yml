l_polish:
 PAM_INVESTITURE_CONFLICT_WAR_CB_NAME: "Konflikt o investituru"
 pam_investiture_conflict_cb: "$PAM_INVESTITURE_CONFLICT_WAR_CB_NAME$"
 pam_investiture_conflict_cb_victory_desc_attacker: "Tvé vítězství přinutí [defender.Custom('CZ_ShortUIName_A')] i spojence bránící se strany přijmout tvé stanovisko k jmenování duchovních."
 pam_investiture_conflict_cb_victory_desc_defender: "[attacker.GetShortUIName|U] tě svým vítězstvím přinutí spolu s tvými spojenci přijmout stanovisko útočící strany k jmenování duchovních."
 pam_investiture_conflict_cb_victory_desc: "[attacker.GetShortUIName|U] [Select_CString(attacker.IsLocalPlayer,'vítězíš','vítězí')] a [Select_CString(attacker.IsLocalPlayer,'nutíš','nutí')] [defender.Custom('CZ_ShortUIName_A')] i spojence bránící se strany přijmout stanovisko útočící strany k jmenování duchovních."
 pam_investiture_conflict_cb_white_peace_desc: "Spor o jmenování duchovních zůstává nevyřešený a žádná ze stran nehodlá ustoupit."
 pam_investiture_conflict_cb_defeat_desc_attacker: "Po své porážce musíš spolu se svými spojenci přijmout stanovisko [defender.Custom('CZ_ShortUIName_G')] k jmenování duchovních."
 pam_investiture_conflict_cb_defeat_desc_defender: "Tvé vítězství přinutí [attacker.Custom('CZ_ShortUIName_A')] i spojence útočící strany přijmout tvé stanovisko k jmenování duchovních."
 pam_investiture_conflict_cb_defeat_desc: "[defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer,'vítězíš','vítězí')] a [Select_CString(defender.IsLocalPlayer,'nutíš','nutí')] [attacker.Custom('CZ_ShortUIName_A')] i spojence útočící strany přijmout stanovisko bránící se strany k jmenování duchovních."
 msg_pam_investiture_conflict_cb_invalidated_message: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|U] skončil, a proto již nelze využít casus belli $PAM_INVESTITURE_CONFLICT_WAR_CB_NAME$."
 pam_investiture_cb_council_pending_tt: "Investiturní koncil dosud #EMP nebyl#! svolán"
 pam_investiture_conflict_forced_stance_toast: "Vynucený ústup"
 pam_investiture_conflict_forced_stance_tt: "Po porážce v konfliktu o investituru musíš na nadcházejícím koncilu přijmout stanovisko vítěze k jmenování duchovních."
