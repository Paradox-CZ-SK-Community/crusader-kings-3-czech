l_polish:
 activity_funeral_monastic: "#P +++ Klášter#!\n" # todo: NEW TRANSLATION
 pam_monastic_funeral.0001.t: "Modlitby bez konce" # todo: NEW TRANSLATION
 pam_monastic_funeral.0001.desc.intro: "Závěrečný chorál doznívá pod klenbami. Obřady za [deceased.GetTitledFirstName] skončily a do domu [abbot.GetPrimaryTitle.GetNameNoTier|l] se vrací klid.\n\n" # todo: NEW TRANSLATION
 pam_monastic_funeral.0001.desc.brothers: "Bratři odcházejí po dvojicích, s kápěmi staženými do tváře, a zanechávají nás v uctivém tichu." # todo: NEW TRANSLATION
 pam_monastic_funeral.0001.desc.sisters: "Sestry odcházejí po dvojicích, se závoji staženými do tváře, a zanechávají nás v uctivém tichu." # todo: NEW TRANSLATION
 pam_monastic_funeral.0001.desc.outro: "\n\n[abbot.GetTitledFirstName] zůstává po mém boku. "Zde je o mrtvé dobře postaráno, [ROOT.Char.Custom('FormOfAddressForLiege')]," říká [abbot.GetSheHe]. "A naše modlitby nemusí skončit u hrobu. [deceased.GetHerHis|U] jméno bude zapsáno v [Glossary( 'our necrology', 'PAM_NECROLOGY_GLOSS' )], dokud tu zůstane alespoň jeden hlas, který je přečte."" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [ROOT.Char.Custom('')]
 pam_monastic_funeral.0001.a: "Modlete se za můj rod, nyní i navždy." # todo: NEW TRANSLATION
 pam_monastic_funeral.0001.b: "Pozvěte poutníky, aby se modlili za duši [deceased.GetFirstNamePossessiveNoTooltip]." # todo: NEW TRANSLATION
 pam_monastic_funeral.0001.c: "Zesnulí jsou v dobré péči. To mi stačí." # todo: NEW TRANSLATION
 PAM_NECROLOGY_GLOSS: "Registr, do něhož klášter zapisoval jména svých zesnulých — bratří, patronů i dobrodinců. Každý den se při kapitule nahlas četla jména těch, na něž ten den připadla řada, a komunita se modlila za jejich duše; jednou zapsané jméno zůstalo v paměti tak dlouho, dokud klášter stál." # todo: NEW TRANSLATION
 pam_monastic_commemoration_modifier: "Trvalá připomínka" # todo: NEW TRANSLATION
 pam_monastic_commemoration_modifier_desc: "Rod tohoto charakteru je zapsán v knize zemřelých mnišského řádu a jeho zesnulí jsou připomínáni v každodenních modlitbách řádu." # todo: NEW TRANSLATION
 pam_monastic_chronicle_modifier: "Místo posledního odpočinku šlechtice" # todo: NEW TRANSLATION
 pam_monastic_chronicle_modifier_desc: "Místo posledního odpočinku šlechtice přitahuje zbožné poutníky, kteří se za něj modlí." # todo: NEW TRANSLATION
