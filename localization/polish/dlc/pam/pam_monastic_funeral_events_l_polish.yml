l_polish:
 activity_funeral_monastic: "#P +++ Klášter#!\n"
 pam_monastic_funeral.0001.t: "Modlitby bez konce"
 pam_monastic_funeral.0001.desc.intro: "Poslední chorál doznívá pod klenbami. Pohřební obřady za [deceased.Custom('CZ_TitledFirstName_A')] jsou u konce a do klášterního domu [abbot.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] se vrací ticho.\n\n"
 pam_monastic_funeral.0001.desc.brothers: "Bratři odcházejí po dvojicích se staženými kápěmi a zanechávají nás v posvátném tichu."
 pam_monastic_funeral.0001.desc.sisters: "Sestry odcházejí po dvojicích se spuštěnými závoji a zanechávají nás v posvátném tichu."
 pam_monastic_funeral.0001.desc.outro: "\n\n[abbot.GetTitledFirstName|U] zůstává po mém boku. „O zesnulé je zde dobře postaráno, [ROOT.Char.Custom('FormOfAddressForLiege')|l],“ pronáší tiše. „A naše modlitby nemusejí umlknout nad hrobem. [Select_CString(deceased.IsFemale,'Její','Jeho')|U] jméno zůstane zapsáno v [Glossary('našem nekrologiu','PAM_NECROLOGY_GLOSS')], dokud zbude alespoň jeden hlas, který je bude předčítat.“"
 pam_monastic_funeral.0001.a: "Modlete se za můj rod, nyní i navěky."
 pam_monastic_funeral.0001.b: "Pozvu poutníky, aby se modlili za duši [deceased.Custom('CZ_FirstNameNoTooltip_G')]."
 pam_monastic_funeral.0001.c: "O zesnulé je dobře postaráno. To mi stačí."
 PAM_NECROLOGY_GLOSS: "Klášterní kniha, do níž se zapisovala jména zemřelých, ať už šlo o řeholní bratry a sestry, patrony či dobrodince kláštera. Každý den se při společném shromáždění předčítala jména těch, jejichž památka na daný den připadala, a řeholníci se modlili za jejich duše. Jakmile bylo něčí jméno do nekrologia zapsáno, uchovávala se jeho památka po celou dobu existence kláštera."
 pam_monastic_commemoration_modifier: "Věčná památka v modlitbách"
 pam_monastic_commemoration_modifier_desc: "Rod této postavy je zapsán v nekrologiu mnišského řádu a jeho zesnulí jsou každodenně připomínáni v řádových modlitbách."
 pam_monastic_chronicle_modifier: "Hrob šlechtice"
 pam_monastic_chronicle_modifier_desc: "Místo posledního odpočinku šlechtice přitahuje zbožné poutníky, kteří se zde modlí za její duši."
