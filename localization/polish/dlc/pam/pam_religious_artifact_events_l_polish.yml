l_polish:
 pam_religious_artifact_events.0001.t: "Posvátné poslání"
 pam_religious_artifact_events.0001.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ pronese s úsměvem [inspiration_owner.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('inspiration_owner'))|l], při vstupu do komnaty. „Zjevilo se mi to ve snu!“\n\n„Představ si nádherné umělecké dílo, pečlivě zhotovené a osázené těmi nejvzácnějšími drahokamy! [ROOT.Char.GetFaith.HighGodName|U] bude jeho jedinou inspirací. Jen [ROOT.Char.GetFaith.HighGodName] si zaslouží takovou poctu! Poskytni mi potřebné prostředky a vrátím se s nejkrásnějším artefaktem, jaký si [ROOT.Char.GetTitleAsNameNoTooltip|l] vůbec dokáže představit!“\n\nTo je odvážný slib, ale jak často se člověku dostane vidění, jaké sesílá [ROOT.Char.GetFaith.HighGodName]?"
 pam_religious_artifact_events.0001.aa: "Zdá se, že sníš hlavně o tom, jak mi vyprázdnit měšec!"
 pam_religious_artifact_events.0001.a: "Má zbožnost nesmí znát hranic!"
 pam_religious_artifact_events.0001.b: "[ROOT.Char.GetFaith.HighGodName|U] nepotřebuje žádné cetky."
 pam_religious_artifact_events.0002.desc: "Do hradní kaple si mě [Select_CString(inspiration_owner.IsFemale,'pozvala','pozval')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('inspiration_owner'))|l] [inspiration_owner.GetFirstName]. Důvod je mi okamžitě jasný, když mi s hrdostí představuje dílo, na jehož dokončení už tak dlouho čekám.\n\n[newly_created_artifact.GetDesc|U]"
 pam_religious_artifact_events.0002.a: "Výborná práce, [inspiration_owner.GetFirstNameNoTooltip]!"
 create_artifact_religious_artifact_tooltip: "[inspiration_owner.GetShortUIName|U] [Select_CString(inspiration_owner.IsFemale,'vytvořila','vytvořil')] artefakt „[newly_created_artifact.GetName]“ [SCOPE.Custom('ArtifactQuality')|l] řemeslného zpracování"
