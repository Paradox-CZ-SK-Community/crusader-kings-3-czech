 pam_religious_artifact_events.0001.desc: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]," můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('inspiration_owner'))] [inspiration_owner.GetFirstName] vstoupí s úsměvem do komnaty. "Zjevil se mi ve snu!"\n\n"Nádherné umělecké dílo, pečlivě vytvarované z těch nejvzácnějších drahokamů a zasvěcené [ROOT.Char.GetFaith.HighGodName|U] — a jedině [ROOT.Char.GetFaith.HighGodName|U]. Poskytněte mi potřebné prostředky a vrátím se s tím nejkrásnějším artefaktem, jaký si [ROOT.Char.GetTitleAsNameNoTooltip] dokáže představit!"\n\nJe to smělý slib, ale jak často je člověku dopřáno spatřit vidění od [ROOT.Char.GetFaith.HighGodName|U]?" # todo: NEW TRANSLATION
 pam_religious_artifact_events.0001.aa: "Zdá se, že sníš o tom, jak mi uvolnit měšec!" # todo: NEW TRANSLATION
 pam_religious_artifact_events.0001.a: "Mé zbožnosti nesmí být kladeny meze!" # todo: NEW TRANSLATION
