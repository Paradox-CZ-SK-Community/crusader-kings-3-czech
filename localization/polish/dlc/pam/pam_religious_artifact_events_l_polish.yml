 pam_religious_artifact_events.0002.desc: "Můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('inspiration_owner'))] [inspiration_owner.GetFirstName] mě pozval do zámecké kaple. Důvod se okamžitě vyjasní, když mi [inspiration_owner.GetSheHe] hrdě předloží mé dlouho očekávané dílo.\n\n[newly_created_artifact.GetDesc]" # todo: NEW TRANSLATION
