l_polish:
 doctrine_parameter_tenet_ritual_celebrations_praise_the_gods: "Zpřístupní [Concept('intent','záměr')|E] $praise_the_gods_intent$ pro [Concept('activities','aktivitu')|E] [GetActivityType('activity_feast').GetName]"
 praise_the_gods_intent: "Uctít božství"
 praise_the_gods_intent_desc: "Proměň společnou oslavu v bohoslužbu a během hostiny hledej náboženské poznání, duchovní porozumění i sounáležitost s ostatními."
 praise_the_gods_intent_not_valid_desc: "Už se osobně nehlásíš k [Concept('tenet','zásadě')|E] „[GetTenetType('tenet_ritual_celebrations').GetName(GetPlayer.GetRite)]“"
 pam_ritual_celebrations_events.0001.t: "Hostina plná zjevení"
 pam_ritual_celebrations_events.0001.desc: "Mísy se vyprazdňují a poháry se znovu plní. Kdosi pozvedne číši a zvolá: „Nechť [ROOT.Char.GetFaith.WealthGodName] přijme náš přípitek!“ Jeden přípitek střídá druhý a zanedlouho se síní rozléhají modlitby, posvátné příběhy i vášnivé teologické rozpravy.\n\nUprostřed hřejivého veselí se zdá, že hlubší poznání máme téměř na dosah ruky. Ať už díky družnému společenství ostatních, nebo v tichém rozjímání při modlitbě."
 pam_ritual_celebrations_events.0001.a: "Nechť se veselí promění v bohoslužbu."
 pam_ritual_celebrations_events.0001.b: "Uchýlím se do ústraní k modlitbě a rozjímání."
 pam_praise_the_gods_revelation_outcome_tt: "Z ruchu oslav vyvstane posvátná pravda"
 pam_praise_the_gods_belief_outcome_tt: "Dávno zapomenuté učení otevře novou cestu víry"
 pam_praise_the_gods_legend_outcome_tt: "Posvátné příběhy dnešního večera dají vzniknout legendě, kterou si budou vyprávět další generace"
 pam_praise_the_gods_clergy_outcome_tt: "Společná chvála tě sblíží s jedním z členů [Concept('clergy','duchovenstva')|E] u tvého stolu"
 pam_praise_the_gods_scholar_outcome_tt: "Večerní rozprava v tobě probudí trvalou touhu po náboženském poznání"
 pam_praise_the_gods_scholar_xp_outcome_tt: "Každá modlitba a každé podobenství prohloubí tvé náboženské znalosti"
 pam_praise_the_gods_revelation_toast: "Zjevení uprostřed veselí"
 pam_praise_the_gods_belief_toast: "Teologické prozření"
 pam_praise_the_gods_legend_toast: "Zrod posvátného příběhu"
 pam_praise_the_gods_clergy_toast: "Spojeni chválou, kterou přijímá [ROOT.Char.GetFaith.WealthGodName]"
 pam_praise_the_gods_scholar_toast: "Moudrost nalezená na hostině"
 pam_praise_the_gods_scholar_xp_toast: "Prohloubené náboženské znalosti"
 pam_praise_the_gods_clergy_bond_opinion: "Sblížení při náboženské slavnosti"
 pam_praise_the_gods_log_title: "Uctění božství"
 pam_praise_the_gods_log: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer,'jsi ','')][Select_CString(CHARACTER.IsFemale,'hledala','hledal')] duchovní poznání v modlitbách, příbězích a rozpravách během hostiny"
 pam_praise_the_gods_quiet_log_title: "Modlitba v tichém rozjímání"
 pam_praise_the_gods_quiet_log: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer,'jsi ','')][Select_CString(CHARACTER.IsFemale,'opustila','opustil')] bujaré veselí, aby v tiché modlitbě nalezl pokoj duše"
