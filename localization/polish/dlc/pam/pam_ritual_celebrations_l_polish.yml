 pam_praise_the_gods_clergy_outcome_tt: "Společné chvály vás sblíží s jedním z [clergy|E] u vašeho stolu" # todo: NEW TRANSLATION
 pam_praise_the_gods_scholar_outcome_tt: "Večerní debata ve vás probudí neutuchající touhu po posvátném vědění" # todo: NEW TRANSLATION
 pam_praise_the_gods_scholar_xp_outcome_tt: "Každá modlitba a podobenství prohlubují vaše znalosti posvátného učení" # todo: NEW TRANSLATION
