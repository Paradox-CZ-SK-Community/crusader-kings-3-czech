 pam_ritual_celebrations_events.0001.desc: "Mísy se vyprazdňují a poháry znovu plní, zatímco jeden přípitek na [ROOT.Char.GetFaith.WealthGodName] inspiruje další. Záhy se síní rozléhají modlitby, posvátné příběhy a zanícené teologické debaty.\n\nUprostřed vřelé oslavy se zdá, že pochopení je téměř na dosah — ať už díky družnému veselí, nebo tiché modlitbě." # todo: NEW TRANSLATION
 pam_ritual_celebrations_events.0001.a: "Ať se veselí promění v bohoslužbu." # todo: NEW TRANSLATION
 pam_ritual_celebrations_events.0001.b: "Odejdu do ústraní a budu se v tichém rozjímání modlit." # todo: NEW TRANSLATION
