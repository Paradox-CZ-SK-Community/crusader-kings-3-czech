 pam_saint_relic_finger_desc: "Nádherný relikviář uchovávající svatý prst pocházející z požehnaných ostatků [relic_creator_saint.Custom('CZ_ShortUINameNotMe_G')]."
 pam_saint_relic_tooth_desc: "Nádherný relikviář uchovávající svatý zub pocházející z požehnaných ostatků [relic_creator_saint.Custom('CZ_ShortUINameNotMe_G')]."
