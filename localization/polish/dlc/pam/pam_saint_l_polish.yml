 poi_buried_saint.visit_saint: "Návštěva hrobky světce"
 poi_buried_saint.visit_va: "Návštěva hrobky předků"
 poi_buried_saint.visit_desc: "Návštěva hrobky, kde odpočívá [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|l], tě naplní zbožností."
 poi_buried_saint.preset_visit_desc: "Zastavíš se u hrobky, kde odpočívá [visited_saint.GetShortUIName], a vzdáš úctu památce zesnulého."
 poi_buried_saint.foreign_visit: "Návštěva starobylé hrobky"
 poi_buried_saint.foreign_visit_desc: "Tvá víra sice [visited_saint.Custom('CZ_ShortUIName_A')] neuctívá, ale i u této hrobky se můžeš mnohému přiučit."
 pam_poi_buried_saint_on_visit_preset_relic_tt: "Vzdej úctu a získej menší množství [piety_i|E][Concept('piety','zbožnosti')|E]. Navíc můžeš získat svatou [Concept('artifact','relikvii')|E] za #EMP nižší cenu#! než na dálku."
 pam_poi_buried_saint_on_visit_relic_tt: "Vzdej úctu [visited_saint.Custom('CZ_ShortUIName_D')] a získej možnost získat svatou [Concept('artifact','relikvii')|E] za #EMP nižší cenu#! než na dálku."
 pam_poi_buried_saint_on_visit_no_relic_tt: "Vzdej úctu [visited_saint.Custom('CZ_ShortUIName_D')], jehož ostatky zde odpočívají a kdo je uctíván jako [visited_saint.Custom('PamSaintOrAncestorNoun')|l]."
 pam_saint_events.0007.t: "U hrobky [visited_saint.Custom('CZ_ShortUINameNoTooltip_G')]"
 pam_saint_events.0007.desc: "Mé putování mě zavedlo k hrobce, v níž odpočívá [visited_saint.GetShortUIName]. Má víra tuto postavu uctívá jako [visited_saint.Custom('PamVeneratedSaintOrAncestor')|l]. Vzduch je prosycen posvátnou atmosférou a kolem hrobky klečí věřící v tiché modlitbě."
 pam_saint_events.0007.a: "Vzdám úctu zesnulému a vydám se dál."
 pam_saint_events.0007.b: "Získejme posvátnou relikvii."
