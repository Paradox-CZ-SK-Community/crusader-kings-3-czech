l_polish:
 pam_canonize_saint_decision: "[GetPlayer.Custom('PamCanonizeVenerateVerb')|U] [GetPlayer.Custom('PamVenerateObjectTitle')]"
 pam_canonize_saint_decision_desc: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonize_saint_decision_desc_saint', 'pam_canonize_saint_decision_desc_va' )]"
 pam_canonize_saint_decision_desc_saint: "Navrhnu jednoho ze svých zesnulých příbuzných ke svatořečení, aby byl uznán za světce, jeho ostatky posvěceny a jeho duše spočinula ve věčném světle."
 pam_canonize_saint_decision_desc_va: "Zajistím, aby se jeden z mých zesnulých příbuzných těšil úctě jako [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|l] a jeho ostatky byly s náležitou úctou [GetPlayer.Custom('PamConsecratedEnshrined')|l]."
 pam_canonize_saint_decision_tooltip: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonize_saint_decision_tooltip_saint', 'pam_canonize_saint_decision_tooltip_va' )]"
 pam_canonize_saint_decision_tooltip_saint: "Povýšit zesnulého člena své [Concept('dynasty','dynastie')|E] ke [Concept('sainthood','svatosti')|E]."
 pam_canonize_saint_decision_tooltip_va: "Uctít zesnulého člena své [Concept('dynasty','dynastie')|E] jako [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|l]."
 pam_canonize_saint_decision_confirm: "Vybrat místo posledního odpočinku"
 pam_canonize_saint_decision_req_candidate: "Dosud neuctívaný #EMP zesnulý#! předek tvé [Concept('dynasty','dynastie')|E], bez [Concept('sinful','hříšných')|E] rysů a alespoň s jedním [Concept('virtuous','ctnostným')|E] rysem"
 pam_canonize_saint_decision_req_site: "[Concept('ecclesiastical_domicile','Církevní statek')|EU] s [Concept('ecclesiastical_domicile_building','katedrálou')|E] ve tvém [Concept('realm','panství')|E], kde lze zesnulého posvětit. Pokud jsou všechna taková místa obsazena, lze využít sousední provincii"
 pam_canonize_saint_decision_req_site_holy_site: "[Concept('holy_site','Svaté místo')|EU] tvé [Concept('faith','víry')|E] ve tvém [Concept('realm','panství')|E], kde lze zesnulého posvětit. Pokud jsou všechna taková místa obsazena, lze využít sousední provincii"
 pam_canonize_saint_decision_canonize_tt: "[GetPlayer.Custom('PamCanonizeVenerateVerb')|U] vybraného zesnulého člena dynastie a zajistit pro jeho ostatky [GetPlayer.Custom('PamConsecratingEnshrining')|l]"
 pam_canonize_saint_decision_choose_1_tt: "Vyber [Concept('ecclesiastical_domicile_building','katedrálu')|E] ve svém [Concept('realm','panství')|E], kde bude zesnulý posvěcen"
 pam_canonize_saint_decision_choose_1_holy_site_tt: "Vyber [Concept('holy_site','svaté místo')|E] své [Concept('faith','víry')|E] ve svém [Concept('realm','panství')|E], kde bude zesnulý posvěcen"
 pam_canonize_saint_petition_sent_tt_saint: "Žádost o uznání [saint_candidate.Custom('CZ_FirstName_G')] za svatého [Concept('canonized','světce')|E] a posvěcení ostatků v [CZProvName(consecration_province,'L')] bude zaslána ke schválení [petition_recipient.Custom('CZ_TitledFirstName_D')]"
 pam_canonize_saint_petition_sent_tt_va: "Žádost, aby [saint_candidate.GetFirstName] [Select_CString(saint_candidate.IsFemale,'byla uctívána','byl uctíván')] jako [saint_candidate.Custom('PamVeneratedSaintOrAncestor')|l] a aby byly ostatky [GetPlayer.Custom('PamConsecratedEnshrined')|l] v [CZProvName(consecration_province,'L')], bude zaslána ke schválení [petition_recipient.Custom('CZ_TitledFirstName_D')]"
 pam_canonize_saint_hof_chance_tt: "Podle počtu ctnostných [Concept('trait','rysů')|E], které má [saint_candidate.GetShortUIName], je přibližně #EMP [saint_candidate.MakeScope.ScriptValue('pam_hof_canonization_accept_chance')|0%]#! pravděpodobnost, že [canonizer.GetFaith.GetReligiousHead.GetTitledFirstName] schválí žádost, aby bylo možné [GetPlayer.Custom('PamCanonizeVenerateVerb')|l] [saint_candidate.Custom('CZ_ShortUIName_A')]"
 pam_canonize_saint_hof_chance_cynical_tt: "S ohledem na počet ctnostných [Concept('trait','rysů')|E], které má [saint_candidate.GetShortUIName], a cynickou povahu [canonizer.GetFaith.GetReligiousHead.Custom('CZ_TitledFirstName_G')] je přibližně #EMP [saint_candidate.MakeScope.ScriptValue('pam_hof_canonization_accept_chance_cynical')|0%]#! pravděpodobnost, že bude schválena žádost, aby bylo možné [GetPlayer.Custom('PamCanonizeVenerateVerb')|l] [saint_candidate.Custom('CZ_ShortUIName_A')]"
 pam_canonize_saint_hof_chance_puppet_tt: "Jelikož [canonizer.GetFaith.GetReligiousHead.GetTitledFirstName] podléhá tvé vůli, žádosti, aby bylo možné [GetPlayer.Custom('PamCanonizeVenerateVerb')|l] [saint_candidate.Custom('CZ_ShortUIName_A')], bude #EMP zaručeně#! vyhověno"
