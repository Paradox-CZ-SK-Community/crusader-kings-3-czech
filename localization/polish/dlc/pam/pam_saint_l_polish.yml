 pam_saint_events.0003.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0003.t_saint', 'pam_saint_events.0003.t_va' )]"
 pam_saint_events.0003.t_saint: "Nový světec"
 pam_saint_events.0003.t_va: "Nový [GetPlayer.Custom('PamSaintOrAncestorTitleNoun')]"
 pam_saint_events.0003.desc_saint: "Je dokonáno. [saint_candidate.GetFirstName] [Select_CString(saint_candidate.IsFemale,'byla přijata mezi světce','byl přijat mezi světce')] a její ostatky byly posvěceny [CZPrepV(consecration_province.GetNameNoTooltip)|l] [CZProvName(consecration_province,'L')]. Kéž [Select_CString(saint_candidate.IsFemale,'její','jeho')] světlo žehná mým souvěrcům po mnoho dalších pokolení. [saint_candidate.GetFaith.GetAdherentNamePluralNoTooltip|U] tak získávají nového přímluvce v nebi."
 pam_saint_events.0003.desc_va: "Je dokonáno. [saint_candidate.GetFirstName] [Select_CString(saint_candidate.IsFemale,'byla zařazena','byl zařazen')] mezi ty, kdo jsou uctíváni jako [saint_candidate.Custom('PamBlessedOnesOrAncestors')|l]. [Select_CString(saint_candidate.IsFemale,'Její','Jeho')] ostatky byly [saint_candidate.Custom('PamConsecratedEnshrined')|l] [CZPrepV(consecration_province.GetNameNoTooltip)|l] [CZProvName(consecration_province,'L')]. Kéž [Select_CString(saint_candidate.IsFemale,'její','jeho')] světlo žehná našemu panství po mnoho dalších pokolení."
 pam_saint_events.0003.a: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0003.a_saint', 'pam_saint_events.0003.a_va' )]"
 pam_saint_events.0003.a_saint: "Deo gratias!"
 pam_saint_events.0003.a_va: "Vzdáváme díky."
 pam_saint_events.0003.a.dynasty_opinion_tt: "Členové tvé [Concept('dynasty','dynastie')|E], kteří vyznávají stejnou [Concept('faith','víru')|E] jako ty, si na tebe na 20 let zlepší [Concept('opinion','mínění')|E] o #P 20#!"
 pam_saint_events.0004.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0004.t_saint', 'pam_saint_events.0004.t_va' )]"
 pam_saint_events.0004.t_saint: "Svatořečení zamítnuto"
 pam_saint_events.0004.t_va: "Uctívání zamítnuto"
 pam_saint_events.0004.desc: "[petition_recipient.GetTitledFirstName|U] [Select_CString(petition_recipient.IsFemale,'zamítla','zamítl')] naši žádost, abychom mohli [GetPlayer.Custom('PamCanonizeVenerateVerb')|l] [saint_candidate.Custom('CZ_FirstName_A')]. [saint_candidate.GetFirstName|U] tak dnes nevstoupí do společenství, které tvoří [GetPlayer.Custom('PamBlessedOnesOrAncestors')|l]."
 pam_saint_events.0004.a: "Budiž."
 pam_saint_events.0005.t: "Relikviář je připraven"
 pam_saint_events.0005.desc: "[CZPrepV(extract_site.GetNameNoTooltip)|U] [CZProvName(extract_site,'L')] se zbožné ruce pouštějí do posvátného díla. Z požehnaných ostatků [relic_saint.Custom('CZ_ShortUIName_G')] má být získána svatá relikvie.\n\nJiž probíhají přípravy na důstojnou oslavu této posvátné události."
 pam_saint_events.0005.a: "Nechť se vše vykoná s náležitou úctou."
 pam_saint_events.0005.a.tt: "Z ostatků [relic_saint.Custom('CZ_ShortUIName_G')] bude brzy [CZPrepV(extract_site.GetNameNoTooltip)|l] [CZProvName(extract_site,'L')] získána svatá [Concept('artifact','relikvie')|E]"
 pam_saint_events.0006.t: "Posvátná relikvie"
 pam_saint_events.0006.desc_relic: "Ostatky [relic_saint.Custom('CZ_FirstName_G')] byly [GetPlayer.Custom('PamConsecratedEnshrined')|l] [CZPrepV(extract_site.GetNameNoTooltip)|l] [CZProvName(extract_site,'L')]. Z těchto posvátných ostatků jsme nyní získali relikvii: #EMP [relic_artifact.GetName]#!. Kéž přináší požehnání věřícím mého panství po mnoho dalších pokolení."
 pam_saint_events.0006.desc: "Ostatky [relic_saint.Custom('CZ_FirstName_G')] byly [GetPlayer.Custom('PamConsecratedEnshrined')|l] [CZPrepV(extract_site.GetNameNoTooltip)|l] [CZProvName(extract_site,'L')]. Z těchto posvátných ostatků byla získána svatá [Concept('artifact','relikvie')|E], která přinese požehnání našemu panství."
 pam_saint_events.0006.a: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0006.a_saint', 'pam_saint_events.0006.a_va' )]"
