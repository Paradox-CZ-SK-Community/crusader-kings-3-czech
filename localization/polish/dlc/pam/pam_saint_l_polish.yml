 pam_extract_relic_decision_desc: "[GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|U] leží [GetPlayer.Custom('PamConsecratedEnshrined')] na území mé říše. S náležitou úctou lze z jeho ostatků získat relikvii, která požehná věřícím." # todo: NEW TRANSLATION
