 pam_choose_consecration_site_decision: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_saint', 'pam_choose_consecration_site_decision_va' )]"
 pam_choose_consecration_site_decision_saint: "Posvětit ostatky světce"
 pam_choose_consecration_site_decision_va: "Posvětit ostatky ([GetPlayer.Custom('PamSaintOrAncestorTitleNoun')])"
 pam_choose_consecration_site_decision_desc: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_desc_saint', 'pam_choose_consecration_site_decision_desc_va' )]"
 pam_choose_consecration_site_decision_desc_saint: "Vyberu ve svém [Concept('realm','panství')|E] [Concept('ecclesiastical_domicile_building','katedrálu')|E], kde posvětím ostatky tohoto svatého [Concept('canonized','světce')|E] a uložím je k poslednímu odpočinku, aby sem přicházeli věřící."
 pam_choose_consecration_site_decision_desc_va: "Vyberu posvátné místo ve svém [Concept('realm','panství')|E], kde budou posvěceny a uloženy k poslednímu odpočinku ostatky zesnulého. [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')|U] zde nalezne spočinutí a bude přitahovat věřící."
 pam_choose_consecration_site_decision_desc_holy_site: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_desc_holy_site_saint', 'pam_choose_consecration_site_decision_desc_holy_site_va' )]"
 pam_choose_consecration_site_decision_desc_holy_site_saint: "Vyberu [Concept('holy_site','svaté místo')|E] své [Concept('faith','víry')|E] ve svém [Concept('realm','panství')|E], kde posvětím ostatky tohoto svatého [Concept('canonized','světce')|E] a uložím je k poslednímu odpočinku, aby sem přicházeli věřící."
 pam_choose_consecration_site_decision_desc_holy_site_va: "Vyberu [Concept('holy_site','svaté místo')|E] své [Concept('faith','víry')|E] ve svém [Concept('realm','panství')|E], kde budou posvěceny a uloženy k poslednímu odpočinku ostatky zesnulého. [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')|U] zde nalezne spočinutí a bude přitahovat věřící."
 pam_choose_consecration_site_decision_tooltip: "Vyber místo, kde [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')|l] spočine a kde budou posvěceny ostatky."
 pam_choose_consecration_site_decision_confirm: "Posvětit"
 pam_choose_consecration_site_decision_select_tt: "Vyber místo, kde [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')|l] nalezne poslední odpočinek a kde budou posvěceny ostatky"
 pam_choose_consecration_site_occupied_tt: "[GetPlayer.Custom('PamSaintOrAncestorNounGeneric')|U]"
 pam_extract_relic_decision: "Získat relikvii"
 pam_extract_relic_decision_desc: "[GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|U] odpočívá v mém panství, kde byly ostatky [GetPlayer.Custom('PamConsecratedEnshrined')|l]. S náležitou úctou z nich lze získat relikvii, která přinese požehnání věřícím."
 pam_extract_relic_decision_tooltip: "Získej relikvii z hrobky, v níž odpočívá [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|l], na území, které ovládáš."
 pam_extract_relic_decision_confirm: "Získat relikvii"
 pam_extract_relic_decision_req_saint: "[GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|U] odpočívá ve tvém [Concept('realm','panství')|E] a z ostatků lze ještě získat relikvii"
 pam_extract_relic_decision_req_saint_count: "Z ostatků [CHARACTER.Custom('CZ_ShortUIName_G')] bylo dosud získáno [CHARACTER.MakeScope.ScriptValue('pam_saint_relics_extracted_value')] z [CHARACTER.MakeScope.ScriptValue('pam_saint_relic_max')] [Concept('artifact','relikvií')|E]"
 pam_extract_relic_decision_extract_tt: "Vytvoř svatou [Concept('artifact','relikvii')|E] z ostatků osoby uctívané jako [GetPlayer.Custom('PamSaintOrAncestorTitleNoun')|l]"
 pam_extract_relic_decision_choose_tt: "Vyber pohřbenou osobu, z jejíchž ostatků lze získat [Concept('artifact','relikvii')|E]. [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')|U] musí být mezi možnými kandidáty"
 pam_extract_relic_decision_item_valid_tt: "Z ostatků lze stále získat svatou [Concept('artifact','relikvii')|E]. [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')|U] tak může zanechat další posvátnou památku."
 pam_saint_events.0001.t: "Žádost vyráží na cestu"
 pam_saint_events.0001.desc: "Vše je připraveno k uctění [saint_candidate.Custom('CZ_FirstName_G')] a [CZPrepV(consecration_province.GetNameNoTooltip)|l] [CZProvName(consecration_province,'L')] již čeká čestné místo pro požehnané ostatky.\n\nNyní už nemám další vývoj ve svých rukou. Žádost putuje k [petition_recipient.Custom('CZ_TitledFirstName_D')] a mně nezbývá než se modlit za příznivé rozhodnutí."
 pam_saint_events.0001.a: "Teď nezbývá než čekat a modlit se."
 pam_saint_events.0001.a.tt_saint: "Žádost o uznání [saint_candidate.Custom('CZ_FirstName_G')] za svatého [Concept('canonized','světce')|E] a posvěcení ostatků [CZPrepV(consecration_province.GetNameNoTooltip)|l] [CZProvName(consecration_province,'L')] byla odeslána ke schválení [petition_recipient.Custom('CZ_TitledFirstName_D')]. Odpověď přijde časem."
 pam_saint_events.0001.a.tt_va: "Žádost, aby [saint_candidate.GetFirstName] [Select_CString(saint_candidate.IsFemale,'byla uctívána','byl uctíván')] jako [saint_candidate.Custom('PamVeneratedSaintOrAncestor')|l] a aby ostatky byly [saint_candidate.Custom('PamConsecratedEnshrined')|l] [CZPrepV(consecration_province.GetNameNoTooltip)|l] [CZProvName(consecration_province,'L')], byla odeslána ke schválení [petition_recipient.Custom('CZ_TitledFirstName_D')]. Odpověď přijde časem."
 pam_saint_events.0002.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0002.t_saint', 'pam_saint_events.0002.t_va' )]"
 pam_saint_events.0002.t_saint: "Žádost o svatořečení"
 pam_saint_events.0002.t_va: "Žádost o uctívání"
 pam_saint_events.0002.desc_saint: "[canonizer.GetTitledFirstName|U] nás žádá, abychom [saint_candidate.Custom('CZ_FirstName_A')] přijali mezi blahoslavené [Concept('canonized','světce')|E] a posvětili ostatky [CZPrepV(consecration_province.GetNameNoTooltip)|l] [CZProvName(consecration_province,'L')]."
 pam_saint_events.0002.desc_va: "[canonizer.GetTitledFirstName|U] nás žádá, abychom [saint_candidate.Custom('CZ_FirstName_A')] přijali mezi uctívané duše, jimž se říká „[saint_candidate.Custom('PamBlessedOnesOrAncestors')]“, a aby ostatky byly [saint_candidate.Custom('PamConsecratedEnshrined')|l] [CZPrepV(consecration_province.GetNameNoTooltip)|l] [CZProvName(consecration_province,'L')]."
 pam_saint_events.0002.desc.traits_1: "\n\nZa života [saint_candidate.GetFirstNameNoTooltip] [Select_CString(saint_candidate.IsFemale,'proslula jako žena','proslul jako muž')] s následující vlastností: [pam_saint_ptrait_1.GetNameNoTooltip(saint_candidate.Self)|l]."
 pam_saint_events.0002.desc.traits_2: "\n\nZa života [saint_candidate.GetFirstNameNoTooltip] [Select_CString(saint_candidate.IsFemale,'proslula jako žena','proslul jako muž')] s následujícími vlastnostmi: [pam_saint_ptrait_1.GetNameNoTooltip(saint_candidate.Self)|l] a [pam_saint_ptrait_2.GetNameNoTooltip(saint_candidate.Self)|l]."
 pam_saint_events.0002.desc.traits_3: "\n\nZa života [saint_candidate.GetFirstNameNoTooltip] [Select_CString(saint_candidate.IsFemale,'proslula jako žena','proslul jako muž')] s následujícími vlastnostmi: [pam_saint_ptrait_1.GetNameNoTooltip(saint_candidate.Self)|l], [pam_saint_ptrait_2.GetNameNoTooltip(saint_candidate.Self)|l] a [pam_saint_ptrait_3.GetNameNoTooltip(saint_candidate.Self)|l]."
 pam_saint_events.0002.desc.virtue_1: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0002.desc.virtue_1_saint', 'pam_saint_events.0002.desc.virtue_1_va' )]"
 pam_saint_events.0002.desc.virtue_1_saint: "Z této duše vyzařuje mihotavé světlo, skromný plamínek. Vždyť ne každý světec musel projít výhní většího ohně.\n\nRozhodnutí je na nás."
 pam_saint_events.0002.desc.virtue_1_va: "Z této duše vyzařuje mihotavé světlo, skromný plamínek. Vždyť ne každá uctívaná duše musela projít výhní většího ohně.\n\nRozhodnutí je na nás."
 pam_saint_events.0002.desc.virtue_2: "Tato duše prokázala nemalé zásluhy a [saint_candidate.GetFaith.HighGodName] je přijímá s potěšením. Je to znamení zjevné, byť ne zcela dokonalé milosti.\n\nRozhodnutí je na nás."
 pam_saint_events.0002.desc.virtue_3: "Tato duše je ztělesněním ctnosti. Jen málokterý smrtelník v sobě tak zjevně nese tolik božského.\n\nRozhodnutí je na nás."
 pam_saint_events.0002.a: "[saint_candidate.GetFirstName|U] si tuto poctu skutečně zaslouží."
 pam_saint_events.0002.a.dynasty_opinion_tt: "[CZFaithAdjSti(canonizer.GetFaith)|U] členové [Concept('dynasty','dynastie')|E] [canonizer.Custom('CZ_TitledFirstName_G')] si na tebe na 20 let zlepší [Concept('opinion','názor')|E] o #P 10#!"
 pam_saint_events.0002.b: "Tuto žádost neschválíme."
 pam_saint_events.0002.b.dynasty_opinion_tt: "[CZFaithAdjSti(canonizer.GetFaith)|U] členové [Concept('dynasty','dynastie')|E] [canonizer.Custom('CZ_TitledFirstName_G')] si na tebe na 20 let zhorší [Concept('opinion','názor')|E] o #N 10#!"
 pam_canonization_approved_petitioner_opinion: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonization_approved_petitioner_opinion_saint', 'pam_canonization_approved_petitioner_opinion_va' )]"
