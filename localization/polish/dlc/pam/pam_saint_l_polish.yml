 pam_saint_events.0001.t: "Žádost byla odeslána" # todo: NEW TRANSLATION
 pam_saint_events.0001.desc: "Proces [saint_candidate.GetFirstName] je připraven a na [consecration_province.GetName] čeká čestné místo pro jeho požehnané ostatky.\n\nNyní už věc není v mých rukou: žádost putuje k [petition_recipient.GetTitledFirstName] a mně nezbývá než se modlit, aby rozhodnutí bylo příznivé." # todo: NEW TRANSLATION
 pam_saint_events.0001.a: "Teď nám nezbývá než čekat a modlit se." # todo: NEW TRANSLATION
 pam_saint_events.0001.a.tt_saint: "Žádost o uznání [saint_candidate.GetFirstName] za svatého [Concept('canonized','Saint')|E], který bude vysvěcen na [consecration_province.GetName], byla odeslána k [petition_recipient.GetTitledFirstName]. Odpověď přijde časem." # todo: NEW TRANSLATION
 pam_saint_events.0001.a.tt_va: "Žádost o uctívání [saint_candidate.GetFirstName] jakožto [saint_candidate.Custom('PamVeneratedSaintOrAncestor')], který bude [saint_candidate.Custom('PamConsecratedEnshrined')] na [consecration_province.GetName], byla odeslána k [petition_recipient.GetTitledFirstName]. Odpověď přijde časem." # todo: NEW TRANSLATION
 pam_saint_events.0002.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0002.t_saint', 'pam_saint_events.0002.t_va' )]" # todo: NEW TRANSLATION
