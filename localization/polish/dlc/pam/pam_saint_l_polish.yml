 pam_saint_relic_hair_desc: "Nádherný relikviář uchovávající posvátný pramen vlasů [relic_creator_saint.Custom('CZ_ShortUINameNotMe_G')]."
 pam_saint_relic_vestment_desc: "Nádherný relikviář uchovávající část roucha, které kdysi [Select_CString(relic_creator_saint.IsFemale,'nosila','nosil')] [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_hand_desc: "Nádherný relikviář uchovávající svatou ruku pocházející z požehnaných ostatků [relic_creator_saint.Custom('CZ_ShortUINameNotMe_G')]."
 pam_saint_relic_arm_desc: "Nádherný relikviář uchovávající posvátnou paži pocházející z požehnaných ostatků [relic_creator_saint.Custom('CZ_ShortUINameNotMe_G')]."
 pam_saint_relic_skull_desc: "Nádherný relikviář uchovávající uctívanou lebku [relic_creator_saint.Custom('CZ_ShortUINameNotMe_G')]."
 pam_saint_relic_blood_desc: "Nádherný relikviář uchovávající lahvičku svaté krve [relic_creator_saint.Custom('CZ_ShortUINameNotMe_G')]."
 pam_saint_relic_heart_desc: "Nádherný relikviář uchovávající svaté srdce [relic_creator_saint.Custom('CZ_ShortUINameNotMe_G')]."
 pam_saint_relic_effigy_desc: "Uctívaná podobizna zhotovená podle podoby [relic_creator_saint.Custom('CZ_ShortUINameNotMe_G')], které věřící vzdávají úctu."
 pam_saint_relic_letter_desc: "Nádherný relikviář uchovávající dopis napsaný rukou [relic_creator_saint.Custom('CZ_ShortUINameNotMe_G')]."
 pam_saint_relic_drawing_desc: "Proslulá kresba, kterou [relic_creator_saint.GetShortUINameNotMe] [Select_CString(relic_creator_saint.IsFemale,'vytvořila','vytvořil')]."
 pam_saint_relic_stationery_desc: "Sada psacích potřeb, které kdysi [relic_creator_saint.GetShortUINameNotMe] [Select_CString(relic_creator_saint.IsFemale,'používala','používal')]. Říká se, že svému držiteli propůjčují stejnou moudrost, jakou oplýval jejich původní vlastník."
 pam_saint_relic_ash_desc: "Nádherný relikviář uchovávající posvátný popel z pohřební hranice [relic_creator_saint.Custom('CZ_ShortUINameNotMe_G')]."
 pam_saint_relic_canopic_jar_desc: "Kanopa obsahující vnitřní orgány [relic_creator_saint.Custom('CZ_ShortUINameNotMe_G')]."
 pam_saint_relic_staff_desc: "Hůl, kterou [relic_creator_saint.GetShortUINameNotMe] [Select_CString(relic_creator_saint.IsFemale,'používala','používal')] při svých poutích."
 pam_saint_relic_water_filter_desc: "Kus látky, který [relic_creator_saint.GetShortUINameNotMe] na svých cestách [Select_CString(relic_creator_saint.IsFemale,'používala','používal')] k filtrování vody."
 pam_saint_relic_bowl_desc: "Miska, kterou [relic_creator_saint.GetShortUINameNotMe] [Select_CString(relic_creator_saint.IsFemale,'používala','používal')] při žebrání o jídlo na svých cestách."
 pam_saint_relic_robe_desc: "Nádherný relikviář uchovávající posvátné roucho [relic_creator_saint.Custom('CZ_ShortUINameNotMe_G')]."
 pam_saint_relic_sword_desc: "Posvátný meč, kterým [relic_creator_saint.GetShortUINameNotMe] [Select_CString(relic_creator_saint.IsFemale,'bojovala','bojoval')]. Říká se, že věřícím, kteří jej nosí, poskytuje božskou ochranu a sílu."
 pam_saint_relic_sarira_desc: "Nádherný relikviář uchovávající šaríru, posvátný tělesný ostatek [relic_creator_saint.Custom('CZ_ShortUINameNotMe_G')]."
 pam_saint_relic_skull_buddhism_desc: "Nádherný relikviář uchovávající šaríru v podobě ušníšy [relic_creator_saint.Custom('CZ_ShortUINameNotMe_G')]."
 pam_saint_relic_finger_buddhism_desc: "Nádherný relikviář uchovávající šaríru v podobě prstu [relic_creator_saint.Custom('CZ_ShortUINameNotMe_G')]."
 pam_saint_relic_tooth_buddhism_desc: "Nádherný relikviář uchovávající šaríru v podobě zubu [relic_creator_saint.Custom('CZ_ShortUINameNotMe_G')]."
 pam_saint_relic_rib_buddhism_desc: "Nádherný relikviář uchovávající šaríru v podobě žebra [relic_creator_saint.Custom('CZ_ShortUINameNotMe_G')]."
 pam_saint_relic_talisman_desc: "Talisman, který [relic_creator_saint.GetShortUINameNotMe] [Select_CString(relic_creator_saint.IsFemale,'nakreslila','nakreslil')]. Údajně dokáže zahánět zlé síly nebo uzdravovat svého držitele."
 pam_saint_relic_pellet_desc: "Lahvička pilulek nesmrtelnosti, které [relic_creator_saint.GetShortUINameNotMe] [Select_CString(relic_creator_saint.IsFemale,'připravila','připravil')]."
 pam_saint_relic_footprint_desc: "Nádherný relikviář uchovávající otisk chodidla [relic_creator_saint.Custom('CZ_ShortUINameNotMe_G')]."
 pam_saint_relic_afarganyu_desc: "Afargánjú, posvátný stojan na oheň, který kdysi patřil [relic_creator_saint.Custom('CZ_ShortUINameNotMe_D')]."
 pam_saint_relic_ring_desc: "Posvátný prsten, který kdysi patřil [relic_creator_saint.Custom('CZ_ShortUINameNotMe_D')]."
 pam_saint_relic_bracelet_desc: "Posvátný náramek, který kdysi patřil [relic_creator_saint.Custom('CZ_ShortUINameNotMe_D')]."
 pam_saint_relic_commentary_desc: "Sbírka komentářů, které [relic_creator_saint.GetShortUINameNotMe] [Select_CString(relic_creator_saint.IsFemale,'sepsala','sepsal')] a v nichž vyložila vlastní chápání spisů [relic_creator_saint.GetFaith.ReligiousText]."
 pam_saint_relic_tzitzit_desc: "Posvátná třáseň z cicit [relic_creator_saint.Custom('CZ_ShortUINamePossessiveNotMy')], svědčící o [Select_CString(relic_creator_saint.IsFemale,'její','jeho')] zbožnosti."
