 pam_saint_events.0002.t_va: "Žádost o uctívání" # todo: NEW TRANSLATION
 pam_saint_events.0002.desc_saint: "[canonizer.GetTitledFirstName] nás žádá, abychom zařadili [saint_candidate.GetFirstName] mezi blahoslavené svaté a vysvětili ho v [consecration_province.GetName]." # todo: NEW TRANSLATION
 pam_saint_events.0002.desc_va: "[canonizer.GetTitledFirstName] nás žádá, abychom uctívali [saint_candidate.GetFirstName] mezi [saint_candidate.Custom('PamBlessedOnesOrAncestors')] a [saint_candidate.Custom('PamConsecratedEnshrined')] ho v [consecration_province.GetName]." # todo: NEW TRANSLATION
 pam_saint_events.0002.desc.traits_1: "\n\nZa života byl [saint_candidate.GetFirstNameNoTooltip] [saint_candidate.GetWomanMan], známý tím, že byl [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l]." # todo: NEW TRANSLATION
 pam_saint_events.0002.desc.traits_2: "\n\nZa života byl [saint_candidate.GetFirstNameNoTooltip] [saint_candidate.GetWomanMan], známý jako [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l] a [pam_saint_ptrait_2.GetNameNoTooltip( saint_candidate.Self )|l]." # todo: NEW TRANSLATION
 pam_saint_events.0002.desc.traits_3: "\n\nZa života byl [saint_candidate.GetFirstNameNoTooltip] [saint_candidate.GetWomanMan], známý jako [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l], [pam_saint_ptrait_2.GetNameNoTooltip( saint_candidate.Self )|l] a [pam_saint_ptrait_3.GetNameNoTooltip( saint_candidate.Self )|l]." # todo: NEW TRANSLATION
 pam_saint_events.0002.desc.virtue_1: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0002.desc.virtue_1_saint', 'pam_saint_events.0002.desc.virtue_1_va' )]" # todo: NEW TRANSLATION
 pam_saint_events.0002.desc.virtue_1_saint: "Z této duše vyzařuje mihotavé světlo; skromný plamínek, vždyť ne každý svatý byl ukován v mohutnějším ohni.\n\nRozhodnutí je na nás." # todo: NEW TRANSLATION
 pam_saint_events.0002.desc.virtue_1_va: "Z této duše vyzařuje mihotavé světlo; skromný plamínek, vždyť ne každá uctívaná duše byla ukována v mohutnějším ohni.\n\nRozhodnutí je na nás." # todo: NEW TRANSLATION
 pam_saint_events.0002.desc.virtue_2: "Zásluhy této duše o potěšení [saint_candidate.GetFaith.HighGodName] nelze podceňovat — jsou známkou zjevné, byť nedokonalé milosti.\n\nRozhodnutí je na nás." # todo: NEW TRANSLATION
 pam_saint_events.0002.desc.virtue_3: "Tato duše je ztělesněním ctnosti; jen málokterý smrtelník tak zjevně oplývá božskostí.\n\nRozhodnutí je na nás." # todo: NEW TRANSLATION
 pam_saint_events.0002.a: "[saint_candidate.GetFirstName] si to skutečně zaslouží." # todo: NEW TRANSLATION
 pam_saint_events.0002.a.dynasty_opinion_tt: "Členové [canonizer.GetFaith.GetAdherentName] [Concept('dynasty','dynasty')|E] [canonizer.GetShortUINamePossessive] k vám získají na 20 let #P 10#! [Concept('opinion','Opinion')|E]" # todo: NEW TRANSLATION
 pam_saint_events.0002.b: "Neschválíme to." # todo: NEW TRANSLATION
