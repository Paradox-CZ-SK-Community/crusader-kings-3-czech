 pam_my_liege_khan: "velký cháne"
 pam_my_liege_khatun: "velká chatun"
 pam_my_liege_chieftain: "můj náčelníku"
 pam_my_liege_serene_lord: "nejjasnější pane"
 pam_my_liege_serene_lady: "nejjasnější paní"
 pam_my_liege_lord: "můj pane"
 pam_my_liege_lady: "má paní"
 pam_my_liege_liege: "můj lenní pane"
 pam_secular_faith_events.0001.t: "Svatý kouř"
 pam_secular_faith_events.0001.desc: "[chaplain.GetFirstName|U], [Select_CString(chaplain.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l], prochází hlavní lodí s kadidelnicí. Posvátný kouř stoupá ke krovům a nese s sebou tlumené modlitby shromážděných.\n\nNa okamžik jako by celé stvoření toužilo po místě, kde je [ROOT.Char.GetFaith.PositiveAfterLife] — a já s ním."
 pam_secular_faith_events.0001.a: "Ponořím se do modlitby."
 pam_secular_faith_events.0001.b: "Kéž [ROOT.Char.GetFaith.WealthGodName] přijme tento obřad."
 pam_secular_faith_events.0001.c: "[ROOT.Char.Custom('GetCourt')|U] by měl sdílet tuto zbožnost."
 pam_secular_faith_events.0002.t: "Pikuach nefeš"
 pam_secular_faith_events.0002.desc: "[traveler_in_danger.GetTitledFirstName|U] [Select_CString(traveler_in_danger.IsFemale,'putovala','putoval')] mými zeměmi, když [Select_CString(traveler_in_danger.IsFemale,'ji','ho')] [CZPrepV(background_terrain_scope.GetNameNoTooltip)|l] [CZProvName(background_terrain_scope,'L')] přepadli bandité!\n\nJde o život, ale dnes je [ROOT.Char.GetFaith.HighGodNamePossessive] svatý den a chopit se zbraně je zakázáno. Nemám právo porušit šabat. Pokud počkám do západu slunce, možná vyrazím jen proto, abych [Select_CString(traveler_in_danger.IsFemale,'ji','ho')] [Select_CString(ROOT.Char.IsFemale,'pohřbila','pohřbil')].\n\nMohu však nečinně přihlížet, když jde o život?"
 pam_secular_faith_events.0002.a: "Život má přednost před vším. Vyrazíme."
 pam_secular_faith_events.0002.b: "Musím se poradit [CZPrepS(chaplain.GetFirstNameNoTooltip)] [ROOT.Char.Custom2('CZ_RelationToMeShort_I',chaplain)|l] [chaplain.Custom('CZ_FirstNameNoTooltip_I')]."
 pam_secular_faith_events.0002.c: "Šabat neporuším."
 pam_secular_faith_events.0003.t: "Vidění v noci"
 pam_secular_faith_events.0003.desc: "Probouzím se [Select_CString(ROOT.Char.IsFemale,'sevřená','sevřený')] něčím víc než jen snem — sloupem ohně, hlasem, který znal mé jméno, tváří, na kterou nemohu zapomenout...\n\n[ROOT.Char.GetFaith.HighGodName|U] mě snad navštěvuje ve snu? [ROOT.Char.GetFaith.HealthGodName|U]? Anebo [ROOT.Char.GetFaith.DevilName] v líbivém přestrojení...\n\nMožná to byly jen horečnaté představy rozbouřené krve."
 pam_secular_faith_events.0003.a: "Hlas šeptal blažené pravdy..."
 pam_secular_faith_events.0003.b: "Horečnaté představy... Musím si o takových případech něco přečíst."
 pam_secular_faith_events.0003.c: "[ROOT.Char.Custom('GetCourt')|U] musí slyšet, co jsem [Select_CString(ROOT.Char.IsFemale,'spatřila','spatřil')]!"
 pam_secular_faith_events.0004.t: "Zakázaná pravda"
 pam_secular_faith_events.0004.desc: "Nemohu spát. Pochybnosti mě ženou z místa na místo — kolem mě jsou [ROOT.Char.Custom('ResidenceBuildingHallsType')|l] a [ROOT.Char.Custom('ResidenceBuilding')|l] mi nedopřává klid.\n\nMé myšlenky se stále vracejí k něčemu, co má víra zavrhuje: [pam_sf_forbidden_tenet.GetBaseName]. Mělo by mě to znepokojovat — ale cítím, že v tomto přesvědčení je spravedlivá pravda, a nedokážu se té pochybnosti zbavit."
 pam_secular_faith_events.0004.a: "Budu se této pravdy držet — ale potají."
 pam_secular_faith_events.0004.b: "Ne. Nesejdu z cesty."
 pam_secular_faith_events.0005.t: "Při svíčce"
 pam_secular_faith_events.0005.desc_intro: "Večerní studium mě mělo uklidnit, ale jedna pasáž mi stále tančí v myšlenkách.\n\n"
 pam_secular_faith_events.0005.desc_tenet: "Týká se zásady známé jako [pam_sf_revelation_tenet.GetBaseName], praxe, kterou by má víra bez váhání odsoudila. Říkám si, že je barbarská."
 pam_secular_faith_events.0005.desc_doctrine: "Týká se doktríny [pam_sf_revelation_doctrine.GetDescriptiveName( ROOT.Char.GetFaith.Self )], nauky, kterou by má víra bez váhání odsoudila. Říkám si, že je mylná."
 pam_secular_faith_events.0005.desc_end: "A přesto při svíčce chápu, proč se jí může jiná duše držet."
 pam_secular_faith_events.0005.a: "Musím své myšlenky přenést na papír."
 pam_secular_faith_events.0005.b: "Není na škodu tomu porozumět."
 pam_secular_faith_events.0005.c: "Modlitba tyto myšlenky očistí."
 pam_secular_faith_events.0006.t: "Kosti světce"
 pam_secular_faith_events.0006.desc: "Na tržišti mě zaujme [Select_CString(relic_seller.IsFemale,'poutnice zmožená','poutník zmožený')] cestou. V třesoucích se rukou leží zažloutlá kůstka z prstu.\n\n„Kost světce,“ zapřísahá se [Select_CString(relic_seller.IsFemale,'žena','muž')]. „[Select_CString(relic_seller.IsFemale,'Našla','Našel')|U] jsem ji cestou do [GetTitleByKey('c_jerusalem').Custom('CZ_LandedNameNoTier_G')], ale v rukou [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')|l] by byla v bezpečí.“\n\nZkušené oko by mohlo posoudit, zda je to pravda. A relikvie je příhodně na prodej."
 pam_secular_faith_events.0006.a: "Než zaplatím, dovol mi ji posoudit."
 pam_secular_faith_events.0006.b: "Vezmu si ji."
 pam_secular_faith_events.0006.c: "Cizí kosti mi k ničemu nejsou. Zmiz."
 pam_sf_acquire_relic_tt: "Získáš relikvii — [Concept('artifact','artefakt')|E] běžné [Concept('rarity','vzácnosti')|E]"
 pam_sf_examine_relic_tt: "Získáš relikvii — [Concept('artifact','artefakt')|E], jehož [Concept('rarity','vzácnost')|E] ovlivní tvá [learning_i][Concept('learning_skill','učenost')|E]"
 pam_sf_acquire_relic_toast: "Získána svatá relikvie"
 pam_sf_fingerbone_relic_name: "Svatý [SCOPE.Custom('PamFingerboneSaint')] — prstní kůstka"
 pam_sf_fingerbone_relic_desc: "Svatý [SCOPE.Custom('PamFingerboneSaint')] je uctíván prostřednictvím této zažloutlé prstní kůstky, uložené v malém relikviáři."
 pam_secular_faith_events.0007.t: "Arogantní biskup"
 pam_secular_faith_events.0007.desc: "[defiant_bishop.GetFirstName|U], [Select_CString(defiant_bishop.IsFemale,'jedna z mých duchovních','jeden z mých duchovních')] s titulem [defiant_bishop.GetTitleAsNameNoTooltip|l], se pyšní vlivnými známostmi a potají věří, že mě převyšuje. Několik služebníků nedávno onemocnělo a potřebuji požehnání pro svou domácnost.\n\nCelé dny mé předvolání přehlíží, ale nakonec přichází. „[Select_CString(defiant_bishop.IsFemale,'Omluvila','Omluvil')|U] bych se za zpoždění,“ ušklíbne se, „ale sloužím většímu pánu, než je kterýkoli [ROOT.Char.GetTitleAsNameNoTooltip|l].“"
 pam_secular_faith_events.0007.a: "Přistupme k tomu s důstojností, jakou si tvůj úřad zaslouží."
 pam_secular_faith_events.0007.b: "Prosím. Prostě proveď obřad."
 pam_secular_faith_events.0007.c: "[ROOT.Char.GetFaith.HighGodName|U] možná stojí nad tebou, ale já jsem [Select_CString(ROOT.Char.IsFemale,'tvá lenní paní','tvůj lenní pán')]. Ven!"
 pam_secular_faith_events.0008.t: "Tíha hříchu"
 pam_secular_faith_events.0008.desc: "Svíce dohořívají a tatáž myšlenka se vrací. Jsem [penance_sin.GetName( ROOT.Char )|l] a má víra to považuje za hřích.\n\nAť se snažím tu myšlenku zahnat sebevíc, pocit viny zůstává.\n\n„Ukázni se a tvá duše se zbaví svého břemene.“ [confessor.GetFirstName], [Select_CString(confessor.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', confessor )|l], mi nic nevyčítá ani mě neodsuzuje. „Dodržuj toto pokání. Nesejdi z cesty.“"
 pam_secular_faith_events.0008.a: "Učiním, jak mi [confessor.GetFirstNameNoTooltip] radí."
 pam_secular_faith_events.0008.b: "Teď ne. Ještě nejsem [Select_CString(ROOT.Char.IsFemale,'připravená','připravený')]."
 pam_secular_faith_events.0009.t: "Cizinec podobný Kristu"
 pam_secular_faith_events.0009.desc: "U mé brány žebrá o almužnu [Select_CString(stranger.IsFemale,'osamělá, zjizvená cizinka','osamělý, zjizvený cizinec')].\n\n„Odpusť mi vyrušení, [ROOT.Char.Custom('ComplimentAdjective')|l] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|l],“ pronese s půvabnou úklonou. „Pokud ti to tvé poměry dovolují, prosím jen o malý podíl z tvého bohatství.“\n\nNa [Select_CString(stranger.IsFemale,'žebračku','žebráka')] mluví nezvykle uhlazeně. Člověk nikdy neví, koho odmítne."
 pam_secular_faith_events.0009.a: "Pojď dál. [ROOT.Char.Custom('ResidenceBuilding')|U] tě přivítá."
 pam_secular_faith_events.0009.b: "Vezmi si tento chléb a jdi v pokoji."
 pam_secular_faith_events.0010.t: "Kdo přišel z mrazu"
 pam_secular_faith_events.0010.desc_blessed: "[Select_CString(stranger.IsFemale,'Žena','Muž')|U], [Select_CString(stranger.IsFemale,'kterou','kterého')] jsem [Select_CString(ROOT.Char.IsFemale,'vpustila','vpustil')] branou, není [Select_CString(stranger.IsFemale,'obyčejná tulačka','obyčejný tulák')] — [stranger.GetFirstName] mluví o Písmu i státnictví tak lehce, že i moji učenci ztichnou a naslouchají.\n\nZdá se, že [ROOT.Char.GetFaith.HighGodName] přece jen přichází k mé bráně. Nedovolím, aby [Select_CString(stranger.IsFemale,'odešla','odešel')]."
 pam_secular_faith_events.0010.desc_thief: "Probouzím se. V krbu zbyl jen popel a truhla je prázdná.\n\nChléb a přístřeší mi byly oplaceny nejstarší ze všech zrad.\n\n[stranger.GetFirstName|U] [Select_CString(stranger.IsFemale,'zmizela','zmizel')] v noci a mé bohatství [Select_CString(stranger.IsFemale,'s ní','s ním')].\n\nNež se služebnictvo probere, je dávno pryč za mými hradbami a mimo můj dosah."
 pam_secular_faith_events.0010.a: "[Select_CString(stranger.IsFemale,'Byla jsi sem poslána','Byl jsi sem poslán')|U] z nějakého důvodu."
 pam_secular_faith_events.0010.b: "[Select_CString(ROOT.Char.IsFemale,'Pozvala','Pozval')|U] jsem si zmiji ke stolu."
 pam_secular_faith_events.0011.t: "Kajícníci"
 pam_secular_faith_events.0011.desc: "Neprobouzí mě hrom, nýbrž praskání důtek.\n\n[ROOT.Char.Custom('ResidenceBuilding')|U] se ocitá v obležení zástupu kajícníků. Mají rozedřená a zakrvácená záda a hlásají, že [ROOT.Char.GetFaith.HighGodName] požaduje zásadu [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetNullCharacter.GetRite )].\n\nMá domácnost čeká, že ji povedu."
 pam_secular_faith_events.0011.a: "Neskrývá se v tom hlubší pravda?"
 pam_secular_faith_events.0011.b: "Dejte mi důtky — i já jsem [Select_CString(ROOT.Char.IsFemale,'zhřešila','zhřešil')]."
 pam_secular_faith_events.0011.c: "Vyžeňte toto šílenství z mých zemí!"
 pam_secular_faith_events.0012.t: "Požehnání zbraní"
 pam_secular_faith_events.0012.desc: "Mír je půjčka, nikdy dar.\n\nDnešní oslavy přijímá [ROOT.Char.GetFaith.WarGodName]. [chaplain.GetFirstName], [Select_CString(chaplain.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l], nabízí vysvětit zbraně mé domácnosti.\n\n„Bože, jenž jsi dal Davidovi sílu proti Goliášovi, vlož tutéž sílu do rodu [ROOT.Char.GetHouse.GetBaseName] — kéž vždy povstane na obranu slabých,“ zazní modlitba."
 pam_secular_faith_events.0012.a: "Požehnej mým praporům a čepelím pro den, kdy jich bude třeba."
 pam_secular_faith_events.0012.b: "Modleme se raději za mír."
 pam_secular_faith_events.0012.c: "Postačí tiché požehnání."
 pam_secular_faith_events.0013.t: "Předpovězená smrt"
 pam_secular_faith_events.0013.desc: "Přivádějí přede mě [Select_CString(prophet.IsFemale,'kazatelku','kazatele')] s divokýma očima. Je [Select_CString(prophet.IsFemale,'obviněna','obviněn')] z podněcování davů a věštění a ihned namíří roztřesený prst na [ROOT.Char.Custom2( 'CZ_RelationToMeShort_A', doomed_soul )|l] [doomed_soul.Custom('CZ_TitledFirstName_A')].\n\n„Pohleďte!“ zazní výkřik. „Ještě před příštím novoluním bude [Select_CString(doomed_soul.IsFemale,'ležet chladná','ležet chladný')] v zemi. [ROOT.Char.GetFaith.HighGodName|U] mi zjevuje přesnou hodinu!“\n\nTaková jistota je znepokojivá. [doomed_soul.Custom('CZ_FirstNamePossessiveNoTooltip_M')|U] strach mě však zneklidňuje ještě víc."
 pam_secular_faith_events.0013.a: "[ROOT.Char.GetFaith.HighGodName|U] promlouvá i skrze podivná ústa..."
 pam_secular_faith_events.0013.b: "Pryč s tebou, [Select_CString(prophet.IsFemale,'šílená bláznivko','šílený blázne')]!"
 prophecy_foretold_tt: "Proroctví je vyřčeno. Co když je pravdivé?"
 prophecy_foretold_2_tt: "Proroctví je vyřčeno. Naprostý nesmysl!"
 pam_secular_faith_events.0014.t: "Naplnění proroctví"
 pam_secular_faith_events.0014.desc_fulfilled: "Uplynulo novoluní a [doomed_soul.GetTitledFirstName] [Select_CString(doomed_soul.IsFemale,'je mrtvá — tiše zesnula','je mrtvý — tiše zesnul')] ve spánku.\n\n[Select_CString(prophet.IsFemale,'Otrhaná kazatelka určila','Otrhaný kazatel určil')|U] přesnou hodinu. Na to nemohu zapomenout.\n\nBylo to proroctví... nebo strach, který nabyl těla?"
 pam_secular_faith_events.0014.desc_failed: "Uplynulo novoluní a [doomed_soul.GetTitledFirstName] stále žije. Hodina, kterou [Select_CString(prophet.IsFemale,'otrhaná kazatelka předpověděla','otrhaný kazatel předpověděl')], přišla a odešla, aniž se cokoli stalo.\n\nJe to [Select_CString(prophet.IsFemale,'podvodnice nebo hlupačka','podvodník nebo hlupák')] — rozhodně skrze [Select_CString(prophet.IsFemale,'ni','něj')] nepromlouvá [ROOT.Char.GetFaith.HighGodName]."
 pam_secular_faith_events.0014.desc_wrong_prediction: "\n\nCítím se pěkně hloupě."
 pam_secular_faith_events.0014.a: "Je to [Select_CString(prophet.IsFemale,'skutečná prorokyně','skutečný prorok')]!"
 pam_secular_faith_events.0014.b: "[ROOT.Char.GetFaith.HighGodName|U] jedná tajemnými způsoby."
 pam_secular_faith_events.0014.c: "Proč jsem jen [Select_CString(ROOT.Char.IsFemale,'uvěřila','uvěřil')] tomu zatracenému proroctví!?"
 pam_secular_faith_events.0014.d: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] jsem tomu proroctví uvěřit..."
 pam_secular_faith_events.0014.e: "[Select_CString(prophet.IsFemale,'Kazatelka byla podvodnice','Kazatel byl podvodník')|U], přesně jak jsem [Select_CString(ROOT.Char.IsFemale,'říkala','říkal')]!"
 gains_religious_inspiration_tt: "[prophet.GetShortUIName|U] [Select_CString(prophet.IsLocalPlayer,'získáš','získá')|l] náboženskou [Concept('inspiration','inspiraci')|E]"
 pam_secular_faith_events.0015.t: "Plačící ikona"
 pam_secular_faith_events.0015.desc: "[chaplain.GetFirstName|U], [Select_CString(chaplain.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l], mě spěšně vede do [CZProvName(miracle_church,'G')]. Uvnitř z malovaných očí světce kanou slzy vonného oleje.\n\nZpráva o zázraku předběhne každého posla — a zázrak je mocná, nebezpečná věc."
 pam_secular_faith_events.0015.a: "Zázrak? Musíme to prošetřit."
 pam_secular_faith_events.0015.b: "Ať přijdou věřící. Přijmeme je."
 pam_secular_faith_events.0015.c: "O toto požehnání se dělit nebudeme."
 pam_secular_faith_events.0015.d: "Mé panství je požehnané!"
 no_miracles_tt: "Na tom zázraku něco smrdí..."
 pam_secular_faith_events.0016.t: "Cena za kazatelnu"
 pam_secular_faith_events.0016.desc_intro: "[ROOT.Char.Custom2('DescriptorMixedArticle', SCOPE.sC('candidate'))|U] [Select_CString(candidate.IsFemale,'žena','muž')] přichází. [ROOT.Char.Custom('ResidenceBuilding')|U] má být místem obchodu, nikoli proseb.\n\n„[Select_CString(old_realm_priest.IsFemale,'Tvá','Tvůj')] [old_realm_priest.GetCouncilTitle|l], [old_realm_priest.GetFirstName], je [Select_CString(old_realm_priest.IsFemale,'dobrá pastýřka','dobrý pastýř')],“ zazní tichá slova a na stůl dopadne naditý měšec. „Já bych však [Select_CString(candidate.IsFemale,'byla','byl')]... vděčnější. Jmenuj mě na [Select_CString(old_realm_priest.IsFemale,'její','jeho')] místo a [ROOT.Char.GetFaith.WealthGodNamePossessive] dar tě nemine.“"
 pam_secular_faith_events.0016.desc_sanctioned: "\n\nZásada [GetTenetType('tenet_simony').GetName( GetNullCharacter.GetRite )] není žádnou hanbou a stříbro je dobré."
 pam_secular_faith_events.0016.desc_sinful: "\n\n[GetTenetType('tenet_simony').GetName( GetNullCharacter.GetRite )|U] je hřích. Přijmout to zlato by poskvrnilo mou duši."
 pam_secular_faith_events.0016.a: "Zlato má přece jen větší váhu než hřích..."
 pam_secular_faith_events.0016.b: "Spravedlivá cena, spravedlivě zaplacená. Úřad je váš."
 pam_secular_faith_events.0016.c: "Tento úřad není na prodej."
 pam_secular_faith_events.0017.t: "Kacířství a [ROOT.Char.Custom('GetCourt')|l]"
 pam_secular_faith_events.0017.desc: "„[Select_CString(accused.IsFemale,'Kacířka','Kacíř')|U]!“ [chaplain.GetFirstName], [Select_CString(chaplain.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l], namíří obviňující prst na [accused.Custom('CZ_FirstName_A')]. „Copak nevidíš ten odporný vliv? Jeho původcem je [accused.Custom('CZ_FirstNamePossessiveNoTooltip_M')] ritus — [accused.GetRite.GetAdjective|l] — a podléhá mu celý [ROOT.Char.Custom('GetCourt')|l]. Musí činit pokání a přijmout pravdu, kterou hlásá [ROOT.Char.GetFaith.HighGodName]!“\n\n[accused.GetFirstNameNoTooltip|U] zachovává klidnou tvář, ačkoli obvinění zjevně bolí."
 pam_secular_faith_events.0017.a: "[accused.Custom('CZ_FirstNameNoTooltip_V')], dovol mi přivést tě k víře."
 pam_secular_faith_events.0017.a.success: "[accused.GetFirstNameNoTooltip|U] konvertuje"
 pam_secular_faith_events.0017.a.failure: "[accused.GetFirstName|U] nezmění názor"
 pam_secular_faith_events.0017.b: "Pak čiň pokání v cele. Zatkněte [Select_CString(accused.IsFemale,'ji','ho')]."
 pam_secular_faith_events.0017.c: "[accused.GetFirstNameNoTooltip|U] je pod mou ochranou. Dost."
 pam_secular_faith_events.0018.t: "Dítě pro Boha"
 pam_secular_faith_events.0018.desc: "[pious_child.GetFirstName|U], [Select_CString(pious_child.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', pious_child )|l], se liší od většiny dětí. Zatímco si ostatní hrají, tráví celé dny v kapli.\n\n„Takové dítě jsem ještě [Select_CString(chaplain.IsFemale,'neviděla','neviděl')],“ říká tiše [chaplain.GetFirstName], [Select_CString(chaplain.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l]. „Celé hodiny se modlí a při mši pláče. Je to jasné jako den — [pious_child.GetFirstNameNoTooltip] touží po životě s rysem [GetTrait('devoted').GetName( pious_child )|l].“"
 pam_secular_faith_events.0018.a: "Kéž [ROOT.Char.GetFaith.HighGodName] přijme tvou službu, ale zůstaň zde."
 pam_secular_faith_events.0018.b: "Církev dostane [Select_CString(pious_child.IsFemale,'mou dceru','mého syna')]."
 pam_secular_faith_events.0018.c: "Ne, patří do rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 pam_secular_faith_events.0019.t: "Boží mír"
 pam_secular_faith_events.0019.desc: "[chaplain.GetFirstName|U], [Select_CString(chaplain.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l], přichází s vážnými zprávami.\n\n„[ROOT.Char.GetFaith.HighGodNamePossessive|U] zrak nesmí vidět bratra vraždícího bratra,“ zazní naléhavá slova. „[feud_attacker.GetTitledFirstName|U] a [feud_defender.GetTitledFirstName] proti sobě [Select_CString(And(feud_attacker.IsFemale,feud_defender.IsFemale),'tasily','tasili')] zbraně a prostý lid krvácí kvůli jejich sporu!“\n\n„Ukonči to. Ať je spoutá zásada [GetTenetType('tenet_peace_of_god').GetName( GetNullCharacter.GetRite )].“"
 pam_secular_faith_events.0019.a: "Kéž [ROOT.Char.GetFaith.HighGodName] dosvědčí, že zde bude mír."
 pam_secular_faith_events.0019.b: "Každý pán, který tasil meč, se za to zodpoví."
 pam_secular_faith_events.0019.c: "Spory mých vazalů musím soudit já."
 pam_sf_peace_of_god_ends_wars_tt: "Každá [Concept('war','válka')|E] mezi tvými [Concept('vassals','vazaly')|E] skončí [Concept('white_peace','bílým mírem')|E]"
 pam_secular_faith_events.0020.t: "[ROOT.Char.GetFaith.HouseOfWorship|U] [CZPrepV(temple_location.GetNameNoTooltip)|l] [CZProvNameNoTooltip(temple_location,'L')]"
 pam_secular_faith_events.0020.desc: "Kameníci usazují poslední kámen. Je to první svatostánek, který jsem kdy [Select_CString(ROOT.Char.IsFemale,'vystavěla','vystavěl')] — [ROOT.Char.GetFaith.HouseOfWorship] zde [CZPrepV(temple_location.GetNameNoTooltip)|l] [CZProvName(temple_location,'L')], kde se rozkládá [temple_location.Custom('TerrainTypeProvincePrefix')|l] [temple_location.Custom('TerrainTypeProvince')|l].\n\n[chaplain.GetFirstName|U], [Select_CString(chaplain.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l], prochází pozemkem s kadidelnicí v ruce.\n\n„[ROOT.Char.GetFaith.HouseOfWorshipPlural|U] ti zajistí místo v paměti lidí, když [ROOT.Char.GetFaith.HighGodName] přijme jejich zasvěcení. Ať je toto první z mnoha.“"
 pam_secular_faith_events.0020.a: "Veď nás v modlitbě, [chaplain.Custom('CZ_FirstNameNoTooltip_V')]."
 pam_secular_faith_events.0020.b: "Ať [consecrated_county.GetNameNoTierNoTooltip] vzkvétá — zdejší [ROOT.Char.GetFaith.HouseOfWorship|l] bude srdcem tohoto místa."
 pam_secular_faith_events.0020.c: "Budu v těchto zdech hledat moudrost."
 pam_secular_faith_events.0020.d: "[ROOT.Char.GetFaith.HighGodNamePossessive|U] úkol pro mě teprve začíná."
 pam_secular_faith_events.0021.t: "Znamení na nebesích"
 pam_secular_faith_events.0021.desc: "Spánek nepřichází. Hledám klidnou tmu — [ROOT.Char.Custom('GetCourtyard')|l] nabízí ticho — a vzhlížím k obloze. Dnes v noci mi nebesa ukazují znamení: [ROOT.Char.Custom('GetPamCelestialOmen')|l].\n\nTaková znamení nikdy nejsou bez významu."
 pam_omen_blood_moon: "rudý měsíc"
 pam_omen_star_host: "zástup hvězd tam, kde žádné být nemají"
 pam_omen_comet: "kometa se dvěma ohony"
 pam_omen_falling_stars: "déšť padajících hvězd"
 pam_omen_moon_halo: "kruh bledého světla kolem měsíce"
 pam_omen_eclipse: "měsíc zastíněný do měděného srpku"
 pam_omen_wandering_star: "zářivá bludná hvězda"
 pam_secular_faith_events.0021.a: "Prostudují toto znamení."
 pam_secular_faith_events.0021.b: "Září z něj [ROOT.Char.GetFaith.HighGodNamePossessive] dar přízně."
 pam_secular_faith_events.0021.c: "Takové znamení věští vítězství!"
 pam_secular_faith_events.0021.d: "Nebesa mi nedluží žádné odpovědi."
 pam_secular_faith_events.0022.t: "Dotek [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')|l]"
 pam_secular_faith_events.0022.desc_intro: "[sick_courtier.GetFirstName|U], [Select_CString(sick_courtier.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', sick_courtier )|l], se ke mně šourá [Select_CString(sick_courtier.IsFemale,'bledá a nejistá','bledý a nejistý')].\n\n"
 pam_secular_faith_events.0022.desc_ill: "„Chřadnu, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Sužuje mě nemoc [illness_trait.GetName( GetNullCharacter )|l] a lék je v nedohlednu. Ani [physician.GetTitledFirstName] neví, co mi schází!“ zazní nářek.\n\n"
 pam_secular_faith_events.0022.desc_other: "„Chřadnu. Sužuje mě nemoc [illness_trait.GetName|l] a lék je v nedohlednu. Ani [physician.GetTitledFirstName] mi nedokáže pomoci!“ zazní nářek.\n\n"
 pam_secular_faith_events.0022.desc_end: "„Říká se, že [ROOT.Char.GetFaith.HighGodNamePossessive] dar milosti dlí v prstech panovníků... a to je má poslední naděje.“"
 pam_secular_faith_events.0022.a: "Pojď. Položím na tebe ruce."
 pam_secular_faith_events.0022.b: "Ne... požehnám ti odtud."
 pam_sf_kings_touch_gamble_tt: "Můj dotek může uzdravit [sick_courtier.Custom('CZ_FirstName_A')], nebo se nemoc přenese i na mě..."
 pam_sf_kings_touch_cured_toast: "[sick_courtier.GetFirstName|U] vstává z lůžka nemocných"
 pam_sf_kings_touch_infected_toast: "Nemoc se přenese i na mě"
 pam_sf_kings_touch_nothing_toast: "Můj dotek nijak nepomáhá [sick_courtier.Custom('CZ_FirstName_D')]"
 pam_secular_faith_events.0023.t: "Putující písař"
 pam_secular_faith_events.0023.desc: "Přivádějí přede mě [Select_CString(scholar.IsFemale,'vyhublou ženu','vyhublého muže')], s prsty potřísněnými inkoustem a knihami pod paží.\n\n„Jsem [scholar.GetFirstName], [Select_CString(scholar.IsFemale,'písařka a učenkyně','písař a učenec')],“ zazní vysvětlení. „Nemám domov ani mecenáše. Tyto ruce nejsou určeny k dřině, ale k tomu, aby [ROOT.Char.Custom('GetWritingMaterial')|l] nesl slovo [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')|l].“\n\n„Prosím, dej mi chléb a střechu nad hlavou a budu ti věrně sloužit.“"
 pam_secular_faith_events.0023.a: "[Select_CString(scholar.IsFemale,'Učenkyně','Učenec')|U]? Nauč mě, co víš."
 pam_secular_faith_events.0023.b: "[scholar_church.GetNameNoTooltip|U] tě potřebuje."
 pam_secular_faith_events.0023.c: "Mé účetní knihy potřebují pevnou ruku."
 pam_secular_faith_events.0023.d: "Nepotřebuji tě. Zmiz."
 pam_secular_faith_events.0024.t: "Do kláštera"
 pam_secular_faith_events.0024.desc: "[rival_character.GetFirstName|U], [Select_CString(rival_character.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', rival_character )|l], je jako obvykle [rival_character.Custom2('InsultAdjectiveClumsy', ROOT.Char)|l] [rival_character.Custom2('InsultNounClumsy', ROOT.Char)|l] a [rival_character.Custom2('InsultAdjective', ROOT.Char)|l] [rival_character.Custom2('InsultNoun', ROOT.Char)|l] a snáší to celý [ROOT.Char.Custom('GetCourt')|l]. Náladu mi však zlepší dopis od [archbishop.Custom('CZ_TitledFirstName_G')] — sídlí [CZPrepV(archdiocese.GetNameNoTooltip)|l] [archdiocese.Custom('CZ_LandedName_L')].\n\n„[rival_character.GetFirstName|U] může sloužit tak, aby [ROOT.Char.GetFaith.HighGodName] má potěšení,“ stojí v dopise. „Klášter [Select_CString(rival_character.IsFemale,'ji','ho')] rád přijme.“\n\nSvět rychle zapomíná na ty, kdo tam klečí."
 pam_secular_faith_events.0024.a: "[ROOT.Char.GetFaith.HighGodName|U] tak dostane [Select_CString(rival_character.IsFemale,'další „ochotnou“ služebnici','dalšího „ochotného“ služebníka')]!"
 pam_secular_faith_events.0024.b: "Raději bych měl svého nepřítele na očích."
 pam_secular_faith_events.0025.t: "[Select_CString(ROOT.Char.IsFemale,'Kmotra','Kmotr')|U]"
 pam_secular_faith_events.0025.desc: "„Toužím přijmout [CZFaithAdjDecline(ROOT.Char.GetFaith,'ou')|l] víru tělem i duchem,“ pronese vážně [converting_char.GetFirstName], [Select_CString(converting_char.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', converting_char )|l]. „Chci přijmout křest a být [ROOT.Char.GetRite.GetAdherentName|l]... a prosím tě, abys u křtitelnice [Select_CString(ROOT.Char.IsFemale,'stála','stál')] jako [Select_CString(ROOT.Char.IsFemale,'má kmotra','můj kmotr')].“"
 pam_secular_faith_events.0025.a: "Ať všichni vidí naše nové pouto!"
 pam_secular_faith_events.0025.b: "Víra nepotřebuje velkolepou podívanou."
 pam_secular_faith_events.0025.c: "Tuto poctu nemohu přijmout."
 pam_secular_faith_events.0026.t: "Obléhaná duše"
 pam_secular_faith_events.0026.desc: "[afflicted.GetFirstName|U], [Select_CString(afflicted.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', afflicted )|l], nikdy [Select_CString(afflicted.IsFemale,'nebyla','nebyl')] docela při smyslech... teď už však není ani [Select_CString(afflicted.IsFemale,'sama sebou','sám sebou')].\n\n„[ROOT.Char.GetFaith.EvilGodNames|U]! [ROOT.Char.GetFaith.EvilGodNames|U] jsou ve mně!“ zazní šílený křik. [ROOT.Char.GetFaith.HouseOfWorship|U] přihlíží křečím na podlaze.\n\n[chaplain.GetFirstName|U], [Select_CString(chaplain.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l], zbledne. „[ROOT.Char.Custom('FormOfAddressForLiege')|U], obávám se, že duši obléhají démoni. Jedinou pomocí je exorcismus.“"
 pam_secular_faith_events.0026.a: "Potřebuje řádnou péči."
 pam_secular_faith_events.0026.b: "Exorcismus povedu [Select_CString(ROOT.Char.IsFemale,'sama','sám')]."
 pam_secular_faith_events.0026.c: "Tohle je svatá práce. Postarej se o to."
 pam_secular_faith_events.0026.d: "Pryč [Select_CString(afflicted.IsFemale,'s ní','s ním')], než se rozšíří panika!"
 pam_sf_exorcism_success_toast: "Exorcismus se zdařil"
 pam_sf_exorcism_failed_toast: "Exorcismus selhal"
 pam_secular_faith_events.0027.t: "Krize víry"
 pam_secular_faith_events.0027.desc: "„Kéž [ROOT.Char.GetFaith.HighGodName] slyší můj hlas,“ šeptám. V hloubi duše však vím, že [ROOT.Char.GetFaith.HighGodNameSheHe|l] hříšníkům, jako jsem já, nenaslouchá.\n\n[Select_CString(ROOT.Char.IsFemale,'Nepochopila','Nepochopil')|U] jsem [ROOT.Char.GetFaith.HighGodHerHis|l] vůli? Není snad zásada [old_tenet.GetName( ROOT.Char.GetRite )] pravou podobou [ROOT.Char.GetFaith.HighGodHerHis|l] moudrosti?\n\nNa krucifix dopadá světlo a probouzí ve mně naději."
 pam_secular_faith_events.0027.a: "[ROOT.Char.GetFaith.HighGodName|U] žádá zásadu [new_tenet.GetNameNoTooltip( ROOT.Char.GetRite )]!"
 pam_secular_faith_events.0027.b: "Co třeba... [forbidden_tenet.GetNameNoTooltip( ROOT.Char.GetRite )]?"
 pam_secular_faith_events.0027.c: "Jsem [Select_CString(ROOT.Char.IsFemale,'zatracená','zatracený')]. A všichni ostatní budou také..."
 pam_secular_faith_events.0028.t: "Má duše v pokoji"
 pam_secular_faith_events.0028.desc: "Klečím v modlitbě. [ROOT.Char.GetFaith.HouseOfWorship|U] mě obklopuje a [ROOT.Char.GetFaith.HighGodName] prostupuje každým koutem mé duše.\n\nZásada [old_tenet.GetName( ROOT.Char.GetRite )], kterou ctím, mi ukázala pravdu. Takový klid jsem nikdy [Select_CString(ROOT.Char.IsFemale,'nepoznala','nepoznal')]. Jak bych si takovou radost [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] nechat pro sebe? Nemám snad ostatní vést ke stejnému světlu a ukázat jim pravdu?"
 pam_secular_faith_events.0028.a: "Najdu ochotné posluchače."
 pam_secular_faith_events.0028.b: "Mou pravou vášní je však zásada [forbidden_tenet.GetNameNoTooltip( ROOT.Char.GetRite )]!"
 pam_secular_faith_events.0028.c: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] bych své pocity zaznamenat — [ROOT.Char.Custom('GetWritingMaterial')|l] je snese."
 pam_secular_faith_events.0029.t: "Návštěva ze záhrobí"
 pam_secular_faith_events.0029.desc: "„Probuď se, [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')],“ zazní známý hlas. „Jsem zde, [departed.Custom2( 'CZ_RelationToMeShort_V', root_scope )|l]... ve chvíli tvé nouze.“\n\nPohnu se, čelo vlhké potem. Přízrak na okamžik zabliká a zmizí.\n\n[Select_CString(departed.IsFemale,'To byla... má','To byl... můj')] [ROOT.Char.Custom2( 'RelationToMeShort', departed )|l]?"
 pam_secular_faith_events.0029.a: "Je v bezpečí a bdí nade mnou."
 pam_secular_faith_events.0029.b: "Bylo to... varování?"
 pam_secular_faith_events.0029.c: "Pouhá hra mysli. Nic víc."
 pam_secular_faith_events.0030.t: "Poustevník"
 pam_secular_faith_events.0030.desc: "„Kéž mi [ROOT.Char.GetFaith.HighGodName] dopřeje svou blízkost,“ pronese vážně [would_be_anchorite.GetFirstName], [Select_CString(would_be_anchorite.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', would_be_anchorite )|l]. „Svět je plný rozptýlení a já toužím po naprosté samotě.“\n\nPrsty přejíždí po zdi a zkoumá ji pohledem — [ROOT.Char.Custom('ResidenceBuilding')|l] zachovává ticho.\n\n„[ROOT.Char.GetFaith.HouseOfWorship|U] [CZPrepV(church_scope.GetNameNoTooltip)|l] [CZProvName(church_scope,'L')] má neobyčejný půvab. Chci se tam nechat zazdít ve stěně a strávit zbytek života v nepřerušované modlitbě.“"
 pam_secular_faith_events.0030.a: "Jestli si to přeješ, moji zedníci jsou ti k službám."
 pam_secular_faith_events.0030.b: "Ne, tohle ti nesplním."
 pam_secular_faith_events.0031.t: "Hádka učenců"
 pam_secular_faith_events.0031.desc: "„Jak může někdo popírat, že zásada [tenet_1.GetBaseName] je svatá?“ zvolá [disputant_one.GetFirstName], [Select_CString(disputant_one.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', disputant_one )|l].\n\n„Nesmysl! Je jasné jako den, že zásada [tenet_2.GetBaseName] přibližuje člověka k božskému! Copak ses nic [Select_CString(disputant_one.IsFemale,'nenaučila','nenaučil')]?“ odsekne [disputant_two.GetFirstName], [Select_CString(disputant_two.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', disputant_two )|l]."
 pam_secular_faith_events.0031.a: "Debata učenců? Přinesu si poznámky..."
 pam_secular_faith_events.0031.b: "Přitahuje mě zásada [tenet_1.GetBaseNameNoTooltip]."
 pam_secular_faith_events.0031.c: "Zásada [tenet_2.GetBaseNameNoTooltip] zní pravdivě."
 pam_secular_faith_events.0031.d: "[ROOT.Char.Custom('GetCourt')|U], kde to žije, je také [ROOT.Char.Custom('GetCourt')|l], kde se lidé učí."
 pam_secular_faith_events.0032.t: "Hodina pokušení"
 pam_secular_faith_events.0032.desc_food: "Probouzím se s polštářem mokrým od slin. Z kuchyně se line vůně — [ROOT.Char.Custom('RegionalEdibleMeat')|l] se peče a [ROOT.Char.Custom('GetRandomRegionalSmallGame')|l] dostává nádivku, v níž je [ROOT.Char.Custom('GetFoodDetail')|l]. [ROOT.Char.Custom('ResidenceBuildingHallsType')|U] naplňuje cinkání pohárů s nápojem [ROOT.Char.Custom('RegionalDrink')|l] a veselé hlasy.\n\nMůj rys [vice_trait.GetName( GetNullCharacter )|l] přiměl duchovní, které nazýváme [ROOT.Char.GetFaith.PriestNeuterPlural|l], aby mi přikázali půst... Proč mě však [ROOT.Char.GetFaith.HighGodName] zkouší právě tuto noc?\n\nS kručením žaludku slábne mé odhodlání."
 pam_secular_faith_events.0032.a: "[ROOT.Char.GetFaith.HighGodName|U] mé touhy ospravedlňuje!"
 pam_secular_faith_events.0032.b: "Ne. Půst platí a já ho dodržím."
 pam_secular_faith_events.0032.c: "Jen malou ochutnávku... kdo se to dozví?"
 pam_secular_faith_events.0033.t: "Kázání na polštáři"
 pam_secular_faith_events.0033.desc: "[believing_spouse.GetFirstName|U], [Select_CString(believing_spouse.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', believing_spouse )|l], zastává ritus [believing_spouse.GetRite.GetName] a jeho nauky mi v noci [Select_CString(believing_spouse.IsFemale,'ráda','rád')] šeptá.\n\n„Mé potěšení — [ROOT.Char.Custom('RomanticComplimentAdjective')|l] [believing_spouse.Custom2( 'RelationToMeShort', root_scope )|l] — víš, že [new_tenet.Custom('GetGenericTenetSentence')|l] Není to #EMP fascinující?#!“ zazní otázka a následuje objetí.\n\nTo nadšení je stejně okouzlující jako ten úsměv."
 pam_secular_faith_events.0033.a: "Hm, pověz mi víc..."
 pam_secular_faith_events.0033.b: "#EMP Ty#! jsi fascinující! Pojď sem."
 pam_secular_faith_events.0033.c: "Prosím, [believing_spouse.Custom('RomanticComplimentNoun')|l], potřebuji spát."
 pam_secular_faith_events.0034.t: "Nalezenec"
 pam_secular_faith_events.0034.desc: "[chaplain.GetFirstName|U], [Select_CString(chaplain.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l], obvykle nechodí pozdě. [ROOT.Char.GetFaith.HouseOfWorship|U] dnes místo obvyklého ticha naplňuje slabý pláč kojence.\n\n„Kéž [ROOT.Char.GetFaith.HighGodName] projeví milosrdenství...“ zašeptá [chaplain.GetFirstNameNoTooltip] a něžně kolébá dítě. „[trait_scope.GetName( GetNullCharacter )|U] — kvůli tomu bylo opuštěno... Žádná duše si takový osud nezaslouží.“\n\nDrobné prstíky sevřou palec, který jim [chaplain.GetFirstNameNoTooltip] podává."
 pam_secular_faith_events.0034.a: "[ROOT.Char.GetFaith.HighGodName|U] mi dává [Select_CString(foundling.IsFemale,'dceru','syna')]."
 pam_secular_faith_events.0034.b: "[archdiocese.GetNameNoTooltip|U] se dítěte ujme."
 pam_secular_faith_events.0034.c: "[chaplain.GetFirstNameNoTooltip|U] dítě vychová."
 pam_secular_faith_events.0034.d: "Nezajímá mě, co se s ním stane."
 pam_secular_faith_events.0035.t: "Umrtvování těla"
 pam_secular_faith_events.0035.desc: "Na zemi je krev. Jdu za zvukem ran a nacházím [sufferer.Custom('CZ_FirstName_A')], [ROOT.Char.Custom2( 'CZ_RelationToMeShort_A', sufferer )|l]. V rukou svírá rudé důtky a po tvářích tečou slzy.\n\n„Můj rys [sinful_trait.GetName( GetNullCharacter )|l] ve mně probouzí vášně, které mě hrozí pohltit,“ zazní sípání. „Lepší bodání biče než oheň pokušení.“\n\n„Tato bolest pomine. [ROOT.Char.GetFaith.NegativeAfterLife|U] nepomine.“"
 pam_secular_faith_events.0035.a: "Zajímavé... podej mi bič."
 pam_secular_faith_events.0035.b: "Ať se umrtvuje."
 pam_secular_faith_events.0035.c: "Kéž [ROOT.Char.GetFaith.HighGodName] vidí, že žádám konec tohoto šílenství."
 pam_sf_scourge_abandoned_toast: "Bič odložen"
 pam_secular_faith_events.0036.t: "Moudrost poustevníka"
 pam_secular_faith_events.0036.desc: "O audienci žádá [Select_CString(hermit.IsFemale,'otrhaná žena','otrhaný muž')]. Tvrdí, že žije v samotě [hermit_location.Custom('CZ_TerrainTypeProvince_In')|l] [CZPrepV(hermit_location.GetNameNoTooltip)|l] [CZProvName(hermit_location,'L')].\n\n„Už sedm nocí mi [ROOT.Char.GetFaith.HighGodName] odpírá spánek,“ zazní přísná slova. „Nemá to být trest, ale mé myšlenky musí naplnit pravdy určené ostatním — tobě.“\n\n„Naslouchej mi a vezmi si má slova k srdci. Potom se vrátím do samoty.“"
 pam_secular_faith_events.0036.a: "O jaká tajemství se se mnou můžete podělit?"
 pam_secular_faith_events.0036.b: "Rád se poučím."
 pam_secular_faith_events.0036.c: "Pryč s tebou, [Select_CString(hermit.IsFemale,'žebračko','žebráku')]."
 pam_secular_faith_events.0037.t: "Tělesné zjevení"
 pam_secular_faith_events.0037.desc_wanderer: "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] teče proudem dlouho do noci a hostující [Select_CString(reveler.IsFemale,'poutnice','poutník')], [reveler.GetFirstName], se nakloní blíž."
 pam_secular_faith_events.0037.desc_normal: "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] teče proudem dlouho do noci a [reveler.GetFirstName], [Select_CString(reveler.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', reveler )|l], se nakloní blíž."
 pam_secular_faith_events.0037.desc: "Brzy mou pozornost poutá už jen [reveler.Custom('ObjectifiedFeature')|l].\n\n„Některé modlitby vyslovuje jazyk,“ zazní hlas, zatímco [reveler.Custom('GetClothingArticle')|l] pomalu sklouzává z těla. „Jiné vyslovuje tělo. Ukážu ti umění [reveler.Custom('pam_sf_carnal_art')|l], [ROOT.Char.Custom('RaunchyComplimentNoun')|l].“\n\nNabídnutá ruka čeká na mou odpověď. „Rozkoš, která přijde, se vyrovná blaženosti, jakou skýtá [ROOT.Char.GetFaith.PositiveAfterLife].“"
 pam_secular_faith_events.0037.a: "Ukaž mi to. Až odejdeš, zamkni za sebou."
 pam_secular_faith_events.0037.b: "Zahal se, [Select_CString(reveler.IsFemale,'ženo','muži')]."
 pam_sf_carnal_art_1: "Svíjející se had"
 pam_sf_carnal_art_2: "Stoupající řeka"
 pam_sf_carnal_art_3: "Propletené liány"
 pam_sf_carnal_art_4: "Pevné objetí"
 pam_sf_carnal_art_5: "Rozštípnutí bambusu"
 pam_sf_carnal_art_6: "Kobylí trik"
 pam_sf_carnal_art_7: "Rozvíjející se lotos"
 pam_sf_carnal_art_8: "Indrova žena"
 pam_sf_carnal_art_9: "Vztyčená kobra"
 pam_sf_carnal_art_10: "Milenecký uzel"
 pam_sf_carnal_art_11: "Růže a trn"
 pam_sf_carnal_art_12: "Tajemství trubadúra"
 pam_sf_carnal_art_13: "Plamen v dlaních"
 pam_secular_faith_events.0038.t: "Ochutnávka ráje"
 pam_secular_faith_events.0038.desc: "[reveler.GetFirstName|U], [Select_CString(reveler.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', reveler )|l], naplní další talíř — [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_plural')|l] se na něm vrší — a zazubí se na mě přes stůl.\n\n„Toužíš po blízkosti, kterou skýtá [ROOT.Char.GetFaith.HighGodName], s kručícím břichem a prázdným pohárem. Já cítím [ROOT.Char.GetFaith.CreatorHerHim|l] v zralém ovoci, tučném mase, smíchu a písních.“ Do výše se zvedne plný pohár.\n\n„[ROOT.Char.GetFaith.HighGodNamePossessive|U] dar si zaslouží vychutnat, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Zahazovat, co nám bylo dáno? To je teprve hrozný hřích!“"
 pam_secular_faith_events.0038.a: "Možná se svatost skrývá v poháru..."
 pam_secular_faith_events.0038.b: "Pak na jeho počest uspořádám hostinu."
 pam_secular_faith_events.0038.c: "Rozmařilost převlečená za zbožnost. Ne."
 pam_secular_faith_events.0039.t: "Modlitba ve tmě"
 pam_secular_faith_events.0039.desc: "[spymaster_scope.GetFirstName|U], [Select_CString(spymaster_scope.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMe', spymaster_scope )|l], přichází stále [Select_CString(spymaster_scope.IsFemale,'zneklidněná','zneklidněný')] plody vlastní prohnanosti.\n\n„[Select_CString(spymaster_scope.IsFemale,'Poklekla','Poklekl')|U] jsem při modlitbě vedle [secret_keeper.Custom('CZ_TitledFirstName_G')], [ROOT.Char.Custom('FormOfAddressForLiege')|l], a [Select_CString(spymaster_scope.IsFemale,'zalhala','zalhal')] jsem — drobnou, zbožnou nepravdu, abych [Select_CString(secret_keeper.IsFemale,'jí','mu')] [Select_CString(spymaster_scope.IsFemale,'rozvázala','rozvázal')] jazyk.“\n\n„[Select_CString(secret_keeper.IsFemale,'Přiznala','Přiznal')|U] se k činu [secret_keeper.Custom('GetSecretCrimeConfessionIndef')|l] tam, kde přebývá [ROOT.Char.GetFaith.HighGodName],“ zazní tlumeně. „[GetTenetType('tenet_sacred_shadows').GetName( GetPlayer.GetRite )|U] — právě to vedlo má slova... Snad od nás [ROOT.Char.GetFaith.HighGodName] takovou lest žádá?“"
 pam_secular_faith_events.0039.a: "[ROOT.Char.GetFaith.HighGodName|U] přece působí i ve stínech..."
 pam_secular_faith_events.0039.b: "Odporný trik... prostě mi řekni to tajemství."
 pam_secular_faith_events.0040.t: "Tělo věřících"
 pam_secular_faith_events.0040.desc: "Při večeři [scholar.GetFirstName], [Select_CString(scholar.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', scholar )|l], otevře ohmatanou knihu. Začíná další přednáška.\n\n„[Glossary( 'Issedonové', 'ISSEDONES_GLOSS' )|U] své mrtvé nepohřbívali, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Hodovali na nich!“ Slova se hrnou bez oddechu. „Otcovo maso smísili se skopovým, lebku pozlatili a chovali ji jako svatou relikvii. Pro ně to byl nejčistší projev dětské lásky.“\n\n„A víš, co je nejlepší?“ následuje úšklebek. „Sám Hérodotos je nepokládal za zlé ani šílené. #EMP ‚Zvyk,‘#! pravil, #EMP ‚je pánem všeho.‘#!“"
 pam_secular_faith_events.0040.a: "Ach, o tom už všechno vím."
 pam_secular_faith_events.0040.b: "Ponurý zvyk... pověz mi víc."
 pam_secular_faith_events.0040.c: "[ROOT.Char.GetFaith.HighGodNamePossessive|U] soud, [Select_CString(scholar.IsFemale,'ženo','muži')]! Snažím se jíst!"
 ISSEDONES_GLOSS: "Národ žijící na dalekém severu stepí, který popsal Hérodotos. Když zemřel otec, jeho rodina smísila jeho maso s masem poražených zvířat a uspořádala pohřební hostinu. Jeho lebku pozlatili a každoročně jí vzdávali úctu obětí. Hérodotos tyto zvyky zaznamenal nikoli proto, aby je odsoudil, ale aby ukázal, že „zvyk vládne všem“."
 pam_secular_faith_events.0041.t: "Nahá pravda"
 pam_secular_faith_events.0041.desc: "Při procházce zahradou spatřím mezi záhony — [ROOT.Char.GetCapitalLocation.Custom('get_region_flower_type')|l] právě kvete — cizí postavu, která trhá ovoce. [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_tree_type')|U] poskytuje plody a padající listí je jejím jediným šatem.\n\n„Ach, [ROOT.Char.GetTitleAsName|l]! Proč se skrýváš za látkou a korunou?“ zazní otázka bez jakéhokoli studu. [ROOT.Char.GetFaith.HighGodName|U] i já vidíme vše. „[Select_CString(adamite.IsFemale,'Přijala','Přijal')|U] jsem prvotní nevinnost, kdy jsme žili nazí a beze strachu.“\n\nDalší sousto ovoce, další pramínek šťávy po nahé kůži. „Možná bys to [Select_CString(ROOT.Char.IsFemale,'měla','měl')] udělat také.“"
 pam_secular_faith_events.0041.a: "I já toužím po takové svobodě."
 pam_secular_faith_events.0041.b: "Jez mé ovoce, pověz mi svůj příběh a pak odejdi."
 pam_secular_faith_events.0041.c: "Dejte vetřelce zavřít."
 pam_secular_faith_events.0042.t: "Cesta bez starostí"
 pam_secular_faith_events.0042.desc: "[sponsor_character.GetFirstName|U], [Select_CString(sponsor_character.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', sponsor_character )|l], mě zastihne v zahradě s otevřeným měšcem a vřelým úsměvem.\n\n„Dovol mi uhradit náklady na tvou [CZActivity('activity_pilgrimage','A')|l], [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Poutník by neměl počítat mince — vydej se svobodně na cestu a modli se za nás oba.“\n\nStříbro je skutečné. Důvěra také."
 pam_secular_faith_events.0042.a: "Vydám se na cestu se vděčným srdcem."
 pam_secular_faith_events.0042.b: "Vezmu si mince a nechám si je."
 pam_secular_faith_events.0042.c: "Nech si své mince, [Select_CString(sponsor_character.IsFemale,'přítelkyně','příteli')]."
 pam_sf_pilgrimage_sponsor_tt: "Pokud dokončíš [CZActivity('activity_pilgrimage','A')|l] během #V 7#! let, názor [sponsor_character.Custom('CZ_FirstName_G')] na tebe se zvýší o #P 50#!"
 pam_sf_pilgrimage_sponsor_toast: "Patron potěšen"
 pam_secular_faith_events.0043.t: "Poutníkovo přivítání"
 pam_secular_faith_events.0043.desc: "[holy_man.GetFirstName|U], [Select_CString(holy_man.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', holy_man )|l], mě před oltářem vezme za ruce.\n\n„Vydej se na poutní cestu, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Až se vrátíš, oznámím tvou [CZActivity('activity_pilgrimage','A')|l] na každém náměstí [capital_county.Custom('CZ_LandedNameNoTier_G')]. Tvůj lid pozná, že jeho [ROOT.Char.GetTitleAsNameNoTooltip|l] za něj [Select_CString(ROOT.Char.IsFemale,'poklekla','poklekl')].“"
 pam_secular_faith_events.0043.a: "Pak se vydám na poutní cestu."
 pam_secular_faith_events.0043.b: "Musím se věnovat důležitějším, světským záležitostem."
 pam_sf_extolled_pilgrimage_toast: "Lid se raduje"
 pam_secular_faith_events.0044.t: "Přízeň duchovenstva"
 pam_secular_faith_events.0044.desc: "[friendly_bishop.GetFirstName|U], [Select_CString(friendly_bishop.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', friendly_bishop )|l], přichází v nezvykle dobré náladě.\n\n„V poslední době jsem si mezi svými druhy [Select_CString(friendly_bishop.IsFemale,'získala','získal')] přízeň — mezi biskupy, opaty a dalšími, jejichž hlas má v církvi váhu. Potřebuješ-li jejich zbožnou moudrost či mravní autoritu, mohu mluvit tvým jménem.“\n\n[friendly_bishop.Custom('CZ_FirstNamePossessiveNoTooltip_M')|U] vliv se však dá snadno vyčerpat, zvlášť tam, kde [ROOT.Char.GetFaith.PriestNeuterPlural|l] touží po moci."
 pam_secular_faith_events.0044.a: "Pak za mě promluv."
 pam_secular_faith_events.0044.b: "Tvé přátelství je dostatečným požehnáním."
 pam_secular_faith_events.0045.t: "Prozření"
 pam_secular_faith_events.0045.desc: "Jasné poznání udeří jako blesk z čistého nebe.\n\nDoktríny. Zásady. Rity. Víra. Tisíc rozptýlených myšlenek splynulo v jedinou pravdu, kterou teď před sebou vidím v celé její úplnosti."
 pam_secular_faith_events.0045.a: "Budoucnost mě volá, abych vedl."
 pam_secular_faith_events.0045.b: "Budu si tento okamžik užívat."
 pam_secular_faith_events.0046.t: "Sdílené přesvědčení"
 pam_secular_faith_events.0046.desc: "[intimate.GetFirstName|U], [Select_CString(intimate.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', intimate )|l], nedokáže skrýt své přesvědčení, když hovoří o zásadě [shared_tenet.GetName( intimate.GetRite )].\n\n„[shared_tenet.GetNameNoTooltip( GetNullCharacter.GetRite )|U] dává smysl všemu, co dělám,“ zazní tiše. „Jen na jediném mi záleží stejně... na tobě, [ROOT.Char.Custom('ComplimentAdjective')|l] [intimate.Custom2('RelationToMe', SCOPE.sC('root_scope'))|l].“\n\nPo tváři sklouzne jediná slza. „Jen jsem [Select_CString(intimate.IsFemale,'chtěla','chtěl')], abys to [Select_CString(ROOT.Char.IsFemale,'věděla','věděl')].“"
 pam_secular_faith_events.0046.a: "Ať naše společné přesvědčení ještě posílí náš svazek!"
 pam_secular_faith_events.0046.b: "Sdílet toto přesvědčení... je jako láska."
 pam_secular_faith_events.0046.c: "Děkuji, že ses mi svěřil/a."
 pam_secular_faith_events.0047.t: "Kněžská oddanost"
 pam_secular_faith_events.0047.desc: "[chaplain.GetFirstName|U], [Select_CString(chaplain.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l], se pokřižuje a skloní hlavu.\n\n„[ROOT.Char.GetFaith.HighGodName|U] ti svěřuje korunu z nějakého důvodu. Když ti věrně sloužím, naplňuji [ROOT.Char.GetFaith.HighGodHerHis|l] vůli.“\n\n„Kéž [ROOT.Char.GetFaith.HighGodName] přijme můj slib věrnosti. Nyní bych jej [Select_CString(chaplain.IsFemale,'chtěla','chtěl')] složit i tobě.“"
 pam_secular_faith_events.0047.a: "Pak mi služ z celého srdce."
 pam_secular_faith_events.0047.b: "[ROOT.Char.GetFaith.HighGodName|U] má v tvé službě vždy přednost."
 pam_secular_faith_events.0048.t: "Démonické sny"
 pam_secular_faith_events.0048.desc: "Probouzím se, ale nemohu se pohnout.\n\nPřede mnou tančí pokroucená postava a chechtá se. Démon? Pomalu mě naplňuje hrůza. „Heh... heh... tvé hříchy jsou těžké. Brzy si tě vezme [ROOT.Char.GetFaith.EvilGodNames]!“\n\nAť sen, nebo démon, nemohu přehlížet, co jsem [Select_CString(ROOT.Char.IsFemale,'spatřila','spatřil')]. Kéž mi [ROOT.Char.GetFaith.HighGodName] dopřeje smíření."
 pam_secular_faith_events.0048.a: "Ten sen... musí něco znamenat."
 pam_secular_faith_events.0048.b: "Byl to jen sen. Zpátky do postele."
 pam_secular_faith_events.0048.c: "Kéž mě [ROOT.Char.GetFaith.HighGodName] ochrání! Musím činit pokání."
 pam_sf_demon_torment_modifier_tt: "K odstranění tohoto modifikátoru musíš vystavět [Concept('holding','držbu')|E] [GetBuilding('temple_01').GetName] nebo se vydat na [CZActivity('activity_pilgrimage','A')|l]"
 pam_sf_demon_torment_lifted_toast: "Muka polevují"
 pam_secular_faith_events.0049.t: "„Nebeská hierarchie“"
 pam_secular_faith_events.0049.desc: "Zvuky z mé kaple nejsou modlitby.\n\n„Ano, #emp ANO#!, Tvá Milosti! Ukaž této bídné hříšné duši její místo v řádu [GetTenetType('tenet_celestial_hierarchy').GetName( GetNullCharacter.GetRite )]!“ vykřikuje v extázi [lustful_priest.GetFirstName], [Select_CString(lustful_priest.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', lustful_priest )|l]. „Jsem červ svíjející se v prachu, plný pozemských choutek. #emp POTRESTEJ MĚ!#!“\n\nKéž mi [ROOT.Char.GetFaith.HighGodName] vysvětlí, co se to děje v mé kapli!?"
 pam_secular_faith_events.0049.a: "Musí jít o nějaký obřad. [Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] bych si... dělat poznámky."
 pam_secular_faith_events.0049.b: "Jestli je to v #EMP mé#! kapli, tak se #emp přidám#!!"
 pam_secular_faith_events.0049.c: "[Select_CString(lustful_priest.IsFemale,'Zvrhlá','Zvrhlý')|U] [lustful_priest.GetFirstNameNoTooltip]!? Odporné, ale užitečné."
 pam_secular_faith_events.0050.t: "[chaplain.Custom('RomanticComplimentAdjective')|U] [chaplain.GetCouncilTitle|l]"
 pam_secular_faith_events.0050.desc: "[ROOT.Char.GetFaith.HouseOfWorship|U] osvětlují mihotající se svíce, ale nečisté myšlenky mi z hlavy nezaženou.\n\n„Pojď za mnou do zpovědnice, [ROOT.Char.Custom('FormOfAddressForLiege')|l],“ zašeptá [Select_CString(chaplain.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l]. Můj pohled poutá [chaplain.Custom('ObjectifiedFeature')|l]. „Ať tvou duši tíží cokoli, svěř se beze strachu.“\n\n[GetTenetType('tenet_confession')GetName( GetPlayer.GetRite )|U] je svatá věc... jeden hřích však tíží víc než ostatní. [chaplain.Custom('CZ_FirstNamePossessive_M')] půvab — [chaplain.Custom('AdmiredFeature')|l] — mi nedopřává klid."
 pam_secular_faith_events.0050.a: "...vejdeme se do tvé zpovědnice dva?"
 pam_secular_faith_events.0050.b: "Odpusť mi, [Select_CString(chaplain.IsFemale,'matko','otče')], neboť mám nečisté myšlenky."
 pam_secular_faith_events.0051.t: "Hospodin, tvůj Bůh"
 pam_secular_faith_events.0051.desc: "#EMP „Já jsem Hospodin Bůh tvůj,“#! duní hlas a [ROOT.Char.GetFaith.HouseOfWorship|l] se plní ozvěnou. #EMP „Poklekneš přede mnou.“#!\n\nPadnu na kolena, zrak se mi rozostří. Setřu si z tváře pramínek krve.\n\n#EMP „Já, Hospodin Bůh tvůj, ti přikazuji: Poslouchej mě celým svým srdcem i celou svou duší.“#! Z jednoho hlasu se stane sto. Ze sta tisíc. #EMP „Jestliže mě neposlechneš, budu tě proklínat až do tvé záhuby, neboť jsi [Select_CString(ROOT.Char.IsFemale,'opustila','opustil')] Hospodina, svého Boha.“#!"
 pam_secular_faith_events.0051.a: "Budu... poslouchat..."
 pam_sf_lord_your_god_effect_tt: "@alert_icon!#alert_trial Stane se něco strašného, nebo nádherného...#!"
 pam_sf_lord_your_god_tt: "Kéž se [ROOT.Char.GetFaith.HighGodName]... smiluje."
 pam_sf_voice_of_jesus_toast: "Ježíšův hlas"
 pam_sf_stroke_of_god_toast: "Boží zásah"
 pam_secular_faith_events.0052.t: "Až tu nebudeš"
 pam_secular_faith_events.0052.desc: "[ROOT.Char.GetFaith.HouseOfWorship|U] [CZPrepV(resting_church.GetNameNoTierNoTooltip)|l] [resting_church.Custom('CZ_LandedNameNoTier_L')] skrývá oprýskané náhrobní desky těch, kdo vládli přede mnou. U nich se zastaví [chaplain.GetFirstName], [Select_CString(chaplain.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l].\n\n„[ROOT.Char.GetFaith.HighGodName|U] ti dopřává víc zim než většině lidí, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Rozhodnout se, jak chceš spočinout, není hřích.“\n\n„Tvá podoba vytesaná do kamene, nebo [Glossary( 'prostá mnišská kutna', 'AD_SUCCURRENDUM_GLOSS' )|l] — volba je na tobě.“"
 pam_secular_faith_events.0052.a: "Vytesat mou podobu... ale mladší a pohlednější."
 pam_secular_faith_events.0052.b: "Prostá kutna postačí."
 pam_secular_faith_events.0052.c: "Hrob nikam neuteče."
 pam_sf_effigy_planned_tt: "Pokud se po tvé smrti bude konat [GetActivityType( 'activity_funeral').GetName|l], jeho hostitel získá [prestige_i]#P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#! [Concept('prestige','prestiže')|EU]"
 pam_sf_cowl_burial_planned_tt: "Pokud se po tvé smrti bude konat [GetActivityType( 'activity_funeral').GetName|l], jeho hostitel získá [piety_i]#P [EmptyScope.ScriptValue('medium_piety_gain')|0]#! [Concept('piety','zbožnosti')|EU]"
 pam_sf_effigy_unveiled_toast: "Odhalení podobizny"
 pam_sf_cowl_burial_toast: "Poslední odpočinek v kutně"
 AD_SUCCURRENDUM_GLOSS: "Zemřít #G ad succurrendum#! — přijmout mnišské sliby a hábit na smrtelné posteli — bývalo posledním východiskem velkých pánů středověkého křesťanstva. Umírající panovník doufal, že pohřben v prosté kutně místo hedvábí předstoupí před soud jako pokorný bratr, nikoli jako kníže."
 pam_secular_faith_events.0053.t: "Světec vyráží na cestu"
 pam_secular_faith_events.0053.desc: "[chaplain.GetFirstName|U], [Select_CString(chaplain.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l], zvedne víko relikviáře s péčí porodní báby. Uvnitř spočívá poklad mého rodu: [procession_relic.GetName].\n\n„Svatost pod zámkem nikomu neprospívá, [ROOT.Char.Custom('FormOfAddressForLiege')|l],“ zazní slova. „Dopřej svému lidu [Glossary( 'slavnostní ukázání', 'OSTENSION_GLOSS' )|l] — relikvii je třeba ukázat a požehnat každé ulici od těchto dveří až k branám.“"
 pam_secular_faith_events.0053.a: "Relikviář ponesu [Select_CString(ROOT.Char.IsFemale,'sama','sám')]."
 pam_secular_faith_events.0053.b: "Tuto vigilii budu držet o samotě."
 pam_secular_faith_events.0053.c: "Neodvažuji se s ním hnout."
 pam_sf_procession_gamble_tt: "Ulice nejsou žádná klenotnice, artefakt by se mohl poškodit..."
 pam_sf_relic_jostled_toast: "Otřesy v davu"
 OSTENSION_GLOSS: "Slavnostní ukazování světcových ostatků. O velkých svátcích se relikvie vynášely z trezorů a nesly v procesí ulicemi a přes pole, aby požehnání spojené s oltářem mohlo zasáhnout každou duši na trase. Relikvie vynesená na veřejnost přilákala davy, peníze i slávu."
 pam_secular_faith_events.0054.t: "Mísa a rouška"
 pam_secular_faith_events.0054.desc: "Mísa se kouří a [ROOT.Char.Custom('GetCourt')|l] se shromáždil, aby přihlížel. Nervózní [pauper.Custom2('dummy_peasant_profession', pauper)|l] sedí na stoličce s bosýma nohama obalenýma špínou. Ten pach je... nezaměnitelný.\n\nPrávě této noci Spasitel poklekl s mísou a rouškou. Obřad [Glossary( 'mandatum', 'MANDATUM_GLOSS' )|l] je připraven a všechny oči v místnosti se upírají na mě.\n\nZbývá jen pokleknout — nebo si to rozmyslet."
 pam_secular_faith_events.0054.deviant: "#EMP Očistím ty rozkošné nohy jazykem.#!"
 pam_secular_faith_events.0054.a: "Pokleknu a chopím se roušky."
 pam_secular_faith_events.0054.b: "Pokleknu a políbím ty unavené nohy."
 pam_secular_faith_events.0054.c: "Já... nemohu. Odneste tu mísu."
 pam_sf_odorous_feet_tt: "Když pokleknu, možná mě naplní svatost... anebo se mě pach selských nohou už nikdy nezbaví"
 pam_sf_odorous_feet_toast: "Zápach přetrvává"
 MANDATUM_GLOSS: "Obřad mytí nohou, který vychází z Kristových slov při poslední večeři: #G „Mandatum novum do vobis“#! — „nové přikázání vám dávám“. Na Zelený čtvrtek tak vládci klekali s mísou a rouškou, aby umyli nohy několika chudákům a vtiskli jim do dlaní stříbro."
 pam_secular_faith_events.0055.t: "Bronzový hlas"
 pam_secular_faith_events.0055.desc: "[bell_church.GetName|U] potřebuje nový kostelní zvon — starý praskl, a tak byl přelit. Nový se třpytí vysoko ve věži. Dole už čeká [chaplain.GetFirstName], [Select_CString(chaplain.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l], s vodou, posvátným olejem a solí.\n\n„Aby skrze zvon zazněl hlas, jímž promlouvá [ROOT.Char.GetFaith.HighGodName], musí být [Glossary( 'pokřtěn', 'BELL_BAPTISM_GLOSS' )|l],“ zazní naléhavě, zatímco rukávy putují vzhůru. „Umyt, pomazán a pojmenován — a pak už jeho hlas neumlčí žádný démon ani bouře.“"
 pam_secular_faith_events.0055.a: "Ať je tedy umyt, pomazán a pojmenován."
 pam_secular_faith_events.0055.b: "Je to bronz, ne duše — kapituláře říkají totéž."
 pam_secular_faith_events.0055.c: "Postačí krátké požehnání. Ať zvoní."
 BELL_BAPTISM_GLOSS: "Kostelní zvony se světily podobně jako křesťané: omývaly se svěcenou vodou, pomazávaly olejem a dostávaly jméno světce — některým se dokonce vybírali kmotři. Karlův #G Admonitio Generalis#! křty zvonů v roce 789 zakázal, ale tento zvyk přetrval ještě po staletí. Lidé věřili, že pokřtěný zvon zažene bouře, kroupy i démony všude, kam dosáhne jeho hlas; později slévači odlévali na zvony motto #G Fulgura frango#! — „Lámu blesky.“"
 pam_secular_faith_events.0056.t: "Vrabec v síni"
 pam_secular_faith_events.0056.desc: "Zimní nocí vletí vrabec, proplete se kouřem z pochodní a smíchem a proletí místnost — [ROOT.Char.Custom('ResidenceBuildingHallType')|l] ho nezadrží. Otvor, který tvoří [ROOT.Char.Custom('ResidenceBuildingWindowType')|l], ho zase propustí do tmy.\n\n[ROOT.Char.Custom('GetCourt')|U] se směje. [chaplain.GetFirstName], [Select_CString(chaplain.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l], nikoli.\n\n„[Glossary( 'Takový je lidský život', 'BEDE_SPARROW_GLOSS' )|U], [ROOT.Char.Custom('FormOfAddressForLiege')|l] — okamžik světla a tepla mezi jednou temnotou a druhou. Co bylo předtím a co přijde potom, ví jen [ROOT.Char.GetFaith.HighGodName].“"
 pam_secular_faith_events.0056.scholar: "Beda napsal totéž, skoro doslova."
 pam_secular_faith_events.0056.a: "Pak ať ten okamžik ve světle dobře využijeme."
 pam_secular_faith_events.0056.b: "Byl to pták. Přineste další víno."
 BEDE_SPARROW_GLOSS: "Podle Bedova vyprávění přirovnal jeden z rádců krále Edwina život k vrabci, který za zimní noci prolétne teplou hodovní síní: krátkému okamžiku světla a pohodlí mezi bouřemi, jehož začátek i konec jsou neznámé. Jestliže nová víra dokázala vysvětlit, co leží za hostinou, zasloužila si být vyslechnuta — a Edwin se nechal přesvědčit."
 pam_secular_faith_events.0057.t: "Církevní pivo"
 pam_secular_faith_events.0057.desc: "Na kostelním hřbitově [CZPrepV(ale_church.GetNameNoTooltip)|l] [CZProvName(ale_church,'L')] jsou stoly obsazené téměř celou farností. Hostinu řídí [chaplain.GetFirstName], [Select_CString(chaplain.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l], s plným korbelem v ruce. Sudy dodala budova [GetBuilding('breweries_01').GetName].\n\n„Střechou nám zatéká, [ROOT.Char.Custom('FormOfAddressForLiege')|l], a desátek je příliš nízký. Bratři tedy vaří pivo, my ho prodáváme a farnost pije [Glossary( 'farní pivo', 'CHURCH_ALE_GLOSS' )|l], dokud střechu nezaplatíme.“\n\n„Každý korbel je dobrý skutek. Dáš si?“"
 pam_secular_faith_events.0057.a: "Tak mi podejte pohár. Kvůli té střeše."
 pam_secular_faith_events.0057.b: "Pivo si nechte — střechu zaplatím [Select_CString(ROOT.Char.IsFemale,'sama','sám')]."
 pam_secular_faith_events.0057.c: "Pít? Na posvátné půdě? Vylijte to."
 pam_sf_church_ale_gamble_tt: "Každý pohár jde na opravu střechy a farní pivo je silné..."
 pam_sf_church_ale_toast: "Ráno s bolavou hlavou"
 CHURCH_ALE_GLOSS: "Farní slavnost, při níž se na kostelním hřbitově prodávalo pivo uvařené z darovaného sladu a výtěžek se používal na údržbu kostela — na opravu zatékající střechy, nový zvon nebo chléb pro chudé. Synoda za synodou pití na posvátné půdě odsuzovala a farnost za farností dál vařila; v mnoha vesnických kostelech zaplatilo pivo víc než kdy desátek."
 pam_secular_faith_events.0058.t: "Co jí myš?"
 pam_secular_faith_events.0058.desc: "[chaplain.GetFirstName|U], [Select_CString(chaplain.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l], vtrhne dovnitř s tváří bledou jako oltářní plátno. Malou stříbrnou [Glossary( 'pyxidu', 'PYX_GLOSS' )|l] drží, jako by pálila.\n\n„Myš, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Dnes v noci prokousala schránku a snědla [Glossary( 'posvěcený chléb', 'RESERVED_HOST_GLOSS' )|l]!“\n\nSlova téměř nejdou přes rty. „Učenci se ptají [Glossary( 'quid mus sumit', 'QUID_MUS_SUMIT_GLOSS' )] — co tedy ta myš snědla? Co mám dělat?“"
 pam_secular_faith_events.0058.scholar: "Uklidni se. Myš snědla chléb, nic víc."
 pam_secular_faith_events.0058.mean: "[Select_CString(chaplain.IsFemale,'Nechala','Nechal')|U] jsi #EMP myš#! hodovat, a tak jí za pokrm slouží [ROOT.Char.GetFaith.HighGodName]?! [ROOT.Char.Custom('GetCourt')|U] pro tebe nemá místo!"
 pam_secular_faith_events.0058.a: "Kup pyxidu s lepším zámkem."
 pam_secular_faith_events.0058.b: "Takže je ta myš zatracená? Cha!"
 QUID_MUS_SUMIT_GLOSS: "#G Quid mus sumit?#! — „Co jí myš?“ Učenci o tom vážně debatovali: jestliže myš prokousala posvěcenou hostii, snědla tím Boží tělo? Církevní právo ukládalo nedbalým kněžím pokání a velcí učitelé rozhodli, že myš přijala pouze podobu chleba, neboť svátost se stáhla před nehodnými zuby."
 PYX_GLOSS: "Malá schránka s víčkem, obvykle ze stříbra nebo pozlacená, v níž se uchovává posvěcený chléb z mše. Církevní právo vyžadovalo, aby byla čistá, zamčená a chráněná před znesvěcením — i před hladovými návštěvníky."
 RESERVED_HOST_GLOSS: "Chléb posvěcený při mši a uchovávaný v kostele, aby jej mohli nemocní a umírající přijmout kdykoli. Věřilo se, že posvěcený chléb je skutečným Božím tělem, a jeho bezpečné uchovávání se proto považovalo za nanejvýš důležité."
 pam_secular_faith_events.0059.t: "Den Páně"
 pam_secular_faith_events.0059.desc: "Za úsvitu dorazila zpráva o zvěři: [sighting_county.Custom('GetAnimalAdjective')|l] [sighting_county.Custom('GetAnimalType')|l] se objevuje [sighting_province.Custom('CZ_GetTerrainTypePlural_In')|l] [CZPrepV(sighting_county.GetBaseNameNoTier)|l] [sighting_county.Custom('CZ_LandedNameNoTier_L')]. Psi štěkají a koně podupávají na dvoře — ale [chaplain.GetFirstName], [Select_CString(chaplain.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l], stojí pevně v bráně.\n\n„Je [Glossary( 'den odpočinku', 'LORDS_DAY_GLOSS' )|l], [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Zvon už odbil a čeká nás mše!“\n\n„[ROOT.Char.GetFaith.HighGodName|U] ti dopřává šest dní na jízdu. Musíš zatoužit i po tomto?“"
 pam_secular_faith_events.0059.a: "Odsedlejte koně. Vyslechneme mši."
 pam_secular_faith_events.0059.b: "[sighting_county.Custom('GetAnimalType')|U] nepočká. Jedeme!"
 LORDS_DAY_GLOSS: "První den týdne, který se světí na památku Vzkříšení. Církevní sněmy zakazovaly světskou práci, trhy i zahálčivé zábavy a křesťanští králové tento zákaz zakotvovali v zákonech — ačkoli mnohý pán považoval jelena, stejně jako kázání, za záležitost mezi sebou a Bohem."
 pam_secular_faith_events.0060.t: "Život bez břemene"
 pam_secular_faith_events.0060.desc: "Projíždím ulicemi [ROOT.Char.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_G')]. Trápí mě prázdná pokladnice i vnitřní neklid, když spatřím [Select_CString(hermit.IsFemale,'žebračku','žebráka')].\n\nTančí [Select_CString(hermit.IsFemale,'nezatížená','nezatížený')] světským majetkem, s klidem a porozuměním člověka, který přijal své místo ve světě. Duše osvobozená od trápení, jež sužuje mě.\n\nSnad vidí pravdu, která by mohla osvobodit i mě."
 pam_secular_faith_events.0060.a: "Čím méně toho mám, tím víc jsem!"
 pam_secular_faith_events.0060.b: "Ještě jednou pozlatím svou klec!"
 pam_secular_faith_events.0060.c: "Dostaňte mě z toho deště."
