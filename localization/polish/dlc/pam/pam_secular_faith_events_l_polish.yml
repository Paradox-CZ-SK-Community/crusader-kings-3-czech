l_polish:
 pam_sf_seeded_tenet_desc: "Praxe přesahující hranice vaší vlastní [faith|E] se vám usadila v myšlenkách a získali jste [agnostic_knowledge|E] o [core_tenet|E] [pam_sf_seeded_tenet.GetBaseName]." # todo: NEW TRANSLATION
 pam_sf_friend_godparent: "[CHARACTER.GetShortUIName|U] byl(a) kmotrem [TARGET_CHARACTER.GetShortUIName] a duchovní pouto přerostlo v přátelství." # todo: NEW TRANSLATION
 pam_sf_friend_godparent_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] byl(a) kmotrem [CHARACTER.GetShortUIName] a duchovní pouto přerostlo v přátelství." # todo: NEW TRANSLATION
 pam_sf_friend_shared_conviction: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] se sblížili díky společnému náboženskému přesvědčení." # todo: NEW TRANSLATION
 pam_sf_best_friend_shared_conviction: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] se stali nejlepšími přáteli a jejich pouto posílilo společné náboženské přesvědčení." # todo: NEW TRANSLATION
 pam_sf_friend_shielded: "[CHARACTER.GetShortUIName|U] ochránil(a) [TARGET_CHARACTER.GetShortUIName] před náboženským pronásledováním." # todo: NEW TRANSLATION
 pam_sf_friend_shielded_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] ochránil(a) [CHARACTER.GetShortUIName] před náboženským pronásledováním." # todo: NEW TRANSLATION
 pam_sf_lover_shared_conviction: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] se stali milenci, které svedlo dohromady společné náboženské přesvědčení." # todo: NEW TRANSLATION
 pam_sf_lover_carnal_revelation: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] se stali milenci během noci plné společného, posvátného opojení." # todo: NEW TRANSLATION
 pam_sf_lover_confessional: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] našli ve zpovědnici víc než rozhřešení a stali se milenci." # todo: NEW TRANSLATION
 pam_sf_lover_two_faiths: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] se stali milenci poté, co spolu rozmlouvali o složitostech víry." # todo: NEW TRANSLATION
 pam_sf_soulmate_shared_conviction: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] se stali spřízněnými dušemi a jejich lásku prohloubilo společné náboženské přesvědčení." # todo: NEW TRANSLATION
 pam_sf_rival_bought_office: "[CHARACTER.GetShortUIName|U] prodal(a) posvátný úřad [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltip] cizinci, který za něj mohl zaplatit." # todo: NEW TRANSLATION
 pam_sf_rival_bought_office_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] prodal(a) posvátný úřad [CHARACTER.GetShortUINamePossessiveNoTooltip] cizinci, který za něj mohl zaplatit." # todo: NEW TRANSLATION
 pam_sf_nemesis_forced_to_cloister: "[TARGET_CHARACTER.GetShortUIName|U] donutil(a) [CHARACTER.GetShortUIName] vstoupit do kláštera a složit řeholní sliby." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [CHARACTER.GetHerHim]
 pam_sf_nemesis_forced_to_cloister_corresponding: "[CHARACTER.GetShortUIName|U] donutil(a) [TARGET_CHARACTER.GetShortUIName] vstoupit do kláštera a složit řeholní sliby." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [TARGET_CHARACTER.GetHerHim]
 pam_my_liege_reverend_father: "ctihodný otče" # todo: NEW TRANSLATION
