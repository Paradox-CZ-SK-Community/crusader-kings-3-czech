 pam_my_liege_khatun: "velká chatun" # todo: NEW TRANSLATION
 pam_my_liege_chieftain: "můj náčelníku" # todo: NEW TRANSLATION
 pam_my_liege_serene_lord: "nejjasnější pane" # todo: NEW TRANSLATION
 pam_my_liege_serene_lady: "nejjasnější paní" # todo: NEW TRANSLATION
 pam_my_liege_lord: "můj pane" # todo: NEW TRANSLATION
 pam_my_liege_lady: "má paní" # todo: NEW TRANSLATION
 pam_my_liege_liege: "můj lenní pane" # todo: NEW TRANSLATION
 pam_secular_faith_events.0001.t: "Svatý kouř" # todo: NEW TRANSLATION
 pam_secular_faith_events.0001.desc: "Můj [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], nese kadidelnici hlavní lodí. Svatý kouř stoupá ke krovům a nese s sebou tlumené modlitby shromážděných.\n\nNa okamžik se zdá, že celé stvoření vzhlíží k [ROOT.Char.GetFaith.PositiveAfterLife] — a já s ním." # todo: NEW TRANSLATION
 pam_secular_faith_events.0001.a: "Ponořím se do modlitby." # todo: NEW TRANSLATION
 pam_secular_faith_events.0001.b: "Tento obřad by měl být zasvěcen [ROOT.Char.GetFaith.WealthGodName]." # todo: NEW TRANSLATION
 pam_secular_faith_events.0001.c: "[ROOT.Char.Custom('GetCourt')] by se měl podílet na této zbožnosti." # todo: NEW TRANSLATION
 pam_secular_faith_events.0002.t: "Pikuach nefeš" # todo: NEW TRANSLATION
 pam_secular_faith_events.0002.desc: "[traveler_in_danger.GetTitledFirstName], poutník procházející mými zeměmi, byl(a) napaden(a) bandity v oblasti [background_terrain_scope.GetName]!\n\n[traveler_in_danger.GetHerHis|U] život je v nebezpečí, ale chopit se zbraně o svatém dni [ROOT.Char.GetFaith.HighGodNamePossessive] je zakázáno. Šabat není můj, abych ho porušoval(a). Pokud počkám do západu slunce, možná vyrazím jen proto, abych [traveler_in_danger.GetHerHim] pohřbil(a).\n\nMohu však nečinně přihlížet, když jde o život?" # todo: NEW TRANSLATION
 pam_secular_faith_events.0002.a: "Život má přednost před vším. Vyrazíme." # todo: NEW TRANSLATION
 pam_secular_faith_events.0002.b: "Musím se poradit se svým [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstNameNoTooltip]." # todo: NEW TRANSLATION
 pam_secular_faith_events.0002.c: "Šabat neporuším." # todo: NEW TRANSLATION
 pam_secular_faith_events.0003.t: "Vidění v noci" # todo: NEW TRANSLATION
 pam_secular_faith_events.0003.desc: "Probouzím se sevřen(a) něčím víc než jen snem — sloupem ohně, hlasem, který znal mé jméno, tváří, na kterou nemohu zapomenout...\n\nByl to snad [ROOT.Char.GetFaith.HighGodName], kdo ke mně přišel? [ROOT.Char.GetFaith.HealthGodName]? Anebo [ROOT.Char.GetFaith.DevilName] v líbivé přestrojení...\n\nMožná to byly jen horečnaté představy rozbouřené krve." # todo: NEW TRANSLATION
 pam_secular_faith_events.0003.a: "Hlas šeptal blažené pravdy..." # todo: NEW TRANSLATION
 pam_secular_faith_events.0003.b: "Horečnaté představy... Musím si o takových případech něco přečíst." # todo: NEW TRANSLATION
 pam_secular_faith_events.0003.c: "[ROOT.Char.Custom('GetCourt')] musí slyšet, co jsem spatřil(a)!" # todo: NEW TRANSLATION
 pam_secular_faith_events.0004.t: "Zakázaná pravda" # todo: NEW TRANSLATION
 pam_secular_faith_events.0004.desc: "Nemohu spát a zmítán(a) pochybnostmi přecházím po [ROOT.Char.Custom('ResidenceBuildingHallsType')] svého [ROOT.Char.Custom('ResidenceBuilding')].\n\nMé myšlenky se stále vracejí k něčemu, co má víra zavrhuje: [pam_sf_forbidden_tenet.GetBaseName]. Mělo by mě to znepokojovat — ale cítím, že v tomto přesvědčení je spravedlivá pravda, a nedokážu se té pochybnosti zbavit." # todo: NEW TRANSLATION
 pam_secular_faith_events.0004.a: "Budu se této pravdy držet — ale potají." # todo: NEW TRANSLATION
 pam_secular_faith_events.0004.b: "Ne. Nesejdu z cesty." # todo: NEW TRANSLATION
 pam_secular_faith_events.0005.t: "Při svíčce" # todo: NEW TRANSLATION
 pam_secular_faith_events.0005.desc_intro: "Večerní studium mě mělo uklidnit, ale jedna pasáž mi stále tančí v myšlenkách.\n\n" # todo: NEW TRANSLATION
 pam_secular_faith_events.0005.desc_tenet: "Týká se zásady známé jako [pam_sf_revelation_tenet.GetBaseName], praxe, kterou by má víra bez váhání odsoudila. Říkám si, že je barbarská." # todo: NEW TRANSLATION
 pam_secular_faith_events.0005.desc_doctrine: "Týká se nauky [pam_sf_revelation_doctrine.GetDescriptiveName( ROOT.Char.GetFaith.Self )], kterou by má víra bez váhání odsoudila. Říkám si, že je mylná." # todo: NEW TRANSLATION
 pam_secular_faith_events.0005.desc_end: "A přesto při svíčce chápu, proč se jí může jiná duše držet." # todo: NEW TRANSLATION
 pam_secular_faith_events.0005.a: "Musím své myšlenky přenést na papír." # todo: NEW TRANSLATION
 pam_secular_faith_events.0005.b: "Není na škodu tomu porozumět." # todo: NEW TRANSLATION
 pam_secular_faith_events.0005.c: "Modlitba tyto myšlenky očistí." # todo: NEW TRANSLATION
 pam_secular_faith_events.0006.t: "Kosti světce" # todo: NEW TRANSLATION
 pam_secular_faith_events.0006.desc: "Na tržišti mě zaujme poutník zmožený cestou. V [relic_seller.GetHerHis] třesoucích se rukou leží zažloutlá kůstka z prstu.\n\n"Kost světce," zapřísahá se [relic_seller.GetWomanMan]. "Našel(a) jsem ji na cestě do [GetTitleByKey('c_jerusalem').Custom('CZ_LandedNameNoTier_G')], ale v rukou [ROOT.Char.GetTitleAsNameNoTooltip] by byla v bezpečí."\n\nZkušené oko by mohlo posoudit, zda je to pravda. A relikvie je příhodně na prodej." # todo: NEW TRANSLATION
 pam_secular_faith_events.0006.a: "Než zaplatím, dovolte mi ji posoudit." # todo: NEW TRANSLATION
 pam_secular_faith_events.0006.b: "Vezmu si ji." # todo: NEW TRANSLATION
 pam_secular_faith_events.0006.c: "Cizí kosti mi k ničemu nejsou. Zmiz." # todo: NEW TRANSLATION
 pam_sf_acquire_relic_tt: "Získáte relikvii [artifact|E] běžné [rarity|E]" # todo: NEW TRANSLATION
 pam_sf_examine_relic_tt: "Získáte relikvii [artifact|E], jejíž [rarity|E] ovlivní vaše [learning_i][learning_skill|E]" # todo: NEW TRANSLATION
 pam_sf_acquire_relic_toast: "Získána svatá relikvie" # todo: NEW TRANSLATION
 pam_sf_fingerbone_relic_name: "Kůstka z prstu svatého [SCOPE.Custom('PamFingerboneSaint')]" # todo: NEW TRANSLATION
 pam_sf_fingerbone_relic_desc: "Zažloutlá kůstka z prstu, uctívaná jako relikvie svatého [SCOPE.Custom('PamFingerboneSaint')] a uložená v malé schránce." # todo: NEW TRANSLATION
 pam_secular_faith_events.0007.t: "Arogantní biskup" # todo: NEW TRANSLATION
 pam_secular_faith_events.0007.desc: "Jeden z mých vlastních [defiant_bishop.GetTitleAsNameNoTooltip]ů, [defiant_bishop.GetFirstName], je pyšný, má vlivné známosti a potají je přesvědčený, že je lepší než já. Několik služebníků nedávno onemocnělo a potřebuji, aby požehnal mé domácnosti.\n\nPo několika dnech, kdy ignoroval mé předvolání, konečně přichází. „Omluvil bych se za to zpoždění,“ ušklíbne se, „ale sloužím většímu pánu, než je kterýkoli [ROOT.Char.GetTitleAsNameNoTooltip].“" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [defiant_bishop.GetHerHim], [defiant_bishop.GetSheHe], [defiant_bishop.GetSheHe], [defiant_bishop.GetSheHe]
 pam_secular_faith_events.0007.a: "Přistupme k tomu s důstojností, jakou si váš úřad zaslouží." # todo: NEW TRANSLATION
 pam_secular_faith_events.0007.b: "Prosím. Prostě proveďte obřad." # todo: NEW TRANSLATION
 pam_secular_faith_events.0007.c: "[ROOT.Char.GetFaith.HighGodName] je možná váš pán, ale já jsem váš lenní pán. Ven!" # todo: NEW TRANSLATION
 pam_secular_faith_events.0008.t: "Tíha hříchu" # todo: NEW TRANSLATION
 pam_secular_faith_events.0008.desc: "Svíce dohořívají a ta samá myšlenka se vrací. Jsem [penance_sin.GetName( ROOT.Char )] a má víra to považuje za hřích.\n\nAť se snažím tu myšlenku zahnat sebevíc, pocit viny zůstává.\n\n"Ukázni se a tvá duše se zbaví svého břemene." Můj [ROOT.Char.Custom2( 'RelationToMeShort', confessor )], [confessor.GetFirstName], mi nic nevyčítá ani mě neodsuzuje. "Dodržuj toto pokání. Nesejdi z cesty."" # todo: NEW TRANSLATION
 pam_secular_faith_events.0008.a: "Učiním, jak mi [confessor.GetFirstNameNoTooltip] radí." # todo: NEW TRANSLATION
 pam_secular_faith_events.0008.b: "Teď ne. Ještě nejsem připraven(a)." # todo: NEW TRANSLATION
 pam_secular_faith_events.0009.t: "Cizinec podobný Kristu" # todo: NEW TRANSLATION
 pam_secular_faith_events.0009.desc: "U mé brány žebrá o almužnu osamělý, zjizvený cizinec.\n\n„Odpusťte mi vyrušení, [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitleAsNameNoTooltip],“ pronese [stranger.GetSheHe] s půvabnou úklonou. „Pokud vám to vaše poměry dovolují, prosím vás jen o malý podíl z vašeho bohatství.“\n\nNa žebráka mluví [stranger.GetSheHe|U] nezvykle uhlazeně. Člověk nikdy neví, koho odmítne." # todo: NEW TRANSLATION
 pam_secular_faith_events.0009.a: "Pojď dál, můj [ROOT.Char.Custom('ResidenceBuilding')] je ti otevřen." # todo: NEW TRANSLATION
 pam_secular_faith_events.0009.b: "Vezmi si tento chléb a jdi v pokoji." # todo: NEW TRANSLATION
 pam_secular_faith_events.0010.t: "Kdo přišel z mrazu" # todo: NEW TRANSLATION
 pam_secular_faith_events.0010.desc_blessed: "[stranger.GetWomanMan], kterého jsem vpustil(a) branou, není žádný obyčejný tulák — [stranger.GetFirstName] mluví o písmu i státnictví tak snadno, že i moji učenci ztichnou a naslouchají.\n\nZdá se, že [ROOT.Char.GetFaith.HighGodName] přece jen přišel k mé bráně. Nedovolím, aby [stranger.GetHerHim] odešel." # todo: NEW TRANSLATION
 pam_secular_faith_events.0010.desc_thief: "Probouzím se a v krbu zbyl jen popel a truhla je prázdná.\n\nChléb a přístřeší mi oplatili nejstarší ze všech zrad.\n\n[stranger.GetFirstName] zmizel(a) v noci a mé bohatství s [stranger.GetHerHim].\n\nNež se služebnictvo probere, je [stranger.GetSheHe] dávno za mými hradbami a pryč z mého dosahu." # todo: NEW TRANSLATION
 pam_secular_faith_events.0010.a: "Byl(a] jsi sem poslán(a) z nějakého důvodu." # todo: NEW TRANSLATION
 pam_secular_faith_events.0010.b: "Pozval(a) jsem si zmiji ke stolu." # todo: NEW TRANSLATION
 pam_secular_faith_events.0011.t: "Kajícníci" # todo: NEW TRANSLATION
 pam_secular_faith_events.0011.desc: "Neprobouzí mě hrom, nýbrž praskání důtek.\n\nPřed mým [ROOT.Char.Custom('ResidenceBuilding')] se shromáždil zástup kajícníků. Mají rozedřená a zakrvácená záda a hlásají, že [ROOT.Char.GetFaith.HighGodName] požaduje [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetNullCharacter.GetRite )].\n\nMá domácnost čeká, že ji povedu." # todo: NEW TRANSLATION
 pam_secular_faith_events.0011.a: "Neskrývá se v tom hlubší pravda?" # todo: NEW TRANSLATION
 pam_secular_faith_events.0011.b: "Dejte mi důtky — i já jsem zhřešil(a)." # todo: NEW TRANSLATION
 pam_secular_faith_events.0011.c: "Vyžeňte toto šílenství z mých zemí!" # todo: NEW TRANSLATION
 pam_secular_faith_events.0012.t: "Požehnání zbraní" # todo: NEW TRANSLATION
 pam_secular_faith_events.0012.desc: "Mír je půjčka, nikdy dar.\n\nO svátku [ROOT.Char.GetFaith.WarGodName] mi můj [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], nabízí vysvětit zbraně mé domácnosti.\n\n"Bože, jenž jsi dal Davidovi sílu proti Goliášovi, vlož tutéž sílu do rodu [ROOT.Char.GetHouse.GetBaseName] — kéž vždy povstaneš na obranu slabých," modlí se [chaplain.GetSheHe]." # todo: NEW TRANSLATION
 pam_secular_faith_events.0012.a: "Požehnej mým praporům a čepelím pro den, kdy jich bude třeba." # todo: NEW TRANSLATION
 pam_secular_faith_events.0012.b: "Modleme se raději za mír." # todo: NEW TRANSLATION
 pam_secular_faith_events.0012.c: "Postačí tiché požehnání." # todo: NEW TRANSLATION
 pam_secular_faith_events.0013.t: "Předpovězená smrt" # todo: NEW TRANSLATION
 pam_secular_faith_events.0013.desc: "Přivedli přede mě divokookého kazatele. [prophet.GetSheHe] je obviněn z podněcování davů a věštění a neztrácí čas, než na mou [ROOT.Char.Custom2( 'RelationToMeShort', doomed_soul )], [doomed_soul.GetTitledFirstName], namíří roztřesený prst.\n\n„Pohleďte na něj!“ vykřikne [prophet.GetSheHe]. „Ještě před příštím novoluním bude [doomed_soul.GetSheHe] ležet chladný v zemi. [ROOT.Char.GetFaith.HighGodName] mi ukázal přesnou hodinu!“\n\nJistota, s jakou [prophet.GetHerHis|U] mluví, je znepokojivá. Ještě víc mě však zneklidňuje strach [doomed_soul.GetFirstNamePossessiveNoTooltip]." # todo: NEW TRANSLATION
 pam_secular_faith_events.0013.a: "[ROOT.Char.GetFaith.HighGodName] promlouvá i skrze podivná ústa..." # todo: NEW TRANSLATION
 pam_secular_faith_events.0013.b: "Pryč s tebou, šílený blázne!" # todo: NEW TRANSLATION
 prophecy_foretold_tt: "Proroctví je vyřčeno. Co když je pravdivé?" # todo: NEW TRANSLATION
 prophecy_foretold_2_tt: "Proroctví je vyřčeno. Naprostý nesmysl!" # todo: NEW TRANSLATION
 pam_secular_faith_events.0014.t: "Naplnění proroctví" # todo: NEW TRANSLATION
 pam_secular_faith_events.0014.desc_fulfilled: "Uplynul nový měsíc a [doomed_soul.GetTitledFirstName] je mrtvý — tiše zesnul(a) ve [doomed_soul.GetHerHis] spánku.\n\nOtrhaný kazatel určil přesnou hodinu. Na to nemohu zapomenout.\n\nBylo to proroctví... nebo strach, který nabyl těla?" # todo: NEW TRANSLATION
 pam_secular_faith_events.0014.desc_failed: "Přišel další novoluní a [doomed_soul.GetTitledFirstName] stále žije. Hodina, kterou otrhaný kazatel předpověděl, přišla a odešla, aniž se cokoli stalo.\n\n[prophet.GetSheHe|U] je podvodník, nebo hlupák, ale rozhodně není hlasem [ROOT.Char.GetFaith.HighGodName]." # todo: NEW TRANSLATION
 pam_secular_faith_events.0014.desc_wrong_prediction: "\n\nCítím se pěkně hloupě." # todo: NEW TRANSLATION
 pam_secular_faith_events.0014.a: "[prophet.GetSheHe|U] je skutečný prorok!" # todo: NEW TRANSLATION
 pam_secular_faith_events.0014.b: "[ROOT.Char.GetFaith.HighGodName] pracuje tajemnými způsoby." # todo: NEW TRANSLATION
 pam_secular_faith_events.0014.c: "Proč jsem jen uvěřil[prophet.GetHerHis] zatracenému proroctví!?" # todo: NEW TRANSLATION
 pam_secular_faith_events.0014.d: "Měl jsem tomu proroctví uvěřit..." # todo: NEW TRANSLATION
 pam_secular_faith_events.0014.e: "Kazatel byl podvodník, přesně jak jsem říkal!" # todo: NEW TRANSLATION
 gains_religious_inspiration_tt: "[prophet.GetShortUIName|U] získá náboženskou [inspiration|E]" # todo: NEW TRANSLATION
 pam_secular_faith_events.0015.t: "Plačící ikona" # todo: NEW TRANSLATION
 pam_secular_faith_events.0015.desc: "Můj [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], mě spěšně vede do [miracle_church.GetName]. Uvnitř z malovaných očí světce kanou slzy vonného oleje.\n\nZpráva o zázraku předběhne každého posla a zázrak je mocná, nebezpečná věc." # todo: NEW TRANSLATION
 pam_secular_faith_events.0015.a: "Zázrak? Musíme to prošetřit." # todo: NEW TRANSLATION
 pam_secular_faith_events.0015.b: "Ať přijdou věřící. Přijmeme je." # todo: NEW TRANSLATION
 pam_secular_faith_events.0015.c: "O toto požehnání se dělit nebudeme." # todo: NEW TRANSLATION
 pam_secular_faith_events.0015.d: "Má říše je požehnaná!" # todo: NEW TRANSLATION
 no_miracles_tt: "Na tom zázraku něco smrdí..." # todo: NEW TRANSLATION
 pam_secular_faith_events.0016.t: "Cena za kazatelnu" # todo: NEW TRANSLATION
 pam_secular_faith_events.0016.desc_intro: "[ROOT.Char.Custom2('DescriptorMixedArticle', SCOPE.sC('candidate'))|U] [candidate.GetWomanMan] vstoupí do mé [ROOT.Char.Custom('ResidenceBuilding')], nikoli aby prosil o laskavost, ale aby si ji koupil.\n\n„Váš [old_realm_priest.GetCouncilTitle], [old_realm_priest.GetFirstName], je skvělý pastýř,“ zamumlá [candidate.GetSheHe] a položí na stůl naditý měšec. „Já bych však mohl být... vděčnější. Jmenujte mě do [old_realm_priest.GetHerHis] úřadu a skliďte požehnání [ROOT.Char.GetFaith.WealthGodNamePossessive].“" # todo: NEW TRANSLATION
 pam_secular_faith_events.0016.desc_sanctioned: "\n\nNa [GetTenetType('tenet_simony').GetName( GetNullCharacter.GetRite )] není nic hanebného a stříbro je dobré." # todo: NEW TRANSLATION
 pam_secular_faith_events.0016.desc_sinful: "\n\n[GetTenetType('tenet_simony').GetName( GetNullCharacter.GetRite )] je hřích. Přijmout to zlato by pošpinilo mou duši." # todo: NEW TRANSLATION
 pam_secular_faith_events.0016.a: "Zlato má přece jen větší váhu než hřích..." # todo: NEW TRANSLATION
 pam_secular_faith_events.0016.b: "Spravedlivá cena, spravedlivě zaplacená. Úřad je váš." # todo: NEW TRANSLATION
 pam_secular_faith_events.0016.c: "Tento úřad není na prodej." # todo: NEW TRANSLATION
 pam_secular_faith_events.0017.t: "Kacíř na [ROOT.Char.Custom('GetCourt')|U]" # todo: NEW TRANSLATION
 pam_secular_faith_events.0017.desc: "„Kacíři!“ ukáže můj [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], obviňujícím prstem na [accused.GetFirstName]. „Copak nevidíš, jak zhoubný [accused.GetRite.GetAdjective] vliv má [accused.GetFirstNamePossessiveNoTooltip] na tvůj [ROOT.Char.Custom('GetCourt')]? [accused.GetSheHe|U] musí činit pokání a přijmout [ROOT.Char.GetFaith.HighGodName]!“\n\n[accused.GetFirstNameNoTooltip] zachovává kamennou tvář, ačkoli ho to obvinění zjevně ranilo." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [accused.GetHerHim]
 pam_secular_faith_events.0017.a: "[accused.GetFirstNameNoTooltip], dovol mi přivést tě k víře." # todo: NEW TRANSLATION
 pam_secular_faith_events.0017.a.success: "[accused.GetFirstNameNoTooltip] konvertuje" # todo: NEW TRANSLATION
 pam_secular_faith_events.0017.a.failure: "[accused.GetFirstName] to neobměkčí" # todo: NEW TRANSLATION
 pam_secular_faith_events.0017.b: "Pak čiň pokání v cele. Chopte se [accused.GetHerHim]." # todo: NEW TRANSLATION
 pam_secular_faith_events.0017.c: "[accused.GetFirstNameNoTooltip] je pod mou ochranou. Dost." # todo: NEW TRANSLATION
 pam_secular_faith_events.0018.t: "Dítě pro Boha" # todo: NEW TRANSLATION
 pam_secular_faith_events.0018.desc: "Můj [ROOT.Char.Custom2( 'RelationToMeShort', pious_child )], [pious_child.GetFirstName], se od ostatních dětí liší. Zatímco si ostatní hrají, [pious_child.GetSheHe] tráví [pious_child.GetHerHis] dny v kapli.\n\n„Nikdy jsem neviděl dítě jako [pious_child.GetHerHim],“ říká tiše můj [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName]. „[pious_child.GetSheHe|U] tráví hodiny modlitbami a při mši pláče. Je to nad slunce jasné: [pious_child.GetFirstNameNoTooltip] touží žít jako [GetTrait('devoted').GetName( pious_child )].“" # todo: NEW TRANSLATION
 pam_secular_faith_events.0018.a: "Služ [ROOT.Char.GetFaith.HighGodName], ale zůstaň tady." # todo: NEW TRANSLATION
 pam_secular_faith_events.0018.b: "Církev si vezme mé [pious_child.Custom('GetDaughterSon')]." # todo: NEW TRANSLATION
 pam_secular_faith_events.0018.c: "Ne, [pious_child.GetSheHe] patří k rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip]." # todo: NEW TRANSLATION
 pam_secular_faith_events.0019.t: "Boží mír" # todo: NEW TRANSLATION
 pam_secular_faith_events.0019.desc: "Můj [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], přichází s vážnou zprávou.\n\n„Bratr nesmí zabít bratra pod dohledem [ROOT.Char.GetFaith.HighGodNamePossessive],“ prohlašuje [chaplain.GetSheHe|U]. „[feud_attacker.GetTitledFirstName] a [feud_defender.GetTitledFirstName] tasili proti sobě meče a prostý lid krvácí kvůli jejich sporu!“\n\n„Učiňte tomu konec. Svažte je [GetTenetType('tenet_peace_of_god').GetName( GetNullCharacter.GetRite )].“" # todo: NEW TRANSLATION
 pam_secular_faith_events.0019.a: "Při [ROOT.Char.GetFaith.HighGodName] zavládne mír." # todo: NEW TRANSLATION
 pam_secular_faith_events.0019.b: "Každý pán, který tasil meč, se za to zodpoví." # todo: NEW TRANSLATION
 pam_secular_faith_events.0019.c: "Spory mých vazalů musím soudit já." # todo: NEW TRANSLATION
 pam_sf_peace_of_god_ends_wars_tt: "Každá [war|E] mezi vašimi [vassals|E] skončí [white_peace|E]" # todo: NEW TRANSLATION
 pam_secular_faith_events.0020.t: "[ROOT.Char.GetFaith.HouseOfWorship|U] [CZPrepV(temple_location.GetNameNoTooltip)] [CZProvNameNoTooltip(temple_location,'L')]" # todo: NEW TRANSLATION
 pam_secular_faith_events.0020.desc: "Zedníci usazují poslední kámen první [ROOT.Char.GetFaith.HouseOfWorship], kterou jsem kdy nechal postavit, zde [temple_location.Custom('CZ_TerrainTypeProvinceFull_In')] [CZPrepV(temple_location.GetNameNoTooltip)] [CZProvName(temple_location,'L')].\n\nMůj [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], prochází areálem s kadidelnicí v ruce.\n\n„Budou na vás vzpomínat díky [ROOT.Char.GetFaith.HouseOfWorshipPlural], které zasvětíte [ROOT.Char.GetFaith.HighGodName],“ říká [chaplain.GetSheHe]. „Ať je tato první z mnoha.“" # todo: NEW TRANSLATION
 pam_secular_faith_events.0020.a: "Veď nás v modlitbě, [chaplain.GetFirstNameNoTooltip]." # todo: NEW TRANSLATION
 pam_secular_faith_events.0020.b: "Ať [consecrated_county.GetNameNoTierNoTooltip] vzkvétá kolem [ROOT.Char.GetFaith.HouseOfWorship]." # todo: NEW TRANSLATION
 pam_secular_faith_events.0020.c: "Budu v těchto zdech hledat moudrost." # todo: NEW TRANSLATION
 pam_secular_faith_events.0020.d: "Práce [ROOT.Char.GetFaith.HighGodNamePossessive] teprve začala." # todo: NEW TRANSLATION
 pam_secular_faith_events.0021.t: "Znamení na nebesích" # todo: NEW TRANSLATION
 pam_secular_faith_events.0021.desc: "Nemohu usnout. Vyhledám tiché temno [ROOT.Char.Custom('GetCourtyard')] a vzhlédnu k obloze. Dnes v noci mi nebesa ukazují [ROOT.Char.Custom('GetPamCelestialOmen')].\n\nTaková znamení nikdy nejsou bez významu." # todo: NEW TRANSLATION
 pam_omen_blood_moon: "rudý měsíc" # todo: NEW TRANSLATION
 pam_omen_star_host: "zástup hvězd tam, kde žádné být nemají" # todo: NEW TRANSLATION
 pam_omen_comet: "kometa se dvěma ohony" # todo: NEW TRANSLATION
 pam_omen_falling_stars: "déšť padajících hvězd" # todo: NEW TRANSLATION
 pam_omen_moon_halo: "kruh bledého světla kolem měsíce" # todo: NEW TRANSLATION
 pam_omen_eclipse: "měsíc zastíněný do měděného srpku" # todo: NEW TRANSLATION
 pam_omen_wandering_star: "zářivá bludná hvězda" # todo: NEW TRANSLATION
 pam_secular_faith_events.0021.a: "Prostudují toto znamení." # todo: NEW TRANSLATION
 pam_secular_faith_events.0021.b: "Září jím přízeň [ROOT.Char.GetFaith.HighGodNamePossessive]." # todo: NEW TRANSLATION
 pam_secular_faith_events.0021.c: "Takové znamení věští vítězství!" # todo: NEW TRANSLATION
 pam_secular_faith_events.0021.d: "Nebesa mi nedluží žádné odpovědi." # todo: NEW TRANSLATION
 pam_secular_faith_events.0022.t: "Dotek [ROOT.Char.GetTitleAsNameNoTooltip]" # todo: NEW TRANSLATION
 pam_secular_faith_events.0022.desc_intro: "Můj [ROOT.Char.Custom2( 'RelationToMeShort', sick_courtier )], [sick_courtier.GetFirstName], se ke mně šourá, bledý a nejistý na nohou.\n\n" # todo: NEW TRANSLATION
 pam_secular_faith_events.0022.desc_ill: "„Chřadnu, [ROOT.Char.Custom('FormOfAddressForLiege')], strašlivě mě sužuje [illness_trait.GetName( GetNullCharacter )] a lék není v dohledu. Ani lékař [physician.GetTitledFirstName] neví, co mi je!“ naříká [sick_courtier.GetSheHe].\n\n" # todo: NEW TRANSLATION
 pam_secular_faith_events.0022.desc_other: "„Chřadnu, sužuje mě [illness_trait.GetName] a lék není v dohledu. Ani [physician.GetTitledFirstName] mi nedokáže pomoci!“ naříká [sick_courtier.GetSheHe].\n\n" # todo: NEW TRANSLATION
 pam_secular_faith_events.0022.desc_end: "„Říká se, že královská krev nese v prstech milost [ROOT.Char.GetFaith.HighGodNamePossessive]... a to je má poslední naděje.“" # todo: NEW TRANSLATION
 pam_secular_faith_events.0022.a: "Pojď. Položím na tebe ruce." # todo: NEW TRANSLATION
 pam_secular_faith_events.0022.b: "Ne... požehnám ti odtud." # todo: NEW TRANSLATION
 pam_sf_kings_touch_gamble_tt: "Můj dotek může [sick_courtier.GetFirstName] pomoci překonat nemoc, anebo se nemoc může přenést na mě..." # todo: NEW TRANSLATION
 pam_sf_kings_touch_cured_toast: "[sick_courtier.GetFirstName] vstává z lůžka" # todo: NEW TRANSLATION
 pam_sf_kings_touch_infected_toast: "Nemoc se přenese i na mě" # todo: NEW TRANSLATION
 pam_sf_kings_touch_nothing_toast: "Můj dotek [sick_courtier.GetFirstName] nijak neovlivní" # todo: NEW TRANSLATION
 pam_secular_faith_events.0023.t: "Putující písař" # todo: NEW TRANSLATION
 pam_secular_faith_events.0023.desc: "Přivedou přede mě vyhublého [scholar.GetWomanMan], jehož prsty jsou potřísněné inkoustem a pod paží má zastrčené svazky knih.\n\n„Jsem [scholar.GetFirstName], písař a učenec,“ pokračuje. „Nemám domov ani mecenáše. Tyto ruce nejsou stvořené k práci, nýbrž k zaznamenávání slov [ROOT.Char.GetTitleAsNameNoTooltip]a na [ROOT.Char.Custom('GetWritingMaterial')].“\n\n„Prosím vás, dejte mi chléb a střechu nad hlavou a já vám budu věrně sloužit.“" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [scholar.GetHerHis], [scholar.GetHerHis], [scholar.GetSheHe]
 pam_secular_faith_events.0023.a: "Učenec? Pouč mě o tom, co víš." # todo: NEW TRANSLATION
 pam_secular_faith_events.0023.b: "[scholar_church.GetNameNoTooltip] tě potřebuje." # todo: NEW TRANSLATION
 pam_secular_faith_events.0023.c: "Mé účetní knihy potřebují pevnou ruku." # todo: NEW TRANSLATION
 pam_secular_faith_events.0023.d: "Nepotřebuji tě. Zmiz." # todo: NEW TRANSLATION
 pam_secular_faith_events.0024.t: "Do kláštera" # todo: NEW TRANSLATION
 pam_secular_faith_events.0024.desc: "Můj [ROOT.Char.Custom2( 'RelationToMeShort', rival_character )], [rival_character.GetFirstName], je jako obvykle [rival_character.Custom2('InsultAdjectiveClumsy', ROOT.Char)] [rival_character.Custom2('InsultNounClumsy', ROOT.Char)] a [rival_character.Custom2('InsultAdjective', ROOT.Char)] [rival_character.Custom2('InsultNoun', ROOT.Char)] na [ROOT.Char.Custom('GetCourt')]. Přesto mi zvedne náladu dopis od [archbishop.GetTitledFirstName] z [archdiocese.GetName].\n\n„[rival_character.GetFirstName] by dobře sloužil [ROOT.Char.GetFaith.HighGodName],“ píše [archbishop.GetSheHe]. „Klášter [rival_character.GetHerHim] rád přijme.“\n\nSvět brzy zapomene na ty, kdo tam poklekají." # todo: NEW TRANSLATION
 pam_secular_faith_events.0024.a: "A tak [ROOT.Char.GetFaith.HighGodName] získá dalšího ‚ochotného‘ služebníka!" # todo: NEW TRANSLATION
 pam_secular_faith_events.0024.b: "Raději bych měl svého nepřítele na očích." # todo: NEW TRANSLATION
 pam_secular_faith_events.0025.t: "Bůh[ROOT.Char.GetMotherFather]" # todo: NEW TRANSLATION
 pam_secular_faith_events.0025.desc: "„Toužím přijmout [ROOT.Char.GetFaith.GetAdjective] víru tělem i duší,“ říká slavnostně můj [ROOT.Char.Custom2( 'RelationToMeShort', converting_char )], [converting_char.GetFirstName]. „Chci se nechat pokřtít a stát se [ROOT.Char.GetRite.GetAdherentName]... a prosím tě, abys stál/a vedle křtitelnice jako můj duchovní rodič [ROOT.Char.GetMotherFather].“" # todo: NEW TRANSLATION
 pam_secular_faith_events.0025.a: "Ať všichni vidí naše nové pouto!" # todo: NEW TRANSLATION
 pam_secular_faith_events.0025.b: "Víra nepotřebuje velkolepou podívanou." # todo: NEW TRANSLATION
 pam_secular_faith_events.0025.c: "Tuto poctu nemohu přijmout." # todo: NEW TRANSLATION
 pam_secular_faith_events.0026.t: "Obléhaná duše" # todo: NEW TRANSLATION
 pam_secular_faith_events.0026.desc: "Můj [ROOT.Char.Custom2( 'RelationToMeShort', afflicted )], [afflicted.GetFirstName], nikdy nebyl duševně zcela v pořádku... ale teď už to ani není [afflicted.GetHerselfHimself].\n\n„[ROOT.Char.GetFaith.EvilGodNames]! [ROOT.Char.GetFaith.EvilGodNames] je ve mně!“ blouzní [afflicted.GetSheHe] a zmítá se na podlaze [ROOT.Char.GetFaith.HouseOfWorship].\n\nMůj [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], zbledne. „[ROOT.Char.Custom('FormOfAddressForLiege')|U], obávám se, že [afflicted.GetHerHis] duši obléhají démoni. Jediný způsob, jak mu pomoci, je provést exorcismus.“" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [afflicted.GetHerHim], [afflicted.GetSheHe]
 pam_secular_faith_events.0026.a: "[afflicted.GetSheHe|U] potřebuje řádnou péči." # todo: NEW TRANSLATION
 pam_secular_faith_events.0026.b: "Exorcismus povedu sám." # todo: NEW TRANSLATION
 pam_secular_faith_events.0026.c: "Tohle je svatá práce. Postarej se o to." # todo: NEW TRANSLATION
 pam_secular_faith_events.0026.d: "Vyveďte [afflicted.GetHerHim] ven, než se panika rozšíří!" # todo: NEW TRANSLATION
 pam_sf_exorcism_success_toast: "Exorcismus se zdařil" # todo: NEW TRANSLATION
 pam_sf_exorcism_failed_toast: "Exorcismus selhal" # todo: NEW TRANSLATION
 pam_secular_faith_events.0027.t: "Krize víry" # todo: NEW TRANSLATION
 pam_secular_faith_events.0027.desc: "„Slyšíš mě, [ROOT.Char.GetFaith.HighGodName]?“ šeptám. Hluboko uvnitř však vím, že [ROOT.Char.GetFaith.HighGodNameSheHe|U] hříšníkům, jako jsem já, nenaslouchá.\n\nPochopil jsem snad špatně vůli [ROOT.Char.GetFaith.HighGodHerHis|U]? Není [old_tenet.GetName( ROOT.Char.GetRite )] pravou podobou moudrosti [ROOT.Char.GetFaith.HighGodHerHis|U]?\n\nSvětlo dopadá na krucifix a v mém nitru se probouzí naděje." # todo: NEW TRANSLATION
 pam_secular_faith_events.0027.a: "[ROOT.Char.GetFaith.HighGodName] žádá [new_tenet.GetNameNoTooltip( ROOT.Char.GetRite )]!" # todo: NEW TRANSLATION
 pam_secular_faith_events.0027.b: "Co třeba... [forbidden_tenet.GetNameNoTooltip( ROOT.Char.GetRite )]?" # todo: NEW TRANSLATION
 pam_secular_faith_events.0027.c: "Jsem ztracen. A všichni ostatní také..." # todo: NEW TRANSLATION
 pam_secular_faith_events.0028.t: "Má duše v pokoji" # todo: NEW TRANSLATION
 pam_secular_faith_events.0028.desc: "Klekám v [ROOT.Char.GetFaith.HouseOfWorship] a přítomnost [ROOT.Char.GetFaith.HighGodName] prostupuje každičký kout mé duše.\n\nÚcta k [old_tenet.GetName( ROOT.Char.GetRite )] mi ukázala pravdu. Nikdy jsem nepoznal takový klid. Jak bych si mohl takovou radost nechat pro sebe? Neměl bych vést ostatní ke stejnému světlu a ukázat jim pravdu?" # todo: NEW TRANSLATION
 pam_secular_faith_events.0028.a: "Najdu ochotné posluchače." # todo: NEW TRANSLATION
 pam_secular_faith_events.0028.b: "Ale mou skutečnou vášní je [forbidden_tenet.GetNameNoTooltip( ROOT.Char.GetRite )]!" # todo: NEW TRANSLATION
 pam_secular_faith_events.0028.c: "Měl bych své pocity svěřit [ROOT.Char.Custom('GetWritingMaterial')]." # todo: NEW TRANSLATION
 pam_secular_faith_events.0029.t: "Návštěva ze záhrobí" # todo: NEW TRANSLATION
 pam_secular_faith_events.0029.desc: ""Probuď se, [ROOT.Char.GetFirstNameNoTooltip]," ozve se povědomý hlas. "Jsem tady, [departed.Custom2( 'RelationToMeShort', root_scope )]... když mě potřebuješ."\n\nZachvěji se a na čele mi vyrazí pot. Zjevení na okamžik zabliká a pak zmizí.\n\nByl to... můj [ROOT.Char.Custom2( 'RelationToMeShort', departed )]?" # todo: NEW TRANSLATION
 pam_secular_faith_events.0029.a: "[departed.GetSheHe|U] je v bezpečí a bdí nade mnou." # todo: NEW TRANSLATION
 pam_secular_faith_events.0029.b: "Bylo to... varování?" # todo: NEW TRANSLATION
 pam_secular_faith_events.0029.c: "Pouhá hra mysli. Nic víc." # todo: NEW TRANSLATION
 pam_secular_faith_events.0030.t: "Poustevník" # todo: NEW TRANSLATION
 pam_secular_faith_events.0030.desc: "„Chci se přiblížit [ROOT.Char.GetFaith.HighGodName],“ pronese slavnostně můj [ROOT.Char.Custom2( 'RelationToMeShort', would_be_anchorite )], [would_be_anchorite.GetFirstName]. „Svět je plný rozptýlení a já toužím po naprosté samotě.“\n\n[would_be_anchorite.GetSheHe|U] hledí na zeď mého [ROOT.Char.Custom('ResidenceBuilding')] a prsty po ní přejíždí.\n\n„[ROOT.Char.GetFaith.HouseOfWorship] v [church_scope.GetName] je nádherný. Chci se nechat zazdít do jeho zdí a strávit zbytek života v nepřetržité modlitbě.“" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [would_be_anchorite.GetHerHis]
 pam_secular_faith_events.0030.a: "Jestli si to přeješ, moji zedníci jsou ti k službám." # todo: NEW TRANSLATION
 pam_secular_faith_events.0030.b: "Ne, tohle ti nesplním." # todo: NEW TRANSLATION
 pam_secular_faith_events.0031.t: "Hádka učenců" # todo: NEW TRANSLATION
 pam_secular_faith_events.0031.desc: ""Jak může někdo popírat svatost [tenet_1.GetBaseName]?" zvolá můj [ROOT.Char.Custom2( 'RelationToMeShort', disputant_one )], [disputant_one.GetFirstName].\n\n"Nesmysl! Je přece jasné jako den, že [tenet_2.GetBaseName] tě přibližuje k božskému! Copak ses nic nenaučil?" odvětí můj [ROOT.Char.Custom2( 'RelationToMeShort', disputant_two )], [disputant_two.GetFirstName]." # todo: NEW TRANSLATION
 pam_secular_faith_events.0031.a: "Debata učenců? Přinesu si poznámky..." # todo: NEW TRANSLATION
 pam_secular_faith_events.0031.b: "Přitahuje mě [tenet_1.GetBaseNameNoTooltip]." # todo: NEW TRANSLATION
 pam_secular_faith_events.0031.c: "[tenet_2.GetBaseNameNoTooltip] zní přesvědčivě." # todo: NEW TRANSLATION
 pam_secular_faith_events.0031.d: "Živý [ROOT.Char.Custom('GetCourt')] je vzdělaný [ROOT.Char.Custom('GetCourt')]." # todo: NEW TRANSLATION
 pam_secular_faith_events.0032.t: "Hodina pokušení" # todo: NEW TRANSLATION
 pam_secular_faith_events.0032.desc_food: "Probudím se s polštářem mokrým od slin. Z kuchyní se line vůně pečeného [ROOT.Char.Custom('RegionalEdibleMeat')] a [ROOT.Char.Custom('GetFoodDetail')]-plněného [ROOT.Char.Custom('GetRandomRegionalSmallGame')], zatímco chodbami [ROOT.Char.Custom('ResidenceBuildingHallsType')] se rozléhá cinkání pohárů s [ROOT.Char.Custom('RegionalDrink')] a veselý hovor.\n\nJakožto [vice_trait.GetName( GetNullCharacter )] mi [ROOT.Char.GetFaith.PriestNeuterPlural] přikázali držet půst... ale proč by mě [ROOT.Char.GetFaith.HighGodName] zkoušel právě této noci?\n\nCítím, jak mé odhodlání mizí spolu s kručením v žaludku." # todo: NEW TRANSLATION
 pam_secular_faith_events.0032.a: "Mé choutky jsou ospravedlněny vůlí [ROOT.Char.GetFaith.HighGodName]!" # todo: NEW TRANSLATION
 pam_secular_faith_events.0032.b: "Ne. Půst platí a já ho dodržím." # todo: NEW TRANSLATION
 pam_secular_faith_events.0032.c: "Jen malou ochutnávku... kdo se to dozví?" # todo: NEW TRANSLATION
 pam_secular_faith_events.0033.t: "Kázání na polštáři" # todo: NEW TRANSLATION
 pam_secular_faith_events.0033.desc: "Můj [ROOT.Char.Custom2( 'RelationToMeShort', believing_spouse )], [believing_spouse.GetFirstName], následuje [believing_spouse.GetRite.GetName] a jeho učení mi [believing_spouse.GetSheHe] rád(a) šeptá v noci.\n\n„Můj [ROOT.Char.Custom('RomanticComplimentAdjective')] [believing_spouse.Custom2( 'RelationToMeShort', root_scope )], věděl(a) jsi, že [new_tenet.Custom('GetGenericTenetSentence')]? Není to #EMP fascinující?#!“ zeptá se [believing_spouse.GetSheHe|U] a obejme mě.\n\nJeho vášeň je stejně okouzlující jako jeho úsměv." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [believing_spouse.GetHerHis], [believing_spouse.GetHerHis|U]
 pam_secular_faith_events.0033.a: "Hm, pověz mi víc..." # todo: NEW TRANSLATION
 pam_secular_faith_events.0033.b: "#EMP Ty#! jsi fascinující! Pojď sem." # todo: NEW TRANSLATION
 pam_secular_faith_events.0033.c: "Prosím, můj [believing_spouse.Custom('RomanticComplimentNoun')], potřebuji spát." # todo: NEW TRANSLATION
 pam_secular_faith_events.0034.t: "Nalezenec" # todo: NEW TRANSLATION
 pam_secular_faith_events.0034.desc: "Můj [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], obvykle nechodí pozdě. Ticho [ROOT.Char.GetFaith.HouseOfWorship] přeruší křehký pláč nemluvněte.\n\n„Milostivý [ROOT.Char.GetFaith.HighGodName]...“ zašeptá [chaplain.GetFirstNameNoTooltip] a něžně kolébá dítě v náručí. „Opustili ho, protože je [trait_scope.GetName( GetNullCharacter )]... Takový osud si nezaslouží žádná duše.“\n\nDrobné prstíky dítěte se ovinou kolem [chaplain.GetHerHis] palce." # todo: NEW TRANSLATION
 pam_secular_faith_events.0034.a: "[ROOT.Char.GetFaith.HighGodName] mi daroval [foundling.Custom('GetDaughterSon')]." # todo: NEW TRANSLATION
 pam_secular_faith_events.0034.b: "[archdiocese.GetNameNoTooltip] si [foundling.GetHerHim] vezme k sobě." # todo: NEW TRANSLATION
 pam_secular_faith_events.0034.c: "[chaplain.GetFirstNameNoTooltip] dítě vychová." # todo: NEW TRANSLATION
 pam_secular_faith_events.0034.d: "Nezajímá mě, co se s ním stane." # todo: NEW TRANSLATION
 pam_secular_faith_events.0035.t: "Umrtvování těla" # todo: NEW TRANSLATION
 pam_secular_faith_events.0035.desc: "Na zemi je krev. Jdu za zvukem bičování a najdu svou [ROOT.Char.Custom2( 'RelationToMeShort', sufferer )], [sufferer.GetFirstName]. V rukou [sufferer.GetHerHis] je krvavý bič a po [sufferer.GetHerHis] tvářích stékají slzy.\n\n„Mé [sinful_trait.GetName( GetNullCharacter )] vášně mě hrozí pohltit,“ vydechne [sufferer.GetSheHe]. „Raději snesu rány bičem než plameny pokušení.“\n\n„Tato bolest pomine. [ROOT.Char.GetFaith.NegativeAfterLife|U] nikoli.“" # todo: NEW TRANSLATION
 pam_secular_faith_events.0035.a: "Zajímavé... podej mi bič." # todo: NEW TRANSLATION
 pam_secular_faith_events.0035.b: "Ať se [sufferer.GetHerHim] umrtvuje." # todo: NEW TRANSLATION
 pam_secular_faith_events.0035.c: "Pro [ROOT.Char.GetFaith.HighGodNamePossessive] smilování, přestaň s tím šílenstvím." # todo: NEW TRANSLATION
 pam_sf_scourge_abandoned_toast: "Bič odložen" # todo: NEW TRANSLATION
 pam_secular_faith_events.0036.t: "Moudrost poustevníka" # todo: NEW TRANSLATION
 pam_secular_faith_events.0036.desc: "Rozedraný [hermit.GetWomanMan] žádá o audienci a tvrdí, že je poustevníkem z [hermit_location.Custom('CZ_TerrainTypeProvince_G')] [CZPrepV(hermit_location.GetNameNoTooltip)] [CZProvName(hermit_location,'L')].\n\n"Po sedm nocí mi [ROOT.Char.GetFaith.HighGodName] odpíral spánek," pronese přísně [hermit.GetSheHe]. "Ne aby mě potrestal, ale aby naplnil mé myšlenky pravdami určenými ostatním, vám."\n\n"Vyslechněte má slova a dbejte na ně. Pak se vrátím do samoty."" # todo: NEW TRANSLATION
 pam_secular_faith_events.0036.a: "O jaká tajemství se se mnou můžete podělit?" # todo: NEW TRANSLATION
 pam_secular_faith_events.0036.b: "Rád se poučím." # todo: NEW TRANSLATION
 pam_secular_faith_events.0036.c: "Zmiz, žebráku." # todo: NEW TRANSLATION
 pam_secular_faith_events.0037.t: "Tělesné zjevení" # todo: NEW TRANSLATION
 pam_secular_faith_events.0037.desc_wanderer: "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] teče proudem dlouho do noci a návštěvník, pocestný [reveler.GetFirstName], se ke mně nakloní." # todo: NEW TRANSLATION
 pam_secular_faith_events.0037.desc_normal: "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] teče proudem dlouho do noci a můj [ROOT.Char.Custom2( 'RelationToMeShort', reveler )], [reveler.GetFirstName], se ke mně nakloní." # todo: NEW TRANSLATION
 pam_secular_faith_events.0037.desc: "Brzy mě dokáže zaujmout už jen [reveler.GetHerHis] [reveler.Custom('ObjectifiedFeature')].\n\n„Jazykem se pronášejí modlitby,“ říká [reveler.GetSheHe] a pomalu si svléká [reveler.GetHerHis] [reveler.Custom('GetClothingArticle')]. „A pak jsou tu modlitby tělem. Dovol mi ukázat ti [reveler.Custom('pam_sf_carnal_art')], můj [ROOT.Char.Custom('RaunchyComplimentNoun')].“\n\n[reveler.GetSheHe|U] mi podává [reveler.GetHerHis] ruku. „Nadcházející extáze se vyrovná blaženosti [ROOT.Char.GetFaith.PositiveAfterLife].“" # todo: NEW TRANSLATION
 pam_secular_faith_events.0037.a: "Ukaž mi to. Až odejdeš, zamkni za sebou." # todo: NEW TRANSLATION
 pam_secular_faith_events.0037.b: "Obleč se, [reveler.GetWomanMan]." # todo: NEW TRANSLATION
 pam_sf_carnal_art_1: "Svíjející se had" # todo: NEW TRANSLATION
 pam_sf_carnal_art_2: "Stoupající řeka" # todo: NEW TRANSLATION
 pam_sf_carnal_art_3: "Propletené liány" # todo: NEW TRANSLATION
 pam_sf_carnal_art_4: "Pevné objetí" # todo: NEW TRANSLATION
 pam_sf_carnal_art_5: "Rozštípnutí bambusu" # todo: NEW TRANSLATION
 pam_sf_carnal_art_6: "Kobylí trik" # todo: NEW TRANSLATION
 pam_sf_carnal_art_7: "Rozvíjející se lotos" # todo: NEW TRANSLATION
 pam_sf_carnal_art_8: "Indrova žena" # todo: NEW TRANSLATION
 pam_sf_carnal_art_9: "Vztyčená kobra" # todo: NEW TRANSLATION
 pam_sf_carnal_art_10: "Milenecký uzel" # todo: NEW TRANSLATION
 pam_sf_carnal_art_11: "Růže a trn" # todo: NEW TRANSLATION
 pam_sf_carnal_art_12: "Tajemství trubadúra" # todo: NEW TRANSLATION
 pam_sf_carnal_art_13: "Plamen v dlaních" # todo: NEW TRANSLATION
 pam_secular_faith_events.0038.t: "Ochutnávka ráje" # todo: NEW TRANSLATION
 pam_secular_faith_events.0038.desc: "Můj [ROOT.Char.Custom2( 'RelationToMeShort', reveler )], [reveler.GetFirstName], si znovu plní talíř [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_plural')] a přes stůl se na mě zašklebí.\n\n"Hledáš [ROOT.Char.GetFaith.HighGodName] s kručícím žaludkem a prázdným pohárem. Já nacházím [ROOT.Char.GetFaith.CreatorHerHim] ve zralém ovoci, šťavnatém mase, smíchu a písni," pozvedne [reveler.GetSheHe] plný pohár.\n\n"Dary [ROOT.Char.GetFaith.HighGodNamePossessive] máme vychutnávat, [ROOT.Char.Custom('FormOfAddressForLiege')]. Plýtvat tím, co dostaneme? To je teprve hrozný hřích!"" # todo: NEW TRANSLATION
 pam_secular_faith_events.0038.a: "Možná se svatost skrývá v poháru..." # todo: NEW TRANSLATION
 pam_secular_faith_events.0038.b: "Pak na jeho počest uspořádám hostinu." # todo: NEW TRANSLATION
 pam_secular_faith_events.0038.c: "Rozmařilost převlečená za zbožnost. Ne." # todo: NEW TRANSLATION
 pam_secular_faith_events.0039.t: "Modlitba ve tmě" # todo: NEW TRANSLATION
 pam_secular_faith_events.0039.desc: "Můj [ROOT.Char.Custom2( 'RelationToMe', spymaster_scope )], [spymaster_scope.GetFirstName], za mnou přichází stále rozrušený tím, k čemu vedla jeho lstivost.\n\n„Klečel jsem při modlitbě vedle [secret_keeper.GetTitledFirstName], [ROOT.Char.Custom('FormOfAddressForLiege')], a lhal jsem — drobnou, zbožnou nepravdu, kterou jsem mu pošeptal, abych rozvázal [secret_keeper.GetHerHis] jazyk.“\n\n„Přiznal se k [secret_keeper.Custom('GetSecretCrimeConfessionIndef')] v domě [ROOT.Char.GetFaith.HighGodName],“ ztiší hlas. „Promluvil jsem o [GetTenetType('tenet_sacred_shadows').GetName( GetPlayer.GetRite )]... možná je tato lest povinností, kterou máme vůči [ROOT.Char.GetFaith.HighGodName]?“" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [secret_keeper.GetSheHe|U], [spymaster_scope.GetHerHis], [spymaster_scope.GetHerHis], [spymaster_scope.GetSheHe]
 pam_secular_faith_events.0039.a: "[ROOT.Char.GetFaith.HighGodName] působí ve stínu..." # todo: NEW TRANSLATION
 pam_secular_faith_events.0039.b: "Odporný trik... prostě mi řekni to tajemství." # todo: NEW TRANSLATION
 pam_secular_faith_events.0040.t: "Tělo věřících" # todo: NEW TRANSLATION
 pam_secular_faith_events.0040.desc: "Během večeře můj [ROOT.Char.Custom2( 'RelationToMeShort', scholar )], [scholar.GetFirstName], otevře notně ohmataný svazek. Začíná další přednáška.\n\n"[Glossary( 'Issedones', 'ISSEDONES_GLOSS' )] své mrtvé nepohřbívali, [ROOT.Char.Custom('FormOfAddressForLiege')]. Hodovali na nich!" pronese [scholar.GetSheHe] a sotva popadá dech. "Maso otce mísili s ovčím, jeho lebku pozlatili a uctívali jako svatou relikvii. Považovali to za nejčistší lásku, jakou může dítě projevit."\n\n"A to nejlepší?" [scholar.GetSheHe] se zašklebí. "Sám Hérodotos je nepovažoval ani za zlé, ani za šílené. #EMP ,Zvyk,#! pravil, #EMP ,vládne všem.‘#!"" # todo: NEW TRANSLATION
 pam_secular_faith_events.0040.a: "Ach, o tom už všechno vím." # todo: NEW TRANSLATION
 pam_secular_faith_events.0040.b: "Ponurý zvyk... pověz mi víc." # todo: NEW TRANSLATION
 pam_secular_faith_events.0040.c: "Při [ROOT.Char.GetFaith.HighGodName], [scholar.GetWomanMan]. Snažím se jíst!" # todo: NEW TRANSLATION
 ISSEDONES_GLOSS: "Národ žijící na dalekém severu stepí, který popsal Hérodotos. Když zemřel otec, jeho rodina smísila jeho maso s masem poražených zvířat a uspořádala pohřební hostinu. Jeho lebku pozlatili a každoročně jí vzdávali úctu obětí. Hérodotos tyto zvyky zaznamenal nikoli proto, aby je odsoudil, ale aby ukázal, že „zvyk vládne všem“." # todo: NEW TRANSLATION
 pam_secular_faith_events.0041.t: "Nahá pravda" # todo: NEW TRANSLATION
 pam_secular_faith_events.0041.desc: "Když se procházím po zahradách, spatřím mezi záhony [ROOT.Char.GetCapitalLocation.Custom('get_region_flower_type')] cizince, který trhá plody z mého [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_tree_type')] — nahý jako při narození, jediným oděvem [adamite.GetHerHis] je padající listí.\n\n„Ach, [ROOT.Char.GetTitleAsName]! Proč se skrýváš za šaty a korunou?“ ptá se [adamite.GetSheHe], nestydí se přede [ROOT.Char.GetFaith.HighGodName] ani přede mnou. „Přijal jsem původní nevinnost, kdy jsme žili nazí a beze strachu.“\n\n[adamite.GetSheHe|U] se zakousne do dalšího kusu ovoce a šťáva stéká po [adamite.GetHerHis] kůži. „Možná bys měl také.“" # todo: NEW TRANSLATION
 pam_secular_faith_events.0041.a: "I já toužím po takové svobodě." # todo: NEW TRANSLATION
 pam_secular_faith_events.0041.b: "Jez mé ovoce, pověz mi svůj příběh a pak odejdi." # todo: NEW TRANSLATION
 pam_secular_faith_events.0041.c: "Dejte vetřelce zavřít." # todo: NEW TRANSLATION
 pam_secular_faith_events.0042.t: "Cesta bez starostí" # todo: NEW TRANSLATION
 pam_secular_faith_events.0042.desc: "Můj [ROOT.Char.Custom2( 'RelationToMeShort', sponsor_character )], [sponsor_character.GetFirstName], mě potká v zahradě s měšcem otevřeným a vřelým úsměvem.\n\n"Dovol mi uhradit náklady na tvou [GetActivityType( 'activity_pilgrimage').GetName], [ROOT.Char.Custom('FormOfAddressForLiege')]. Poutník by neměl počítat mince — vydej se na cestu svobodně a pomodli se za nás oba."\n\nStříbro je skutečné. Stejně jako důvěra." # todo: NEW TRANSLATION
 pam_secular_faith_events.0042.a: "Vydám se na cestu se vděčným srdcem." # todo: NEW TRANSLATION
 pam_secular_faith_events.0042.b: "Vezmu si mince a nechám si je." # todo: NEW TRANSLATION
 pam_secular_faith_events.0042.c: "Nech si své peníze, příteli." # todo: NEW TRANSLATION
 pam_sf_pilgrimage_sponsor_tt: "Pokud během #V 7#! let dokončíš [GetActivityType( 'activity_pilgrimage').GetName], [sponsor_character.GetFirstName] k tobě získá #P 50#! bodů vztahu" # todo: NEW TRANSLATION
 pam_sf_pilgrimage_sponsor_toast: "Patron potěšen" # todo: NEW TRANSLATION
 pam_secular_faith_events.0043.t: "Poutníkovo přivítání" # todo: NEW TRANSLATION
 pam_secular_faith_events.0043.desc: "Můj [ROOT.Char.Custom2( 'RelationToMeShort', holy_man )], [holy_man.GetFirstName], mě uchopí za ruce před oltářem.\n\n"Vydej se na poutní cestu, [ROOT.Char.Custom('FormOfAddressForLiege')]. Až se vrátíš, budu o tvé [GetActivityType( 'activity_pilgrimage').GetName] vyprávět na každém náměstí [CZPrepV(capital_county.GetNameNoTierNoTooltip)] [capital_county.Custom('CZ_LandedNameNoTier_L')]. Tvůj lid se dozví, že se za něj jeho [ROOT.Char.GetTitleAsNameNoTooltip] poklonil."" # todo: NEW TRANSLATION
 pam_secular_faith_events.0043.a: "Pak se vydám na poutní cestu." # todo: NEW TRANSLATION
 pam_secular_faith_events.0043.b: "Musím se věnovat důležitějším, světským záležitostem." # todo: NEW TRANSLATION
 pam_sf_extolled_pilgrimage_toast: "Lid se raduje" # todo: NEW TRANSLATION
 pam_secular_faith_events.0044.t: "Přízeň duchovenstva" # todo: NEW TRANSLATION
 pam_secular_faith_events.0044.desc: "Můj [ROOT.Char.Custom2( 'RelationToMeShort', friendly_bishop )], [friendly_bishop.GetFirstName], přichází v nezvykle dobré náladě.\n\n"V poslední době jsem si získal přízeň svých kolegů — biskupů, opatů a těch, jejichž hlas má v církvi váhu. Pokud budeš potřebovat jejich zbožnou moudrost či morální autoritu, mohu za tebe promluvit."\n\n[friendly_bishop.GetFirstNamePossessiveNoTooltip] přízeň u mocichtivých [ROOT.Char.GetFaith.PriestNeuterPlural] se dá snadno využít." # todo: NEW TRANSLATION
 pam_secular_faith_events.0044.a: "Pak za mě promluv." # todo: NEW TRANSLATION
 pam_secular_faith_events.0044.b: "Tvé přátelství je dostatečným požehnáním." # todo: NEW TRANSLATION
 pam_secular_faith_events.0045.t: "Prozření" # todo: NEW TRANSLATION
 pam_secular_faith_events.0045.desc: "Jasnost mě zasáhne jako blesk z čistého nebe.\n\nUčení. Zásady. Obřady. Víra. Tisíc roztroušených myšlenek splynulo v jedinou pravdu, kterou nyní vidím před sebou v celé její úplnosti." # todo: NEW TRANSLATION
 pam_secular_faith_events.0045.a: "Budoucnost mě volá, abych vedl." # todo: NEW TRANSLATION
 pam_secular_faith_events.0045.b: "Budu si tento okamžik užívat." # todo: NEW TRANSLATION
 pam_secular_faith_events.0046.t: "Sdílené přesvědčení" # todo: NEW TRANSLATION
 pam_secular_faith_events.0046.desc: "Můj [ROOT.Char.Custom2( 'RelationToMeShort', intimate )], [intimate.GetFirstName], nedokáže skrýt své přesvědčení, když mluví o [shared_tenet.GetName( intimate.GetRite )].\n\n„[shared_tenet.GetNameNoTooltip( GetNullCharacter.GetRite )] dává smysl všemu, co dělám,“ říká. „Jen na jedné věci mi záleží stejně... na tobě, můj [ROOT.Char.Custom('ComplimentAdjective')] [intimate.Custom2('RelationToMe', SCOPE.sC('root_scope'))].“\n\nPo [intimate.GetHerHis] tváři steče jediná slza. „Jen jsem chtěl, abys to věděl.“" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [intimate.GetHerHis], [intimate.GetSheHe], [intimate.GetSheHe]
 pam_secular_faith_events.0046.a: "Ať naše společné přesvědčení ještě posílí náš svazek!" # todo: NEW TRANSLATION
 pam_secular_faith_events.0046.b: "Sdílet toto přesvědčení... je jako láska." # todo: NEW TRANSLATION
 pam_secular_faith_events.0046.c: "Děkuji, že ses mi svěřil/a." # todo: NEW TRANSLATION
 pam_secular_faith_events.0047.t: "Kněžská oddanost" # todo: NEW TRANSLATION
 pam_secular_faith_events.0047.desc: "Můj/Moje [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], udělá znamení kříže a skloní [chaplain.GetHerHis] hlavu.\n\n\"[ROOT.Char.GetFaith.HighGodName] ti z nějakého důvodu vložil korunu na čelo. Když ti věrně sloužím, sloužím tím vůli [ROOT.Char.GetFaith.HighGodHerHis|U],\" prohlašuje [chaplain.GetSheHe].\n\n„Přísahal/a jsem věrnost [ROOT.Char.GetFaith.HighGodName]. Nyní bych ji přísahal/a i tobě.“" # todo: NEW TRANSLATION
 pam_secular_faith_events.0047.a: "Pak mi služ z celého srdce." # todo: NEW TRANSLATION
 pam_secular_faith_events.0047.b: "Vždy musíš sloužit nejprve [ROOT.Char.GetFaith.HighGodName]." # todo: NEW TRANSLATION
 pam_secular_faith_events.0048.t: "Démonické sny" # todo: NEW TRANSLATION
 pam_secular_faith_events.0048.desc: "Probudím se, ale nemohu se pohnout.\n\nPřede mnou tančí zkroucená postava a chechtá se. Démon? Pomalu mě zaplavuje hrůza. „Heh... heh... tvé hříchy tě tíží. Brzy si pro tebe [ROOT.Char.GetFaith.EvilGodNames] přijde!“\n\nAť už to byl sen, nebo démon, nemohu ignorovat, co jsem spatřil/a. Musím se usmířit s [ROOT.Char.GetFaith.HighGodName]." # todo: NEW TRANSLATION
 pam_secular_faith_events.0048.a: "Ten sen... musí něco znamenat." # todo: NEW TRANSLATION
 pam_secular_faith_events.0048.b: "Byl to jen sen. Zpátky do postele." # todo: NEW TRANSLATION
 pam_secular_faith_events.0048.c: "[ROOT.Char.GetFaith.HighGodName] mě ochraňuj! Musím činit pokání." # todo: NEW TRANSLATION
 pam_sf_demon_torment_modifier_tt: "Modifikátoru se zbavíš, když postavíš [holding|E] [GetBuilding('temple_01').GetName] nebo se vydáš na [CZActivity('activity_pilgrimage','A')]" # todo: NEW TRANSLATION
 pam_sf_demon_torment_lifted_toast: "Muka polevují" # todo: NEW TRANSLATION
 pam_secular_faith_events.0049.t: "„Nebeská hierarchie“" # todo: NEW TRANSLATION
 pam_secular_faith_events.0049.desc: "Zvuky, které se ozývají z mé kaple, nejsou modlitby.\n\n„Ano, #emp ANO#!, Vaše Milosti! Ukažte tomuto ubohému hříšníkovi [lustful_priest.GetHerHis] pravé místo v [GetTenetType('tenet_celestial_hierarchy').GetName( GetNullCharacter.GetRite )]!“ vykřikuje extaticky můj/moje [ROOT.Char.Custom2( 'RelationToMeShort', lustful_priest )] [lustful_priest.GetFirstName]. „Jsem červ, který se svíjí v prachu, plný pozemských choutek. #emp POTRESTEJTE MĚ!#!“\n\nPři [ROOT.Char.GetFaith.HighGodName], co se to děje v mé kapli!?" # todo: NEW TRANSLATION
 pam_secular_faith_events.0049.a: "Musí jít o nějaký rituál, měl/a bych si... dělat poznámky." # todo: NEW TRANSLATION
 pam_secular_faith_events.0049.b: "Jestli je to v #EMP mé#! kapli, tak se #emp přidám#!!" # todo: NEW TRANSLATION
 pam_secular_faith_events.0049.c: "[lustful_priest.GetFirstNameNoTooltip], zvrhlík!? Odporné, ale užitečné." # todo: NEW TRANSLATION
 pam_secular_faith_events.0050.t: "[chaplain.Custom('RomanticComplimentAdjective')|U] [chaplain.GetCouncilTitle]" # todo: NEW TRANSLATION
 pam_secular_faith_events.0050.desc: "Třepotající se svíce v [ROOT.Char.GetFaith.HouseOfWorship] mě nedokážou rozptýlit od nečistých myšlenek, které mi víří hlavou.\n\n„Pojďte za mnou do zpovědnice, [ROOT.Char.Custom('FormOfAddressForLiege')],“ zašeptá můj/moje [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]. Můj pohled spočine na [chaplain.GetHerHis] [chaplain.Custom('ObjectifiedFeature')]. „Ať tíží vaši duši cokoli, svěřte se bez obav.“\n\n[GetTenetType('tenet_confession')GetName( GetPlayer.GetRite )] je svatý... ale jeden hřích tíží víc než všechny ostatní: [chaplain.GetFirstNamePossessive] [chaplain.Custom('AdmiredFeature')]." # todo: NEW TRANSLATION
 pam_secular_faith_events.0050.a: "...vejde se do vaší zpovědnice i druhý člověk?" # todo: NEW TRANSLATION
 pam_secular_faith_events.0050.b: "Odpusťte mi, [chaplain.GetMotherFather], neboť mám nečisté myšlenky." # todo: NEW TRANSLATION
 pam_secular_faith_events.0051.t: "Hospodin, tvůj Bůh" # todo: NEW TRANSLATION
 pam_secular_faith_events.0051.desc: "#EMP „Já jsem Hospodin, tvůj Bůh,“#! rozléhá se burácivý hlas v [ROOT.Char.GetFaith.HouseOfWorship]. #EMP „Poklekneš přede mnou.“#!\n\nPadnu na kolena a zrak se mi rozostří. Setřu si z tváře pramínek krve.\n\n#EMP „Já, Hospodin, tvůj Bůh, ti přikazuji: Poslouchej mě celým svým srdcem i celou svou duší.“#! Z jednoho hlasu se stane sto. Ze sta tisíc. #EMP „Jestliže mě neposlechneš, uvrhnu na tebe kletbu, dokud nebudeš zničen, neboť jsi mě opustil, Hospodina, svého Boha.“#!" # todo: NEW TRANSLATION
 pam_secular_faith_events.0051.a: "Budu... poslouchat..." # todo: NEW TRANSLATION
 pam_sf_lord_your_god_effect_tt: "@alert_icon!#alert_trial Stane se něco strašného, nebo nádherného...#!" # todo: NEW TRANSLATION
 pam_sf_lord_your_god_tt: "Prosím, [ROOT.Char.GetFaith.HighGodName]... smiluj se." # todo: NEW TRANSLATION
 pam_sf_voice_of_jesus_toast: "Ježíšův hlas" # todo: NEW TRANSLATION
 pam_sf_stroke_of_god_toast: "Boží zásah" # todo: NEW TRANSLATION
 pam_secular_faith_events.0052.t: "Až tu nebudeš" # todo: NEW TRANSLATION
 pam_secular_faith_events.0052.desc: "V [ROOT.Char.GetFaith.HouseOfWorship] [CZPrepV(resting_church.GetNameNoTierNoTooltip)] [resting_church.Custom('CZ_LandedNameNoTier_L')] se můj/moje [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], zastaví u oprýskaných náhrobních desek těch, kteří vládli přede mnou.\n\n„[ROOT.Char.GetFaith.HighGodName] ti dopřál více zim než většině lidí, [ROOT.Char.Custom('FormOfAddressForLiege')]. Není hříchem rozhodnout se, jak chceš spočinout.“\n\n„Tvá podoba vytesaná do kamene, nebo [Glossary( 'prostá mnišská kukla', 'AD_SUCCURRENDUM_GLOSS' )] — volba je na tobě.“" # todo: NEW TRANSLATION
 pam_secular_faith_events.0052.a: "Vytesat mou podobu... ale mladší a pohlednější." # todo: NEW TRANSLATION
 pam_secular_faith_events.0052.b: "Prostá kukla postačí." # todo: NEW TRANSLATION
 pam_secular_faith_events.0052.c: "Hrob nikam neuteče." # todo: NEW TRANSLATION
 pam_sf_effigy_planned_tt: "Pokud se po tvé smrti bude konat [GetActivityType( 'activity_funeral').GetName], jeho hostitel získá [prestige_i]#P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#! [prestige|E]" # todo: NEW TRANSLATION
 pam_sf_cowl_burial_planned_tt: "Pokud se po tvé smrti bude konat [GetActivityType( 'activity_funeral').GetName], jeho hostitel získá [piety_i]#P [EmptyScope.ScriptValue('medium_piety_gain')|0]#! [piety|E]" # todo: NEW TRANSLATION
 pam_sf_effigy_unveiled_toast: "Odhalení podobizny" # todo: NEW TRANSLATION
 pam_sf_cowl_burial_toast: "Uložen/a k odpočinku v kukle" # todo: NEW TRANSLATION
 AD_SUCCURRENDUM_GLOSS: "Zemřít #G ad succurrendum#! — přijmout mnišské sliby a hábit na smrtelné posteli — bývalo poslední možností velkých pánů křesťanského středověku. Umírající vládce doufal, že bude pohřben v prosté kukle místo hedvábí a předstoupí před soud jako pokorný bratr, nikoli jako kníže." # todo: NEW TRANSLATION
 pam_secular_faith_events.0053.t: "Světec vyráží na cestu" # todo: NEW TRANSLATION
 pam_secular_faith_events.0053.desc: "Můj/moje [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], zvedne víko relikviáře s péčí porodní báby. Uvnitř spočívá poklad mého rodu: [procession_relic.GetName].\n\n„Svatost zamčená za dveřmi nikomu neprospívá, [ROOT.Char.Custom('FormOfAddressForLiege')],“ říká [chaplain.GetSheHe]. „Dopřej svému lidu [Glossary( 'ostentaci', 'OSTENSION_GLOSS' )] — relikvii je třeba ukázat a požehnat každé ulici odtud až k bránám.“" # todo: NEW TRANSLATION
 pam_secular_faith_events.0053.a: "Relikviář ponesu sám/sama." # todo: NEW TRANSLATION
 pam_secular_faith_events.0053.b: "Tuto vigilii budu držet o samotě." # todo: NEW TRANSLATION
 pam_secular_faith_events.0053.c: "Neodvažuji se s ním hnout." # todo: NEW TRANSLATION
 pam_sf_procession_gamble_tt: "Ulice nejsou žádná klenotnice, artefakt by se mohl poškodit..." # todo: NEW TRANSLATION
 pam_sf_relic_jostled_toast: "Otřesy v davu" # todo: NEW TRANSLATION
 OSTENSION_GLOSS: "Slavnostní ukazování světcových ostatků. O velkých svátcích se relikvie vynášely z trezorů a nesly v procesí ulicemi a přes pole, aby požehnání spojené s oltářem mohlo zasáhnout každou duši na trase. Relikvie vynesená na veřejnost přilákala davy, peníze i slávu." # todo: NEW TRANSLATION
 pam_secular_faith_events.0054.t: "Mísa a rouška" # todo: NEW TRANSLATION
 pam_secular_faith_events.0054.desc: "Mísa se kouří a [ROOT.Char.Custom('GetCourt')] se shromáždil, aby přihlížel. Nervózní [pauper.Custom2('dummy_peasant_profession', pauper)] sedí na stoličce a [pauper.GetHerHis] bosé nohy jsou obalené špínou. Ten pach je... nezaměnitelný.\n\nPrávě této noci poklekl Spasitel s mísou a rouškou. [Glossary( 'Mandatum', 'MANDATUM_GLOSS' )] je připraveno a všechny oči v místnosti se upírají na mě.\n\nZbývá jen pokleknout — anebo si to rozmyslet." # todo: NEW TRANSLATION
 pam_secular_faith_events.0054.deviant: "#EMP Očistím ty rozkošné nohy jazykem.#!" # todo: NEW TRANSLATION
 pam_secular_faith_events.0054.a: "Pokleknu a chopím se roušky." # todo: NEW TRANSLATION
 pam_secular_faith_events.0054.b: "Pokleknu a políbím ty unavené nohy." # todo: NEW TRANSLATION
 pam_secular_faith_events.0054.c: "Já... nemohu. Odneste tu mísu." # todo: NEW TRANSLATION
 pam_sf_odorous_feet_tt: "Když pokleknu, možná mě naplní svatost... anebo se mě pach selských nohou už nikdy nezbaví" # todo: NEW TRANSLATION
 pam_sf_odorous_feet_toast: "Zápach přetrvává" # todo: NEW TRANSLATION
 MANDATUM_GLOSS: "Obřad mytí nohou, který vychází z Kristových slov při poslední večeři: #G „Mandatum novum do vobis“#! — „nové přikázání vám dávám“. Na Zelený čtvrtek tak vládci klekali s mísou a rouškou, aby umyli nohy několika chudákům a vtiskli jim do dlaní stříbro." # todo: NEW TRANSLATION
 pam_secular_faith_events.0055.t: "Bronzový hlas" # todo: NEW TRANSLATION
 pam_secular_faith_events.0055.desc: "Starý zvon kostela [bell_church.GetName] praskl, a tak ho přelili. Nový se třpytí ve své vysoké věži. Dole už čeká můj/moje [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] s vodou, posvátným olejem a solí.\n\n„Aby zvon mohl promlouvat ve jménu [ROOT.Char.GetFaith.HighGodName], musí být [Glossary( 'pokřtěn', 'BELL_BAPTISM_GLOSS' )],“ trvá na svém [chaplain.GetSheHe] s vyhrnutými rukávy. „Umyt, pomazán a pokřtěn — a pak už žádný ďábel ani bouře nedokáže umlčet jeho hlas.“" # todo: NEW TRANSLATION
 pam_secular_faith_events.0055.a: "Ať je tedy umyt, pomazán a pojmenován." # todo: NEW TRANSLATION
 pam_secular_faith_events.0055.b: "Je to bronz, ne duše — kapituláře říkají totéž." # todo: NEW TRANSLATION
 pam_secular_faith_events.0055.c: "Postačí krátké požehnání. Ať zvoní." # todo: NEW TRANSLATION
 BELL_BAPTISM_GLOSS: "Kostelní zvony se světily podobně jako křesťané: omývaly se svěcenou vodou, pomazávaly olejem a dostávaly jméno světce — některým se dokonce vybírali kmotři. Karlův #G Admonitio Generalis#! křty zvonů v roce 789 zakázal, ale tento zvyk přetrval ještě po staletí. Lidé věřili, že pokřtěný zvon zažene bouře, kroupy i démony všude, kam dosáhne jeho hlas; později slévači odlévali na zvony motto #G Fulgura frango#! — „Lámu blesky.“" # todo: NEW TRANSLATION
 pam_secular_faith_events.0056.t: "Vrabec v síni" # todo: NEW TRANSLATION
 pam_secular_faith_events.0056.desc: "Zimní nocí vletí vrabec, proletí celou [ROOT.Char.Custom('ResidenceBuildingHallType')] mezi kouřem z pochodní a smíchem a znovu zmizí oknem [ROOT.Char.Custom('ResidenceBuildingWindowType')].\n\n[ROOT.Char.Custom('GetCourt')] se směje. Můj/moje [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], nikoli.\n\n„[Glossary( 'Takový je lidský život', 'BEDE_SPARROW_GLOSS' )], [ROOT.Char.Custom('FormOfAddressForLiege')] — okamžik světla a tepla mezi jednou temnotou a druhou. Co bylo předtím a co přijde potom, ví jen [ROOT.Char.GetFaith.HighGodName].“" # todo: NEW TRANSLATION
 pam_secular_faith_events.0056.scholar: "Beda napsal totéž, skoro doslova." # todo: NEW TRANSLATION
 pam_secular_faith_events.0056.a: "Pak ať ten okamžik ve světle dobře využijeme." # todo: NEW TRANSLATION
 pam_secular_faith_events.0056.b: "Byl to pták. Přineste další víno." # todo: NEW TRANSLATION
 BEDE_SPARROW_GLOSS: "Podle Bedova vyprávění přirovnal jeden z rádců krále Edwina život k vrabci, který za zimní noci prolétne teplou hodovní síní: krátkému okamžiku světla a pohodlí mezi bouřemi, jehož začátek i konec jsou neznámé. Jestliže nová víra dokázala vysvětlit, co leží za hostinou, zasloužila si být vyslechnuta — a Edwin se nechal přesvědčit." # todo: NEW TRANSLATION
 pam_secular_faith_events.0057.t: "Církevní pivo" # todo: NEW TRANSLATION
 pam_secular_faith_events.0057.desc: "Můj [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], pořádá na hřbitově [ale_church.GetName] hostinu u stolů, u nichž sedí většina farnosti. Vedle stojí sudy dovezené přímo z [GetBuilding('breweries_01').GetName] a v ruce drží plný korbel.\n\n„Střechou nám zatéká, [ROOT.Char.Custom('FormOfAddressForLiege')], a desátek je příliš nízký. Bratři tedy vaří pivo, my ho prodáváme a farnost pije [Glossary( 'church ale', 'CHURCH_ALE_GLOSS' )], dokud střechu nezaplatíme.“\n\n„Každý korbel je dobrý skutek. Dáte si?“" # todo: NEW TRANSLATION
 pam_secular_faith_events.0057.a: "Tak mi podejte pohár. Kvůli té střeše." # todo: NEW TRANSLATION
 pam_secular_faith_events.0057.b: "Pivo si nechte — střechu zaplatím sám/sama." # todo: NEW TRANSLATION
 pam_secular_faith_events.0057.c: "Pít? Na posvátné půdě? Vylijte to." # todo: NEW TRANSLATION
 pam_sf_church_ale_gamble_tt: "Každý pohár jde na opravu střechy a farní pivo je silné..." # todo: NEW TRANSLATION
 pam_sf_church_ale_toast: "Ráno s bolavou hlavou" # todo: NEW TRANSLATION
 CHURCH_ALE_GLOSS: "Farní slavnost, při níž se na kostelním hřbitově prodávalo pivo uvařené z darovaného sladu a výtěžek se používal na údržbu kostela — na opravu zatékající střechy, nový zvon nebo chléb pro chudé. Synoda za synodou pití na posvátné půdě odsuzovala a farnost za farností dál vařila; v mnoha vesnických kostelech zaplatilo pivo víc než kdy desátek." # todo: NEW TRANSLATION
 pam_secular_faith_events.0058.t: "Quid Mus Sumit?" # todo: NEW TRANSLATION
 pam_secular_faith_events.0058.desc: "Můj [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], vtrhne dovnitř bledý jako oltářní plátno a v rukou drží malou stříbrnou [Glossary( 'pyx', 'PYX_GLOSS' )], jako by ho pálila.\n\n„Myš, [ROOT.Char.Custom('FormOfAddressForLiege')]. Dnes v noci prokousala schránku a snědla [Glossary( 'blessed bread', 'RESERVED_HOST_GLOSS' )]!“\n\n[chaplain.GetSheHe|U] sotva dokáže promluvit. „Učenci se ptají [Glossary( 'quid mus sumit', 'QUID_MUS_SUMIT_GLOSS' )] — co tedy ta myš snědla? Co mám dělat?“" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [chaplain.GetHerHis]
 pam_secular_faith_events.0058.scholar: "Uklidni se. Myš snědla chléb, nic víc." # todo: NEW TRANSLATION
 pam_secular_faith_events.0058.mean: "Ty jsi nechal/a #EMP myš#! hodovat na [ROOT.Char.GetFaith.HighGodName]?! Z mého [ROOT.Char.Custom('GetCourt')]!" # todo: NEW TRANSLATION
 pam_secular_faith_events.0058.a: "Kup pyxidu s lepším zámkem." # todo: NEW TRANSLATION
 pam_secular_faith_events.0058.b: "Takže je ta myš zatracená? Cha!" # todo: NEW TRANSLATION
 QUID_MUS_SUMIT_GLOSS: "#G Quid mus sumit?#! — „Co jí myš?“ Učenci o tom vážně debatovali: jestliže myš prokousala posvěcenou hostii, snědla tím Boží tělo? Církevní právo ukládalo nedbalým kněžím pokání a velcí učitelé rozhodli, že myš přijala pouze podobu chleba, neboť svátost se stáhla před nehodnými zuby." # todo: NEW TRANSLATION
 PYX_GLOSS: "Malá schránka s víčkem, obvykle ze stříbra nebo pozlacená, v níž se uchovává posvěcený chléb z mše. Církevní právo vyžadovalo, aby byla čistá, zamčená a chráněná před znesvěcením — i před hladovými návštěvníky." # todo: NEW TRANSLATION
 RESERVED_HOST_GLOSS: "Chléb posvěcený při mši a uchovávaný v kostele, aby jej mohli nemocní a umírající přijmout kdykoli. Věřilo se, že posvěcený chléb je skutečným Božím tělem, a jeho bezpečné uchovávání se proto považovalo za nanejvýš důležité." # todo: NEW TRANSLATION
 pam_secular_faith_events.0059.t: "Den Páně" # todo: NEW TRANSLATION
 pam_secular_faith_events.0059.desc: "Za úsvitu dorazila zpráva o [sighting_county.Custom('GetAnimalAdjective')] [sighting_county.Custom('GetAnimalType')] [sighting_province.Custom('CZ_GetTerrainTypePlural_In')] v [sighting_county.GetBaseNameNoTier]. Psi štěkají a koně podupávají na dvoře — ale můj/moje [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], stojí pevně v bráně.\n\n„Je [Glossary( 'den odpočinku', 'LORDS_DAY_GLOSS' )], [ROOT.Char.Custom('FormOfAddressForLiege')]. Zvon už odbil a čeká nás mše!“\n\n„[ROOT.Char.GetFaith.HighGodName] ti dal šest dní na jízdu. Musíš zatoužit i po tomhle?“" # todo: NEW TRANSLATION
 pam_secular_faith_events.0059.a: "Osedlejte koně. Vyslechneme mši." # todo: NEW TRANSLATION
 pam_secular_faith_events.0059.b: "[sighting_county.Custom('GetAnimalType')] nepočká. Jedeme!" # todo: NEW TRANSLATION
 LORDS_DAY_GLOSS: "První den týdne, který se světí na památku Vzkříšení. Církevní sněmy zakazovaly světskou práci, trhy i zahálčivé zábavy a křesťanští králové tento zákaz zakotvovali v zákonech — ačkoli mnohý pán považoval jelena, stejně jako kázání, za záležitost mezi sebou a Bohem." # todo: NEW TRANSLATION
 pam_secular_faith_events.0060.t: "Život bez břemene" # todo: NEW TRANSLATION
 pam_secular_faith_events.0060.desc: "Když projíždím ulicemi [ROOT.Char.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_G')], sužován/a prázdnou pokladnicí a vnitřním neklidem, spatřím žebráka.\n\n[hermit.GetSheHe] tančí, nezatížen/a světským majetkem, s klidem a porozuměním člověka, který přijal své místo ve světě. Duše osvobozená od trápení, která sužují mě.\n\nMožná [hermit.GetSheHe] spatřil/a pravdu, která by mohla osvobodit i mě." # todo: NEW TRANSLATION
 pam_secular_faith_events.0060.a: "Čím méně toho mám, tím víc jsem!" # todo: NEW TRANSLATION
 pam_secular_faith_events.0060.b: "Ještě jednou pozlatím svou klec!" # todo: NEW TRANSLATION
 pam_secular_faith_events.0060.c: "Dostaňte mě z toho deště." # todo: NEW TRANSLATION
