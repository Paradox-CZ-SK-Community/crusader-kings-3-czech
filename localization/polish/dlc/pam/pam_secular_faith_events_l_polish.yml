l_polish:
 pam_sf_seeded_tenet_desc: "V myšlenkách se ti usadil zvyk, který přesahuje tvou [Concept('faith','víru')|E], a získáváš [Concept('agnostic_knowledge','znalosti')|E] o [Concept('core_tenet','zásadě')|E] [pam_sf_seeded_tenet.GetBaseName]."
 pam_sf_friend_godparent: "[CZProDrop(CHARACTER,'přijala','přijal')|U] roli [Select_CString(CHARACTER.IsFemale,'kmotry','kmotra')] pro [TARGET_CHARACTER.Custom('CZ_ShortUIName_A')] a duchovní příbuzenství přerostlo v přátelství."
 pam_sf_friend_godparent_corresponding: "[CZProDrop(TARGET_CHARACTER,'přijala','přijal')|U] roli [Select_CString(TARGET_CHARACTER.IsFemale,'kmotry','kmotra')] pro [CHARACTER.Custom('CZ_ShortUIName_A')] a duchovní příbuzenství přerostlo v přátelství."
 pam_sf_friend_shared_conviction: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] [Select_CString(And(CHARACTER.IsFemale,TARGET_CHARACTER.IsFemale),Select_CString(Or(CHARACTER.IsLocalPlayer,TARGET_CHARACTER.IsLocalPlayer),'jste se sblížily','se sblížily'),Select_CString(Or(CHARACTER.IsLocalPlayer,TARGET_CHARACTER.IsLocalPlayer),'jste se sblížili','se sblížili'))] díky společnému náboženskému přesvědčení."
 pam_sf_best_friend_shared_conviction: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] [Select_CString(And(CHARACTER.IsFemale,TARGET_CHARACTER.IsFemale),Select_CString(Or(CHARACTER.IsLocalPlayer,TARGET_CHARACTER.IsLocalPlayer),'jste se staly','se staly'),Select_CString(Or(CHARACTER.IsLocalPlayer,TARGET_CHARACTER.IsLocalPlayer),'jste se stali','se stali'))] [Select_CString(And(CHARACTER.IsFemale,TARGET_CHARACTER.IsFemale),'nejlepšími přítelkyněmi','nejlepšími přáteli')] a společné náboženské přesvědčení [Select_CString(Or(CHARACTER.IsLocalPlayer,TARGET_CHARACTER.IsLocalPlayer),'vaše','jejich')] pouto prohloubilo."
 pam_sf_friend_shielded: "[CZProDrop(CHARACTER,'ochránila','ochránil')|U] [TARGET_CHARACTER.Custom('CZ_ShortUIName_A')] před náboženským pronásledováním."
 pam_sf_friend_shielded_corresponding: "[CZProDrop(TARGET_CHARACTER,'ochránila','ochránil')|U] [CHARACTER.Custom('CZ_ShortUIName_A')] před náboženským pronásledováním."
 pam_sf_lover_shared_conviction: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] [Select_CString(And(CHARACTER.IsFemale,TARGET_CHARACTER.IsFemale),Select_CString(Or(CHARACTER.IsLocalPlayer,TARGET_CHARACTER.IsLocalPlayer),'jste se staly','se staly'),Select_CString(Or(CHARACTER.IsLocalPlayer,TARGET_CHARACTER.IsLocalPlayer),'jste se stali','se stali'))] [Select_CString(And(CHARACTER.IsFemale,TARGET_CHARACTER.IsFemale),'milenkami','milenci')] díky společnému náboženskému přesvědčení."
 pam_sf_lover_carnal_revelation: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] [Select_CString(And(CHARACTER.IsFemale,TARGET_CHARACTER.IsFemale),Select_CString(Or(CHARACTER.IsLocalPlayer,TARGET_CHARACTER.IsLocalPlayer),'jste se staly','se staly'),Select_CString(Or(CHARACTER.IsLocalPlayer,TARGET_CHARACTER.IsLocalPlayer),'jste se stali','se stali'))] [Select_CString(And(CHARACTER.IsFemale,TARGET_CHARACTER.IsFemale),'milenkami','milenci')] během společné noci svatého opojení."
 pam_sf_lover_confessional: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] [Select_CString(And(CHARACTER.IsFemale,TARGET_CHARACTER.IsFemale),Select_CString(Or(CHARACTER.IsLocalPlayer,TARGET_CHARACTER.IsLocalPlayer),'jste ve zpovědnici našly','ve zpovědnici našly'),Select_CString(Or(CHARACTER.IsLocalPlayer,TARGET_CHARACTER.IsLocalPlayer),'jste ve zpovědnici našli','ve zpovědnici našli'))] víc než rozhřešení a [Select_CString(And(CHARACTER.IsFemale,TARGET_CHARACTER.IsFemale),'staly','stali')] se [Select_CString(And(CHARACTER.IsFemale,TARGET_CHARACTER.IsFemale),'milenkami','milenci')]."
 pam_sf_lover_two_faiths: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] [Select_CString(And(CHARACTER.IsFemale,TARGET_CHARACTER.IsFemale),Select_CString(Or(CHARACTER.IsLocalPlayer,TARGET_CHARACTER.IsLocalPlayer),'jste se staly','se staly'),Select_CString(Or(CHARACTER.IsLocalPlayer,TARGET_CHARACTER.IsLocalPlayer),'jste se stali','se stali'))] [Select_CString(And(CHARACTER.IsFemale,TARGET_CHARACTER.IsFemale),'milenkami','milenci')] po společných rozmluvách o spletitostech víry."
 pam_sf_soulmate_shared_conviction: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] [Select_CString(And(CHARACTER.IsFemale,TARGET_CHARACTER.IsFemale),Select_CString(Or(CHARACTER.IsLocalPlayer,TARGET_CHARACTER.IsLocalPlayer),'jste se staly','se staly'),Select_CString(Or(CHARACTER.IsLocalPlayer,TARGET_CHARACTER.IsLocalPlayer),'jste se stali','se stali'))] spřízněnými dušemi a společné náboženské přesvědčení [Select_CString(Or(CHARACTER.IsLocalPlayer,TARGET_CHARACTER.IsLocalPlayer),'vaši','jejich')] lásku prohloubilo."
 pam_sf_rival_bought_office: "[CZProDrop(CHARACTER,'prodala','prodal')|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer,'tvůj posvátný úřad',Concatenate('posvátný úřad ',TARGET_CHARACTER.Custom('CZ_ShortUINameNoTooltip_G')))] cizí osobě, která za něj mohla zaplatit."
 pam_sf_rival_bought_office_corresponding: "[CZProDrop(TARGET_CHARACTER,'prodala','prodal')|U] [Select_CString(CHARACTER.IsLocalPlayer,'tvůj posvátný úřad',Concatenate('posvátný úřad ',CHARACTER.Custom('CZ_ShortUINameNoTooltip_G')))] cizí osobě, která za něj mohla zaplatit."
 pam_sf_nemesis_forced_to_cloister: "[CZProDrop(TARGET_CHARACTER,'donutila','donutil')|U] [CHARACTER.Custom('CZ_ShortUIName_A')] vstoupit do kláštera a složit řeholní sliby."
 pam_sf_nemesis_forced_to_cloister_corresponding: "[CZProDrop(CHARACTER,'donutila','donutil')|U] [TARGET_CHARACTER.Custom('CZ_ShortUIName_A')] vstoupit do kláštera a složit řeholní sliby."
 pam_my_liege_reverend_father: "ctihodný otče"
