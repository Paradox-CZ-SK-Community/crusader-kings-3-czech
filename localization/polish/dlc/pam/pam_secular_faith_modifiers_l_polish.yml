l_polish:
 pam_sf_devotion_modifier: "Oddanost blahobytu" # todo: NEW TRANSLATION
 pam_sf_devotion_modifier_desc: "Tato postava se v soukromí oddala zbožnosti, za což se jí dostává nenápadné odměny v podobě zbožnosti a mincí." # todo: NEW TRANSLATION
 pam_sf_grace_modifier: "Obdržená milost" # todo: NEW TRANSLATION
 pam_sf_grace_modifier_desc: "Tato postava obdržela milost, poděkování či tichý slib, který pozvedá ducha." # todo: NEW TRANSLATION
 pam_sf_consolation_modifier: "V duševním klidu" # todo: NEW TRANSLATION
 pam_sf_consolation_modifier_desc: "Tato postava je v duševním klidu." # todo: NEW TRANSLATION
 pam_sf_visionary_renown_modifier: "Vyhlášené vidění" # todo: NEW TRANSLATION
 pam_sf_visionary_renown_modifier_desc: "Tato postava vyhlásila u dvora božské vidění, čímž upevnila své postavení." # todo: NEW TRANSLATION
 pam_sf_consecrated_arms_modifier: "Posvěcený erb" # todo: NEW TRANSLATION
 pam_sf_consecrated_arms_modifier_desc: "Domácí erb této postavy byl požehnán o svátku svatého." # todo: NEW TRANSLATION
 pam_sf_serenity_modifier: "Veřejné obřady na odiv" # todo: NEW TRANSLATION
 pam_sf_serenity_modifier_desc: "Veřejná zbožnost této postavy jí získala přízeň duchovenstva i dvora." # todo: NEW TRANSLATION
 pam_sf_humiliated_modifier: "Pokořující sliby" # todo: NEW TRANSLATION
 pam_sf_humiliated_modifier_desc: "Tato postava byla přinucena složit řeholní sliby a uzavřít se do kláštera." # todo: NEW TRANSLATION
 pam_sf_promised_acclaim_modifier: "Poutníkovo zaslíbení" # todo: NEW TRANSLATION
 pam_sf_promised_acclaim_modifier_desc: "Duchovní této postavy slíbil, že lidem v hlavním městě vyhlásí její příští dokončenou pouť.\n\nPo dokončení pouti získá její [capital|E] na #V 15#! let modifikátor [GetModifier('pam_sf_extolled_pilgrimage_county_modifier').GetNameWithTooltip]." # todo: NEW TRANSLATION
 pam_sf_extolled_pilgrimage_county_modifier: "Vítání poutníka" # todo: NEW TRANSLATION
 pam_sf_extolled_pilgrimage_county_modifier_desc: "Zpráva o pouti zdejšího vládce se rozléhá po celém hrabství a místní prospívají díky hrdosti, kterou jim přináší." # todo: NEW TRANSLATION
 pam_sf_free_feast_discount_desc: "Chystá se hostina" # todo: NEW TRANSLATION
 pam_sf_free_feast_modifier: "Touha po hostině" # todo: NEW TRANSLATION
 pam_sf_free_feast_modifier_desc: "Náznak svatého požitkářství zvýšil této postavě chuť k jídlu:\n$EFFECT_LIST_BULLET$Cena příští [GetActivityType( 'activity_feast').GetName]: [gold_i]#P -100%#!\n#weak Efekt se spotřebuje při zahájení hostiny.#!" # todo: NEW TRANSLATION
 pam_sf_pilgrimage_funded_modifier: "Zasponzorovaná pouť" # todo: NEW TRANSLATION
 pam_sf_pilgrimage_funded_modifier_desc: "Mecenáš slíbil, že uhradí část nákladů na příští pouť této postavy:\n$EFFECT_LIST_BULLET$Cena [GetActivityType( 'activity_pilgrimage').GetName]: [gold_i]#P -50%#!" # todo: NEW TRANSLATION
 pam_sf_pilgrimage_funded_discount_desc: "Zasponzorovaná pouť" # todo: NEW TRANSLATION
 pam_sf_ear_of_clergy_modifier: "Přízeň duchovenstva" # todo: NEW TRANSLATION
 pam_sf_ear_of_clergy_modifier_desc: "Církev spíše vyhoví žádostem této postavy:\n$EFFECT_LIST_BULLET$#V $hof_ask_for_claim_interaction$#! Přijetí: #P +25#!\n$EFFECT_LIST_BULLET$#V $hof_ask_for_gold_interaction$#! Přijetí: #P +25#!\n$EFFECT_LIST_BULLET$#V $request_excommunication_interaction$#! Přijetí: #P +25#!\n$EFFECT_LIST_BULLET$#V $request_legitimacy_interaction$#! Přijetí: #P +25#!\n$EFFECT_LIST_BULLET$#V $ecclesiastic_grant_claim_interaction$#! Přijetí: #P +25#!\n$EFFECT_LIST_BULLET$#V $strengthen_claim_interaction$#! Přijetí: #P +25#!\n$EFFECT_LIST_BULLET$#V $request_enforce_succession_interaction$#! Přijetí: #P +25#!\n$EFFECT_LIST_BULLET$#V $request_white_peace_interaction$#! Přijetí: #P +25#!" # todo: NEW TRANSLATION
 pam_religious_delirium_modifier: "Náboženské blouznění" # todo: NEW TRANSLATION
 pam_religious_delirium_modifier_desc: "Tato postava je přesvědčena, že k ní promlouvají sama nebesa:\n$EFFECT_LIST_BULLET$Přírůstek [spiritual_fulfillment|E]: #P +50%#!\n$EFFECT_LIST_BULLET$Úbytek [spiritual_fulfillment|E]: #N +50%#!" # todo: NEW TRANSLATION
 pam_sf_church_builder_modifier: "Budovatel kostelů" # todo: NEW TRANSLATION
 pam_sf_church_builder_modifier_desc: "Poté, co tato postava vystavěla první svatostánek, buduje kostely o něco levněji a získává stálý přísun zbožnosti." # todo: NEW TRANSLATION
 pam_sf_scriptorium_county_modifier: "Písaři při práci" # todo: NEW TRANSLATION
 pam_sf_scriptorium_county_modifier_desc: "Usazení učenci vedou a opisují účty tohoto panství." # todo: NEW TRANSLATION
 pam_sf_doctrine_clarity_modifier: "Prozření" # todo: NEW TRANSLATION
 pam_sf_doctrine_clarity_modifier_desc: "Tato postava zažila vzácný okamžik jasnosti, skutečné prozření." # todo: NEW TRANSLATION
 pam_sf_favorable_omen_modifier: "Příznivé znamení" # todo: NEW TRANSLATION
 pam_sf_favorable_omen_modifier_desc: "Tato postava vykládá nebeská znamení jako projev božské přízně a věřící čerpají z požehnání naději." # todo: NEW TRANSLATION
 pam_sf_omen_of_victory_modifier: "Znamení vítězství" # todo: NEW TRANSLATION
 pam_sf_omen_of_victory_modifier_desc: "Tato postava je přesvědčena, že jí nebesa slíbila vítězství, a tak ona i její vojsko táhnou beze strachu." # todo: NEW TRANSLATION
 pam_sf_demon_torment_modifier: "Démonická muka" # todo: NEW TRANSLATION
 pam_sf_demon_torment_modifier_desc: "Tato postava je přesvědčena, že ji pronásleduje démon, a potřebuje vybudovat [holding|E] [GetBuilding('temple_01').GetName] nebo se vydat na [GetActivityType('activity_pilgrimage').GetName]." # todo: NEW TRANSLATION
 pam_sf_besieged_by_demons_modifier: "Obklíčena démony" # todo: NEW TRANSLATION
 pam_sf_besieged_by_demons_modifier_desc: "Mysl této postavy je pod démonickým útokem. Blouzní, zmítá se v křečích a s každým dalším dnem se stále více vzdaluje rozumu." # todo: NEW TRANSLATION
 pam_sf_grief_solace_modifier: "Utěšena duchem" # todo: NEW TRANSLATION
 pam_sf_grief_solace_modifier_desc: "Tato postava nalezla útěchu po údajném zjevení přízraku." # todo: NEW TRANSLATION
 pam_sf_grief_warning_modifier: "Varována duchem" # todo: NEW TRANSLATION
 pam_sf_grief_warning_modifier_desc: "Tato postava věří, že ji varoval přízrak." # todo: NEW TRANSLATION
 pam_sf_peace_of_god_modifier: "Boží mír" # todo: NEW TRANSLATION
 pam_sf_peace_of_god_modifier_desc: "Tato postava přísahala dodržovat Boží mír v celé říši a zajistila jeho vymáhání." # todo: NEW TRANSLATION
 pam_sf_immured_anchorite_modifier: "Zazděný poustevník" # todo: NEW TRANSLATION
 pam_sf_immured_anchorite_modifier_desc: "V zdejší svatyni je zazděn poustevník." # todo: NEW TRANSLATION
 pam_sf_voice_of_jesus_modifier: "Boží hlas" # todo: NEW TRANSLATION
 pam_sf_voice_of_jesus_modifier_desc: "Tuto postavu oslovil božský hlas a ona povstala proměněná, s bystřejšími smysly, jako by se jí dotkla sama Boží ruka." # todo: NEW TRANSLATION
 pam_sf_stroke_of_god_modifier: "Boží rána" # todo: NEW TRANSLATION
 pam_sf_stroke_of_god_modifier_desc: "Tuto postavu náhle postihla mrtvice, kterou lékaři nazývají „Boží ranou“ — božským úderem, jenž zaplaví mozek a zanechá tělo i mysl ochromené." # todo: NEW TRANSLATION
 pam_sf_lingering_stench_modifier: "Přetrvávající zápach" # todo: NEW TRANSLATION
 pam_sf_lingering_stench_modifier_desc: "Ať se tato postava snaží sebevíc, nedokáže zapomenout na zápach žebrákových nohou, které umývala." # todo: NEW TRANSLATION
 pam_sf_site_of_miracle_county_modifier: "Místo zázraku" # todo: NEW TRANSLATION
 pam_sf_site_of_miracle_county_modifier_desc: "Toto hrabství je dějištěm zázraku a přitahuje poutníky i bandity." # todo: NEW TRANSLATION
 pam_sf_consecrated_county_modifier: "Nově vysvěcený" # todo: NEW TRANSLATION
 pam_sf_consecrated_county_modifier_desc: "V tomto hrabství se nachází nově vysvěcený kostel." # todo: NEW TRANSLATION
 pam_sf_flagellant_cults_county_modifier: "Hnutí flagelantů" # todo: NEW TRANSLATION
 pam_sf_flagellant_cults_county_modifier_desc: "Zástupy kajícníků se bičují v ulicích tohoto hrabství." # todo: NEW TRANSLATION
 pam_sf_relic_procession_county_modifier: "Světec vyšel mezi lid" # todo: NEW TRANSLATION
 pam_sf_relic_procession_county_modifier_desc: "Ostatky světce byly neseny tímto hrabstvím ve slavnostním průvodu a lidé díky tomu chodí o něco hrději." # todo: NEW TRANSLATION
 pam_sf_blessed_bell_county_modifier: "Pokřtěný zvon" # todo: NEW TRANSLATION
 pam_sf_blessed_bell_county_modifier_desc: "Kostelní zvon v tomto hrabství byl omyt, pomazán olejem a pojmenován. Lidé věří, že jeho hlas zažene bouři i démona." # todo: NEW TRANSLATION
 pam_sf_church_ale_county_modifier: "Kostelní pivo" # todo: NEW TRANSLATION
 pam_sf_church_ale_county_modifier_desc: "Vládce tohoto hrabství popíjel s farníky kostelní pivo a ve farnosti se o tom stále živě hovoří." # todo: NEW TRANSLATION
 pam_sf_safe_passage_modifier: "Bezpečný průchod" # todo: NEW TRANSLATION
 pam_sf_safe_passage_modifier_desc: "Tento cestovatel po záchraně na cestě získal doprovod a bezpečný průchod." # todo: NEW TRANSLATION
 pam_sf_waylaid_road_modifier: "Přepaden na cestě" # todo: NEW TRANSLATION
 pam_sf_waylaid_road_modifier_desc: "Po přepadení na cestě se cesta tohoto cestovatele stala nebezpečnou." # todo: NEW TRANSLATION
 pam_sf_penance_lustful_modifier: "Potlačování chtíče" # todo: NEW TRANSLATION
 pam_sf_penance_lustful_modifier_desc: "Tato postava činí pokání za smilstvo a krotí svou touhu za cenu menšího počtu potomků." # todo: NEW TRANSLATION
 pam_sf_penance_chaste_modifier: "Odkládání zdrženlivosti" # todo: NEW TRANSLATION
 pam_sf_penance_chaste_modifier_desc: "Tato postava se vzdává cudnosti, kterou její víra považuje za hříšnou, ačkoli je jí to proti srsti." # todo: NEW TRANSLATION
 pam_sf_penance_gluttonous_modifier: "Dny půstu" # todo: NEW TRANSLATION
 pam_sf_penance_gluttonous_modifier_desc: "Tato postava se postí za obžerství a oslabuje tělo, aby posílila duši." # todo: NEW TRANSLATION
 pam_sf_penance_temperate_modifier: "Konec dlouhého půstu" # todo: NEW TRANSLATION
 pam_sf_penance_temperate_modifier_desc: "Tato postava opouští střídmost, kterou její víra považuje za hříšnou, a je nyní rozhazovačnější i méně zdrženlivá." # todo: NEW TRANSLATION
 pam_sf_penance_greedy_modifier: "Kajícné almužny" # todo: NEW TRANSLATION
 pam_sf_penance_greedy_modifier_desc: "Tato postava rozdává almužny za svou chamtivost, čímž odlehčuje měšci i svědomí." # todo: NEW TRANSLATION
 pam_sf_penance_generous_modifier: "Zavřená měšec" # todo: NEW TRANSLATION
 pam_sf_penance_generous_modifier_desc: "Tato postava krotí štědrost, kterou její víra považuje za hříšnou, a je bohatší, ale lidé jí to zazlívají." # todo: NEW TRANSLATION
 pam_sf_penance_lazy_modifier: "Kajícné úsilí" # todo: NEW TRANSLATION
 pam_sf_penance_lazy_modifier_desc: "Tato postava se za svou lenost pouští do vyčerpávající práce." # todo: NEW TRANSLATION
 pam_sf_penance_diligent_modifier: "Vynucený odpočinek" # todo: NEW TRANSLATION
 pam_sf_penance_diligent_modifier_desc: "Tato postava odkládá píli, kterou její víra považuje za hříšnou, a je klidnější, ale méně produktivní." # todo: NEW TRANSLATION
 pam_sf_penance_wrathful_modifier: "Krocení hněvu" # todo: NEW TRANSLATION
 pam_sf_penance_wrathful_modifier_desc: "Tato postava činí pokání tím, že krotí svůj hněv. Její ruka je mírnější a čepel tupější." # todo: NEW TRANSLATION
 pam_sf_penance_calm_modifier: "Rozdmýchávání ducha" # todo: NEW TRANSLATION
 pam_sf_penance_calm_modifier_desc: "Tato postava mění klid, který její víra považuje za hříšný, ve vroucí zápal — je bojovnější, ale napjatější." # todo: NEW TRANSLATION
 pam_sf_penance_patient_modifier: "Zrychlování tempa" # todo: NEW TRANSLATION
 pam_sf_penance_patient_modifier_desc: "Tato postava odhazuje trpělivost, kterou její víra považuje za hříšnou, a jedná ve spěchu a neklidu." # todo: NEW TRANSLATION
 pam_sf_penance_impatient_modifier: "Pěstování trpělivosti" # todo: NEW TRANSLATION
 pam_sf_penance_impatient_modifier_desc: "Tato postava činí pokání tím, že krotí svou netrpělivou povahu, ale čekání jí jde proti srsti." # todo: NEW TRANSLATION
 pam_sf_penance_arrogant_modifier: "Cvičení v pokoře" # todo: NEW TRANSLATION
 pam_sf_penance_arrogant_modifier_desc: "Tato postava se v pokání pokořuje a potlačuje svou pýchu, ale její věhlas tím upadá." # todo: NEW TRANSLATION
 pam_sf_penance_humble_modifier: "Přijímání hrdého postoje" # todo: NEW TRANSLATION
 pam_sf_penance_humble_modifier_desc: "Tato postava dává najevo pýchu, kterou její víra žádá namísto pokory. Získává věhlas, ale lidé ji považují za domýšlivou." # todo: NEW TRANSLATION
 pam_sf_penance_deceitful_modifier: "Slib upřímnosti" # todo: NEW TRANSLATION
 pam_sf_penance_deceitful_modifier_desc: "Tato postava dodržuje slib jednat otevřeně jako pokání za svou lstivost, která tím otupuje." # todo: NEW TRANSLATION
 pam_sf_penance_honest_modifier: "Učí se přetvářce" # todo: NEW TRANSLATION
 pam_sf_penance_honest_modifier_desc: "Tato postava se učí lstivosti, kterou její víra staví nad upřímnost; je prohnanější, ale méně důvěryhodná." # todo: NEW TRANSLATION
 pam_sf_penance_craven_modifier: "Čelí strachu" # todo: NEW TRANSLATION
 pam_sf_penance_craven_modifier_desc: "Tato postava stojí pevně jako pokání za svou zbabělost a děsí se každého okamžiku." # todo: NEW TRANSLATION
 pam_sf_penance_brave_modifier: "Krotí svou odvahu" # todo: NEW TRANSLATION
 pam_sf_penance_brave_modifier_desc: "Tato postava krotí odvahu, kterou její víra považuje za hříšnou, a mění ji v obezřetnost. Její bojovnost tím otupuje." # todo: NEW TRANSLATION
 pam_sf_penance_shy_modifier: "Nutí se k smělosti" # todo: NEW TRANSLATION
 pam_sf_penance_shy_modifier_desc: "Tato postava se jako pokání za svou uzavřenost nutí působit odvážně; každé společenské setkání je pro ni zkouškou." # todo: NEW TRANSLATION
 pam_sf_penance_gregarious_modifier: "Uzavírá se do mlčení" # todo: NEW TRANSLATION
 pam_sf_penance_gregarious_modifier_desc: "Tato postava se zříká hříšného veselí a uzavírá se do mlčení, kvůli čemuž má méně přátel." # todo: NEW TRANSLATION
 pam_sf_penance_ambitious_modifier: "Krotí své ambice" # todo: NEW TRANSLATION
 pam_sf_penance_ambitious_modifier_desc: "Tato postava jako pokání mírní své ambice, a tím i svůj věhlas." # todo: NEW TRANSLATION
 pam_sf_penance_content_modifier: "Probouzí touhu" # todo: NEW TRANSLATION
 pam_sf_penance_content_modifier_desc: "Tato postava v sobě probouzí touhu a neklidnou snahu, aby se vzepřela spokojenosti, kterou její víra považuje za hříšnou." # todo: NEW TRANSLATION
 pam_sf_penance_arbitrary_modifier: "Vládne spravedlivě" # todo: NEW TRANSLATION
 pam_sf_penance_arbitrary_modifier_desc: "Tato postava jako pokání za své svévolné jednání vládne nestranněji; je spravedlivější, ale chudší." # todo: NEW TRANSLATION
 pam_sf_penance_just_modifier: "Vládne podle rozmaru" # todo: NEW TRANSLATION
 pam_sf_penance_just_modifier_desc: "Tato postava vládne podle rozmaru, jak její víra žádá, a ne podle spravedlnosti; je bohatší, ale méně oblíbená." # todo: NEW TRANSLATION
 pam_sf_penance_cynical_modifier: "Znovu v sobě probouzí víru" # todo: NEW TRANSLATION
 pam_sf_penance_cynical_modifier_desc: "Tato postava jako pokání za svůj cynismus znovu probouzí víru; připadá jí však cizí jako neznámý plášť." # todo: NEW TRANSLATION
 pam_sf_penance_zealous_modifier: "Krotí svou horlivost" # todo: NEW TRANSLATION
 pam_sf_penance_zealous_modifier_desc: "Tato postava krotí horlivost, kterou její víra považuje za přehnanou, a zbožní kvůli tomu chladnou." # todo: NEW TRANSLATION
 pam_sf_penance_paranoid_modifier: "Učí se důvěřovat" # todo: NEW TRANSLATION
 pam_sf_penance_paranoid_modifier_desc: "Tato postava se jako pokání za svou podezíravost učí důvěřovat; otevírá dveře a polevuje v ostražitosti." # todo: NEW TRANSLATION
 pam_sf_penance_trusting_modifier: "Střeží své srdce" # todo: NEW TRANSLATION
 pam_sf_penance_trusting_modifier_desc: "Tato postava střeží své srdce, které její víra považuje za příliš důvěřivé; je obezřetnější, ale působí chladně." # todo: NEW TRANSLATION
 pam_sf_penance_compassionate_modifier: "Potlačuje milosrdenství" # todo: NEW TRANSLATION
 pam_sf_penance_compassionate_modifier_desc: "Tato postava potlačuje milosrdenství, které její víra považuje za hříšné, a nasazuje kvůli tomu přísnější tvář." # todo: NEW TRANSLATION
 pam_sf_penance_callous_modifier: "Pěstuje milosrdenství" # todo: NEW TRANSLATION
 pam_sf_penance_callous_modifier_desc: "Tato postava jako pokání za bezcitnost pěstuje milosrdenství; jedná mírněji a strach, na který spoléhala, pomalu vyprchává." # todo: NEW TRANSLATION
 pam_sf_penance_sadistic_modifier: "Zříká se krutosti" # todo: NEW TRANSLATION
 pam_sf_penance_sadistic_modifier_desc: "Tato postava se jako pokání zříká krutosti a hrůza, kterou tím budila, pomalu vyprchává." # todo: NEW TRANSLATION
 pam_sf_penance_stubborn_modifier: "Ohýbá svou vůli" # todo: NEW TRANSLATION
 pam_sf_penance_stubborn_modifier_desc: "Tato postava jako pokání podrobuje svou tvrdohlavou vůli nápravě a ustupuje, i když by dříve neustoupila." # todo: NEW TRANSLATION
 pam_sf_penance_fickle_modifier: "Upevňuje svou duši" # todo: NEW TRANSLATION
 pam_sf_penance_fickle_modifier_desc: "Tato postava jako pokání za svou vrtkavost drží pevný směr, což jí není po chuti." # todo: NEW TRANSLATION
 pam_sf_penance_eccentric_modifier: "Přijímá konvence" # todo: NEW TRANSLATION
 pam_sf_penance_eccentric_modifier_desc: "Tato postava se jako pokání za svou výstřednost vzdává neobvyklých myšlenek." # todo: NEW TRANSLATION
 pam_sf_penance_vengeful_modifier: "Učí se odpouštět" # todo: NEW TRANSLATION
 pam_sf_penance_vengeful_modifier_desc: "Tato postava jako pokání za svou pomstychtivost pouští staré křivdy; k zajatcům je mírnější, ale s odplatou váhá." # todo: NEW TRANSLATION
 pam_sf_penance_forgiving_modifier: "Pěstuje zášť" # todo: NEW TRANSLATION
 pam_sf_penance_forgiving_modifier_desc: "Tato postava pěstuje zášť, kterou její víra upřednostňuje před odpuštěním; je chladnější a budí větší strach." # todo: NEW TRANSLATION
 pam_mystical_birthright_spiritual_leader_modifier: "Požehnané dědictví" # todo: NEW TRANSLATION
 pam_mystical_birthright_spiritual_leader_modifier_desc: "Duchovní výchovu této postavy ovlivnilo znamení, s nímž se narodila." # todo: NEW TRANSLATION
 pam_personal_sacrifice_of_wealth_county_modifier: "Zbožná investice" # todo: NEW TRANSLATION
 pam_personal_sacrifice_of_wealth_county_modifier_desc: "Zbožný dar vládce podporuje rozvoj této hrabství." # todo: NEW TRANSLATION
 pam_sf_grinding_modifier: "Bezduchá dřina" # todo: NEW TRANSLATION
 pam_sf_grinding_modifier_desc: "Tato postava se bez ustání lopotí a její duše za to trpí." # todo: NEW TRANSLATION
