l_polish:
 pam_sf_devotion_modifier: "Oddanost blahobytu"
 pam_sf_devotion_modifier_desc: "Tato postava se v soukromí oddala zbožnosti, za což se jí dostává nenápadné odměny v podobě zbožnosti a mincí."
 pam_sf_grace_modifier: "Obdržená milost"
 pam_sf_grace_modifier_desc: "Této postavě přinesla milost, děkovná modlitba či tichý slib duchovní povzbuzení."
 pam_sf_consolation_modifier: "V duševním klidu"
 pam_sf_consolation_modifier_desc: "Tato postava je v duševním klidu."
 pam_sf_visionary_renown_modifier: "Vyhlášené vidění"
 pam_sf_visionary_renown_modifier_desc: "Tato postava vyhlásila u dvora božské vidění, čímž upevnila své postavení."
 pam_sf_consecrated_arms_modifier: "Posvěcené zbraně"
 pam_sf_consecrated_arms_modifier_desc: "Tato postava si o svátečním dni nechala požehnat zbraně své domácnosti."
 pam_sf_serenity_modifier: "Chvála veřejných obřadů"
 pam_sf_serenity_modifier_desc: "Veřejná zbožnost této postavy jí získala přízeň duchovenstva i dvora."
 pam_sf_humiliated_modifier: "Pokořující sliby"
 pam_sf_humiliated_modifier_desc: "Tato postava byla přinucena složit řeholní sliby a uzavřít se do kláštera."
 pam_sf_promised_acclaim_modifier: "Poutníkovo zaslíbení"
 pam_sf_promised_acclaim_modifier_desc: "Vrchní duchovní této postavy přislíbil, že lidem v hlavním městě oznámí její příští dokončenou pouť.\n\nPo dokončení pouti získá její [Concept('capital','hlavní město')|E] na #V 15#! let modifikátor [GetModifier('pam_sf_extolled_pilgrimage_county_modifier').GetNameWithTooltip]."
 pam_sf_extolled_pilgrimage_county_modifier: "Vítání poutníka"
 pam_sf_extolled_pilgrimage_county_modifier_desc: "Zpráva o pouti zdejšího vládce se rozléhá po celém hrabství a místní prospívají díky hrdosti, kterou jim přináší."
 pam_sf_free_feast_discount_desc: "Chystá se hostina"
 pam_sf_free_feast_modifier: "Touha po hostině"
 pam_sf_free_feast_modifier_desc: "Pohled na svaté požitkářství zvýšil této postavě chuť k hodování:\n$EFFECT_LIST_BULLET$Náklady na příští [CZActivity('activity_feast','A')|l]: [gold_i]#P -100%#!\n#weak Spotřebuje se při zahájení hostiny.#!"
 pam_sf_pilgrimage_funded_modifier: "Financovaná pouť"
 pam_sf_pilgrimage_funded_modifier_desc: "Mecenáš přislíbil uhradit část nákladů na příští pouť této postavy:\n$EFFECT_LIST_BULLET$Náklady na [CZActivity('activity_pilgrimage','A')|l]: [gold_i]#P -50%#!"
 pam_sf_pilgrimage_funded_discount_desc: "Financovaná pouť"
 pam_sf_ear_of_clergy_modifier: "Přízeň duchovenstva"
 pam_sf_ear_of_clergy_modifier_desc: "Církev spíše vyhoví žádostem této postavy:\n$EFFECT_LIST_BULLET$#V $hof_ask_for_claim_interaction$#! — přijetí: #P +25#!\n$EFFECT_LIST_BULLET$#V $hof_ask_for_gold_interaction$#! — přijetí: #P +25#!\n$EFFECT_LIST_BULLET$#V $request_excommunication_interaction$#! — přijetí: #P +25#!\n$EFFECT_LIST_BULLET$#V $request_legitimacy_interaction$#! — přijetí: #P +25#!\n$EFFECT_LIST_BULLET$#V $ecclesiastic_grant_claim_interaction$#! — přijetí: #P +25#!\n$EFFECT_LIST_BULLET$#V $strengthen_claim_interaction$#! — přijetí: #P +25#!\n$EFFECT_LIST_BULLET$#V $request_enforce_succession_interaction$#! — přijetí: #P +25#!\n$EFFECT_LIST_BULLET$#V $request_white_peace_interaction$#! — přijetí: #P +25#!"
 pam_religious_delirium_modifier: "Náboženské blouznění"
 pam_religious_delirium_modifier_desc: "Tato postava je přesvědčena, že k ní promlouvají sama nebesa:\n$EFFECT_LIST_BULLET$Přírůstek [Concept('spiritual_fulfillment','duchovního naplnění')|E]: #P +50%#!\n$EFFECT_LIST_BULLET$Úbytek [Concept('spiritual_fulfillment','duchovního naplnění')|E]: #N +50%#!"
 pam_sf_church_builder_modifier: "Budovatel kostelů"
 pam_sf_church_builder_modifier_desc: "Poté, co tato postava vystavěla první svatostánek, buduje kostely o něco levněji a získává stálý přísun zbožnosti."
 pam_sf_scriptorium_county_modifier: "Písaři při práci"
 pam_sf_scriptorium_county_modifier_desc: "Usazení učenci opisují a vedou účty této držby."
 pam_sf_doctrine_clarity_modifier: "Prozření"
 pam_sf_doctrine_clarity_modifier_desc: "Tato postava zažila vzácný okamžik jasnosti, skutečné prozření."
 pam_sf_favorable_omen_modifier: "Příznivé znamení"
 pam_sf_favorable_omen_modifier_desc: "Tato postava vykládá nebeská znamení jako projev božské přízně a věřící čerpají z požehnání naději."
 pam_sf_omen_of_victory_modifier: "Znamení vítězství"
 pam_sf_omen_of_victory_modifier_desc: "Tato postava je přesvědčena, že jí nebesa slíbila vítězství, a tak ona i její vojsko táhnou beze strachu."
 pam_sf_demon_torment_modifier: "Démonická muka"
 pam_sf_demon_torment_modifier_desc: "Tato postava je přesvědčena, že ji pronásleduje démon a že musí vystavět [Concept('holding','držbu')|E] [GetBuilding('temple_01').GetName] nebo se vydat na [CZActivity('activity_pilgrimage','A')|l]."
 pam_sf_besieged_by_demons_modifier: "Obklíčena démony"
 pam_sf_besieged_by_demons_modifier_desc: "Mysl této postavy je pod démonickým útokem. Blouzní, zmítá se v křečích a s každým dalším dnem se stále více vzdaluje rozumu."
 pam_sf_grief_solace_modifier: "Utěšena duchem"
 pam_sf_grief_solace_modifier_desc: "Tato postava nalezla útěchu po údajném zjevení přízraku."
 pam_sf_grief_warning_modifier: "Varována duchem"
 pam_sf_grief_warning_modifier_desc: "Tato postava věří, že ji varoval přízrak."
 pam_sf_peace_of_god_modifier: "Boží mír"
 pam_sf_peace_of_god_modifier_desc: "Tato postava přísahala dodržovat Boží mír a prosadila jej v celém panství."
 pam_sf_immured_anchorite_modifier: "Zazděný poustevník"
 pam_sf_immured_anchorite_modifier_desc: "V zdejší svatyni je zazděn poustevník."
 pam_sf_voice_of_jesus_modifier: "Boží hlas"
 pam_sf_voice_of_jesus_modifier_desc: "Tuto postavu oslovil božský hlas a ona povstala proměněná, s bystřejšími smysly, jako by se jí dotkla sama Boží ruka."
 pam_sf_stroke_of_god_modifier: "Boží rána"
 pam_sf_stroke_of_god_modifier_desc: "Tuto postavu náhle postihla mrtvice, kterou lékaři nazývají „Boží ranou“ — božským úderem, jenž zaplaví mozek a zanechá tělo i mysl ochromené."
 pam_sf_lingering_stench_modifier: "Přetrvávající zápach"
 pam_sf_lingering_stench_modifier_desc: "Ať se tato postava snaží sebevíc, nedokáže zapomenout na zápach žebrákových nohou, které umývala."
 pam_sf_site_of_miracle_county_modifier: "Místo zázraku"
 pam_sf_site_of_miracle_county_modifier_desc: "Toto hrabství je dějištěm zázraku a přitahuje poutníky i bandity."
 pam_sf_consecrated_county_modifier: "Nově vysvěcený"
 pam_sf_consecrated_county_modifier_desc: "V tomto hrabství se nachází nově vysvěcený kostel."
 pam_sf_flagellant_cults_county_modifier: "Hnutí flagelantů"
 pam_sf_flagellant_cults_county_modifier_desc: "Zástupy kajícníků se bičují v ulicích tohoto hrabství."
 pam_sf_relic_procession_county_modifier: "Světec vyšel mezi lid"
 pam_sf_relic_procession_county_modifier_desc: "Ostatky světce byly neseny tímto hrabstvím ve slavnostním průvodu a lidé díky tomu chodí o něco hrději."
 pam_sf_blessed_bell_county_modifier: "Pokřtěný zvon"
 pam_sf_blessed_bell_county_modifier_desc: "Kostelní zvon v tomto hrabství byl omyt, pomazán olejem a pojmenován. Lidé věří, že jeho hlas zažene bouři i démona."
 pam_sf_church_ale_county_modifier: "Kostelní pivo"
 pam_sf_church_ale_county_modifier_desc: "Vládce tohoto hrabství popíjel s farníky kostelní pivo a ve farnosti se o tom stále živě hovoří."
 pam_sf_safe_passage_modifier: "Bezpečný průchod"
 pam_sf_safe_passage_modifier_desc: "Po záchraně na cestě získala tato cestující postava doprovod a záruku bezpečného průchodu."
 pam_sf_waylaid_road_modifier: "Přepaden na cestě"
 pam_sf_waylaid_road_modifier_desc: "Po přepadení na cestě se putování této cestující postavy stalo nebezpečným."
 pam_sf_penance_lustful_modifier: "Potlačování chtíče"
 pam_sf_penance_lustful_modifier_desc: "Tato postava činí pokání za chtíč a krotí svou touhu za cenu menšího počtu potomků."
 pam_sf_penance_chaste_modifier: "Odkládání zdrženlivosti"
 pam_sf_penance_chaste_modifier_desc: "Tato postava se vzdává cudnosti, kterou její víra považuje za hříšnou, ačkoli je jí to proti srsti."
 pam_sf_penance_gluttonous_modifier: "Dny půstu"
 pam_sf_penance_gluttonous_modifier_desc: "Tato postava se postí za obžerství a oslabuje tělo, aby posílila duši."
 pam_sf_penance_temperate_modifier: "Konec dlouhého půstu"
 pam_sf_penance_temperate_modifier_desc: "Tato postava opouští střídmost, kterou její víra považuje za hříšnou, a je nyní rozhazovačnější i méně zdrženlivá."
 pam_sf_penance_greedy_modifier: "Kajícné almužny"
 pam_sf_penance_greedy_modifier_desc: "Tato postava rozdává almužny za svou chamtivost, čímž odlehčuje měšci i svědomí."
 pam_sf_penance_generous_modifier: "Zavřený měšec"
 pam_sf_penance_generous_modifier_desc: "Tato postava krotí štědrost, kterou její víra považuje za hříšnou, a je bohatší, ale lidé jí to zazlívají."
 pam_sf_penance_lazy_modifier: "Kajícné úsilí"
 pam_sf_penance_lazy_modifier_desc: "Tato postava se za svou lenost pouští do vyčerpávající práce."
 pam_sf_penance_diligent_modifier: "Vynucený odpočinek"
 pam_sf_penance_diligent_modifier_desc: "Tato postava odkládá píli, kterou její víra považuje za hříšnou, a je klidnější, ale méně produktivní."
 pam_sf_penance_wrathful_modifier: "Krocení hněvu"
 pam_sf_penance_wrathful_modifier_desc: "Tato postava činí pokání tím, že krotí svůj hněv. Její ruka je mírnější a čepel tupější."
 pam_sf_penance_calm_modifier: "Rozdmýchávání ducha"
 pam_sf_penance_calm_modifier_desc: "Tato postava mění klid, který její víra považuje za hříšný, ve vroucí zápal — je bojovnější, ale napjatější."
 pam_sf_penance_patient_modifier: "Zrychlování tempa"
 pam_sf_penance_patient_modifier_desc: "Tato postava odhazuje trpělivost, kterou její víra považuje za hříšnou, a jedná ve spěchu a neklidu."
 pam_sf_penance_impatient_modifier: "Pěstování trpělivosti"
 pam_sf_penance_impatient_modifier_desc: "Tato postava činí pokání tím, že krotí svou netrpělivou povahu, ale čekání jí jde proti srsti."
 pam_sf_penance_arrogant_modifier: "Cvičení v pokoře"
 pam_sf_penance_arrogant_modifier_desc: "Tato postava se v pokání pokořuje a potlačuje svou pýchu, ale její věhlas tím upadá."
 pam_sf_penance_humble_modifier: "Přijímání hrdého postoje"
 pam_sf_penance_humble_modifier_desc: "Tato postava dává najevo pýchu, kterou její víra žádá namísto pokory. Získává věhlas, ale lidé ji považují za domýšlivou."
 pam_sf_penance_deceitful_modifier: "Slib upřímnosti"
 pam_sf_penance_deceitful_modifier_desc: "Tato postava jako pokání za svou lstivost dodržuje slib otevřeného jednání, a její prohnanost tím otupuje."
 pam_sf_penance_honest_modifier: "Učí se přetvářce"
 pam_sf_penance_honest_modifier_desc: "Tato postava se učí lstivosti, kterou její víra staví nad upřímnost; je prohnanější, ale méně důvěryhodná."
 pam_sf_penance_craven_modifier: "Čelí strachu"
 pam_sf_penance_craven_modifier_desc: "Tato postava stojí pevně jako pokání za svou zbabělost a děsí se každého okamžiku."
 pam_sf_penance_brave_modifier: "Krotí svou odvahu"
 pam_sf_penance_brave_modifier_desc: "Tato postava krotí odvahu, kterou její víra považuje za hříšnou, a mění ji v obezřetnost. Její bojovnost tím otupuje."
 pam_sf_penance_shy_modifier: "Nutí se k smělosti"
 pam_sf_penance_shy_modifier_desc: "Tato postava se jako pokání za svou uzavřenost nutí působit odvážně; každé společenské setkání je pro ni zkouškou."
 pam_sf_penance_gregarious_modifier: "Uzavírá se do mlčení"
 pam_sf_penance_gregarious_modifier_desc: "Tato postava se zříká hříšného veselí a uzavírá se do mlčení, kvůli čemuž má méně přátel."
 pam_sf_penance_ambitious_modifier: "Krotí své ambice"
 pam_sf_penance_ambitious_modifier_desc: "Tato postava jako pokání mírní své ambice, a tím i svůj věhlas."
 pam_sf_penance_content_modifier: "Probouzí touhu"
 pam_sf_penance_content_modifier_desc: "Tato postava v sobě probouzí touhu a neklidnou snahu, aby se vzepřela spokojenosti, kterou její víra považuje za hříšnou."
 pam_sf_penance_arbitrary_modifier: "Vládne spravedlivě"
 pam_sf_penance_arbitrary_modifier_desc: "Tato postava jako pokání za své svévolné jednání vládne nestranněji; je spravedlivější, ale chudší."
 pam_sf_penance_just_modifier: "Vládne podle rozmaru"
 pam_sf_penance_just_modifier_desc: "Tato postava vládne podle rozmaru, jak její víra žádá, a ne podle spravedlnosti; je bohatší, ale méně oblíbená."
 pam_sf_penance_cynical_modifier: "Znovu v sobě probouzí víru"
 pam_sf_penance_cynical_modifier_desc: "Tato postava jako pokání za svůj cynismus znovu probouzí víru; připadá jí však cizí jako neznámý plášť."
 pam_sf_penance_zealous_modifier: "Krotí svou horlivost"
 pam_sf_penance_zealous_modifier_desc: "Tato postava krotí horlivost, kterou její víra považuje za přehnanou, a zbožní kvůli tomu chladnou."
 pam_sf_penance_paranoid_modifier: "Učí se důvěřovat"
 pam_sf_penance_paranoid_modifier_desc: "Tato postava se jako pokání za svou podezíravost učí důvěřovat; otevírá dveře a polevuje v ostražitosti."
 pam_sf_penance_trusting_modifier: "Střeží své srdce"
 pam_sf_penance_trusting_modifier_desc: "Tato postava střeží své srdce, které její víra považuje za příliš důvěřivé; je obezřetnější, ale působí chladně."
 pam_sf_penance_compassionate_modifier: "Potlačuje milosrdenství"
 pam_sf_penance_compassionate_modifier_desc: "Tato postava potlačuje milosrdenství, které její víra považuje za hříšné, a nasazuje kvůli tomu přísnější tvář."
 pam_sf_penance_callous_modifier: "Pěstuje milosrdenství"
 pam_sf_penance_callous_modifier_desc: "Tato postava jako pokání za bezcitnost pěstuje milosrdenství; jedná mírněji a strach, na který spoléhala, pomalu vyprchává."
 pam_sf_penance_sadistic_modifier: "Zříká se krutosti"
 pam_sf_penance_sadistic_modifier_desc: "Tato postava se jako pokání zříká krutosti a hrůza, kterou tím budila, pomalu vyprchává."
 pam_sf_penance_stubborn_modifier: "Ohýbá svou vůli"
 pam_sf_penance_stubborn_modifier_desc: "Tato postava jako pokání podrobuje svou tvrdohlavou vůli nápravě a ustupuje, i když by dříve neustoupila."
 pam_sf_penance_fickle_modifier: "Upevňuje svou duši"
 pam_sf_penance_fickle_modifier_desc: "Tato postava jako pokání za svou vrtkavost drží pevný směr, což jí není po chuti."
 pam_sf_penance_eccentric_modifier: "Přijímá konvence"
 pam_sf_penance_eccentric_modifier_desc: "Tato postava se jako pokání za svou výstřednost vzdává neobvyklých myšlenek."
 pam_sf_penance_vengeful_modifier: "Učí se odpouštět"
 pam_sf_penance_vengeful_modifier_desc: "Tato postava se jako pokání za svou pomstychtivost vzdává starých křivd; k zajatcům je mírnější, ale s odplatou váhá."
 pam_sf_penance_forgiving_modifier: "Pěstuje zášť"
 pam_sf_penance_forgiving_modifier_desc: "Tato postava pěstuje zášť, kterou její víra upřednostňuje před odpuštěním; je chladnější a budí větší strach."
 pam_mystical_birthright_spiritual_leader_modifier: "Požehnané dědictví"
 pam_mystical_birthright_spiritual_leader_modifier_desc: "Duchovní výchovu této postavy ovlivnilo znamení, s nímž se narodila."
 pam_personal_sacrifice_of_wealth_county_modifier: "Zbožná investice"
 pam_personal_sacrifice_of_wealth_county_modifier_desc: "Zbožný dar panovníka podporuje rozvoj tohoto hrabství."
 pam_sf_grinding_modifier: "Bezduchá dřina"
 pam_sf_grinding_modifier_desc: "Tato postava se bez ustání lopotí a její duše za to trpí."
