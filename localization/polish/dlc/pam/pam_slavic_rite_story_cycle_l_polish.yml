l_polish:
 slavic_rite.1000.t: "Hlaholice" # todo: NEW TRANSLATION
 slavic_rite.1000.desc: ""Jen pokračuj, bratře [greek_preacher.GetFirstName]," vybídne můj [court_chaplain.GetActiveCouncilTask.GetPositionName] [greek_preacher.Custom('MyPriestTitle')], který následuje [GetRiteByKey('byzantine_rite').GetAdjective].\n\n„Ať je vaše říše požehnána, ó [ROOT.Char.GetTitleAsNameNoTooltip]. Moji bratři úspěšně pracují na písmu pro váš lid. Bohužel pracujeme ve stínu a pod hrozbou kněží [GetRiteByKey('carolingian_christianity').GetAdherentName], kteří si chtějí přivlastnit církevní pravomoc nad vašimi zeměmi. [Glossary('Cyril and Methodius', 'CYRIL_AND_METHODIUS_GLOSS')] mě požádali, abych vás požádal o více času na přípravu strategie, která zabrání konfliktům a pomůže nám najít diplomatické řešení.“" # todo: NEW TRANSLATION
 slavic_rite.1000.a: "Už jsme ušli dlouhou cestu. Spoléhám na ně." # todo: NEW TRANSLATION
 slavic_rite.1000.a_tt: "[Glossary( 'Cyril and Methodius', 'CYRIL_AND_METHODIUS_GLOSS' )], bratři, kteří vytvořili nové slovanské písmo, vás brzy seznámí se svým dalším krokem k rozšíření nového [court_chaplain.GetFaith.GetAdjective] [rite|E] ve vaší říši." # todo: NEW TRANSLATION
 slavic_rite.1000.b: "Raději od toho upustíme, než abychom pocítili hněv [GetRiteByKey('carolingian_christianity').GetAdherentNameNoTooltip]." # todo: NEW TRANSLATION
 slavic_rite.1000.b_tt: "Veškeré snahy [Glossary('Cyril and Methodius', 'CYRIL_AND_METHODIUS_GLOSS')] o vytvoření místního písma a zavedení nového [rite|E] jsou opuštěny." # todo: NEW TRANSLATION
 slavic_rite.1000.b_tt_2: "$story_slavic_rite$ [story_cycle|E] končí." # todo: NEW TRANSLATION
 slavic_rite.0001.t: "Moravská misie" # todo: NEW TRANSLATION
 slavic_rite.0001.desc: "Jsem rád, že opět vidím [Glossary( 'Cyril and Methodius', 'CYRIL_AND_METHODIUS_GLOSS' )], a doufám, že mají plán, jak čelit vměšování [GetRiteByKey('carolingian_christianity').GetAdherentName].\n\n„Vážený [ROOT.Char.GetTitleAsNameNoTooltip], zdá se, že jediným způsobem, jak zajistit bezpečí způsobu, jímž váš lid uctívá Boha, je vydat se do [pope_scope.GetCapitalLocation.GetBaronyNameExplicitly] a přijmout požehnání od [pope_scope.GetTitledFirstName].“\n\nDoufám, že autorita trůnu svatého Petra bude mít moc nad panovačnými [GetRiteByKey('carolingian_christianity').GetAdherentNamePluralNoTooltip], ale zdá se, že uznávají pouze své vlastní." # todo: NEW TRANSLATION
 slavic_rite.0001.a: "Šťastnou cestu." # todo: NEW TRANSLATION
 slavic_rite.0001.a_tt: "[cyril_scope.GetFirstName] a [methodius_scope.GetFirstName] se vydají na cestu. Pokud bude úspěšná, jejich návrat může v celé vaší říši zažehnout nové náboženské hnutí." # todo: NEW TRANSLATION
 slavic_rite.0001.b: "Nenechám vás odjet s prázdnou." # todo: NEW TRANSLATION
 slavic_rite_travel_toast_title: "Cyril a Metoděj se vydávají na cestu" # todo: NEW TRANSLATION
 slavic_rite_moravian_mission_gift_sent_tooltip: "Do [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] bude odeslán dar. Bratři vás po návratu informují, jak byl přijat." # todo: NEW TRANSLATION
 slavic_rite.0003.t: "Zrod [methodius_scope.GetRite.GetName]" # todo: NEW TRANSLATION
 slavic_rite.0003.desc: "Dozvěděl jsem se, že [methodius_scope.GetFirstNameNoTooltip] se s pomocí [moravia_liege_scope.GetTitledFirstNameNoTooltip] snaží široko daleko v zemích [moravia_liege_scope.GetCulture.GetNameNoTooltip] šířit nový způsob praktikování [methodius_scope.GetFaith.GetNameNoTooltip]. Moji učenci mu říkají [methodius_scope.GetRite.GetName].\n\nNavzdory našim předchozím snahám přiblížit místní našim zvykům se [methodius_scope.GetSheHe] podařilo získat od [pope_scope.GetTitledFirstName] souhlas s tím, aby mezi nimi rozšířil nově vytvořené písmo." # todo: NEW TRANSLATION
 slavic_rite.0003.a: "Uvidíme, jak úspěšné [methodius_scope.GetHerHis] metody budou." # todo: NEW TRANSLATION
 slavic_rite.0004.t: "[methodius_scope.GetRite.GetNameNoTooltip] u [ROOT.Char.GetCulture.GetNameNoTooltip]" # todo: NEW TRANSLATION
 slavic_rite.0004.desc_pagan: "Dnes ráno ke dvoru dorazily zajímavé zprávy.\n\n[liege_scope.GetTitledFirstNameNoTooltip] už léta dovoluje knězi [methodius_scope.GetCulture.GetNameNoTooltip] jménem [methodius_scope.GetFirstNam] šířit v našich zemích [methodius_scope.GetHerHis] profánní zvyky. Víra [methodius_scope.GetFaith.GetNameNoTooltip] bude přizpůsobena tak, aby vyhovovala způsobu života [ROOT.Char.GetCulture.GetNameNoTooltip] těch, kteří ji chtějí praktikovat.\n\nV poslední době se příliš mnoho rozruchu točí kolem duchovní podstaty našich tradic. Možná už konečně budu muset přemýšlet, jak s tím vším naložit." # todo: NEW TRANSLATION
 slavic_rite.0004.desc_chalcedonian: "Náš [liege_scope.GetTitleAsNameNoTooltip] nařídil, aby se v [liege_scope.GetHerHis] říši rozšířil [methodius_scope.GetRite.GetNameNoTooltip]. Podle mých učenců jde o vhodnější způsob praktikování [methodius_scope.GetFaith.GetNameNoTooltip], který nevyžaduje, abychom se vzdali svého způsobu života.\n\nMožná si to zaslouží naši pozornost?" # todo: NEW TRANSLATION
 slavic_rite.0004.a_pagan: "Zvyky našich předků jsou lepší." # todo: NEW TRANSLATION
 slavic_rite.0004.b_pagan: "Možná na tom něco bude..." # todo: NEW TRANSLATION
 slavic_rite.0004.a_chalcedonian: "Nemám v úmyslu sejít z pravé cesty." # todo: NEW TRANSLATION
 slavic_rite.0004.b_chalcedonian: "Předveďte učence." # todo: NEW TRANSLATION
 slavic_rite.0005.t: "Hořkosladká cesta" # todo: NEW TRANSLATION
 slavic_rite.0005.desc: "[methodius_scope.GetFirstName] stojí přede mnou, tentokrát sám po návratu z [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. Když se ho zeptám na [cyril_scope.GetFirstName], [methodius_scope.GetHerHis] výraz se zachmuří.\n\n„Dobrá zpráva, milostivý [ROOT.Char.GetTitleAsNameNoTooltip], je, že nám [pope_scope.GetTitledFirstName] požehnal, abychom šířili víru mezi [ROOT.Char.GetCulture.GetNameNoTooltip] lidmi a po celé tvé říši, vlastními metodami a s využitím Písma.“ Zhluboka se nadechne. „Bohužel jsem však musel svého bratra opustit. Udělám vše, co bude v mých silách, aby naše úsilí nepřišlo nazmar. Kéž nám všem [ROOT.Char.GetFaith.HighGodName] pomáhá.“" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [methodius_scope.GetHerHis], [pope_scope.GetHerHis]
 slavic_rite.0005.a: "Společně na svého bratra uděláme hrdého!" # todo: NEW TRANSLATION
 slavic_rite.0005.b: "Mohu alespoň uctít jeho odkaz." # todo: NEW TRANSLATION
 pam_cyril_statue_modifier: "Památník Cyrila" # todo: NEW TRANSLATION
 pam_brothers_travel_safety_modifier: "Opatrná cesta" # todo: NEW TRANSLATION
 slavic_rite.0005.c: "Hodně štěstí při vaší misii." # todo: NEW TRANSLATION
 slavic_rite_mass_conversion_tooltip: "Ve všech [duchies|E] [CZPrepV(moravia_liege_scope.GetPrimaryTitle.GetNameNoTierNoTooltip)] [moravia_liege_scope.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_L')] je plánována [great_project|E] hromadná konverze s cílem obrátit jejich [counties|E] na [methodius_scope.GetRite.GetName]" # todo: NEW TRANSLATION
 slavic_rite_moravian_mission_gift_received_tooltip: "Váš dar pro [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] byl přijat s vděčností." # todo: NEW TRANSLATION
 slavic_rite_ecclesiastical_title_creation_tooltip: "$slavic_rite_ecclesiastical_title$ je vytvořen a [methodius_scope.GetFirstName] se stává jeho prvním [holder|E]" # todo: NEW TRANSLATION
 slavic_rite_ecclesiastical_title: "$d_et_archdiocese_prefix$ Moravské" # todo: NEW TRANSLATION
 slavic_rite_ecclesiastical_title_name: "Morava" # todo: NEW TRANSLATION
 slavic_rite.0006.t: "Konec moravské misie" # todo: NEW TRANSLATION
 slavic_rite.0006.desc.brothers_are_dead: "Po smrti bratrů [Glossary('Cyril and Methodius', 'CYRIL_AND_METHODIUS_GLOSS')] už není nikdo dostatečně způsobilý, aby pokračoval v jejich liturgickém díle. Chceme-li stále dosáhnout úplného obrácení svého lidu, musíme najít vlastní způsob." # todo: NEW TRANSLATION
 slavic_rite.0006.desc.no_longer_christian: "Spatřil jsem cestu ke slávě. To, co mě kdysi vedlo ke snaze přinést štěstí mému lidu a rodu, se nyní zdá naprosto bezvýznamné. Cesta, která jim byla určena, se lišila od té, kterou jsem si pro ně přál. Naštěstí nám [ROOT.Char.GetFaith.HighGodName] ukázal přímou cestu." # todo: NEW TRANSLATION
 slavic_rite.0006.desc.no_longer_king: "Nedávné události a ztráta mého mocného postavení mě naučily, že si nemám nakládat víc, než uneseme. Moravskou misii nyní nedokážeme udržet. Možná se o to můžeme pokusit znovu za nových podmínek, až se vzpamatujeme.\n\nDo té doby musíme chránit [ROOT.Char.GetPrimaryTitle.GetNameNoTier], abychom neskončili stejně." # todo: NEW TRANSLATION
 slavic_rite.0006.desc.no_longer_slav: "Moji předkové by nejspíš nebyli příliš hrdí na to, kým jsem se stal.\n\nBudiž. O tom, jak vládnout [ROOT.Char.GetPrimaryTitle.GetNameNoTier], nerozhodují oni. Rozhoduji o tom jen já." # todo: NEW TRANSLATION
 slavic_rite.0006.a.brothers_are_dead: "Nemělo se to stát..." # todo: NEW TRANSLATION
 slavic_rite.0006.a.no_longer_christian: "Chvála [ROOT.Char.GetFaith.HighGodName]!" # todo: NEW TRANSLATION
 slavic_rite.0006.a.no_longer_king: "Na takové ambice už nemám prostředky." # todo: NEW TRANSLATION
 slavic_rite.0006.a.no_longer_slav: "Hlaholice byla pro můj lid břemenem." # todo: NEW TRANSLATION
 slavic_rite.0006.a.tooltip: "$story_slavic_rite$ s cílem šířit víru v říši už není aktuální." # todo: NEW TRANSLATION
 slavic_rite.0007.t: "Říše sjednocená pod [ROOT.Char.GetFaith.HighGodName]" # todo: NEW TRANSLATION
 slavic_rite.0007.desc: ""#italic ...abychom pod [ROOT.Char.GetHerHis] vládou mohli vést tichý a pokojný život\nve vší zbožnosti a důstojnosti.\n\nNeboť tvé je království, moc i sláva,\nna věky věků. Amen.#!"\n\nKdyž [archdiocese_holder.GetTitledFirstName] dokončí modlitbu, mou duši zaplaví pocit věčné blaženosti. Naše poslání, jehož cílem bylo rozšířit vlastní nebeskou tradici do všech koutů mé říše, skončilo triumfem. Kéž [ROOT.Char.GetFaith.HighGodName] požehná mému rodu, [Glossary( 'Cyril and Methodius', 'CYRIL_AND_METHODIUS_GLOSS' )] i dobrému lidu [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')]." # todo: NEW TRANSLATION
 slavic_rite.0007.a: "Bylo nám souzeno kráčet po posvěcené cestě." # todo: NEW TRANSLATION
 pam_slavic_rite_clergy_opinion_modifier: "Požehnaný panovník" # todo: NEW TRANSLATION
 slavic_rite.0007.b: "Můj lid vydrží všechno." # todo: NEW TRANSLATION
 pam_slavic_rite_culture_opinion_modifier: "Panovník lidu" # todo: NEW TRANSLATION
 slavic_rite.0010.t: "Tajní kazatelé" # todo: NEW TRANSLATION
 slavic_rite.0010.desc: "V doprovodu mého kaplana [court_chaplain.GetTitledFirstName] vstupuje do mé síně nestoudně se tvářící [undercover_preacher.Custom('MyPriestTitle')] kultury [undercover_preacher.GetCulture.GetNameNoTooltip] a [undercover_preacher.GetHerHis] družina kazatelů.\n\n„Zdravím vás, můj [ROOT.Char.GetTitleAsNameNoTooltip]. Přistihli jsme tyto vetřelce, jak hlásají slova [ROOT.Char.GetFaith.HighGodName], aniž by uznávali autoritu [court_chaplain_superior.GetTitledFirstName] či vaši.“ [court_chaplain.GetSheHe|U] se odmlčí a změří cizince pohledem od hlavy k patě, než se znovu obrátí k vám.\n\n„Říká se, že se už nějakou dobu skrývají ve stínech a pokoušejí se přesvědčovat vaše nic netušící poddané a poskvrňovat jejich duše. Jak s nimi chcete naložit?“" # todo: NEW TRANSLATION
 slavic_rite.0010.a: "Zmizte a už se do mých zemí nikdy nevracejte." # todo: NEW TRANSLATION
 slavic_rite.0010.b: "Naše předchozí varování zjevně nestačila." # todo: NEW TRANSLATION
 slavic_rite.0010.c: "Nemusíte čelit svým zklamaným pánům." # todo: NEW TRANSLATION
 slavic_rite.0010.c.success: "[undercover_preacher.GetSheHe|U] se těší na nový život u vašeho dvora" # todo: NEW TRANSLATION
 slavic_rite.0010.c.failure: "[undercover_preacher.GetSheHe|U] se nenechá přesvědčit" # todo: NEW TRANSLATION
 preacher_recruited.t: "Kazatel získán" # todo: NEW TRANSLATION
 preacher_left.t: "Kazatel odešel" # todo: NEW TRANSLATION
 slavic_rite.0020.t: "Příspěvek na zbožný účel" # todo: NEW TRANSLATION
 slavic_rite.0020.desc: "„Nechtějí zneužívat místní, můj [ROOT.Char.GetTitleAsNameNoTooltip]. Potulní kazatelé [court_chaplain_superior.GetTitledFirstNamePossessive] jsou v tomto ohledu velmi ohleduplní. Dokonce chtěli, abych s vámi promluvil, což svědčí o chvályhodné pokoře. Potvrzení by jim i vašemu lidu celé úsilí značně usnadnilo.“\n\n[court_chaplain.GetTitledFirstNamePossessive] snaha přesvědčit mě jménem ostatních je pozoruhodná, ale nemohu se ubránit otázce, zda by se [court_chaplain.GetSheHe] neměl raději zaměřit na to, aby pomohl mému lidu opustit staré tradice.\n\n„Mám pocit, že je to [ROOT.Char.GetFaith.HighGodNamePossessive] způsob, jak vám dát příležitost se mu přiblížit.“" # todo: NEW TRANSLATION
 slavic_rite.0020.a: "Čím dříve můj lid zbavíme bezbožnosti, tím lépe." # todo: NEW TRANSLATION
 pam_slavic_rite_great_project_speed_modifier: "Financovaný projekt konverze" # todo: NEW TRANSLATION
 slavic_rite.0020.b: "Víc si nemůžeme dovolit." # todo: NEW TRANSLATION
 slavic_rite.0020.c: "Rozhodně ne." # todo: NEW TRANSLATION
 slavic_rite.0030.t: "Debata Východu a Západu" # todo: NEW TRANSLATION
 slavic_rite.0030.desc: "Vánek čeří listí v klášterní zahradě, kde se dva hostující duchovní [court_chaplain_superior.GetTitledFirstName] postavili proti sobě mezi skupinami diskutujících. Jeden je oděn podle východní tradice, druhý zastává autoritu Západu. Jejich zpočátku pokorné hlasy postupně sílí a nabývají na vášnivosti.\n\nProbírají řadu liturgických témat a přecházejí od učené debaty k fascinujícím sporům. S každou větou můj zájem roste.\n\nNejde jen o rozhovor; je to souboj dvou světů, který naznačuje buď křehkou harmonii, nebo hlubší rozkol." # todo: NEW TRANSLATION
 slavic_rite.0030.a: "[visiting_byzantine_clergy.GetCulture.GetNameNoTooltip] [visiting_byzantine_clergy.Custom('MyPriestTitle')] mluví velmi rozumně." # todo: NEW TRANSLATION
 slavic_rite.0030.b: "Na argumentaci [visiting_carolingian_clergy.GetNamePossessiveNoTooltip] je něco zajímavého." # todo: NEW TRANSLATION
 slavic_rite.0030.c: "Poznání je poznání. Souhlasím s oběma." # todo: NEW TRANSLATION
 slavic_rite.0030.d: "Naše způsoby jsou lepší než tyto prastaré zásady." # todo: NEW TRANSLATION
