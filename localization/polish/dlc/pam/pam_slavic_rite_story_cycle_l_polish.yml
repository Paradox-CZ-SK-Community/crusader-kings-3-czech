l_polish:
 slavic_rite.1000.t: "Hlaholice"
 slavic_rite.1000.desc: "„Pokračuj, [Select_CString(greek_preacher.IsFemale,'sestro','bratře')] [greek_preacher.Custom('CZ_FirstName_V')],“ vybídne můj [court_chaplain.GetActiveCouncilTask.GetPositionName|l] hostující duchovní osobu s titulem [greek_preacher.Custom('MyPriestTitle')|l], kterou vede [GetRiteByKey('byzantine_rite').GetAdjective|l] ritus.\n\n„Kéž je tvé panství požehnáno, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|l]. Moji bratři úspěšně pracují na písmu pro tvůj lid. Bohužel nám hrozí kněží, jejichž vzorem je [GetRiteByKey('carolingian_christianity').GetAdherentName|l]. Chtějí získat církevní pravomoc nad tvými zeměmi. [Glossary('Cyril a Metoděj', 'CYRIL_AND_METHODIUS_GLOSS')|U] mě požádali, abych vyprosil více času na přípravu postupu, který zabrání konfliktům a umožní diplomatické řešení.“"
 slavic_rite.1000.a: "Už jsme ušli dlouhou cestu. Spoléhám na ně."
 slavic_rite.1000.a_tt: "[Glossary( 'Cyril a Metoděj', 'CYRIL_AND_METHODIUS_GLOSS' )|U], bratři, kteří vytvořili nové slovanské písmo, tě brzy seznámí se svým dalším krokem k rozšíření nového [CZFaithAdjDecline(court_chaplain.GetFaith,'ého')|l] [Concept('rite','ritu')|E] ve tvém panství."
 slavic_rite.1000.b: "Raději od toho upustíme — [GetRiteByKey('carolingian_christianity').GetAdherentNameNoTooltip|l] se pak nebude hněvat."
 slavic_rite.1000.b_tt: "Veškeré snahy vytvořit místní písmo a zavést nový [Concept('rite','ritus')|E], které vyvíjejí [Glossary('Cyril a Metoděj', 'CYRIL_AND_METHODIUS_GLOSS')], končí."
 slavic_rite.1000.b_tt_2: "[Concept('story_cycle','Příběhový cyklus')|EU] $story_slavic_rite$ končí."
 slavic_rite.0001.t: "Moravská misie"
 slavic_rite.0001.desc: "S úlevou opět vítám bratry [Glossary( 'Cyrila a Metoděje', 'CYRIL_AND_METHODIUS_GLOSS' )]. Doufám, že mají plán, jak čelit vměšování, za nímž stojí [GetRiteByKey('carolingian_christianity').GetAdherentName|l].\n\n„[Select_CString(ROOT.Char.IsFemale,'Ctěná','Ctěný')|U] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|l], zdá se, že existuje jen jedna cesta, jak zajistit bezpečí bohoslužeb tvého lidu. Naším cílem bude [pope_scope.GetCapitalLocation.GetBaronyNameExplicitly] a musíme získat požehnání od [pope_scope.Custom('CZ_TitledFirstName_G')].“\n\nSnad autorita trůnu svatého Petra zkrotí panovačné protivníky — [GetRiteByKey('carolingian_christianity').GetAdherentNamePluralNoTooltip|l] však zřejmě uznávají jen své vlastní."
 slavic_rite.0001.a: "Šťastnou cestu."
 slavic_rite.0001.a_tt: "[cyril_scope.GetFirstName|U] a [methodius_scope.GetFirstName] se vydají na cestu. Bude-li úspěšná, jejich návrat může v celém tvém panství zažehnout nové náboženské hnutí."
 slavic_rite.0001.b: "Nenechám vás odjet s prázdnou."
 slavic_rite_travel_toast_title: "Cyril a Metoděj se vydávají na cestu"
 slavic_rite_moravian_mission_gift_sent_tooltip: "Cílem odeslaného daru bude [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. Bratři ti po návratu oznámí, jak byl přijat."
 slavic_rite.0003.t: "Rodí se [methodius_scope.GetRite.GetName]"
 slavic_rite.0003.desc: "[Select_CString(ROOT.Char.IsFemale,'Dozvěděla','Dozvěděl')|U] jsem se, že [methodius_scope.GetFirstNameNoTooltip] s pomocí [moravia_liege_scope.Custom('CZ_TitledFirstNameNoTooltip_G')] šíří nový způsob vyznávání víry [methodius_scope.GetFaith.GetNameNoTooltip] po celých [moravia_liege_scope.GetCulture.Custom('CZ_AdjectiveNoTooltip_yych')|l] zemích. Moji učenci jej nazývají [methodius_scope.GetRite.GetName].\n\nNavzdory našim předchozím snahám přiblížit místní našim zvykům si [Select_CString(methodius_scope.IsFemale,'zajistila','zajistil')] souhlas, který [pope_scope.GetTitledFirstName] [Select_CString(pope_scope.IsFemale,'udělila','udělil')], a může tak mezi nimi rozšířit nově vytvořené písmo."
 slavic_rite.0003.a: "Uvidíme, jak úspěšné ty metody budou."
 slavic_rite.0004.t: "[ROOT.Char.GetCulture.Custom('CZ_AdjectiveNoTooltip_yy')|U] [methodius_scope.GetRite.GetNameNoTooltip|l]"
 slavic_rite.0004.desc_pagan: "Dnes ráno dorazily ke dvoru zajímavé zprávy.\n\n[liege_scope.GetTitledFirstNameNoTooltip|U] už léta dovoluje, aby [Select_CString(methodius_scope.IsFemale,methodius_scope.GetCulture.Custom('CZ_AdjectiveNoTooltip_aa'),methodius_scope.GetCulture.Custom('CZ_AdjectiveNoTooltip_yy'))|l] [Select_CString(methodius_scope.IsFemale,'kněžka','kněz')] [methodius_scope.GetFirstNam] šířil v našich zemích své bezbožné zvyky. Víra [methodius_scope.GetFaith.GetNameNoTooltip] bude přizpůsobena tak, aby těm, kdo ji chtějí vyznávat, usnadnila [ROOT.Char.GetCulture.Custom('CZ_AdjectiveNoTooltip_yy')|l] způsob života.\n\nDuchovní podstata našich tradic budí v poslední době příliš mnoho rozruchu. Snad už konečně musím rozhodnout, jak s tím vším naložit."
 slavic_rite.0004.desc_chalcedonian: "[Select_CString(liege_scope.IsFemale,'Naše','Náš')] [liege_scope.GetTitleAsNameNoTooltip|l] [Select_CString(liege_scope.IsFemale,'nařídila','nařídil')] zavedení ritu [methodius_scope.GetRite.GetNameNoTooltip] v celém svém panství. Podle mých učenců nabízí vhodnější způsob vyznávání víry [methodius_scope.GetFaith.GetNameNoTooltip], který nevyžaduje opustit náš způsob života.\n\nMožná si zaslouží naši pozornost?"
 slavic_rite.0004.a_pagan: "Zvyky našich předků jsou lepší."
 slavic_rite.0004.b_pagan: "Možná na tom něco bude..."
 slavic_rite.0004.a_chalcedonian: "Nemám v úmyslu sejít z pravé cesty."
 slavic_rite.0004.b_chalcedonian: "Předveďte učence."
 slavic_rite.0005.t: "Hořkosladká cesta"
 slavic_rite.0005.desc: "[methodius_scope.GetFirstName|U] stojí přede mnou, tentokrát [Select_CString(methodius_scope.IsFemale,'sama','sám')]. Cesta, jejímž cílem byl [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], skončila. Když se zeptám na [cyril_scope.Custom('CZ_FirstName_A')], výraz tváře se zachmuří.\n\n„Dobrá zpráva, [Select_CString(ROOT.Char.IsFemale,'milostivá','milostivý')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|l], je, že nám [pope_scope.GetTitledFirstName] [Select_CString(pope_scope.IsFemale,'požehnala','požehnal')]. Můžeme šířit víru mezi [ROOT.Char.GetCulture.Custom('CZ_AdjectiveNoTooltip_yym')|l] lidem i po celém tvém panství, vlastními způsoby a s vlastním písmem.“ Následuje hluboký nádech. „Bohužel jsem [Select_CString(methodius_scope.IsFemale,'musela','musel')] svého bratra opustit. Udělám vše pro to, aby naše úsilí nepřišlo nazmar. Kéž nám všem [ROOT.Char.GetFaith.HighGodName] pomůže.“"
 slavic_rite.0005.a: "Společně zajistíme, aby na nás tvůj bratr byl hrdý!"
 slavic_rite.0005.b: "Mohu alespoň uctít jeho odkaz."
 pam_cyril_statue_modifier: "Památník Cyrila"
 pam_brothers_travel_safety_modifier: "Opatrná cesta"
 slavic_rite.0005.c: "Hodně štěstí při tvé misii."
 slavic_rite_mass_conversion_tooltip: "Ve všech [Concept('duchies','vévodstvích')|E] [CZPrepV(moravia_liege_scope.GetPrimaryTitle.GetNameNoTierNoTooltip)|l] [moravia_liege_scope.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_L')] se plánuje [Concept('great_project','velký projekt')|E] hromadné konverze s cílem obrátit jejich [Concept('counties','hrabství')|E] na ritus [methodius_scope.GetRite.GetName]"
 slavic_rite_moravian_mission_gift_received_tooltip: "[pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip|U] ti projevuje vděčnost za tvůj dar."
 slavic_rite_ecclesiastical_title_creation_tooltip: "Vzniká $slavic_rite_ecclesiastical_title$ a [methodius_scope.GetFirstName] se stává jeho prvním [Concept('holder','držitelem')|E]"
 slavic_rite_ecclesiastical_title: "$d_et_archdiocese_prefix$ Moravy"
 slavic_rite_ecclesiastical_title_name: "Morava"
 slavic_rite.0006.t: "Konec moravské misie"
 slavic_rite.0006.desc.brothers_are_dead: "Po smrti bratrů [Glossary('Cyrila a Metoděje', 'CYRIL_AND_METHODIUS_GLOSS')] už nikdo není dostatečně způsobilý pokračovat v jejich liturgickém díle. Chceme-li stále dosáhnout úplného obrácení svého lidu, musíme najít vlastní cestu."
 slavic_rite.0006.desc.no_longer_christian: "[Select_CString(ROOT.Char.IsFemale,'Spatřila','Spatřil')|U] jsem cestu ke slávě. To, co mě kdysi vedlo ke snaze přinést štěstí mému lidu a rodu, se nyní zdá naprosto bezvýznamné. Cesta, která jim byla určena, se lišila od té, již jsem si pro ně [Select_CString(ROOT.Char.IsFemale,'přála','přál')]. Naštěstí nám [ROOT.Char.GetFaith.HighGodName] ukazuje přímou cestu."
 slavic_rite.0006.desc.no_longer_king: "Nedávné události a ztráta mého mocného postavení mě naučily nenakládat si víc, než unesu. Moravskou misii teď nedokážeme udržet. Snad se o ni za nových podmínek pokusíme znovu, až se vzpamatujeme.\n\nDo té doby musí být [ROOT.Char.GetPrimaryTitle.GetNameNoTier] v bezpečí před podobným osudem."
 slavic_rite.0006.desc.no_longer_slav: "Moji předkové by nejspíš nebyli příliš hrdí na to, kým jsem se [Select_CString(ROOT.Char.IsFemale,'stala','stal')].\n\nBudiž. [ROOT.Char.GetPrimaryTitle.GetNameNoTier|U] podléhá mé vládě — o jejím způsobu nerozhodují oni, ale jen já."
 slavic_rite.0006.a.brothers_are_dead: "Nebylo nám to souzeno..."
 slavic_rite.0006.a.no_longer_christian: "Kéž [ROOT.Char.GetFaith.HighGodName] přijme mou chválu!"
 slavic_rite.0006.a.no_longer_king: "Na takové ambice už nemám prostředky."
 slavic_rite.0006.a.no_longer_slav: "Hlaholice byla pro můj lid břemenem."
 slavic_rite.0006.a.tooltip: "$story_slavic_rite$ s cílem obrátit panství na víru už nemá smysl."
 slavic_rite.0007.t: "[ROOT.Char.GetFaith.HighGodName|U] spojuje panství"
 slavic_rite.0007.desc: "„#italic ...abychom pod [Select_CString(ROOT.Char.IsFemale,'její','jeho')] vládou tichý a pokojný život vedli\nve vší pobožnosti a šlechetnosti.\n\nNeboť tvé je království i moc i sláva,\nnyní i vždycky a na věky věků. Amen.#!“\n\nKdyž [archdiocese_holder.GetTitledFirstName] dokončí modlitbu, mou duši zaplaví věčná blaženost. Naše poslání rozšířit vlastní nebeskou tradici do všech koutů mého panství skončilo triumfem. Kéž [ROOT.Char.GetFaith.HighGodName] požehná mému rodu, bratrům [Glossary( 'Cyrilovi a Metodějovi', 'CYRIL_AND_METHODIUS_GLOSS' )] i dobrému lidu [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')]."
 slavic_rite.0007.a: "Bylo nám souzeno kráčet po posvěcené cestě."
 pam_slavic_rite_clergy_opinion_modifier: "Požehnaný panovník"
 slavic_rite.0007.b: "Můj lid vydrží všechno."
 pam_slavic_rite_culture_opinion_modifier: "Panovník lidu"
 slavic_rite.0010.t: "Tajní kazatelé"
 slavic_rite.0010.desc: "V doprovodu mého kaplana [court_chaplain.Custom('CZ_TitledFirstName_G')] vstupuje do síně [Select_CString(undercover_preacher.IsFemale,undercover_preacher.GetCulture.Custom('CZ_AdjectiveNoTooltip_aa'),undercover_preacher.GetCulture.Custom('CZ_AdjectiveNoTooltip_yy'))|l] [undercover_preacher.Custom('MyPriestTitle')|l] s družinou kazatelů. Tváře mají nestoudné.\n\n„Buď [Select_CString(ROOT.Char.IsFemale,'pozdravena','pozdraven')], [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|l]. Přistihli jsme tyto vetřelce, jak hlásají to, co učí [ROOT.Char.GetFaith.HighGodName], aniž by uznávali autoritu [court_chaplain_superior.Custom('CZ_TitledFirstName_G')] nebo tvou.“ [court_chaplain.GetFirstName] se odmlčí, přeměří cizího hosta od hlavy k patě a znovu se obrátí ke mně.\n\n„Říká se, že se už nějakou dobu skrývají ve stínech a přesvědčují tvé nic netušící poddané, aby poskvrnili jejich duše. Jak s nimi chceš naložit?“"
 slavic_rite.0010.a: "Zmizte a už se do mých zemí nikdy nevracejte."
 slavic_rite.0010.b: "Naše předchozí varování zjevně nestačila."
 slavic_rite.0010.c: "Nemusíš čelit svým zklamaným pánům."
 slavic_rite.0010.c.success: "Těší se na nový život u tvého dvora"
 slavic_rite.0010.c.failure: "Nenechá se přesvědčit"
 preacher_recruited.t: "Kazatel získán"
 preacher_left.t: "Kazatel odešel"
 slavic_rite.0020.t: "Příspěvek na zbožný účel"
 slavic_rite.0020.desc: "„Nechtějí zneužívat místní, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|l]. Potulní kazatelé, které vede úřad [court_chaplain_superior.Custom('CZ_TitledFirstName_G')], jsou v tom velmi ohleduplní. Dokonce chtěli, abych s tebou [Select_CString(court_chaplain.IsFemale,'promluvila','promluvil')], což svědčí o chvályhodné pokoře. Potvrzení by celé úsilí značně usnadnilo jim i tvému lidu.“\n\nPokus [court_chaplain.Custom('CZ_TitledFirstName_G')] přesvědčit mě jménem jiných je pozoruhodný. Nemohu se však ubránit otázce, zda by [Select_CString(court_chaplain.IsFemale,'neměla','neměl')] raději pomáhat mému lidu opustit staré tradice.\n\n„Mám pocit, že je to [ROOT.Char.GetFaith.HighGodNamePossessive] způsob, jak ti nabídnout příležitost k větší blízkosti.“"
 slavic_rite.0020.a: "Čím dříve můj lid zbavíme bezbožnosti, tím lépe."
 pam_slavic_rite_great_project_speed_modifier: "Financovaný projekt konverze"
 slavic_rite.0020.b: "Víc si nemůžeme dovolit."
 slavic_rite.0020.c: "Rozhodně ne."
 slavic_rite.0030.t: "Debata Východu a Západu"
 slavic_rite.0030.desc: "Vánek čeří listí v klášterní zahradě. Mezi diskutujícími skupinkami se proti sobě postavili dva hostující duchovní, které vyslal [court_chaplain_superior.GetTitledFirstName]. Jeden je oděn podle východní tradice, druhý zastává autoritu Západu. Jejich zpočátku pokorné hlasy sílí a nabývají na vášni.\n\nProbírají řadu liturgických témat a učená debata přechází v poutavý spor. S každou větou můj zájem roste.\n\nJe to víc než rozhovor — souboj dvou světů, který naznačuje křehký soulad, nebo hlubší rozkol."
 slavic_rite.0030.a: "[Select_CString(visiting_byzantine_clergy.IsFemale,visiting_byzantine_clergy.GetCulture.Custom('CZ_AdjectiveNoTooltip_aa'),visiting_byzantine_clergy.GetCulture.Custom('CZ_AdjectiveNoTooltip_yy'))|U] [visiting_byzantine_clergy.Custom('MyPriestTitle')|l] mluví velmi rozumně."
 slavic_rite.0030.b: "[visiting_carolingian_clergy.Custom('CZ_NamePossessiveNoTooltip_M')|U] argument má v sobě něco poutavého."
 slavic_rite.0030.c: "Poznání je poznání. Souhlasím s oběma."
 slavic_rite.0030.d: "Naše způsoby jsou lepší než tyto prastaré zásady."
