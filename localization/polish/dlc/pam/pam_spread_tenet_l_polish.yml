l_polish:
 spread_personal_tenet_intent: "Šířit věroučnou zásadu" # todo: NEW TRANSLATION
 spread_personal_tenet_intent_desc: "Chceš svou [personal_tenet|E] kázat vnímavým hostům, aby ji přijali za svou a zvýšili tak [tenet_popularity|E]." # todo: NEW TRANSLATION
 spread_personal_tenet_intent_not_valid_desc: "Už se nehlásíš k žádné [personal_tenet|E]" # todo: NEW TRANSLATION
 UNLOCK_SPREAD_PERSONAL_TENET_INTENT: "Odemkne [intent|E] #EMP $spread_personal_tenet_intent$#! při [activities|E] s hosty, který ti umožní zvýšit [tenet_popularity|E]" # todo: NEW TRANSLATION
 apa_pam_spread_tenet_host_title: "[first.GetShortUINameNoTooltip|U] [CharWinWins(Character)] nad [second.GetShortUINameNoTooltip]" # todo: NEW TRANSLATION
 apa_pam_spread_tenet_guest_title: "[first.GetShortUINameNoTooltip|U] [CharWinWins(Character)] nad [second.GetShortUINameNoTooltip]" # todo: NEW TRANSLATION
 pam_spread_tenet_events.forbidden.desc: "\n\nV mém srdci však plane přesvědčení [spread_tenet.GetBaseName] — víra, kterou má víra odsuzuje. Vyslovit ji v této společnosti znamená vložit svůj osud do rukou každého, kdo naslouchá." # todo: NEW TRANSLATION
 pam_spread_tenet_option_scripture: "Písmo mluví za mě." # todo: NEW TRANSLATION
 pam_spread_tenet_option_preach: "Poslyšte, čemu věřím!" # todo: NEW TRANSLATION
 pam_spread_tenet_option_forbidden: "Pravda stojí za to riziko. Pojďte blíž." # todo: NEW TRANSLATION
 pam_spread_tenet_option_decline: "Snad někdy jindy." # todo: NEW TRANSLATION
 pam_spread_tenet_forbidden_flavor: "Ne každé ucho, které mi naslouchá, mi přeje..." # todo: NEW TRANSLATION
 pam_spread_tenet_overheard_toast: "Nepřátelské uši" # todo: NEW TRANSLATION
 pam_spread_tenet_events.0001.t: "Rozhovory u stolu" # todo: NEW TRANSLATION
 pam_spread_tenet_events.0001.desc: "Stůl se prohýbá pod znamenitým [ROOT.Char.Custom('GetExpensiveMeal')], místností se rozléhá přípitek a smích.\n\n„Zdá se, že se dobře vyznáš v náboženských záležitostech,“ pronese [pam_spread_listener_1.GetTitledFirstName] a nakloní se přes mísy plné [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit')]. „Pokračuj.“\n\nU stolu zavládne ticho — posluchači jsou připraveni naslouchat..." # todo: NEW TRANSLATION
 pam_spread_tenet_events.0101.t: "U ohně" # todo: NEW TRANSLATION
 pam_spread_tenet_events.0101.desc: "Krátký oddech během lovu. Sedíme těsně kolem ohně a [ROOT.Char.Custom('GetRandomRegionalSmallGame')] se opéká na rožni.\n\n„Taková štvanice obrací duši k vyšším věcem,“ zamumlá [pam_spread_listener_1.GetTitledFirstName], aniž odtrhne oči od plamenů.\n\nSvětlo ohně, ticho a uši nakloněné naslouchat." # todo: NEW TRANSLATION
 pam_spread_tenet_events.0201.t: "Mezi kláními" # todo: NEW TRANSLATION
 pam_spread_tenet_events.0201.desc: "Mezi kláními jsou kolbiště prázdná. Pážata odklízejí roztříštěná kopí, zatímco dav hledá stín a klepy.\n\n„Každý vítěz děkuje [ROOT.Char.GetFaith.HighGodName] a každý poražený proklíná [ROOT.Char.GetFaith.DevilName],“ žertuje [pam_spread_listener_1.GetTitledFirstName] z lavice vedle mě. „Zamyslí se někdo z nich nad tím proč?“\n\nKlidná chvíle, lavice plná nečinných hodnostářů a otázka visící ve vzduchu." # todo: NEW TRANSLATION
 pam_spread_tenet_events.0301.t: "Přípitek na přesvědčení" # todo: NEW TRANSLATION
 pam_spread_tenet_events.0301.desc: "Jeden pohár za druhým se zvedá — na novomanžele, na dosud nenarozené dědice.\n\n„A na [ROOT.Char.GetFaith.HighGodName], který spojuje všechny duše!“ přidá [pam_spread_listener_1.GetTitledFirstName] a sklidí souhlasné zabručení.\n\nSrdce se otevírají — lásce, naději i posvátným věcem. Slova pronesená v tuto chvíli zapustí kořeny." # todo: NEW TRANSLATION
 pam_spread_tenet_events.0401.t: "Slova při smuteční hostině" # todo: NEW TRANSLATION
 pam_spread_tenet_events.0401.desc: "Truchlící se shlukují do malých skupinek a rozmlouvají o zesnulém i o osudu, který čeká nás všechny.\n\n„Věčnost si nakonec povolá každého z nás,“ zamumlá mi [pam_spread_listener_1.GetTitledFirstName] u ramene. „A přesto se přeme o malichernosti.“\n\nMožná žal otevřel nějakou duši..." # todo: NEW TRANSLATION
