l_polish:
 spread_personal_tenet_intent: "Hlásat zásadu"
 spread_personal_tenet_intent_desc: "Chceš hlásat svou [Concept('personal_tenet','osobní zásadu')|E] vnímavým hostům, aby ji přijali za vlastní a zvýšili tak její [Concept('tenet_popularity','rozšířenost')|E]."
 spread_personal_tenet_intent_not_valid_desc: "Už nezastáváš žádnou [Concept('personal_tenet','osobní zásadu')|E]"
 UNLOCK_SPREAD_PERSONAL_TENET_INTENT: "Odemyká [Concept('intent','záměr')|E] #EMP $spread_personal_tenet_intent$#! při [Concept('activities','aktivitách')|E] s hosty a umožňuje tak zvyšovat [Concept('tenet_popularity','rozšířenost zásady')|E]"
 apa_pam_spread_tenet_host_title: "[first.GetShortUINameNoTooltip|U] [Select_CString(first.IsLocalPlayer,'získáváš','získává')|l] na svou stranu [second.Custom('CZ_ShortUINameNoTooltip_A')]"
 apa_pam_spread_tenet_guest_title: "[first.GetShortUINameNoTooltip|U] [Select_CString(first.IsLocalPlayer,'získáváš','získává')|l] na svou stranu [second.Custom('CZ_ShortUINameNoTooltip_A')]"
 pam_spread_tenet_events.forbidden.desc: "\n\nV mém srdci však dlí přesvědčení [spread_tenet.GetBaseName] — víra, kterou mé náboženství odsuzuje. Vyslovit je v této společnosti znamená svěřit svůj osud každému, kdo naslouchá."
 pam_spread_tenet_option_scripture: "Samo Písmo mluví za mě."
 pam_spread_tenet_option_preach: "Slyšte, co pokládám za pravdu!"
 pam_spread_tenet_option_forbidden: "Pravda za to riziko stojí. Pojďte blíž."
 pam_spread_tenet_option_decline: "Snad někdy jindy."
 pam_spread_tenet_forbidden_flavor: "Ne každý, kdo mě poslouchá, mi přeje dobro..."
 pam_spread_tenet_overheard_toast: "Nepřející posluchači"
 pam_spread_tenet_events.0001.t: "Řeči u stolu"
 pam_spread_tenet_events.0001.desc: "Stůl se prohýbá pod vybranými pokrmy — [ROOT.Char.Custom('GetExpensiveMeal')|l] voní lákavě — a místnost naplňují přípitky a smích.\n\n„Zdá se, že se ve svatých věcech dobře vyznáš,“ poznamená [pam_spread_listener_1.GetTitledFirstName] a nakloní se přes mísy s ovocem — [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit')|l] — blíž ke mně. „Pokračuj.“\n\nU stolu nastává ticho. Vstřícné publikum ochotné naslouchat..."
 pam_spread_tenet_events.0101.t: "Kolem ohně"
 pam_spread_tenet_events.0101.desc: "Krátký oddech při lovu. Sedíme těsně kolem ohně a na rožni se opéká [ROOT.Char.Custom('GetRandomRegionalSmallGame')|l].\n\n„Takový lov obrací duši k vyšším věcem,“ zamumlá [pam_spread_listener_1.GetTitledFirstName] s očima upřenýma do plamenů.\n\nSvětlo ohně, klid a uši ochotné naslouchat."
 pam_spread_tenet_events.0201.t: "Mezi kláními"
 pam_spread_tenet_events.0201.desc: "Kolbiště mezi souboji zeje prázdnotou. Panoši odnášejí roztříštěná kopí a dav hledá stín a novinky.\n\n„Kéž [ROOT.Char.GetFaith.HighGodName] přijme díky všech vítězů a [ROOT.Char.GetFaith.DevilName] kletby všech poražených,“ žertuje [pam_spread_listener_1.GetTitledFirstName] z vedlejší lavice. „Ptá se však někdo z nich proč?“\n\nChvíle klidu, lavice plná zahálejících hodnostářů a otázka visící ve vzduchu."
 pam_spread_tenet_events.0301.t: "Přípitek přesvědčení"
 pam_spread_tenet_events.0301.desc: "Pohár za pohárem se zvedá — na novomanžele i na dosud nenarozené dědice.\n\n„A kéž [ROOT.Char.GetFaith.HighGodName] spojí všechny duše!“ dodá [pam_spread_listener_1.GetTitledFirstName] za souhlasného mručení.\n\nSrdce se otevírají lásce, naději i svatým věcem. Slova pronesená v tuto hodinu zapustí kořeny."
 pam_spread_tenet_events.0401.t: "Slova při bdění"
 pam_spread_tenet_events.0401.desc: "Truchlící se shlukují do malých skupinek a tiše hovoří o zesnulých i o osudu, který nás všechny čeká.\n\n„Věčnost si nakonec vezme každého z nás,“ zamumlá vedle mě [pam_spread_listener_1.GetTitledFirstName]. „A my se pořád hádáme kvůli malichernostem.“\n\nSnad zármutek pootevřel něčí duši..."
