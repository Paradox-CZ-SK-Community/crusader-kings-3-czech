 pam_assisted_by_theologians_modifier: "S pomocí teologů"
 pam_assisted_by_theologians_modifier_desc: "Této postavě pomáhají vzdělaní teologové."
 pam_known_by_mystics_modifier: "Známý mezi mystiky"
 pam_known_by_mystics_modifier_desc: "Tato postava se těší dobré pověsti mezi mystiky a rozjímajícími duchovními."
 pam_monastic_copyists_modifier: "Mnišští opisovači"
