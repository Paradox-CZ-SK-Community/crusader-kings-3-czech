 pam_lapsed_studies_modifier: "Zanechané studium"
 pam_lapsed_studies_modifier_desc: "Tato postava v zoufalství opustila posvátné vzdělávání."
 pam_renewed_zeal_modifier: "Obnovená horlivost"
 pam_renewed_zeal_modifier_desc: "Tato postava po přísném pokárání obnovila svou oddanost studiu.\n[Concept('success_chance','Šance na úspěch')|EU] intriky [GetScheme('study_scripture').GetTypeName]: #P +10%#!"
 pam_inspired_study_modifier: "Studium podnícené inspirací"
