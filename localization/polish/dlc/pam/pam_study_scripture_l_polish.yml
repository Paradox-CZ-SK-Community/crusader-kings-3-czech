 pam_charterhouse_silence_modifier: "Ticho kartuziánského kláštera"
 pam_charterhouse_silence_modifier_desc: "Kázeň mlčenlivých rozjímajících duchovních vnáší do tohoto studia vyrovnanost."
 pam_pastoral_letter_county_modifier: "Pastýřský list"
 pam_pastoral_letter_county_modifier_desc: "Při každé bohoslužbě se předčítá vzdálený pastýřův list útěchy a poučení."
