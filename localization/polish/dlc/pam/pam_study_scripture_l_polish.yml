 pam_measured_devotion_modifier: "Uměřená oddanost"
 pam_measured_devotion_modifier_desc: "Toto studium postupuje vytrvale, v hodinách, které jsou mu vyhrazeny."
 pam_measured_devotion_personal_modifier: "Oddaný student Písma"
