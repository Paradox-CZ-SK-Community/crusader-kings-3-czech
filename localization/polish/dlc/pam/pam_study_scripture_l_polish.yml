l_polish:
 study_scripture: "Náboženské studium"
 study_scripture_action: "Náboženské studium"
 study_scripture_desc: "Budu se věnovat posvátnému učení — textům, jako je [GetPlayer.GetFaith.ReligiousText], doktrínám své víry i tajemstvím, která leží za nimi."
 study_scripture_desc_general: "$study_scripture$ je [Concept('personal_scheme','osobní intrika')|E], v níž se pokoušíš získat [Concept('piety','zbožnost')|E], [Concept('skill','dovednost')|E] a [Concept('trait','rys')|E] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )|l]."
 STUDY_SCRIPTURE_SCHEME_SUCCESS_DESC: "Zlepšíš své dovednosti, získáš zbožnost nebo objevíš příležitost"
 STUDY_SCRIPTURE_PURSUIT_OF_KNOWLEDGE: "Zastáváš zásadu [GetTenetType('tenet_pursuit_of_knowledge').GetBaseName]: $VALUE|+0=$"
