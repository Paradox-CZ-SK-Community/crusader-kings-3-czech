 pam_study_scripture_decision: "Studovat posvátný text [ROOT.Char.GetFaith.ReligiousText]"
 pam_study_scripture_decision_desc: "[ROOT.Char.GetFaith.ReligiousText|U] vyžaduje studium a doktríny víry [ROOT.Char.GetFaith.GetName] se nečinné mysli neodhalí. Vyhraď si čas mezi tím, co obnášejí [ROOT.Char.Custom('StudyOfficesWord')|l] — studuj, rozjímej a ukaž svému stádu, jak se jeho [Select_CString(ROOT.Char.IsFemale,'pastýřka','pastýř')] vzdělává."
 pam_study_scripture_decision_tooltip: "Zahájit [Concept('scheme','intriku')|E] [GetScheme('study_scripture').GetTypeName] zaměřenou na sebe"
 pam_study_scripture_decision_tt: "Zahájíš [Concept('scheme','intriku')|E] [GetScheme('study_scripture').GetTypeName] zaměřenou na sebe\n\nOčekávané odměny:\n$EFFECT_LIST_BULLET$ [piety_i][Concept('piety','Zbožnost')|EU]\n$EFFECT_LIST_BULLET$ [Concept('trait','Rys')|EU] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )|l] / [Concept('trait_level_track_xp','zkušenosti rysu')|E]\n$EFFECT_LIST_BULLET$ [learning_i][stewardship_i][diplomacy_i] [Concept('skill','Dovednost')|EU] #weak (až do 8)#!\n$EFFECT_LIST_BULLET$ Příležitosti mezi [Concept('clergy','duchovenstvem')|E]\n\nNevýhody:\n$EFFECT_LIST_BULLET$ Můžeš získat [stress_i][Concept('stress','stres')|E]\n$EFFECT_LIST_BULLET$ Nižší zisk [prestige_i][Concept('prestige','prestiže')|E]"
 pam_study_scripture_decision_confirm: "Ať lekce započne."
 pam_study_scripture_decision_req_tt: "Právě neprovádíš [Concept('scheme','intriku')|E] [GetScheme('study_scripture').GetTypeName]"
 pam_study_scripture_decision_end_scheme_tt: "@alert_icon!#alert_trial Tvá probíhající [Concept('personal_scheme','osobní intrika')|E] skončí#!"
