 tenet_celestial_hierarchy_greek_name: "Ouranía Hierarkhía" # todo: NEW TRANSLATION
 tenet_celestial_hierarchy_default_name: "Nebeská hierarchie" # todo: NEW TRANSLATION
 tenet_celestial_hierarchy_name: "$tenet_celestial_hierarchy_default_name$" # todo: NEW TRANSLATION
 tenet_celestial_hierarchy_latin_desc: "Svatí andělé, obklopte můj trůn a rodinu. Nebeský Otče, nechť Tví andělé umlčí všechny hlasy odsouzení a strachu, které se proti mně pozvedají, a nechť rychle přenesou mé modlitby k Tvému trůnu.\n\n$pam_hebrews_1_14_latin$\n\n[Glossary('Hierarchia Caelestis Historical Background','tenet_celestial_hierarchy_historical_desc')]" # todo: NEW TRANSLATION
 tenet_celestial_hierarchy_greek_desc: "Buď strážným andělem, moudrým rádcem a společníkem křesťanského lidu a přinášej mu osvícení, sílu, radost, pokoj a útěchu.\n\n$pam_hebrews_1_14_greek$\n\n[Glossary('Ouranía Hierarkhía Historical Background','tenet_celestial_hierarchy_historical_desc')]" # todo: NEW TRANSLATION
 tenet_celestial_hierarchy_default_desc: "Andělé jsou uspořádáni do devíti řádů, od serafínů až po prosté anděly. Každý z nich slouží Bohu v jemu určené úloze a pomáhá lidstvu.\n\n$pam_hebrews_1_14_default$\n\n[Glossary('Celestial Hierarchy Historical Background','tenet_celestial_hierarchy_historical_desc')]" # todo: NEW TRANSLATION
 tenet_celestial_hierarchy_historical_desc: "Pojem nebeské hierarchie systematizoval Pseudo-Dionysios Areopagita v 5. či 6. století ve svém díle „De Coelesti Hierarchia“. Rozdělil anděly do tří triád: nejvyšší tvoří serafíni, cherubíni a trůnové; prostřední panstva, síly a mocnosti; nejnižší knížectva, archandělé a andělé.\n\nTato hierarchie hluboce ovlivnila středověkou křesťanskou teologii a přijalo ji východní i západní křesťanství. Tomáš Akvinský začlenil tuto angelologii do své Teologické sumy a ovlivnila také umělecká znázornění nebe po celý středověk." # todo: NEW TRANSLATION
 doctrine_parameter_tenet_celestial_hierarchy_sp_from_court_position: "Najmutí [court_positions|E] s vysokou [aptitude|E] přináší #P 3#! @spiritual_fulfillment_icon![spiritual_fulfillment|E]; propuštění nebo odvolání kteréhokoli držitele stojí #N 3#!" # todo: NEW TRANSLATION
