 tenet_confession_latin_name: "Confessio" # todo: NEW TRANSLATION
 tenet_confession_greek_name: "Exomológēsis" # todo: NEW TRANSLATION
 tenet_confession_default_name: "Svátost zpovědi" # todo: NEW TRANSLATION
 tenet_confession_name: "$tenet_confession_default_name$" # todo: NEW TRANSLATION
 tenet_confession_latin_desc: "Požehnej mi, Otče, neboť jsem zhřešil. Ó nejmilosrdnější Bože! Padám k Tvým nohám a prosím Tě o odpuštění. Se vší upřímností se Ti a Tvému knězi zpovídám ze svých hříchů\n\n$pam_james_5_16_latin$\n\n[Glossary('Confessio Historical Background','tenet_confession_historical_desc')]" # todo: NEW TRANSLATION
 tenet_confession_greek_desc: "Vyslyš modlitbu mou, ubožáka, a znič hada, který se ve mně uhnízdil, ó Pane!\n\n$pam_james_5_16_greek$\n\n[Glossary('Exomológēsis Historical Background','tenet_confession_historical_desc')]" # todo: NEW TRANSLATION
 tenet_confession_default_desc: "Hříšníci mohou skrze zpověď získat rozhřešení a smířit se s Bohem i církví.\n\n$pam_james_5_16_default$\n\n[Glossary('Sacrament of Confession Historical Background','tenet_confession_historical_desc')]" # todo: NEW TRANSLATION
 tenet_confession_historical_desc: "Praxe zpovídání se z hříchů se v průběhu křesťanských dějin výrazně proměnila. V rané církvi byla u těžkých hříchů běžná veřejná zpověď. Soukromá zpověď knězi se rozšířila v keltských církvích během 6. století a poté se rozšířila po celém západním křesťanstvu. Čtvrtý lateránský koncil v roce 1215 nařídil všem křesťanům každoroční zpověď. Zpovědní tajemství, tedy naprostá důvěrnost zpovídaných hříchů, se stalo určujícím znakem této svátosti a kněží byli ochotni podstoupit mučednickou smrt, než aby je porušili." # todo: NEW TRANSLATION
 doctrine_parameter_tenet_confession_priests_secrets: "[court_chaplain|E] tvé [faith|E], který také praktikuje zpověď a buď tě má rád, nebo je vázán silným háčkem, má vyšší efektivitu úkolu $task_find_secrets$ [councillor_task|E]" # todo: NEW TRANSLATION
 doctrine_parameter_tenet_confession_spiritual_counsel_bonus: "#high $spiritual_counsel_interaction$#! od [clergy|E] tohoto [rite|E] přináší více @piety_icon![piety|E] a @spiritual_fulfillment_icon![spiritual_fulfillment|E]" # todo: NEW TRANSLATION
 doctrine_parameter_tenet_confession_study_scripture_bonus: "[GetScheme('study_scripture').GetTypeName] [schemes|E] zmírňují více [stress|E]" # todo: NEW TRANSLATION
 doctrine_parameter_tenet_confession_confess_sins_decision: "Lze využít [decision|E] [GetDecisionWithKey('pam_decision_confession').GetName]" # todo: NEW TRANSLATION
 tenet_original_sin_latin_name: "Peccatum Originale" # todo: NEW TRANSLATION
 tenet_original_sin_greek_name: "Propatorikē Hamartía" # todo: NEW TRANSLATION
 tenet_original_sin_default_name: "Prvotní hřích" # todo: NEW TRANSLATION
 tenet_original_sin_name: "$tenet_original_sin_default_name$" # todo: NEW TRANSLATION
 tenet_original_sin_latin_desc: "Všichni lidé ztratili svou nevinnost Adamovým přestoupením. Jeho následky přetrvávají v člověku, jehož přirozenost je oslabena a tíhne ke zlu, a volají ho k duchovnímu boji. \n\n$pam_romans_5_12_latin$\n\n[Glossary('Peccatum Originale Historical Background','tenet_original_sin_historical_desc')]" # todo: NEW TRANSLATION
 tenet_original_sin_greek_desc: "Náš Stvořiteli a Tvůrce, vina leží na nás. Adam a Eva naslouchali Satanovi a rouhali se. Z egoismu se nechali svést. Oslabili přirozenost lidstva. Představy našeho srdce jsou zlé.\n\n$pam_romans_5_12_greek$\n\n[Glossary('Propatorikē Hamartía Historical Background','tenet_original_sin_historical_desc')]" # todo: NEW TRANSLATION
 tenet_original_sin_default_desc: "Celé lidstvo dědí poskvrnu Adamova prvního hříchu, z níž nás může vykoupit pouze božská milost skrze Krista.\n\n$pam_romans_5_12_default$\n\n[Glossary('Original Sin Historical Background','tenet_original_sin_historical_desc')]" # todo: NEW TRANSLATION
 tenet_original_sin_historical_desc: "Nauku o prvotním hříchu rozsáhle rozvinul na počátku 5. století svatý Augustin z Hippo, zejména v reakci na pelagiánské kacířství, které popíralo dědičnost hříšnosti. Augustin učil, že Adamův hřích se přenesl na všechny jeho potomky, porušil lidskou přirozenost a učinil spásu bez božské milosti nemožnou. Kartágský koncil v roce 418 toto učení potvrdil a stalo se základním kamenem západní křesťanské teologie. Východní křesťanství rozvinulo poněkud odlišné pojetí, které zdůrazňovalo spíše dědičný hřích než přímo zděděnou vinu." # todo: NEW TRANSLATION
