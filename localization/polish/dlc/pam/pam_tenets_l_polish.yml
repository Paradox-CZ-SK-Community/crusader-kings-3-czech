 pam_personal_syncretism_county_modifier: "Vstřícný synkretismus"
 pam_personal_syncretism_county_modifier_desc: "Místní obyvatelstvo respektuje osobní synkretické tradice svého vládce a za jeho vlády vzkvétá."
 tenet_monophysitism_latin_name: "Monophysitismus"
 tenet_monophysitism_greek_name: "Monophysitismós"
 tenet_monophysitism_default_name: "Monofyzitismus"
 tenet_monophysitism_name: "$tenet_monophysitism_default_name$"
 tenet_monophysitism_latin_desc: "Syn je jeden a jeho přirozenost je jedna, i když se má za to, že přijal tělo s rozumovou duší.\n\n$pam_john_1_1_latin$"
 tenet_monophysitism_latin_historical_glossary: "[Glossary('Monophysitismus','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_greek_desc: "Jedna přirozenost vtěleného Slova.\n\n$pam_john_1_1_greek$"
 tenet_monophysitism_greek_historical_glossary: "[Glossary('Monophysitismós','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_default_desc: "Kristus má pouze jednu, plně božskou přirozenost.\n\n$pam_john_1_1_default$"
 tenet_monophysitism_default_historical_glossary: "[Glossary('Monofyzitismus','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_historical_desc: "Tento princip, jehož název vychází z řeckého monos, #weak jediný#!, a physis, #weak přirozenost#!, tvrdí, že Ježíš Kristus má pouze jednu božskou přirozenost, vtělené Boží Slovo. Byl odsouzen jako hereze na chalcedonském koncilu roku 451 n. l., přesto získal podporu císaře Basilika a ochranu císaře Justiniána I. Vedl ke vzniku rozkolnických skupin, jako byli akefalové, kteří odmítali autoritu alexandrijského patriarchy, a dokétisté, kteří věřili, že Ježíšova lidská přirozenost byla pouhým přízrakem."
