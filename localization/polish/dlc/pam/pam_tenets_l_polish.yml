 tenet_monophysitism_latin_desc: "Syn je jeden a jeho přirozenost je jedna, i když se má za to, že přijal tělo s rozumovou duší.\n\n$pam_john_1_1_latin$\n\n[Glossary('Monophysitismus Historical Background','tenet_monophysitism_historical_desc')]" # todo: NEW TRANSLATION
 tenet_monophysitism_greek_desc: "Jedna přirozenost vtěleného Slova.\n\n$pam_john_1_1_greek$\n\n[Glossary('Monophysitismós Historical Background','tenet_monophysitism_historical_desc')]" # todo: NEW TRANSLATION
 tenet_monophysitism_default_desc: "Kristus má pouze jednu, plně božskou přirozenost.\n\n$pam_john_1_1_default$\n\n[Glossary('Monophysitism Historical Background','tenet_monophysitism_historical_desc')]" # todo: NEW TRANSLATION
 tenet_monophysitism_historical_desc: "Tento princip, jehož název vychází z řeckého monos, #weak jediný#!, a physis, #weak přirozenost#!, tvrdí, že Ježíš Kristus má pouze jednu božskou přirozenost, vtělené Boží Slovo. Byl odsouzen jako hereze na chalcedonském koncilu roku 451 n. l., přesto získal podporu císaře Basilika a ochranu císaře Justiniána I. Vedl ke vzniku rozkolnických skupin, jako byli akefalové, kteří odmítali autoritu alexandrijského patriarchy, a dokétisté, kteří věřili, že Ježíšova lidská přirozenost byla pouhým přízrakem." # todo: NEW TRANSLATION
 doctrine_parameter_tenet_monophysitism_theologian_bonus: "[characters|E] s vlastností [GetTrait('theologian').GetName( GetNullCharacter )]: #P +10%#! k zisku @piety_icon![piety|E], #P +5#! k [opinion|E] horlivců, #P +10%#! ke zkušenostem s [lifestyle|E]" # todo: NEW TRANSLATION
