 doctrine_parameter_tenet_hesychasm_impatient_penalty: "[Concept('characters','postavy')|EU] s rysem [GetTrait('impatient').GetName( GetNullCharacter )|l]: #N -10%#! zisk @piety_icon![Concept('piety','zbožnosti')|E]"
 doctrine_parameter_tenet_hesychasm_prayer_of_the_heart: "[Concept('characters','postavy')|EU] s rysem [GetTrait('journaller').GetName( GetNullCharacter )|l], [GetTrait('contrite').GetName( GetNullCharacter )|l], [GetTrait('confider').GetName( GetNullCharacter )|l] nebo [GetTrait('flagellant').GetName( GetNullCharacter )|l]: #P +10%#! úbytek [Concept('stress','stresu')|E], #P +5%#! zisk @spiritual_fulfillment_icon![Concept('spiritual_fulfillment','duchovního naplnění')|E]"
 doctrine_parameter_tenet_hesychasm_losing_stress_grants_piety: "Při snížení úrovně [Concept('stress','stresu')|E] získáš @piety_icon![Concept('piety','zbožnost')|E] a @spiritual_fulfillment_icon![Concept('spiritual_fulfillment','duchovní naplnění')|E] (nejvýše jednou ročně)"
 pam_hesychasm_meditation_toast: "Za tvou zásadu [GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )|l]: bonus za meditaci v tichosti domova"
 pam_hesychasm_stillness_toast: "Za tvou zásadu [GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )|l]: ztišení srdce"
 hesychasm_anachoresis_mortification_exclusivity_desc: "Postavy mohou mít současně pouze jednu z těchto [Concept('core_tenets','zásad')|E]: [GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )|l], [GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetRite )|l], [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )|l], [GetTenetType('tenet_asceticism').GetName( GetPlayer.GetRite )|l]"
 tenet_anachoresis_latin_name: "Vita Eremitica"
 tenet_anachoresis_greek_name: "Anakhōrēsis"
 tenet_anachoresis_default_name: "Anachoréze"
 tenet_anachoresis_name: "$tenet_anachoresis_default_name$"
 tenet_anachoresis_latin_desc: "Pane, jako jsi vedl svého Syna na poušť, aby se připravil na své poslání, veď i nás do pouště našich srdcí. V samotě a tichu nám dej uniknout rozptýlení světa a nalézt pouze Tebe.\n\n$pam_matthew_4_1_2_latin$"
 tenet_anachoresis_latin_historical_glossary: "[Glossary('Vita Eremitica','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_greek_desc: "Blaze těm, kdo se stáhnou ze světa, neboť v tichu pouště naleznou Boha. Jako proroci přebývali v jeskyních a zemských slujích, tak i Kristovi služebníci hledají samotu, aby vedli boj proti tvůjním.\n\n$pam_matthew_4_1_2_greek$"
 tenet_anachoresis_greek_historical_glossary: "[Glossary('Anakhōrēsis','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_default_desc: "Věřící se mohou stáhnout ze světské společnosti do pustiny, dosáhnout duchovní čistoty, přemoci tvůjně a přiblížit se Bohu prostřednictvím osamělé modlitby a asketické kázně.\n\n$pam_matthew_4_1_2_default$"
 tenet_anachoresis_default_historical_glossary: "[Glossary('Anachoréze','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_historical_desc: "Anachoréze, z řeckého #weak anakhorēsis#!, což znamená ústraní, označuje způsob života poustevníků, kteří opouštěli společnost a odcházeli do pustiny, aby se věnovali modlitbě, půstu a duchovnímu boji proti démonickým silám. Toto hnutí začalo ve 3. století v Egyptě u svatého Pavla Thébského, tradičně považovaného za prvního křesťanského poustevníka, který kolem roku 250 uprchl před pronásledováním císaře Decia do Thébaidské pouště.\n\nPoustevníci zůstávali běžnou součástí života po celý středověk. Žili v osamělých celách připojených ke klášterům a eucharistii přijímali malým okénkem zvaným hagioskop. Příručky, jako byla anglická Ancrene Wisse ze 13. století, stanovovaly pravidla pro poustevníky i poustevnice."
 doctrine_parameter_tenet_anachoresis_mystic_trait: "Získá [Concept('trait','rys')|E] [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )|l]"
