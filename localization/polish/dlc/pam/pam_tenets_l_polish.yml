 tenet_acts_of_apostles_name: "$tenet_acts_of_apostles_default_name$"
 tenet_acts_of_apostles_latin_desc: "Stejně jako Mojžíš směle stanul před faraonem a zvěstoval mu Tvůj úkol, i naši misionáři předstupují před ostatní.\n\n$pam_acts_1_8_latin$"
 tenet_acts_of_apostles_latin_historical_glossary: "[Glossary('Actus Apostolorum','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_greek_desc: "Vrátím Ti Tvůj lid, Tvůj dar, který jsi mi dal. Veď je svou mocnou pravicí a chraň je ve stínu svých křídel.\n\n$pam_acts_1_8_greek$"
 tenet_acts_of_apostles_greek_historical_glossary: "[Glossary('Práxeis tõn Apostólōn','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_default_desc: "Přinášejte nebeské světlo těm, kdo žijí v temnotě, a naději těm, kdo propadli zoufalství.\n\n$pam_acts_1_8_default$"
 tenet_acts_of_apostles_default_historical_glossary: "[Glossary('Horlivé šíření víry','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_historical_desc: "Křesťanství se v prvních stoletích našeho letopočtu rychle šířilo, z velké části díky misionářskému úsilí apoštolů a prvních učedníků. Jejich cesty vedly napříč Římskou říší, kde zakládali křesťanské obce a obraceli na víru lidi z různých prostředí. Horlivost při šíření víry pohánělo hluboké přesvědčení o poselství spásy skrze Ježíše Krista, díky němuž se křesťanství z malé židovské sekty stalo významným světovým náboženstvím.\n\nVe středověku se na misijní cesty do pohanských zemí vydala řada budoucích světců a mučedníků, kteří neúnavně šířili křesťanskou víru."
 doctrine_parameter_tenet_acts_of_apostles_laamp_missionary_bonus: "Mírnější požadavky pro [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('zealous_missionary_prep_decision').GetName|l], které bude přijímat více [Concept('adventurers','dobrodruhů')|E]"
 doctrine_parameter_tenet_acts_of_apostles_legitimacy_from_converts: "Konverze [Concept('characters','postav')|E] uděluje #P 50#! @legitimacy_icon!; konverze [Concept('county','hrabství')|E] tvým [Concept('court_chaplain','dvorním kaplanem')|E] uděluje #P 100#! @legitimacy_icon! a #P 5#! @spiritual_fulfillment_icon!"
 doctrine_parameter_tenet_acts_of_apostles_fulfillment_from_converts: "Konverze [Concept('character','postavy')|E] uděluje #P 3#! @spiritual_fulfillment_icon![Concept('spiritual_fulfillment','duchovního naplnění')|E], nebo #P 10#! za konverzi [Concept('ruler','vládce')|E], který je zeměpánem"
 doctrine_parameter_tenet_acts_of_apostles_head_of_rite_sway: "Tvá [Concept('head_of_rite','hlava ritu')|E] získá #P +25#! k přesvědčivosti při získávání [Concept('characters','postav')|E] pro tento [Concept('rite','ritus')|E]"
 doctrine_parameter_tenet_acts_of_apostles_conversion_learning: "Tvá výhoda v [Concept('learning','učenosti')|E] se při požadavku na konverzi [Concept('characters','postav')|E] počítá #P dvakrát#!"
