 tenet_be_fruitful_and_multiply_latin_desc: "Manželé se nejen darují jeden druhému, ale předávají život i svým dětem, které jsou živým odrazem jejich lásky a živoucí, neoddělitelnou syntézou jejich bytí.\n\n$pam_genesis_1_28_latin$"
 tenet_be_fruitful_and_multiply_latin_historical_glossary: "[Glossary('Crescite et Multiplicamini','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_greek_desc: "Hle, děti jsou dědictvím od Hospodina, plod lůna je odměnou.\n\n$pam_genesis_1_28_greek$"
 tenet_be_fruitful_and_multiply_greek_historical_glossary: "[Glossary('Auxánesthe kaì Plēthýnesthe','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_default_desc: "V Božím plánu je rodina důvěrným společenstvím života a lásky, jehož úsilí nalezne naplnění, stejně jako vše stvořené a vykoupené, v Božím království.\n\n$pam_genesis_1_28_default$"
 tenet_be_fruitful_and_multiply_default_historical_glossary: "[Glossary('Ploďte a množte se','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_historical_desc: "Ploďte a množte se je biblický příkaz z Genesis 1:28, v němž Bůh přikazuje Adamovi a Evě, aby měli potomstvo a naplnili zemi."
 doctrine_parameter_tenet_be_fruitful_and_multiply_easy_spouse_romance: "Dvoření manželovi či manželce je výrazně snazší a přináší značný bonus k [Concept('fertility','plodnosti')|E]"
 doctrine_parameter_tenet_be_fruitful_and_multiply_low_fertility_divorce: "Lze se vždy rozvést s manželem či manželkou s nízkou [Concept('fertility','plodností')|E]"
