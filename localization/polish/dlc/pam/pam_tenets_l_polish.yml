 tenet_miles_christi_latin_name: "Miles Christi" # todo: NEW TRANSLATION
 tenet_miles_christi_greek_name: "Stratiōtēs Christoũ" # todo: NEW TRANSLATION
 tenet_miles_christi_name: "$tenet_miles_christi_default_name$" # todo: NEW TRANSLATION
 tenet_miles_christi_default_name: "Kristovo vojsko" # todo: NEW TRANSLATION
 tenet_miles_christi_latin_desc: "Stůjte pevně, opásáni pravdou a oděni pancířem spravedlnosti. Bojujte dobrý boj víry jako praví vojáci Kristovi.\n\n$pam_ephesians_6_11_latin$\n\n[Glossary('Miles Christi Historical Background','tenet_miles_christi_historical_desc')]" # todo: NEW TRANSLATION
 tenet_miles_christi_greek_desc: "Každý věrný křesťan musí být připraven trpět pro Krista, pevně vzdorovat duchovním silám zla a s odvahou vojáka snášet útrapy.\n\n$pam_ephesians_6_11_greek$\n\n[Glossary('Stratiōtēs Christoũ Historical Background','tenet_miles_christi_historical_desc')]" # todo: NEW TRANSLATION
 tenet_miles_christi_default_desc: "Věřící jsou povoláni stát se duchovními bojovníky, bojovat proti hříchu a zlu v Boží zbroji a být připraveni trpět pro Krista, jako vojáci trpí pro svého velitele.\n\n$pam_ephesians_6_11_default$\n\n[Glossary('Soldiery of Christ Historical Background','tenet_miles_christi_historical_desc')]" # todo: NEW TRANSLATION
 tenet_miles_christi_historical_desc: "Pojem „Kristův voják“ (Miles Christi) má v křesťanské tradici hluboké kořeny. Pochází z listů svatého Pavla, který vojenskými obrazy popisoval duchovní život. Ve středověku se tento pojem vztahoval na doslovný i duchovní boj.\n\nVojenské řády, například templáři a johanité, ztělesňovaly tento ideál a spojovaly mnišskou disciplínu s bojovou zdatností. Bernard z Clairvaux ve svém díle „De Laude Novae Militiae“ chválil tyto mnišské bojovníky jako vzory křesťanské ctnosti, kteří nebojují pro světský zisk, nýbrž na obranu křesťanstva." # todo: NEW TRANSLATION
 doctrine_parameter_tenet_miles_christi_white_peace_defender_bonus: "Ukončení [war|E] v [white_peace|E] v roli obránce proti stejné [faith|E] přináší #P 100#! @piety_icon![piety|E] a @legitimacy_icon![legitimacy|E], jejichž množství se odvíjí od [title|E] hodnosti obou stran, a #P 5#! @spiritual_fulfillment_icon![spiritual_fulfillment|E]" # todo: NEW TRANSLATION
 doctrine_parameter_tenet_miles_christi_combat_fulfillment: "Velení ve vyhrané [battle|E] nebo [siege|E] přináší #P 3#! @spiritual_fulfillment_icon![spiritual_fulfillment|E]" # todo: NEW TRANSLATION
 doctrine_parameter_tenet_miles_christi_holy_weapon_blessing: "Vítězství v [battles|E] proti jinému [religion|E] se zbraní [holy_relic|E] ji posílí čtyřmi požehnáními, a to až do #P 50#! vítězství" # todo: NEW TRANSLATION
 tenet_philanthropia_latin_name: "Caritas" # todo: NEW TRANSLATION
 tenet_philanthropia_greek_name: "Philanthrōpía" # todo: NEW TRANSLATION
 tenet_philanthropia_default_name: "Dobročinnost" # todo: NEW TRANSLATION
 tenet_philanthropia_name: "$tenet_philanthropia_default_name$" # todo: NEW TRANSLATION
 tenet_philanthropia_latin_desc: "Cokoli jste učinili pro jednoho z těchto mých nejmenších bratří a sester, učinili jste pro mne. Dávání almužen a péče o chudé nejsou pouhými občanskými povinnostmi, nýbrž cestou, jak se přiblížit samotnému Kristu.\n\n[Glossary('Caritas Historical Background','tenet_philanthropia_historical_desc')]" # todo: NEW TRANSLATION
 tenet_philanthropia_greek_desc: "Filantropie — láska k lidstvu — nalezla svůj nejplnější výraz v císařských a církevních nemocnicích, hospicích a almužnách Nového Říma. Sytit hladové a vykupovat zajatce znamená následovat Kristův příklad, neboť on se pro nás zřekl všeho.\n\n[Glossary('Philanthrōpía Historical Background','tenet_philanthropia_historical_desc')]" # todo: NEW TRANSLATION
 tenet_philanthropia_default_desc: "Víra si cení štědrého rozdávání almužen, péče o chudé a dobročinných institucí jakožto ústřední křesťanské povinnosti, v souladu s církevními otci a příkladem raných hospiců a nemocnic.\n\n[Glossary('Charity Historical Background','tenet_philanthropia_historical_desc')]" # todo: NEW TRANSLATION
 tenet_philanthropia_historical_desc: "V byzantském křesťanství označovala filantropie jak ctnost všeobecné lásky, tak konkrétní instituce — nemocnice, xenodochia, sirotčince a almužny — podporované císaři, biskupy a věřícími. Basil z Caesareje, Jan Zlatoústý i pozdější císaři, jako Justinián, spojovali císařskou legitimitu s péčí o potřebné. Církev neoslavovala válku jako cestu ke svatosti; trvala však na tom, že bohatství a moc jsou zčásti oprávněné jen tehdy, slouží-li chudým." # todo: NEW TRANSLATION
 doctrine_parameter_tenet_philanthropia_high_almoner_court_position: "Může jmenovat [GetCourtPositionType('high_almoner_court_position').GetName] od úrovně hrabství výše" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [county|E]
 doctrine_parameter_tenet_philanthropia_ransom_captives: "Výkupné za jinou [character|E] přináší @piety_icon![piety|E] a @spiritual_fulfillment_icon![spiritual_fulfillment|E] v závislosti na zaplaceném @gold_icon![gold|E]" # todo: NEW TRANSLATION
