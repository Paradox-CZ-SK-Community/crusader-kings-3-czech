 tenet_mortification_of_the_flesh_greek_name: "Nékrōsis tẽs Sarkós" # todo: NEW TRANSLATION
 tenet_mortification_of_the_flesh_default_name: "Umrtvování těla" # todo: NEW TRANSLATION
 tenet_mortification_of_the_flesh_name: "$tenet_mortification_of_the_flesh_default_name$" # todo: NEW TRANSLATION
 tenet_mortification_of_the_flesh_latin_desc: "Pane, dej nám milost ukřižovat své tělo s jeho vášněmi a žádostmi. Skrze svaté utrpení nám dovol sdílet Kristovo utrpení a umrtvovat skutky těla, abychom mohli skutečně žít.\n\n$pam_galatians_5_24_latin$\n\n[Glossary('Mortificatio Carnis Historical Background','tenet_mortification_of_the_flesh_historical_desc')]" # todo: NEW TRANSLATION
 tenet_mortification_of_the_flesh_greek_desc: "Půstem, bděním a umrtvováním těla podmaňují Boží služebníci tělo a přivádějí je k poslušnosti, aby se duch mohl vznést k nebi.\n\n$pam_galatians_5_24_greek$\n\n[Glossary('Nékrōsis tẽs Sarkós Historical Background','tenet_mortification_of_the_flesh_historical_desc')]" # todo: NEW TRANSLATION
 tenet_mortification_of_the_flesh_default_desc: "Věřící umrtvují tělo i jeho hříšné touhy a sdílejí Kristovo utrpení, aby očistili duši a dosáhli duchovní dokonalosti.\n\n$pam_galatians_5_24_default$\n\n[Glossary('Mortification of the Flesh Historical Background','tenet_mortification_of_the_flesh_historical_desc')]" # todo: NEW TRANSLATION
