 tenet_miles_christi_latin_name: "Miles Christi"
 tenet_miles_christi_greek_name: "Stratiōtēs Christoũ"
 tenet_miles_christi_name: "$tenet_miles_christi_default_name$"
 tenet_miles_christi_default_name: "Kristovo vojsko"
 tenet_miles_christi_latin_desc: "Stůjte pevně, opásáni pravdou a oděni pancířem spravedlnosti. Bojujte dobrý boj víry jako praví vojáci Kristovi.\n\n$pam_ephesians_6_11_latin$"
 tenet_miles_christi_latin_historical_glossary: "[Glossary('Miles Christi','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_greek_desc: "Každý věrný křesťan musí být připraven trpět pro Krista, pevně vzdorovat duchovním silám zla a s odvahou vojáka snášet útrapy.\n\n$pam_ephesians_6_11_greek$"
 tenet_miles_christi_greek_historical_glossary: "[Glossary('Stratiōtēs Christoũ','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_default_desc: "Věřící jsou povoláni stát se duchovními bojovníky, bojovat proti hříchu a zlu v Boží zbroji a být připraveni trpět pro Krista, jako vojáci trpí pro svého velitele.\n\n$pam_ephesians_6_11_default$"
 tenet_miles_christi_default_historical_glossary: "[Glossary('Kristovo vojsko','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_historical_desc: "Pojem „Kristův voják“ (Miles Christi) má v křesťanské tradici hluboké kořeny. Pochází z listů svatého Pavla, který vojenskými obrazy popisoval duchovní život. Ve středověku se tento pojem vztahoval na doslovný i duchovní boj.\n\nVojenské řády, například templáři a johanité, ztělesňovaly tento ideál a spojovaly mnišskou disciplínu s bojovou zdatností. Bernard z Clairvaux ve svém díle „De Laude Novae Militiae“ chválil tyto mnišské bojovníky jako vzory křesťanské ctnosti, kteří nebojují pro světský zisk, nýbrž na obranu křesťanstva."
 doctrine_parameter_tenet_miles_christi_white_peace_defender_bonus: "Ukončení [Concept('war','války')|E] [Concept('white_peace','bílým mírem')|E] v roli obránce proti protivníkovi stejné [Concept('faith','víry')|E] přináší #P 100#! @piety_icon![Concept('piety','zbožnosti')|E] a @legitimacy_icon![Concept('legitimacy','legitimitu')|E], jejichž množství se odvíjí od hodnosti [Concept('title','titulů')|E] obou stran, a #P 5#! @spiritual_fulfillment_icon![Concept('spiritual_fulfillment','duchovního naplnění')|E]"
 doctrine_parameter_tenet_miles_christi_combat_fulfillment: "Velení ve vyhrané [Concept('battle','bitvě')|E] nebo [Concept('siege','obléhání')|E] přináší #P 3#! @spiritual_fulfillment_icon![Concept('spiritual_fulfillment','duchovního naplnění')|E]"
 doctrine_parameter_tenet_miles_christi_holy_weapon_blessing: "Vítězství v [Concept('battles','bitvách')|E] proti jinému [Concept('religion','náboženství')|E] se zbraní, která je [Concept('holy_relic','svatou relikvií')|E], ji posílí čtyřmi požehnáními, a to až do #P 50#! vítězství"
 tenet_philanthropia_latin_name: "Caritas"
 tenet_philanthropia_greek_name: "Philanthrōpía"
 tenet_philanthropia_default_name: "Dobročinnost"
 tenet_philanthropia_name: "$tenet_philanthropia_default_name$"
 tenet_philanthropia_latin_desc: "Cokoli jste učinili pro jednoho z těchto mých nejmenších bratří a sester, učinili jste pro mne. Dávání almužen a péče o chudé nejsou pouhými občanskými povinnostmi, nýbrž cestou, jak se přiblížit samotnému Kristu."
 tenet_philanthropia_latin_historical_glossary: "[Glossary('Caritas','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_greek_desc: "Filantropie — láska k lidstvu — nalezla svůj nejplnější výraz v císařských a církevních nemocnicích, hospicích a almužnách Nového Říma. Sytit hladové a vykupovat zajatce znamená následovat Kristův příklad, neboť on se pro nás zřekl všeho."
 tenet_philanthropia_greek_historical_glossary: "[Glossary('Philanthrōpía','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_default_desc: "Víra si cení štědrého rozdávání almužen, péče o chudé a dobročinných institucí jakožto ústřední křesťanské povinnosti, v souladu s církevními otci a příkladem raných hospiců a nemocnic."
 tenet_philanthropia_default_historical_glossary: "[Glossary('Dobročinnost','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_historical_desc: "V byzantském křesťanství označovala filantropie jak ctnost všeobecné lásky, tak konkrétní instituce — nemocnice, xenodochia, sirotčince a almužny — podporované císaři, biskupy a věřícími. Basil z Caesareje, Jan Zlatoústý i pozdější císaři, jako Justinián, spojovali císařskou legitimitu s péčí o potřebné. Církev neoslavovala válku jako cestu ke svatosti; trvala však na tom, že bohatství a moc jsou zčásti oprávněné jen tehdy, slouží-li chudým."
 doctrine_parameter_tenet_philanthropia_high_almoner_court_position: "Od úrovně [Concept('county','hrabství')|E] výše lze obsadit dvorský úřad [GetCourtPositionType('high_almoner_court_position').GetName|l]"
 doctrine_parameter_tenet_philanthropia_ransom_captives: "Výkupné za jinou [Concept('character','postavu')|E] přináší @piety_icon![Concept('piety','zbožnost')|E] a @spiritual_fulfillment_icon![Concept('spiritual_fulfillment','duchovní naplnění')|E] v závislosti na zaplaceném @gold_icon![Concept('gold','zlatě')|E]"
 doctrine_parameter_tenet_philanthropia_generous_bonus: "[Concept('characters','postavy')|EU] s rysem [GetTrait('generous').GetName( GetNullCharacter )|l]: #P +10#! k [Concept('opinion','mínění')|E] souvěrců, #P +20 %#! k [Concept('development_growth','růstu rozvoje')|E]"
 doctrine_parameter_tenet_philanthropia_greedy_penalty: "[Concept('characters','postavy')|EU] s rysem [GetTrait('greedy').GetName( GetNullCharacter )|l]: #N -10#! k [Concept('opinion','mínění')|E] souvěrců, #N -25 %#! k zisku @piety_icon![Concept('piety','zbožnosti')|E]"
 doctrine_parameter_tenet_philanthropia_alms_to_the_destitute: "Darování [Concept('gift','daru')|E] [Concept('character','postavě')|E] v [Concept('debt','dluhu')|E] přináší @prestige_icon![Concept('prestige','prestiž')|E] a @piety_icon![Concept('piety','zbožnost')|E]"
 pam_philanthropia_ransom_toast: "Za tvou zásadu [GetTenetType('tenet_philanthropia').GetName( GetPlayer.GetRite )|l]"
 tenet_scholasticism_latin_name: "Sacra Doctrina"
 tenet_scholasticism_greek_name: "Skholastikē"
 tenet_scholasticism_default_name: "Scholastika"
 tenet_scholasticism_name: "$tenet_scholasticism_default_name$"
 tenet_scholasticism_latin_desc: "Hledání poznání je formou uctívání, neboť porozuměním stvoření se přibližujeme porozumění Stvořiteli. Hledej moudrost a bude ti dána.\n\n$pam_proverbs_1_7_latin$"
 tenet_scholasticism_latin_historical_glossary: "[Glossary('Sacra Doctrina','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_greek_desc: "Víra a rozum si neodporují, nýbrž se doplňují, neboť Bůh nám dal mysl, abychom hledali pravdu, a srdce, abychom Ho milovali. Studiem a rozjímáním stoupáme k vyššímu poznání.\n\n$pam_proverbs_1_7_greek$"
 tenet_scholasticism_greek_historical_glossary: "[Glossary('Skholastikē','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_default_desc: "Díky důkladnému intelektuálnímu zkoumání a dialektické metodě lze smířit víru s rozumem a dosáhnout hlubšího porozumění božské pravdě.\n\n$pam_proverbs_1_7_default$"
 tenet_scholasticism_default_historical_glossary: "[Glossary('Scholastika','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_historical_desc: "Scholastika byla převládající metodou vzdělávání na středověkých evropských univerzitách a svého vrcholu dosáhla ve 12. a 13. století. Snažila se smířit křesťanskou teologii s klasickou filozofií, zejména s dílem Aristotela.\n\nVýznamní scholastičtí myslitelé, jako Anselm z Canterbury, Petr Abélard, Albert Veliký a Tomáš Akvinský, rozvíjeli systematické přístupy k teologii, které kladly důraz na logickou přesnost a disputace. Teologická suma Tomáše Akvinského zůstává nejvyšším dílem scholastické metody a pokouší se sjednotit veškeré lidské poznání v křesťanském rámci."
 doctrine_parameter_tenet_scholasticism_muslim_hebrew_greek_poi: "Návštěva [Concept('points_of_interest','zajímavých míst')|E] v [CZReligionAdjDecline(GetReligionByKey('judaism_religion'),'ých')|l], [CZReligionAdjDecline(GetReligionByKey('islam_religion'),'ých')|l] a [CZReligionAdjDecline(GetReligionByKey('zoroastrianism_religion'),'ých')|l] [Concept('counties','hrabstvích')|E] přináší dodatečnou @piety_icon![Concept('piety','zbožnost')|E], [Concept('experience','zkušenosti')|E] v [Concept('learning','učenosti')|E] a @spiritual_fulfillment_icon![Concept('spiritual_fulfillment','duchovní naplnění')|E]"
 doctrine_parameter_tenet_scholasticism_university_bonus: "Dokončení [CZActivity('activity_adult_education','G')|l] přináší dlouhodobý [Concept('modifier','modifikátor')|E] [GetModifier('tenet_scholasticism_modifier').GetNameWithTooltip|l]"
 doctrine_parameter_tenet_scholasticism_study_scripture_bonus: "[Concept('scheme_success_chance','šance na úspěch intriky')|EU] při intrice [GetScheme('study_scripture').GetTypeName|l]: [success_chance_i]#P +10%#!"
 doctrine_parameter_tenet_scholasticism_university_chance: "Každoroční šance získat [GetModifier('tenet_scholasticism_modifier').GetNameWithTooltip|l] bez studia, zvýšená [Concept('learning','učeností')|E], [Concept('piety_level','úrovní oddanosti')|E] a známými jazyky"
 doctrine_parameter_tenet_scholasticism_cheaper_adult_education: "Účast na [CZActivity('activity_adult_education','L')|l] stojí o #P [EmptyScope.ScriptValue('pam_scholasticism_adult_education_discount_loc')]%#! méně @gold_icon![Concept('gold','zlata')|E]"
