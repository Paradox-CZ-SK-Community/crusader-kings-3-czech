 tenet_original_sin_latin_name: "Peccatum Originale"
 tenet_original_sin_greek_name: "Propatorikē Hamartía"
 tenet_original_sin_default_name: "Prvotní hřích"
 tenet_original_sin_name: "$tenet_original_sin_default_name$"
 tenet_original_sin_latin_desc: "Všichni lidé ztratili svou nevinnost Adamovým přestoupením. Jeho následky přetrvávají v člověku, jehož přirozenost je oslabena a tíhne ke zlu, a volají ho k duchovnímu boji. \n\n$pam_romans_5_12_latin$"
 tenet_original_sin_latin_historical_glossary: "[Glossary('Peccatum Originale','tenet_original_sin_historical_desc')]"
 tenet_original_sin_greek_desc: "Náš Stvořiteli a Tvůrce, vina leží na nás. Adam a Eva naslouchali Satanovi a rouhali se. Z egoismu se nechali svést. Oslabili přirozenost lidstva. Představy našeho srdce jsou zlé.\n\n$pam_romans_5_12_greek$"
 tenet_original_sin_greek_historical_glossary: "[Glossary('Propatorikē Hamartía','tenet_original_sin_historical_desc')]"
 tenet_original_sin_default_desc: "Celé lidstvo dědí poskvrnu Adamova prvního hříchu, z níž nás může vykoupit pouze božská milost skrze Krista.\n\n$pam_romans_5_12_default$"
 tenet_original_sin_default_historical_glossary: "[Glossary('Prvotní hřích','tenet_original_sin_historical_desc')]"
 tenet_original_sin_historical_desc: "Nauku o prvotním hříchu rozsáhle rozvinul na počátku 5. století svatý Augustin z Hippo, zejména v reakci na pelagiánské kacířství, které popíralo dědičnost hříšnosti. Augustin učil, že Adamův hřích se přenesl na všechny jeho potomky, porušil lidskou přirozenost a učinil spásu bez božské milosti nemožnou. Kartágský koncil v roce 418 toto učení potvrdil a stalo se základním kamenem západní křesťanské teologie. Východní křesťanství rozvinulo poněkud odlišné pojetí, které zdůrazňovalo spíše dědičný hřích než přímo zděděnou vinu."
 doctrine_parameter_tenet_original_sin_county_conversion_bonus: "[Concept('councillor_task','úkol rádce')|EU] [Concept('promote_culture','šířit kulturu')|E] je v [Concept('counties','hrabstvích')|E] stejného [Concept('rite','ritu')|E] o #P 25 %#! rychlejší"
 doctrine_parameter_tenet_original_sin_county_conversion_resistance: "[Concept('counties','hrabství')|EU] této [Concept('faith','víry')|E] vyžadují ke [Concept('promote_culture','změně kultury')|E] o #N 50%#! více času, pokud jejich [Concept('liege','lenní pán')|E] vyznává jinou [Concept('faith','víru')|E]"
 doctrine_parameter_tenet_original_sin_sinners_insight: "Za každý [Concept('sin','hřích')|E], který na sobě neseš, získáš #P +10#! k maximální šanci na úspěch nepřátelské [Concept('scheme','intriky')|E]"
 doctrine_parameter_tenet_original_sin_baptism_piety: "Při narození tvého dítěte získáš #P 50#! @piety_icon![Concept('piety','zbožnosti')|E]; novorozenec bude pokřtěn s #P 250#! @piety_icon![Concept('piety','zbožnosti')|E]"
 pam_original_sin_baptism_toast: "Za tvou zásadu [GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )|l]: poskvrna novorozence byla smyta"
