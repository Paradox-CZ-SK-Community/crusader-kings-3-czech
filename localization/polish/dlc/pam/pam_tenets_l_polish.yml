 tenet_mortification_of_the_flesh_greek_name: "Nékrōsis tẽs Sarkós"
 tenet_mortification_of_the_flesh_default_name: "Umrtvování těla"
 tenet_mortification_of_the_flesh_name: "$tenet_mortification_of_the_flesh_default_name$"
 tenet_mortification_of_the_flesh_latin_desc: "Pane, dej nám milost ukřižovat své tělo s jeho tvůjněmi a žádostmi. Skrze svaté utrpení nám dovol sdílet Kristovo utrpení a umrtvovat skutky těla, abychom mohli skutečně žít.\n\n$pam_galatians_5_24_latin$"
 tenet_mortification_of_the_flesh_latin_historical_glossary: "[Glossary('Mortificatio Carnis','tenet_mortification_of_the_flesh_historical_desc')]"
 tenet_mortification_of_the_flesh_greek_desc: "Půstem, bděním a umrtvováním těla podmaňují Boží služebníci tělo a přivádějí je k poslušnosti, aby se duch mohl vznést k nebi.\n\n$pam_galatians_5_24_greek$"
 tenet_mortification_of_the_flesh_greek_historical_glossary: "[Glossary('Nékrōsis tẽs Sarkós','tenet_mortification_of_the_flesh_historical_desc')]"
 tenet_mortification_of_the_flesh_default_desc: "Věřící umrtvují tělo i jeho hříšné touhy a sdílejí Kristovo utrpení, aby očistili duši a dosáhli duchovní dokonalosti.\n\n$pam_galatians_5_24_default$"
 tenet_mortification_of_the_flesh_default_historical_glossary: "[Glossary('Umrtvování těla','tenet_mortification_of_the_flesh_historical_desc')]"
 doctrine_parameter_tenet_mortification_scars_are_holy: "[Concept('trait','rys')|EU] [GetTrait('scarred').GetName( GetNullCharacter )|l] poskytuje @piety_icon![Concept('piety','zbožnost')|E] a [Concept('opinion','mínění')|E] u věřících"
