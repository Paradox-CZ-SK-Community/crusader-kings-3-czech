 tenet_acts_of_apostles_latin_desc: "Stejně jako Mojžíš směle stanul před faraonem a zvěstoval mu Tvůj úkol, i naši misionáři předstupují před ostatní.\n\n$pam_acts_1_8_latin$\n\n[Glossary('Actus Apostolorum Historical Background','tenet_acts_of_apostles_historical_desc')]" # todo: NEW TRANSLATION
 tenet_acts_of_apostles_greek_desc: "Vrátím Ti Tvůj lid, Tvůj dar, který jsi mi dal. Veď je svou mocnou pravicí a chraň je ve stínu svých křídel.\n\n$pam_acts_1_8_greek$\n\n[Glossary('Práxeis tõn Apostólōn Historical Background','tenet_acts_of_apostles_historical_desc')]" # todo: NEW TRANSLATION
 tenet_acts_of_apostles_default_desc: "Přinášejte nebeské světlo těm, kdo žijí v temnotě, a naději těm, kdo propadli zoufalství.\n\n$pam_acts_1_8_default$\n\n[Glossary('Fervent Proselytism Historical Background','tenet_acts_of_apostles_historical_desc')]" # todo: NEW TRANSLATION
 tenet_acts_of_apostles_historical_desc: "Křesťanství se v prvních stoletích našeho letopočtu rychle šířilo, z velké části díky misionářskému úsilí apoštolů a prvních učedníků. Jejich cesty vedly napříč Římskou říší, kde zakládali křesťanské obce a obraceli na víru lidi z různých prostředí. Horlivost při šíření víry pohánělo hluboké přesvědčení o poselství spásy skrze Ježíše Krista, díky němuž se křesťanství z malé židovské sekty stalo významným světovým náboženstvím.\n\nVe středověku se na misijní cesty do pohanských zemí vydala řada budoucích světců a mučedníků, kteří neúnavně šířili křesťanskou víru." # todo: NEW TRANSLATION
 doctrine_parameter_tenet_acts_of_apostles_laamp_missionary_bonus: "Mírnější požadavky pro [decision|E] [GetDecisionWithKey('zealous_missionary_prep_decision').GetName], kterou bude přijímat více [adventurers|E]" # todo: NEW TRANSLATION
 doctrine_parameter_tenet_acts_of_apostles_legitimacy_from_converts: "Konverze [characters|E] uděluje #P 50#! @legitimacy_icon!; konverze [county|E] vaším [court_chaplain|E] uděluje #P 100#! @legitimacy_icon! a #P 5#! @spiritual_fulfillment_icon!" # todo: NEW TRANSLATION
