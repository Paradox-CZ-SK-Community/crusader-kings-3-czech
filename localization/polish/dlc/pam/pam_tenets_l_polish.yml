 pam_luke_5_16_default_short: "[Glossary('On pak odcházel na pouště, a modlil se.','LUKE_5_16_GLOSS')]"
 pam_luke_1_42_english: "I zvolala hlasem velikým a řekla: Požehnaná ty mezi ženami, a požehnaný plod života tvého."
 pam_luke_1_79_english: "Aby se ukázal sedícím v temnostech a v stínu smrti, k spravení noh našich na cestu pokoje."
 pam_colossians_3_15_english: "A pokoj Boží vítěziž v srdcích vašich, k němuž i povoláni jste v jedno tělo; a buďtež vděčni."
 pam_matthew_5_9_english: "Blahoslavení pokojní, nebo oni synové Boží slouti budou."
 pam_philippians_4_21_english: "Pozdravtež všech svatých v Kristu Ježíši. Pozdravujíť vás bratří, kteříž jsou se mnou."
 pam_hebrews_12_1_english: "Protož i my, takový oblak svědků vůkol majíce, odvrhouce všeliké břímě, i snadně obkličující nás hřích, skrze trpělivost konejme běh uloženého nám boje,"
 pam_acts_7_59_english: "I kamenovali Štěpána vzývajícího Boha a řkoucího: Pane Ježíši, přijmi ducha mého."
 pam_luke_22_19_english: "A vzav chléb, díky činiv, lámal a dal jim, řka: To jest tělo mé, kteréž se za vás dává. To čiňte na mou památku."
 pam_1_corinthians_1_10_english: "Prosímť vás pak, bratří, skrze jméno Pána našeho Jezukrista, abyste jednostejně mluvili všickni a aby nebylo mezi vámi roztržek, ale buďte spojeni jednostejnou myslí a jednostejným smyslem."
 pam_1_corinthians_10_16_english: "Kalich dobrořečení, kterémuž dobrořečíme, zdaliž není společnost krve Kristovy? A chléb, kterýž lámeme, zdaliž není společnost těla Kristova?"
 pam_1_corinthians_10_17_english: "Nebo jeden chléb, jedno tělo mnozí jsme; všickni zajisté z jednoho chleba jíme."
 pam_john_6_41_english: "I reptali Židé na něho, že řekl: Já jsem chléb, kterýž jsem s nebe sstoupil."
 pam_1_thessalonians_5_16_20_english: "Vždycky se radujte, Bez přestání se modlte, Ze všeho díky čiňte; nebo ta jest vůle Boží v Kristu Ježíši, aby se tak dálo od vás. Ducha neuhašujte, Proroctvím nepohrdejte,"
 pam_1_thessalonians_4_11_english: "A snažili se pokojni býti a hleděti toho, což komu náleží, a pracovati rukama svýma vlastníma, jakož jsme přikázali vám,"
 pam_proverbs_6_6_english: "Jdi k mravenci, lenochu, shlédni cesty jeho, a nabuď moudrosti."
 pam_john_19_26_27_english: "Tedy Ježíš uzřev matku a učedlníka tu stojícího, kteréhož miloval, řekl k matce své: Ženo, aj, syn tvůj. Potom řekl učedlníkovi: Aj, matka tvá. A od té hodiny přijal ji učedlník ten k sobě."
 pam_isaiah_7_14_english: "Protož sám Pán dá vám znamení: Aj, panna počne, a porodí syna, a nazůve jméno jeho Immanuel."
 pam_proverbs_31_20_english: "Ruku svou otvírá chudému, a ruce své vztahuje k nuznému."
 pam_revelation_12_1_english: "I ukázal se div veliký na nebi: Žena oděná sluncem, pod jejímiž nohama byl měsíc a na jejíž hlavě byla koruna dvanácti hvězd."
 pam_acts_8_18_english: "I uzřev Šimon, že skrze vzkládání rukou apoštolských dává se Duch svatý, přinesl jim peníze,"
 pam_proverbs_21_20_english: "Poklad žádostivý a olej jest v příbytku moudrého, bláznivý pak člověk zžírá jej."
 pam_luke_16_11_english: "Poněvadž tedy v mamoně nepravé věrní jste nebyli, spravedlivého zboží kdo vám svěří?"
 pam_john_10_30_english: "Já a Otec jedno jsme."
 pam_john_1_1_english: "Na počátku bylo Slovo, a to Slovo bylo u Boha, a to Slovo byl Bůh."
 pam_hebrews_1_3_english: "Kterýžto jsa blesk slávy, a obraz osoby jeho, a zdržuje všecko slovem mocnosti své, očištění hříchů našich skrze sebe samého učiniv, posadil se na pravici velebnosti na výsostech,"
 pam_acts_1_8_english: "Ale přijmete moc Ducha svatého, přicházejícího na vás, a budete mi svědkové, i v Jeruzalémě, i ve všem Judstvu, i v Samaří, a až do posledních končin země."
 pam_acts_2_4_english: "I naplněni jsou všickni Duchem svatým, a počali mluviti jinými jazyky, jakž ten Duch dával jim vymlouvati."
 pam_acts_2_38_english: "Tedy Petr řekl k nim: Pokání čiňte, a pokřti se jeden každý z vás ve jménu Ježíše Krista na odpuštění hříchů a přijmete dar Ducha svatého."
 pam_2_macabees_12_44_english: "Kdyby totiž nebyl měl naděje, že padlí vstanou, bylo by se domnívati, že bylo zbytečno a neužitečno modliti se za mrtvé."
 pam_matthew_12_25_english: "Ježíš pak znaje myšlení jejich, dí jim: Každé království rozdělené samo v sobě zpustne, a každé město neb dům proti sobě rozdělený nestane."
 pam_matthew_12_32_english: "A kdyby kdo řekl slovo proti Synu člověka, bude jemu odpuštěno, ale kdož by mluvil proti Duchu svatému, nebude jemu odpuštěno, ani na tomto světě, ani na budoucím."
 pam_hebrews_12_29_english: "Neboť Bůh náš jest oheň spalující."
 pam_genesis_1_28_english: "A požehnal jim Bůh, a řekl jim Bůh: Ploďtež se a rozmnožujte se, a naplňte zemi, a podmaňte ji, a panujte nad rybami mořskými, a nad ptactvem nebeským, i nad všelikým živočichem hýbajícím se na zemi."
 pam_matthew_19_5_english: "A řekl: Protož opustí člověk otce i matku, a připojí se k manželce své, i budou dva jedno tělo."
 pam_ephesians_4_3_6_english: "Usilujíce zachovávati jednotu Ducha v svazku pokoje. Jedno jest tělo, a jeden Duch, jakož i povoláni jste v jedné naději povolání vašeho. Jeden Pán, jedna víra, jeden křest, Jeden Bůh a Otec všech, kterýž jest nade všecko, a skrze všecko, i ve všech vás."
 pam_ephesians_5_25_english: "Muži milujte ženy své, jako i Kristus miloval církev, a vydal sebe samého za ni,"
 pam_matthew_16_18_english: "I jáť pravím tobě, že jsi ty Petr, a na téť skále vzdělám církev svou, a brány pekelné nepřemohou jí."
 pam_2_timothy_2_2_english: "A což jsi slyšel ode mne před mnohými svědky, svěřujž to lidem věrným, kteříž by způsobní byli i jiné učiti."
 pam_titus_1_5_english: "Z té příčiny zanechal jsem tebe v Krétě, abys to, čehož tam ještě potřebí, spravil a ustanovil po městech starší, jakož i já při tobě jsem zřídil:"
 pam_james_5_16_english: "Vyznávejtež se pak jedni druhým z hříchů svých, a modlte se jedni za druhé, abyste uzdraveni byli. Mnohoť zajisté může modlitba spravedlivého opravdová."
 pam_1_john_1_9_english: "Jestliže pak budeme vyznávati hříchy své, věrnýť jest Bůh a spravedlivý, aby nám odpustil hříchy, a očistil nás od všeliké nepravosti."
 pam_john_20_23_english: "Kterýmžkoli odpustili byste hříchy, odpouštějíť se jim; a kterýmžkoli zadrželi byste je, zadržániť jsou."
 pam_romans_5_12_english: "A protož jakož skrze jednoho člověka hřích na svět všel a skrze hřích smrt, a tak na všecky lidi smrt přišla, v němž všickni zhřešili."
 pam_psalm_51_5_english: "Aj, v nepravosti zplozen jsem, a v hříchu počala mne matka má."
 pam_genesis_3_6_english: "Viduci tedy žena, že dobrý jest strom k jídlu i příjemný očima, a k nabytí rozumnosti strom žádostivý, vzala z ovoce jeho a jedla; dala také i muži svému s sebou, a on jedl."
 pam_hebrews_1_14_english: "Zdaliž všickni nejsou služební duchové, kteříž posíláni bývají k službě pro ty, jenž mají dědičně obdržeti spasení?"
 pam_psalm_91_11_english: "Nebo andělům svým přikázal o tobě, aby tě ostříhali na všech cestách tvých."
 pam_matthew_18_10_english: "Viztež, abyste nepotupovali ani jednoho z maličkých těchto. Neboť pravím vám, že andělé jejich v nebesích vždycky vidí tvář Otce mého, kterýž v nebesích jest."
 pam_ephesians_6_11_english: "Oblecte se v celé odění Boží, abyste mohli státi proti útokům ďábelským."
 pam_2_timothy_2_3_english: "A tak ty snášej protivenství, jako ctný rytíř Ježíše Krista."
 pam_1_timothy_6_12_english: "Bojuj ten dobrý boj víry, dosáhni věčného života, k němuž i povolán jsi, a vyznals dobré vyznání před mnohými svědky."
 pam_proverbs_1_7_english: "Bázeň Hospodinova jest počátek umění, moudrostí a cvičením pohrdají blázni."
 pam_colossians_2_3_english: "V němžto jsou skryti všickni pokladové moudrosti a známosti."
 pam_james_1_5_english: "Jestliže pak komu z vás nedostává se moudrosti, žádejž jí od Boha, kterýž všechněm dává ochotně a neomlouvá; i budeť jemu dána."
 pam_1_corinthians_1_30_english: "Vy pak jste z něho v Kristu Ježíši, kterýž učiněn jest nám moudrost od Boha, i spravedlnost, i posvěcení, i #vykoupení,"
 pam_mark_1_11_english: "A hlas stal se s nebe: Ty jsi ten můj milý Syn, v němž mi se dobře zalíbilo."
 pam_romans_1_4_english: "Kterýž prokázán jest býti Synem Božím mocně, podle Ducha posvěcení, skrze z mrtvých vstání,) totiž o Ježíši Kristu, Pánu našem,"
 pam_acts_13_33_english: "Jakož i v druhém Žalmu napsáno jest: Syn můj jsi ty, já dnes zplodil jsem tebe."
 pam_matthew_22_39_english: "Druhé pak jest podobné tomu: Milovati budeš bližního svého jako sebe samého."
 pam_luke_10_27_english: "A on odpověděv, řekl: Milovati budeš Pána Boha svého ze všeho srdce svého, a ze vší duše své, a ze vší síly své, i ze vší mysli své, a bližního svého jako sebe samého."
 pam_galatians_5_14_english: "Nebo všecken Zákon v jednom slovu se zavírá, totiž v tom: Milovati budeš bližního svého jako sebe samého."
 pam_isaiah_6_3_english: "A volal jeden k druhému, říkaje: Svatý, svatý, svatý Hospodin zástupů, plná jest všecka země slávy jeho."
 pam_psalm_134_2_english: "Pozdvihujte rukou svých k svatyni, a dobrořečte Hospodinu, říkajíce:"
 pam_malachi_1_11_english: "Nebo od východu slunce až na západ jeho veliké bude jméno mé mezi národy, a na všelikém místě kadění přinášíno bude jménu mému, a obět čistá. Veliké zajisté jméno mé bude mezi národy, praví Hospodin zástupů,"
 pam_exodus_20_4_english: "Neučiníš sobě rytiny, ani jakého podobenství těch věcí, kteréž jsou na nebi svrchu, ani těch, kteréž na zemi dole, ani těch, kteréž u vodách pod zemí."
 pam_matthew_16_24_english: "Tedy řekl Ježíš učedlníkům svým: Chce-li kdo za mnou přijíti, zapřiž sebe sám, a vezmi kříž svůj, a následujž mne."
 pam_1_peter_2_9_english: "Ale vy jste rod vyvolený, královské kněžstvo, národ svatý, lid dobytý, abyste zvěstovali ctnosti toho, kterýž vás povolal ze tmy v předivné světlo své."
 pam_2_timothy_4_7_english: "Boj výborný bojoval jsem, běh jsem dokonal, víru jsem zachoval."
 pam_tobit_8_7_english: "Nyní si tuto svou příbuznou neberu z chlípnosti, nýbrž z čistého úmyslu. Smiluj se nade mnou i nad ní a dej nám společně se dožít stáří. Požehnej nám dětmi."
 pam_1_corinthians_2_7_english: "Ale mluvíme moudrost Boží v tajemství, kterážto skryta jest, kterouž Bůh předuložil před věky k slávě naší,"
 pam_matthew_10_9_english: "Neshromažďujte zlata ani stříbra, ani peněz v opascích vašich mívejte,"
 pam_matthew_18_20_english: "Nebo kdežkoli shromáždí se dva nebo tři ve jménu mém, tuť jsem já uprostřed nich."
 pam_hebrews_11_1_english: "Víra pak jest nadějných věcí podstata, a důvod neviditelných."
 pam_psalm_46_10_english: "Mluvě: Upokojtež se, a vězte, žeť jsem já Bůh, kterýž vyvýšen budu mezi národy, vyvýšen budu na zemi."
 pam_matthew_6_6_english: "Ale ty když bys se modliti chtěl, vejdi do pokojíka svého, a zavra dveře své, modliž se Otci svému, jenž jest v skrytě, a Otec tvůj, kterýž vidí v skrytě, odplatí tobě zjevně."
 pam_1_kings_19_12_english: "A za třesením oheň, ale nebyl v ohni Hospodin. A za ohněm hlas tichý a temný."
 pam_matthew_4_1_2_english: "Tehdy Ježíš veden jest na poušť od Ducha, aby pokoušín byl od ďábla. A postiv se čtyřidceti dnů a čtyřidceti nocí, potom zlačněl."
 pam_hebrews_11_38_english: "Jichžto nebyl svět hoden, po pustinách bloudíce, i po horách, a jeskyních, i v doupatech země."
 pam_luke_5_16_english: "On pak odcházel na pouště, a modlil se."
 pam_1_corinthians_9_27_english: "Ale podmaňuji tělo své a v službu podrobuji, abych snad jiným káže, sám nebyl nešlechetný."
 pam_galatians_5_24_english: "Nebo kteříž jsou Kristovi, tiť jsou tělo své ukřižovali s vášněmi a s žádostmi."
 pam_romans_8_13_english: "Nebo budete-li podle těla živi, zemřete; pakli byste Duchem skutky těla mrtvili, živi budete."
 pam_john_3_5_english: "Odpověděl Ježíš: Amen, amen pravím tobě: Nenarodí-li se kdo z vody a z Ducha svatého, nemůž vjíti do království Božího."
 pam_acts_10_38_english: "Kterak Ježíše od Nazaréta pomazal Bůh Duchem svatým a mocí; kterýžto chodil, dobře čině, a uzdravuje všecky posedlé od ďábla; nebo Bůh s ním byl."
 pam_2_corinthians_1_21_22_english: "Ten pak, kterýž potvrzuje nás s vámi v Kristu, a kterýž pomazal nás, Bůh jest. Kterýž i znamenal nás, a dal závdavek Ducha svatého v srdce naše."
 pam_galatians_6_14_english: "Ale ode mne odstup to, ať abych se v čem chlubil, jediné v kříži Pána našeho Jezukrista, skrze něhož jest mi svět ukřižován, a já světu."
 pam_1_corinthians_1_18_english: "Nebo slovo kříže těm, kteříž hynou, bláznovstvím jest, ale nám, kteříž spasení dosahujeme, moc Boží jest."
 pam_isaiah_19_19_english: "V ten den bude oltář Hospodinův u prostřed země Egyptské, a sloup při pomezí jejím Hospodinu;"
 pam_john_1_14_english: "A Slovo to tělo učiněno jest, a přebývalo mezi námi, (a viděli jsme slávu jeho, slávu jakožto jednorozeného od Otce,) plné milosti a pravdy."
 pam_colossians_2_9_english: "Nebo v něm přebývá všecka plnost Božství tělesně."
 pam_philippians_2_6_7_english: "Kterýž jsa v způsobu Božím, nepoložil sobě toho za loupež rovný býti Bohu, Ale samého sebe zmařil, způsob služebníka přijav, podobný lidem učiněn."
 pam_matthew_25_40_english: "A odpovídaje Král, dí jim: Amen pravím vám: Cožkoli jste činili jednomu z bratří těchto mých nejmenších, mně jste učinili."
 pam_psalm_24_1_english: "Hospodinova jest země, a plnost její, okršlek země, i ti, kteříž obývají na něm."
 pam_2_timothy_3_16_english: "Všeliké zajisté Písmo od Boha jest vdechnuté, a užitečné k učení, k trestání, k napravování, k správě, kteráž náleží k spravedlnosti,"
 pam_romans_2_13_english: "(Nebo ne ti, jenž slyší Zákon, spravedlivi jsou před Bohem, ale činitelé Zákona spravedlivi budou."
 pam_matthew_18_18_english: "Amen pravím vám: Cožkoli svížete na zemi, budeť svázáno i na nebi; a cožkoli rozvížete na zemi, budeť rozvázáno i na nebi."
 pam_acts_4_32_english: "Toho pak množství věřících bylo jedno srdce a jedna duše. Aniž kdo co z těch věcí, kteréž měl, svým vlastním býti pravil, ale měli všecky věci obecné."
 pam_hebrews_13_2_english: "Na přívětivost k hostem nezapomínejte; skrze ni zajisté někteří, nevěděvše, anděly za hostě přijímali."
 pam_psalm_150_3_4_english: "Chvalte jej zvukem trouby, chvalte jej na loutnu a citaru. Chvalte jej na buben a píšťalu, chvalte jej na husle a varhany."
 pam_1_corinthians_9_22_english: "Učiněn jsem mdlým jako mdlý, abych mdlé získal. Všechněm všecko jsem učiněn, abych vždy některé k spasení přivedl."
 pam_matthew_2_2_english: "Řkouce: Kde jest ten, kterýž se narodil Král Židovský? Nebo viděli jsme hvězdu jeho na východu slunce, a přijeli jsme klaněti se jemu."
 pam_psalm_144_1_english: "Požehnaný Hospodin skála má, kterýž učí ruce mé boji, a prsty mé bitvě."
 pam_genesis_2_25_english: "Byli pak oba dva nazí, Adam i žena jeho, a nestyděli se."
 pam_jeremiah_1_5_english: "Dříve než jsem tě sformoval v životě, znal jsem tebe, a dříve nežlis vyšel z života, posvětil jsem tě, za proroka národům dal jsem tebe."
 pam_psalm_127_3_english: "Aj, dědictví od Hospodina jsou dítky, a plod života jest mzda."
 pam_ecclesiastes_8_15_english: "A tak chválil jsem veselí, proto že nic nemá lepšího člověk pod sluncem, jediné aby jedl a pil, a veselil se, a že to pozůstává jemu z práce jeho ve dnech života jeho, kteréž dal jemu Bůh pod sluncem."
 pam_psalm_2_8_english: "Požádej mne, a dámť národy, dědictví tvé, a končiny země, vládařství tvé."
 pam_2_kings_5_18_19_english: "V této však věci odpusť Hospodin služebníku tvému: Když vchází pán můj do chrámu Remmon, aby se tam modlil, a on podpírá se na mou ruku, že i já skláním se v chrámě Remmon. Toho sklánění mého v chrámě Remmon nechť neváží, prosím, Hospodin služebníku tvému při té věci. I řekl jemu: Jdi v pokoji. A když odjel od něho nedaleko,"
