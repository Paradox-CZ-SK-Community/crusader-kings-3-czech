 tenet_scholasticism_modifier_desc: "Hledání poznání je formou uctívání, neboť porozuměním stvoření se přibližujeme porozumění Stvořiteli."
 pam_tenet_scholasticism_toast_title: "$tenet_scholasticism_default_name$"
 pam_tenet_scholasticism_studium_toast_title: "Putovní studium"
 pam_tenet_scholasticism_studium_toast_desc: "[pam_studium_scholar.GetTitledFirstName|U] s tebou během poslední části cesty [Select_CString(pam_studium_scholar.IsFemale,'probírala','probíral')] danou otázku a někde mezi jedním [Concept('barony','baronstvím')|E] a druhým se [Select_CString(pam_studium_scholar.IsFemale,'rozhodla','rozhodl')] pokračovat v ní písemně"
