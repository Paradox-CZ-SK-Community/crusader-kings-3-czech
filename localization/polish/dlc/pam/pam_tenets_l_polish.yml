 tenet_celestial_hierarchy_latin_name: "Hierarchia Caelestis"
 tenet_celestial_hierarchy_greek_name: "Ouranía Hierarkhía"
 tenet_celestial_hierarchy_default_name: "Nebeská hierarchie"
 tenet_celestial_hierarchy_name: "$tenet_celestial_hierarchy_default_name$"
 tenet_celestial_hierarchy_latin_desc: "Svatí andělé, obklopte můj trůn a rodinu. Nebeský Otče, nechť Tví andělé umlčí všechny hlasy odsouzení a strachu, které se proti mně pozvedají, a nechť rychle přenesou mé modlitby k Tvému trůnu.\n\n$pam_hebrews_1_14_latin$"
 tenet_celestial_hierarchy_latin_historical_glossary: "[Glossary('Hierarchia Caelestis','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_greek_desc: "Buď strážným andělem, moudrým rádcem a společníkem křesťanského lidu a přinášej mu osvícení, sílu, radost, pokoj a útěchu.\n\n$pam_hebrews_1_14_greek$"
 tenet_celestial_hierarchy_greek_historical_glossary: "[Glossary('Ouranía Hierarkhía','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_default_desc: "Andělé jsou uspořádáni do devíti řádů, od serafínů až po prosté anděly. Každý z nich slouží Bohu v jemu určené úloze a pomáhá lidstvu.\n\n$pam_hebrews_1_14_default$"
 tenet_celestial_hierarchy_default_historical_glossary: "[Glossary('Nebeská hierarchie','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_historical_desc: "Pojem nebeské hierarchie systematizoval Pseudo-Dionysios Areopagita v 5. či 6. století ve svém díle „De Coelesti Hierarchia“. Rozdělil anděly do tří triád: nejvyšší tvoří serafíni, cherubíni a trůnové; prostřední panstva, síly a mocnosti; nejnižší knížectva, archandělé a andělé.\n\nTato hierarchie hluboce ovlivnila středověkou křesťanskou teologii a přijalo ji východní i západní křesťanství. Tomáš Akvinský začlenil tuto angelologii do své Teologické sumy a ovlivnila také umělecká znázornění nebe po celý středověk."
 doctrine_parameter_tenet_celestial_hierarchy_sp_from_court_position: "Jmenování držitele [Concept('court_positions','dvorského úřadu')|E] s vysokou [Concept('aptitude','způsobilostí')|E] přináší #P 3#! @spiritual_fulfillment_icon![Concept('spiritual_fulfillment','duchovního naplnění')|E]; propuštění nebo odvolání kteréhokoli držitele stojí #N 3#!"
 pam_celestial_hierarchy_hire_sp_toast: "Osobní zásada [GetTenetType('tenet_celestial_hierarchy').GetName( GetPlayer.GetRite )|l]"
 doctrine_parameter_tenet_celestial_hierarchy_court_aptitude_bonus: "Držitelé [Concept('court_positions','dvorských úřadů')|E] vyznávající [Concept('faith','víru')|E] svého [Concept('liege','lenního pána')|E] získávají [Concept('aptitude','způsobilost')|E] podle své [Concept('piety_level','úrovně oddanosti')|E]"
 doctrine_parameter_tenet_celestial_hierarchy_clergy_acceptance: "[Concept('clergy','duchovenstvo')|EU] získává #P +20#! k přijetí [Concept('interaction','interakce')|E] při jednání se světskými [Concept('rulers','vládci')|E]"
 doctrine_parameter_tenet_celestial_hierarchy_religious_relations_bonus: "[Concept('councillor_task','úkol rádce')|EU] [Concept('religious_relations','náboženské vztahy')|E] je o #P [EmptyScope.ScriptValue('celestial_hierarchy_religious_relations_percentage_loc')] %#! účinnější"
 doctrine_parameter_tenet_celestial_hierarchy_interaction_acceptance: "Ochota přijmout [Concept('interaction','interakci')|E] mezi postavami stejné [Concept('faith','víry')|E] se mění o #P +10#! za každou [Concept('piety_level','úroveň oddanosti')|E] nad úrovní cíle a o #N -10#! za každou úroveň pod ní"
 CELESTIAL_HIERARCHY_CLERGY_ACCEPTANCE_REASON: "[Concept('clergy','duchovenstvo')|EU] jednající se světským [Concept('ruler','vládcem')|E]: $VALUE|=+0$"
