 pam_mortification_flagellant_gain_toast: "Za tvou zásadu [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )|l]: [Select_CString(GetPlayer.IsFemale,'přijala','přijal')] jsi cestu sebemrskačství a získáváš rys [GetTrait('flagellant').GetName( GetPlayer.Self )|El]"
 pam_mortification_holy_scars_toast: "Za tvou zásadu [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )|l]: bič zanechal na tvém těle svaté jizvy"
 pam_mortification_suffering_sanctifies_toast: "Za tvou zásadu [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )|l]: obětuješ Bohu utrpení svého těla"
 tenet_mortification_of_the_flesh_historical_desc: "Umrtvování těla, zakořeněné ve výzvě svatého Pavla #weak usmrcovat skutky těla#! (Římanům 8:13) a #weak trestat své tělo a podrobovat si je#! (1. Korintským 9:27), bylo ústřední součástí křesťanské askeze již od nejranějších staletí. Mezi jeho nejzazšími praktikanty byli sloupovníci: svatý Simeon Starší strávil 37 let na sloupu nedaleko Aleppa v neustálé modlitbě, snášel žár i mrazivý chlad.\n\nSebemrskačství se rozšířilo ve středověkém západním křesťanství a mezi duchovními je prosazoval svatý Petr Damián (1007–1072). Hnutí flagelantů ve 13. a 14. století přivedlo laiky do ulic měst, kde se v dobách moru a pohrom bičovali na znamení pokání."
 tenet_holy_myron_ethiopic_name: "Qeddus Meron"
 tenet_holy_myron_latin_name: "Sanctum Chrisma"
 tenet_holy_myron_greek_name: "Hágion Mýron"
 tenet_holy_myron_default_name: "Svaté myron"
 tenet_holy_myron_name: "$tenet_holy_myron_default_name$"
 tenet_holy_myron_ethiopic_desc: "Posvátným meronem, který vysvětil Abuna, přijímají věřící pečeť Ducha svatého. Jako sestoupila holubice na Krista při Jeho křtu v Jordánu, sestupuje skrze toto svaté pomazání Duch i na nově pokřtěné a označuje je za Boží děti.\n\n$pam_john_3_5_default$"
 tenet_holy_myron_ethiopic_historical_glossary: "[Glossary('Qeddus Meron','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_latin_desc: "Skrze posvátné křižmo, vysvěcené biskupem, přijímají věřící pečeť daru Ducha svatého. Pomazání završuje milost křtu.\n\n$pam_john_3_5_latin$"
 tenet_holy_myron_latin_historical_glossary: "[Glossary('Sanctum Chrisma','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_greek_desc: "Svaté myron, vysvěcené patriarchou, je pečetí daru Ducha svatého. Skrze toto posvátné pomazání přijímají nově osvícení plnost darů Ducha a stávají se chrámy živého Boha.\n\n$pam_john_3_5_greek$"
 tenet_holy_myron_greek_historical_glossary: "[Glossary('Hágion Mýron','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_default_desc: "Svaté myron neboli posvátné křižmo je zvlášť vysvěcený olej, který se používá při svátosti biřmování, aby nově pokřtěné zpečetil darem Ducha svatého a završil jejich uvedení do církve.\n\n$pam_john_3_5_default$"
 tenet_holy_myron_default_historical_glossary: "[Glossary('Svaté myron','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_historical_desc: "Svaté myron, z řeckého #weak mýron#!, což znamená vonný olej, se používá při svátosti myropomazání neboli biřmování. Na Východě následuje bezprostředně po křtu, a to i u nemluvňat; na Západě se uděluje samostatně biskupem. Pomazání má hluboké biblické kořeny: jak #weak Kristus#!, tak #weak Mesiáš#! znamenají #weak Pomazaný#!.\n\nVysvěcení nového myronu je vzácnou a slavnostní událostí: do nové dávky se vždy přidává část předchozí, čímž se zachovává nepřerušený řetězec, který má údajně sahat až k apoštolům. Etiopská tradice tvrdí, že recept na #weak Meron#! přinesli Devět svatých, syrští misionáři z 5. století, a jeho vysvěcení vyhrazuje patriarchovi, Abunovi."
 doctrine_parameter_tenet_holy_myron_artifact: "Lze vyslat [Concept('court_chaplain','dvorního kaplana')|E], aby vytvořil [Concept('artifact','artefakt')|E] #V Svaté myron#! pomocí [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('pam_prepare_holy_myron_decision').GetName|l]; jeho náplně se spotřebovávají při žehnání [Concept('artifacts','artefaktům')|E][AddLocalizationIf( HasDlcFeature( 'coronations' ), 'pam_holy_myron_param_coronation_append')][AddLocalizationIf( HasDlcFeature( 'legends_of_the_dead' ), 'pam_holy_myron_param_funeral_append')]"
 pam_holy_myron_param_coronation_append: ", tvé [Concept('coronation','korunovaci')|E]"
 pam_holy_myron_param_funeral_append: " a zesnulým při [Concept('funerals','pohřbech')|E]"
 doctrine_parameter_tenet_holy_myron_artifact_interaction_unlock: "Lze darovat náplně tvého [Concept('artifact','artefaktu')|E] #V Svaté myron#! jiným vládcům, za což získáš @piety_icon![Concept('piety','zbožnost')|E] a [Concept('opinion','mínění')|E]"
 doctrine_parameter_tenet_holy_myron_chrismation_bonus: "Tvé novorozené děti získají [Concept('modifier','modifikátor')|E] [GetModifier('pam_chrismated_child_modifier').GetNameWithTooltip|l] na #V 16#! let; náplň [Concept('artifact','artefaktu')|E] #V Svatého myronu#! poskytne [Concept('modifier','modifikátor')|E] [GetModifier('pam_myron_chrismated_child_modifier').GetNameWithTooltip|l] natrvalo"
 doctrine_parameter_tenet_holy_myron_unction_bonus: "Při [Concept('ill','nemoci')|E]: zisk @spiritual_fulfillment_icon![Concept('spiritual_fulfillment','duchovního naplnění')|E], úbytek [Concept('stress','stresu')|E] a [Concept('modifier','modifikátor')|E] [GetModifier('pam_anointed_with_holy_oil_modifier').GetNameWithTooltip|l] na #V 2#! roky"
 tenet_khachkar_armenian_name: "Chačkar"
 tenet_khachkar_latin_name: "Crux Lapidea"
 tenet_khachkar_greek_name: "Líthinos Staurós"
 tenet_khachkar_default_name: "Chačkary"
 tenet_khachkar_name: "$tenet_khachkar_default_name$"
 tenet_khachkar_armenian_desc: "Chačkary stojí jako věční svědkové naší víry. Zdobené složitými rytinami křížů, vinné révy a posvátných symbolů jsou modlitbou vytesanou do kamene a oslavují Kříž, skrze nějž byl svět spasen.\n\n$pam_galatians_6_14_default$"
 tenet_khachkar_armenian_historical_glossary: "[Glossary('Chačkar','tenet_khachkar_historical_desc')]"
 tenet_khachkar_latin_desc: "Jako Arméni vztyčují své kamenné kříže k nebi, označme i my tuto zemi symboly spásy, Křížem našeho Pána Ježíše Krista.\n\n$pam_galatians_6_14_latin$"
 tenet_khachkar_latin_historical_glossary: "[Glossary('Crux Lapidea','tenet_khachkar_historical_desc')]"
 tenet_khachkar_greek_desc: "Kamenné památníky vytesané s posvátnými symboly dosvědčují Kristovo vítězství a navždy připomínají věřící.\n\n$pam_galatians_6_14_greek$"
 tenet_khachkar_greek_historical_glossary: "[Glossary('Líthinos Staurós','tenet_khachkar_historical_desc')]"
 tenet_khachkar_default_desc: "Kamenné kříže zdobené složitými náboženskými výjevy slouží jako posvátné památníky, označují svatá místa, připomínají zesnulé a oslavují Boží prozřetelnost.\n\n$pam_galatians_6_14_default$"
 tenet_khachkar_default_historical_glossary: "[Glossary('Chačkary','tenet_khachkar_historical_desc')]"
 tenet_khachkar_historical_desc: "Chačkary, z arménského #weak chač#! (kříž) a #weak k'ar#! (kámen), jsou složitě zdobené kamenné stély s křížem, často umístěným na rozetě či kole věčnosti. Jsou jedinečným prvkem arménské křesťanské kultury, označují svatá místa, připomínají události a vítězství a slouží jako památníky zesnulým.\n\nTato tradice vznikla v 9. století z dřevěných křížů, které svatý Řehoř Osvětitel vztyčoval nad pohanskými chrámy po obrácení Arménie na křesťanství roku 301. Vrcholu dosáhla ve 12. a 13. století za knížat Zakaridů. Každý chačkar je jedinečným dílem mistrů řezbářů, jako byl Momik z Noravanku, a některé z nich, o nichž se věřilo, že mají zázračnou moc, se staly cílem poutí."
