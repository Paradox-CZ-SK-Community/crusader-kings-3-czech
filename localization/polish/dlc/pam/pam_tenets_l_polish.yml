 tenet_simony_name: "$tenet_simony_default_name$" # todo: NEW TRANSLATION
 tenet_simony_latin_desc: "Bůh stvořil zlato pod zemí a daroval nám je jako přízeň svým vyvoleným.\n\n$pam_proverbs_21_20_latin$\n\n[Glossary('Simonia Historical Background','tenet_simony_historical_desc')]" # todo: NEW TRANSLATION
 tenet_simony_greek_desc: "Bůh stvořil zlato pod zemí a daroval nám je jako přízeň svým vyvoleným.\n\n$pam_proverbs_21_20_greek$\n\n[Glossary('Simōnía Historical Background','tenet_simony_historical_desc')]" # todo: NEW TRANSLATION
 tenet_simony_default_desc: "Bůh stvořil zlato pod zemí a daroval nám je jako přízeň svým vyvoleným.\n\n$pam_proverbs_21_20_english$\n\n[Glossary('Simony Historical Background','tenet_simony_historical_desc')]" # todo: NEW TRANSLATION
 tenet_simony_historical_desc: "Praxe prodávání církevních úřadů, relikvií a obřadů. Je pojmenována po Šimonu Mágovi, Samařanovi, který #weak očarovával#! lidi a nabízel apoštolům peníze za křest.\n\nŘada synod, od synody v Elvíře roku 305 n. l. až po Tridentský koncil roku 1545, simonii horlivě odsuzovala a ukládala za ni přísné duchovní i světské tresty. Pokud je nějaká praxe tolikrát odsuzována po tolik staletí, znamená to, že byla poměrně rozšířená. Kritizoval ji také Martin Luther ve své 95. tezi a Dante v 19. zpěvu Pekla: #weak Chamtivci, kteří berou Boží věci, jež mají být nevěstami Spravedlnosti, a nutí je smilnit za zlato a stříbro!#!" # todo: NEW TRANSLATION
