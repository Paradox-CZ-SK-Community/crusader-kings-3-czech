 tenet_peace_of_god_default_name: "Boží mír"
 tenet_peace_of_god_name: "$tenet_peace_of_god_default_name$"
 tenet_peace_of_god_irish_desc: "Známý také jako Zákon nevinných, stanovil pravidla, která měla zajistit bezpečí nebojujících během války. Ti, kdo tato pravidla porušili, i přihlížející, kteří zločinu nezabránili, podléhali světským pokutám a rituálním kletbám.\n\n$pam_colossians_3_15_default$"
 tenet_peace_of_god_irish_historical_glossary: "[Glossary('Cáin Adomnáin','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_latin_desc: "Od adventu až do oktávu Zjevení Páně je třeba neporušitelně dodržovat příměří a každý, kdo je poruší, má být potrestán exkomunikací.\n\n$pam_colossians_3_15_latin$"
 tenet_peace_of_god_latin_historical_glossary: "[Glossary('Pax et Treuga Dei','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_greek_desc: "Učedníci Krista, jenž všechno stvořil pro mír, mají být tvůrci míru. Kdo hledá mír, hledá Krista. Bez lásky k druhým a bez mírumilovného postoje ke všem lidem nemůže být nikdo nazýván pravým Kristovým služebníkem.\n\n$pam_colossians_3_15_greek$"
 tenet_peace_of_god_greek_historical_glossary: "[Glossary('Ekekheiría Theoũ','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_default_desc: "Nesmyslné násilí páchané na našich bratřích a sestrách je urážkou Boha."
 tenet_peace_of_god_default_historical_glossary: "[Glossary('Boží mír','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_historical_desc: "Během celého středověku se různá křesťanská hnutí snažila omezit krveprolití zavedením formálních pravidel vedení bojů. Od irského Cáin Adomnáin v 7. století po hnutí Božího míru ve Francii v 10. století se tato úsilí zaměřovala na ochranu církevního majetku a osob, omezení násilí vůči nebojujícím a omezení bojů mezi šlechtici na určitá místa a dobu.\n\nTato pravidla se často vztahovala i na nevěřící. Kánon XXI třetího lateránského koncilu z roku 1179 rozšířil pravidelná příměří na celé křesťanstvo, zatímco kánon XXVII vyzýval k pozvednutí zbraní proti katarům, Baskům a dalším kacířům."
 doctrine_parameter_tenet_peace_of_god_same_faith_war_piety_penalty: "Vyhlášení [Concept('war','války')|E] [Concept('ruler','vládci')|E] stejné [Concept('faith','víry')|E] stojí @piety_icon![Concept('piety','zbožnost')|E]"
