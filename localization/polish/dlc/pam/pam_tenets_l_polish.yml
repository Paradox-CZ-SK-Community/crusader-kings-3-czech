 doctrine_parameter_tenet_simony_paid_vows: "Lze zaplatit @gold_icon![Concept('gold','zlato')|E] a zaručit si přijetí [Concept('character_interaction','interakce s postavou')|E] #high $take_monastic_vows_interaction$#!"
 doctrine_parameter_tenet_simony_ecclesiastical_purchase: "Lze zaplatit @gold_icon![Concept('gold','zlato')|E] za církevní [Concept('titles','tituly')|E] pomocí [Concept('interaction','interakce')|E] #high $buy_ecclesiastical_title_interaction$#!"
 tenet_simony_ecclesiastical_purchase_name: "[Concept('interaction','interakce')|EU] #high $buy_ecclesiastical_title_interaction$#!"
