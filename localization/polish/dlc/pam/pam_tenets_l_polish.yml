 hesychasm_anachoresis_mortification_exclusivity_desc: "Postavy mohou mít současně pouze jeden z těchto [core_tenets|E]: [GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )], [GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetRite )], [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )], [GetTenetType('tenet_asceticism').GetName( GetPlayer.GetRite )]" # todo: NEW TRANSLATION
 tenet_anachoresis_latin_name: "Vita Eremitica" # todo: NEW TRANSLATION
 tenet_anachoresis_greek_name: "Anakhōrēsis" # todo: NEW TRANSLATION
