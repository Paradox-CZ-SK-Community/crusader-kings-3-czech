 doctrine_parameter_tenet_peace_of_god_holy_war_call_reluctance: "[Concept('rulers','vládci')|EU] tohoto [Concept('rite','ritu')|E] mnohem méně často přijímají [Concept('interaction','interakci')|E] #high $ecclesiastic_incite_holy_war_interaction$#!"
