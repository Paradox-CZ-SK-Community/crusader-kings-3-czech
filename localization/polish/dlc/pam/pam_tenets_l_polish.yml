 pam_acts_13_33_latin: "[Glossary('Quoniam Deus adimplevit filiis nostris resuscitans Jesum, sicut et in psalmo secundo scriptum est: Filius meus es tu, ego hodie genui te.','ACTS_13_33_LATIN_GLOSS')]"
 pam_matthew_22_39_latin: "[Glossary('Secundum autem simile est huic: Diliges proximum tuum, tamquam teipsum.','MATTHEW_22_39_LATIN_GLOSS')]"
 pam_luke_10_27_latin: "[Glossary('Ille respondens dixit: Diliges Dominum Deum tuum ex toto corde tuo, et ex tota anima tua, et ex omnibus viribus tuis, et ex omni mente tua: et proximum tuum sicut teipsum.','LUKE_10_27_LATIN_GLOSS')]"
 pam_galatians_5_14_latin: "[Glossary('Omnis enim lex in uno sermone impletur: Diliges proximum tuum sicut teipsum.','GALATIANS_5_14_LATIN_GLOSS')]"
 pam_isaiah_6_3_latin: "[Glossary('Et clamabant alter ad alterum, et dicebant: Sanctus, Sanctus, Sanctus, Dominus Deus exercituum, plena est omnis terra gloria ejus.','ISAIAH_6_3_LATIN_GLOSS')]"
 pam_psalm_134_2_latin: "[Glossary('In noctibus extollite manus vestras in sancta, et benedicite Dominum.','PSALM_134_2_LATIN_GLOSS')]"
 pam_malachi_1_11_latin: "[Glossary('Ab ortu enim solis usque ad occasum, magnum est nomen meum in gentibus, et in omni loco sacrificatur, et offertur nomini meo oblatio munda: quia magnum est nomen meum in gentibus, dicit Dominus exercituum.','MALACHI_1_11_LATIN_GLOSS')]"
 pam_exodus_20_4_latin: "[Glossary('Non facies tibi sculptile, neque omnem similitudinem quæ est in cælo desuper, et quæ in terra deorsum, nec eorum quae sunt in aquis sub terra.','EXODUS_20_4_LATIN_GLOSS')]"
 pam_matthew_16_24_latin: "[Glossary('Tunc Jesus dixit discipulis suis: Si quis vult post me venire, abneget semetipsum, et tollat crucem suam, et sequatur me.','MATTHEW_16_24_LATIN_GLOSS')]"
 pam_1_peter_2_9_latin: "[Glossary('Vos autem genus electum, regale sacerdotium, gens sancta, populus acquisitionis: ut virtutes annuntietis ejus qui de tenebris vos vocavit in admirabile lumen suum.','1_PETER_2_9_LATIN_GLOSS')]"
 pam_2_timothy_4_7_latin: "[Glossary('Bonum certamen certavi, cursum consummavi, fidem servavi.','2_TIMOTHY_4_7_LATIN_GLOSS')]"
 pam_tobit_8_7_latin: "[Glossary('Et nunc Domine, tu scis quia non luxuriae causa accipio sororem meam, sed sola posteritatis dilectione, in qua benedicatur nomen tuum in saecula saeculorum.','TOBIT_8_7_LATIN_GLOSS')]"
 pam_1_corinthians_2_7_latin: "[Glossary('Sed loquimur Dei sapientiam in mysterio, quæ abscondita est, quam praedestinavit Deus ante saecula in gloriam nostram.','1_CORINTHIANS_2_7_LATIN_GLOSS')]"
 pam_matthew_10_9_latin: "[Glossary('Nolite possidere aurum, neque argentum, neque pecuniam in zonis vestris.','MATTHEW_10_9_LATIN_GLOSS')]"
 pam_matthew_18_20_latin: "[Glossary('Ubi enim sunt duo vel tres congregati in nomine meo, ibi sum in medio eorum.','MATTHEW_18_20_LATIN_GLOSS')]"
