 doctrine_parameter_tenet_acts_of_apostles_head_of_rite_sway: "Váš [head_of_rite|E] získá #P +25#! k přesvědčivosti při získávání [characters|E] pro tento [rite|E]" # todo: NEW TRANSLATION
