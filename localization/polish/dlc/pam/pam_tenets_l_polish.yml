 tenet_be_fruitful_and_multiply_name: "$tenet_be_fruitful_and_multiply_default_name$" # todo: NEW TRANSLATION
 tenet_be_fruitful_and_multiply_latin_desc: "Manželé dávají nejen sebe navzájem, ale i skutečnost v podobě dětí, které jsou živým odrazem jejich lásky a živoucí, neoddělitelnou syntézou jejich bytí.\n\n$pam_genesis_1_28_latin$\n\n[Glossary('Crescite et Multiplicamini Historical Background','tenet_be_fruitful_and_multiply_historical_desc')]" # todo: NEW TRANSLATION
 tenet_be_fruitful_and_multiply_greek_desc: "Hle, děti jsou dědictvím od Hospodina, plod lůna je odměnou.\n\n$pam_genesis_1_28_greek$\n\n[Glossary('Auxánesthe kaì Plēthýnesthe Historical Background','tenet_be_fruitful_and_multiply_historical_desc')]" # todo: NEW TRANSLATION
 tenet_be_fruitful_and_multiply_default_desc: "V Božím plánu je rodina důvěrným společenstvím života a lásky, jehož úsilí nalezne naplnění, stejně jako vše stvořené a vykoupené, v Božím království.\n\n$pam_genesis_1_28_default$\n\n[Glossary('Be Fruitful and Multiply Historical Background','tenet_be_fruitful_and_multiply_historical_desc')]" # todo: NEW TRANSLATION
 tenet_be_fruitful_and_multiply_historical_desc: "Ploďte a množte se je biblický příkaz z Genesis 1:28, v němž Bůh přikazuje Adamovi a Evě, aby měli potomstvo a naplnili zemi." # todo: NEW TRANSLATION
 doctrine_parameter_tenet_be_fruitful_and_multiply_easy_spouse_romance: "Svádění manžela či manželky je výrazně snazší a přináší značný bonus k [fertility|E]" # todo: NEW TRANSLATION
