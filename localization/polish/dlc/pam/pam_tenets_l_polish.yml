 tenet_acts_of_apostles_latin_name: "Actus Apostolorum" # todo: NEW TRANSLATION
 tenet_acts_of_apostles_greek_name: "Práxeis tõn Apostólōn" # todo: NEW TRANSLATION
 tenet_acts_of_apostles_default_name: "Horlivé šíření víry" # todo: NEW TRANSLATION
