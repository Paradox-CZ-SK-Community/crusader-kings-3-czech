 tenet_purgatory_latin_desc: "Mnohem více se obávám trestu tam dole, má duše je úzkostná a v napětí; již cítím těžká břemena první terasy.\n\n$pam_2_macabees_12_44_latin$\n\n[Glossary('Purgatorium Historical Background','tenet_purgatory_historical_desc')]" # todo: NEW TRANSLATION
 tenet_purgatory_greek_desc: "A lidé, kteří jsou v nebi, protože nemají tělo, nemohou růst v theosis, a tak jim naše modlitby pomáhají v theosis růst.\n\n$pam_2_macabees_12_44_greek$\n\n[Glossary('Kathartērion Historical Background','tenet_purgatory_historical_desc')]" # todo: NEW TRANSLATION
 tenet_purgatory_default_desc: "Konečné očištění těch, kteří zemřeli ve stavu milosti, při němž v nich zůstane pouze svatost potřebná ke vstupu do nebeské radosti.\n\n$pam_2_macabees_12_44_default$\n\n[Glossary('Purgatory Historical Background','tenet_purgatory_historical_desc')]" # todo: NEW TRANSLATION
 tenet_purgatory_historical_desc: "Představa, že duše setrvávají na cestě do nebe v přechodném stavu, byla široce přijímána, ale přesná povaha tohoto stavu se dlouho řešila: podle jednotlivých teologů šlo o skutečné místo, stav mysli, metaforu nebo fyzické očištění. Svatá Kateřina Janovská jej popsala jako stav radosti smíšené s dobrovolnou bolestí za vlastní hříchy, zatímco Órigenés Alexandrijský psal o Bohu jako o vše stravujícím ohni.\n\nKatolická církev definovala očistec na koncilech ve Florencii (1439) a v Tridentu (1545–1563) jako dočasné očištění a učila, že modlitby a dobré skutky živých prospívají duším, které se v něm nacházejí." # todo: NEW TRANSLATION
 doctrine_parameter_tenet_purgatory_sinful_characters_less_likely_to_rebel: "[sinful|E] [characters|E] se méně často přidávají k [factions|E] (#N -15#! za každý [sin|E], který na nich spočívá)" # todo: NEW TRANSLATION
