 doctrine_parameter_tenet_peace_of_god_excommunication: "Primární obránci neplatí @piety_icon![piety|E] za [excommunicate|E] útočníků stejné [faith|E]" # todo: NEW TRANSLATION
 doctrine_parameter_tenet_peace_of_god_excommunication_truce: "Porušení [truce|E] uvnitř [faith|E] vede k okamžité [excommunication|E]" # todo: NEW TRANSLATION
 doctrine_parameter_tenet_peace_of_god_clergy_peacemaking: "[clergy|E] mnohem ochotněji řeší spory o půdu a tituly a účtují si o #P 25%#! méně @piety_icon![piety|E], @gold_icon![gold|E] a @prestige_icon![prestige|E]" # todo: NEW TRANSLATION
 pam_peace_of_god_tenet_title: "$tenet_peace_of_god_default_name$: Zachovával jsi mír" # todo: NEW TRANSLATION
 tenet_dulia_latin_name: "Dulia" # todo: NEW TRANSLATION
 tenet_dulia_greek_name: "Hagiokatátaxis" # todo: NEW TRANSLATION
 tenet_dulia_default_name: "Uctívání svatých" # todo: NEW TRANSLATION
 tenet_dulia_name: "$tenet_dulia_default_name$" # todo: NEW TRANSLATION
 tenet_dulia_latin_desc: "Ti, kdo si zvolili Pána za svou skálu, si zaslouží úctu. Jejich tělo je svaté, jejich ostatky posvátné a jejich památka svatá.\n\n$pam_philippians_4_21_latin$\n\n[Glossary('Dulia Historical Background','tenet_dulia_historical_desc')]" # todo: NEW TRANSLATION
 tenet_dulia_greek_desc: "Církev udělovala zvláštní titul a připomínala v konkrétní den liturgického kalendáře ty, kdo projevili mimořádnou oddanost Bohu – od svatých vyznavačů a myronosic až po blázny pro Krista.\n\n$pam_philippians_4_21_greek$\n\n[Glossary('Hagiokatátaxis Historical Background','tenet_dulia_historical_desc')]" # todo: NEW TRANSLATION
 tenet_dulia_default_desc: "Ať všichni, kdo hledají přímluvu svatých, k nim přistupují s úctou a oddaností.\n\n$pam_philippians_4_21_default$\n\n[Glossary('Veneration of Saints Historical Background','tenet_dulia_historical_desc')]" # todo: NEW TRANSLATION
 tenet_dulia_historical_desc: "V raném křesťanství byli uctíváni mučedníci, tedy ti, kdo zemřeli pro víru, a jejich ostatky byly uchovávány jako svaté předměty. Od 4. století byli uctíváni také vyznavači, kteří svou víru dosvědčili nikoli smrtí, ale slovem a životem.\n\nJejich status zpočátku schvaloval místní biskup, který nejprve prošetřil jejich život a zázraky. Svatý Oldřich, biskup augsburský, jehož svatořečil papež Jan XV. v roce 993, byl prvním svatým mimo Řím, kterého kanonizoval papež. Dekret papeže Alexandra III. z roku 1170 svěřil právo kanonizace výhradně papeži." # todo: NEW TRANSLATION
 doctrine_parameter_tenet_dulia_cheaper_saint_costs: "[decisions|E] [GetDecisionWithKey('pam_canonize_saint_decision').GetName] a [GetDecisionWithKey('pam_extract_relic_decision').GetName] stojí o #P 15%#! méně @piety_icon![piety|E] a @gold_icon![gold|E]" # todo: NEW TRANSLATION
 doctrine_parameter_tenet_dulia_extra_relic_modifier: "[artifacts|E] získané prostřednictvím [decision|E] [GetDecisionWithKey('pam_extract_relic_decision').GetName] mají #P 1#! dodatečné náhodné požehnání" # todo: NEW TRANSLATION
 doctrine_parameter_tenet_dulia_dynasty_prestige_from_relics: "[decision|E] [GetDecisionWithKey('pam_extract_relic_decision').GetName] vykonaná na členu [dynasty|E] uděluje #P [EmptyScope.ScriptValue('medium_dynasty_prestige_gain')|0]#! [dynasty_prestige|E]" # todo: NEW TRANSLATION
 doctrine_parameter_tenet_dulia_canonization_faith_bonus: "Kanonizace svatého udělí každému [ruler|E] [faith|E] modifikátor $pam_dulia_new_saint_modifier$ na #EMP 5#! let" # todo: NEW TRANSLATION
 tenet_transubstantiation_latin_name: "Transubstantiatio" # todo: NEW TRANSLATION
 tenet_transubstantiation_greek_name: "Metousíōsis" # todo: NEW TRANSLATION
 tenet_transubstantiation_default_name: "Transsubstanciace" # todo: NEW TRANSLATION
 tenet_transubstantiation_name: "$tenet_transubstantiation_default_name$" # todo: NEW TRANSLATION
 tenet_transubstantiation_latin_desc: "Při svátosti eucharistie však proměna chleba při konsekraci nekončí v nicotě, nýbrž v těle Kristově. Jinak by nebylo možné vysvětlit, jak tělo Kristovo začne být přítomno pod způsobou svátosti. Nezačíná tam být přítomno místním pohybem, neboť by jinak přestalo být v nebi.\n\n$pam_luke_22_19_latin$\n\n[Glossary('Transubstantiatio Historical Background','tenet_transubstantiation_historical_desc')]" # todo: NEW TRANSLATION
 tenet_transubstantiation_greek_desc: "Je však přítomen skutečně a opravdově, takže po konsekraci chleba a vína se chléb přeměňuje, transsubstanciuje a proměňuje v samo pravé Tělo Páně.\n\n$pam_luke_22_19_greek$\n\n[Glossary('Metousíōsis Historical Background','tenet_transubstantiation_historical_desc')]" # todo: NEW TRANSLATION
 tenet_transubstantiation_default_desc: "Před konsekrací má jiné jméno, po ní se nazývá Krví. A ty pravíš: Amen, to jest: Je to pravda.\n\n$pam_luke_22_19_default$\n\n[Glossary('Transubstantiation Historical Background','tenet_transubstantiation_historical_desc')]" # todo: NEW TRANSLATION
 tenet_transubstantiation_historical_desc: "Povaha Kristovy přítomnosti v eucharistii je předmětem teologických debat už od rané církve. Zatímco božská podstata chleba a vína jako Těla a Krve Kristovy bývala zřídka zpochybňována, jejich přesná povaha byla zdrojem mnoha sporů, sekt a rozkolů. Katolický výklad dále rozvinul Tomáš Akvinský ve 13. století. Formálně byl definován čtvrtým lateránským koncilem v roce 1215. Během mše se podstata chleba a vína mění v podstatu Těla a Krve Kristovy, zatímco vnější podoba chleba a vína zůstává." # todo: NEW TRANSLATION
 doctrine_parameter_tenet_transubstantiation_faster_bishop_claims: "Rychlost [fabricate_claim|E]: #p +20%#!" # todo: NEW TRANSLATION
 FABRICATE_CLAIM_TRANSUBSTANTIATION_BONUS: "$tenet_transubstantiation_default_name$" # todo: NEW TRANSLATION
 tenet_ora_et_labora_latin_name: "Ora et Labora" # todo: NEW TRANSLATION
 tenet_ora_et_labora_greek_name: "Akoímētoi" # todo: NEW TRANSLATION
 tenet_ora_et_labora_default_name: "Pracovat znamená modlit se" # todo: NEW TRANSLATION
 tenet_ora_et_labora_name: "$tenet_ora_et_labora_default_name$" # todo: NEW TRANSLATION
 tenet_ora_et_labora_latin_desc: "Buď poslušný vůči svému představenému. Buď trpělivý v těžkostech. Přijímej i ty nejpodřadnější úkoly a považuj se za neužitečného dělníka.\n#weak Kapitola VII Řehole svatého Benedikta#!\n\n$pam_proverbs_6_6_latin$\n\n[Glossary('Ora et Labora Historical Background','tenet_ora_et_labora_historical_desc')]" # todo: NEW TRANSLATION
 tenet_ora_et_labora_greek_desc: "Mniši musí bez přestání, ve dne i v noci, slavit bohoslužbu. Jejich střídající se chóry a nekonečné žalmy přinášejí slávu jejich řádu i Bohu.\n\n$pam_proverbs_6_6_greek$\n\n[Glossary('Akoímētoi Historical Background','tenet_ora_et_labora_historical_desc')]" # todo: NEW TRANSLATION
 tenet_ora_et_labora_default_desc: "Modlit se znamená pracovat a pracovat znamená modlit se. Zahálka je nepřítelem duše; člověk musí být pilný v myšlenkách i činech.\n\n$pam_proverbs_6_6_default$\n\n[Glossary('To Work Is to Pray Historical Background','tenet_ora_et_labora_historical_desc')]" # todo: NEW TRANSLATION
 tenet_ora_et_labora_historical_desc: "Heslo #weak Ora et labora#! vychází z Řehole svatého Benedikta a vystihuje mnišský ideál modlitby a práce. Od mnichů se očekávalo, že vyhradí určité hodiny dne společným modlitbám, osobní meditaci a manuální práci. Tato rovnováha byla považována za nezbytnou pro duchovní růst a kázeň. Benediktinské kláštery se staly centry vzdělanosti, zemědělství a řemesel a významně přispěly ke kulturnímu i hospodářskému životu středověké Evropy." # todo: NEW TRANSLATION
 tenet_hyperdulia_latin_name: "Hyperdulia" # todo: NEW TRANSLATION
 tenet_hyperdulia_greek_name: "Theotókos" # todo: NEW TRANSLATION
 tenet_hyperdulia_default_name: "Matka Boží" # todo: NEW TRANSLATION
 tenet_hyperdulia_name: "$tenet_hyperdulia_default_name$" # todo: NEW TRANSLATION
 tenet_hyperdulia_latin_desc: "Pod ochranu tvého milosrdenství se utíkáme. Neodmítej naše prosby v dobách soužení, ale vysvoboď nás z nebezpečí, ty jediná čistá, jediná požehnaná.\n\n$pam_proverbs_31_20_latin$\n\n[Glossary('Hyperdulia Historical Background','tenet_hyperdulia_historical_desc')]" # todo: NEW TRANSLATION
 tenet_hyperdulia_greek_desc: "Přijmi naše modlitby a přednes je svému Synu a našemu Bohu, aby pro tebe osvítil a spasil naše duše. Nejsvětější Bohorodičko, spasiž nás!\n\n$pam_proverbs_31_20_greek$\n\n[Glossary('Theotókos Historical Background','tenet_hyperdulia_historical_desc')]" # todo: NEW TRANSLATION
 tenet_hyperdulia_default_desc: "Blahoslavená Panna Maria, Matka Boží, Matka milosrdenství, Madona.\n\n$pam_proverbs_31_20_default$\n\n[Glossary('Mother of God Historical Background','tenet_hyperdulia_historical_desc')]" # todo: NEW TRANSLATION
 tenet_hyperdulia_historical_desc: "Od nejranějších dob křesťanství zaujímá Maria, matka Ježíše, zvláštní čestné místo a je předmětem uctívání. Efezský koncil roku 431 potvrdil její titul Theotokos, #weak Bohorodička#!, a zároveň odsoudil nestoriánské upřednostňování titulu Christotokos, #weak Kristorodička#!. Svatý Jan Damašský v 8. století napsal, že Maria byla díky své jedinečné úloze v dějinách spásy vyvýšena nad všechny ostatní svaté. Během staletí vznikaly různé nauky o Marii, například o jejím neposkvrněném početí a nanebevzetí, které křesťanské církve později formálně vymezily." # todo: NEW TRANSLATION
 doctrine_parameter_tenet_hyperdulia_female_claims_are_strong: "[claims|E] žen již nejsou oslabeny kvůli [gender_laws|E]" # todo: NEW TRANSLATION
 doctrine_parameter_tenet_hyperdulia_female_preference_law: "Umožňuje [laws|E]: nástupnictví podle [GetLaw('female_preference_law').GetName]" # todo: NEW TRANSLATION
