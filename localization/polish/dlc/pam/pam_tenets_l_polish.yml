 tenet_apostolic_succession_latin_name: "Successio Apostolica"
 tenet_apostolic_succession_greek_name: "Apostolikē Diadokhē"
 tenet_apostolic_succession_default_name: "Apoštolská posloupnost"
 tenet_apostolic_succession_name: "$tenet_apostolic_succession_default_name$"
 tenet_apostolic_succession_latin_desc: "Přednost v cti a pravomoci, kterou Kristus udělil apoštolu Petrovi a která se dědí na jeho nástupce, papeže.\n\n$pam_matthew_16_18_latin$"
 tenet_apostolic_succession_latin_historical_glossary: "[Glossary('Successio Apostolica','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_greek_desc: "Prvním biskupem římské církve byl Linus, syn Claudiin, kterého vysvětil Pavel.\n\n$pam_matthew_16_18_greek$"
 tenet_apostolic_succession_greek_historical_glossary: "[Glossary('Apostolikē Diadokhē','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_default_desc: "Nepřerušená posloupnost biskupů od apoštolů až do dnešních dnů, která zajišťuje autentické předávání víry.\n\n$pam_matthew_16_18_default$"
 tenet_apostolic_succession_default_historical_glossary: "[Glossary('Apoštolská posloupnost','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_historical_desc: "Nauka o apoštolské posloupnosti tvrdí, že biskupové odvozují svou autoritu od nepřerušeného řetězce svěcení sahajícího až k samotným apoštolům. Irenej z Lyonu ve 2. století použil apoštolskou posloupnost jako argument proti gnostickým herezím a ukázal, že pravé Kristovo učení se zachovalo prostřednictvím legitimních biskupů církve.\n\nOd 13. století nosí papežové Rybářský prsten jako symbol nástupnictví po svatém Petrovi. Východní pravoslavní uznávají linii západních papežů i jejich úlohu v raném křesťanství, Petrovi však nepřiznávají vyšší postavení než ostatním apoštolům a za prvního římského biskupa považují papeže Lina."
 tenet_apostolic_succession_requires_head_of_faith_tt: "Tvé [Concept('faith','víra')|E] musí mít [Concept('head_of_faith','hlavu víry')|E]"
 doctrine_parameter_tenet_apostolic_succession_bishop_legitimacy: "[Concept('theocratic_vassals','teokratičtí vazalové')|EU] stejné [Concept('faith','víry')|E] mají nižší [Concept('legitimacy_expectations','očekávání legitimity')|E] od svého [Concept('liege','lenního pána')|E]"
 doctrine_parameter_tenet_apostolic_succession_legitimacy_per_theocratic_vassal: "Uděluje [GetModifier('tenet_apostolic_succession_episcopate_modifier').GetNameWithTooltip|l]"
 doctrine_parameter_tenet_apostolic_succession_papabile_influence: "Povýšení [Concept('cardinal','kardinála')|E] zvýší jeho [Concept('papabile_score','skóre papežské kandidatury')|E] o dalších #P 10#!"
 doctrine_parameter_tenet_apostolic_succession_papal_legitimacy: "Pokud [Concept('head_of_faith','hlava víry')|E] osobně káže o tvé @legitimacy_icon![Concept('legitimacy','legitimitě')|E], získáš dodatečnou @legitimacy_icon![Concept('legitimacy','legitimitu')|E]"
