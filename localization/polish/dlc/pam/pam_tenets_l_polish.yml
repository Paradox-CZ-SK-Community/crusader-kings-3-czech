 tenet_anachoresis_name: "$tenet_anachoresis_default_name$" # todo: NEW TRANSLATION
 tenet_anachoresis_latin_desc: "Pane, jako jsi vedl svého Syna na poušť, aby se připravil na své poslání, veď i nás do pouště našich srdcí. V samotě a tichu nám dej uniknout rozptýlení světa a nalézt pouze Tebe.\n\n$pam_matthew_4_1_2_latin$\n\n[Glossary('Vita Eremitica Historical Background','tenet_anachoresis_historical_desc')]" # todo: NEW TRANSLATION
 tenet_anachoresis_greek_desc: "Blaze těm, kdo se stáhnou ze světa, neboť v tichu pouště naleznou Boha. Jako proroci přebývali v jeskyních a zemských slujích, tak i Kristovi služebníci hledají samotu, aby vedli boj proti vášním.\n\n$pam_matthew_4_1_2_greek$\n\n[Glossary('Anakhōrēsis Historical Background','tenet_anachoresis_historical_desc')]" # todo: NEW TRANSLATION
 tenet_anachoresis_default_desc: "Věřící se mohou stáhnout ze světské společnosti do pustiny, dosáhnout duchovní čistoty, přemoci vášně a přiblížit se Bohu prostřednictvím osamělé modlitby a asketické kázně.\n\n$pam_matthew_4_1_2_default$\n\n[Glossary('Anachoresis Historical Background','tenet_anachoresis_historical_desc')]" # todo: NEW TRANSLATION
 tenet_anachoresis_historical_desc: "Anachoréze, z řeckého #weak anakhorēsis#!, což znamená ústraní, označuje způsob života poustevníků, kteří opouštěli společnost a odcházeli do pustiny, aby se věnovali modlitbě, půstu a duchovnímu boji proti démonickým silám. Toto hnutí začalo ve 3. století v Egyptě u svatého Pavla Thébského, tradičně považovaného za prvního křesťanského poustevníka, který kolem roku 250 uprchl před pronásledováním císaře Decia do Thébaidské pouště.\n\nPoustevníci zůstávali běžnou součástí života po celý středověk. Žili v osamělých celách připojených ke klášterům a eucharistii přijímali malým okénkem zvaným hagioskop. Příručky, jako byla anglická Ancrene Wisse ze 13. století, stanovovaly pravidla pro poustevníky i poustevnice." # todo: NEW TRANSLATION
