 doctrine_parameter_tenet_simony_wealth_fulfillment: "Roční šance #P 25%#!–#P 75%#! na získání #P +[EmptyScope.ScriptValue('minor_spiritual_fulfillment_value')|0]#! @spiritual_fulfillment_icon![Concept('spiritual_fulfillment','duchovního naplnění')|E], která roste s bohatstvím"
