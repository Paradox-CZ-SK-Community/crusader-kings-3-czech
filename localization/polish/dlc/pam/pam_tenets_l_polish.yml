 doctrine_parameter_tenet_be_fruitful_and_multiply_health_boost_after_child: "Při narození a dosažení dospělosti:\n$BULLET_WITH_TAB$#V Dítě#! získá na 2 roky [GetModifier('tenet_be_fruitful_and_multiply_child_modifier').GetNameWithTooltip|l].\n$BULLET_WITH_TAB$#V Rodiče#! získají na 2 roky [GetModifier('tenet_be_fruitful_and_multiply_parent_modifier').GetNameWithTooltip|l]."
