 pam_1_corinthians_9_27_latin: "[Glossary('Sed castigo corpus meum, et in servitutem redigo: ne forte cum aliis praedicaverim, ipse reprobus efficiar.','1_CORINTHIANS_9_27_LATIN_GLOSS')]"
