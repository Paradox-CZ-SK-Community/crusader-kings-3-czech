 tenet_purgatory_default_name: "Očistec"
 tenet_purgatory_name: "$tenet_purgatory_default_name$"
 tenet_purgatory_latin_desc: "Mnohem více se obávám trestu tam dole, má duše je úzkostná a v napětí; již cítím těžká břemena první terasy.\n\n$pam_2_macabees_12_44_latin$"
 tenet_purgatory_latin_historical_glossary: "[Glossary('Purgatorium','tenet_purgatory_historical_desc')]"
 tenet_purgatory_greek_desc: "A lidé, kteří jsou v nebi, protože nemají tělo, nemohou růst v theosis, a tak jim naše modlitby pomáhají v theosis růst.\n\n$pam_2_macabees_12_44_greek$"
 tenet_purgatory_greek_historical_glossary: "[Glossary('Kathartērion','tenet_purgatory_historical_desc')]"
 tenet_purgatory_default_desc: "Konečné očištění těch, kteří zemřeli ve stavu milosti, při němž v nich zůstane pouze svatost potřebná ke vstupu do nebeské radosti.\n\n$pam_2_macabees_12_44_default$"
 tenet_purgatory_default_historical_glossary: "[Glossary('Očistec','tenet_purgatory_historical_desc')]"
 tenet_purgatory_historical_desc: "Představa, že duše setrvávají na cestě do nebe v přechodném stavu, byla široce přijímána, ale přesná povaha tohoto stavu se dlouho řešila: podle jednotlivých teologů šlo o skutečné místo, stav mysli, metaforu nebo fyzické očištění. Svatá Kateřina Janovská jej popsala jako stav radosti smíšené s dobrovolnou bolestí za vlastní hříchy, zatímco Órigenés Alexandrijský psal o Bohu jako o vše stravujícím ohni.\n\nKatolická církev definovala očistec na koncilech ve Florencii (1439) a v Tridentu (1545–1563) jako dočasné očištění a učila, že modlitby a dobré skutky živých prospívají duším, které se v něm nacházejí."
 doctrine_parameter_tenet_purgatory_sinful_characters_less_likely_to_rebel: "[Concept('sinful','hříšné')|EU] [Concept('characters','postavy')|E] se méně často přidávají k [Concept('factions','frakcím')|E] (#N -15#! za každý [Concept('sin','hřích')|E], který na nich spočívá)"
 doctrine_parameter_tenet_purgatory_sinful_characters_gain_less_piety: "[Concept('sinful','hříšní')|EU] [Concept('rulers','vládci')|E] získávají o #N 10%#! méně @piety_icon![Concept('piety','zbožnosti')|E] za každý [Concept('sin','hřích')|E], který na nich spočívá"
 doctrine_parameter_tenet_purgatory_stress_breaks_remove_sins: "Zlomy způsobené [Concept('stress','stresem')|E] mohou nahradit [Concept('sinful','hříšné')|E] [Concept('traits','rysy')|E] [Concept('virtues','ctnostmi')|E], přičemž s hloubkou zlomu roste pravděpodobnost"
