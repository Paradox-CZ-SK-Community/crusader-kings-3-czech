 pam_peace_of_god_tenet_title: "$tenet_peace_of_god_default_name$: zachování míru"
 tenet_dulia_latin_name: "Dulia"
 tenet_dulia_greek_name: "Hagiokatátaxis"
 tenet_dulia_default_name: "Uctívání svatých"
 tenet_dulia_name: "$tenet_dulia_default_name$"
 tenet_dulia_latin_desc: "Ti, kdo si zvolili Pána za svou skálu, si zaslouží úctu. Jejich tělo je svaté, jejich ostatky posvátné a jejich památka svatá.\n\n$pam_philippians_4_21_latin$"
 tenet_dulia_latin_historical_glossary: "[Glossary('Dulia','tenet_dulia_historical_desc')]"
 tenet_dulia_greek_desc: "Církev udělovala zvláštní titul a připomínala v konkrétní den liturgického kalendáře ty, kdo projevili mimořádnou oddanost Bohu – od svatých vyznavačů a myronosic až po blázny pro Krista.\n\n$pam_philippians_4_21_greek$"
 tenet_dulia_greek_historical_glossary: "[Glossary('Hagiokatátaxis','tenet_dulia_historical_desc')]"
 tenet_dulia_default_desc: "Ať všichni, kdo hledají přímluvu svatých, k nim přistupují s úctou a oddaností.\n\n$pam_philippians_4_21_default$"
 tenet_dulia_default_historical_glossary: "[Glossary('Uctívání svatých','tenet_dulia_historical_desc')]"
 tenet_dulia_historical_desc: "V raném křesťanství byli uctíváni mučedníci, tedy ti, kdo zemřeli pro víru, a jejich ostatky byly uchovávány jako svaté předměty. Od 4. století byli uctíváni také vyznavači, kteří svou víru dosvědčili nikoli smrtí, ale slovem a životem.\n\nJejich status zpočátku schvaloval místní biskup, který nejprve prošetřil jejich život a zázraky. Svatý Oldřich, biskup augsburský, jehož svatořečil papež Jan XV. v roce 993, byl prvním svatým mimo Řím, kterého kanonizoval papež. Dekret papeže Alexandra III. z roku 1170 svěřil právo kanonizace výhradně papeži."
 doctrine_parameter_tenet_dulia_cheaper_saint_costs: "[Concept('decisions','rozhodnutí')|EU] [GetDecisionWithKey('pam_canonize_saint_decision').GetName|l] a [GetDecisionWithKey('pam_extract_relic_decision').GetName|l] stojí o #P 15%#! méně @piety_icon![Concept('piety','zbožnosti')|E] a @gold_icon![Concept('gold','zlata')|E]"
 doctrine_parameter_tenet_dulia_extra_relic_modifier: "[Concept('artifacts','artefakty')|EU] získané prostřednictvím [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('pam_extract_relic_decision').GetName|l] mají #P 1#! dodatečné náhodné požehnání"
 doctrine_parameter_tenet_dulia_dynasty_prestige_from_relics: "[Concept('decision','rozhodnutí')|EU] [GetDecisionWithKey('pam_extract_relic_decision').GetName|l] provedené u člena [Concept('dynasty','dynastie')|E] uděluje #P [EmptyScope.ScriptValue('medium_dynasty_prestige_gain')|0]#! [Concept('dynasty_prestige','věhlasu')|E]"
 doctrine_parameter_tenet_dulia_canonization_faith_bonus: "Kanonizace svatého udělí každému [Concept('ruler','vládci')|E] [Concept('faith','víry')|E] modifikátor $pam_dulia_new_saint_modifier$ na #EMP 5#! let"
 tenet_transubstantiation_latin_name: "Transubstantiatio"
 tenet_transubstantiation_greek_name: "Metousíōsis"
 tenet_transubstantiation_default_name: "Transsubstanciace"
 tenet_transubstantiation_name: "$tenet_transubstantiation_default_name$"
 tenet_transubstantiation_latin_desc: "Při svátosti eucharistie však proměna chleba při konsekraci nekončí v nicotě, nýbrž v těle Kristově. Jinak by nebylo možné vysvětlit, jak tělo Kristovo začne být přítomno pod způsobou svátosti. Nezačíná tam být přítomno místním pohybem, neboť by jinak přestalo být v nebi.\n\n$pam_luke_22_19_latin$"
 tenet_transubstantiation_latin_historical_glossary: "[Glossary('Transubstantiatio','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_greek_desc: "Je však přítomen skutečně a opravdově, takže po konsekraci chleba a vína se chléb přeměňuje, transsubstanciuje a proměňuje v samo pravé Tělo Páně.\n\n$pam_luke_22_19_greek$"
 tenet_transubstantiation_greek_historical_glossary: "[Glossary('Metousíōsis','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_default_desc: "Před konsekrací má jiné jméno, po ní se nazývá Krví. A ty pravíš: Amen, to jest: Je to pravda.\n\n$pam_luke_22_19_default$"
 tenet_transubstantiation_default_historical_glossary: "[Glossary('Transsubstanciace','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_historical_desc: "Povaha Kristovy přítomnosti v eucharistii je předmětem teologických debat už od rané církve. Zatímco božská podstata chleba a vína jako Těla a Krve Kristovy bývala zřídka zpochybňována, jejich přesná povaha byla zdrojem mnoha sporů, sekt a rozkolů. Katolický výklad dále rozvinul Tomáš Akvinský ve 13. století. Formálně byl definován čtvrtým lateránským koncilem v roce 1215. Během mše se podstata chleba a vína mění v podstatu Těla a Krve Kristovy, zatímco vnější podoba chleba a vína zůstává."
 doctrine_parameter_tenet_transubstantiation_faster_bishop_claims: "Rychlost [Concept('fabricate_claim','vykonstruování nároku')|E]: #p +20%#!"
 FABRICATE_CLAIM_TRANSUBSTANTIATION_BONUS: "$tenet_transubstantiation_default_name$"
 tenet_ora_et_labora_latin_name: "Ora et Labora"
 tenet_ora_et_labora_greek_name: "Akoímētoi"
 tenet_ora_et_labora_default_name: "Modli se a pracuj"
 tenet_ora_et_labora_name: "$tenet_ora_et_labora_default_name$"
 tenet_ora_et_labora_latin_desc: "Buď poslušný vůči svému představenému. Buď trpělivý v těžkostech. Přijímej i ty nejpodřadnější úkoly a považuj se za neužitečného dělníka.\n#weak Kapitola VII Řehole svatého Benedikta#!\n\n$pam_proverbs_6_6_latin$"
 tenet_ora_et_labora_latin_historical_glossary: "[Glossary('Ora et Labora','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_greek_desc: "Mniši musí bez přestání, ve dne i v noci, slavit bohoslužbu. Jejich střídající se chóry a nekonečné žalmy přinášejí slávu jejich řádu i Bohu.\n\n$pam_proverbs_6_6_greek$"
 tenet_ora_et_labora_greek_historical_glossary: "[Glossary('Akoímētoi','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_default_desc: "Modlit se znamená pracovat a pracovat znamená modlit se. Zahálka je nepřítelem duše; člověk musí být pilný v myšlenkách i činech.\n\n$pam_proverbs_6_6_default$"
 tenet_ora_et_labora_default_historical_glossary: "[Glossary('Modli se a pracuj','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_historical_desc: "Heslo #weak Ora et labora#!, tedy #weak Modli se a pracuj#!, vychází z Řehole svatého Benedikta a vystihuje mnišský ideál modlitby a práce. Od mnichů se očekávalo, že vyhradí určité hodiny dne společným modlitbám, osobní meditaci a manuální práci. Tato rovnováha byla považována za nezbytnou pro duchovní růst a kázeň. Benediktinské kláštery se staly centry vzdělanosti, zemědělství a řemesel a významně přispěly ke kulturnímu i hospodářskému životu středověké Evropy."
 tenet_hyperdulia_latin_name: "Hyperdulia"
 tenet_hyperdulia_greek_name: "Theotókos"
 tenet_hyperdulia_default_name: "Matka Boží"
 tenet_hyperdulia_name: "$tenet_hyperdulia_default_name$"
 tenet_hyperdulia_latin_desc: "Pod ochranu tvého milosrdenství se utíkáme. Neodmítej naše prosby v dobách soužení, ale vysvoboď nás z nebezpečí, ty jediná čistá, jediná požehnaná.\n\n$pam_proverbs_31_20_latin$"
 tenet_hyperdulia_latin_historical_glossary: "[Glossary('Hyperdulia','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_greek_desc: "Přijmi naše modlitby a přednes je svému Synu a našemu Bohu, aby pro tebe osvítil a spasil naše duše. Nejsvětější Bohorodičko, spasiž nás!\n\n$pam_proverbs_31_20_greek$"
 tenet_hyperdulia_greek_historical_glossary: "[Glossary('Theotókos','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_default_desc: "Blahoslavená Panna Maria, Matka Boží, Matka milosrdenství, Madona.\n\n$pam_proverbs_31_20_default$"
 tenet_hyperdulia_default_historical_glossary: "[Glossary('Matka Boží','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_historical_desc: "Od nejranějších dob křesťanství zaujímá Maria, matka Ježíše, zvláštní čestné místo a je předmětem uctívání. Efezský koncil roku 431 potvrdil její titul Theotokos, #weak Bohorodička#!, a zároveň odsoudil nestoriánské upřednostňování titulu Christotokos, #weak Kristorodička#!. Svatý Jan Damašský v 8. století napsal, že Maria byla díky své jedinečné úloze v dějinách spásy vyvýšena nad všechny ostatní svaté. Během staletí vznikaly různé nauky o Marii, například o jejím neposkvrněném početí a nanebevzetí, které křesťanské církve později formálně vymezily."
 doctrine_parameter_tenet_hyperdulia_female_claims_are_strong: "[Concept('claims','nároky')|EU] žen již nejsou oslabeny kvůli [Concept('gender_laws','zákonům o pohlaví')|E]"
 doctrine_parameter_tenet_hyperdulia_female_preference_law: "Umožňuje [Concept('laws','zákony')|E] o nástupnictví: [GetLaw('female_preference_law').GetName|l]"
 tenet_simony_latin_name: "Simonia"
 tenet_simony_greek_name: "Simōnía"
 tenet_simony_default_name: "Simonie"
 tenet_simony_name: "$tenet_simony_default_name$"
 tenet_simony_latin_desc: "Bůh stvořil zlato pod zemí a daroval nám je jako přízeň svým vyvoleným.\n\n$pam_proverbs_21_20_latin$"
 tenet_simony_latin_historical_glossary: "[Glossary('Simonia','tenet_simony_historical_desc')]"
 tenet_simony_greek_desc: "Bůh stvořil zlato pod zemí a daroval nám je jako přízeň svým vyvoleným.\n\n$pam_proverbs_21_20_greek$"
 tenet_simony_greek_historical_glossary: "[Glossary('Simōnía','tenet_simony_historical_desc')]"
 tenet_simony_default_desc: "Bůh stvořil zlato pod zemí a daroval nám je jako přízeň svým vyvoleným.\n\n$pam_proverbs_21_20_english$"
 tenet_simony_default_historical_glossary: "[Glossary('Simonie','tenet_simony_historical_desc')]"
 tenet_simony_historical_desc: "Praxe prodávání církevních úřadů, relikvií a obřadů. Je pojmenována po Šimonu Mágovi, Samařanovi, který #weak očarovával#! lidi a nabízel apoštolům peníze za křest.\n\nŘada synod, od synody v Elvíře roku 305 n. l. až po Tridentský koncil roku 1545, simonii horlivě odsuzovala a ukládala za ni přísné duchovní i světské tresty. Pokud je nějaká praxe tolikrát odsuzována po tolik staletí, znamená to, že byla poměrně rozšířená. Kritizoval ji také Martin Luther ve své 95. tezi a Dante v 19. zpěvu Pekla: #weak Chamtivci, kteří berou Boží věci, jež mají být nevěstami Spravedlnosti, a nutí je smilnit za zlato a stříbro!#!"
