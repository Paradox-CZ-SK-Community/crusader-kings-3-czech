 tenet_confession_name: "$tenet_confession_default_name$"
 tenet_confession_latin_desc: "Požehnej mi, Otče, neboť jsem zhřešil. Ó nejmilosrdnější Bože! Padám k Tvým nohám a prosím Tě o odpuštění. Se vší upřímností se Ti a Tvému knězi zpovídám ze svých hříchů\n\n$pam_james_5_16_latin$"
 tenet_confession_latin_historical_glossary: "[Glossary('Confessio','tenet_confession_historical_desc')]"
 tenet_confession_greek_desc: "Vyslyš modlitbu mou, ubožáka, a znič hada, který se ve mně uhnízdil, ó Pane!\n\n$pam_james_5_16_greek$"
 tenet_confession_greek_historical_glossary: "[Glossary('Exomológēsis','tenet_confession_historical_desc')]"
 tenet_confession_default_desc: "Hříšníci mohou skrze zpověď získat rozhřešení a smířit se s Bohem i církví.\n\n$pam_james_5_16_default$"
 tenet_confession_default_historical_glossary: "[Glossary('Svátost zpovědi','tenet_confession_historical_desc')]"
 tenet_confession_historical_desc: "Praxe zpovídání se z hříchů se v průběhu křesťanských dějin výrazně proměnila. V rané církvi byla u těžkých hříchů běžná veřejná zpověď. Soukromá zpověď knězi se rozšířila v keltských církvích během 6. století a poté se rozšířila po celém západním křesťanstvu. Čtvrtý lateránský koncil v roce 1215 nařídil všem křesťanům každoroční zpověď. Zpovědní tajemství, tedy naprostá důvěrnost zpovídaných hříchů, se stalo určujícím znakem této svátosti a kněží byli ochotni podstoupit mučednickou smrt, než aby je porušili."
 doctrine_parameter_tenet_confession_priests_secrets: "[Concept('court_chaplain','dvorní kaplan')|EU] tvé [Concept('faith','víry')|E], který také praktikuje zpověď a buď tě má rád, nebo je vázán silnou pákou, je efektivnější při [Concept('councillor_task','úkolu rádce')|E] $task_find_secrets$"
