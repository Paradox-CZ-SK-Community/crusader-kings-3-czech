 pam_tenet_scholasticism_studium_toast_title: "Putovní studium" # todo: NEW TRANSLATION
 pam_tenet_scholasticism_studium_toast_desc: "[pam_studium_scholar.GetTitledFirstName] s tebou během poslední části cesty probíral danou otázku a někde mezi jednou [barony|E] a další se rozhodl pokračovat v ní písemně" # todo: NEW TRANSLATION
 court_position_scholasticism_free: "$tenet_scholasticism_default_name$" # todo: NEW TRANSLATION
 tenet_love_thy_neighbour_latin_name: "Diliges Proximum" # todo: NEW TRANSLATION
 tenet_love_thy_neighbour_greek_name: "Agapēseis tòn Plēsíon" # todo: NEW TRANSLATION
 tenet_love_thy_neighbour_default_name: "Miluj bližního svého" # todo: NEW TRANSLATION
 tenet_love_thy_neighbour_name: "$tenet_love_thy_neighbour_default_name$" # todo: NEW TRANSLATION
 tenet_love_thy_neighbour_latin_desc: "Kéž se na druhé díváme Tvýma očima, méně soudíme a více milujeme a vnímáme je stejně jako sebe jako dílo, které bude v pravý čas dokončeno Tvýma rukama.\n\n$pam_matthew_22_39_latin$\n\n[Glossary('Diliges Proximum Historical Background','tenet_love_thy_neighbour_historical_desc')]" # todo: NEW TRANSLATION
 tenet_love_thy_neighbour_greek_desc: "Co může být sladší a krásnější než láska k bližnímu? Láska je blaženost a nenávist utrpení. Na těchto dvou přikázáních spočívá celý zákon i proroci: Miluj Pána, svého Boha, celým svým srdcem, a miluj svého bližního jako sebe samého.\n\n$pam_matthew_22_39_greek$\n\n[Glossary('Agapēseis tòn Plēsíon Historical Background','tenet_love_thy_neighbour_historical_desc')]" # todo: NEW TRANSLATION
 tenet_love_thy_neighbour_default_desc: "Láska k bližnímu je neoddělitelná od lásky k Bohu a skutky dobročinnosti a milosrdenství naplňujeme celý božský zákon.\n\n$pam_matthew_22_39_default$\n\n[Glossary('Love Thy Neighbour Historical Background','tenet_love_thy_neighbour_historical_desc')]" # todo: NEW TRANSLATION
 tenet_love_thy_neighbour_historical_desc: "Přikázání milovat bližního je ústředním bodem křesťanské etiky. Vychází z knihy Leviticus 19:18 a Kristus je povýšil na úroveň lásky k Bohu jako shrnutí celého božského zákona. Raní církevní otcové, například Klement Alexandrijský a Jan Zlatoústý, zdůrazňovali, že pravá láska se musí rozšířit za hranice rodiny a přátel a zahrnovat celé lidstvo, včetně cizinců a nepřátel. Toto učení inspirovalo v průběhu středověku vznik křesťanských dobročinných institucí a nemocnic i praxi rozdávání almužen." # todo: NEW TRANSLATION
 doctrine_parameter_tenet_love_thy_neighbour_county_bonus: "[counties|E] této [faith|E] s [county_opinion|E] #P 60+#! mohou získat [modifier|E] [GetModifier('tenet_love_thy_neighbour_modifier').GetNameWithTooltip]" # todo: NEW TRANSLATION
 doctrine_parameter_tenet_love_thy_neighbour_hospital_shelter: "$building_type_hospices_01$ [buildings|E] snižují [travel_danger|E] v [county|E] o #P 3#! až #P 10#!, přičemž účinek roste s každou úrovní" # todo: NEW TRANSLATION
