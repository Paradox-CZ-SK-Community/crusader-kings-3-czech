 tenet_love_thy_neighbour_latin_name: "Diliges Proximum"
 tenet_love_thy_neighbour_greek_name: "Agapēseis tòn Plēsíon"
 tenet_love_thy_neighbour_default_name: "Miluj bližního svého"
 tenet_love_thy_neighbour_name: "$tenet_love_thy_neighbour_default_name$"
 tenet_love_thy_neighbour_latin_desc: "Kéž se na druhé díváme Tvýma očima, méně soudíme a více milujeme a vnímáme je stejně jako sebe jako dílo, které bude v pravý čas dokončeno Tvýma rukama.\n\n$pam_matthew_22_39_latin$"
 tenet_love_thy_neighbour_latin_historical_glossary: "[Glossary('Diliges Proximum','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_greek_desc: "Co může být sladší a krásnější než láska k bližnímu? Láska je blaženost a nenávist utrpení. Na těchto dvou přikázáních spočívá celý zákon i proroci: Miluj Pána, svého Boha, celým svým srdcem, a miluj svého bližního jako sebe samého.\n\n$pam_matthew_22_39_greek$"
 tenet_love_thy_neighbour_greek_historical_glossary: "[Glossary('Agapēseis tòn Plēsíon','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_default_desc: "Láska k bližnímu je neoddělitelná od lásky k Bohu a skutky dobročinnosti a milosrdenství naplňujeme celý božský zákon.\n\n$pam_matthew_22_39_default$"
 tenet_love_thy_neighbour_default_historical_glossary: "[Glossary('Miluj bližního svého','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_historical_desc: "Přikázání milovat bližního je ústředním bodem křesťanské etiky. Vychází z knihy Leviticus 19:18 a Kristus je povýšil na úroveň lásky k Bohu jako shrnutí celého božského zákona. Raní církevní otcové, například Klement Alexandrijský a Jan Zlatoústý, zdůrazňovali, že pravá láska se musí rozšířit za hranice rodiny a přátel a zahrnovat celé lidstvo, včetně cizinců a nepřátel. Toto učení inspirovalo v průběhu středověku vznik křesťanských dobročinných institucí a nemocnic i praxi rozdávání almužen."
 doctrine_parameter_tenet_love_thy_neighbour_county_bonus: "[Concept('counties','hrabství')|EU] této [Concept('faith','víry')|E] s [Concept('county_opinion','lidovým míněním')|E] #P 60+#! mohou získat [Concept('modifier','modifikátor')|E] [GetModifier('tenet_love_thy_neighbour_modifier').GetNameWithTooltip|l]"
 doctrine_parameter_tenet_love_thy_neighbour_hospital_shelter: "[Concept('buildings','budovy')|EU] $building_type_hospices_01$ snižují [Concept('travel_danger','nebezpečí')|E] v [Concept('county','hrabství')|E] o #P 3#! až #P 10#!, přičemž účinek roste s každou úrovní"
 doctrine_parameter_tenet_love_thy_neighbour_hospital_care: "[Concept('buildings','budovy')|EU] $building_type_hospices_01$ poskytují #P +2#! až #P +10#! [Concept('epidemic_resistance','odolnosti vůči moru')|E] v [Concept('province','provincii')|E], přičemž účinek roste s každou úrovní"
 doctrine_parameter_tenet_love_thy_neighbour_foreign_sway: "[Concept('scheme_success_chance','šance na úspěch intriky')|EU] při intrice [GetScheme('sway').GetTypeName|l] proti [Concept('characters','postavám')|E] mimo tvé [Concept('realm','panství')|E]: [success_chance_i]#P +20%#!"
 doctrine_parameter_tenet_love_thy_neighbour_vassalage_acceptance: "Přijetí interakce #high $offer_vassalization_interaction$#!: #P +15#!"
 tenet_love_thy_neighbour_boon_reason: "$tenet_love_thy_neighbour_name$: $VALUE|=+0$"
 tenet_love_thy_neighbour_modifier: "$tenet_love_thy_neighbour_default_name$"
 tenet_love_thy_neighbour_modifier_desc: "Láska k bližnímu je neoddělitelná od lásky k Bohu; skutky dobročinnosti a milosrdenství posloucháme božský zákon."
 pam_love_thy_neighbor_toast_title: "$tenet_love_thy_neighbour_default_name$"
 tenet_divine_liturgy_latin_name: "Divinum Officium"
 tenet_divine_liturgy_greek_name: "Theía Leitourgía"
 tenet_divine_liturgy_default_name: "Božská liturgie"
 tenet_divine_liturgy_name: "$tenet_divine_liturgy_default_name$"
 tenet_divine_liturgy_latin_desc: "Posvátná liturgie je nebem přeneseným na zem, kde se připojujeme k andělům a svatým při věčném uctívání a voláme: Svatý, svatý, svatý je Hospodin zástupů, jehož sláva naplňuje celé stvoření.\n\n$pam_isaiah_6_3_latin$"
 tenet_divine_liturgy_latin_historical_glossary: "[Glossary('Divinum Officium','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_greek_desc: "Při božské liturgii se věřící účastní nebeského uctívání, překonávají čas i prostor a stojí před Božím trůnem společně s cherubíny a serafíny.\n\n$pam_isaiah_6_3_greek$"
 tenet_divine_liturgy_greek_historical_glossary: "[Glossary('Theía Leitourgía','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_default_desc: "Liturgie je hlavním projevem víry, místem, kde se setkává nebe se zemí a kde se věřící účastní věčného uctívání Boha po boku andělů a svatých.\n\n$pam_isaiah_6_3_default$"
 tenet_divine_liturgy_default_historical_glossary: "[Glossary('Božská liturgie','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_historical_desc: "Božská liturgie se vyvinula z nejstarších křesťanských bohoslužeb; liturgie svatého Basila a liturgie svatého Jana Zlatoústého se staly standardními obřady východního křesťanství. Tyto liturgie zdůrazňovaly mystickou účast věřících na nebeském uctívání. Propracované obřady, kadidlo, ikony a zpěvy vytvářely smyslový zážitek božské přítomnosti. Liturgie nebyla chápána jen jako lidské uctívání Boha, ale jako vstup věřících do věčného nebeského uctívání, které překonává hranice času a prostoru."
 doctrine_parameter_tenet_divine_liturgy_temple_piety: "Poskytuje [GetModifier('tenet_divine_liturgy_choirs_modifier').GetNameWithTooltip|l]"
 doctrine_parameter_tenet_divine_liturgy_well_sung_liturgy: "Poskytuje [GetModifier('tenet_divine_liturgy_officiant_modifier').GetNameWithTooltip|l]\n$modifier_definition_value_per_chaplain_learning$"
 doctrine_parameter_tenet_divine_liturgy_schola_cantorum: "Tvůj [Concept('court_chaplain','dvorní kaplan')|E] získá #P +2#! [Concept('learning','učenosti')|E]"
 tenet_aniconism_latin_name: "Iconomachia"
 tenet_aniconism_greek_name: "Eikonomakhía"
 tenet_aniconism_default_name: "$tenet_aniconism_name$"
 tenet_aniconism_latin_desc: "Hospodine, jen ty jediný jsi hoden uctívání. Chraň nás před léčky modloslužby, abychom tě mohli uctívat v duchu a pravdě, nikoli skrze obrazy vytvořené lidskýma rukama, ale čistým srdcem pozvednutým k tobě.\n\n$pam_exodus_20_4_latin$"
 tenet_aniconism_latin_historical_glossary: "[Glossary('Iconomachia','tenet_aniconism_historical_desc')]"
 tenet_aniconism_greek_desc: "Uctívání obrazů není schváleno Písmem ani tradicí církevních otců. Ikonoklasmus je pravým učením církve, které očišťuje věřící od modloslužby obrazů.\n\n$pam_exodus_20_4_greek$"
 tenet_aniconism_greek_historical_glossary: "[Glossary('Eikonomakhía','tenet_aniconism_historical_desc')]"
 tenet_aniconism_default_desc: "Nezhotovíš si modlu ani podobu ničeho. Uctívání obrazů je zkažením pravé víry.\n\n$pam_exodus_20_4_default$"
 tenet_aniconism_default_historical_glossary: "[Glossary('Anikonismus','tenet_aniconism_historical_desc')]"
 tenet_aniconism_historical_desc: "Vyhýbání se náboženským obrazům, jejich zákaz i ničení mají v abrahámovských tradicích hluboké kořeny. V křesťanství se nejvýrazněji projevily během prvního byzantského ikonoklasmu (726–843 n. l.), který zahájil císař Leon III. a pokračoval v něm Konstantin V. Šlo o období rozsáhlého ničení náboženských obrazů a pronásledování těch, kdo uctívali ikony.\n\nIkonoklasté tvrdili, že uctívání ikon porušuje biblický zákaz tesaných obrazů. Druhý nikajský koncil v roce 787 n. l. ikonoklasmus odsoudil a poukázal na podobnosti mezi uctíváním prostřednictvím ikon a prostřednictvím psaného evangelia. Ikonoklasmus znovu ožil za vlády Leona V. v roce 814 n. l. Podobné obrazoborecké tendence se později objevily v různých protestantských hnutích."
 tenet_alexandrian_catechism_latin_name: "Catechesis Alexandrina"
 tenet_alexandrian_catechism_greek_name: "Alexandrinē Katēkhēsis"
 tenet_alexandrian_catechism_default_name: "$tenet_alexandrian_catechism_name$"
 tenet_alexandrian_catechism_latin_desc: "Kriste, věčná Moudrosti Boží, osviť naši mysl, abychom mohli poznat skrytá tajemství tvého svatého Písma. Dej nám oči, které dohlédnou za písmeno, až k duchu, jenž dává život.\n\n$pam_1_corinthians_1_30_latin$"
 tenet_alexandrian_catechism_latin_historical_glossary: "[Glossary('Catechesis Alexandrina','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_greek_desc: "Alexandrijská tradice zastává názor, že božská moudrost se zjevuje alegorickým výkladem Písma. Kristus je Logos, božské Slovo, skrze něž se odhaluje veškerá pravda.\n\n$pam_1_corinthians_1_30_greek$"
 tenet_alexandrian_catechism_greek_historical_glossary: "[Glossary('Alexandrinē Katēkhēsis','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_default_desc: "Alexandrijská škola klade důraz na alegorický výklad Písma a propojení křesťanské teologie s řeckou filozofií. Hledá hlubší duchovní významy skryté pod doslovným textem.\n\n$pam_1_corinthians_1_30_default$"
 tenet_alexandrian_catechism_default_historical_glossary: "[Glossary('Alexandrijský katechismus','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_historical_desc: "Alexandrijská katechetická škola, založená na konci 2. století, byla nejstarší křesťanskou institucí vyššího vzdělávání. Za učitelů, jako byli Klement Alexandrijský a Órigenés, vyvinula propracovanou metodu biblického výkladu, která v Písmu hledala alegorické a duchovní významy. Škola propojovala křesťanskou teologii s platónskou filozofií a tvrdila, že řecké vzdělání připravilo cestu evangeliu.\n\nÓrigenovy exegetické metody a teologické spekulace hluboce ovlivnily východní křesťanství, zatímco důraz školy na alegorický výklad stál v protikladu k doslovnějšímu přístupu antiochijské školy."
 tenet_adoptionism_latin_name: "Filius Adoptivus"
 tenet_adoptionism_greek_name: "Hyiothesía"
 tenet_adoptionism_default_name: "Adopcianismus"
 tenet_adoptionism_name: "$tenet_adoptionism_default_name$"
 tenet_adoptionism_latin_desc: "Otče, jenž jsi pohlédl na spravedlivého muže Ježíše a vyvolil si ho, dej, ať i my jsme hodni přijetí za děti. Jako jsi ho pozvedl z vod a prohlásil za svého milovaného, pozvedni i nás z naší nízkosti do své božské rodiny.\n\n$pam_mark_1_11_latin$"
 tenet_adoptionism_latin_historical_glossary: "[Glossary('Filius Adoptivus','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_greek_desc: "Bože, jenž pozvedáš pokorné a vybíráš si spravedlivé, chválíme tě za tajemství přijetí za děti. Jako byl Kristus tvou milostí povýšen na Božího syna, kéž jsme i my zařazeni mezi tvé děti.\n\n$pam_mark_1_11_greek$"
 tenet_adoptionism_greek_historical_glossary: "[Glossary('Hyiothesía','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_default_desc: "Hospodine, pomoz nám pochopit tajemství povýšení tvého Syna. Kéž následujeme jeho příkladu spravedlnosti, abychom i my mohli být nazýváni Božími dětmi.\n\n$pam_mark_1_11_default$"
 tenet_adoptionism_default_historical_glossary: "[Glossary('Adopcianismus','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_historical_desc: "Adopcianismus učí, že se Ježíš narodil jako obyčejný člověk a později byl „adoptován“ jako Boží Syn, obvykle při křtu, kdy na něj sestoupil Duch svatý. Rané podoby tohoto učení se objevily ve 2. století u Theodota z Byzance, jehož dynamický monarchianismus zdůrazňoval jednotu Boha.\n\nUčení se znovu objevilo v 8. století ve Španělsku za arcibiskupa Elipanda z Toleda a biskupa Felixe z Urgellu. Podle nich byla Kristova božská přirozenost věčně zplozená, zatímco jeho lidská přirozenost byla adoptována. Frankfurtský koncil odsoudil španělský adopcianismus jako herezi v roce 794 n. l.; adopcianistické myšlenky přesto ovlivnily pozdější antitrinitářská hnutí."
 doctrine_parameter_tenet_adoptionism_adoption_always_possible: "[Concept('interaction','interakce')|EU] [Concept('adopt','adoptovat')|E] je vždy dostupná bez obvyklých požadavků (cíl však musí být nadále způsobilý a podřízený manželský partner nemůže adoptovat)"
 doctrine_parameter_tenet_adoptionism_adoption_accepted: "[Concept('vassals','vazalové')|EU] a děti, které následují tento [Concept('rite','ritus')|E], nemají výhrady k [Concept('adopt','adopci')|E] (zamezí se ztrátě [Concept('opinion','mínění')|E] v rozmezí #N -10#! až #N -25#!)"
 doctrine_parameter_tenet_adoptionism_adoption_personal_active: "[Concept('interaction','interakce')|EU] [Concept('adopt','adoptovat')|E] je ti vždy dostupná, bez obvyklých požadavků (její cíl však musí být stále způsobilý)"
 doctrine_parameter_tenet_adoptionism_sp_on_adopt: "@legitimacy_icon![Concept('legitimacy','legitimita')|EU], @piety_icon![Concept('piety','zbožnost')|E] a @spiritual_fulfillment_icon![Concept('spiritual_fulfillment','duchovní naplnění')|E] při [Concept('adopt','adopci')|E] [Concept('character','postavy')|E]"
 pam_adoptionism_adopt_sp_toast: "Osobní zásada [GetTenetType('tenet_adoptionism').GetName( GetPlayer.GetRite )|l]"
 doctrine_parameter_tenet_adoptionism_legitimize_bastards: "[Concept('interaction','interakce')|EU] [Concept('legitimized_bastard','legitimizovat levobočka')|E] stojí #P 50%#! méně @prestige_icon![Concept('prestige','prestiže')|E], pokud to tvá [Concept('faith','víra')|E] dovoluje"
 doctrine_parameter_tenet_adoptionism_legitimize_own_children: "[Concept('interaction','interakce')|EU] [Concept('legitimized_bastard','legitimizovat levobočka')|E] lze použít na tvé vlastní [Concept('children','děti')|E] z jiného [Concept('house','rodu')|E], pokud to tvá [Concept('faith','víra')|E] dovoluje"
 tenet_armed_pilgrimages_latin_name: "Peregrinatio Armata"
 tenet_armed_pilgrimages_greek_name: "Énoplon Proskýnēma"
 tenet_armed_pilgrimages_default_name: "$tenet_armed_pilgrimages_name$"
 tenet_armed_pilgrimages_latin_desc: "Hospodine, posilni naše paže, když pozvedáme kříž ve tvém svatém jménu. Veď naše kroky na posvátné cestě, abychom mohli bránit víru a osvobodit svatá místa z rukou nevěřících.\n\n$pam_matthew_16_24_latin$"
 tenet_armed_pilgrimages_latin_historical_glossary: "[Glossary('Peregrinatio Armata','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_greek_desc: "Věřící jsou povoláni následovat Krista a vzít na sebe kříž nejen duchovně, ale také při obraně svatých míst. Ozbrojená pouť je zbožným činem, cestou víry chráněnou mečem.\n\n$pam_matthew_16_24_greek$"
 tenet_armed_pilgrimages_greek_historical_glossary: "[Glossary('Énoplon Proskýnēma','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_default_desc: "Pouť na svatá místa je posvátnou povinností a věřící jsou povoláni tato místa i své spolupoutníky v případě potřeby bránit se zbraní v ruce.\n\n$pam_matthew_16_24_default$"
 tenet_armed_pilgrimages_default_historical_glossary: "[Glossary('Ozbrojené poutě','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_historical_desc: "Spojení duchovní cesty na svatá místa s vojenským úsilím o jejich obranu či znovudobytí. Křížové výpravy, které začaly roku 1095 výzvou papeže Urbana II. na koncilu v Clermontu, představovaly nejorganizovanější podobu ozbrojené pouti. Křižáci získávali plnomocné odpustky a svou vojenskou službu považovali za skutek pokání a zbožnosti.\n\nTato myšlenka navazovala na starší tradice kajícího válečnictví a obrany křesťanstva před vnějšími hrozbami. Proměnila tak pouť z mírové cesty ve válečný projev víry."
 tenet_communal_identity_latin_name: "Populus Dei"
 tenet_communal_identity_greek_name: "Laòs Theoũ"
 tenet_communal_identity_default_name: "$tenet_communal_identity_name$"
 tenet_communal_identity_latin_desc: "Jsme vyvolený rod, královské kněžstvo, svatý národ oddělený Bohem. Kéž hlásáme jeho mocné skutky a žijeme důstojně jako jeho lid, k čemuž jsme byli povoláni.\n\n$pam_1_peter_2_9_latin$"
 tenet_communal_identity_latin_historical_glossary: "[Glossary('Populus Dei','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_greek_desc: "Byli jsme povoláni z temnoty do jeho podivuhodného světla; jsme svatý národ, lid, který si Bůh vyvolil za své vlastnictví. V Kristu jsme spojeni v jedno tělo.\n\n$pam_1_peter_2_9_greek$"
 tenet_communal_identity_greek_historical_glossary: "[Glossary('Laòs Theoũ','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_default_desc: "Věřící jsou sjednoceni jako Boží vyvolený lid, společenství oddělené od světa, které sdílí společnou identitu a poslání v Kristu.\n\n$pam_1_peter_2_9_default$"
 tenet_communal_identity_default_historical_glossary: "[Glossary('Pospolitá identita','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_historical_desc: "Představa církve jako „Božího lidu“ vychází ze starozákonního obrazu Izraele jako Božího vyvoleného lidu, nově vykládaného ve světle Nové smlouvy. První křesťané se chápali jako nový Izrael, sjednocený nikoli krví či etnickým původem, nýbrž vírou v Krista.\n\nTato pospolitá identita překračovala společenské, etnické i národní hranice a vytvářela univerzální bratrství. Druhý vatikánský koncil ve své konstituci Lumen gentium výrazně představil „Boží lid“ jako ústřední obraz církve a zdůraznil její poutnickou povahu i společnou důstojnost všech pokřtěných."
 tenet_consolamentum_latin_name: "Consolamentum"
 tenet_consolamentum_greek_name: "Paráklēsis"
 tenet_consolamentum_default_name: "Consolamentum"
 tenet_consolamentum_latin_desc: "Hospodine, bojovali jsme dobrý boj, běh jsme dokončili, víru zachovali. Přijmi nyní svého služebníka do útěchy Ducha, aby se duše osvobodila z pout tohoto hmotného světa.\n\n$pam_2_timothy_4_7_latin$"
 tenet_consolamentum_latin_historical_glossary: "[Glossary('Consolamentum','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_greek_desc: "Vkládáním rukou a modlitbou věřících přijímá duch božskou útěchu. Dobrý boj byl vybojován, běh dokončen a víra zachována až do samého konce.\n\n$pam_2_timothy_4_7_greek$"
 tenet_consolamentum_greek_historical_glossary: "[Glossary('Paráklēsis','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_default_desc: "Posvátným obřadem duchovní útěchy přijímají věřící Ducha svatého a připravují se na cestu z tohoto světa do onoho.\n\n$pam_2_timothy_4_7_default$"
 tenet_consolamentum_default_historical_glossary: "[Glossary('Consolamentum','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_historical_desc: "Consolamentum bylo ústřední svátostí katarské víry a spojovalo prvky křtu, biřmování, svěcení a posledního pomazání. Udělovalo se vkládáním rukou a mělo podle víry udělit Ducha svatého a osvobodit duši od hmotného světa.\n\nVětšina věřících je přijímala až na smrtelné posteli, zatímco ti, kdo je přijali v plném zdraví, se stávali „Perfecti“ či „Bons Hommes“ a zavazovali se k přísně asketickému životu. Obřad měl kořeny v raně křesťanských praktikách duchovního křtu a možná byl ovlivněn východní bogomilskou tradicí."
 tenet_divine_marriage_latin_name: "Matrimonium Sacrum"
 tenet_divine_marriage_greek_name: "Hieròs Gámos"
 tenet_divine_marriage_default_name: "$tenet_divine_marriage_name$"
 tenet_divine_marriage_latin_desc: "Hospodine, nespojila nás v tomto posvátném svazku žádostivost, nýbrž upřímnost a pravda. Dej, ať nalezneme milost a společně se dožijeme stáří, zachovávajíce posvátnost našeho pouta.\n\n$pam_tobit_8_7_latin$"
 tenet_divine_marriage_latin_historical_glossary: "[Glossary('Matrimonium Sacrum','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_greek_desc: "Manželství v rámci společenství věřících zachovává posvátnou pokrevní linii a udržuje čistotu před Bohem. Takové svazky jsou žehnány nikoli v žádostivosti, ale v pravdě, aby se manželovi i manželce dostalo milosti.\n\n$pam_tobit_8_7_greek$"
 tenet_divine_marriage_greek_historical_glossary: "[Glossary('Hieròs Gámos','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_default_desc: "Posvátné manželství v rámci společenství věřících udržuje duchovní čistotu a po generace zachovává posvátnost náboženské pokrevní linie.\n\n$pam_tobit_8_7_default$"
 tenet_divine_marriage_default_historical_glossary: "[Glossary('Božský sňatek','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_historical_desc: "Představa posvátného manželství neboli endogamie, tedy sňatků pouze v rámci náboženských společenství, má v mnoha tradicích dávné kořeny. V zoroastrismu se praktikovalo xwedodah (manželství mezi blízkými příbuznými), aby se zachovala duchovní zásluha a rodinný majetek. Cílem bylo uchovat náboženskou čistotu, upevnit duchovní moc a zachovat posvátné i panovnické pokrevní linie.\n\nAčkoli byly takové sňatky kontroverzní a okolními pozorovateli často nepochopené, jejich stoupenci je považovali za naplnění božích přikázání zachovávat posvátnost svého společenství."
 tenet_gnosticism_latin_name: "Gnosis"
 tenet_gnosticism_greek_name: "Gnõsis"
 tenet_gnosticism_default_name: "$tenet_gnosticism_name$"
 tenet_gnosticism_latin_desc: "Božská Moudrosti, skrytá od věků, odhal nám tajemství duchovní říše. Osvoboď naše duše z vězení hmoty, abychom mohli vystoupit k plnosti světla a poznání.\n\n$pam_1_corinthians_2_7_latin$"
 tenet_gnosticism_latin_historical_glossary: "[Glossary('Gnosis','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_greek_desc: "Pravá spása přichází skrze gnózi, tajné poznání božských věcí skrytých před hmotným světem. Promlouváme Boží moudrost v tajemství, skrytou moudrost, kterou Bůh před věky ustanovil k naší slávě.\n\n$pam_1_corinthians_2_7_greek$"
 tenet_gnosticism_greek_historical_glossary: "[Glossary('Gnõsis','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_default_desc: "Spásy lze dosáhnout tajným duchovním poznáním, které odhaluje božskou jiskru v nitru a cestu k úniku z hmotného světa stvořeného Demiurgem.\n\n$pam_1_corinthians_2_7_default$"
 tenet_gnosticism_default_historical_glossary: "[Glossary('Gnosticismus','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_historical_desc: "Gnosticismus zahrnuje rozmanitá náboženská hnutí raně křesťanské éry, která zdůrazňovala spásu skrze gnózi neboli esoterické poznání. Gnostici obvykle chápali hmotný svět jako nedokonalé stvoření nižšího božstva (Demiurga), zatímco pravý Bůh zůstával skrytý a transcendentní. Lidské duše měly podle nich obsahovat božské jiskry uvězněné v hmotě, jež bylo možné osvobodit tajným poznáním.\n\nMezi významné gnostické učitele patřili Valentin, Basilidés a Markión. Církevní otcové, například Irenej a Tertulián, rozsáhle psali proti gnostickému učení, které považovali za heretické odklonění od apoštolského křesťanství."
 tenet_mendicant_preachers_latin_name: "Pax et Bonum"
 tenet_mendicant_preachers_greek_name: "Ptōkhoì Kērykes"
 tenet_mendicant_preachers_default_name: "$tenet_mendicant_preachers_name$"
 tenet_mendicant_preachers_latin_desc: "Hospodine, jako jsi vyslal své apoštoly bez zlata a stříbra, tak i my vyrážíme v chudobě a spoléháme pouze na tvou prozřetelnost. Dej nám milost hlásat tvé evangelium prostě a pravdivě.\n\n$pam_matthew_10_9_latin$"
 tenet_mendicant_preachers_latin_historical_glossary: "[Glossary('Pax et Bonum','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_greek_desc: "Žebraví kazatelé následují příklad Krista, který neměl, kam by složil hlavu, a dobrovolně přijímají chudobu. Na cestu si nic neberou a při šíření evangelia důvěřují Božímu zaopatření.\n\n$pam_matthew_10_9_greek$"
 tenet_mendicant_preachers_greek_historical_glossary: "[Glossary('Ptōkhoì Kērykes','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_default_desc: "Řeholní řády zasvěcené chudobě a kázání putují bez majetku, aby šířily víru, a v každodenních potřebách důvěřují božské prozřetelnosti.\n\n$pam_matthew_10_9_default$"
 tenet_mendicant_preachers_default_historical_glossary: "[Glossary('Žebraví kazatelé','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_historical_desc: "Žebravé řády vznikly ve 13. století jako reakce na bohatství a světskost zavedené církve. Druhý lyonský koncil v roce 1274 uznal čtyři hlavní řády: karmelitány, františkány Františka z Assisi, dominikány Dominika de Guzmána a augustiniány.\n\nNa rozdíl od mnišských řádů, které společně vlastnily majetek, přijali žebraví řeholníci společnou i osobní chudobu a žili téměř výhradně z almužen. Působili především ve městech, kde kázali, a kladli důraz na vzdělávání a učenost. Ideál žebravých řádů přímo vycházel z Kristových pokynů apoštolům v Matoušovi 10,9–10, aby si na cestu nic nebrali."
 tenet_pentarchy_latin_name: "Quinque Sedes"
 tenet_pentarchy_greek_name: "Pentarkhía"
 tenet_pentarchy_default_name: "$tenet_pentarchy_alternate_name$"
 tenet_pentarchy_latin_desc: "Kdekoli se shromáždíme ve jménu Krista, je s námi. Pět velkých stolců Říma, Konstantinopole, Alexandrie, Antiochie a Jeruzaléma tvoří pilíře církve.\n\n$pam_matthew_18_20_latin$"
 tenet_pentarchy_latin_historical_glossary: "[Glossary('Quinque Sedes','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_greek_desc: "Naši církev spravuje pět patriarchátů ustanovených v apoštolských dobách. Kristus je přítomen všude, kde se shromažďuje jeho lid, a skrze pentarchii se jeho autorita uplatňuje po celém světě.\n\n$pam_matthew_18_20_greek$"
 tenet_pentarchy_greek_historical_glossary: "[Glossary('Pentarkhía','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_default_desc: "Všeobecnou církev spravuje pět starobylých patriarchálních stolců, z nichž každý má pravomoc nad svým krajem a prostřednictvím koncilního společenství udržuje jednotu.\n\n$pam_matthew_18_20_default$"
 tenet_pentarchy_default_historical_glossary: "[Glossary('Pentarchie','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_historical_desc: "Pentarchie byla modelem správy církve, který uznával pět hlavních patriarchálních stolců: Řím, Konstantinopol, Alexandrii, Antiochii a Jeruzalém. Byla formalizována chalkedonským koncilem v roce 451 n. l. a odrážela politický význam těchto měst v Římské říši. Každý patriarcha spravoval svůj kraj a spory se předkládaly ekumenickým koncilům.\n\nŘím, který si nárokoval papežskou svrchovanost, tento systém nikdy plně nepřijal. Obléhání Alexandrie v roce 641 n. l. jím otřáslo a velké schizma z roku 1054 jej rozlomilo. Východní pravoslaví pentarchický ideál nadále ctí a později vznikly nové patriarcháty v Rusku, Srbsku i jinde."
 tenet_unrelenting_faith_latin_name: "Fides Indefessa"
 tenet_unrelenting_faith_greek_name: "Pístis Akatapónētos"
 tenet_unrelenting_faith_default_name: "$tenet_unrelenting_faith_name$"
 tenet_unrelenting_faith_latin_desc: "Pane, posilni naši víru, podstatu věcí, v něž doufáme, a přesvědčení o věcech neviditelných. Dej, ať pevně obstojíme ve všech protivenstvích a nikdy nezakolísáme ve své oddanosti Tobě.\n\n$pam_hebrews_11_1_latin$"
 tenet_unrelenting_faith_latin_historical_glossary: "[Glossary('Fides Indefessa','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_greek_desc: "Víra je jistotou věcí, v něž doufáme, přesvědčením o věcech neviditelných. Neotřesitelnou vírou překonávají věrní všechny zkoušky a pronásledování a pevně stojí až do smrti.\n\n$pam_hebrews_11_1_greek$"
 tenet_unrelenting_faith_greek_historical_glossary: "[Glossary('Pístis Akatapónētos','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_default_desc: "Víra, kterou nemůže otřást pronásledování, utrpení ani pochybnosti. Věřící jsou povoláni, aby pevně setrvali ve svém přesvědčení bez ohledu na světské následky.\n\n$pam_hebrews_11_1_default$"
 tenet_unrelenting_faith_default_historical_glossary: "[Glossary('Neochvějná víra','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_historical_desc: "Příklady mučedníků a vyznavačů víry sloužily v průběhu křesťanských dějin jako vzory. Od nejranějších pronásledování za Nerona a Diokleciána až po pozdější zkoušky, jako byla cesta misionářů, kteří putovali a umírali při snaze obrátit nepřátelské národy na víru — například Adalberta Pražského — byli křesťané povoláni zachovat si víru až do smrti.\n\nPřesvědčení, že víru je třeba hájit, zachovávat a šířit bez ohledu na cenu, inspirovalo mnohá mnišská hnutí i misijní výpravy. Příběhy světců, kteří pro své přesvědčení snášeli mučení a popravu, posilovaly odhodlání věřících a nabízely jim jistou cestu ke spáse."
 tenet_miaphysitism_latin_name: "Miaphysitismus"
 tenet_miaphysitism_greek_name: "Miaphysitismós"
 tenet_miaphysitism_default_name: "Miafyzitismus"
 tenet_miaphysitism_name: "$tenet_miaphysitism_default_name$"
 tenet_miaphysitism_latin_desc: "Efezský koncil nebyl loupeživým sněmem. Blud Chalcedonu musí být napraven. Božská a lidská přirozenost jsou sjednoceny bez smíšení, bez proměny, bez rozdělení a bez odloučení v jediné osobě Krista.\n\n$pam_colossians_2_9_latin$"
 tenet_miaphysitism_latin_historical_glossary: "[Glossary('Miaphysitismus','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_greek_desc: "Efezský koncil správně obnovil Eutycha a odsoudil Flaviána. Kristus má jednu sjednocenou božsko-lidskou přirozenost, je plně Bohem i plně člověkem, bez jakéhokoli smíšení či odloučení.\n\n$pam_colossians_2_9_greek$"
 tenet_miaphysitism_greek_historical_glossary: "[Glossary('Miaphysitismós','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_default_desc: "Kristus má jednu sjednocenou přirozenost, která je zároveň božská i lidská a je neoddělitelně spojena ve Vtělení.\n\n$pam_colossians_2_9_default$"
 tenet_miaphysitism_default_historical_glossary: "[Glossary('Miafyzitismus','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_historical_desc: "Miafyzitismus, od řeckého #weak mia#! (jedna) a #weak physis#! (přirozenost), zastává názor, že v Kristu jsou božská a lidská přirozenost sjednoceny v jednu složenou přirozenost, aniž by se smísily či oddělily. Prosazoval jej Cyril Alexandrijský pomocí formule #weak mia physis tou theou logou sesarkōménē#! (jedna vtělená přirozenost Božího Slova). Od monofyzitismu se odlišuje tím, že v rámci jednoty zachovává plnou skutečnost obou přirozeností.\n\nChalcedonský koncil roku 451 tuto formuli odmítl ve prospěch diofyzitismu (dvou přirozeností) a orientální pravoslavné církve (koptská, arménská, etiopská a syrská) se oddělily od byzantské církve. Svou miafyzitskou teologii si zachovávají dodnes."
