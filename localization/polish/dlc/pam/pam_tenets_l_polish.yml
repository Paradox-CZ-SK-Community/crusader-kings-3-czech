 tenet_peace_of_god_irish_name: "Cáin Adomnáin" # todo: NEW TRANSLATION
 tenet_peace_of_god_latin_name: "Pax et Treuga Dei" # todo: NEW TRANSLATION
 tenet_peace_of_god_greek_name: "Ekekheiría Theoũ" # todo: NEW TRANSLATION
