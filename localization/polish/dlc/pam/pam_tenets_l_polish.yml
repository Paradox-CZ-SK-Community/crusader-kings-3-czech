 tenet_peace_of_god_irish_desc: "Známý také jako Zákon nevinných, stanovil pravidla, která měla zajistit bezpečí nebojujících během války. Ti, kdo tato pravidla porušili, i přihlížející, kteří zločinu nezabránili, podléhali světským pokutám a rituálním kletbám.\n\n$pam_colossians_3_15_default$\n\n[Glossary('Cáin Adomnáin Historical Background','tenet_peace_of_god_historical_desc')]" # todo: NEW TRANSLATION
 tenet_peace_of_god_latin_desc: "Od adventu až do oktávu Zjevení Páně je třeba neporušitelně dodržovat příměří a každý, kdo je poruší, má být potrestán exkomunikací.\n\n$pam_colossians_3_15_latin$\n\n[Glossary('Pax et Treuga Dei  Historical Background','tenet_peace_of_god_historical_desc')]" # todo: NEW TRANSLATION
 tenet_peace_of_god_greek_desc: "Kristovi učedníci, jenž všechno stvořil pro mír, mají být tvůrci míru. Kdo hledá mír, hledá Krista. Bez lásky k druhým a bez mírumilovného postoje ke všem lidem nemůže být nikdo nazýván pravým Kristovým služebníkem.\n\n$pam_colossians_3_15_greek$\n\n[Glossary('Ekekheiría Theoũ Historical Background','tenet_peace_of_god_historical_desc')]" # todo: NEW TRANSLATION
 tenet_peace_of_god_default_desc: "Nesmyslné násilí páchané na našich bratřích a sestrách je urážkou Boha.\n\n[Glossary('Peace of God Historical Background','tenet_peace_of_god_historical_desc')]" # todo: NEW TRANSLATION
 tenet_peace_of_god_historical_desc: "Během celého středověku se různá křesťanská hnutí snažila omezit krveprolití zavedením formálních pravidel vedení bojů. Od irského Cáin Adomnáin v 7. století po hnutí Božího míru ve Francii v 10. století se tato úsilí zaměřovala na ochranu církevního majetku a osob, omezení násilí vůči nebojujícím a omezení bojů mezi šlechtici na určitá místa a dobu.\n\nTato pravidla se často vztahovala i na nevěřící. Kánon XXI třetího lateránského koncilu z roku 1179 rozšířil pravidelná příměří na celé křesťanstvo, zatímco kánon XXVII vyzýval k pozvednutí zbraní proti katarům, Baskům a dalším kacířům." # todo: NEW TRANSLATION
 doctrine_parameter_tenet_peace_of_god_same_faith_war_piety_penalty: "Vyhlášení [war|E] [ruler|E] stejné [faith|E] stojí @piety_icon![piety|E]" # todo: NEW TRANSLATION
 doctrine_parameter_tenet_peace_of_god_coreligionist_war_reluctance: "[rulers|E] s vlastností [GetTrait('zealous').GetName( GetNullCharacter )] méně často vyhlašují [war|E] uvnitř své [faith|E]" # todo: NEW TRANSLATION
 doctrine_parameter_tenet_peace_of_god_holy_war_call_reluctance: "[rulers|E] tohoto [rite|E] mnohem méně často přijímají [interaction|E] #high $ecclesiastic_incite_holy_war_interaction$#!" # todo: NEW TRANSLATION
