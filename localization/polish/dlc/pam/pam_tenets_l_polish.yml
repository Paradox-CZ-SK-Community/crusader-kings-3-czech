 tenet_apostolic_succession_name: "$tenet_apostolic_succession_default_name$" # todo: NEW TRANSLATION
 tenet_apostolic_succession_latin_desc: "Přednost v cti a pravomoci, kterou Kristus udělil apoštolu Petrovi a která se dědí na jeho nástupce, papeže.\n\n$pam_matthew_16_18_latin$\n\n[Glossary('Successio Apostolica Historical Background','tenet_apostolic_succession_historical_desc')]" # todo: NEW TRANSLATION
 tenet_apostolic_succession_greek_desc: "Prvním biskupem římské církve byl Linus, syn Claudiin, kterého vysvětil Pavel.\n\n$pam_matthew_16_18_greek$\n\n[Glossary('Apostolikē Diadokhē Historical Background','tenet_apostolic_succession_historical_desc')]" # todo: NEW TRANSLATION
 tenet_apostolic_succession_default_desc: "Nepřerušená posloupnost biskupů od apoštolů až do dnešních dnů, která zajišťuje autentické předávání víry.\n\n$pam_matthew_16_18_default$\n\n[Glossary('Apostolic Succession Historical Background','tenet_apostolic_succession_historical_desc')]" # todo: NEW TRANSLATION
 tenet_apostolic_succession_historical_desc: "Nauka o apoštolské posloupnosti tvrdí, že biskupové odvozují svou autoritu od nepřerušeného řetězce svěcení sahajícího až k samotným apoštolům. Irenej z Lyonu ve 2. století použil apoštolskou posloupnost jako argument proti gnostickým herezím a ukázal, že pravé Kristovo učení se zachovalo prostřednictvím legitimních biskupů církve.\n\nOd 13. století nosí papežové Rybářský prsten jako symbol nástupnictví po svatém Petrovi. Východní pravoslavní uznávají linii západních papežů i jejich úlohu v raném křesťanství, Petrovi však nepřiznávají vyšší postavení než ostatním apoštolům a za prvního římského biskupa považují papeže Lina." # todo: NEW TRANSLATION
 tenet_apostolic_succession_requires_head_of_faith_tt: "Vaše [faith|E] musí mít [head_of_faith|E]" # todo: NEW TRANSLATION
