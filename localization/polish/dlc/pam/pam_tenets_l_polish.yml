 pam_mortification_suffering_sanctifies_toast: "Z vašeho [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )]: obětujete Bohu utrpení svého těla" # todo: NEW TRANSLATION
 tenet_mortification_of_the_flesh_historical_desc: "Umrtvování těla, zakořeněné ve výzvě svatého Pavla #weak usmrcovat skutky těla#! (Římanům 8:13) a #weak trestat své tělo a podrobovat si je#! (1. Korintským 9:27), bylo ústřední součástí křesťanské askeze již od nejranějších staletí. Mezi jeho nejzazšími praktikanty byli sloupovníci: svatý Simeon Starší strávil 37 let na sloupu nedaleko Aleppa v neustálé modlitbě, snášel žár i mrazivý chlad.\n\nSebemrskačství se rozšířilo ve středověkém západním křesťanství a mezi duchovními je prosazoval svatý Petr Damián (1007–1072). Hnutí flagelantů ve 13. a 14. století přivedlo laiky do ulic měst, kde se v dobách moru a pohrom bičovali na znamení pokání." # todo: NEW TRANSLATION
 tenet_holy_myron_ethiopic_name: "Qeddus Meron" # todo: NEW TRANSLATION
 tenet_holy_myron_latin_name: "Sanctum Chrisma" # todo: NEW TRANSLATION
 tenet_holy_myron_greek_name: "Hágion Mýron" # todo: NEW TRANSLATION
 tenet_holy_myron_default_name: "Svaté myron" # todo: NEW TRANSLATION
 tenet_holy_myron_name: "$tenet_holy_myron_default_name$" # todo: NEW TRANSLATION
 tenet_holy_myron_ethiopic_desc: "Posvátným meronem, který vysvětil Abuna, přijímají věřící pečeť Ducha svatého. Jako sestoupila holubice na Krista při Jeho křtu v Jordánu, sestupuje skrze toto svaté pomazání Duch i na nově pokřtěné a označuje je za Boží děti.\n\n$pam_john_3_5_default$\n\n[Glossary('Qeddus Meron Historical Background','tenet_holy_myron_historical_desc')]" # todo: NEW TRANSLATION
 tenet_holy_myron_latin_desc: "Skrze posvátné křižmo, vysvěcené biskupem, přijímají věřící pečeť daru Ducha svatého. Pomazání završuje milost křtu.\n\n$pam_john_3_5_latin$\n\n[Glossary('Sanctum Chrisma Historical Background','tenet_holy_myron_historical_desc')]" # todo: NEW TRANSLATION
 tenet_holy_myron_greek_desc: "Svaté myron, vysvěcené patriarchou, je pečetí daru Ducha svatého. Skrze toto posvátné pomazání přijímají nově osvícení plnost darů Ducha a stávají se chrámy živého Boha.\n\n$pam_john_3_5_greek$\n\n[Glossary('Hágion Mýron Historical Background','tenet_holy_myron_historical_desc')]" # todo: NEW TRANSLATION
 tenet_holy_myron_default_desc: "Svaté myron neboli posvátné křižmo je zvlášť vysvěcený olej, který se používá při svátosti biřmování, aby nově pokřtěné zpečetil darem Ducha svatého a završil jejich uvedení do církve.\n\n$pam_john_3_5_default$\n\n[Glossary('Holy Myron Historical Background','tenet_holy_myron_historical_desc')]" # todo: NEW TRANSLATION
 tenet_holy_myron_historical_desc: "Svaté myron, z řeckého #weak mýron#!, což znamená vonný olej, se používá při svátosti myropomazání neboli biřmování. Na Východě následuje bezprostředně po křtu, a to i u nemluvňat; na Západě se uděluje samostatně biskupem. Pomazání má hluboké biblické kořeny: jak #weak Christ#!, tak #weak Messiah#! znamenají #weak Pomazaný#!.\n\nVysvěcení nového myronu je vzácnou a slavnostní událostí: do nové dávky se vždy přidává část předchozí, čímž se zachovává nepřerušený řetězec, který má údajně sahat až k apoštolům. Etiopská tradice tvrdí, že recept na #weak Meron#! přinesli Devět svatých, syrští misionáři z 5. století, a jeho vysvěcení vyhrazuje patriarchovi, Abunovi." # todo: NEW TRANSLATION
 doctrine_parameter_tenet_holy_myron_artifact: "Lze vyslat [court_chaplain|E], aby vytvořil [artifact|E] #V Svaté myron#! pomocí [decision|E] [GetDecisionWithKey('pam_prepare_holy_myron_decision').GetName]; jeho náplně se spotřebovávají při žehnání [artifacts|E][AddLocalizationIf( HasDlcFeature( 'coronations' ), 'pam_holy_myron_param_coronation_append')][AddLocalizationIf( HasDlcFeature( 'legends_of_the_dead' ), 'pam_holy_myron_param_funeral_append')]" # todo: NEW TRANSLATION
 pam_holy_myron_param_coronation_append: ", vaší [coronation|E]" # todo: NEW TRANSLATION
 pam_holy_myron_param_funeral_append: " a zesnulým při [funerals|E]" # todo: NEW TRANSLATION
 doctrine_parameter_tenet_holy_myron_artifact_interaction_unlock: "Lze darovat náplně vašeho [artifact|E] #V Svaté myron#! jiným vládcům, za což získáte @piety_icon![piety|E] a [opinion|E]" # todo: NEW TRANSLATION
 doctrine_parameter_tenet_holy_myron_chrismation_bonus: "Vaše novorozené děti získají [modifier|E] [GetModifier('pam_chrismated_child_modifier').GetNameWithTooltip] na #V 16#! let; náplň [artifact|E] #V Svatého myronu#! poskytne [modifier|E] [GetModifier('pam_myron_chrismated_child_modifier').GetNameWithTooltip] natrvalo" # todo: NEW TRANSLATION
 doctrine_parameter_tenet_holy_myron_unction_bonus: "Při onemocnění [ill|E]: zisk @spiritual_fulfillment_icon![spiritual_fulfillment|E], úbytek [stress|E] a [modifier|E] [GetModifier('pam_anointed_with_holy_oil_modifier').GetNameWithTooltip] na #V 2#! roky" # todo: NEW TRANSLATION
 tenet_khachkar_armenian_name: "Chačkar" # todo: NEW TRANSLATION
 tenet_khachkar_latin_name: "Crux Lapidea" # todo: NEW TRANSLATION
 tenet_khachkar_greek_name: "Líthinos Staurós" # todo: NEW TRANSLATION
 tenet_khachkar_default_name: "Chačkary" # todo: NEW TRANSLATION
 tenet_khachkar_name: "$tenet_khachkar_default_name$" # todo: NEW TRANSLATION
 tenet_khachkar_armenian_desc: "Chačkary stojí jako věční svědkové naší víry. Zdobené složitými rytinami křížů, vinné révy a posvátných symbolů jsou modlitbou vytesanou do kamene a oslavují Kříž, skrze nějž byl svět spasen.\n\n$pam_galatians_6_14_default$\n\n[Glossary('Khachkar Historical Background','tenet_khachkar_historical_desc')]" # todo: NEW TRANSLATION
 tenet_khachkar_latin_desc: "Jako Arméni vztyčují své kamenné kříže k nebi, označme i my tuto zemi symboly spásy, Křížem našeho Pána Ježíše Krista.\n\n$pam_galatians_6_14_latin$\n\n[Glossary('Crux Lapidea Historical Background','tenet_khachkar_historical_desc')]" # todo: NEW TRANSLATION
 tenet_khachkar_greek_desc: "Kamenné památníky vytesané s posvátnými symboly dosvědčují Kristovo vítězství a navždy připomínají věřící.\n\n$pam_galatians_6_14_greek$\n\n[Glossary('Líthinos Staurós Historical Background','tenet_khachkar_historical_desc')]" # todo: NEW TRANSLATION
 tenet_khachkar_default_desc: "Kamenné kříže zdobené složitými náboženskými výjevy slouží jako posvátné památníky, označují svatá místa, připomínají zesnulé a oslavují Boží prozřetelnost.\n\n$pam_galatians_6_14_default$\n\n[Glossary('Khachkar Historical Background','tenet_khachkar_historical_desc')]" # todo: NEW TRANSLATION
 tenet_khachkar_historical_desc: "Chačkary, z arménského #weak khach#! (kříž) a #weak k'ar#! (kámen), jsou složitě zdobené kamenné stély s křížem, často umístěným na rozetě či kole věčnosti. Jsou jedinečným prvkem arménské křesťanské kultury, označují svatá místa, připomínají události a vítězství a slouží jako památníky zesnulým.\n\nTato tradice vznikla v 9. století z dřevěných křížů, které svatý Řehoř Osvětitel vztyčoval nad pohanskými chrámy po obrácení Arménie na křesťanství roku 301. Vrcholu dosáhla ve 12. a 13. století za knížat Zakaridů. Každý chačkar je jedinečným dílem mistrů řezbářů, jako byl Momik z Noravanku, a některé z nich, o nichž se věřilo, že mají zázračnou moc, se staly cílem poutí." # todo: NEW TRANSLATION
 doctrine_parameter_tenet_khachkar_decision_unlock: "Po dobu #V 5#! let od zdědění majetku po blízkém příbuzném z [dynasty|E] lze použít [decision|E] [GetDecisionWithKey('pam_raise_khachkar_decision').GetName]" # todo: NEW TRANSLATION
