 pam_hebrews_12_1_greek: "[Glossary('Toigaroũn kaì hēmeĩs tosoũton ékhontes perikeímenon hēmĩn néphos martýrōn, ógkon apothémenoi pánta kaì ten euperístaton hamartían, di hypomones tréchōmen tòn prokeímenon hēmĩn agõna', 'HEBREWS_12_1_GREEK_GLOSS')]"
 pam_acts_7_59_greek: "[Glossary('Kaì elithoboloun tòn Stéphanon epikaloúmenon kaì légonta; kýrie Iēsoũ, déxai tò pneũmá mou.', 'ACTS_7_59_GREEK_GLOSS')]"
 pam_luke_22_19_greek: "[Glossary('Kaì labon árton eucharistesas éklasen kaì édōken autoĩs légōn; Toũtó estin tò sõmá mou tò hypèr hymõn didómenon; toũto poieĩte eis ten emen anάmnēsin.', 'LUKE_22_19_GREEK_GLOSS')]"
 pam_1_corinthians_1_10_greek: "[Glossary('Parakalõ dè hymãs, adelphoí, dià toũ onómatos toũ kyríou hēmõn Iēsoũ Christoũ, hína tò autò légēte pántes kaì me e en hymĩn schísmata, ẽte dè katērtisménoi en to auto noï kaì en te aute gnome.', '1_CORINTHIANS_1_10_GREEK_GLOSS')]"
 pam_1_corinthians_10_16_greek: "[Glossary('Tò poterion tẽs eulogías hò eulogoũmen, ouchì koinōnía estin toũ haímatos toũ Christoũ? tòn árton hòn klõmen, ouchì koinōnía toũ somatos toũ Christoũ estín?', '1_CORINTHIANS_10_16_GREEK_GLOSS')]"
 pam_1_corinthians_10_17_greek: "[Glossary('hóti heĩs ártos, hèn sõma hoi polloí esmen, hoi gàr pántes ek toũ henòs ártou metéchomen.', '1_CORINTHIANS_10_17_GREEK_GLOSS')]"
 pam_john_6_41_greek: "[Glossary('Egóggyzon oũn hoi Ioudaĩoi perì autoũ hóti eĩpen; Ego eimi ho ártos ho katabàs ek toũ ouranoũ', 'JOHN_6_41_GREEK_GLOSS')]"
 pam_1_thessalonians_5_16_20_greek: "[Glossary('Pántote chaírete, adialeíptōs proseúchesthe, en pantì eucharistẽite; toũto gàr thélēma theoũ en Christo Iēsoũ eis hymãs. tò pneũma me sbénnyte, prophēteías me exoutheneĩte', '1_THESSALONIANS_5_16_20_GREEK_GLOSS')]"
 pam_1_thessalonians_4_11_greek: "[Glossary('Kaì philotimeĩsthai hēsychάzein kaì prάssein tà ídia kaì ergάzesthai taĩs chersìn hymõn, kathos hymĩn parēngeílamen', '1_THESSALONIANS_4_11_GREEK_GLOSS')]"
 pam_proverbs_6_6_greek: "[Glossary('Noesei te parabolen kaì skoteinòn lógon rheseis te sophon kaì ainígmata.', 'PROVERBS_6_6_GREEK_GLOSS')]"
 pam_john_19_26_27_greek: "[Glossary('Iēsoũs oũn idon ten mētéra kaì tòn mathēten parestõta hòn ēgάpa légei te mētrí; Gýnai, íde ho hyiós sou. eĩta légei to mathēte; Íde hē metēr sou. kaì ap ekeínēs tẽs horas élaben ho mathētes auten eis tà ídia.', 'JOHN_19_26_27_GREEK_GLOSS')]"
 pam_isaiah_7_14_greek: "[Glossary('Dià toũto dosei Kýrios autòs hymĩn sēmeĩon; idoù hē parthénos en gastrì héxei, kaì téxetai hyión, kaì kaléseis tò ónoma autoũ Emmanouel.', 'ISAIAH_7_14_GREEK_GLOSS')]"
 pam_proverbs_31_20_greek: "[Glossary('Ithi pròs tòn mýrmēka, o oknēré, kaì zelōson idon tàs hodoùs autoũ kaì genoũ ekeínou sophoteros;', 'PROVERBS_31_20_GREEK_GLOSS')]"
 pam_revelation_12_1_greek: "[Glossary('Kaì sēmeĩon méga ophthē en to ourano, gyne peribeblēménē tòn helion, kaì hē selenē hypokάtō tõn podõn autẽs kaì epì tẽs kephalẽs autẽs stéphanos astérōn dodeka', 'REVELATION_12_1_GREEK_GLOSS')]"
 pam_acts_8_18_greek: "[Glossary('Idon dè ho Símōn hóti dià tẽs epithéseōs tõn cheirõn tõn apostólōn dídotai tò pneũma prosenenken autoĩs chremata', 'ACTS_8_18_GREEK_GLOSS')]"
 pam_proverbs_21_20_greek: "[Glossary('Thēsauròs epithymētòs anapaúsetai epì stómatos sophoũ, áphrones dè ándres katapíontai autón.', 'PROVERBS_21_20_GREEK_GLOSS')]"
 pam_luke_16_11_greek: "[Glossary('Ei oũn en to adíko mamōna pistoì ouk egénesthe, tò alēthinòn tís hymĩn pisteúsei?', 'LUKE_16_11_GREEK_GLOSS')]"
 pam_john_10_30_greek: "[Glossary('Ego kaì ho pater hén esmen.', 'JOHN_10_30_GREEK_GLOSS')]"
 pam_john_1_1_greek: "[Glossary('En arche ẽn ho lógos, kaì ho lógos ẽn pròs tòn theón, kaì theòs ẽn ho lógos.', 'JOHN_1_1_GREEK_GLOSS')]"
 pam_hebrews_1_3_greek: "[Glossary('Hòs on apaúgasma tẽs dóxēs kaì charakter tẽs hypostάseōs autoũ, phérōn te tà pánta to rhemati tẽs dynάmeōs autoũ, katharismòn tõn hamartiõn poiēsάmenos ekάthisen en dexia tẽs megalōsýnēs en hypsēloĩs', 'HEBREWS_1_3_GREEK_GLOSS')]"
 pam_acts_1_8_greek: "[Glossary('Allà lempsesthe dýnamin epelthóntos toũ hagíou pneúmatos eph hymãs kaì ésesthé mou mártyres én te Ierousalem kaì en pάse te Ioudaía kaì Samarίa kaì héōs eschάtou tẽs gẽs.', 'ACTS_1_8_GREEK_GLOSS')]"
 pam_acts_2_4_greek: "[Glossary('Kaì eplesthēsan hápantes pneúmatos hagíou kaì erxanto laleĩn hetérais glossais kathos tò pneũma edídou apophthéngesthai autoĩs.', 'ACTS_2_4_GREEK_GLOSS')]"
 pam_acts_2_38_greek: "[Glossary('Pétros dè pròs autoús; Metanoesate, kaì baptisthetō hékastos hymõn en to onómati Iēsoũ Christoũ eis áphesin tõn hamartiõn hymõn kaì lempsesthe ten dōreàn toũ hagíou pneúmatos.', 'ACTS_2_38_GREEK_GLOSS')]"
 pam_2_macabees_12_44_greek: "[Glossary('Ei gàr me toùs propeptōkótas anastenai prosedóka, perissòn àn en kaì lērodes hypèr nekron proseúkhesthai.','2_MACABEES_12_44_GREEK_GLOSS')]"
 pam_matthew_12_25_greek: "[Glossary('Pãsa basileía meristheĩsa kath heautẽs erēmoũtai, kaì pãsa pólis e oikía meristheĩsa kath heautẽs ou stathésetai.','MATTHEW_12_25_GREEK_GLOSS')]"
 pam_matthew_12_32_greek: "[Glossary('Kaì hòs eàn eípe lógon katà toũ hyioũ toũ anthropou, aphethesetai auto; hòs d àn eípe katà toũ pneúmatos toũ hagíou, ouk aphethesetai auto oúte en toúto to aiõni oúte en to méllonti.','MATTHEW_12_32_GREEK_GLOSS')]"
 pam_hebrews_12_29_greek: "[Glossary('Kaì gàr ho theòs hēmõn pỹr katanalískon.', 'HEBREWS_12_29_GREEK_GLOSS')]"
 pam_genesis_1_28_greek: "[Glossary('Kaì eulógēsen autoùs ho Theós, légōn; auxánesthe kaì plēthýnesthe kaì plērosate ten gen kaì katakyrieúsate autes kaì árkhete ton ikhthýōn tes thalássēs kaì ton peteinon toũ ouranoũ kaì pántōn ton ktēnon kaì pásēs tes ges kaì pántōn ton herpeton ton herpóntōn epì tes ges.','GENESIS_1_28_GREEK_GLOSS')]"
 pam_matthew_19_5_greek: "[Glossary('Kaì eĩpen; héneka toútou kataleípsei ánthrōpos tòn patéra kaì ten mētéra kaì kollēthesetai te gynaikì autoũ, kaì ésontai hoi dýo eis sárka mían', 'MATTHEW_19_5_GREEK_GLOSS')]"
 pam_ephesians_4_3_6_greek: "[Glossary('Spoudázontes tēreĩn ten henótēta toũ pneúmatos en to syndésmõi tẽs eirénēs. Hen sõma kaì hen pneũma, kathos kaì eklethēte en mia elpidi tẽs kléseōs hymõn. Heĩs kýrios, mía pístis, hen báptisma. Heĩs theòs kaì pater pántōn, ho epì pántōn kaì dià pántōn kaì en pãsin.', 'EPHESIANS_4_3_6_GREEK_GLOSS')]"
 pam_ephesians_5_25_greek: "[Glossary('Hoi ándres, agapãte tàs gynaĩkas, kathos kaì ho Christòs ēgάpēsen ten ekklēsían kaì heautòn parédōken hypèr autẽs', 'EPHESIANS_5_25_GREEK_GLOSS')]"
 pam_matthew_16_18_greek: "[Glossary('Kago dé soi légō hóti sỳ eĩ Pétros, kaì epì taúte te pétra oikodomesō mou ten ekklēsían kaì pýlai hadou ou katischýsousin autẽs.', 'MATTHEW_16_18_GREEK_GLOSS')]"
 pam_2_timothy_2_2_greek: "[Glossary('Kaì hà ekousas par emoũ dià pollõn martýrōn, taũta paráthọu pistoĩs anthropois, hoítines hikanoì ésontai kaì hetérous didάxai.', '2_TIMOTHY_2_2_GREEK_GLOSS')]"
 pam_titus_1_5_greek: "[Glossary('Toútou chárin apélipon se en Krete, hína tà leíponta epidiorthose kaì katasteses katà pólin presbytérous, hōs ego soi dietaxάmēn', 'TITUS_1_5_GREEK_GLOSS')]"
 pam_james_5_16_greek: "[Glossary('Exomologeĩsthe oũn allelois tàs hamartías kaì proseúchesthe hypèr allelōn, hópōs iathẽte. polỳ ischýei déēsis dikaíou energouménē.', 'JAMES_5_16_GREEK_GLOSS')]"
 pam_1_john_1_9_greek: "[Glossary('Eàn homologõmen tàs hamartías hēmõn, pistós estin kaì díkaios hína aphe hēmĩn tàs hamartías kaì katharíse hēmãs apò pάsēs adikías.', '1_JOHN_1_9_GREEK_GLOSS')]"
