 tenet_scholasticism_latin_name: "Sacra Doctrina" # todo: NEW TRANSLATION
 tenet_scholasticism_greek_name: "Skholastikē" # todo: NEW TRANSLATION
 tenet_scholasticism_default_name: "Scholastika" # todo: NEW TRANSLATION
 tenet_scholasticism_name: "$tenet_scholasticism_default_name$" # todo: NEW TRANSLATION
 tenet_scholasticism_latin_desc: "Hledání poznání je formou uctívání, neboť porozuměním stvoření se přibližujeme porozumění Stvořiteli. Hledej moudrost a bude ti dána.\n\n$pam_proverbs_1_7_latin$\n\n[Glossary('Sacra Doctrina Historical Background','tenet_scholasticism_historical_desc')]" # todo: NEW TRANSLATION
 tenet_scholasticism_greek_desc: "Víra a rozum si neodporují, nýbrž se doplňují, neboť Bůh nám dal mysl, abychom hledali pravdu, a srdce, abychom Ho milovali. Studiem a rozjímáním stoupáme k vyššímu poznání.\n\n$pam_proverbs_1_7_greek$\n\n[Glossary('Skholastikē Historical Background','tenet_scholasticism_historical_desc')]" # todo: NEW TRANSLATION
 tenet_scholasticism_default_desc: "Díky důkladnému intelektuálnímu zkoumání a dialektické metodě lze smířit víru s rozumem a dosáhnout hlubšího porozumění božské pravdě.\n\n$pam_proverbs_1_7_default$\n\n[Glossary('Scholasticism Historical Background','tenet_scholasticism_historical_desc')]" # todo: NEW TRANSLATION
 tenet_scholasticism_historical_desc: "Scholastika byla převládající metodou vzdělávání na středověkých evropských univerzitách a svého vrcholu dosáhla ve 12. a 13. století. Snažila se smířit křesťanskou teologii s klasickou filozofií, zejména s dílem Aristotela.\n\nVýznamní scholastičtí myslitelé, jako Anselm z Canterbury, Petr Abélard, Albert Veliký a Tomáš Akvinský, rozvíjeli systematické přístupy k teologii, které kladly důraz na logickou přesnost a disputace. Teologická suma Tomáše Akvinského zůstává nejvyšším dílem scholastické metody a pokouší se sjednotit veškeré lidské poznání v křesťanském rámci." # todo: NEW TRANSLATION
 doctrine_parameter_tenet_scholasticism_muslim_hebrew_greek_poi: "Návštěva [points_of_interest|E] v [counties|E] vyznávajících [GetReligionByKey('judaism_religion').GetAdjective], [GetReligionByKey('islam_religion').GetAdjective] a [GetReligionByKey('zoroastrianism_religion').GetAdjective] přináší dodatečnou @piety_icon![piety|E], [experience|E] za [learning|E] a @spiritual_fulfillment_icon![spiritual_fulfillment|E]" # todo: NEW TRANSLATION
 doctrine_parameter_tenet_scholasticism_university_bonus: "Dokončení aktivity [GetActivityType('activity_adult_education').GetName] přináší dlouhodobý [modifier|E] [GetModifier('tenet_scholasticism_modifier').GetNameWithTooltip]" # todo: NEW TRANSLATION
