 doctrine_parameter_tenet_peace_of_god_raid_ban: "Nelze podnikat [Concept('raid','nájezdy')|E]"
 doctrine_parameter_tenet_peace_of_god_at_peace_yearly_effects: "Každých #V 5 let#! v [Concept('peace','míru')|E] získávají [Concept('rulers','vládci')|E] odměnu, nejčastěji @legitimacy_icon![Concept('legitimacy','legitimitu')|E]"
 doctrine_parameter_tenet_peace_of_god_personal_yearly_effects: "Každých #V 5 let#! v [Concept('peace','míru')|E] získáš #P 1#! náhodný bod [Concept('skill','dovednosti')|E]"
