 pam_hebrews_11_38_default_short: "[Glossary('Svět jich nebyl hoden...','HEBREWS_11_38_GLOSS')]" # todo: NEW TRANSLATION
 pam_luke_5_16_default_short: "[Glossary('On však odcházel na opuštěná místa a modlil se...','LUKE_5_16_GLOSS')]" # todo: NEW TRANSLATION
 pam_luke_1_42_english: "Požehnaná jsi mezi ženami a požehnaný plod života tvého." # todo: NEW TRANSLATION
 pam_luke_1_79_english: "Zazářit těm, kdo sedí ve tmě a ve stínu smrti, a vést naše nohy na cestu pokoje." # todo: NEW TRANSLATION
 pam_colossians_3_15_english: "Ať ve vašich srdcích vládne Kristův pokoj, k němuž jste byli povoláni v jednom těle. A buďte vděční." # todo: NEW TRANSLATION
 pam_matthew_5_9_english: "Blaze těm, kdo působí pokoj, neboť oni budou nazváni Božími syny." # todo: NEW TRANSLATION
 pam_philippians_4_21_english: "Pozdravte každého svatého v Kristu Ježíši. Bratři a sestry, kteří jsou se mnou, vás pozdravují." # todo: NEW TRANSLATION
 pam_hebrews_12_1_english: "Protože jsme obklopeni tak velikým zástupem svědků, odhoďme i my všechnu přítěž i hřích, který se nás tak snadno přichytí, a vytrvale běžme závod, který je před námi." # todo: NEW TRANSLATION
 pam_acts_7_59_english: "Když Štěpána kamenovali, modlil se: Pane Ježíši, přijmi mého ducha." # todo: NEW TRANSLATION
 pam_luke_22_19_english: "Potom vzal chléb, vzdal díky, rozlámal jej a dal jim se slovy: Toto jest mé tělo, které se za vás vydává. To čiňte na mou památku." # todo: NEW TRANSLATION
 pam_1_corinthians_1_10_english: "Prosím vás, bratři a sestry, ve jménu našeho Pána Ježíše Krista, abyste všichni byli zajedno a #bold nebyly mezi vámi roztržky#!, nýbrž abyste byli spojeni stejnou myslí a stejným úmyslem." # todo: NEW TRANSLATION
 pam_1_corinthians_10_16_english: "Není kalich požehnání, kterému žehnáme, společenstvím Kristovy krve? Není chléb, který lámeme, společenstvím Kristova těla?" # todo: NEW TRANSLATION
 pam_1_corinthians_10_17_english: "Protože je jeden chléb, jsme my mnozí jedno tělo, neboť všichni máme podíl na tom jednom chlebu." # todo: NEW TRANSLATION
 pam_john_6_41_english: "Židé proti němu reptali, protože řekl: Já jsem chléb, který sestoupil z nebe." # todo: NEW TRANSLATION
 pam_1_thessalonians_5_16_20_english: "Stále se radujte, bez ustání se modlete, za všech okolností děkujte, neboť to je vůle Boží v Kristu Ježíši pro vás. Ducha nezhášejte. Proroctvími nepohrdejte." # todo: NEW TRANSLATION
 pam_1_thessalonians_4_11_english: "Usilujte o pokojný život, věnujte se svým věcem a pracujte vlastníma rukama, jak jsme vám přikázali." # todo: NEW TRANSLATION
 pam_proverbs_6_6_english: "Jdi k mravenci, lenochu, pozoruj jeho počínání a zmoudři." # todo: NEW TRANSLATION
 pam_john_19_26_27_english: "Když Ježíš spatřil svou matku a vedle ní učedníka, kterého miloval, řekl matce: „Ženo, hle, tvůj syn.“ Potom řekl učedníkovi: „Hle, tvá matka.“ A od té chvíle ji ten učedník přijal k sobě." # todo: NEW TRANSLATION
 pam_isaiah_7_14_english: "Proto vám dá znamení sám Panovník: Hle, panna počne a porodí syna a dá mu jméno Immanuel." # todo: NEW TRANSLATION
 pam_proverbs_31_20_english: "Svou dlaň otvírá ubožákovi a své ruce vztahuje k nuznému." # todo: NEW TRANSLATION
 pam_revelation_12_1_english: "Na nebi se ukázalo veliké znamení: žena oděná sluncem, s měsícem pod nohama a s korunou dvanácti hvězd na hlavě." # todo: NEW TRANSLATION
 pam_acts_8_18_english: "Když Šimon viděl, že se Duch uděluje, když apoštolové vkládají ruce, nabídl jim peníze." # todo: NEW TRANSLATION
 pam_proverbs_21_20_english: "V domě moudrého jsou vzácné poklady a olej, hlupák je však promrhá." # todo: NEW TRANSLATION
 pam_luke_16_11_english: "Jestliže jste tedy nebyli věrní v nespravedlivém mamonu, kdo vám svěří pravé bohatství?" # todo: NEW TRANSLATION
 pam_john_10_30_english: "Já a Otec jsme jedno." # todo: NEW TRANSLATION
 pam_john_1_1_english: "Na počátku bylo Slovo, to Slovo bylo u Boha, to Slovo bylo Bůh." # todo: NEW TRANSLATION
 pam_hebrews_1_3_english: "On je odleskem Boží slávy a výrazem Boží podstaty; svým mocným slovem všechno udržuje. Když dokonal očištění od hříchů, usedl po pravici Boží ve výšinách." # todo: NEW TRANSLATION
 pam_acts_1_8_english: "Ale dostanete sílu Ducha svatého, který na vás sestoupí, a budete mi svědky v Jeruzalémě, v celém Judsku, Samařsku a až na konec země." # todo: NEW TRANSLATION
 pam_acts_2_4_english: "Všichni byli naplněni Duchem svatým a začali mluvit jinými jazyky, jak jim Duch dával promlouvat." # todo: NEW TRANSLATION
 pam_acts_2_38_english: "Petr jim odpověděl: „Obraťte se a každý z vás ať se dá pokřtít ve jménu Ježíše Krista, aby vám byly odpuštěny hříchy, a dostanete dar Ducha svatého.“" # todo: NEW TRANSLATION
 pam_2_macabees_12_44_english: "Kdyby totiž nevěřil, že padlí vstanou z mrtvých, bylo by zbytečné a pošetilé modlit se za mrtvé." # todo: NEW TRANSLATION
 pam_matthew_12_25_english: "Každé království rozdělené samo proti sobě zpustne a žádné město ani dům rozdělený sám proti sobě neobstojí." # todo: NEW TRANSLATION
 pam_matthew_12_32_english: "Kdo by řekl slovo proti Synu člověka, tomu bude odpuštěno; kdo by však mluvil proti Duchu svatému, tomu nebude odpuštěno ani v tomto věku, ani v budoucím." # todo: NEW TRANSLATION
 pam_hebrews_12_29_english: "Vždyť náš Bůh je oheň stravující." # todo: NEW TRANSLATION
 pam_genesis_1_28_english: "Bůh jim požehnal a řekl jim: „Ploďte a množte se, naplňte zemi a podmaňte si ji. Panujte nad mořskými rybami, nad nebeským ptactvem i nad každým živým tvorem, který se hýbe na zemi.“" # todo: NEW TRANSLATION
 pam_matthew_19_5_english: "Proto opustí muž otce i matku a připojí se ke své ženě, a ti dva budou jedno tělo." # todo: NEW TRANSLATION
 pam_ephesians_4_3_6_english: "Usilujte zachovávat jednotu Ducha, spojeni svazkem pokoje: jedno tělo a jeden Duch, jako jste byli povoláni k jedné naději svého povolání; jeden Pán, jedna víra, jeden křest." # todo: NEW TRANSLATION
 pam_ephesians_5_25_english: "Muži, milujte své ženy, jako si Kristus zamiloval církev a sám se za ni obětoval." # todo: NEW TRANSLATION
 pam_matthew_16_18_english: "A já ti pravím, že ty jsi Petr; a na té skále zbuduji svou církev a brány podsvětí ji nepřemohou." # todo: NEW TRANSLATION
 pam_2_timothy_2_2_english: "A co jsi ode mne slyšel před mnoha svědky, svěř věrným lidem, kteří budou schopni učit také jiné." # todo: NEW TRANSLATION
 pam_titus_1_5_english: "Ponechal jsem tě na Krétě proto, abys dokončil, co ještě zbývá, a ustanovil po městech starší, jak jsem ti přikázal." # todo: NEW TRANSLATION
 pam_james_5_16_english: "Vyznávejte si navzájem hříchy a modlete se jeden za druhého, abyste byli uzdraveni. Vroucí modlitba spravedlivého má velikou moc." # todo: NEW TRANSLATION
 pam_1_john_1_9_english: "Jestliže vyznáváme své hříchy, on je věrný a spravedlivý, aby nám hříchy odpustil a očistil nás od každé nepravosti." # todo: NEW TRANSLATION
 pam_john_20_23_english: "Komu odpustíte hříchy, tomu jsou odpuštěny; komu je zadržíte, tomu jsou zadrženy." # todo: NEW TRANSLATION
 pam_romans_5_12_english: "Skrze jednoho člověka vešel do světa hřích a skrze hřích smrt; a tak smrt zasáhla všechny, protože všichni zhřešili." # todo: NEW TRANSLATION
 pam_psalm_51_5_english: "Vždyť jsem se narodil v nepravosti, v hříchu mě počala matka." # todo: NEW TRANSLATION
 pam_genesis_3_6_english: "Žena viděla, že je to strom s plody dobrými k jídlu, lákavý pro oči, strom slibující vševědoucnost. Vzala tedy z jeho plodů a jedla, dala také svému muži, který byl s ní, a on též jedl." # todo: NEW TRANSLATION
 pam_hebrews_1_14_english: "Což nejsou všichni andělé jen duchové, vysílaní k službě těm, kdo mají dojít spásy?" # todo: NEW TRANSLATION
 pam_psalm_91_11_english: "On svým andělům vydal o tobě příkaz, aby tě chránili na všech tvých cestách." # todo: NEW TRANSLATION
 pam_matthew_18_10_english: "Mějte se na pozoru, abyste nepohrdali ani jedním z těchto maličkých. Říkám vám, že jejich andělé v nebi jsou neustále v blízkosti mého nebeského Otce." # todo: NEW TRANSLATION
 pam_ephesians_6_11_english: "Oblečte plnou Boží zbroj, abyste mohli odolat ďáblovým svodům." # todo: NEW TRANSLATION
 pam_2_timothy_2_3_english: "Snášej se mnou útrapy jako dobrý voják Krista Ježíše." # todo: NEW TRANSLATION
 pam_1_timothy_6_12_english: "Bojuj dobrý boj víry, abys dosáhl věčného života, k němuž jsi byl povolán a k němuž ses přihlásil dobrým vyznáním před mnoha svědky." # todo: NEW TRANSLATION
 pam_proverbs_1_7_english: "Počátek poznání je bázeň před Hospodinem; po moudrosti a kázni pošetilci pohrdají." # todo: NEW TRANSLATION
 pam_colossians_2_3_english: "V něm jsou skryty všechny poklady moudrosti a poznání." # todo: NEW TRANSLATION
 pam_james_1_5_english: "Nedostává-li se někomu z vás moudrosti, ať prosí Boha, který dává všem štědře a bez výčitek, a bude mu dána." # todo: NEW TRANSLATION
 pam_1_corinthians_1_30_english: "Jeho zásluhou jste v Kristu Ježíši, který se nám stal moudrostí od Boha, spravedlností, posvěcením a vykoupením." # todo: NEW TRANSLATION
 pam_mark_1_11_english: "Z nebe se ozval hlas: Ty jsi můj milovaný Syn, tebe jsem si vyvolil." # todo: NEW TRANSLATION
 pam_romans_1_4_english: "Duchem svatosti byl ustanoven Božím Synem v moci tím, že vstal z mrtvých: Ježíš Kristus, náš Pán." # todo: NEW TRANSLATION
 pam_acts_13_33_english: "Bůh splnil toto zaslíbení nám, jejich potomkům, když vzkřísil Ježíše, jak je také napsáno ve druhém žalmu: Ty jsi můj Syn, já jsem tě dnes zplodil." # todo: NEW TRANSLATION
 pam_matthew_22_39_english: "Druhé je mu podobné: Miluj svého bližního jako sám sebe." # todo: NEW TRANSLATION
 pam_luke_10_27_english: "Odpověděl: „Miluj Hospodina, Boha svého, z celého svého srdce, celou svou duší, celou svou silou a celou svou myslí a miluj svého bližního jako sám sebe.“" # todo: NEW TRANSLATION
 pam_galatians_5_14_english: "Vždyť celý zákon je shrnut v jednom slově: Milovati budeš bližního svého jako sebe samého." # todo: NEW TRANSLATION
 pam_isaiah_6_3_english: "Jeden volal k druhému: „Svatý, svatý, svatý je Hospodin zástupů, celá země je plná jeho slávy.“" # todo: NEW TRANSLATION
 pam_psalm_134_2_english: "Pozvedněte ruce ke svatyni a dobrořečte Hospodinu." # todo: NEW TRANSLATION
 pam_malachi_1_11_english: "Od východu slunce až na západ je mé jméno veliké mezi pronárody; na každém místě se přináší mému jménu kadidlo a čistý obětní dar. Mé jméno je veliké mezi pronárody, praví Hospodin zástupů." # todo: NEW TRANSLATION
 pam_exodus_20_4_english: "Nezobrazíš si Boha zpodobením ničeho, co je nahoře na nebi, dole na zemi nebo ve vodách pod zemí." # todo: NEW TRANSLATION
 pam_matthew_16_24_english: "Tehdy řekl Ježíš svým učedníkům: „Kdo chce jít za mnou, zapři sám sebe, vezmi svůj kříž a následuj mne.“" # todo: NEW TRANSLATION
 pam_1_peter_2_9_english: "Vy však jste rod vyvolený, královské kněžstvo, národ svatý, lid náležející Bohu, abyste hlásali mocné skutky toho, kdo vás povolal ze tmy do svého podivuhodného světla." # todo: NEW TRANSLATION
 pam_2_timothy_4_7_english: "Dobrý boj jsem bojoval, běh jsem dokončil, víru zachoval." # todo: NEW TRANSLATION
 pam_tobit_8_7_english: "Nyní si neberu tuto svou příbuznou z chlípnosti, nýbrž z čistého úmyslu. Smiluj se nade mnou i nad ní a dej nám, abychom spolu dosáhli stáří. Požehnej nám dětmi." # todo: NEW TRANSLATION
 pam_1_corinthians_2_7_english: "Mluvíme tu moudrost Boží, skrytou v tajemství, kterou Bůh před věky předurčil pro naše oslavení." # todo: NEW TRANSLATION
 pam_matthew_10_9_english: "Neberte si do opasků zlato, stříbro ani měď." # todo: NEW TRANSLATION
 pam_matthew_18_20_english: "Neboť kde jsou dva nebo tři shromážděni ve jménu mém, tam jsem já uprostřed nich." # todo: NEW TRANSLATION
 pam_hebrews_11_1_english: "Víra je podstata toho, v co doufáme, důkaz skutečností, které nevidíme." # todo: NEW TRANSLATION
 pam_psalm_46_10_english: "Zmlkněte a vězte, že já jsem Bůh. Budu vyvýšen mezi pronárody, budu vyvýšen na zemi." # todo: NEW TRANSLATION
 pam_matthew_6_6_english: "Když se modlíš, vejdi do svého pokojíku, zavři za sebou dveře a modli se k svému Otci, který zůstává skryt; a tvůj Otec, který vidí, co je skryto, ti odplatí." # todo: NEW TRANSLATION
 pam_1_kings_19_12_english: "Po zemětřesení přišel oheň, ale Hospodin v ohni nebyl. Po ohni se ozval tichý, jemný hlas." # todo: NEW TRANSLATION
 pam_matthew_4_1_2_english: "Tehdy byl Ježíš Duchem vyveden na poušť, aby byl pokoušen od ďábla. Postil se čtyřicet dní a čtyřicet nocí, a nakonec vyhladověl." # todo: NEW TRANSLATION
 pam_hebrews_11_38_english: "Svět jich nebyl hoden. Bloudili po pouštích a horách, skrývali se v jeskyních a zemských slujích." # todo: NEW TRANSLATION
 pam_luke_5_16_english: "On však odcházíval na pustá místa a tam se modlil." # todo: NEW TRANSLATION
 pam_1_corinthians_9_27_english: "Tvrdě zacházím se svým tělem a podrobuji si je, abych snad, když kážu jiným, sám neselhal." # todo: NEW TRANSLATION
 pam_galatians_5_24_english: "Ti, kteří náležejí Kristu Ježíši, ukřižovali sami sebe se svými vášněmi a sklony." # todo: NEW TRANSLATION
 pam_romans_8_13_english: "Žijete-li podle své vůle, spějete k smrti; jestliže však Duchem usmrcujete skutky těla, budete žít." # todo: NEW TRANSLATION
 pam_john_3_5_english: "Ježíš odpověděl: „Amen, amen, pravím tobě, nenarodí-li se kdo z vody a z Ducha, nemůže vejít do království Božího.“" # todo: NEW TRANSLATION
 pam_acts_10_38_english: "Bůh obdařil Ježíše z Nazareta Duchem svatým a mocí; Ježíš procházel zemí, všem pomáhal a uzdravoval všechny, které ovládl ďábel, neboť Bůh byl s ním." # todo: NEW TRANSLATION
 pam_2_corinthians_1_21_22_english: "Ten, kdo nás spolu s vámi utvrzuje v Kristu a posvětil nás, je Bůh. On nám také vtiskl svou pečeť a jako závdavek nám do srdce dal svého Ducha." # todo: NEW TRANSLATION
 pam_galatians_6_14_english: "Já však se zanic nechci chlubit ničím, leč křížem našeho Pána Ježíše Krista, kterým je pro mne ukřižován svět a já pro svět." # todo: NEW TRANSLATION
 pam_1_corinthians_1_18_english: "Slovo o kříži je bláznovstvím těm, kdo jsou na cestě k záhubě; nám, kteří jdeme ke spáse, je mocí Boží." # todo: NEW TRANSLATION
 pam_isaiah_19_19_english: "V onen den bude Hospodinu stát oltář uprostřed egyptské země a na jejích hranicích bude stát Hospodinův sloup." # todo: NEW TRANSLATION
 pam_john_1_14_english: "A Slovo se stalo tělem a přebývalo mezi námi. Spatřili jsme jeho slávu, slávu, jakou má od Otce jednorozený Syn, plný milosti a pravdy." # todo: NEW TRANSLATION
 pam_colossians_2_9_english: "V něm je přece vtělena všechna plnost božství." # todo: NEW TRANSLATION
 pam_philippians_2_6_7_english: "Ačkoli byl Boží, nelpěl na své rovnosti s Bohem, nýbrž sám sebe zmařil, vzal na sebe podobu služebníka a stal se jedním z lidí." # todo: NEW TRANSLATION
 pam_matthew_25_40_english: "Amen, pravím vám, cokoliv jste učinili jednomu z těchto mých nepatrných bratří, mně jste učinili." # todo: NEW TRANSLATION
 pam_psalm_24_1_english: "Hospodinova je země se vším, co je na ní, svět i ti, kdo na něm sídlí." # todo: NEW TRANSLATION
 pam_2_timothy_3_16_english: "Veškeré Písmo pochází z Božího Ducha a je dobré k učení, k usvědčování, k nápravě a k výchově ve spravedlnosti." # todo: NEW TRANSLATION
 pam_romans_2_13_english: "Před Bohem nejsou spravedliví ti, kdo zákon slyší, nýbrž ti, kdo jej plní; ti budou ospravedlněni." # todo: NEW TRANSLATION
 pam_matthew_18_18_english: "Amen, pravím vám, cokoliv svážete na zemi, bude svázáno v nebi, a cokoliv rozvážete na zemi, bude rozvázáno v nebi." # todo: NEW TRANSLATION
 pam_acts_4_32_english: "Všichni, kdo uvěřili, byli jedné mysli a jednoho srdce a nikdo neříkal o ničem, co měl, že je to jeho vlastní, nýbrž měli všechno společné." # todo: NEW TRANSLATION
 pam_hebrews_13_2_english: "Nezapomínejte na pohostinnost; díky ní někteří nevědomky přijali za hosty anděly." # todo: NEW TRANSLATION
 pam_psalm_150_3_4_english: "Chvalte ho zvukem polnice, chvalte ho harfou a citarou, chvalte ho bubnem a tancem, chvalte ho strunami a flétnou." # todo: NEW TRANSLATION
 pam_1_corinthians_9_22_english: "Pro všechny jsem se stal vším, abych získal aspoň některé." # todo: NEW TRANSLATION
 pam_matthew_2_2_english: "Kde je ten novorozený král Židů? Viděli jsme na východě jeho hvězdu a přišli jsme se mu poklonit." # todo: NEW TRANSLATION
 pam_psalm_144_1_english: "Požehnán buď Hospodin, má skála, který učí mé ruce bojovat a mé prsty válčit." # todo: NEW TRANSLATION
 pam_genesis_2_25_english: "Oba dva, člověk i jeho žena, byli nazí, ale nestyděli se." # todo: NEW TRANSLATION
 pam_jeremiah_1_5_english: "Dříve než jsem tě vytvořil v životě matky, znal jsem tě, dříve než jsi vyšel z lůna, posvětil jsem tě." # todo: NEW TRANSLATION
 pam_psalm_127_3_english: "Hle, synové jsou dědictví od Hospodina, mzdou od něho plod lůna." # todo: NEW TRANSLATION
 pam_ecclesiastes_8_15_english: "Proto jsem chválil radost, neboť pro člověka není pod sluncem nic lepšího, než jíst a pít a radovat se." # todo: NEW TRANSLATION
 pam_psalm_2_8_english: "Požádej mě, a dám ti národy do dědictví a končiny země do vlastnictví." # todo: NEW TRANSLATION
 pam_2_kings_5_18_19_english: "Když můj pán půjde do Rimmónova domu, aby se tam klaněl, a bude se opírat o mou paži, pokloním se v Rimmónově domě i já; kéž Hospodin tvému služebníku v této věci odpustí. Řekl mu: Jdi v pokoji." # todo: NEW TRANSLATION
