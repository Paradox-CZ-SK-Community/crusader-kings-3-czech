 doctrine_parameter_tenet_miaphysitism_deceitful_penalty: "[Concept('characters','postavy')|EU] s rysem [GetTrait('deceitful').GetName( GetNullCharacter )|l]: #N -10%#! zisk @piety_icon![Concept('piety','zbožnosti')|E], #N -10#! [Concept('opinion','mínění')|E] [Concept('clergy','duchovenstva')|E]"
 doctrine_parameter_tenet_miaphysitism_open_confession: "[piety_i]#P [EmptyScope.ScriptValue('minor_piety_gain')|0]#! [Concept('piety','zbožnosti')|E] každý rok, pokud tvůj [Concept('liege','lenní pán')|E] nesdílí tvou [Concept('faith','víru')|E]"
 pam_miaphysitism_open_confession_toast_title: "$tenet_miaphysitism_default_name$"
 tenet_hesychasm_latin_name: "Hesychasmus"
 tenet_hesychasm_greek_name: "Hēsykhasmós"
 tenet_hesychasm_default_name: "Hesychasmus"
 tenet_hesychasm_name: "$tenet_hesychasm_default_name$"
 tenet_hesychasm_latin_desc: "Pane, daruj nám milost svatého ztišení. Dej, ať nalezneme Tebe, jenž přebýtvůj v nepřístupném světle. Nauč nás neustále se modlit, aby se naše srdce stala chrámy Tvé přítomnosti.\n\n$pam_psalm_46_10_latin$"
 tenet_hesychasm_latin_historical_glossary: "[Glossary('Hesychasmus','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_greek_desc: "Pane Ježíši Kriste, Synu Boží, smiluj se nade mnou, hříšníkem. Skrze ztišení těla i mysli a neustálé opakování Modlitby srdce mi dej vystoupit k theórii, nazírání nestvořeného božského světla.\n\n$pam_psalm_46_10_greek$"
 tenet_hesychasm_greek_historical_glossary: "[Glossary('Hēsykhasmós','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_default_desc: "Skrze vnitřní ztišení, rozjímavou modlitbu a opakování Ježíšovy modlitby mohou věřící zakusit přímé společenství s Bohem a spatřit Jeho nestvořené světlo.\n\n$pam_psalm_46_10_default$"
 tenet_hesychasm_default_historical_glossary: "[Glossary('Hesychasmus','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_historical_desc: "Hesychasmus, z řeckého #weak hēsychía#!, což znamená ztišení, je rozjímavá tradice východního křesťanství, která klade důraz na modlitbu srdce a má kořeny u egyptských pouštních otců 4. století. Jeho ústřední praxí se stalo opakování Ježíšovy modlitby: #weak Pane Ježíši Kriste, Synu Boží, smiluj se nade mnou, hříšníkem#!, často v souladu s dechem a tepem srdce.\n\nVe 14. století hájil svatý Řehoř Palama hesychastické mnichy z hory Athos a jejich vidění nestvořeného táborského světla Proměnění proti obviněním z kacířství, která vznesl Barlaam z Kalábrie. Koncily v Konstantinopoli v letech 1341 a 1351 Palamu ospravedlnily a ustanovily hesychasmus jako pravoslavné učení."
 doctrine_parameter_tenet_hesychasm_meditation_bonus: "#P Zvýšený#! zisk @piety_icon![Concept('piety','zbožnosti')|E] a @spiritual_fulfillment_icon![Concept('spiritual_fulfillment','duchovního naplnění')|E] za přijetí [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('meditate_in_seclusion_decision').GetName|l] ve tvém [Concept('capital','hlavním sídle')|E]"
 doctrine_parameter_tenet_hesychasm_spiritual_counsel_bonus: "#high $spiritual_counsel_interaction$#! od [Concept('clergy','duchovenstva')|E] tohoto [Concept('rite','ritu')|E] poskytuje více @piety_icon![Concept('piety','zbožnosti')|E] a @spiritual_fulfillment_icon![Concept('spiritual_fulfillment','duchovního naplnění')|E]"
