l_polish:
 only_theocratic_tt: "[THIS.Char.GetShortUIName|U] [Select_CString(THIS.Char.IsLocalPlayer,'máš','má')|l] [Concept('government','vládu')|E], která neumožňuje [Concept('theocratic','teokratická')|E] jmenování #weak ([THIS.Char.GetGovernment.GetAdjective|l])#!"
 can_be_appointed_interaction_clergy_tt: "[THIS.Char.GetWomenMen|U] musejí náležet k [Concept('clergy','duchovenstvu')|E], nebo musí víra [THIS.Char.GetFaith.GetName] zastávat [Concept('doctrine','doktrínu')|E] $doctrine_theocracy_lay_clergy_name$"
 can_be_appointed_interaction_can_inherit_tt: "[THIS.Char.GetWomenMen|U] musejí mít možnost dědit [Concept('titles','tituly')|E] #weak (nesmějí mít rys [GetTrait('disinherited').GetName( THIS.Char )|l], [GetTrait('gallivanter').GetName( THIS.Char )|l] ani [GetTrait('order_member').GetName( THIS.Char )|l])#!"
 theocracy_lease: "Teokratický pronájem"
 theocracy_lease_desc: "Tato držba je [Concept('leased','pronajata')|E] [Concept('realm_priest','vrchnímu duchovnímu')|E] [Concept('faith','víry')|E] jejího držitele.\n\nDuchovní odvádí [Concept('tax','daně')|E] a [Concept('levies','odvedence')|E] svému [Concept('liege','lennímu pánovi')|E] (pokud má jeho souhlas) i svému [Concept('religious_superior','nadřízenému duchovnímu')|E].\n\nTím je [Concept('realm_priest','vrchní duchovní')|E] jeho [Concept('liege','lenního pána')|E], vyznávají-li stejnou víru. Jinak je jím [Concept('head_of_faith','hlava víry')|E] příslušné víry."
 ecclesiastical_lease: "Církevní pronájem"
 ecclesiastical_lease_desc: "Tato držba je [Concept('leased','pronajata')|E] [Concept('realm_priest','vrchnímu duchovnímu')|E] [Concept('ecclesiastical','církevní')|E] [Concept('faith','víry')|E] jejího držitele.\n\nDuchovní odvádí [Concept('tax','daně')|E] a [Concept('levies','odvedence')|E] přímo svému [Concept('liege','lennímu pánovi')|E], pokud má jeho souhlas, svému [Concept('religious_superior','nadřízenému duchovnímu')|E] i své [Concept('head_of_faith','hlavě víry')|E].\n\nJeho nadřízeným duchovním je [Concept('holder','držitel')|E] církevního [Concept('clerical_title','duchovního titulu')|E], pod který spadá hlavní město jeho lenního pána. Jinak je jím [Concept('head_of_faith','hlava víry')|E] příslušné víry."
