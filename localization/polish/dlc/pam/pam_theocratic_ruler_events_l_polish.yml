l_polish:
 pam_theocratic_ruler_events.0001.t: "Odkaz církvi" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0001.desc: "Bohatý kupec odkázal církvi peníze, a rozhodně nejde o žádnou drobnou částku.\n\nMůj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('subordinate_priest'))] [subordinate_priest.GetFirstName] mi přinesl účty a závěť. [subordinate_priest.GetSheHe|U] čeká na můj verdikt. \n\n„V závěti stojí, že prostředky mají být použity k posílení víry v [ROOT.Char.GetFaith.HighGodName].“" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0001.a: "Nacházím důkazy, že [subordinate_priest.GetSheHe] špatně nakládal se svěřenými posvátnými prostředky…" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0001.b: "„Promluvme si o tom jako duchovní.“" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0001.c: "Do pokladnice, s vděčností a péčí." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0001.b.success: "Boží cesty jsou nevyzpytatelné" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0001.b.failure: "Kněz odmítá rozumné argumenty" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0001.b.toast.success: "Přesvědčíš [subordinate_priest.GetHerHim] a převezmeš odkaz." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0001.b.toast.failure: "[subordinate_priest.GetSheHe|U] si dar ponechá pro [ROOT.Char.GetFaith.HighGodName]." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0002.t: "Cestovatel ze sousední země" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0002.desc: "[foreign_ruler.GetTitledFirstName], můj soused a vyznavač starých zvyků [foreign_ruler.GetFaith.GetName], vstoupil na mé území.\n\nJeho malá družina míří jinam, ale prochází tak blízko, že mi zvyk velí formálně je při průjezdu pozdravit.\n\nJak je mám přijmout?" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0002.a: "Skromný dar a nabídka míru." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0002.b: "„Chci, aby mezi našimi národy panovalo upřímné porozumění.“" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0002.b.success: "Má zdvořilost si je získá" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0002.b.failure: "Má slova znějí prázdně" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0002.b.toast.success: "Svou zdvořilostí si je získáš a tolerance mezi vašimi národy vzroste" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0002.b.toast.failure: "[foreign_ruler.GetSheHe|U] zůstává neoblomný; tvá slova znějí prázdně" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0002.b.acceptance: "Dvorská ambasáda" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0002.c: "Pohané nemají v našich zemích co pohledávat." # todo: NEW TRANSLATION
 TRUCE_PAM_NEIGHBOR_GIFT: "\nPříměří založené na darech a vzájemném respektu mezi sousedy" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0003.t: "Rada ohledně neklidných hranic" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0003.desc: "Války a nájezdníci už mé země dostatečně vyzkoušeli. Povolávám [advisor.GetTitledFirstName], svého důvěryhodného rádce s titulem [advisor.GetCouncilTitle], a společně zvažujeme, co je třeba udělat. \n\n"Můžeme se obrátit na [alliance_target.GetTitledFirstName]. Jako spoluvěřící teokratický vládce by nám [alliance_target.GetSheHe] mohl přijít na pomoc."\n\nNebo mám toto břímě nést sám?" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0003.a: "Vyšleme posly. Musíme držet při sobě." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0003.a.tt: "Uzavřeš [alliance|E] s [alliance_target.GetShortUINameNoTooltip]" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0003.b: "Povolám věrné rolníky k obraně hranic." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0003.b.army: "Věrní rolníci" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0003.c: "Pošlu pomoc a obnovím jednu nedávno vypleněnou hrabství." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0003.d: "Svěřím to do rukou [ROOT.Char.GetFaith.HighGodNamePossessive]." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0004.t: "Bratři za sousedy" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0004.desc: "Když je [monastic_order_head.GetPrimaryTitle.GetName] tak blízko, pozval jsem [monastic_order_head.GetTitledFirstName], abychom probrali, jak prohloubit naši spolupráci.\n\n„[monastic_order_head.GetFaith.HighGodName], nesuď nás podle naší pýchy, ale podle ochoty sloužit.“ [monastic_order_head.GetTitledFirstNameNoTooltip] promluví tiše." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0004.a: "Prosím, ať tvoji bratři požehnají mým zemím." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0004.b: "Tvůj učedník [monastic_monk.GetTitledFirstNameNoTooltip] by posílil můj dvůr." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0004.c: "Pomodleme se společně." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0005.t: "Meče ve službě víře" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0005.desc: "Když se [military_order_head.GetPrimaryTitle.GetName] usadil v mé říši, pozval jsem [military_order_head.GetTitledFirstName], abychom probrali, jak si mohou meče věřících navzájem posloužit.\n\n„[military_order_head.GetFaith.HighGodName] nežehná nečinné oceli, nýbrž čepelím pozvednutým na obranu věřících,“ říká [military_order_head.GetTitledFirstNameNoTooltip], zatímco se [military_order_head.GetHerHis] následovník [order_knight.GetTitledFirstName] vedle [military_order_head.GetHerHim] mlčky uklání." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0005.a: "Vycvič mé [ROOT.Char.Custom('GetFighterTermPlural')] v disciplíně tvého řádu." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0005.b: "Ať se [order_knight.GetTitledFirstNameNoTooltip] stane mou osobní stráží." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0005.c: "Promluvme si o spravedlivé válce." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0006.t: "Desátky, nebo milosrdenství" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0006.desc: "Předvedli přede mě místního vůdce [local_peasant_leader.GetTitledFirstName]. [local_peasant_leader.GetHerHis|U] vesničané odmítli odvádět církevní desátek a odvolávají se na těžké časy.\n\n„Zima byla krutá, můj [ROOT.Char.GetLadyLord], a naše sýpky jsou téměř prázdné,“ naříká [local_peasant_leader.GetSheHe].\n\nVidím jen málo možností: tyto nespokojené duše musím buď zastrašit, nebo jim pomoci svým milosrdenstvím." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0006.a: "Žádné výjimky. Zatkněte vůdce vzpoury." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0006.a.tt: "Získáš [gold_i][EmptyScope.ScriptValue('minor_gold_value')|0], uvězníš [local_peasant_leader.GetShortUINameNoTooltip] a [troubled_county.GetName] získá na 5 let vlastnost #N Vynucené desátky#! (#N -20#! [county_opinion|E])." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0006.b: "Nechám to být. I milosrdenství může sloužit Bohu." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0006.b.tt: "Získáš [piety_i][EmptyScope.ScriptValue('minor_piety_gain')|0] a [troubled_county.GetName] získá na 5 let vlastnost #P Milosrdné desátky#! (#P +20#! [county_opinion|E])." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0006.c: "Můj správce mě zklamal. Vina padá na něj." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0006.c.tt: "Pokud je to možné, získáš na [ROOT.Char.GetCouncillor('councillor_steward').GetShortUINameNoTooltip] [hook|E] (použije se silnější závazkový háček, pokud je k dispozici). [ROOT.Char.GetCouncillor('councillor_steward').GetShortUINameNoTooltip] ztratí [opinion|E] vůči tobě (#N -20#!, během 5 let se vytratí)." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0007.t: "Blažená harmonie" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0007.desc: "Když jemné sluneční paprsky zvedají ranní rosu a ohřívají kameny na hřbitově, dochází mi, že mě tentokrát povinnosti netahají za rukáv. Dokonce i pilná včela si dopřává přestávky a vyhřívá si záda v ranních paprscích.\n\nV mých zemích panuje klid a pořádek. V pokladnici je zlato a mé stádo je spokojené a uctivé. Dokonce i můj lenní pán, [ROOT.Char.GetLiege.GetTitledFirstName], chválí, jak vedu [ROOT.Char.GetLiege.GetHerHis] poddané ke Kristu." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0007.a: "Mír je sladký, ale [ROOT.Char.GetFaith.HighGodName] má pro mě stále důležitější úkoly." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0007.b: "Šiř evangelium spořádaného, bohabojného života." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0007.c: "Jen naslouchat a mlčet." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0008.t: "Kámen ke kameni" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0008.desc: "Od chvíle, kdy jsem zdědil [stone_province.GetName], hrad s budovou [GetBuilding('curtain_walls_01').GetName], obdivuji jeho působivé kamenné zdivo, vystavěné pro světskou vládu. Potřebují věřící skutečně takovou obranu?\n\nNa mém panství nestojí žádný [GetDomicileBuilding('episcopal_palace_01').GetName], který by odpovídal mému postavení, a tesaný kámen je tu k dispozici." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0008.a: "Přebytečný kámen z těchto primitivních hradeb mohu využít." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0008.b: "Strhněte hradby a postavte mi [GetDomicileBuilding('episcopal_palace_01').GetNameNoTooltip]." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0008.c: "Každé dílo lidských rukou je zviditelněnou modlitbou." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0008.c.flavor: "Máš zásadu [GetTenetType('tenet_ora_et_labora').GetName( ROOT.Char.GetRite )]" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0008.d: "Možná ty hradby potřebují." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0009.t: "Zkus být pastýřem" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0009.desc: "Od svých věřících jsem obdržel zprávy plné slz, podle nichž [heir.GetTitledFirstName] při posledním kázání ztratil[a] [heir.GetHerHis] nervy a oni nejsou schopni dodržovat přísná pravidla, která po nich [heir.GetSheHe] vyžaduje.\n\nKdyž jsem se [heir.GetHerHim] na to ptal[a], [heir.GetSheHe] vzplanul[a] hněvem.\n\n„Ach, ti odporní hříšníci! Jejich ubohé pokusy o vykoupení nemohu vystát.“" # todo: NEW TRANSLATION, CHECK FORMAT
 pam_theocratic_ruler_events.0009.a: "„Pastýř musí být klidný. Mírni své vášně.“" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0009.a.success: "Tvoje rada na [heir.GetHerHim] zapůsobí" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0009.a.failure: "Tvá slova [heir.GetHerHim] neuklidní" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0009.a.toast.success: "Rada přijata" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0009.a.toast.failure: "Rada nezabrala" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0009.b: "Jemně zavrtím hlavou ve zklamání." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0009.b.flavor: " [heir.GetSheHe|U] nemá mé požehnání a není způsobilý vládnout " # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0009.c: "„Pomodli se. Ovládni své tělo.“" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0010.t: "Meč, nebo berla" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0010.desc: "Jako vládce svých zemí jsem byl nucen sloužit [ROOT.Char.GetFaith.HighGodName] mečem i požehnáním.\n\nJasně si vzpomínám, jak [pilgrimage_memory.GetDescription] a jak [battle_memory.GetDescription]. Na bojišti se vršily mrtvoly; mí následovníci vědí, že se nevyhýbám úkolům, které přede mě staví osud.\n\nMůj [ROOT.Char.GetCouncillor('councillor_marshal').GetCouncilTitle] [ROOT.Char.GetCouncillor('councillor_marshal').GetTitledFirstName] i můj [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetCouncilTitle] [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetTitledFirstName] chtějí, abych při pohledu do budoucnosti říše postavil do čela našeho úsilí jejich nástroj." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0010.a: "Vzdejme čest meči." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0010.b: "Vést by měla berla." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0010.c: "Ať meč i berla slouží společně." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0011.t: "Odpočinek padlého rytíře" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0011.desc: "[landed_subject.GetTitledFirstName] přede mnou poklekne a vypráví o [landed_subject.GetHerHis] příbuzném, který padl při obraně [ROOT.Char.GetFaith.HighGodName]. \n\n„Dlouho vzdoroval mnoha pohanům, ale jeho rány byly příliš hluboké. Aspoň jsme se s ním mohli naposledy rozloučit.“ \n\n„Prosím, dopřejte mu místo posledního odpočinku podél oltáře a nechte mu po boku meč. Budu vám navždy vděčný.“" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0011.a: "Zaplať za kámen a bude odpočívat zde." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0011.a.flavor: "Rytíř spočine uvnitř kostela." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0011.b: "Můžeme použít kryptu, pokud nám daruješ čepel." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0011.b.flavor: "Rytíř spočine bez svého meče." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0011.c: "Válečníci patří pod širé nebe." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0011.c.flavor: "Rytíř bude pohřben za hradbami kostela." # todo: NEW TRANSLATION
 pam_fallen_knight_crusader_sword_name: "Křižácký meč" # todo: NEW TRANSLATION
 pam_fallen_knight_crusader_sword_desc: "Čepel rytíře, který padl při obraně víry. Je poznamenána údery pohanských mečů a její jílce zdobí drobný vyrytý kříž." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0012.t: "Kdysi posvátný háj" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0012.desc: "Má družina zpomalí tam, kde se les uzavírá nad stezkou. [grove_subject.GetTitledFirstName], jeden z věřících z [grove_county.GetNameNoTier], vystoupí ze stromů s dlaněmi roztaženými na pozdrav.\n\n„Chceš v těchto zemích získat početné stádo? Naslouchej a s radostí přijmi to, co [ROOT.Char.GetFaith.HighGodName] sám před dávnými časy zasadil do této půdy. Ucti starobylé háje v [grove_province.GetName] posvátným chrámem a lid pozná, čí jsi pastýř.“" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0012.a: "Nechť mou víru vede příroda." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0012.b: "Ukaž mi ty háje." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0012.b.success: "Tví muži se později vrátí pro dřevo" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0012.b.failure: "[grove_subject.GetShortUINameNoTooltip] prohlédne tvou lest" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0012.b.toast.success: "Starobylé stromy byly odvezeny a prodány." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0012.b.toast.failure: "[grove_subject.GetShortUINameNoTooltip] rozhlásí, že jsi znesvětil posvátné místo." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0012.c: "Tato pustina páchne ďáblem." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0013.t: "Andělská inspirace" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0013.desc: "Při dnešní mši se nad hlas kantora vznesl hlas, jako by jej zasáhla božská inspirace. Byl jasný a svou krásou nadpozemský.\n\nVěřící ztichnou, když [angelic_singer.GetTitledFirstName] začne zpívat, a ještě dlouho poté, co dozněla poslední nota, se přistihnu, jak naslouchám." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0013.a: "„Tvůj dar patří [ROOT.Char.GetFaith.HighGodName]. Slož sliby a služ mu.“" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0013.a.success: "Tvá slova přimějí [angelic_singer.GetHerHim] oddat se víře" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0013.a.failure: "[angelic_singer.GetShortUINameNoTooltip] se přesvědčit nenechá" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0013.a.toast.success: "[angelic_singer.GetShortUINameNoTooltip] složí sliby a připojí se k tvému dvoru." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0013.a.toast.failure: "[angelic_singer.GetShortUINameNoTooltip] odmítne a odejde." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0013.b: "Zůstaň mým hostem. Rád bych ten hlas znovu slyšel." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0013.c: "Ať zpívají naši pěvci." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0014.t: "Prosba obrácence" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0014.desc: "Během mého kázání se [convert_peasant.GetTitledFirstName], [convert_peasant.GetCulture.GetNameNoTooltip] obrácenec od starých zvyků víry [neighbour_faith.GetNameNoTooltip], protlačí davem.\n\n„Ze starých zvyků se stále můžeme mnohému naučit. Vím, že kdybyste ve svém srdci našli místo pro jejich zvážení, naši lidé by věděli, že ctíte naše tradice. Mí souvěrci se k vám houfně přidají a podpoří každé vaše úsilí.“\n\n[convert_peasant.GetSheHe|U] čeká na mé požehnání a tiché přikývnutí jako odpověď." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0014.a: "Odveďte mi z očí tu špínu." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0014.a.flavor: "Máš vlastnost [GetTrait('arrogant').GetName( GetNullCharacter )] [trait|E]" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0014.a.acceptance: "Prosba obrácence odmítnuta" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0014.b: "Přijmu [offered_tenet_a.GetBaseNameNoTooltip] za vlastní." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0014.b.tt: "Váš příští příspěvek na [great_project|E] [GetGreatProjectType('pam_mass_rite_conversion').GetName|V] v rámci #V $great_project_type_pam_mass_rite_conversion_contribution_integrate_existing_rituals$#! bude zdarma." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0014.c: "Přijmu [offered_tenet_b.GetBaseNameNoTooltip] za vlastní." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0014.c.tt: "Váš příští příspěvek na [great_project|E] [GetGreatProjectType('pam_mass_rite_conversion').GetName|V] v rámci #V $great_project_type_pam_mass_rite_conversion_contribution_integrate_existing_rituals$#! bude zdarma." # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0014.d: "Vede snad ovce svého pastýře?" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events_0014_mass_conversion_discount_desc: "Prosba obrácence" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0015.t: "Vedení nástupců" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0015.desc: "Po mé smrti bude stolice potřebovat pastýře, který dokáže vést lid v modlitbách i při vynášení rozsudků. [succession_heir_first.GetTitledFirstName], první v pořadí nástupnictví, a [succession_heir_second.GetTitledFirstName], který je hned za ním, byli povoláni, aby přede mnou v soukromí předříkávali Písmo svaté.\n\nJeden z nich zdědí mé břímě a dnes nemohu stejnou měrou formovat oba.\n\n„Mé děti ve víře. Ukažte mi nejen to, co jste se naučily nazpaměť, ale i to, co jste přijaly za své.“" # todo: NEW TRANSLATION
 pam_theocratic_ruler_events.0015.a: "Vyučím [succession_heir_first.GetFirstNameNoTooltip] Písmu svatému." # todo: NEW TRANSLATION
