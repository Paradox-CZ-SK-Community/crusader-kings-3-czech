l_polish:
 pam_theocratic_ruler_events.0001.t: "Odkaz církvi"
 pam_theocratic_ruler_events.0001.desc: "Bohatý kupec odkázal církvi peníze, a rozhodně nejde o malou částku.\n\n[Select_CString(subordinate_priest.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('subordinate_priest'))] [subordinate_priest.GetFirstName] mi [Select_CString(subordinate_priest.IsFemale,'přinesla','přinesl')] účty a listiny se zůstavitelovou vůlí. Teď čeká na můj verdikt.\n\n„Závěť praví, že prostředky mají posílit víru, kterou nám zvěstuje [ROOT.Char.GetFaith.HighGodName].“"
 pam_theocratic_ruler_events.0001.a: "Nacházím důkazy, že [Select_CString(subordinate_priest.IsFemale,'špatně nakládala','špatně nakládal')] s posvátnými prostředky..."
 pam_theocratic_ruler_events.0001.b: "„Promluvme si o tom jako duchovní.“"
 pam_theocratic_ruler_events.0001.c: "Do pokladnice, s vděčností a péčí."
 pam_theocratic_ruler_events.0001.b.success: "Boží cesty jsou nevyzpytatelné"
 pam_theocratic_ruler_events.0001.b.failure: "[Select_CString(subordinate_priest.IsFemale,'Kněžka','Kněz')] odmítá rozumné argumenty"
 pam_theocratic_ruler_events.0001.b.toast.success: "Přesvědčíš [Select_CString(subordinate_priest.IsFemale,'ji','ho')] a převezmeš odkaz."
 pam_theocratic_ruler_events.0001.b.toast.failure: "Dar si ponechá ve službě víře, kterou nám zvěstuje [ROOT.Char.GetFaith.HighGodName]."
 pam_theocratic_ruler_events.0002.t: "Cestovatel ze sousední země"
 pam_theocratic_ruler_events.0002.desc: "[foreign_ruler.GetTitledFirstName], [Select_CString(foreign_ruler.IsFemale,'má sousedka a vyznavačka','můj soused a vyznavač')] starých tradic víry [foreign_ruler.GetFaith.GetName], [Select_CString(foreign_ruler.IsFemale,'vstoupila','vstoupil')] na mé území.\n\nMalá družina míří jinam, ale prochází tak blízko, že mi zvyklosti velí formálně ji při průjezdu pozdravit.\n\nJak ji mám přijmout?"
 pam_theocratic_ruler_events.0002.a: "Skromný dar a nabídka míru."
 pam_theocratic_ruler_events.0002.b: "„Chci, aby mezi našimi národy panovalo upřímné porozumění.“"
 pam_theocratic_ruler_events.0002.b.success: "Má zdvořilost si je získá"
 pam_theocratic_ruler_events.0002.b.failure: "Má slova znějí prázdně"
 pam_theocratic_ruler_events.0002.b.toast.success: "Svou zdvořilostí si je získáš a tolerance mezi vašimi národy vzroste"
 pam_theocratic_ruler_events.0002.b.toast.failure: "[Select_CString(foreign_ruler.IsFemale,'Zůstává neoblomná','Zůstává neoblomný')]; tvá slova znějí prázdně"
 pam_theocratic_ruler_events.0002.b.acceptance: "Dvorská diplomatická mise"
 pam_theocratic_ruler_events.0002.c: "Pohané nemají v našich zemích co pohledávat."
 TRUCE_PAM_NEIGHBOR_GIFT: "\nPříměří založené na darech a vzájemném respektu mezi sousedy"
 pam_theocratic_ruler_events.0003.t: "Rada ohledně neklidných hranic"
 pam_theocratic_ruler_events.0003.desc: "Války a nájezdníci už mé země vyzkoušeli dost. [advisor.GetTitledFirstName], [Select_CString(advisor.IsFemale,'má důvěryhodná','můj důvěryhodný')] [advisor.GetCouncilTitle|l], přichází na mé zavolání a společně zvažujeme, co je třeba udělat.\n\n„Mohli bychom oslovit dalšího teokratického vládce naší víry. [alliance_target.GetTitledFirstName] by nám [Select_CString(alliance_target.IsFemale,'mohla','mohl')] přijít na pomoc.“\n\nNebo mám toto břímě nést [Select_CString(ROOT.Char.IsFemale,'sama','sám')]?"
 pam_theocratic_ruler_events.0003.a: "Vyšleme posly. Musíme držet při sobě."
 pam_theocratic_ruler_events.0003.a.tt: "Uzavřeš [Concept('alliance','alianci')|E] [CZPrepS(alliance_target.GetShortUINameNoTooltip)] [alliance_target.Custom('CZ_ShortUINameNoTooltip_I')]"
 pam_theocratic_ruler_events.0003.b: "Povolám věrné rolníky k obraně hranic."
 pam_theocratic_ruler_events.0003.b.army: "Věrní rolníci"
 pam_theocratic_ruler_events.0003.c: "Pošlu pomoc a obnovím jedno nedávno vypleněné hrabství."
 pam_theocratic_ruler_events.0003.d: "Nechť rozhodne [ROOT.Char.GetFaith.HighGodNamePossessive] soud."
 pam_theocratic_ruler_events.0004.t: "Bratři za sousedy"
 pam_theocratic_ruler_events.0004.desc: "[monastic_order_head.GetPrimaryTitle.GetName] sídlí tak blízko, že mě napadlo pozvat [monastic_order_head.Custom('CZ_TitledFirstName_A')] a probrat, jak prohloubit naši spolupráci.\n\n„Kéž nás [monastic_order_head.GetFaith.HighGodName] nesoudí podle naší pýchy, ale podle ochoty sloužit,“ tiše pronáší [monastic_order_head.GetTitledFirstNameNoTooltip]."
 pam_theocratic_ruler_events.0004.a: "Prosím, ať tvoji bratři požehnají mým zemím."
 pam_theocratic_ruler_events.0004.b: "[Select_CString(monastic_monk.IsFemale,'Tvá učednice','Tvůj učedník')] [monastic_monk.GetTitledFirstNameNoTooltip] by [Select_CString(monastic_monk.IsFemale,'posílila','posílil')] můj dvůr."
 pam_theocratic_ruler_events.0004.c: "Pomodleme se společně."
 pam_theocratic_ruler_events.0005.t: "Meče ve službě víře"
 pam_theocratic_ruler_events.0005.desc: "[military_order_head.GetPrimaryTitle.GetName] sídlí v mé říši, a proto zvu [military_order_head.Custom('CZ_TitledFirstName_A')] k rozhovoru o tom, jak si mohou meče věřících navzájem posloužit.\n\n„[military_order_head.GetFaith.HighGodName] nežehná nečinné oceli, nýbrž čepelím pozvednutým na obranu věřících,“ říká [military_order_head.GetTitledFirstNameNoTooltip]. Vedle [Select_CString(military_order_head.IsFemale,'ní','něj')] se zatím mlčky uklání [Select_CString(military_order_head.IsFemale,'její','jeho')] [Select_CString(order_knight.IsFemale,'následovnice','následovník')] [order_knight.GetTitledFirstName]."
 pam_theocratic_ruler_events.0005.a: "Vycvič mé [ROOT.Char.Custom('GetFighterTermPlural')] v disciplíně tvého řádu."
 pam_theocratic_ruler_events.0005.b: "Ať se [order_knight.GetTitledFirstNameNoTooltip] stane mou osobní stráží."
 pam_theocratic_ruler_events.0005.c: "Promluvme si o spravedlivé válce."
 pam_theocratic_ruler_events.0006.t: "Desátky, nebo milosrdenství"
 pam_theocratic_ruler_events.0006.desc: "[local_peasant_leader.GetTitledFirstName], [Select_CString(local_peasant_leader.IsFemale,'místní vůdkyně','místní vůdce')], je [Select_CString(local_peasant_leader.IsFemale,'předvedena','předveden')] přede mě. [Select_CString(local_peasant_leader.IsFemale,'Její','Jeho')] vesničané odmítli odvést církevní desátek a odvolávají se na těžké časy.\n\n„Zima byla krutá, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')], a naše sýpky jsou téměř prázdné,“ naříká.\n\nVidím jen málo možností: tyto nespokojené duše musím buď zastrašit, nebo jim pomoci svým milosrdenstvím."
 pam_theocratic_ruler_events.0006.a: "Žádné výjimky. Zatkněte vůdce vzpoury."
 pam_theocratic_ruler_events.0006.a.tt: "Získáš [gold_i][EmptyScope.ScriptValue('minor_gold_value')|0], uvězníš [local_peasant_leader.Custom('CZ_ShortUINameNoTooltip_A')] a [troubled_county.GetName] získá na 5 let modifikátor #N Vynucené desátky#! (#N -20#! [Concept('county_opinion','lidové mínění')|EU])."
 pam_theocratic_ruler_events.0006.b: "Nechám to být. I milosrdenství může sloužit Bohu."
 pam_theocratic_ruler_events.0006.b.tt: "Získáš [piety_i][EmptyScope.ScriptValue('minor_piety_gain')|0] a [troubled_county.GetName] získá na 5 let modifikátor #P Milosrdné desátky#! (#P +20#! [Concept('county_opinion','lidové mínění')|EU])."
 pam_theocratic_ruler_events.0006.c: "[Select_CString(ROOT.Char.GetCouncillor('councillor_steward').IsFemale,'Má správkyně mě zklamala. Vina padá na ni.','Můj správce mě zklamal. Vina padá na něj.')]"
 pam_theocratic_ruler_events.0006.c.tt: "Pokud je to možné, získáš [Concept('hook','páku')|E] na [ROOT.Char.GetCouncillor('councillor_steward').Custom('CZ_ShortUINameNoTooltip_A')] (přednost má silnější páka ze závazku, je-li dostupná). [ROOT.Char.GetCouncillor('councillor_steward').GetShortUINameNoTooltip|U] [Select_CString(ROOT.Char.GetCouncillor('councillor_steward').IsLocalPlayer,'ztratíš','ztratí')] [Concept('opinion','mínění')|E] o tobě (#N -20#!, během 5 let se vytratí)."
 pam_theocratic_ruler_events.0007.t: "Blažená harmonie"
 pam_theocratic_ruler_events.0007.desc: "Jemné sluneční paprsky vysušují ranní rosu a ohřívají kameny na hřbitově. Dochází mi, že mě pro jednou povinnosti netahají za rukáv. Dokonce i pilná včela si dopřává přestávky a vyhřívá si záda v ranním slunci.\n\nV mých zemích panuje klid a pořádek. V pokladnici je zlato a mé stádo je spokojené a uctivé. Dokonce i [Select_CString(ROOT.Char.GetLiege.IsFemale,'má lenní paní','můj lenní pán')], [ROOT.Char.GetLiege.GetTitledFirstName], chválí, jak vedu [Select_CString(ROOT.Char.GetLiege.IsFemale,'její','jeho')] poddané ke Kristu."
 pam_theocratic_ruler_events.0007.a: "Mír je sladký, ale [ROOT.Char.GetFaith.HighGodName] má pro mě stále důležitější úkoly."
 pam_theocratic_ruler_events.0007.b: "Šiř evangelium spořádaného, bohabojného života."
 pam_theocratic_ruler_events.0007.c: "Jen naslouchat a mlčet."
 pam_theocratic_ruler_events.0008.t: "Kámen ke kameni"
 pam_theocratic_ruler_events.0008.desc: "Od chvíle, kdy jsem [Select_CString(ROOT.Char.IsFemale,'zdědila','zdědil')] hrad [CZProvName(stone_province,'N')] s opevněním [GetBuilding('curtain_walls_01').GetName], obdivuji jeho působivé kamenné zdivo, vystavěné pro světskou vládu. Potřebují věřící skutečně takovou obranu?\n\n[GetDomicileBuilding('episcopal_palace_01').GetName|U] na mém panství dosud nestojí v podobě hodné mého jména, a tesaný kámen je tu k dispozici."
 pam_theocratic_ruler_events.0008.a: "Přebytečný kámen z těchto primitivních hradeb mohu využít."
 pam_theocratic_ruler_events.0008.b: "Strhněte hradby. Na mém panství vyroste [GetDomicileBuilding('episcopal_palace_01').GetNameNoTooltip]."
 pam_theocratic_ruler_events.0008.c: "Každé dílo lidských rukou je zviditelněnou modlitbou."
 pam_theocratic_ruler_events.0008.c.flavor: "Máš zásadu [GetTenetType('tenet_ora_et_labora').GetName( ROOT.Char.GetRite )]"
 pam_theocratic_ruler_events.0008.d: "Možná ty hradby potřebují."
 pam_theocratic_ruler_events.0009.t: "Zkus být pastýřem"
 pam_theocratic_ruler_events.0009.desc: "Od svých věřících dostávám zprávy plné slz. [heir.GetTitledFirstName] prý při posledním kázání [Select_CString(heir.IsFemale,'ztratila','ztratil')] nervy a lidé nedokážou dodržovat přísná pravidla, která od nich vyžaduje.\n\nKdyž se na to ptám, propadá hněvu.\n\n„Ach, ti odporní hříšníci! Jejich ubohé pokusy o vykoupení nemohu vystát.“"
 pam_theocratic_ruler_events.0009.a: "„Pastýř musí být klidný. Mírni své vášně.“"
 pam_theocratic_ruler_events.0009.a.success: "Tvá rada na [Select_CString(heir.IsFemale,'ni','něj')] zapůsobí"
 pam_theocratic_ruler_events.0009.a.failure: "Tvá slova [Select_CString(heir.IsFemale,'ji','ho')] neuklidní"
 pam_theocratic_ruler_events.0009.a.toast.success: "Rada přijata"
 pam_theocratic_ruler_events.0009.a.toast.failure: "Rada nezabrala"
 pam_theocratic_ruler_events.0009.b: "Jemně zavrtím hlavou ve zklamání."
 pam_theocratic_ruler_events.0009.b.flavor: " [Select_CString(heir.IsFemale,'Nemá mé požehnání a není způsobilá vládnout','Nemá mé požehnání a není způsobilý vládnout')] "
 pam_theocratic_ruler_events.0009.c: "„Pomodli se. Ovládni své tělo.“"
 pam_theocratic_ruler_events.0010.t: "Meč, nebo berla"
 pam_theocratic_ruler_events.0010.desc: "Jako [Select_CString(ROOT.Char.IsFemale,'vládkyně','vládce')] svých zemí se musím ohánět mečem stejně jako rozdávat požehnání, jak ode mě žádá [ROOT.Char.GetFaith.HighGodName].\n\nJasně si vzpomínám, jak [pilgrimage_memory.GetDescription] a jak [battle_memory.GetDescription]. Na bojišti se vršily mrtvoly; mí následovníci vědí, že se nevyhýbám úkolům, které přede mě staví osud.\n\n[Select_CString(ROOT.Char.GetCouncillor('councillor_marshal').IsFemale,'Má','Můj')] [ROOT.Char.GetCouncillor('councillor_marshal').GetCouncilTitle|l], [ROOT.Char.GetCouncillor('councillor_marshal').GetTitledFirstName], i [Select_CString(ROOT.Char.GetCouncillor('councillor_court_chaplain').IsFemale,'má','můj')] [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetCouncilTitle|l], [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetTitledFirstName], chtějí, abych v budoucnu [Select_CString(ROOT.Char.IsFemale,'postavila','postavil')] do čela našeho úsilí jejich nástroj."
 pam_theocratic_ruler_events.0010.a: "Vzdejme čest meči."
 pam_theocratic_ruler_events.0010.b: "Vést by měla berla."
 pam_theocratic_ruler_events.0010.c: "Ať meč i berla slouží společně."
 pam_theocratic_ruler_events.0011.t: "Odpočinek padlého rytíře"
 pam_theocratic_ruler_events.0011.desc: "[landed_subject.GetTitledFirstName] přede mnou poklekne a vypráví o svém příbuzném, který padl při obraně víry, již hlásá [ROOT.Char.GetFaith.HighGodName].\n\n„Dlouho vzdoroval mnoha pohanům, ale jeho rány byly příliš hluboké. Aspoň jsme se s ním mohli naposledy rozloučit.“\n\n„Prosím, dopřejte mu místo posledního odpočinku podél oltáře a nechte mu po boku meč. Budu vám navždy [Select_CString(landed_subject.IsFemale,'vděčná','vděčný')].“"
 pam_theocratic_ruler_events.0011.a: "Zaplať za kámen a bude odpočívat zde."
 pam_theocratic_ruler_events.0011.a.flavor: "Rytíř spočine uvnitř kostela."
 pam_theocratic_ruler_events.0011.b: "Můžeme použít kryptu, pokud nám daruješ čepel."
 pam_theocratic_ruler_events.0011.b.flavor: "Rytíř spočine bez svého meče."
 pam_theocratic_ruler_events.0011.c: "Válečníci patří pod širé nebe."
 pam_theocratic_ruler_events.0011.c.flavor: "Rytíř bude pohřben za hradbami kostela."
 pam_fallen_knight_crusader_sword_name: "Křižácký meč"
 pam_fallen_knight_crusader_sword_desc: "Čepel rytíře, který padl při obraně víry. Je poznamenána údery pohanských mečů a její jílec zdobí drobný vyrytý kříž."
 pam_theocratic_ruler_events.0012.t: "Kdysi posvátný háj"
 pam_theocratic_ruler_events.0012.desc: "Má družina zpomalí tam, kde se les uzavírá nad stezkou. [grove_subject.GetTitledFirstName], [Select_CString(grove_subject.IsFemale,'jedna z věřících','jeden z věřících')] [grove_county.Custom('CZ_LandedNameNoTier_G')], vystoupí ze stromů s dlaněmi roztaženými na pozdrav.\n\n„Chceš v těchto zemích získat početné stádo? Naslouchej a s radostí přijmi to, co zde od pradávna tvoří [ROOT.Char.GetFaith.HighGodName]. Ucti starobylé háje [CZProvName(grove_province,'G')] posvátným chrámem a lid pozná, čí jsi [Select_CString(ROOT.Char.IsFemale,'pastýřka','pastýř')].“"
 pam_theocratic_ruler_events.0012.a: "Nechť mou víru vede příroda."
 pam_theocratic_ruler_events.0012.b: "Ukaž mi ty háje."
 pam_theocratic_ruler_events.0012.b.success: "Tví muži se později vrátí pro dřevo"
 pam_theocratic_ruler_events.0012.b.failure: "[grove_subject.GetShortUINameNoTooltip|U] [Select_CString(grove_subject.IsLocalPlayer,'prohlédneš','prohlédne')] tvou lest"
 pam_theocratic_ruler_events.0012.b.toast.success: "Starobylé stromy byly odvezeny a prodány."
 pam_theocratic_ruler_events.0012.b.toast.failure: "[grove_subject.GetShortUINameNoTooltip|U] [Select_CString(grove_subject.IsLocalPlayer,'rozhlásíš','rozhlásí')], že jsi [Select_CString(ROOT.Char.IsFemale,'znesvětila','znesvětil')] posvátné místo."
 pam_theocratic_ruler_events.0012.c: "Tato pustina páchne ďáblem."
 pam_theocratic_ruler_events.0013.t: "Andělská inspirace"
 pam_theocratic_ruler_events.0013.desc: "Při dnešní mši se nad hlas kantora vznesl hlas, jako by jej zasáhla božská inspirace. Byl jasný a svou krásou nadpozemský.\n\nVěřící ztichnou, když [angelic_singer.GetTitledFirstName] začne zpívat, a ještě dlouho poté, co dozněla poslední nota, se přistihnu, jak naslouchám."
 pam_theocratic_ruler_events.0013.a: "„Tvůj dar ti svěřuje [ROOT.Char.GetFaith.HighGodName]. Slož sliby a dej se do služby.“"
 pam_theocratic_ruler_events.0013.a.success: "Tvá slova [Select_CString(angelic_singer.IsFemale,'ji','ho')] přimějí oddat se víře"
 pam_theocratic_ruler_events.0013.a.failure: "[angelic_singer.GetShortUINameNoTooltip|U] se přesvědčit [Select_CString(angelic_singer.IsLocalPlayer,'nenecháš','nenechá')]"
 pam_theocratic_ruler_events.0013.a.toast.success: "[angelic_singer.GetShortUINameNoTooltip|U] [Select_CString(angelic_singer.IsLocalPlayer,'složíš sliby a připojíš se','složí sliby a připojí se')] k tvému dvoru."
 pam_theocratic_ruler_events.0013.a.toast.failure: "[angelic_singer.GetShortUINameNoTooltip|U] [Select_CString(angelic_singer.IsLocalPlayer,'odmítneš a odejdeš','odmítne a odejde')]."
 pam_theocratic_ruler_events.0013.b: "Zůstaň mým hostem. [Select_CString(ROOT.Char.IsFemale,'Ráda bych ten hlas znovu slyšela.','Rád bych ten hlas znovu slyšel.')]"
 pam_theocratic_ruler_events.0013.c: "Ať zpívají naši pěvci."
 pam_theocratic_ruler_events.0014.t: "Prosba obrácence"
 pam_theocratic_ruler_events.0014.desc: "Během mého kázání se davem protlačí [convert_peasant.GetTitledFirstName], [Select_CString(convert_peasant.IsFemale,convert_peasant.GetCulture.Custom('CZ_AdjectiveNoTooltip_aa'),convert_peasant.GetCulture.Custom('CZ_AdjectiveNoTooltip_yy'))] [Select_CString(convert_peasant.IsFemale,'konvertitka','konvertita')], [Select_CString(convert_peasant.IsFemale,'obrácená','obrácený')] od starých tradic víry [neighbour_faith.GetNameNoTooltip].\n\n„Ze starých zvyků se stále můžeme mnohému naučit. Vím, že kdybys ve svém srdci [Select_CString(ROOT.Char.IsFemale,'našla','našel')] místo pro jejich zvážení, naši lidé by věděli, že ctíš naše tradice. Mí souvěrci se k tobě houfně přidají a podpoří každé tvé úsilí.“\n\nČeká na mé požehnání a tiché přikývnutí jako odpověď."
 pam_theocratic_ruler_events.0014.a: "Odveďte mi z očí tu špínu."
 pam_theocratic_ruler_events.0014.a.flavor: "Máš [Concept('trait','rys')|E] [GetTrait('arrogant').GetName( GetNullCharacter )]"
 pam_theocratic_ruler_events.0014.a.acceptance: "Prosba obrácence odmítnuta"
 pam_theocratic_ruler_events.0014.b: "Přijmu za vlastní zásadu [offered_tenet_a.GetBaseNameNoTooltip]."
 pam_theocratic_ruler_events.0014.b.tt: "Tvůj příští příspěvek #V $great_project_type_pam_mass_rite_conversion_contribution_integrate_existing_rituals$#! na [Concept('great_project','velký projekt')|E] [GetGreatProjectType('pam_mass_rite_conversion').GetName|V] bude zdarma."
 pam_theocratic_ruler_events.0014.c: "Přijmu za vlastní zásadu [offered_tenet_b.GetBaseNameNoTooltip]."
 pam_theocratic_ruler_events.0014.c.tt: "Tvůj příští příspěvek #V $great_project_type_pam_mass_rite_conversion_contribution_integrate_existing_rituals$#! na [Concept('great_project','velký projekt')|E] [GetGreatProjectType('pam_mass_rite_conversion').GetName|V] bude zdarma."
 pam_theocratic_ruler_events.0014.d: "Vede snad ovce svého pastýře?"
 pam_theocratic_ruler_events_0014_mass_conversion_discount_desc: "Prosba obrácence"
 pam_theocratic_ruler_events.0015.t: "Vedení nástupců"
 pam_theocratic_ruler_events.0015.desc: "Po mé smrti bude stolice potřebovat pastýře, který dokáže vést lid v modlitbách i při vynášení rozsudků. [succession_heir_first.GetTitledFirstName], první v pořadí nástupnictví, a [succession_heir_second.GetTitledFirstName], hned na druhém místě, přicházejí na mé zavolání, aby přede mnou v soukromí předříkávali Písmo svaté.\n\nNěkdo z nich zdědí mé břímě a dnes nemohu stejnou měrou formovat oba.\n\n„Mé děti ve víře. Ukažte mi nejen to, co jste se naučily nazpaměť, ale i to, co jste přijaly za své.“"
 pam_theocratic_ruler_events.0015.a: "Vyučím [succession_heir_first.Custom('CZ_FirstNameNoTooltip_A')] Písmu svatému."
 pam_theocratic_ruler_events.0015.b: "Provedu [succession_heir_second.Custom('CZ_FirstNameNoTooltip_A')] posvátnými texty."
 pam_theocratic_ruler_events.0015.c: "Ještě jsem [Select_CString(ROOT.Char.IsFemale,'pastýřkou','pastýřem')] já. Recitovat budu [Select_CString(ROOT.Char.IsFemale,'sama','sám')]."
 pam_theocratic_ruler_events.0015.c.success: "Tvá učenost předčí jejich recitaci"
 pam_theocratic_ruler_events.0015.c.failure: "Zadrhneš se u pasáže, kterou znají nazpaměť"
 pam_theocratic_ruler_events.0015.c.toast.success: "Tvá znalost učení na ně zapůsobí."
 pam_theocratic_ruler_events.0015.c.toast.failure: "Tví podřízení si vymění pohledy nad tvou chybou."
