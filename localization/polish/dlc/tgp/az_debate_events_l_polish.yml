l_polish:
 az_debate.0001.t: "Učedník, kterého stojí za to získat"
 az_debate.0001.desc: "Na druhém konci síně spolu rozmlouvají [rival_elder.Custom2('MyCharacterIntroduction', ROOT.Char)] a [disciple_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)]. První se naklání blíž. „Pod mým vedením jsou kázeň a věrnost pilíři skutečného mistrovství,“ prohlašuje [rival_elder.GetTitledFirstNameNoTooltip] s neskrývanou pýchou v hlase.\n\n„Ovšem, [Select_CString(rival_elder.IsFemale,'ctihodná starší','ctihodný starší')],“ odpovídá [disciple_candidate.GetTitledFirstNameNoTooltip], ale pohledem zabloudí ke mně. „Co však nové myšlenky, prověřené v otevřené debatě?“ V koutcích úst se rýsuje sotva znatelný úsměv. Ostrost v hlase prozrazuje neklid a možná se přede mnou otevírá příležitost."
 az_debate.0001.a: "Veřejně vyzvat [rival_elder.Custom('CZ_TitledFirstNameNoTooltip_A')] k debatě."
 az_debate.0001.a.success: "Svým důvtipem předčím [rival_elder.Custom('CZ_FirstNameNoTooltip_A')]"
 az_debate.0001.a.failure: "Ve svých protiargumentech zajdu příliš daleko"
 az_debate.0001.b: "V soukromí nabídnout své vedení."
 az_debate.0001.b.success: "[disciple_candidate.GetFirstNameNoTooltip|U] přijímá mé pozvání"
 az_debate.0001.b.failure: "Mé návrhy se míjejí účinkem"
 az_debate.0001.d: "Tentokrát to nechám být."
 az_debate.0002.t: "Chvíle [Select_CString(elder_candidate.IsFemale,'se starší','se starším')]"
 az_debate.0002.desc: "Síní se rychle šíří zpráva: [elder_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)|U] je tady.\n\n„Dlouho se nezdržím,“ pronese starší klidným, ale zvučným hlasem.\n\n[audience_rep.GetFirstNameNoTooltip] se ke mně nakloní a naléhavě zašeptá: „Jestli máš co říct, řekni to hned, než [elder_candidate.Custom('CZ_TitledFirstNameNoTooltip_A')] obklopí ostatní.“"
 az_debate.0002.a: "Zapůsobit jediným dokonale vystavěným argumentem."
 az_debate.0002.a.success: "Má argumentace míří přesně do černého"
 az_debate.0002.a.failure: "Zaváhám"
 az_debate.0002.c: "Získat [elder_candidate.Custom('CZ_TitledFirstNameNoTooltip_A')] pro sebe dřív, než si toho ostatní všimnou."
 az_debate.0002.c.success: "Davem proklouznu jako stín"
 az_debate.0002.c.failure: "K [elder_candidate.Custom('CZ_TitledFirstNameNoTooltip_D')] se dostanu příliš pozdě"
 az_debate.0002.d: "Nechat příležitost proklouznout mezi prsty."
 az_debate.0003.t: "Dilema"
 az_debate.0003.desc: "[disciple_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)|U] předstoupí přede mě s vyzývavým leskem v očích. „Když si panovník musí vybrat mezi dodržením slibu, který uškodí jeho panství, a jeho porušením, které zachrání jeho lid, která cesta je spravedlivá?“\n\nTo není plané rozjímání, ale zkouška, která má prověřit mou hodnotu."
 az_debate.0003.a: "„Následuj mě a já ti to ukážu.“"
 az_debate.0003.b: "„Dobře poslouchej. Pravda se skrývá v podobenstvích a příslovích.“"
 az_debate.0003.b.success: "Poučení je jasné"
 az_debate.0003.b.failure: "Smysl se vytrácí"
 az_debate.0003.c: "„Ať mou hodnotu dosvědčí síla hnutí [my_movement.GetNameNoTooltip].“"
 az_debate.0003.d: "„[ROOT.Char.GetFaith.ReligiousText|U] nám ukáže cestu k odpovědi.“"
 az_debate.0004.t: "Sbor pochybovačů"
 az_debate.0004.desc: "Všimnu si hloučku lidí v těsném kruhu. Jejich smích je uštěpačný a pohrdavý. Z kruhu se ke mně s potměšilým úsměvem naklání [freethinker_friend.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n„Tak nám pověz, [ROOT.Char.GetFirstNameNoTooltip], proč bychom se měli tvému hnutí klanět? Prapory nás nelákají a s pány už nám došla trpělivost.“"
 az_debate.0004.a: "„Samotný rozum prokáže sílu toho, za čím stojím.“"
 az_debate.0004.b: "„Tvůj důvtip tady přichází nazmar. Přidej se raději ke mně.“"
 az_debate.0004.c: "„Promluvme si u sklenky něčeho dobrého. Co třeba [ROOT.Char.Custom('GetExpensiveDrink')|l]?“"
 az_debate.0004.c.success: "[freethinker_friend.GetFirstNameNoTooltip|U] si tvou společnost začíná užívat"
 az_debate.0004.c.failure: "Nenápadný přístup selže"
 az_debate.0004.d: "„Pak mluvte svobodně a jděte vlastní cestou.“"
 az_debate.0005.t: "Poslední rozhodnutí [Select_CString(elder_candidate.IsFemale,'starší','staršího')]"
 az_debate.0005.desc: "[elder_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)|U] si zamyšleně hladí bradu a pohledem přelétá ode mě k další postavě. [rival_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)] totiž také čeká na rozhodnutí.\n\n„Tohle může být poslední učedník, kterého přijmu,“ zazní vážným hlasem. „Dokáže mě někdo z vás přesvědčit, že si to zaslouží?“\n\n[rival_candidate.GetFirstNameNoTooltip] založí ruce na prsou a ušklíbne se. „Tuhle příležitost si nenechám ujít.“"
 az_debate.0005.a: "„[Select_CString(ROOT.Char.IsFemale,'Jsem připravena','Jsem připraven')|U] dokázat, co ve mně je.“"
 az_debate.0005.a.success: "Zapůsobíš na [elder_candidate.Custom('CZ_FirstNameNoTooltip_A')]"
 az_debate.0005.a.failure: "Na [elder_candidate.Custom('CZ_FirstNameNoTooltip_A')] nezapůsobíš"
 az_debate.0005.b: "„Pomohu ti dokončit tvé poslední pojednání.“"
 az_debate.0005.b.tt: "Nemáš dostatečnou [Concept('learning','učenost')|E] a chybí ti [GetTrait('confucian_education').GetName(ROOT.Char)]"
 az_debate.0005.c: "„Nebudu ti stát v cestě.“"
 az_debate.0006.t: "Poslední lekce"
 az_debate.0006.desc: "[current_elder.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se na mě zadívá a tiše, rozvážně promluví:\n\n„Už ode mě nemůžeš získat nic dalšího, [ROOT.Char.GetFirstNameNoTooltip]. Všechno, co ti mé učení mohlo dát, už znáš. Má slova moudrosti se vyčerpala a plamen mé lampy téměř dohořel. Přesto si nemysli, že zůstaneš bez vedení. Je tu někdo, jehož moudrost září ještě jasněji: [new_elder.Custom2('MyCharacterIntroduction', ROOT.Char)].“\n\nStarší pokývne hlavou směrem k úctyhodné postavě, která má ve tváři vážný, očekávající výraz. „Budeš-li chtít, svěřím tě do péče [new_elder.Custom('CZ_TitledFirstNameNoTooltip_G')]. Anebo tě tvá cesta zavede jinam?“\n\nŘíká se, že pokračovat v nepřerušeném předávání učení znamená ctít to, čemu dávní mudrci říkali [Glossary( 'dao', 'CONFUCIAN_DAO')]."
 az_debate.0006.a: "„Přijmu vedení [new_elder.Custom('CZ_FirstNameNoTooltip_G')].“"
 az_debate.0006.b: "„Tvé učení mi stačí.“"
 az_debate.0006.c: "„Proč omezovat moudrost na jediný hlas?“"
 az_debate.0006.c.success: "Oba starší uznale přikyvují"
 az_debate.0006.c.failure: "[new_elder.GetFirstNameNoTooltip|U] dotčeně ztuhne"
 CONFUCIAN_DAO: "Označuje Cestu – mravní řád a kosmickou stezku, o nichž učili mudrci. Je vodítkem ke správnému jednání i základem harmonie mezi Nebem, Zemí a lidstvem."
 az_debate.0007.t: "Veřejné pokárání"
 az_debate.0007.desc: "„Copak se vůbec posloucháš?“ vyštěkne [rival_elder.Custom2('MyCharacterIntroduction', ROOT.Char)] na [Select_CString(disciple_candidate.IsFemale,'svou učednici','svého učedníka')]. Ostrý hlas prořízne celou síň. „I malé dítě by dokázalo přednášet klasické spisy s větším porozuměním!“\n\n[disciple_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)|U] snáší každé slovo jako úder. Písaři se zarazí uprostřed tahu a na jejich štětcích se hromadí kapky inkoustu. Pohled klesá k zemi, tváře rudnou a ramena tuhnou, jako by se každou chvíli měl spustit prudký liják."
 az_debate.0007.a: "„To, kdo jsi, neurčuje cizí hněv.“"
 az_debate.0007.b: "„Pověz mi, co ti [rival_elder.GetTitledFirstNameNoTooltip] [Select_CString(rival_elder.IsFemale,'provedla','provedl')].“"
 az_debate.0007.b.success: "[Select_CString(disciple_candidate.IsFemale,'Učednice nadšeně souhlasí','Učedník nadšeně souhlasí')]"
 az_debate.0007.b.failure: "Při vysvětlování se mi plete jazyk"
 az_debate.0007.c: "„Prosím, promluvme si raději o souladu.“"
 az_debate.0008.t: "Učenci na rozcestí"
 az_debate.0008.desc: "V přítmí síně upoutá mou pozornost zdvořilý rozhovor. Vedou jej [neutral_scholar.Custom2('MyCharacterIntroduction', ROOT.Char)] a [rival_leader.Custom2('MyCharacterIntroduction', ROOT.Char)], [Select_CString(rival_leader.IsFemale,'členka','člen')] skupiny [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey('undecided_movement').GetName].\n\n„Hnutí [rival_movement.GetName] pěstuje ctnost prostřednictvím kázně,“ tvrdí [rival_leader.GetTitledHouseNameOrFirstName] a s klidnou jistotou rozevře dlaně. „A přece,“ vloží se do řeči [neutral_scholar.GetTitledHouseNameOrFirstName], „může samotná kázeň bez soucitu skutečně živit soulad?“ [Select_CString(rival_leader.IsFemale,'Zastánkyni','Zastánci')] hnutí [rival_movement.GetNameNoTooltip] se svraští obočí."
 az_debate.0008.a: "„Zamysli se nad souladem, který nabízí hnutí [my_movement.GetNameNoTooltip].“"
 az_debate.0008.b: "„Poměřme naše názory se samotnými klasickými spisy.“"
 az_debate.0008.b.success: "Připravím je o slova"
 az_debate.0008.b.failure: "Nepřesvědčeně přikyvují"
 az_debate.0008.c: "„Pojď, [neutral_scholar.GetTitledHouseNameOrFirstName], a ukážu ti pravou ctnost.“"
 az_debate.0008.d: "„Raději se do toho nebudu plést...“"
 az_debate.0008.d.flavor: "... a zchladím si hlavu tady ve stínu."
 az_debate.0009.t: "Učený přešlap"
 az_debate.0009.desc: "[errant_disciple.Custom2('MyCharacterIntroduction', ROOT.Char)|U] sebejistě povstane, odkašle si a prohlásí: „[Glossary('Mistr','CONFUCIUS_GLOSS')] pravil: ‚Vládne-li panovník pomocí [Glossary('rituálu','CONFUCIAN_LI')], je jako Polárka, před níž se skloní všechny hvězdy!‘“\n\nSíní se rozlehne vlna pobaveného smíchu. [stickler_scholar.Custom2('MyCharacterIntroduction', ROOT.Char)|U] nakloní hlavu a hlasem jemným jako hedvábí poznamená: „Zajímavé... Jenže Hovory nehovoří o rituálu, nýbrž o [Glossary('ctnosti','CONFUCIAN_DE')]. Právě ctnost drží hvězdy na jejich místech, nikoli obřady.“"
 CONFUCIAN_LI: "Označuje rituální řád a dodržování náležitých forem jednání, které udržují soulad ve společnosti a odrážejí vnitřní ctnost."
 az_debate.0009.a: "„Nezáleží na přesných slovech, ale na jejich záměru.“"
 az_debate.0009.b: "Odvést pozornost shromáždění zdvořilou historkou."
 az_debate.0009.d: "„Pojď, [errant_disciple.GetFirstNameNoTooltip], půjdeme raději jinam.“"
 az_debate.0010.t: "Ostnaté verše"
 az_debate.0010.desc: "Sleduji přednes básně. [poet.Custom2('MyCharacterIntroduction', ROOT.Char)|U] právě recituje její poslední verš: „Pokřivený kmen se pne k nebi, kořeny má hluboko zapuštěné a větve obtěžkané stíny.“\n\nDavem se nese souhlasné mumlání.\n\n[critic.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se ke mně nakloní a zašeptá mi do ucha: „[poet.Custom('CZ_FirstNamePossessiveNoTooltip_F')|U] báseň není jen prostým obrazem. Naznačuje, že [ROOT.Char.GetTopLiege.GetTitleAsName] se odchyluje od mandátu nebes a že se kdesi v skrytu rozmáhá zkáza...“"
 az_debate.0010.a: "„To je očividný výsměch [ROOT.Char.GetLiege.Custom('CZ_TitleAsNameNoTooltip_D')]!“"
 az_debate.0010.b: "V soukromí si vyžádám [Select_CString(poet.IsFemale,'její','jeho')] radu."
 az_debate.0010.c: "„Ale no tak, vždyť je to jen umění!“"
 tgp_subtle_counsel_modifier: "Nenápadné rady"
 tgp_subtle_counsel_modifier_desc: "Tato postava vyhledává rady někoho, kdo ovládá umění jemných náznaků."
 az_debate.0011.t: "[Select_CString(observed_elder.IsFemale,'Pozorování starší','Pozorování staršího')]"
 az_debate.0011.desc: "Rozprava plyne rozvážným tempem. [observed_elder.Custom2('MyCharacterIntroduction', ROOT.Char)|U] pronáší každé slovo s vážností a přesností pravidelných úderů chrámového zvonu.\n\n„Obřady jsou kostrou panství. Bez nich se ctnost hroutí. Přehlížet klasické spisy znamená zvát chaos, nechat růst plevel tam, kde by mělo zrát obilí.“"
 az_debate.0011.a: "Možná se od [Select_CString(observed_elder.IsFemale,'ní','něj')] ještě něčemu přiučím?"
 az_debate.0011.b: "„Důležité poučení.“"
 az_debate.0011.c: "„To je jasná podpora hnutí [GetPlayer.Custom('GetMyMovementShort')]!“"
