l_polish:
 az_examination.0001.t: "Posouzení kaligrafie"
 az_examination.0001.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('entrant'))] [entrant.GetTitledHouseNameOrFirstName] se lehce ukloní a podá mi pečlivě složený svitek.\n\n„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ osloví mě. „S pokorou ti předkládám své písemné práce k posouzení. [Select_CString(entrant.IsFemale,'Věnovala','Věnoval')] jsem těmto řádkům mnoho úsilí. Některé vyjadřují pevné přesvědčení, jiné... odrážejí mé hledání rovnováhy. Velmi [Select_CString(entrant.IsFemale,'ráda','rád')] bych [Select_CString(entrant.IsFemale,'znala','znal')] tvůj názor.“"
 az_examination.0001.intrigue: "„Jen nezapomeň, kdo ti tu vlastně pomáhá.“"
 az_examination.0001.a: "Nabídnu laskavé a konstruktivní připomínky."
 az_examination.0001.b: "Vysměju se ubohým pokusům, které mi předkládá."
 az_examination.0001.c: "Porovnám dílo se spisy starých mistrů a sepíšu komentář."
 az_examination.0002.t: "Veřejná výzva"
 az_examination.0002.desc.exam: "[debater.Custom2('MyCharacterIntroduction', ROOT.Char)|U] $az_examination.0002.desc$"
 az_examination.0002.desc.debate: "[debater.GetFirstName|U], [Select_CString(debater.IsFemale,'zástupkyně','zástupce')] hnutí [debater_movement.GetName], $az_examination.0002.desc$"
 az_examination.0002.desc: "mi zastoupí cestu, právě když odcházím z pracovny. Samolibý výraz ve tváři prozrazuje, že už dlouho vyhlíží příležitost zaskočit nic netušícího učence.\n\n„Nikdo nerozumí Letopisům jar a podzimů lépe než já! [Glossary( 'Konfucius', 'CONFUCIUS_GLOSS' )] se ve svých slovech neomezoval na pouhý záznam událostí. Svými důmyslnými formulacemi vyzdvihoval ctnostné a odsuzoval ničemy. Copak se mnou nesouhlasíš?“"
 az_examination.0002.a: "„Jen [debater.Custom2('InsultNoun', ROOT.Char)] jako ty dokáže tak špatně pochopit tak jasný text!“"
 az_examination.0002.b: "„Tady není místo pro smyšlenky.“"
 az_examination.0002.c: "„Každá cesta k moudrosti je jedinečná.“"
 az_examination.0002.d: "Ukončím tuto neplodnou debatu."
 az_examination.0003.t: "Zneuctěný čajový obřad"
 az_examination.0003.desc: "[tea_offender.Custom2('MyCharacterIntroduction', ROOT.Char)|U] přistupuje ke zkoušejícím s podnosem čaje. Nalévá nesprávnou rukou, rukávy přitom zametají podlahu a šálky podává bez úklony či obřadního požehnání.\n\n[host_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vše sleduje s chladným opovržením. „Nedodržováním náležitých obřadů podrýváš vlastní ctnost, [tea_offender.Custom('CZ_FirstNameNoTooltip_V')],“ pronese tak hlasitě, aby to všichni slyšeli. Při strnulé úkloně se [tea_offender.Custom('CZ_FirstNameNoTooltip_G')] třesou ruce."
 az_examination.0003.a: "„Dovol mi předvést správný postup, [host_examiner.Custom('CZ_TitledFirstNameNoTooltip_V')].“"
 az_examination.0003.b: "„Proč nás obsluhuje zrovna [tea_offender.Custom2('InsultNoun', ROOT.Char)]?“"
 az_examination.0003.c: "Zůstanu zticha."
 az_examination.0004.t: "Zakázané odpovědi"
 az_examination.0004.desc: "Náhle si všimnu, jak [caught_entrant.Custom2('MyCharacterIntroduction', ROOT.Char)] nervózně listuje opotřebovaným rukopisem. V očích se zračí dychtivost, kterou se jen stěží daří skrýt.\n\n„To je... jen pro nahlédnutí!“ zazní koktavá obhajoba. „Při zkoušce jsem to použít [Select_CString(caught_entrant.IsFemale,'nechtěla','nechtěl')]! Opravdu!“ Obchodník [merchant.GetTitledHouseNameOrFirstName] se na mě vědoucně usměje. „Velmi užitečná studijní pomůcka, vznešenosti. Stojí jen pár mincí. Možná by [Select_CString(ROOT.Char.IsFemale,'tak vážená dáma','tak vážený pán')] jako ty [Select_CString(ROOT.Char.IsFemale,'ocenila','ocenil')] celou sbírku?“"
 az_examination.0004.b: "Oznámím tento hanebný čin a zabavím svitek."
 az_examination.0004.c: "Koupím od obchodníka zajímavý svitek."
 az_examination.0004.c.tt: "Získáš [Concept('artifact','artefakt')|E] v podobě svitku zaměřeného na [Concept('learning','učenost')|E] a vzdělání [GetTrait('confucian_education').GetName(GetNullCharacter)]"
 az_examination.0004.c.tt_equipped: "Zakoupen svitek [artifact_scroll.GetName]"
 az_examination.0004.d: "„Já nic nevidím.“"
 az_examination.0005.china.t: "Zamyšlení nad Menciem"
 az_examination.0005.china.desc: "[fellow_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] stojí před kamennou stélou s vyrytým výrokem Mencia a v zamyšlení svírá ruce za zády.\n\n„Tento výrok jsem [Select_CString(fellow_examiner.IsFemale,'četla','četl')] již nesčetněkrát,“ zazní tiché zamručení, když přistoupím blíž, „a přesto mi jeho skutečný význam stále uniká. Mencius praví: ‚Velký člověk je ten, kdo si uchová dětské srdce.‘ Co si o tom myslíš, [ROOT.Char.Custom('CZ_TitledFirstNameNoTooltip_V')]?“"
 az_examination.0005.korea.t: "Zamyšlení nad Čchö Čchi-wonem"
 az_examination.0005.korea.desc: "[fellow_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] upřeně hledí na kamennou rytinu. Plynulé tahy vytesané kaligrafie nezaměnitelně prozrazují rukopis učence Čchö Čchi-wona. Ruce má sepjaté za zády a pohled ztracený v hlubokém zamyšlení.\n\n„Tato slova napsal Čchö Čchi-won při návratu od dvora dynastie Tchang,“ zazní tichý hlas, když se připojím. „Pravil: ‚Ušlechtilý člověk musí nejprve ovládnout vlastní srdce, než začne vládnout druhým.‘ Přemýšlím o těch slovech už od svých učednických let, a přesto mi stále nedají spát.“"
 az_examination.0005.t: "Zamyšlení nad starobylým veršem"
 az_examination.0005.desc: "[fellow_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] upoutá mou pozornost zamyšleným pohledem upřeným na stélu s vyrytým klasickým textem.\n\n„Tato pasáž mi už dlouho vrtá hlavou,“ zazní tiše. „Co si o ní myslíš, [ROOT.Char.Custom('CZ_TitledFirstNameNoTooltip_V')]?“"
 az_examination.0005.china.a: "„Je to výzva uchovat to, čemu staří mudrci říkali [Glossary( 'te', 'CONFUCIAN_DE' )].“"
 CONFUCIAN_DE: "Označuje mravní sílu neboli ctnost, která člověku umožňuje příznivě působit na ostatní a udržovat společenskou harmonii."
 az_examination.0005.a: "„Je to výzva k zachování mravní čistoty.“"
 az_examination.0005.b: "„Správný řád stojí nade vším.“"
 az_examination.0005.c: "„Jak... citlivé od něj.“"
 az_examination.0005.d: "„Smysl života musí každý nalézt sám.“"
 az_examination.0006.t: "Synovská úcta"
 az_examination.0006.desc: "Zahlédnu dvě postavy, které stojí až podezřele blízko u sebe. Jsou to [favored_entrant.GetFirstName] a [local_ruler.GetTitledHouseNameOrFirstName]. Jejich pohledy se setkají na okamžik, který trvá o něco déle, než by měl. „Nezklamu tě. Jsi přece [favored_entrant.Custom2('RelationToMe', SCOPE.sC('local_ruler'))],“ zašeptá [favored_entrant.GetFirstNameNoTooltip] téměř neslyšně.\n\nJakmile si mě [local_ruler.GetTitleAsNameNoTooltip] všimne, rychle přistoupí ke mně. „[favored_entrant.GetFirstNameNoTooltip|U] si své místo skutečně [Select_CString(favored_entrant.IsFemale,'zasloužila','zasloužil')], tím tě ujišťuji,“ šeptá [local_ruler.GetTitledFirstNameNoTooltip] se zdvořilým úsměvem na rtech."
 az_examination.0006.a: "„O tom se přesvědčím osobně.“"
 az_examination.0006.b: "„Každý z nás stoupá díky pomoci druhých.“"
 az_examination.0006.c: "„Ať rozhodne pouze předvedené dílo.“"
 az_examination.0007.t: "Váha tuše"
 az_examination.0007.desc: "[aged_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] před zkouškou připravuje druhý ze [Glossary( 'Čtyř pokladů', 'FOUR_TREASURES' )]. Zkušenými, rozvážnými pohyby roztírá borovicové saze na bronzové destičce a míchá z nich kvalitní tuš. Pak na mě vrhne pronikavý pohled a podá mi tlouk.\n\n„Teď je řada na tobě. Tato tuš musí plynout jako měsíční světlo po vodní hladině a přetrvat déle než celé říše. Správný postup najdeš v [Glossary( 'Knize obřadů', 'BOOK_OF_RITES' )].“"
 BOOK_OF_RITES: "Klasický spis o řádu a harmonii, který stanovuje zásady správného jednání pro učence, potomky i panovníky. Řídit se jeho poučením znamená ctít samotné základy civilizace."
 FOUR_TREASURES: "Čtyři poklady – štětec, tuš, papír a třecí kámen – jsou nepostradatelnými pomůckami každého učence. Pečlivé zacházení s nimi svědčí o disciplíně, jasnosti mysli a úctě k tradicím."
 az_examination.0007.a: "„Klasické spisy se nemýlí.“"
 az_examination.0007.b: "„Několik kapek ženšenové pryskyřice...“"
 tgp_ginseng_resin_modifier: "Experimentální příprava tuše"
 tgp_ginseng_resin_modifier_desc: "Tiché obřady učenecké pracovny se nyní odrážejí v každém tvém gestu a dodávají tvému vystupování nenápadnou vytříbenost."
 az_examination.0007.c: "„Ať tuš připraví služebnictvo.“"
 az_examination.0008.t: "Výzva v pravý čas"
 az_examination.0008.desc: "[examiner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] přede mnou rozvine staré svitky se zkušebními otázkami. „Pocházejí z dávných časů,“ zazní poznámka doprovázená uctivým pohlazením pergamenu. „Co kdybys [Select_CString(ROOT.Char.IsFemale,'zkusila','zkusil')] odpovědět na jednu z otázek a [Select_CString(ROOT.Char.IsFemale,'nechala','nechal')] mě svůj výkon posoudit?“\n\n[ROOT.GetCharacter.Custom('quirk_pos_adverb')|U] pozvednu obočí. Tyto svitky mi připomínají doby, kdy [memory.GetDescription]."
 az_examination.0008.a: "„Navzájem si ohodnoťme své odpovědi.“"
 az_examination.0008.a.success.tt: "Předčíš výkon, který předvede [examiner.GetTitledHouseNameOrFirstName]"
 az_examination.0008.a.failure.tt: "Důvtip [examiner.Custom('CZ_TitledFirstName_G')] předčí ten tvůj"
 az_examination.0008.b: "„Ach, to byly časy... Zavzpomínejme si.“"
 az_examination.0008.c: "„Dnes ne.“"
 az_examination.0009.t: "Inkoustová pohroma"
 az_examination.0009.desc: "Bedna dopadne na zem s odporným šplouchnutím. [clumsy_entrant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] zděšeně hledí na tu spoušť, stále se štětcem v ruce a nohama potřísněnýma inkoustem. Vtom se přiřítí [angry_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)], v očích planoucí vztek.\n\n„[Select_CString(clumsy_entrant.IsFemale,'Zničila','Zničil')|U] jsi celodenní přípravy!“ zazní hromový řev."
 az_examination.0009.a: "„Byla to moje vina. [Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] jsem bednu lépe zajistit.“"
 az_examination.0009.b: "„Taková nešikovnost je nepřijatelná!“"
 az_examination.0009.c: "„Ukliďte to. Máme ještě spoustu práce.“"
 az_examination.0010.t: "Zapečetěná laskavost"
 az_examination.0010.desc: "[requesting_entrant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně přistupuje tichými kroky, nervózně se ohlíží přes rameno a podává mi svitek.\n\n„[Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')|U] bys zařídit, aby tento svitek [Select_CString(target_examiner.IsFemale,'dostala','dostal')] [target_examiner.GetTitledHouseNameOrFirstName]?“ zazní šeptem. „Je to... soukromá záležitost.“"
 az_examination.0010.a: "Nenápadně doručím dopis."
 az_examination.0010.b: "Odhalím pokus, kterým se [requesting_entrant.GetFirstNameNoTooltip] snaží ovlivnit zkoušku."
 az_examination.0010.c: "Okamžitě poruším pečeť a dopis si přečtu."
 az_examination.0010.c.tt: "Odhalíš [Concept('secret','tajemství')|E], které skrývá [requesting_entrant.GetFirstName]"
 az_examination.0010.c.toast: "Skandální odhalení!"
 az_examination.0011.t: "Tajná výměna míst"
 az_examination.0011.desc: "[sneaky_entrant_1.GetTitledHouseNameOrFirstName|U] a [sneaky_entrant_2.GetTitledHouseNameOrFirstName] se k sobě nakloní. Mluví šeptem, ale přesto dokážu zaslechnout jejich rozhovor:\n\n„Když si vyměníme místa,“ zašeptá [sneaky_entrant_2.GetTitledFirstNameNoTooltip], „mou práci bude hodnotit ten zkoušející s laskavýma očima.“"
 az_examination.0011.a: "Přede všemi odhalím jejich podvod."
 az_examination.0011.b: "Nabídnu jim svou pomoc... a mlčenlivost."
 az_examination.0011.b.success: "Uchazeči hltají každé tvé slovo"
 az_examination.0011.b.failure: "Uchazeči vůči tobě pojmou podezření"
 az_examination.0011.c: "Nenápadně je vyzvu, aby si to rozmysleli."
 az_examination.0012.t: "Soukromé pozvání"
 az_examination.0012.desc: "Ve stínu zahradního pavilonu mě s laskavým úsměvem přivolá [senior_examiner.GetTitledHouseNameOrFirstName], [Select_CString(senior_examiner.IsFemale,'vážená zkoušející','vážený zkoušející')]. „Vždy mě těší rozmlouvat s lidmi, kteří si váží vzdělání. Pojď, přisedni si ke mně na čaj,“ zazní srdečné pozvání.\n\nNa druhé straně pavilonu si však všimnu, jak se blíží [jealous_rival.Custom2('InsultAdjective', ROOT.Char)] [jealous_rival.Custom2('InsultNoun', ROOT.Char)] [jealous_rival.GetTitledHouseNameOrFirstName]. S podnosem v rukou a závistí planoucí v očích se zjevně snaží získat přízeň zkoušejícího."
 az_examination.0012.a: "„Bude mi ctí.“"
 az_examination.0012.b: "„Co kdybychom udělali místo ještě někomu?“"
 az_examination.0012.c: "„Odpusť, dnes se musím věnovat svým svitkům.“"
 az_examination.0013.t: "Zmizelé zkušební práce"
 az_examination.0013.desc: "„Jsou pryč!“ vykřikne [fellow_assistant.GetTitledHouseNameOrFirstName], [Select_CString(fellow_assistant.IsFemale,'má kolegyně','můj kolega')], a začne horečně otevírat jednu zásuvku za druhou. „Práce určené k roztřídění! Už jsem je [Select_CString(fellow_assistant.IsFemale,'hledala','hledal')] všude!“\n\nNa druhé straně místnosti si [calm_examiner.GetTitledHouseNameOrFirstName], [Select_CString(calm_examiner.IsFemale,'jedna ze zkoušejících','jeden ze zkoušejících')], bezstarostně listuje knihou a zamumlá: „Panikařit můžeš, ale práce ti to nevrátí.“ Nepochybuji, že v tom má [calm_examiner.Custom2('InsultNoun', ROOT.Char)] prsty."
 az_examination.0013.a: "„Budeme hledat společně. Ještě je včas najdeme!“"
 az_examination.0013.a.success: "Najdeš ztracené svitky"
 az_examination.0013.a.failure: "Svitky zůstanou ztracené"
 az_examination.0013.b: "„Na můj vkus se chováš až příliš klidně, [calm_examiner.Custom('CZ_FirstNameNoTooltip_V')]. Co skrýváš?“"
 az_examination.0013.b.success: "[calm_examiner.GetFirstNameNoTooltip|U] si příhodně „vzpomene“, že práce [Select_CString(calm_examiner.IsFemale,'přemístila','přemístil')]"
 az_examination.0013.b.failure: "Tvé obvinění se setká s chladným opovržením"
 az_examination.0013.c: "„Prostě je přepíšu.“"
 az_examination.0013.d: "„To není můj problém.“"
 az_examination.0014.t: "Pod tlakem"
 az_examination.0014.desc: "Trhnutím se probudím. To jsem právě [Select_CString(ROOT.Char.IsFemale,'usnula','usnul')] u psacího stolu? Dotknu se tváře a ucítím na kůži otisk knihy, na které mi spočívala hlava.\n\nOtočím se. Přede mnou stojí zkoušející [praising_examiner.GetTitledHouseNameOrFirstName], [Select_CString(praising_examiner.IsFemale,'jejíž','jehož')] kroky mě probudily. Na rtech pohrává slabý úsměv. „Netrap se, [Select_CString(ROOT.Char.IsFemale,'mladá dámo','mladý pane')]. Tvé pilné úsilí nezůstalo bez povšimnutí. Až přijde čas, tvá píle a učenlivost jistě dojdou zasloužené odměny.“\n\nPomyšlení, že si někdo všiml mých dlouhých nocí a hodin strávených nad knihami, mě naplňuje uspokojením."
 az_examination.0014.a: "„Tvé očekávání nezklamu.“"
 az_examination.0014.c: "„Mohu u tebe vstoupit do učení?“"
 az_examination.0014.d: "„Tvá starostlivost mě hřeje u srdce.“"
 tgp_examiner_promise_modifier: "Vysoká očekávání"
 tgp_examiner_promise_modifier_desc: "Tato postava slíbila, že dostojí chvále svých starších i pozornosti, která s ní přichází."
 az_examination.0015.t: "[Select_CString(proud_family_member.IsFemale,'Hrdá','Hrdý')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('proud_family_member'))|l]"
 az_examination.0015.desc: "[proud_family_member.Custom2('MyCharacterIntroduction', ROOT.Char)|U] stojí na okraji shromáždění a v očích se zračí hrdost.\n\n„Tamhle! To je [ROOT.Char.Custom('ComplimentAdjective')] [proud_family_member.Custom2('RelationToMeShort', ROOT.Char)]!“ zazní tak hlasitě, až sebou okolní uchazeči trhnou a obrátí se tím směrem s podrážděnými pohledy."
 az_examination.0015.a: "S úctou a vděčností se [Select_CString(proud_family_member.IsFemale,'jí','mu')] ukloním."
 az_examination.0015.b: "Později si s [Select_CString(proud_family_member.IsFemale,'ní','ním')] promluvím o diskrétnosti."
 az_examination.0015.c: "Skloním hlavu a splynu s davem."
 az_examination.0015.d: "„Postarám se, abys na mě [Select_CString(proud_family_member.IsFemale,'byla hrdá','byl hrdý')]!“"
 az_examination.0016.t: "Pár laskavých slov"
 az_examination.0016.desc: "[kind_examiner.GetTitledFirstName|U], [Select_CString(kind_examiner.IsFemale,'uznávaná zkoušející','uznávaný zkoušející')], ke mně tiše přistoupí stranou od hlaholu úspěšnějších uchazečů.\n\n„Možná ti zkouška nevyšla, ale nemysli si, že tvé úsilí přišlo nazmar. Cesta k úřednické dráze je dlouhá a někdy pořádně klikatá.“"
 az_examination.0016.a: "„Máš mou nejhlubší vděčnost.“"
 az_examination.0016.b: "„Přijmeš mě za svou [Select_CString(ROOT.Char.IsFemale,'učednici','učedníka')] a povedeš mě?“"
 az_examination.0016.c: "„Tato slova mi dodají sílu jít dál.“"
 tgp_examiner_encouragement_modifier: "Slova povzbuzení"
 tgp_examiner_encouragement_modifier_desc: "Tato postava si s sebou nese požehnání uznávaného zkoušejícího."
 az_examination.0017.t: "Skrytý dopis"
 az_examination.0017.desc: "Když si upravuji roucho, ucítím hluboko v rukávu zastrčený tuhý list papíru. Někdo mi tam musel před zkouškou podstrčit dopis.\n\nPíše se v něm: „Až se kolem tebe slétnou pochybnosti jako hejno much, pamatuj: [Select_CString(ROOT.Char.IsFemale,'studovala jsi, zápasila jsi s překážkami a nikdy ses nevzdala','studoval jsi, zápasil jsi s překážkami a nikdy ses nevzdal')].“\n\nNa druhé straně nádvoří se objeví [letter_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)] se svazkem svitků. Na okamžik se naše pohledy setkají. Možná bych se [Select_CString(letter_examiner.IsFemale,'jí','mu')] [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] svěřit a společně probrat, co ten dopis vlastně znamená."
 az_examination.0017.b: "„Tato slova patří jen mně.“"
 az_examination.0017.c: "Dám [letter_examiner.Custom('CZ_FirstNameNoTooltip_D')] dopis přečíst."
 tgp_letter_self_reflection_modifier: "Sebereflexe"
 tgp_letter_self_reflection_modifier_desc: "Tato postava čerpá tichou vnitřní sílu ze slov povzbuzení a důvěry své rodiny."
 az_examination.0018.t: "Starší mezi uchazeči"
 az_examination.0018.desc: "Pod slunečníkem zahlédnu osamocenou postavu. Je to [old_exam_taker.Custom2('MyCharacterIntroduction', ROOT.Char)]. Sedí s mírně shrbenými zády a v očích se jí zračí bystrost i únava zároveň.\n\n„Nikdy není pozdě,“ zazní, když si všimne mého pohledu. „Ale v mém věku už je to pořádně dlouhá cesta.“"
 az_examination.0018.b: "„Dovol mi podělit se o to, co jsem se [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')].“"
 az_examination.0018.c: "„Doufám, že takhle nikdy neskončím.“"
 tgp_not_getting_any_younger_modifier: "Takovou budoucnost nechci"
 tgp_not_getting_any_younger_modifier_desc: "Tato postava během zkoušky spatřila staršího uchazeče a pevně se rozhodla, že ji stejný osud nepotká."
 az_examination.0018.d: "„Máš můj obdiv, [old_exam_taker.Custom('ComplimentAdjective')|l] [Select_CString(old_exam_taker.IsFemale,'dámo','pane')].“"
 az_examination.0019.t: "Tíha očekávání"
 az_examination.0019.desc.intro: "Sotva vyjdu ze zkušební síně, zaslechnu známý hlas, který volá mé jméno.\n\n[disappointed_relative.GetFirstName|U] mě zahlédne přes dav a zavolá:"
 az_examination.0019.desc.wrathful: "„[Select_CString(ROOT.Char.IsFemale,'Uvrhla jsi','Uvrhl jsi')] na nás hanbu!“ procedí mezi zuby a v očích [Select_CString(disappointed_relative.IsFemale,'jí','mu')] plane chladný vztek."
 az_examination.0019.desc.callous: "„[Select_CString(ROOT.Char.IsFemale,'Neuspěla jsi','Neuspěl jsi')],“ zazní bezbarvě a tvář se stáhne do mírného, nesouhlasného zamračení."
 az_examination.0019.desc.shy: "„Já... [Select_CString(disappointed_relative.IsFemale,'přišla','přišel')] jsem tě navštívit,“ zazní rozpačitě a tváře se zbarví studem. „Promiň, jestli... jestli je ti to nepříjemné.“"
 az_examination.0019.desc.compassionate: "„Ach, [Select_CString(ROOT.Char.IsFemale,'moje drahá','můj drahý')] [entrant.Custom2('RelationToMe', ROOT.Char)],“ zazní rozechvěle a v očích se zalesknou zadržované slzy. „[Select_CString(ROOT.Char.IsFemale,'Udělala jsi','Udělal jsi')] všechno, co bylo v tvých silách. Nic víc jsem si nikdy [Select_CString(disappointed_relative.IsFemale,'nepřála','nepřál')].“"
 az_examination.0019.desc.fallback: "„Chyběl ti jen krůček,“ zazní tiše a ve tváři se zračí neskrývané zklamání."
 az_examination.0019.a: "„Příště uspěju. Přísahám.“"
 az_examination.0019.b: "„[Select_CString(disappointed_relative.IsFemale,'Mohla','Mohl')] bys mi... pomoci?“"
 az_examination.0019.c: "Teď se [Select_CString(disappointed_relative.IsFemale,'jí','mu')] nedokážu podívat do očí..."
 tgp_brooding_reflection_modifier: "Pochmurné rozjímání"
 tgp_brooding_reflection_modifier_desc: "Tato postava se uzavřela do sebe a hluboce přemítá nad svým neúspěchem. Možná se v něm však jen utápí."
 az_examination.0020.t: "Úspěch vrstevníka"
 az_examination.0020.desc: "Nádvoří se hemží lidmi a ze všech stran se ozývají hlasy plné hrdosti i zklamání. Mezi vířícími rouchy a svitky zahlédnu [successful_peer.Custom('CZ_FirstName_A')], [Select_CString(successful_peer.IsFemale,'svou vrstevnici','svého vrstevníka')]. Jediný pohled na rukáv s vyšitým znakem palácové zkoušky mi prozradí vše, co potřebuji vědět.\n\nKdyž ke mně přistoupí, na tváři se objeví úsměv. Snad ze zvyku, snad z lítosti, anebo z opravdové radosti."
 az_examination.0020.a: "„[Select_CString(successful_peer.IsFemale,'Zasloužila','Zasloužil')] sis to. Opravdu.“"
 az_examination.0020.b: "Zabručím a vrhnu se do studia s dvojnásobným úsilím."
 az_examination.0020.c: "Stejně mám na starosti důležitější věci."
 tgp_envy_fueled_study_modifier: "Píle živená závistí"
 tgp_envy_fueled_study_modifier_desc: "Tuto postavu naplňuje závist i odhodlání. S novým zápalem se věnuje studiu, aby překonala svůj neúspěch a vyrovnala se těm, kteří ji předstihli."
