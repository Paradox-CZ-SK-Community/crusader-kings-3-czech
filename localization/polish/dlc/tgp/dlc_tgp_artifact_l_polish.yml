l_polish:
 tgp_go_board: "Šťastná deska na go"
 tgp_go_board_desc: "Tato deska sehrála důležitou roli v drtivém vítězství, kterého [bg_victor.GetTitledFirstName] [Select_CString(bg_victor.IsFemale,'dosáhla','dosáhl')] v partii go proti [bg_loser.Custom('CZ_TitledFirstName_D')]. Právě tehdy poprvé přinesla své pověstné štěstí [bg_victor.Custom('CZ_TitledFirstName_D')].\n\nNěkdo by mohl namítnout, že ve hře jako go nemá štěstí příliš místa. Přesto je tato deska od oné památné partie pečlivě opatrována."
 artifact_pedestal_baekje_incense_burner_name: "Pozlacená bronzová kadidelnice"
 artifact_pedestal_baekje_incense_burner_description: "Tato kadidelnice je dokladem mimořádného řemeslného umění, přestože podle všeho pochází z dávných dob království Pekče. Její víko zdobí úchyt ve tvaru fénixe, obklopený 74 horskými vrcholy uspořádanými do několika vrstev. Celou výzdobu doplňuje bohatá přehlídka odlévaných postav a přírodních výjevů."
 artifact_armillary_sphere_china_name: "Císařská armilární sféra"
 artifact_armillary_sphere_china_desc: "Tuto armilární sféru zhotovili zkušení čínští řemeslníci a učenci. Slouží k astronomickým výpočtům a zkoumání nebeských jevů. Jako nástroj pro studium nebeského kalendáře je zároveň symbolem božského práva Syna Nebes vládnout."
 artifact_eight_fold_chest_name: "Osm vnořených schránek"
 artifact_eight_fold_chest_description: "Tento soubor tvoří osm malých schránek vložených jedna do druhé. V té nejvnitřnější spočívá vzácná relikvie Buddhovy prstní kosti. Po generace byla tato relikvie používána při uvítacích obřadech za vlády císařů dynastie Tchang, než dal císař I-cung zhotovit tyto schránky.\n\nKaždá z nich je mistrovsky vypracována ze santalového dřeva, stříbra, zlata či nefritu. Poslední schránku tvoří pagoda z ryzího zlata se čtyřmi dvířky, která ukrývá samotnou relikvii. Na vrcholku pagody spočívá lotosový květ nesoucí zlatou perlu."
 artifact_military_classics_name: "Základy vojenské klasiky"
 artifact_military_classics_description: "„Wu-ťing cung-jao“, neboli „Úplný souhrn vojenské klasiky“, je ilustrovaným kompendiem vojenských znalostí. Dílo vzniklo na příkaz císaře Žen-cunga pod vedením Ceng Kung-lianga a jeho spolupracovníků. Zahrnuje širokou škálu vojenských technologií a jeho účelem je zpřístupnit poznatky klasických vojenských spisů širšímu okruhu čtenářů.\n\nKniha se mimo jiné věnuje obléhacím strojům, námořnímu válčení a návodům na výrobu výbušnin."
