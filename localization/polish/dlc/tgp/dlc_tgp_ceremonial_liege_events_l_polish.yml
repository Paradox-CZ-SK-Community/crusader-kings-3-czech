l_polish:
 tgp_ceremonial_liege_events.0001.t: "Zmatek s pečetěmi"
 tgp_ceremonial_liege_events.0001.desc: "[councillor.GetName|U] omylem [Select_CString(councillor.IsFemale,'rozeslala','rozeslal')] nařízení opatřená jak mou vlastní pečetí, tak pečetí [opposing_power.Custom('CZ_Name_G')].\n\n„Byl to neúmyslný omyl,“ hájí se. „Ale jistě víte, jak rychle se u dvora šíří lži a pomluvy...“\n\nStažení všech nařízení by mohlo být značně nákladné. Veřejně přiznat, že šlo o omyl, by však bylo nesmírně ponižující."
 tgp_ceremonial_liege_events.0001.a_liege: "Připomeneme jim, kdo tu skutečně vládne."
 tgp_ceremonial_liege_events.0001.a_regent: "Musíme to napravit, než si toho [opposing_power.GetFirstNameNoTooltip] všimne."
 tgp_ceremonial_liege_events.0001.b: "Nechme to být. Co záleží na pouhém zdání?"
 tgp_ceremonial_liege_events.0001.b_a: "Nařízení upevní tvou autoritu"
 tgp_ceremonial_liege_events.0001.b_b: "Na celou záležitost se zapomene"
 tgp_ceremonial_liege_events.0001.b_c: "[opposing_power.GetNameNoTooltip|U] získá více moci"
 tgp_ceremonial_liege_events.0010.t: "Skutečná tíha koruny"
 tgp_ceremonial_liege_events.0010.desc: "„Miláčku!“ zvolá [spouse.GetName] při vstupu do naší ložnice. „Máš nějak bledou pleť. Dělám si o tebe starosti.“\n\nObavy [spouse.Custom('CZ_FirstNameNoTooltip_G')] jsou oprávněné. Dny se zdají být stále delší a tíha koruny na mých bedrech každým dnem roste.\n\n„Jestli tě povinnosti tolik vyčerpávají, možná by tě mohl v jejich plnění dočasně zastoupit někdo jiný. Třeba [opposing_power.GetName],“ navrhuje [spouse.GetFirstNameNoTooltip]."
 tgp_ceremonial_liege_events.0010.a: "Máš pravdu. [Select_CString(ROOT.Char.IsFemale,'Sama','Sám')] to nezvládnu."
 tgp_ceremonial_liege_events.0010.b: "Ne, ne. Raději se budu méně ukazovat u dvora."
 tgp_ceremonial_liege_events.0010.b_a: "Ústraní ti výrazně prospěje"
 tgp_ceremonial_liege_events.0010.b_b: "Ústraní ti příliš nepomůže"
 tgp_ceremonial_liege_events.0010.c: "Rozhodně ne! Tomuto panství vládnu já!"
 tgp_ceremonial_liege_events.0010.d: "To tě k tomu [opposing_power.GetFirstNameNoTooltip] [Select_CString(opposing_power.IsFemale,'navedla','navedl')], že ano?"
 tgp_ceremonial_liege_events.0010.d_desc: "Obviníš [spouse.Custom('CZ_FirstNameNoTooltip_A')] ze spiknutí s [opposing_power.Custom('CZ_FirstNameNoTooltip_I')]"
 tgp_ceremonial_liege_events.0010.tt.success: "Najdeš skutečné důkazy o [Select_CString(spouse.IsFemale,'její','jeho')] zradě"
 tgp_ceremonial_liege_events.0010.tt.failure: "Tvé obvinění se ukáže jako nepravdivé"
 tgp_ceremonial_liege_events.0020.t: "Okázalá událost – [opposing_power.GetInvolvedActivity.GetShortNameNoTooltip|l]"
 tgp_ceremonial_liege_events.0020.desc: "[opposing_power.GetName|U] se právě účastní události „[opposing_power.GetInvolvedActivity.GetShortNameNoTooltip|l]“, na kterou mě údajně ani nepozvali!\n\nZatímco [opposing_power.GetName]"
 tgp_ceremonial_liege_events.0020.desc_feast: "celou noc popíjí a vyměňuje si příběhy s rodinou a přáteli,"
 tgp_ceremonial_liege_events.0020.desc_hunt: "si vychutnává vzrušení z lovu,"
 tgp_ceremonial_liege_events.0020.desc_pilgrimage: "na svých cestách hledá hlubší duchovní pouto, které [Select_CString(opposing_power.IsFemale,'jí','mu')] může nabídnout [opposing_power.GetFaith.HighGodName],"
 tgp_ceremonial_liege_events.0020.desc_festival: "okázalou slavností dává najevo svou moc,"
 tgp_ceremonial_liege_events.0020.desc_end: "já stále musím plnit své povinnosti.\n\nSituace by sice mohla být horší, ale naskýtá se mi zajímavá příležitost..."
 tgp_ceremonial_liege_events.0020.a: "Možná je čas uspořádat vlastní událost typu [opposing_power.GetInvolvedActivity.GetShortNameNoTooltip|l]."
 tgp_ceremonial_liege_events.0020.a_desc: "Pokusíš se zastínit [opposing_power.Custom('CZ_FirstNameNoTooltip_A')] uspořádáním vlastní [Concept('activity','aktivity')|E]:\n$BULLET$Získáš slevu #P 15%#! na uspořádání aktivity [opposing_power.GetInvolvedActivity.GetShortNameNoTooltip|l]\n$BULLET$Pokud příště úspěšně uspořádáš aktivitu [opposing_power.GetInvolvedActivity.GetShortNameNoTooltip|l], získáš [Concept('prestige','prestiž')|E] a [opposing_power.GetFirstNameNoTooltip] o část své prestiže přijde"
 tgp_ceremonial_liege_events_0020_discount_desc: "Uspořádání odvetné události"
 tgp_ceremonial_liege_events.0020.b: "Jistě [opposing_power.GetFirstNameNoTooltip] nebude vadit, když provedu pár změn..."
 tgp_ceremonial_liege_events.0020.b.tt.desc: "Pokusíš se podkopat autoritu [opposing_power.Custom('CZ_FirstNameNoTooltip_G')]"
 tgp_ceremonial_liege_events.0020.b.tt.success: "Úspěšně získáš moc nad [opposing_power.Custom('CZ_FirstNameNoTooltip_I')]"
 tgp_ceremonial_liege_events.0020.b.tt.failure: "Tvé vměšování vyvolá jen další konflikt"
 tgp_power_undermined_modifier_tt: "[GetModifier('tgp_power_undermined_modifier').GetNameWithTooltip]: #P +25#!"
 tgp_ceremonial_liege_events.0020.c: "Vyřiďte [opposing_power.Custom('CZ_Name_D')] mé nejlepší přání."
 tgp_ceremonial_liege_events.0030.t: "Učený pamětní spis"
 tgp_ceremonial_liege_events.0030.desc: "[scholar.GetName|U] mi předkládá pečlivě sepsaný pamětní spis o dějinách [ROOT.Char.GetTopLiege.GetPrimaryTitle.Custom('CZ_LandedName_G')].\n\nVe spise"
 tgp_ceremonial_liege_events.0030.regent: "se často a podrobně zmiňuje [opposing_power.GetFirstName]. [scholar.GetFirstNameNoTooltip] navíc [Select_CString(scholar.IsFemale,'neopomněla','neopomněl')] uvést ani podrobnosti o rodu [opposing_power.GetHouse.GetName].\n\nProblém však vyjde najevo ve chvíli, kdy pro mou osobu použije přívlastek „[ROOT.Char.Custom('InsultAdjective')|l]“, zatímco [opposing_power.GetFirstNameNoTooltip] si vyslouží lichotivé označení „[ROOT.Char.Custom('ComplimentAdjective')|l]“..."
 tgp_ceremonial_liege_events.0030.liege: "se často a podrobně píše o mně. [scholar.GetFirstNameNoTooltip] navíc [Select_CString(scholar.IsFemale,'neopomněla','neopomněl')] uvést ani podrobnosti o mém rodu [ROOT.Char.GetHouse.GetName].\n\nCo mě však skutečně zaujme, je skutečnost, že pro mou osobu použije lichotivý přívlastek „[ROOT.Char.Custom('ComplimentAdjective')|l]“, zatímco [opposing_power.GetFirstNameNoTooltip] si vyslouží označení „[opposing_power.Custom('InsultAdjective')|l]“..."
 tgp_ceremonial_liege_events.0030.a: "Skvělá práce!"
 tgp_ceremonial_liege_events.0030.b: "Tohle budeš muset přepsat, [scholar.Custom('CZ_FirstNameNoTooltip_V')]."
 tgp_ceremonial_liege_events.0030.b_desc: "Pokusíš se [scholar.Custom('CZ_FirstNameNoTooltip_D')] poradit, jak napsat lepší pamětní spis"
 tgp_ceremonial_liege_events.0030.tt.success: "[scholar.GetFirstNameNoTooltip|U] opraví své chyby"
 tgp_ceremonial_liege_events.0030.tt.failure: "Celou záležitost ještě zhoršíš"
 tgp_ceremonial_liege_events.0030.c_regent: "Neopovažuj se mě očerňovat, [Select_CString(scholar.IsFemale,'hlupačko','hlupáku')]!"
 tgp_ceremonial_liege_events.0030.c_liege: "Dávej si pozor na jazyk..."
 tgp_ceremonial_liege_events.0030.c_tt: "Pokáráš [scholar.Custom('CZ_FirstNameNoTooltip_A')] za obsah spisu"
 tgp_ceremonial_liege_events.0040.t: "Zatím jen přetvářka"
 tgp_ceremonial_liege_events.0040.desc: "„Omluvte mě, [inquirer.Custom2('CZ_RelationToMeShort_V', ROOT.Char)],“ zašeptá [inquirer.GetName], když ke mně tiše přistoupí.\n\n„Už nějakou dobu o tom přemýšlím a odpusťte mi, jestli se ptám nevhodně,“ pokračuje. „Ale proč se nezbavíte [opposing_power.Custom('CZ_FirstName_G')]? Vždyť je přece nedůstojné, aby někdo s titulem [ROOT.Char.GetTitleAsNameNoTooltip] musel tahat za nitky někoho, kdo má pouhý titul [opposing_power.GetTitleAsNameNoTooltip]!“"
 tgp_ceremonial_liege_events.0040.a: "Je to všechno jen naoko, [ROOT.Char.Custom2('CZ_RelationToMeShort_V', inquirer)]..."
 tgp_ceremonial_liege_events.0040.a_desc: "Pokusíš se [inquirer.Custom('CZ_Name_D')] vysvětlit, že jde jen o přetvářku"
 tgp_ceremonial_liege_events.0040.tt.success: "Podaří se ti [inquirer.Custom('CZ_Name_A')] přesvědčit"
 tgp_ceremonial_liege_events.0040.tt.failure: "[inquirer.GetShortUIName|U] pozná, že lžeš"
 tgp_ceremonial_liege_events.0040.b: "Všechno má svůj důvod."
 tgp_ceremonial_liege_events.0040.b_desc: "Vysvětlíš [inquirer.Custom('CZ_FirstNameNoTooltip_D')], jaký účel plní role [opposing_power.Custom('CZ_FirstNameNoTooltip_G')]"
