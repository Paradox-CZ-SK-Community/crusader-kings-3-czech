l_polish:
 exam_success_chance.tgp_local_exam_initial_success: "Skvělý začátek zkoušky"
 exam_success_chance.tgp_local_exam_impressed_examiner: "Zkoušející je ohromen"
 exam_success_chance.tgp_local_exam_strong_finish: "Skvělý závěr zkoušky"
 examiner_takes_bribes_tt: "Tato možnost je dostupná díky povahovým rysům zkoušejícího"
 tgp_china_decision.1000.t: "Dětská zkouška: Začátek"
 tgp_china_decision.1000.desc_new: "Dnes mě čeká vůbec první zkouška. Pověst mé rodiny závisí na tom, jak si povedu. V těchto síních, překypujících věděním, mám pocit, jako by mě sledovali sami předkové a čekali, co ze mě bude."
 tgp_china_decision.1000.desc_returning: "Opět se nacházím v místní studovně a čekám na posouzení učených znalců našeho panství. V této velkolepé síni jako by mi na bedrech spočívala tíha každého svitku i veškerého vědění, které se v nich ukrývá."
 tgp_china_decision.1000.desc_outro: "\n\nZkoušející [examiner.GetTitledFirstName] po mně bude chtít, abych zpaměti přednesl úryvky z klasických děl. Opakování těchto textů jsem věnoval tolik času, že jejich znaky vidím i se zavřenýma očima.\n\nNakonec přichází řada na mě a předstupuji před zkoušejícího."
 tgp_china_decision.1000.a: "Vydám ze sebe všechno!"
 tgp_china_decision.1000.b: "Udělám jen to nejnutnější."
 tgp_china_decision.1001.t_success: "Dětská zkouška: Úspěch!"
 tgp_china_decision.1001.t_fail: "Dětská zkouška: Neúspěch!"
 tgp_china_decision.1001.desc_success: "Zachvacuje mě klid. Každé slovo mi plyne z úst s naprostou jistotou a dokonale zřetelně. Připadá mi to téměř snadné."
 tgp_china_decision.1001.desc_safe: "Klopím zrak k vlastním nohám a ze strachu, že bych mohl vzbudit nelibost, se neodvažuji na zkoušejícího ani pohlédnout. Svůj přednes uspěchám a držím se co nejkratšího textu, abych zakryl případné chyby."
 tgp_china_decision.1001.desc_fail: "Tváře mi hoří hanbou, když si uvědomím, že jsem ztratil nit. Vzhlédnu a zkoušející mě probodává tak zdrcujícím pohledem, že ze sebe nedokážu vypravit ani slovo."
 tgp_china_decision.1001.desc_outro: "\n\nZkoušející mi okamžitě předkládá další úryvek k přednesu, aniž bych dostal sebemenší příležitost vzpamatovat se."
 tgp_china_decision.1001.a: "Tentokrát to #EMP musím#! zvládnout."
 tgp_china_decision.1001.b: "Nebudu se zbytečně namáhat."
 tgp_china_decision.1002.t_success: "Dětská zkouška: Úspěch!"
 tgp_china_decision.1002.t_fail: "Dětská zkouška: Neúspěch!"
 tgp_china_decision.1002.desc_success: "Slova mi plynou ze rtů naprosto přirozeně. Na okamžik se mi dokonce zdá, že zkoušející potlačuje úsměv. Opravdu? Nemožné!"
 tgp_china_decision.1002.desc_safe: "Přednáším jen tolik, kolik je nezbytně nutné, abych se vyhnul zbytečným chybám. Když se odvážím vzhlédnout, zjišťuji, že můj kostrbatý výkon zkoušejícího očividně nudí."
 tgp_china_decision.1002.desc_fail: "Dlaně se mi začínají potit a slova se mi pletou na jazyku. Nedokážu si vybavit jedinou větu! Kéž by se pode mnou otevřela země a pohltila mě."
 tgp_china_decision.1002.desc_outro: "\n\nAni tentokrát nepřichází žádný oddech. Zkoušející mě probodává pohledem a žádá o přednes další části."
 tgp_china_decision.1002.a: "Teď se rozhodne o všem!"
 tgp_china_decision.1002.b: "Hlavně zachovat klid..."
 tgp_china_decision.1005.t: "Vyvěšení výsledků"
 tgp_china_decision.1005.desc: "Zkoušku dokončuji "
 tgp_china_decision.1005.desc.success: "v povznesené náladě."
 tgp_china_decision.1005.desc.safe: "s úlevným povzdechem."
 tgp_china_decision.1005.desc.failure: "se sklíčenou myslí."
 tgp_china_decision.1005.desc.segway: "\n\nKdyž se vracím mezi ostatní uchazeče, uvědomuji si, že žádné z dětí kolem sebe neznám. Kéž bych tu měl alespoň jednu známou tvář, která by mi pomohla přečkat to nekonečné čekání.\n\nTeprve po dlouhé době jsou výsledky konečně vyvěšeny. Vrhám se k nástěnce a zjišťuji, že jsem "
 tgp_china_decision.1005.desc.high_score: "[Select_CString(ROOT.Char.IsFemale,'dosáhla','dosáhl')] mimořádně dobrého výsledku! Má rodina na mě bude hrdá."
 tgp_china_decision.1005.desc.good_score: "[Select_CString(ROOT.Char.IsFemale,'dosáhla','dosáhl')] velmi dobrého výsledku!"
 tgp_china_decision.1005.desc.passing_score: "zkoušku [Select_CString(ROOT.Char.IsFemale,'úspěšně složila','úspěšně složil')]."
 tgp_china_decision.1005.desc.failing: "zkoušku [Select_CString(ROOT.Char.IsFemale,'nesložila','nesložil')]."
 tgp_china_decision.1005.a_success: "Příště se budu snažit ještě víc."
 tgp_china_decision.1005.a: "Chci jen vzdát čest svým rodičům."
 tgp_china_decision.1005.b: "Veškerá zásluha patří mým skvělým učitelům!"
 tgp_china_decision.1005.a_failure: "Ještě se vrátím."
 tgp_china_decision.1005.b_passing: "S tímto výsledkem jsem [Select_CString(ROOT.Char.IsFemale,'spokojená','spokojený')]."
 tgp_china_decision.1005.b_failed: "Jaká potupa."
 provincial_exam_close_family_passed: "[GetPlayer.Custom2('RelationToMeShort', ROOT.Char)|U] [Select_CString(ROOT.Char.IsFemale,'složila','složil')] provinční zkoušku"
 msg_provincial_exam_close_family_passed_desc: "[ROOT.Char.GetShortUIName|U] [Select_CString(ROOT.Char.IsFemale,'úspěšně složila','úspěšně složil')] zkoušku nižšího stupně [CZPrepV(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetCurrentLocation,'L')]"
 provincial_exam_close_family_failed: "[GetPlayer.Custom2('RelationToMeShort', ROOT.Char)|U] [Select_CString(ROOT.Char.IsFemale,'neuspěla','neuspěl')] u provinční zkoušky"
 msg_provincial_exam_close_family_failed_desc: "[ROOT.Char.GetShortUIName|U] se [Select_CString(ROOT.Char.IsFemale,'pokusila','pokusil')] prokázat své schopnosti u zkoušky nižšího stupně [CZPrepV(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetCurrentLocation,'L')], ale [Select_CString(ROOT.Char.IsFemale,'neuspěla','neuspěl')]"
