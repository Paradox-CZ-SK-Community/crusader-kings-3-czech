 return_to_the_steppe_decision: "Návrat do stepi"
 return_to_the_steppe_decision_desc: "Ve snaze stát se pány měst jsme vyměnili své dědictví za hedvábí a trůny. A přece jsme zde, za zdmi paláců, sotva něčím víc než zajatci těch, kdo tvrdí, že nám slouží.\n\n#EMP;high Lépe žít jako vlci pod širým nebem než jako pastýři zotročení vlastním stádem.#!"
