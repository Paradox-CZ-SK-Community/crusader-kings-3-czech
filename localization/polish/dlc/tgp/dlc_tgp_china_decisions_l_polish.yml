 claim_the_mantle_of_maitreya_decision_desc: "Svět upadl do chaosu. Mniši a mnišky zavrhli své řeholní zásady i povinnost následovat dharmu. Honí se za hmotným bohatstvím a utápějí se ve světských rozkoších.\n\nProstý lid touží po spasiteli, který jej vysvobodí z utrpení. Věřící oddaně očekávají den, kdy Maitréja sestoupí z nebeských výšin, obnoví svět a přinese všem mír a blahobyt.\n\nUž nemusí čekat."
