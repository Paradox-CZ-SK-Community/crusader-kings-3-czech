l_polish:
 game_concept_celestial_government: "Nebeská vláda"
 game_concept_celestial: "Nebeská"
 game_concept_celestials: "Nebeské vlády"
 game_concept_celestial_i: "@government_type_celestial!"
 game_concept_celestial_government_desc: "$game_concept_celestial$ je [Concept('government_bureaucratic_type','byrokratická')|E] [Concept('government_form','forma vlády')|E], v níž [Concept('liege','lenní pán')|E] jmenuje postavy [Concept('governors','guvernéry')|E], kteří se dělí na dva typy: [Concept('civilian_governor_short','civilní')|E] a [Concept('military_governor_short','vojenský')|E].\n\nPostavy mají přístup k [Concept('influence','vlivu')|E], [Concept('noble_families','šlechtickým rodinám')|E], [Concept('family_estates','rodovým statkům')|E] a [Concept('treasury','pokladnici')|E].\n\nNezávislí [Concept('rulers','vládci')|E] mají [Concept('legitimacy','legitimitu')|E], zatímco [Concept('vassals','vazalové')|E] se soustředí na získávání [Concept('merit','zásluh')|E]."
 game_concept_merit: "Zásluhy"
 game_concept_meritorious: "Záslužný"
 game_concept_merit_desc: "$game_concept_merit$ [Concept('character_possessive','postavy')|E] sledují její postup k další [Concept('merit_level','hodnosti zásluh')|E]. Všechny postavy s [Concept('elder','starším')|E] nebo [Concept('disciples','učedníky')|E] pasivně získávají $game_concept_merit$.\n\n[Concept('governors','Guvernéři')|E] mohou své $game_concept_merit$ zvyšovat stavbou [Concept('buildings','budov')|E] ve svěřených [Concept('holdings','državách')|E], absolvováním [Concept('activity','aktivity')|E] [Concept('inspection','inspekce')|E], účastí na [GetActivityType('activity_debate').GetName] a skládáním [Concept('examinations','zkoušek')|E].\n\nGuvernéři typu [GetSubjectContractType( 'celestial_provinces' ).GetObligationNameShort( 'celestial_province_standard' )] zvyšují svůj měsíční zisk zásluh tím, že svému [Concept('liege','lennímu pánovi')|E] platí vyšší [Concept('taxes','daně')|E], zatímco guvernéři typu [GetSubjectContractType( 'celestial_provinces' ).GetObligationNameShort( 'celestial_province_military' )] jej zvyšují vytvářením [Concept('men_at_arms','ozbrojenců')|E].\n\nPostavy, které nejsou $game_concept_governors$, se je mohou pokusit zvýšit účastí na [Concept('examinations','zkouškách')|E]."
 game_concept_merit_i: "@merit_icon!"
 game_concept_merit_level: "Hodnost zásluh"
 game_concept_merit_level_desc: "$game_concept_merit_level$ [Concept('character_possessive','postavy')|E] udává, jak vhodná je jako [Concept('governor','guvernér')|E] ve východoasijských [Concept('administrative_governments','administrativních vládách')|E].\n\nPředstavuje její doložené úspěchy a mravní chování podle konfuciánských ideálů prostřednictvím množství získaných [Concept('merit','zásluh')|E].\n\nÚředník s vysokou $game_concept_merit_level$ má vyšší [Concept('candidate_score','skóre kandidáta')|E] a [Concept('governor_salary','plat guvernéra')|E].\n\nHodnosti jsou:\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_5' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_6' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_7' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_8' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_9' ).GetNameWithTooltip|L]"
 game_concept_merit_levels: "Hodnosti zásluh"
 game_concept_merit_level_impact: "Dopad hodnosti zásluh"
 game_concept_merit_level_impact_desc: "$game_concept_merit_level_impact$ zvyšuje nebo snižuje [Concept('modifiers','modifikátory')|E] získané z tvé aktuální [Concept('merit_level','hodnosti zásluh')|E]."
 game_concept_imperial_examination: "Úřednická zkouška"
 game_concept_imperial_examinations: "Úřednické zkoušky"
 game_concept_examination: "Zkouška"
 game_concept_examinations: "Zkoušky"
 game_concept_imperial_examination_desc: "$game_concept_imperial_examinations$ hrají klíčovou roli ve [Concept('administrative','administrativních')|E] funkcích [Concept('governments','vlád')|E] [GetGovernment('celestial_government').GetName|E] a [GetGovernment('meritocratic_government').GetName|E]. \n\nProstřednictvím zkušebního systému jsou byrokraté jmenováni podle [Concept('merit','zásluh')|E], nikoli podle původu, což zajišťuje, že nejnadanější učenci mohou bez ohledu na své dědictví získat jmenování do [Concept('governorship','guvernérství')|E]. \n\nÚrovně zkoušek jsou: \n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Dětská#!: Rodiče mohou nechat své děti skládat zkoušku od věku [EmptyScope.ScriptValue('child_exam_min_age')] prostřednictvím [Concept('interaction','interakce')|E] $send_child_to_examination_interaction$.#! \n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Provinční#!: Postavy, které nejsou [Concept('landed','zeměpány')|E], se mohou pokusit složit druhou úroveň zkoušek prostřednictvím [Concept('activity','aktivity')|E] [GetActivityType('activity_local_examination').GetName].#! \n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Metropolitní#!: Pořádá ji [Concept('government','vláda')|E] [GetGovernment('celestial_government').GetName|E] prostřednictvím aktivity [GetActivityType('activity_imperial_examination').GetName].#! \n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Palácová#!: Posledních [EmptyScope.ScriptValue('metropolitan_exam_final_entrants_loc')] účastníků v rámci $activity_imperial_examination$ je pozváno na hostinu v královském paláci, aby se setkali se [Concept('son_of_heaven','Synem Nebes')|E] a prokázali mu svou hodnotu.#!"
 game_concept_exam_cheat: "Podvod u zkoušky"
 game_concept_exam_cheat_desc: "$game_concept_exam_cheat$ odemyká možnosti, které lze použít k obejití nadcházející zkoušky. Dej si však pozor, přistižení přijde draho."
 game_concept_childrens_examination_i: "@child_exam_icon"
 game_concept_childrens_examination: "Dětská zkouška"
 game_concept_childrens_examination_desc: "První úroveň [Concept('imperial_examinations','úřednických zkoušek')|E], skládaná od věku [EmptyScope.ScriptValue('child_exam_min_age')]. Rodiče mohou své děti poslat ke zkoušce prostřednictvím [Concept('interaction','interakce')|E] $send_child_to_examination_interaction$."
 game_concept_provincial_examination_i: "@provincial_exam_icon"
 game_concept_provincial_examination: "Provinční zkouška"
 game_concept_provincial_examination_desc: "Druhá úroveň [Concept('imperial_examinations','úřednických zkoušek')|E], skládaná prostřednictvím [Concept('activity','aktivity')|E] [GetActivityType('activity_local_examination').GetName].\n\n#S Při složení:#!\n[GetModifier( 'tgp_passed_provincial_exam_modifier' ).GetDescWithEffects]."
 game_concept_metropolitan_examination_i: "@metropolitan_exam_icon"
 game_concept_metropolitan_examination: "Metropolitní zkouška"
 game_concept_metropolitan_examination_desc: "Třetí úroveň [Concept('imperial_examinations','úřednických zkoušek')|E]. Pořádá ji [Concept('government','vláda')|E] [GetGovernment('celestial_government').GetName|E] prostřednictvím [Concept('activity','aktivity')|E] [GetActivityType('activity_imperial_examination').GetName].\n\n#S Při složení:#!\n[GetModifier( 'tgp_passed_metropolitan_exam_modifier' ).GetDescWithEffects]."
 game_concept_palace_examination_i: "@palace_exam_icon"
 game_concept_palace_examination: "Palácová zkouška"
 game_concept_palace_examination_desc: "Čtvrtá a závěrečná [Concept('imperial_examinations','úřednická zkouška')|E]. Posledních [EmptyScope.ScriptValue('metropolitan_exam_final_entrants_loc')] účastníků v rámci [GetActivityType('activity_imperial_examination').GetName] je pozváno na hostinu v královském paláci, aby se poklonili a prokázali svou hodnotu [Concept('son_of_heaven','Synu Nebes')|E].\n\n#S Při složení:#!\n[GetModifier( 'tgp_passed_palace_exam_modifier' ).GetDescWithEffects]."
 game_concept_exam_advantage: "Výhoda u zkoušky"
 game_concept_exam_advantage_desc: "$game_concept_exam_advantage$ zlepšuje šance na různé akce během [Concept('imperial_examination','úřednické zkoušky')|E], například při odpovídání na otázky a předvádění dovedností."
 game_concept_exam_score: "Skóre zkoušky"
 game_concept_exam_score_desc: "$game_concept_exam_score$ určuje, jak pravděpodobně účastník složí [Concept('imperial_examination','úřednickou zkoušku')|E].\n\nPočáteční skóre vychází z [Concept('trait','rysu')|E] [GetTrait('confucian_education').GetName( GetNullCharacter )] účastníka a také z jeho [Concept('skills','dovedností')|E] [Concept('learning','učenosti')|E], [Concept('stewardship','správcovství')|E] a [Concept('martial','válečnictví')|E] v závislosti na zaměření $game_concept_examination$.\n\nPouze deset nejlepších účastníků [Concept('activity','aktivity')|E] [GetActivityType('activity_imperial_examination').GetName] se může pokusit o @palace_exam_icon! #V palácovou zkoušku#!."
 game_concept_merit_pool: "Seznam kandidátů"
 game_concept_merit_pools: "Seznamy kandidátů"
 game_concept_merit_pool_possessive: "Seznamu kandidátů"
 game_concept_merit_pool_desc: "$game_concept_merit_pool$ obsahuje všechny potenciální [Concept('characters','postavy')|E], které mohou získat [Concept('titles','tituly')|E] s určitými typy [Concept('appointment','jmenování')|E].\n\nKandidáti jsou seřazeni podle svého [Concept('candidate_score','skóre kandidáta')|E]. Některé [Concept('appointment_succession_laws','zákony nástupnictví jmenováním')|E] využívají [Concept('merit','zásluhy')|E], což kandidáty seřadí nejprve podle jejich [Concept('merit_level','hodnosti zásluh')|E] a teprve poté podle $game_concept_candidate_score$.\n\nKdyž [Concept('holder','držitel')|E] titulu s $game_concept_appointment$ zemře, titul přejde na nejvýše postavenou postavu v seznamu. Pokud už postava nějaký titul drží, musí mít nový titul vyšší [Concept('appointment_prominence','významnost jmenování')|E], jinak přejde na další postavu."
 game_concept_appointment_prominence: "Významnost jmenování"
 game_concept_appointment_prominence_desc: "$game_concept_appointment_prominence$ odráží, jak žádoucí je [Concept('title','titul')|E] pro způsobilé kandidáty.\n\nKandidát, který již drží titul, bude jmenován k novému titulu stejné [Concept('title_tier','úrovně titulu')|E] pouze tehdy, pokud má vyšší $game_concept_appointment_prominence$.\n\n$game_concept_appointment_prominence$ obvykle vychází z místního bohatství a blízkosti [Concept('realm_capital','hlavního sídla panství')|E], ale podle okolností se mohou uplatnit i jiné faktory, například velikost [Concept('title_men_at_arms','titulových ozbrojenců')|E] u [Concept('military_governors','vojenských guvernérů')|E]."
 game_concept_entrant: "Účastník"
 game_concept_entrants: "Účastníci"
 game_concept_entrant_desc: "$game_concept_entrant$ je postava, která prověřuje své schopnosti v [Concept('activity','aktivitě')|E] [Concept('imperial_examination','úřednické zkoušky')|E]."
 game_concept_subject_standing: "Postavení subjektu"
 game_concept_subject_standing_desc: "$game_concept_subject_standing$ představuje postavení udělené [Concept('tributary','tributáři')|E] nebo [Concept('vassal','vazalovi')|E] jeho [Concept('suzerain','suzerénem')|E] nebo [Concept('liege','lenním pánem')|E]."
 game_concept_imperial_grace: "Císařská přízeň"
 game_concept_imperial_grace_desc: "$game_concept_imperial_grace$ představuje postavení udělené [Concept('tributary','tributáři')|E] [Concept('son_of_heaven','Synem Nebes')|E].\n\nVysoká $game_concept_imperial_grace$ může vést k udělení zvláštních výsad $game_concept_tributary$ během [Concept('tribute_missions','tributních misí')|E]. Při nízkých úrovních $game_concept_imperial_grace$ po tobě může $game_concept_son_of_heaven$ #EMP vymáhat#! tribut, a pokud klesne na nulu, může to znamenat konec vztahu."
 game_concept_seal_of_investiture: "Pečeť investitury"
 game_concept_seal_of_investiture_desc: "$game_concept_seal_of_investiture$, zároveň právní dokument i uctívaný symbol přízně Syna Nebes, označuje zvláštní postavení držitele jako věrného a oblíbeného [Concept('tributary','tributáře')|E] [SelectLocalization( GetPlayer.IsValid, 'game_concept_seal_of_investiture_desc_ingame', 'h_china' )].\n\n$game_concept_seal_of_investiture$ může být udělena $game_concept_tributaries$ s vysokou [Concept('imperial_grace','císařskou přízní')|E] během závěrečných obřadů úspěšné #bold tributní mise#!."
 game_concept_seal_of_investiture_desc_ingame: "[GetTitleByKey('h_china').GetDefinitiveName]"
 HAS_SEAL_OF_INVESTITURE: "Vlastníš [Concept('seal_of_investiture','pečeť investitury')|E]"
 NO_SEAL_OF_INVESTITURE: "Nevlastníš [Concept('seal_of_investiture','pečeť investitury')|E]"
 SUBJECT_STANDING_CONCEPT: "[Concept('subject_standing','Postavení podřízeného')|E]"
 SUBJECT_STANDING_IMPERIAL_GRACE_CONCEPT: "[Concept('imperial_grace','Císařská přízeň')|E]"
 IMPERIAL_GRACE_ICON: "@imperial_grace!"
 IMPERIAL_GRACE_LOSS_STABILITY: "Protože [Concept('dynastic_cycle','dynastický cyklus')|E] je momentálně ve fázi $situation_dynastic_cycle_phase_stability$, všichni #EMP $tributaries_celestial$#! každý rok ztrácejí @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_stability')|V1] [Concept('imperial_grace','císařské přízně')|E]."
 IMPERIAL_GRACE_LOSS_STABILITY_EXPANSION: "Protože [Concept('dynastic_cycle','dynastický cyklus')|E] je momentálně ve fázi $situation_dynastic_cycle_phase_stability_expansion$, všichni #EMP $tributaries_celestial$#! každý rok ztrácejí @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_stability_expansion')|V1] [Concept('imperial_grace','císařské přízně')|E]."
 IMPERIAL_GRACE_LOSS_STABILITY_ADVANCEMENT: "Protože [Concept('dynastic_cycle','dynastický cyklus')|E] je momentálně ve fázi $situation_dynastic_cycle_phase_stability_advancement$, všichni #EMP $tributaries_celestial$#! každý rok ztrácejí @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_stability_advancement')|V1] [Concept('imperial_grace','císařské přízně')|E]."
 IMPERIAL_GRACE_LOSS_INSTABILITY: "Protože [Concept('dynastic_cycle','dynastický cyklus')|E] je momentálně ve fázi $situation_dynastic_cycle_phase_stability_advancement$, všichni #EMP $tributaries_celestial$#! každý rok ztrácejí @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_instability')|V1] [Concept('imperial_grace','císařské přízně')|E]."
 IMPERIAL_GRACE_LOSS_INSTABILITY_CONQUEST: "Protože [Concept('dynastic_cycle','dynastický cyklus')|E] je momentálně ve fázi $situation_dynastic_cycle_phase_instability_conquest$, všichni #EMP $tributaries_celestial$#! každý rok ztrácejí @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_instability_conquest')|V1] [Concept('imperial_grace','císařské přízně')|E]."
 IMPERIAL_GRACE_LOSS_CHAOS: "Protože [Concept('dynastic_cycle','dynastický cyklus')|E] je momentálně ve fázi $situation_dynastic_cycle_phase_chaos$, všichni #EMP $tributaries_celestial$#! každý rok ztrácejí @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_chaos')|V1] [Concept('imperial_grace','císařské přízně')|E]."
 game_concept_mandate_of_heaven: "Mandát Nebes"
 game_concept_mandate_of_heaven_mandate: "Mandát"
 game_concept_mandate_of_heaven_desc: "$game_concept_mandate_of_heaven$ je zvláštní typ [Concept('legitimacy','legitimity')|E] dostupný pouze [Concept('son_of_heaven','Synu Nebes')|E]. Představuje panovníkovo právo vládnout a určuje, kdo je považován za nejvyššího vládce pod celými nebesy.\n\nMandát je úzce spojen s [Concept('dynastic_cycle','dynastickým cyklem')|E]. Cyklus ovlivňuje, jak vládnoucí panovník získává legitimitu, a podle úrovně panovníkova mandátu může také měnit [Concept('situation_dynastic_cycle_phase','éru dynastického cyklu')|E]."
 game_concept_son_of_heaven: "Syn Nebes"
 game_concept_son_of_heaven_possessive: "Syna Nebes"
 game_concept_son_of_heaven_desc: "$game_concept_son_of_heaven$ je [Concept('hegemon','hegemonem')|E] Číny a [Concept('top_liege','nejvyšším lenním pánem')|E] [Concept('celestial_government','nebeské vlády')|E].\n\n$game_concept_son_of_heaven$ má zvláštní formu [Concept('legitimacy','legitimity')|E], [Concept('mandate_of_heaven','mandát Nebes')|E], a jedinečnou [Concept('situation_participant_group','skupinu účastníků')|E], jednoduše nazývanou $game_concept_son_of_heaven$."
 game_concept_treasury_i: "@treasury_icon!"
 game_concept_treasury: "Pokladnice"
 game_concept_treasury_desc: "V některých [Concept('administrative_governments','administrativních vládách')|E] představuje pokladnice prostředky, které lze používat pouze k vládním účelům, na rozdíl od tvého osobního [Concept('gold','zlata')|E].\n\n$BULLET$#indent_newline:2 Jako [Concept('vassal','vazal')|E] budeš dostávat prostředky z pokladnice od svého [Concept('liege','lenního pána')|E] podle svých [Concept('tax','daňových')|E] příspěvků a dalších povinností#!\n$BULLET$#indent_newline:2 Pokladnici vytváří [Concept('top_liege','nejvyšší lenní pán')|e], který převádí určité procento příjmů ze [Concept('taxation','zdanění')|E] do pokladnice#!\n$BULLET$#indent_newline:2 Do pokladnice můžeš libovolně převádět [Concept('gold','zlato')|E]#!\n$BULLET$#indent_newline:2 Pokladnice zůstává u [Concept('title','titulu')|E], pokud získá nového [Concept('holder','držitele')|E]#!"
 game_concept_imperial_treasury_i: "$game_concept_treasury_i$"
 game_concept_imperial_treasury: "Císařská pokladnice"
 game_concept_imperial_treasury_desc: "$game_concept_treasury_desc$"
 game_concept_treasury_vassal_development: "Rozvoj vazalů"
 game_concept_treasury_vassal_development_desc: "Prostředky z pokladnice zasílané přímým [Concept('vassals','vazalům')|E] prostřednictvím jejich [Concept('liege','lenního pána')|E] podle jejich daňových příspěvků a dalších [Concept('obligations','povinností')|E]."
 game_concept_treasury_ministry_budget: "Rozpočet ministerstva"
 game_concept_treasury_ministry_budget_short: "Ministerstvo"
 game_concept_treasury_ministry_budget_desc: "Prostředky z pokladnice zasílané [Concept('vassals','vazalům')|E] z ústřední vlády za účelem financování [Concept('ministries','ministerstev')|E]. Vycházejí z pravidelně vypočítaného přídělu příjmů [Concept('treasury','pokladnice')|E] [Concept('top_liege','nejvyššího lenního pána')|E]."
 game_concept_treasury_salary_budget: "Rozpočet na platy"
 game_concept_treasury_salary_budget_short: "Plat"
 game_concept_treasury_salary_budget_desc: "Prostředky z pokladnice zasílané [Concept('vassals','vazalům')|E] z ústřední vlády, které obdrží jako [Concept('gold','zlato')|E] určené pro jejich osobní plat. Vycházejí z pravidelně vypočítaného přídělu příjmů [Concept('treasury','pokladnice')|E] [Concept('top_liege','nejvyššího lenního pána')|E]."
 game_concept_treasury_military_budget: "Vojenský rozpočet"
 game_concept_treasury_military_budget_short: "Vojenský"
 game_concept_treasury_military_budget_desc: "Prostředky z pokladnice zasílané vojenským [Concept('province','provinčním')|E] [Concept('vassals','vazalům')|E] z ústřední vlády za účelem financování dalších vojenských činností. Vycházejí z pravidelně vypočítaného přídělu příjmů [Concept('treasury','pokladnice')|E] [Concept('top_liege','nejvyššího lenního pána')|E]."
 game_concept_governor_salary: "Plat guvernéra"
 game_concept_governor_salary_desc: "V [Concept('administrative_governments','administrativních vládách')|E], které rozlišují mezi [Concept('gold','zlatem')|E] a [Concept('treasury','pokladnicí')|E], dostávají [Concept('governors','guvernéři')|E] plat ve $game_concept_gold$."
 game_concept_treasury_budgeting: "Rozpočtování pokladnice"
 game_concept_treasury_budget: "Rozpočet pokladnice"
 game_concept_treasury_budgeting_desc: "Systém odpovědný za rozdělování ústředních prostředků konkrétním [Concept('vassals','vazalům')|E] a podvazalům při určených sazbách přídělu.\n\nKdyž je rozpočet přijat, pro každou [Concept('treasury_budget_category','rozpočtovou kategorii pokladnice')|E] se vypočítá [Concept('treasury_budget_base_rate','základní sazba rozpočtu')|E] na jednoho vazala podle dostupné [Concept('treasury_budget_capacity','rozpočtové kapacity pokladnice')|E].\n\n@alert_icon! Vypočítaná základní sazba se #bold nezmění#!, dokud nebude v budoucnu přijat nový rozpočet! Pokud tedy získáš více příjemců, náklady tvého rozpočtu vzrostou."
 game_concept_treasury_budget_capacity: "Rozpočtová kapacita"
 game_concept_treasury_budget_capacity_desc: "Měsíční množství [Concept('treasury','prostředků z pokladnice')|E] dostupné pro [Concept('treasury_budgeting','rozpočtování pokladnice')|E]. Skládá se z příjmů pokladnice snížených o pravidelné výdaje, které nejsou spravovány rozpočtováním, například [Concept('treasury_vassal_development','rozvoj vazalů')|E] a [Concept('court_amenities','dvorské pohodlí')|E]."
 game_concept_treasury_budget_category: "Rozpočtová kategorie"
 game_concept_treasury_budget_category_desc: "Jedna samostatná část [Concept('treasury_budgeting','rozpočtování pokladnice')|E], která může obdržet rozpočtový příděl. Každá rozpočtová kategorie může mít různé příjemce a může vyplácet [Concept('gold','zlato')|E] místo [Concept('treasury','prostředků z pokladnice')|E]."
 game_concept_treasury_budget_base_rate: "Základní sazba rozpočtu"
 game_concept_treasury_budget_base_rate_short: "Základní sazba"
 game_concept_treasury_budget_base_rate_desc: "Částka, kterou obdrží standardní příjemce [Concept('treasury_budget_category','rozpočtové kategorie')|E]. Příjemci mohou dostat více nebo méně než základní sazbu podle své [Concept('title_rank','hodnosti titulu')|E], [Concept('merit_level','hodnosti zásluh')|E] nebo jiných modifikátorů."
 game_concept_treasury_budget_category_trend: "Trend rozpočtové kategorie"
 game_concept_treasury_budget_category_trend_short: "Trend"
 game_concept_treasury_budget_category_trend_desc: "Rozdíl v [Concept('treasury','prostředcích z pokladnice')|E], které [Concept('treasury_budget_category','rozpočtová kategorie')|E] obdrží ve srovnání s předchozím přijetím rozpočtu."
 game_concept_treasury_budget_unallocated: "Nepřidělený rozpočet pokladnice"
 game_concept_treasury_budget_unallocated_short: "Nepřiděleno"
 game_concept_treasury_budget_unallocated_desc: "Jakýkoli nepřidělený rozpočet pokladnice přispěje k obecnému příjmu [treasury]."
 game_concept_treasury_budget_deficit: "Schodek rozpočtu pokladnice"
 game_concept_treasury_budget_deficit_short: "Schodek"
 game_concept_treasury_budget_deficit_desc: "Při utrácení nad rámec [Concept('treasury_budget_capacity','rozpočtové kapacity pokladnice')|E] bude určitá částka odečtena od měsíčního příjmu [Concept('treasury','pokladnice')|E]."
 game_concept_celestial_bureaucracy: "Nebeská byrokracie"
 game_concept_celestial_bureaucracy_desc: "$game_concept_celestial_bureaucracy$ představuje úroveň centralizace [Concept('realm_possessive','panství')|E] s [Concept('celestial','nebeskou')|E] vládou a obecnou moc, kterou [Concept('ruler','vládce')|E] uplatňuje nad svými [Concept('vassals','vazaly')|E].\n\n$game_concept_celestial_bureaucracy$ může měnit pouze [Concept('top_liege','nejvyšší lenní pán')|E]. Nebeští $game_concept_vassals$ používají stejnou úroveň jako jejich $game_concept_liege$.\n\nExistují čtyři úrovně $game_concept_celestial_bureaucracy$:\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_0$\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_1$\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_2$\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_3$\n\nZvýšení $game_concept_celestial_bureaucracy$ stojí určité množství [Concept('prestige','prestiže')|E] podle [Concept('realm_size','velikosti panství')|E] a [Concept('learning_skill','dovednosti učenosti')|E] vládce."
 game_concept_minister: "Ministr"
 game_concept_ministers: "Ministři"
 game_concept_minister_possessive: "Ministra"
 game_concept_ministers_possessive: "Ministrů"
 game_concept_minister_desc: "$game_concept_ministers$ jsou typem [Concept('councillors','rádců')|E] sloužících v [Concept('council','radě')|E], neboli [Concept('ministry','ministerstvu')|E], [Concept('son_of_heaven','Syna Nebes')|E].\n\nKaždý ministr má řadu povinností, například financování [Concept('great_projects','velkých projektů')|E] a různou pomoc [Concept('governors','guvernérům')|E]."
 game_concept_ministry: "Ministerstvo"
 game_concept_ministries: "Ministerstva"
 game_concept_ministry_possessive: "Ministerstva"
 game_concept_ministries_possessive: "Ministerstev"
 game_concept_ministry_desc: "$game_concept_ministry$ je typ [Concept('council','rady')|E] dostupný pouze [Concept('son_of_heaven','Synu Nebes')|E].\n\nExistuje devět [Concept('ministers','ministrů')|E], z nichž každý představuje nejvyšší úroveň vlády a stojí v čele vlastního odboru. Jsou seřazeni v hierarchii, která umožňuje povýšit ministra nižší hodnosti na postavení vyšší hodnosti podle [Concept('appointment_prominence','významnosti jmenování')|E] daného [Concept('title','titulu')|E].\n\n$game_concept_ministers$ jsou:\n$EFFECT_LIST_BULLET$[minister_grand_chancellor|E]\n$EFFECT_LIST_BULLET$[minister_censor|E]\n$EFFECT_LIST_BULLET$[minister_grand_marshal|E]\n$EFFECT_LIST_BULLET$[minister_of_personnel|E]\n$EFFECT_LIST_BULLET$[minister_of_war|E]\n$EFFECT_LIST_BULLET$[minister_of_revenue|E]\n$EFFECT_LIST_BULLET$[minister_of_justice|E]\n$EFFECT_LIST_BULLET$[minister_of_rites|E]\n$EFFECT_LIST_BULLET$[minister_of_works|E]"
 game_concept_minister_grand_chancellor: "$councillor_chancellor_celestial_government_imperial$"
 game_concept_minister_grand_chancellor_desc: "$game_concept_minister_grand_chancellor$ je nejvýše postavený [Concept('minister','ministr')|E] a má na starosti diplomatické záležitosti. Obvykle mu bývá svěřen úřad [Concept('grand_secretariat_director','ředitele velkého sekretariátu')|E].\n\nKancléř může být určeným [Concept('grand_secretariat_director','ředitelem velkého sekretariátu')|E] podle [Concept('law','zákona')|E] #V [GetLawGroup('grand_secretariat_laws').GetName]#!.\n\n$minister_grand_chancellor_action_breakdown$"
 game_concept_minister_grand_chancellor_possessive: "$councillor_chancellor_celestial_government_imperial_possessive$"
 minister_grand_chancellor_action_breakdown: "#indent_newline:4 #weak Ministr může například:\n$BULLET$Použít [Concept('decision','rozhodnutí')|E] [GetDecision('favored_movement_consults_heaven_decision').GetName|V]\n$BULLET$Pozvat jakýkoli typ [Concept('courtier','dvořana')|E] pomocí [Concept('decision','rozhodnutí')|E] [GetDecision('tgp_minister_recruit_courtiers_decision').GetName|V]\n$BULLET$Získat přístup ke zvláštním možnostem [Concept('interaction','interakce')|E] #V $influence_meritorious_career_interaction$#!, a to za sníženou cenu\n$BULLET$Zahájit [Concept('great_project','velký projekt')|E] [GetGreatProjectType('minister_compel_religious_uniformity').GetName|V]#!#!"
 game_concept_minister_censor: "$councillor_spymaster_celestial_government_imperial$"
 game_concept_minister_censor_desc: "$game_concept_minister_censor$ je [Concept('minister','ministr')|E] odpovědný za záležitosti pletichaření a zpravodajství.\n\nDej si pozor na neloajálního cenzora, protože dokáže snadno tajit [Concept('schemes','intriky')|E] proti tobě a tvé [Concept('close_family','blízké rodině')|E] i se jich účastnit!\n\nCenzor může být určeným [Concept('grand_secretariat_director','ředitelem velkého sekretariátu')|E] podle [Concept('law','zákona')|E] [GetLawGroup('grand_secretariat_laws').GetName|V].\n\n$minister_censor_action_breakdown$"
 game_concept_minister_censor_possessive: "$councillor_spymaster_celestial_government_imperial_possessive$"
 minister_censor_action_breakdown: "#indent_newline:4 #weak Ministr může například:\n$BULLET$Použít [Concept('interaction','interakci')|E] #V $censor_find_secrets_interaction$#! k hledání [Concept('secrets','tajemství')|E] na [Concept('courts','dvorech')|E] [Concept('vassal','vazalů')|E], která můžeš využít k získání odměny ve [gold_i][Concept('gold','zlatě')|E] od svého [Concept('liege','lenního pána')|E] nebo k získání [Concept('hooks','pák')|E]\n$BULLET$[Concept('blackmail','Vydírání')|E] spustí [Concept('dynastic_cycle_catalyst','katalyzátor dynastického cyklu')|E] #V '$catalyst_minister_blackmailed$'#!\n$BULLET$Získat přístup ke zvláštním možnostem [Concept('interaction','interakce')|E] #V $influence_meritorious_career_interaction$#!#!#!"
 game_concept_minister_grand_marshal: "$minister_grand_marshal$"
 game_concept_minister_grand_marshal_desc: "$game_concept_minister_grand_marshal$ je nejvýše postavený velitel v [Concept('realm','panství')|E] a velí [Concept('army','armádě')|E] [Concept('title_men_at_arms','titulových ozbrojenců')|E].\n\nMaršál může být určeným [Concept('grand_secretariat_director','ředitelem velkého sekretariátu')|E] podle [Concept('law','zákona')|E] #V [GetLawGroup('grand_secretariat_laws').GetName]#!.\n\n$minister_grand_marshal_action_breakdown$"
 game_concept_minister_grand_marshal_possessive: "$minister_grand_marshal_possessive$"
 minister_grand_marshal_action_breakdown: "#indent_newline:4 #weak Ministr může například:\n$BULLET$Zahájit [Concept('great_project','velký projekt')|E] #V Velké tažení#!\n$BULLET$Zahájit [Concept('great_project','velký projekt')|E] [GetGreatProjectType('construct_great_barracks').GetName|V]\n$BULLET$Použít [Concept('casus_bellis','casus belli')|E] #V $CHINA_SEIZE_COUNTY_CB_NAME$#! a #V $CHINA_SEIZE_DUCHY_CB_NAME$#! v [Concept('dynastic_cycle_eras_short','érách dynastického cyklu')|E] [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName] a [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability_conquest').GetName]\n$BULLET$Získat přístup ke zvláštním možnostem [Concept('interaction','interakce')|E] #V $influence_meritorious_career_interaction$#!#!#!"
 game_concept_minister_of_personnel: "$minister_personnel$"
 game_concept_minister_of_personnel_desc: "$game_concept_minister_of_personnel$ je [Concept('minister','ministr')|E] odpovědný za všechny záležitosti související se [Concept('appointments','jmenováními')|E] a může výrazně ovlivňovat [Concept('candidate_score','skóre kandidáta')|E] jiných [Concept('characters','postav')|E].\n\n$minister_of_personnel_action_breakdown$"
 game_concept_minister_of_personnel_possessive: "$minister_personnel_possessive$"
 minister_of_personnel_action_breakdown: "#indent_newline:4 #weak Ministr může například:\n$BULLET$Použít [Concept('interaction','interakci')|E] #V $force_governor_removal_interaction$#! k odvolání [Concept('governors','guvernérů')|E] bez ohledu na [Concept('law','zákon')|E] [GetLawGroup('celestial_retirement_law').GetName]\n$BULLET$Pozvat jakýkoli typ [Concept('courtier','dvořana')|E] pomocí [Concept('decision','rozhodnutí')|E] [GetDecision('tgp_minister_recruit_courtiers_decision').GetName|V]\n$BULLET$Vynutit přijetí [Concept('interactions','interakcí')|E] #V $offer_courtier_interaction$#! a #V $demand_courtier_interaction$#!\n$BULLET$Získat přístup ke zvláštním možnostem [Concept('interaction','interakce')|E] #V $influence_meritorious_career_interaction$#!, a to za sníženou cenu#!#!"
 game_concept_minister_of_revenue: "$councillor_steward_celestial_government_imperial$"
 game_concept_minister_of_revenue_desc: "$game_concept_minister_of_revenue$ je [Concept('minister','ministr')|E] odpovědný za [Concept('taxation','zdanění')|E] a pomáhá [Concept('son_of_heaven','Synu Nebes')|E] s [Concept('treasury','pokladnicí')|E].\n\n$minister_of_revenue_action_breakdown$"
 game_concept_minister_of_revenue_possessive: "$councillor_steward_celestial_government_imperial_possessive$"
 minister_of_revenue_action_breakdown: "#indent_newline:4 #weak Ministr může například:\n$BULLET$Pomáhat [Concept('vassals','vazalům')|E], kteří mohou použít #V $celestial_request_treasury_interaction$#!\n$BULLET$Použít [Concept('decision','rozhodnutí')|E] [GetDecision('tgp_suggest_budget_change_decision').GetName|V]\n$BULLET$Zahájit [Concept('great_project','velký projekt')|E] [GetGreatProjectType('minister_project_conduct_census').GetName|V]\n$BULLET$Použít [Concept('interaction','interakci')|E] #V $pay_treasury_debt_interaction$#! k zaplacení [Concept('treasury_debt','dluhu pokladnice')|E] [Concept('civilian_governors','civilních guvernérů')|E], což spustí [Concept('dynastic_cycle_catalyst','katalyzátor dynastického cyklu')|E] #V '$catalyst_cleared_treasury_debt$'#!\n$BULLET$Získat přístup ke zvláštním možnostem [Concept('interaction','interakce')|E] #V $influence_meritorious_career_interaction$#!#!#!"
 game_concept_minister_of_rites: "$councillor_court_chaplain_celestial_government_imperial$"
 game_concept_minister_of_rites_desc: "$game_concept_minister_of_rites$ je [Concept('minister','ministr')|E] odpovědný za náboženské a duchovní záležitosti a může pomáhat [Concept('governors','guvernérům')|E] s pořádáním [Concept('examinations','zkoušek')|E].\n\n$minister_of_rites_action_breakdown$"
 game_concept_minister_of_rites_possessive: "$councillor_court_chaplain_celestial_government_imperial_possessive$"
 minister_of_rites_action_breakdown: "#indent_newline:4 #weak Ministr může například:\n$BULLET$Zahájit [Concept('great_project','velký projekt')|E] [GetGreatProjectType('minister_project_culture').GetName|V]\n$BULLET$Zahájit [Concept('great_project','velký projekt')|E] [GetGreatProjectType('minister_compel_religious_uniformity').GetName|V]\n$BULLET$Pomáhat [Concept('vassals','vazalům')|E] s pořádáním [Concept('examinations','zkoušek')|E]\n$BULLET$Získat přístup ke zvláštním možnostem [Concept('interaction','interakce')|E] #V $influence_meritorious_career_interaction$#!\n$BULLET$Použít #V $demand_conversion_minister_rites_interaction$#! na [Concept('characters','postavy')|E] [Concept('faith_hostile','nepřátelských')|E] nebo [Concept('faith_evil','zavrženíhodných')|E] [Concept('faiths','věr')|E]#!#!"
 game_concept_minister_of_war: "$minister_war$"
 game_concept_minister_of_war_desc: "$game_concept_minister_of_war$ je [Concept('minister','ministr')|E] odpovědný za správu a řízení vojska. Když podřízení [Concept('governors','guvernéři')|E] potřebují vojenskou pomoc, právě $game_concept_minister_of_war$ může vyslat vojenské guvernéry, aby jim pomohli.\n\nMinistr není aktivním [Concept('commander','velitelem')|E] a nevede vojska. To spadá do působnosti [Concept('minister_grand_marshal','velkého maršála')|E].\n\n$minister_of_war_action_breakdown$"
 game_concept_minister_of_war_possessive: "$minister_war_possessive$"
 minister_of_war_action_breakdown: "#indent_newline:4 #weak Ministr může například:\n$BULLET$Poslat pomoc [Concept('vassals','vazalům')|E] ve [Concept('war','válce')|E], kteří mohou použít #V $celestial_request_military_aid_interaction$#!\n$BULLET$Nařídit [Concept('military_governors','vojenským guvernérům')|E], aby se připojili k [Concept('wars','válkám')|E] jiných [Concept('governors','guvernérů')|E]\n$BULLET$Zahájit [Concept('great_project','velký projekt')|E] [GetGreatProjectType('minister_project_train_troops').GetName|V]\n$BULLET$Použít [Concept('interaction','interakci')|E] #V $pay_treasury_debt_interaction$#! k zaplacení [Concept('treasury_debt','dluhu pokladnice')|E] [Concept('military_governors','vojenských guvernérů')|E], což spustí [Concept('dynastic_cycle_catalyst','katalyzátor dynastického cyklu')|E] #V '$catalyst_cleared_treasury_debt$'#!\n$BULLET$Získat přístup ke zvláštním možnostem [Concept('interaction','interakce')|E] #V $influence_meritorious_career_interaction$#!#!#!"
 game_concept_minister_of_justice: "$minister_justice$"
 game_concept_minister_of_justice_desc: "$game_concept_minister_of_justice$ je [Concept('minister','ministr')|E] odpovědný za právní záležitosti a pomáhá [Concept('son_of_heaven','Synu Nebes')|E] udržovat spravedlivou vládu.\n\n$minister_of_justice_action_breakdown$"
 game_concept_minister_of_justice_possessive: "$minister_justice_possessive$"
 minister_of_justice_action_breakdown: "#indent_newline:4 #weak Ministr může například:\n$BULLET$Zahájit [Concept('great_project','velký projekt')|E] [GetGreatProjectType('minister_project_establish_control').GetName|V]\n$BULLET$Použít [Concept('interaction','interakci')|E] #V $imprison_interaction$#! na [Concept('vassals','vazaly')|E] a [Concept('courtiers','dvořany')|E], kteří nemohou odmítnout\n$BULLET$Použít [Concept('interaction','interakci')|E] #V $pardon_interaction$#! na [Concept('characters','postavy')|E], které spáchaly [Concept('crimes','zločiny')|E]\n$BULLET$Použít [Concept('interaction','interakci')|E] $censor_find_secrets_interaction$ k hledání [Concept('secrets','tajemství')|E] na [Concept('courts','dvorech')|E] [Concept('vassal','vazalů')|E] a známé [Concept('criminals','zločince')|E] [Concept('imprison','uvěznit')|E] nebo omilostnit\n$BULLET$Odhalení [Concept('secrets','tajemství')|E] spustí [Concept('dynastic_cycle_catalyst','katalyzátor dynastického cyklu')|E] $catalyst_minister_exposed_secret$\n$BULLET$Získat přístup ke zvláštním možnostem [Concept('interaction','interakce')|E] #V $influence_meritorious_career_interaction$#!#!#!"
 game_concept_minister_of_works: "$minister_works$"
 game_concept_minister_of_works_desc: "$game_concept_minister_of_works$ je [Concept('minister','ministr')|E] odpovědný za výstavbu a rozvoj v celém [Concept('realm','panství')|E] a může zahajovat [Concept('great_projects','velké projekty')|E].\n\n$minister_of_works_action_breakdown$"
 game_concept_minister_of_works_possessive: "$minister_works_possessive$"
 minister_of_works_action_breakdown: "#indent_newline:4 #weak Ministr může například:\n$BULLET$Zahájit [Concept('great_project','velký projekt')|E] [GetGreatProjectType('minister_project_development').GetName|V]\n$BULLET$Zahájit [Concept('great_project','velký projekt')|E] [GetGreatProjectType('grand_canals').GetName|V]\n$BULLET$Zahájit [Concept('great_project','velký projekt')|E] [GetGreatProjectType('great_wall').GetName|V]\n$BULLET$Může stavět [Concept('buildings','budovy')|E] a [Concept('holdings','državy')|E] uvnitř [Concept('realm','panství')|E]\n$BULLET$Může stavět [Concept('buildings','budovy')|E] a [Concept('holdings','državy')|E] uvnitř [Concept('tributaries','tributářů')|E] [Concept('son_of_heaven','Syna nebes')|E] v [Concept('dynastic_cycle_era_short','éře dynastického cyklu')|E] [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName]\n$BULLET$Získat přístup ke zvláštním možnostem [Concept('interaction','interakce')|E] #V $influence_meritorious_career_interaction$#!#!#!"
 game_concept_grand_secretariat_director: "Ředitel sekretariátu"
 game_concept_grand_secretariat: "Velký sekretariát"
 game_concept_grand_secretariat_possessive: "Velkého sekretariátu"
 game_concept_grand_secretariat_director_desc: "Ředitel sekretariátu je typ [Concept('diarch','spoluvládce')|E] pro [Concept('son_of_heaven','Syna Nebes')|E], který božskému vládci pomáhá spravovat [Concept('realm','panství')|E].\n\nTo, kdo je ředitelem, závisí na aktivním [Concept('law','zákoně')|E] [GetLawGroup('grand_secretariat_laws').GetName|V]. Úřad může zastávat buď [Concept('minister_grand_chancellor','velký kancléř')|E], [Concept('minister_grand_marshal','velký maršál')|E], nebo [Concept('minister_censor','cenzor')|E].\n\nŘeditel může zahájit většinu [Concept('great_projects','velkých projektů')|E] dostupných některým [Concept('ministers','ministrům')|E] a Synu Nebes."
 game_concept_ministry_obligation: "Povinnost ministerstva"
 game_concept_ministry_obligations: "Povinnosti ministerstva"
 game_concept_ministry_obligations_desc: "$game_concept_ministry_obligations$ jsou jedinečnou sadou [Concept('vassal_obligations','vazalských povinností')|E] dostupnou pouze [Concept('ministers','ministrům')|E].\n\nVšichni civilní ministři mají jako výchozí nastavenou konkrétní možnost, zatímco [Concept('minister_grand_marshal','velký maršál')|E] má jedinečnou možnost, která maršálovi poskytuje [Concept('title_men_at_arms','titulové ozbrojence')|E].\n\nTyto povinnosti nelze měnit."
 game_concept_civilian_career_path: "Civilní kariérní dráha"
 game_concept_civilian_career_path_i: "@celestial_standard_administration!"
 game_concept_civilian_career_path_desc: "[Concept('rulers','Vládci')|E], kteří se vydají po civilní kariérní dráze, se soustředí na správní dovednosti namísto válečné prohnanosti. Jsou jmenováni do civilních okruhů a jejich [Concept('merit','zásluhy')|E] porostou podle toho, jak úspěšně rozvíjejí zemi pomocí [Concept('buildings','budov')|E] a zvyšují [Concept('taxes','daně')|E] placené svému [Concept('liege','lennímu pánovi')|E]."
 game_concept_civilian_career: "Civilní kariéra"
 game_concept_civilian_career_short: "Civilní"
 game_concept_military_career_path: "Vojenská kariérní dráha"
 game_concept_military_career_path_i: "@celestial_military_administration!"
 game_concept_military_career_path_desc: "[Concept('rulers','Vládci')|E], kteří se vydají po vojenské kariérní dráze, se soustředí na válečnické dovednosti namísto správních úkolů. Jsou jmenováni do vojenských okruhů a jejich [Concept('merit','zásluhy')|E] porostou podle jejich schopnosti verbovat a udržovat [Concept('title_men_at_arms','titulové ozbrojence')|E]."
 game_concept_military_career: "Vojenská kariéra"
 game_concept_military_career_short: "Vojenská"
 game_concept_civilian_governor: "Civilní guvernér"
 game_concept_civilian_governors: "Civilní guvernéři"
 game_concept_civilian_governor_short: "Civilní"
 game_concept_civilian_governor_desc: "Civilní guvernér je [Concept('governor','guvernér')|E] s civilními [Concept('vassal_obligations','vazalskými povinnostmi')|E]. Na rozdíl od [Concept('military_governors','vojenských guvernérů')|E] nemůže nasazovat [Concept('title_men_at_arms','titulové ozbrojence')|E] a soustředí se výhradně na správní úkoly a rozvoj země, které vládne.\n\n[Concept('characters','Postavy')|E], které se vydají po [Concept('civilian_career_path','civilní kariérní dráze')|E], se mohou stát civilními guvernéry."
 game_concept_military_governor: "Vojenský guvernér"
 game_concept_military_governors: "Vojenský guvernéři"
 game_concept_military_governor_short: "Vojenský"
 game_concept_military_governor_desc: "Vojenský guvernér je [Concept('governor','guvernér')|E] s vojenskými [Concept('vassal_obligations','vazalskými povinnostmi')|E]. Na rozdíl od [Concept('civilian_governors','civilních guvernérů')|E] může nasazovat [Concept('title_men_at_arms','titulové ozbrojence')|E] a využívá je k ochraně [Concept('realm','panství')|E] před cizími vpády i k podpoře jiných guvernérů, kteří potřebují vojenskou pomoc.\n\n[Concept('characters','Postavy')|E], které se vydají po [Concept('military_career_path','vojenské kariérní dráze')|E], se mohou stát vojenskými guvernéry."
 game_concept_great_project: "Velký projekt"
 game_concept_great_projects: "Velké projekty"
 game_concept_great_project_i: "@great_project_icon!"
 game_concept_great_project_possessive: "Velkého projektu"
 game_concept_great_project_desc: "Velké projekty jsou rozsáhlé podniky, které vyžadují všechny zdroje [Concept('realm','panství')|E].\n\nNěkteré velké projekty zahrnují stavbu [Concept('great_building','velké stavby')|E], zatímco jiné se týkají zotavení po [Concept('natural_disaster','přírodní pohromě')|E].\n\nZatímco [Concept('ruler','vládce')|E] panství dohlíží na rozvoj velkého projektu, [Concept('subjects','subjekti')|E] mohou nabídnout [Concept('great_project_contributions','příspěvky')|E], aby napomohli jeho postupu."
 game_concept_great_project_contribution: "Příspěvek"
 game_concept_great_project_contributions: "Příspěvky"
 game_concept_great_project_contribute: "Přispět"
 game_concept_great_project_contributed: "Přispěno"
 game_concept_great_project_contribution_desc: "Příspěvky umožňují více [Concept('rulers','vládcům')|E] podílet se na rozvoji [Concept('great_project','velkého projektu')|E] a získat za to různé výhody.\n\nNěkteré příspěvky jsou povinné, aby mohl pokrok na velkém projektu začít, zatímco jiné jsou volitelné. Zbývající volitelné příspěvky lze stále poskytnout i po zahájení postupu, avšak jen do určitého okamžiku."
 game_concept_great_project_contributor: "Přispěvatel"
 game_concept_great_project_contributors: "Přispěvatelé"
 game_concept_great_project_contributor_possessive: "Přispěvatele"
 game_concept_great_project_contributors_possessive: "Přispěvatelů"
 game_concept_great_project_contributor_desc: "Přispěvatelé jsou [Concept('rulers','vládci')|E], kteří se zavázali pokrýt alespoň jeden [Concept('great_project_contribution','příspěvek')|E] k [Concept('great_project','velkému projektu')|E] a získat za to různé výhody.\n\nU většiny [Concept('great_project_contributions','příspěvků')|E] se může [Concept('great_project_contributor','přispěvatelem')|E] stát jakýkoli [Concept('subject','subjekt')|E] v [Concept('realm','panství')|E]."
 game_concept_dynastic_cycle: "Dynastický cyklus"
 game_concept_dynastic_cycle_possessive: "Dynastického cyklu"
 game_concept_dynastic_cycle_desc: "$game_concept_dynastic_cycle$ zachycuje společensko-politický stav Velké čínské říše, který prochází [Concept('situation_dynastic_cycle_phases','érami dynastického cyklu')|E] stability, nestability a chaosu.\n\nKlíčem k $game_concept_dynastic_cycle$ je [Concept('mandate_of_heaven','mandát Nebes')|E], forma [Concept('legitimacy','legitimity')|E] držená císařem. Pokud je někdy ztracen, Velká čínská říše se #N rozpadne#! – dokud ji znovu nesjednotí někdo hodný být Synem Nebes.#!"
 game_concept_situation_dynastic_cycle_phase: "Éra dynastického cyklu"
 game_concept_situation_dynastic_cycle_phases: "Éry dynastického cyklu"
 game_concept_dynastic_cycle_era_short: "Éra"
 game_concept_dynastic_cycle_eras_short: "Éry"
 game_concept_situation_dynastic_cycle_phase_desc: "Společensko-politický stav [Concept('dynastic_cycle','dynastického cyklu')|E].\n\nÉry:\n$BULLET$[Concept('dynastic_cycle_era_type_stable','stabilní éra')|E]: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName], [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName]\n$BULLET$[Concept('dynastic_cycle_era_type_unstable','nestabilní éra')|E]: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName]\n$BULLET$[Concept('dynastic_cycle_era_type_chaotic','chaotická éra')|E]: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_chaos').GetName]"
 game_concept_dynastic_cycle_era_type_stable: "Stabilní éra"
 game_concept_dynastic_cycle_era_type_stable_desc: "Stabilní [Concept('dynastic_cycle_era_types','typy ér')|E] představují období, kdy je říše nejvíce prosperující a úspěšná a [Concept('mandate_of_heaven','mandát Nebes')|E] je silný.\n\nÉry: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName], [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName]"
 game_concept_dynastic_cycle_era_type_unstable: "Nestabilní éra"
 game_concept_dynastic_cycle_era_type_unstable_desc: "Nestabilní [Concept('dynastic_cycle_era_types','typy ér')|E] představují období, kdy je říše v otřesu kvůli vnitřním nebo vnějším silám a [Concept('mandate_of_heaven','mandát Nebes')|E] kolísá.\n\nÉry: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName], [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability_conquest').GetName]"
 game_concept_dynastic_cycle_era_type_chaotic: "Chaotická éra"
 game_concept_dynastic_cycle_era_type_chaotic_desc: "Chaotické [Concept('dynastic_cycle_era_types','typy ér')|E] představují období, kdy je říše roztříštěná a [Concept('mandate_of_heaven','mandát Nebes')|E] ztracen – s možností, že jej znovu získají ti, kdo jsou toho hodni.\n\nExistuje pouze jedna chaotická éra: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_chaos').GetName]"
 game_concept_dynastic_cycle_era_type: "Typ éry dynastického cyklu"
 game_concept_dynastic_cycle_era_types: "Typy ér"
 game_concept_dynastic_cycle_era_type_desc: "V [Concept('dynastic_cycle','dynastickém cyklu')|E] existují tři typy ér; rozdělují [Concept('situation_dynastic_cycle_phases','éry dynastického cyklu')|E] a každou z nich zařazují do trojdílné opakující se povahy dynastického cyklu.\n\nTypy ér: [Concept('dynastic_cycle_era_type_stable','stabilní éra')|E], [Concept('dynastic_cycle_era_type_unstable','nestabilní éra')|E], [Concept('dynastic_cycle_era_type_chaotic','chaotická éra')|E]"
 game_concept_dynastic_cycle_catalyst: "Katalyzátor dynastického cyklu"
 game_concept_dynastic_cycle_catalysts: "Katalyzátory dynastického cyklu"
 game_concept_dynastic_cycle_catalyst_possessive: "Katalyzátoru dynastického cyklu"
 game_concept_dynastic_cycle_catalysts_possessive: "Katalyzátorů dynastického cyklu"
 game_concept_dynastic_cycle_catalyst_desc: "$game_concept_situation_catalyst_desc$"
 game_concept_movement: "Hnutí"
 game_concept_movements: "Hnutí"
 game_concept_movement_possessive: "Hnutí"
 game_concept_movements_possessive: "Hnutí"
 game_concept_movement_desc: "Skupina [Concept('characters','postav')|E] se společnými zájmy a představou o [Concept('dynastic_cycle','dynastickém cyklu')|E]. Každý člen hnutí může mít přístup k různým [Concept('interactions','interakcím')|E] a [Concept('decisions','rozhodnutím')|E], aby cyklus postrčil žádoucím směrem. [Concept('movement_leader','Vůdce hnutí')|E] je mluvčí, který u [Concept('son_of_heaven','Syna Nebes')|E] zastupuje [Concept('movement_possessive','zájmy hnutí')|E]."
 game_concept_movement_power: "Síla hnutí"
 game_concept_movement_power_i: "@movement_power_icon!"
 game_concept_movement_power_desc: "Síla hnutí představuje politickou váhu skupiny zapojené do [Concept('dynastic_cycle','dynastického cyklu')|E]. Je součtem [Concept('personal_movement_power','osobní síly hnutí')|E] všech postav ve skupině.\n\n#V [movement_power_i|E][EmptyScope.ScriptValue('extremely_high_movement_power_value')]#! odemyká [Concept('interaction','interakci')|E] $dismiss_strong_hook_interaction$, [Concept('interaction','interakci')|E] $request_raid_remit_interaction$ a [Concept('scheme','intriku')|E] [GetScheme('raid_estate').GetTypeName]\n\n#help Síla vychází z:\n$BULLET_WITH_TAB$[merit_i][Concept('merit_level','hodnosti zásluh')|E]\n$BULLET_WITH_TAB$[influence_i][Concept('influence_level','úrovně vlivu')|E]\n$BULLET_WITH_TAB$Věku\n$BULLET_WITH_TAB$[Concept('movement_power','síly hnutí')|E] [Concept('disciples','učedníků')|E]\n$BULLET_WITH_TAB$Současné vojenské síly #weak (méně důležité v [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName])#!\n$BULLET_WITH_TAB$[GetTrait('confucian_education').GetName( GetNullCharacter )] [Concept('trait_level_track_xp','zkušeností rysu')|E] #weak (méně důležité v [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName])#!\n$BULLET_WITH_TAB$[GetTrait('governor').GetName( GetNullCharacter )] [Concept('trait_level_track_xp','zkušeností rysu')|E] #weak (méně důležité v [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName])#!#!"
 game_concept_movement_power_short: "Síla"
 game_concept_personal_movement_power: "Osobní síla hnutí"
 game_concept_personal_movement_power_desc: "$game_concept_personal_movement_power$ vyjadřuje, o kolik člen zvyšuje celkovou [Concept('movement_power_short','sílu')|E] svého [Concept('movement','hnutí')|E]"
 game_concept_personal_movement_power_short: "Síla"
 game_concept_movement_leader: "Vůdce hnutí"
 game_concept_movement_leader_possessive: "Vůdce hnutí"
 game_concept_movement_leaders: "Vůdci hnutí"
 game_concept_movement_leaders_possessive: "Vůdců hnutí"
 game_concept_movement_leader_short: "Vůdce"
 game_concept_movement_leader_desc: "Postava, která vede [Concept('movement','hnutí')|E] a je určena jako jediný člen oprávněný přímo jednat se [Concept('son_of_heaven','Synem Nebes')|E], aby prosazovala program [Concept('movements','hnutí')|E] pomocí [Concept('decision','rozhodnutí')|E] [GetDecision('movement_petition_decision').GetName].\n\n#help Aby ses stal vůdcem, musíš buď po smrti předchozího vůdce mít nejvyšší množství [movement_power_i][Concept('movement_power','síly hnutí')|E], nebo porazit současného vůdce v [Concept('activity','aktivitě')|E] [GetActivityType('activity_debate').GetName].#!"
 game_concept_favored_era: "Upřednostněná éra"
 game_concept_favored_era_possessive: "Upřednostněné éry"
 game_concept_favored_era_desc: "$game_concept_favored_era$ je vůle Nebes projevená [Concept('son_of_heaven','Synem Nebes')|E] ohledně směřování [Concept('dynastic_cycle','dynastického cyklu')|E]. Určuje, která [Concept('dynastic_cycle_era_type_stable','stabilní éra')|E] nastane po skončení [Concept('dynastic_cycle_era_type_unstable','nestabilní éry')|E]."
 game_concept_favored_movement: "Upřednostněné hnutí"
 game_concept_favored_movement_desc: "$game_concept_favored_movement$ je [Concept('movement','hnutí')|E], které získalo podporu [Concept('son_of_heaven','Syna Nebes')|E].\n$BULLET_WITH_TAB$Členové mají vyšší [Concept('candidate_scores','skóre kandidátů')|E] pro jakékoli [Concept('titles','tituly')|E] v [SelectLocalization( GetPlayer.IsValid, 'game_concept_favored_movement_desc_ingame', 'h_china' )]\n$BULLET_WITH_TAB$Petice z [Concept('decision','rozhodnutí')|E] [GetDecision('movement_petition_decision').GetName] mají vyšší šanci na přijetí\n$BULLET_WITH_TAB$[Concept('situation_catalyst_catalysts','Katalyzátory')|E] [Concept('dynastic_cycle_possessive','dynastického cyklu')|E] se spouštějí podle toho, které [Concept('movement','hnutí')|E] je upřednostněné\n$BULLET_WITH_TAB$Získává přístup k [Concept('decision','rozhodnutí')|E] [GetDecision('favored_movement_consults_heaven_decision').GetName]\n\n#help Aby se hnutí stalo upřednostněným, musíš porazit vůdce současného upřednostněného hnutí v [Concept('activity','aktivitě')|E] [GetActivityType('activity_debate').GetName].#!"
 game_concept_favored_movement_desc_ingame: "[GetTitleByKey('h_china').GetDefinitiveName]"
 game_concept_favored_movement_possessive: "Upřednostněného hnutí"
 game_concept_favored_movement_short: "Upřednostněné"
 game_concept_disciple: "Učedník"
 game_concept_disciples: "Učedníci"
 game_concept_disciple_possessive: "Učedníka"
 game_concept_disciples_possessive: "Učedníků"
 game_concept_disciple_desc: "$game_concept_disciples$ jsou [Concept('characters','postavy')|E], které ctí vysoké postavení [Concept('elder','staršího')|E] a následují jeho učení až do [Concept('disciple_limit_short','limitu')|E].\n\nMají přístup k [Concept('character_interaction','interakci s postavou')|E] #high $request_mentoring_interaction$#! #weak (intrika)#! ke zvýšení svých [Concept('skills','dovedností')|E] a k [Concept('character_interaction','interakci s postavou')|E] #high $celestial_request_elders_support_interaction$#! pro získání [Concept('gold','zlata')|E], [Concept('courtiers','dvořanů')|E] a dalších výhod.\n\n$disciple_elder_benefits_tt$"
 disciple_elder_benefits_tt: "$game_concept_disciple$ a [Concept('elder','starší')|E]:\n$BULLET_WITH_TAB$Získávají více [Concept('merit','zásluh')|E]\n$BULLET_WITH_TAB$Méně často proti sobě používají [Concept('hostile_schemes','nepřátelské intriky')|E]\n$BULLET_WITH_TAB$Častěji přijímají [Concept('interactions','interakce')|E] zaslané tím druhým\n$BULLET_WITH_TAB$Častěji používají přátelské [Concept('interactions','interakce')|E] na toho druhého #weak (např. $gift_interaction$, $invite_to_council_position_interaction$ atd.)#!\n$BULLET_WITH_TAB$Oba budou náležet k [Concept('movement','hnutí')|E] $game_concept_elder_possessive$"
 game_concept_disciple_limit: "Limit učedníků"
 game_concept_disciple_limit_short: "Limit"
 game_concept_disciple_limit_desc: "$game_concept_disciple_limit$ je kapacita určující, kolik [Concept('disciples','učedníků')|E] může [Concept('elder','starší')|E] v danou chvíli mít.\n\nVe výchozím stavu je limit [EmptyScope.ScriptValue('disciples_limit_base_value')|V0]. Lze jej zvýšit například vylepšením [Concept('domicile','domicilu')|E] určitými [Concept('domicile_buildings','budovami domicilu')|E]."
 game_concept_elder: "Starší"
 game_concept_elders: "Starší"
 game_concept_elder_possessive: "Staršího"
 game_concept_elders_possessive: "Starších"
 game_concept_elder_desc: "$game_concept_elder$ je [Concept('character','postava')|E] s jedním nebo více [Concept('disciples','učedníky')|E], kteří následují učení $game_concept_elders_possessive$.\n\n$disciple_elder_benefits_tt$"
 game_concept_disaster: "Pohroma"
 game_concept_disasters: "Pohromy"
 game_concept_natural_disaster: "Přírodní pohroma"
 game_concept_natural_disasters: "Přírodní pohromy"
 game_concept_disaster_desc: "$game_concept_natural_disasters$ zahrnují [Concept('floods','povodně')|E] a [Concept('earthquakes','zemětřesení')|E].\n\n$game_concept_natural_disaster$ způsobí [Concept('character_death_death','smrt')|E] mnoha [Concept('characters','postav')|e] v zasažených [Concept('counties','hrabstvích')|E] a navíc bude mít výrazný negativní dopad na [Concept('development','rozvoj')|E], [Concept('county_opinion','lidové mínění')|E] a [Concept('control','kontrolu')|E] podle závažnosti pohromy.\n\nZkázu způsobenou $game_concept_natural_disaster$ lze napravit a zemi obnovit dokončením záchranného [Concept('great_project','velkého projektu')|E]."
 game_concept_earthquake: "Zemětřesení"
 game_concept_earthquakes: "Zemětřesení"
 game_concept_earthquake_desc: "$game_concept_earthquake$ je typ [Concept('natural_disaster','přírodní pohromy')|E], který způsobuje těžkou a náhlou zkázu v malém počtu [Concept('counties','hrabství')|E].\n$game_concept_earthquakes$ mohou nastat pouze v oblastech náchylnějších k seismické činnosti."
 game_concept_flood: "Povodeň"
 game_concept_floods: "Povodně"
 game_concept_flooded: "Zaplaveno"
 game_concept_flood_desc: "$game_concept_flood$ je [Concept('natural_disaster','přírodní pohroma')|E], která způsobuje narůstající škody ve velkém počtu [Concept('counties','hrabství')|E].\n$game_concept_floods$ mohou nastat pouze podél břehů velkých řek."
 game_concept_government_bureaucratic_type: "Byrokratická"
 game_concept_government_bureaucratic_type_desc: "Některé [Concept('governments','vlády')|E] jsou $game_concept_government_bureaucratic_type$. Jde o vysoce centralizované vlády, které při správě [Concept('provinces','provincií')|E] v rámci [Concept('realm','panství')|E] obvykle spoléhají na [Concept('governors','guvernéry')|E], [Concept('appointment','jmenování')|E] a bezzemské [Concept('noble_families','šlechtické rodiny')|E].\n\nMezi další běžné prvky patří [Concept('domiciles','domicily')|E], [Concept('influence','vliv')|E] a [Concept('title_men_at_arms','tituloví ozbrojenci')|E].\n\nExistuje několik $game_concept_government_bureaucratic_type$ vlád:\n$BULLET_WITH_TAB$[GetGovernment('administrative_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('celestial_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('meritocratic_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('japan_administrative_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('steppe_admin_government').GetNameWithIcon]"
 game_concept_government_bureaucratic_gov: "Byrokratická vláda"
