l_polish:
 game_concept_celestial_government: "Nebeská vláda"
 game_concept_celestial: "Nebeská"
 game_concept_celestials: "Nebeské vlády"
 game_concept_celestial_i: "@government_type_celestial!"
 game_concept_celestial_government_desc: "$game_concept_celestial$ je [Concept('government_bureaucratic_type','byrokratická')|E] [Concept('government_form','forma vlády')|E], v níž [Concept('liege','lenní pán')|E] jmenuje postavy do úřadů [Concept('governors','guvernérů')|E]. Ti se dělí na dva druhy: [Concept('civilian_governor_short','civilní')|E] a [Concept('military_governor_short','vojenské')|E].\n\nPostavy mají přístup k [Concept('influence','vlivu')|E], [Concept('noble_families','šlechtickým rodinám')|E], [Concept('family_mansions','rodovým sídlům')|E] a [Concept('treasury','pokladnici')|E].\n\n[Concept('rulers','Nezávislí vládci')|EU] disponují [Concept('legitimacy','legitimitou')|E], zatímco [Concept('vassals','vazalové')|E] se soustředí na získávání [Concept('merit','zásluh')|E]."
 game_concept_merit: "Zásluhy"
 game_concept_meritorious: "Záslužný"
 game_concept_merit_desc: "Hodnota $game_concept_merit$ [Concept('character_possessive','postavy')|E] vyjadřuje její pokrok na cestě k další [Concept('merit_level','hodnosti zásluh')|E]. Všechny postavy, které mají [Concept('elder','staršího')|E] nebo [Concept('disciples','učedníky')|E], získávají zásluhy průběžně.\n\n[Concept('governors','Guvernéři')|EU] mohou své $game_concept_merit$ zvyšovat výstavbou [Concept('buildings','budov')|E] ve svěřených [Concept('holdings','državách')|E], účastí na [Concept('activity','aktivitě')|E] [Concept('inspection','Inspekce')|E], zapojením do [CZActivity('activity_debate','G')] a skládáním [Concept('examinations','zkoušek')|E].\n\nGuvernéři typu [GetSubjectContractType( 'celestial_provinces' ).GetObligationNameShort( 'celestial_province_standard' )] si mohou zvýšit měsíční přírůstek zásluh odváděním vyšších [Concept('taxes','daní')|E] svému [Concept('liege','lennímu pánovi')|E], zatímco guvernéři typu [GetSubjectContractType( 'celestial_provinces' ).GetObligationNameShort( 'celestial_province_military' )] jej mohou zvýšit vytvářením jednotek [Concept('men_at_arms','ozbrojenců')|E].\n\nTaké postavy, které nejsou $game_concept_governors$, se mohou pokusit získat další zásluhy účastí na [Concept('examinations','zkouškách')|E]."
 game_concept_merit_i: "@merit_icon!"
 game_concept_merit_level: "Hodnost zásluh"
 game_concept_merit_level_desc: "$game_concept_merit_level$ [Concept('character_possessive','postavy')|E] vyjadřuje, nakolik je daná postava způsobilá vykonávat úřad [Concept('governor','guvernéra')|E] ve východoasijských [Concept('administrative_governments','administrativních vládách')|E].\n\nNa základě získaných [Concept('merit','zásluh')|E] odráží její doložené úspěchy a mravní jednání podle konfuciánských ideálů.\n\nÚředník s vysokou $game_concept_merit_level$ má vyšší [Concept('candidate_score','skóre kandidáta')|E] a pobírá vyšší [Concept('governor_salary','plat guvernéra')|E].\n\nJednotlivé hodnosti:\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_5' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_6' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_7' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_8' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_9' ).GetNameWithTooltip|L]"
 game_concept_merit_levels: "Hodnosti zásluh"
 game_concept_merit_level_impact: "Vliv hodnosti zásluh"
 game_concept_merit_level_impact_desc: "$game_concept_merit_level_impact$ zvyšuje nebo snižuje účinky [Concept('modifiers','modifikátorů')|E] získaných z aktuální [Concept('merit_level','hodnosti zásluh')|E]."
 game_concept_imperial_examination: "Úřednická zkouška"
 game_concept_imperial_examinations: "Úřednické zkoušky"
 game_concept_examination: "Zkouška"
 game_concept_examinations: "Zkoušky"
 game_concept_imperial_examination_desc: "$game_concept_imperial_examinations$ hrají klíčovou roli v [Concept('government_bureaucratic_type','byrokratickém')|E] fungování [Concept('governments','vlád')|E] [GetGovernment('celestial_government').GetName|E] a [GetGovernment('meritocratic_government').GetName|E].\n\nSystém zkoušek zajišťuje, že úředníci jsou jmenováni podle [Concept('merit','zásluh')|E], nikoli podle rodového původu. Díky tomu mohou úřady [Concept('governorship','guvernérů')|E] získávat i ti nejnadanější učenci bez ohledu na své předky.\n\nZkoušky mají následující úrovně:\n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Dětská#!: Rodiče mohou své děti od věku [EmptyScope.ScriptValue('child_exam_min_age')] let přihlásit ke zkoušce prostřednictvím [Concept('interaction','interakce')|E] $send_child_to_examination_interaction$.#!\n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Provinční#!: Postavy, které nejsou [Concept('landed','zeměpány')|E], se mohou pokusit složit druhý stupeň zkoušek prostřednictvím [Concept('activity','aktivity')|E] [GetActivityType('activity_local_examination').GetName].#!\n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Metropolitní#!: Pořádá ji [Concept('government','vláda')|E] [GetGovernment('celestial_government').GetName|E] prostřednictvím [Concept('activity','aktivity')|E] [GetActivityType('activity_imperial_examination').GetName].#!\n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Palácová#!: Posledních [EmptyScope.ScriptValue('metropolitan_exam_final_entrants_loc')] účastníků $activity_imperial_examination$ je pozváno na hostinu do císařského paláce, kde se mohou setkat se [Concept('son_of_heaven','Synem Nebes')|E] a prokázat své schopnosti.#!"
 game_concept_exam_cheat: "Podvod u zkoušky"
 game_concept_exam_cheat_desc: "$game_concept_exam_cheat$ zpřístupňuje možnosti, jak obejít nadcházející zkoušku. Dej si však pozor, protože odhalení podvodu může přijít draho."
 game_concept_childrens_examination_i: "@child_exam_icon"
 game_concept_childrens_examination: "Dětská zkouška"
 game_concept_childrens_examination_desc: "První stupeň [Concept('imperial_examinations','úřednických zkoušek')|E], který lze skládat od [EmptyScope.ScriptValue('child_exam_min_age')] let. Rodiče mohou své děti přihlásit prostřednictvím [Concept('interaction','interakce')|E] $send_child_to_examination_interaction$."
 game_concept_provincial_examination_i: "@provincial_exam_icon"
 game_concept_provincial_examination: "Provinční zkouška"
 game_concept_provincial_examination_desc: "Druhý stupeň [Concept('imperial_examinations','úřednických zkoušek')|E], který se skládá prostřednictvím [Concept('activity','aktivity')|E] [GetActivityType('activity_local_examination').GetName].\n\n#S Po úspěšném složení:#!\n[GetModifier( 'tgp_passed_provincial_exam_modifier' ).GetDescWithEffects]."
 game_concept_metropolitan_examination_i: "@metropolitan_exam_icon"
 game_concept_metropolitan_examination: "Metropolitní zkouška"
 game_concept_metropolitan_examination_desc: "Třetí stupeň [Concept('imperial_examinations','úřednických zkoušek')|E]. Pořádá jej [Concept('government','vláda')|E] [GetGovernment('celestial_government').GetName|E] prostřednictvím [Concept('activity','aktivity')|E] [GetActivityType('activity_imperial_examination').GetName].\n\n#S Po úspěšném složení:#!\n[GetModifier( 'tgp_passed_metropolitan_exam_modifier' ).GetDescWithEffects]."
 game_concept_palace_examination_i: "@palace_exam_icon"
 game_concept_palace_examination: "Palácová zkouška"
 game_concept_palace_examination_desc: "Čtvrtý a závěrečný stupeň [Concept('imperial_examinations','úřednických zkoušek')|E]. Posledních [EmptyScope.ScriptValue('metropolitan_exam_final_entrants_loc')] účastníků [GetActivityType('activity_imperial_examination').GetName] je pozváno na hostinu do císařského paláce, kde se pokloní [Concept('son_of_heaven','Synovi Nebes')|E] a prokážou své schopnosti.\n\n#S Po úspěšném složení:#!\n[GetModifier( 'tgp_passed_palace_exam_modifier' ).GetDescWithEffects]."
 game_concept_exam_advantage: "Výhoda u zkoušky"
 game_concept_exam_advantage_desc: "$game_concept_exam_advantage$ zvyšuje šanci na úspěch při různých úkonech během [Concept('imperial_examination','úřednické zkoušky')|E], například při odpovídání na otázky nebo předvádění dovedností."
 game_concept_exam_score: "Skóre zkoušky"
 game_concept_exam_score_desc: "$game_concept_exam_score$ určuje pravděpodobnost, s jakou účastník úspěšně složí [Concept('imperial_examination','úřednickou zkoušku')|E].\n\nPočáteční skóre závisí na [Concept('trait','rysu')|E] [GetTrait('confucian_education').GetName( GetNullCharacter )] a podle zaměření $game_concept_examination$ také na [Concept('skills','dovednostech')|E] [Concept('learning','učenosti')|E], [Concept('stewardship','správcovství')|E] a [Concept('martial','válečnictví')|E].\n\nPouze deset nejlepších účastníků [Concept('activity','aktivity')|E] [GetActivityType('activity_imperial_examination').GetName] může postoupit k @palace_exam_icon! #V palácové zkoušce#!."
 game_concept_merit_pool: "Seznam kandidátů"
 game_concept_merit_pools: "Seznamy kandidátů"
 game_concept_merit_pool_possessive: "Seznamu kandidátů"
 game_concept_merit_pool_desc: "$game_concept_merit_pool$ zahrnuje všechny [Concept('characters','postavy')|E], které splňují podmínky pro získání [Concept('titles','titulů')|E] prostřednictvím určitých typů [Concept('appointment','jmenování')|E].\n\nKandidáti jsou seřazeni podle svého [Concept('candidate_score','skóre kandidáta')|E]. Některé [Concept('appointment_succession_laws','zákony nástupnictví jmenováním')|E] zohledňují také [Concept('merit','zásluhy')|E]. V takovém případě se kandidáti nejprve řadí podle [Concept('merit_level','hodnosti zásluh')|E] a teprve poté podle $game_concept_candidate_score$.\n\nKdyž [Concept('holder','držitel')|E] titulu podléhajícího systému $game_concept_appointment$ zemře, titul připadne nejvýše postavené osobě na seznamu. Pokud však tato osoba již nějaký titul drží, musí mít nový titul vyšší [Concept('appointment_prominence','významnost jmenování')|E] než ten současný. V opačném případě připadne další osobě v pořadí."
 game_concept_appointment_prominence: "Významnost jmenování"
 game_concept_appointment_prominence_desc: "$game_concept_appointment_prominence$ vyjadřuje, nakolik je určitý [Concept('title','titul')|E] žádoucí pro způsobilé kandidáty.\n\nKandidát, který již nějaký titul drží, může být jmenován do nového úřadu na stejné [Concept('title_tier','úrovni')|E] pouze tehdy, má-li nový titul vyšší $game_concept_appointment_prominence$.\n\n$game_concept_appointment_prominence$ obvykle závisí na místním bohatství a vzdálenosti od [Concept('realm_capital','hlavního sídla panství')|E]. Podle okolností však mohou hrát roli i další faktory, například počet [Concept('title_men_at_arms','titulových ozbrojenců')|E] u [Concept('military_governors','vojenských guvernérů')|E]."
 game_concept_entrant: "Účastník"
 game_concept_entrants: "Účastníci"
 game_concept_entrant_desc: "$game_concept_entrant$ je postava, která podrobuje své schopnosti zkoušce během [Concept('activity','aktivity')|E] [Concept('imperial_examination','Úřednická zkouška')|E]."
 game_concept_subject_standing: "Postavení subjektu"
 game_concept_subject_standing_desc: "$game_concept_subject_standing$ vyjadřuje postavení, které [Concept('suzerain','suzerén')|E] přiznává svému [Concept('tributary','tributáři')|E] nebo [Concept('liege','lenní pán')|E] svému [Concept('vassal','vazalovi')|E]."
 game_concept_imperial_grace: "Císařská přízeň"
 game_concept_imperial_grace_desc: "$game_concept_imperial_grace$ vyjadřuje postavení, které [Concept('son_of_heaven','Syn Nebes')|E] přiznává svému [Concept('tributary','tributáři')|E].\n\nVysoká $game_concept_imperial_grace$ může $game_concept_tributary$ zajistit zvláštní výsady během [Concept('tribute_missions','tributních misí')|E]. Při nízké úrovni $game_concept_imperial_grace$ může $game_concept_son_of_heaven$ #EMP vymáhat#! odvádění tributu. Pokud císařská přízeň klesne na nulu, může to znamenat i konec tributárního vztahu."
 game_concept_seal_of_investiture: "Pečeť investitury"
 game_concept_seal_of_investiture_desc: "$game_concept_seal_of_investiture$ je zároveň právním dokumentem i uctívaným symbolem přízně Syna Nebes. Potvrzuje výjimečné postavení svého držitele jako věrného a oblíbeného [Concept('tributary','tributáře')|E], který požívá přízně říše [SelectLocalization( GetPlayer.IsValid, 'game_concept_seal_of_investiture_desc_ingame', 'h_china' )].\n\n$game_concept_seal_of_investiture$ může být udělena $game_concept_tributaries$ s vysokou [Concept('imperial_grace','císařskou přízní')|E] během závěrečných obřadů úspěšné #bold tributní mise#!."
 game_concept_seal_of_investiture_desc_ingame: "[GetTitleByKey('h_china').GetDefinitiveName]"
 HAS_SEAL_OF_INVESTITURE: "Vlastníš [Concept('seal_of_investiture','pečeť investitury')|E]"
 NO_SEAL_OF_INVESTITURE: "Nevlastníš [Concept('seal_of_investiture','pečeť investitury')|E]"
 SUBJECT_STANDING_CONCEPT: "[Concept('subject_standing','Postavení subjektu')|EU]"
 SUBJECT_STANDING_IMPERIAL_GRACE_CONCEPT: "[Concept('imperial_grace','Císařská přízeň')|EU]"
 IMPERIAL_GRACE_ICON: "@imperial_grace!"
 IMPERIAL_GRACE_LOSS_STABILITY: "Protože se [Concept('dynastic_cycle','dynastický cyklus')|E] právě nachází v éře $situation_dynastic_cycle_phase_stability$, všichni #EMP $tributaries_celestial$#! každoročně ztrácejí @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_stability')|V1] [Concept('imperial_grace','císařské přízně')|E]."
 IMPERIAL_GRACE_LOSS_STABILITY_EXPANSION: "Protože se [Concept('dynastic_cycle','dynastický cyklus')|E] právě nachází v éře $situation_dynastic_cycle_phase_stability_expansion$, všichni #EMP $tributaries_celestial$#! každoročně ztrácejí @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_stability_expansion')|V1] [Concept('imperial_grace','císařské přízně')|E]."
 IMPERIAL_GRACE_LOSS_STABILITY_ADVANCEMENT: "Protože se [Concept('dynastic_cycle','dynastický cyklus')|E] právě nachází v éře $situation_dynastic_cycle_phase_stability_advancement$, všichni #EMP $tributaries_celestial$#! každoročně ztrácejí @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_stability_advancement')|V1] [Concept('imperial_grace','císařské přízně')|E]."
 IMPERIAL_GRACE_LOSS_INSTABILITY: "Protože se [Concept('dynastic_cycle','dynastický cyklus')|E] právě nachází v éře $situation_dynastic_cycle_phase_stability_advancement$, všichni #EMP $tributaries_celestial$#! každoročně ztrácejí @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_instability')|V1] [Concept('imperial_grace','císařské přízně')|E]."
 IMPERIAL_GRACE_LOSS_INSTABILITY_CONQUEST: "Protože se [Concept('dynastic_cycle','dynastický cyklus')|E] právě nachází v éře $situation_dynastic_cycle_phase_instability_conquest$, všichni #EMP $tributaries_celestial$#! každoročně ztrácejí @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_instability_conquest')|V1] [Concept('imperial_grace','císařské přízně')|E]."
 IMPERIAL_GRACE_LOSS_CHAOS: "Protože se [Concept('dynastic_cycle','dynastický cyklus')|E] právě nachází v éře $situation_dynastic_cycle_phase_chaos$, všichni #EMP $tributaries_celestial$#! každoročně ztrácejí @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_chaos')|V1] [Concept('imperial_grace','císařské přízně')|E]."
 game_concept_mandate_of_heaven: "Mandát Nebes"
 game_concept_mandate_of_heaven_mandate: "Mandát"
 game_concept_mandate_of_heaven_desc: "$game_concept_mandate_of_heaven$ je zvláštní druh [Concept('legitimacy','legitimity')|E], který může získat pouze [Concept('son_of_heaven','Syn Nebes')|E]. Představuje panovníkovo právo vládnout a jeho postavení nejvyššího vládce všeho pod Nebesy.\n\nMandát úzce souvisí s [Concept('dynastic_cycle','dynastickým cyklem')|E]. Jeho průběh ovlivňuje způsob, jakým vládnoucí panovník získává legitimitu, a podle úrovně Mandátu může také měnit [Concept('situation_dynastic_cycle_phase','éru dynastického cyklu')|E]."
 game_concept_son_of_heaven: "Syn Nebes"
 game_concept_son_of_heaven_possessive: "Syna Nebes"
 game_concept_son_of_heaven_desc: "$game_concept_son_of_heaven$ je [Concept('hegemon','hegemonem')|E] Číny a [Concept('top_liege','nejvyšším lenním pánem')|E] [Concept('celestial_government','nebeské vlády')|E].\n\n$game_concept_son_of_heaven$ disponuje zvláštní formou [Concept('legitimacy','legitimity')|E], kterou představuje [Concept('mandate_of_heaven','Mandát Nebes')|E], a má vlastní jedinečnou [Concept('situation_participant_group','skupinu účastníků')|E] nazvanou jednoduše $game_concept_son_of_heaven$."
 game_concept_treasury_i: "@treasury_icon!"
 game_concept_treasury: "Pokladnice"
 game_concept_treasury_desc: "V některých typech [Concept('governments','vlád')|E] představuje pokladnice prostředky, které lze na rozdíl od tvého osobního [Concept('gold','zlata')|E] využívat pouze ke státním účelům.\n\n$BULLET$#indent_newline:2 [Concept('treasury','Pokladnice')|EU] může být zřízena tvým [Concept('top_liege','nejvyšším lenním pánem')|E] (centralizovaně) nebo na místní úrovni (decentralizovaně).#!\n$BULLET$#indent_newline:2 Určitá část příjmů ze [Concept('taxation','zdanění')|E] se převádí do pokladnice.#!\n$BULLET$#indent_newline:2 Jako [Concept('vassal','vazal')|E] můžeš od svého [Concept('liege','lenního pána')|E] získávat prostředky do pokladnice podle výše odváděných [Concept('tax','daní')|E] a dalších povinností.#!\n$BULLET$#indent_newline:2 Do pokladnice můžeš kdykoli převést vlastní [Concept('gold','zlato')|E].#!\n$BULLET$#indent_newline:2 Prostředky v pokladnici zůstávají vázány na [Concept('title','titul')|E], i když se změní jeho [Concept('holder','držitel')|E].#!"
 game_concept_imperial_treasury_i: "$game_concept_treasury_i$"
 game_concept_imperial_treasury: "Císařská pokladnice"
 game_concept_imperial_treasury_desc: "$game_concept_treasury_desc$"
 game_concept_treasury_vassal_development: "Rozvoj vazalů"
 game_concept_treasury_vassal_development_desc: "Prostředky z pokladnice přidělované přímým [Concept('vassals','vazalům')|E] prostřednictvím jejich [Concept('liege','lenního pána')|E] podle výše odváděných daní a dalších [Concept('obligations','povinností')|E]."
 game_concept_treasury_ministry_budget: "Rozpočet ministerstev"
 game_concept_treasury_ministry_budget_short: "Ministerstva"
 game_concept_treasury_ministry_budget_desc: "Prostředky z pokladnice přidělované [Concept('vassals','vazalům')|E] ústřední vládou na financování [Concept('ministries','ministerstev')|E]. Jejich výše vychází z pravidelně vypočítávaného rozdělení příjmů [Concept('treasury','pokladnice')|E] [Concept('top_liege','nejvyššího lenního pána')|E]."
 game_concept_treasury_salary_budget: "Platový rozpočet"
 game_concept_treasury_salary_budget_short: "Platy"
 game_concept_treasury_salary_budget_desc: "Prostředky z pokladnice přidělované [Concept('vassals','vazalům')|E] ústřední vládou. Vyplácejí se jako [Concept('gold','zlato')|E], které mohou příjemci využívat jako svůj osobní plat. Jejich výše vychází z pravidelně vypočítávaného rozdělení příjmů [Concept('treasury','pokladnice')|E] [Concept('top_liege','nejvyššího lenního pána')|E]."
 game_concept_treasury_military_budget: "Vojenský rozpočet"
 game_concept_treasury_military_budget_short: "Vojenství"
 game_concept_treasury_military_budget_desc: "Prostředky z pokladnice přidělované ústřední vládou vojenským [Concept('vassals','vazalům')|E] spravujícím [Concept('province','provincie')|E] na financování dalších vojenských činností. Jejich výše vychází z pravidelně vypočítávaného rozdělení příjmů [Concept('treasury','pokladnice')|E] [Concept('top_liege','nejvyššího lenního pána')|E]."
 game_concept_governor_salary: "Plat guvernéra"
 game_concept_governor_salary_desc: "V [Concept('administrative_governments','administrativních vládách')|E], které rozlišují mezi [Concept('gold','zlatem')|E] a [Concept('treasury','prostředky pokladnice')|E], dostávají [Concept('governors','guvernéři')|E] plat vyplácený ve $game_concept_gold$."
 game_concept_treasury_budgeting: "Rozpočtování pokladnice"
 game_concept_treasury_budget: "Rozpočet pokladnice"
 game_concept_treasury_budgeting_desc: "Systém, který zajišťuje rozdělování prostředků ústřední pokladnice mezi vybrané [Concept('vassals','vazaly')|E] a jejich podřízené vazaly podle stanovených sazeb.\n\nPři schválení rozpočtu se pro každou [Concept('treasury_budget_category','rozpočtovou kategorii')|E] vypočítá [Concept('treasury_budget_base_rate','základní sazba rozpočtu')|E] na jednoho vazala podle dostupné [Concept('treasury_budget_capacity','rozpočtové kapacity')|E].\n\n@alert_icon! Vypočítaná základní sazba se #bold nezmění#! až do schválení dalšího rozpočtu! Pokud tedy přibudou další příjemci, celkové rozpočtové výdaje vzrostou."
 game_concept_treasury_budget_capacity: "Rozpočtová kapacita"
 game_concept_treasury_budget_capacity_desc: "Měsíční objem prostředků [Concept('treasury','pokladnice')|E] dostupných pro [Concept('treasury_budgeting','rozpočtování pokladnice')|E]. Vypočítává se jako příjmy pokladnice snížené o pravidelné výdaje, které nejsou spravovány prostřednictvím rozpočtu, například [Concept('treasury_vassal_development','rozvoj vazalů')|E] a [Concept('court_amenities','dvorský komfort')|E]."
 game_concept_treasury_budget_category: "Rozpočtová kategorie"
 game_concept_treasury_budget_category_desc: "Samostatná část [Concept('treasury_budgeting','rozpočtování pokladnice')|E], do níž lze přidělovat prostředky. Jednotlivé rozpočtové kategorie mohou mít odlišné příjemce a některé mohou vyplácet [Concept('gold','zlato')|E] namísto prostředků z [Concept('treasury','pokladnice')|E]."
 game_concept_treasury_budget_base_rate: "Základní sazba rozpočtu"
 game_concept_treasury_budget_base_rate_short: "Základní sazba"
 game_concept_treasury_budget_base_rate_desc: "Částka, kterou obdrží běžný příjemce v rámci [Concept('treasury_budget_category','rozpočtové kategorie')|E]. Skutečně přidělené prostředky mohou být vyšší nebo nižší než základní sazba v závislosti na [Concept('title_rank','hodnosti')|E], [Concept('merit_level','hodnosti zásluh')|E] nebo dalších modifikátorech."
 game_concept_treasury_budget_category_trend: "Trend rozpočtové kategorie"
 game_concept_treasury_budget_category_trend_short: "Trend"
 game_concept_treasury_budget_category_trend_desc: "Rozdíl v objemu prostředků [Concept('treasury','pokladnice')|E], které [Concept('treasury_budget_category','rozpočtová kategorie')|E] obdrží oproti předchozímu schválenému rozpočtu."
 game_concept_treasury_budget_unallocated: "Nepřidělený rozpočet pokladnice"
 game_concept_treasury_budget_unallocated_short: "Nepřiděleno"
 game_concept_treasury_budget_unallocated_desc: "Veškeré nepřidělené rozpočtové prostředky se započítávají do obecných příjmů [Concept('treasury','pokladnice')|E]."
 game_concept_treasury_budget_deficit: "Schodek rozpočtu pokladnice"
 game_concept_treasury_budget_deficit_short: "Schodek"
 game_concept_treasury_budget_deficit_desc: "Pokud výdaje překročí [Concept('treasury_budget_capacity','rozpočtovou kapacitu')|E], odpovídající částka se odečte od měsíčních příjmů [Concept('treasury','pokladnice')|E]."
 game_concept_celestial_bureaucracy: "Nebeská byrokracie"
 game_concept_celestial_bureaucracy_desc: "$game_concept_celestial_bureaucracy$ představuje míru centralizace [Concept('realm_possessive','panství')|E] s [Concept('celestial','nebeskou')|E] vládou a rozsah moci, kterou [Concept('ruler','vládce')|E] uplatňuje nad svými [Concept('vassals','vazaly')|E].\n\nÚroveň $game_concept_celestial_bureaucracy$ může měnit pouze [Concept('top_liege','nejvyšší lenní pán')|E]. Nebeští $game_concept_vassals$ používají stejnou úroveň jako jejich $game_concept_liege$.\n\nExistují čtyři úrovně $game_concept_celestial_bureaucracy$:\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_0$\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_1$\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_2$\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_3$\n\nZvýšení úrovně $game_concept_celestial_bureaucracy$ stojí určité množství [Concept('prestige','prestiže')|E], které závisí na [Concept('realm_size','velikosti panství')|E] a panovníkově [Concept('learning_skill','učenosti')|E]."
 game_concept_minister: "Ministr"
 game_concept_ministers: "Ministři"
 game_concept_minister_possessive: "Ministrův"
 game_concept_ministers_possessive: "Ministrů"
 game_concept_minister_desc: "$game_concept_ministers$ jsou zvláštním druhem [Concept('councillors','rádců')|E], kteří slouží v [Concept('council','radě')|E], neboli [Concept('ministry','ministerstvu')|E], [Concept('son_of_heaven','Syna Nebes')|E].\n\nKaždý ministr má řadu povinností, například financování [Concept('great_projects','velkých projektů')|E] nebo poskytování různých forem pomoci [Concept('governors','guvernérům')|E]."
 game_concept_ministry: "Ministerstvo"
 game_concept_ministries: "Ministerstva"
 game_concept_ministry_possessive: "Ministerstva"
 game_concept_ministries_possessive: "Ministerstev"
 game_concept_ministry_desc: "$game_concept_ministry$ je zvláštním druhem [Concept('council','rady')|E], který má k dispozici pouze [Concept('son_of_heaven','Syn Nebes')|E].\n\nTvoří jej devět [Concept('ministers','ministrů')|E], z nichž každý zastává jeden z nejvyšších státních úřadů a stojí v čele vlastního správního odvětví. Ministři jsou uspořádáni do hierarchie, takže ministr nižší hodnosti může být povýšen do vyššího úřadu podle [Concept('appointment_prominence','významnosti jmenování')|E] příslušného [Concept('title','titulu')|E].\n\nMezi $game_concept_ministers$ patří:\n$EFFECT_LIST_BULLET$[Concept('minister_grand_chancellor','$game_concept_minister_grand_chancellor$')|E]\n$EFFECT_LIST_BULLET$[Concept('minister_censor','$game_concept_minister_censor$')|E]\n$EFFECT_LIST_BULLET$[Concept('minister_grand_marshal','$game_concept_minister_grand_marshal$')|E]\n$EFFECT_LIST_BULLET$[Concept('minister_of_personnel','$game_concept_minister_of_personnel$')|E]\n$EFFECT_LIST_BULLET$[Concept('minister_of_war','$game_concept_minister_of_war$')|E]\n$EFFECT_LIST_BULLET$[Concept('minister_of_revenue','$game_concept_minister_of_revenue$')|E]\n$EFFECT_LIST_BULLET$[Concept('minister_of_justice','$game_concept_minister_of_justice$')|E]\n$EFFECT_LIST_BULLET$[Concept('minister_of_rites','$game_concept_minister_of_rites$')|E]\n$EFFECT_LIST_BULLET$[Concept('minister_of_works','$game_concept_minister_of_works$')|E]"
 game_concept_minister_grand_chancellor: "$councillor_chancellor_celestial_government_imperial$"
 game_concept_minister_grand_chancellor_desc: "$game_concept_minister_grand_chancellor$ je nejvýše postaveným [Concept('minister','ministrem')|E] a odpovídá za diplomatické záležitosti. Obvykle zastává také úřad [Concept('grand_secretariat_director','ředitele sekretariátu')|E].\n\nZda může být kancléř jmenován [Concept('grand_secretariat_director','ředitelem sekretariátu')|E], závisí na [Concept('law','zákonu')|E] #V [GetLawGroup('grand_secretariat_laws').GetName]#!.\n\n$minister_grand_chancellor_action_breakdown$"
 game_concept_minister_grand_chancellor_possessive: "$councillor_chancellor_celestial_government_imperial_possessive$"
 minister_grand_chancellor_action_breakdown: "#indent_newline:4 #weak Ministr může například:\n$BULLET$Využít [Concept('decision','rozhodnutí')|E] [GetDecision('favored_movement_consults_heaven_decision').GetName|V]\n$BULLET$Pozvat libovolný druh [Concept('courtier','dvořanů')|E] prostřednictvím [Concept('decision','rozhodnutí')|E] [GetDecision('tgp_minister_recruit_courtiers_decision').GetName|V]\n$BULLET$Získat přístup ke zvláštním možnostem [Concept('interaction','interakce')|E] #V $influence_meritorious_career_interaction$#! za sníženou cenu\n$BULLET$Zahájit [Concept('great_project','velký projekt')|E] [GetGreatProjectType('minister_compel_religious_uniformity').GetName|V]#!#!"
 game_concept_minister_censor: "$councillor_spymaster_celestial_government_imperial$"
 game_concept_minister_censor_desc: "$game_concept_minister_censor$ je [Concept('minister','ministr')|E], který odpovídá za intriky a zpravodajskou činnost.\n\nDej si pozor na neloajálního cenzora! Může totiž snadno utajovat [Concept('schemes','intriky')|E] namířené proti tobě a tvé [Concept('close_family','blízké rodině')|E], nebo se na nich dokonce sám podílet!\n\nZda může být cenzor jmenován [Concept('grand_secretariat_director','ředitelem sekretariátu')|E], závisí na [Concept('law','zákonu')|E] [GetLawGroup('grand_secretariat_laws').GetName|V].\n\n$minister_censor_action_breakdown$"
 game_concept_minister_censor_possessive: "$councillor_spymaster_celestial_government_imperial_possessive$"
 minister_censor_action_breakdown: "#indent_newline:4 #weak Ministr může například:\n$BULLET$Využít [Concept('interaction','interakci')|E] #V $censor_find_secrets_interaction$#! k odhalování [Concept('secrets','tajemství')|E] na [Concept('courts','dvorech')|E] [Concept('vassal','vazalů')|E]. Ta pak může využít k získání odměny v podobě [gold_i][Concept('gold','zlata')|E] od svého [Concept('liege','lenního pána')|E] nebo k získání [Concept('hooks','pák')|E]\n$BULLET$Pomocí [Concept('blackmail','vydírání')|E] vyvolat [Concept('dynastic_cycle_catalyst','katalyzátor dynastického cyklu')|E] #V „$catalyst_minister_blackmailed$“#!\n$BULLET$Získat přístup ke zvláštním možnostem [Concept('interaction','interakce')|E] #V $influence_meritorious_career_interaction$####!#!"
 game_concept_minister_grand_marshal: "$minister_grand_marshal$"
 game_concept_minister_grand_marshal_desc: "$game_concept_minister_grand_marshal$ je nejvýše postaveným vojenským velitelem v [Concept('realm','panství')|E] a velí [Concept('army','armádě')|E] složené z [Concept('title_men_at_arms','titulových ozbrojenců')|E].\n\nZda může být maršál jmenován [Concept('grand_secretariat_director','ředitelem sekretariátu')|E], závisí na [Concept('law','zákonu')|E] #V [GetLawGroup('grand_secretariat_laws').GetName]#!.\n\n$minister_grand_marshal_action_breakdown$"
 game_concept_minister_grand_marshal_possessive: "$minister_grand_marshal_possessive$"
 minister_grand_marshal_action_breakdown: "#indent_newline:4 #weak Ministr může například:\n$BULLET$Zahájit [Concept('great_project','velký projekt')|E] #V Velké tažení#!\n$BULLET$Zahájit [Concept('great_project','velký projekt')|E] [GetGreatProjectType('construct_great_barracks').GetName|V]\n$BULLET$Využívat [Concept('casus_bellis','casus belli')|E] #V $CHINA_SEIZE_COUNTY_CB_NAME$#! a #V $CHINA_SEIZE_DUCHY_CB_NAME$#! během [Concept('dynastic_cycle_eras_short','ér')|E] [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName] a [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability_conquest').GetName]\n$BULLET$Získat přístup ke zvláštním možnostem [Concept('interaction','interakce')|E] #V $influence_meritorious_career_interaction$####!#!"
 game_concept_minister_of_personnel: "$minister_personnel$"
 game_concept_minister_of_personnel_desc: "$game_concept_minister_of_personnel$ je [Concept('minister','ministr')|E] odpovědný za veškeré záležitosti související se [Concept('appointments','jmenováním')|E]. Může také výrazně ovlivňovat [Concept('candidate_score','skóre kandidáta')|E] ostatních [Concept('characters','postav')|E].\n\n$minister_of_personnel_action_breakdown$"
 game_concept_minister_of_personnel_possessive: "$minister_personnel_possessive$"
 minister_of_personnel_action_breakdown: "#indent_newline:4 #weak Ministr může například:\n$BULLET$Využít [Concept('interaction','interakci')|E] #V $force_governor_removal_interaction$#! k odvolání [Concept('governors','guvernérů')|E] bez ohledu na [Concept('law','zákon')|E] [GetLawGroup('celestial_retirement_law').GetName]\n$BULLET$Pozvat libovolný druh [Concept('courtier','dvořanů')|E] prostřednictvím [Concept('decision','rozhodnutí')|E] [GetDecision('tgp_minister_recruit_courtiers_decision').GetName|V]\n$BULLET$Vynutit přijetí [Concept('interactions','interakcí')|E] #V $offer_courtier_interaction$#! a #V $demand_courtier_interaction$#!\n$BULLET$Získat přístup ke zvláštním možnostem [Concept('interaction','interakce')|E] #V $influence_meritorious_career_interaction$#! za sníženou cenu#!#!"
 game_concept_minister_of_revenue: "$councillor_steward_celestial_government_imperial$"
 game_concept_minister_of_revenue_desc: "$game_concept_minister_of_revenue$ je [Concept('minister','ministr')|E] odpovědný za [Concept('taxation','zdanění')|E] a pomáhá [Concept('son_of_heaven','Synovi Nebes')|E] se správou [Concept('treasury','pokladnice')|E].\n\n$minister_of_revenue_action_breakdown$"
 game_concept_minister_of_revenue_possessive: "$councillor_steward_celestial_government_imperial_possessive$"
 minister_of_revenue_action_breakdown: "#indent_newline:4 #weak Ministr může například:\n$BULLET$Poskytovat pomoc [Concept('vassals','vazalům')|E], kteří mohou využít #V $celestial_request_treasury_interaction$#!\n$BULLET$Využít [Concept('decision','rozhodnutí')|E] [GetDecision('tgp_suggest_budget_change_decision').GetName|V]\n$BULLET$Zahájit [Concept('great_project','velký projekt')|E] [GetGreatProjectType('minister_project_conduct_census').GetName|V]\n$BULLET$Využít [Concept('interaction','interakci')|E] #V $pay_treasury_debt_interaction$#! k úhradě [Concept('treasury_debt','dluhu pokladnice')|E] [Concept('civilian_governors','civilních guvernérů')|E], čímž vyvolá [Concept('dynastic_cycle_catalyst','katalyzátor dynastického cyklu')|E] #V „$catalyst_cleared_treasury_debt$“#!\n$BULLET$Získat přístup ke zvláštním možnostem [Concept('interaction','interakce')|E] #V $influence_meritorious_career_interaction$####!#!"
 game_concept_minister_of_rites: "$councillor_court_chaplain_celestial_government_imperial$"
 game_concept_minister_of_rites_desc: "$game_concept_minister_of_rites$ je [Concept('minister','ministr')|E] odpovědný za náboženské a duchovní záležitosti. Může také pomáhat [Concept('governors','guvernérům')|E] s pořádáním [Concept('examinations','zkoušek')|E].\n\n$minister_of_rites_action_breakdown$"
 game_concept_minister_of_rites_possessive: "$councillor_court_chaplain_celestial_government_imperial_possessive$"
 minister_of_rites_action_breakdown: "#indent_newline:4 #weak Ministr může například:\n$BULLET$Zahájit [Concept('great_project','velký projekt')|E] [GetGreatProjectType('minister_project_culture').GetName|V]\n$BULLET$Zahájit [Concept('great_project','velký projekt')|E] [GetGreatProjectType('minister_compel_religious_uniformity').GetName|V]\n$BULLET$Pomáhat [Concept('vassals','vazalům')|E] s pořádáním [Concept('examinations','zkoušek')|E]\n$BULLET$Získat přístup ke zvláštním možnostem [Concept('interaction','interakce')|E] #V $influence_meritorious_career_interaction$#!\n$BULLET$Využít #V $demand_conversion_minister_rites_interaction$#! vůči [Concept('characters','postavám')|E] vyznávajícím [Concept('faiths','víry')|E] považované za [Concept('faith_hostile','nepřátelské')|E] nebo [Concept('faith_evil','zavrženíhodné')|E]#!#!"
 game_concept_minister_of_war: "$minister_war$"
 game_concept_minister_of_war_desc: "$game_concept_minister_of_war$ je [Concept('minister','ministr')|E] odpovědný za správu a organizaci vojsk. Pokud podřízení [Concept('governors','guvernéři')|E] potřebují vojenskou pomoc, může jim právě $game_concept_minister_of_war$ vyslat na podporu [Concept('military_governors','vojenské guvernéry')|E].\n\nSám ministr však není aktivním [Concept('commander','velitelem')|E] a nevelí vojskům v poli. Tato pravomoc náleží [Concept('minister_grand_marshal','velkému maršálovi')|E].\n\n$minister_of_war_action_breakdown$"
 game_concept_minister_of_war_possessive: "$minister_war_possessive$"
 minister_of_war_action_breakdown: "#indent_newline:4 #weak Ministr může například:\n$BULLET$Poskytovat vojenskou pomoc [Concept('vassals','vazalům')|E], kteří vedou [Concept('war','válku')|E] a mohou využít #V $celestial_request_military_aid_interaction$#!\n$BULLET$Nařídit [Concept('military_governors','vojenským guvernérům')|E], aby se připojili k [Concept('wars','válkám')|E] ostatních [Concept('governors','guvernérů')|E]\n$BULLET$Zahájit [Concept('great_project','velký projekt')|E] [GetGreatProjectType('minister_project_train_troops').GetName|V]\n$BULLET$Využít [Concept('interaction','interakci')|E] #V $pay_treasury_debt_interaction$#! k úhradě [Concept('treasury_debt','dluhu pokladnice')|E] [Concept('military_governors','vojenských guvernérů')|E], čímž vyvolá [Concept('dynastic_cycle_catalyst','katalyzátor dynastického cyklu')|E] #V „$catalyst_cleared_treasury_debt$“#!\n$BULLET$Získat přístup ke zvláštním možnostem [Concept('interaction','interakce')|E] #V $influence_meritorious_career_interaction$####!#!"
 game_concept_minister_of_justice: "$minister_justice$"
 game_concept_minister_of_justice_desc: "$game_concept_minister_of_justice$ je [Concept('minister','ministr')|E] odpovědný za právní záležitosti a pomáhá [Concept('son_of_heaven','Synovi Nebes')|E] prosazovat spravedlivou vládu.\n\n$minister_of_justice_action_breakdown$"
 game_concept_minister_of_justice_possessive: "$minister_justice_possessive$"
 minister_of_justice_action_breakdown: "#indent_newline:4 #weak Ministr může například:\n$BULLET$Zahájit [Concept('great_project','velký projekt')|E] [GetGreatProjectType('minister_project_establish_control').GetName|V]\n$BULLET$Využít [Concept('interaction','interakci')|E] #V $imprison_interaction$#! vůči [Concept('vassals','vazalům')|E] a [Concept('courtiers','dvořanům')|E], kteří ji nemohou odmítnout\n$BULLET$Využít [Concept('interaction','interakci')|E] #V $pardon_interaction$#! k udělení milosti [Concept('characters','postavám')|E], které spáchaly [Concept('crimes','zločiny')|E]\n$BULLET$Využít [Concept('interaction','interakci')|E] $censor_find_secrets_interaction$ k odhalení [Concept('secrets','tajemství')|E] na [Concept('courts','dvorech')|E] [Concept('vassal','vazalů')|E] a následně [Concept('imprison','uvěznit')|E] známé [Concept('criminals','zločince')|E] nebo jim udělit milost\n$BULLET$Odhalováním [Concept('secrets','tajemství')|E] vyvolat [Concept('dynastic_cycle_catalyst','katalyzátor dynastického cyklu')|E] $catalyst_minister_exposed_secret$\n$BULLET$Získat přístup ke zvláštním možnostem [Concept('interaction','interakce')|E] #V $influence_meritorious_career_interaction$####!#!"
 game_concept_minister_of_works: "$minister_works$"
 game_concept_minister_of_works_desc: "$game_concept_minister_of_works$ je [Concept('minister','ministr')|E] odpovědný za výstavbu a rozvoj v celém [Concept('realm','panství')|E]. Může také zahajovat [Concept('great_projects','velké projekty')|E].\n\n$minister_of_works_action_breakdown$"
 game_concept_minister_of_works_possessive: "$minister_works_possessive$"
 minister_of_works_action_breakdown: "#indent_newline:4 #weak Ministr může například:\n$BULLET$Zahájit [Concept('great_project','velký projekt')|E] [GetGreatProjectType('minister_project_development').GetName|V]\n$BULLET$Zahájit [Concept('great_project','velký projekt')|E] [GetGreatProjectType('grand_canals').GetName|V]\n$BULLET$Zahájit [Concept('great_project','velký projekt')|E] [GetGreatProjectType('great_wall').GetName|V]\n$BULLET$Stavět [Concept('buildings','budovy')|E] a zakládat [Concept('holdings','državy')|E] v rámci [Concept('realm','panství')|E]\n$BULLET$Stavět [Concept('buildings','budovy')|E] a zakládat [Concept('holdings','državy')|E] na území [Concept('tributaries','tributářů')|E] [Concept('son_of_heaven','Syna Nebes')|E] během [Concept('dynastic_cycle_era_short','éry')|E] [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName]\n$BULLET$Získat přístup ke zvláštním možnostem [Concept('interaction','interakce')|E] #V $influence_meritorious_career_interaction$####!#!"
 game_concept_grand_secretariat_director: "Ředitel sekretariátu"
 game_concept_grand_secretariat: "Velký sekretariát"
 game_concept_grand_secretariat_system: "Systém Velkého sekretariátu"
 game_concept_grand_secretariat_possessive: "Velkého sekretariátu"
 game_concept_grand_secretariat_director_desc: "$game_concept_grand_secretariat_director$ je druhem [Concept('diarch','diarchy')|E], který pomáhá [Concept('son_of_heaven','Synovi Nebes')|E] spravovat [Concept('realm','panství')|E].\n\nKdo tento úřad zastává, závisí na platném [Concept('law','zákonu')|E] [GetLawGroup('grand_secretariat_laws').GetName|V]. Může jím být [Concept('minister_grand_chancellor','velký kancléř')|E], [Concept('minister_grand_marshal','velký maršál')|E] nebo [Concept('minister_censor','cenzor')|E].\n\nŘeditel může zahajovat většinu [Concept('great_projects','velkých projektů')|E], které jsou jinak dostupné pouze některým [Concept('ministers','ministrům')|E] a Synovi Nebes."
 game_concept_ministry_obligation: "Povinnost ministerstva"
 game_concept_ministry_obligations: "Povinnosti ministerstva"
 game_concept_ministry_obligations_desc: "$game_concept_ministry_obligations$ představují zvláštní soubor [Concept('vassal_obligations','vazalských povinností')|E], který je dostupný pouze [Concept('ministers','ministrům')|E].\n\nVšichni civilní ministři mají ve výchozím nastavení svou vlastní sadu povinností, zatímco [Concept('minister_grand_marshal','velký maršál')|E] má jedinečnou možnost, která mu poskytuje [Concept('title_men_at_arms','titulové ozbrojence')|E].\n\nTyto povinnosti nelze měnit."
 game_concept_civilian_career_path: "Civilní kariérní dráha"
 game_concept_civilian_career_path_i: "@celestial_standard_administration!"
 game_concept_civilian_career_path_desc: "[Concept('rulers','Vládci')|EU], kteří se vydají civilní kariérní dráhou, upřednostňují správní schopnosti před válečnickou obratností. Jsou jmenováni do civilních správních obvodů a jejich [Concept('merit','zásluhy')|E] rostou podle toho, jak úspěšně rozvíjejí svěřená území výstavbou [Concept('buildings','budov')|E] a zvyšováním [Concept('taxes','daní')|E] odváděných svému [Concept('liege','lennímu pánovi')|E]."
 game_concept_civilian_career: "Civilní kariéra"
 game_concept_civilian_career_short: "Civilní"
 game_concept_military_career_path: "Vojenská kariérní dráha"
 game_concept_military_career_path_i: "@celestial_military_administration!"
 game_concept_military_career_path_desc: "[Concept('rulers','Vládci')|EU], kteří se vydají vojenskou kariérní dráhou, upřednostňují válečnické schopnosti před správními povinnostmi. Jsou jmenováni do vojenských správních obvodů a jejich [Concept('merit','zásluhy')|E] rostou podle toho, jak úspěšně verbují a udržují [Concept('title_men_at_arms','titulové ozbrojence')|E]."
 game_concept_military_career: "Vojenská kariéra"
 game_concept_military_career_short: "Vojenská"
 game_concept_civilian_governor: "Civilní guvernér"
 game_concept_civilian_governors: "Civilní guvernéři"
 game_concept_civilian_governor_short: "Civilní"
 game_concept_civilian_governor_desc: "Civilní guvernér je [Concept('governor','guvernér')|E] s civilními [Concept('vassal_obligations','vazalskými povinnostmi')|E]. Na rozdíl od [Concept('military_governors','vojenských guvernérů')|E] nemůže povolávat [Concept('title_men_at_arms','titulové ozbrojence')|E] a soustředí se výhradně na správní povinnosti a rozvoj svěřených území.\n\n[Concept('characters','Postavy')|EU], které se vydají [Concept('civilian_career_path','civilní kariérní dráhou')|E], se mohou stát civilními guvernéry."
 game_concept_military_governor: "Vojenský guvernér"
 game_concept_military_governors: "Vojenští guvernéři"
 game_concept_military_governor_short: "Vojenský"
 game_concept_military_governor_desc: "Vojenský guvernér je [Concept('governor','guvernér')|E] s vojenskými [Concept('vassal_obligations','vazalskými povinnostmi')|E]. Na rozdíl od [Concept('civilian_governors','civilních guvernérů')|E] může povolávat [Concept('title_men_at_arms','titulové ozbrojence')|E], které využívá k obraně [Concept('realm','panství')|E] před cizími vpády a k podpoře ostatních guvernérů, kteří potřebují vojenskou pomoc.\n\n[Concept('characters','Postavy')|EU], které se vydají [Concept('military_career_path','vojenskou kariérní dráhou')|E], se mohou stát vojenskými guvernéry."
 game_concept_great_project: "Velký projekt"
 game_concept_great_projects: "Velké projekty"
 game_concept_great_project_i: "@great_project_icon!"
 game_concept_great_project_possessive: "Velkého projektu"
 game_concept_great_project_desc: "Velké projekty jsou rozsáhlé podniky, které vyžadují zapojení všech dostupných prostředků [Concept('realm','panství')|E].\n\nNěkteré velké projekty zahrnují výstavbu [Concept('great_building','velkolepé budovy')|E], zatímco jiné se zaměřují na obnovu země po [Concept('natural_disaster','přírodní pohromě')|E].\n\nZatímco [Concept('ruler','vládce')|E] panství dohlíží na uskutečňování velkého projektu, [Concept('subjects','podřízení')|E] mohou jeho průběh podpořit prostřednictvím [Concept('great_project_contributions','příspěvků')|E]."
 game_concept_great_project_contribution: "Příspěvek"
 game_concept_great_project_contributions: "Příspěvky"
 game_concept_great_project_contribute: "Přispět"
 game_concept_great_project_contributed: "Přispěno"
 game_concept_great_project_contribution_desc: "Příspěvky umožňují více [Concept('rulers','vládcům')|E] podílet se na uskutečňování [Concept('great_project','velkého projektu')|E] a získávat za svou pomoc různé výhody.\n\nNěkteré příspěvky jsou povinné a bez jejich poskytnutí nelze zahájit postup projektu, zatímco jiné jsou dobrovolné. Zbývající dobrovolné příspěvky lze poskytovat i po zahájení projektu, avšak pouze do určité fáze jeho uskutečňování."
 game_concept_great_project_contributor: "Přispěvatel"
 game_concept_great_project_contributors: "Přispěvatelé"
 game_concept_great_project_contributor_possessive: "Přispěvatele"
 game_concept_great_project_contributors_possessive: "Přispěvatelů"
 game_concept_great_project_contributor_desc: "Přispěvateli jsou [Concept('rulers','vládci')|E], kteří se zavázali poskytnout alespoň jeden [Concept('great_project_contribution','příspěvek')|E] na [Concept('great_project','velký projekt')|E]. Za svou účast získávají různé výhody.\n\nU většiny [Concept('great_project_contributions','příspěvků')|E] se může [Concept('great_project_contributor','přispěvatelem')|E] stát kterýkoli [Concept('subject','podřízený subjekt')|E] v rámci [Concept('realm','panství')|E]."
 game_concept_dynastic_cycle: "Dynastický cyklus"
 game_concept_dynastic_cycle_possessive: "Dynastického cyklu"
 game_concept_dynastic_cycle_desc: "$game_concept_dynastic_cycle$ znázorňuje společensko-politický stav Velké čínské říše, která postupně prochází [Concept('situation_dynastic_cycle_phases','érami dynastického cyklu')|E] stability, nestability a chaosu.\n\nKlíčovou součástí $game_concept_dynastic_cycle$ je [Concept('mandate_of_heaven','Mandát Nebes')|E], zvláštní forma [Concept('legitimacy','legitimity')|E], kterou disponuje císař. Pokud o něj někdy přijde, Velká čínská říše se #N rozpadne#! a zůstane roztříštěná, dokud ji znovu nesjednotí někdo, kdo je hoden stát se Synem Nebes.#!"
 game_concept_situation_dynastic_cycle_phase: "Éra dynastického cyklu"
 game_concept_situation_dynastic_cycle_phases: "Éry dynastického cyklu"
 game_concept_dynastic_cycle_era_short: "Éra"
 game_concept_dynastic_cycle_eras_short: "Éry"
 game_concept_situation_dynastic_cycle_phase_desc: "Společensko-politický stav [Concept('dynastic_cycle','dynastického cyklu')|E].\n\nJednotlivé éry:\n$BULLET$[Concept('dynastic_cycle_era_type_stable','Stabilní')|EU]: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName], [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName]\n$BULLET$[Concept('dynastic_cycle_era_type_unstable','Nestabilní')|EU]: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName]\n$BULLET$[Concept('dynastic_cycle_era_type_chaotic','Chaotická')|EU]: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_chaos').GetName]"
 game_concept_dynastic_cycle_era_type_stable: "Stabilní éra"
 game_concept_dynastic_cycle_era_type_stable_desc: "Stabilní [Concept('dynastic_cycle_era_types','typy ér')|E] představují období největšího rozkvětu a úspěchů říše, kdy je [Concept('mandate_of_heaven','Mandát Nebes')|E] silný.\n\nÉry: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName], [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName]"
 game_concept_dynastic_cycle_era_type_unstable: "Nestabilní éra"
 game_concept_dynastic_cycle_era_type_unstable_desc: "Nestabilní [Concept('dynastic_cycle_era_types','typy ér')|E] představují období, kdy říší otřásají vnitřní nebo vnější nepokoje a [Concept('mandate_of_heaven','Mandát Nebes')|E] slábne.\n\nÉry: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName], [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability_conquest').GetName]"
 game_concept_dynastic_cycle_era_type_chaotic: "Chaotická éra"
 game_concept_dynastic_cycle_era_type_chaotic_desc: "Chaotické [Concept('dynastic_cycle_era_types','typy ér')|E] představují období, kdy je říše rozvrácena a [Concept('mandate_of_heaven','Mandát Nebes')|E] ztracen. Ti, kdo prokážou svou způsobilost, jej však mohou znovu získat.\n\nExistuje pouze jediná chaotická éra: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_chaos').GetName]"
 game_concept_dynastic_cycle_era_type: "Typ éry dynastického cyklu"
 game_concept_dynastic_cycle_era_types: "Typy ér"
 game_concept_dynastic_cycle_era_type_desc: "V rámci [Concept('dynastic_cycle','dynastického cyklu')|E] existují tři typy ér. Ty rozdělují [Concept('situation_dynastic_cycle_phases','éry dynastického cyklu')|E] do tří opakujících se období, která tvoří samotnou podstatu dynastického cyklu.\n\nTypy ér: [Concept('dynastic_cycle_era_type_stable','stabilní éra')|E], [Concept('dynastic_cycle_era_type_unstable','nestabilní éra')|E], [Concept('dynastic_cycle_era_type_chaotic','chaotická éra')|E]"
 game_concept_dynastic_cycle_catalyst: "Katalyzátor dynastického cyklu"
 game_concept_dynastic_cycle_catalysts: "Katalyzátory dynastického cyklu"
 game_concept_dynastic_cycle_catalyst_possessive: "Katalyzátoru dynastického cyklu"
 game_concept_dynastic_cycle_catalysts_possessive: "Katalyzátorů dynastického cyklu"
 game_concept_dynastic_cycle_catalyst_desc: "$game_concept_situation_catalyst_desc$"
 game_concept_movement: "Hnutí"
 game_concept_movements: "Hnutí"
 game_concept_movement_possessive: "Hnutí"
 game_concept_movements_possessive: "Hnutí"
 game_concept_movement_desc: "Skupina [Concept('characters','postav')|E], které spojují společné zájmy a představy o směřování [Concept('dynastic_cycle','dynastického cyklu')|E]. Jednotliví členové hnutí mohou využívat různé [Concept('interactions','interakce')|E] a [Concept('decisions','rozhodnutí')|E], aby ovlivnili jeho průběh. [Concept('movement_leader','Vůdce hnutí')|EU] vystupuje jako mluvčí, který hájí zájmy [Concept('movement_possessive','hnutí')|E] před [Concept('son_of_heaven','Synem Nebes')|E]."
 game_concept_movement_power: "Síla hnutí"
 game_concept_movement_power_i: "@movement_power_icon!"
 game_concept_movement_power_desc: "Síla hnutí představuje politický vliv skupiny zapojené do [Concept('dynastic_cycle','dynastického cyklu')|E]. Je tvořena součtem [Concept('personal_movement_power','osobní síly hnutí')|E] všech členů skupiny.\n\nHodnota #V [Concept('movement_power_i','@movement_power_icon!')|E][EmptyScope.ScriptValue('extremely_high_movement_power_value')]#! zpřístupňuje [Concept('interaction','interakci')|E] $dismiss_strong_hook_interaction$, [Concept('interaction','interakci')|E] $request_raid_remit_interaction$ a [Concept('scheme','intriku')|E] [GetScheme('raid_estate').GetTypeName].\n\n#help Síla se odvíjí od následujících faktorů:\n$BULLET_WITH_TAB$[merit_i][Concept('merit_level','Hodnost zásluh')|EU]\n$BULLET_WITH_TAB$[influence_i][Concept('influence_level','Úroveň vlivu')|EU]\n$BULLET_WITH_TAB$Věk\n$BULLET_WITH_TAB$[Concept('movement_power','Síla hnutí')|EU] [Concept('disciples','učedníků')|E]\n$BULLET_WITH_TAB$Současná vojenská síla #weak (méně důležitá během éry [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName])#!\n$BULLET_WITH_TAB$[Concept('trait_level_track_xp','Zkušenosti rysu')|EU] [GetTrait('confucian_education').GetName( GetNullCharacter )] #weak (méně důležité během éry [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName])#!\n$BULLET_WITH_TAB$[Concept('trait_level_track_xp','Zkušenosti rysu')|EU] [GetTrait('governor').GetName( GetNullCharacter )] #weak (méně důležité během éry [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName])#!#!"
 game_concept_movement_power_short: "Síla"
 game_concept_personal_movement_power: "Osobní síla hnutí"
 game_concept_personal_movement_power_desc: "$game_concept_personal_movement_power$ vyjadřuje, jakou měrou jednotlivý člen přispívá k celkové [Concept('movement_power_short','síle')|E] svého [Concept('movement','hnutí')|E]."
 game_concept_personal_movement_power_short: "Síla"
 game_concept_movement_leader: "Vůdce hnutí"
 game_concept_movement_leader_possessive: "Vůdce hnutí"
 game_concept_movement_leaders: "Vůdci hnutí"
 game_concept_movement_leaders_possessive: "Vůdců hnutí"
 game_concept_movement_leader_short: "Vůdce"
 game_concept_movement_leader_desc: "Postava stojící v čele [Concept('movement','hnutí')|E], která jako jediný jeho člen smí přímo jednat se [Concept('son_of_heaven','Synem Nebes')|E] a prosazovat zájmy [Concept('movements','hnutí')|E] prostřednictvím [Concept('decision','rozhodnutí')|E] [GetDecision('movement_petition_decision').GetName].\n\n#help Vůdcem se můžeš stát, pokud máš v okamžiku smrti předchozího vůdce nejvyšší [Concept('movement_power','sílu hnutí')|E] [movement_power_i], nebo pokud současného vůdce porazíš během [Concept('activity','aktivity')|E] [GetActivityType('activity_debate').GetName].#!"
 game_concept_favored_era: "Upřednostněná éra"
 game_concept_favored_era_possessive: "Upřednostněné éry"
 game_concept_favored_era_desc: "$game_concept_favored_era$ vyjadřuje vůli Nebes, kterou [Concept('son_of_heaven','Syn Nebes')|E] projevuje ohledně dalšího průběhu [Concept('dynastic_cycle','dynastického cyklu')|E]. Určuje, která [Concept('dynastic_cycle_era_type_stable','stabilní éra')|E] nastane po skončení [Concept('dynastic_cycle_era_type_unstable','nestabilní éry')|E]."
 game_concept_favored_movement: "Upřednostněné hnutí"
 game_concept_favored_movement_desc: "$game_concept_favored_movement$ je [Concept('movement','hnutí')|E], které získalo podporu [Concept('son_of_heaven','Syna Nebes')|E].\n$BULLET_WITH_TAB$Jeho členové mají vyšší [Concept('candidate_scores','skóre kandidátů')|E] při ucházení se o [Concept('titles','tituly')|E] v říši [SelectLocalization( GetPlayer.IsValid, 'game_concept_favored_movement_desc_ingame', 'h_china' )]\n$BULLET_WITH_TAB$[Concept('decision','Rozhodnutí')|EU] [GetDecision('movement_petition_decision').GetName] má vyšší šanci na přijetí žádosti\n$BULLET_WITH_TAB$[Concept('situation_catalyst_catalysts','Katalyzátory')|EU] [Concept('dynastic_cycle_possessive','dynastického cyklu')|E] se spouštějí podle toho, které [Concept('movement','hnutí')|E] je upřednostňováno\n$BULLET_WITH_TAB$Získává přístup k [Concept('decision','rozhodnutí')|E] [GetDecision('favored_movement_consults_heaven_decision').GetName]\n\n#help Aby se tvé hnutí stalo upřednostněným, musíš během [Concept('activity','aktivity')|E] [GetActivityType('activity_debate').GetName] porazit vůdce současného upřednostněného hnutí.#!"
 game_concept_favored_movement_desc_ingame: "[GetTitleByKey('h_china').GetDefinitiveName]"
 game_concept_favored_movement_possessive: "Upřednostněného hnutí"
 game_concept_favored_movement_short: "Upřednostněné"
 game_concept_disciple: "Učedník"
 game_concept_disciples: "Učedníci"
 game_concept_disciple_possessive: "Učedníka"
 game_concept_disciples_possessive: "Učedníků"
 game_concept_disciple_desc: "$game_concept_disciples$ jsou [Concept('characters','postavy')|E], které uznávají vysoké postavení [Concept('elder','staršího')|E] a následují jeho učení. Jejich počet omezuje [Concept('disciple_limit_short','limit')|E].\n\nMohou využívat [Concept('character_interaction','interakci s postavou')|E] #high $request_mentoring_interaction$#! #weak (intrika)#! ke zlepšování svých [Concept('skills','dovedností')|E] a [Concept('character_interaction','interakci s postavou')|E] #high $celestial_request_elders_support_interaction$#! k získání [Concept('gold','zlata')|E], [Concept('courtiers','dvořanů')|E] a dalších výhod.\n\n$disciple_elder_benefits_tt$"
 disciple_elder_benefits_tt: "$game_concept_disciple$ a [Concept('elder','starší')|E]:\n$BULLET_WITH_TAB$Získávají více [Concept('merit','zásluh')|E]\n$BULLET_WITH_TAB$S menší pravděpodobností proti sobě používají [Concept('hostile_schemes','nepřátelské intriky')|E]\n$BULLET_WITH_TAB$S větší pravděpodobností přijímají [Concept('interactions','interakce')|E] od toho druhého\n$BULLET_WITH_TAB$Častěji vůči sobě využívají přátelské [Concept('interactions','interakce')|E] #weak (například $gift_interaction$, $invite_to_council_position_interaction$ a další)#!\n$BULLET_WITH_TAB$Oba budou patřit ke stejnému [Concept('movement','hnutí')|E], které vede $game_concept_elder_possessive$"
 game_concept_disciple_limit: "Limit učedníků"
 game_concept_disciple_limit_short: "Limit"
 game_concept_disciple_limit_desc: "$game_concept_disciple_limit$ určuje, kolik [Concept('disciples','učedníků')|E] může mít jeden [Concept('elder','starší')|E] současně.\n\nVýchozí limit činí [EmptyScope.ScriptValue('disciples_limit_base_value')|V0]. Zvýšit jej lze například vylepšením [Concept('domicile','domicilu')|E] pomocí určitých [Concept('domicile_buildings','budov domicilu')|E]."
 game_concept_elder: "Starší"
 game_concept_elders: "Starší"
 game_concept_elder_possessive: "Staršího"
 game_concept_elders_possessive: "Starších"
 game_concept_elder_desc: "$game_concept_elder$ je [Concept('character','postava')|E], která má jednoho nebo více [Concept('disciples','učedníků')|E], kteří následují učení $game_concept_elders_possessive$.\n\n$disciple_elder_benefits_tt$"
 game_concept_disaster: "Pohroma"
 game_concept_disasters: "Pohromy"
 game_concept_natural_disaster: "Přírodní pohroma"
 game_concept_natural_disasters: "Přírodní pohromy"
 game_concept_disaster_desc: "Mezi $game_concept_natural_disasters$ patří [Concept('floods','povodně')|E] a [Concept('earthquakes','zemětřesení')|E].\n\n$game_concept_natural_disaster$ způsobí [Concept('character_death_death','smrt')|E] mnoha [Concept('characters','postav')|E] v zasažených [Concept('counties','hrabstvích')|E]. Podle své závažnosti také výrazně poškodí [Concept('development','rozvoj')|E], [Concept('county_opinion','lidové mínění')|E] a [Concept('control','kontrolu')|E] v těchto oblastech.\n\nZkázu způsobenou $game_concept_natural_disaster$ lze napravit a postižená území obnovit dokončením [Concept('great_project','velkého projektu')|E] zaměřeného na pomoc obětem pohromy."
 game_concept_earthquake: "Zemětřesení"
 game_concept_earthquakes: "Zemětřesení"
 game_concept_earthquake_desc: "$game_concept_earthquake$ je druh [Concept('natural_disaster','přírodní pohromy')|E], která způsobuje náhlé a ničivé škody v menším počtu [Concept('counties','hrabství')|E].\n\n$game_concept_earthquakes$ se mohou vyskytovat pouze v oblastech náchylnějších k seismické aktivitě."
 game_concept_flood: "Povodeň"
 game_concept_floods: "Povodně"
 game_concept_flooded: "Zaplaveno"
 game_concept_flood_desc: "$game_concept_flood$ je [Concept('natural_disaster','přírodní pohroma')|E], která postupně způsobuje stále větší škody v rozsáhlém počtu [Concept('counties','hrabství')|E].\n\n$game_concept_floods$ se mohou vyskytovat pouze podél velkých řek."
 game_concept_government_bureaucratic_type: "Byrokratická"
 game_concept_government_bureaucratic_type_desc: "Některé [Concept('governments','vlády')|E] jsou typu $game_concept_government_bureaucratic_type$. Vyznačují se vysokou mírou centralizace a při správě [Concept('provinces','provincií')|E] v rámci [Concept('realm','panství')|E] se zpravidla opírají o [Concept('governors','guvernéry')|E], systém [Concept('appointment','jmenování')|E] a bezzemkové [Concept('noble_families','šlechtické rodiny')|E].\n\nMezi další společné charakteristiky patří [Concept('domiciles','domicily')|E], [Concept('influence','vliv')|E] a [Concept('title_men_at_arms','tituloví ozbrojenci')|E].\n\nExistuje několik druhů [Concept('governments','vlád')|E] typu $game_concept_government_bureaucratic_type$:\n$BULLET_WITH_TAB$[GetGovernment('administrative_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('celestial_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('meritocratic_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('japan_administrative_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('steppe_admin_government').GetNameWithIcon]"
 game_concept_government_bureaucratic_gov: "Byrokratická vláda"
