l_polish:
 FOUR_WAYS_GLOSS: "Pro posouzení způsobilosti člověka existuje mnoho přísných metod. Čtyři nejvýznamnější se zaměřují na vzhled, výmluvnost, kaligrafii a úsudek."
 CUJU_GLOSS: "Cchu-ťü je soutěžní míčová hra, jejíž kořeny sahají do období dynastie Chan. Od té doby se provozuje pro zábavu i udržování tělesné kondice. Při společenských událostech na císařském dvoře se jí účastnila družstva až o 20 hráčích. Hra spočívá především v prokopávání míče mezi vysokými brankovými tyčemi, aniž by se míč dotkl země."
 CONFUCIUS_GLOSS: "Konfucius neboli mistr Kchung byl filozof, který založil nauku vycházející z lidskosti a mravního jednání. „Cesta“, jak ji popsal ve svých Hovorech, se stala základem představ o správě státu a vládnutí jeho obyvatelům."
 BIAN_QUE_GLOSS: "Pien Čchüe bylo jméno několika legendárních čínských lékařů. Nesl je jak lékař z období Válčících států (475–221 př. n. l.), tak jeho mnohem dávnější jmenovec z dob Žlutého císaře."
 MERIT_LOWER_LOWER_GLOSS: "[GetModifier('merit_level_1').GetNameWithTooltip|U] představuje [Concept('merit_level','hodnost zásluh')|E] v úřednické hierarchii, kterou používá [GetTitleByKey('h_china').GetDefinitiveName]. Tato hodnost je známá také jako „nižší z nižších“ (下下)."
