l_polish:
 replace_ceremonial_regent_faction_name: "Nový $game_concept_ceremonial_regent$"
 replace_ceremonial_regent_faction: "Frakce „$replace_ceremonial_regent_faction_name$“"
 replace_ceremonial_regent_faction_desc: "Členové [Concept('faction','frakce')|E] „$replace_ceremonial_regent_faction_name$“ usilují o násilné sesazení současného [Concept('ceremonial_regent','vládnoucího regenta')|E].\n\n#S Ultimátum#!\n$replace_ceremonial_regent_faction_desc_kampaku$"
 replace_ceremonial_regent_faction_desc_emperor: "Vůdce frakce nahradí současného [Concept('ceremonial_regent','vládnoucího regenta')|E], převezme všechny jeho [Concept('landed','zeměpanské')|E] [Concept('titles','tituly')|E] a může se stát [Concept('cloistered_emperor','císařem v ústraní')|E] nebo se pokusit obnovit přímou císařskou vládu"
 replace_ceremonial_regent_faction_desc_kampaku: "Vůdce frakce nahradí současného [Concept('ceremonial_regent','vládnoucího regenta')|E] a převezme všechny jeho [Concept('landed','zeměpanské')|E] [Concept('titles','tituly')|E]"
 replace_ceremonial_regent_faction_short_effect_desc_emperor: "Chce se stát [Concept('cloistered_emperor','císařem v ústraní')|E]"
 replace_ceremonial_regent_faction_short_effect_desc_regent: "Chce se stát [Concept('ceremonial_regent','vládnoucím regentem')|E]"
 FACTION_JAPANESE_REPLACE_REGENT_NAME_DYNAMIC: "Dosadit [ROOT.Faction.GetSpecialCharacter.Custom('CZ_ShortUINameNotMe_A')] jako $game_concept_ceremonial_regent$"
 FACTION_JAPANESE_REPLACE_REGENT: "Požadavky frakce „$replace_ceremonial_regent_faction_name$“"
 FACTION_JAPANESE_REPLACE_REGENT_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nVěrní šlechtici [faction_target.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_G')] už nemají důvěru v tvé nesnesitelné regentství! Předej mi moc, jinak se střetneme na bitevním poli!"
 FACTION_JAPANESE_REPLACE_RULER_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nVěrní šlechtici [faction_target.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_G')] už nemají důvěru v tvou svévolnou tyranskou vládu! Předej mi své pravomoci, jinak se střetneme na bitevním poli!"
 FACTION_JAPANESE_REPLACE_REGENT_ACCEPTED: "Požadavky frakce „$replace_ceremonial_regent_faction_name$“ přijaty"
 FACTION_JAPANESE_REPLACE_REGENT_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nTvé drzé a nestoudné pokusy uchvátit moc přinesou [faction_target.GetPrimaryTitle.Custom('CZ_LandedName_D')] jen oslabení. Abych však předešel zbytečnému krveprolití, přijímám tvé požadavky..."
 FACTION_JAPANESE_REPLACE_REGENT_REFUSED: "Požadavky frakce „$replace_ceremonial_regent_faction_name$“ odmítnuty"
 FACTION_JAPANESE_REPLACE_REGENT_REFUSED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nTvůj směšný pokus o zastrašování nikdy neuspěje. Jsem [Select_CString(faction_target.IsFemale,'právoplatnou','právoplatným')] [faction_target.Custom('CZ_TitleAsNameNoTooltip_I')] [faction_target.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_G')]! Všichni zrádci budou pohnáni před spravedlnost, třeba i na bitevním poli!"
 FACTION_JAPANESE_REPLACE_REGENT_SEND_DEMAND_NOTIFICATION: "Regent musí padnout!"
 FACTION_JAPANESE_REPLACE_REGENT_SEND_DEMAND_NOTIFICATION_DESC: "Nadešel čas! Páni sdružení ve frakci [faction.GetName] se shodují, že [faction_target.GetName] vládne tyransky a musí se vzdát moci, třeba i pod hrozbou mečů!"
 cannot_create_claimant_faction_against_kampaku_tooltip: "[Concept('factions','Frakce')|EU] [Concept('claimant','pretendentů')|E] nelze zakládat proti [Concept('ceremonial_regent','vládnoucímu regentovi')|E]"
 FACTIONS_WINDOW_JAPANESE_REGENT: "Vyzývatel"
 replace_ceremonial_regent_faction_kampaku_trigger: "Nahradit lze pouze [Concept('kampaku','kampakua')|E] nebo [Concept('joko','džókóa')|E]"
 not_house_head_allied_to_faction_target_trigger: "Nesmíš být členem rodu, do kterého patří cíl [Concept('faction','frakce')|E]"
 not_house_member_of_faction_target_trigger: "Tvá [Concept('house_head','hlava rodu')|E] nesmí mít [Concept('alliance','alianci')|E] s cílem [Concept('faction','frakce')|E]"
 must_be_leading_house_of_bloc_trigger: "Ve [Concept('governments','vládách')|E] s [Concept('house_blocs','rodovými bloky')|E] mohou zakládat [Concept('factions','frakce')|E] proti [Concept('top_liege','nejvyššímu lennímu pánovi')|E] pouze [Concept('house_heads','hlavy rodů')|E] z [Concept('leading_house','vůdčího rodu')|E] daného $game_concept_bloc_possessive$"
 restore_ceremonial_liege_faction_name: "Ať znovu vládne $game_concept_ceremonial_liege$"
 restore_ceremonial_liege_faction: "Frakce „$restore_ceremonial_liege_faction_name$“"
 restore_ceremonial_liege_faction_desc: "Členové [Concept('faction','frakce')|E] „$restore_ceremonial_liege_faction_name$“ usilují o sesazení [Concept('ceremonial_regent','vládnoucího regenta')|E] a obnovení přímé vlády [Concept('ceremonial_liege','obřadního panovníka')|E].\n\n#S Ultimátum#!\n[Concept('ceremonial_liege','Obřadní panovník')|EU] nahradí [Concept('ceremonial_regent','vládnoucího regenta')|E], převezme všechny jeho [Concept('landed','zeměpanské')|E] [Concept('titles','tituly')|E] a zavede [Concept('succession','nástupnictví')|E] podle zákona $single_heir_succession_law$"
 restore_ceremonial_liege_faction_short_effect_desc: "Chce obnovit vládu [Concept('ceremonial_liege','obřadního panovníka')|E]"
 FACTION_JAPANESE_RESTORE_EMPEROR_NAME_DYNAMIC: "Vrátit na trůn [ROOT.Faction.GetSpecialCharacter.Custom('CZ_ShortUINameNotMe_A')]"
 FACTION_JAPANESE_RESTORE_EMPEROR: "Požadavky frakce „$restore_ceremonial_liege_faction_name$“"
 FACTION_JAPANESE_RESTORE_EMPEROR_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nTvá tyranská nadvláda nad [ROOT.Char.Custom('GetTitleTierAdjective')|l] dvorem, panovnickou rodinou i celým územím [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_G')] musí skončit.\n\nUstup! [faction.GetSpecialCharacter.GetTitledFirstName|U] má právo znovu vládnout!"
 tgp_faction_events.0201.b: "Za pošpinění cti [faction.GetSpecialCharacter.Custom('CZ_TitleAsNameNoTooltip_G')] zaplatíš!"
 tgp_faction_events.0201.b.cm: "To chceš riskovat, že se [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] rozpadne?!"
 FACTION_JAPANESE_RESTORE_EMPEROR_ACCEPTED: "Požadavky frakce „$restore_ceremonial_liege_faction_name$“ přijaty"
 FACTION_JAPANESE_RESTORE_EMPEROR_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nNa srdci mi leží pouze blaho [ROOT.Char.Custom('GetTitleTierAdjective')|l] dvora, panovnické rodiny i všech obyvatel [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_G')]!\n\nAčkoli pochybuji o tvých pohnutkách, nebudu bránit [faction.GetSpecialCharacter.Custom('CZ_TitledFirstName_D')] v návratu na trůn."
 FACTION_JAPANESE_RESTORE_EMPEROR_REFUSED: "Požadavky frakce „$restore_ceremonial_liege_faction_name$“ odmítnuty"
 FACTION_JAPANESE_RESTORE_EMPEROR_REFUSED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nTaková drzost! Na srdci mi leží pouze blaho [ROOT.Char.Custom('GetTitleTierAdjective')|l] dvora, panovnické rodiny i všech obyvatel [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_G')]!\n\nTy i tvá banda zrádců zaplatíte za pošpinění cti [faction.GetSpecialCharacter.Custom('CZ_TitleAsNameNoTooltip_G')]!"
 FACTION_JAPANESE_RESTORE_EMPEROR_SEND_DEMAND_NOTIFICATION: "$restore_ceremonial_liege_faction_name$ "
 FACTION_JAPANESE_RESTORE_EMPEROR_SEND_DEMAND_NOTIFICATION_DESC: "[faction_leader.Custom2('AppropriateGreetingPositive', ROOT.Char)]\n\nTyranská nadvláda [faction_target.Custom('CZ_TitledFirstName_G')] nad [ROOT.Char.Custom('GetTitleTierAdjective')|l] dvorem, panovnickou rodinou i celým územím [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_G')] musí skončit.\n\nMusíme být připraveni bojovat za návrat našeho právoplatného panovníka, [faction.GetSpecialCharacter.Custom('CZ_TitledFirstName_G')]!"
 FACTIONS_WINDOW_JAPANESE_RESTORE_EMPEROR: "[Concept('ceremonial_liege','Obřadní panovník')|EU]"
 tgp_faction_events.0206.t: "Ve službách [claimant.Custom('CZ_TitleAsNameNoTooltip_G')]"
 tgp_faction_events.0206.desc: "Konečně jsme zvítězili! Naše spravedlivá válka za odstranění zlovolného vlivu [defender.Custom('CZ_TitledFirstName_G')] a osvobození [claimant.Custom('CZ_TitleAsName_A')] skončila vítězstvím věrných příznivců panovníka.\n\nAčkoli byl na císařském dvoře obnoven pořádek, válka otřásla celým hrabstvím. Obyvatelé [defender.GetPrimaryTitle.Custom('CZ_LandedNameNoTooltip_G')] ve mně nyní vidí toho, kdo přinesl mír a převzal péči o panovnickou rodinu..."
 tgp_faction_events.0206.a: "Ať žije [claimant.GetTitleAsNameNoTooltip]!"
 tgp_faction_events.0206.b: "Cesta je plná nástrah. Náš lenní pán potřebuje vedení..."
