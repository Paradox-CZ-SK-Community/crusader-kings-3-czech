 tgp_decision_events.0100.t: "Petice $game_concept_movement_possessive$: [petitioner.Custom('GetMyMovementNoTooltip')]"
 tgp_decision_events.0100.desc: "Jako [Select_CString(petitioner.IsFemale,'pokorná zástupkyně','pokorný zástupce')] hnutí [petitioner.Custom('GetMyMovement')] předkládám petici a žádám, aby se "
 tgp_decision_events.0100.desc_change_candidate_score_law: "změnil zákon [GetLawGroup('candidate_score_laws').GetNameNoTooltip]! Aby úřady zastávali ti nejschopnější, měli bychom při výběru zohledňovat [Select_CString(petition_recipient.HasRealmLaw('candidate_score_merit_law'),'každého bez ohledu na jeho společenské postavení','pouze příslušníky vlivných rodin')]."
 tgp_decision_events.0100.desc_change_bureaucracy_laws_increase: "rozšířila $game_concept_celestial_bureaucracy$! Měl bys upevnit své božské právo vládnout a soustředit moc do rukou ústřední vlády."
 tgp_decision_events.0100.desc_change_bureaucracy_laws_decrease: "omezila $game_concept_celestial_bureaucracy$! Místní guvernéři potřebují více pravomocí, aby mohli účinněji plnit své povinnosti vůči říši."
 tgp_decision_events.0100.desc_change_army_laws_increase: "posílila struktura velení vojsku! Pouze byrokracie může zaručit bezpečnost říše."
 tgp_decision_events.0100.desc_change_army_laws_decrease: "omezila struktura velení vojsku! Jednotliví guvernéři potřebují více pravomocí, aby mohli říši chránit."
 tgp_decision_events.0100.desc_change_province_metropolitan: "změnila $game_concept_province_administration$ na typ $celestial_province_metropolitan_short$!\n\nŘíše je jen tak silná jako její nejslabší město."
 tgp_decision_events.0100.desc_change_province_industrial: "změnila $game_concept_province_administration$ na typ $celestial_province_industrial_short$!\n\nMá-li říše prosperovat po věčné časy, musí dlouhodobě investovat do rozvoje svých území."
 tgp_decision_events.0100.desc_change_province_military: "změnila $game_concept_province_administration$ na typ $celestial_province_military_short$!\n\nMusíme rozvíjet válečnické umění, abychom zajistili říši trvalou budoucnost."
 tgp_decision_events.0100.desc_change_province_protectorate: "změnila $game_concept_province_administration$ na typ $celestial_province_protectorate_short$!\n\nOkruhy je třeba posílit, aby byl lid chráněn před všemi možnými nájezdníky a bandity."
 tgp_decision_events.0100.desc_change_retirement_law_increase: "zvýšila úroveň zákona $celestial_retirement_law$!\n\nSchopní guvernéři by měli spravovat své okruhy co nejdéle."
 tgp_decision_events.0100.desc_change_retirement_law_decrease: "snížila úroveň zákona $celestial_retirement_law$!\n\nOkruhy je třeba posilovat co nejčastějším střídáním guvernérů."
 tgp_decision_events.0100.desc_change_retirement_law_outro: "Jedině tak si uchováme sílu a blahobyt. [petition_recipient.GetTitleAsNameNoTooltip|U] se mnou musí souhlasit!"
 tgp_decision_events.0100.desc_change_province_petitioner: "A já bych mohl císaře přesvědčit, že tuto změnu potřebuje i mé hlavní sídlo [petitioner.GetCapitalLocation.GetName]."
 tgp_decision_events.0100.desc_change_province_no_petitioner: "Navíc je v panství mnoho míst, za která bych se mohl přimluvit."
 tgp_decision_events.0100.desc_change_province_house: "Stejnou změnu si přeje a potřebuje také [house_movement_member.GetName] z mého rodu."
 tgp_decision_events.0100.desc_change_province_disciple: "Neměl bych však zapomínat na [Select_CString(disciple_movement_member.IsFemale,'svou učednici','svého učedníka')] [disciple_movement_member.GetName]."
