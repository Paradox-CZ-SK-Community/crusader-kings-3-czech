 tgp_decision_events.0102.t: "$tgp_decision_events.0100.t$"
 tgp_decision_events.0102.desc: "[petition_recipient.GetName|U] se na mě překvapeně podívá.\n\n„Nečekal jsem, že dnes uslyším tak smělý požadavek. To mě skutečně pobavilo! Obávám se však, že musím odmítnout.“ Mávnutím ruky mě propustí. „Pozvěte prosím dalšího žadatele.“\n\nNa okamžik zůstanu stát jako opařený. Přece ještě musí existovat něco, co mohu udělat!"
 tgp_decision_events.0102.a: "Uplatním svůj vliv!"
 tgp_decision_events.0102.b: "Říše potřebuje vojsko."
 tgp_decision_events.0102.c: "Existují i jiné způsoby přesvědčování..."
 tgp_decision_events.0102.d: "[Select_CString(ROOT.Char.IsFemale,'Nabídnu samu sebe','Nabídnu sám sebe')]."
 tgp_decision_events.0102.forfeit: "Nebudu odporovat vůli Nebes."
 tgp_decision_events.0102.petition_refused: "Petice byla #X odmítnuta#!"
 tgp_decision_events.0102.petition_accepted: "Petice byla #P přijata#!"
 tgp_decision_events.0101.a_title: "Petice přijata"
 tgp_decision_events.0103.t: "$tgp_decision_events.0100.t$"
 tgp_decision_events.0103.desc: "Mé odmítnutí [petitioner.Custom('CZ_Name_A')] viditelně rozruší, ale brzy se vzchopí a požádá mě:\n\n„Promiň mi mou troufalost, ale tak snadno se odbýt nenechám. Tato záležitost je důležitá pro všechny členy hnutí [actors_movement.GetName]. Prosím, zvaž své rozhodnutí ještě jednou.“ Poté ke mně vztáhne ruku."
 tgp_decision_events.0103.desc_give_influence: "„Mezi svými lidmi požívám úcty a svěřili mi právo mluvit jejich jménem. Záleží nám pouze na blahu [GetTitleByKey('h_china').Custom('CZ_LandedName_G')].“"
 tgp_decision_events.0103.desc_give_maa: "„Říše by jistě našla využití pro pluky mých nejlepších vojáků. Vyhov našim požadavkům a budou ti k dispozici.“"
 tgp_decision_events.0103.desc_use_hook: "„Známe se už velmi dlouho. Myslím, že mi dlužíš laskavost, a očekávám, že našemu požadavku vyhovíš.“"
 tgp_decision_events.0103.desc_give_hook: "„Nabízím ti své věrné služby. Až nastanou temné časy, můžeš využít mé schopnosti a vliv, stejně jako já nyní žádám o tvou podporu.“"
 tgp_decision_events.0103.a: "„Nuže dobrá, vyhovím tvým požadavkům.“"
 tgp_decision_events.0103.b: "„Zmiz mi z očí, a to #emp okamžitě!#!“"
 tgp_decision_events.0103.a_title: "$tgp_decision_events.0101.a_title$"
 tgp_decision_events.0103.b_title: "Petice odmítnuta"
 tgp_decision_events.0100.desc_increase_budget: "zvýšily platy všech"
 tgp_decision_events.0100.desc_increase_budget_salary: "$tgp_decision_events.0100.desc_increase_budget$ guvernérů.\n\nPotřebují více prostředků z pokladnice, aby mohli zajistit prosperitu panství, investovat do kulturních aktivit a výstavby budov."
 tgp_decision_events.0100.desc_increase_budget_ministry: "$tgp_decision_events.0100.desc_increase_budget$ ministrů.\n\nZahajují mnoho významných projektů a potřebují prostředky, aby v nich mohli pokračovat."
 tgp_decision_events.0100.desc_increase_budget_military: "$tgp_decision_events.0100.desc_increase_budget$ velitelů.\n\nMusí udržovat naše vojska a mít dostatek prostředků k jejich shromažďování. Naši nepřátelé z nás musí mít strach!"
 tgp_decision_events.0100.desc_increase_budget_outro: "\n\nProstředky v pokladnici [hegemon.Custom('CZ_TitleAsName_G')] však nejsou neomezené. Aby bylo možné tuto petici financovat, musí se prostředky odebrat jinému rozpočtu."
 tgp_decision_events.0100.f: "Generálové rozhazují prostředky pod záminkou naší obrany."
 tgp_decision_events.0100.g: "Guvernéři příliš plýtvají prostředky na přepychové výdaje."
 tgp_decision_events.0100.h: "Ministři drancují pokladnici kvůli zbytečným projektům."
