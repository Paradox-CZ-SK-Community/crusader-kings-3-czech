l_polish:
 game_concept_meritocratic: "Meritokratická"
 game_concept_meritocratic_desc: "$game_concept_meritocratic$ je [Concept('government_bureaucratic_type','byrokratická')|E] [Concept('government_form','forma vlády')|E] podobná [Concept('celestial','nebeské')|E], v níž [Concept('liege','lenní pán')|E] jmenuje postavy [Concept('governors','guvernéry')|E], kteří jsou dvojího typu: civilní a vojenští.\n\nPostavy mají přístup k [Concept('influence','vlivu')|E], [Concept('noble_families','šlechtickým rodinám')|E] a [Concept('family_estates','rodovým statkům')|E].\n\nNezávislí [Concept('rulers','vládci')|E] mají [Concept('legitimacy','legitimitu')|E], zatímco [Concept('vassals','vazalové')|E] se soustředí na získávání [Concept('merit','zásluh')|E]."
 game_concept_meritocratic_i: "@government_type_meritocratic!"
 game_concept_meritocratic_bureaucracy: "Meritokratická byrokracie"
 game_concept_meritocratic_bureaucracy_desc: "$game_concept_meritocratic_bureaucracy$ představuje úroveň centralizace [Concept('realm_possessive','panství')|E] s [Concept('meritocratic','meritokratickou')|E] vládou a obecnou moc, kterou [Concept('ruler','vládce')|E] uplatňuje nad svými [Concept('vassals','vazaly')|E].\n\n$game_concept_meritocratic_bureaucracy$ může měnit pouze [Concept('top_liege','nejvyšší lenní pán')|E]. Meritokratičtí $game_concept_vassals$ používají stejnou úroveň jako jejich $game_concept_liege$.\n\nExistují čtyři úrovně $game_concept_meritocratic_bureaucracy$:\n$EFFECT_LIST_BULLET$$meritocratic_bureaucracy_0$\n$EFFECT_LIST_BULLET$$meritocratic_bureaucracy_1$\n$EFFECT_LIST_BULLET$$meritocratic_bureaucracy_2$\n$EFFECT_LIST_BULLET$$meritocratic_bureaucracy_3$\n\nZvýšení $game_concept_meritocratic_bureaucracy$ stojí určité množství [Concept('prestige','prestiže')|E] podle [Concept('realm_size','velikosti panství')|E] a [Concept('learning_skill','učenosti')|E] vládce."
 game_concept_steppe_admin: "Meritokratický chanát"
 game_concept_steppe_admin_desc: "$game_concept_steppe_admin$ je [Concept('government_bureaucratic_type','byrokratická')|E] [Concept('government_form','forma vlády')|E] podobná [Concept('celestial','nebeské')|E] a [Concept('meritocratic','meritokratické')|E], avšak pocházející z [Concept('nomadic','kočovné')|E] $game_concept_government_form$. [Concept('liege','Lenní pán')|E] jmenuje postavy [Concept('governors','guvernéry')|E], kteří jsou dvojího typu: civilní a vojenští. Nadále si udržují [Concept('tributaries','tributáře')|E], vynucují [Concept('obedience','poslušnost')|E] a mají vyšší maximální [Concept('dread','hrůzu')|E].\n\nPostavy mají přístup k [Concept('influence','vlivu')|E], [Concept('noble_families','šlechtickým rodinám')|E] a [Concept('family_estates','rodovým statkům')|E].\n\nNezávislí [Concept('rulers','vládci')|E] mají [Concept('legitimitu')|E], zatímco [Concept('vassals','vazalové')|E] se soustředí na získávání [Concept('merit','zásluh')|E]."
 game_concept_steppe_admin_i: "@government_type_steppe_admin!"
 game_concept_ceremonial_claimant_faction: "$ceremonial_claimant_faction$"
 game_concept_ceremonial_claimant_factions: "Frakce obřadního nárokovatele"
 game_concept_ceremonial_claimant_faction_desc: "$game_concept_claimant_faction$ usiluje o dosazení konkrétního [Concept('claimant','pretendenta')|E] jako [Concept('ceremonial_liege','obřadního panovníka')|E]. Pokud uspěje, dosavadní obřadní panovník se bude muset vzdát svého [Concept('title','titulu')|E] ve prospěch pretendenta. Všichni členové [Concept('faction','frakce')|E] získají na pretendenta [Concept('hook','páku')|E]."
 game_concept_imperial_policy_faction: "$imperial_policy_faction$"
 game_concept_faction_imperial_policy: "Císařská politika"
 game_concept_imperial_policy_factions: "Frakce císařské politiky"
 game_concept_imperial_policy_faction_desc: "$game_concept_imperial_policy_faction$ usiluje o změnu [Concept('imperial_policy','císařské politiky')|E] [Concept('realm','panství')|E] přijetím nového [Concept('law','zákona')|E] zvoleného vůdcem frakce."
