l_polish:
 game_concept_meritocratic: "Meritokratická"
 game_concept_meritocratic_desc: "$game_concept_meritocratic$ je [Concept('government_bureaucratic_type','byrokratická')|E] [Concept('government_form','forma vlády')|E] podobná [Concept('celestial','nebeské vládě')|E]. [Concept('liege','Lenní pán')|EU] jmenuje postavy do úřadu [Concept('governors','guvernérů')|E], kteří se dělí na civilní a vojenské.\n\nPostavy mají přístup k [Concept('influence','vlivu')|E], [Concept('noble_families','šlechtickým rodinám')|E] a [Concept('family_mansions','rodovým sídlům')|E].\n\n[Concept('rulers','Nezávislí vládci')|EU] disponují [Concept('legitimacy','legitimitou')|E], zatímco [Concept('vassals','vazalové')|E] se soustředí na získávání [Concept('merit','zásluh')|E]."
 game_concept_meritocratic_i: "@government_type_meritocratic!"
 game_concept_meritocratic_bureaucracy: "Meritokratická byrokracie"
 game_concept_meritocratic_bureaucracy_desc: "$game_concept_meritocratic_bureaucracy$ vyjadřuje míru centralizace [Concept('meritocratic','meritokratického')|E] [Concept('realm_possessive','panství')|E] a rozsah moci, kterou [Concept('ruler','vládce')|E] uplatňuje vůči svým [Concept('vassals','vazalům')|E].\n\nÚroveň $game_concept_meritocratic_bureaucracy$ může měnit pouze [Concept('top_liege','nejvyšší lenní pán')|E]. Meritokratičtí $game_concept_vassals$ používají stejnou úroveň jako jejich $game_concept_liege$.\n\n$game_concept_meritocratic_bureaucracy$ má čtyři úrovně:\n$EFFECT_LIST_BULLET$$meritocratic_bureaucracy_0$\n$EFFECT_LIST_BULLET$$meritocratic_bureaucracy_1$\n$EFFECT_LIST_BULLET$$meritocratic_bureaucracy_2$\n$EFFECT_LIST_BULLET$$meritocratic_bureaucracy_3$\n\nZvýšení úrovně $game_concept_meritocratic_bureaucracy$ stojí určité množství [Concept('prestige','prestiže')|E], které závisí na [Concept('realm_size','velikosti panství')|E] a [Concept('learning_skill','učenosti')|E] vládce."
 game_concept_steppe_admin: "Meritokratický chanát"
 game_concept_steppe_admin_desc: "$game_concept_steppe_admin$ je [Concept('government_bureaucratic_type','byrokratická')|E] [Concept('government_form','forma vlády')|E] podobná [Concept('celestial','nebeské')|E] a [Concept('meritocratic','meritokratické')|E] vládě, která se však vyvinula z kočovného zřízení. Původní $game_concept_government_form$ byla [Concept('nomadic','kočovná')|E]. [Concept('liege','Lenní pán')|EU] jmenuje postavy do úřadu [Concept('governors','guvernérů')|E], kteří se dělí na civilní a vojenské. Chanát si nadále udržuje [Concept('tributaries','tributáře')|E], vynucuje si [Concept('obedience','poslušnost')|E] a má vyšší maximální úroveň [Concept('dread','hrůzy')|E].\n\nPostavy mají přístup k [Concept('influence','vlivu')|E], [Concept('noble_families','šlechtickým rodinám')|E] a [Concept('family_mansions','rodovým sídlům')|E].\n\n[Concept('rulers','Nezávislí vládci')|EU] disponují [Concept('legitimacy','legitimitou')|E], zatímco [Concept('vassals','vazalové')|E] se soustředí na získávání [Concept('merit','zásluh')|E]."
 game_concept_steppe_admin_i: "@government_type_steppe_admin!"
 game_concept_ceremonial_claimant_faction: "$ceremonial_claimant_faction$"
 game_concept_ceremonial_claimant_factions: "Frakce obřadního nárokovatele"
 game_concept_ceremonial_claimant_faction_desc: "$game_concept_claimant_faction$ usiluje o dosazení konkrétního [Concept('claimant','pretendenta')|E] do postavení [Concept('ceremonial_liege','obřadního panovníka')|E]. Pokud uspěje, dosavadní obřadní panovník bude muset svůj [Concept('title','titul')|E] přenechat pretendentovi. Všichni členové [Concept('faction','frakce')|E] získají na nového panovníka [Concept('hook','páku')|E]."
 game_concept_imperial_policy_faction: "$imperial_policy_faction$"
 game_concept_faction_imperial_policy: "Císařská politika"
 game_concept_imperial_policy_factions: "Frakce císařské politiky"
 game_concept_imperial_policy_faction_desc: "$game_concept_imperial_policy_faction$ usiluje o změnu [Concept('imperial_policy','císařské politiky')|E] [Concept('realm','panství')|E] prostřednictvím přijetí nového [Concept('law','zákona')|E], který vybere vůdce frakce."
 game_concept_east_asian_estate: "Východoasijské sídlo"
 game_concept_east_asian_estates: "Východoasijská sídla"
 game_concept_mansion: "Sídlo"
 game_concept_mansions: "Sídla"
 game_concept_family_mansion: "Rodové sídlo"
 game_concept_family_mansions: "Rodová sídla"
 game_concept_east_asian_estate_desc: "$game_concept_mansion$ je typ [Concept('domicile','domicilu')|E], který vlastní [Concept('house_head','hlava rodu')|E] z významných [Concept('noble_families','šlechtických rodin')|E] v [Concept('realms','panstvích')|E] s formou vlády [GetGovernment('japan_administrative_government').GetName] nebo [GetGovernment('japan_feudal_government').GetName]. Představuje soukromé pozemkové vlastnictví, které není vázáno na žádný konkrétní [Concept('landed','zeměpanský')|E] [Concept('title','titul')|E].\n\nNa tomto místě lze vybudovat [Concept('east_asian_estate','východoasijské sídlo')|E], které rozšíří rodové bohatství a [Concept('influence','vliv')|E]. $game_concept_mansion$ pak budou dědit další generace."
 game_concept_east_asian_estate_building: "Budova východoasijského sídla"
 game_concept_east_asian_estate_buildings: "Budovy východoasijského sídla"
 game_concept_mansion_building: "Budova sídla"
 game_concept_mansion_buildings: "Budovy sídla"
 game_concept_east_asian_estate_building_desc: "$game_concept_east_asian_estate_buildings$ představují jedinečná a trvalá vylepšení [Concept('east_asian_estate','východoasijského sídla')|E].\n\nMajitel sídla má na výběr z mnoha různých staveb, které může vybudovat, aby získal soukromé příjmy, rozšířil rodový [Concept('influence','vliv')|E] a zpřístupnil si různá [Concept('decisions','rozhodnutí')|E], [Concept('interactions','interakce')|E] a další možnosti."
