 tgp_governor_contract_event.0009.t: "Zchátralá hráz"
 tgp_governor_contract_event.0009.desc: "Důležitá hráz v oblasti [CZProvName(dam_in_disrepair_destination,'G')] je v žalostném stavu. Pokud se její oprava nebude řešit okamžitě, následky mohou být katastrofální.\n\nTakový podnik však nebude nijak snadný a většina našeho rozpočtu je již vyhrazena na jiné účely. Chceme-li dosáhnout něčeho víc než jen provizorního řešení, musíme najít způsob, jak snížit náklady."
 tgp_governor_contract_event.0009.a: "Povoláme místní obyvatele, ale chudé a nemocné práce zprostíme."
 tgp_governor_contract_event.0009.b: "Do práce zapojíme ty, které by protržení hráze zasáhlo nejvíce."
 tgp_governor_contract_event.0009.c: "Bohatší obyvatelé musí přispět podle svých možností."
 tgp_governor_contract_event.0009.d: "Bohatství se s lidskými životy nedá srovnávat. Zaplatím to ze svého."
 tgp_governor_contract_event.0009.e: "Potřebné prostředky zabavíme místním obchodníkům."
