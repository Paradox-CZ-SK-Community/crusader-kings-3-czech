 quaking_in_panic: "Panika po zemětřesení"
 quaking_in_panic_contract: "$quaking_in_panic$"
 quaking_in_panic_request: "Tato situace ti umožní rozhodnout o jejím výsledku"
 quaking_in_panic_desc: "Několik vesnic zasáhlo zemětřesení a následná panika mezi obyvateli začíná ohrožovat veřejný pořádek."
 quaking_in_panic_desc_title: "$task_contract_governance_desc_title$"
 tgp_governor_contract_event.0030.t: "Panika po zemětřesení"
 tgp_governor_contract_event.0030.desc: "Právě jsem [Select_CString(ROOT.Char.IsFemale,'zabraná','zabraný')] do rozhovoru s [my_councillor.Custom('CZ_FirstName_I')], když do místnosti s neobvyklou naléhavostí vtrhne [alarmed_councillor.GetFirstName], viditelně [Select_CString(alarmed_councillor.IsFemale,'otřesená','otřesený')].\n\n„Posel z [CZProvName(quaking_in_panic_destination,'G')], [ROOT.Char.Custom('FormOfAddressForLiege')]! Došlo k zemětřesení a rolníci to považují za strašlivé znamení! Tvrdí, že jde o projev božského hněvu!“"
 tgp_governor_contract_event.0030.a: "Panika je jako požár. Jakmile se rozšíří, jen těžko ji uhasíme."
 tgp_governor_contract_event.0030.a_tt: "Vydej se do [CZProvName(quaking_in_panic_destination,'G')] a rozptyl obavy místních obyvatel."
 tgp_governor_contract_event.0030.b: "Nářky rolníků mě příliš nezajímají."
 tgp_governor_contract_event.0031.t: "Panika po zemětřesení"
 tgp_governor_contract_event.0031.desc: "Když dorazím do vesnice, panuje zde zjevný neklid. Rolníci se shlukují kolem mého doprovodu a zoufale nás prosí, abychom utišili hněv Nebes dříve, než je postihne další pohroma.\n\nPohlédnu na vesnici za jejich zády. Popraskané zdi a zkřivené dveře jejich domovů jasně vypovídají o tom, odkud pramení jejich strach."
 tgp_governor_contract_event.0031.a: "Svoláme veřejné shromáždění a uklidníme obyvatele."
 tgp_governor_contract_event.0031.b: "Rozmístěte zde menší vojenský oddíl, aby potlačil nepokoje."
 tgp_governor_contract_event.0031.c: "Ať vesničtí stařešinové veřejně ujistí lid, že nebezpečí již pominulo."
 tgp_governor_contract_event.0031.d: "Necháme důkladně posoudit škody a přislíbíme další pomoc."
 tgp_governor_contract_event.0031.e: "Přesídlíme nejhůře postižené a soustředíme obyvatelstvo oblasti do větších sídel."
