 monopoly_in_the_marketplace: "Monopol na tržišti"
 monopoly_in_the_marketplace_contract: "$monopoly_in_the_marketplace$"
 monopoly_in_the_marketplace_request: "Tato situace ti umožní rozhodnout o jejím výsledku"
 monopoly_in_the_marketplace_desc: "Mocný obchodník ovládl místní tržiště a obchodnické sdružení požaduje zásah státu."
 monopoly_in_the_marketplace_desc_title: "$task_contract_governance_desc_title$"
 tgp_governor_contract_event.0032.t: "Monopol na tržišti"
 tgp_governor_contract_event.0032.desc: "„...a pokud dovolíme, aby to pokračovalo, následky budou pro naši obživu #EMP zničující#!,“ uzavírá svou řeč vůdce delegace.\n\nPodle jejich výpovědí se jednomu z konkurenčních obchodníků [CZPrepV(monopoly_in_the_marketplace_destination.GetNameNoTooltip)] [CZProvName(monopoly_in_the_marketplace_destination,'L')] podařilo nekalými prostředky získat kontrolu nad hlavním tržištěm. Nyní odmítá vpustit kohokoli z jejich sdružení a nutí ostatní obchodníky přesunout své stánky na méně navštěvovaná a zoufale nevýnosná místa."
 tgp_governor_contract_event.0032.a: "O tuto záležitost se postarám osobně."
 tgp_governor_contract_event.0032.a_tt: "Vydej se do [CZProvName(monopoly_in_the_marketplace_destination,'G')] a uspořádej poměry na tržišti podle svého uvážení."
 tgp_governor_contract_event.0032.b: "Neslyším nic jiného než stížnosti na úspěšného obchodníka."
 tgp_governor_contract_event.0033.t: "Monopol na tržišti"
 tgp_governor_contract_event.0033.desc: "Obchodníci sice bývají málokdy vzorem poctivosti, ale tentokrát se zdá, že jejich slova odpovídají skutečnosti.\n\nNenápadně procházíme od jednoho stánku ke druhému a na každém z nich nacházíme stejnou výraznou značku. Všechny zjevně patří jedinému majiteli.\n\nPoslední stánek, ke kterému přicházíme, je ze všech největší a nejhonosnější. Dohlíží na něj [Select_CString(merchant_magnate.IsFemale,'vznešeně působící žena','vznešeně působící muž')] s hrdým úsměvem na tváři. Je naprosto jasné, že právě o tomto obchodním soupeři delegace hovořila."
 tgp_governor_contract_event.0033.a: "Žádný obchodník nesmí vlastnit více než jeden stánek."
 tgp_governor_contract_event.0033.b: "Rozšíříme tržiště a nové stánky vydražíme pouze členům sdružení."
 tgp_governor_contract_event.0033.c: "[merchant_magnate.GetShortUIName|U] tu může zůstat, pokud si za tuto výsadu #EMP zaplatí#!."
 tgp_governor_contract_event.0033.d: "Podpoříme konkurenci a necháme věcem volný průběh."
 tgp_governor_contract_event.0033.e: "Kdo je takhle bohatý, musí mít #EMP něco#! na svědomí. Zabavte všechno zboží!"
