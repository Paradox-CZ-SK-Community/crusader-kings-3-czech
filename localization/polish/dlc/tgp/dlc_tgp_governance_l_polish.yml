 tgp_governor_contract_event.2000.t: "$missing_equipment$"
 tgp_governor_contract_event.2000.desc: "Už jsou to #EMP týdny#!, co měla dorazit poslední zásilka nové výzbroje. Dosud se ke mně nedonesla jediná zpráva o tom, kde by mohla být.\n\nVětšina mečů, kuší, šípů a zbrojí se vyrábí v dílnách [CZPrepV(capital_location.GetNameNoTooltip)] [CZProvNameNoTooltip(capital_location,'L')], které zaměstnávají tisíce lidí. Jen tyto dílny dokážou dodat množství, které potřebujeme.\n\nBez těchto zásilek nemůžeme vyzbrojit nové odvedence ani nahradit opotřebované zbraně a zbroj."
 tgp_governor_contract_event.2000.a: "Měli bychom ty dílny navštívit."
 tgp_governor_contract_event.2000.a_tt: "Vydej se do dílen a osobně vyřeš problém."
 tgp_governor_contract_event.2000.b: "Vždycky mohu výzbroj nakoupit ze svého."
 tgp_governor_contract_event.2000.c: "Pošlete zprávu do [CZProvNameNoTooltip(capital_location,'G')]. Dříve či později se to vyřeší."
 tgp_governor_contract_event.2001.t: "$missing_equipment$: Dílna"
 tgp_governor_contract_event.2001.desc: "Vedoucí dílny se #EMP konečně#! dostaví a přivítá mě hlubokou, obřadnou úklonou.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], jaká nečekaná návštěva! Podle vašeho přání jsem prošel účetní knihy a zdá se, že za nedostatkem zásilek pro území [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] může stát úřední chyba. Velice nešťastné nedopatření. Příští dodávku samozřejmě přesměrujeme k vám.“"
 tgp_governor_contract_event.2001.a: "#EMP Úřední#! chyba?! [court_relation.GetFirstNameNoTooltip] se o tom dozví..."
 tgp_governor_contract_event.2001.a.tt: "Podaří se ti přesvědčit vedoucího dílny hrozbou, že celou záležitost probereš s [court_relation.Custom('CZ_ShortUIName_I')] na císařském dvoře."
 tgp_governor_contract_event.2001.b: "Jistě by bylo namístě i nějaké další odškodnění?"
 tgp_governor_contract_event.2001.c: "Bylo by nemilé, kdyby se o tomto incidentu dozvěděla veřejnost, nemyslíš?"
 tgp_governor_contract_event.2001.d: "Dobrá tedy. Ale postarej se, aby zásilka skutečně dorazila."
 tgp_governor_contract_event.2001.tt_success_desc: "Vedoucího dílny se podaří přesvědčit"
 tgp_governor_contract_event.2001.tt_success: "Podaří se ti přesvědčit vedoucího dílny, aby ti poskytl více, než původně slíbil"
 tgp_governor_contract_event.2001.tt_failure_desc: "Vedoucího dílny se #bold nepodaří#! přesvědčit"
 tgp_governor_contract_event.2001.tt_failure: "Nepodaří se ti přesvědčit vedoucího dílny, aby poskytl cokoli nad rámec svého původního slibu"
 tgp_governor_contract_event.2002.t: "$missing_equipment$: Úspěch"
 tgp_governor_contract_event.2002.desc: "Mé nepříliš zastřené výhrůžky se rychle dočkají odezvy v podobě ještě hlubší úklony. Vedoucí dílny se pomalu narovná a na čele se mu viditelně perlí pot.\n\n„Samozřejmě, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]. Vaše hodnocení je naprosto správné. Jistě se dokážeme dohodnout. Možná už máte nějaký návrh?“"
 tgp_governor_contract_event.2002.a: "Zajistíme si také budoucí dodávky."
 tgp_governor_contract_event.2002.b: "Dodáš mi rovnou vaše příští #EMP dvě#! zásilky."
 tgp_governor_contract_event.2002.c: "Bude zapotřebí finanční odškodnění."
 tgp_governor_contract_event.2002.d: "Pošli mi tu nejlepší výzbroj, kterou máte k dispozici."
 tgp_governor_contract_event.2003.t: "$missing_equipment$: Neúspěch"
 tgp_governor_contract_event.2003.desc: "Vedoucí dílny se na okamžik odmlčí a zamračí.\n\n„#EMP Vy#! nejste jediný velitel, který potřebuje výzbroj. Už tím, že vám poskytnu naši příští zásilku, jsem udělal víc než dost. A to si uvědomte, že měla původně dorazit někam úplně jinam. Nepokoušejte své štěstí, #EMP [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]#!.“\n\nS těmito slovy se vedoucí dílny otočí a odchází."
 tgp_governor_contract_event.2003.a: "#EMP Jak myslíš.#!"
 lines_in_the_soil: "Hranice v půdě"
 lines_in_the_soil_contract: "$lines_in_the_soil$"
 lines_in_the_soil_request: "Tato situace ti umožní rozhodnout o jejím výsledku"
 lines_in_the_soil_desc: "Dva významní pozemkoví vlastníci neúnavně zasypávají místní úřady stížnostmi kvůli sporu o vlastnictví půdy."
 lines_in_the_soil_desc_title: "$task_contract_governance_desc_title$"
 tgp_governor_contract_event.0020.t: "Hranice v půdě"
 tgp_governor_contract_event.0020.desc: "Každodenní život v [ROOT.Char.GetTitleTierName] přináší i značné množství úředního papírování. Když však téměř všechny dnešní zprávy pocházejí z oblasti [CZProvName(lines_in_the_soil_destination,'G')], je zjevné, že něco není v pořádku.\n\nPři podrobnějším pročítání hlášení zjišťuji, že se dva místní vlastníci půdy dostali do ostrého sporu o pozemek ležící mezi jejich majetky. Jejich vzájemné nepřátelství už zašlo tak daleko, že z místního úřadu udělali právní bojiště."
 tgp_governor_contract_event.0020.a: "Předpokládám, že by mi #EMP trocha#! volna mimo úřad prospěla."
 tgp_governor_contract_event.0020.a_tt: "Vydej se do [CZProvName(lines_in_the_soil_destination,'G')] a pokus se spor urovnat."
 tgp_governor_contract_event.0020.b: "Ať jejich žádosti zapadají prachem. Brzy je to omrzí."
 tgp_governor_contract_event.0021.t: "Hranice v půdě"
 tgp_governor_contract_event.0021.desc: "Po nekonečných hodinách hádek, dohadování a sotva skrývaných urážek mohu dojít k jedinému závěru. Vážení účastníci tohoto sporu jsou tvrdohlaví, natvrdlí #EMP zabedněnci#!.\n\nJe nad slunce jasnější, že jde pouze o nejnovější kapitolu dlouholetého nepřátelství. Ani jeden není ochoten ustoupit tomu druhému byť jen o hrst hlíny.\n\nChci-li mít vůbec nějakou naději jejich nekonečné spory ukončit, nezbývá mi než rozhodnout jako soudce, nikoli jako prostředník."
 tgp_governor_contract_event.0021.a: "Necháme pozemky znovu vyměřit a výsledek bude konečný."
 tgp_governor_contract_event.0021.b: "Prozkoumáme archivy a zjistíme, kdo má silnější nárok."
 tgp_governor_contract_event.0021.c: "Rozdělíme pozemek rovným dílem a tím to skončí."
 tgp_governor_contract_event.0021.d: "Co kdybych ten pozemek odkoupil sám?"
 tgp_governor_contract_event.0021.e: "Pokud se nedokážou dohodnout, pozemek připadne státu."
