 fraud_in_broad_daylight: "Podvod za bílého dne"
 fraud_in_broad_daylight_contract: "$fraud_in_broad_daylight$"
 fraud_in_broad_daylight_request: "Tato situace ti umožní rozhodnout o jejím výsledku"
 fraud_in_broad_daylight_desc: "Místní tržiště jsou zaplavena padělaným zbožím a podvedení zákazníci zuří."
 fraud_in_broad_daylight_desc_title: "$task_contract_governance_desc_title$"
 tgp_governor_contract_event.0022.t: "Podvod za bílého dne"
 tgp_governor_contract_event.0022.desc: "Z práce mě vytrhne hlasité žuchnutí bedny, kterou kdosi bez okolků složil na podlahu. Vedle ní stojí [reporting_councillor.GetTitledFirstName].\n\n„Dorazily další důkazy, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]. Tentokrát jsou to lahvičky od parfému naplněné obyčejnou hlínou.“\n\nTržiště [CZPrepV(fraud_in_broad_daylight_destination.GetNameNoTooltip)] [CZProvName(fraud_in_broad_daylight_destination,'L')] jsou v poslední době zaplavena padělaným zbožím."
 tgp_governor_contract_event.0022.a: "Tohle si žádá vyšetřování."
 tgp_governor_contract_event.0022.a_tt: "Vydej se do [CZProvName(fraud_in_broad_daylight_destination,'G')] a obnov poctivé obchodování na tržišti."
 tgp_governor_contract_event.0022.b: "Ti zákazníci jsou jen hlupáci."
 tgp_governor_contract_event.0023.t: "Podvod za bílého dne"
 tgp_governor_contract_event.0023.desc: "Navzdory veškerému úsilí je odhalení padělatelů mnohem obtížnější, než jsem očekával.\n\nPoctiví obchodníci totiž po vyprodání svého zboží pronajímají stánky na zbytek dne cizincům. Podvodníci tak mohou nerušeně prodávat své padělky a následně zmizet beze stopy."
 tgp_governor_contract_event.0023.a: "Prověřte všechny na tržišti a podezřelé zadržte."
 tgp_governor_contract_event.0023.b: "Vypište odměnu za informace."
 tgp_governor_contract_event.0023.c: "Vyšleme naše písaře v přestrojení za zákazníky."
 tgp_governor_contract_event.0023.d: "Ať si to obchodníci vyřeší sami."
 tgp_governor_contract_event.0023.e: "V poledne provedeme na tržišti razii!"
