l_polish:
 jail_inspection: "Inspekce věznice"
 jail_inspection_contract: "$jail_inspection$"
 jail_inspection_request: "Tato situace ti umožní rozhodnout o jejím výsledku"
 jail_inspection_desc: "Z okresní věznice přicházejí znepokojivé zprávy. Podmínky jsou otřesné a vězni stojí na pokraji otevřené vzpoury."
 jail_inspection_desc_title: "$task_contract_governance_desc_title$"
 tgp_governor_contract_event.0010.t: "Inspekce věznice"
 tgp_governor_contract_event.0010.desc: "Zdá se, že vězni v chátrající okresní věznici [CZPrepV(jail_inspection_destination.GetNameNoTooltip)] [CZProvName(jail_inspection_destination,'L')] začínají být neklidní. Protestují proti otřesným podmínkám a vzdorují veškerému úsilí dozorců udržet je pod kontrolou. Zprávy varují, že pokud se brzy nenajde řešení, vězni mohou své strážce přemoci."
 tgp_governor_contract_event.0010.a: "O tuto záležitost se musím postarat osobně."
 tgp_governor_contract_event.0010.a_tt: "Vydej se do [CZProvName(jail_inspection_destination,'G')] a osobně proveď inspekci věznice."
 tgp_governor_contract_event.0010.b: "Nářky odsouzenců mě příliš nezajímají."
 tgp_governor_contract_event.0001.t: "Inspekce věznice"
 tgp_governor_contract_event.0001.desc: "Sotva překročím práh věznice, udeří mě do nosu odporný zápach nemytých těl a uši mi zaplní žalostné sténání vězňů. Něco drobného se mi na okamžik otře o nohu a vzápětí zmizí ve stínech tak rychle, že ani nestačím poznat, co to bylo.\n\nPohlédnu do nejbližší cely a střetnu se s pohledem uvězněné osoby. V její ztrhané tváři žhne hněv jako řeřavý uhlík uprostřed moře utrpení."
 tgp_governor_contract_event.0001.a: "Věznici opravíme, ale práci odvedou sami vězni."
 tgp_governor_contract_event.0001.b: "Musíme jim okamžitě zlepšit podmínky!"
 tgp_governor_contract_event.0001.c: "Omilostněme ty, jejichž provinění jsou nejmenší."
 tgp_governor_contract_event.0001.d: "Nechte nejhlasitější křiklouny zmlátit, dokud nezmlknou."
 tgp_governor_contract_event.0001.e: "Propustíme je – ovšem jen na práci na našich polích a stavbách."
 task_contract_reward_effect_renovate_jail_desc: "$label_success_standard$"
 task_contract_reward_effect_improve_their_conditions_desc: "$label_success_standard$"
 task_contract_reward_effect_pardon_some_of_them_desc: "$label_success_standard$"
 task_contract_reward_effect_beat_the_complainers_desc: "$label_success_standard$"
 task_contract_reward_effect_convict_labor_desc: "$label_success_standard$"
 potent_physick: "Zázračný lék"
 potent_physick_contract: "$potent_physick$"
 potent_physick_request: "Tato situace ti umožní rozhodnout o jejím výsledku"
 potent_physick_desc: "Na tržišti se prodává nový údajně mimořádně účinný lék. Davy kupujících však začínají ohrožovat veřejný pořádek."
 potent_physick_desc_title: "$task_contract_governance_desc_title$"
 tgp_governor_contract_event.0011.t: "Zázračný lék"
 tgp_governor_contract_event.0011.desc: "Jen málokdy vzbudí obyčejný trhovec zájem úřadů. Jeden z prodejců [CZPrepV(potent_physick_destination.GetNameNoTooltip)] [CZProvName(potent_physick_destination,'L')] však údajně nabízí tak účinný elixír, že se kolem jeho stánku shromažďují hlučné davy. Jejich rostoucí neukázněnost začíná vážně narušovat veřejný pořádek."
 tgp_governor_contract_event.0011.a: "Lék, po kterém je taková poptávka, si zaslouží prošetřit."
 tgp_governor_contract_event.0011.a_tt: "Vydej se do [CZProvName(potent_physick_destination,'G')] a obnov pořádek na tržišti."
 tgp_governor_contract_event.0011.b: "Záležitosti tržiště mě nezajímají."
 tgp_governor_contract_event.0002.t: "Zázračný lék"
 tgp_governor_contract_event.0002.desc: "Můj doprovod konečně rozehnal tvrdohlavý dav a já nyní stojím před prodejcem léčiv a jeho podivnými lektvary. Lstivý pohled okamžitě zhodnotí kvalitu mého oděvu a rozpozná novou příležitost k tučnému výdělku.\n\n„Jediná lahvička, [ROOT.Char.Custom('FormOfAddressForLiege')],“ pronáší prodávající, zvedá prst a pro větší názornost jím horlivě mává. „Zaručeně doplní vaši vnitřní životní sílu a napraví vše, co vás trápí!“\n\n„Nechcete si pořídit jednu lahvičku, nebo snad rovnou několik, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]?“ Na tváři prodávajícího se rozlévá úlisný úsměv překypující chamtivostí."
 tgp_governor_contract_event.0002.a: "Tyto lektvary zabavíme do nouzových zásob."
 tgp_governor_contract_event.0002.b: "A máš vůbec na tento stánek #EMP povolení#!?"
 tgp_governor_contract_event.0002.c: "Sbal si své věci a běž tenhle šarlatánský šmejd prodávat jinam."
 tgp_governor_contract_event.0002.d: "Právě se mi náhodou hodí někdo se znalostmi léčitelství..."
 tgp_governor_contract_event.0002.e: "Víš co? Jednu si vezmu! Tak na zdraví!"
 task_contract_reward_effect_emergency_appropriation_desc: "$label_success_standard$"
 task_contract_reward_effect_licensing_issue_desc: "$label_success_standard$"
 task_contract_reward_effect_begone_quack_desc: "$label_success_standard$"
 task_contract_reward_effect_hire_the_quack_desc: "$label_success_standard$"
 task_contract_reward_effect_down_the_hatch_desc: "$label_success_standard$"
 irregular_accounting: "Nesrovnalosti v účetnictví"
 irregular_accounting_contract: "$irregular_accounting$"
 irregular_accounting_request: "Tato situace ti umožní rozhodnout o jejím výsledku"
 irregular_accounting_desc: "Daně z této oblasti přicházejí s každým dalším výběrem později a náklady na jejich přepravu neustále rostou."
 irregular_accounting_desc_title: "$task_contract_governance_desc_title$"
 tgp_governor_contract_event.0012.t: "Nesrovnalosti v účetnictví"
 tgp_governor_contract_event.0012.desc: "Při přepravě vybraných daní lze jisté odchylky v době doručení očekávat. Stav cest, počasí i další nepředvídatelné okolnosti mohou způsobit zpoždění, kterým se nelze vždy vyhnout.\n\nDaně z oblasti [irregular_accounting_destination.GetName] však v poslední době přicházejí s neobvykle velkým zpožděním. A náklady na jejich přepravu, které jsou účtovány mému úřadu, se zdají být čím dál přemrštěnější."
 tgp_governor_contract_event.0012.a: "Tohle si zaslouží důkladnější prošetření."
 tgp_governor_contract_event.0012.a_tt: "Vydej se do [CZProvName(irregular_accounting_destination,'G')] a odhal příčinu těchto nesrovnalostí."
 tgp_governor_contract_event.0012.b: "Jistě se to časem vyřeší samo."
 tgp_governor_contract_event.0003.t: "Nesrovnalosti v účetnictví"
 tgp_governor_contract_event.0003.desc: "Skoro by mě ta důmyslná zpronevěra naplňovala obdivem, kdyby ovšem peníze, které si [dubious_tax_agent.GetShortUIName] [Select_CString(dubious_tax_agent.IsFemale,'odkláněla','odkláněl')] do vlastní kapsy, nebyly moje.\n\nÚředníci se stále snaží rozplést všechny účetní nesrovnalosti, ale to, co zatím odhalili, by k odsouzení bohatě stačilo. A kdyby snad ne, účetní knihy, které se někdo při našem příchodu pokusil spálit, hovoří samy za sebe.\n\nOsoba odpovědná za celou zpronevěru nyní stojí vedle mě a čeká na rozsudek. Zrak upírá k zemi a výraz ve tváři je stejně bezútěšný jako vyhlídky na budoucnost."
 tgp_governor_contract_event.0003.a: "Vzdej se svého nakradeného bohatství a za mřížemi přemýšlej o svém zločinu."
 tgp_governor_contract_event.0003.b: "Takový #EMP podnikavý#! duch by za mřížemi přišel nazmar."
 tgp_governor_contract_event.0003.c: "Tohle by mohlo poškodit mou pověst. Pravda nemusí vyjít najevo."
 tgp_governor_contract_event.0003.d: "Nahradíš škodu a bude ti odpuštěno. Tentokrát."
 tgp_governor_contract_event.0003.e: "Myslím, že to, co #EMP doopravdy#! potřebuješ, je společník..."
 task_contract_reward_effect_confiscation_and_incarceration_desc: "$label_success_standard$"
 task_contract_reward_effect_recruit_embezzler_desc: "$label_success_standard$"
 task_contract_reward_effect_cover_up_desc: "$label_success_standard$"
 task_contract_reward_effect_into_your_pocket_desc: "$label_success_standard$"
 task_contract_reward_effect_continue_the_charade_desc: "$label_success_standard$"
 salt_smugglers: "Pašeráci soli"
 salt_smugglers_contract: "$salt_smugglers$"
 salt_smugglers_request: "Tato situace ti umožní rozhodnout o jejím výsledku"
 salt_smugglers_desc: "Vůdce místní pašerácké bandy byl dopaden a výměnou za svobodu nabízí prozrazení úkrytu ostatních členů."
 salt_smugglers_desc_title: "$task_contract_governance_desc_title$"
 tgp_governor_contract_event.0013.t: "Pašeráci soli"
 tgp_governor_contract_event.0013.desc: "Pašování soli je závažným proviněním proti státní moci. Nedávno byl v oblasti [CZProvName(salt_smugglers_destination,'G')] dopaden vůdce jedné takové bandy psanců. Nyní se dožaduje osobního rozhovoru se mnou a výměnou za vlastní svobodu nabízí vydání všech svých společníků."
 tgp_governor_contract_event.0013.a: "Měl bych si tu nabídku alespoň vyslechnout."
 tgp_governor_contract_event.0013.a_tt: "Vydej se do [CZProvName(salt_smugglers_destination,'G')] a vypořádej se s psancem, ať už po dobrém, nebo po zlém."
 tgp_governor_contract_event.0013.b: "Reagovat na předvolání nějakého psance je pod mou důstojnost."
 tgp_governor_contract_event.0004.t: "Pašeráci soli"
 tgp_governor_contract_event.0004.desc: "Pouta pevně svírají ruce [salt_smuggler.Custom('CZ_Name_G')], ale prolhanou povahu svého zajatce nijak nezkrotila. [Select_CString(salt_smuggler.IsFemale,'Pašeračka','Pašerák')] vystupuje s neohroženou drzostí, jako bychom byli dva obchodníci smlouvající na tržišti, a nikoli soudce a [Select_CString(salt_smuggler.IsFemale,'psankyně','psanec')], [Select_CString(salt_smuggler.IsFemale,'jejíž','jehož')] život visí na vlásku.\n\n„Ano, povím vám, kde se skrývá zbytek mých lidí. Ale nejdřív mi sundejte tohle,“ pronáší [salt_smuggler.GetShortUIName], zvedá spoutaná zápěstí a významně k nim kývá hlavou. „A zaručíte mi bezpečný odchod někam, kde se už nikdy nesetkáme.“"
 tgp_governor_contract_event.0004.a: "Popravte [salt_smuggler.Custom('CZ_Name_A')]! Ať je #EMP tohle#! varování pro celou bandu."
 tgp_governor_contract_event.0004.b: "Platí. Ale ať už tě nikdy nevidím."
 tgp_governor_contract_event.0004.c: "Podrobím [salt_smuggler.Custom('CZ_Name_A')] výslechu. Celou bandu dostaneme za našich podmínek."
 tgp_governor_contract_event.0004.d: "Kdybys prozradil, kde ukrýváš nakradené bohatství, možná bych projevil shovívavost..."
 tgp_governor_contract_event.0004.e: "Někdo s tvými zvláštními schopnostmi by se mi mohl hodit."
 task_contract_reward_effect_execute_smuggler_desc: "$label_success_standard$"
 task_contract_reward_effect_cut_a_deal_desc: "$label_success_standard$"
 task_contract_reward_effect_interrogate_smuggler_desc: "$label_success_standard$"
 task_contract_reward_effect_a_cut_of_the_take_desc: "$label_success_standard$"
 task_contract_reward_effect_recruit_smuggler_desc: "$label_success_standard$"
 hoarding_grain: "Hromadění obilí"
 hoarding_grain_contract: "$hoarding_grain$"
 hoarding_grain_request: "Tato situace ti umožní rozhodnout o jejím výsledku"
 hoarding_grain_desc: "Významná místní rodina hromadí obilí a odmítá je prodávat, čímž žene ceny vzhůru. Zastrašení úředníci mezitím jen nečinně přihlížejí."
 hoarding_grain_desc_title: "$task_contract_governance_desc_title$"
 tgp_governor_contract_event.0014.t: "Hromadění obilí"
 tgp_governor_contract_event.0014.desc: "Není neobvyklé, že bohaté rodiny v dobách hojnosti nakupují mnohem více obilí, než samy potřebují, aby je později prodaly se ziskem. Je to neblahá, avšak rozšířená praxe. Nyní se ke mně ovšem doneslo, že jedna rodina z oblasti [CZProvName(hoarding_grain_destination,'G')] zašla daleko za obvyklé meze.\n\nPodle všeho nashromáždila tolik obilí, že jeho cena vystoupala do výše, kterou si prostý lid už sotva může dovolit."
 tgp_governor_contract_event.0014.a: "Tohle se bez mé osobní přítomnosti nevyřeší."
 tgp_governor_contract_event.0014.a_tt: "Vydej se do [CZProvName(hoarding_grain_destination,'G')] a vyřeš nedostatek obilí."
 tgp_governor_contract_event.0014.b: "Mou pozornost vyžadují mnohem důležitější záležitosti."
 tgp_governor_contract_event.0005.t: "Hromadění obilí"
 tgp_governor_contract_event.0005.desc: "Přepychové vybavení sídla [grain_hoarding_local_notable.Custom('CZ_Name_G')] ostře kontrastuje s ubohými chatrčemi, kolem nichž jsme cestou sem procházeli. [Select_CString(grain_hoarding_local_notable.IsFemale,'Naše hostitelka','Náš hostitel')] se ani nesnaží své bohatství skrývat či zlehčovat. Právě naopak, téměř se v něm vyžívá.\n\n„Odpusťte mi mou neznalost státních záležitostí, ale nechápu, proč se o tuto věc zajímáte, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')],“ pronáší [grain_hoarding_local_notable.GetShortUIName] s neskrývanou drzostí. „Jde přece jen o zcela zákonné obchodní transakce. Jistě máte naléhavější záležitosti, kterým byste se [Select_CString(ROOT.Char.IsFemale,'měla','měl')] věnovat...?“ Poslední slova vyznívají spíše jako konstatování než jako otázka."
 tgp_governor_contract_event.0005.a: "Otevřeme státní zásoby obilí a zaplavíme jím trh."
 tgp_governor_contract_event.0005.b: "Copak není taková malicherná chamtivost pod důstojnost člověka tvého postavení?"
 tgp_governor_contract_event.0005.c: "Možná je to legální, ale #EMP něco#! nekalého se určitě najde."
 tgp_governor_contract_event.0005.d: "Co kdybych od tebe všechno to obilí odkoupil?"
 tgp_governor_contract_event.0005.e: "Za trochu ochoty ke spolupráci by se pro tebe možná našel nějaký úřad."
 task_contract_reward_effect_release_the_grain_desc: "$label_success_standard$"
 task_contract_reward_effect_shame_them_desc: "$label_success_standard$"
 task_contract_reward_effect_intimidate_them_desc: "$label_success_standard$"
 task_contract_reward_effect_purchase_grain_yourself_desc: "$label_success_standard$"
 task_contract_reward_effect_bribe_with_offices_desc: "$label_success_standard$"
 doddering_magistrate: "Vetchý úředník"
 doddering_magistrate_contract: "$doddering_magistrate$"
 doddering_magistrate_request: "Tato situace ti umožní rozhodnout o jejím výsledku"
 doddering_magistrate_desc: "Úředníci tohoto okresu zasílají zoufalé prosby o pomoc. Jejich letitý nadřízený už zjevně není schopen plnit své povinnosti."
 doddering_magistrate_desc_title: "$task_contract_governance_desc_title$"
 tgp_governor_contract_event.0015.t: "Vetchý úředník"
 tgp_governor_contract_event.0015.desc: "Říká se, že s věkem přichází moudrost a zkušenost. Pro úředníky z oblasti [CZProvName(doddering_magistrate_destination,'G')] však toto pořekadlo zjevně neplatí. Společně už zaslali do mého úřadu několik naléhavých proseb, v nichž žádají, aby byl jejich nadřízený, muž mimořádně pokročilého věku, přeřazen na jinou pozici nebo zcela zbaven úřadu."
 tgp_governor_contract_event.0015.a: "Tohle je choulostivá záležitost. Musím ji vyřešit osobně."
 tgp_governor_contract_event.0015.a_tt: "Vydej se do [CZProvName(doddering_magistrate_destination,'G')] a posuď, jak úředník vykonává své povinnosti."
 tgp_governor_contract_event.0015.b: "Není jejich věcí zpochybňovat vlastního nadřízeného."
 tgp_governor_contract_event.0006.t: "Vetchý úředník"
 tgp_governor_contract_event.0006.desc: "Než se [elderly_magistrate.GetShortUIName] vůbec zvedne ze židle a vykoná obvyklé zdvořilostní pozdravy, mám pocit, že bych mezitím mohl prožít celý další život.\n\nPomalá úklona působí zjevně nesmírné obtíže a trvá tak dlouho, že začínám přemýšlet, zda přede mnou právě nenastávají poslední okamžiky jednoho života. Naštěstí přispěchají dva písaři a pomohou [elderly_magistrate.Custom('CZ_Name_D')] znovu se narovnat.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], prokazujete mi až příliš velkou poctu,“ ozve se chraplavý hlas, který skřípe jako kolo starého, opotřebovaného vozu. „Čím vám mohu posloužit, [ROOT.Char.Custom('FormOfAddressForLiege')]?“"
 tgp_governor_contract_event.0006.a: "Povinnosti převezme někdo jiný, ale [elderly_magistrate.GetShortUIName] si úřad ponechá."
 tgp_governor_contract_event.0006.b: "Věk už [elderly_magistrate.Custom('CZ_Name_A')] připravil o schopnost vykonávat úřad. Je načase vynutit odchod."
 tgp_governor_contract_event.0006.c: "Zaslouží si povýšení! Nejlépe někam #EMP mimo dohled#!..."
 tgp_governor_contract_event.0006.d: "Ať dál slouží. Stát přežije každého úředníka."
 tgp_governor_contract_event.0006.e: "Pracovat může dál, ale pouze jako řadový písař."
 task_contract_reward_effect_appoint_substitute_desc: "$label_success_standard$"
 task_contract_reward_effect_force_him_out_desc: "$label_success_standard$"
 task_contract_reward_effect_promote_somewhere_harmless_desc: "$label_success_standard$"
 task_contract_reward_effect_let_him_continue_desc: "$label_success_standard$"
 task_contract_reward_effect_demote_him_desc: "$label_success_standard$"
 burdensome_taxes: "Neúnosné daně"
 burdensome_taxes_contract: "$burdensome_taxes$"
 burdensome_taxes_request: "Tato situace ti umožní rozhodnout o jejím výsledku"
 burdensome_taxes_desc: "Z odlehlé vesnice dorazil prosebník, který žádá o úlevu od daní, jež místní obyvatelé nedokážou zaplatit."
 burdensome_taxes_desc_title: "$task_contract_governance_desc_title$"
 tgp_governor_contract_event.0007.t: "Neúnosné daně"
 tgp_governor_contract_event.0007.desc: "Po dlouhém a únavném dni stráveném vyslýcháním proseb a stížností, které často zaznívají z jedněch a týchž úst, přistupuje poslední žadatel. Je to starší [Select_CString(village_elder.IsFemale,'žena','muž')] v prostém, střídmém oděvu. Vystupuje pokorně, nikoli však poníženě. Jeden z písařů mi podává lístek, z něhož zjišťuji, že tato osoba stojí v čele své vesnice.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ začíná prosebník, „naše vesnice je chudá a o bohatství či blahobytu toho mnoho nevíme. Úroda byla špatná a daně, které máme odvádět, jsou nad naše skromné možnosti. Úpěnlivě vás prosím, ulehčete nám toto břemeno, jinak nám hrozí smrt hladem.“"
 tgp_governor_contract_event.0007.a: "Přeneseme většinu daňového břemene na bohatší oblast."
 tgp_governor_contract_event.0007.b: "Vyměříme jim nižší daně. Veškerou odpovědnost beru na sebe."
 tgp_governor_contract_event.0007.c: "Rozdíl doplatím ze svého. Příští rok už se ale musíte postarat sami."
 tgp_governor_contract_event.0007.d: "Zatím platit nemusíte, ale dluh vám zůstane, dokud jej nesplatíte."
 tgp_governor_contract_event.0007.e: "Kdo nedokáže zaplatit, skončí ve vězení a přijde o svůj majetek."
 task_contract_reward_effect_revise_tax_assessment_desc: "$label_success_standard$"
