 contested_inheritance: "Sporné dědictví"
 contested_inheritance_contract: "$contested_inheritance$"
 contested_inheritance_request: "Tato situace ti umožní rozhodnout o jejím výsledku"
 contested_inheritance_desc: "Zemřela významná místní osobnost a dědicové, kteří se mezi sebou ostře přou o pozůstalost, požádali úřady, aby jejich spor pomohly urovnat."
 contested_inheritance_desc_title: "$task_contract_governance_desc_title$"
 tgp_governor_contract_event.0034.t: "Sporné dědictví"
 tgp_governor_contract_event.0034.desc: "Být [ROOT.Char.GetTitleTierName] znamená víc než jen spravovat území. Mnozí se na mě ve sporných záležitostech obracejí jako na nestrannou autoritu, od níž očekávají spravedlivé rozhodnutí.\n\nPrávě proto mě významná rodina z oblasti [CZProvName(contested_inheritance_destination,'G')] požádala o osobní pomoc s urovnáním obzvlášť vyhroceného dědického sporu, který její členy hluboce rozdělil."
 tgp_governor_contract_event.0034.a: "Nesvornost v tak významné rodině vrhá špatné světlo na celou naši společnost."
 tgp_governor_contract_event.0034.a_tt: "Vydej se do [CZProvName(contested_inheritance_destination,'G')] a ukonči dědický spor."
 tgp_governor_contract_event.0034.b: "Tohle je rodinná záležitost, do které státu nic není."
 tgp_governor_contract_event.0035.t: "Sporné dědictví"
 tgp_governor_contract_event.0035.desc: "Napětí ve vzduchu je téměř hmatatelné, když znovu a znovu probíráme nároky jednotlivých dědiců. Každá další debata však celou záležitost jen více zamotává.\n\nAčkoli se v mé přítomnosti ze všech sil snaží předstírat zdvořilost, mám podezření, že kdyby se jejich skrytá zášť dala stáčet do lahviček, svou silou by předčila jakýkoli jed."
 tgp_governor_contract_event.0035.a: "Za správu pozůstalosti ponese odpovědnost #EMP celá#! rodina."
 tgp_governor_contract_event.0035.b: "Správu pozůstalosti svěříme nejstaršímu žijícímu členu rodiny."
 tgp_governor_contract_event.0035.c: "Za jistý obnos bych možná mohl #EMP změnit#! svůj názor..."
 tgp_governor_contract_event.0035.d: "Musíme respektovat poslední vůli zesnulého."
 tgp_governor_contract_event.0035.e: "Pokusím se je přesvědčit, aby spor vyřešili důstojněji."
 task_contract_reward_effect_declare_communal_property_desc: "$label_success_standard$"
 task_contract_reward_effect_award_according_to_seniority_desc: "$label_success_standard$"
 task_contract_reward_effect_award_to_highest_bidder_desc: "$label_success_standard$"
 task_contract_reward_effect_adhere_to_testament_desc: "$label_success_standard$"
 task_contract_reward_effect_persuade_private_settlement_desc: "$label_success_standard$"
 task_contract_reward_effect_failure_award_to_highest_bidder_desc: "$label_failure_standard$"
 task_contract_reward_effect_failure_persuade_private_settlement_desc: "$label_failure_standard$"
 tgp_governor_contract_event.0021.b.success: "Najdeš spolehlivé důkazy podporující nárok jedné ze stran"
 tgp_governor_contract_event.0021.b.failure: "Další záminka ke sporu může celou situaci jen zhoršit"
 tgp_governor_contract_event.0021.b.toast_success: "Podařilo se ti najít přesvědčivé důkazy ve prospěch jedné ze stran"
 tgp_governor_contract_event.0021.b.toast_failure: "Neúplné záznamy jen prohloubily rozkol mezi oběma stranami"
 tgp_governor_contract_event.0021.d.success: "Vlastníky pozemků tvá nabídka zaujme"
 tgp_governor_contract_event.0021.d.failure: "Tvá nabídka se setká s jednoznačným odmítnutím"
 tgp_governor_contract_event.0021.d.toast_success: "Podařilo se ti využít jejich touhy po zisku k oboustranně výhodné dohodě"
 tgp_governor_contract_event.0021.d.toast_failure: "Ani tvá nabídka nedokázala zmírnit jejich posedlost pozemkem"
 tgp_governor_contract_event.0023.c.success: "Tvé neobvyklé vyšetřovací postupy přinesou ovoce"
 tgp_governor_contract_event.0023.c.failure: "Písaři se jako tajní vyšetřovatelé příliš neosvědčí"
 tgp_governor_contract_event.0023.c.toast_success: "Podvodní prodejci byli přistiženi při činu a zatčeni"
 tgp_governor_contract_event.0023.c.toast_failure: "Z tvých písařů se vyklubali mizerní vyšetřovatelé, které podvodníci snadno přelstili"
 tgp_governor_contract_event.0023.e.success: "Podaří se ti zločince zaskočit"
 tgp_governor_contract_event.0023.e.failure: "Padělatelé vycítí nebezpečí a uprchnou"
 tgp_governor_contract_event.0023.e.toast_success: "Razie proběhla hladce a padělatelé byli dopadeni"
 tgp_governor_contract_event.0023.e.toast_failure: "Prodejci se dozvěděli o tvých plánech a podařilo se jim uprchnout"
 tgp_governor_contract_event.0025.e.success: "Přesvědčíš obchodníky, aby zde zůstali"
 tgp_governor_contract_event.0025.e.failure: "Tvé argumenty se minou účinkem"
 tgp_governor_contract_event.0025.e.toast_success: "Tvé přesvědčování přimělo obchodníky, aby se rozhodli zůstat"
 tgp_governor_contract_event.0025.e.toast_failure: "Karavany se tvými argumenty nenechaly přesvědčit a vydaly se hledat jiné cesty"
 tgp_governor_contract_event.0027.d.success: "Pomocí gest se ti podaří dorozumět s cizinci"
 tgp_governor_contract_event.0027.d.failure: "Obchodníky z dalekých zemí tvá gesta ještě více zmatou"
 tgp_governor_contract_event.0027.d.toast_success: "S jistými obtížemi se ti podařilo s obchodníky dorozumět"
 tgp_governor_contract_event.0027.d.toast_failure: "Tvé pokusy o dorozumění cizince jen ještě více zmátly"
 tgp_governor_contract_event.0029.e.success: "Vypravěč projeví ochotu vyslechnout tvé argumenty"
 tgp_governor_contract_event.0029.e.failure: "Tvé úsilí narazí na neústupnou tvrdohlavost"
 tgp_governor_contract_event.0029.e.toast_success: "Tvá výřečnost přesvědčila [seditious_storyteller.Custom('CZ_Name_A')] ke zmírnění pobuřujících příběhů"
 tgp_governor_contract_event.0029.e.toast_failure: "Vypravěč odmítl tvé výzvy a dál svými příběhy rozdmýchává vášně mezi lidmi"
 tgp_governor_contract_event.0031.a.success: "Tvůj důstojný projev rozptýlí obavy davu"
 tgp_governor_contract_event.0031.a.failure: "Strach rolníků se ukáže být příliš silný, než aby jej šlo utišit"
 tgp_governor_contract_event.0031.a.toast_success: "Tvůj klidný a vyrovnaný projev obyvatele uklidnil"
 tgp_governor_contract_event.0031.a.toast_failure: "Ze strachu před božím trestem na shromáždění nikdo nepřišel"
 tgp_governor_contract_event.0031.d.success: "Tvé klidné a rozhodné jednání pomůže obyvatele uklidnit"
 tgp_governor_contract_event.0031.d.failure: "Odhalený rozsah škod obyvatele ještě více vyděsí"
 tgp_governor_contract_event.0031.d.toast_success: "Podařilo se ti posoudit škody a zahájit opravy i obnovu"
 tgp_governor_contract_event.0031.d.toast_failure: "Odhalení skutečného rozsahu škod mezi obyvateli vyvolalo ještě větší strach"
 tgp_governor_contract_event.0033.d.success: "Obchodnické sdružení získá zpět své právoplatné místo"
 tgp_governor_contract_event.0033.d.failure: "Stejná neschopnost, kvůli které přišli o tržiště, jim zabrání získat je zpět"
 tgp_governor_contract_event.0033.d.toast_success: "S tvou pomocí se obchodnickému sdružení podařilo znovu ovládnout tržiště"
 tgp_governor_contract_event.0033.d.toast_failure: "Ať se sdružení pokusilo o cokoli, své místo na tržišti zpět nezískalo"
 tgp_governor_contract_event.0035.c.success: "Dědicové se doslova předhánějí v nabídkách za tvou přízeň"
 tgp_governor_contract_event.0035.c.failure: "Nikdo z dědiců neprojeví ochotu uspokojit tvou chamtivost"
 tgp_governor_contract_event.0035.c.toast_success: "Nabídky se jen hrnuly a jejich výše ti přinesla nezanedbatelný prospěch"
 tgp_governor_contract_event.0035.c.toast_failure: "Žádný z uchazečů o dědictví nepřistoupil na tvůj návrh"
 tgp_governor_contract_event.0035.e.success: "Podaří se ti přesvědčit rodinu, aby ve sporu pokračovala rozumně a umírněně"
 tgp_governor_contract_event.0035.e.failure: "Tvá doporučení si vyslechnou, ale nebudou se jimi řídit"
 tgp_governor_contract_event.0035.e.toast_success: "Tvůj klidný a rozhodný přístup přiměl rodinu dospět k dohodě"
 tgp_governor_contract_event.0035.e.toast_failure: "Tvé moudré rady přijali s vděčností a vzápětí je hodili za hlavu"
