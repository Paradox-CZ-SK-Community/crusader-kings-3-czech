 tgp_governor_contract_event.0008.t: "Nebezpečný obchod"
 tgp_governor_contract_event.0008.desc: "Do mé síně se nahrnula delegace obchodníků vedená [fearful_merchant.Custom('CZ_Name_I')]. Jejich rozhořčené hlasy se překřikují a všichni požadují ochranu pro své karavany. Další z nich totiž padla za oběť útoku banditů.\n\n„Tato situace je neúnosná, [ROOT.Char.Custom('FormOfAddressForLiege')],“ prohlašuje vůdce delegace.\n\n„Pokud okamžitě nepodniknete kroky k ochraně našeho zboží a životů před těmi divochy, nezbude nám než opustit své obchodní zájmy v oblasti [CZProvName(unsafe_highways_destination,'G')] a přesunout obchod jinam. A spolu s ním i veškerá cla a poplatky, které odvádíme.“ [fearful_merchant.GetShortUIName|U] po tomto troufalém ultimátu očekává mou odpověď."
 tgp_governor_contract_event.0008.a: "Poskytneme vám ozbrojený doprovod, ale za tuto výsadu zaplatíte."
 tgp_governor_contract_event.0008.b: "Rozumím. Vyšleme hlídky, aby střežily cesty."
 tgp_governor_contract_event.0008.c: "Váš obchod je nebezpečný. Copak nemáte vlastní ochranu?"
 tgp_governor_contract_event.0008.d: "Bylo by #EMP nešťastné#!, kdybychom museli přehodnotit vaše daně..."
 tgp_governor_contract_event.0008.e: "S velkým rizikem přichází i velká odměna. Zůstaňte a postarám se, aby se vám to vyplatilo."
