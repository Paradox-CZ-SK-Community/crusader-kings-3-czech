 confusion_of_tongues: "Zmatek jazyků"
 confusion_of_tongues_contract: "$confusion_of_tongues$"
 confusion_of_tongues_request: "Tato situace ti umožní rozhodnout o jejím výsledku"
 confusion_of_tongues_desc: "U našich břehů ztroskotala cizí obchodní loď a nikdo z přeživších nemluví naším jazykem."
 confusion_of_tongues_desc_title: "$task_contract_governance_desc_title$"
 tgp_governor_contract_event.0026.t: "Zmatek jazyků"
 tgp_governor_contract_event.0026.desc: "Obchodníky z dalekých krajů pochopitelně láká blahobyt našeho mocného státu. [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip|U] jim slibuje bohatství, a tak překonávají ohromné vzdálenosti a čelí nesčetným nebezpečím ve snaze přijít k majetku.\n\nPro některé nešťastníky se však tato nebezpečí ukážou být příliš velká, jak se právě stalo [CZPrepV(confusion_of_tongues_destination.GetNameNoTooltip)] [CZProvName(confusion_of_tongues_destination,'L')]. Podle zpráv u našich břehů ztroskotala cizí obchodní loď a mezi přeživšími chybí lodní tlumočník.\n\nMístní úředníci si vůbec nevědí rady s vyčerpanými a zmatenými cizinci."
 tgp_governor_contract_event.0026.a: "Povinnosti [ROOT.Char.GetTitleTierNamePossessive|l] nikdy nekončí."
 tgp_governor_contract_event.0026.a_tt: "Vydej se do [CZProvName(confusion_of_tongues_destination,'G')] a setkej se se zahraničními obchodníky."
 tgp_governor_contract_event.0026.b: "To zní jako potíže. Prostě je nechte, kde jsou."
 tgp_governor_contract_event.0027.t: "Zmatek jazyků"
 tgp_governor_contract_event.0027.desc: "Když dorazím, je místní úředník očividně v koncích. Vyčerpání se v jeho tváři mísí s čirým zoufalstvím.\n\n„Ani jeden z nich nerozumí jedinému slovu, které říkám!“ běduje. „A pokaždé, když se je pokusíme někam odvést, začnou se chovat, jako bychom byli bandité!“\n\nOpodál vidím skupinku ztroskotaných obchodníků, kteří se obezřetně semkli kolem zbytků svého zboží. Jejich strážci nervózně svírají jílce zbraní."
 tgp_governor_contract_event.0027.a: "Postavte jim stany a uvědomte hlavní sídlo. Tam už nějakého tlumočníka najdou."
 tgp_governor_contract_event.0027.b: "Vraťte se na tržiště a zjistěte, zda jim tam někdo nerozumí."
 tgp_governor_contract_event.0027.c: "Jejich loď ztroskotala u #EMP našich#! břehů. Jejich zboží tedy propadá státu."
 tgp_governor_contract_event.0027.d: "Slova nás zklamala, ale možná se domluvíme pomocí gest."
 tgp_governor_contract_event.0027.e: "Prostě je odsud vyžeňte. A bude-li třeba, použijte sílu."
 tgp_governor_contract_event.0027.f: "$epidemic_events.5902.a$"
