 crumbling_bridge: "Zřícený most"
 crumbling_bridge_contract: "$crumbling_bridge$"
 crumbling_bridge_request: "Tato situace ti umožní rozhodnout o jejím výsledku"
 crumbling_bridge_desc: "Zřítil se důležitý most, což vážně ochromilo místní dopravu."
 crumbling_bridge_desc_title: "$task_contract_governance_desc_title$"
 tgp_governor_contract_event.0024.t: "Zřícený most"
 tgp_governor_contract_event.0024.desc: "Údržba důležité infrastruktury patří k základním povinnostem [ROOT.Char.GetTitleTierNamePossessive], takže zpráva o nedávném zřícení mostu [CZPrepV(crumbling_bridge_destination.GetNameNoTooltip)] [CZProvName(crumbling_bridge_destination,'L')] mě znepokojuje o to více.\n\nTato událost může nejen vážně narušit obchod a dopravu, ale také podkopat důvěru v mou správu."
 tgp_governor_contract_event.0024.a: "Vyřiďte jim, ať se připraví na můj příjezd. Už vyrážím."
 tgp_governor_contract_event.0024.a_tt: "Vydej se do [CZProvName(crumbling_bridge_destination,'G')] a vyřeš následky zřícení mostu."
 tgp_governor_contract_event.0024.b: "Vždycky existuje jiný most. Jen si trochu zajdou."
 tgp_governor_contract_event.0025.t: "Zřícený most"
 tgp_governor_contract_event.0025.desc: "Při pohledu na trosky zříceného mostu je jasné, že situace je vážná. Dělníci se usilovně snaží odklidit sutiny, ale zástup obchodníků a pocestných neustále roste. Stále totiž přicházejí další lidé, kteří o nečekané překážce na své cestě neměli ani tušení.\n\nZboží začíná podléhat zkáze a mezi uvázlými cestujícími roste napětí. Pokud situaci nevyřešíme obratně, následky této nehody mohou být dalekosáhlé."
 tgp_governor_contract_event.0025.a: "Cesty jsou tepnami země. Ať s obnovou mostu pomůže vojsko."
 tgp_governor_contract_event.0025.b: "Využijeme všechny dostupné prostředky, abychom co nejrychleji postavili nový most."
 tgp_governor_contract_event.0025.c: "Dokud nebude most obnoven, zřídíme provizorní přívoz."
 tgp_governor_contract_event.0025.d: "Spěch by vedl jen k další pohromě. Postavíme pořádný a pevný most."
 tgp_governor_contract_event.0025.e: "Využijme příležitosti a přesvědčme uvázlé obchodníky, aby se zde usadili."
