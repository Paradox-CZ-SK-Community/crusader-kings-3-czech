 seditious_storytelling: "Pobuřující vyprávění"
 seditious_storytelling_contract: "$seditious_storytelling$"
 seditious_storytelling_request: "Tato situace ti umožní rozhodnout o jejím výsledku"
 seditious_storytelling_desc: "Oblíbený vypravěč začal lidem předkládat příběhy prodchnuté nespokojeností a odporem proti vládě."
 seditious_storytelling_desc_title: "$task_contract_governance_desc_title$"
 tgp_governor_contract_event.0028.t: "Pobuřující vyprávění"
 tgp_governor_contract_event.0028.desc: "Poslední z dnešních prosebníků se se slovy vděčnosti loučí a odchází. Zvuk jeho vzdalujících se kroků však vzápětí přehluší spěšný dusot někoho, kdo zjevně přináší špatné zprávy.\n\nPřichází [concerned_councillor.GetFirstName] se zachmuřenou tváří.\n\n„Právě jsem [Select_CString(concerned_councillor.IsFemale,'obdržela','obdržel')] naprosto #EMP pobuřující#! zprávu, [ROOT.Char.Custom('FormOfAddressForLiege')]! Jeden z těch potulných vypravěčů rozdmýchává nespokojenost mezi obyvateli [CZProvName(seditious_storytelling_destination,'G')] příběhy o zkorumpovaných úřednících a zneužívání státní moci!“"
 tgp_governor_contract_event.0028.a: "Chci si ty příběhy poslechnout na vlastní uši."
 tgp_governor_contract_event.0028.a_tt: "Vydej se do [CZProvName(seditious_storytelling_destination,'G')] a vyslechni si příběhy potulného vypravěče."
 tgp_governor_contract_event.0028.b: "To se teď musím zabývat i obyčejnými #EMP kejklíři#!?"
 tgp_governor_contract_event.0029.t: "Pobuřující vyprávění"
 tgp_governor_contract_event.0029.desc: "Sedím bez povšimnutí v zadní části publika a musím uznat, že zprávy, které se ke mně donesly, byly spíše zdrženlivé než přehnané.\n\nJen naprostý prosťáček by nepochopil, na co naráží příběh o utlačovaných potulných hrdinech, kteří bojují proti ničemným, bezostyšně zkorumpovaným úředníkům a vojákům chovajícím se jako bandité. Hlavní padouch příběhu mi navíc připadá #EMP podezřele#! povědomý.\n\nJeště znepokojivější než samotná slova vypravěče je však zjevné a stále rostoucí nadšení, s nímž je dav přijímá."
 tgp_governor_contract_event.0029.a: "Vydáme veřejné prohlášení odsuzující [seditious_storyteller.Custom('CZ_Name_A')] za narušování veřejného pořádku."
 tgp_governor_contract_event.0029.b: "Ta drzost! Okamžitě zatknout!"
 tgp_governor_contract_event.0029.c: "Najmeme vlastní vypravěče, kteří budou šířit naše příběhy."
 tgp_governor_contract_event.0029.d: "Na všech vystoupeních [seditious_storyteller.Custom('CZ_Name_G')] rozmístíme stráže, aby obecenstvu připomínaly, kde je jeho místo."
 tgp_governor_contract_event.0029.e: "Domluvím si diskrétní schůzku. Možná se mi podaří [seditious_storyteller.Custom('CZ_Name_A')] přivést k rozumu."
