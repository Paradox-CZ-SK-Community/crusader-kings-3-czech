 meritocratic_government_desc: "\n$game_concept_meritocratic_desc$\n\n#F $meritocratic_government$ představuje centralizovanou administrativní vládu sousedních zemí Číny, inspirovanou konfuciánskou byrokracií.#!"
 meritocratic_province_standard: "@meritocratic_standard_administration! Standardní správa"
