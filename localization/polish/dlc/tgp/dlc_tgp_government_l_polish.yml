 steppe_admin_icon_concept: "[steppe_admin_i|E]"
 steppe_admin_government_vassals_label: "Ve vládě typu $steppe_admin_government$ určuje [Concept('obligations','povinnosti')|E] [GetPlayer.Custom('GetProvinceAdministrationConcept')]"
 steppe_admin_government_desc: "\n$game_concept_steppe_admin_desc$\n\n#F Zřízení typu $steppe_admin_government$ spojuje kočovný způsob života s konfuciánskou byrokracií centralizované čínské administrativní vlády.#!"
 steppe_admin_government_house_attribute_flavor_name: "[Concept('powerful_family_attribute','Atribut mocné rodiny')|EU]"
 steppe_admin_government_house_attribute_flavor_name_no_tooltip: "$game_concept_powerful_family_attribute$"
 can_raze_own_holding_meritocratic_khanate_tt: "Aby bylo možné zbořit [Concept('holding','državu')|E] v [Concept('county','hrabství')|E] ovládaném panovníkem se zřízením [Concept('steppe_admin','meritokratický chanát')|E], musí se v jeho hlavním sídle #weak ([province.GetCountyCapitalProvince.GetBaronyNameExplicitly])#! nacházet usedlá [Concept('holding','država')|E] jiného než [Concept('tribal','kmenového')|E] typu a samotné hlavní sídlo nesmí být zbořeno"
