 meritocratic_province_industrial_benefits: "#emphasis #bold Výhody pro [Concept('vassal','vazala')|E]:#!#!\nPlatí zákon [GetLaw('meritocratic_appointment_succession_law').GetName|l]\n\n#alert_trial @alert_icon! Omezeno na [EmptyScope.ScriptValue('meritocratic_province_industrial_max_value')|V0]#!"
 meritocratic_province_industrial_desc: "#low Civilní správa zaměřená na zvyšování produktivity oblasti a její dlouhodobý rozvoj.#!"
