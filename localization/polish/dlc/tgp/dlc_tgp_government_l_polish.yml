 meritocratic_province_metropolitan_text_icon: "@meritocratic_metropolitan_administration!"
 meritocratic_province_metropolitan_benefits: "#emphasis #bold Výhody pro [Concept('vassal','vazala')|E]:#!#!\n$EFFECT_LIST_BULLET$ Zvyšuje [Concept('governor_efficiency','efektivitu guvernéra')|E] podle [Concept('diplomacy','diplomacie')|E]#indent_newline:4 \n#weak Každý bod [Concept('skill','dovednosti')|E] přidává dalších [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/]#!#!\n$EFFECT_LIST_BULLET$ Platí zákon [GetLaw('meritocratic_appointment_succession_law').GetName|l]\n\n#alert_trial @alert_icon! Omezeno na [EmptyScope.ScriptValue('meritocratic_province_metropolitan_max_value')|V0]#!"
 meritocratic_province_metropolitan_desc: "#low Efektivní civilní správa určená pro větší městské oblasti. Klade značný důraz na účelné využívání daňových příjmů a prosperitu měst.#!"
 meritocratic_province_metropolitan_amount_desc: "$meritocratic_province_metropolitan_short$ – dosažen limit"
 meritocratic_province_military: "@meritocratic_military_administration! Vojenská správa"
 meritocratic_province_military_short: "@meritocratic_military_administration! Vojenská"
 meritocratic_province_military_text_icon: "@meritocratic_military_administration!"
 meritocratic_province_military_benefits: "#emphasis #bold Výhody pro [Concept('vassal','vazala')|E]:#!#!\n$EFFECT_LIST_BULLET$ Platí zákon [GetLaw('meritocratic_military_appointment_succession_law').GetName|l]\n\n#alert_trial @alert_icon! Omezeno na [EmptyScope.ScriptValue('meritocratic_province_military_max_value')|V0]#!"
 meritocratic_province_military_desc: "#low Vojenská správa umožňující shromažďování vojska. Poskytuje panství prostředky k vlastní obraně a v případě potřeby i k rozšiřování jeho hranic.#!"
 meritocratic_province_military_amount_desc: "$meritocratic_province_military_short$ – dosažen limit"
 meritocratic_province_protectorate: "@meritocratic_protectorate_administration! Protektorátní správa"
 meritocratic_province_protectorate_short: "@meritocratic_protectorate_administration! Protektorátní"
 meritocratic_province_protectorate_text_icon: "@meritocratic_protectorate_administration!"
 meritocratic_province_protectorate_benefits: "#emphasis #bold Výhody pro [Concept('liege','lenního pána')|E]:#!#!\n$EFFECT_LIST_BULLET$ Odemyká [Concept('interaction','interakci')|E] #high $frontier_influence_war_interaction$#!, která umožňuje [Concept('liege','lennímu pánovi')|E] požádat [Concept('vassal','vazala')|E] o vyhlášení války za účelem získání cizího [Concept('title','titulu')|E] na úrovni [Concept('duchy','vévodství')|E]\n\n#emphasis #bold Výhody pro [Concept('vassal','vazala')|E]:#!#!\n$EFFECT_LIST_BULLET$ Zvyšuje [Concept('governor_efficiency','efektivitu guvernéra')|E] podle [Concept('martial','válečnictví')|E]#indent_newline:4 \n#weak Každý bod [Concept('skill','dovednosti')|E] přidává dalších [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/]#!#!\n$EFFECT_LIST_BULLET$ Platí zákon [GetLaw('meritocratic_military_appointment_succession_law').GetName|l]\n\n#alert_trial @alert_icon! Omezeno na [EmptyScope.ScriptValue('meritocratic_province_protectorate_max_value')|V0]#!"
 meritocratic_province_protectorate_amount_desc: "$meritocratic_province_protectorate_short$ – dosažen limit"
 steppe_admin_government: "Meritokratický chanát"
 steppe_admin_government_adjective: "$steppe_admin_government$"
