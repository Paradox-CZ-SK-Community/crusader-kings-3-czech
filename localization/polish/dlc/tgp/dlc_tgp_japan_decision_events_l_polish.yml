l_polish:
 tgp_japan_decision.9001.t.fief: "Léno rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 tgp_japan_decision.9001.t.cadet: "$create_cadet_branch_decision$"
 tgp_japan_decision.9001.desc.fief_split_house: "Na svůj původ v rodu [old_house.GetBaseNameNoTooltip] jsem [Select_CString(ROOT.Char.IsFemale,'hrdá','hrdý')], ale nastal čas vydat se vlastní cestou a založit vlastní léno na území [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetNameNoTier]. Ať už si o tom hlava mého rodu, [old_head.GetTitledFirstName], myslí cokoli."
 tgp_japan_decision.9001.desc.fief_name: "\n\nZbývá už jen rozhodnout, jak pojmenovat svůj nový rod..."
 tgp_japan_decision.9001.desc.cadet: "Na svůj původ v rodu [old_house.GetBaseNameNoTooltip] jsem [Select_CString(ROOT.Char.IsFemale,'hrdá','hrdý')], ale nastal čas vydat se vlastní cestou a založit vlastní rod. Ať už si o tom hlava mého dosavadního rodu, [old_head.GetTitledFirstName], myslí cokoli."
 tgp_japan_decision.9001.desc.permission: "\n\nS požehnáním [regent.Custom('CZ_TitledFirstName_G')] se nemusím obávat výtek z hlavního města!"
 tgp_japan_decision.9001.desc.crime: "\n\nAž se o tom [regent.GetTitledFirstName] dozví, jistě vzplane hněvem, ale tím si nemusím příliš lámat hlavu!"
 tgp_japan_decision.9001.desc.feudal: "\n\nRod [ROOT.Char.GetHouse.GetBaseNameNoTooltip] konečně vstupuje do řad nové šlechty, v jejímž čele stojí [regent.GetTitledFirstName]."
 tgp_japan_decision.9001.a.fief: "Vychází nové slunce."
 tgp_japan_decision.9001.a.cadet: "$tgp_japan_decision.9001.a.fief$"
 tgp_japan_decision.9002.t: "$tgp_japan_decision.9001.t.fief$"
 tgp_japan_decision.9002.t.landless: "$tgp_japan_decision.9001.t.fief$"
 tgp_japan_decision.9002.desc: "V mezích byrokratického systému jsme se snažili prosadit, jak nejlépe to šlo. Ale tomu je konec."
 tgp_japan_decision.9002.desc.landed: "Nastal čas vydat se vlastní cestou a proměnit území [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetNameNoTier] v trvalé léno rodu [ROOT.Char.GetHouse.GetBaseName]."
 tgp_japan_decision.9002.desc.landless: "Nastal čas vydat se vlastní cestou a odvrhnout veškerou okázalost a výsady úřednického stavu."
 tgp_japan_decision.9002.a: "Nad rodem [ROOT.Char.GetHouse.GetBaseNameNoTooltip] vychází nové slunce."
 japanese_noble_family_name: "[new_house.GetNameNoTooltip] $c_nf_japan_suffix$"
 japanese_house_first_name: "[new_head.GetUIFirstNameOnlyNotMeNoTooltipNoFormat]-rjú"
 japanese_house_random_barony: "[random_barony.GetNameNoTierNoTooltip]"
 japanese_house_domicile_barony: "[domicile_barony.GetNameNoTierNoTooltip]"
 japanese_house_primary_county: "[primary_county.GetNameNoTierNoTooltip]"
 japanese_house_domicile_county: "[domicile_county.GetNameNoTierNoTooltip]"
 japanese_house_name_custom: "[new_head.GetLocalizedText( 'new_japanese_house_name' )]"
 japanese_house_name_flag: "[new_head.MakeScope.Var( 'new_japanese_house_name' ).GetFlagName]"
 japanese_house_name_fallback: "[old_head.GetHouse.GetName]"
 japanese_house_name: "[new_head.GetHouse.GetNameNoTooltip]"
 japanese_dynasty_name: "[new_head.GetDynasty.GetNameNoTooltip]"
 tgp_japan_decision.9005.t: "$tgp_japan_establish_house_fief_decision$: Rozdělení rodu"
 tgp_japan_decision.9005.t.landless: "$tgp_japan_establish_soryo_manor_decision$: Rozdělení rodu"
 tgp_japan_decision.9005.desc: "Jaká troufalost! [new_head.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', new_head)] z mé vlastní rodiny, právě [Select_CString(new_head.IsFemale,'vyhlásila','vyhlásil')] založení nového rodu [new_head.GetHouse.GetBaseName], v jehož čele nyní stojí.\n\nNemohu předstírat, že vítám takto otevřené odmítnutí své autority nad rodem [ROOT.Char.GetHouse.GetBaseName]. Jen ať se ukáže, jak si povede bez mé ochrany..."
 tgp_japan_decision.9005.a: "Slunce září jasně i bez stínu rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 tgp_japan_decision.9101.t: "Šógunát rodu [shogun.GetHouse.GetBaseNameNoTooltip]"
 tgp_japan_decision.9101.desc: "Země [GetTitleByKey('e_japan').GetBaseNameNoTierNoTooltip] vstupuje do nové éry, v níž moc přechází od pera k meči. Pod vedením rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip] se konečně obnoví pořádek a poslední pozůstatky staré byrokracie se stanou pouhou vzpomínkou.\n\nAť však nikdo nepochybuje — svou autoritu odvozuji od našeho božského panovníka, jímž je [ceremonial_liege.GetTitleAsNameNoTooltip]..."
 tgp_japan_decision.9101.a: "Nezbytné opatření k zajištění míru..."
 tgp_japan_decision.9102.t: "$tgp_japan_decision.9101.t$"
 tgp_japan_decision.9102.desc: "V čele nového šógunátu stojí [shogun.GetName] a nekonečným dvorským poradám je konec. Skutečná moc nyní patří meči a válečníkům, kteří přinášejí bezpečí a pořádek přímo do rukou lidu.\n\n"
 tgp_japan_decision.9102.admin: "Byla mi odebrána moc a mé země připadly šógunovi. Na mé místo nastupují váleční štváči, kteří vládnou silou namísto slov..."
 tgp_japan_decision.9102.feudal: "Naše země zůstávají v bezpečí a moc se nám vrací do rukou. V této nové éře rozhoduje síla."
 tgp_japan_decision.9102.fallback: "Snad se toto rozhodnutí časem ukáže jako prospěšné."
 tgp_japan_decision.9102.a.admin: "Nastávají kruté nové pořádky."
 become_shogun_ritsuryo_vassals_tooltip: "#N Počet [Concept('vassals','vazalů')|E] v postavení [Concept('governor','guvernéra')|E], kteří se postaví proti tobě: [ritsuryo_count|0V]#!"
 become_shogun_soryo_vassals_tooltip: "#P Počet [Concept('feudal','feudálních')|E] [Concept('vassals','vazalů')|E], kteří se k tobě přidají: [soryo_count|0V]#!"
 become_shogun_allied_vassals_tooltip: "#P Počet [Concept('allied','spojeneckých')|E] [Concept('vassals','vazalů')|E] nebo vazalů ze stejného [Concept('house','rodu')|E], kteří se k tobě přidají: [allied_count|0V]#!"
 tgp_japan_decision.9201.t: "$tgp_japan_imperial_branch_decision$"
 tgp_japan_decision.9201.desc: "Ačkoli mi v žilách koluje císařská krev a skutečně pocházím z rodu [nearest_emperor.GetTitledFirstName], mého předka ([ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('nearest_emperor'))]), mé poslání i osud mých potomků leží daleko za zdmi císařského paláce.\n\nVzdám se veškerých nároků na [ROOT.Char.GetTopLiege.GetPrimaryTitle.MakeScope.Var('administrative_ui_special_title').Title.GetDefinitiveName] a přijmu jedno z tradičních rodových jmen [Glossary( 'honsei', 'HONSEI_GLOSS' )], udělovaných potomkům císařského rodu zbaveným dědických práv: [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] nebo [Glossary( 'Taira', 'TAIRA_GLOSS' )].\n\n"
 tgp_japan_decision.9201.both: "Obě jména již v minulosti obdrželi potomci [nearest_emperor.Custom('CZ_TitledFirstNameNoTooltip_G')]. V čele těchto rodů stojí [minamoto_head.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('minamoto_head'))]) a [taira_head.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('taira_head'))])."
 tgp_japan_decision.9201.minamoto: "Rod [nearest_emperor.GetFirstNameNoTooltip] $dynn_Minamoto$ již zapustil kořeny. V jeho čele stojí [minamoto_head.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('minamoto_head'))])."
 tgp_japan_decision.9201.taira: "Rod [nearest_emperor.GetFirstNameNoTooltip] $dynn_Taira$ již zapustil kořeny. V jeho čele stojí [taira_head.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('taira_head'))])."
 tgp_japan_decision.9201.a: "Připojím se k rodu [minamoto_house.GetNameNoTooltip] $dynn_Minamoto$."
 tgp_japan_decision.9201.b: "Mé místo je v rodu [taira_house.GetNameNoTooltip] $dynn_Taira$."
 tgp_japan_decision.9201.c: "Přijmu jméno $dynn_Minamoto$."
 tgp_japan_decision.9201.c.tt: "Založíš [Concept('dynasty','dynastii')|E] #V [nearest_emperor.GetFirstNameNoTooltip] Minamoto#!"
 tgp_japan_decision.9201.d: "Jméno „$dynn_Taira$ [ROOT.Char.GetFirstNameNoTooltip]“ má v sobě jistou vznešenost."
 tgp_japan_decision.9201.d.tt: "Založíš [Concept('dynasty','dynastii')|E] #V [nearest_emperor.GetFirstNameNoTooltip] Taira#!"
 tgp_japan_decision.9201.message_title: "Větve císařského rodu"
 new_honsei_house_name: "[nearest_emperor.GetFirstNameNoTooltip]"
 may_found_noble_family_tt: "Můžeš se stát hlavou nové [Concept('noble_family','šlechtické rodiny')|E]"
 will_found_noble_family_tt: "Staneš se hlavou nové [Concept('noble_family','šlechtické rodiny')|E]"
 tgp_japan_decision.9301.t: "Otevřená klec"
 tgp_japan_decision.9301.desc: "Jako císař jsem znovu [Select_CString(ROOT.Char.IsFemale,'zaujala','zaujal')] své právoplatné místo v čele tohoto panství.\n\nMá moc už není v rukou těch, kdo ji zneužívali k naplnění vlastních ambicí. Veškerá vláda se konečně vrátila na Chryzantémový trůn."
 tgp_japan_decision.9301.a: "Budu sluncem, které této zemi ukáže cestu."
 tgp_japan_decision.9302.t: "Vítězství [tenno.Custom('CZ_TitleAsNameNoTooltip_G')]"
 tgp_japan_decision.9302.desc: "Zpráva o návratu $game_concept_tenno_possessive$ se šíří zemí jako požár. [tenno.GetName] znovu [Select_CString(tenno.IsFemale,'prosadila','prosadil')] svou císařskou autoritu, aby vyrvala moc z rukou zahálčivých a zlovolných mocipánů.\n\nZ Chryzantémového trůnu nyní hodlá přímo vládnout lidu této země. Císařská vláda už nebude pouhou obřadní záležitostí."
 tgp_japan_decision.9302.a: "Nechť se tím obnoví pořádek."
 tgp_japan_decision.9401.t: "Metafory a slabiky"
 tgp_japan_decision.9401.desc: "Den za dnem, noc za bezesnou nocí se pokouším proniknout do tajů poezie. Kolem mě poletují listy papíru pokryté čmáranicemi a inkoustovými tahy, které zůstávají jako stopy mého usilovného studia.\n\nNadešel čas rozhodnout se, kudy dál. Stojí toto úsilí za to, nebo bych měl své snažení vzdát?"
 tgp_japan_decision.9401.a: "Nevzdám se. Já to #EMP pochopím#!!"
 tgp_japan_decision.9401.a.toast.success: "Podařilo se ti proniknout do tajů poezie"
 tgp_japan_decision.9401.a.toast.failure: "Taje poezie ti stále unikají"
 tgp_japan_decision.9401.b: "Rozmyslel[Select_CString(ROOT.Char.IsFemale,'a','')] jsem si to."
 tgp_japan_decision.9500.t: "Nová životní cesta"
 tgp_japan_decision.9500.desc: "S otevřenou náručí vítám nově nalezené osvícení, které mě přivádí k duchovnímu znovuzrození. Jako bych se právě [Select_CString(ROOT.Char.IsFemale,'narodila','narodil')] znovu.\n\nSvůj život zasvětím víře, již vyznávám — [ROOT.Char.GetFaith.GetName] — a zbývající dny strávím jejím praktikováním a předáváním poznání, která na své cestě získám.\n\nBudu sloužit [ROOT.Char.GetLiege.Custom('CZ_TitleAsName_D')] a hledat soulad mezi naším kulturním dědictvím a přírodou, jejíž moudrost mi vždy přinese nové poučení."
 tgp_japan_decision.9500.a: "Vítám tě, nebeská Čistá země."
 tgp_japan_decision.9603.t: "Zavedení správy sórjó: Výzva k odporu"
 tgp_japan_decision.9603.desc: "Bezmezná ctižádost [daijo_daijin.Custom('CZ_TitledFirstName_G')] nezná hranic. Nyní otevřeně prosazuje reformy, které by upevnily moc rodu [daijo_daijin.GetHouse.GetBaseNameNoTooltip] a jeho spojenců.\n\nAť už se na správě Japonska shodneme, či nikoli, představa, že by rod [daijo_daijin.GetHouse.GetBaseNameNoTooltip] získal takovou převahu, by nás všechny měla přimět k zamyšlení."
 tgp_japan_decision.9603.leader: "\n\nDo čela odporu se postavila postava, kterou všichni znají jako [leader.GetTitledFirstName]. Právě teď svolává svá vojska."
 tgp_japan_decision.9603.a: "Rod [ROOT.Char.GetHouse.GetBaseNameNoTooltip] tohle nestrpí."
 tgp_japan_decision.9603.a.bloc: "Uskupení [ROOT.Char.GetConfederation.GetName] tohle nestrpí."
 tgp_japan_decision.9603.b: "To není náš boj."
 tgp_japan_decision.9603.a.tt: "Všichni členové uskupení [THIS.Char.GetConfederation.GetName|V] se zapojí do [Concept('war','války')|E]"
 tgp_japan_decision.9605.t: "Zavedení správy sórjó: Do zbraně"
 tgp_japan_decision.9605.desc: "Zatímco prosazuji reformy a mé záměry se vyjasňují, zrádci se začínají shromažďovat. Do čela jejich odporu se staví [leader.GetTitledFirstName] z rodu [leader.GetHouse.GetBaseNameNoTooltip] a už nyní svolává početné vojsko.\n\nNa tom však nezáleží. Na bojišti se jim postavíme my, rod [ROOT.Char.GetHouse.GetBaseNameNoTooltip], a právě rod [ROOT.Char.GetHouse.GetBaseNameNoTooltip] zvítězí."
 tgp_japan_decision.9605.peace: "Zatímco prosazuji reformy a mé záměry se vyjasňují, odpovědí je pouhé ticho. Očekávaný odpor se vůbec nedostavil. Možná jsem [Select_CString(ROOT.Char.IsFemale,'podcenila','podcenil')] důvěru, kterou panství chová k rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip].\n\nKdyž nám žádní zrádci nestojí v cestě, může Japonsko konečně vzkvétat v nové éře blahovolné vlády rodu [daijo_daijin.GetHouse.GetBaseNameNoTooltip]..."
 tgp_japan_decision.9605.a: "Tyto vzbouřence rozdrtíme."
 tgp_japan_decision.9605.b: "Panství poznalo, co je správné."
 tgp_japan_decision.9606.t: "Zavedení správy sórjó: Nadvláda rodu [daijo_daijin.GetHouse.GetBaseNameNoTooltip]"
 tgp_japan_decision.9606.desc: "Pomýlená vojska vzbouřenců byla konečně poražena. Když přede mě v poutech přivádějí jejich vůdce, jímž je [leader.GetTitledFirstName], málokdo ještě pochybuje, že slibovaný mír máme na dosah.\n\nNyní, když všichni odpůrci umlkli, může Japonsko konečně vzkvétat v nové éře blahovolné vlády rodu [daijo_daijin.GetHouse.GetBaseNameNoTooltip]..."
 tgp_japan_decision.9606.a: "Nevyhnutelné a nezbytné."
 tgp_japan_decision.9607.desc: "K úžasu celého hlavního města vítězí [daijo_daijin.GetTitledFirstName] nad odpůrci svých reforem, kteří jsou nyní označováni za vzbouřence. Panství tak vstupuje do nové éry, v níž bude vládnout rod [daijo_daijin.GetHouse.GetBaseNameNoTooltip].\n\n"
 tgp_japan_decision.9607.desc.other: "Nezbývá než doufat, že rod [ROOT.Char.GetHouse.GetBaseNameNoTooltip] najde v novém uspořádání důstojné místo."
 tgp_japan_decision.9607.desc.winner: "Naše věrná služba rodu [daijo_daijin.GetHouse.GetBaseNameNoTooltip] v této spravedlivé věci bude nepochybně odměněna."
 tgp_japan_decision.9607.desc.loser: "Pro [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTooltip] i rod [ROOT.Char.GetHouse.GetBaseNameNoTooltip] nastal temný den..."
 tgp_japan_decision.9607.a: "Je nad čím přemýšlet."
 tgp_japan_decision.9901.t: "Tennó z rodu Jamato opět na trůnu"
 tgp_japan_decision.9901.desc: "Tennó opět pevně stojí v čele země a Chryzantémový trůn se vrací svému právoplatnému dědici. Jeho vláda neznamená pouhé obnovení vznešeného titulu či postavení, ale také dávného pouta, které rod Jamato spojuje s touto zemí."
 tgp_japan_decision.9901.a: "Bude mi ctí radit [scion.Custom('CZ_TitledFirstName_D')]."
 tgp_japan_decision.9901.a.scion: "Konečně!"
 tgp_japan_decision.9902.desc: "Posvátná krev rodu Jamato opět dává císařskému paláci poznat svou přítomnost. [scion.GetName], potomek bohyně Amaterasu, nyní dědí jeho odkaz stejně jako v dávných časech.\n\nS návratem k tradicím může panství znovu vzkvétat pod zářivým světlem Chryzantémového trůnu."
 tgp_japan_decision.9902.a: "Ať žije tennó!"
 tgp_japan_decision.9911.t: "Obnovení byrokracie ricurjó"
 tgp_japan_decision.9911.desc: "Nadešel čas nastolit nový způsob vlády. Nikoli hrubou silou, ale perem.\n\nSpravedlnost může zajistit pouze řádně uspořádaná státní správa, zatímco válečníci překrucují zákony podle vlastní vůle. Za mé vlády budou zákony jasné, spravedlivé a pevné, přesně jak si přáli naši vznešení předkové."
 tgp_japan_decision.9911.rebel: "\n\nProti návratu ke způsobům našich předků se staví [rebel.GetName]. Vojska vzbouřenců už táhnou do boje a mé odhodlání obnovit úřednickou správu tak čeká těžká zkouška."
 tgp_japan_decision.9911.a: "Staré způsoby jsou nejlepší."
 tgp_japan_decision.9912.desc: "[kampaku.GetName] se vrací k odkazu našich předků a prosazuje obnovení úřednické správy namísto vlády válečnického stavu. Usiluje o nastolení pořádku v panství a navrácení moci císařskému trůnu a dvoru na úkor místních klanů."
 tgp_japan_decision.9912.rebel: "\n\nTak zásadní změny se však neobejdou bez svárů. Proti [kampaku.Custom('CZ_FirstName_G')] povstává [rebel.GetName] a někteří další se k tomuto odporu přidávají..."
 tgp_japan_decision.9912.b: "Své moci se nevzdám!"
 tgp_japan_decision.9913.desc: "[actor.GetTitledFirstName] je [Select_CString(actor.IsFemale,'pošetilá','pošetilý')] a vlastní slávu staví nad dobro říše. Nebudu nečinně přihlížet, jak náš lenní pán zneužívá své věrné vazaly. Vyzývám tě, aby ses ke mně [Select_CString(ROOT.Char.IsFemale,'přidala','přidal')] v boji za sesazení [Select_CString(actor.IsFemale,'této tyranky','tohoto tyrana')]."
 tgp_japan_decision.9913.a: "Nebudeš v tom [Select_CString(actor.IsFemale,'sama','sám')]!"
 tgp_japan_decision.9913.b: "Zrádcem jsi přece ty!"
 tgp_japan_decision.9960.t: "Prosazení oblastní nadvlády"
 tgp_japan_decision.9960.intro: "Sjednotím [title_scope.Custom('CZ_LandedNameNoTier_A')] pod svým praporem. Tento kout země se stane baštou stability a příkladem pro naši říši zmítanou chaosem."
 tgp_japan_decision.9960.agree: "\n\nMístní páni projevují velkou moudrost..."
 tgp_japan_decision.9960.partial_war: "\n\nZatímco rozumní místní páni souhlasí, několik pošetilců se raději shromažďuje pod praporem [main_defender.Custom('CZ_Name_G')], než aby uznali mou nadvládu."
 tgp_japan_decision.9960.full_war: "\n\nMístní páni snad přímo touží po rozdělení země! Ač je to pošetilé, raději se shromažďují pod praporem [main_defender.Custom('CZ_Name_G')], než aby uznali mou nadvládu."
 tgp_japan_decision.9960.a: "...Snad zmoudří v příštím životě."
 tgp_japan_decision.9960.b: "...a všichni uznávají mou nadvládu."
 tgp_bloc_members_join_war_effect_tt: "Pokud stojíš v čele [Concept('bloc','bloku')|E], jeho členové se zapojí do tvé [Concept('war','války')|E]"
 tgp_japan_assert_regional_dominion_kampaku_crime_effect: "@warning_icon! #X [Concept('ceremonial_regent','Vládnoucí regent')|EU] používá systém [Concept('ritsuryo','ricurjó')|E] a bude toto jednání považovat za [crime_i|E][Concept('crime','zločin')|E]#!"
 tgp_japan_decision.9961.t: "[title_scope.GetNameNoTierNoTooltip] pod jedním praporem"
 tgp_japan_decision.9961.desc: "Pro [title_scope.Custom('CZ_LandedNameNoTier_A')] nastal slavný den! Některým trvalo déle, než pochopili moudrost mé vlády, ale záplava šípů a plamenů dokáže být znamenitým učitelem.\n\nBrzy se na tento spor zapomene. Krev padlých zúrodní rýžová pole pro děti zítřka. Nechť naše jednota ukáže celé říši cestu vpřed."
 tgp_japan_decision.9961.a: "Kde jinde ještě může zavlát můj prapor?"
 tgp_japan_decision.9962.t: "Můj prapor byl zlomen"
 tgp_japan_decision.9962.desc: "Má věc byla spravedlivá. K žádné bitvě nemělo dojít, a přece se bojovalo. Po porážce už nikdo nedbá mé moudrosti. Vládne chaos a [title_scope.GetName] je obrazem celé říše.\n\nMy, kteří toužíme po harmonii, trpíme, zatímco ti s pokřiveným duchem slaví úspěchy."
 tgp_japan_decision.9962.a: "Co teď?"
 tgp_japan_decision.9963.opening: "[ROOT.Char.GetName], můj prapor tě volá,"
 tgp_japan_decision.9963.desc: "Na vlastní oči jsi [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')], jaké sváry sužují naši říši. Já, [super_soryo.GetName], sjednotím [title_scope.Custom('CZ_LandedName_A')] a vytvořím baštu míru a stability. Podřiď se mé moci, nebo se přidej k pošetilcům, kteří se ve své zaslepenosti opovažují vzdorovat."
 tgp_japan_decision.9963.a: "Podřídím se."
 tgp_japan_decision.9963.b: "Do války!"
 tgp_japan_decision.9963.a.tt: "Pokud [super_soryo.GetShortUIName] zvítězí ve válce [super_soryo_war.GetName], získá vládu nad [title_scope.Custom('CZ_LandedName_I')] a ty se staneš [Select_CString(super_soryo.IsFemale,'jejím','jeho')] [Concept('vassal','vazalem')|E]"
 super_soryo_war_no_holder_custom_tooltip: "Zahájíš [Concept('domination_war','válku o dominanci')|E] proti [main_defender.GetShortUIName] o území [title_scope.Custom('CZ_LandedName_G')]\n\t$BULLET$Každý [Concept('holder','držitel')|E] [Concept('county','hrabství')|E], které [Concept('de_jure','de iure')|E] náleží k území [title_scope.Custom('CZ_LandedName_G')], se přidá na stranu obránců vedených postavou [main_defender.GetShortUIName] #weak (@soldier_icon![super_soryo_war_current_enemy_strength|N0])#!"
 super_soryo_potential_peaceful: "@alert_icon!Aby se všichni [Concept('holder','držitelé')|E] [Concept('county','hrabství')|E], která [Concept('de_jure','de iure')|E] náleží k území [title_scope.Custom('CZ_LandedName_G')], stali tvými [Concept('vassal','vazaly')|E] bez boje, musíš splnit následující podmínky:\n$EFFECT_LIST_BULLET$Tvá [Concept('prestige_level','úroveň slávy')|E] je [prestige_i][GetModifier( 'prestige_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$Tvá [Concept('legitimacy_level','úroveň legitimity')|E] je alespoň #V 3#!\n$EFFECT_LIST_BULLET$Máš vysokou [dread_i][Concept('dread','hrůzu')|E]\n$EFFECT_LIST_BULLET$Disponuješ drtivou @soldier_icon!vojenskou převahou#!"
 super_soryo_reward_peaceful: "Všichni [Concept('holder','držitelé')|E] [Concept('county','hrabství')|E], která [Concept('de_jure','de iure')|E] náleží k území [title_scope.Custom('CZ_LandedName_G')], se stanou tvými [Concept('vassal','vazaly')|E]"
