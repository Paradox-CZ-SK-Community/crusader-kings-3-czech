 tgp_japan_assert_regional_dominion_government_decision_shogun_desc: "Bezmocní byrokraté byli smeteni a nastává věk vlády válečníků! V čele státu stojí [Concept('shogun','šógun')|E] a řídí jej jako z vojenského ležení. Místní vlády se musí chopit samurajové! Naši sousedé buď pochopí moudrost tohoto kroku, nebo je smete záplava šípů a plamenů."
