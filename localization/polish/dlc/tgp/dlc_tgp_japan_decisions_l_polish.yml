 tgp_japan_establish_house_fief_capital_domicile_trigger: "Tvůj [Concept('domicile','domicil')|E] se NESMÍ nacházet v [Concept('county','hrabství')|E], kde leží [Concept('capital','hlavní sídlo')|E] panství [THIS.Char.GetTopLiege.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] #weak ([THIS.Char.GetTopLiege.GetCapitalLocation.GetTitle.GetDeJureLiege.GetNameNoTier])#!"
