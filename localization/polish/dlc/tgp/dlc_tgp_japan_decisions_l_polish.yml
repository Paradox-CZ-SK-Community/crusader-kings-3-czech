 tgp_japan_train_with_troops_decision_desc: "Síla každé armády závisí nejen na výcviku a výzbroji, ale také na bojovém duchu jejích mužů. Shromáždím své vojáky a připomenu jim slávu i kořist, které přináší vítězství, stejně jako potupu porážky. Povzbudím je, aby v boji za naši věc vydali ze sebe všechno."
