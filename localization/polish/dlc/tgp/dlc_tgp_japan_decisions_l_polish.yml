 tgp_japan_become_shogun_decision_desc: "Nekonečné politické intriky císařského dvora se přežily. Někdejší okázalost a prázdné ceremoniály podkopaly základy starého pořádku. Nastal čas, aby pevná ruka nastolila nový řád založený na službě, rodové věrnosti a síle oceli."
 tgp_japan_become_shogun_decision_tooltip: "Upevni moc šógunátu nad územím [GetTitleByKey('e_japan').GetBaseNameNoTier]"
 tgp_japan_become_shogun_decision_confirm: "Založit trvalý šógunát"
 tgp_japan_no_other_powerful_forces_trigger: "Žádný [Concept('landed','zeměpán')|E] mezi [Concept('vassals','vazaly')|E] panství [GetTitleByKey('e_japan').GetBaseNameNoTier], jehož vojenská síla včetně spojenců přesahuje #V 50 %#! tvé celkové vojenské síly, nesmí stát proti tobě, pokud není tvým [Concept('ally','spojencem')|E], členem tvého [Concept('house','rodu')|E] nebo ti není [Concept('hooked','zavázán')|E] #weak (Aktuálně: [SCOPE.ScriptValue('japanese_shogun_opposition_vassals_value')|0V])#!"
 tgp_japan_become_shogun_decision_hoken_county_trigger: "Žádné z [Concept('counties','hrabství')|E], která [Concept('de_jure','de iure')|E] náleží k území [GetTitleByKey('e_japan').GetBaseNameNoTier], nesmí být drženo [Concept('vassals','vazaly')|E] se systémem [Concept('government','vlády')|E] [GetGovernment('japan_administrative_government').GetName] #weak (Aktuálně: [SCOPE.ScriptValue('tgp_japan_shogunate_ritsuryo_county_current_value')|0V])#!"
 tgp_japan_become_shogun_decision_centralization_trigger: "Musíš mít alespoň [Concept('law','zákon')|E] [GetLaw('japanese_bureaucracy_2').GetName]"
 tgp_japan_become_shogun_decision_top_liege_trigger: "Musíš být [Concept('ceremonial_regent','vládnoucím regentem')|E] území [GetTitleByKey('e_japan').GetBaseNameNoTier]"
 tgp_japan_become_shogun_decision_land_trigger: "Všechna [Concept('duchies','vévodství')|E] – [GetTitleByKey('d_kinai').GetBaseNameNoTier], [GetTitleByKey('d_nankaido').GetBaseNameNoTier], [GetTitleByKey('d_hokurikudo').GetBaseNameNoTier], [GetTitleByKey('d_west_bando').GetBaseNameNoTier] a [GetTitleByKey('d_north_saikaido').GetBaseNameNoTier] – musí celá ležet v [Concept('realm','panství')|E] [GetTitleByKey('e_japan').GetBaseNameNoTier]"
 tgp_japan_become_shogun_decision_vassal_revocation_effect: "Všechny [Concept('titles','tituly')|E] držené [Concept('vassals','vazaly')|E] se systémem [Concept('government','vlády')|E] [GetGovernment('japan_administrative_government').GetName] budou odebrány"
 tgp_japan_become_shogun_decision_dynasty_split_effect: "Všechny [Concept('dynasties','dynastie')|E], které mají více než jeden žijící [Concept('house','rod')|E], se rozdělí"
