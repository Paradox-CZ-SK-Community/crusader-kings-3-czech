 tgp_japan_restore_japanese_monarchy_decision_desc: "Nepřerušená pokrevní linie bohyně Amaterasu vládla těmto ostrovům od nepaměti. Má-li Japonsko znovu nabýt své někdejší moci, musí na trůn usednout právoplatný dědic rodu Jamato."
