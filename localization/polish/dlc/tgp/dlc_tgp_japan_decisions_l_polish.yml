 tgp_japan_establish_house_fief_found_house_effect: "Protože [Concept('dynast','hlava tvé dynastie')|E] má [Concept('government_bureaucratic_type','byrokratickou')|E] formu vlády, založíš novou [Concept('dynasty','dynastii')|E]"
