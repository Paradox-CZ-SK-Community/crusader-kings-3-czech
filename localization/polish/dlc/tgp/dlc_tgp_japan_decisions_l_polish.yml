 tgp_japan_imperial_branch_decision_desc: "Ačkoli mi v žilách koluje krev bohyně Amaterasu, můj osud leží daleko za zdmi císařského paláce. Zřeknu se svého císařského původu, aby činy rodů [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] a [Glossary( 'Taira', 'TAIRA_GLOSS' )] zaznívaly v dějinách těchto ostrovů ještě hlasitěji."
 tgp_japan_imperial_branch_decision_tooltip: "Založ [Concept('house','rod')|E] [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] či [Glossary( 'Taira', 'TAIRA_GLOSS' )] nebo se k některému z nich připoj"
