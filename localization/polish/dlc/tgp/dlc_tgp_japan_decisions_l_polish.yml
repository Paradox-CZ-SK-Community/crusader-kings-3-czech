 tgp_japan_establish_house_fief_castle_effect: "Každá [Concept('holding','država')|E], která představuje [Concept('capital','hlavní sídlo')|E] tebou drženého [Concept('county','hrabství')|E], bude nahrazena [Concept('castle','hradem')|E]"
