 tgp_japan_emperor_restoration_decision: "Obnovit přímou císařskou vládu"
 tgp_japan_emperor_restoration_decision_desc: "Už příliš dlouho jsem zpoza palácových zdí [Select_CString(ROOT.Char.IsFemale,'sledovala','sledoval')], jak si mou právoplatnou moc přivlastňují váleční štváči. Dost! Nastal čas zaujmout své místo nebeského panovníka, obnovit božskou důstojnost císařského úřadu a navrátit panství stabilitu."
