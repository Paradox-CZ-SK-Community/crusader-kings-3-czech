l_polish:
 game_concept_japanese_manor: "Japonské sídlo"
 game_concept_japanese_manors: "Japonská sídla"
 game_concept_manor: "Sídlo"
 game_concept_manors: "Sídla"
 game_concept_shoen: "Šóen"
 game_concept_family_manor: "Rodové sídlo"
 game_concept_family_manors: "Rodová sídla"
 game_concept_japanese_manor_desc: "Sídlo – neboli [Glossary( 'šóen', 'SHOEN_GLOSS')] – je typ [Concept('domicile','domicilu')|E] držený [Concept('house_head','hlavou rodu')|E] významných [Concept('noble_families','šlechtických rodin')|E] v [Concept('realms','panství')|E] typu [GetGovernment('japan_administrative_government').GetName] a [GetGovernment('japan_feudal_government').GetName]. Představuje soukromé pozemkové državy nevázané na žádný konkrétní [Concept('landed','zeměpanský')|E] [Concept('title','titul')|E].\n\nZde lze stavět [Concept('japanese_manor_building','budovy japonského sídla')|E], aby se rozšířilo bohatství rodiny a její [Concept('influence','vliv')|E], a $game_concept_manor$ budou dědit budoucí generace." # todo: CONCEPT CASE
 game_concept_japanese_manor_building: "Budova japonského sídla"
 game_concept_japanese_manor_buildings: "Budovy japonského sídla"
 game_concept_manor_building: "Budova sídla"
 game_concept_manor_buildings: "Budovy sídla"
 game_concept_japanese_manor_building_desc: "Budovy japonského sídla jsou jedinečná a trvalá vylepšení [Concept('japanese_manor','japonského sídla')|E].\n\nKe stavbě je dostupná široká škála staveb, které může vlastník sídla budovat, aby vytvářel soukromý příjem, rozšiřoval [Concept('influence','vliv')|E] rodiny a získal přístup k řadě [Concept('decisions','rozhodnutí')|E], [Concept('interactions','interakci')|E] a dalším možnostem." # todo: CONCEPT CASE
 game_concept_ritsuryo: "$japan_administrative_government$"
 game_concept_ritsuryo_government: "Vláda $japan_administrative_government$"
 game_concept_ritsuryo_i: "@government_type_ritsuryo!"
 game_concept_japan_administrative: "$japan_administrative_government$"
 game_concept_ritsuryo_government_desc: "$japan_administrative_government_desc$"
 game_concept_soryo: "$japan_feudal_government$"
 game_concept_soryo_government: "Vláda $japan_feudal_government$"
 game_concept_soryo_i: "@government_type_soryo!"
 game_concept_japan_feudal: "$japan_feudal_government$"
 game_concept_soryo_government_desc: "$japan_feudal_government_desc$"
 game_concept_japanese_bureaucracy: "Japonská byrokracie"
 game_concept_japanese_bureaucracy_desc: "Japonská byrokracie představuje úroveň centralizace [Concept('realm_possessive','panství')|E] s [Concept('ritsuryo_government','vládou $japan_administrative_government$')|E] a obecnou moc, kterou [Concept('ruler','vládce')|E] uplatňuje nad svými [Concept('vassals','vazaly')|E].\n\nJaponská byrokracie může měnit pouze [Concept('top_liege','nejvyšší lenní pán')|E]. Japonští $game_concept_vassals$ používají stejnou úroveň jako jejich $game_concept_liege$.\n\nExistují čtyři úrovně japonské byrokracie:\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_0$\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_1$\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_2$\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_3$\n\nZvýšení $game_concept_japanese_bureaucracy$ stojí určité množství [Concept('prestige','prestiže')|E] podle [Concept('realm_size','velikosti panství')|E] a [Concept('learning_skill','učenosti')|E] vládce." # todo: CONCEPT CASE
 game_concept_ceremonial_liege: "Obřadní panovník"
 game_concept_ceremonial_liege_possessive: "Obřadního panovníka"
 game_concept_ceremonial_liege_desc: "V některých [Concept('realms','panstvích')|E], například v Japonsku, mohl mocný byrokrat nebo velitel převzít skutečnou moc jako [Concept('ceremonial_regent','vládnoucí regent')|E] a ponechat nominálně vládnoucího obřadního panovníka jen jako pouhou loutku a v praxi [Concept('vassal','vazala')|E]. Všichni členové [Concept('house','rodu')|E] $game_concept_ceremonial_liege_possessive$ jsou považováni za součást [Concept('ceremonial_house','obřadní rod')|E].\n\nPřestože přímo nevládne, $game_concept_ceremonial_house$ je nejváženější pokrevní linií v panství a ostatní [Concept('houses','rody')|E] získají více [Concept('prestige','prestiže')|E] za sňatky s jeho členy, přičemž taková spojení výrazně ovlivňují nástupnictví $game_concept_ceremonial_regent$.\n\nObřadní panovník může získat skutečnou moc zpět, pokud nějakým způsobem znovu nabude [Concept('primary_title','hlavní titul')|E] panství, například požadavkem [Concept('faction','frakcemi')|E] nebo soupeřením o [Concept('title','titul')|E] vládnoucího regenta za použití [Concept('influence','vliv')|E]." # todo: CONCEPT CASE
 ceremonial_liege_concept: "[Concept('ceremonial_liege','Obřadní panovník')|E]" # todo: CONCEPT CASE
 game_concept_ceremonial_house: "Obřadní rod"
 game_concept_ceremonial_house_desc: "Obřadní rod označuje [Concept('house','rod')|E] [Concept('ceremonial_liege','obřadního panovníka')|E] daného [Concept('realm','panství')|E]." # todo: CONCEPT CASE
 game_concept_ceremonial_regent: "Vládnoucí regent"
 game_concept_ceremonial_regency: "Vládnoucí regentství"
 game_concept_ceremonial_regents: "Vládnoucí regenti"
 game_concept_ceremonial_regent_possessive: "Vládnoucího regenta"
 game_concept_ceremonial_regent_desc: "Vládnoucí regent je obecné označení pro jakéhokoli [Concept('top_liege','nejvyššího lenního pána')|E], který vládne de facto jménem [Concept('ceremonial_liege','obřadním panovníkem')|E], například japonského #italic tennó#!.\n\nNázev úřadu vládnoucímu regentovi se může měnit podle aktuálních politických okolností; v Japonsku může být označován jako [Concept('kampaku','kampaku')|E] nebo [Concept('shogun','šógun')|E]." # todo: CONCEPT CASE
 ceremonial_regent_concept: "[Concept('ceremonial_regent','Vládnoucí regent')|E]" # todo: CONCEPT CASE
 game_concept_kampaku: "Kampaku"
 game_concept_kampaku_possessive: "Kampakua"
 game_concept_kampaku_desc: "[Glossary( 'Kampaku', 'KAMPAKU_GLOSS' )] je de facto nejvyšší úřad v byrokracii [Concept('ritsuryo','$japan_administrative_government$')|E], který vykonává značnou kontrolu nad státními orgány namísto [Concept('tenno_possessive','Tennóa')|E].\n\nAčkoli jej obvykle ovládá rodina [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )], s dostatečným [Concept('influence','vlivem')|E] a [Concept('prestige','prestiží')|E] se této příležitosti může chopit jakákoli rodina."
 game_concept_shogun: "Šógun"
 game_concept_shogun_possessive: "Šóguna"
 game_concept_shogun_desc: "Šógun, neboli diktátor, je de facto vládce celého Japonska v rámci [Concept('soryo_government','vlády $japan_feudal_government$')|E], který své postavení upevnil natolik, že jeho nástupnictví je dědičné, a vládne namísto [Concept('tenno_possessive','Tennóa')|E]." # todo: CONCEPT CASE
 game_concept_cloistered_emperor: "Císař v ústraní"
 game_concept_cloistered_emperor_possessive: "Císaře v ústraní"
 game_concept_joko: "Džókó"
 game_concept_joko_possessive: "Džókóa"
 game_concept_cloistered_emperor_desc: "Císař v ústraní je odstoupivší [Concept('tenno','Tennó')|E], který vládne jako de facto [Concept('ceremonial_regent','vládnoucí regent')|E] za panujícího císaře.\n\nAby se císař stal $game_concept_cloistered_emperor$, musí se vzdát #V Chryzantémového trůnu#! a stát se mnichem." # todo: CONCEPT CASE
 game_concept_restored_emperor: "Obnovený císař"
 game_concept_restored_emperor_possessive: "Obnoveného císaře"
 game_concept_restored_emperor_desc: "Obnovený císař je [Concept('tenno','Tennó')|E], který vládne nezávisle na [Concept('ceremonial_regent','vládnoucího regenta')|E].\n\nAby se [Concept('tenno','Tennó')|E] stal $game_concept_restored_emperor$, může být dosazen [Concept('faction','frakcí')|E] $restore_ceremonial_liege_faction_name$ nebo použít [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('tgp_japan_emperor_restoration_decision').GetName] poté, co se stane [Concept('ceremonial_regent','vládnoucím regentem')|E]." # todo: CONCEPT CASE
 game_concept_japanese_emperor: "Japonský císař"
 game_concept_japanese_emperor_possessive: "Japonského císaře"
 game_concept_tenno: "Tennó"
 game_concept_tenno_possessive: "Tennóa"
 game_concept_japanese_emperor_desc: "Tennó je oficiálním císařem celého $e_japan$, ačkoli skutečná moc je obvykle v rukou [Concept('ceremonial_regent','vládnoucím regentovi')|E], který spravuje stát jeho jménem." # todo: CONCEPT CASE
 game_concept_house_aspiration: "Aspirace rodu"
 game_concept_house_aspirations: "Aspirace rodu"
 game_concept_aspiration: "Aspirace"
 game_concept_aspirations: "Aspirace"
 game_concept_house_aspiration_desc: "Aspirace rodu představuje cíle a metody japonského [Concept('house','rodu')|E] a každá poskytuje různé bonusy a příležitosti.\n\n[Concept('house_head','Hlava rodu')|E] si může zvolit, o kterou aspiraci bude usilovat, a utratit [Concept('prestige','prestiž')|E], aby se jí dále zavázala a získala přístup k mocnějším výhodám." # todo: CONCEPT CASE
 game_concept_imperial_policy: "Císařská politika"
 game_concept_imperial_policies: "Císařské politiky"
 game_concept_imperial_policy_desc: "Císařská politika je [Concept('law','zákon')|E] stanovený [Concept('top_liege','nejvyšším lenním pánem')|E] Japonska, který platí pro všechny [Concept('vassals','vazaly')|E]. Různé politiky mohou omezovat nebo povolovat určité akce, případně udělovat účinky platné pro celé [Concept('realm','panství')|E]." # todo: CONCEPT CASE
 game_concept_house_relation: "Vztah rodů"
 game_concept_house_relations: "Vztahy rodů"
 game_concept_house_relation_desc: "Když spolu dva [Concept('houses','rody')|E] jednají, mohou si vytvořit kladný nebo záporný $game_concept_house_relation$, který přetrvává po generace.\n\nKromě vlivu na [Concept('opinion','mínění')|E] všech členů rodu může mít každá úroveň $game_concept_house_relation$ další účinky, například usnadňovat či ztěžovat uzavírání [Concept('alliances','aliancí')|E] a vedení [Concept('wars','válek')|E].\n\nVztah rodů zůstává na stejné úrovni, dokud součet všech akcí nedosáhne buď #P +100 %#!, nebo #N -100 %#!. Poté se vztahem rodů posune na další úroveň, kladnou nebo zápornou." # todo: CONCEPT CASE
