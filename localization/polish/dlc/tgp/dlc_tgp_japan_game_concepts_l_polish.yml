l_polish:
 game_concept_japanese_manor: "Japonské sídlo"
 game_concept_japanese_manors: "Japonská sídla"
 game_concept_manor: "Sídlo"
 game_concept_manors: "Sídla"
 game_concept_shoen: "Šóen"
 game_concept_family_manor: "Rodové sídlo"
 game_concept_family_manors: "Rodová sídla"
 game_concept_japanese_manor_desc: "$game_concept_manor$ neboli [Glossary( 'šóen', 'SHOEN_GLOSS' )] je druh [Concept('domicile','domicilu')|E], který vlastní [Concept('house_head','hlava rodu')|E] některé z významných [Concept('noble_families','šlechtických rodin')|E] v [Concept('realms','panstvích')|E] s vládou [GetGovernment('japan_administrative_government').GetName] nebo [GetGovernment('japan_feudal_government').GetName]. Představuje soukromé pozemkové vlastnictví, které není vázáno na žádný konkrétní [Concept('landed','zeměpanský')|E] [Concept('title','titul')|E].\n\nVe sídle lze stavět [Concept('japanese_manor_building','budovy japonského sídla')|E], které rozmnožují rodové bohatství a posilují [Concept('influence','vliv')|E] rodiny. Samotné $game_concept_manor$ pak přechází dědictvím na další generace."
 game_concept_japanese_manor_building: "Budova japonského sídla"
 game_concept_japanese_manor_buildings: "Budovy japonského sídla"
 game_concept_manor_building: "Budova sídla"
 game_concept_manor_buildings: "Budovy sídla"
 game_concept_japanese_manor_building_desc: "$game_concept_japanese_manor_buildings$ představují jedinečná a trvalá vylepšení [Concept('japanese_manor','japonského sídla')|E].\n\nMajitel sídla může vybírat z mnoha různých staveb, které mu umožňují získávat soukromé příjmy, posilovat rodinný [Concept('influence','vliv')|E] a zpřístupňovat nové [Concept('decisions','rozhodnutí')|E], [Concept('interactions','interakce')|E] a další možnosti."
 game_concept_ritsuryo: "$japan_administrative_government$"
 game_concept_ritsuryo_government: "Vláda $japan_administrative_government$"
 game_concept_ritsuryo_i: "@government_type_ritsuryo!"
 game_concept_japan_administrative: "$japan_administrative_government$"
 game_concept_ritsuryo_government_desc: "$japan_administrative_government_desc$"
 game_concept_soryo: "$japan_feudal_government$"
 game_concept_soryo_government: "Vláda $japan_feudal_government$"
 game_concept_soryo_i: "@government_type_soryo!"
 game_concept_japan_feudal: "$japan_feudal_government$"
 game_concept_soryo_government_desc: "$japan_feudal_government_desc$"
 game_concept_japanese_bureaucracy: "Japonská byrokracie"
 game_concept_japanese_bureaucracy_desc: "$game_concept_japanese_bureaucracy$ představuje míru centralizace [Concept('realm_possessive','panství')|E] s [Concept('ritsuryo_government','vládou Ricurjó')|E] a rozsah moci, kterou [Concept('ruler','vládce')|E] uplatňuje nad svými [Concept('vassals','vazaly')|E].\n\nÚroveň $game_concept_japanese_bureaucracy$ může měnit pouze [Concept('top_liege','nejvyšší lenní pán')|E]. Japonští $game_concept_vassals$ používají stejnou úroveň jako jejich $game_concept_liege$.\n\nExistují čtyři úrovně $game_concept_japanese_bureaucracy$:\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_0$\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_1$\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_2$\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_3$\n\nZvýšení úrovně $game_concept_japanese_bureaucracy$ stojí určité množství [Concept('prestige','prestiže')|E], které závisí na [Concept('realm_size','velikosti panství')|E] a panovníkově [Concept('learning_skill','učenosti')|E]."
 game_concept_ceremonial_liege: "Obřadní panovník"
 game_concept_ceremonial_liege_possessive: "Obřadního panovníka"
 game_concept_ceremonial_liege_desc: "V některých [Concept('realms','panstvích')|E], například v Japonsku, se může skutečné moci chopit mocný úředník či vojevůdce v postavení [Concept('ceremonial_regent','vládnoucího regenta')|E]. Formálně vládnoucí $game_concept_ceremonial_liege$ pak zůstává pouhou loutkou na trůnu a ve skutečnosti zastává postavení [Concept('vassal','vazala')|E]. Všichni členové [Concept('house','rodu')|E] $game_concept_ceremonial_liege_possessive$ jsou považováni za příslušníky [Concept('ceremonial_house','obřadního rodu')|E].\n\nAčkoli $game_concept_ceremonial_house$ přímo nevládne, představuje nejváženější rodovou linii v celém panství. Ostatní [Concept('houses','rody')|E] získávají více [Concept('prestige','prestiže')|E] za sňatky s jeho členy a takto vzniklé příbuzenské vazby výrazně ovlivňují nástupnictví $game_concept_ceremonial_regent$.\n\n$game_concept_ceremonial_liege$ může skutečnou moc získat zpět, pokud se mu podaří znovu získat [Concept('primary_title','hlavní titul')|E] panství. Toho lze dosáhnout například prostřednictvím požadavku [Concept('faction','frakce')|E] nebo soupeřením o [Concept('title','titul')|E] $game_concept_ceremonial_regent$ za pomoci [Concept('influence','vlivu')|E]."
 ceremonial_liege_concept: "[Concept('ceremonial_liege','Obřadní panovník')|EU]"
 game_concept_ceremonial_house: "Obřadní rod"
 game_concept_ceremonial_house_desc: "$game_concept_ceremonial_house$ je [Concept('house','rod')|E], z něhož pochází [Concept('ceremonial_liege','obřadní panovník')|E] daného [Concept('realm','panství')|E]."
 game_concept_ceremonial_regent: "Vládnoucí regent"
 game_concept_ceremonial_regency: "Vládnoucí regentství"
 game_concept_ceremonial_regents: "Vládnoucí regenti"
 game_concept_ceremonial_regent_possessive: "Vládnoucího regenta"
 game_concept_ceremonial_regent_desc: "$game_concept_ceremonial_regent$ je obecné označení pro [Concept('top_liege','nejvyššího lenního pána')|E], který fakticky vládne jménem [Concept('ceremonial_liege','obřadního panovníka')|E], například japonského císaře s titulem #italic $game_concept_tenno$#!.\n\nNázev úřadu $game_concept_ceremonial_regent_possessive$ se může měnit podle aktuálních politických poměrů. V Japonsku může být označován jako [Concept('kampaku','kampaku')|E] nebo [Concept('shogun','šógun')|E]."
 ceremonial_regent_concept: "[Concept('ceremonial_regent','Vládnoucí regent')|EU]"
 game_concept_kampaku: "Kampaku"
 game_concept_kampaku_possessive: "Kampakua"
 game_concept_kampaku_desc: "[Glossary( 'Kampaku', 'KAMPAKU_GLOSS' )] je fakticky nejvyšším úřadem v byrokracii [Concept('ritsuryo','$japan_administrative_government$')|E]. Jeho držitel vykonává rozsáhlou kontrolu nad státní správou jménem [Concept('tenno_possessive','tennóa')|E].\n\nAčkoli tento úřad zpravidla ovládá rod [Glossary( 'Fudžiwara', 'FUJIWARA_GLOSS' )], s dostatečným [Concept('influence','vlivem')|E] a [Concept('prestige','prestiží')|E] může tohoto postavení dosáhnout kterýkoli rod."
 game_concept_shogun: "Šógun"
 game_concept_shogun_possessive: "Šóguna"
 game_concept_shogun_desc: "$game_concept_shogun$ neboli diktátor je faktickým vládcem celého Japonska v systému [Concept('soryo_government','vlády Sórjó')|E]. Své postavení upevnil natolik, že se jeho úřad stal dědičným a vládne jménem [Concept('tenno_possessive','tennóa')|E]."
 game_concept_cloistered_emperor: "Císař v ústraní"
 game_concept_cloistered_emperor_possessive: "Císaře v ústraní"
 game_concept_joko: "Džókó"
 game_concept_joko_possessive: "Džókóa"
 game_concept_cloistered_emperor_desc: "$game_concept_cloistered_emperor$ je bývalý [Concept('tenno','tennó')|E], který fakticky vládne jako [Concept('ceremonial_regent','vládnoucí regent')|E] jménem panujícího císaře.\n\nAby se císař stal $game_concept_cloistered_emperor$, musí abdikovat z #V Chryzantémového trůnu#! a stát se mnichem."
 game_concept_restored_emperor: "Obnovený císař"
 game_concept_restored_emperor_possessive: "Obnoveného císaře"
 game_concept_restored_emperor_desc: "$game_concept_restored_emperor$ je [Concept('tenno','tennó')|E], který vládne nezávisle na [Concept('ceremonial_regent','vládnoucím regentovi')|E].\n\nAby se [Concept('tenno','tennó')|E] stal $game_concept_restored_emperor$, může být dosazen [Concept('faction','frakcí')|E] $restore_ceremonial_liege_faction_name$, případně může po získání postavení [Concept('ceremonial_regent','vládnoucího regenta')|E] využít [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('tgp_japan_emperor_restoration_decision').GetName]."
 game_concept_japanese_emperor: "Japonský císař"
 game_concept_japanese_emperor_possessive: "Japonského císaře"
 game_concept_tenno: "Tennó"
 game_concept_tenno_possessive: "Tennóa"
 game_concept_japanese_emperor_desc: "Titul $game_concept_tenno$ náleží oficiálnímu císaři celé říše $e_japan$, ačkoli skutečnou moc obvykle drží [Concept('ceremonial_regent','vládnoucí regent')|E], který jeho jménem spravuje stát."
 game_concept_house_aspiration: "Aspirace rodu"
 game_concept_house_aspirations: "Aspirace rodu"
 game_concept_aspiration: "Aspirace"
 game_concept_aspirations: "Aspirace"
 game_concept_house_aspiration_desc: "$game_concept_house_aspiration$ představuje cíle a způsoby jednání japonského [Concept('house','rodu')|E]. Každá aspirace přináší odlišné bonusy a příležitosti.\n\n[Concept('house_head','Hlava rodu')|EU] může rozhodnout, kterou aspiraci bude rod následovat, a vynaložit [Concept('prestige','prestiž')|E] na prohloubení svého závazku. Tím získá přístup k ještě mocnějším výhodám."
 game_concept_imperial_policy: "Císařská politika"
 game_concept_imperial_policies: "Císařské politiky"
 game_concept_imperial_policy_desc: "$game_concept_imperial_policy$ je [Concept('law','zákon')|E], který stanovuje [Concept('top_liege','nejvyšší lenní pán')|E] Japonska a který se vztahuje na všechny [Concept('vassals','vazaly')|E]. Jednotlivé politiky mohou některé činnosti povolovat či zakazovat nebo poskytovat účinky platné v celém [Concept('realm','panství')|E]."
 game_concept_house_relation: "Vztah rodů"
 game_concept_house_relations: "Vztahy rodů"
 game_concept_house_relation_desc: "Vzájemným jednáním mezi dvěma [Concept('houses','rody')|E] může vzniknout kladný nebo záporný $game_concept_house_relation$, který přetrvává napříč generacemi.\n\nKromě ovlivňování [Concept('opinion','mínění')|E] všech členů zúčastněných rodů může každá úroveň $game_concept_house_relation$ přinášet další účinky. Může například usnadňovat či ztěžovat uzavírání [Concept('alliances','aliancí')|E] a vedení [Concept('wars','válek')|E].\n\n$game_concept_house_relation$ zůstává na stejné úrovni, dokud souhrnný účinek všech jednání nedosáhne #P +100%#! nebo #N -100%#!. Poté se vztah posune o jednu úroveň v kladném nebo záporném směru."
