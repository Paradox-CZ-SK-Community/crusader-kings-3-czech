l_polish:
 tgp_japan_general.8800.t: "Uskupení [ROOT.Char.GetConfederation.GetName] se rozšiřuje"
 tgp_japan_general.8800.desc: "Má vojska mohou být právem hrdá. V boji proti [war_loser.Custom('CZ_TitledFirstName_I')] dobře posloužila mně i uskupení [attacker.GetConfederation.GetName]. Území [target_title.Custom('CZ_LandedName_G')] nyní připadlo do mých rukou a je na mně, komu je udělím.\n\nBylo by rozumné svěřit tyto země důvěryhodnému a věrnému služebníkovi, který bude dbát mých slov a na jehož pomoc se budu moci v budoucnu spolehnout."
 tgp_japan_general.8800.a: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('family_1') )], [family_1.GetFirstNameNoTooltip], bude vládnout dobře."
 tgp_japan_general.8800.b: "Toto panství bude [family_2.Custom('CZ_FirstNamePossessiveNoTooltip_N')]. [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('family_2') )] si je zaslouží."
 tgp_japan_general.8800.c: "Nechť je získá [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('family_3') )], [family_3.GetFirstNameNoTooltip]."
 tgp_japan_general.8800.e: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fallback_1') )], [fallback_1.GetFirstNameNoTooltip], jistě prokáže své schopnosti."
 tgp_japan_general.8800.f: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fallback_2') )], [fallback_2.GetFirstNameNoTooltip], má mou důvěru."
 tgp_japan_general.8800.g: "Právě [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fallback_3') )], [fallback_3.GetFirstNameNoTooltip], si to zaslouží."
 tgp_japan_general.8800.h: "Ještě jsem se [Select_CString(ROOT.Char.IsFemale,'nerozhodla','nerozhodl')]..."
 tgp_japan_general_8800_custom: "Všichni ostatní možní příjemci"
 tgp_japan_general.8800.cadet_tt: "Založí nový [Concept('house','rod')|E]"
 new_ceremonial_liege_message_title: "Nastolení [ceremonial_liege.Custom('CZ_TitleAsNameNoTooltip_G')]"
 new_ceremonial_liege_message_effect: "[ceremonial_liege.GetTitledFirstName] [Select_CString(ceremonial_liege.IsFemale,'usedla','usedl')] na trůn [ceremonial_title.Custom('CZ_LandedName_G')]"
 tgp_japan_general.9100.t: "Nová vláda: [ROOT.Char.GetTitleAsNameNoTooltip]"
 tgp_japan_general.9100.shoulders: "odpovědnost za vládu nad územím [title.GetTierAsNameNoTooltip] nyní spočívá na mých bedrech."
 tgp_japan_general.9100.desc_murdered: "Tragicky a #EMP tak nešťastně#! [Select_CString(previous_holder.IsFemale,'zemřela','zemřel')] [previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)]. Nyní $tgp_japan_general.9100.shoulders$"
 tgp_japan_general.9100.desc_dead: "Na věčnost [Select_CString(previous_holder.IsFemale,'odešla','odešel')] [previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)]. Nyní $tgp_japan_general.9100.shoulders$"
 tgp_japan_general.9100.desc_joko: "[previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(previous_holder.IsFemale,'abdikovala','abdikoval')]. Nyní $tgp_japan_general.9100.shoulders$"
 tgp_japan_general.9100.desc_alive: "Nyní je na mně, abych [Select_CString(ROOT.Char.IsFemale,'vedla','vedl')] rozsáhlé území [title.GetTierAsNameNoTooltip], které po sobě [previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(previous_holder.IsFemale,'zanechala','zanechal')]."
 tgp_japan_general.9100.desc: "\n\nStojím před svými vazaly, upravuji si novou korunu a [ROOT.Char.Custom('quirk_pos_personal_present')]. Ach, kolik toho ještě dokážu!"
 tgp_japan_general.9100.a: "Ať žije [ROOT.Char.GetTitleAsNameNoTooltip]!"
 tgp_japan_general.9120.t: "Za trůnem"
 tgp_japan_general.9120.desc: "Po odchodu [previous_holder.Custom('CZ_TitledFirstName_G')] a díky mému rostoucímu vlivu se státní záležitosti konečně znovu dostávají převážně do rukou císařského dvora.\n\nPodle zavedených zvyklostí mnozí očekávají, že si oholím hlavu a předám trůn svému nástupci, jímž je [emperor_player_heir.GetFirstName]. Nástupnictví je zajištěno, a tak bych se [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] zbavit obřadních povinností spojených s postavením [ROOT.Char.Custom('CZ_TitleAsName_G')] a soustředit se na naléhavější politické záležitosti."
 tgp_japan_general.9120.a: "Nastal čas odejít do kláštera..."
 tgp_japan_general.9120.b: "#EMP Já#! jsem [ROOT.Char.GetTitleAsNameNoTooltip] a #EMP já#! budu vládnout!"
 tgp_japan_general.9300.t: "$game_concept_imperial_policy$:"
 tgp_japan_general.9300.t.defense_mobilization_law: "$tgp_japan_general.9300.t$ $defense_mobilization_law$"
 tgp_japan_general.9300.t.disarmament_law: "$tgp_japan_general.9300.t$ $disarmament_law$"
 tgp_japan_general.9300.t.isolation_law: "$tgp_japan_general.9300.t$ $isolation_law$"
 tgp_japan_general.9300.t.fortification_initative_law: "$tgp_japan_general.9300.t$ $fortification_initative_law$"
 tgp_japan_general.9300.t.imperial_expansion_law: "$tgp_japan_general.9300.t$ $imperial_expansion_law$"
 tgp_japan_general.9300.t.manor_reform_law: "$tgp_japan_general.9300.t$ $manor_reform_law$"
 tgp_japan_general.9300.t.bandit_crackdown_law: "$tgp_japan_general.9300.t$ $bandit_crackdown_law$"
 tgp_japan_general.9300.t.religious_reform_law: "$tgp_japan_general.9300.t$ $religious_reform_law$"
 tgp_japan_general.9300.restored_emperor: "Obklopují mě dvořané a služebnictvo. S vážnou tváří dohlížím na úředníky, kteří posledními tahy pera a otisky pečetí dokončují mou novou politiku pro celé [liege.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 tgp_japan_general.9300.liege: "Pod vážným pohledem [ceremonial_liege.Custom('CZ_TitledFirstName_G')] dopisuji poslední řádky a opatřuji výnos pečetí. Nová politika pro celé [liege.GetPrimaryTitle.GetTierAsNameNoTooltip] je hotova.\n\n"
 tgp_japan_general.9300.ceremonial_liege: "Obklopují mě dvořané a služebnictvo. S vážnou tváří sleduji, jak [liege.GetTitledFirstName] dopisuje poslední řádky výnosu a opatřuje jej pečetí. Nová politika bude platit pro celé [liege.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 tgp_japan_general.9300.vassal_ceremonial: "Všichni netrpělivě očekávají zprávy z císařského paláce ve městě [liege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], kde dnes [liege.GetTitledFirstName] jménem [ceremonial_liege.Custom('CZ_TitledFirstName_G')] vyhlásí novou politiku.\n\n"
 tgp_japan_general.9300.vassal: "Všichni netrpělivě očekávají zprávy z císařského paláce ve městě [liege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], kde dnes [liege.GetTitledFirstName] vyhlásí novou politiku pro celé [liege.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 tgp_japan_general.9300.defense_mobilization_law: "#EMP „[liege.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] čelí novým hrozbám. Má-li naše země zůstat silná a svobodná, musí se lid připravit na válku!“#!"
 tgp_japan_general.9300.disarmament_law: "#EMP „ [liege.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] sužují sváry a bezpráví. Násilí je třeba potlačit a zbraně těm, kdo je drží neoprávněně, zabavit!“#!"
 tgp_japan_general.9300.isolation_law: "#EMP „Naše [liege.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] trpí zhoubným vlivem cizinců, jejichž myšlenky a zájmy zasévají svár. Musíme je vykázat!“#!"
 tgp_japan_general.9300.fortification_initative_law: "#EMP „Nad [liege.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] se vznáší hrozba války. Pro dobro všech musíme vybudovat pevnou obranu a připravit se na nejhorší!“#!"
 tgp_japan_general.9300.imperial_expansion_law: "#EMP „V těžkých časech se [liege.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] právem bránilo rozšiřováním svých hranic. Nyní musíme opět vyrazit vpřed!“#!"
 tgp_japan_general.9300.manor_reform_law: "#EMP „Velké bohatství držitelů sídel roste na úkor lidu i území [liege.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')]. Jejich majetky je třeba omezit!“#!"
 tgp_japan_general.9300.bandit_crackdown_law: "#EMP „Naše lhostejnost umožnila rozmach banditství a zkaženosti, kvůli nimž lid trpí. V zájmu obyvatel [liege.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] musíme obnovit pořádek!“#!"
 tgp_japan_general.9300.religious_reform_law: "#EMP „Způsob života kněží se stále více rozchází se životem prostého lidu. Chceme-li obnovit duchovní sílu [liege.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')], musíme přezkoumat stará dogmata!“#!"
 tgp_japan_general.9300.outro: "Poslové se brzy rozjedou do všech koutů [ROOT.Char.GetTopLiege.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] a oznámí dekret vydaný jménem [ceremonial_liege.Custom('CZ_TitleAsNameNoTooltip_G')]:\n\n"
 tgp_japan_general.9300.a: "Tak to má být."
 tgp_japan_general.9300.a.disarmament_soryo: "$epidemic_events.1061.a$"
 tgp_japan_soryo_eradicate_cb_heir_move_manor_to_savior_tt: "[loser_heir.GetShortUIName] přesune [Concept('manor','sídlo')|E] rodu [loser_heir.GetHouse.GetName]. Jeho novým umístěním bude [savior.GetCapitalLocation.GetBaronyNameExplicitly]"
 tgp_japan_soryo_eradicate_cb_heir_move_to_savior_tt: "Přesuneš [Concept('manor','sídlo')|E] rodu [loser.GetHouse.GetName]. Jeho novým umístěním bude [savior.GetCapitalLocation.GetBaronyNameExplicitly]"
 tgp_japan_soryo_eradicate_cb_heir_move_to_cap_tt: "Přesuneš [Concept('manor','sídlo')|E] rodu [loser.GetHouse.GetName]. Jeho novým umístěním bude [loser_heir.GetTopLiege.GetCapitalLocation.GetBaronyNameExplicitly]"
 eradicated_my_house_opinion: "Vyhlazení mého rodu"
 every_house_member_mad: "Každý přeživší člen [Concept('house','rodu')|E]"
 tgp_japan_general.9550.t: "Zahnáni na porážku"
 tgp_japan_general.9550.desc.intro.a: "Tato válka je mým dílem. A její výsledek? Zkáza mého rodu."
 tgp_japan_general.9550.desc.intro.b: "Kdo by tušil, že náš svár s rodem [winner.GetHouse.GetNameNoTooltip] skončí právě takto?"
 tgp_japan_general.9550.desc: "Výkřiky mých válečníků a služebnictva se ozývají stále blíž. Jejich zoufalý nářek předznamenává osud, který brzy stihne všechny členy rodu [ROOT.Char.GetHouse.GetName]."
 tgp_japan_general.9550.desc.alone: "\n\nKrčím se strachy. Úplně [Select_CString(ROOT.Char.IsFemale,'sama','sám')]."
 tgp_japan_general.9550.desc.fam: "\n\nChoulíme se k sobě, já i celá má rodina."
 tgp_japan_general.9550.desc.end: "S každou další vteřinou se lišky přibližují a my jsme jako drůbež uvězněná v kurníku.\n\nJak se my, rod [ROOT.Char.GetHouse.GetNameNoTooltip], postavíme svým posledním okamžikům?"
 every_close_family_house_member_in_court: "Ty, všichni tví [Concept('spouse','choti')|E] a členové [Concept('close_family','blízké rodiny')|E] z tvého [Concept('house','rodu')|E], kteří pobývají na tvém [Concept('court','dvoře')|E]"
 every_house_member_in_court: "Všichni [Concept('spouses','choti')|E] postavy [loser.GetShortUIName] a členové jejího či jeho [Concept('house','rodu')|E] pobývající na [Concept('court','dvoře')|E]"
 is_killed_by_you_and_you_kill_self: "@death_icon! Spáchá sebevraždu, aby předešel potupné smrti z rukou [winner.GetShortUIName]"
 tgp_japan_general.9550.a.alone: "Nedopustím, aby mě stihla potupná smrt!"
 tgp_japan_general.9550.a.alone.flavor: "Zemřu vlastní rukou"
 tgp_japan_general.9550.a.fam: "Nedopustíme, aby nás stihla potupná smrt!"
 tgp_japan_general.9550.a.fam.flavor: "Všichni zemřeme mou rukou! Můj dědic [loser_heir.GetShortUIName] uprchne do zemí [savior.GetName], kde nalezne útočiště"
 tgp_japan_general.9550.b: "Roztáhněme křídla a uleťme z tohoto kurníku!"
 tgp_japan_general.9550.b.success: "Podaří se ti uniknout vyhlazení"
 tgp_japan_general.9550.b.failure: "Nepodaří se ti uniknout vyhlazení"
 tgp_japan_general.9550.b.flavor: "Znovu shromáždíme své síly a jednoho dne se rodu [winner.GetHouse.GetNameNoTooltip] pomstíme"
 tgp_japan_general.9550.c: "Musíme vsadit vše na milost lišky."
 tgp_japan_general.9551.t: "Vyhlazení rodu [loser.GetHouse.GetNameNoTooltip]"
 tgp_japan_general.9551.desc.intro: "„Ač je to rouhání, přeji si v příštím životě znovu narodit ve své nynější podobě, abych tě [Select_CString(loser.IsFemale,'mohla','mohl')] znovu zabít, [winner.GetFirstNameNoTooltip]—“\n\n[loser.GetTitledFirstName] ze sebe vyráží poslední slova, než hlava dopadne na zem. Ústa mě ještě chvíli němě proklínají. Smrt stejně potupná jako duchovně zkažená. Bezhlavé tělo se bezvládně hroutí jako kuře čekající na oškubání. Pouhá hromada masa, která už nepředstavuje žádnou hrozbu a kterou sotva lze nazvat člověkem.\n\nBez rodu [loser.GetHouse.GetName] je kraj [loser_region.GetBaseNameNoTierNoTooltip] zase o něco čistší..."
 tgp_japan_general.9551.desc.alt.intro: "Ach, ten vychytralý rod [loser.GetHouse.GetName]! Než jsme stačili zajmout [loser.Custom('CZ_Name_A')], "
 tgp_japan_general.9551.desc.alt.suicide: "[Select_CString(loser.IsFemale,'spáchala','spáchal')] sebevraždu a vlastní rukou [Select_CString(loser.IsFemale,'usmrtila','usmrtil')] i své nejbližší."
 tgp_japan_general.9551.desc.alt.escape: "[Select_CString(loser.IsFemale,'uprchla','uprchl')] do zemí [savior.GetName]."
 tgp_japan_general.9551.desc.alt.outro: "\n\nNaštěstí zbývají další členové rodu [loser.GetHouse.GetNameNoTooltip], které můžeme pobít."
 tgp_japan_general.9551.a: "Jejich hlavy budou zvěstovat zkázu celého rodu!"
 tgp_japan_general.9551.a.flavor: "Jejich zlovolné tváře ozdobí kůly před jejich bývalým sídlem"
 rival_eradicated_modifier: "Vyhlazení soupeřícího rodu"
 rival_eradicated_modifier_desc: "Tvůj [Concept('house','rod')|E] se rozhodl vytáhnout do války a vyhladit pokrevní linii [Concept('house','rodu')|E] svého [Concept('rival','soka')|E]. Ostatní tě sice odsuzují, ale strach jim brání promluvit."
 house_eradicated_modifier: "Vyhlazený rod"
 house_eradicated_modifier_desc: "Tvůj [Concept('house','rod')|E] byl téměř vyhlazen soupeřícím rodem, který se stal tvým [Concept('rival','sokem')|E]. Nikdo už z tebe nemá strach. Zbývající hanba a nenávist však mohou být mocnou hnací silou budoucí pomsty."
 house_eradicated_suicide_modifier: "Vyhlazený rod"
 house_eradicated_suicide_modifier_desc: "Než byl tvůj [Concept('house','rod')|E] téměř vyhlazen soupeřícím rodem, jeho členové raději spáchali sebevraždu, než aby zemřeli potupnou smrtí. Přetrvávající nenávist může být mocnou hnací silou budoucí pomsty."
 tgp_house_blocs.1001.t: "[bloc_leader.GetConfederation.GetName]: Výzva do zbraně"
 tgp_house_blocs.1001.desc: "Vedení rodu [bloc_leader.GetHouse.GetBaseName] je stejně neochvějné a odvážné jako vždy. Nyní [bloc_leader.GetTitledFirstName] svolává naše síly k odporu proti [defender.Custom('CZ_Name_D')].\n\nNikdo, kdo stojí za uskupením [bloc_leader.GetConfederation.GetName] ani proti němu, nemůže přehlížet naši moc. Ta pramení především z naší jednoty. Sotva by někoho překvapilo, kdyby se válečníci rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip] zařadili po bok vojska rodu [bloc_leader.GetHouse.GetBaseNameNoTooltip]."
 tgp_house_blocs.1001.a: "Budeme stát při sobě!"
 tgp_house_blocs.1001.b: "Tohle není má válka."
