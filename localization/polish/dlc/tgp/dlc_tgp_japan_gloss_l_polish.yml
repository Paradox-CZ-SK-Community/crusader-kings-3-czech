l_polish:
 FUJIWARA_GLOSS: "Rodové jméno #bold $dynn_Fujiwara$#! patřilo mezi [Glossary( 'honsei', 'HONSEI_GLOSS' )] a císař $Tenji$ je za zásluhy udělil svému vlivnému dvořanovi $dynn_Nakatomi$ $Kamatari$.\n\nČetné větve jeho potomků po staletí ovládaly japonskou politiku a jejich příslušníci zastávali úřad [Glossary( 'kampaku', 'KAMPAKU_GLOSS' )] u císařského rodu [Glossary( 'Jamato', 'YAMATO_GLOSS' )].\n\nVedle [Glossary( 'Minamotů z linie Seiwa', 'MINAMOTO_GLOSS' )] a [Glossary( 'Tairů z linie Kanmu', 'TAIRA_GLOSS' )] patřil rod $dynn_Fujiwara$ k nejmocnějším rodům raně středověkého Japonska.\n\nJeho tradičním [Glossary( 'mon', 'MON_GLOSS' )] byl #EMP sagarifudži#! – květ visící vistárie."
 MINAMOTO_GLOSS: "Rodové jméno #bold $dynn_Minamoto$#! neboli #EMP Gendži#! patřilo mezi [Glossary( 'honsei', 'HONSEI_GLOSS' )] a bylo udělováno potomkům císařského rodu [Glossary( 'Jamato', 'YAMATO_GLOSS' )], kteří byli vyřazeni z císařské rodiny. Nejvýznamnější větev rodu $dynn_Minamoto$ pocházela od císaře $Seiwa$.\n\nVedle rodů [Glossary( 'Fudžiwara', 'FUJIWARA_GLOSS' )] a [Glossary( 'Taira z linie Kanmu', 'TAIRA_GLOSS' )] patřili Minamotové z linie $Seiwa$ k nejmocnějším rodům raně středověkého Japonska.\n\nJejich tradičním [Glossary( 'mon', 'MON_GLOSS' )] byly tři květy #EMP rindó#! – hořce – vyrůstající z pěti bambusových listů."
 TAIRA_GLOSS: "Rodové jméno #bold $dynn_Taira$#! neboli #EMP Heike#! patřilo mezi [Glossary( 'honsei', 'HONSEI_GLOSS' )] a bylo udělováno potomkům císařského rodu [Glossary( 'Jamato', 'YAMATO_GLOSS' )], kteří byli vyřazeni z císařské rodiny. Nejvýznamnější větev rodu $dynn_Taira$ pocházela od císaře $Kanmu$.\n\nVedle rodů #EMP [Glossary( 'Fudžiwara', 'FUJIWARA_GLOSS' )]#! a #EMP [Glossary( 'Minamoto z linie Seiwa', 'MINAMOTO_GLOSS' )]#! patřili Tairové z linie $Kanmu$ k nejmocnějším rodům raně středověkého Japonska.\n\nJejich tradičním [Glossary( 'mon', 'MON_GLOSS' )] byl #EMP agehačó#! – motýl otakárek."
 TACHIBANA_GLOSS: "Rodové jméno #bold $dynn_Tachibana$#! patřilo mezi [Glossary( 'honsei', 'HONSEI_GLOSS' )] a bylo udělováno potomkům císařského rodu [Glossary( 'Jamato', 'YAMATO_GLOSS' )], kteří byli vyřazeni z císařské rodiny.\n\nNejvýznamnější větev rodu $dynn_Tachibana$ pocházela od císaře $Bidatsu$.\n\nJejím tradičním [Glossary( 'mon', 'MON_GLOSS' )] byl #EMP tačibana#! – květ pomerančovníku."
 TAKASHINA_GLOSS: "Rodové jméno #bold $dynn_Takashina$#! patřilo mezi [Glossary( 'honsei', 'HONSEI_GLOSS' )] a bylo udělováno potomkům císařského rodu [Glossary( 'Jamato', 'YAMATO_GLOSS' )], kteří byli vyřazeni z císařské rodiny.\n\nNejvýznamnější větev rodu $dynn_Takashina$ pocházela od císaře $Tenmu$."
 YAMATO_GLOSS: "#bold $dynn_Yamato$#! je japonský císařský rod, který podle tradice pochází od samotné sluneční bohyně Amaterasu. Přestože jeho císaři kdysi vládli skutečnou mocí, vlivný rod [Glossary( 'Fudžiwara', 'FUJIWARA_GLOSS' )] postupně ovládl státní aparát a prostřednictvím regentů vládl jménem císařské dynastie.\n\nOd císařů z rodu Jamato přímo pochází mnoho nejvlivnějších japonských rodů, včetně [Glossary( 'Minamotů', 'MINAMOTO_GLOSS' )] a [Glossary( 'Tairů', 'TAIRA_GLOSS' )].\n\nTradičním [Glossary( 'mon', 'MON_GLOSS' )] císařského rodu byl #EMP kikka#! – květ chryzantémy."
 KAMPAKU_GLOSS: "#bold Kampaku#! byl titul oficiálního regenta dospělého japonského císaře. Původně šlo o čestný úřad v bezprostřední blízkosti [Glossary( 'Tennó', 'TENNO_GLOSS' )], rod Fudžiwara si však postupně přisvojoval stále více moci, až se kampaku stal skutečným vládcem země a císaři zůstala pouze formální autorita."
 TENNO_GLOSS: "#bold Tennó#! je titul japonského císaře. Postupem času regenti z rodu Fudžiwara získávali nad císařskou rodinou stále větší moc, až se [Glossary( 'kampaku', 'KAMPAKU_GLOSS' )] stal skutečným vládcem země a císařům zůstala pouze formální autorita."
 JOKO_GLOSS: "#bold Džókó#! je obecné označení pro bývalého [Glossary( 'Tennó', 'TENNO_GLOSS' )], který abdikoval a vzdal se Chryzantémového trůnu. S tím, jak císařská rodina ztrácela moc, bylo stále běžnější, že císař po zajištění následnictví zdravým dědicem dobrovolně odstoupil. Mohl tak nadále ovlivňovat politiku ze zákulisí, aniž by jej zatěžovaly ceremoniální povinnosti spojené s trůnem."
 SHOEN_GLOSS: "#bold Šóen#! označoval panská sídla japonských šlechtických rodů spolu s přilehlou zemědělskou půdou, kterou tyto rody s úpadkem centralizovaného systému [Concept('ritsuryo','ricurjó')|E] stále více vymaňovaly z kontroly ústřední vlády."
 HONSEI_GLOSS: "#bold Honsei#! neboli #EMP původní rodová jména#!, jako například #EMP [Glossary( 'Fudžiwara', 'FUJIWARA_GLOSS' )]#!, #EMP [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )]#!, #EMP [Glossary( 'Taira', 'MINAMOTO_GLOSS' )]#!, #EMP [Glossary( 'Tačibana', 'TACHIBANA_GLOSS' )]#! a #EMP [Glossary( 'Takašina', 'TAKASHINA_GLOSS' )]#!, patřila k nejstarším a nejprestižnějším rodovým jménům Japonska. Udělovala je císařská rodina svým dvořanům.\n\nS rostoucím počtem rodových větví a úpadkem císařského dvora byla tato jména postupně upřesňována nebo nahrazována jmény #EMP kamei#! a #EMP udži#!, která umožňovala jednotlivé větve lépe rozlišovat."
 HEIJI_REBELLION_GLOSS: "#bold Povstání Heidži#! bylo střetem mezi rodem [Glossary( 'Minamoto z Kawači', 'MINAMOTO_GLOSS' )] a klanem [Glossary( 'Taira z linie Kanmu', 'TAIRA_GLOSS' )] o kontrolu nad japonským císařem. Tairy přitom podporovaly i některé další větve rodu Minamoto.\n\nMinamotové se domnívali, že císařský dvůr straní jejich soupeřům, a proto povstali, aby tomu zabránili. Nakonec však byli poraženi a mnoho příslušníků rodu skončilo ve vyhnanství nebo bylo popraveno."
 RONIN_GLOSS: "#bold Rónin#! – doslova #EMP člověk na vlnách#! – byl původně výraz z pozdního období Nara, kterým se označoval nevolník uprchlý z půdy svého pána. Později se tímto slovem začali označovat samurajové bez pána, ať už v důsledku jeho smrti, ztráty jeho přízně, nebo vlastního společenského postavení. Bez zaměstnání a s málokterými dovednostmi kromě boje se mnozí róninové uchylovali ke zločinu, aby přežili."
 MON_GLOSS: "#bold Mon#! neboli #EMP rodový znak#! byl symbolem, který sloužil k označení a rozlišení japonských šlechtických rodů a jejich četných větví."
 CHRYSANTHEMUM_THRONE_GLOSS: "#bold Chryzantémový trůn#! označuje jak samotnou takamikuru, tedy japonský císařský trůn, tak v přeneseném významu i osobu [Glossary( 'Tennó', 'TENNO_GLOSS' )] a právní legitimitu, od níž se odvíjí existence vlády. Císařskou pečeť se šestnácti okvětními lístky chryzantémy poprvé přijal císař Go-Toba (1180–1239) jako svůj osobní symbol. Později ji převzal také [Glossary( 'císařský rod', 'YAMATO_GLOSS' )]. Chryzantéma symbolizuje dlouhověkost a obnovu, což odpovídá nepřerušené linii japonských císařů."

