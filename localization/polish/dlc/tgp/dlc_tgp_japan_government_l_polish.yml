 game_concept_bloc_possessive: "Bloku"
 game_concept_house_bloc_desc: "$game_concept_house_bloc$ je obranné spojenectví [Concept('houses','rodů')|E] v rámci [Concept('realm','panství')|E]. Pokud je některý [Concept('member_house','členský rod')|E] napaden, všichni ostatní $game_concept_member_houses$ se postaví na jeho obranu.\n\n[Concept('house_heads','Hlavy rodů')|EU] rozhodují o tom, zda se jejich rod stane jedním z [Concept('bloc_member_houses','členských rodů bloku')|E]. Jejich rozhodnutím se řídí všichni vládnoucí členové daného rodu v panství.\n\nKaždý blok má vždy svůj [Concept('leading_house','vůdčí rod')|E]. Jeho $game_concept_house_head$ může vylučovat ostatní členy, je pro všechny členy upřednostňovaným [Concept('ceremonial_regent','vládnoucím regentem')|E] a jeho [Concept('house_aspiration','aspirace rodu')|E] určuje bonusy poskytované vyššími úrovněmi [Concept('cohesion','soudržnosti')|E].\n\nPouze $game_concept_leading_house_possessive$ $game_concept_house_head$ smí zakládat [Concept('factions','frakce')|E] proti [Concept('top_liege','nejvyššímu lennímu pánovi')|E]. Všichni členové $game_concept_bloc_member_houses$ se připojí ke každé [Concept('faction','frakci')|E], kterou založí."
 game_concept_bloc_cohesion: "Soudržnost bloku"
 game_concept_cohesion: "Soudržnost"
 game_concept_bloc_cohesion_desc: "$game_concept_cohesion$ vyjadřuje jednotu [Concept('house_bloc','rodového bloku')|E]. Vyšší úrovně poskytují členům [Concept('bloc_member_houses','členských rodů bloku')|E] stále větší výhody, které se odvíjejí od [Concept('house_aspiration','aspirace rodu')|E], kterou má [Concept('leading_house_possessive','vůdčí rod')|E].\n\nHlavním faktorem jsou [Concept('house_relations','vztahy mezi rody')|E], které mezi sebou udržují $game_concept_bloc_member_houses$. Ty mohou $game_concept_cohesion$ ovlivňovat kladně i záporně. Soudržnost navíc může snižovat celková velikost bloku, rozdílné $game_concept_house_aspirations$ nebo odlišné [Concept('government','formy vlády')|E] jeho členů.\n\nUdržování vysoké úrovně $game_concept_bloc_cohesion$ přináší [Concept('member_houses','členským rodům')|E] různé bonusy podle aspirace $game_concept_leading_house$.\n\nPokud $game_concept_cohesion$ klesne na #V 0#!, $game_concept_house_bloc$ se automaticky rozpustí."
 game_concept_bloc_cohesion_tt: "#T @bloc_cohesion! $game_concept_bloc_cohesion$#!\n\n$game_concept_bloc_cohesion_desc$"
