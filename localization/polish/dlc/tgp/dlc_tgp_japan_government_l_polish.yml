 game_concept_house_bloc_desc: "$game_concept_house_bloc$ je obranné spojenectví [Concept('houses','rodů')|E] v rámci [Concept('realm','panství')|E]. Každý [Concept('member_house','členský rod')|E], který bude napaden, bude bráněn všemi ostatními $game_concept_member_houses$.\n\n[Concept('house_heads','Hlavy rodu')|E] rozhodují, zda se stanou [Concept('bloc_member_houses','členskými rody bloku')|E], přičemž je budou následovat všichni vládnoucí členové jejich rodu v panství.\n\nBloky mají vždy [Concept('leading_house','vůdčí rod')|E], jehož $game_concept_house_head$ může vylučovat ostatní členy, je upřednostňovaným [Concept('ceremonial_regent','vládnoucímu regentovi')|E] všech členů a jehož [Concept('house_aspiration','aspirace rodu')|E] určuje bonusy udělované vyššími úrovněmi [Concept('cohesion','soudržnosti')|E].\n\nPouze $game_concept_leading_house_possessive$ hlavě rodu může vytvářet [Concept('factions','frakce')|E] proti [Concept('top_liege','nejvyššímu lennímu pánovi')|E] a všichni členové $game_concept_bloc_member_houses$ se připojí ke všem [Concept('factions','frakcím')|E], které vytvoří." # todo: CONCEPT CASE
 game_concept_bloc_cohesion: "Soudržnost bloku"
 game_concept_cohesion: "Soudržnost"
 game_concept_bloc_cohesion_desc: "$game_concept_cohesion$ měří jednotu [Concept('house_bloc','rodového bloku')|E], přičemž vyšší úrovně poskytují členům [Concept('bloc_member_houses','členských rodů bloku')|E] rostoucí výhody podle [Concept('house_aspiration','aspirace rodu')|E] [Concept('leading_house_possessive','vůdčího rodu')|E].\n\nHlavním zdrojem jsou [Concept('house_relations','vztahy rodů')|E] mezi $game_concept_bloc_member_houses$, které mohou $game_concept_cohesion$ ovlivňovat kladně i záporně. Kromě toho může $game_concept_cohesion$ snižovat celková velikost bloku nebo nesoulad $game_concept_house_aspirations$ či [Concept('government','vlády')|E] jeho členů.\n\nUdržování určité úrovně $game_concept_bloc_cohesion$ udělí [Concept('member_houses','členským rodům')|E] různé bonusy podle aspirace $game_concept_leading_house$.\n\nPo dosažení #V 0#! $game_concept_cohesion$ se $game_concept_house_bloc$ automaticky rozpustí."
