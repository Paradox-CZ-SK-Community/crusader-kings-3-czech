 game_concept_regent_family_desc: "$game_concept_regent_family$ je nejvýznamnějším [Concept('house','rodem')|E] v [Concept('realm','panství')|E], kterému vládne [Concept('ceremonial_regent','vládnoucí regent')|E]."
