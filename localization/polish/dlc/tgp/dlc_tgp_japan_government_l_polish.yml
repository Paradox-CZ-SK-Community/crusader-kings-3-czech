 japanese_appointment_succession_law_effects: "\nTyp [Concept('appointment_succession_law','zákon nástupnictví jmenováním')|E]. Pod $japanese_appointment_succession_law$ bude [Concept('title','titul')|E] a s ním spojené [Concept('holdings','državami')|E] zděděny kandidátem s nejvyšším skóre. Každý [Concept('adult','dospělý')|E] v [Concept('realm','panství')|E] může usilovat o získání [Concept('governorship','guvernérství')|E] různými prostředky, od [Concept('scheming','osnování intrik')|E] po utrácení [Concept('influence','vlivu')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
