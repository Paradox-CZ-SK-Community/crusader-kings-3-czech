 japan_administrative_government_vassals_label: "$japan_administrative_government$ [Concept('obligations','Povinnosti')|E] jsou založeny na [GetPlayer.Custom('GetProvinceAdministrationConcept')]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 japan_administrative_government_desc: "\n$japan_administrative_government$ je typ [Concept('administrative','administrativní')|E] [Concept('government','vláda')|E] jedinečný pro Japonsko.\n\nJe to centralizovaný [Concept('government_bureaucratic_type','byrokratická')|E] [Concept('government_form','forma vlády')|E], kde jsou [Concept('characters','postavy')|E] jmenováni jako [Concept('governors','guvernéři')|E] jménem svého [Concept('liege','lenního pána')|E], mají přístup k [Concept('influence','vlivu')|E] a [Concept('noble_family','šlechtická rodina')|E] [Concept('house_head_heads','hlavy')|E] mají [Concept('family_manor','rodové sídlo')|E] a [Concept('house_aspiration','aspirace rodu')|E].\n\nA [Concept('kampaku','kampaku')|E] vládne [Concept('realm','panství')|E] jménem [Concept('japanese_emperor','japonským císařem')|E], a může být zvolen z řad [Concept('noble_family','šlechtická rodina')|E] [Concept('house_head_heads','hlavy')|E] nebo vynucen požadavkem [Concept('faction','frakcemi')|E].\n\n$japan_administrative_government$ [Concept('vassals','Vazalové')|E] obvykle spravují pouze jednu [Concept('county','hrabství')|E], ale mohou centralizovaný systém odmítnout a stát se místními pány [soryo|E], aby si vybudovali vlastní moc, což je obvykle považováno za [Concept('criminal','zločinné')|E].\n\n$japan_administrative_government$ Hlavy rodu mohou v [Concept('realm','panství')|E] vytvářet a připojovat se k [house_blocs|E], které podpoří [leading_house|E] v tom, aby se stala $game_concept_kampaku$.\n\n$japan_government_domain_limit_help$\n\n#F Systém $japan_administrative_government$ odkazuje na centralizovanou administrativní vládu Japonska, inspirovanou čínskou konfuciánskou byrokracií.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 japan_feudal_government: "Sōryō" # todo: NEW TRANSLATION
 japan_feudal_government_adjective: "$japan_feudal_government$" # todo: NEW TRANSLATION
 japan_feudal_government_with_icon: "@government_type_soryo! $japan_feudal_government$" # todo: NEW TRANSLATION
 japan_feudal_government_vassals_label: "$japan_feudal_government$ [Concept('obligations','Povinnosti')|E] vycházejí z [Concept('vassal_contract','vazalské smlouvy')|E] každého [Concept('vassal','vazala')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 japan_feudal_government_desc: "\n$japan_feudal_government$ je typ [Concept('feudal','feudální')|E] [Concept('government','vláda')|E] jedinečný v Japonsku.\n\n$japan_feudal_government$ představuje místní pány, kteří odvrhli nebo nahradili dosah centrální vlády [Concept('ritsuryo','$japan_administrative_government$')|E] a vládnou provinciím jako svým vlastním lénům.\n\n$postavy$s $japan_feudal_government$ nepoužívají [Concept('influence','vliv')|E], ale [Concept('noble_family','šlechtická rodina')|E] [Concept('house_head_heads','hlavy')|E] si ponechávají své [Concept('family_manor','rodové sídlo')|E] a [Concept('house_aspiration','aspirace rodu')|E].\n\nAčkoli nemohou být zvoleni [Concept('ceremonial_regent','vládnoucí regent')|E], $japan_feudal_government$ [Concept('rulers','vládci')|E] mohou získat moc prostřednictvím #V $replace_ceremonial_regent_faction_name$#! [Concept('faction','frakce')|E], a použít #V Formalize Shōgunate#! [Concept('decision','rozhodnutí')|E].\n\n$japan_feudal_government$ Vládnoucí regenti vládnou [Concept('realm','panství')|E] jménem [Concept('japanese_emperor','japonským císařem')|E], dědí podle $single_heir_succession_law$ [Concept('succession','nástupnictví')|E] a mohou být svrženi požadavkem [Concept('faction','frakcemi')|E].\n\n$japan_feudal_government$ Hlavy rodu mohou vytvářet a připojovat se k [house_blocs|E] v rámci [Concept('realm','panství')|E].\n\n$japan_government_domain_limit_help$\n\n#F $japan_feudal_government$ odkazuje na rané fáze japonské feudalizace, které začínají v období Heian a postupně se formalizovaly za prvního šógunátu v období Kamakura.#!" # todo: CONCEPT CASE
 japan_government_domain_limit_help: "@alert_icon! #HELP Japonská $game_concept_governments$ mají nižší [Concept('domain_limit','limitu domény')|E] než ostatní, které lze zvýšit povýšením rodovým sídlem.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
