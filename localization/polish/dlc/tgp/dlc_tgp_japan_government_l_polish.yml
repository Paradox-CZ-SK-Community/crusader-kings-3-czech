 japanese_regency_succession_law_effects: "Pod $japanese_regency_succession_law$ bude [Concept('title','titul')|E] a s ním spojené [Concept('holdings','državami')|E] zděděny kandidátem s nejvyšším skóre. Výběr kandidátů zahrnuje [Concept('noble_families','šlechtické rodiny')|E], [Concept('governors','guvernéři')|E] a jejich rodinné příslušníky v [Concept('realm','panství')|E].\n\nPokud bude [Concept('japanese_emperor','japonský císař')|E] zvolen jako další [Concept('ceremonial_regent','vládnoucí regent')|E], bude mít na výběr buď abdikovat jako [Concept('tenno','tennó')|E] nebo se pokusit znovu nastolit přímou vládu!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
