 japan_administrative_government: "Ricurjó"
 japan_administrative_government_adjective: "$japan_administrative_government$"
 japan_administrative_government_with_icon: "@government_type_ritsuryo! $japan_administrative_government$"
 japan_administrative_government_vassals_label: "[Concept('obligations','Povinnosti')|EU] ve vládě $japan_administrative_government$ se odvíjejí od [GetPlayer.Custom('GetProvinceAdministrationConcept')]"
 japan_administrative_government_desc: "\n$japan_administrative_government$ je typ [Concept('government_bureaucratic_type','byrokratické')|E] [Concept('government','vlády')|E] charakteristický pro Japonsko.\n\nJde o centralizovanou [Concept('government_bureaucratic_type','byrokratickou')|E] [Concept('government_form','formu vlády')|E], v níž jsou [Concept('characters','postavy')|E] jmenovány [Concept('governors','guvernéry')|E] jménem svého [Concept('liege','lenního pána')|E] a mají přístup k [Concept('influence','vlivu')|E]. [Concept('house_head_heads','Hlavy')|EU] [Concept('noble_family','šlechtických rodin')|E] navíc vlastní [Concept('family_manor','rodová sídla')|E] a mají své [Concept('house_aspiration','aspirace rodu')|E].\n\n[Concept('realm','Panství')|EU] spravuje [Concept('kampaku','kampaku')|E] jménem [Concept('japanese_emperor','japonského císaře')|E]. Do tohoto úřadu může být zvolena některá z [Concept('house_head_heads','hlav')|E] [Concept('noble_family','šlechtických rodin')|E], případně může být dosazení vynuceno požadavkem [Concept('faction','frakce')|E].\n\n[Concept('vassals','Vazalové')|EU] s vládou $japan_administrative_government$ obvykle spravují pouze jediné [Concept('county','hrabství')|E]. Mohou však odmítnout centralizovaný systém a stát se místními pány typu [Concept('soryo','$japan_feudal_government$')|E], kteří si budují vlastní mocenskou základnu. Takový krok je ovšem zpravidla považován za [Concept('criminal','zločinný')|E].\n\n$game_concept_house_heads$ s vládou $japan_administrative_government$ mohou v rámci [Concept('realm','panství')|E] zakládat [Concept('house_blocs','rodové bloky')|E] a připojovat se k nim. Tyto bloky pak podporují [Concept('leading_house','vůdčí rod')|E] v úsilí získat postavení $game_concept_kampaku$.\n\n$japan_government_domain_limit_help$\n\n#F Systém $japan_administrative_government$ představuje centralizovanou státní správu Japonska, inspirovanou čínskou konfuciánskou byrokracií.#!"
 japan_feudal_government: "Sórjó"
 japan_feudal_government_adjective: "$japan_feudal_government$"
 japan_feudal_government_with_icon: "@government_type_soryo! $japan_feudal_government$"
 japan_feudal_government_vassals_label: "[Concept('obligations','Povinnosti')|EU] ve vládě $japan_feudal_government$ vycházejí z [Concept('vassal_contract','vazalské smlouvy')|E] každého [Concept('vassal','vazala')|E]"
 japan_feudal_government_desc: "\n$japan_feudal_government$ je typ [Concept('feudal','feudální')|E] [Concept('government','vlády')|E] charakteristický pro Japonsko.\n\n$japan_feudal_government$ představuje místní pány, kteří se vymanili z dosahu ústřední vlády [Concept('ritsuryo','$japan_administrative_government$')|E] nebo její moc nahradili vlastní autoritou. Jednotlivým provinciím nyní vládnou jako svým osobním lénům.\n\n[Concept('characters','Postavy')|EU] s vládou $japan_feudal_government$ nevyužívají [Concept('influence','vliv')|E], ale [Concept('house_head_heads','hlavám')|E] [Concept('noble_family','šlechtických rodin')|E] zůstávají jejich [Concept('family_manor','rodová sídla')|E] a [Concept('house_aspiration','aspirace rodu')|E].\n\nAčkoli nemohou být zvoleni [Concept('ceremonial_regent','vládnoucím regentem')|E], [Concept('rulers','vládci')|E] typu $japan_feudal_government$ mohou uchopit moc prostřednictvím [Concept('faction','frakce')|E] #V $replace_ceremonial_regent_faction_name$#! a využít [Concept('decision','rozhodnutí')|E] #V Formalize Shōgunate#!.\n\n$game_concept_ceremonial_regents$ s vládou $japan_feudal_government$ spravují [Concept('realm','panství')|E] jménem [Concept('japanese_emperor','japonského císaře')|E]. Jejich [Concept('succession','nástupnictví')|E] se řídí zákonem $single_heir_succession_law$ a mohou být svrženi na základě požadavku [Concept('faction','frakce')|E].\n\n$game_concept_house_heads$ s vládou $japan_feudal_government$ mohou v rámci [Concept('realm','panství')|E] zakládat [Concept('house_blocs','rodové bloky')|E] a připojovat se k nim.\n\n$japan_government_domain_limit_help$\n\n#F Systém $japan_feudal_government$ představuje počáteční fáze feudalizace Japonska, která započala v období Heian a postupně získala pevnější podobu za prvního šógunátu v období Kamakura.#!"
 japan_government_domain_limit_help: "@alert_icon! #HELP Japonské $game_concept_governments$ mají nižší [Concept('domain_limit','limit domény')|E] než ostatní formy vlády. Tento limit lze zvýšit vylepšováním $game_concept_family_manor$.#!"
 tgp_is_japanese_governor_trigger: "Jsi [Concept('governor','guvernérem')|E] s vládou [GetGovernment('japan_administrative_government').GetName]"
 japanese_appointment_succession_law: "Nástupnictví jmenováním v systému $japan_administrative_government$"
 japanese_appointment_succession_law_subname: "Dědí kandidát s nejvyšším skóre"
 japanese_appointment_succession_law_effects: "\nJde o typ [Concept('appointment_succession_law','zákona nástupnictví jmenováním')|E]. Podle zákona $japanese_appointment_succession_law$ zdědí [Concept('title','titul')|E] a související [Concept('holdings','državy')|E] kandidát s nejvyšším skóre. O získání [Concept('governorship','guvernérství')|E] může usilovat každý [Concept('adult','dospělý')|E] obyvatel [Concept('realm','panství')|E], a to různými způsoby, od [Concept('scheming','osnování intrik')|E] až po využití [Concept('influence','vlivu')|E]."
 japanese_military_appointment_succession_law: "Vojenské nástupnictví v systému $japan_administrative_government$"
 japanese_military_appointment_succession_law_subname: "Dědí kandidát s nejvyšším skóre"
 japanese_military_appointment_succession_law_effects: "\nJde o typ [Concept('appointment_succession_law','zákona nástupnictví jmenováním')|E]. Podle zákona $japanese_military_appointment_succession_law$ zdědí [Concept('title','titul')|E] a související [Concept('holdings','državy')|E] kandidát s nejvyšším [Concept('candidate_score','skóre kandidáta')|E]. O vojenské [Concept('governorship','guvernérství')|E] může usilovat každý [Concept('adult','dospělý')|E] obyvatel [Concept('realm','panství')|E], a to vysokou [Concept('martial_skill','válečnickou dovedností')|E], získáváním [Concept('commander_traits','velitelských rysů')|E] nebo využíváním [Concept('influence','vlivu')|E].#!"
 japanese_regency_succession_law: "Japonské regentské nástupnictví"
 japanese_regency_succession_law_subname: "$appointment_succession_law_subname$"
 japanese_regency_succession_law_effects: "Podle zákona $japanese_regency_succession_law$ zdědí [Concept('title','titul')|E] a související [Concept('holdings','državy')|E] kandidát s nejvyšším skóre. Mezi kandidáty patří členové [Concept('noble_families','šlechtických rodin')|E] v [Concept('realm','panství')|E], [Concept('governors','guvernéři')|E] a jejich příbuzní.\n\nPokud bude [Concept('japanese_emperor','japonský císař')|E] vybrán jako příští [Concept('ceremonial_regent','vládnoucí regent')|E], bude si moci zvolit, zda abdikuje z postavení [Concept('tenno','tennóa')|E], nebo se pokusí obnovit přímou vládu!"
