 japanese_military_appointment_succession_law_effects: "\nTyp [Concept('appointment_succession_law','zákon nástupnictví jmenováním')|E]. Pod $japanese_military_appointment_succession_law$ bude [Concept('title','titul')|E] a s ním spojené [Concept('holdings','državami')|E] zděděny kandidátem s nejvyšším [Concept('candidate_score','skórem kandidáta')|E]. Každý [Concept('adult','dospělý')|E] v [Concept('realm','panství')|E] může usilovat o získání vojenského [Concept('governorship','guvernérství')|E] tím, že má dobrý [Concept('martial_skill','válečnická dovednost')|E], získá [Concept('commander_traits','velitelské rysy')|E], nebo utratí [Concept('influence','vliv')|E].#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
