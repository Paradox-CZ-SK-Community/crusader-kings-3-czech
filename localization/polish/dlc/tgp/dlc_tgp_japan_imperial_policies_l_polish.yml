l_polish:
 imperial_policy_laws: "Císařské politiky"
 imperial_policy_laws_singular: "[Concept('imperial_policy','Císařská politika')|EU]"
 defense_mobilization_law: "Obranná mobilizace"
 defense_mobilization_law_subname: "Panství se musí sjednotit proti vnějším hrozbám"
 defense_mobilization_law_effects: "$EFFECT_LIST_BULLET$Cena zbrojnic a stájí mezi [Concept('domicile_buildings','budovami domicilu')|E]: #P -25%#!\n$EFFECT_LIST_BULLET$Zpřístupňuje [Concept('casus_belli','casus belli')|E] [GetCasusBelliType('japan_imperial_reconquest_cb').GetName]"
 disarmament_law: "Odzbrojení"
 disarmament_law_subname: "Pro zachování míru musí být zbraně zabaveny"
 disarmament_law_effects: "$EFFECT_LIST_BULLET$Cena vnitřních [Concept('casus_belli','casus belli')|E] v prestiži: #N +[EmptyScope.ScriptValue('tgp_disarmament_law_increased_cb_cost_value')|0%]#!\n$EFFECT_LIST_BULLET$V rámci [Concept('government','vlády')|E] typu [GetGovernment('japan_administrative_government').GetName] lze stavět a vylepšovat [Concept('castle','hradní')|E] [Concept('holdings','državy')|E]"
 disarmament_law_increased_cb_cost_desc: "[GetLaw('disarmament_law').GetName]"
 isolation_law: "Vynucená izolace"
 isolation_law_subname: "Pro zachování stability je nutné zabránit cizincům ve vstupu do panství"
 isolation_law_effects: "$EFFECT_LIST_BULLET$[Concept('epidemics','Mory')|EU] se s menší pravděpodobností rozšíří do tvého [Concept('realm','panství')|E]\n$EFFECT_LIST_BULLET$Léčba, kterou poskytuje [GetCourtPositionType('court_physician_court_position').GetName()], má lepší výsledky"
 imperial_expansion_law: "Císařská pacifikace"
 imperial_expansion_law_subname: "Hranice panství musí být zabezpečeny"
 imperial_expansion_law_effects: "$EFFECT_LIST_BULLET$Cena zbrojnic a stájí mezi [Concept('domicile_buildings','budovami domicilu')|E]: #P -25%#!\n$EFFECT_LIST_BULLET$Zpřístupňuje [Concept('casus_belli','casus belli')|E] [GetCasusBelliType('japan_imperial_expansion_cb').GetName]\n$EFFECT_LIST_BULLET$Umožňuje vyhlašovat [Concept('wars','války')|E] proti vnějším nepřátelům"
 manor_reform_law: "Reforma sídel"
 manor_reform_law_subname: "Aby se zabránilo korupci, musí být půda přerozdělena"
 manor_reform_law_effects: "$EFFECT_LIST_BULLET$Náklady na odebrání [Concept('governorship','guvernérství')|E] v [Concept('influence','vlivu')|E] jsou poloviční"
 bandit_crackdown_law: "Potírání banditů"
 bandit_crackdown_law_subname: "Na venkově musí být obnoven pořádek"
 imperial_policy_laws_cooldown_desc: "[Concept('imperial_policy','Císařská politika')|EU] byla nedávno změněna. Další změnu lze provést až po [GetCurrentDateWithDiff( GetVarTimeRemaining( GetPlayer.MakeScope, 'imperial_policy_laws_cooldown') )]"
 IMPERIAL_POLICY_REASON: "[Concept('imperial_policy','Císařská politika')|EU]"
