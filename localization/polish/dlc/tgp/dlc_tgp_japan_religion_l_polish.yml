l_polish:
 tenet_pure_land_name: "Spravedlivé znovuzrození"
 tenet_pure_land_desc: "Zde, v #EMP paścima-kāla#!, věku úpadku dharmy, neposkytuje útěchu bohatství, vzdělání ani urozený původ. Pouze ti, kdo jsou skutečně oddáni Buddhovu učení, mohou dosáhnout znovuzrození v Čisté zemi."
 doctrine_parameter_tenet_pure_land_repentance_decision: "Můžeš využít [Concept('decision','rozhodnutí')|E] $pure_land_shed_sin_decision$ a nahradit [Concept('sinful','hříšný')|E] [Concept('trait','rys')|E] [Concept('virtuous','ctnostným')|E] [Concept('trait','rysem')|E]"
 doctrine_parameter_tenet_pure_land_aggressive_attacker_trait: "Získáš [Concept('commander_trait','velitelský rys')|E] [GetTrait('aggressive_attacker').GetName( GetNullCharacter )]"
 doctrine_parameter_tenet_pure_land_prestige_level_loss: "Ztratíš jednu [Concept('prestige_level','úroveň slávy')|E]"
 tenet_sohei_name: "Sóhei"
 tenet_no_mind_name: "Mysl bez mysli"
 tenet_no_mind_desc: "Mysl, která nemyslí, dosáhla skutečné bdělé pozornosti. Je to stav, o nějž usilují umělci, řemeslníci i mistři bojových umění. Tělo v něm dokáže bez přemýšlení reagovat na každou výzvu."
 doctrine_parameter_better_artifacts: "Financované [Concept('inspirations','inspirace')|E] vedou k vytvoření kvalitnějších [Concept('artifacts','artefaktů')|E]"
 doctrine_parameter_less_likely_to_become_infirm: "Postavy mají nižší pravděpodobnost získání [Concept('elder_traits','zdravotních rysů stáří')|E]"
 doctrine_parameter_less_likely_to_become_infirm_personal: "Máš nižší pravděpodobnost získání [Concept('elder_traits','zdravotních rysů stáří')|E]"
 tenet_mountain_worship_name: "Posvátné hory"
 tenet_mountain_worship_desc: "Vysoko nad vesnicemi a poli se hory dotýkají samotných oblak. Právě tam, mezi vrcholky a skalními srázy, lze skutečně nalézt posvátno."
 doctrine_parameter_piety_from_hills_and_mountains_pilgrimages: "Postavy získávají více [Concept('piety','zbožnosti')|E] za [Concept('pilgrimages','poutě')|E] do oblastí s terénem [GetTerrain( 'hills' ).GetName], [GetTerrain( 'mountains' ).GetName] a [GetTerrain( 'desert_mountains' ).GetName]"
 piety_from_hills_and_mountains_pilgrimages_tt: "Díky [Concept('core_tenet','zásadě')|E] [GetTenetType('tenet_mountain_worship').GetBaseName]: [piety_i]#P [THIS.ScriptValue('medium_piety_gain')]#!"
 doctrine_parameter_peasant_and_populist_factions_more_common: "Rolnické a populistické [Concept('factions','frakce')|E] vznikají častěji a jsou mocnější"
 doctrine_parameter_children_less_likely_to_be_burdened: "[Concept('children','Děti')|EU] mají nižší pravděpodobnost získání [Concept('trait','rysu')|E] [GetTrait('burdened').GetName( GetNullCharacter )]"
