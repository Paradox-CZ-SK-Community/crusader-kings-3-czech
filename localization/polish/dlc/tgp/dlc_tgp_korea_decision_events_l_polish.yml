l_polish:
 tgp_korea_decision.9101.t: "Sjednocené království"
 tgp_korea_decision.9101.intro: "Po celá staletí spolu království a národy tohoto poloostrova vedly zbytečné války. Stávaly se kořistí nájezdníků a zůstávaly slepé k velikosti a síle, které bychom mohli dosáhnout, kdybychom se konečně sjednotili."
 tgp_korea_decision.9101.desc: "\n\nDnes se tento sen stal skutečností a můj odkaz je navždy zajištěn. Jsem přece [ROOT.Char.GetMotherFather|l] říše [GetTitleByKey('e_goryeo').GetDefinitiveName] i královského rodu [ROOT.Char.GetHouse.GetBaseName]!"
 tgp_korea_decision.9101.a: "Kéž [GetTitleByKey('e_goryeo').GetTierAsNameNoTooltip|l] přetrvá tisíc let."
 tgp_korea_decision.9101.b: "A ponese jméno „Korjo“ na počest našeho slavného dědictví."
 tgp_korea_decision.9101.b.reason: "Tato možnost je dostupná díky tomu, že tvá [Concept('culture','kultura')|E] je [ROOT.Char.GetCulture.GetName]"
 tgp_korea_decision.9101.b.tt: "[GetTitleByKey('e_goryeo').GetDefinitiveName|U] bude přejmenována na #V Korjo#!"
 tgp_korea_decision.9102.t: "$tgp_korea_decision.9101.t$"
 tgp_korea_decision.9102.desc: "\n\nDnes se tento sen stal skutečností a odkaz [king_of_goryeo.Custom('CZ_TitledFirstName_G')] je navždy zajištěn. Dějiny už nikdy nezapomenou, kdo je [ROOT.Char.GetMotherFather|l] říše [GetTitleByKey('e_goryeo').GetDefinitiveName] a královského rodu [ROOT.Char.GetHouse.GetBaseName]!"
 cultural_acceptance_gain_unify_goryeo: "Sjednocení Husamguku"
 unify_goryeo_decision_requirement_tt: "[Concept('realms','Panství')|EU] s [Concept('heritage','dědictvím')|E] $heritage_korean_name$ a [Concept('government_bureaucratic_type','byrokratickou')|E] formou vlády musí založit [GetTitleByKey('e_goryeo').GetNameNoTier|V] prostřednictvím [Concept('decision','rozhodnutí')|E] [GetDecision('tgp_korea_unify_goryeo_decision').GetName]"
 unify_goryeo_decision_blocker_tt: "[Concept('realms','Panství')|EU] s [Concept('heritage','dědictvím')|E] $heritage_korean_name$ a [Concept('government_bureaucratic_type','byrokratickou')|E] formou vlády již nemohou vytvořit [GetTitleByKey('k_goguryeo').GetNameNoTier|V], [GetTitleByKey('k_silla').GetNameNoTier|V] ani [GetTitleByKey('k_baekje').GetNameNoTier|V], jakmile bylo přijato [Concept('decision','rozhodnutí')|E] [GetDecision('tgp_korea_unify_goryeo_decision').GetName]"
 tgp_korea_decision.9201.t: "Kormidlo v mnoha rukou"
 tgp_korea_decision.9201.desc: "Jak sláva mé vlády stále jasněji září, čím dál více lidí hledá útočiště v mém stínu. [Select_CString(ROOT.Char.IsFemale,'Žádná','Žádný')] [ROOT.Char.GetTitleAsNameNoTooltip|l] však nemůže vládnout bez pomoci a hranice mezi těmi, kdo skutečně drží moc, se neustále posouvají.\n\nMusím zůstat [Select_CString(ROOT.Char.IsFemale,'ostražitá','ostražitý')], pokud mají mí potomci i nadále skutečně vládnout panství, které nese jméno [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip], a nikoli být panovníky pouze podle jména..."
 tgp_korea_decision.9201.a: "Musím být vždy o krok napřed."
 MERITOCRATIC_CEREMONIAL_LIEGE_TITLE: "[founder.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_yy')|U] trůn"
 tgp_korea_decision.9202.desc: "Jak sláva vlády [founder.Custom('CZ_TitledFirstName_G')] stále jasněji září, čím dál více lidí hledá útočiště v [Select_CString(founder.IsFemale,'jejím','jeho')] stínu. [Select_CString(founder.IsFemale,'Žádná','Žádný')] [founder.GetTitleAsNameNoTooltip|l] však nemůže vládnout bez pomoci a hranice mezi těmi, kdo skutečně drží moc, se neustále posouvají.\n\n[founder.GetTitledFirstName|U] musí zůstat [Select_CString(founder.IsFemale,'ostražitá','ostražitý')], pokud mají [Select_CString(founder.IsFemale,'její','jeho')] potomci i nadále skutečně vládnout panství, které nese jméno [founder.GetPrimaryTitle.GetDefinitiveNameNoTooltip], a nikoli být panovníky pouze podle jména..."
 tgp_korea_decision.9202.a: "Moc má mnoho podob."
 tgp_create_meritocratic_ruling_regent_title_effect: "Vzhledem k tomu, že jako [Concept('ruler',Select_CString(GetPlayer.IsFemale,'vládkyně','vládce'))|E] stojíš v čele [Concept('empire','říše')|E] se zřízením [GetGovernment('meritocratic_government').GetName]:"
 tgp_create_meritocratic_ruling_regent_title_effect_title_tt: "Získáš titulární [Concept('kingdom','království')|E] s [Concept('title','titulem')|E], na který se vztahuje [Concept('law','zákon')|E] [GetLaw('single_heir_succession_law').GetName]"
 tgp_create_meritocratic_ruling_regent_title_effect_faction_tt: "[Concept('vassals','Vazalové')|EU] mohou zakládat [Concept('factions','frakce')|E] #V $replace_ceremonial_regent_faction$#!"
 tgp_create_meritocratic_ruling_regent_title_message_title: "Monarchie [founder.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] v ohrožení"
