 tgp_natural_disaster_earthquake_3_county_modifier: "Ničivé zemětřesení"
 tgp_natural_disaster_earthquake_3_county_modifier_desc: "Mimořádně silné otřesy přivádějí toto hrabství na pokraj úplné zkázy.\n$tgp_natural_disaster_cleanup_tt$"
