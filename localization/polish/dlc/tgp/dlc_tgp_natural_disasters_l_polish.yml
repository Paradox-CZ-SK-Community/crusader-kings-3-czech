 situation_type_natural_disaster_flood_desc: "$situation_natural_disaster_flood_desc$"
 situation_natural_disaster_flood_desc: "[Concept('flood','Povodeň')|EU] je [Concept('natural_disaster','přírodní pohroma')|E], která postupně způsobuje stále větší škody ve velkém počtu [Concept('counties','hrabství')|E].\n\nPovodně se mohou vyskytnout pouze podél břehů velkých řek."
 natural_disaster_flood_situation: "Povodeň – [Situation.MakeScope.Var('river_region').GeographicalRegion.GetNameNoTooltip]"
 natural_disaster_flood_situation_desc: "$situation_natural_disaster_flood_desc$"
 natural_disaster_flood_warning_situation_phase: "Varování"
 natural_disaster_flood_warning_situation_phase_desc: "Po celé oblasti se začínají objevovat kaluže a půda je stále více nasáklá vodou. Srážky mohou výrazně zesílit a řeky se začínají vylévat z břehů. Přestože povodeň dosud neudeřila plnou silou, je zřejmé, že voda může brzy proniknout do budov a zcela podmáčet okolní půdu."
 natural_disaster_flood_impact_situation_phase: "Úder"
 natural_disaster_flood_impact_situation_phase_desc: "Povodňová voda proniká do domů, zaplavuje cesty a strhává každého, kdo nedokáže odolat jejímu proudu. Pole, která ještě nedávno slibovala bohatou úrodu, nyní leží pod vodou. Podmáčená a zpustošená půda nevěstí pro příští sklizeň nic dobrého."
