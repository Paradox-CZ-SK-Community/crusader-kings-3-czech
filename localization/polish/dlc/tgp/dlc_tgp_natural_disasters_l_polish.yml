 situation_type_natural_disaster_earthquake: "$natural_disaster_earthquake_situation$"
 situation_natural_disaster_earthquake: "$natural_disaster_earthquake_situation$"
 situation_type_natural_disaster_earthquake_desc: "[Concept('earthquake','Zemětřesení')|EU] je druh [Concept('natural_disaster','přírodní pohromy')|E], který náhle způsobuje rozsáhlou zkázu v malém počtu [Concept('counties','hrabství')|E].\n\n$game_concept_earthquakes$ se mohou vyskytnout pouze v oblastech se zvýšenou seismickou aktivitou."
 situation_natural_disaster_earthquake_desc: "$situation_type_natural_disaster_earthquake_desc$"
 natural_disaster_earthquake_situation: "Zemětřesení [CZPrepV(Situation.MakeScope.Var('epicenter_county').Title.GetNameNoTierNoTooltip)] [Situation.MakeScope.Var('epicenter_county').Title.Custom('CZ_LandedNameNoTierNoTooltip_L')]"
 natural_disaster_earthquake_situation_desc: "$situation_type_natural_disaster_earthquake_desc$"
 natural_disaster_earthquake_warning_situation_phase: "Předtřesy"
 natural_disaster_earthquake_warning_situation_phase_desc: "Během [Concept('situation_phase','fáze situace')|E] předtřesů se zemí šíří slabé otřesy. Přestože jejich síla připomíná pouhé dunění cválajícího stáda, mohou být předzvěstí mnohem ničivějších sil, které se dávají do pohybu hluboko pod zemským povrchem."
 earthquake_warning: "$natural_disaster_earthquake_warning_situation_phase$"
 situation_natural_disaster_phase_earthquake_warning_effects: "$situation_natural_disaster_earthquake_phase_warning$"
 natural_disaster_earthquake_impact_situation_phase: "Úder"
 natural_disaster_earthquake_impact_situation_phase_desc: "Po nenápadných předtřesech se země začne prudce chvět. Budovy se mohou zřítit a padající trosky mohou lidi zranit nebo připravit o život. V epicentru zemětřesení se může otevřít hluboká trhlina, která rozpoltí okolní krajinu. Prudké otřesy zároveň vyvrhují do vzduchu prach a suť, což ještě zvyšuje nebezpečí pro každého, kdo se ocitne poblíž."
 situation_natural_disaster_phase_earthquake_impact_effects: "$situation_natural_disaster_earthquake_phase_impact$"
 natural_disaster_earthquake_recovery_situation_phase: "Obnova"
 natural_disaster_earthquake_recovery_situation_phase_desc: "Po hlavním otřesu se naplno projeví rozsah způsobené zkázy. Poddaní mohou propadat nespokojenosti, protože přišli o majetek i živobytí. Trosky komplikují obnovu a ztráty na životech znamenají méně obyvatel i pracovních sil, což celý proces obnovy dále zpomaluje."
