 tgp_natural_disaster_flood_3_county_modifier: "Katastrofální záplavy"
 tgp_natural_disaster_flood_3_county_modifier_desc: "Záplavy ohrožují samotnou existenci tohoto hrabství. Hrozí, že po nich zůstane jen zpustošená krajina zbavená veškerého bohatství.\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_cleanup_tt: "#HELP Tento [Concept('modifier','modifikátor')|E] lze odstranit prostřednictvím [Concept('great_project','velkého projektu')|E] na pomoc po pohromě.#!\n\n"
 tgp_natural_disaster_fortification_county_modifier: "Poškozené opevnění"
 tgp_natural_disaster_fortification_county_modifier_desc: "Nedávná [Concept('natural_disaster','přírodní pohroma')|E] poškodila opevnění v tomto hrabství. Hradby se začínají rozpadat a jejich obranyschopnost slábne.\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_exodus_1_county_modifier: "Částečný odchod obyvatel"
 tgp_natural_disaster_exodus_1_county_modifier_desc: "Kvůli nedávné [Concept('natural_disaster','přírodní pohromě')|E] uprchlo z tohoto hrabství mnoho obyvatel.\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_exodus_2_county_modifier: "Hromadný odchod obyvatel"
 tgp_natural_disaster_exodus_2_county_modifier_desc: "Kvůli [Concept('natural_disaster','přírodní pohromě')|E] uprchla většina obyvatel tohoto hrabství ve snaze nalézt bezpečné útočiště.\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_exodus_3_county_modifier: "Masový útěk obyvatel"
 tgp_natural_disaster_exodus_3_county_modifier_desc: "Ničivá [Concept('natural_disaster','přírodní pohroma')|E] zanechala toto hrabství téměř vylidněné.\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_fertility_1_county_modifier: "Rozmáčené pastviny"
 tgp_natural_disaster_fertility_1_county_modifier_desc: "Nedávná povodeň podmáčela část půdy v tomto hrabství natolik, že již není úrodná.\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_fertility_2_county_modifier: "Podmáčené pastviny"
 tgp_natural_disaster_fertility_2_county_modifier_desc: "Ničivá povodeň zpustošila pole tohoto hrabství a zanechala je nezpůsobilá k obdělávání.\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_fertility_3_county_modifier: "Zabahněné pastviny"
 tgp_natural_disaster_fertility_3_county_modifier_desc: "Povodeň proměnila pastviny tohoto hrabství v naprosto neúrodnou pustinu, která již nedokáže uživit žádný život.\n$tgp_natural_disaster_cleanup_tt$"
 tgp_natural_disaster_resettlement_county_modifier: "Přesídlení uprchlíků"
 tgp_natural_disaster_resettlement_county_modifier_desc: "Obyvatelé se po nedávné [Concept('natural_disaster','přírodní pohromě')|E] vracejí do tohoto hrabství v naději, že se jim podaří obnovit jeho někdejší prosperitu."
 tgp_natural_disaster_aid_county_modifier: "Poskytnutá pomoc"
 tgp_natural_disaster_aid_county_modifier_desc: "Přeživším [Concept('natural_disaster','přírodní pohromy')|E] je poskytována pomoc, která má přispět k obnovení stability a pozvednutí morálky."
 tgp_natural_disaster_flood_fertility_county_modifier: "Úrodnost po povodni"
 tgp_natural_disaster_flood_fertility_county_modifier_desc: "Nedávná povodeň obohatila půdu tohoto hrabství o živiny a zvýšila její úrodnost."
 councillor_is_available_for_disaster_recovery: "Pro řízení obnovy po [Concept('natural_disaster','přírodní pohromě')|E] je k dispozici [GetPlayer.Custom('GetCouncillorForDisasterRecovery')|l]."
 councillor_assigned_to_manage_disaster: "Obnovu po [Concept('natural_disaster','přírodní pohromě')|E] nyní řídí [GetPlayer.Custom('GetCouncillorForDisasterRecovery')|l]. Dokud nebude dokončen [Concept('great_project','velký projekt')|E] na pomoc po pohromě, nebude se moci věnovat jiným úkolům."
 councillor_busy_managing_disaster: "Řízením obnovy po [Concept('natural_disaster','přírodní pohromě')|E] se nyní zabývá [GetPlayer.Custom('GetCouncillorForDisasterRecovery')|l]. Dokonči [Concept('great_project','velký projekt')|E] na pomoc po pohromě, aby bylo opět možné přidělit jiné úkoly."
