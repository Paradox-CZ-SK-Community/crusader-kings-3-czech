l_polish:
 warning_effects: "Varování"
 warning_effects_concept: "[Concept('natural_disaster','Přírodní pohroma')|EU]"
 impact_effects: "Úder"
 impact_effects_concept: "[Concept('natural_disaster','Přírodní pohroma')|EU]"
 recovery_effects: "Obnova"
 recovery_effects_concept: "[Concept('natural_disaster','Přírodní pohroma')|EU]"
 warning: "Varování"
 warning_desc: "Mnohým [Concept('natural_disasters','přírodním pohromám')|E] předcházejí varovná znamení. Ať už jsou tyto změny v okolní přírodě zjevné, nebo sotva postřehnutelné, mohou upozornit na blížící se nebezpečí. Pozorný vládce, který jim věnuje náležitou pozornost, může včas zasáhnout a omezit ztráty."
 impact: "Úder"
 impact_desc: "Když pohroma udeří, vládcovy přípravy projdou skutečnou zkouškou. Navzdory veškerému úsilí si katastrofa pravděpodobně vyžádá oběti na životech a zastaví pokrok v zasažené oblasti. Ztráta [Concept('development','rozvoje')|E] a poškození stávající infrastruktury uvrhnou celý region do období nestability."
 recovery: "Obnova"
 recovery_desc: "Jakmile pohroma odezní, je nezbytné zahájit obnovu zasažené oblasti, případně prostřednictvím [Concept('great_project','velkého projektu')|E]. Prozíravý panovník rovněž přijme preventivní opatření, aby zmírnil následky případné další [Concept('natural_disaster','přírodní pohromy')|E]."
