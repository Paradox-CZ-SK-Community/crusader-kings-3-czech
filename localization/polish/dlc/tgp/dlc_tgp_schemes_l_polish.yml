 coup_ceremonial_liege_desc_general: "Nepřátelská [Concept('scheme','intrika')|E], která umožňuje [Concept('ceremonial_regent','vládnoucímu regentovi')|E] uchvátit trůn [Concept('ceremonial_liege','obřadního panovníka')|E]."
 coup_ceremonial_liege_warning: "@alert_icon! #M V případě úspěchu se někteří [Concept('vassals','vazalové')|E] panství mohou stát [Concept('independent','nezávislými')|E]. Záleží na jejich vztahu k předchozímu [Concept('ruler','vládci')|E], rozdílech v [Concept('culture','kultuře')|E] a [Concept('faith','víře')|E], jejich [Concept('opinion','mínění')|E] o dobrodruhovi, velikosti dílčích panství, vojenské síle, vzdálenosti od [Concept('capital','hlavního sídla')|E] a dalších faktorech#!"
