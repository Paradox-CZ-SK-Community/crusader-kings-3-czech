 scheme_critical_moments.1203.desc: "Zdá se, že pokladnice [target.Custom('CZ_LandedName_G')] je nedobytná. Stráže jsou neúplatné a účetní neomylní. Moji spolčenci jsou"
 scheme_critical_moments.1203.desc_secret: "$scheme_critical_moments.1203.desc$ v nejlepším případě k ničemu a v nejhorším představují nebezpečné svědky."
