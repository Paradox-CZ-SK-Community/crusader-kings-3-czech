 scheme_critical_moments.1232.t: "[scheme.GetNameNoTooltip|U]: Úspěch"
 scheme_critical_moments.1232.desc: "Na císařském dvoře už každý ví, jakými schopnostmi vyniká [target.GetName]. [Select_CString(target.IsFemale,'Její','Jeho')] kariéra nyní míří k novým výšinám. A to vše díky mému vlivu!"
 scheme_critical_moments.1232.desc.myself: "Mé schopnosti jsou nyní na císařském dvoře všeobecně známé. Podařilo se mi dobře využít svého vlivu a má kariéra brzy dosáhne nových výšin."
 scheme_critical_moments.1232.a: "Úspěchy jednotlivce svědčí o celé skupině!"
 scheme_critical_moments.1232.b: "[target.GetFirstNameNoTooltip|U] se nyní bude těšit větší úctě."
 scheme_critical_moments.1232.b.myself: "Teď si mě budou více vážit."
 scheme_critical_moments.1233.t: "[scheme.GetNameNoTooltip|U]: Neúspěch"
 scheme_critical_moments.1233.desc: "Moji spolčenci vychvalují [target.GetName] za schopnou správu, ale císařský dvůr zůstává k jejich slovům hluchý. Nikdo nechce uznat [Select_CString(target.IsFemale,'její','jeho')] znalosti v oblasti [target.Custom('education_focus')]."
 scheme_critical_moments.1233.desc.myself: "Moji spolčenci vychvalují mé vladařské schopnosti, ale císařský dvůr zůstává k jejich slovům hluchý. Nikdo nechce uznat mé znalosti v oblasti [target.Custom('education_focus')]."
 scheme_critical_moments.1233.a: "Alespoň já znám jejich hodnotu!"
 scheme_critical_moments.1235.t: "[scheme.GetNameNoTooltip|U]: Úspěch"
 scheme_critical_moments.1235.desc: "Moji spolčenci uspěli! Na celém císařském dvoře se nyní mluví o přešlapech a neschopnosti [target.Custom('CZ_Name_G')]. Všichni už vědí, že [target.GetName] je [target.Custom2('InsultNoun', ROOT.Char)]. [Select_CString(target.IsFemale,'Její','Jeho')] kariéra půjde díky mým machinacím strmě dolů!"
 scheme_critical_moments.1235.a: "Nedostatky jednotlivce vrhají stín na celou skupinu!"
 scheme_critical_moments.1235.b: "Pravá tvář [target.Custom('CZ_FirstNameNoTooltip_G')] vyšla najevo."
 scheme_critical_moments.1236.t: "[scheme.GetNameNoTooltip|U]: Neúspěch"
 scheme_critical_moments.1236.desc: "Moji spolčenci nemají co hlásit. Císařský dvůr odmítá uvěřit jakýmkoli pomluvám, které šíříme. Pověst [target.Custom('CZ_Name_G')] je zjevně bez poskvrny a postavení u císařského dvora neotřesitelné. [target.Custom2('InsultAdjective', ROOT.Char)|U] [target.GetName] je o krok přede mnou."
 scheme_critical_moments.1236.a: "[target.GetFirstNameNoTooltip|U] mi tentokrát [Select_CString(target.IsFemale,'proklouzla','proklouzl')] mezi prsty."
