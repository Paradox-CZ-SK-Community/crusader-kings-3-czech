 scheme_critical_moments.2922.t: "$coup_ceremonial_liege$: [Select_CString(ROOT.Char.IsFemale,'Nová','Nový')] [ROOT.Char.GetTitleAsNameNoTooltip]"
 scheme_critical_moments.2922.desc: "Naše plány jsme znovu a znovu prověřovali. Připravili jsme se na každou eventualitu a každý ze spiklenců přesně věděl, co má dělat. Pod záminkou služebních povinností nebylo nijak obtížné proniknout do [target.Custom('ResidenceBuilding')|l]...\n\nJakmile stráže vyhlásily poplach, rozpoutal se naprostý chaos. Uprostřed všeho toho zmatku, řinčení zbraní a zuřivého boje jsme se však nakonec probojovali k vítězství! Vyčerpaní, ale vítězní!\n\nA přece nám unikl jeden nebezpečný protivník. Ten [target.Custom2('InsultAdjective', ROOT.Char)] [Select_CString(target.IsFemale,'samozvaná','samozvaný')] [ROOT.Char.GetTitleAsNameNoTooltip], [target.GetFirstName], se [Select_CString(target.IsFemale,'dokázala','dokázal')] nějak dostat do bezpečí! Dokud bude na svobodě, zůstane hrozbou pro mé postavení."
 scheme_critical_moments.2922.a: "Teď v [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')] #EMP vládnu já#!!"
 scheme_critical_moments.2923.t: "$coup_ceremonial_liege$: Zmařené naděje"
 scheme_critical_moments.2924.t: "$coup_ceremonial_liege$: Ukradená koruna"
 scheme_critical_moments.2924.desc: "Den začal jako každý jiný, ale v [target.GetCapitalLocation.GetBaronyNameExplicitly] náhle nabral zlověstný spád. V [target.Custom('ResidenceBuilding')|l] se rozléhá křik stráží a vyděšených služebníků, kteří pobíhají chodbami.\n\nKonečně přiběhne udýchaný velitel stráží a vysvětluje, že se dovnitř pod falešnou záminkou dostala skupina ozbrojených ničemů. Nyní se násilím probíjejí až k trůnnímu sálu!\n\n"
 scheme_critical_moments.2924.imprison: "Vtom dovnitř vtrhnou vojáci. Než se stačím vzpamatovat, už mě vlečou před svého vůdce. [owner.GetFirstName|U] mi se škodolibým úsměvem bere korunu a vítězoslavně ji pozvedá."
 scheme_critical_moments.2924.death: "Pokusím se uprchnout, ale uprostřed zběsilé vřavy se ocitám přímo v cestě útočníků. Náhle proti mně zasviští čepel!"
 scheme_critical_moments.2924.outro: "Proplížím se ubikacemi služebnictva, převléknu se za prostého člověka a připojím se k davu prchajícímu z [target.Custom('ResidenceBuilding')|l]..."
 scheme_critical_moments.2924.a: "Já se ještě vrátím!"
 scheme_critical_moments.2924.b: "Ty odporná ropucho!"
 scheme_critical_moments.2924.c: "Zatraceně!"
 scheme_critical_moments.2925.t: "$coup_ceremonial_liege$: Vytoužená koruna"
 scheme_critical_moments.2925.desc: "Den začal jako každý jiný, ale v [target.GetCapitalLocation.GetBaronyNameExplicitly] náhle nabral zlověstný spád. V [target.Custom('ResidenceBuilding')|l] se rozléhá křik stráží a vyděšených služebníků, kteří pobíhají chodbami.\n\nKonečně přiběhne udýchaný velitel stráží a vysvětluje, že se dovnitř pod falešnou záminkou dostala skupina ozbrojených ničemů. Nyní se násilím probíjejí až k trůnnímu sálu!\n\nMí vojáci však brzy získají situaci pod kontrolu a zvuky boje postupně utichají."
 scheme_critical_moments.2925.imprison: "Vojáci přede mě přivlečou [owner.Custom('CZ_FirstName_A')], [Select_CString(owner.IsFemale,'bezvýznamnou bezzemkyni','bezvýznamného bezzemka')]. Plán násilím uchvátit mou korunu je nyní zcela odhalen."
 scheme_critical_moments.2925.death: "Přede mě přivlečou mrtvé tělo [owner.Custom('CZ_FirstName_G')], bezvýznamného člověka bez půdy a postavení. Pokus násilím uchvátit mou korunu skončil naprostým neúspěchem."
 scheme_critical_moments.2925.outro: "Dozvídám se, že útok [Select_CString(owner.IsFemale,'vedla','vedl')] [owner.GetFirstName], bezvýznamný člověk bez půdy a postavení, který se pokusil násilím uchvátit mou korunu. Ta zbabělá duše je však už dávno pryč."
 scheme_critical_moments.2925.a: "Za tohle #EMP zaplatíš#!."
 scheme_critical_moments.2925.b: "[owner.GetFirstName|U] už ví, jak končí uchvatitelé trůnu!"
 scheme_critical_moments.2925.c: "K čertu s [owner.Custom2('CZ_InsultNoun_I', ROOT.Char)]!"
 OWNER_IS_MY_MOVEMENT_MEMBER: "Je členem stejného [Concept('movement','hnutí')|E] jako [owner.GetShortUIName]: $VALUE|+0=$"
