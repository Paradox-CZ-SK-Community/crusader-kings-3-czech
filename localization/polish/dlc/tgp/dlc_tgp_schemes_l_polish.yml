 tgp_interaction_event.0020.t: "[scheme.GetNameNoTooltip|U]: Cíl"
 tgp_interaction_event.0020.desc: "Pokladnice [target.Custom('CZ_LandedName_G')] jen čeká, až se do ní dostanu. Nechám své spolčence pohrát si s účetními knihami, upravit záznamy v hlavních knihách a vyměnit stvrzenky.\n\nZískané bohatství pak využiji ke zvelebení svého guvernérství [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], k proslavení vlastního dvora, [ROOT.Char.Custom('GetCourt')]... nebo se jím snad prostě [Select_CString(ROOT.Char.IsFemale,'obohatím','obohatím')]?"
 tgp_interaction_event.0020.a: "Jejich mince budou cinkat v mých kapsách!"
 tgp_interaction_event.0020.b: "Jejich bohatství bude v mé pokladnici v bezpečí."
