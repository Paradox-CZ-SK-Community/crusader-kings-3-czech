 scheme_critical_moments.1202.desc: "Zdá se, že do pokladnice [target.Custom('CZ_LandedName_G')] nebude nijak těžké proniknout. Stráže se nechají snadno podplatit a účetní za svůj podíl na zisku ochotně upraví záznamy v knihách. Moji spolčenci tak mohou každý den odnášet značné množství zlata."
 scheme_critical_moments.1202.desc_discovered: "\n\n[target.GetHolder.GetName|U] možná už tuší, co se děje, ale teď už je příliš pozdě na to, abych [Select_CString(ROOT.Char.IsFemale,'couvla','couvl')]."
 scheme_critical_moments.1202.a: "Ještě jeden poslední podpis."
 scheme_critical_moments.1202.b: "Už mám dost."
 scheme_critical_moments.1202.c: "Teď už jen zahladit všechny stopy..."
