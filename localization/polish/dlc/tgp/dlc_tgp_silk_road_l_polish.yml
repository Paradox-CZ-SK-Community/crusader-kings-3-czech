 tgp_silk_road_events.0010.desc: "Procházím mezi rušnými stánky tržiště [CZPrepV(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetCurrentLocation,'L')], když se můj průvodce zmíní o útržcích rozhovorů, které zaslechl. Znovu a znovu v nich prý zaznívá „[innovation_temp.GetName]“. Mluví o tom celé město, ale jakmile kolem projde někdo cizí, jako třeba já, hlasy okamžitě utichnou.\n\nPod jedním z přístřešků si všimnu hloučku obchodníků. Zdají se méně ostražití než ostatní a nepřestávají hovořit, ani když se s průvodcem přiblížíme. Naskýtá se mi snad příležitost dozvědět se více?"
