 INNOVATION_IN_SUB_REGION: "#T [Concept('silk_road_innovation','Inovace Hedvábné stezky')|EU]#! v [Concept('region','regionu')|E] [SituationSubRegion.GetName]"
 game_concept_silk_road_innovation: "Inovace Hedvábné stezky"
 game_concept_silk_road_innovations: "Inovace Hedvábné stezky"
 game_concept_silk_road_innovation_desc: "$game_concept_silk_road_innovations$ jsou [Concept('innovations','inovace')|E], které se šíří na západ podél [Concept('silk_road_situation','Hedvábné stezky')|E].\n\nVždy po uplynutí [GetDefine('NSilkRoad', 'INNOVATION_TRAVEL_DURATION')|0V] let bude jedna $game_concept_silk_road_innovation$ objevená [Concept('culture','kulturou')|E] Chanů náhodně přiřazena čínské [Concept('situation_sub_region','oblasti situace')|E]. Všechny ostatní $game_concept_silk_road_innovations$ budou mezitím postupovat na západ podél $game_concept_silk_road$.\n\n$game_concept_cultures$ s [Concept('tradition','tradicí')|E] [GetCultureTradition('tradition_sinophilic').GetName] mají přístup ke všem $game_concept_silk_road_innovations$, které objevila chanská $game_concept_culture$.\n\n[Concept('rulers','Vládci')|EU] mimo $game_concept_silk_road$ se mohou pokusit přinést nové poznatky své [Concept('culture','kultuře')|E] prostřednictvím [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('visit_silk_road_market_decision').GetName|V]. Pokud uspějí, může jejich kultura po návratu objevit příslušnou $game_concept_silk_road_innovation$ stejně jako kteroukoli jinou $game_concept_innovation$."
