 silk_road_situation_participant_group_china_realm: "Země Podnebesí"
 silk_road_situation_participant_group_china_realm_desc: "Tato postava je [Concept('ruler','vládcem')|E], který nevede [Concept('nomadic','kočovný')|E] způsob života a vládne v oblasti [GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_proper_china').GetName]."
 silk_road_situation_participant_group_silk_road_domain: "Domény Hedvábné stezky"
 silk_road_situation_participant_group_silk_road_domain_desc: "Tato postava je [Concept('independent_ruler','nezávislým vládcem')|E], který nevede [Concept('nomadic','kočovný')|E] způsob života a sídlí mimo oblast [GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_proper_china').GetName]. Jeho [Concept('domain','doména')|E] leží na trase [GetGeographicalRegion('dlc_tgp_silk_road_route_region').GetName]."
 silk_road_situation_participant_group_silk_road_realm: "Panství Hedvábné stezky"
 silk_road_situation_participant_group_silk_road_realm_desc: "Tato postava je [Concept('independent_ruler','nezávislým vládcem')|E], který nevede [Concept('nomadic','kočovný')|E] způsob života a sídlí mimo oblast [GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_proper_china').GetName]. Jeho [Concept('realm','panství')|E] leží na trase [GetGeographicalRegion('dlc_tgp_silk_road_route_region').GetName]."
 silk_road_situation_participant_group_silk_road_periphery: "Okrajová panství"
 silk_road_situation_participant_group_silk_road_periphery_desc: "Tato postava je [Concept('independent_ruler','nezávislým vládcem')|E], který nevede [Concept('nomadic','kočovný')|E] způsob života a sídlí mimo oblast [GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_proper_china').GetName]. Jeho [Concept('realm','panství')|E] leží v oblasti [GetGeographicalRegion('tgp_silk_road_region').GetName]."
 silk_road_situation_participant_group_silk_road_nomad: "Stepní kočovníci"
 silk_road_situation_participant_group_silk_road_nomad_desc: "Tato postava je [Concept('nomadic','kočovným')|E] [Concept('independent_ruler','nezávislým vládcem')|E], který založil tábor na území [Concept('silk_road_situation','Hedvábné stezky')|E]."
 silk_road_situation_all: "Současná [Concept('situation_phase','fáze situace')|E] [Concept('silk_road','Hedvábné stezky')|E]"
 silk_road_situation_sub_region_region_silk_road_proper_china: "Čína"
 silk_road_situation_sub_region_region_silk_road_proper_china_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Na východě kupci nakupují hedvábí a čaj, které se následně vydávají na dlouhou cestu do vzdálených zemí. Spolu s tímto zbožím však obchodníci přinášejí ještě něco dalšího: nové #italic myšlenky#!.#!"
 silk_road_situation_sub_region_region_silk_road_proper_tibet: "Tibet"
 silk_road_situation_sub_region_region_silk_road_proper_tibet_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Tibetská náhorní plošina představuje nehostinnou krajinu, avšak mezi roztroušenými údolími a horskými průsmyky lze nalézt obchodní stezky.#!"
 silk_road_situation_sub_region_region_silk_road_proper_india: "Indie"
 silk_road_situation_sub_region_region_silk_road_proper_india_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Obchod proudí touto oblastí jako vody Gangy a Indu. Někdy jeho tok sílí, jindy slábne, ale nikdy zcela neustává.#!"
 silk_road_situation_sub_region_region_silk_road_proper_central_asia: "Střední Asie"
 silk_road_situation_sub_region_region_silk_road_proper_central_asia_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Bystré oko dokáže při pohledu přes širé stepi rozeznat nesčetné stezky táhnoucí se k obzoru. Příležitosti se zde nabízejí na každém kroku, ať už obchodníkům, nebo nájezdníkům.#!"
 silk_road_situation_sub_region_region_silk_road_proper_transcaspia: "Transkaspie"
 silk_road_situation_sub_region_region_silk_road_proper_transcaspia_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Kaspické a Černé moře nabízejí jedinečné možnosti obchodu a cestování. Řeky spojují jejich vody se severními zeměmi, které mají vlastní sítě obchodních tras a nabízejí další příležitosti k bohatství a štěstí.#!"
 silk_road_situation_sub_region_region_silk_road_proper_occident: "Západ"
 silk_road_situation_sub_region_region_silk_road_proper_occident_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Právě zde velké obchodní karavany dosahují svých konečných cílů a vznikají i zanikají celé majetky.#!"
