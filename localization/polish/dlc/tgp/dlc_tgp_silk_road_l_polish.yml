 visit_silk_road_market_decision_desc: "Ne všechno bohatství Hedvábné stezky se skrývá v mincích. Někdy na hřbetech velbloudů putují od jednoho bazaru k druhému také nové... #italic myšlenky#!. Stačí navštívit správné tržiště, promluvit si se správnými lidmi a odhalit tajemství, o nichž širý svět dosud nemá tušení."
