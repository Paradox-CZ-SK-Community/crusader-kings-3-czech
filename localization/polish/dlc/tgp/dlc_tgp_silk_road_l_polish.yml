l_polish:
 silk_road_situation: "Hedvábná stezka"
 silk_road_situation_desc: "$game_concept_silk_road_situation_desc$"
 situation_silk_road_situation_desc: "$silk_road_situation_desc$"
 game_concept_silk_road_situation: "Hedvábná stezka"
 game_concept_silk_road: "$game_concept_silk_road_situation$"
 game_concept_silk_road_situation_desc: "$game_concept_silk_road_situation$ není jediná cesta, ale rozsáhlá síť obchodních tras, které propojují i ty nejvzdálenější kouty civilizovaného světa a umožňují výměnu zlata, zboží i myšlenek. Kdo má přístup k Hedvábné stezce, má přístup k bohatství celého světa.\n\nRůzné úrovně přístupu k Hedvábné stezce poskytují odlišné bonusy ke zlatu a mohou nabídnout jedinečné příležitosti k odemčení exotických [Concept('innovations','inovací')|E]. Množství zlata a vědomostí proudících po Hedvábné stezce závisí na její prosperitě, kterou ovlivňuje řada faktorů, včetně válek, událostí a čínského [Concept('dynastic_cycle','dynastického cyklu')|E]."
 game_concept_situation_silk_road_phase_exceptional_bounty: "$situation_silk_road_phase_exceptional_bounty$"
 game_concept_situation_silk_road_phase_exceptional_bounty_desc: "$situation_silk_road_phase_exceptional_bounty_desc$"
 game_concept_situation_silk_road_phase_steady_trading: "$situation_silk_road_phase_steady_trading$"
 game_concept_situation_silk_road_phase_steady_trading_desc: "$situation_silk_road_phase_steady_trading_desc$"
 game_concept_situation_silk_road_phase_hardship: "$situation_silk_road_phase_hardship$"
 game_concept_situation_silk_road_phase_hardship_desc: "$situation_silk_road_phase_hardship_desc$"
 situation_silk_road_phase_exceptional_bounty: "Mimořádná hojnost"
 situation_silk_road_phase_exceptional_bounty_desc: "Když Hedvábná stezka zažívá dobré časy, lze na ní získat nesmírné poklady, dosahovat závratných zisků a šířit nové myšlenky i inovace do nejvzdálenějších koutů světa."
 situation_silk_road_phase_steady_trading: "Stabilní obchod"
 situation_silk_road_phase_steady_trading_desc: "Obchodníci dosahují zisků, smlouvají o cenách a obchod pokračuje jako obvykle. Jinde se možná nabízejí výnosnější příležitosti, ale Hedvábná stezka představuje spolehlivější cestu k bohatství."
 situation_silk_road_phase_hardship: "Strádání"
 situation_silk_road_phase_hardship_desc: "Války, pohromy a nepředvídatelné zvraty osudu přivedly obchod na Hedvábné stezce k naprostému ochromení. Neproudí po ní peníze ani nové myšlenky a každého, kdo se vydá po jejích trasách, čeká jen bída a utrpení."
 phase_exceptional_bounty: "$situation_silk_road_phase_exceptional_bounty$"
 phase_exceptional_bounty_desc: "$situation_silk_road_phase_exceptional_bounty_desc$"
 phase_steady_trading: "$situation_silk_road_phase_steady_trading$"
 phase_steady_trading_desc: "$situation_silk_road_phase_steady_trading_desc$"
 phase_hardship: "$situation_silk_road_phase_hardship$"
 phase_hardship_desc: "$situation_silk_road_phase_hardship_desc$"
