l_polish:
 tgp_dynastic_cycle.0051.t: "$dynastic_cycle$ – [GetSituation('dynastic_cycle').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 tgp_dynastic_cycle.0051.desc.intro: "Země zvaná [GetSituation('dynastic_cycle').GetTopSubRegion.GetName] je nesmírně rozlehlá a oplývá bohatstvím. Jejímu panovníkovi svěřila samotná Nebesa právo vládnout. Aby si uchoval jejich přízeň, musí vládnout spravedlivě, neboť tyranie může přivolat hněv Nebes.\n\nNyní nastala doba nazývaná"
 tgp_dynastic_cycle.0051.desc.advancement: "$tgp_dynastic_cycle.0051.desc.intro$ [GetSituation('dynastic_cycle').GetTopCurrentPhase.GetType.GetNameNoTooltip], v níž se očekává velký technologický pokrok a růst bohatství všech obyvatel říše."
 tgp_dynastic_cycle.0051.desc.expansion: "$tgp_dynastic_cycle.0051.desc.intro$ [GetSituation('dynastic_cycle').GetTopCurrentPhase.GetType.GetNameNoTooltip], v níž se očekávají velká vítězství, rozsáhlá dobývání a slavné činy prokazující sílu říše."
 tgp_dynastic_cycle.0051.desc.conquest: "$tgp_dynastic_cycle.0051.desc.intro$ [GetSituation('dynastic_cycle').GetTopCurrentPhase.GetType.GetNameNoTooltip], v níž je osud všech obyvatel říše nejistý."
 tgp_dynastic_cycle.0051.desc.corruption: "$tgp_dynastic_cycle.0051.desc.intro$ [GetSituation('dynastic_cycle').GetTopCurrentPhase.GetType.GetNameNoTooltip], v níž [GetTitleByKey('h_china').GetHolder.GetName] [Select_CString(GetTitleByKey('h_china').GetHolder.IsFemale,'nedokázala','nedokázal')] následovat ctnostný příklad svých předků. Stát propadl mravnímu úpadku a vydal se napospas ničemným ministrům bez špetky cti."
 tgp_dynastic_cycle.0051.desc.consolidation: "$tgp_dynastic_cycle.0051.desc.intro$ [GetSituation('dynastic_cycle').GetTopCurrentPhase.GetType.GetNameNoTooltip], v níž je země [GetSituation('dynastic_cycle').GetTopSubRegion.GetNameNoTooltip] rozvrácena soupeřícími vojevůdci, kteří mezi sebou bojují o Mandát Nebes. V tomto chaosu už nikdo nedbá na zušlechťování ducha a mravní ctnosti."
 tgp_dynastic_cycle.0051.desc.emperor: "\n\nJako panovník nesu odpovědnost za zachování Mandátu Nebes a spravedlivou vládu. Musím být jako Polárka, kolem níž obíhají všechna nebeská tělesa."
 tgp_dynastic_cycle.0051.desc.advancement_movement: "Říká se, že v dobách míru má člověk sloužit jako schopný ministr. Nelze však popřít, že v časech chaosu bývají vychytralí a lstiví lidé často odměňováni více než ti ctnostní..."
 tgp_dynastic_cycle.0051.desc.expansion_movement: "\n\nLidé jako já, kteří slouží jako mocní vojevůdci, zajistí stabilitu říše."
 tgp_dynastic_cycle.0051.desc.pro_hegemon_movement: "\n\nPouze panovník může naplnit dané sliby. Proto [GetTitleByKey('h_china').GetHolder.GetName] ode mě získá neochvějnou podporu!"
 tgp_dynastic_cycle.0051.desc.conservative_movement: "\n\nMá rodina se vždy bude řídit vůlí Nebes."
 tgp_dynastic_cycle.0051.desc.unaligned_movement: "\n\nMá úloha v tomto nekonečném cyklu je zatím nejistá. Až nadejde čas zaujmout stanovisko, Nebesa mi ukážou cestu."
 tgp_dynastic_cycle.0051.desc.interloper: "\n\nMožná to není země našich předků, ale nabízí tolik lákavých příležitostí, že jim lze jen stěží odolat. Musíme však postupovat obezřetně."
 tgp_dynastic_cycle.0051.a.emperor: "Kéž naše vláda trvá deset tisíc let!"
 tgp_dynastic_cycle.0051.a.involved: "Bohatství i čest závisí na vůli Nebes!"
 tgp_dynastic_cycle.0051.a.interloper: "Štěstěna je vrtkavá jako vítr a mraky."
 intro_event_joined_movement: "Připojení k hnutí [my_movement.GetName]"
 tgp_dynastic_cycle.0052.t: "Připojení k hnutí [ROOT.Char.Custom('GetMyMovementNoTooltip')]"
 tgp_dynastic_cycle.0052.desc.intro_common: "[GetTitleByKey('h_china').GetHolder.GetName|U] je z vůle Nebes [Select_CString(GetTitleByKey('h_china').GetHolder.IsFemale,'vyvolena','vyvolen')] naplnit příslib éry [GetSituation('dynastic_cycle').GetTopCurrentPhase.GetName]. Já se mezitím vydávám cestou, kterou prosazuje [ROOT.Char.Custom('GetMyMovement')]."
 tgp_dynastic_cycle.0052.desc.intro: "$tgp_dynastic_cycle.0052.desc.intro_common$\n\nSvět je plný pokušení a vlivných lidí. Prozatím se musím držet stranou všech politických intrik a soustředit se na svůj statek a místní úřad.\n\n"
 tgp_dynastic_cycle.0052.desc.advancement: "Doufám v blahobyt říše a v to, že její obyvatelé budou mít možnost rozvíjet svůj život a nadání. Možná časem začnu příznivěji uvažovat o vstupu do hnutí [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey('advancement_movement').GetName]."
 tgp_dynastic_cycle.0052.desc.expansion: "Budu pozorně sledovat zprávy z bojišť a oslavovat všechna vítězství. Možná pak začnu uvažovat o vstupu do hnutí [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey('expansion_movement').GetName]."
 tgp_dynastic_cycle.0052.desc.conquest: "Budu však také pozorně sledovat vládu dynastie [ROOT.Char.GetTopLiege.GetDynastyName] a podle toho, zda získává, či ztrácí přízeň Nebes, se zařídím."
 tgp_dynastic_cycle.0052.desc.instability: "Přesto mě znepokojuje, kam říše směřuje, a obávám se, že vládnoucí dynastie [ROOT.Char.GetTopLiege.GetDynastyName] může přijít o svou legitimitu, kterou představuje [ROOT.Char.GetTopLiege.GetLegitimacyType.GetFlavorName(ROOT.Char.GetTopLiege.GetLegitimacyLevel.Self)]."
 tgp_dynastic_cycle.0052.a: "Zachovám si nestrannost."
 tgp_dynastic_cycle.0053.t: "$tgp_dynastic_cycle.0052.t$"
 tgp_dynastic_cycle.0053.desc.intro: "$tgp_dynastic_cycle.0052.desc.intro_common$\n\nMezi ostatními členy se mi nabízí mnoho příležitostí naučit se novým vojenským taktikám a strategiím. Na vrcholu celé kariérní dráhy září úřad zvaný [ROOT.Char.GetTopLiege.GetCouncillor('councillor_marshal').GetCouncilTitle], vysněný cíl každého, kdo se vydal vojenskou cestou."
 tgp_dynastic_cycle.0053.desc.advancement: "Současná vláda [ROOT.Char.GetTopLiege.Custom('CZ_Name_G')] nás však plně nepodporuje. Musíme podniknout kroky, které nasměrují [GetSituation('dynastic_cycle').GetName] k éře [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName], abychom mohli naplno rozvinout svůj potenciál."
 tgp_dynastic_cycle.0053.desc.expansion: "Vůlí Nebes je dobývat a my jsme připraveni!"
 tgp_dynastic_cycle.0053.desc.conquest: "Vůlí Nebes je dobývat a dynastie [ROOT.Char.GetTopLiege.GetDynastyName] nám jde příkladem."
 tgp_dynastic_cycle.0053.desc.instability: "Časy jsou však nejisté a budoucnost zahalená mlhou. Pořádek dokáže udržet jedině armáda. Doufejme, že si to dynastie [ROOT.Char.GetTopLiege.GetDynastyName] uvědomí dříve, než bude pozdě."
 tgp_dynastic_cycle.0053.a: "Zvítězit mohou jen ti nejsilnější!"
 tgp_dynastic_cycle.0054.t: "$tgp_dynastic_cycle.0052.t$"
 tgp_dynastic_cycle.0054.desc.intro: "$tgp_dynastic_cycle.0052.desc.intro_common$\n\nNaším cílem je šířit krásu umění a vědění. Zušlechťování mysli a ducha je nejjistější cestou k přízni Nebes."
 tgp_dynastic_cycle.0054.desc.advancement: "Dynastie [ROOT.Char.GetTopLiege.GetDynastyName] se nyní ubírá stejnou cestou. Ta přinese blahobyt a osvícení celému Podnebesí! Musíme zajistit, aby na ní setrvala."
 tgp_dynastic_cycle.0054.desc.expansion: "Dynastie [ROOT.Char.GetTopLiege.GetDynastyName] se vydala cestou zkázy. Armády stojí mnoho peněz a vojevůdci jsou nestálí a nebezpeční. Musíme jim zabránit v dalším získávání moci."
 tgp_dynastic_cycle.0054.desc.conquest: "Dynastie [ROOT.Char.GetTopLiege.GetDynastyName] je nová, a proto ji ještě můžeme přesvědčit, že vůle Nebes se naplňuje prostřednictvím zkoušek a spravedlivých úředníků!"
 tgp_dynastic_cycle.0054.desc.instability: "Dynastie [ROOT.Char.GetTopLiege.GetDynastyName] zbloudila z pravé cesty. Můžeme jí však pomoci vrátit se zpět, pokud zajistíme pravidelné zkoušky a jmenování ministrů podle jejich zásluh."
 tgp_dynastic_cycle.0054.a: "Zásluhy stojí nade vším."
 tgp_dynastic_cycle.0055.t: "$tgp_dynastic_cycle.0052.t$"
 tgp_dynastic_cycle.0055.desc.intro: "$tgp_dynastic_cycle.0052.desc.intro_common$\n\nSpolu s ostatními členy hnutí jsme svěřili své životy [GetTitleByKey('h_china').GetHolder.Custom('CZ_Name_D')]. Pod [Select_CString(GetTitleByKey('h_china').GetHolder.IsFemale,'jejím','jeho')] moudrým vedením přineseme "
 tgp_dynastic_cycle.0055.desc.advancement: "blahobyt, bohatství a technologický pokrok všem obyvatelům Podnebesí."
 tgp_dynastic_cycle.0055.desc.expansion: "dalším zemím a národům poznání, že jim [GetTitleByKey('h_china').GetHolder.GetName] má z vůle Nebes spravedlivě vládnout."
 tgp_dynastic_cycle.0055.desc.conquest: "všem obyvatelům Podnebesí poznání, že dynastie [GetTitleByKey('h_china').GetHolder.GetDynastyName] je hodna Mandátu Nebes."
 tgp_dynastic_cycle.0055.desc.instability: "do těchto pochmurných časů znovu sluneční svit."
 tgp_dynastic_cycle.0055.a: "Sláva Nebesům i dynastii [ROOT.Char.GetTopLiege.GetDynastyNameNoTooltip]!"
 tgp_dynastic_cycle.0056.t: "$tgp_dynastic_cycle.0052.t$"
 tgp_dynastic_cycle.0056.desc.intro: "$tgp_dynastic_cycle.0052.desc.intro_common$\n\nTradice vybudované předchozími generacemi by měly tvořit základ úřednické správy dynastie [ROOT.Char.GetTopLiege.GetDynastyName].\n\n"
 tgp_dynastic_cycle.0056.desc.advancement: "[ROOT.Char.GetTopLiege.GetName|U] však [Select_CString(ROOT.Char.GetTopLiege.IsFemale,'podlehla','podlehl')] slepé víře ve zkoušky a dovoluje venkovským sedlákům pronikat do úřadů. Brzy budou znevažovat naše dějiny."
 tgp_dynastic_cycle.0056.desc.expansion: "[ROOT.Char.GetTopLiege.GetName|U] však v nesmyslných válkách marní životy našich bratří a sester. Vojevůdci si mezitím bez jakékoli kontroly přivlastňují moc a úřady, které náležejí našim rodinám."
 tgp_dynastic_cycle.0056.desc.conquest: "[ROOT.Char.GetTopLiege.GetName|U] musí pochopit, že jedině tak lze v říši zachovat pořádek. Celé Podnebesí uzná vládu [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip], pokud za ní budou stát naše vážené rody."
 tgp_dynastic_cycle.0056.desc.instability: "[ROOT.Char.GetTopLiege.GetName|U] [Select_CString(ROOT.Char.GetTopLiege.IsFemale,'ztratila','ztratil')] mnoho důvěry. Zpět si ji získá jedině tím, že se bude řídit radami našich rodin."
 tgp_dynastic_cycle.0056.a: "Síla spočívá v rodinných poutech."
 tgp_dynastic_cycle.0061.t: "Nebesy [Select_CString(GetTitleByKey('h_china').GetHolder.IsFemale,'milovaná dcera','milovaný syn')]"
 tgp_dynastic_cycle.0061.desc: "Říká se, že Nebesa jsou nestranná a vždy stojí na straně ctnostných. Stejně tak se však říká, že vítěz se stává králem, zatímco poražený končí jako bandita. Trůn [GetTitleByKey('h_china').Custom('CZ_LandedNameNoTierNoTooltip_G')] nyní patří #EMP mně#! a spolu s ním mi Nebesa svěřila právo vládnout celé [GetTitleByKey('h_china').Custom('CZ_LandedNameNoTierNoTooltip_D')].\n\nNyní musím rozhodnout, jakým směrem se vydají mí noví ministři a zástupy úředníků, kteří jim slouží."
 tgp_dynastic_cycle.0061.a: "Naší povinností je podporovat ctnost a vymýtit neřest."
 tgp_dynastic_cycle.0061.b: "Pod širými Nebesy jsou #EMP všichni#! poddanými [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_G')]."
 tgp_dynastic_cycle.0061.c: "Když stojím na vrcholu světa, všechno ostatní se zdá nepatrné."
 tgp_dynastic_cycle.0062.desc.involved: "Přízeň Nebes vždy sílila či slábla podle ctností, nebo naopak neřestí panovníků, které si Nebesa vyvolila.\n\nNyní hvězda dynastie [GetTitleByKey('h_china').GetHolder.GetDynastyName] stoupá a [GetTitleByKey('h_china').GetHolder.GetTitledFirstName] se nepochybně těší nebeskému požehnání."
 tgp_dynastic_cycle.0062.desc.interloper: "Zatímco jednomu osud ubírá štěstí, druhému jej dopřává. Ani králové a císařové nejsou ušetřeni jeho rozmarů.\n\n[GetTitleByKey('h_china').GetHolder.GetTitledFirstName|U] [Select_CString(GetTitleByKey('h_china').GetHolder.IsFemale,'získala','získal')] Mandát Nebes a od všech se nyní očekává, že před novým panovníkem padnou na kolena."
 tgp_dynastic_cycle.0062.desc.uninvolved: "Říše povstávají a zanikají, staré ustupuje novému. Trůnu [GetTitleByKey('h_china').Custom('CZ_LandedNameNoTierNoTooltip_G')] se nyní [Select_CString(GetTitleByKey('h_china').GetHolder.IsFemale,'ujala','ujal')] [GetTitleByKey('h_china').GetHolder.GetTitledFirstName]. S novým panovníkem musí počítat každý, ať už žije v [Select_CString(GetTitleByKey('h_china').GetHolder.IsFemale,'jejím','jeho')] panství, nebo za jeho hranicemi.\n\nTakové zvraty osudu nelze brát na lehkou váhu."
 tgp_dynastic_cycle.0062.a: "Bude třeba pečlivě posoudit [Select_CString(GetTitleByKey('h_china').GetHolder.IsFemale,'její','jeho')] schopnosti."
 tgp_dynastic_cycle.0062.b: "$tgp_dynastic_cycle.0072.b$"
 tgp_dynastic_cycle.0071.t: "Po dešti vychází slunce"
 tgp_dynastic_cycle.0071.desc: "Poslední bouřková mračna se rozplynula a nad [GetTitleByKey('h_china').Custom('CZ_LandedNameNoTierNoTooltip_I')] se opět rozjasňuje obloha. [Select_CString(ROOT.Char.IsFemale,'Překonala jsem','Překonal jsem')] všechny zkoušky, které přede mě osud postavil, a nyní už nikdo nemůže pochybovat ani popírat, že jsem skutečně [Select_CString(ROOT.Char.IsFemale,'Nebesy vyvolenou dcerou','Nebesy vyvoleným synem')].\n\nČasy útrap jsou za námi. Musím nyní vytyčit novou cestu do budoucnosti, aby se všichni mohli sjednotit za společným cílem."
 tgp_dynastic_cycle.0071.a: "$tgp_dynastic_cycle.0061.a$"
 tgp_dynastic_cycle.0071.b: "$tgp_dynastic_cycle.0061.b$"
 tgp_dynastic_cycle.0072.desc.advancement: "Po období těžkých zkoušek a nepokojů se do [GetTitleByKey('h_china').Custom('CZ_LandedNameNoTierNoTooltip_G')] opět vrací mír. Útrapy seslané Nebesy byly překonány a nikdo již nemusí pochybovat, že [GetTitleByKey('h_china').GetHolder.GetTitledFirstName] si uchovává jejich přízeň."
 tgp_dynastic_cycle.0072.desc.expansion: "$tgp_dynastic_cycle.0051.desc.advancement$"
 tgp_dynastic_cycle.0072.desc.conquest: "$tgp_dynastic_cycle.0051.desc.advancement$"
 tgp_dynastic_cycle.0072.desc.involved: "Pro některé to znamená konec jejich ambicí, mnohým však tato zpráva přináší sladkou úlevu."
 tgp_dynastic_cycle.0072.desc.interloper: "Časy míru nabízejí statečným hrdinům jen málo příležitostí, jak se proslavit. Nyní se jim však mohou otevřít jiné cesty k vzestupu."
 tgp_dynastic_cycle.0072.desc.uninvolved: "Zdá se, že dynastii [GetTitleByKey('h_china').GetHolder.GetDynastyName] přece jen zbývá ještě dost sil."
 tgp_dynastic_cycle.0072.a: "Zavál jarní vánek a tráva znovu raší."
 tgp_dynastic_cycle.0072.b: "Jedinou správnou cestou je následovat vůli Nebes."
 tgp_china_consolidation.remain_independent: "Zůstat [Concept('independent_ruler','nezávislým vládcem')|E]"
 tgp_dynastic_cycle.0081.t: "Dlouho sjednocená říše se musí rozdělit"
 tgp_dynastic_cycle.0081.desc: "V jediném okamžiku se Nebesa zachvějí a celý svět se obrátí vzhůru nohama.\n\nVěrní ministři prchají hledat nové pány, vojáci opouštějí své povinnosti a nyní dokonce i rolníci utíkají z mých zemí ve strachu z blížících se nepokojů.\n\nVšechna neštěstí jsou připisována mé #EMP ničemné#! vládě a po celé říši se rozléhá zpráva, že jsem [Select_CString(ROOT.Char.IsFemale,'ztratila','ztratil')] Mandát Nebes!"
 tgp_dynastic_cycle.0081.a: "Když padne strom, opice se rozutečou."
 tgp_dynastic_cycle.0082.desc.involved: "Vůle lidu a vůle Nebes jsou jedno a totéž. Tentokrát se staré přísloví opět naplnilo – #EMP Mandát Nebes byl ztracen#!.\n\nŘíše se rozpadla na kusy. Draci a tygři mezi sebou lačně soupeří o trůn.\n\nNastávají bouřlivé časy."
 tgp_dynastic_cycle.0082.desc.interloper: "Kde kdysi vládl jediný panovník, nyní jich povstává mnoho.\n\nSe ztrátou Mandátu Nebes zmizel i zákonný vládce, kterého by bylo třeba poslouchat. Všechny zástěrky padly a dosud skrývané ambice vyšly najevo.\n\nOdvážní se musí chopit každé příležitosti, kterou jim osud nabídne."
 tgp_dynastic_cycle.0082.desc.uninvolved: "Mocná říše hoří a její poddaní se chápou zbraní, aby mohli bojovat o to, co z ní zbude.\n\n[GetTitleByKey('h_china').GetNameNoTierNoTooltip|U] se rozpadla a v její dohledné budoucnosti jsou jisté pouze nepokoje. Ti, kdo se rozhodnou zasáhnout do nadcházejících bojů, dobrovolně vstupují do tygřího doupěte."
 tgp_dynastic_cycle.0082.a: "Krize je příležitost."
 tgp_dynastic_cycle.0091.t: "Předzvěst utrpení"
 tgp_dynastic_cycle.0091.desc: "Přestože se ze všech sil snažím vládnout spravedlivě, stále častěji ke mně doléhají nespokojené hlasy.\n\nMusím si připustit znepokojivou možnost, že víra v nebeské požehnání mé vlády začíná slábnout. Takové pochybnosti totiž dokážou otřást i těmi nejpevnějšími základy trůnu."
 tgp_dynastic_cycle.0091.a: "Voda, která loď nadnáší, ji může také převrátit."
 tgp_dynastic_cycle.0092.desc.involved: "Svět sužuje nemoc. Choroba ducha.\n\nTam, kde kdysi pevně stály pilíře ctnosti, se nyní bez zábran šíří zloba a nepravosti. Zkažení úředníci se obohacují na úkor lidu, kterému mají sloužit, a vojáci začínají přemýšlet, zda není výhodnější drancovat než chránit."
 tgp_dynastic_cycle.0092.desc.interloper: "Zdá se, že [GetTitleByKey('h_china').GetNameNoTierNoTooltip] prochází neblahými časy.\n\nKaždým dnem opouští tamní země další karavana či kupecký konvoj a hledá štěstí jinde. Dokonce i ti nejchamtivější z našich kupců dávají stále častěji přednost našim krajům před jejich. Přinášejí znepokojivá vyprávění o vydírání, při němž se mečem vyhrožuje stejně ochotně, jako se úřednickým perem vymáhají poplatky."
 tgp_dynastic_cycle.0092.desc.uninvolved: "$tgp_dynastic_cycle.0092.desc.interloper$"
 tgp_dynastic_cycle.0092.a: "Zkaženost je nemoc, na kterou neexistuje lék."
 tgp_dynastic_cycle.9001.t: "Základy nového státu"
 tgp_dynastic_cycle.9001.desc: "Stejně jako všechny řeky plynou na východ k moři, obracejí se nyní i nesčetné zástupy obyvatel Podnebesí ke mně jako ke svému panovníkovi.\n\nPrvním krokem na počátku mé vlády musí být vyhlášení jména naší říše, aby všichni věděli, jak nazývat zemi, k níž náležejí.\n\nPod jakým jménem budou naše činy znít dějinami?"
 tgp_dynastic_cycle.9001.a: "Ať to všichni slyší a vědí!"
 tgp_dynastic_cycle.9002.t: "Pět prvků ctnosti"
 tgp_dynastic_cycle.9002.desc: "Nebesa mají pět prvků, které je třeba udržovat v náležité rovnováze a vzájemném souladu.\n\nDřevo, oheň, země, kov a voda.\n\nJiž od dávných dob si každá nově nastupující dynastie zvolila jeden z těchto prvků proměny za svůj symbol a podle něj zbarvila své prapory. Nyní musím učinit stejnou volbu."
 tgp_dynastic_cycle.9002.yellow: "Volím #color:{0.82,0.77,0.5};bold žlutou#!, barvu země, neměnnou a pevnou jako samotné základy naší říše."
 tgp_dynastic_cycle.9002.red: "Ať jsou naše prapory #color:{0.80,0.3,0.3};bold rudé#! jako oheň, který prudce plane v mém srdci."
 tgp_dynastic_cycle.9002.white: "Ať jsou #color:{1.0,1.0,1.0};bold bílé#!, čisté a neposkvrněné, na znamení pevného a nepoddajného kovu."
 tgp_dynastic_cycle.9002.black: "Naše prapory ať jsou #color:{0.4,0.39,0.37};bold černé#! jako vody, jejichž hloubku nelze změřit a konce dohlédnout."
 tgp_dynastic_cycle.9002.green: "Ať mají #color:{0.4,0.61,0.3};bold zelenou#! barvu jarního listí a bujícího života."
 tgp_dynastic_cycle_decision_event.0101.t: "$renounce_noble_family_title_decision$"
 tgp_dynastic_cycle_decision_event.0101.desc: "Stohy listin přede mnou rostou tak vysoko, že přes ně sotva vidím. Když zavřu oči, slyším jen dětský smích, hovory starších a veselí dospělých u hostiny. Ach, ta vůně, která se line od rožně, na němž se připravuje [ROOT.Char.Custom('RegionalEdibleMeat')]!\n\n[Select_CString(ROOT.Char.IsFemale,'Tvrdě jsem pracovala','Tvrdě jsem pracoval')], abych se [Select_CString(ROOT.Char.IsFemale,'dostala','dostal')] až sem, a mnohé z toho mi přinášelo opravdovou radost. Teď však na mě doléhá únava. Nepochybuji, že [new_player.Custom2('MyCharacterIntroduction', ROOT.Char)] už netrpělivě čeká na příležitost převzít mé místo.\n\nZasloužím si užít si čas, který mi ještě zbývá."
 tgp_dynastic_cycle_decision_event.0101.a: "[new_player.GetFirstNameNoTooltip|U] si jistě se vším poradí."
