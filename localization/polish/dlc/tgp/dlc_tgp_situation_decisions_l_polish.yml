 favor_dynastic_cycle_era: "Upřednostnit éru"
 favor_dynastic_cycle_era_hegemon_desc: "Břímě vlády mi těžce spočívá na bedrech. Mým posláním je nést a chránit [Concept('mandate_of_heaven','Mandát Nebes')|E] a kola [GetSituation('dynastic_cycle').GetName] se nezadržitelně otáčejí s každým mým rozhodnutím. Budoucnost všech, kdo žijí v Podnebesí, spočívá v mých rukou. Čeká nás mír a blahobyt, nebo vítězné války a pokoření cizích panovníků?"
 favor_dynastic_cycle_era_chaos_desc: "Pokud mám jednoho dne přijmout posvátnou odpovědnost za [Concept('mandate_of_heaven','Mandát Nebes')|E], musím se již nyní chovat jako skutečný panovník a myslet na nesčetné zástupy lidí, kteří ve mně budou spatřovat vládce celého Podnebesí. Až – ne, #EMP jakmile#! – ta chvíle přijde, čeká je mír a blahobyt, nebo vítězné války a pokoření cizích panovníků?"
 favor_dynastic_cycle_era_decision_hegemon_tooltip: "[Concept('son_of_heaven','Syn Nebes')|EU] může určit [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName] nebo [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName] jako [Concept('favored_era','upřednostněnou éru')|E]"
