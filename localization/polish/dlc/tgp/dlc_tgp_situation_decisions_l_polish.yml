 claim_mandate_turn_vassal_celestial_desc: "Všichni [Concept('de_jure','de iure')|E] [Concept('vassals','vazalové')|E] [GetTitleByKey('h_china').GetDefinitiveNamePossessive] ve tvém [Concept('realm','panství')|E], kteří nemají [Concept('government','vládu')|E] typu [GetGovernment( 'republic_government' ).GetNameWithIcon] ani [GetGovernment( 'theocracy_government' ).GetNameWithIcon], přijmou [Concept('government','vládu')|E] typu [GetGovernment( 'celestial_government' ).GetNameWithIcon]"
