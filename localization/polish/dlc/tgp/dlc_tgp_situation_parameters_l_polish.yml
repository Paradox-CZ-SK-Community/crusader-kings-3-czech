 dynastic_cycle_participant_group_hegemon_ruler_desc: "[Concept('son_of_heaven','Syn Nebes')|E], [Concept('holder','držitel')|E] titulu [GetTitleByKey('h_china').GetDefinitiveName]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 dynastic_cycle_participant_group_other_rulers: "Ostatní vládci"
 dynastic_cycle_participant_group_other_rulers_desc: "Všichni [Concept('rulers','vládci')|E] v [GetSituation('dynastic_cycle').GetTopSubRegion.GetName], kteří nejsou [Concept('vassals','vazalech')|E] [GetTitleByKey('h_china').GetDefinitiveName]" # todo: CONCEPT CASE
 dynastic_cycle_participant_group_advancement_movement: "Rozvoj $game_concept_movement$" # todo: NEW TRANSLATION
 dynastic_cycle_participant_group_advancement_movement_desc: "Všichni [Concept('vassals','vazalové')|E] [GetTitleByKey('h_china').GetDefinitiveName], kteří si přejí posunout [Concept('dynastic_cycle','dynastický cyklus')|E] směrem k [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName] [Concept('situation_dynastic_cycle_phase','éře dynastickému cyklu')|E].\n\nVěnují se obohacování čínských jádrových provincií: zvyšováním [Concept('development','rozvojem')|E], dokončováním [Concept('great_projects','velkými projekty')|E], objevováním [Concept('innovations','inovací')|E] a získáváním [Concept('merit','zásluhami')|E] prostřednictvím [Concept('examinations','zkoušek')|E].\n$unlockables_advancement$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 dynastic_cycle_participant_group_expansion_movement: "Expanze $game_concept_movement$" # todo: NEW TRANSLATION
 dynastic_cycle_participant_group_expansion_movement_desc: "Všichni [Concept('vassals','vazalové')|E] [GetTitleByKey('h_china').GetDefinitiveName], kteří si kladou za cíl posunout [Concept('dynastic_cycle','dynastický cyklus')|E] směrem k [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName] [Concept('situation_dynastic_cycle_phase','éře dynastickému cyklu')|E].\n\nAby usnadnili dobývání území mimo Čínu, zaměřují se na posílení [GetSubjectContractType( 'celestial_provinces' ).GetObligationNameShort( 'celestial_province_military' )] [Concept('governors','guvernéry')|E], zvyšování [Concept('prowess','udatnost')|E], [Concept('martial_lifestyle','válečnický životní styl')|E] vzdělání a osvojení [Concept('commander_traits','velitelské rysy')|E].\n$unlockables_expansion$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 dynastic_cycle_participant_group_pro_hegemon_movement: "Pro-[SelectLocalization( GetPlayer.IsValid, 'pro_hegemon_movement_in_game_name', 'Dynasty' ) ] hnutí" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 pro_hegemon_movement_in_game_name: "[GetTitleByKey('h_china').GetBaseNameNoTierNoTooltip]" # todo: NEW TRANSLATION
 dynastic_cycle_participant_group_pro_hegemon_movement_desc: "Všichni [Concept('vassals','vazalové')|E] [GetTitleByKey('h_china').GetDefinitiveName], kteří úzce sledují vůli [Concept('son_of_heaven','syna Nebes')|E].\n\nUsilují stát se vlivnými [Concept('governors','guvernéry')|E] a [Concept('ministers','ministři')|E], kteří horlivě podporují [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey('hegemon_ruler').GetNameNoTooltip]. Mají $situation_parameter_pro_hegemon_interaction_boost$." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 dynastic_cycle_participant_group_conservative_movement: "Konzervativní $game_concept_movement$" # todo: NEW TRANSLATION
 dynastic_cycle_participant_group_conservative_movement_desc: "Všichni [Concept('vassals','vazalové')|E] [GetTitleByKey('h_china').GetDefinitiveName], kteří usilují posílit šlechtu.\n\nSoustředí se na reformy a změny, které prospějí [Concept('powerful_families','mocné rodiny')|E] a proslulým [Concept('dynasties','dynastiemi')|E], přičemž kultivují tradici spíše než [Concept('merit','zásluhy')|E].\n$unlockables_conservative$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 unlockables_advancement: "$BULLET_WITH_TAB$Získává přístup k #V $boost_efficiency_interaction$#! [Concept('interaction','interakci')|E]\n$BULLET_WITH_TAB$$scholarly_inspiration_frequency_desc$\n$BULLET_WITH_TAB$Zvýšená [Concept('aptitude','způsobilost')|E] [GetCourtPositionType('court_poet_court_position').GetName] [Concept('court_position','dvorský úřad')|E]\n$BULLET_WITH_TAB$Získává přístup k [GetDecisionWithKey('tgp_japan_become_a_poet_decision').GetName] [Concept('decision','rozhodnutí')|E]\n$BULLET_WITH_TAB$Získává přístup k [GetDecisionWithKey('diligent_development_focus_decision').GetName] [Concept('decision','rozhodnutí')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 unlockables_expansion: "$BULLET_WITH_TAB$Získává přístup k #V $damage_efficiency_interaction$#! [Concept('interaction','interakci')|E]\n$BULLET_WITH_TAB$Získává přístup k #V $fp3_request_turkic_invasion_interaction$#! [Concept('interaction','interakce')|E]\n$BULLET_WITH_TAB$Získává přístup k #V $spar_with_knight_interaction$#! [Concept('interaction','interakcí')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 unlockables_conservative: "$BULLET_WITH_TAB$Získává přístup k #V $damage_efficiency_interaction$#! [Concept('interaction','interakci')|E]\n$BULLET_WITH_TAB$Může požádat o změnu [GetLawGroup('candidate_score_laws').GetName] [Concept('law','zákon')|E] prostřednictvím [GetDecisionWithKey('movement_petition_decision').GetName] [Concept('decision','rozhodnutí')|E]\n$BULLET_WITH_TAB$Může postavit [GetDomicileBuilding('east_asian_estate_reception_hall_01').GetName] [Concept('domicile_building_upgrade','vnitřní vylepšení')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 dynastic_cycle_participant_group_undecided_movement: "Nezařazení" # todo: NEW TRANSLATION
 dynastic_cycle_participant_group_undecided_movement_desc: "Všichni [Concept('vassals','vazalové')|E] [GetTitleByKey('h_china').GetDefinitiveName], kteří dosud nezaujali postoj k současnému stavu [Concept('dynastic_cycle','dynastického cyklu')|E].\n\nMohou být přesvědčeni, aby se připojili k libovolnému jinému [Concept('movement','hnutí')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
