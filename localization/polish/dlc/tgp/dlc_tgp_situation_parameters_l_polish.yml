 dynastic_cycle: "Dynastický cyklus" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 dynastic_cycle_desc: "$game_concept_dynastic_cycle_desc$" # todo: NEW TRANSLATION
 situation_dynastic_cycle: "Tento $game_concept_dynastic_cycle$" # todo: NEW TRANSLATION
 situation_dynastic_cycle_desc: "$game_concept_dynastic_cycle_desc$" # todo: NEW TRANSLATION
 situation_dynastic_cycle_phase_stability_expansion: "Expanze" # todo: NEW TRANSLATION
 situation_dynastic_cycle_phase_stability_expansion_icon: "@tgp_dynastic_cycle_expansion_icon! $situation_dynastic_cycle_phase_stability_expansion$" # todo: NEW TRANSLATION
 situation_dynastic_cycle_phase_stability_expansion_desc_short: "V tomto [Concept('dynastic_cycle_era_short','éře')|E] se Impérium soustředí na posilování navenek: pacifikací pohraničí, rozšiřováním vlivu vojenskou silou, [tributaries|E] a [silk_road|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 situation_dynastic_cycle_phase_stability_expansion_desc: "$situation_dynastic_cycle_phase_stability_expansion_desc_short$\n\n$SITUATION_DYNASTIC_CYCLE_FROM_UNSTABLE_ERA$ Proto, aby byla Čína přetvořena do tohoto éry z [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName] éry, musí nejprve vstoupit do [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName] éry." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 situation_dynastic_cycle_phase_stability_advancement: "Rozvoj" # todo: NEW TRANSLATION
 situation_dynastic_cycle_phase_stability_advancement_icon: "@tgp_dynastic_cycle_advancement_icon! $situation_dynastic_cycle_phase_stability_advancement$" # todo: NEW TRANSLATION
 situation_dynastic_cycle_phase_stability_advancement_desc_short: "V tomto [Concept('dynastic_cycle_era_short','éře')|E] se Impérium soustředí na zlepšování sebe sama pohledem dovnitř: skrze [Concept('innovations','inovaci')|E], kulturní dokonalost, prosperitu lidu a dobré [Concept('meritorious','záslužné')|E] [GetReligionByKey('confucianism_religion').GetAdjective] vládnutí." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 situation_dynastic_cycle_phase_stability_advancement_desc: "$situation_dynastic_cycle_phase_stability_advancement_desc_short$\n\n$SITUATION_DYNASTIC_CYCLE_FROM_UNSTABLE_ERA$ Proto, aby byla Čína přetvořena do tohoto éry z [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName] éry, musí nejprve vstoupit do [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName] éry." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 SITUATION_DYNASTIC_CYCLE_FROM_UNSTABLE_ERA: "Čína vstupuje do tohoto éry z [Concept('dynastic_cycle_era_type_unstable','nestabilní éry')|E], pokud se spustí dostatek [Concept('situation_catalyst_catalysts','katalyzátory')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 situation_dynastic_cycle_phase_instability_conquest: "Dobytí" # todo: NEW TRANSLATION
 situation_dynastic_cycle_phase_instability_conquest_icon: "@tgp_dynastic_cycle_conquest_icon! $situation_dynastic_cycle_phase_instability_conquest$" # todo: NEW TRANSLATION
 situation_dynastic_cycle_phase_instability_conquest_desc_short: "Jedná se o [Concept('dynastic_cycle_era_short','éru')|E] konsolidace poté, co cizí moc dobyla Čínu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 situation_dynastic_cycle_phase_instability_conquest_desc: "$situation_dynastic_cycle_phase_instability_conquest_desc_short$\n\nAby se vstoupilo do tohoto éry, [Concept('hegemony','hegemonie')|E] Číny musí padnout do rukou [Concept('ruler','vládce')|E], který #bold nemá#! [GetGovernment('celestial_government').GetName|E] [Concept('government','vláda')|E] nebo [Concept('culture','kultura')|E] [Concept('heritage','dědictví')|E], který #bold není#! $heritage_chinese_name$." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 situation_dynastic_cycle_phase_instability: "Napětí" # todo: NEW TRANSLATION
 situation_dynastic_cycle_phase_instability_icon: "@tgp_dynastic_cycle_instability_icon! $situation_dynastic_cycle_phase_instability$" # todo: NEW TRANSLATION
 situation_dynastic_cycle_phase_instability_desc: "$situation_dynastic_cycle_phase_instability_desc_short$ Pokud je [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_chaos').GetName] zabráněno, je možné, že Čína dosáhne buď [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName] nebo [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName] $game_concept_dynastic_cycle_era_short$.\n\nČína vstupuje do tohoto éry z [Concept('dynastic_cycle_era_type_stable','stabilní éry')|E], pokud se spustí dostatek [Concept('situation_catalyst_catalysts','katalyzátory')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 situation_dynastic_cycle_phase_instability_desc_short: "Toto [Concept('dynastic_cycle_era_short','éra')|E] je dobou neklidu, ale i příležitostí. I když korupce, lidové nepokoje a invaze představují hrozbu, moudrá vláda může Čínu reformovat." # todo: CONCEPT CASE
 situation_dynastic_cycle_phase_chaos: "Rozdělení" # todo: NEW TRANSLATION
 situation_dynastic_cycle_phase_chaos_icon: "@tgp_dynastic_cycle_chaos_icon! $situation_dynastic_cycle_phase_chaos$" # todo: NEW TRANSLATION
 situation_dynastic_cycle_phase_chaos_desc_short: "Je to [Concept('dynastic_cycle_era_short','éra')|E] vojenských vládců, kde pouze silný [Concept('ruler','vládce')|E] může sjednotit Čínu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 situation_dynastic_cycle_phase_chaos_desc: "$situation_dynastic_cycle_phase_chaos_desc_short$\n\nToto $game_concept_dynastic_cycle_era_short$ začíná buď pokud:\n$EFFECT_LIST_BULLET$V kterémkoli [Concept('dynastic_cycle_era_type_unstable','nestabilní éře')|E] se spustí dostatek [Concept('situation_catalyst_catalysts','katalyzátory')|E]\n$EFFECT_LIST_BULLET$Současný [Concept('son_of_heaven','syn Nebes')|E] ztratí [Concept('mandate_of_heaven','mandát Nebes')|E]\n\n#S Když toto $game_concept_dynastic_cycle_era_short$ začne#!\n$BULLET$#indent_newline:2 [Concept('hegemony','hegemonie')|E] Číny [Concept('title','titul')|E] je zničena a bývalý [Concept('son_of_heaven','syn Nebes')|E] je [Concept('deposed','sesazený')|E]#!\n$BULLET$#indent_newline:2 [Concept('empire','říše')|E] a [Concept('kingdom','království')|E] [Concept('title_tier','úroveň')|E] [Concept('titles','tituly')|E] v [Concept('de_jure','de iure')|E] hierarchii jsou také zničeny, pokud jejich [Concept('holders','držitelé')|E] mají [movement_power_i][Concept('movement_power_short','síly')|E] nižší než [EmptyScope.ScriptValue('high_movement_power_value')] a [EmptyScope.ScriptValue('medium_movement_power_value')] respektive#!\n$BULLET$#indent_newline:2 Nezávislí [Concept('rulers','vládci')|E] složí věrnost nebo budou platit tribut svým [Concept('elders','starším')|E] nebo [Concept('movement_leaders','vůdci hnutí')|E]\n$BULLET$Každý nezávislý [Concept('ruler','vládce')|E] se připojí k #V $dynastic_cycle_participant_group_other_rulers$#! [Concept('situation_participant_group','skupina účastníků')|E]#!\n$BULLET$Každá ostatní [Concept('situation_participant_group','skupina účastníků')|E] bude rozpuštěna" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 situation_dynastic_cycle_phase_stability: "Stabilita" # todo: NEW TRANSLATION
 situation_dynastic_cycle_phase_stability_desc: "#D Tato fáze by neměla být zobrazena#!" # todo: NEW TRANSLATION
