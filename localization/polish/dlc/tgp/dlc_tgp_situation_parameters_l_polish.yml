 dynastic_cycle_sub_region_peripheries: "Čínské periferie" # todo: NEW TRANSLATION
 dynastic_cycle_sub_region_peripheries_desc: "Všechna [Concept('counties','hrabství')|E], které nejsou součástí [GetSituation('dynastic_cycle').GetSubRegionByKey( 'core' ).GetName], ale jsou stále vlastněny [Concept('son_of_heaven','syn Nebes')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
