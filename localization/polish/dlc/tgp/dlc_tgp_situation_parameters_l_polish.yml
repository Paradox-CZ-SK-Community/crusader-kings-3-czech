 dynastic_cycle: "$game_concept_dynastic_cycle$"
 dynastic_cycle_desc: "$game_concept_dynastic_cycle_desc$"
 situation_dynastic_cycle: "$game_concept_dynastic_cycle$"
 situation_dynastic_cycle_desc: "$game_concept_dynastic_cycle_desc$"
 situation_dynastic_cycle_phase_stability_expansion: "Expanze"
 situation_dynastic_cycle_phase_stability_expansion_icon: "@tgp_dynastic_cycle_expansion_icon! $situation_dynastic_cycle_phase_stability_expansion$"
 situation_dynastic_cycle_phase_stability_expansion_desc_short: "V této [Concept('dynastic_cycle_era_short','éře')|E] se říše soustředí na posilování své moci navenek: upevňování pohraničí, vojenskou expanzi, získávání [Concept('tributaries','tributářů')|E] a rozvoj [Concept('silk_road','Hedvábné stezky')|E]."
 situation_dynastic_cycle_phase_stability_expansion_desc: "$situation_dynastic_cycle_phase_stability_expansion_desc_short$\n\n$SITUATION_DYNASTIC_CYCLE_FROM_UNSTABLE_ERA$ Pokud má Čína přejít z období [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName|l] do této éry, musí nejprve nastat $game_concept_dynastic_cycle_era_short$ označovaná jako [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName|l]. Teprve poté může začít nová $game_concept_dynastic_cycle_era_short$."
 situation_dynastic_cycle_phase_stability_advancement: "Rozvoj"
 situation_dynastic_cycle_phase_stability_advancement_icon: "@tgp_dynastic_cycle_advancement_icon! $situation_dynastic_cycle_phase_stability_advancement$"
 situation_dynastic_cycle_phase_stability_advancement_desc_short: "V této [Concept('dynastic_cycle_era_short','éře')|E] se říše zaměřuje na svůj vnitřní rozvoj: [Concept('innovations','inovace')|E], kulturní rozkvět, blahobyt lidu a řádnou [Concept('meritorious','záslužnou')|E] správu v duchu [CZReligionAdjDecline(GetReligionByKey('confucianism_religion'),'ých')|l] zásad."
 situation_dynastic_cycle_phase_stability_advancement_desc: "$situation_dynastic_cycle_phase_stability_advancement_desc_short$\n\n$SITUATION_DYNASTIC_CYCLE_FROM_UNSTABLE_ERA$ Pokud má Čína přejít z období [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName|l] do této éry, musí nejprve nastat $game_concept_dynastic_cycle_era_short$ označovaná jako [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName|l]. Teprve poté může začít nová $game_concept_dynastic_cycle_era_short$."
 SITUATION_DYNASTIC_CYCLE_FROM_UNSTABLE_ERA: "Tato $game_concept_dynastic_cycle_era_short$ může v Číně nastat po kterékoli z [Concept('dynastic_cycle_era_type_unstable','nestabilních ér')|E], pokud se aktivuje dostatek [Concept('situation_catalyst_catalysts','katalyzátorů')|E]."
 situation_dynastic_cycle_phase_instability_conquest: "Dobytí"
 situation_dynastic_cycle_phase_instability_conquest_icon: "@tgp_dynastic_cycle_conquest_icon! $situation_dynastic_cycle_phase_instability_conquest$"
 situation_dynastic_cycle_phase_instability_conquest_desc_short: "[Concept('dynastic_cycle_era_short','Éra')|EU] upevňování moci po dobytí Číny cizí mocností."
 situation_dynastic_cycle_phase_instability_conquest_desc: "$situation_dynastic_cycle_phase_instability_conquest_desc_short$\n\nAby tato $game_concept_dynastic_cycle_era_short$ mohla nastat, musí [Concept('hegemony','hegemonie')|E] nad Čínou přejít do rukou [Concept('ruler','vládce')|E], který #bold nemá#! [Concept('government','vládu')|E] typu [GetGovernment('celestial_government').GetName|E] nebo jehož [Concept('culture','kultura')|E] má [Concept('heritage','dědictví')|E], které #bold není#! $heritage_chinese_name$."
 situation_dynastic_cycle_phase_instability: "Napětí"
 situation_dynastic_cycle_phase_instability_icon: "@tgp_dynastic_cycle_instability_icon! $situation_dynastic_cycle_phase_instability$"
 situation_dynastic_cycle_phase_instability_desc: "$situation_dynastic_cycle_phase_instability_desc_short$ Pokud se podaří zabránit období [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_chaos').GetName|l], může v Číně začít nová $game_concept_dynastic_cycle_era_short$: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName|l] nebo [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName|l].\n\nTato $game_concept_dynastic_cycle_era_short$ může v Číně nastat po kterékoli z [Concept('dynastic_cycle_era_type_stable','stabilních ér')|E], pokud se aktivuje dostatek [Concept('situation_catalyst_catalysts','katalyzátorů')|E]."
 situation_dynastic_cycle_phase_instability_desc_short: "Tato [Concept('dynastic_cycle_era_short','éra')|E] přináší nepokoje, ale také příležitosti. Korupce, lidové bouře a vpády cizích vojsk představují vážnou hrozbu, avšak moudrá vláda může Čínu přivést k reformám."
 situation_dynastic_cycle_phase_chaos: "Rozdrobení"
 situation_dynastic_cycle_phase_chaos_icon: "@tgp_dynastic_cycle_chaos_icon! $situation_dynastic_cycle_phase_chaos$"
 situation_dynastic_cycle_phase_chaos_desc_short: "[Concept('dynastic_cycle_era_short','Éra')|EU] soupeřících vojevůdců, v níž může Čínu sjednotit jedině silný [Concept('ruler','vládce')|E]."
 situation_dynastic_cycle_phase_chaos_desc: "$situation_dynastic_cycle_phase_chaos_desc_short$\n\nTato $game_concept_dynastic_cycle_era_short$ začíná, pokud nastane některá z následujících situací:\n$EFFECT_LIST_BULLET$V kterékoli z [Concept('dynastic_cycle_era_type_unstable','nestabilních ér')|E] se aktivuje dostatek [Concept('situation_catalyst_catalysts','katalyzátorů')|E]\n$EFFECT_LIST_BULLET$Současný [Concept('son_of_heaven','Syn Nebes')|E] ztratí [Concept('mandate_of_heaven','Mandát Nebes')|E]\n\n#S Na začátku této éry#!\n$BULLET$#indent_newline:2 [Concept('title','Titul')|EU] [Concept('hegemony','hegemonie')|E] nad Čínou je zničen a bývalý [Concept('son_of_heaven','Syn Nebes')|E] je [Concept('deposed','sesazen')|E]#!\n$BULLET$#indent_newline:2 Rovněž jsou zničeny [Concept('titles','tituly')|E] na [Concept('title_tier','úrovni')|E] [Concept('empire','říše')|E] a [Concept('kingdom','království')|E] v [Concept('de_jure','de iure')|E] hierarchii, pokud jejich [Concept('holders','držitelé')|E] mají [movement_power_i][Concept('movement_power_short','sílu')|E] nižší než [EmptyScope.ScriptValue('high_movement_power_value')] u říší, respektive [EmptyScope.ScriptValue('medium_movement_power_value')] u království#!\n$BULLET$#indent_newline:2 Nezávislí [Concept('rulers','vládci')|E] přísahají věrnost nebo začnou odvádět tribut svým [Concept('elders','starším')|E] či [Concept('movement_leaders','vůdcům hnutí')|E]\n$BULLET$Každý nezávislý [Concept('ruler','vládce')|E] se připojí ke [Concept('situation_participant_group','skupině účastníků')|E] #V $dynastic_cycle_participant_group_other_rulers$#!#!\n$BULLET$Všechny ostatní [Concept('situation_participant_group','skupiny účastníků')|E] budou rozpuštěny"
 situation_dynastic_cycle_phase_stability: "Stabilita"
 situation_dynastic_cycle_phase_stability_desc: "#D Tato fáze by se neměla zobrazovat#!"
 dynastic_cycle_sub_region_core: "Čína"
 dynastic_cycle_sub_region_core_desc: "Všechna [Concept('counties','hrabství')|E] začleněná do [Concept('de_jure','de iure')|E] hierarchie titulu [GetTitleByKey('h_china').GetDefinitiveName]"
 dynastic_cycle_sub_region_peripheries: "Okrajové oblasti Číny"
 dynastic_cycle_sub_region_peripheries_desc: "Všechna [Concept('counties','hrabství')|E], která nejsou součástí oblasti [GetSituation('dynastic_cycle').GetSubRegionByKey( 'core' ).GetName], ale stále jim vládne [Concept('son_of_heaven','Syn Nebes')|E]"
 custom_dynastic_cycle: "Podnebesí"
 dynastic_cycle_participant_group_hegemon_ruler: "Syn Nebes"
 dynastic_cycle_participant_group_hegemon_ruler_desc: "[Concept('son_of_heaven','Syn Nebes')|EU], [Concept('holder','držitel')|E] titulu [GetTitleByKey('h_china').GetDefinitiveName]"
 dynastic_cycle_participant_group_other_rulers: "Ostatní vládci"
 dynastic_cycle_participant_group_other_rulers_desc: "Všichni [Concept('rulers','vládci')|E] v oblasti [GetSituation('dynastic_cycle').GetTopSubRegion.GetName], kteří nejsou [Concept('vassals','vazaly')|E] držitele titulu [GetTitleByKey('h_china').GetDefinitiveName]"
 dynastic_cycle_participant_group_advancement_movement: "$game_concept_movement$ rozvoje"
 dynastic_cycle_participant_group_advancement_movement_desc: "Všichni [Concept('vassals','vazalové')|E] držitele titulu [GetTitleByKey('h_china').GetDefinitiveName], kteří chtějí posunout [Concept('dynastic_cycle','dynastický cyklus')|E] směrem k [Concept('situation_dynastic_cycle_phase','éře')|E] [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName].\n\nUsilují o rozkvět jádrových provincií Číny prostřednictvím zvyšování [Concept('development','rozvoje')|E], dokončování [Concept('great_projects','velkých projektů')|E], objevování [Concept('innovations','inovací')|E] a získávání [Concept('merit','zásluh')|E] při [Concept('examinations','zkouškách')|E].\n$unlockables_advancement$"
 dynastic_cycle_participant_group_expansion_movement: "$game_concept_movement$ expanze"
 dynastic_cycle_participant_group_expansion_movement_desc: "Všichni [Concept('vassals','vazalové')|E] držitele titulu [GetTitleByKey('h_china').GetDefinitiveName], kteří chtějí posunout [Concept('dynastic_cycle','dynastický cyklus')|E] směrem k [Concept('situation_dynastic_cycle_phase','éře')|E] [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName].\n\nAby usnadnili dobývání území mimo Čínu, soustředí se na posilování [Concept('governors','guvernérů')|E] typu [GetSubjectContractType( 'celestial_provinces' ).GetObligationNameShort( 'celestial_province_military' )], zvyšování [Concept('prowess','udatnosti')|E], vzdělávání v rámci [Concept('martial_lifestyle','válečnického životního stylu')|E] a získávání [Concept('commander_traits','velitelských rysů')|E].\n$unlockables_expansion$"
 dynastic_cycle_participant_group_pro_hegemon_movement: "Loajalistické $game_concept_movement$ – [SelectLocalization( GetPlayer.IsValid, 'pro_hegemon_movement_in_game_name', 'Dynasty' ) ]"
 pro_hegemon_movement_in_game_name: "[GetTitleByKey('h_china').GetBaseNameNoTierNoTooltip|U]"
 dynastic_cycle_participant_group_pro_hegemon_movement_desc: "Všichni [Concept('vassals','vazalové')|E] držitele titulu [GetTitleByKey('h_china').GetDefinitiveName], kteří věrně následují vůli [Concept('son_of_heaven','Syna Nebes')|E].\n\nUsilují o to, aby se stali vlivnými [Concept('governors','guvernéry')|E] a [Concept('ministers','ministry')|E], kteří horlivě podporují skupinu [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey('hegemon_ruler').GetNameNoTooltip]. Mají $situation_parameter_pro_hegemon_interaction_boost$."
 dynastic_cycle_participant_group_conservative_movement: "$game_concept_movement$ konzervativců"
 dynastic_cycle_participant_group_conservative_movement_desc: "Všichni [Concept('vassals','vazalové')|E] držitele titulu [GetTitleByKey('h_china').GetDefinitiveName], kteří usilují o posílení šlechty.\n\nSoustředí se na reformy a změny prospívající [Concept('powerful_families','mocným rodinám')|E] a proslulým [Concept('dynasties','dynastiím')|E]. Místo získávání [Concept('merit','zásluh')|E] kladou důraz na pěstování tradic.\n$unlockables_conservative$"
 unlockables_advancement: "$BULLET_WITH_TAB$Zpřístupní [Concept('interaction','interakci')|E] #V $boost_efficiency_interaction$#!\n$BULLET_WITH_TAB$$scholarly_inspiration_frequency_desc$\n$BULLET_WITH_TAB$Zvýšená [Concept('aptitude','způsobilost')|E] pro [Concept('court_position','dvorský úřad')|E] [GetCourtPositionType('court_poet_court_position').GetName]\n$BULLET_WITH_TAB$Zpřístupní [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('tgp_japan_become_a_poet_decision').GetName]\n$BULLET_WITH_TAB$Zpřístupní [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('diligent_development_focus_decision').GetName]"
 unlockables_expansion: "$BULLET_WITH_TAB$Zpřístupní [Concept('interaction','interakci')|E] #V $damage_efficiency_interaction$#!\n$BULLET_WITH_TAB$Zpřístupní [Concept('interaction','interakci')|E] #V $fp3_request_turkic_invasion_interaction$#!\n$BULLET_WITH_TAB$Zpřístupní [Concept('interaction','interakci')|E] #V $spar_with_knight_interaction$#!"
 unlockables_conservative: "$BULLET_WITH_TAB$Zpřístupní [Concept('interaction','interakci')|E] #V $damage_efficiency_interaction$#!\n$BULLET_WITH_TAB$Umožní požádat o změnu [Concept('law','zákona')|E] ze skupiny [GetLawGroup('candidate_score_laws').GetName] prostřednictvím [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('movement_petition_decision').GetName]\n$BULLET_WITH_TAB$Umožní vybudovat [Concept('domicile_building_upgrade','vnitřní vylepšení')|E] [GetDomicileBuilding('east_asian_estate_reception_hall_01').GetName]"
 dynastic_cycle_participant_group_undecided_movement: "Nezařazení"
 dynastic_cycle_participant_group_undecided_movement_desc: "Všichni [Concept('vassals','vazalové')|E] držitele titulu [GetTitleByKey('h_china').GetDefinitiveName], kteří dosud nezaujali žádné stanovisko k současnému stavu [Concept('dynastic_cycle','dynastického cyklu')|E].\n\nLze je přesvědčit, aby se připojili k některému z ostatních [Concept('movement','hnutí')|E]."
