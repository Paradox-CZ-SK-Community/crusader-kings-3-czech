l_polish:
 tgp_child_personality.0002.t: "Zhoršené poměry"
 tgp_child_personality.0002.guardian: "S [guardian.Custom('CZ_TitledFirstName_I')], což je můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))|l], se vracíme z výletu. Cestou spatřím zoufalého muže v rouchu tak rozedraném, že připomíná spíš cáry.\n\nOči má zastřené únavou a tvář vyhublou hladem. Zoufale prosí kolemjdoucí o vodu. Když nás zahlédne, zavrávorá ke mně a prosebně vztáhne ruce."
 tgp_child_personality.0002.no_guardian: "Vracíme se z výletu, když spatřím zoufalého muže v rouchu tak rozedraném, že připomíná spíš cáry.\n\nOči má zastřené únavou a tvář vyhublou hladem. Zoufale prosí kolemjdoucí o vodu. Když nás zahlédne, zavrávorá ke mně a prosebně vztáhne ruce."
 tgp_child_personality.0002.a: "Jak se opovažuje pohlédnout na nás!"
 tgp_child_personality.0002.b: "Můžeme tomu chudákovi dát trochu vody?"
 tgp_child_personality.0002.c: "Vodu? Ať si vezme hrst tohohle bláta!"
 tgp_child_personality.0003.t: "Nezasloužená pocta"
 tgp_child_personality.0003.desc: "[guardian.GetFullName|U] před několika dvořany hrdě vychvaluje mé pokroky ve studiu. [ROOT.Char.GetFaith.ReligiousText|U] prý znám stále lépe. Postupně vypočítává kapitoly, které umím nazpaměť — včetně několika, o nichž rozhodně nic nevím!\n\nPod jejich uznalými pohledy mi hoří tváře. V mém svědomí spolu zápasí pocit viny a potěšení."
 tgp_child_personality.0003.a: "Když [Select_CString(guardian.IsFemale,'ji','jej')|l] opravím, už nebudou spokojení."
 tgp_child_personality.0003.b: "Je důležitější říkat pravdu než získávat pochvaly."
 tgp_child_personality.0003.c: "Opravím [Select_CString(guardian.IsFemale,'ji','jej')|l] raději v soukromí, aby [Select_CString(guardian.IsFemale,'neztratila','neztratil')|l] tvář."
 tgp_child_personality.0004.t: "Zameškané vyučování"
 tgp_child_personality.0004.desc: "Čas obvyklého vyučování dávno minul. Uplynula další hodina a [guardian.GetFullName] stále nikde.\n\nVyhlédnu z okna a vidím čilé pobíhání služebnictva. Čekání je proti tomu strašná nuda."
 tgp_child_personality.0004.a: "Možná by se jim místo toho hodila moje pomoc!"
 tgp_child_personality.0004.b: "Mohu se učit, než [Select_CString(guardian.IsFemale,'ona','on')|l] přijde!"
 tgp_child_personality.0004.c: "Nakonec jistě dorazí. Musím mít trpělivost."
 tgp_child_personality.0007.t: "Nerovné porce"
 tgp_child_personality.0007.desc: "[Select_CString(ROOT.Char.IsFemale,'Vplížila','Vplížil')|U] jsem se do příbytků služebnictva, abych [Select_CString(ROOT.Char.IsFemale,'zjistila','zjistil')|l], co dělají. Hned si všimnu, že výše postavení dostávají mnohem větší porce než jejich podřízení.\n\nTa nerovnost bije do očí, ale sloužící svůj úděl zřejmě přijímají bez stížností."
 tgp_child_personality.0007.a: "Tohle je zjevně nespravedlivé!"
 tgp_child_personality.0007.b: "Život je pro prosté lidi málokdy spravedlivý."
 tgp_child_personality.0007.c: "Možná bychom všichni měli jíst střídměji."
 tgp_child_personality.0009.t: "Noční zvuky"
 tgp_child_personality.0009.desc: "V hodině tygra se s náhlým trhnutím probudím; z temnoty těsně u mého okna se ozývá hlasité rachocení a šustění.\n\nNěco tam je a hýbe se!\n\nMoje mysl přeskakuje mezi možnostmi, každá horší a strašidelnější než ta předchozí."
 tgp_child_personality.0009.a: "Když to bude příšera, zabiju ji!"
 tgp_child_personality.0009.b: "Asi to bude jen jeden ze služebnictva."
 tgp_child_personality.0009.c: "Co říká [ROOT.Char.GetFaith.ReligiousText] o strachu?"
 tgp_child_personality.0010.t: "Břemeno očekávání"
 tgp_child_personality.0010.desc: "Ve každé lekci, pokaždé se opakuje totéž – vždycky se řekne „[guardian.GetTitledFirstName] se to v [Select_CString(guardian.IsFemale,'její','jeho')|l] mládí [Select_CString(guardian.IsFemale,'naučila','naučil')|l] za polovinu času!“ nebo „[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|l] bys doufat, že budeš tak [Select_CString(ROOT.Char.IsFemale,'dobrá','dobrý')|l] jako [guardian.GetTitledFirstName], až vyrosteš.“\n\nVšechno, co dělám, bez ohledu na to, jak dobře, je nepřetržitě měřeno podle cizích úspěchů."
 tgp_child_personality.0010.a: "Já [Select_CString(guardian.IsFemale,'ji','jej')|l] #EMP překonám#!!!"
 tgp_child_personality.0010.b: "Jednoho dne to budu já, kdo bude ostatní zahanbovat."
 tgp_child_personality.0010.c: "Vůbec #EMP chtějí#!!, abych [Select_CString(ROOT.Char.IsFemale,'uspěla','uspěl')|l]?"
 tgp_child_personality.7000.t: "Volný program"
 tgp_child_personality.7000.desc: "Čekám, až začne moje lekce kaligrafie, když do místnosti vstoupí [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))|l] s rozhodným krokem a záhadným výrazem.\n\n„Něco se objevilo a dnešní lekce musíme zrušit,“ říká pevně [Select_CString(guardian.IsFemale,'ona','on')|l]. „Co bys místo toho [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')|l] dělat?“\n\nOčekávající výraz na [Select_CString(guardian.IsFemale,'její','jeho')|l] tváři naznačuje, že jde o ten druh otázky, která má špatnou odpověď."
 tgp_child_personality.7000.a: "Využiji této příležitosti k ještě většímu studiu!"
 tgp_child_personality.7000.b: "Mohu jít za kamarády?"
 tgp_child_personality.7000.c: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] bych odpočívat a strávit den v klidu."
 tgp_child_personality.7300.t: "Zlomené křídlo"
 tgp_child_personality.7300.desc: "Při procházení nádvořím zaslechnu pod keřem zašustění. Odlomenou větvičkou odhrnu listí a spatřím malého ptáčka, který pobíhá sem a tam. Jedno křídlo mu trčí ve zjevně nepřirozeném úhlu."
 tgp_child_personality.7300.a: "Když si ho nechám, naučím se mluvit s ptáky!"
 tgp_child_personality.7300.b: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] bych nechat služebnictvo, aby se o něj postaralo."
 tgp_child_personality.7300.c: "Koho zajímají hloupí ptáci?"
 tgp_child_personality.7010.t: "Zkreslená slova"
 tgp_child_personality.7010.desc: "Chystám se vejít do síně k pravidelnému obřadu, když uvnitř zaslechnu hlasy.\n\nZarazím se s rukou u dveří. Někdo cituje pasáž z posvátného textu — [ROOT.Char.GetFaith.ReligiousText]. Právě za porozumění jejím jemnostem mě tolik chválili. Teď ji ovšem někdo vykládá tak naprosto chybně, že nevěřím vlastním uším."
 tgp_child_personality.7010.a: "Jak mohli [ROOT.Char.GetFaith.ReligiousText] tak #EMP špatně#! pochopit!!?"
 tgp_child_personality.7010.b: "Když jsou dospělí takoví hlupáci, dostanu se v životě daleko."
 tgp_child_personality.7010.c: "Nemůžu se dočkat, až ta nevědomost vyjde najevo!"
 tgp_child_personality.7020.t: "Neznámé úmysly"
 tgp_child_personality.7020.desc: "Když procházím vchodem do našeho domu, zaslechnu neznámé hlasy a rychlý pohled za roh odhalí venku tváře, které neznám.\n\nJeden z nich se otočí a naše oči se setkají; začne kráčet ke mně a s bušícím pulzem se rychle schovám zpět."
 tgp_child_personality.7020.a: "Cizí lidé se mi nelíbí: jdu pryč!"
 tgp_child_personality.7020.b: "Ten pohled v jejich očích — nedá se jim věřit."
 tgp_child_personality.7020.c: "Co když mají zbraně? Mohli by nám ublížit!"
 tgp_child_personality.7050.t: "Ztracené a nalezené"
 tgp_child_personality.7050.desc: "Hledám jednu ze svých knih, když mě pod stolem zaujme lesk něčeho kovového a zajímavého.\n\nVypadá to jako malá lakovaná dřevěná krabička a myslím, že jsem jednu [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')|l] právě v pánově pracovně. Někdo by jistě zuřil, kdyby se dozvěděl, že ji služebný ztratil!"
 tgp_child_personality.7050.a: "Vrátím to, aby se nedostali do potíží!"
 tgp_child_personality.7050.b: "Když to schovám, může to být mým tajným pokladem!"
 tgp_child_personality.7050.c: "Za to budou trpět a zaslouží si to."
 tgp_child_personality.7200.t: "Neústupné odhodlání"
 tgp_child_personality.7200.desc: "Někdo ze služebnictva zapomněl zavřít dveře a já jsem venku! Sotva si ale stačím vychutnat nově nabytou svobodu, zarazí mě hluboké zavrčení.\n\nPomalu otočím hlavu doprava. Hledí na mě pes skoro stejně velký jako já. Takového jsem u nás doma ještě [Select_CString(ROOT.Char.IsFemale,'neviděla','neviděl')|l].\n\nZa mnou se ozve křik: „Utíkej, dítě! Rychle zpátky dovnitř!“"
 tgp_child_personality.7200.a: "Neuteču — nejsem [Select_CString(ROOT.Char.IsFemale,'zbabělkyně','zbabělec')|l]!"
 tgp_child_personality.7200.b: "Když se neuhne, ani já se neuhnu!"
 tgp_child_personality.7200.c: "Jenom nějaký toulavý kříženec se opováží vycenit zuby na #EMP mě#!!?"
 tgp_child_personality.7070.t: "Přísná slova"
 tgp_child_personality.7070.desc: "„Neschopný hlupáku!“\n\n[guardian.GetName|U] křičí tak, že to slyší celé sídlo.\n\n„K ničemu nejsi!“ Opatrně nakouknu do dveří. Jeden ze sloužících leží přede mnou na zemi a celý se třese pod přívalem hněvu.\n\nNevím, co se stalo, ale zaslouží si to opravdu takové hubování?"
 tgp_child_personality.7070.a: "Na jeho místě bych se nesmířil s takovou potupou, dokud by nebyla splacena!"
 tgp_child_personality.7070.b: "Kdyby [Select_CString(servant.IsFemale,'lhala','lhal')|l], [Select_CString(servant.IsFemale,'nebyla','nebyl')|l] by v potížích."
 tgp_child_personality.7070.c: "Když se dospělí rozzlobí, vypadají ošklivě."
 tgp_child_personality.7040.t: "Nečekané zjištění"
 tgp_child_personality.7040.desc: "Prohledávaje police na knihu, kterou jsem [Select_CString(ROOT.Char.IsFemale,'měla','měl')|l] najít a donést, lehké potřesení způsobí, že jedna spadne na zem a stránky se rozfouknou.\n\nKlekám si, abych ji [Select_CString(ROOT.Char.IsFemale,'zvedla','zvedl')|l], a nemohu se ubránit zastavení nad živými kresbami postav – mužů a žen? – objímajících se a proplétajících v stále různějších polohách.\n\nVypadá to tak nepříjemně, ale také...zajímavě?"
 tgp_child_personality.7040.a: "Už je otevřená, tak ji můžu prohlédnout."
 tgp_child_personality.7040.b: "Mám pocit, že bych tohle [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')|l] vidět."
 tgp_child_personality.7080.t: "Lahodný přepych"
 tgp_child_personality.7080.desc: "Poslední dobou mi lidé nabízejí dobroty, kamkoli přijdu. Rukávy mám téměř plné lahodných soust. Z té hojnosti mám skoro výčitky svědomí.\n\nPrávě si cpu do úst další kousek, když si všimnu dítěte ze služebnictva. [greedy_child.Custom('GirlBoy')|U] na mé pochoutky hledí s neskrývanou závistí."
 tgp_child_personality.7080.a: "Pojď sem a dej si z toho!"
 tgp_child_personality.7080.b: "Možná ve skutečnosti necítím vinu."
 tgp_child_personality.7080.c: "Tohle je moje, zasloužím si to. [Select_CString(greedy_child.IsFemale,'ona','on')|U] si může najít to své."
 tgp_child_personality.7030.t: "Přetížený"
 tgp_child_personality.7030.desc: "Hlasité, přidušené funění mě přiláká do chodby. Někdo ze sloužících se tu neobratně potácí s vratkou hromadou talířů s jídlem. Paže se pod tou tíhou viditelně třesou.\n\nNejspíš je jen otázkou času — a velmi krátkého — než to celé skončí na podlaze."
 tgp_child_personality.7030.a: "Jen pohled na [Select_CString(clumsy_servant.IsFemale,'ni','něj')|l] mě unavuje."
 tgp_child_personality.7030.b: "Pomůžu — výměnou za ochutnávku!"
 tgp_child_personality.7030.c: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] bych pomoci [Select_CString(clumsy_servant.IsFemale,'jí','mu')|l], než něco upustí."
 tgp_child_personality.7090.t: "Upřímná chyba"
 tgp_child_personality.7090.desc: "Hledám svůj oblíbený ilustrovaný svitek, když do pokoje vstoupí někdo ze sloužících se svitkem v ruce.\n\n„Tady je!“ vykřiknu a natáhnu se po něm. Služebná osoba však přede mnou náhle padne na kolena a skloní se až k zemi.\n\n„Byla to nehoda, [Select_CString(ROOT.Char.IsFemale,'mladá paní','mladý pane')|l], přísahám!“\n\nPři bližším pohledu vidím, že svitek je těžce poškozený, téměř roztržený vedví!"
 tgp_child_personality.7090.a: "Byla to nehoda. Nezlobím se."
 tgp_child_personality.7090.b: "Vím, že jsi to [Select_CString(sorry_servant.IsFemale,'nemyslela','nemyslel')|l] zle. Věřím ti."
 tgp_child_personality.7090.c: "Můžeme poslat pro novou kopii: může to počkat."
 tgp_child_personality.7060.t: "Přehnaná chvála"
 tgp_child_personality.7060.desc: "Jeden ze služebných se zdá být v poslední době rozhodnutý chválit cokoliv, co dělám, komukoliv, kdo bude poslouchat, bez ohledu na to, jak malý čin to je.\n\nJe příjemné být chválen, ale začínám se ptát, jestli některé z těchto věcí opravdu stojí za povyk, který dělá..."
 tgp_child_personality.7060.a: "Ještě se mám hodně co učit."
 tgp_child_personality.7060.b: "Dělá to jen proto, aby se mi [Select_CString(sycophantic_servant.IsFemale,'zalíbila','zalíbil')|l]?"
 tgp_child_personality.7060.c: "Mám mít radost, že mě chválí."
 tgp_child_personality.7100.t: "Stálé dotazování"
 tgp_child_personality.7100.desc: "Mám pocit, že každý den je zkouška, které se nemohu vyhnout - [guardian.GetName] mě neustále testuje otázkami, od podivných po běžné.\n\n[Select_CString(ROOT.Char.IsFemale,'Přála','Přál')|U] bych si, aby mě na chvíli [Select_CString(guardian.IsFemale,'nechala','nechal')|l] být, ale [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')|l] bych být [Select_CString(ROOT.Char.IsFemale,'potrestána','potrestán')|l], pokud si postěžuju..."
 tgp_child_personality.7100.a: "Už mám dost těchto otázek. Můžeme prosím přestat?"
 tgp_child_personality.7100.b: "Když budu odpovídat náhodně, třeba mě [Select_CString(guardian.IsFemale,'ona','on')|l] nechá být."
 tgp_child_personality.7100.c: "Tohle je taková ztráta času; [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')|l] bych dělat tolik jiného."
 tgp_child_personality.1021.t: "Zhoršené poměry"
 tgp_child_personality.102.desc: "Vracíme se domů po výletu s [child.GetTitledFirstName], když narazíme na zchudlého muže, který žebrá o vodu od kohokoliv, kdo mu pomůže."
 tgp_child_personality.102.arrogant: "\n\n„Jak se opovažuje pohlédnout na nás!“ vybuchne pobouřeně [child.GetFirstNameNoTooltip], zděšen drzostí muže."
 tgp_child_personality.102.compassionate: "\n\nPohnutý utrpením muže, [child.GetFirstNameNoTooltip] mi škubne za rukáv a podívá se na mě očima, které jsou kulaté nevinnou soucitem. „Můžeme tomu chudákovi dát trochu vody?“ zeptá se."
 tgp_child_personality.102.callous: "\n\nV reakci na jeho prosbu [child.GetFirstNameNoTooltip] ledabyle nabere hrst bláta a hodí mu ho do obličeje, směje se, když se muž zachvěje a couvá v překvapení a ponížení."
 tgp_child_personality.102.confirm_arrogant: "Dobře. Jeho druh nestojí za tvou pozornost."
 tgp_child_personality.102.confirm_compassionate: "Samozřejmě, můžeme; jsem [Select_CString(ROOT.Char.IsFemale,'pyšná','pyšný')|l] na tvou empatii."
 tgp_child_personality.102.confirm_callous: "Utrpení druhých nás nezajímá."
 tgp_child_personality.102.arrogant_change: "Ignoruj jejich druh, nejsou hodni tvé pozornosti."
 tgp_child_personality.102.compassionate_change: "Představ si, jaké by to bylo, kdybys [Select_CString(ROOT.Char.IsFemale,'byla','byl')|l] na jeho místě."
 tgp_child_personality.102.callous_change: "Utrpení druhých nás nezajímá."
 tgp_child_personality.1031.t: "Nezasloužená pocta"
 tgp_child_personality.103.desc: "Když přišla řeč na pokroky [child.Custom('CZ_FirstName_G')] ve studiu posvátného textu [child.GetFaith.ReligiousText], hrdě jsem [Select_CString(ROOT.Char.IsFemale,'vychválila','vychválil')|l] zvládnutí několika stále obtížnějších kapitol.\n\nTeprve nyní, při kontrole poslední práce, si uvědomuji, že jsem to s hodnocením možná [Select_CString(ROOT.Char.IsFemale,'přehnala','přehnal')|l]."
 tgp_child_personality.103.deceitful: "\n\nA přesto, navzdory tomu, že musí dobře vědět, že jsem [Select_CString(ROOT.Char.IsFemale,'lhala','lhal')|l], [child.GetFirstNameNoTooltip] se dál vyhřívá v pochvale za nezasloužené úspěchy."
 tgp_child_personality.103.honest: "\n\nNež stačím promluvit, [child.GetFirstNameNoTooltip] se mi podívá přímo do očí. „[Select_CString(ROOT.Char.IsFemale,'Řekla','Řekl')|U] jsi ostatním, že jsem ty kapitoly [Select_CString(child.IsFemale,'zvládla','zvládl')|l]. Ale teprve je začínám studovat.“"
 tgp_child_personality.103.humble: "\n\n[child.GetFirstNameNoTooltip|U] si všimne mého výrazu a tiše pronese: „Já vím. Promiň. [Select_CString(child.IsFemale,'Nechtěla','Nechtěl')|U] jsem, abys [Select_CString(ROOT.Char.IsFemale,'vypadala','vypadal')|l] špatně.“"
 tgp_child_personality.103.confirm_deceitful: "Nikdy nebrzděj něco, co ti prospívá."
 tgp_child_personality.103.confirm_honest: "Upřímnost je obdivuhodná, obzvlášť když jde proti vlastnímu zájmu."
 tgp_child_personality.103.confirm_humble: "Těší mě, že tvou první myšlenkou byla má pověst."
 tgp_child_personality.103.deceitful_change: "$tgp_child_personality.103.confirm_deceitful$"
 tgp_child_personality.103.honest_change: "Nesmíš dovolovat, aby lež prošla bez nápravy."
 tgp_child_personality.103.humble_change: "Nesnaž se toužit po víc, než jsi si [Select_CString(ROOT.Char.IsFemale,'vydobyla','vydobyl')|l]."
 tgp_child_personality.1041.t: "Zameškané vyučování"
 tgp_child_personality.104.desc: "Záležitostí, o které se musí starat hlava domácnosti, je nekonečně mnoho, a dnes mé povinnosti znamenaly, že jsem [Select_CString(ROOT.Char.IsFemale,'nemohla','nemohl')|l] dohlédnout na denní lekce [child.GetFirstNamePossessive]."
 tgp_child_personality.104.generous: "\n\nZjišťuji, že během mé nepřítomnosti [child.GetFirstNameNoTooltip] nezahálí a čile nabízí služebnictvu pomoc s každodenními povinnostmi. Ti ji ovšem podle očekávání uctivě odmítají."
 tgp_child_personality.104.diligent: "\n\nVracím se pozdě večer a u stolu nacházím [child.Custom('CZ_FirstNameNoTooltip_A')] v pilné práci. Jakmile zazní mé kroky, dítě vzhlédne a hrdě mi předvede své úsilí. „Už jsi tady! Podívej, kolik jsem toho [Select_CString(child.IsFemale,'udělala','udělal')|l]!“"
 tgp_child_personality.104.patient: "\n\nVracím se mnohem později, než jsem [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')|l]. [child.GetFirstNameNoTooltip|U] přesto klidně sedí, při mém příchodu vstane a srdečně mě přivítá. „Celý den jsem tiše [Select_CString(child.IsFemale,'čekala','čekal')|l]! [Select_CString(child.IsFemale,'Vedla','Vedl')|U] jsem si dobře?“"
 tgp_child_personality.104.confirm_generous: "Tvá ohleduplnost k druhým je obdivuhodná."
 tgp_child_personality.104.confirm_diligent: "Iniciativa, kterou jsi [Select_CString(ROOT.Char.IsFemale,'projevila','projevil')|l], ti prospěje."
 tgp_child_personality.104.confirm_patient: "Těší mě trpělivost, kterou jsi [Select_CString(ROOT.Char.IsFemale,'projevila','projevil')|l]."
 tgp_child_personality.104.generous_change: "Jsou i jiní, kteří by mohli potřebovat tvé volné ruce."
 tgp_child_personality.104.diligent_change: "Když máš čas navíc, věnuj ho studiu."
 tgp_child_personality.104.patient_change: "I činnost je chvályhodná, ale ještě lepší je trpělivě počkat."
 tgp_child_personality.1071.t: "Nerovné porce"
 tgp_child_personality.107.desc: "Po několika zmatených otázkách [child.Custom('CZ_FirstName_G')] jsem se [Select_CString(ROOT.Char.IsFemale,'dostala','dostal')|l] k jádru věci. Dítě si všimlo, že někteří z našich sloužících jedí mnohem lépe než ostatní."
 tgp_child_personality.107.just: "\n\n[child.GetFirstNameNoTooltip|U] se zdá být touto záležitostí hluboce [Select_CString(child.IsFemale,'znepokojena','znepokojen')|l] a vyžaduje vysvětlení příčiny zjevné nerovnosti."
 tgp_child_personality.107.cynical: "\n\nNavzdory [child.GetFirstNamePossessiveNoTooltip|U] otázkám se zdá, že není tímto stavem příliš [Select_CString(child.IsFemale,'znepokojena','znepokojen')|l], téměř jako by se spíše [Select_CString(child.IsFemale,'snažila','snažil')|l] potvrdit nějaký závěr, k němuž [Select_CString(child.IsFemale,'došla','došel')|l] [Select_CString(child.IsFemale,'sama','sám')|l]."
 tgp_child_personality.107.temperate: "\n\nPo zvážení [child.GetFirstNameNoTooltip|U] [Select_CString(child.IsFemale,'dospěla','dospěl')|l] k závěru, že by bylo nejlepší, kdybychom všichni umírnili své chutě."
 tgp_child_personality.107.confirm_just: "Máš pravdu, měli bychom tuto situaci napravit."
 tgp_child_personality.107.confirm_cynical: "Svět je nerovný a [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')|l] bys očekávat nic jiného."
 tgp_child_personality.107.confirm_temperate: "V umírněnosti je moudrost, to jistě."
 tgp_child_personality.107.just_change: "Nesmíš přijímat nerovnost jen proto, že ji ostatní snášejí."
 tgp_child_personality.107.cynical_change: "$tgp_child_personality.107.confirm_cynical$"
 tgp_child_personality.107.temperate_change: "$tgp_child_personality.107.confirm_temperate$"
 tgp_child_personality.1091.t: "Noční zvuky"
 tgp_child_personality.109.desc: "Časně ráno mě vzbudí někdo ze služebnictva s podivným vyprávěním.\n\nJeden z jeho druhů toho v noci zřejmě příliš vypil. Při hledání vlastního pokoje tropil povyk přede dveřmi [child.Custom('CZ_FirstName_G')]."
 tgp_child_personality.109.brave: "\n\nPříběh nabere komický obrat. [child.GetFirstName|U] se probudí, popadne dřevěný mečík a zaútočí na potácejícího se opilého sluhu. Svou „příšeru“ pak zažene zpátky do tmy."
 tgp_child_personality.109.calm: "\n\nRušení v hodině tygra sice probudilo [child.Custom('CZ_FirstName_A')], ale nijak se to na dítěti nepodepsalo. Neobvyklé zvuky za oknem je nechaly klidným."
 tgp_child_personality.109.zealous: "\n\nKdyž se později přijdu podívat, [child.GetFirstName] si pro uklidnění odříkává verše. Jejich zdrojem je [child.GetFaith.ReligiousText]."
 tgp_child_personality.109.confirm_brave: "Právě v našich nejtemnějších hodinách se ukazuje naše pravá povaha."
 tgp_child_personality.109.confirm_calm: "Klidná mysl není rozházena nočními zvuky."
 tgp_child_personality.109.confirm_zealous: "Text, jako je [child.GetFaith.ReligiousText], nám má být oporou i za dne."
 tgp_child_personality.109.brave_change: "Kdyby hrozba byla skutečná, zachránilo by tě jen rozhodné jednání."
 tgp_child_personality.109.calm_change: "$tgp_child_personality.109.confirm_calm$"
 tgp_child_personality.109.zealous_change: "$tgp_child_personality.109.confirm_zealous$"
 tgp_child_personality.1101.t: "Břemeno očekávání"
 tgp_child_personality.110.desc: "Děti se nejlépe učí napodobováním dospělých. Učitelé i sloužící si tuto zásadu vzali za svou a staví mě dítěti za vzor. Doufají, že tak podnítí další rozvoj [child.Custom('CZ_FirstName_G')]."
 tgp_child_personality.110.ambitious: "\n\nVýsledky mluví samy za sebe. [child.GetFirstName|U] zdvojnásobuje své úsilí a slibuje, že mé úspěchy překoná. To odhodlání je na studijních výsledcích jasně znát."
 tgp_child_personality.110.sadistic: "\n\nMísto inspirace však vidím, jak si [child.GetFirstName] vybíjí zklamání na služebnictvu. Nejspíš jsme dítěti jen připomněli jeho vlastní nedostatky."
 tgp_child_personality.110.paranoid: "\n\nMožná to [child.Custom('CZ_FirstNameNoTooltip_A')] nasměrovalo špatnou cestou. V té mladé tváři teď až příliš často vídám stín pochybností."
 tgp_child_personality.110.confirm_ambitious: "Nedopusť, aby ti cokoli stálo v cestě za cíli."
 tgp_child_personality.110.confirm_sadistic: "Někdy kruté způsoby lépe slouží než ctnost."
 tgp_child_personality.110.confirm_paranoid: "Zpochybňuj vše, především ty, které považuješ za důvěryhodné."
 tgp_child_personality.110.ambitious_change: "Nedopusť, aby ti cokoli stálo v cestě za cíli."
 tgp_child_personality.110.sadistic_change: "$tgp_child_personality.110.confirm_sadistic$"
 tgp_child_personality.110.paranoid_change: "$tgp_child_personality.110.confirm_paranoid$"
 tgp_child_personality.7001.t: "Volný program"
 tgp_child_personality.7001.desc: "Vývoj dítěte může být klamně složitý a těžko měřitelný, a jen pečlivým zkoumáním lze jeho mysl nasměrovat správným směrem.\n\nOznamuji, že dnešní lekce jsou náhle zrušeny, a zkouším [child.GetFirstName], jak by se [Select_CString(child.IsFemale,'rozhodla','rozhodl')|l] strávit den bez vedení."
 tgp_child_personality.diligent.desc: "\n\nNavzdory mé nabídce si však [child.GetFirstName] [Select_CString(child.IsFemale,'vybrala','vybral')|l] pokračovat ve studiu [Select_CString(child.IsFemale,'sama','sám')|l], což ukazuje působivou oddanost pokračování ve vzdělávání."
 tgp_child_personality.gregarious.desc: "\n\nNení překvapivé, že [child.GetFirstName] si [Select_CString(child.IsFemale,'přála','přál')|l] strávit den se svými společníky, místo studia dát přednost společnosti ostatních."
 tgp_child_personality.temperate.desc: "\n\nNečekaně [child.GetFirstName] [Select_CString(child.IsFemale,'využila','využil')|l] příležitost k odpočinku a šetření sil pro zítřejší úsilí."
 tgp_child_personality.7001.diligent: "Výborná volba; taková sebekázeň ti bude ku prospěchu."
 tgp_child_personality.7001.gregarious: "Vztahy, které si nyní vytvoříš, ti poslouží celý život."
 tgp_child_personality.7001.temperate: "Když znáš své hranice, panuješ sám nad sebou."
 tgp_child_personality.7001.change.diligent: "Sebekázeň ti poslouží lépe. Procvičuj ji."
 tgp_child_personality.7001.change.gregarious: "Nezanedbávej své vazby s ostatními kvůli studiu."
 tgp_child_personality.7001.change.temperate: "Odpočiň, dokud můžeš; nevíš, co přinese zítřek."
 tgp_child_personality.7011.t: "Zkreslená slova"
 tgp_child_personality.7011.desc: "Během pohoštění návštěvníků jsme narazili na téma [child.GetFaith.ReligiousText] a rozproudila se vášnivá debata, spíše zbarvená vášní pro předmět než znalostí."
 tgp_child_personality.zealous.desc: "\n\nJakmile se skupinka rozejde, přiběhne ke mně zjevně [Select_CString(child.IsFemale,'rozrušená','rozrušený')|l] [child.GetFirstNameNoTooltip]. Část debaty se donesla i k dítěti. „Jak jen mohli tak #EMP špatně#!! vyložit to, co říká [ROOT.Char.GetFaith.ReligiousText]?!“ zazní nevěřícná otázka."
 tgp_child_personality.ambitious.desc: "\n\n[child.GetFirstNameNoTooltip|U] část debaty [Select_CString(child.IsFemale,'zaslechla','zaslechl')|l] a zřejmě to dítě povzbudilo. Své znalosti a porozumění považuje za lepší než u dospělých."
 tgp_child_personality.sadistic.desc: "\n\nPo rozchodu hostů se [child.GetFirstNameNoTooltip] rozběhne ke mně s radostným očekáváním vytesaným na [Select_CString(child.IsFemale,'její','jeho')|l] tváři. „[Select_CString(ROOT.Char.IsFemale,'Řekla','Řekl')|U] jsi všem, jak moc se mýlili?“ [Select_CString(child.IsFemale,'ona','on')|U] se táže dychtivě. „Smáli se všichni tomu, jak hloupě zněli?“"
 tgp_child_personality.7011.zealous: "Tvoje oddanost obřadům je chvályhodná."
 tgp_child_personality.7011.ambitious: "Využij selhání druhých jako příležitosti pro sebe."
 tgp_child_personality.7011.sadistic: "Odhalením něčí nevědomosti oslabuješ jejich postavení."
 tgp_child_personality.7011.change.zealous: "Nejdůležitější je tvé vlastní porozumění obřadům."
 tgp_child_personality.7011.change.ambitious: "$tgp_child_personality.7011.ambitious$"
 tgp_child_personality.7011.change.sadistic: "$tgp_child_personality.7011.sadistic$"
 tgp_child_personality.7021.t: "Neznámé úmysly"
 tgp_child_personality.7021.desc: "[child.GetFirstName|U] dnes u vstupu do našeho domu [Select_CString(child.IsFemale,'narazila','narazil')|l] na neznámé návštěvníky. Polekaně [Select_CString(child.IsFemale,'utekla','utekl')|l] a z úkrytu se [Select_CString(child.IsFemale,'odvážila','odvážil')|l] vyjít teprve teď."
 tgp_child_personality.shy.desc: "\n\n[child.GetFirstNameNoTooltip|U] ke mně přichází se sklopenou hlavou a nervózně se vrtí. Setkání dítě zjevně otřáslo. „Oni se nevrátí, že ne? Prosím, nedovol jim se vrátit. Už je nikdy nechci vidět.“"
 tgp_child_personality.paranoid.desc: "\n\n[child.GetFirstNameNoTooltip|U] ke mně přichází s podezřívavými obavami. „Kdo to byl? Já jim nevěřím.“"
 tgp_child_personality.craven.desc: "\n\n[child.GetFirstNameNoTooltip|U] mi úzkostlivě sevře ruku. Návštěva dítě stále děsí. „Proč sem přišli? Vypadali nebezpečně! Prosím, nedovol jim se vrátit.“"
 tgp_child_personality.7021.shy: "Nemusíš se s nikým setkávat, pokud nechceš."
 tgp_child_personality.7021.paranoid: "Důvěra je nejcennější, když ji poskytneš jen několika vyvoleným."
 tgp_child_personality.7021.craven: "Důvěřuj svým instinktům; cítit nebezpečí znamená být předem varován."
 tgp_child_personality.7021.change.shy: "Obklopuj se jen těmi, jimž jsi nejblíže."
 tgp_child_personality.7021.change.paranoid: "$tgp_child_personality.7021.paranoid$"
 tgp_child_personality.7021.change.craven: "$tgp_child_personality.7021.craven$"
 tgp_child_personality.7031.t: "Přetížený"
 tgp_child_personality.7031.desc: "Když mířím do svých komnat, zahlédnu sluhu kráčejícího pod tíhou těžkého břemene, mířícího do kuchyně. Nedaleko vidím [child.GetFirstName] a na okamžik se zastavím, abych [Select_CString(child.IsFemale,'pozorovala','pozoroval')|l], jak [Select_CString(child.IsFemale,'ona','on')|l] zareaguje."
 tgp_child_personality.lazy.desc: "\n\n[child.GetFirstNameNoTooltip|U] jen netečně přihlíží sluhovu trápení. Když se naše pohledy setkají, pohrdavě pokrčí rameny. Jako by taková práce byla pod dětskou důstojnost."
 tgp_child_personality.gluttonous.desc: "\n\n[child.GetFirstNameNoTooltip|U] bez váhání přiskočí a pomůže sluhovi s nákladem. Společně zmizí v kuchyni. O několik minut později se dítě znovu objeví, spokojeně se usmívá a má prsty ulepené od sladkých i slaných odměn."
 tgp_child_personality.compassionate.desc: "\n\nJakmile si všimne sluhova trápení, [child.GetFirstNameNoTooltip] přiskočí, převezme část nákladu a svědomitě jej doprovodí do kuchyně. Při návratu z dítěte vyzařuje tichá hrdost ze splněného úkolu."
 tgp_child_personality.7031.lazy: "Šetři síly na to, co je opravdu důležité; nech jiným, aby nesli břemena."
 tgp_child_personality.7031.gluttonous: "Je správné, že jsi za svou pomoc [Select_CString(ROOT.Char.IsFemale,'odměněna','odměněn')|l]."
 tgp_child_personality.7031.compassionate: "Přihlížet tomu, jak jiní zápasí, by nebylo ctnostné."
 tgp_child_personality.7031.change.lazy: "$tgp_child_personality.7031.lazy$"
 tgp_child_personality.7031.change.gluttonous: "Prací jsou pověřeni služebníci; ty máš užívat jejich plody."
 tgp_child_personality.7031.change.compassionate: "Pomáhej těm, kteří to potřebují, bez očekávání odměny."
 tgp_child_personality.7041.t: "Neočekávaný objev"
 tgp_child_personality.7041.desc: "Při procházení domácí knihovny si všimnu jedné ze svazků vyčnívajících z police, jako by byla narychlo zasunuta. Kniha plná poněkud vyhrocených ilustrací, která se mi dostala do rukou, pokud si správně vzpomínám."
 tgp_child_personality.lustful.desc: "\n\nNajednou mi něco zapadne do paměti. [child.GetFirstName|U] se v poslední době [Select_CString(child.IsFemale,'chovala','choval')|l] podivně, tráví v knihovně nepřiměřené množství času. Zajímalo by mě..."
 tgp_child_personality.chaste.desc: "\n\nNajednou mi něco zapadne do paměti. [child.GetFirstName|U] v poslední době tráví v knihovně málo času, téměř jakoby se [Select_CString(child.IsFemale,'styděla','styděl')|l] do místnosti vůbec vstoupit. Zajímalo by mě..."
 tgp_child_personality.7041.lustful: "Zvědavost v takových věcech je naprosto přirozená."
 tgp_child_personality.7041.chaste: "Ctnostní zachovávají zdrženlivost tváří v tvář pokušení."
 tgp_child_personality.7041.change.lustful: "Dám knihu přesunout do [Select_CString(child.IsFemale,'její','jeho')|l] pokoje."
 tgp_child_personality.7041.change.chaste: "$tgp_child_personality.7041.chaste$"
 tgp_child_personality.7051.t: "Ztraceno a nalezeno"
 tgp_child_personality.7051.desc: "Před několika dny jsem jednoho ze sluhů [Select_CString(ROOT.Char.IsFemale,'požádala','požádal')|l], aby při úklidu přemístil jemně lakovanou kazetu mezi dalšími cennostmi do jiné místnosti, ale výrazné zpoždění jejího vrácení naznačilo, že se při tom ztratila."
 tgp_child_personality.just.desc: "\n\nPrávě když se chystám zahájit pátrání, ztracená kazeta se objeví. [child.GetFirstName|U] ji právě vrací na místo."
 tgp_child_personality.greedy.desc: "\n\nDůkladné prohledání domu rychle odhalí zbloudilou kazetu v [child.GetFirstNamePossessiveNoTooltip] pokoji. „[Select_CString(child.IsFemale,'Našla','Našel')|U] jsem ji, takže teď je moje!“ [Select_CString(child.IsFemale,'ona','on')|U] tvrdohlavě zavrčí, když je [Select_CString(child.IsFemale,'konfrontována','konfrontován')|l]."
 tgp_child_personality.callous.desc: "\n\nKdyž [child.GetFirstName] a já prohledáváme dům, vysvětluji, co hledáme. „[Select_CString(ROOT.Char.IsFemale,'Viděla','Viděl')|U] jsem to,“ dítě odpoví s ledabylým nezájmem. „Ale co se stane se sluhou, který to ztratil?“ [Select_CString(child.IsFemale,'ona','on')|U] se ptá s patrně větším zájmem."
 tgp_child_personality.7051.just: "Jednej vždy tak, jako právě nyní."
 tgp_child_personality.7051.greedy: "Ztráta druhého se může stát tvým ziskem."
 tgp_child_personality.7051.callous: "Nech hlupáky snášet následky jejich neschopnosti."
 tgp_child_personality.7051.change.just: "Jednej spravedlivě a nikdy nebudeš znát lítost."
 tgp_child_personality.7051.change.greedy: "Hleď nejprve na svůj prospěch; vezmi, co můžeš."
 tgp_child_personality.7051.change.callous: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] bys nechat hlupáky nést následky jejich neschopnosti."
 tgp_child_personality.7061.t: "Velkorysé chvály"
 tgp_child_personality.7061.desc: "Služebnictvo ví, jak si získat přízeň svých pánů, současných i budoucích, a jejich chvála směrem k [child.GetFirstName] byla v poslední době přímo přehnaná, možná až nadměrná."
 tgp_child_personality.humble.desc: "\n\n[child.GetFirstNameNoTooltip|U] přesto zůstává [Select_CString(child.IsFemale,'pokorná','pokorný')|l] a při každé příležitosti připomíná, že se má ještě mnoho co učit."
 tgp_child_personality.cynical.desc: "\n\n[child.GetFirstNameNoTooltip|U] mi v soukromí svěří své pochybnosti. Nesnaží se služebnictvo tou chválou jen zalíbit?"
 tgp_child_personality.content.desc: "\n\nZdá se, že chvála nechává [child.Custom('CZ_FirstNamePossessiveNoTooltip_F')] záda docela chladná. Pochvaly nezanechávají žádný trvalý dojem."
 tgp_child_personality.7061.humble: "Je dobře, že umíš zchladit svou pýchu."
 tgp_child_personality.7061.cynical: "Je moudré zpochybňovat motivy druhých."
 tgp_child_personality.7061.content: "Pocty a vyznamenání jsou prázdné; neusiluj o ně."
 tgp_child_personality.7061.change.humble: "Utlum svou pýchu a pamatuj na své místo."
 tgp_child_personality.7061.change.cynical: "Bylo by moudřejší zpochybňovat motivy druhých, i ty moje."
 tgp_child_personality.7061.change.content: "$tgp_child_personality.7061.content$"
 tgp_child_personality.7071.t: "Tvrdá slova"
 tgp_child_personality.7071.desc: "Služebníky je třeba často připomenout jejich místo; čím větší je jejich drzost nebo neschopnost, tím silnější je to napomenutí. Děti se tuto lekci teprve učí a [child.GetFirstName] vypadá rozrušeně poté, co jedno z těchto napomenutí [Select_CString(child.IsFemale,'zaslechla','zaslechl')|l]."
 tgp_child_personality.vengeful.desc: "\n\n[child.GetFirstNameNoTooltip|U] především nechápe, jak může sluha mé výčitky jen tak snášet. Chce vědět, proč nečekám, že si v budoucnu najde cestu k pomstě."
 tgp_child_personality.deceitful.desc: "\n\n[child.GetFirstNameNoTooltip|U] se zřejmě nejvíce zabývá tím, proč sluha vinu přiznal. Kdyby služebnictvo lhalo, menší část jeho selhání by došla trestu."
 tgp_child_personality.calm.desc: "\n\nTo však má málo společného se sluhovým neštěstím, protože [child.GetFirstNameNoTooltip] pouze [Select_CString(child.IsFemale,'vyjádřila','vyjádřil')|l] odpor k hádkám a jedovatým slovům dospělých."
 tgp_child_personality.7071.vengeful: "Pouze slabí si nechají takto ublížit."
 tgp_child_personality.7071.deceitful: "Být upřímný je ctnostné, ale někdy i pošetilé."
 tgp_child_personality.7071.calm: "Ten, kdo zůstane nehnutý, má vždy výhodu."
 tgp_child_personality.7071.change.vengeful: "$tgp_child_personality.7071.vengeful$"
 tgp_child_personality.7071.change.deceitful: "$tgp_child_personality.7071.deceitful$"
 tgp_child_personality.7071.change.calm: "Zůstaň nehnutý a vždy budeš ve výhodě."
 tgp_child_personality.7081.t: "Lahodný přepych"
 tgp_child_personality.7081.desc: "V poslední době si všímám, kolik našich sluhů rozmazluje [child.GetFirstName] dobrotami a rozdává je téměř každou hodinu."
 tgp_child_personality.generous.desc: "\n\nBez jakékoli chamtivosti [child.GetFirstNameNoTooltip] ochotně sdílí pochoutky s ostatními dětmi bez nejmenšího zaváhání."
 tgp_child_personality.fickle.desc: "\n\n[child.GetFirstNameNoTooltip|U] se jednou o svačinu ochotně podělí a vzápětí nechce dát nikomu ani sousto. Nálada se mění z okamžiku na okamžik."
 tgp_child_personality.arrogant.desc: "\n\n[child.GetFirstNameNoTooltip|U] si pochoutky žárlivě střeží, odmítá se s kýmkoli dělit a považuje je za své výsadní právo."
 tgp_child_personality.7081.generous: "O přebytek je třeba se dělit s těmi, kdo mají nedostatek."
 tgp_child_personality.7081.fickle: "Určitá duševní pružnost může zmást tvé soupeře."
 tgp_child_personality.7081.arrogant: "Chovej se tak, jak odpovídá tvému postavení, a ostatní se přizpůsobí."
 tgp_child_personality.7081.change.generous: "$tgp_child_personality.7081.generous$"
 tgp_child_personality.7081.change.fickle: "Nepředvídatelnost může být v mnoha situacích výhodou."
 tgp_child_personality.7081.change.arrogant: "$tgp_child_personality.7081.arrogant$"
 tgp_child_personality.7091.t: "Upřímná chyba"
 tgp_child_personality.7091.desc: "V nešťastné souhře okolností služebník omylem roztrhl oblíbený ilustrovaný svitek [child.GetFirstNamePossessive], protože ho považoval za odpad. Zvědavý, jak dítě zareaguje, usednu vedle [child.Custom('GirlBoy')|l]."
 tgp_child_personality.forgiving.desc: "\n\n„Máš opravdu velkorysé srdce,“ poznamenám. [child.GetFirstNameNoTooltip|U] lehce pokrčí rameny, jako by o nic nešlo. „Byla to nehoda. [Select_CString(child.IsFemale,'Nechtěla','Nechtěl')|U] jsem nikomu přidělávat výčitky.“"
 tgp_child_personality.trusting.desc: "\n\n„To vysvětlení ti stačilo velmi snadno,“ poznamenám. [child.GetFirstNameNoTooltip|U] upřímně přikývne. „Já našemu služebnictvu věřím,“ zazní prostá odpověď."
 tgp_child_personality.patient.desc: "\n\n„Bereš to docela klidně,“ poznamenám. [child.GetFirstNameNoTooltip|U] se bezstarostně usměje. „To nic. Na nový si klidně počkám.“"
 tgp_child_personality.7091.forgiving: "Buď tolerantní k chybám druhých; ne všichni jsou jako my."
 tgp_child_personality.7091.trusting: "Vkládej důvěru do těch, kdo ji vkládají do tebe."
 tgp_child_personality.7091.patient: "Mnohé rány se mohou zahojit časem; musíš jen počkat."
 tgp_child_personality.7091.change.forgiving: "$tgp_child_personality.7091.forgiving$"
 tgp_child_personality.7091.change.trusting: "$tgp_child_personality.7091.trusting$"
 tgp_child_personality.7091.change.patient: "$tgp_child_personality.7091.patient$"
 tgp_child_personality.7101.t: "Nepřetržité dotazování"
 tgp_child_personality.7101.desc: "Pátrání a získávání vědění je jedním ze znaků hodného [Select_CString(child.IsFemale,'žena','muž')|l], ale mé usilovné pokusy to vštípit [child.GetFirstName] možná trochu přešly hranici."
 tgp_child_personality.honest.desc: "\n\n„Můžeme už prosím skončit?“ prosí [child.GetFirstNameNoTooltip]. V napjatém hlase se upřímně odráží všechno zklamání."
 tgp_child_personality.arbitrary.desc: "\n\n„Byl to čtvrtý císař. Nebo devátý,“ odpoví [child.GetFirstNameNoTooltip] lhostejně na mou poslední otázku. Pravda zjevně nehraje velkou roli."
 tgp_child_personality.impatient.desc: "\n\n„Už končíme?“ [child.GetFirstNameNoTooltip|U] povzdechne s neukrývaným podrážděním, neklidně se vrtí a zřetelně by raději [Select_CString(child.IsFemale,'dělala','dělal')|l] cokoli jiného."
 tgp_child_personality.7101.honest: "Odvaž se říkat pravdu, jinak svět upadne do nespravedlnosti."
 tgp_child_personality.7101.arbitrary: "Pokud cítíš, že víš lépe, drž se své cesty."
 tgp_child_personality.7101.impatient: "Čím rychleji odpovíš, tím dřív budeme hotovi."
 tgp_child_personality.7101.change.honest: "$tgp_child_personality.7101.honest$"
 tgp_child_personality.7101.change.arbitrary: "$tgp_child_personality.7101.arbitrary$"
 tgp_child_personality.7101.change.impatient: "$tgp_child_personality.7101.impatient$"
 tgp_child_personality.7201.t: "Neústupná odhodlanost"
 tgp_child_personality.7201.desc: "Chvilička nepozornosti může mít vážné následky. Služebník prostě zapomněl zamknout bránu a najednou je [child.GetFirstName] venku, tváří v tvář toulavému psovi. Nebezpečí pominulo a dítě je zpátky ve svém pokoji nezraněné, ale následky přesto vyžadují mou pozornost."
 tgp_child_personality.brave.desc: "\n\n„Vůbec jsem se [Select_CString(child.IsFemale,'nebála','nebál')|l]!“ prohlásí hrdě [child.GetFirstNameNoTooltip]. „[Select_CString(child.IsFemale,'Postavila','Postavil')|U] bych se celé smečce vlků!“"
 tgp_child_personality.stubborn.desc: "\n\n„[Select_CString(child.IsFemale,'Stála','Stál')|U] jsem pevně!“ trvá na svém [child.GetFirstNameNoTooltip]. „Já jsem [Select_CString(child.IsFemale,'neutekla','neutekl')|l]. To sloužící mě odnesli dovnitř!“ Dítě zjevně více pohoršuje záchrana než nebezpečí, kterému čelilo."
 tgp_child_personality.wrathful.desc: "\n\n„Nesnáším toho psa!“ [child.GetFirstNameNoTooltip|U] křičí s očividnou frustrací. „Měli ho zabít, ne jen zahnat!“"
 tgp_child_personality.7201.brave: "Smělý a nezlomný duch; schvaluji!"
 tgp_child_personality.7201.stubborn: "Zůstaň pevný a nepoddávej se ani člověku, ani bestii."
 tgp_child_personality.7201.wrathful: "Hněv, správně nasměrovaný, posílí tvé ambice."
 tgp_child_personality.7201.change.brave: "Postav se svým protivníkům statečně a vítězství nevyhnutelně přijde."
 tgp_child_personality.7201.change.stubborn: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] bys zůstat pevný a nepoddat se ani člověku, ani zvířeti."
 tgp_child_personality.7201.change.wrathful: "Nezlobí tě agrese této podlé bytosti?"
 tgp_child_personality.7301.t: "Zlomená křídla"
 tgp_child_personality.7301.desc: "Právě dokončuji kontrolu domácích účtů, když mi služebníci přinesou novou záležitost; malý ptáček neobvyklého opeření se zlomeným křídlem, kterého [child.GetFirstName] [Select_CString(child.IsFemale,'našla','našel')|l] na dvoře."
 tgp_child_personality.7301.eccentric.desc: "\n\n[child.GetFirstNameNoTooltip|U] už ptáčkovi zcela [Select_CString(child.IsFemale,'propadla','propadl')|l]. Nebo spíš samotné #EMP představě#!! ptáčka. Neustále mluví o tom, jak by bylo krásné létat stejně jako on."
 tgp_child_personality.7301.compassionate.desc: "\n\n[child.GetFirstNameNoTooltip|U] nedokáže snést jeho trápení a trvá na tom, že ptáčka vezmeme domů a budeme o něj pečovat jako o jednoho z nás."
 tgp_child_personality.7301.callous.desc: "\n\nProjevuje zjevný nezájem o jeho utrpení, [child.GetFirstNameNoTooltip] [Select_CString(child.IsFemale,'nechala','nechal')|l] zlomeného ptáčka tam, kde ho [Select_CString(child.IsFemale,'našla','našel')|l], a [Select_CString(child.IsFemale,'ponechala','ponechal')|l] ho na starost našim služebníkům - a zdá se, i jejich pánovi."
 tgp_child_personality.7301.eccentric: "Dětská mysl je zvláštní a nádherná věc."
 tgp_child_personality.7301.compassionate: "Starej se o své lidi stejně jako o tohoto ptáčka."
 tgp_child_personality.7301.callous: "Nech slabé, ať se postarají sami o sebe, ptáčka nebo [Select_CString(child.IsFemale,'žena','muž')|l]."
 tgp_child_personality.7301.change.eccentric: "Nech svou mysl vzlétnout a představuj si svět ptačíma očima."
 tgp_child_personality.7301.change.compassionate: "Především se starej o ty slabší než ty."
 tgp_child_personality.7301.change.callous: "$tgp_child_personality.7301.callous$"
