l_polish:

 tgp_china_career.0001.t: "Ve službách Syna Nebes"
 tgp_china_career.0001.desc: "Správní aparát [emperor.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] je nesmírně rozsáhlý a složitý, přesto funguje jako dokonale promazaný stroj. Povinností každého obyvatele je sloužit panství podle svých nejlepších schopností.\n\n"
 tgp_china_career.0001.minister_desc: "Jako [new_ruler.GetTitleAsNameNoTooltip] jsem neustále na očích. Jediné chybné rozhodnutí by mohlo zničit celou mou kariéru.\n\nDokážu [emperor.Custom('CZ_TitleAsNameNoTooltip_D')], že si zasloužím [Select_CString(emperor.IsFemale,'její','jeho')] důvěru."
 tgp_china_career.0001.landed_desc: "Jako [new_ruler.GetTitleAsNameNoTooltip] [new_ruler.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] mám na bedrech mnoho povinností a závazků. Jméno rodu [ruler_family.GetName] se stane známým po celém panství.\n\nMožná mám dokonce schopnosti potřebné k tomu, abych jednoho dne [Select_CString(ROOT.Char.IsFemale,'pronikla','pronikl')] do státní správy a [Select_CString(ROOT.Char.IsFemale,'získala','získal')] ministerský úřad?"
 tgp_china_career.0001.unlanded_desc: "Jako [Select_CString(ROOT.Char.IsFemale,'členka','člen')] rodiny [ruler_family.GetName] budu muset tvrdě pracovat, abych si [Select_CString(ROOT.Char.IsFemale,'vybudovala','vybudoval')] vlastní pověst. Nejprve musím složit [Concept('examinations','zkoušky')|E] a získat [Concept('merit','zásluhy')|E]. Teprve potom budu moci získat úřednické jmenování."
 tgp_china_career.0001.a: "Osud nečeká. Do práce!"
 tgp_china_career.0001.b: "Každý bude vědět, kdo #EMP já#! jsem."
 tgp_merit_boost_modifier: "Úsilí o zásluhy"
 tgp_merit_boost_modifier_desc: "Tato postava se soustředí na získávání zásluh a studium Cesty."
 tgp_influence_boost_modifier: "Úsilí o vliv"
 tgp_influence_boost_modifier_desc: "Tato postava se soustředí na získávání vlivu a prosazování svých cílů."
 tgp_china_career.0010.t: "Cesta zásluh"
 tgp_china_career.0010.first_rank_desc: "Mé zásluhy konečně dosáhly úrovně, za kterou mi byla udělena hodnost [merit_char.Custom('GetMeritRank')]. [Select_CString(ROOT.Char.IsFemale,'Učinila','Učinil')|U] jsem tak první krok na cestě k dlouhé a slibné kariéře. Konečně se mohu ucházet o úřednické jmenování, spravovat území a přinášet panství blahobyt.\n\nMožná právě nastal čas rozhodnout se, jakou kariéru chci budovat. Budu stoupat po politickém žebříčku v civilní správě? Nebo se ujmu velení vojsk, povedu své vojáky do boje a přinesu panství mír?"
 tgp_china_career.0010.higher_rank_desc: "Má tvrdá práce a píle konečně přinesly ovoce. Byla mi udělena hodnost zásluh [merit_char.Custom('GetMeritRank')]."
 tgp_china_career.0010.higher_rank_unspecific: "\n\nText [ROOT.Char.Custom('GetRandomAnnalsPassage')|U] už znám stejně důvěrně jako jméno vlastní matky. Přesto mám před sebou ještě tolik práce."
 tgp_china_career.0010.highest_rank: "\n\nKolik svitků jsem [Select_CString(ROOT.Char.IsFemale,'prostudovala','prostudoval')], kolik nocí [Select_CString(ROOT.Char.IsFemale,'probděla','probděl')]! Tato část mé cesty skončila, ale přede mnou se stále táhne dlouhá pouť."
 tgp_china_career.0010.duchy_desc: "\n\nNyní mohu svou kariéru skutečně rozvinout. Méně významné úřednické funkce nechám za sebou a otevře se mi cesta k vyšším úřadům. Samozřejmě až se nějaké místo uvolní."
 tgp_china_career.0010.kingdom_desc: "\n\nMé zásluhy nyní postačují k tomu, abych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] být [Select_CString(ROOT.Char.IsFemale,'jmenována','jmenován')] do čela ještě větších a významnějších provincií."
 tgp_china_career.0010.empire_desc: "\n\nV cestě mi již stojí jen málo překážek. Mé zásluhy postačují ke jmenování ministrem. Pokud budu dostatečně usilovat, možná jednoho dne získám i úřad velkého kancléře."
 tgp_higher_ambitions_modifier: "Vyšší ambice"
 tgp_higher_ambitions_modifier_desc: "Tato postava se rozhodla věnovat veškeré úsilí postupu v hodnostech zásluh."
 tgp_china_career.0010.aa: "Vím, že dokážu víc."
 tgp_china_career.0010.a: "Významný milník mé kariéry."
 tgp_china_career.0010.b1: "Civilní úřad by mi vyhovoval lépe."
 tgp_china_career.0010.b2: "Jsem civilní úředník a také jím zůstanu."
 tgp_china_career.0010.c1: "Slávu budu hledat na bojišti!"
 tgp_china_career.0010.c2: "Velení vojákům v bitvě je pro mě druhou přirozeností."
 keep_civilian_career_desc: "Pokračuješ v úřednické kariéře a nadále splňuješ podmínky pro civilní [GetPlayer.Custom('GetProvincePluralConcept')|l] a [GetLaw('celestial_appointment_succession_law').GetName]"
 keep_military_career_desc: "Pokračuješ ve vojenské kariéře a nadále splňuješ podmínky pro vojenské [GetPlayer.Custom('GetProvincePluralConcept')|l] a [GetLaw('celestial_military_appointment_succession_law').GetName]"
 merit_rank_none_gloss: "žádná"
 merit_rank_9_gloss: "[Glossary('nižší z nižších','MERIT_LOWER_LOWER_GLOSS')]"
 merit_rank_8_gloss: "[Glossary('střední z nižších','MERIT_LOWER_MIDDLE_GLOSS')]"
 merit_rank_7_gloss: "[Glossary('vyšší z nižších','MERIT_LOWER_UPPER_GLOSS')]"
 merit_rank_6_gloss: "[Glossary('nižší ze středních','MERIT_MIDDLE_LOWER_GLOSS')]"
 merit_rank_5_gloss: "[Glossary('střední ze středních','MERIT_MIDDLE_MIDDLE_GLOSS')]"
 merit_rank_4_gloss: "[Glossary('vyšší ze středních','MERIT_MIDDLE_UPPER_GLOSS')]"
 merit_rank_3_gloss: "[Glossary('nižší z vyšších','MERIT_UPPER_LOWER_GLOSS')]"
 merit_rank_2_gloss: "[Glossary('střední z vyšších','MERIT_UPPER_MIDDLE_GLOSS')]"
 merit_rank_1_gloss: "[Glossary('vyšší z vyšších','MERIT_UPPER_UPPER_GLOSS')]"
 tgp_china_career.0030.t: "Odchod mudrce"
 tgp_china_career.0030.desc: "[Select_CString(deceased_elder.IsFemale,'Má učitelka','Můj učitel')|U], [deceased_elder.GetFirstName], [Select_CString(deceased_elder.IsFemale,'odešla','odešel')] z tohoto světa. Zpráva praví, že [deceased_elder.GetDeathReason]. Už teď pociťuji prázdnotu, kterou po sobě [Select_CString(deceased_elder.IsFemale,'zanechala','zanechal')]. Přistihnu se, jak se chystám položit otázku, ale slova mi uvíznou na jazyku, když si uvědomím, že už není nikdo, kdo by mi na ni odpověděl.\n\nTakové pomíjivé pocity však nevyhnutelně musí ustoupit tíze naléhavých světských povinností. Je třeba zajistit pohřební a smuteční obřady a také rozhodnout, kdo převezme úlohu [Select_CString(deceased_elder.IsFemale,'mé mistryně','mého mistra')] a bude pokračovat v [Select_CString(deceased_elder.IsFemale,'jejím','jeho')] díle."
 tgp_china_career.0030.a: "[deceased_elder.Custom('CZ_FirstNamePossessiveNoTooltip_F')|U] cesta skončila, ale má musí pokračovat."
 tgp_china_career.0030.a.tt: "Vyhledáš nového [Concept('elder','staršího')|EU] mezi mocnými a vlivnými osobnostmi"
 tgp_china_career.0030.b: "Vyjádřete [Select_CString(deceased_elder.IsFemale,'její','jeho')] rodině mou soustrast a předejte jí projev mé úcty."
 tgp_china_career.0030.c: "[superior_fellow_disciple.GetFirstNameNoTooltip|U] si ze všech nejvíce zaslouží pokračovat v díle [Select_CString(deceased_elder.IsFemale,'naší mistryně','našeho mistra')]."
 tgp_china_career.0030.d: "Převezmu [Select_CString(deceased_elder.IsFemale,'její','jeho')] odkaz a budu pokračovat v [Select_CString(deceased_elder.IsFemale,'její','jeho')] Cestě."
