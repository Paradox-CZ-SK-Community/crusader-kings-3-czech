l_polish:
 tgp_forced_labor_modifier: "Nucené práce"
 tgp_forced_labor_modifier_desc: "Poddaní tohoto hrabství jsou pod hrozbou násilí nuceni pracovat a jejich odpor vůči vrchnosti neustále roste."
 tgp_recruited_charlatan_modifier: "Naverbovaný šarlatán"
 tgp_recruited_charlatan_modifier_desc: "Tato postava získala zkušenosti s intrikami díky setkání s básnickým neumětelem."
 tgp_unpressed_taxes_modifier: "Nevymáhané daně"
 tgp_unpressed_taxes_modifier_desc: "Toto hrabství vzkvétá pod správou shovívavého úředníka."
 tgp_lowborn_chastiser_modifier: "Káratel neurozených"
 tgp_lowborn_chastiser_modifier_desc: "Tato postava pomohla svým poddaným zbavit se studu za chudobu pomocí výhrůžek a příkazů k tělesným trestům."
 tgp_lowborn_tenderizer_modifier: "Mlátič neurozených"
 tgp_lowborn_tenderizer_modifier_desc: "Tato postava svým poddaným doslova vymlátila z hlavy stud za jejich chudobu. Po tak důkladných kázeňských opatřeních z nich ostatně mnoho nezbylo."
 tgp_aided_farmers_modifier: "Podpoření rolníci"
 tgp_aided_farmers_modifier_desc: "Rolnické rodiny tohoto hrabství dostaly možnost přivést své mladé muže zpět z válečných tažení lenního pána."
 tgp_disciplined_farmers_modifier: "Ukáznění rolníci"
 tgp_disciplined_farmers_modifier_desc: "Rolníci v tomto hrabství pracují s mimořádným nasazením poté, co byli svědky veřejného oběšení."
 tgp_sworn_service_modifier: "Služební přísaha"
 tgp_sworn_service_modifier_desc: "Tato postava splácí dluh svého rodiče službou u dvora. Dokud nebude dluh splacen, nesmí odejít."
 tgp_courtly_influence_modifier: "Dvorský vliv"
 tgp_courtly_influence_modifier_desc: "Rolníci tohoto hrabství těží ze zkušeností jednoho z nich, který během svého pobytu u dvora získal cenné poznatky."
 tgp_sanctioned_deity_modifier: "Úředně uznané božstvo"
 tgp_sanctioned_deity_modifier_desc: "Obyvatelé tohoto hrabství uctívají nově uznané božstvo a pravidelný příliv návštěvníků k jeho svatyni prospívá místnímu obyvatelstvu."
 tgp_debunked_deity_modifier: "Vyvrácené božstvo"
 tgp_debunked_deity_modifier_desc: "Tato postava dokázala pomocí obratné rétoriky zničit rodící se božstvo dříve, než se jeho kult stačil rozšířit."
 tgp_resisted_alcohol_modifier: "Zdrženlivost vůči alkoholu"
 tgp_resisted_alcohol_modifier_desc: "Tato postava odolala pokušení a odmítla se zúčastnit pitky s pálenkou paj-ťiou."
 tgp_stationed_troops_modifier: "Opevněný kraj"
 tgp_trained_monks_modifier: "Dobře vycvičení mniši"
 tgp_trained_monks_modifier_desc: "Mniši v tomto kraji prošli výcvikem bojových umění pod osobním dohledem svého lenního pána a jsou připraveni bránit své postavení proti jakémukoli útočníkovi."
 tgp_adequately_trained_monks_modifier: "Dostatečně vycvičení mniši"
 tgp_adequately_trained_monks_modifier_desc: "Mniši v tomto kraji prošli výcvikem bojových umění pod dohledem maršála svého lenního pána a jsou alespoň částečně připraveni bránit své postavení proti případným útočníkům."
 tgp_fattened_vanguard_modifier: "Přebujelý předvoj"
 tgp_fattened_vanguard_modifier_desc: "Toto hrabství poskytuje vojsku svého lenního pána každého člověka schopného služby."
 tgp_diligent_workers_modifier: "Pilní pracovníci"
 tgp_diligent_workers_modifier_desc: "Rolníci v tomto kraji usilovně pracují, aby si naklonili svého lenního pána a uchránili své mladé muže před odvodem do vojska."
 tgp_well_equipped_soldiers_modifier: "Dobře vybavení vojáci"
 tgp_well_equipped_soldiers_modifier_desc: "Vojáci rozmístění v této državě mají lepší výstroj a výzbroj než většina ostatních."
 tgp_greatly_equipped_soldiers_modifier: "Prvotřídně vybavení vojáci"
 tgp_greatly_equipped_soldiers_modifier_desc: "Vojáci rozmístění v této državě disponují tím nejlepším dostupným vybavením, díky němuž budou v bitvě podávat vynikající výkony."
 tgp_outmatched_local_warriors_modifier: "Vybroušené bojové instinkty"
 tgp_outmatched_local_warriors_modifier_desc: "Tato postava vyhledávala nové protivníky v cizích krajích, ale všude zjišťovala, že je svými schopnostmi převyšuje."
 tgp_strengthen_capital_character_modifier: "Budovatel hlavního města"
 tgp_strengthen_capital_character_modifier_desc: "Hlavní město Syna Nebes prošlo nedávno rozsáhlou obnovou, která výrazně posílila jeho velkolepost. Oblast kolem hlavního města se nyní stala nezpochybnitelným středem celého panství."
 tgp_strengthen_capital_modifier: "Nebeské hlavní město"
 tgp_strengthen_capital_modifier_desc: "$tgp_strengthen_capital_character_modifier_desc$\n\n[Concept('dynastic_cycle','Dynastický cyklus')|EU]: V žádné [Concept('dynastic_cycle_era_type_stable','stabilní éře')|E] nedochází k #EMP žádnému#! každoročnímu odklonu od [Concept('favored_movement','upřednostněného hnutí')|E], dokud je toto místo [Concept('realm_capital','hlavním sídlem panství')|E][AddLocalizationIf( HasDlcFeature( 'wards_and_wardens' ), 'tgp_strengthen_capital_modifier_education_bonus')]"
 tgp_strengthen_capital_architects_modifier: "Dokonalá architektura"
 tgp_strengthen_capital_architects_modifier_desc: "Hlavní město Syna Nebes prošlo obnovou pod dohledem zkušených architektů, kteří výrazně zlepšili jeho podmínky pro růst populace a rozvoj obchodu."
 tgp_strengthen_capital_engineers_modifier: "Důmyslné inženýrství"
 tgp_strengthen_capital_engineers_modifier_desc: "Hlavní město Syna Nebes prošlo obnovou pod dohledem nadaných stavitelů a inženýrů, kteří výrazně zlepšili jeho infrastrukturu a spojení s okolními sídly."
 tgp_strengthen_capital_sculptors_modifier: "Skvostné sochy"
 tgp_strengthen_capital_sculptors_modifier_desc: "Během obnovy hlavního města Syna Nebes byli najati nejlepší sochaři z celého panství, aby pečlivě vyzdobili každý prvek nově vznikající architektury."
 tgp_strengthen_capital_modifier_education_bonus: "\nZvyšuje šanci na úspěch během [Concept('activity','aktivity')|E] [GetActivityType('activity_adult_education').GetTextIcon][CZActivity('activity_adult_education','G')] v této [Concept('location','lokalitě')|E]"
 tgp_minister_project_development_modifier: "Rozvinutá sídla"
 tgp_minister_project_development_modifier_desc: "V rámci [Concept('great_project','velkého projektu')|E] bylo nedávno vynaloženo značné úsilí na rozvoj této oblasti. Zvelebena byla města, okolní vesnice i cesty, které je vzájemně propojují."
 tgp_grand_canal_modifier: "Velký kanál"
 tgp_grand_canal_modifier_desc: "Tato oblast těží z kanálu a soustavy vodních cest a akvaduktů, které usnadňují přepravu zboží a pohyb obchodníků."
 tgp_minister_project_establish_control_modifier: "Sjednocená byrokracie"
 tgp_minister_project_establish_control_modifier_desc: "Správa tohoto hrabství prošla nedávno významnými reformami, které výrazně posílily kontrolu vlády nad celou oblastí."
 tgp_minister_project_train_troops_modifier: "$great_project_type_minister_project_train_troops_contribution_train_troops$"
 tgp_minister_project_train_troops_modifier_desc: "Ozbrojenci tohoto hrabství absolvovali náročný výcvik schválený Ministerstvem války."
 tgp_minister_project_train_troops_levy_bootcamp_modifier: "$great_project_type_minister_project_train_troops_contribution_levy_bootcamp$"
 tgp_minister_project_train_troops_levy_bootcamp_modifier_desc: "Odvedenci tohoto hrabství procházejí výcvikem pod vedením generálů z ústředního úřadu Ministerstva války."
 tgp_minister_project_train_troops_siege_exercise_modifier: "$great_project_type_minister_project_train_troops_contribution_siege_exercise$"
 tgp_minister_project_train_troops_siege_exercise_modifier_desc: "Vojska tohoto hrabství se pod dohledem Ministerstva války cvičí v ničivých obléhacích útocích a zároveň se připravují odolat i dvojnásobně silným obléhacím vojskům."
 tgp_minister_project_train_troops_natural_disaster_test_modifier: "$great_project_type_minister_project_train_troops_contribution_natural_disaster_test$"
 tgp_minister_project_train_troops_natural_disaster_test_modifier_desc: "Díky povinným cvičením nařízeným Ministerstvem války je toto hrabství připraveno na organizovanou evakuaci, zmírňování škod a rychlou obnovu v případě jakékoli přírodní pohromy."
 tgp_minister_project_conduct_census_modifier: "Řádně provedené sčítání"
 tgp_minister_project_conduct_census_modifier_desc: "V tomto hrabství provedl [Concept('minister_of_revenue','ministr příjmů')|E] sčítání lidu."
 tgp_minister_project_conduct_census_purge_treasury_debt_modifier: "Opatření proti zadlužení"
 tgp_minister_project_conduct_census_purge_treasury_debt_modifier_desc: "Tato postava těží z programu Ministerstva příjmů zaměřeného na předcházení [Concept('treasury_debt','dluhům pokladnice')|E], který byl zaveden v rámci projektu [GetGreatProjectType('minister_project_conduct_census').GetName]."
 tgp_minister_project_conduct_census_fertility_effort_modifier: "$great_project_type_minister_project_conduct_census_contribution_fertility_effort$"
 tgp_minister_project_conduct_census_fertility_effort_modifier_desc: "[Concept('holder','Držitel')|EU] tohoto hrabství bude těžit z programu Ministerstva příjmů na podporu porodnosti, zavedeného v rámci projektu [GetGreatProjectType('minister_project_conduct_census').GetName]. Ministerstvo vyplatí prostředky z [Concept('treasury','pokladnice')|E] za příští narozené dítě."
 tgp_minister_project_conduct_census_natural_disaster_insurance_modifier: "$great_project_type_minister_project_conduct_census_contribution_natural_disaster_insurance$"
 tgp_minister_project_conduct_census_natural_disaster_insurance_modifier_desc: "[Concept('holder','Držitel')|EU] tohoto hrabství bude těžit z programu Ministerstva příjmů poskytujícího pojištění proti [Concept('natural_disasters','přírodním pohromám')|E], zavedeného v rámci projektu [GetGreatProjectType('minister_project_conduct_census').GetName]. V případě vypuknutí pohromy ministerstvo poskytne prostředky z [Concept('treasury','pokladnice')|E]."
 tgp_child_exam_cooldown_modifier: "Neúspěch u dětské zkoušky"
 tgp_child_exam_cooldown_modifier_desc: "Úřednické zkoušky představují zásadní životní událost pro každého, kdo vzhlíží k nebesům. Tato postava však jejich tíhu nedokázala unést."
 tgp_local_exam_initial_success: "Slibný začátek zkoušky"
 tgp_local_exam_initial_success_desc: "První úspěch zanechává trvalý dojem."
 tgp_local_exam_impressed_examiner: "Ohromený zkoušející"
 tgp_local_exam_strong_finish: "Působivý závěr zkoušky"
 tgp_local_exam_strong_finish_desc: "V pozdním odpoledni dlouhé a náročné zkoušky se ti nejnadanější studenti konečně odlišují od ostatních."
 tgp_child_focused_studies_modifier: "Soustředěné studium"
 tgp_forced_to_retake_exam_modifier: "Čekání na palácovou zkoušku"
 tgp_forced_to_retake_exam_modifier_desc: "Tato postava s nervozitou vyhlíží další termín [CZActivity('activity_imperial_examination','G')]. Rodina na ni totiž vyvíjí tlak, aby se utkala s těmi nejlepšími."
 tgp_joined_grand_campaign_modifier: "Účast na velkém tažení"
 tgp_joined_grand_campaign_modifier_desc: "Tato postava přispěla k válečnému tažení nařízenému státem. S podporou vlády však přicházejí i velká očekávání."
 tgp_wiles_is_the_way_modifier: "Lstivost je ta pravá cesta"
 tgp_wiles_is_the_way_modifier_desc: "Proč se držet Cesty, když si ji můžeš zkrátit?"
 tgp_honor_is_the_way_modifier: "Čest je ta pravá cesta"
 tgp_honor_is_the_way_modifier_desc: "Tato postava čerpá inspiraci z morálního vedení svých učitelů a rodiny."
 tgp_passed_provincial_exam_modifier: "Složená provinční zkouška"
 tgp_bypassed_provincial_exam_modifier: "Vynechaná provinční zkouška"
 tgp_bypassed_provincial_exam_modifier_desc: "Tato postava úspěšně složila zkoušky vyšší úrovně, aniž by předtím absolvovala místní zkoušku."
 tgp_passed_metropolitan_exam_modifier: "Složená metropolitní zkouška"
 tgp_passed_palace_exam_modifier: "Složená palácová zkouška"
 tea_ceremony_health_benefit: "Čaj pro zdraví"
 tea_ceremony_health_benefit_desc: "Tato postava vypila šálek čaje a cítí se díky němu mnohem lépe."
 tea_ceremony_perfect_tea: "Dokonale připravený čaj"
 tea_ceremony_perfect_tea_desc: "Tato postava připravila a podávala naprosto dokonalý čaj. Alespoň podle názoru všech přítomných."
 tea_ceremony_peace_of_mind: "Čaj pro klid mysli"
 tea_ceremony_peace_of_mind_desc: "Tato postava si dopřála šálek čaje, který blahodárně zapůsobil na její mysl."
 tea_ceremony_spirit: "Čaj pro ducha"
 tea_ceremony_spirit_desc: "Tato postava si vychutnala šálek čaje při rozjímání o duchovním světě."
 tea_ceremony_family: "Rodinné posezení u čaje"
 tea_ceremony_family_desc: "Tato postava shromáždila svou rodinu ke společnému posezení nad konvicí čaje."
 tgp_aspiration_great_salary_modifier: "Výrazné zvýšení platu"
 tgp_aspiration_great_salary_modifier_desc: "Tato postava plní své povinnosti s mimořádnými výsledky, za což si vysloužila značné navýšení platu."
 tgp_aspiration_modest_salary_modifier: "Zvýšení platu"
 tgp_aspiration_modest_salary_modifier_desc: "Tato postava odvádí při plnění svých povinností dobrou práci, za což si vysloužila zvýšení platu."
 claim_mandate_decision_modifier: "$game_concept_son_of_heaven$"
 minister_scheme_slots_modifier: "V čele ministerstva"
 minister_scheme_slots_modifier_desc: "Tato postava stojí v čele jednoho z nejvyšších ministerstev Nebeské vlády. Díky celému úřednickému aparátu, který má k dispozici, se výrazně rozšiřují možnosti a dosah jejích intrik."
 hegemony_of_china_desc: "$game_concept_de_jure$ [GetTitleByKey('h_china').GetName]: $VALUE|+0=$"
 is_already_administrative: "Již má typ vlády $game_concept_administrative_government$: $VALUE|+0=$"
 impugned_my_sovereignty: "Zpochybnění mé svrchovanosti"
 tgp_known_exam_cheater_modifier: "Odhalený podvod při zkoušce"
 tgp_known_exam_cheater_modifier_desc: "U této postavy se prokázalo, že při zkoušce podváděla."
