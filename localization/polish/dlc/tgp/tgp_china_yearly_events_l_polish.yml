l_polish:
 tgp_china_yearly.0001.t: "Když Cesta nevládne"
 tgp_china_yearly.0001.desc: "Cestou zpět do svého příbytku si nemohu nevšimnout rostoucího davu před branami místního sídla v [CZProvName(poor_county.GetProvince,'L')]. Jde o [poor_county.GetProvince.GetHolding.GetType.GetName|l].\n\nMatky, otcové i děti stojí v ulicích ve frontách. Se sklopenými hlavami a pohledy plnými studu natahují ruce k procházejícím pocestným a prosí o zbytky jídla."
 tgp_china_yearly.0001.a: "Darovat chudým jídlo a oblečení."
 tgp_china_yearly.0001.a.flavor: "... a přiznat tak vlastní selhání při správě svého lidu."
 tgp_china_yearly.0001.b: "„Zažeňte je zpátky do práce!“"
 tgp_china_yearly.0001.b.success: "Prostý lid úspěšně zastrašen"
 tgp_china_yearly.0001.b.critical: "Ohromující úspěch!"
 tgp_china_yearly.0001.c: "„Raději se vrátím ke studiu.“"
 tgp_china_yearly.0001.c.flavor: "Na řešení tak složitých otázek ještě nejsem [Select_CString(ROOT.Char.IsFemale,'připravena','připraven')]."
 tgp_china_yearly.0001.d: "Takové světské starosti jsou pod mou úroveň."
 tgp_china_yearly.0005.t: "[Select_CString(grieving_child.IsFemale,'Opravdová','Opravdový')|U] [grieving_child.Custom('GetDaughterSon')|l]"
 tgp_china_yearly.0005.eunuch: "[messenger.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě zdraví a v patách přivádí dítě z prostého lidu.\n\n„[ROOT.Char.Custom('CZ_TitleAsName_V')|U], před branami jsem [Select_CString(messenger.IsFemale,'objevila','objevil')] [Select_CString(grieving_child.IsFemale,'dívku','chlapce')], [Select_CString(grieving_child.IsFemale,'která žádala','který žádal')] o audienci u vás. Nedávno [Select_CString(grieving_child.IsFemale,'ztratila','ztratil')] posledního žijícího příbuzného a nemá prostředky na důstojný pohřeb. Přece pro to dítě musíme něco udělat!“"
 tgp_china_yearly.0005.knight: "Od bran nádvoří se ozývá hlasitý křik a dupot spěchajících nohou. Vydám se za hlukem a spatřím [messenger.Custom('CZ_TitledFirstName_A')], jak zadržuje dítě z prostého lidu.\n\n„Pomozte mi, [ROOT.Char.Custom('CZ_TitleAsName_V')]!“ volá dítě. „[Select_CString(parent.IsFemale,'Má matka zemřela','Můj otec zemřel')|U] a [Select_CString(parent.IsFemale,'nechala','nechal')] mě úplně [Select_CString(grieving_child.IsFemale,'samotnou','samotného')]. Nemám ani plátno, do kterého bych [Select_CString(parent.IsFemale,'ji','ho')] [Select_CString(grieving_child.IsFemale,'zahalila','zahalil')], ani hřebíky na rakev.“ Zarudlé oči a zaschlé slzy i hlen pod nosem dítěte mě přesvědčují, že jeho zoufalství je skutečné."
 tgp_china_yearly.0005.outro: "\n\nPokud nic neudělám, je docela možné, že dítě samo nepřežije."
 tgp_china_yearly.0005.a: "„Najdu pro dítě vhodného opatrovníka.“"
 tgp_china_yearly.0005.b: "„Když dítě přijmeme, nebude moci vzdát čest [Select_CString(parent.IsFemale,'své matce','svému otci')].“"
 tgp_china_yearly.0005.c: "Na takové rozhodnutí ještě nejsem [Select_CString(ROOT.Char.IsFemale,'připravena','připraven')]."
 tgp_china_yearly.0005.c.flavor: "Znovu si připomeneš, že se musíš více věnovat studiu."
 tgp_china_yearly.0005.d: "Nemáme právo rozhodovat o životě a smrti."
 tgp_china_yearly.0010.t: "Štěstí v tazích štětce"
 tgp_china_yearly.0010.desc: "Když procházím místním tržištěm, zaslechnu od jednoho ze stánků hlasité vyvolávání: „Básně na prodej! Verše štěstí, které přinesou vašemu domu blahobyt!“\n\nProdírám se davem, abych si stánek [Select_CString(ROOT.Char.IsFemale,'prohlédla','prohlédl')] zblízka. Kaligrafické znaky jsou načrtnuté příliš tenkými tahy. Linky působí uspěchaně a na několika místech téměř splývají.\n\nO zručnosti [Select_CString(starving_lowborn.IsFemale,'této prodavačky','tohoto prodavače')] mám značné pochybnosti a tvrzením o zázračné moci veršů věřím ještě méně. Přesto se tu shromáždila dlouhá fronta lidí, kteří si chtějí nabízená díla koupit."
 tgp_china_yearly.0010.a: "[Select_CString(starving_lowborn.IsFemale,'Tahle písařka není o nic lepší než zlodějka!','Tenhle písař není o nic lepší než zloděj!')|U]"
 tgp_china_yearly.0010.a.tt: "Vyženeš [Select_CString(starving_lowborn.IsFemale,'písařku','písaře')]"
 tgp_china_yearly.0010.b: "[starving_lowborn.GetShortUIName|U] by se mi [Select_CString(starving_lowborn.IsFemale,'mohla','mohl')] hodit."
 tgp_china_yearly.0010.c: "Co o tom asi říkají knihy?"
 tgp_china_yearly.0010.d: "Čekají mě důležitější záležitosti."
 tgp_china_yearly.0015.t: "Kupecké potíže"
 tgp_china_yearly.0015.desc: "Návštěvu místní čajovny mi přeruší rozruch na ulici. Vyhlédnu ven a spatřím [market_vendor.GetTitledFirstName], [Select_CString(market_vendor.IsFemale,'místní malířku','místního malíře')], jak se pře s neznámým kupcem.\n\n„Moji zákazníci vědí, kde mě najdou! Mám pro ně připraveno několik zakázek, které jim musím předat!“ namítá [market_vendor.GetTitledFirstNameNoTooltip], ale kupec už mezitím postavil stánek a vyrovnal své zboží.\n\nNa stánku se povalují nejrůznější oděvy ([ROOT.Char.Custom('GetClothingArticle')|l]), vyřezávané sošky zvířat, jejichž předlohou je [ROOT.Char.Custom('RegionalFerociousAnimal')|l], a množství zdobných jehlic do vlasů a hřebenů. Je zřejmé, že kupec žije z práce jiných řemeslníků."
 tgp_china_yearly.0015.a: "Vyhnat kupce."
 tgp_china_yearly.0015.b: "Dovolit kupci zůstat, ale ne zadarmo."
 tgp_china_yearly.0015.c: "Okřiknu je a vrátím se k rozjímání nad učením."
 tgp_china_yearly.0015.d: "Taková malicherná hádka."
 tgp_china_yearly.0020.t: "Otázka veřejné služby"
 tgp_china_yearly.0020.desc: "[tax_official.GetTitledFirstName|U] ke mně přichází do zahrady. Ruce se nervózně pohybují, zatímco na tváři se rýsuje dravý úsměv. Sotva stačím odložit květinu zvanou „[ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')|l]“, kterou držím v ruce, a obrátit se k příchozí návštěvě, když zazní první slova.\n\n„Posílá mě [Select_CString(tax_liege.IsFemale,'tvá lenní paní','tvůj lenní pán')],“ dozvídám se. „[tax_liege.GetTitledFirstName|U] ti vzkazuje, že císařská pokladnice potřebuje peníze. Z [CZProvName(taxless_county.GetProvince,'G')] je navíc třeba vybrat značné daňové nedoplatky. Právě tímto úkolem tě [Select_CString(tax_liege.IsFemale,'pověřila','pověřil')].“\n\nJe samozřejmé, že pokud neuposlechnu, utrpí má pověst. Jenže [Glossary( 'Kǒngzǐ', 'CONFUCIUS_GLOSS' )] nás učí zavrhovat chamtivost ve všech jejích podobách."
 tgp_china_yearly.0020.a: "Vyslat výběrčí daní."
 tgp_china_yearly.0020.b: "Odmítnout."
 tgp_china_yearly_no_education_first: "#weak Tento účinek získáváš, protože nemáš vlastnost [GetTrait('confucian_education').GetName( GetNullCharacter )].#!"
 tgp_china_yearly.0030.t: "Dobrá pověst se šíří daleko"
 tgp_china_yearly.0030.desc_minister_of_personel: "[title_offerer.Custom2('AppropriateGreetingPositive', ROOT.Char)|U]\n\nJe mou povinností vyhledávat nadané lidi, jako jsi ty, a pomáhat jim získat úřednická místa. "
 tgp_china_yearly.0030.desc_elder: "Jako [Select_CString(title_offerer.IsFemale,'tvá','tvůj')] [Concept('elder','starší')|E] musím přiznat, že na mě tvá pověst skutečně řádného konfuciána udělala velký dojem."
 tgp_china_yearly.0030.desc_fellow_confucian: "Jako tvého souvěrce v konfuciánském učení mě těší zprávy o tvé oddanosti Cestě. Těším se také na příležitosti k mnoha přátelským rozpravám v budoucnu."
 tgp_china_yearly.0030.desc_intro_outro: "\n\nJako uznání tvého příkladného vystupování ti tímto nabízím podporu při ucházení se o úřad správce [free_title.Custom('CZ_LandedName_G')]."
 tgp_china_yearly.0030.a: "S vděčností přijímám."
 tgp_china_yearly.0030.b: "Žel, mé vzdělání ještě není u konce."
