l_polish:
 debate_event.1000.t: "Příprava scény"
 debate_event.1000.desc_intro_host: "Učenci z celého panství se sjeli"
 debate_event.1000.desc_intro_fallback: "[Select_CString(ROOT.Char.IsFemale,'Dorazila jsem','Dorazil jsem')]"
 debate_event.1000.desc_outro: "na debatu do [CZProvName(ROOT.Char.GetCurrentLocation,'G')].\n\nÚčastníci už v hloučcích procvičují své proslovy, významné rody se předhánějí v obsazování nejlepších ubytovacích prostor a směrem k tržišti hlučně drkotá dlouhý průvod vozů naložených zeleninou a masem.\n\nJe načase, abych se také [Select_CString(ROOT.Char.IsFemale,'připravila','připravil')]."
 debate_event.1000.a: "Není času nazbyt!"
 debate_event.1000.a.success_desc: "Vynikající přípravy"
 debate_event.1000.b: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych si prohlédnout město."
 debate_event.1000.c: "Ideální příležitost k odpočinku."
 debate_event.1010.t: "Debata začíná"
 debate_event.1010.desc: "Do debatního sálu proudí učenci následovaní svými učedníky, kteří se pod tíhou objemných svitků sotva drží na nohou. Na opačném konci sálu už čeká [debate_opponent.GetTitledFirstName], obklopená družinou dalších členů hnutí [opponent_movement.GetName].\n\nČas příprav skončil. Chci-li v této debatě uspět, musím se nyní spolehnout především na vlastní důvtip."
 debate_event.1010.a: "Teď přijde má chvíle."
 debate_event.1015.t: "$debate_event.1010.t$"
 debate_event.1015.desc: "Prodírám se davem v naději, že najdu dobré místo, odkud budu moci sledovat nadcházející debatu. Hnutí [my_movement.GetName] obsadilo jeden konec sálu. Po chvíli strkání a tichého reptání se konečně ocitám mezi svými.\n\n[debate_contender.GetTitledFirstName] a [debate_opponent.GetTitledFirstName] stojí proti sobě, připraveni rozhodnout, kdo získá "
 debate_event.1015.desc_favor: "přízeň [ROOT.Char.GetTopLiege.Custom('CZ_TitleAsNameNoTooltip_G')]."
 debate_event.1015.desc_leadership: "vedení hnutí [contender_movement.GetNameNoTooltip]."
 debate_event.1015.a: "Kdopak asi zvítězí?"
 debate_event.1100.t: "Zrušená debata"
 debate_event.1100.desc_death: "Zdá se, že [debate_opponent.GetTitledFirstName] [Select_CString(debate_opponent.IsFemale,'zemřela','zemřel')]. Protože už nemám s kým debatovat, byla debata zrušena."
 debate_event.1100.desc_fallback: "Právě ke mně dorazila zpráva, že debata byla odložena. Důvod zůstává nejasný. Jisté je pouze to, že za současných okolností nemůže pokračovat."
 debate_event.1100.a: "To je nemilá zpráva."
 debate_event.2000.t: "Pošetilá pýcha"
 debate_event.2000.desc: "Zvýšené hlasy mě přilákají do jedné ze studoven. Uprostřed shromážděného davu spatřím [talent.GetTitledFirstName], [Select_CString(talent.IsFemale,'mou','mého')] [ROOT.Char.Custom2('CZ_RelationToMeShort_A', talent)], jak rozhořčeně gestikuluje směrem k přihlížejícím. „Nikdo z vás sem dnes nepřišel vést skutečnou učenou debatu! Chcete se jen chlubit a dokazovat, že jste lepší než ostatní!“\n\n[talent.GetTitledFirstNameNoTooltip|U] pronáší svá slova se stejným přesvědčením, jaké z [Select_CString(talent.IsFemale,'ní','něj')] cítím po celý den. Ve tváři se [Select_CString(talent.IsFemale,'jí','mu')] zračí sotva potlačované rozhořčení. [Select_CString(talent.IsFemale,'Tato žena','Tento muž')] nepochybně oplývá bystrým rozumem, ale tak prudká povaha by mohla být na obtíž."
 debate_event.2000.a: "Pod mým vedením [Select_CString(talent.IsFemale,'její','jeho')] nadání rozkvete."
 debate_event.2000.b: "[Select_CString(talent.IsFemale,'Její','Jeho')] slova by nás všechny měla vést k pokoře."
 debate_event.2010.t: "Vliv hnutí [elder_movement.GetNameNoTooltip]"
 debate_event.2010.desc: "„Musím říct, že mě tvůj výklad textu [ROOT.Char.Custom('GetRandomHistoryPassage')] skutečně zaujal,“ svěřuje se mi [elder.GetTitledFirstName] na sklonku dlouhého dne plného přátelských rozprav. „Jsem [Select_CString(elder.IsFemale,'přesvědčená','přesvědčený')], že pokud odložíme své rozdílné názory, můžeme se od sebe mnohému naučit.“\n\nPříjemná atmosféra našich rozhovorů mi často dává zapomenout, že [elder.GetTitledFirstNameNoTooltip] patří k hnutí [elder_movement.GetNameNoTooltip]. Tuto skutečnost mi však záhy připomene jeden z členů hnutí [my_movement.GetNameNoTooltip], když po mně vrhne významný pohled."
 debate_event.2010.a: "„Naprosto souhlasím.“"
 debate_event.2010.b: "„Některé rozdíly nelze jen tak přehlížet.“"
 debate_event.2020.t: "Přátelská setkání"
 debate_event.2020.desc: "Přichází ke mně [movement_member.GetTitledFirstName], rovněž z hnutí [my_movement.GetName], a přivádí s sebou shrbeného muže, který na pozdrav uctivě sklání hlavu. „Doslechlo se ke mně, že hledáš nadané lidi do své družiny,“ začíná [movement_member.GetFirstNameNoTooltip]. „Domnívám se, že [disciple.GetTitledFirstName] by mohl být vhodným kandidátem.“\n\n[disciple.GetFirstNameNoTooltip] [disciple.Custom('quirk_pos_present')] a pronese: „Bylo by mi ctí ti sloužit, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')].“"
 debate_event.2020.a: "„Mohu [Select_CString(disciple.IsFemale,'ji','ho')] mnohému naučit.“"
 debate_event.2020.b: "„Žádám jen o tvé přátelství.“"
 friend_given_disciple_reason: "[CZProDrop(CHARACTER,'získala','získal')|U] na debatě učedníka od [TARGET_CHARACTER.Custom('CZ_ShortUIName_G')]."
 friend_given_disciple_reason_corresponding: "$friend_given_disciple_reason$"
 debate_event.5000.t_imperial_debate: "Císařská přízeň"
 debate_event.5000.t_movement_debate: "Vedení hnutí [host.Custom('GetMyMovementNoTooltip')]"
 debate_event.5000.desc_imperial: "Podél stěn debatního sálu stojí hodnostáři a přihlížející, jejichž zraky mě sledují, když předstupuji před [debate_opponent.Custom('CZ_TitledFirstName_A')]. Současně se jeden druhému hluboce ukloníme s pažemi nataženými vpřed a zády ohnutými v uctivém předklonu.\n\nMusím se chopit příležitosti a jako první přednést svůj argument."
 debate_event.5000.desc: "Vše je připraveno a diváci už zaujali svá místa. [debate_opponent.GetTitledFirstName|U] povstává ze svého sedadla a obrací se ke shromáždění našich druhů z hnutí [host.Custom('GetMyMovement')].\n\n„Sešli jsme se, abychom projednali priority a další směřování hnutí [host.Custom('GetMyMovement')]. Výsledek této debaty také rozhodne o tom, kdo jej povede.“"
 debate_event.5000.a: "Budu vládnout podle Konfuciových zásad."
 debate_event.5000.b: "Dnes zvítězí logika a rozum."
 debate_event.5000.c: "Nuže dobrá. #EMP Nyní#! nastal čas..."
 debate_event.5000.d: "Tvá neschopnost vést nás přivede do záhuby!"
 debate_event.5000.a.flavor: "Využiješ své zkušenosti s [Concept('trait','rysem')|E] [GetTrait('confucian_education').GetName( GetNullCharacter )]. Čím více zkušeností máš, tím vyšší je tvá šance na úspěch"
 debate_event.5000.c.flavor: "Podle tvých pokynů se [Concept('disciples','učedníci')|E] pokusí ve vhodných chvílích rozvášnit přihlížející. Nezbývá než doufat, že jim plány nepřekazí také učedníci, které vede [debate_opponent.GetShortUIName]..."
 debate_event.5000.d.success_desc: "Podaří se ti přednést přesvědčivé argumenty"
 debate_event.5000.d.failure_desc: "Nepodaří se ti přednést přesvědčivý argument"
 debate_event.5010.insult_desc: "[debate_opponent.GetTitledFirstName|U] neztrácí čas a okamžitě spustí příval obvinění a urážek. Prý právě #EMP já#! nemám předpoklady k tomu, abych vedl hnutí.\n\nNesmysly! Nic než podlý pokus podkopat mou autoritu."
 debate_event.5010.confucian_desc: "[debate_opponent.GetTitledFirstName|U] klidně hovoří o Konfuciovi a o tom, jak by nás jeho učení mělo vést kupředu."
 debate_event.5010.desc: "[debate_opponent.GetTitledFirstName|U] rozmlouvá o logice a rozumu a o tom, jak bychom měli využít poznatky minulých generací k utváření nové budoucnosti našeho panství."
 debate_event.crowd_approval_desc: "\n\nPřihlížející souhlasně přikyvují."
 debate_event.crowd_disapproval_desc: "\n\nPřihlížející nesouhlasně vrtí hlavami."
 debate_event.5010.a: "Musím ještě důrazněji prosazovat svůj dosavadní přístup."
 debate_event.5010.b: "Možná je přesvědčí Konfuciova slova?"
 debate_event.5010.c: "Rozumnější přístup by jim mohl otevřít oči."
 debate_event.5010.d: "Je načase zapojit mé učedníky."
 debate_event.5010.e: "Když selže všechno ostatní, urážky jistě zaberou."
 debate_event.5100.t_winner: "– Vítězství!"
 debate_event.5100.t_loser: "– Porážka!"
 debate_event.5100.desc_winner: "Pečlivá příprava a mistrovské provedení přinesly své ovoce. Bylo vyhlášeno mé vítězství v debatě!\n\n[debate_loser.GetTitledFirstName|U] se přede mnou stroze, avšak obřadně ukloní a poté promluví. „Nejspíš ti dlužím blahopřání. Ostatní se k tobě brzy začnou obracet jako ke svému vůdci. Žádám tě jen, abys tuto odpovědnost bral s nejvyšší vážností.“"
 debate_event.5100.desc_loser: "Přes veškeré mé úsilí bylo vítězství v debatě přisouzeno [debate_winner.Custom('CZ_TitledFirstName_D')]. [debate_winner.GetTitledFirstNameNoTooltip|U] tak nadále zůstane faktickou hlavou hnutí [my_movement.GetNameNoTooltip].\n\nPo záplavě blahopřání se konečně obrátí také ke mně.\n\n„Ne každý je předurčen k vedení ostatních. Ale nezoufej. Tvá chvíle možná ještě přijde.“"
 debate_event.5100.desc_unexpected_winner: "Naprosto nečekaný zvrat událostí! Za vítěze debaty bylo vyhlášeno #EMP mé jméno#!. [debate_loser.GetTitledFirstName|U] na mě nevěřícně hledí a já ten pohled opětuji. Na obou stranách zavládne stejné ohromení. Slyšeli jsme správně? Ano, skutečně!\n\nPo chvíli, kdy se [debate_loser.GetTitledFirstNameNoTooltip] viditelně snaží vzpamatovat z překvapení, ke mně [debate_loser.GetFirstNameNoTooltip] promluví. „Nejspíš ti dlužím blahopřání. Přesto si nedokážu představit, proč by tě kdokoli prohlásil za vítěze...“"
 debate_event.5100.desc_unexpected_loser: "Naprosto nečekaný zvrat událostí! Za #EMP vítěze#! debaty byl prohlášen [debate_winner.GetTitledFirstName]. [debate_winner.GetFirstNameNoTooltip|U] na mě nevěřícně hledí a já ten pohled opětuji. Na obou stranách zavládne stejné ohromení. Slyšeli jsme správně? Ano, skutečně!\n\nPo záplavě blahopřání se [debate_loser.GetFirstNameNoTooltip] ke mně obrátí, zatímco na tváři vítěze je stále patrné překvapení. „Podle mého názoru byl tvůj výkon obdivuhodný. I když se ti dnes z nějakého důvodu nepodařilo zvítězit.“"
 debate_event.5100.a: "Prozatím si vychutnám tuto chvíli."
 debate_event.5100.b: "Nezbývá než to zkusit znovu..."
 debate_event.5110.t: "– Volba vítěze"
 debate_event.5110.desc: "Oba soupeři si po dlouhou dobu vyměňují argumenty. Dovolávají se logiky, hovoří o budoucnosti panství a rozebírají vlastnosti správného vůdce. Nechybí ani občasná urážka.\n\nKdyž debata konečně skončí, zdá se, že [debate_winner.GetTitledFirstName] předvedl[Select_CString(debate_winner.IsFemale,'a','')] přesvědčivější argumentaci a vítězství by mělo právem připadnout [Select_CString(debate_winner.IsFemale,'jí','mu')].\n\nJako [ROOT.Char.GetTitleAsNameNoTooltip] však mám pravomoc určit vítěze podle vlastního uvážení."
 debate_event.5110.a: "[debate_winner.GetNameNoTooltip|U] skutečně [Select_CString(debate_winner.IsFemale,'zvítězila','zvítězil')]."
 debate_event.5110.a.tt: "Hnutí [winning_movement.GetNameNoTooltip] se stane [Concept('favored_movement','upřednostněným hnutím')|E]"
 debate_event.5110.b: "#EMP Vlastně#! si myslím, že [debate_loser.GetNameNoTooltip] [Select_CString(debate_loser.IsFemale,'zvítězila','zvítězil')]."
 debate_event.5120.desc_winner: "Po krátké přestávce hlasatel shrne průběh debaty. Ačkoli to neřekne přímo, z jeho slov je zřejmé, že vítězství patří mně. Konečné rozhodnutí však není v jeho rukou."
 debate_event.5120.desc_loser: "Po krátké přestávce hlasatel shrne průběh debaty. Ačkoli to neřekne přímo, z jeho slov je zřejmé, že vítězství patří [debate_winner.Custom('CZ_TitledFirstName_D')]."
 debate_event.5120.bridge_hegemon_available: "\n\nVšechny pohledy se upřou na [ROOT.Char.GetTopLiege.Custom('CZ_Name_A')]."
 debate_event.5120.bridge_fallback: "\n\nPosel okamžitě vyráží, aby o výsledku zpravil [ROOT.Char.GetTopLiege.Custom('CZ_TitleAsNameNoTooltip_A')]. Když se vrátí, oznamuje, že "
 debate_event.5120.desc_liege_confirm: "\n\n„Souhlasím. [debate_winner.GetFirstNameNoTooltip] si vítězství zaslouží. V debatě prokázal[Select_CString(debate_winner.IsFemale,'a','')] mimořádnou obratnost a důvtip.“"
 debate_event.5120.desc_liege_confirm_fallback: "císařský dvůr považuje hnutí [winning_movement.GetNameNoTooltip] za hodné přízně celé říše."
 debate_event.5120.desc_liege_intervene: "\n\n„Prohlašuji [declared_winner.Custom('CZ_TitledFirstName_A')] za vítěze dnešní debaty.“"
 debate_event.5120.a: "Těší mě, že to vidíš stejně, [Select_CString(ROOT.Char.GetTopLiege.IsFemale,'má paní','můj pane')]!"
 debate_event.5120.b: "Cože? Tedy... samozřejmě! Děkuji, [Select_CString(ROOT.Char.GetTopLiege.IsFemale,'má paní','můj pane')]!"
 debate_event.5120.c: "To je... zklamání."
 tgp_dynastic_cycle_decision_event.0082.a: "Naše postavení zůstává pevné. Prozatím."
 tgp_dynastic_cycle_decision_event.0082.b: "Uf! Už jsem si myslel, že je s námi konec."
 tgp_dynastic_cycle_decision_event.0082.c: "Jak jen [ROOT.Char.GetTopLiege.GetSheHe] [Select_CString(ROOT.Char.GetTopLiege.IsFemale,'mohla','mohl')] učinit takové rozhodnutí?!"
 debate_events.5100.opponent_tt: "Hnutí [opponent_movement.GetName] zaznamenalo pokles [movement_power_i][Concept('movement_power','síly hnutí')|E] o #N [EmptyScope.ScriptValue('event_decrease_movement_power_major_value')|0]#!"
 debate_increased_movement_power_major_effect_tooltip: "[movement_power_i][Concept('movement_power','Síla hnutí')|EU] [GetPlayer.Custom('GetMyMovement')] se zvýšila o [EmptyScope.ScriptValue('event_increase_movement_power_major_value')|+0]"
 debate_event.5130.desc_favor: "$debate_become_movement_leader_reward$"
 debate_event.5130.desc_leadership_won: "$debate_become_movement_leader_reward$"
 debate_event.5130.desc_leadership_defended: "$debate_remain_movement_leader_reward$"
