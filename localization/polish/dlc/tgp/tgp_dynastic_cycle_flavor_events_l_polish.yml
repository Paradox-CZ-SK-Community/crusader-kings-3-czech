l_polish:
 tgp_dynastic_cycle_events.0001.t: "Cesta vpřed"
 tgp_dynastic_cycle_events.0001.desc: "V zahradě panuje naprostý klid. Jen vánek občas zašustí listím. V tom tichu se mé myšlenky obracejí k panství a k současné éře, kterou nazýváme [my_situation.GetTopCurrentPhase.GetName|l].\n\nStačí jen vytrvat? Dokáže panství obstát, když ustrne stejně jako tato zahrada?\n\nČaj na podnose mého služebníka už dávno vychladl."
 tgp_dynastic_cycle_events.0001.aa: "Hnutí [my_movement.GetNameNoTooltip] nám přinese osvícení!"
 tgp_dynastic_cycle_events.0001.a: "Až přijde čas, bude dobré mít přátele..."
 tgp_dynastic_cycle_events.0001.a.potential_friend: "#EMP [Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych napsat dopis [potential_friend.Custom('CZ_TitledFirstNameNoTooltip_D')], na koho jiného se mohu spolehnout?#!\n"
 tgp_dynastic_cycle_events.0001.a.friend: "#EMP [Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych napsat dopis svému drahému příteli [friend.Custom('CZ_TitledFirstNameNoTooltip_D')].#!\n"
 tgp_dynastic_cycle_events.0001.b: "Čas pokročit vpřed nastal #EMP právě teď#!."
 tgp_dynastic_cycle_events.0001.c: "Nemůžeme žít jen pro budoucnost."
 friend_together_in_preparation: "[CZProDrop(CHARACTER,'poslala','poslal')|U] [TARGET_CHARACTER.Custom('CZ_ShortUIName_D')] dopis s příslibem, že až se do panství vrátí stabilita, budou stát při sobě."
 friend_together_in_preparation_corresponding: "[CZProDrop(TARGET_CHARACTER,'dostala','dostal')|U] dopis od [CHARACTER.Custom('CZ_ShortUIName_G')] s příslibem, že až nastane doba rozvoje, budou stát při sobě."
 tgp_advancement_focus_modifier: "Zaměření na rozvoj"
 tgp_advancement_focus_modifier_desc: "Tato postava se rozhodla soustředit na rozvoj svého panství a odsunout územní expanzi do pozadí."
 tgp_dynastic_cycle_events.0010.t: "Pod tlakem"
 tgp_dynastic_cycle_events.0010.desc: "Přišla za mnou [disciple.GetTitledFirstName], [Select_CString(disciple.IsFemale,'má učednice','můj učedník')]. Důvod návštěvy však není nijak radostný.\n\n„Mistře... naše panství je jako loď zmítaná bouří. Každý den přináší nové sváry a nové nepřátele. [my_situation.GetTopCurrentPhase.GetName|U] sílí. Nevím, co přinese zítřek ani jaký svět nás čeká.“\n\nNemohu si nevšimnout, jak se [Select_CString(disciple.IsFemale,'jí','mu')] třesou ruce."
 tgp_dynastic_cycle_events.0010.a: "„Nedovolím, aby někdo tvrdil, že [Select_CString(disciple.IsFemale,'učednice','učedník')] [Select_CString(disciple.IsFemale,ROOT.Char.Custom('CZ_FirstNamePossessiveNoTooltip_F'),ROOT.Char.Custom('CZ_FirstNamePossessiveNoTooltip_M'))] je [Select_CString(disciple.IsFemale,'slabá','slabý')]!“"
 tgp_dynastic_cycle_events.0010.b: "Ubohé dítě. Musím [Select_CString(disciple.IsFemale,'ji','ho')] utěšit."
 tgp_dynastic_cycle_events.0010.c: "„Právě těžkosti tě naučí nejvíc.“"
 tgp_dynastic_cycle_events.0020.t: "Hlad nezná zábrany"
 tgp_dynastic_cycle_events.0020.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], přináším zlé zprávy.“ Ke mně přistupuje [marshal.GetName], [Select_CString(marshal.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))], [marshal.Custom('quirk_pos_pp')].\n\n„Rolníci v hrabství [peasant_county.GetName] se uprostřed noci násilím vloupali do obilných sýpek. Kdybych mohl najmout více stráží, snad bychom je ještě dokázali vypátrat.“\n\nAni naše panství není ušetřeno toho, co přináší [my_situation.GetTopCurrentPhase.GetName|l]."
 tgp_dynastic_cycle_events.0020.a: "„Moji spolčenci je najdou. A #EMP zabijí#!.“"
 tgp_dynastic_cycle_events.0020.b: "„Najmi ty stráže!“"
 tgp_dynastic_cycle_events.0020.c: "Zoufalí lidé se uchylují k zoufalým činům."
 tgp_executed_peasants_county_modifier: "Popravení rolníci"
 tgp_executed_peasants_county_modifier_desc: "Obyvatelé tohoto hrabství nezapomněli, jak krutě bylo naloženo s jejich hladovějícími rolníky."
 tgp_dynastic_cycle_events.0030.t: "Změna směru"
 tgp_dynastic_cycle_events.0030.desc: "„#EMP Právě teď#! přichází čas, který nese jméno [my_situation.GetTopCurrentPhase.GetName]!“\n\nHřmotné kroky oznamují příchod [Select_CString(marshal.IsFemale,'mé','mého')] [ROOT.Char.Custom2('CZ_RelationToMeShort_G', SCOPE.sC('marshal'))] [marshal.Custom('CZ_Name_G')] mnohem výmluvněji než jakákoli slova.\n\n„Obdivuji tvou oddanost civilní správě, ale [my_situation.GetTopCurrentPhase.GetType.GetNameNoTooltip|l] si žádá odvahu! Vzpomeň si na příběh [ROOT.Char.Custom('GetRandomAnnalsPassage')] a postav se do čela našich vojsk!“"
 tgp_dynastic_cycle_events.0030.a: "Nastal čas odvážných činů!"
 tgp_dynastic_cycle_events.0030.b: "„[Select_CString(ROOT.Char.IsFemale,'Ráda','Rád')] se učím, ale měnit se nehodlám.“"
 tgp_dynastic_cycle_events.0030.c: "Není větší cti než působit jako civilní guvernér."
 tgp_dynastic_cycle_events.0040.t: "Cesta příležitostí"
 tgp_dynastic_cycle_events.0040.desc: "Do pracovny vstupuje [steward.GetTitledFirstName], [Select_CString(steward.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('steward'))], s úsměvem na tváři a několika mincemi v dlani.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], karavany ze západu přijíždějí stále častěji po obchodních cestách, které tvoří [silk_road_situation.GetName]. Kdybychom trochu investovali do lepšího napojení na tyto cesty, mohli bychom do našeho panství přivést bohatství mnoha království.“"
 tgp_dynastic_cycle_events.0040.a: "„Právě [my_situation.GetTopCurrentPhase.GetType.GetNameNoTooltip|l] nám nabízí ideální příležitost!“"
 tgp_dynastic_cycle_events.0040.b: "„Neztrácej ani okamžik!“"
 tgp_dynastic_cycle_events.0040.c: "Hedvábná stezka tu bude i nadále. S námi, nebo bez nás."
 tgp_silk_road_advancement_modifier: "Rozvoj Hedvábné stezky"
 tgp_silk_road_advancement_modifier_desc: "Tato postava investovala do Hedvábné stezky #EMP právě v pravý čas#!."
 tgp_dynastic_cycle_events.0050.t: "Obrat v přízni"
 tgp_dynastic_cycle_events.0050.desc: "Hnutí [favored_movement.GetName] si upevňuje svůj vliv na trůn a jeho představitelé stále výrazněji utvářejí politiku podle svých představ.\n\nMá-li se prosadit i má vlastní věc, musím nejprve otřást jejich pověstí. Veřejná debata by mohla změnit mínění dvora a možná přesvědčit i [top_liege.Custom('CZ_TitleAsNameNoTooltip_A')].\n\nVyzvat je však znamená riskovat potupu, pokud má slova neobstojí."
 tgp_dynastic_cycle_events.0050.a: "Nemohu si dovolit pochybovat."
 tgp_dynastic_cycle_events.0050.b: "Hnutí [my_movement.GetNameNoTooltip] prokáže své vlastní přednosti."
 tgp_dynastic_cycle_events.0050.c: "Proč bych měl kvůli hnutí riskovat vlastní důstojnost?"
 tgp_debate_discount_var_tt: "Během příštích #V 5 let#! můžeš uspořádat [Concept('activity','aktivitu')|E] [CZActivity('activity_debate','A')] se slevou #P 25%#!"
 tgp_debate_discount_var_desc: "Z události"
