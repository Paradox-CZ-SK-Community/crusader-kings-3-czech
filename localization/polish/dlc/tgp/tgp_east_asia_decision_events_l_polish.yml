l_polish:
 tgp_east_asia_decision_events.0010.t: "Nové obzory"
 tgp_east_asia_decision_events.0010.desc: "Osvícení někdy přichází z těch nejnečekanějších míst.\n\nZpůsob vlády mandaly ve mně probouzí cosi... nadpozemského. Má existence přece musí sloužit vznešenějšímu účelu: sjednotit celé panství pod mou božskou a laskavou vládou.\n\n#EMP „Sláva dévarádžovi [ROOT.Char.Custom('CZ_FirstNameNoTooltip_D')]!“#! To zní vskutku nádherně..."
 tgp_east_asia_decision_events.0010.a: "#EMP Toto#! bude mé první nařízení."
 tgp_east_asia_decision_events.0010.b: "Država [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] si #EMP zatím#! nezaslouží chrám..."
 tgp_east_asia_decision_events.0010.b_temple_citadel: "Mé hlavní sídlo [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] se už pyšní velkolepým chrámem!"
 all_tribal_holdings_will_change_to_citadels: "Všechny [Concept('tribal_holdings','kmenové državy')|E] v panství se změní na [Concept('temple_citadel_holdings','državy chrámových citadel')|E]"
 realm_capital_will_change_to_citadel: "[Concept('holding','Država')|EU] v [Concept('realm_capital','hlavním sídle panství')|E] se změní na [Concept('temple_citadel_holding','državu chrámové citadely')|E]"
 tgp_east_asia_decision_events.0015.opening: "[overlord.Custom2('AppropriateGreeting', ROOT.Char)|U]"
 tgp_east_asia_decision_events.0015.desc: "[Select_CString(ROOT.Char.IsFemale,'Odhalila','Odhalil')|U] jsem, že má existence slouží vyššímu účelu.\n\nPřidej se ke mně a vzdej hold svému novému dévarádžovi!"
 tgp_east_asia_decision_events.0015.a: "Co všechno by to mohlo přinést..."
 tgp_east_asia_decision_events.0020.t: "Můj dévarádža"
 tgp_east_asia_decision_events.0020.desc: "[Select_CString(ROOT.Char.IsFemale,'Spatřila','Spatřil')|U] jsem znamení. Vím, co je správné. Ať už má tento svět jakoukoli podobu, vždy budu stát po boku [overlord.Custom('CZ_TitledFirstName_G')] a podporovat [Select_CString(overlord.IsFemale,'její','jeho')] blahodárnou vládu nad tímto světem.\n\nPřizpůsobíme se a budeme následovat svého božského pastýře vstříc zářné budoucnosti.\n\n#EMP Sláva dévarádžovi [overlord.Custom('CZ_FirstNameNoTooltip_D')]!#!"
 tgp_east_asia_decision_events.0020.close_family_pre_tt: "Členové [Concept('close_family','blízké rodiny')|E] přestoupí k víře #V [GetPlayer.GetOverlord.GetFaith.GetTextIcon][GetPlayer.GetOverlord.GetFaith.GetName]#!"
 tgp_east_asia_decision_events.0020.close_family_post_tt: "Členové [Concept('close_family','blízké rodiny')|E] přestoupili k víře #V [GetPlayer.GetOverlord.GetFaith.GetTextIcon][GetPlayer.GetOverlord.GetFaith.GetName]#!"
 tgp_east_asia_decision_events.0020.a: "Sláva!"
 tgp_east_asia_decision_events.0020.b: "$tgp_east_asia_decision_events.0010.b$"
 tgp_east_asia_decision_events.0025.opening: "[liege.Custom2('AppropriateGreeting', ROOT.Char)|U]"
 tgp_east_asia_decision_events.0025.desc: "Nedokážu si představit svět, v němž bych [Select_CString(ROOT.Char.IsFemale,'nepodporovala','nepodporoval')] [overlord.Custom('CZ_TitledFirstName_A')] a [Select_CString(overlord.IsFemale,'její','jeho')] blahodárnou vládu nad tímto světem.\n\nSláva [overlord.Custom('CZ_TitledFirstName_D')]!"
 tgp_east_asia_decision_events.0025.a: "$tgp_east_asia_decision_events.0015.a$"
 tgp_east_asia_decision_events.0030.t: "Přijetí klanových zvyklostí"
 tgp_east_asia_decision_events.0030.desc: "Píše mi [liege.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', ROOT.Char.GetLiege)]. Ve svém dopise oznamuje nedávnou změnu způsobu vlády a vyzývá nás, abychom se novému uspořádání přizpůsobili a podpořili svého vládce.\n\nJako [Select_CString(ROOT.Char.IsFemale,'právoplatná vazalka','právoplatný vazal')] [liege.Custom('CZ_TitleAsNameNoTooltip_G')] mám povinnost se podřídit."
 tgp_east_asia_decision_events.0030.a: "Obraťme tuto změnu ve svůj prospěch."
 realm_capital_will_change_to_castle: "[Concept('holding','Država')|EU] v [Concept('realm_capital','hlavním sídle panství')|E] se změní na [Concept('castle_holding','hradní državu')|E]"
 tgp_east_asia_decision_events.0100.t: "Odměna za oddanost"
 tgp_east_asia_decision_events.0100.desc: "Naše láska k božskému dévarádžovi [overlord.Custom('CZ_FirstNameNoTooltip_D')] nezná hranic.\n\n[Select_CString(overlord.IsFemale,'Naše','Náš')|U] [overlord.GetLadyLord] #EMP přesahuje možnosti smrtelníků#! a ví všechno, ať už na panovnickém dvoře, nebo na bitevním poli.\n\nNaše pochybnosti, naše zaváhání... Vše je odpuštěno, vše rozptýleno. Mezi námi skutečně kráčí nebeská bytost.\n\n[Select_CString(ROOT.Char.IsFemale,'Věděla','Věděl')|U] jsem to od samého začátku."
 tgp_east_asia_decision_events.0100.a: "Kéž naše okvětní lístky nikdy neuvadnou ani neopadají."
 failed_assimilation_payout_msg: "Nenaplněné božství mandaly"
 failed_assimilation_payout_msg_desc: "Ty nebo [saved_devaraja.GetShortUIName], tvůj přislíbený dévarádža, jste nenaplnili očekávání spojená s božským postavením v mandale"
 invite_a_court_brahmin_decision: "Hledat uchazeče o úřad $court_brahmin_court_position$"
 invite_a_court_brahmin_decision_desc: "Dvorní bráhman je mocným spojencem. Pečuje o vztahy s tributáři a v těžkých časech slouží jako morální kompas."
 invite_a_court_brahmin_decision_tooltip: "Tví služebníci ti navrhnou několik vhodných kandidátů na úřad [GetCourtPositionType('court_brahmin_court_position').GetName()]"
 tgp_east_asia_decision_events.0200.t: "Bráhman na dvoře"
 tgp_east_asia_decision_events.0200.desc: "Zvěst o mém hledání se roznesla široko daleko a konečně jsou na můj dvůr uvedeni dva duchovní vůdci.\n\n[great_brahmin_option.GetTitledFirstName|U] vyzařuje hluboký vnitřní klid a na chvíli se ponoří do tichého rozjímání. O něco méně [Select_CString(good_brahmin_option.IsFemale,'zkušená','zkušený')] [good_brahmin_option.GetTitledFirstName] se naproti tomu nadšeně rozhlíží po sále a zjevně se nemůže dočkat, až se ujme svých povinností."
 tgp_east_asia_decision_events.0200.a: "[great_brahmin_option.GetTitledFirstNameNoTooltip|U] bude pro můj dvůr skvělou posilou."
 tgp_east_asia_decision_events.0200.a.aptitude: "[great_brahmin_option.Custom('CZ_FirstNamePossessiveNoTooltip_F')|U] [Concept('aptitude','způsobilost')|E] je [great_brahmin_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_brahmin_court_position' ) )]"
 tgp_east_asia_decision_events.0200.b: "Věřím, že [good_brahmin_option.GetTitledFirstNameNoTooltip] má velký potenciál."
 tgp_east_asia_decision_events.0200.b.aptitude: "[good_brahmin_option.Custom('CZ_FirstNamePossessiveNoTooltip_F')|U] [Concept('aptitude','způsobilost')|E] je [good_brahmin_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_brahmin_court_position' ) )]"
 tgp_east_asia_decision_events.0200.c: "Ani jeden mě příliš neoslovil."
 invite_a_khlon_glan_decision: "Hledat uchazeče o úřad $khlon_glan_court_position$"
 invite_a_khlon_glan_decision_desc: "Je načase najít schopného khlon glana, který mi pomůže s rozvojem hlavního sídla, správou našich území a organizací dvora."
 invite_a_khlon_glan_decision_tooltip: "Tví služebníci ti navrhnou několik vhodných kandidátů na úřad [GetCourtPositionType('khlon_glan_court_position').GetName()]"
 tgp_east_asia_decision_events.0210.t: "Khlon Glan"
 tgp_east_asia_decision_events.0210.desc: "Mé pátrání po věrném khlon glanovi konečně přineslo ovoce. U mých dveří se objevují [great_khlon_glan_option.GetTitledFirstName] a [good_khlon_glan_option.GetTitledFirstName].\n\nScházíme se ve zbrojnici, kde se bude odehrávat značná část jejich práce.\n\n[great_khlon_glan_option.GetTitledFirstNameNoTooltip|U] dokáže zkušeným pohledem téměř okamžitě posoudit stav zásob. Naproti tomu [good_khlon_glan_option.GetTitledFirstNameNoTooltip] potřebuje několik dlouhých okamžiků, než se v místnosti vůbec zorientuje."
 tgp_east_asia_decision_events.0210.a: "Rozumnější volbou bude [great_khlon_glan_option.GetTitledFirstNameNoTooltip]."
 tgp_east_asia_decision_events.0210.a.aptitude: "[great_khlon_glan_option.Custom('CZ_FirstNamePossessiveNoTooltip_F')|U] [Concept('aptitude','způsobilost')|E] je [great_khlon_glan_option.GetCourtPositionAptitude( GetCourtPositionType( 'khlon_glan_court_position' ) )]"
 tgp_east_asia_decision_events.0210.b: "[good_khlon_glan_option.GetTitledFirstNameNoTooltip|U] se může stát užitečnou posilou."
 tgp_east_asia_decision_events.0210.b.aptitude: "[good_khlon_glan_option.Custom('CZ_FirstNamePossessiveNoTooltip_F')|U] [Concept('aptitude','způsobilost')|E] je [good_khlon_glan_option.GetCourtPositionAptitude( GetCourtPositionType( 'khlon_glan_court_position' ) )]"
 tgp_east_asia_decision_events.0210.c: "$tgp_east_asia_decision_events.0200.c$"
 tgp_east_asia_decision_events.0300.t: "Květy z [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]"
 tgp_east_asia_decision_events.0300.desc: "Místní [Select_CString(local_artisan.IsFemale,'řemeslnice','řemeslník')] [local_artisan.GetTitledFirstName] ke mně přichází s nadšením a pružným krokem. „[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Bunga mas je konečně hotové!“ Pak mě nedočkavě zve do své dílny.\n\nNa pracovním stole spatřím úchvatné dílo: dva stromky v plném květu. Dokonale vyleštěné zlato a stříbro se nádherně blyští a jemné lístky i větvičky vynikají neobyčejnou propracovaností."
 tgp_east_asia_decision_events.0300.outro: "\n\nS uměřeným uznáním přikývnu. „Dobrá práce, [local_artisan.Custom('CZ_TitledFirstNameNoTooltip_V')].“"
 tgp_east_asia_decision_events.0300.outro.masterwork: "\n\nNakloním se blíž a se zalíbením si prohlížím každičký detail propracované kůry. Uznale přikývnu. „Působivé, [local_artisan.Custom('CZ_TitledFirstNameNoTooltip_V')].“"
 tgp_east_asia_decision_events.0300.outro.famed: "\n\nDopřeji si chvíli, abych se [Select_CString(ROOT.Char.IsFemale,'pokochala','pokochal')] vzácnými rytinami a nádhernými květy. „To je překrásné, [local_artisan.Custom('CZ_TitledFirstNameNoTooltip_V')]!“"
 tgp_east_asia_decision_events.0300.outro.illustrious: "\n\nNa okamžik se mi zatají dech. Nádhera díla přede mnou mě doslova ohromí. „Neuvěřitelné, [local_artisan.Custom('CZ_TitledFirstNameNoTooltip_V')]!“"
 tgp_east_asia_decision_events.0300.a: "To bude více než dostačující."
 common_bunga_mas_desc.tt: "Při předání suzerénovi:\n$BULLET_WITH_TAB$Získáš #V 1#! stupeň modifikátoru [GetModifier('bunga_mas_tribute_modifier').GetNameWithTooltip]"
 masterwork_bunga_mas_desc.tt: "Při předání suzerénovi:\n$BULLET_WITH_TAB$Získáš až #V 2#! stupně modifikátoru [GetModifier('bunga_mas_tribute_modifier').GetNameWithTooltip]"
 famed_bunga_mas_desc.tt: "Při předání suzerénovi:\n$BULLET_WITH_TAB$Získáš #V 2#! stupně modifikátoru [GetModifier('bunga_mas_tribute_modifier').GetNameWithTooltip]"
 illustrious_bunga_mas_desc.tt: "Při předání suzerénovi:\n$BULLET_WITH_TAB$Získáš #V 3#! stupně modifikátoru [GetModifier('bunga_mas_tribute_modifier').GetNameWithTooltip]"
 bunga_mas: "Zlaté květy ze sídla [ROOT.Char.GetLiege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]"
 common_bunga_mas_desc: "Obyčejné [Glossary( 'bunga mas', 'BUNGA_MAS_GLOSS' )] vyrobené ze zlata a stříbra. Květy navždy zachycené v plném rozkvětu nádherně odrážejí dopadající světlo."
 masterwork_bunga_mas_desc: "Krásně zpracované [Glossary( 'bunga mas', 'BUNGA_MAS_GLOSS' )] ze zlata a stříbra. Každičký detail je pečlivě propracovaný, od jemných žilek až po křehké lístky, které svou něžností působí téměř průsvitně."
 famed_bunga_mas_desc: "Mistrovsky zhotovené květy a jemné rytiny zdobící větve. Stromek ze zlata a stříbra, známý jako [Glossary( 'bunga mas', 'BUNGA_MAS_GLOSS' )], jehož krása nenechá nikoho chladným."
 illustrious_bunga_mas_desc: "Tyto nádherné zlaté a stříbrné stromky, známé jako [Glossary( 'bunga mas', 'BUNGA_MAS_GLOSS' )], jsou skutečnou pastvou pro oči. Každá rytina je dokonale propracovaná, každý lístek neuvěřitelně jemný. Jako by někdo ponořil živé stromy do roztavených drahých kovů a navždy uchoval jejich krásu."
