 visit_local_shrine_decision: "Vykonat obětní obřad"
 visit_local_shrine_decision_desc: "Abychom prokázali svou skutečnou oddanost, nemusíme putovat daleko. Stačí krátká cesta do nedaleké svatyně a přinesení oběti, abychom si na dlouhou dobu zajistili přízeň božských sil."
 visit_local_shrine_decision_confirm: "Nechť cesta započne"
 sacrifice_to_heaven: "Vykonáš náboženskou pouť do některé z oblastních svatyní a přineseš oběť v podobě [gold_i][Concept('gold','zlata')|E] nebo [prestige_i][Concept('prestige','prestiže')|E] výměnou za [Concept('piety','zbožnost')|E]"
 local_rites.1.t: "Posvátná cesta"
 local_rites.1.desc: "Posvátnou oběť lze přinést v kterémkoli chrámu, dokonce i v naší místní svatyni v oblasti [capital_location.GetNameNoTooltip]. Je však zřejmé, že ne všechna posvátná místa mají stejný význam.\n\nNávštěva některého z významných chrámových společenství by sice zabrala mnoho času, ale jistě by zanechala mnohem větší dojem."
 local_rites.1.home: "Naše vlastní svatyně postačí."
 local_rites.1.home.tt: "Oběť v místní svatyni v oblasti [tooltip_loc.GetNameNoTooltip] tě ušetří cesty.\nOběť zde tě bude stát [gold_i][THIS.ScriptValue('miniscule_gold_value')|-0] a přinese ti [piety_i][THIS.ScriptValue('minor_piety_gain')|+0]"
 local_rites.1.mount_tai: "Musím vykonat obětní obřad na hoře Tchaj-šan."
 local_rites.1.fengshan.tt: "Mimořádně významná oběť, kterou lze vykonat pouze jednou za dynastii.\nOběť tě bude stát [treasury_i][THIS.ScriptValue('major_treasury_value')|-0] a [prestige_i][THIS.ScriptValue('massive_prestige_value')|-0] a přinese ti [piety_i][THIS.ScriptValue('major_piety_gain')|+0] a [legitimacy_i][THIS.ScriptValue('massive_legitimacy_gain')|+0]"
 local_rites.1.major_shrine: "Svatyně v oblasti [point_of_interest_location.GetNameNoTooltip]"
 local_rites.1.major_shrine.tt: "Oběť zde tě bude stát [gold_i][THIS.ScriptValue('medium_gold_value')|-0] nebo [prestige_i][THIS.ScriptValue('medium_prestige_value')|-0] a přinese ti [piety_i][THIS.ScriptValue('major_piety_gain')|+0]"
 local_rites.1.normal.tt: "Oběť zde tě bude stát [gold_i][THIS.ScriptValue('minor_gold_value')|-0] nebo [prestige_i][THIS.ScriptValue('minor_prestige_value')|-0] a přinese ti [piety_i][THIS.ScriptValue('medium_piety_gain')|+0]"
 local_rites.1.hills: "Svatyně mezi zvlněnými kopci v oblasti [hills_location.GetNameNoTooltip]"
 local_rites.1.forest: "Lesní chrámy v oblasti [forest_location.GetNameNoTooltip]"
 local_rites.1.mountains: "Horské svatyně v oblasti [mountains_location.GetNameNoTooltip]"
 local_rites.1.temple_holding: "Chrám v oblasti [temple_holding_location.GetNameNoTooltip]"
 local_rites.2.toast: "Dorazil jsi do svatyně"
 local_rites.3.t: "Oběť Nebesům"
 local_rites.3.t.fengshan: "Feng a Šan"
 local_rites.3.fallback.t: "Oběť bohům"
 local_rites.3.desc_mt_tai_huangdi: "Jen málokdo byl svědkem obřadu feng-šan na hoře Tchaj-šan, přesto téměř každý chápe jeho význam. Na samotném vrcholu hory byl z hlíny vztyčen nový oltář a hluboko pod ním byla na počest Země upravena obřadní plocha.\n\nVětšina mých předchůdců se nikdy nepokusila zprostředkovat spojení mezi Nebesy a Zemí. Jen zřídkakdy se naskytne taková příležitost zajistit budoucnost dynastie, jejíž říší je [GetTitleByKey('h_china').GetBaseNameNoTierNoTooltip]."
 local_rites.3.desc_important_shrine: "Svatyně v oblasti [shrine_location.GetName] jsou stejně působivé jako starobylé a jejich správci jsou zjevně zvyklí na vznešené návštěvníky. Když pohlédnu na posvátné místo, kde přede mnou vzdávalo úctu nespočet věřících, prostoupí mě hluboká posvátná bázeň.\n\n„Podpora štědrých dobrodinců je pro zachování takových posvátných míst nesmírně důležitá. Návštěvníci často přispívají na potřeby zdejšího mnišského společenství.“ [companion.GetName] se na mě zdvořile, avšak poněkud tázavě zadívá."
 local_rites.3.desc_at_home: "Oběť v rodové svatyni v oblasti [shrine_location.GetName] možná nepůsobí tak velkolepě jako obřad ve významném chrámu, ale jako projev oddanosti může mít stejně hluboký význam.\n\nKdyž přináším rituální oběť, prostupuje mě vnitřní klid, jaký jsem už dlouho nepocítil."
 local_rites.3.desc_mountain_shrine: "Výstup po nesčetných schodech ke svatyni na vrcholu hory v oblasti [shrine_location.GetName] je namáhavý, ale zároveň poskytuje dostatek času k rozjímání. Na tuto pouť budu nejspíš vzpomínat ještě dlouho poté, co dokončím svůj obětní obřad.\n\nKdyž konečně dosáhneme vrcholu, [companion.GetName] se ke mně obrátí. „Udržovat takové místo v dobrém stavu je obdivuhodné. Možná bychom mohli zdejší mnichy nějak podpořit? Je to ostatně zvykem.“"
 local_rites.3.desc_hills_shrine: "Zvlněná krajina v oblasti [shrine_location.GetName] je překrásná. Než dorazíme ke svatyni, kde hodlám přinést oběť, pocítím vnitřní klid, který mi poslední dobou tolik scházel.\n\nKdyž vystoupám na poslední chrámový schod, [companion.GetNameNo] ke mně obrátí svůj pohled. „O tuto svatyni pečuje malé místní společenství. Neměli bychom mu nějak projevit svou podporu?“"
 local_rites.3.desc_forest_shrine: "Cesta k malé svatyni v oblasti [shrine_location.GetName] nás vede dlouhým úsekem pod korunami stromů. Sotva si dokážu představit pokojnější a konejšivější prostředí. Už teď tuším, že na tento okamžik budu vzpomínat ještě dlouho po skončení pouti.\n\n„Měli bychom zvážit, zda nepodpořit zdejší společenství a nepomoci tak zajistit prosperitu této svatyně.“ Otočím se a spatřím, jak se na mě [companion.GetName] tázavě dívá."
 local_rites.3.desc_holding_shrine: "Po příchodu do svatyně v oblasti [shrine_location.GetName] se zamýšlím nad jejím posláním a významem. Existuje mnoho významnějších svatyní, to však nijak neubírá na příkladnosti zdejšího mnišského společenství. Úcta a oddanost všech, kdo zde žijí, jsou skutečně inspirující.\nKdyž se chystám k odchodu, [companion.GetName] se ke mně obrátí. „Toto je posvátné místo, a proto se mé myšlenky přirozeně obracejí k božským silám. Úctu si však zaslouží i ti, kdo svůj život zasvětili péči o tuto svatyni.“"
 local_rites.3.desc_cynical: "\n\nJen stěží dokážu skrýt své znechucení, ale nejspíš budu muset splnit, co se ode mě očekává."
 fengshan_option: "Z vůle Nebes!"
 local_rites.3.pay_gold: "Přispějme štědrým darem."
 local_rites.3.pay_prestige: "Nemohu nabídnout nic než svou oddanost."
 local_rites.3.pay_at_home: "„Budiž tedy.“"
 local_shrine.optout: "Volají mě světské povinnosti."
 local_shrine.optout.flavor: "Návštěvu svatyně si můžeš naplánovat i později"
 visit_local_shrine_modifier: "Vykonávání obřadu v místní svatyni"
 visit_local_shrine_modifier_desc: "Tato postava se právě věnuje přinášení rituální oběti ve svatyni."
 seize_mandala_capital_decision: "Zabrat chrámový komplex mandaly"
 seize_mandala_capital_decision_desc: "Přímo na dosah máme chrámový komplex hodný skutečného dévarádži? Měli bychom do něj přesídlit a odtud dále rozšiřovat svou mocenskou základnu. Vždyť to musí být v nejlepším zájmu všech věrných poddaných."
 seize_mandala_capital_decision_tooltip: "Zabereš chrámový komplex #V $building_type_mandala_capital_01$#! nacházející se ve tvém [Concept('de_jure_capital','de iure hlavním sídle')|E], který dosud ovládá některý z tvých [Concept('subject','podřízených subjektů')|E]"
 seize_mandala_capital_decision_confirm: "Vše je tak, jak má být."
 create_bunga_mas_decision: "Zhotovit Bunga Mas"
 create_bunga_mas_decision_tooltip: "Najmeš místního řemeslníka, aby pro tebe zhotovil [Concept('artifact','artefakt')|E] [Glossary( 'Bunga Mas', 'BUNGA_MAS_GLOSS' )]"
 create_bunga_mas_decision_desc: "Dva stromky zhotovené z nejjemnějšího zlata a stříbra – vzácný poklad přímo stvořený k odevzdání jako tribut. Dopravím je na dvůr svého suzeréna a nechám se zahalit jejich nádherou!"
 create_bunga_mas_decision_confirm: "Objednat Bunga Mas"
 create_bunga_mas_decision_effect: "Zhotovíš [Concept('artifact','artefakt')|E] [Glossary( 'Bunga Mas', 'BUNGA_MAS_GLOSS' )]\n$BULLET_WITH_TAB$Při předání suzerénovi:\n$TAB$$BULLET_WITH_TAB$Získáš stupně modifikátoru [GetModifier('bunga_mas_tribute_modifier').GetNameWithTooltip] #WEAK (maximálně 3)#!"
 create_bunga_mas_decision_effect_message: ""
 BUNGA_MAS_GLOSS: "Bunga Mas neboli Zlaté a stříbrné květy představovaly zvláštní formu tributu používanou na Malajském poloostrově. Tvořily je dva malé stromky zhotovené z nejkvalitnějšího zlata a stříbra."
