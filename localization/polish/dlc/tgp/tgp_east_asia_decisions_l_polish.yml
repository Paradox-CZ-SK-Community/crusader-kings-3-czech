 assimilate_to_mandala_decision: "Přizpůsobit se vládě mandaly"
 assimilate_to_mandala_decision_government_desc: "Po zemi kráčí samotné božstvo. Uspořádání jeho vlády může našemu bytí jedině prospět. Přizpůsobme se tomuto způsobu vládnutí a zjistěme, co se od něj můžeme naučit."
 assimilate_to_mandala_decision_faith_desc: "Stačí si tuto božskou bytost pořádně prohlédnout a následovat její příklad. Staneme-li se skutečnými vyznavači dévarádži, jistě povedeme naplněnější život. A kdo ví? Třeba se dokonce zařadíme mezi hrstku vyvolených..."
 assimilate_to_mandala_decision_desc: "Jsme pouzí smrtelníci, kterým vládne bytost stojící vysoko nad námi. Měli bychom se přizpůsobit jejím způsobům a stát se skutečnými oddanými dévarádži. Samozřejmě pro dobro našeho lidu."
