l_polish:
 game_concept_mandala: "Mandala"
 game_concept_mandala_desc: "Ve [Concept('government_form','formě vlády')|E] $game_concept_mandala$ je omezen [Concept('domain_limit','limit domény')|E] i počet [Concept('direct_vassals','přímých vazalů')|E]. [Concept('liege','Lenní pán')|EU] a [Concept('suzerain','suzerén')|E] se proto při rozšiřování svého panství spoléhají především na [Concept('tributaries','tributáře')|E].\n\nVládce mandaly může usilovat o postavení božského krále neboli dévarádži. $game_concept_tributaries$ se k němu pak přidávají a zůstávají mu věrní díky [Concept('mandala_radiance','záři mandaly')|E].\n\nAby si $game_concept_ruler$ dlouhodobě udržel přízeň tributářů ($game_concept_tributaries$), musí dbát na jejich [Concept('opinion','mínění')|E] a upevňovat vzájemné vztahy. Při nástupnictví se $game_concept_tributaries$ mohou odtrhnout, pokud se nový $game_concept_ruler$ neprokáže jako důstojný [Concept('mandala_succesor','nástupce dévarádži')|E]."
 game_concept_mandalas: "Mandaly"
 game_concept_mandala_government: "Vláda mandaly"
 game_concept_mandala_i: "@government_type_mandala!"
 game_concept_mandala_government_desc: "$game_concept_mandala_desc$"
 game_concept_mandala_succession: "Nástupnictví mandaly"
 game_concept_mandala_succession_succession: "Nástupnictví"
 game_concept_mandala_trials: "Zkoušky mandaly"
 game_concept_mandala_succesor: "Nástupce dévarádži"
 game_concept_mandala_succession_desc: "Když zemře [Concept('ruler','vládce')|E] [Concept('mandala','mandaly')|E], který si zvolil [Concept('mandala_aspect','aspekt mandaly')|E], čekají jeho [Concept('heir','dědice')|E] zkoušky $game_concept_mandala_succession$. V jejich průběhu musí dědic prokázat své [Concept('skill','dovednosti')|E] v oblasti zvoleného aspektu i dvou dalších aspektů.\n\nÚspěšné složení zkoušek znamená, že dědic přesvědčil své stoupence o tom, že je důstojným nástupcem, a [Concept('realm','panství')|E] zůstane stabilní.\n\n#EMP Neúspěch#! však přináší stále závažnější následky:\n\n#indent_newline:6 $BULLET_WITH_TAB$#bold 1#! neúspěšná zkouška: Ztráta jedné [Concept('piety_level','úrovně oddanosti')|E] a odtržení menšího počtu [Concept('tributaries','tributářů')|E].#!\n\n#indent_newline:6 $BULLET_WITH_TAB$#bold 2#! neúspěšné zkoušky: Ztráta dvou [Concept('piety_levels','úrovní oddanosti')|E] a odtržení všech [Concept('tributaries','tributářů')|E].#!\n\n#indent_newline:6 $BULLET_WITH_TAB$#bold Všechny#! zkoušky neúspěšné: Ztráta tří [Concept('piety_levels','úrovní oddanosti')|E] a rozpad [Concept('realm','panství')|E].#!"
 game_concept_mandala_radiance: "Záře mandaly"
 game_concept_radiance: "Záře"
 game_concept_radiant: "Zářivý"
 game_concept_mandala_radiance_desc: "Schopnost [Concept('ruler','vládce')|E] [Concept('mandala','mandaly')|E] přitahovat a udržovat si [Concept('subjects','podřízené subjekty')|E] se nazývá záře mandaly. Tvoří ji kombinace [Concept('piety_level','úrovně oddanosti')|E], úrovně [Concept('great_building','velkolepé budovy')|E] #V [GetBuilding('mandala_capital_01').GetTypeName]#! a úrovně [Concept('mandala_aspect','aspektu mandaly')|E].\n\nTi, kdo dokážou všechny tři složky rozvíjet a zvýšit svou záři, získají větší odměny, více [Concept('subjects','podřízených subjektů')|E] a také větší moc."
 game_concept_mandala_decree: "Nařízení mandaly"
 game_concept_mandala_decrees: "Nařízení mandaly"
 game_concept_mandala_decree_desc: "$game_concept_mandala_decrees$ představují trojici nařízení vydávaných [Concept('ruler','vládcem')|E] [Concept('mandala','mandaly')|E]. Zaměřují se na [Concept('prosperity_decree','prosperitu')|E], [Concept('expansion_decree','expanzi')|E] a [Concept('reverence_decree','úctu')|E].\n\nPanství mandaly se zpravidla vyznačuje silně centralizovanou mocí. [Concept('Ruler','Vládce')|E] má rozsáhlou pravomoc nad [Concept('subjects','podřízenými subjekty')|E] i [Concept('laws','zákony')|E] a může je podle potřeby měnit, aniž by narazil na výraznější odpor obyvatel."
 game_concept_decree: "Nařízení"
 game_concept_decrees: "Nařízení"
 game_concept_mandala_decree_prosperity: "Nařízení prosperity"
 game_concept_mandala_decree_prosperity_desc: "[GetLaw('mandala_decree_prosperity').GetName|U] vede [Concept('ruler','vládce')|E] [Concept('mandala','mandaly')|E] k podpoře a povzbuzování všech [Concept('subjects','podřízených subjektů')|E], aby uskutečňovali prospěšné změny.\n\nÚsilí se soustředí na zvyšování [Concept('development','rozvoje')|E], výstavbu [Concept('buildings','budov')|E], hromadění bohatství a posilování společenství prostřednictvím osobních vztahů."
 game_concept_prosperity_decree: "Prosperita"
 game_concept_mandala_decree_expansion: "Nařízení expanze"
 game_concept_mandala_decree_expansion_desc: "[GetLaw('mandala_decree_expansion').GetName|U] ukládá všem [Concept('subjects','podřízeným subjektům')|E], aby své úsilí zaměřili na rozšiřování [Concept('realm','panství')|E].\n\nZásadní je navyšování počtu vojáků, rozšiřování vojenského zázemí a podpora všech případných [Concept('wars','válek')|E], které zahájí [Concept('ruler','vládce')|E] [Concept('mandala','mandaly')|E]."
 game_concept_expansion_decree: "Expanze"
 game_concept_mandala_decree_reverence: "Nařízení úcty"
 game_concept_mandala_decree_reverence_desc: "[GetLaw('mandala_decree_reverence').GetName|U] ukládá [Concept('subjects','podřízeným subjektům')|E] [Concept('mandala','mandaly')|E], aby své úsilí věnovali prohlubování duchovního života a náboženské úcty.\n\n[Concept('pilgrimages','Poutě')|EU], rituály a [Concept('piety','zbožnost')|E] tvoří základní pilíře tohoto nařízení mandaly."
 game_concept_reverence_decree: "Úcta"
 game_concept_mandala_aspect: "Aspekt mandaly"
 game_concept_mandala_aspects: "Aspekty mandaly"
 game_concept_aspect: "Aspekt"
 game_concept_aspects: "Aspekty"
 game_concept_mandala_aspect_desc: "Aby [Concept('ruler','vládce')|E] [Concept('mandala','mandaly')|E] dosáhl věčné úcty a božského postavení, musí se ztotožnit s jedním z aspektů, které jej určují jako božstvo.\n\nDostupné aspekty jsou:\n$EFFECT_LIST_BULLET$[Concept('aspect_of_creation','Aspekt stvoření')|EU]\n$EFFECT_LIST_BULLET$[Concept('aspect_of_serenity','Aspekt klidu')|EU]\n$EFFECT_LIST_BULLET$[Concept('aspect_of_destruction','Aspekt zkázy')|EU]\n$EFFECT_LIST_BULLET$[Concept('aspect_of_trickery','Aspekt lstivosti')|EU]\n\nTyto aspekty ovlivňují očekávání kladená na vládce i činy, které může vykonávat."
 game_concept_aspect_of_creation: "Aspekt stvoření"
 game_concept_aspect_of_creation_desc: "Aspekt stvoření slibuje vyšší produkci a hojnost pro své stoupence. Poskytuje proto bonusy k hospodářským a organizačním činnostem.\n$EFFECT_LIST_BULLET$Zaměřuje se na [Concept('stewardship','správcovství')|E]\n$EFFECT_LIST_BULLET$Navazující výstavba přidává další stupně modifikátoru [GetModifier( 'mandala_creator_modifier' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$Běžná výstavba přináší [Concept('piety','zbožnost')|E]\n$EFFECT_LIST_BULLET$Výchova [Concept('legitimate','legitimních')|E] [Concept('children','dětí')|E] přináší [Concept('piety','zbožnost')|E]\n$EFFECT_LIST_BULLET$Umožňuje používat [Concept('scheme','intriku')|E] #high [GetScheme('coerce_contribution').GetTypeName]#!\n$EFFECT_LIST_BULLET$Možné [Concept('character_death_deaths','druhy smrti')|E]: pouze [Concept('death_natural_cause','přirozená smrt')|E] nebo [Concept('death_religious','náboženská smrt')|E]"
 game_concept_aspect_of_serenity: "Aspekt klidu"
 game_concept_aspect_of_serenity_desc: "Pokojné panství je prosperující panství. Aspekt klidu si cení míru a diplomatického jednání a odměňuje ty, kdo se řídí jeho zásadami.\n$EFFECT_LIST_BULLET$Zaměřuje se na [Concept('diplomacy','diplomacii')|E]\n$EFFECT_LIST_BULLET$Vyhýbání se útočným [Concept('wars','válkám')|E] přidává další stupně modifikátoru [GetModifier( 'mandala_increments_of_peace_modifier' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[Concept('schemes','Intriky')|EU] [GetScheme('sway').GetTypeName] a [GetScheme('befriend').GetTypeName] mají vyšší šanci na úspěch\n$EFFECT_LIST_BULLET$Umožňuje také využít #high $request_great_project_contribution_interaction$#! vůči [Concept('allies','spojencům')|E]\n$EFFECT_LIST_BULLET$Možné [Concept('character_death_deaths','druhy smrti')|E]: pouze [Concept('death_natural_cause','přirozená smrt')|E] nebo [Concept('death_religious','náboženská smrt')|E]"
 game_concept_aspect_of_destruction: "Aspekt zkázy"
 game_concept_aspect_of_destruction_desc: "Strach a hrůza jsou nástroji vlády. Skutečná moc spočívá ve schopnosti brát život. Aspekt zkázy poskytuje bonusy těm, kdo rozdělují a dobývají.\n$EFFECT_LIST_BULLET$Zaměřuje se na [Concept('martial','válečnictví')|E]\n$EFFECT_LIST_BULLET$Poskytuje bonusy k vojenským modifikátorům\n$EFFECT_LIST_BULLET$Umožňuje použít [Concept('casus_belli','důvod k válce')|E] #high [GetCasusBelliType('mandala_plunder_cb').GetName]#!\n$EFFECT_LIST_BULLET$Možné [Concept('character_death_deaths','druhy smrti')|E]: pouze [Concept('death_natural_cause','přirozená smrt')|E], [Concept('death_religious','náboženská smrt')|E] nebo [Concept('death_combat','smrt v boji')|E]"
 game_concept_aspect_of_trickery: "Aspekt lstivosti"
 game_concept_aspect_of_trickery_desc: "Ať už laskavě, nebo lstivě, aspekt lstivosti odměňuje schopnost ovládat ostatní, aniž by si toho vůbec všimli. K čemu je božství, pokud si nemůžeš utvářet svět k obrazu svému?\n$EFFECT_LIST_BULLET$Zaměřuje se na [Concept('intrigue','pletichářství')|E]\n$EFFECT_LIST_BULLET$Umožňuje využívat [Concept('piety','zbožnost')|E] k uplácení [Concept('agents','spolčenců')|E] v [Concept('schemes','intrikách')|E]\n$EFFECT_LIST_BULLET$Umožňuje používat [Concept('scheme','intriku')|E] #high [GetScheme('leverage_contribution').GetTypeName]#!\n$EFFECT_LIST_BULLET$Možné [Concept('character_death_deaths','druhy smrti')|E]: pouze [Concept('death_natural_cause','přirozená smrt')|E], [Concept('death_religious','náboženská smrt')|E] nebo [Concept('death_murder','vražda')|E]"
 game_concept_mandala_ritual: "Rituál mandaly"
 game_concept_mandala_rituals: "Rituály mandaly"
 game_concept_ritual: "Rituál"
 game_concept_rituals: "Rituály"
 game_concept_mandala_ritual_desc: "Rituály mandaly jsou úkoly, které se čas od času objevují [Concept('rulers','vládcům')|E] [Concept('mandala','mandaly')|E]. Jsou znamením, že některá část tvého [Concept('realm','panství')|E] potřebuje tvé vedení a božskou podporu.\n\nČím lépe ovládáš svůj [Concept('mandala_aspect','aspekt mandaly')|E], tím větší odměny získáš při osobních návštěvách svých [Concept('subjects','podřízených subjektů')|E]."
 game_concept_mandala_ritual_tier: "Úroveň rituálu mandaly"
 game_concept_ritual_tier: "Úroveň rituálu"
 game_concept_mandala_ritual_tier_desc: "U [Concept('mandala_ritual','rituálu mandaly')|E] určuje [Concept('ritual_tier','úroveň rituálu')|E], nakolik danému místu prospěje tvé vedení a jaké osobní odměny za to můžeš získat."
 game_concept_tribute_mission: "Tributní mise"
 game_concept_tribute_missions: "Tributní mise"
 game_concept_tribute_mission_desc: "Jako [Concept('tributary','tributář')|E] musíš svému [Concept('suzerain','suzerénovi')|E] pravidelně projevovat úctu a odvádět tribut.\n\nNesplnění této povinnosti může mít celou řadu následků, z nichž jedním z nejmírnějších je ztráta [Concept('legitimacy','legitimity')|E]."
 game_concept_tribute: "Tribut"
 game_concept_tributes: "Tributy"
