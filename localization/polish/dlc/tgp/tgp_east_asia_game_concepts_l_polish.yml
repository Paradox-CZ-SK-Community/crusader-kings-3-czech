l_polish:
 game_concept_mandala: "Mandala"
 game_concept_mandala_desc: "Pod [Concept('government_form','formou vlády')|E] $game_concept_mandala$ jsou [Concept('domain_limit','limit domény')|E] i počet [Concept('direct_vassals','přímých vazalů')|E] omezené. Místo toho se [Concept('liege','lenní pán')|E] a [Concept('suzerain','suzerén')|E] při rozšiřování svého panství spoléhají na [Concept('tributaries','tributáře')|E]. \n\n[Concept('ruler','Vládce')|E] mandaly může usilovat o to, aby byl vnímán jako božský král, neboli dévarádža, a poté se při získávání a udržování $game_concept_tributaries$ opírá o [Concept('mandala_radiance','záři mandaly')|E].\n\n$game_concept_ruler$ musí udržovat [Concept('opinion','mínění')|E] a rozvíjet vztahy se svými $game_concept_tributaries$, aby si je dlouhodobě udržel. Při nástupnictví se $game_concept_tributaries$ mohou rozptýlit, pokud $game_concept_ruler$ není hodným [Concept('mandala_succesor','nástupcem dévarádži')|E]."
 game_concept_mandalas: "Mandaly"
 game_concept_mandala_government: "Vláda mandaly"
 game_concept_mandala_i: "@government_type_mandala!"
 game_concept_mandala_government_desc: "$game_concept_mandala_desc$"
 game_concept_mandala_succession: "Nástupnictví mandaly"
 game_concept_mandala_succession_succession: "Nástupnictví"
 game_concept_mandala_trials: "Zkoušky mandaly"
 game_concept_mandala_succesor: "Nástupce dévarádži"
 game_concept_mandala_succession_desc: "Když [Concept('ruler','vládce')|E] [Concept('mandala','mandaly')|E] zemře a zvolil si [Concept('mandala_aspect','aspekt mandaly')|E], jeho [Concept('heir','dědic')|E] čelí zkouškám $game_concept_mandala_succession$. Během těchto zkoušek je dědic vystaven [Concept('skill','dovednostním')|E] výzvám, které prověřují jeho schopnosti v příslušné dovednosti aspektu, ale také ve dvou dalších dovednostech aspektů.\n\nÚspěch v těchto zkouškách znamená, že dědic dokázal své stoupence přesvědčit, že je hodným nástupcem, a [Concept('realm','panství')|E] zůstane stabilní.\n\n#EMP Selhání#! však přinese rostoucí postihy:\n\n#indent_newline:6 $BULLET_WITH_TAB$#bold 1#! nesplněná výzva: ztráta jedné [Concept('piety_level','úrovně oddanosti')|E] a osvobození malé části [Concept('tributaries','tributářů')|E].#!\n\n#indent_newline:6 $BULLET_WITH_TAB$#bold 2#! nesplněné výzvy: ztráta dvou [Concept('piety_levels','úrovní oddanosti')|E] a osvobození všech tributářů.#!\n\n#indent_newline:6 $BULLET_WITH_TAB$#bold Všechny#! nesplněné výzvy: ztráta tří [Concept('piety_levels','úrovní oddanosti')|E] a roztříštění [Concept('realm','panství')|E].#!"
 game_concept_mandala_radiance: "Záře mandaly"
 game_concept_radiance: "Záře"
 game_concept_radiant: "Zářící"
 game_concept_mandala_radiance_desc: "Přitažlivost, která [Concept('ruler','vládci')|E] [Concept('mandala','mandaly')|E] umožňuje získávat a udržovat [Concept('subjects','podřízené')|E], se označuje jako záře mandaly. Je směsí jeho [Concept('piety_level','úrovně oddanosti')|E], úrovně [Concept('great_building','velké stavby')|E] #V [GetBuilding('mandala_capital_01').GetTypeName]#! a úrovně [Concept('mandala_aspect','aspektu mandaly')|E].\n\nVyšší odměny, více podřízených a větší moc čekají na ty, kdo dokážou tyto tři prvky spojit a stát se zářivějšími."
 game_concept_mandala_decree: "Nařízení mandaly"
 game_concept_mandala_decrees: "Nařízení mandaly"
 game_concept_mandala_decree_desc: "$game_concept_mandala_decrees$ jsou tři nařízení vydávaná [Concept('ruler','vládcem')|E] [Concept('mandala','mandaly')|E] — představují je [Concept('prosperity_decree','nařízení prosperity')|E], [Concept('expansion_decree','nařízení expanze')|E] a [Concept('reverence_decree','nařízení úcty')|E].\n\nPanství mandaly má obecně velmi centralizovanou autoritu, kde moc nad [Concept('subjects','podřízenými')|E] a [Concept('laws','zákony')|E] leží u příslušného vládce, který je může měnit podle potřeby s malým odporem obyvatel, nebo zcela bez něj."
 game_concept_decree: "Nařízení"
 game_concept_decrees: "Nařízení"
 game_concept_mandala_decree_prosperity: "Nařízení prosperity"
 game_concept_mandala_decree_prosperity_desc: "S [GetLaw('mandala_decree_prosperity').GetName] se [Concept('ruler','vládce')|E] [Concept('mandala','mandaly')|E] soustředí na podněcování a inspirování všech [Concept('subjects','podřízených')|E], aby uskutečňovali konstruktivní změny.\n\nÚsilí směřuje k dalšímu rozvoji [Concept('development','rozvoje')|E], [Concept('buildings','budov')|E], hromadění bohatství i posilování společenství prostřednictvím osobních vztahů."
 game_concept_prosperity_decree: "Prosperita"
 game_concept_mandala_decree_expansion: "Nařízení expanze"
 game_concept_mandala_decree_expansion_desc: "[GetLaw('mandala_decree_expansion').GetName] stanovuje, že všichni [Concept('subjects','podřízení')|E] mají své úsilí soustředit na rozšiřování [Concept('realm','panství')|E].\n\nNezbytné je navyšování počtu vojáků, zajišťování vojenského zázemí a podpora všech případných [Concept('wars','válek')|E] vedených jejich [Concept('ruler','vládcem')|E] [Concept('mandala','mandaly')|E]."
 game_concept_expansion_decree: "Expanze"
 game_concept_mandala_decree_reverence: "Nařízení úcty"
 game_concept_mandala_decree_reverence_desc: "[GetLaw('mandala_decree_reverence').GetName] ukládá [Concept('subjects','podřízeným')|E] [Concept('mandala','mandaly')|E], aby své úsilí soustředili na podporu duchovna a uctívání.\n\n[Concept('pilgrimages','Poutě')|E], obřady a [Concept('piety','zbožnost')|E] jsou základními kameny tohoto nařízení mandaly."
 game_concept_reverence_decree: "Úcta"
 game_concept_mandala_aspect: "Aspekt mandaly"
 game_concept_mandala_aspects: "Aspekty mandaly"
 game_concept_aspect: "Aspekt"
 game_concept_aspects: "Aspekty"
 game_concept_mandala_aspect_desc: "Aby [Concept('ruler','vládce')|E] [Concept('mandala','mandaly')|E] dosáhl věčné úcty a božství, musí se sladit s jedním z aspektů, které jej označují za boha.\n\nDostupné aspekty jsou: \n$EFFECT_LIST_BULLET$[Concept('aspect_of_creation','aspekt stvoření')|E]\n$EFFECT_LIST_BULLET$[Concept('aspect_of_serenity','aspekt klidu')|E]\n$EFFECT_LIST_BULLET$[Concept('aspect_of_destruction','aspekt zkázy')|E]\n$EFFECT_LIST_BULLET$[Concept('aspect_of_trickery','aspekt lstivosti')|E]\n\nTyto aspekty ovlivní určitá očekávání a činy podnikané vládcem."
 game_concept_aspect_of_creation: "Aspekt stvoření"
 game_concept_aspect_of_creation_desc: "S příslibem posílení výroby a přivolání hojnosti pro své stoupence poskytuje aspekt stvoření bonusy k hospodářským a organizačním podnikům.\n$EFFECT_LIST_BULLET$Zaměřuje se na [Concept('stewardship','správu')|E]\n$EFFECT_LIST_BULLET$Navazující výstavba uděluje sčítající se [GetModifier( 'mandala_creator_modifier' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$Běžná výstavba uděluje [Concept('piety','zbožnost')|E]\n$EFFECT_LIST_BULLET$Výchova [Concept('legitimate','legitimních')|E] [Concept('children','dětí')|E] uděluje [Concept('piety','zbožnost')|E]\n$EFFECT_LIST_BULLET$Má přístup k [Concept('scheme','intrice')|E] #high [GetScheme('coerce_contribution').GetTypeName]#!\n$EFFECT_LIST_BULLET$Může zemřít pouze [Concept('death_natural_cause','přirozenou')|E] nebo [Concept('death_religious','náboženskou')|E] [Concept('character_death_deaths','smrtí')|E]"
 game_concept_aspect_of_serenity: "Aspekt klidu"
 game_concept_aspect_of_serenity_desc: "Pokojné panství je prosperující panství — aspekt klidu si cení míru a diplomatického jednání a uděluje bonusy těm, kdo se s jeho cílem sladí.\n$EFFECT_LIST_BULLET$Zaměřuje se na [Concept('diplomacy','diplomacii')|E]\n$EFFECT_LIST_BULLET$Vyhýbání se útočným [Concept('wars','válkám')|E] je odměňováno sčítajícími se [GetModifier( 'mandala_increments_of_peace_modifier' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[Concept('schemes','Intriky')|E] [GetScheme('sway').GetTypeName] a [GetScheme('befriend').GetTypeName] jsou úspěšnější\n$EFFECT_LIST_BULLET$Může také žádat #high $request_great_project_contribution_interaction$s#! od [Concept('allies','spojenců')|E]\n$EFFECT_LIST_BULLET$Může zemřít pouze [Concept('death_natural_cause','přirozenou')|E] nebo [Concept('death_religious','náboženskou')|E] [Concept('character_death_deaths','smrtí')|E]"
 game_concept_aspect_of_destruction: "Aspekt zkázy"
 game_concept_aspect_of_destruction_desc: "Strach a děs jsou cestou k vládě. Skutečná moc spočívá ve schopnosti zhášet život. Aspekt zkázy poskytuje bonusy těm, kdo rozdělují a dobývají.\n$EFFECT_LIST_BULLET$Zaměřuje se na [Concept('martial','vojenství')|E]\n$EFFECT_LIST_BULLET$Má bonusy k vojenským modifikátorům\n$EFFECT_LIST_BULLET$Má přístup k [Concept('casus_belli','casus belli')|E] #high [GetCasusBelliType('mandala_plunder_cb').GetName]#!\n$EFFECT_LIST_BULLET$Může zemřít pouze [Concept('death_natural_cause','přirozenou')|E], [Concept('death_religious','náboženskou')|E] nebo [Concept('death_combat','bojovou')|E] [Concept('character_death_deaths','smrtí')|E]"
 game_concept_aspect_of_trickery: "Aspekt lstivosti"
 game_concept_aspect_of_trickery_desc: "Dobrotivý či úskočný; aspekt šejdíře odměňuje schopnost ovládat ostatní, aniž by o tom věděli. K čemu je božství, ne-li k utváření světa k obrazu svému?\n$EFFECT_LIST_BULLET$Zaměřuje se na [Concept('intrigue','pletichaření')|E]\n$EFFECT_LIST_BULLET$Může používat [Concept('piety','zbožnost')|E] k podplácení [Concept('agents','spolčenců')|E] v [Concept('schemes','intrikách')|E]\n$EFFECT_LIST_BULLET$Má přístup k [Concept('scheme','intrice')|E] #high [GetScheme('leverage_contribution').GetTypeName]#!\n$EFFECT_LIST_BULLET$Může zemřít pouze [Concept('death_natural_cause','přirozenou')|E], [Concept('death_religious','náboženskou')|E] nebo [Concept('death_murder','vražednou')|E] [Concept('character_death_deaths','smrtí')|E]"
 game_concept_mandala_ritual: "Rituál mandaly"
 game_concept_mandala_rituals: "Rituály mandaly"
 game_concept_ritual: "Rituál"
 game_concept_rituals: "Rituály"
 game_concept_mandala_ritual_desc: "Rituály mandaly jsou úkoly, které se občas objeví [Concept('rulers','vládcům')|E] [Concept('mandala','mandaly')|E] — jsou znamením, že určitá část tvého [Concept('realm','panství')|E] potřebuje tvé vedení a božské povznesení.\n\nVyšší dovednost v tvém [Concept('mandala_aspect','aspektu mandaly')|E] zvýší zisky z toho, že se ukážeš svým [Concept('subjects','podřízeným')|E]."
 game_concept_mandala_ritual_tier: "Úroveň rituálu mandaly"
 game_concept_ritual_tier: "Úroveň rituálu"
 game_concept_mandala_ritual_tier_desc: "[Concept('ritual_tier','Úroveň rituálu')|E] [Concept('mandala_ritual','rituálu mandaly')|E] udává, jak moc by danému cíli prospělo tvé napomenutí, a také jaké odměny získáš ty osobně."
 game_concept_tribute_mission: "Tributní mise"
 game_concept_tribute_missions: "Tributní mise"
 game_concept_tribute_mission_desc: "Jako [Concept('tributary','tributář')|E] musíš svému [Concept('suzerain','suzerénovi')|E] pravidelně projevovat úctu a zároveň mu odvádět tribut.\n\nPokud tak neučiníš, může to mít různé následky, z nichž nejmírnější je ztráta [Concept('legitimacy','legitimity')|E]."
 game_concept_tribute: "Tribut"
 game_concept_tributes: "Tributy"
