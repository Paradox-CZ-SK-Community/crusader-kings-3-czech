l_polish:
 game_concept_mandala: "Mandala" # todo: NEW TRANSLATION
 game_concept_mandala_desc: "V rámci $game_concept_mandala$ [government_form|E] jsou [domain_limit|E] a počet [direct_vassals|E] omezené. Místo toho se [liege|E] a [suzerain|E] při rozšiřování svého panství spoléhají na [tributaries|E]. \n\nVládce mandaly se může snažit být vnímán jako Božský král, nebo Devaraja, a pak spoléhá na [mandala_radiance|E], aby získával a udržoval tributáře. \n\nJe také na vládci, aby udržoval [opinion|E] a pěstoval vztahy se svými tributáři ve snaze udržet je dlouhodobě. Při nástupnictví se tributáři mohou rozprchnout, pokud vládce nedokáže prokázat, že je hodným [mandala_succesor|E]." # todo: RETRANSLATED ENGLISH
 game_concept_mandalas: "Mandaly" # todo: NEW TRANSLATION
 game_concept_mandala_government: "Mandalská vláda" # todo: NEW TRANSLATION
 game_concept_mandala_i: "@government_type_mandala!" # todo: NEW TRANSLATION
 game_concept_mandala_government_desc: "$game_concept_mandala_desc$" # todo: NEW TRANSLATION
 game_concept_mandala_succession: "Mandalské nástupnictví" # todo: NEW TRANSLATION
 game_concept_mandala_succession_succession: "Nástupnictví" # todo: NEW TRANSLATION
 game_concept_mandala_trials: "Mandalské zkoušky" # todo: NEW TRANSLATION
 game_concept_mandala_succesor: "Nástupce Devaraja" # todo: NEW TRANSLATION
 game_concept_mandala_succession_desc: "Když [mandala|E] [ruler|E] zemře a zvolil [mandala_aspect|E], jeho [heir|E] čelí Zkouškám $game_concept_mandala_succession$. V těchto zkouškách je dědic podroben výzvám [skill|E], které prověřují jeho schopnosti v příslušné dovednosti aspektu, ale i ve dvou dalších dovednostech aspektu.\n\nÚspěšné splnění těchto zkoušek znamená, že dědic dokázal přesvědčit své stoupence, že je hodným nástupcem, a [realm|E] zůstává stabilní.\n\n#EMP Selhání#! však přinese rostoucí postihy:\n\n#indent_newline:6 $BULLET_WITH_TAB$#bold 1#! Neúspěšná výzva: ztráta jedné úrovně [piety_level|E] a malý počet [tributaries|E] se osamostatní.#!\n\n#indent_newline:6 $BULLET_WITH_TAB$#bold 2#! Neúspěšné výzvy: ztráta dvou úrovní [piety_levels|E] a všichni tributáři se osamostatní.#!\n\n#indent_newline:6 $BULLET_WITH_TAB$#bold Všechny#! neúspěšné výzvy: ztráta tří úrovní [piety_levels|E] a rozpad [realm|E].#!"
 game_concept_mandala_radiance: "Mandalská záře"
 game_concept_radiance: "Záře"
 game_concept_radiant: "Zářivý"
 game_concept_mandala_radiance_desc: "Schopnost přitahovat a udržet si [subjects|E] pro [mandala|E] [ruler|E] se nazývá mandalská záře. Jde o kombinaci jejich [piety_level|E], úrovně #V [GetBuilding('mandala_capital_01').GetTypeName]#! [great_building|E] a také úrovně [mandala_aspect|E].\n\nVyšší odměny, více poddaných a větší moc čekají na ty, kteří tyto tři prvky spojí a stanou se zářivějšími."
 game_concept_mandala_decree: "Mandalský dekret"
 game_concept_mandala_decrees: "Mandalské dekrety"
 game_concept_mandala_decree_desc: "$game_concept_mandala_decrees$ jsou tři dekrety vydávané [mandala|E] [ruler|E] — reprezentované [prosperity_decree|E], [expansion_decree|E] a [reverence_decree|E].\n\nObecně má mandalská říše velmi centralizovanou moc, kde kontrola nad [subjects|E] a [laws|E] náleží vládci, který je může podle potřeby měnit s minimálním odporem ze strany obyvatel."
 game_concept_decree: "Dekret" # todo: NEW TRANSLATION
 game_concept_decrees: "Dekrety" # todo: NEW TRANSLATION
 game_concept_mandala_decree_prosperity: "Dekret blahobytu" # todo: NEW TRANSLATION
 game_concept_mandala_decree_prosperity_desc: "S [GetLaw('mandala_decree_prosperity').GetName] je [mandala|E] [ruler|E] zaměřený na povzbuzování a inspirování všech [subjects|E] k uskutečňování konstruktivních změn.\n\nÚsilí je soustředěno na podporu [development|E], [buildings|E], hromadění bohatství a posilování společenství prostřednictvím osobních vztahů." # todo: RETRANSLATED ENGLISH
 game_concept_prosperity_decree: "Blahobyt" # todo: NEW TRANSLATION
 game_concept_mandala_decree_expansion: "Dekret expanze" # todo: NEW TRANSLATION
 game_concept_mandala_decree_expansion_desc: "[GetLaw('mandala_decree_expansion').GetName] nařizuje, aby se všichni [subjects|E] soustředili na rozšiřování [realm|E].\n\nZvyšování počtu vojáků, vojenského zázemí a podpora případných [wars|E], vedených jejich [mandala|E] [ruler|E], je zásadní."
 game_concept_expansion_decree: "Expanze"
 game_concept_mandala_decree_reverence: "Dekret úcty"
 game_concept_mandala_decree_reverence_desc: "[GetLaw('mandala_decree_reverence').GetName] nařizuje, aby se [mandala|E] [subjects|E] zaměřili na rozvoj spirituality a uctívání.\n\n[pilgrimages|E], rituály a [piety|E] jsou základními pilíři tohoto mandalského dekretu."
 game_concept_reverence_decree: "Úcta"
 game_concept_mandala_aspect: "Mandalský aspekt"
 game_concept_mandala_aspects: "Mandalské aspekty"
 game_concept_aspect: "Aspekt"
 game_concept_aspects: "Aspekty"
 game_concept_mandala_aspect_desc: "Aby [mandala|E] [ruler|E] dosáhl věčné úcty a božství, musí se ztotožnit s jedním z aspektů, které jej definují jako božstvo.\n\nDostupné aspekty jsou:\n$EFFECT_LIST_BULLET$[aspect_of_creation|E]\n$EFFECT_LIST_BULLET$[aspect_of_serenity|E]\n$EFFECT_LIST_BULLET$[aspect_of_destruction|E]\n$EFFECT_LIST_BULLET$[aspect_of_trickery|E]\n\nTyto aspekty ovlivňují očekávání i činy vládce."
 game_concept_aspect_of_creation: "Aspekt stvoření"
 game_concept_aspect_of_creation_desc: "S příslibem zvýšení produkce a hojnosti pro své následovníky poskytuje aspekt stvoření bonusy ekonomickým a organizačním činnostem.\n$EFFECT_LIST_BULLET$Zaměřuje se na [stewardship|E]\n$EFFECT_LIST_BULLET$Řetězení staveb přidává vrstvy [GetModifier( 'mandala_creator_modifier' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$Běžná výstavba uděluje [piety|E]\n$EFFECT_LIST_BULLET$Výchova [legitimate|E] [children|E] uděluje [piety|E]\n$EFFECT_LIST_BULLET$Má přístup ke schématu #high [GetScheme('coerce_contribution').GetTypeName]#! [scheme|E]\n$EFFECT_LIST_BULLET$Může zemřít pouze na [death_natural_cause|E] nebo [death_religious|E] [character_death_deaths|E]"
 game_concept_aspect_of_serenity: "Aspekt klidu"
 game_concept_aspect_of_serenity_desc: "Poklidná říše je prosperující říše — aspekt klidu si cení harmonie a diplomacie a poskytuje bonusy těm, kdo se k němu přikloní.\n$EFFECT_LIST_BULLET$Zaměřuje se na [diplomacy|E]\n$EFFECT_LIST_BULLET$Vyhýbání se útočným [wars|E] přidává vrstvy [GetModifier( 'mandala_increments_of_peace_modifier' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$Schémata [GetScheme('sway').GetTypeName] a [GetScheme('befriend').GetTypeName] jsou úspěšnější\n$EFFECT_LIST_BULLET$Může také #high $request_great_project_contribution_interaction$s#! od [allies|E]\n$EFFECT_LIST_BULLET$Může zemřít pouze na [death_natural_cause|E] nebo [death_religious|E] [character_death_deaths|E]"
 game_concept_aspect_of_destruction: "Aspekt zkázy"
 game_concept_aspect_of_destruction_desc: "Strach a hrůza jsou cestou vlády. Skutečná moc spočívá ve schopnosti ničit život. Aspekt zkázy poskytuje bonusy těm, kdo rozdělují a dobývají.\n$EFFECT_LIST_BULLET$Zaměřuje se na [martial|E]\n$EFFECT_LIST_BULLET$Poskytuje bonusy k vojenským modifikátorům\n$EFFECT_LIST_BULLET$Má přístup k #high [GetCasusBelliType('mandala_plunder_cb').GetName]#! [casus_belli|E]\n$EFFECT_LIST_BULLET$Může zemřít pouze na [death_natural_cause|E], [death_religious|E] nebo [death_combat|E] [character_death_deaths|E]"
 game_concept_aspect_of_trickery: "Aspekt lstí"
 game_concept_aspect_of_trickery_desc: "Dobrotivý či proradný — aspekt lstí odměňuje schopnost ovládat druhé bez jejich vědomí. K čemu je božství, když ne k utváření světa k obrazu svému?\n$EFFECT_LIST_BULLET$Zaměřuje se na [intrigue|E]\n$EFFECT_LIST_BULLET$Může využívat [piety|E] k uplácení [agents|E] ve [schemes|E]\n$EFFECT_LIST_BULLET$Má přístup ke schématu #high [GetScheme('leverage_contribution').GetTypeName]#! [scheme|E]\n$EFFECT_LIST_BULLET$Může zemřít pouze na [death_natural_cause|E], [death_religious|E] nebo [death_murder|E] [character_death_deaths|E]"
 game_concept_mandala_ritual: "Mandalský rituál"
 game_concept_mandala_rituals: "Mandalské rituály"
 game_concept_ritual: "Rituál"
 game_concept_rituals: "Rituály"
 game_concept_mandala_ritual_desc: "Mandalské rituály jsou úkoly, které se občas objevují pro [mandala|E] [rulers|E] — značí, že určitá část vašeho [realm|E] potřebuje vaše vedení a božské povznesení.\n\nVyšší dovednost ve vašem [mandala_aspect|E] zvyšuje zisky z těchto vystoupení pro vaše [subjects|E]."
 game_concept_mandala_ritual_tier: "Úroveň mandalského rituálu"
 game_concept_ritual_tier: "Úroveň rituálu"
 game_concept_mandala_ritual_tier_desc: "[ritual_tier|E] u [mandala_ritual|E] určuje, jak moc dané místo těží z vašeho zásahu a jaké odměny získáte."
 game_concept_tribute_mission: "Tributární mise"
 game_concept_tribute_missions: "Tributární mise"
 game_concept_tribute_mission_desc: "Jako [tributary|E] je nutné pravidelně prokazovat úctu i odvádět tribut [suzerain|E].\n\nSelhání může mít řadu následků, z nichž nejmírnějším je ztráta [legitimacy|E]."
 game_concept_tribute: "Tribut"
 game_concept_tributes: "Tributy"
