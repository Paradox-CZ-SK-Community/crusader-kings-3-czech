 tgp_east_asia_interaction_events.2000.t: "Kořen, stonek a větev" # todo: NEW TRANSLATION
 tgp_east_asia_interaction_events.2000.desc: "Je mou nebeskou povinností podporovat dobro a vymýtit zlo; a z toho druhého je v mé moci jen málo zdrojů bezpráví větších než [recipient.GetTitledFirstName]! [Select_CString(recipient.IsFemale,'Její','Jeho')] zločiny #EMP znesvětňují#! jeho rod, a pro viníky nemůže být milost; vyhubení tohoto zla musí sahat hluboko do jeho kořenů.\n\nTi, kdo se postaví naší vůli, se budou třást před [Select_CString(recipient.IsFemale,'jejím','jeho')] zničením; nechť [Select_CString(recipient.IsFemale,'její','jeho')] hlava je oddělena od [Select_CString(recipient.IsFemale,'její','jeho')] těla a ponechána hnít na tržišti, [Select_CString(recipient.IsFemale,'její','jeho')] kosti nepochované a [Select_CString(recipient.IsFemale,'její','jeho')] duch neklidný, a každý, kdo sdílí [Select_CString(recipient.IsFemale,'její','jeho')] jedovatou krev, bude popraven nebo vyhnán do čtyř koutů světa." # todo: NEW TRANSLATION
 tgp_east_asia_interaction_events.2000.a: "Mou vůlí a právem, #EMP ukončím #bold [Select_CString(recipient.IsFemale,'její','jeho')] jméno#!" # todo: NEW TRANSLATION
