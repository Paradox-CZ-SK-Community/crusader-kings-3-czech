l_polish:
 tgp_east_asia_interaction_events.0010.opening: "[leaving_tributary.Custom2('AppropriateGreeting', ROOT.Char)|U]"
 tgp_east_asia_interaction_events.0010.desc: "Nyní sloužím jinému dévarádžovi. Takovému, který nám ukáže pravou cestu.\n\nAť žije [leaving_tributary.GetSuzerain.GetName]!"
 tgp_east_asia_interaction_events.0010.a: "Jak je to možné?!"
 tgp_east_asia_interaction_events.0010.tt: "[leaving_tributary.GetShortUIName|U] už není tvým [Concept('tributary','tributářem')|E]"
 tgp_east_asia_interaction_events.0020.opening: "[recipient.Custom2('AppropriateGreeting', actor )|U]"
 tgp_east_asia_interaction_events.0020.desc: "Argumenty mého dévarádži jsou přesvědčivé.\n\nDovol nám tedy sloužit, byť jen o něco déle."
 tgp_east_asia_interaction_events.0020.a: "To jsem si [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] myslet."
 tgp_east_asia_interaction_events.0025.opening: "[recipient.Custom2('AppropriateGreeting', actor )|U]"
 tgp_east_asia_interaction_events.0025.desc: "Tvé malicherné lži jsem dávno [Select_CString(recipient.IsFemale,'prohlédla','prohlédl')] a tak snadno se zastrašit nenechám!\n\nOd skutečného dévarádži očekávám víc!"
 tgp_east_asia_interaction_events.0025.a: "Nuže, dobrá..."
 tgp_east_asia_interaction_events.0030.t: "Přijetí tributáře: Objevuje se vyzyvatel"
 tgp_east_asia_interaction_events.0030.desc: "Zdá se, že [actor.GetTitledFirstName], [actor.Custom2('InsultNoun', ROOT.Char)], se pokouší svést mého tributáře [recipient.Custom('CZ_TitledFirstName_A')] na scestí.\n\nNěkdo se dokonce snaží [recipient.Custom('CZ_FirstNameNoTooltip_A')] přesvědčit, že [actor.Custom('CZ_FirstNamePossessiveNoTooltip_N')] směšné božství zastiňuje to mé!"
 tgp_east_asia_interaction_events.0030.a: "Vyženu [Select_CString(recipient.IsFemale,'jí','mu')] ty nesmysly z hlavy."
 tgp_east_asia_interaction_events.0030.b: "Vyřeším to silou!"
 tgp_east_asia_interaction_events.0030.c: "Mám na starosti důležitější věci."
 tgp_east_asia_interaction_events.0035.opening: "[sending_character.Custom2('AppropriateGreeting', ROOT.Char)|U]"
 tgp_east_asia_interaction_events.0035.desc.warring: "S politováním ti musím oznámit, [ROOT.Char.Custom2('CZ_InsultNoun_V', SCOPE.sC('sending_character'))], že jsem se [Select_CString(sending_character.IsFemale,'rozhodla','rozhodl')] silou znovu prosadit tributární podřízenost [recipient.Custom('CZ_TitledFirstName_G')].\n\nPovažuj to za varování."
 tgp_east_asia_interaction_events.0035.desc: "S politováním ti oznamuji, že má oddanost nadále patří mému pravému dévarádžovi [recipient.GetSuzerain.Custom('CZ_TitledFirstName_D')].\n\nUž nás neobtěžuj."
 tgp_east_asia_interaction_events.0035.a: "Rozumím."
 embraced_my_tributary_opinion: "Získání mého tributáře"
 attempted_to_embrace_my_tributary_opinion: "Pokus o získání mého tributáře"
 tgp_east_asia_interaction_events.2000.t: "Kořen, kmen a větev"
 tgp_east_asia_interaction_events.2000.desc: "Mou nebeskou povinností je podporovat dobro a vymýtit zlo. A mezi všemi zdroji zkaženosti, na které má moc dosáhne, sotva najdu větší, než je [recipient.GetTitledFirstName]! [Select_CString(recipient.IsFemale,'Její','Jeho')|U] zločiny #EMP poskvrňují#! celý rod. Viníkům nelze odpustit a toto zlo musí být vykořeněno až do nejhlubších kořenů.\n\nVšichni, kdo se postaví naší vůli, se budou třást hrůzou při pohledu na [Select_CString(recipient.IsFemale,'její','jeho')] zkázu. Nechť je [Select_CString(recipient.IsFemale,'její','jeho')] hlava sťata a oddělena od těla, aby hnila na tržišti! Nechť [Select_CString(recipient.IsFemale,'její','jeho')] kosti zůstanou nepohřbené a duch nenajde pokoje! A všichni, v jejichž žilách koluje stejná otrávená krev, budou popraveni nebo vyhnáni do všech čtyř koutů světa."
 tgp_east_asia_interaction_events.2000.a: "Z mé vůle a mým nezpochybnitelným právem #EMP #bold vymažu#! [Select_CString(recipient.IsFemale,'její','jeho')] jméno z dějin!#!"
 tgp_east_asia_interaction_events.2000.a.title: "Kolektivní trest"
 tgp_east_asia_interaction_events.2000.a.tt: "[CZProDrop(purger,'podrobila','podrobil')|U] čistce [recipient.Custom('CZ_ShortUIName_A')] i [Select_CString(recipient.IsFemale,'její','jeho')] rodinu"
 auto_accept_interaction_huangdi: "Moc státu je absolutní"
 celestial_extinguish_noble_family_interaction_death_explanation: "Všichni rodiče a dospělé děti, kteří nedosáhli [Concept('retirement_age','věku odchodu do výslužby')|E] a patří k dominantnímu pohlaví tvé [Concept('faithpossessive','víry')|E], budou popraveni"
 celestial_extinguish_noble_family_interaction_banish_explanation: "Všechny [Concept('spouses','choti')|E] či [Concept('concubines','konkubíny')|E] a členové [Concept('close_family','blízké rodiny')|E] i [Concept('extended_family','širší rodiny')|E] ze stejného [Concept('house','rodu')|E] budou [Concept('banished','vyhnáni')|E] z [Concept('realm','panství')|E]"
 celestial_extinguish_noble_family_interaction_exemption_explanation: "Ušetřeny budou všechny [Concept('spouse','choti')|E], [Concept('concubines','konkubíny')|E] a členové [Concept('close_family','blízké rodiny')|E] či [Concept('extended_family','širší rodiny')|E], kteří jsou [Concept('married','sezdáni')|E] s členem vládnoucího [Concept('house','rodu')|E] [actor.GetHouse.GetName] nebo jsou jeho dětmi"
 is_currently_being_purged_tt: "[recipient.GetShortUIName|U] právě [Select_CString(recipient.IsLocalPlayer,'podléháš','podléhá')|l] čistce"
 purged_banishment_opinion: "Vyhnání za zločin"
 purged_execution_opinion: "Odsouzení k smrti"
