 tgp_east_asia_interaction_events.2000.t: "Kořen, stonek a větev" # todo: NEW TRANSLATION
 tgp_east_asia_interaction_events.2000.desc: "Je mou nebeskou povinností podporovat dobro a vymýtit zlo; a z toho druhého je v mé moci jen málo zdrojů bezpráví větších než [recipient.GetTitledFirstName]! [recipient.GetHerHis|U] zločiny #EMP znesvětňují#! jeho rod, a pro viníky nemůže být milost; vyhubení tohoto zla musí sahat hluboko do jeho kořenů.\n\nTi, kdo se postaví naší vůli, se budou třást před [recipient.GetHerHis] zničením; nechť [recipient.GetHerHis] hlava je oddělena od [recipient.GetHerHis] těla a ponechána hnít na tržišti, [recipient.GetHerHis] kosti nepochované a [recipient.GetHerHis] duch neklidný, a každý, kdo sdílí [recipient.GetHerHis] jedovatou krev, bude popraven nebo vyhnán do čtyř koutů světa." # todo: NEW TRANSLATION
 tgp_east_asia_interaction_events.2000.a: "Mou vůlí a právem, #EMP ukončím #bold [recipient.GetHerHis] jméno#!" # todo: NEW TRANSLATION
 tgp_east_asia_interaction_events.2000.a.title: "Kolektivní trest" # todo: NEW TRANSLATION
