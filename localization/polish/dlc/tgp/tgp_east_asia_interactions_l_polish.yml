 offer_tributary_status_interaction_cooldown_tt: "Po několik let nebudeš moci znovu požádat [recipient.Custom('CZ_ShortUINameNoTooltip_A')] o přijetí statusu $game_concept_tributary$"
 offer_tributary_status_interaction_cooldown_active_tt: "[recipient.GetShortUINameNoTooltip|U] [Select_CString(recipient.IsLocalPlayer,'stále neseš nelibě','stále nese nelibě')|l] tvou poslední žádost o přijetí statusu $game_concept_tributary$"
 offer_tributary_status_interaction_tributary_was_recently_subjugated: "[CZProDrop(recipient,'byla','byl')|U] teprve nedávno [Select_CString(recipient.IsFemale,'podrobena','podroben')|l] svým [Concept('suzerain','suzerénem')|E]"
 offer_tributary_status_interaction_warred_cooldown_active_tt: "[recipient.GetShortUINameNoTooltip|U] [Select_CString(recipient.IsLocalPlayer,'máš','má')|l] stále obavy z následků posledního pokusu připojit se k tobě v postavení $game_concept_tributary$"
 offer_tributary_status_interaction_cant_use_tributaries_tt: "[actor.GetShortUIName|U] [Select_CString(actor.IsLocalPlayer,'nemůžeš','nemůže')|l] mít [Concept('tributaries','tributáře')|E], protože [Concept('government','vláda')|E] tohoto typu to neumožňuje"
 offer_tributary_status_interaction_suzerain_intervene.t: "[recipient.GetSuzerain.GetShortUIName|U] [Select_CString(recipient.GetSuzerain.IsLocalPlayer,'zasahuješ','zasahuje')|l] jako [Concept('suzerain','suzerén')|E]"
 offer_tributary_status_interaction_suzerain_starts_war_tt: "@alert_icon! #alert_trial [recipient.GetSuzerain.GetShortUIName|U] [Select_CString(recipient.GetSuzerain.IsLocalPlayer,'zahajuješ','zahajuje')|l] válku proti [recipient.Custom('CZ_ShortUIName_A')] s [Concept('casus_belli','důvodem k válce')|E] [GetCasusBelliType('make_tributary_cb').GetName]#!"
 offer_tributary_status_interaction_suzerain_nothing.t: "[recipient.GetSuzerain.GetShortUIName|U] [Select_CString(recipient.GetSuzerain.IsLocalPlayer,'nezasahuješ','nezasahuje')|l] jako [Concept('suzerain','suzerén')|E]"
 accepted_tributary_status_opinion: "Přijetí nabídky tributárního postavení"
