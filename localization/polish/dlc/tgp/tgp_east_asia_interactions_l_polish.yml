 turn_subject_into_mandala_interaction_desc: "Požádat [recipient.Custom('CZ_ShortUIName_A')] o nahrazení dosavadní formy [Concept('government','vlády')|E] ([recipient.GetGovernment.GetAdjective]) uspořádáním známým jako [GetGovernment('mandala_government').GetName]"
 turn_subject_into_mandala_interaction_accept: "[recipient.GetShortUINameNoTooltip|U] [Select_CString(recipient.IsLocalPlayer,'přijímáš','přijímá')|l] tvou žádost"
 turn_subject_into_mandala_interaction_refuse: "[recipient.GetShortUINameNoTooltip|U] [Select_CString(recipient.IsLocalPlayer,'odmítáš','odmítá')|l] tvou žádost"
 turn_subject_into_mandala_interaction_extra_icon: "$hook_extra_icon$"
 tgp_east_asia_interaction_events.1000.opening: "[recipient.Custom2('AppropriateGreetingPositive', actor)]"
 tgp_east_asia_interaction_events.1000.desc: "Lichotí mi, že mi nabízíš možnost přetvořit mé [recipient.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_ee')] panství k obrazu svému."
 tgp_east_asia_interaction_events.1000.favor: "\n\nObávám se však, že přesvědčit ostatní nebude tak snadné..."
 tgp_east_asia_interaction_events.1000.a: "Zavážeš si tím samotného boha."
 tgp_east_asia_interaction_events.1000.b: "Taková je má vůle! Odvážíš se vzdorovat mému nařízení?"
 tgp_east_asia_interaction_events.1001.gold: "\n\nKdybych měl ostatním co ukázat jako důkaz tvé dobré vůle, možná by to na ně také zapůsobilo..."
 tgp_east_asia_interaction_events.1002.a: "Jako můj služebník budeš [Select_CString(recipient.IsFemale,'odměněna','odměněn')]."
 tgp_east_asia_interaction_events.1003.opening: "[actor.Custom2('AppropriateGreetingPositive', recipient)]"
 tgp_east_asia_interaction_events.1003.desc: "Nastal čas, aby se panství [recipient.GetPrimaryTitle.GetBaseNameNoTier] stalo skutečnou součástí [actor.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_ee')] mandaly. Nabízím ti možnost vládnout jako [actor.GetPrimaryTitle.GetTierAsNameNoTooltip] s plnou podporou mého kněžstva."
 tgp_east_asia_interaction_events.1003.end: "\n\nBudeš vládnout z mé vůle jako jeden z mých pozemských zástupců."
 tgp_east_asia_interaction_events.1003.a: "Ať se to dozví celý svět!"
 tgp_east_asia_interaction_events.1003.b: "Na tvou prosbu tak učiním."
 tgp_east_asia_interaction_events.1003.c: "K uskutečnění tohoto záměru budu potřebovat prostředky."
 tgp_east_asia_interaction_events.1003.d: "Vládce [recipient.GetPrimaryTitle.GetBaseNameNoTierPossessiveNoTooltip] se nepokoří!"
 tgp_east_asia_interaction_events.1000.accept_toast: "Požadavek přijat"
 tgp_east_asia_interaction_events.1000.refuse_toast: "Požadavek odmítnut"
 tgp_east_asia_interaction_events.1000.force_toast: "Vynuceno guvernérství"
 demand_mandala_interaction_vassal_refuses: "[recipient.GetShortUIName|U] [Select_CString(recipient.IsLocalPlayer,'odmítáš','odmítá')|l] přijmout vládu [Concept('mandala','mandaly')|E]"
 decommission_mandala_temple_interaction: "Vyřadit chrám z užívání"
 decommission_mandala_temple_interaction_desc: "Vyzvat [recipient.Custom('CZ_ShortUIName_A')], aby se odvrátil od svých bludů a zrušil provoz stavby #V [GetBuilding('mandala_capital_01').GetTypeName]#!"
 decommission_mandala_temple_interaction_tt: "Stavba [GetBuilding('mandala_capital_01').GetTypeName], která patří [recipient.Custom('CZ_Name_D')], bude [Concept('ruined','zničena')|E]"
 decommission_mandala_temple_effect_tt: "Stavba #V [GetBuilding('mandala_capital_01').GetTypeName]#! v hrabství [recipient.GetCapitalLocation.GetCounty.GetName] bude [Concept('ruined','zničena')|E]"
 decommission_mandala_temple_interaction_extra_icon: "$reassert_tributary_interaction_extra_icon$"
 DECOMMISSION_MANDALA_TEMPLE_INTERACTION_NOTIFICATION: "Všiml jsem si, že v hrabství [recipient.GetCapitalLocation.GetCounty.GetName] stojí chrám v hlavním sídle zasvěcený falešnému bohu. Žádám tě, abys toto... nedopatření... neprodleně a důkladně napravil."
 ruined_my_temple_opinion: "Zničení mého chrámu mandaly"
