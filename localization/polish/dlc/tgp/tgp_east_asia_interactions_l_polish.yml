 reassert_tributary_interaction_desc: "Pokusit se přinutit [recipient.Custom('CZ_ShortUIName_A')] k setrvání v postavení tvého [Concept('tributary','tributáře')|E] po dalších #V [EmptyScope.ScriptValue('reassert_stickiness_months')]#! měsíců"
 reassert_tributary_interaction_cooldown_active_tt: "Nedávno už proběhl pokus o opětovné vynucení podřízenosti tohoto [Concept('tributary','tributáře')|E]"
 reassert_tributary_interaction_effect_tt: "Interakce $cease_paying_tribute_interaction$ bude pro [recipient.Custom('CZ_ShortUIName_A')] po následujících #V [EmptyScope.ScriptValue('reassert_stickiness_months')]#! měsíců nedostupná"
 reassert_tributary_interaction_reasserted_recently_tt: "[CZProDrop(recipient,'souhlasila','souhlasil')|U] nedávno s tím, že [Select_CString(recipient.IsLocalPlayer,'zůstaneš','zůstane')|l] tvým [Concept('tributary','tributářem')|E]. Opětovné vynucení podřízenosti bude možné nejdříve [GetCurrentDateWithDiff( GetVarTimeRemaining( recipient.MakeScope, 'tributary_has_been_reasserted_recently') )]"
 reassert_tributary_interaction_extra_icon: "@unspent_strong_hook_icon!Můžeš využít svou [Concept('strong_hook','silnou páku')|E] k vynucení souhlasu"
 reduce_obligation_tt: "Slíbíš zmírnění povinností, aby tvá žádost působila přesvědčivěji"
 PAY_PIETY: "Využít [piety_i] [Concept('piety','zbožnost')|E] k přesvědčování"
 pay_piety_tt: "Vynaložíš [piety_i], abys podpořil svou žádost"
 leverage_dread_tt: "Využiješ [dread_i], aby tvá žádost působila přesvědčivěji"
 reassertion_request_denied_opinion: "Neúspěšné vynucení tributární podřízenosti"
 intimidated_tributary_opinion: "Zastrašil mě"
 tributary_mandala: "Tributář mandaly"
 tributary_mandala_desc: "[Concept('tributary','Tributář')|EU] mandaly pravidelně odvádí svému [Concept('suzerain','suzerénovi')|E] [Concept('gold','zlato')|E], poskytuje [Concept('levies','odvedence')|E], nebo dokonce přispívá [Concept('piety','zbožností')|E]. [Concept('tributary_contract','Tributární smlouva')|EU] se dědí při nástupnictví.\n\n$tributary_mandala_common_desc$"
 tributary_mandala_tribal: "Kmenový tributář"
 tributary_mandala_tribal_desc: "Kmenový [Concept('tributary','tributář')|E] mandaly pravidelně odvádí svému [Concept('suzerain','suzerénovi')|E] [Concept('gold','zlato')|E], poskytuje [Concept('levies','odvedence')|E], nebo dokonce přispívá [Concept('prestige','prestiží')|E]. [Concept('tributary_contract','Tributární smlouva')|EU] se dědí při nástupnictví.\n\n$tributary_mandala_common_desc$"
 tributary_mandala_common_desc: "Na oplátku poskytuje [Concept('suzerain','suzerén')|E] svému tributáři ochranu v případě útoku vnějších nepřátel."
 tributary_wanua: "Tributář wanua"
 tributary_wanua_desc: "[Concept('tributary','Tributář')|EU] [Concept('wanua','wanua')|E] pravidelně odvádí svému [Concept('suzerain','suzerénovi')|E] [Concept('gold','zlato')|E], [Concept('prestige','prestiž')|E], nebo dokonce [Concept('barter_goods','směnné zboží')|E]. [Concept('tributary_contract','Tributární smlouva')|EU] se dědí při nástupnictví."
 wasted_our_efforts: "Zmaření našeho úsilí"
 tgp_mandala_send_missionary_interaction: "Vyslat misionáře"
 tgp_mandala_send_missionary_interaction_desc: "Oddaný misionář z tvého panství dorazí na dvůr [recipient.Custom('CZ_ShortUIName_G')]. Může tvého [Concept('tributary','tributáře')|E] obrátit na tvou [Concept('faith','víru')|E], nebo ti při působení na jeho dvoře získávat [Concept('piety','zbožnost')|E]"
 tgp_mandala_send_missionary_interaction_notification: "S mým požehnáním přichází na tvůj dvůr misionář. Nepřináší meč, nýbrž učené slovo. Přijmi mého vyslance laskavě a dovol svému lidu, aby se sám rozhodl, kterým slovům bude naslouchat."
 tgp_mandala_send_missionary_interaction_tt: "Na dvůr [recipient.Custom('CZ_Name_G')] dorazí [actor.GetCulture.Custom('CZ_AdjectiveNoTooltip_yy')] misionář, jehož vírou je [actor.GetFaith.GetName]"
 tgp_mandala_send_missionary.success: "[recipient.GetShortUIName|U] [Select_CString(recipient.IsLocalPlayer,'přijímáš','přijímá')|l] misionáře na svém dvoře"
 tgp_mandala_send_missionary_interaction_fervor_gain_tt: "[Concept('fervor','Horlivost')|EU] se zvýší o #P 1#!"
 tgp_mandala_send_missionary_interaction_cheaper_conversion_tt: "Dokud je misionář přítomen na dvoře [Concept('tributary','tributáře')|E], je přestup k víře [Concept('suzerain','suzeréna')|E] levnější"
 tgp_mandala_send_missionary.failure: "[recipient.GetShortUIName|U] [Select_CString(recipient.IsLocalPlayer,'odmítáš','odmítá')|l] misionáře na svém dvoře"
 tgp_mandala_send_missionary_interaction_fervor_loss_tt: "[Concept('fervor','Horlivost')|EU] se sníží o #N 1#!"
 SEND_MISSIONARY: "Vyslat misionáře"
