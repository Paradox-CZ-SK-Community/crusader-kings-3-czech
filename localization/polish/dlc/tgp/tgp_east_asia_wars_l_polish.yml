l_polish:
 mandala_plunder_cb: "$MANDALA_PLUNDER_CB_NAME$"
 MANDALA_PLUNDER_CB_NAME: "Vynucení příspěvku pleněním"
 MANDALA_PLUNDER_WAR_NAME: "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')][ATTACKER.GetPrimaryTitle.Custom('CZ_Adjective_aa')|U] válka za kořist"
 MANDALA_PLUNDER_WAR_NAME_BASE: "[ATTACKER.GetPrimaryTitle.Custom('CZ_Adjective_yy')|U] útok na [DEFENDER.GetPrimaryTitle.Custom('CZ_LandedName_A')]"
 mandala_plunder_cb_victory_desc: "[defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer,'musíš','musí')|l] [Concept('great_project_contribute','přispět')|E] na tvůj [Concept('great_project','velký projekt')|E]."
 mandala_plunder_cb_white_peace_desc: "[defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer,'nebudeš','nebude')|l] [Concept('great_project_contribute','přispívat')|E] na tvůj [Concept('great_project','velký projekt')|E]."
 mandala_plunder_cb_defeat_desc: "[attacker.GetShortUIName|U] [Select_CString(attacker.IsLocalPlayer,'utrpíš','utrpí')|l] újmu na své božské pověsti."
 mandala_plunder_cb_ended_invalid.desc: "Válka [war.GetName] skončila, protože [attacker.GetShortUIName] [Select_CString(attacker.IsLocalPlayer,'už nejsi','už není')|l] [Concept('ruler','vládcem')|E] [Concept('mandala','mandaly')|E] s [Concept('aspect_of_destruction','aspektem zkázy')|E] a plánovaným [Concept('great_project','velkým projektem')|E], nebo [defender.GetShortUIName] [Select_CString(defender.IsLocalPlayer,'už nejsi','už není')|l] [Concept('ruler','vládcem')|E] [Concept('mandala','mandaly')|E]."
 not_planning_mandala_capital_tt: "Neplánuješ [Concept('great_project','velký projekt')|E] na vybudování stavby [GetBuilding('mandala_capital_01').GetTypeName]"
 mandala_raze_capital_structure_cb: "$MANDALA_RAZE_CAPITAL_STRUCTURE_CB_NAME$"
 MANDALA_RAZE_CAPITAL_STRUCTURE_CB_NAME: "Zničit [GetBuilding('mandala_capital_01').GetTypeName]"
 MANDALA_RAZE_CAPITAL_STRUCTURE_WAR_NAME: "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')][ATTACKER.GetPrimaryTitle.Custom('CZ_Adjective_aa')|U] pustošivá válka"
 MANDALA_RAZE_CAPITAL_STRUCTURE_WAR_NAME_BASE: "[ATTACKER.GetPrimaryTitle.Custom('CZ_Adjective_yy')|U] útok na [DEFENDER.GetPrimaryTitle.Custom('CZ_LandedName_A')]"
 mandala_raze_capital_structure_cb_victory_desc: "[defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer,'přicházíš','přichází')|l] o stavbu [GetBuilding('mandala_capital_01').GetTypeName], která bude [Concept('ruined','zničena')|E]."
 mandala_raze_capital_structure_cb_white_peace_desc: "[defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer,'si zachováváš','si zachovává')|l] nepoškozenou stavbu [GetBuilding('mandala_capital_01').GetTypeName]."
 mandala_raze_capital_structure_cb_defeat_desc: "[attacker.GetShortUIName|U] [Select_CString(attacker.IsLocalPlayer,'přicházíš','přichází')|l] o stavbu [GetBuilding('mandala_capital_01').GetTypeName], která bude [Concept('ruined','zničena')|E]."
 mandala_raze_capital_structure_cb_ended_invalid.desc: "Válka [war.GetName] skončila, protože [attacker.GetShortUIName] [Select_CString(attacker.IsLocalPlayer,'už nejsi','už není')|l] [Concept('ruler','vládcem')|E] [Concept('mandala','mandaly')|E] s dosud [Concept('ruined','nezničeným')|E] hlavním městem, nebo [defender.GetShortUIName] [Select_CString(defender.IsLocalPlayer,'už nejsi','už není')|l] [Concept('ruler','vládcem')|E] [Concept('mandala','mandaly')|E] s dosud [Concept('ruined','nezničeným')|E] hlavním městem."
