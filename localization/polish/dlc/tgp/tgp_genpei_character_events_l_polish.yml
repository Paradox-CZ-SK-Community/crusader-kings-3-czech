l_polish:
 genpei_intro: "Válka Genpei:"
 tgp_genpei_character.1000.t: "$genpei_intro$ Sužovaný hořec"
 tgp_genpei_character.1000.desc: "Dodnes mě pronásleduje otcova porážka a vražda mých bratrů během [Glossary( 'povstání Heidži', 'HEIJI_REBELLION_GLOSS' )]. Ta potupa ve mně živí touhu po pomstě na proklatém rodu [Glossary( 'Taira', 'TAIRA_GLOSS' )]! [kiyomori_taira.GetFirstName|U] si možná myslí, že díky sňatku své dcery s [norihito_tenno.Custom('CZ_TitledFirstName_I')] má [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName] pevně v rukou. Jenže rod [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] si stále udržuje vliv ve východních provinciích a císařská rodina jen těžko snáší [Select_CString(kiyomori_taira.IsFemale,'její','jeho')] nadvládu.\n\nAčkoli [yorimasa_minamoto.GetFirstName], přední představitel rodu [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )], kdysi pomáhal [kiyomori_taira.Custom('CZ_FirstNameNoTooltip_D')] v boji proti mému otci, mí zvědové hlásí, že mezi nimi začíná panovat napětí. Můj bratranec [yoshinaka_minamoto.GetFirstName] zase dosud neodpustil smrt svého otce, kterého zabil můj nevlastní bratr. Mohl by se však stát cenným spojencem..."
 tgp_genpei_character.1000.a: "#bold Já#! sám skoncovám s rodem [kiyomori_taira.GetDynasty.GetNameNoTooltip]!"
 tgp_genpei_character.1000.a.flavor: "[ruler.GetShortUIName|U] se [Select_CString(ruler.IsLocalPlayer,'pokusíš','pokusí')|l] shromáždit vlastní vojsko a osvobodit [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName] od tyranie rodu [kiyomori_taira.GetDynastyName]"
 tgp_genpei_character.1000.b: "My z rodu [ruler.GetDynasty.GetNameNoTooltip] musíme proti tyranii stanout společně."
 tgp_genpei_character.1000.b.flavor: "Pokud chceš svrhnout zdánlivě neporazitelný rod [kiyomori_taira.GetDynastyName], musíš překonat vzájemné rozpory."
 tgp_genpei_character.1010.t: "$genpei_intro$ Nespoutaný hořec"
 tgp_genpei_character.1010.desc.intro: "[kiyomori_taira.GetFirstName|U]! Jeho touha po moci se valí jako nezadržitelná řeka a smetá vše, co jí stojí v cestě, od vznešených tradic až po pravidla slušnosti. Ani když se sám prohlásil [kiyomori_taira.Custom('CZ_TitleAsName_I')] a pánem celého Japonska, jeho bezbřehou chamtivost to neukojilo. Opojen neotřesitelnou nadvládou rodu [Glossary( 'Taira', 'TAIRA_GLOSS' )] se odvážil sesadit [Glossary( 'císaře', 'TENNO_GLOSS' )] [old_emperor.Custom('CZ_TitledFirstName_A')] a na [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName] dosadit svého vnuka [new_emperor.Custom('CZ_FirstName_A')]."
 tgp_genpei_character.1010.desc.blocboss: "Jako hrot kopí rodu [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] musím převzít odpovědnost právě já. Musíme se stát hradbou proti ctižádosti rodu [kiyomori_taira.GetDynasty.GetNameNoTooltip], jinak nakonec skončíme jako nosiči jejich nosítek!"
 tgp_genpei_character.1010.desc.notblocboss: "\n\nPo celá léta stála má rodina jako pevná hradba proti ctižádosti rodu [kiyomori_taira.GetDynasty.GetNameNoTooltip]. Nyní by z nás neschopné vedení rodu [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] nejraději udělalo pouhé nosiče jejich nosítek! [minamoto_ruler.GetFirstName|U] je příliš [Select_CString(minamoto_ruler.IsFemale,'slabá','slabý')]. Kdyby tu byl můj moudrý otec, nikdy by nic takového nedopustil."
 tgp_genpei_character.1010.a: "Musím sjednotit rod [ruler.GetDynasty.GetNameNoTooltip]."
 tgp_genpei_character.1010.a.flavor: "Tvá naléhavá výzva sjednotí [Concept('bloc','blok')|E]. Pokud použiješ [Concept('interaction','interakci')|E] #V $assume_house_bloc_leadership_interaction$#!, téměř jistě zajistíš rodu [ruler.GetHouse.GetName] postavení vládnoucího [Concept('house','rodu')|E]."
 tgp_genpei_character.1010.a.tt: "Každému [Concept('house','rodu')|E] ve tvém [Concept('bloc','bloku')|E] se zlepší úroveň [Concept('house_relation','vztahu mezi rody')|E] vůči rodu [ruler.GetHouse.GetName]"
 tgp_genpei_character.1010.b: "Co když jsou [kiyomori_taira.GetDynasty.GetNameNoTooltip] právoplatnými vládci?"
 tgp_genpei_character.1010.b.flavor: "Pokud se jim začneš podbízet už teď, možná si mezi jejich nejvýznamnějšími poskoky zajistíš čestné místečko."
 tgp_genpei_character.1090.t: "$genpei_intro$ Pomstychtivý hořec"
 tgp_genpei_character.1090.desc: "Mé dědičné právo vést rod [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] mi bylo ukradeno! Mého vznešeného otce připravila o život podlá bratrovražda! Krveprolití mezi příbuznými během [Glossary( 'povstání Heidži', 'HEIJI_REBELLION_GLOSS' )] jen vydláždilo cestu ničemnému rodu [Glossary( 'Taira', 'TAIRA_GLOSS' )], který se tak mohl zmocnit [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName]. [kiyomori_taira.GetFirstName|U] se v opojení mocí dokonce začal honosit titulem [Glossary( 'Daidžó-daidžin', 'DAIJO_DAIJIN_GLOSS' )]!\n\nNyní se můj bratranec [yoritomo_minamoto.GetFirstName] snaží sjednotit rod [yoritomo_minamoto.GetDynasty.GetNameNoTooltip] proti tomuto tyranovi, ale dosud neodčinil zločin svého otce. Můj nový rod [ruler.GetHouse.GetName] stojí neochvějně jako hory, po nichž nese své jméno. Právě ty hory mě kdysi ukryly před vražedným strýcem!\n\nStačí však má vlastní síla k tomu, abych ukončil tuto éru tyranie?"
 tgp_genpei_character.1090.a: "$tgp_genpei_character.1000.a$"
 tgp_genpei_character.1090.a.flavor: "$tgp_genpei_character.1000.a.flavor$"
 tgp_genpei_character.1090.b: "$tgp_genpei_character.1000.b$"
 tgp_genpei_character.1095.t: "$genpei_intro$ Právoplatný hořec"
 tgp_genpei_character.1095.desc: "Srdce mi krvácí při pomyšlení na Japonsko, jaké znal můj otec. [kiyomori_taira.GetFirstName|U] zničil všechno, co nám bylo drahé! Poslední záruka spravedlivého řádu, samotný [Glossary( 'císař', 'TENNO_GLOSS' )] [old_emperor.GetFirstName], přišla o [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName]. Na jeho místo byl dosazen [kiyomori_taira.Custom('CZ_FirstNamePossessiveNoTooltip_M')] vlastní vnuk, teprve malé dítě [current_emperor.GetFirstName].\n\nMůj bratranec [yoritomo_minamoto.GetFirstName] se chystá vést rod [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] proti této tyranii. Mám se však připojit k jeho věci, když jsem lepší bojovník a právoplatné místo v čele rodu patří mně? Nebo mám riskovat roztříštění našich sil a svolat celý rod výhradně pod svůj prapor?"
 tgp_genpei_character.1095.a: "S [yoritomo_minamoto.Custom('CZ_FirstNameNoTooltip_I')] nemáme budoucnost. Rode [ruler.GetDynasty.GetNameNoTooltip], ke mně!"
 tgp_genpei_character.1095.a.flavor: "$tgp_genpei_character.1000.a.flavor$"
 join_house_bloc_yoshinaka_tt: "[Concept('house','Rod')|EU] [THIS.House.GetBaseName] se připojí k tvému [Concept('bloc','bloku')|E]"
 tgp_genpei_character.1095.b: "Spolknu tu hořkou pilulku... prozatím."
 tgp_genpei_character.1095.b.flavor: "Hrozba nadvlády rodu [kiyomori_taira.GetDynasty.GetNameNoTooltip] je příliš velká. Rod [ruler.GetDynasty.GetNameNoTooltip] se musí sjednotit, aby jej dokázal porazit."
 tgp_genpei_character.1100.t: "$genpei_intro$ Nezkrotný hořec"
 tgp_genpei_character.1100.desc: "Když [kiyomori_taira.GetFirstName] z rodu [Glossary( 'Taira', 'TAIRA_GLOSS' )] porazil mého otce během [Glossary( 'povstání Heidži', 'HEIJI_REBELLION_GLOSS' )], nezbylo mi než se uchýlit do severních hor a žít jako [Glossary( 'rónin', 'RONIN_GLOSS' )]. Útočiště mi zde poskytl mocný [Glossary( 'Fudžiwara', 'FUJIWARA_GLOSS' )] [hidehira_fujiwara.GetFirstName].\n\n[kiyomori_taira.Custom('CZ_FirstNamePossessiveNoTooltip_F')|U] nadvláda nad císařským dvorem předznamenává éru naprosté převahy rodu [kiyomori_taira.GetDynasty.GetNameNoTooltip]. A jak na tuto hrozbu odpovídá náš přední představitel rodu [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )], [yorimasa_minamoto.GetFirstName]? Svou zbabělostí nám dělá jen ostudu! Naštěstí má můj bratr [yoritomo_minamoto.GetFirstName] na své straně meče samurajských rodů z východu a připravuje se svrhnout tyrana.\n\nZe všeho nejvíc doufám, že mi nadcházející bouře přivede do cesty soupeře hodné mé čepele!"
 tgp_genpei_character.1100.a: "Prozatím budu sloužit [hidehira_fujiwara.Custom('CZ_FirstNameNoTooltip_D')]."
 tgp_genpei_character.1100.b: "Má rodina potřebuje mou podporu."
 tgp_genpei_character.1100.c: "Osud mi určil cestu meče."
 stay_duelist_adventurer: "#help Za každých 20 vítězství v [Concept('single_combat_duel_plural','duelech')|E] se výše uvedený modifikátor posílí#!"
 tgp_genpei_character.2000.t: "$genpei_intro$ Stoupající motýl"
 tgp_genpei_character.2000.desc: "[GetTitleByKey('e_japan').GetBaseNameNoTierNoTooltip|U] je odrazem mé vůle, mé prohnanosti a moci rodu [Glossary( 'Taira', 'TAIRA_GLOSS' )]! Nic mi nedokáže uniknout, až na jedinou věc, kterou dosud nemám: [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName].\n\nMá [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('noriko_taira'))], [noriko_taira.GetFirstName], brzy počne dítě s naším mladým [norihito_tenno.Custom('CZ_TitledFirstName_I')]. Z jejího mocného lůna pak vzejde dědic, v jehož žilách bude kolovat krev rodu [ROOT.Char.GetHouse.GetBaseName]. Dědic, který zadupá do země každého, kdo by se odvážil zpochybnit naši nadvládu, a zajistí našemu rodu věčnou moc!"
 tgp_genpei_character.2000.a: "Prozatím ty ovce uchlácholit."
 tgp_genpei_character.2000.b: "Otrávit studnu..."
 tgp_genpei_character.2000.b.flavor: "Rozšíříš pomluvy o [norihito_tenno.Custom('CZ_TitleAsName_L')], aby případné budoucí vynucené odstoupení z trůnu proběhlo hladčeji."
 every_non_taira_vassal: "Každý [Concept('vassal','vazal')|E] panství [GetTitleByKey('e_japan').GetBaseNameNoTierNoTooltip] pocházející z jiné [Concept('dynasty','dynastie')|E] než [GetDynastyByID('japanese_taira_kanmu').GetName]"
 tgp_genpei_character.2000.c: "Posílit chlapce vydatným mlékem!"
 tgp_genpei_character.2000.c.flavor: "Nový dědic musí být silný a zdravý, má-li usednout na trůn už od narození."
 tgp_genpei_character.2010.t: "$genpei_intro$ Na rozcestí moci"
 tgp_genpei_character.2010.desc: "Dědic mé krve! [new_emperor.GetTitledFirstName|U] přišel na svět a je připraven usednout na [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName]. Stačilo by odsunout [current_emperor.Custom('CZ_TitledFirstName_A')] stranou. Bylo by to spravedlivé, jenže takový krok by mohl vyvolat vzpouru...\n\nTato země se jen hemží zrádci a nespokojenci! Vzpurný rod [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] v čele s [minamoto_ruler.Custom('CZ_FirstName_I')] se dosud nesmířil s porážkou během [Glossary( 'povstání Heidži', 'HEIJI_REBELLION_GLOSS' )]. [motofusa_fujiwara.GetFirstName|U] sice ztratil mnoho ze své moci, ale stále sní o dobách, kdy rod [Glossary( 'Fudžiwara', 'FUJIWARA_GLOSS' )] vládl celému [GetTitleByKey('e_japan').GetBaseNameNoTierNoTooltip]. A co je nejhorší, císařův otec, prohnaný [Glossary( 'džókó', 'JOKO_GLOSS' )] [go_shirakawa.GetFirstName], kdysi můj blízký spojenec, nyní zpochybňuje mé úmysly. Kterou cestou se mám vydat?"
 tgp_genpei_character.2010.a: "Na následcích nezáleží! Dnes začíná nadvláda rodu Taira!"
 tgp_genpei_character.2010.b: "Nejdůležitější je zničit rod [minamoto_ruler.GetDynasty.GetNameNoTooltip]."
 tgp_genpei_character.2010.b.flavor: "Spojíš síly s rodem [fujiwara_ruler.GetDynasty.GetName] a společně rozdrtíte poslední zbytky zrádného rodu [minamoto_ruler.GetDynasty.GetName]."
 tgp_genpei_character.2010.c: "Nadvláda samurajů vyřeší všechny problémy."
 tgp_genpei_character.2010.c.flavor: "Spojíš se s rodem [minamoto_ruler.GetDynasty.GetName] a připravíš úřednické rody, jako je [fujiwara_ruler.GetDynasty.GetName], o poslední naději získat zpět moc."
 tgp_genpei_character.2010.d: "Obnovím své nejpevnější spojenectví."
 tgp_genpei_character.2010.d.flavor: "S [go_shirakawa.GetName] jsme společně překonali dobré i zlé časy a všechny překážky, které nám osud postavil do cesty. Dokážeme to znovu!"
 minamoto_clan_will_respond_to_our_actions: "#warning @warning_icon! [Concept('bloc','Blok')|EU] rodu [GetDynastyByID('japanese_minamoto_seiwa').GetName] na naše kroky jistě zareaguje!#!"
 tgp_genpei_character.3000.t: "$genpei_intro$ Rozptýlená vistárie"
 tgp_genpei_character.3000.desc: "Z [GetTitleByKey('b_kyo').GetBaseNameNoTier] mě odsunuli až do zapadlých končin [GetTitleByKey('c_oki').GetBaseNameNoTierNoTooltip]. Jaká nespravedlnost! Za vším mým utrpením a ponížením rodu [Glossary( 'Fudžiwara', 'FUJIWARA_GLOSS' )] stojí jediný člověk, ten proradný a intrikánský [Glossary( 'Taira', 'TAIRA_GLOSS' )] [kiyomori_taira.GetFirstName]!\n\nKdyž jsme během [Glossary( 'povstání Heidži', 'HEIJI_REBELLION_GLOSS' )] pomohli porazit rod [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )], [kiyomori_taira.GetFirstName] se nám odvděčil podlou zradou. Můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('motozane_fujiwara'))], [motozane_fujiwara.GetFirstName], [Select_CString(motozane_fujiwara.IsFemale,'onemocněla','onemocněl')] a on této slabosti využil k rozdělení našich držav a upevnění vlastní moci. Ani titul [Glossary( 'Daidžó-daidžin', 'DAIJO_DAIJIN_GLOSS' )] mu nestačil! Ve své nestydaté snaze ovládnout trůn provdal vlastní dceru za [norihito_tenno.Custom('CZ_TitledFirstName_A')].\n\nMou jedinou nadějí na svržení tohoto tyrana je prohnaný starý [Glossary( 'džókó', 'JOKO_GLOSS' )] [go_shirakawa.GetFirstName], otec [norihito_tenno.Custom('CZ_TitleAsNameNoTooltip_G')] a náš někdejší spojenec... Nebo snad venkovský [hidehira_fujiwara.GetFirstName] a jeho nepochybně mocný severní rod [hidehira_fujiwara.GetDynasty.GetName]?"
 DAIJO_DAIJIN_GLOSS: "#bold Daidžó-daidžin#! – #EMP velký státní kancléř#! – stál v čele #EMP Daidžó-kan#!, tedy #EMP Státní rady#!. Šlo o vysoce vážený úřad v období Nara (710–794).\n\nTitul obnovil [Glossary( 'Taira', 'TAIRA_GLOSS' )] Kijomori jako nejvyšší postavení mimo císařskou rodinu. Jeho držitel se tak fakticky stal hlavou císařské vlády."
 tgp_genpei_character.3000.a: "O hříších [kiyomori_taira.Custom('CZ_FirstNameNoTooltip_G')] se dozví každý!"
 tgp_genpei_character.3000.a.flavor: "Ještě se přece musí najít někdo s postavením [motofusa_fujiwara.Custom('CZ_TitleAsNameNoTooltip_G')], kdo ctí tradice a výsady aristokracie z [GetTitleByKey('b_kyo').GetBaseNameNoTier]."
 tgp_genpei_character.3000.b: "[go_shirakawa.GetFirstNameNoTooltip|U] ještě může obnovit pořádek."
 tgp_genpei_character.3000.b.flavor: "Starý císař držel kormidlo státní moci dávno předtím, než ses vůbec narodil."
 send_letter_to_go_shirakawa: "Pošleš dopis [go_shirakawa.Custom('CZ_Name_D')]"
 tgp_genpei_character.3000.c: "Všichni z rodu [motofusa_fujiwara.GetDynasty.GetNameNoTooltip], i ti nejprostší, musejí toužit po spravedlnosti."
 tgp_genpei_character.3000.c.flavor: "Ať se vistárie rozrůstá bez zábran od pobřeží k pobřeží a obepne trůn, jak jí po právu náleží!"
 tgp_genpei_character.3010.opening: "Někdejšímu císaři [go_shirakawa.Custom('CZ_NameNoTooltip_D')],"
 tgp_genpei_character.3010.desc: "Země, které jste kdysi vládl, se pomalu rozpadá. Oba mocné samurajské rody již shromažďují veškerou podporu, kterou mohou získat. Vím, že ve vás stále přetrvává hořkost z tyranie rodu [GetDynastyByID('japanese_taira_kanmu').GetName]. Rod [ROOT.Char.GetDynasty.GetName] vás potřebuje. Společně můžeme obnovit autoritu císařské vlády a učinit přítrž svévoli samurajské vrstvy."
 tgp_genpei_character.3010.a: "Proti rodu [GetDynastyByID('japanese_taira_kanmu').GetNameNoTooltip] vám nedokážu pomoci."
 tgp_genpei_character.3010.b: "Máte pravdu... Postavme se jim společně."
 tgp_genpei_character.3100.t: "$genpei_intro$ Zbloudilá vistárie"
 tgp_genpei_character.3100.desc: "Domýšliví příslušníci rodu [Glossary( 'Fudžiwara', 'FUJIWARA_GLOSS' )] z hlavního města se nám kdysi vysmívali. #EMP „Kdo by opustil přepych a paláce [ROOT.Char.GetTopLiege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] a odešel do pustých severních provincií?“#! Jak pošetilí ti úředníci byli...\n\n[motofusa_fujiwara.GetFirstName|U] je dnes [Glossary( 'kampaku', 'KAMPAKU_GLOSS' )] už jen podle jména. Je příliš slabý, aby se postavil prohnanému [kiyomori_taira.Custom('CZ_FirstName_D')], který se sám prohlásil [Glossary( 'Daidžó-daidžin', 'DAIJO_DAIJIN_GLOSS' )] a stal se skutečným vládcem tahajícím za nitky [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName]. Brzy bude rod [Glossary( 'Taira', 'TAIRA_GLOSS' )] nezastavitelný. Kdo ví, kdy si začne dělat nároky také na mé panství? Mám snad právě já zachránit císařskou rodinu z jeho spárů a nastolit nový řád pod vedením rodu [Glossary( 'Fudžiwara', 'FUJIWARA_GLOSS' )]?\n\nMožná se proti tomuto společnému nepříteli osvědčí jako užitečný spojenec i zbloudilý člen rodu [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )], [yoshitsune_minamoto.GetTitledFirstName]..."
 tgp_genpei_character.3100.a: "Bude lepší smířit se se svým současným postavením."
 tgp_genpei_character.3100.b: "Bránit svobodu přece není sobectví!"
 tgp_genpei_character.4000.t: "$genpei_intro$ Vadnoucí chryzantéma"
 tgp_genpei_character.4000.desc: "Přímo před mýma očima se [kiyomori_taira.GetFirstName] stal nezpochybnitelným vládcem Japonska. Jaká pošetilost! Dovolil jsem mu zneužít mé vlastní touhy odstavit regenty z rodu [Glossary( 'Fudžiwara', 'FUJIWARA_GLOSS' )] od moci, jen aby se jí nakonec zmocnil sám.\n\nMůj syn [norihito_tenno.GetTitledFirstName] stále drží [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName], ale jak dlouho ještě? [noriko_taira.GetFirstName|U], jeho [Select_CString(noriko_taira.IsFemale,'manželka','manžel')] a dcera [kiyomori_taira.Custom('CZ_FirstNameNoTooltip_G')], bezpochyby brzy přivede na svět dědice, kterého bude mnohem snazší ovládat.\n\nMůj kdysi bezmezný vliv coby [Glossary( 'džókó', 'JOKO_GLOSS' )] je dnes pouhým stínem minulosti. [motofusa_fujiwara.GetFirstName|U] skončil ve vyhnanství a úřad [Glossary( 'kampaku', 'KAMPAKU_GLOSS' )] se stal jen prázdným titulem. Rod [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] byl během [Glossary( 'povstání Heidži', 'HEIJI_REBELLION_GLOSS' )] rozdrcen rodem [Glossary( 'Taira', 'TAIRA_GLOSS' )]. Jen těžko si lze představit, kdo by se nyní dokázal postavit mocným Tairům..."
 tgp_genpei_character.4000.a: "Tohle už dál trpět nebudu."
 tgp_genpei_character.4000.b: "Prozatím bude nejlepší vyčkávat."
