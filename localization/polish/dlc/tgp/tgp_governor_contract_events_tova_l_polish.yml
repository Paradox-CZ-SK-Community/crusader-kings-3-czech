l_polish:
 unsanctioned_deity: "Nepovolené božstvo"
 unsanctioned_deity_contract: "$unsanctioned_deity$"
 unsanctioned_deity_desc: "Poddaní tohoto hrabství uctívají nepovolené božstvo a po celém panství se šíří zvěsti o štěstí, které jim prý přináší."
 unsanctioned_deity_desc_title: "$task_contract_governance_desc_title$"
 governor_contract_events_tova.0050.t: "$unsanctioned_deity$"
 governor_contract_events_tova.0050.desc: "Ulice [CZProvName(deity_destination,'G')] zaplnily neobvykle početné zástupy lidí. Klanějí se před svatyní nepovoleného božstva a pálí kadidlo. Z celého panství sem proudí rolníci i měšťané, aby přinesli alespoň ty skromné obětiny, které si mohou dovolit. \n\nPokud nezasáhnu, tyto divoké pověry se budou dál nekontrolovaně šířit po celém kraji."
 governor_contract_events_tova.0050.a: "Této záležitosti musím věnovat veškerou pozornost."
 governor_contract_events_tova.0050.a.tt: "Vydej se do [CZProvName(deity_destination,'G')] a prošetři záležitost"
 governor_contract_events_tova.0050.b: "Mám naléhavější starosti..."
 governor_contract_events_tova.0051.desc: "Za pronikavou vůní kadidla se vydávám [CZPrepV(deity_destination.GetNameNoTooltip)] [CZProvName(deity_destination,'L')], prodírám se rušnými ulicemi a nakonec dorazím k oné nepatřičné svatyni. \n\n[ROOT.Char.Custom('RandomPeasantGrievance')|U] Bláto na nohavicích napovídá, že [worshipper.GetSheHe|l] sem [Select_CString(worshipper.IsFemale,'přišla','přišel')] zdaleka. \n\nKdyž se zeptám na božstvo, [worshipper.GetSheHe|l] mi poví, že vypadá jako [ROOT.Char.Custom('RandomVerySmallCreature')|l] a že jeho obydlím je [ROOT.Char.Custom('RandomVerySmallCreatureDwelling')|l] u cesty."
 governor_contract_events_tova.0051.a: "Veřejně uznat toto božstvo."
 governor_contract_events_tova.0051.b: "Rozehnat věřící a spálit svatyni."
 governor_contract_events_tova.0051.c: "Zabavit obětní dary."
 governor_contract_events_tova.0051.d: "Promluvit věřícím do duše."
 governor_contract_events_tova.0051.e: "Ať se o to postarají mniši."
 governor_contract_events_tova.0052.desc_burn: "Moji strážci se rázně probíjejí davem a ty, kdo se jim nestačí klidit z cesty, zasypávají ranami. Na svatyni dopadá pochodeň a brzy se k nebi šlehají plameny. Jejich žár zahání i poslední zbývající věřící. \n\nTeď mohu s jistotou prohlásit, že v hrabství [CZProvName(deity_destination,'G')] byl obnoven pořádek. Pověrčivost ustoupila a rozum může opět vzkvétat."
 governor_contract_events_tova.0052.desc_debunk: "„...A právě proto tato bytost ve skutečnosti #EMP není#! žádným bohem. Každý si své štěstí utváří sám, a to lidskostí a mravným jednáním.“ \n\nDav utichá, ohromen mou výmluvností. Zřetelně vidím okamžik, kdy si všichni uvědomí svůj omyl a začnou se rozcházet."
 governor_contract_events_tova.0052.a: "Tak to má být."
 governor_contract_events_tova.0053.desc_burn: "Moji strážci se pokoušejí prorazit davem, ale k mému údivu se rozzuření věřící začnou bránit! Pochodeň určená ke spálení svatyně padá na zem a nastává chaos. \n\nSe svou družinou jen taktak unikám, než nás pohltí plameny."
 governor_contract_events_tova.0053.desc_debunk: "„...To znamená, že jedinou skutečnou cestou ke štěstí je konat dobro vlastními silami. Zároveň bychom ale neměli jednat jen ve vlastním zájmu. Nuže, o čem že byla řeč?“ \n\nDavem se šíří nesouhlasné mumlání. Někteří si za rukávy schovávají úsměvy, nepochybně posměšné. \n\nTváře mi hoří hanbou. Rychle se otočím a odcházím, než se ještě víc zesměšním."
 governor_contract_events_tova.0053.a: "To se tedy nepovedlo!"
 task_contract_reward_effect_sanction_deity_desc: "Božstvo získá úřední uznání."
 task_contract_reward_effect_claim_offerings_desc: "Zabavíš cennosti ze svatyní."
 task_contract_reward_effect_deity_monks_desc: "Jako pravý guvernér přenecháš řešení problému jiným."
 escaped_justice: "Útěk před spravedlností"
 escaped_justice_contract: "$escaped_justice$"
 escaped_justice_desc: "Zločinec se vyhnul soudnímu předvolání a místo toho uprchl do tohoto hrabství."
 escaped_justice_desc_title: "$task_contract_governance_desc_title$"
 governor_contract_events_tova.0055.t: "$escaped_justice$"
 governor_contract_events_tova.0055.desc: "Dozvídám se, že [escapee.GetTitledFirstName] zanedbává své povinnosti a dokonce zpronevěřuje peníze z královské pokladnice. \n\nKdyž však dorazí předvolání k mému soudu, [escapee.GetTitledFirstName] svolá své ozbrojence a uprchne do divočiny, kde teď zabírá chalupu jakéhosi chudého rolníka! \n\nJejich [escapee.Custom('MistressMaster')|l] se může spolehnout na ozbrojené stráže, připravené bránit úkryt za každou cenu. Je zřejmé, že bez mého zásahu se [escapee.GetTitledFirstName] nevzdá."
 governor_contract_events_tova.0055.a: "Musím tam okamžitě vyrazit!"
 governor_contract_events_tova.0055.a.tt: "Vydej se do [CZProvName(escapee_destination,'G')] a prošetři záležitost"
 governor_contract_events_tova.0055.b: "Ta odporná krysa se dřív nebo později ukáže..."
 governor_contract_events_tova.0056.desc: "„Ani krok blíž!“ vykřikne [Select_CString(thug.IsFemale,'lučištnice','lučištník')] a z úkrytu na nás namíří luk. Jako kryt slouží [ROOT.Char.Custom('OutdoorsHidingPlace')|l]. Za hrozivou postavou zahlédnu budovu, v níž se ukrývá zločinec, kterého pronásleduji. \n\nPraskání větviček v hustém křoví naznačuje, že na můj příchod čeká i hrstka dalších ozbrojených stráží."
 governor_contract_events_tova.0056.a: "Přesvědčit [escapee.Custom('CZ_TitledFirstName_A')], aby se [Select_CString(escapee.IsFemale,'dostavila','dostavil')] před soud."
 governor_contract_events_tova.0056.b: "Pobít [escapee.Custom('CZ_TitledFirstName_A')] i [Select_CString(escapee.IsFemale,'její','jeho')] ozbrojence."
 governor_contract_events_tova.0056.c: "Mohu nabídnout mírnější trest."
 governor_contract_events_tova.0056.d: "Vypovědět [Select_CString(escapee.IsFemale,'ji','ho')] ze země."
 governor_contract_events_tova.0057.desc_persuade: "„Podívej se na sebe! Takhle se chová jen [Select_CString(escapee.IsFemale,'šílená žena','šílený muž')]. Opravdu chceš, aby si lidé dynastii [escapee.GetDynastyName] pamatovali právě takhle? Ušetři své příbuzné hanby a pojď se mnou.“ \n\nMožná zaberou má slova, možná tón mého hlasu, ale [escapee.GetTitledFirstName] nakonec vychází z úkrytu. Zvedá ruce na znamení, že se vzdává."
 governor_contract_events_tova.0057.desc_slay: "Křehký klid se tříští v řevu bojových pokřiků a řinčení oceli, jakmile se moji muži vrhnou na stráže [escapee.Custom('CZ_TitledFirstName_G')]. \n\nOdpor rychle utichá. Nepřátelé padají k zemi s rozsekanou zbrojí a jejich krev se vsakuje do hlíny. Nakonec mi předvedou [escapee.Custom('CZ_TitledFirstName_A')]. Jediným přesným úderem oddělím hlavu od těla."
 governor_contract_events_tova.0057.a: "Tady už mám hotovo!"
 governor_contract_events_tova.0058.desc_persuade: "Otevřu ústa, ale marně hledám jediný přesvědčivý důvod, proč by se někdo měl nechat uvěznit. Slyším se, jak říkám: „Nucený pobyt ve vězení výborně utužuje charakter!“ V tu chvíli je mi jasné, že [escapee.Custom('CZ_TitledFirstName_A')] k dobrovolnému návratu nepřesvědčím. \n\nAť tedy [escapee.GetTitledFirstName] pozná, jak příjemné je hnít v úkrytu."
 governor_contract_events_tova.0058.desc_slay: "Křehký klid se tříští v řevu bojových pokřiků a řinčení oceli. \n\nMoji muži se udatně vrhají na nepřátele s připravenými meči, ale jejich údery protínají jen vzduch a sami nedokážou odrážet protiútoky. \n\nSleduji, jak moji muži ustupují, a dochází mi, že nezbývá než se stáhnout."
 governor_contract_events_tova.0058.a: "Taková ostuda..."
 forced_conscription: "Nucené odvody"
 forced_conscription_contract: "$forced_conscription$"
 forced_conscription_desc: "Svolej odvedence a připrav své vojsko na válku."
 forced_conscription_desc_title: "$task_contract_governance_desc_title$"
 governor_contract_events_tova.0060.t: "$forced_conscription$"
 governor_contract_events_tova.0060.desc: "„V dobách územní expanze je naší povinností svolat vojsko pro případ války,“ stojí na začátku listu od mého vládce. \n\n„Nemusí být vycvičeni. Nemusí být vybaveni. Předvoj tak početný, že nepřítele převálcuje pouhou svou silou, zlomí jakýkoli odpor.“ \n\nRolnické rodiny pod mou správou už vydaly muže, kteří stojí v čele svých domácností. K odvodu tak zbývají pouze jejich synové."
 governor_contract_events_tova.0060.a: "Nepřátele přemůžeme prostou silou!"
 governor_contract_events_tova.0060.a.tt: "Pokračuješ v prošetřování záležitosti"
 governor_contract_events_tova.0060.b: "Kvůli takovým cílům svůj lid obětovat nebudu."
 governor_contract_events_tova.0061.desc: "Z výšky shlížím na město rozprostírající se pode mnou. V oknech a dveřích vzdálených domů se mihotají světla. \n\nRodiny společně večeří v bezpečí svých domovů. Jejich osudy, stejně jako osudy všech mých poddaných, mám ve svých rukou."
 governor_contract_events_tova.0061.a: "Vyplatit rodinám odškodnění."
 governor_contract_events_tova.0061.b: "Odvléct jejich syny z domovů násilím!"
 governor_contract_events_tova.0061.c: "Odvolat se na synovskou úctu a přesvědčit je, aby narukovali."
 governor_contract_events_tova.0061.d: "Možná je ušetřím, pokud přistoupí na výměnu."
 combat_train_monks: "Bojový výcvik mnichů"
 combat_train_monks_contract: "$combat_train_monks$"
 combat_train_monks_desc: "V klášteře tohoto hrabství žije několik mnichů, kteří by po náležitém výcviku mohli posílit obranu panství."
 combat_train_monks_desc_title: "$task_contract_governance_desc_title$"
 governor_contract_events_tova.0065.t: "$combat_train_monks$"
 governor_contract_events_tova.0065.desc: "Donesly se ke mně zprávy, že v klášteře [CZPrepV(monks_destination.GetNameNoTooltip)] [CZProvName(monks_destination,'L')] žijí mniši, kteří vynikají v boji zblízka. Bojová umění zřejmě provozují jako formu meditace, ale jejich dovednosti by snad mohly lépe posloužit panství a ochraně jeho hranic. \n\nNejprve však musím zjistit, co v těchto mniších skutečně vězí."
 governor_contract_events_tova.0065.a: "Uvidíme, co jsou tihle mniši zač."
 governor_contract_events_tova.0065.a.tt: "Vydej se do [CZProvName(monks_destination,'G')] a dohlédni na jejich výcvik"
 governor_contract_events_tova.0065.b: "Ne, ať se dál věnují mnišskému životu."
 governor_contract_events_tova.0066.desc: "Vstupuji do kláštera právě ve chvíli, kdy se tu koná cvičný souboj. \n\nOzve se hlasitý výkřik, pořádná rána a jeden z mnichů se poroučí k zemi, až se kolem něj zvedne oblak prachu. Všichni jásají a já se přidávám. \n\nVítěz očividně patří mezi nejlepší bojovníky celého kláštera. Když s ním promluvím, hrdě se pochlubí, že právě on učí bojovat ostatní."
 governor_contract_events_tova.0066.a: "Předvést své umění v boji zblízka."
 governor_contract_events_tova.0066.b: "Pochlubit se svými válečnými úspěchy."
 governor_contract_events_tova.0066.c: "Do #EMP nejmenších podrobností#! vysvětlit, jak účinné mohou zbraně být."
 governor_contract_events_tova.0066.d: "Můj maršál si s tím poradí."
 governor_contract_events_tova.0066.tt_success_desc: "Mniši jsou ohromeni"
 governor_contract_events_tova.0066.tt_success: "Tím se zpřístupní příznivé výsledky"
 governor_contract_events_tova.0066.tt_failure_desc: "Mniši #bold nejsou#! ohromeni"
 governor_contract_events_tova.0067.desc: ""
 governor_contract_events_tova.0067.desc_martial: "Kolem mě a mého soupeře se rychle utvoří kruh přihlížejících. \n\nSotva se ukloníme, už se chystám k úderu. Neváhám ani okamžik, vyrážím vpřed a srážím mnicha k zemi. V tom je rozdíl mezi žákem a mistrem! \n\nSouboj tak končí téměř dřív, než vůbec začal. Přihlížející teď napjatě čekají, co jim povím."
 governor_contract_events_tova.0067.desc_diplomacy: "„...A když jsem přišel o meč, vrhl jsem se na toho páchnoucího bídáka, s nímž jsem měl bojovat, a jeho hlava se zblízka seznámila s mými pěstmi!“ \n\nZ fascinovaných výrazů přihlížejících je zřejmé, že jsem mnichy přesvědčil o svých schopnostech i autoritě."
 governor_contract_events_tova.0067.desc_learning: "„Samotná síla úderu dokáže lámat kosti, i když čepel nepronikne zbrojí! Právě tady záleží na šířce čepele a materiálu, z něhož je vyrobena...“ \n\nSvůj výklad prokládám dostatkem běžně známých pojmů, aby mi rozuměl i ten nejprostší laik. Když skončím, není pochyb, že jsem mnichy svými argumenty dokonale přesvědčil. \n\nTeď pozorně naslouchají každému mému slovu."
 governor_contract_events_tova.0067.a: "Všichni by měli sloužit v mém vojsku!"
 governor_contract_events_tova.0067.b: "Z tohoto mnicha by mohl být schopný rytíř."
 governor_contract_events_tova.0067.c: "Udělám z těchto mnichů bojovníky."
 governor_contract_events_tova.0067.d: "Rozmístím zde vojáky, aby pomohli opevnit okolní kraj."
 governor_contract_events_tova.0068.desc: ""
 governor_contract_events_tova.0068.desc_martial: "Předstupuji před mnichy se vztyčenou hlavou a vypjatou hrudí, připraven předvést jim pořádnou podívanou. \n\nUkloníme se, ale než se vůbec stačím narovnat, soupeř se na mě s hlasitým výkřikem vrhá! Zahlédnu jen [Select_CString(warrior_monk.IsFemale,'její','jeho')] dlaň, která se bleskově vymrští vpřed a udeří mě přímo do hrudi. Rána mi vyrazí dech a srazí mě na zem. \n\nLežím na zádech, lapám po dechu a přemýšlím, z jakého horského pramene ti mniši asi pijí vodu, že mají takovou sílu."
 governor_contract_events_tova.0068.desc_diplomacy: "„Takže všechno to začalo, když jsem byl ještě mladý...“ \n\nAni se pořádně nerozmluvím, a už si všímám, že většina posluchačů ztratila zájem. Dav přede mnou povážlivě prořídl. \n\nPokusy zachránit situaci všechno jen zhoršují. Jeden ze starších mnichů dokonce usne!"
 governor_contract_events_tova.0068.desc_learning: "„...Abychom však skutečně pochopili, jak zbraně fungují, musíme se nejprve seznámit s dějinami kovářství.“ \n\nPouštím se do výkladu, ale brzy zjišťuji, že nikdo z přítomných nechápe, o čem vlastně mluvím, natož proč by to mělo být důležité!"
 governor_contract_events_tova.0068.a: "Jaké zklamání..."
