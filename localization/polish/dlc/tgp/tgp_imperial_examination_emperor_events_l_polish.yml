l_polish:
 emperor_imperial_examination.100.t: "V posvátné úctě"
 emperor_imperial_examination.100.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], tvá vznešenost a moudrost nemají obdoby. Stanout ve tvé přítomnosti je pro mě tou nejvyšší ctí.“ Tato slova pronáší s posvátnou úctou [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)], [examination_character_2.GetTitledFirstName]. „Kéž při této zkoušce prokážu, že ti věrně sloužím.“\n\n„[ROOT.Char.Custom('GetDaughterSon')|U] Nebes i moc a nádhera [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_G')] nechť přetrvají deset tisíc let!“"
 emperor_imperial_examination.100.a: "Věrnost je ctnost nade všechny ostatní."
 emperor_imperial_examination.100.b: "Chvála je pomíjivá, skutečnou hodnotu mají činy."
 imperial_examination.advantage.other.tt: "Získá [Concept('exam_advantage','výhodu u zkoušky')|E]"
 imperial_examination.advantage.dynasty_legacy.tt: "Protože máš odemčený [Concept('dynasty_perk','dynastický odkaz')|E] [GetDynastyPerk( 'tgp_chinese_legacy_1' ).GetName], zahájíš aktivitu s [Concept('exam_advantage','výhodou u zkoušky')|E]"
 emperor_imperial_examination.200.t: "Vybraný klenot"
 emperor_imperial_examination.200.desc: "„Tvé ctihodné Veličenstvo,“ pronáší uctivě [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)], [examination_character_2.GetTitledFirstName]. „Během svých cest po [concubine_origin.Custom('CZ_LandedNameNoTier_L')] jsem se [Select_CString(examination_character_2.IsFemale,'setkala','setkal')] s váženou rodinou z rodu [examination_character_1.GetHouse.GetName] a [Select_CString(examination_character_2.IsFemale,'rozmlouvala','rozmlouval')] se staršími [examination_character_1.GetCulture.Custom('CZ_Adjective_ee')|l] kultury.“\n\n„Požádali mě, abych pro službu ve tvém vnitřním paláci [Select_CString(examination_character_2.IsFemale,'vybrala','vybral')] [Select_CString(examination_character_1.IsFemale,'urozenou dámu','urozeného pána')]. Má volba padla na [examination_character_1.Custom('CZ_FirstName_A')], [Select_CString(examination_character_1.IsFemale,'ženu','muže')] neobyčejného půvabu. Doufáme, že se ti zalíbí, ó [Select_CString(ROOT.Char.IsFemale,'Dcero','Synu')] Nebes.“"
 emperor_imperial_examination.200.a: "Ať vstoupí do mého harému."
 emperor_imperial_examination.200.b: "Raději mi pověz o svých cestách."
 emperor_imperial_examination.200.c: "Vypadá snad můj palác jako nevěstinec?"
 emperor_imperial_examination.300.t: "Dar rodového dědictví"
 emperor_imperial_examination.300.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], vaše vznešená moudrost je nezměrná.“ [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)|U], [examination_character_2.GetTitledFirstName], přede mnou padá tváří k zemi. „Přináším vám skromný dar, vzácný předmět, který může zdobit váš palác.“\n\n„Jde o rodovou památku rodu [examination_character_2.GetHouse.GetName]: [newly_created_artifact.GetName]. Nežádáme nic jiného než to, aby nás vaše svrchované Veličenstvo uznalo za své věrné služebníky.“"
 emperor_imperial_examination.300.a: "Dar hodný mého postavení."
 emperor_imperial_examination.300.b: "Podřadné řemeslné dílo. Zbavte se ho."
 emperor_imperial_examination.300.c: "Rod [examination_character_2.GetHouse.GetNameNoTooltip] by se měl raději soustředit na zkoušku."
 emperor_imperial_examination.400.t: "Předčítání z letopisů"
 emperor_imperial_examination.400.desc: "Zkoušející i účastníci, kteří se dostavili do paláce, stojí shromážděni pohromadě. S napětím pročítají své texty a nervózně si mezi sebou šeptají. Je jen správné, abych jim jako [ROOT.Char.Custom('GetDaughterSon')|l] Nebes [Select_CString(ROOT.Char.IsFemale,'předala','předal')] trochu nadčasové moudrosti. Na mé znamení se síň ponoří do uctivého ticha. Všichni čekají.\n\nPokynu směrem k policím s knihami a služebníci přinášejí..."
 emperor_imperial_examination.400.a: "...letopisy pojednávající o [ROOT.Char.Custom('GetRandomAnnalsPassage')|l]."
 emperor_imperial_examination.400.b: "...básnické dílo [ROOT.Char.Custom('GetRandomPoetryPassage')|U]."
 emperor_imperial_examination.400.c: "...pojednání o obřadech [ROOT.Char.Custom('GetRandomRitesPassage')|U]."
 every_palace_entrant: "Každý účastník palácové zkoušky"
 custom_every_examiner: "Každý zkoušející"
 emperor_imperial_examination.500.t: "Poezie [examination_character_2.Custom('CZ_FirstNameNoTooltip_G')]"
 emperor_imperial_examination.500.desc: "„Nebeské Veličenstvo, [Select_CString(examination_character_2.IsFemale,'složila','složil')] jsem báseň na počest vaší nekonečné milosti.“ [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)|U], [examination_character_2.GetTitledFirstName], rozevírá knihu a začíná přednášet:\n\n#EMP „[examination_character_2.Custom('GetAdventureNameBand')|U] času [examination_character_2.Custom('GeneratePoem_Title_Fragment_Season')|l], [examination_character_2.Custom('GetAdventureNameBand')|l] [examination_character_2.Custom('GetAdventureNameSuffix')|l] a [examination_character_2.Custom('GetAdventureNameSuffix')|l] — [examination_character_2.Custom('GetAdventureNamePrefixes')|l] mezi [poetry_province.Custom('GetTerrainTypePlural')|l], [examination_character_2.Custom('GetRandomSmallPreciousItem')|l] v jejich rukou. Z [poetry_county.Custom('CZ_LandedNameNoTier_G')], mezi [poetry_province.Custom('ProvinceCompliment')|l] [examination_character_2.Custom('GeneratePoem_Title_Fragment_Noun')|l], v [examination_character_2.Custom('FormalComplimentAdjective')|l] [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_L')].“#!\n\n[examination_character_2.GetShortUIName|U] nyní netrpělivě očekává můj verdikt."
 emperor_imperial_examination.500.a: "Tvé verše jsou střídmé, přesto plné významu."
 emperor_imperial_examination.500.b: "Tvá slova jsou stejně prázdná jako tvé zásluhy."
 emperor_imperial_examination.600.t: "Dobrá nálada"
 emperor_imperial_examination.600.desc: "Zatímco přehlížím shromážděný dav, jedna z přítomných postav, [examination_character_2.GetTitledFirstName], se natolik zabere do vyprávění žertů, že vůbec nevnímá své okolí. Pomalu couvá a nevědomky se přibližuje přímo ke mně. Právě přitom nadšeně vykřikne: „...a tak [examination_character_2.Custom('GetAdventureNameBand')|l] přišel o [examination_character_2.Custom('GetAdventureNameSuffix')|l]!“\n\nJemně si odkašlu.\n\nVšichni okolo náhle zmlknou. [examination_character_2.GetFirstNameNoTooltip|U] strne hrůzou."
 emperor_imperial_examination.600.a: "Velice zábavné."
 emperor_imperial_examination.600.b: "Dost bylo žertování. Soustřeď se na zkoušku."
 emperor_imperial_examination.600.c: "To je urážka! Okamžitě odejdi."
 emperor_imperial_examination.700.t: "Stříbrný dar"
 emperor_imperial_examination.700.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U],“ oslovuje mě [examination_character_2.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)|l], a hluboce se uklání až k zemi. „Můj rod [examination_character_2.GetHouse.GetName] udržuje obchodní styky s kupci na významných trasách, mezi něž patří [GetSituationType('silk_road_situation').GetName|l] i $sea_yellow_sea$. Díky těmto stykům vám mohu nabídnout skromný dar.“\n\n„Přináším truhlici stříbrných mincí z hrabství [silver_county.Custom('CZ_LandedNameNoTier_G')]. Nesou znak [silver_county_top_liege.Custom('CZ_TitleAsNameNoTooltip_G')], vládce [silver_county_top_liege.GetPrimaryTitle.Custom('CZ_LandedName_G')].“"
 emperor_imperial_examination.700.a: "Velkoryse tento dar přijímám."
 emperor_imperial_examination.700.b: "Pověz mi něco o [silver_county_top_liege.GetPrimaryTitle.Custom('CZ_LandedName_L')]."
 emperor_imperial_examination.700.c: "Rozdělte si peníze mezi sebe a použijte je na studium."
 situation_type_silk_road_situation: "Hedvábná stezka"
 situation_type_silk_road_situation_desc: "$game_concept_silk_road_situation_desc$"
 emperor_imperial_examination.800.t: "Eunuch jako tribut"
 emperor_imperial_examination.800.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], dovolte svému pokornému služebníkovi, aby vás vyrušil, a račte mu odpustit,“ pronáší [examination_character_2.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)|l], a hluboce se uklání s rukama sepjatýma v tradičním pozdravu gongšou. „Představuji vám [examination_character_1.Custom('CZ_FirstName_A')]. Je to [GetTrait('eunuch_1').GetName( GetNullCharacter )|l] neobyčejných schopností, který již dlouhá léta věrně slouží rodu [examination_character_2.GetHouse.GetName].“\n\n„Nabízíme vám jeho služby v paláci. Kéž [ROOT.Char.GetPrimaryTitle.GetNameNoTier|U] pod vaší laskavou vládou vzkvétá.“"
 emperor_imperial_examination.800.a: "Najdeme pro něj vhodné místo."
 emperor_imperial_examination.800.b: "Mohl by se stát zkoušejícím."
 emperor_imperial_examination.800.c: "Svého služebníka si nech."
 becomes_imperial_examiner.tt: "Stane se zkoušejícím"
 emperor_imperial_examination.900.t: "[examination_character_2.Custom('ComplimentAdjective')|U] [Select_CString(examination_character_2.IsFemale,'služebnice','služebník')]"
 emperor_imperial_examination.900.desc: "„Nebeské Veličenstvo, děkujeme vám za tuto hostinu,“ pronáší [examination_character_1.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', examination_character_1)|l], a hluboce se uklání. Po boku stojí další osoba. „Dovolte mi představit [examination_character_1.Custom2('RelationToMeShort', examination_character_2)|l], [examination_character_2.GetFirstName]. Přináší vám skromný dar z mého domova v [origin_county.Custom('CZ_LandedNameNoTier_L')] – [examination_character_1.Custom('GetExpensiveDrink')|l].“\n\n„Kromě nápoje vám však nabízím také služby této osoby. Díky znalostem v oblasti [examination_character_2.Custom('highest_skill_noun')|l] bude paláci nepochybně k užitku.“"
 emperor_imperial_examination.900.a: "Takové schopnosti jsou vítány."
 emperor_imperial_examination.900.b: "Tobě budou tyto služby užitečnější."
 emperor_imperial_examination.1000.t: "Zahraniční talent"
 emperor_imperial_examination.1000.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], přicházím před tebe s pokornou vděčností,“ pronáší [examination_character_2.GetTitledFirstName]. Z úst návštěvy zaznívá bezchybná [chinese.GetLanguage.GetName|l]. „Ačkoli jsem se [Select_CString(examination_character_2.IsFemale,'narodila','narodil')] do [examination_character_2.GetCulture.Custom('CZ_AdjectiveNoTooltip_ee')|l] kultury a [Select_CString(examination_character_2.IsFemale,'vyrůstala','vyrůstal')] s jejím jazykem, díky tvé milosti jsem se [Select_CString(examination_character_2.IsFemale,'dostala','dostal')] až sem. Netoužím po ničem jiném než sloužit [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_D')].“\n\n„Proto jsem si [Select_CString(examination_character_2.IsFemale,'osvojila','osvojil')] jazyk nebes — [chinese.GetLanguage.GetName|l] — jako důkaz pokory, kterou mi vštípila [examination_character_2.GetCulture.GetName|l] kultura.“"
 emperor_imperial_examination.1000.a: "Tvé úsilí nezůstane bez uznání."
 emperor_imperial_examination.1000.b: "Takové opičení od někoho z [examination_character_2.GetCulture.Custom('CZ_AdjectiveNoTooltip_ee')|l] kultury tu nemá co dělat."
