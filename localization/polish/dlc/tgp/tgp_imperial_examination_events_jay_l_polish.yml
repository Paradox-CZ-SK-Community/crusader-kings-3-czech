l_polish:
 imperial_examination_jay.0010.t: "Spřízněné duše"
 imperial_examination_jay.0010.desc: "„[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] jsi vidět [friends_child.Custom('CZ_TitledFirstName_A')]!“ směje se [friend.GetTitledFirstName], s [Select_CString(friend.IsFemale,'níž','nímž')] si jako další rodič během posledních dní skvěle rozumím. „[Select_CString(friends_child.IsFemale,'Má dcera celé dny žadonila','Můj syn celé dny žadonil')|U] o domácího mazlíčka. Prý to musí být [ROOT.Char.Custom('SmallAnimal')|l]. A co myslíš, že jsem pak [Select_CString(friend.IsFemale,'našla','našel')] pod polštářem? Samozřejmě že se tam něco hýbalo a pištělo!“\n\nSpolečně propukneme ve smích. Jaká škoda, že se naše cesty budou muset brzy rozejít!"
 imperial_examination_jay.0010.a: "Naše přátelství tím však neskončí!"
 imperial_examination_jay.0010.b: "Musíme naše děti seznámit!"
 imperial_examination_jay.0010.c: "Bohužel tu nejsme kvůli zábavě."
 imperial_examination_jay.0040.t: "Lišky v zahradě"
 imperial_examination_jay.0040.desc: "Vrabci vesele štěbetají na slunci a barevní kapři čeří hladinu jezírka. Pak se však po zahradní pěšině bezohledně přišourají dvě postavy a vyplaší všechny ptáky i ryby. První z nich poznávám jako [Select_CString(examiner.IsFemale,'jednu ze zkoušejících','jednoho ze zkoušejících')]. Druhou je [parent.GetTitledFirstName], [cheater_child.Custom2('RelationToMe', parent)|l] [cheater_child.Custom('CZ_TitledFirstName_G')].\n\n[parent.GetFirstNameNoTooltip|U] nenápadně vsune cinkající měšec do záhybů oděvu [examiner.Custom('CZ_FirstName_G')]. Zkoušející pak vytáhne list s odpověďmi a začne vykládat, jak #EMP „pilně“#! se [cheater_child.GetTitledFirstNameNoTooltip] jistě [Select_CString(cheater_child.IsFemale,'připravovala','připravoval')]."
 imperial_examination_jay.0040.a: "Také se do toho podvodu zapojím."
 imperial_examination_jay.0040.b: "Tohle zjištění by se mohlo hodit."
 imperial_examination_jay.0040.c: "Chci mít hlavně klid."
 imperial_examination_jay.0080.t: "Nešťastný pád"
 imperial_examination_jay.0080.desc: "Zkoušející [examiner.GetTitledFirstName] by [Select_CString(examiner.IsFemale,'měla','měl')] vědět, že s takovou hromadou věcí se neběhá! Ještě před okamžikem se [Select_CString(examiner.IsFemale,'řítila','řítil')] chodbou s vratkou hromadou písemek a štětců v náručí, když tu se s pronikavým výkřikem poroučí k zemi. Všude kolem se rozletí papíry a psací potřeby.\n\nJeden ze spadlých listů upoutá mou pozornost. Je to zkoušková práce, kterou [Select_CString(child.IsFemale,'odevzdala','odevzdal')] [child.Custom2('MyCharacterIntroduction', ROOT.Char)]. Chyby jsou patrné už na první pohled..."
 imperial_examination_jay.0080.a: "„Ach ne! [Select_CString(examiner.IsFemale,'Rozlila','Rozlil')|U] jsi na ty písemky inkoust!“"
 imperial_examination_jay.0080.a.success: "[examiner.GetShortUIName|U] vezme vinu na sebe"
 imperial_examination_jay.0080.a.failure: "[examiner.GetShortUIName|U] si všimne, co jsi [Select_CString(ROOT.Char.IsFemale,'provedla','provedl')]"
 imperial_examination_jay.0080.b: "„[examiner.Custom('CZ_FirstNameNoTooltip_V')|U]! Jsi v pořádku?!“"
 imperial_examination_jay.0080.c: "„Hahaha, ty nešiko!“"
 imperial_examination_jay.0110.t: "Zkoušející ověšený šperky"
 imperial_examination_jay.0110.desc: "Na stole před námi stojí [ROOT.Char.Custom('RegionalDrink')|l] a zkoušející [examiner.GetFirstName] se se mnou dává do řeči. Vůně [Select_CString(examiner.IsFemale,'jejího','jeho')] parfému přitom přehlušuje i samotný nápoj. Při každém doušku zacinká šperk zavěšený kolem [Select_CString(examiner.IsFemale,'jejího','jeho')] krku.\n\n„Tenhle kousek,“ usměje se [examiner.GetFirstNameNoTooltip], „jsem [Select_CString(examiner.IsFemale,'dostala','dostal')] jako #EMP „dar“#! od jednoho bývalého studenta.“"
 imperial_examination_jay.0110.a: "Nu, #EMP mně#! zase [Select_CString(child.IsFemale,'věnovala','věnoval')] dar [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))|l], [child.GetTitledFirstNameNoTooltip]."
 imperial_examination_jay.0110.b: "Ten šperk je k ničemu. Dovol, ať se ho #EMP zbavím#!."
 imperial_examination_jay.0110.b.tt: "Získáš náhrdelník, [Concept('artifact','artefakt')|E] poskytující [Concept('prestige','prestiž')|E]"
 imperial_examination_jay.0110.b.equipped_tt: "Získáváš artefakt [bribed_necklace.GetName] od [examiner.Custom('CZ_TitledFirstName_G')]."
 imperial_examination_jay.0110.c: "S takovými [Select_CString(examiner.IsFemale,'ženami','muži')] se nestýkám."
 bribed_necklace_name: "Elegantní náhrdelník"
 bribed_necklace_desc: "Tento náhrdelník je jednoduchým, avšak elegantním šperkem."
 imperial_examination_jay.0120.t: "Zázračné dítě"
 imperial_examination_jay.0120.desc: "Zkoušející [examiner.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', examiner)|l], se ke mně blíží a hluboce se uklání. „[child.GetTitledFirstName|U] je [Select_CString(child.IsFemale,'tvá dcera','tvůj syn')], že ano?“\n\nPo mé odpovědi se úklona ještě prohloubí. „Dosavadní výsledky [child.Custom('CZ_FirstNameNoTooltip_G')] na mě udělaly nesmírný dojem. Takové dítě je skutečnou chloubou rodu [ROOT.Char.GetHouse.GetName]. Je vidět, že jsi jeho výchově [Select_CString(ROOT.Char.IsFemale,'věnovala','věnoval')] velkou péči!“"
 imperial_examination_jay.0120.a: "O učenosti rodu [ROOT.Char.GetHouse.GetNameNoTooltip] ví každý!"
 imperial_examination_jay.0120.b: "Proč [Select_CString(child.IsFemale,'jí','mu')] nepomoci dál rozvíjet nadání?"
 imperial_examination_jay.0120.c: "„Vyřiď [Select_CString(child.IsFemale,'jí','mu')], jak jsem na [Select_CString(child.IsFemale,'ni','něj')] [Select_CString(ROOT.Char.IsFemale,'pyšná','pyšný')], zkoušející.“"
 imperial_examination_jay.0120.d: "Všichni poznají, jaké schopnosti má [child.GetTitledFirstNameNoTooltip]!"
 imperial_examination_jay.0170.t: "Medová slova"
 imperial_examination_jay.0170.desc: "„Rod [ROOT.Char.GetHouse.GetName] je skutečným domovem ctnosti,“ pronáší zkoušející [examiner.GetFirstName] a přistupuje blíž. Ruce se nervózně pohybují a pohled neustále těká kolem nás. „Jsem [Select_CString(examiner.IsFemale,'přesvědčená','přesvědčený')], že [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child'))|l], [child.GetTitledFirstName], by s trochou pomoci [Select_CString(child.IsFemale,'zkoušku jistě složila','zkoušku jistě složil')]. [Select_CString(examiner.IsFemale,'Ráda','Rád')|U] bych tu pomoc [Select_CString(examiner.IsFemale,'poskytla','poskytl')], kdybys pro mě na oplátku něco [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')].“\n\nPřes veškerou opatrnost, s níž [examiner.GetFirstNameNoTooltip] jedná, si nás ostatní rodiče a starší začínají zvědavě prohlížet."
 imperial_examination_jay.0170.a: "Veřejné pokárání je na místě."
 imperial_examination_jay.0170.b: "[child.GetFirstNameNoTooltip|U] žádnou pomoc k úspěchu nepotřebuje!"
 imperial_examination_jay.0170.b.tt: "[child.GetShortUIName|U] podle výsledku zkoušky [Select_CString(child.IsLocalPlayer,'získáš nebo ztratíš','získá nebo ztratí')] více [Concept('prestige','prestiže')|E] a [Concept('merit','zásluh')|E]"
 imperial_examination_jay.0170.c: "[child.GetFirstNameNoTooltip|U] z toho bude mít užitek. Ať si lidé povídají."
