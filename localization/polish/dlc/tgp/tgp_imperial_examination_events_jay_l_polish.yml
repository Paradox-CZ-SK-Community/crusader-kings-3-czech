 tgp_slapback_modifier: "Obránce rodové cti"
 tgp_slapback_modifier_desc: "Tato postava je více než ochotná pustit se do sporu na obranu cti své rodiny."
 tgp_studious_house_modifier: "Učený rod"
 tgp_studious_house_modifier_desc: "Členové tohoto rodu požívají značné úcty díky své pověsti vzdělanců.\n[Concept('characters','Postavy')|EU] získají při zahájení [Concept('imperial_examination','úřednické zkoušky')|E] zdarma jednu [Concept('exam_advantage','výhodu u zkoušky')|E]."
