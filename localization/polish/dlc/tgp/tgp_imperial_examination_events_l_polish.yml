 imperial_examination.5500.t.success: "Úspěch!"
 imperial_examination.5500.t.great_success: "Velký úspěch!"
 imperial_examination.5500.t.critical_success: "Kritický úspěch!"
 imperial_examination.5500.t.failure: "Selhání!"
 imperial_examination.5500.desc.success_martial: "S —#EMP THONK#!!— šíp se pevně zaboří do terče. Z přihlížejících se ozve zamumlání souhlasu. Je zřejmé, že jsem udělal dojem na dav."
 imperial_examination.5500.desc.success_learning: "Učení mých učitelů se mi jasně vynořuje v mysli a pasáže z textů se snadno vybavují z paměti."
 imperial_examination.5500.desc.safe_martial: "Šíp dopadne na okraj terče. Zásah je mělký, takže ocas šípu mírně klesne."
 imperial_examination.5500.desc.safe_learning: "Opakuji známá rčení, která si pamatuji z četby, ale nijak je nerozvádím."
 imperial_examination.5500.desc.failed_martial: "Ještě dříve, než peří šípu sáhne můj chránič paže, vím, že netrefí, a sleduji, jak mine roh terče, než za ním zmizí."
 imperial_examination.5500.desc.failed_classics: "S potížemi se snažím vybavit lekce, které mě učili. Úryvky z důležitých textů jako by byly vymazány z paměti."
 imperial_examination.5500.desc.hegemon_positive: "\n\n[host.GetTitleAsNameNoTooltip|U] se na mě podívá, [host.Custom('quirk_pos_pp')|l]. „Velmi dobře.“"
 imperial_examination.5500.desc.hegemon_negative: "\n\n[host.GetTitleAsNameNoTooltip|U] se na mě podívá, [host.Custom('quirk_neg_pp')|l]. „Jsi propuštěn.“"
 imperial_examination.5500.a: "Tento okamžik si vždy zapamatuji."
 imperial_examination.7000.t: "Vyhlášení výsledků"
 imperial_examination.7000.desc.emperor: "Bubny akademie znovu zazní při vyhlášení výsledků. Uchazeči se shromažďují před vyvěšenými výsledky, tiší v očekávání a úctě, doufajíce, že vyšplhali po schodech k vysokému úřadu.\n\nPalácoví uchazeči stojí před všemi svými vrstevníky jako příklad a odměna, zatímco nižší studenti se pak sklánějí."
 imperial_examination.7000.desc.cheater: "Bubny akademie mě ruší z mého odpočinku, kde stojím na okraji zkušebního areálu. Sleduji, jak mí vrstevníci spěchají na vyhlášení výsledků, plní naděje na své výsledky.\n\nZa nimi zahlédnu uchazeče Palácové zkoušky, stojící vpředu na nádvoří císařského paláce. Den je jasný a nebesa pozorují."
 imperial_examination.7000.desc.entrant: "Akademické bubny oznamují konec zkoušky. Spěchám zjistit vydání seznamu a zjišťuji, že jsem [Select_CString(ROOT.Char.IsFemale,'získala','získal')|l] [ROOT.Char.Custom('PlayerGetExamScoreAdjective')|l] skóre #V [ROOT.Char.MakeScope.Var('imperial_examination_score').GetValue|0]#!, což mě umisťuje [ROOT.Char.MakeScope.Var('your_exam_position').GetValue|O] v pořadí.\n\nMezitím jsou nejlépe umístění účastníci Palácové zkoušky postaveni vepředu na nádvoří císařského paláce. Dívám se na [first_place_entrant.GetFirstName], který mezi nimi [Select_CString(first_place_entrant.IsFemale,'získala','získal')|l] první místo a stal se [host.GetTitleAsNamePossessiveNoTooltip] oblíbencem."
 imperial_examination.7000.desc.palace_entrant: "Bubny akademie oznamují konec zkoušky. Stojím se svými vrstevníky z Palácové zkoušky vpředu na nádvoří císařského paláce a shlížím na nižší uchazeče shromážděné dole u vyhlášení.\n\nKdyž nás metropolitní uchazeči zpozorují, uklánějí se a sklánějí hlavy v úctě. Cítím slávu a moc, která mě čeká."
 imperial_examination.7000.desc.fallback: "Díky slávě blahodárného [host.GetTitleAsNameNoTooltip] je další [GetActivityType('activity_imperial_examination').GetName] dokončena. S ní se množství učenců vyšplhalo po schodech k vysokému úřadu."
 imperial_examination.7000.a: "Pod nebem je vše v pořádku."
 imperial_examination.7000.a.cheater: "Sleduju všechny kromě sebe."
 imperial_examination.7001.t: "$imperial_examination.7000.t$"
 imperial_examination.7001.desc: "Zvon zazvoní, oznamující, že [GetActivityType('activity_local_examination').GetName] skončila a její výsledky byly vyhlášeny."
 imperial_examination.7001.desc.host: "\n\nTímto nový soubor učenců učinil svůj první, ale nejdůležitější krok po schodech k vysokému úřadu. [Select_CString(ROOT.Char.IsFemale,'Postavila','Postavil')|U] jsem jim scénu pro jejich kariéry, ale dál je to na nich."
 imperial_examination.7001.desc.cheater: "\n\nNejsem na seznamu učenců, protože zkoušející odstranili mé jméno ze soutěže."
 imperial_examination.7001.desc.entrant.first: "\n\nMé jméno je úplně na vrcholu seznamu a mí vrstevníci se na mě závistivě otočí. Je rozhodnuto: jsem nejlepším učencem prefektury a cesta na [CZActivity('activity_imperial_examination','A')|l] je pro mě otevřená."
 imperial_examination.7001.desc.entrant: "\n\nAčkoliv [first_place_entrant.GetFirstName] mi sebral místo úplně na vrcholu seznamu, přesto jsem [Select_CString(first_place_entrant.IsFemale,'uspěla','uspěl')|l] u prefekturní zkoušky s [ROOT.Char.Custom('PlayerGetExamScoreAdjective')|l] skóre #V [ROOT.Char.MakeScope.Var('imperial_examination_score').GetValue|0]#!."
 imperial_examination.7001.desc.fallback: "\n\nTímto nový soubor učenců učinil svůj první, ale nejdůležitější krok po schodech k vysokému úřadu."
 imperial_examination.7001.a: "Tento den si zapamatuji."
 imperial_examination.7003.desc: "Zvony zní a oznamují, že [GetActivityType('activity_imperial_examination').GetName] skončila a její výsledky byly zveřejněny."
 imperial_examination.7100.t: "Rodina zastoupena na zkoušce"
 imperial_examination.7100.desc: "Díky slávě našeho blahodárného [host.GetTitleAsNameNoTooltip] máme po Hlavní zkoušce [CZPrepV(location.GetNameNoTooltip)] [CZProvName(location,'L')] novou skupinu potenciálních guvernérů."
 imperial_examination.7100.desc.intro_nr_of_relatives_singular: "Jako účastník přišel pouze [Select_CString(house_member.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMeShort', house_member)|U] [house_member.GetTitledFirstName]."
 imperial_examination.7100.desc.intro_nr_of_relatives: "\n\n[ROOT.Char.MakeScope.Var('num_exam_family_entrants').GetValue] členů rodu [ROOT.Char.GetHouse.GetNameNoTooltip] se zúčastnilo jako uchazeči."
 imperial_examination.7100.desc.all_failed: "[ROOT.Char.Custom('ActivityGetFaileesBothAll')|U] z nich selhalo."
 imperial_examination.7100.desc.all_passed_provincial: "[ROOT.Char.Custom('ActivityGetSuccessfulBothAll')|U] z nich poctilo naše dobré jméno a složilo své zkoušky."
 imperial_examination.7100.desc.all_passed_metropolitan: "[ROOT.Char.Custom('ActivityGetSuccessfulBothAll')|U] z nich poctilo naše dobré jméno a složilo provinční zkoušku."
 imperial_examination.7100.desc.all_passed: "[ROOT.Char.Custom('ActivityGetFaileesBothAll')|U] z nich poctilo naše dobré jméno."
 imperial_examination.7100.desc.one_passed: "Pouze jeden z nich [Select_CString(ROOT.Char.IsFemale,'poctila','poctil')|l] naše dobré jméno."
 imperial_examination.7100.desc.win_lose_ratio: "[ROOT.Char.MakeScope.Var('num_exam_family_entrants_passed').GetValue] uspělo, zatímco [ROOT.Char.MakeScope.Var('num_exam_family_entrants_failed').GetValue] selhalo v testu."
 imperial_examination.7100.desc.won_palace: "Z nich [ROOT.Char.MakeScope.Var('num_exam_family_passed_palace').GetValue] postoupilo do Palácové zkoušky."
 imperial_examination.7100.desc.palace_entrant: "\n\n[house_member.GetTitledFirstName|U] [Select_CString(house_member.IsFemale,'složila','složil')|l] metropolitní zkoušku s výsledkem hodnoceným jako [activity.Custom('ActivityGetExamScoreAdjective')|l]. Díky tomu přišlo vytoužené pozvání k palácové zkoušce, přímo před [host.Custom('CZ_TitleAsNameNoTooltip_I')]! I tím se rodu [ROOT.Char.GetHouse.GetNameNoTooltip] dostalo cti."
 imperial_examination.7100.desc.metropolitan_entrant: "\n\n[house_member.GetTitledFirstName|U] [Select_CString(house_member.IsFemale,'složila','složil')|l] Metropolitní zkoušku s [activity.Custom('ActivityGetExamScoreAdjective')|l] výsledkem, ale nepodařilo se mu získat jedno z vytoužených míst na Palácové zkoušce."
 imperial_examination.7100.desc.failed_entrant: "\n\n[house_member.GetTitledFirstName|U] [Select_CString(house_member.IsFemale,'neuspěla','neuspěl')|l] u Metropolitní zkoušky."
 imperial_examination.7100.desc.cheater: "A navíc [Select_CString(ROOT.Char.IsFemale,'byla','byl')|l] [Select_CString(house_member.IsFemale,'přistižena','přistižen')|l] při pokusu o podvod na události."
 imperial_examination.7100.desc.got_elder: "Alespoň [Select_CString(house_member.IsFemale,'dokázala','dokázal')|l] zapůsobit na [elder.GetTitledFirstName], jednoho z císařských zkoušejících, který přijal [Select_CString(house_member.IsFemale,'ji','jej')|l] za [Concept('disciple','učedníka')|E]."
 imperial_examination.7100.desc.failed_fallback: "Roky a roky rozsáhlého a #EMP drahého#!! vzdělání, to všechno pryč během okamžiku."
 imperial_examination.7100.a.singular: "Je na místě blahopřát!"
 imperial_examination.7100.a.tt_first: "#weak Oslovíte úspěšného palácového uchazeče#!!"
 imperial_examination.7100.a.plural: "Musím blahopřát palácovým uchazečům."
 imperial_examination.7100.b.singular: "Nechci přijmout průměrnost."
 imperial_examination.7100.b.tt_first: "#weak Oslovíte úspěšného metropolitního uchazeče#!!"
 imperial_examination.7100.b.plural: "Chci oslovit uchazeče z nižší úrovně."
 imperial_examination.7100.c: "Selhání v tomto domě nebude tolerováno!"
 imperial_examination.7100.c.tt_first: "#weak Oslovíte neúspěšného uchazeče#!!"
 imperial_examination.7100.d: "Na tohle nemám čas."
 influence_family_effect: "Ovlivnit následující členy rodiny:"
 imperial_examination.7050.t: "Metropolitní uchazeči"
 imperial_examination.7050.desc: "Je sice dobře, že je rod [ROOT.Char.GetHouse.GetNameNoTooltip] zastoupen v naší nejskvělejší a nejuctívanější tradici, člověk by však očekával... větší soustředěné úsilí.\n\n"
 imperial_examination.7050.a.singular: "[Select_CString(house_member.IsFemale,'ona','on')|U] #EMP musí#!! složit Palácovou zkoušku!"
 imperial_examination.7050.a.plural: "Očekávám, že #EMP všichni#!! absolvují Palácovou zkoušku."
 imperial_examination.7050.a.tt_singular: "[house_member.GetShortUINameNoTooltip|U] se pokusí dostavit na další [CZActivityNoTooltip('activity_imperial_examination','A')|l]"
 demand_retake_exam_effect: "#weak Tito jedinci se pokusí dostavit na další [CZActivityNoTooltip('activity_imperial_examination','A')|l]#!"
 imperial_examination.7050.b: "Zásluhu, samozřejmě, mám já."
 imperial_examination.7050.c.singular: "Jsem si jistý, že [Select_CString(house_member.IsFemale,'vynaložila její','vynaložil jeho')|l] maximum."
 imperial_examination.7050.c.plural: "Jsem si jistý, že se snažili ze všech sil."
 imperial_examination.7055.t: "Rod poctěn na Palácové zkoušce"
 imperial_examination.7055.desc: "Je skutečným požehnáním, že má rod [ROOT.Char.GetHouse.GetNameNoTooltip] zastoupení u palácové zkoušky. Mé příbuzenstvo osobně stanulo před nebeským trůnem — sedí na něm [host.Custom('GetDaughterSon')|l] nebes — a prokázalo, že si zaslouží uznání.\n\nTo jistě věští nadcházející období blahobytu."
 imperial_examination.7055.b: "Jak se dalo očekávat od člena rodu [ROOT.Char.GetHouse.GetNameNoTooltip]"
 imperial_examination.7060.t: "Rod zneuctěn na Metropolitní zkoušce"
 imperial_examination.7060.desc: "Jak se mohu ukázat mezi svými vrstevníky, když se moji příbuzní ztrapní a nedokáží dodržet naši nejuctívanější tradici? Možná bude třeba přísné kázně."
 imperial_examination.7060.c: "Se [Select_CString(house_member.IsFemale,'pokusila','pokusil')|l] podvádět jako #EMP tohle#!!?"
 imperial_examination.7060.b: "Výsledky se občas mohou zaměnit..."
 imperial_examination.7060.b.tt_singular: "[failed_entrant.GetTitledFirstNamePossessive|U] výsledek bude vyměněn za výsledek úspěšného uchazeče"
 imperial_examination.7060.b.tt_plural: "Odpovědi úspěšných kandidátů jsou připsány vašim [Concept('close_family','blízké rodině')|E] a [Concept('extended_family','širší rodina')|E]"
 imperial_examination.7060.d: "Tohle je nepřijatelné!"
