l_polish:
 imperial_examination.1000.t: "Uchazeči se shromažďují"
 imperial_examination.1000.desc: "Vstupuji do města [ROOT.Char.GetCurrentLocation.GetName]. Ulice jsou zametené a bohatě vyzdobené na uvítanou. Lidé se uklánějí a tiše nám přejí štěstí. Na nárožích se uzavírají sázky.\n\nKam se podívám, vidím další uchazeče v nejlepších hedvábných róbách, jak se v doprovodu kurtizán rozcházejí do místních krčem. Dnes poznám, jak daleko jsem [Select_CString(ROOT.Char.IsFemale,'ochotna','ochoten')|l] zajít."
 imperial_examination.1000.a: "Uspěju za každou cenu!"
 imperial_examination.1000.a.tt: "Dostaneš více příležitostí podvádět.\n@alert_icon! #alert_trial Mohou tě přistihnout!#!! #weak (pokud zůstaneš bez odhalení, získáš [Concept('secret','tajemství')|E] #V $secret_exam_cheater$#!)#!"
 imperial_examination.1000.b: "Prokážu své schopnosti poctivě."
 imperial_examination.1001.t: "$imperial_examination.1000.t$"
 imperial_examination.1001.desc: "Budoucí státní úředníci lemují ulice [CZProvName(ROOT.Char.GetCurrentLocation,'G')]. Město ožívá, rozzářené hedvábnými róbami uchazečů a krásnými kurtizánami, které je provázejí. \n\nÚspěch u úřednických zkoušek znamená prokázat důkladné porozumění pěti ctnostem, jež představují vrchol konfuciánského učení. \n\nNejde o pouhé recitování, ale o pěstování ctnostného přesvědčení a morálního jednání."
 imperial_examination.1001.a: "Shromáždění čeká."
 imperial_examination.1002.t: "$imperial_examination.1000.t$"
 imperial_examination.1002.desc: "Vstupuji do města [ROOT.Char.GetCurrentLocation.GetName]. Po mém boku jde [candidate.GetTitledFirstName], můj [ROOT.Char.Custom2('RelationToMe', candidate )|l]. Ulice jsou zametené a slavnostně vyzdobené.\n\nJakmile se [candidate.GetFirstNameNoTooltip] ubytuje mezi uchazeči, budu mít jen málo možností další průběh ovlivnit. Možná je čas na pár slov rady."
 imperial_examination.1002.a: "„Uspěj za každou cenu.“"
 imperial_examination.1002.a.tt: "[candidate.GetFirstNameNoTooltip|U] získá více příležitostí podvádět.\n@alert_icon! #alert_trial Může dojít k odhalení!#!! #weak (pokud [Select_CString(candidate.IsFemale,'ona','on')|l] unikne odhalení, získá [Concept('secret','tajemství')|E] #V $secret_exam_cheater$#!)#!"
 imperial_examination.1002.b: "„Neudělej ostudu rodu [ROOT.Char.GetHouse.GetNameNoTooltip].“"
 imperial_examination.1003.t: "$imperial_examination.1000.t$"
 imperial_examination.1003.desc: "Vstupuji do města [ROOT.Char.GetCurrentLocation.GetName], ruce mi jsou přetíženy učebními svitky a materiály ke studiu.\n\n"
 imperial_examination.1003.not_passed_exam: "Zkoušku jsem dosud [Select_CString(ROOT.Char.IsFemale,'nesložila','nesložil')|l]. Přesto mohu zkoušejícím s lecčím pomoci a získat představu, co mě čeká, až se jednou odhodlám."
 imperial_examination.1003.passed_provincial_exam: "Dnes zjistím, co se děje uvnitř studovny zkoušejících, jak se míchá inkoust a připravují dotazníky. Po úspěšném absolvování zkoušky je nyní čas pěstovat [Glossary( 'guānxi', 'GUANXI_GLOSS' )]."
 imperial_examination.1003.passed_metropolitan_not_palace: "Vzpomínám si na vyhlášení výsledků metropolitní zkoušky. Nadšení rychle vyprchalo, když se mé jméno neobjevilo v první desítce. Snad se jednou díky píli dostanu až k palácové zkoušce."
 imperial_examination.1003.passed_all_exams: "Všechny stupně zkoušek mám za sebou. Když tedy vstupuji do nejprestižnějších městských studoven, zkoušející mě už vítají jako někoho ze svých řad."
 imperial_examination.1003.a: "$imperial_examination.1001.a$"
 imperial_examination.1020.t: "Nové tváře"
 imperial_examination.1020.desc: "V ubytovně si u stolu všimnu dalšího uchazeče. Ve vážné tváři se zračí nervozita a zuby hryžou nehty.\n\nNaše pohledy se na okamžik setkají, a tak zahájím rozhovor: „Zdravím. Já jsem [ROOT.Char.GetTitledFirstNameNoTooltip]. A ty?“\n\nPohled neklidně zabloudí po místnosti, než zazní odpověď: „[new_entrant.GetTitledFirstName]. A co má být?“"
 imperial_examination.1020.a: "„Jsi taky nervózní?“"
 imperial_examination.1020.a.success.tt: "Sbližuješ se s [new_entrant.GetShortUIName]"
 imperial_examination.1020.a.failure.tt: "Tvoje malé povídání vyznělo naprázdno"
 imperial_examination.1020.b: "„Určitě to dobře dopadne!“"
 imperial_examination.1040.t: "Prohlídka města"
 imperial_examination.1040.desc.again: "Cestou ke zkušební síni znovu uvíznu v tlačenici uchazečů, kteří se s vykulenýma očima prodírají městskými ulicemi."
 imperial_examination.1040.desc: "Městské ulice ožívají přípravami na nadcházející zkoušku. Ve vzduchu visí vzrušení a i mě strhává radostné očekávání."
 imperial_examination.1040.desc.outro: "\n\nBudoucí guvernéři se postavili do fronty před přijímací halou, aby oznámili svůj příchod. Vzhledem k délce fronty to vypadá, že mám čas se před shromážděním po městě projít."
 imperial_examination.1040.a: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] bych na trhu hledat svitek."
 imperial_examination.1040.a.tt: "Získáš svitek rozvíjející [Concept('learning','učenost')|E] jako [Concept('artifact','artefakt')|E]"
 imperial_examination.1040.a.tt_equipped: "Zakoupen artefakt „[artifact_scroll.GetName]“"
 imperial_examination.1040.b: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] bych koupit dar pro hostitele."
 imperial_examination.1040.c: "Nemám čas na rozptýlení."
 imperial_examination.1040.d: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] bych zjistit, co se mohu naučit od místních."
 imperial_examination.1040.d.tt.success: "Získáš cenné poznatky"
 imperial_examination.1040.d.tt.failure: "Nepodaří se ti nic hodnotného naučit"
 imperial_examination.1040.e: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] bych si procvičit dovednosti na cvičišti!"
 imperial_examination.1040.e.tt.success: "Porazíš místní bojovníky"
 imperial_examination.1040.e.tt.failure: "Místní bojovníci tě porazí"
 artifact_scroll_name: "Opotřebovaný rukopis"
 artifact_scroll_desc: "Dobře opotřebovaný a anotovaný vzdělávací text s názvem „Interpretace lidskosti“, který pojednává o jednom z pěti pilířů konfuciánského myšlení."
 examination_gifted_host_title: "Dar pro hostitele"
 examination_gifted_host: "[CHARACTER.GetTitledFirstName|U] [Select_CString(CHARACTER.IsFemale,'obdarovala','obdaroval')|l] [TARGET_CHARACTER.GetTitledFirstName] [ROOT.Char.Custom('GetExpensiveDessert')|l]"
 imperial_examination.1050.t: "První dojmy"
 imperial_examination.1050.desc: "Snadno najdu zkoušejícího [examiner.GetTitledFirstName], neboť skupinka ostatních uchazečů se kolem něj točí jako pávové, předvádějíce svitky kaligrafie a vtahujíce [Select_CString(examiner.IsFemale,'ji','jej')|l] do učených debat. \n\nVyniknout a udělat v tomto davu trvalý první dojem nebude žádný drobný úkol, soupeříme s touto skupinkou divokých společenských bytostí."
 imperial_examination.1050.a: "Zaujmout pronikavým výkladem klasiků."
 imperial_examination.1050.a.success.tt: "[examiner.GetTitledFirstName|U] je [Select_CString(examiner.IsFemale,'ohromena','ohromen')|l]"
 imperial_examination.1050.a.failure: "[examiner.GetTitledFirstName|U] není [Select_CString(examiner.IsFemale,'ohromena','ohromen')|l]"
 imperial_examination.1050.a.failure.tt: "Tvoje poznatky nejsou špatné. Co hůř, jsou zastaralé."
 imperial_examination.1050.b: "Připsat si zásluhy za práci jiného uchazeče."
 imperial_examination.1050.b.success.tt: "[examiner.GetTitledFirstName|U] je [Select_CString(examiner.IsFemale,'ohromena','ohromen')|l]"
 imperial_examination.1050.b.failure.tt: "Jsi [Select_CString(ROOT.Char.IsFemale,'přistižena','přistižen')|l] při plagiátorství"
 imperial_examination.1050.c: "Dokážu to u zkoušky."
 examination_impressed_examiner_title: "Skvělý první dojem"
 examination_impressed_examiner: "[CHARACTER.GetTitledFirstName|U] [Select_CString(CHARACTER.IsFemale,'získala','získal')|l] výhodu při zkoušce díky přízni zkoušejícího [TARGET_CHARACTER.GetTitledFirstName]."
 imperial_examination.1060.t: "Sladká pochoutka"
 imperial_examination.1060.desc: "Vůně čerstvých koláčků proniká směsicí pachu zpocených uchazečů a zaprášených svitků, která naplňuje zkušební budovu.\n\n„[Select_CString(entrant_to_meet.IsFemale,'Přinesla','Přinesl')|U] jsem ti ze své provincie tento skromný dar, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ pronese [entrant_to_meet.GetTitledFirstName], jeden z nadějných uchazečů.\n\nNásleduje úklona a nabídka krabičky z růžového dřeva vykládané kostí. Odtud tedy vychází ta lahodná vůně. A zjevně jde také o pokus získat mou přízeň."
 imperial_examination.1060.b: "Velké štěstí přijde těm, kdo projevují takovou štědrost."
 imperial_examination.1060.b.tt: "[entrant_to_meet.GetTitledFirstName|U] má #BOL zvýšenou#!! šanci na #BOL úspěch#!! díky [Concept('exam_advantage','výhodě u zkoušky')|E]"
 imperial_examination.1060.c: "Užijme si to spolu!"
 imperial_examination.1060.d: "Užiju si to!"
 imperial_examination.1070.t: "Velmi nadějný uchazeč"
 imperial_examination.1070.desc: "Nemohu si pomoci a přemýšlím, jakého typu uchazeči se mohou zkoušky účastnit. \n\n[Glossary( 'four ways', 'FOUR_WAYS_GLOSS' )] výběru úředníka bezpochyby určí, jakou přízeň mají uchazeči u zkoušejících. Jako jejich [ROOT.Char.GetTitleAsNameNoTooltip] mám moc rozhodnout, co se považuje za #EMP dobré#!! hodnoty."
 imperial_examination.1070.a: "Ti, kdo sdílejí mé zájmy, musí být nadějní."
 every_shared_education_entrant.tt: "Každý [Concept('entrant','účastník')|E] s [THIS.Char.Custom('GetEducationTraitConcept')|l] [Concept('education','vzděláním')|E] má #BOL zvýšenou#!! šanci na #BOL úspěch#!!"
 imperial_examination.1070.b: "Všichni, kdo se drží konfuciánského učení, jsou hodni."
 imperial_examination.1070.b.tt: "Každý [Concept('entrant','účastník')|E] s vlastností [GetTrait('compassionate').GetName(GetNullCharacter)], [GetTrait('just').GetName(GetNullCharacter)], [GetTrait('honest').GetName(GetNullCharacter)] nebo [GetTrait('erudite').GetName(GetNullCharacter)] má #BOL zvýšenou#!! šanci na #BOL úspěch#!!"
 imperial_examination.1070.d: "Ti, kteří jsou potomky syna nebes, samozřejmě."
 imperial_examination.1070.d.tt: "Každý [Concept('entrant','účastník')|E] z tvé [Concept('dynasty','dynastie')|E] získává #BOL zvýšenou#!! šanci na #BOL úspěch#!!"
 imperial_examination.1070.c: "Budu se řídit úsudkem zkoušejících."
 imperial_examination.2000.t: "[ROOT.Char.GetTitleAsNameNoTooltip|U], nebo nikdo"
 imperial_examination.2000.desc: "Člověk se v přítomnosti autority chová co nejlépe. Jako [ROOT.Char.GetTitleAsNameNoTooltip] musím své poddané nachytat nepřipravené, abych zjistil, kdo je slušný a kdo je jen dobrý lhář. \n\nOpouštím své ubytování v prosté róbě, skrytý v davu, abych [Select_CString(ROOT.Char.IsFemale,'získala','získal')|l] přesnější obraz o uchazečích. \n\n[entrant_to_meet.GetTitledFirstName|U] vyniká jako nadějná postava."
 imperial_examination.2000.desc.scoreboardee: "Už [Select_CString(entrant_to_meet.IsFemale,'ona','on')|l] snadno recituje pasáže z klasiků před zaujatým publikem. I mě přitahují podnětné otázky, které [Select_CString(entrant_to_meet.IsFemale,'ona','on')|l] textům pokládá."
 imperial_examination.2000.desc.fallback: "Sedí [Select_CString(entrant_to_meet.IsFemale,'obklopena','obklopen')|l] malou skupinkou uchazečů a diskutuje klasiky s podnětnými, přesto poněkud nenápaditými názory."
 imperial_examination.2000.a: "Dám zkoušejícím vědět jméno [Select_CString(entrant_to_meet.IsFemale,'její','jeho')|l]."
 imperial_examination.2000.a.tt: "[entrant_to_meet.GetTitledFirstName|U] má #BOL zvýšenou#!! šanci na #BOL úspěch#!! díky [Concept('exam_advantage','výhodě u zkoušky')|E]"
 imperial_examination.2000.b: "[entrant_to_meet.GetTitleByKey|U] by to [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')|l] dotáhnout daleko, s trochou pomoci."
 imperial_examination.2000.c: "Bohužel, mám vyšší nároky."
 imperial_examination.2010.t: "Příprava scény"
 imperial_examination.2010.desc.two: "„To musí být příjemné mít na zkoušce tolik členů své dynastie,“ říká mi můj zkoušející [examiner.GetTitledFirstName]. „I když nemám zvlášť vysoké naděje na [entrant_to_meet_2.GetTitledFirstName].“\n\n"
 imperial_examination.2010.desc.one: "„Vidím, že [dynasty_member.GetTitledFirstName] se [Select_CString(dynasty_member.IsFemale,'dostala','dostal')|l] na zkoušku,“ říká mi můj zkoušející [examiner.GetTitledFirstName]. „Musíš být [Select_CString(ROOT.Char.IsFemale,'potěšena','potěšen')|l].“\n\n"
 imperial_examination.2010.desc.outro: "[examiner.GetFirstNamePossessiveNoTooltip|U] oči přejíždějí po seznamu uchazečů a vidím typický výčnělek v [Select_CString(examiner.IsFemale,'jejími','jeho')|l] měšci od úplatků již přijatých od starostů dynastií. \n\nNemám pochyb — [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')|l] bych [Select_CString(ROOT.Char.IsFemale,'sama','sám')|l] přispět malou sumou, abych podpořil člena svého rodu."
 imperial_examination.2010.a: "[entrant_to_meet.GetShortUINameNoTooltip|U] si zaslouží uznání."
 imperial_examination.2010.a.tt: "[entrant_to_meet.GetTitledFirstName|U] má #BOL zvýšenou#!! šanci na #BOL úspěch#!! díky [Concept('exam_advantage','výhodě u zkoušky')|E]"
 imperial_examination.2010.b: "Můj zklamaný [ROOT.Char.Custom2('RelationToMe', entrant_to_meet_2 )|l] potřebuje veškerou pomoc, kterou [Select_CString(entrant_to_meet_2.IsFemale,'ona','on')|l] může dostat."
 imperial_examination.2010.b.tt: "[entrant_to_meet_2.GetTitledFirstName|U] má #BOL zvýšenou#!! šanci na #BOL úspěch#!! díky [Concept('exam_advantage','výhodě u zkoušky')|E]"
 imperial_examination.2010.c: "Myslím, že ne."
 imperial_examination.2030.t: "Nefrit v surovém stavu"
 imperial_examination.2030.desc.open: "„Jak se dalo čekat při velkém počtu uchazečů na tuto zkoušku, řada nízkého stavu se pokouší zaskočit příležitost,“"
 imperial_examination.2030.desc.restricted: "„Navzdory omezení přístupnosti pro širokou veřejnost se nějaký ten nízký nešika vždy nějak proplíží do zkoušky.“"
 imperial_examination.2030.desc.exclusive: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], stydím se to přiznat, ale do zkušebních síní se nějak dostala bezejmenná osoba nízkého původu. Zřejmě doufá, že tu prokáže své schopnosti.“"
 imperial_examination.2030.desc.outro: "informuje mě zkoušející [examiner.GetTitledFirstName] a hledí z okna na nádvoří.\n\nUkáže na mladou osobu, která se vášnivě pře se dvěma šlechtici.\n\n„To je [promising_lowborn.GetTitledFirstName]. Přes poněkud hrubé vystupování musím přiznat, že má mimořádné nadání.“"
 imperial_examination.2030.a: "Žádný obyčejný člověk nepřekoná mé příbuzné!"
 imperial_examination.2030.a.tt: "[dynasty_member.GetTitledFirstName|U] má #BOL zvýšenou#!! šanci na #BOL úspěch#!! díky [Concept('exam_advantage','výhodě u zkoušky')|E]"
 imperial_examination.2030.b: "Dám si na toho pozor."
 imperial_examination.2030.c: "Všichni jsou opravdu pod nebem rovni."
 imperial_examination.2040.t: "Úplatek v ruce"
 imperial_examination.2040.desc: "Šíří se zvěsti, že zkoušející [rumored_examiner.GetTitledFirstName] #EMP přijímá úplatky#!! za podporu vybraných uchazečů.\n\nA skutečně, měšec se zdá napěchovaný mincemi a důvěrnost vůči některým uchazečům přesahuje meze náležité tomuto postavení.\n\nNení třeba dalšího vyšetřování. Tohle jednání mou zkoušku zneuctívá!"
 imperial_examination.2040.a: "[rumored_examiner.GetFirstNameNoTooltip|U] uhradí říši odškodnění."
 imperial_examination.2040.b: "Znám někoho, kdo by potřeboval trochu #EMP pomoci#!!."
 imperial_examination.2040.b.tt: "[dynasty_member.GetTitledFirstName|U] má #BOL zvýšenou#!! šanci na #BOL úspěch#!! díky [Concept('exam_advantage','výhodě u zkoušky')|E]"
 imperial_examination.2040.d: "Zakujte tohoto ostudného [Select_CString(rumored_examiner.IsFemale,'žena','muž')|l] do okovů!"
 imperial_examination.2040.c: "Zkouška bude pokračovat jako obvykle."
 imperial_examination.3000.t: "Zvon se rozezní"
 imperial_examination.3000.desc: "Po důkladné kontrole, aby se odhalilo jakékoli podvádění, se uchazeči postaví do řady ke složení zkoušky. Dívám se na ně ze svého paláce, vnímajíc jejich očekávající tváře a ztuhlé postoje. \n\nZvon na věži nádvoří zazvoní a následuje bušení těžkých bubnů — zvuky, které se odrážejí pod mýma nohama a naplňují mé srdce zbožnou radostí."
 imperial_examination.3000.a: "Začíná to."
 imperial_examination.3005.t: "$imperial_examination.3000.t$"
 imperial_examination.3005.desc: "Ticho se snese v krčmě, když po celém [ROOT.Char.GetCurrentLocation.GetName] zazní zvony. Brány do zkušebních síní jsou zavřeny.\n\nVšude kolem mě vidím rodiče a starší, jak šeptem debatují, snažíc se odhadnout výsledek nadcházejících testů. Marné snažení."
 imperial_examination.3005.desc.outro.impatient: "Ač nerad to přiznávám, teď nám nezbývá než čekat."
 imperial_examination.3005.desc.outro: "Teď už jen čekat."
 imperial_examination.3005.a: "Tady je dobré se ukázat."
 imperial_examination.3005.b: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] bych se porozhlédnout mezi lidmi..."
 imperial_examination.3006.t: "$imperial_examination.3000.t$"
 imperial_examination.3006.desc: "Napětí visí v ovzduší, když po [CZProvName(ROOT.Char.GetCurrentLocation,'L')] zazní zvony. Brány do zkušebních síní jsou zavřeny.\n\nNásleduji zkoušejícího [examiner.GetTitledFirstName]."
 imperial_examination.3005.desc.martial: "Pot mi stéká po zádech z nošení šípů k doplnění toulců, drobná řezná poranění kryjí mé ruce od broušení čepelí."
 imperial_examination.3005.desc.scholar: "Pot mi stéká po zádech z nošení svitků tam a zpět mezi zkušebními budkami, inkoust zbarvil špičky mých prstů černě od doplňování inkoustových nádobek."
 imperial_examination.3006.a: "Teď začíná ta pravá práce."
 imperial_examination.3007.t: "$imperial_examination.3000.t$"
 imperial_examination.3007.desc: "Se zasténáním a těžkým duněním se brány zkušebního areálu zavírají. Zvony na nádvoří zní a svolávají nás ke shromáždění."
 imperial_examination.3007.a: "Je čas dokázat svou hodnotu."
 imperial_examination.3007.a.success_tooltip_first: "#weak K složení metropolitní zkoušky potřebujete skóre #V 50#!!. K účasti na palácové zkoušce se musíte umístit mezi prvními deseti.#!!"
 imperial_examination.3010.t: "Plevel mezi květinami"
 imperial_examination.3010.desc: "Zastavím se před kanceláří zkoušejících, přitahován jejich tichou konverzací. „Nikdy jsem neviděl tak to dokonalého podvodníka,“ říká zkoušející [examiner.GetTitledFirstName]."
 imperial_examination.3010.scholarship: "„Jediný důvod, proč jsem si všiml ponožek [entrant.GetTitledFirstName], že byly prosáklé odpověďmi ke zkoušce, [Select_CString(entrant.IsFemale,'byla','byl')|l] ten, že je omylem [Select_CString(entrant.IsFemale,'namočila','namočil')|l]!“"
 imperial_examination.3010.martial: "[entrant.GetTitledFirstName|U] sabotovalo soupeřův luk tím, že udělalo téměř nepostřehnutelný řez v rukojeti, takže se zbraň zlomí až při ohnutí."
 imperial_examination.3010.outro: "\n\nZkoušející [examiner_2.GetTitledFirstName] zavrtí hlavou a zamumlá: „Kdyby [entrant.GetFirstName] tolik píle [Select_CString(entrant.IsFemale,'věnovala','věnoval')|l] studiu místo podvodů, zářila by ve státní správě nová hvězda.“"
 imperial_examination.3010.a: "Podvod lze odčinit službou v mém dvoře."
 imperial_examination.3010.b: "Zkoušející je ten, kdo potřebuje být potrestán!"
 imperial_examination.3010.c: "Nechám zkoušející, ať to vyřeší."
 imperial_examination.3020.t: "Skvrna na mém jménu"
 imperial_examination.3020.desc: "Známý hlas se ozve z budek zkoušejících a vytáhne mě z mého ubytování. Nacházím [Select_CString(SCOPE.sC('entrant').IsFemale,'své','svého')|l] [ROOT.Char.Custom2('CZ_RelationToMeShort_G', SCOPE.sC('entrant'))|l] [entrant.GetTitledFirstName], který si trhá vlasy a mumlá nesrozumitelně.\n\n"
 imperial_examination.3020.desc_martial: "[Select_CString(entrant.IsFemale,'Opustila','Opustil')|U] svou kopí v trávě a [Select_CString(entrant.IsFemale,'zanechala','zanechal')|l] soupeře, aby si škrtl přilbu."
 imperial_examination.3020.desc_scholarship: "[Select_CString(entrant.IsFemale,'Opustila','Opustil')|U] svou budku, ale stále svírá [Select_CString(entrant.IsFemale,'její','jeho')|l] s bledým a zděšeným výrazem na obličeji."
 imperial_examination.3020.desc.outro: "\n\nZkoušející zírají na dramatické představení a rychle zasahují, ale škoda je již způsobena. Každý uchazeč [Select_CString(ROOT.Char.IsFemale,'byla','byl')|l] svědkem, jak se člen mé dynastie zhroutil před nimi."
 imperial_examination.3020.a: "[Select_CString(entrant.IsFemale,'ona','on')|U] dostane přísné napomenutí."
 imperial_examination.3020.b: "Pošli [Select_CString(entrant.IsFemale,'ji','jej')|l] okamžitě domů!"
 imperial_examination.3020.c: "Ach, to je jen úpal, nic víc."
 imperial_examination.3030.t: "Spánek v službě"
 imperial_examination.3030.desc: "Dostává se ke mně zpráva, že zkoušející [examiner.GetFirstName] klimbá před uchazeči. Začalo to sklouznutím lokte na stole zkoušejícího a brzy už ten [Select_CString(examiner.IsFemale,'žena','muž')|l] chrápal! \n\n[Select_CString(examiner.IsFemale,'ona','on')|U] je teď vzhůru, ale kdo ví, co uchazeči mezitím stihli?"
 imperial_examination.3030.a: "To zpochybňuje všechny výsledky!"
 imperial_examination.3030.a.flavor: "Kolektivní trest nikdy nezklame."
 imperial_examination.3030.b: "Budu si to pamatovat."
 imperial_examination.3030.c: "Jistě si toho kromě nás nikdo nevšiml."
 imperial_examination.4000.t: "S trochou pomoci"
 imperial_examination.4000.desc: "Písmena, symboly... Když zavřu oči, vidím útržky pasáží, které jsem celé dny pilně studoval. Každý tah štětce se mi zdá vznášet ve tmě, přesto zůstává jejich význam nejasný. Stihnu za čas zvládnout všechny nutné interpretace?\n\nJiný uchazeč se ke mně přimkne, [Select_CString(exam_taker.IsFemale,'její','jeho')|l] róba se mnou lehce šimrá. „Není rozumné trápit mysl buzením celou noc kvůli jedné zkoušce. Máš celý život na učení. Nech mě udělat zkoušku za tebe a odpočiň si.“"
 imperial_examination.4000.a: "Já #EMP opravdu#!! potřebuji veškerou pomoc, kterou mohu získat..."
 imperial_examination.4000.b: "Ne, to je špatně."
 imperial_examination.4000.b.cheater: "Dává to smysl..."
 imperial_examination.4010.t: "Výhody ve zatemněných místnostech"
 imperial_examination.4010.desc: "Každý krok zkoušejícího [examiner_to_bribe.Custom('CZ_FirstName_G')] provází cinkání mincí. Měšec praská ve švech. Opakovaně vidím tiché hovory s uchazeči stranou zvědavých pohledů.\n\nZjevně se tu uzavírají #EMP výhodné#!! dohody..."
 imperial_examination.4010.a: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')|U] bych se představit."
 imperial_examination.4010.b: "Nestojí to za riziko."
 imperial_examination.4020.t: "Noční trápení"
 imperial_examination.4020.desc: "Sedím skloněn nad svými knihami a zoufale pročítám stránku za stránkou, abych se [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')|l] co nejvíce písmen na nadcházející zkoušku.\n\nLehký pulz v spáncích mi připomíná, jak moc mhouřím oči ve špatně osvětlené místnosti. Vstanu a potřu si krk vodou, abych zmírnil duševní námahu."
 imperial_examination.4020.a: "Ještě chviličku..."
 imperial_examination.4020.b: "Nemohu to tak dál dělat."
 imperial_examination.4030.t: "... Od mých přátel"
 imperial_examination.4030.desc: "„[ROOT.Char.GetTitledFirstNameNoTooltip]! Jak se máš? Připojíš se ke mně na další přípravy?“ [Select_CString(friendly_entrant.IsFemale,'má','můj')|U] [ROOT.Char.Custom2('RelationToMe', friendly_entrant )|l], [friendly_entrant.GetTitledFirstName], zamává z pohodlného sedadla dál v síni.\n\nPřed [Select_CString(friendly_entrant.IsFemale,'ji','jej')|l] stojí stůl plný schnoucích štětců na kaligrafii a desítky tlustých sbírek poezie."
 imperial_examination.4030.outro: "\n\nZastavím se na okamžik a zvažuji nabídku. Společné studium #EMP by#! mělo své výhody..."
 imperial_examination.4030.outro.lover: "\n\nVždy [Select_CString(friendly_entrant.IsFemale,'vypadala','vypadal')|l] tak #EMP přitažlivě#!!?"
 imperial_examination.4030.a: "„Kde začneme?“"
 imperial_examination.4030.b: "„No, nevadilo by mi studovat #EMP tebe#!!...“"
 imperial_examination.4030.c: "„Musím jít.“"
 imperial_examination.4050.t: "Noční baijiu"
 imperial_examination.4050.desc: "„Několik z nás plánuje sdílet láhev baijiu. Přidáš se k nám, že?“ ptá se [Select_CString(friendly_entrant.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMe', friendly_entrant )|l], [friendly_entrant.GetTitledFirstName], volaje na mě, kde stojím u rybníka na nádvoří a obdivuji, jak slunce chytilo šupiny ryb."
 imperial_examination.4050.a: "Znám dokonalou pitnou hru!"
 imperial_examination.4050.b: "Raději bych si s tebou užil chvíli o samotě."
 imperial_examination.4050.c: "Musím být jinde."
 imperial_examination.4060.t: "Potenciální rival"
 imperial_examination.4060.desc_learning: "Během debaty s ostatními v ubytovně mě přeruší nosový, pisklavý hlas: „To je podřadný a navíc velmi sporný názor!“\n\nOtočím se po mluvčím. [promising_lowborn.GetTitledFirstName|U], dosud neznámá tvář [CZPrepZ(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetCurrentLocation,'G')], už přes hodinu pohrdavě odsekává a obrací oči v sloup při každém mém slově.\n\nOstatní učenci se uchechtávají tím víc, čím déle si nechávám ty urážky líbit."
 imperial_examination.4060.desc_martial: "Z nádvoří před ubytovnou vidím vztyčování branky pro [Glossary('cchu-ťü','CUJU_GLOSS')]. Davem se šíří vzrušený šepot.\n\nCestou narazím na jiného uchazeče. [promising_lowborn.GetTitledFirstName|U], dosud bezvýznamná místní tvář, se mi posmívá: „Kampak jdeš? Snad ne hrát s těma vychrtlýma nohama? Zlomí se ti jako větvičky!“\n\nLidé kolem se rozesmějí. Pokud nic neudělám, brzy se budou smát mně."
 imperial_examination.4060.a: "Ukážu to [Select_CString(promising_lowborn.IsFemale,'ji','jej')|l]!"
 imperial_examination.4060.a.success: "Ztrapníš toho nováčka"
 imperial_examination.4060.a.failure: "Ztrapníš se"
 imperial_examination.4060.b: "Možná má [Select_CString(promising_lowborn.IsFemale,'ona','on')|l] nějaké rozumné argumenty?"
 imperial_examination.4060.c: "Odmítnout se zapojit."
 imperial_examination.4060.d: "Ty [promising_lowborn.Custom('GetDaughterSon')|l] kuplíře!"
 imperial_examination.4060.d.tt: "Necháte [promising_lowborn.GetTitledFirstName] vyhodit ze zkoušky z důvodu domnělého povolání [Select_CString(promising_lowborn.IsFemale,'její','jeho')|l] rodiny."
 imperial_examination.4070.t: "Nežádaná rodinná podpora"
 imperial_examination.4070.desc: "Od vchodu do zkušební síně zaslechnu známý hlas. Zarazím se: moje [Select_CString(parent.IsFemale,'matka rozmlouvá','otec rozmlouvá')|l] se zkoušející osobou [examiner.GetTitledFirstName].\n\nOdvedu [parent.Custom('CZ_TitledFirstName_A')] stranou a zeptám se, co tu dělá. Odpověď zní potěšeně: „Chci ti jen pomoci. Také mám své známosti, víš! Jen mi dovol promluvit za tebe a obstarat ti příležitost uspět.“\n\nRozhlédnu se, zda nás nezahlédl někdo z ostatních. Ještě mohu poslat [parent.Custom('CZ_TitledFirstName_A')] domů a zachránit si pověst."
 imperial_examination.4070.a: "Jen pokud se [Select_CString(parent.IsFemale,'ona','on')|l] bude umět chovat nenápadně."
 imperial_examination.4070.a.success: "Váš [parent.GetMotherFather|l] úspěšně skryl [Select_CString(parent.IsFemale,'její','jeho')|l] úmysly"
 imperial_examination.4070.a.failure: "Plány [parent.Custom('GetMotherFatherPossessive')|l] vyjdou najevo"
 imperial_examination.4070.b: "Mohu snést ponížení, abych [Select_CString(ROOT.Char.IsFemale,'uspěla','uspěl')|l]/uspěla."
 imperial_examination.4070.c: "[parent.GetMotherFather|U], prosím! Jdi #EMP pryč#!!."
 imperial_examination.4080.t: "Cesta se rozděluje"
 imperial_examination.4080.desc: "Kamkoli jdu, následuje mě šum akademických debat. \n\nDva obzvlášť rozvášněné hlasy se nad davem vyvyšují a za rohem zahlédnu [examiner_1.GetTitledFirstName] a [examiner_2.GetTitledFirstName], dva proslulé akademické rivaly, zase zapletené do dalšího žhavého sporu. Konkrétně o to, kdo [Select_CString(ROOT.Char.IsFemale,'napsala','napsal')|l] nejvýznamnější studii o [examiner_1.Custom('EruditeTopic')|l]. \n\n[examiner_1.GetTitledFirstName|U] se mi zadívá do očí a zeptá se: „No, který text #EMP ty#!! preferuješ?“"
 imperial_examination.4080.a: "Dávám přednost dílu [examiner_1.GetTitledFirstNameNoTooltip]."
 imperial_examination.4080.b: "[examiner_2.GetTitledFirstNameNoTooltip|U] je nejctnostnější učenec."
 imperial_examination.4080.c: "Užívám si oba stejně."
 sided_with_examiner_log: "[CHARACTER.GetTitledFirstName|U] se [Select_CString(CHARACTER.IsFemale,'postavila','postavil')|l] na stranu [TARGET_CHARACTER.GetFirstName] v akademické rozepři"
 sided_with_examiner_log_title: "Postaveno na straně zkoušejícího"
 imperial_examination.cheat.tt: "Získej [Concept('exam_cheat','podvod u zkoušky')|E]"
 imperial_examination.advantage.tt: "Získej [Concept('exam_advantage','výhoda u zkoušky')|E]"
 imperial_examination.has_advantage.tt: "#BOL Zvýšená#!! šance na #BOL úspěch#!! díky [Concept('exam_advantage','výhodě u zkoušky')|E]\n"
 imperial_examination.has_increased_advantage.tt: "#BOL Výrazně#!! zvýšená šance na #BOL úspěch#!! díky [Concept('exam_advantage','výhodě u zkoušky')|E]\n"
 imperial_examination.caught_cheating.tt: "#warning Snižuje#!! váš zisk zásluh na konci zkoušky."
 imperial_examination.cheat_spent.tt: "Vy #BOL použijete#!! [Concept('exam_cheat','podvod u zkoušky')|EU]\n"
 imperial_examination.cheat_wash.tt: "Vaše pochybení je zakryto a podvádění zapomenuto"
 imperial_examination.4090.t: "Lidé stejného ražení"
 imperial_examination.4090.desc: "Do ubytovací síně se vkrádá nervózní očekávání, rozptýlené pouze příjemným výrazem [Select_CString(SCOPE.sC('other_entrant').IsFemale,'mé','mého')|l] [ROOT.Char.Custom2('CZ_RelationToMeShort_G', SCOPE.sC('other_entrant'))|l] [other_entrant.GetTitledFirstName]. \n\nS [Select_CString(other_entrant.IsFemale,'ji','jej')|l] nemusím nic vysvětlovat a každé mé slovo nese hluboký význam. Naše rozhovory získávají vlastní život a obě nás překvapují svými zvraty a obraty! \n\nNakonec se [Select_CString(other_entrant.IsFemale,'ona','on')|l] předkloní a řekne: „Znám pár podobně smýšlejících lidí, kteří by tě rádi poznali; chceš, abych tě jim [Select_CString(ROOT.Char.IsFemale,'představila','představil')|l]?“"
 imperial_examination.4090.a: "S radostí je poznám!"
 imperial_examination.4090.b: "Musím číst důležité texty."
 imperial_examination.4090.b.tt: "Vaše pilnost přináší [merit_i][Concept('merit','zásluhy')|E]."
 imperial_examination.4100.t: "List papíru"
 imperial_examination.4100.desc: "Opatrně kráčím mezi zkušebními kabinkami s úmyslem vložit malý lístek připravený s #EMP užitečnými#!! informacemi před nadcházející zkouškou. \n\nJakmile najdu uvolněnou desku ve stěně jedné kabinky, za mnou zazní výrazné odkašlání. [Select_CString(SCOPE.sC('other_entrant').IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('other_entrant'))|l] [other_entrant.GetTitledFirstName] se mi nějak podařilo přiblížit beze zvuku. \n\n[Select_CString(other_entrant.IsFemale,'ona','on')|U] se ptá: „Co tam děláš?“"
 imperial_examination.4100.a: "Podělím se o odpovědi, abych [Select_CString(ROOT.Char.IsFemale,'uklidnila','uklidnil')|l] [other_entrant.GetTitledFirstNameNoTooltip]."
 imperial_examination.4100.a.success: "[other_entrant.GetTitledFirstNameNoTooltip|U] je [Select_CString(other_entrant.IsFemale,'přesvědčena','přesvědčen')|l], aby s vámi [Select_CString(other_entrant.IsFemale,'podváděla','podváděl')|l]."
 imperial_examination.4100.a.failure: "[other_entrant.GetTitledFirstNameNoTooltip|U] není [Select_CString(other_entrant.IsFemale,'přesvědčena','přesvědčen')|l]."
 imperial_examination.4100.b: "„Jsem tu, abych se [Select_CString(ROOT.Char.IsFemale,'naladila','naladil')|l] jako student.“"
 imperial_examination.4100.b.success: "[other_entrant.GetTitledFirstNameNoTooltip|U] uvěří vaší lži."
 imperial_examination.4100.b.failure: "[other_entrant.GetTitledFirstNameNoTooltip|U] se nenechá oklamat"
 imperial_examination.4100.c: "Hoď papír do nedaleké louže."
 imperial_examination.8000.t: "V paláci"
 imperial_examination.8000.desc: "Stojím mezi nejnadějnějšími učenci celého panství. Celý život jsem na tento okamžik [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')|l]. Brzy budu procházet palácovými zahradami, jíst nejvybranější jídla celé říše a osobně stanout před [host.Custom('CZ_TitleAsNameNoTooltip_I')]."
 imperial_examination.8000.a: "Oči nebe se upírají na mě!"
 imperial_examination.8010.t: "V krčmě"
 imperial_examination.8010.desc: "[Select_CString(ROOT.Char.IsFemale,'Neobdržela','Neobdržel')|U] jsem pozvánku na Palácovou zkoušku. Moje skutečné skóre ještě nebylo zveřejněno. Mezitím už nejsem [Select_CString(ROOT.Char.IsFemale,'uvězněna','uvězněn')|l] v areálu zkoušky.\n\n"
 imperial_examination.8010.desc_worried: "Hluk krčmy ke mně nedoléhá, sedím a přemýšlím, co jsem [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')|l] udělat jinak."
 imperial_examination.8010.desc_fallback: "Zkouška je konečně u konce a já si mohu oddechnout."
 imperial_examination.8010.a: "Musím pilně studovat na příští zkoušku."
 imperial_examination.8010.b: "Přesto jsem s výsledkem [Select_CString(ROOT.Char.IsFemale,'spokojena','spokojen')|l]."
 imperial_examination.9000.t: "Velmi vážené shromáždění"
 imperial_examination.9000.desc.intro: "Po skončení metropolitní zkoušky zkoušející [examiner.GetFirstName] představí nejlépe hodnoceného uchazeče, [first_char.GetTitledFirstName].\n\n„Tento [Select_CString(first_char.IsFemale,'žena','muž')|l] má zálibu v"
 imperial_examination.9000.desc.diplomacy: "diplomacii"
 imperial_examination.9000.desc.martial: "válečnictví"
 imperial_examination.9000.outro: "nás dnes všechny ohromil,„ říká [examiner.GetFirstNameNoTooltip]. ‚Ostatní vysoce hodnocení uchazeči jsou právě odváděni do císařského paláce.‘\n\n[first_char.GetFirstNameNoTooltip|U] se hluboce ukloní a [Select_CString(first_char.IsFemale,'její','jeho')|l] hlas, ztišený úctou, říká: „Žiji, abych [Select_CString(first_char.IsFemale,'sloužila','sloužil')|l] [ROOT.Char.GetTitleAsNameNoTooltip].“"
 imperial_examination.9000.a: "[Select_CString(ROOT.Char.IsFemale,'Očekávala','Očekával')|U] jsem [ROOT.Char.GetInvolvedActivity.Custom('GetExamFocusSkill')|l]."
 imperial_examination.9000.a.tt_martial: "Tuto možnost získáváte kvůli vašemu $imperial_examination_focus_martial$ [Concept('activity_option','možnost aktivity')|E]"
 imperial_examination.9000.a.tt_learning: "Tuto možnost získáváte kvůli vašemu $imperial_examination_focus_learning$ [Concept('activity_option','možnost aktivity')|E]"
 imperial_examination.9000.a.tt_stewardship: "Tuto možnost získáváte kvůli vašemu $imperial_examination_focus_stewardship$ [Concept('activity_option','možnost aktivity')|E]"
 imperial_examination.9000.b: "[Select_CString(ROOT.Char.IsFemale,'Poctila','Poctil')|U] jsi říši."
 exam_focus_martial: "vojenský učenec"
 exam_focus_learning: "učenec vědění"
 exam_focus_stewardship: "učenec správy"
 examination_first_place_entrant_noticed_title: "Nebeské uznání"
 examination_first_place_entrant_noticed: "[host.GetTitleAsNameNoTooltip|U] [Select_CString(ROOT.Char.IsFemale,'pogratulovala','pogratuloval')|l] [TARGET_CHARACTER.GetShortUIName] k [Select_CString(TARGET_CHARACTER.IsFemale,'jejímu','jeho')|l] vysokému umístění."
 imperial_examination.9001.t: "Pod dohledem nebe"
 imperial_examination.9001.desc: "Kosmeticky ještě nevyschly kapky potu na mém čele, než mě přivedou před [host.GetTitleAsNameNoTooltip]. Ruka mě bolí z pevného sevření mého"
 imperial_examination.9001.desc_brush: "štětce"
 imperial_examination.9001.desc_weapon: "zbraně"
 imperial_examination.9001.desc_bridge: "po celý den. Je mi řečeno, že jsem [Select_CString(ROOT.Char.IsFemale,'dosáhla','dosáhl')|l] nejvyššího skóre ze všech vybraných [Select_CString(ROOT.Char.IsFemale,'ženy','muži')|l] v říši."
 imperial_examination.9001.desc_denied: "\n\nK mému překvapení [host.GetTitleAsNameNoTooltip] věnuje mému prostrčení jediný pohled, když se před [Select_CString(host.IsFemale,'ní','ním')|l] klaním, a pak říká: „[Select_CString(ROOT.Char.IsFemale,'Očekávala','Očekával')|l] jsem [ROOT.Char.GetInvolvedActivity.Custom('GetExamFocusSkill')|l].“\n\nMoje tvář zrudne, když přivedou jiného uchazeče, aby místo mě přijal pochvalu, [favored_entrant.Custom2('MyCharacterIntroduction', ROOT.Char)|l]."
 imperial_examination.9001.desc_merit: "\n\nPokloním se před [host.Custom('GetDaughterSon')|l] Nebes a ukloním se tak hluboko, jak mi to záda dovolí.\n\n„[Select_CString(ROOT.Char.IsFemale,'Poctila','Poctil')|l] jste říši dobře,“ říká [Select_CString(host.IsFemale,'ona','on')|l]. [Select_CString(ROOT.Char.IsFemale,'Zachytila','Zachytil')|U] jsem náznak pýchy v [Select_CString(host.IsFemale,'jejích','jeho')|l] očích? Světla v této soudní síni mi musí dělat iluze."
 imperial_examination.9001.a: "Žiji, abych [Select_CString(ROOT.Char.IsFemale,'sloužila','sloužil')|l]."
 imperial_examination.9001.b: "Nikdy na to nezapomenu!"
 imperial_examination.9001.c: "Budu lepší, za každou cenu."
 imperial_examination.9001.d: "Zachovej klid..."
 tgp_changed_ways_modifier: "Změněná cesta"
 tgp_changed_ways_modifier_desc: "Tato postava se vydala na novou cestu, aby lépe sloužila císařskému dvoru."
 imperial_examination.5000.t: "Obvyklé otázky"
 imperial_examination.5000.desc.cheater: "Cítím, jak mi oči vrstevníků pálí zátylek, když vcházím do zkušební síně a hledám svou kabinku. Kolik z nich ví o mém prohřešku? Představuji si to? Musím tyto myšlenky odložit a soustředit se na nadcházející esej."
 imperial_examination.5000.desc: "Zkoušející [examiner.GetTitledFirstName] mi vrhne ponižující pohled, zatímco se skláním na své místo a snažím se vzpamatovat před nadcházející esejí."
 imperial_examination.5000.desc_bridge: "\n\nMám se zabývat následujícím tématem:"
 governance_weaponry: "„Někdo tvrdí, že vlastní pouze kopí, zatímco tajně vlastní kuše. Jaký trest by [Select_CString(ROOT.Char.IsFemale,'měla','měl')|l] být uložen?“"
 governance_reinstatement: "„Zasloužilému úředníkovi je odmítnuto obnovení, zatímco nezáslužnému úředníkovi je obnovení uděleno. Jak by měla být situace posouzena?“"
 governance_documents: "„Pokud úředník otevře zapečetěný dokument bez náležitého oprávnění, jak by [Select_CString(ROOT.Char.IsFemale,'měla','měl')|l] být potrestán?"
 governance_filial: "„Pokud [Select_CString(ROOT.Char.IsFemale,'byla','byl')|l] zločinec bez známých příbuzných odsouzen k trestu smrti a po popravě je omilostněn, měly by se patřičné dokumenty změnit tak, aby mu byla obnovena pověst?“"
 imperial_examination.5000.a: "Kde je můj štětec!"
 imperial_examination.5000.a.cheater: "Udělám, co budu moci..."
 imperial_examination.5000.b: "„[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], jdi!“"
 imperial_examination.5000.c: "„Zkoušející [ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], prosím, podívejte se na #EMP mou#!! odpověď...“"
 imperial_examination.5000.d: "„Zkoušející [ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip], vzpomínáte si na #EMP mého#!! rodiče, že ano?“"
 imperial_examination.5000.e: "#EMP letmý pohled na skrytý papír s odpověďmi#!"
 imperial_examination.5000.f: "$imperial_examination.5000.d$"
 imperial_examination.duel.essay.critical_success.tt: "[Select_CString(ROOT.Char.IsFemale,'Napsala','Napsal')|U] jste kritiky oceňovanou esej"
 imperial_examination.duel.essay.great_success.tt: "[Select_CString(ROOT.Char.IsFemale,'Napsala','Napsal')|U] jste dobrou esej"
 imperial_examination.duel.essay.success.tt: "Vaše esej je uspokojivá"
 imperial_examination.duel.essay.failure.tt: "[Select_CString(ROOT.Char.IsFemale,'Selhala','Selhal')|U] jste při psaní pořádné eseje"
 imperial_examination.5050.t: "Mluvit jménem mudrců"
 imperial_examination.5050.history: "„Aby byla zachována záznam pravidel, podle Knihy dějin musí člověk znát vládců minulosti.“$imperial_examination.5050.desc$ Jsem [Select_CString(ROOT.Char.IsFemale,'požádána','požádán')|l], abych [Select_CString(ROOT.Char.IsFemale,'předvedla','předvedl')|l] své znalosti projevu [ROOT.Char.Custom('GetRandomHistoryPassage')|l]."
 imperial_examination.5050.changes: "„Kdo chce podle Knihy proměn překonat hmotné těžkosti, musí nalézt své místo ve vesmíru.“$imperial_examination.5050.desc$ Mám popsat, jak chápu výkladové metody textu, od tisíce stonků řebříčku po Šest zvířat."
 imperial_examination.5050.poetry: "„Aby se odráželo lidské chování, podle Knihy písní musí člověk postavit zrcadlo sebereflexe.“$imperial_examination.5050.desc$ Mám za úkol vyložit [ROOT.Char.Custom('GetRandomPoetryPassage')|l] básně."
 imperial_examination.5050.annals: "„Aby se analyzovala podstata pravd a lží, podle Jarních a podzimních kronik musí člověk poučit se z bláznivostí minulých dynastií.“$imperial_examination.5050.desc$ Musím rozvést [ROOT.Char.Custom('GetRandomAnnalsPassage')|l]."
 imperial_examination.5050.rites: "„Abychom pochopili řád světa, podle Knihy obřadů musí člověk respektovat správné ceremonie.“$imperial_examination.5050.desc$ Potřebuji vyjmenovat klíčové výroky [ROOT.Char.Custom('GetRandomRitesPassage')|l]."
 imperial_examination.5050.desc: "\n\nTak zní úvodní prohlášení v dotazníku před mnou. Prázdné místo uprostřed [ROOT.Char.Custom('GetWritingMaterial')|l] se zdá nepředstavitelně veliké.\n\nPro tento test,"
 imperial_examination.5050.a: "Jak pravil mistr Kong..."
 imperial_examination.5050.b: "„[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], jdi!“"
 imperial_examination.5050.c: "„Zkoušející [ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], pokud uvidíte #EMP mou#!! stranu příběhu...“"
 imperial_examination.5050.d: "„Zkoušející [ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip], má #EMP rodina#!! vždy tento text upřednostňovala.“"
 imperial_examination.5050.e: "$imperial_examination.5000.e$"
 imperial_examination.5050.f: "$imperial_examination.5050.d$"
 imperial_examination.duel.classics.critical_success.tt: "Vaše interpretace úryvku je mimořádně úspěšná"
 imperial_examination.duel.classics.great_success.tt: "[Select_CString(ROOT.Char.IsFemale,'Uvedla','Uvedl')|U] jste několik velmi dobrých poznámek k úryvku"
 imperial_examination.duel.classics.success.tt: "Váš výklad úryvku je uspokojivý"
 imperial_examination.duel.classics.failure.tt: "Zpackáte výklad úryvku"
 imperial_examination.5100.t: "[ROOT.Char.Custom('GetRegionalPoetryExam')|U] poezie"
 imperial_examination.5100.desc: "Uchazeči se shromažďují u zkušebních kabinek a já zaujmu své místo mezi nimi. Přes naši početnost je ticho kromě šustění listí po jemném vánku. U nedalekého oltáře hoří kadidlo a přináší mi jistý klid.\n\nMáme psát poezii ve čtyřverších. Pokud mám uspět,"
 imperial_examination.5100.desc.river: "musím nechat myšlenky téct čisté jako řeka."
 imperial_examination.5100.desc.straight: "musím nechat myšlenky zakořenit hluboko v zemi."
 imperial_examination.5100.desc.explosive: "musím psát vášnivě, bez zábran!"
 imperial_examination.5100.desc.lofty: "musím nechat myšlenky toulat se až k nejvzdálenějším výškám nebe."
 imperial_examination.5100.desc.fallback: "musím čerpat inspiraci ze všech básní, které jsem [Select_CString(ROOT.Char.IsFemale,'četla','četl')|l]."
 imperial_examination.5100.a: "Sahám po svém štětci."
 imperial_examination.5100.b: "„[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], jdi!“"
 imperial_examination.5100.c: "„Zkoušející [ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], věřím, že znáte rozsah mého talentu.“"
 imperial_examination.5100.d: "„Zkoušející [ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip], můj #EMP rodič#!! mě [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')|l] vše, co vím o poezii.“"
 imperial_examination.5100.e: "$imperial_examination.5000.e$"
 imperial_examination.5100.f: "Vím přesně, co napsat..."
 imperial_examination.5100.g: "$imperial_examination.5000.e$"
 imperial_examination.duel.poetry.critical_success.tt: "Zdá se, že se čas na okamžik zastaví, když přednesete svou báseň"
 imperial_examination.duel.poetry.great_success.tt: "Vaše poezie je skvělá"
 imperial_examination.duel.poetry.success.tt: "Vaše báseň je v pořádku"
 imperial_examination.duel.poetry.failure.tt: "Zakolísáte a nezvládnete napsat poutavou báseň"
 imperial_examination.5150.t: "Soutěž v lukostřelbě"
 imperial_examination.5150.desc: "Uchazeči se shromažďují na střelnici a já zaujmu své místo mezi nimi. \n\nPřes naši početnost panuje ticho kromě slabého klapání zbroje, když se přesouváme na pozice. Uchazeč přede mnou v řadě napíná svůj luk."
 imperial_examination.5150.a: "Pevně uchopím svůj luk."
 imperial_examination.5150.b: "„[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], ty vystřelíš.“"
 imperial_examination.5150.c: "„[ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], prosím, prohlédněte #EMP můj#!! terč...“"
 imperial_examination.5150.d: "„Zkoušející [ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip], znáte mého rodiče, že?“"
 imperial_examination.5150.e: "$imperial_examination.5150.d$"
 imperial_examination.duel.archery.critical_success.tt: "Tvůj výstřel je dokonalý"
 imperial_examination.duel.archery.great_success.tt: "Tvůj výstřel je velký úspěch"
 imperial_examination.duel.archery.success.tt: "Tvůj výstřel je uspokojivý"
 imperial_examination.duel.archery.failure.tt: "Tvůj výstřel zcela mine cíl"
 other_entrant_impressive_success: "z davu diváků zazní šepot souhlasu, když [Select_CString(other_entrant.IsFemale,'ona','on')|l] pevně zaboří [Select_CString(other_entrant.IsFemale,'její','jeho')|l] šíp do terče."
 other_entrant_spinning_safe: "Šíp letí nízkým obloukem, divoce se točí ve větru, ale přesto zasáhne dolní okraj terče."
 other_entrant_embarrased_cough: "Šíp letí tak mimo, že neslyším, jak dopadne za terčem. Někde někdo zakašle."
 other_entrant_piercing_success: "Šíp se zaboří do terče natolik, že z něj zezadu čouhá."
 other_entrant_drooping_safe: "Šíp dopadne na okraj terče. Mělký zásah nechá peří šípu sklesle viset."
 other_entrant_vanishing_arrow: "Šíp se zaryje do rohu terče, než zmizí za ním."
 imperial_examination.5160.t: "Ukázka polearmů"
 imperial_examination.5160.desc: "Váha uniformy je mým známým útěchou, když se postavím vedle ostatních uchazečů. Slaměné terče byly rozesazeny po celém nádvoří před palácem [ROOT.Char.GetCurrentLocation.GetName].\n\nMé kolo přichází. Hned po [other_entrant.GetTitledFirstName], který"
 imperial_examination.5160.a: "Zaujmu svou pozici."
 imperial_examination.5160.b: "„[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], zaujmi mé místo.“"
 imperial_examination.5160.c: "„Zkoušející [ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], sledujte mě!“"
 imperial_examination.5160.d: "„[ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip], víš o manželských schopnostech mého rodiče!“"
 imperial_examination.5160.e: "„[ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip], nepřipomíná ti to #EMP daleký dosah#! mé rodiny?“"
 other_entrant_cutting_success: "odsekne hlavu [Select_CString(other_entrant.IsFemale,'její','jeho')|l] terče efektním pohybem, který přivodí úsměv na tvářích zkoušejících."
 other_entrant_practiced_safe: "točí se, paríruje a odkopne [Select_CString(other_entrant.IsFemale,'jejího','jeho')|l] slaměného soupeře v obratných, byť poněkud předvídatelných pohybech."
 other_entrant_stuck_fail: "vykoná odvážný výpad proti [Select_CString(other_entrant.IsFemale,'jejími','jeho')|l] terči, ale nějak se mu/ji podaří zbraň zaseknout v malém slaměném těle."
 other_entrant_practiced_success: "pohybuje se s obratností a téměř přirozenou lehkostí, což vyvolá závistný šepot v davu."
 other_entrant_stumbling_fail: "zakopne a upadne, [Select_CString(other_entrant.IsFemale,'její','jeho')|l] zbraň s rachotem dopadne na zem. Oddechnu si úlevou."
 imperial_examination.duel.polearm.critical_success.tt: "Tvoje forma je dokonalá"
 imperial_examination.duel.polearm.great_success.tt: "Tvoje forma je působivá"
 imperial_examination.duel.polearm.success.tt: "Tvoje forma je uspokojivá"
 imperial_examination.duel.polearm.failure.tt: "Tvoje forma je nedostatečná"
 imperial_examination.5170.t: "Hodnocení lukostřelby z koně"
 imperial_examination.5170.desc: "Vstávám dřív než kohout, ostatní uchazeči i já jsme probuzeni a přivedeni na venkovní střelnici.\n\nČekají nás krásní koně na jasném hřebeni kopce. Uchazeč přede mnou v řadě připravuje svého koně a potom"
 imperial_examination.5170.a: "Popadnu otěže."
 imperial_examination.5170.b: "„[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], zaujmi mé místo.“"
 imperial_examination.5170.c: "„Zkoušející [ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], věnujte pozornost!“"
 imperial_examination.5170.d: "„Můj rodič je výborný jezdec-střelec. Že ano, [ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip]?“"
 imperial_examination.5170.e: "Luk a já jsme jedno. Nemohu selhat!"
 horse_exam_tourney_success_first: "Tuto možnost získáváte díky vašemu [GetTrait('tourney_participant').GetName( GetNullCharacter )] [Concept('trait','rysu')|E]"
 horse_exam_hunter_success_first: "Tuto možnost získáváte díky vašemu [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [Concept('trait','rysu')|E]"
 other_entrant_thundering_success: "vtrhne do pole, kopyta duní přes planinu. Přes rychlost koně [Select_CString(other_entrant.IsFemale,'ona','on')|l] sedí naprosto klidně na jeho hřbetě. Je to působivý a místy skličující pohled."
 other_entrant_practiced_ride: "cválá s obratnou lehkostí přes střelnici, ale postrádá odvahu natáhnout [Select_CString(other_entrant.IsFemale,'její','jeho')|l] luk, což je žalostné."
 other_entrant_spooked_horse: "zapíchne ostrohy, aby vylekal chudého tvora, který ho úspěšně shodí. Je to ubohý, ale do jisté míry uklidňující pohled."
 other_entrant_swift_success: "projede planinou rychle, posílá salvu šípů v rychlém sledu, [Select_CString(other_entrant.IsFemale,'její','jeho')|l] pohyby plynou jako voda."
 other_entrant_shortstop_fail: "cválá přes pole, [Select_CString(ROOT.Char.IsFemale,'nakloněna','nakloněn')|l] přesně vpřed nad sedlem, ale žádný z [Select_CString(other_entrant.IsFemale,'jejích','jeho')|l] šípů nepadá tam, kam má."
 imperial_examination.duel.riding.critical_success.tt: "Tvoje technika je dokonalá"
 imperial_examination.duel.riding.great_success.tt: "Tvoje technika je působivá"
 imperial_examination.duel.riding.success.tt: "Tvoje technika je uspokojivá"
 imperial_examination.duel.riding.failure.tt: "Tvoje technika je zklamáním"
 imperial_examination.6000.t: "[Select_CString(ROOT.Char.IsFemale,'Přistižena','Přistižen')|U]!"
 imperial_examination.6000.desc: "Potím se, zatímco si mě zkoušející [examiner.GetFirstName] přísně měří s rukama za zády. „Jak se #EMP opovažuješ#!!, ty drzé štěně! [Select_CString(examiner.IsFemale,'Měla','Měl')|U] bych hned vyhledat [activity.GetHost.Custom('CZ_TitleAsNameNoTooltip_A')] a zpravit [Select_CString(activity.GetHost.IsFemale,'Její','Jeho')|l] Excelenci o tvých #EMP neřestech#!!. Budeš-li mít štěstí, #EMP jenom#!! z tebe před popravou stáhnou kůži.“\n\nPo zádech mi stéká pot. Snažím se rychle zhodnotit situaci a odkašlat si v hrdle, které je najednou strašlivě suché:"
 imperial_examination.6000.a: "„Rámují mě, nevidíte to?!“"
 imperial_examination.6000.b: "„Určitě to můžeme nějak zařídit, aby to zmizelo!“"
 imperial_examination.6000.c: "„Víš, [friend_to_sacrifice.GetTitledFirstNameNoTooltip] [Select_CString(friend_to_sacrifice.IsFemale,'byla','byl')|l] #EMP ten skutečný#!! iniciátor... !“"
 imperial_examination.6000.d: "„To se #EMP nikdy#!! nestane znovu, přísahám!“"
 imperial_examination.6000.misdirection.success.tt: "Úspěšně přesvědčíte [examiner.GetShortUIName]"
 imperial_examination.6000.misdirection.failure.tt: "[examiner.GetShortUIName|U] není [Select_CString(examiner.IsFemale,'přesvědčena','přesvědčen')|l]"
