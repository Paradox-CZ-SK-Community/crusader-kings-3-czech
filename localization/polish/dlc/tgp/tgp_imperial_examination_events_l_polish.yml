 imperial_examination.score.great_success.tt: "Zvýšíš své [Concept('exam_score','skóre zkoušky')|E] o [EmptyScope.ScriptValue('imperial_examination_great_success_value')|P0]"
 imperial_examination.score.success.tt: "Zvýšíš své [Concept('exam_score','skóre zkoušky')|E] o [EmptyScope.ScriptValue('imperial_examination_success_value')|P0]"
