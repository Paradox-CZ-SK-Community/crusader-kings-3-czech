 imperial_examination.score.great_success.tt: "Zvýšíte svůj [Concept('exam_score','skóre zkoušky')|E] o [EmptyScope.ScriptValue('imperial_examination_great_success_value')|P0]"
 imperial_examination.score.success.tt: "Zvýšíte svůj [Concept('exam_score','skóre zkoušky')|E] o [EmptyScope.ScriptValue('imperial_examination_success_value')|P0]"
 imperial_examination.score.failure.tt: "Nezískáte žádné [Concept('exam_score','skóre zkoušky')|E]"
 imperial_examination.cheat.success.desc: "Úspěšně podvádíte při zkoušce"
 imperial_examination.cheat.success.tt: "Zvýšíte svůj [Concept('exam_score','skóre zkoušky')|E] o [EmptyScope.ScriptValue('imperial_examination_cheat_value')|P0]"
 imperial_examination.cheat.failure.desc: "Jste [Select_CString(ROOT.Char.IsFemale,'přistižena','přistižen')|l]"
 imperial_examination.cheat.failure.tt: "Jakékoli [Concept('merit','zásluhy')|E] získané z této [Concept('examination','zkoušky')|E] [Concept('activity','aktivity')|E] bude #N penalizováno#!!"
 imperial_examination.5200.t: "Ukázka střelby z luku"
 imperial_examination.5200.desc: "[host.GetTitleAsNameNoTooltip|U] se na mě zadívá hodnotícím pohledem. S širokým gestem směrem k nám soutěžícím [Select_CString(host.IsFemale,'ona','on')|l] prohlašuje, „Nesprávný postoj prozrazuje nedostatek ctnosti. Špatná technika odhaluje křehkou sílu vůle.“\n\n[Select_CString(host.IsFemale,'ona','on')|U] proplete [Select_CString(host.IsFemale,'její','jeho')|l] prsty a pohlédne přes nádvoří. „Z dráhy tvého šípu posoudím tvou schopnost dobývat města a chránit naše hranice. Toto je tvá poslední šance mě zaujmout.“\n\n[Select_CString(host.IsFemale,'ona','on')|U] se otočí a přizve mě kupředu."
 imperial_examination.5200.a: "Dám do toho vše!"
 imperial_examination.5200.b: "Raději nebudu riskovat."
 imperial_examination.5300.t: "Císařská esej"
 imperial_examination.5300.desc: "[host.GetTitleAsNameNoTooltip|U] se na mě zadívá hodnotícím pohledem. S širokým gestem směrem k nám soutěžícím [Select_CString(host.IsFemale,'ona','on')|l] prohlašuje, „Chabé klasické vzdělání prozrazuje nedostatek mravnosti. Slabý komentář odhaluje poddajné odhodlání.“\n\n[Select_CString(host.IsFemale,'ona','on')|U] spojí [Select_CString(host.IsFemale,'její','jeho')|l] prsty a pohlédne přes nádvoří. „Z tahů tvého štětce posoudím tvou schopnost vládnout lidu a udržovat naše tradice. Toto je tvá poslední šance mě zaujmout.“\n\n[Select_CString(host.IsFemale,'ona','on')|U] se otočí a přizve mě kupředu."
 imperial_examination.5300.a: "Předložím důkladné pojednání."
 imperial_examination.5300.b: "$imperial_examination.5200.b$"
 imperial_examination.5400.t: "$imperial_examination.5300.t$"
 imperial_examination.5400.desc: "$imperial_examination.5300.desc$"
