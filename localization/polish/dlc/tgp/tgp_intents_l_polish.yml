l_polish:
 imperial_exam_taker_intent: "Složit zkoušku"
 imperial_exam_taker_intent_desc: "Pokusíš se úspěšně složit zkoušku a získat další [Concept('merit','zásluhy')|E]."
 local_exam_taker_intent: "$imperial_exam_taker_intent$"
 local_exam_taker_intent_desc: "$imperial_exam_taker_intent_desc$"
 imperial_exam_support_entrants_intent: "Podpořit uchazeče"
 imperial_exam_support_entrants_intent_desc: "Budeš hledat příležitosti, jak zvýšit šance svých dostupných [Concept('disciples','učedníků')|E] a [Concept('close_family_members','členů blízké rodiny')|E]."
 local_exam_support_entrants_intent: "$imperial_exam_support_entrants_intent$"
 local_exam_support_entrants_intent_desc: "$imperial_exam_support_entrants_intent_desc$"
 exam_assist_exam_intent: "Pomáhat při zkoušce"
 exam_assist_exam_intent_desc: "Chceš navázat kontakty s budoucími úředníky a prohloubit své [GetTrait('confucian_education').GetName( GetNullCharacter )|l]."
 exam_recruit_courtiers_intent: "Vyhledávat talenty"
 exam_recruit_courtiers_intent_desc: "Budeš hledat nadané jedince mezi vybranými uchazeči ze všech koutů panství."
 exam_give_favor_intent: "Protežování"
 exam_give_favor_intent_desc: "Pokusíš se zvýšit šance svých [Concept('dynasty_members','členů dynastie')|E]."
 raise_cohesion_intent: "Posílit soudržnost"
 raise_cohesion_intent_desc: "Chceš posílit [Concept('cohesion','soudržnost')|E] uvnitř svého [Concept('bloc','bloku')|E]."
 add_to_bloc_intent: "Přilákat do bloku"
 add_to_bloc_intent_desc: "Pokusíš se zlepšit vztahy s jinou [Concept('house_head','hlavou rodu')|E] a přimět ji, aby se připojila k tvému [Concept('bloc','bloku')|E]."
 remove_from_bloc_intent: "Vytlačit z bloku"
