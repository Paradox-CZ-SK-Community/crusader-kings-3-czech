 debate_gain_disciples_intent: "Získat učedníky"
 debate_gain_disciples_intent_desc: "Budeš vyhledávat nadějné učence a získávat nové [Concept('disciples','učedníky')|E]."
 debate_gain_elder_intent: "Získat staršího"
 debate_gain_elder_intent_desc: "Chceš najít [Concept('elder','staršího')|E] nebo svého současného staršího nahradit bystřejším a vzdělanějším učencem."
