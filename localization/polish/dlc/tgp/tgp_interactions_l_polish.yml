 tgp_interaction_event.0015.desc: "Nejste v tomto konfliktu sami. [Select_CString(ROOT.Char.IsFemale,'Rozkázala','Rozkázal')|U] jsem [governor_joining.GetShortUIName], aby okamžitě [Select_CString(governor_joining.IsFemale,'shromáždila její','shromáždil jeho')|l] síly a [Select_CString(ROOT.Char.IsFemale,'pomohla','pomohl')|l] vám ve vašich válkách."
