 tgp_interaction_event.0010.opening: "[actor.Custom2('AppropriateGreetingPositive', ROOT.Char)|U]"
 tgp_interaction_event.0010.desc: "$celestial_request_military_aid_interaction_msg$"
 tgp_interaction_event.0010.a: "Postarám se o to [Select_CString(ROOT.Char.IsFemale,'sama','sám')|l]."
 tgp_interaction_event.0010.b: "Pošlete ihned zprávu [joining_governor.GetShortUINameNoTooltip]."
 tgp_interaction_event.0010.c: "Velmi dobře. Nařídím některému veliteli, aby se tím zabýval."
 tgp_interaction_event.0011.opening: "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char)|U]"
 tgp_interaction_event.0011.desc: "[actor.GetShortUIName|U] žádal o vojska v [Select_CString(actor.IsFemale,'její','jeho')|l] snaze zajistit mír a stabilitu [CZPrepV(actor.GetPrimaryTitle.GetNameNoTierNoTooltip)] [actor.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')]. Máte shromáždit své síly a okamžitě ukončit konflikt."
 tgp_interaction_event.0011.a: "Jak rozkázáno, [recipient.GetCouncilTitle|l]."
 tgp_interaction_event.0011.b: "Jak si přejete, [recipient.GetTitleAsNameNoTooltip]."
 tgp_interaction_event.0012.desc_marshal: "[Select_CString(ROOT.Char.IsFemale,'Obdržela','Obdržel')|U] jsem vaši žádost a [Select_CString(ROOT.Char.IsFemale,'rozhodla','rozhodl')|l] jsem se vám osobně pomoci. Mé prapory jsou vztyčeny a armáda je na cestě."
 tgp_interaction_event.0012.desc_governor: "[Select_CString(ROOT.Char.IsFemale,'Potvrdila','Potvrdil')|U] jsem vaši žádost a [Select_CString(ROOT.Char.IsFemale,'rozkázala','rozkázal')|l] jsem [joining_character.GetShortUIName] se připojit k vaší válce a pomoci vám. [Select_CString(joining_character.IsFemale,'Její','Jeho')|U] vojska jsou již na cestě."
 tgp_interaction_event.0012.a: "Výborně!"
