l_polish:
 celestial_demand_treasury_interaction: "Zabavit prostředky pokladnice"
 celestial_demand_treasury_interaction_desc: "Zabav část mimořádného bohatství v [Concept('treasury','pokladnici')|E] [recipient.Custom('CZ_ShortUINamePossessive')] a převeď ji do své pokladnice"
 celestial_demand_treasury_interaction_send_name: "$celestial_demand_treasury_interaction$"
 HIGHLIGHTED_DEMAND_TREASURY: "#weak [recipient.GetShortUINameNoTooltip|U] má #EMP velmi#!! velkou [Concept('treasury','pokladnice')]#!"
 celestial_demand_treasury_interaction_recipient_desc: "Neuniklo mi, že máš v pokladnici značné bohatství. Mé vlastní zásoby naproti tomu... řekněme, že jim prostředky scházejí. Prokážeš mi čest, když je pomůžeš doplnit. #EMP Polovina#!! tvé pokladnice postačí."
 celestial_demand_treasury_interaction_declined_desc: "[recipient.GetShortUIName|U] [Select_CString(recipient.IsFemale,'odmítla','odmítl')|l] žádost [actor.GetShortUINamePossessive] o prostředky"
 celestial_give_treasury_interaction: "Poslat prostředky"
 celestial_give_treasury_interaction_desc: "Podpoř [recipient.Custom('CZ_ShortUIName_A')] a území pod [recipient.Custom('GetProvinceConcept')|l] poskytnutím tolik potřebných prostředků [Concept('treasury','pokladnice')|E]"
 celestial_give_treasury_interaction_send_name: "$celestial_give_treasury_interaction$"
 celestial_give_treasury_interaction_recipient_desc: "Doneslo se mi, že máš prázdnou pokladnici. To zemi s úrovní [actor.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] jen škodí. Vezmi si toto stříbro z mých zásob. Nalož s ním moudře a pamatuj, čí to byl dar."
 HIGHLIGHTED_GIVE_TREASURY: "#weak [recipient.GetShortUINameNoTooltip|U] [Concept('treasury','pokladnice')] je velmi nízká a pomoc bude pravděpodobně velmi oceněna#!!"
 ALREADY_SENT_TREASURY_WARNING: "@warning_icon! #X Už jste [Concept('treasury','pokladnice')|E] poslali [recipient.GetShortUIName], odeslání více nyní #underline přepíše#!! stávající modifikátor [Concept('opinion','mínění')|E]!#!!"
 tgp_interaction_event.0001.desc: "Musím ti poděkovat za nedávnou pomoc s naplněním pokladnice. Nic jsi za ni [Select_CString(actor.IsFemale,'nepožadovala','nepožadoval')|l], přesto cítím, že ti dluh musím splatit. Jinak by mi tížil svědomí.\n\nPřijmi prosím tento projev mé vděčnosti."
 tgp_interaction_event.0001.a: "Překvapení to je, ale vítané."
