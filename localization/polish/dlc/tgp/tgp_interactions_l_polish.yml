 celestial_request_military_aid_interaction_msg: "Píši, abych vás informoval, že situace [CZPrepV(actor.GetPrimaryTitle.GetNameNoTierNoTooltip)] [actor.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')] je zoufalá a naléhavě potřebuji vojska, která mi pomohou v tomto probíhajícím konfliktu."
