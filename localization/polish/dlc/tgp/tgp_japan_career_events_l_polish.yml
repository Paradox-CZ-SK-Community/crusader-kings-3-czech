l_polish:
 tgp_japan_career.0001.t: "Příběh dynastie [new_ruler.GetDynastyNameNoTooltip]"
 tgp_japan_career.0001.desc: "[kampaku.GetPrimaryTitle.GetDefinitiveName|U] se hemží [Concept('blocs','mocenskými bloky')|E], které mezi sebou soupeří o vládu a vliv."
 tgp_japan_career.0001.soryo_desc: "Mé panství se řídí zřízením [new_ruler.GetGovernment.GetName]. Náš rod si podrobil provincie a potlačil vzpoury! Zasloužíme si určitou míru samostatnosti a vlastní moci, o jaké si změkčilí úředníci [Concept('ritsuryo','ricurjó')|E], kteří jen přehazují listiny v hlavním městě [kampaku.GetCapitalLocation.GetTitle.GetNameNoTier], mohou nechat zdát.\n\nMusím rozšířit své vojsko, bránit své léno a upevňovat naši nadvládu. Je na mně, abych [Select_CString(ROOT.Char.IsFemale,'obnovila','obnovil')] pořádek v [kampaku.GetPrimaryTitle.Custom('CZ_LandedNameNoTier_L')] a [Select_CString(ROOT.Char.IsFemale,'navrátila','navrátil')] slávu svému [Concept('house','rodu')|E] — rodu [new_ruler.GetHouse.GetName]!"
 tgp_japan_career.0001.ritsuryo_desc: "Mé panství se řídí zřízením [new_ruler.GetGovernment.GetName] a mé úřednické povinnosti mě poutají k hlavnímu městu [kampaku.GetCapitalLocation.GetTitle.GetNameNoTier]. Toto středisko moci a kultury nabízí úrodnou půdu pro posilování vlivu mého rodu, ať už příkladnými činy, nebo obratnou státnickou politikou.\n\nTyto vytříbené tradice však podkopávají ctižádostiví provinční válečníci [Concept('soryo','sórjó')|E], kteří usilují o upevnění vlastní moci a rozšiřování osobních lén."
 tgp_japan_career.0001.kampaku_desc: "Zastávám úřad [new_ruler.GetTitleAsNameNoTooltip] a jako [Concept('ceremonial_regent','vládnoucí regent')|E] nesu nejvyšší odpovědnost za celou říši. Z hlavního města [kampaku.GetCapitalLocation.GetTitle.GetNameNoTier] spravuji poddané [Concept('japanese_emperor_possessive','japonského císaře')|E] a snažím se udržet křehký mír.\n\nMusím obratně proplouvat mocenskými zápasy na neklidném dvoře plném prohnaných úředníků [Concept('ritsuryo','ricurjó')|E]. Zároveň mi stále větší starosti působí válečníci [Concept('soryo','sórjó')|E], kteří si v provinciích budují vlastní léna."
 tgp_japan_career.0001.tenno_desc: "Jako [Concept('japanese_emperor','japonský císař')|E] se věnuji především posvátným a obřadním povinnostem. O všechny světské záležitosti se stará [kampaku.GetTitleAsName], ale je to tak správně? V panství narůstá napětí. [Concept('rulers','Vládci')|EU] [Concept('soryo','sórjó')|E] si v provinciích zakládají vlastní léna a zpochybňují moc tradičních úředníků [Concept('ritsuryo','ricurjó')|E], kteří sídlí v mém hlavním městě [kampaku.GetCapitalLocation.GetTitle.GetNameNoTier].\n\nMohli by právě tito nositelé změn napomoci návratu skutečné císařské vlády, v níž by mi jako [new_ruler.GetTitleAsName] opět náležela správa nebeských i pozemských záležitostí?"
 tgp_japan_career.0001.desc_2: "\n\nKaždý z nás má svou úlohu. A každý ji také musí sehrát!"
 tgp_japan_career.0001.a: "Ať přijde cokoli, vytrváme."
 tgp_japan_career.0001.b: "Mír je pomíjivý. Musíme být připraveni!"
 tgp_japan_peace_modifier: "Úsilí o stabilitu"
 tgp_japan_peace_modifier_desc: "Tato postava se soustředí na překonávání všech překážek s jasnou a klidnou myslí."
 tgp_japan_war_modifier: "Příprava na konflikt"
 tgp_japan_war_modifier_desc: "Tato postava je přesvědčena, že se blíží válka, a hodlá na ni být připravena."
