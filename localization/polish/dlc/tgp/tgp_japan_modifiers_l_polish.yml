l_polish:
 tgp_japan_fresh_fish_county_modifier: "Čerstvé ryby"
 tgp_japan_fresh_fish_county_modifier_desc: "Obyvatelé tohoto hrabství mají pravidelný přísun čerstvě ulovených ryb."
 tgp_japan_pearl_county_modifier: "Vzácné perly"
 tgp_japan_pearl_county_modifier_desc: "Potápěči tohoto hrabství občas nacházejí cenné perly, které mohou prodat."
 tgp_japan_abalone_temple_offerings_county_modifier: "Chrámové obětiny"
 tgp_japan_abalone_temple_offerings_county_modifier_desc: "Potápěči tohoto hrabství prodávají mořské ušně, o nichž se věří, že přinášejí dlouhověkost."
 tgp_japan_taxed_entertainment_county_modifier: "Zdaněná zábava"
 tgp_japan_taxed_entertainment_county_modifier_desc: "V tomto hrabství se nepromešká jediná příležitost naplnit státní pokladnici, a už vůbec ne tehdy, když se obyvatelé chtějí pobavit."
 tgp_japan_prized_generosity_county_modifier: "Odměňovaná štědrost"
 tgp_japan_prized_generosity_county_modifier_desc: "Sotva co podněcuje zdravé soupeření mezi vesnicemi tak účinně jako příslib odměny pro vítěze. Obyvatelé tohoto hrabství mají motivace více než dost."
 tgp_japan_fire_drilled_county_modifier: "Domácnosti připravené na požár"
 tgp_japan_fire_drilled_county_modifier_desc: "Obyvatelé tohoto hrabství byli důkladně poučeni o nebezpečí požárů. Každá domácnost má za povinnost udržovat připravený kbelík pro případ vypuknutí ohně."
 tgp_japan_instructive_plays_county_modifier: "Poučná mravoučná představení"
 tgp_japan_instructive_plays_county_modifier_desc: "Obyvatelům tohoto hrabství se jejich místo ve společnosti připomíná i tehdy, když na něj chtějí alespoň na pár hodin zapomenout při divadelním představení."
 tpg_japan_hot_spring_relaxation_modifier: "Odpočinek v onsenu"
 tpg_japan_hot_spring_relaxation_modifier_desc: "Tato postava si dopřála osvěžující koupel v [Glossary( 'onsenu', 'ONSEN_GLOSS' )]."
 tgp_japan_hot_spring_mystic_positive_modifier: "Omlazený duch"
 tgp_japan_hot_spring_mystic_positive_modifier_desc: "Tato postava pochopila, jak dosáhnout souladu s vlastním duchovním já."
 tgp_japan_hot_spring_mystic_neutral_modifier: "Skeptický duch"
 tgp_japan_hot_spring_mystic_neutral_modifier_desc: "Tato postava #EMP něco#! pocítila, ale nedokázala přijít na to, co to vlastně bylo."
 tgp_japan_hot_spring_mystic_negative_modifier: "Nesoustředěný duch"
 tgp_japan_hot_spring_mystic_negative_modifier_desc: "Této postavě se nepodařilo navázat spojení s vlastním duchovním já."
 tgp_japan_sake_offering_county_modifier: "Obětování saké"
 tgp_japan_sake_offering_county_modifier_desc: "Vládce tohoto hrabství prokázal během slavnosti rozkvetlých třešní úctu božstvům."
 tgp_japan_sake_offering_character_modifier: "Dar saké"
 tgp_japan_sake_offering_character_modifier_desc: "Tato postava prokázala během slavnosti rozkvetlých třešní úctu božstvům."
 tgp_japan_tengu_rumors_character_modifier: "Zvěsti o tengu"
 tgp_japan_tengu_rumors_character_modifier_desc: "Tato postava po vyslechnutí zvěstí stále pátrá po bájné bytosti [Glossary( 'tengu', 'TENGU_GLOSS' )].\n\nŘíká se, že kdo se s takovou bytostí setká a dokáže na ni zapůsobit, získá štědrou odměnu."
 tgp_japan_cautious_curiosity_character_modifier: "Opatrná zvědavost"
 tgp_japan_cautious_curiosity_character_modifier_desc: "Tato postava se nedávno nechala napálit pouhou fámou."
 tpg_japan_add_fish_to_pond_modifier: "Jezírko plné ryb"
 tpg_japan_add_fish_to_pond_modifier_desc: "Zahradník této postavy vysadil do jejího jezírka další ryby, díky čemuž se stalo oblíbeným místem návštěv dvořanů."
 tgp_japan_train_with_troops_modifier: "Nadšení vojáci"
 tgp_japan_train_with_troops_modifier_desc: "Tato postava přednesla proslov, kterým povzbudila své vojáky před nadcházejícími bitvami."
 tgp_learned_from_onibi_modifier: "Poučení od onibi"
 tgp_learned_from_onibi_modifier_desc: "Tato postava při rozpravě o [Glossary( 'onibi', 'ONIBI_GLOSS' )] získala cenné poznatky."
 tgp_buddhist_fighting_modifier: "Náboženské rozbroje"
 tgp_buddhist_fighting_modifier_desc: "Tato postava nečinně přihlížela, jak různé buddhistické sekty bojují o nadvládu v jejím panství."
 tgp_siren_yokai_love_modifier: "Hledání lásky"
 tgp_siren_yokai_love_modifier_desc: "Bájná bytost [Glossary( 'jókai', 'YOKAI_GLOSS' )] v této postavě probudila touhu najít lásku."
 tgp_siren_yokai_prose_modifier: "Začínající vypravěč"
 tgp_siren_yokai_prose_modifier_desc: "Tuto postavu inspirovaly písně, které jí ve snu zpívala bytost [Glossary( 'jókai', 'YOKAI_GLOSS' )]. Nyní se rozhodla psát vlastní příběhy."
 tgp_garden_yokai_bloom_modifier: "Rozkvetlá zahrada"
 tgp_garden_yokai_bloom_modifier_desc: "Tato postava věří, že spatřila bytost [Glossary( 'jókai', 'YOKAI_GLOSS' )], která ji inspirovala k zvelebení vlastní zahrady."
 tgp_garden_yokai_building_modifier: "Začínající architekt"
 tgp_garden_yokai_building_modifier_desc: "Tato postava věří, že spatřila bytost [Glossary( 'jókai', 'YOKAI_GLOSS' )], která ji inspirovala k výstavbě nových budov v jejím panství."
 tgp_shadow_yokai_imitation_modifier: "Hrozivá přítomnost"
 tgp_shadow_yokai_imitation_modifier_desc: "Tato postava působí hrozivě, protože věří, že má za spojence bájnou bytost [Glossary( 'jókai', 'YOKAI_GLOSS' )]."
 tgp_shadow_yokai_torch_modifier: "Posílené hlídky"
 tgp_shadow_yokai_torch_modifier_desc: "Tato postava věří, že její stín posedla bytost [Glossary( 'jókai', 'YOKAI_GLOSS' )], a proto posiluje obranu svého panství."
 tgp_shrine_heir_modifier: "Přízeň rodu"
 tgp_shrine_heir_modifier_desc: "Tato postava se při modlitbě ve svatyni zamyslela nad budoucností svého rodu a rozhodla se investovat do jejího zajištění."
 tgp_shrine_piety_modifier: "Věrný služebník"
 tgp_shrine_piety_modifier_desc: "Modlitba ve svatyni posílila víru této postavy."
 tgp_shrine_wealth_modifier: "Hospodářská prosperita"
 tgp_shrine_wealth_modifier_desc: "Tato postava se při modlitbě ve svatyni rozhodla věnovat více prostředků rozmnožování svého bohatství."
 tgp_shrine_health_modifier: "Posílené tělo"
 tgp_shrine_health_modifier_desc: "Tato postava se při modlitbě ve svatyni rozhodla více investovat do svého zdraví."
 tgp_traveling_safe_modifier: "Obezřetný cestovatel"
 tgp_traveling_safe_modifier_desc: "Tato postava na cestách postupuje obezřetně a vyhýbá se možným nebezpečím, aniž by zpomalovala."
 tgp_rule_follower_modifier: "Poslušný poddaný"
 tgp_rule_follower_modifier_desc: "Tento vládce dodržuje zákony svého nadřízeného panovníka a jeho poddaní se díky tomu rovněž podřizují stanoveným pravidlům."
 tgp_attentive_care_modifier: "Pečlivá péče"
 tgp_attentive_care_modifier_desc: "O potřeby této postavy je pečlivě postaráno."
 tgp_neglected_modifier: "Zanedbávání"
 tgp_neglected_modifier_desc: "Zdraví této postavy je až na druhém místě."
 tgp_law_defender: "Prosazování práva"
 tgp_law_defender_desc: "Tato postava dbá na to, aby si všichni zločinci odpykali své tresty."
 tgp_temple_builder_modifier: "Stavitel svatyní"
 tgp_temple_builder_modifier_desc: "Tato postava nedávno obnovila svatyni, kterou zachvátil požár."
 tgp_rebuilder_modifier: "Začínající architekt"
 tgp_rebuilder_modifier_desc: "Tato postava se zaměřuje na výstavbu světských budov.\n\n#warning Nelze stavět [Concept('temples','chrámy')|E]!#!"
 tgp_burned_yokai_modifier: "Lovec jókai"
 tgp_burned_yokai_modifier_desc: "Tato postava je v poslední době mnohem obezřetnější vůči bytostem [Glossary( 'jókai', 'YOKAI_GLOSS' )]."
 tgp_burned_weather_modifier: "Zpevněné budovy"
 tgp_burned_weather_modifier_desc: "Tato postava nechala své budovy zpevnit, aby lépe odolávaly přírodním pohromám.\nZtráta [Concept('development','rozvoje')|E] v důsledku [Concept('natural_disasters','přírodních pohrom')|E]: #P -20 %#!"
 tgp_faith_defender_modifier: "Odpůrce kacířů"
 tgp_faith_defender_modifier_desc: "Tato postava nemá pro nevěřící příliš pochopení."
 tgp_people_mingler_modifier: "Velkorysá vláda"
 tgp_people_mingler_modifier_desc: "Tato postava prokázala na svém dvoře velkorysost a ušlechtilost."
 tgp_scheme_wary_modifier: "Soukromý vyšetřovatel"
 tgp_scheme_wary_modifier_desc: "Tato postava má vlastní poznatky o tajemstvích ukrývaných na svém dvoře."
 tgp_fertility_boost_modifier: "Plodná bedra"
 tgp_fertility_boost_modifier_desc: "Tato postava věnuje zvláštní pozornost zplození dědice."
 tgp_longer_life_modifier: "Vytrvalý vládce"
 tgp_longer_life_modifier_desc: "Navzdory pokročilému věku se tento vládce snaží dožít co nejvyššího stáří."
 tgp_guilt_fever_modifier: "Horečka výčitek"
 tgp_guilt_fever_modifier_desc: "Tuto postavu tíží následky vlastních činů."
 tgp_reflection_modifier: "Cesta osudu"
 tgp_reflection_modifier_desc: "Tato postava v poslední době hodně rozjímá a je otevřenější hlubšímu poznávání své víry.\nCena [Concept('pilgrimage','pouti')|E]: #P -20 %#!"
 tgp_japan_drafted_villagers_modifier: "Odvedení vesničané"
 tgp_japan_drafted_villagers_modifier_desc: "Tato postava má cit pro rozpoznávání talentu a dobře ví, že pro silné a zdatné vesničany se vždy najde nějaké využití."
 tgp_japan_precise_insight_modifer: "Bystrý úsudek"
 tgp_japan_precise_insight_modifer_desc: "Tato postava dokáže odhalit strategicky cenné poznatky i v těch nejobyčejnějších situacích a následně je využít ve vojenství."
 tgp_japan_banisher_of_demons_modifer: "Vyháněč démonů"
 tgp_japan_banisher_of_demons_modifer_desc: "Ať už šlo o maškarádu, nebo ne, vyhnání nočních „démonů“ ozbrojených pochodněmi upevnilo pověst této postavy."
 tgp_japan_lucky_fan_fragments_modifier: "Úlomky vějíře pro štěstí"
 tgp_japan_lucky_fan_fragments_modifier_desc: "Tato postava sice nezískala hlavní cenu v lukostřelecké soutěži, ale odnesla si alespoň kousek terče. Říká se, že každému, kdo si takový úlomek ponechá, přinese štěstí."
 tgp_japan_a_poetic_life_modifier: "Poetický život"
 tgp_japan_a_poetic_life_modifier_desc: "Tato postava se rozhodla žít život naplněný poezií. Je otevřená novým zážitkům a ostatní s ní rádi sdílejí své vlastní."
 tgp_japan_made_high_liege_cuckold_modifier: "Poetický život: Císařská nesmrtelnost"
 tgp_japan_made_high_liege_cuckold_modifier_desc: "Tato postava si zajistila nesmrtelnou slávu milostným poměrem s chotí svého lenního pána. Tento zážitek se navíc stane inspirací pro její další básnickou tvorbu."
 tgp_japan_exchanged_verses_modifier: "Poetický život: Výměna veršů"
 tgp_japan_exchanged_verses_modifier_desc: "Tato postava obohatila svůj básnický repertoár díky společné tvorbě veršů."
 tgp_japan_poetic_to_the_powerful_modifier: "Básník mocných"
 tgp_japan_poetic_to_the_powerful_modifier_desc: "Tato postava si důmyslně složenými verši zlepšila vztah s významnou osobností."
 tgp_japan_poet_poisonous_flowers_modifier: "Jedovaté květiny"
 tgp_japan_poet_poisonous_flowers_modifier_desc: "Tato postava nasbírala několik jedovatých květin. K čemu je hodlá použít, to může každý jen hádat..."
 tgp_japan_poet_medicinal_flowers_modifier: "Léčivé květiny"
 tgp_japan_poet_medicinal_flowers_modifier_desc: "Tato postava nasbírala léčivé květiny, aby si jejich prostřednictvím zlepšila zdraví."
 tgp_japan_made_poetic_life_artifact_modifier: "Poetický život: Tisíc nesmrtelných listů"
 tgp_japan_made_poetic_life_artifact_modifier_desc: "Tato postava svou básnickou tvorbou vytvořila dílo, které se stalo jedním z pilířů [Concept('culture','kultury')|E]."
 tgp_sharing_power_modifier: "Sdílení moci"
 tgp_sharing_power_modifier_desc: "Tato postava se dělí o svou moc s ostatními, aby zmírnila vlastní stres."
 tgp_power_undermined_modifier: "Podkopaná moc"
 tgp_power_undermined_modifier_desc: "Moc této postavy byla oslabena zásahem vnější síly.\n@declare_regent_icon! Přijetí požadavku na jmenování regentem: #P +25#!"
 tgp_spreading_scholarly_work_modifier: "Šíření učených spisů"
 tgp_spreading_scholarly_work_modifier_desc: "Tato postava podporuje učence ve svém panství, aby sepisovali eseje a memoranda."
 tgp_regent_minted_coin_modifier: "Mince s vlastní podobiznou"
 tgp_regent_minted_coin_modifier_desc: "Tato postava nechala razit mince se svou podobiznou."
 tgp_regent_history_modifier: "Podporovaní učenci"
 tgp_regent_history_modifier_desc: "Tato postava povzbuzovala učence a básníky, aby psali o její velikosti."
 tgp_regent_guarded_modifier: "Povzbuzování morálky"
 tgp_regent_guarded_modifier_desc: "Tato postava dobře ví, jak působit na vojenské velitele a rytíře."
 tgp_stability_tree_modifier: "Pevné kořeny"
 tgp_stability_tree_modifier_desc: "Stejně jako kořeny [Glossary( 'bonsaje', 'BONSAI_GLOSS' )] jsou i panství a dvůr této postavy pevné a stabilní."
 tgp_health_resistance_modifier: "Upevněné zdraví"
 tgp_health_resistance_modifier_desc: "Tato postava se během společných modliteb s mnichem stravovala chrámovou stravou. Zdravější jídelníček prospěl jejímu zdraví."
 tgp_cultural_appreciation_modifier: "Porozumění jazykům"
 tgp_cultural_appreciation_modifier_desc: "Tato postava si uvědomuje rozdíly mezi jednotlivými jazyky a dokáže je ocenit."
 tgp_japan_ushiwakamaru: "Ušiwakamaru"
 tgp_japan_ushiwakamaru_desc: "Tato postava je silná jako býk a nepřestane vyhledávat stále mocnější protivníky, s nimiž by mohla změřit síly v souboji.\n$stay_duelist_adventurer$"
 tgp_japan_ushiwakamaru_2: "$tgp_japan_ushiwakamaru$"
 tgp_japan_ushiwakamaru_2_desc: "Tato postava je silná jako býk a nepřestane vyhledávat stále mocnější protivníky, s nimiž by mohla změřit síly v souboji.\n$stay_duelist_adventurer$"
 tgp_japan_ushiwakamaru_3: "$tgp_japan_ushiwakamaru$"
 tgp_japan_ushiwakamaru_3_desc: "Tato postava je silná jako býk a nepřestane vyhledávat stále mocnější protivníky, s nimiž by mohla změřit síly v souboji.\n$stay_duelist_adventurer$"
 tgp_japan_ushiwakamaru_4: "$tgp_japan_ushiwakamaru$"
 tgp_japan_ushiwakamaru_4_desc: "Tato postava je silná jako býk a nepřestane vyhledávat stále mocnější protivníky, s nimiž by mohla změřit síly v souboji.\n#help Tato postava již dosáhla svého plného potenciálu#!"
 tgp_japan_control_over_emperor: "Císařův loutkovodič"
 tgp_japan_control_over_emperor_desc: "Tato postava dosadila na trůn poslušného císaře, kterého může snadno ovládat."
 tgp_japan_fujiwara_hidehira_back_in_town: "Mečem k moci"
 tgp_japan_fujiwara_hidehira_back_in_town_desc: "Tato postava hodlá silou navrátit rodu Fudžiwara jeho někdejší moc."
 tgp_moved_shogun_court_modifier: "Hlavní město šógunátu"
 tgp_moved_shogun_court_modifier_desc: "V tomto hrabství se buduje nové hlavní město šógunátu, oddělené od císařského hlavního města."
 tgp_festival_prosperity: "Blahobyt díky slavnosti"
 tgp_festival_prosperity_desc: "V tomto hrabství se konala úspěšná a prosperující slavnost."
 ceremonial_liege_appointment_support_desc: "Podpora ceremoniálního lenního pána"
