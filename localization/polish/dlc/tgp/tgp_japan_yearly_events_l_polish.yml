l_polish:
 tgp_japan_yearly_events.0001.t: "Šíření radosti"
 tgp_japan_yearly_events.0001.desc: "Ačkoliv jsem v blízkém vztahu s [Select_CString(gift_receiver.IsFemale,'mou','mým')|l] [ROOT.Char.Custom2('CZ_RelationToMeShort_I', gift_receiver)|l], [gift_receiver.GetFirstName], nemohu si nevšimnout, že se [Select_CString(gift_receiver.IsFemale,'ona','on')|l] usmívá méně než obvykle. Nerad/a bych si [Select_CString(ROOT.Char.IsFemale,'pomyslela','pomyslel')|l], že je to kvůli mně!\n\nKdyž prohlížím, co trh nabízí, narazím na prodejce, který nabízí různé elegantní [Glossary( 'uchiwa', 'UCHIWA_GLOSS' )]. Trvá na tom:\n\n„Zabalené do tvého [Glossary( 'furoshiki', 'FUROSHIKI_GLOSS' )] to ten, kdo to dostane, bude vědět, že chceš rozdávat radost!“"
 tgp_japan_yearly_events.0001.a: "Je to dokonalý dárek, který potěší [gift_receiver.GetFirstNameNoTooltip]."
 tgp_japan_yearly_events.0001.tt.gift_appreciation: "oceňuje dar"
 tgp_japan_yearly_events.0001.a_spouse_toast: "[gift_receiver.GetTitledFirstNameNoTooltip|U] $tgp_japan_yearly_events.0001.tt.gift_appreciation$"
 tgp_japan_yearly_events.0001.friend_toast: "[gift_receiver.GetTitledFirstNameNoTooltip|U] $tgp_japan_yearly_events.0001.tt.gift_appreciation$"
 tgp_japan_yearly_events.0001.lover_toast: "[gift_receiver.GetTitledFirstNameNoTooltip|U] $tgp_japan_yearly_events.0001.tt.gift_appreciation$"
 tgp_japan_yearly_events.0001.b: "Ne, tohle je pro [Select_CString(gift_receiver.IsFemale,'ni','něj')|l] příliš pěkný dar..."
 tgp_japan_yearly_events.0001.b.flavor: "...ale dokonalý dárek pro mě!"
 tgp_japan_yearly_events.0001.c: "Ti špinaví obchodníci mě unavují."
 UCHIWA_GLOSS: "Elegantní, kulatý vějíř z dynastie Tchang (618-907 n. l.) z Číny, který si díky obchodním misím do Číny získal popularitu mezi japonskou šlechtou. Často byl spojován s létem a ženskostí. Jejich obliba a krásné zdobení vedly k přijetí sumptuárních zákonů omezujících jejich výzdobu."
 FUROSHIKI_GLOSS: "Dekorativní a funkční látka. Doslova „bath spread“, z furo, což znamená „bath“, a shiki, což znamená „spread“. Termín pochází z doby, kdy šlechta navštěvovala lázně a balila své věci do látky ozdobené rodovým erbem."
 uchiwa: "Uchiwa"
 uchiwa_desc: "Na tomto ručně vyráběném vějíři z bambusu a papíru jsou jemné vzory."
 tgp_japan_yearly_events.0006.t: "Poklady z moře"
 tgp_japan_yearly_events.0006.desc: "Když kráčím po pobřeží v [pearl_diver.GetCurrentLocation.GetBaronyNameExplicitly], narazím na skupinu [Glossary( 'Ama', 'AMA_DIVERS_GLOSS' )] potápěček, jak zkoumají svůj úlovek.\n\nJejich vůdce zakrývá sebe a přistupuje: „[ROOT.Char.Custom('FormOfAddressForLiege')|U], pohlédněte na bohatství, které moře dává!“\n\nRozmanitost perel a šťavnatých abalonů je skutečně působivá."
 tgp_japan_yearly_events.0006.a: "Tento úlovek bychom měli sdílet s místními."
 tgp_japan_yearly_events.0006.tt.success: "Úspěšně uzavřete dohodu"
 tgp_japan_yearly_events.0006.tt.failure: "[pearl_diver.GetTitledFirstNameNoTooltip|U] isn't convinced"
 tgp_japan_yearly_events.0006.b: "Mohu vám ušetřit cestu na trh."
 tgp_japan_yearly_events.0006.c: "Chrám by byl poctěn tím, co poskytuje [ROOT.Char.GetFaith.WaterGodName]."
 tgp_japan_yearly_events.0006.d: "Jste dokladem svého řemesla, musím pokračovat."
 AMA_DIVERS_GLOSS: "#bold Ama#!! — což znamená „mořské ženy“ — jsou potápěčky specializované na sběr perel a mořských plodů ze dna. Jsou proslulé svou schopností zadržet dech na dlouhé doby."
 tgp_japan_yearly_events.0012.t: "Opičí kousky"
 tgp_japan_yearly_events.0012.desc: "Při výstupu po [ROOT.Char.GetCurrentLocation.Custom('CZ_GetTerrainTypePlural_L')|l] v [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] mě zahalí teplá mlha.\n\nJaké štěstí! Zahledím pářící [Glossary( 'onsen', 'ONSEN_GLOSS' )], ale nezdá se, že bych byl jejím prvním hostem dne.\n\nŠibalá sněžná opice už vstoupila do koupele! Ačkoliv jsou mé svaly unavené a podpaží mi začíná páchnout, pochybuji, že koupání s divokým zvířetem je bezpečné?"
 tgp_japan_yearly_events.0012.a: "#EMP Máchejte pažemi a křičte."
 tgp_japan_yearly_events.0012.a.monkey.martial.tt.success: "Opice uteče vyděšená"
 tgp_japan_yearly_events.0012.a.monkey.martial.tt.failure: "Opice ignoruje můj ubohý pokus ji vystrašit"
 tgp_japan_yearly_events.0012.b: "Předstírat, že nejsem hrozba."
 tgp_japan_yearly_events.0012.b.monkey.intrigue.tt.success: "Opice vypadá zaujatě, ale nechá mě být"
 tgp_japan_yearly_events.0012.b.monkey.intrigue.tt.failure: "Opice se na mě vrhne a donutí mě ustoupit"
 tgp_japan_yearly_events.0012.c: "Nezahrávejte si s opicí."
 tgp_japan_yearly_events.0013.t: "Očista ducha"
 tgp_japan_yearly_events.0013.desc: "Tichý zpěv mě volá po horské stezce. Když se přiblížím ke zdroji, setkám se s hustým závojem teplé mlhy, který zahalí siluetu [Select_CString(mystic.IsFemale,'žena','muž')|l].\n\n[Select_CString(mystic.IsFemale,'ona','on')|U] se jen podívá mým směrem a pokyne mi, abych se [Select_CString(ROOT.Char.IsFemale,'připojila','připojil')|l] k [Select_CString(mystic.IsFemale,'ní','němu')|l] v [Glossary( 'onsen', 'ONSEN_GLOSS' )]. Zdá se, že se chystá rituál."
 tgp_japan_yearly_events.0013.a: "Zúčastnit se obřadu."
 tgp_japan_yearly_mystic_positive.tt: "Hledám v sobě hlubokou pravdu"
 tgp_japan_yearly_mystic_neutral.tt: "Snažím se porozumět významu slov"
 tgp_japan_yearly_mystic_negative.tt: "Nechápu, co se ode mě žádá"
 tgp_japan_yearly_events.0013.b: "Požádat mystika o vedení."
 tgp_japan_yearly_events.0013.b.mystic.learning.tt.success: "Rozumím významu moudrosti"
 tgp_japan_yearly_events.0013.b.mystic.learning.tt.failure: "Nemám tušení, co se říká"
 tgp_japan_yearly_events.0013.c: "Nechte [Select_CString(mystic.IsFemale,'ji','jej')|l] v klidu."
 tgp_japan_yearly_events.0014.t: "Vítaná úleva"
 tgp_japan_yearly_events.0014.desc: "Můj dech je těžký, když vdechuji řídký a mrazivý horský vzduch. Když se z cesty podívám k vrcholu, spatřím vizi vlnící se mlhy a rozpuštěného sněhu na blízkých stromech.\n\nKdyž dorazím ke zdroji, konečně si mohu oddechnout a obdivovat lákající [Glossary( 'onsen', 'ONSEN_GLOSS' )] přede mnou."
 tgp_japan_yearly_events.0014.a: "Kdo by odolal horkému prameni?!"
 tgp_japan_yearly_events.0014.b: "Zůstat ještě chvíli."
 tgp_japan_yearly_events.0014.c: "Není čas ztrácet."
 ONSEN_GLOSS: "#bold Onsen#!! — japonské horké prameny — přírodní prameny známé svými léčivými účinky."
 tgp_japan_yearly_events.0021.t: "Mezi květy"
 tgp_japan_yearly_events.0021.desc: "[Glossary( 'Hanami', 'HANAMI_GLOSS' )] je tady! Třešně, těžké bohatými květy, zvedají náladu všem. Lidé [CZPrepZ(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetCurrentLocation,'G')] vědí, kdy zasadit rýži a modlí se za hojnou úrodu.\n\n[Select_CString(hanami_enjoyer.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMe', hanami_enjoyer)|l], [hanami_enjoyer.GetTitledFirstName] prohlašuje: „Život je jako pomíjivá krása květu.“ [Select_CString(hanami_enjoyer.IsFemale,'Její','Jeho')|U] slova mi připomínají, že je třeba oběť."
 tgp_japan_yearly_events.0021.a: "Nabízím trochu saké."
 tgp_japan_yearly_events.0021.a_pleased_deities.tt: "Bohové #EMP se zdají#!!, že si všimli mých činů"
 tgp_japan_yearly_events.0021.a_char_modifier.tt: "Mám pocit, že se mi z ramen uvolnilo břemeno"
 tgp_japan_yearly_events.0021.a_county_modifier.tt: "Obyvatelé spatřili mé činy"
 tgp_japan_yearly_events.0021.a_nothing_happens.tt: "Mé činy zůstaly bez odezvy"
 tgp_japan_yearly_events.0021.b: "Chvíli obdivovat stromy."
 HANAMI_GLOSS: "#bold Hanami#!! - „obdivování květů“, japonská tradice zděděná z Číny obdivovat květy švestky. Postupem času a pod vlivem poezie, jako je Příběh prince Genji, se v období Heian pozornost přesměrovala k třešňovým květům."
 tgp_japan_yearly_events.0026.t: "Pověsti o tengu"
 tgp_japan_yearly_events.0026.desc: "Hlas [Select_CString(rumormonger.IsFemale,'mé','mého')|l] [ROOT.Char.Custom2('CZ_RelationToMeShort_G', rumormonger)|l] [rumormonger.GetTitledFirstName] se nese z krčmy, následovaný saké naplněným smíchem [Select_CString(gossiper.IsFemale,'mé','mého')|l] [ROOT.Char.Custom2('CZ_RelationToMeShort_G', gossiper)|l] [gossiper.GetTitledFirstName].\n\n„Po celých našich nedobytných divokých krajích číhá [Glossary( 'Tengu', 'TENGU_GLOSS' )]! Příšera pokrytá peřím, jejíž povaha je stejně zuřivá jako její šermířské umění. Tenhle zlý duch odsuzuje vše, co je posvátné!\n\nPo dalším doušku [Select_CString(rumormonger.IsFemale,'její','jeho')|l] saké: „Ač by se mělo říct, že kdo se dokáže osvědčit v očích bestie, bude odměněn mistrovstvím bojové prohnanosti. Ale když se dívám na toto moře zbabělců, jsem si jistý, že je to ztracená věc!“"
 tgp_japan_yearly_events.0026.a: "Zajímalo by mě, jestli je to pravda."
 tgp_japan_yearly_events.0026.a.tt: "Až příště projdu horami nebo lesem, budu mít oči otevřené kvůli této tajemné bytosti."
 tgp_japan_yearly_events.0026.b: "Jen povídačky opilců..."
 TENGU_GLOSS: "#bold Tengu#!! — znamená „Nebeský pes“ — jsou forma [Glossary( 'Yokai', 'YOKAI_GLOSS' )], často zobrazovaná jako ptákovitá bytost. Ochranní, přesto nebezpeční duchové obývající hory nebo lesy. Nejznámější podoba Tengua v moderní době jsou jejich rudé tváře v kombinaci s dlouhým nosem."
 tgp_japan_yearly_events.0027.t: "Dokaž svou hodnotu"
 tgp_japan_yearly_events.0027.desc: "Když putuji divočinou [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], nemohu setřást příběhy, které jsem slyšel o [Glossary( 'Tengu', 'TENGU_GLOSS' )].\n\nKdyž není v dohledu ani duše, slyším jen tlukot vlastního srdce. Snažím se ovládnout své zrychlené dýchání z paniky, když se mi po zádech plíživě vkrádá strach... jsem sledován.\n\nMé oči se obrátí ke zvuku kroků. Zoufale přehlédnu okolí a spatřím odraz blesku čepele v husté mlze."
 tgp_japan_yearly_events.0027.a: "Musím bojovat."
 tgp_japan_yearly_events.0027.a.tt.success: "Žiji, abych mohl bojovat další den"
 tgp_japan_yearly_events.0027.a.tt.success_explanation: "Můžete získat další #P pozitivní#!! [Concept('traits','rysy')|EU]."
 tgp_japan_yearly_events.0027.a.tt.failure: "Prohrávám bitvu, ale ne bez újmy"
 tgp_japan_yearly_events.0027.b: "„Poslouchejte, co mám na srdci!“"
 tgp_japan_yearly_events.0027.b.tt.success: "se zdá být mými slovy [Select_CString(tengu_warrior.IsFemale,'přesvědčena','přesvědčen')|l]"
 tgp_japan_yearly_events.0027.b.tt.failure: "[Select_CString(tengu_warrior.IsFemale,'ona','on')|U] se nestará o to, co mám říct"
 tgp_japan_yearly_events.0027.c: "Utéct, dokud ještě můžu."
 tgp_japan_yearly_events.0028.t: "Svést z cesty"
 tgp_japan_yearly_events.0028.desc: "Ocitám se [ROOT.Char.GetCurrentLocation.Custom('CZ_GetTerrainTypePlural_In')|l] v [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] a nemohu si pomoct — mám oči otevřené hledajíc [Glossary( 'Tengu', 'TENGU_GLOSS' )].\n\nV životě jsem nezažil klidnější procházku po [ROOT.Char.GetCurrentLocation.Custom('CZ_GetTerrainTypePlural_L')|l]. Měl jsem vědět lépe, než věřit výmyslům opilce."
 tgp_japan_yearly_events.0028.a: "Už se nenechám oklamat."
 tgp_japan_yearly_events.0028.b: "Zařvat."
 tgp_japan_yearly_events.0029.t: "Technika Tengua"
 tgp_japan_yearly_events.0029.desc: "Ač [tengu_warrior.GetTitledFirstName] možná není [Glossary( 'Tengu', 'TENGU_GLOSS' )], [Select_CString(tengu_warrior.IsFemale,'ona','on')|l] je mistrem čepele!\n\nNespočet hodin pilného tréninku pod [Select_CString(tengu_warrior.IsFemale,'jejím','jeho')|l] bdělým okem se konečně vyplatilo.\n\nMůj meč už nepůsobí jako dřevorubcova sekera, je to krásné prodloužení mého těla, připravené dosáhnout a zasáhnout ty, kteří mi ublíží.\n\nMůj mistr mi připomíná: „To je teprve začátek, máš ještě mnoho co zvládnout.“"
 tgp_japan_yearly_events.0029.a: "Není dost jen srážet muže, musím je vést."
 tgp_japan_yearly_events.0029.b: "Počkám, kam mě tvůj výcvik zavede."
 tgp_japan_yearly_events.0036.t: "Odraz Čisté země"
 tgp_japan_yearly_events.0036.desc: "[Select_CString(gardener.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMe', gardener)|l] [gardener.GetTitledFirstName] dokončuje poslední úpravy rozšíření rybníka v mé zahradě.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|l] vaše zahrada je dokonalým odrazem ráje [ROOT.Char.GetFaith.GetName]! Mám přidat nějaké závěrečné úpravy?“"
 tgp_japan_yearly_events.0036.a: "Více lotosových květů a možná..."
 tgp_japan_yearly_events.0036.a.random_chance: "Čím vyšší vaše [Concept('stewardship','správcovství')|E], tím lepší šance:"
 tgp_japan_yearly_events.0036.b: "Více ryb!"
 tgp_japan_yearly_events.0036.b.flavor: "Mnoho záležitostí dvorské politiky se dá vyřešit, když se muž soustředí na rybu."
 ONIBI_GLOSS: "#bold Onibi#!! neboli „démonický oheň“ jsou formou [Glossary( 'Yokai', 'YOKAI_GLOSS' )], která se projevuje jako zářící koule světla nebo plamene, zrozená z duší mrtvých. Často jsou zlomyslné a svádějí cestovatele do nebezpečných, ne-li smrtelných situací."
 YOKAI_GLOSS: "#bold Yōkai#!! neboli „podivné zjevení“ jsou nadpřirozené bytosti v japonské mytologii — od duchů, démonů a monster až po měňavce a šprýmaře. Často se objevují s rysy zvířat."
 SORIBASHI_GLOSS: "#bold Soribashi#!! neboli „měsíční mosty“, pocházející z Číny, jsou prudce zaklenuté pěší mostky. Používají se jako ozdobné prvky v zahradách nebo k přechodu pěších přes potoky, přičemž lodím umožňují projet pod nimi."
 tgp_japan_yearly_events.1000.t: "Tančící plameny"
 tgp_japan_yearly_events.1000.desc: "Lehký déšť nás provází, když procházíme [ROOT.Char.GetCurrentLocation.Custom('CZ_GetTerrainTypePlural_A')|l] [CZPrepV(ROOT.Char.GetCurrentLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(ROOT.Char.GetCurrentLocation,'L')].\n\nJak mrholení zesiluje, všimnu si tančících světel mihotajících se v dálce.\n\n[Select_CString(chaplain.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMe', chaplain)|l], [chaplain.GetFirstNameNoTooltip], radí opatrnost a naznačuje, že by to mohla být [Glossary( 'Onibi', 'ONIBI_GLOSS' )], které se nás snaží nalákat do nebezpečí."
 tgp_japan_yearly_events.1000.a: "Ať už je to jakkoli nebezpečné, pojďme zjistit, co to za světla!"
 tgp_japan_yearly_events.1000.a.tt.success: "Při pronásledování Onibi jste našli skrytý poklad"
 tgp_japan_yearly_events.1000.a.tt.failure: "Při pronásledování Onibi jste uklouzli na mokrém terénu a zranili se"
 tgp_japan_yearly_events.1000.b: "Schovejme se před deštěm a ty mi o tom řekneš víc"
 tgp_japan_yearly_events.1000.b.tt.success: "[chaplain.GetFirstNameNoTooltip|U] vám poskytne vhled do Onibi, který vám pomůže lépe porozumět dalším výkladům"
 tgp_japan_yearly_events.1000.b.tt.failure: "Nesrovnalosti ve vysvětlení [chaplain.GetFirstNamePossessiveNoTooltip] vám způsobují bolest hlavy"
 tgp_japan_yearly_events.1000.c: "Ano, nejlépe je tu nezůstávat."
 tgp_japan_yearly_events.1010.t: "Sektářské spory"
 tgp_japan_yearly_events.1010.desc: "„Napětí mezi [buddhist_councillor_1.Custom('DescriptorPositiveStandalone')|l] [buddhist_councillor_1.GetFaith.GetAdherentNamePlural] a [buddhist_councillor_2.Custom('DescriptorNegativeStandalone')|l] [buddhist_councillor_2.GetFaith.GetAdherentNamePlural] den ode dne narůstá, [ROOT.Char.Custom('FormOfAddressForLiege')|l]!“\n\n[Select_CString(buddhist_councillor_1.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMeShort', buddhist_councillor_1)|l], [buddhist_councillor_1.GetFirstName], vykřikne.\n\n„[buddhist_councillor_2.Custom('DescriptorNegativeStandalone')|l] [buddhist_councillor_2.GetFaith.GetAdherentNameNoTooltip] mniši se modlí za náš pád. Prosím, pro lásku [ROOT.Char.GetFaith.HighGodName], ukažte, že stojíte po boku [buddhist_councillor_1.Custom('DescriptorPositiveStandalone')|l] [buddhist_councillor_1.GetFaith.GetAdherentNamePluralNoTooltip] a bude jasné, že bychom měli být favorizováni!“"
 tgp_japan_yearly_events.1010.a: "Stanu na straně [buddhist_councillor_1.GetFaith.GetAdjectiveNoTooltip|l] mnichů."
 tgp_japan_yearly_events.1010.b: "Pravdu mají [buddhist_councillor_2.GetFaith.GetAdherentNamePluralNoTooltip]."
 tgp_japan_yearly_events.1010.c: "Proč bych se [Select_CString(ROOT.Char.IsFemale,'měla','měl')|l] starat o to, jakou úctu dostává [ROOT.Char.GetFaith.HighGodName]?"
 faith_conversion_cost_tgp_japan_1010_event: "Z událostí"
 tgp_japan_yearly_events.1010.a_discount: "Získáváte #p 50%#! slevu na konverzi na [buddhist_councillor_1.GetFaith.GetName]"
 tgp_japan_yearly_events.1010.b_discount: "Získáváte #p 50%#! slevu na konverzi na [buddhist_councillor_2.GetFaith.GetName]"
 every_buddhist_sect_1_vassal: "Každý [buddhist_councillor_1.GetFaith.GetName] [Concept('vassal','vazal')|E]"
 every_buddhist_sect_2_vassal: "Každý [buddhist_councillor_2.GetFaith.GetName] [Concept('vassal','vazal')|E]"
 tgp_japan_yearly_events.1010.c.tt: "Boje způsobují nepokoje v celém království"
 tgp_japan_yearly_events.1020.t_siren: "Óniho zpěv"
 tgp_japan_yearly_events.1020.t_garden: "Rozkvetlá hlava"
 tgp_japan_yearly_events.1020.t_shadow: "Hloubka mého stínu"
 tgp_japan_yearly_events.1020.desc_siren: "Nádherná melodie mě vytrhne ze spánku. Žena, bledá a elegantní, se vznáší nade mnou a zpívá o zlomeném srdci.\n\nKdyž po ní natáhnu ruku, její obraz se rozplyne. Když se probudím, tíseň této snové ženy a lásky, která mohla být, mě pronásleduje."
 tgp_japan_yearly_events.1020.a_siren: "Tu lásku, o které zpívá, musím mít!"
 tgp_japan_yearly_events.1020.b_siren: "Taková krása by se měla sdílet, rozšiřte její příběh po celém panství."
 tgp_japan_yearly_events.1020.desc_garden: "Při procházce zahradou si všimnu exotické květiny.\n\nKdyž vdechnu její vůni, obklopí mě vánek, který zní jako měkký šepot; když pohlédnu vzhůru, slunce mi zasvítí přímo do očí. Když se znovu podívám na květinu, spatřím groteskní hlavu, která se na mě mračí. Mrknu znovu a obličej je pryč."
 tgp_japan_yearly_events.1020.a_garden: "Tahle půda musí být zvláštní, pokračujte v její kultivaci."
 tgp_japan_yearly_events.1020.b_garden: "Musím tuto zahradu zastavět, abych ji uzavřel."
 tgp_japan_yearly_events.1020.desc_shadow: "Můj stín je... podivný. Zdá se, že za mnou chvíli zůstává, i poté co začnu chodit. Když se odvrátím, vypadá to, že téměř tančí s jinými stíny, ale když se znovu podívám, vrátí se ke mně.\n\nI když mi zatím neublížil, stín, který může opustit svého pána, se zdá nebezpečný."
 tgp_japan_yearly_events.1020.a_shadow: "Ať se mého stínu bojí jen moji nepřátelé!"
 tgp_japan_yearly_events.1020.b_shadow: "Musím mít pochodně stále zapálené, ať nic neunikne."
 tgp_japan_yearly_events.1020.desc_end: "\n\nJe to stres z toho, že jsem [ROOT.Char.GetTitleAsNameNoTooltip], nebo to může být dílo [Glossary( 'Yokai', 'YOKAI_GLOSS' )]?"
 tgp_japan_yearly_events.1020.c: "Bah! To je [ROOT.Char.GetFaith.TricksterGodName], kdo si ze mě dělá legraci."
 tgp_japan_yearly_events.1030.t: "Úvahy o budoucnosti"
 tgp_japan_yearly_events.1030.desc: "[ROOT.Char.GetFaith.HouseOfWorship|U] je nedaleko. Přitahují mě tiché hlasy věřících, kteří se tam modlí, aby jim [ROOT.Char.GetFaith.HighGodName] dopřál štěstí.\n\nUž dlouho nebyla příležitost k modlitbě a rozjímání. Na co se mám v příštích letech soustředit?"
 tgp_japan_yearly_events.1030.a: "Mé zdraví nade vše."
 tgp_japan_yearly_events.1030.b: "Budoucnost rodu [ROOT.Char.GetDynasty.GetNameNoTooltip] musí být zajištěna."
 tgp_japan_yearly_events.1030.c: "Prosperita naší rodiny je nejdůležitější."
 tgp_japan_yearly_events.1030.d: "Všechno, co potřebuji, mi může dopřát [ROOT.Char.GetFaith.HighGodName]!"
 tgp_japan_yearly_events.1030.e: "Nenechám modlitbu narušit svůj klid."
 tgp_japan_yearly_events.1040.t: "Měsíční most"
 tgp_japan_yearly_events.1040.desc: "Když chci přejít kanál, najdu krásný zaklenutý most ozdobený karmínově. Zastavím v úžasu před jemnou elegancí tohoto [Glossary( 'Soribashi', 'SORIBASHI_GLOSS' )]\n\nNěkdy i tak malý čin, jako přejít potok, může nést záměr."
 tgp_japan_yearly_events.1040.a: "Tento most je posvátný, přejdeme ho opatrně."
 tgp_japan_yearly_events.1040.b: "Jako [ROOT.Char.GetTitleAsNameNoTooltip] nikdo nepřejde přede mnou."
 tgp_japan_yearly_events.1040.c: "Neodvážil bych se po něm chodit, co když se zřítí?"
 faith_conversion_cost_tgp_japan_1040_event: "Za přechod červeného mostu"
 tgp_japan_yearly_events.1040.discount: "Získáte #p 50%#! slevu na konverzi na [GetReligionByKey('shintoism_religion').GetName]"
 tgp_japan_yearly_events.1050.opening: "[messenger.Custom2('AppropriateGreeting', ROOT.Char)|U]"
 tgp_japan_yearly_events.1050.desc: "Lituji, že vám musím oznámit, že porušujete zásadní pravidlo:"
 tgp_japan_yearly_events.1050.desc.a: "#EMP Vaše zahrada obsahuje příliš mnoho žlutých květů.#!!"
 tgp_japan_yearly_events.1050.desc.b: "#EMP Zbraně v kasárnách se brousí příliš zřídka.#!!"
 tgp_japan_yearly_events.1050.desc.c: "#EMP Stále držíte svůj [Glossary( 'Sensu', 'SENSU_GLOSS' )] nesprávně.#!!"
 tgp_japan_yearly_events.1050.desc.outro: "\n\nZa toto porušení jste nuceni učinit značný dar do pokladny vašeho [ROOT.Char.Custom2('RelationToMeShort', ROOT.Char.GetLiege)|l], [ROOT.Char.GetLiege.GetTitledFirstNamePossessive]."
 tgp_japan_yearly_events.1050.a: "Jak si [Select_CString(ROOT.Char.GetLiege.IsFemale,'ona','on')|l] přeje."
 tgp_japan_yearly_events.1050.b: "To pravidlo už není v platnosti."
 tgp_japan_yearly_events.1050.b.tt: "Snažíte se přesvědčit [messenger.GetFirstNameNoTooltip], že toto nesrozumitelné nařízení není již platné"
 tgp_japan_yearly_events.1050.c: "[Select_CString(ROOT.Char.GetLiege.IsFemale,'ona','on')|U] nebude mít nárok na [Select_CString(ROOT.Char.GetLiege.IsFemale,'její','jeho')|l]!"
 tgp_japan_yearly_events.1050.tt.success: "Pokuta je zrušena"
 tgp_japan_yearly_events.1050.tt.failure: "[Select_CString(messenger.IsFemale,'ona','on')|U] vám rozkáže zaplatit"
 tgp_japan_yearly_events.1060.t: "Milosrdenstvím nebo spravedlností"
 tgp_japan_yearly_events.1060.desc: "Zjevně zanedbaný a nespokojený, [prisoner.Custom2('InsultAdjective', ROOT.Char)|l] [prisoner.GetFirstName] otravuje stráže, aby získal pozornost a prosí je, aby vyslechli [Select_CString(child.IsFemale,'její','jeho')|l] prosbu. Ze zvědavosti se setkám s [Select_CString(prisoner.IsFemale,'ní','ním')|l] v [Select_CString(prisoner.IsFemale,'její','jeho')|l] [prisoner.Custom('PrisonTypeCell')|l], čekajíc, co [Select_CString(prisoner.IsFemale,'ona','on')|l] tak zoufale chce říct.\n\n[Select_CString(prisoner.IsFemale,'ona','on')|U] se na mě dívá a křičí,"
 tgp_japan_yearly_events.1060.desc_old: "„Mé kosti jsou křehké a ztuhlé, můj čas na tomto světě byl dostatečný."
 tgp_japan_yearly_events.1060.desc_young: "„Ve svém životě jsem toho moc neviděl, ale nemohu se spokojit se vzpomínkami na tuto věznici."
 tgp_japan_yearly_events.1060.desc_long: "„Byl jsem držen příliš dlouho a dospěl jsem k závěru, že se nechci vrátit."
 tgp_japan_yearly_events.1060.desc_injured: "„Mé zdraví se horší a strupy, které odlupuji, se již nezahojí. Bolest sílí a nevidím její konec."
 tgp_japan_yearly_events.1060.desc_generic: "„Už si nepřeji žít v hranicích této cely."
 tgp_japan_yearly_events.1060.desc_outro: "Pokud máte milosrdenství v srdci, ukončete můj život rychle!„"
 tgp_japan_yearly_events.1060.a: "Dobře, splním tvé přání."
 tgp_japan_yearly_events.1060.b: "Možná mohu zlepšit tvé podmínky ve vězení."
 tgp_japan_yearly_events.1060.c: "Tvému utrpení nebude uděleno milosrdenství!"
 tgp_japan_yearly_events.1060.d: "Ne, tvé podmínky se nezmění."
 tgp_japan_yearly_events.1070.t: "Svatý popel"
 tgp_japan_yearly_events.1070.desc: "„Na pozemcích [province.GetName] [ROOT.Char.Custom('GetFaithTemple')|l] vyhořela budova do základů!“ vykřikne [Select_CString(messenger.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMeShort', messenger)|U] [messenger.GetName].\n\n„Mniši a učenci se snaží najít nové místo pro svou práci,“ pokračuje [messenger.GetNameNoTooltip]. „Kdybyste pomohli obnovit [ROOT.Char.Custom('GetFaithTemple')|l], jistě vás [ROOT.Char.GetFaith.HighGodName] požehná.“"
 tgp_japan_yearly_events.1070.a: "Postavme to znovu lépe než dřív."
 tgp_japan_yearly_events.1070.b: "Možná [ROOT.Char.GetFaith.HighGodName] uvolňuje místo pro něco nového."
 tgp_japan_yearly_events.1070.c: "Musím zjistit, jak se tento [ROOT.Char.Custom('GetFaithTemple')|l] vznítil..."
 tgp_japan_yearly_events.1070.c_tt: "Začínáte vyšetřování příčiny požáru"
 tgp_japan_yearly_events.1071.desc: "[ROOT.Char.Custom2('RelationToMeShort', messenger)|U] přináší zprávu o nedávném vypálení [ROOT.Char.Custom('GetFaithTemple')|l], ujišťujíc mě, že [Select_CString(messenger.IsFemale,'její','jeho')|l] vyšetřovací snahy byly úspěšné.\n\n"
 tgp_japan_yearly_events.1071.desc_yokai: "„Mnozí v okolí hlásili dny před požárem pozorování zvláštního [Glossary( 'Yokai', 'YOKAI_GLOSS' )]. Možná je to viník této tragédie?“ vykřikuje [Select_CString(messenger.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMeShort', messenger)|l] [messenger.GetFirstName]."
 tgp_japan_yearly_events.1071.desc_heretics: "„Místní vesničané naznačili, že za to může být skupina odpůrců. Musíme těmto heretikům poslat vzkaz!“ trvá na tom [Select_CString(messenger.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMeShort', messenger)|U] [messenger.GetFirstName]."
 tgp_japan_yearly_events.1071.desc_rival: "„[rival.GetName] se zdál obcházet město před incidentem, snažící se způsobit chaos během vaší vlády. [Select_CString(rival.IsFemale,'ona','on')|U] nesmí uniknout bez trestu!“ trvá na tom [Select_CString(messenger.IsFemale,'má','můj')|l] [ROOT.Char.Custom2('RelationToMeShort', messenger)|U] [messenger.GetFirstName]."
 tgp_japan_yearly_events.1071.desc_weather: "„Požár byl výsledkem přírodní události. Vzduch byl tak suchý a slunce pálilo, není divu, že oheň propukl. Bylo by nejlepší posílit naše přístřeší proti živlům.“ poznamenává [messenger.GetFirstName]."
 tgp_japan_yearly_events.1071.a: "To se nebude opakovat!"
 tgp_japan_yearly_events.1071.b: "No, to už je minulost..."
 1071_rival_tt: "Po dobu #V 2#!! let budou mít všechny nepřátelské [Concept('scheme','intrika')|E], které zahájíte proti [rival.GetNameNoTooltip], zvýšenou [Concept('success_chance','šancím na úspěch')|E]"
 scheme.target.japan_1071.value_desc: "Pomsta vůči [target.GetFirstName]: $VALUE|+=0$"
 SENSU_GLOSS: "#bold Sensu#!! je skládací ruční vějíř, běžně používaný v létě."
 TSURIDONO_GLOSS: "#bold Tsuridono#!! — znamená „rybářský pavilon“ a je to stavba postavená nad jezírkem, sloužící k pozorování zahrady a pořádání drobných představení."
 tgp_japan_yearly_events.1080.t: "Potulný rybář"
 tgp_japan_yearly_events.1080.desc: "Moje [Glossary( 'Tsuridono', 'TSURIDONO_GLOSS' )] je místo k odpočinku a rozjímání, a idylický výhled poskytuje dokonalý závěr večerní procházky. Vody, které ji obklopují, jsou obvykle klidné, přerušované jen občasným kaprem chňapajícím po hmyzu na hladině. Dnes je však poklidná atmosféra narušena divokým šplouchnutím!\n\n[Select_CString(fisherman.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMeShort', fisherman)|l] [fisherman.GetName] stojí na břehu, prut má vhozený do kdysi klidného jezírka. Odhodlá se [Select_CString(fisherman.IsFemale,'ona','on')|l] hledat své další jídlo v mém rybníce?!"
 tgp_japan_yearly_events.1080.a: "Velkoryse přehlédnu toto porušení pravidel chování."
 tgp_japan_yearly_events.1080.b: "Co jiného [Select_CString(fisherman.IsFemale,'viděla','viděl')|l] v mé zahradě?"
 tgp_japan_yearly_events.1080.b.tt: "Vyslýcháte [fisherman.GetNameNoTooltip] kvůli informacím o dvoře"
 tgp_japan_yearly_events.1080.tt.success: "[Select_CString(fisherman.IsFemale,'ona','on')|U] poskytuje cenné informace"
 tgp_japan_yearly_events.1080.tt.failure: "[Select_CString(fisherman.IsFemale,'ona','on')|U] toho moc neřekne"
 tgp_japan_yearly_events.1080.tt_secret: "[Select_CString(fisherman.IsFemale,'ona','on')|U] odhalí náhodný [Concept('secret','tajemství')|E] jednoho z vašich [Concept('courtiers','dvořanů')|E]"
 tgp_japan_yearly_events.1080.tt_family: "Každý [Concept('courtier','dvořan')|E], který je členem rodiny:\n$BULLET$Získá [GetModifier('tgp_scheme_wary_modifier').GetNameWithTooltip] na #V 3 roky#!!"
 tgp_japan_yearly_events.1080.c: "Nemůže [Select_CString(fisherman.IsFemale,'ona','on')|l] dělat toto jinde?!"
 tgp_japan_yearly_events.1090.t: "Bezdětné dědictví"
 tgp_japan_yearly_events.1090.desc_intro_dead: "Žiju déle než všichni moji potomci; všichni nyní odpočívají v zemi."
 tgp_japan_yearly_events.1090.desc_intro_none: "I přes dlouhý život se mi nepodařilo přivést na svět žádné děti."
 tgp_japan_yearly_events.1090.desc_intro: "„[ROOT.Char.Custom('FormOfAddressForLiege')|l], nebudeš tu navždy, abys vládl,“ křičí [informer.GetTitledFirstName]. „Byla by škoda vidět tvé dědictví zapadnout v zapomnění! Někdo musí převzít [target_title.GetName] místo tebe.“\n\n"
 tgp_japan_yearly_events.1090.desc: "Mé [ROOT.Char.GetAge] roky uplynuly jako život jepice. Vlasy mi šedivějí a kosti vržou. Děti, které jsem [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')|l] u matčina prsu, jsou nyní plně dospělé a našly svůj účel. Než mě zastihne konec, snad mohu vyhovět [informer.GetNamePossessiveNoTooltip] prosbě?"
 tgp_japan_yearly_events.1090.a: "Zdvojnásobím své úsilí."
 tgp_japan_yearly_events.1090.a_tt: "Získáte novou [Concept('concubine','konkubínu')|E]"
 tgp_japan_yearly_events.1090.b: "Mým dědicem bude ten, koho si zvolím!"
 tgp_japan_yearly_events.1090.b_tt: "Do smrti získáte přístup k #V $adopt_interaction$#! [Concept('interaction','interakce')|EU]"
 tgp_japan_yearly_events.1090.c_uncaring: "Proč by mě zajímalo, co se stane, až tu nebudu?"
 tgp_japan_yearly_events.1090.c: "Budu vládnout tak dlouho, jak budu moci."
 tgp_japan_yearly_events.1100.t: "Horečka tíhy viny"
 tgp_japan_yearly_events.1100.desc: "Od smrti [victim.Custom('CZ_Name_G')] se trápím čím dál víc a žádná léčba nepřináší úlevu. V každém zrcadle vidím přízračnou tvář. Poslední okamžiky [victim.Custom('CZ_Name_G')] se mi znovu a znovu přehrávají v hlavě. S každým opakováním je ten hrozný čin odpornější."
 tgp_japan_yearly_events.1100.desc_2: "\n\nV noci ke mně navíc doléhá hlas [victim_2.Custom('CZ_Name_G')], který mě budí z nejhlubšího spánku. [Select_CString(victim_2.IsFemale,'ona','on')|U] snad spočívá v pokoji. Mně se takového klidu už dlouho nedostává."
 tgp_japan_yearly_events.1100.desc_3: "Jméno [victim_3.GetName] mi projede páteří jako rána. Trýzní mě stejně jako ostatní, kteří padli na můj rozkaz."
 tgp_japan_yearly_events.1100.desc_outro: "\n\nVězení jsem si [Select_CString(ROOT.Char.IsFemale,'vystavěla','vystavěl')|l] [Select_CString(ROOT.Char.IsFemale,'sama','sám')|l]. Tím, že beru život druhým, jsem [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')|l] o vlastní klid."
 tgp_japan_yearly_events.1100.a_tt: "Odhalíte všechna svá vražedná [Concept('secrets','tajemství')|E]"
 tgp_japan_yearly_events.1100.a: "To je znamení, musím se vykoupit!"
 tgp_japan_yearly_events.1100.b: "Mé viny zůstanou pohřbeny ve mně."
 tgp_japan_yearly_events.1100.b_tt: "#warning Nelze zahájit vražedný [Concept('scheme','intrika')|E] po dobu #V 5#!! let #!"
 guilt_fever_tt: "Trpíte horečkou viny"
 tgp_japan_yearly_events.1110.t: "[ROOT.Char.GetFaith.FateGodNamePossessive|U] Jelen"
 tgp_japan_yearly_events.1110.desc: "Do svatyně, kterou chrání [ROOT.Char.GetFaith.FateGodName], přicházejí návštěvníci ze všech společenských vrstev. Ani dnešek není výjimkou. Poklidně se tu prochází i nádherný jelen.\n\nTo zvíře si mě však zřejmě vyhlédlo. Upřeně na mě hledí a ani nemrkne. Říká se, že zvířata bývají prostředníky božské vůle. Možná mi právě skrze tohoto jelena posílá zprávu [ROOT.Char.GetFaith.FateGodName]."
 tgp_japan_yearly_events.1110.a: "[ROOT.Char.GetFaith.FateGodSheHe|U] si přeje mé rozjímání."
 tgp_japan_yearly_events.1110.b: "Znamení dobrého štěstí!"
 tgp_japan_yearly_events.1110.b.tt: "Jelen vás dovede k pokladu"
 tgp_japan_yearly_events.1110.c: "Vypadalo by to skvěle v mých síních."
 tgp_japan_yearly_events.1110.c.tt: "Pokoušíte se zasáhnout jelena tam, kde stojí"
 tgp_japan_yearly_events.1110.tt.success: "Jelen padne pod vaší silou"
 tgp_japan_yearly_events.1110.tt.failure: "Jelen uteče"
 tgp_reflection_modifier_desc_tt: "[GetModifier('tgp_reflection_modifier').GetNameWithTooltip|U]"
 tgp_japan_yearly_events.1120.t: "Poslední výzva"
 tgp_japan_yearly_events.1120.desc_intro: "Osamělá postava s vytaseným [warrior_monk.Custom('GetRegionalSword')|l] blokuje náš postup."
 tgp_japan_yearly_events.1120.desc_intro_river: "Když přecházíme most, osamělá postava s vytaseným [warrior_monk.Custom('GetRegionalSword')|l] blokuje náš postup."
 tgp_japan_yearly_events.1120.desc: "\n\n„Po této cestě mohou kráčet jen praví válečníci. Celé věky mě vede [warrior_monk.GetFaith.WarGodName]. Dosud se však nenašel soupeř hodný mé čepele.“\n\nJakmile si všimne mého titulu [ROOT.Char.GetTitleAsName], oči se přimhouří a tvář rozzáří úsměv. „Poraz mě v boji a budu tě následovat, dokud mi hlava nespadne z ramen nebo mi červi neohlodají kosti.“"
 tgp_japan_yearly_events.1120.a: "Přijímám tvou výzvu!"
 tgp_japan_yearly_events.1120.a_warrior: "Překonat tě bude mým potěšením. Připrav se!"
 tgp_japan_yearly_events.1120.b: "Dvůr je mé bitevní pole. Moje chytrost, má čepel."
 tgp_japan_yearly_events.1120.b.tt: "Snažíte se přesvědčit mnicha, aby vás následoval, aniž by došlo k fyzickému souboji"
 tgp_japan_yearly_events.1120.tt.success: "Válečný mnich se připojí k vašim řadám"
 tgp_japan_yearly_events.1120.tt.failure: "Nepodaří se vám mnicha přesvědčit"
 tgp_japan_yearly_events.1120.c: "Stráže, odstraňte [Select_CString(warrior_monk.IsFemale,'ji','jej')|l] z mé cesty!"
 tgp_japan_yearly_events.1120.c_tt: "Vaše stráže bojují s mnichem, což vaší skupině umožní projít bez prodlení."
 tgp_japan_yearly_events.1120.d: "Zvolme malebnější trasu."
 SHOJI_GLOSS: "Dělící stěna s mřížkovým rámem, obvykle tvořená průsvitnými plochami, které propouštějí světlo a stíny."
 tgp_japan_yearly_events.1130.t: "[poet_daughter.GetFirstNamePossessiveNoTooltip|U] verše"
 tgp_japan_yearly_events.1130.desc: "Každou noc [Select_CString(poet_daughter.IsFemale,'moje','můj')|l] [ROOT.Char.Custom2('RelationToMeShort', poet_daughter)|l], [poet_daughter.GetName] usedá k pohledu na měsíc. Inkoustové skvrny kazí [Select_CString(poet_daughter.IsFemale,'její','jeho')|l] jemné ruce, přesto o [Select_CString(poet_daughter.IsFemale,'její','jeho')|l] psaní dopisů neslyším nic. Tyto výstřednosti bych snesl, ale [Select_CString(poet_daughter.IsFemale,'ona','on')|l] nyní zanedbává své zdraví a to se může zle odrazit na mně.\n\nKdyž ji následuji do jejích komnat, nahlédnu skrz [Glossary( 'shoji screen', 'SHOJI_GLOSS' )] příčinu jejího podivného chování.\n\n„[poet_daughter.Custom2('RelationToMeShort', ROOT.Char)|U]! Zdá se, že mi nelze skrýt mé dílo před vámi,“ říká a podává mi [ROOT.Char.Custom('GetWritingMaterial')|l] plné veršů."
 tgp_japan_yearly_events.1130.a: "„Tvé slova jsou nádherná, [poet_daughter.GetFirstNameNoTooltip].“"
 tgp_japan_yearly_events.1130.a.tt: "Povzbudíte ji, aby se stala básnířkou"
 tgp_japan_yearly_events.1130.poet_critical: "Stane se zdravou básnířkou"
 tgp_japan_yearly_events.1130.poet: "Stane se básnířkou"
 tgp_japan_yearly_events.1130.nice_try: "Udělá pokrok ve svém psaní"
 tgp_japan_yearly_events.1130.b: "To je hloupost! Chovej se jako [ROOT.Char.Custom2('RelationToMeShort', poet_daughter)|l] [ROOT.Char.GetTitleAsNameNoTooltip]!"
 tgp_learning_poetry_modifier: "Učení poezie"
 tgp_learning_poetry_modifier_desc: "Tato postava procvičuje své verše"
 tgp_japan_yearly_events.1140.t: "Zastaveni na klanové cestě"
 tgp_japan_yearly_events.1140.desc: "Při přechodu do zemí [local_county.GetNameNoTier] náš postup zastaví skupina ozbrojených mužů.\n\n„Ve jménu [local_ruler.GetName] musím vybrat malý poplatek,“ říká [Select_CString(toll_warrior.IsFemale,'ona','on')|l]. Vnímajíc mé zmatení dodává: „Toto už nejsou císařské cesty. Zde platí pouze vůle [local_ruler.GetTitleAsName].“"
 tgp_japan_yearly_events.1140.a: "Nechte [Select_CString(toll_warrior.IsFemale,'ji','jej')|l] si vzít poplatek, ale budu si to pamatovat."
 tgp_japan_yearly_events.1140.b: "Víš, kdo jsem?!"
 tgp_japan_yearly_events.1140.b.tt: "Snažíte se apelovat na úctu, kterou má [toll_warrior.GetNamePossessiveNoTooltip] k postavení"
 tgp_japan_yearly_events.1140.tt.success: "Přesvědčíte válečníky"
 tgp_japan_yearly_events.1140.tt.failure: "Jste nuceni najít jinou trasu"
 tgp_japan_yearly_events.1140.c: "Nezaplatím ani jedinou minci vašemu '[local_ruler.GetTitleAsNameNoTooltip]'!"
 tgp_japan_yearly_events.1150.t: "Zpozorování panovníka"
 tgp_japan_yearly_events.1150.desc: "Dvořané mi oznamují, že mými zeměmi cestuje [emperor.GetTitleAsNameNoTooltip], [emperor.GetFirstName].\n\n„[emperor.GetTitleAsNameNoTooltip|U] v [CZProvNameNoTooltip(emperor_location,'L')]? Jaké štěstí! Je vzácné mít možnost oslovit [emperor.Custom('FormOfAddressForLiege')|l] takto osobně.“\n\nTo je ideální příležitost poslat [Select_CString(emperor.IsFemale,'jí','mu')|l] zprávu..."
 tgp_japan_yearly_events.1150.a: "Je na místě skromný dar."
 tgp_japan_yearly_events.1150.b: "Projevit [emperor.GetTitleAsNameNoTooltip] pohostinnost rodu [local_ruler.GetHouse.GetNameNoTooltip]."
 tgp_japan_yearly_events.1150.b.flavor: "Sdílení rýže a bohaté pití jistě přispěje k dobrému postavení vašeho rodu."
 tgp_japan_yearly_events.1150.c: "Věnuji [Select_CString(emperor.IsFemale,'jí','mu')|l] verš!"
 tgp_japan_yearly_events.1150.c_tt: "Napsáním básně zvýšíte [Select_CString(emperor.IsFemale,'její','jeho')|l] názor na vás, v závislosti na vašem [learning_i][Concept('learning_skill','učenosti')|E]."
 tgp_japan_yearly_events.1150.d: "[emperor.GetTitleAsNameNoTooltip|U] by měl sdílet [Select_CString(emperor.IsFemale,'její','jeho')|l] bohatství..."
 tgp_japan_yearly_events.1150.d.flavor: "Pošlete válečníky, aby získali zlato"
 tgp_japan_yearly_events.1150.f: "[Select_CString(emperor.IsFemale,'Její','Jeho')|U] blízkost mi připomíná, jak moc [Select_CString(emperor.IsFemale,'ji','jej')|l] nenávidím!"
 tgp_japan_yearly_events.1150.f.flavor: "Sesazení pavouka potrvá, nejprve musíte všem odhalit jeho nechutné způsoby"
 tgp_japan_yearly_events.1150.f.tt: "$tgp_japan_yearly_events.1200.b.tt$"
 tgp_japan_yearly_events.1151.t: "Zpráva od [local_ruler.GetTitleAsNameNoTooltip]"
 tgp_japan_yearly_events.1151.desc: "Když vcházíme do [CZProvName(emperor_location,'G')], přistoupí k nám dvořan [local_ruler.GetTitleAsNameNoTooltip], [local_ruler.GetFirstName].\n\n"
 tgp_japan_yearly_events.1151.desc_bandits: "„[local_ruler.GetTitledFirstNameNoTooltip] požaduje tribut za průchod [Select_CString(local_ruler.IsFemale,'jejích','jeho')|l] zemí. Nemělo by být potřeba sahat k násilí.“\n\nTón [messenger.GetNamePossessive] je rozumný, přesto skupina ozbrojených válečníků doprovázejících [Select_CString(messenger.IsFemale,'ji','jej')|l] naznačuje opak."
 tgp_japan_yearly_events.1151.desc_hospitality: "„[local_ruler.GetTitledFirstNameNoTooltip] vás vítá [CZPrepV(local_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip)] [local_ruler.GetPrimaryTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')].“ říká [messenger.GetName], hluboce se ukláněje. „Bylo by to [Select_CString(local_ruler.IsFemale,'její','jeho')|l] ctí, kdybyste se zastavili a užili si naši pohostinnost.“"
 tgp_japan_yearly_events.1151.desc_poem: "„Některé verše od [local_ruler.GetNameNoTooltip].“ říká [messenger.GetName], podávaje mi pozlacené [emperor.Custom('GetWritingMaterial')|l] plné znaků. „Doufám, že se vám dílo [Select_CString(local_ruler.IsFemale,'její','jeho')|l] bude líbit.“"
 tgp_japan_yearly_events.1151.desc_gift: "„Dar, laskavostí [local_ruler.GetNameNoTooltip].“ říká [messenger.GetName], podávaje vak se zlatem. „Přejeme vše nejlepší na vašich cestách, [emperor.GetTitleAsNameNoTooltip].“"
 tgp_japan_yearly_events.1151.a: "Poctíte mě, [local_ruler.GetNameNoTooltip]!"
 tgp_japan_yearly_events.1151.b: "Obdivuhodný pokus, řekl bych..."
 tgp_japan_yearly_events.1151.c: "Nenechám se zastrašit!"
 tgp_japan_yearly_events.1151.c_bandits: "Stráže, odežeňte je!"
 tgp_japan_yearly_events.1151.d: "Tak tedy se budeme muset obejít."
 tgp_japan_yearly_events.1151.d_bandits: "Dejme jim trochu zlata. Není to za tu bitvu."
 japan_yearly_1151_bandits: "Snažíte se odrazit bandity [local_ruler.GetNamePossessiveNoTooltip]"
 japan_yearly_1151_bandits_win: "Bandité si opatří slušnou truhlu zlata"
 japan_yearly_1151_bandits_lose: "Bandité selžou a vracejí se s prázdnýma rukama"
 japan_yearly_1151_success: "Váš plán vyšel"
 japan_yearly_1151_fails: "Váš plán selže"
 tgp_japan_yearly_events.1151.tt_good.success: "Panovník ocení váš projev"
 tgp_japan_yearly_events.1151.tt_good.failure: "Váš projev panovníka neohromí"
 friend_nice_gesture: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'poslala','poslal')|l] přátelský pozdrav [CHARACTER.GetShortUINameNoTooltip] během svých cest."
 friend_nice_gesture_corresponding: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'poslala','poslal')|l] přátelský pozdrav [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltip] během svých cest."
 tgp_japan_yearly_events.1160.t: "Dar [feuding_house.GetNameNoTooltip]"
 tgp_japan_yearly_events.cannibal.1160.t: "Nabídka masa [feuding_house.GetNameNoTooltip]"
 tgp_japan_yearly_events.1160.desc: "Hořká nenávist mezi mým velkým rodem [ROOT.Char.GetHouse.GetName] a bezcenným [feuding_house.GetName] je známá všem. Dosud se prasata neobtěžovala nabízet mír!\n\nO to víc jsem zvědavý, když mi předkládají půvabnou mladou [Select_CString(new_concubine.IsFemale,'žena','muž')|l], [new_concubine.GetName], jako dar. Ačkoliv mě okouzluje, jak [new_concubine.Custom('ComplimentAdjective')|l] [Select_CString(new_concubine.IsFemale,'ona','on')|l] je, nemohu se zbavit podezření, že je to další lest [feuding_house.GetNameNoTooltip]."
 tgp_japan_yearly_events.1160.a: "...Ale [Select_CString(new_concubine.IsFemale,'ona','on')|l] je příliš svůdná nabídka, než abych ji neprozkoumal."
 tgp_japan_yearly_events.1160.b: "To je vtip? Pošlete [Select_CString(new_concubine.IsFemale,'ji','jej')|l] zpět."
 tgp_japan_yearly_events.1160.c: "Jak jim mohu věřit? Zabijte [Select_CString(new_concubine.IsFemale,'ji','jej')|l]!"
 tgp_japan_yearly_events.1160.d: "[Select_CString(new_concubine.IsFemale,'ona','on')|U] udělá vynikající pokrm."
 tgp_japan_yearly_events.1200.t: "Dopravní zácpa v hlavním městě"
 tgp_japan_yearly_events.1200.desc: "Bylo to dlouhé dopoledne schůzek v [kampaku.GetCurrentLocation.GetBaronyNameExplicitly], práce [kampaku.GetTitleAsName] nikdy nekončí! Má družina vyráží k [GetBuilding('heian_palace_01').GetName], aby se zúčastnila ceremonie, na které bude přítomen [emperor.GetTitleAsName].\n\nPro mnohé je ruch a hemžení hlavního města těžké projet, ale jako [kampaku.GetTitleAsNameNoTooltip] se lidé rozestoupí jako sardinky v přítomnosti žraloka.\n\nNajednou je postup mé družiny zastaven. Moji doprovodní mě upozorňují, že vzpěrač [upstart.GetName] nás předběhl na cestě a odmítá posunout [Select_CString(upstart.IsFemale,'její','jeho')|l] koně, aby nám umožnil projet. Tvrdohlavé prase!"
 tgp_japan_yearly_events.1200.a: "Strhněte ho z koně!"
 tgp_japan_yearly_events.1200.b: "Nechte ho si myslet, že s tím projde."
 tgp_japan_yearly_events.1200.b.tt: "Vaše [GetScheme('slander').GetTypeName] [Concept('scheme','intrika')|E] získá [GetModifier('bided_my_time').GetNameWithTooltip]"
 tgp_japan_yearly_events.1200.c: "Největším vítězstvím je přátelství."
 tgp_japan_yearly_events.1200.c.tt: "Vaše [GetScheme('befriend').GetTypeName] [Concept('scheme','intrika')|E] získá [GetModifier('settled_differences_modifier').GetNameWithTooltip]"
 tgp_japan_yearly_events.1210.t: "Hoden vést?"
 tgp_japan_yearly_events.1210.desc.intro: "Můj vzestup k postu hlavy rodu [ROOT.Char.GetHouse.GetName] byl pošpiněn. [Select_CString(contester.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMeShort', contester)|l], ten pavouk, [contester.GetName], spřádá pavučinu hedvábných lží a jedovatě naplňuje uši všech, kdo naslouchají.\n\n„[ROOT.Char.GetTitledFirstName] není hoden vést rod [ROOT.Char.GetHouse.GetNameNoTooltip]!“\n\n[Select_CString(contester.IsFemale,'ona','on')|U] tvrdí nade vše,"
 tgp_japan_yearly_events.1210.desc.reason_weak_prowess: "má slabá udatnost"
 tgp_japan_yearly_events.1210.desc.reason_bad_health: "mé slábnoucí zdraví"
 tgp_japan_yearly_events.1210.desc.reason_drunkard: "mé nekonečné pití"
 tgp_japan_yearly_events.1210.desc.bad_genetic: "ubohé vady mého původu"
 tgp_japan_yearly_events.1210.desc.sinful: "mé hříšné chování"
 tgp_japan_yearly_events.1210.desc.low_legitimacy: "má sporná legitimita"
 tgp_japan_yearly_events.1210.desc.older_sibling: "existence mého staršího sourozence"
 tgp_japan_yearly_events.1210.desc.illegitimized: "mé prohlášení za nelegitimního"
 tgp_japan_yearly_events.1210.desc.concubine_child: "můj status dítěte konkubíny"
 tgp_japan_yearly_events.1210.desc.reason_non_dominant_gender: "mé méně než ideální pohlaví"
 tgp_japan_yearly_events.1210.desc.reason_fallback: "[Select_CString(contester.IsFemale,'její','jeho')|U] první sen nového roku byl neblahý a"
 tgp_japan_yearly_events.1210.desc.outro: "mě mají připravit o vedení rodu a uvolnit mé místo někomu jinému. Pokud nechám tuhle rakovinu bujet, zničí celé tělo. Pro dobro rodu [ROOT.Char.GetHouse.GetNameNoTooltip] musím jednat."
 tgp_japan_yearly_events.1210.a: "„Znát své místo, anebo odejdi!“"
 tgp_japan_yearly_events.1210.b: "Dospělá rostlina rýže sklání hlavu."
 tgp_japan_yearly_events.1210.b.flavor: "Trvalé vedení je postaveno na kompromisu. Dovolíte [contester.GetName] založit nový [Concept('house','rod')|E]"
 tgp_japan_yearly_events.1210.b.tt: "[contester.GetName|U] založí nový [Concept('house','rod')|E]. Bude na vás i vaši rod vzpomínat v dobrém."
 house_relation_friendly_reason_cadet_branch_permission_desc: "Tam, kde může spadnout rýže, lze strom s mnoha větvemi podpořit, aby nespadl."
 tgp_japan_yearly_events.1210.c: "Změním [Select_CString(contester.IsFemale,'její','jeho')|l] pohled na věc."
 tgp_japan_yearly_events.1210.c.good: "Nejjednodušší rána k zahojení je ta, která nikdy nebyla."
 tgp_japan_yearly_events.1210.c.good.tt: "$custom.every_house_member$"
 tgp_japan_yearly_events.1210.c.bad: "Musel jsem namazat kola..."
 tgp_japan_yearly_events.1210.c.ugly: "Zdá se, že jsem si udělal nepřítele"
 tgp_japan_yearly_events.1210.d: "Proč uznávat smyšlenou křivdu?"
 tgp_japan_yearly_events.1210.d.flavor: "Ignorovat [Select_CString(contester.IsFemale,'ji','jej')|l]"
 tgp_japan_yearly_events.1210.d.tt: "[contester.GetName|U] založí nový [Concept('house','rod')|E]. Budou na vás a vaši rod pohlížet špatně."
 house_relation_quarrel_reason_cadet_branch_permission_desc: "Ignorovali jste obavy [contester.GetTitledFirstNamePossessive]"
 tgp_japan_yearly_events.1225.t: "Básnický život"
 tgp_japan_yearly_events.1225.desc.intro.influencer: "[Select_CString(SCOPE.sC('poet_influencer').IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('poet_influencer'))|l] má dnes ráno jiskru v oku. Vždy dbalý o mé zdokonalování, [Select_CString(poet_influencer.IsFemale,'ona','on')|l] zahajuje vášnivou recitaci.\n\n"
 tgp_japan_yearly_events.1225.desc.intro: "Při pročítání textů pro své zlepšení narazím na pasáž, která mě zaujme."
 tgp_japan_yearly_events.1225.desc: "#EMP „Semeno poezie [ROOT.Char.GetTopLiege.GetCulture.GetNameNoTooltip] leží v srdcích všech. Pokud je opečováváno, rozroste se v listy desítek tisíc slov.\n\nTato slova mohou vzít malé věci, které vidíme a slyšíme, a dát jim moc pohnout nebem i zemí, vzbudit city neviditelných bohů a duchů, zjemnit vztahy mužů a žen a utišit srdce divokých válečníků!„#!\n\n„Být básníkem znamená žít a žitím se můžeš stát lepším básníkem.“"
 tgp_japan_yearly_events.1225.a: "Tak tedy začnu žít!"
 tgp_japan_yearly_events.1225.a.flavor: "Časem budu básníkem nejen jménem"
 tgp_japan_yearly_events.1225.b: "Dnes budu studovat poezii, ale hledám méně lehkovážný život."
 tgp_japan_yearly_events.1260.t: "$tgp_japan_yearly_events.1225.t$: Láska a smrt"
 tgp_japan_yearly_events.1260.desc: "Ráno přichází sladkým znějícím vzduchem, zatímco ptáci kmitají kolem v hledání partnera.\n\n„Brzy budou mrtví, a přesto žijí naplno, skládají slova lásky po celé ráno.“\n\nDále pozoruji, jak hmyz je trhán ze vzduchu, rozčtvrcen a sežrán nenasytnými křídlovými milenci.\n\nJako básník je mým posláním a povinností destilovat všechnu krásu i hrůzu do několika vybraných slov, nad kterými budou ostatní rozjímat. Veškerá poezie mluví o lásce nebo smrti. Smrt je všude kolem nás, ale lásku — lásku musíme hledat."
 tgp_japan_yearly_events.1260.a: "Je mou povinností usilovat o milostné románky!"
 tgp_japan_yearly_events.1260.a.flavor: "Jak jinak mohu doufat v pokrok svého řemesla?"
 tgp_japan_yearly_events.1260.b: "Romance není pro mě, obávám se, že totéž platí i o poezii."
 tgp_japan_yearly_events.1261.t: "$tgp_japan_yearly_events.1225.t$: Císařská nesmrtelnost"
 tgp_japan_yearly_events.1261.desc: "Mé básnické výkony upoutaly pozornost [Select_CString(SCOPE.sC('top_cuckold').IsFemale,'mé','mého')|l] [inspired_poet.Custom2('CZ_RelationToMeShort_G', SCOPE.sC('top_cuckold'))|l] [top_cuckold.GetTitledFirstNamePossessive] [top_cuckold.Custom2('RelationToMeShort', SCOPE.sC('top_liege_spouse'))|l], [top_liege_spouse.GetTitledFirstName]:\n\n„Tvoje slova již zajistila nesmrtelnost v myslích všech [inspired_poet.GetTopLiege.GetCulture.GetNameNoTooltip] lidí, ale co kdybys mohl zajistit nesmrtelnost i těla?“\n\nSlova chvály [Select_CString(top_liege_spouse.IsFemale,'Jejím','Jeho')|l] končí elegantně na prahu [Select_CString(top_liege_spouse.IsFemale,'její','jeho')|l] ložnice. Zdá se, že [Select_CString(top_liege_spouse.IsFemale,'ona','on')|l] chce víc než jen potvrdit zvěsti o mé zdatnosti mezi polštáři. Může doufat, že naše spojení přivede nového dědice pro [top_cuckold.GetTitleAsNameNoTooltip]?!"
 tgp_japan_yearly_events.1261.chop.desc: "\n\n[Select_CString(top_liege_spouse.IsFemale,'ona','on')|U] nesmí zjistit, že postrádám reprodukční orgány..."
 tgp_japan_yearly_events.1261.a: "Má krev posílí [top_cuckold.GetPrimaryTitle.GetNameNoTooltip]!"
 tgp_japan_yearly_events.1261.a.flavor: "Krásnější než jakékoliv mé slovo, má krev zazní v dějinách."
 tgp_japan_yearly_events.1261.b: "Raději si vyměníme básně, než..."
 tgp_japan_yearly_events.1261.c: "Neprozradím nedostatečné milování [top_cuckold.GetTitleAsNamePossessiveNoTooltip]."
 tgp_japan_yearly_events.1261.d: "I tak si to užijme!"
 tgp_japan_yearly_events.1262.t: "$tgp_japan_yearly_events.1225.t$: Výměna veršů"
 tgp_japan_yearly_events.1262.desc.intro: "Mnoho silných veršů se objeví při noční procházce. Když se zamýšlím nad "
 tgp_japan_yearly_events.1262.inspo: "sílu větší než já,"
 tgp_japan_yearly_events.1262.japan.inspo: "[Glossary('mono no aware', 'MONONOAWARE_GLOSS')],"
 tgp_japan_yearly_events.1262.desc: "náhle narazím na okouzlujícího básníka [local_poet.GetName], jak recituje verš:\n\n#EMP „V tichu [local_poet_spot.Custom('CZ_GetTerrainType_G')|l],\n\nčekám, až uslyším tvé kroky,\n\nv podvečerním [local_poet_spot.Custom('RoamingLegendaryBeastProvinceWeather')|l].„#!\n\nCítíce mou básnickou náladu, [Select_CString(local_poet.IsFemale,'ona','on')|l] mi naznačí, abych se k [Select_CString(local_poet.IsFemale,'ní','němu')|l] [Select_CString(ROOT.Char.IsFemale,'připojila','připojil')|l] ve stínech. Může to být pozvánka zapojit se do "
 tgp_japan_yearly_events.1262.japan.outro: "[Glossary('renga', 'RENGA_GLOSS')]"
 tgp_japan_yearly_events.1262.outro: "poetické výměny"
 tgp_japan_yearly_events.1262.japan.outro.outro: "nebo její [local_poet.Custom('VenomousCreature')|l]-podobný pohled nenaznačuje něco více chtivého?"
 tgp_japan_yearly_events.1262.a: "Mám přesně ten verš!"
 tgp_japan_yearly_events.1262.a.flavor: "#EMP „Vítr přináší tvůj hlas,\n\njemný jako vzdech padajícího listí,\n\npod podzimním nebem.„#!"
 tgp_japan_yearly_events.1262.b: "Vyměňme si více než slova..."
 tgp_japan_yearly_events.1262.b.flavor: "Naše hlasy budou do noci rozléhat nespočetné 'verše'."
 tgp_japan_yearly_events.1262.c: "Nebo je [Select_CString(local_poet.IsFemale,'ona','on')|l] vrah?"
 MONONOAWARE_GLOSS: "Stav mysli, do něhož se vstupuje při skládání poezie v heijanském Japonsku. Zapojíte se s zároveň intenzivní, ale uměřenou citovou vnímavostí, se zaměřením na pomíjivou krásu a rozpomínáním se na tyranii času."
 RENGA_GLOSS: "Japonská 'renga' (spojená poezie) je forma, při níž několik básníků přispívá střídavými slokami."
 tgp_japan_yearly_events.1263.t: "$tgp_japan_yearly_events.1225.t$: Pomíjivý [SCOPE.Custom('ArtifactFlowerSpecies')|U]"
 tgp_japan_yearly_events.1263.desc: "Pravda světa se odhaluje v přírodě! Při krátké procházce po [rural_beauty_location.Custom('CZ_GetTerrainType_L')|l] poblíž [inspired_poet.GetCurrentLocation.GetBaronyNameExplicitly] mě zasáhne náhlý liják.\n\nPři hledání úkrytu objevuji [Select_CString(rural_beauty.IsFemale,'žena','muž')|l] tančící v záhonu [SCOPE.Custom('ArtifactFlowerSpeciesPlural')|l].\n\nDéšť dopadá o [Select_CString(rural_beauty.IsFemale,'její','jeho')|l] nohy a ničí jemné okvětní lístky. Tato prchavá krása je zvýrazněna zdánlivě bezstarostným řáděním. Když si všimne mé promočené podoby, [Select_CString(rural_beauty.IsFemale,'ona','on')|l] mě láká kývnutím brady."
 tgp_japan_yearly_events.1263.a: "Oslavme naše pomíjivé životy..."
 tgp_japan_yearly_events.1263.a.flavor: "Déšti navzdory, milujte se mezi [SCOPE.Custom('ArtifactFlowerSpeciesPlural')|l]. Tato vzpomínka jistě posílí vaši poezii!"
 tgp_japan_yearly_events.1263.b: "Musím zachovat aspoň jeden [SCOPE.Custom('ArtifactFlowerSpecies')|l]!"
 tgp_japan_yearly_events.1263.b.flavor: "Jedna malá vzpoura proti tyranii času."
 tgp_japan_yearly_events.1263.c: "Mohly by rozdrcené okvětní lístky mít jiný účel?"
 tgp_japan_yearly_events.1263.c.poisonous: "#EMP Dary od [rural_beauty.GetFaith.DeathDeityName]...#!!"
 tgp_japan_yearly_events.1263.c.medicinal: "#EMP Kéž mě obdaruje [rural_beauty.GetFaith.HealthGodName]...#!!"
 tgp_japan_yearly_events.1270.t: "$tgp_japan_yearly_events.1225.t$: Tisíc nesmrtelných listů"
 tgp_japan_yearly_events.1270.desc: "I když se všichni rodí se semínky poezie v srdci, ta má byla vyživována milostným sluncem, v němž jsem se snažil vyhřívat, a sladkými vodami smrti, které nás všechny obklopují.\n\nTo vyvrcholilo vznikem #EMP $poetic_life_artifact_name$#!, který bezpochyby bude pilířem kultury [ROOT.Char.GetTopLiege.GetCulture.GetNameNoTooltip] do budoucna.\n\nVšichni si budou pamatovat, když, "
 tgp_japan_yearly_events.1270.desc.love_memory_1: "#EMP [love_memory_1.GetDescription|U]#!, "
 tgp_japan_yearly_events.1270.desc.love_memory_2: "#EMP [love_memory_2.GetDescription|U]#!, "
 tgp_japan_yearly_events.1270.desc.love_memory_3: "#EMP [love_memory_3.GetDescription|U]#!, "
 tgp_japan_yearly_events.1270.desc.death_memory_1: "#EMP [death_memory_1.GetDescription|U]#!, "
 tgp_japan_yearly_events.1270.desc.death_memory_2: "#EMP [death_memory_2.GetDescription|U]#!, "
 tgp_japan_yearly_events.1270.desc.death_memory_3: "#EMP [death_memory_3.GetDescription|U].#!!"
 tgp_japan_yearly_events.1270.a: "Můj [ROOT.Char.Custom('GetCourt')|l] musí těžit z mé milostné moudrosti!"
 tgp_japan_yearly_events.1270.b: "I když mé tělo hnije, moje mužnost zůstane věčná."
 poetic_life_artifact_name: "$tgp_japan_yearly_events.1270.t$"
 poetic_life_artifact_description: "Průlomové dílo poezie, které zvěčňuje pomíjivou radost z toho, když,\n\n"
 poetic_life_artifact_description.love_memory_1: "[newly_created_artifact.GetDesc|U]$tgp_japan_yearly_events.1270.desc.love_memory_1$"
 poetic_life_artifact_description.love_memory_2: "[newly_created_artifact.GetDesc|U]$tgp_japan_yearly_events.1270.desc.love_memory_2$"
 poetic_life_artifact_description.love_memory_3: "[newly_created_artifact.GetDesc|U]$tgp_japan_yearly_events.1270.desc.love_memory_3$"
 poetic_life_artifact_description.death_memory_1: "[newly_created_artifact.GetDesc|U]$tgp_japan_yearly_events.1270.desc.death_memory_1$"
 poetic_life_artifact_description.death_memory_2: "[newly_created_artifact.GetDesc|U]$tgp_japan_yearly_events.1270.desc.death_memory_2$"
 poetic_life_artifact_description.death_memory_3: "[newly_created_artifact.GetDesc|U]$tgp_japan_yearly_events.1270.desc.death_memory_3$"
 poetic_life_artifact_description.end: "[newly_created_artifact.GetDesc|U]\n\nNapsáno [ROOT.Char.GetFirstNameNoTooltip]."
 tgp_japan_yearly_events.1270.a_effect: "Artefakt „[newly_created_artifact.GetName]“ je proměněn na [Concept('court_artifact','dvorský artefakt')|E] a získá modifikátor [Concept('grandeur','velkolepost')|E]"
 tgp_japan_yearly_events.1270.b_effect: "Získáváte [Concept('artifact','artefakt')|E] „[newly_created_artifact.GetName]“"
 tgp_japan_yearly_events.1170.t: "Svůdné tahy"
 tgp_japan_yearly_events.1170.desc: "Ač nejsem mluvčím jazyka [foreign_ruler.GetCulture.GetLanguage.GetName], poezie [foreign_ruler.GetPrimaryTitle.GetName] je proslulá svou hloubkou a jemností.\n\nJe zajímavé vyhledávat známé znaky, ale těžko odhaluji všechny narážky a jemnosti, které hrají roli."
 tgp_japan_yearly_events.1170.a: "Možná je čas naučit se náš sesterský jazyk."
 tgp_japan_yearly_events.1170.b: "Bah! Řekněte [foreign_ruler.GetFirstNameNoTooltip] [Select_CString(foreign_ruler.IsFemale,'její','jeho')|l] básníci jsou k ničemu!"
 tgp_japan_yearly_events.1170.c: "Nedostatek jasnosti je krásný!"
 tgp_japan_yearly_events.1170.c.flavor: "Toto krátké rozptýlení posiluje vaši představivost"
 BONSAI_GLOSS: "#bold Bonsai#!! je umění pěstování a tvarování malých stromků v nádobách. Někteří učenci tvrdí, že stromy zrcadlí své majitele."
 tgp_japan_yearly_events.1180.t: "Tvarování růstu"
 tgp_japan_yearly_events.1180.desc: "Nový přírůstek do mé zahrady je předmětem hovoru na dvoře. Ač nenese plody a je příliš malý na to, aby poskytoval stín, tento [Glossary( 'Bonsai', 'BONSAI_GLOSS' )] strom je důkazem let trpělivosti.\n\nMůj [GetCourtPositionType('court_gardener_court_position').GetName()], [gardener.GetFirstName] mě vidí, jak ho zkoumám,\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|l], strom ponechaný svému osudu je hrubá věc. Teprve když je tvarován s láskyplnou péčí, jeho tvar a styl nabývají schopnosti inspirovat. Vzbudí to ve vás něco?“\n\n"
 court_position_from_event: "Z událostí"
 tgp_japan_yearly_events.1180.a: "Nechám se vést jeho stabilitou."
 tgp_japan_yearly_events.1180.b: "Strom ctí [ROOT.Char.GetFaith.FertilityGodName], pečujte o něj dobře."
 tgp_japan_yearly_events.1180.c: "Rád bych se ujal jeho tvarování."
 tgp_japan_yearly_events.1190.t: "Potíže s povinnostmi"
 tgp_japan_yearly_events.1190.desc_annoyed: "Hluk dvora a stížnosti pánů mě obtěžují, a poslední, na co myslím, jsou hádky obyčejných občanů."
 tgp_japan_yearly_events.1020.desc_drunk: "Hluboce piji z bohaté dávky [ROOT.Char.Custom('RegionalAlcoholicDrink')|l], ale přináší jen malou útěchu. Ačkoli je to politováníhodné, plnění mých povinností v opilosti se stalo druhou přirozeností."
 tgp_japan_yearly_events.1020.desc_dumb: "Opět se mi nedaří pochopit denní machinace dvora. Smutně mě nikdo nemůže považovat za učence nebo schopného úředníka."
 tgp_japan_yearly_events.1190.desc: "\n\nDívám se na hromadu [ROOT.Char.Custom('GetWritingMaterialPlural')|l] a zapomněl jsem, proč jsou důležité. Znovu jejich obsah číst nepřináší jasno, ale naléhavost státu vyžaduje, abych učinil rozhodnutí, byť špatně informované."
 tgp_japan_yearly_events.1190.a: "Musím napravit tuto slabinu!"
 tgp_japan_yearly_events.1190.b: "Má rada musí rozhodnout místo mě."
 tgp_japan_yearly_events.1190.c: "Špatné rozhodnutí je lepší než žádné..."
 tgp_japan_yearly_events.1190.c_tt: "Náhodný [Concept('county','hrabství')|E] ve vašem panství ztratí část [Concept('control','kontroly')|E]"
 tgp_japan_yearly_events.1220.t: "Zázrak v rouchu"
 tgp_japan_yearly_events.1220.desc: "[Select_CString(miracle_recipient.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMeShort', miracle_recipient)|l], [miracle_recipient.GetName] mi přináší zprávu o putujícím mnichu, [monk.GetName], který vykonal zázrak.\n\n"
 tgp_japan_yearly_events.1220.desc_health: "„Má nemoc mě už netrápí, [Select_CString(ROOT.Char.IsFemale,'má','můj')|l] [miracle_recipient.Custom2('RelationToMeShort', ROOT.Char)|l]! Ve skutečnosti mě moc modliteb [Select_CString(monk.IsFemale,'její','jeho')|l] učinila silnějším než před nemocí.“"
 tgp_japan_yearly_events.1220.desc_wealth: "„Dal jsem mnichovi pytlík zlata, a o několik měsíců později se [Select_CString(monk.IsFemale,'ona','on')|l] vrátil s pytlíkem desetkrát větší hodnoty než ten můj, a oplatil tím laskavost!“"
 tgp_japan_yearly_events.1220.desc_knowledge: "„Někteří mě považovali za tupce, než jsem potkal tohoto mnicha. Nyní, po přijetí učení [Select_CString(monk.IsFemale,'její','jeho')|l], má mysl přetéká věděním a duševní ostrostí!“"
 tgp_japan_yearly_events.1220.a: "Úžasné! Musím tohoto mnicha vyhledat."
 tgp_japan_yearly_events.1220.b: "Někde musí být logické vysvětlení..."
 tgp_japan_yearly_events.1220.c: "Měl bych se naučit způsoby [Select_CString(monk.IsFemale,'její','jeho')|l]..."
 tgp_japan_yearly_events.1220.tt: "Mnich na vás vykoná zázrak"
 tgp_japan_yearly_events.1220.c.tt: "Studujete zázrak"
 tgp_japan_yearly_events.1220.tt_win: "Naučíte se způsoby mnicha"
 tgp_japan_yearly_events.1220.tt_lose: "Způsoby mnicha vám unikají"
 tgp_japan_yearly_events.1220.tt_wealth: "Vlastní investice do chrámu se zdají přinášet spolehlivé výnosy."
 tgp_japan_yearly_events.1230.t: "Pronásledován zanedbáním"
 tgp_japan_yearly_events.1230.desc: "[cursed_artifact.GetName|U] už není tím [cursed_artifact.GetSlotType|l], čím býval. S [cursed_artifact.Custom('GetArtifactDecayDesc')|l] a jeho vysokým stářím [cursed_artifact.GetAge] let je tento artefakt zralý na opravu.\n\nLegenda praví, že předměty mají vzpomínky a emoce jako my, a pokud jsou zanedbány, mohou být posedlé [Glossary( 'Yokai', 'YOKAI_GLOSS' )]..."
 tgp_japan_yearly_events.1230.a: "Opravte to, než to ožije!"
 tgp_japan_yearly_events.1230.b: "Nebudu být pronásledován předmětem..."
 tgp_japan_yearly_events.1230.c: "Doufejme, že se nic nestane..."
 tgp_japan_yearly_events.1230.c_cynical: "No, těmto příběhům nevěřím."
 artifact_decay_scratched: "jeho povrch poškrábaný a propíchnutý"
 artifact_decay_dull: "jeho ostré konce otupěly"
 artifact_decay_torn: "jeho vazby a látka roztrhané"
 artifact_decay_cracked: "jeho povrch plný trhlin"
 artifact_decay_fracture: "jeho povrch posetý prasklinami"
 artifact_decay_worn: "jak opotřebované se stalo"
 tgp_japan_yearly_events.1240.t: "Ztracen v řádcích"
 tgp_japan_yearly_events.1240.desc: "Poeta z [traveler.GetCulture.GetName], [traveler.GetName], cestující mými kraji, ke mně přistoupí s textem v [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip].\n\n„[ROOT.Char.GetTitleAsNameNoTooltip], slyšel jsem o vaší bohaté básnické tradici, ale nedovedu rozluštit písma vašeho lidu.“\n\n[Select_CString(traveler.IsFemale,'ona','on')|U] začíná číst svitek s těžkým přízvukem a problém se stává patrným. [Select_CString(traveler.IsFemale,'ona','on')|U] čte zleva doprava, zatímco tradiční [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] písmo je vertikální.\n\nDvořané sledují a chichotají se, zatímco [Select_CString(traveler.IsFemale,'ona','on')|l] pokračuje ve svém [Select_CString(traveler.IsFemale,'jejímu','jeho')|l] přívalu slov."
 tgp_japan_yearly_events.1240.a: "Prosím, sežeňte [Select_CString(traveler.IsFemale,'ji','jej')|l] učitele!"
 tgp_japan_yearly_events.1240.b: "Ha! To byl dobrý smích."
 tgp_japan_yearly_events.1240.c: "Uvidíme, jestli to dokážu vysvětlit ve vašem jazyce..."
 artifact_fertility_gain_2_modifier: "Plodnost"
 artifact_powerful_vassal_opinion_5_modifier: "$artifact_powerful_vassal_opinion_1_modifier$"
 artifact_monthly_prestige_add_3_modifier: "$artifact_monthly_prestige_add_1_modifier$"
 artifact_kakejiku_scroll_name: "Kakejiku svitek"
 KAKEJIKU_GLOSS: "#bold Kakejiku svitek#!! — nebo #bold Kakemono#!! je svitek, který zobrazuje kaligrafii nebo malby, obvykle vyprávějící příběh."
 artifact_kakejiku_scroll_desc: "Svitek [Glossary( 'Kakejiku Scroll', 'KAKEJIKU_GLOSS' )] vyprávějící příběh o"
 artifact_kakejiku_scroll_crane_desc: "$artifact_kakejiku_scroll_desc$ osamělém jeřábu, který pečuje o strom.\n\n#weak Peří jeřába se chvěje ve větru, sleduje sazenici. Jeřábi se páří na celý život, ale tomuto stromu trvá století, než vyroste...#!!"
 artifact_kakejiku_scroll_friends_desc: "$artifact_kakejiku_scroll_desc$ dvou lidech spojených osudem, kteří rostou skrze své boje a upevňují hluboké přátelství.\n\n#weak Dvě postavy se setkají pod hvězdnou oblohou, jejich pouto spojuje nebeský most...#!!"
 artifact_kakejiku_scroll_sword_desc: "$artifact_kakejiku_scroll_desc$ očarovaném meči, který mohou ovládat jen nejctnostnější válečníci.\n\n#weak Třešeň kvete nad klidným rybníkem a pod ní je zahalená čepel...#!!"
 tgp_japan_yearly_events.1250.t: "Příběh pro věky"
 tgp_japan_yearly_events.1250.desc: "[scroll_gifter.GetName|U] vystoupí vpřed s dlouhým, zabaleným předmětem. „[Select_CString(ROOT.Char.IsFemale,'Má','Můj')|U] [scroll_gifter.Custom2('RelationToMeShort', ROOT.Char)|l], mám dar pro vaše svazek.“ říká [scroll_gifter.GetNameNoTooltip], podávaje svitek. „[Glossary( 'Kakejiku Scroll', 'KAKEJIKU_GLOSS' )], s prózou od nejlepšího básníka, ať si pamatujete jeho význam, až přijdou těžké časy.“"
 tgp_japan_yearly_events.1250.a: "Pověste ho nad manželskou postel."
 tgp_japan_yearly_events.1250.b: "Dejte ho na dvůr, kde ho všichni uvidí."
 tgp_japan_yearly_events.1250.c: "Uchovejte ho v bezpečí, aby si ho naši potomci mohli přečíst."
