l_polish:
 tgp_east_asia_mandala_capital_events.1000.t.base: "Hlavní sídlo"
 tgp_east_asia_mandala_capital_events.1000.t: "$tgp_east_asia_mandala_capital_events.1000.t.base$: $building_mandala_capital_01$"
 tgp_east_asia_mandala_capital_events.1000.t.second: "$tgp_east_asia_mandala_capital_events.1000.t.base$: $building_mandala_capital_02$"
 tgp_east_asia_mandala_capital_events.1000.t.third: "$tgp_east_asia_mandala_capital_events.1000.t.base$: $building_mandala_capital_03$"
 tgp_east_asia_mandala_capital_events.1000.t.fourth: "$tgp_east_asia_mandala_capital_events.1000.t.base$: $building_mandala_capital_04$"
 tgp_east_asia_mandala_capital_events.1000.t.final: "$tgp_east_asia_mandala_capital_events.1000.t.base$: $building_mandala_capital_05$"
 tgp_east_asia_mandala_capital_events.1000.desc: "Rozhlížím se po chrámu. Dělníci už splnili své povinnosti a rozcházejí se. Zanechávají po sobě pevnou kamennou stavbu, která jako by vyrůstala ze země — ztělesnění naší vroucí víry. \n\nMírně zakloním hlavu a sleduji věže tyčící se k nebi.\n\nAno, ano, tohle postačí. Stanu se slavným dévarádžou, budu tomuto chrámu vládnout a prokážu své schopnosti."
 tgp_east_asia_mandala_capital_events.1000.desc.second: "Chrám se rozrostl o další svatyně a ozdoby. Vše pečlivě vystavěné, vše vyjadřující úctu ke #EMP mně#!. \n\nProcházím chrámem a sloužící mě obklopují jako stíny. Prohlížím si každé zákoutí a cestou se setkávám se svými stoupenci. S každou skloněnou hlavou a každým uctivě odvráceným pohledem cítím, jak má moc roste.\n\nTohle je #EMP má#! chvíle."
 tgp_east_asia_mandala_capital_events.1000.desc.third: "Chrám, nyní rozšířený v rozlehlý areál, překypuje ruchem. Je v něm místo pro desítky poutníků z dalekých krajů i pro místní duchovenstvo. Každodenní bohoslužby nikdy neustávají.\n\nPoutníci přišli, aby mě spatřili. Kněží, aby mě uctívali.\n\nZástupy se přede mnou ochotně rozestupují. Cestou se na okamžik zastavím a dotknu se několika skloněných hlav. Můj lid. Moji stoupenci. Mé božství."
 tgp_east_asia_mandala_capital_events.1000.desc.fourth: "Nad chrámovým komplexem vychází slunce a zrcadlící nádrže se rozzáří božskou nádherou.\n\nKochám se pohledem na chrám, který nyní zdobí rozlehlé vodní plochy a malá pokladnice těch nejvzácnějších relikvií.\n\nPomalu přikývnu. Ano, právě sem patřím. Tohle je mé poslání. Moji stoupenci mě potřebují. Mám vést jejich kroky a oni mi za to vystavěli tento skvostný chrám. Dokážeme velké věci. #EMP Společně.#!"
 tgp_east_asia_mandala_capital_events.1000.desc.final: "V mém komplexu v [CZProvNameNoTooltip(project_location,'L')] byl konečně položen poslední kámen.\n\nChrámový palác čeká. Na chvíli se oddám čisté radosti a úžasu při pohledu na nadpozemské věže, oblouky a [Glossary( 'baraje', 'BARAY_GLOSS' )]. Chrám naplňuje nádhera jako z jiného světa.\n\nLidé kolem mě jásají a tančí. Oslavují jeden z mých největších úspěchů — takový, na který se bude vzpomínat po celé věky."
 tgp_east_asia_mandala_capital_events.1000.a: "Tak se rodí božství."
 tgp_east_asia_mandala_capital_events.1000.a.second: "Transcendence čeká!"
 tgp_east_asia_mandala_capital_events.1000.a.third: "Konečně se někam dostáváme..."
 tgp_east_asia_mandala_capital_events.1000.a.fourth: "Tohle je mé #EMP pravé#! poslání."
 tgp_east_asia_mandala_capital_events.1000.a.final: "Prohlédněme si výsady #EMP božstva#!."
 tgp_east_asia_mandala_capital_events.1010.t: "Odměna za hlavní sídlo"
 tgp_east_asia_mandala_capital_events.1010.desc: "Časně ráno ke mně dorazí posel. Vysílá jej [overlord_scope.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', overlord_scope)|l]: „[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Velkolepé chrámové sídlo v [CZProvNameNoTooltip(project_location,'L')] je konečně dokončeno!“\n\n„[Select_CString(overlord_scope.IsFemale,'Naše milostivá','Náš milostivý')|U] [overlord_scope.GetTitleAsNameNoTooltip] mě vysílá s poděkováním za tvé štědré příspěvky k tomuto dílu!“ [Select_CString(envoy.IsFemale,'Poselkyni','Poslovi')|U] září oči vroucím nadšením, když líčí nadpozemské věže, oblouky a [Glossary( 'baraje', 'BARAY_GLOSS' )], které chrámu dodávají nádheru jako z jiného světa.\n\nSpokojeně zamručím a přikývnu. I můj příspěvek pomohl tomuto dílu..."
 tgp_east_asia_mandala_capital_events.1010.a: "Vyřiď mé pozdravy."
