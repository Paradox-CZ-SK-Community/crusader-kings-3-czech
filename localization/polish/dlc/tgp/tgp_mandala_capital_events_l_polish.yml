 mandala_capital_05_destruction_talisman_desc: "$mandala_capital_05_talisman_base$ Rudé záblesky drahokamů vzbuzují hrůzu a úctu při pohledu na božstva zkázy, jak plní své děsivé, ale nezbytné úkoly."
 mandala_capital_05_trickery_talisman_desc: "$mandala_capital_05_talisman_base$ Zdánlivě nenápadné drahokamy vyprávějí o šibalovi, který nejrůznějšími kousky podrobuje lidi zkouškám."
