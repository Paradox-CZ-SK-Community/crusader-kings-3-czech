l_polish:
 devaraja.0001.title: "Léčivá dobročinnost"
 devaraja.0001.desc: "Území [diseased_county_scope.GetName] zoufale potřebuje pomoc. Jeho obyvatele sužuje nemoc, a pokud si někde v mém panství zaslouží milosrdenství, pak právě zde. Když však prohlížím okolí a hledám vhodné místo pro zřízení léčebny, přistoupí ke mně jeden z nejubožejších představitelů prostého lidu, jakého jsem kdy [Select_CString(ROOT.Char.IsFemale,'spatřila','spatřil')]. V hrubém rozporu s dvorským protokolem padá na všechny čtyři a úpěnlivě prosí o pomoc.\n\nJako #italic dévarádža#! mám povinnost pozvednout všechny své poddané. Ale je skutečně mou povinností zachraňovat i... #italic něco takového#!?"
 devaraja.0001.a: "V těchto těžkých časech musím pomáhat všem, bez ohledu na jejich bídu."
 devaraja.0001.b: "Ať na celé úsilí dohlédne [steward.GetCouncilTitle|l], [steward.GetFirstNameNoTooltip]."
 devaraja.0001.c: "Fuj! Tohle špinavé místo není hodno božského milosrdenství."
 healed_by_the_devaraja: "Uzdravení dévarádžou"
 devaraja.0002.title: "Modlitby za božského krále"
 devaraja.0002.desc.brahmin: "Když [brahmin_or_chaplain.GetName], [GetCourtPositionType('court_brahmin_court_position').GetName|l], dokončí dnešní úřední záležitosti, začne žehnat dvoru verši z #italic Anumodany#!, tradičního zpěvu, kterým se uzavírá den.\n\n#italic Tak jako řeky plné vody naplňují oceán,#!\n#italic Tak i zdejší dary prospívají hladovým mrtvým...#!\n\nV hlavě mě náhle začne pálit jedna otázka. Odvážím se porušit etiketu?"
 devaraja.0002.desc.chaplain: "Když [brahmin_or_chaplain.GetName], [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName|l], dokončí dnešní úřední záležitosti, začne žehnat dvoru verši z #italic Anumodany#!, tradičního zpěvu, kterým se uzavírá den.\n\n#italic Tak jako řeky plné vody naplňují oceán,#!\n#italic Tak i zdejší dary prospívají hladovým mrtvým...#!\n\nV hlavě mě náhle začne pálit jedna otázka. Odvážím se porušit etiketu?"
 devaraja.0002.a: "„Proč by mrtví měli mít z našich zásluh užitek?“"
 devaraja.0002.a.tt.success: "Poslední verš je důmyslně pozměněn tak, aby místo mrtvých oslavoval tebe"
 devaraja.0002.a.tt.failure: "Tvým přerušením se celý obřad změní v trapnou záležitost"
 devaraja.0002.b.tt: "[brahmin_or_chaplain.GetFirstNameNoTooltip|U] si oddechne, že obřad proběhl podle plánu"
 devaraja.0002.b: "Nesmím se nechat ovládnout vtíravými myšlenkami!"
 devaraja.0002.c: "Přeruším obřad a nabídnu lepší závěrečný verš."
 devaraja.0002.c.tt.success: "Díky svému důvtipu a znalostem na místě vymyslíš lepší závěrečný verš"
 devaraja.0002.c.quote.success: "„A stejně tak vše, co zde dáváme, prospívá #italic králi#!!“"
 devaraja.0002.b.tt.failure: "Po přerušení [brahmin_or_chaplain.Custom('CZ_FirstNameNoTooltip_G')] ze sebe jen koktavě soukáš nepovedené verše"
 devaraja.0003.title: "Výjimečná rozprava o dharmě"
 devaraja.0003.desc.guru: "U dvora se čas od času pořádá rozprava o #italic dharmě#!, kterou má vést [GetCourtPositionType('court_guru_court_position').GetName|l]. Obvykle jde o dlouhou, pečlivě uspořádanou událost plnou obřadních zpěvů a formalit. Řečník za své úsilí dostává štědrý dar. Dnes však [guru_or_chaplain.GetName] působí poněkud unaveně.\n\nPřed shromážděným dvorem pouze prohlásí: „[ROOT.Char.GetTitleTierName|U] už ví všechno, co je třeba vědět.“ Poté odrecituje obvyklé závěrečné pasáže a vrátí se na své místo."
 devaraja.0003.desc.chaplain: "U dvora se čas od času pořádá rozprava o #italic dharmě#!, kterou má vést [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName|l]. Obvykle jde o dlouhou, pečlivě uspořádanou událost plnou obřadních zpěvů a formalit. Řečník za své úsilí dostává štědrý dar. Dnes však [guru_or_chaplain.GetName] působí poněkud unaveně.\n\nPřed shromážděným dvorem pouze prohlásí: „[ROOT.Char.GetTitleTierName|U] už ví všechno, co je třeba vědět.“ Poté odrecituje obvyklé závěrečné pasáže a vrátí se na své místo."
 devaraja.0003.a: "Ha, výborně! Ať [guru_or_chaplain.GetName] dostane svou odměnu."
 devaraja.0003.b: "Chytré! Ale já odměňuji pouze skutečné úsilí."
 devaraja.0003.c: "Lenost neodměňuji! Stráže, zatkněte [guru_or_chaplain.Custom('CZ_Name_A')]!"
 devaraja.0003.d: "Přiveďte [guru_or_chaplain.Custom('CZ_FirstNameNoTooltip_A')] zpět. Sám se vyptám na #italic dharmu#!."
 devaraja.0003.d.tt.success: "Svými znalostmi #italic dharmy#! ohromíš [guru_or_chaplain.Custom('CZ_FirstNameNoTooltip_A')] i své dvořany"
 devaraja.0003.d.tt.failure: "Před [guru_or_chaplain.Custom('CZ_FirstNameNoTooltip_I')] a svými dvořany se ztrapníš, protože nedokážeš prokázat, že rozumíš #italic dharmě#!"
 devaraja.0004.title: "Jak já miluji průvody!"
 devaraja.0004.desc: "Území [capital_county.GetName] nese hluboké jizvy dávných bojů. Po dlouhá léta jej pustošily meče i bouře. Kromě obnovy poničených staveb bychom měli udělat také něco pro povznesení ducha místních obyvatel.\n\nCo takhle na konci období dešťů uspořádat v hlavním městě slavnostní lodní průvod? Na první lodi by mohlo vystupovat šestasedmdesát hráčů na píšťaly a hned za nimi sto deset bubeníků. A aby byl průvod skutečně velkolepý, mohli bychom požádat všechny kláštery, aby každý zaplatil výzdobu jedné lodi!"
 devaraja.0004.a: "Až lodě proplují kolem, lidé budou nadšením bez sebe!"
 devaraja.0004.b: "Žádat v této době kláštery o zlato by nepřineslo nic dobrého."
 devaraja.0004.b.tt: "Tvého ústupu od původního záměru si ostatní všimnou"
 devaraja.0004.c: "Průvod se uskuteční, ale bez účasti klášterů."
 devaraja_hosts_parade: "Velkolepý průvod dévarádži"
 devaraja.0005.title: "Zeď se dvěma tvářemi"
 devaraja.0005.desc: "Nové chrámové stavby potřebují výzdobu, umění oslavující božství i světskou moc. Abychom zdůraznili božský aspekt [ROOT.Char.Custom('GetAspectNoun')|l], který ztělesňuje náš spravedlivý rod, můžeme fresky a sochy nového chrámu zaplnit výjevy s božstvy spojenými s aspektem [ROOT.Char.Custom('GetAspectNoun')|l].\n\nNebo na nich necháme vyobrazit rod [ROOT.Char.GetHouse.GetName] a posílíme tak mou vlastní prestiž."
 devaraja.0005.a: "Toto místo bude zasvěceno bohům."
 devaraja.0005.b: "Toto místo bude zasvěceno mé vlastní slávě."
 devaraja.0006.title: "Moudrost vesla"
 devaraja.0006.desc.guru: "Doneslo se ke mně, že [guru_or_chaplain.GetName], [GetCourtPositionType('court_guru_court_position').GetName|l], vesluje na malé loďce po jezírkách kolem paláce. Zatímco se bavím se svými dvořany, zavolám přes vodní hladinu na tohoto milovníka projížděk. „Jsi přece [GetCourtPositionType('court_guru_court_position').GetNameNoTooltip|l]! Copak nemáš žádnou úctu ke svému vznešenému úřadu? Jak můžeš [Select_CString(guru_or_chaplain.IsFemale,'sama','sám')] veslovat jako nějaký obyčejný rybář?“\n\nPo krátké odmlce [guru_or_chaplain.GetFirstNameNoTooltip] odpovídá: „Když se [ROOT.Char.GetTitleTierName|l] veřejně oddává prostopášným radovánkám, může si i [GetCourtPositionType('court_guru_court_position').GetNameNoTooltip|l] veslovat na vlastní loďce.“"
 devaraja.0006.desc.chaplain: "Doneslo se ke mně, že [guru_or_chaplain.GetName], [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName|l], vesluje na malé loďce po jezírkách kolem paláce. Zatímco se bavím se svými dvořany, zavolám přes vodní hladinu na tohoto milovníka projížděk. „Jsi přece [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName|l]! Copak nemáš žádnou úctu ke svému vznešenému úřadu? Jak můžeš [Select_CString(guru_or_chaplain.IsFemale,'sama','sám')] veslovat jako nějaký obyčejný rybář?“\n\nPo krátké odmlce [guru_or_chaplain.GetFirstNameNoTooltip] odpovídá: „Když se [ROOT.Char.GetTitleTierName|l] veřejně oddává prostopášným radovánkám, může si i [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName|l] veslovat na vlastní loďce.“"
 devaraja.0006.a: "Možná bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] na veřejnosti projevovat více skromnosti."
 devaraja.0006.b: "Nesmysl! Oslavy budou pokračovat, dokud se mi zachce."
 devaraja.0006.c: "To je urážka! Zbavte [guru_or_chaplain.Custom('CZ_FirstNameNoTooltip_A')] všech titulů!"
 devaraja.0006.d: "Možná bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] s pitím úplně přestat."
 devaraja.0007.title: "Jednoznačná nejednoznačnost"
 devaraja.0007.desc: "Pojem #italic dévarádža#! je ošemetná záležitost. Jsem samozřejmě [ROOT.Char.GetTitleTierName|l], ale zároveň mě spojuje s božstvím aspekt, který představuje [ROOT.Char.Custom('GetAspectNoun')|l]. Jsem snad s božstvem jedna a táž bytost? Ach, právě v tom spočívá ona záludná otázka. Musím zachovat jistou nejednoznačnost, abych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] být pro jedny božstvem a pro druhé panovníkem.\n\nA tak by to i zůstalo, kdyby mě nějaký rozvláčný dvorský chvalořečník právě neprohlásil za božstvo, které zosobňuje [ROOT.Char.Custom('GetAspectNoun')|l]. Dvořané se už div nepoperou při hádkách o mou skutečnou podstatu. Nezbývá mi než zasáhnout."
 devaraja.0007.a: "Ano, mí služebníci! [ROOT.Char.Custom('GetAspectNoun')|U] podléhá mé vůli."
 devaraja.0007.b: "Lide můj! [ROOT.Char.Custom('GetAspectNoun')|U] je božská moc, které pouze sloužím, nikoli vládnu."
 devaraja.0007.c: "Lidská a božská podstata jsou ve mně mysticky sjednoceny v jedinou bytost."
 devaraja.0007.c.tt.success: "Podaří se ti formulovat kompromisní pojetí, které uspokojí dostatek lidí"
 devaraja.0007.c.tt.failure: "Tvůj pokus o teologický výklad celou situaci jen zhorší"
 devaraja_as_god: "Božský dévarádža"
 devaraja_as_king: "Královský dévarádža"
 devaraja_as_hypostatic_union: "Dévarádža dvojí podstaty"
 devaraja.0008.title: "Zvěsti o obrácení na smrtelném loži"
 devaraja.0008.desc: "[suzerains_missionary.GetNameNoTooltip|U], misionář ve službách [suzerain.Custom('CZ_TitledFirstName_G')], ke mně přichází tak překotně, až málem zakopne o vlastní nohy.\n\n„Nesu skvělé zprávy!“ zvolá. „Důkladně jsem [Select_CString(suzerains_missionary.IsFemale,'prozkoumala','prozkoumal')] dějiny vašeho rodu a [Select_CString(suzerains_missionary.IsFemale,'vyptávala','vyptával')] se nejstarších služebníků na všechno, co si pamatují. Zdá se, že [Select_CString(deathbed_conversion_ancestor.IsFemale,'tvá předkyně','tvůj předek')] [deathbed_conversion_ancestor.GetName] ve skutečnosti těsně před smrtí [Select_CString(deathbed_conversion_ancestor.IsFemale,'přijala','přijal')] víru [suzerain.GetFaith.GetName]!“\n\n[suzerains_missionary.GetName|U] na mě hledí s nadšením, které se sotva daří skrývat. „[suzerain.GetFaith.HighGodName|U] je vám bližší, než si myslíte!“"
 devaraja.0008.a: "[deathbed_conversion_ancestor.GetName|U] [Select_CString(deathbed_conversion_ancestor.IsFemale,'byla','byl')] [CZFaithAdjDecline(suzerain.GetFaith,'é')|l] víry? Tomu mohu uvěřit."
 devaraja.0008.a.tt.conversion: "[ROOT.Char.GetName|U] nyní tvrdí, že [Select_CString(deathbed_conversion_ancestor.IsFemale,'předkyně','předek')] [deathbed_conversion_ancestor.GetName] těsně před smrtí [Select_CString(deathbed_conversion_ancestor.IsFemale,'přijala','přijal')] víru [suzerain.GetFaith.GetName]"
 devaraja.0008.b: "[deathbed_conversion_ancestor.GetRelationToString( ROOT.Char )|U] [Select_CString(deathbed_conversion_ancestor.IsFemale,'zemřela','zemřel')] jako [deathbed_conversion_ancestor.GetFaith.GetAdherentName|l] a tak také navždy zůstane v naší paměti!"
 devaraja.0009.title: "Misionář bez poslání"
 devaraja.0009.desc: "Mé přijetí víry [suzerain.GetFaith.GetName] připravilo [suzerains_missionary.Custom('CZ_Name_A')] o dvůr, na kterém by bylo možné dál šířit nové učení. Přestože [suzerains_missionary.GetName] má z mého obrácení velikou radost, zároveň pociťuje nejistotu ohledně své budoucnosti."
 devaraja.0009.a: "[suzerains_missionary.Custom('CZ_Name_V')|U]! Přijmi místo v mé radě! Budeš zastávat úřad [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName|l]!"
 devaraja.0009.a.tt.missionary_now_chaplain: "[ROOT.Char.GetName|U] [Select_CString(ROOT.Char.IsFemale,'jmenovala','jmenoval')] tvého misionáře [suzerains_missionary.Custom('CZ_Name_A')] do úřadu [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName|l]"
 devaraja.0009.b: "[suzerains_missionary.Custom('CZ_Name_V')|U], tvá práce zde skončila. Teď už #italic odejdi#!."
 devaraja.0010.title: "Osamělá víra"
 devaraja.0010.desc: "[suzerains_missionary.GetName|U], [Select_CString(suzerains_missionary.IsFemale,'oddaná vyznavačka','oddaný vyznavač')] víry [suzerains_missionary.GetFaith.GetName], propadá sklíčenosti kvůli víře [suzerain.GetFaith.GetName], kterou vyznává [Select_CString(suzerain.IsFemale,'paní','pán')] [suzerain.GetTitledFirstName]. Nyní stojí na rozcestí. Víra se otřásá a nezbývá než čekat na nějaké znamení. Zda ono znamení přijde od tebe, nebo z [suzerains_missionary.GetFaith.DivineRealm|l], záleží jen na tvém rozhodnutí."
 devaraja.0010.a: "[suzerains_missionary.GetName|U] se [Select_CString(suzerains_missionary.IsFemale,'rozhodne sama','rozhodne sám')], až nastane správný čas."
 devaraja.0010.a.tt.unconverted: "[suzerains_missionary.GetName|U] nadále zůstává [Select_CString(suzerains_missionary.IsFemale,'sklíčenou vyznavačkou','sklíčeným vyznavačem')] víry [suzerains_missionary.GetFaith.GetName]"
 devaraja.0010.a.tt.converts: "[suzerains_missionary.GetName|U] přijímá [CZFaithAdjDecline(suzerain.GetFaith,'ou')|l] víru [suzerain.Custom('CZ_Name_G')]"
 devaraja.0010.b: "Možná [suzerains_missionary.GetName] najde nové poslání ve víře [ROOT.Char.GetFaith.GetName]?"
 devaraja.0010.b.tt.success: "[suzerains_missionary.GetName|U] přijímá víru [ROOT.Char.GetFaith.GetName]"
 devaraja.0010.b.tt.failure: "[suzerains_missionary.GetName|U] zůstává [Select_CString(suzerains_missionary.IsFemale,'neochvějnou vyznavačkou','neochvějným vyznavačem')] víry [suzerains_missionary.GetFaith.GetName]"
 fervor_gain_deathbed_conversion_discovered: "Odhalené obrácení na smrtelném loži"
 fervor_gain_faith_reaffirmed: "Potvrzená víra předků"
