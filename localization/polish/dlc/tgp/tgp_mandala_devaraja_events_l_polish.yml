l_polish:
 devaraja.0001.title: "Prospěšná charita" # todo: NEW TRANSLATION
 devaraja.0001.desc: "Okres [diseased_county_scope.GetName] volá o úlevu od nemoci, jež sužuje jeho lidi. Pokud teď nějaké místo v říši žádá o dobročinnost, je to právě toto. Při prohlídce prostorů vhodných k léčení se však ke mně přiblíží ten nejubožejší exemplář selského lidu. V hrubém porušení protokolu se [diseased_peasant.GetSheHe] svalí na [Select_CString(diseased_peasant.IsFemale,'její','jeho')] ruce a kolena a žebrá o úlevu.\n\nJako #italic Devaraja#! se ode mě očekává, že povznesu všechny své poddané, ale mohu... #italic toto#! opravdu být to, co musím zachránit?" # todo: RETRANSLATED ENGLISH
 devaraja.0001.a: "Musím v této těžké době pomoci, bez ohledu na to, jací jsou lidé ubozí." # todo: NEW TRANSLATION
 devaraja.0001.b: "Tuto práci svěřuji svému [steward.GetCouncilTitle], [steward.GetFirstNameNoTooltip], aby dohlédl na toto úsilí." # todo: NEW TRANSLATION
 devaraja.0001.c: "Uf! Toto špinavé místo není hodno přijímat božskou charitu." # todo: NEW TRANSLATION
 healed_by_the_devaraja: "Uzdraven Devarajou" # todo: NEW TRANSLATION
 devaraja.0002.title: "Modlitby pro božského krále" # todo: NEW TRANSLATION
 devaraja.0002.desc.brahmin: "Jakmile můj [GetCourtPositionType('court_brahmin_court_position').GetName], [brahmin_or_chaplain.GetName], uzavírá dnešní oficiální záležitosti, [brahmin_or_chaplain.GetSheHe] začíná žehnat dvoru verši #italic Anumodany#!, obvyklého zpěvu na zakončení dne.\n\n#italic Tak jako řeky plné vody naplňují oceán,#!\n#italic tak i to, co je zde darováno, prospívá hladovým mrtvým...#!\n\nNajednou mi hlavou probleskne otázka. Troufnu si porušit etiketu?"
 devaraja.0002.desc.chaplain: "Jakmile můj [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName], [brahmin_or_chaplain.GetName], uzavírá dnešní oficiální záležitosti, [brahmin_or_chaplain.GetSheHe] začíná žehnat dvoru verši #italic Anumodany#!, obvyklého zpěvu na zakončení dne.\n\n#italic Tak jako řeky plné vody naplňují oceán,#!\n#italic tak i to, co je zde darováno, prospívá hladovým mrtvým...#!\n\nNajednou mi hlavou probleskne otázka. Troufnu si porušit etiketu?"
 devaraja.0002.a: "„Proč si mrtví zaslouží takovou zásluhu?“" # todo: NEW TRANSLATION
 devaraja.0002.a.tt.success: "Poslední verš je důvtipně změněn tak, aby vás místo toho pochválil" # todo: NEW TRANSLATION
 devaraja.0002.a.tt.failure: "Tvé přerušení učinilo celý rituál trapným" # todo: NEW TRANSLATION
 devaraja.0002.b.tt: "[brahmin_or_chaplain.GetFirstNameNoTooltip] is relieved the ritual went as planned" # todo: NEW TRANSLATION
 devaraja.0002.b: "Nedopusťte, aby vtíravé myšlenky zvítězily!" # todo: NEW TRANSLATION
 devaraja.0002.c: "Přerušte a navrhněte lepší poslední verš." # todo: NEW TRANSLATION
 devaraja.0002.c.tt.success: "Tvůj důvtip a znalosti na místě vymyslí lepší závěrečný verš" # todo: NEW TRANSLATION
 devaraja.0002.c.quote.success: "„I tak vše, co je zde dáno, prospívá #italic králi#!“" # todo: NEW TRANSLATION
 devaraja.0002.b.tt.failure: "Zakoktáš slabé věty poté, co jsi přerušil [brahmin_or_chaplain.GetFirstNameNoTooltip]." # todo: NEW TRANSLATION
 devaraja.0003.title: "Zvláštní přednáška o Dharmě" # todo: NEW TRANSLATION
 devaraja.0003.desc.guru: "Občas se od [GetCourtPositionType('court_guru_court_position').GetName] očekává, že v paláci pronese projev o konceptu #italic Dharmy#!. Obvykle jde o dlouhou událost, strukturovanou a plnou zpěvů a formalit, doprovázenou štědrým darem pro řečníka jako uznání za jeho úsilí. Dnes se však [guru_or_chaplain.GetName] zdá poněkud unavený.\n\nStojíc před královským publikem, [guru_or_chaplain.GetSheHe] jednoduše prohlásí: „[ROOT.Char.GetTitleTierName] už ví vše, co je třeba vědět.“ Poté [guru_or_chaplain.GetSheHe] odříká obvyklé pasáže k zakončení projevu a vrací se na své místo."
 devaraja.0003.desc.chaplain: "Občas se od [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] očekává, že v paláci pronese projev o konceptu #italic Dharmy#!. Obvykle jde o dlouhou událost, strukturovanou a plnou zpěvů a formalit, doprovázenou štědrým darem pro řečníka jako uznání za jeho úsilí. Dnes se však [guru_or_chaplain.GetName] zdá poněkud unavený.\n\nStojíc před královským publikem, [guru_or_chaplain.GetSheHe] jednoduše prohlásí: „[ROOT.Char.GetTitleTierName] už ví vše, co je třeba vědět.“ Poté [guru_or_chaplain.GetSheHe] odříká obvyklé pasáže k zakončení projevu a vrací se na své místo."
 devaraja.0003.a: "Ha, dobře! Dejte [guru_or_chaplain.GetHerHim] [Select_CString(guru_or_chaplain.IsFemale,'její','jeho')] oběť." # todo: NEW TRANSLATION
 devaraja.0003.b: "Chytré! Ale odměňuji jen snahu." # todo: NEW TRANSLATION
 devaraja.0003.c: "Neodměňuji lenost! Stráže, zajměte [guru_or_chaplain.GetHerHim]!" # todo: NEW TRANSLATION
 devaraja.0003.d: "Přivolejte [guru_or_chaplain.GetFirstNameNoTooltip] znovu — zeptám se #italic [guru_or_chaplain.GetHerHim]#! na #italic Dharmu#!." # todo: NEW TRANSLATION
 devaraja.0003.d.tt.success: "Imponujete [guru_or_chaplain.GetFirstNameNoTooltip] a vašim dvořanům svými znalostmi #italic Dharmy#!" # todo: NEW TRANSLATION
 devaraja.0003.d.tt.failure: "Ztrapníte se před [guru_or_chaplain.GetFirstNameNoTooltip] a svými dvořany, neprokážete porozumění #italic Dharmě#!" # todo: NEW TRANSLATION
 devaraja.0004.title: "Miluji průvod" # todo: NEW TRANSLATION
 devaraja.0004.desc: "Okres [capital_county.GetName] nese jizvy minulých bojů, roky byl zpustošen meči i bouřemi. Kromě hmotných zlepšení nám náleží udělat něco i pro povznesení ducha lidu.\n\nNebyl by to hezký obraz, mít v metropoli na konci období dešťů průvod lodí? Sedmdesát šest dudáků by mohlo hrát na vlajkové lodi, se sto deseti bubeníky těsně za nimi. A aby průvod byl pořádně ozdoben, můžeme požádat každý klášter, aby zaplatil výzdobu jedné lodi!" # todo: RETRANSLATED ENGLISH
 devaraja.0004.a: "Lidé pocítí nadšení, když lodě projedou!" # todo: NEW TRANSLATION
 devaraja.0004.b: "Požadovat nyní klášterům zlato není příznivé." # todo: NEW TRANSLATION
 devaraja.0004.b.tt: "Stažení se z tohoto nápadu nyní bude všimnuto" # todo: NEW TRANSLATION
 devaraja.0004.c: "Průvod proběhne — bez zapojení klášterů." # todo: NEW TRANSLATION
 devaraja_hosts_parade: "Devarajův velký průvod" # todo: NEW TRANSLATION
 devaraja.0005.title: "Zeď se dvěma tvářemi" # todo: NEW TRANSLATION
 devaraja.0005.desc: "Nové chrámy potřebují výzdobu, umění, které bude odrážet božské a vznešené. Abychom vyjádřili božský aspekt [ROOT.Char.Custom('GetAspectNoun')|U] našeho spravedlivého rodu, můžeme zajistit, že fresky a sochy na tomto novém místě budou zobrazovat vize bohů [ROOT.Char.Custom('GetAspectNoun')|U] — nebo vyobrazení rodu [ROOT.Char.GetHouse.GetName] a tím podpořit mou vlastní prestiž." # todo: RETRANSLATED ENGLISH
 devaraja.0005.a: "Toto místo bude zasvěceno bohům." # todo: NEW TRANSLATION
 devaraja.0005.b: "Toto místo bude zasvěceno mé slávě." # todo: NEW TRANSLATION
 devaraja.0006.title: "Moudrost pádla" # todo: NEW TRANSLATION
 devaraja.0006.desc.guru: "Můj [GetCourtPositionType('court_guru_court_position').GetName], [guru_or_chaplain.GetName], byl spatřen, jak vesluje malou loďkou v jezírkách kolem paláce. Při veselí s mými dvořany povolám veslujícího guru přes vodu. „Jsi můj [GetCourtPositionType('court_guru_court_position').GetNameNoTooltip]! Nemáš vůbec úctu k vysokému úřadu, který zastáváš? Jak můžeš veslovat vlastní loďku jako nějaký ubohý rybář?“\n\nPo chvíli ticha [guru_or_chaplain.GetFirstNameNoTooltip] odpoví: „Když [ROOT.Char.GetTitleTierName] země veřejně hřeší, [GetCourtPositionType('court_guru_court_position').GetNameNoTooltip] mohou veslovat své vlastní lodě.\" # todo: RETRANSLATED ENGLISH
 devaraja.0006.desc.chaplain: "Můj [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName], [guru_or_chaplain.GetName], byl spatřen, jak vesluje malou loďkou v jezírkách kolem paláce. Při veselí s mými dvořany povolám veslujícího duchovního přes vodu. „Jsi můj [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]! Nemáš vůbec úctu k vysokému úřadu, který zastáváš? Jak můžeš veslovat vlastní loďku jako nějaký ubohý rybář?“\n\nPo chvíli ticha [guru_or_chaplain.GetFirstNameNoTooltip] odpoví: „Když [ROOT.Char.GetTitleTierName] země veřejně hřeší, [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] mohou veslovat své vlastní lodě.\" # todo: RETRANSLATED ENGLISH
 devaraja.0006.a: "Možná bych se na veřejnosti měl chovat skromněji." # todo: NEW TRANSLATION
 devaraja.0006.b: "Zřejmé! Hody budou pokračovat tak dlouho, jak budu chtít." # todo: NEW TRANSLATION
 devaraja.0006.c: "To je urážka! Odejměte [guru_or_chaplain.GetFirstNameNoTooltip] [Select_CString(guru_or_chaplain.IsFemale,'její','jeho')] tituly." # todo: NEW TRANSLATION
 devaraja.0006.d: "Možná bych se měl úplně vzdát pití." # todo: NEW TRANSLATION
 devaraja.0007.title: "Jasná nejednoznačnost" # todo: NEW TRANSLATION
 devaraja.0007.desc: "#italic Devaraja#! je jemný pojem; jsem samozřejmě [ROOT.Char.GetTitleTierName], ale jsem také spojen s božstvím [ROOT.Char.Custom('GetAspectNoun')|U]. Jsem tentýž jako bůh? Ach, to je ta delikátní otázka, která vyžaduje nejednoznačnost, aby mi někdo mohl přisoudit božství a jiní zase království.\n\nNebo by to byla delikátní, nejasná otázka, kdyby mě nějaký rozvláčný panegyrista právě neoznačil za boha [ROOT.Char.Custom('GetAspectNoun')|U]. Dvořané se už navzájem hádají o tom, čím jsem — nezbývá než se k tomu vyjádřit." # todo: RETRANSLATED ENGLISH
 devaraja.0007.a: "Ano, moji služebníci — jsem pánem [ROOT.Char.Custom('GetAspectNoun')|U]." # todo: NEW TRANSLATION
 devaraja.0007.b: "Můj lidu! Já jen sloužím [ROOT.Char.Custom('GetAspectNoun')|U], nejsem jeho pán." # todo: NEW TRANSLATION
 devaraja.0007.c: "Lidskost a božství jsou ve mně sjednoceny v jedné mystické existenci." # todo: NEW TRANSLATION
 devaraja.0007.c.tt.success: "Formulujete kompromisní pojetí, které potěší dost lidí" # todo: NEW TRANSLATION
 devaraja.0007.c.tt.failure: "Váš pokus o teologickou argumentaci situaci jen zhoršil" # todo: NEW TRANSLATION
 devaraja_as_god: "Božský Devaraja" # todo: NEW TRANSLATION
 devaraja_as_king: "Královský Devaraja" # todo: NEW TRANSLATION
 devaraja_as_hypostatic_union: "Dvoupřirozený Devaraja" # todo: NEW TRANSLATION
 devaraja.0008.title: "Pověsti o obrácení na smrtelné posteli" # todo: NEW TRANSLATION
 devaraja.0008.desc: "[suzerains_missionary.GetNameNoTooltip], [suzerain.GetTitleTierName] [suzerain.GetFirstNamePossessiveNoTooltip] misionář(ka), téměř zakopne o [suzerains_missionary.GetHerselfHimself], když se [suzerains_missionary.GetSheHe] přibližuje.\n\n„Mám skvělou zprávu!“ zvolá [suzerains_missionary.GetSheHe]. „[Select_CString(ROOT.Char.IsFemale,'Prohrabávala','Prohrabával')] jsem se historií vaší rodiny a [Select_CString(ROOT.Char.IsFemale,'vyptávala','vyptával')] se nejstarších služebníků na vše, co si pamatují, a vypadá to, že váš předek, [deathbed_conversion_ancestor.GetName], se vlastně obrátil k [suzerain.GetFaith.GetName] těsně před [Select_CString(deathbed_conversion_ancestor.IsFemale,'její','jeho')] smrtí!“\n\n[suzerains_missionary.GetName] se na mě dívá se sotva zadrženým nadšením. „Jste blíž k [suzerain.GetFaith.HighGodName], než si myslíte!\" # todo: RETRANSLATED ENGLISH
 devaraja.0008.a: "[deathbed_conversion_ancestor.GetName] byl [suzerain.GetFaith.GetAdjective]? Můžu tomu uvěřit." # todo: NEW TRANSLATION
 devaraja.0008.a.tt.conversion: "[ROOT.Char.GetName] nyní tvrdí, že [Select_CString(ROOT.Char.IsFemale,'její','jeho')] předek [deathbed_conversion_ancestor.GetName] konvertoval ke [suzerain.GetFaith.GetName]" # todo: RETRANSLATED ENGLISH
 devaraja.0008.b: "[deathbed_conversion_ancestor.GetRelationToString( ROOT.Char )] [Select_CString(ROOT.Char.IsFemale,'zemřela','zemřel')] jako [deathbed_conversion_ancestor.GetFaith.GetAdherentName] a vždy bude takto [Select_CString(ROOT.Char.IsFemale,'vzpomínána','vzpomínán')]!" # todo: NEW TRANSLATION
 devaraja.0009.title: "Misionář bez mise" # todo: NEW TRANSLATION
 devaraja.0009.desc: "Moje příklonnost k [suzerain.GetFaith.GetName] připravila [suzerains_missionary.GetName] o dvůr, kterému by mohl kázat. Zatímco se [suzerains_missionary.GetSheHe] raduje z mé změny víry, je [Select_CString(suzerains_missionary.IsFemale,'zmítána','zmítán')] nejistotou ohledně [Select_CString(suzerains_missionary.IsFemale,'její','jeho')] budoucnosti." # todo: RETRANSLATED ENGLISH
 devaraja.0009.a: "[suzerains_missionary.GetName]! Přidej se ke mně jako můj nový [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]!" # todo: NEW TRANSLATION
 devaraja.0009.a.tt.missionary_now_chaplain: "[ROOT.Char.GetName] jmenoval vašeho misionáře [suzerains_missionary.GetName] svým novým [ROOT.Char.GetHerHis] [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]" # todo: NEW TRANSLATION
 devaraja.0009.b: "[suzerains_missionary.GetName], tvá práce zde je udělána — teď #italic odejdi#!." # todo: NEW TRANSLATION
 devaraja.0010.title: "Nejopuštěnější víra" # todo: NEW TRANSLATION
 devaraja.0010.desc: "[suzerains_missionary.GetName], dobrý [suzerains_missionary.GetFaith.GetAdherentName], upadá v zoufalství kvůli víře svého pána, která je [suzerain.GetFaith.GetAdjective]. [suzerains_missionary.GetSheHe|U] stojí na rozcestí; [Select_CString(suzerains_missionary.IsFemale,'její','jeho')] víra kolísá, zatímco [suzerains_missionary.GetSheHe] čeká na znamení. Zda to znamení přijde od vás, nebo od [suzerains_missionary.GetFaith.DivineRealm], je na vašem rozhodnutí." # todo: RETRANSLATED ENGLISH
 devaraja.0010.a: "[suzerains_missionary.GetName] učiní [Select_CString(suzerains_missionary.IsFemale,'její','jeho')] rozhodnutí v pravý čas." # todo: NEW TRANSLATION
 devaraja.0010.a.tt.unconverted: "[suzerains_missionary.GetName] zůstává skleslým [suzerains_missionary.GetFaith.GetAdherentName]" # todo: NEW TRANSLATION
 devaraja.0010.a.tt.converts: "[suzerains_missionary.GetName] přijímá [suzerain.GetNamePossessive] [suzerain.GetFaith.GetAdjective] víru" # todo: NEW TRANSLATION
 devaraja.0010.b: "Možná [suzerains_missionary.GetName] nalezne nové poslání v [ROOT.Char.GetFaith.GetName]?" # todo: NEW TRANSLATION
 devaraja.0010.b.tt.success: "[suzerains_missionary.GetName] konvertuje ke [ROOT.Char.GetFaith.GetName]" # todo: NEW TRANSLATION
 devaraja.0010.b.tt.failure: "[suzerains_missionary.GetName] zůstává neoblomným [suzerains_missionary.GetFaith.GetAdherentName]" # todo: NEW TRANSLATION
 fervor_gain_deathbed_conversion_discovered: "Objeveno obrácení na smrtelné posteli" # todo: NEW TRANSLATION
 fervor_gain_faith_reaffirmed: "Víra předka potvrzena" # todo: NEW TRANSLATION
