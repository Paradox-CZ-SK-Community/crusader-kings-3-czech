 tgp_east_asia_mandala_events.lose_all_tributaries.tt: "@alert_icon! #alert_trial Opustí tě všichni tví [Concept('tributaries','tributáři')|E]#!"
 mandala_liege_primary_title_succession_dissolution: "$liege_primary_title_dissolution$"
 mandala_liege_primary_title_succession_dissolution_desc: "Tvá vrchnost přišla o [Concept('primary_title','hlavní titul')|E], protože neuspěla ve zkouškách [Concept('mandala_succession','nástupnictví mandaly')|E]"
 tgp_east_asia_mandala_events.9000.t: "Božský zásah"
 tgp_east_asia_mandala_events.9000.desc.lightning_strike: "#EMP KŘÁÁÁCH#! — ten blesk opravdu udeřil zčistajasna. Ležím na zemi. Hlava se mi točí, ale jinak se mi skoro nic nestalo.\n\nLidé se kolem mě začínají shlukovat do malého půlkruhu. Někdo prohlašuje, že mě božstvo podrobilo zkoušce. Další hlas trvá na tom, že do mě teď svou podstatu #EMP vdechuje#! [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]."
 tgp_east_asia_mandala_events.9000.outro.diff_faith.lightning_strike: "\n\nOpodál stojí [Select_CString(bystander.IsFemale,'tichá žena','tichý muž')|l]. Poklidně se na mě zadívá a pronese: „Tak tedy [bystander.GetFaith.HighGodName] kráčí mezi námi...“"
 tgp_east_asia_mandala_events.9000.outro.lightning_strike: "\n\nOpodál stojí [Select_CString(bystander.IsFemale,'klidná žena','klidný muž')|l]. Poklidně se na mě zadívá a pronese: „Tak tedy [ROOT.Char.GetFaith.HighGodName] kráčí mezi námi...“"
 tgp_east_asia_mandala_events.9000.desc.scar: "„[ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')|U]!“ ozve se [bystander.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', bystander)|l], se zrudlou tváří. „Ta jizva! Na tvém rameni! To... vypadala vždycky takhle...?“ Na okamžik se zarazí a zjevně neví, co si počít. „Tu tvář znám! Přesně tak přece vypadá [bystander.GetFaith.HighGodName]!“\n\nNěkolikrát zamrkám. Po chvilce přemítání ze sebe [bystander.GetFirstName] s překvapivou silou vychrlí: „Vždyť ty, [bystander.Custom2('RelationToMe', ROOT.Char )|l], máš očividně požehnání! Ty máš překročit hranice tohoto světa!“\n\nRozruchu si teď všimnou sloužící i nedalecí prostí lidé. Prohlížejí si mě od hlavy k patě a souhlasně mumlají: „#EMP Jen se podívejte...#!“"
 tgp_east_asia_mandala_events.9000.a: "„#EMP Vždycky#! jsem se [Select_CString(ROOT.Char.IsFemale,'cítila','cítil')] trochu jinak...“"
 tgp_east_asia_mandala_events.9000.a.diff_faith: "„[bystander.GetFaith.HighGodName|U]? Co to znamená?“"
