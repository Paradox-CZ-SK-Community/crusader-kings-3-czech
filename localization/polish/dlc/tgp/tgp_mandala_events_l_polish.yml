l_polish:
 aspect_upgrade_event_header: "Aspekt [ROOT.Char.Custom('GetAspectNoun')|l]:"
 tgp_east_asia_mandala_events.1000.t: "$aspect_upgrade_event_header$ Vzestup"
 tgp_east_asia_mandala_events.1000.t.final: "$aspect_upgrade_event_header$ Transcendence"
 tgp_east_asia_mandala_events.1000.desc.02: "Za radostného veselí, tance a obřadů [ROOT.Char.Custom('GetAspectNoun')|l] jsem [Select_CString(ROOT.Char.IsFemale,'povznesla','povznesl')] svůj aspekt [ROOT.Char.Custom('GetAspectNoun')|l] na další stupeň a [Select_CString(ROOT.Char.IsFemale,'přinesla','přinesl')] tak čest rodu [ROOT.Char.GetHouse.GetBaseName].\n\nZvěsti o naší #EMP moci#! a božských činech k nám každým dnem přivádějí další stoupence.\n\nNa chvíli se oddávám tomu opojnému pocitu a kochám se pohledem na slavící zástup."
 tgp_east_asia_mandala_events.1000.desc.03.outro: "Opřu se a sleduji obřadní obětiny i vystoupení tanečníků na mou počest. #EMP Naše moc roste.#!"
 tgp_east_asia_mandala_events.1000.desc.creation_03: "Hostina na počest aspektu stvoření je rozkošnou podívanou plnou barev, tance a hudby. Oslavuje vzestup rodu [ROOT.Char.GetHouse.GetBaseName] na prostřední stupeň stvoření.\n\nČin za činem dokazujeme své božství a získáváme stále více stoupenců.\n\nOprava — #EMP já#! získávám stále více stoupenců. A oni věří ve #EMP mě#!."
 tgp_east_asia_mandala_events.1000.desc.creation_04: "Pořádně bujará hostina — jak jinak oslavit téměř dokonalý aspekt stvoření? Tanečníci, obřady, záblesky obnažené kůže; to vše ve jménu stvoření a dalšího vzestupu rodu [ROOT.Char.GetHouse.GetBaseName].\n\nDíky nesčetným věřícím jsme nezastavitelnou silou, která si ve světě bere své právoplatné místo.\n\nZ nedalekého stolu si vezmu něco lahodného, co nabízí [ROOT.Char.Custom('GetAspectNoun')|l], a při jídle si vychutnávám tu podívanou."
 tgp_east_asia_mandala_events.1000.desc.05.intro: "Pouť rodu [ROOT.Char.GetHouse.GetBaseName] a jeho božských potomků se konečně naplnila."
 tgp_east_asia_mandala_events.1000.desc.creation_05: "$tgp_east_asia_mandala_events.1000.desc.05.intro$\n\nNikdo už nepochybuje, že sestry a bratři rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip] nesou znamení aspektu stvoření a konají na zemi skutky stvořitele.\n\nA jeho živoucím ztělesněním jsem samozřejmě #EMP já#!.\n\nVypiji další pohár nápoje, kterému se zde říká [ROOT.Char.Custom('RegionalDrink')|l], a zahájím tím celé týdny oslav."
 tgp_east_asia_mandala_events.1000.desc.serenity_03: "Oslava je připravena s největší péčí. Na počest vzestupu rodu [ROOT.Char.GetHouse.GetBaseName] na prostřední stupeň aspektu klidu se nešetřilo na ničem.\n\nLidé poznávají, co jim naše cesta přináší, a příznivců našeho mírumilovného učení vytrvale přibývá.\n\nTěší mě, že mohu udělat svět lepším místem. Klidnějším místem."
 tgp_east_asia_mandala_events.1000.desc.serenity_04: "Velkolepá oslava začíná společnou meditací. Pohled na nesčetné hlavy pokorně skloněné v tichu mi rozezpívá srdce. Jak lépe uctít rod [ROOT.Char.GetHouse.GetBaseName], který už téměř dosáhl dokonalosti aspektu klidu?\n\nZástupy věřících dokládají naše místo ve světě. Touhu po míru a tichu. Po přijetí a shodě.\n\nZnovu skláním hlavu k tiché modlitbě a meditaci a přemítám o tom všem."
 tgp_east_asia_mandala_events.1000.desc.serenity_05: "$tgp_east_asia_mandala_events.1000.desc.05.intro$\n\nZ nepřátel se stali přátelé. Panstvím se šíří mír a blahobyt. Moudrost a klid, které sestry a bratři rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip] vštěpují svému lidu, navždy poznamenaly zemi [ROOT.Char.GetPrimaryTitle.GetBaseName].\n\nVpravdě poklidná oslava na počest skutečného ztělesnění aspektu klidu.\n\nNa jejich laskavé modlitby a přání všeho dobrého odpovím vlídným úklonem hlavy."
 tgp_east_asia_mandala_events.1000.desc.destruction_03: "Vojáci buší zbraněmi do štítů a ohlušujícím rachotem zvěstují vzestup rodu [ROOT.Char.GetHouse.GetBaseName] na prostřední stupeň aspektu zkázy.\n\nZvěsti o našem odkazu se rychle šíří a našich stoupenců je více než kdy dřív.\n\n$tgp_east_asia_mandala_events.1000.desc.03.outro$"
 tgp_east_asia_mandala_events.1000.desc.destruction_04: "#EMP DUP, DUP.#! Všechno přehlušuje hromové dupání vojáků země [ROOT.Char.GetPrimaryTitle.GetBaseName]. Při slavnostních obřadech napodobují tanec zkázy, neboť rod [ROOT.Char.GetHouse.GetBaseName] je na dosah úplné transcendence.\n\nNaši stoupenci se dychtivě přidávají k našemu poslání a touží sloužit pravému aspektu zkázy.\n\nS úšklebkem pozoruji obřad a jemně přejíždím brouskem po své čepeli.\n\n#EMP DUP, DUP.#!"
 tgp_east_asia_mandala_events.1000.desc.destruction_05: "$tgp_east_asia_mandala_events.1000.desc.05.intro$\n\nZdá se, že se chvěje samotná země. Zapřisáhlí vojáci země [ROOT.Char.GetPrimaryTitle.GetBaseName] děsivě dupou, zpívají a konají obřady ve službách sester a bratrů rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip].\n\nNa okamžik přede mnou, svým božstvem, pokleknou, než v obřadu pokračují.\n\nOpírám se o trůn a nepřítomně hladím lebku, kterou mi darovali při jednom z obřadů."
 tgp_east_asia_mandala_events.1000.desc.trickery_03: "[Select_CString(ROOT.Char.IsFemale,'Rozvinula','Rozvinul')|U] jsem odkaz rodu [ROOT.Char.GetHouse.GetBaseName] jako rodu zlomyslných božstev a obřadní oslavy jsou tomu úměrně veselé.\n\nNepřátelé rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip] jeden po druhém záhadně odpadají, nebo se přidávají k našim stoupencům.\n\n$tgp_east_asia_mandala_events.1000.desc.03.outro$"
 tgp_east_asia_mandala_events.1000.desc.trickery_04: "Obětiny, tolik obětin k usmíření rodu [ROOT.Char.GetHouse.GetBaseName], jehož členové už téměř dosáhli dokonalosti aspektu lstivosti.\n\nZlato, kožešiny, koření. Mušle, exotická zvířata. Naši stoupenci vědí, jak si nás naklonit. Anebo ne?\n\nO tom rozhodnu #EMP já#!. Svou síť stínů rozprostřu nad každým, kdo se mi postaví.\n\nTiše se uchechtnu."
 tgp_east_asia_mandala_events.1000.desc.trickery_05: "$tgp_east_asia_mandala_events.1000.desc.05.intro$\n\nNavenek se vše zdá slavnostní a spořádané, ale každý ví, že sebemenší přešlap či mravní poklesek může přivolat některé z nevyzpytatelných božstev rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip].\n\nVšichni se zoufale snaží udržet si naši božskou přízeň a dodržovat pravidla. #EMP Má#! pravidla.\n\nPřehlížím dav a lstivě přemítám, kdo si mou pozornost zaslouží příště."
 tgp_east_asia_mandala_events.1000.a: "Všechno je tak, jak má být."
 mandala_descendant_from_aspect_of_creation.tt: "Všechny tvé [Concept('children','děti')|E]"
 mandala_descendant_from_aspect_of_creation_modifier: "Potomek stvoření"
 mandala_descendant_from_aspect_of_creation_modifier_desc: "Tato postava je dítětem povzneseného aspektu stvoření."
 mandala_aspect_of_serenity_devotion.tt: "Získej #P [EmptyScope.ScriptValue('num_years_of_peace_devotion')]#! [Concept('piety_experience','oddanosti')|E] za každý rok bez útočné [Concept('war','války')|E] #WEAK (nyní #P [THIS.Char.MakeScope.ScriptValue('num_years_of_peace_devotion_payout')]#! [Concept('piety_experience','oddanosti')|E])#!"
 mandala_forged_from_aspect_of_destruction.tt: "Všichni tví [THIS.Char.Custom('KnightCulturePlural')|l]"
 mandala_forged_from_aspect_of_destruction_modifier: "Zocelení zkázou"
 mandala_forged_from_aspect_of_destruction_modifier_desc: "Tato postava sloužila jako rytíř povznesenému aspektu zkázy."
 mandala_aspect_of_trickery_devotion.tt: "Získej #P [EmptyScope.ScriptValue('num_years_of_peace_devotion')]#! [Concept('piety_experience','oddanosti')|E] za každou dosud úspěšně provedenou [Concept('scheme','intriku')|E] #WEAK (nyní #P [THIS.Char.MakeScope.ScriptValue('num_successful_schemes_devotion_payout')]#! [Concept('piety_experience','oddanosti')|E])#!"
 mandala_ascended_in_aspect_of_trickery_modifier: "Povznesený šibal"
 mandala_ascended_in_aspect_of_trickery_modifier_desc: "Tato postava dosáhla povznesení jako aspekt lstivosti."
 busy_in_mandala_succession: "Právě se účastníš nástupnictví [Concept('mandala','mandaly')|E]"
 mandala_succession_header: "Nástupnictví mandaly:"
 tgp_east_asia_mandala_events.8497.t.lose_by_default: "Zkoušky nástupnictví mandaly se neuskutečnily"
 tgp_east_asia_mandala_events.8497.tt.lose_by_default: "$tgp_east_asia_mandala_events.8499.a.tt.imprisoned$"
 tgp_east_asia_mandala_events.8499.t: "$mandala_succession_header$ Zkoušky"
 tgp_east_asia_mandala_events.8499.intro.imprisoned: "I hluboko do žalářů [ROOT.Char.GetImprisonedBy.Custom('CZ_TitledFirstName_G')] se ke mně donesla ta zpráva. [deceased_mandala_ruler.GetFirstName|U], [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )|l], [Select_CString(deceased_mandala_ruler.IsFemale,'opustila','opustil')] tento svět. Vést panství teď připadá mně."
 tgp_east_asia_mandala_events.8499.intro.recent_adult.imprisoned: "Konečně dospívám. Je čas podstoupit zkoušky a ukázat celému panství, že si zasloužím převzít vládu. [deceased_mandala_ruler.GetFirstName|U], [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )|l], má ve mně důstojné pokračování."
 tgp_east_asia_mandala_events.8499.desc.imprisoned: "\n\nJak to ale mám dokázat tady, v tomhle vězení, ačkoli mám k božství #EMP tak blízko#!? Všude samá špína a zacházejí se mnou jako se zvířetem.\n\nPřísahám, že až se odsud dostanu, pomstím se. #EMP Na mé nepřátele dopadne má odplata#!."
 tgp_east_asia_mandala_events.8499.desc.recent_adult: "Nastal čas! Konečně mám podstoupit zkoušky a převzít vládu. [deceased_mandala_ruler.GetFirstName|U], [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )|l], mi ji zanechává.\n\nMusím prokázat svou výjimečnost v každém ohledu. Mé výkony a jejich přijetí rozhodnou, nakolik mi budou stoupenci nadále důvěřovat jako aspektu [ROOT.Char.Custom('GetAspectNoun')|l].\n\n[Select_CString(deceased_mandala_ruler.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )|l] #EMP bude#! mít důstojné pokračování!"
 tgp_east_asia_mandala_events.8499.desc.was_traveling: "Sotva se za mnou usadil prach, už mě vedou do komnat. Připravují koupel a cestovní šat mění za oděv náležitý pro titul [ROOT.Char.GetTitleAsNameNoTooltip].\n\nZ hrubého zacházení a náhlého chladu mi naskakuje husí kůže. V duchu se připravuji na zkoušky, které mě čekají.\n\n[Select_CString(deceased_mandala_ruler.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )|l] musí mít důstojné pokračování. Teď mohu ukázat, že dokážu převzít vládu a ztělesnit aspekt [ROOT.Char.Custom('GetAspectNoun')|l]. Nastal čas."
 tgp_east_asia_mandala_events.8499.desc: "[deceased_mandala_ruler.GetFirstName|U], [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )|l], už není mezi námi. [Select_CString(deceased_mandala_ruler.IsFemale,'Opustila','Opustil')|U] tuto rovinu bytí. Je na mně, abych se [Select_CString(ROOT.Char.IsFemale,'chopila','chopil')] vlády, [Select_CString(ROOT.Char.IsFemale,'ztělesnila','ztělesnil')] aspekt [ROOT.Char.Custom('GetAspectNoun')|l] a [Select_CString(ROOT.Char.IsFemale,'vedla','vedl')] naše panství vstříc zápisu do dějin.\n\nPodstoupím zkoušky a svými výjimečnými schopnostmi v mnoha oblastech předvedu své božství a všudypřítomnost.\n\n... na okamžik pomyslím na opačný výsledek a po zádech mi přeběhne mráz."
 tgp_east_asia_mandala_events.8499.a: "Lépe už se připravit nemohu."
 tgp_east_asia_mandala_events.8499.a.imprisoned: "To přísahám."
 tgp_east_asia_mandala_events.8499.a.flavor.imprisoned: "Takhle to dopadnout nemělo..."
 tgp_east_asia_mandala_events.8499.a.tt.imprisoned: "Ve zkouškách [Concept('mandala_succession_succession','nástupnictví')|E] neuspěješ, protože se nedostavíš"
 tgp_east_asia_mandala_events.8499.a.tt.trials: "Začíná první zkouška [Concept('mandala_succession_succession','nástupnictví')|E]"
 mandala_divine_retribution_modifier: "Božská odplata"
 mandala_divine_retribution_modifier_desc: "Tato postava zasvěcuje svůj život porážce svých nepřátel."
 tgp_east_asia_mandala_events.8500.t: "$mandala_succession_header$ Kam se poděla hlava"
 tgp_east_asia_mandala_events.8500.desc: "Obřady stvoření na oslavu mého nástupu na trůn jsou v plném proudu. Procházím mezi lidmi a vlídně se usmívám na stoupence, kteří přinášejí obětiny.\n\nZ davu vyběhne malé dítě a bez okolků mě obejme kolem pasu. [Select_CString(dummy_gender.IsFemale,'Dívenka','Chlapec')|U] ke mně vzhlédne a zeptá se: „[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U]... co se #EMP vlastně#! stalo s tvou pátou hlavou?“\n\nDoprovázející opatrovník při té drzosti ztuhne hrůzou. Všimnu si však, že všichni v místnosti zbystřili a dychtivě čekají na mou odpověď."
 tgp_east_asia_mandala_events.8500.dynasty.override: "„To by ti měli umět povědět tví učitelé.“"
 tgp_east_asia_mandala_events.8500.a: "„Mé hříchy a závist ostatních, mé dítě.“"
 tgp_east_asia_mandala_events.8500.a.final_aspect: "Nejsi na poslední úrovni [Concept('aspect_of_creation','aspektu stvoření')|E]"
 tgp_east_asia_mandala_events.8500.success.tt: "Uspěješ ve zkoušce [Concept('mandala_succession_succession','nástupnictví')|E] zaměřené na [Concept('stewardship','správcovství')|E]"
 tgp_east_asia_mandala_events.8500.b: "„Ach, to ti povím...“"
 tgp_east_asia_mandala_events.8500.b.flavor: "Že to tak bylo, o tom přece #EMP skoro#! nepochybuji?"
 tgp_east_asia_mandala_events.8500.b.t.success: "Velmi přesvědčivé"
 tgp_east_asia_mandala_events.8500.b.tt.success: "Podaří se ti je přesvědčit"
 tgp_east_asia_mandala_events.8500.b.t.failure: "Bez valného dojmu"
 tgp_east_asia_mandala_events.8500.b.tt.failure: "Davem se rozlehne nevěřícné mumlání"
 tgp_east_asia_mandala_events.8510.t: "$mandala_succession_header$ Klidná hladina"
 tgp_east_asia_mandala_events.8510.desc: "Účastníci mého obřadu povznesení klečí v úhledných řadách a komnatou se nese tlumený zpěv. Zvolna procházím mezi nimi, tu a tam se zlehka dotknu čela a snažím se jim vštípit mír a klid.\n\nDo toho se venku [Select_CString(dummy_gender.IsFemale,'dvě ženy','dva muži')|l] hlasitě hádají o kus půdy.\n\nJejich povyk postupně obrátí pozornost všech přítomných ke mně. Dychtivě sledují, jak si s tím narušením pokoje poradím."
 tgp_east_asia_mandala_events.8510.dynasty.override: "„Tohle je posvátné místo. Ovládejte se.“"
 tgp_east_asia_mandala_events.8510.a: "„Rozdělíte se o půdu #EMP i#! o úrodu.“"
 tgp_east_asia_mandala_events.8510.a.final_aspect: "Nejsi na poslední úrovni [Concept('aspect_of_serenity','aspektu klidu')|E]"
 tgp_east_asia_mandala_events.8510.success.tt: "Uspěješ ve zkoušce [Concept('mandala_succession_succession','nástupnictví')|E] zaměřené na [Concept('diplomacy','diplomacii')|E]"
 tgp_east_asia_mandala_events.8510.b: "„Co kdybychom to vyřešili #EMP takhle#!...“"
 tgp_east_asia_mandala_events.8510.b.flavor: "Proč jsou lidé tak malicherní..."
 tgp_east_asia_mandala_events.8510.b.t.success: "$tgp_east_asia_mandala_events.8500.b.t.success$"
 tgp_east_asia_mandala_events.8510.b.tt.success: "$tgp_east_asia_mandala_events.8500.b.tt.success$"
 tgp_east_asia_mandala_events.8510.b.t.failure: "$tgp_east_asia_mandala_events.8500.b.t.failure$"
 tgp_east_asia_mandala_events.8510.b.tt.failure: "$tgp_east_asia_mandala_events.8500.b.tt.failure$"
 tgp_east_asia_mandala_events.8520.t: "$mandala_succession_header$ Tanec zkázy"
 tgp_east_asia_mandala_events.8520.desc: "V mém kopí se odráží mihotavé světlo pochodní a tichý dav napjatě hledí na mou tvář pomazanou popelem. Obklopuje mě moře květin a lastury vydávají hluboký, chvějivý tón.\n\nMám předvést kosmický tanec. Tanec zkázy, symbol božské dvojjedinosti. Zničit staré, aby nové mělo prostor vyrašit a růst.\n\nPřistupuji k válcovému kameni uprostřed prostranství a cítím, jak z něj sálá poklidný chlad."
 tgp_east_asia_mandala_events.8520.dynasty.override: "„K tomu jsem se [Select_CString(ROOT.Char.IsFemale,'narodila','narodil')]. Je to mé právo.“"
 tgp_east_asia_mandala_events.8520.a: "Tohle bych [Select_CString(ROOT.Char.IsFemale,'zvládla','zvládl')] i #EMP ve spánku#!!"
 tgp_east_asia_mandala_events.8520.a.final_aspect: "Nejsi na poslední úrovni [Concept('aspect_of_destruction','aspektu zkázy')|E]"
 tgp_east_asia_mandala_events.8520.success.tt: "Uspěješ ve zkoušce [Concept('mandala_succession_succession','nástupnictví')|E] zaměřené na [Concept('martial','válečnictví')|E]"
 tgp_east_asia_mandala_events.8520.b: "Dobrá, zkusme to..."
 tgp_east_asia_mandala_events.8520.b.flavor: "Raz, dva, ehm... do strany?"
 tgp_east_asia_mandala_events.8520.b.t.success: "$tgp_east_asia_mandala_events.8500.b.t.success$"
 tgp_east_asia_mandala_events.8520.b.tt.success: "$tgp_east_asia_mandala_events.8500.b.tt.success$"
 tgp_east_asia_mandala_events.8520.b.t.failure: "$tgp_east_asia_mandala_events.8500.b.t.failure$"
 tgp_east_asia_mandala_events.8520.b.tt.failure: "$tgp_east_asia_mandala_events.8500.b.tt.failure$"
 tgp_east_asia_mandala_events.8530.t: "$mandala_succession_header$ Pravdivé iluze"
 tgp_east_asia_mandala_events.8530.desc: "Celý ten dav se shromáždil kvůli mně. Aby se nechal okouzlit #EMP mnou#!. Ve skupinkách se vedou tlumené hovory. Kdesi zazní zvon a ohlásí, že nastal čas.\n\nVstoupím do kruhu vedle válcového kamene a položím dlaň na jeho hladký, chladný povrch.\n\nNespočet tváří, starých i mladých, ztichne a obrátí se ke mně. Odkašlu si a připravím se promluvit:"
 tgp_east_asia_mandala_events.8530.dynasty.override: "„Dovolte mi promluvit o těch, kdo tu byli přede mnou.“"
 tgp_east_asia_mandala_events.8530.a.final_aspect: "Nejsi na poslední úrovni [Concept('aspect_of_trickery','aspektu lstivosti')|E]"
 tgp_east_asia_mandala_events.8530.success.tt: "Uspěješ ve zkoušce [Concept('mandala_succession_succession','nástupnictví')|E] zaměřené na [Concept('intrigue','pletichářství')|E]"
 tgp_east_asia_mandala_events.8530.a: "„Dovolte mi povědět vám o iluzi dvojjedinosti.“"
 tgp_east_asia_mandala_events.8530.b: "„... co kdybych vám [Select_CString(ROOT.Char.IsFemale,'řekla','řekl')], že klam není #EMP skutečný#!?“"
 tgp_east_asia_mandala_events.8530.b.flavor: "Alespoň #EMP chci#!, aby si to mysleli."
 tgp_east_asia_mandala_events.8530.b.t.success: "$tgp_east_asia_mandala_events.8500.b.t.success$"
 tgp_east_asia_mandala_events.8530.b.tt.success: "$tgp_east_asia_mandala_events.8500.b.tt.success$"
 tgp_east_asia_mandala_events.8530.b.t.failure: "$tgp_east_asia_mandala_events.8500.b.t.failure$"
