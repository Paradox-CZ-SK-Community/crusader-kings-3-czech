 tgp_east_asia_mandala_events.8550.t: "$mandala_succession_header$ Cesta vpřed"
 tgp_east_asia_mandala_events.8550.t.failed: "$mandala_succession_header$ Slepá ulička"
 tgp_east_asia_mandala_events.8550.desc.critical_success: "Jásot, všude samý jásot. Dav je u vytržení. Nové božstvo se vyrovná tomu předešlému a úleva je přímo hmatatelná — [deceased_mandala_ruler.Custom('CZ_FirstNamePossessive_F')] božskost má důstojné pokračování.\n\nLidé po mně házejí květiny a zpívají, jiní nadšeně tleskají či dupou do podlahy. Spontánně se rozproudí malá hostina a stoupenci dlouho do noci provolávají mé jméno a připíjejí na mou počest.\n\n[Select_CString(ROOT.Char.IsFemale,'Obstála','Obstál')|U] jsem a budoucnost je světlá. Dovolím si nenápadný úsměv."
 tgp_east_asia_mandala_events.8550.desc.success: "Místností se šíří tichý šepot. Postupně sílí v šum a tu a tam přejde v upřímný jásot. [Select_CString(ROOT.Char.IsFemale,'Prokázala','Prokázal')|U] jsem, že mé božství začíná klíčit.\n\n[Select_CString(deceased_mandala_ruler.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )|l] sice ve mně ještě nemá rovnocenné pokračování — [deceased_mandala_ruler.Custom('CZ_FirstNamePossessive_F')] božskost zůstává nedostižná — ale [Select_CString(ROOT.Char.IsFemale,'ukázala','ukázal')] jsem stoupencům, že nás umím vyvést i ze svízelných situací, které mohu ovlivnit jen zčásti, nebo vůbec.\n\nProstor k růstu tu rozhodně je. Těším se, až se znovu osvědčím."
 tgp_east_asia_mandala_events.8550.desc: "Komnata se naplní mumláním skupinek služebnictva a dvořanů, které jsem vždy [Select_CString(ROOT.Char.IsFemale,'považovala','považoval')] za přátele a věrné poddané. Podezíravě si mě prohlížejí. Mé božství se totiž #EMP nevyrovná#! tomu, jímž se [Select_CString(deceased_mandala_ruler.IsFemale,'pyšnila','pyšnil')] [deceased_mandala_ruler.GetFirstName], [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )|l].\n\nTrochu skloním hlavu a na okamžik mě sevře strach z toho, co přijde. Pak si uvědomím, jak to asi působí. Narovnám se a vzdorně se zadívám do očí každé šeptající skupince.\n\nBudu muset znovu získat spoustu důvěry. Cesta vpřed bude #EMP trnitá#!."
 tgp_east_asia_mandala_events.8550.desc.failed: "Jakmile si uvědomím, k čemu se schyluje, roztřesou se mi kolena a zatočí hlava. [Select_CString(ROOT.Char.IsFemale,'Zklamala','Zklamal')|U] jsem [deceased_mandala_ruler.Custom('CZ_FirstName_A')] i celé panství.\n\nNezasloužím si převzít vládu nad [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedName_I')]. Není na čem stavět.\n\nNa chvíli se mi vyjasní mysl. Rozhlédnu se a zjistím, že všichni už odešli, nebo právě odcházejí. Odvrácená záda, zklamané mumlání a nesouhlasné mručení. Klesnu na kolena a nechám tíhu světa, aby mě na okamžik srazila k zemi."
 tgp_east_asia_mandala_events.8550.a: "Jsem [Select_CString(ROOT.Char.IsFemale,'připravena','připraven')]."
 tgp_east_asia_mandala_events.8550.a.failed: "Takhle to dopadnout nemělo!"
 tgp_east_asia_mandala_events.8550.a.failed.tt: "Tvá neschopnost způsobila rozpad [Concept('realm','panství')|E]"
