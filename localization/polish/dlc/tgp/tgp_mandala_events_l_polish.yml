l_polish:
 aspect_upgrade_event_header: "Aspekt [ROOT.Char.Custom('GetAspectNoun')|U]:" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.1000.t: "$aspect_upgrade_event_header$ Vzestup" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.1000.t.final: "$aspect_upgrade_event_header$ Přesah" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.1000.desc.02: "Při takové radosti, tanci a ritech [ROOT.Char.Custom('GetAspectNoun')] jsem přinesl hrdost rodu [ROOT.Char.GetHouse.GetBaseName] tím, že jsem [Select_CString(ROOT.Char.IsFemale,'vystoupila','vystoupil')] na další stupeň aspektu [ROOT.Char.Custom('GetAspectNoun')].\n\nHřmění našich #EMP sil#! a božským činům podobné akty přitahují den za dnem více následovníků.\n\nDopřávám si na chvíli toto potěšení a pozoruji před sebou představení oslavujících." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.1000.desc.03.outro: "Zakloním se a sleduji, jak symbolické oběti a baviči tančí na mou počest. #EMP Naše moc roste.#!" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.1000.desc.creation_03: "Na počest aspektu stvoření se pořádá hostina — rozkošné představení barev, tance a hudby — jako oslava vzestupu rodu [ROOT.Char.GetHouse.GetBaseName] na mezistupeň stvoření.\n\nDůkazem naší božskosti, čin za činem, shromažďujeme bohatství následovníků.\n\nOprava — #EMP Já#! shromažďuji bohatství následovníků. A oni věří v #EMP mě#!." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.1000.desc.creation_04: "Velmi bouřlivá hostina — jak jinak oslavit téměř bezchybný aspekt stvoření? Tanečníci, rituály, záblesky nahoty, oslavující stvoření a další vzestup rodu [ROOT.Char.GetHouse.GetBaseName].\n\nObrovské množství věřících nás pevně upevňuje jako nezastavitelnou sílu, nárokující si své místo ve světě.\n\nPopadnu kousky lahodného [ROOT.Char.Custom('GetAspectNoun')] z blízkého stolu a zakousnu se, zatímco si užívám představení." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.1000.desc.05.intro: "Konečně je cesta rodu [ROOT.Char.GetHouse.GetBaseName] a jeho božských potomků dovršena." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.1000.desc.creation_05: "$tgp_east_asia_mandala_events.1000.desc.05.intro$\n\nNyní nikdo nepochybuje, že sestry a bratři rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip] nesou znaky a projevy aspektu stvoření, přinášející činy Stvořitele na zem.\n\nSamozřejmě s #EMP mnou#! jako [ROOT.Char.GetHerHis|U] gestaltem.\n\nVypiji další pohár [ROOT.Char.Custom('RegionalDrink')], čímž zahajujeme týdny oslav." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.1000.desc.serenity_03: "Oslava organizovaná s nejvyšší péčí; rod [ROOT.Char.GetHouse.GetBaseName] při vzestupu na mezistupeň aspektu klidu nešetřil náklady.\n\nNásledovníci našich mírumilovných cest neustále přibývají, protože lidé vidí výhody našich způsobů.\n\nVážím si příležitosti udělat tento svět lepším místem. Klidnějším místem." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.1000.desc.serenity_04: "Nádherná oslava začínající společnou meditací — obrovské množství hlav skloněných v tichosti mi skutečně rozechvívá srdce. Jak jinak uctít rod [ROOT.Char.GetHouse.GetBaseName], který je na pokraji bezchybných aspektů klidu?\n\nToto obrovské množství věřících potvrzuje naše místo ve světě. Touha po míru a tichu. Po přijetí a souhlasu.\n\nZnovu skláním hlavu v tiché modlitbě a meditaci a přemítám o tom." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.1000.desc.serenity_05: "$tgp_east_asia_mandala_events.1000.desc.05.intro$\n\nNepřátelé se stali přáteli. Mír a prosperita prostupují říší. Moudrost a klid, které vnesly sestry a bratři rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip], zanechaly trvalou stopu na [ROOT.Char.GetPrimaryTitle.GetBaseName].\n\nOpravdu poklidná oslava, pro skutečný gestalt aspektu klidu.\n\nLaskavě skláním hlavu na jejich elegantní modlitby a přání všeho dobrého." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.1000.desc.destruction_03: "Ohlušující hluk, když vojáci buší zbraněmi do štítů, upoutávající pozornost na vzestup rodu [ROOT.Char.GetHouse.GetBaseName] na mezistupeň aspektu zkázy.\n\nZpráva o našem odkazu se rychle šíří a počet našich následovníků je větší než dříve.\n\n$tgp_east_asia_mandala_events.1000.desc.03.outro$" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.1000.desc.destruction_04: "#EMP DUP, DUP.#! Neslyší se žádný zvuk kromě hromového dupání vojáků [ROOT.Char.GetPrimaryTitle.GetBaseName], kteří provádějí své slavnostní obřady, napodobující tanec zkázy, protože rod [ROOT.Char.GetHouse.GetBaseName] je tak blízko k úplnému přesahu.\n\nNaši následovníci se dychtivě přidávají k naší věci a slouží pod pravým aspektem zkázy.\n\nUšklíbnu se a opatrně hladím svou čepel o brousek, zatímco sleduji obřad.\n\n#EMP DUP, DUP.#!" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.1000.desc.destruction_05: "$tgp_east_asia_mandala_events.1000.desc.05.intro$\n\nZemě se zdá chvět a třást, když přísahou vázaní vojáci [ROOT.Char.GetPrimaryTitle.GetBaseName] provádějí své děsivé dupání, zpěvy a rituály ve službě sestrám a bratrům rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip].\n\nKrátce přede mnou poklekají, svému bohu, než pokračují v obřadu.\n\nNepozorně hladím lebku, darovanou mi při jednom z rituálů, zatímco se opírám o svůj trůn." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.1000.desc.trickery_03: "Úspěšně jsem rozšířil odkaz rodu [ROOT.Char.GetHouse.GetBaseName] na rošťácké božstva a rituální oslavy jsou patřičně radostné.\n\nJeden po druhém nepřátelé rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip] záhadně ustupují nebo se k nám přidávají jako následovníci.\n\n$tgp_east_asia_mandala_events.1000.desc.03.outro$" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.1000.desc.trickery_04: "Oběti, tolik obětí k urovnání rodu [ROOT.Char.GetHouse.GetBaseName], který nyní balancuje na pokraji toho, aby se stal bezchybným aspektem lstivosti.\n\nZlato, kožešiny, koření. Lastury, exotická zvířata. Naši následovníci vědí, jak nás uctít. Nebo snad ne?\n\nO tom rozhodnu #EMP já#!, roztáhnu svou síť stínů nad každým, kdo se mi postaví.\n\nTiše se uchechtám." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.1000.desc.trickery_05: "$tgp_east_asia_mandala_events.1000.desc.05.intro$\n\nNa povrchu vše vypadá slavnostně a obyčejně, ale všichni vnímají, že sebemenší pochybení nebo morální závada by mohla znamenat návštěvu jednoho z nepředvídatelných božstev rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip].\n\nVšichni zoufale usilují o udržení naší božské přízně a zůstávat v řadě. #EMP Moje#! řada.\n\nNakukuji na dav, lstivě přemýšlejíc, koho dalšího prohlásit hodným své pozornosti." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.1000.a: "Vše je tak, jak má být." # todo: NEW TRANSLATION
 mandala_descendant_from_aspect_of_creation.tt: "Všichni vaši [children|E]" # todo: NEW TRANSLATION
 mandala_descendant_from_aspect_of_creation_modifier: "Potomek stvoření" # todo: NEW TRANSLATION
 mandala_descendant_from_aspect_of_creation_modifier_desc: "Tato postava je dítětem vzestoupeného aspektu stvoření." # todo: NEW TRANSLATION
 mandala_aspect_of_serenity_devotion.tt: "Získej #P [EmptyScope.ScriptValue('num_years_of_peace_devotion')]#! [piety_experience|E] za rok neútočné [war|E] #WEAK (Aktuálně #P [THIS.Char.MakeScope.ScriptValue('num_years_of_peace_devotion_payout')]#! [piety_experience|E])#!" # todo: NEW TRANSLATION
 mandala_forged_from_aspect_of_destruction.tt: "Všichni vaši [THIS.Char.Custom('KnightCulturePlural')]" # todo: NEW TRANSLATION
 mandala_forged_from_aspect_of_destruction_modifier: "Kovaný ze zkázy" # todo: NEW TRANSLATION
 mandala_forged_from_aspect_of_destruction_modifier_desc: "Tato postava sloužila jako rytíř pod vzestoupeným aspektem zkázy." # todo: NEW TRANSLATION
 mandala_aspect_of_trickery_devotion.tt: "Získej #P [EmptyScope.ScriptValue('num_years_of_peace_devotion')]#! [piety_experience|E] za každé úspěšné [scheme|E] dosud #WEAK (Aktuálně #P [THIS.Char.MakeScope.ScriptValue('num_successful_schemes_devotion_payout')]#! [piety_experience|E])#!" # todo: NEW TRANSLATION
 mandala_ascended_in_aspect_of_trickery_modifier: "Vzestoupený šibal" # todo: NEW TRANSLATION
 mandala_ascended_in_aspect_of_trickery_modifier_desc: "Tato postava vzestoupila jako aspekt lstivosti." # todo: NEW TRANSLATION
 busy_in_mandala_succession: "V současnosti se věnujete [mandala|E] následnictví" # todo: NEW TRANSLATION
 mandala_succession_header: "Následnictví mandaly:" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8497.t.lose_by_default: "Zkoušky následnictví mandaly se nepodařilo uskutečnit" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8497.tt.lose_by_default: "$tgp_east_asia_mandala_events.8499.a.tt.imprisoned$" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8499.t: "$mandala_succession_header$ Zkoušky" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8499.intro.imprisoned: "Zpráva ke mně dolehla, hluboko v žalářích [ROOT.Char.GetImprisonedBy.GetTitledFirstName]. Můj [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )], [deceased_mandala_ruler.GetFirstName], opustil tento svět a nechal mě, abych převzal vládu nad říší." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8499.intro.recent_adult.imprisoned: "Konečně dosahuji dospělosti; nastal můj čas podstoupit zkoušky a ukázat říši, jak hoden jsem, abych nastoupil po mém [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )], [deceased_mandala_ruler.GetFirstName]." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8499.desc.imprisoned: "\n\nAle jak mám něco takového dokázat, když sedím tady, v tomhle vězení, být #EMP téměř božský#?! Pokrytý špínou, zachází se se mnou jako se zvířetem.\n\nPřísahám, že si odplatím, až se odsud dostanu. Nechám #EMP svou pomstu spadnout na své nepřátele#!." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8499.desc.recent_adult: "Nastal čas! Konečně je můj čas nastoupit po mém [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )], [deceased_mandala_ruler.GetFirstName], účastí na zkouškách.\n\nProkázáním své dokonalosti v každé oblasti určí mé výkony a přijetí, kolik víry budou mít moji následovníci ve mně jako v aspektu [ROOT.Char.Custom('GetAspectNoun')] do budoucna.\n\nJá #EMP uspěju#! jako nástupce mého [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )]!" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8499.desc.was_traveling: "Stěží se prach usadil, a už mě vnášejí do komnat — koupele připravené, oděvy vyměněné za ty odpovídající [ROOT.Char.GetTitleAsNameNoTooltip].\n\nZježený po hrubém zacházení a náhlém chladném vzduchu se duševně připravuji na zkoušky, které mě čekají.\n\nJe to má příležitost ukázat, že jsem hodným nástupcem mého [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )] a ztělesnit aspekt [ROOT.Char.Custom('GetAspectNoun')]. Je čas." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8499.desc: "Můj [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )], [deceased_mandala_ruler.GetFirstName], už není mezi námi. [Select_CString(deceased_mandala_ruler.IsFemale,'Vystoupila','Vystoupil')] z této roviny existence, a tak je na mně, abych [Select_CString(ROOT.Char.IsFemale,'vystoupila','vystoupil')], kanáloval aspekt [ROOT.Char.Custom('GetAspectNoun')] a vedl naši říši a zapsal ji do annálů dějin.\n\nPodstoupím zkoušky a ukážu, jak božský a všudypřítomný jsem tím, že vyniknu v mnoha aspektech.\n\n... mráz mi přeběhne po zádech, když na okamžik uvažuji o alternativě." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8499.a: "Jsem připraven, jak jen mohu být." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8499.a.imprisoned: "To přísahám." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8499.a.flavor.imprisoned: "Takto to nemělo dopadnout..." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8499.a.tt.imprisoned: "Selžete ve zkouškách [mandala_succession_succession|E], protože se nedostavíte" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8499.a.tt.trials: "Začíná první zkouška [mandala_succession_succession|E]" # todo: NEW TRANSLATION
 mandala_divine_retribution_modifier: "Božská pomsta" # todo: NEW TRANSLATION
 mandala_divine_retribution_modifier_desc: "Tato postava zasvětila svůj život porážce svých nepřátel." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8500.t: "$mandala_succession_header$ Ztráta hlavy" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8500.desc: "Jsme uprostřed rituálů stvoření, slavíme mé nastoupení na trůn. Míchám se s davem, vlídně se usmívám na své stoupence, když přistupují s dary.\n\nMalé dítě vystoupí z davu a bez rozmyslu obtočí kolem mého pasu [dummy_gender.GetHerHis] paže. [dummy_gender.Custom('GirlBoy')] se pak podívá na mě a zeptá se: „[ROOT.Char.GetTitleAsNameNoTooltip|U]... co se #EMP stalo#! s tvou pátou hlavou?“\n\n[dummy_gender.GetHerHis|U] opatrovník vypadá vyděšeně kvůli té drzosti, ale všimnu si, že všichni v komnatě napjatě čekají mou odpověď." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8500.dynasty.override: "„Tví učitelé by ti to měli vysvětlit.“" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8500.a: "„Mé hříchy a závist druhých, mé dítě.“" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8500.a.final_aspect: "Nejsi na konečné úrovni [aspect_of_creation|E]" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8500.success.tt: "Úspěšně projdete [stewardship|E] zkouškou [mandala_succession_succession|E]" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8500.b: "„Ach, nech mě ti to říct...“„" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8500.b.flavor: "Jsem si #EMP docela#! jistý, že to tak bylo?" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8500.b.t.success: "Velmi přesvědčivé" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8500.b.tt.success: "Podaří se ti je přesvědčit" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8500.b.t.failure: "Neohromeno" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8500.b.tt.failure: "Z davu se ozve šepot nedůvěry" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8510.t: "$mandala_succession_header$ Poklidný jako rybník" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8510.desc: "Účastníci klečí v pravidelných řadách a v komnatě se nese tichý zpěv během mého obřadu vzestoupení. Jemně obcházím, lehce sahám na několika čelech a snažím se vštípit pokoj a klid.\n\nV mezidobí se venku dva [dummy_gender.GetWomenMen] hlasitě hádají o kus půdy.\n\nJejich řev způsobí, že se místnost pomalu obrací ke mně, napjatě sledují, jak se vypořádám s tímto narušením klidu." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8510.dynasty.override: "„Toto je posvátné místo, uklidněte se.“" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8510.a: "„Sdílejte půdu #EMP a#! sdílejte výnos.“" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8510.a.final_aspect: "Nejsi na konečné úrovni [aspect_of_serenity|E]" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8510.success.tt: "Úspěšně projdete [diplomacy|E] zkouškou [mandala_succession_succession|E]" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8510.b: "„Co kdybychom to #EMP takhle#! vyřešili...“„" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8510.b.flavor: "Proč jsou lidi tak malicherní..." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8510.b.t.success: "$tgp_east_asia_mandala_events.8500.b.t.success$" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8510.b.tt.success: "$tgp_east_asia_mandala_events.8500.b.tt.success$" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8510.b.t.failure: "$tgp_east_asia_mandala_events.8500.b.t.failure$" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8510.b.tt.failure: "$tgp_east_asia_mandala_events.8500.b.tt.failure$" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8520.t: "$mandala_succession_header$ Tanec zničení" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8520.desc: "Má kopí zachytí mihotavé světlo pochodní a tichý dav napjatě sleduje mou obličej potřísněnou popelem. Moře květin mě obklopuje a mušle vydávají nízké vibrující tóny.\n\nOčekává se, že provedu kosmický tanec; tanec zničení, symbolizující božskou dualitu. Zničení starého, vytvoření prostoru pro nové, aby vyrostlo a rozkvetlo.\n\nVystoupám k válcovému kameni uprostřed prostranství a cítím jeho klidný chlad pod dotykem." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8520.dynasty.override: "„K tomu jsem se narodil, je to mé právo.“" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8520.a: "Tohle bych zvládl i #EMP ve spánku#!!" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8520.a.final_aspect: "Nejsi na konečné úrovni [aspect_of_destruction|E]" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8520.success.tt: "Úspěšně projdete [martial|E] zkouškou [mandala_succession_succession|E]" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8520.b: "Dobře, pojďme to zkusit..." # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8520.b.flavor: "Jedna, dvě, ehm... stranou?" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8520.b.t.success: "$tgp_east_asia_mandala_events.8500.b.t.success$" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8520.b.tt.success: "$tgp_east_asia_mandala_events.8500.b.tt.success$" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8520.b.t.failure: "$tgp_east_asia_mandala_events.8500.b.t.failure$" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8520.b.tt.failure: "$tgp_east_asia_mandala_events.8500.b.tt.failure$" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8530.t: "$mandala_succession_header$ Skutečné iluze" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8530.desc: "Dav se sem shromáždil, aby mě viděl. Aby byl okouzlen #EMP mnou#.! Skupiny vedou tlumené rozhovory a někde se rozezní zvon, oznamující, že nastal čas.\n\nVstoupím do kruhu vedle válcového kamene a položím dlaň na jeho hladký, chladný povrch.\n\nMnoho tváří, starých i mladých, ztichne a obrátí se ke mně, když si odkašlu a připravím svůj projev:" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8530.dynasty.override: "„Dovolte mi mluvit o těch, kteří byli přede mnou.“" # todo: NEW TRANSLATION
 tgp_east_asia_mandala_events.8530.a.final_aspect: "Nejsi na konečné úrovni [aspect_of_trickery|E]" # todo: NEW TRANSLATION
