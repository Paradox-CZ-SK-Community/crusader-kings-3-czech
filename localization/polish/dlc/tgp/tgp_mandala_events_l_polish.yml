 maximum_devotion_reached_msg_desc: "[Concept('maximum_piety_level','Nejvyšší úroveň oddanosti')|EU] byla dosažena.\nAby mohl tvůj [Concept('heir','dědic')|E] z [Concept('close_family','blízké rodiny')|E] postoupit ještě výše, postarej se, ať tvá [Concept('character_death_death','smrt')|E] odpovídá tvému [Concept('aspect','aspektu')|E]."
