l_polish:
 mandala_capital_sacked_modifier: "Vypleněné hlavní město mandaly"
 mandala_capital_sacked_modifier_desc: "Hlavní město této [Concept('mandala','mandaly')|E] nedávno zpustošil vládce jiné mandaly."
 mandala_capital_restored_modifier: "Obnovené hlavní město mandaly"
 mandala_capital_restored_modifier_desc: "Hlavní město této [Concept('mandala','mandaly')|E] bylo nedávno velkolepým způsobem obnoveno do své někdejší slávy."
 budding_divinity_modifier: "Rodící se božství"
 budding_divinity_modifier_desc: "Tato postava patří k [Concept('house','rodu')|E], jehož božská pověst teprve vzniká a dosahuje postavení [GetModifier( 'piety_level_6' ).GetNameWithTooltip|L]."
 budding_deity_modifier: "Cesta k božství"
 budding_deity_modifier_desc: "Kolem této postavy postupně vznikají mýty a pověsti, podle nichž dosahuje postavení [GetModifier( 'piety_level_7' ).GetNameWithTooltip|L]."
 budding_godhood_modifier: "Vznešená oddanost"
 budding_godhood_modifier_desc: "Podle pověstí tato postava skutečně dosáhla postavení [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]."
 disbelieved_mandala_modifier: "Zpochybněná mandala"
 disbelieved_mandala_modifier_desc: "Božské postavení této postavy bylo zpochybněno, což mezi jejími poddanými a následovníky vyvolalo pochybnosti o její božské podstatě."
 betrayed_tributary_modifier: "Zrada tributáře"
 betrayed_tributary_modifier_desc: "Tato postava nečinně přihlížela, jak bývalý suzerén napadl tributáře, kterého chtěla získat pod svou nadvládu."
 recently_tarnished_mandala_modifier: "Poskvrněná mandala"
 recently_tarnished_mandala_modifier_desc: "Tato postava nedávno prohrála válku vyvolanou tyranií, čímž utrpěla její [Concept('radiance','záře')|E]."
 mandala_broke_truce_modifier: "Věrolomná mandala"
 mandala_broke_truce_modifier_desc: "Tato postava nedávno porušila příměří s tributářem, kterého předtím propustila ze své podřízenosti."
 tgp_sea_legacy_heir_modifier: "Požehnaný dědic"
 tgp_sea_legacy_heir_modifier_desc: "Tato postava pochází z dlouhé linie božských vládců a těší se větší úctě a posvátné vážnosti než obyčejní světští panovníci."
