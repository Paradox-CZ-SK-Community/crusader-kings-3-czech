l_polish:
 disbelieve_mandala_ongoing.0001.t: "$disbelieve_mandala$: Žádné zázraky"
 disbelieve_mandala_ongoing.0001.desc: "V hluboké noci za mnou přichází [agent.GetName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))], a šeptem mi předkládá ďábelský plán.\n\n„Na tržištích i chrámových nádvořích. Jeden kupec tady, jeden sluha tam. Každý bude nenápadně šířit stejné zvěsti o [target.Custom('CZ_TitledFirstName_L')].“\n\n„Budou vyprávět, že zázrak na řece nebyl ničím jiným než hrou proudu a světla luceren. Že žebráka, který byl údajně uzdraven, kdosi viděl přijímat mince od kolemjdoucího dvořana.“"
 disbelieve_mandala_ongoing.0001.a: "„Skvělý plán, [agent.Custom('CZ_FirstNameNoTooltip_V')]!“"
 disbelieve_mandala_ongoing.0001.a.crit_success: "Zázraky jsou považovány za tvé dílo"
 disbelieve_mandala_ongoing.0001.a.success: "Šíří se zvěsti, že zázraky byly falešné"
 disbelieve_mandala_ongoing.0001.a.failure: "Tvůj agent byl odhalen"
 disbelieve_mandala_ongoing.0001.a.failure.breach: "#alert_trial @alert_icon! [my_scheme.GetName|U] získává #V 1#! [Concept('scheme_breach','narušení intriky')|E]#!"
 disbelieve_mandala_ongoing.0001.b: "Za to riziko to nestojí."
 scheme_fake_miracles: "Falešné zázraky"
 scheme_fake_miracles_desc: "Údajné zázraky tvého cíle jsou považovány za pouhé náhody."
 disbelieve_mandala_ongoing.0010.t: "$disbelieve_mandala$: Všechno jen podvrh"
 disbelieve_mandala_ongoing.0010.desc: "„Mohli bychom podstrčit relikvii,“ navrhuje [spymaster.GetName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spymaster'))], poté, co trvá na tom, abychom se sešli v pracovně.\n\n„Falešnou, pečlivě zhotovenou napodobeninu, kterou umístíme do svatyně [target.Custom('CZ_TitledFirstName_G')]. Necháme ji #EMP objevit#! a později odhalíme jako podvrh. Lid začne pochybovat o zázracích, duchovní si budou šeptat a posvátná aura [target.Custom('CZ_TitledFirstName_G')] se rozplyne.“"
 disbelieve_mandala_ongoing.0010.a: "„Ten #EMP [fake_relic.GetNameNoTooltip]#! vypadá téměř jako pravý.“"
 disbelieve_mandala_ongoing.0010.a.success: "Spiknutí bylo úspěšné"
 disbelieve_mandala_ongoing.0010.a.failure: "Tvůj spolčenec byl odhalen"
 disbelieve_mandala_ongoing.0010.b: "[target.GetTitledFirstNameNoTooltip|U] není [Select_CString(target.IsFemale,'žádná hlupačka','žádný hlupák')]."
 rival_planted_fake_artifact: "[CHARACTER.GetShortUIName|U] se [Select_CString(CHARACTER.IsFemale,'pokusila','pokusil')] podstrčit falešnou relikvii na dvůr, který patří [TARGET_CHARACTER.Custom('CZ_ShortUIName_D')]."
 rival_planted_fake_artifact_corresponding: "$rival_planted_fake_artifact$"
 scheme_critical_moments.1212.t: "[scheme.GetNameNoTooltip|U]: Úspěch"
 scheme_critical_moments.1212.desc: "Dostatek trhlin dokáže rozbít cokoli.\n\nMé úsilí zasít pochybnosti o božské podstatě [target.Custom('CZ_TitledFirstName_G')] konečně přineslo ovoce. Dnes už se sotva někdo zmíní o [target.Custom('CZ_TitledFirstName_L')], aniž by alespoň jeden z přítomných zapochyboval, nakolik jsou šířící se zvěsti pravdivé. Zvěsti o [Select_CString(target.IsFemale,'jejích','jeho')] podlých činech. O rozporech a přešlapech, které odhalují [Select_CString(target.IsFemale,'její','jeho')] neschopnost."
 scheme_critical_moments.1212.desc_discovered: "\n\nI kdyby [target.GetFirstNameNoTooltip] [Select_CString(target.IsFemale,'věděla','věděl')], že za tím stojím já, na tom už nezáleží! Brzy celý svět pozná jediného pravého dévarádžu. Mě!"
 scheme_critical_moments.1212.desc_secret: "\n\n[target.GetFirstNameNoTooltip|U] nedokáže pochopit, proč [Select_CString(target.IsFemale,'ji','ho')] ostatní tolik nenávidí, a o mé účasti nemá ani tušení!"
 scheme_critical_moments.1212.a: "Bylo to správné rozhodnutí."
 scheme_critical_moments.1213.t: "[scheme.GetNameNoTooltip|U]: Neúspěch"
 scheme_critical_moments.1213.desc: "Nic. Měsíce plánování a intrik, šíření pomluv a uplácení, a přesto víra v božskou podstatu [target.Custom('CZ_TitledFirstName_G')] zůstává stejně neotřesitelná jako dřív!"
 scheme_critical_moments.1213.desc_discovered: "\n\nA aby toho nebylo málo, nejenže jsem [Select_CString(ROOT.Char.IsFemale,'promarnila','promarnil')] čas a prostředky, ale [target.GetFirstNameNoTooltip] se navíc [Select_CString(target.IsFemale,'dozvěděla','dozvěděl')] o mých nešikovně provedených zákeřnostech!"
 scheme_critical_moments.1213.desc_secret: "\n\nAlespoň [target.GetFirstNameNoTooltip] stále žije v blažené nevědomosti a nemá ani tušení, že se vůbec něco dělo..."
 scheme_critical_moments.1213.a: "Jen drobná překážka..."
 scheme_critical_moments.1214.t: "Zpochybněná mandala"
 scheme_critical_moments.1214.desc: "Začíná to letmým pohledem. Tím zvláštním výrazem #EMP nejistoty#!. Když jim něco přikazuji ve jménu svého božství, váhají o okamžik déle, než by měli. Služebnictvo si šeptá o mých nedostatcích a slabostech, které prý dokazují, že jsem ve skutečnosti pouhý člověk, nikoli božská bytost.\n\nJak se opovažují? Dokážu jim, že se mýlí. Musím."
 scheme_critical_moments.1214.desc_discovered: "\n\nA aby toho nebylo málo, mí agenti jsou si jistí, že za tímto zpochybňováním mého božství stojí [owner.GetTitledFirstName]..."
 scheme_critical_moments.1214.a: "To je nanejvýš znepokojivé..."
 scheme_critical_moments.1215.t: "Nezlomná mandala"
 scheme_critical_moments.1215.desc: "Lživé zvěsti a zákeřné šeptandy se pokoušejí podkopat mou autoritu. Snaží se přesvědčit ostatní, že právě #EMP já#! nejsem božská bytost.\n\nMoji následovníci však takovým pomluvám neuvěří a mé postavení zůstává neotřeseno. Prozatím."
 scheme_critical_moments.1215.desc_discovered: "\n\nMí agenti jsou si však jistí, že za těmito pokusy zpochybnit mé božství stojí [owner.GetTitledFirstName]..."
 scheme_critical_moments.1215.a: "Jak se opovažují!"
 scheme_critical_moments.1215.a_discovered: "To je ale [owner.Custom2('InsultNoun', ROOT.Char)|l]..."
 scheme_critical_moments.1222.t: "[scheme.GetNameNoTooltip|U]: Úspěch"
 scheme_critical_moments.1222.desc: "Mé úsilí a všechny útrapy konečně přinesly ovoce! Dlouhé měsíce nátlaku na [target.Custom('CZ_TitledFirstName_A')] se vyplatily. Konečně nastal obrat a [target.GetTitledFirstName] je nyní [Select_CString(target.IsFemale,'ochotná','ochotný')] přijmout mou svrchovanost.\n\nMá vláda bude zářit nádherou a vznešeností!"
 scheme_critical_moments.1222.a: "Další tributář pod mou vládou!"
 scheme_critical_moments.1223.t: "[scheme.GetNameNoTooltip|U]: Neúspěch"
 scheme_critical_moments.1223.intro: "Žádný úspěch. K čemu bylo všechno to úsilí?"
 scheme_critical_moments.1223.desc: "[target.GetTitledFirstName|U] odmítá mé nabídky a trvá na tom, že se bez cizí nadvlády obejde mnohem lépe. Ještě uvidíme."
 scheme_critical_moments.1223.desc_suzerain: "[target.GetTitledFirstName|U] odmítá mé nabídky s tvrzením, že [target.GetSuzerain.GetTitledFirstName] je jediným pravým vládcem, kterému stojí za to sloužit. Takové žvásty!"
 scheme_critical_moments.1223.a: "Pche. Najdu si následovníky, kteří si mě více zaslouží!"
 scheme_critical_moments.1224.t: "[scheme.GetNameNoTooltip|U]: Úspěch"
 scheme_critical_moments.1224.desc: "Nastal čas. Okamžik, kdy se [target.GetTitledFirstName] vymaní z područí [target.GetSuzerain.Custom('CZ_TitledFirstName_G')], je na dosah. Zbývá jediné. [target.GetFirstNameNoTooltip|U] musí oznámit [target.GetSuzerain.Custom('CZ_TitledFirstName_D')] nové poměry a pak už budu dostávat svůj tribut...\n\nSnad [target.GetSuzerain.GetTitledFirstNameNoTooltip|U] projeví čest a dovolí [target.Custom('CZ_TitledFirstName_D')] v míru odejít k #EMP vhodnějšímu#! suzerénovi."
 scheme_critical_moments.1224.a: "Už se nemohu dočkat!"
 scheme_critical_moments.1225.t: "Odcházející tributář"
 scheme_critical_moments.1225.desc: "Na můj dvůr přichází posel [Select_CString(target.IsFemale,'mé tributářky','mého tributáře')] [target.Custom('CZ_TitledFirstName_G')] s jasnou zprávou.\n\nZa vším stojí [owner.GetTitledFirstName], [owner.Custom2('InsultNoun', ROOT.Char)|l]! [Select_CString(owner.IsFemale,'Zamotala','Zamotal')|U] hlavu nebohé [Select_CString(target.IsFemale,'ženě','duši')] natolik, že se [target.GetFirstNameNoTooltip] nyní chce #EMP vymanit#! z mého područí, přestat odvádět tribut a odmítnout mou svrchovanost."
 scheme_critical_moments.1225.a: "Raději nabídnu nějakou #EMP pobídku...#!"
 scheme_critical_moments.1225.b: "#EMP Tak to se ještě uvidí.#!"
 scheme_potential_suzerain_might_join_war_tt: "\n@alert_icon! #alert_trial [TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer,'můžeš','může')] získat nového [Concept('suzerain','suzeréna')|E] – [CHARACTER.GetShortUIName] – který se může připojit k válce na straně obránců!#!"
 scheme_critical_moments.1225.c: "To se dá přijmout."
 scheme_critical_moments.1226.t_incentivizing: "[scheme.GetNameNoTooltip|U]: Něco získáš, něco ztratíš"
 scheme_critical_moments.1226.t_warring: "[scheme.GetNameNoTooltip|U]: Spojené síly"
 scheme_critical_moments.1226.t: "[scheme.GetNameNoTooltip|U]: Propuštění z područí"
 scheme_critical_moments.1226.desc_incentivizing: "Dopis od [target.Custom('CZ_TitledFirstName_G')] přináší smutné zprávy. [incentivizing_suzerain.GetTitledFirstName|U] [Select_CString(incentivizing_suzerain.IsFemale,'přesvědčila','přesvědčil')] [target.Custom('CZ_TitledFirstName_A')], aby ještě #EMP nějakou dobu#! [Select_CString(target.IsFemale,'zůstala','zůstal')] ve svém dosavadním postavení...\n\n...a za nedostatek skutečného božství teď musí ten falešný dévarádža zaplatit pořádnou odměnou.\n\nMožná příště [target.GetFirstNameNoTooltip] konečně prohlédne a připojí se ke mně."
 scheme_critical_moments.1226.desc_warring: "Do mého sálu se přiřítí posel [target.Custom('CZ_TitledFirstName_G')]. „Válka!“ vykřikne. „Válka! [warring_suzerain.GetTitledFirstName|U] se [Select_CString(warring_suzerain.IsFemale,'rozhodla','rozhodl')] #EMP silou#! napravit chvilkové poblouznění [Select_CString(target.IsFemale,'mé paní','mého pána')]!“\n\nPosel je stále celý rozrušený. Padne mi k nohám a prosí: „Prosím, prosím, #EMP pomozte nám!#!“\n\nPo zádech mi přeběhne mráz. Válka?"
 scheme_critical_moments.1226.desc: "Suzerén ustoupil"
 scheme_critical_moments.1226.a: "„Na pomoc!“"
 scheme_critical_moments.1226.b: "No tedy..."
 scheme_critical_moments.1226.b_warring: "„K #EMP válce#! můj slib nezavazuje!“"
 scheme_critical_moments.1226.b_incentivizing: "Nu což. Alespoň z toho vzešlo něco dobrého."
 coerce_and_leverage_contribution_ongoing.0001.t: "[my_scheme.GetNameNoTooltip|U]: Každý z vás"
 coerce_and_leverage_contribution_ongoing.0001.desc.intro: "Navštěvuji [target_county.GetName], abych [Select_CString(ROOT.Char.IsFemale,'přesvědčila','přesvědčil')] místní obyvatele, že by měli přispět na můj velkolepý projekt, jehož výsledkem má být [ROOT.Char.GetFaith.HouseOfWorship].\n\n"
 coerce_and_leverage_contribution_ongoing.0001.desc.high_dev: "Stánky nabízející vybrané pokrmy, jako je [ROOT.Char.Custom('GetExpensiveMeal')], mě lákají svou lahodnou vůní."
 coerce_and_leverage_contribution_ongoing.0001.desc.low_dev: "Místní se tísní na [ROOT.Char.Custom('GetSquareCommons')]. Všude kolem stojí [ROOT.Char.Custom('GetCrookedhousesDelapidatedtents')] a obchodníci se snaží udat i nahnilé zásoby kořenové zeleniny, jako jsou [ROOT.Char.Custom('get_region_root_vegetable_plural')]."
 coerce_and_leverage_contribution_ongoing.0001.desc.regular_dev: "Kupci nabízejí [ROOT.Char.Custom('GetTradeGoods')] a snaží se napálit nic netušící návštěvníky."
 coerce_and_leverage_contribution_ongoing.0001.desc.outro: "\n\n„Slyšte, slyšte! Ať jste [peasant.Custom('dummy_peasant_profession')] nebo [peasant.Custom2('dummy_peasant_profession', peasant)]! Za pouhý #EMP nepatrný#! obnos zlata může být tohle všechno vaše!“"
 coerce_and_leverage_contribution_ongoing.0001.a: "Tihle lidé jistě mohou postrádat nějakou tu minci."
 coerce_and_leverage_contribution_ongoing.0001.b: "Mají dost vlastních starostí."
 coerced_contribution_county_modifier: "„Dobrovolné“ příspěvky"
 coerced_contribution_county_modifier_desc: "Obyvatelé tohoto hrabství byli donuceni přispět na velký projekt."
 scheme_coerced_subjects_modifier: "$coerced_contribution_county_modifier$"
 scheme_coerced_subjects_modifier_desc: "$coerced_contribution_county_modifier_desc$"
 spared_contribution_county_modifier: "Osvobození od příspěvků"
 spared_contribution_county_modifier_desc: "Obyvatelé tohoto hrabství byli zbaveni povinnosti finančně přispívat na velký projekt."
 coerce_and_leverage_contribution_ongoing.0010.t: "[my_scheme.GetNameNoTooltip|U]: Spása za zlato"
 coerce_and_leverage_contribution_ongoing.0010.desc: "Ráno mě vítá vůně květin, mezi nimiž vynikají [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type_plural')]. Vzduch prostupuje [ROOT.Char.Custom('GetSeasonAdj')] nálada. Vždyť je [ROOT.Char.Custom('GetSeason')].\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], vybudovat [ROOT.Char.GetFaith.HouseOfWorship] je náročný úkol,“ oslovuje mě [court_chaplain.GetName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_chaplain'))], a [court_chaplain.Custom('quirk_pos_adverb')] se usmívá. „Ale věřící lze povzbudit příslibem nebeské přízně.“\n\n„Pokud to vyhlásíme, každý, kdo nabídne svůj příspěvek, obdrží požehnání, jakého se obyčejným lidem nedostává.“"
 coerce_and_leverage_contribution_ongoing.0010.aa: "„Takové požehnání bych si #EMP já#! [Select_CString(ROOT.Char.IsFemale,'přála','přál')].“"
 coerce_and_leverage_contribution_ongoing.0010.a: "„Zařiď to.“"
 coerce_and_leverage_contribution_ongoing.0010.b: "Tohle si nezaslouží tvou pozornost."
 coerce_and_leverage_contribution_ongoing.0020.t: "[my_scheme.GetNameNoTooltip|U]: Cena slibu"
 coerce_and_leverage_contribution_ongoing.0020.desc: "[servant.GetName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('servant'))], se hluboce uklání. V rukou drží [servant.Custom('GetWritingMaterialPlural')].\n\n„Pokladnice určená na stavbu svatyně naší víry se plní příliš pomalu,“ oznamuje [servant.Custom('quirk_pos_pp')].\n\n„Slova však někdy dokážou získat to, co peníze ne. Možná by [target.Custom('CZ_TitledFirstName_A')] přiměl k pomoci dopis obsahující lákavý příslib...“"
 coerce_and_leverage_contribution_ongoing.0020.aa: "Slib přece nemusí být pravdivý..."
 coerce_and_leverage_contribution_ongoing.0020.a: "„Pusť se do psaní, a rychle!“"
 coerce_and_leverage_contribution_ongoing.0020.b: "„Jen se zmiň, že si vážím [Select_CString(target.IsFemale,'její','jeho')] štědrosti.“"
 scheme_promised_hook_modifier: "Přislíbená páka"
 scheme_promised_hook_modifier_desc: "Původce této intriky slíbil svému cíli páku. Zda byla skutečná, nebo jen smyšlená, však ví pouze on sám."
 coerced_my_tributary_opinion: "Nátlak na mého tributáře"
 coerced_tributary_opinion: "Donucený tributář"
 scheme_critical_moments.1242.t: "[scheme.GetNameNoTooltip|U]: Úspěch"
 scheme_critical_moments.1242.desc: "Vždy mi bylo jasné, že se mohu spolehnout na pracovité obyvatele hrabství [target_title.GetBaseNameNoTierNoTooltip]. Kvůli vyššímu cíli a na oslavu svého panovníka by si snad strhli i poslední košili z těla, jen aby přispěli na výstavbu mého chrámového komplexu.\n\nJak rozkošné."
 scheme_critical_moments.1242.a: "Dobře, dobře..."
 scheme_critical_moments.1243.t: "[scheme.GetNameNoTooltip|U]: Neúspěch"
 scheme_critical_moments.1243.desc: "Obyvatelé hrabství [target_title.GetBaseNameNoTierNoTooltip] odmítají pochopit, co je správné, a otevřeně zavrhují mé žádosti o příspěvky na můj #EMP velkolepý#! projekt. Jeden [owner.Custom('InsultNoun')] vedle druhého!\n\nVymlouvají se na #EMP nedostatek prostředků#!. Takové nesmysly! Když se chce, všechno jde!"
 scheme_critical_moments.1243.a: "Jaká opovážlivost!"
 insusceptible_to_coerce_contribution_modifier: "Odolnost vůči nátlaku"
 insusceptible_to_coerce_contribution_modifier_desc: "Obyvatelé tohoto hrabství odmítají být nuceni financovat chrámový komplex v hlavním městě."
 scheme_critical_moments.1252.t: "[scheme.GetNameNoTooltip|U]: Úspěch"
 scheme_critical_moments.1252.desc: "Vždy mi bylo jasné, že se na [target.Custom('CZ_TitledFirstName_A')] mohu spolehnout! Mé lichotky, přemlouvání i přesvědčivé argumenty konečně přinesly ovoce. [target.GetTitledFirstName|U] [Select_CString(target.IsFemale,'velkoryse souhlasila','velkoryse souhlasil')] s investicí do mého projektu a [Select_CString(target.IsFemale,'rozhodla','rozhodl')] se udělat vše pro to, aby můj chrám dosáhl ještě větší nádhery.\n\nBožské povznesení je zase o krok blíž..."
 scheme_critical_moments.1252.a: "Nádhera!"
 scheme_critical_moments.1253.t: "[scheme.GetNameNoTooltip|U]: Neúspěch"
 scheme_critical_moments.1253.desc: "Vtrhnu do komnaty a vzteky zatínám pěsti. Kdo jiný než [target.Custom('InsultNoun')] by se takhle zachoval? [target.GetTitledFirstName|U] prostě odmítá naslouchat rozumu. Copak nestačily všechny ty debaty, spory a snahy #EMP ovlivnit#! nejbližší okolí [target.Custom('CZ_TitledFirstName_G')]?!\n\nPrý mají přednost #EMP naléhavější investice#! před příspěvkem na můj #EMP velkolepý#! projekt. Čekám přece mnohem víc! Tímhle to rozhodně nekončí..."
 scheme_critical_moments.1253.a: "No dovolte..."
 insusceptible_to_leverage_contribution_modifier: "Odolnost vůči přesvědčování"
 insusceptible_to_leverage_contribution_modifier_desc: "Tato postava odmítá otevřít svou peněženku i své srdce a přispět na financování projektu."
 unlock_coerce_tributary_scheme_tt: "Vyžaduje #V 2. úroveň#! [Concept('aspect_of_trickery','aspektu lstivosti')|E]"
 coerce_tributary_ongoing.0001.t: "[my_scheme.GetNameNoTooltip|U]: Uzavřené cesty"
 coerce_tributary_ongoing.0001.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ Přede mnou stojí [steward.GetName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('steward'))], s úsměvem od ucha k uchu.\n\n„Podařilo se mi... #EMP objevit#! starou listinu, která nám umožňuje požadovat od [target.Custom('CZ_TitledFirstName_G')] vyšší mýtné za používání našich cest. Budu však potřebovat nějaké prostředky na vyslání malé delegace do města [capital.GetName].“"
 coerce_tributary_ongoing.0001.a: "Brzy se ukáže, jak drahý může být odpor vůči nám."
 coerce_tributary_ongoing.0001.a.success: "[target.GetShortUIName|U] souhlasí s platbou"
 coerce_tributary_ongoing.0001.a.failure: "[target.GetShortUIName|U] odmítá ustoupit"
 coerce_tributary_ongoing.0001.b: "Čas odvede svou práci za nás."
 scheme_extra_tariffs: "Zvýšené mýtné"
 scheme_extra_tariffs_desc: "Původce této intriky přesvědčil svůj cíl, že pokud se dobrovolně nestane jeho tributářem, čeká ho #EMP mnohem více#! nepříjemností."
 coerce_tributary_ongoing.0010.t: "[my_scheme.GetName|U]: Tvrdé vyjednávání"
 coerce_tributary_ongoing.0010.desc: "[marshal.GetName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))], se přede mnou hluboce uklání. Po výcviku, při němž se zapotili i [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')], stále stéká po čele pot.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ začíná, „už jsme promarnili příliš mnoho slov ve snaze přesvědčit [target.Custom('CZ_TitledFirstName_A')]. O tribut se nežebrá. Tribut se vybírá.“\n\nZaťatá pěst jen podtrhuje odhodlání, s nímž tato slova zaznívají.\n\n„Dovolte mi vytáhnout s několika válečníky až k samotným branám města [capital.GetName].“"
 coerce_tributary_ongoing.0010.a: "„Zařiď to!“"
 coerce_tributary_ongoing.0010.a.success: "[target.GetShortUIName|U] [Select_CString(target.IsFemale,'byla přesvědčena','byl přesvědčen')]"
 coerce_tributary_ongoing.0010.a.failure: "[target.GetShortUIName|U] se cítí těžce [Select_CString(target.IsFemale,'uražená','uražený')]"
 coerce_tributary_ongoing.0010.b: "Není třeba [target.Custom('CZ_TitledFirstNameNoTooltip_A')] zbytečně rozhněvat."
 rival_tried_to_intimidate: "[CZProDrop(TARGET_CHARACTER,'pokusila','pokusil')|U] se zastrašit [CHARACTER.Custom('CZ_ShortUIName_A')] a donutit tuto postavu přijmout postavení tributáře."
 rival_tried_to_intimidate_corresponding: "[CZProDrop(CHARACTER,'čelila','čelil')|U] zastrašování ze strany [TARGET_CHARACTER.Custom('CZ_ShortUIName_G')], jehož cílem bylo vynutit postavení tributáře."
 scheme_tribute_intimidation: "Tvrdé vyjednávání"
 scheme_tribute_intimidation_desc: "Původce této intriky dal svému cíli naprosto jasně najevo, že pokud neustoupí, bude čelit mnohem horším následkům."
