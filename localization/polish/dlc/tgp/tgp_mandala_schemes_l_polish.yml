 recipient_is_your_suzerain.tt: "[recipient.GetShortUIName|U] [Select_CString(recipient.IsLocalPlayer,'jsi','je')] [Concept('suzerain','suzerénem')|E] [actor.Custom('CZ_ShortUIName_G')]"
 you_share_suzerain.tt: "Máte společného [Concept('suzerain','suzeréna')|E]"
