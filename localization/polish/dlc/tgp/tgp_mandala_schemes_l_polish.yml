 coerce_contribution: "Vynucení příspěvku"
 coerce_contribution_desc: "Obyvatele území [SCHEME.GetTargetTitle.GetBaseNameNoTier] lze jistě přesvědčit, aby přispěli na tak velkolepý projekt..."
 coerce_contribution_desc_general: "Intrika $coerce_contribution$ je [Concept('political_scheme','politická intrika')|E], jejímž cílem je přesvědčit obyvatele baronie, která je [Concept('scheme_target','cílem intriky')|E], aby otevřeli svá srdce i měšce a [Concept('great_project_contribute','přispěli')|E] na [Concept('great_project','velký projekt')|E] [Concept('scheme_owner','osnovatele intriky')|E]."
 COERCE_CONTRIBUTION_SUCCESS_DESC: "Obyvatelé území [TARGET_TITLE.GetBaseName] financují jeden z tvých [Concept('great_project_contributions','příspěvků na velký projekt')|E]"
 coerce_contribution_invalidated_title: "@scheme_icon! Intrika Vynucení příspěvku skončila"
