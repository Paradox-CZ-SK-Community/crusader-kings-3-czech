l_polish:

 disbelieve_mandala: "Zpochybnění mandaly"
 disbelieve_mandala_desc: "Je načase trochu otřást pověstí [SCHEME.GetTargetCharacter.Custom('CZ_ShortUINameNoTooltip_G')] v soupeření o postavení [Concept('mandala','mandaly')|E]. A možná nejen trochu."
 disbelieve_mandala_desc_general: "Intrika $disbelieve_mandala$ je [Concept('hostile_scheme','nepřátelská intrika')|E], jejímž cílem je poškodit pověst [Concept('scheme_target','cíle intriky')|E] jako božské mandaly.\n\nUmožňuje získávat [Concept('agents','spolčence')|E], patří mezi [Concept('secret_scheme','tajné intriky')|E] založené na [Concept('intrigue','pletichářství')|E] a její odhalení dále prohloubí soupeření mezi osnovatelem a cílem intriky."
 DISBELIEVE_MANDALA_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer,'můžeš','může')] získat modifikátor [GetModifier( 'disbelieved_mandala_modifier' ).GetNameWithTooltip|L]"
 disbelieve_mandala_invalidated_title: "@scheme_icon! Intrika Zpochybnění mandaly skončila"
 scheme_target_not_mandala: "[SCHEME.GetTargetCharacter.GetShortUIName|U] [Select_CString(SCHEME.GetTargetCharacter.IsLocalPlayer,'nemáš','nemá')] [Concept('government','vládu')|E] typu [Concept('mandala','mandala')|E]"
 scheme_owner_not_mandala: "Nemáš [Concept('government','vládu')|E] typu [Concept('mandala','mandala')|E]"
 scheme_owner_not_house_head: "Už nejsi [Concept('house_head','hlavou rodu')|E]"
 scheme_target_not_independent: "[SCHEME.GetTargetCharacter.GetShortUIName|U] [Select_CString(SCHEME.GetTargetCharacter.IsLocalPlayer,'nemáš','nemá')] [Concept('independent','nezávislé')|E] postavení"
 scheme_target_tributary_of_owner: "[SCHEME.GetTargetCharacter.GetShortUIName|U] je tvým [Concept('subject','subjektem')|E]"
 start_disbelieve_mandala_interaction: "$disbelieve_mandala$ #weak (Intrika)#!"
 disbelieve_mandala_action: "Zpochybnit"
 scheme_interaction_tt_disbelieve_mandala: "Pokusíš se zpochybnit božské postavení [recipient.Custom('CZ_ShortUINameNoTooltip_G')], což může poškodit [Concept('legitimacy','legitimitu')|E] a [Concept('piety','zbožnost')|E] této postavy a vyvolat zmatek mezi [Concept('subjects','jejími subjekty')|E]"
 disbelieve_mandala_interaction_notification: "Zpochybnění mandaly"
 unlock_disbelieve_mandala_scheme_tt: "Vyžaduje #V 3. úroveň#! [Concept('aspect_of_trickery','aspektu lstivosti')|E]"
 coerce_tributary: "Vynucení tributářství"
 coerce_tributary_desc: "Brzy by mělo být [SCHEME.GetTargetCharacter.Custom('CZ_ShortUINameNoTooltip_D')] jasné, kdo je #EMP skutečnou#! svrchovanou autoritou..."
 coerce_tributary_desc_general: "Intrika $coerce_tributary$ je [Concept('political_scheme','politická intrika')|E], jejímž cílem je přesvědčit [Concept('scheme_target','cíl intriky')|E], aby se stal [Concept('tributary','tributářem')|E] [Concept('scheme_owner','osnovatele intriky')|E].\n\nPokud již má cíl svého [Concept('suzerain','suzeréna')|E], dostane tento suzerén možnost rozhodnout, jak na situaci zareaguje. Zároveň tím vznikne [Concept('rivalry','sokovství')|E] mezi osnovatelem intriky a dosavadním suzerénem."
 COERCE_TRIBUTARY_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U] se může stát tvým [Concept('tributary','tributářem')|E]"
 coerce_tributary_invalidated_title: "@scheme_icon! Intrika Vynucení tributářství skončila"
 start_coerce_tributary_interaction: "$coerce_tributary$ #weak (Intrika)#!"
 coerce_tributary_action: "Donutit"
 scheme_interaction_tt_coerce_tributary: "Pokusíš se donutit [recipient.Custom('CZ_ShortUINameNoTooltip_A')], aby se tato postava stala tvým [Concept('tributary','tributářem')|E]"
 coerce_tributary_interaction_notification: "Vynucení tributářství"
