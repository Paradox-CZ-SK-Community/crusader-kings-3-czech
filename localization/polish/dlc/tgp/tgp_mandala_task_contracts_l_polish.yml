 mandala_realm_contract_0002_contract: "Neplodný dobytek"
 mandala_realm_contract_0002_desc: "Dobytek [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] je neplodný, rodí se málo telat. Místní žádají plodnostní rituál, aby jejich živobytí nezmizelo."
 mandala_realm_contract_0002_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0002_request: "Dostav se do [CZProvName(TaskContract.GetLocation,'G')] a učiň volbu podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.1100.t: "$mandala_ritual_prefix$ Neplodný dobytek"
 tgp_east_asia_mandala_task_contract_events.1100.desc: "„Ó božská bytosti, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')], vyslyš prosbu mé vesnice,“ pronese [Select_CString(local_character.IsFemale,'vesnická představená','vesnický představený')] a položí ruku na vyhublou jalovici po svém boku. „Ať naše krávy zase rodí!“\n\nUkáže na vesničany, kteří k obřadu přinášejí veliké věnce. Tvoří je pestré [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type_plural')|l]."
 tgp_east_asia_mandala_task_contract_events.1100.a: "Rituál potrvá měsíc!"
 tgp_east_asia_mandala_task_contract_events.1100.b: "Rituál na týden postačí."
 tgp_east_asia_mandala_task_contract_events.1100.c: "Zůstanu na den."
 mandala_realm_contract_0003_contract: "První semeno"
 mandala_realm_contract_0003_desc: "Lidé [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] plánují postavit [GetBuilding('temple_citadel_01').GetName] ve vašem jménu. Nechtějí začít, dokud na místě nezasadíte 'první semeno'."
 mandala_realm_contract_0003_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0003_request: "Dostav se do [CZProvName(TaskContract.GetLocation,'G')] a učiň volbu podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.1200.t: "$mandala_ritual_prefix$ První semeno"
 tgp_east_asia_mandala_task_contract_events.1200.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], my, tví pokorní služebníci, si přejeme ve tvém slavném jménu postavit stavbu [GetBuilding('temple_citadel_01').GetName],“ pronese [Select_CString(local_character.IsFemale,'vesnická představená','vesnický představený')] při pohledu na [ritual_location.Custom('CZ_TerrainTypeProvince_A')|l] před námi. „Půda však zůstává neposvěcená. Potřebujeme, abys [Select_CString(ROOT.Char.IsFemale,'zasadila','zasadil')] první semeno a [Select_CString(ROOT.Char.IsFemale,'naplnila','naplnil')] zemi svou tvořivou silou.“\n\n[Select_CString(local_character_2.IsFemale,'Žena','Muž')|U] předstoupí a koketně se ovívá. „Ó božská bytosti, dobrovolně se nabízím, že ti pomohu dokončit rituál — před očima všech obyvatel [CZProvName(ritual_location,'G')]!“"
 tgp_east_asia_mandala_task_contract_events.1200.a: "Zdejší krajina – [ritual_location.Custom('TerrainTypeProvince')|l] – prožije měsíc našeho spojení!"
 tgp_east_asia_mandala_task_contract_events.1200.b: "Ležme tam, kde bude položen první kámen."
 tgp_east_asia_mandala_task_contract_events.1200.c: "Mohu to... zvládnout [Select_CString(ROOT.Char.IsFemale,'sama','sám')]."
 mandala_realm_contract_0004_contract: "Svatá jalovice"
 mandala_realm_contract_0004_desc: "Svatá jalovice [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] odmítá kleknout, což je znamení neplodnosti. Volají po vás, abyste obnovil rovnováhu."
 mandala_realm_contract_0004_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0004_request: "Dostav se do [CZProvName(TaskContract.GetLocation,'G')] a učiň volbu podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.1300.t: "$mandala_ritual_prefix$ Svatá jalovice"
 tgp_east_asia_mandala_task_contract_events.1300.desc: "„Je to pohroma,“ naříká vesnický stařešina. „Naše posvátná jalovice si odmítá lehnout. Jasné znamení neplodnosti a úpadku!“\n\n„Prosíme, potřebujeme #EMP tebe#!!. Požehnej nám místo ní. Vystup na tento kamenný podstavec a ukaž všem svou božskou záři, ať pole [CZPrepV(ritual_location.GetNameNoTooltip)] [CZProvName(ritual_location,'L')] znovu vzkvétají!“ Stařešina si mě měří pohledem.\n\nMám stát na podstavci celý týden [Select_CString(ROOT.Char.IsFemale,'nahá','nahý')|l]. Bez jídla..."
 tgp_east_asia_mandala_task_contract_events.1300.a: "Mé božství nezná hranic — hleďte na mé tělo!"
 tgp_east_asia_mandala_task_contract_events.1300.b: "Jídlo a oblečení jsou součástí rituálu."
 tgp_east_asia_mandala_task_contract_events.1300.c: "Moje figurína postačí..."
 mandala_realm_contract_0005_contract: "Božský svědek"
 mandala_realm_contract_0005_desc: "Šlechtický pár [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] je bezdětný. Požadují, abyste jejich svazku požehnal."
 mandala_realm_contract_0005_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0005_request: "Dostav se do [CZProvName(TaskContract.GetLocation,'G')] a učiň volbu podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.1400.t: "$mandala_ritual_prefix$ Božský svědek"
 tgp_east_asia_mandala_task_contract_events.1400.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], já a [Select_CString(local_character_2.IsFemale,'má manželka','můj manžel')] jsme dosud nedostali požehnání v podobě dítěte,“ pronese smutně [local_character.GetTitledFirstName]. „Pro tento obřad jsem [Select_CString(local_character.IsFemale,'nechala','nechal')] postavit pavilon [ritual_location.Custom('CZ_TerrainTypeProvince_In')|l].“\n\n[local_character_2.GetTitledFirstName|U] pokračuje: „Potřebujeme, abys mezi námi [Select_CString(ROOT.Char.IsFemale,'spala','spal')] jako božská bytost. Teprve pak se nám dostane požehnání dítětem! Samozřejmě... může to trvat několik nocí...“"
 tgp_east_asia_mandala_task_contract_events.1400.a: "Ó, udělám víc než jen 'svědčit'..."
 tgp_east_asia_mandala_task_contract_events.1400.b: "Budu pozorovat váš svazek."
 tgp_east_asia_mandala_task_contract_events.1400.c: "Stačí, když mezi vámi budou mé šaty."
 mandala_realm_contract_0006_contract: "Sen porodních asistentek"
 mandala_realm_contract_0006_desc: "Porodní asistentky [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] mají všechny stejný sen — vy, spojeni v posvátném svazku s znamením osudu [GetPlayer.Custom('WomanManOpposite')|l]."
 mandala_realm_contract_0006_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0006_request: "Dostav se do [CZProvName(TaskContract.GetLocation,'G')] a učiň volbu podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.1500.t: "$mandala_ritual_prefix$ Sen porodních asistentek"
 tgp_east_asia_mandala_task_contract_events.1500.desc: "Když se blížím k vesničce u [CZProvName(ritual_location,'G')], vítá mě skupinka porodních bab. „Všechny jsme měly stejný sen, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ říkají jedním hlasem. „Toto je [local_character_2.GetFirstName], [Select_CString(local_character_2.IsFemale,'narozená','narozený')] v noci onoho znamení.“\n\n„Pokud s touto osobou ulehneš, narodí se dítě, které zachrání [CZProvName(ritual_location,'A')]!“ Porodní báby ztichnou a [Select_CString(local_character_2.IsFemale,'ta podivná žena','ten podivný muž')] předstoupí s koketním úsměvem."
 tgp_east_asia_mandala_task_contract_events.1500.desc.stand_in: "\n\nPodívám se na [ROOT.Char.Custom2('CZ_RelationToMeShort_A', 1500_stand_in_character)] [1500_stand_in_character.Custom('CZ_FirstName_A')]. Jistě dokáže #EMP nést#! tu zodpovědnost..."
 tgp_east_asia_mandala_task_contract_events.1500.desc.stand_in.acolyte: "\n\nPodívám se na [1500_stand_in_character.Custom('CZ_FirstName_A')], na [Select_CString(1500_stand_in_character.IsFemale,'jednu ze svých oddaných','jednoho ze svých oddaných')]. Už nějakou dobu #EMP mám v plánu#! zkusit něco nového..."
 tgp_east_asia_mandala_task_contract_events.1500.a: "Přijď do [ROOT.Char.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')], [local_character_2.Custom('CZ_FirstNameNoTooltip_V')]."
 tgp_east_asia_mandala_task_contract_events.1500.a.stand_in: "[Select_CString(1500_stand_in_character.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMe', 1500_stand_in_character )|l] se postará o [local_character_2.Custom('CZ_FirstNameNoTooltip_A')] [CZPrepV(ROOT.Char.GetCapitalLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(ROOT.Char.GetCapitalLocation,'L')]."
 tgp_east_asia_mandala_task_contract_events.1500.a.stand_in.no_relation: "[Select_CString(1500_stand_in_character.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMe', 1500_stand_in_character )|l] a já se postaráme o [local_character_2.Custom('CZ_FirstNameNoTooltip_A')]."
 tgp_east_asia_mandala_task_contract_events.1500.a.stand_in.acolyte: "Můj sluha a já se postaráme o [local_character_2.Custom('CZ_FirstNameNoTooltip_A')]."
 tgp_east_asia_mandala_task_contract_events.1500.b: "Lehneme si spolu právě tuto noc."
 tgp_east_asia_mandala_task_contract_events.1500.b.stand_in: "[1500_stand_in_character.Custom('CZ_TitledFirstNameNoTooltip_V')|U], rozděl semena mé vlády."
 tgp_east_asia_mandala_task_contract_events.1500.b.stand_in.acolyte: "Akolyta [1500_stand_in_character.Custom('CZ_TitledFirstNameNoTooltip_V')], rozděl semena mé vlády."
 tgp_east_asia_mandala_task_contract_events.1500.c: "Dnes v noci bude můj #EMP duch#!! s tebou..."
 mandala_realm_contract_0007_contract: "Plačící socha"
 mandala_realm_contract_0007_desc: "Podle pověsti zanedbaná socha [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] pláče mlékem. Vesničané si přejí, abyste na ni pomazal novorozence."
 mandala_realm_contract_0007_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0007_request: "Dostav se do [CZProvName(TaskContract.GetLocation,'G')] a učiň volbu podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.1600.t: "$mandala_ritual_prefix$ Plačící socha"
 tgp_east_asia_mandala_task_contract_events.1600.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], ó božská bytosti!“ volá [Select_CString(local_character.IsFemale,'rolnice','rolník')] a padá na kolena. „Prastará socha na mém poli začala plakat mléko!“ Ohlédnu se. Veliká kamenná hlava je pokrytá látkami a květinami a po tváři jí stékají bílé pruhy.\n\n„Procházejí skrze ni duchové! Prosím, pomaž tím novorozeně, ať získáme jejich přízeň!“ zazní úpěnlivá prosba."
 tgp_east_asia_mandala_task_contract_events.1600.a: "Toto místo není obyčejné pole — je to svatyně!"
 tgp_east_asia_mandala_task_contract_events.1600.b: "Nechte mě přidat více obětí duchům."
 tgp_east_asia_mandala_task_contract_events.1600.c: "Pomazám dítě, jak se očekává."
 stone_head_shrine_modifier: "Svatyně obří kamenné hlavy"
 stone_head_shrine_modifier_desc: "Starobylá socha zapomenutého krále byla zde proměněna ve svatyni místního Devaraja."
 mandala_realm_contract_0008_contract: "Vykvétající květiny"
 mandala_realm_contract_0008_desc: "Zvláštní květ přehlušil sazenice [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')]. Vesničané věří, že je to vaše dílo, a požadují, abyste obnovil správnou rovnováhu."
 mandala_realm_contract_0008_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0008_request: "Dostav se do [CZProvName(TaskContract.GetLocation,'G')] a učiň volbu podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.1700.t: "$mandala_ritual_prefix$ Vykvétající květiny"
 tgp_east_asia_mandala_task_contract_events.1700.desc: "„Proč jsi nás [Select_CString(ROOT.Char.IsFemale,'opustila','opustil')], [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]?“ ptá se [Select_CString(local_character.IsFemale,'vesnická představená','vesnický představený')] hlasem plným beznaděje. „Naše sazenice dusí květy, kterým říkáme [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type_plural')|l]. Ani jediné pole nezůstalo ušetřeno!“\n\n„Bez obilí umřeme hlady... Musíš pole přejít naboso a dát zemi najevo, co má rodit.“"
 tgp_east_asia_mandala_task_contract_events.1700.a: "To nestačí... Pošli rýži z hlavního města."
 tgp_east_asia_mandala_task_contract_events.1700.b: "Půjdu bosý s tou zemí, ať prší nebo bouří."
 tgp_east_asia_mandala_task_contract_events.1700.c: "Políbím zemi, nic víc."
 fertile_ground_modifier: "Úrodná pole"
 fertile_ground_modifier_desc: "Příliv semen a nástrojů z hlavního města učinil tyto pozemky vhodné k rozvoji."
 mandala_realm_contract_0009_contract: "Říční rituál"
 mandala_realm_contract_0009_desc: "Řeka [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] dává místním život. Rybáři tě žádají o vykonání rituálu plodnosti, aby její vody zůstaly plné ryb."
 mandala_realm_contract_0009_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0009_request: "Dostav se do [CZProvName(TaskContract.GetLocation,'G')] a učiň volbu podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.1800.t: "$mandala_ritual_prefix$ Říční rituál"
 tgp_east_asia_mandala_task_contract_events.1800.desc: "Na břehu stojí skupina místních rybářů s koši plnými denního úlovku. „[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U]! Řeka se hemží rybami, kterým tu říkáme [ROOT.Char.Custom('GetRegionalFish')|l], ale naši starší tvrdí, že do příštího roku zpustne!“ říká [Select_CString(local_character.IsFemale,'jedna z nich','jeden z nich')].\n\n„Dnes v noci nastane vzácný úplněk. Potřebujeme, abys vodám [Select_CString(ROOT.Char.IsFemale,'požehnala','požehnal')] božskou plodností. [local_character_2.GetFirstName|U] se [Select_CString(local_character_2.IsFemale,'nabídla','nabídl')], že se k tobě při obřadu přidá.“"
 tgp_east_asia_mandala_task_contract_events.1800.a: "Pojď ke mně do řeky, [local_character_2.GetFirstNameNoTooltip]."
 tgp_east_asia_mandala_task_contract_events.1800.b: "Stačí, když hodím rýži do vody."
 tgp_east_asia_mandala_task_contract_events.1800.c: "Všechny ty ryby... neplatíte dost obětí."
 upset_peasants_modifier: "Rozhněvaní sedláci"
 upset_peasants_modifier_desc: "Z nějakého důvodu jsou sedláci v této oblasti neukáznění."
 mandala_realm_contract_0010_contract: "Prokletá pole"
 mandala_realm_contract_0010_desc: "Pluhy se v polích [TaskContract.GetLocation.GetNameNoTooltip] neustále lámou. Vesničané podezírají zlého ducha a žádají vaši pomoc k zlomení kletby."
 mandala_realm_contract_0010_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0010_request: "Dostav se do [CZProvName(TaskContract.GetLocation,'G')] a učiň volbu podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.1900.t: "$mandala_ritual_prefix$ Prokletá pole"
 tgp_east_asia_mandala_task_contract_events.1900.desc: "„To je sedmý pluh, který se tento týden zlomil, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ říká [Select_CString(local_character.IsFemale,'vesnická představená','vesnický představený')|l] a rozčíleně ukazuje směrem k polím. „Žárlivý zemský duch je jistě láme!“\n\n„Abychom kletbu zlomili, musíte — ve své zářivé božskosti — táhnout pluh přes každé pole a zorat první brázdu!“"
 tgp_east_asia_mandala_task_contract_events.1900.a: "Udělám to — připněte mě!"
 tgp_east_asia_mandala_task_contract_events.1900.b: "Já zasévám; [entourage_character.GetFirstNameNoTooltip] táhne pluh..."
 tgp_east_asia_mandala_task_contract_events.1900.c: "Zasadím jen jedno semeno."
 mandala_realm_contract_0011_contract: "Uschlý háj"
 mandala_realm_contract_0011_desc: "Blesk zasáhl posvátný strom a spálil háj kolem něj [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')]. Vesničané se bojí a žádají, abyste pod stromem vykonal rituál plodnosti."
 mandala_realm_contract_0011_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0011_request: "Dostav se do [CZProvName(TaskContract.GetLocation,'G')] a učiň volbu podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.2000.t: "$mandala_ritual_prefix$ Uschlý háj"
 tgp_east_asia_mandala_task_contract_events.2000.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], blesk zasáhl náš posvátný strom a spálil háj...“ pronese [Select_CString(local_character.IsFemale,'žena','muž')] a ukáže na ohořelé trosky. „Obáváme se, že už znovu nevyroste. [ROOT.Char.Custom('GetRandomRegionalSmallGamePlural')|U] jsou pryč a neozývá se ani [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')|l].“\n\n„Pod spáleným stromem se musíme spojit. Pokud naše spojení přinese ovoce, obnoví se i háj. Pomažme se uhlím, dokud nesplyneme s noční oblohou!“"
 tgp_east_asia_mandala_task_contract_events.2000.a: "Dostanete semena z hlavního města — a ode mě!"
 tgp_east_asia_mandala_task_contract_events.2000.a.female: "Pomohu ti při sázení semínek z hlavního města..."
 tgp_east_asia_mandala_task_contract_events.2000.b: "Tak ležme spolu."
 tgp_east_asia_mandala_task_contract_events.2000.c: "Pomazání sazí postačí."
 lush_grove_modifier: "Bujný háj"
 lush_grove_modifier_desc: "Díky daru semen od Devaraja z hlavního města jsou háje v této oblasti rozkvetlé."
 mandala_realm_contract_0012_contract: "Přísaha zabití prasete"
 mandala_realm_contract_0012_desc: "Vesničané [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] vás žádají, abyste stvrdili pakt pomsty zabitím černého prasete."
 mandala_realm_contract_0012_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0012_request: "Dostav se do [CZProvName(TaskContract.GetLocation,'G')] a učiň volbu podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.2100.t: "$mandala_ritual_prefix$ Přísaha zabití prasete"
 tgp_east_asia_mandala_task_contract_events.2100.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], hledáme vaše požehnání.“ [Select_CString(local_character.IsFemale,'žena','muž')|U] ukáže směrem k chlívu. „Vydáme se na nájezd proti našim nepřátelům [CZPrepV(vengeance_target.GetNameNoTierNoTooltip)] [vengeance_target.Custom('CZ_LandedNameNoTier_L')] — ale nejdřív musíte učinit oběť.“\n\n„Vezměte toto černé prase do [ritual_location.Custom('CZ_TerrainTypeProvince_G')|l] a prolijte jeho krev na kámen přísahy. Jen tak bude naše přísaha pomsty zpečetěna!“"
 tgp_east_asia_mandala_task_contract_events.2100.a: "Jedno prase? Ne, dodám padesát!"
 tgp_east_asia_mandala_task_contract_events.2100.b: "Prase bude obětováno a přísaha zpečetěna."
 tgp_east_asia_mandala_task_contract_events.2100.c: "Místo toho dostanete přísahu milosrdenství."
 mandala_realm_contract_0013_contract: "Rituální hněv"
 mandala_realm_contract_0013_desc: "Rok neúrody přiměl vesnici [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] prosit o trest — dobrovolníci prosí, aby byli udeřeni, aby uklidnili duchy."
 mandala_realm_contract_0013_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0013_request: "Dostav se do [CZProvName(TaskContract.GetLocation,'G')] a učiň volbu podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.2200.t: "$mandala_ritual_prefix$ Rituální hněv"
 tgp_east_asia_mandala_task_contract_events.2200.desc: "Když se blížíme [CZPrepK(ritual_location.GetNameNoTooltip)] [CZProvName(ritual_location,'D')], přistoupí skupina deseti sedláků. „[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U],“ zazní pevný hlas. „Naše pole leží ladem. Zemští duchové je prokleli a požadují oběť.“\n\n[local_character.GetTitledFirstName|U] poklekne do prachu a ukáže na můj meč. „Potrestej nás. Prolij naši krev na zem. Duchové budou nasyceni — a naše rodiny také.“"
 tgp_east_asia_mandala_task_contract_events.2200.a: "Moje vlastní krev uspokojí duchy."
 tgp_east_asia_mandala_task_contract_events.2200.b: "Vaše oběť uzdraví zemi."
 tgp_east_asia_mandala_task_contract_events.2200.c: "Stačí prase."
 mandala_realm_contract_0014_contract: "Kolektivní trest"
 mandala_realm_contract_0014_desc: "Zloděj [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] ukradl posvátnou rýži a uprchl. Vesničané žádají, aby byla místo něj potrestána jeho rodina."
 mandala_realm_contract_0014_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0014_request: "Dostav se do [CZProvName(TaskContract.GetLocation,'G')] a rozhodni podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.2300.t: "$mandala_ritual_prefix$ Kolektivní trest"
 tgp_east_asia_mandala_task_contract_events.2300.desc: "Když se blížíme [CZPrepK(ritual_location.GetNameNoTooltip)] [CZProvName(ritual_location,'D')], spatříme dav kolem [Select_CString(local_character_2.IsFemale,'osamělé ženy','osamělého muže')] s dítětem. „[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U],“ zvolá [Select_CString(local_character.IsFemale,'starší žena','starší muž')]. „[local_character_3.GetFirstName|U] tady [Select_CString(local_character_3.IsFemale,'ukradla','ukradl')] naši posvátnou rýži a [Select_CString(local_character_3.IsFemale,'utekla','utekl')] do [ritual_location.Custom('CZ_TerrainTypeProvince_G')|l]!“\n\nPrst ukáže na [Select_CString(local_character_2.IsFemale,'ženu','muže')]. „Pokud trestu unikne zloděj, musí být potrestána jeho rodina. Udeř na ně božskou spravedlností!“"
 tgp_east_asia_mandala_task_contract_events.2300.a: "Místo toho vystopujeme [local_character_3.Custom('CZ_FirstNameNoTooltip_A')]."
 tgp_east_asia_mandala_task_contract_events.2300.b: "[Select_CString(local_character_3.IsFemale,'Její','Jeho')|U] zločin, jejich trest. Ať tak bude."
 tgp_east_asia_mandala_task_contract_events.2300.c: "Dovolte mi znovu požehnat rýži."
 tgp_east_asia_mandala_task_contract_events.2300.a.success: "[local_character_3.GetFirstName|U] je [Select_CString(local_character_3.IsFemale,'dopadena','dopaden')] a [Select_CString(local_character_3.IsFemale,'zabita','zabit')|l]"
 tgp_east_asia_mandala_task_contract_events.2300.a.failure: "[local_character_3.GetFirstName|U] vám uniká"
 collective_punishments_modifier: "Kolektivní tresty"
 collective_punishments_modifier_desc: "Rodiny zlodějů v tomto okrese jsou trestány za zločiny, které nespáchaly."
 mandala_realm_contract_0015_contract: "Duchové nemoci"
 mandala_realm_contract_0015_desc: "Šaman [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] je obviněn z toho, že hostí duchy přinášející nemoci. Vesničané chtějí jeho chatrč spálit — včetně něj samotného, pokud to bude nutné."
 mandala_realm_contract_0015_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0015_request: "Dostav se do [CZProvName(TaskContract.GetLocation,'G')] a rozhodni podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.2400.t: "$mandala_ritual_prefix$ Duchové nemoci"
 tgp_east_asia_mandala_task_contract_events.2400.desc: "„Odpusť nám, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ pronese [Select_CString(local_character.IsFemale,'popelavě bledá žena','popelavě bledý muž')] a zakašle do dlaně. „Všichni jsme nemocní. Kromě [Select_CString(local_character_2.IsFemale,'té ženy','toho muže')], #EMP [Select_CString(local_character_2.IsFemale,'která předstírá','který předstírá')], že nás léčí#!.“\n\n„Určitě se v tom těle skrývají zlí duchové!“ zachrčí nemocný hlas. „Spalte chatrč, kde se duchové usadili. To je vyžene!“"
 tgp_east_asia_mandala_task_contract_events.2400.a: "Budeme hledat falešné léčitele po celém [ritual_location.GetNameNoTooltip]."
 tgp_east_asia_mandala_task_contract_events.2400.b: "Spálím chýši i s nositelem duchů uvnitř."
 tgp_east_asia_mandala_task_contract_events.2400.c: "Nositel duchů půjde se mnou."
 no_healers_modifier: "Bez léčitelů"
 no_healers_modifier_desc: "Dévarádža nechal v této provincii zabít léčitele a čaroděje."
 mandala_realm_contract_0016_contract: "Otupělá kopí"
 mandala_realm_contract_0016_desc: "Místní muži u zbraní [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] jsou líní a demoralizovaní. Starší vesnice vás prosí, abyste je potrestal."
 mandala_realm_contract_0016_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0016_request: "Dostav se do [CZProvName(TaskContract.GetLocation,'G')] a rozhodni podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.2500.t: "$mandala_ritual_prefix$ Otupělá kopí"
 tgp_east_asia_mandala_task_contract_events.2500.desc: "„Pochybují o tvém božství, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ pronese stařešina těžkým hlasem. „Bojovníci tráví celé dny pitím. Cesty jsou nebezpečné a banditů přibývá...“ Ukáže k nedaleké krčmě.\n\n„Musíš je potrestat. Tvou božskou přítomnost — i tvůj božský meč — potřebujeme k tomu, aby dostali strach a znovu poslouchali!“"
 tgp_east_asia_mandala_task_contract_events.2500.a: "Naučí se sloužit — krví."
 tgp_east_asia_mandala_task_contract_events.2500.b: "Každý z nich dostane mé slovo — nebo můj bič."
 tgp_east_asia_mandala_task_contract_events.2500.c: "Prostá řeč postačí."
 motivated_men_at_arms_modifier: "Motivovaní ozbrojenci"
 motivated_men_at_arms_modifier_desc: "Muži u zbraně hlídající tuto provincii jsou po předvedení Devarajy velmi motivovaní. Nebo, co z nich zbylo."
 safer_roads_modifier: "Bezpečnější cesty"
 safer_roads_modifier_desc: "Cesty jsou po návštěvě Devaraji o něco bezpečnější."
 mandala_realm_contract_0017_contract: "Vzpurná vesnice"
 mandala_realm_contract_0017_desc: "Vesnice [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] odmítá platit tribut a vysmívá se tvému božství. Místní kněz tě prosí, abys tam osobně vytáhl."
 mandala_realm_contract_0017_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0017_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.2600.t: "$mandala_ritual_prefix$ Vzpurná vesnice"
 tgp_east_asia_mandala_task_contract_events.2600.desc: "Když se blížíme [CZPrepK(ritual_location.GetNameNoTooltip)] [CZProvName(ritual_location,'D')], vítá nás posměšná podívaná. Má figurína visí hlavou dolů, potřísněná popelem a hnojem. Vesničané kolem ní tančí, zpívají o mé slabosti a vyjí jako divocí psi.\n\nNejde o to, že by se mě přestali bát.\nO můj hněv si přímo říkají."
 tgp_east_asia_mandala_task_contract_events.2600.a: "Nenechám nikoho naživu. Krev provlhčí zemi."
 tgp_east_asia_mandala_task_contract_events.2600.b: "Spálím jejich zásoby obilí."
 tgp_east_asia_mandala_task_contract_events.2600.c: "Potřebují jen ujištění."
 slaughtered_village_modifier: "Vyvražděná vesnice"
 slaughtered_village_modifier_desc: "Devaraja vyvraždil obyvatele vzpurné vesnice v tomto okrese."
 mandala_realm_contract_0018_contract: "Krvavá daň"
 mandala_realm_contract_0018_desc: "[CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)|U] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] nebyl splněn vojenský odvod. Místní úředník tě žádá, o vymáhání #EMP krvavé mince#!! — ti, kdo nemohou sloužit, musí nabídnout náhradu."
 mandala_realm_contract_0018_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0018_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.2700.t: "$mandala_ritual_prefix$ Krvavá daň"
 tgp_east_asia_mandala_task_contract_events.2700.desc: "Když se blížíme [CZPrepK(ritual_location.GetNameNoTooltip)] [CZProvName(ritual_location,'D')], vítá mě [local_character.GetTitledFirstName] s úředním svitkem. „[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], tato vesnice odmítla splnit odvodní povinnost,“ dozvídám se. „Za trest má zaplatit krvavé peníze — a ty musíš tento trest vymoci.“\n\n„Mně nenaslouchají, ale tvé božské slovo poslechnou. Přinuť je zaplatit, co dluží.“ Následuje hluboká úklona."
 tgp_east_asia_mandala_task_contract_events.2700.a: "Vybírám krev, ne mince. Odvod bude splněn."
 tgp_east_asia_mandala_task_contract_events.2700.b: "Krvavé mince budou vybrány."
 tgp_east_asia_mandala_task_contract_events.2700.c: "Stačí má přítomnost."
 enforced_levy_modifier: "Vynucený odvod"
 enforced_levy_modifier_desc: "Devaraja svým násilím zajistil, že tento okres dodržuje odvod."
 mandala_realm_contract_0019_contract: "Bambusoví vzbouřenci"
 mandala_realm_contract_0019_desc: "Rolníci [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] brousí bambusové hole a tvrdí, že se nyní dokážou #EMP „bránit sami.“#! Jsi povolán, aby ses dostavil dříve, než vypukne vzpoura."
 mandala_realm_contract_0019_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0019_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.2800.t: "$mandala_ritual_prefix$ Bambusoví vzbouřenci"
 tgp_east_asia_mandala_task_contract_events.2800.desc: "Když přijíždíme do [CZProvName(ritual_location,'G')], vesnici lemují naostřená bambusová kopí jako provizorní palisáda. „[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], my ty tyče brousíme jen proto, abychom se mohli bránit proti... [ROOT.Char.Custom('RegionalOnlyFerociousAnimalPlural')|U], ano, přesně tak,“ říká [Select_CString(local_character.IsFemale,'jedna z žen','jeden z mužů')] ne zrovna přesvědčivým tónem.\n\n„Nikdy bychom je nepoužili k ničemu jinému — ne — to by přece nevypadalo, že pochybujeme o tvé #EMP božskosti#!! nebo tak něco...“"
 tgp_east_asia_mandala_task_contract_events.2800.a: "Učiním z vaší vesnice krvavý příklad."
 tgp_east_asia_mandala_task_contract_events.2800.b: "Odevzdejte kopí svému [ROOT.Char.GetTitleAsNameNoTooltip]."
 tgp_east_asia_mandala_task_contract_events.2800.c: "Chvályhodné počínání."
 well_armed_peasants_modifier: "Dobře ozbrojení sedláci"
 well_armed_peasants_modifier_desc: "Sedláci v tomto okrese si mohou ponechat velké množství kopí."
 mandala_realm_contract_0020_contract: "Oběť na cestě"
 mandala_realm_contract_0020_desc: "Silnice [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] byla opakovaně napadena bandity. Místní věří, že ji musí #EMP „nakrmit“#!, aby se násilí utlumilo."
 mandala_realm_contract_0020_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0020_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.2900.t: "$mandala_ritual_prefix$ Oběť na cestě"
 tgp_east_asia_mandala_task_contract_events.2900.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], cesty [CZPrepV(ritual_location.GetNameNoTooltip)] [CZProvName(ritual_location,'L')] nejsou bezpečné,“ říká starší [Select_CString(local_character.IsFemale,'žena','muž')|l]. „Cestovatelé jsou napadáni, karavany drancovány — a to nikdy nekončí.“\n\n„Duchové cesty musí být rozzlobeni.“ Zvedá dýku. „Musí být krmeni krví, dokud násilí nepřestane.“"
 tgp_east_asia_mandala_task_contract_events.2900.a: "Má božská krev je sytí."
 tgp_east_asia_mandala_task_contract_events.2900.b: "Pět mých koní postačí."
 tgp_east_asia_mandala_task_contract_events.2900.c: "Přineste prase z vesnice."
 mandala_realm_contract_0021_contract: "Festival boha války"
 mandala_realm_contract_0021_desc: "Ve svatyni [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] je uctíván [TaskContract.GetLocation.GetCounty.GetFaith.WarGodName]. Tebe však neuctívají. Očekává se, že obřad přerušíš a znovu potvrdíš své božství."
 mandala_realm_contract_0021_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0021_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.3000.t: "$mandala_ritual_prefix$ Festival boha války"
 tgp_east_asia_mandala_task_contract_events.3000.desc: "[CZPrepV(ritual_location.GetNameNoTooltip)|U] [CZProvName(ritual_location,'L')] vesničané tančí kolem veliké figuríny. Moje ovšem není. #EMP „[ritual_location.GetCounty.GetFaith.WarGodName|U]! [ritual_location.GetCounty.GetFaith.WarGodName|U]! [ritual_location.GetCounty.GetFaith.WarGodName|U]!“#! provolávají. Mé jméno nezazní.\n\nJeden z rolníků předstoupí s úsměvem. „Přidej se k oslavě! Ať se s námi raduje [ritual_location.GetCounty.GetFaith.WarGodName]!“\n\n#bold Jenže [ritual_location.GetCounty.GetFaith.WarGodName] jsem já.\nA ode mě se očekává, že je potrestám.#!!"
 tgp_east_asia_mandala_task_contract_events.3000.a: "Krví a ohněm budou uctívat #EMP mě.#!!"
 tgp_east_asia_mandala_task_contract_events.3000.b: "Tito rolníci budou sloužit jako můj příklad."
 tgp_east_asia_mandala_task_contract_events.3000.c: "Velmi dobře. Připojme se k oslavám."
 fearful_population_modifier: "Vyděšené obyvatelstvo"
 fearful_population_modifier_desc: "Devaraja zajistil, že zde může být uctíván pouze on."
 mandala_realm_contract_0022_contract: "Hádající se mniši"
 mandala_realm_contract_0022_desc: "[CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)|U] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] vypukl spor o půdu mezi dvěma místními kláštery. Jste povoláni obnovit pokoj."
 mandala_realm_contract_0022_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0022_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.3100.t: "$mandala_ritual_prefix$ Hádající se mniši"
 tgp_east_asia_mandala_task_contract_events.3100.desc: "„[ritual_location.GetName|U] nám právem náleží, ty [local_character_2.Custom2('CZ_InsultNoun_V', local_character)|l]!“ vykřikne jeden z přítomných asketů hlasem ostrým jako zvon. Druhá strana bez pohnutí odvětí: „Ať [local_character_2.GetFaith.WarGodName] smete tebe i tvůj klášter z povrchu země!“\n\nVzduch jiskří zuřivostí, ale můj příchod hádku utiší. Teď oba čekají na můj rozsudek."
 tgp_east_asia_mandala_task_contract_events.3100.a: "Nyní vynesu své božské rozhodnutí."
 tgp_east_asia_mandala_task_contract_events.3100.b: "Pro obě strany vyrostou nové svatyně."
 tgp_east_asia_mandala_task_contract_events.3100.c: "Budete se muset o půdu podělit."
 new_shrines_modifier: "Nové svatyně"
 new_shrines_modifier_desc: "Devaraja postavil nové svatyně, aby uhasil klášterní hašteření v této provincii."
 upset_monks_modifier: "Nespokojení mniši"
 upset_monks_modifier_desc: "Kláštery v tomto okrese se hašteří a hádají."
 tgp_east_asia_mandala_task_contract_events.3100.a.success: "Úspěšně naleznete kompromis"
 tgp_east_asia_mandala_task_contract_events.3100.a.failure: "Situace eskaluje"
 mandala_realm_contract_0023_contract: "Očistit bojiště"
 mandala_realm_contract_0023_desc: "Pole [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')], kdysi zbrocené bojem, nyní sužuje vesničany nočními můrami — žádají tě, o jejich očištění."
 mandala_realm_contract_0023_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0023_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.3200.t: "$mandala_ritual_prefix$ Očistit bojiště"
 tgp_east_asia_mandala_task_contract_events.3200.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U],“ říká stařešina, jehož výraz je zastřen starostmi. „Jedno z našich polí bylo kdysi bojiště. Krev z něj vyrušila duchy — nyní nás sužují v našich snech.“\n\n„Musíš pole očistit bosým průvodem — a na čas odložit své zbraně. Nech zemi zapomenout tíhu oceli, a duchové zase usnou.“ "
 tgp_east_asia_mandala_task_contract_events.3200.a: "Přísahám, že nastane mír."
 tgp_east_asia_mandala_task_contract_events.3200.b: "Procesí povedeš ty."
 tgp_east_asia_mandala_task_contract_events.3200.c: "Zpěv duchům postačí."
 plagued_by_nightmares_modifier: "Neočistěná bojiště"
 plagued_by_nightmares_modifier_desc: "Poté, co Devaraja odmítl bojiště očistit, byli sedláci sužováni nočními můrami a stali se méně produktivními."
 mandala_realm_contract_0024_contract: "Požehnat tkalcům"
 mandala_realm_contract_0024_desc: "Tkací dělníci [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] tě prosí, o požehnání pro své stavy a úspěch při práci."
 mandala_realm_contract_0024_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0024_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.3300.t: "$mandala_ritual_prefix$ Požehnat tkalcům"
 tgp_east_asia_mandala_task_contract_events.3300.desc: "Když přijíždíme do [CZProvName(ritual_location,'G')], přivítá nás úklona [local_character.Custom('CZ_TitledFirstName_G')]. „Na našich stavech vznikají obrazy posvátných bytostí. [ROOT.Char.GetFaith.WealthGodName|U], [ROOT.Char.GetFaith.HealthGodName] a nyní i ty, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ zazní při rozvíjení pestrých tapisérií.\n\n„Požehnej našemu řemeslu prosperitou a naší vesnici pokojem. Vlastnoručně utkej symbol, který budeme uctívat.“"
 tgp_east_asia_mandala_task_contract_events.3300.a: "Ze zlata a hedvábí utkám podobu, v níž se zjevuje [ROOT.Char.GetFaith.WealthGodName]."
 tgp_east_asia_mandala_task_contract_events.3300.b: "Na obraze lemovaném stříbrem ať se zjeví [ROOT.Char.GetFaith.HealthGodName]."
 tgp_east_asia_mandala_task_contract_events.3300.c: "Jednoduché tkaní zobrazující [ROOT.Char.GetFaith.DivineRealm|l] postačí."
 healthgod_symbol_modifier: "Klidné tkalcovské cechy"
 healthgod_symbol_modifier_desc: "Tkalci v této provincii vytvářejí krásné obrazy bohů zdraví a dlouhověkosti."
 wealthgod_symbol_modifier: "Prosperující tkalcovské cechy"
 wealthgod_symbol_modifier_desc: "Tkalci v této provincii vytvářejí nádherné obrazy bohů představujících prosperitu a bohatství."
 mandala_realm_contract_0025_contract: "Lámání kopí"
 mandala_realm_contract_0025_desc: "Starší [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] tě žádají o přelomení ceremoniální kopí jako znamení konce místních krvavých sporů."
 mandala_realm_contract_0025_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0025_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.3400.t: "$mandala_ritual_prefix$ Lámání kopí"
 tgp_east_asia_mandala_task_contract_events.3400.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], dnes je radostný den!“ usmívá se vesnické představenstvo. „Dlouhý svár skončil. Naši synové už nemusejí zbytečně umírat!“\n\n„Teď žádáme jen mír. Vezmi naše oštěpy a přelom je nad ohněm, aby duchové poznali naše úmysly.“"
 tgp_east_asia_mandala_task_contract_events.3400.a: "Dokonce zlomím i své vlastní kopí — zavládne mír."
 tgp_east_asia_mandala_task_contract_events.3400.b: "Kopí budou zlomena."
 tgp_east_asia_mandala_task_contract_events.3400.c: "Stačí zlomit jedno kopí."
 sworn_peace_tt: "Složil jste slib nevyhlašovat žádné války!"
 unable_to_declare_war_tt: "@alert_icon! #alert_trial Slibujete, že po dobu 5 let nevyhlásíte žádné války!#!!"
 feudless_village_modifier: "Vesnice bez svárů"
 feudless_village_modifier_desc: "Vesnice v této provincii rozbila všechna svá kopí na oslavu míru."
 mandala_realm_contract_0026_contract: "Guruův mír"
 mandala_realm_contract_0026_desc: "Místní guru hlásá mír, aby děti [CZPrepZ(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'G')] mohly vyrůstat při orbě polí místo umírání v rozbrojích."
 mandala_realm_contract_0026_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0026_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.3500.t: "$mandala_ritual_prefix$ Guruův mír"
 tgp_east_asia_mandala_task_contract_events.3500.desc: "„Vznešený [ROOT.Char.GetTitleAsNameNoTooltip], jsem guru [local_character.GetFirstName] — vedu lid [CZProvName(ritual_location,'G')],“ říká [GetTrait('devoted').GetName( local_character )], jehož hlas zní s jistotou přesvědčení. „[Select_CString(local_character.IsFemale,'Zavolala','Zavolal')|U] jsem tě sem, protože tato země potřebuje ruce, které budou obdělávat půdu, ne svírat kopí.“\n\n„Nech syny rolníků orat pole svých otců — nech vyrůst generaci, která pozná pravý klid.“"
 tgp_east_asia_mandala_task_contract_events.3500.a: "Poznají klid — a budete kráčet po mém boku."
 tgp_east_asia_mandala_task_contract_events.3500.b: "Mám se ještě co učit, přidáš se ke mně?"
 tgp_east_asia_mandala_task_contract_events.3500.c: "Jejich kopí slouží mému božství."
 generation_of_peace_modifier: "Generace míru"
 generation_of_peace_modifier_desc: "Generace rolníků může vyrůstat v míru, odvod jim nebude uložen."
 mandala_realm_contract_0027_contract: "Edikt usmíření"
 mandala_realm_contract_0027_desc: "Starší [CZPrepZ(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'G')] tě žádá, o zákaz ozbrojených hlídek a vydání nařízení, že všechny spory musí být řešeny smírčím řízením."
 mandala_realm_contract_0027_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0027_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.3600.t: "$mandala_ritual_prefix$ Edikt usmíření"
 tgp_east_asia_mandala_task_contract_events.3600.desc: "„Vznešený [ROOT.Char.GetTitleAsNameNoTooltip], [CZPrepV(ritual_location.GetNameNoTooltip)] [CZProvName(ritual_location,'L')] se spory řeší kopím a ohněm — ne slovy,“ říká stařešina a pokládá přede mě velkou kamennou desku spolu s nástroji na rytí. „Tvá slova jsou zákon božský. Vyryj mír do kamene a ukonči násilí.“\n\nBeru nástroje do ruky. Vyryji..."
 tgp_east_asia_mandala_task_contract_events.3600.a: "...že zbraně jsou zakázány."
 tgp_east_asia_mandala_task_contract_events.3600.b: "...že spory musí být řešeny slovem."
 tgp_east_asia_mandala_task_contract_events.3600.c: "...že má dobrota i velikost neznají mezí."
 weapon_ban_modifier: "Nápis zákazu zbraní"
 weapon_ban_modifier_desc: "Žádné zbraně nejsou povoleny na základě dekretu Devaraji."
 arbitration_edict_modifier: "Nápis arbitráže"
 arbitration_edict_modifier_desc: "Spor musí být vyřešen pouze slovy, dle dekretu Devaraji."
 mandala_realm_contract_0028_contract: "Osmidílná stezka"
 mandala_realm_contract_0028_desc: "Místní vůdce žádá, abyste tiše prošli osmi vesnicemi — po jedné u každého rohu [TaskContract.GetLocation.GetNameNoTooltip]."
 mandala_realm_contract_0028_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0028_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.3700.t: "$mandala_ritual_prefix$ Osmidílná stezka"
 tgp_east_asia_mandala_task_contract_events.3700.desc: "„Země [ritual_location.GetName] je plná vesnic — i únavy, soupeření a neřesti,“ pronese stařešina a rozhlédne se s rozmáchlým gestem. „Osm z nich obklopuje nebezpečné místo, kterému říkáme [ritual_location.Custom('GetRandomRegionalDangerSingular')|l]. Každá leží v jiném směru.“\n\n„Chceš-li je naučit následovat [Glossary('ušlechtilou osmidílnou stezku', 'EIGHTFOLD_PATH_GLOSS')], musíš si ji projít. Osm vesnic, osm břemen. Bez odpočinku a pohodlí. Pak pochopí, co znamená pravé a spravedlivé úsilí.“"
 tgp_east_asia_mandala_task_contract_events.3700.a: "Vydržím to jako bódhisattva."
 tgp_east_asia_mandala_task_contract_events.3700.b: "Půjdu po té cestě, i když i já si musím odpočinout."
 tgp_east_asia_mandala_task_contract_events.3700.c: "Na koni to půjde rychleji..."
 EIGHTFOLD_PATH_GLOSS: "Centrální doktrína buddhismu, popisující osm zásad správného života — Správné pochopení, Správný záměr, Správná řeč, Správné jednání, Správné živobytí, Správné úsilí, Správná bdělost a Správné soustředění.\n\nPodobné ideály byly ctěny v hinduistických, animistických a synkretických tradicích v jižní a jihovýchodní Asii jako vodítko k osobní i společenské harmonii."
 eightfold_path_modifier: "Osmidílná stezka"
 eightfold_path_modifier_desc: "Devaraja zde projevil ctnosti [Glossary('Eightfold Path', 'EIGHTFOLD_PATH_GLOSS')]."
 walked_the_eightfold_path_modifier: "Prošel Osmidílnou stezkou"
 walked_the_eightfold_path_modifier_desc: "Tento Devaraja projevil ctnosti [Glossary('Eightfold Path', 'EIGHTFOLD_PATH_GLOSS')] tím, že prošel osmi vesnicemi bez odpočinku."
 mandala_realm_contract_0029_contract: "Ohrožený posvátný háj"
 mandala_realm_contract_0029_desc: "Posvátný háj [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] ohrožují pytláci a dřevorubci. Místní tě prosí, o ponechání bojovníků zde k jeho ochraně."
 mandala_realm_contract_0029_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0029_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.3800.t: "$mandala_ritual_prefix$ Ohrožený posvátný háj"
 tgp_east_asia_mandala_task_contract_events.3800.desc: "„Naše posvátné háje byly zneuctěny, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')],“ říkají místní [Select_CString(local_character.IsFemale,'lesnice','lesníci')] a ukazují na mýtinu. „Roste tu [ritual_location.Custom('GetRandomRegionalWood')|l], ale teď se zde usadili pytláci, zloději a dřevorubci. Prosíme, pošli vojáky, ať tu křivdu napraví a země znovu vzkvétá.“"
 tgp_east_asia_mandala_task_contract_events.3800.a: "Moji ozbrojenci budou háje střežit."
 tgp_east_asia_mandala_task_contract_events.3800.b: "Garnizon [CZPrepV(county_scope.GetNameNoTooltip)] [county_scope.Custom('CZ_LandedNameNoTooltip_L')] ochrání tato území."
 tgp_east_asia_mandala_task_contract_events.3800.c: "Požehnání očistí poskvrnu."
 well_protected_groves_modifier: "Dobře chráněné háje"
 well_protected_groves_modifier_desc: "Háje v této provincii jsou dobře chráněné."
 garrisoned_groves_modifier: "Garnizonem střežené háje"
 garrisoned_groves_modifier_desc: "Háje v této provincii střeží hlavní garnizon, což rozptyluje jeho síly."
 mandala_realm_contract_0030_contract: "Přísaha ticha"
 mandala_realm_contract_0030_desc: "[TaskContract.GetLocation.GetNameNoTooltip|U] vás žádá, abyste učinil veřejný slib nenásilí — sedět v tichu po několik dní, abyste je naučil klidu."
 mandala_realm_contract_0030_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0030_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.3900.t: "$mandala_ritual_prefix$ Přísaha ticha"
 tgp_east_asia_mandala_task_contract_events.3900.desc: "Ještě než dorazíme do [CZProvName(ritual_location,'G')], slyšíme křik, hádky a neustálý hluk. Tady vládne všechno, jen ne pokoj.\n\n„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], pokud se ztišíš, ztiší se i ostatní. Pokud v tobě zavládne mír, zavládne i v nich,“ prosí [Select_CString(local_character.IsFemale,'vesnická představená','vesnický představený')]. „Prokaž své božství a vysvoboď nás z těchto svárů.“"
 tgp_east_asia_mandala_task_contract_events.3900.a: "Nechť uplynou tři měsíce v tichu a nastane klid."
 tgp_east_asia_mandala_task_contract_events.3900.b: "Týden ticha utiší neklid."
 tgp_east_asia_mandala_task_contract_events.3900.c: "Procházka městem by všechny uklidnila."
 discordant_town_modifier: "Město plné sporů"
 discordant_town_modifier_desc: "Tuto provincii sužují spory a hádky."
 mandala_realm_contract_0031_contract: "Pokládání základního kamene"
 mandala_realm_contract_0031_desc: "Vesničané [CZPrepZ(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'G')] chtějí vztyčit stavbu ve vaší poctě. Požadují ceremoniální složení zbraní před zahájením stavby."
 mandala_realm_contract_0031_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0031_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.4000.t: "$mandala_ritual_prefix$ Pokládání základního kamene"
 tgp_east_asia_mandala_task_contract_events.4000.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], jsme [Glossary('śilpakárové','SILPAKARAS_GLOSS')] [CZPrepZ(ritual_location.GetNameNoTooltip)] [CZProvName(ritual_location,'G')],“ říkají místní řemeslníci. Uklánějí se a zvedají svá kladiva. „Přejeme si vztyčit stavbu ve znamení míru a prosperity.“\n\n„Než však začneme, žádáme, abys pod základy [Select_CString(ROOT.Char.IsFemale,'zakopala','zakopal')] své meče [Glossary('pedang','PEDANG_GLOSS')]. Tím se zaženou násilní duchové a posvětí půda.“"
 tgp_east_asia_mandala_task_contract_events.4000.a: "Nařídím své armádě, aby složila zbraně."
 tgp_east_asia_mandala_task_contract_events.4000.b: "Můj [sacrificial_regiment.GetNameNoTooltip] odevzdá své zbraně."
 tgp_east_asia_mandala_task_contract_events.4000.c: "Pohřbím jeden ze svých mečů do země."
 SILPAKARAS_GLOSS: "Ve sanskrtu označuje Śilpakāra řemeslníka zručného v architektuře či sochařství. Na dvorcích hinduisticko‑buddhistických států v jižní a jihovýchodní Asii tvořili organizované cechy. V khmérských, jávských a indických mandala útvarech často pracovali Śilpakáras pod božským nebo královským patronátem."
 pious_silpakaras_modifier: "Zbožní Śilpakāras"
 pious_silpakaras_modifier_desc: "Skupina zbožných [Glossary('Śilpakāras', 'SILPAKARAS_GLOSS')] pracuje v této provincii."
 ritually_disarmed_modifier: "Rituálně odzbrojený"
 ritually_disarmed_modifier_desc: "Tato postava pohřbila své zbraně jako součást mandalového obřadu."
 mandala_realm_contract_0032_contract: "Smějící se asketa"
 mandala_realm_contract_0032_desc: "Žertovný asketa způsobuje chaos [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')]. Vesničané vás žádají, abyste tohoto rošťáka přelstil."
 mandala_realm_contract_0032_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0032_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.4100.t: "$mandala_ritual_prefix$ Smějící se asketa"
 tgp_east_asia_mandala_task_contract_events.4100.desc: "[CZPrepV(ritual_location.GetNameNoTooltip)|U] [CZProvName(ritual_location,'L')] nás přivítá hlasitý smích. Dav se shromáždil kolem buclaté postavy v rouše askety a napjatě čeká na další slova. „...a teď se podívejte na tu nadutost! Z domu vychází [local_character_2.GetTitledFirstName], povoláním [local_character_2.Custom('dummy_peasant_profession')|l],“ zazní hravým hlasem.\n\nVtom se nad prahem převrhne sud a jeho obsah s ohromným šplouchnutím smáčí [local_character_2.Custom('CZ_TitledFirstName_A')]. „Tak, a pýcha je důkladně vypraná!“ prohlásí asketa a drží se smíchy za břicho. Vesničané propuknou v jásot a nakonec se zasměje i promočená oběť."
 tgp_east_asia_mandala_task_contract_events.4100.a: "Myslíš si, že přelstíš [ROOT.Char.GetTitleAsNameNoTooltip]? Nikdy!"
 tgp_east_asia_mandala_task_contract_events.4100.b: "Musí mě to naučit!"
 tgp_east_asia_mandala_task_contract_events.4100.c: "Je ztělesněním mé vůle."
 mandala_realm_contract_0033_contract: "Lákadlo pro duchy"
 mandala_realm_contract_0033_desc: "Vesničané [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] vás žádají, abyste postavil falešný idol — aby oklamal zlé duchy, kteří jejich území sužují."
 mandala_realm_contract_0033_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0033_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.4200.t: "$mandala_ritual_prefix$ Lákadlo pro duchy"
 tgp_east_asia_mandala_task_contract_events.4200.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], duchové prokleli naši úrodu. Zůstaly jen shnilé zbytky. Jde o plodiny, kterým říkáme [local_character.Custom('RegionalRootVegetablePlural')|l],“ naříká [Select_CString(local_character.IsFemale,'vesnická představená','vesnický představený')] a ukazuje na hromadu dřeva. Leží tu i [ritual_location.Custom('GetRandomImprovisedBridgeMaterial')|l]. „Musíš postavit modlu, která duchy oklame, utiší nebo odláká.“"
 tgp_east_asia_mandala_task_contract_events.4200.a: "Postavím velký idol ve tvaru [local_character.Custom('RegionalRootVegetable')|l], aby je zastrašil."
 tgp_east_asia_mandala_task_contract_events.4200.b: "Idol s mnoha tvářemi představující mě je vypudí."
 tgp_east_asia_mandala_task_contract_events.4200.c: "Uklidní je figurka, v níž se zjevuje [ROOT.Char.GetFaith.HealthGodName]."
 mocked_idol_modifier: "Posměšný idol"
 mocked_idol_modifier_desc: "Idol postavený Devarajou je v této provincii široce zesměšňován."
 vegetable_idol_modifier: "Idol zeleninového ducha"
 vegetable_idol_modifier_desc: "Idol postavený Devarajou je zde považován za zdroj bohaté úrody."
 ruler_idol_modifier: "Idol ducha Devaraja"
 ruler_idol_modifier_desc: "Idol postavený Devarajou je široce považován za ochranu proti zlým duchům."
 mandala_realm_contract_0034_contract: "Hra důvtipu"
 mandala_realm_contract_0034_desc: "Šlechtic [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] vás vyzval ke hře důvtipu — abyste před soudem dokázal svou božskost."
 mandala_realm_contract_0034_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0034_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.4300.t: "$mandala_ritual_prefix$ Hra důvtipu"
 tgp_east_asia_mandala_task_contract_events.4300.desc: "Když dorazíme [CZPrepV(ritual_location.GetNameNoTooltip)] [CZProvName(ritual_location,'L')], spatříme zdejší sídlo — [ritual_location.GetHolding.GetType.GetName|l]. Uvnitř mě vítá [local_character.GetTitledFirstNameNicknamed]. „[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], vyzývám tě ke hře. Bude to [local_character.Custom('BG_GameType_Generic')|l],“ zazní při zvednutí vyřezávané figurky. „Vyhraj a získáš můj respekt. Vyhraj pomocí #EMP klamu#! a má věrnost ti bude patřit navěky.“\n\nSlužebníci přinesou občerstvení. Na stole se objeví [local_character.Custom('GetExpensiveMeal')|l] i [local_character.Custom('GetExpensiveDrink_Singular')|l]. „Pokud však prohraješ... no, pak uvidíme.“"
 tgp_east_asia_mandala_task_contract_events.4300.a: "[ROOT.Char.GetFaith.TricksterGodNamePossessive|U] klam mi pomůže figurky rozhýbat."
 tgp_east_asia_mandala_task_contract_events.4300.b: "Mé dovednosti mě dovedou."
 tgp_east_asia_mandala_task_contract_events.4300.c: "Pouze přátelská hra, nic víc."
 mandala_realm_contract_0035_contract: "Božský zloděj"
 mandala_realm_contract_0035_desc: "Zločinec [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] nese vaši podobu a dopustil se krádeží, přičemž se vydává za vás."
 mandala_realm_contract_0035_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0035_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.4400.t: "$mandala_ritual_prefix$ Božský zloděj"
 tgp_east_asia_mandala_task_contract_events.4400.desc: "„Požaduji tvůj náhrdelník. Je nezbytný pro můj obřad,“ pronese nad konsternovaným vesničanem [Select_CString(local_character.IsFemale,'žena','muž')], až #EMP mrazivě#! podobná postava té mé. „Rychle, nenech božstvo čekat!“\n\nPak se otočí a ztuhne, jakmile mě spatří. „Ó, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]...! Já jen... vybírám daň ve tvém jménu!“ zazní výkřik."
 tgp_east_asia_mandala_task_contract_events.4400.a: "Žádné další kradení — budeš mluvit mým hlasem [CZPrepV(ritual_location.GetNameNoTooltip)] [CZProvNameNoTooltip(ritual_location,'L')]."
 tgp_east_asia_mandala_task_contract_events.4400.b: "Jsi užitečný. Vrátíš se se mnou."
 tgp_east_asia_mandala_task_contract_events.4400.c: "Vrať všechno, co jsi [Select_CString(local_character.IsFemale,'ukradla','ukradl')]."
 omnipresent_authority_modifier: "Všudypřítomná autorita"
 omnipresent_authority_modifier_desc: "Je to téměř tak, jako by Devaraja žil v této provincii vzhledem k tomu, jak často je viděn... ale přece bydlí v hlavním městě, ne?"
 mandala_realm_contract_0036_contract: "Zkouška ducha"
 mandala_realm_contract_0036_desc: "Lidé [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] věří, že je obelstil [TaskContract.GetLocation.Custom('GetProvinceTricksterSpirit')|l]."
 mandala_realm_contract_0036_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0036_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.4500.t: "$mandala_ritual_prefix$ Zkouška ducha"
 tgp_east_asia_mandala_task_contract_events.4500.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], naše vesnice trpí. Škodí nám [ritual_location.Custom('GetProvinceTricksterSpirit')|l],“ naříká [local_character.GetTitledFirstName] s dlaní přitisknutou k čelu. „Studna je plná žab, rýžové koláče přes noc zhořkly a pták [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')|l] děsí děti. A dnes ráno na mě v posteli čekalo další překvapení — #EMP [local_character.Custom('RegionalPoxAnimal')|l]#! spící po mém boku!“\n\nPohled nervózně těká kolem. „Musíš toho šibala přelstít. Připrav falešnou oběť a zkus ho zmást!“"
 tgp_east_asia_mandala_task_contract_events.4500.a: "Svolejte vesnici — já 'obětuji' dítě!"
 tgp_east_asia_mandala_task_contract_events.4500.b: "Použiji kozu vycvičenou k předstírání mdloby."
 tgp_east_asia_mandala_task_contract_events.4500.c: "Nabídnu ovoce... a pak si ho dám k večeři."
 mandala_realm_contract_0037_contract: "Festival převrácení rolí"
 mandala_realm_contract_0037_desc: "Vesnice [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] pořádá festival, kde jsou všechna pravidla otočena naruby."
 mandala_realm_contract_0037_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0037_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.4600.t: "$mandala_ritual_prefix$ Festival převrácení rolí"
 tgp_east_asia_mandala_task_contract_events.4600.desc: "Když přijíždíme do [CZProvName(ritual_location,'G')], dítě s provizorní korunou přeběhne kolem mě. „Jsem [ROOT.Char.GetTitleAsNameNoTooltip]! Pohleďte na mou božskost!“ křičí. Vesnice žije festivalem, kde se role vyměnily: chudí se oblékají jako šlechta, služebníci jednají jako páni a páni nosí podnosy.\n\nKdybych se k nim v přestrojení [Select_CString(ROOT.Char.IsFemale,'přidala','přidal')], nepoznali by mě. Pak by se ukázalo, jak vypadá skutečné božství."
 tgp_east_asia_mandala_task_contract_events.4600.a: "Půjdu jako žebrák."
 tgp_east_asia_mandala_task_contract_events.4600.b: "Půjdu jako voják."
 tgp_east_asia_mandala_task_contract_events.4600.c: "Půjdu jako... já [Select_CString(ROOT.Char.IsFemale,'sama','sám')]."
 mandala_realm_contract_0038_contract: "Kozí orákulum"
 mandala_realm_contract_0038_desc: "Mluvící koza je [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')] vyhlašována za vašeho božského posla."
 mandala_realm_contract_0038_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0038_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.4700.t: "$mandala_ritual_prefix$ Kozí orákulum"
 tgp_east_asia_mandala_task_contract_events.4700.desc: "„Přistupte všichni a pohleďte na božskou kozu, skrze kterou promlouvá [ROOT.Char.GetTitledFirstNameNoTooltip]!“ [local_character.GetTitledFirstName|U] se teatrálně ukloní, zatímco koza hrabe kopytem do země. „...šest, sedm, osm! Osm škrábnutí! To je znamení. Všichni musíme koupit nápoj, který prodává [local_character_2.GetFirstName]: [local_character_2.Custom('GetExpensiveDrink_Singular')|l]!“\n\nPak ke mně vzhlédne a ztuhne. „Ó, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]...! Já... vůbec nevím, jak se to stalo, že tě přehlížím...“\n\nŠikovný šarlatán s vycvičenou kozou. To se může hodit."
 tgp_east_asia_mandala_task_contract_events.4700.a: "Pokud můj 'posel' zaplatí desátku..."
 tgp_east_asia_mandala_task_contract_events.4700.b: "Ty a koza se ke mně přidáte."
 tgp_east_asia_mandala_task_contract_events.4700.c: "...čtyři, pět! Pět škrábnutí — veřejné pokání to bude!"
 punished_charlatan_modifier: "Potrestaný šarlatán"
 punished_charlatan_modifier_desc: "Šarlatán byl zde nedávno prozrazen a potrestán."
 goat_oracle_modifier: "Kozí orákulum"
 goat_oracle_modifier_desc: "Kozí orákulum je v této provincii předváděno a lidé mu přisuzují hlas Devaraji."
 mandala_realm_contract_0039_contract: "Zvířata ve tmě"
 mandala_realm_contract_0039_desc: "Obyvatelé [CZProvNameNoTooltip(TaskContract.GetLocation,'G')] jsou sužováni zvířaty číhajícími [TaskContract.GetLocation.Custom('CZ_TerrainTypeProvince_In')|l]. Prosí vás, abyste je chytl — nebo přelstil."
 mandala_realm_contract_0039_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0039_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.4800.t: "$mandala_ritual_prefix$ Zvířata [ritual_location.Custom('CZ_TerrainTypeProvince_In')|l]"
 tgp_east_asia_mandala_task_contract_events.4800.desc: "Když projíždíme [CZProvName(ritual_location,'I')], cítím neviditelné oči, které nás sledují z [ritual_location.Custom('CZ_TerrainTypeProvince_G')|l]. „[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], nehýbej se,“ zašeptá sedlák. „[ROOT.Char.Custom('RegionalOnlyFerociousAnimalPlural')|U] — a další bestie — jsou všude. Odlákejte je, chytíte je do pasti — prosíme vás, něco udělejte.“"
 tgp_east_asia_mandala_task_contract_events.4800.a: "Chytíme je; jejich kožešiny ozdobí můj trůn."
 tgp_east_asia_mandala_task_contract_events.4800.b: "Vyžeňme je, zdejší krajina – [ritual_location.Custom('TerrainTypeProvince')|l] – bude naším štítem."
 tgp_east_asia_mandala_task_contract_events.4800.c: "Ne, oni jsou mými posly."
 beast_free_modifier: "Bez zvířat"
 beast_free_modifier_desc: "Tuto provincii očistil od nebezpečných zvířat mocný Devaraja."
 brimming_with_beasts_modifier: "Plná šelem"
 brimming_with_beasts_modifier_desc: "Tato provincie je plná útočných zvířat, která si pochutnávají na cestovatelích."
 gain_hunt_artifact_tt: "Získáte lovecký [Concept('artifact','artefakt')|E]"
 mandala_realm_contract_0040_contract: "Říční Nāga"
 mandala_realm_contract_0040_desc: "Vesničané jsou přesvědčeni, že v řekách [TaskContract.GetLocation.GetNameNoTooltip] přebývá [Glossary('nāga', 'NAGA_GLOSS')]. Požadují, abyste ho odlákal pryč."
 mandala_realm_contract_0040_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0040_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.4900.t: "$mandala_ritual_prefix$ Říční Nāga"
 tgp_east_asia_mandala_task_contract_events.4900.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], mstivý [Glossary('nāga', 'NAGA_GLOSS')] číhá v řekách [ritual_location.GetName],“ prosí třesoucí se [Select_CString(local_character.IsFemale,'žena','muž')|l]. „Deset vesničanů je pryč — stáhli je pod hladinu. Musíte ho odlákat dřív, než vezme další!“\n\nJezdíme podél břehu řeky, vzduch je hustý mlhou a strachem. Pak — pohyb v rákosí. Není to žádná nāga, ale monstrózní krokodýl, obrovský a pradávný, říční bůh ve svém chrámu."
 tgp_east_asia_mandala_task_contract_events.4900.a: "[entourage_character.Custom('CZ_FirstNameNoTooltip_V')|U], vezmi toto maso — musíme ho chytit!"
 tgp_east_asia_mandala_task_contract_events.4900.b: "Zasypte ho šípy, nesmíme mu dovolit přežít."
 tgp_east_asia_mandala_task_contract_events.4900.c: "Slouží mi, držte se pryč od řek."
 river_crocodile_god_modifier: "Krokodýlí bůh"
 river_crocodile_god_modifier_desc: "Obrovský krokodýl, často zaměňovaný za [Glossary('nāga', 'NAGA_GLOSS')], číhá ve vodách této provincie — požírá obléhající armády a děsí sedláky."
 mandala_realm_contract_0041_contract: "Zaslíbená země"
 mandala_realm_contract_0041_desc: "Velká skupina poutníků hledá svou 'zaslíbenou zemi' někde [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvNameNoTooltip(TaskContract.GetLocation,'L')]."
 mandala_realm_contract_0041_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
 mandala_realm_contract_0041_request: "Dostav se [CZPrepV(TaskContract.GetLocation.GetNameNoTooltip)] [CZProvName(TaskContract.GetLocation,'L')] a rozhodni se podle svého [Concept('mandala_aspect','aspektu mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.5000.t: "$mandala_ritual_prefix$ Zaslíbená země"
 tgp_east_asia_mandala_task_contract_events.5000.desc: "Po jízdě přes [ritual_location.Custom('CZ_TerrainTypeProvince_A')|l] v okolí [CZProvName(ritual_location,'G')] konečně spatříme stovky slabých a vyčerpaných poutníků.\n\n[local_character.GetTitledFirstName|U] vstane a hlas se chvěje únavou: „Přišli jsme jako poutníci víry [local_character.GetFaith.GetName] a hledáme zaslíbenou zemi. Přicházíš nás vysvobodit? Jsi [ROOT.Char.GetTitleAsNameNoTooltip], nebo snad bůh?“"
 tgp_east_asia_mandala_task_contract_events.5000.a: "Jsem [local_character.GetFaith.TricksterGodName], váš domov je [CZPrepV(ruler_capital_county.GetNameNoTooltip)] [ruler_capital_county.Custom('CZ_LandedNameNoTooltip_L')]."
 tgp_east_asia_mandala_task_contract_events.5000.b: "Jsem Devaraja a [ritual_location.GetNameNoTooltip] je vaše zaslíbená země."
 tgp_east_asia_mandala_task_contract_events.5000.c: "Jsem [ROOT.Char.GetTitleAsNameNoTooltip] a přeji vám štěstí při hledání."
