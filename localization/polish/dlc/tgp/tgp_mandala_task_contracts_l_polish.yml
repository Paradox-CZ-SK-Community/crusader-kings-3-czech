 mandala_provincial_ritual_desc_01: "Naše víra je ve tvých rukou. S nadšením očekáváme tvou přítomnost a tvé požehnání."
 mandala_provincial_ritual_desc_02: "Okvětní plátky vadnou a s nimi i náš klid. Dychtivě očekáváme, že tvá přítomnost obnoví naše duše i mysl."
 mandala_followers_doubting: "Poddaní požadují [Concept('mandala_rituals','rituály mandaly')|E]"
 tgp_east_asia_mandala_task_contract_events.0990.t: "$mandala_ritual_prefix$ Mám pochybnosti"
 tgp_east_asia_mandala_task_contract_events.0990.desc: "Rozmýšlím a znovu přehodnocuji své plány odcestovat do [ongoing_destination.GetTitle.Custom('CZ_LandedName_G')] vykonat rituály.\n\nJe opravdu teď ten pravý čas cestovat? Nebylo by lépe svůj čas využít jinde? Důležité úvahy pro náboženskou ikonu."
 tgp_east_asia_mandala_task_contract_events.0990.a: "Lidé [CZPrepZ(ongoing_destination.GetNameNoTooltip)] [CZProvNameNoTooltip(ongoing_destination,'G')] mě očekávají!"
 tgp_east_asia_mandala_task_contract_events.0990.a_tt: "$governor_contract_event.1012.a_tt$"
 tgp_east_asia_mandala_task_contract_events.0990.b: "$governor_contract_event.1012.b$"
 tgp_east_asia_mandala_task_contract_events.0990.b_tt: "Úkol [ongoing_contract.GetType.GetName] [CZPrepV(ongoing_destination.GetNameNoTooltip)] [CZProvName(ongoing_destination,'L')] je opuštěn"
 tgp_east_asia_mandala_task_contract_events.1000.t.creation: "$mandala_ritual_prefix$ Přijetí Stvořitele"
 tgp_east_asia_mandala_task_contract_events.1000.t.serenity: "$mandala_ritual_prefix$ Přijetí Klidu"
 tgp_east_asia_mandala_task_contract_events.1000.t.destruction: "$mandala_ritual_prefix$ Přijetí Ničitele"
 tgp_east_asia_mandala_task_contract_events.1000.t.trickery: "$mandala_ritual_prefix$ Přijetí Šibalství"
 tgp_east_asia_mandala_task_contract_events.1000.desc.creation: "#EMP Stvoření.#!! Život je křehký a musíme o něj co nejlépe pečovat. Péče o lidi, zvířata a přírodu nám vrací sílu mnohonásobně. Při práci na místní zeleni se rozhlédnu kolem sebe.\n\nDěti, dospělí i starci se scházejí, aby oslavili život. Ti nejmenší radostně hrabou v hlíně provizorními nástroji a sázejí semínka.\n\nMezi nejhorlivější účastníky patří [local_character.GetTitledFirstName]. Po čele stéká pot, ale tvář se usmívá. Očekávající pohled čeká na mé další pokyny."
 tgp_east_asia_mandala_task_contract_events.1000.desc.serenity: "Jemné šustění v korunách stromů. Ohlédnu se a vidím ženy, muže, starší i mladší, dokonce i několik batolat, jak se účastní obřadu a tiše napodobují moje pohyby.\n\n#EMP Ohni se. Protáhni se. Dýchej. Narovnej se. Dýchej.#!!\n\nPo obřadu ke mně ochotně přiběhne [local_character.GetTitledFirstName] a ptá se, jak má dále postupovat."
 tgp_east_asia_mandala_task_contract_events.1000.desc.destruction: "Hranice dřeva hoří. Oběti byly přineseny. Pozoruji mocné ukázky síly, při nichž místním vládne [local_character.GetTitledFirstName] se svými nejsilnějšími lidmi. A nad nimi stojím já.\n\nVšichni dychtí sloužit a odvrátit zlo dřív, než pohltí stvoření. Naše stvoření.\n\nSpolečně se na mě obracejí. V každé tváři se zračí stejná otázka: co jim přikážu dál?"
 tgp_east_asia_mandala_task_contract_events.1000.desc.trickery: "Iluze, úskoky a hrátky s myslí druhých. Všechno v dobrém. Všechno #EMP neškodné#!!. Až do chvíle, kdy už není.\n\nObyvatelé [CZProvName(ritual_location,'G')] při mých obřadech nevědomky odhalují nejhlubší tajemství. Ti, kteří můj záměr prohlédnou, by měli vést stádo a sloužit jen v mém jménu...\n\n[local_character.GetTitledFirstName|U] na mě mazaně pohlédne a čeká, jaký další příkaz mám pro shromážděný dav."
 tgp_east_asia_mandala_task_contract_events.1000.a: "Měli by se soustředit na uctívání mě."
 tgp_east_asia_mandala_task_contract_events.1000.b: "Ať se koupou v mé slávě!"
