l_polish:
 tgp_china_ministry.0001.t: "$great_project_type_grand_campaign_project$: Kupředu"
 tgp_china_ministry.0001.desc: "[great_project.GetName|U] je v plném proudu. V sázce jsou hrdost i ambice [owner.Custom('CZ_Name_G')].\n\n„Je velikou ctí podílet se na dějinách, které se právě píší,“ prohlašuje hrdě [contributor.GetName]. „Naše vítězství nad [defender.Custom('CZ_Name_I')] bude rychlé a budoucí básníci je budou opěvovat. Brzy bude celé území [target_title.GetName] pod vládou Nebes!“"
 tgp_china_ministry.0001.a: "Ať [GetTitleByKey('h_china').GetNameNoTooltip|U] vzkvétá!"
 tgp_china_ministry.0002.t: "$great_project_type_grand_campaign_project$: Úspěch"
 tgp_china_ministry.0002.desc: "[great_project.GetName|U] slaví vítězství nad [defender.Custom('CZ_Name_I')].\n\n„Brzy podřídíme Nebesům celé území [target_title.GetName]!“ prohlašuje sebejistě [attacker.GetName]."
 tgp_china_ministry.0002.a: "„Kupředu!“"
 tgp_china_ministry.0003.t: "$great_project_type_grand_campaign_project$: Neúspěch"
 tgp_china_ministry.0003.desc: "[great_project.GetName|U] končí porážkou v boji s [defender.Custom('CZ_Name_I')].\n\n„Jen drobná překážka na cestě k vítězství!“ ujišťuje [attacker.GetName]."
 tgp_china_ministry.0003.a: "„Dochází mi trpělivost.“"
 tgp_china_ministry.0004.t: "$great_project_type_grand_campaign_project$: Ještě dál"
 tgp_china_ministry.0004.desc: "[great_project.GetName|U] je již v plném proudu. [contributor.GetName|U] prohlašuje ochotu připojit se k válečnému úsilí.\n\n„Slabá vláda [title_holder.Custom('CZ_Name_G')] se nemůže měřit s mocí [GetTitleByKey('h_china').Custom('CZ_LandedName_G')]. Už mám plán, jak dobýt [target_title.Custom('CZ_LandedName_A')].“"
 tgp_china_ministry.0004.a: "Území [target_title.GetNameNoTierNoTooltip] už můžeš považovat za podřízené Nebesům."
 grand_campaign_added_war_target_tt: "Do [Concept('war','války')|E] #V [grand_campaign_war.GetName]#! byl přidán sporný [Concept('title','titul')|E] [target_title.GetName], který je nyní také válečným cílem"
 tgp_china_ministry.0005.t: "$great_project_type_grand_campaign_project$: Soumrak"
 tgp_china_ministry.0005.desc_won: "[great_project.GetName|U] skončil velkým úspěchem. Území [target_kingdom.Custom('CZ_LandedName_G')] je nyní nedílnou součástí [GetTitleByKey('h_china').Custom('CZ_LandedName_G')].\n\n„Očekávaný výsledek, ale přesto důvod k oslavě,“ raduje se císař. „Ať se lid dozví, že [ROOT.Char.GetPrimaryTitle.GetName] nemá pod Nebesy sobě rovného!“"
 tgp_china_ministry.0005.desc_lost: "[great_project.GetName|U] skončil naprostou pohromou. Území [target_kingdom.Custom('CZ_LandedName_G')] odolalo moci [GetTitleByKey('h_china').Custom('CZ_LandedName_G')].\n\n„Nečekaný výsledek,“ pronáší [owner.GetTitleAsName], jen stěží ovládající svůj hněv. „Ať se lid dozví, jakou hanbu Nebesům přinesla porážka [ROOT.Char.GetPrimaryTitle.Custom('CZ_LandedName_G')]!“"
 tgp_china_ministry.0005.a_win: "Velkolepé úsilí!"
 tgp_china_ministry.0005.a_lost: "Všichni v [GetTitleByKey('h_china').Custom('CZ_LandedName_L')] by se měli stydět."
 tgp_china_ministry.0006.opening: "[founder.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 tgp_china_ministry.0006.desc: "S politováním ti oznamuji, že projekt [great_project.GetName] musí být zrušen."
 tgp_china_ministry.0006.a: "Jaká škoda."
 tgp_china_ministry.0007.t: "$tgp_china_ministry.0001.t$"
 tgp_china_ministry.0007.desc: "$tgp_china_ministry.0001.desc$"
 tgp_china_ministry.0007.a: "$tgp_china_ministry.0001.a$"
 tgp_china_ministry.0100.t: "[ROOT.Char.GetPrimaryTitle.Custom('CZ_AdjectiveNoTooltip_aa')|U] pokladnice"
 tgp_china_ministry.0100.intro: "Nastal čas přezkoumat rozpočet [ROOT.Char.Custom('GetRealmRank')|l]."
 tgp_china_ministry.0100.steward_desc: "Přede mnou stojí [steward.GetName] se svraštělým čelem a účetní knihou v ruce. V patách se táhne malá armáda pomocníků obtěžkaných svitky, spisy a finančními záznamy.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], #EMP musíme#! projít naše výdaje a připravit nový rozpočet pokladnice. Obávám se, že to nesnese odkladu.“"
 tgp_china_ministry.0100.solo_desc: "Obklopuje mě malá armáda úředníků obtěžkaných svitky, spisy a finančními záznamy. Všichni čekají, až dokončím svou kontrolu.\n\n"
 tgp_china_ministry.0100.income_desc: "Naše současné příjmy výrazně převyšují výdaje."
 tgp_china_ministry.0100.deficit_desc: "Naše výdaje jsou příliš vysoké. Pokud nezasáhneme, pokladnici hrozí zhroucení."
 tgp_china_ministry.0100.fallback_desc: "Od schválení posledního rozpočtu uplynulo již několik let."
 tgp_china_ministry.0100.a: "Nuže dobrá. Stanovíme nový rozpočet."
 tgp_china_ministry.0100.b: "Ponecháme příděly beze změny."
 tgp_china_ministry.0100.c: "V této záležitosti důvěřuji tvému úsudku."
 tgp_china_ministry.0100.a_tooltip: "Budeš si moci vybrat [Concept('treasury_budget','rozpočet pokladnice')|E] z několika možností"
 single_quotation_desc: """
 tgp_china_ministry.0101.desc: "Přede mnou leží několik dokumentů s návrhy, z nichž každý nabízí jiný způsob hospodaření s pokladnicí. Kam nasměrovat výdaje a kde naopak utáhnout měšec?\n\nKterý z nich si mám vybrat?"
 tgp_china_ministry.0101.a: "Především se musíme zaměřit na platy."
 tgp_china_ministry.0101.b: "Zajistěme všem ministrům štědrý podíl."
 tgp_china_ministry.0101.c: "Silné vojsko je základem silného panství."
 tgp_china_ministry.0101.d: "Vyhraďme větší část prostředků výhradně pro císařské potřeby."
 tgp_china_ministry.0101.e: "Nejlépe nám poslouží vyvážené hospodářství."
 tgp_treasury_enact_salary_budget_info_desc: "Zaměření [Concept('treasury_budget_category','rozpočtové kategorie')|E]: @gold_icon![Concept('treasury_salary_budget_short','Plat')|E]\n[Concept('treasury_budget','Rozpočet pokladnice')|EU], který obvykle vítají [Concept('governors','guvernéři')|E]. Pokud jim nové rozdělení prostředků zvýší platy, může se zlepšit jejich mínění o tobě."
 tgp_treasury_enact_ministry_budget_info_desc: "Zaměření [Concept('treasury_budget_category','rozpočtové kategorie')|E]: @government_type_celestial![Concept('treasury_ministry_budget_short','Ministerstvo')|E]\n[Concept('treasury_budget','Rozpočet pokladnice')|EU], který obvykle vítají [Concept('ministers','ministři')|E]. Získají totiž další prostředky, které mohou využít k plnění svých povinností, například k zahajování [Concept('great_projects','velkých projektů')|E]."
 tgp_treasury_enact_military_budget_info_desc: "Zaměření [Concept('treasury_budget_category','rozpočtové kategorie')|E]: @celestial_military_administration![Concept('treasury_military_budget_short','Vojenský')|E]\n[Concept('treasury_budget','Rozpočet pokladnice')|EU], který obvykle vítají vojenští [Concept('governors','guvernéři')|E]. Získají totiž další prostředky na nábor a vydržování [Concept('title_men_at_arms','titulových ozbrojenců')|E]."
 tgp_treasury_enact_hegemon_budget_info_desc: "Zaměření [Concept('treasury_budget_category','rozpočtové kategorie')|E]: @legitimacy_icon_mandate![Concept('son_of_heaven','Syn Nebes')|E]\n[Concept('treasury_budget','Rozpočet pokladnice')|EU], který ponechává větší část prostředků z [Concept('treasury','pokladnice')|E] bez pevného přidělení, aby s nimi mohl [Concept('liege','lenní pán')|E] nakládat podle vlastního uvážení."
 tgp_treasury_enact_balanced_budget_info_desc: "Zaměření [Concept('treasury_budget_category','rozpočtové kategorie')|E]: @law_icon!Vyvážený\n[Concept('treasury_budget','Rozpočet pokladnice')|EU], jehož cílem je rovnoměrně rozdělit prostředky z [Concept('treasury','pokladnice')|E] mezi všechny rozpočtové kategorie."
 tgp_treasury_enact_salary_budget_desc: "Zavedeš [Concept('treasury_budget','rozpočet pokladnice')|E] s následujícím rozdělením:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[Concept('treasury_salary_budget','Rozpočet na platy')|EU] bude nastaven na [GetLaw('budget_allocation_salary_45').GetShortName|V]\n$EFFECT_LIST_BULLET$[Concept('treasury_ministry_budget','Rozpočet ministerstva')|EU] bude nastaven na [GetLaw('budget_allocation_ministry_25').GetShortName|V]\n$EFFECT_LIST_BULLET$[Concept('treasury_military_budget','Vojenský rozpočet')|EU] bude nastaven na [GetLaw('budget_allocation_military_20').GetShortName|V]#!"
 tgp_treasury_enact_ministry_budget_desc: "Zavedeš [Concept('treasury_budget','rozpočet pokladnice')|E] s následujícím rozdělením:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[Concept('treasury_salary_budget','Rozpočet na platy')|EU] bude nastaven na [GetLaw('budget_allocation_salary_25').GetShortName|V]\n$EFFECT_LIST_BULLET$[Concept('treasury_ministry_budget','Rozpočet ministerstva')|EU] bude nastaven na [GetLaw('budget_allocation_ministry_45').GetShortName|V]\n$EFFECT_LIST_BULLET$[Concept('treasury_military_budget','Vojenský rozpočet')|EU] bude nastaven na [GetLaw('budget_allocation_military_20').GetShortName|V]#!"
 tgp_treasury_enact_military_budget_desc: "Zavedeš [Concept('treasury_budget','rozpočet pokladnice')|E] s následujícím rozdělením:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[Concept('treasury_salary_budget','Rozpočet na platy')|EU] bude nastaven na [GetLaw('budget_allocation_salary_30').GetShortName|V]\n$EFFECT_LIST_BULLET$[Concept('treasury_ministry_budget','Rozpočet ministerstva')|EU] bude nastaven na [GetLaw('budget_allocation_ministry_20').GetShortName|V]\n$EFFECT_LIST_BULLET$[Concept('treasury_military_budget','Vojenský rozpočet')|EU] bude nastaven na [GetLaw('budget_allocation_military_40').GetShortName|V]#!"
 tgp_treasury_enact_hegemon_budget_desc: "Zavedeš [Concept('treasury_budget','rozpočet pokladnice')|E] s následujícím rozdělením:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[Concept('treasury_salary_budget','Rozpočet na platy')|EU] bude nastaven na [GetLaw('budget_allocation_salary_30').GetShortName|V]\n$EFFECT_LIST_BULLET$[Concept('treasury_ministry_budget','Rozpočet ministerstva')|EU] bude nastaven na [GetLaw('budget_allocation_ministry_25').GetShortName|V]\n$EFFECT_LIST_BULLET$[Concept('treasury_military_budget','Vojenský rozpočet')|EU] bude nastaven na [GetLaw('budget_allocation_military_25').GetShortName|V]#!"
 tgp_treasury_enact_balanced_budget_desc: "Zavedeš [Concept('treasury_budget','rozpočet pokladnice')|E] s následujícím rozdělením:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[Concept('treasury_salary_budget','Rozpočet na platy')|EU] bude nastaven na [GetLaw('budget_allocation_salary_35').GetShortName|V]\n$EFFECT_LIST_BULLET$[Concept('treasury_ministry_budget','Rozpočet ministerstva')|EU] bude nastaven na [GetLaw('budget_allocation_ministry_30').GetShortName|V]\n$EFFECT_LIST_BULLET$[Concept('treasury_military_budget','Vojenský rozpočet')|EU] bude nastaven na [GetLaw('budget_allocation_military_25').GetShortName|V]#!"
 tgp_treasury_enact_meritocratic_salary_budget_desc: "Zavedeš [Concept('treasury_budget','rozpočet pokladnice')|E] s následujícím rozdělením:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[Concept('treasury_salary_budget','Rozpočet na platy')|EU] bude nastaven na [GetLaw('budget_allocation_salary_55').GetShortName|V]\n$EFFECT_LIST_BULLET$[Concept('treasury_military_budget','Vojenský rozpočet')|EU] bude nastaven na [GetLaw('budget_allocation_military_35').GetShortName|V]#!"
 tgp_treasury_enact_meritocratic_military_budget_desc: "Zavedeš [Concept('treasury_budget','rozpočet pokladnice')|E] s následujícím rozdělením:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[Concept('treasury_salary_budget','Rozpočet na platy')|EU] bude nastaven na [GetLaw('budget_allocation_salary_35').GetShortName|V]\n$EFFECT_LIST_BULLET$[Concept('treasury_military_budget','Vojenský rozpočet')|EU] bude nastaven na [GetLaw('budget_allocation_military_55').GetShortName|V]#!"
 tgp_treasury_enact_meritocratic_balanced_budget_desc: "Zavedeš [Concept('treasury_budget','rozpočet pokladnice')|E] s následujícím rozdělením:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[Concept('treasury_salary_budget','Rozpočet na platy')|EU] bude nastaven na [GetLaw('budget_allocation_salary_45').GetShortName|V]\n$EFFECT_LIST_BULLET$[Concept('treasury_military_budget','Vojenský rozpočet')|EU] bude nastaven na [GetLaw('budget_allocation_military_45').GetShortName|V]#!"
 tgp_china_ministry.0200.t: "Ministerský rozpočet"
 tgp_china_ministry.0200.desc: "Znovu přede mnou stojí [minister_of_revenue.GetFirstName], [minister_of_revenue.GetCouncilTitle|l], s účetní knihou v rukou.\n\n„Ujišťuji vás, [ROOT.Char.Custom('FormOfAddressForLiege')|l], že pokud přijmeme můj návrh, pokladnice bude vzkvétat!“"
 tgp_china_ministry.0200.a: "Výborně. Okamžitě jej uveďte v platnost!"
 tgp_china_ministry.0200.b: "Obávám se, že mám s pokladnicí jiné plány."
 tgp_china_ministry.0200.toast_t_success: "Rozpočet schválen"
 tgp_china_ministry.0200.toast_desc_success: "[CZProDrop(treasury_ruler,'schválila','schválil')|U] tvůj návrh"
 tgp_china_ministry.0200.toast_t_failure: "Rozpočet zamítnut"
 tgp_china_ministry.0200.toast_desc_failure: "[CZProDrop(treasury_ruler,'zamítla','zamítl')|U] tvůj návrh"
