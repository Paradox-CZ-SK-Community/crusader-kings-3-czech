l_polish:
 tgp_movement_events.0001.t: "Naostřit čepel"
 tgp_movement_events.0001.desc: "„[ROOT.Char.Custom('CZ_TitledFirstName_V')|U]!“ Přichází ke mně rázným krokem [marshal.GetName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))], [marshal.Custom('quirk_pos_pp')].\n\n„Nemůžeme jen nečinně sedět a čekat jako ovce, až si pro nás přijdou vlci. Možná právě prožíváme fázi [my_situation.GetTopCurrentPhase.GetName|l], ale brzy budeme muset vytáhnout. Na východ, na západ. Na sever i na jih. Naléhavě vás žádám, abyste byli připraveni, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|l].“"
 tgp_movement_events.0001.aa: "„Máš pravdu. Nauč mě, jak se připravit.“"
 tgp_movement_events.0001.a: "Hnutí [my_movement.GetNameNoTooltip] mě vyslyší."
 tgp_movement_events.0001.b: "Musím shromáždit spojence."
 tgp_movement_events.0001.c: "Poučím se od velkých vojevůdců minulosti."
 tgp_movement_events.0001.c.tt: "Získáš [Concept('commander_trait','velitelský rys')|E]"
 event_increase_movement_power_major_effect_tooltip: "[movement_power_i][Concept('movement_power','Síla hnutí')|E] ([GetPlayer.Custom('GetMyMovement')]) se zvýší o [EmptyScope.ScriptValue('event_increase_movement_power_major_value')|+0]"
 event_increase_movement_power_medium_effect_tooltip: "[movement_power_i][Concept('movement_power','Síla hnutí')|E] ([GetPlayer.Custom('GetMyMovement')]) se zvýší o [EmptyScope.ScriptValue('event_increase_movement_power_medium_value')|+0]"
 event_increase_movement_power_minor_effect_tooltip: "[movement_power_i][Concept('movement_power','Síla hnutí')|E] ([GetPlayer.Custom('GetMyMovement')]) se zvýší o [EmptyScope.ScriptValue('event_increase_movement_power_minor_value')|+0]"
 tgp_movement_events.0010.t: "Vítaná návštěva"
 tgp_movement_events.0010.desc: "Při procházce nádvořím mě uctivou úklonou zdraví elegantně [Select_CString(courtier.IsFemale,'oblečená žena','oblečený muž')].\n\n„Jmenuji se [courtier.GetName] a jsem [other_ruler.Custom2('RelationToMe', SCOPE.sC('courtier'))] [other_ruler.Custom('CZ_TitledFirstName_G')],“ zazní zdvořilé představení. „[other_ruler.GetTitledFirstNameNoTooltip|U] mě posílá k vám pro radu a poučení, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|l]. Než učiní své rozhodnutí, přeje si vyslechnout i další názory.“"
 tgp_movement_events.0010.a: "Hnutí [my_movement.GetNameNoTooltip] musí ukázat cestu."
 tgp_movement_events.0010.a.success: "Podařilo se ti přesvědčit [other_ruler.Custom('CZ_ShortUIName_A')]"
 tgp_movement_events.0010.a.failure: "[other_ruler.GetShortUIName|U] nedbá na tvé rady"
 tgp_movement_events.0010.b: "Více lidí by mě mělo žádat o radu!"
 tgp_movement_events.0010.c: "„Rozhodnutí musí učinit [other_ruler.GetTitledFirstNameNoTooltip]. Já mohu jen pomoci.“"
 event_increased_personal_movement_power_tt: "Tvá [movement_power_i][Concept('personal_movement_power','osobní síla hnutí')|E] se zvýší o [EmptyScope.ScriptValue('event_increased_personal_movement_power_value')|+0] na #V 15 let#!"
 tgp_movement_events_0010_add_to_movement_effect_tt: "[other_ruler.GetShortUIName|U] se připojí k hnutí [GetPlayer.Custom('GetMyMovement')]"
 tgp_movement_events.0020.t: "Kupředu! Kupředu!"
 tgp_movement_events.0020.desc: "„[ROOT.Char.Custom('ComplimentAdjective')|U] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|l],“ hluboce se uklání [Select_CString(courtier.IsFemale,'žena','muž')] z [courtier.GetCulture.Custom('CZ_AdjectiveNoTooltip_yych')|l] zemí při vstupu do trůnního sálu. „Přináším pečeť vznešené osoby, jíž je [other_ruler.GetTitledFirstName]. [other_ruler.GetLadyLord|U] mě pověřuje vzdát hold dalšímu váženému členovi hnutí [my_movement.GetName].“\n\n[courtier.GetShortUIName|U] [courtier.Custom('quirk_pos_present')] a pokračuje: „[other_ruler.GetTitledFirstNameNoTooltip|U] zastává názor, že se panství musí soustředit na inovace. Honba za osobní mocí je sobecká a marná. Všichni musíme #EMP kráčet kupředu#!.“"
 tgp_movement_events.0020.aa: "To je jediná cesta vpřed."
 tgp_movement_events.0020.a: "A kupředu také půjdeme."
 tgp_movement_events.0020.b: "Bez hnutí [my_movement.GetNameNoTooltip] není žádný pokrok!"
 tgp_movement_events.0020.c: "Správný směr se musí určovat zevnitř."
 event_decrease_movement_power_medium_effect_tooltip: "[movement_power_i][Concept('movement_power','Síla hnutí')|E] ([GetPlayer.Custom('GetMyMovement')]) se sníží o #N [EmptyScope.ScriptValue('event_decrease_movement_power_medium_value')|0]#!"
 event_decrease_movement_power_minor_effect_tooltip: "[movement_power_i][Concept('movement_power','Síla hnutí')|E] ([GetPlayer.Custom('GetMyMovement')]) se sníží o #N [EmptyScope.ScriptValue('event_decrease_movement_power_minor_value')|0]#!"
 tgp_advancement_innovations_modifier: "Velký pokrok"
 tgp_advancement_innovations_modifier_desc: "Tato postava využila své znalosti architektury, aby podpořila inovace a nasměrovala panství k lepší budoucnosti."
 tgp_movement_events.0030.opening: "[other_ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 tgp_movement_events.0030.desc: "Oba patříme k hnutí [my_movement.GetName], a proto ti píšu, abychom společně dbali na své vzájemné zájmy.\n\nBudu o tobě mluvit v dobrém, pokud ty uděláš totéž pro mě."
 tgp_movement_events.0030.a: "Na tom se můžeme shodnout."
 tgp_movement_events.0030.b: "Vážím si nabídky, ale pomoc nepotřebuji."
 friend_same_movement_reason: "[CZProDrop(CHARACTER,'uzavřela','uzavřel')|U] s [TARGET_CHARACTER.Custom('CZ_ShortUIName_I')] dohodu, že budou jako členové stejného hnutí vzájemně hájit své zájmy."
 friend_same_movement_reason_corresponding: "$friend_same_movement_reason$"
 tgp_movement_events.0040.t: "Vděčnost nebes"
 tgp_movement_events.0040.desc: "„Vaše úsilí nezůstalo bez povšimnutí, [ROOT.Char.Custom('CZ_TitledFirstNameNoTooltip_V')].“ Pevný hlas mě vytrhne z myšlenek. Přede mnou se uklání [Select_CString(courtier.IsFemale,'žena','muž')], [Select_CString(courtier.IsFemale,'která nese','který nese')] pečeť [hegemon.Custom('CZ_TitledFirstNameNoTooltip_G')].\n\n„[hegemon.GetTitledFirstName|U] si váží vaší podpory a přeje si vás za ni odměnit. Hnutí [my_movement.GetName] bude opěvováno v palácových síních a vaše jména zůstanou v paměti budoucích generací.“"
 tgp_movement_events.0040.a: "„Má vděčnost je stejně velká.“"
 tgp_movement_events.0040.b: "„[hegemon.Custom('CZ_TitleAsNameNoTooltip_D')|U] zachovám věrnost navždy.“"
 tgp_movement_events.0040.c: "„Ať o nás ty zdi vyprávějí!“"
 tgp_loyal_subject_modifier: "Věrnost nebesům"
 tgp_loyal_subject_modifier_desc: "Tato postava prokázala věrnost hegemonovi tím, že se připojila k hnutí podporujícímu hegemona."
 dynastic_cycle_cannot_leave_movement_tt: "@warning_icon! #X Po dobu #V 15 let#! nebudeš moci opustit hnutí [my_movement.GetName]#!"
 situation_dynastic_cycle_choose_movement_decision_cannot_leave_var: "Slíbil jsi [GetTitleByKey('h_china').GetHolder.Custom('CZ_TitleAsName_D')], že [GetTitleByKey('h_china').GetHolder.GetHerHim] neopustíš"
 tgp_movement_events.0050.t: "Nový směr"
 tgp_movement_events.0050.desc.intro: "„Zdravím vás, [ROOT.Char.Custom('CZ_TitledFirstNameNoTooltip_V')].“ Do mé pracovny tiše vstupuje [Select_CString(new_elder.IsFemale,'rozvážná žena','rozvážný muž')] v doprovodu několika mých úředníků. „Rád bych vás požádal o soukromou audienci, smím-li.“\n\n„Rozpoznávám ve vás předpoklady učence, jehož nadání pro "
 tgp_movement_events.0050.desc.diplomacy: "diplomacii"
 tgp_movement_events.0050.desc.stewardship: "správu"
 tgp_movement_events.0050.desc.intrigue: "intriky"
 tgp_movement_events.0050.desc.learning: "učenost"
 tgp_movement_events.0050.desc.martial: "válečnictví"
 tgp_movement_events.0050.desc.outro: " svědčí o ctnostném duchu. Rád bych vám nabídl své skromné vědomosti, aby vaše vláda získala na rozvaze a vaše čepel na ostrosti.“"
 tgp_movement_events.0050.a: "[new_elder.GetTitledFirstNameNoTooltip|U] bude skvělým mentorem."
 tgp_movement_events.0050.b: "Má věrnost bude navždy patřit [old_elder.Custom('CZ_TitledFirstNameNoTooltip_D')]!"
 tgp_movement_events.0050.c: "Jedinou správnou cestou je soustředit se na studium."
 tgp_movement_events.0060.t: "Zákeřný inkoust"
 tgp_movement_events.0060.desc: "Na mém stole leží [ROOT.Char.Custom('GetWritingMaterial')|l]. Jediný tah štětce by mohl na celé generace pošpinit pověst [rival.Custom('CZ_TitledFirstName_G')] i hnutí [rival_movement.GetName]. Přesto váhám a [ROOT.GetCharacter.Custom('quirk_pos_adverb')|l] přecházím po pracovně.\n\nTa myšlenka se mě drží jako kouř z nehlídaného ohně."
 tpg_movement_events.0060.aa: "Ostřejší slova dosud nikdo nenapsal."
 tgp_movement_events.0060.a: "Hnutí [rival_movement.GetNameNoTooltip] ponese následky."
 tgp_movement_events.0060.b: "Raději bych měl vyzdvihovat přednosti hnutí [my_movement.GetNameNoTooltip]."
 tgp_movement_events.0060.c: "[ROOT.Char.GetFaith.HighGodName|U] nás učí soucitu."
 tgp_movement_events.0060.a.tt: "$prelude_events.0040.c.tt$"
 tgp_movement_events.0060.a.rival_tt: "[movement_power_i][Concept('movement_power','Síla hnutí')|E] ([rival_movement.GetName]) se sníží o #N [EmptyScope.ScriptValue('event_decrease_movement_power_medium_value')|0]#!"
 tgp_movement_events.0070.t: "Společný svitek"
 tgp_movement_events.0070.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ oslovuje mě [councillor.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))], při vstupu do pracovny. [councillor.Custom('quirk_pos_pp')|U]. „Doslechl jsem se, že vás stejně jako mě zajímá [councillor.Custom('MatchingConversationSubject_alone')|l].“\n\n„Smím navrhnout, abychom společně studovali klasické spisy? Při společném rozjímání mohou vládci i služebníci nabýt větší moudrosti, stejně jako dvě zrcadla leštěná bok po boku.“"
 tgp_movement_events.0070.a: "„Ha! Vždyť [councillor.Custom('MatchingConversationSubject_alone')|l] nás oba zajímá. Jistě si máme o čem povídat!“"
 tgp_movement_events.0070.b.councillor: "„Raději se soustřeď na své povinnosti v radě.“"
 tgp_movement_events.0070.b.spouse: "„Více mi záleží na tvém vzdělání.“"
 tgp_movement_events.0070.c: "Nikdy se nesmím přestat učit."
 friend_studied_together: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] mají za sebou odpoledne strávené společným studiem svého oblíbeného tématu."
 friend_studied_together_corresponding: "$friend_studied_together$"
 tgp_movement_events.0080.t: "Pro náš rod"
 tgp_movement_events.0080.desc: "Do místnosti přichází [family_member.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('family_member'))], a [family_member.Custom('quirk_pos_present')|l]. „[family_member.Custom2('RelationToMe', SCOPE.sC('root_scope'))|U],“ zazní zdvořilý pozdrav doprovázený úklonou. Slavnostní roucho je dokonale upravené a pohled uctivě sklopený.\n\n„Dlouho přemýšlím o cti našeho rodu. Možná to není mnoho, ale přesto bych ti rád nabídl tento dar, aby naše sídlo [ROOT.Char.GetDomicile.GetName] zazářilo v očích všech.“"
 tgp_movement_events.0080.aa: "„Jméno rodu [ROOT.Char.GetHouse.GetNameNoTooltip] bude proslulé!“"
 tgp_movement_events.0080.a: "„Děkuji ti za tento příspěvek.“"
 tpg_movement_events.0080.b: "„Musíme toto zlato využít k financování hnutí [my_movement.GetNameNoTooltip].“"
 tgp_movement_events.0080.c: "„Neplýtvej kvůli mně svým zlatem.“"
 tgp_subsidised_estate_buildings_modifier: "Dotované sídlo"
 tgp_subsidised_estate_buildings_modifier_desc: "Rodina této postavy nabídla pomoc s výstavbou a rozvojem jejího sídla.\n\n"
 MODIFIER_DEFINITION_SUBSIDISED_ESTATE: "#emp Používá se při výstavbě nové budovy domicilu#!\nZbývající zdroje na [Concept('domicile_building','budovu domicilu')|E]: #bold $MULTIPLIER|0$/3#!"
 friend_rejected_funds: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer,'doporučuješ','doporučuje')] [TARGET_CHARACTER.Custom('CZ_ShortUIName_D')] šetřit vlastní zlato a neutrácet je v [CHARACTER.Custom('CZ_ShortUIName_G')] prospěch."
 friend_rejected_funds_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer,'dostáváš','dostává')] od [CHARACTER.Custom('CZ_ShortUIName_G')] radu, aby své zlato neplýtval ve prospěch [TARGET_CHARACTER.Custom('CZ_ShortUIName_G')]."
 tgp_movement_events.0090.t: "Staré rány"
 tgp_movement_events.0090.desc: "„[ROOT.Char.Custom('CZ_TitledFirstNameNoTooltip_V')],“ oslovuje mě [Select_CString(courtier.IsFemale,'žena','muž')] nesoucí pečeť rodu [other_ruler.GetHouse.GetName]. Po hluboké úkloně pokračuje: „[other_ruler.GetTitledFirstName|U] mi [Select_CString(other_ruler.IsFemale,'uložila','uložil')] přečíst vám tuto zprávu.“\n\n„Ačkoli jsme v minulých letech stáli proti sobě, nyní jako členové hnutí [my_movement.GetName] kráčíme ke společnému cíli. Musíme zapomenout na staré křivdy.“"
 tgp_movement_events.0090.aa: "„Zamítá se.“"
 tgp_movement_events.0090.a: "„Chci omluvu, kterou uslyší #EMP všichni#!.“"
 tgp_movement_events.0090.b: "Jen pro dobro hnutí [my_movement.GetNameNoTooltip]."
 tgp_movement_events.0090.c: "„Vyřiď [other_ruler.Custom('CZ_TitleAsNameNoTooltip_D')] mé nejlepší pozdravy.“"
 tgp_movement_events.0100.t: "Dobrá rada"
 tgp_movement_events.0100.desc: "„[Select_CString(ROOT.Char.IsFemale,'Vznešená','Vznešený')] [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|l].“ V přítmí si žádá mou pozornost [spymaster.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spymaster'))]. Pod rychlými kroky vržou prkna podlahy.\n\n„Doneslo se k nám, že [rival.GetTitledFirstName], [Select_CString(rival.IsFemale,'vůdkyně','vůdce')] hnutí [rival_movement.GetName], může být vůči jistým... návrhům mnohem přístupnější, než jsme očekávali.“"
 tgp_movement_events.0100.aa: "Měl by přece být zřejmý ten nejlepší postup."
 tgp_movement_events.0100.a: "„Jen do toho.“"
 tgp_movement_events.0100.a.success: "[rival.GetShortUIName|U] opouští hnutí [rival_movement.GetName]"
 tgp_movement_events.0100.a.failure: "Tvá nečestnost byla odhalena"
 tgp_movement_events.0100.b: "Nic nepřesvědčí lépe než zlato."
 tgp_movement_events.0100.c: "Nemusíme useknout hlavu. Stačí oslabit tělo."
 tgp_movement_events_0100_remove_from_movement_effect_tt: "[rival.GetShortUIName|U] se připojí k hnutí [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey( 'undecided_movement' ).GetName]"
 tgp_movement_events.0110.opening: "[other_ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 tgp_movement_events.0110.desc: "Jako členové hnutí [my_movement.GetName] máme povinnost udržovat ostré nejen své meče, ale i svou mysl.\n\nPřijmi prosím tuto knihu a pečlivě ji prostuduj."
 tgp_movement_events.0110.a: "Budu se řídit tvou radou."
 tgp_movement_events.0110.b: "V mé knihovně se bude skvěle vyjímat."
 friend_sent_books_reason: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer,'posíláš','posílá')] [CHARACTER.Custom('CZ_ShortUIName_D')] několik zajímavých knih, protože oba patří ke stejnému hnutí."
 friend_sent_books_reason_corresponding: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer,'posíláš','posílá')] [TARGET_CHARACTER.Custom('CZ_ShortUIName_D')] několik zajímavých knih, protože oba patří ke stejnému hnutí."
 artifact_movement_gift_desc: "[newly_created_artifact.GetDesc]\n\nDar od [other_ruler.Custom('CZ_ShortUIName_G')] pro [root_scope.Custom('CZ_ShortUIName_A')] jakožto členy hnutí [my_movement.GetName]."
 tgp_movement_events.0120.t: "Přípitek na ctnost"
 tgp_movement_events.0120.desc: "Číše se znovu plní, podává se [host.Custom('GetExpensiveDrink')|l] a z talířů rychle mizí [host.Custom('GetExpensiveMeal')|l]. [other_ruler.GetTitledFirstName|U] se ke mně naklání blíž.\n\n„Nesmíme zklamat hnutí [my_movement.GetName],“ pronáší [other_ruler.Custom('quirk_pos_pp')|l]. „Znáte historický spis [other_ruler.Custom('GetRandomHistoryPassage')|l], [ROOT.Char.Custom('CZ_TitledFirstNameNoTooltip_V')]?“"
 tgp_movement_events.0120.a: "„Prosím, pouč mě.“"
 tgp_movement_events.0120.b: "Musíme spoléhat jedině na moc."
 tgp_movement_events.0120.c: "„Hostina přece není místem ke studiu!“"
 tgp_movement_events.0130.t: "Jazyk, kterým mluví [capital_culture.GetCollectiveNounNoTooltip]"
 tgp_movement_events.0130.desc: "Přede mnou se hluboce uklání [Select_CString(courtier.IsFemale,'žena','muž')] v nádherném oděvu z látky [other_ruler.Custom('RegionalFabric')|l].\n\n„[Select_CString(other_ruler.IsFemale,'Má paní','Můj pán')] [other_ruler.GetTitledFirstName] mě posílá jako svého zástupce, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Vzkazuje, že hlasy hnutí [my_movement.GetName] mohou v hlavním městě zůstat nevyslyšeny, pokud jeho členové nebudou ovládat tamní jazyk.“\n\n[courtier.Custom('quirk_pos_present')|U] a pokračuje: „Bylo by mi ctí vás při jeho studiu vést.“"
 tgp_movement_events.0130.a: "Musím se naučit jejich jazyk!"
 tgp_movement_events.0130.b: "Proč rovnou nepřijmout [capital_culture.Custom('CZ_AdjectiveNoTooltip_ou')|l] kulturu?"
 tgp_movement_events.0130.c: "Budeme žít ve vzájemné harmonii."
 tgp_cultural_harmony_modifier: "Kulturní harmonie"
 tgp_cultural_harmony_modifier_desc: "Tato postava se rozhodla věnovat své úsilí harmonickému soužití s kulturou hlavního města."
 tgp_movement_events.0140.t: "Dar učedníka"
 tgp_movement_events.0140.desc: "„[Select_CString(ROOT.Char.IsFemale,'Mistryně','Mistře')]!“ Ten hlas poznám dřív, než spatřím, komu patří. Je to [disciple.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('disciple'))].\n\n„Tolik jste mě toho naučili o letopisech [ROOT.Char.Custom('GetRandomAnnalsPassage')|l] i o [ROOT.Char.Custom('GetRandomHistoryPassage')|l]! S velkou péčí jste rozvíjeli mé poznání. Na znamení vděčnosti bych vám [Select_CString(disciple.IsFemale,'ráda','rád')] věnoval tento dar.“\n\n[disciple.Custom('quirk_pos_present')|U] a podává mi [ROOT.Char.Custom('GetSimpleColor')|l] balíček."
 tgp_movement_events.0140.a: "„S radostí jej přijímám.“"
 tgp_movement_events.0140.b: "„Pamatuj, že to vše děláme pro hnutí [my_movement.GetNameNoTooltip].“"
 tgp_movement_events.0140.c: "„A co [ROOT.Char.Custom('GetRandomPoetryPassage')|l]?“"
 disciple_gift_desc: "[newly_created_artifact.GetDesc]\n\nDar od [disciple.Custom('CZ_ShortUIName_G')] pro [root_scope.Custom('CZ_ShortUIName_A')] jako poděkování za vynikající vedení."
 tgp_movement_events.0150.t: "[monk.GetFaith.Custom('CZ_AdjectiveNoTooltip_yy')|U] [monk.GetFaith.DevoteeNeuter|l]"
 tgp_movement_events.0150.desc.intro: "Do trůnního sálu vstupuje [monk.GetFaith.DevoteeNeuter|l] v rouchu barvy [monk.Custom('GetComplexColor')|l]. U pasu visí drobný dřevěný amulet a ve vzduchu se za příchozí postavou line jemná vůně kadidla.\n\n"
 tgp_movement_events.0150.desc.other_ruler: "„Přicházím z pověření [other_ruler.Custom('CZ_TitledFirstName_G')], [Select_CString(other_ruler.IsFemale,'mé paní','mého pána'),]“ říká [monk.Custom('quirk_pos_pp')|l]. „Mou povinností je šířit poselství, které nám předává [monk.GetFaith.HighGodName]."
 tgp_movement_events.0150.desc.alone: "„Přicházím, neboť [monk.GetFaith.HighGodName] mě vede. Celý svůj život se věnuji studiu učení, které hlásá [monk.GetFaith.GetName]."
 tgp_movement_events.0150.desc.outro: " Prosím, přijměte mě na svůj dvůr, abychom se mohli učit jeden od druhého.“"
 tgp_movement_events.0150.aa: "„Vyřiď svému [Select_CString(other_ruler.IsFemale,'paní','pánovi')], že obdivuji [Select_CString(other_ruler.IsFemale,'její','jeho')] diplomatické schopnosti.“"
 tgp_movement_events.0150.aa.alliance: "Uzavřeš [Concept('alliance','alianci')|E] s [other_ruler.Custom('CZ_ShortUIName_I')]"
 tgp_movement_events.0150.a: "„Pověz mi, jaké učení přináší [monk.GetFaith.HighGodName].“"
 tgp_movement_events.0150.b: "„#EMP Této#! zemi vládne [ROOT.Char.GetFaith.HighGodName]!“"
 tgp_movement_events.0150.b.success: "[CZProDrop(monk,'obrátila','obrátil')|U] se na jinou víru"
 tgp_movement_events.0150.b.failure: "[CZProDrop(monk,'zůstala','zůstal')|U] u své víry"
 tgp_movement_events.0150.c: "„Na mém dvoře jsi [Select_CString(monk.IsFemale,'vítaná','vítaný')].“"
 cheaper_to_convert_to_monk_faith_tt: "Získáš slevu #P 50 %#! na konverzi k víře [monk.GetFaith.GetName]"
 tgp_movement_events.0160.t: "Odložené dýky"
 tgp_movement_events.0160.desc: "Svíčka poblikává. Přede mnou leží [ROOT.Char.Custom('GetWritingMaterial')|l], ale já stále váhám, co napsat. [rival.GetTitledFirstName|U] vede hnutí [rival_movement.GetName] pevnou rukou a bylo by rozumné si [rival.Custom('CZ_TitledFirstName_A')] neznepřátelit.\n\nAle takový dopis... Slib, že vůči sobě nebudeme chovat zášť... Nemohl by snad být považován za projev slabosti?"
 tgp_movement_events.0160.a: "Upřímná slova musí stačit."
 tgp_movement_events.0160.b: "Trocha zlata řekne vše potřebné."
 tgp_movement_events.0160.c: "Nerad si zavírám dveře k dalším možnostem."
 tgp_movement_events_0160_scheme_blocking_effect_tt: "@alert_icon! #alert_trial Po dobu #V 15 let#! nebudeš moci zahajovat [Concept('hostile_schemes','nepřátelské intriky')|E] proti [rival.Custom('CZ_ShortUIName_D')] a ani tato postava nebude moci zahajovat nepřátelské intriky proti tobě!#!"
 no_scheming_allowed_var_tt: "Ty a [recipient.GetShortUIName] jste se zavázali, že proti sobě nebudete zahajovat [Concept('hostile_schemes','nepřátelské intriky')|E] až do [GetCurrentDateWithDiff( GetVarTimeRemaining( actor.MakeScope, 'no_scheming_allowed_var') )]"
 personal_movement_power: "$game_concept_personal_movement_power$"
