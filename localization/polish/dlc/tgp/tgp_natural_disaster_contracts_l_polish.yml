l_polish:
 tgp_admin_contract_natural_disaster_tt_rewards: "Můžeš si vybrat z různých odměn, například:#indent_newline:3 \n$EFFECT_LIST_BULLET$$admin_contract_success_tt_xp$\n$EFFECT_LIST_BULLET$[Concept('experience','Zkušenosti')|E] v [Concept('lifestyles','životních stylech')|E]\n$EFFECT_LIST_BULLET$[influence_i|E][Concept('influence','Vliv')|E]\n$EFFECT_LIST_BULLET$[prestige_i|E][Concept('prestige','Prestiž')|E]\n$EFFECT_LIST_BULLET$[piety_i|E][Concept('piety','Zbožnost')|E]\n$EFFECT_LIST_BULLET$[Concept('county_opinion','Lidové mínění')|E]\n$EFFECT_LIST_BULLET$Zlepšení tvých [Concept('counties','hrabství')|E]#!"
 tgp_admin_contract_natural_disaster_failure_tt: "Můžeš utrpět postihy, například ztratit [prestige_i|E][Concept('prestige','prestiž')|E] nebo [influence_i|E][Concept('influence','vliv')|E]"
 tgp_natural_disaster_travel_to_contract_destination: "Vydej se do oblasti [natural_disaster_contract_destination.GetName] a prošetři situaci"
 tgp_food_shortage: "Nedostatek potravin"
 tgp_food_shortage_contract: "$tgp_food_shortage$"
 tgp_food_shortage_desc_title: "$task_contract_governance_desc_title$"
 tgp_food_shortage_request: "$admin_request_choose_opportunity$"
 tgp_food_shortage_desc: "Toto hrabství postihla pohroma, která způsobila vážný nedostatek potravin mezi obyvatelstvem."
 tgp_natural_disaster_contract_event.0001.t: "$tgp_food_shortage$"
 tgp_natural_disaster_contract_event.0001.desc: "V oblasti [natural_disaster_contract_destination.GetName] zavládl nedostatek potravin. Zoufalí obyvatelé jsou nuceni hledat jiné, někdy i #EMP značně neobvyklé#! způsoby, jak utišit hlad. Ti, kdo mají dostatek prostředků, se snaží pomáhat, jak jen mohou. Nyní jsme však byli požádáni, abychom zasáhli i my."
 tgp_natural_disaster_contract_event.0001.a: "Lidé volají hlady o pomoc a jejich prosby nezůstanou nevyslyšeny."
 tgp_natural_disaster_contract_event.0001.b: "Naše vlastní zásoby jsou příliš cenné. Nemáme nic nazbyt."
 tgp_natural_disaster_contract_event.0002.t: "$tgp_food_shortage$"
 tgp_natural_disaster_contract_event.0002.desc: "Sotva dorazíme, obklopí můj doprovod zástup vyhublých hladovějících. Ulicemi se rozléhá jejich žalostný nářek a v propadlých očích žebráků nezůstalo o nic více naděje než v jejich žaludcích potravy. Obilí, které jsme přivezli, vystačí pro některé, ale zdaleka ne pro všechny. A hlad se rychle mění v nebezpečné zoufalství."
 tgp_natural_disaster_contract_event.0002.a: "Vyzvat všechny poddané, aby přispěli na pomoc!"
 tgp_natural_disaster_contract_event.0002.b: "Sežeňte vše, co potřebují, ať to stojí cokoli. Zaplatím to [Select_CString(ROOT.Char.IsFemale,'sama','sám')]."
 tgp_natural_disaster_contract_event.0002.c: "Přesvědčím obchodníky, aby otevřeli své sýpky."
 tgp_natural_disaster_contract_event.0002.c.tt.success: "Obchodníci souhlasili, že pomohou potřebným"
 tgp_natural_disaster_contract_event.0002.c.tt.failure: "Obchodníci bezcitně upřednostnili zisk před pomocí potřebným"
 tgp_natural_disaster_contract_event.0002.d: "Donutit privilegované vrstvy, aby přispěly na pomoc."
 tgp_distribution_of_food_character_modifier: "Nasycení potřebných"
 tgp_distribution_of_food_character_modifier_desc: "Tato postava přesvědčila své poddané, aby rozdali potraviny místním potřebným."
 tgp_distribution_of_food_modifier: "Rozdělování potravin"
 tgp_distribution_of_food_modifier_desc: "Toto hrabství získalo dodatečné zásoby potravin."
 tgp_pay_from_own_pocket_character_modifier: "Zaplaceno z vlastní kapsy"
 tgp_pay_from_own_pocket_character_modifier_desc: "Tato postava nezištně použila vlastní peníze, aby nasytila hladovějící."
 tgp_pay_from_own_pocket_modifier: "Příspěvek z vlastní kapsy"
 tgp_pay_from_own_pocket_modifier_desc: "Toto hrabství získalo pomoc přímo z osobních prostředků svého správce."
 tgp_haggle_with_merchants_modifier: "Štědří obchodníci"
 tgp_haggle_with_merchants_modifier_desc: "Tomuto hrabství poskytují dodatečnou pomoc putovní obchodníci."
 tgp_demand_food_from_nobles_modifier: "Vynucené zásoby od šlechty"
 tgp_demand_food_from_nobles_modifier_desc: "Zásoby obilí v tomto hrabství byly doplněny díky vynucené pomoci místních významných osobností."
 task_contract_reward_effect_distribution_of_food_desc: "$label_success_standard$"
 task_contract_reward_effect_pay_from_own_pocket_desc: "$label_success_standard$"
 task_contract_reward_effect_haggle_with_merchants_desc: "$label_success_standard$"
 task_contract_reward_effect_demand_food_from_nobles_desc: "$label_success_standard$"
 task_contract_reward_effect_haggle_with_merchants_failure_desc: "$label_failure_standard$"
 tgp_ravaged_buildings: "Zničeno přírodními živly"
 tgp_ravaged_buildings_contract: "$tgp_ravaged_buildings$"
 tgp_ravaged_buildings_desc_title: "$task_contract_governance_desc_title$"
 tgp_ravaged_buildings_request: "$admin_request_choose_opportunity$"
 tgp_ravaged_buildings_desc: "Tuto zemi postihla pohroma, která vážně poškodila místní infrastrukturu. Budovy se rozpadají a naléhavě potřebují opravy."
 tgp_natural_disaster_contract_event.0005.t: "$tgp_ravaged_buildings$"
 tgp_natural_disaster_contract_event.0005.desc: "Po nedávné pohromě mě obyvatelé [natural_disaster_contract_destination.GetName] doslova zasypávají žádostmi a prosbami o pomoc s obnovou svých domovů."
 tgp_natural_disaster_contract_event.0005.a: "Na záchranné a obnovovací práce osobně dohlédnu."
 tgp_natural_disaster_contract_event.0005.b: "Jejich utrpení je tragické, ale podobné neštěstí potkalo mnoho dalších."
 tgp_natural_disaster_contract_event.0006.t: "$tgp_ravaged_buildings$"
 tgp_natural_disaster_contract_event.0006.desc: "Trosky rozprostírající se přede mnou jasně vypovídají o ničivé síle pohromy, která zasáhla [natural_disaster_contract_destination.GetName].\n\nZranění a zoufalí lidé, kteří přišli o střechu nad hlavou, ke mně vzhlížejí v naději, že jim zajistím útočiště. Zpod sutin se mezitím ozývá slabé volání těch, kteří zůstali uvězněni v troskách. Na obzoru se navíc stahují bouřková mračna, a tak je potřeba jednat co nejrychleji."
 tgp_natural_disaster_contract_event.0006.a: "Dostaňte do bezpečí co nejvíce lidí. My zůstaneme a vyprostíme ostatní."
 tgp_natural_disaster_contract_event.0006.b: "Zavaleným už pomoci nedokážeme. Musíme zajistit úkryt přeživším."
 tgp_natural_disaster_contract_event.0006.c: "Naší hlavní prioritou musí být vyproštění lidí uvězněných pod troskami."
 tgp_natural_disaster_contract_event.0006.c.tt.desc.success: "Podaří se vyprostit oběti uvězněné pod troskami"
 tgp_natural_disaster_contract_event.0006.c.tt.success: "Podařilo se vyprostit oběti uvězněné pod troskami"
 tgp_natural_disaster_contract_event.0006.c.tt.desc.failure: "Trosky se zřítí dříve, než stihneš vyprostit uvězněné oběti"
 tgp_natural_disaster_contract_event.0006.c.tt.failure: "Trosky se během bouře zřítily a rozdrtily lidi, kteří pod nimi zůstali uvězněni"
 tgp_natural_disaster_contract_event.0006.d: "Přístřeší výměnou za práci mi připadá jako spravedlivá dohoda."
 tgp_rebuild_settlement_character_modifier: "Mistr obnovy"
 tgp_rebuild_settlement_character_modifier_desc: "Tato postava má bohaté zkušenosti s odstraňováním následků pohrom a dobře se vyzná ve všech úskalích obnovy zničených sídel."
 tgp_rebuild_settlement_modifier: "Obnova sídla"
 tgp_rebuild_settlement_modifier_desc: "V tomto hrabství byla přijata rozsáhlá opatření k obnově toho, co zničila nedávná pohroma."
 tgp_temporary_shelters_modifier: "Útočiště před bouří"
 tgp_temporary_shelters_modifier_desc: "Přestože zdejší obyvatelé během nedávné pohromy přišli o své domovy, bylo jim zajištěno dočasné ubytování."
 tgp_remove_debris_modifier: "Vysvobození z trosek"
 tgp_remove_debris_modifier_desc: "Při vyprošťování lidí uvězněných v troskách jejich domovů se zároveň podařilo odstranit sutiny a připravit místa pro následnou obnovu."
 tgp_labor_exchange_character_modifier: "Neochotná pracovní síla"
 tgp_labor_exchange_character_modifier_desc: "Tato postava uzavřela dohodu, díky níž výměnou za poskytnutí útočiště před bouří získala další pracovní síly pro svou doménu."
 task_contract_reward_effect_rebuild_settlement_desc: "$label_success_standard$"
 task_contract_reward_effect_temporary_shelters_desc: "$label_success_standard$"
 task_contract_reward_effect_remove_debris_desc: "$label_success_standard$"
 task_contract_reward_effect_labor_exchange_desc: "$label_success_standard$"
 task_contract_reward_effect_remove_debris_failure_desc: "$label_failure_standard$"
 tgp_medieval_medicine: "Péče o postižené"
 tgp_medieval_medicine_contract: "$tgp_medieval_medicine$"
 tgp_medieval_medicine_desc_title: "$task_contract_governance_desc_title$"
 tgp_medieval_medicine_request: "$admin_request_choose_opportunity$"
 tgp_medieval_medicine_desc: "Toto hrabství postihla pohroma! Počet mrtvých je vysoký, ještě více je však lidí, kteří přišli o domov nebo utrpěli zranění a zoufale potřebují pomoc."
 tgp_natural_disaster_contract_event.0010.t: "$tgp_medieval_medicine$"
 tgp_natural_disaster_contract_event.0010.desc: "Dorazil jezdec se strašlivými zprávami o pohromě, která postihla oblast [natural_disaster_contract_destination.GetName]. Mrtvých je tolik, že je ani nelze spočítat, a přeživší jsou zranění a zoufale potřebují ošetření."
 tgp_natural_disaster_contract_event.0010.a: "Vyšlu dalšího posla se zprávou, že už jsem na cestě."
 tgp_natural_disaster_contract_event.0010.b: "Mrtvým už nepomohu. Mou povinností je chránit ty, kteří jsou stále v nebezpečí."
 tgp_natural_disaster_contract_event.0011.t: "$tgp_medieval_medicine$"
 tgp_natural_disaster_contract_event.0011.desc: "Poslova zpráva ani zdaleka nevystihovala skutečnou hrůzu, která mě zde čeká. Mrtvých je mnohem více než živých a všudypřítomný zápach smrti a rozkladu se nedá vydržet.\n\nAni přeživší na tom nejsou o mnoho lépe než jejich zesnulí příbuzní. Sotva se mezi nimi najde někdo, kdo z pohromy vyvázl bez úhony.\n\nTváří v tvář tolika bolesti a utrpení sotva vím, kde s naší pomocí začít."
 tgp_natural_disaster_contract_event.0011.a: "Ať se naši lékaři nejprve postarají o raněné."
 tgp_natural_disaster_contract_event.0011.b: "Přiveďte ke mně děti a starce. Postarám se o ně osobně."
 tgp_natural_disaster_contract_event.0011.b.tt.success: "Podařilo se ti pomoci lidem v nouzi"
 tgp_natural_disaster_contract_event.0011.b.tt.failure: "Tvá snaha pomoci lidem v nouzi byla marná"
 tgp_natural_disaster_contract_event.0011.c: "Uctít mrtvé a zajistit jim důstojný pohřeb."
 tgp_natural_disaster_contract_event.0011.d: "Lékařskou péči dostanou jen ti, kdo si ji mohou dovolit."
 tgp_assisting_physician_modifier: "Lékařská pomoc"
 tgp_assisting_physician_modifier_desc: "Do tohoto hrabství dorazilo množství lékařů, aby zmírnili utrpení zraněných a raněných."
 tgp_medical_assistance_character_modifier: "Vyhrnuté rukávy"
 tgp_medical_assistance_character_modifier_desc: "Tato postava se osobně zapojila do ošetřování těžce zraněných a zmrzačených."
 tgp_medical_assistance_modifier: "Nezdařená léčba"
 tgp_medical_assistance_modifier_desc: "Dobré úmysly nevedou vždy k dobrým výsledkům. Obyvatelé tohoto hrabství na vlastní kůži poznali, jak dopadá péče jejich dobře smýšlejícího, ale nezkušeného správce."
 tgp_prayers_to_the_people_character_modifier: "Úcta k zesnulým"
 tgp_prayers_to_the_people_character_modifier_desc: "Tato postava jasně prokázala svou úctu k zemřelým."
 task_contract_reward_effect_assisting_physician_desc: "$label_success_standard$"
 task_contract_reward_effect_medical_assistance_desc: "$label_success_standard$"
 task_contract_reward_effect_prayers_to_the_people_desc: "$label_success_standard$"
 task_contract_reward_effect_better_pay_up_desc: "$label_success_standard$"
 task_contract_reward_effect_medical_assistance_failure_desc: "$label_failure_standard$"
 tgp_disaster_displacement: "Žně zkázy"
 tgp_disaster_displacement_contract: "$tgp_disaster_displacement$"
 tgp_disaster_displacement_desc_title: "$task_contract_governance_desc_title$"
 tgp_disaster_displacement_request: "$admin_request_choose_opportunity$"
 tgp_disaster_displacement_desc: "Po nedávné pohromě toto hrabství zaplavili rabovači a kořistníci."
 tgp_natural_disaster_contract_event.0015.t: "$tgp_disaster_displacement$"
 tgp_natural_disaster_contract_event.0015.desc: "To nejhorší z nedávné pohromy, která postihla oblast [natural_disaster_contract_destination.GetName], už možná pominulo. Lidé s chamtivostí v srdci však využívají neštěstí těch, kteří přišli o domov, aby se na jejich úkor obohatili."
 tgp_natural_disaster_contract_event.0015.a: "Zdá se, že k obnovení pořádku bude zapotřebí pevné ruky."
 tgp_natural_disaster_contract_event.0015.b: "Proti lidské zkaženosti stejně nic nezmůžeme."
 tgp_natural_disaster_contract_event.0016.t: "$tgp_disaster_displacement$"
 tgp_natural_disaster_contract_event.0016.desc: "V oblasti [natural_disaster_contract_destination.GetName] se naplno projevuje ta nejhorší stránka lidské povahy. Zdá se, že zdejší obyvatele více zajímá, jak své sousedy připravit o cennosti, než jak jim podat pomocnou ruku.\n\nNež se vůbec budeme moci pustit do obnovy, musíme zde alespoň částečně nastolit pořádek."
 tgp_natural_disaster_contract_event.0016.a: "Vyslat vojáky, aby rabovače zatkli."
 tgp_natural_disaster_contract_event.0016.a.tt.desc.success: "Tvým vojákům se podaří rabovače dopadnout"
 tgp_natural_disaster_contract_event.0016.a.tt.success: "Tvým vojákům se podařilo rabovače dopadnout"
 tgp_natural_disaster_contract_event.0016.a.tt.desc.failure: "Prohnaní rabovači uniknou tvým pokusům o jejich dopadení"
 tgp_natural_disaster_contract_event.0016.a.tt.failure: "Tvým vojákům se nepodařilo rabovače dopadnout"
 tgp_natural_disaster_contract_event.0016.b: "Několik rabovačů nechat popravit mečem. Ostatní si z toho vezmou ponaučení."
 tgp_natural_disaster_contract_event.0016.c: "Zabavit veškerý zachráněný majetek k mé #EMP osobní#! kontrole."
 tgp_natural_disaster_contract_event.0016.d: "Zaplatit rabovačům, aby nadobro odešli."
 tgp_deployed_troops_character_modifier: "Strážce pořádku"
 tgp_deployed_troops_character_modifier_desc: "Tato postava horlivě prosazuje důsledné vymáhání zákonů, v případě potřeby i silou zbraní."
 tgp_setting_an_example_character_modifier: "Pořádek ostřím meče"
 tgp_setting_an_example_character_modifier_desc: "Tato postava prokázala, že je ochotna nastolit pořádek rychle, účinně a bez váhání."
 tgp_deployed_troops_modifier: "Nekontrolované rabování"
 tgp_deployed_troops_modifier_desc: "Ani hrozivý pohled na naše vojáky nedokázal zkrotit bezuzdnou chamtivost rabovačů a kořistníků v tomto hrabství."
 tgp_paying_off_the_looters_modifier: "Podplacení rabovači"
 tgp_paying_off_the_looters_modifier_desc: "Za trochu zlata se podařilo zastavit nekontrolované rabování v oblasti a vytvořit tak prostor pro její obnovu."
 task_contract_reward_effect_deployed_troops_desc: "$label_success_standard$"
 task_contract_reward_effect_setting_an_example_desc: "$label_success_standard$"
 task_contract_reward_effect_confiscate_for_personal_inspection_desc: "$label_success_standard$"
 task_contract_reward_effect_paying_off_the_looters_desc: "$label_success_standard$"
 task_contract_reward_effect_deployed_troops_failure_desc: "$label_failure_standard$"
