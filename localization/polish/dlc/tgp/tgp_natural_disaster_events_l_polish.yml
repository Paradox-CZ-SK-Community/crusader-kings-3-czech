l_polish:

 natural_disaster.4001.t: "[situation.GetNameNoTooltip|U]: Obnova dokončena"
 natural_disaster.4001.desc: "Nedávná pohroma, která postihla naše země, po sobě zanechala škody, jejichž náprava potrvá celé generace. Zasadila zemi hlubokou ránu, kterou pocítila šlechta i prostý lid.\n\nSpojili jsme síly, abychom uctili památku těch, kteří přišli o život, a obnovili naše města i vesnice. Pokud nás pohroma postihne znovu, budeme připraveni."
 natural_disaster.4001.a: "Skutečné vítězství nad přírodními živly."
 natural_disaster.4002.a: "Naše úsilí nebylo marné!"
 natural_disaster.5001.t: "[situation.GetNameNoTooltip|U]: Zmařený pokrok"
 natural_disaster.5001.desc: "Roky investic a plody úmorné práce v celém kraji přicházejí vniveč během jediného okamžiku. Rodiny opouštějí domovy svých předků, z nichž zbyly jen trosky. Kronikáři oplakávají ztrátu posvátných a vzácných pokladů i životně důležitých vojenských zásob.\n\n"
 natural_disaster.5001.desc.flood: "Sklepy a podzemní stavby jsou nenávratně ztraceny, jejich východy pohltila povodňová voda. Pohyb je téměř nemožný, lidé i tažná zvířata se boří do rozmáčené půdy."
 natural_disaster.5001.desc.earthquake: "Nevinní lidé prchají před troskami padajícími z nebe, jen aby je vzápětí pohltila mračna temného, dusivého prachu. Budovy, které stály neochvějně od nepaměti, nyní leží v troskách a jejich rozbité pozůstatky už ani nelze rozeznat."
 natural_disaster.5001.a: "Čeká nás tolik práce s obnovou."
 natural_disaster_5001_flood_tt: "Každé [Concept('county','hrabství')|E] tvého [Concept('realm','panství')|E] v oblasti [situation_sub_region.GetName], postižené katastrofou [situation.GetName], ztratilo #N 1/[SCOPE.ScriptValue('natural_disaster_flood_development_loss_fraction_value')|0]#! svého [Concept('development','rozvoje')|E] #weak (max. -5)#!"
 natural_disaster.5011.t: "[situation.GetNameNoTooltip|U]: Oslabená obrana"
 natural_disaster.5011.desc.earthquake: "Kdysi vysoké a hrozivě se tyčící hradby [epicenter_county.Custom('CZ_LandedNameNoTier_G')] se zřítily,"
 natural_disaster.5011.desc.flood: "Kdysi vysoké a hrozivě se tyčící hradby měst v oblasti [river_region.GetName] se zřítily,"
 natural_disaster.5011.desc: " takže zde již nelze rozmístit žádné pluky. Válečníci jsou přesouváni do bezpečnějších oblastí, tím však obrana celého kraje slábne.\n\nZemě leží v troskách a ve chvíli své největší slabosti zůstává bez ochrany, vydaná napospas nepřátelům."
 natural_disaster.5011.a: "Vyhlídky jsou den ode dne chmurnější."
 natural_disaster.5021.t: "[situation.GetNameNoTooltip|U]: Hromadný útěk"
 natural_disaster.5021.desc: "Lidé postižení pohromou [situation.GetName] spěchají do bezpečí a nechávají své dosavadní životy za sebou. V kraji zůstává jen hrstka těch, kteří by mohli udržovat pořádek a bezpečnost. Ničemové tak získávají volnou ruku a beztrestně terorizují přeživší. Spravovat tuto oblast již není možné."
 natural_disaster.5021.a: "Tento kraj je opuštěný."
 natural_disaster.5022.desc: "Uprchlíci z oblastí postižených pohromou [situation.GetName] proudí do sousedních panství v zoufalé snaze uniknout chaosu. Zločinnost bují, protože bezohlední lidé využívají všeobecného zmatku ve svůj prospěch. Postižené oblasti se stávají pro panství přítěží. S odchodem obyvatel přestávají přinášet zisk a jejich rozvoj se zastavuje."
 natural_disaster.5022.a: "Přeživší jsou zde v bezpečí."
 natural_disaster.5031.t: "[situation.GetNameNoTooltip|U]: Zničené pastviny"
 natural_disaster.5031.desc: "Stáda řídnou, protože půdy vhodné k pastvě neustále ubývá. Hněv přírodních živlů pustoší krajinu natolik, že už nedokážeme zajistit obživu našich stád."
 natural_disaster.5031.a: "Tyto země už nejsou úrodné."
 natural_disaster.5101.t: "[situation.GetNameNoTooltip|U]: Poslední okamžiky"
 natural_disaster.5101.desc.flood: "Špinavá voda plná bahna mi sahá až po hruď. Promáčené šaty tíží mé údy a proud neustále sílí."
 natural_disaster.5101.desc.earthquake: "Podlaha se vzdouvá a ze stropu se valí oblaka prachu. Mohutný nosný trám praská a stěny žalostně skřípou. Za několik okamžiků se všechno zřítí."
 natural_disaster.5101.travel: "\n\nMožná nebylo moudré věřit, že mě [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] ochrání."
 natural_disaster.5101.army: "\n\nMožná nebylo moudré věřit, že nás [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] ochrání. Kolem mě se v panice tlačí vojáci jeden přes druhého."
 natural_disaster.5101.activity: "\n\nObávám se, že [involved_activity.GetActivityType.GetNameNoTooltip] je poslední událost, kterou v životě zažiji."
 natural_disaster.5101.tent: "\n\nMožná nebylo moudré věřit, že mě [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] ochrání."
 natural_disaster.5101.estate: "\n\nUtíkám chodbami svého sídla, ale jediný východ je téměř zcela zablokovaný."
 natural_disaster.5101.court: "\n\nProdírám se davem vyděšených dvořanů, ale jediný východ je pevně zatarasený."
 natural_disaster.5101.desc.flood_end: "Jen krok za mnou je [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('at_risk_character'))|l] [at_risk_character.GetTitledFirstNameNoTooltip] a natahuje ke mně ruku. Otvorem na čerstvý vzduch se však dokáže protáhnout jen jeden z nás."
 natural_disaster.5101.desc.earthquake_end: "Jen krok za mnou je [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('at_risk_character'))|l] [at_risk_character.GetTitledFirstNameNoTooltip], v očích čirou hrůzu. Dveřmi stihne projít jen jeden z nás, než se zřítí trám."
 natural_disaster.5101.a: "Popadnu [at_risk_character.Custom('CZ_TitledFirstNameNoTooltip_A')] a vyrazím ke dveřím."
 natural_disaster.5101.a.tt.success: "Ty i [at_risk_character.GetFirstNameNoTooltip] přežijete"
 natural_disaster.5101.a.tt.failure: "Pohroma tě přemůže"
 natural_disaster.5101.a.tt.failure_root: "Zemřeš"
 natural_disaster.5101.a.tt.failure_secondary: "[at_risk_character.GetFirstNameNoTooltip|U] umírá"
 natural_disaster.5101.b: "Každý sám za sebe!"
 natural_disaster.5101.b.tt.success: "Sotva se ti podaří přežít"
 natural_disaster.5101.b.tt.failure: "Zemřeš"
 natural_disaster.5101.b.tt.at_risk_character_duel: "[at_risk_character.GetFirstNameNoTooltip|U] může zemřít"
 natural_disaster.5101.c: "[Select_CString(at_risk_character.IsFemale,'Protlačím ji','Protlačím ho')] průchodem, přestože vím, že úder schytám já."
 natural_disaster.5101.d: "Odstrčím [at_risk_character.Custom('CZ_TitledFirstNameNoTooltip_A')] stranou a zachráním se."
 natural_disaster.5102.t.affected: "[situation.GetNameNoTooltip|U]: Přeživší"
 natural_disaster.5102.t.not_affected: "[situation.GetNameNoTooltip|U]: Počet obětí"
 natural_disaster.5102.t.second_round: " — Druhá vlna následků"
 natural_disaster.5102.t.third_round: " — Třetí vlna následků"
 natural_disaster.5102.travel: "Můj doprovod"
 natural_disaster.5102.army: "Má armáda"
 natural_disaster.5102.activity: "Účastník po mé pravici"
 natural_disaster.5102.tent: "Můj stan"
 natural_disaster.5102.estate: "Mé sídlo"
 natural_disaster.5102.court: "Lidé z mého dvora"
 natural_disaster.5102.desc.flood: "mizí v přívalové vodě, která promáčí naše zásoby i majetek.\n\nPodaří se mi překonat sílu proudu a dostat se na vyvýšené místo. Pohlédnu dolů na následky pohromy a do nosu mě udeří pach smrti."
 natural_disaster.5102.desc.earthquake: "mizí pod troskami hroutící se budovy.\n\nJako zázrakem se mi podaří vyhnout padajícímu zdivu a dostat se na pevnější půdu. Pohlédnu na rozdrcená těla kolem sebe a srdce mi sevře úzkost."
 natural_disaster.5102.a: "Mám štěstí, že ještě žiji."
 natural_disaster.5102.desc_remote.flood: "Celým panstvím se šíří děsivé zvěsti o pohromě [situation.GetNameNoTooltip]. Povodňová voda si v postižených krajích vyžádala mnoho životů, a to i mezi šlechtici a dvořany. Přestože jsem od nejhoršího běsnění daleko, rozsah ztrát je otřesný."
 natural_disaster.5102.desc_remote.earthquake: "Celým panstvím se šíří děsivé zvěsti o pohromě [situation.GetNameNoTooltip]. Síně a věže se zřítily a pohřbily pod troskami panovníky i jejich domácnosti. Počet mrtvých je děsivý, a to i mezi šlechtou."
 natural_disaster.5111.t: "[situation.GetNameNoTooltip|U]: Zasažený tábor"
 natural_disaster.5111.desc.flood: "Koně nedokážou vzdorovat sílícímu proudu, podkluzují a strhávají své jezdce s sebou. S každým dalším zvířetem, které mizí pod hladinou, se šíří stále větší hrůza. Stejný osud postihuje i mé válečníky. Těžká zbroj, která je dosud chránila před nepřáteli, je nyní stahuje do vodního hrobu.\n\n„Smiluj se, nad mou du—“ vykřikne [knight.GetName], než mu ústa zaplní dusivá voda."
 natural_disaster.5111.desc.earthquake: "Praskající země sráží mnohé válečníky z nohou a ti padají do nově vzniklých propastí. Další zůstávají uvězněni nebo rozdrceni pod padajícími troskami.\n\n[knight.Custom('CZ_NamePossessive_M')|U] nebohý kůň dostává zásah do hlavy padajícím kamenem a na místě hyne. [knight.GetNameNoTooltip|U] však naštěstí vyvázne [Select_CString(knight.IsFemale,'živá','živý')]. Totéž se však nedá říci o [Select_CString(knight.IsFemale,'jejích','jeho')] spolubojovnících."
 natural_disaster.5111.a: "Břemeno války je čím dál těžší."
 natural_disaster_army_damaged_title: "[situation.GetType.GetName|U] zasahuje armádu"
 natural_disaster_allied_army_damaged_title: "[situation.GetType.GetName|U] zasahuje spojeneckou armádu"
 natural_disaster_enemy_army_damaged_title: "[situation.GetType.GetName|U] zasahuje nepřátelskou armádu"
 natural_disaster.5901.t.earthquake: "[situation.GetNameNoTooltip|U]: Hněv země"
 natural_disaster.5901.t.flood: "[situation.GetNameNoTooltip|U]: Příval vody"
 natural_disaster.5901.desc.earthquake: "Otřesy v [epicenter_county.Custom('CZ_LandedNameNoTier_L')] dosáhly vrcholu a rozsévají zkázu po celé zemi. Domy i další stavby se hromadně hroutí a mnohé z těch, kteří se pokoušejí uniknout, drtí padající trosky.\n\nNičení spouští ničivý řetězec dalších pohrom. Propukají požáry a mezi obyvateli vypukají nepokoje. Odvážlivci se snaží zachraňovat lidi uvězněné pod troskami, sami však přicházejí o život v hustém dýmu a plamenech, které zachvacují celé [epicenter_county.GetTierAsNameNoTooltip|l]."
 natural_disaster.5901.desc.flood: "Ulicemi a uličkami měst v oblasti [river_region.GetNameNoTooltip] se valí voda a její neúprosný proud unáší těla nevinných lidí. Někteří se pokoušejí rozbouřenou vodou brodit, ale proud je zcela pohltí.\n\nPovodňová voda proniká pod podlahy budov a nasakuje do dřeva, které pak začne zahnívat. Prudký příval vody ničí úrodu na polích."
 natural_disaster.5901.a.earthquake: "[epicenter_county.GetNameNoTierNoTooltip|U] postihne naprostá zkáza."
 natural_disaster.5901.a.flood: "Voda z oblasti [river_region.GetNameNoTooltip] brzy všechno smete."
 natural_disaster.5902.desc: "Zprávy o nedávné pohromě jsou chmurné a obyvatelstvo propadá zmatku. Vládci okolních oblastí sledují ničení s velkým zájmem a pečlivě posuzují rozsah zpustošení.\n\nMusíme se pokusit dostat krizi pod kontrolu a zachránit vše, co ještě zachránit lze. Nečinně přihlížet takové zkáze by bylo pošetilé."
 natural_disaster.6901.t: "[situation.GetNameNoTooltip|U]: Následky pohromy"
 natural_disaster.6901.desc.flood: "Vody v oblasti [river_region.GetNameNoTooltip] se konečně vrátily do obvyklého stavu. Krajina je stále poseta hlubokými kalužemi, ale slunce jasně září a přebytečná voda se brzy vsákne nebo vypaří."
 natural_disaster.6901.desc.earthquake: "Země konečně utichla a půda v [epicenter_county.Custom('CZ_LandedNameNoTier_L')] se přestala otřásat. Z kdysi vzkvétajícího [epicenter_county.GetTierAsNameNoTooltip|l] zůstaly jen trosky a pouhá hrstka budov, které dosud stojí."
 natural_disaster.6901.desc: "\n\nÚleva je téměř hmatatelná, ale nikdo nemůže pochybovat o tom, že z celého kraje zůstal jen stín jeho někdejší slávy. O této zkáze se bude vyprávět dlouhá léta a vzpomínky na ni budou pronásledovat přeživší."
 natural_disaster.6901.a: "Cesta k obnovení pořádku bude dlouhá."
 natural_disaster.6902.desc: "Šlechtici i prostý lid se radují, že pohroma [situation.GetNameNoTooltip] konečně skončila. Radost však netrvá dlouho, protože skutečný rozsah škod teprve vychází najevo. Již probíhají práce na obnově všeho, co bylo ztraceno, a na pomoci těm, kteří se stali oběťmi pohromy."
 natural_disaster.6902.a: "Doufejme, že naše úsilí bude stačit."
 natural_disaster.6911.t: "[situation.GetNameNoTooltip|U]: Ministr posílá pomoc"
 natural_disaster.6911.desc: "[minister_helper.GetName], [Select_CString(minister_helper.IsFemale,'vyslankyně','vyslanec')] [minister.Custom('CZ_TitledFirstName_G')], si prohlíží místo postižené pohromou [situation.GetNameNoTooltip].\n\n„Přijměte mou upřímnou soustrast, [ROOT.Char.Custom('CZ_Name_V')]. [minister.GetTitledFirstNameNoTooltip] mě sem posílá, abych vám pomohl napravit následky této pohromy. Ministerstvo je ochotno udělat vše, co bude třeba. [minister.GetTopLiege.GetTitledFirstName] totiž očekává rychlou obnovu.“"
 natural_disaster.6911.minister_chancellor: "„Taková velkorysost mi dělá čest.“"
 natural_disaster.6911.minister_censor: "„Potřebuji především bojovat proti korupci.“"
 natural_disaster.6911.minister_grand_marshal: "„Musím zajistit pořádek.“"
 natural_disaster.6911.minister_of_personnel: "„Budu pomáhat prosazovat vliv [minister.Custom('CZ_TitledFirstName_G')].“"
 natural_disaster.6911.minister_of_revenue: "„Potřebujeme daňové úlevy.“"
 natural_disaster.6911.minister_of_rites: "„Modlitby nám mohou nesmírně pomoci.“"
 natural_disaster.6911.minister_of_war: "„Silnější opevnění nás ochrání před dalšími pohromami.“"
 natural_disaster.6911.minister_of_justice: "$natural_disaster.6911.minister_censor$"
 natural_disaster.6911.minister_of_works: "„Přesídlení postižených musí být naší hlavní prioritou.“"
 natural_disaster.6911.a: "„Náklady neustále rostou. Potřebuji prostředky z pokladnice.“"
 natural_disaster_recovery_minister_of_revenue_tt: "Zabrání všem záporným [Concept('modifiers','modifikátorům')|E] [Concept('tax','daní')|E] vyplývajícím z [Concept('great_project_contributions','příspěvků')|E] na projekt [great_project.GetName]"
 natural_disaster_recovery_minister_of_works_tt: "Zabrání všem záporným [Concept('modifiers','modifikátorům')|E] [Concept('domain','domény')|E] vyplývajícím z [Concept('great_project_contributions','příspěvků')|E] na projekt [great_project.GetName]"
 minister_has_aidee_to_send_tt: "Zaměstnává [GetCourtPositionType( 'minister_bureaucrat_court_position' ).GetName]"
 natural_disaster.7001.t: "[epicenter_county.GetNameNoTierNoTooltip|U]: Zlověstné otřesy"
 natural_disaster.7001.desc: "[epicenter_county.GetProvince.GetCounty.GetFaith.HouseOfWorshipPlural|U] a svatyně v [epicenter_county.Custom('CZ_LandedNameNoTier_L')] se pod náporem otřesů začínají hroutit a nahánějí strach i těm nejoddanějším věřícím. Je zřejmé, že otřesy jen tak neustanou. Naopak jsou každým okamžikem silnější."
 natural_disaster.7001.a: "Tato pohroma vyžaduje mou #EMP plnou#! pozornost!"
 natural_disaster.7001.a.tt: "Budeš mít regenta, dokud pohroma nepřejde do fáze obnovy ($game_concept_situation_phase$)."
 natural_disaster.7001.a.tt.already_in_diarchy: "Moc již [Concept('power_sharing','sdílíš')|E], takže kvůli této další zátěži nemusíš nic měnit."
 natural_disaster.7001.a.tt.discount: "Příspěvky na projekty obnovy po [Concept('disaster','pohromě')|E] tě budou stát o #v 10 % méně#!, dokud budeš [Concept('power_sharing','sdílet moc')|E]"
 natural_disaster.7001.b: "Musíme se postarat o své nejbližší!"
 natural_disaster.7001.b.tt: "Můžeš přijmout rozhodnutí $isolate_family_decision$"
 natural_disaster.7001.c: "Kéž nám [ROOT.Char.GetFaith.HighGodName] pomůže!"
 natural_disaster.7011.t: "[epicenter_county.GetNameNoTierNoTooltip|U]: Útěk divokých zvířat"
 natural_disaster.7011.desc: "Zvířata v [epicenter_county.Custom('CZ_LandedNameNoTier_L')] začala hromadně prchat ze svých přirozených stanovišť. Otřesy země totiž ohrožují jejich samotné přežití. Ptáci zahájili předčasný tah a jejich obrovská hejna zastiňují oblohu.\n\nNěkteří lidé následují prchající zvířata v naději, že naleznou bezpečí. Mnozí obyvatelé však zůstávají ve svých domovech a stále doufají, že otřesy ustanou."
 natural_disaster.7011.d: "Příroda rozpoznává varovná znamení, zatímco my zůstáváme nečinní."
 natural_disaster.7021.t: "[river_region.GetNameNoTooltip|U]: Rozvodněné břehy"
 natural_disaster.7021.desc: "Vítr vhání do oblasti [river_region.GetNameNoTooltip] vodu z okolních území a hladina řeky stoupá vysoko nad obvyklou úroveň. Někteří obyvatelé zachycují přebytečnou vodu pro vlastní potřebu, ale řeka se dál vylévá z břehů.\n\nOkolní krajina se mění v močál a na budovách ve městech se hromadí nánosy bahna."
 natural_disaster.7021.a: "Těmto vodám už nic nestojí v cestě."
 natural_disaster.7031.t: "[river_region.GetNameNoTooltip|U]: Přívalové deště"
 natural_disaster.7031.desc: "Na krajinu v oblasti [river_region.GetNameNoTooltip] dopadá tolik potřebný déšť, který slibuje dobrou úrodu na obdělávaných polích.\n\nZemě však již nasákla více než dost vody, zatímco déšť stále sílí a nejeví známky toho, že by měl ustat. Slunce není nikde vidět a řeka se začíná vylévat z břehů do okolní krajiny."
 natural_disaster.7031.a: "Kéž se nad námi nebesa smilují."
 natural_disaster.8001.t.earthquake: "[epicenter_county.GetNameNoTierNoTooltip|U]: Dunění z hlubin"
 natural_disaster.8001.t.flood: "[river_region.GetNameNoTooltip|U]: Stoupající hladina"
 natural_disaster.8001.desc.earthquake: "Dostávají se ke mně zprávy o vážných otřesech v [epicenter_county.Custom('CZ_LandedNameNoTier_L')]. Země se chvěje a třese a na jejím povrchu se začínají objevovat trhliny. Menší stavby se již hroutí.\n\nObyvatelé [epicenter_county.GetTierAsNameNoTooltip|l] propadají neklidu a ztěžují tak veškeré snahy o organizaci záchranných opatření. Navzdory jejich panice musím udělat vše, co je v mých silách, abych omezil škody a připravil se na blížící se zkázu."
 natural_disaster.8001.desc.flood: "Hladina vod v oblasti [river_region.GetName] vystoupila nad obvyklou úroveň a podmáčí půdu v okolních krajích. Přestože by to mohlo prospět úrodě, voda neúnavně stoupá dál.\n\nBylo by moudré zastavit veškeré stavební práce v oblasti, dokud povodeň neopadne, a zajistit, aby se co nejvíce lidí mohlo dostat do bezpečí."
 natural_disaster.8001.a: "To může znamenat jediné..."
 natural_disaster.8001.a.tt.earthquake: "V [epicenter_county.Custom('CZ_LandedNameNoTier_L')] brzy udeří [Concept('earthquake','zemětřesení')|E]"
 natural_disaster.8001.a.tt.flood: "Oblast [river_region.GetName] brzy zasáhne [Concept('flood','povodeň')|E]"
 natural_disaster.8002.t: "[situation.GetNameNoTooltip|U]: Pokračující pohroma"
 natural_disaster.8002.desc.earthquake: "[epicenter_county.GetName|U] právě pustoší ničivé zemětřesení. Je pravděpodobné, že celé [epicenter_county.GetTierAsNameNoTooltip|l] zůstane v troskách a jeho obyvatelé budou nuceni opustit své domovy.\n\n"
 natural_disaster.8002.desc: "Shromažďují se zásoby potřebné k pomoci obětem a obnově postižených oblastí, ale skutečný rozsah následků pohromy ještě není znám."
 natural_disaster.8002.desc.flood: "Vody v oblasti [river_region.GetName] se vylily z břehů a zaplavují okolní osady. Mnoho budov bylo opuštěno a zdá se, že veškerá úroda přijde nazmar."
 natural_disaster.8002.a: "Vážná situace."
 natural_disaster.8002.a.tt: "V oblasti [river_region.GetName] právě probíhá [Concept('flood','povodeň')|E]."
 natural_disaster.8002.a.tt.earthquake: "V [epicenter_county.Custom('CZ_LandedNameNoTier_L')] právě probíhá [Concept('earthquake','zemětřesení')|E]."
 natural_disaster.8003.t: "[situation.GetNameNoTooltip|U]: Následky pohromy"
 natural_disaster.8003.desc.earthquake: "Prchající obyvatelé rozdrcení pod padajícími budovami, trosky blokující únikové cesty, požáry a řádění banditů...\n\nTo jsou jen některé z hrůz, které museli obyvatelé [epicenter_county.Custom('CZ_LandedNameNoTier_G')] vytrpět během nedávného zemětřesení."
 natural_disaster.8003.desc.flood: "Rodiny stržené proudem, zralá úroda pohlcená vodou, domy zaplavené kalnou vodou...\n\nTakový osud postihl oblast [river_region.GetName] během nedávné povodně."
 natural_disaster.8003.desc_outro: "\n\nZáchranné práce již probíhají, ale způsobené škody mohou kraj sužovat ještě dlouhou dobu."
 natural_disaster.8003.a: "Musíme všechno znovu vybudovat."
 natural_disaster.8003.a.tt: "Oblast [river_region.GetName] zasáhla [Concept('flood','povodeň')|E]."
 natural_disaster.8003.a.tt.earthquake: "V [epicenter_county.Custom('CZ_LandedNameNoTier_L')] udeřilo [Concept('earthquake','zemětřesení')|E]."
 disaster_option_warning: "@warning_icon! #warning To by mohlo vážně ohrozit tvůj život i zdraví!#!"
 travel_to_epicenter_county: "Naplánovat [Concept('travel','cestu')|E] do [epicenter_county.Custom('CZ_LandedName_G')]"
