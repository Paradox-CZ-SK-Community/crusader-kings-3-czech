l_polish:
 natural_disaster_flavor_events.0001.t: "Slet mrchožroutů"
 natural_disaster_flavor_events.0001.desc: "Mezi troskami se shromažďují mrchožrouti, aby hodovali na ostatcích nešťastníků, kteří nedbali varování přírodních živlů. Z mrtvých těl se s praskáním trhají šlachy a odhalují hnijící maso, na které se mohou dívat jen ti nejotrlejší.\n\nMálokdo by se odvážil prohledávat tyto prokleté končiny. Tam, kde však ostatním dochází odvaha, se otevírají nové příležitosti."
 natural_disaster_flavor_events.0001.a: "Prohledat trosky a najít něco cenného."
 natural_disaster_flavor_events.0001.a.gold.toast: "Našel jsi nějaké zlato"
 natural_disaster_flavor_events.0001.a.provisions.toast: "Našel jsi nějaké jedlé zásoby"
 natural_disaster_flavor_events.0001.a.artifact.toast: "Našel jsi artefakt"
 random_misc_artifact: "Opuštěný prsten"
 random_misc_artifact_desc: "Zvláštní prsten vyhrabaný z trosek, které po sobě zanechalo řádění přírodních živlů."
 natural_disaster_flavor_events.0001.b: "Pokusit se najít nějaké přeživší."
 natural_disaster_flavor_events.0001.b.success.toast: "Podařilo se ti najít a zachránit přeživšího"
 natural_disaster_flavor_events.0001.b.failure.toast: "Tvé pátrání bylo marné"
 natural_disaster_flavor_events.0001.c: "Tady už pro nás nic není."
 natural_disaster_flavor_events.0005.t: "Noční můra zaživa"
 natural_disaster_flavor_events.0005.desc: "Ze spánku mě náhle vytrhne křik lidí, kteří se rozbíhají po táboře na všechny strany. Ještě napůl v mrákotách se pokouším zorientovat v nastalém zmatku, když mě až do morku kostí vyděsí neznámé dunění, které se v dálce ozývá čím dál blíž.\n\nAť už se blíží cokoli, musím jednat hned, než bude příliš pozdě."
 natural_disaster_flavor_events.0005.a: "Každý sám za sebe!"
 natural_disaster_flavor_events.0005.a.success.toast: "Podařilo se ti najít poměrně bezpečné místo"
 natural_disaster_flavor_events.0005.a.failure.toast: "Nepodařilo se ti včas dostat do bezpečí"
 natural_disaster_flavor_events.0005.b: "Musím odsud okamžitě pryč!"
 natural_disaster_flavor_events.0005.b.success.toast: "Podařilo se ti najít dostatečně bezpečný úkryt"
 natural_disaster_flavor_events.0005.b.failure.toast: "Tvé znalosti přírodních živlů nestačily"
 tgp_selfish_actions_character_modifier: "Jen o vlásek"
 tgp_selfish_actions_character_modifier_desc: "Této postavě se při střetu s přírodními živly vyplatila její vytrvalost."
 tgp_finding_safe_spot_character_modifier: "Bezpečné místo"
 tgp_finding_safe_spot_character_modifier_desc: "Tato postava se díky všímavosti a dobré orientaci v okolí dokázala dostat do bezpečí."
 natural_disaster_flavor_events.0010.t: "Zoufalé duše"
 natural_disaster_flavor_events.0010.desc: "Na pokraji zkázy se tísní dav zoufalých a o všechno připravených lidí. Zástupem otrhanců se valí vlny emocí a vzduch protíná pláč, nářek a zoufalý křik.\n\nJakmile spatří můj doprovod, téměř jako jeden muž se vrávoravě vydají vpřed. Polomrtví, s propadlýma očima a nataženýma rukama padají na kolena a úpěnlivě prosí o pomoc.\n\nMyslí si, že jsme jim přišli pomoci. Ale co zmohu pro takové množství lidí?"
 natural_disaster_flavor_events.0010.a: "Ujistit je, že pomoc už je na cestě."
 natural_disaster_flavor_events.0010.a.success.toast: "Podařilo se ti přesvědčit dav, že pomoc přichází"
 natural_disaster_flavor_events.0010.a.failure.toast: "Dav už odmítá dál čekat"
 natural_disaster_flavor_events.0010.b: "Těm, kdo hledají odpovědi, snad nějakou lež namluvím."
 natural_disaster_flavor_events.0010.b.success.toast: "Podařilo se ti obelhat dav"
 natural_disaster_flavor_events.0010.b.failure.toast: "Dav tvé lži prohlédl"
 natural_disaster_flavor_events.0010.c: "Ať se mě ty jejich špinavé pracky ani nedotknou!"
 natural_disaster_flavor_events.0010.c.tt: "Tvá družina bez námahy odstrčí zesláblý dav stranou."
 tgp_deceitful_overconfidence_character_modifier: "Zklamaní bezmocní"
 tgp_deceitful_overconfidence_character_modifier_desc: "Tato postava se rozhodla opustit hrstku bezmocných, kteří v těžkých časech hledali vedení."
 tgp_abandoned_population_modifier: "Opuštěné obyvatelstvo"
 tgp_abandoned_population_modifier_desc: "Obyvatelstvu této provincie vládnou lháři a zbabělci."
 natural_disaster_flavor_events.0015.t: "Nezištné činy"
 natural_disaster_flavor_events.0015.desc: "Poklidná procházka zahradou ve společnosti [spouse.Custom('CZ_FirstName_G')], [heir.Custom('CZ_FirstName_G')] a [courtier.Custom('CZ_FirstName_G')] se náhle mění v noční můru.\n\nMěstem se rozlehne pronikavý výkřik, který každému v doslechu nahání hrůzu a zoufalství. Hledám potvrzení svých obav v očích [spouse.Custom('CZ_FirstNameNoTooltip_G')], ale výraz ve tváři mi okamžitě prozradí vše, co potřebuji vědět.\n\nBez dalšího přemýšlení je mi jasné, že musíme najít bezpečnější místo, než na kterém se právě nacházíme."
 natural_disaster_flavor_events.0015.a: "Zachránit [Select_CString(spouse.IsFemale,'manželku','manžela')] [spouse.Custom('CZ_FirstNameNoTooltip_A')]."
 natural_disaster_flavor_events.0015.a.success: "Z pohromy vyvázneš bez úhony"
 natural_disaster_flavor_events.0015.a.failure: "Utrpěná zranění"
 natural_disaster_flavor_events.0015.b: "Pomoci [Select_CString(heir.IsFemale,'dědičce','dědici')] [heir.Custom('CZ_FirstNameNoTooltip_D')]."
 natural_disaster_flavor_events.0015.b.success: "$natural_disaster_flavor_events.0015.a.success$"
 natural_disaster_flavor_events.0015.b.failure: "$natural_disaster_flavor_events.0015.a.failure$"
 natural_disaster_flavor_events.0015.c: "Pomoci [Select_CString(courtier.IsFemale,'dvořance','dvořanovi')] [courtier.Custom('CZ_FirstNameNoTooltip_D')]."
 natural_disaster_flavor_events.0015.c.success: "$natural_disaster_flavor_events.0015.a.success$"
 natural_disaster_flavor_events.0015.c.failure: "$natural_disaster_flavor_events.0015.a.failure$"
 natural_disaster_flavor_events.0015.d: "Zachránit #EMP vlastní kůži.#!" 
