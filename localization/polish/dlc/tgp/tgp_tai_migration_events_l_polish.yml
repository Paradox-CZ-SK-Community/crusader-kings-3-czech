l_polish:

 tgp_tai_migration_event.1000.t: "Útěk Tajců"
 tgp_tai_migration_event.1000.desc: "Na dnešním zasedání rady se dozvídám o hromadném příchodu tajských osadníků. [migration_leader.GetName], [Select_CString(migration_leader.IsFemale,'starší zástupkyně','starší zástupce')] jejich komunity, nyní stojí přede mnou a pokorně přednáší svou žádost.\n\n„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], kdysi jsme byli poddanými [migration_origin_holder.Custom('CZ_Name_G')], nyní však hledáme vedení a nový domov. Mluvím jménem mnoha rodů a tisíců lidí, kteří doufají, že u vás naleznou útočiště. Chraňte nás před nebezpečím a dejte nám možnost být užitečnými služebníky, kteří si zaslouží vaši štědrost.“\n\nO jejich osudu nyní rozhodnou má slova."
 tgp_tai_migration_event.1000.a: "Přijímám vás všechny, ne jako hosty, nýbrž jako své poddané."
 tgp_tai_migration_event.1000.b: "V mém [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] smějí žít jen ti nejschopnější z vás."
 tgp_tai_migration_event.1000.c: "Více lidí znamená více problémů. Běžte žebrat o přijetí jinam."
 tgp_tai_migration_event_1000.c_shooed_immigrants_tt: "Přistěhovalci mohou v blízké budoucnosti požádat o útočiště jiného panovníka v okolí."
 tgp_tai_migration_skilled_development_county_modifier: "Útěk řemeslníků"
 tgp_tai_migration_migration_happened_county_modifier: "Tajští osadníci"
 tgp_tai_migration_migration_happened_character_modifier: "Přijetí tisíců přistěhovalců"
 tgp_tai_migration_migration_rejected_character_modifier: "Odmítnutí přistěhovalců"
 tgp_tai_migration_event.2000.t: "Tajský talent"
 tgp_tai_migration_event.2000.desc: "Přede mnou stojí [Select_CString(migrant_skilled_character.IsFemale,'zručná žena','zručný muž')], [Select_CString(migrant_skilled_character.IsFemale,'která tvrdí','který tvrdí')], že pochází z [migrant_skilled_character.GetCulture.Custom('CZ_AdjectiveNoTooltip_yych')|l] zemí, a nabízí mi své odborné služby. Způsob vystupování připomíná nedávné zprávy o hromadném útěku příslušníků tohoto lidu.\n\n"
 tgp_tai_migration_event.2000.wet_nurse.desc: "„Vaše Svatosti, mé jméno je [migrant_skilled_character.GetName]. Mám bohaté zkušenosti s péčí o děti a nabízím vám své služby. Zdraví mi slouží, dostává se mi vydatné stravy a dobře rozumím potřebám nemluvňat. Dovolte mi pomoci vašemu rodu vzkvétat.“"
 tgp_tai_migration_event.2000.champion.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], v rodné zemi mě znají pod jménem [migrant_skilled_character.GetName]. Jsem [Select_CString(migrant_skilled_character.IsFemale,'zapřisáhlá bojovnice','zapřisáhlý bojovník')] a [Select_CString(migrant_skilled_character.IsFemale,'vítězka','vítěz')] mnoha turnajů. Má paže je pevná a o mé věrnosti nemůže být pochyb. Dovolte mi stát se vaším šampionem.“"
 tgp_tai_migration_event.2000.travel_leader.desc: "„[ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')|U], mé jméno je [migrant_skilled_character.GetName] a mám za sebou dlouhé cesty napříč pouštěmi. Hvězdy jsou mou mapou a větry mými spojenci. Pod mým vedením se žádná karavana neztratí a žádná stezka nepředstavuje překážku.“"
 tgp_tai_migration_event.2000.master_of_hunt.desc: "„Lov mám v krvi a divočina mě zocelila. Znám pach každé šelmy i ticho každého lesa. Stopy kopyt dokážu číst jako nikdo jiný. Co na to říkáte, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]?“"
 tgp_tai_migration_event.2000.court_physician.desc: "„Znám léčivé masti popsané ve starobylých knihách a i v těch nejtěžších chvílích si dokážu zachovat pevnou ruku. Nenajdete nikoho povolanějšího, kdo by dokázal ulevit vašemu nebeskému tělu, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]. Říkají mi [migrant_skilled_character.GetName].“"
 tgp_tai_migration_event.2000.antiquarian.desc: "„Mé oči spatřily bájné divy a mé ruce se dotýkaly pozůstatků dávných říší. Dovolte mi sloužit vám, aby moudrost předků mohla obohatit váš dvůr.“"
 tgp_tai_migration_event.2000.court_tutor.desc: "„Pod mým vedením vyrostla řada vynikajících válečníků i státníků, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]. Dovolíte-li mi to, i vaši potomci dosáhnou velikosti.“"
 tgp_tai_migration_event.2000.end.desc: "\n\nPříchozí zjevně zoufale touží po útočišti, nejspíš kvůli okolnostem, které vedly až sem. Ve svém řemesle se však očividně vyzná. Mám těchto schopností využít?"
 tgp_tai_migration_event.2000.a: "Tvé služby by se mi mohly hodit."
 tgp_tai_migration_event.2000.b: "Zatím ne, ale můžeš u nás zůstat."
 tgp_tai_migration_event.2000.b.success: "[migrant_skilled_character.GetNameNoTooltip|U] se připojuje k tvému dvoru"
 tgp_tai_migration_event.2000.b.failure: "[migrant_skilled_character.GetNameNoTooltip|U] odmítá tvou nabídku"
 tgp_tai_migration_event.2000.c: "Musím odmítnout."
 tgp_tai_migration_event.3000.t: "Nabídka muže s rodinou"
 tgp_tai_migration_event.3000.desc: "Do mých síní přichází sebevědomý cizinec, který mi nabízí své schopnosti při správě země.\n\nPo překvapivě upřímném pozdravu, prostém obvyklé venkovské neotesanosti, se rozpovídá o strastiplné cestě své rodiny do mých zemí. Nakonec dospěje k odvážnému návrhu.\n\n„...lapkové a plenitelé, povídám vám, [ROOT.Char.Custom('CZ_TitleAsNameNoTooltip_V')]! Z mého vyrabovaného majetku mi nezbylo téměř nic. Zůstaly mi však osvědčené schopnosti, bystrý úsudek potřebný ke správě země, věrnost a rodina, která zoufale potřebuje vaši pomoc. Já i moji potomci vám budeme sloužit, dokud nás sami neuznáte za nehodné.“"
 tgp_tai_migration_event.3000.a: "Vyhovím tvé žádosti, pokud mi zachováš věrnost."
 tgp_tai_migration_event.3000.b: "Taková výměna mi nepřipadá spravedlivá."
 tgp_tai_migration_event.4000.t: "Tajská rodina"
 tgp_tai_migration_event.4000.desc: "Mé stráže přivádějí do síně zuboženou rodinu cizinců ze severních zemí.\n\nPo dlouhém a úpěnlivém žadonění mi hlava rodiny pohlédne přímo do očí a nabídne vše, co má, jen aby mohla čistit podlahy mého paláce výměnou za útočiště pod mými mocnými ochrannými křídly. Z vyprávění vyplývá, že do našich zemí proudí mnoho dalších lidí jeho původu v naději, že zde naleznou nové ochránce."
 tgp_tai_migration_event.4000.a: "V těchto těžkých časech vám poskytnu útočiště."
 tgp_tai_migration_event.4000.b: "Můj dvůr pro vaši rodinu nemá využití."

