l_polish:
 tgp_tai_migration_event.1000.t: "Útěk Tai" # todo: NEW TRANSLATION
 tgp_tai_migration_event.1000.desc: "Během dnešního zasedání rady jsem byl informován o masové migraci osadníků Tai. [migration_leader.GetName], starší zástupce jejich komunity, nyní stojí přede mnou, zatímco [migration_leader.GetSheHe] pokorně předkládá [migration_leader.GetHerHis] případ.\n\n\"Můj [ROOT.Char.GetTitleAsNameNoTooltip], hledáme vedení a nový domov jako bývalí poddaní [migration_origin_holder.GetName]. Mluvím za mnoho klanů a tisíců, kteří touží po útočišti. Chraňte nás před škodou a dejte nám účel, abychom mohli být užitečnými služebníky hodnými vaší štědrosti.\"\n\nJejich osud je na mých rtech." # todo: NEW TRANSLATION
 tgp_tai_migration_event.1000.a: "Vítám vás všechny, ne jako hosty, ale jako své poddané." # todo: NEW TRANSLATION
 tgp_tai_migration_event.1000.b: "Pouze zdatní z vás budou sídlit v mém [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]." # todo: NEW TRANSLATION
 tgp_tai_migration_event.1000.c: "Více lidí znamená více problémů; běžte prosit jinde." # todo: NEW TRANSLATION
 tgp_tai_migration_event_1000.c_shooed_immigrants_tt: "Imigranti mohou v blízké budoucnosti žádat o útočiště u jiného sousedního vladaře." # todo: NEW TRANSLATION
 tgp_tai_migration_skilled_development_county_modifier: "Útěk řemeslníků" # todo: NEW TRANSLATION
 tgp_tai_migration_migration_happened_county_modifier: "Osadníci Tai" # todo: NEW TRANSLATION
 tgp_tai_migration_migration_happened_character_modifier: "Přijal nesčetné množství imigrantů" # todo: NEW TRANSLATION
 tgp_tai_migration_migration_rejected_character_modifier: "Odmítl imigranty" # todo: NEW TRANSLATION
 tgp_tai_migration_event.2000.t: "Nadaný Tai" # todo: NEW TRANSLATION
 tgp_tai_migration_event.2000.desc: "Přede mnou stojí zručný [migrant_skilled_character.GetWomanMan], který se hlásí k zemím [migrant_skilled_character.GetCulture.GetNameNoTooltip] a hledá zaměstnání jako znalý odborník. [migrant_skilled_character.GetHerHis|U] chování se zdá odrážet nedávné zprávy o útěku jejich lidu.\n\n" # todo: NEW TRANSLATION
 tgp_tai_migration_event.2000.wet_nurse.desc: "\"Vaše Veličenstvo, jsem [migrant_skilled_character.GetName], zkušená opatrovnice připravená sloužit. Jsem zdravá, dobře živená a rozumím potřebám kojenců. Dovolte mi pomoci vašemu rodu vzkvétat.\"" # todo: NEW TRANSLATION
 tgp_tai_migration_event.2000.champion.desc: "\"Mocný pane, v mé domovině mě znají jako [migrant_skilled_character.GetName], přísahavý válečník a vítěz mnoha turnajů. Má paže je jistá a moje věrnost nezpochybnitelná. Nechte mě být vaším šampionem.\"" # todo: NEW TRANSLATION
 tgp_tai_migration_event.2000.travel_leader.desc: "\"Můj [ROOT.Char.GetTitleAsNameNoTooltip], jsem [migrant_skilled_character.GetName], který procestoval pouště, hvězdy mi slouží jako mapa a vítr jako spojenec. Pod mým vedením žádná karavana nezabloudí a žádná stezka nepředstavuje potíže.\"" # todo: NEW TRANSLATION
 tgp_tai_migration_event.2000.master_of_hunt.desc: "\"Rodu k honu, zkrocen divočinou, znám pach každého zvířete i ticho každého lesa. Čtu stopu kopýtek jako nikdo jiný. Co říkáte, můj [ROOT.Char.GetTitleAsNameNoTooltip]?\"" # todo: NEW TRANSLATION
 tgp_tai_migration_event.2000.court_physician.desc: "\"Masti z dávných tomů a zručnost provádět zákroky pod tlakem — jsem jediný/á [migrant_skilled_character.GetWomanMan], kterého/kterou potřebujete k ošetření vašeho těla, můj [ROOT.Char.GetTitleAsNameNoTooltip]. Říkají mi [migrant_skilled_character.GetName].\"" # todo: NEW TRANSLATION
 tgp_tai_migration_event.2000.antiquarian.desc: "\"Mé oči viděly mýty a mé ruce se dotkly starověkých říší. Nechte mě tu, aby moudrost dávných dosáhla vašeho dvora.\"" # todo: NEW TRANSLATION
 tgp_tai_migration_event.2000.court_tutor.desc: "\"Ovlivnil/a jsem mnoho válečníků a státníků, můj [ROOT.Char.GetTitleAsNameNoTooltip]. I vaše potomstvo také dosáhne velikosti pod mým vedením, pokud dovolíte.\"" # todo: NEW TRANSLATION
 tgp_tai_migration_event.2000.end.desc: "\n\n[migrant_skilled_character.GetSheHe|U] vypadá zoufale kvůli útočišti, pravděpodobně z důvodů, které [migrant_skilled_character.GetHerHim] sem přivedly, ale jasně ovládá [migrant_skilled_character.GetHerHis] řemeslo. Mám využít [migrant_skilled_character.GetHerHis] dovednosti?" # todo: NEW TRANSLATION
 tgp_tai_migration_event.2000.a: "Možná budu potřebovat vaše služby." # todo: NEW TRANSLATION
 tgp_tai_migration_event.2000.b: "Zatím ne, ale zůstaňte u nás." # todo: NEW TRANSLATION
 tgp_tai_migration_event.2000.b.success: "[migrant_skilled_character.GetNameNoTooltip] se připojuje k vašemu dvoru" # todo: NEW TRANSLATION
 tgp_tai_migration_event.2000.b.failure: "[migrant_skilled_character.GetNameNoTooltip] odmítá vaši nabídku" # todo: NEW TRANSLATION
 tgp_tai_migration_event.2000.c: "Musím odmítnout." # todo: NEW TRANSLATION
 tgp_tai_migration_event.3000.t: "Návrh hlavy rodiny" # todo: NEW TRANSLATION
 tgp_tai_migration_event.3000.desc: "Poctivý cizinec přistupuje k mým síním s pozoruhodným sebevědomím, aby učinil správní nabídku.\n\nPo překvapivě upřímném pozdravu, neobvyklém oproti typickému rustikálnímu chování, a podrobném vyprávění o smutné cestě jeho rodiny do mých zemí, dospívá k odvážnému závěru.\n\n\"...lupičové a drancovníci, říkám vám, můj [ROOT.Char.GetTitleAsNameNoTooltip]. Co mi zbylo z vyrabovaných věcí, je prokázaná dovednost, bystré vnímání k dohledu, věrnost a rodina, která potřebuje vaši pomoc. Já a moje krev budeme vašimi služebníky, dokud nás neuznáte za nehodné.\"" # todo: NEW TRANSLATION
 tgp_tai_migration_event.3000.a: "Tvé přání je vyhověno, pokud zůstaneš věrný." # todo: NEW TRANSLATION
 tgp_tai_migration_event.3000.b: "To mi nepřipadá jako spravedlivá výměna." # todo: NEW TRANSLATION
 tgp_tai_migration_event.4000.t: "Rodina Tai" # todo: NEW TRANSLATION
 tgp_tai_migration_event.4000.desc: "Mí strážci přivedli do síně zuboženou rodinu cizinců ze severních krajů.\n\nPo dlouhém žebrání se hlava rodiny zadíval do mé duše a nabídl vše, co vlastní, aby vyčistil podlahy mého paláce výměnou za přístřeší pod mými mocnými křídly. Podle jeho příběhu se zdá, že mnozí z jeho druhu se stěhují do našich zemí v naději na nové ochránce." # todo: NEW TRANSLATION
 tgp_tai_migration_event.4000.a: "Poskytnu vám přístřeší v těchto těžkých časech." # todo: NEW TRANSLATION
 tgp_tai_migration_event.4000.b: "Můj dvůr vaší rodině nepomůže." # todo: NEW TRANSLATION
