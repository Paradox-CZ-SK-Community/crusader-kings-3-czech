l_polish:
 tgp_travel_danger_events.0001.t: "Život mezi troskami"
 tgp_travel_danger_events.0001.intro: "Při cestě přes [CZProvName(ROOT.Char.GetCurrentLocation,'A')] všude vidím následky přírodní pohromy – [disaster_situation.GetType.GetNameNoTooltip|l]."
 tgp_travel_danger_events.0001.flood: "Břehy řeky jsou poseté naplavenými troskami a domy plují po proudu jako listí na hladině. Celou vesnici pohltil dravý proud."
 tgp_travel_danger_events.0001.earthquake: "Kdysi úrodná krajina a vesnice plná života nyní leží v troskách a tichu. Jako by je pohltila samotná země."
 tgp_travel_danger_events.0001.desc: "\n\nKdyž dorazíme na okraj zpustošeného města, spatřím mezi troskami osamělé dítě. [Select_CString(peasant_character_child.IsFemale,'Dívka','Chlapec')] si mě ani nevšimne a zoufale se pokouší znovu postavit něco, co kdysi zřejmě bývalo selským stavením."
 tgp_travel_danger_events.0001.a: "Moji muži odklidí trosky."
 tgp_travel_danger_events.0001.b: "Vezmu [Select_CString(peasant_character_child.IsFemale,'ji','ho')] pod svá ochranná křídla."
 tgp_travel_danger_events.0001.c: "Na tohle nemám čas!"
 impressed_by_kindness: "Ohromen laskavosti"
