l_polish:
 tgp_travel_danger_events.0001.t: "Život mezi ruinami" # todo: NEW TRANSLATION
 tgp_travel_danger_events.0001.intro: "Cestou přes [ROOT.Char.GetCurrentLocation.GetName] vidím dopad [disaster_situation.GetType.GetNameNoTooltip|l] všude." # todo: NEW TRANSLATION
 tgp_travel_danger_events.0001.flood: "Úlomky pokrývají břehy řeky, domy plují po proudu jako listy. Celá vesnice byla pohlcena zuřivým proudem." # todo: NEW TRANSLATION
 tgp_travel_danger_events.0001.earthquake: "Dříve úrodná půda a živá vesnice leží tiše v zmatku a sutinách, pohlceny samotnou zemí." # todo: NEW TRANSLATION
 tgp_travel_danger_events.0001.desc: "\n\nKdyž dorazíme na okraj zničeného města, spatřím osamělé dítě v sutinách. [peasant_character_child.GetSheHe|U] si mě nevšimne, protože [peasant_character_child.GetSheHe] zoufale snaží znovu postavit to, co vypadá jako dřívější stavení." # todo: NEW TRANSLATION
 tgp_travel_danger_events.0001.a: "Moji muži uklidí sutiny." # todo: NEW TRANSLATION
 tgp_travel_danger_events.0001.b: "Vezmu [peasant_character_child.GetHerHim] pod svou ochranu." # todo: NEW TRANSLATION
 tgp_travel_danger_events.0001.c: "Na tohle nemám čas!" # todo: NEW TRANSLATION
 impressed_by_kindness: "Ohromen laskavostí" # todo: NEW TRANSLATION
