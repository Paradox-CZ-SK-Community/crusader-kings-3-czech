 tribute_mission.1006.t: "$tribute_mission_header$ Pečeť investitury"
 tribute_mission.1006.desc: "[tributary_scope.GetTitledFirstName|U] zůstává v hluboké pokloně už nepříjemně dlouho. Čeká ode mě ještě něco?\n\nNa okraji přeplněného dvora zahlédnu další známou tvář. [Select_CString(scribe_character.IsFemale,'Má','Můj')|U] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scribe_character'))|l], [scribe_character.GetShortUIName], tu nehnutě čeká. Právě tato osoba vyrábí mé úřední pečetě.\n\nNastal čas, abych [tributary_scope.Custom('CZ_TitledFirstNameNoTooltip_D')] [Select_CString(ROOT.Char.IsFemale,'udělila','udělil')|l] oficiální uznání Syna nebes?"
 tribute_mission.1006.grant: "Tuto dohodu stvrdíme pro budoucí věky."
 tribute_mission.1006.grant.tt: "[scribe_character.GetShortUIName|U] [Select_CString(scribe_character.IsLocalPlayer,'vyrobíš','vyrobí')|l] [Concept('seal_of_investiture','pečeť investitury')|E] pro [tributary_scope.Custom('CZ_TitledFirstName_A')]"
 tribute_mission.1006.decline.no_money: "Císařská pokladnice takový výdaj neunese."
 tribute_mission.1006.decline.dont_wanna: "Takovou poctu si nezaslouží."
 refused_seal_of_investiture_opinion: "Odmítnutí udělit [Concept('seal_of_investiture','pečeť investitury')|E]"
 tribute_mission.1007.t: "$tribute_mission_header$ Pečeť investitury"
 tribute_mission.1007.desc: "Po napjatém tichu [receiving_character.GetTitledFirstName] slavnostně povstane. Na znamení vystoupí z davu císařský písař [scribe_character.GetShortUIName] a nese pečlivě zhotovenou pečeť — $game_concept_seal_of_investiture$. A na ní mé jméno!\n\n[receiving_character.GetTitledFirstName|U] ji opatrně převezme a požádá mě, abych [Select_CString(ROOT.Char.IsFemale,'povstala','povstal')|l]. Přítomní vše napjatě sledují.\n\nZatímco přijímám požehnání Syna nebes, napadne mě: jaké nové dveře mi tato vzácná úmluva asi otevře?"
 tribute_mission.1007.a: "Tohle mění všechno."
 tribute_mission.1008.t: "$tribute_mission_header$ Pravidelný tribut"
 tribute_mission.1008.desc: "Během slavnostní výměny darů cítím, jak u dvora roste očekávání. Jako by některá slova dosud nezazněla. Nikdo nic neřekne přímo, ale pomalu mi dochází, co se ode mě čeká.\n\n[receiving_character.GetTitledFirstNameNoTooltip|U] si přeje můj slib, že dary budou proudit i nadále, výměnou za přízeň země [receiving_character.GetLiege.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip].\n\nStále mohu nabídku se ctí odmítnout a zachovat si nezávislost. Se vším, co k tomu patří."
 tribute_mission.1008.a: "„... a země [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] by samozřejmě posílala dary do [CZProvNameNoTooltip(receiving_character.GetLiege.GetCapitalLocation,'G')] pravidelně.“"
 tribute_mission.1008.b: "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip|U] koleno neohne."
